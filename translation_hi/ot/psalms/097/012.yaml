base_translation:
  language: en
  yaml_path: translation/ot/psalms/097/012.yaml
  text: Rejoice in Yahweh[a], you righteous ones[b], and give thanks at the remembrance of his holiness.
translation:
  language: hi
  text: हे धर्मी लोगो, याहवे में आनन्दित हो, और उसकी पवित्रता के स्मरण[a] पर धन्यवाद दो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या: “उसकी पवित्रता के उल्लेख पर धन्यवाद दो।” इब्रानी शब्द זֵכֶר का अर्थ स्मरण, स्मारक या उल्लेख हो सकता है। कुछ अनुवाद समान भजनात्मक अभिव्यक्तियों के प्रभाव से “उसके पवित्र नाम” कहते हैं, लेकिन यहाँ इब्रानी पाठ में शाब्दिक रूप से “उसकी पवित्रता” है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׂמְחוּ
  choice: आनन्दित हो
  rationale: बहुवचन आज्ञार्थक रूप है, जो प्रसन्न होकर उल्लास मनाने का आह्वान करता है।
- source_word: צַדִּיקִים
  choice: हे धर्मियो
  rationale: बहुवचन में सीधे सम्बोधित उस समूह को दर्शाता है जिसकी पहचान धार्मिकता से है; हिन्दी में सम्बोधन स्वाभाविक और स्पष्ट है।
- source_word: בַּיהוָה
  choice: यहवे में
  rationale: ב यहाँ आनन्द के आधार अथवा केन्द्र को व्यक्त करता है; יהוה को उसके व्यक्तिगत वाचा-नाम के रूप में लिप्यन्तरित किया गया है।
- source_word: וְהוֹדוּ
  choice: और ... धन्यवाद करो
  rationale: ידה का हिफ़ील बहुवचन आज्ञार्थक रूप इस स्तुति-सन्दर्भ में धन्यवाद देने का भाव रखता है।
- source_word: לְזֵכֶר
  choice: स्मरण पर
  rationale: זֵכֶר का अर्थ स्मरण, स्मारक या उल्लेख हो सकता है। 'स्मरण पर' मूल की संक्षिप्तता और सम्भावित अर्थ-व्याप्ति को पर्याप्त रूप से बनाए रखता है।
- source_word: קָדְשׁוֹ
  choice: उसकी पवित्रता
  rationale: इब्रानी में शाब्दिक रूप से 'उसकी पवित्रता' है; यहाँ 'नाम' के लिए कोई शब्द नहीं है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: यहवे
  alternative: प्रभु / यहोवा
  rationale: मूल पाठ में चतुरक्षरी व्यक्तिगत नाम प्रत्यक्ष रूप से है; उसका लिप्यन्तरण वाचा-नाम को किसी उपाधि में बदले बिना सुरक्षित रखता है।
- issue: לְזֵכֶר קָדְשׁוֹ में 'नाम' जोड़ना
  choice: उसकी पवित्रता के स्मरण पर
  alternative: उसके पवित्र नाम का धन्यवाद करो
  rationale: कुछ समान भजन-पदों से प्रभावित परम्परागत अनुवाद 'नाम' जोड़ते हैं, पर इस पद में שֵׁם नहीं है। इसलिए मुख्य पाठ मूल के 'उसकी पवित्रता' को सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज और सामूहिक उपासना के अनुकूल शैली। 'हे धर्मियो' सीधे सम्बोधन को स्पष्ट करता है; 'पवित्रता' मूल पाठ की असामान्य किन्तु महत्वपूर्ण अभिव्यक्ति को बनाए रखती है।
