  text: The heavens declare his righteousness[a], and all the peoples see his glory.
translation:
  language: hi
  text: आकाश उसकी धार्मिकता[a] की घोषणा करता है, और सभी जातियाँ उसकी महिमा देखती हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उसका न्याय।” इब्रानी शब्द धार्मिकता और न्याय—दोनों अर्थ दे सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הִגִּידוּ
  choice: घोषणा करता है
  rationale: נגד के हिफ़ील रूप का अर्थ किसी बात को प्रकट या घोषित करना है। हिन्दी में ‘घोषणा करता है’ काव्यात्मक उद्घोषणा को स्वाभाविक ढंग से व्यक्त करता है; बहुवचन रूप ‘आकाश’ हिन्दी में सामान्यतः एकवचन क्रिया लेता है।
- source_word: הַשָּׁמַיִם
  choice: आकाश
  rationale: שָׁמַיִם यहाँ सृष्टि के ऊर्ध्व क्षेत्र को दर्शाता है। आधुनिक हिन्दी में ‘आकाश’ स्वाभाविक, गरिमापूर्ण और काव्यात्मक है तथा इस प्रसंग की ब्रह्मांडीय साक्षी की छवि बनाए रखता है।
- source_word: צִדְקוֹ
  choice: उसकी धार्मिकता
  rationale: צֶדֶק का अर्थ नैतिक सहीपन और न्याय—दोनों हो सकता है। मुख्य पाठ में प्रचलित बाइबिलीय पद ‘धार्मिकता’ रखा गया है और न्याय वाला अर्थ पादटिप्पणी में सुरक्षित है।
- source_word: וְרָאוּ
  choice: और … देखती हैं
  rationale: काव्य में पूर्ण क्रिया को जीवंत वर्तमान के रूप में समझा जा सकता है। वर्तमान काल इस सार्वभौमिक दृश्य को प्रत्यक्ष और सतत रूप देता है।
- source_word: כָל הָעַמִּים
  choice: सभी जातियाँ
  rationale: עַמִּים विभिन्न जनसमुदायों को सूचित करता है। ‘सभी जातियाँ’ हिन्दी बाइबिलीय शैली में स्वाभाविक है और आधुनिक राजनीतिक राष्ट्र-राज्यों तक अर्थ को सीमित नहीं करता।
- source_word: כְּבוֹדוֹ
  choice: उसकी महिमा
  rationale: परमेश्वर के संदर्भ में כָּבוֹד उसकी प्रकट गरिमा और प्रताप को दर्शाता है। ‘महिमा’ हिन्दी में इसका स्थापित और व्यापक समतुल्य है।
theological_decisions:
- issue: ईश्वरीय गुण צִדְקוֹ का अनुवाद
  choice: उसकी धार्मिकता
  alternative: उसका न्याय
  rationale: इब्रानी शब्द परमेश्वर के नैतिक सहीपन और उसके न्यायपूर्ण शासन या कार्य—दोनों को समेट सकता है। मुख्य पाठ में ‘धार्मिकता’ रखा गया है, जबकि वास्तविक न्यायिक अर्थ को पादटिप्पणी में दिया गया है ताकि अर्थगत और धर्मवैचारिक तनाव मिटे नहीं।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और काव्यात्मक रखी गई है। ‘आकाश’ के साथ हिन्दी के स्वाभाविक व्याकरण के अनुसार एकवचन क्रिया और ‘जातियाँ’ के साथ स्त्रीलिंग बहुवचन क्रिया प्रयुक्त हुई है।
