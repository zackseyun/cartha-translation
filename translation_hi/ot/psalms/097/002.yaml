source:
  edition: WLC
  text: עָנָ֣ן וַ/עֲרָפֶ֣ל סְבִיבָ֑י/ו צֶ֥דֶק וּ֝/מִשְׁפָּ֗ט מְכ֣וֹן כִּסְאֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/097/002.yaml
  text: Clouds and thick darkness are around him[a]; righteousness and justice are the foundation of his throne.
translation:
  language: hi
  text: बादल और घोर अन्धकार उसके चारों ओर हैं[a]; धार्मिकता और न्याय उसके सिंहासन की नींव हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “बादल और धुँधलका उसे घेरे हुए हैं।”
    reason: lexical_alternative
lexical_decisions:
- source_word: עָנָן
  choice: बादल
  rationale: इब्रानी संज्ञा एकवचन रूप में है, पर यहाँ सामूहिक अर्थ रख सकती है। हिन्दी में ‘बादल’ रूप एकवचन और बहुवचन दोनों के लिए स्वाभाविक है और काव्यात्मक चित्र बनाए रखता है।
- source_word: וַעֲרָפֶל
  choice: और घोर अन्धकार
  rationale: עֲרָפֶל घने अन्धकार, धुँधलके या गहन घटा का बोध कराता है। ‘घोर अन्धकार’ ईश-प्रकटन में छिपाव और भयप्रद गहनता को बिना अमूर्त किए व्यक्त करता है।
- source_word: סְבִיבָיו
  choice: उसके चारों ओर हैं
  rationale: यह पद शाब्दिक रूप से ‘उसके चारों ओर’ है; हिन्दी में स्वाभाविक निर्वाचक वाक्य के लिए ‘हैं’ जोड़ा गया है।
- source_word: צֶדֶק
  choice: धार्मिकता
  rationale: מִשְׁפָּט के साथ युग्म में यह नैतिक सच्चाई और उचित आचरण का बोध देता है। ‘धार्मिकता’ दोनों पदों के बीच का अर्थभेद बनाए रखती है।
- source_word: וּמִשְׁפָּט
  choice: और न्याय
  rationale: מִשְׁפָּט न्याय, न्यायिक निर्णय या विधिसंगत व्यवस्था का बोध करा सकता है। सिंहासन के प्रसंग में ‘न्याय’ सर्वाधिक स्वाभाविक है।
- source_word: מְכוֹן
  choice: नींव
  rationale: यह शब्द स्थिर आधार या स्थापित स्थान को दर्शाता है। सिंहासन के रूपक में ‘नींव’ संक्षिप्त, स्पष्ट और स्वाभाविक है।
- source_word: כִּסְאוֹ
  choice: उसके सिंहासन की
  rationale: यह रूप ‘उसका सिंहासन’ अर्थ देता है और מְכוֹן के साथ सम्बन्धसूचक संरचना ‘उसके सिंहासन की नींव’ बनाता है।
theological_decisions:
- issue: ईश्वर के प्रकट होने में उसका छिपा रहना
  choice: बादल और घोर अन्धकार की मूर्त छवि को ज्यों का त्यों बनाए रखना
  alternative: इसे ‘महिमा’ या ‘रहस्य’ जैसे अमूर्त भावों के रूप में स्पष्ट करना
  rationale: पद ईश्वर के राजत्व को ऐसे ईश-प्रकटन के चित्र में रखता है जिसमें वह प्रकट भी है और आवृत भी। अनुवाद इस धार्मिक तनाव को हल किए बिना बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण काव्यात्मक गद्य। ‘घोर अन्धकार’ मूल की गहन ईश-प्रकटनात्मक छवि रखता है; ‘नींव’ सामान्य पाठक के लिए स्पष्ट और सिंहासन-रूपक में स्वाभाविक है।
