  text: שָׁמְעָ֬ה וַ/תִּשְׂמַ֨ח צִיּ֗וֹן וַ֭/תָּגֵלְנָה בְּנ֣וֹת יְהוּדָ֑ה לְמַ֖עַן מִשְׁפָּטֶ֣י/ךָ יְהוָֽה׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/097/008.yaml
  text: Zion heard and rejoiced[a], and the daughters of Judah exulted because of your judgments, O Yahweh.
translation:
  language: hi
  text: सिय्योन ने सुना और प्रसन्न हुआ; यहूदा की बेटियाँ[a] उल्लसित हुईं, हे यहवे, तेरे न्यायों के कारण।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘यहूदा के नगर’ अथवा ‘यहूदा की बस्तियाँ’; इब्रानी में अक्षरशः ‘यहूदा की बेटियाँ’ है—यह काव्यात्मक अभिव्यक्ति यहूदा के आसपास के समुदायों के लिए प्रयुक्त हो सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁמְעָה
  choice: ने सुना
  rationale: यह שׁמע का काल पूर्ण, स्त्रीलिंग एकवचन रूप है और इसका कर्ता ‘सिय्योन’ है; काव्यात्मक घटनाक्रम में सामान्य भूतकाल स्वाभाविक है।
- source_word: וַתִּשְׂמַח
  choice: और आनन्दित हुआ
  rationale: שׂמח प्रसन्न होने या आनन्द मनाने का भाव देता है। हिन्दी में ‘सिय्योन’ के प्रचलित व्याकरणिक पुल्लिंग के अनुसार क्रिया पुल्लिंग रखी गई है, यद्यपि इब्रानी में नगर-नाम स्त्रीलिंग है।
- source_word: צִיּוֹן
  choice: सिय्योन
  rationale: स्थान के विशिष्ट नाम को प्रचलित हिन्दी बाइबलीय लिप्यंतरण में रखा गया है; पाठ सीधे सिय्योन कहता है, भले ही यह यरूशलेम या वहाँ केंद्रित समुदाय का लाक्षणिक संकेत हो सकता है।
- source_word: וַתָּגֵלְנָה
  choice: मगन हुईं
  rationale: גיל उल्लासपूर्ण आनन्द व्यक्त करता है। ‘मगन हुईं’ पहले प्रयुक्त ‘आनन्दित हुआ’ से शब्दगत भेद रखते हुए प्रबल हर्ष व्यक्त करता है।
- source_word: בְּנוֹת יְהוּדָה
  choice: यहूदा की बेटियाँ
  rationale: यह पदबंध अक्षरशः ‘यहूदा की बेटियाँ’ है। काव्य में इसका अर्थ यहूदा के अधीन नगर या बस्तियाँ भी हो सकता है; मुख्य पाठ काव्यात्मक अभिव्यक्ति रखता है और पादटिप्पणी वैकल्पिक भौगोलिक अर्थ बताती है।
- source_word: לְמַעַן
  choice: क्योंकि
  rationale: यहाँ पद आनन्द का कारण प्रस्तुत करता है; ‘क्योंकि’ आधुनिक हिन्दी में इस कारणात्मक संबंध को सहज रूप से व्यक्त करता है।
- source_word: מִשְׁפָּטֶיךָ
  choice: तेरे न्याय के निर्णय
  rationale: מִשְׁפָּטֶיךָ न्याय, न्यायिक निर्णय या न्याय के कार्यों को सूचित कर सकता है। ‘न्याय के निर्णय’ न्यायपूर्ण न्यायिक कृत्यों का भाव रखता है और केवल विधियों के अर्थ तक सीमित नहीं करता।
- source_word: יְהוָה
  choice: हे यहवे
  rationale: चतुरक्षरीय दिव्य नाम को उपाधि से बदलने के बजाय हिन्दी में उसके लिप्यंतरण ‘यहवे’ से व्यक्त किया गया है; संबोधन के कारण ‘हे’ जोड़ा गया है।
theological_decisions:
- issue: दिव्य नाम יְהוָה का अनुवाद
  choice: हे यहवे
  alternative: हे प्रभु
  rationale: मूल पाठ व्यक्तिगत दिव्य नाम का प्रयोग करता है। उसे उपाधि ‘प्रभु’ से प्रतिस्थापित न करके नाम के रूप में रखा गया है।
- issue: בְּנוֹת יְהוּדָה को अक्षरशः या भौगोलिक मुहावरे के रूप में समझना
  choice: मुख्य पाठ में ‘यहूदा की बेटियाँ’
  alternative: यहूदा के नगर / यहूदा की बस्तियाँ
  rationale: इब्रानी अभिव्यक्ति अक्षरशः ‘यहूदा की बेटियाँ’ है, पर काव्य में आश्रित नगरों या समुदायों का अर्थ सम्भव है। मुख्य पाठ मूल रूपक और अस्पष्टता बचाता है; पादटिप्पणी भौगोलिक अर्थ देती है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी; इब्रानी काव्य की समानांतरता तथा ‘सिय्योन’ और ‘यहूदा की बेटियाँ’ के मानवीकरण को बनाए रखा गया है। सर्वनाम ‘तेरे’ भजन की सीधी और निकट संबोधन-शैली के अनुरूप है।
