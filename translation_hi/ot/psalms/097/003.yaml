  text: אֵ֭שׁ לְ/פָנָ֣י/ו תֵּלֵ֑ךְ וּ/תְלַהֵ֖ט סָבִ֣יב צָרָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/097/003.yaml
  text: Fire goes before him and burns his adversaries all around[a].
translation:
  language: hi
  text: आग उसके आगे चलती है और चारों ओर उसके विरोधियों को जला देती है[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘उसके शत्रुओं को।’
    reason: צָרָיו के लिए ‘विरोधी’ और ‘शत्रु’ दोनों प्रसंगानुकूल अर्थ हैं।
lexical_decisions:
- source_word: אֵשׁ
  choice: आग
  rationale: यह संज्ञा वास्तविक आग को दर्शाती है; हिन्दी में बिना अनिश्चित उपपद के ‘आग’ स्वाभाविक और काव्यात्मक है।
- source_word: לְפָנָיו
  choice: उसके आगे-आगे
  rationale: यह पदबंध उसके मुख या उपस्थिति के आगे जाने का भाव देता है। ‘आगे-आगे’ जुलूस-सदृश काव्यात्मक गति को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: תֵּלֵךְ
  choice: चलती है
  rationale: הלך का मूल अर्थ जाना या चलना है। आग के मानवीकरण वाले इस चित्र में ‘चलती है’ मूल बिंब को बनाए रखता है।
- source_word: וּתְלַהֵט
  choice: भस्म कर देती है
  rationale: להט यहाँ प्रचंड ज्वाला से जलाने का विनाशकारी भाव रखता है। ‘भस्म कर देती है’ उस तीव्रता को संक्षिप्त और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: סָבִיב
  choice: चारों ओर
  rationale: यह क्रियाविशेषण चारों तरफ फैले हुए या घेरने वाले विस्तार को दर्शाता है।
- source_word: צָרָיו
  choice: उसके विरोधियों
  rationale: צָרָיו उन लोगों को दर्शाता है जो उसके विरुद्ध या उससे शत्रुता रखते हैं। ‘विरोधी’ इस विरोध के मूल भाव को बनाए रखता है; ‘शत्रु’ भी संभव है।
theological_decisions:
- issue: भजन 97 के ईश-प्राकट्य प्रसंग में एकवचन पुल्लिंग प्रत्ययों का संदर्भ
  choice: मूल पाठ की तरह केवल ‘उसके’ रखा गया है और इस पद में ‘यहोवा’ नहीं जोड़ा गया।
  alternative: आग यहोवा के आगे-आगे चलती है और चारों ओर उसके विरोधियों को भस्म कर देती है।
  rationale: इब्रानी में इस पद में केवल तृतीय पुरुष प्रत्यय हैं; उनका संदर्भ निकटवर्ती प्रसंग से स्पष्ट होता है। सर्वनाम बनाए रखने से काव्यात्मक प्रवाह और मूल की अभिव्यक्ति सुरक्षित रहती है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और काव्यात्मक रूप। ‘आगे-आगे चलती है’ मूल मानवीकरण को बनाए रखता है; ‘भस्म कर देती है’ प्रचंड ज्वाला के विनाशकारी प्रभाव को व्यक्त करता है।
