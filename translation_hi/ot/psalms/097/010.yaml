review_pass:
  verdict: revise
  source_fidelity: The draft accurately reflects the vocative participle ('you who love Yahweh'), the plural imperative to hate evil, and the two protective actions attributed to Yahweh. ‘प्राणों की रक्षा’ appropriately conveys נפשות in this context, and ‘दुष्टों के हाथ से’ preserves the Hebrew idiom without obscuring its sense.
  naturalness: The verse is generally clear and suitably elevated. Adding punctuation after the vocative makes the opening more natural in modern Hindi. ‘प्रेम रखनेवालो’ is an idiomatic direct address and retains the participial sense.
  terminology: ‘यहोवा’ consistently renders the divine name. However, ‘विश्वासयोग्य जन’ can normally mean people who are trustworthy, whereas חסידיו denotes those characterized by loyalty/devotion to God. ‘निष्ठावान जन’ more precisely conveys the relational sense without importing ecclesiastical terminology.
  issues:
  - severity: medium
    issue: ‘अपने विश्वासयोग्य जनों’ may reverse the direction of faithfulness implied by חסידיו.
    rationale: In contemporary Hindi, विश्वासयोग्य most readily means ‘reliable/trustworthy.’ The Hebrew refers to Yahweh’s faithful/loyal devotees, so ‘अपने निष्ठावान जनों’ is clearer and closer to the source sense.
  - severity: low
    issue: The vocative lacks separating punctuation.
    rationale: A comma after ‘हे’ makes the direct address easier to read and more idiomatic without affecting meaning.
  revised_text: हे, यहोवा से प्रेम रखनेवालो, बुराई से घृणा करो! वह अपने निष्ठावान जनों के प्राणों[a] की रक्षा करता है; वह उन्हें दुष्टों के हाथ से छुड़ाता है।
