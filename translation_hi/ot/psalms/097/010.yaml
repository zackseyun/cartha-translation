  to: हे, यहोवा से प्रेम रखनेवालो, बुराई से घृणा करो! वह अपने निष्ठावान जनों के प्राणों[a] की रक्षा करता है; वह उन्हें दुष्टों के हाथ से छुड़ाता है।
  rationale: The revision retains the draft’s faithful rendering of the Hebrew while replacing a potentially misleading Hindi expression for Yahweh’s loyal/devoted people. The expanded footnote preserves the significant lexical alternatives for both נפשות and חסידיו reflected in the English audit trail.
