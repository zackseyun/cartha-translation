id: PSA.97.10
reference: Psalms 97:10
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: אֹהֲבֵ֥י יְהוָ֗ה שִׂנְא֫וּ רָ֥ע שֹׁ֭מֵר נַפְשׁ֣וֹת חֲסִידָ֑י/ו מִ/יַּ֥ד רְ֝שָׁעִ֗ים יַצִּילֵֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/097/010.yaml
  text: You who love Yahweh[a], hate evil. He guards the lives of his faithful ones; from the hand of the wicked he delivers them.
translation:
  language: hi
  text: हे, यहोवा से प्रेम रखनेवालो, बुराई से घृणा करो! वह अपने निष्ठावान जनों के प्राणों[a] की रक्षा करता है; वह उन्हें दुष्टों के हाथ से छुड़ाता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “जीवनों” अथवा “आत्माओं।” इब्रानी शब्द נַפְשׁוֹת व्यक्तियों, उनके जीवन या प्राणों को दर्शा सकता है। ‘निष्ठावान जनों’ के लिए इब्रानी חֲסִידָיו का अनुवाद “उसके भक्त” या “उसके संत” भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אֹהֲבֵי יְהוָה
  choice: हे यहोवा से प्रेम करनेवालो
  rationale: इब्रानी रचना का अर्थ ‘यहोवा से प्रेम करनेवाले’ है और यहाँ यह प्रत्यक्ष संबोधन है। ‘हे ... प्रेम करनेवालो’ इसे स्वाभाविक और स्पष्ट हिंदी में व्यक्त करता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: परमेश्वर के व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय प्रचलित हिंदी लिप्यंतरण ‘यहोवा’ से व्यक्त किया गया है।
- source_word: שִׂנְאוּ רָע
  choice: बुराई से घृणा करो
  rationale: बहुवचन आज्ञार्थक क्रिया की सीधी आज्ञा को बनाए रखा गया है। हिंदी में ‘बुराई से घृणा करना’ स्वाभाविक है और व्यापक नैतिक अर्थ को सुरक्षित रखता है।
- source_word: שֹׁמֵר
  choice: रक्षा करता है
  rationale: कृदंत यहोवा के नियमित या चरित्रगत कार्य को बताता है। ‘रक्षा करता है’ प्रसंग के संरक्षणात्मक भाव को सहज हिंदी में व्यक्त करता है।
- source_word: נַפְשׁוֹת
  choice: प्राणों
  rationale: נֶפֶשׁ का बहुवचन यहाँ जीवित प्राण या जीवन का बोध कराता है। ‘प्राणों’ से व्यक्ति के जीवन की रक्षा का अर्थ आता है, न कि अनिवार्य रूप से देह से पृथक आत्मा का।
- source_word: חֲסִידָיו
  choice: अपने विश्वासयोग्य जनों
  rationale: यह शब्द भक्ति और निष्ठा, विशेषकर परमेश्वर के प्रति संबंधपरक निष्ठा, से चिह्नित लोगों को दर्शाता है। ‘विश्वासयोग्य जन’ आधुनिक पाठक के लिए स्पष्ट है और ‘संत’ से जुड़े बाद के पारिभाषिक अर्थों से बचता है।
- source_word: מִיַּד רְשָׁעִים
  choice: दुष्टों के हाथ से
  rationale: ‘हाथ से’ की इब्रानी छवि को रखा गया है; यहाँ हाथ अधिकार या पकड़ का भी संकेत देता है और हिंदी में सहज समझ आता है।
- source_word: יַצִּילֵם
  choice: उन्हें ... छुड़ाता है
  rationale: हिफ़ील रूप सक्रिय बचाव या किसी की पकड़ से निकालने का अर्थ देता है। ‘छुड़ाता है’ ‘हाथ से’ के साथ स्वाभाविक बैठता है।
theological_decisions:
- issue: נַפְשׁוֹת का प्रसंगगत अर्थ
  choice: प्राणों
  alternative: आत्माओं; जीवनों
  rationale: दुष्टों के हाथ से रक्षा और छुड़ाए जाने का प्रसंग जीवित व्यक्तियों अथवा उनके जीवन की ओर संकेत करता है। ‘प्राणों’ इस अर्थ को रखता है, जबकि पद पर ऐसी आत्मा-संबंधी तत्त्वमीमांसा नहीं थोपता जिसे इब्रानी शब्द स्वयं अनिवार्य नहीं करता।
- issue: חֲסִידָיו का अनुवाद
  choice: अपने विश्वासयोग्य जनों
  alternative: अपने भक्तों; अपने संतों; अपने निष्ठावान जनों
  rationale: मूल शब्द परमेश्वर के प्रति भक्ति और निष्ठा से चिह्नित उसके लोगों को दर्शाता है। चुना गया रूप संबंधपरक-धार्मिक भाव को बचाता है और संप्रदायविशेष की शब्दावली से दूर रहता है।
translation_notes:
  register: आधुनिक मानक हिंदी का गरिमापूर्ण, सहज काव्यात्मक गद्य। प्रत्यक्ष संबोधन और आज्ञा की तीव्रता बनाए रखी गई है; समानांतर उत्तरार्ध में परमेश्वर की रक्षा और छुड़ाने की क्रिया स्पष्ट रखी गई है।
