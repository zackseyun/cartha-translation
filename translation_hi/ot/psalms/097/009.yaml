base_translation:
  language: en
  yaml_path: translation/ot/psalms/097/009.yaml
  text: For you[a], O Yahweh, are Most High over all the earth; you are exalted far above all gods.
translation:
  language: hi
  text: क्योंकि आप, हे याहवे, सारी पृथ्वी के ऊपर परमप्रधान हैं; आप सभी देवताओं[a] से कहीं अधिक ऊँचे हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘सभी दिव्य प्राणियों’ अथवा ‘सभी स्वर्गीय प्राणियों’ से। इब्रानी शब्द ‘एलोहीम’ प्रसंग के अनुसार देवताओं, दिव्य प्राणियों या स्वर्गीय शक्तियों को सूचित कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले कथन का आधार बताता है; हिन्दी में ‘क्योंकि’ इस कारणसूचक संबंध को स्वाभाविक रूप से व्यक्त करता है।
- source_word: אַתָּה
  choice: केवल आप ही
  rationale: स्वतंत्र सर्वनाम के बल को हिन्दी में ‘आप ही’ से उभारा गया है; ‘केवल’ उसी विशिष्टता को सहज बनाता है, बिना पद की मूल तुलना बदले।
- source_word: יְהוָה
  choice: यहवे
  rationale: ईश्वर के व्यक्तिगत नाम को उपाधि से प्रतिस्थापित करने के बजाय देवनागरी में लिप्यंतरित किया गया है।
- source_word: עֶלְיוֹן עַל כָּל הָאָרֶץ
  choice: सारी पृथ्वी के ऊपर परमप्रधान
  rationale: यह पूरी पृथ्वी पर यहवे की सर्वोच्चता व्यक्त करता है और ‘परमप्रधान’ עֶלְיוֹן की प्रतिष्ठित धार्मिक तथा श्रेणीगत अर्थच्छाया रखता है।
- source_word: מְאֹד נַעֲלֵיתָ
  choice: कहीं अधिक ऊँचे हैं
  rationale: מְאֹד की तीव्रता और נַעֲלֵיתָ की परिणामात्मक/स्थितिगत ऊँचाई को स्वाभाविक हिन्दी तुलनात्मक पदबंध में व्यक्त किया गया है।
- source_word: עַל כָּל אֱלֹהִים
  choice: सभी देवताओं से
  rationale: אֱלֹהִים का प्रत्यक्ष बहुवचन अर्थ रखा गया है, जिससे प्रतिद्वंद्वी दैवी दावेदारों पर यहवे की सर्वोच्चता और मूल पाठ का तनाव बना रहता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहवे
  alternative: यहोवा / प्रभु
  rationale: व्यक्तिगत नाम को शीर्षक से बदलने के बजाय उसका हिन्दी लिप्यंतरण किया गया है।
- issue: अंतिम चरण में אֱלֹהִים का आशय
  choice: देवताओं
  alternative: दिव्य प्राणियों / स्वर्गीय प्राणियों
  rationale: ‘देवताओं’ से इब्रानी बहुवचन का सीधा अर्थ और भजन का धर्मवैचारिक तनाव सुरक्षित रहता है; पादटिप्पणी अन्य संभव संदर्भों को बताती है।
translation_notes:
