source:
  edition: WLC
  text: הָרִ֗ים כַּ/דּוֹנַ֗ג נָ֭מַסּוּ מִ/לִּ/פְנֵ֣י יְהוָ֑ה מִ֝/לִּ/פְנֵ֗י אֲד֣וֹן כָּל הָ/אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/097/005.yaml
  text: The mountains melt like wax before Yahweh[b][a], before the Lord of all the earth.
translation:
  language: hi
  text: 'पहाड़ याहवे के सामने[a] मोम के समान पिघल जाते हैं,

    सारी पृथ्वी के प्रभु के सामने।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी मुहावरे का अधिक शाब्दिक अर्थ है, “याहवे के मुख/उपस्थिति के आगे से।”
    reason: lexical_alternative
lexical_decisions:
- source_word: הָרִים
  choice: पहाड़
  rationale: निश्चित बहुवचन संज्ञा; हिन्दी में जातिवाचक बहुवचन बिना अतिरिक्त संकेतक के स्वाभाविक और काव्यात्मक है।
- source_word: כַּדּוֹנַג
  choice: मोम के समान
  rationale: उपसर्ग כ तुलना व्यक्त करता है; यह चयन उपमा को स्पष्ट रखते हुए गरिमापूर्ण आधुनिक हिन्दी देता है।
- source_word: נָמַסּוּ
  choice: पिघल जाते हैं
  rationale: क्रिया पिघलने या गलने का बोध देती है। काव्यात्मक सिद्ध रूप को यहाँ सजीव, सामान्य वर्तमान से व्यक्त किया गया है, जो परमेश्वर की उपस्थिति के प्रभाव को सामने लाता है।
- source_word: מִלִּפְנֵי
  choice: के सामने
  rationale: इब्रानी मुहावरे का शाब्दिक अर्थ 'मुख/उपस्थिति के आगे से' है; 'के सामने' हिन्दी में स्वाभाविक है और उपस्थिति का भाव बनाए रखता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: चतुरक्षरीय व्यक्तिगत दिव्य नाम को हिन्दी में प्रचलित लिप्यंतरण 'यहोवा' से व्यक्त किया गया है, किसी उपाधि से प्रतिस्थापित नहीं किया गया।
- source_word: אֲדוֹן
  choice: प्रभु
  rationale: यह स्वामी या अधिपति की उपाधि है; 'प्रभु' भजन के उच्च काव्यात्मक स्तर के अनुकूल और सामान्य हिन्दी पाठक के लिए सुबोध है।
- source_word: כָּל הָאָרֶץ
  choice: सारी पृथ्वी के
  rationale: यह संबंधवाचक रचना सार्वभौमिक दायरे को व्यक्त करती है; 'सारी पृथ्वी के प्रभु' मूल संरचना और अर्थ को सहज हिन्दी में सुरक्षित रखता है।
theological_decisions:
- issue: दिव्य नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल में व्यक्तिगत दिव्य नाम सीधे प्रयुक्त हुआ है। हिन्दी बाइबलीय प्रयोग में व्यापक रूप से पहचाने जाने वाले 'यहोवा' को रखते हुए इसे 'प्रभु' जैसी उपाधि से नहीं बदला गया; अगले चरण में אֲדוֹן के लिए अलग उपाधि 'प्रभु' बनी रहती है।
- issue: काव्य में נָמַסּוּ का काल-पक्ष
  choice: वर्तमानकालीन 'पिघल जाते हैं'
  alternative: भूतकालीन 'पिघल गए'
  rationale: इब्रानी सिद्ध क्रिया को केवल अतीत की घटना मानना आवश्यक नहीं; यहाँ वह ईश्वरीय प्रकटता के प्रभाव का सजीव या सामान्य वर्णन कर सकती है। हिन्दी का 'पिघल जाते हैं' इस तनाव को बिना किसी विशिष्ट ऐतिहासिक समय में बाँधे व्यक्त करता है।
translation_notes:
  register: दो समानांतर काव्य-पंक्तियाँ रखी गई हैं। भाषा आधुनिक, सुबोध और गरिमापूर्ण है; 'यहोवा' व्यक्तिगत नाम तथा 'प्रभु' उपाधि के भेद को सुरक्षित रखते हैं।
