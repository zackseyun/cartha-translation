  yaml_path: translation/ot/psalms/097/004.yaml
  text: His lightning lights up the world[a]; the earth sees and trembles.
translation:
  language: hi
  text: उसकी बिजलियाँ जगत को प्रकाशित करती हैं; पृथ्वी देखती है और काँप उठती है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “पृथ्वी देखती है और डोल उठती है।” इब्रानी क्रिया काँपने, मरोड़ खाने या डोल उठने का भाव दे सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵאִירוּ
  choice: प्रकाशित करती हैं
  rationale: हिफ़इल रूप किसी वस्तु को प्रकाशमान करने का भाव देता है। ‘प्रकाशित करती हैं’ इस कारक अर्थ को स्वाभाविक और गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: בְרָקָיו
  choice: उसकी बिजलियाँ
  rationale: बहुवचन संज्ञा के साथ तृतीय पुरुष एकवचन पुल्लिंग प्रत्यय है और इसका संकेत परमेश्वर की बिजलियों की ओर है। हिन्दी में ‘बिजलियाँ’ बहुवचन को सीधे बनाए रखता है।
- source_word: תֵּבֵל
  choice: जगत
  rationale: यह शब्द प्रायः बसे हुए संसार को सूचित करता है। ‘जगत’ बाद में आए הָאָרֶץ के लिए प्रयुक्त ‘पृथ्वी’ से भेद बनाए रखता है और काव्यात्मक प्रसंग के अनुकूल है।
- source_word: רָאֲתָה
  choice: देखती है
  rationale: यद्यपि इब्रानी रूप पूर्ण क्रिया है, भजन के सजीव काव्यात्मक वर्णन में वर्तमान काल स्वाभाविक है। पृथ्वी का ‘देखना’ मूल की मानवीकरण शैली को सुरक्षित रखता है।
- source_word: וַתָּחֵל
  choice: और काँप उठती है
  rationale: חול/חיל से बना यह क्रियारूप काँपने, मरोड़ खाने या डोलने का भाव दे सकता है। ईश-प्रकटन के प्रसंग में ‘काँप उठती है’ अर्थ को अनावश्यक रूप से केवल पीड़ा या भूकंपीय गति तक सीमित किए बिना तीव्र प्रतिक्रिया व्यक्त करता है।
- source_word: הָאָרֶץ
  choice: पृथ्वी
  rationale: תֵּבֵל के समानांतर और विश्वव्यापी ईश-प्रकटन के प्रसंग में यहाँ स्थानीय ‘देश’ की अपेक्षा समूची ‘पृथ्वी’ अभिप्रेत है।
theological_decisions:
- issue: ईश-प्रकटन का विश्वव्यापी विस्तार
  choice: ‘जगत’ और ‘पृथ्वी’ को परस्पर संबंधित किंतु अलग शब्दों के रूप में रखा गया है, जिससे समूची सृष्टि पर परमेश्वर के प्रकट होने का प्रभाव व्यक्त हो।
  alternative: הָאָרֶץ को स्थानीय अर्थ में ‘देश’ या ‘भूमि’ कहना।
  rationale: काव्यात्मक समानांतरता और भजन का ईश-प्रकटन प्रसंग विश्वव्यापी अर्थ का समर्थन करते हैं; यह संदर्भगत शाब्दिक निर्णय है, कोई अतिरिक्त धर्मसैद्धांतिक दावा नहीं।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, काव्यात्मक और गरिमापूर्ण शैली रखी गई है। ‘जगत’ भजन की काव्य-भाषा के अनुकूल है और ‘पृथ्वी’ से मूल का शब्दगत भेद बनाए रखता है।
