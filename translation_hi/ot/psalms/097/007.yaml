  yaml_path: translation/ot/psalms/097/007.yaml
  text: Let all who serve carved images be put to shame[a], those who boast in idols; bow down to him, all gods.
translation:
  language: hi
  text: तराशी हुई मूर्तियों की उपासना करनेवाले सब लज्जित हों—वे जो मूर्तियों पर घमण्ड करते हैं। सभी देवताओं, उसके आगे दण्डवत् करो।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יֵבֹשׁוּ
  choice: लज्जित हों
  rationale: यह क्रिया लज्जा और सार्वजनिक अपमान का भाव रखती है; संदर्भ में इच्छासूचक स्वर को स्वाभाविक हिन्दी में बनाए रखती है।
- source_word: עֹבְדֵי
  choice: सेवा करनेवाले
  rationale: עבד के उपासना-संबंधी अर्थ को रखते हुए मूल के ‘सेवा’ वाले शब्दचित्र को सुरक्षित करता है।
- source_word: פֶסֶל
  choice: खुदी हुई मूर्तियों
  rationale: यह शब्द विशेष रूप से गढ़ी या खोदी गई प्रतिमा को दर्शाता है; ‘मूर्ति’ मात्र से अधिक सटीक है।
- source_word: הַמִּתְהַלְלִים
  choice: घमण्ड करते हैं
  rationale: हित्पाएल रूप यहाँ अपने भरोसे या गौरव की डींग मारने का भाव देता है; ‘घमण्ड करना’ आधुनिक हिन्दी में सहज है।
- source_word: בָּאֱלִילִים
  choice: मूर्तियों पर
  rationale: אֱלִילִים तुच्छ अथवा निष्फल देव-मूर्तियों के लिए प्रयुक्त होता है। ‘पर घमण्ड’ हिन्दी में आश्रय या गर्व के विषय को स्वाभाविक रूप से व्यक्त करता है।
- source_word: הִשְׁתַּחֲווּ
  choice: दण्डवत् करो
  rationale: आज्ञार्थक क्रिया भूमि तक झुककर आदर या उपासना करने का संकेत देती है; ‘दण्डवत् करो’ शारीरिक और उपासनात्मक दोनों भाव रखता है।
- source_word: לוֹ
  choice: उसके आगे
  rationale: हिन्दी में ‘दण्डवत् करना’ के साथ यह प्रयोग स्वाभाविक है और उसी की ओर किए गए नमन को स्पष्ट करता है।
- source_word: אֱלֹהִים
  choice: देवताओं
  rationale: मूल के बहुवचन ‘देवताओं’ को मुख्य पाठ में बनाए रखने से यह अस्पष्टता सुरक्षित रहती है कि संकेत जातियों के देवताओं की ओर है या स्वर्गीय प्राणियों की ओर।
theological_decisions:
- issue: כָּל אֱלֹהִים का संदर्भ
  choice: हे सभी देवताओ
  alternative: हे सभी स्वर्गीय प्राणियो / हे सभी स्वर्गदूतो
  rationale: इब्रानी पाठ का सीधा अर्थ ‘सभी देवता’ है। इसे मुख्य पाठ में रखने से अन्यजातियों के देवताओं के विरुद्ध विवादात्मक कथन और यहोवा के सम्मुख उपस्थित स्वर्गीय प्राणियों—दोनों संभावनाओं के बीच का धार्मिक तनाव बना रहता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण काव्यात्मक ढंग अपनाया गया है। ‘करनेवाले’ का संयुक्त रूप प्रवाह बनाए रखता है; ‘दण्डवत्’ सामान्य धार्मिक हिन्दी में समझने योग्य है और मूल की शारीरिक मुद्रा को सुरक्षित रखता है।
