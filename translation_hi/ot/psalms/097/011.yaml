  choice: ‘प्रकाश बोया गया है’ रूपक को बनाए रखा गया।
  alternative: ‘धर्मी के लिए उद्धार/समृद्धि तैयार है।’
  rationale: मूल पाठ प्रकाश को उद्धार, समृद्धि या न्यायसिद्धि में से किसी एक अर्थ तक सीमित नहीं करता; इसलिए उसकी व्यापकता और धर्मवैचारिक तनाव सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का संक्षिप्त, गरिमापूर्ण काव्यात्मक ढंग अपनाया गया है। ‘हृदय के सीधे लोगों’ की अपेक्षा ‘सीधे मनवालों’ को सामान्य पाठक के लिए अधिक स्वाभाविक माना गया, जबकि मूल का आंतरिक नैतिक भाव सुरक्षित है।
