  text: वह मुझे हरी-भरी चरागाहों में लिटाता है; वह मुझे विश्राम देने वाले जल[a] के पास ले चलता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “शांत जल” अथवा “स्थिर जल।” इब्रानी अभिव्यक्ति ऐसे जल पर बल देती है जो विश्राम या चैन से जुड़ा है।
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּנְאוֹת דֶּשֶׁא
  choice: हरी-भरी चरागाहों में
  rationale: נְאוֹת चरने और विश्राम करने के उपयुक्त स्थानों को दर्शाता है, जबकि דֶּשֶׁא ताज़ी घास या वनस्पति का बोध कराता है। संयुक्त पद के लिए यह सहज हिंदी चरवाही के बिंब को बनाए रखती है।
- source_word: יַרְבִּיצֵנִי
  choice: मुझे ... लिटाता है
  rationale: רבץ के हिफ़ील रूप का कारणवाचक अर्थ है ‘लेटने देता/लिटाता है।’ ‘लिटाता है’ इस व्याकरणिक बल और ठोस बिंब को सुरक्षित रखता है।
- source_word: עַל מֵי מְנֻחוֹת
  choice: विश्राम के जल के पास
  rationale: עַל यहाँ निकटता के अर्थ में ‘के पास’ है। מְנֻחוֹת विश्राम अथवा चैन से संबद्ध है; ‘विश्राम के जल’ मूल रूपक को बनाए रखता है और केवल जल की गतिहीनता तक अर्थ को सीमित नहीं करता।
- source_word: יְנַהֲלֵנִי
  choice: मुझे ... ले चलता है
  rationale: נהל के पिअेल रूप में देखभाल के साथ आगे ले जाने का भाव है। ‘ले चलता है’ हिंदी में स्वाभाविक है और चरवाहे की छवि बनाए रखता है।
theological_decisions:
- issue: מְנֻחוֹת का अनुवाद—विश्राम से जुड़े जल या शांत/स्थिर जल
  choice: विश्राम के जल
  alternative: शांत जल; स्थिर जल
  rationale: इब्रानी संज्ञा का मुख्य संबंध विश्राम और चैन से है, न कि स्पष्ट रूप से जल की गतिहीनता से। मुख्य पाठ उस संबंध को सुरक्षित रखता है, जबकि प्रचलित और संभव विकल्प पादटिप्पणी में दिए गए हैं।
translation_notes:
  register: आधुनिक मानक हिंदी; सरल, काव्यात्मक और गरिमापूर्ण शैली। ‘हरी-भरी चरागाहों’ से ताज़ी घास और चरवाही का दृश्य स्वाभाविक बनता है। पादटिप्पणी-चिह्न संबंधित विवादित पद के बाद रखा गया है।
