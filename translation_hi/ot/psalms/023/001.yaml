  text: מִזְמ֥וֹר לְ/דָוִ֑ד יְהוָ֥ה רֹ֝עִ֗/י לֹ֣א אֶחְסָֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/023/001.yaml
  text: A psalm of David[a]. Yahweh is my shepherd[c][b]; I will not lack.
translation:
  language: hi
  text: 'दाऊद का भजन[a]।

    याहवे[b] मेरा चरवाहा है;

    मुझे किसी चीज़ की कमी न होगी।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “दाऊद द्वारा रचा भजन” अथवा “दाऊद के लिए भजन”; हिब्रू शीर्षक לְדָוִד लेखकत्व, समर्पण या दाऊद से संबंध दर्शा सकता है।
    reason: alternative_reading
  - marker: b
    text: हिब्रू में YHWH, परमेश्वर का व्यक्तिगत नाम; हिन्दी अनुवादों में इसे परंपरागत रूप से “यहोवा” या “प्रभु” भी लिखा गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: מִזְמוֹר
  choice: भजन
  rationale: यह शीर्षक में प्रयुक्त काव्य-संगीत विधा का संकेत है; हिन्दी बाइबल और सामान्य धार्मिक भाषा में ‘भजन’ इसका स्वाभाविक और स्पष्ट समतुल्य है।
- source_word: לְדָוִד
  choice: दाऊद का
  rationale: उपसर्ग לְ यहाँ रचना, समर्पण, स्वामित्व या संबंध दर्शा सकता है। ‘दाऊद का’ इस व्यापक संबंध को बनाए रखता है, जबकि पादटिप्पणी संभावित अर्थ स्पष्ट करती है।
- source_word: יְהוָה
  choice: याहवे
  rationale: मूल पाठ में परमेश्वर का व्यक्तिगत नाम YHWH है; ‘याहवे’ उसे किसी उपाधि से बदलने के बजाय नाम के रूप में प्रस्तुत करता है।
- source_word: רֹעִי
  choice: मेरा चरवाहा
  rationale: רעה से बना यह रूप झुंड की देखभाल करने वाले को दर्शाता है। ‘मेरा चरवाहा’ रूपक की आत्मीयता और देखभाल के भाव को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: לֹא אֶחְסָר
  choice: मुझे किसी चीज़ की कमी न होगी
  rationale: חסר का अर्थ कमी होना या आवश्यकता में पड़ना है। यह अभिव्यक्ति प्रथम पुरुष के भाव और भविष्य/अपूर्ण क्रिया की आश्वस्ति को सहज आधुनिक हिन्दी में व्यक्त करती है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: पद में उपाधि नहीं, चार अक्षरों वाला व्यक्तिगत ईश्वरीय नाम है। ‘याहवे’ मूल नाम को प्रत्यक्ष रखता है; पारंपरिक उपाधि से उसे प्रतिस्थापित नहीं करता।
- issue: शीर्षक לְדָוִד का संबंध
  choice: दाऊद का
  alternative: दाऊद द्वारा; दाऊद के लिए
  rationale: हिब्रू संबंधसूचक रूप लेखकत्व, समर्पण या संबद्धता में से किसी को सूचित कर सकता है। मुख्य पाठ में व्यापक हिन्दी रूप रखा गया है और वास्तविक अस्पष्टता पादटिप्पणी में बताई गई है।
- issue: לֹא אֶחְסָר का काल और आशय
  choice: मुझे किसी चीज़ की कमी न होगी
  alternative: मुझे कोई कमी नहीं है
  rationale: हिब्रू अपूर्ण क्रिया वर्तमान की सामान्य वास्तविकता या भविष्य की आश्वस्ति दोनों का भाव दे सकती है। चुना हुआ रूप भरोसे की अग्रदर्शी ध्वनि व्यक्त करता है, बिना इसे इच्छाओं की पूर्ति का दावा बनाए।
translation_notes:
  register: भाषा आधुनिक, सरल और गरिमापूर्ण रखी गई है। काव्यात्मक पंक्ति-विन्यास अपनाया गया है। ‘किसी चीज़ की कमी’ सामान्य पाठक के लिए स्पष्ट है और इसे इच्छित वस्तु न मिलने के अर्थ से अलग रखता है।
