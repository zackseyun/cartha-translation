  text: גַּ֤ם כִּֽי אֵלֵ֨ךְ בְּ/גֵ֪יא צַלְמָ֡וֶת לֹא אִ֘ירָ֤א רָ֗ע כִּי אַתָּ֥ה עִמָּדִ֑/י שִׁבְטְ/ךָ֥ וּ֝/מִשְׁעַנְתֶּ֗/ךָ הֵ֣מָּה יְנַֽחֲמֻֽ/נִי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/023/004.yaml
  text: Even though I walk through the valley of deep darkness[a], I will fear no evil, for you are with me; your rod and your staff—they comfort me.
translation:
  language: hi
  text: 'चाहे मैं घोर अंधकार की घाटी[a] में से होकर चलूँ,

    फिर भी मैं किसी बुराई से नहीं डरूँगा,

    क्योंकि तू मेरे साथ है;

    तेरा डंडा और तेरी लाठी—

    वे मुझे ढाढ़स देते हैं।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “मृत्यु की छाया की घाटी।” हिब्रू शब्द घोर अंधकार का बोध करा सकता है, जिसमें मृत्यु की छाया भी निहित हो सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם כִּי
  choice: चाहे … फिर भी
  rationale: यह रचना रियायती भाव व्यक्त करती है; हिंदी में ‘चाहे … फिर भी’ इसे स्वाभाविक और स्पष्ट रूप से प्रकट करता है।
- source_word: אֵלֵךְ
  choice: मैं … चलूँ
  rationale: अपूर्ण क्रिया यहाँ संभावित अथवा सामान्य अनुभव को सजीव रूप में रखती है; ‘चलूँ’ चरवाहे के मार्गदर्शन वाले बिंब के अनुकूल है।
- source_word: בְּגֵיא
  choice: घाटी में से होकर
  rationale: गति-सूचक क्रिया के साथ यह वाक्यांश घाटी के भीतर से गुजरने का अर्थ स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: צַלְמָוֶת
  choice: घोर अंधकार
  rationale: शब्द का प्रमुख अर्थ अत्यंत गहरा अंधकार है, जिसमें मृत्यु का आभास भी हो सकता है; पारंपरिक विकल्प को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: לֹא אִירָא רָע
  choice: मैं किसी बुराई से नहीं डरूँगा
  rationale: ‘बुराई’ רָע की व्यापकता को बनाए रखती है, जिसमें अनिष्ट, संकट और नैतिक बुराई के अर्थ संभव हैं।
- source_word: כִּי אַתָּה עִמָּדִי
  choice: क्योंकि तू मेरे साथ है
  rationale: यह निर्भयता का कारण देता है। परमेश्वर को सीधे संबोधित करने वाले एकवचन रूप के लिए ‘तू’ काव्यात्मक निकटता और मूल की व्याकरणिक प्रत्यक्षता बनाए रखता है।
- source_word: שִׁבְטְךָ
  choice: तेरी लाठी
  rationale: चरवाहे के प्रसंग में ‘लाठी’ सुरक्षा और नियंत्रण के उपकरण का स्वाभाविक हिंदी नाम है।
- source_word: וּמִשְׁעַנְתֶּךָ
  choice: तेरा सहारा देने वाला डंडा
  rationale: यह שֵׁבֶט से भेद बनाए रखते हुए चरवाहे के उस staff को स्पष्ट करता है जिस पर सहारा लिया जाता है; केवल ‘लाठी’ कहने से दोनों समान लग सकते थे।
- source_word: הֵמָּה
  choice: वे
  rationale: स्वतंत्र सर्वनाम का जोर स्पष्ट ‘वे’ और डैश द्वारा बनाए रखा गया है।
- source_word: יְנַחֲמֻנִי
  choice: मुझे ढाढ़स देते हैं
  rationale: संदर्भ में क्रिया सांत्वना के साथ साहस और आश्वासन देने का भाव रखती है; ‘ढाढ़स देते हैं’ आधुनिक हिंदी में इस संयुक्त अर्थ को स्वाभाविक रूप से व्यक्त करता है।
theological_decisions:
- issue: צַלְמָוֶת का अर्थ और पारंपरिक ‘मृत्यु की छाया’
  choice: मुख्य पाठ में ‘घोर अंधकार’
  alternative: ‘मृत्यु की छाया की घाटी’
  rationale: हिब्रू पद गहरे अंधकार को व्यापक रूप से सूचित कर सकता है और उसमें मृत्यु की गूँज संभव है। मुख्य पाठ व्यापक अर्थ रखता है, जबकि प्रसिद्ध पारंपरिक और मृत्यु-संबंधी अर्थ पादटिप्पणी में दिया गया है।
- issue: רָע की अर्थ-व्याप्ति
  choice: ‘बुराई’
  alternative: ‘अनिष्ट’ या ‘हानि’
  rationale: सिर्फ शारीरिक संकट तक अर्थ सीमित न करके मूल की नैतिक और परिस्थितिजन्य अस्पष्टता बनाए रखी गई है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और काव्यात्मक हिंदी अपनाई गई है। पंक्ति-विन्यास हिब्रू काव्य की समानांतरता को उभारता है। सीधे संबोधन में ‘तू/तेरी/तेरा’ मूल के निकट, आत्मीय एकवचन को रखता है; इसे अनादरार्थक नहीं, भक्तिपरक काव्य-रूप में समझा जाना चाहिए।
