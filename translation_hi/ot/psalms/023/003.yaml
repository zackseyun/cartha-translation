  text: He restores my soul[c][b][a]; he leads me in paths of righteousness for the sake of his name.
translation:
  language: hi
  text: वह मेरे प्राण को बहाल करता है[a]; वह मुझे धार्मिकता के मार्गों पर अपने नाम की खातिर ले चलता है[b][c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘वह मेरे जीवन को नया करता है,’ ‘वह मुझे तरोताज़ा करता है,’ अथवा ‘वह मुझे लौटा लाता है।’ इब्रानी में ‘मेरे प्राण’ है, जिसका अर्थ केवल मनुष्य का अभौतिक भाग नहीं, बल्कि उसका जीवन या समूचा व्यक्तित्व भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या ‘सही मार्गों पर’ अथवा ‘न्याय के मार्गों पर।’
    reason: lexical_alternative
  - marker: c
    text: ‘अपने नाम की खातिर’ का अर्थ है अपने चरित्र और प्रतिष्ठा के सम्मान की खातिर।
    reason: cultural_note
lexical_decisions:
- source_word: נַפְשִׁי
  choice: मेरे प्राण को
  rationale: נֶפֶשׁ यहाँ केवल मनुष्य के अभौतिक भाग को नहीं, बल्कि उसके जीवन या समूचे व्यक्तित्व को भी सूचित कर सकता है। ‘प्राण’ काव्यात्मक गरिमा रखते हुए इस व्यापकता को काफी हद तक बनाए रखता है।
- source_word: יְשׁוֹבֵב
  choice: फिर से सँवारता है
  rationale: שוב के इस रूप में लौटाने, बहाल करने या नवजीवन देने का भाव है। ‘फिर से सँवारता है’ चरवाहे की देखभाल के संदर्भ में पुनर्बहाली का स्वाभाविक हिंदी भाव देता है, बिना केवल शारीरिक ताज़गी तक अर्थ सीमित किए।
- source_word: יַנְחֵנִי
  choice: मुझे ... ले चलता है
  rationale: נחה का हिफ़ील रूप नेतृत्व या मार्गदर्शन व्यक्त करता है। ‘ले चलता है’ चरवाहे के ठोस बिंब को बनाए रखता है।
- source_word: בְמַעְגְּלֵי
  choice: मार्गों पर
  rationale: מַעְגָּל पगडंडी, मार्ग या तय रास्ते को सूचित करता है। हिंदी में ‘मार्गों पर’ स्वाभाविक है और चरवाही तथा नैतिक दिशा—दोनों बिंबों के अनुकूल है।
- source_word: צֶדֶק
  choice: धार्मिकता
  rationale: צֶדֶק का अर्थ धार्मिकता, न्याय या वह जो सही है हो सकता है। ‘धार्मिकता के मार्ग’ नैतिक रूप से सही जीवन-पथ का भाव सुरक्षित रखता है; अन्य संभव अर्थ पादटिप्पणी में दिए गए हैं।
- source_word: לְמַעַן
  choice: के कारण
  rationale: לְמַעַן उद्देश्य या हेतु व्यक्त करता है। इस वाक्य में ‘अपने नाम के कारण’ सहज हिंदी में उस प्रेरक आधार को बताता है जिसके अनुसार परमेश्वर मार्गदर्शन करता है।
- source_word: שְׁמוֹ
  choice: अपने नाम
  rationale: שֵׁם का शाब्दिक अर्थ ‘नाम’ है और इसमें चरित्र, प्रतिष्ठा तथा यश भी निहित हो सकते हैं। शास्त्रीय प्रतिध्वनि बनाए रखने के लिए ‘नाम’ रखा गया है और व्यापक अर्थ पादटिप्पणी में स्पष्ट किया गया है।
theological_decisions:
- issue: ‘मेरे प्राण को फिर से सँवारता है’ का अर्थ
  choice: चरवाहे की देखभाल में भजनकार के जीवन और समूचे व्यक्तित्व की पुनर्बहाली
  alternative: वह मेरे जीवन को नया करता है; वह मुझे लौटा लाता है; वह मुझे तरोताज़ा करता है
  rationale: נֶפֶשׁ का अर्थ केवल किसी पृथक अभौतिक आत्मा तक सीमित नहीं है, और יְשׁוֹבֵב में बहाल करने, जिलाने या वापस लाने की वास्तविक अस्पष्टता है। मुख्य पाठ काव्यात्मक अभिव्यक्ति रखता है और पादटिप्पणी इस अर्थ-विस्तार को सुरक्षित करती है।
- issue: ‘धार्मिकता के मार्गों’ का अर्थ
  choice: ऐसे जीवन-पथ जो धार्मिकता या नैतिक सहीपन से पहचाने जाते हैं
  alternative: सही मार्ग; न्याय के मार्ग
  rationale: צֶדֶק नैतिक धार्मिकता, न्याय या सहीपन को सूचित कर सकता है। ‘धार्मिकता’ वाचा-संबंधी और नैतिक गहराई को बनाए रखता है, जबकि पादटिप्पणी संभावित व्यावहारिक और न्याय-संबंधी अर्थों को दर्ज करती है।
- issue: ‘अपने नाम के कारण’ का आशय
  choice: अपने चरित्र, प्रतिष्ठा और यश के अनुरूप तथा उनकी खातिर
  alternative: अपनी प्रतिष्ठा के कारण
  rationale: बाइबिलीय प्रयोग में परमेश्वर का ‘नाम’ केवल संबोधन नहीं, बल्कि उसके प्रकट चरित्र और प्रतिष्ठा का भी द्योतक है। मुख्य पाठ ‘नाम’ को सुरक्षित रखता है और पादटिप्पणी अर्थ स्पष्ट करती है।
translation_notes:
  register: आधुनिक मानक हिंदी में काव्यात्मक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध शैली। ‘प्राण,’ ‘धार्मिकता’ और ‘नाम’ जैसे पारंपरिक बाइबिलीय शब्द बनाए गए हैं, पर उनके व्यापक इब्रानी अर्थ पादटिप्पणियों में स्पष्ट किए गए हैं।
