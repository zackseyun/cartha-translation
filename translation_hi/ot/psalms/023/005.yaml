source:
  edition: WLC
  text: תַּעֲרֹ֬ךְ לְ/פָנַ֨/י שֻׁלְחָ֗ן נֶ֥גֶד צֹרְרָ֑/י דִּשַּׁ֖נְתָּ בַ/שֶּׁ֥מֶן רֹ֝אשִׁ֗/י כּוֹסִ֥/י רְוָיָֽה׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/023/005.yaml
  text: You set a table before me in the presence of my enemies[a]; you anoint my head with oil[b]; my cup overflows.
translation:
  language: hi
  text: तू मेरे सामने मेज़ सजाता है, मेरे शत्रुओं की आँखों के सामने; तू मेरे सिर को तेल से तर करता है; मेरा प्याला लबालब भरा है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תַּעֲרֹךְ
  choice: सजाता है
  rationale: ערך का अर्थ व्यवस्थित करना या तैयार करना है। मेज़ के साथ ‘मेज़ सजाना’ स्वाभाविक हिन्दी है और भोज के लिए व्यवस्था करने का बिंब बनाए रखता है।
- source_word: לְפָנַי
  choice: मेरे लिए
  rationale: शाब्दिक अर्थ ‘मेरे सामने’ है, पर मेज़ तैयार करने के प्रसंग में यह लाभार्थी भाव भी व्यक्त करता है। ‘मेरे सामने’ का स्थानिक पक्ष अगले पदबंध ‘शत्रुओं के सामने’ से अनावश्यक पुनरुक्ति पैदा करता; इसलिए स्वाभाविक हिन्दी में ‘मेरे लिए’ चुना गया।
- source_word: שֻׁלְחָן
  choice: मेज़
  rationale: यह भोजन और आतिथ्य के प्रसंग की मेज़ है; सरल आधुनिक हिन्दी में यही सीधा समतुल्य है।
- source_word: נֶגֶד צֹרְרָי
  choice: मेरे शत्रुओं के सामने
  rationale: נגד निकट उपस्थिति या दृष्टि के सामने होने का भाव देता है और צֹרְרָי विरोधियों को सूचित करता है। यह अनुवाद शत्रुओं के देखते हुए दिए गए सम्मान का बिंब रखता है।
- source_word: דִּשַּׁנְתָּ
  choice: तर करता है
  rationale: דשׁן मूलतः पुष्ट, समृद्ध या भरपूर करने का भाव रखता है। तेल और सिर के साथ ‘तेल से तर करना’ ठोस क्रिया तथा प्रचुर सत्कार—दोनों को व्यक्त करता है, जबकि केवल ‘अभिषेक करता है’ अनावश्यक धार्मिक-औपचारिक अर्थ जगा सकता है।
- source_word: בַשֶּׁמֶן רֹאשִׁי
  choice: मेरे सिर को तेल से
  rationale: मूल पाठ के साधन और शरीर-अंग के बिंब को सीधे बनाए रखा गया है; तेल के प्रकार को निर्दिष्ट नहीं किया गया।
- source_word: כּוֹסִי רְוָיָה
  choice: मेरा प्याला लबालब भरा है
  rationale: רְוָיָה तृप्ति, प्रचुरता और छलकती भरपूरी का भाव देता है। ‘लबालब भरा’ स्वाभाविक हिन्दी में उस प्रचुरता को स्पष्ट करता है, बिना यह अनिवार्य ठहराए कि प्याला वास्तव में छलक रहा है।
theological_decisions:
- issue: तेल से सिर के सत्कार का बिंब
  choice: ‘तू मेरे सिर को तेल से तर करता है’—आतिथ्य, ताज़गी और भरपूर सम्मान का ठोस चित्र
  alternative: ‘तू मेरे सिर का तेल से अभिषेक करता है’
  rationale: यहाँ भोज और मेज़बानी का प्रसंग प्रमुख है। ‘तर करता है’ דשׁן की समृद्धि की छटा को सुरक्षित रखता है और राजकीय, पुरोहितीय या संस्कारगत अभिषेक को पाठ में आयात नहीं करता।
- issue: हिब्रू काव्य में क्रियाओं का काल और पक्ष
  choice: 'वर्तमान काल: ‘सजाता है... करता है... भरा है’'
  alternative: 'भूत/पूर्ण भाव: ‘तूने सजाई... तूने तर किया... भर गया’'
  rationale: इस पद में हिब्रू रूपों को परमेश्वर की जीवंत और निरंतर देखभाल के काव्यात्मक वर्तमान के रूप में स्वाभाविक ढंग से समझा जा सकता है। वर्तमान काल पक्ष को जरूरत से अधिक निश्चित किए बिना तात्कालिकता रखता है।
- issue: כּוֹסִי רְוָיָה में प्रचुरता की सीमा
  choice: ‘मेरा प्याला लबालब भरा है’
  alternative: ‘मेरा प्याला उमड़ रहा है’ अथवा ‘छलकता है’
  rationale: रूप प्रचुर संतृप्ति या भरपूरी बताता है; ‘लबालब भरा’ उस अर्थ को रखता है और छलकने की गति को अनिवार्य नहीं बनाता।
translation_notes:
  register: आधुनिक मानक हिन्दी, एकवचन निकट संबोधन ‘तू’ के साथ, ताकि भजन की सीधी और आत्मीय प्रार्थना बनी रहे। भाषा सरल किंतु गरिमापूर्ण है। ‘मेज़ सजाता है’, ‘तेल से तर करता है’ और ‘लबालब भरा है’ भोज तथा उदार आतिथ्य के परस्पर जुड़े बिंबों को स्वाभाविक हिन्दी में बनाए रखते हैं।
