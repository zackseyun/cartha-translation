id: PSA.23.6
reference: Psalms 23:6
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: אַ֤ךְ ט֤וֹב וָ/חֶ֣סֶד יִ֭רְדְּפוּ/נִי כָּל יְמֵ֣י חַיָּ֑/י וְ/שַׁבְתִּ֥י בְּ/בֵית יְ֝הוָ֗ה לְ/אֹ֣רֶךְ יָמִֽים׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/023/006.yaml
  text: Surely goodness and steadfast love will pursue me all the days of my life[c][b][a], and I will dwell in the house of Yahweh for length of days.
translation:
  language: hi
  text: निश्चय ही भलाई और अटल प्रेम जीवन भर मेरा पीछा करते रहेंगे[a], और मैं दीर्घकाल तक[b] यहोवा के भवन में वास करूँगा[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मेरे पीछे-पीछे आते रहेंगे।” इब्रानी क्रिया का अधिक सजीव अर्थ “पीछा करना” है; यहाँ परमेश्वर की भलाई और अटल प्रेम को भजनकार के पीछे सक्रिय रूप से लगे हुए दिखाया गया है।
    reason: lexical_alternative
  - marker: b
    text: या, “सदा के लिए।” इब्रानी में शाब्दिक रूप से “दिनों की लंबाई तक” है—यह दीर्घ और स्थायी अवधि का मुहावरा है।
    reason: alternative_reading
  - marker: c
    text: या, “और मैं यहोवा के भवन में लौटूँगा।” मसोरेटिक स्वरांकन “वास करूँगा” का समर्थन करता है, पर “लौटूँगा” एक पुराना वैकल्पिक पाठार्थ है।
    reason: alternative_reading
lexical_decisions:
- source_word: אַךְ
  choice: निश्चय ही
  rationale: यहाँ यह अव्यय सीमा नहीं, बल्कि भजन के अंत में दृढ़ विश्वास प्रकट करता है।
- source_word: טוֹב
  choice: भलाई
  rationale: חֶסֶד के समानांतर यह परमेश्वर की हितकारी देखभाल को व्यक्त करता है।
- source_word: חֶסֶד
  choice: अटल प्रेम
  rationale: यह चुनाव प्रेम की निष्ठावान और स्थायी प्रकृति को सहज आधुनिक हिन्दी में व्यक्त करता है, बिना वाचा का अर्थ अनावश्यक रूप से थोपे।
- source_word: יִרְדְּפוּנִי
  choice: मेरा पीछा करते रहेंगे
  rationale: मूल क्रिया का जीवंत अर्थ ‘पीछा करना’ है; यह भलाई और प्रेम को भजनकार के पीछे सक्रिय रूप से लगे हुए दिखाता है।
- source_word: כָּל יְמֵי חַיָּי
  choice: जीवन भर
  rationale: यह ‘मेरे जीवन के सभी दिनों’ का स्वाभाविक और पूर्ण हिन्दी रूप है।
- source_word: וְשַׁבְתִּי
  choice: मैं ... वास करूँगा
  rationale: मसोरेटिक स्वरांकन ישׁב से ‘वास करना’ का समर्थन करता है; ‘लौटूँगा’ को पाठ-टिप्पणी में रखा गया है।
- source_word: בְּבֵית יְהוָה
  choice: यहोवा के भवन में
  rationale: यह उपासना-स्थान की ठोस छवि बनाए रखता है और हिन्दी में स्वाभाविक है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: मूल में प्रयुक्त परमेश्वर के व्यक्तिगत नाम को हिन्दी में प्रचलित लिप्यंतरण द्वारा प्रस्तुत किया गया है।
- source_word: לְאֹרֶךְ יָמִים
  choice: दीर्घकाल तक
  rationale: यह ‘दिनों की लंबाई तक’ के मुहावरे का स्वाभाविक हिन्दी रूप है और अवधि को अनिवार्यतः ‘सदा’ मानकर निर्णीत नहीं करता।
theological_decisions:
- issue: לְאֹרֶךְ יָמִים से सूचित अवधि
  choice: दीर्घकाल तक
  alternative: सदा के लिए
  rationale: मूल मुहावरा लंबी अथवा स्थायी अवधि सूचित कर सकता है, पर स्वयं अनंतता को स्पष्ट नहीं करता; इसलिए मुख्य पाठ में खुलापन रखा गया और ‘सदा’ को पादटिप्पणी में दिया गया।
- issue: וְשַׁבְתִּי का अर्थ
  choice: मैं वास करूँगा
  alternative: मैं लौटूँगा
  rationale: मसोरेटिक पाठ और स्वरांकन स्वाभाविक रूप से ‘वास करूँगा’ देते हैं; प्राचीन और दीर्घकालीन वैकल्पिक समझ ‘लौटूँगा’ को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, काव्यात्मक किंतु सामान्य पाठक के लिए सहज शैली। ‘पीछा करते रहेंगे’ मूल की सजीव मानवीकरण-छवि बचाता है; ‘दीर्घकाल तक’ कृत्रिम शाब्दिकता से बचते हुए मूल की अर्थगत खुलावट बनाए रखता है।
