  text: מִזְמ֥וֹר לְ/דָוִ֑ד יְהוָ֥ה רֹ֝עִ֗/י לֹ֣א אֶחְסָֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/023/000.yaml
  text: A psalm of David[a]. Yahweh is my shepherd[c][b]; I will lack nothing.
translation:
  language: hi
  text: 'दाऊद का भजन।[a]


    याहवे[b] मेरा चरवाहा है;


    मुझे किसी चीज़ की कमी न होगी।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इसे “दाऊद द्वारा रचित भजन” या “दाऊद के लिए भजन” भी समझा जा सकता है; इब्रानी לְדָוִד रचनाकार, समर्पण या संबंध का संकेत दे सकता है।
    reason: alternative_reading
  - marker: b
    text: इब्रानी में परमेश्वर का नाम YHWH है, जिसे अनेक अनुवादों में परंपरागत रूप से “यहोवा” या “प्रभु” लिखा जाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: מִזְמוֹר
  choice: भजन
  rationale: यह पद के शीर्षक में प्रयुक्त संज्ञा है और किसी वाद्य-संगत पवित्र गीत या स्तुति-काव्य के लिए स्वाभाविक तथा प्रचलित हिन्दी शब्द है।
- source_word: יְהוָה
  choice: याहवे
  rationale: चार अक्षरों वाले दिव्य नाम YHWH को उपाधि से बदलने के बजाय नाम के रूप में प्रस्तुत किया गया है; हिन्दी में 'याहवे' एक स्पष्ट और उच्चारण-सुलभ लिप्यंतरण है।
- source_word: רֹעִי
  choice: मेरा चरवाहा
  rationale: संज्ञा רֹעֶה और प्रथम पुरुष एकवचन प्रत्यय—दोनों को सीधे व्यक्त करता है और चरवाही के रूपक को बनाए रखता है।
- source_word: לֹא אֶחְסָר
  choice: मुझे किसी बात की घटी न होगी
  rationale: हिब्रू क्रिया חסר का मूल भाव किसी आवश्यक वस्तु की कमी होना है। यह हिन्दी अभिव्यक्ति भाव को स्वाभाविक रूप से बताती है और इसे केवल इच्छा या चाहत के अर्थ तक सीमित नहीं करती।
theological_decisions:
- issue: לְדָוִד में संबंध का प्रकार
  choice: दाऊद का भजन
  alternative: दाऊद द्वारा रचित भजन; दाऊद के लिए भजन
  rationale: לְ संबंध, समर्पण या रचनाकार को सूचित कर सकता है। मुख्य पाठ में पारंपरिक और संक्षिप्त हिन्दी रूप रखा गया है, जबकि टिप्पणी वास्तविक व्याकरणिक अस्पष्टता को सुरक्षित रखती है।
- issue: चरवाहे के रूपक और अभाव-निषेध का संबंध
  choice: याहवे मेरा चरवाहा है; मुझे किसी बात की घटी न होगी
  alternative: याहवे मेरा चरवाहा है; मैं कुछ न चाहूँगा
  rationale: दूसरी पंक्ति को पहली का परिणाम समझने की स्वाभाविक संभावना बनी रहती है, पर पाठ में अतिरिक्त कारणसूचक शब्द नहीं जोड़ा गया। 'घटी' חסר के अभाव-संबंधी अर्थ को व्यक्त करती है, न कि हर प्रकार की मानवीय इच्छा के निषेध को।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। काव्यात्मक पंक्ति-विन्यास मूल कथनों की संक्षिप्तता बनाए रखता है। शीर्षक की अस्पष्टता टिप्पणी में दी गई है और दिव्य नाम को मुख्य पाठ में नाम के रूप में रखा गया है।
