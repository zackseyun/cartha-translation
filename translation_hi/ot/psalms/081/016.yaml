  yaml_path: translation/ot/psalms/081/016.yaml
  text: But he would feed him with the finest wheat[b][a], and with honey from the rock I would satisfy you.
translation:
  language: hi
  text: पर वह उसे उत्तम गेहूँ खिलाता,[a] और चट्टान के मधु से मैं तुझे तृप्त करता।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “गेहूँ की चर्बी”; यह इब्रानी मुहावरा सबसे उत्तम या चुने हुए गेहूँ को दर्शाता है।
    reason: lexical_alternative
  - marker: b
    text: 'इब्रानी में पुरुष बदलता है: “वह उसे खिलाता ... मैं तुझे तृप्त करता।” एकवचन सर्वनाम संभवतः एक समुदाय के रूप में इस्राएल के लिए हैं।'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּאֲכִילֵהוּ
  choice: पर वह उसे ... खिलाता
  rationale: हिफ़ील रूप का कारणवाचक अर्थ ‘खिलाना’ है। पिछले पद की अपूर्ण शर्त के संदर्भ में इसे संभाव्य/शर्तसूचक ‘खिलाता’ के रूप में रखा गया है। तीसरे पुरुष एकवचन कर्म ‘उसे’ को नहीं समतल किया गया।
- source_word: מֵחֵלֶב חִטָּה
  choice: उत्तम गेहूँ
  rationale: חֵלֶב का शाब्दिक अर्थ ‘चरबी’ है, पर उपज के विषय में यह सबसे भरपूर या चुने हुए भाग का मुहावरा है; ‘उत्तम गेहूँ’ आधुनिक हिन्दी में इसका स्वाभाविक अर्थ देता है।
- source_word: וּמִצּוּר דְּבַשׁ
  choice: चट्टान से निकले मधु से
  rationale: צוּר ‘चट्टान’ और דְּבַשׁ ‘मधु’ है। ‘निकले’ हिन्दी में स्रोत-संबंध को सहज बनाता है और बंजर स्थान से मिलने वाली अप्रत्याशित भरपूरी का ठोस बिंब बनाए रखता है।
- source_word: אַשְׂבִּיעֶךָ
  choice: मैं तुझे तृप्त करता
  rationale: שׂבע के हिफ़ील का अर्थ पूर्णतः भरना या तृप्त करना है। प्रथम पुरुष कर्ता और द्वितीय पुरुष एकवचन संबोधन को यथावत रखा गया है।
theological_decisions:
- issue: पद के भीतर पुरुष-वचन का परिवर्तन
  choice: ‘वह उसे ... खिलाता’ से ‘मैं तुझे ... तृप्त करता’ तक इब्रानी पाठ का परिवर्तन सुरक्षित रखा गया।
  alternative: एकरूप करके ‘मैं तुझे खिलाता ... और तृप्त करता’ कहना।
  rationale: मसोरेटिक पाठ में यह स्पष्ट काव्यात्मक परिवर्तन है। उसे समतल करना अनावश्यक सामंजस्य बैठाना होता; एकवचन सर्वनाम संभवतः सामूहिक रूप से इस्राएल को सूचित करते हैं।
- issue: भरपूरी के काव्यात्मक बिंब
  choice: ‘उत्तम गेहूँ’ और ‘चट्टान से निकला मधु’ ठोस बिंबों के रूप में रखे गए।
  alternative: चट्टान को मुख्य पाठ में परमेश्वर का रूपक बताना।
  rationale: अनुवाद बिंब को सुरक्षित रखता है और उसमें कोई संप्रदायगत या रूपकात्मक व्याख्या नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और काव्यात्मक शैली। ‘मधु’ भजन-साहित्य के अनुरूप है, जबकि वाक्यरचना सामान्य पाठक के लिए सहज रखी गई है।
