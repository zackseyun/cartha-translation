  text: וָֽ֭/אֲשַׁלְּחֵ/הוּ בִּ/שְׁרִיר֣וּת לִבָּ֑/ם יֵ֝לְכ֗וּ בְּֽ/מוֹעֲצוֹתֵי/הֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/081/012.yaml
  text: So I gave them over to the stubbornness of their heart[c][b][a]; they walked in their own counsels.
translation:
  language: hi
  text: इसलिए मैंने उसे उनके मन की हठ के हवाले कर दिया[a]; वे अपनी ही योजनाओं के अनुसार चले[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में ‘उसे’ है—अर्थात सामूहिक रूप से इस्राएल; आगे उसी प्रजा के लिए बहुवचन ‘उनके/वे’ आता है। कुछ अनुवाद इसे ‘उन्हें’ कर देते हैं।
    reason: lexical_alternative
  - marker: b
    text: या, “वे अपनी ही सलाहों के अनुसार चले।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֲשַׁלְּחֵהוּ
  choice: इसलिए मैंने उसे ... के हवाले कर दिया
  rationale: हिफ़ील रूप यहाँ केवल ‘भेजने’ के बजाय छोड़ देने या किसी के अपने मार्ग के अधीन कर देने का न्याय-संबंधी भाव व्यक्त करता है। 3 पुल्लिंग एकवचन प्रत्यय को ‘उसे’ से सुरक्षित रखा गया है; इसका सामूहिक संदर्भ इस्राएल है।
- source_word: בִּשְׁרִירוּת לִבָּם
  choice: उनके मन की हठधर्मिता
  rationale: שְׁרִירוּת का अर्थ हठ, कठोरता या स्वेच्छाचारिता है। ‘हठधर्मिता’ भीतरी अड़ियल प्रवृत्ति को स्वाभाविक आधुनिक हिन्दी में व्यक्त करती है; לֵב को यहाँ ‘मन’ कहना हिन्दी में अंतःकरण और इच्छा के भाव को अधिक सहजता से पहुँचाता है।
- source_word: יֵלְכוּ
  choice: चलते रहे
  rationale: הלך व्यवहार या जीवन-पथ के लिए प्रयुक्त हो सकता है। पूर्ववर्ती भूतकालीन कथन के साथ ‘चलते रहे’ निरंतर आचरण का स्वाभाविक हिन्दी रूप है।
- source_word: בְּמוֹעֲצוֹתֵיהֶם
  choice: अपनी ही युक्तियों के अनुसार
  rationale: מוֹעֵצָה सलाह, योजना या सोची हुई युक्ति को सूचित करता है। ‘अपनी ही’ परमेश्वर की इच्छा के विपरीत उनके स्वयं के विचारों पर बल देता है, जबकि ‘के अनुसार’ בְּ के मार्गदर्शक मानदंड वाले भाव को स्पष्ट करता है।
theological_decisions:
- issue: पहले उपवाक्य के एकवचन प्रत्यय और बाद के बहुवचन का परिवर्तन
  choice: ‘उसे’ के बाद ‘उनके/वे’ रखकर संख्या-परिवर्तन सुरक्षित रखा
  alternative: 'पूरे पद को बहुवचन में समतल करना: ‘मैंने उन्हें ... के हवाले कर दिया’'
  rationale: इब्रानी पाठ पहले इस्राएल को एक सामूहिक इकाई मानकर एकवचन में और फिर लोगों को बहुवचन में संदर्भित करता है। इसे बनाए रखना वास्तविक पाठगत तनाव को अनावश्यक रूप से दूर नहीं करता।
- issue: परमेश्वर की क्रिया का न्याय-संबंधी स्वर
  choice: ‘के हवाले कर दिया’
  alternative: ‘जाने दिया’ या ‘दूर भेज दिया’
  rationale: संदर्भ में परमेश्वर अवज्ञाकारी प्रजा को उसकी अपनी हठ के परिणामों के अधीन छोड़ता है। यह रूप उस गंभीरता को रखता है, पर बाद की किसी विशिष्ट धर्मवैज्ञानिक प्रणाली को पाठ पर आरोपित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘हठधर्मिता’ नैतिक अड़ियलपन को व्यक्त करती है; ‘युक्तियों’ में सलाह और योजना दोनों की अर्थ-छाया रहती है। मुख्य पाठ में इब्रानी के सामूहिक एकवचन से बहुवचन की ओर परिवर्तन जानबूझकर सुरक्षित रखा गया है।
