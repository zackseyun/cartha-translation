  choice: मैंने ... उतार दिया
  rationale: הסיר का हिफ़ील पूर्ण 1 एकवचन कारणात्मक रूप से हटाने को व्यक्त करता है। बोझ और कंधे के संदर्भ में हिंदी का स्वाभाविक प्रयोग ‘बोझ उतार दिया’ है।
