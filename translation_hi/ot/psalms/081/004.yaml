base_translation:
  language: en
  yaml_path: translation/ot/psalms/081/004.yaml
  text: For it is a statute for Israel[a], an ordinance of the God of Jacob.
translation:
  language: hi
  text: 'क्योंकि यह इस्राएल के लिए एक विधि है,

    याकूब के परमेश्वर का एक विधान।[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “याकूब के परमेश्वर के लिए।” इब्रानी पूर्वसर्ग का अधिक शाब्दिक अनुवाद इस प्रकार हो सकता है; मुख्य पाठ संदर्भ में स्रोत या अधिकार के संभावित भाव को व्यक्त करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले पद में दिए उत्सव के आह्वान का कारण बताता है; आधुनिक हिन्दी में ‘क्योंकि’ इस व्याख्यात्मक संबंध को स्वाभाविक रूप से व्यक्त करता है।
- source_word: חֹק
  choice: विधि
  rationale: यह अधिकारपूर्वक ठहराए गए नियम को दर्शाता है और कानूनी-वाचागत भाव बनाए रखता है।
- source_word: לְיִשְׂרָאֵל
  choice: इस्राएल के लिए
  rationale: ל यहाँ इस्राएल पर लागू होने या उसके लिए निर्धारित होने का संबंध व्यक्त करता है।
- source_word: הוּא
  choice: यह ... है
  rationale: सर्वनाम संदर्भ में ठहराए गए उत्सव या पालन की ओर संकेत करता है; हिन्दी में ‘यह ... है’ स्वाभाविक है।
- source_word: מִשְׁפָּט
  choice: विधान
  rationale: חֹק के समानांतर यह अधिकार से स्थापित आदेश को दर्शाता है; ‘विधान’ संबंधित किंतु अलग कानूनी शब्द को सुरक्षित रखता है।
- source_word: לֵאלֹהֵי יַעֲקֹב
  choice: याकूब के परमेश्वर का
  rationale: यह संबंध, स्रोत अथवा अधिकार का संभावित अर्थ स्वाभाविक हिन्दी में व्यक्त करता है; ל का अधिक रूपगत अनुवाद ‘के लिए’ पादटिप्पणी में सुरक्षित है।
- source_word: יַעֲקֹב
  choice: याकूब
  rationale: यह नाम आधुनिक मानक हिन्दी की प्रचलित बाइबलीय वर्तनी में दिया गया है।
theological_decisions:
- issue: חֹק और מִשְׁפָּט दो कानूनी संज्ञाओं का संबंध
  choice: दोनों को अलग-अलग ‘विधि’ और ‘विधान’ के रूप में रखना
  alternative: दोनों को एक ही सामान्य शब्द में मिला देना, अथवा ‘नियम’ और ‘आज्ञा’ कहना
  rationale: इब्रानी कविता में ये संबंधित पर अलग शब्द हैं; दोनों को बनाए रखने से वाचागत और उपासना-संबंधी बल बिना अनावश्यक तकनीकी भेद थोपे सुरक्षित रहता है।
- issue: לֵאלֹהֵי יַעֲקֹב में ל का अर्थ
  choice: संबंध/स्रोत के रूप में ‘याकूब के परमेश्वर का’
  alternative: ‘याकूब के परमेश्वर के लिए’
  rationale: मुख्य पाठ का रूप विधान को परमेश्वर के अधिकार या स्रोत से जोड़ता है; फिर भी इब्रानी पूर्वसर्ग का अधिक औपचारिक वैकल्पिक अर्थ पादटिप्पणी में रखा गया है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और काव्यात्मक समानांतरता के अनुकूल रखी गई है। ‘विधि’ और ‘विधान’ कानूनी-वाचागत स्वर को बनाए रखते हुए सामान्य पाठक के लिए बोधगम्य हैं।
