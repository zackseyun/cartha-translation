  yaml_path: translation/ot/psalms/081/013.yaml
  text: Oh[a], that my people would listen to me, that Israel would walk in my ways!
translation:
  language: hi
  text: 'काश[a] मेरे लोग मेरी सुनते,

    और इस्राएल मेरे मार्गों पर चलता!'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अगर मेरे लोग मेरी सुनते और इस्राएल मेरे मार्गों पर चलता!”
    reason: לוּ को यहाँ कामनासूचक समझना अधिक स्वाभाविक है, किंतु इसका शर्तसूचक अनुवाद भी संभव है।
lexical_decisions:
- source_word: לוּ
  choice: काश
  rationale: यहाँ לוּ साधारण शर्त नहीं, बल्कि गहरी इच्छा और खेद व्यक्त करता है; आधुनिक हिन्दी में “काश” इस भाव को स्वाभाविक और संक्षिप्त रूप से व्यक्त करता है।
- source_word: עַמִּי
  choice: मेरे लोग
  rationale: प्रथम पुरुष एकवचन प्रत्यय सहित यह पद सीधे स्वामित्व और वाचा-संबंध को व्यक्त करता है।
- source_word: שֹׁמֵעַ לִי
  choice: मेरी सुनते
  rationale: שׁמע के साथ ל केवल ध्वनि सुनने से बढ़कर ध्यान देकर मानने का भाव रखता है; “मेरी सुनते” हिन्दी में दोनों भावों को समेटता है।
- source_word: יִשְׂרָאֵל
  choice: इस्राएल
  rationale: व्यक्तिवाचक नाम का प्रचलित हिन्दी बाइबलीय लिप्यंतरण रखा गया है।
- source_word: בִּדְרָכַי
  choice: मेरे मार्गों पर
  rationale: דֶּרֶךְ यहाँ जीवन और आचरण की रीति का रूपक है; “मार्गों पर” मूल रूपक को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: יְהַלֵּכוּ
  choice: चलता
  rationale: यह क्रिया इच्छित निरंतर आचरण को दर्शाती है। सामूहिक एकवचन “इस्राएल” के अनुरूप हिन्दी में “चलता” रखा गया है।
theological_decisions:
- issue: कामनासूचक विलाप बनाम शर्त
  choice: 'पद को परमेश्वर की कामना और खेद के रूप में प्रस्तुत किया गया है: “काश ... सुनते ... चलता!”'
  alternative: “यदि मेरे लोग मेरी सुनते, यदि इस्राएल मेरे मार्गों पर चलता।”
  rationale: संदर्भ में לוּ का कामनासूचक बल प्रमुख है, पर इसकी संभावित शर्तसूचक छाया को पादटिप्पणी में सुरक्षित रखा गया है; इससे मूल की भावात्मक और व्याकरणिक तनावशीलता बनी रहती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। काव्यात्मक समानांतरता तथा “मार्गों पर चलना” रूपक सुरक्षित हैं।
