theological_decisions:
- issue: अंतिम खंड ויהי עתם לעולם का आशय
  choice: उनका समय सदा तक रहता
  alternative: उनका दण्ड सदा तक रहता; अथवा उनका नियत भाग सदा बना रहता
  rationale: इब्रानी पंक्ति संक्षिप्त और अर्थ की दृष्टि से खुली है। निकटवर्ती प्रसंग नकारात्मक अर्थ का संकेत देता है, पर संज्ञा स्वयं केवल ‘समय’ कहती है; इसलिए मुख्य पाठ उस तनाव को बनाए रखता है।
- issue: יְכַחֲשׁוּ לוֹ में अधीनता का स्वरूप
  choice: झूठी अधीनता दिखाते
  alternative: उसके सामने दुबक जाते; उसके आगे अनिच्छा से झुक जाते
  rationale: क्रिया यहाँ सच्चे विश्वास या मन-परिवर्तन की अपेक्षा विवश और कपटपूर्ण समर्पण का संकेत दे सकती है; मुख्य पाठ इसी प्रमुख अर्थ को रखता है और अन्य संभावनाएँ टिप्पणी में देता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण काव्यात्मक गद्य। ‘झूठी अधीनता दिखाते’ सामान्य पाठक के लिए अर्थ स्पष्ट करता है, जबकि पादटिप्पणी मूल क्रिया की अन्य संभावित छटाएँ सुरक्षित रखती है।
