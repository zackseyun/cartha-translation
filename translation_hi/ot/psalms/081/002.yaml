  rationale: यह כִּנּוֹר से भिन्न प्राचीन तारवाद्य है; ‘सारंगी’ पाठ में दो वाद्यों को अलग रखती है, पर सटीक पहचान अनिश्चित होने के कारण पादटिप्पणी दी गई है।
