  text: In a little while I would subdue their enemies[b][a], and turn my hand against their adversaries.
translation:
  language: hi
  text: थोड़े ही समय में मैं उनके शत्रुओं को वश में कर देता[a], और उनके विरोधियों के विरुद्ध अपना हाथ चलाता[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “शीघ्र ही मैं उनके शत्रुओं को वश में कर देता।” इब्रानी כִּמְעַט समय की निकटता (“शीघ्र”) या, यहाँ कम सम्भावित रूप से, “लगभग” का अर्थ दे सकता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “मैं उनके विरोधियों पर अपना हाथ लौटा देता”; यह उनके विरुद्ध न्याय करने के लिए अपनी शक्ति लगाने का मुहावरा है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּמְעַט
  choice: थोड़े ही समय में
  rationale: यहाँ पद समय की निकटता या छोटे अंतराल को व्यक्त करता है। यह स्वाभाविक हिन्दी में ‘शीघ्र’ का भाव रखता है और कम सम्भावित ‘लगभग’ अर्थ को मुख्य पाठ में नहीं लाता।
- source_word: אוֹיְבֵיהֶם
  choice: उनके शत्रुओं
  rationale: सैन्य और विरोध के प्रसंग में אוֹיֵב का स्पष्ट, सामान्य हिन्दी प्रतिरूप।
- source_word: אַכְנִיעַ
  choice: मैं ... दबा देता
  rationale: כנע का हिफ़ईल रूप किसी को अधीन करने या नीचा दिखाने का भाव देता है। ‘दबा देता’ शत्रुओं पर विजय और अधीनता को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: וְעַל
  choice: और ... के विरुद्ध
  rationale: हाथ फेरने के मुहावरे के साथ עַל यहाँ विरोधी दिशा में की गई कार्रवाई दर्शाता है; हिन्दी में ‘के विरुद्ध’ इसे स्पष्ट करता है।
- source_word: צָרֵיהֶם
  choice: उनके विरोधियों
  rationale: צָר शत्रुतापूर्ण या संकट में डालने वाले व्यक्ति को दर्शाता है। ‘विरोधियों’ पहले प्रयुक्त ‘शत्रुओं’ से शब्दगत भेद भी बनाए रखता है।
- source_word: אָשִׁיב יָדִי
  choice: अपना हाथ फेरता
  rationale: शाब्दिक हस्त-रूपक को बनाए रखते हुए यह हिन्दी में परमेश्वर की शक्ति को विरोधियों के विरुद्ध मोड़ने का भाव देता है।
theological_decisions:
- issue: प्रसंग में परमेश्वर की कार्रवाई की विधि/शर्तबद्धता
  choice: ‘मैं ... दबा देता’ और ‘अपना हाथ फेरता’
  alternative: ‘मैं ... दबा दूँगा’ और ‘अपना हाथ फेरूँगा’
  rationale: इब्रानी अपूर्ण क्रियाएँ भविष्य भी व्यक्त कर सकती हैं, पर पिछले पद की शर्त—यदि इस्राएल सुनता—के कारण यहाँ अवास्तविक या शर्तबद्ध परिणाम है। हिन्दी की आदती-शर्तबद्ध रचना इस भाव को स्वाभाविक रूप से व्यक्त करती है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज और गरिमापूर्ण स्तर रखा गया है। समानार्थी इब्रानी संज्ञाओं के लिए ‘शत्रु’ और ‘विरोधी’ द्वारा काव्यात्मक समानांतरता तथा हल्का शब्दगत भेद सुरक्षित है। हस्त-रूपक मुख्य पाठ में बनाए रखा गया है और उसका मुहावरेदार अर्थ पाद-टिप्पणी में स्पष्ट किया गया है।
