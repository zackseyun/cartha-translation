  yaml_path: translation/ot/psalms/081/001.yaml
  text: Sing for joy to God[a], our strength; shout aloud to the God of Jacob.
translation:
  language: hi
  text: 'हमारे बल परमेश्वर के लिए आनन्द से गाओ;

    याकूब के परमेश्वर के लिए जयजयकार करो।[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “याकूब के परमेश्वर के लिए ऊँची जयध्वनि करो।” यहाँ प्रयुक्त क्रिया ऊँची सार्वजनिक जय-पुकार या तुरही जैसी ध्वनि का भाव दे सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הַרְנִינוּ
  choice: आनन्द से गाओ
  rationale: बहुवचन आज्ञार्थक क्रिया उल्लासपूर्ण स्वर में स्तुति करने को कहती है; यह रूप हिन्दी में उसके संगीतमय और आनन्दपूर्ण दोनों भावों को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: לֵאלֹהִים
  choice: परमेश्वर के लिए
  rationale: उपसर्ग ל स्तुति की दिशा अथवा उसके प्राप्तकर्ता को सूचित करता है। प्रसंग में אֱלֹהִים इस्राएल के एकमात्र परमेश्वर को दर्शाता है।
- source_word: עוּזֵּנוּ
  choice: हमारे बल
  rationale: עוֹז का मूल अर्थ शक्ति या सामर्थ्य है। संक्षिप्त पदबंध ‘हमारे बल’ इब्रानी समानाधिकरण को बनाए रखता है और परमेश्वर को उनकी प्रजा की सामर्थ्य बताता है।
- source_word: הָרִיעוּ
  choice: जयजयकार करो
  rationale: हिफ़ील बहुवचन आज्ञार्थक रूप ऊँची, सार्वजनिक और विजयोल्लासपूर्ण पुकार को व्यक्त करता है। ‘जयजयकार करो’ आधुनिक हिन्दी में इस सामूहिक उद्घोष को स्वाभाविक रूप से बताता है।
- source_word: לֵאלֹהֵי יַעֲקֹב
  choice: याकूब के परमेश्वर के सामने
  rationale: ל स्तुति की ओरमुखता व्यक्त करता है और אֱלֹהֵי יַעֲקֹב संबंधवाचक पद ‘याकूब का परमेश्वर’ है। ‘के सामने’ हिन्दी में संबोधित जयघोष की दिशा स्पष्ट करता है, बिना अर्थ को किसी संप्रदायगत व्याख्या से सीमित किए।
theological_decisions:
- issue: दोनों समानांतर पंक्तियों में אֱלֹהִים का वचन
  choice: परमेश्वर / याकूब के परमेश्वर
  alternative: देवता / याकूब के देवताओं
  rationale: रूप व्याकरणतः बहुवचन जैसा है, पर इस वाचा-संबंधी प्रसंग में वह एकवचन अर्थ रखता है; समानांतर पद ‘याकूब के परमेश्वर’ भी इसी एकवचन संदर्भ की पुष्टि करता है।
- issue: עוּזֵּנוּ और परमेश्वर के बीच संबंध
  choice: ‘हमारे बल, परमेश्वर’—परमेश्वर को प्रजा का बल बताने वाला समानाधिकरण
  alternative: ‘हमारे शक्तिशाली परमेश्वर’ अथवा ‘हमारे शरणस्थान’
  rationale: मूल पाठ में कोई विशेषण या ‘शरणस्थान’ का स्पष्ट शब्द नहीं है। समानाधिकरण को बनाए रखने से कथन की संक्षिप्तता और उसका धर्मवैचारिक तनाव सुरक्षित रहता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामूहिक आराधना में सहज है। ‘आनन्द से गाओ’ और ‘जयजयकार करो’ दोनों आज्ञाओं के बीच मूल पाठ का भेद बनाए रखते हैं। अर्धविराम इब्रानी समानांतरता को स्पष्ट करता है।
