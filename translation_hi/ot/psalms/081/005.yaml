base_translation:
  language: en
  yaml_path: translation/ot/psalms/081/005.yaml
  text: 'He made it a testimony in Joseph when he went out over the land of Egypt[c][b][a]. I heard a language I had not known:'
translation:
  language: hi
  text: 'उसने इसे यूसुफ़ के लिए[b] गवाही के रूप में स्थापित किया,


    जब वह मिस्र देश पर निकला।[a]


    मैंने ऐसी भाषा सुनी जिसे मैं नहीं जानता था।[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मिस्र देश के विरुद्ध निकला।” इस प्रसंग में इब्रानी संबंधबोधक शब्द के दोनों अर्थ संभव हैं।
    reason: lexical_alternative
  - marker: b
    text: यहाँ “यूसुफ़” संभवतः इस्राएल की प्रजा का प्रतिनिधि नाम है, विशेषकर मिस्र से निकलने के प्रसंग में; फिर भी मूल नाम ही रखा गया है।
    reason: cross_reference
  - marker: c
    text: या, “मैं ऐसी भाषा सुनता हूँ जिसे मैं नहीं जानता।” काव्यात्मक प्रसंग में इब्रानी क्रिया वर्तमान या भूतकाल में समझी जा सकती है।
    reason: alternative_reading
lexical_decisions:
- source_word: עֵדוּת
  choice: साक्षी
  rationale: मूल संज्ञा का अर्थ ‘गवाही/साक्षी’ है और विधिक या उपासना-संबंधी प्रसंग में स्थापित व्यवस्था का भाव भी हो सकता है। ‘साक्षी ठहराया’ मूल अर्थ को बनाए रखते हुए स्वाभाविक हिन्दी देता है।
- source_word: בִּיהוֹסֵף
  choice: यूसुफ़ में
  rationale: ב के सामान्य अर्थ ‘में’ को रखा गया है और ‘यूसुफ़’ नाम को ‘इस्राएल’ से बदलकर व्याख्या नहीं की गई।
- source_word: שָׂמוֹ
  choice: उसने इसे … ठहराया
  rationale: שׂים का अर्थ रखना, स्थापित करना या नियुक्त करना है; ‘ठहराया’ यहाँ किसी बात को प्रामाणिक रूप से स्थापित करने का भाव व्यक्त करता है।
- source_word: בְּצֵאתוֹ
  choice: जब वह … निकला
  rationale: ב सहित infinitive construct का कालगत अर्थ है। पुल्लिंग एकवचन सर्वनाम के संदर्भ को स्पष्ट किए बिना ‘वह’ से मूल की अस्पष्टता बची रहती है।
- source_word: עַל אֶרֶץ מִצְרָיִם
  choice: मिस्र देश के ऊपर से
  rationale: עַל के ‘ऊपर/के ऊपर से’ अर्थ को मुख्य पाठ में रखा गया है; निर्गमन और न्याय के प्रसंग में ‘विरुद्ध’ भी संभव है, इसलिए उसे पादटिप्पणी में दिया गया है।
- source_word: שְׂפַת
  choice: भाषा
  rationale: शाब्दिक अर्थ ‘होंठ’ है, पर यह बोलचाल या भाषा के लिए प्रचलित इब्रानी मुहावरा है।
- source_word: לֹא יָדַעְתִּי
  choice: जिसे मैं नहीं जानता था
  rationale: पूर्ण क्रिया को पूर्वकालीन अपरिचय के रूप में स्वाभाविक हिन्दी में व्यक्त किया गया है।
- source_word: אֶשְׁמָע
  choice: मैंने … सुनी
  rationale: अपूर्ण क्रियारूप को काव्यात्मक वृत्तांत में भूतकाल के रूप में समझा जा सकता है; वर्तमानकाल ‘मैं सुनता हूँ’ भी संभव है और पादटिप्पणी में सुरक्षित है।
theological_decisions:
- issue: ‘यूसुफ़’ का संदर्भ
  choice: मुख्य पाठ में ‘यूसुफ़’ नाम रखा गया है; प्रसंग में यह वाचा की प्रजा का प्रतिनिधि नाम हो सकता है।
  alternative: इसे उत्तरी गोत्रों/एप्रैम तक सीमित समझना, या अनुवाद में सीधे ‘इस्राएल’ लिखना।
  rationale: इब्रानी पाठ स्पष्ट रूप से ‘यूसुफ़’ कहता है। नाम को बनाए रखना मूल की प्रतिनिधिक और संभावित रूप से बहुअर्थी भूमिका को सुरक्षित रखता है।
- issue: בְּצֵאתוֹ में ‘वह’ का संदर्भ
  choice: ‘वह’ को बिना स्पष्ट पहचान जोड़े रखा गया है।
  alternative: सर्वनाम को स्पष्ट रूप से परमेश्वर अथवा यूसुफ़/इस्राएल से जोड़ना।
  rationale: मूल व्याकरण पुल्लिंग एकवचन बताता है, पर संदर्भ निर्णायक रूप से व्यक्त नहीं करता; अनुवाद को इस तनाव का समाधान नहीं जोड़ना चाहिए।
- issue: अंतिम पंक्ति में वक्ता और काल
  choice: पहले पुरुष को बिना वक्ता का नाम जोड़े रखा गया है और मुख्य पाठ में भूतकाल लिया गया है।
  alternative: इसे भजनकार की आत्मकथात्मक वाणी मानना, या वर्तमानकाल ‘मैं सुनता हूँ’ करना।
  rationale: आसपास का प्रसंग परमेश्वर की प्रथम-पुरुष वाणी की ओर बढ़ता है, फिर भी पद स्वयं वक्ता का नाम नहीं देता। वर्तमान और भूतकाल दोनों काव्यात्मक रूप से संभव हैं।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, पठनीय काव्यात्मक रूप रखा गया है। पंक्ति-विभाजन इब्रानी पद की काव्यात्मक गति को दर्शाता है। ‘यूसुफ़ में’ और ‘ऊपर से’ सामान्य हिन्दी में कुछ असामान्य लग सकते हैं, पर वे मूल पाठ की वास्तविक अस्पष्टता को बिना अतिरिक्त व्याख्या के सुरक्षित रखते हैं।
