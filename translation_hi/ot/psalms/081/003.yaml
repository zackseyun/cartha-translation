  to: नए चाँद पर और पूर्णिमा पर—हमारे पर्व के दिन—तुरही फूँको।
  rationale: The revision replaces the culturally and instrumentally over-specific “नरसिंगा” with “तुरही” and restructures the sentence so that the plural imperative governs both “नए चाँद पर” and “पूर्णिमा पर.” The em dashes preserve the poetic, explanatory relation of “हमारे पर्व के दिन” without resolving the debated Hebrew term beyond the adopted main-text reading. The existing footnote is retained unchanged in substance and anchor.
