  text: תִּקְע֣וּ בַ/חֹ֣דֶשׁ שׁוֹפָ֑ר בַּ֝/כֵּ֗סֶה לְ/י֣וֹם חַגֵּֽ/נוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/081/003.yaml
  text: Blow the trumpet at the new moon[a], at the full moon, on the day of our feast.
translation:
  language: hi
  text: नए चाँद पर और पूर्णिमा पर—हमारे पर्व के दिन—तुरही फूँको।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תִּקְעוּ
  choice: फूँको
  rationale: यह תקע का बहुवचन आज्ञार्थक रूप है और שׁוֹפָר के साथ इसका स्वाभाविक अर्थ वाद्य को फूँकना है; हिंदी में यह आज्ञा और क्रिया दोनों को सहज रूप से व्यक्त करता है।
- source_word: בַחֹדֶשׁ
  choice: नए चाँद पर
  rationale: חֹדֶשׁ का अर्थ ‘महीना’ या ‘नया चाँद’ हो सकता है; पर्व-संबंधी संदर्भ और כֵּסֶה के साथ काव्यात्मक समानांतरता में ‘नया चाँद’ अधिक उपयुक्त है।
- source_word: שׁוֹפָר
  choice: नरसिंगा
  rationale: שׁוֹפָר धार्मिक और सामुदायिक संकेत के लिए फूँका जाने वाला सींग-निर्मित वाद्य है। ‘नरसिंगा’ सामान्य हिंदी पाठक के लिए बोधगम्य पारंपरिक वाद्य-शब्द है और अनावश्यक लिप्यंतरण से बचता है।
- source_word: בַּכֵּסֶה
  choice: पूर्णिमा पर
  rationale: כֵּסֶה का अर्थ विवादित है, पर नए चाँद के समानांतर और पर्व के पंचांग-संदर्भ में ‘पूर्णिमा’ संभावित अर्थ को स्वाभाविक हिंदी में व्यक्त करती है। अन्य संभावनाएँ पादटिप्पणी में रखी गई हैं।
- source_word: לְיוֹם
  choice: के दिन
  rationale: यहाँ לְ समय अथवा पर्व-दिवस से संबंध बताता है; ‘के दिन’ हिंदी में संक्षिप्त और स्वाभाविक है।
- source_word: חַגֵּנוּ
  choice: हमारे पर्व
  rationale: חַג उत्सव अथवा धार्मिक पर्व को दर्शाता है। ‘हमारे पर्व’ मूल के प्रथम पुरुष बहुवचन संबंध और उत्सवी-धार्मिक भाव को स्पष्ट रूप से बनाए रखता है।
theological_decisions:
- issue: पर्व-पंचांग के संदर्भ में בַּכֵּסֶה का अर्थ
  choice: पूर्णिमा पर
  alternative: ढके हुए चाँद पर; नियत समय पर
  rationale: यह मुख्यतः शब्दार्थ और संदर्भ का प्रश्न है, न कि किसी विशिष्ट सिद्धांत का। ‘नए चाँद’ के समानांतर और पर्व-दिवस के संदर्भ में ‘पूर्णिमा’ सर्वाधिक सुसंगत जान पड़ती है, पर हिब्रू शब्द की वास्तविक अनिश्चितता को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिंदी में संक्षिप्त, काव्यात्मक और गरिमापूर्ण शैली रखी गई है। पंक्ति-विभाजन हिब्रू समानांतरता को उभारता है; ‘नरसिंगा’ धार्मिक संकेत के लिए प्रयुक्त सींग-वाद्य का सुबोध हिंदी रूप है।
