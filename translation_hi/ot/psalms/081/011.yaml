  text: But my people did not listen to my voice[a], and Israel was not willing to obey me.
translation:
  language: hi
  text: 'परन्तु मेरी प्रजा ने मेरी आवाज़ नहीं सुनी,

    और इस्राएल मेरी बात मानने को तैयार नहीं हुआ।[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मेरी प्रजा ने मेरी आवाज़ सुनना नहीं चाहा, और इस्राएल ने मेरी बात मानना स्वीकार नहीं किया।” दूसरी पंक्ति की इब्रानी क्रिया इच्छा या सहमति दर्शाती है; इसका अनुवाद “उसने मुझे अस्वीकार कर दिया” भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלֹא
  choice: परन्तु ... नहीं
  rationale: संयोजक यहाँ पिछले पद की परमेश्वर की पुकार के विपरीत प्रतिक्रिया दिखाता है; ‘परन्तु’ इस विरोधी भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: שָׁמַע
  choice: सुनी
  rationale: שׁמע का अर्थ सुनना, ध्यान देना या आज्ञा मानना हो सकता है। ‘आवाज़’ के साथ ‘सुनी’ मूल बिंब और उसकी अर्थगत व्यापकता को बनाए रखता है।
- source_word: עַמִּי
  choice: मेरी प्रजा
  rationale: यह प्रथम पुरुष एकवचन प्रत्यय वाला सीधा रूप है; ‘मेरी प्रजा’ वाचा-संबंधी भाव को गरिमापूर्ण और सहज हिन्दी में रखता है।
- source_word: לְקוֹלִי
  choice: मेरी आवाज़
  rationale: קוֹל का मूल अर्थ ‘आवाज़’ है। हिन्दी में ‘आवाज़ सुनना’ स्वाभाविक है और व्यक्तिगत, संबंधपरक अभिव्यक्ति सुरक्षित रहती है।
- source_word: וְיִשְׂרָאֵל
  choice: और इस्राएल
  rationale: संयोजक और नाम दोनों बनाए रखने से ‘मेरी प्रजा’ तथा ‘इस्राएल’ के बीच काव्यात्मक समानांतरता सुरक्षित रहती है।
- source_word: לֹא אָבָה
  choice: इच्छुक नहीं हुआ
  rationale: אָבָה इच्छा या सहमति को सूचित करता है। यह चयन अनिच्छा का मूल अर्थ रखता है और उसे सीधे ‘आज्ञा न मानने’ में सीमित नहीं करता।
- source_word: לִי
  choice: मेरे प्रति
  rationale: אָבָה के बाद לִי का शाब्दिक संबंध ‘मेरे प्रति/मेरे लिए’ है। ‘मेरे प्रति’ मूल की संक्षिप्तता और कुछ अर्थगत खुलापन बनाए रखता है।
theological_decisions:
- issue: इस्राएल की परमेश्वर की प्रजा के रूप में वाचा-संबंधी पहचान
  choice: ‘मेरी प्रजा’ और ‘इस्राएल’ को दो समानांतर पदों में बनाए रखा गया।
  alternative: ‘मेरी प्रजा इस्राएल ने मेरी आवाज़ नहीं सुनी’
  rationale: मूल इब्रानी दो समानांतर संबोधन प्रस्तुत करता है। उन्हें अलग रखने से काव्यात्मक रचना और वाचा-संबंधी बल दोनों सुरक्षित रहते हैं।
- issue: दूसरी पंक्ति में इच्छा, सहमति और आज्ञाकारिता का संबंध
  choice: ‘मेरे प्रति इच्छुक नहीं हुआ’
  alternative: ‘मेरी आज्ञा मानने को तैयार नहीं हुआ’ अथवा ‘मुझे अस्वीकार कर दिया’
  rationale: मूल क्रिया मुख्यतः इच्छा या सहमति न होने को व्यक्त करती है। स्पष्ट ‘आज्ञाकारिता’ या ‘अस्वीकार’ कहना सम्भव प्रसंगगत अर्थ है, पर मूल से अधिक व्याख्यात्मक होगा।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण काव्यात्मक गद्य रखा गया है। ‘मेरी आवाज़ नहीं सुनी’ में सुनने और ध्यान देने दोनों की सम्भावना बनी रहती है। दूसरी पंक्ति में व्याख्यात्मक ‘आज्ञा मानना’ जोड़ने के बजाय मूल के इच्छा/सहमति वाले तनाव को सुरक्षित रखा गया है।
