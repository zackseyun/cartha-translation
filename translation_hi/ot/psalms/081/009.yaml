source:
  edition: WLC
  text: לֹֽא יִהְיֶ֣ה בְ֭/ךָ אֵ֣ל זָ֑ר וְ/לֹ֥א תִ֝שְׁתַּחֲוֶ֗ה לְ/אֵ֣ל נֵכָֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/081/009.yaml
  text: You must have no foreign god among you, and you must not bow down to an alien god[a].
translation:
  language: hi
  text: 'तुम्हारे बीच कोई पराया देवता न हो,

    और तुम किसी विदेशी देवता के आगे दण्डवत न करो।[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इब्रानी में इस्राएल की उपासना से बाहर के देवता के लिए दो निकट-समानार्थी शब्द आए हैं: “पराया” और “विदेशी” या “अजनबी।” यह भिन्नता काव्यात्मक समानांतरता को दर्शाती है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִהְיֶה
  choice: न हो
  rationale: निषेध के साथ यह भविष्यवाणी नहीं, बल्कि वाचा के संदर्भ में सीधा प्रतिबंध है। हिंदी में “न हो” इस बल को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: בְךָ
  choice: तेरे बीच
  rationale: इब्रानी में इस्राएल को सामूहिक रूप से एकवचन में संबोधित किया गया है। “तेरे बीच” उस एकवचन संबोधन और समुदाय के भीतर किसी पराए देवता के निषेध—दोनों को बनाए रखता है।
- source_word: אֵל
  choice: देवता
  rationale: आराधना के समानांतर संदर्भ में यह शब्द किसी deity को दर्शाता है। हिंदी में झूठे या अन्य देव के लिए “देवता” स्वाभाविक और स्पष्ट है।
- source_word: זָר
  choice: पराया
  rationale: यह इस्राएल की अधिकृत उपासना से बाहर के देवता को सूचित करता है। “पराया” निकट और सहज हिंदी है तथा दूसरे चरण के समानार्थी शब्द से भिन्नता बनाए रखता है।
- source_word: תִשְׁתַּחֲוֶה
  choice: दण्डवत न करना
  rationale: नकारात्मक अपूर्ण क्रिया का यहाँ निषेधात्मक बल है। “दण्डवत न करना” उपासना में झुकने के भाव को स्पष्ट और गरिमापूर्ण हिंदी में व्यक्त करता है।
- source_word: לְאֵל
  choice: देवता के आगे
  rationale: दण्डवत करने के साथ हिंदी मुहावरे में “के आगे” स्वाभाविक है और इब्रानी לְ के आराधनात्मक संबंध को ठीक से व्यक्त करता है।
- source_word: נֵכָר
  choice: विदेशी
  rationale: यह זָר का निकट-समानार्थी है। “विदेशी” काव्यात्मक समानांतरता में शब्द-विविधता को बचाता है, बिना किसी अलग श्रेणी के देवता का संकेत दिए।
theological_decisions:
- issue: व्याकरणिक एकवचन संबोधन का सामूहिक इस्राएल के लिए प्रयोग
  choice: “तेरे” और “तू” द्वारा एकवचन संबोधन को बनाए रखना
  alternative: “तुम्हारे बीच” और “तुम” द्वारा सामूहिक अर्थ को स्पष्ट करना
  rationale: इब्रानी इस्राएल को एक सामूहिक इकाई के रूप में एकवचन में संबोधित करता है। हिंदी का एकवचन इस रूपक और प्रत्यक्ष वाचा-संबोधन को बचाता है; इसे केवल व्यक्तिगत अर्थ तक सीमित नहीं किया गया है।
translation_notes:
  register: भाषा आधुनिक, सीधी और गरिमापूर्ण रखी गई है। “तेरे/तू” का प्रयोग असम्मानसूचक नहीं, बल्कि इब्रानी के सामूहिक एकवचन वाचा-संबोधन को सुरक्षित रखने के लिए है। काव्य-पंक्ति विभाजन मूल के दो समानांतर चरणों को दर्शाता है।
