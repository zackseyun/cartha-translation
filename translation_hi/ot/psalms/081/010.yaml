  text: אָנֹכִ֨י יְה֘וָ֤ה אֱלֹהֶ֗י/ךָ הַֽ֭/מַּעַלְ/ךָ מֵ/אֶ֣רֶץ מִצְרָ֑יִם הַרְחֶב פִּ֝֗י/ךָ וַ/אֲמַלְאֵֽ/הוּ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/081/010.yaml
  text: I am Yahweh your God[a], who brought you up from the land of Egypt. Open your mouth wide[b], and I will fill it.
translation:
  language: hi
  text: मैं याहवे, तुम्हारा परमेश्वर हूँ,[a] जो तुम्हें मिस्र देश से निकाल लाया। अपना मुँह पूरा खोलो,[b] और मैं उसे भर दूँगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जो तुम्हें मिस्र देश में से निकाल लाया।”
    reason: lexical_alternative
  - marker: b
    text: या, “अपना मुँह पूरा खोलो, ताकि मैं उसे भर दूँ।”
    reason: lexical_alternative
lexical_decisions:
- source_word: אָנֹכִי
  choice: मैं ... हूँ
  rationale: स्वतंत्र सर्वनाम से बल मिलता है; हिन्दी की परिचयात्मक नामवाचक रचना में ‘मैं ... हूँ’ स्वाभाविक है।
- source_word: יְהוָה
  choice: याहवे
  rationale: चार-अक्षरीय व्यक्तिगत ईश्वरीय नाम को उपाधि से बदलने के बजाय हिन्दी में लिप्यंतरित किया गया है।
- source_word: אֱלֹהֶיךָ
  choice: तुम्हारा परमेश्वर
  rationale: द्वितीय पुरुष एकवचन प्रत्यय सहित वाचा-संबंधी पहचान को स्पष्ट और गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: הַמַּעַלְךָ
  choice: जो तुम्हें ... से निकाल लाया
  rationale: עלה के हिफ़ील कृदंत का संदर्भ निर्गमन है। शाब्दिक ‘ऊपर ले आया’ की अपेक्षा ‘निकाल लाया’ आधुनिक हिन्दी में स्वाभाविक है और मिस्र से मुक्ति का आशय सुरक्षित रखता है।
- source_word: מֵאֶרֶץ מִצְרָיִם
  choice: मिस्र देश से
  rationale: מן के स्रोत/प्रस्थान भाव और मानक निर्गमन-सूत्र को संक्षेप तथा स्वाभाविक रूप से व्यक्त करता है।
- source_word: הַרְחֶב פִּיךָ
  choice: अपना मुँह पूरा खोलो
  rationale: हिफ़ील आज्ञार्थक और ‘मुँह’ के साथ इसका मुहावरेदार अर्थ ‘मुँह खूब/पूरा खोलना’ है; ‘पूरा’ साधारण हिन्दी में सहज है।
- source_word: וַאֲמַלְאֵהוּ
  choice: और मैं उसे भर दूँगा
  rationale: संयोजक ו को ‘और’, प्रथम पुरुष क्रिया को आश्वासनसूचक भविष्य, तथा पुल्लिंग प्रत्यय को ‘मुँह’ की ओर संकेत करने वाले ‘उसे’ से व्यक्त किया गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में व्यक्तिगत ईश्वरीय नाम है। ‘याहवे’ उसका व्यापक रूप से स्वीकृत विद्वत्तापूर्ण लिप्यंतरण है और उसे किसी उपाधि से प्रतिस्थापित नहीं करता।
- issue: וַאֲמַלְאֵהוּ में प्रतिज्ञा अथवा उद्देश्य
  choice: और मैं उसे भर दूँगा
  alternative: ताकि मैं उसे भर दूँ
  rationale: वाव सहित क्रिया आज्ञा के परिणामस्वरूप ईश्वरीय आश्वासन के रूप में पढ़ी जा सकती है; उद्देश्यसूचक अर्थ भी व्याकरण और संदर्भ में संभव है, इसलिए उसे पादटिप्पणी में रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी, एकवचन ‘तुम’ संबोधन और गरिमापूर्ण किंतु साधारण शब्दावली। निर्गमन-संबंधी गति को हिन्दी के स्वाभाविक ‘निकाल लाया’ से व्यक्त किया गया है; दूसरी पंक्ति की प्रतिज्ञा/उद्देश्य संबंधी अस्पष्टता पादटिप्पणी में सुरक्षित है।
