  text: हे मेरी प्रजा, सुनो, और मैं तुम्हारे विरुद्ध गवाही दूँगा[a]; हे इस्राएल, काश, तुम मेरी सुनते![b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मैं तुम्हें चेतावनी दूँगा,” अथवा “मैं तुम्हारे सामने गवाही दूँगा।”
    reason: lexical_alternative
