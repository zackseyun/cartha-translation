    text: इब्रानी को अधिक शब्दानुरूप रूप में “यदि तुम मेरी सुनते!” भी अनूदित किया जा सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: שְׁמַע
  choice: सुनो
  rationale: द्वितीय पुरुष एकवचन आज्ञार्थक रूप है। ‘सुनो’ सीधे आह्वान को व्यक्त करता है और अंतिम खंड में उसी धातु की पुनरावृत्ति को ‘मेरी सुनते’ के रूप में प्रतिध्वनित करता है।
- source_word: עַמִּי
  choice: मेरी प्रजा
  rationale: यह वाचा-संबंधी संबोधन है। ‘मेरी प्रजा’ आधुनिक हिन्दी में स्वाभाविक है और सामूहिक तथा संबंधपरक भाव बनाए रखता है।
- source_word: וְאָעִידָה בָּךְ
  choice: और मैं तुम्हारे विरुद्ध गवाही दूँगा
  rationale: עוד के हिफ़ील रूप के साथ בְּ यहाँ न्यायिक अथवा प्रतिकूल अर्थ दे सकता है। यह अनुवाद उस गंभीर चेतावनी और अभियोगात्मक बल को सुरक्षित रखता है।
- source_word: יִשְׂרָאֵל
  choice: हे इस्राएल
  rationale: यह प्रत्यक्ष संबोधन है; ‘हे’ काव्यात्मक गरिमा और संबोधन की स्पष्टता बनाए रखता है।
- source_word: אִם תִּשְׁמַע לִי
  choice: काश तुम मेरी सुनते!
  rationale: काव्यात्मक संदर्भ में אִם इच्छा अथवा व्याकुल अभिलाषा व्यक्त कर सकता है। ‘मेरी सुनना’ केवल ध्वनि सुनने के बजाय ध्यान देने और मानने का भाव देता है।
theological_decisions:
- issue: אִם תִּשְׁמַע לִי का बल
  choice: 'इच्छासूचक पुकार के रूप में: ‘काश तुम मेरी सुनते!’'
  alternative: 'अधिक शब्दानुरूप: ‘यदि तुम मेरी सुनते!’'
  rationale: यहाँ אִם को केवल सामान्य शर्त मानने से हिन्दी वाक्य अधूरा प्रतीत होगा। इच्छा-सूचक अनुवाद पद की भावनात्मक पुकार को स्पष्ट करता है, जबकि पादटिप्पणी अधिक शब्दानुरूप संभावना सुरक्षित रखती है।
- issue: וְאָעִידָה בָּךְ में गवाही की दिशा
  choice: ‘तुम्हारे विरुद्ध गवाही दूँगा’
  alternative: ‘तुम्हें चेतावनी दूँगा’ अथवा ‘तुम्हारे सामने गवाही दूँगा’
  rationale: עוד और בְּ का संयोजन इस चेतावनीपूर्ण संदर्भ में प्रतिकूल या न्यायिक अर्थ ग्रहण कर सकता है। मुख्य पाठ इस बल को रखता है, और पादटिप्पणी वास्तविक शब्दार्थगत विकल्पों को दर्ज करती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सार्वजनिक पाठ के अनुकूल रखी गई है। ‘प्रजा,’ ‘गवाही’ और ‘हे इस्राएल’ भजन की वाचा-संबंधी तथा न्यायिक गंभीरता बनाए रखते हैं; अंतिम ‘काश’ हिन्दी में इब्रानी की इच्छासूचक पुकार को स्वाभाविक बनाता है।
