id: PSA.81.7
reference: Psalms 81:7
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: בַּ/צָּרָ֥ה קָרָ֗אתָ וָ/אֲחַ֫לְּצֶ֥/ךָּ אֶ֭עֶנְ/ךָ בְּ/סֵ֣תֶר רַ֑עַם אֶבְחָֽנְ/ךָ֨ עַל מֵ֖י מְרִיבָ֣ה סֶֽלָה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/081/007.yaml
  text: In distress you called[a], and I rescued you; I answered you in the hiding place of thunder; I tested you at the waters of Meribah[b]. Selah
translation:
  language: hi
  text: 'संकट में तूने पुकारा, और मैंने तुझे छुड़ाया;

    मैंने गरज के गुप्त स्थान में तुझे उत्तर दिया[a];

    मैंने मरीबा के जल के पास तुझे परखा[b]। सेला'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘गरज के छिपे स्थान में,’ अथवा ‘गरज के गुप्त स्थान में से।’ यह इब्रानी चित्र संभवतः तूफ़ान में परमेश्वर की छिपी उपस्थिति को दर्शाता है।
    reason: lexical_alternative
  - marker: b
    text: मरीबा जंगल की उस घटना का स्मरण कराता है जहाँ पानी को लेकर इस्राएल ने झगड़ा किया और परमेश्वर ने उसे परखा (निर्गमन 17:1–7; गिनती 20:1–13)।
    reason: cross_reference
lexical_decisions:
- source_word: בַּצָּרָה
  choice: संकट में
  rationale: צָרָה संकट, विपत्ति या क्लेश की स्थिति को सूचित करता है। ‘संकट में’ संक्षिप्त, स्वाभाविक और प्रसंगानुकूल है।
- source_word: קָרָאתָ
  choice: तूने पुकारा
  rationale: यहाँ קרא सहायता के लिए पुकारने के अर्थ में है। कर्म को इब्रानी की तरह अनुक्त रखा गया है।
- source_word: וָאֲחַלְּצֶךָּ
  choice: और मैंने तुझे छुड़ाया
  rationale: हिफ़ील रूप में חלץ का अर्थ निकालना, छुड़ाना या बचाना है। ‘छुड़ाया’ निर्गमन और जंगल के प्रसंग के अनुकूल है।
- source_word: אֶעֶנְךָ
  choice: मैंने तुझे उत्तर दिया
  rationale: ענה का सामान्य अर्थ उत्तर देना है; यह सीधा और स्वाभाविक अनुवाद है।
- source_word: בְּסֵתֶר רַעַם
  choice: गरज के गुप्त स्थान में
  rationale: סֵתֶר छिपे या गुप्त स्थान को दर्शाता है। यह अनुवाद तूफ़ान में परमेश्वर की छिपी उपस्थिति की काव्यात्मक छवि और בְּ के मूल स्थानवाचक अर्थ को बनाए रखता है।
- source_word: אֶבְחָנְךָ
  choice: मैंने तुझे परखा
  rationale: בחן जाँचने या गुण सिद्ध करने के लिए परखने को दर्शाता है। ‘परखा’ इस आशय को सहज हिन्दी में व्यक्त करता है।
- source_word: עַל מֵי מְרִיבָה
  choice: मरीबा के जल के पास
  rationale: स्थानवाचक प्रसंग में עַל का अर्थ ‘के पास’ हो सकता है। मरीबा को स्थान-नाम के रूप में लिप्यंतरित किया गया है।
- source_word: סֶלָה
  choice: सेला
  rationale: इस उपासनात्मक या संगीत-संबंधी संकेत का ठीक अर्थ अनिश्चित है, इसलिए अनुमान से अनुवाद करने के बजाय लिप्यंतरण किया गया है।
theological_decisions:
- issue: ईश्वरीय वाणी और जंगल की घटनाओं के संकेत
  choice: पद को परमेश्वर के सीधे संबोधन के रूप में रखा गया है, जिसमें इस्राएल की पुकार, छुटकारा, गरज में दिया गया उत्तर और मरीबा पर परीक्षा स्मरण कराए जाते हैं।
  alternative: ‘गरज के गुप्त स्थान’ को केवल सीनै की घटना का स्पष्ट उल्लेख मानना, या परीक्षा को केवल दंडात्मक अर्थ में लेना।
  rationale: इब्रानी पाठ में प्रथम पुरुष की ईश्वरीय वाणी स्पष्ट है, पर ‘गरज के गुप्त स्थान’ का निश्चित ऐतिहासिक संदर्भ स्पष्ट नहीं है। यह सीनै, तूफ़ानी ईश्वर-दर्शन या परमेश्वर की छिपी उपस्थिति की ओर संकेत कर सकता है; इसलिए अनुवाद किसी एक व्याख्या को अनिवार्य नहीं बनाता।
translation_notes:
  register: आधुनिक मानक हिन्दी में काव्यात्मक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट शैली अपनाई गई है। एकवचन संबोधन के लिए ‘तू/तुझे’ रखा गया है, क्योंकि इब्रानी क्रियाएँ और सर्वनाम एकवचन हैं। ‘गरज के गुप्त स्थान’ की असामान्य किंतु सार्थक काव्यात्मक छवि को सरल व्याख्या में बदलने के बजाय सुरक्षित रखा गया है।
