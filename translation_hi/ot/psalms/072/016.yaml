language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: יְהִ֤י פִסַּת בַּ֨ר בָּ/אָרֶץ֮ בְּ/רֹ֪אשׁ הָ֫רִ֥ים יִרְעַ֣שׁ כַּ/לְּבָנ֣וֹן פִּרְי֑/וֹ וְ/יָצִ֥יצוּ מֵ֝/עִ֗יר כְּ/עֵ֣שֶׂב הָ/אָֽרֶץ־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/072/016.yaml
  text: May there be an abundance of grain in the land[a]; on the tops of the mountains may its fruit wave like Lebanon; and may people blossom from the city like the grass of the earth.
translation:
  language: hi
  text: देश में अनाज की बहुतायत हो[a]; पहाड़ों की चोटियों पर उसकी उपज लबानोन के समान लहराए; और नगर से लोग धरती की घास के समान फलें-फूलें।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘देश में मुट्ठी भर अनाज हो।’ यह इब्रानी पदबंध दुर्लभ है और इसका अर्थ अनिश्चित है। यह या तो थोड़ी-सी मात्रा के असाधारण रूप से फलदायी होने पर, या सीधे अनाज की बहुतायत पर बल दे सकता है।
    reason: वैकल्पिक पाठ और वास्तविक शब्दार्थगत अनिश्चितता को सुरक्षित रखना।
lexical_decisions:
- source_word: יְהִי
  choice: हो
  rationale: इच्छासूचक रूप को प्रार्थना या कामना के स्वाभाविक हिन्दी रूप में व्यक्त करता है।
- source_word: פִסַּת
  choice: बहुतायत
  rationale: यह दुर्लभ और विवादित संज्ञा है। प्रसंग में समृद्धि और असाधारण उपज का चित्र होने के कारण मुख्य पाठ में ‘बहुतायत’ उपयुक्त है; ‘मुट्ठी भर’ की सम्भावना पाद-टिप्पणी में सुरक्षित रखी गई है।
- source_word: בַּר
  choice: अनाज
  rationale: यहाँ शब्द सामान्य रूप से अन्न या धान्य-उपज को दर्शाता है; ‘अनाज’ आधुनिक हिन्दी में व्यापक और सहज पर्याय है।
- source_word: בָּאָרֶץ
  choice: देश में
  rationale: राजकीय आशीष और कृषि-समृद्धि के प्रसंग में यह राजा के अधीन भूभाग को सूचित करता है; इसलिए ‘धरती पर’ के बजाय ‘देश में’ चुना गया है।
- source_word: בְּרֹאשׁ הָרִים
  choice: पहाड़ों की चोटियों पर
  rationale: इब्रानी मुहावरे का सीधा और स्वाभाविक अनुवाद, जो अनुपजाऊ समझे जाने वाले ऊँचे स्थानों तक असाधारण उर्वरता का चित्र प्रस्तुत करता है।
- source_word: יִרְעַשׁ
  choice: लहराए
  rationale: मूल क्रिया हिलने या काँपने का भाव देती है। फसल के प्रसंग में ‘लहराए’ हवा में प्रचुर उपज की गति को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: כַּלְּבָנוֹן
  choice: लबानोन के समान
  rationale: लबानोन की भव्यता और सघन वनस्पति से की गई मूल तुलना को बिना व्याख्यात्मक विस्तार के बनाए रखता है।
- source_word: פִּרְיוֹ
  choice: उसका फल
  rationale: एकवचन प्रत्यय को बनाए रखते हुए इसे सामूहिक अनाज या उसकी उपज से सम्बद्ध किया गया है।
- source_word: וְיָצִיצוּ
  choice: लोग फलें-फूलें
  rationale: क्रिया अंकुरित होने या खिलने का बिंब देती है। नगर के संदर्भ से निहित मानवीय कर्ता ‘लोग’ स्पष्ट होता है, जबकि ‘फलें-फूलें’ वनस्पति-बिंब और मानवीय समृद्धि दोनों को स्वाभाविक हिन्दी में रखता है।
- source_word: מֵעִיר
  choice: नगर से
  rationale: मूल के एकवचन और ‘से’ के भाव को सुरक्षित रखता है; नगर सामूहिक या प्रतिनिधिक अर्थ में समझा जा सकता है।
- source_word: כְּעֵשֶׂב הָאָרֶץ
  choice: धरती की घास के समान
  rationale: बहुसंख्यक और तीव्र वृद्धि के मूल उपमान को निकट और स्पष्ट हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: दुर्लभ पदबंध פִסַּת בַּר का अर्थ
  choice: अनाज की बहुतायत
  alternative: मुट्ठी भर अनाज
  rationale: राजा के शासन में भरपूर आशीष की प्रार्थना, लबानोन के समान लहराती उपज और लोगों के फलने-फूलने का निकट प्रसंग बहुतायत के अर्थ का समर्थन करता है। फिर भी ‘मुट्ठी भर अनाज’ शब्दार्थ की वास्तविक और पारम्परिक सम्भावना है, इसलिए उसे पाद-टिप्पणी में रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण और प्रार्थनात्मक स्वर रखा गया है। कृषि और वनस्पति के मूल बिंबों को बनाए रखते हुए निहित मानवीय कर्ता को ‘लोग’ से स्पष्ट किया गया है।
