  yaml_path: translation/ot/psalms/072/014.yaml
  text: From oppression and violence he will redeem their life[b][a], and their blood will be precious in his eyes.
translation:
  language: hi
  text: अत्याचार और हिंसा से वह[b] उनके जीवन[a] का उद्धार करेगा, और उनका रक्त उसकी दृष्टि में अनमोल होगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उनके प्राण” अथवा “उनकी जान।” इब्रानी शब्द नेफ़ेश का अर्थ प्रसंग के अनुसार जीवन, प्राण, स्वयं या व्यक्ति हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: एकवचन “वह/उसकी” का सबसे स्वाभाविक संदर्भ इस भजन का राजा है, यद्यपि यह भाषा पीड़ितों के लिए परमेश्वर की अपनी उद्धारकारी देखभाल की भी अनुगूँज रखती है।
    reason: alternative_reading
lexical_decisions:
- source_word: מִתּוֹךְ
  choice: अत्याचार से
  rationale: यहाँ תּוֹךְ उत्पीड़न, दमन या अत्याचार का बोध कराता है; प्रसंग में निर्बलों पर होने वाले अन्याय के लिए ‘अत्याचार’ स्वाभाविक और स्पष्ट है।
- source_word: וּמֵחָמָס
  choice: और हिंसा से
  rationale: חָמָס हिंसा और क्रूर अन्याय दोनों का संकेत कर सकता है; ‘हिंसा’ मूल की ठोस और प्रबल छवि बनाए रखता है।
- source_word: יִגְאַל
  choice: उद्धार करेगा
  rationale: גאל का अर्थ छुड़ाना या मुक्त कराना है और इसमें उद्धारक की भूमिका की कानूनी-पारिवारिक अनुगूँज भी है; ‘उद्धार करेगा’ सामान्य बचाव से अधिक इस गहराई को सुरक्षित रखता है।
- source_word: נַפְשָׁם
  choice: उनके जीवन
  rationale: נֶפֶשׁ यहाँ मनुष्य के जीवन या प्राण को दर्शाता है, केवल अमूर्त आत्मा को नहीं। ‘उनके जीवन’ आधुनिक हिन्दी में स्वाभाविक है और समूहवाचक भाव बनाए रखता है।
- source_word: וְיֵיקַר
  choice: अनमोल होगा
  rationale: יקר बहुमूल्य, प्रिय या अत्यधिक मूल्यवान होने का भाव व्यक्त करता है; ‘अनमोल’ हिन्दी में सहज रूप से उस उच्च मूल्य और आदर को प्रकट करता है।
- source_word: דָּמָם
  choice: उनका रक्त
  rationale: मूल का ठोस शब्द ‘रक्त’ ही रखा गया है; प्रसंग में इसका आशय है कि उनका जीवन सस्ता या व्यर्थ बहाए जाने योग्य नहीं है।
- source_word: בְּעֵינָיו
  choice: उसकी दृष्टि में
  rationale: यह इब्रानी मुहावरे ‘उसकी आँखों में’ का स्वाभाविक हिन्दी रूप है और उसके मूल्यांकन तथा आदर को व्यक्त करता है।
theological_decisions:
- issue: एकवचन ‘वह/उसकी’ का संदर्भ
  choice: मुख्य पाठ में एकवचन सर्वनाम रखकर तत्काल संदर्भ के राजा को सबसे स्वाभाविक संदर्भ माना गया है।
  alternative: इसे सीधे परमेश्वर के विषय में समझना, जो पीड़ितों का उद्धार करता और उनके रक्त को अनमोल मानता है।
  rationale: भजन के निकटवर्ती संदर्भ में एकवचन क्रियाएँ और सर्वनाम राजा की ओर संकेत करते हैं, पर वर्णित उद्धारकारी न्याय परमेश्वर की देखभाल की भी अनुगूँज रखता है। पादटिप्पणी इस तनाव को बिना निर्णायक रूप से मिटाए सुरक्षित रखती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘उद्धार करेगा’ मूल क्रिया की छुड़ाने वाली गहराई रखता है; ‘रक्त’ और ‘दृष्टि में’ काव्यात्मक गरिमा बनाए रखते हैं।
