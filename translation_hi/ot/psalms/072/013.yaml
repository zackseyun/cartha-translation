  terminology: “गरीब” and “ज़रूरतमंद” are clear modern-Hindi equivalents that preserve the source’s poetic distinction between poor/weak and needy. “प्राण” is suitable here, with a note preserving “जीवन,” “व्यक्ति,” and “आत्मा” as contextual possibilities for נֶפֶשׁ.
