  text: יָ֭חֹס עַל דַּ֣ל וְ/אֶבְי֑וֹן וְ/נַפְשׁ֖וֹת אֶבְיוֹנִ֣ים יוֹשִֽׁיעַ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/072/013.yaml
  text: He will have compassion on the poor and needy[a], and he will save the lives of the needy.
translation:
  language: hi
  text: 'वह गरीबों और ज़रूरतमंदों पर दया करेगा,

    और ज़रूरतमंदों के प्राण बचाएगा।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יָחֹס
  choice: दया करेगा
  rationale: यह क्रिया असहाय लोगों के प्रति करुणामय चिंता या दया व्यक्त करती है। हिंदी में “दया करेगा” स्वाभाविक है और अगले चरण में बचाने के कार्य के साथ उपयुक्त बैठता है।
- source_word: דַּל
  choice: दीन
  rationale: यह शब्द आर्थिक गरीबी के साथ कमजोरी और सामाजिक असहायता भी दर्शा सकता है। “दीन” इस व्यापक अर्थ को संक्षेप में बनाए रखता है।
- source_word: אֶבְיוֹן
  choice: ज़रूरतमंद
  rationale: यह अभावग्रस्त या सहायता की आवश्यकता वाले व्यक्ति को दर्शाता है। “ज़रूरतमंद” दַּל से काव्यात्मक भेद बनाए रखता है और आधुनिक हिंदी में स्पष्ट है।
- source_word: נַפְשׁוֹת
  choice: प्राण
  rationale: इस संदर्भ में נֶפֶשׁ लोगों के जीवन या जीवित व्यक्तित्व को सूचित करता है। “प्राण बचाएगा” स्वाभाविक हिंदी है और इसे केवल देह से अलग किसी अमूर्त आत्मा तक सीमित नहीं करता।
- source_word: יוֹשִׁיעַ
  choice: बचाएगा
  rationale: हिफ़ील रूप यहाँ ठोस संकट से बचाने या छुड़ाने का अर्थ देता है। “बचाएगा” सीधा, सहज और संदर्भानुकूल है।
theological_decisions:
- issue: मानव-स्वरूप के संदर्भ में נַפְשׁוֹת का अर्थ
  choice: “प्राण” के रूप में अनुवाद, जिसका आशय यहाँ जीवन है
  alternative: “जीवन” या “प्राणों/आत्माओं”
  rationale: राजकीय रक्षा और उद्धार के इस संदर्भ में शब्द का प्रमुख आशय ज़रूरतमंदों का जीवन है। “प्राण” मूल की अर्थ-विस्तारिता को कुछ हद तक बनाए रखते हुए बाद की कठोर देह-आत्मा द्वैत धारणा को अनावश्यक रूप से आरोपित नहीं करता; पादटिप्पणी वैकल्पिक अर्थ स्पष्ट करती है।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण काव्यात्मक शैली रखी गई है। “दीन” और “ज़रूरतमंद” मूल के दो निकटार्थक शब्दों का भेद बनाए रखते हैं; “ज़” का प्रयोग प्रचलित मानक वर्तनी के अनुसार है।
