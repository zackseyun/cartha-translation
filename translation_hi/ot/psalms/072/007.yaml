    text: या, “वह धर्मी पनपेगा”; एकवचन स्वयं राजा या आदर्श शासक की ओर भी संकेत कर सकता है।
    reason: alternative_reading
  - marker: b
    text: “शांति” के मूल शब्द में कुशलता, संपूर्णता और समृद्धि का भाव भी समाया है।
    reason: lexical_alternative
