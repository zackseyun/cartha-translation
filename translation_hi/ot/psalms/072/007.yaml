lexical_decisions:
- source_word: יִפְרַח
  choice: फलेंगे
  rationale: פרח का मूल चित्र अंकुरित होने, फूलने और फलने-फूलने का है। यहाँ रूपक रूप में समृद्ध होने के अर्थ को स्वाभाविक हिन्दी में व्यक्त करने के लिए ‘फलेंगे’ चुना गया है।
- source_word: בְּיָמָיו
  choice: उसके दिनों में
  rationale: यह इब्रानी पदबंध के निकट है और प्रसंग में राजा के शासनकाल को सूचित करता है, बिना अर्थ को अनावश्यक रूप से विस्तृत किए।
- source_word: צַדִּיק
  choice: धर्मी
  rationale: रूप की दृष्टि से यह एकवचन है, पर संज्ञा की तरह प्रयुक्त विशेषण सामूहिक अर्थ भी रख सकता है। हिन्दी में ‘धर्मी’ एकवचन और सामूहिक दोनों की वास्तविक अस्पष्टता बनाए रखता है; बहुवचन क्रिया प्रसंगानुकूल सामूहिक अर्थ दर्शाती है।
- source_word: וְרֹב
  choice: और ... भरपूरी होगी
  rationale: רֹב बहुतायत या प्रचुरता बताता है। हिन्दी में निहित अस्तित्ववाचक भाव को ‘होगी’ से स्पष्ट करते हुए संज्ञात्मक बल बनाए रखा गया है।
- source_word: שָׁלוֹם
  choice: शान्ति
  rationale: यह पारदर्शी और परम्परागत अर्थ है; शब्द में निहित कुशलता, सम्पूर्णता और समृद्धि के व्यापक भाव को पादटिप्पणी में रखा गया है।
- source_word: עַד בְּלִי יָרֵחַ
  choice: चाँद के न रहने तक
  rationale: यह इब्रानी के काव्यात्मक चित्र ‘जब तक चाँद न रहे’ के निकट है और अत्यन्त दीर्घ या स्थायी अवधि का भाव बिना व्याख्यात्मक विस्तार के बचाए रखता है।
theological_decisions:
- issue: राजकीय या मसीही भजन में צַדִּיק का दायरा
  choice: मुख्य पाठ में ‘धर्मी’ को सामूहिक अर्थ के अनुकूल रखा गया है
  alternative: ‘धर्मी जन’ अथवा ‘वह धर्मी’—दूसरा विकल्प स्वयं राजा या आदर्श शासक की ओर संकेत कर सकता है
  rationale: एकवचन रूप सामूहिक रूप से प्रयुक्त हो सकता है, और समानांतर खंड में व्यापक शान्ति का उल्लेख धर्मी लोगों के फलने का समर्थन करता है। फिर भी मूल का एकवचन पूरी तरह मिटाया नहीं गया; पादटिप्पणी वैकल्पिक व्यक्तिगत अर्थ सुरक्षित रखती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और काव्यात्मक रखी गई है। ‘उसके दिनों में’ और ‘चाँद के न रहने तक’ मूल इब्रानी चित्रों के निकट हैं। ‘शान्ति की भरपूरी’ साधारण पाठक के लिए स्पष्ट रहते हुए רֹב שָׁלוֹם की संज्ञात्मक प्रचुरता को बनाए रखती है।
