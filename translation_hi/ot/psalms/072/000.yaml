  yaml_path: translation/ot/psalms/072/000.yaml
  text: Of Solomon.[a] O God, give your justice to the king, and your righteousness[b] to the king's son.
translation:
  language: hi
  text: 'सुलैमान का।[a]


    हे परमेश्वर, राजा को अपना न्याय दे,

    और राजपुत्र को अपनी धार्मिकता।[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शीर्षक का अनुवाद “सुलैमान के लिए” या “सुलैमान को” भी हो सकता है।
    reason: alternative_reading
  - marker: b
    text: “अपनी धार्मिकता” का अनुवाद “अपना न्याय” भी किया जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: לִשְׁלֹמֹה
  choice: सुलैमान का
  rationale: शीर्षक में לְ संबंध, समर्पण या लेखकत्व सूचित कर सकता है; मुख्य पाठ में स्वाभाविक पारंपरिक रूप रखा गया और अन्य संभावनाएँ पादटिप्पणी में दी गईं।
- source_word: מִשְׁפָּטֶיךָ
  choice: अपना न्याय
  rationale: बहुवचन रूप यहाँ राजा को परमेश्वर के न्याय-सिद्धांत या न्यायपूर्ण निर्णय देने के सामूहिक अर्थ में है; सहज हिन्दी में एकवचन भाववाचक संज्ञा उपयुक्त है।
- source_word: צִדְקָתְךָ
  choice: अपनी धार्मिकता
  rationale: צְדָקָה न्याय, धर्मपरायणता और सही व्यवस्था का विस्तृत अर्थ रखता है। 'धार्मिकता' इसे מִשְׁפָּט से अलग रखते हुए मूल की शब्दावली और धर्मवैचारिक तनाव बचाती है।
- source_word: בֶן־מֶלֶךְ
  choice: राजपुत्र
  rationale: शाब्दिक अर्थ 'राजा का पुत्र' है; काव्यात्मक समानांतरता में यह उसी राजकीय व्यक्ति को इंगित कर सकता है। 'राजपुत्र' संक्षिप्त और गरिमापूर्ण है।
theological_decisions:
- issue: परमेश्वर के न्याय और धार्मिकता का राजा को दिया जाना
  choice: दोनों पदों को अलग शब्दों—'न्याय' और 'धार्मिकता'—से रखा गया
  alternative: दोनों का अनुवाद 'न्याय' करना
  rationale: मूल में מִשְׁפָּט और צְדָקָה अलग शब्द हैं। समानार्थक निकटता के बावजूद भेद बनाए रखने से परमेश्वर-प्रदत्त राजकीय शासन के दोनों आयाम सुरक्षित रहते हैं।
- issue: शीर्षक में सुलैमान से संबंध
  choice: मुख्य पाठ में 'सुलैमान का' और पादटिप्पणी में अन्य अर्थ
  alternative: '''सुलैमान के लिए'' या ''सुलैमान को'''
  rationale: हिब्रू לְ बहुअर्थी है; लेखकत्व, समर्पण या संबंध में से किसी एक को निश्चित नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण काव्य-शैली अपनाई गई है। संबोधन में 'हे परमेश्वर' सामान्य पाठक के लिए स्पष्ट है। पंक्ति-विन्यास हिब्रू समानांतरता दर्शाता है; अस्पष्ट शीर्षकीय לְ और צְדָקָה की अर्थ-सीमा पादटिप्पणियों में सुरक्षित रखी गई है।
