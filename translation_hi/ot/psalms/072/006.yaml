  yaml_path: translation/ot/psalms/072/006.yaml
  text: May he come down like rain on mown grass[c][b][a], like showers that water the earth.
translation:
  language: hi
  text: वह कटी हुई घास[b] पर वर्षा के समान उतरे[a], धरती[c] को सींचने वाली बौछारों के समान।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वह कटी हुई घास पर वर्षा के समान उतरेगा।” इस संदर्भ में इब्रानी अपूर्ण क्रिया को कामना/प्रार्थना या भविष्य-वर्णन—दोनों रूपों में समझा जा सकता है।
    reason: alternative_reading
  - marker: b
    text: “कटी हुई घास” का अर्थ “काटी गई घास” भी हो सकता है। कुछ लोग इब्रानी शब्द को “कतराया हुआ ऊन” समझते हैं, पर यहाँ कृषि-संबंधी बिंब संदर्भ के अधिक अनुकूल है।
    reason: lexical_alternative
  - marker: c
    text: “धरती” के लिए “भूमि” या “ज़मीन” भी संभव है।
    reason: lexical_alternative
lexical_decisions:
- source_word: יֵרֵד
  choice: वह ... उतरे
  rationale: ירד का मूल अर्थ ‘नीचे उतरना’ है। राजकीय आशीष और प्रार्थना के इस संदर्भ में अपूर्ण रूप को कामनासूचक रूप ‘उतरे’ के रूप में रखा गया है; यह भविष्यसूचक अर्थ की संभावना को पादटिप्पणी में सुरक्षित रखता है।
- source_word: כְּמָטָר
  choice: वर्षा के समान
  rationale: उपमा-सूचक כ और מָטָר का सीधा और काव्यात्मक हिन्दी रूप।
- source_word: עַל
  choice: पर
  rationale: यहाँ सतह या लक्ष्य के अर्थ में स्वाभाविक आधुनिक हिन्दी पूर्वसर्ग।
- source_word: גֵּז
  choice: कटी हुई घास
  rationale: संज्ञा किसी काटी या कतराई हुई वस्तु को दर्शाती है। वर्षा और धरती के कृषि-बिंब में ‘कटी हुई घास’ उपयुक्त है, यद्यपि ‘ऊन’ भी संभव समझा गया है।
- source_word: כִּרְבִיבִים
  choice: बौछारों के समान
  rationale: רְבִיבִים प्रचुर वर्षा या बौछारों को दर्शाता है और पहले चरण की उपमा के समानांतर है।
- source_word: זַרְזִיף
  choice: सींचने वाली
  rationale: यह दुर्लभ रूप टपकने या बरसने की क्रिया/प्रभाव बताता है। हिन्दी में क्रियाविशेषणात्मक विशेषण ‘सींचने वाली’ अर्थ और स्वाभाविकता दोनों बनाए रखता है।
- source_word: אֶרֶץ
  choice: धरती
  rationale: אֶרֶץ का अर्थ धरती, भूमि या देश हो सकता है। इस वर्षा-बिंब में ‘धरती’ व्यापक और स्वाभाविक काव्यात्मक विकल्प है।
theological_decisions:
- issue: राजकीय प्रार्थना में अपूर्ण क्रिया יֵרֵד का भाव
  choice: 'कामना/प्रार्थना: ‘वह ... उतरे’'
  alternative: 'भविष्य-वर्णन: ‘वह ... उतरेगा’'
  rationale: भजन 72 की आशीष और प्रार्थना की भाषा कामनासूचक पाठ का समर्थन करती है, पर इब्रानी अपूर्ण रूप भविष्य-वर्णन भी हो सकता है; इसलिए वैकल्पिक अर्थ पादटिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज और काव्यात्मक शैली। ‘उतरे’ प्रार्थनात्मक भाव रखता है; दोनों समानांतर उपमाओं को स्पष्ट करने के लिए दूसरे चरण में ‘हो’ जोड़ा गया है। सभी वैकल्पिक अर्थ पादटिप्पणियों में सुरक्षित हैं।
