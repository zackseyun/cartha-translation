    reason: lexical_and_syntactic_alternative
lexical_decisions:
- source_word: יִשְׂאוּ
  choice: लाएँ
  rationale: נָשָׂא का मूल अर्थ ‘उठाना/ढोना’ है, पर यहाँ पहाड़ों द्वारा शान्ति उत्पन्न करने या पहुँचाने की काव्यात्मक छवि में ‘लाएँ’ स्वाभाविक है। अपूर्ण क्रिया को प्रार्थनात्मक कामना के रूप में रखा गया है।
- source_word: שָׁלוֹם
  choice: शान्ति
  rationale: यह शब्द शान्ति के साथ-साथ कुशलता और समृद्धि का व्यापक भाव रख सकता है; ‘शान्ति’ मूल काव्यात्मक और धार्मिक अर्थ को सहज रूप से व्यक्त करती है।
- source_word: לָעָם
  choice: प्रजा के लिए
  rationale: ל यहाँ लाभार्थक अर्थ दे सकता है। राजकीय भजन के संदर्भ में עָם के लिए ‘प्रजा’ उपयुक्त है; ‘प्रजा तक’ भी सम्भव है।
- source_word: וּגְבָעוֹת
  choice: और पहाड़ियाँ
  rationale: यह ‘पहाड़’ के समानांतर प्रयुक्त स्पष्ट बहुवचन संज्ञा है और संयोजक ‘और’ मूल में उपस्थित है।
- source_word: בִּצְדָקָה
  choice: धार्मिकता के द्वारा
  rationale: ב साधन या रीति बता सकता है। ‘के द्वारा’ शान्ति और धार्मिकता के संबंध को हिन्दी में स्पष्ट करता है, जबकि ‘न्याय के द्वारा’ भी संदर्भतः सम्भव है।
theological_decisions:
- issue: राजकीय प्रार्थना में अपूर्ण क्रिया का बल
  choice: 'कामना: ‘लाएँ’'
  alternative: 'भविष्यवाणी: ‘लाएँगे’'
  rationale: भजन 72 की प्रार्थना और आशीष की पृष्ठभूमि में यह साधारण भविष्यवाणी से अधिक इच्छा या विनती व्यक्त करता है।
- issue: בִּצְדָקָה का वाक्यगत संबंध
  choice: पहाड़ियाँ भी शान्ति लाएँ—धार्मिकता के द्वारा
  alternative: पहाड़ियाँ धार्मिकता लाएँ
  rationale: मसोरेटी पाठ में צְדָקָה से पहले בְּ स्पष्ट है; इसलिए उसे सीधे समानांतर कर्म बना देना मूल के व्याकरणिक संकेत को कम कर देता है। संक्षिप्त दूसरी पंक्ति में पहली क्रिया और कर्म अध्याहृत माने गए हैं।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सहज हिन्दी। ‘प्रजा’ राजकीय संदर्भ को व्यक्त करती है। दूसरी काव्य-पंक्ति की संक्षिप्तता कुछ हद तक सुरक्षित रखते हुए हिन्दी में अर्थबोध बनाए रखा गया है।
