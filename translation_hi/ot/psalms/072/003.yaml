  text: May the mountains bring peace to the people[a], and the hills[c][b], in righteousness.
translation:
  language: hi
  text: पहाड़ प्रजा तक शान्ति लाएँ[a], और पहाड़ियाँ धार्मिकता के द्वारा शान्ति लाएँ[b]।
  philosophy: optimal-equivalence
