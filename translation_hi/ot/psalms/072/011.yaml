reference: Psalms 72:11
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/יִשְׁתַּחֲווּ ל֥/וֹ כָל מְלָכִ֑ים כָּל גּוֹיִ֥ם יַֽעַבְדֽוּ/הוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/072/011.yaml
  text: May all kings bow down before him[a]; may all nations serve him.
translation:
  language: hi
  text: सभी राजा उसके सामने झुकें[a]; सभी राष्ट्र उसकी सेवा करें।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उसकी आराधना करें”; “झुकें” और “सेवा करें” के लिए प्रयुक्त इब्रानी क्रियाएँ राजकीय सम्मान के साथ-साथ धार्मिक भाव भी व्यक्त कर सकती हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיִשְׁתַּחֲווּ
  choice: झुकें
  rationale: यह क्रिया दण्डवत् होने या सम्मानपूर्वक झुकने का भाव रखती है। राजकीय संदर्भ में ‘झुकें’ स्वाभाविक है और इसे केवल धार्मिक आराधना तक सीमित नहीं करता। अपूर्ण क्रिया को प्रसंगानुसार कामनासूचक रूप में व्यक्त किया गया है।
- source_word: לוֹ
  choice: उसके सामने
  rationale: इस क्रिया के साथ ל सम्मान जिस व्यक्ति की ओर निर्देशित है उसे बताता है; आधुनिक हिन्दी में ‘उसके सामने झुकें’ स्वाभाविक और अर्थ-संगत है।
- source_word: כָל מְלָכִים
  choice: सभी राजा
  rationale: मूल पाठ के सार्वभौमिक विस्तार और राजकीय संदर्भ को सीधे बनाए रखता है।
- source_word: כָל גּוֹיִם
  choice: सभी राष्ट्र
  rationale: यहाँ גּוֹיִם संसार के राष्ट्रों को व्यापक रूप से दर्शाता है और ‘सभी राजा’ के समानांतर है।
- source_word: יַעַבְדוּהוּ
  choice: उसकी सेवा करें
  rationale: עבד का मूल अर्थ ‘सेवा करना’ है, जिसमें प्रसंगानुसार राजकीय अधीनता और धार्मिक सेवा दोनों के संकेत हो सकते हैं। ‘सेवा करें’ इस व्यापकता को सुरक्षित रखता है।
theological_decisions:
- issue: क्या राजा के संबंध में दोनों क्रियाओं का अनुवाद स्पष्ट रूप से ‘आराधना’ की भाषा में किया जाए
  choice: ‘उसके सामने झुकें’ और ‘उसकी सेवा करें’ जैसे व्यापक सम्मान और सेवा के शब्द बनाए रखे गए।
  alternative: एक या दोनों क्रियाओं के लिए ‘उसकी आराधना करें’।
  rationale: भजन 72 का तत्काल संदर्भ राजकीय है, जबकि इसकी भाषा में धार्मिक और मसीही अनुगूँज की संभावना भी बनी रहती है। स्पष्ट ‘आराधना’ चुनना इब्रानी की राजनीतिक-धार्मिक व्यापकता को समय से पहले संकुचित कर देता।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और सहज अभिव्यक्ति। ‘दण्डवत् हों’ की अपेक्षा ‘झुकें’ सामान्य पाठक के लिए अधिक स्वाभाविक है, जबकि पादटिप्पणी मूल क्रियाओं की धार्मिक अर्थ-छाया सुरक्षित रखती है।
