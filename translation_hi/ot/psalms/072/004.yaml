  yaml_path: translation/ot/psalms/072/004.yaml
  text: May he judge the poor of the people[a], save the children of the needy, and crush the oppressor.
translation:
  language: hi
  text: वह प्रजा के दीन-दुखियों का न्याय करे[a], ज़रूरतमंदों के बच्चों को बचाए और अत्याचारी को कुचल डाले।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वह प्रजा के दीन-दुखियों का न्याय करेगा, ज़रूरतमंदों के बच्चों को बचाएगा और अत्याचारी को कुचल डालेगा।” इस प्रसंग में हिब्रू की अपूर्ण क्रियाएँ भविष्य या प्रार्थना/कामना—दोनों रूपों में समझी जा सकती हैं।
    reason: alternative_reading
lexical_decisions:
- source_word: יִשְׁפֹּט
  choice: न्याय करे
  rationale: שׁפט के न्यायिक अर्थ को बनाए रखते हुए हिब्रू अपूर्ण क्रिया का प्रार्थनात्मक/इच्छासूचक भाव स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: עֲנִיֵּי עָם
  choice: प्रजा के दीन-दुखियों
  rationale: עֲנִיִּים की गरीबी और पीड़ित दशा दोनों को व्यक्त करता है तथा construct संबंध को ‘प्रजा के’ द्वारा सुरक्षित रखता है।
- source_word: יוֹשִׁיעַ
  choice: बचाए
  rationale: हिफ़ील रूप के बचाने या छुड़ाने के प्रबल अर्थ का सीधा और सामान्य हिन्दी रूप।
- source_word: לִבְנֵי אֶבְיוֹן
  choice: ज़रूरतमंदों के बच्चों को
  rationale: בני को लिंग-समावेशी सामूहिक अर्थ में ‘बच्चों’ और אֶבְיוֹן को पहले पद के עניים से अलग रखते हुए ‘ज़रूरतमंदों’ अनूदित किया गया है।
- source_word: וִידַכֵּא
  choice: और ... कुचल डाले
  rationale: דכא की तीव्र ‘कुचलने/तोड़ डालने’ की छवि को सुरक्षित रखता है; ‘डाले’ हिन्दी में निर्णायक बल देता है।
- source_word: עוֹשֵׁק
  choice: अत्याचारी
  rationale: शोषण और उत्पीड़न करने वाले व्यक्ति के कृदन्तीय अर्थ को संक्षिप्त, स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: पूरे पद में क्रियाओं का भाव
  choice: प्रार्थना/कामना-सूचक रूप (‘करे’, ‘बचाए’, ‘कुचल डाले’)
  alternative: साधारण भविष्य (‘वह ... न्याय करेगा, ... बचाएगा और ... कुचल डालेगा’)
  rationale: भजन 72 की राजकीय प्रार्थना की पृष्ठभूमि में अपूर्ण क्रियाएँ कामना के रूप में स्वाभाविक हैं, पर भविष्यवाची अर्थ भी व्याकरणतः संभव है; इसलिए विकल्प पादटिप्पणी में सुरक्षित है।
