base_translation:
  language: en
  yaml_path: translation/ot/psalms/072/015.yaml
  text: May he live[a], and may gold from Sheba be given to him. May prayer be made for him continually[b]; all day long may they bless him.
translation:
  language: hi
  text: वह जीवित रहे! उसे शेबा का सोना दिया जाए[a]। उसके लिए निरंतर प्रार्थना की जाए[b]; दिन भर लोग उसे आशीष देते रहें।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक शब्दशः: “और वह उसे शेबा का सोना दे।” इब्रानी क्रिया कर्तृवाच्य में है, पर उसका कर्ता स्पष्ट नहीं है।'
    reason: lexical_alternative
  - marker: b
    text: या “और कोई उसके लिए निरंतर प्रार्थना करे।” इब्रानी में कर्ता स्पष्ट रूप से नहीं बताया गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וִיחִי
  choice: वह जीवित रहे
  rationale: क़ाल जुसिव रूप इच्छा या आशीर्वचन व्यक्त करता है; यह अनुवाद उसके कामनात्मक भाव को स्वाभाविक हिन्दी में रखता है।
- source_word: וְיִתֶּן לוֹ
  choice: उसे ... दिया जाए
  rationale: इब्रानी क्रिया कर्तृवाच्य में है, पर कर्ता बताया नहीं गया है। हिन्दी का कर्मवाच्य किसी कर्ता को जोड़े बिना भेंट दिए जाने का अर्थ स्वाभाविक रूप से व्यक्त करता है।
- source_word: מִזְּהַב שְׁבָא
  choice: शेबा का सोना
  rationale: यह पदबंध शेबा से आने वाले सोने या शेबा के सोने को दर्शाता है; संक्षिप्त हिन्दी अभिव्यक्ति भौगोलिक संबंध बनाए रखती है।
- source_word: וְיִתְפַּלֵּל בַּעֲדוֹ
  choice: उसके लिए ... प्रार्थना की जाए
  rationale: हिटपएल क्रिया और בַּעֲדוֹ का अर्थ उसके पक्ष में प्रार्थना करना है। कर्ता अनिर्दिष्ट होने के कारण कर्मवाच्य उपयुक्त है।
- source_word: תָמִיד
  choice: निरंतर
  rationale: यह शब्द लगातार या नियमित रूप से जारी रहने का भाव देता है और काव्यात्मक हिन्दी में सहज है।
- source_word: כָּל הַיּוֹם
  choice: दिन भर
  rationale: समूचे दिन की अवधि को आधुनिक हिन्दी में स्वाभाविक ढंग से व्यक्त करता है।
- source_word: יְבָרֲכֶנְהוּ
  choice: लोग उसे आशीष देते रहें
  rationale: क्रिया का आशय राजा के लिए निरंतर आशीष कहना या देना है। हिन्दी में ‘लोग’ अनिर्दिष्ट सार्वजनिक कर्ता को स्वाभाविक रूप से व्यक्त करता है, बिना किसी खास व्यक्ति की पहचान तय किए।
theological_decisions:
- issue: भजन 72 में राजकीय विनतियों का अभिप्रेत व्यक्ति
  choice: पद को राजा के लिए प्रार्थना और शुभकामना के रूप में रखा गया है, बिना अनुवाद में स्पष्ट मसीही पहचान जोड़े।
  alternative: इसे सीधे मसीह के विषय में भविष्यवाणी के रूप में अनूदित करना।
  rationale: इब्रानी पाठ का निकटतम संदर्भ राजा के लिए विनती है; यह रूप व्यापक मसीही या प्रतीकात्मक पाठ को न तो थोपता है, न रोकता है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सुबोध हिन्दी अपनाई गई है। जुसिव भाव के लिए ‘रहे/जाए’ और अनिर्दिष्ट कर्ताओं के लिए जहाँ उचित था वहाँ कर्मवाच्य रखा गया है।
