  text: וְ֭/יֵרְדְּ מִ/יָּ֣ם עַד יָ֑ם וּ֝/מִ/נָּהָ֗ר עַד אַפְסֵי אָֽרֶץ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/072/008.yaml
  text: May he rule from sea to sea[b][a], and from the River to the ends of the earth.
translation:
  language: hi
  text: वह समुद्र से समुद्र तक,[a] और महानदी[b] से पृथ्वी के छोरों तक शासन करे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वह समुद्र से समुद्र तक और महानदी से पृथ्वी के छोरों तक शासन करेगा।”
    reason: alternative_reading
  - marker: b
    text: “महानदी” से सम्भवतः फरात नदी का संकेत है, जिसे बाइबल में प्रायः एक भौगोलिक सीमा माना गया है।
    reason: cultural_note
lexical_decisions:
- source_word: וְיֵרְדְּ
  choice: शासन करे
  rationale: רדה का अर्थ ‘शासन करना/प्रभुता रखना’ है। इस राजकीय प्रार्थना के संदर्भ में ‘शासन करे’ इच्छासूचक भाव को स्वाभाविक और गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: מִיָּם עַד יָם
  choice: समुद्र से समुद्र तक
  rationale: यह व्यापक भौगोलिक विस्तार व्यक्त करने वाला काव्यात्मक प्रयोग है। हिन्दी में यही रूप समानांतरता बनाए रखता है और किसी विशेष समुद्र की पहचान अनावश्यक रूप से तय नहीं करता।
- source_word: וּמִנָּהָר
  choice: और महानदी से
  rationale: संज्ञा נהר यहाँ निश्चित भौगोलिक सीमा के रूप में प्रयुक्त है और सम्भवतः फरात को सूचित करती है। ‘महानदी’ बाइबलीय भौगोलिक पद का संकेत देते हुए मूल पाठ की अप्रत्यक्षता बचाता है; स्पष्ट पहचान टिप्पणी में दी गई है।
- source_word: עַד אַפְסֵי אָרֶץ
  choice: पृथ्वी के छोरों तक
  rationale: אַפְסֵי का अर्थ दूरस्थ सीमाएँ या छोर है। यह हिन्दी पद मूल के विश्वव्यापी भौगोलिक विस्तार को स्पष्ट और काव्यात्मक ढंग से व्यक्त करता है।
theological_decisions:
- issue: राजकीय भजन में अपूर्ण क्रिया का इच्छासूचक अथवा भविष्यसूचक बल
  choice: 'इच्छा/प्रार्थना के रूप में: ‘वह ... शासन करे’'
  alternative: 'भविष्यवाणी के रूप में: ‘वह ... शासन करेगा’'
  rationale: आस-पास का संदर्भ राजा के लिए की गई प्रार्थना है, इसलिए इच्छासूचक अनुवाद उपयुक्त है। फिर भी रूप भविष्यसूचक भी समझा जा सकता है; इस वास्तविक अर्थगत तनाव को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और काव्यात्मक रूप अपनाया गया है। ‘शासन करे’ प्रार्थनात्मक स्वर बनाए रखता है। पादटिप्पणी [a] को संबंधित क्रियात्मक कथन के बाद और [b] को पूरे पद के अंत में रखा गया है।
