  text: יִֽירָא֥וּ/ךָ עִם שָׁ֑מֶשׁ וְ/לִ/פְנֵ֥י יָ֝רֵ֗חַ דּ֣וֹר דּוֹרִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/072/005.yaml
  text: May they fear you as long as the sun endures[a], and before the moon[c][b], through all generations.
translation:
  language: hi
  text: जब तक सूर्य और चन्द्रमा बने रहें, वे पीढ़ी-दर-पीढ़ी तेरा भय मानें।[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वे तेरा भय मानेंगे”; इब्रानी रूप को कामना के बजाय भविष्यसूचक कथन भी समझा जा सकता है।
    reason: alternative_reading
  - marker: b
    text: शाब्दिक रूप से, “सूर्य के साथ और चन्द्रमा के सामने”; यह काव्यात्मक प्रयोग सदा बनी रहने वाली अवधि व्यक्त करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: יִירָאוּךָ
  choice: वे तेरा भय मानें
  rationale: יִרְאוּ का मूल अर्थ ‘भय मानना/श्रद्धापूर्वक डरना’ है। ‘भय मानें’ इसके धार्मिक और राजकीय भार को बनाए रखता है; हिन्दी में यह रूप प्रार्थना या कामना का भाव भी स्वाभाविक रूप से व्यक्त करता है।
- source_word: עִם־שָׁמֶשׁ
  choice: जब तक सूर्य बना रहे
  rationale: עִם का सामान्य अर्थ ‘के साथ’ है, पर सूर्य के साथ यह काव्यात्मक प्रयोग अवधि बताता है। हिन्दी में ‘जब तक सूर्य बना रहे’ अर्थ को स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
- source_word: וְלִפְנֵי יָרֵחַ
  choice: और चन्द्रमा विद्यमान रहे
  rationale: शाब्दिक रूप से ‘और चन्द्रमा के सामने’ है; सूर्य वाली समानांतर पंक्ति के साथ यह चन्द्रमा के बने रहने तक की दीर्घ अवधि व्यक्त करता है। मुख्य पाठ में अर्थगत रूप दिया गया है और शाब्दिक संरचना पादटिप्पणी में सुरक्षित है।
- source_word: דּוֹר דּוֹרִים
  choice: पीढ़ी-दर-पीढ़ी
  rationale: एकवचन और बहुवचन का यह संयोजन लगातार आने वाली पीढ़ियों पर बल देता है। ‘पीढ़ी-दर-पीढ़ी’ संक्षिप्त, स्वाभाविक और पुनरावृत्ति का प्रभाव बनाए रखने वाला हिन्दी रूप है।
theological_decisions:
- issue: राजकीय/मसीही भजन में ‘तेरा’ किसके लिए है
  choice: प्रत्यक्ष सम्बोधन ‘तेरा’ को बिना व्याख्यात्मक पहचान जोड़े बनाए रखा गया है।
  alternative: इसे स्पष्ट रूप से राजा अथवा परमेश्वर के लिए निर्धारित करना।
  rationale: इब्रानी पाठ केवल द्वितीय पुरुष एकवचन को संबोधित करता है। राजकीय संदर्भ में संदर्भित व्यक्ति को अनुवाद द्वारा निश्चित करना पाठ की वास्तविक धर्मवैज्ञानिक संभाव्यता को सीमित कर देगा।
- issue: יִירָאוּ का विधि/कालगत बल
  choice: ‘भय मानें’ द्वारा कामना या प्रार्थना का भाव मुख्य पाठ में रखा गया है।
  alternative: ‘वे तेरा भय मानेंगे’ के रूप में भविष्यसूचक कथन।
  rationale: इब्रानी अपूर्ण रूप को इस संदर्भ में कामनासूचक या भविष्यसूचक दोनों तरह समझा जा सकता है; मुख्य पाठ में प्रार्थनात्मक प्रवाह अपनाया गया और दूसरा विकल्प पादटिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण काव्यात्मक शैली रखी गई है। ‘तेरा’ एकवचन प्रत्यक्ष सम्बोधन और भजन की निकटता को सुरक्षित रखता है। ‘चन्द्रमा विद्यमान रहे’ अपेक्षाकृत साहित्यिक है, पर समानांतर खगोलीय अवधि को स्पष्ट करता है।
