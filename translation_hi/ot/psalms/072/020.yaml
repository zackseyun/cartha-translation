  yaml_path: translation/ot/psalms/072/020.yaml
  text: The prayers of David son of Jesse are ended[a].
translation:
  language: hi
  text: यिशै के पुत्र दाऊद की प्रार्थनाएँ समाप्त हुईं।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “पूरी हुईं” या “अंत को पहुँचीं।”
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּלּוּ
  choice: समाप्त हुईं
  rationale: כלה के पूर्ण रूप, स्त्रीलिंग बहुवचन, का अर्थ यहाँ ‘समाप्त होना/पूरा होना’ है और यह תְפִלּוֹת के साथ व्याकरणिक रूप से मेल खाता है। ‘समाप्त हुईं’ आधुनिक हिंदी में स्वाभाविक और संक्षिप्त है।
- source_word: תְפִלּוֹת
  choice: प्रार्थनाएँ
  rationale: תְּפִלָּה का सामान्य बहुवचन अर्थ ‘प्रार्थनाएँ’ है; यह बिना अनावश्यक व्याख्या जोड़े मूल अर्थ को स्पष्ट रखता है।
- source_word: דָּוִד
  choice: दाऊद
  rationale: हिंदी बाइबलीय परंपरा में प्रचलित और सहज पहचाना जाने वाला नाम-रूप।
- source_word: בֶּן יִשָׁי
  choice: यिशै के पुत्र
  rationale: इब्रानी संबंध-वाचक पदबंध का सीधा और स्वाभाविक हिंदी रूप, जो दाऊद की वंशगत पहचान बताता है।
theological_decisions:
- issue: यह पद उपसंहार/संपादकीय टिप्पणी है या भजन की सीधी प्रार्थना का अंग
  choice: दाऊद की प्रार्थनाओं की समाप्ति बताने वाला सीधा कथन
  alternative: इसे स्पष्ट रूप से बाद की संपादकीय टिप्पणी कहना
  rationale: इब्रानी पाठ केवल एक सरल घोषणात्मक कथन देता है; अनुवाद उसके संपादकीय इतिहास या रचनाकाल के विषय में उससे अधिक दावा नहीं करता।
translation_notes:
  register: आधुनिक मानक हिंदी, देवनागरी; शैली संक्षिप्त, गरिमापूर्ण और सामान्य पाठक के लिए सहज है। मुख्य पाठ में फुटनोट चिह्न रखा गया है।
