id: PSA.72.12
reference: Psalms 72:12
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: כִּֽי יַ֭צִּיל אֶבְי֣וֹן מְשַׁוֵּ֑עַ וְ֝/עָנִ֗י וְֽ/אֵין עֹזֵ֥ר לֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/072/012.yaml
  text: For he delivers the needy when he cries out[a], and the poor who has no helper.
translation:
  language: hi
  text: क्योंकि वह सहायता के लिए पुकारनेवाले जरूरतमंद को छुड़ाता है, और उस दीन को भी, जिसका कोई सहायक नहीं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले संदर्भ में राजा की प्रशंसा का कारण बताता है; हिन्दी में ‘क्योंकि’ कारणसूचक संबंध को स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
- source_word: יַצִּיל
  choice: वह ... छुड़ाता है
  rationale: נצל के हिफ़ील रूप में संकट से निकालने या बचाने का भाव है। ‘छुड़ाता है’ वास्तविक उद्धार को व्यक्त करता है, पर इसे अनावश्यक रूप से केवल आध्यात्मिक अर्थ नहीं देता।
- source_word: אֶבְיוֹן
  choice: जरूरतमंद
  rationale: यह भौतिक अभाव और दूसरों पर निर्भरता की दशा बताता है। ‘जरूरतमंद’ आधुनिक हिन्दी में सहज है और अगले עָנִי से भेद बनाए रखता है।
- source_word: מְשַׁוֵּעַ
  choice: सहायता के लिए पुकारनेवाले
  rationale: שׁוע का कृदन्त सहायता की गुहार लगानेवाले व्यक्ति का वर्णन करता है। यह पदबंध उस निरंतर वर्णनात्मक बल को स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: וְעָנִי
  choice: और उस दीन को भी
  rationale: עָנִי गरीबी, दुःख और उत्पीड़न से दबे व्यक्ति को सूचित कर सकता है। ‘दीन’ इस व्यापकता को कुछ हद तक बनाए रखता है और אֶבְיוֹן के लिए प्रयुक्त ‘जरूरतमंद’ की पुनरावृत्ति से बचाता है।
- source_word: וְאֵין עֹזֵר לוֹ
  choice: जिसका कोई सहायक नहीं
  rationale: यह दीन व्यक्ति की असहाय और परित्यक्त दशा बताता है तथा עֹזֵר के व्यक्तिवाचक भाव को ‘सहायक’ द्वारा सुरक्षित रखता है।
theological_decisions:
- issue: ‘वह’ का संदर्भ
  choice: एकवचन ‘वह’ को बिना अधिक स्पष्ट किए रखा गया है; भजन के राजकीय संदर्भ में यह प्रशंसित राजा की ओर संकेत करता है।
  alternative: इसे सामान्य धर्मी शासक अथवा प्रतिरूपात्मक/भविष्यसूचक मसीही राजा के रूप में स्पष्ट करना।
  rationale: इब्रानी में कर्ता के लिए केवल तीसरे पुरुष एकवचन क्रिया है। यह पद स्वयं उसकी पहचान को और सीमित नहीं करता, इसलिए अनुवाद राजकीय संदर्भ रखते हुए संभावित धर्मवैज्ञानिक अर्थ को तय नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और सार्वजनिक पाठ के योग्य शैली। ‘पुकारनेवाले’ को संयुक्त रूप में रखा गया है। ‘दीन’ साहित्यिक होते हुए भी सामान्य धार्मिक और सार्वजनिक हिन्दी में बोधगम्य है तथा गरीबी के साथ पीड़ा/दमन की संभावित छाया बनाए रखता है।
