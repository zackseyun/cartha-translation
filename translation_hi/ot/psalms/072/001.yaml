id: PSA.72.1
reference: Psalms 72:1
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: לִ/שְׁלֹמֹ֨ה אֱֽלֹהִ֗ים מִ֭שְׁפָּטֶי/ךָ לְ/מֶ֣לֶךְ תֵּ֑ן וְ/צִדְקָתְ/ךָ֥ לְ/בֶן מֶֽלֶךְ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/072/001.yaml
  text: Of Solomon[a]. O God, give your judgments to the king[b], and your righteousness to the king’s son.
translation:
  language: hi
  text: 'सुलैमान का भजन[a]।


    हे परमेश्वर, राजा को अपने न्याय-निर्णय दे,

    और राजा के पुत्र को अपनी धार्मिकता[b]।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “सुलैमान के लिए भजन” अथवा “सुलैमान को समर्पित भजन।”
    reason: alternative_reading
  - marker: b
    text: “अपनी धार्मिकता” का अनुवाद “अपना न्याय” भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: לִשְׁלֹמֹה
  choice: सुलैमान का भजन
  rationale: भजन-संग्रह की शीर्षक-परंपरा में उपसर्ग לְ लेखकत्व, समर्पण या संबंध का संकेत दे सकता है। स्वाभाविक हिन्दी के लिए निहित ‘भजन’ जोड़ा गया है; अन्य संभावनाएँ पाद-टिप्पणी में सुरक्षित हैं।
- source_word: אֱלֹהִים
  choice: हे परमेश्वर
  rationale: यह प्रार्थना में प्रत्यक्ष संबोधन है; ‘हे’ सम्बोधन को स्पष्ट और स्वाभाविक बनाता है।
- source_word: מִשְׁפָּטֶיךָ
  choice: अपने न्याय-निर्णय
  rationale: बहुवचन रूप तथा राजा को दिए जाने वाले न्यायिक निर्णय और विवेक—दोनों भावों को बनाए रखने के लिए ‘न्याय-निर्णय’ चुना गया है।
- source_word: לְמֶלֶךְ
  choice: राजा को
  rationale: यह माँगी गई वस्तु पाने वाले व्यक्ति को सूचित करने वाला सीधा सम्प्रदान-वाचक पद है।
- source_word: תֵּן
  choice: दे
  rationale: आज्ञार्थक क्रिया में परमेश्वर से प्रदान करने की सीधी विनती है; ‘दे’ सरल और स्रोत के निकट है।
- source_word: וְצִדְקָתְךָ
  choice: और अपनी धार्मिकता
  rationale: צְדָקָה में नैतिक धार्मिकता और न्याय, दोनों का व्यापक भाव हो सकता है। ‘धार्मिकता’ इस व्यापकता को बनाए रखती है; ‘न्याय’ प्रासंगिक विकल्प है।
- source_word: לְבֶן־מֶלֶךְ
  choice: राजा के पुत्र को
  rationale: समास-पद का सीधा अनुवाद रखा गया है। यह राजकीय उत्तराधिकारी अथवा वंशगत अर्थ में उसी राजा का समानांतर उल्लेख हो सकता है, पर अनुवाद उस प्रश्न का निर्णय नहीं करता।
theological_decisions:
- issue: ‘राजा’ और ‘राजा के पुत्र’ की पहचान
  choice: मुख्य पाठ में ऐतिहासिक राजकीय प्रार्थना की भाषा को बिना किसी स्पष्ट मसीही पहचान के यथावत रखना
  alternative: इसे विशेष रूप से सुलैमान के लिए प्रार्थना, अथवा दाऊदी वंश और मसीहा की ओर संकेत करने वाली प्रार्थना मानना
  rationale: पद में तत्कालीन राजा और आदर्श दाऊदी राजा, दोनों की संभावित प्रतिध्वनि बनी रहती है। शाब्दिक राजकीय भाषा किसी एक व्याख्या को अनुवाद में आरोपित किए बिना इस तनाव को सुरक्षित रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण प्रार्थना-शैली रखी गई है। काव्यात्मक समानांतरता दिखाने के लिए पंक्ति-विभाजन किया गया है; अनावश्यक सांप्रदायिक या व्याख्यात्मक विस्तार से बचा गया है।
