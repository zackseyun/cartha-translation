id: PSA.72.10
reference: Psalms 72:10
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: מַלְכֵ֬י תַרְשִׁ֣ישׁ וְ֭/אִיִּים מִנְחָ֣ה יָשִׁ֑יבוּ מַלְכֵ֥י שְׁבָ֥א וּ֝/סְבָ֗א אֶשְׁכָּ֥ר יַקְרִֽיבוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/072/010.yaml
  text: May the kings of Tarshish and of the coastlands bring tribute; may the kings of Sheba and Seba present gifts.
translation:
  language: hi
  text: 'तर्शीश और द्वीपों[a] के राजा भेंट लाएँ;

    शीबा और सबा के राजा उपहार प्रस्तुत करें।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, समुद्री तटों
    reason: इब्रानी אִיִּים का अर्थ ‘द्वीप’ और ‘समुद्री तटवर्ती क्षेत्र’ दोनों हो सकता है।
lexical_decisions:
- source_word: אִיִּים
  choice: द्वीपों[a]
  rationale: यह शब्द मूलतः द्वीपों को और विस्तार से समुद्री तटवर्ती क्षेत्रों को भी दर्शा सकता है। मुख्य पाठ में संक्षिप्त और पारंपरिक अर्थ रखा गया है तथा दूसरा संभव अर्थ पादटिप्पणी में दिया गया है।
- source_word: מִנְחָה
  choice: भेंट
  rationale: राजाओं द्वारा किसी प्रभुता-संपन्न राजा को लाई जाने वाली भेंट या कर-सदृश नजराने का भाव है; ‘भेंट’ सहज है और अर्थ को अनावश्यक रूप से केवल कर तक सीमित नहीं करता।
- source_word: אֶשְׁכָּר
  choice: उपहार
  rationale: यहाँ राजकीय भेंट या नजराने का अर्थ है। ‘उपहार’ पहले अर्धपद के ‘भेंट’ के समानांतर रहते हुए काव्यात्मक विविधता बनाए रखता है।
- source_word: יַקְרִיבוּ
  choice: प्रस्तुत करें
  rationale: मूल क्रिया का भाव पास लाने या सामने अर्पित करने का है। ‘प्रस्तुत करें’ राजाओं द्वारा उपहार सामने लाने का dignified और स्वाभाविक रूप है।
theological_decisions:
- issue: इब्रानी अपूर्ण क्रियाओं का भाव
  choice: 'कामनार्थक रूप: ‘लाएँ’ और ‘प्रस्तुत करें’'
  alternative: 'भविष्यवाचक रूप: ‘लाएँगे’ और ‘प्रस्तुत करेंगे’'
  rationale: भजन के इस प्रसंग में ये रूप राजा के लिए प्रार्थना/कामना की निरंतरता के रूप में स्वाभाविक हैं। फिर भी भविष्यवाणी-सदृश छाया को कठोर कथन बनाकर निश्चित नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, काव्यात्मक और गरिमापूर्ण शैली रखी गई है। तर्शीश, शीबा और सबा के नाम स्रोत-पाठ के अनुसार लिप्यंतरित हैं; समानांतर पंक्तियों में ‘भेंट’ और ‘उपहार’ की स्वाभाविक विविधता बनाए रखी गई है।
