  yaml_path: translation/ot/psalms/072/002.yaml
  text: May he judge your people with righteousness[b][a], and your afflicted ones with justice.
translation:
  language: hi
  text: वह तेरी प्रजा का न्याय धार्मिकता से करे[a], और तेरे दीन-दुखियों को न्याय दिलाए।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वह तेरी प्रजा का न्याय धार्मिकता से करेगा।” यहाँ हिब्रू अपूर्ण क्रिया को प्रार्थनात्मक इच्छा या भविष्यसूचक अर्थ—दोनों में समझा जा सकता है।
    reason: alternative_reading
  - marker: b
    text: “दीन-दुखियों” के लिए प्रयुक्त हिब्रू शब्द का अर्थ गरीब, जरूरतमंद, पीड़ित या दबे-कुचले लोग भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: יָדִין
  choice: न्याय करे
  rationale: काल का अपूर्ण रूप यहाँ प्रार्थनात्मक इच्छा या भविष्यवाणी—दोनों व्यक्त कर सकता है। भजन के आरम्भिक प्रार्थनात्मक संदर्भ में ‘न्याय करे’ स्वाभाविक है और शासन के न्यायिक पक्ष को बनाए रखता है।
- source_word: עַמְּךָ
  choice: तेरी प्रजा
  rationale: द्वितीय पुरुष एकवचन प्रत्यय सहित עם का अर्थ ‘तेरी प्रजा’ है; राजकीय संदर्भ में ‘प्रजा’ स्वाभाविक और स्पष्ट है।
- source_word: בְצֶדֶק
  choice: धार्मिकता से
  rationale: צדק नैतिक सहीपन, धार्मिकता और न्यायसंगतता को व्यक्त करता है। ‘धार्मिकता से’ अगले משפט से शब्दगत भेद रखते हुए राजा के न्याय के नैतिक गुण को प्रकट करता है।
- source_word: וַעֲנִיֶּיךָ
  choice: और तेरे दीन-दुखियों
  rationale: עָנִי आर्थिक रूप से गरीब, पीड़ित, दबे-कुचले या असहाय लोगों को सूचित कर सकता है। ‘दीन-दुखियों’ इस व्यापक सामाजिक और दुःख-संबंधी अर्थ को सहज आधुनिक हिन्दी में रखता है।
- source_word: בְמִשְׁפָּט
  choice: निष्पक्षता से
  rationale: מִשְׁפָּט यहाँ न्यायपूर्ण निर्णय या न्याय के मानदंड को दर्शाता है। हिन्दी में लगातार ‘न्याय ... न्याय से’ की असहज पुनरावृत्ति से बचते हुए ‘निष्पक्षता से’ न्यायोचित व्यवहार का भाव स्पष्ट करता है।
theological_decisions:
- issue: राजकीय प्रार्थना में आरम्भिक हिब्रू अपूर्ण क्रिया का इच्छासूचक या भविष्यसूचक बल
  choice: प्रार्थनात्मक इच्छा के रूप में ‘वह ... न्याय करे’
  alternative: भविष्यसूचक रूप में ‘वह ... न्याय करेगा’
  rationale: भजन 72 का आरम्भ राजा के लिए प्रार्थना से होता है, इसलिए इच्छासूचक अर्थ संदर्भानुकूल है। फिर भी हिब्रू रूप भविष्यसूचक अर्थ की अनुमति देता है; इसे पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और प्रार्थनात्मक राजकीय स्वर रखा गया है। परमेश्वर को सम्बोधन में ‘तेरी’ का प्रयोग निकटता और काव्यात्मकता बनाए रखता है। दोनों पादटिप्पणी-चिह्न मुख्य पाठ में शामिल हैं।
