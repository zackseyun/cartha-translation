  yaml_path: translation/ot/psalms/072/018.yaml
  text: Blessed be Yahweh God[a], the God of Israel, who alone does wondrous things.
translation:
  language: hi
  text: 'याहवे परमेश्वर, इस्राएल के परमेश्वर, धन्य हों;

    वही अकेले अद्भुत कार्य करते हैं।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בָּרוּךְ
  choice: धन्य हैं
  rationale: यह निष्क्रिय कृदन्त स्तुति/आशीर्वाद के धर्मगीतात्मक सूत्र में प्रयुक्त है। हिंदी में ‘धन्य हैं’ स्वाभाविक, गरिमापूर्ण और संक्षिप्त है; यह इसे केवल ‘प्रशंसित हों’ तक सीमित नहीं करता।
- source_word: יְהוָה
  choice: याहवे
  rationale: चतुरक्षरीय व्यक्तिगत ईश्वरीय नाम को किसी उपाधि से बदलने के बजाय हिंदी में निकट लिप्यंतरण द्वारा रखा गया है।
- source_word: אֱלֹהִים
  choice: परमेश्वर
  rationale: यहाँ यह याहवे के साथ समानाधिकरण में है। ‘परमेश्वर’ आधुनिक बाइबलीय हिंदी में स्पष्ट और गरिमापूर्ण है।
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: इस्राएल के परमेश्वर
  rationale: सम्बन्धसूचक रचना को सीधे रखा गया है, जिससे पहचान और वाचा-संबंध की विशिष्टता बनी रहती है।
- source_word: עֹשֵׂה
  choice: करते हैं
  rationale: कालवाचक कृदन्त परमेश्वर के निरंतर चरित्रगत कार्य को बताता है; हिंदी में वर्तमान आदरसूचक बहुवचन स्वाभाविक है।
- source_word: נִפְלָאוֹת
  choice: अद्भुत काम
  rationale: बहुवचन संज्ञा असाधारण ईश्वरीय कृत्यों को सूचित करती है। ‘अद्भुत काम’ सामान्य पाठक के लिए ‘अद्भुत बातें’ से अधिक क्रियात्मक और स्पष्ट है।
- source_word: לְבַדּוֹ
  choice: केवल वही
  rationale: यह ईश्वरीय कार्य की विशिष्टता पर बल देता है। ‘केवल वही’ हिंदी में इस विशेष बल को स्पष्ट रखते हुए ‘अपने आप’ जैसी संभावित भिन्न अर्थच्छाया से बचता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ व्यक्तिगत नाम का प्रयोग करता है। ‘याहवे’ उसे उपाधि से प्रतिस्थापित किए बिना सुरक्षित रखता है।
- issue: לְבַדּוֹ का ईश्वरीय कार्य से संबंध
  choice: केवल वही अद्भुत काम करते हैं
  alternative: वह अपने आप अद्भुत काम करता है
  rationale: ‘केवल वही’ मूल के मुख्य विशिष्टताबोध को सीधे व्यक्त करता है और यह अनावश्यक रूप से तय नहीं करता कि बल किसी सहायक के अभाव पर है।
- issue: בָּרוּךְ की धर्मगीतात्मक शक्ति
  choice: धन्य हैं
  alternative: उनकी स्तुति हो
  rationale: ‘धन्य हैं’ मूल की निष्क्रिय कृदन्तीय बनावट और परंपरागत स्तुतिसूत्र को बनाए रखता है; वैकल्पिक पाठ प्रशंसा के भाव को अधिक स्पष्ट करता, पर रूप को बदल देता।
translation_notes:
  register: आधुनिक मानक हिंदी, काव्यात्मक किंतु सरल और गरिमापूर्ण। दो पंक्तियों में विन्यास से समानाधिकरण और अंतिम विशिष्टताबोध स्पष्ट होता है। ‘हैं/करते हैं’ आदरसूचक व्याकरण के अनुसार है; मूल का अर्थगत बहुवचन नहीं माना गया है।
