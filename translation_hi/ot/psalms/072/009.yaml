  text: Before him the desert dwellers will bow down[a], and his enemies will lick the dust.
translation:
  language: hi
  text: उसके सामने मरुभूमि के निवासी झुकेंगे[a], और उसके शत्रु धूल चाटेंगे।
  philosophy: optimal-equivalence
  footnotes:
