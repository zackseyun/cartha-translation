    reason: lexical_alternative
lexical_decisions:
- source_word: לְפָנָיו
  choice: उसके सामने
  rationale: यह इब्रानी मुहावरा किसी की उपस्थिति में होने का भाव देता है; ‘उसके सामने’ सहज हिन्दी में स्थान और अधीनता, दोनों के संदर्भ को बनाए रखता है।
- source_word: יִכְרְעוּ
  choice: झुकेंगे
  rationale: क्रिया घुटने टेकने या झुकने को व्यक्त करती है। राजकीय अधीनता के इस प्रसंग में ‘झुकेंगे’ स्वाभाविक और पर्याप्त रूप से सटीक है।
- source_word: צִיִּים
  choice: मरुभूमि के निवासी
  rationale: यह दुर्लभ शब्द मरुभूमि में रहने वाले मनुष्यों अथवा कुछ प्रसंगों में वन्य जीवों को सूचित कर सकता है। यहाँ ‘शत्रुओं’ के समानांतर मानवीय अर्थ अधिक उपयुक्त है, पर शब्द की अनिश्चितता पादटिप्पणी में रखी गई है।
- source_word: וְאֹיְבָיו
  choice: और उसके शत्रु
  rationale: प्रत्यय सहित संज्ञा का सीधा और स्वाभाविक हिन्दी अनुवाद।
- source_word: עָפָר
  choice: धूल
  rationale: ‘धूल चाटना’ हिन्दी में भी गहरे अपमान और पूर्ण पराजय का सजीव बिंब देता है।
- source_word: יְלַחֵכוּ
  choice: चाटेंगे
  rationale: मूल क्रिया का ठोस अर्थ ‘चाटना’ है; इसे बनाए रखने से काव्यात्मक बिंब सुरक्षित रहता है।
theological_decisions:
- issue: अधीनता के बिंब का स्वरूप
  choice: राजा के आगे पराजय और अधीनता को व्यक्त करने वाला काव्यात्मक चित्र
  alternative: हर स्थिति में शाब्दिक रूप से झुकना और धूल चाटना
  rationale: पद में प्रयुक्त भाषा राजकीय विजय और अपमान का प्राचीन काव्यात्मक बिंब है। अनुवाद बिंब को सीधे रखता है और उसे अमूर्त राजनीतिक भाषा में नहीं बदलता।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, काव्यात्मक और गरिमापूर्ण शैली रखी गई है। ‘मरुभूमि’ साहित्यिक होते हुए भी सामान्य पाठक के लिए बोधगम्य है, और ‘धूल चाटेंगे’ मूल के तीखे बिंब को स्वाभाविक हिन्दी में सुरक्षित रखता है।
