  text: וּ/בָר֤וּךְ שֵׁ֥ם כְּבוֹד֗/וֹ לְ/ע֫וֹלָ֥ם וְ/יִמָּלֵ֣א כְ֭בוֹד/וֹ אֶת כֹּ֥ל הָ/אָ֗רֶץ אָ֘מֵ֥ן וְ/אָמֵֽן׀־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/072/019.yaml
  text: And blessed be his glorious name forever[a], and may his glory fill the whole earth[b]. Amen and amen.
translation:
  language: hi
  text: और उसका महिमामय नाम सदा धन्य हो[a], और उसकी महिमा सारी पृथ्वी को भर दे[b]। आमीन और आमीन।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक शाब्दिक: “उसकी महिमा का नाम।”'
    reason: lexical_alternative
  - marker: b
    text: 'या: “और सारी पृथ्वी उसकी महिमा से भर जाए।”'
    reason: grammatical_alternative
lexical_decisions:
- source_word: וּבָרוּךְ
  choice: और ... धन्य हो
  rationale: निष्क्रिय कृदन्त यहाँ स्तुतिपरक आशीर्वचन की कामनात्मक शक्ति रखता है; ‘धन्य हो’ उसे स्वाभाविक और गरिमापूर्ण हिन्दी में बनाए रखता है।
- source_word: שֵׁם כְּבוֹדוֹ
  choice: उसका महिमामय नाम
  rationale: शाब्दिक रचना ‘उसकी महिमा का नाम’ है। ‘महिमामय नाम’ आधुनिक हिन्दी में स्वाभाविक है और नाम के महिमा से युक्त होने का भाव सुरक्षित रखता है।
- source_word: לְעוֹלָם
  choice: सदा
  rationale: यह अनन्त काल तक बने रहने का भाव संक्षिप्त, स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וְיִמָּלֵא
  choice: और ... भर दे
  rationale: निफ़अल अपूर्ण क्रिया को यहाँ कामनात्मक रूप में समझा गया है। אֶת के कारण ‘उसकी महिमा’ को कर्ता और ‘सारी पृथ्वी’ को कर्म मानते हुए प्रार्थना का भाव रखा गया है।
- source_word: כְבוֹדוֹ
  choice: उसकी महिमा
  rationale: स्तुतिपरक और विश्वव्यापी प्रसंग में ‘महिमा’ כבוד का सर्वाधिक उपयुक्त हिन्दी प्रतिरूप है।
- source_word: אֶת כֹּל הָאָרֶץ
  choice: सारी पृथ्वी को
  rationale: אֶת प्रत्यक्ष कर्म को चिह्नित करता है और כֹּל समग्रता बताता है। इस प्रसंग में הָאָרֶץ का विश्वव्यापी अर्थ ‘पृथ्वी’ स्थानीय ‘देश’ से अधिक उपयुक्त है।
- source_word: אָמֵן וְאָמֵן
  choice: आमीन और आमीन
  rationale: दोहराए गए उपासनात्मक अनुमोदन को परिचित लिप्यंतरण में सुरक्षित रखा गया है।
theological_decisions:
- issue: הָאָרֶץ का दायरा
  choice: विश्वव्यापी ‘पृथ्वी’
  alternative: स्थानीय ‘सारा देश’
  rationale: राजकीय भजन के विश्वव्यापी क्षितिज और समापन स्तुति में परमेश्वर की महिमा के सर्वत्र भरने की कामना के कारण ‘पृथ्वी’ अधिक उपयुक्त है।
- issue: וְיִמָּלֵא की वाच्यगत बनावट
  choice: उसकी महिमा पृथ्वी को भर दे
  alternative: सारी पृथ्वी उसकी महिमा से भर जाए
  rationale: मसोराई पाठ में אֶת ‘सारी पृथ्वी’ को प्रत्यक्ष कर्म बनाता है, इसलिए सक्रिय अर्थ वाला हिन्दी रूप स्रोत की वाक्यरचना को बेहतर दर्शाता है; फिर भी निफ़अल रूप के कारण वैकल्पिक निष्क्रिय अभिव्यक्ति पाद-टिप्पणी में दी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, उपासनात्मक शैली रखी गई है। ‘महिमामय’ सहज विशेषणात्मक रूप देता है, जबकि पाद-टिप्पणी मूल इब्रानी की अधिक शाब्दिक संरचना सुरक्षित रखती है।
