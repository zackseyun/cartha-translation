base_translation:
  language: en
  yaml_path: translation/ot/psalms/072/017.yaml
  text: May his name endure forever[a]; before the sun, may his name continue. May all nations be blessed in him[c][b]; may they call him blessed.
translation:
  language: hi
  text: 'उसका नाम सदा बना रहे;


    सूर्य के सामने[a] उसका नाम कायम रहे[b]।


    सभी राष्ट्र उसके द्वारा आशीष पाएँ[c];


    वे उसे धन्य कहें।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘जब तक सूर्य रहे।’ इब्रानी में शाब्दिक रूप से ‘सूर्य के सामने’ है।
    reason: lexical_alternative
  - marker: b
    text: यहाँ प्रयुक्त इब्रानी क्रिया दुर्लभ है; इसका भाव ‘फले-फूले,’ ‘बढ़ता रहे’ या ‘फैलता जाए’ भी हो सकता है।
    reason: lexical_alternative
  - marker: c
    text: या ‘सभी राष्ट्र उसके नाम से अपने लिए आशीष माँगें।’ इब्रानी रूप को आत्मवाची भी समझा जा सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: יְהִי שְׁמוֹ לְעוֹלָם
  choice: उसका नाम सदा बना रहे
  rationale: इच्छासूचक יְהִי को प्रार्थना/कामना के रूप में व्यक्त किया गया है। ‘नाम’ इब्रानी रूपक को बनाए रखता है, और ‘सदा बना रहे’ स्थायी अवधि को स्वाभाविक आधुनिक हिन्दी में प्रकट करता है।
- source_word: לִפְנֵי שֶׁמֶשׁ
  choice: सूर्य के सामने
  rationale: मूल स्थानिक-चित्रात्मक अभिव्यक्ति को मुख्य पाठ में सुरक्षित रखा गया है; प्रसंग में इसका समय-संबंधी अर्थ ‘जब तक सूर्य रहे’ भी हो सकता है।
- source_word: ינין
  choice: कायम रहे
  rationale: यह दुर्लभ और अर्थगत रूप से कठिन क्रिया है। ‘कायम रहे’ पूर्व पंक्ति के स्थायित्व से मेल खाता है, पर इसके ‘फले-फूले,’ ‘बढ़े’ या ‘फैलता जाए’ जैसे संभावित भावों को टिप्पणी में सुरक्षित रखा गया है।
- source_word: וְיִתְבָּרְכוּ בוֹ
  choice: उसमें आशीष पाएँ
  rationale: हित्पएल रूप निष्क्रिय/मध्यवाची (‘आशीष पाएँ’) या आत्मवाची (‘अपने को आशीषित कहें/आशीष दें’) समझा जा सकता है। यह चयन स्वाभाविक हिन्दी में अब्राहमी आशीष की प्रतिध्वनि को बनाए रखता है, जबकि विकल्प टिप्पणी में दिया गया है।
- source_word: כָּל גּוֹיִם
  choice: सभी राष्ट्र
  rationale: इस विश्वव्यापी राजकीय संदर्भ में גּוֹיִם संसार के राष्ट्रों/लोगों को दर्शाता है; ‘राष्ट्र’ आधुनिक हिन्दी में स्पष्ट है और ‘जाति’ की संभावित सामाजिक अस्पष्टता से बचता है।
- source_word: יְאַשְּׁרוּהוּ
  choice: वे उसे धन्य कहें
  rationale: पिएल क्रिया का अर्थ किसी को धन्य या सुखी घोषित करना है। ‘धन्य कहें’ संक्षिप्त, प्रतिष्ठित और परिचित बाइबिलीय हिन्दी है।
theological_decisions:
- issue: पद का राजकीय और मसीहाई विस्तार
  choice: ऐसी भाषा रखी गई है जो तत्कालीन राजा और व्यापक मसीहाई प्रतिध्वनि—दोनों के लिए खुली रहे
  alternative: इसे केवल ऐतिहासिक राजा की अतिशयोक्तिपूर्ण प्रशंसा मानना, या सीधे और केवल मसीह की भविष्यवाणी बनाना
  rationale: भजन 72 राजकीय भजन है, पर ‘सभी राष्ट्र उसमें आशीष पाएँ’ साधारण राजत्व से व्यापक भाषा और अब्राहमी प्रतिज्ञा की प्रतिध्वनि रखता है। अनुवाद किसी एक धर्मवैज्ञानिक निष्कर्ष को पाठ में नहीं जोड़ता।
- issue: וְיִתְבָּרְכוּ का वाच्य
  choice: ‘आशीष पाएँ’ द्वारा निष्क्रिय/मध्यवाची संभावना मुख्य पाठ में
  alternative: ‘उसके द्वारा अपने को आशीषित कहें’ जैसी आत्मवाची समझ
  rationale: इब्रानी हित्पएल दोनों प्रकार से समझा गया है। मुख्य पाठ सहज हिन्दी देता है, और वास्तविक अस्पष्टता पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में सरल, काव्यात्मक और गरिमापूर्ण रखी गई है। समानांतर पंक्तियों की प्रार्थनात्मक लय बनाए रखी गई है; दुर्लभ क्रिया और आशीष-वाक्य की वास्तविक अस्पष्टताओं को मुख्य पाठ में अनावश्यक रूप से तय किए बिना पादटिप्पणियों में स्पष्ट किया गया है।
