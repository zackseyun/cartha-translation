  text: נִכְסְפָ֬ה וְ/גַם כָּלְתָ֨ה נַפְשִׁ/י֮ לְ/חַצְר֪וֹת יְה֫וָ֥ה לִבִּ֥/י וּ/בְשָׂרִ֑/י יְ֝רַנְּנ֗וּ אֶ֣ל אֵֽל חָֽי־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/084/002.yaml
  text: My soul longs—indeed[a], it even faints—for the courts of Yahweh; my heart and my flesh cry out to the living God.
translation:
  language: hi
  text: मेरा प्राण याहवे के आँगनों के लिए तरसता है—हाँ, वह निढाल हुआ जाता है; मेरा हृदय और मेरा शरीर जीवित परमेश्वर की ओर पुकार उठते हैं[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “आनन्द से जयजयकार करते हैं।” इब्रानी क्रिया ऊँची, गूँजती और प्रायः आनन्दपूर्ण पुकार को व्यक्त कर सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: נִכְסְפָה
  choice: तरसता है
  rationale: यह क्रिया गहरी लालसा व्यक्त करती है। ‘तरसता है’ आधुनिक हिन्दी में स्वाभाविक है और अगले, अधिक तीव्र कथन के लिए आधार बनाती है।
- source_word: וְגַם כָּלְתָה
  choice: हाँ, वह निढाल हुआ जाता है
  rationale: וְגַם दूसरे कथन को तीव्र करता है, और כָּלְתָה यहाँ लालसा से चुक जाने या निढाल होने का भाव देता है। यह रूप क्रमशः बढ़ती तीव्रता को व्यक्त करता है।
- source_word: נַפְשִׁי
  choice: मेरा प्राण
  rationale: נֶפֶשׁ यहाँ लालसा करने वाले व्यक्ति के भीतरी जीवन या स्वयं को सूचित करता है। ‘प्राण’ संक्षिप्त है और ‘हृदय’ तथा ‘शरीर’ के अगले युग्म के साथ उपयुक्त बैठता है।
- source_word: לְחַצְרוֹת
  choice: के आँगनों के लिए
  rationale: यह मन्दिर-परिसर के आँगनों को दर्शाता है। ‘आँगनों’ सामान्य पाठक के लिए सहज और चित्रात्मक है।
- source_word: יְהוָה
  choice: याहवे
  rationale: मूल पाठ में परमेश्वर का व्यक्तिगत नाम है; उसे किसी उपाधि से बदलने के बजाय हिन्दी में लिप्यंतरित किया गया है।
- source_word: לִבִּי וּבְשָׂרִי
  choice: मेरा हृदय और मेरा शरीर
  rationale: यह युग्म भीतरी और बाहरी व्यक्ति को साथ रखता है। हिन्दी में ‘शरीर’ ‘मांस’ की अपेक्षा यहाँ अधिक स्वाभाविक है, जबकि युग्म का आशय सुरक्षित रहता है।
- source_word: יְרַנְּנוּ
  choice: पुकार उठते हैं
  rationale: क्रिया ऊँची, गूँजती पुकार को व्यक्त करती है और प्रायः आनन्दपूर्ण जयध्वनि का भाव भी रखती है। प्रसंग की तीव्र लालसा के अनुरूप मुख्य पाठ में ‘पुकार उठते हैं’ रखा गया है और आनन्दपूर्ण अर्थ footnote में सुरक्षित है।
- source_word: אֶל אֵל חָי
  choice: जीवित परमेश्वर की ओर
  rationale: אֶל की दिशात्मकता ‘की ओर’ से स्पष्ट रहती है; אֵל חָי प्रसंग में इस्राएल के परमेश्वर के लिए निश्चित पदनाम है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: प्रभु
  rationale: मूल पाठ में उपाधि नहीं बल्कि चार अक्षरों वाला ईश्वरीय नाम है। उसका लिप्यंतरण स्रोत-पाठ के भेद को बनाए रखता है।
- issue: יְרַנְּנוּ में पुकार और आनन्द का संबंध
  choice: पुकार उठते हैं
  alternative: आनन्द से जयजयकार करते हैं
  rationale: क्रिया में आनन्दपूर्ण ऊँची ध्वनि का अर्थ संभव है, पर तत्काल प्रसंग तीव्र लालसा पर बल देता है। मुख्य पाठ व्यापक ‘पुकार’ रखता है और वैकल्पिक आनन्दपूर्ण अर्थ टिप्पणी में देता है, जिससे अर्थगत तनाव बना रहता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘प्राण’, ‘हृदय’ और ‘शरीर’ काव्यात्मक समानांतरता को बनाए रखते हैं; ‘याहवे’ मूल ईश्वरीय नाम का देवनागरी लिप्यंतरण है।
