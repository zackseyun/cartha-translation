id: PSA.84.12
reference: Psalms 84:12
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: יְהוָ֥ה צְבָא֑וֹת אַֽשְׁרֵ֥י אָ֝דָ֗ם בֹּטֵ֥חַ בָּֽ/ךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/084/012.yaml
  text: O Yahweh of hosts[b][a], blessed is the man who trusts in you.
translation:
  language: hi
  text: हे सेनाओं के याहवे, धन्य[a] है वह मनुष्य[b] जो आप पर भरोसा रखता है!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘क्या ही सुखी’ अथवा ‘क्या ही भाग्यवान’।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में एकवचन ‘मनुष्य’; यहाँ इसका आशय याहवे पर भरोसा रखने वाले किसी भी मानव से है।
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय आधुनिक हिन्दी में उसका निकट लिप्यंतरण रखा गया है।
- source_word: צְבָאוֹת
  choice: सेनाओं के
  rationale: यह बहुवचन संज्ञा सेनाओं अथवा संगठित सैन्य समूहों की मूल इब्रानी छवि को बनाए रखती है; इसे अर्थ-विस्तार करके केवल ‘सर्वशक्तिमान’ नहीं किया गया।
- source_word: אַשְׁרֵי
  choice: धन्य
  rationale: ज्ञान-साहित्य की इस विस्मयात्मक मंगल-वाणी के लिए ‘धन्य’ स्वाभाविक और गरिमापूर्ण है तथा केवल क्षणिक भावनात्मक प्रसन्नता का संकेत नहीं देता।
- source_word: אָדָם
  choice: मनुष्य
  rationale: एकवचन रूप को बनाए रखते हुए यह किसी भी मानव व्यक्ति का प्रतिनिधित्व करता है; सन्दर्भ इसे केवल पुरुष तक सीमित नहीं करता।
- source_word: בֹּטֵחַ
  choice: भरोसा रखता है
  rationale: इब्रानी कृदन्त किसी व्यक्ति की विशेषता अथवा निरन्तर प्रवृत्ति बताता है; ‘भरोसा रखता है’ आधुनिक हिन्दी में इसे स्वाभाविक रूप से व्यक्त करता है।
- source_word: בָּךְ
  choice: आप पर
  rationale: पूर्वसर्ग और द्वितीय पुरुष एकवचन के सीधे सम्बोधन को सम्मानसूचक, आधुनिक हिन्दी में व्यक्त किया गया है।
theological_decisions:
- issue: יְהוָה צְבָאוֹת का अनुवाद
  choice: सेनाओं के याहवे
  alternative: सर्वशक्तिमान प्रभु
  rationale: चुना हुआ रूप परमेश्वर के व्यक्तिगत नाम और ‘सेनाओं’ की इब्रानी छवि—दोनों को सुरक्षित रखता है तथा व्याख्यात्मक उपाधि से उन्हें नहीं बदलता।
- issue: אָדָם का प्रतिनिधिक आशय
  choice: मनुष्य
  alternative: पुरुष
  rationale: इब्रानी एकवचन किसी भी भरोसा रखने वाले मानव का प्रतिनिधित्व करता है। ‘मनुष्य’ रूपगत एकवचन और व्यापक आशय दोनों को बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण काव्यात्मक सम्बोधन रखा गया है। ‘हे’ इब्रानी में अलग शब्द के रूप में नहीं है, पर सीधे सम्बोधन को हिन्दी में स्वाभाविक बनाता है। परमेश्वर के लिए ‘आप’ सम्मानसूचक प्रयोग है; वाक्य को सरल और जनसुलभ रखा गया है।
