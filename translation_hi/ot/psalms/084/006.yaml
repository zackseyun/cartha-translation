base_translation:
  language: en
  yaml_path: translation/ot/psalms/084/006.yaml
  text: As they pass through the Valley of Baca[a], they make it a spring[b]; even the early rain covers it with blessings.
translation:
  language: hi
  text: बाका की घाटी[a] से होकर जाते हुए वे उसे जल-स्रोत बना देते हैं; पहली वर्षा[b] भी उसे आशीषों से ढक देती है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘बाका’ में ‘रोना’ अर्थ वाले इब्रानी शब्द की प्रतिध्वनि हो सकती है; इसलिए इसका अर्थ ‘रोने की घाटी’ भी समझा गया है।
    reason: alternative_reading
  - marker: b
    text: अर्थात ऋतु की आरम्भिक, प्रायः शरद की वर्षा। इब्रानी शब्द का अर्थ ‘शिक्षक’ भी हो सकता है, पर इस प्रसंग में सामान्यतः इसे ऋतु की वर्षा समझा जाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: עֹבְרֵי בְּעֵמֶק
  choice: तराई से होकर जाते हुए
  rationale: बहुवचन कृदन्त עֹבְרֵי यात्रा करते लोगों को सूचित करता है, और עבר के साथ בְּעֵמֶק किसी स्थान के बीच से होकर जाने का भाव देता है। ‘तराई’ काव्यात्मक भू-दृश्य के लिए सहज आधुनिक हिन्दी है।
- source_word: הַבָּכָא
  choice: बाका
  rationale: यह सम्भवतः स्थान-नाम है, पर इसमें ‘रोना’ शब्द की प्रतिध्वनि भी सुनाई दे सकती है। लिप्यन्तरण मूल की अस्पष्टता बनाए रखता है; सम्भावित अर्थ पादटिप्पणी में दिया गया है।
- source_word: מַעְיָן
  choice: जल-स्रोत
  rationale: यह शब्द धरती से निकलने वाले सोते या झरने को दर्शाता है। ‘जल-स्रोत’ सामान्य पाठक के लिए स्पष्ट है और जल की काव्यात्मक छवि बनाए रखता है।
- source_word: יְשִׁיתוּהוּ
  choice: वे उसे ... बना देते हैं
  rationale: שׁית का अर्थ रखना, ठहराना या बना देना हो सकता है। पुल्लिंग एकवचन प्रत्यय का सम्बन्ध तराई से समझते हुए वाक्य का भाव है कि यात्री उसे जल-स्रोत बना देते हैं।
- source_word: גַּם
  choice: भी
  rationale: यह अगली, अतिरिक्त काव्यात्मक बात को जोड़ता है; हिन्दी में ‘भी’ स्वाभाविक और पर्याप्त है।
- source_word: בְּרָכוֹת
  choice: आशीषों से
  rationale: स्वरांकित इब्रानी रूप का सीधा अर्थ ‘आशीषें’ है। इससे जीवनदायी वर्षा और आशीष के बीच की काव्यात्मक प्रतिध्वनि बनी रहती है।
- source_word: יַעְטֶה
  choice: ढक देती है
  rationale: क्रिया ढकने, ओढ़ाने या आवृत करने का भाव देती है। वर्षा के कर्ता होने पर ‘ढक देती है’ हिन्दी में स्वाभाविक है।
- source_word: מוֹרֶה
  choice: पहली वर्षा
  rationale: कृषि और जल के इस प्रसंग में यह ऋतु के आरम्भ में होने वाली वर्षा को सूचित करता है। यही वर्षा प्रायः शरद ऋतु की आरम्भिक वर्षा होती है; ‘शिक्षक’ वाला सम्भव अर्थ पादटिप्पणी में सुरक्षित है।
theological_decisions:
- issue: הַבָּכָא को स्थान-नाम माना जाए या उसका अर्थ अनूदित किया जाए
  choice: मुख्य पाठ में ‘बाका’ स्थान-नाम रखा गया है
  alternative: ‘रोने की तराई’
  rationale: रूप यहाँ स्थान-नाम की तरह काम करता है, फिर भी वह ‘रोने’ के इब्रानी शब्द की ओर संकेत कर सकता है। लिप्यन्तरण किसी एक व्याख्या को अनावश्यक रूप से निश्चित नहीं करता।
- issue: מוֹרֶה का अर्थ
  choice: ‘पहली वर्षा’
  alternative: ‘शिक्षक’; अथवा स्पष्ट ऋतु-सूचक रूप में ‘शरद की वर्षा’
  rationale: निकटवर्ती प्रसंग जल-स्रोत, वर्षा और आशीष की छवियों से बना है, इसलिए वर्षा वाला अर्थ सर्वाधिक सुसंगत है। शब्द का ‘शिक्षक’ अर्थ पादटिप्पणी में रखा गया है ताकि मूल की वास्तविक शब्दगत अस्पष्टता न मिटे।
