  register: भाषा आधुनिक, गरिमापूर्ण और काव्यात्मक रखी गई है। ‘बाका’ को अनूदित न करके मूल की स्थान-नाम सम्बन्धी अस्पष्टता सुरक्षित रखी गई है। ‘जल-स्रोत’ और ‘आशीषों से ढक देती है’ सामान्य पाठक के लिए स्पष्ट रहते हुए इब्रानी जल-और-आशीष की संयुक्त छवि बनाए रखते हैं।
