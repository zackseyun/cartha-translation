  text: אַשְׁרֵ֣י אָ֭דָם עֽוֹז ל֥/וֹ בָ֑/ךְ מְ֝סִלּ֗וֹת בִּ/לְבָבָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/084/005.yaml
  text: Blessed is the man whose strength is in you[b][a], in whose heart are the highways.
translation:
  language: hi
  text: 'धन्य है वह मनुष्य जिसकी शक्ति तुझ में है,

    जिसके हृदय में राजमार्ग हैं।[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जिनके हृदयों में राजमार्ग हैं”; इब्रानी में “हृदय” के साथ जुड़ा “उनके” का प्रत्यय बहुवचन है, यद्यपि पद का आरम्भ एकवचन “मनुष्य” से होता है।
    reason: lexical_alternative
  - marker: b
    text: “राजमार्ग” सम्भवतः परमेश्वर के निवास की ओर जाने वाले तीर्थयात्रा के मार्ग हैं, पर इस पद में “सिय्योन की ओर” स्पष्ट रूप से नहीं कहा गया है।
    reason: cultural_note
lexical_decisions:
- source_word: אַשְׁרֵי
  choice: धन्य है
  rationale: यह बहुवचन रूप आशीर्वचन की रूढ़ शैली में प्रयुक्त है। अगले एकवचन אָדָם के अनुरूप हिन्दी में ‘धन्य है’ स्वाभाविक और गरिमापूर्ण है।
- source_word: אָדָם
  choice: वह मनुष्य
  rationale: यहाँ संज्ञा पुल्लिंग एकवचन है, पर प्रतिनिधिक और सामान्य अर्थ रखती है। ‘मनुष्य’ स्रोत के रूप को बनाए रखते हुए आधुनिक हिन्दी में सामान्य मानव-संदर्भ भी व्यक्त करता है।
- source_word: עֹז
  choice: शक्ति
  rationale: संदर्भ में अर्थ परमेश्वर में पाई जाने वाली सामर्थ्य का है, न कि मुख्यतः किसी गढ़ या शरणस्थान का।
- source_word: לוֹ ... בָךְ
  choice: जिसकी शक्ति तुझ में है
  rationale: לוֹ का शाब्दिक अर्थ ‘उसके लिए/उसकी’ है और בָךְ ‘तुझ में’। सम्बन्धवाचक रचना हिन्दी में भाव को स्वाभाविक ढंग से व्यक्त करती है और परमेश्वर में स्थित शक्ति का रूपक बनाए रखती है।
- source_word: מְסִלּוֹת
  choice: राजमार्ग
  rationale: यह शब्द प्रायः बनाए या ऊँचे किए गए प्रमुख मार्गों को दर्शाता है। ‘सिय्योन के’ जोड़ना संदर्भानुकूल होते हुए भी इस पद में स्पष्ट नहीं है, इसलिए उसे मुख्य पाठ में नहीं जोड़ा गया।
- source_word: בִּלְבָבָם
  choice: जिसके हृदय में
  rationale: इब्रानी में प्रत्यय बहुवचन ‘उनका’ है, जबकि आरम्भ में אָדָם एकवचन है। मुख्य पाठ प्रतिनिधिक एकवचन को सहज रखता है; संख्या-परिवर्तन को पादटिप्पणी में बताया गया है।
theological_decisions:
- issue: אָדָם का प्रतिनिधिक पुल्लिंग एकवचन
  choice: वह मनुष्य
  alternative: वह व्यक्ति
  rationale: ‘मनुष्य’ मूल के पुल्लिंग एकवचन रूप को अनावश्यक रूप से लिंग-निरपेक्ष किए बिना उसके सामान्य, प्रतिनिधिक अर्थ को हिन्दी में व्यक्त करता है।
- issue: מְסִלּוֹת के मार्गों का गंतव्य
  choice: राजमार्ग
  alternative: सिय्योन के राजमार्ग / तीर्थयात्रा के मार्ग
  rationale: भजन का व्यापक संदर्भ परमेश्वर के निवास की यात्रा का संकेत देता है, पर इस पद में सिय्योन या गंतव्य स्पष्ट रूप से नहीं कहा गया। इसलिए व्याख्यात्मक विस्तार मुख्य पाठ के बजाय पादटिप्पणी में रखा गया है।
- issue: एकवचन אָדָם से बहुवचन प्रत्यय בִּלְבָבָם की ओर परिवर्तन
  choice: मुख्य पाठ में प्रतिनिधिक एकवचन ‘जिसके हृदय में’
  alternative: जिनके हृदय में / उनके हृदय में
  rationale: इब्रानी की व्याकरणिक असंगति वास्तविक है। सहज हिन्दी के लिए एकवचन रखा गया है, पर बहुवचन प्रत्यय का तथ्य पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण काव्यात्मक शैली अपनाई गई है। परमेश्वर को संबोधन में एकवचन ‘तुझ’ रखा गया है, जो इब्रानी בָךְ की संख्या और निकट भक्तिपूर्ण संबोधन को सुरक्षित रखता है।
