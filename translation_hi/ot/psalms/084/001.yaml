source:
  edition: WLC
  text: מַה יְּדִיד֥וֹת מִשְׁכְּנוֹתֶ֗י/ךָ יְהוָ֥ה צְבָאֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/084/001.yaml
  text: How lovely are your dwelling places[a], O Yahweh of hosts!
translation:
  language: hi
  text: हे सेनाओं के याहवे, तेरे निवास-स्थान[a] कितने मनोहर हैं!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “तेरे निवास कितने प्रिय हैं!” अथवा “तेरे निवास-स्थान कितने सुहावने हैं!”
    reason: lexical_alternative
lexical_decisions:
- source_word: מַה
  choice: कितने
  rationale: यहाँ מַה प्रश्न नहीं, विस्मयादिबोधक तीव्रता व्यक्त करता है; ‘कितने’ स्वाभाविक हिन्दी काव्यात्मक समतुल्य है।
- source_word: יְּדִידוֹת
  choice: मनोहर
  rationale: यह शब्द प्रियता, रमणीयता और सुखदता का भाव रखता है। स्थानों के लिए ‘मनोहर’ आधुनिक, गरिमापूर्ण और स्वाभाविक है; अन्य अर्थ footnote में सुरक्षित हैं।
- source_word: מִשְׁכְּנוֹתֶיךָ
  choice: तेरे निवास-स्थान
  rationale: बहुवचन और परमेश्वर के वास से जुड़े मूल अर्थ—दोनों को बनाए रखता है; ‘तम्बू’ कहने से अर्थ अनावश्यक रूप से संकुचित हो सकता है।
- source_word: יְהוָה
  choice: यहवे
  rationale: चार-अक्षरीय व्यक्तिगत ईश-नाम का हिन्दी लिप्यंतरण किया गया है, उसे किसी उपाधि से प्रतिस्थापित नहीं किया गया।
- source_word: צְבָאוֹת
  choice: सेनाओं के
  rationale: यह पदवी स्वर्गीय और व्यापक सैन्य समूहों का बोध करा सकती है। ‘सेनाओं के यहवे’ स्रोत की संबंध-रचना और धार्मिक भार को बनाए रखता है।
theological_decisions:
- issue: ईश-नाम יְהוָה का अनुवाद
  choice: यहवे
  alternative: यहोवा; प्रभु
  rationale: मूल में व्यक्तिगत ईश-नाम स्पष्ट रूप से उपस्थित है; इसलिए उसे उपाधि ‘प्रभु’ से बदलने के बजाय लिप्यंतरित किया गया।
- issue: יְהוָה צְבָאוֹת पदवी की अभिव्यक्ति
  choice: हे सेनाओं के यहवे
  alternative: हे सेनाओं के प्रभु; हे सर्वशक्तिमान यहवे
  rationale: ‘सेनाओं’ से צְבָאוֹת का प्रत्यक्ष अर्थ बना रहता है। ‘सर्वशक्तिमान’ व्याख्यात्मक है और मूल पदवी की ठोस छवि मिटा देता है।
- issue: יְּדִידוֹת में प्रियता और रमणीयता का तनाव
  choice: मनोहर
  alternative: प्रिय; सुहावने
  rationale: मुख्य पाठ में स्थानों के संदर्भ में स्वाभाविक हिन्दी चुनी गई है, जबकि ‘प्रिय’ और ‘सुहावने’ की वास्तविक शाब्दिक संभावनाएँ पादटिप्पणी में रखी गई हैं।
translation_notes:
  register: आधुनिक मानक हिन्दी में काव्यात्मक, श्रद्धापूर्ण और सहज शैली। परमेश्वर को संबोधन में ‘तेरे’ रखा गया है, जो हिन्दी भक्ति-काव्य में निकटता और आदर दोनों व्यक्त कर सकता है। बहुवचन और विस्मयादिबोधक बल सुरक्षित रखे गए हैं।
