id: PSA.84.8
reference: Psalms 84:8
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: יְה֘וָ֤ה אֱלֹהִ֣ים צְ֭בָאוֹת שִׁמְעָ֣/ה תְפִלָּתִ֑/י הַאֲזִ֨ינָ/ה אֱלֹהֵ֖י יַעֲקֹ֣ב סֶֽלָה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/084/008.yaml
  text: O Yahweh God of hosts[a], hear my prayer; give ear, O God of Jacob[b]. Selah
translation:
  language: hi
  text: 'हे याहवे[a], सेनाओं के परमेश्वर, मेरी प्रार्थना सुन;

    हे याकूब के परमेश्वर, कान दे!

    सेला[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में परमेश्वर का व्यक्तिगत नाम ‘याहवे’ है; अनेक अनुवादों में परंपरागत रूप से इसके स्थान पर ‘प्रभु’ लिखा जाता है।
    reason: alternative_reading
  - marker: b
    text: ‘सेला’ अनिश्चित अर्थ वाला इब्रानी उपासना-संबंधी या संगीत-संबंधी शब्द है; इसके संभावित अर्थों में ‘विराम’ या ‘संगीतांतर’ शामिल हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: यहवे
  rationale: परमेश्वर के व्यक्तिगत वाचा-नाम को उपाधि से बदलने के बजाय उसका निकट देवनागरी लिप्यंतरण किया गया है।
- source_word: אֱלֹהִים צְבָאוֹת
  choice: सेनाओं के परमेश्वर
  rationale: यह प्रचलित दैवी उपाधि है; बहुवचन ‘सेनाओं’ मूल शब्द की व्यापकता को बनाए रखता है और उन्हें केवल सांसारिक या केवल स्वर्गीय सेनाएँ नहीं ठहराता।
- source_word: שִׁמְעָה
  choice: सुन
  rationale: एकवचन आज्ञार्थक विनती को संक्षिप्त और प्रार्थनामय रूप में व्यक्त करता है।
- source_word: תְפִלָּתִי
  choice: मेरी प्रार्थना
  rationale: संज्ञा और प्रथम पुरुष एकवचन संबंधसूचक प्रत्यय का सीधा अनुवाद।
- source_word: הַאֲזִינָה
  choice: कान लगा
  rationale: पहले आए ‘सुन’ से भिन्न अभिव्यक्ति रखकर इब्रानी काव्य-समानांतरता और आग्रह की तीव्रता सुरक्षित की गई है।
- source_word: אֱלֹהֵי יַעֲקֹב
  choice: याकूब के परमेश्वर
  rationale: याकूब के साथ परमेश्वर के संबंध को दर्शाने वाली संबंध-रचना का स्वाभाविक और पारदर्शी अनुवाद।
- source_word: סֶלָה
  choice: सेला
  rationale: इस उपासना-संबंधी या संगीत-संबंधी शब्द का ठीक अर्थ अनिश्चित है, इसलिए अर्थ तय करने के बजाय लिप्यंतरण रखा गया है।
theological_decisions:
- issue: दैवी नाम יְהוָה का अनुवाद
  choice: यहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में व्यक्तिगत दैवी नाम है। ‘यहवे’ उसका निकट लिप्यंतरण है और उसे किसी उपाधि से प्रतिस्थापित नहीं करता।
- issue: סֶלָה का अर्थ
  choice: सेला
  alternative: विराम; संगीतांतर
  rationale: शब्द का सटीक कार्य विवादित और अनिश्चित है; लिप्यंतरण इस अनिश्चितता को सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिंदी में संक्षिप्त, गरिमापूर्ण प्रार्थना-काव्य रखा गया है। एकवचन सीधे संबोधन ‘सुन’ और ‘कान लगा’ मूल आज्ञार्थक रूप तथा दोनों क्रियाओं के काव्यात्मक अंतर को बनाए रखते हैं। पंक्ति-विभाजन इब्रानी समानांतरता को उभारता है।
