id: PSA.84.3
reference: Psalms 84:3
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: גַּם צִפּ֨וֹר מָ֪צְאָה בַ֡יִת וּ/דְר֤וֹר קֵ֥ן לָ/הּ֮ אֲשֶׁר שָׁ֪תָה אֶפְרֹ֫חֶ֥י/הָ אֶֽת מִ֭זְבְּחוֹתֶי/ךָ יְהוָ֣ה צְבָא֑וֹת מַ֝לְכִּ֗/י וֵ/אלֹהָֽ/י־׀׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/084/003.yaml
  text: Even the sparrow has found a home[a], and the swallow a nest for herself, where she may lay her young—at your altars, O Yahweh of Armies[c][b], my King and my God.
translation:
  language: hi
  text: यहाँ तक कि गौरैया को भी घर मिल गया है, और अबाबील को अपने लिए घोंसला, जहाँ वह अपने बच्चों को रख सके[a]—आपकी वेदियों के पास[b], हे सेनाओं के याहवे[c], मेरे राजा और मेरे परमेश्वर!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जहाँ उसने अपने बच्चों को रख दिया है।” इब्रानी क्रिया को पूर्ण हो चुकी क्रिया के रूप में भी समझा जा सकता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रचना अत्यंत संक्षिप्त है; अनुवाद “आपकी वेदियों पर” या “आपकी वेदियों के निकट” भी हो सकता है।
    reason: lexical_alternative
  - marker: c
    text: 'पारंपरिक: “सेनाओं का प्रभु।”'
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם
  choice: यहाँ तक कि ... भी
  rationale: 'पद में निहित बलात्मक तुलना को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है: छोटे पक्षियों तक को परमेश्वर के पवित्रस्थान के निकट आश्रय मिलता है।'
- source_word: צִפּוֹר
  choice: गौरैया
  rationale: यद्यपि शब्द सामान्यतः छोटे पक्षी को भी दर्शा सकता है, काव्यात्मक युग्म में 'गौरैया' एक पारंपरिक और शब्दार्थ की सीमा के भीतर विशिष्ट अनुवाद है।
- source_word: מָצְאָה בַיִת
  choice: घर मिल गया है
  rationale: इब्रानी पूर्ण क्रिया के प्राप्त परिणाम को दर्शाता है और केवल किसी भवन को ढूँढ़ने के बजाय आश्रय पा लेने का भाव देता है।
- source_word: דְּרוֹר
  choice: अबाबील
  rationale: इस पक्षी-नाम का सामान्य और परिचित हिन्दी पर्याय है; सटीक प्रजाति पूरी तरह निश्चित न होने पर भी यह प्रचलित अर्थ को व्यक्त करता है।
- source_word: קֵן לָהּ
  choice: अपने लिए घोंसला
  rationale: सम्प्रदानवाचक स्त्रीलिंग सर्वनाम पक्षी के अपने लाभ या अधिकार के लिए घोंसले का भाव देता है।
- source_word: אֲשֶׁר שָׁתָה אֶפְרֹחֶיהָ
  choice: जहाँ वह अपने बच्चों को रख सके
  rationale: שׁית का मूल भाव 'रखना/स्थापित करना' है। यह वाक्य घोंसले के प्रयोजन को स्वाभाविक हिन्दी में व्यक्त करता है; पूर्ण हो चुकी क्रिया का सम्भव पाठ पादटिप्पणी में सुरक्षित है।
- source_word: אֶת מִזְבְּחוֹתֶיךָ
  choice: आपकी वेदियों के पास
  rationale: संकुचित इब्रानी रचना को शाब्दिक रूप से 'वेदियों को' कहना हिन्दी में अस्वाभाविक होगा। प्रसंग पवित्रस्थान की वेदियों के निकटता का संकेत देता है; इससे वेदी पर ही घोंसला होने का अनावश्यक दावा भी नहीं होता।
- source_word: יְהוָה
  choice: यहोवा
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को हिन्दी में व्यापक रूप से पहचाने जाने वाले लिप्यंतरण 'यहोवा' से प्रस्तुत किया गया है, किसी उपाधि से प्रतिस्थापित नहीं किया गया।
- source_word: צְבָאוֹת
  choice: सेनाओं के
  rationale: शब्द का ठोस अर्थ सेनाएँ या सैन्य दल है; यह पारंपरिक किन्तु आज कम पारदर्शी 'गणों' की अपेक्षा आधुनिक पाठक के लिए स्पष्ट है।
- source_word: מַלְכִּי וֵאלֹהָי
  choice: मेरे राजा और मेरे परमेश्वर
  rationale: दोनों संबोधन व्यक्तिगत स्वीकारोक्ति के रूप में सीधे परमेश्वर से कहे गए हैं।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: मूल पाठ व्यक्तिगत ईश्वरीय नाम का प्रयोग करता है। हिन्दी पाठक के लिए स्थापित लिप्यंतरण 'यहोवा' नाम को उपाधि में बदले बिना सुरक्षित रखता है; उच्चारण-पुनर्निर्माण 'याहवे' पादटिप्पणी में दिया गया है।
- issue: צְבָאוֹת वाली ईश्वरीय उपाधि
  choice: सेनाओं के यहोवा
  alternative: सेनाओं के याहवे; गणों के यहोवा
  rationale: '''सेनाओं'' से उपाधि का सैन्य और सार्वभौम बल आधुनिक हिन्दी में स्पष्ट रहता है।'
- issue: वेदियों से पक्षियों का स्थानिक संबंध
  choice: वेदियों के पास
  alternative: वेदियों पर; वेदियों के निकट
  rationale: इब्रानी रचना अत्यंत संक्षिप्त है और स्थानिक संबंध को पूरी तरह स्पष्ट नहीं करती। 'के पास' सम्भावित निकटता को व्यक्त करता है और पक्षियों को बलिदान-वेदियों पर ही बैठाने की अतिशाब्दिक व्याख्या से बचता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और काव्यात्मक रखी गई है। परमेश्वर के सीधे संबोधन में आदरसूचक 'आप' अपनाया गया है। विस्मयादिबोधक चिह्न संबोधन की भावात्मक पूर्णता दिखाता है; डैश पक्षियों के घोंसले और वेदियों के बीच काव्यात्मक संबंध बनाए रखता है।
