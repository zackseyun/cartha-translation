  text: Blessed are those who dwell in your house[a]; they will still praise you[c][b]. Selah
translation:
  language: hi
  text: धन्य हैं[a] वे जो आपके घर[b] में रहते हैं; वे आगे भी आपकी स्तुति करते रहेंगे। सेला[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘कितने धन्य हैं वे जो आपके घर में रहते हैं!’
    reason: lexical_alternative
  - marker: b
    text: ‘आपके घर’ से सम्भवतः परमेश्वर का पवित्रस्थान या मंदिर अभिप्रेत है।
    reason: cultural_note
  - marker: c
    text: ‘सेला’ अनिश्चित अर्थ वाला एक इब्रानी उपासना या संगीत सम्बन्धी पद है; परम्परागत रूप से इसका अनुवाद नहीं किया जाता।
    reason: lexical_alternative
lexical_decisions:
- source_word: אַשְׁרֵי
  choice: धन्य हैं
  rationale: यह बहुवचन विस्मयात्मक रूप धन्यता की घोषणा करता है। ‘धन्य हैं’ इसकी भजनात्मक गरिमा बनाए रखता है; ‘कितने धन्य हैं’ भी सम्भव है।
- source_word: יוֹשְׁבֵי
  choice: वे जो ... रहते हैं
  rationale: यह कृदन्त यहाँ केवल बैठने नहीं, बल्कि निवास करने या बने रहने का निरन्तर भाव व्यक्त करता है।
- source_word: בֵיתֶךָ
  choice: आपके घर
  rationale: इब्रानी में शाब्दिक अर्थ ‘आपका घर’ है। प्रसंग में यह परमेश्वर के पवित्रस्थान का संकेत है, पर मुख्य पाठ में मूल बिंब को बनाए रखा गया है।
- source_word: עוֹד
  choice: आगे भी
  rationale: यह जारी रहने का भाव देता है। ‘आगे भी’ अपूर्ण क्रिया के भावी तथा निरन्तर, दोनों सम्भव अर्थों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: יְהַלְלוּךָ
  choice: आपकी स्तुति करते रहेंगे
  rationale: अपूर्ण क्रिया भविष्य या अभ्यस्त क्रिया व्यक्त कर सकती है। ‘करते रहेंगे’ स्तुति के जारी रहने का भाव रखता है और कर्म-प्रत्यय को ‘आपकी’ द्वारा स्पष्ट करता है।
- source_word: סֶּלָה
  choice: सेला
  rationale: इस इब्रानी उपासना-संगीत सम्बन्धी पद का ठीक अर्थ अनिश्चित है; इसलिए कोई अनुमानित अर्थ देने के बजाय इसका लिप्यन्तरण किया गया है।
theological_decisions:
- issue: ‘आपके घर’ का आशय
  choice: मुख्य पाठ में ‘आपके घर’ रखा गया है।
  alternative: आपके मंदिर में
  rationale: यह सम्भवतः परमेश्वर के पवित्रस्थान या मंदिर को सूचित करता है, पर ‘घर’ इब्रानी की काव्यात्मक और धर्मवैचारिक छवि को बिना अनावश्यक रूप से सीमित किए सुरक्षित रखता है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण मानक हिन्दी। परमेश्वर के लिए आदरसूचक ‘आप’ का प्रयोग किया गया है। वाक्य की भजनात्मक संक्षिप्तता और ‘घर’ का मूल बिंब सुरक्षित रखा गया है।
