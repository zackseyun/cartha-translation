source:
  edition: WLC
  text: כִּ֤י שֶׁ֨מֶשׁ וּ/מָגֵן֮ יְהוָ֪ה אֱלֹ֫הִ֥ים חֵ֣ן וְ֭/כָבוֹד יִתֵּ֣ן יְהוָ֑ה לֹ֥א יִמְנַע ט֝֗וֹב לַֽ/הֹלְכִ֥ים בְּ/תָמִֽים׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/084/011.yaml
  text: For Yahweh God is a sun and shield[a]; Yahweh gives favor and honor[b]. He does not withhold good from those who walk blamelessly.
translation:
  language: hi
  text: क्योंकि यहोवा परमेश्वर सूर्य और ढाल है; यहोवा कृपा और सम्मान[a] देता है। जो खराई से चलते हैं[b], उनसे वह कोई भलाई नहीं रोकता।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अनुग्रह और महिमा।”
    reason: lexical_alternative
  - marker: b
    text: “खराई से” का अर्थ ईमानदारी और निष्कपटता से है, न कि पापरहित सिद्धता।
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले कथन का आधार प्रस्तुत करता है; हिन्दी में ‘क्योंकि’ कारणसूचक संबंध को स्वाभाविक रूप से व्यक्त करता है।
- source_word: שֶׁמֶשׁ וּמָגֵן
  choice: सूर्य और ढाल
  rationale: 'दोनों काव्यात्मक रूपकों को बिना व्याख्यात्मक विस्तार के सुरक्षित रखा गया है: सूर्य प्रकाश और जीवनदायी उपस्थिति का, तथा ढाल रक्षा का चित्र प्रस्तुत करता है।'
- source_word: יְהוָה אֱלֹהִים
  choice: यहोवा परमेश्वर
  rationale: व्यक्तिगत दिव्य नाम को ‘यहोवा’ और אֱלֹהִים को स्वाभाविक हिन्दी उपाधि ‘परमेश्वर’ से व्यक्त किया गया है।
- source_word: חֵן
  choice: अनुग्रह
  rationale: חֵן कृपापूर्ण अनुकूलता या अनुग्रह को व्यक्त करता है। ‘अनुग्रह’ आधुनिक बाइबलीय हिन्दी में स्वाभाविक है और यहाँ किसी बाद की व्यवस्थित धर्मवैज्ञानिक धारणा को आवश्यक रूप से आरोपित नहीं करता।
- source_word: וְכָבוֹד
  choice: और सम्मान
  rationale: כָבוֹד का मूल भाव भार, महिमा या प्रतिष्ठा है; यहाँ परमेश्वर द्वारा मनुष्यों को दी जाने वाली गरिमा के संदर्भ में ‘सम्मान’ अधिक स्वाभाविक है, जबकि ‘महिमा’ भी संभव है।
- source_word: יִתֵּן
  choice: देता है
  rationale: अपूर्ण क्रिया यहाँ परमेश्वर के सामान्य और चरितार्थ कार्य को बताती है; वर्तमानकालीन ‘देता है’ इस नीतिवचनात्मक भाव को व्यक्त करता है।
- source_word: לֹא יִמְנַע טוֹב
  choice: कोई अच्छी वस्तु नहीं रोकता
  rationale: हिब्रू का अर्थ है कि वह ‘भलाई’ या ‘अच्छी वस्तु’ देने से पीछे नहीं रहता। हिन्दी में कर्म को स्पष्ट करके वाक्य को स्वाभाविक रखा गया है।
- source_word: לַהֹלְכִים בְּתָמִים
  choice: जो खरी चाल चलते हैं
  rationale: הלך के जीवन-आचरण वाले रूपक को ‘चाल चलते हैं’ से और תמים की संपूर्णता, निष्कपटता तथा खराई को ‘खरी’ से व्यक्त किया गया है; इससे पापरहित सिद्धता का अनावश्यक अर्थ नहीं निकलता।
theological_decisions:
- issue: दिव्य नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे / प्रभु
  rationale: हिब्रू में वाचा-संबंधी व्यक्तिगत नाम सीधे उपस्थित है। ‘यहोवा’ हिन्दी पाठकों के लिए प्रचलित और पहचाना हुआ रूप है तथा नाम को किसी उपाधि से प्रतिस्थापित नहीं करता।
- issue: חֵן וְכָבוֹד का अर्थ
  choice: अनुग्रह और सम्मान
  alternative: कृपा और महिमा
  rationale: दोनों अर्थ-युग्म भाषिक रूप से संभव हैं। मुख्य पाठ में परमेश्वर द्वारा दी जाने वाली अनुकूलता और प्रतिष्ठा को सहज हिन्दी में रखा गया है; काव्यात्मक ‘महिमा’ की संभावना को निर्णय में स्वीकार किया गया है।
- issue: בְּתָמִים और नैतिक सिद्धता
  choice: खरी चाल चलते हैं
  alternative: निर्दोष चाल चलते हैं / सिद्धता से चलते हैं
  rationale: תמים यहाँ अखंड निष्ठा, खराई और निष्कपट आचरण दर्शाता है; यह अपने-आप में पूर्ण पापरहितता का दावा नहीं करता। ‘खरी चाल’ उस नैतिक गंभीरता को बनाए रखते हुए संभावित गलत अर्थ से बचती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और काव्यात्मक रखी गई है। ‘सूर्य और ढाल’ तथा ‘चाल चलते हैं’ जैसे मूल रूपक सुरक्षित हैं। मुख्य पाठ सामान्य हिन्दी पाठक के लिए सुबोध है और जहाँ हिब्रू में एक से अधिक अर्थ संभव हैं वहाँ किसी संप्रदायगत व्याख्या को आरोपित नहीं किया गया।
