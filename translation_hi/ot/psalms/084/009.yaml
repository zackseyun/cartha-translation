base_translation:
  language: en
  yaml_path: translation/ot/psalms/084/009.yaml
  text: Look on our shield[a], O God[b], and look on the face of your anointed.
translation:
  language: hi
  text: 'हे परमेश्वर, हमारी ढाल[a] पर दृष्टि कर;

    अपने अभिषिक्त[b] के मुख पर दृष्टि कर।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘हमारा रक्षक।’ इब्रानी में शाब्दिक रूप से ‘हमारी ढाल’ है। यह काव्यात्मक रूपक परमेश्वर को रक्षक के रूप में अथवा राजा को सूचित कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: ‘अभिषिक्त’ के लिए प्रयुक्त इब्रानी शब्द से ही ‘मसीहा’ शब्द निकला है। यहाँ इसका प्राथमिक संदर्भ संभवतः दाऊदी राजा है, यद्यपि इसमें व्यापक मसीहा-संबंधी प्रतिध्वनि भी हो सकती है।
    reason: alternative_reading
lexical_decisions:
- source_word: מָגִנֵּנוּ
  choice: हमारी ढाल
  rationale: מָגֵן का ठोस अर्थ ‘ढाल’ है। इसे रूपक के रूप में बनाए रखने से यह अस्पष्टता सुरक्षित रहती है कि संकेत परमेश्वर को रक्षक के रूप में है या अभिषिक्त राजा को।
- source_word: רְאֵה
  choice: दृष्टि कर
  rationale: यह आज्ञार्थक निवेदन केवल देखने का नहीं, कृपापूर्वक ध्यान देने का भाव रखता है। ‘दृष्टि कर’ प्रार्थनात्मक और काव्यात्मक संदर्भ में स्वाभाविक है।
- source_word: אֱלֹהִים
  choice: हे परमेश्वर
  rationale: यहाँ सीधा संबोधन है; ‘हे’ संबोधन को स्पष्ट करता है और ‘परमेश्वर’ आधुनिक मानक हिन्दी का प्रतिष्ठित बाइबलीय शब्द है।
- source_word: וְהַבֵּט
  choice: दृष्टि कर
  rationale: נבט ध्यानपूर्वक देखने का संकेत देता है। हिन्दी में उसी अभिव्यक्ति की पुनरावृत्ति इब्रानी समानांतरता को सहज और गरिमापूर्ण ढंग से बनाए रखती है।
- source_word: פְּנֵי
  choice: के मुख पर
  rationale: פָּנִים का मूल अर्थ ‘मुख’ है। ठोस काव्यात्मक बिंब को बनाए रखा गया है, न कि उसे व्याख्यात्मक ‘उपस्थिति’ में बदला गया।
- source_word: מְשִׁיחֶךָ
  choice: अपने अभिषिक्त
  rationale: מָשִׁיחַ का अर्थ ‘अभिषिक्त जन’ है। यहाँ यह पहले दाऊदी राजा की ओर संकेत कर सकता है; ‘मसीहा’ मुख्य पाठ में रखने से अर्थ आवश्यकता से अधिक विशिष्ट हो जाता।
theological_decisions:
- issue: ‘हमारी ढाल’ का संदर्भ
  choice: रूपक ‘हमारी ढाल’ को बिना संदर्भ तय किए रखा गया।
  alternative: इसे ‘हमारे रक्षक’ कहना, अथवा परमेश्वर या राजा के रूप में स्पष्ट करना।
  rationale: इब्रानी पद परमेश्वर और राजा—दोनों की ओर संकेत की संभावना खुली रखता है; अनुवाद इस काव्यात्मक और धर्मवैचारिक तनाव को नहीं सुलझाता।
- issue: ‘अपने अभिषिक्त’ का संदर्भ
  choice: ‘अभिषिक्त’ को सामान्य पदवी के रूप में रखा गया, विशेष नाम की तरह नहीं।
  alternative: ‘अपने मसीहा’ या ‘अपने अभिषिक्त जन’ कहना।
  rationale: तात्कालिक संदर्भ में दाऊदी राजा संभावित प्राथमिक संदर्भ है। ‘मसीहा’ कहना बाद की मसीही प्रतिध्वनि को मुख्य अर्थ के रूप में निर्धारित कर सकता है; शब्द-संबंध पादटिप्पणी में बताया गया है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में प्रार्थनात्मक, काव्यात्मक और गरिमापूर्ण रखी गई है। दोनों इब्रानी आज्ञार्थक क्रियाओं को ‘दृष्टि कर’ से व्यक्त करके समानांतरता सुरक्षित की गई है। ‘ढाल,’ ‘मुख,’ और ‘अभिषिक्त’ जैसे मूल बिंब और पदवी बिना अनावश्यक व्याख्या के बनाए रखे गए हैं।
