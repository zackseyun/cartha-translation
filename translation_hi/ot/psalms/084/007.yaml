  text: They go from strength to strength[b][a]; each one appears before God in Zion.
translation:
  language: hi
  text: वे सामर्थ्य से सामर्थ्य की ओर बढ़ते जाते हैं[a]; उनमें से हर एक सिय्योन में परमेश्वर के सामने उपस्थित होता है[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “वे दल से दल की ओर” अथवा “विजय से विजय की ओर” बढ़ते जाते हैं; यहाँ प्रयुक्त इब्रानी शब्द सामर्थ्य, वीरता या सेना को भी सूचित कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से “परमेश्वर के सामने प्रकट होता है” (या “परमेश्वर की ओर दिखाई देता है”); इस संदर्भ में संभवतः अर्थ है कि हर एक उपासना के लिए परमेश्वर के सामने उपस्थित होता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: יֵלְכוּ
  choice: आगे बढ़ते हैं
  rationale: הלך का क़ाल अपूर्ण बहुवचन निरंतर या प्रगतिशील गति बताता है। तीर्थयात्रा के संदर्भ में ‘आगे बढ़ते हैं’ स्वाभाविक है और चलने के ढंग को अनावश्यक रूप से सीमित नहीं करता।
- source_word: מֵחַיִל אֶל חָיִל
  choice: बल पर बल पाते हुए
  rationale: חַיִל का अर्थ-क्षेत्र बल, सामर्थ्य, वीरता, सेना और विजय तक फैला है। इस तीर्थयात्रा-संदर्भ में यह बढ़ते अथवा नए होते बल का संकेत देता है; हिंदी में यह अभिव्यक्ति उस प्रगति को स्पष्ट और स्वाभाविक रूप से व्यक्त करती है।
- source_word: יֵרָאֶה
  choice: उपस्थित होता है
  rationale: ראה का निफ़अल अपूर्ण एकवचन उपासना-संबंधी संदर्भ में स्वयं को उपस्थित करने, अर्थात दर्शन के लिए आने, का भाव दे सकता है। ‘उपस्थित होता है’ केवल निष्क्रिय ‘दिखाई देता है’ की अपेक्षा इस मुहावरे को बेहतर व्यक्त करता है।
- source_word: אֶל אֱלֹהִים
  choice: परमेश्वर के सामने
  rationale: אֶל का मूल भाव ‘की ओर/को’ है, पर उपासना में उपस्थित होने के इस मुहावरे में हिंदी का ‘परमेश्वर के सामने’ अधिक स्वाभाविक है।
- source_word: בְצִיּוֹן
  choice: सिय्योन में
  rationale: स्थानवाचक नाम को प्रचलित हिंदी बाइबलीय रूप ‘सिय्योन’ में रखा गया है; בְ का स्थानीय अर्थ ‘में’ है।
- source_word: יֵרָאֶה (singular with plural context)
  choice: उनमें से हर एक ... उपस्थित होता है
  rationale: आसपास का कथन बहुवचन है, किंतु क्रिया एकवचन है। ‘उनमें से हर एक’ उसके वितरणात्मक एकवचन भाव को स्पष्ट रखता है।
theological_decisions:
- issue: परमेश्वर के सामने उपस्थित होने का मुहावरेदार अर्थ
  choice: यह पंक्ति सिय्योन में उपासना के लिए परमेश्वर के सामने उपस्थित होने वाले तीर्थयात्रियों का वर्णन करती है।
  alternative: इसे अधिक निष्क्रिय अर्थ में ‘सिय्योन में परमेश्वर को/के द्वारा दिखाई देता है’ भी समझा जा सकता है।
  rationale: ראה का निफ़अल उपासना और तीर्थयात्रा के संदर्भों में देवता के सामने उपस्थित होने का अर्थ दे सकता है। मुख्य पाठ में संभावित मुहावरेदार अर्थ रखा गया है और अधिक शाब्दिक संभावना पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: आधुनिक मानक हिंदी में सहज, गरिमापूर्ण और सार्वजनिक पाठ के योग्य शैली रखी गई है। ‘बल पर बल पाते हुए’ इब्रानी पुनरुक्त संरचना का भाव बचाते हुए हिंदी में स्वाभाविक प्रगति व्यक्त करता है; पादटिप्पणियाँ वास्तविक शब्दार्थगत अस्पष्टता को सुरक्षित रखती हैं।
