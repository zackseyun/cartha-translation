language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: כִּ֤י טֽוֹב י֥וֹם בַּ/חֲצֵרֶ֗י/ךָ מֵ֫/אָ֥לֶף בָּחַ֗רְתִּי הִ֭סְתּוֹפֵף בְּ/בֵ֣ית אֱלֹהַ֑/י מִ֝/דּ֗וּר בְּ/אָהֳלֵי רֶֽשַׁע־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/084/010.yaml
  text: For a day in your courts is better than a thousand[b][a]; I would rather stand at the threshold in the house of my God than dwell in the tents of wickedness.
translation:
  language: hi
  text: क्योंकि तेरे आँगनों में एक दिन हज़ार[b] से उत्तम है; मैंने दुष्टता के तंबुओं में रहने की अपेक्षा अपने परमेश्वर के भवन की दहलीज़ पर खड़ा रहना चुना है[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मैं दुष्टता के तंबुओं में रहने की अपेक्षा अपने परमेश्वर के भवन की दहलीज़ पर खड़ा रहना पसंद करूँगा”; परंपरागत अनुवाद, “मैं अपने परमेश्वर के भवन में द्वारपाल होना पसंद करूँगा।”
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में केवल “हज़ार से” है; “दिनों” या “कहीं और” शब्द मूल पाठ में नहीं हैं।
    reason: alternative_reading
lexical_decisions:
- source_word: טוֹב ... מֵאָלֶף
  choice: हज़ार दिनों से उत्तम
  rationale: טוֹב के साथ מִן तुलनात्मक अर्थ देता है। इब्रानी में ‘हज़ार’ के बाद संज्ञा नहीं है, पर पहली पंक्ति के ‘दिन’ से उसका लोप स्वाभाविक रूप से पूरा होता है; हिंदी में स्पष्टता के लिए ‘दिनों’ जोड़ा गया है।
- source_word: בַּחֲצֵרֶיךָ
  choice: तेरे आँगनों में
  rationale: חָצֵר उपासना-स्थान के आँगन को दर्शाता है। ‘आँगनों’ बहुवचन और ठोस स्थान-चित्र दोनों बनाए रखता है।
- source_word: בָּחַרְתִּי
  choice: मैंने ... चुना है
  rationale: क्रिया का पूर्ण रूप सीधे तौर पर किए हुए चुनाव को व्यक्त करता है। इसे केवल काल्पनिक वरीयता (‘मैं ... बेहतर समझूँगा’) में बदलने के बजाय मूल की निर्णयात्मकता रखी गई है।
- source_word: הִסְתּוֹפֵף
  choice: दहलीज़ पर रहना
  rationale: यह दुर्लभ क्रिया दहलीज़ के पास निम्न स्थान लेने का भाव देती है; ‘द्वारपाल होना’ एक औपचारिक पद जोड़ सकता है जो शब्द में स्पष्ट नहीं है।
- source_word: בְּבֵית אֱלֹהַי
  choice: अपने परमेश्वर के भवन की
  rationale: ‘भवन’ בַּיִת का स्वाभाविक धार्मिक-संदर्भित अनुवाद है और ‘मंदिर’ कहकर आशय को अनावश्यक रूप से अधिक विशिष्ट नहीं करता। स्थान-संबंध को हिंदी में ‘की दहलीज़’ के साथ स्वाभाविक बनाया गया है।
- source_word: בְּאָהֳלֵי רֶשַׁע
  choice: दुष्टता के तंबुओं में
  rationale: רֶשַׁע अमूर्त संज्ञा है; ‘दुष्टता’ मूल के नैतिक गुण को बनाए रखती है, जबकि ‘दुष्टों के’ उसे व्यक्तियों में बदल देता।
theological_decisions:
- issue: पवित्रस्थान की भाषा
  choice: तेरे आँगनों / मेरे परमेश्वर के भवन
  alternative: तेरे प्रांगणों / मेरे परमेश्वर के मंदिर
  rationale: अनुवाद परमेश्वर के पवित्रस्थान से निकटता का ठोस चित्र बनाए रखता है, पर בַּיִת को ‘मंदिर’ कहकर मूल से अधिक विशिष्ट नहीं करता।
- issue: दहलीज़ पर विनम्र स्थान या द्वारपाल का पद
  choice: दहलीज़ पर रहना
  alternative: द्वारपाल होना
  rationale: मूल क्रिया विनम्रतापूर्वक दहलीज़ के पास रहने का संकेत देती है; किसी औपचारिक धार्मिक पद को निश्चित करना उचित नहीं।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिंदी। परमेश्वर को संबोधन में काव्यात्मक एकवचन ‘तेरे’ रखा गया है। ‘आँगन’, ‘भवन’, ‘दहलीज़’ और ‘तंबू’ मूल के स्थान-संबंधी बिंबों को स्पष्ट और स्वाभाविक रखते हैं।
