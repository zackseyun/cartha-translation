id: PSA.135.20
reference: Psalms 135:20
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: בֵּ֣ית הַ֭/לֵּוִי בָּרֲכ֣וּ אֶת יְהוָ֑ה יִֽרְאֵ֥י יְ֝הוָ֗ה בָּרֲכ֥וּ אֶת יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/135/020.yaml
  text: House of Levi[a], bless Yahweh; you who fear Yahweh[b], bless Yahweh.
translation:
  language: hi
  text: 'हे लेवी के घराने[a], याहवे को धन्य कहो;

    हे याहवे का भय माननेवालो[b], याहवे को धन्य कहो।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से ‘लेवी का घर’; यह लेवीवंशी समुदाय के लिए सामूहिक संबोधन है।
    reason: cultural_note
  - marker: b
    text: या, ‘जो याहवे का भय मानते हैं।’
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּית הַלֵּוִי
  choice: लेवी के घराने
  rationale: मूल इब्रानी का शाब्दिक अर्थ ‘लेवी का घर’ है। आसपास के पदों में ‘इस्राएल के घराने’ और ‘हारून के घराने’ के समानांतर यह लेवीवंशी समुदाय का सामूहिक नाम है; ‘घराने’ से यह समानांतरता और वंशगत भाव दोनों बने रहते हैं।
- source_word: בָּרֲכוּ
  choice: धन्य कहो
  rationale: ברך का बहुवचन आज्ञार्थक रूप उपासना के संदर्भ में परमेश्वर की स्तुति और उसे धन्य घोषित करने का आह्वान है। आधुनिक हिन्दी में ‘धन्य कहो’ इस अर्थ को ‘आशीर्वाद दो’ की अपेक्षा अधिक स्वाभाविक और स्पष्ट रूप से व्यक्त करता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: चार अक्षरों वाले व्यक्तिगत ईश्वरीय नाम को किसी उपाधि से बदलने के बजाय हिन्दी में निकट ध्वन्यात्मक लिप्यंतरण ‘याहवे’ दिया गया है।
- source_word: יִרְאֵי יְהוָה
  choice: हे याहवे का भय माननेवालो
  rationale: यह कृदन्तीय पद उन लोगों के वर्ग को दर्शाता है जिनकी पहचान याहवे का भय मानने से होती है। सम्बोधन ‘हे … माननेवालो’ अगले बहुवचन आज्ञार्थक क्रिया के साथ स्वाभाविक है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में व्यक्तिगत वाचा-नाम सीधे प्रयुक्त हुआ है। ‘याहवे’ उसका निकट लिप्यंतरण है और उसे ‘प्रभु’ जैसी उपाधि से नहीं बदलता।
- issue: मनुष्यों द्वारा परमेश्वर को ‘धन्य’ कहना
  choice: धन्य कहो
  alternative: स्तुति करो
  rationale: यह चयन ברך के मूल शब्दार्थ और भजन में दोहराए गए उपासना-संबंधी आह्वान को बनाए रखता है। ‘स्तुति करो’ अर्थ की व्याख्या करता, पर ‘धन्य कहो’ मूल अभिव्यक्ति के अधिक निकट है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामूहिक उपासना में बोलने योग्य रखी गई है। ‘हे’ से दोनों पंक्तियों का प्रत्यक्ष सम्बोधन स्पष्ट होता है; पद की समानांतर काव्य-रचना और दोहराव सुरक्षित रखे गए हैं।
