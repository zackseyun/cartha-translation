  yaml_path: translation/ot/psalms/135/011.yaml
  text: to Sihon king of the Amorites, and to Og king of Bashan, and to all the kingdoms of Canaan.
translation:
  language: hi
  text: एमोरियों के राजा सीहोन को, और बाशान के राजा ओग को, और कनान के सभी राज्यों को।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְ/סִיחוֹן
  choice: सीहोन को
  rationale: पूर्ववर्ती वाक्य की क्रिया से जुड़े लक्ष्य को दिखाने के लिए उपसर्ग לְ का अनुवाद ‘को’ किया गया है; नाम का मानक हिन्दी लिप्यंतरण रखा गया है।
- source_word: מֶלֶךְ הָאֱמֹרִי
  choice: एमोरियों के राजा
  rationale: लेखयुक्त जातिवाचक शब्द यहाँ एमोरी जाति को सामूहिक रूप से दर्शाता है; हिन्दी में बहुवचन ‘एमोरियों’ स्वाभाविक और स्पष्ट है।
- source_word: וּ/לְ/עוֹג
  choice: और ... ओग को
  rationale: וּ और לְ दोनों को व्यक्त करते हुए सूची की समानांतर रचना सुरक्षित रखी गई है।
- source_word: מֶלֶךְ הַ/בָּשָׁן
  choice: बाशान के राजा
  rationale: सम्बन्धसूचक हिब्रू पदबंध का स्वाभाविक हिन्दी रूप है; बाशान स्थाननाम के रूप में लिप्यंतरित है।
- source_word: וּ/לְ/כֹל
  choice: और ... सभी ... को
  rationale: לְ को ‘को’ द्वारा व्यक्त करके पिछले दोनों पदों के साथ व्याकरणिक समानता बनाए रखी गई है।
- source_word: מַמְלְכֹת
  choice: राज्यों
  rationale: यह शब्द राजकीय भूभागों अथवा राज्यों को सूचित करता है; ऐतिहासिक-भौगोलिक संदर्भ में ‘राज्य’ सबसे स्पष्ट विकल्प है।
- source_word: כְּנָעַן
  choice: कनान
  rationale: स्थाननाम का प्रचलित हिन्दी बाइबलीय लिप्यंतरण।
