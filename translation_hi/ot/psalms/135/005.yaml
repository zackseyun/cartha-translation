base_translation:
  language: en
  yaml_path: translation/ot/psalms/135/005.yaml
  text: For I know that Yahweh is great[b][a], and our Lord is above all gods.
translation:
  language: hi
  text: क्योंकि मैं जानता हूँ कि याहवे महान है, और हमारा प्रभु[a] सब देवताओं से बढ़कर है[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘याहवे’ मूल पाठ में परमेश्वर का व्यक्तिगत नाम है; ‘हमारा प्रभु’ एक अलग हिब्रू शब्द है, जिसका अर्थ ‘हमारा स्वामी/प्रभु’ है।
    reason: lexical_alternative
  - marker: b
    text: या, ‘सब देवताओं के ऊपर है।’ हिब्रू में शाब्दिक रूप से ‘सब देवताओं से’ है, जो उनसे श्रेष्ठ होने का भाव देता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: पहला כִּי पिछले स्तुति-आह्वान का कारण प्रस्तुत करता है; इसलिए आधुनिक हिन्दी में ‘क्योंकि’ उसका व्याख्यात्मक बल स्वाभाविक रूप से व्यक्त करता है।
- source_word: יָדַעְתִּי
  choice: मैं जानता हूँ
  rationale: हिब्रू पूर्णकाल यहाँ स्थिर और सुनिश्चित ज्ञान बताता है; हिन्दी का वर्तमानकाल इस परिणामात्मक अर्थ को सहजता से व्यक्त करता है।
- source_word: כִּי
  choice: कि
  rationale: दूसरा כִּי उस बात का विषय प्रस्तुत करता है जिसे भजनकार जानता है।
- source_word: גָדוֹל
  choice: महान
  rationale: यह विशेषण यहोवा की महानता का सीधा कथन करता है; ‘महान’ अर्थ और गरिमा दोनों बनाए रखता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: यह परमेश्वर का व्यक्तिगत नाम है; देवनागरी में प्रचलित रूप ‘यहोवा’ इसे ‘प्रभु’ शीर्षक से अलग रखता है।
- source_word: אֲדֹנֵינוּ
  choice: हमारा प्रभु
  rationale: संज्ञा ‘स्वामी/प्रभु’ के साथ प्रथम पुरुष बहुवचन प्रत्यय है; ‘हमारा प्रभु’ सम्मानपूर्ण और स्वाभाविक हिन्दी है।
- source_word: מִכָּל
  choice: सब … से बढ़कर
  rationale: מִן यहाँ तुलना और श्रेष्ठता व्यक्त करता है; हिन्दी का ‘से बढ़कर’ इस हिब्रू मुहावरे का स्पष्ट और स्वाभाविक रूप है।
- source_word: אֱלֹהִים
  choice: देवताओं
  rationale: बहुवचन को सीधे रूप में रखा गया है, जिससे प्रतिद्वंद्वी देवताओं या दैवी सत्ताओं के विषय में पाठ की अपनी अभिव्यक्ति बनी रहती है।
theological_decisions:
- issue: יְהוָה और אֲדֹנֵינוּ के बीच भेद
  choice: ‘यहोवा’ और ‘हमारा प्रभु’
  alternative: दोनों को ‘प्रभु’ से अनूदित करना
  rationale: मूल पाठ पहले परमेश्वर के व्यक्तिगत नाम और फिर भिन्न शीर्षक ‘हमारा प्रभु’ का प्रयोग करता है; अनुवाद में यह भेद सुरक्षित रखा गया है।
- issue: अंतिम पदबंध में אֱלֹהִים का अर्थ
  choice: सब देवताओं
  alternative: सब दैवी प्राणियों
  rationale: ‘देवताओं’ मूल बहुवचन का सीधा अर्थ और भजन का श्रेष्ठता-संबंधी तनाव बनाए रखता है; अनुवाद यह तय नहीं करता कि इन देवताओं की सत्ता या प्रकृति क्या है।
- issue: מִכָּל द्वारा व्यक्त श्रेष्ठता
  choice: सब देवताओं से बढ़कर
  alternative: सब देवताओं के ऊपर
  rationale: दोनों सम्भव हैं, पर ‘से बढ़कर’ हिब्रू तुलनात्मक अर्थ को अधिक स्पष्ट करता है और पहले खंड के ‘महान’ कथन से सहज संबंध बनाता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘देवताओं’ को किसी व्याख्यात्मक विशेषण, जैसे ‘झूठे’, के बिना रखा गया है ताकि मूल पाठ की धार्मिक और काव्यात्मक तनावपूर्ण अभिव्यक्ति सुरक्षित रहे।
