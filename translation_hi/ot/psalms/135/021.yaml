source:
  edition: WLC
  text: בָּ֘ר֤וּךְ יְהוָ֨ה מִ/צִּיּ֗וֹן שֹׁ֘כֵ֤ן יְֽרוּשָׁלִָ֗ם הַֽלְלוּ יָֽהּ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/135/021.yaml
  text: Blessed be Yahweh from Zion[a], who dwells in Jerusalem. Hallelujah!
translation:
  language: hi
  text: 'सिय्योन से याहवे को धन्य कहा जाए,

    जो यरूशलेम में वास करता है।

    हल्लेलूयाह![a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इब्रानी: “याह की स्तुति करो!” यह अभिव्यक्ति परंपरागत रूप से “हल्लेलूयाह” के रूप में प्रयुक्त होती है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּרוּךְ
  choice: धन्य कहा जाए
  rationale: दॉक्सोलॉजिकल आशीर्वचन में प्रयुक्त निष्क्रिय कृदन्त का भाव व्यक्त करता है। केवल ‘धन्य है’ की अपेक्षा यह आराधनात्मक उद्घोष की शक्ति को अधिक स्पष्ट रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: चतुराक्षरीय व्यक्तिगत नाम का प्रचलित हिन्दी लिप्यंतरण; इसे किसी उपाधि से प्रतिस्थापित नहीं किया गया है।
- source_word: מִצִּיּוֹן
  choice: सिय्योन से
  rationale: מִן के सामान्य स्रोतवाचक अर्थ ‘से’ को बनाए रखता है और सिय्योन को उस स्थान के रूप में प्रस्तुत करता है जहाँ से यह स्तुति उठती है।
- source_word: שֹׁכֵן
  choice: जो ... वास करता है
  rationale: שכן के ‘निवास करना/वास करना’ अर्थ और वर्तमान कृदन्त के विशेषणात्मक संबंध को स्वाभाविक हिन्दी में व्यक्त करता है; ‘विराजमान’ जैसी अतिरिक्त राजकीय छवि नहीं जोड़ता।
- source_word: יְרוּשָׁלִָם
  choice: यरूशलेम
  rationale: स्थान-नाम का मानक हिन्दी रूप।
- source_word: הַלְלוּ יָהּ
  choice: हल्लेलूयाह
  rationale: इब्रानी आराधनात्मक पुकार का हिन्दी में स्थापित लिप्यंतरण है; इसके शाब्दिक अर्थ को पादटिप्पणी में स्पष्ट किया गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ व्यक्तिगत ईश्वरीय नाम का प्रयोग करता है। ‘याहवे’ उस नाम को उपाधि में बदले बिना निकटता से लिप्यंतरित करता है।
- issue: שֹׁכֵן में निवास की छवि
  choice: जो यरूशलेम में वास करता है
  alternative: जो यरूशलेम में विराजमान है
  rationale: ‘वास करता है’ मूल क्रिया के निवास-संबंधी अर्थ को सुरक्षित रखता है और राजसिंहासन की ऐसी धारणा नहीं जोड़ता जो इस शब्द में स्वयं स्पष्ट नहीं है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और आराधनात्मक रखी गई है। पंक्ति-विन्यास इब्रानी काव्य की लय और दो कथनों के संबंध को स्पष्ट करता है।
