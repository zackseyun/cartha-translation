  text: He sent signs and wonders into your midst[a], O Egypt[b], against Pharaoh and against all his servants.
translation:
  language: hi
  text: उसने तेरे बीच, हे मिस्र,[a] चिन्ह और अद्भुत काम भेजे—फ़िरौन और उसके सभी सेवकों के विरुद्ध।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसने तेरे बीच चिन्ह और अद्भुत काम भेजे, हे मिस्र।” इब्रानी में स्त्रीलिंग एकवचन प्रत्यय के द्वारा मिस्र को एक व्यक्ति के समान सीधे संबोधित किया गया है।
    reason: lexical_alternative
  - marker: b
    text: या, “फ़िरौन और उसके सभी सेवकों पर।” इब्रानी पूर्वसर्ग का अधिक शाब्दिक अनुवाद “पर” हो सकता है, पर यहाँ वह उन पर पड़े विपत्तियों के प्रतिकूल प्रभाव को दर्शाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁלַח
  choice: उसने ... भेजे
  rationale: यह क़ाल पूर्ण 3 पुल्लिंग एकवचन है; पिछले संदर्भ से परमेश्वर इसका निहित कर्ता है। हिंदी में ‘भेजे’ स्वाभाविक है और चिन्हों तथा अद्भुत कामों को मिस्र में भेजने की बिंबात्मक भाषा बनाए रखता है।
- source_word: אֹתוֹת
  choice: चिन्ह
  rationale: निर्गमन की विपत्तियों के संदर्भ में אות उन कार्यों को दर्शाता है जो परमेश्वर की सामर्थ्य और उद्देश्य के संकेत हैं; ‘चिन्ह’ स्पष्ट और प्रचलित समतुल्य है।
- source_word: מֹפְתִים
  choice: अद्भुत काम
  rationale: מופתים, אֹתוֹת के साथ युग्म में, विस्मयकारी दैवी कृत्यों को दर्शाता है। ‘अद्भुत काम’ आधुनिक हिंदी में सहज है और केवल सामान्य ‘आश्चर्य’ की अपेक्षा कृत्यों का भाव अधिक स्पष्ट करता है।
- source_word: בְּתוֹכֵכִי
  choice: तेरे बीच
  rationale: בְּ + תּוֹךְ तथा स्त्रीलिंग एकवचन द्वितीय पुरुष प्रत्यय का अर्थ ‘तेरे बीच/तेरे मध्य में’ है। यह मिस्र को मानवीकृत करके सीधे संबोधित किए जाने को सुरक्षित रखता है।
- source_word: מִצְרָיִם
  choice: हे मिस्र
  rationale: द्वितीय पुरुष स्त्रीलिंग प्रत्यय के बाद यह प्रत्यक्ष संबोधन है। ‘हे’ हिंदी में संबोधन को स्पष्ट और काव्यात्मक ढंग से व्यक्त करता है।
- source_word: בְּפַרְעֹה
  choice: फ़िरौन ... के विरुद्ध
  rationale: इस संदर्भ में בְּ चिन्हों और अद्भुत कामों के लक्ष्य तथा प्रतिकूल प्रभाव को सूचित करता है; ‘के विरुद्ध’ स्वाभाविक हिंदी है।
- source_word: וּבְכָל עֲבָדָיו
  choice: और उसके सभी सेवकों के विरुद्ध
  rationale: עֲבָדִים का अर्थ सेवक, दास या राजकीय अधिकारी हो सकता है। ‘सेवक’ व्यापक अर्थ बनाए रखता है और राजदरबार तक अनावश्यक रूप से सीमित नहीं करता।
