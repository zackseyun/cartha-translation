id: PSA.135.4
reference: Psalms 135:4
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: כִּֽי יַעֲקֹ֗ב בָּחַ֣ר ל֣/וֹ יָ֑הּ יִ֝שְׂרָאֵ֗ל לִ/סְגֻלָּתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/135/004.yaml
  text: For Yah has chosen Jacob for himself[a], Israel as his treasured possession.
translation:
  language: hi
  text: क्योंकि याह[a] ने याकूब को अपने लिए, इस्राएल को अपनी बहुमूल्य संपत्ति के रूप में चुन लिया है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में “याह,” परमेश्वर के नाम का संक्षिप्त रूप।
    reason: मूल पाठ में प्रयुक्त विशिष्ट संक्षिप्त दिव्य नाम की पहचान स्पष्ट करना।
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पद आसपास के स्तुतिगान का कारण बताता है; इसलिए कारणसूचक ‘क्योंकि’ स्वाभाविक और स्पष्ट है।
- source_word: בָּחַר
  choice: चुन लिया है
  rationale: क्रिया का अर्थ चुनना है। पूर्ण वर्तमान रूप बीते हुए चुनाव और उसके बने रहने वाले परिणाम—दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: לּוֹ
  choice: अपने लिए
  rationale: पूर्वसर्ग और सर्वनाम-प्रत्यय यहाँ विशेष संबंध और अपने अधिकार में होने का भाव देते हैं; ‘अपने लिए’ इस आत्मवाचक अर्थ को स्पष्ट रखता है।
- source_word: יָהּ
  choice: याह
  rationale: मूल पाठ में परमेश्वर के नाम का संक्षिप्त काव्यात्मक रूप יָהּ है; ‘याह’ उसी रूप को सीधे और सटीक ढंग से प्रस्तुत करता है।
- source_word: יַעֲקֹב
  choice: याकूब
  rationale: यह पितामह और उससे निकले समुदाय के नाम का प्रचलित हिन्दी रूप है।
- source_word: יִשְׂרָאֵל
  choice: इस्राएल
  rationale: यहाँ ‘इस्राएल’ समानांतर पंक्ति में ‘याकूब’ के ही लोगों को दर्शाता है; प्रचलित हिन्दी रूप रखा गया है।
- source_word: סְגֻלָּה
  choice: बहुमूल्य संपत्ति
  rationale: यह संज्ञा किसी स्वामी की विशेष रूप से मूल्यवान, निजी संपत्ति को दर्शाती है। ‘बहुमूल्य संपत्ति’ मूल्य और विशिष्ट संबंध—दोनों भावों को सहज आधुनिक हिन्दी में रखती है।
- source_word: לִסְגֻלָּתוֹ
  choice: अपनी बहुमूल्य संपत्ति के रूप में
  rationale: यह पदबंध इस्राएल को याह की विशेष संपत्ति के रूप में चुने जाने का संबंध व्यक्त करता है; हिन्दी में यह रचना स्वाभाविक है और इब्रानी समानांतरता को बनाए रखती है।
theological_decisions:
- issue: संक्षिप्त दिव्य नाम יָהּ का अनुवाद
  choice: याह
  alternative: प्रभु
  rationale: इस पद में पूर्ण चतुरक्षरी नाम नहीं, बल्कि उसका विशिष्ट संक्षिप्त काव्यात्मक रूप है। ‘याह’ मूल रूप को पारदर्शी ढंग से सुरक्षित रखता है; पाठकों की सहायता के लिए पादटिप्पणी दी गई है।
- issue: याकूब और इस्राएल का संबंध
  choice: दो समानांतर नामों के रूप में रखा गया
  alternative: दो अलग समूहों की तरह स्पष्ट करना
  rationale: काव्यात्मक समानांतरता में दोनों नाम एक ही वाचा-समुदाय को दर्शाते हैं। अनुवाद इस संबंध को सुरक्षित रखता है, पर मूल की पंक्तिगत संरचना को अनावश्यक व्याख्या से नहीं बदलता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘बहुमूल्य संपत्ति’ वाचा-संबंधी विशेष स्वामित्व और प्रिय मूल्य का भाव देती है, जबकि वाक्य की समानांतर काव्यात्मक रचना मूल के निकट रहती है।
