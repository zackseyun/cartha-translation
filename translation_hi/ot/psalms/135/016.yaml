  yaml_path: translation/ot/psalms/135/016.yaml
  text: They have mouths[a], but do not speak; they have eyes, but do not see.
translation:
  language: hi
  text: उनके मुँह हैं[a], पर वे बोलते नहीं; उनकी आँखें हैं, पर वे देखती नहीं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से, “मुँह उनके लिए है ... आँखें उनके लिए हैं”; यह स्वामित्वसूचक रचना है, जिसका अर्थ है, “उनके मुँह हैं ... उनकी आँखें हैं।”
    reason: lexical_alternative
lexical_decisions:
- source_word: פֶּה
  choice: मुँह
  rationale: इब्रानी संज्ञा एकवचन है, पर बहुवचन ‘उनके’ और बहुवचन क्रिया के साथ मूर्तियों में से प्रत्येक के लिए वितरणात्मक अर्थ रखती है; स्वाभाविक हिन्दी में ‘उनके मुँह हैं’ उपयुक्त है।
- source_word: לָהֶם
  choice: उनके ... हैं
  rationale: לָהֶם का शाब्दिक रूप ‘उनके लिए/उनको’ है, किंतु यहाँ यह स्वामित्वसूचक रचना है; हिन्दी में इसे ‘उनके ... हैं’ से स्वाभाविक रूप में व्यक्त किया गया है।
- source_word: יְדַבֵּרוּ
  choice: बोलते नहीं
  rationale: דבר का अर्थ ‘बोलना’ है। मूल पाठ साधारण निषेध करता है, स्पष्ट रूप से असमर्थता सूचक ‘बोल नहीं सकते’ नहीं कहता।
- source_word: עֵינַיִם
  choice: आँखें
  rationale: यह इब्रानी बहुवचन का सीधा और स्वाभाविक हिन्दी रूप है।
- source_word: יִרְאוּ
  choice: देखती नहीं
  rationale: ראה का सामान्य अर्थ ‘देखना’ है। स्त्रीलिंग बहुवचन क्रिया हिन्दी में निकटवर्ती कर्ता ‘आँखें’ के अनुरूप है और मूल का साधारण निषेध बनाए रखती है।
theological_decisions:
- issue: मूर्तियों का मानव-सदृश वर्णन
  choice: मुँह और आँखों के निष्क्रिय होने की ठोस छवि को बिना व्याख्यात्मक विस्तार के रखा गया है।
  alternative: ‘उनके मुँह हैं, पर वे बोल नहीं सकते; आँखें हैं, पर देख नहीं सकते।’
  rationale: पद मूर्तियों का उपहास उनके अंगों के काम न करने के द्वारा करता है। ‘नहीं’ मूल के साधारण निषेध को सुरक्षित रखता है और ‘नहीं सकते’ जोड़कर असमर्थता को स्पष्ट करने से बचता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और काव्यात्मक समानांतरता युक्त। ‘मुँह’ और ‘आँखें’ सामान्य पाठक के लिए सहज हैं; अर्धविराम दोनों समानांतर कथनों को स्पष्ट रूप से जोड़ता है।
