  yaml_path: translation/ot/psalms/135/014.yaml
  text: For Yahweh will vindicate his people[b][a], and he will have compassion on his servants.
translation:
  language: hi
  text: क्योंकि यहोवा अपनी प्रजा के पक्ष में न्याय करेगा[a], और अपने सेवकों पर दया करेगा[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “अपनी प्रजा का न्याय करेगा।” यहाँ इब्रानी क्रिया का अर्थ उनके पक्ष में न्याय करना, अर्थात उन्हें न्याय दिलाना भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या, “अपने सेवकों के विषय में अपना निर्णय बदलेगा।” इब्रानी क्रिया दया से द्रवित होने या उनके विषय में रुख बदलने का भाव भी व्यक्त कर सकती है।
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले कथन का आधार या कारण प्रस्तुत करता है; भजन के प्रवाह में ‘क्योंकि’ स्वाभाविक है।
- source_word: יָדִין
  choice: न्याय उनके पक्ष में करेगा
  rationale: דין का मूल अर्थ ‘न्याय करना’ है, पर यहाँ समानांतर व्यवस्थाविवरण 32:36 और अगले खंड की दया-संबंधी भाषा से अपने लोगों के पक्ष में न्याय करने का भाव प्रबल है। यह अनुवाद मूल न्यायिक शब्द और पक्ष-समर्थक अर्थ दोनों को रखता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिन्दी बाइबलीय प्रयोग में परमेश्वर के व्यक्तिगत नाम के रूप में प्रचलित और सहज रूप।
- source_word: עַמּוֹ
  choice: अपनी प्रजा
  rationale: वाचा-संबंधी सामूहिक समुदाय के लिए ‘प्रजा’ स्वाभाविक और गरिमापूर्ण हिन्दी है।
- source_word: עֲבָדָיו
  choice: अपने सेवकों
  rationale: यहाँ परमेश्वर के प्रति संबंध और सेवा प्रमुख है; ‘सेवक’ आधुनिक हिन्दी में उपयुक्त है और अनावश्यक रूप से दासत्व पर बल नहीं देता।
- source_word: יִתְנֶחָם
  choice: दया करेगा
  rationale: निफ़अल रूप यहाँ अपने सेवकों के विषय में द्रवित होने, तरस खाने या अपना दंडात्मक रुख रोकने का भाव दे सकता है। मुख्य पाठ में ‘दया करेगा’ प्रसंगानुकूल है, जबकि ‘तरस खाकर अपना निर्णय बदलेगा’ की संभावना पादटिप्पणी में सुरक्षित है।
theological_decisions:
- issue: יִתְנֶחָם में परमेश्वर के लिए मानवीय भाव अथवा रुख बदलने की भाषा
  choice: दया करेगा
  alternative: अपने सेवकों पर तरस खाकर अपना निर्णय बदलेगा / उनके विषय में पछताएगा
  rationale: मुख्य पाठ प्रसंग में परमेश्वर की करुणामय प्रतिक्रिया स्पष्ट करता है, पर पादटिप्पणी इब्रानी क्रिया के ‘तरस खाकर रुकने या निर्णय बदलने’ वाले तनाव को बनाए रखती है; इसे परमेश्वर द्वारा नैतिक गलती के लिए पश्चात्ताप करने के रूप में नहीं थोपा गया।
- issue: יָדִין का न्याय अथवा दोषमुक्ति संबंधी अर्थ
  choice: न्याय उनके पक्ष में करेगा
  alternative: अपनी प्रजा का न्याय करेगा / अपनी प्रजा को निर्दोष ठहराएगा
  rationale: यह रूप मूल क्रिया के न्यायिक अर्थ को बनाए रखते हुए संदर्भगत पक्ष-समर्थन व्यक्त करता है और केवल दंडात्मक न्याय का आभास नहीं देता।
translation_notes:
  register: आधुनिक मानक हिन्दी में स्वाभाविक, गरिमापूर्ण और सामान्य पाठकों के लिए स्पष्ट भाषा। ‘यहोवा’ हिन्दी की स्थापित बाइबलीय वर्तनी है। ‘न्याय उनके पक्ष में करेगा’ मूल न्यायिक शब्द और प्रसंगगत दोषमुक्ति—दोनों को संतुलित करता है।
