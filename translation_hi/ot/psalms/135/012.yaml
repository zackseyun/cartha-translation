lexical_decisions:
- source_word: וְנָתַן
  choice: और उसने दे दी
  rationale: क़ाल रूप स्तुति में पिछले कार्यों की क्रमिक चर्चा को आगे बढ़ाता है; संदर्भ से कर्ता परमेश्वर है, इसलिए हिन्दी में ‘उसने’ स्पष्ट किया गया है।
- source_word: אַרְצָם
  choice: उनकी भूमि
  rationale: यहाँ बहुवचन प्रत्यय पिछले संदर्भ में पराजित राजाओं और जातियों की ओर संकेत करता है; ‘भूमि’ אֶרֶץ का स्वाभाविक और संक्षिप्त अनुवाद है।
- source_word: נַחֲלָה … נַחֲלָה
  choice: विरासत में … विरासत में
  rationale: נַחֲלָה में उत्तराधिकार में मिले स्थायी भाग का भाव है। दोनों प्रयोगों को रखकर इब्रानी की काव्यात्मक पुनरुक्ति और बल सुरक्षित रखा गया है।
- source_word: לְיִשְׂרָאֵל
  choice: इस्राएल को
  rationale: לְ यहाँ प्राप्तकर्ता को चिह्नित करता है; ‘इस्राएल को’ इसका सीधा हिन्दी रूप है।
- source_word: עַמּוֹ
  choice: अपने लोगों
  rationale: עַם सामूहिक अर्थ में ‘लोग/प्रजा’ है। ‘अपने लोगों इस्राएल’ हिन्दी में इस्राएल को परमेश्वर के लोगों के रूप में स्वाभाविक ढंग से व्यक्त करता है।
theological_decisions:
- issue: נַחֲלָה की काव्यात्मक पुनरुक्ति
  choice: मुख्य पाठ में ‘विरासत में’ दोनों बार रखा गया है।
  alternative: सुगम हिन्दी के लिए इसे केवल एक बार कहना।
  rationale: दोहराव मूल इब्रानी में बल देता है और वाचा के अंतर्गत मिले भाग की गंभीरता को उभारता है; इसे हटाने से स्रोत की काव्यात्मक विशेषता खो जाती।
