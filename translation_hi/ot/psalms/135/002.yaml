  - marker: b
    text: यहाँ ‘याहवे का भवन’ और ‘हमारे परमेश्वर का भवन’ मंदिर तथा उससे जुड़े पवित्र परिसर को दर्शाते हैं।
    reason: cultural_note
lexical_decisions:
- source_word: שֶׁעֹמְדִים
  choice: जो ... खड़े रहते हो
  rationale: सम्बन्धवाचक अव्यय और कृदन्त पिछले पद में सम्बोधित सेवकों का वर्णन जारी रखते हैं। ‘खड़े रहते हो’ उनकी नियमित सेवा और कृदन्त के स्थायी भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: בְּבֵית
  choice: के भवन में
  rationale: בַּיִת का मूल अर्थ ‘घर/भवन’ है; यहाँ यह मन्दिर और उससे जुड़े पवित्र परिसर को सूचित करता है। ‘भवन’ इब्रानी रूपक को बनाए रखते हुए गरिमापूर्ण और स्पष्ट है।
- source_word: יְהוָה
  choice: याहवे
  rationale: व्यक्तिगत ईश्वरीय नाम יהוה को किसी उपाधि से बदलने के बजाय हिन्दी में लिप्यन्तरित किया गया है।
- source_word: בְּחַצְרוֹת
  choice: आँगनों में
  rationale: חָצֵר का बहुवचन मन्दिर-परिसर के आँगनों को दर्शाता है। ‘आँगन’ आधुनिक हिन्दी में सहज है और ‘courts/courtyards’ दोनों का आशय देता है।
- source_word: בֵּית אֱלֹהֵינוּ
  choice: हमारे परमेश्वर के भवन
  rationale: यह अनुवाद मूल की पुनरुक्ति, काव्यात्मक समान्तरता और सामुदायिक सम्बन्धसूचक ‘हमारे’ को सुरक्षित रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: याहवे
  alternative: प्रभु
  rationale: मूल पाठ में उपाधि नहीं, चार अक्षरों वाला व्यक्तिगत नाम है; इसलिए नाम को लिप्यन्तरित करके उसका भेद बनाए रखा गया है।
- issue: ‘भवन’ का आशय
  choice: मूल रूपक ‘भवन’ को पाठ में रखकर पाद-टिप्पणी में मन्दिर-सन्दर्भ स्पष्ट करना
  alternative: पाठ में सीधे ‘मन्दिर’
  rationale: इससे इब्रानी की शब्दावली और दोनों अर्ध-पंक्तियों की पुनरुक्ति बनी रहती है, जबकि पाठक को सांस्कृतिक अर्थ भी मिल जाता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और उपासना-सन्दर्भ के अनुकूल रखी गई है। ‘खड़े रहते हो’ पिछले पद से जारी प्रत्यक्ष सम्बोधन को स्वाभाविक हिन्दी में बनाए रखता है; ‘भवन’ और ‘आँगन’ सामान्य पाठक के लिए बोधगम्य हैं।
