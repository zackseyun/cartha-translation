  text: जो याहवे के भवन[b] में और हमारे परमेश्वर के भवन के आँगनों[a] में खड़े रहते हो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘प्रांगणों’।
