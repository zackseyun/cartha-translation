  yaml_path: translation/ot/psalms/135/015.yaml
  text: The idols of the nations are silver and gold[b][a], the work of human hands.
translation:
  language: hi
  text: 'जातियों की मूर्तियाँ चाँदी और सोना हैं,

    वे मनुष्य के हाथों की बनाई हुई हैं।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עֲצַבֵּי
  choice: मूर्तियाँ
  rationale: यह शब्द इस उपासना-विरोधी संदर्भ में तटस्थ प्रतिमाओं के बजाय पूजा के लिए बनाई गई मूर्तियों को सूचित करता है।
- source_word: הַגּוֹיִם
  choice: जातियों की
  rationale: भजन-साहित्य में यह पद सामान्यतः इस्राएल से बाहर की जातियों अथवा राष्ट्रों को दर्शाता है; यहाँ ‘जातियों’ स्वाभाविक और संक्षिप्त है।
- source_word: כֶּסֶף וְזָהָב
  choice: चाँदी और सोना
  rationale: मूल में मूर्तियों की सामग्री का सीधा वर्णन है, जिसे यथावत रखा गया है।
- source_word: מַעֲשֵׂה יְדֵי אָדָם
  choice: मनुष्य के हाथों की बनाई हुई
  rationale: यह स्वाभाविक हिन्दी में मूल के ‘मनुष्य के हाथों का काम’ का अर्थ रखता है और मूर्तियों के मानव-निर्मित होने पर बल देता है।
theological_decisions:
- issue: אָדָם का सामान्य मानव-सूचक अर्थ
  choice: मनुष्य
  alternative: आदमी
  rationale: यहाँ शब्द किसी विशेष पुरुष को नहीं, मानव जाति को सामान्य रूप से दर्शाता है। ‘मनुष्य के हाथों’ इस सामान्य अर्थ और परमेश्वर के विपरीत मानव-निर्माण के भाव को स्पष्ट रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और काव्यात्मक दो-पंक्ति विन्यास। ‘मूर्तियाँ’ धार्मिक और विवादात्मक संदर्भ को स्वाभाविक रूप से व्यक्त करता है; अनावश्यक पादटिप्पणी नहीं जोड़ी गई।
