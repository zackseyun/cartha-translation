translation:
  language: hi
  text: जिसने बहुत-से राष्ट्रों को मारा और शक्तिशाली राजाओं को मार डाला।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שֶׁ/הִכָּה
  choice: जिसने ... मारा
  rationale: שֶׁ सापेक्ष उपवाक्य बनाता है और पिछले पद में आए यहोवा के वर्णन को आगे बढ़ाता है। נכה का सीधा अर्थ ‘मारना/प्रहार करना’ है; यहाँ सैन्य संदर्भ में ‘मारा’ स्वाभाविक है और परिणाम को अनावश्यक रूप से अधिक निश्चित नहीं करता।
- source_word: גּוֹיִם רַבִּים
  choice: बहुत-से राष्ट्रों
  rationale: גּוֹיִם का इस ऐतिहासिक-सैन्य प्रसंग में स्वाभाविक अर्थ ‘राष्ट्र’ है और רַבִּים संख्या की अधिकता बताता है। ‘अन्यजातियों’ से बाद की धार्मिक अर्थछाया अनावश्यक रूप से जुड़ सकती है।
- source_word: וְ/הָרַג
  choice: और ... घात किया
  rationale: הרג स्पष्टतः जान से मारने को व्यक्त करता है। ‘घात किया’ काव्यात्मक गरिमा बनाए रखते हुए पहले खंड के ‘मारा’ से अर्थगत भेद भी स्पष्ट करता है।
- source_word: מְלָכִים עֲצוּמִים
  choice: शक्तिशाली राजाओं
  rationale: מְלָכִים का सीधा अर्थ ‘राजा’ है; עֲצוּמִים उनकी सामर्थ्य या बल को बताता है, जिसके लिए आधुनिक हिन्दी में ‘शक्तिशाली’ स्पष्ट और स्वाभाविक है।
theological_decisions:
- issue: पिछले पद के साथ सापेक्ष-उपवाक्य की निरंतरता
  choice: पद को ‘जिसने’ से आरम्भ होने वाले आश्रित उपवाक्य के रूप में रखा गया।
  alternative: ‘उसने बहुत-से राष्ट्रों को मारा...’ के रूप में स्वतंत्र वाक्य।
  rationale: הִכָּה से पहले लगा שֶׁ पिछले पद के कर्ता से स्पष्ट व्याकरणिक संबंध बनाता है। इसे बनाए रखने से भजन की क्रमिक स्तुति-संरचना सुरक्षित रहती है।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। ‘मारा’ और ‘घात किया’ हिब्रू समानांतरता में נכה तथा הרג के भेद को स्वाभाविक हिन्दी में बनाए रखते हैं।
