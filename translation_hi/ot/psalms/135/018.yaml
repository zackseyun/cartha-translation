  text: Those who make them will become like them[a], everyone who trusts in them.
translation:
  language: hi
  text: जो उन्हें बनाते हैं, वे उनके समान हो जाएँगे[a]—और वे सभी भी जो उन पर भरोसा रखते हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उनके समान होंगे।” इब्रानी क्रिया का अनुवाद “होंगे” या “हो जाएँगे” दोनों प्रकार से किया जा सकता है; मुख्य पाठ में परिणामसूचक अर्थ रखा गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּמוֹ/הֶם
  choice: उन्हीं के समान
  rationale: तुलनात्मक अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है और निकटवर्ती मूर्तियों की ओर संकेत बनाए रखता है।
- source_word: יִהְי֣וּ
  choice: हो जाएँगे
  rationale: היה का परिणामसूचक अर्थ यहाँ उपयुक्त है; यह मूर्ति बनाने वालों और उन पर भरोसा रखने वालों के उनके समान हो जाने की चेतावनी व्यक्त करता है।
- source_word: עֹשֵׂי/הֶם
  choice: जो उन्हें बनाते हैं
  rationale: कर्तृवाचक कृदन्त और उसके बहुवचन कर्म-सर्वनाम को स्पष्ट, सहज आधुनिक हिन्दी में रखता है।
- source_word: כֹּל אֲשֶׁר
  choice: वे सभी भी, जो
  rationale: इस पदबंध के सार्वभौमिक विस्तार को बनाए रखता है और बताता है कि अगला वर्ग भी उसी कथन में सम्मिलित है।
- source_word: בֹּטֵחַ בָּ/הֶם
  choice: उन पर भरोसा रखते हैं
  rationale: בטח के विश्वास अथवा निर्भरता के अर्थ को हिन्दी के स्वाभाविक प्रयोग 'पर भरोसा रखना' से व्यक्त करता है।
theological_decisions:
- issue: मूर्तियों के 'समान' हो जाने का आशय
  choice: पद केवल समान हो जाने की बात कहता है; समानता का ठीक स्वरूप अनिर्दिष्ट रखा गया है।
  alternative: इसे विशेष रूप से आत्मिक संवेदनहीनता, निर्बलता या निर्जीवता के रूप में स्पष्ट करना।
  rationale: इब्रानी पाठ समानता की पुष्टि करता है, पर उसकी प्रकृति नहीं बताता; इसलिए अनुवाद चेतावनी को सुरक्षित रखता है और उसकी व्याख्या नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट शैली। समन्वय को स्पष्ट करने के लिए दूसरे खंड में “और…भी” रखा गया है; मूल पाठ में निहित मूर्तिपूजा-विरोधी चेतावनी को बिना अतिरिक्त व्याख्या के सुरक्षित रखा गया है।
