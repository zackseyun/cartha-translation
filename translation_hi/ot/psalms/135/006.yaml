source:
  edition: WLC
  text: כֹּ֤ל אֲשֶׁר חָפֵ֥ץ יְהוָ֗ה עָ֫שָׂ֥ה בַּ/שָּׁמַ֥יִם וּ/בָ/אָ֑רֶץ בַּ֝/יַּמִּ֗ים וְ/כָל תְּהוֹמֽוֹת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/135/006.yaml
  text: Yahweh does whatever he pleases[a], in heaven and on earth[c][b], in the seas and all the depths.
translation:
  language: hi
  text: याहवे जो कुछ चाहता है, वही करता है—स्वर्ग में और पृथ्वी पर, समुद्रों में और सभी अथाह गहराइयों में।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כֹּל אֲשֶׁר
  choice: जो कुछ
  rationale: यह स्वाभाविक आधुनिक हिन्दी में समग्रता व्यक्त करता है और इब्रानी पदबंध के व्यापक अर्थ को बनाए रखता है।
- source_word: חָפֵץ
  choice: चाहता है
  rationale: यह क्रिया चाहने, प्रसन्न होने या इच्छा रखने का अर्थ दे सकती है। यहाँ ‘चाहता है’ सरल और स्वाभाविक है तथा परमेश्वर की इच्छा और उसके कार्य के संबंध को बिना अतिरिक्त व्याख्या के व्यक्त करता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय हिन्दी लिप्यंतरण में रखा गया है।
- source_word: עָשָׂה
  choice: करता है
  rationale: यद्यपि इब्रानी रूप पूर्ण क्रिया है, इस स्तुति-वाक्य में यह सामान्य और स्थायी सत्य व्यक्त करता है; इसलिए हिन्दी का सामान्य वर्तमान काल उपयुक्त है।
- source_word: בַּשָּׁמַיִם
  choice: स्वर्ग में
  rationale: इब्रानी शब्द रूपतः बहुवचन है, पर ‘स्वर्ग में और पृथ्वी पर’ आधुनिक हिन्दी में स्वाभाविक समष्टिगत युग्म है।
- source_word: וּבָאָרֶץ
  choice: और पृथ्वी पर
  rationale: ‘स्वर्ग में और पृथ्वी पर’ हिन्दी का स्वाभाविक प्रयोग है और सम्पूर्ण सृष्टि के विस्तार को व्यक्त करता है।
- source_word: בַּיַּמִּים
  choice: समुद्रों में
  rationale: मूल के बहुवचन को बनाए रखता है और संसार के जल-क्षेत्रों को व्यापक रूप से दर्शाता है।
- source_word: וְכָל תְּהוֹמוֹת
  choice: और सभी अथाह गहराइयों में
  rationale: תְּהוֹמוֹת गहरे जल, जलमय गहराइयों अथवा अगाध स्थानों का संकेत करता है। ‘अथाह गहराइयाँ’ काव्यात्मक और बोधगम्य है तथा अर्थ को केवल समुद्री तल तक सीमित नहीं करता।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा अथवा ‘यहोवा प्रभु’ जैसी पारंपरिक अभिव्यक्ति
  rationale: मूल पाठ में व्यक्तिगत नाम सीधे आया है; उसका लिप्यंतरण नाम और उपाधि के बीच का भेद सुरक्षित रखता है।
- issue: עָשָׂה का काल-पक्ष
  choice: सामान्य वर्तमान—‘करता है’
  alternative: पूर्ण/भूतकाल—‘उसने किया है’
  rationale: संदर्भ परमेश्वर की सार्वभौम क्रियाशीलता के सामान्य सत्य को कहता है। वर्तमान काल इस सूक्तिपरक बल को स्वाभाविक हिन्दी में व्यक्त करता है, जबकि मूल के पूर्ण क्रियारूप की संभावित भूतकालीन समझ को स्वीकार किया जाता है।
- issue: חָפֵץ में इच्छा और प्रसन्नता का संबंध
  choice: ‘जो कुछ चाहता है’
  alternative: ‘जिससे वह प्रसन्न होता है’ अथवा ‘जो कुछ उसे भाता है’
  rationale: ‘चाहता है’ मूल के इच्छार्थ को स्पष्ट रखता है और यह अतिरिक्त दावा नहीं करता कि हर कार्य में भावात्मक आनंद ही मुख्य आशय है।
translation_notes:
  register: भाषा आधुनिक, सरल और गरिमापूर्ण रखी गई है। पंक्ति की काव्यात्मक व्यापकता को बनाए रखने के लिए ‘स्वर्ग…पृथ्वी…समुद्रों…अथाह गहराइयों’ का क्रम सुरक्षित रखा गया है। किसी पाद-टिप्पणी की आवश्यकता नहीं समझी गई, क्योंकि मुख्य पाठ में अर्थ स्वाभाविक रूप से स्पष्ट है।
