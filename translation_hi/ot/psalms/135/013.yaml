base_translation:
  language: en
  yaml_path: translation/ot/psalms/135/013.yaml
  text: Yahweh, your name endures forever; Yahweh, your renown[a] endures from generation to generation.
translation:
  language: hi
  text: 'याहवे, आपका नाम सदा बना रहता है;

    याहवे, आपकी कीर्ति[a] पीढ़ी-दर-पीढ़ी बनी रहती है।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘आपका स्मरण’ अथवा ‘आपका स्मारक।’
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत वाचा-नाम को पद में दो बार सीधे संबोधन के रूप में रखा गया है।
- source_word: שִׁמְךָ
  choice: आपका नाम
  rationale: ‘नाम’ मूल शब्द की व्यापकता बनाए रखता है, जिसमें व्यक्तिगत नाम और उससे जुड़ी प्रतिष्ठा दोनों निहित हो सकती हैं।
- source_word: לְעוֹלָם
  choice: सदा बना रहता है
  rationale: इब्रानी उपवाक्य क्रियारहित है; यह स्वाभाविक हिंदी में निरंतर अस्तित्व का भाव स्पष्ट करता है।
- source_word: זִכְרְךָ
  choice: आपकी कीर्ति
  rationale: ‘नाम’ के समानांतर और पीढ़ियों तक बने रहने के संदर्भ में यह याहवे की चिरस्थायी स्मृति और प्रतिष्ठा का भाव व्यक्त करता है; शाब्दिक विकल्प पादटिप्पणी में सुरक्षित हैं।
- source_word: לְדֹר וָדֹר
  choice: पीढ़ी-दर-पीढ़ी बनी रहती है
  rationale: यह पीढ़ियों के लगातार क्रम को स्वाभाविक हिंदी में व्यक्त करता और दोनों पंक्तियों की काव्यात्मक समानांतरता बनाए रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में चार अक्षरों वाला व्यक्तिगत ईश्वरीय नाम सीधे आया है; उसका लिप्यंतरण वाचा-नाम को सामान्य उपाधि में बदलने से बचाता है।
- issue: זִכְרְךָ के अर्थ की सीमा
  choice: आपकी कीर्ति
  alternative: आपका स्मरण; आपका स्मारक नाम
  rationale: संदर्भ में याद रखी जाने वाली प्रतिष्ठा प्रमुख है, पर मूल शब्द ‘स्मरण’ अथवा ‘स्मारक’ का भाव भी रख सकता है; इस अस्पष्टता को पादटिप्पणी में खुला रखा गया है।
translation_notes:
  register: आधुनिक मानक हिंदी में सरल, गरिमापूर्ण और काव्यात्मक भाषा रखी गई है। आदरसूचक ‘आपका/आपकी’ सीधे ईश्वरीय संबोधन को स्वाभाविक बनाता है; दोनों क्रियारहित इब्रानी पंक्तियों में ‘बना रहता है/बनी रहती है’ जोड़कर निहित निरंतरता और समानांतरता व्यक्त की गई है।
