  yaml_path: translation/ot/psalms/135/001.yaml
  text: Praise Yah! Praise the name of Yahweh[a]; praise, O servants of Yahweh[b],
translation:
  language: hi
  text: 'याह की स्तुति करो![a]

    याहवे के नाम की स्तुति करो;

    हे याहवे के सेवको, स्तुति करो।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में ‘हल्लेलू-याह’, जिसका शाब्दिक अर्थ है, ‘याह की स्तुति करो।’
    reason: lexical_alternative
lexical_decisions:
- source_word: הַלְלוּ
  choice: स्तुति करो
  rationale: पिएल बहुवचन आज्ञार्थक का सीधा और स्वाभाविक हिन्दी रूप; पद में इसकी तीन बार की पुनरावृत्ति सुरक्षित रखी गई है।
- source_word: יָהּ
  choice: याह
  rationale: यह परमेश्वर के नाम का संक्षिप्त काव्यात्मक रूप है; इसे पूर्ण रूप יְהוָה से अलग रखते हुए लिप्यंतरित किया गया है।
- source_word: אֶת שֵׁם יְהוָה
  choice: याहवे के नाम की
  rationale: रचना में 'नाम' स्तुति का प्रत्यक्ष कर्म है; हिन्दी में संबंधकारक पदबंध स्वाभाविक ढंग से यही अर्थ देता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: चार अक्षरों वाले इब्रानी व्यक्तिगत नाम को उपाधि से बदलने के बजाय आधुनिक हिन्दी में प्रचलित निकट लिप्यंतरण से प्रस्तुत किया गया है।
- source_word: עַבְדֵי
  choice: सेवको
  rationale: यहाँ उपासना-संबंधी सम्मानसूचक संबोधन है; 'सेवक' प्रसंगानुकूल है और 'दास' की अपेक्षा साधारण आधुनिक पाठक के लिए अधिक स्वाभाविक है।
theological_decisions:
- issue: एक ही पद में יָהּ और יְהוָה का निरूपण
  choice: יָהּ को 'याह' और יְהוָה को 'याहवे'
  alternative: दोनों को 'प्रभु' कहना, अथवा दोनों को एक ही नामरूप से प्रस्तुत करना
  rationale: मूल पाठ जानबूझकर संक्षिप्त और पूर्ण नामरूपों का प्रयोग करता है। अलग रूप रखने से पाठ की शब्दावली तथा 'हालेलू-याह' की संरचना दिखाई देती है, बिना किसी संप्रदायगत व्याख्या को जोड़े।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमामय और उपासना-संगत रूप। काव्यात्मक आवर्तन को तीनों आज्ञार्थकों में बनाए रखा गया है; अंतिम खंड में मूल में अनुपस्थित किसी कर्म-सर्वनाम को नहीं जोड़ा गया।
