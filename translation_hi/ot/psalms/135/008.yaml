  text: who struck down the firstborn of Egypt[b][a], from man to beast.
translation:
  language: hi
  text: जिसने मिस्र के पहिलौठों को मार डाला[a]—मनुष्य से लेकर पशु तक।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘मारा।’ संदर्भ में प्रहार घातक है; ‘मार डाला’ इस अर्थ को स्पष्ट करता है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में शाब्दिक रूप से ‘मनुष्य से पशु तक’; यह मनुष्यों और पशुओं, दोनों को समेटने वाली अभिव्यक्ति है।
    reason: cultural_note
lexical_decisions:
- source_word: שֶׁ/הִכָּה
  choice: जिसने ... मार डाला
  rationale: सम्बन्धवाचक कण के साथ נכה का हिफ़ील पूर्ण रूप पिछले वर्णन को आगे बढ़ाता है। निर्गमन की घटना के संदर्भ में क्रिया का अर्थ प्राणघातक है, इसलिए केवल ‘मारा’ के बजाय ‘मार डाला’ स्वाभाविक और स्पष्ट है।
- source_word: בְּכוֹרֵי מִצְרָיִם
  choice: मिस्र के पहिलौठों
  rationale: בְּכוֹרֵי रचना-रूप बहुवचन है और पहिलौठे होने की स्थिति रखने वालों को सामूहिक रूप से बताता है; ‘मिस्र के पहिलौठों’ मूल की संबंध-रचना को संक्षिप्त और स्वाभाविक हिन्दी में रखता है।
- source_word: מֵ/אָדָם עַד בְּהֵמָה
  choice: मनुष्य से लेकर पशु तक
  rationale: מִן...עַד की सीमा-सूचक रचना को ‘से लेकर ... तक’ से व्यक्त किया गया है। यहाँ אָדָם मनुष्यों की श्रेणी को पशुओं की श्रेणी के सामने रखता है और בְּהֵמָה सामान्यतः पशु को दर्शाता है।
