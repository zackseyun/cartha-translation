  text: אָזְנַ֣יִם לָ֭/הֶם וְ/לֹ֣א יַאֲזִ֑ינוּ אַ֝֗ף אֵין יֶשׁ ר֥וּחַ בְּ/פִי/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/135/017.yaml
  text: They have ears[a], but they do not hear; indeed, there is no breath in their mouths.
translation:
  language: hi
  text: उनके कान तो हैं, पर वे सुनते नहीं; यहाँ तक कि उनके मुँह में साँस[a] भी नहीं है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “आत्मा।” इब्रानी शब्द רוּחַ का अर्थ “साँस,” “आत्मा” या “वायु” हो सकता है; यहाँ निर्जीव मूर्तियों और “उनके मुँह में” के संदर्भ में “साँस” अधिक उपयुक्त है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אָזְנַיִם לָהֶם
  choice: उनके कान तो हैं
  rationale: इब्रानी का संबंधसूचक अव्ययीभाव वाक्य स्वामित्व बताता है। हिंदी में ‘उनके कान ... हैं’ स्वाभाविक है, और ‘तो’ आगे आने वाले विरोध को स्पष्ट करता है।
- source_word: וְלֹא יַאֲזִינוּ
  choice: पर वे सुनते नहीं
  rationale: यद्यपि וְ मूलतः संयोजक है, यहाँ कान होने और न सुनने के बीच विरोध है। יַאֲזִינוּ ध्यान देकर सुनने का भाव रखता है; संदर्भ में सामान्य और सहज ‘सुनते’ उपयुक्त है।
- source_word: אַף
  choice: यहाँ तक कि ... भी
  rationale: 'यह अव्यय कथन को चरम बिंदु तक ले जाकर बल देता है: मूर्तियाँ केवल सुन नहीं सकतीं, उनके भीतर जीवन की साँस भी नहीं है।'
- source_word: אֵין יֶשׁ
  choice: नहीं है
  rationale: यह संयुक्त अभिव्यक्ति अस्तित्व का निषेध करती है; हिंदी में ‘नहीं है’ स्वाभाविक समतुल्य है।
- source_word: רוּחַ
  choice: साँस
  rationale: शब्द का अर्थ ‘आत्मा’, ‘वायु’ या ‘साँस’ हो सकता है। निर्जीव मूर्तियों और ‘मुँह में’ के निकट संदर्भ में ‘साँस’ ठोस शारीरिक अर्थ को सबसे अच्छी तरह व्यक्त करता है।
- source_word: בְּפִיהֶם
  choice: उनके मुँह में
  rationale: बहुवचन स्वामित्वसूचक रूप का सीधा हिंदी रूप; हिंदी में प्रत्येक की देह-संरचना के लिए सामूहिक ‘उनके मुँह में’ स्वाभाविक है।
theological_decisions:
- issue: मूर्ति-विरोधी संदर्भ में רוּחַ का अर्थ
  choice: साँस
  alternative: आत्मा
  rationale: पद इंद्रियों के निष्क्रिय होने का वर्णन करते हुए अंत में जीवनदायी साँस के अभाव तक पहुँचता है। ‘साँस’ मूर्तियों के निर्जीव होने की ठोस बात बनाए रखता है, जबकि पादटिप्पणी ‘आत्मा’ की वास्तविक शाब्दिक संभावना को सुरक्षित रखती है।
translation_notes:
  register: आधुनिक मानक हिंदी में सहज, गरिमापूर्ण और मौखिक पठन के अनुकूल शैली। ‘तो ... पर’ से इब्रानी विरोध उभरता है, और ‘यहाँ तक कि ... भी’ אַף की तीव्रता व्यक्त करता है।
