source:
  edition: WLC
  text: הַֽ֭לְלוּ יָהּ כִּי ט֣וֹב יְהוָ֑ה זַמְּר֥וּ לִ֝/שְׁמ֗/וֹ כִּ֣י נָעִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/135/003.yaml
  text: Praise Yah[a], for Yahweh is good; sing praises to his name[b], for it is pleasant.
translation:
  language: hi
  text: 'याह[a] की स्तुति करो, क्योंकि याहवे भला है;

    उसके नाम का भजन गाओ, क्योंकि यह मनभावना है।[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: हिब्रू ‘याह’, परमेश्वर के नाम का संक्षिप्त रूप; यह आगे आए ‘याहवे’ से अलग रूप है।
    reason: lexical_alternative
  - marker: b
    text: 'इसका अनुवाद यह भी हो सकता है: ‘क्योंकि वह मनभावना है,’ यदि अंतिम विशेषण को याहवे के लिए समझा जाए, न कि उसके नाम के भजन या स्तुति के लिए।'
    reason: alternative_reading
lexical_decisions:
- source_word: הַֽלְלוּ
  choice: स्तुति करो
  rationale: बहुवचन आज्ञार्थक क्रिया है और सामूहिक उपासना के सीधे आह्वान को स्वाभाविक आधुनिक हिन्दी में व्यक्त करती है।
- source_word: יָהּ
  choice: याह
  rationale: यह परमेश्वर के नाम का संक्षिप्त हिब्रू रूप है; इसे ‘याह’ रखने से अगले पदांश के יְהוָה से इसका भेद बना रहता है।
- source_word: כִּי טוֹב יְהוָה
  choice: क्योंकि याहवे भला है
  rationale: כִּי कारण बताता है, טוֹב व्यापक नैतिक और कृपालु भलाई व्यक्त करता है, और יְהוָה को उपाधि से बदलने के बजाय व्यक्तिगत नाम के रूप में लिप्यंतरित किया गया है।
- source_word: זַמְּרוּ
  choice: भजन गाओ
  rationale: क्रिया संगीतमय स्तुति का बोध कराती है; ‘भजन गाओ’ हिन्दी उपासना-भाषा में सहज और अर्थपूर्ण है।
- source_word: לִשְׁמוֹ
  choice: उसके नाम का
  rationale: हिब्रू में स्तुति परमेश्वर के नाम की ओर निर्देशित है; हिन्दी में ‘उसके नाम का भजन गाओ’ इसी भाव को स्वाभाविक रूप से व्यक्त करता है।
- source_word: נָעִים
  choice: मनभावना
  rationale: शब्द का अर्थ सुखद, मधुर या मनोहर है। ‘मनभावना’ काव्यात्मक गरिमा रखते हुए सामान्य पाठक के लिए बोधगम्य है।
theological_decisions:
- issue: יָהּ और יְהוָה—दो दिव्य-नाम रूपों का अनुवाद
  choice: क्रमशः ‘याह’ और ‘याहवे’
  alternative: दोनों को ‘प्रभु’ कहना, अथवा יְהוָה को ‘यहोवा’ लिखना
  rationale: मूल पाठ जानबूझकर संक्षिप्त रूप יָהּ और पूर्ण नाम יְהוָה दोनों रखता है। अलग-अलग लिप्यंतरण उस भेद और व्यक्तिगत नाम के स्वरूप को सुरक्षित रखते हैं।
- issue: अंतिम נָעִים का संदर्भ
  choice: मुख्य पाठ में ‘यह मनभावना है’—निकटवर्ती गायन/भजन को संदर्भित करने वाला खुला कथन
  alternative: ‘क्योंकि वह मनभावना है’—विशेषण को याहवे के लिए समझना
  rationale: हिब्रू में विशेषण के स्पष्ट व्याकरणिक कर्ता का अभाव है। मुख्य पाठ निकटतम स्तुति-क्रिया से स्वाभाविक संबंध रखता है, जबकि पादटिप्पणी परमेश्वर स्वयं को संदर्भ मानने की वास्तविक संभावना सुरक्षित रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, काव्यात्मक और उपासना-योग्य शैली रखी गई है। ‘स्तुति करो’ और ‘भजन गाओ’ सामान्य धार्मिक शब्दावली हैं; दिव्य नामों को मूल के भेद के अनुसार लिप्यंतरित किया गया है।
