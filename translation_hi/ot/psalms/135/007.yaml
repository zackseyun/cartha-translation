id: PSA.135.7
reference: Psalms 135:7
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: מַֽעֲלֶ֣ה נְשִׂאִים֮ מִ/קְצֵ֪ה הָ֫/אָ֥רֶץ בְּרָקִ֣ים לַ/מָּטָ֣ר עָשָׂ֑ה מֽוֹצֵא ר֝וּחַ מֵ/אֽוֹצְרוֹתָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/135/007.yaml
  text: He makes clouds rise from the ends of the earth[a]; he makes lightning for the rain[c][b]; he brings out the wind from his storehouses.
translation:
  language: hi
  text: 'वह पृथ्वी के छोरों[b] से बादल[a] उठाता है;

    वह वर्षा के लिए बिजली उत्पन्न करता है;

    वह अपने भंडारों[c] से पवन निकालता है।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “वाष्प।” इब्रानी शब्द उठती हुई धुंध या वाष्प का बोध भी करा सकता है, पर इस तूफ़ानी प्रसंग में “बादल” अधिक उपयुक्त है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से “पृथ्वी के छोर से।” इब्रानी का एकवचन रूप यहाँ पृथ्वी की दूर-दूर की सीमाओं को सामूहिक रूप से व्यक्त कर सकता है।
    reason: lexical_alternative
  - marker: c
    text: या “अपने खज़ानों से।” चित्र यह है कि परमेश्वर पवनों को संचित रखता और अपनी इच्छा से बाहर निकालता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: מַעֲלֶה
  choice: उठाता है
  rationale: हिफ़ील कृदन्त का कारणवाचक भाव है—वह बादलों को ऊपर उठाता है। ‘उठाता है’ आधुनिक हिन्दी में स्वाभाविक और संक्षिप्त है।
- source_word: נְשִׂאִים
  choice: बादल
  rationale: शब्द धुंध या वाष्प को भी सूचित कर सकता है, पर वर्षा, बिजली और पवन के इस मौसमी प्रसंग में ‘बादल’ सबसे स्पष्ट अर्थ देता है।
- source_word: מִקְצֵה הָאָרֶץ
  choice: पृथ्वी के छोरों से
  rationale: इब्रानी में ‘छोर’ एकवचन रूप में है, पर मुहावरे का सामूहिक आशय पृथ्वी की दूर-दूर की सीमाएँ हैं; इसलिए हिन्दी बहुवचन स्वाभाविक है।
- source_word: בְּרָקִים
  choice: बिजली
  rationale: इब्रानी बहुवचन को हिन्दी में अगणनीय/सामूहिक ‘बिजली’ से सहज रूप में व्यक्त किया गया है।
- source_word: לַמָּטָר
  choice: वर्षा के लिए
  rationale: ל उपसर्ग के संबंध अथवा प्रयोजन के भाव को निकटता से बनाए रखता है, बिना उसे केवल ‘वर्षा के साथ’ मानकर निश्चित किए।
- source_word: עָשָׂה
  choice: उत्पन्न करता है
  rationale: यद्यपि क्रिया पूर्ण रूप में है, स्तुतिगीत के इस प्रसंग में यह परमेश्वर के सामान्य और निरंतर कार्य का वर्णन करती है। ‘उत्पन्न करता है’ बिजली के संबंध में स्वाभाविक है।
- source_word: מוֹצֵא
  choice: निकालता है
  rationale: हिफ़ील कृदन्त का कारणवाचक अर्थ और भंडार से पवन बाहर लाने का चित्र दोनों सुरक्षित रहते हैं।
- source_word: רוּחַ
  choice: पवन
  rationale: बादल, वर्षा और बिजली के मौसमी क्रम में अर्थ स्पष्टतः ‘पवन’ है, न कि ‘आत्मा’ या ‘श्वास’।
- source_word: מֵאֹצְרוֹתָיו
  choice: अपने भंडारों से
  rationale: यह चुनाव पवन को संचित करके इच्छानुसार बाहर निकालने के ठोस काव्यात्मक चित्र को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: परमेश्वर के कार्य का काल—अतीत या सामान्य वर्तमान
  choice: 'सामान्य वर्तमान काल: ‘उठाता है… उत्पन्न करता है… निकालता है’'
  alternative: 'अतीत काल: ‘उठाया… उत्पन्न किया… निकाला’'
  rationale: यह पद सृष्टि पर यहोवा के चरितार्थ और निरंतर शासन की स्तुतिपरक घोषणा है। वर्तमान काल आसपास के कृदन्तों के साथ सामंजस्य रखता और इस सामान्य सत्य को स्पष्ट करता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। काव्यात्मक समानांतरता के लिए तीनों पंक्तियों में वर्तमानकालीन क्रियाएँ रखी गई हैं; ‘पवन’ और ‘भंडार’ ऊँचे किंतु प्रचलित शब्द हैं।
