source:
  edition: WLC
  text: אַחַ֤ת שָׁאַ֣לְתִּי מֵֽ/אֵת יְהוָה֮ אוֹתָ֪/הּ אֲבַ֫קֵּ֥שׁ שִׁבְתִּ֣/י בְּ/בֵית יְ֭הוָה כָּל יְמֵ֣י חַיַּ֑/י לַ/חֲז֥וֹת בְּ/נֹֽעַם יְ֝הוָ֗ה וּ/לְ/בַקֵּ֥ר בְּ/הֵיכָלֽ/וֹ׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/027/004.yaml
  text: 'One thing I have asked from Yahweh[a]; this I will seek: that I may dwell in the house of Yahweh all the days of my life[c][b], to behold the beauty of Yahweh and to inquire in his temple.'
translation:
  language: hi
  text: 'मैंने यहोवा[a] से एक बात माँगी है; उसी को मैं खोजूँगा: कि मैं अपने जीवन भर यहोवा के भवन में निवास करूँ, यहोवा की मनोहरता[b] निहारूँ और उसके मंदिर में विचार करूँ।[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में परमेश्वर का व्यक्तिगत नाम ‘य्ह्व्ह’ (YHWH) है; यहाँ उसका प्रचलित हिन्दी रूप ‘यहोवा’ दिया गया है।
    reason: alternative_reading
  - marker: b
    text: या ‘यहोवा की मधुरता’ अथवा ‘यहोवा की कृपा’।
    reason: lexical_alternative
  - marker: c
    text: इब्रानी क्रिया का अर्थ यहाँ कठिन है; इसका अनुवाद ‘उसके मंदिर में पूछताछ करूँ’, ‘खोजूँ’ या ‘मनन करूँ’ भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אַחַת שָׁאַלְתִּי
  choice: मैंने ... एक बात माँगी है
  rationale: स्त्रीलिंग संख्या אַחַת यहाँ संज्ञा के रूप में माँगी गई एकमात्र बात पर बल देती है; पूर्ण क्रिया को वर्तमान प्रासंगिकता सहित व्यक्त किया गया है।
- source_word: מֵאֵת יְהוָה
  choice: यहोवा से
  rationale: מֵאֵת स्रोत अथवा उस व्यक्ति को दर्शाता है जिससे निवेदन किया गया; यְהוָה को उसके व्यक्तिगत नाम के प्रचलित हिन्दी रूप में रखा गया है।
- source_word: אוֹתָהּ אֲבַקֵּשׁ
  choice: उसी को मैं खोजूँगा
  rationale: सर्वनाम पिछली ‘एक बात’ को बलपूर्वक फिर ग्रहण करता है और अपूर्ण क्रिया दृढ़, निरन्तर अभिलाषा व्यक्त करती है।
- source_word: שִׁבְתִּי בְּבֵית יְהוָה
  choice: कि मैं ... यहोवा के भवन में निवास करूँ
  rationale: प्रसंग में שׁבת का आशय केवल बैठना नहीं, परमेश्वर के भवन में बने रहना है; हिन्दी आश्रित वाक्य माँगी हुई बात की विषयवस्तु स्पष्ट करता है।
- source_word: כָּל יְמֵי חַיַּי
  choice: अपने जीवन भर
  rationale: यह स्वाभाविक आधुनिक हिन्दी में सम्पूर्ण जीवनकाल की मूल इब्रानी अवधि को संक्षेप और स्पष्ट रूप से व्यक्त करता है।
- source_word: לַחֲזוֹת בְּנֹעַם יְהוָה
  choice: यहोवा की मनोहरता निहारूँ
  rationale: חזה ध्यानपूर्वक देखने का भाव रखता है और נֹעַם में रमणीयता, मधुरता अथवा कृपा का अर्थ-संसार है; ‘मनोहरता’ जानबूझकर व्यापक रखा गया है।
- source_word: וּלְבַקֵּר בְּהֵיכָלוֹ
  choice: और उसके मन्दिर में मननपूर्वक खोज करूँ
  rationale: בקר का यहाँ अर्थ कठिन है और पवित्रस्थान में ध्यानपूर्ण खोज, पूछताछ या मनन की ओर संकेत कर सकता है; मुख्य पाठ इन जुड़े हुए भावों को स्वाभाविक हिन्दी में रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: मूल पाठ व्यक्तिगत वाचा-नाम का प्रयोग करता है। ‘यहोवा’ आधुनिक हिन्दी बाइबलीय प्रयोग में व्यापक रूप से पहचाना जाता है; पादटिप्पणी मूल चार अक्षरी नाम की जानकारी देती है।
- issue: נֹעַם יְהוָה का आशय
  choice: यहोवा की मनोहरता
  alternative: यहोवा की मधुरता; यहोवा की कृपा
  rationale: शब्द सौन्दर्य, प्रसन्नता, मधुरता और अनुग्रह तक अर्थ दे सकता है। ‘मनोहरता’ उपासना-संदर्भ के अनुकूल है, पर अन्य सम्भावनाएँ पादटिप्पणी में सुरक्षित हैं।
- issue: וּלְבַקֵּר का अर्थ
  choice: मननपूर्वक खोज करूँ
  alternative: पूछताछ करूँ; खोजूँ; मनन करूँ
  rationale: इस स्थान पर क्रिया का सटीक अर्थ विवादित है। चुना हुआ वाक्य ध्यानपूर्ण खोज का भाव देता है और पादटिप्पणी वास्तविक अस्पष्टता बनाए रखती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। काव्यात्मक समानता तथा एकमात्र अभिलाषा पर बल बनाए रखा गया है। ‘मन्दिर’ वर्तमान हिन्दी में स्वाभाविक है, जबकि ‘भवन’ मूल के ‘घर’ वाले उपासना-बिम्ब को सुरक्षित रखता है।
