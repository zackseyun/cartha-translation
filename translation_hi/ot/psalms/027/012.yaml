  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: אַֽל תִּ֭תְּנֵ/נִי בְּ/נֶ֣פֶשׁ צָרָ֑/י כִּ֥י קָֽמוּ בִ֥/י עֵֽדֵי שֶׁ֝֗קֶר וִ/יפֵ֥חַ חָמָֽס־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/027/012.yaml
  text: Do not give me over to the desire of my adversaries[a], for false witnesses have risen against me[c][b], and they breathe out violence.
translation:
  language: hi
  text: मुझे मेरे विरोधियों की इच्छा के हवाले न कर[a], क्योंकि झूठे गवाह मेरे विरुद्ध उठ खड़े हुए हैं, और वे हिंसा उगलते हैं[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘मुझे मेरे विरोधियों की मर्जी के हवाले न कर।’ यहाँ इब्रानी נֶפֶשׁ का अर्थ ‘प्राण’ नहीं, बल्कि ‘इच्छा’, ‘लालसा’ या ‘मर्जी’ है।
    reason: lexical_alternative
  - marker: b
    text: 'इब्रानी में अंतिम क्रिया एकवचन है: ‘और वह हिंसा उगलता है।’ इसका निहित कर्ता किसी एक झूठे गवाह को प्रतिनिधि रूप में, या झूठे गवाहों के सामूहिक चरित्र को, दर्शा सकता है।'
    reason: source_ambiguity
lexical_decisions:
- source_word: תִּתְּנֵנִי
  choice: मुझे ... के हवाले न कर
  rationale: निषेध אַל के साथ נתן और प्रथम पुरुष कर्म-प्रत्यय का अर्थ किसी को दूसरे के अधिकार में सौंप देना है; ‘के हवाले न कर’ आधुनिक हिन्दी में स्वाभाविक और अर्थ-सटीक है।
- source_word: בְּנֶפֶשׁ
  choice: की इच्छा के
  rationale: यहाँ נֶפֶשׁ संकीर्ण अर्थ में ‘प्राण/आत्मा’ नहीं, बल्कि इच्छा, लालसा या अभिलाषा को व्यक्त करता है। इस मुहावरे में ‘इच्छा के हवाले’ प्रसंग के अनुकूल है।
- source_word: צָרָי
  choice: मेरे विरोधियों
  rationale: צַר hostile opponents को दर्शाता है। ‘विरोधी’ कानूनी और शत्रुतापूर्ण दोनों संदर्भों में सहज है और ‘शत्रु’ से थोड़ा व्यापक अर्थ बनाए रखता है।
- source_word: קָמוּ בִי
  choice: मेरे विरुद्ध उठ खड़े हुए हैं
  rationale: קום के साथ בְּ किसी व्यक्ति के विरुद्ध खड़े होने या उठने का प्रचलित अर्थ देता है; पूर्ण क्रिया के परिणाम को ‘उठ खड़े हुए हैं’ स्पष्ट करता है।
- source_word: עֵדֵי שֶׁקֶר
  choice: झूठे गवाह
  rationale: रचना का सीधा कानूनी अर्थ ऐसे गवाह हैं जो झूठ बोलते हैं; ‘झूठे गवाह’ आधुनिक हिन्दी का स्वाभाविक पद है।
- source_word: וִיפֵחַ חָמָס
  choice: और वे हिंसा उगलते हैं
  rationale: יפח का मूल बिंब साँस छोड़ने या मुँह से निकालने का है। ‘हिंसा उगलते हैं’ उस सजीव रूपक और शत्रुतापूर्ण कथन को बनाए रखता है। इब्रानी में एकवचन रूप होने की कठिनाई को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: חָמָס
  choice: हिंसा
  rationale: חָמָס हिंसा, क्रूर अन्याय या घोर अत्याचार को दर्शा सकता है; यहाँ ‘हिंसा’ सबसे सीधा और प्रभावशाली विकल्प है।
theological_decisions:
- issue: וִיפֵחַ का एकवचन रूप और עֵדֵי का बहुवचन
  choice: मुख्य पाठ में इसे झूठे गवाहों का सामूहिक वर्णन मानकर ‘वे हिंसा उगलते हैं’
  alternative: ‘और हिंसा उगलने वाला भी’ अथवा ‘जो हिंसा उगलता है’
  rationale: मुख्य वाक्य हिन्दी में स्वाभाविक रहता है और निकटवर्ती बहुवचन गवाहों को कर्ता मानता है, पर इब्रानी का एकवचन रूप किसी एक प्रतिनिधि व्यक्ति या अलग समानाधिकरण पद की सम्भावना रखता है; इसे पादटिप्पणी में स्पष्ट किया गया है, बिना तनाव को मिटाए।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘हवाले न कर’, ‘उठ खड़े हुए हैं’ और ‘हिंसा उगलते हैं’ मूल के कानूनी-संकटपूर्ण संदर्भ तथा काव्यात्मक तीव्रता दोनों को बनाए रखते हैं।
