  yaml_path: translation/ot/psalms/027/014.yaml
  text: Wait for Yahweh[a]; be strong, and let your heart take courage; yes[c][b], wait for Yahweh.
translation:
  language: hi
  text: याहवे की प्रतीक्षा कर[a]; दृढ़ हो, और तेरा हृदय साहस पाए[b]; और याहवे की प्रतीक्षा कर।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘याहवे पर आशा रख’; इब्रानी शब्द में भरोसे के साथ प्रतीक्षा करने का भाव है।
    reason: lexical_alternative
  - marker: b
    text: या, ‘और वह तेरे हृदय को दृढ़ करेगा।’ इब्रानी क्रियारूप को आगे बढ़ती हुई आज्ञा के बजाय प्रतिज्ञासूचक कथन के रूप में भी पढ़ा जा सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: קַוֵּה / וְקַוֵּה
  choice: बाट जोह / बाट जोह
  rationale: पिएल आज्ञार्थक में धैर्यपूर्वक प्रतीक्षा और भरोसे से भरी आशा—दोनों भाव हैं। ‘बाट जोह’ इन दोनों को स्वाभाविक, संक्षिप्त और काव्यात्मक हिन्दी में व्यक्त करता है; अंतिम पुनरावृत्ति भी ज्यों की त्यों रखी गई है।
- source_word: אֶל
  choice: की
  rationale: קוה के साथ यह उस व्यक्ति को दर्शाता है जिसकी ओर आशापूर्ण प्रतीक्षा लगी है। हिन्दी मुहावरे ‘याहवे की बाट जोह’ में संबंधकारक ‘की’ यही दिशा और अपेक्षा स्वाभाविक ढंग से व्यक्त करता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय देवनागरी में लिप्यंतरित किया गया है।
- source_word: חֲזַק
  choice: दृढ़ हो
  rationale: आज्ञार्थक का सीधा प्रोत्साहन बनाए रखता है और शक्ति को केवल शारीरिक बल तक सीमित नहीं करता।
- source_word: וְיַאֲמֵץ
  choice: और … साहस बाँधे
  rationale: आज्ञाओं की शृंखला में इसे प्रोत्साहनसूचक भाव में लिया गया है। हिन्दी का ‘हृदय साहस बाँधे’ हृदय को स्पष्ट रूप से बनाए रखता है और आंतरिक दृढ़ता का स्वाभाविक अर्थ देता है।
- source_word: לִבֶּךָ
  choice: तेरा हृदय
  rationale: इब्रानी में ‘हृदय’ मनुष्य के भीतरी संकल्प और साहस को सूचित करता है। मूल रूपक को हिन्दी में स्पष्ट और प्रभावी होने के कारण सुरक्षित रखा गया है।
- source_word: וְקַוֵּה
  choice: हाँ, … बाट जोह
  rationale: वाव के साथ दोहराई गई आज्ञा पद का चरम प्रोत्साहन है। ‘हाँ’ उस बलाघात को सहज हिन्दी में व्यक्त करता है, जबकि मूल पुनरावृत्ति बनी रहती है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा अथवा ‘प्रभु’
  rationale: पद में व्यक्तिगत ईश्वरीय नाम सीधे आया है; ‘याहवे’ उसे उपाधि में बदले बिना प्रस्तुत करता है।
- issue: וְיַאֲמֵץ का वाक्यगत बल
  choice: 'प्रोत्साहनसूचक: ‘तेरा हृदय साहस बाँधे’'
  alternative: 'भविष्यसूचक: ‘वह तेरे हृदय को दृढ़ करेगा’'
  rationale: आस-पास की आज्ञाओं के कारण प्रोत्साहनसूचक अर्थ मुख्य पाठ में प्रसंगानुकूल है। फिर भी क्रियारूप को भविष्यसूचक पढ़ना संभव है, इसलिए उस वास्तविक अस्पष्टता को पादटिप्पणी में रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और काव्यात्मक शैली रखी गई है। ‘बाट जोह’ सामान्य पाठक के लिए बोधगम्य साहित्यिक मुहावरा है और भजन की आशापूर्ण प्रतीक्षा को ‘प्रतीक्षा कर’ से अधिक पूर्णता से व्यक्त करता है। संबोधन की एकवचन निकटता के अनुरूप ‘तेरा’ रखा गया है।
