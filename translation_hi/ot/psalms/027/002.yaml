  yaml_path: translation/ot/psalms/027/002.yaml
  text: When evildoers came near me to devour my flesh[b][a], my adversaries and my enemies—they stumbled and fell.
translation:
  language: hi
  text: जब कुकर्मी मेरा मांस निगलने के लिए मेरे निकट आए[a]—मेरे विरोधी और मेरे शत्रु—तो वे ही ठोकर खाकर गिर पड़े।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “मेरा मांस खाने के लिए।” यह इब्रानी अभिव्यक्ति हिंसक आक्रमण का सजीव चित्र है।
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּקְרֹב
  choice: जब ... निकट आए
  rationale: ב के साथ infinitive construct यहाँ कालसूचक परिस्थिति व्यक्त करता है। ‘जब ... निकट आए’ स्वाभाविक हिन्दी में क्रिया का भाव बनाए रखता है।
- source_word: מְרֵעִים
  choice: कुकर्मी
  rationale: यह participle बुराई करने वालों को सूचित करता है। ‘कुकर्मी’ नैतिक अर्थ को संक्षिप्त और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: לֶאֱכֹל אֶת־בְּשָׂרִי
  choice: मेरा मांस निगलने के लिए
  rationale: शाब्दिक ‘मेरा मांस खाने’ की अपेक्षा ‘निगलने’ से हिंसक आक्रमण का सजीव रूपक स्वाभाविक हिन्दी में सुरक्षित रहता है; ‘मांस’ मूल बिंब को बनाए रखता है।
- source_word: צָרַי
  choice: मेरे विरोधी
  rationale: यह विरोध या शत्रुता में खड़े लोगों को दर्शाता है। ‘विरोधी’ अगले समानांतर शब्द ‘शत्रु’ से भेद भी बनाए रखता है।
- source_word: וְאֹיְבַי
  choice: और मेरे शत्रु
  rationale: איב का सीधा अर्थ ‘शत्रु’ है। दोनों समानांतर संज्ञाओं को अलग-अलग रखा गया है।
- source_word: לִי
  choice: मेरे (अलग से अनूदित नहीं)
  rationale: इस प्रसंग में इसका विरोधात्मक संबंध ‘मेरे विरोधी’ और ‘मेरे शत्रु’ में स्वाभाविक रूप से समाहित है; ‘मेरे विरुद्ध’ जोड़ना हिन्दी में अनावश्यक पुनरुक्ति होता।
- source_word: הֵמָּה
  choice: वे ही
  rationale: स्वतंत्र सर्वनाम के बलाघात को ‘ही’ द्वारा व्यक्त किया गया है।
- source_word: כָשְׁלוּ וְנָפָלוּ
  choice: ठोकर खाकर गिर पड़े
  rationale: यह दोनों क्रियाओं के क्रम और पराजय/पतन के चित्र को स्वाभाविक हिन्दी में सुरक्षित रखता है, बिना पतन का प्रकार निश्चित किए।
