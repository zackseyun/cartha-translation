  verdict: revise
  source_fidelity: The draft closely follows the Hebrew’s sequence, imperative force, poetic parallelism, and direct address. ‘मुख,’ ‘सेवक,’ the two distinct abandonment verbs, and ‘मेरे उद्धार के परमेश्वर’ are all faithful. However, ‘तू मेरा सहायक रहा है’ shifts עֶזְרָתִי (‘my help’) toward ‘my helper’; ‘मेरा सहारा’ more naturally expresses the predicative sense in Hindi without adding interpretation.
  naturalness: The prayerful register and intimate singular ‘तू’ are natural for a Hindi psalm. ‘क्रोध में अपने सेवक को दूर न कर’ is clear. Replacing ‘सहायक’ with ‘सहारा’ improves idiomatic fluency and preserves the source sense.
  terminology: ‘परमेश्वर,’ ‘उद्धार,’ ‘सेवक,’ and ‘मुख’ are suitable modern-standard Hindi biblical terms. The anthropomorphic image is rightly retained rather than paraphrased as ‘उपस्थिति.’
  issues:
