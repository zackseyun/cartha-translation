id: PSA.27.9
reference: Psalms 27:9
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: אַל תַּסְתֵּ֬ר פָּנֶ֨י/ךָ מִמֶּ/נִּי֮ אַֽל תַּט בְּ/אַ֗ף עַ֫בְדֶּ֥/ךָ עֶזְרָתִ֥/י הָיִ֑יתָ אַֽל תִּטְּשֵׁ֥/נִי וְ/אַל תַּֽ֝עַזְבֵ֗/נִי אֱלֹהֵ֥י יִשְׁעִֽ/י־׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/027/009.yaml
  text: Do not hide your face from me[a]; do not turn your servant away in anger. You have been my help. Do not cast me off, and do not forsake me[c][b], O God of my salvation.
translation:
  language: hi
  text: 'मुझसे अपना मुख न छिपा;

    क्रोध में अपने सेवक को दूर न कर।

    तू मेरा सहारा रहा है।

    मुझे न त्याग, न छोड़,

    हे मेरे उद्धार के परमेश्वर!'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תַּסְתֵּר
  choice: छिपा
  rationale: सתר का सामान्य अर्थ ‘छिपाना’ है; ‘अपना मुख न छिपा’ इब्रानी संबंधपरक बिंब को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: פָּנֶיךָ
  choice: अपना मुख
  rationale: ‘मुख’ को ‘उपस्थिति’ कहकर अमूर्त नहीं किया गया, क्योंकि मूल पाठ स्पष्ट रूप से दिव्य मुख का काव्यात्मक बिंब रखता है।
- source_word: תַּט בְּאַף
  choice: क्रोध में ... दूर न कर
  rationale: נטה का मूल भाव मोड़ने या हटा देने का है; इस प्रसंग में सेवक को क्रोधपूर्वक दूर करने का संबंधपरक अर्थ स्वाभाविक है।
- source_word: עַבְדֶּךָ
  choice: अपने सेवक
  rationale: प्रार्थना में यह परमेश्वर के प्रति नम्र समर्पण की आत्म-पहचान है; ‘दास’ की अपेक्षा ‘सेवक’ आधुनिक हिन्दी में प्रसंग के बल को बेहतर व्यक्त करता है।
- source_word: עֶזְרָתִי הָיִיתָ
  choice: तू मेरा सहायक रहा है
  rationale: עזרה सहायता को सूचित करता है, और पूर्ण क्रिया परमेश्वर की पहले से प्रमाणित तथा वर्तमान में प्रासंगिक सहायता दर्शाती है। हिन्दी में ‘मेरा सहायक’ अधिक सहज है।
- source_word: תִּטְּשֵׁנִי
  choice: मुझे न त्याग
  rationale: נטש में छोड़ देने, त्यागने या ठुकराने का प्रबल भाव है; ‘त्याग’ अगली क्रिया से कुछ भेद रखते हुए संबंध-विच्छेद का भार व्यक्त करता है।
- source_word: תַּעַזְבֵנִי
  choice: न छोड़
  rationale: עזב का सीधा अर्थ छोड़ना है। ‘त्याग’ और ‘छोड़’ साथ रखकर समानार्थी काव्यात्मक तीव्रता तथा दोनों इब्रानी क्रियाओं का भेद बचाया गया है।
- source_word: אֱלֹהֵי יִשְׁעִי
  choice: हे मेरे उद्धार के परमेश्वर
  rationale: सम्बोधन और इब्रानी संबंध-पदबंध दोनों सुरक्षित हैं; ‘उद्धार’ ישע के बचाव और छुटकारे के व्यापक धार्मिक अर्थ को बनाए रखता है।
theological_decisions:
- issue: परमेश्वर के ‘मुख’ का मानवरूपी बिंब
  choice: मुख
  alternative: उपस्थिति
  rationale: मूल का स्पष्ट काव्यात्मक बिंब रखा गया है, ताकि दिव्य अनुग्रह और निकटता की भाषा को व्याख्यात्मक अमूर्तन से न बदला जाए।
- issue: עבד द्वारा प्रार्थी की पहचान
  choice: सेवक
  alternative: दास
  rationale: यहाँ कानूनी बंधन नहीं, बल्कि परमेश्वर के प्रति नम्र अधीनता और निष्ठा प्रमुख है।
- issue: יִשְׁעִי का अर्थक्षेत्र
  choice: मेरे उद्धार
  alternative: मुझे बचानेवाले
  rationale: संज्ञात्मक संरचना मूल की संक्षिप्तता और धर्मवैचारिक व्यापकता बनाए रखती है; इसे केवल किसी एक बचाव की घटना तक सीमित नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण प्रार्थना-काव्य का स्वर रखा गया है। परमेश्वर के लिए निकट, एकवचन ‘तू’ का प्रयोग भजन-साहित्य की प्रत्यक्ष आत्मीय सम्बोधन-शैली के अनुरूप है। पंक्ति-विन्यास इब्रानी काव्य की क्रमिक विनतियों को स्पष्ट करता है।
