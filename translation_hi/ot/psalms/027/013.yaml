id: PSA.27.13
reference: Psalms 27:13
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: לׅׄוּלֵׅׄ֗אׅׄ הֶ֭אֱמַנְתִּי לִ/רְא֥וֹת בְּֽ/טוּב יְהוָ֗ה בְּ/אֶ֣רֶץ חַיִּֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/027/013.yaml
  text: Unless I had believed that I would see the goodness of Yahweh in the land of the living[a][b].
translation:
  language: hi
  text: यदि मुझे यह विश्वास न होता कि मैं जीवितों की धरती पर याहवे की भलाई देखूँगा—[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'हिब्रू वाक्य यहाँ अपूर्ण है: “यदि मुझे यह विश्वास न होता कि मैं याहवे की भलाई जीवितों की धरती पर देखूँगा—।” शर्त का परिणाम नहीं बताया गया है।'
    reason: मूल की दीर्घवृत्तीय रचना और वास्तविक अस्पष्टता स्पष्ट करना।
  - marker: b
    text: 'अभिप्राय सम्भवतः: “तो मैं निराश हो जाता” या “तो मेरा साहस टूट जाता।”'
    reason: संदर्भ से सम्भव अनकहे परिणाम बताना, बिना उसे मुख्य पाठ में निश्चित किए।
lexical_decisions:
- source_word: לוּלֵא
  choice: यदि ... न होता
  rationale: यह अवास्तविक या विपरीत-तथ्य शर्त आरम्भ करता है। हिन्दी में ‘यदि मुझे ... न होता’ इसकी शर्तीय शक्ति को स्वाभाविक रूप से व्यक्त करता है, जबकि मूल में अनकहे परिणाम को मुख्य पाठ में नहीं जोड़ता।
- source_word: הֶאֱמַנְתִּי
  choice: मुझे यह विश्वास ... होता
  rationale: אמן के हिफ़ील रूप का अर्थ यहाँ विश्वास करना है। हिन्दी की शर्तीय रचना में संज्ञात्मक अभिव्यक्ति सहज है और आगे आने वाले कथन को विश्वास की विषयवस्तु बनाती है।
- source_word: לִרְאוֹת
  choice: कि मैं ... देखूँगा
  rationale: मूल का infinitive construct ‘देखने’ विश्वास की विषयवस्तु बताता है; आधुनिक हिन्दी में ‘कि मैं ... देखूँगा’ भावी अपेक्षा को स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: בְּטוּב
  choice: भलाई
  rationale: טוּב भलाई, कल्याण या उदार अनुग्रह का बोध करा सकता है। ‘भलाई’ इसके व्यापक और अमूर्त अर्थ को बनाए रखता है तथा इसे केवल भौतिक समृद्धि तक सीमित नहीं करता।
- source_word: יְהוָה
  choice: याहवे
  rationale: दिव्य नाम יהוה को उपाधि से बदलने के बजाय हिन्दी में उसके प्रचलित लिप्यंतरण ‘याहवे’ से व्यक्त किया गया है।
- source_word: בְּאֶרֶץ חַיִּים
  choice: जीवितों की धरती पर
  rationale: यह जीवित मनुष्यों के लोक के लिए हिब्रू मुहावरा है, जो मृत्यु या अधोलोक के विपरीत है। ‘जीवितों की धरती पर’ हिन्दी में अर्थपूर्ण और स्वाभाविक है।
- source_word: '[implicit apodosis after לוּלֵא]'
  choice: मुख्य पाठ में अनकहा; विराम-चिह्न और पादटिप्पणी से संकेत
  rationale: मसोरेटी पाठ शर्त का परिणाम नहीं कहता। डैश मूल की आकस्मिक अपूर्णता को बनाए रखता है; संभावित अर्थ पादटिप्पणी में दिए गए हैं, ताकि किसी एक पूर्ति को मूल पाठ न बनाया जाए।
theological_decisions:
- issue: दिव्य नाम יהוה का अनुवाद
  choice: याहवे
  alternative: प्रभु
  rationale: मूल में निजी दिव्य नाम स्पष्ट रूप से उपस्थित है। उसका लिप्यंतरण नाम और उपाधि के भेद को सुरक्षित रखता है।
- issue: लुप्त शर्त-परिणाम को पूरा करना
  choice: मुख्य पाठ को जानबूझकर अपूर्ण रखना
  alternative: ‘तो मैं निराश हो जाता’ या ‘तो मेरा साहस टूट जाता’ जोड़ना
  rationale: हिब्रू में परिणाम-वाक्यांश वास्तव में नहीं है। किसी संभावित अर्थ को मुख्य पाठ में जोड़ने के बजाय मूल की अस्पष्टता और भावात्मक तनाव को रखा गया है; पाठक की सहायता हेतु सम्भावित पूर्तियाँ पादटिप्पणी में हैं।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य हिन्दी पाठक के लिए सुबोध रखी गई है। ‘धरती’ यहाँ ארץ के मुहावरेदार अर्थ को सहज बनाता है। अंतिम डैश जानबूझकर रखा गया है, क्योंकि मूल हिब्रू शर्त का परिणाम अनकहा छोड़ देता है।
