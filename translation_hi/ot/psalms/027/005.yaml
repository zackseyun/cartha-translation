source:
  edition: WLC
  text: כִּ֤י יִצְפְּנֵ֨/נִי בְּ/סֻכֹּ/ה֮ בְּ/י֪וֹם רָ֫עָ֥ה יַ֭סְתִּרֵ/נִי בְּ/סֵ֣תֶר אָהֳל֑/וֹ בְּ֝/צ֗וּר יְרוֹמְמֵֽ/נִי׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/027/005.yaml
  text: For he will hide me in his shelter in the day of trouble[a]; he will conceal me in the secret place of his tent[c][b]; he will lift me high upon a rock.
translation:
  language: hi
  text: क्योंकि विपत्ति के दिन वह मुझे अपने आश्रय[a] में छिपा लेगा; वह मुझे अपने तम्बू के गुप्त स्थान में छिपाए रखेगा; वह मुझे चट्टान पर ऊँचा उठा देगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “अपने छप्पर”, “अपनी कुटिया” अथवा “अपने मण्डप” में। इब्रानी शब्द छाया और सुरक्षा देने वाली संरचना को दर्शाता है तथा उसमें पवित्रस्थान की ओर संकेत भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले प्रसंग में भजनकार के भरोसे का आधार बताता है; इसलिए कारणसूचक अर्थ रखा गया है।
- source_word: יִצְפְּנֵנִי
  choice: वह मुझे ... छिपा लेगा
  rationale: צפן में छिपाकर सुरक्षित रखने का भाव है; यह हिन्दी में स्वाभाविक रूप से उस संरक्षण को व्यक्त करता है।
- source_word: בְּסֻכּוֹ
  choice: अपने छप्पर में
  rationale: סֻכָּה अस्थायी छाया या आश्रय देने वाली संरचना है। 'छप्पर' ठोस काव्यात्मक चित्र बनाए रखता है, जबकि सम्भावित पवित्रस्थान-संबंधी संकेत को पादटिप्पणी में खुला रखा गया है।
- source_word: בְּיוֹם רָעָה
  choice: विपत्ति के दिन
  rationale: यहाँ רָעָה नैतिक बुराई से अधिक संकट या अनिष्ट की परिस्थिति बताता है; 'विपत्ति' इस अर्थ को संक्षेप और गरिमा से व्यक्त करता है।
- source_word: יַסְתִּרֵנִי
  choice: वह मुझे ... छिपाए रखेगा
  rationale: סתר छिपाने या ओट में रखने को दर्शाता है। 'छिपाए रखेगा' पहले खंड की समानांतरता और निरन्तर सुरक्षा दोनों बनाए रखता है।
- source_word: בְּסֵתֶר אָהֳלוֹ
  choice: अपने तम्बू के गुप्त स्थान में
  rationale: סֵתֶר किसी छिपे या गुप्त स्थान को और אֹהֶל ठोस रूप से तम्बू को दर्शाता है; अनुवाद दोनों बिंब सुरक्षित रखता है।
- source_word: בְּצוּר
  choice: चट्टान पर
  rationale: צוּר दृढ़ चट्टान या शैल को दर्शाता है, जो सुरक्षा और पहुँच से बाहर ऊँचे स्थान का बिंब देता है।
- source_word: יְרוֹמְמֵנִי
  choice: मुझे ... ऊँचा उठा देगा
  rationale: רום का अर्थ ऊँचा करना है; यह चयन उद्धार और सुरक्षा के ऊर्ध्व बिंब को स्वाभाविक हिन्दी में रखता है।
theological_decisions:
- issue: סֻכּוֹ और אָהֳלוֹ में सम्भावित पवित्रस्थान-संबंधी संकेत
  choice: मुख्य पाठ में ठोस आश्रय और तम्बू के बिंब रखे गए हैं।
  alternative: '''निवास-मण्डप'' या स्पष्ट पवित्रस्थान-संबंधी शब्दावली अपनाना।'
  rationale: इन सामान्य इब्रानी संज्ञाओं में उपासना-स्थान की प्रतिध्वनि सम्भव है, पर पद स्वयं उस अर्थ को अनिवार्य नहीं करता; इसलिए अनुवाद उसे संप्रदायगत या अनावश्यक रूप से विशिष्ट नहीं बनाता।
- issue: בְּיוֹם רָעָה में רָעָה का अर्थ
  choice: नैतिक बुराई के बजाय संकट या विपत्ति
  alternative: '''बुराई के दिन'''
  rationale: प्रसंग शत्रुओं और संकट से सुरक्षा का है; इसलिए परिस्थितिजन्य अनिष्ट का अर्थ अधिक उपयुक्त है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण काव्यात्मक शैली रखी गई है। निकटवर्ती समानांतर क्रियाओं को 'छिपा लेगा' और 'छिपाए रखेगा' से व्यक्त किया गया है। मुख्य पाठ में केवल एक पादटिप्पणी दी गई है और उसका चिह्न [a] पाठ में उपस्थित है।
