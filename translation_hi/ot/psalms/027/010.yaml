base_translation:
  language: en
  yaml_path: translation/ot/psalms/027/010.yaml
  text: For my father and my mother have forsaken me[a], but Yahweh will take me in.
translation:
  language: hi
  text: क्योंकि मेरे पिता और मेरी माता ने मुझे छोड़ दिया है, परन्तु यहोवा मुझे अपना लेगा[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “मुझे ग्रहण कर लेगा” अथवा “मुझे अपने पास रख लेगा।” इब्रानी क्रिया का शाब्दिक अर्थ “इकट्ठा करना” है; यहाँ इसका भाव स्वागत करके संरक्षण देना है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यहाँ यह शब्द प्रसंग में भजनकार के भरोसे का आधार या परिस्थिति बताता है; ‘क्योंकि’ उसके संयोजक बल को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: אָבִי וְאִמִּי
  choice: मेरे पिता और मेरी माता
  rationale: दोनों संबंधवाचक संज्ञाओं और प्रथम पुरुष एकवचन अधिकारसूचक प्रत्ययों का सीधा और गरिमापूर्ण अनुवाद।
- source_word: עֲזָבוּנִי
  choice: ने मुझे छोड़ दिया है
  rationale: עזב का अर्थ छोड़ना या त्याग देना है। ‘छोड़ दिया है’ आधुनिक सामान्य हिन्दी में स्वाभाविक है और परित्याग की पीड़ा व्यक्त करता है।
- source_word: וַיהוָה
  choice: परन्तु यहोवा
  rationale: वाव यहाँ मानवीय परित्याग और परमेश्वर द्वारा अपनाए जाने के बीच विरोध प्रकट करता है, इसलिए ‘परन्तु’ उपयुक्त है। covenant name को परियोजना की नीति के अनुसार ‘यहोवा’ रखा गया है।
- source_word: יַאַסְפֵנִי
  choice: मुझे अपना लेगा
  rationale: אסף का मूल अर्थ ‘इकट्ठा करना’ है, पर इस व्यक्तिगत प्रसंग में इसका भाव किसी को अपने संरक्षण में ग्रहण करना है। ‘अपना लेगा’ हिन्दी में स्वागत, स्वीकार और आश्रय का संयुक्त भाव स्वाभाविक रूप से देता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: प्रभु
  rationale: व्यक्तिगत वाचा-नाम को सामान्य उपाधि में बदलने के बजाय हिन्दी की स्थापित बाइबलीय वर्तनी ‘यहोवा’ से सुरक्षित रखा गया है।
- issue: יַאַסְפֵנִי में ईश्वरीय ग्रहण और संरक्षण का भाव
  choice: मुझे अपना लेगा
  alternative: मुझे इकट्ठा करेगा / मुझे ग्रहण करेगा
  rationale: पाठ में केवल भौतिक रूप से इकट्ठा करने की बात नहीं, बल्कि छोड़े गए व्यक्ति को स्वीकार कर संरक्षण देने का भाव है। फिर भी मूल क्रिया की ठोस ‘इकट्ठा करने’ वाली छवि पादटिप्पणी में बताई गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण काव्यात्मक गद्य। ‘मेरे पिता और मेरी माता’ मूल की समानांतर रचना बनाए रखता है। ‘परन्तु’ स्पष्ट विरोध दिखाता है और ‘अपना लेगा’ सामान्य पाठक के लिए स्वाभाविक रहते हुए आश्रय तथा स्वीकार का भाव व्यक्त करता है।
