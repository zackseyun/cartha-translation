source:
  edition: WLC
  text: וְ/עַתָּ֨ה יָר֪וּם רֹאשִׁ֡/י עַ֤ל אֹֽיְבַ֬/י סְֽבִיבוֹתַ֗/י וְ/אֶזְבְּחָ֣ה בְ֭/אָהֳל/וֹ זִבְחֵ֣י תְרוּעָ֑ה אָשִׁ֥ירָה וַ֝/אֲזַמְּרָ֗ה לַ/יהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/027/006.yaml
  text: And now my head will be lifted up above my enemies around me[a], and I will offer in his tent sacrifices of joyful shouting; I will sing, yes[b], I will make music to Yahweh.
translation:
  language: hi
  text: और अब मेरा सिर मेरे चारों ओर के शत्रुओं से ऊँचा होगा। मैं उसके तम्बू[b] में जयघोष के बलिदान[a] चढ़ाऊँगा; मैं याहवे के लिए गाऊँगा, हाँ, संगीत बजाऊँगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जयघोष के साथ बलिदान।” इब्रानी पदबंध बलिदानों के उत्सवी स्वरूप अथवा उनके साथ होने वाले जयघोष—दोनों पर बल दे सकता है।
    reason: lexical_alternative
  - marker: b
    text: “उसके तम्बू” में आया सर्वनाम सबसे स्वाभाविक रूप से याहवे की ओर संकेत करता है।
    reason: referent_clarification
lexical_decisions:
- source_word: וְעַתָּה
  choice: और अब
  rationale: संयोजक וְ और वर्तमान अथवा निकट भविष्य की ओर संकेत करने वाले עַתָּה—दोनों का बल बनाए रखता है।
- source_word: יָרוּם רֹאשִׁי
  choice: मेरा सिर ... से ऊँचा होगा
  rationale: ‘सिर’ के मूल बिंब को बनाए रखते हुए सम्मान, आत्मविश्वास और विजय की अपेक्षा व्यक्त करता है।
- source_word: עַל אֹיְבַי סְבִיבוֹתַי
  choice: मेरे चारों ओर के शत्रुओं से ऊँचा
  rationale: עַל की श्रेष्ठता/ऊँचाई और סְבִיבוֹתַי की चारों ओर से घेरे होने की धारणा, दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וְאֶזְבְּחָה
  choice: मैं ... बलिदान चढ़ाऊँगा
  rationale: कोहोर्टेटिव रूप के संकल्पात्मक भाव को भविष्यकाल में व्यक्त करता है; हिन्दी में ‘बलिदान चढ़ाना’ स्वाभाविक प्रयोग है।
- source_word: בְאָהֳלוֹ
  choice: उसके तम्बू में
  rationale: पुल्लिंग एकवचन प्रत्यय को स्पष्ट किए बिना मूल के अनुसार रखा गया है; प्रसंग में इसका सबसे स्वाभाविक संकेत याहवे के पवित्र तम्बू की ओर है।
- source_word: זִבְחֵי תְרוּעָה
  choice: जयघोष के बलिदान
  rationale: रचना की संक्षिप्तता और תְרוּעָה के ऊँचे उत्सवी घोष का भाव बनाए रखता है, साथ ही बलिदानों के प्रकार और उनके साथ होने वाले घोष के बीच मूल अस्पष्टता को पूरी तरह समाप्त नहीं करता।
- source_word: אָשִׁירָה וַאֲזַמְּרָה
  choice: मैं ... गाऊँगा, हाँ, भजन गाऊँगा
  rationale: दोनों समानांतर उपासना-क्रियाओं और उनके संकल्पात्मक बल को स्वाभाविक हिन्दी में रखता है; ‘हाँ’ दूसरी क्रिया के उत्कर्षात्मक बल को दर्शाता है।
- source_word: לַיהוָה
  choice: याहवे के लिए
  rationale: मूल पाठ में आए परमेश्वर के व्यक्तिगत वाचा-नाम יהוה को लिप्यंतरित करता है।
theological_decisions:
- issue: יהוה परमेश्वर के नाम का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल में वाचा-नाम सीधे आया है; ‘याहवे’ उसका व्यापक रूप से स्वीकृत आधुनिक लिप्यंतरण है और उसे उपाधि में नहीं बदलता।
- issue: בְאָהֳלוֹ में सर्वनाम का संदर्भ
  choice: ‘उसके तम्बू’ को पाठ में बनाए रखना; संदर्भतः याहवे का तम्बू
  alternative: भजनकार का अपना तम्बू
  rationale: बलिदान और याहवे की स्तुति का निकट प्रसंग इसे याहवे के पवित्र तम्बू से जोड़ता है, पर हिन्दी पाठ मूल सर्वनाम को ही बनाए रखता है।
- issue: זִבְחֵי תְרוּעָה का संबंध
  choice: जयघोष के बलिदान
  alternative: जयघोष के साथ बलिदान
  rationale: इब्रानी संबंधवाचक रचना बलिदानों के उत्सवी चरित्र अथवा उनके साथ होने वाले घोष—दोनों की अनुमति देती है; मुख्य पाठ संक्षिप्त मूल रूप रखता है और पादटिप्पणी विकल्प बताती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज शैली रखी गई है। ‘सिर ऊँचा होना’, ‘बलिदान चढ़ाना’ और ‘भजन गाना’ सामान्य पाठक के लिए स्वाभाविक हैं; मूल काव्य के समानांतर संकल्प और पवित्र तम्बू की उपासना-छवि सुरक्षित रखी गई है।
