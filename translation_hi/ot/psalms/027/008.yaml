  text: לְ/ךָ֤ אָמַ֣ר לִ֭בִּ/י בַּקְּשׁ֣וּ פָנָ֑/י אֶת פָּנֶ֖י/ךָ יְהוָ֣ה אֲבַקֵּֽשׁ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/027/008.yaml
  text: On your behalf my heart says[a], “Seek my face.” Your face, Yahweh[c][b], I seek.
translation:
  language: hi
  text: मेरे मन ने तेरे संबंध में कहा है[a], “उसके मुख की खोज करो।” हे याहवे, मैं तेरे मुख की खोज करता हूँ[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: आरम्भिक इब्रानी वाक्य कठिन है। इसका अर्थ यह भी हो सकता है, “मेरा मन तुझसे कहता है, ‘मेरे मुख की खोज करो,’” अथवा, “तेरे लिए मेरा मन कहता है, ‘मेरे मुख की खोज करो।’” इब्रानी में शाब्दिक रूप से ‘मेरे हृदय ने कहा’ है।
    reason: alternative_reading
  - marker: c
    text: अथवा “मैं तेरे मुख की खोज करूँगा।” इब्रानी क्रिया वर्तमान संकल्प या भावी इरादा, दोनों व्यक्त कर सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: לְךָ
  choice: तेरी ओर से
  rationale: इस कठिन दत्तिवीय प्रयोग को परमेश्वर की ओर से अथवा उसके संदर्भ में हृदय के बोलने के रूप में व्यक्त करता है। अन्य सम्भव संबंधों को पादटिप्पणी में रखा गया है।
- source_word: אָמַר לִבִּי
  choice: मेरा मन कहता है
  rationale: शाब्दिक रूप से ‘मेरे हृदय ने कहा’; काव्य-संदर्भ में यह वर्तमान आंतरिक प्रत्युत्तर को व्यक्त करता है। स्वाभाविक आधुनिक हिन्दी में ‘मन’ अंतःकरण के इस भाव को स्पष्ट रूप से पहुँचाता है।
- source_word: בַּקְּשׁוּ
  choice: खोजो
  rationale: बहुवचन आज्ञार्थक की आग्रहपूर्ण शक्ति को संक्षेप में बनाए रखता है। हिन्दी में रूप संख्या की दृष्टि से भी बहुवचन अथवा आदरसूचक हो सकता है।
- source_word: פָנָי / פָנֶיךָ
  choice: मेरे मुख / तेरे मुख
  rationale: दोनों अर्धपंक्तियों में ‘मुख’ बनाए रखने से मूल की शब्द-पुनरावृत्ति और परमेश्वर से प्रत्यक्ष भेंट की संबंधपरक छवि सुरक्षित रहती है; ‘उपस्थिति’ का अर्थ पादटिप्पणी में दिया गया है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी व्यक्तिगत ईश्वरीय नाम का हिन्दी लिप्यंतरण है; इसे किसी उपाधि से प्रतिस्थापित नहीं किया गया।
- source_word: אֲבַקֵּשׁ
  choice: मैं खोजता हूँ
  rationale: यह अपूर्ण क्रिया वर्तमान संकल्प या भावी इरादा दोनों व्यक्त कर सकती है। मुख्य पाठ में तत्काल प्रत्युत्तर के अनुरूप वर्तमान अर्थ लिया गया है और भावी विकल्प पादटिप्पणी में रखा गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा अथवा प्रभु
  rationale: मूल में व्यक्तिगत वाचा-नाम सीधे प्रयुक्त है; लिप्यंतरण उस नाम को उपाधि में बदले बिना बनाए रखता है।
- issue: आरम्भिक वाक्यांश לְךָ אָמַר לִבִּי का संबंध
  choice: तेरी ओर से मेरा मन कहता है, “मेरे मुख को खोजो”
  alternative: मेरा मन तुझसे कहता है, “मेरे मुख को खोजो”; अथवा मेरा मन तेरे विषय में कहता है, “उसके मुख को खोजो”
  rationale: इब्रानी वाक्य-विन्यास कठिन और दीर्घकाल से विवादित है। चुना हुआ पाठ मसोराई व्यंजनों को बनाए रखते हुए हृदय में गूँजती परमेश्वर की पुकार को व्यक्त करता है; अन्य वास्तविक सम्भावनाएँ पादटिप्पणी में सुरक्षित हैं।
- issue: פנים में ‘मुख’ और ‘उपस्थिति’ का संबंध
  choice: मुख
  alternative: उपस्थिति
  rationale: ‘मुख’ दोनों अर्धपंक्तियों की जानबूझकर की गई पुनरावृत्ति और व्यक्तिगत निकटता की छवि को बचाता है, जबकि निहित ‘उपस्थिति’ अर्थ पादटिप्पणी में स्पष्ट किया गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और काव्यात्मक रखी गई है। परमेश्वर को एकवचन आत्मीय संबोधन ‘तेरी/तेरे’ दिया गया है, जो भजन की सीधी प्रार्थना के अनुकूल है। ‘मुख को खोजना’ सामान्य गद्य से अधिक काव्यात्मक है, पर मूल बिंब और दोनों पंक्तियों की पुनरावृत्ति को सुरक्षित रखता है।
