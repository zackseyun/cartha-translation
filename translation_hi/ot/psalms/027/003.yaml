source:
  edition: WLC
  text: אִם תַּחֲנֶ֬ה עָלַ֨/י מַחֲנֶה֮ לֹֽא יִירָ֪א לִ֫בִּ֥/י אִם תָּק֣וּם עָ֭לַ/י מִלְחָמָ֑ה בְּ֝/זֹ֗את אֲנִ֣י בוֹטֵֽחַ־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/027/003.yaml
  text: Though an army encamps against me[a], my heart will not fear; though war rises against me[c][b], even then I will trust.
translation:
  language: hi
  text: 'चाहे एक सेना[b] मेरे विरुद्ध डेरा डाले,[a]

    मेरा हृदय नहीं डरेगा;

    चाहे मेरे विरुद्ध युद्ध उठ खड़ा हो,

    इस स्थिति में भी मैं भरोसा रखूँगा।[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “यदि एक सेना मेरे विरुद्ध डेरा डाले… यदि मेरे विरुद्ध युद्ध उठ खड़ा हो।” हिब्रू אִם का अर्थ “यदि” या यहाँ की तरह “चाहे” हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: हिब्रू में मूलतः “छावनी” या “शिविर”; इस प्रसंग में आशय डेरा डाले हुए सशस्त्र दल, अर्थात सेना, से है।
    reason: lexical_alternative
  - marker: c
    text: या, “इसी में मैं भरोसा रखता हूँ” अथवा “इसके बावजूद मुझे विश्वास है।” हिब्रू वाक्यांश भरोसे और आत्मविश्वास, दोनों का भाव दे सकता है, और “इस” का संकेत पूरी तरह स्पष्ट नहीं है।
    reason: alternative_reading
lexical_decisions:
- source_word: אִם
  choice: चाहे
  rationale: यहाँ אִם की दोनों आवृत्तियाँ केवल शर्त नहीं, बल्कि विरोधपूर्ण परिस्थिति में भी अडिग रहने का भाव व्यक्त करती हैं। ‘चाहे’ इस रियायती अर्थ को स्वाभाविक हिन्दी में सामने लाता है; ‘यदि’ सम्भव विकल्प है।
- source_word: תַּחֲנֶה
  choice: डेरा डाले
  rationale: חנה का मूल अर्थ शिविर लगाना या डेरा डालना है। यह चयन सैन्य बिंब को स्पष्ट और स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: מַחֲנֶה
  choice: एक सेना
  rationale: शब्द का शाब्दिक अर्थ ‘छावनी’ या ‘शिविर’ हो सकता है, पर यहाँ युद्ध के समानांतर और विरोधी शक्ति के रूप में यह छावनी में उतरी सेना को सूचित करता है।
- source_word: לֹא יִירָא לִבִּי
  choice: मेरा हृदय नहीं डरेगा
  rationale: हिब्रू में ‘मेरा हृदय’ स्पष्ट कर्ता है। उसे बनाए रखने से पद का आंतरिक और भावात्मक बिंब सुरक्षित रहता है।
- source_word: תָּקוּם
  choice: उठ खड़ा हो
  rationale: קום का मूल बिंब ‘उठना’ है। युद्ध को कर्ता रखते हुए ‘उठ खड़ा हो’ मूल की सजीव अभिव्यक्ति को बचाता है और अत्यधिक व्याख्या से बचता है।
- source_word: מִלְחָמָה
  choice: युद्ध
  rationale: यह शब्द का सीधा और संदर्भानुकूल अर्थ है तथा सेना के डेरा डालने से खुले संघर्ष तक की तीव्रता को बनाए रखता है।
- source_word: בְּזֹאת
  choice: इस स्थिति में भी
  rationale: हिब्रू पदबंध संक्षिप्त और कुछ हद तक अस्पष्ट है। यह अनुवाद निकटवर्ती संकटपूर्ण परिस्थिति की ओर संकेत करता है और ‘भी’ के द्वारा उसके बावजूद भरोसा बने रहने का भाव देता है।
- source_word: אֲנִי בוֹטֵחַ
  choice: मैं भरोसा रखूँगा
  rationale: בטח भरोसे या निश्चिंत विश्वास को व्यक्त करता है। प्रसंग की सम्भावित परिस्थितियों के साथ हिन्दी का भविष्यकाल स्वाभाविक है, जबकि ‘भरोसा’ केवल मानसिक आत्मविश्वास तक अर्थ को सीमित नहीं करता।
theological_decisions:
- issue: बְּזֹאת का संकेत और भरोसे का अनुक्त आधार
  choice: इसे अभी वर्णित संकटपूर्ण परिस्थिति की ओर संकेत करते हुए ‘इस स्थिति में भी मैं भरोसा रखूँगा’ कहा गया है।
  alternative: ‘इसी में मैं भरोसा रखता हूँ’ अथवा ‘इसके बावजूद मैं निश्चिंत हूँ’; इसे पिछले संदर्भ से प्रभु की ओर संकेत मानना भी सम्भव है।
  rationale: निकटतम संदर्भ सेना और युद्ध है, इसलिए परिस्थिति-सूचक अर्थ प्रमुख रखा गया है। फिर भी भरोसे का कर्म पद में स्पष्ट नहीं है; अनुवाद में ‘प्रभु पर’ जोड़कर उस वास्तविक अस्पष्टता को समाप्त नहीं किया गया।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की, काव्यात्मक किन्तु सहज और गरिमापूर्ण रखी गई है। समानांतर पंक्तियों में ‘चाहे… चाहे…’ मूल संरचना को सुनने योग्य बनाता है। ‘मेरा हृदय’ और युद्ध के ‘उठ खड़े होने’ के बिंब जानबूझकर सुरक्षित रखे गए हैं।
