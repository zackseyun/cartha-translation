  text: Of David[a]. Yahweh is my light and my salvation; whom shall I fear? Yahweh is the stronghold of my life[b]; of whom shall I be afraid?
translation:
  language: hi
  text: 'दाऊद का भजन।[a]


    याहवे मेरा प्रकाश और मेरा उद्धार है;

    मैं किससे डरूँ?

    याहवे मेरे जीवन का दृढ़ गढ़ है;

    मैं किससे भयभीत होऊँ?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शीर्षक के इब्रानी शब्दों का अनुवाद “दाऊद द्वारा रचित” या “दाऊद के लिए” भी हो सकता है; לְדָוִד लेखकत्व या संबंध सूचित कर सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: לְדָוִד
  choice: दाऊद का भजन
  rationale: शीर्षक में לְ संबंध, रचनाकारिता या समर्पण सूचित कर सकता है। हिंदी में ‘दाऊद का भजन’ स्वाभाविक है, जबकि अस्पष्टता पादटिप्पणी में सुरक्षित रखी गई है।
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के विशिष्ट इब्रानी नाम को सामान्य उपाधि से बदलने के बजाय लिप्यंतरित किया गया है।
- source_word: אוֹרִי
  choice: मेरा प्रकाश
  rationale: प्रकाश के मूल रूपक को सीधे और स्वाभाविक हिंदी में बनाए रखता है।
- source_word: יִשְׁעִי
  choice: मेरा उद्धार
  rationale: यह संज्ञा बचाव और मुक्ति दोनों का भाव रखती है; ‘उद्धार’ काव्यात्मक और व्यापक समतुल्य है।
- source_word: מָעוֹז חַיַּי
  choice: मेरे जीवन का दृढ़ गढ़
  rationale: מָעוֹז सुरक्षा देने वाले मजबूत आश्रय या दुर्ग को दर्शाता है; ‘दृढ़ गढ़’ मूल रूपक और भरोसे का भाव सुरक्षित रखता है।
- source_word: אִירָא / אֶפְחָד
  choice: डरूँ / भय खाऊँ
  rationale: समानार्थी इब्रानी क्रियाओं के काव्यात्मक समानांतर को हिंदी के दो स्वाभाविक पदों से व्यक्त किया गया है।
theological_decisions:
- issue: भजन के शीर्षक में לְדָוִד का संबंध
  choice: दाऊद का भजन
  alternative: दाऊद द्वारा रचित / दाऊद के लिए
  rationale: इब्रानी पूर्वसर्ग लेखकत्व, संबंध या समर्पण व्यक्त कर सकता है; मुख्य पाठ में पारंपरिक स्वाभाविक रूप रखा और विकल्प पादटिप्पणी में दिए।
- issue: दिव्य नाम का निरूपण
  choice: याहवे
  alternative: यहोवा / प्रभु
  rationale: मूल में आया विशिष्ट दिव्य नाम स्पष्ट रखा गया है; इसे उपाधि में बदलकर पाठ का भेद नहीं मिटाया गया।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण काव्यात्मक शैली अपनाई गई है। छोटे समानांतर वाक्य और आलंकारिक प्रश्न मूल भजन की लय एवं विश्वासपूर्ण स्वर बनाए रखते हैं।
