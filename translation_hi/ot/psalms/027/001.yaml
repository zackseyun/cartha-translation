base_translation:
  language: en
  yaml_path: translation/ot/psalms/027/001.yaml
  text: Of David[a]. Yahweh is my light and my salvation; whom shall I fear? Yahweh is the stronghold of my life[b]; of whom shall I be afraid?
translation:
  language: hi
  text: 'दाऊद का भजन[a]।


    याहवे[b] मेरी ज्योति और मेरा उद्धार है;

    मैं किससे डरूँ?


    याहवे मेरे जीवन का दृढ़ गढ़ है;

    मैं किससे भयभीत होऊँ?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शीर्षक का हिब्रू वाक्यांश “ले-दाविद” दाऊद द्वारा रचित, दाऊद से संबंधित, या दाऊद के लिए—इनमें से किसी अर्थ का संकेत दे सकता है। “भजन” शब्द स्पष्टता के लिए जोड़ा गया है।
    reason: alternative_reading
  - marker: b
    text: “याहवे” हिब्रू יהוה में लिखा परमेश्वर का व्यक्तिगत नाम है; इसे कभी-कभी “यहोवा” या परंपरागत रूप से “प्रभु” कहा जाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: לְדָוִד
  choice: दाऊद का भजन
  rationale: भजन-संग्रह के शीर्षक के रूप में स्वाभाविक हिन्दी के लिए ‘भजन’ स्पष्टतः जोड़ा गया है। לְ उपसर्ग रचनाकार, संबंध या समर्पण का संकेत दे सकता है; इसलिए मुख्य पाठ में पारंपरिक ‘दाऊद का’ रखा गया और अस्पष्टता पादटिप्पणी में सुरक्षित की गई।
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत नाम יהוה को किसी उपाधि से बदलने के बजाय प्रचलित विद्वत्तापूर्ण लिप्यंतरण ‘याहवे’ के रूप में रखा गया है।
- source_word: אוֹרִי
  choice: मेरी ज्योति
  rationale: मूल रूपक ‘मेरी ज्योति’ हिन्दी में स्पष्ट और काव्यात्मक है, इसलिए उसे मार्गदर्शन या आशा जैसे अर्थ से व्याख्यायित नहीं किया गया।
- source_word: וְיִשְׁעִי
  choice: और मेरा उद्धार
  rationale: יֵשַׁע बचाव या छुटकारे को दर्शाता है। ‘उद्धार’ व्यापक अर्थ और धार्मिक-काव्यात्मक प्रयोग दोनों को बनाए रखता है।
- source_word: מִמִּי אִירָא
  choice: मैं किससे डरूँ?
  rationale: हिब्रू का शाब्दिक ‘किससे’ हिन्दी में भी स्वाभाविक है। अपूर्ण क्रिया यहाँ आत्मविश्वास से भरा आलंकारिक प्रश्न व्यक्त करती है।
- source_word: מָעוֹז חַיַּי
  choice: मेरे जीवन का दृढ़ गढ़
  rationale: מָעוֹז शक्ति और सुरक्षा देने वाले सुरक्षित स्थान को सूचित करता है। ‘दृढ़ गढ़’ रक्षात्मक रूपक को बनाए रखता है और חַיַּי के संबंध को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: מִמִּי אֶפְחָד
  choice: मैं किससे भय खाऊँ?
  rationale: פחד डर या आतंक का भाव रखता है। ‘भय खाऊँ’ पहले प्रश्न के समानांतर रहते हुए क्रियात्मक भिन्नता को भी सुरक्षित रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में वाचा का व्यक्तिगत नाम सीधे आया है। ‘याहवे’ उसे उपाधि से प्रतिस्थापित किए बिना प्रस्तुत करता है।
- issue: לְדָוִד शीर्षक का संबंध
  choice: दाऊद का भजन
  alternative: दाऊद द्वारा रचित भजन; दाऊद के लिए भजन
  rationale: לְדָוִד को केवल लेखकत्व या केवल समर्पण मानना मूल की संभावित व्यापकता को सीमित कर देगा। मुख्य पाठ में पारंपरिक संक्षिप्त रूप और पादटिप्पणी में विकल्प दिए गए हैं।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, काव्यात्मक किंतु सामान्य पाठक के लिए सहज रखी गई है। दोनों आलंकारिक प्रश्नों की समानांतर रचना और ‘ज्योति’ तथा ‘गढ़’ के मूल रूपक सुरक्षित हैं।
