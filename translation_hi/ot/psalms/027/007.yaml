source:
  edition: WLC
  text: שְׁמַע יְהוָ֖ה קוֹלִ֥/י אֶקְרָ֗א וְ/חָנֵּ֥/נִי וַ/עֲנֵֽ/נִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/027/007.yaml
  text: Hear[a], O Yahweh, when I cry aloud[b]; be gracious to me and answer me.
translation:
  language: hi
  text: हे याहवे, जब मैं पुकारूँ, तब मेरी आवाज़ सुन[a]; मुझ पर अनुग्रह कर[b] और मुझे उत्तर दे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक रूप में: “हे याहवे, मेरी आवाज़ सुन—जब मैं पुकारता हूँ।”'
    reason: इब्रानी के शब्दक्रम और ‘मेरी आवाज़’ की ठोस अभिव्यक्ति का अधिक शाब्दिक विकल्प बताना।
  - marker: b
    text: इसका अनुवाद “मुझ पर कृपा कर” या परंपरागत रूप से “मुझ पर दया कर” भी हो सकता है।
    reason: חנן के निकटवर्ती हिंदी अनुवाद-विकल्पों को स्पष्ट करना।
lexical_decisions:
- source_word: שְׁמַע
  choice: सुन
  rationale: यह שׁמע का पुल्लिंग एकवचन आज्ञार्थक रूप है और ध्यान देकर सुनने की सीधी विनती व्यक्त करता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी पाठ में परमेश्वर का विशिष्ट वाचायी नाम है; इसे उपाधि से बदलने के बजाय देवनागरी में लिप्यंतरित किया गया है।
- source_word: קוֹלִי
  choice: मेरी आवाज़
  rationale: קוֹל का सामान्य अर्थ ‘आवाज़’ है। ‘मेरी आवाज़ सुन’ इब्रानी की ठोस अभिव्यक्ति को बनाए रखता है।
- source_word: אֶקְרָא
  choice: जब मैं पुकारूँ
  rationale: קרא का यह प्रथम पुरुष एकवचन अपूर्ण रूप परमेश्वर को पुकारने का भाव रखता है। प्रसंग में ‘जब मैं पुकारूँ’ आज्ञार्थक विनती के साथ स्वाभाविक संबंध व्यक्त करता है।
- source_word: וְחָנֵּנִי
  choice: मुझ पर अनुग्रह कर
  rationale: חנן अनुग्रह या कृपापूर्ण पक्ष दिखाने की विनती है। ‘अनुग्रह कर’ इसे ‘दया कर’ की अपेक्षा अधिक विशिष्ट रूप से व्यक्त करता है।
- source_word: וַעֲנֵנִי
  choice: मुझे उत्तर दे
  rationale: ענה यहाँ प्रार्थना के प्रत्युत्तर में जवाब देने के अर्थ में है; ‘उत्तर दे’ सीधा और स्वाभाविक अनुवाद है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: प्रभु
  rationale: मूल पाठ में सामान्य उपाधि नहीं, चतुरक्षरीय विशिष्ट नाम יְהוָה है। ‘याहवे’ इस भेद को सुरक्षित रखता है।
- issue: חנן में अनुग्रह और दया का अर्थ-संबंध
  choice: मुझ पर अनुग्रह कर
  alternative: मुझ पर दया कर
  rationale: दोनों भाव प्रसंग में संभव हैं, पर חנן मुख्यतः कृपापूर्ण अनुग्रह या पक्ष दिखाने की विनती करता है; इसलिए ‘अनुग्रह’ अधिक निकट है।
translation_notes:
  register: आधुनिक मानक हिंदी में प्रार्थनापूर्ण, गरिमामय और सहज शैली रखी गई है। ‘मेरी आवाज़ सुन’ मूल की ठोस अभिव्यक्ति को बचाता है, जबकि ‘जब मैं पुकारूँ’ हिंदी में वाक्य-संबंध को स्वाभाविक बनाता है।
