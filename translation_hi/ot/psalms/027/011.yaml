  edition: WLC
  text: ה֤וֹרֵ֥/נִי יְהוָ֗ה דַּ֫רְכֶּ֥/ךָ וּ֭/נְחֵ/נִי בְּ/אֹ֣רַח מִישׁ֑וֹר לְ֝מַ֗עַן שׁוֹרְרָֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/027/011.yaml
  text: Teach me your way[a], O Yahweh, and lead me on a level path because of my enemies.
translation:
  language: hi
  text: 'हे याहवे, मुझे अपना मार्ग सिखा,

    और मेरे शत्रुओं[a] के कारण मुझे समतल पथ पर ले चल।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उन लोगों के कारण जो मुझ पर बैरभाव से नज़र लगाए रहते हैं।” इब्रानी शब्द शत्रुओं को दर्शा सकता है, विशेषकर ऐसे विरोधियों को जो घात लगाए हों या भजनकार के विरुद्ध अवसर की ताक में हों।
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹרֵנִי
  choice: मुझे ... सिखा
  rationale: हिफ़ील रूप का मुख्य अर्थ ‘सिखाना/शिक्षा देना’ है। प्रार्थना के सीधे संबोधन में ‘सिखा’ स्वाभाविक है और केवल ‘दिखा’ की अपेक्षा शिक्षण का भाव सुरक्षित रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत नाम के रूप में चतुरक्षरीय नाम का देवनागरी लिप्यंतरण किया गया है; इसे किसी उपाधि से प्रतिस्थापित नहीं किया गया।
- source_word: דַּרְכֶּךָ
  choice: अपना मार्ग
  rationale: דֶּרֶךְ वास्तविक पथ के साथ जीवन-आचरण या रीति का संकेत भी दे सकता है। ‘अपना मार्ग’ इन दोनों आयामों को खुला रखता है।
- source_word: וּנְחֵנִי
  choice: मुझे ... ले चल
  rationale: נחה का अर्थ अगुवाई करना या मार्ग दिखाते हुए ले चलना है। ‘ले चल’ पथ के गतिशील बिंब को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: בְּאֹרַח מִישׁוֹר
  choice: समतल पथ पर
  rationale: מִישׁוֹר मूलतः समतल भूमि को दर्शाता है और उससे सीधाई या खराई का भाव भी निकल सकता है। ‘समतल पथ’ ठोस बिंब को प्राथमिकता देते हुए निहित नैतिक अर्थ को बाधित नहीं करता।
- source_word: לְמַעַן
  choice: के कारण
  rationale: यहाँ शत्रुतापूर्ण विरोधियों की उपस्थिति उस प्रार्थना का कारण या प्रसंग बताती है। ‘के कारण’ हिन्दी में संक्षिप्त और स्वाभाविक है।
- source_word: שׁוֹרְרָי
  choice: मेरे शत्रुओं
  rationale: यह शब्द विरोधियों को दर्शाता है और इसमें घात लगाकर या बैरभाव से अवसर देखते रहने वालों का विशेष भाव भी हो सकता है। मुख्य पाठ में स्पष्ट सामान्य अर्थ रखा गया और सूक्ष्मता पादटिप्पणी में दी गई।
theological_decisions:
- issue: יְהוָה परमेश्वर के नाम का अनुवाद
  choice: याहवे
  alternative: यहोवा
  rationale: मूल पाठ के व्यक्तिगत नाम को उपाधि में बदलने के बजाय उसके प्रचलित विद्वत्तापूर्ण उच्चारण का देवनागरी लिप्यंतरण किया गया है।
- issue: מִישׁוֹר का स्थानिक और नैतिक भाव
  choice: समतल
  alternative: सीधा / खरा
  rationale: पथ के साथ इसका प्राथमिक ठोस बिंब ‘समतल’ है; फिर भी सन्दर्भ में सही और निष्कलंक चाल की सम्भावित नैतिक प्रतिध्वनि बनी रहती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और प्रार्थनात्मक रखी गई है। एकवचन आत्मीय संबोधन के अनुरूप ‘सिखा’ और ‘ले चल’ प्रयुक्त हैं। काव्यात्मक समानांतरता बनाए रखने के लिए पद को दो पंक्तियों में रखा गया है।
