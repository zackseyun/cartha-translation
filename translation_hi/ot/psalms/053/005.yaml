id: PSA.53.5
reference: Psalms 53:5
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: שָׁ֤ם פָּֽחֲדוּ פַחַד֮ לֹא הָ֪יָה֫ פָ֥חַד כִּֽי אֱלֹהִ֗ים פִּ֭זַּר עַצְמ֣וֹת חֹנָ֑/ךְ הֱ֝בִשֹׁ֗תָה כִּֽי אֱלֹהִ֥ים מְאָסָֽ/ם׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/053/005.yaml
  text: There they were in great fear[a], where there was no fear; for God scattered the bones of the one encamping against you. You put them to shame[c][b], for God rejected them.
translation:
  language: hi
  text: वहाँ वे बहुत डर गए[a], जहाँ कोई भय न था; क्योंकि परमेश्वर ने तेरे विरुद्ध डेरा डालनेवाले[b] की हड्डियाँ तितर-बितर कर दीं। तूने उन्हें लज्जित किया[c], क्योंकि परमेश्वर ने उन्हें ठुकरा दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक शब्दशः: “वे भय से भयभीत हुए।” इब्रानी में एक ही मूल की क्रिया और संज्ञा साथ रखकर भय की तीव्रता पर जोर दिया गया है।'
    reason: lexical_alternative
  - marker: b
    text: इसका अनुवाद “तेरे चारों ओर डेरा डालनेवाले” या “तेरे घेरनेवाले” भी हो सकता है। यहाँ प्रसंग शत्रुतापूर्ण घेराबंदी का संकेत देता है।
    reason: lexical_alternative
  - marker: c
    text: पद पहले परमेश्वर के विषय में कहता है—“परमेश्वर ने”—और फिर अचानक सीधे संबोधन में कहता है—“तूने।” मूल का यह काव्यात्मक परिवर्तन अनुवाद में बनाए रखा गया है।
    reason: alternative_reading
lexical_decisions:
- source_word: שָׁם
  choice: वहाँ
  rationale: यह स्थानवाचक क्रियाविशेषण दृश्य को अचानक सामने लाता है; सरल ‘वहाँ’ उसके काव्यात्मक बल को बनाए रखता है।
- source_word: פָּחֲדוּ פַחַד
  choice: वे बहुत डर गए
  rationale: सजातीय क्रिया और संज्ञा का प्रयोग भय की तीव्रता पर बल देता है। हिंदी में ‘बहुत डर गए’ स्वाभाविक ढंग से वही जोर व्यक्त करता है।
- source_word: לֹא הָיָה פָחַד
  choice: जहाँ कोई भय न था
  rationale: यह निकट, संक्षिप्त अनुवाद ‘भय’ के वास्तविक कारण या आशंका के अभाव को व्यक्त करता है और मूल की पुनरुक्ति बनाए रखता है।
- source_word: פִּזַּר
  choice: तितर-बितर कर दीं
  rationale: पियेल रूप बलपूर्वक बिखेरने का भाव देता है; हड्डियों के संदर्भ में यह हिंदी प्रयोग स्पष्ट और स्वाभाविक है।
- source_word: חֹנָךְ
  choice: तेरे विरुद्ध डेरा डालनेवाले
  rationale: חנה का मूल अर्थ ‘डेरा डालना’ है। बिखरी हड्डियों और अपमान के युद्ध-संदर्भ में यहाँ शत्रुतापूर्ण घेराबंदी या सैन्य पड़ाव अभिप्रेत है। एकवचन कृदंत को बनाए रखा गया है।
- source_word: הֱבִשֹׁתָה
  choice: तूने उन्हें लज्जित किया
  rationale: בוש का हिफ़ील रूप ‘लज्जित करना’ या ‘अपमानित करना’ बताता है। पूर्ण क्रिया को भूतकाल में और दूसरे पुरुष के सीधे संबोधन को ज्यों का त्यों रखा गया है।
- source_word: מְאָסָם
  choice: उन्हें ठुकरा दिया
  rationale: מאס अस्वीकार या तिरस्कारपूर्वक ठुकराने का अर्थ देता है। ‘ठुकरा दिया’ स्पष्ट है और अनावश्यक सिद्धांतगत अर्थ नहीं जोड़ता।
theological_decisions:
- issue: पद के भीतर पुरुष और संबोधन का अचानक परिवर्तन
  choice: पहले परमेश्वर के विषय में तीसरे पुरुष में कहना, फिर ‘तूने’ के द्वारा सीधे संबोधित करना
  alternative: सभी कथनों को तीसरे पुरुष में नियमित करके ‘परमेश्वर ने उन्हें लज्जित किया’ कहना; अथवा ‘तूने’ को सिय्योन/यरूशलेम का संबोधन मानना
  rationale: मसोराई इब्रानी में पहले ‘परमेश्वर ने’ और फिर दूसरे पुरुष की क्रिया आती है। इस काव्यात्मक परिवर्तन को सरल बनाकर मिटाया नहीं गया। अगले वाक्यांश ‘क्योंकि परमेश्वर ने उन्हें ठुकरा दिया’ के कारण परमेश्वर की ओर सीधा संबोधन संभव और प्रसंगानुकूल है, यद्यपि हिंदी ‘तू’ मूल में संभावित संबोधन-तनाव को पूरी तरह बंद नहीं करता।
- issue: חֹנָךְ में शिविर लगानेवाले का संबंध
  choice: शत्रुतापूर्ण अर्थ—‘तेरे विरुद्ध डेरा डालनेवाले’
  alternative: ‘तेरे चारों ओर डेरा डालनेवाले’ या अधिक संक्षेप में ‘तेरे घेरनेवाले’
  rationale: हड्डियों के तितर-बितर किए जाने, लज्जित होने और ठुकराए जाने का प्रसंग किसी तटस्थ या रक्षक शिविर के बजाय शत्रु की छावनी का संकेत देता है।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। ‘तेरे/तूने’ काव्यात्मक सीधे संबोधन को सहजता से व्यक्त करते हैं। ‘बहुत डर गए’ सजातीय इब्रानी पदबंध का स्वाभाविक हिंदी रूप है, जबकि पादटिप्पणी उसका अधिक शब्दशः रूप देती है।
