source:
  edition: WLC
  text: הֲ/לֹ֥א יָדְעוּ֮ פֹּ֤עֲלֵ֫י אָ֥וֶן אֹכְלֵ֣י עַ֭מִּ/י אָ֣כְלוּ לֶ֑חֶם אֱ֝לֹהִ֗ים לֹ֣א קָרָֽאוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/053/004.yaml
  text: Do not the workers of wickedness know—those who eat up my people as they eat bread? They do not call on God[a][b][c].
translation:
  language: hi
  text: क्या बुराई करनेवाले[a] नहीं जानते—वे जो मेरी प्रजा को[b][c] ऐसे खा जाते हैं जैसे रोटी खाते हैं? वे परमेश्वर को नहीं पुकारते।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “बुराई करनेवाले” का अनुवाद “कुकर्मी” भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: 'शाब्दिक रूप से: “मेरी प्रजा को खानेवाले; वे रोटी खाते हैं।” भाव यह है कि वे मेरी प्रजा को उतनी ही सहजता से निगल जाते हैं जितनी सहजता से रोटी खाते हैं।'
    reason: lexical_alternative
  - marker: c
    text: “मेरी प्रजा” को परमेश्वर की वाणी या भजनकार की वाणी—दोनों रूपों में समझा जा सकता है; इब्रानी में यहाँ वक्ता की पहचान स्पष्ट नहीं है।
    reason: alternative_reading
lexical_decisions:
- source_word: הֲלֹא יָדְעוּ
  choice: क्या ... नहीं जानते
  rationale: हֲלֹא एक आलंकारिक प्रश्न प्रस्तुत करता है, जिसका अपेक्षित उत्तर सकारात्मक है। यָדְעוּ का सामान्य, चरित्र-वर्णनात्मक भाव आधुनिक हिन्दी में वर्तमान काल से स्वाभाविक रूप से व्यक्त होता है।
- source_word: פֹּעֲלֵי אָוֶן
  choice: बुराई करनेवाले
  rationale: यह रचना बुराई अथवा अनर्थ करनेवालों को दर्शाती है। चुना हुआ रूप मूल की क्रियात्मक छवि बनाए रखते हुए सामान्य पाठक के लिए स्पष्ट है।
- source_word: אֹכְלֵי עַמִּי
  choice: वे जो मेरी प्रजा को ... खा जाते हैं
  rationale: मूल में खाने की सजीव उपमा है, जो हिंसक शोषण को दर्शाती है। “खा जाते हैं” हिन्दी में इस रूपक की तीव्रता और स्वाभाविकता दोनों बनाए रखता है।
- source_word: אָכְלוּ לֶחֶם
  choice: जैसे रोटी खाते हैं
  rationale: इब्रानी में दोनों वाक्यांश साथ रखकर प्रजा को खाने की तुलना साधारण भोजन से की गई है। हिन्दी में “जैसे” जोड़ना निहित तुलना को स्पष्ट करता है, बिना उसका आशय बदलने के।
- source_word: אֱלֹהִים
  choice: परमेश्वर
  rationale: यहाँ रूप व्याकरणतः बहुवचन जैसा दिखता है, पर सन्दर्भ में इस्राएल के एक परमेश्वर को सूचित करता है; “परमेश्वर” मानक हिन्दी रूप है।
- source_word: לֹא קָרָאוּ
  choice: नहीं पुकारते
  rationale: इस सन्दर्भ में קרא परमेश्वर को सहायता या आराधना के लिए पुकारने का भाव रखता है। वर्तमान काल दुष्टों के सामान्य आचरण को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: “मेरी प्रजा” में वक्ता की पहचान
  choice: “मेरी प्रजा” को यथावत रखा गया है और वक्ता की पहचान मुख्य पाठ में निश्चित नहीं की गई।
  alternative: इसे स्पष्ट रूप से परमेश्वर की वाणी या भजनकार की वाणी मानना।
  rationale: प्रथम पुरुष एकवचन प्रत्यय स्पष्ट है, पर इस पंक्ति में वक्ता की पहचान स्पष्ट नहीं की गई है। अनुवाद मूल की इस वास्तविक अस्पष्टता को बनाए रखता है।
- issue: अन्तिम उपवाक्य का प्रश्न से सम्बन्ध
  choice: “वे परमेश्वर को नहीं पुकारते” को कथन के रूप में अलग वाक्य बनाया गया।
  alternative: 'इसे पूरे आलंकारिक प्रश्न के भीतर रखना: “... और परमेश्वर को नहीं पुकारते?”'
  rationale: इब्रानी व्यंजन-पाठ दोनों प्रकार के विराम की अनुमति देता है; मसोराई लहजे और विचार-प्रवाह के अनुरूप इसे दुष्टों के आचरण का निष्कर्षात्मक कथन रखा गया है, जबकि आशयगत तनाव नहीं बदला।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, सहज और गरिमापूर्ण रखी गई है। “खा जाते हैं” मूल के तीखे भोजन-रूपक को बनाए रखता है; “भक्षण करते हैं” की अपेक्षा यह साधारण पाठक के लिए अधिक स्वाभाविक है।
