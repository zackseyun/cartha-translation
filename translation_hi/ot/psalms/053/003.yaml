  text: כֻּלּ֥/וֹ סָג֮ יַחְדָּ֪ו נֶ֫אֱלָ֥חוּ אֵ֤ין עֹֽשֵׂה ט֑וֹב אֵ֝֗ין גַּם אֶחָֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/053/003.yaml
  text: All of them have turned aside; together they have become corrupt; there is none who does good[a], not even one.
translation:
  language: hi
  text: वे सब भटक गए हैं; सब के सब दूषित हो गए हैं[a]। भलाई करने वाला कोई नहीं, एक भी नहीं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मलिन हो गए हैं।” इब्रानी क्रिया नैतिक रूप से कलुषित या घृणित हो जाने का भाव भी दे सकती है।
    reason: नֶאֱלָחוּ के lexical alternative को संबंधित पद पर स्पष्ट करना।
lexical_decisions:
- source_word: כֻּלּוֹ
  choice: वे सब
  rationale: यह रूप पूरे समूह को सामूहिक रूप से दर्शाता है; ‘वे सब’ आधुनिक हिन्दी में संक्षिप्त और स्वाभाविक है।
- source_word: סָג
  choice: भटक गए हैं
  rationale: क्रिया सही मार्ग से हट जाने या मुड़ जाने का भाव रखती है। ‘भटक गए हैं’ नैतिक विचलन को स्वाभाविक हिन्दी में व्यक्त करता है, बिना ‘धर्मत्याग’ जैसा अतिरिक्त विशिष्ट अर्थ जोड़े।
- source_word: יַחְדָּו
  choice: मिलकर
  rationale: यह सामूहिकता सूचित करता है। ‘मिलकर’ यहाँ समूह के एकसाथ उसी दशा में आ जाने का भाव स्वाभाविक रूप से देता है।
- source_word: נֶאֱלָחוּ
  choice: भ्रष्ट हो गए हैं
  rationale: निफ़अल रूप दूषित, बिगड़ा या नैतिक रूप से घृणित हो जाने का भाव देता है। ‘भ्रष्ट हो गए हैं’ प्रसंग का नैतिक अर्थ स्पष्ट करता है।
- source_word: אֵין עֹשֵׂה טוֹב
  choice: भलाई करने वाला कोई नहीं
  rationale: अस्तित्ववाचक निषेध और कृदन्त को हिन्दी में स्वाभाविक सम्बन्धवाचक अभिव्यक्ति के रूप में रखा गया है; ‘भलाई’ व्यापक नैतिक अर्थ को बनाए रखती है।
- source_word: גַּם אֶחָד
  choice: एक भी नहीं
  rationale: यह पहले निषेध को तीव्र करता है। ‘एक भी नहीं’ संक्षिप्त, प्रबल और आधुनिक हिन्दी में सहज है।
theological_decisions:
- issue: भजन की भर्त्सना में मानवीय भ्रष्टता का दायरा
  choice: 'पद की व्यापक भाषा को यथावत रखा गया है: ‘वे सब... कोई नहीं, एक भी नहीं।’'
  alternative: इसे केवल निकटवर्ती प्रसंग में वर्णित दुष्ट लोगों तक सीमित समझना।
  rationale: इब्रानी में כֻּלּוֹ, אֵין और גַּם אֶחָד व्यापक और प्रबल अभिव्यक्तियाँ हैं। अनुवाद इसी कथन को सुरक्षित रखता है, पर इससे आगे कोई व्यवस्थित सिद्धान्त आरोपित नहीं करता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, काव्यात्मक गरिमा और स्पष्ट समान्तरता के साथ रखी गई है। ‘भटक गए हैं’ और ‘भ्रष्ट हो गए हैं’ क्रमशः मार्ग से विचलन और नैतिक दूषण के अलग-अलग बिंब बनाए रखते हैं। कोई पादटिप्पणी नहीं दी गई, क्योंकि अंग्रेज़ी परत का पादटिप्पणी-चिह्न अर्थ की दृष्टि से गलत स्थान पर जुड़ा प्रतीत होता है; נֶאֱלָחוּ का वैकल्पिक अर्थ मुख्य पाठ में ‘भ्रष्ट’ से पर्याप्त रूप से समाहित है।
