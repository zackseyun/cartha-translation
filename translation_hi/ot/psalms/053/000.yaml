source:
  edition: WLC
  text: לַ/מְנַצֵּ֥חַ עַֽל מָחֲלַ֗ת מַשְׂכִּ֥יל לְ/דָוִֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/053/000.yaml
  text: 'For the choir director: according to Mahalath[a]. A Maskil[b] of David[c].'
translation:
  language: hi
  text: 'संगीत-निर्देशक के लिए: महलत[a] के अनुसार। दाऊद का[c] एक मश्कील[b]।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “महलत” संभवतः किसी धुन का नाम या संगीत अथवा उपासना-संबंधी तकनीकी शब्द है; इसका अर्थ अनिश्चित है।
    reason: lexical_alternative
  - marker: b
    text: “मश्कील” भजन-शीर्षकों में प्रयुक्त एक तकनीकी शब्द है; संभवतः यह शिक्षाप्रद या मननपरक रचना को सूचित करता है।
    reason: lexical_alternative
  - marker: c
    text: “दाऊद का” के लिए प्रयुक्त हिब्रू पद रचनाकार होने, दाऊद से संबंध, उन्हें समर्पण या उनके संग्रह से संबद्धता को सूचित कर सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: संगीत-निर्देशक के लिए
  rationale: भजन-शीर्षकों में यह पद संगीत-प्रस्तुति की देखरेख करने वाले व्यक्ति को संबोधित करता है। यह आधुनिक और स्पष्ट हिंदी है तथा केवल गायन-मंडली तक अर्थ को सीमित नहीं करता।
- source_word: עַל
  choice: के अनुसार
  rationale: संगीत-संबंधी शीर्षकों में यह किसी धुन, शैली या प्रस्तुति-निर्देश का परिचय दे सकता है। यह अनुवाद उस तकनीकी संबंध को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: מָחֲלַת
  choice: महलत
  rationale: इसका आशय अनिश्चित है और यह संभवतः धुन का नाम या कोई संगीत अथवा उपासना-संबंधी तकनीकी शब्द है; इसलिए अनुमानित अर्थ देने के बजाय लिप्यंतरण रखा गया है।
- source_word: מַשְׂכִּיל
  choice: मश्कील
  rationale: यह भजन-शीर्षकों का तकनीकी पद है, जिसका सटीक अर्थ विवादित है। लिप्यंतरण झूठी निश्चितता से बचता है; संभावित अर्थ पादटिप्पणी में दिया गया है।
- source_word: לְדָוִד
  choice: दाऊद का
  rationale: לְ उपसर्ग यहाँ रचनाकार, संबंध, समर्पण या संग्रह-संबद्धता सूचित कर सकता है। ‘दाऊद का’ इस बहुअर्थकता को ‘दाऊद द्वारा’ की अपेक्षा बेहतर सुरक्षित रखता है।
theological_decisions:
- issue: भजन-शीर्षक की पाठगत स्थिति और दाऊद से संबंध
  choice: शीर्षक को पाठ का अंग मानकर अनूदित किया गया और לְדָוִד को ‘दाऊद का’ कहा गया।
  alternative: इसे स्पष्ट रूप से ‘दाऊद द्वारा रचित’ कहना, या शीर्षक को अनूदित पाठ से बाहर रखना।
  rationale: हिब्रू पाठ में शीर्षक पद का अंग है। ‘दाऊद का’ लेखकीयता की संभावना को रहने देता है, पर हिब्रू से अधिक निश्चित दावा नहीं करता।
translation_notes:
  register: भाषा आधुनिक, संक्षिप्त और गरिमापूर्ण रखी गई है। अनिश्चित तकनीकी पदों ‘महलत’ और ‘मश्कील’ का लिप्यंतरण किया गया है तथा उनकी संभावित व्याख्या पादटिप्पणियों में दी गई है।
