base_translation:
  language: en
  yaml_path: translation/ot/psalms/053/006.yaml
  text: Oh[a], that the salvation of Israel would come out of Zion! When God restores the fortunes of his people, let Jacob rejoice; let Israel be glad.
translation:
  language: hi
  text: काश, सिय्योन से इस्राएल का उद्धार आ जाए! जब परमेश्वर अपनी प्रजा की दशा फिर से सँवारेगा[a], तब याकूब मगन हो और इस्राएल आनन्दित हो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अपनी प्रजा को बंधुआई से वापस ले आएगा,” अथवा “अपनी बंधुआ प्रजा को वापस ले आएगा।” इब्रानी मुहावरा सामान्य रूप से दुर्दशा से पुनर्स्थापना को भी दर्शा सकता है, जिसमें प्रायः बंधुआई से लौटना सम्मिलित होता है।
    reason: alternative_reading
lexical_decisions:
- source_word: מִי יִתֵּן
  choice: काश, ... आ जाए
  rationale: यह इब्रानी मुहावरा शाब्दिक प्रश्न नहीं, बल्कि उत्कट इच्छा प्रकट करता है; ‘काश’ आधुनिक हिन्दी में उस कामनात्मक भाव को स्वाभाविक रूप से व्यक्त करता है।
- source_word: מִצִּיּוֹן
  choice: सिय्योन से
  rationale: מִן स्रोत या उद्गम दर्शाता है; हिन्दी में ‘से’ संक्षिप्त और स्वाभाविक है।
- source_word: יְשֻׁעוֹת יִשְׂרָאֵל
  choice: इस्राएल का उद्धार
  rationale: रूप की दृष्टि से संज्ञा बहुवचन है, पर यहाँ अमूर्त अथवा गहन अर्थ में सामूहिक छुटकारे को सूचित करती है; हिन्दी में एकवचन ‘उद्धार’ स्वाभाविक है।
- source_word: בְּשׁוּב אֱלֹהִים שְׁבוּת עַמּוֹ
  choice: जब परमेश्वर अपनी प्रजा की दशा बहाल करेगा
  rationale: בְּ के साथ infinitive construct को कालवाचक ‘जब’ के रूप में लिया गया है। שׁוּב שְׁבוּת व्यापक रूप से विपत्ति पलटने और पुनर्बहाली का मुहावरा है; ‘दशा बहाल करेगा’ उसका सामान्य अर्थ देता है, जबकि बन्धुआई से लौटाने की सम्भावना पादटिप्पणी में रखी गई है।
- source_word: יָגֵל יַעֲקֹב
  choice: याकूब मगन हो
  rationale: yiqtol को आरम्भिक कामना के अनुरूप इच्छासूचक रूप में रखा गया है; ‘मगन हो’ आनन्द के भाव को गरिमापूर्ण और काव्यात्मक हिन्दी में व्यक्त करता है।
- source_word: יִשְׂמַח יִשְׂרָאֵל
  choice: इस्राएल आनन्दित हो
  rationale: समानान्तर पंक्ति में इच्छासूचक अर्थ बनाए रखते हुए पहले क्रियापद से हल्की शब्दगत भिन्नता सुरक्षित की गई है।
theological_decisions:
- issue: שׁוּב שְׁבוּת की पुनर्बहाली सम्बन्धी उक्ति
  choice: अपनी प्रजा की दशा बहाल करेगा
  alternative: अपनी प्रजा को बन्धुआई से लौटा लाएगा; अपनी बन्धुआ प्रजा को फिर ले आएगा
  rationale: यह इब्रानी उक्ति कभी वास्तविक बन्धुआई और वापसी को दर्शाती है, पर इसका अर्थ अधिक व्यापक रूप से संकट या दुर्दशा को पलटना भी हो सकता है। मुख्य पाठ में व्यापक अर्थ रखा गया और अधिक शाब्दिक सम्भावनाएँ पादटिप्पणी में दी गईं, ताकि अस्पष्टता अनुचित रूप से समाप्त न हो।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘काश’ मूल की उत्कट कामना को व्यक्त करता है; ‘मगन हो / आनन्दित हो’ काव्यात्मक समानान्तरता में अर्थगत विविधता बनाए रखते हैं। सभी नाम प्रचलित हिन्दी बाइबलीय रूपों में दिए गए हैं।
