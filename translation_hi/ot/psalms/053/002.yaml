  text: God looks down from heaven on the children of man to see whether there is anyone who has understanding[a], who seeks God.
translation:
  language: hi
  text: 'परमेश्वर स्वर्ग से मनुष्यों[a] पर दृष्टि डालता है,


    यह देखने के लिए कि क्या कोई समझदार है,


    जो परमेश्वर को खोजता है।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, ‘मनुष्य की सन्तानें’; यह इब्रानी अभिव्यक्ति मनुष्यों के लिए सामूहिक रूप से प्रयुक्त होती है।
    reason: मूल इब्रानी मुहावरे का शाब्दिक रूप और उसका सामूहिक अर्थ बताना।
lexical_decisions:
- source_word: אֱלֹהִים
  choice: परमेश्वर
  rationale: इस प्रसंग में रूप व्याकरणतः बहुवचन होते हुए भी इस्राएल के एकमात्र परमेश्वर को सूचित करता है; आधुनिक हिन्दी में ‘परमेश्वर’ स्वाभाविक और स्पष्ट है।
- source_word: מִשָּׁמַיִם
  choice: स्वर्ग से
  rationale: इब्रानी बहुवचन रूप यहाँ आकाशीय निवास-स्थान के अर्थ में है; ‘स्वर्ग से’ हिन्दी में स्वाभाविक है और ऊपर से देखने की छवि बनाए रखता है।
- source_word: הִשְׁקִיף
  choice: दृष्टि करता है
  rationale: क्रिया ऊँचे स्थान से नीचे की ओर ध्यानपूर्वक देखने को व्यक्त करती है। काव्यात्मक सामान्य वर्तमान मूल के सजीव निरीक्षण को स्वाभाविक हिन्दी में प्रस्तुत करता है।
- source_word: בְּנֵי אָדָם
  choice: मनुष्यों
  rationale: यह सामूहिक इब्रानी मुहावरा समस्त मानव समुदाय को सूचित करता है। मुख्य पाठ में ‘मनुष्यों’ अर्थ को स्पष्ट और स्वाभाविक रखता है, जबकि शाब्दिक रूप पादटिप्पणी में दिया गया है।
- source_word: מַשְׂכִּיל
  choice: समझ रखनेवाला
  rationale: यह कृदन्त केवल बौद्धिक क्षमता नहीं, बल्कि विवेकपूर्ण समझ रखनेवाले व्यक्ति को दर्शाता है; यह अनुवाद उस व्यापक अर्थ को खुला रखता है।
- source_word: דֹּרֵשׁ
  choice: खोजता है
  rationale: यह कृदन्त परमेश्वर की ओर लगातार उन्मुख होकर उसे खोजने की प्रवृत्ति दर्शाता है; ‘खोजता है’ सरल और धर्मवैचारिक रूप से अनावश्यक विस्तार से मुक्त है।
theological_decisions:
- issue: בְּנֵי אָדָם में אָדָם का सामूहिक अर्थ
  choice: मनुष्यों
  alternative: आदम की सन्तानों
  rationale: मुहावरा मानवजाति को सामूहिक रूप से दर्शाता है। स्वाभाविक हिन्दी के लिए मुख्य पाठ में ‘मनुष्यों’ रखा गया है, पर स्रोत की वंशात्मक अभिव्यक्ति को पादटिप्पणी में सुरक्षित किया गया है।
- issue: מַשְׂכִּיל और דֹּרֵשׁ के बीच संबंध
  choice: ‘समझ रखनेवाला है, जो परमेश्वर को खोजता है’
  alternative: ‘समझ रखनेवाला, परमेश्वर को खोजनेवाला है’
  rationale: इब्रानी में दोनों कृदन्त बिना स्पष्ट संयोजक के आते हैं। सापेक्ष उपवाक्य हिन्दी में स्वाभाविक है और दूसरे गुण को पहले की कठोर परिभाषा बनाए बिना दोनों को एक ही संभावित व्यक्ति से जोड़ता है।
