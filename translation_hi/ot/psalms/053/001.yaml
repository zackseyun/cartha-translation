source:
  edition: WLC
  text: אָ֘מַ֤ר נָבָ֣ל בְּ֭/לִבּ/וֹ אֵ֣ין אֱלֹהִ֑ים הִֽ֝שְׁחִ֗יתוּ וְ/הִֽתְעִ֥יבוּ עָ֝֗וֶל אֵ֣ין עֹֽשֵׂה טֽוֹב־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/053/001.yaml
  text: The fool says in his heart[a], “There is no God.” They are corrupt; they commit abominable injustice; there is no one who does good.
translation:
  language: hi
  text: मूर्ख अपने मन में कहता है, “परमेश्वर है ही नहीं।” वे भ्रष्ट हो गए हैं; उन्होंने घिनौना अन्याय किया है[a]; भलाई करने वाला कोई नहीं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इसका अनुवाद “वे घृणित बुराई करते हैं” या “उन्होंने अपने कामों को घिनौना बना दिया है” भी हो सकता है। इब्रानी में घृणित ढंग से करने या घिनौना बनाने का भाव देने वाली क्रिया के साथ “बुराई/अन्याय” अर्थ वाला संज्ञा-शब्द आया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: נָבָל
  choice: मूर्ख
  rationale: यह शब्द केवल कम बुद्धि वाले व्यक्ति को नहीं, बल्कि नैतिक और परमेश्वर-विरोधी मूर्खता वाले व्यक्ति को दर्शाता है। हिंदी में “मूर्ख” इस पद के स्थापित बाइबलीय और नैतिक अर्थ को स्वाभाविक रूप से व्यक्त करता है।
- source_word: בְּלִבּוֹ
  choice: अपने मन में
  rationale: इब्रानी मुहावरा व्यक्ति के भीतरी विचार और रुझान को दर्शाता है। आधुनिक हिंदी में “अपने मन में” स्वाभाविक है और मूल की आंतरिकता बनाए रखता है।
- source_word: אֵין אֱלֹהִים
  choice: परमेश्वर है ही नहीं
  rationale: यह परमेश्वर के अस्तित्व का स्पष्ट निषेध है। “ही नहीं” कथन के प्रबल निषेध को सहज हिंदी में व्यक्त करता है।
- source_word: הִשְׁחִיתוּ
  choice: वे भ्रष्ट हो गए हैं
  rationale: बहुवचन क्रिया प्रतिनिधि एकवचन “मूर्ख” से ऐसे लोगों के व्यापक वर्ग की ओर बढ़ती है। यह अनुवाद उनकी परिणामी नैतिक दशा को व्यक्त करता है।
- source_word: וְהִתְעִיבוּ עָוֶל
  choice: और घिनौना अन्याय करते हैं
  rationale: क्रिया घृणित या जुगुप्साजनक आचरण का बोध कराती है और עָוֶל नैतिक बुराई अथवा अन्याय को दर्शाता है। यह वाक्यांश दोनों तत्वों को स्पष्ट, स्वाभाविक हिंदी में रखता है।
- source_word: אֵין עֹשֵׂה טוֹב
  choice: भलाई करने वाला कोई नहीं
  rationale: यह मूल की कृदंत-संरचना और भलाई करने वाले के पूर्ण अभाव—दोनों को संक्षिप्त तथा सहज हिंदी में व्यक्त करता है।
theological_decisions:
- issue: प्रतिनिधि एकवचन “मूर्ख” से बहुवचन क्रियाओं की ओर परिवर्तन
  choice: 'पहले वाक्य में एकवचन और अगले वाक्य में बहुवचन रखा गया: “मूर्ख... कहता है”; “वे भ्रष्ट हो गए हैं...”'
  alternative: सभी कथनों को एकवचन करना, अथवा आरंभ से ही “मूर्ख लोग” कहना
  rationale: इब्रानी पाठ स्वयं प्रतिनिधि एकवचन से बहुवचन की ओर बढ़ता है। यह अलंकारिक परिवर्तन एक मूर्ख की छवि से उसी प्रकार के लोगों के पूरे वर्ग की ओर संकेत करता है, इसलिए इसे समतल नहीं किया गया।
- issue: प्रतिनिधि एकवचन का लिंग और आत्मसंदर्भ
  choice: “अपने मन में”
  alternative: “उनके मन में” अथवा केवल “मन में”
  rationale: इब्रानी में एकवचन प्रत्यय है। हिंदी का आत्मवाचक “अपने” एकवचन कर्ता से संबंध बनाए रखता है, किंतु अनावश्यक रूप से लिंग को उभारता नहीं।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। “परमेश्वर” इस्राएली धार्मिक संदर्भ में אֱלֹהִים को स्पष्ट करता है। विरामचिह्न मूल पद की काव्यात्मक तर्क-गति और एकवचन से बहुवचन की ओर बदलाव को उभारते हैं।
