base_translation:
  language: en
  yaml_path: translation/ot/psalms/094/020.yaml
  text: Can a throne of destruction be allied with you[b][a], one that forms trouble by statute?
translation:
  language: hi
  text: क्या विनाश का सिंहासन[a] तेरे साथ संगति कर सकता है—वह, जो विधि के सहारे अनर्थ रचता है?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘उपद्रव का सिंहासन’ अथवा ‘बरबादी का सिंहासन’।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से ‘विधि पर अनर्थ रचता है’; अर्थात वह हानि पहुँचाने के साधन या बहाने के रूप में कानून अथवा आदेश का उपयोग करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲיְחָבְרְךָ
  choice: तेरा साथी हो सकता है
  rationale: חבר का यह रूप किसी के साथ जुड़ने या सहभागी होने का भाव देता है। प्रश्न अलंकारिक है और ऐसे शासन की परमेश्वर के साथ असंगति को बिना अतिरिक्त व्याख्या जोड़े व्यक्त करता है।
- source_word: כִּסֵּא
  choice: सिंहासन
  rationale: यह शब्द शाब्दिक रूप से सिंहासन और लाक्षणिक रूप से शासकीय सत्ता को दर्शाता है; हिन्दी में ‘सिंहासन’ राजनीतिक और न्यायिक बिंब बनाए रखता है।
- source_word: הַוּוֹת
  choice: विनाश
  rationale: बहुवचन संज्ञा विनाशकारी कामों, विपत्तियों या बरबादी की योजनाओं का बोध करा सकती है। ‘विनाश’ इसकी हानिकारक शक्ति को संक्षेप में व्यक्त करता है; अन्य संभव अर्थ पादटिप्पणी में रखे गए हैं।
- source_word: יֹצֵר
  choice: रचता है
  rationale: יצר का मूल भाव आकार देने या गढ़ने का है। ‘रचता है’ उस सजीव बिंब को रखते हुए अन्यायपूर्ण नीति द्वारा अनर्थ उत्पन्न करने का भाव देता है।
- source_word: עָמָל
  choice: अनर्थ
  rationale: यह शब्द कष्ट, दुःख, उत्पीड़न या हानि को सूचित कर सकता है। यहाँ भ्रष्ट शासन द्वारा पैदा की गई हानि के लिए ‘अनर्थ’ स्वाभाविक और पर्याप्त रूप से व्यापक है।
- source_word: עֲלֵי חֹק
  choice: विधि के सहारे
  rationale: शाब्दिक संरचना ‘विधि/नियम पर’ है। ‘विधि के सहारे’ कानून को हानि उत्पन्न करने के साधन या आड़ के रूप में इस्तेमाल करने की संभावना बनाए रखता है, पर उसे पूरी तरह व्याख्यायित नहीं करता।
theological_decisions:
- issue: अन्यायी शासन के साथ परमेश्वर के संबंध पर अलंकारिक प्रश्न
  choice: पद को ऐसे विनाशकारी शासन और परमेश्वर की संगति की असंभवता सूचित करने वाले अलंकारिक प्रश्न के रूप में रखा गया है।
  alternative: इसे अधिक सामान्य रूप से इस प्रश्न के रूप में समझा जा सकता है कि क्या कोई अन्यायी न्यायाधिकारी परमेश्वर के साथ न्यायासन पर बैठ सकता है।
  rationale: ‘सिंहासन’ और प्रश्नवाचक הֲ सत्ता तथा परमेश्वर के बीच संबंध पर केंद्रित हैं। अनुवाद नकारात्मक उत्तर को स्पष्ट कथन में बदलने के बजाय मूल का अलंकारिक तनाव बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और काव्यात्मक-न्यायिक स्वर रखा गया है। ‘तेरा’ भजन की परमेश्वर से सीधी एकवचन संबोधन-शैली को सुरक्षित रखता है। ‘विधि’ कानूनी अर्थ देता है और ‘कानून’ की तुलना में पद्यात्मक पंजी के अनुकूल है।
