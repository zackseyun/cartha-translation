lexical_decisions:
- source_word: בְּרֹב
  choice: जब ... भरमार होती है
  rationale: בְּרֹב का मूल भाव ‘बहुतायत में/बहुलता में’ है। प्रसंग में ‘जब ... भरमार होती है’ उसकी परिस्थितिजन्य छाया को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: שַׂרְעַפַּי
  choice: मेरी चिंताएँ
  rationale: यह शब्द व्याकुल, उलझे या इधर-उधर फैलते विचारों का संकेत देता है। ‘चिंताएँ’ भीतरी मानसिक अशांति को सहज और संक्षिप्त हिन्दी में व्यक्त करता है।
- source_word: בְּקִרְבִּי
  choice: मेरे भीतर
  rationale: यह वाक्यांश मनुष्य के आंतरिक क्षेत्र को दर्शाता है; ‘मेरे भीतर’ स्वाभाविक और अर्थनिष्ठ है।
- source_word: תַּנְחוּמֶיךָ
  choice: आपकी सांत्वनाएँ
  rationale: इब्रानी संज्ञा बहुवचन है। ‘सांत्वनाएँ’ बहुवचन बनाए रखती है और गहरे ढाढ़स तथा दिलासे का गरिमापूर्ण भाव देती है।
- source_word: יְשַׁעַשְׁעוּ
  choice: आनंदित करती हैं
  rationale: क्रिया सुख देने, हर्षित करने या मन को सहलाने का प्रबल भाव रखती है। ‘आनंदित करती हैं’ काव्यात्मक गरिमा और सकारात्मक तीव्रता बनाए रखता है।
- source_word: נַפְשִׁי
  choice: मेरे प्राण
  rationale: נֶפֶשׁ यहाँ व्यक्ति के आंतरिक स्व या समूचे जीवित व्यक्तित्व की ओर संकेत करता है। ‘मेरे प्राण’ हिन्दी भजन-साहित्य में स्वाभाविक है और अर्थ को केवल अमूर्त ‘आत्मा’ तक सीमित नहीं करता।
