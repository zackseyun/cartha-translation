    text: या, “जब मेरे भीतर व्याकुल और उलझे हुए विचार बहुत हो जाते हैं।” इब्रानी संज्ञा परेशान करने वाले, बँटे हुए या शाखाओं की तरह फैलते विचारों का संकेत दे सकती है।
    reason: lexical_alternative
  - marker: b
    text: या, “आपके दिलासे मेरे प्राण को हर्षित करते हैं।” इब्रानी में ‘सांत्वनाएँ’ बहुवचन में है।
