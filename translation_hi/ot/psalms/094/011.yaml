  register: भाषा आधुनिक, संक्षिप्त और काव्यात्मक रखी गई है। सामूहिक אָדָם और उसके बाद के बहुवचन सर्वनाम के कारण ‘मनुष्यों’ चुना गया है; पद की समानांतर और सूक्तिपरक लय सुरक्षित है।
