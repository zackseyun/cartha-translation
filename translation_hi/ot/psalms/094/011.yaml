  text: यहोवा मनुष्य के विचारों को जानता है, कि वे वाष्प हैं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: यहोवा
  rationale: परमेश्वर के विशिष्ट इब्रानी नाम को सामान्य उपाधि में बदलने के बजाय हिन्दी में प्रचलित लिप्यंतरण से व्यक्त किया गया है।
- source_word: מַחְשְׁבוֹת אָדָם
  choice: मनुष्यों के विचारों
  rationale: אָדָם यहाँ मानवजाति को सामूहिक रूप से सूचित करता है; आगे आया बहुवचन सर्वनाम הֵמָּה भी हिन्दी में बहुवचन ‘मनुष्यों’ का समर्थन करता है। מַחְשְׁבוֹת में विचार, सोच या योजनाएँ शामिल हो सकती हैं; ‘विचारों’ इस व्यापकता को सहज रूप में बनाए रखता है।
- source_word: הָבֶל
  choice: भाप के समान
  rationale: मूल चित्र ऐसी भाप या वाष्प का है जो टिकती नहीं और सारहीन है। ‘भाप के समान’ इस ठोस रूपक को बनाए रखते हुए साधारण आधुनिक हिन्दी में स्वाभाविक है।
theological_decisions:
- issue: הָבֶל के रूपक का अर्थ
  choice: भाप के समान
  alternative: व्यर्थ
  rationale: ‘व्यर्थ’ केवल निष्कर्ष देता और मूल के क्षणभंगुर, सारहीन भाप-जैसे चित्र को मिटा देता। तुलना-सूचक भाषा हिन्दी में रूपक का आशय स्पष्ट रखते हुए उसे अनावश्यक रूप से किसी एक अमूर्त अर्थ तक सीमित नहीं करती।
