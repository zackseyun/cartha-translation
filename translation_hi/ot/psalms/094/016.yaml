lexical_decisions:
- source_word: מִי
  choice: कौन
  rationale: दोनों समानांतर प्रश्नों को आरम्भ करनेवाला प्रश्नवाचक सर्वनाम; हिन्दी में इसका सीधा और स्वाभाविक रूप ‘कौन’ है।
- source_word: יָקוּם
  choice: उठ खड़ा होगा
  rationale: קום के काल रूप में उठने और विरोध के लिए खड़े होने का सजीव बिंब है; ‘उठ खड़ा होगा’ प्रश्न की भावी/संभावनात्मक शक्ति को भी बनाए रखता है।
- source_word: לִי
  choice: मेरे लिए
  rationale: यहाँ ל दिशा के बजाय हित या पक्ष का भाव व्यक्त करता है; ‘मेरे लिए’ स्वाभाविक हिन्दी है और वक्ता की ओर से खड़े होने का आशय रखता है।
- source_word: עִם
  choice: के विरुद्ध
  rationale: עִם का सामान्य अर्थ ‘के साथ’ है, पर यहाँ दुष्ट लोगों से मुठभेड़ और विरोध का प्रसंग है; ‘के विरुद्ध’ सन्दर्भगत अर्थ को स्पष्ट करता है, जबकि शाब्दिक विकल्प पाद-टिप्पणी में सुरक्षित है।
- source_word: מְרֵעִים
  choice: दुष्टों
  rationale: यह कृदन्त उन लोगों को दर्शाता है जो बुराई करते हैं। ‘दुष्टों’ संक्षिप्त, स्वाभाविक और नैतिक श्रेणी को स्पष्ट रखनेवाला रूप है।
- source_word: יִתְיַצֵּב
  choice: डटकर खड़ा होगा
  rationale: יצב का हितपएल रूप दृढ़तापूर्वक अपना स्थान लेने का भाव देता है; ‘डटकर खड़ा होगा’ पहले चरण के समानांतर रहते हुए इसकी दृढ़ता को व्यक्त करता है।
- source_word: פֹּעֲלֵי אָוֶן
  choice: अनर्थ करनेवालों
  rationale: यह इब्रानी पद उन लोगों के लिए है जो बुराई या हानिकारक दुष्टता करते हैं। ‘अनर्थ करनेवाले’ कृत्यशीलता और אָוֶן के नैतिक तथा हानिकारक दोनों आयामों को संक्षेप में व्यक्त करता है।
- source_word: אָוֶן
  choice: अनर्थ
  rationale: אָוֶן के अर्थ-क्षेत्र में बुराई, दुष्टता, कष्ट और हानिकारक अन्याय सम्मिलित हैं। ‘अनर्थ’ इस प्रसंग में नैतिक बुराई और उससे होनेवाली हानि, दोनों की गुंजाइश बनाए रखता है।
