  text: אִם אָ֭מַרְתִּי מָ֣טָה רַגְלִ֑/י חַסְדְּ/ךָ֥ יְ֝הוָ֗ה יִסְעָדֵֽ/נִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/094/018.yaml
  text: When I said, “My foot is slipping,” your steadfast love, O LORD, upheld me.
translation:
  language: hi
  text: जब मैंने कहा, “मेरा पैर फिसल रहा है,” तब हे यहोवा, आपके अटल प्रेम ने मुझे संभाला।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אִם
  choice: जब
  rationale: यहाँ शर्त रखने के बजाय बीते अनुभव का अवसर बताना प्रसंगानुकूल है; इसलिए हिन्दी में “जब” स्वाभाविक है।
- source_word: מָטָה רַגְלִי
  choice: मेरा पैर फिसल रहा है
  rationale: मुहावरा अस्थिर होने या गिरने के निकट होने का चित्र देता है; “फिसल रहा है” इस जीवंत रूपक को सहज हिन्दी में बनाए रखता है।
- source_word: חַסְדְּךָ
  choice: आपके अटल प्रेम
  rationale: חֶסֶד में प्रेम के साथ निष्ठा और स्थिरता का भाव है; “अटल प्रेम” इसे संक्षेप और स्पष्टता से व्यक्त करता है।
- source_word: יִסְעָדֵנִי
  choice: मुझे संभाला
  rationale: क्रिया सहारा देने और गिरने से बचाने का अर्थ रखती है; “संभाला” पैर फिसलने के पूर्ववर्ती चित्र से स्वाभाविक रूप से जुड़ता है।
theological_decisions:
- issue: परमेश्वर के नाम יהוה का रूप
  choice: यहोवा
  alternative: प्रभु
  rationale: मूल पाठ में सामान्य उपाधि नहीं, परमेश्वर का विशिष्ट नाम יהוה है; “यहोवा” हिन्दी पाठकों में प्रचलित नाम-रूप है और मूल का यह भेद बनाए रखता है।
- issue: יִסְעָדֵנִי का कालगत भाव
  choice: मुझे संभाला
  alternative: मुझे संभालता है
  rationale: आरंभिक “जब मैंने कहा” घटना को स्मरण के रूप में प्रस्तुत करता है, इसलिए हिन्दी में पूर्ण भूतकाल सबसे सहज है; मूल क्रिया का सहारा देने वाला अर्थ बिना अतिरिक्त सिद्धान्तगत निष्कर्ष के सुरक्षित रहता है।
translation_notes:
  register: आधुनिक, सहज और आदरपूर्ण हिन्दी अपनाई गई है। परमेश्वर के लिए “आप” का प्रयोग किया गया है; पद का ठोस काव्यात्मक चित्र और सीधा संबोधन बनाए रखा गया है।
