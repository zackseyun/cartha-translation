    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: बन गया है
  rationale: हिब्रू रूप भूतकाल की घटना को व्यक्त करता है जिसका परिणाम वर्तमान में बना हुआ है; ‘बन गया है’ अनुभव और वर्तमान भरोसे दोनों को स्वाभाविक हिन्दी में रखता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: मूल पाठ में परमेश्वर का व्यक्तिगत नाम है; हिन्दी में प्रचलित लिप्यंतरण ‘यहोवा’ शीर्षक से उसे बदलने के बजाय नाम को सुरक्षित रखता है।
- source_word: לִי לְמִשְׂגָּב
  choice: मेरे लिए दृढ़ गढ़
  rationale: לִי हित अथवा संबंध बताता है, और מִשְׂגָּב ऊँचे, सुरक्षित दुर्ग या शरणस्थान का बिंब रखता है; यह पदबंध दोनों अर्थों को स्पष्ट हिन्दी में व्यक्त करता है।
- source_word: וֵאלֹהַי
  choice: और मेरा परमेश्वर
  rationale: संयोजक और प्रथम पुरुष स्वत्व-प्रत्यय सहित संज्ञा का सीधा, स्वाभाविक अनुवाद है और समानांतर व्यक्तिगत स्वीकार को बनाए रखता है।
- source_word: לְצוּר מַחְסִי
  choice: मेरी शरण की चट्टान
  rationale: צוּר स्थिरता और सुरक्षा की चट्टान-संबंधी उपमा को तथा מַחְסִי व्यक्तिगत शरण को व्यक्त करता है; यह अनुवाद हिब्रू संबंध और काव्यात्मक बिंब दोनों सुरक्षित रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल में चार अक्षरों वाला व्यक्तिगत ईश्वरीय नाम सीधे आया है। हिन्दी पाठकों के लिए परिचित ‘यहोवा’ नाम को शीर्षक ‘प्रभु’ से बदलने के बजाय उसके नामात्मक स्वरूप को बनाए रखता है।
- issue: וַיְהִי का कालगत बल
  choice: बन गया है
  alternative: बन गया
  rationale: दोनों व्याकरणतः संभव हैं; पूर्ण वर्तमान हिन्दी में पूर्व अनुभव के निरंतर वर्तमान परिणाम को उभारता है, बिना क्रिया के पूर्णतामूलक बल को मिटाए।
