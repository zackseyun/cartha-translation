  yaml_path: translation/ot/psalms/094/005.yaml
  text: O Yahweh[b][a], they crush your people and afflict your inheritance.
translation:
  language: hi
  text: हे याहवे, वे आपकी प्रजा को कुचलते हैं[a] और आपकी विरासत[b] को सताते हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘दबाकर पीसते हैं’ अथवा ‘अत्याचार करते हैं।’ इब्रानी क्रिया कुचल देने जैसे कठोर उत्पीड़न को व्यक्त कर सकती है।
    reason: lexical_alternative
  - marker: b
    text: या ‘आपके विरासती भाग’ अथवा ‘आपकी निज संपत्ति।’ इब्रानी शब्द विरासत में मिली या किसी को बाँटकर दी गई संपत्ति को दर्शाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: עַמְּךָ
  choice: आपकी प्रजा
  rationale: עַם यहाँ परमेश्वर से संबंधित समुदाय को दर्शाता है। हिंदी में ‘आपकी प्रजा’ इस सामूहिक और वाचा-संबंधी भाव को स्वाभाविक रूप से व्यक्त करता है।
- source_word: יְהוָה
  choice: हे याहवे
  rationale: इब्रानी चतुरक्षरीय दिव्य नाम יהוה को उपाधि से बदलने के बजाय ‘याहवे’ के रूप में लिप्यंतरित किया गया है; संबोधन को स्पष्ट करने के लिए ‘हे’ रखा गया है।
- source_word: יְדַכְּאוּ
  choice: कुचलते हैं
  rationale: דכא का पिएल रूप दबाकर तोड़ने या निर्ममता से कुचलने की सशक्त छवि रखता है। ‘कुचलते हैं’ उस तीव्रता को बनाए रखता है।
- source_word: וְנַחֲלָתְךָ
  choice: और आपकी विरासत
  rationale: נַחֲלָה विरासत में मिली या बाँटकर दी गई संपत्ति को दर्शाता है; यहाँ यह परमेश्वर के अपने लोगों के लिए रूपक है। ‘विरासत’ मूल रूपक को सुरक्षित रखता है।
- source_word: יְעַנּוּ
  choice: सताते हैं
  rationale: ענה का पिएल रूप दुःख देने, उत्पीड़ित करने या पीड़ित करने का अर्थ देता है। ‘सताते हैं’ सहज आधुनिक हिंदी है और पहले क्रिया-पद ‘कुचलते हैं’ से आवश्यक भेद भी बनाए रखता है।
theological_decisions:
- issue: दिव्य नाम יהוה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: पद में व्यक्तिगत दिव्य नाम יהוה सीधे आया है। ‘याहवे’ उसका प्रचलित विद्वतापूर्ण लिप्यंतरण है और उसे किसी उपाधि से प्रतिस्थापित नहीं करता।
- issue: नַחֲלָה द्वारा परमेश्वर के लोगों का वर्णन
  choice: आपकी विरासत
  alternative: आपकी निज संपत्ति; आपका विरासती भाग
  rationale: ‘विरासत’ इब्रानी रूपक और उसके स्वामित्व/आवंटित भाग—दोनों भावों को बनाए रखता है, बिना यह तय किए कि यहाँ केवल संपत्ति या केवल विरासती समुदाय का भाव अभिप्रेत है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण मानक हिंदी अपनाई गई है। परमेश्वर के लिए आदरसूचक ‘आपकी’ रखा गया है। समानांतर इब्रानी पंक्तियों की तीव्रता और ‘प्रजा/विरासत’ की काव्यात्मक जोड़ी सुरक्षित रखी गई है।
