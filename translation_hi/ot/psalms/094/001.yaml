id: PSA.94.1
reference: Psalms 94:1
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: אֵל נְקָמ֥וֹת יְהוָ֑ה אֵ֖ל נְקָמ֣וֹת הוֹפִֽיַע־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/094/001.yaml
  text: O God of vengeance[a], O Yahweh, God of vengeance[b], shine forth!
translation:
  language: hi
  text: हे प्रतिशोध के परमेश्वर[a], हे यहोवा, प्रतिशोध के परमेश्वर, प्रकट हो[b]!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “प्रतिशोधों के परमेश्वर।” हिब्रू का बहुवचन सम्भवतः दैवी प्रतिदान की तीव्रता या उसके विविध कार्यों पर बल देता है।
    reason: lexical_alternative
  - marker: b
    text: या “अपना तेज प्रकट कर!” इस क्रिया में दिखाई देने, विशेषकर तेजोमय दैवी प्राकट्य, का भाव हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵל
  choice: परमेश्वर
  rationale: यहाँ אֵל सीधे संबोधन में इस्राएल के परमेश्वर के लिए प्रयुक्त दैवी उपाधि है; आधुनिक मानक हिन्दी में ‘परमेश्वर’ स्वाभाविक और गरिमापूर्ण है।
- source_word: נְקָמוֹת
  choice: प्रतिशोध
  rationale: हिब्रू बहुवचन यहाँ तीव्र अथवा भाववाचक अर्थ रखता है। हिन्दी में ‘प्रतिशोधों’ अस्वाभाविक होगा; ‘प्रतिशोध’ दैवी दंड-प्रतिदान की मूल धारणा को बिना ‘न्याय’ कहकर नरम किए सुरक्षित रखता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: चतुर्वर्णी दैवी नाम को किसी उपाधि से बदलने के बजाय हिन्दी बाइबलीय परंपरा में व्यापक रूप से पहचाने जाने वाले व्यक्तिगत नाम ‘यहोवा’ से प्रस्तुत किया गया है।
- source_word: הוֹפִיעַ
  choice: प्रकट हो
  rationale: יפע के हिफ़ील आज्ञार्थक रूप में दृश्य और तेजोमय दैवी अभिव्यक्ति का भाव हो सकता है। ‘प्रकट हो’ उसका मुख्य अर्थ स्वाभाविक हिन्दी में देता है; ज्योतिर्मय भाव को पादटिप्पणी में रखा गया है।
theological_decisions:
- issue: दैवी प्रतिशोध की भाषा
  choice: ‘प्रतिशोध के परमेश्वर’ को यथावत रखना
  alternative: ‘न्याय के परमेश्वर’ अथवा ‘बदला लेने वाले परमेश्वर’
  rationale: मूल पाठ स्पष्ट रूप से परमेश्वर को נקמות से संबद्ध करता है। ‘न्याय’ मूल की तीक्ष्णता को कम कर देगा, जबकि ‘बदला’ निजी वैर का अनुचित भाव दे सकता है; ‘प्रतिशोध’ न्यायपूर्ण दैवी प्रतिदान की धारणा और उसके धर्मवैचारिक तनाव को बनाए रखता है।
- issue: הוֹפִיעַ में दैवी अभिव्यक्ति का स्वरूप
  choice: मुख्य पाठ में ‘प्रकट हो’
  alternative: ‘अपना तेज प्रकट कर’ अथवा ‘चमक उठ’
  rationale: क्रिया दृश्य अथवा तेजोमय प्राकट्य का संकेत दे सकती है, पर ज्योति का भाव कितना स्पष्ट है, इसमें वास्तविक अर्थगत विस्तार है। मुख्य पाठ व्यापक अर्थ रखता है और पादटिप्पणी तेजोमय विकल्प बताती है।
translation_notes:
  register: भाषा आधुनिक, सीधी और प्रार्थनात्मक रखी गई है। दोहराव मूल हिब्रू की काव्यात्मक तीव्रता के कारण सुरक्षित है। ‘प्रतिशोध’ औपचारिक किंतु सामान्यतः बोधगम्य शब्द है और ‘बदला’ की तुलना में दैवी न्यायिक प्रतिदान के लिए अधिक गरिमापूर्ण है।
