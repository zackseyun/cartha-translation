lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: वे कहते हैं
  rationale: काव्यात्मक प्रसंग में यह रूप दुष्टों की बार-बार कही जाने वाली या उनकी विशिष्ट बात को वर्तमान काल में प्रस्तुत करता है; आधुनिक हिन्दी में यह स्वाभाविक है।
- source_word: לֹא יִרְאֶה
  choice: नहीं देखता
