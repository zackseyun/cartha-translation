- source_word: יָּהּ
  choice: याह
  rationale: यह परमेश्वर के नाम का संक्षिप्त काव्यात्मक रूप है; इसे पूर्ण नाम के प्रचलित अनुवाद में मिला देने के बजाय अलग रूप में रखा गया है।
- source_word: וְלֹא יָבִין
  choice: नहीं समझता
  rationale: בין का सीधा अर्थ समझना या परखना है; यहाँ दुष्ट लोग परमेश्वर की बोधात्मक और नैतिक जागरूकता से इनकार करते हैं।
- source_word: אֱלֹהֵי יַעֲקֹב
  choice: याकूब का परमेश्वर
  rationale: यह वाचा-संबंधी उपाधि का स्पष्ट और स्वाभाविक हिन्दी रूप है।
theological_decisions:
- issue: ईश्वरीय नाम के संक्षिप्त काव्यात्मक रूप יָּהּ का अनुवाद
  choice: याह
  alternative: यहोवा / प्रभु
  rationale: मूल में पूर्ण चतुरक्षरीय नाम יְהוָה नहीं, बल्कि उसका विशिष्ट संक्षिप्त काव्यात्मक रूप है। “याह” इस भेद को सुरक्षित रखता है और किसी सम्प्रदायगत व्याख्या को नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक, सरल और गरिमापूर्ण रखी गई है। समानांतर काव्य-पंक्तियों की संक्षिप्तता सुरक्षित है; अर्धविराम दोनों संबंधित दावों को स्पष्ट रूप से जोड़ता है।
