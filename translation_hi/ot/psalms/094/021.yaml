  text: יָ֭גוֹדּוּ עַל נֶ֣פֶשׁ צַדִּ֑יק וְ/דָ֖ם נָקִ֣י יַרְשִֽׁיעוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/094/021.yaml
  text: They band together against the life of the righteous[b][a], and they condemn innocent blood.
translation:
  language: hi
  text: 'वे धर्मी के प्राण के विरुद्ध एकजुट होते हैं,

    और निर्दोष रक्त को दोषी ठहराते हैं।[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक क्रम: “और निर्दोष रक्त को वे दोषी ठहराते हैं।” ‘दोषी ठहराते हैं’ का अर्थ “अपराधी घोषित करते हैं” भी हो सकता है; ‘निर्दोष रक्त’ निर्दोष व्यक्ति के लिए प्रयुक्त है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: יָגוֹדּוּ
  choice: दल बाँधते हैं
  rationale: यह क्रिया विरोध में संगठित होने या जत्था बनाकर चढ़ आने का भाव दे सकती है। ‘दल बाँधते हैं’ सामूहिक षड्यंत्र और शत्रुतापूर्ण कार्रवाई—दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: עַל
  choice: के विरुद्ध
  rationale: शत्रुतापूर्ण क्रिया के साथ यह संबंध-वाचक अव्यय विरोध का अर्थ देता है।
- source_word: נֶפֶשׁ
  choice: प्राण
  rationale: यहाँ शब्द धर्मी व्यक्ति के जीवन को सूचित करता है, जिसे हिंसा का खतरा है। ‘प्राण’ ठोस जीवन-अर्थ को रखता है और अगले चरण के ‘खून’ से स्वाभाविक रूप से जुड़ता है।
- source_word: צַדִּיק
  choice: धर्मी
  rationale: एकवचन विशेषण यहाँ संज्ञा के रूप में प्रयुक्त है। ‘धर्मी’ प्रतिनिधिक एकवचन को बनाए रखता है और अनावश्यक रूप से पुरुष-विशेष अर्थ नहीं जोड़ता।
- source_word: דָם נָקִי
  choice: निर्दोष के खून
  rationale: शाब्दिक संरचना ‘निर्दोष खून’ है, जिसका अर्थ निर्दोष व्यक्ति का बहाया जाने वाला खून है। हिन्दी में ‘निर्दोष के खून’ अर्थ को स्पष्ट रखते हुए मूल की हिंसक और न्यायिक छवि बचाता है।
- source_word: יַרְשִׁיעוּ
  choice: दोषी ठहराते हैं
  rationale: हिफ़ील रूप न्यायिक अर्थ में किसी को दोषी घोषित करने या दण्ड का पात्र ठहराने को दर्शाता है। ‘दोषी ठहराते हैं’ इस वैधानिक भाव को ‘निन्दा करते हैं’ की अपेक्षा अधिक ठीक व्यक्त करता है।
theological_decisions:
- issue: צַדִּיק का प्रतिनिधिक एकवचन
  choice: धर्मी
  alternative: किसी धर्मी व्यक्ति / धर्मी जन
  rationale: इब्रानी में एकवचन किसी प्रतिनिधिक धर्मी व्यक्ति या धर्मियों के वर्ग को सूचित कर सकता है। ‘धर्मी’ इस तनाव को बनाए रखता है और लिंग को अनावश्यक रूप से निर्दिष्ट नहीं करता।
- issue: निर्दोष खून को दोषी ठहराने की न्यायिक छवि
  choice: निर्दोष के खून को दोषी ठहराते हैं
  alternative: निर्दोष का खून बहाते हैं / निर्दोष को दण्डित करते हैं
  rationale: मूल पाठ हत्या के परिणाम को सीधे नहीं कहता, बल्कि निर्दोष खून को दोषी घोषित करने की तीखी न्यायिक छवि प्रस्तुत करता है। अनुवाद उस असामान्य रूपक को सामान्य बनाकर नहीं मिटाता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य रखी गई है। काव्यात्मक समानांतरता के लिए दो पंक्तियाँ रखी गई हैं। ‘प्राण’ और ‘खून’ मूल की जीवन तथा हिंसा संबंधी ठोस छवियों को सुरक्षित रखते हैं।
