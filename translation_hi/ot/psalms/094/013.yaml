source:
  edition: WLC
  text: לְ/הַשְׁקִ֣יט ל֭/וֹ מִ֣/ימֵי רָ֑ע עַ֤ד יִכָּרֶ֖ה לָ/רָשָׁ֣ע שָֽׁחַת׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/094/013.yaml
  text: to give him rest from days of trouble[b][a], until a pit is dug for the wicked.
translation:
  language: hi
  text: कि उसे विपत्ति के दिनों से विश्राम दे[a], जब तक दुष्ट के लिए गड्ढा न खोदा जाए[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “बुराई के दिनों से।” इब्रानी में शाब्दिक रूप से “बुराई के दिन” है, अर्थात संकट या विपत्ति से चिह्नित दिन।
    reason: lexical_alternative
  - marker: b
    text: या, “जब तक दुष्ट के लिए विनाश का गड्ढा न खोदा जाए।” इब्रानी संज्ञा सामान्यतः “गड्ढा” दर्शाती है, पर उसमें विनाश या कब्र जैसे अंत का भाव भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: לְהַשְׁקִיט לוֹ
  choice: उसे ... विश्राम दे
  rationale: हिफ़ील रूप किसी को शांत या निश्चिंत करने, अर्थात विश्राम देने, का भाव रखता है। यह हिंदी में स्वाभाविक है और पिछले पद से जुड़े प्रयोजन को व्यक्त करता है।
- source_word: מִימֵי רָע
  choice: विपत्ति के दिनों से
  rationale: शाब्दिक अर्थ ‘बुराई के दिनों से’ है, पर संदर्भ में ये संकट या विपत्ति से चिह्नित दिन हैं। ‘विपत्ति’ नैतिक बुराई का अनावश्यक अर्थ लगाए बिना विपदात्मक भाव स्पष्ट करती है।
- source_word: עַד
  choice: जब तक
  rationale: यह विश्राम की अवधि की सीमा बताने वाला सामान्य कालवाचक संबंधबोधक है।
- source_word: יִכָּרֶה
  choice: न खोदा जाए
  rationale: 'निफ़अल अपूर्ण रूप को निष्क्रिय अर्थ में लिया गया है: गड्ढा ‘खोदा जाए’। ‘जब तक ... न’ हिंदी में עַד के साथ स्वाभाविक कालवाचक रचना है।'
- source_word: לָרָשָׁע
  choice: दुष्ट के लिए
  rationale: एकवचन विशेषण संज्ञा के रूप में दुष्ट व्यक्ति को प्रतिनिधिक ढंग से दर्शाता है; हिंदी में एकवचन बनाए रखा गया है।
- source_word: שָׁחַת
  choice: गड्ढा
  rationale: मूल अर्थ गड्ढा है, जिसमें विनाश या कब्र जैसी गहराई की छाया हो सकती है। मुख्य पाठ में सीधा अर्थ रखा गया और व्यापक अर्थ पादटिप्पणी में दिया गया है।
theological_decisions:
- issue: धर्मी पीड़ित को मिलने वाले विश्राम का स्वरूप
  choice: विपत्ति के दिनों से मिलने वाला विश्राम, जो दुष्ट के न्याय तक रहता है
  alternative: विपत्ति के बीच केवल आंतरिक शांति; अथवा केवल अंतिमकालीन विश्राम
  rationale: वाक्य-विन्यास ‘विपत्ति के दिनों से’ विश्राम को ‘जब तक’ दुष्ट के लिए गड्ढा खोदा जाए से जोड़ता है। पाठ अस्थायी राहत और न्याय की प्रतीक्षा का भाव देता है, पर यह स्पष्ट नहीं करता कि विश्राम केवल बाहरी परिस्थितियों का है या उसमें आंतरिक शांति भी सम्मिलित है।
translation_notes:
  register: आधुनिक मानक हिंदी का सरल, गरिमापूर्ण काव्यात्मक गद्य। ‘विपत्ति’, ‘विश्राम’ और ‘दुष्ट’ जैसे परिचित धार्मिक-साहित्यिक शब्द चुने गए हैं; कृत्रिम संस्कृतनिष्ठता से बचा गया है। पादटिप्पणी चिह्न मुख्य पाठ में संबद्ध पदों के तुरंत बाद रखे गए हैं।
