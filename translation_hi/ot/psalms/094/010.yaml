  yaml_path: translation/ot/psalms/094/010.yaml
  text: He who disciplines nations[a], will he not rebuke—he who teaches man knowledge?
translation:
  language: hi
  text: जो राष्ट्रों को अनुशासित करता है, क्या वह ताड़ना न देगा—वह जो मनुष्य[a] को ज्ञान सिखाता है?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “मानवजाति” अथवा “मानवता”; इब्रानी में “मनुष्य” (אָדָם) यहाँ प्रतिनिधिक एकवचन है।
    reason: lexical_alternative
lexical_decisions:
- source_word: יֹסֵר
  choice: अनुशासित करता है
  rationale: यह सुधारात्मक अनुशासन और अधिकार—दोनों भावों को व्यक्त करता है; इसे केवल दंड देने तक सीमित नहीं करता।
- source_word: גּוֹיִם
  choice: राष्ट्रों
  rationale: भजन के संदर्भ में यह सामान्य रूप से राष्ट्रों अथवा जातियों को दर्शाता है, न कि विशेष रूप से गैर-यहूदियों को। आधुनिक हिन्दी में ‘राष्ट्रों’ स्पष्ट और स्वाभाविक है।
- source_word: יוֹכִיחַ
  choice: डाँटेगा
  rationale: हिफ़ईल रूप यहाँ दोष दिखाने और सुधारने के लिए फटकारने का भाव रखता है। ‘डाँटेगा’ आलंकारिक प्रश्न में स्वाभाविक है और पहले खंड के अनुशासन से समानांतरता रखता है।
- source_word: הַמְלַמֵּד
  choice: वह जो ... शिक्षा देता है
  rationale: मूल कृदंत परमेश्वर का वर्णन संज्ञात्मक ढंग से करता है। हिन्दी संरचना इस वर्णनात्मक समानांतरता को बनाए रखती है।
- source_word: אָדָם
  choice: मनुष्य
  rationale: यहाँ एकवचन रूप समस्त मानवता का प्रतिनिधि है। ‘मनुष्य’ हिन्दी में मूल के प्रतिनिधिक एकवचन को रखते हुए सामान्य मानवीय अर्थ देता है।
- source_word: דָּעַת
  choice: ज्ञान
  rationale: यह मूल शब्द का सीधा और प्रसंगानुकूल अर्थ है; ‘ज्ञान की शिक्षा देता है’ आधुनिक हिन्दी में स्वाभाविक अभिव्यक्ति है।
- source_word: הֲ...הֲלֹא
  choice: क्या वह ... नहीं?
  rationale: ये प्रश्नवाचक अव्यय ऐसा आलंकारिक प्रश्न बनाते हैं जिसका अपेक्षित उत्तर ‘हाँ’ है। हिन्दी में यह संरचना उसी बल को स्पष्ट रखती है।
theological_decisions:
- issue: אָדָם का प्रतिनिधिक एकवचन
  choice: मनुष्य
  alternative: मानवजाति / मानवता
  rationale: पद का आशय सामान्य मानवता से है, पर मूल इब्रानी प्रतिनिधिक एकवचन रखता है। ‘मनुष्य’ उस रूप और सामूहिक आशय दोनों को बनाए रखता है; पादटिप्पणी संभावित सामूहिक अनुवाद स्पष्ट करती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। मूल के दो वर्णनात्मक खंडों और आलंकारिक प्रश्न को डैश के माध्यम से सुरक्षित रखा गया है।
