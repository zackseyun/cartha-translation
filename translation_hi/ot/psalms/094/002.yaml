  yaml_path: translation/ot/psalms/094/002.yaml
  text: Rise up[a], Judge of the earth[b]; repay the proud what they deserve.
translation:
  language: hi
  text: उठ खड़े हो[a], हे पृथ्वी के न्यायी; घमंडियों को उनके किए का फल दे[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अपने को ऊँचा उठा” अथवा “ऊँचा हो”; इब्रानी क्रिया में स्वयं को उठाने या ऊँचा करने का भाव भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: अधिक शाब्दिक रूप में, “घमंडियों पर प्रतिफल लौटा दे।”
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנָּשֵׂא
  choice: उठ खड़े हो
  rationale: यह आत्मवाचक भाव वाला आदेश है, जो परमेश्वर से सक्रिय होकर हस्तक्षेप करने की पुकार करता है। ‘उठ खड़े हो’ आधुनिक हिन्दी में स्वाभाविक है और क्रियाशीलता का भाव बनाए रखता है।
- source_word: שֹׁפֵט
  choice: न्यायी
  rationale: यह परमेश्वर के लिए संज्ञा के रूप में प्रयुक्त कृदंत और न्यायिक उपाधि है। ‘न्यायी’ संबोधन में संक्षिप्त और गरिमापूर्ण है।
- source_word: הָאָרֶץ
  choice: पृथ्वी के
  rationale: काव्यात्मक संदर्भ में यह परमेश्वर के न्याय के व्यापक, सार्वभौमिक क्षेत्र को व्यक्त करता है; ‘देश’ अनावश्यक रूप से सीमित अर्थ दे सकता है।
- source_word: הָשֵׁב
  choice: दे
  rationale: שוב का हिफ़ील आदेश, גמול के साथ, प्रतिफल को लौटाने अर्थात बदला या उचित फल देने का अर्थ रखता है। हिन्दी में संयुक्त वाक्यांश ‘किए का फल दे’ इस न्यायिक अर्थ को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: גְּמוּל
  choice: उनके किए का फल
  rationale: यह उचित प्रतिफल या बदले को दर्शाता है। ‘उनके किए का फल’ सामान्य आधुनिक हिन्दी में स्पष्ट है और नैतिक प्रतिफल का भाव सुरक्षित रखता है।
- source_word: עַל
  choice: घमंडियों को
  rationale: यहाँ यह प्रतिफल पाने वालों को चिह्नित करता है। हिन्दी में ‘को’ के साथ अप्रत्यक्ष कर्म-विन्यास, शाब्दिक ‘पर’ से अधिक स्वाभाविक है।
- source_word: גֵּאִים
  choice: घमंडियों
  rationale: यह नैतिक रूप से अभिमानी या अहंकारी लोगों के लिए है। ‘घमंडी’ सहज और प्रचलित हिन्दी शब्द है।
theological_decisions:
- issue: ईश्वरीय न्याय के लिए विनती का स्वरूप
  choice: पृथ्वी के न्यायी परमेश्वर से उठकर घमंडी लोगों को उनके कर्मों का उचित फल देने की विनती
  alternative: मुख्यतः परमेश्वर से ‘महान ठहरने’ या ‘ऊँचा किए जाने’ की विनती
  rationale: दोनों आदेशों और न्यायिक शब्दावली के मेल से सक्रिय न्याय की विनती प्रमुख अर्थ है। अनुवाद पद से आगे कोई विशिष्ट धर्मसैद्धांतिक व्यवस्था नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। ईश्वर को सीधे संबोधित करने के काव्यात्मक ढंग के अनुरूप आदेशवाचक एकवचन प्रयोग हुआ है; न्यायिक अर्थ को स्वाभाविक हिन्दी में व्यक्त किया गया है।
