id: PSA.94.14
reference: Psalms 94:14
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: כִּ֤י לֹא יִטֹּ֣שׁ יְהוָ֣ה עַמּ֑/וֹ וְ֝/נַחֲלָת֗/וֹ לֹ֣א יַעֲזֹֽב׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/094/014.yaml
  text: For Yahweh will not forsake his people[b][a]; he will not abandon his inheritance.
translation:
  language: hi
  text: क्योंकि याहवे अपनी प्रजा को नहीं त्यागेगा[a]; वह अपनी विरासत[b] को नहीं छोड़ेगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘ठुकराएगा’।
    reason: lexical_alternative
  - marker: b
    text: या ‘धरोहर’ अथवा ‘निज भाग’।
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह आसपास के कथन का कारण या आधार प्रस्तुत करता है; ‘क्योंकि’ उसके व्याख्यात्मक संबंध को स्वाभाविक हिंदी में बनाए रखता है।
- source_word: יִטֹּשׁ
  choice: नहीं त्यागेगा
  rationale: נטשׁ में त्याग देने, छोड़ देने या ठुकरा देने का भाव है। ‘त्यागेगा’ गंभीर और स्वाभाविक है तथा वाचा-संबंधी संदर्भ के अनुकूल है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय परमेश्वर-नाम को उपाधि से बदलने के बजाय हिंदी में लिप्यंतरित किया गया है।
- source_word: עַמּוֹ
  choice: अपनी प्रजा
  rationale: यहाँ עַם परमेश्वर से संबंध रखने वाले लोगों को दर्शाता है। ‘अपनी प्रजा’ हिंदी में इस सामूहिक और संबंधपरक अर्थ को स्पष्ट रखता है।
- source_word: נַחֲלָתוֹ
  choice: अपनी विरासत
  rationale: נַחֲלָה विरासत, निज भाग या अधिकार में मिली संपत्ति को दर्शा सकता है। ‘विरासत’ मूल रूपक को सीधे बनाए रखती है।
- source_word: יַעֲזֹב
  choice: नहीं छोड़ेगा
  rationale: עזב का अर्थ छोड़ देना या परित्याग करना है। ‘छोड़ेगा’ पहली पंक्ति के ‘त्यागेगा’ से शब्दगत भेद रखते हुए इब्रानी समानांतरता को स्वाभाविक हिंदी में व्यक्त करता है।
theological_decisions:
- issue: परमेश्वर के नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा अथवा ‘प्रभु’
  rationale: मूल पाठ में व्यक्तिगत वाचा-नाम स्पष्ट रूप से आया है; ‘याहवे’ उसे उपाधि में बदले बिना प्रस्तुत करता है।
- issue: נַחֲלָתוֹ में वाचा-संबंधी विरासत का रूपक
  choice: अपनी विरासत
  alternative: अपनी धरोहर अथवा अपना निज भाग
  rationale: ‘विरासत’ इस भाव को बनाए रखती है कि प्रजा याहवे का विशेष भाग और अधिकार है, बिना इस रूपक को केवल ‘संपत्ति’ तक सीमित किए।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। दोनों इब्रानी क्रियाओं के लिए ‘त्यागना’ और ‘छोड़ना’ चुनकर समानांतरता तथा सूक्ष्म शब्दगत भेद दोनों सुरक्षित रखे गए हैं।
