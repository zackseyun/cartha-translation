lexical_decisions:
- source_word: עַד מָתַי
  choice: कब तक
  rationale: विलाप और प्रार्थना में अवधि पूछने वाली इस इब्रानी अभिव्यक्ति का स्वाभाविक हिन्दी समतुल्य ‘कब तक’ है; इसकी पुनरावृत्ति शिकायत की तीव्रता बनाए रखती है।
- source_word: רְשָׁעִים
  choice: दुष्ट
  rationale: यह बहुवचन विशेषण संज्ञा के रूप में दुष्ट लोगों के सामूहिक वर्ग को दर्शाता है; ‘दुष्ट’ हिन्दी में संक्षिप्त और स्वाभाविक है।
- source_word: יְהוָה
  choice: याहवे
  rationale: मूल पाठ में परमेश्वर का व्यक्तिगत नाम है; ‘याहवे’ उसका लिप्यंतरण है, किसी उपाधि का प्रतिस्थापन नहीं।
- source_word: יַעֲלֹזוּ
  choice: उल्लास मनाते रहेंगे
  rationale: क्रिया प्रबल और उमंग-भरे आनन्द को व्यक्त करती है। ‘उल्लास मनाना’ सामान्य ‘आनन्दित होना’ से अधिक तीव्र है, और ‘रहेंगे’ प्रश्न में निहित जारी अवधि को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: עַד מָתַי רְשָׁעִים … עַד מָתַי רְשָׁעִים
  choice: दुष्ट कब तक—दुष्ट कब तक
  rationale: मूल की भावपूर्ण पुनरावृत्ति को बनाए रखा गया है; दीर्घ विराम पहले अधूरे उद्गार और फिर उसे पूरा करने वाले दोहराव को हिन्दी कविता में स्पष्ट करता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: यहाँ मूल में चार अक्षरों वाला व्यक्तिगत ईश्वरीय नाम सीधे आया है। लिप्यंतरण नाम और उपाधि के बीच का भेद सुरक्षित रखता है; पाठ किसी विशेष सम्प्रदायगत व्याख्या को नहीं जोड़ता।
- issue: दुष्टों के आनन्द का स्वर
  choice: उल्लास मनाते रहेंगे
  alternative: आनन्दित रहेंगे; विजयोल्लास मनाते रहेंगे
  rationale: मूल क्रिया तीव्र उल्लास बताती है, पर स्वयं स्पष्ट रूप से ‘विजय’ नहीं कहती। इसलिए अनावश्यक अर्थ जोड़े बिना तीव्रता बनाए रखी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी का प्रार्थनापूर्ण, काव्यात्मक और गरिमापूर्ण स्वर रखा गया है। संबोधन ‘हे’ सामान्य पाठक के लिए स्पष्ट है। मूल की तीखी पुनरावृत्ति और पहले खंड की भावात्मक अपूर्णता को दीर्घ विराम द्वारा सुरक्षित रखा गया है।
