  yaml_path: translation/ot/psalms/094/023.yaml
  text: He will bring back on them their iniquity[a], and in their evil he will wipe them out[c][b]; Yahweh our God will wipe them out.
translation:
  language: hi
  text: वह उन पर उनका अधर्म लौटा देगा[a], और उनकी बुराई में उनका नाश कर देगा[b]; याहवे हमारा परमेश्वर उनका नाश कर देगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वह उन पर उनकी दुष्टता लौटा चुका है।” काव्यात्मक संदर्भ में हिब्रू क्रिया को भूतकाल या भविष्य के दृढ़ कथन के रूप में समझा जा सकता है; “अधर्म” का अनुवाद “दुष्टता” या “बुरा काम” भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या, “उनकी बुराई के कारण उनका नाश कर देगा,” अथवा “उनकी बुराई के द्वारा उनका नाश कर देगा।” हिब्रू संबंधबोधक उपसर्ग संगति, साधन या आधार का भाव दे सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֶׁב עֲלֵיהֶם
  choice: वह उन्हीं पर ... लौटा देगा
  rationale: שוב के हिफ़ील रूप और עַל को साथ लेकर यह उनके किए को उन्हीं पर वापस लाने का काव्यात्मक न्याय-चित्र बनाए रखता है। बलवाचक ‘उन्हीं’ स्वाभाविक हिन्दी में प्रत्यावर्तन को स्पष्ट करता है।
- source_word: אֶת אוֹנָם
  choice: उनका अधर्म
  rationale: אָוֶן यहाँ संकट के बजाय नैतिक बुराई या दुष्कर्म का बोध देता है, क्योंकि वही उन पर न्याय के रूप में लौटाया जाता है। ‘अधर्म’ गरिमापूर्ण और परिचित बाइबलीय हिन्दी है।
- source_word: וּבְרָעָתָם
  choice: और उनकी बुराई में ही
  rationale: בְּ की संगति, साधन अथवा आधार की संभावनाओं को पूरी तरह एक अर्थ में सीमित किए बिना ‘में ही’ मूल की संक्षिप्तता और अपने ही बुरे कर्मों में विनाश का भाव बचाता है।
- source_word: יַצְמִיתֵם ... יַצְמִיתֵם
  choice: उनका नाश कर देगा ... उनका नाश कर देगा
  rationale: צמת का हिफ़ील रूप पूर्ण विनाश का प्रबल अर्थ देता है। हिन्दी में ‘नाश कर देगा’ स्वाभाविक और गंभीर है; मूल की पुनरुक्ति यथावत रखी गई है।
- source_word: יְהוָה אֱלֹהֵינוּ
  choice: याहवे हमारा परमेश्वर
  rationale: व्यक्तिगत दिव्य नाम को शीर्षक से प्रतिस्थापित न करके ‘याहवे’ रूप में रखा गया है; אֱלֹהֵינוּ का सीधा अर्थ ‘हमारा परमेश्वर’ है।
theological_decisions:
- issue: आरंभिक וַיָּשֶׁב का काल/पक्ष
  choice: 'भविष्यसूचक निश्चय: ‘लौटा देगा’'
  alternative: ‘लौटा चुका है’ या ‘लौटा दिया’
  rationale: यद्यपि रूप wayyiqtol है, काव्य में इसका बल अनिवार्यतः सामान्य कथात्मक भूतकाल नहीं होता। आगे दोहराए गए अपूर्ण रूप יַצְמִיתֵם और भजन के न्याय-विषयक निष्कर्ष के साथ भविष्य का दृढ़ कथन अधिक संगत है; वैकल्पिक भूत/पूर्ण अर्थ पादटिप्पणी में सुरक्षित है।
- issue: וּבְרָעָתָם में בְּ का संबंध
  choice: ‘उनकी बुराई में ही’
  alternative: ‘उनकी बुराई के कारण’ या ‘उनकी बुराई के द्वारा’
  rationale: हिब्रू संबंध स्थान/परिस्थिति, साधन या आधार सूचित कर सकता है। मुख्य पाठ निकट और खुला अनुवाद रखता है, जबकि पादटिप्पणी अन्य संभावनाएँ बताती है।
- issue: दिव्य नाम יְהוָה
  choice: याहवे
  alternative: यहोवा या प्रभु
  rationale: मूल में व्यक्तिगत दिव्य नाम है। ‘याहवे’ उसका व्यापक रूप से स्वीकृत आधुनिक लिप्यंतरण है और शीर्षक से नाम को बदलता नहीं।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज और काव्यात्मक न्याय-भाषा रखी गई है। समान हिब्रू क्रिया की पुनरुक्ति को समान हिन्दी वाक्यांश से सुरक्षित किया गया है। ‘याहवे’ को बिना अतिरिक्त पादटिप्पणी के मुख्य पाठ में रखा गया है, क्योंकि वह सीधे मूल दिव्य नाम का लिप्यंतरण है।
