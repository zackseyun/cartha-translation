  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בִּינוּ
  choice: समझो
  rationale: यह בין क्रिया का बहुवचन आज्ञार्थक रूप है; सीधा और स्वाभाविक हिन्दी समकक्ष।
- source_word: בֹּעֲרִים
  choice: पशु-समान लोगो
  rationale: शब्द मूर्खता के साथ पशुवत् या जड़-बुद्धि होने का तीखा भाव रखता है; केवल ‘नासमझ’ कहने से मूल की कठोरता घट जाती।
- source_word: בָּעָם
  choice: प्रजा के ... लोगो
  rationale: शाब्दिक अर्थ ‘प्रजा/लोगों में’ है; हिन्दी में संबोधन को स्वाभाविक रखने के लिए ‘प्रजा के ... लोगो’ रखा गया।
- source_word: כְסִילִים
  choice: मूर्खो
  rationale: हिब्रू ज्ञान-साहित्य में यह नैतिक-बौद्धिक मूर्खता का सामान्य पद है; ‘मूर्ख’ इसका स्पष्ट आधुनिक हिन्दी रूप है।
- source_word: תַּשְׂכִּילוּ
  choice: बुद्धिमान बनोगे
  rationale: इस रूप में समझ-बूझ प्राप्त करने या विवेकशील बनने का भाव है; प्रश्न की भविष्याभिमुख चुनौती को सुरक्षित रखा गया।
