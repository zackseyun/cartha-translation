  yaml_path: translation/ot/psalms/094/015.yaml
  text: For judgment will return to righteousness[b][a], and all the upright in heart will follow after it.
translation:
  language: hi
  text: क्योंकि न्याय फिर धार्मिकता की ओर लौटेगा[a], और वे सभी जिनका हृदय सीधा है, उसके पीछे चलेंगे[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “क्योंकि न्याय फिर धार्मिकता के अनुरूप होगा।” इब्रानी מִשְׁפָּט का अर्थ “न्याय” या “न्यायिक निर्णय” हो सकता है, और צֶדֶק का अर्थ “धार्मिकता,” “न्यायपरायणता,” या “जो सही है” हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “और उसके पीछे वे सभी जिनका हृदय सीधा है।” “उसके” का संकेत निकटतम रूप से “न्याय” की ओर है, पर इसे व्यापक रूप से धार्मिकता की ओर भी समझा जा सकता है; पदबंध का भाव यह हो सकता है कि सीधे हृदय वाले उसके पीछे चलेंगे या उसके साथ होंगे।
    reason: lexical_alternative
