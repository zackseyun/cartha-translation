  rationale: यहाँ शब्द न्यायिक निर्णय अथवा न्याय-व्यवस्था के अर्थ में है; ‘न्याय’ आधुनिक हिन्दी में दोनों पहलुओं को समेटता है।
- source_word: צֶדֶק
  choice: धार्मिकता
  rationale: यह विकल्प מִשְׁפָּט से शब्दगत भेद बनाए रखते हुए नैतिक सहीपन का भाव व्यक्त करता है।
- source_word: וְאַחֲרָיו
  choice: उसके पीछे चलेंगे
  rationale: इब्रानी में शाब्दिक रूप से ‘और उसके पीछे’; निकटतम पुल्लिंग पूर्वपद מִשְׁפָּט है। हिन्दी में निहित क्रिया जोड़कर अनुकरण अथवा सहमति का भाव स्पष्ट किया गया है।
- source_word: כָּל יִשְׁרֵי לֵב
  choice: वे सभी जिनका हृदय सीधा है
  rationale: यह नैतिक आंतरिक खराई का स्वाभाविक और सामान्य हिन्दी रूप है।
theological_decisions:
- issue: न्याय और धार्मिकता का संबंध
  choice: विकृत न्याय फिर धार्मिकता के अनुरूप हो जाएगा।
  alternative: न्याय धार्मिकता की ओर लौटेगा; अथवा न्याय तब तक जारी रहेगा जब तक धार्मिकता न आए।
  rationale: יָשׁוּב का सामान्य अर्थ ‘लौटना’ है और עַד צֶדֶק यहाँ दिशा अथवा परिणाम दर्शाता है। अनुवाद पुनर्स्थापित नैतिक सामंजस्य को व्यक्त करता है, पर पादटिप्पणी अधिक शाब्दिक रूप सुरक्षित रखती है।
- issue: וְאַחֲרָיו में प्रत्यय का संदर्भ
  choice: ‘उसके’ का निकटतम संदर्भ ‘न्याय’ है।
  alternative: यह व्यापक रूप से ‘धार्मिकता’ अथवा पुनर्स्थापित नैतिक व्यवस्था की ओर संकेत कर सकता है।
  rationale: व्याकरण की दृष्टि से निकटतम पुल्लिंग संज्ञा מִשְׁפָּט है, पर इब्रानी पदबंध संक्षिप्त है; इसलिए मुख्य पाठ में संदर्भ को ‘उसके’ के रूप में खुला रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज काव्यात्मक गद्य। ‘धार्मिकता’ और ‘न्याय’ को अलग रखकर इब्रानी की दो संज्ञाओं का भेद सुरक्षित किया गया है; कठिन शाब्दिक संरचनाओं को पादटिप्पणियों में रखा गया है।
