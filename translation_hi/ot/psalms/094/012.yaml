  text: Blessed is the man whom you discipline[a], O Yah, and teach out of your law[e][d][c][b],
translation:
  language: hi
  text: धन्य है वह पुरुष जिसे तू अनुशासित करता है[a], हे याह[b], और तेरी व्यवस्था से शिक्षा देता है[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जिसे तू सुधारता है।” यहाँ अनुशासन सुधारने और शिक्षा देने के उद्देश्य से है।
    reason: lexical_alternative
  - marker: b
    text: “याह” परमेश्वर के नाम का संक्षिप्त काव्यात्मक रूप है।
    reason: source_form
  - marker: c
    text: या, “तेरे निर्देश से।” इब्रानी ‘तोरा’ का अर्थ व्यवस्था के साथ-साथ शिक्षा या निर्देश भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אַשְׁרֵי
  choice: धन्य है
  rationale: इब्रानी आशीर्वचन की स्थापित, गरिमापूर्ण अभिव्यक्ति; यह केवल मनोभावगत प्रसन्नता नहीं, बल्कि परमेश्वर की कृपा में स्थित कल्याण को भी व्यक्त करती है।
- source_word: הַגֶּבֶר
  choice: वह पुरुष
  rationale: मूल में निश्चित, पुल्लिंग एकवचन संज्ञा है। हिन्दी में ‘पुरुष’ मूल के लिंग को बनाए रखता है; प्रसंग में इसका प्रयोग प्रतिनिधिक व्यक्ति के रूप में है।
- source_word: תְּיַסְּרֶנּוּ
  choice: जिसे तू अनुशासित करता है
  rationale: पिएल रूप सुधारात्मक और चरित्र-निर्माणकारी अनुशासन को दर्शाता है; ‘अनुशासित’ आधुनिक हिन्दी में दंड मात्र की अपेक्षा इस व्यापक आशय को सुरक्षित रखता है।
- source_word: יָּהּ
  choice: हे याह
  rationale: यह पूर्ण नाम YHWH नहीं, उसका संक्षिप्त काव्यात्मक रूप ‘याह’ है; ‘हे’ सीधे संबोधन को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וּמִתּוֹרָתְךָ
  choice: और अपनी व्यवस्था से
  rationale: תּוֹרָה के लिए ‘व्यवस्था’ भजन-साहित्य में परिचित धार्मिक पद है, जबकि ‘से’ מִן के स्रोत अथवा माध्यम के भाव को सहज हिन्दी में देता है।
- source_word: תְלַמְּדֶנּוּ
  choice: शिक्षा देता है
  rationale: लמד के पिएल का सीधा अर्थ ‘सिखाना/शिक्षा देना’ है। हिन्दी वाक्य में कर्ता ‘तू’ के साथ संयुक्त क्रिया के रूप में यह स्वाभाविक है।
theological_decisions:
- issue: संक्षिप्त दिव्य नाम יָּהּ का अनुवाद
  choice: हे याह
  alternative: हे यहोवा / हे प्रभु
  rationale: मूल पाठ में संक्षिप्त काव्यात्मक नाम ‘याह’ है, न कि पूर्ण चतुरक्षरी नाम। लिप्यंतरण इस भेद को मिटने नहीं देता।
- issue: הַגֶּבֶר का लिंग और प्रतिनिधिक आशय
  choice: वह पुरुष
  alternative: वह व्यक्ति
  rationale: मूल का पुल्लिंग एकवचन रूप बनाए रखा गया है; साथ ही पादटिप्पणी स्पष्ट करती है कि कथन का सिद्धांत उस व्यक्ति पर लागू है जो परमेश्वर का अनुशासन और शिक्षण ग्रहण करता है।
- issue: תּוֹרָה का अर्थ-क्षेत्र
  choice: व्यवस्था
  alternative: शिक्षा / निर्देश
  rationale: ‘व्यवस्था’ पारंपरिक और प्रसंगोचित है, पर इब्रानी शब्द का अर्थ केवल विधिक नियमों तक सीमित नहीं; इसलिए व्यापक अर्थ पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण काव्यात्मक शैली रखी गई है। परमेश्वर के सीधे संबोधन में एकवचन ‘तू’ मूल के एकवचन रूप और हिन्दी बाइबलीय-काव्य परंपरा के अनुरूप है। वाक्य को सहज बनाने के लिए एक ही सम्बन्धवाचक संरचना के अंतर्गत ‘अनुशासित करता है’ और ‘शिक्षा देता है’ समन्वित किए गए हैं।
