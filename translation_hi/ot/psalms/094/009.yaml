id: PSA.94.9
reference: Psalms 94:9
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: הֲ/נֹ֣טַֽע אֹ֭זֶן הֲ/לֹ֣א יִשְׁמָ֑ע אִֽם יֹ֥צֵֽר עַ֝֗יִן הֲ/לֹ֣א יַבִּֽיט־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/094/009.yaml
  text: He who planted the ear[a], does he not hear? He who formed the eye[b], does he not see?
translation:
  language: hi
  text: जिसने कान रोपा[a], क्या वह नहीं सुनता? जिसने आँख रची, क्या वह नहीं देखता[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘कान को लगाया।’ इब्रानी क्रिया का शाब्दिक अर्थ ‘रोपना’ है; यहाँ सृष्टि का सजीव रूपक है।
    reason: lexical_alternative
  - marker: b
    text: अंतिम क्रिया का अधिक शाब्दिक अर्थ ‘निहारना’ या ‘दृष्टि डालना’ भी हो सकता है; यहाँ आशय देखने की क्षमता से है।
    reason: lexical_alternative
lexical_decisions:
- source_word: נֹטַע
  choice: रोपा
  rationale: मूल क्रिया का शाब्दिक अर्थ ‘रोपना’ है। ‘बनाया’ की अपेक्षा ‘रोपा’ सृष्टिकर्ता की सजीव और असामान्य रूपकात्मक छवि को सुरक्षित रखता है।
- source_word: אֹזֶן
  choice: कान
  rationale: यह भौतिक कान का सामान्य अर्थ है; इब्रानी के एकवचन और ‘आँख’ के साथ काव्यात्मक समानांतरता को रखा गया है।
- source_word: יִשְׁמָע
  choice: सुनता
  rationale: यहाँ क्रिया सुनने की क्षमता बताती है, न कि मुख्यतः ध्यान देकर सुनना या आज्ञा मानना।
- source_word: יֹצֵר
  choice: रची
  rationale: क्रिया יצר आकार देने या गढ़ने का भाव रखती है। ‘रची’ हिन्दी में स्वाभाविक है और सृष्टिकर्ता के सायास निर्माण का भाव प्रकट करती है।
- source_word: עַיִן
  choice: आँख
  rationale: मूल अर्थ भौतिक आँख है; एकवचन कान के साथ काव्यात्मक संतुलन बनाए रखता है।
- source_word: יַבִּיט
  choice: देखता
  rationale: נבט अधिक शाब्दिक रूप से ‘निहारना’ या ‘दृष्टि डालना’ हो सकता है, पर इस संदर्भ में आँख के अनुरूप देखने की क्षमता अभिप्रेत है; ‘देखता’ सहज हिन्दी है।
- source_word: הֲ...הֲלֹא
  choice: क्या वह नहीं ...?
  rationale: प्रश्नवाचक और नकारात्मक रूप ऐसे आलंकारिक प्रश्न बनाते हैं जिनका अपेक्षित उत्तर ‘हाँ’ है। हिन्दी रूप प्रश्न और निहित पुष्टि दोनों सुरक्षित रखता है।
- source_word: אִם
  choice: जिसने
  rationale: यहाँ אִם दूसरे समानांतर आलंकारिक प्रश्न को जोड़ता है; हिन्दी में उसे अलग से ‘यदि’ या ‘या यदि’ कहना अस्वाभाविक होगा। ‘जिसने’ पहले खंड के समानांतर विन्यास को स्पष्ट रखता है।
theological_decisions:
- issue: परमेश्वर की अनुभूति के लिए मानव-सदृश भाषा
  choice: सृष्टिकर्ता और प्राणी के बीच तर्क करने वाली कान, सुनने, आँख और देखने की ठोस भाषा को बनाए रखा गया है।
  alternative: 'भावार्थ देना: ‘जिसने सुनने और देखने की क्षमता दी, वह निश्चय ही सब जानता है।’'
  rationale: पद स्वयं सृष्टिकर्ता से प्राणी की क्षमताओं तक आलंकारिक तर्क करता है। अमूर्त व्याख्या जोड़ने के बजाय मूल बिंब और उसका धर्मवैचारिक तनाव सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, काव्यात्मक और गरिमापूर्ण प्रश्नवाचक शैली रखी गई है। ‘कान रोपा’ जानबूझकर असामान्य है, क्योंकि मूल इब्रानी का सृष्टि-रूपक भी सजीव और असामान्य है। दोनों फुटनोट-चिह्न मुख्य पाठ में उपस्थित हैं।
