  yaml_path: translation/ot/psalms/094/004.yaml
  text: They gush forth[a]; they speak arrogantly[b]; all the workers of wickedness boast.
translation:
  language: hi
  text: वे बातें उंडेलते हैं[a] और घमंड से बोलते हैं[b]; सभी बुराई करनेवाले डींगें हाँकते हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “वे उमड़कर बोलते हैं।”
    reason: मूल क्रिया में फूट निकलने या उमड़कर बहने का भाव है; ‘बातें’ सन्दर्भ से निहित है, मूल में अलग से नहीं लिखा।
  - marker: b
    text: या “घमंड की बातें बोलते हैं” अथवा “धृष्टता से बोलते हैं।”
    reason: मूल शब्द को घमंडी वाणी के विषय या बोलने के ढंग—दोनों रूपों में समझा जा सकता है।
lexical_decisions:
- source_word: יַבִּיעוּ
  choice: वे बातें उगलते हैं
  rationale: हिफ़ील रूप किसी वस्तु के फूट निकलने या बह निकलने का सजीव भाव देता है। यहाँ समानांतर क्रिया ‘बोलते हैं’ से वाणी अभिप्रेत है; इसलिए स्वाभाविक हिन्दी के लिए ‘बातें’ जोड़ा गया है और ‘उगलते हैं’ ने मूल की प्रबल छवि बनाए रखी है।
- source_word: יְדַבְּרוּ
  choice: बोलते हैं
  rationale: यह דבר का सीधा, सामान्य और वर्तमान हिन्दी में स्वाभाविक अनुवाद है।
- source_word: עָתָק
  choice: घमंड से
  rationale: यह शब्द उद्धत, अहंकारी या धृष्ट वाणी को सूचित करता है। क्रिया-विशेषण रूप हिन्दी में सहज है और वाणी के ढंग को स्पष्ट करता है।
- source_word: יִתְאַמְּרוּ
  choice: डींग मारते हैं
  rationale: हित्पएल रूप आत्म-प्रशंसा या अपने को बड़ा ठहराने का भाव रखता है। ‘डींग मारते हैं’ बोलचाल में बोधगम्य होते हुए भी काव्य की निंदा और वाचिक घमंड को व्यक्त करता है।
- source_word: כָּל
  choice: सभी
  rationale: बहुवचन समूह की समग्रता को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: פֹּעֲלֵי אָוֶן
  choice: बुराई करनेवाले
  rationale: शाब्दिक अर्थ ‘बुराई/अनर्थ के काम करनेवाले’ है। ‘बुराई करनेवाले’ मूल नैतिक अर्थ को स्पष्ट और साधारण आधुनिक हिन्दी में रखता है।
