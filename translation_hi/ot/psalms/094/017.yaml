base_translation:
  language: en
  yaml_path: translation/ot/psalms/094/017.yaml
  text: If Yahweh had not been my help[b][a], my soul would soon have dwelt in silence.
translation:
  language: hi
  text: 'यदि याहवे मेरे सहायक न होते,

    तो मेरा प्राण[a] लगभग मौन[b] में जा बसा होता।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘मेरा जीवन’ अथवा ‘मैं स्वयं’; इब्रानी शब्द नेफ़ेश व्यक्ति, प्राण या जीवन को सूचित कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: यहाँ ‘मौन’ संभवतः मृत्यु या अधोलोक के मौन की ओर संकेत करता है।
    reason: alternative_reading
lexical_decisions:
- source_word: לוּלֵי
  choice: यदि ... न होता
  rationale: यह अवास्तविक भूतकाल की शर्त व्यक्त करता है; आधुनिक हिन्दी में यह रूप स्वाभाविक और अर्थ-सटीक है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी परमेश्वर के व्यक्तिगत नाम का देवनागरी लिप्यंतरण किया गया है, न कि उसके स्थान पर कोई उपाधि रखी गई है।
- source_word: עֶזְרָתָה לִּי
  choice: मेरी सहायता
  rationale: यह पदबंध भजनकार के लिए याहवे को उसकी सहायता के रूप में प्रस्तुत करता है।
- source_word: כמעט
  choice: लगभग
  rationale: यह परिणाम के अत्यंत निकट आ जाने का भाव बनाए रखता है; ‘शीघ्र ही’ भी संभव है, पर वह निकटता की अपेक्षा समय पर अधिक बल देता है।
- source_word: שָׁכְנָה
  choice: जा बसा होता
  rationale: मूल क्रिया का अर्थ बसना या निवास करना है; यह चयन मौन में स्थायी रूप से पहुँच जाने की काव्यात्मक छवि सुरक्षित रखता है।
- source_word: דוּמָה
  choice: मौन
  rationale: मूल संज्ञा का सीधा अर्थ मौन है, यद्यपि यहाँ उसका संकेत मृत्यु या अधोलोक की ओर हो सकता है।
- source_word: נַפְשִׁי
  choice: मेरा प्राण
  rationale: נפשׁ व्यक्ति, जीवन या प्राण का बोध करा सकता है। ‘मेरा प्राण’ हिन्दी की काव्यात्मक शैली में मूल मानवीय अभिव्यक्ति और उसकी अर्थ-व्याप्ति को काफी हद तक बनाए रखता है।
theological_decisions:
- issue: क्या דומה में निहित मृत्यु या अधोलोक के संकेत को मुख्य पाठ में स्पष्ट किया जाए
  choice: मुख्य पाठ में शाब्दिक ‘मौन’ रखना
  alternative: मृत्यु का मौन; अधोलोक
  rationale: संदर्भ संभवतः मृत्यु की ओर संकेत करता है, लेकिन इब्रानी शब्द स्वयं ‘मौन’ कहता है। इसलिए मुख्य पाठ मूल की काव्यात्मक और धर्मवैचारिक अस्पष्टता बनाए रखता है, जबकि पादटिप्पणी संभावित संकेत स्पष्ट करती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और काव्यात्मक रखी गई है। ‘जा बसा होता’ मूल के निवास-संबंधी रूपक को स्वाभाविक हिन्दी में बनाए रखता है; पंक्ति-विभाजन इब्रानी काव्य की शर्त और परिणाम की संरचना को स्पष्ट करता है।
