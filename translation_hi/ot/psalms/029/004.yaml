lexical_decisions:
- source_word: קוֹל
  choice: वाणी
  rationale: यह शब्द ‘आवाज़’ या ‘वाणी’ हो सकता है। इस भजन में बार-बार आने वाले सूत्र में ‘वाणी’ याहवे के सक्रिय और प्रभावशाली उच्चारण को व्यक्त करती है तथा गरिमापूर्ण हिंदी में स्वाभाविक है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुराक्षरीय निज नाम को किसी उपाधि से बदलने के बजाय ‘याहवे’ के रूप में लिप्यंतरित किया गया है।
- source_word: בַּכֹּחַ
  choice: शक्तिशाली
  rationale: בְּ के साथ संज्ञा यहाँ वर्णनात्मक अर्थ दे सकती है। ‘शक्तिशाली’ सहज आधुनिक हिंदी में वाणी के सामर्थ्य को स्पष्ट करता है; अधिक शाब्दिक संरचना पादटिप्पणी में दी गई है।
- source_word: הָדָר
  choice: प्रतापमय
  rationale: הָדָר वैभव, प्रताप और राजसी महिमा का बोध कराता है। ‘प्रतापमय’ इस भजन के राजसी और ईश-दर्शनात्मक स्वर को बनाए रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में निज नाम יְהוָה है। ‘याहवे’ उस नाम को प्रत्यक्ष रखता है, जबकि ‘प्रभु’ उसे एक उपाधि से बदल देता है।
- issue: בְּ युक्त पदों का वर्णनात्मक या सहचारी अर्थ
  choice: शक्तिशाली … प्रतापमय
  alternative: सामर्थ्य के साथ … प्रताप के साथ
  rationale: इब्रानी व्याकरण दोनों प्रकार की समझ की अनुमति देता है। मुख्य पाठ में स्वाभाविक वर्णनात्मक हिंदी रखी गई है और संरचनात्मक विकल्प पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध हिंदी। समानांतर काव्य-रचना और दोनों अर्धपंक्तियों में ‘याहवे की वाणी’ की पुनरावृत्ति सुरक्षित रखी गई है।
