    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत नाम YHWH का आधुनिक हिन्दी में सीधा लिप्यंतरण; इसे किसी उपाधि से बदलने के बजाय मूल नाम सुरक्षित रखा गया है।
- source_word: לַמַּבּוּל
  choice: जलप्रलय के ऊपर
  rationale: מַבּוּל प्रलयंकारी बाढ़ अथवा महाजलप्रलय को सूचित करता है। לְ को यहाँ सिंहासन और प्रभुता के स्थान-संबंधी अर्थ में लेकर ‘के ऊपर’ किया गया है, जिससे अराजक जलों पर याहवे की संप्रभुता व्यक्त होती है।
- source_word: יָשָׁב
  choice: सिंहासन पर विराजमान था
  rationale: मूल अर्थ ‘बैठा’ है, पर राजकीय संदर्भ और अगली पंक्ति के ‘राजा’ के कारण यहाँ सिंहासनासीन होने का भाव है। भूतकालीन रूप को सुरक्षित रखा गया है।
- source_word: וַיֵּשֶׁב
  choice: सिंहासन पर विराजमान है
  rationale: रूप पिछली क्रिया को आगे बढ़ा सकता है, किंतु לְעוֹלָם के साथ यह स्थायी और वर्तमान राजत्व को व्यक्त करता है; इसलिए स्वाभाविक हिन्दी वर्तमान काल चुना गया है।
- source_word: מֶלֶךְ
  choice: राजा बनकर
  rationale: यहाँ מֶלֶךְ विधेय रूप में याहवे की राजकीय हैसियत बताता है। ‘राजा बनकर’ का अर्थ राजा हो जाने की घटना नहीं, बल्कि राजा के रूप में विराजमान रहने की स्थिति है।
- source_word: לְעוֹלָם
  choice: सदा के लिए
  rationale: दीर्घकालिक, निरंतर और अनंत अवधि के मूल भाव का स्पष्ट, सामान्य आधुनिक हिन्दी रूप।
theological_decisions:
- issue: क्या מַבּוּל विशेष रूप से नूह के जलप्रलय का उल्लेख करता है या सामान्य प्रलयंकारी बाढ़/अराजक जलों का
  choice: मुख्य पाठ में ‘जलप्रलय’ रखा गया है और नूह का नाम नहीं जोड़ा गया।
  alternative: ‘महाजलप्रलय’, अर्थात विशेष रूप से नूह का जलप्रलय
  rationale: इब्रानी शब्द प्रायः आदिकालीन जलप्रलय से जुड़ा है, पर इस पद में नूह का स्पष्ट उल्लेख नहीं है और भजन 29 का निकट संदर्भ तूफ़ानी ईश्वर-प्रकाशन है। मुख्य पाठ दोनों संभावनाओं को खुला रखता है।
- issue: יָשַׁב को सामान्यतः ‘बैठना’ मानें या राजकीय सिंहासनासीनता के अर्थ में
  choice: ‘सिंहासन पर विराजमान’
  alternative: ‘बैठा था/बैठा है’
  rationale: समानांतर पंक्ति में ‘राजा’ आने से राजकीय अर्थ स्पष्ट होता है। यह चयन अंतर्निहित सिंहासन-चित्र को स्वाभाविक हिन्दी में व्यक्त करता है, बिना अतिरिक्त धर्मसैद्धांतिक निष्कर्ष जोड़े।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य हिन्दी पाठक के लिए स्पष्ट रखी गई है। ‘विराजमान’ राजकीय संदर्भ के अनुकूल है; ‘याहवे’ मूल दिव्य नाम को सुरक्षित रखता है।
