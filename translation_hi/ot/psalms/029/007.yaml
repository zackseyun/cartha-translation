lexical_decisions:
- source_word: קוֹל
  choice: वाणी
  rationale: यह शब्द ‘वाणी’ या ‘ध्वनि’ हो सकता है। भजन में बार-बार आने वाली अभिव्यक्ति और परमेश्वर के सामर्थी कथन का काव्यात्मक भाव बनाए रखने के लिए ‘वाणी’ चुना गया।
- source_word: יְהוָה
  choice: याहवे
  rationale: मूल पाठ में प्रयुक्त परमेश्वर के व्यक्तिगत नाम को उपाधि से बदलने के बजाय देवनागरी में लिप्यंतरित किया गया।
- source_word: חֹצֵב
  choice: चीर निकालती है
  rationale: इस क्रिया का मूल भाव पत्थर आदि को काटने या तराशकर निकालने का है। यहाँ यह आग की लपटों के प्रकट होने का सजीव और प्रबल चित्र प्रस्तुत करती है; स्त्रीलिंग क्रिया ‘वाणी’ के अनुरूप है।
- source_word: לַהֲבוֹת
  choice: लपटों
  rationale: शब्द का सीधा अर्थ आग की लपटें या ज्वालाएँ है। तूफ़ान के संदर्भ में इससे बिजली की चमकें अभिप्रेत हो सकती हैं, जिसे टिप्पणी में रखा गया है।
- source_word: אֵשׁ
  choice: आग की
  rationale: यह सामान्यतः ‘आग’ है और ‘लपटों’ के साथ मिलकर मूल की बलपूर्ण काव्यात्मक अभिव्यक्ति को बनाए रखता है।
theological_decisions:
- issue: तूफ़ान के चित्र में ईश्वरीय कर्तृत्व को रखते हुए इसे आधुनिक मौसम-विज्ञान की भाषा में सीमित न करना
  choice: ‘आग की लपटों को चीर निकालती है’ के ठोस काव्यात्मक चित्र को मुख्य पाठ में रखा गया।
  alternative: ‘बिजली की चमकें निकालती है’ अथवा ‘बिजली चमकाती है।’
  rationale: संदर्भ में बिजली की चमकें संभावित आशय हैं, पर मूल भाषा ‘आग की लपटें’ कहती है। मुख्य पाठ उस रूपक को सुरक्षित रखता है और संभावित संदर्भ को पाद-टिप्पणी में बताता है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी। ‘चीर निकालती है’ मूल क्रिया की ठोस शक्ति को रखता है, जबकि पाद-टिप्पणी तूफ़ान और बिजली के संभावित आशय को स्पष्ट करती है।
