base_translation:
  language: en
  yaml_path: translation/ot/psalms/029/009.yaml
  text: The voice of Yahweh makes the deer give birth and strips the forests bare[a], and in his temple all say[b], “Glory!”
translation:
  language: hi
  text: याहवे की वाणी हिरनियों को बच्चे जनने के लिए विवश करती है और वनों को नंगा कर देती है[a], और उसके मंदिर[b] में सब कहते हैं, “महिमा!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “हिरनियों को तड़पा देती है,” अथवा “हिरनियों को प्रसव-वेदना से तड़पा देती है।”
    reason: lexical_alternative
  - marker: b
    text: इब्रानी शब्द का अर्थ “मंदिर” या “महल” हो सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: ק֤וֹל יְהוָ֨ה
  choice: याहवे की वाणी
  rationale: रचनात्मक संबंध को सीधे रखा गया है। परमेश्वर के व्यक्तिगत नाम יהוה को ‘याहवे’ के रूप में लिप्यंतरित किया गया है।
- source_word: יְחוֹלֵ֣ל אַיָּלוֹת֮
  choice: हिरनियों को प्रसव कराती है
  rationale: חול यहाँ प्रसव-वेदना से तड़पने अथवा बच्चे जनने का भाव दे सकता है, और אַיָּלוֹת मादा हिरनों को दर्शाता है। मुख्य पाठ में प्रसव का स्वाभाविक अर्थ रखा गया और व्यापक शाब्दिक संभावना पादटिप्पणी में दी गई है।
- source_word: וַֽיֶּחֱשֹׂ֪ף יְעָ֫ר֥וֹת
  choice: और वनों को नंगा कर देती है
  rationale: חשׂף का अर्थ खोल देना या आवरण उतार देना है। यह अनुवाद आँधी के प्रचंड प्रभाव को चित्रात्मक और संक्षिप्त रूप से व्यक्त करता है।
- source_word: וּבְהֵיכָלוֹ
  choice: उसके मन्दिर में
  rationale: הֵיכָל का अर्थ ‘मन्दिर’ या ‘महल’ हो सकता है। स्तुति के प्रसंग में ‘मन्दिर’ मुख्य पाठ में उपयुक्त है; ‘महल’ को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: כֻּלּוֹ אֹמֵר
  choice: सब कहते हैं
  rationale: एकवचन कृदन्त אֹמֵר सामूहिक अथवा वितरणात्मक अर्थ में כֻּלּוֹ के साथ प्रयुक्त है। हिन्दी में बहुवचन ‘सब कहते हैं’ इसका स्वाभाविक रूप है।
- source_word: כָּבֽוֹד
  choice: महिमा!
  rationale: एक-शब्दीय जयघोष के रूप में ‘महिमा!’ כבוד के आराधनात्मक भार और पद की संक्षिप्तता को बनाए रखता है।
theological_decisions:
- issue: הֵיכָל का अर्थ और याहवे से उसका संबंध
  choice: मन्दिर
  alternative: महल
  rationale: आराधना और ‘महिमा!’ के जयघोष का प्रसंग ‘मन्दिर’ का समर्थन करता है। फिर भी राजकीय अर्थ ‘महल’ संभव है और भजन में याहवे की राजसत्ता से मेल खाता है, इसलिए उसे पादटिप्पणी में रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और काव्यात्मक रखी गई है। ‘हिरनियों’ से मूल के स्त्रीलिंग बहुवचन को स्पष्ट किया गया है; ‘वनों को नंगा’ तूफान के सजीव बिंब को बिना अतिरिक्त व्याख्या के बनाए रखता है। सभी पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित हैं।
