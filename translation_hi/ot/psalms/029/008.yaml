  yaml_path: translation/ot/psalms/029/008.yaml
  text: The voice of Yahweh shakes the wilderness[a]; Yahweh shakes the wilderness of Kadesh.
translation:
  language: hi
  text: 'याहवे की वाणी निर्जन प्रदेश को कँपा देती है[a];

    याहवे कादेश के निर्जन प्रदेश को कँपा देते हैं।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “निर्जन प्रदेश को मरोड़ देती है” अथवा “निर्जन प्रदेश को थरथरा देती है।”
    reason: lexical_alternative
lexical_decisions:
- source_word: ק֣וֹל
  choice: वाणी
  rationale: भजन 29 में यह पदबंध काव्यात्मक टेक के रूप में आता है। ‘वाणी’ परमेश्वर के व्यक्तिगत और सक्रिय स्वर को बनाए रखती है; केवल ‘ध्वनि’ कहना इसे अधिक निर्जीव बना देता।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय देवनागरी में ‘याहवे’ लिखा गया है।
- source_word: יָחִיל
  choice: कँपा देती है / कँपा देते हैं
  rationale: חול के हिफ़ील रूप में कँपाने, थरथराने या ऐंठने को विवश करने का भाव हो सकता है। यहाँ सृष्टि पर याहवे की वाणी के प्रभाव के लिए ‘कँपा देना’ स्वाभाविक और सजीव हिंदी है; क्रिया का लिंग क्रमशः ‘वाणी’ और ‘याहवे’ के अनुसार रखा गया है।
- source_word: מִדְבָּר
  choice: निर्जन प्रदेश
  rationale: यह शब्द अनावाद या कम आबादी वाले खुले भूभाग को सूचित करता है। ‘निर्जन प्रदेश’ इस व्यापक अर्थ को बनाए रखता है, जबकि ‘रेगिस्तान’ इसे केवल शुष्क मरुस्थल तक सीमित कर सकता है और ‘जंगल’ आधुनिक हिंदी में प्रायः वन का बोध कराता है।
- source_word: מִדְבַּר קָדֵשׁ
  choice: कादेश का निर्जन प्रदेश
  rationale: सम्बन्धवाचक इब्रानी संरचना को स्वाभाविक हिंदी में ‘कादेश का निर्जन प्रदेश’ कहा गया है और स्थान-नाम को लिप्यंतरित किया गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा अथवा ‘प्रभु’
  rationale: मूल पाठ व्यक्तिगत ईश्वरीय नाम का स्पष्ट प्रयोग करता है। ‘याहवे’ उस नाम को उपाधि से प्रतिस्थापित किए बिना सुरक्षित रखता है।
- issue: יָחִיל में निहित सृष्टि की प्रतिक्रिया
  choice: कँपा देती है / कँपा देते हैं
  alternative: ऐंठने को विवश करती है / थरथरा देती है
  rationale: मूल क्रिया की अर्थ-सीमा में कँपना और ऐंठना दोनों संभव हैं। मुख्य पाठ में सहज अर्थ रखा गया है और अधिक तीव्र संभावित अर्थ को पादटिप्पणी में सुरक्षित रखा गया है, ताकि काव्यात्मक तनाव अनावश्यक रूप से निश्चित न हो।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। समानांतर पंक्तियों और ‘याहवे’ की पुनरावृत्ति को इब्रानी कविता के अनुरूप सुरक्षित रखा गया है। पादटिप्पणी-चिह्न [a] मुख्य पाठ में उपस्थित है।
