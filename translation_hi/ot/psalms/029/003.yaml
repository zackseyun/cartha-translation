language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: ק֥וֹל יְהוָ֗ה עַל הַ֫/מָּ֥יִם אֵֽל הַ/כָּב֥וֹד הִרְעִ֑ים יְ֝הוָ֗ה עַל מַ֥יִם רַבִּֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/029/003.yaml
  text: The voice of Yahweh is over the waters[a]; the God of glory thunders[b], Yahweh is over many waters.
translation:
  language: hi
  text: 'याहवे की वाणी जलराशियों के ऊपर है;

    महिमा का परमेश्वर गरजता है;

    याहवे अपार जलराशियों के ऊपर है।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ק֥וֹל
  choice: वाणी
  rationale: यहाँ शब्द याहवे की सामर्थी, व्यक्तिगत अभिव्यक्ति को दर्शाता है और पूरे भजन में गर्जन की छवि से जुड़ा है; ‘आवाज़’ की तुलना में ‘वाणी’ अधिक गरिमापूर्ण काव्यात्मक रूप है।
- source_word: יְהוָ֗ה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय लिप्यंतरित किया गया है।
- source_word: עַל הַמָּיִם
  choice: जलराशियों के ऊपर
  rationale: ‘ऊपर’ עַל का स्थानसूचक अर्थ व्यक्त करता है, और बहुवचन ‘जलराशियाँ’ तूफ़ान तथा विशाल जल के काव्यात्मक दृश्य को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: אֵל הַכָּבוֹד
  choice: महिमा का परमेश्वर
  rationale: यह रूप इब्रानी संबंधवाचक संरचना ‘महिमा का परमेश्वर’ को सुरक्षित रखता है; ‘महिमामय परमेश्वर’ सम्भव है, पर वह संबंध को विशेषण में बदल देता है।
- source_word: הִרְעִים
  choice: गरजता है
  rationale: रעם का सीधा अर्थ ‘गरजना’ है। हिन्दी का वर्तमान काल भजन में तूफ़ान के सजीव और तात्कालिक चित्रण को सहजता से व्यक्त करता है।
- source_word: מַיִם רַבִּים
  choice: अपार जलराशियाँ
  rationale: शाब्दिक ‘बहुत से जल’ आधुनिक हिन्दी में अस्वाभाविक है; ‘अपार जलराशियाँ’ विशाल अथवा प्रचुर जल का काव्यात्मक भाव स्पष्ट करता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: प्रभु
  rationale: मूल पाठ व्यक्तिगत ईश्वरीय नाम का प्रयोग करता है; ‘याहवे’ उसे उपाधि में बदले बिना सुरक्षित रखता है।
- issue: गर्जन को परमेश्वर की वाणी के रूप में प्रस्तुत करना
  choice: ‘वाणी’ और ‘गरजता है’ दोनों छवियाँ बनाए रखी गईं
  alternative: ‘याहवे का गर्जन’ कहकर दोनों को एक कर देना
  rationale: मूल कविता तूफ़ान की गर्जना और याहवे की वाणी को साथ रखती है; इन्हें अलग किंतु सम्बद्ध रूप में रखना उसकी काव्यात्मक और धर्मवैचारिक शक्ति सुरक्षित रखता है।
- issue: अन्तिम खंड में निहित क्रिया
  choice: ‘है’ जोड़ा गया
  alternative: ‘याहवे अपार जलराशियों के ऊपर’
  rationale: इब्रानी का अन्तिम खंड क्रियारहित है, पर हिन्दी में स्वतंत्र और स्पष्ट समानांतर कथन बनाने के लिए निहित ‘है’ देना आवश्यक और स्वाभाविक है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण काव्यात्मक रूप अपनाया गया है। तीन समानांतर पंक्तियाँ इब्रानी पद की लय और संरचना को स्पष्ट करती हैं; भाषा सामान्य पाठक के लिए सहज रखते हुए तूफ़ान-प्रकाशन की ऊँची शैली बनाए रखती है।
