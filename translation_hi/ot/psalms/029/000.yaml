  text: A psalm of David. Ascribe to Yahweh[a], sons of the mighty, ascribe to Yahweh glory and strength.
translation:
  language: hi
  text: 'दाऊद का एक भजन।


    हे देवपुत्रो, यहोवा को अर्पित करो;

    यहोवा को महिमा और सामर्थ्य अर्पित करो।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִזְמוֹר לְדָוִד
  choice: दाऊद का एक भजन
  rationale: शीर्षक को स्वाभाविक हिन्दी में रखा गया है; לְדָוִד यहाँ संबंध/लेखकत्व दर्शा सकता है, और पारंपरिक संक्षिप्त रूप मूल की गरिमा बनाए रखता है।
- source_word: הָבוּ
  choice: दो
  rationale: दो बार आए बहुवचन आदेश की पुनरावृत्ति सुरक्षित रखी गई है। संदर्भ में इसका अर्थ यहोवा की महिमा और सामर्थ्य को स्वीकार करके उनका गुणगान करना है।
- source_word: לַיהוָה
  choice: यहोवा को
  rationale: चार-अक्षरीय दिव्य नाम को सामान्य हिन्दी बाइबलीय रूप ‘यहोवा’ से व्यक्त किया गया है, न कि उपाधि ‘प्रभु’ से।
- source_word: בְּנֵי אֵלִים
  choice: हे देवपुत्रो
  rationale: शाब्दिक संरचना ‘ईश्वरीय/दैवी प्राणियों के पुत्र’ है और प्रसंग संभवतः स्वर्गीय सभा के सदस्यों को संबोधित करता है। ‘देवपुत्र’ संक्षिप्त रूप में दैवी/स्वर्गीय प्राणियों का संकेत देता है, जबकि विकल्प पादटिप्पणी में दिए गए हैं।
- source_word: כָּבוֹד וָעֹז
  choice: महिमा और सामर्थ्य
  rationale: दोनों संज्ञाओं को अलग रखते हुए काव्यात्मक और धार्मिक अर्थ सुरक्षित रखा गया है।
theological_decisions:
- issue: בְּנֵי אֵלִים की पहचान
  choice: मुख्य पाठ में ‘देवपुत्रो’
  alternative: ‘परमेश्वर के पुत्रो’, ‘हे स्वर्गीय प्राणियो’, या ‘सामर्थियों के पुत्रो’
  rationale: इब्रानी पदबंध स्वर्गीय सभा के सदस्यों की ओर संकेत करता जान पड़ता है, लेकिन उनकी ठीक पहचान स्पष्ट नहीं करता। मुख्य पाठ मूल रूपक को बनाए रखता है और पादटिप्पणी वास्तविक विकल्पों को दर्ज करती है।
- issue: यहोवा को ‘महिमा और सामर्थ्य देने’ का आशय
  choice: मूल आदेशात्मक भाषा ‘दो’ को बनाए रखा
  alternative: ‘यहोवा की महिमा और सामर्थ्य का गुणगान करो’ या ‘उन्हें अर्पित करो’
  rationale: ‘दो’ स्रोत के निकट है और इस धार्मिक-काव्यात्मक तनाव को नहीं मिटाता कि ये गुण परमेश्वर में पहले से विद्यमान हैं, फिर भी उपासकों को उन्हें परमेश्वर का मानकर घोषित करने का आदेश है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और काव्यात्मक हिन्दी अपनाई गई है। इब्रानी समानांतरता और दोहराए गए आदेश को बनाए रखा गया है। संबोधन स्पष्ट करने के लिए ‘हे’ जोड़ा गया है; विराम-चिह्न हिन्दी पाठ में स्वाभाविक वाचन में सहायता करते हैं।
