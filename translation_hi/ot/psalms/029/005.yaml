  yaml_path: translation/ot/psalms/029/005.yaml
  text: The voice of Yahweh breaks cedars[b][a]; Yahweh shatters the cedars of Lebanon.
translation:
  language: hi
  text: 'याहवे की वाणी देवदारों को तोड़ डालती है[a];

    याहवे लबानोन के देवदारों को चकनाचूर कर देता है।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “याहवे की ध्वनि।” इब्रानी קוֹל का अर्थ “वाणी” या “ध्वनि” हो सकता है। यहाँ “वाणी” भजन में याहवे के व्यक्तिगत, गर्जनापूर्ण कथन के बार-बार किए गए चित्रण को बनाए रखती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: קוֹל יְהוָה
  choice: याहवे की वाणी
  rationale: קוֹל का अर्थ ‘वाणी’ या ‘ध्वनि’ हो सकता है। भजन में बार-बार आने वाले इस पदबंध के व्यक्तिगत और ईश-प्रकाशनात्मक स्वरूप को बनाए रखने के लिए ‘वाणी’ चुना गया है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को उपाधि से बदलने के बजाय हिंदी में प्रचलित निकट लिप्यंतरण ‘याहवे’ से प्रस्तुत किया गया है।
- source_word: שֹׁבֵר
  choice: तोड़ डालती है
  rationale: काल का कृदंत यहाँ सजीव वर्तमान क्रिया व्यक्त करता है। ‘तोड़ डालती है’ मूल क्रिया की शक्ति को स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: אֲרָזִים
  choice: देवदारों
  rationale: बहुवचन संज्ञा को सामान्य रूप से ‘देवदारों’ कहा गया है; ‘देवदार के पेड़ों’ की अतिरिक्त स्पष्टता आवश्यक नहीं है।
- source_word: וַיְשַׁבֵּר
  choice: चकनाचूर कर देता है
  rationale: मूल में שבר धातु दोनों पंक्तियों में दोहराई गई है। दूसरी पंक्ति में ‘चकनाचूर’ समानांतरता की तीव्रता को स्वाभाविक हिंदी में उभारता है; काव्य-संदर्भ में इसे निरंतर वर्तमान क्रिया माना गया है।
- source_word: אֶת אַרְזֵי הַלְּבָנוֹן
  choice: लबानोन के देवदारों को
  rationale: समास पद प्रसिद्ध लबानोन-वासी देवदारों को सूचित करता है। यह रूप मूल संबंध को स्पष्ट और गरिमापूर्ण हिंदी में रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: पद में व्यक्तिगत चतुरक्षरीय नाम सीधे प्रयुक्त है। ‘याहवे’ उसे उपाधि से बदले बिना सुरक्षित रखता है और किसी संप्रदाय-विशेष की व्याख्या नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिंदी में संक्षिप्त, काव्यात्मक और गरिमापूर्ण शैली रखी गई है। स्त्रीलिंग ‘तोड़ डालती है’ निकटवर्ती कर्ता ‘वाणी’ के अनुरूप है, जबकि दूसरी पंक्ति में व्यक्तिवाचक कर्ता ‘याहवे’ के साथ पुल्लिंग क्रिया है। मूल की धातु-पुनरावृत्ति को हिंदी में ‘तोड़ डालती है ... चकनाचूर कर देता है’ द्वारा अर्थगत तीव्रता सहित प्रस्तुत किया गया है।
