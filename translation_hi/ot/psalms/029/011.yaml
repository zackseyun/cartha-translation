  text: יְֽהוָ֗ה עֹ֭ז לְ/עַמּ֣/וֹ יִתֵּ֑ן יְהוָ֓ה יְבָרֵ֖ךְ אֶת עַמּ֣/וֹ בַ/שָּׁלֽוֹם׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/029/011.yaml
  text: Yahweh gives strength to his people[b][a]; Yahweh blesses his people with peace.
translation:
  language: hi
  text: याहवे अपनी प्रजा को सामर्थ्य देता है[a]; याहवे अपनी प्रजा को शांति[b] की आशीष देता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “याहवे अपनी प्रजा को सामर्थ्य देगा; याहवे अपनी प्रजा को शांति की आशीष देगा।” हिब्रू की अपूर्ण क्रियाएँ भविष्यकाल का भाव भी व्यक्त कर सकती हैं।
    reason: alternative_reading
  - marker: b
    text: “शांति” के लिए प्रयुक्त हिब्रू शब्द शालोम में संपूर्णता, कुशलता और कल्याण का भाव भी सम्मिलित हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय उसका प्रचलित हिन्दी लिप्यंतरण रखा गया है।
- source_word: עֹז
  choice: सामर्थ्य
  rationale: यह संज्ञा शक्ति या बल को व्यक्त करती है; ‘सामर्थ्य’ हिन्दी में गरिमापूर्ण और इस प्रसंग में स्वाभाविक है।
- source_word: לְעַמּוֹ
  choice: अपनी प्रजा को
  rationale: לְ यहाँ अप्रत्यक्ष कर्म को चिह्नित करता है; संबंधवाचक प्रत्यय को स्वाभाविक हिन्दी में ‘अपनी’ से व्यक्त किया गया है।
- source_word: יִתֵּן
  choice: देता है
  rationale: हिब्रू अपूर्ण क्रिया को यहाँ परमेश्वर के सामान्य अथवा निश्चित कार्य की वर्तमानकालीन घोषणा समझा गया है; भविष्यकाल भी संभव है और पादटिप्पणी में दिया गया है।
- source_word: יְבָרֵךְ
  choice: आशीष देता है
  rationale: यह בּרך क्रिया का स्वाभाविक आधुनिक हिन्दी रूप है और पहले खंड के साथ समानांतर घोषणात्मक बल बनाए रखता है।
- source_word: אֶת עַמּוֹ
  choice: अपनी प्रजा को
  rationale: मूल के समान इस पदबंध की पुनरावृत्ति रखी गई है, जिससे काव्यात्मक समानांतरता बनी रहती है।
- source_word: בַשָּׁלוֹם
  choice: शांति की
  rationale: בְּ को हिन्दी में ‘आशीष देता है’ के साथ स्वाभाविक संबंध ‘शांति की आशीष’ द्वारा व्यक्त किया गया है; שָׁלוֹם का मुख्य अर्थ ‘शांति’ है, किंतु इसका दायरा अधिक व्यापक है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में व्यक्तिगत ईश्वरीय नाम है; इसलिए उसे उपाधि से प्रतिस्थापित किए बिना हिन्दी में लिप्यंतरित किया गया है।
- issue: יִתֵּן और יְבָרֵךְ क्रियाओं का काल/पक्ष
  choice: वर्तमान घोषणात्मक—‘देता है ... आशीष देता है’
  alternative: भविष्य—‘देगा ... आशीष देगा’; कामनार्थक—‘दे ... आशीष दे’
  rationale: भजन के समापन में इसे याहवे के अपनी प्रजा के प्रति निश्चित और चरित्रगत कार्य की घोषणा माना गया है। हिब्रू अपूर्ण रूप भविष्य का अर्थ भी दे सकता है, जिसे पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और सार्वजनिक पाठ के योग्य रूप। ‘प्रजा’ सामूहिक covenant people के भाव को संक्षेप में व्यक्त करती है; दोनों खंडों में इसकी पुनरावृत्ति हिब्रू समानांतरता को बनाए रखती है।
