    text: या, “वह उन्हें बछड़े के समान कुदाता है—लबानोन और सिर्योन को जंगली बैल के बच्चे के समान।” इब्रानी में पहले बहुवचन सर्वनाम “उन्हें” आता है और उसके बाद लबानोन तथा सिर्योन के नाम दिए गए हैं।
