id: PSA.29.2
reference: Psalms 29:2
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: הָב֣וּ לַֽ֭/יהוָה כְּב֣וֹד שְׁמ֑/וֹ הִשְׁתַּחֲו֥וּ לַ֝/יהוָ֗ה בְּ/הַדְרַת קֹֽדֶשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/029/002.yaml
  text: Ascribe to Yahweh the glory of his name[a]; worship Yahweh in holy splendor.
translation:
  language: hi
  text: 'याहवे को उसके नाम की महिमा दो;

    पवित्र वैभव में याहवे को दण्डवत् करो।[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “पवित्रता के वैभव में”; अथवा, “पवित्र वस्त्रों में।”
    reason: यह हिब्रू पदबंध पवित्र शोभा, पवित्रता के वैभव या धार्मिक वस्त्र-सज्जा के अर्थ में समझा जा सकता है।
lexical_decisions:
- source_word: הָבוּ
  choice: दो
  rationale: बहुवचन आज्ञार्थक क्रिया इस स्तुति-सूत्र में किसी वस्तु को सौंपने के बजाय महिमा अर्पित या स्वीकार करने का भाव रखती है। हिंदी में ‘महिमा दो’ संक्षिप्त, स्वाभाविक और उपासना-संदर्भ के अनुकूल है।
- source_word: לַיהוָה
  choice: याहवे को
  rationale: ל अप्रत्यक्ष कर्म को चिह्नित करता है, और परमेश्वर के विशिष्ट नाम יהוה को ‘याहवे’ के रूप में लिप्यंतरित किया गया है।
- source_word: כְּבוֹד שְׁמוֹ
  choice: उसके नाम की महिमा
  rationale: यह हिब्रू संबंध-वाक्यांश का निकट और स्वाभाविक हिंदी रूप है। यह नाम को मिलने योग्य महिमा का आशय व्यक्त करता है, पर ‘योग्य’ जोड़कर मूल से अधिक स्पष्ट नहीं करता।
- source_word: הִשְׁתַּחֲווּ
  choice: दण्डवत् करो
  rationale: क्रिया का मूल चित्र श्रद्धापूर्वक झुकने या भूमि पर गिरने का है। ‘दण्डवत् करो’ उपासना के भाव के साथ इस शारीरिक क्रिया को भी बनाए रखता है।
- source_word: בְּהַדְרַת קֹדֶשׁ
  choice: पवित्र वैभव में
  rationale: यह कठिन काव्यात्मक पदबंध पवित्रता के वैभव, पवित्र शोभा अथवा पवित्र वस्त्र-सज्जा का संकेत दे सकता है। ‘पवित्र वैभव में’ इसकी संक्षिप्तता और मूल अस्पष्टता को काफी हद तक बनाए रखता है।
theological_decisions:
- issue: יהוה परमेश्वर के नाम का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में वाचा का विशिष्ट नाम सीधे प्रयुक्त है। ‘याहवे’ उसका प्रचलित विद्वत्तापूर्ण लिप्यंतरण है और नाम को सामान्य उपाधि में नहीं बदलता।
- issue: בְּהַדְרַת קֹדֶשׁ का अर्थ
  choice: पवित्र वैभव में
  alternative: पवित्रता के वैभव में; पवित्र वस्त्रों में
  rationale: हिब्रू पदबंध अमूर्त पवित्र शोभा और ठोस धार्मिक वस्त्र-सज्जा, दोनों अर्थों के लिए खुला है। मुख्य पाठ में व्यापक काव्यात्मक रूप रखा गया है और ठोस विकल्प टिप्पणी में दिया गया है।
- issue: הִשְׁתַּחֲווּ में क्रिया और उपासना का संबंध
  choice: दण्डवत् करो
  alternative: आराधना करो; झुककर प्रणाम करो
  rationale: हिब्रू में शारीरिक रूप से झुकने की क्रिया है जो याहवे के प्रति होने के कारण आराधना व्यक्त करती है। चुना हुआ रूप दोनों पहलुओं को बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिंदी में संक्षिप्त, काव्यात्मक और गरिमापूर्ण शैली रखी गई है। ‘महिमा दो’ सामान्य पाठक के लिए सहज है, जबकि ‘दण्डवत् करो’ मूल क्रिया के दृश्य और उपासना-संबंधी बल को सुरक्षित रखता है।
