  text: A psalm of David. Ascribe to Yahweh[a], O sons of God, ascribe to Yahweh glory and strength.
translation:
  language: hi
  text: 'दाऊद का भजन।


    हे परमेश्वर के पुत्रों[a], यहोवा को मान दो;

    यहोवा को महिमा और सामर्थ्य का श्रेय दो।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “हे देवताओं के पुत्रों” अथवा “हे स्वर्गीय प्राणियों।” हिब्रू पदबंध संभवतः स्वर्गीय सभा के सदस्यों को सूचित करता है।
    reason: वैकल्पिक पाठ और कठिन हिब्रू पदबंध की व्याख्या
lexical_decisions:
- source_word: מִזְמוֹר
  choice: भजन
  rationale: भजन-संग्रह के शीर्षकों में यह स्थापित और स्वाभाविक हिन्दी पद है; इसमें गीत और आराधना-काव्य दोनों का भाव आता है।
- source_word: לְדָוִד
  choice: दाऊद का
  rationale: ल उपसर्ग लेखन, संबंध अथवा समर्पण सूचित कर सकता है। ‘दाऊद का’ इस अस्पष्टता को ‘दाऊद द्वारा रचित’ की अपेक्षा बेहतर सुरक्षित रखता है।
- source_word: הָבוּ
  choice: मान दो / श्रेय दो
  rationale: मूल क्रिया का शाब्दिक अर्थ ‘दो’ है, पर यहाँ भाव यहोवा की महिमा और सामर्थ्य को स्वीकार करके उन्हीं को उसका श्रेय देना है। पहली पंक्ति में ‘मान दो’ और दूसरी में ‘श्रेय दो’ आधुनिक हिन्दी में स्वाभाविक रूप से यही काव्यात्मक बल व्यक्त करते हैं।
- source_word: לַיהוָה
  choice: यहोवा को
  rationale: व्यक्तिगत वाचा-नाम יהוה को हिन्दी में प्रचलित प्रतिलेखन ‘यहोवा’ से व्यक्त किया गया है।
- source_word: בְּנֵי אֵלִים
  choice: हे परमेश्वर के पुत्रो
  rationale: यह मूल रूपक के निकट रहता है और पदबंध को केवल ‘स्वर्गीय प्राणी’ कहकर उसकी वास्तविक अस्पष्टता समाप्त नहीं करता। संबोधन को हिन्दी में ‘हे’ से स्पष्ट किया गया है।
- source_word: כָּבוֹד
  choice: महिमा
  rationale: यह כבוד का स्थापित धार्मिक और काव्यात्मक हिन्दी समतुल्य है।
- source_word: וָעֹז
  choice: और सामर्थ्य
  rationale: עז शक्ति या पराक्रम को दर्शाता है; ‘सामर्थ्य’ गरिमापूर्ण और सहज हिन्दी है तथा ‘महिमा’ के साथ उपयुक्त बैठता है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: प्रभु
  rationale: मूल में सामान्य उपाधि नहीं, चार अक्षरों वाला व्यक्तिगत ईश्वरीय नाम है; इसलिए उसे उपाधि से बदलने के बजाय प्रतिलेखित किया गया है।
- issue: בְּנֵי אֵלִים की पहचान
  choice: परमेश्वर के पुत्र
  alternative: स्वर्गीय प्राणी / देवताओं के पुत्र
  rationale: यह पदबंध संभवतः स्वर्गीय सभा के सदस्यों को संबोधित करता है, किंतु उसका रूप और आशय विवादित है। मुख्य पाठ हिब्रू रूपक को सुरक्षित रखता है और टिप्पणी संभावित अर्थ स्पष्ट करती है।
- issue: הָבוּ का आशय
  choice: मान दो / श्रेय दो
  alternative: दो
  rationale: ‘दो’ शाब्दिक है, किंतु हिन्दी में पहली पंक्ति को अधूरा और दूसरी को वस्तुगत हस्तांतरण जैसा बना सकता है। चुना गया रूप इस आराधनात्मक आज्ञा का भाव व्यक्त करता है, बिना यह दावा किए कि मनुष्य या स्वर्गीय प्राणी परमेश्वर को सामर्थ्य प्रदान करते हैं।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण काव्यात्मक रूप रखा गया है। ‘मान दो’ और ‘श्रेय दो’ सामान्य पाठक के लिए स्वाभाविक हैं, जबकि समानांतर पंक्तियों में मूल की पुनरावृत्ति और आराधनात्मक लय बनी रहती है।
