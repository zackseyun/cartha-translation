  text: यहाँ तक कि मेरा घनिष्ठ मित्र[a], जिस पर मैंने भरोसा किया, जो मेरी रोटी खाता था[b], उसने मेरे विरुद्ध अपनी एड़ी उठा ली है[c][d]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक अर्थ, “मेरी शांति का मनुष्य”; अर्थात वह व्यक्ति जिसके साथ मेरे शांतिपूर्ण सम्बन्ध थे—एक घनिष्ठ मित्र या विश्वस्त साथी।
    reason: lexical_alternative
  - marker: b
    text: या “जो मेरे साथ रोटी खाता था।” इब्रानी में शाब्दिक रूप से “मेरी रोटी खाता” है, जो साथ भोजन करने और आपसी भरोसे का बिम्ब है।
    reason: lexical_alternative
  - marker: c
    text: शाब्दिक रूप से, “उसने मेरे विरुद्ध एड़ी बड़ी की।” यह विश्वासघाती या शत्रुतापूर्ण कार्रवाई का इब्रानी मुहावरा है।
    reason: lexical_alternative
  - marker: d
    text: यूहन्ना 13:18 में यीशु ने अपने साथ होने वाले विश्वासघात के सम्बन्ध में इस पद को उद्धृत किया।
    reason: cross_reference
