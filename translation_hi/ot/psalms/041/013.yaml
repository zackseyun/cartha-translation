  yaml_path: translation/ot/psalms/041/013.yaml
  text: Blessed be Yahweh[a], the God of Israel, from everlasting to everlasting. Amen and Amen.
translation:
  language: hi
  text: इस्राएल के परमेश्वर याहवे[a] अनादिकाल से अनन्तकाल तक धन्य हों। आमीन और आमीन।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “याहवे” परमेश्वर के इब्रानी नाम יהוה का लिप्यंतरण है। “अनादिकाल से अनन्तकाल तक” का वैकल्पिक अनुवाद “सनातन काल से सनातन काल तक” हो सकता है; इब्रानी अभिव्यक्ति असीम कालावधि दर्शाती है।
    reason: divine_name_and_lexical_alternative
lexical_decisions:
- source_word: בָּרוּךְ
  choice: धन्य हों
  rationale: निष्क्रिय कृदन्त से बना यह स्तुतिपरक आशीर्वचन-सूत्र है। हिंदी में “धन्य हों” इसकी आराधनात्मक और मंगलोच्चारात्मक शक्ति को स्वाभाविक रूप से व्यक्त करता है।
- source_word: יְהוָה
  choice: यहवे
  rationale: चतुरक्षरीय ईश्वरीय नाम को किसी उपाधि से बदलने के बजाय हिंदी में उसके प्रचलित निकट लिप्यंतरण “यहवे” द्वारा रखा गया है।
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: इस्राएल के परमेश्वर
  rationale: इब्रानी संबंधवाचक रचना का सीधा और स्वाभाविक हिंदी रूप।
- source_word: מֵהָעוֹלָם וְעַד הָעוֹלָם
  choice: युगानुयुग
  rationale: यह पदबंध आरम्भ और अन्त से परे असीम कालावधि दर्शाता है। “युगानुयुग” हिंदी में संक्षिप्त, गरिमापूर्ण और स्तुतिगान के अनुकूल है, यद्यपि उसका शाब्दिक रूप “अनादिकाल से अनन्तकाल तक” भी हो सकता है।
- source_word: אָמֵן וְאָמֵן
  choice: आमीन, फिर आमीन
  rationale: दोहरी आराधनात्मक पुष्टि को घटाए बिना “फिर” द्वारा उसके बल और स्वाभाविक हिंदी लय को सुरक्षित रखा गया है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: यहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में व्यक्तिगत ईश्वरीय नाम है। इसलिए इसे उपाधि “प्रभु” से प्रतिस्थापित नहीं किया गया; “यहवे” स्रोत-रूप के निकट आधुनिक हिंदी लिप्यंतरण है।
- issue: מֵהָעוֹלָם וְעַד הָעוֹלָם की कालगत व्यापकता
  choice: युगानुयुग
  alternative: अनादिकाल से अनन्तकाल तक
  rationale: पदबंध असीम अवधि व्यक्त करता है, पर उसके दार्शनिक अर्थ को आवश्यकता से अधिक निश्चित नहीं किया गया। मुख्य पाठ में स्वाभाविक स्तुतिपरक रूप और पादटिप्पणी में अधिक शाब्दिक विकल्प दिया गया है।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण, संक्षिप्त और सामूहिक आराधना के अनुकूल शैली। “धन्य हों” तथा दोहरे “आमीन” से मूल स्तुतिगान की लय और बल बनाए गए हैं।
