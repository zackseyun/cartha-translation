source:
  edition: WLC
  text: בְּ/זֹ֣את יָ֭דַעְתִּי כִּֽי חָפַ֣צְתָּ בִּ֑/י כִּ֤י לֹֽא יָרִ֖יעַ אֹיְבִ֣/י עָלָֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/041/011.yaml
  text: 'By this I know that you delight in me: because my enemy does not triumph over me[a][b].'
translation:
  language: hi
  text: इसी से मैं जानता हूँ कि तू मुझसे प्रसन्न है[a], क्योंकि मेरा शत्रु मुझ पर विजय का जयघोष नहीं करता[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “तू मुझमें आनंद लेता है” अथवा “तू मुझ पर कृपा करता है।” इब्रानी क्रिया प्रसन्न होने या आनंद लेने का भाव रखती है।
    reason: lexical_alternative
  - marker: b
    text: या “मेरा शत्रु मुझ पर विजयी नहीं होता।” इब्रानी क्रिया का अधिक शाब्दिक अर्थ ऊँची पुकार करना है; यहाँ संभवतः विजय के जयघोष का संकेत है।
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּזֹאת
  choice: इसी से
  rationale: यह पदबंध उस प्रमाण या आधार को बताता है जिससे भजनकार कुछ जानता है; ‘इसी से’ हिंदी में इस प्रमाणसूचक अर्थ को स्वाभाविक रूप से व्यक्त करता है।
- source_word: יָדַעְתִּי
  choice: मैं जानता हूँ
  rationale: रूप पूर्णकालिक है, पर संदर्भ में वर्तमान प्रमाण पर आधारित वर्तमान निश्चय व्यक्त होता है।
- source_word: חָפַצְתָּ בִּי
  choice: तू मुझसे प्रसन्न है
  rationale: חפץ प्रसन्न होने, आनंद लेने या किसी को चाहने का भाव व्यक्त करता है। ‘मुझसे प्रसन्न है’ आधुनिक हिंदी में सहज है और अनावश्यक रूप से व्यापक धर्मवैज्ञानिक निष्कर्ष नहीं जोड़ता।
- source_word: כִּי ... כִּי
  choice: कि ... क्योंकि
  rationale: पहला כִּי ज्ञात बात की विषयवस्तु और दूसरा उसका प्रमाण अथवा कारण प्रस्तुत करता है।
- source_word: לֹא יָרִיעַ
  choice: विजय का जयघोष नहीं करता
  rationale: רוע के हिफ़ील रूप में ऊँची पुकार, यहाँ संभवतः विजय की पुकार, का श्रव्य बिंब है। वर्तमान काल संदर्भ में मौजूदा प्रमाण को व्यक्त करता है।
- source_word: אֹיְבִי עָלָי
  choice: मेरा शत्रु मुझ पर
  rationale: एकवचन ‘शत्रु’ मूल पाठ के वचन को बनाए रखता है; עַל विजय के प्रसंग में भजनकार पर विजयी होकर उल्लास करने का भाव देता है।
theological_decisions:
- issue: क्या शत्रु की असफलता भजनकार के प्रति परमेश्वर की स्वीकृति का प्रमाण है
  choice: भजनकार शत्रु के विजय-जयघोष न कर पाने को इस बात का प्रमाण मानता है कि परमेश्वर उससे प्रसन्न है।
  alternative: इसे परमेश्वर के सामने भजनकार की धार्मिकता या अंतिम दोषमुक्ति की व्यापक घोषणा माना जा सकता है।
  rationale: इब्रानी पाठ परमेश्वर की प्रसन्नता और शत्रु की असफलता को जोड़ता है, पर उस प्रसन्नता का आधार स्पष्ट नहीं करता; इसलिए अनुवाद इस तनाव को बिना विस्तार दिए बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिंदी का गरिमापूर्ण, सहज काव्यात्मक गद्य। परमेश्वर के लिए भजन-साहित्य में प्रचलित एकवचन आत्मीय संबोधन ‘तू’ रखा गया है। ‘विजय का जयघोष’ मूल क्रिया के श्रव्य बिंब को सुरक्षित रखता है।
