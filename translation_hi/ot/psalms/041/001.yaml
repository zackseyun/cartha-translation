  yaml_path: translation/ot/psalms/041/001.yaml
  text: Blessed is the one who considers the poor[c][b][a]; in the day of trouble Yahweh will deliver him.
translation:
  language: hi
  text: धन्य है वह जो दीन की सुधि लेता है[a][b]; विपत्ति के दिन[c] यहोवा उसे बचाएगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जो दीन के प्रति समझ-बूझ से काम करता है।” इब्रानी क्रिया विचारपूर्वक और बुद्धिमानी से ध्यान देने का भाव भी रखती है।
    reason: lexical_alternative
  - marker: b
    text: या, “निर्बल,” “गरीब,” अथवा “ज़रूरतमंद”।
    reason: lexical_alternative
  - marker: c
    text: इब्रानी में शाब्दिक रूप से “बुराई के दिन”; यहाँ “बुराई” का अर्थ नैतिक दुष्टता नहीं, बल्कि अनिष्ट या संकट है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אַשְׁרֵי
  choice: धन्य है
  rationale: यह इब्रानी धन्यता-वचन का स्वाभाविक और गरिमापूर्ण हिन्दी रूप है; यह केवल मन की प्रसन्नता नहीं, बल्कि परमेश्वर की कृपा से जुड़ी धन्य अवस्था व्यक्त करता है।
- source_word: מַשְׂכִּיל אֶל
  choice: की सुधि लेता है
  rationale: हिफ़ील रूप और אֶל मिलकर किसी की दशा पर समझ-बूझ और विचारपूर्वक ध्यान देने का भाव देते हैं। ‘सुधि लेना’ आधुनिक पाठक के लिए सहज है और केवल बौद्धिक विचार से आगे बढ़कर संवेदनशील ध्यान का संकेत देता है।
- source_word: דָּל
  choice: दीन
  rationale: यह शब्द निर्धन, निर्बल या साधनहीन व्यक्ति को सूचित कर सकता है। ‘दीन’ इस व्यापक सामाजिक असुरक्षा को संक्षेप और गरिमा के साथ व्यक्त करता है।
- source_word: בְּיוֹם רָעָה
  choice: विपत्ति के दिन
  rationale: यहाँ רָעָה नैतिक बुराई के बजाय संकट, अनिष्ट या मुसीबत को सूचित करता है। ‘विपत्ति’ उस आपदाकालीन भाव को स्पष्ट रखता है।
- source_word: יְמַלְּטֵהוּ
  choice: उसे बचाएगा
  rationale: מלט का पिएल रूप खतरे से छुड़ाने या बचाने का अर्थ देता है। ‘बचाएगा’ सामान्य आधुनिक हिन्दी में स्पष्ट और प्रभावशाली है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को हिन्दी में प्रचलित लिप्यंतरण ‘यहोवा’ से प्रस्तुत किया गया है, न कि किसी उपाधि से प्रतिस्थापित किया गया है।
theological_decisions:
- issue: एकवचन प्रतिनिधि व्यक्ति और पुल्लिंग प्रत्यय
  choice: ‘वह ... उसे’ के द्वारा एकवचन बनाए रखना
  alternative: ‘वे ... उन्हें’ अथवा स्पष्ट रूप से केवल पुरुष का संकेत
  rationale: इब्रानी पाठ एक प्रतिनिधि व्यक्ति के लिए एकवचन रूप और पुल्लिंग प्रत्यय रखता है। हिन्दी में ‘वह ... उसे’ स्वाभाविक रूप से लिंग-समावेशी हो सकता है और मूल का एकवचन भी सुरक्षित रखता है।
- issue: धन्यता-वचन में छुटकारे की प्रतिज्ञा का स्वरूप
  choice: कथन को उसके सीधे और प्रबल रूप में रखना
  alternative: इसे अनिवार्य समृद्धि की गारंटी बनाना या केवल सामान्य संभावना कहकर दुर्बल करना
  rationale: भजन का ज्ञानपरक धन्यता-वचन यहोवा के बचाने को सीधे कहता है। अनुवाद न इसमें किसी समृद्धि-सिद्धांत को जोड़ता है, न मूल प्रतिज्ञा को नरम करता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘सुधि लेना’ विचारशील देखभाल का अर्थ देता है, जबकि ‘दीन’ मूल शब्द की निर्धनता और निर्बलता—दोनों संभावनाओं को खुला रखता है। सभी पाद-टिप्पणी चिह्न मुख्य पाठ में उपस्थित हैं।
