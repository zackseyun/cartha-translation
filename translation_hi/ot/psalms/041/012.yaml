  rationale: The revision preserves the Hebrew’s contrast, the ambiguity of the preposition in ‘in my integrity,’ and the enduring sense of ‘forever.’ It corrects the lexical footnote anchoring, adds the corresponding presence note, and uses ‘स्थापित किया’ to express being set/established before God rather than merely made steadfast.
