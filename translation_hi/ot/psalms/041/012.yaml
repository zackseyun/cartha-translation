  text: וַ/אֲנִ֗י בְּ֭/תֻמִּ/י תָּמַ֣כְתָּ בִּ֑/י וַ/תַּצִּיבֵ֖/נִי לְ/פָנֶ֣י/ךָ לְ/עוֹלָֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/041/012.yaml
  text: But as for me[a], in my integrity you have upheld me[b], and you have set me before your face forever.
translation:
  language: hi
  text: परन्तु मुझे तूने मेरी खराई[a] में थामे रखा है, और सदा के लिए अपने सामने[b] स्थापित किया है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘मेरी निर्दोषता में’; अथवा ‘मेरी खराई के कारण।’
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, ‘तेरे मुख के सामने’; अर्थात्, ‘तेरी उपस्थिति में।’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי
  choice: परन्तु मुझे
  rationale: स्वतंत्र सर्वनाम और संयोजक पिछले प्रसंग के विपरीत मोड़ को दिखाते हैं; हिन्दी वाक्य-विन्यास में कर्मरूप ‘मुझे’ अगले क्रियापद के साथ स्वाभाविक है।
- source_word: בְּתֻמִּי
  choice: मेरी खराई में
  rationale: ‘खराई’ नैतिक अखंडता और निष्कपटता का भाव रखती है, पर पूर्ण निष्पापता का दावा नहीं करती। ‘में’ मूल उपसर्ग בְּ की अस्पष्टता को बनाए रखता है।
- source_word: תָּמַכְתָּ בִּי
  choice: तूने थामे रखा है
  rationale: תמך का अर्थ सहारा देना या दृढ़ता से थामे रखना है; यह हिन्दी में संबंधपरक और स्थिर रखने के भाव को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: וַתַּצִּיבֵנִי
  choice: और मुझे ... स्थिर किया है
  rationale: हिफ़िल रूप किसी को खड़ा करने, स्थापित करने या स्थिर रखने का भाव देता है; ‘स्थिर किया’ केवल स्थान देने से अधिक टिकाऊ स्थापना को व्यक्त करता है।
- source_word: לְפָנֶיךָ
  choice: अपने सामने
  rationale: यह ‘तेरे मुख के सामने’ का स्वाभाविक हिन्दी समतुल्य है और परमेश्वर की उपस्थिति का ठोस स्थानिक रूपक बनाए रखता है।
- source_word: לְעוֹלָם
  choice: सदा के लिए
  rationale: यह दीर्घ, अनवरत अवधि को आधुनिक और गरिमापूर्ण हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: भजनकार का תֻּם का दावा
  choice: ‘मेरी खराई’—नैतिक अखंडता का दावा
  alternative: पूर्ण निष्पापता अथवा नैतिक सिद्धता के आधार पर परमेश्वर की कृपा अर्जित करना
  rationale: मूल शब्द अखंडता, निष्कपटता या निर्दोष आचरण को सूचित कर सकता है, पर अपने आप में पूर्ण निष्पापता या अर्जित अनुग्रह नहीं सिखाता। अनुवाद पाठ के नैतिक दावे और उसकी धार्मिक तनावपूर्णता दोनों को बनाए रखता है।
- issue: בְּתֻמִּי में בְּ का संबंध
  choice: ‘मेरी खराई में’
  alternative: ‘मेरी खराई के कारण’
  rationale: उपसर्ग को स्पष्ट कारणवाचक बनाना संभव है, पर निश्चित नहीं। ‘में’ साधन, अवस्था या आधार के बीच मूल अस्पष्टता को अधिक सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण भजनात्मक रूप; परमेश्वर के लिए निकट और काव्यात्मक एकवचन ‘तू’ रखा गया है। ‘खराई’ साधारण पाठक के लिए बोधगम्य रहते हुए नैतिक अखंडता का भाव देती है।
