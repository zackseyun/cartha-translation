  text: Together all who hate me whisper against me[b][a]; against me they devise evil for me.
translation:
  language: hi
  text: मुझसे बैर रखने वाले सब मिलकर मेरे विरुद्ध फुसफुसाते हैं[a]; मेरे विरुद्ध वे मेरे लिए अनिष्ट की योजना बनाते हैं।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: दोनों स्थानों पर ‘मेरे विरुद्ध’ का अनुवाद ‘मेरे विषय में’ भी हो सकता है; इब्रानी सम्बन्धसूचक शब्द विरोध की दिशा या बात और विचार का विषय—दोनों बता सकता है। प्रसंग में विरोध का भाव अधिक उपयुक्त है।
    reason: lexical_alternative
  - marker: b
    text: 'अर्थ यह भी हो सकता है: ‘वे मुझे हानि पहुँचाने की योजना बनाते हैं’ या ‘वे मेरे विरुद्ध बुराई रचते हैं।’ इब्रानी में सोचने अथवा योजना बनाने की क्रिया के साथ ‘बुराई’ है, जो शत्रुतापूर्ण इरादा व्यक्त करती है।'
    reason: lexical_alternative
