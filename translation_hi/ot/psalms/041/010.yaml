  text: But you[a], O Yahweh, be gracious to me and raise me up, that I may repay them.
translation:
  language: hi
  text: परन्तु तू, हे याहवे, मुझ पर अनुग्रह कर और मुझे उठा खड़ा कर, ताकि मैं उन्हें बदला चुका सकूँ।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “और मैं उन्हें बदला चुकाऊँगा।” इब्रानी कोहोर्टेटिव को पिछली याचनाओं का उद्देश्य या परिणाम (“ताकि मैं … चुका सकूँ”) अथवा उनके बाद व्यक्त संकल्प माना जा सकता है।
    reason: व्याकरणिक/अर्थगत विकल्प
lexical_decisions:
- source_word: וְ/אַתָּה
  choice: परन्तु
  rationale: स्वतंत्र सर्वनाम के साथ संयोजक पिछले संदर्भ के शत्रुओं और विश्वासघाती मित्र के विपरीत याहवे की ओर मुड़ने का भाव देता है; हिन्दी में ‘परन्तु’ इस विरोध को स्वाभाविक रूप से व्यक्त करता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत नाम को उपाधि से बदलने के बजाय हिन्दी लिप्यंतरण में सुरक्षित रखा गया है।
- source_word: חָנֵּנִי
  choice: मुझ पर अनुग्रह कर
  rationale: חנן कृपापूर्ण पक्ष और अनुग्रह की याचना व्यक्त करता है; यह अनुवाद अर्थ को केवल दया या करुणा तक सीमित नहीं करता।
- source_word: וַהֲקִימֵנִי
  choice: और मुझे फिर उठा खड़ा कर
  rationale: קום के हिफ़ील रूप का ठोस अर्थ ‘उठाना/खड़ा करना’ सुरक्षित है; ‘फिर’ बीमारी या पतन से पुनःस्थापन का संदर्भ स्वाभाविक बनाता है, जबकि रूपक को बनाए रखता है।
- source_word: וַאֲשַׁלְּמָה
  choice: ताकि मैं ... बदला चुका सकूँ
  rationale: שלם के पिएल रूप में यहाँ प्रतिफल या बदला चुकाने का अर्थ है। याचिकाओं के बाद कोहोर्टेटिव को उद्देश्य/परिणाम के रूप में लिया गया है, पर वैकल्पिक संकल्पात्मक अर्थ पादटिप्पणी में रखा गया है।
- source_word: לָהֶם
  choice: उन्हें
  rationale: ל प्रतिफल पाने वालों को चिह्नित करता है; हिन्दी में ‘उन्हें बदला चुकाना’ स्वाभाविक कर्म-रचना है।
theological_decisions:
- issue: भजनकार की प्रतिफल देने की बात को नरम किया जाए या उसके न्यायात्मक/अभिशापात्मक तनाव को बनाए रखा जाए
  choice: ‘उन्हें बदला चुका सकूँ’ को बनाए रखा गया
  alternative: ‘उनके विरुद्ध मेरा न्याय कर’ या ‘उनसे वैसा ही व्यवहार कर जिसके वे योग्य हैं’
  rationale: שלם प्रत्यक्ष रूप से चुकाने या प्रतिफल देने को दर्शाता है। इसे नरम करने से मूल पाठ का तनाव और भजनकार की कही बात धुंधली पड़ती; पाठ यह नहीं बताता कि बदला किस प्रकार लिया जाएगा।
- issue: וַאֲשַׁלְּמָה को उद्देश्य/परिणाम माना जाए या याचिकाओं के बाद दृढ़ संकल्प
  choice: ‘ताकि मैं ... बदला चुका सकूँ’
  alternative: ‘और मैं उन्हें बदला चुकाऊँगा’
  rationale: वाव सहित कोहोर्टेटिव पिछले निवेदनों के उद्देश्य या परिणाम को व्यक्त कर सकता है, पर संकल्पात्मक पाठ भी व्याकरणतः संभव है; इसलिए मुख्य पाठ में पहला और पादटिप्पणी में दूसरा रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सहज प्रार्थनात्मक स्वर रखा गया है। ‘याहवे’ नाम को सुरक्षित रखा गया है; ‘उठा खड़ा कर’ मूल रूपक को बनाए रखता है और ‘बदला चुका सकूँ’ न्यायात्मक तनाव को बिना नरम किए सामान्य पाठक के लिए स्पष्ट करता है।
