  choice: दाऊद का
  alternative: दाऊद द्वारा रचित; दाऊद के लिए
  rationale: इब्रानी לְדָוִד का संबंध-वाचक अर्थ व्यापक है। मुख्य पाठ में अर्थ को किसी एक व्याख्या तक सीमित न करके वास्तविक अस्पष्टता बनाए रखी गई है और विकल्प पादटिप्पणी में दिए गए हैं।
translation_notes:
