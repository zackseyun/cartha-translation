lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: संगीत निर्देशक के लिए
  rationale: भजन-संग्रह के शीर्षकों में यह पद संगीत-प्रस्तुति की देखरेख करने वाले व्यक्ति के लिए निर्देश या समर्पण को दर्शाता है। ‘संगीत निर्देशक’ आधुनिक, स्वाभाविक और पर्याप्त रूप से व्यापक है।
- source_word: מִזְמוֹר
  choice: भजन
  rationale: यह भजन-संग्रह के शीर्षकों में प्रयुक्त मानक काव्य-संगीत विधा का शब्द है; हिन्दी में ‘भजन’ इसका परिचित और सटीक समतुल्य है।
- source_word: לְדָוִד
  choice: दाऊद का
  rationale: शीर्षकों में לְ लेखन, संबंध, स्वामित्व या समर्पण का बोध करा सकता है। ‘दाऊद का’ मूल की व्यापकता को यथासंभव बनाए रखता है और सीधे ‘दाऊद द्वारा रचित’ या ‘दाऊद के लिए’ तय नहीं करता।
theological_decisions:
