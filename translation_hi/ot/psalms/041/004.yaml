  yaml_path: translation/ot/psalms/041/004.yaml
  text: As for me[a], I said, “O Yahweh, be gracious to me; heal my soul, for I have sinned against you.”
translation:
  language: hi
  text: मैंने तो कहा, “हे याहवे, मुझ पर अनुग्रह कर; मेरे प्राण[a] को चंगा कर, क्योंकि मैंने तेरे विरुद्ध पाप किया है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “मेरे जीवन को चंगा कर” अथवा “मुझे चंगा कर”; इब्रानी נֶפֶשׁ (नेफ़ेश) का अर्थ “प्राण,” “जीवन” या स्वयं व्यक्ति भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲנִי
  choice: मैंने तो
  rationale: स्वतंत्र सर्वनाम אֲנִי के हल्के बल को स्वाभाविक हिन्दी में ‘तो’ द्वारा व्यक्त किया गया है; केवल क्रिया-रूप में निहित ‘मैं’ कहने से यह बल खो जाता।
- source_word: אָמַרְתִּי
  choice: कहा
  rationale: काल-सिद्ध रूप यहाँ भजनकार की कही हुई प्रार्थना का वर्णन करता है, इसलिए सामान्य भूतकाल स्वाभाविक है।
- source_word: יְהוָה
  choice: हे याहवे
  rationale: मूल में परमेश्वर का व्यक्तिगत नाम है; ‘हे’ सीधे सम्बोधन को और ‘याहवे’ नाम को सुरक्षित रखता है।
- source_word: חָנֵּנִי
  choice: मुझ पर अनुग्रह कर
  rationale: חנן कृपापूर्ण अनुग्रह दिखाने की विनती है; यह अनुवाद अर्थ को केवल दया या सहानुभूति तक सीमित नहीं करता।
- source_word: רְפָאָה
  choice: चंगा कर
  rationale: רפא का सीधा अर्थ चंगा करना है; इससे शारीरिक, आंतरिक या समग्र चंगाई के बीच मूल की खुली अर्थ-सीमा बनी रहती है।
- source_word: נַפְשִׁי
  choice: मेरे प्राण
  rationale: נפש का अर्थ प्राण, जीवन, स्वयं या पूरा व्यक्ति हो सकता है। ‘प्राण’ मूल अभिव्यक्ति की व्यापकता को अपेक्षाकृत सुरक्षित रखता है; अन्य सम्भावनाएँ पादटिप्पणी में दी गई हैं।
- source_word: כִּי
  choice: क्योंकि
  rationale: כִּי यहाँ विनती का कारण प्रस्तुत करता है; आधुनिक हिन्दी में ‘क्योंकि’ स्पष्ट और स्वाभाविक है।
- source_word: חָטָאתִי
  choice: मैंने ... पाप किया है
  rationale: पूर्ण क्रिया को वर्तमान से सम्बद्ध स्वीकारोक्ति के रूप में वर्तमान पूर्णकाल से व्यक्त किया गया है।
- source_word: לָךְ
  choice: तेरे विरुद्ध
  rationale: חטא के साथ यह सम्बन्ध उस व्यक्ति को बताता है जिसके विरुद्ध अपराध हुआ; ‘विरुद्ध’ इस सम्बन्धपरक अपराध को स्पष्ट करता है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: हे याहवे
  alternative: हे प्रभु
  rationale: मूल पाठ उपाधि नहीं, चार-अक्षरी व्यक्तिगत नाम יהוה का प्रयोग करता है; इसलिए नाम को लिप्यंतरित किया गया है।
- issue: ‘मेरे प्राण को चंगा कर’ का दायरा
  choice: मेरे प्राण को चंगा कर
  alternative: मुझे चंगा कर / मेरे जीवन को चंगा कर
  rationale: נפש भीतर के जीवन, जीवन स्वयं, अथवा पूरे व्यक्ति का संकेत कर सकता है। मुख्य पाठ मूल की अभिव्यक्ति को बनाए रखता है और यह तय नहीं करता कि चंगाई केवल शारीरिक है या केवल आत्मिक।
translation_notes:
  register: भाषा आधुनिक, प्रार्थनापूर्ण और गरिमामय रखी गई है। ‘तेरे’ का प्रयोग परमेश्वर से सीधे, निकट और पारंपरिक भक्तिपूर्ण सम्बोधन के लिए है; शब्दावली को किसी विशिष्ट सम्प्रदाय की व्याख्या से नहीं बाँधा गया।
