base_translation:
  language: en
  yaml_path: translation/ot/psalms/041/002.yaml
  text: Yahweh will keep him and preserve his life[a]; he will be blessed in the land[d][c][b], and may you not give him over to the desire of his enemies.
translation:
  language: hi
  text: याहवे उसकी रक्षा करेगा और उसे जीवित रखेगा[a]; वह देश में धन्य कहलाएगा[b]। उसे उसके शत्रुओं की इच्छा के हवाले न कर देना[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उसके प्राण बचाए रखेगा।”
    reason: lexical_alternative
  - marker: b
    text: या “वह देश में धन्य होगा।” इब्रानी क्रिया का अर्थ “धन्य कहलाना” या सामान्य रूप से “धन्य होना” हो सकता है।
    reason: lexical_alternative
  - marker: c
    text: शाब्दिक रूप से, “उसे उसके शत्रुओं की इच्छा में न दे देना”; यहाँ “इच्छा” का अर्थ “मर्जी” या “लालसा” भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत नाम को उपाधि से बदलने के बजाय देवनागरी में लिप्यंतरित किया गया है।
- source_word: יִשְׁמְרֵהוּ
  choice: उसकी रक्षा करेगा
  rationale: שׁמר का अर्थ रक्षा करना, संभालना और निगरानी रखना है; यहाँ यह स्वाभाविक और स्पष्ट हिन्दी है।
- source_word: וִיחַיֵּהוּ
  choice: उसे जीवित रखेगा
  rationale: חיה के पिएल रूप का यहाँ अर्थ जीवन बनाए रखना है; यह निकट और सहज अनुवाद है।
- source_word: יאשר
  choice: धन्य कहलाएगा
  rationale: אשר यहाँ किसी को धन्य मानने या घोषित करने का भाव दे सकता है; यह अनुवाद उस सूक्ष्मता को बनाए रखता है।
- source_word: בָּאָרֶץ
  choice: देश में
  rationale: אֶרֶץ का अर्थ भूमि, देश या पृथ्वी हो सकता है; इस प्रसंग में 'देश में' स्वाभाविक है और क्षेत्र/समुदाय में जीवन का संकेत रखता है।
- source_word: וְאַל תִּתְּנֵהוּ
  choice: उसे न कर देना
  rationale: אַל के साथ दूसरा पुरुष जुसिव याहवे को संबोधित निषेधात्मक प्रार्थना है; हिन्दी में आज्ञार्थक निषेध इस बदलाव को स्पष्ट रखता है।
- source_word: בְּנֶפֶשׁ אֹיְבָיו
  choice: उसके शत्रुओं की इच्छा के अधीन
  rationale: נֶפֶשׁ इस मुहावरे में 'प्राण' नहीं, इच्छा या लालसा का बोध देता है; 'के अधीन' נתן के सौंप देने के परिणाम को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: तीसरे पुरुष के कथन से दूसरे पुरुष की प्रार्थना की ओर बदलाव
  choice: पहले दो उपवाक्यों को याहवे के विषय में विश्वासपूर्ण कथन और अंतिम उपवाक्य को सीधे याहवे से प्रार्थना के रूप में प्रस्तुत किया गया है।
  alternative: 'पूरे पद को तीसरे पुरुष में प्रस्तुत करना: ''और वह उसे उसके शत्रुओं की इच्छा के अधीन नहीं करेगा।'''
  rationale: תִּתְּנֵהוּ दूसरा पुरुष पुल्लिंग एकवचन है। मूल पाठ के व्यक्ति-परिवर्तन को समतल किए बिना सुरक्षित रखना चाहिए।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठक के लिए स्पष्ट। अंतिम वाक्य को अलग रखकर इब्रानी में तीसरे पुरुष से सीधे दूसरे पुरुष संबोधन की ओर अचानक हुए बदलाव को सुनाई देने योग्य बनाया गया है।
