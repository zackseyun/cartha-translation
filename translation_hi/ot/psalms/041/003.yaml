lexical_decisions:
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय देवनागरी में लिप्यंतरित किया गया है।
- source_word: יִסְעָדֶנּוּ
  choice: उसे सहारा देगा
  rationale: סעד दुर्बल अवस्था में थामने या सहारा देने का भाव रखता है; यह हिंदी में स्वाभाविक और प्रसंगानुकूल है।
- source_word: עֶרֶשׂ דְּוָי
  choice: बीमारी की शय्या
  rationale: यह पदबंध बीमारी के कारण पड़े रहने की शय्या को दर्शाता है; ‘शय्या’ गरिमापूर्ण और सामान्यतः बोधगम्य है।
- source_word: כָּל־מִשְׁכָּבוֹ
  choice: उसका पूरा बिछौना
  rationale: כָּל की समग्रता को ‘पूरा’ से और lying place/bed को यहाँ ‘बिछौना’ से व्यक्त किया गया है, जिससे समानांतर शब्दों में अनावश्यक अस्पष्टता नहीं आती।
- source_word: הָפַכְתָּ
  choice: बदल देते हैं
  rationale: הפך का मूल अर्थ पलटना या बदलना है। बीमारी में बिछौना बदलने के देखभाल-संबंधी बिंब को बनाए रखते हुए हिंदी में स्पष्ट अनुवाद चुना गया है; संभावित अधिक शाब्दिक अर्थ पादटिप्पणी में दिया गया है।
- source_word: בְחָלְיוֹ
  choice: उसकी बीमारी में
  rationale: ב परिस्थिति सूचित करता है और חלי बीमारी; अनुवाद स्रोत की संक्षिप्त रचना को बनाए रखता है।
theological_decisions:
- issue: पद के भीतर संबोधन का परिवर्तन
  choice: तीसरे पुरुष ‘याहवे... देगा’ से सीधे दूसरे पुरुष आदरसूचक ‘आप... देते हैं’ की ओर परिवर्तन बनाए रखा गया है।
  alternative: 'पूरे पद को तीसरे पुरुष में समतल करना: ‘वह उसका पूरा बिछौना बदल देगा।’'
  rationale: इब्रानी कविता पहले याहवे के विषय में कहती है और फिर सीधे उन्हें संबोधित करती है। इस परिवर्तन को बनाए रखना प्रार्थनात्मक-काव्यात्मक तनाव का सम्मान करता है।
- issue: הָפַכְתָּ का लाभकारी आशय
  choice: ‘बदल देते हैं’—बीमार की देखभाल में बिछौना बदलने का बिंब
  alternative: ‘पलट देते हैं’ अथवा परिणामात्मक रूप से ‘बहाल कर देते हैं’
  rationale: क्रिया का शाब्दिक अर्थ ‘पलटना/बदलना’ है, जबकि प्रसंग लाभकारी देखभाल का है। मुख्य पाठ स्रोत के बिंब के निकट रहता है और पादटिप्पणी वास्तविक वैकल्पिक अर्थ सुरक्षित रखती है।
