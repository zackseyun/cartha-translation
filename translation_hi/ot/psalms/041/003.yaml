  register: आधुनिक मानक हिंदी में गरिमापूर्ण, सहज शैली रखी गई है। परमेश्वर के सीधे संबोधन के लिए आदरसूचक ‘आप’ प्रयुक्त है। ‘शय्या’ और ‘बिछौना’ दोनों बिस्तर-संबंधी इब्रानी समानांतर पदों को स्वाभाविक हिंदी में अलग-अलग व्यक्त करते हैं।
