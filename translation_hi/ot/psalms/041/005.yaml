- source_word: מָתַי
  choice: कब
  rationale: प्रश्नवाचक क्रियाविशेषण का सीधा और सटीक हिन्दी रूप।
- source_word: יָמוּת
  choice: मरेगा
  rationale: מָתַי के बाद अपूर्ण क्रिया का भविष्य अर्थ स्वाभाविक है; इससे शत्रुओं की दुर्भावना प्रकट होती है, पर इसे स्पष्ट इच्छार्थक बनाकर मूल से आगे नहीं बढ़ाया गया।
- source_word: וְאָבַד שְׁמוֹ
  choice: और उसका नाम कब मिट जाएगा
  rationale: ‘नाम’ को मुख्य पाठ में बनाए रखा गया है, जबकि אבד को स्वाभाविक हिन्दी में ‘मिट जाएगा’ कहा गया है। समानांतर प्रश्न में दूसरा ‘कब’ जोड़ना हिन्दी की स्पष्टता के लिए है।
