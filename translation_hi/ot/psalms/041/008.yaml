  text: דְּֽבַר בְּ֭לִיַּעַל יָצ֣וּק בּ֑/וֹ וַ/אֲשֶׁ֥ר שָׁ֝כַ֗ב לֹא יוֹסִ֥יף לָ/קֽוּם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/041/008.yaml
  text: A wicked thing is poured out upon him; now that he lies down[a], he will rise no more.
translation:
  language: hi
  text: “एक बुरी बात उस पर उँडेल दी गई है; अब जब वह पड़ा है, तो फिर नहीं उठेगा।”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “एक घृणित बात उस पर थोप दी गई है,” अथवा “उस पर एक दुष्ट आरोप लगा दिया गया है।” इब्रानी अभिव्यक्ति कठिन है और किसी घातक व्याधि या विनाशकारी आरोप—दोनों में से किसी की ओर संकेत कर सकती है।
    reason: alternative_reading
lexical_decisions:
- source_word: דְּבַר בְּלִיַּעַל
  choice: एक अनर्थकारी बात
  rationale: यह कठिन और संक्षिप्त इब्रानी पदबंध किसी घातक विपत्ति या दुर्भावनापूर्ण आरोप—दोनों की ओर संकेत कर सकता है। ‘अनर्थकारी बात’ उसकी नैतिक और विनाशकारी छाया को रखते हुए अस्पष्टता को खुला छोड़ता है।
- source_word: יָצוּק
  choice: उँडेल दी गई है
  rationale: क्रिया के मूल ढालने या उँडेलने के निष्क्रिय बिंब को बनाए रखता है; ‘जमा दी गई’ भी संभव है, पर वह रूपक को अलग दिशा में ले जाता है।
- source_word: בּוֹ
  choice: उस पर
  rationale: इस निष्क्रिय क्रिया के साथ ‘उस पर’ स्वाभाविक हिंदी है और किसी चीज़ के उस व्यक्ति पर डाल दिए जाने का भाव देती है।
- source_word: וַאֲשֶׁר שָׁכַב
  choice: अब जब वह पड़ा है
  rationale: शाब्दिक ‘लेट गया है’ की अपेक्षा ‘पड़ा है’ बीमारी या गिर पड़ने की संभावित पृष्ठभूमि में अधिक स्वाभाविक है, फिर भी मृत्यु या रोग को स्पष्ट रूप से नहीं जोड़ता।
- source_word: לֹא יוֹסִיף לָקוּם
  choice: फिर नहीं उठेगा
  rationale: इब्रानी मुहावरे का सीधा और गंभीर हिंदी रूप; यह उठ खड़े होने, स्वस्थ होने या फिर सँभलने की अर्थ-छाया को खुला रखता है।
theological_decisions:
- issue: ‘דְּבַר בְּלִיַּעַל’ और ‘יָצוּק’ के संयुक्त बिंब की व्याख्या
  choice: मुख्य पाठ में ऐसी ‘अनर्थकारी बात’ रखी गई है जो उस पर उँडेल दी गई है।
  alternative: कोई घातक रोग उससे चिपक गया है; अथवा उस पर कोई दुष्ट आरोप लगा दिया गया है।
  rationale: इब्रानी वाक्यांश कठिन है और निश्चित रूप से यह तय नहीं करता कि शत्रु किसी विनाशकारी व्याधि की बात कर रहे हैं या दुर्भावनापूर्ण आरोप की। अनुवाद इस तनाव को हल किए बिना सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिंदी में गंभीर काव्यात्मक लहजा रखा गया है। ‘अनर्थकारी बात’ सामान्य पाठक के लिए बोधगम्य रहते हुए मूल की जानबूझकर अनिश्चित अभिव्यक्ति को बचाती है; ‘पड़ा है’ और ‘फिर नहीं उठेगा’ स्वाभाविक तथा गरिमामय हैं।
