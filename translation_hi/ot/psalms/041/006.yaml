  yaml_path: translation/ot/psalms/041/006.yaml
  text: And if he comes to see me[a], he speaks falsehood; his heart gathers wickedness to itself; when he goes out to the street[c][b], he speaks it.
translation:
  language: hi
  text: और यदि वह मुझे देखने आता है,[a] तो झूठ बोलता है; उसका मन अपने भीतर बुराई बटोरता है; बाहर जाकर[b] वह उसे कह देता है।[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: मूल में केवल ‘देखने’ है; ‘मुझे’ संदर्भ से निहित है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में शाब्दिक रूप से ‘बाहर’।
    reason: lexical_alternative
  - marker: c
    text: ‘उसे’ मूल में व्यक्त नहीं है; यह पिछली पंक्ति में मन में बटोरी गई बुराई की ओर संकेत करता है।
    reason: clarification
lexical_decisions:
- source_word: וְאִם
  choice: और यदि
  rationale: पूर्ववर्ती कथन से संबंध बनाए रखते हुए शर्तसूचक अर्थ को सुरक्षित रखता है।
- source_word: בָּא לִרְאוֹת
  choice: मुझे देखने आता है
  rationale: मूल में शाब्दिक अर्थ ‘देखने आता है’ है; ‘मुझे’ का कर्म संदर्भ से निहित है और स्वाभाविक हिन्दी के लिए व्यक्त किया गया है।
- source_word: שָׁוְא יְדַבֵּר
  choice: झूठ बोलता है
  rationale: שָׁוְא में मिथ्यापन, छल और व्यर्थता के अर्थ हैं; शत्रुतापूर्ण भेंट के संदर्भ में ‘झूठ’ मुख्य भाव को स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
- source_word: לִבּוֹ
  choice: उसका मन
  rationale: हिब्रू ‘हृदय’ आंतरिक विचार और अभिप्राय का संकेत देता है; आधुनिक हिन्दी में ‘मन’ इस प्रयोग को अधिक स्वाभाविक ढंग से व्यक्त करता है।
- source_word: יִקְבָּץ אָוֶן לּוֹ
  choice: अपने लिए अनर्थ बटोरता है
  rationale: יִקְבָּץ के संचय-बिंब को ‘बटोरता है’ से और אָוֶן के बुराई, दुष्टता तथा हानि के व्यापक अर्थ को ‘अनर्थ’ से बनाए रखा गया है। ‘अपने लिए’ अस्पष्ट दत्तिव לוֹ को अधिक व्याख्यायित किए बिना दर्शाता है।
- source_word: יֵצֵא לַחוּץ
  choice: बाहर निकलकर
  rationale: मूल का सीधा अर्थ ‘बाहर जाता/निकलता है’ है; ‘सड़क पर’ कहने की अपेक्षा यह स्थानगत अभिव्यक्ति को बिना विस्तार के सुरक्षित रखता है।
- source_word: יְדַבֵּר
  choice: वह उसे कहता है
  rationale: दूसरे יְדַבֵּר में पहले क्रिया की पुनरावृत्ति रखी गई है। ‘उसे’ उस निहित विषय की ओर संकेत करता है जिसे उसने मन में बटोरा, पर मूल में कर्म स्पष्ट नहीं है।
