source:
  edition: WLC
  text: לְ/דָוִ֨ד בָּ֘ר֤וּךְ יְהוָ֨ה צוּרִ֗/י הַֽ/מְלַמֵּ֣ד יָדַ֣/י לַ/קְרָ֑ב אֶ֝צְבְּעוֹתַ֗/י לַ/מִּלְחָמָֽה׀׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/144/001.yaml
  text: Of David. Blessed be Yahweh[a], my rock, who trains my hands for battle, my fingers for war.
translation:
  language: hi
  text: 'दाऊद का[a]।


    धन्य है याहवे, मेरी चट्टान,

    जो मेरे हाथों को युद्ध के लिए

    और मेरी उँगलियों को संग्राम के लिए प्रशिक्षित करता है।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘दाऊद के लिए’ अथवा ‘दाऊद द्वारा रचित’। भजन के शीर्षक में प्रयुक्त इब्रानी संबंधसूचक शब्द लेखन, संबंध या समर्पण का संकेत दे सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: לְדָוִד
  choice: दाऊद का
  rationale: भजन के शीर्षक में לְ लेखन, संबंध या समर्पण का संकेत दे सकता है। ‘दाऊद का’ संक्षिप्त और पारंपरिक है तथा किसी एक अर्थ को अनावश्यक रूप से निश्चित नहीं करता; अन्य संभावनाएँ पादटिप्पणी में दी गई हैं।
- source_word: בָּרוּךְ
  choice: धन्य है
  rationale: यह आराधनात्मक उद्घोषणा है। ‘धन्य है’ इब्रानी रूप की संक्षिप्तता और स्तुतिपरक भाव को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: चार अक्षरों वाले परमेश्वर के व्यक्तिगत नाम को उपाधि से बदलने के बजाय हिन्दी में उसके प्रचलित लिप्यंतरण ‘याहवे’ से व्यक्त किया गया है।
- source_word: צוּרִי
  choice: मेरी चट्टान
  rationale: צוּר का ठोस अर्थ चट्टान है और यहाँ स्थिरता तथा सुरक्षा का रूपक है। ‘शरणस्थान’ जैसे व्याख्यात्मक विकल्प के बजाय मूल बिंब सुरक्षित रखा गया है।
- source_word: הַמְלַמֵּד
  choice: जो ... प्रशिक्षित करता है
  rationale: युद्ध के प्रसंग में यह केवल मौखिक शिक्षा नहीं, बल्कि युद्ध के लिए तैयार करने का भाव देता है। वर्तमानकालिक अभिव्यक्ति निरंतर या चारित्रिक क्रिया को दर्शाती है।
- source_word: יָדַי
  choice: मेरे हाथों
  rationale: मूल के शरीर-अंग संबंधी ठोस और काव्यात्मक कथन को ज्यों का त्यों बनाए रखा गया है।
- source_word: לַקְרָב
  choice: युद्ध के लिए
  rationale: קְרָב युद्ध या मुठभेड़ को दर्शाता है। यह चयन सैन्य संदर्भ को स्पष्ट और स्वाभाविक हिन्दी में रखता है।
- source_word: אֶצְבְּעוֹתַי
  choice: मेरी उँगलियों
  rationale: मूल में ‘उँगलियाँ’ स्पष्ट रूप से हैं; इसे ‘हाथ’ में सामान्यीकृत न करके समानांतर काव्य-रचना सुरक्षित रखी गई है।
- source_word: לַמִּלְחָמָה
  choice: संग्राम के लिए
  rationale: מִלְחָמָה का अर्थ युद्ध है। पहले अर्धपद के ‘युद्ध’ के साथ अर्थगत समानांतरता रखते हुए ‘संग्राम’ हिन्दी काव्य में स्वाभाविक विविधता देता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा अथवा ‘प्रभु’
  rationale: पद में परमेश्वर का व्यक्तिगत नाम सीधे आया है। ‘याहवे’ उस नाम को किसी उपाधि से प्रतिस्थापित किए बिना प्रस्तुत करता है।
- issue: परमेश्वर से जुड़ी सैन्य भाषा
  choice: हाथों और उँगलियों को युद्ध के लिए प्रशिक्षित करने की प्रत्यक्ष छवि बनाए रखना
  alternative: इसे सामान्य सामर्थ्य या आत्मिक संघर्ष की भाषा में नरम करना
  rationale: इब्रानी पाठ सशस्त्र संघर्ष के लिए तैयारी का स्पष्ट चित्र देता है। ऐतिहासिक और धर्मवैचारिक तनाव को आध्यात्मिक रूपक बनाकर मिटाया नहीं गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और काव्यात्मक शैली रखी गई है। पंक्ति-विन्यास इब्रानी समानांतरता को उभारता है। ‘चट्टान’, ‘हाथों’ और ‘उँगलियों’ जैसे ठोस बिंब सुरक्षित हैं; सैन्य भाषा को न तो नरम किया गया है, न आध्यात्मिक अर्थ में बदल दिया गया है।
