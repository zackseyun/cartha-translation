base_translation:
  language: en
  yaml_path: translation/ot/psalms/144/007.yaml
  text: Stretch out your hand from on high[a]; rescue me and deliver me from many waters[b], from the hand of foreign sons.
translation:
  language: hi
  text: ऊँचाई से अपना हाथ बढ़ा; मुझे उबार, और मुझे बहुत-से जलों[a] से, परदेशियों[b] के हाथ से, छुड़ा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप में, “बहुत जल”; इसका अनुवाद “विशाल जलराशि” भी हो सकता है। यह घेर लेने वाले भारी संकट का काव्यात्मक बिंब है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में शाब्दिक रूप से, “पराएपन के पुत्र”; यह परदेशियों या विदेशियों के लिए एक मुहावरा है।
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁלַח יָדֶיךָ
  choice: अपना हाथ बढ़ा
  rationale: आज्ञार्थक क्रिया और ‘हाथ’ के ठोस बिंब को स्वाभाविक हिन्दी में बनाए रखता है; आशय परमेश्वर के हस्तक्षेप का है, पर बिंब को अमूर्त नहीं किया गया।
- source_word: מִמָּרוֹם
  choice: ऊँचाई से
  rationale: मूल शब्द ऊँचे स्थान या ऊँचाई को सूचित करता है। ‘स्वर्ग से’ कहना सम्भव है, पर वह मूल से अधिक विशिष्ट होता।
- source_word: פְּצֵנִי
  choice: मुझे उबार
  rationale: यह संकट से निकालने या बचाने का भाव व्यक्त करता है और जल के काव्यात्मक बिंब के साथ स्वाभाविक बैठता है।
- source_word: וְהַצִּילֵנִי
  choice: मुझे छुड़ा
  rationale: खतरे या किसी के वश से मुक्त करने का अर्थ देता है और पहली उद्धार-सूचक क्रिया के साथ समानांतरता बनाए रखता है।
- source_word: מִמַּיִם רַבִּים
  choice: बहुत-से जल से
  rationale: רַבִּים के ‘बहुत’ अथवा ‘विशाल/महान’ अर्थों को अनावश्यक रूप से केवल प्रचंडता में नहीं बदलता और मूल का काव्यात्मक जल-बिंब सुरक्षित रखता है।
- source_word: מִיַּד
  choice: के हाथ से
  rationale: शक्ति या अधिकार का आशय होने पर भी ‘हाथ’ का मूल बिंब रखा गया है; यह पद के आरम्भ में परमेश्वर के हाथ के साथ काव्यात्मक विरोध भी बनाता है।
- source_word: בְּנֵי נֵכָר
  choice: परदेशियों
  rationale: शाब्दिक रूप ‘पराएपन के पुत्र’ एक हिब्रू मुहावरा है जिसका सामान्य अर्थ विदेशी या परदेशी लोग है। हिन्दी में ‘परदेशियों’ अर्थ को स्पष्ट और स्वाभाविक रूप से देता है; शाब्दिक रूप पादटिप्पणी में दिया गया है।
theological_decisions:
- issue: परमेश्वर की क्रिया के लिए मानवरूपी भाषा
  choice: ‘ऊँचाई से अपना हाथ बढ़ा’ का ठोस बिंब बनाए रखा
  alternative: ‘स्वर्ग से हस्तक्षेप कर’ जैसा अमूर्त भावानुवाद
  rationale: मूल पाठ परमेश्वर के बचाने वाले कार्य को हाथ बढ़ाने के सजीव बिंब में कहता है; अनुवाद उस भाषा को सिद्धान्तगत व्याख्या में नहीं बदलता।
- issue: בְּנֵי נֵכָר का लिंगयुक्त शाब्दिक रूप और मुहावरेदार अर्थ
  choice: मुख्य पाठ में ‘परदेशियों’ और पादटिप्पणी में शाब्दिक रूप
  alternative: मुख्य पाठ में ‘पराए देश के पुत्रों’
  rationale: यह पदबंध सामान्यतः विदेशी लोगों के लिए हिब्रू मुहावरा है। शाब्दिक पुत्र-संबंध हिन्दी में गलत अर्थ जगा सकता है, इसलिए अर्थ मुख्य पाठ में और रूप पादटिप्पणी में सुरक्षित किया गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और काव्यात्मक रखी गई है। ‘बहुत-से जल’ सामान्य गद्य की अपेक्षा अधिक काव्यात्मक है, पर भजन की मूल छवि और बहुवचन अभिव्यक्ति को निकटता से सुरक्षित रखता है। दोनों पादटिप्पणी-चिह्न सम्बद्ध शब्दों के तुरन्त बाद मुख्य पाठ में दिए गए हैं।
