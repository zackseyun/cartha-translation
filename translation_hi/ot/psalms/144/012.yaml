id: PSA.144.12
reference: Psalms 144:12
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: אֲשֶׁ֤ר בָּנֵ֨י/נוּ כִּ/נְטִעִים֮ מְגֻדָּלִ֪ים בִּֽ/נְעוּרֵ֫י/הֶ֥ם בְּנוֹתֵ֥י/נוּ כְ/זָוִיֹּ֑ת מְ֝חֻטָּב֗וֹת תַּבְנִ֥ית הֵיכָֽל׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/144/012.yaml
  text: May our sons be like well-grown plants in their youth[c][b][a], and our daughters like corner pillars carved in the pattern of a palace.
translation:
  language: hi
  text: ऐसा हो कि[a] हमारे पुत्र अपनी युवावस्था में अच्छी तरह बढ़े हुए पौधों के समान हों, और हमारी पुत्रियाँ राजमहल[c] की रूपरेखा के अनुसार तराशे हुए कोने के स्तंभों[b] के समान हों।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में आरंभिक शब्द का सामान्य अर्थ “जो/कि” है। इसलिए इसे “तब हमारे पुत्र…” या, पिछले पद से जोड़कर, “जिनके पुत्र…” भी समझा जा सकता है।
    reason: syntactic_ambiguity
  - marker: b
    text: या “कोने के वास्तु-तत्त्वों”; इब्रानी शब्द कोने से संबंधित है, पर उसकी सटीक स्थापत्य पहचान निश्चित नहीं है।
    reason: lexical_alternative
  - marker: c
    text: या “मंदिर”; इब्रानी शब्द राजमहल, मंदिर या भव्य सभागार के लिए प्रयुक्त हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲשֶׁר
  choice: ऐसा हो कि
  rationale: यद्यपि यह सामान्यतः संबंधवाचक अव्यय ‘जो/कि’ है, यहाँ पिछले पद की प्रार्थना के बाद इच्छासूचक भाव स्वाभाविक है। हिन्दी में ‘ऐसा हो कि’ उस भाव को स्पष्ट और गरिमापूर्ण ढंग से व्यक्त करता है; वाक्य-संबंध की वास्तविक अस्पष्टता पादटिप्पणी में रखी गई है।
- source_word: בָּנֵינוּ / בְּנוֹתֵינוּ
  choice: हमारे पुत्र / हमारी पुत्रियाँ
  rationale: दोनों लिंग-विशिष्ट संज्ञाओं और काव्यात्मक समानांतरता को ठीक बनाए रखता है।
- source_word: כִּנְטִעִים מְגֻדָּלִים
  choice: अच्छी तरह बढ़े पौधों के समान
  rationale: נטעים रोपे या उगे पौधों को और מגדלים बढ़ाए गए अथवा अच्छी वृद्धि पा चुके होने को दर्शाता है। यह हिन्दी रूप कृषि-बिंब को बनाए रखते हुए सहज है और इसे अनावश्यक रूप से ‘पेड़’ या ‘पौधे’ की किसी संकरी जाति तक सीमित नहीं करता।
- source_word: בִּנְעוּרֵיהֶם
  choice: अपनी युवावस्था में
  rationale: वृद्धि की स्थिति को पुत्रों की युवावस्था में रखता है और इब्रानी काल-संबंध को बिना अतिरिक्त अर्थ जोड़े व्यक्त करता है।
- source_word: כְזָוִיֹּת
  choice: कोने के स्तंभों के समान
  rationale: शब्द मूलतः कोने या कोण से संबंधित वास्तु-तत्त्व बताता है। इस स्थापत्य उपमा में ‘कोने के स्तंभ’ सौंदर्य और संरचनात्मक प्रमुखता दोनों को समझने योग्य ढंग से व्यक्त करता है, किंतु शब्द की सटीक वास्तु-पहचान अनिश्चित होने के कारण विकल्प पादटिप्पणी में दिया गया है।
- source_word: מְחֻטָּבוֹת
  choice: तराशे गए
  rationale: काटकर आकार देने के निष्क्रिय भाव को व्यक्त करता है और अलंकृत स्थापत्य के संदर्भ में स्वाभाविक हिन्दी है।
- source_word: תַּבְנִית
  choice: बनावट के अनुसार
  rationale: मूल शब्द के रूप, नमूने या अभिकल्प के अर्थ को सहज हिन्दी में बनाए रखता है।
- source_word: הֵיכָל
  choice: राजमहल
  rationale: यह शब्द महल, मंदिर या भव्य सभागार को सूचित कर सकता है। घरेलू और राष्ट्रीय समृद्धि के इस प्रसंग में ‘राजमहल’ भव्य स्थापत्य की उपमा को स्पष्ट करता है; ‘मंदिर’ की संभव व्याख्या पादटिप्पणी में सुरक्षित है।
theological_decisions:
- issue: अंतिम स्थापत्य-बिंब में הֵיכָל का अभिप्राय
  choice: राजमहल
  alternative: मंदिर अथवा भव्य सभागार
  rationale: निकटवर्ती प्रसंग परिवार और समाज की समृद्धि का वर्णन करता है और यहाँ कोई स्पष्ट उपासना-संबंधी संकेत नहीं है। इसलिए मुख्य पाठ में गैर-अनुष्ठानिक अर्थ चुना गया है, पर संभावित मंदिर-अर्थ को दबाया नहीं गया।
- issue: आरंभिक אֲשֶׁר का पिछले पद से वाक्यगत संबंध
  choice: 'इच्छासूचक प्रार्थना: ‘ऐसा हो कि’'
  alternative: परिणामसूचक ‘तब’, अथवा संबंधवाचक ‘जिनके पुत्र’
  rationale: पिछले पद की विनती और आगे के कल्याण-वर्णन के बीच इच्छासूचक अर्थ प्रसंग में सुगम है। फिर भी इब्रानी संबंधवाचक रूप दूसरी वाक्य-रचनाओं की अनुमति देता है, इसलिए अस्पष्टता पादटिप्पणी में स्पष्ट की गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण काव्यात्मक गद्य रखा गया है। ‘पुत्र/पुत्रियाँ’ समानांतरता और औपचारिक भजन-शैली बनाए रखते हैं; ‘अच्छी तरह बढ़े पौधे’ और ‘तराशे गए कोने के स्तंभ’ साधारण पाठक के लिए स्पष्ट रहते हुए मूल कृषि और स्थापत्य बिंबों को सुरक्षित रखते हैं।
