  yaml_path: translation/ot/psalms/144/003.yaml
  text: O Yahweh[a], what is man that you know him[c][b], the son of man that you think of him?
translation:
  language: hi
  text: हे यहोवा, मनुष्य[a] क्या है कि तू उसे जानता है, मनुष्य का पुत्र[b] क्या है कि तू उसका स्मरण करता है?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘मनुष्य’ यहाँ प्रतिनिधिक एकवचन में समस्त मानवजाति के लिए प्रयुक्त है।
    reason: lexical_alternative
  - marker: b
    text: ‘मनुष्य का पुत्र’ नश्वर मानव के लिए काव्यात्मक अभिव्यक्ति है; यहाँ यह कोई मसीही उपाधि नहीं है। भजन 8:4 से तुलना करें।
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: हे यहोवा
  rationale: प्रत्यक्ष संबोधन को ‘हे’ से और परमेश्वर के व्यक्तिगत नाम YHWH को प्रचलित हिन्दी रूप ‘यहोवा’ से व्यक्त किया गया है।
- source_word: מָה אָדָם
  choice: मनुष्य क्या है
  rationale: मूल के आलंकारिक प्रश्न और मानव की क्षुद्रता पर आश्चर्य को बनाए रखता है; ‘मनुष्य’ यहाँ प्रतिनिधिक, सामान्य अर्थ में है।
- source_word: וַתֵּדָעֵהוּ
  choice: कि तू उसे जानता है
  rationale: ידע के मूल अर्थ ‘जानना’ को सुरक्षित रखते हुए यहाँ परमेश्वर द्वारा मनुष्य को पहचानने और उसकी सुधि लेने का भाव खुला रखा गया है।
- source_word: בֶּן אֱנוֹשׁ
  choice: मनुष्य का पुत्र
  rationale: हिब्रू काव्यात्मक अभिव्यक्ति और אָדָם के साथ समानांतरता को सुरक्षित रखता है; इस संदर्भ में यह नश्वर मानव का सामान्य उल्लेख है।
- source_word: וַתְּחַשְּׁבֵהוּ
  choice: कि तू उसका ध्यान रखता है
  rationale: חשב के ‘विचार करना/महत्त्व देना’ वाले प्रसंगगत भाव को स्वाभाविक हिन्दी में व्यक्त करता है और पहले पदखंड के साथ समानांतर संबंध बनाए रखता है।
theological_decisions:
- issue: יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल में परमेश्वर का व्यक्तिगत नाम सीधे आया है। हिन्दी बाइबलीय प्रयोग में पहचाने जाने योग्य ‘यहोवा’ रखा गया है, इसे उपाधि ‘प्रभु’ से नहीं बदला गया।
- issue: אָדָם / בֶּן אֱנוֹשׁ का सामान्य मानव-संदर्भ
  choice: मनुष्य … मनुष्य का पुत्र
  alternative: मानवजाति … मानव
  rationale: प्रतिनिधिक एकवचन तथा मूल की काव्यात्मक समानांतरता सुरक्षित रखी गई है। ‘मनुष्य का पुत्र’ यहाँ सामान्य, नश्वर मानव को सूचित करता है; इसे स्वतः मसीही उपाधि नहीं बनाया गया।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और काव्यात्मक हिन्दी। परमेश्वर को एकवचन ‘तू’ से संबोधित करना भजन की सीधी और निकट संबोधन-शैली को बनाए रखता है।
