  text: Flash forth lightning and scatter them[a]; send out your arrows and throw them into confusion.
translation:
  language: hi
  text: 'बिजली चमका और उन्हें तितर-बितर कर दे;

    अपने बाण चला और उनमें खलबली मचा दे[a]।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उन्हें घबराकर भागने पर मजबूर कर दे।” अंतिम क्रिया युद्ध में घबराहट, अव्यवस्था या पराजय का भाव व्यक्त कर सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּרוֹק בָּרָק
  choice: बिजली चमका
  rationale: सजातीय क्रिया और संज्ञा का यह संयोजन बिजली प्रकट करने की आज्ञार्थक पुकार है। हिंदी में ‘बिजली चमका’ संक्षिप्त, सजीव और स्वाभाविक है।
- source_word: וּתְפִיצֵם
  choice: और उन्हें तितर-बितर कर दे
  rationale: हिफ़ील रूप शत्रुओं को बिखेर देने का कारणवाचक भाव व्यक्त करता है; ‘तितर-बितर कर दे’ युद्ध-काव्य के संदर्भ में स्वाभाविक है।
- source_word: שְׁלַח חִצֶּיךָ
  choice: अपने बाण चला
  rationale: शाब्दिक अर्थ ‘अपने बाण भेज’ है, पर हिंदी में बाण छोड़ने/प्रक्षेपित करने के लिए ‘बाण चला’ स्पष्ट और काव्यात्मक रूप से स्वाभाविक है।
- source_word: וּתְהֻמֵּם
  choice: और उनमें खलबली मचा दे
  rationale: המם का कारणवाचक रूप घबराहट, अव्यवस्था या युद्ध में पराजय की ओर धकेलने का व्यापक भाव रखता है। ‘खलबली मचा दे’ मानसिक भ्रम तक अर्थ को सीमित किए बिना आतंक और अव्यवस्था दोनों व्यक्त करता है।
theological_decisions:
- issue: परमेश्वर के योद्धा-रूप का चित्रण
  choice: बिजली और बाणों वाले युद्ध-संबंधी काव्यात्मक चित्र को सीधे बनाए रखा गया है।
  alternative: इसे सामान्य सहायता या न्याय की विनती के रूप में नरम करना।
  rationale: इब्रानी पाठ परमेश्वर को संबोधित आज्ञार्थक विनती में युद्ध के बिंब प्रस्तुत करता है; अनुवाद इस तनावपूर्ण और सशक्त चित्रण को बिना अतिरिक्त व्याख्या के सुरक्षित रखता है।
- issue: וּתְהֻמֵּם के परिणाम की सीमा
  choice: ‘खलबली मचा दे’ द्वारा घबराहट और अव्यवस्था का व्यापक अर्थ रखा गया है।
  alternative: ‘उन्हें परास्त कर दे’ द्वारा युद्ध में अंतिम हार को स्पष्ट करना।
  rationale: मूल क्रिया आतंक, भ्रम, अस्त-व्यस्तता या युद्ध में खदेड़े जाने का अर्थ दे सकती है। मुख्य पाठ किसी एक अंतिम परिणाम को अनिवार्य नहीं बनाता।
translation_notes:
  register: भाषा आधुनिक मानक हिंदी में, प्रार्थनात्मक और काव्यात्मक गरिमा के साथ रखी गई है। समानांतर पंक्तियाँ मूल पद की युद्ध-काव्यात्मक लय को व्यक्त करती हैं; ‘बाण’ ने ‘तीर’ की अपेक्षा थोड़ा अधिक गरिमापूर्ण भजन-साहित्यिक स्वर बनाए रखा है।
