  yaml_path: translation/ot/psalms/144/015.yaml
  text: Blessed are the people for whom it is so[b][a]; blessed are the people whose God is Yahweh.
translation:
  language: hi
  text: धन्य है वह प्रजा जिसके लिए ऐसा है[a]; धन्य है वह प्रजा जिसका परमेश्वर याहवे है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “सुखी है वह प्रजा जिसके लिए ऐसा है।”
    reason: אַשְׁרֵי के लिए ‘धन्य’ के स्थान पर ‘सुखी’ एक संभावित शब्दार्थिक विकल्प है।
lexical_decisions:
- source_word: אַשְׁרֵי
  choice: धन्य है
  rationale: यह इब्रानी धन्यता-वचन किसी क्षणिक भावना के बजाय अनुगृहीत और वांछनीय दशा व्यक्त करता है। ‘धन्य है’ हिंदी में इस काव्यात्मक और धार्मिक भाव को स्वाभाविक रूप से रखता है।
- source_word: הָעָם
  choice: वह प्रजा
  rationale: עָם यहाँ सामूहिक जनसमुदाय को दर्शाता है। ‘प्रजा’ काव्यात्मक संदर्भ में स्वाभाविक है और आधुनिक राजनीतिक अर्थ वाले ‘राष्ट्र’ से अधिक संबंधपरक है।
- source_word: שֶׁכָּכָה לּוֹ
  choice: जिसकी दशा ऐसी है
  rationale: शाब्दिक भाव ‘जिसके लिए ऐसा है’ है और यह पिछले पदों में वर्णित समृद्ध दशा की ओर संकेत करता है। हिंदी में ‘जिसकी दशा ऐसी है’ उसी संकेत को बिना अनावश्यक विस्तार के स्पष्ट और स्वाभाविक बनाता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: मूल पाठ में परमेश्वर का व्यक्तिगत नाम चतुरक्षरीय יהוה है; ‘याहवे’ उसका प्रचलित हिंदी लिप्यंतरण है, न कि किसी उपाधि का प्रतिस्थापन।
- source_word: אֱלֹהָיו
  choice: जिसका परमेश्वर
  rationale: एकवचन प्रत्यय सामूहिक संज्ञा ‘प्रजा’ की ओर लौटता है। इसलिए हिंदी में एकवचन संबंधवाचक रूप ‘जिसका परमेश्वर’ उपयुक्त है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: यहाँ मूल इब्रानी में व्यक्तिगत वाचा-नाम स्पष्ट रूप से उपस्थित है। ‘याहवे’ नाम को नाम के रूप में सुरक्षित रखता है; ‘प्रभु’ उसे उपाधि में बदल देता, जबकि ‘यहोवा’ एक वैकल्पिक पारंपरिक रूप है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और काव्यात्मक हिंदी अपनाई गई है। समानांतर दोनों पंक्तियों में ‘धन्य है वह प्रजा’ की पुनरावृत्ति मूल की संरचना और बल को बनाए रखती है।
