lexical_decisions:
- source_word: אָדָם
  choice: मनुष्य
  rationale: यहाँ אָדָם किसी एक पुरुष के बजाय सामान्य रूप से मानव को सूचित करता है। ‘मनुष्य’ आधुनिक हिन्दी में इस सामान्य कथन की गरिमा और संक्षिप्तता बनाए रखता है।
- source_word: לַהֶבֶל
  choice: एक साँस के समान
  rationale: הֶבֶל का ठोस बिंब साँस या वाष्प है और यहाँ मानव जीवन की क्षणभंगुरता तथा अस्थिरता प्रमुख है। ‘साँस’ उस बिंब को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: דָּמָה
  choice: के समान है
  rationale: क्रिया का अर्थ ‘समान होना’ या ‘सदृश होना’ है; यह रूप सीधे और काव्यात्मक ढंग से तुलना व्यक्त करता है।
- source_word: יָמָיו
  choice: उसके दिन
  rationale: यह मनुष्य के जीवनकाल को उसके ‘दिनों’ के रूप में व्यक्त करने वाले इब्रानी बहुवचन और संबंधसूचक रूप को सुरक्षित रखता है।
- source_word: כְּצֵל עוֹבֵר
  choice: ढलती हुई छाया के समान
  rationale: צֵל छाया है और עוֹבֵר उसके गुजरते जाने को दर्शाता है। हिन्दी में ‘ढलती हुई छाया’ चलायमान तथा शीघ्र मिटते बिंब को स्वाभाविक रूप से व्यक्त करती है।
