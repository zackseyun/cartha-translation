  yaml_path: translation/ot/psalms/144/013.yaml
  text: May our storehouses be full[a], supplying every kind of produce; may our flocks multiply by thousands, by tens of thousands[b], in our open fields.
translation:
  language: hi
  text: हमारे भंडार भरे रहें, और उनसे हर प्रकार की उपज[a] निकलती रहे; हमारी भेड़-बकरियों के झुंड हमारे खुले स्थानों[b] में हजारों और दसियों हजारों की संख्या में बढ़ें।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक अर्थ ‘एक प्रकार से दूसरे प्रकार तक’ है; यह अनेक किस्मों की भरपूर उपज का भाव व्यक्त करता है।
    reason: lexical_alternative
  - marker: b
    text: इस इब्रानी शब्द का अर्थ ‘हमारी गलियों में’ या ‘हमारे बाहरी स्थानों में’ भी हो सकता है। यहाँ पशुओं के झुंडों के संदर्भ में ‘खुले स्थानों’ अनूदित किया गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: מְזָוֵינוּ
  choice: हमारे भंडार
  rationale: यह दुर्लभ संज्ञा सामग्री या उपज रखने के स्थान को सूचित करती है; ‘भंडार’ आधुनिक हिन्दी में स्पष्ट और कृषि-संदर्भ के अनुकूल है।
- source_word: מְלֵאִים
  choice: भरे रहें
  rationale: विशेषण ‘भरे हुए’ का अर्थ देता है; आसपास के आशीष-कामना वाले भाव को हिन्दी में ‘रहें’ स्वाभाविक रूप से व्यक्त करता है।
- source_word: מְפִיקִים
  choice: उनमें से ... निकलती रहे
  rationale: कृदन्त का मूल भाव बाहर निकालना या उपलब्ध कराना है। यह रचना भंडारों से प्रचुर उपज निकलने का चित्र बनाए रखती है और हिन्दी में स्वाभाविक है।
- source_word: מִזַּן אֶל זַן
  choice: हर प्रकार की उपज
  rationale: शाब्दिक रूप ‘प्रकार से प्रकार तक’ अनेक किस्मों की प्रचुर सामग्री को दर्शाता है; संदर्भ के कारण ‘उपज’ स्पष्ट किया गया है।
- source_word: צֹאנֵנוּ
  choice: हमारी भेड़-बकरियों के झुंड
  rationale: यह सामूहिक संज्ञा छोटे पालतू पशुओं, विशेषकर भेड़ों और बकरियों, के झुंडों को दर्शाती है; यह हिन्दी में अर्थ को स्पष्ट रखती है।
- source_word: מַאֲלִיפוֹת
  choice: हजारों ... की संख्या में बढ़ें
  rationale: ‘हजार’ से संबद्ध यह रूप झुंडों की हजारों तक वृद्धि या हजारों की उत्पत्ति को व्यक्त करता है।
- source_word: מְרֻבָּבוֹת
  choice: दसियों हजारों
  rationale: רבבה (‘दस हजार’) से बना रूप बढ़ती हुई संख्या के चरम को दर्शाता है और पहले ‘हजारों’ के साथ आरोही समानांतरता बनाए रखता है।
- source_word: בְּחוּצוֹתֵינוּ
  choice: हमारे खुले स्थानों में
  rationale: חוּץ बस्ती की गलियों, बाहर के स्थानों या खुले सार्वजनिक क्षेत्रों को सूचित कर सकता है। ‘खुले स्थान’ पशुपालन-संदर्भ के अनुकूल है और ‘खेत’ कहकर अर्थ को अनावश्यक रूप से सीमित नहीं करता।
