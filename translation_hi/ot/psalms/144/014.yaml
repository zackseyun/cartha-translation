  edition: WLC
  text: אַלּוּפֵ֗י/נוּ מְֽסֻבָּ֫לִ֥ים אֵֽין פֶּ֭רֶץ וְ/אֵ֣ין יוֹצֵ֑את וְ/אֵ֥ין צְ֝וָחָ֗ה בִּ/רְחֹבֹתֵֽי/נוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/144/014.yaml
  text: Our cattle are heavy with young[a]; there is no breach and no going out[c][b], and no cry in our streets.
translation:
  language: hi
  text: हमारे मवेशी बोझ से लदे हुए हैं[a]; न कोई सेंध लगती है, न कोई बाहर निकलता है[b], और न हमारे चौकों में हाहाकार होता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “हमारे मवेशी गर्भ से भारी हैं।” इब्रानी का शाब्दिक अर्थ “हमारे बैल/मवेशी लदे हुए हैं” है। इस प्रसंग में अनेक लोग इसे पशुधन की उर्वरता और भरपूरी का वर्णन समझते हैं।
    reason: lexical_alternative
  - marker: b
    text: या, “न कोई निर्वासन में जाता है,” अथवा “न किसी को बाहर ले जाया जाता है।” इब्रानी अभिव्यक्ति बहुत संक्षिप्त है और अनिष्टपूर्ण या बलपूर्वक प्रस्थान की ओर संकेत कर सकती है।
    reason: alternative_reading
lexical_decisions:
- source_word: אַלּוּפֵינוּ
  choice: हमारे मवेशी
  rationale: समृद्धि और पशुधन की उर्वरता के संदर्भ में इसे पालतू पशुओं के अर्थ में लिया गया है। शब्द के ‘बैल’, ‘प्रधान’ या ‘कुल-नायक’ जैसे अन्य अर्थ संभव हैं, इसलिए पशुधन-संबंधी विकल्प को प्रसंग के आधार पर चुना गया है।
- source_word: מְסֻבָּלִים
  choice: गर्भ से भारी हैं
  rationale: मूल अर्थ ‘लदे हुए/भार उठाए हुए’ है। पशुधन की समृद्धि के संदर्भ में यह गर्भ से भारी होने का संकेत दे सकता है; शाब्दिक विकल्प पादटिप्पणी में रखा गया है।
- source_word: אֵין פֶּרֶץ
  choice: न कोई सेंध है
  rationale: פֶּרֶץ टूटने, दरार या सुरक्षा-घेरे में सेंध को दर्शाता है। ‘सेंध’ नागरिक सुरक्षा के प्रसंग को संक्षेप और स्वाभाविक ढंग से व्यक्त करती है, बिना दीवार का स्पष्ट उल्लेख जोड़े।
- source_word: וְאֵין יוֹצֵאת
  choice: न कोई बाहर निकलता है
  rationale: इब्रानी पद संक्षिप्त और व्याकरणतः अस्पष्ट है। यह अनिष्टपूर्ण प्रस्थान, निर्वासन अथवा सामान्यतः बाहर जाने का संकेत दे सकता है। मुख्य पाठ में सामान्य अभिव्यक्ति रखकर विशिष्ट संभावनाएँ पादटिप्पणी में दी गई हैं।
- source_word: וְאֵין צְוָחָה
  choice: न ... हाहाकार होता है
  rationale: צְוָחָה संकट की पुकार या विलापसूचक चीत्कार है। ‘हाहाकार’ सार्वजनिक विपत्ति और दुःख की पुकार का भाव स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: בִּרְחֹבֹתֵינוּ
  choice: हमारे चौकों में
  rationale: רְחֹבוֹת नगर के खुले सार्वजनिक स्थानों, चौकों या चौड़ी सड़कों को दर्शाता है। ‘चौकों’ से सामुदायिक सार्वजनिक स्थल का आशय बना रहता है।
theological_decisions:
- issue: וְאֵין יוֹצֵאת में प्रस्थान का स्वरूप
  choice: न कोई बाहर निकलता है
  alternative: न कोई निर्वासन में जाता है / न किसी को बाहर ले जाया जाता है
  rationale: मूल पाठ यह स्पष्ट नहीं करता कि बाहर जाना स्वैच्छिक है, युद्ध-संबंधी है या बलपूर्वक निर्वासन। मुख्य पाठ इस तनाव को सामान्य रूप में रखता है और पादटिप्पणी संभावित अर्थ बताती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सुबोध रखी गई है। समानांतर ‘न... न... और न...’ संरचना इब्रानी पद की लय बनाए रखती है। कठिन पदों की वास्तविक अस्पष्टता को मुख्य पाठ और पादटिप्पणियों के संयोजन से सुरक्षित रखा गया है।
