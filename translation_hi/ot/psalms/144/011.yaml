base_translation:
  language: en
  yaml_path: translation/ot/psalms/144/011.yaml
  text: Rescue me and deliver me from the hand of foreigners[c][b][a], whose mouth speaks falsehood and whose right hand is a right hand of deceit.
translation:
  language: hi
  text: मुझे परदेशियों[a] के हाथ से छुड़ा और बचा; उनका मुँह झूठ बोलता है[b], और उनका दाहिना हाथ छल का दाहिना हाथ है।[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से ‘परदेश के पुत्र’; यह ‘परदेशियों’ के लिए एक मुहावरा है।
    reason: lexical_alternative
  - marker: b
    text: या, “उनका मुँह व्यर्थता/खोखली बातें बोलता है।”
    reason: lexical_alternative
  - marker: c
    text: इब्रानी में ‘दाहिना हाथ’ दोहराया गया है। दाहिना हाथ प्रायः शक्ति, प्रतिज्ञा या कार्य का प्रतीक होता है।
    reason: cultural_note
lexical_decisions:
- source_word: פְּצֵנִי
  choice: मुझे छुड़ा
  rationale: פצה के आज्ञार्थक रूप और प्रथम पुरुष एकवचन प्रत्यय को एक तात्कालिक मुक्ति की विनती के रूप में व्यक्त करता है।
- source_word: וְהַצִּילֵנִי
  choice: मुझे बचा
  rationale: נצל के हिफ़ील आज्ञार्थक रूप को अलग क्रिया के रूप में रखकर इब्रानी समानांतरता को बनाए रखता है।
- source_word: מִיַּד
  choice: के हाथ से
  rationale: शक्ति या नियंत्रण के लिए प्रयुक्त इब्रानी मुहावरे की हाथ वाली छवि को सुरक्षित रखता है और हिन्दी में स्वाभाविक है।
- source_word: בְּנֵי נֵכָר
  choice: परदेशियों
  rationale: शाब्दिक अर्थ ‘परदेश के पुत्र’ है, पर यह परदेशियों के लिए इब्रानी मुहावरा है; ‘परदेशी’ आधुनिक हिन्दी में सहज और गरिमापूर्ण है।
- source_word: פִּיהֶם דִּבֶּר שָׁוְא
  choice: उनका मुँह झूठ बोलता है
  rationale: שָׁוְא में व्यर्थता, खोखलेपन और असत्य का अर्थ-क्षेत्र है; यहाँ שָׁקֶר के समानांतर ‘झूठ’ प्रसंगानुकूल है, जबकि पदटिप्पणी वास्तविक वैकल्पिक अर्थ बचाती है।
- source_word: וִימִינָם יְמִין שָׁקֶר
  choice: उनका दाहिना हाथ छल का दाहिना हाथ है
  rationale: ‘दाहिना हाथ’ की इब्रानी पुनरुक्ति और शक्ति, प्रतिज्ञा अथवा कार्य से जुड़ी उसकी सांस्कृतिक छवि को बनाए रखता है।
