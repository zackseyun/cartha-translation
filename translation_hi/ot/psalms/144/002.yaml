source:
  edition: WLC
  text: חַסְדִּ֥/י וּ/מְצוּדָתִ/י֮ מִשְׂגַּבִּ֪/י וּֽ/מְפַלְטִ֫/י לִ֥/י מָ֭גִנִּ/י וּ/ב֣/וֹ חָסִ֑יתִי הָ/רוֹדֵ֖ד עַמִּ֣/י תַחְתָּֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/144/002.yaml
  text: My steadfast love and my fortress[a], my stronghold and my deliverer, my shield, and in him I take refuge[b], the one who subdues peoples under me.
translation:
  language: hi
  text: 'वह मेरा अटल प्रेम और मेरा गढ़ है,

    मेरा ऊँचा शरणस्थान और मेरा छुड़ानेवाला,

    मेरी ढाल है, और मैं उसी की शरण लेता हूँ;

    वही मेरी प्रजा[a] को मेरे अधीन करता है।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या, कुछ प्राचीन अनुवादों और भजन 18:47 के समानांतर के अनुसार: “वही जातियों को मेरे अधीन करता है।”'
    reason: alternative_reading
lexical_decisions:
- source_word: חַסְדִּי
  choice: मेरा अटल प्रेम
  rationale: חֶסֶד में स्थायी निष्ठा, करुणा और प्रेम का भाव है। यहाँ प्रथम पुरुष प्रत्यय और परमेश्वर के उपाधि-क्रम में यह परमेश्वर को स्वयं भजनकार का ‘अटल प्रेम’ बताता है।
- source_word: מְצוּדָתִי
  choice: मेरा गढ़
  rationale: यह सुरक्षा देने वाले दुर्ग या किले को दर्शाता है; ‘गढ़’ संक्षिप्त, स्वाभाविक और काव्यात्मक सैन्य रूपक है।
- source_word: מִשְׂגַּבִּי
  choice: मेरा ऊँचा शरणस्थान
  rationale: यह ऊँचे और सुरक्षित स्थान का बोध देता है। इस अनुवाद से מְצוּדָה से भेद भी बना रहता है और ऊँचाई तथा सुरक्षा दोनों व्यक्त होते हैं।
- source_word: מְפַלְטִי לִי
  choice: मेरा छुड़ानेवाला
  rationale: מְפַלְטִי बच निकलने या छुड़ाए जाने का कारण बनने वाले को दर्शाता है। לִי व्यक्तिगत लाभ या संबंध पर बल देता है, जो हिन्दी में ‘मेरा’ से स्वाभाविक रूप से व्यक्त हो जाता है; ‘मेरे लिए मेरा छुड़ानेवाला’ अनावश्यक रूप से बोझिल होता।
- source_word: מָגִנִּי
  choice: मेरी ढाल
  rationale: सुरक्षा का सीधा सैन्य रूपक; आधुनिक हिन्दी में सहज और स्पष्ट।
- source_word: וּבוֹ חָסִיתִי
  choice: जिसकी शरण मैं लेता हूँ
  rationale: חסה का मूल भाव शरण लेना है। इब्रानी पूर्ण क्रिया यहाँ स्थायी भरोसे की काव्यात्मक घोषणा हो सकती है; वर्तमानकालीन हिन्दी उस निरंतर संबंध को स्वाभाविक ढंग से व्यक्त करती है।
- source_word: הָרוֹדֵד
  choice: वही ... अधीन करता है
  rationale: यहाँ רדד का भाव वश में या अधीन करना है। ‘अधीन करता है’ राजकीय संदर्भ और תַחְתָּי के साथ स्वाभाविक हिन्दी देता है।
- source_word: עַמִּי
  choice: मेरी प्रजा
  rationale: मसोरेटिक स्वरांकन के अनुसार यह एकवचन और प्रथम पुरुष प्रत्यय सहित ‘मेरी प्रजा/मेरे लोग’ है। राजकीय संदर्भ में ‘मेरी प्रजा’ हिन्दी में अधिक स्वाभाविक है और जनसमूह को राजा के शासन के अधीन व्यवस्थित करने का अर्थ दे सकती है।
- source_word: תַחְתָּי
  choice: मेरे अधीन
  rationale: शाब्दिक स्थानिक रूपक ‘मेरे नीचे’ यहाँ शासन या अधीनता बताता है; ‘मेरे अधीन’ स्पष्ट और मुहावरेदार हिन्दी है।
theological_decisions:
- issue: עַמִּי को मसोरेटिक एकवचन ‘मेरी प्रजा’ मानें या प्राचीन पाठ-साक्ष्यों तथा भजन 18:47 के समानांतर के आधार पर बहुवचन ‘जाति-जाति के लोगों’ के रूप में पढ़ें।
  choice: मेरी प्रजा
  alternative: जाति-जाति के लोगों को
  rationale: WLC का प्रत्यक्ष स्वरांकित पाठ עַמִּי, ‘मेरी प्रजा/मेरे लोग’, है; इसलिए मूल-पाठ की प्राथमिकता के अनुसार इसे मुख्य पाठ में रखा गया है। इससे अत्याचार अनिवार्यतः अभिप्रेत नहीं, बल्कि परमेश्वर द्वारा राजा के शासन के अधीन उसकी प्रजा को स्थापित या व्यवस्थित करना भी समझा जा सकता है। प्राचीन अनुवादों और समानांतर पद से समर्थित बहुवचन पाठ को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की, गरिमापूर्ण और काव्यात्मक रखी गई है। समानार्थी सुरक्षा-रूपकों के बीच भेद बनाए रखने के लिए ‘गढ़’ और ‘ऊँचा शरणस्थान’ चुने गए हैं। मुख्य पाठ में WLC के עַמִּי को प्राथमिकता दी गई है; वैकल्पिक बहुवचन पाठ पादटिप्पणी में है।
