id: PSA.144.10
reference: Psalms 144:10
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: הַ/נּוֹתֵ֥ן תְּשׁוּעָ֗ה לַ/מְּלָ֫כִ֥ים הַ֭/פּוֹצֶה אֶת דָּוִ֥ד עַבְדּ֗/וֹ מֵ/חֶ֥רֶב רָעָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/144/010.yaml
  text: the one who gives salvation to kings[b][a], who rescues David his servant from the evil sword.
translation:
  language: hi
  text: जो राजाओं को उद्धार[a] देता है, जो अपने सेवक दाऊद को बुरी तलवार[b] से बचाता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘छुटकारा’ अथवा ‘विजय’।
    reason: lexical_alternative
  - marker: b
    text: या ‘घातक तलवार’। हिब्रू में शाब्दिक रूप से ‘बुरी तलवार’ है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנּוֹתֵן
  choice: जो ... देता है
  rationale: निश्चयवाचक उपपद सहित कालवाचक कृदंत यहाँ संज्ञात्मक रूप में परमेश्वर की ओर संकेत करता है। हिंदी में ‘जो ... देता है’ मूल की कृदंतीय शैली और पिछले संदर्भ से संबंध को स्वाभाविक रूप से बनाए रखता है।
- source_word: תְּשׁוּעָה
  choice: उद्धार
  rationale: यह शब्द उद्धार, छुटकारा या युद्ध में विजय का अर्थ दे सकता है। ‘उद्धार’ तत्कालीन सैन्य संदर्भ को समेटते हुए परमेश्वर के बचाने के कार्य की व्यापकता बनाए रखता है।
- source_word: לַמְּלָכִים
  choice: राजाओं को
  rationale: ל यहाँ परोक्ष कर्म को चिह्नित करता है; ‘राजाओं को’ हिंदी में ‘उद्धार देता है’ के साथ सीधा और स्वाभाविक है।
- source_word: הַפּוֹצֶה
  choice: जो ... बचाता है
  rationale: यह कृदंत संकट से छुड़ाने या बचाने का भाव देता है। ‘बचाता है’ आधुनिक हिंदी में सहज है और पहले खंड के ‘उद्धार देता है’ के समानांतर है।
- source_word: אֶת דָּוִד
  choice: दाऊद को
  rationale: אֶת प्रत्यक्ष कर्म का चिह्न है और דָּוִד नाम का मानक हिंदी बाइबलीय रूप ‘दाऊद’ है।
- source_word: עַבְדּוֹ
  choice: अपने सेवक
  rationale: दाऊद के लिए यह राजकीय और वाचागत संबंध का प्रचलित पद है। ‘सेवक’ संदर्भानुकूल है और दासत्व का अनावश्यक कठोर भाव नहीं जोड़ता; हिंदी में कर्ता की ओर संबंध स्पष्ट करने के लिए ‘अपने’ स्वाभाविक है।
- source_word: מֵחֶרֶב
  choice: तलवार से
  rationale: מן संकट से अलग किए जाने या बचाए जाने का भाव देता है। हिंदी में ‘तलवार से बचाता है’ स्वाभाविक रूप से उसी संबंध को व्यक्त करता है।
- source_word: רָעָה
  choice: बुरी
  rationale: मूल विशेषण का सीधा अर्थ ‘बुरी’ है। यह विनाशकारी या घातक अर्थ की संभावना रखते हुए मूल की नैतिक और हानिकारक दोनों छायाओं को खुला रखता है।
theological_decisions:
- issue: राजकीय और सैन्य संदर्भ में תְּשׁוּעָה का अर्थ-क्षेत्र
  choice: उद्धार
  alternative: छुटकारा; विजय
  rationale: राजाओं और तलवार से दाऊद के बचाव के उल्लेख के कारण सैन्य अर्थ उपस्थित है, पर हिब्रू शब्द परमेश्वर के बचाने के व्यापक कार्य को भी व्यक्त करता है। ‘उद्धार’ इस तनाव को बिना केवल युद्ध-विजय तक सीमित किए बनाए रखता है।
- issue: दाऊद के लिए עַבְדּוֹ का अनुवाद
  choice: अपने सेवक
  alternative: अपने दास
  rationale: यहाँ दाऊद का परमेश्वर के अधीन राजकीय और वाचागत पद प्रमुख है। ‘सेवक’ हिंदी में इस संबंध को ठीक से व्यक्त करता है और ऐसे दासत्व का भाव नहीं थोपता जो संदर्भ में मुख्य नहीं है।
translation_notes:
  register: आधुनिक मानक हिंदी में संक्षिप्त, गरिमापूर्ण और काव्यात्मक वाक्य-विन्यास रखा गया है। दोनों हिब्रू कृदंतों की समानांतर संरचना को दो बार ‘जो’ द्वारा बनाए रखा गया है।
