base_translation:
  language: en
  yaml_path: translation/ot/psalms/144/005.yaml
  text: O Yahweh[a], bend your heavens and come down[b]; touch the mountains so that they smoke.
translation:
  language: hi
  text: हे याहवे, अपने आकाश को झुका और उतर आ[a]; पहाड़ों को छू, कि उनसे धुआँ उठे[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “नीचे उतर।”
    reason: lexical_alternative
  - marker: b
    text: या, “और उनसे धुआँ उठेगा”; हिब्रू को परमेश्वर के स्पर्श के फलस्वरूप होने वाली घटना के रूप में भी समझा जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: हे यहवे
  rationale: परमेश्वर के व्यक्तिगत नाम को उपाधि से बदलने के बजाय देवनागरी में निकट लिप्यंतरण के साथ रखा गया है; सम्बोधन को ‘हे’ से व्यक्त किया गया है।
- source_word: הַט שָׁמֶיךָ
  choice: अपने आकाश को झुका
  rationale: נטה के नीचे की ओर झुकाने के सजीव बिंब को बनाए रखा गया है। हिब्रू का बहुवचन हिन्दी में स्वाभाविक सामूहिक एकवचन ‘आकाश’ से व्यक्त किया गया है।
- source_word: וְתֵרֵד
  choice: और उतर आ
  rationale: प्रत्यक्ष सम्बोधन में ‘उतर आ’ स्वाभाविक हिन्दी है और ऊपर से नीचे आने की गति को स्पष्ट रखता है।
- source_word: גַּע בֶּהָרִים
  choice: पहाड़ों को छू
  rationale: נגע का सामान्य अर्थ ‘छूना’ है; ईश-प्रकाशन के सामर्थ्यपूर्ण प्रसंग के बावजूद ‘प्रहार कर’ जैसे अधिक प्रबल अर्थ को पाठ में नहीं जोड़ा गया।
- source_word: וְיֶעֱשָׁנוּ
  choice: कि उनसे धुआँ उठे
  rationale: क्रियात्मक क्रम को परमेश्वर के स्पर्श के परिणाम के रूप में स्वाभाविक हिन्दी में व्यक्त किया गया है; ‘उनसे’ का संकेत पहाड़ों की ओर है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहवे
  alternative: यहोवा
  rationale: मूल पाठ में प्रयुक्त चतुरक्षरी व्यक्तिगत नाम को ‘प्रभु’ जैसी उपाधि से प्रतिस्थापित न करके लिप्यंतरित किया गया है।
- issue: पहाड़ों से धुआँ उठने और परमेश्वर के स्पर्श का सम्बन्ध
  choice: स्पर्श के परिणाम के रूप में—‘कि उनसे धुआँ उठे’
  alternative: समन्वित भाव—‘और उनसे धुआँ उठेगा’
  rationale: आज्ञार्थक क्रियाओं के बाद आया हिब्रू अपूर्ण रूप परिणाम अथवा आगे घटने वाली घटना, दोनों तरह समझा जा सकता है; मुख्य पाठ में परिणाम का स्वाभाविक पाठ रखा गया और विकल्प पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: आधुनिक, काव्यात्मक और गरिमापूर्ण हिन्दी। परमेश्वर से सीधे एकवचन सम्बोधन के कारण ‘झुका’, ‘उतर आ’ और ‘छू’ रखा गया है। ‘आकाशों’ की अस्वाभाविकता से बचते हुए हिन्दी का सामूहिक ‘आकाश’ चुना गया है।
