  yaml_path: translation/ot/psalms/144/009.yaml
  text: O God[a], I will sing a new song to you; on a ten-stringed harp I will make music to you.
translation:
  language: hi
  text: हे परमेश्वर, मैं तुझे एक नया गीत गाऊँगा; दस तारों वाले वाद्य पर मैं तुझे संगीत सुनाऊँगा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֱלֹהִים
  choice: हे परमेश्वर
  rationale: यहाँ संज्ञा सीधे संबोधन में है। ‘हे परमेश्वर’ प्रार्थनामय काव्य-संबोधन को स्वाभाविक और गरिमापूर्ण हिंदी में व्यक्त करता है।
- source_word: שִׁיר חָדָשׁ
  choice: एक नया गीत
  rationale: यह पदबंध सीधे ‘नया गीत’ का अर्थ देता है और भजन-साहित्य के परिचित भाव को बनाए रखता है।
- source_word: אָשִׁירָה
  choice: मैं ... गाऊँगा
  rationale: प्रथम पुरुष cohortative वक्ता के संकल्प या अभिप्राय को व्यक्त करता है; हिंदी भविष्यत् रूप इसे स्वाभाविक ढंग से दर्शाता है।
- source_word: לָּךְ
  choice: तेरे लिए
  rationale: לְ यहाँ स्तुति के अभिप्रेत प्राप्तकर्ता को सूचित करता है। ‘तेरे लिए’ हिंदी में समर्पण का भाव स्वाभाविक रूप से व्यक्त करता है; ‘तुझे’ भी संभव है।
- source_word: בְּנֵבֶל עָשׂוֹר
  choice: दस तारों वाले वाद्य पर
  rationale: נֵבֶל किसी प्राचीन तार-वाद्य का नाम है, पर उसकी ठीक पहचान अनिश्चित है। सामान्य ‘वाद्य’ अनावश्यक रूप से वीणा या किसी अन्य आधुनिक वाद्य की निश्चित पहचान आरोपित नहीं करता; בְּ का वाद्यात्मक अर्थ ‘पर’ से व्यक्त हुआ है।
- source_word: אֲזַמְּרָה
  choice: मैं ... संगीत बजाऊँगा
  rationale: זמר का पिअेल रूप संगीत करने अथवा स्तुति गाने का अर्थ दे सकता है। स्पष्ट वाद्य-संदर्भ में ‘संगीत बजाऊँगा’ क्रिया को स्वाभाविक हिंदी में व्यक्त करता है और पहले ‘गीत गाऊँगा’ की अनावश्यक पुनरावृत्ति से बचता है।
