  text: Of David. Blessed is Yahweh[a], my rock, who trains my hands for battle, my fingers for war.
translation:
  language: hi
  text: 'दाऊद का।[a]


    याहवे धन्य हैं—मेरी चट्टान,

    जो मेरे हाथों को युद्ध के लिए,

    और मेरी उँगलियों को लड़ाई के लिए प्रशिक्षित करते हैं।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: भजन के शीर्षक में इसका अनुवाद “दाऊद के लिए” या “दाऊद द्वारा” भी हो सकता है; हिब्रू संबंधबोधक उपसर्ग लेखकीयता, संबंध या समर्पण का संकेत दे सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: בָּרוּךְ
  choice: धन्य हैं
  rationale: ईश्वर की स्तुति व्यक्त करने वाले हिब्रू विशेषण का परंपरागत और स्वाभाविक हिन्दी रूप।
- source_word: יְהוָה
  choice: याहवे
  rationale: चार-अक्षरीय परमेश्वर-नाम को उपाधि से बदलने के बजाय नाम के रूप में प्रस्तुत किया गया है।
- source_word: צוּרִי
  choice: मेरी चट्टान
  rationale: मूल रूपक को बनाए रखता है और सुरक्षा तथा दृढ़ता का भाव व्यक्त करता है।
- source_word: הַמְלַמֵּד
  choice: प्रशिक्षित करते हैं
  rationale: युद्ध-कौशल सिखाने के प्रसंग में केवल सामान्य 'सिखाते हैं' की अपेक्षा यह अधिक स्वाभाविक है।
- source_word: קְרָב / מִלְחָמָה
  choice: युद्ध / लड़ाई
  rationale: समानांतर पंक्तियों में मूल के दो निकटार्थी शब्दों का भेद यथासंभव बनाए रखा गया है।
theological_decisions:
- issue: भजन-शीर्षक में לְדָוִד का संबंध
  choice: दाऊद का
  alternative: दाऊद के लिए / दाऊद द्वारा
  rationale: לְ उपसर्ग लेखकीयता, संबंध अथवा समर्पण सूचित कर सकता है; मुख्य पाठ में पारंपरिक संक्षिप्त रूप रखा और अस्पष्टता पाद-टिप्पणी में सुरक्षित की गई।
- issue: युद्ध-प्रशिक्षण का कर्ता
  choice: याहवे को प्रत्यक्ष रूप से युद्ध-कौशल का प्रशिक्षक बताया गया
  alternative: रूपक को सामान्य सामर्थ्य देने के अर्थ में नरम करना
  rationale: मूल पाठ का स्पष्ट और धर्मवैचारिक रूप से तनावपूर्ण कथन बिना व्याख्यात्मक नरमी के सुरक्षित रखा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में काव्यात्मक, गरिमापूर्ण और सहज शैली। परमेश्वर के लिए आदरसूचक बहुवचन क्रिया-रूप रखा गया है; समानांतर पंक्ति-विन्यास मूल काव्य-संरचना को उभारता है।
