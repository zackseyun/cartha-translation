  yaml_path: translation/ot/psalms/144/008.yaml
  text: whose mouth speaks emptiness[b][a], and whose right hand is a right hand of falsehood.
translation:
  language: hi
  text: जिनका मुँह व्यर्थ की बातें बोलता है[a], और जिनका दाहिना हाथ झूठ का दाहिना हाथ है[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “झूठ बोलता है”; שָׁוְא का अर्थ व्यर्थता, खोखलापन या छल हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में “दाहिना हाथ ... दाहिना हाथ” की पुनरावृत्ति जोर देने के लिए है। दाहिना हाथ प्रायः शपथ, शक्ति या प्रतिज्ञाबद्ध निष्ठा का प्रतीक था; इसलिए “झूठ का दाहिना हाथ” छल या विश्वासघात का संकेत दे सकता है।
    reason: cultural_note
lexical_decisions:
- source_word: אֲשֶׁר
  choice: जिनका
  rationale: यह संबंधवाचक अव्यय पिछले पद में आए परदेशियों का वर्णन आगे बढ़ाता है; ‘जिनका’ दोनों अधिकारसूचक पदबंधों के साथ स्वाभाविक है।
- source_word: פִּיהֶם
  choice: मुँह
  rationale: इब्रानी में एकवचन संज्ञा के साथ बहुवचन प्रत्यय है, अर्थात ‘उनका मुँह’; हिन्दी में ‘जिनका मुँह’ सामूहिक अर्थ को सहज रूप से बनाए रखता है।
- source_word: דִּבֶּר
  choice: बोलता है
  rationale: पूर्ण रूप यहाँ बीती हुई एक घटना के बजाय उनके चारित्रिक व्यवहार का वर्णन करता है, इसलिए वर्तमान काल उपयुक्त है।
- source_word: שָׁוְא
  choice: व्यर्थ बातें
  rationale: शब्द में खोखलेपन, व्यर्थता और छल का व्यापक अर्थक्षेत्र है। ‘व्यर्थ बातें’ हिन्दी में स्वाभाविक रहते हुए अर्थ को केवल ‘झूठ’ तक सीमित नहीं करता।
- source_word: וִימִינָם
  choice: और जिनका दाहिना हाथ
  rationale: दूसरे समानांतर खंड को आरम्भ करता है; ‘जिनका’ की पुनरावृत्ति इब्रानी संरचना को स्पष्ट और स्वाभाविक हिन्दी में रखती है।
- source_word: יְמִין
  choice: दाहिना हाथ
  rationale: इब्रानी की ‘दाहिना हाथ ... दाहिना हाथ’ पुनरावृत्ति जोर देती है; उसे अनुवाद में बनाए रखा गया है।
- source_word: שָׁקֶר
  choice: झूठ
  rationale: यह असत्य, छल या कपट को दर्शाता है। ‘झूठ का दाहिना हाथ’ मूल की अमूर्त और तीखी अभिव्यक्ति को सुरक्षित रखता है।
theological_decisions:
- issue: ‘दाहिना हाथ’ का आशय
  choice: मूल रूपक को पाठ में ज्यों का त्यों रखना
  alternative: इसे सीधे ‘वे विश्वासघाती हैं’ या ‘झूठी शपथ खाते हैं’ कहना
  rationale: दाहिना हाथ शपथ, शक्ति या निष्ठा का संकेत हो सकता है; मूल पाठ किसी एक आशय को स्पष्ट रूप से निर्धारित नहीं करता, इसलिए व्याख्या टिप्पणी में दी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज काव्यात्मक शैली रखी गई है। इब्रानी समानांतरता और जानबूझकर की गई पुनरावृत्ति सुरक्षित हैं; अस्पष्ट रूपकों को मुख्य पाठ में सरल करके समाप्त नहीं किया गया।
