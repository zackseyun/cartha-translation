id: PSA.146.9
reference: Psalms 146:9
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: יְהוָ֤ה שֹׁ֘מֵ֤ר אֶת גֵּרִ֗ים יָת֣וֹם וְ/אַלְמָנָ֣ה יְעוֹדֵ֑ד וְ/דֶ֖רֶךְ רְשָׁעִ֣ים יְעַוֵּֽת׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/146/009.yaml
  text: Yahweh watches over the sojourners[a]; he upholds the fatherless and the widow[b], but he twists the way of the wicked.
translation:
  language: hi
  text: याहवे परदेशियों की रक्षा करता है[a]; वह अनाथ और विधवा को सहारा देता है, परन्तु दुष्टों का मार्ग टेढ़ा कर देता है[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात ऐसे गैर-स्थानीय लोग जो उस देश या समुदाय के बीच रहते हैं; अनुवाद ‘अजनबी’, ‘विदेशी’ या ‘प्रवासी निवासी’ भी सम्भव है।
    reason: lexical_alternative
  - marker: b
    text: या ‘दुष्टों के मार्ग को विकृत कर देता है’; भावार्थ सम्भवतः ‘दुष्टों के मार्ग को विनाश की ओर ले जाता है’।
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत नाम को उपाधि से बदलने के बजाय उसका प्रचलित हिन्दी लिप्यंतरण रखा गया है।
- source_word: שֹׁמֵר
  choice: रक्षा करता है
  rationale: यह कृदन्त याहवे की निरन्तर, सक्रिय देखभाल और सुरक्षा व्यक्त करता है; आधुनिक हिन्दी में यह स्वाभाविक और स्पष्ट है।
- source_word: גֵּרִים
  choice: परदेशियों
  rationale: यह उन गैर-स्थानीय लोगों को दर्शाता है जो किसी समुदाय के बीच रह रहे हों; ‘परदेशी’ सामाजिक असुरक्षा और बाहरी मूल—दोनों भावों को सहज हिन्दी में रखता है।
- source_word: יָתוֹם
  choice: अनाथ
  rationale: यहाँ शब्द विशेषतः पिता-विहीन और इसलिए सामाजिक रूप से असुरक्षित व्यक्ति को सूचित करता है; ‘अनाथ’ सामान्य हिन्दी में सबसे सुबोध पद है।
- source_word: אַלְמָנָה
  choice: विधवा
  rationale: इब्रानी का एकवचन प्रतिनिधिक या सामूहिक है; हिन्दी में ‘अनाथ और विधवा’ काव्यात्मक समानता और असुरक्षित वर्ग का भाव बनाए रखता है।
- source_word: יְעוֹדֵד
  choice: सहारा देता है
  rationale: क्रिया निर्बल व्यक्ति को थामने, संभालने या दृढ़ करने का भाव देती है; यह पद वर्तमान हिन्दी में स्वाभाविक है।
- source_word: דֶרֶךְ
  choice: मार्ग
  rationale: काव्य और ज्ञान-साहित्य में यह जीवन की दिशा, आचरण या जीवन-क्रम का रूपक हो सकता है; ‘मार्ग’ उस व्यापकता को बनाए रखता है।
- source_word: רְשָׁעִים
  choice: दुष्टों
  rationale: यह विशेषण संज्ञा के रूप में नैतिक वर्ग को सामूहिक रूप से दर्शाता है; ‘दुष्टों’ उसका संक्षिप्त और मानक हिन्दी रूप है।
- source_word: יְעַוֵּת
  choice: टेढ़ा कर देता है
  rationale: पिएल रूप मोड़ने, विकृत करने या टेढ़ा बनाने का मूल रूपक रखता है; इसे केवल ‘नष्ट करता है’ कहकर परिणाम में सीमित नहीं किया गया।
theological_decisions:
- issue: अन्तिम उपवाक्य में ईश्वरीय न्याय का चित्रण
  choice: दुष्टों का मार्ग टेढ़ा कर देता है
  alternative: दुष्टों के मार्ग को विनाश की ओर ले जाता है
  rationale: इब्रानी क्रिया का मूल चित्र मोड़ने या टेढ़ा करने का है। अनुवाद यह अस्पष्टता खुली रखता है कि इसका आशय उनके प्रयत्नों को विफल करना, उनके जीवन-क्रम को उलट देना, अथवा उसे विनाश तक पहुँचाना है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सुबोध रखी गई है। वाक्य की इब्रानी समानांतरता को अर्धविराम और विरोधसूचक ‘परन्तु’ से स्पष्ट किया गया है। ‘अनाथ’ सामान्य हिन्दी के कारण चुना गया है, यद्यपि मूल शब्द विशेष रूप से पिता-विहीन व्यक्ति को सूचित कर सकता है।
