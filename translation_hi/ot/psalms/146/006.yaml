translation:
  language: hi
  text: 'जिसने आकाश और पृथ्वी, समुद्र और उनमें जो कुछ है, सब बनाया,

    और जो सदा विश्वासयोग्य रहता है[a]।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जो सत्य को सदा बनाए रखता है।” इब्रानी शब्द का अर्थ “सत्य” या “विश्वासयोग्यता” दोनों हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: עֹשֶׂה
  choice: जिसने…बनाया
  rationale: कर्ता-वाचक कृदन्त यहाँ पिछले पद में उल्लिखित यहोवा का वर्णन करता है। सृष्टि के पूर्ण कार्य के लिए हिन्दी में भूतकाल स्वाभाविक है।
- source_word: שָׁמַיִם וָאָרֶץ
  choice: आकाश और पृथ्वी
  rationale: यह समस्त सृष्टि को सूचित करने वाला प्रचलित युग्म है और आधुनिक हिन्दी में सहज है।
- source_word: אֶת הַיָּם
  choice: समुद्र
  rationale: मूल में निश्चित एकवचन है; इसलिए ‘समुद्र’ रखा गया है।
- source_word: וְאֶת כָּל אֲשֶׁר בָּם
  choice: और उनमें जो कुछ है, सब
  rationale: यह आकाश, पृथ्वी और समुद्र में मौजूद सभी वस्तुओं और प्राणियों को सामूहिक रूप से समेटता है।
- source_word: הַשֹּׁמֵר
  choice: जो…रहता है
  rationale: अगला कर्तृवाचक कृदन्त परमेश्वर के स्थायी चरित्र का वर्णन जारी रखता है। אֱמֶת के साथ इसका स्वाभाविक हिन्दी रूप ‘विश्वासयोग्य रहता है’ है।
- source_word: אֱמֶת
  choice: विश्वासयोग्य
  rationale: इस प्रसंग में शब्द परमेश्वर की स्थायी विश्वसनीयता और निष्ठा को व्यक्त करता है। विशेषणात्मक हिन्दी रूप अर्थ को स्वाभाविक ढंग से पहुँचाता है; ‘सत्य’ की वैध सम्भावना पादटिप्पणी में रखी गई है।
- source_word: לְעוֹלָם
  choice: सदा
  rationale: यह निरन्तर और चिरस्थायी अवधि बताता है; ‘सदा’ संक्षिप्त, स्वाभाविक और काव्यात्मक हिन्दी है।
theological_decisions:
- issue: परमेश्वर के चरित्र के सम्बन्ध में אֱמֶת का अर्थ
  choice: विश्वासयोग्य
  alternative: सत्य
  rationale: यहाँ सृष्टिकर्ता परमेश्वर की अटल विश्वसनीयता प्रमुख है। फिर भी मूल शब्द ‘सत्य’ का अर्थ भी दे सकता है, इसलिए उस सम्भावना को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। पद पिछले पद से जुड़े सम्बन्धवाचक वर्णन के रूप में प्रस्तुत है; पंक्ति-विभाजन इब्रानी के दो समानान्तर कर्तृवाचक वर्णनों को स्पष्ट करता है।
