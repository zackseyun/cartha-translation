  text: Do not trust in princes[a], in a son of man[b], in whom there is no salvation.
translation:
  language: hi
  text: 'प्रधानों पर भरोसा मत रखो,

    न किसी मनुष्य[a] पर,

    जिससे उद्धार[b] नहीं मिलता।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, ‘मनुष्य का पुत्र’; इब्रानी मुहावरे में किसी नश्वर मनुष्य के लिए, यहाँ कोई मसीही उपाधि नहीं।
    reason: इब्रानी मुहावरे के शाब्दिक रूप और उसके प्रसंगानुसार सामान्य अर्थ को स्पष्ट करना।
  - marker: b
    text: या ‘छुटकारा’ अथवा ‘बचाव’।
    reason: תְשׁוּעָה के निकट अर्थ-विकल्पों को सुरक्षित रखना।
lexical_decisions:
- source_word: אַל תִּבְטְחוּ
  choice: भरोसा मत रखो
  rationale: निषेधवाचक אַל और בטח के अर्थ को आधुनिक, स्वाभाविक हिन्दी में सीधे निषेध के रूप में व्यक्त करता है।
- source_word: בִנְדִיבִים
  choice: प्रधानों
  rationale: נְדִיבִים यहाँ समाज के उच्च, प्रभावशाली या शासक वर्ग के लोगों को सूचित करता है। ‘प्रधानों’ इस दायरे को रखता है और ‘राजकुमारों’ की अपेक्षा केवल राजा के पुत्रों तक अर्थ को सीमित नहीं करता।
- source_word: בְּבֶן אָדָם
  choice: मनुष्य के पुत्र
  rationale: इब्रानी पदबंध का रूप सुरक्षित रखा गया है। इस प्रसंग में यह किसी नश्वर मनुष्य के लिए सामान्य मुहावरा है, मसीही उपाधि नहीं।
- source_word: שֶׁאֵין לוֹ
  choice: जिसके पास ... नहीं है
  rationale: सम्बन्धवाचक रचना और अस्तित्व के निषेध को स्वाभाविक हिन्दी में व्यक्त करता है, बिना इसे केवल ‘जो बचा नहीं सकता’ के अर्थ तक सीमित किए।
- source_word: תְשׁוּעָה
  choice: उद्धार
  rationale: शब्द बचाव, छुटकारे या उद्धार को व्यक्त कर सकता है। ‘उद्धार’ परमेश्वर और नश्वर मनुष्य के बीच भजन में किए गए व्यापक विरोध को बनाए रखता है।
theological_decisions:
- issue: ‘मनुष्य के पुत्र’ का अभिप्राय
  choice: एक सामान्य नश्वर मनुष्य
  alternative: मसीही उपाधि अथवा केवल किसी पुरुष की जैविक संतान
  rationale: भजन का प्रसंग शक्तिशाली मनुष्यों पर भरोसा रखने के विरुद्ध चेतावनी देता है और उन्हें परमेश्वर के सामने नश्वर ठहराता है; यहाँ यह पदबंध दानिय्येल-संबंधी या मसीही उपाधि नहीं है।
- issue: תְשׁוּעָה का अर्थ-क्षेत्र
  choice: उद्धार
  alternative: छुटकारा; बचाव; सहायता
  rationale: मुख्य पाठ में व्यापक धार्मिक और व्यावहारिक अर्थ बनाए रखा गया है; पादटिप्पणी निकट lexical विकल्प बताती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। काव्यात्मक पंक्ति-विन्यास इब्रानी समानांतरता को दिखाता है। ‘मनुष्य के पुत्र’ की औपचारिक अभिव्यक्ति जानबूझकर रखी गई है और संभावित गलत मसीही अर्थ को पादटिप्पणी में रोका गया है।
