  language: hi
  text: मैं जीवन भर याहवे की स्तुति करूँगा[a]; जब तक मैं जीवित रहूँ, मैं अपने परमेश्वर का स्तुतिगान करूँगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में इन पदबंधों का अधिक शाब्दिक अर्थ क्रमशः ‘मेरे जीवन में’ और ‘मेरे अभी बने रहने/जीवित रहने में’ है; यहाँ दोनों जीवनकाल की अवधि व्यक्त करते हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲהַלְלָה
  choice: मैं स्तुति करूँगा
  rationale: प्रथम पुरुष एकवचन का यह रूप संकल्प या इच्छापूर्ण भविष्य का भाव देता है; हिन्दी में ‘मैं स्तुति करूँगा’ इस दृढ़ निश्चय को स्वाभाविक रूप से व्यक्त करता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: मूल पाठ में परमेश्वर का विशिष्ट नाम है; उसे उपाधि से बदलने के बजाय हिन्दी में निकट ध्वन्यात्मक रूप ‘याहवे’ रखा गया है।
- source_word: בְּחַיָּי
  choice: जीवन भर
  rationale: शाब्दिक अर्थ ‘मेरे जीवन में’ है, पर यहाँ यह पूरे जीवनकाल की अवधि बताता है; ‘जीवन भर’ सहज और सटीक है।
- source_word: אֲזַמְּרָה
  choice: मैं ... स्तुतिगान करूँगा
  rationale: זמר में संगीत के साथ प्रशंसा करने का भाव है; ‘स्तुतिगान’ गायन और आराधनापूर्ण प्रशंसा दोनों को व्यक्त करता है।
- source_word: לֵאלֹהַי
  choice: अपने परमेश्वर का
  rationale: हिन्दी में ‘परमेश्वर का स्तुतिगान करना’ स्वाभाविक प्रयोग है और मूल के लक्ष्य-संबंध को स्पष्ट रखता है।
- source_word: בְּעוֹדִי
  choice: जब तक मेरा अस्तित्व है
  rationale: यह पदबंध वक्ता के बने रहने या जीवित अस्तित्व की अवधि बताता है। यह अनुवाद पहले चरण से समानता बनाए रखते हुए मूल के ‘अस्तित्व/निरंतर बने रहने’ वाले व्यापक शब्दार्थ को भी सुरक्षित रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: पद में विशिष्ट ईश्वरीय नाम सीधे आया है। ‘याहवे’ उसे किसी उपाधि से बदले बिना प्रस्तुत करता है और प्रचलित विद्वत्तापूर्ण उच्चारण के निकट है।
