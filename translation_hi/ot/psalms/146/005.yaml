  text: Blessed is the one whose help is the God of Jacob[a], whose hope is in Yahweh his God.
translation:
  language: hi
  text: धन्य है वह, जिसकी सहायता याकूब का परमेश्वर है[a], जिसकी आशा अपने परमेश्वर यहवे पर है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जिसका सहायक याकूब का परमेश्वर है।”
    reason: lexical_alternative
lexical_decisions:
- source_word: אַשְׁרֵי
  choice: धन्य है
  rationale: यह इब्रानी धन्यता-वचन का रूप है, जो केवल भावनात्मक प्रसन्नता नहीं बल्कि आशीषपूर्ण और वांछनीय दशा व्यक्त करता है।
- source_word: שֶׁאֵל יַעֲקֹב בְּעֶזְרוֹ
  choice: जिसकी सहायता याकूब का परमेश्वर है
  rationale: यह स्वाभाविक हिन्दी में उस संबंध को व्यक्त करता है जिसमें याकूब का परमेश्वर उस व्यक्ति की सहायता है; साथ ही वाचा-ऐतिहासिक उपाधि सुरक्षित रहती है।
- source_word: שִׂבְרוֹ
  choice: जिसकी आशा
  rationale: संज्ञा अपेक्षा और भरोसे से जुड़ी आशा व्यक्त करती है; इस प्रसंग में ‘आशा’ सबसे सहज और उपयुक्त है।
- source_word: עַל
  choice: पर है
  rationale: यह उस आधार या व्यक्ति को दर्शाता है जिस पर आशा टिकी है; हिन्दी में ‘पर आशा होना’ निर्भरता का भाव स्वाभाविक रूप से रखता है।
- source_word: יְהוָה
  choice: यहवे
  rationale: चतुरक्षरीय दिव्य नाम को किसी उपाधि से बदलने के बजाय हिन्दी में उसके प्रचलित निकट लिप्यंतरण द्वारा रखा गया है।
- source_word: אֱלֹהָיו
  choice: अपने परमेश्वर
  rationale: एकवचन पुल्लिंग प्रत्यय धन्य व्यक्ति की ओर लौटता है। हिन्दी में कर्ता-संबंध स्पष्ट करने के लिए ‘अपने परमेश्वर’ अधिक स्वाभाविक है।
theological_decisions:
- issue: दिव्य नाम יְהוָה का अनुवाद
  choice: यहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में व्यक्तिगत दिव्य नाम सीधे आया है; इसलिए उसे उपाधि से बदलने के बजाय लिप्यंतरित किया गया है।
- issue: धन्यता-वचन का अंतर्निहित कर्ता
  choice: वह
  alternative: वह मनुष्य; वह व्यक्ति
  rationale: इब्रानी में कोई स्पष्ट संज्ञा नहीं है। ‘वह’ एकवचन संदर्भ को बनाए रखता है और मूल में अनुपस्थित अधिक विशिष्ट संज्ञा नहीं जोड़ता।
- issue: אֵל יַעֲקֹב और עֵזֶר के बीच संबंध
  choice: जिसकी सहायता याकूब का परमेश्वर है
  alternative: जिसका सहायक याकूब का परमेश्वर है
  rationale: इब्रानी संरचना परमेश्वर को उस व्यक्ति की ‘सहायता’ के रूप में प्रस्तुत करती है; मुख्य पाठ इस संज्ञात्मक रूपक को बनाए रखता है, जबकि वैकल्पिक अर्थ पादटिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण भजन-संग्रह संबंधी लहजा रखा गया है। ‘धन्य’ पारंपरिक होते हुए भी सामान्य पाठकों के लिए बोधगम्य है; वाक्य की समानांतर संरचना मूल इब्रानी काव्य के अनुरूप रखी गई है।
