source:
  edition: WLC
  text: יִמְלֹ֤ךְ יְהוָ֨ה לְ/עוֹלָ֗ם אֱלֹהַ֣יִ/ךְ צִ֭יּוֹן לְ/דֹ֥ר וָ/דֹ֗ר הַֽלְלוּ יָֽהּ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/146/010.yaml
  text: Yahweh will reign forever—your God[a], Zion, from generation to generation. Hallelujah!
translation:
  language: hi
  text: याहवे सदा राज्य करेगा—हे सिय्योन, तेरा परमेश्वर पीढ़ी-दर-पीढ़ी राज्य करेगा। हल्लेलूयाह![a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इब्रानी: “याह की स्तुति करो!” यहाँ इस अभिव्यक्ति को “हल्लेलूयाह” के रूप में लिप्यंतरित किया गया है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִמְלֹךְ
  choice: राज्य करेगा
  rationale: מלך का कालरहित/भविष्याभिमुख अपूर्ण रूप यहाँ स्तुतिपरक घोषणा में याहवे के निरंतर और भावी राजत्व को व्यक्त करता है; ‘राज्य करेगा’ आधुनिक हिन्दी में इसके क्रियात्मक बल को स्वाभाविक रूप से रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: चतुरक्षरीय व्यक्तिगत नाम יְהוָה का हिन्दी लिप्यंतरण किया गया है; इसे किसी उपाधि से नहीं बदला गया।
- source_word: לְעוֹלָם
  choice: सदा
  rationale: इस स्तुति-संदर्भ में यह अबाध, स्थायी अवधि बताता है। ‘सदा’ संक्षिप्त, स्वाभाविक और काव्यात्मक हिन्दी है।
- source_word: אֱלֹהַיִךְ
  choice: तेरा परमेश्वर
  rationale: द्वितीय पुरुष स्त्रीलिंग एकवचन प्रत्यय सिय्योन को मानवीकृत स्त्री के रूप में संबोधित करता है; इसलिए ‘तेरा’ रखा गया है।
- source_word: צִיּוֹן
  choice: हे सिय्योन
  rationale: नाम का हिन्दी लिप्यंतरण ‘सिय्योन’ है और सम्बोधन-भाव को स्पष्ट तथा स्वाभाविक बनाने के लिए ‘हे’ जोड़ा गया है।
- source_word: לְדֹר וָדֹר
  choice: पीढ़ी-दर-पीढ़ी
  rationale: यह इब्रानी मुहावरा लगातार आने वाली पीढ़ियों के दौरान स्थायित्व व्यक्त करता है; हिन्दी मुहावरा उसकी पुनरावृत्त संरचना और अर्थ दोनों को बनाए रखता है।
- source_word: הַלְלוּ יָהּ
  choice: हल्लेलूयाह
  rationale: प्रचलित स्तुतिपरक उद्गार को हिन्दी लिपि में लिप्यंतरित किया गया है; उसके शाब्दिक अर्थ ‘याह की स्तुति करो’ को पादटिप्पणी में स्पष्ट किया गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: प्रभु / यहोवा
  rationale: मूल पाठ व्यक्तिगत ईश्वरीय नाम का सीधे प्रयोग करता है। ‘याहवे’ उसका लिप्यंतरण करके नाम और उपाधि के भेद को सुरक्षित रखता है।
- issue: הַלְלוּ יָהּ का रूप
  choice: हल्लेलूयाह
  alternative: याह की स्तुति करो
  rationale: लिप्यंतरित रूप हिन्दी मसीही स्तुति-प्रयोग में पहचाना जाता है, जबकि पादटिप्पणी उसके आज्ञार्थक अर्थ और संक्षिप्त ईश्वरीय नाम ‘याह’ को पारदर्शी बनाती है।
- issue: अपूर्ण क्रिया יִמְלֹךְ का कालगत बल
  choice: राज्य करेगा
  alternative: राज्य करता है
  rationale: यह रूप भविष्याभिमुख घोषणा और निरंतर राजत्व दोनों की अनुमति देता है। प्रसंग में ‘राज्य करेगा’ चुना गया है, जबकि ‘सदा’ और ‘पीढ़ी-दर-पीढ़ी’ उसके चिरस्थायी स्वरूप को बनाए रखते हैं।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और भजनात्मक रखी गई है। मूल की काव्यात्मक लोप-रचना को बनाए रखते हुए दूसरे खंड में ‘राज्य करेगा’ दोहराया नहीं गया; डैश और सम्बोधन अर्थ-संबंध स्पष्ट करते हैं। पादटिप्पणी-चिह्न उसी पद के बाद रखा गया है जिसकी वह व्याख्या करता है।
