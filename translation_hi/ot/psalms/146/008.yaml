  yaml_path: translation/ot/psalms/146/008.yaml
  text: Yahweh opens the eyes of the blind[a]; Yahweh raises up those who are bowed down; Yahweh loves the righteous.
translation:
  language: hi
  text: याहवे अंधों की आँखें खोलता है[a]; याहवे झुके हुओं को उठाता है; याहवे धर्मियों से प्रेम करता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘अंधों को दृष्टि देता है।’ इब्रानी में शाब्दिक रूप से ‘अंधों को खोलता है’ है, अर्थात उनकी आँखें खोलता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय देवनागरी में उसके प्रचलित निकट लिप्यंतरण से व्यक्त किया गया है।
- source_word: פֹּקֵחַ
  choice: आँखें खोलता है
  rationale: इब्रानी क्रिया का मूल अर्थ ‘खोलना’ है; ‘अंधों’ के साथ आँखें आशयतः निहित हैं। यह रूप मूल बिंब को रखते हुए हिन्दी में स्वाभाविक है।
- source_word: עִוְרִים
  choice: अंधों
  rationale: बहुवचन विशेषण यहाँ संज्ञा के रूप में प्रयुक्त है और सामान्यतः अंधे लोगों को दर्शाता है।
- source_word: זֹקֵף
  choice: उठाता है
  rationale: क्रिया झुकी हुई दशा से सीधा करने या ऊपर उठाने का भाव देती है; ‘उठाता है’ शारीरिक बिंब और व्यापक पुनर्स्थापन—दोनों के लिए खुला रहता है।
- source_word: כְּפוּפִים
  choice: झुके हुओं
  rationale: यह पद दबे, झुके या कष्ट से नत लोगों का बिंब देता है। इस अनुवाद में शारीरिक और रूपकात्मक दोनों अर्थ सुरक्षित रहते हैं।
- source_word: אֹהֵב
  choice: प्रेम करता है
  rationale: वर्तमानकालिक सहभागी क्रिया परमेश्वर की निरंतर प्रवृत्ति बताती है; हिन्दी में यह सीधा और स्वाभाविक रूप है।
- source_word: צַדִּיקִים
  choice: धर्मियों
  rationale: संज्ञा के रूप में प्रयुक्त बहुवचन विशेषण उन लोगों को दर्शाता है जो धर्मी हैं; ‘धर्मी’ हिन्दी बाइबलीय प्रयोग में स्पष्ट और स्थापित है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में व्यक्तिगत वाचा-नाम है। ‘याहवे’ उसे उपाधि से प्रतिस्थापित किए बिना सुरक्षित रखता है।
- issue: כְּפוּפִים के कष्ट-संबंधी बिंब का दायरा
  choice: झुके हुओं
  alternative: दबे हुओं; कमर झुके हुओं
  rationale: मूल पद शारीरिक रूप से झुके होने और दुःख या दमन से नत होने के बीच अर्थगत खुलापन रखता है; चुना हुआ रूप इस तनाव को अनावश्यक रूप से हल नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और काव्यात्मक रूप अपनाया गया है। तीनों समांतर खंडों में ‘याहवे’ की पुनरावृत्ति मूल पद की लय और बल को सुरक्षित रखती है।
