source:
  edition: WLC
  text: תֵּצֵ֣א ר֭וּח/וֹ יָשֻׁ֣ב לְ/אַדְמָת֑/וֹ בַּ/יּ֥וֹם הַ֝/ה֗וּא אָבְד֥וּ עֶשְׁתֹּנֹתָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/146/004.yaml
  text: His breath goes out[a]; he returns to his ground; on that very day his plans perish.
translation:
  language: hi
  text: उसकी साँस निकल जाती है[a]; वह अपनी मिट्टी में लौट जाता है; उसी दिन उसकी योजनाएँ मिट जाती हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘उसकी आत्मा निकल जाती है।’ इब्रानी רוּחַ का अर्थ ‘साँस’ या ‘आत्मा’ हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: תֵּצֵא
  choice: निकल जाती है
  rationale: יצא के ठोस बिंब, अर्थात मृत्यु के समय जीवन-श्वास के निकल जाने, को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: רוּחוֹ
  choice: उसकी साँस
  rationale: मृत्यु और मिट्टी में लौटने के इस संदर्भ में רוּחַ जीवनदायी श्वास का संकेत दे सकता है। ‘आत्मा’ भी संभव है, इसलिए उसे पादटिप्पणी में रखा गया है ताकि अर्थ को अनावश्यक रूप से निश्चित न किया जाए।
- source_word: יָשֻׁב
  choice: वह ... लौट जाता है
  rationale: שוב का मूल अर्थ ‘लौटना’ है। यहाँ स्वाभाविक विषय फिर मनुष्य है, जो अपनी मिट्टी में लौटता है।
- source_word: לְאַדְמָתוֹ
  choice: अपनी मिट्टी में
  rationale: אֲדָמָה भूमि, मिट्टी या धरती है और प्रत्यय स्वामित्व दर्शाता है। ‘अपनी मिट्टी’ हिन्दी में स्वाभाविक है और मूल के प्रत्यय को बनाए रखता है; ‘धूल’ इस पद में प्रयुक्त शब्द नहीं है।
- source_word: בַּיּוֹם הַהוּא
  choice: उसी दिन
  rationale: हिब्रू पदबंध की तात्कालिकता और संकेतात्मक बल को संक्षिप्त, स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: אָבְדוּ
  choice: मिट जाती हैं
  rationale: אבד यहाँ योजनाओं के समाप्त या निष्फल हो जाने को दर्शाता है। ‘मिट जाती हैं’ मृत्यु के साथ उनके अंत को सहज और गंभीर ढंग से व्यक्त करता है।
- source_word: עֶשְׁתֹּנֹתָיו
  choice: उसकी योजनाएँ
  rationale: यह दुर्लभ संज्ञा विचारों, अभिप्रायों या योजनाओं को सूचित करती है। संदर्भ में ‘योजनाएँ’ मनुष्य के उद्देश्यों के मृत्यु पर समाप्त होने का आशय सबसे स्पष्ट रूप से देता है।
theological_decisions:
- issue: मृत्यु के संदर्भ में רוּחוֹ का मानव-स्वरूप संबंधी अर्थ
  choice: मुख्य पाठ में ‘उसकी साँस’
  alternative: ‘उसकी आत्मा’
  rationale: ‘साँस’ मृत्यु के ठोस बिंब को सामने रखती है और मृत्यु के बाद की अवस्था पर पद से अधिक विशिष्ट धर्मवैज्ञानिक निष्कर्ष नहीं थोपती। चूँकि רוּחַ का अर्थ ‘आत्मा’ भी हो सकता है, उस संभावना को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण काव्यात्मक गद्य। अर्धविराम मूल पद की क्रमिक समांतर संरचना को बनाए रखते हैं। ‘अपनी मिट्टी’ मूल के स्वामित्व-सूचक प्रत्यय को दर्शाता है और अनावश्यक रूप से ‘धूल’ नहीं जोड़ता।
