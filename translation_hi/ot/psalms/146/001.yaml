  text: Praise Yah! Praise Yahweh[a], my soul!
translation:
  language: hi
  text: याह की स्तुति करो! हे मेरी आत्मा, याहवे की स्तुति कर!
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַֽלְלוּ
  choice: स्तुति करो
  rationale: הלל का बहुवचन आज्ञार्थक रूप सामूहिक आह्वान है। हिंदी में ‘स्तुति करो’ स्वाभाविक रूप से आज्ञा व्यक्त करता है; वचन का भेद क्रिया में स्पष्ट नहीं होता।
- source_word: יָהּ
  choice: याह
  rationale: यह परमेश्वर के नाम का संक्षिप्त काव्यात्मक रूप है। इसे ‘हालेलूयाह’ में समाहित न करके अलग रखा गया है, क्योंकि इब्रानी पाठ में यह पृथक शब्द है।
- source_word: הַלְלִי
  choice: स्तुति कर
  rationale: यह स्त्रीलिंग एकवचन आज्ञार्थक रूप है, जो ‘मेरे प्राण’ को सीधे संबोधित करता है। हिंदी का एकवचन ‘कर’ इस आत्म-संबोधन को बनाए रखता है।
- source_word: נַפְשִׁי
  choice: हे मेरे प्राण
  rationale: נפש का अर्थ प्राण, जीवन या स्वयं हो सकता है। भजन के आत्म-संबोधन में ‘हे मेरे प्राण’ स्वाभाविक, गरिमापूर्ण और अर्थ-संगत है।
- source_word: אֶת
  choice: अलग से अनूदित नहीं
  rationale: यह निश्चित कर्म का सूचक है और हिंदी में इसका स्वतंत्र शाब्दिक समकक्ष आवश्यक नहीं है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: चार-अक्षरीय दिव्य नाम को उपाधि ‘प्रभु’ से बदलने के बजाय हिंदी में प्रचलित नाम-रूप ‘यहोवा’ से व्यक्त किया गया है।
theological_decisions:
- issue: एक ही पद में יָהּ और יְהוָה का अनुवाद
  choice: יָהּ को ‘याह’ और יְהוָה को ‘यहोवा’
  alternative: पहले वाक्य में ‘हालेलूयाह’ और दूसरे में ‘प्रभु’; अथवा दोनों को ‘प्रभु’
  rationale: मूल पाठ दिव्य नाम के संक्षिप्त और पूर्ण रूपों में भेद करता है। हिंदी में ‘याह’ और ‘यहोवा’ इस भेद तथा व्यक्तिगत नाम की प्रकृति को स्पष्ट रखते हैं।
translation_notes:
  register: आधुनिक मानक हिंदी में संक्षिप्त, काव्यात्मक और गरिमापूर्ण शैली। पहले वाक्य का सामूहिक आह्वान और दूसरे का एकवचन आत्म-संबोधन ‘करो/कर’ के भेद से सुरक्षित रखा गया है।
