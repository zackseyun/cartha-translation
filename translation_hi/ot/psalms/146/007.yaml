  text: who executes justice for the oppressed[a], who gives bread to the hungry[b]. Yahweh frees the prisoners.
translation:
  language: hi
  text: 'जो उत्पीड़ितों को न्याय दिलाता है,[a]

    जो भूखों को रोटी देता है।

    याहवे बंदियों को छुड़ाता है।[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उत्पीड़ितों के लिए न्याय-निर्णय करता है।”
    reason: lexical_alternative
  - marker: b
    text: या, “बंधे हुओं को खोल देता है।”
    reason: lexical_alternative
lexical_decisions:
- source_word: עֹשֶׂה מִשְׁפָּט
  choice: न्याय दिलाता है
  rationale: यह पदबंध किसी के पक्ष में न्याय करने और उसके साथ हुए अन्याय को ठीक करने का भाव रखता है। आधुनिक हिन्दी में ‘न्याय दिलाता है’ इस सक्रिय अर्थ को स्वाभाविक रूप से व्यक्त करता है।
- source_word: לָעֲשׁוּקִים
  choice: उत्पीड़ितों को
  rationale: यह निष्क्रिय कृदन्त उन लोगों को दर्शाता है जिन्हें दबाया या सताया गया है। ‘उत्पीड़ितों’ में इसका सामाजिक और नैतिक बल बना रहता है।
- source_word: נֹתֵן לֶחֶם
  choice: रोटी देता है
  rationale: ‘रोटी’ לֶחֶם का सीधा और साधारण हिन्दी समतुल्य है; इसे अधिक सामान्य ‘भोजन’ बनाना आवश्यक नहीं है।
- source_word: לָרְעֵבִים
  choice: भूखों को
  rationale: मूल विशेषण संज्ञा के रूप में भूखे लोगों को दर्शाता है। ‘भूखों को’ संक्षिप्त और स्वाभाविक हिन्दी है।
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत नाम चतुरक्षरीय יהוה को किसी उपाधि से बदलने के बजाय हिन्दी में ‘याहवे’ के रूप में लिप्यंतरित किया गया है।
- source_word: מַתִּיר אֲסוּרִים
  choice: बंदियों को छुड़ाता है
  rationale: מַתִּיר का मूल भाव खोलने या बन्धन से मुक्त करने का है, और אֲסוּרִים बंधे हुए लोगों को दर्शाता है। ‘बंदियों को छुड़ाता है’ आधुनिक हिन्दी में परिणाम को स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में इस्राएल के परमेश्वर का व्यक्तिगत नाम है। लिप्यंतरण नाम और उपाधि के बीच का भेद सुरक्षित रखता है।
- issue: אֲסוּרִים का आशय
  choice: बंदी
  alternative: बंधे हुए लोग
  rationale: सन्दर्भ में ‘बंदी’ सहज अर्थ देता है, पर मूल इब्रानी का बिम्ब केवल औपचारिक कारावास तक सीमित नहीं है; इसलिए व्यापक शाब्दिक विकल्प पादटिप्पणी में रखा गया है।
translation_notes:
  register: भाषा आधुनिक, सरल और गरिमापूर्ण रखी गई है। समानान्तर काव्य-पंक्तियाँ सुरक्षित हैं। ‘न्याय दिलाता है’ मुहावरेदार हिन्दी है, जबकि पादटिप्पणी अधिक रूपगत विकल्प देती है। अंग्रेज़ी परामर्श-पाठ में [b] का चिह्न ‘भूखों’ वाले वाक्य के बाद था, पर उसकी पादटिप्पणी מַתִּיר אֲסוּרִים से सम्बन्धित है; इसलिए हिन्दी मुख्य पाठ में उसे ‘बंदियों को छुड़ाता है’ के बाद रखा गया है।
