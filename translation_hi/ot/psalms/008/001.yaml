base_translation:
  language: en
  yaml_path: translation/ot/psalms/008/001.yaml
  text: O Yahweh[a], our Lord[c][b], how majestic is your name in all the earth—you have set your splendor above the heavens.
translation:
  language: hi
  text: 'हे याहवे[a], हमारे प्रभु,


    आपका नाम सारी पृथ्वी पर कितना प्रतापी है!


    आपने अपना वैभव आकाश के ऊपर स्थापित किया है।[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इब्रानी: YHWH; परंपरागत हिन्दी रूप “यहोवा” है। अनेक अनुवादों में इस नाम के स्थान पर “प्रभु” मिलता है।'
    reason: alternative_reading
  - marker: b
    text: 'इब्रानी क्रिया-रूप को आज्ञार्थक भी समझा जा सकता है: “अपना वैभव आकाश के ऊपर स्थापित कर!”'
    reason: textual_or_grammatical_ambiguity
lexical_decisions:
- source_word: יְהוָה
  choice: यहवे
  rationale: परमेश्वर के विशिष्ट वाचा-नाम YHWH को उपाधि से बदलने के बजाय हिन्दी में लिप्यंतरित किया गया है।
- source_word: אֲדֹנֵינוּ
  choice: हमारे प्रभु
  rationale: אֲדוֹן के प्रथम पुरुष बहुवचन प्रत्यय सहित संबोधन को स्वाभाविक और गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: מָה אַדִּיר
  choice: कितना प्रतापी
  rationale: מָה यहाँ विस्मयबोधक है और אַדִּיר सामर्थ्य, श्रेष्ठता तथा महिमा का भाव रखता है; ‘कितना प्रतापी’ काव्यात्मक प्रशंसा को बनाए रखता है।
- source_word: שִׁמְךָ
  choice: आपका नाम
  rationale: इब्रानी मुहावरे को ज्यों का त्यों रखते हुए परमेश्वर की प्रकट पहचान और ख्याति के व्यापक संकेत को खुला छोड़ा गया है।
- source_word: בְּכָל הָאָרֶץ
  choice: सारी पृथ्वी पर
  rationale: आकाश के साथ विश्वव्यापी समानांतरता के कारण הָאָרֶץ को किसी सीमित ‘देश’ के बजाय ‘पृथ्वी’ समझा गया है।
- source_word: הוֹדְךָ
  choice: अपना वैभव
  rationale: הוֹד के महिमा, गरिमा और दीप्तिमान भव्यता के भाव को ‘वैभव’ स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: עַל הַשָּׁמָיִם
  choice: आकाश से भी ऊपर
  rationale: עַל को यहाँ ऊँचाई और अतिक्रमण के अर्थ में लिया गया है; हिन्दी में एकवचन ‘आकाश’ सामूहिक अर्थ में स्वाभाविक है।
- source_word: תְּנָה
  choice: स्थापित किया है
  rationale: संदर्भानुसार इसे परमेश्वर के वैभव के स्थापित होने का पूर्ण कथन माना गया है, जबकि इब्रानी रूप की आज्ञार्थक संभावना को पादटिप्पणी में सुरक्षित रखा गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में विशिष्ट ईश्वरीय नाम सीधे प्रयुक्त है; लिप्यंतरण उस नाम को ‘प्रभु’ उपाधि से अलग बनाए रखता है, जबकि वैकल्पिक परंपरागत रूप पादटिप्पणी में दिया गया है।
- issue: תְּנָה का कथनात्मक या आज्ञार्थक अर्थ
  choice: पूर्ण कथन—‘आपने ... स्थापित किया है’
  alternative: विनती/आज्ञा—‘अपना वैभव ... स्थापित कर’
  rationale: कविता के प्रशंसात्मक प्रवाह में कथनात्मक अर्थ सुगम है, पर व्यंजनयुक्त इब्रानी रूप आज्ञार्थक विश्लेषण की वास्तविक संभावना रखता है; इसलिए उसे दबाया नहीं गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में आदरसूचक ‘आप’ का प्रयोग किया गया है। पंक्ति-विन्यास इब्रानी काव्य की संबोधन, विस्मय और वैभव-वर्णन की गति को स्पष्ट करता है। भाषा सरल किंतु उपासना-संगत और गरिमापूर्ण रखी गई है।
