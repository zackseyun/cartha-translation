base_translation:
  language: en
  yaml_path: translation/ot/psalms/008/009.yaml
  text: O Yahweh[a], our Lord[b], how majestic is your name in all the earth!
translation:
  language: hi
  text: हे याहवे[a], हमारे प्रभु, सारी पृथ्वी में आपका नाम कितना प्रतापी[b] है!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इब्रानी: “YHWH”; परंपरागत अनुवादों में प्रायः “यहोवा” या “प्रभु”।'
    reason: alternative_reading
  - marker: b
    text: “प्रतापी” का अनुवाद “महिमामय,” “महान” या “वैभवशाली” भी किया जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: यहवे
  rationale: इब्रानी चतुरक्षरीय दिव्य नाम को उपाधि से अलग रखते हुए प्रचलित विद्वत् लिप्यंतरण के निकट देवनागरी में प्रस्तुत किया गया है।
- source_word: אֲדֹנֵינוּ
  choice: हमारे प्रभु
  rationale: यह संबोधन परमेश्वर की प्रभुता और अधिकार व्यक्त करता है; आधुनिक हिन्दी में “हमारे प्रभु” स्वाभाविक और गरिमापूर्ण है।
- source_word: מָה
  choice: कितना
  rationale: विशेषण के साथ यह विस्मय और प्रशंसा प्रकट करता है; हिन्दी में “कितना प्रतापी” स्वाभाविक विस्मयवाचक रचना है।
- source_word: אַדִּיר
  choice: प्रतापी
  rationale: यह शब्द महानता, वैभव और प्रभावशाली सामर्थ्य का भाव समेटता है; “प्रतापी” पद्यात्मक गरिमा बनाए रखते हुए सामान्य हिन्दी में बोधगम्य है।
- source_word: שִׁמְךָ
  choice: आपका नाम
  rationale: मूल की नाम-संबंधी अभिव्यक्ति को बिना विस्तारपूर्वक व्याख्यायित किए सीधे सुरक्षित रखा गया है।
- source_word: בְּכָל הָאָרֶץ
  choice: सारी पृथ्वी पर
  rationale: भजन के विश्वव्यापी संदर्भ में הָאָרֶץ पूरी पृथ्वी को दर्शाता है; हिन्दी में प्रतिष्ठा या महिमा के व्यापक प्रसार के लिए “पर” स्वाभाविक है।
theological_decisions:
- issue: יְהוָה אֲדֹנֵינוּ में दिव्य नाम और उपाधि का क्रम
  choice: हे यहवे, हमारे प्रभु
  alternative: हे प्रभु, हमारे स्वामी
  rationale: मूल पाठ पहले परमेश्वर का विशिष्ट नाम और फिर प्रभुता की उपाधि रखता है। अनुवाद दोनों को अलग और उसी क्रम में रखता है, किसी सांप्रदायिक व्याख्या को जोड़े बिना।
- issue: שֵׁם का आशय
  choice: नाम
  alternative: यश
  rationale: “नाम” मूल रूपक और उसकी अर्थ-व्यापकता—पहचान, प्रतिष्ठा और प्रकट चरित्र—को बनाए रखता है; केवल “यश” कहना अर्थ को संकुचित कर देता।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सहज और सीधा स्तुतिपरक संबोधन। आदरसूचक “आपका” सामान्य हिन्दी पाठक के लिए स्वाभाविक है; विस्मयवाचक बल मूल पद्य की प्रशंसा को व्यक्त करता है।
