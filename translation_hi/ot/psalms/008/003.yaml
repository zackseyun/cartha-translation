review_pass:
  verdict: revise
  source_fidelity: The draft correctly conveys the temporal force of כִּי, the act of looking, divine possession, the anthropomorphic image of God's fingers, and God's establishing of the celestial bodies. However, its punctuation and case marking make “तेरी उँगलियों का काम” and “चाँद और तारों को” syntactically unclear after “आकाश को.” The Hebrew presents these as a poetic sequence, with “the moon and stars” naturally understood as the established heavenly bodies.
  naturalness: “उनके स्थान पर स्थिर किया है” is understandable but more expansive than the source and less idiomatic here. “स्थापित किया है” is natural, dignified, and preserves the semantic range of כּוֹנָנְתָּה without adding a separate locative pronoun. Recasting the series with parallel object marking makes the Hindi readable while retaining the poetic accumulation.
  terminology: “तेरी उँगलियों” appropriately retains the source’s anthropomorphic poetic imagery. “आकाशों” reflects the Hebrew plural; it is acceptable in elevated biblical Hindi, while “चाँद और तारों” is natural modern usage. The intimate devotional second-person register is maintained consistently.
  issues:
  - severity: medium
    issue: Ambiguous syntactic relation among the heavens, the work of God's fingers, and the moon and stars
    rationale: The draft reads “तेरे आकाश को देखता हूँ—तेरी उँगलियों का काम, चाँद और तारों को,” where the latter phrases do not have parallel case marking and may be read as a broken apposition rather than the Hebrew poetic sequence.
  - severity: low
    issue: “उनके स्थान पर स्थिर किया है” adds wording and is somewhat cumbersome
    rationale: The Hebrew states that God established/set the moon and stars; it does not explicitly say “in their place.” “स्थापित किया है” communicates the source sense directly and naturally.
  revised_text: जब मैं तेरे आकाशों को, तेरी उँगलियों के काम को, चाँद और तारों को देखता हूँ, जिन्हें तूने स्थापित किया है—
