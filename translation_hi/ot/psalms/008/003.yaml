  text: כִּֽי אֶרְאֶ֣ה שָׁ֭מֶי/ךָ מַעֲשֵׂ֣י אֶצְבְּעֹתֶ֑י/ךָ יָרֵ֥חַ וְ֝/כוֹכָבִ֗ים אֲשֶׁ֣ר כּוֹנָֽנְתָּה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/008/003.yaml
  text: When I look at your heavens[a], the work of your fingers, the moon and the stars, which you have set in place—
translation:
  language: hi
  text: जब मैं तेरे आकाशों को, तेरी उँगलियों के काम को, चाँद और तारों को देखता हूँ, जिन्हें तूने स्थापित किया है—
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: जब
  rationale: यहाँ כִּי उस परिस्थिति को प्रस्तुत करता है जिससे अगले पद का मनन उत्पन्न होता है। इसलिए आधुनिक हिन्दी में ‘जब’ काव्य-प्रवाह और वाक्य-संबंध दोनों को स्वाभाविक रूप से व्यक्त करता है।
- source_word: אֶרְאֶה
  choice: मैं ... देखता हूँ
  rationale: ראה का अपूर्ण रूप यहाँ ध्यानपूर्वक देखने की क्रिया बताता है। ‘देखता हूँ’ सहज आधुनिक हिन्दी है और प्रसंग में केवल आकस्मिक दृष्टि नहीं, मननशील अवलोकन का भाव भी ग्रहण कर सकता है।
- source_word: שָׁמֶיךָ
  choice: तेरे आकाश
  rationale: हिब्रू का बहुवचन हिन्दी में सामान्यतः सामूहिक एकवचन ‘आकाश’ से स्वाभाविक रूप से व्यक्त होता है; द्वितीय पुरुष संबंध ‘तेरे’ स्पष्ट रखा गया है।
- source_word: מַעֲשֵׂי אֶצְבְּעֹתֶיךָ
  choice: तेरी उँगलियों का काम
  rationale: मूल की मानवरूपी काव्य-छवि को बनाए रखते हुए रचना को स्वाभाविक हिन्दी में रखा गया है। ‘काम’ यहाँ सामूहिक अर्थ में है।
- source_word: יָרֵחַ וְכוֹכָבִים
  choice: चाँद और तारों को
  rationale: हिन्दी में इन परिचित खगोलीय पिंडों के लिए ‘चाँद और तारे’ स्वाभाविक है; ‘को’ देखने की क्रिया से उनका संबंध स्पष्ट करता है।
- source_word: אֲשֶׁר כּוֹנָנְתָּה
  choice: जिन्हें तूने उनके स्थान पर स्थिर किया है
  rationale: כון का पोलल रूप स्थापित करने, दृढ़ करने या व्यवस्थित स्थान देने का अर्थ रखता है। यह अनुवाद खगोलीय पिंडों की नियुक्ति और स्थिरता दोनों को सुबोध हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: परमेश्वर की सृजन-क्रिया के लिए मानवरूपी भाषा
  choice: ‘तेरी उँगलियों’ की मूल छवि बनाए रखना
  alternative: ‘तेरी कारीगरी’ अथवा ‘जो तूने बनाया’
  rationale: हिब्रू की यह काव्य-छवि परमेश्वर की निकट और सहज सृजन-शक्ति को व्यक्त करती है। इसे बनाए रखने से मूल का काव्यात्मक बल सुरक्षित रहता है, बिना परमेश्वर के शारीरिक स्वरूप के विषय में कोई अतिरिक्त सिद्धांत जोड़े।
- issue: כון में व्यवस्था और स्थिरता का संबंध
  choice: ‘उनके स्थान पर स्थिर किया है’
  alternative: ‘स्थापित किया है’
  rationale: चयनित वाक्यांश आकाशीय पिंडों को व्यवस्थित रखने और दृढ़ करने के अर्थों को साथ रखता है; फिर भी इसे किसी विशिष्ट ब्रह्मांड-विज्ञान का तकनीकी कथन नहीं बनाया गया।
translation_notes:
  register: आधुनिक, dignified और काव्यात्मक हिन्दी; परमेश्वर को संबोधन में निकटता और भजन की परंपरागत गरिमा बनाए रखने के लिए ‘तू/तेरे/तेरी’ का प्रयोग। अंत का दीर्घ विराम अगले पद के प्रश्न से पद 3 के निकट संबंध को दर्शाता है।
