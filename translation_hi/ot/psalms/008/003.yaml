  to: जब मैं तेरे आकाशों को, तेरी उँगलियों के काम को, चाँद और तारों को देखता हूँ, जिन्हें तूने स्थापित किया है—
  rationale: The revision supplies parallel object marking for the Hebrew’s poetic sequence and uses “आकाशों” to retain the source plural. It retains the literal image of divine “fingers” and renders כּוֹנָנְתָּה with the concise, semantically adequate “स्थापित किया है.” No footnote is needed in Hindi, since the main rendering safely reflects the source without requiring an interpretive alternative.
