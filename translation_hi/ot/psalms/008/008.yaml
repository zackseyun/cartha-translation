translation:
  language: hi
  text: 'आकाश के पक्षी और समुद्र की मछलियाँ,

    और वह सब जो समुद्रों के मार्गों से गुजरता है।[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “समुद्रों के मार्गों से गुजरने वाली मछलियाँ।” इब्रानी में “गुजरता है” एकवचन है और इसका संबंध केवल मछलियों से भी माना जा सकता है, अथवा इसे समुद्री जीवों का व्यापक सामूहिक सारांश समझा जा सकता है।
    reason: syntactic_ambiguity
lexical_decisions:
- source_word: צִפּוֹר שָׁמַיִם
  choice: आकाश के पक्षी
  rationale: צִפּוֹר रूप की दृष्टि से एकवचन है, पर यहाँ जीवों की एक श्रेणी के लिए सामूहिक अर्थ में प्रयुक्त है; इसलिए हिन्दी में बहुवचन स्वाभाविक है। שָׁמַיִם के लिए प्रसंगानुकूल और सामान्य हिन्दी 'आकाश' चुना गया है।
- source_word: וּדְגֵי הַיָּם
  choice: और समुद्र की मछलियाँ
  rationale: यह संबंधवाचक पदबंध सीधे समुद्र की मछलियों को सूचित करता है; हिन्दी में श्रेणीसूचक बहुवचन स्वाभाविक है।
- source_word: עֹבֵר
  choice: और वह सब जो ... होकर चलता है
  rationale: एकवचन कृदंत व्यापक अथवा सामूहिक सारांश हो सकता है। 'वह सब जो' इस व्यापकता को व्यक्त करता है और इसे केवल पहले उल्लिखित मछलियों तक सीमित नहीं करता।
- source_word: אָרְחוֹת
  choice: मार्गों
  rationale: शब्द समुद्री पथों या रास्तों की काव्यात्मक छवि देता है; 'मार्गों' गरिमापूर्ण और सहज हिन्दी है।
- source_word: יַמִּים
  choice: समुद्रों
  rationale: मूल इब्रानी का बहुवचन सुरक्षित रखा गया है, जिससे काव्यात्मक विस्तार बना रहता है।
