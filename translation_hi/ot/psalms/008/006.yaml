source:
  edition: WLC
  text: תַּ֭מְשִׁילֵ/הוּ בְּ/מַעֲשֵׂ֣י יָדֶ֑י/ךָ כֹּ֝ל שַׁ֣תָּה תַֽחַת רַגְלָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/008/006.yaml
  text: You made him rule over the works of your hands[b][a]; you put everything under his feet.
translation:
  language: hi
  text: तूने उसे अपने हाथों के कामों पर शासन करने का अधिकार दिया[a]; तूने सब कुछ उसके पैरों के नीचे रख दिया[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तूने उसे अपने हाथों के कामों पर शासक बनाया।”
    reason: lexical_alternative
  - marker: b
    text: यहाँ “उसे” और “उसके” इब्रानी के पुल्लिंग एकवचन रूपों के अनुसार हैं; पिछले पद की तरह एक मनुष्य प्रतिनिधि रूप में पूरी मानवजाति को दर्शाता है।
    reason: cultural_note
lexical_decisions:
- source_word: תַּמְשִׁילֵהוּ
  choice: तूने उसे ... शासन करने का अधिकार दिया
  rationale: हिफ़ील रूप किसी को शासन करने या प्रभुता चलाने की स्थिति देने का भाव व्यक्त करता है। हिंदी में यह प्रयोग कारक अर्थ को स्वाभाविक और स्पष्ट रूप से प्रकट करता है।
- source_word: בְּמַעֲשֵׂי יָדֶיךָ
  choice: अपने हाथों के कामों पर
  rationale: यह शासन के क्षेत्र या विषय को दिखाता है और परमेश्वर के ‘हाथों’ के ठोस काव्यात्मक बिंब को बनाए रखता है।
- source_word: כֹּל
  choice: सब कुछ
  rationale: प्रसंग में यह सृष्टि की सभी अधीन की गई वस्तुओं को समग्र रूप से दर्शाता है; ‘सब कुछ’ सहज आधुनिक हिंदी है।
- source_word: שַׁתָּה
  choice: तूने ... रख दिया
  rationale: क्रिया का मूल अर्थ रखना या स्थापित करना है; ‘रख दिया’ पूर्ण किए गए कार्य को स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: תַחַת רַגְלָיו
  choice: उसके पैरों के नीचे
  rationale: यह शाब्दिक चित्र और अधीनता अथवा अधिकार के मुहावरेदार भाव—दोनों को सुरक्षित रखता है।
theological_decisions:
- issue: भजन 8 में मानवजाति के लिए प्रतिनिधिक पुल्लिंग एकवचन
  choice: ‘उसे’ और ‘उसके’ बनाए रखे गए
  alternative: ‘उन्हें’ और ‘उनके’ अथवा ‘मनुष्यों’
  rationale: इब्रानी में एकवचन पुल्लिंग रूप हैं, जो पिछले पद के प्रतिनिधिक ‘मनुष्य’ को आगे बढ़ाते हैं। पादटिप्पणी स्पष्ट करती है कि अभिप्राय केवल पुरुषों तक सीमित नहीं, बल्कि मानवजाति है।
- issue: शासन का कारक भाव
  choice: ‘शासन करने का अधिकार दिया’
  alternative: ‘शासक बनाया’ या ‘प्रभुता दी’
  rationale: यह מָשַׁל के हिफ़ील रूप में निहित नियुक्त करने/शासन कराने के भाव को व्यक्त करता है, जबकि ‘प्रभुता’ जैसे अपेक्षाकृत पारंपरिक शब्द पर निर्भर नहीं होता।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सहज हिंदी; परमेश्वर के लिए काव्यात्मक निकटता के अनुरूप एकवचन ‘तू’ रखा गया है। ‘हाथों के काम’ और ‘पैरों के नीचे’ जैसे मूल बिंब सुरक्षित रखे गए हैं।
