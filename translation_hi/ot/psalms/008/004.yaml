  yaml_path: translation/ot/psalms/008/004.yaml
  text: What is man that you remember him[c][b][a], and the son of man that you attend to him?
translation:
  language: hi
  text: 'मनुष्य[a] क्या है कि तू उसे स्मरण रखता है,

    और मनुष्य का पुत्र[b] क्या है कि तू उसकी सुधि लेता है?[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “मनुष्य” के लिए “मरणशील मनुष्य” भी; इब्रानी शब्द אֱנוֹשׁ प्रायः मनुष्य की दुर्बलता और मरणशीलता पर बल देता है।
    reason: lexical_alternative
  - marker: b
    text: यहाँ “मनुष्य का पुत्र” एक इब्रानी मुहावरा है, जिसका अर्थ मानव या मनुष्य जाति का एक सदस्य है। बाइबल के बाद के प्रयोगों में इस पदबंध का मसीहाई महत्त्व हो सकता है, पर इस भजन में यह मानवता के लिए काव्यात्मक समानांतर अभिव्यक्ति है।
    reason: cross_reference
  - marker: c
    text: “उसकी सुधि लेता है” के लिए “उसकी देखभाल करता है,” “उसके पास आता है,” या “उस पर ध्यान देता है” भी संभव है।
    reason: lexical_alternative
lexical_decisions:
- source_word: מָה
  choice: क्या है
  rationale: इब्रानी का क्रियारहित प्रश्न मनुष्य की तुच्छता और परमेश्वर के आश्चर्यजनक ध्यान को व्यक्त करता है; हिन्दी में “क्या है” स्वाभाविक है।
- source_word: אֱנוֹשׁ
  choice: मनुष्य
  rationale: यह प्रतिनिधि एकवचन को बनाए रखता है। शब्द में मानवीय दुर्बलता और मरणशीलता की छाया है, जिसे पादटिप्पणी में स्पष्ट किया गया है।
- source_word: תִזְכְּרֶנּוּ
  choice: तू उसे स्मरण रखता है
  rationale: זכר का मूल अर्थ स्मरण करना है; “स्मरण रखता है” यहाँ केवल याद आ जाने के बजाय निरंतर सचेत ध्यान का भाव स्वाभाविक हिन्दी में देता है।
- source_word: וּבֶן־אָדָם
  choice: और मनुष्य का पुत्र
  rationale: यह इब्रानी काव्यात्मक पदबंध और प्रतिनिधि एकवचन सुरक्षित रखता है तथा पहली पंक्ति के समानांतर चलता है; यहाँ इसका सामान्य मानवीय अर्थ पादटिप्पणी में बताया गया है।
- source_word: תִפְקְדֶנּוּ
  choice: तू उसकी सुधि लेता है
  rationale: פקד के व्यापक अर्थ-क्षेत्र—ध्यान देना, देखभाल करना, भेंट करना—को बिना आवश्यकता से किसी एक अर्थ तक सीमित किए “सुधि लेना” सक्रिय और हितकारी ध्यान व्यक्त करता है।
theological_decisions:
- issue: मानवजाति के लिए प्रतिनिधि पुल्लिंग एकवचन
  choice: “मनुष्य” और “मनुष्य का पुत्र” बनाए रखना
  alternative: “मानवजाति,” “मनुष्य लोग,” या “मरणशील प्राणी”
  rationale: मूल पाठ दोनों काव्य-पंक्तियों में प्रतिनिधि एकवचन रखता है। इसे बहुवचन या अमूर्त सामूहिक संज्ञा में बदलने से काव्यात्मक समानांतरता और आगे की शास्त्रीय प्रतिध्वनि घटेगी।
- issue: “मनुष्य का पुत्र” का मसीही अथवा सामान्य मानवीय अर्थ
  choice: मुख्य पाठ में पदबंध को सुरक्षित रखते हुए इस भजन में उसका सामान्य मानवीय अर्थ समझना
  alternative: इसे विशेष उपाधि के रूप में चिह्नित करना या सीधे “मानव” कहना
  rationale: इस निकट संदर्भ में पदबंध אֱנוֹשׁ के समानांतर समस्त मानवता के प्रतिनिधि के लिए है। बाद का मसीही प्रयोग महत्त्वपूर्ण है, पर उसे इस पद के मुख्य पाठ में स्पष्ट उपाधि बनाना मूल संदर्भ से अधिक निश्चितता जोड़ देगा।
- issue: परमेश्वर को संबोधित करने का सर्वनाम
  choice: “तू”
  alternative: “आप” या “तुम”
  rationale: इब्रानी में एकवचन सीधा संबोधन है। आधुनिक हिन्दी के प्रार्थनात्मक-काव्यात्मक प्रयोग में “तू” निकटता और एकवचन दोनों को बनाए रखता है; इसका आशय अनादर नहीं है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमामय काव्यात्मक हिन्दी है। पंक्ति-विभाजन इब्रानी समानांतरता को दिखाता है। “स्मरण रखता है” और “सुधि लेता है” दोनों क्रियाओं का भेद बनाए रखते हैं, जबकि “तू” भजन के सीधे एकवचन संबोधन को सुरक्षित रखता है।
