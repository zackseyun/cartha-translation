id: PSA.8.5
reference: Psalms 8:5
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/תְּחַסְּרֵ֣/הוּ מְּ֭עַט מֵ/אֱלֹהִ֑ים וְ/כָב֖וֹד וְ/הָדָ֣ר תְּעַטְּרֵֽ/הוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/008/005.yaml
  text: Yet you made him a little lower than God[a], and crowned him with glory and honor.
translation:
  language: hi
  text: फिर भी तूने उसे परमेश्वर से कुछ ही कम बनाया[a], और उसे महिमा और सम्मान का मुकुट पहनाया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “स्वर्गीय प्राणियों से”; सेप्टुआजेंट में “स्वर्गदूतों से” है, और यही अनुवाद इब्रानियों 2:7 में दिखाई देता है।
    reason: אֱלֹהִים के वैकल्पिक अर्थ और प्राचीन यूनानी पाठ की धर्मवैधानिक महत्ता को सुरक्षित रखना।
lexical_decisions:
- source_word: וַתְּחַסְּרֵהוּ
  choice: तूने उसे ... कम बनाया
  rationale: हिफ़ील रूप और उसके बाद आए तुलनात्मक מִן का अर्थ है कि किसी को दूसरे की अपेक्षा निम्नतर अवस्था में रखा गया; आधुनिक हिंदी में यह स्वाभाविक और स्पष्ट है।
- source_word: מְּעַט
  choice: कुछ ही
  rationale: यहाँ मुख्य अर्थ मात्रा या स्तर का है—बहुत थोड़ा कम—न कि समय की अल्प अवधि का।
- source_word: מֵאֱלֹהִים
  choice: परमेश्वर से
  rationale: इस इब्रानी पद का सीधा और सर्वाधिक स्वाभाविक पाठ ‘परमेश्वर से’ है; ‘स्वर्गीय प्राणियों’ की वास्तविक अर्थ-संभावना को पादटिप्पणी में रखा गया है।
- source_word: וְכָבוֹד
  choice: महिमा
  rationale: כָּבוֹד यहाँ प्रदत्त गरिमा और गौरव को व्यक्त करता है तथा ऊँची काव्यात्मक शैली के अनुकूल है।
- source_word: וְהָדָר
  choice: सम्मान
  rationale: הָדָר वैभव, प्रताप या सम्मान का बोध करा सकता है; ‘सम्मान’ समानांतर शब्द ‘महिमा’ से अनावश्यक पुनरुक्ति बचाते हुए मनुष्य को दी गई प्रतिष्ठा व्यक्त करता है।
- source_word: תְּעַטְּרֵהוּ
  choice: उसे ... का मुकुट पहनाया
  rationale: पिएल रूप राजकीय रूपक में मुकुट पहनाने या सम्मान से घेरने का अर्थ देता है; हिंदी में ‘मुकुट पहनाया’ इस बिंब को स्पष्ट रूप से बनाए रखता है।
theological_decisions:
- issue: एकवचन पुरुषवाचक प्रत्यय का संदर्भ और प्रतिनिधिक अर्थ
  choice: एकवचन ‘उसे’ बनाए रखा
  alternative: ‘उन्हें’ या ‘मनुष्यजाति को’
  rationale: इब्रानी में एकवचन प्रत्यय हैं और निकट संदर्भ में ‘मनुष्य’ प्रतिनिधिक रूप से प्रयुक्त है। एकवचन रखने से मूल व्याकरण सुरक्षित रहता है और व्यापक मानवीय संदर्भ संदर्भक्रम से खुला रहता है।
- issue: אֱלֹהִים का अनुवाद
  choice: परमेश्वर
  alternative: स्वर्गीय प्राणी; स्वर्गदूत
  rationale: मूल इब्रानी की प्राथमिकता के अनुसार मुख्य पाठ में ‘परमेश्वर’ सर्वाधिक सीधा अर्थ है। सेप्टुआजेंट का ‘स्वर्गदूत’ और इब्रानियों 2:7 में उसका प्रतिबिंब महत्त्वपूर्ण है, इसलिए उसे मुख्य पाठ में आरोपित करने के बजाय पादटिप्पणी में बताया गया है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘तूने’ निकट संदर्भ में परमेश्वर से सीधे संबोधन के काव्यात्मक एकवचन को बनाए रखता है। ‘महिमा और सम्मान का मुकुट’ मूल के राजकीय बिंब को स्वाभाविक हिंदी में व्यक्त करता है।
