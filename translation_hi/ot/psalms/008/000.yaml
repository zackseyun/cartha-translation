  register: आधुनिक, गरिमापूर्ण और सहज हिन्दी। शीर्षक के तीनों घटक स्पष्ट रखे गए हैं; अज्ञात संगीत-शब्द का लिप्यंतरण किया गया है और दाऊद से संबंध की मूल इब्रानी अस्पष्टता टिप्पणी में सुरक्षित रखी गई है।
