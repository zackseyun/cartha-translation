  text: For the choir director[a]; according to the Gittith[c][b]. A psalm of David.
translation:
  language: hi
  text: संगीत-निर्देशक के लिए; गित्तीत के अनुसार। दाऊद का भजन।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “गित्तीत” संभवतः संगीत या उपासना से जुड़ा कोई तकनीकी शब्द था—शायद किसी धुन या वाद्य का नाम; इसका ठीक अर्थ अज्ञात है। “दाऊद का” का अर्थ “दाऊद द्वारा रचित,” “दाऊद के लिए,” अथवा दाऊद से किसी अन्य प्रकार से संबद्ध भी हो सकता है।
    reason: cultural_note_and_alternative_reading
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: संगीत-निर्देशक के लिए
  rationale: भजनों के शीर्षकों में यह पद संगीत-प्रस्तुति का संचालन करने वाले व्यक्ति को सूचित करता है। ‘संगीत-निर्देशक’ आधुनिक हिन्दी में स्पष्ट है और केवल गायक-दल तक अर्थ को सीमित नहीं करता।
- source_word: עַל
  choice: के अनुसार
  rationale: संगीत-संबंधी शीर्षकों में यह आगे आने वाले राग, वाद्य या प्रस्तुति-संकेत से संबंध व्यक्त कर सकता है। ‘के अनुसार’ किसी एक अनिश्चित तकनीकी अर्थ को निर्णायक बनाए बिना निर्देश का भाव देता है।
- source_word: הַגִּתִּית
  choice: गित्तीत
  rationale: इस शब्द का निश्चित अर्थ अज्ञात है; यह संभवतः किसी धुन, वाद्य या अन्य संगीत-संबंधी संकेत का नाम है। इसलिए लिप्यंतरण मूल की अनिश्चितता बनाए रखता है।
- source_word: מִזְמוֹר
  choice: भजन
  rationale: यह इस काव्य-संगीत विधा के लिए हिन्दी में प्रचलित और स्वाभाविक पद है।
- source_word: לְדָוִד
  choice: दाऊद का
  rationale: शीर्षक में לְ लेखकत्व, संबंध, समर्पण या संग्रहगत संबद्धता सूचित कर सकता है। ‘दाऊद का’ हिन्दी में इस व्यापक संबंध को सहज रूप से रखता है, जबकि ‘दाऊद द्वारा रचित’ अर्थ को अनावश्यक रूप से संकीर्ण कर देता।
theological_decisions:
- issue: לְדָוִד से सूचित लेखकत्व अथवा संबद्धता
  choice: दाऊद का
  alternative: दाऊद द्वारा रचित / दाऊद के लिए
  rationale: इब्रानी पदबंध संबंध का प्रकार निश्चित नहीं करता। चुना हुआ रूप लेखकत्व की संभावना को खुला रखते हुए उसे अनिवार्य निष्कर्ष नहीं बनाता।
