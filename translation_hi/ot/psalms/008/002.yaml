  yaml_path: translation/ot/psalms/008/002.yaml
  text: From the mouths of infants and nursing babies you have established strength because of your foes[a], to silence the enemy and the avenger.
translation:
  language: hi
  text: 'नन्हे बच्चों और दूध पीते शिशुओं के मुख से

    तूने तेरे विरोधियों के कारण सामर्थ्य स्थापित किया है,[a]

    शत्रु और बदला लेने वाले को चुप कराने के लिए।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘स्तुति’; यह मत्ती 21:16 में प्रतिबिंबित सेप्टुआजिन्ट की परंपरा के अनुसार है। इब्रानी पाठ में ‘सामर्थ्य’ है।
    reason: alternative_reading
lexical_decisions:
- source_word: מִפִּי
  choice: के मुख से
  rationale: מִן के साथ פֶּה का अर्थ ‘के मुख से’ है। हिन्दी में सामूहिक एकवचन ‘मुख’ दोनों समूहों के लिए स्वाभाविक है।
- source_word: עוֹלְלִים
  choice: नन्हे बच्चों
  rationale: यह बहुत छोटे बच्चों को दर्शाता है; ‘नन्हे बच्चे’ आधुनिक, सहज और गरिमापूर्ण हिन्दी है।
- source_word: יֹנְקִים
  choice: दूध पीते शिशुओं
  rationale: कृदन्त रूप उन शिशुओं का ठोस चित्र देता है जो अभी दूध पीते हैं; यह अर्थ को बिना पुरातन शब्दावली के स्पष्ट रखता है।
- source_word: יִסַּדְתָּ
  choice: तूने ... स्थापित किया है
  rationale: יסד का मूल अर्थ नींव रखना या स्थापित करना है। पूर्ण क्रिया को हिन्दी के पूर्ण पक्ष से व्यक्त किया गया है।
- source_word: עֹז
  choice: सामर्थ्य
  rationale: इब्रानी पाठ का सामान्य और प्रत्यक्ष अर्थ ‘बल/सामर्थ्य’ है। ‘सामर्थ्य’ इस प्रसंग में स्वाभाविक है और यूनानी परंपरा के ‘स्तुति’ को मुख्य पाठ में नहीं मिलाता।
- source_word: לְמַעַן
  choice: के कारण
  rationale: यहाँ पद विरोधियों के कारण या उनके संबंध में की गई ईश्वरीय कार्रवाई को बताता है; ‘के कारण’ उस संबंध को संक्षेप में बनाए रखता है।
- source_word: צוֹרְרֶיךָ
  choice: अपने विरोधियों
  rationale: यह शत्रुतापूर्ण प्रतिपक्षियों को दर्शाता है। ‘विरोधी’ अगली पंक्ति के ‘शत्रु’ से अनावश्यक पुनरावृत्ति बचाता है।
- source_word: לְהַשְׁבִּית
  choice: चुप करा दे
  rationale: हिफ़ील infinitive का अर्थ किसी को रुकवा देना या समाप्त कर देना है। विरोधी वाणी के प्रसंग में ‘चुप करा देना’ सजीव और प्रसंगानुकूल है।
- source_word: אוֹיֵב
  choice: शत्रु
  rationale: एकवचन यहाँ प्रतिनिधिक रूप से शत्रु-वर्ग को व्यक्त करता है; हिन्दी में बिना अनिश्चित लेख के ‘शत्रु’ स्वाभाविक है।
- source_word: מִתְנַקֵּם
  choice: बदला लेनेवाले
  rationale: यह कृदन्त बदला लेने में लगे व्यक्ति को दर्शाता है। ‘बदला लेनेवाला’ स्पष्ट आधुनिक हिन्दी है और ‘प्रतिशोधी’ की अपेक्षा अधिक सामान्य-बोधगम्य है।
theological_decisions:
- issue: इब्रानी עֹז बनाम सप्तति/नए नियम की परंपरा में ‘स्तुति’
  choice: मुख्य पाठ में ‘सामर्थ्य’
  alternative: स्तुति
  rationale: मसोरेटिक इब्रानी पाठ में עֹז स्पष्ट रूप से ‘बल/सामर्थ्य’ है। मूल-भाषा की प्राथमिकता के कारण मुख्य पाठ इसी को रखता है; मत्ती 21:16 में प्रतिबिंबित यूनानी परंपरा के ‘स्तुति’ को उसके अंतर्पाठीय महत्व के कारण पाद-टिप्पणी में दिया गया है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, सरल किंतु काव्यात्मक और गरिमापूर्ण रखी गई है। परमेश्वर के लिए भजन की सीधी संबोधन-शैली के अनुरूप ‘तू’ का प्रयोग किया गया है। पंक्ति-विन्यास इब्रानी काव्य की अर्थगत इकाइयों को दर्शाता है।
