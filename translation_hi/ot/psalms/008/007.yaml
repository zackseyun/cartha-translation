  text: भेड़-बकरियाँ और गाय-बैल—वे सब—और खुले मैदान के पशु भी।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: צֹנֶה
  choice: भेड़-बकरियाँ
  rationale: यह सामूहिक संज्ञा छोटे पालतू पशुओं, विशेषकर भेड़ों और बकरियों, को दर्शाती है। ‘भेड़-बकरियाँ’ आधुनिक हिन्दी में स्वाभाविक और अर्थ की दृष्टि से व्यापक है।
- source_word: וַאֲלָפִים
  choice: और गाय-बैल
  rationale: यह शब्द पालतू गोवंश के लिए प्रयुक्त है। ‘गाय-बैल’ काव्यात्मक सूची में ठोस और सहज है तथा नर-मादा सहित पूरे वर्ग का संकेत देता है।
- source_word: כֻּלָּם
  choice: वे सब
  rationale: मूल में सर्वनाम-प्रत्यय सहित ‘वे सब’ का स्पष्ट और बलपूर्ण भाव है; इसे अलग पदबंध के रूप में रखा गया है।
- source_word: וְגַם
  choice: और ... भी
  rationale: संयोजक और योगसूचक अव्यय पालतू पशुओं से आगे सूची का विस्तार करते हैं; हिन्दी का ‘और ... भी’ यही अतिरिक्त भाव स्वाभाविक ढंग से व्यक्त करता है।
- source_word: בַּהֲמוֹת
  choice: पशु
  rationale: इस प्रसंग में बहुवचन सामान्यतः बड़े जानवरों को दर्शाता है। ‘पशु’ गरिमापूर्ण, व्यापक और आधुनिक हिन्दी में सहज है।
- source_word: שָׂדָי
  choice: मैदान के
  rationale: यह रूप खेत, खुले मैदान या खुले देहात का बोध देता है। ‘मैदान के’ मूल काव्य-चित्र को संक्षेप में बनाए रखता है।
