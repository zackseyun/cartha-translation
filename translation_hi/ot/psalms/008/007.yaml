  source_fidelity: 'The animal categories and additive structure are accurately represented: צֹנֶה as ‘भेड़-बकरियाँ,’ אֲלָפִים as ‘गाय-बैल,’ and בַּהֲמוֹת שָׂדָי as animals associated with the open field/countryside. ‘वे सब’ correctly conveys כֻּלָּם.'
