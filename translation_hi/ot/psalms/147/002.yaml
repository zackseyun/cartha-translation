    reason: lexical_alternative
lexical_decisions:
- source_word: בּוֹנֵה
  choice: फिर से बसाता है
  rationale: בנה का कालवाचक कृदन्त यहाँ याहवे के निरन्तर/विशिष्ट कार्य को वर्तमान काल में व्यक्त करता है। सन्दर्भ नगर की पुनर्स्थापना का है, इसलिए केवल ‘बनाता है’ की अपेक्षा ‘फिर से बसाता है’ आधुनिक हिन्दी में आशय स्पष्ट करता है, जबकि अधिक शाब्दिक विकल्प पादटिप्पणी में सुरक्षित है।
- source_word: יְרוּשָׁלִַם
  choice: यरूशलेम
  rationale: इस स्थान-नाम का प्रचलित मानक हिन्दी रूप।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम का हिन्दी लिप्यन्तरण; इसे किसी उपाधि से प्रतिस्थापित नहीं किया गया।
- source_word: נִדְחֵי
  choice: बिखरे हुओं
  rationale: נדח से बना यह रूप उन लोगों को दर्शाता है जो दूर हटा दिए गए, तितर-बितर हुए या निर्वासित हैं। ‘बिखरे हुए’ व्यापक अर्थ बनाए रखता है और औपचारिक निर्वासन तक सीमित नहीं करता।
- source_word: יִשְׂרָאֵל
  choice: इस्राएल
  rationale: राष्ट्रीय नाम का प्रचलित मानक हिन्दी रूप।
- source_word: יְכַנֵּס
  choice: इकट्ठा करता है
  rationale: כנס के पिएल अपूर्ण रूप का अर्थ इकट्ठा करना/एकत्र करना है; समानान्तर कृदन्त के साथ वर्तमानकालीन हिन्दी स्वाभाविक है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ व्यक्तिगत वाचा-नाम का स्पष्ट प्रयोग करता है। ‘याहवे’ उसका सीधा लिप्यन्तरण है और उसे उपाधि में नहीं बदलता।
- issue: नगर के निर्माण का पुनर्स्थापना-सूचक भाव
  choice: यरूशलेम को फिर से बसाता है
  alternative: यरूशलेम को बनाता है
  rationale: निकटवर्ती सन्दर्भ बिखरे हुए इस्राएलियों को इकट्ठा करने का है, जिससे पुनर्स्थापना का भाव प्रबल होता है। फिर भी मूल क्रिया का अधिक शाब्दिक अर्थ पादटिप्पणी में दिया गया है, ताकि पाठ की सम्भावित व्यापकता बनी रहे।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण मानक हिन्दी। समानान्तर पंक्तियों में वर्तमान काल रखा गया है। ‘फिर से बसाता है’ पुनर्स्थापना-सन्दर्भ को स्वाभाविक हिन्दी में व्यक्त करता है; अधिक शाब्दिक सम्भावना पादटिप्पणी में सुरक्षित है।
