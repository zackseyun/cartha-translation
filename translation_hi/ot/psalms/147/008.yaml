source:
  edition: WLC
  text: הַֽ/מְכַסֶּ֬ה שָׁמַ֨יִם בְּ/עָבִ֗ים הַ/מֵּכִ֣ין לָ/אָ֣רֶץ מָטָ֑ר הַ/מַּצְמִ֖יחַ הָרִ֣ים חָצִֽיר׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/147/008.yaml
  text: who covers the heavens with clouds[a], who prepares rain for the earth, who makes grass sprout on the mountains.
translation:
  language: hi
  text: 'जो आकाश को बादलों से ढकता है,

    जो पृथ्वी के लिए वर्षा का प्रबंध करता है,

    जो पहाड़ों पर घास उगाता है।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מְכַסֶּה
  choice: ढकता है
  rationale: यह כסה के आवरण डालने के सीधे अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: שָׁמַיִם
  choice: आकाश
  rationale: इस मौसम-संबंधी काव्यात्मक संदर्भ में हिन्दी का सामूहिक एकवचन ‘आकाश’ स्वाभाविक है और इब्रानी शब्द के आशय को स्पष्ट रखता है।
- source_word: עָבִים
  choice: बादलों
  rationale: यह सामान्य और स्पष्ट हिन्दी समतुल्य है; मूल में घनेपन पर अलग से बल देना आवश्यक नहीं है।
- source_word: מֵּכִין
  choice: तैयार करता है
  rationale: כון के हिफ़ील रूप में निहित ‘तैयार करना/उपलब्ध करना’ का भाव बिना अतिरिक्त व्याख्या के सुरक्षित रहता है।
- source_word: לָאָרֶץ
  choice: पृथ्वी के लिए
  rationale: व्यापक आकाश और वर्षा के संदर्भ में ‘पृथ्वी’ स्थानीय ‘देश’ या ‘भूमि’ से अधिक उपयुक्त है।
- source_word: מָטָר
  choice: वर्षा
  rationale: ‘वर्षा’ काव्यात्मक गरिमा बनाए रखते हुए आधुनिक मानक हिन्दी में सहज है।
- source_word: מַּצְמִיחַ
  choice: उगाता है
  rationale: यह צמח के हिफ़ील रूप की कारक शक्ति—उगने का कारण बनना—को संक्षिप्त और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: הָרִים
  choice: पहाड़ों
  rationale: यह मूल के सामान्य अर्थ को सीधे रखता है और चित्र को अनावश्यक रूप से ‘पहाड़ियों’ तक सीमित नहीं करता।
- source_word: חָצִיר
  choice: घास
  rationale: इस संदर्भ में यह सबसे स्पष्ट और सामान्य हिन्दी अर्थ है।
theological_decisions:
- issue: परमेश्वर की निरंतर क्रिया को व्यक्त करने वाली कृदन्त-श्रृंखला
  choice: हर पंक्ति में ‘जो ...’ की पुनरावृत्ति रखी गई है।
  alternative: 'स्वतंत्र सीमित क्रियाएँ: ‘वह ढकता है ... वह तैयार करता है ... वह उगाता है।’'
  rationale: इब्रानी में प्रयुक्त लगातार कृदन्त पिछले संदर्भ से जुड़े हुए परमेश्वर के चरित्रगत और निरंतर कार्यों का वर्णन करते हैं; ‘जो’ की पुनरावृत्ति उस काव्यात्मक संबंध को बनाए रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमामय और काव्यात्मक शैली रखी गई है। पंक्ति-विभाजन इब्रानी की तीन समानान्तर कृदन्तीय उपवाक्य-रचना को उभारता है। अंग्रेज़ी परामर्श-पाठ में [a] का स्थान और उसकी टिप्पणी परस्पर असंगत थे, इसलिए मूल इब्रानी में किसी वास्तविक पाठगत या अर्थगत अस्पष्टता के अभाव में उसे हिन्दी मसौदे में नहीं अपनाया गया।
