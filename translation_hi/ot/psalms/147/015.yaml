  yaml_path: translation/ot/psalms/147/015.yaml
  text: He sends his command to the earth[b][a]; his word runs swiftly.
translation:
  language: hi
  text: वह पृथ्वी पर अपनी आज्ञा भेजता है[a]; उसका वचन बहुत तेज़ी से दौड़ता है[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “अपनी उक्ति” (אִמְרָתוֹ)।
    reason: lexical_alternative
  - marker: b
    text: या “शीघ्रता से”; इब्रानी अभिव्यक्ति तीव्र गति पर बल देती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשֹּׁלֵחַ
  choice: वह भेजता है
  rationale: यह कृदन्त यहाँ परमेश्वर के निरन्तर कार्य का वर्णन करते हुए क्रियात्मक अर्थ देता है; आधुनिक हिन्दी में सीमित क्रिया स्वाभाविक है।
- source_word: אִמְרָתוֹ
  choice: अपनी आज्ञा
  rationale: शब्द का मूल अर्थ ‘कथन/उक्ति’ है, पर सृष्टि में प्रभावी परमेश्वरीय वाणी के इस प्रसंग में ‘आज्ञा’ उसकी कार्यकारी शक्ति व्यक्त करती है और आगे आने वाले דְּבָרוֹ से शब्दगत भेद भी बनाए रखती है।
- source_word: אָרֶץ
  choice: पृथ्वी पर
  rationale: भजन का व्यापक सृष्टिगत प्रसंग ‘देश’ की अपेक्षा ‘पृथ्वी’ का समर्थन करता है; ‘भेजता है’ के साथ ‘पृथ्वी पर’ स्वाभाविक हिन्दी है।
- source_word: עַד מְהֵרָה
  choice: बहुत तेज़ी से
  rationale: यह इब्रानी अभिव्यक्ति तीव्र गति पर बल देती है; ‘बहुत तेज़ी से’ उसका बल स्पष्ट और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: יָרוּץ
  choice: दौड़ता है
  rationale: मूल क्रिया का सामान्य अर्थ ‘दौड़ना’ है; इसे बनाए रखने से परमेश्वर के वचन का काव्यात्मक मानवीकरण सुरक्षित रहता है।
- source_word: דְּבָרוֹ
  choice: उसका वचन
  rationale: यहाँ ‘वचन’ स्वाभाविक है और पहली पंक्ति की ‘आज्ञा’ के समानार्थी होते हुए भी इब्रानी काव्य की शब्दगत विविधता बनाए रखता है।
theological_decisions:
- issue: काव्यात्मक समान्तरता में परमेश्वर की वाणी का स्वरूप
  choice: परमेश्वर की वाणी को प्रभावी ‘आज्ञा’ और ‘वचन’ के रूप में प्रस्तुत किया गया है।
  alternative: दोनों संज्ञाओं का अनुवाद ‘वचन’ करना, या मुख्य पाठ में इसे स्पष्ट रूप से व्यक्तिगत लोगोस के रूप में पढ़ना।
  rationale: भजन सृष्टि और उसके संचालन में परमेश्वर की प्रभावशाली वाणी की बात करता है। अनुवाद इस सामर्थ्य को बनाए रखता है, पर ऐसी बाद की मसीही व्याख्या को मुख्य पाठ में नहीं जोड़ता जिसे इब्रानी पद स्वयं स्पष्ट रूप से नहीं कहता।
translation_notes:
  register: भाषा आधुनिक, सरल और गरिमापूर्ण रखी गई है। ‘आज्ञा’ और ‘वचन’ समान्तर दिव्य वाणी को व्यक्त करते हैं, जबकि ‘दौड़ता है’ मूल काव्यात्मक चित्र को सुरक्षित रखता है।
