  yaml_path: translation/ot/psalms/147/013.yaml
  text: For he has strengthened the bars of your gates[b][a]; he has blessed your children within you.
translation:
  language: hi
  text: क्योंकि उसने तेरे फाटकों के बेंड़ों को मजबूत किया है; उसने तेरे भीतर तेरे बच्चों[a] को आशीष दी है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “तेरे पुत्रों।” हिब्रू शब्द का अर्थ विशेष रूप से पुत्र अथवा व्यापक रूप से बच्चे या संतान हो सकता है; यहाँ यरूशलेम को संबोधित सामुदायिक संदर्भ में व्यापक अर्थ उपयुक्त है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले कथन के समर्थन में कारण प्रस्तुत करता है और हिब्रू के कारणवाचक संबंध को स्वाभाविक हिंदी में बनाए रखता है।
- source_word: חִזַּק
  choice: दृढ़ किया है
  rationale: पिएल रूप किसी वस्तु को मजबूत या दृढ़ करने की पूर्ण क्रिया व्यक्त करता है; फाटकों के बेड़ों के साथ यह हिंदी में स्वाभाविक है।
- source_word: בְּרִיחֵי
  choice: बेड़ों
  rationale: यह फाटक को सुरक्षित करने वाले आड़े मजबूत डंडों या साँकलों को सूचित करता है। 'बेड़े' सामान्य और पर्याप्त रूप से सटीक शब्द है, जो यंत्र की बनावट को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: שְׁעָרָיִךְ
  choice: तेरे फाटकों
  rationale: स्त्रीलिंग एकवचन संबोधन यरूशलेम/सिय्योन नामक नगरी से है; 'तेरे फाटकों' से यह व्यक्तिकृत सीधा संबोधन बना रहता है।
- source_word: בֵּרַךְ
  choice: आशीष दी है
  rationale: पिएल पूर्ण रूप का सीधा और प्रचलित हिंदी अनुवाद है, जो पूर्ण की गई कृपा को व्यक्त करता है।
- source_word: בָּנַיִךְ
  choice: तेरे बच्चों
  rationale: בנים का अर्थ विशेष रूप से 'पुत्र' भी हो सकता है और व्यापक रूप से संतान या बच्चे भी। नगरी के सामुदायिक संदर्भ में व्यापक अर्थ अधिक उपयुक्त है।
- source_word: בְּקִרְבֵּךְ
  choice: तेरे बीच
  rationale: शाब्दिक अर्थ 'तेरे मध्य में' है। 'तेरे बीच' आधुनिक हिंदी में स्वाभाविक है और नगरी के व्यक्तिकृत संबोधन को बनाए रखता है।
theological_decisions:
- issue: स्त्रीलिंग एकवचन में व्यक्तिकृत संबोधन
  choice: नगरी को 'तेरे' कहकर प्रत्यक्ष संबोधन बनाए रखा गया है।
  alternative: पद में स्पष्ट रूप से 'यरूशलेम' या 'सिय्योन' जोड़ना।
  rationale: हिब्रू प्रत्यय स्त्रीलिंग एकवचन हैं और व्यक्तिकृत नगरी की ओर संकेत करते हैं; मूल में अनुपस्थित नाम जोड़े बिना हिंदी में इसे प्रत्यक्ष संबोधन से सुरक्षित रखा जा सकता है।
- issue: सामुदायिक संदर्भ में בנים का अर्थ
  choice: तेरे बच्चों
  alternative: तेरे पुत्रों
  rationale: हिब्रू शब्द पुरुष संतानों के लिए विशिष्ट भी हो सकता है, किंतु नगरी और उसके निवासियों के इस संदर्भ में सामूहिक अर्थ संभवतः अभिप्रेत है। पादटिप्पणी वास्तविक शाब्दिक विकल्प को सुरक्षित रखती है।
translation_notes:
  register: आधुनिक मानक हिंदी में काव्यात्मक, गरिमापूर्ण और सहज शैली अपनाई गई है। एक ही पद में व्यक्तिकृत नगरी के लिए 'तेरे' का एकरूप प्रयोग किया गया है। 'फाटकों के बेड़े' प्राचीन नगर-सुरक्षा की ठोस छवि को बनाए रखता है।
