translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और काव्यात्मक रूप। दोनों समानांतर पंक्तियों और उनकी उपमाओं को सुरक्षित रखा गया है। किसी पादटिप्पणी की आवश्यकता नहीं, क्योंकि ‘पाला’ כְּפוֹר का स्पष्ट और सामान्य हिन्दी पर्याय है।
