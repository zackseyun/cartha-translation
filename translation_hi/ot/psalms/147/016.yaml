  yaml_path: translation/ot/psalms/147/016.yaml
  text: He gives snow like wool[a]; he scatters frost like ashes.
translation:
  language: hi
  text: 'वह ऊन के समान बर्फ देता है;

    वह पाले को राख के समान बिखेरता है।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַנֹּתֵן
  choice: वह देता है
  rationale: נתן का क़ाल कृदंत परमेश्वर के निरंतर या सामान्य कार्य का वर्णन करता है; आधुनिक हिन्दी में वर्तमानकालीन क्रिया स्वाभाविक है।
- source_word: שֶׁלֶג
  choice: बर्फ
  rationale: यह हिमपात या गिरी हुई बर्फ के लिए सामान्य शब्द है; प्रसंग में ‘बर्फ’ सहज और स्पष्ट है।
- source_word: כַּצָּמֶר
  choice: ऊन के समान
  rationale: तुलनार्थक כ और צמר की उपमा को औपचारिक किन्तु सहज हिन्दी में सुरक्षित रखा गया है।
- source_word: כְּפוֹר
  choice: पाला
  rationale: यह भूमि या सतह पर जमने वाले तुषार अथवा पाले को दर्शाता है; ‘पाला’ आधुनिक हिन्दी में सर्वाधिक सुबोध है।
- source_word: כָּאֵפֶר
  choice: राख के समान
  rationale: तुलनार्थक כ के साथ אפר की काव्यात्मक उपमा को सीधे बनाए रखा गया है।
- source_word: יְפַזֵּר
  choice: बिखेरता है
  rationale: פזר के पिएल रूप में व्यापक रूप से छितराने का सजीव भाव है, जिसे ‘बिखेरता है’ स्वाभाविक रूप से व्यक्त करता है।
