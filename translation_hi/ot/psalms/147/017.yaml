base_translation:
  language: en
  yaml_path: translation/ot/psalms/147/017.yaml
  text: He throws down his ice like crumbs[b][a]; who can stand before his cold?
translation:
  language: hi
  text: वह अपनी बर्फ़ को टुकड़ों के समान बिखेरता है[a]; उसकी ठंड के सामने कौन टिक सकता है?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “कौरों के समान” अथवा “छोटे टुकड़ों के समान।” इब्रानी शब्द टूटे हुए छोटे अंशों, संभवतः रोटी के टुकड़ों, की छवि प्रस्तुत करता है।
    reason: lexical_alternative
  - marker: b
    text: या “उसकी ठंड को कौन सह सकता है?”
    reason: lexical_alternative
lexical_decisions:
- source_word: מַשְׁלִיךְ
  choice: बिखेरता है
  rationale: हिफ़ील कृदन्त किसी वस्तु को फेंकने या डालने का भाव देता है। यहाँ बर्फ़ के छोटे टुकड़ों की वर्षा के लिए ‘बिखेरता है’ स्वाभाविक और चित्रात्मक है।
- source_word: קַרְחוֹ
  choice: अपनी बर्फ़
  rationale: קֶרַח बर्फ़ या पाले को सूचित कर सकता है। ‘टुकड़ों के समान’ बिखेरने के साथ ‘बर्फ़’ ठोस और स्वाभाविक चित्र प्रस्तुत करती है; ‘अपनी’ प्रत्यय के ईश्वरीय संबंध को रखता है।
- source_word: כְפִתִּים
  choice: टुकड़ों के समान
  rationale: פִּתִּים छोटे टूटे हुए अंशों या कौरों, विशेषतः रोटी के टुकड़ों, का बोध कराता है। ‘टुकड़ों’ से मूल उपमा बनी रहती है और हिंदी में अनावश्यक रूप से बहुत छोटे चूरे का अर्थ नहीं जुड़ता।
- source_word: לִפְנֵי
  choice: के सामने
  rationale: मूल अर्थ ‘के सामने/उपस्थिति में’ है; आलंकारिक प्रश्न में यह स्वाभाविक हिंदी है।
- source_word: קָרָתוֹ
  choice: उसकी ठंड
  rationale: קָרָה का अर्थ ठंड है और प्रत्यय परमेश्वर से उसका संबंध दिखाता है। संक्षिप्त अभिव्यक्ति मूल काव्यात्मकता को रखती है।
- source_word: מִי יַעֲמֹד
  choice: कौन टिक सकता है
  rationale: शाब्दिक भाव ‘कौन खड़ा रहेगा’ है, पर इस प्रसंग में ठंड को सहकर बने रहने का आशय है। ‘टिक सकता है’ खड़े रहने की छवि और सह पाने के अर्थ दोनों को स्वाभाविक हिंदी में व्यक्त करता है।
