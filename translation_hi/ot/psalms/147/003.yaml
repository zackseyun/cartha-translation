lexical_decisions:
- source_word: הָרֹפֵא
  choice: वह ... चंगा करता है
  rationale: काल-वाचक कृदंत यहाँ परमेश्वर के नियमित और विशिष्ट कार्य का वर्णन करता है; हिन्दी में सामान्य वर्तमान काल स्वाभाविक है।
- source_word: לִשְׁבוּרֵי לֵב
  choice: टूटे मनवालों को
  rationale: शाब्दिक अर्थ ‘मन के टूटे हुए’ है। ‘टूटे मनवाले’ मूल रूपक को बनाए रखते हुए साधारण आधुनिक हिन्दी में सहज है।
- source_word: וּמְחַבֵּשׁ
  choice: और ... पट्टी बाँधता है
  rationale: चिकित्सा-संदर्भ में חבש का अर्थ घाव बाँधना या उस पर पट्टी करना है। यह चयन ठोस उपचार-चित्र को स्पष्ट रखता है।
- source_word: לְעַצְּבוֹתָם
  choice: उनके घावों पर
  rationale: עַצֶּבֶת चोट, पीड़ा या दुख को सूचित कर सकता है। ‘पट्टी बाँधता है’ के समानांतर ‘घाव’ चिकित्सा-रूपक के लिए सर्वाधिक स्वाभाविक है, जबकि अन्य अर्थ पादटिप्पणी में सुरक्षित हैं।
theological_decisions:
- issue: चंगाई के चित्र का दायरा
  choice: भीतरी वेदना और शारीरिक घाव—दोनों की प्रतिध्वनि बनाए रखना
  alternative: इसे केवल आत्मिक सांत्वना या केवल शारीरिक चंगाई मानना
  rationale: समानांतर पंक्तियाँ ‘टूटे मन’ को ‘घावों पर पट्टी बाँधने’ से जोड़ती हैं। अनुवाद इस जानबूझकर रखे गए भावात्मक और शारीरिक तनाव को किसी एक सीमित अर्थ में नहीं बाँधता।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और काव्यात्मक गद्य। ‘चंगा करता है’ बाइबलीय हिन्दी में परिचित है, जबकि ‘पट्टी बाँधता है’ चिकित्सा-चित्र को आम पाठक के लिए ठोस और स्पष्ट बनाता है।
