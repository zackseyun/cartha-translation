  text: רוֹצֶ֣ה יְ֭הוָה אֶת יְרֵאָ֑י/ו אֶת הַֽ/מְיַחֲלִ֥ים לְ/חַסְדּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/147/011.yaml
  text: Yahweh delights in those who fear him[b][a], in those who hope for his steadfast love.
translation:
  language: hi
  text: याहवे उन लोगों से प्रसन्न होता है जो उसका भय मानते हैं, और जो उसके अटल प्रेम की आशा रखते हैं।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जो उसके अटल प्रेम की प्रतीक्षा करते हैं।” इब्रानी क्रिया में आशा रखने और प्रतीक्षा करने—दोनों का भाव हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: רוֹצֶה
  choice: प्रसन्न होता है
  rationale: यहाँ רצה केवल इच्छा करने को नहीं, बल्कि किसी से अनुकूल रूप से प्रसन्न होने को व्यक्त करता है। हिंदी में ‘से प्रसन्न होता है’ स्वाभाविक और गरिमापूर्ण है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी परमेश्वर के व्यक्तिगत नाम יהוה को उपाधि से बदलने के बजाय लिप्यंतरित किया गया है।
- source_word: יְרֵאָיו
  choice: जो उसका भय मानते हैं
  rationale: यह वाक्यांश श्रद्धायुक्त भय का अर्थ रखता है; ‘भय’ को बनाए रखने से मूल की धर्मवैचारिक गहनता और तनाव सुरक्षित रहते हैं।
- source_word: הַמְיַחֲלִים
  choice: जो ... आशा रखते हैं
  rationale: יחל में प्रतीक्षा और आशा दोनों भाव संभव हैं। इस प्रसंग में חסד की ओर भरोसे से देखने का भाव होने के कारण ‘आशा रखते हैं’ सहज है; वैकल्पिक अर्थ पादटिप्पणी में दिया गया है।
- source_word: לְחַסְדּוֹ
  choice: उसके अटल प्रेम की
  rationale: חסד में प्रेम, निष्ठा और दया का समृद्ध भाव है। ‘अटल प्रेम’ संक्षेप में उसके स्थायी और विश्वसनीय स्वरूप को व्यक्त करता है।
theological_decisions:
- issue: יהוה परमेश्वर के नाम का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में व्यक्तिगत नाम है; ‘याहवे’ उसे किसी उपाधि से प्रतिस्थापित किए बिना प्रस्तुत करता है।
- issue: परमेश्वर के भय की भाषा
  choice: उसका भय मानते हैं
  alternative: उसका आदर करते हैं
  rationale: ‘आदर’ मूल के भय-संबंधी अर्थ को अनावश्यक रूप से हल्का कर देता; चुना हुआ रूप श्रद्धा और भय के तनाव को बनाए रखता है।
- issue: יחל में आशा और प्रतीक्षा
  choice: आशा रखते हैं
  alternative: प्रतीक्षा करते हैं
  rationale: दोनों अर्थ शब्द में निहित हो सकते हैं। मुख्य पाठ में प्रसंगानुकूल ‘आशा’ रखी गई है और वास्तविक lexical ambiguity पादटिप्पणी में सुरक्षित की गई है।
translation_notes:
  register: आधुनिक मानक हिंदी; सरल, गरिमापूर्ण और सार्वजनिक पाठ के अनुकूल। ‘भय मानना’ तथा ‘अटल प्रेम’ जैसे परिचित बाइबलीय पदों को मूल की अर्थ-गहनता बनाए रखते हुए प्रयोग किया गया है।
