base_translation:
  language: en
  yaml_path: translation/ot/psalms/147/018.yaml
  text: He sends out his word and melts them; he makes his wind blow[a], and the waters flow.
translation:
  language: hi
  text: वह अपना वचन भेजता है और उन्हें पिघला देता है; वह अपनी हवा चलाता है[a], और जल बहता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘उसकी आत्मा’ अथवा ‘उसकी श्वास’। हिब्रू शब्द के ये सभी अर्थ हो सकते हैं, पर यहाँ मौसम के चित्रण में ‘हवा’ सबसे उपयुक्त है।
    reason: lexical_alternative
lexical_decisions:
- source_word: יִשְׁלַח
  choice: भेजता है
  rationale: काव्यात्मक संदर्भ में यह परमेश्वर की नियमित या विशिष्ट क्रिया व्यक्त करता है; हिंदी में ‘भेजता है’ स्वाभाविक और ठोस है।
- source_word: דְּבָרוֹ
  choice: अपना वचन
  rationale: דבר का अर्थ ‘वचन’, ‘बात’ या ‘आज्ञा’ हो सकता है। ‘वचन’ उस काव्यात्मक भाव को बनाए रखता है जिसमें परमेश्वर का कहा हुआ सृष्टि पर प्रभाव डालता है, बिना ‘आज्ञा’ को अनावश्यक रूप से स्पष्ट किए।
- source_word: וְיַמְסֵם
  choice: और उन्हें पिघला देता है
  rationale: हिफ़ील रूप कारणवाचक अर्थ देता है। बहुवचन कर्म-सर्वनाम का संबंध पिछले पद में वर्णित जमी हुई वस्तुओं से है, इसलिए मुख्य पाठ में उसे स्पष्ट करके ‘बर्फ़’ नहीं बनाया गया।
- source_word: יַשֵּׁב
  choice: चलाता है
  rationale: नशब के हिफ़ील रूप का अर्थ ‘चलने देता/चलाता है’ है; हवा के साथ ‘हवा चलाता है’ हिंदी में स्वाभाविक रहते हुए कारणवाचकता व्यक्त करता है।
- source_word: רוּחוֹ
  choice: अपनी हवा
  rationale: רוּחַ के अर्थ ‘हवा’, ‘श्वास’ और ‘आत्मा’ हो सकते हैं। यहाँ पिघलने और जल बहने के मौसम-संबंधी संदर्भ में ‘हवा’ सर्वाधिक उपयुक्त है; अन्य अर्थ पादटिप्पणी में सुरक्षित हैं।
- source_word: יִזְּלוּ
  choice: बहने लगता है
  rationale: यह क्रिया तरल पदार्थ के बहने को दर्शाती है। हिंदी में एकवचन द्रव्यवाचक ‘जल’ के साथ ‘बहने लगता है’ स्वाभाविक है और पिघलने के फलस्वरूप प्रवाह आरंभ होने का भाव देता है।
- source_word: מָיִם
  choice: जल
  rationale: हिब्रू में यह रूप बहुवचन है, किंतु आधुनिक मानक हिंदी में ‘जल’ द्रव्यवाचक संज्ञा के रूप में अधिक स्वाभाविक, स्पष्ट और काव्यात्मक है।
theological_decisions:
- issue: רוּחוֹ का अर्थ और परमेश्वर की सृष्टि पर क्रिया
  choice: अपनी हवा
  alternative: अपनी आत्मा / अपनी श्वास
  rationale: पद का निकट संदर्भ मौसम का है—जमी हुई वस्तुएँ पिघलती हैं और जल बहता है—इसलिए ‘हवा’ प्राथमिक अर्थ है। फिर भी हिब्रू शब्द की व्यापक अर्थ-सीमा को पादटिप्पणी में रखा गया है ताकि संभावित धार्मिक अर्थ को न तो थोपा जाए, न छिपाया जाए।
translation_notes:
  register: आधुनिक मानक हिंदी में सहज, गरिमापूर्ण काव्यात्मक गद्य। ‘वचन’ बाइबलीय काव्य की ऊँचाई बनाए रखता है, जबकि वाक्यरचना सामान्य पाठक के लिए सरल है। मुख्य पाठ में मूल की अस्पष्ट बहुवचन वस्तु ‘उन्हें’ सुरक्षित रखी गई है।
