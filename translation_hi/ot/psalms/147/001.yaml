source:
  edition: WLC
  text: הַ֥לְלוּ יָ֨הּ כִּי ט֭וֹב זַמְּרָ֣ה אֱלֹהֵ֑י/נוּ כִּֽי נָ֝עִים נָאוָ֥ה תְהִלָּֽה׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/147/001.yaml
  text: Praise Yah[a], for it is good to sing praises to our God[b]; for it is pleasant and praise is fitting.
translation:
  language: hi
  text: याह की स्तुति करो[a], क्योंकि हमारे परमेश्वर का भजन गाना अच्छा है; क्योंकि यह मनोहर है और स्तुति करना उचित है[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इब्रानी: “याह,” परमेश्वर के नाम का संक्षिप्त रूप; बहुत-से अनुवाद इसे “यहोवा” या “प्रभु” लिखते हैं।'
    reason: alternative_reading
  - marker: b
    text: या, “स्तुति सुंदर है” अथवा “स्तुति शोभनीय है।”
    reason: lexical_alternative
lexical_decisions:
- source_word: הַלְלוּ
  choice: स्तुति करो
  rationale: बहुवचन आज्ञार्थक रूप को सीधे सामूहिक आह्वान के रूप में रखा गया है।
- source_word: יָהּ
  choice: याह
  rationale: यह परमेश्वर के नाम का संक्षिप्त रूप है; लिप्यंतरण मूल रूप और ‘हल्लेलूयाह’ से उसका संबंध बनाए रखता है।
- source_word: כִּי טוֹב זַמְּרָה
  choice: क्योंकि ... भजन गाना अच्छा है
  rationale: כִּי कारण बताता है, טוֹב व्यापक अर्थ में ‘अच्छा’ है, और זמר संगीतमय स्तुति को सूचित करता है।
- source_word: אֱלֹהֵינוּ
  choice: हमारे परमेश्वर
  rationale: प्रथम पुरुष बहुवचन प्रत्यय सहित संज्ञा का सीधा और स्वाभाविक अनुवाद।
- source_word: נָעִים
  choice: मनोहर
  rationale: यह शब्द सुखद, मधुर या आनंददायक गुण व्यक्त करता है; ‘मनोहर’ गरिमापूर्ण और सहज हिंदी है।
- source_word: נָאוָה תְהִלָּה
  choice: स्तुति करना उचित है
  rationale: נָאוָה यहाँ शोभनीय अथवा उपयुक्त होने का भाव देता है; क्रियात्मक हिंदी अभिव्यक्ति अर्थ को स्वाभाविक बनाती है।
theological_decisions:
- issue: ईश्वरीय नाम יָהּ का अनुवाद
  choice: याह
  alternative: यहोवा / प्रभु
  rationale: मूल पाठ में पूर्ण चतुरक्षरीय नाम नहीं, बल्कि उसका संक्षिप्त रूप יָהּ है। ‘याह’ इस भेद तथा ‘हल्लेलूयाह’ के साथ संबंध को सुरक्षित रखता है।
- issue: נָאוָה का अर्थ
  choice: उचित
  alternative: सुंदर / शोभनीय
  rationale: शब्द सौंदर्य और उपयुक्तता दोनों का भाव दे सकता है। मुख्य पाठ में प्रसंगानुकूल ‘उचित’ रखा गया और वैकल्पिक अर्थ पादटिप्पणी में सुरक्षित किया गया है।
translation_notes:
  register: आधुनिक मानक हिंदी में सामूहिक उपासना का गरिमापूर्ण किंतु सहज स्वर रखा गया है। ‘भजन गाना’ संगीतमय स्तुति को स्पष्ट करता है; दोनों पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित हैं।
