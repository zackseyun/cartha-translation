base_translation:
  language: en
  yaml_path: translation/ot/psalms/147/020.yaml
  text: He has not done so for any nation; they have not known his judgments[a]. Praise Yah!
translation:
  language: hi
  text: उसने किसी भी राष्ट्र के लिए ऐसा नहीं किया; और वे उसके न्याय-विधानों को नहीं जानते। याह की स्तुति करो![a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “प्रभु की स्तुति करो!” इब्रानी हल्लेलू-याह का शाब्दिक अर्थ “याह की स्तुति करो” है; ‘याह’ परमेश्वर के नाम का संक्षिप्त रूप है।
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא עָשָׂה כֵן
  choice: उसने ... ऐसा नहीं किया
  rationale: इब्रानी पूर्ण क्रिया और כֵן के पूर्वसंदर्भी अर्थ को स्वाभाविक, संक्षिप्त हिन्दी में व्यक्त करता है।
- source_word: לְכָל גּוֹי
  choice: किसी भी जाति के साथ
  rationale: नकारात्मक वाक्य में כָּל का भाव ‘किसी भी’ है; לְ को यहाँ व्यवहार के संबंध में ‘के साथ’ कहना हिन्दी में स्वाभाविक है।
- source_word: וּמִשְׁפָּטִים
  choice: और ... न्याय-विधानों को
  rationale: מִשְׁפָּטִים में न्यायिक निर्णय और दिए हुए विधान—दोनों का भाव है; ‘न्याय-विधान’ इस व्यापकता को बनाए रखता है।
- source_word: בַּל יְדָעוּם
  choice: वे ... नहीं जानते
  rationale: काव्यात्मक नकार בַּל और ידע के मूल अर्थ ‘जानना’ को रखा गया है; क्रिया से जुड़े बहुवचन कर्म-प्रत्यय को ‘न्याय-विधानों को’ से स्पष्ट किया गया है।
- source_word: הַלְלוּ יָהּ
  choice: याह की स्तुति करो
  rationale: बहुवचन आज्ञार्थक הַלְלוּ का सहज सामूहिक हिन्दी रूप और संक्षिप्त ईश्वरीय नाम יָהּ का लिप्यंतरण सुरक्षित रखा गया है।
theological_decisions:
- issue: समापन में संक्षिप्त ईश्वरीय नाम יָהּ
  choice: याह
  alternative: यहोवा / प्रभु / हल्लेलूयाह
  rationale: मूल में पूर्ण चतुराक्षरी नाम नहीं बल्कि उसका संक्षिप्त रूप יָהּ है। ‘याह’ उसी रूप को पारदर्शी ढंग से सुरक्षित रखता है और उसे किसी उपाधि या पारंपरिक उद्गार में नहीं बदलता।
- issue: מִשְׁפָּטִים का आशय
  choice: न्याय-विधान
  alternative: न्याय / नियम / विधियाँ
  rationale: संदर्भ में परमेश्वर द्वारा इस्राएल को बताए गए न्यायपूर्ण आदेश अभिप्रेत हैं। संयुक्त पद कानूनी और न्यायिक दोनों अर्थों को बिना अनावश्यक रूप से सीमित किए बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और सामूहिक आराधना में पठनीय शैली। ‘जाति’ बाइबिलीय सामूहिक ‘राष्ट्र/लोग’ के अर्थ में है। अर्धविराम दोनों समानांतर कथनों को जोड़ता है।
