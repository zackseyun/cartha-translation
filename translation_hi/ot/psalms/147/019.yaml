  text: He declares his word to Jacob[b][a], his statutes and his judgments to Israel.
translation:
  language: hi
  text: 'वह याकूब को अपना वचन बताता है[a],

    और इस्राएल को अपनी विधियाँ और अपनी न्याय-विधियाँ[b]।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अपना वचन प्रकट करता है।”
    reason: lexical_alternative
  - marker: b
    text: “न्याय-विधियाँ” का अनुवाद “नियम” या “न्याय-निर्णय” भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: מַגִּיד
  choice: बताता है
  rationale: נגד के हिफ़ील कृदंत का अर्थ किसी बात को ज्ञात कराना या घोषित करना है। यहाँ “बताता है” सहज आधुनिक हिन्दी है; “प्रकट करता है” भी सम्भव है और उसे पादटिप्पणी में रखा गया है।
- source_word: דברו
  choice: अपना वचन
  rationale: דבר का अर्थ “वचन,” “बात,” या “संदेश” हो सकता है। विधियों और न्याय-विधानों के समानांतर “वचन” व्यापक वाचा-संबंधी अर्थ बनाए रखता है।
- source_word: ליעקב
  choice: याकूब को
  rationale: ל अप्रत्यक्ष कर्म/प्राप्तकर्ता को दर्शाता है। याकूब यहाँ काव्यात्मक रूप से इस्राएल के समानांतर वाचा-समुदाय का नाम है।
- source_word: חקיו
  choice: अपनी विधियाँ
  rationale: חֹק के बहुवचन का आशय निर्धारित नियमों या विधानों से है। “विधियाँ” स्पष्ट, गरिमापूर्ण और कानूनी-वाचा संदर्भ के अनुकूल है।
- source_word: ומשפטיו
  choice: और अपने न्याय-विधान
  rationale: מִשְׁפָּטִים कानूनी या वाचा-संबंधी प्रसंग में न्यायिक निर्णयों, नियमों या विधानों को दर्शा सकता है। “न्याय-विधान” न्याय और नियमन दोनों पहलुओं को बनाए रखता है।
- source_word: לישראל
  choice: इस्राएल को
  rationale: ל प्राप्तकर्ता को दर्शाता है। “इस्राएल” मानक हिन्दी बाइबलीय नाम है और “याकूब” के साथ काव्यात्मक समानांतर बनाता है।
theological_decisions:
- issue: याकूब और इस्राएल का सामूहिक अर्थ
  choice: दोनों वाचा-नामों को बिना व्याख्यात्मक विस्तार के सीधे “याकूब” और “इस्राएल” रखा गया।
  alternative: “याकूब के वंशजों को … इस्राएल की प्रजा को”
  rationale: मूल इब्रानी कविता स्वयं इन नामों का प्रयोग करती है। उन्हें यथावत रखने से काव्यात्मक समानांतरता और सामूहिक संकेत दोनों सुरक्षित रहते हैं।
- issue: דברו और व्यवस्था-संबंधी पदों का संबंध
  choice: דברו को व्यापक “अपना वचन” और חקיו/משפטיו को “अपनी विधियाँ और अपने न्याय-विधान” अनूदित किया गया।
  alternative: पूरी पंक्ति को केवल मूसा की व्यवस्था के लिए स्पष्ट कर देना
  rationale: संदर्भ वाचा और व्यवस्था की ओर संकेत करता है, पर मूल पद “वचन” को किसी एक संकीर्ण तकनीकी अर्थ तक सीमित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में काव्यात्मक, गरिमापूर्ण और सहज शैली अपनाई गई है। दूसरी पंक्ति में इब्रानी समानांतरता को बनाए रखा गया है; “अपना/अपनी/अपने” हिन्दी में एक ही कर्ता के स्वामित्व को स्वाभाविक रूप से व्यक्त करते हैं।
