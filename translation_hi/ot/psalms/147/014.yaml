    text: शाब्दिक रूप से, “गेहूँ की चरबी”; यह सर्वोत्तम गेहूँ के लिए प्रयुक्त इब्रानी मुहावरा है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשָּׂם
  choice: स्थापित करता है
  rationale: שׂוּם का अर्थ ‘रखना, ठहराना, स्थापित करना’ है। कृदन्त यहाँ परमेश्वर के निरंतर कार्य को बताता है; आधुनिक हिन्दी में क्रियात्मक रूप स्वाभाविक है।
- source_word: גְּבוּלֵךְ
  choice: तेरी सीमाओं पर
  rationale: גְּבוּל सीमा, सरहद या सीमावर्ती क्षेत्र को सूचित कर सकता है। यरूशलेम को स्त्रीलिंग एकवचन में संबोधित किया गया है; हिन्दी में सामूहिक अर्थ स्पष्ट करने के लिए ‘सीमाओं पर’ स्वाभाविक है।
- source_word: שָׁלוֹם
  choice: शांति
  rationale: שָׁלוֹם में शांति, कुशल और सुरक्षा के अर्थ समाहित हैं। सीमा के संदर्भ में ‘शांति’ मूल शब्द की व्यापकता और काव्यात्मक संक्षिप्तता बनाए रखती है।
- source_word: חֵלֶב חִטִּים
  choice: उत्तम से उत्तम गेहूँ
  rationale: शाब्दिक रूप से ‘गेहूँ की चरबी/चिकनाई’; חֵלֶב यहाँ सबसे समृद्ध या सर्वोत्तम अंश का इब्रानी मुहावरा है। ‘उत्तम से उत्तम गेहूँ’ उसका स्वाभाविक हिन्दी अर्थ देता है।
- source_word: יַשְׂבִּיעֵךְ
  choice: तुझे तृप्त करता है
  rationale: שׂבע के हिफ़ील रूप का अर्थ भर देना या तृप्त करना है। ‘तृप्त करता है’ भोजन और परमेश्वर की भरपूर व्यवस्था—दोनों भावों को व्यक्त करता है।
