  yaml_path: translation/ot/psalms/147/004.yaml
  text: He counts the number of the stars; he calls all of them by name.
translation:
  language: hi
  text: वह तारों की संख्या गिनता है; वह उन सबको नाम लेकर पुकारता है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מוֹנֶה מִסְפָּר
  choice: संख्या गिनता है
  rationale: מנה के कृदन्त और מִסְפָּר के मेल में ठीक-ठीक गणना का भाव है। हिंदी में ‘संख्या गिनता है’ इस बल को स्वाभाविक रूप से बनाए रखता है।
- source_word: לַכּוֹכָבִים
  choice: तारों की
  rationale: यहाँ ל उपसर्ग מִסְפָּר के साथ संबंध व्यक्त करता है; हिंदी का ‘तारों की संख्या’ मूल मुहावरे का सहज रूप है।
- source_word: לְכֻלָּם
  choice: उन सबको
  rationale: इससे प्रत्येक तारे को समेटने वाला व्यापक और वितरणात्मक भाव स्पष्ट रहता है।
- source_word: שֵׁמוֹת יִקְרָא
  choice: नाम लेकर पुकारता है
  rationale: קרא और ‘नामों’ के मेल को हिंदी में ‘नाम लेकर पुकारना’ स्वाभाविक ढंग से व्यक्त करता है और प्रत्येक तारे की व्यक्तिगत पहचान का भाव बनाए रखता है।
theological_decisions:
- issue: ईश्वरीय कर्ता पद में निहित है, स्पष्ट संज्ञा के रूप में नहीं
  choice: ‘वह’ रखा गया है, जो प्रसंग में परमेश्वर की ओर संकेत करता है।
  alternative: ‘परमेश्वर’ या ‘यहोवा’ को स्पष्ट कर्ता बनाना
  rationale: इब्रानी पद में कर्ता की संज्ञा नहीं है; वह पिछले प्रसंग से समझी जाती है। ‘वह’ मूल की वाक्यगत निरंतरता को बिना अतिरिक्त स्पष्टता जोड़े सुरक्षित रखता है।
- issue: יִקְרָא में ‘पुकारना’, ‘नाम देना’ या ‘बुलाना’ का अर्थ
  choice: ‘नाम लेकर पुकारता है’
  alternative: ‘हर एक का नाम रखता है’
  rationale: स्रोत में नाम देने और नाम लेकर बुलाने की अर्थ-छायाएँ संभव हैं। ‘नाम लेकर पुकारता है’ קרא का सामान्य अर्थ और שֵׁמוֹת के साथ उसका संबंध बनाए रखता है, बिना केवल नामकरण तक अर्थ सीमित किए।
translation_notes:
  register: आधुनिक मानक हिंदी में संक्षिप्त, काव्यात्मक और गरिमापूर्ण शैली। समानांतर दोनों खंडों में वर्तमानकालिक क्रियाएँ रखी गई हैं।
