  text: נוֹתֵ֣ן לִ/בְהֵמָ֣ה לַחְמָ֑/הּ לִ/בְנֵ֥י עֹ֝רֵ֗ב אֲשֶׁ֣ר יִקְרָֽאוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/147/009.yaml
  text: He gives food to the animals[b][a], and to the young ravens that cry out.
translation:
  language: hi
  text: 'वह पशुओं को उनका भोजन देता है,

    और कौए के बच्चों को भी, जो पुकारते हैं।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נוֹתֵן
  choice: वह ... देता है
  rationale: यह क़ाल कृदंत है, जो स्तुति के संदर्भ में परमेश्वर के नियमित कार्य को व्यक्त करता है; हिन्दी में सामान्य वर्तमान काल स्वाभाविक है।
- source_word: לִבְהֵמָה
  choice: पशुओं को
  rationale: בְּהֵמָה पशु या जानवर के लिए व्यापक शब्द हो सकता है; कौए के बच्चों के साथ समानांतरता के कारण इसे केवल पालतू मवेशियों तक सीमित नहीं किया गया।
- source_word: לַחְמָהּ
  choice: उनका भोजन
  rationale: לֶחֶם का शाब्दिक अर्थ रोटी है, पर यहाँ पशुओं के संदर्भ में सामान्य आहार अभिप्रेत है। प्रत्यय को हिन्दी के स्वाभाविक वचन-सामंजस्य के अनुसार 'उनका' किया गया है।
- source_word: לִבְנֵי עֹרֵב
  choice: कौए के बच्चों को
  rationale: पशु-पक्षी के साथ בְּנֵי उनकी संतति या बच्चों को दर्शाता है; यह हिन्दी में स्वाभाविक है और मूल के एकवचन 'कौआ' को भी निकटता से रखता है।
- source_word: אֲשֶׁר יִקְרָאוּ
  choice: जो पुकारते हैं
  rationale: קרא का अर्थ पुकारना है। मूल पाठ यह नहीं बताता कि वे किसे पुकारते हैं, इसलिए कर्म नहीं जोड़ा गया।
theological_decisions:
- issue: क्या यह स्पष्ट किया जाए कि कौए के बच्चे परमेश्वर को पुकारते हैं
  choice: '''जो पुकारते हैं''—पुकार का लक्ष्य अव्यक्त रखा गया'
  alternative: '''जो उसे पुकारते हैं'''
  rationale: इब्रानी पाठ पुकारे जाने वाले को स्पष्ट नहीं करता। अव्यक्तता बनाए रखने से परमेश्वर की देखभाल का संदर्भ बना रहता है, पर पाठ से अधिक बात नहीं जोड़ी जाती।
translation_notes:
  register: आधुनिक, सरल और गरिमापूर्ण मानक हिन्दी। पद्य की समानांतर संरचना बनाए रखी गई है; किसी पंथ-विशेष की व्याख्या नहीं जोड़ी गई।
