  text: Sing to Yahweh with thanksgiving[b][a]; make melody to our God with the lyre.
translation:
  language: hi
  text: धन्यवाद के साथ याहवे का स्तुति-गान करो[a]; वीणा के साथ हमारे परमेश्वर का स्तुति-गान करो[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “धन्यवाद के साथ याहवे को उत्तर दो।” इब्रानी क्रिया का अर्थ “उत्तर देना” हो सकता है, पर यहाँ संभवतः प्रत्युत्तर में गीत गाने का भाव है।
    reason: lexical_alternative
  - marker: b
    text: “वीणा” के लिए आया इब्रानी शब्द प्राचीन तार वाले वाद्य, अधिक ठीक रूप से ‘लायर’, को दर्शाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: עֱנוּ
  choice: गीत गाओ
  rationale: ענה का मूल अर्थ ‘उत्तर देना’ है, पर यहाँ समानांतर זַמְּרוּ और आराधना के संदर्भ में यह प्रत्युत्तर में या स्वर मिलाकर गाने का भाव देता है। स्वाभाविक हिन्दी में ‘गीत गाओ’ यह सांगीतिक अर्थ स्पष्ट करता है।
- source_word: לַיהוָה
  choice: याहवे के लिए
  rationale: ל प्रशंसा की दिशा अथवा संबोधन बताता है; יְהוָה को उसके व्यक्तिगत वाचा-नाम ‘याहवे’ के रूप में रखा गया है।
- source_word: בְּתוֹדָה
  choice: धन्यवाद का
  rationale: תּוֹדָה धन्यवाद और कृतज्ञतापूर्ण स्तुति को व्यक्त करता है। इस पद में गीत की प्रकृति बताने के लिए ‘धन्यवाद का’ सहज हिन्दी है।
- source_word: זַמְּרוּ
  choice: गुणगान करो
  rationale: זמר में संगीत के साथ स्तुति गाने या धुन छेड़ने का भाव है। ‘गुणगान करो’ पहले खंड के ‘गीत गाओ’ की अनावश्यक पुनरावृत्ति से बचते हुए स्तुति का आशय बनाए रखता है।
- source_word: לֵאלֹהֵינוּ
  choice: हमारे परमेश्वर का
  rationale: मूल में ל परमेश्वर को संगीतपूर्ण स्तुति का लक्ष्य बनाता है। हिन्दी मुहावरे में ‘हमारे परमेश्वर का गुणगान’ वही संबंध स्वाभाविक रूप से व्यक्त करता है और सामुदायिक ‘हमारे’ को सुरक्षित रखता है।
- source_word: בְכִנּוֹר
  choice: वीणा बजाकर
  rationale: כִּנּוֹר प्राचीन तार वाला वाद्य था, जिसे अधिक ठीक रूप से lyre कहा जाता है। ‘वीणा’ हिन्दी पाठक के लिए निकटतम परिचित पद है; ‘बजाकर’ ב की साधनवाचक भूमिका स्पष्ट करता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में चतुरक्षरीय व्यक्तिगत नाम सीधे आया है। ‘याहवे’ उसका प्रचलित विद्वत्तापूर्ण लिप्यंतरण है और ‘प्रभु’ जैसे पदवीसूचक विकल्प से अलग वाचा-नाम को बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामूहिक आराधना में सहज रखी गई है। ‘वीणा’ परिचित हिन्दी सांगीतिक शब्द है, जबकि पादटिप्पणी प्राचीन वाद्य की अधिक सटीक पहचान बताती है।
