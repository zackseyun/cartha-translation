  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: לֹ֤א בִ/גְבוּרַ֣ת הַ/סּ֣וּס יֶחְפָּ֑ץ לֹֽא בְ/שׁוֹקֵ֖י הָ/אִ֣ישׁ יִרְצֶֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/147/010.yaml
  text: He does not delight in the strength of the horse; he takes no pleasure in the legs of the man.
translation:
  language: hi
  text: वह घोड़े की ताकत से प्रसन्न नहीं होता; न वह मनुष्य की टाँगों से आनंदित होता है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: גְבוּרַת הַסּוּס
  choice: घोड़े की ताकत
  rationale: यह पदबंध घोड़े की शक्ति या पराक्रम को दर्शाता है; सामान्य पाठक के लिए ‘ताकत’ सहज और स्पष्ट है।
- source_word: שׁוֹקֵי הָאִישׁ
  choice: मनुष्य की टाँगों
  rationale: שׁוֹקֵי का शाब्दिक संकेत निचले पैरों/पिंडलियों की ओर है, पर यहाँ मानवीय शारीरिक सामर्थ्य अभिप्रेत है; ‘टाँगों’ से मूल बिंब स्वाभाविक हिन्दी में बना रहता है।
- source_word: יֶחְפָּץ / יִרְצֶה
  choice: प्रसन्न नहीं होता / आनंदित होता है
  rationale: दोनों निकटार्थी क्रियाओं की काव्यात्मक समानांतरता रखते हुए हिन्दी में हल्का शब्द-वैविध्य दिया गया है।
theological_decisions:
- issue: दैवी प्रसन्नता और सैन्य/शारीरिक सामर्थ्य
  choice: पद को सीधे इस रूप में रखा गया है कि परमेश्वर घोड़े की शक्ति या मनुष्य की शारीरिक क्षमता से प्रसन्न नहीं होता।
  alternative: इसे ‘भरोसा नहीं करता’ या ‘महत्त्व नहीं देता’ कहना।
  rationale: मूल क्रियाएँ प्रसन्नता/रुचि को व्यक्त करती हैं, भरोसे या मूल्यांकन को स्पष्ट रूप से नहीं; इसलिए संभावित निहितार्थ को अनुवाद में नहीं जोड़ा गया।
- issue: הָאִישׁ के निश्चित लेख का निर्वाह
  choice: मनुष्य
  alternative: उस मनुष्य / एक मनुष्य
  rationale: यहाँ निश्चित लेख प्रतिनिधिक या जातिवाचक प्रयोग में समझा जा सकता है। हिन्दी में ‘मनुष्य’ स्वाभाविक रूप से मानव शक्ति के सामान्य संदर्भ को व्यक्त करता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; संक्षिप्त, काव्यात्मक और गरिमापूर्ण शैली। मूल के समानांतर दो खंड और शारीरिक शक्ति के दोनों ठोस बिंब सुरक्षित रखे गए हैं।
