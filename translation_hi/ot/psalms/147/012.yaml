base_translation:
  language: en
  yaml_path: translation/ot/psalms/147/012.yaml
  text: Praise Yahweh[a], O Jerusalem; praise your God, O Zion.
translation:
  language: hi
  text: 'हे यरूशलेम, याहवे[a] की स्तुति कर;

    हे सिय्योन, अपने परमेश्वर की प्रशंसा कर।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में परमेश्वर का विशिष्ट नाम יהוה (YHWH) है; इसका उच्चारण सामान्यतः ‘याहवे’ माना जाता है।
    reason: दिव्य नाम के मूल रूप और उसके उच्चारण की ऐतिहासिक अनिश्चितता स्पष्ट करना।
lexical_decisions:
- source_word: שַׁבְּחִי
  choice: स्तुति कर
  rationale: यह स्त्रीलिंग एकवचन आज्ञार्थक रूप है और मानवीकृत यरूशलेम को संबोधित करता है। ‘स्तुति कर’ आज्ञा का बल और काव्यात्मक गरिमा बनाए रखता है।
- source_word: יְרוּשָׁלִַם
  choice: यरूशलेम
  rationale: हिन्दी बाइबल परंपरा में प्रचलित और आसानी से पहचाना जाने वाला व्यक्तिवाचक रूप।
- source_word: אֶת יְהוָה
  choice: याहवे[a]
  rationale: אֶת कर्म-चिह्न है और יְהוָה परमेश्वर का विशिष्ट नाम है। ‘याहवे’ मूल नाम को उपाधि से बदलने के बजाय उसका लिप्यंतरण करता है।
- source_word: הַֽלְלִי
  choice: प्रशंसा कर
  rationale: यह भी स्त्रीलिंग एकवचन आज्ञार्थक रूप है। ‘प्रशंसा कर’ पहले चरण के समानार्थी समानांतर को बनाए रखते हुए हिन्दी में अनावश्यक शब्द-पुनरावृत्ति से बचाता है।
- source_word: אֱלֹהַיִךְ
  choice: अपने परमेश्वर की
  rationale: द्वितीय पुरुष स्त्रीलिंग एकवचन प्रत्यय का संबंध सिय्योन से है। हिन्दी में ‘अपने’ इस संबंध को स्वाभाविक और स्पष्ट बनाता है।
- source_word: צִיּוֹן
  choice: सिय्योन
  rationale: हिन्दी बाइबल परंपरा में प्रचलित नाम; यरूशलेम के समानांतर मानवीकृत नगर-समुदाय को संबोधित करता है।
theological_decisions:
- issue: परमेश्वर के नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में चार अक्षरों वाला विशिष्ट दिव्य नाम सीधे आया है। ‘याहवे’ संभावित प्राचीन उच्चारण का व्यापक रूप से स्वीकृत हिन्दी लिप्यंतरण है और नाम को सामान्य उपाधि ‘प्रभु’ में नहीं बदलता। उच्चारण की ऐतिहासिक अनिश्चितता को पादटिप्पणी में बताया गया है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘हे’ प्रत्यक्ष काव्यात्मक संबोधन को व्यक्त करता है। दोनों पंक्तियों की समानांतर रचना तथा ‘यरूशलेम/सिय्योन’ और ‘स्तुति/प्रशंसा’ का संतुलन सुरक्षित रखा गया है।
