lexical_decisions:
- source_word: מְעוֹדֵד
  choice: ऊपर उठाता है
  rationale: इस कृदन्त का अर्थ मज़बूत करना, सहारा देना या फिर से खड़ा करना हो सकता है। समानांतर पंक्ति के ‘गिरा देता है’ के साथ ऊँच-नीच का विरोध बनाए रखने के लिए ‘ऊपर उठाता है’ चुना गया है।
- source_word: עֲנָוִים
  choice: नम्र लोगों
  rationale: यह शब्द नम्र, दीन या सताए हुए लोगों का बोध करा सकता है। ‘नम्र लोगों’ से दुष्टों के साथ नैतिक-सामाजिक विरोध स्पष्ट रहता है, जबकि मूल अर्थ की पूरी सीमा को संकुचित नहीं किया जाता।
- source_word: יְהוָה
  choice: याहवे
  rationale: मूल पाठ में परमेश्वर का व्यक्तिगत नाम प्रयुक्त है; इसलिए किसी उपाधि से बदलने के बजाय उसका प्रचलित लिप्यंतरण दिया गया है।
- source_word: מַשְׁפִּיל
  choice: गिरा देता है
  rationale: हिफ़ील रूप किसी को नीचा करने या नीचे ले आने का सक्रिय भाव व्यक्त करता है। यह ‘ऊपर उठाता है’ के साथ स्पष्ट विरोध भी बनाता है।
- source_word: רְשָׁעִים
  choice: दुष्टों
  rationale: भजन-साहित्य में यह नैतिक श्रेणी के लिए स्वाभाविक और सटीक हिन्दी शब्द है।
- source_word: עֲדֵי אָרֶץ
  choice: ज़मीन तक
  rationale: इस पदबंध का शाब्दिक चित्र ‘धरती/भूमि तक’ नीचे किए जाने का है। ‘ज़मीन तक’ आधुनिक हिन्दी में स्वाभाविक रहते हुए उस तीव्रता और दृश्यात्मकता को बनाए रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा अथवा ‘यहोवा परमेश्वर’ जैसी पारंपरिक प्रस्तुति
  rationale: पद में चार अक्षरों वाला ईश्वरीय नाम सीधे आया है। ‘याहवे’ उसका लिप्यंतरण है और उसे किसी उपाधि से प्रतिस्थापित नहीं करता।
- issue: עֲנָוִים का नैतिक अथवा सामाजिक अर्थ
  choice: नम्र लोगों
  alternative: दीनों या सताए हुओं
  rationale: इब्रानी शब्द में नम्रता और सामाजिक दीनता दोनों अर्थ-छायाएँ हो सकती हैं। मुख्य पाठ में ‘नम्र’ दुष्टों के साथ विरोध को स्पष्ट करता है; संभावित व्यापक अर्थ को शब्द के संदर्भ और टिप्पणी में खुला रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण काव्यात्मक गद्य रखा गया है। ‘ऊपर उठाता’ और ‘गिरा देता’ मूल की समानांतर विपरीत छवियों को स्पष्ट करते हैं। ‘ज़मीन’ सामान्य पाठक के लिए सहज है, जबकि पादटिप्पणी मूल के ‘धरती तक’ रूप को सुरक्षित रखती है।
