  yaml_path: translation/ot/psalms/147/005.yaml
  text: Great is our Lord[a], and abundant in power; his understanding is beyond number.
translation:
  language: hi
  text: 'महान है हमारा प्रभु,

    और उसकी सामर्थ्य अपार है;

    उसकी समझ का कोई हिसाब नहीं।[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उसकी समझ की कोई गिनती नहीं” अथवा “उसकी समझ अगणित है।”
    reason: lexical_alternative
lexical_decisions:
- source_word: גָּדוֹל
  choice: महान
  rationale: पद के आरम्भ में विधेय विशेषण है। ‘महान है’ इब्रानी शब्दक्रम और स्तुतिपरक बल को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: אֲדוֹנֵינוּ
  choice: हमारा प्रभु
  rationale: אֲדוֹן को ईश्वरीय उपाधि ‘प्रभु’ के रूप में और प्रथम पुरुष बहुवचन प्रत्यय को ‘हमारा’ के रूप में रखा गया है; इसे परमेश्वर के निज नाम के रूप में नहीं प्रस्तुत किया गया।
- source_word: וְרַב
  choice: और ... अपार
  rationale: רַב यहाँ परिमाण या प्रचुरता बताता है। ‘अपार’ सामर्थ्य की अत्यधिक मात्रा को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: כֹּחַ
  choice: सामर्थ्य
  rationale: כֹּחַ क्षमता, शक्ति या बल को दर्शाता है। स्तुति के प्रसंग में ‘सामर्थ्य’ स्वाभाविक और गरिमापूर्ण है।
- source_word: לִתְבוּנָתוֹ
  choice: उसकी समझ
  rationale: תְּבוּנָה का अर्थ समझ, अंतर्दृष्टि या विवेक हो सकता है। ‘समझ’ व्यापक रूप से बोधगम्य है; לְ को אֵין מִסְפָּר के साथ सम्बन्धसूचक मुहावरे का अंग माना गया है।
- source_word: אֵין מִסְפָּר
  choice: का कोई हिसाब नहीं
  rationale: शाब्दिक भाव ‘कोई संख्या नहीं’ है। ‘कोई हिसाब नहीं’ गिनती की मूल छवि बनाए रखते हुए स्वाभाविक हिन्दी में अपरिमेयता व्यक्त करता है।
theological_decisions:
- issue: स्तुति के भजन में ईश्वरीय उपाधि אֲדוֹנֵינוּ का अनुवाद
  choice: हमारा प्रभु
  alternative: हमारा स्वामी
  rationale: मूल में אֲדוֹן के साथ प्रथम पुरुष बहुवचन प्रत्यय है, न कि YHWH निज नाम। ‘हमारा प्रभु’ उपाधि और सम्बन्ध दोनों को सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; संक्षिप्त, काव्यात्मक और गरिमापूर्ण शैली। इब्रानी समानांतरता और आरम्भिक ‘महान है’ का स्तुतिपरक बल रखा गया है।
