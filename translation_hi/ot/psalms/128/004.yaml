  yaml_path: translation/ot/psalms/128/004.yaml
  text: Behold[a], thus shall the man who fears Yahweh be blessed.
translation:
  language: hi
  text: देखो, याहवे का भय मानने वाला पुरुष[a] इसी प्रकार आशीषित होगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में ‘पुरुष’ है; यहाँ पुल्लिंग रूप नीतिवचनात्मक ढंग से उस मनुष्य का प्रतिनिधित्व करता है जिसकी पहचान याहवे का भय मानने से होती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: देखो
  rationale: यह ध्यान खींचने वाला बलयुक्त काव्यात्मक संकेत है; ‘देखो’ आधुनिक हिन्दी में इसकी उद्घोषणात्मक शक्ति को स्वाभाविक रूप से बनाए रखता है।
- source_word: כִי כֵן
  choice: इसी प्रकार
  rationale: यह पदबंध पूर्ववर्णित आशीष की रीति और परिणाम पर बल देता है; ‘इसी प्रकार’ संदर्भ से उसके संबंध को स्पष्ट और संक्षिप्त रखता है।
- source_word: יְבֹרַךְ
  choice: आशीषित होगा
  rationale: ברך का पुअल रूप निष्क्रिय है और आशीष पाने की भावी/नीतिवचनात्मक घोषणा करता है; ‘आशीषित होगा’ निष्क्रियता और घोषणात्मक स्वर दोनों बनाए रखता है।
- source_word: גָּבֶר
  choice: वह पुरुष
  rationale: यह शब्द व्याकरण की दृष्टि से पुल्लिंग है और यहाँ नीतिवचनात्मक प्रतिनिधि अर्थ में प्रयुक्त है; ‘वह पुरुष’ मूल रूप को बनाए रखता है, जबकि व्यापक अनुप्रयोग पादटिप्पणी में स्पष्ट किया गया है।
- source_word: יְרֵא יְהוָה
  choice: जो याहवे का भय मानता है
  rationale: कृदंत उस पुरुष की स्थायी पहचान बताता है। ‘भय मानता है’ भजन और ज्ञान-साहित्य की पारंपरिक वाचा-संबंधी अभिव्यक्ति को ‘श्रद्धा करता है’ जैसे व्याख्यात्मक सरलीकरण के बिना सुरक्षित रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय दिव्य नाम को उपाधि से बदलने के बजाय हिन्दी लिप्यंतरण में प्रस्तुत किया गया है।
theological_decisions:
- issue: दिव्य नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा / प्रभु
  rationale: मूल पाठ में वाचा का व्यक्तिगत दिव्य नाम है; ‘याहवे’ उसे उपाधि में बदले बिना और प्रचलित विद्वत्तापूर्ण उच्चारण के निकट रखते हुए प्रस्तुत करता है।
- issue: גָּבֶר का प्रतिनिधि पुल्लिंग प्रयोग
  choice: वह पुरुष
  alternative: वह व्यक्ति
  rationale: मूल का व्याकरणिक पुल्लिंग सुरक्षित रखा गया है; साथ ही पादटिप्पणी यह बताती है कि यहाँ कथन नीतिवचनात्मक है और इसकी विशेषता याहवे का भय मानना है।
- issue: ‘याहवे का भय’ का अर्थ
  choice: भय मानता है
  alternative: श्रद्धा करता है
  rationale: ‘भय’ मूल ज्ञान-साहित्यिक अभिव्यक्ति की श्रद्धा, आज्ञाकारिता और गंभीर विस्मय के बीच की अर्थगत व्यापकता तथा धार्मिक तनाव को बनाए रखता है; केवल ‘श्रद्धा’ कहना इसे संकुचित कर सकता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और काव्यात्मक है। ‘देखो’ उद्घोषणात्मक बल देता है; ‘आशीषित होगा’ मूल की निष्क्रिय वाणी को सुरक्षित रखता है।
