  yaml_path: translation/ot/psalms/128/000.yaml
  text: A Song of Ascents. Blessed is everyone who fears Yahweh[a], who walks in his ways.
translation:
  language: hi
  text: 'चढ़ाइयों का गीत।


    धन्य[a] है हर वह व्यक्ति जो याहवे का भय मानता है, जो उसके मार्गों पर चलता है।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “सुखी।” इब्रानी शब्द समृद्धि और कुशलता की धन्य अवस्था का भी संकेत कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁיר הַמַּעֲלוֹת
  choice: चढ़ाइयों का गीत
  rationale: इब्रानी पदबंध का बहुवचन और आरोहण का बिंब बनाए रखा गया है; यह तीर्थयात्रा अथवा मंदिर की सीढ़ियों से जुड़े संभावित संदर्भ को किसी एक अर्थ तक सीमित नहीं करता।
- source_word: אַשְׁרֵי
  choice: धन्य
  rationale: यह शब्द ईश्वर की कृपा से जुड़ी भलाई, समृद्ध दशा और सच्चे सुख को व्यक्त कर सकता है; ‘धन्य’ इस व्यापक अर्थ को संक्षेप में बनाए रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चार-अक्षरीय दिव्य नाम को पदवी ‘प्रभु’ से बदलने के बजाय नाम के रूप में लिप्यंतरित किया गया है।
- source_word: יְרֵא
  choice: भय मानता है
  rationale: यहाँ भय में श्रद्धा, आदर और आज्ञाकारिता का भाव सम्मिलित है; प्रचलित हिंदी बाइबलीय अभिव्यक्ति मूल शब्द की गंभीरता बनाए रखती है।
- source_word: הַהֹלֵךְ בִּדְרָכָיו
  choice: जो उसके मार्गों पर चलता है
  rationale: चलने और मार्ग के मूल रूपकों को स्वाभाविक हिंदी में सुरक्षित रखा गया है; ये जीवन-आचरण को सूचित करते हैं।
theological_decisions:
- issue: אַשְׁרֵי में धन्यता और सुख-समृद्धि के बीच अर्थ-तनाव
  choice: मुख्य पाठ में ‘धन्य’
  alternative: ‘सुखी’
  rationale: ‘धन्य’ ईश्वर-संबंधी अनुग्रह और फलती-फूलती जीवन-दशा दोनों की संभावना खुली रखता है, जबकि पादटिप्पणी सहज वैकल्पिक अर्थ बताती है।
- issue: दिव्य नाम יהוה का निरूपण
  choice: ‘याहवे’ के रूप में लिप्यंतरण
  alternative: ‘यहोवा’ अथवा ‘प्रभु’
  rationale: मूल में व्यक्तिगत दिव्य नाम है; उसका लिप्यंतरण नाम और पदवी के बीच का भेद बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। शीर्षक को अलग पंक्ति में रखा गया है। ‘हर वह व्यक्ति’ मूल के समावेशी כָּל का स्वाभाविक हिंदी रूप है; ‘जो ... जो ...’ मूल में भय मानने वाले और मार्गों पर चलने वाले की समान पहचान बनाए रखता है।
