  text: שִׁ֗יר הַֽ/מַּ֫עֲל֥וֹת אַ֭שְׁרֵי כָּל יְרֵ֣א יְהוָ֑ה הַ֝/הֹלֵ֗ךְ בִּ/דְרָכָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/128/001.yaml
  text: A Song of Ascents. Blessed is everyone who fears Yahweh[a], who walks in his ways.
translation:
  language: hi
  text: 'चढ़ाइयों का गीत।


    धन्य[a] है हर वह व्यक्ति जो याहवे का भय मानता है,

    जो उसके मार्गों पर चलता है।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “सुखी है।” इब्रानी אַשְׁרֵי फलने-फूलने, कल्याण या धन्य दशा को व्यक्त कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁיר הַמַּעֲלוֹת
  choice: चढ़ाइयों का गीत
  rationale: यह पदावली भजन-संग्रह के पारंपरिक शीर्षक को दर्शाती है। ‘चढ़ाइयों’ से מַעֲלוֹת का ठोस बहुवचन अर्थ बना रहता है और तीर्थयात्रा जैसी किसी एक ऐतिहासिक व्याख्या को अनिवार्य नहीं किया जाता।
- source_word: אַשְׁרֵי
  choice: धन्य है
  rationale: यह शब्द कल्याण, फलने-फूलने और आशीषित दशा की घोषणात्मक भाषा व्यक्त करता है। ‘धन्य है’ हिंदी में गरिमापूर्ण और स्वाभाविक है तथा ज्ञान-साहित्य की शैली को बनाए रखता है।
- source_word: כָּל יְרֵא
  choice: हर वह व्यक्ति जो ... भय मानता है
  rationale: इब्रानी में पुल्लिंग एकवचन कृदंत प्रतिनिधिक और सर्वसमावेशी अर्थ रखता है। यह रूप उस वितरणात्मक अर्थ को स्वाभाविक हिंदी में व्यक्त करता है, बिना इसे केवल पुरुषों तक सीमित किए।
- source_word: יְרֵא יְהוָה
  choice: जो याहवे का भय मानता है
  rationale: ירא यहाँ परमेश्वर के प्रति श्रद्धापूर्ण भय का मानक ज्ञान-साहित्यिक भाव रखता है। ‘भय मानता है’ इस धार्मिक और नैतिक गंभीरता को केवल ‘आदर करता है’ कहकर हल्का नहीं करता।
- source_word: יְהוָה
  choice: याहवे
  rationale: यह चतुरक्षरीय व्यक्तिगत ईश्वरीय नाम का हिंदी लिप्यंतरण है; इसे किसी उपाधि या ‘यहोवा’ जैसे वैकल्पिक उच्चारण से नहीं बदला गया।
- source_word: הַהֹלֵךְ
  choice: जो ... चलता है
  rationale: ‘चलता है’ आचरण के लिए प्रयुक्त इब्रानी नैतिक रूपक को सुरक्षित रखता है; ‘जीवन बिताता है’ उसका अर्थ खोल देता, पर मूल बिंब खो देता।
- source_word: בִּדְרָכָיו
  choice: उसके मार्गों पर
  rationale: बहुवचन דֶּרֶךְ नैतिक चाल-चलन के मार्गों को सूचित करता है। हिंदी में ‘मार्गों पर चलना’ स्वाभाविक है और मूल रूपक तथा याहवे की ओर संकेत करते सर्वनाम दोनों को बनाए रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा / प्रभु
  rationale: मूल पाठ में उपाधि नहीं, चतुरक्षरीय व्यक्तिगत नाम है। ‘याहवे’ उसे नाम के रूप में सुरक्षित रखता है।
- issue: כָּל יְרֵא में लिंग और प्रतिनिधिक एकवचन
  choice: हर वह व्यक्ति जो ... भय मानता है
  alternative: हर पुरुष जो ... भय मानता है / वे सभी जो ... भय मानते हैं
  rationale: इब्रानी का व्याकरणिक पुल्लिंग एकवचन सामान्य प्रतिनिधिक अर्थ रखता है। चुना हुआ पाठ समावेशी आशय और एकवचन संरचना दोनों को यथासंभव बनाए रखता है।
- issue: אַשְׁרֵי का भाव
  choice: धन्य है
  alternative: सुखी है
  rationale: दोनों अर्थ संभव हैं। मुख्य पाठ में ‘धन्य’ ज्ञान-साहित्य की कल्याणपूर्ण, अनुगृहीत दशा की गंभीरता को रखता है, जबकि पादटिप्पणी वास्तविक शाब्दिक विकल्प को सुरक्षित करती है।
translation_notes:
  register: आधुनिक मानक हिंदी में सरल किंतु गरिमापूर्ण काव्यात्मक शैली रखी गई है। पंक्ति-विभाजन पद के दो समानांतर चरित्र-वर्णनों को स्पष्ट करता है; नैतिक ‘चलने’ का इब्रानी रूपक सुरक्षित है।
