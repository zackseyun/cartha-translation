base_translation:
  language: en
  yaml_path: translation/ot/psalms/128/003.yaml
  text: Your wife will be like a fruitful vine in the recesses of your house[b][a]; your children will be like olive shoots around your table.
translation:
  language: hi
  text: तेरी पत्नी तेरे घर के भीतरी भागों में फलवती अंगूर की बेल के समान होगी; तेरे बेटे[a] तेरी मेज़ के चारों ओर जैतून के अंकुरों के समान होंगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “तेरे बच्चे,” यदि पुल्लिंग शब्द को समस्त संतान के प्रतिनिधि अर्थ में समझा जाए।
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶשְׁתְּךָ
  choice: तेरी पत्नी
  rationale: यह वैवाहिक संदर्भ में संबोधित व्यक्ति की पत्नी को सूचित करता है; आधुनिक हिन्दी में ‘पत्नी’ स्वाभाविक और सटीक है।
- source_word: כְּגֶפֶן פֹּרִיָּה
  choice: फलवती दाखलता के समान
  rationale: तुलना तथा फल उत्पन्न करने की कृषि-छवि दोनों सुरक्षित रहती हैं; ‘फलवती’ आशीष और उर्वरता के भाव को भी बनाए रखता है।
- source_word: בְּיַרְכְּתֵי בֵיתֶךָ
  choice: तेरे घर के भीतरी भागों में
  rationale: יַרְכְּתֵי घर के अंदरूनी अथवा दूरस्थ भागों को दर्शाता है; यह अनुवाद स्थानगत बारीकी को अस्पष्ट किए बिना सहज हिन्दी देता है।
- source_word: בָּנֶיךָ
  choice: तेरे बेटे
  rationale: इब्रानी संज्ञा पुल्लिंग बहुवचन है और यहाँ सीधे रूप में ‘बेटे’ अर्थ देती है; व्यापक रूप से संतान समझे जाने की संभावना पादटिप्पणी में रखी गई है।
- source_word: כִּשְׁתִלֵי זֵיתִים
  choice: जैतून के पौधों के समान
  rationale: שְׁתִלֵי लगाए गए नए पौधों या कलमों को सूचित करता है; ‘पौधे’ हिन्दी में बढ़ती हुई युवा संतान की छवि स्वाभाविक रूप से व्यक्त करता है।
- source_word: סָבִיב לְשֻׁלְחָנֶךָ
  choice: तेरी मेज़ के चारों ओर
  rationale: स्थानगत अर्थ को सीधे और स्वाभाविक हिन्दी में व्यक्त करता है तथा पारिवारिक भोजन की छवि बनाए रखता है।
theological_decisions:
- issue: संतान के लिए लिंग-विशिष्ट शब्द
  choice: तेरे बेटे
  alternative: तेरे बच्चे
  rationale: मूल पाठ में पुल्लिंग बहुवचन ‘बेटे’ है। उसे मुख्य पाठ में सुरक्षित रखा गया है, जबकि सामूहिक या प्रतिनिधिक अर्थ में समस्त संतान की संभावना पादटिप्पणी में दी गई है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध हिन्दी। भजन के एकवचन अनौपचारिक संबोधन के अनुरूप ‘तेरी/तेरे’ रखा गया है। ‘दाखलता’ बाइबलीय कृषि-छवि को स्पष्ट रूप से सुरक्षित रखता है।
