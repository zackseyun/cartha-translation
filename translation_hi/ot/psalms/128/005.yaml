id: PSA.128.5
reference: Psalms 128:5
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: יְבָרֶכְ/ךָ֥ יְהוָ֗ה מִ/צִּ֫יּ֥וֹן וּ֭/רְאֵה בְּ/ט֣וּב יְרוּשָׁלִָ֑ם כֹּ֝֗ל יְמֵ֣י חַיֶּֽי/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/128/005.yaml
  text: May Yahweh bless you from Zion[a], and may you see the prosperity of Jerusalem all the days of your life.
translation:
  language: hi
  text: याहवे तुझे सिय्योन से आशीष दे, और तू अपने जीवन के सभी दिनों में यरूशलेम की समृद्धि[a] देखे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “यरूशलेम की भलाई” अथवा “यरूशलेम का कुशल-क्षेम।”
    reason: lexical_alternative
lexical_decisions:
- source_word: יְבָרֶכְךָ
  choice: तुझे ... आशीष दे
  rationale: इस आशीर्वादात्मक संदर्भ में पिएल अपूर्ण रूप को कामनासूचक अर्थ में लिया गया है; हिन्दी में यह रचना उस मंगलकामना को स्वाभाविक रूप से व्यक्त करती है।
- source_word: יְהוָה
  choice: याहवे
  rationale: चतुराक्षरीय परमेश्वर-नाम को किसी उपाधि से बदलने के बजाय हिन्दी में प्रचलित निकट लिप्यंतरण द्वारा सुरक्षित रखा गया है।
- source_word: מִצִּיּוֹן
  choice: सिय्योन से
  rationale: מִן स्रोत या उद्गम दर्शाता है; यह अनुवाद आशीष के सिय्योन से आने की छवि को बनाए रखता है।
- source_word: וּרְאֵה
  choice: और तू ... देखे
  rationale: आशीर्वाद के क्रम में आया आज्ञार्थक रूप यहाँ आगे की मंगलकामना के रूप में समझा गया है; हिन्दी संभावनार्थक रचना समान भाव देती है।
- source_word: בְּטוּב
  choice: की समृद्धि
  rationale: טוּב का अर्थ भलाई, कल्याण या समृद्धि हो सकता है। यरूशलेम के सामुदायिक सुख-कल्याण के संदर्भ में 'समृद्धि' स्वाभाविक है, जबकि अन्य वास्तविक अर्थों को पादटिप्पणी में रखा गया है।
- source_word: יְרוּשָׁלִָם
  choice: यरूशलेम
  rationale: स्थान-नाम का मानक हिन्दी रूप।
- source_word: כֹּל יְמֵי חַיֶּיךָ
  choice: अपने जीवन के सभी दिनों में
  rationale: मूल इब्रानी मुहावरे के 'सभी', 'दिन' और 'तेरे जीवन' घटकों को स्पष्ट और स्वाभाविक हिन्दी में सुरक्षित रखता है।
theological_decisions:
- issue: परमेश्वर-नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा अथवा 'प्रभु'
  rationale: पद में व्यक्तिगत वाचा-नाम सीधे उपस्थित है; उसे उपाधि से प्रतिस्थापित न करके लिप्यंतरित किया गया है।
- issue: सिय्योन से आशीष मिलने का आशय
  choice: सिय्योन को आशीष के स्रोत या उद्गम के रूप में बिना विस्तार के बनाए रखना
  alternative: मुख्य पाठ में सिय्योन को मन्दिर या मसीही केंद्र के रूप में स्पष्ट करना
  rationale: पद सिय्योन को आशीष से और यरूशलेम को कल्याण से जोड़ता है, पर यहाँ उससे अधिक विशिष्ट धर्मवैज्ञानिक व्याख्या नहीं करता।
- issue: טוּב का अर्थ
  choice: समृद्धि
  alternative: भलाई अथवा कुशल-क्षेम
  rationale: शब्द में भलाई, कल्याण और समृद्धि की अर्थ-व्याप्ति है। मुख्य पाठ के लिए संदर्भानुकूल 'समृद्धि' चुना गया है और वास्तविक अस्पष्टता पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सहज आशीर्वादात्मक स्वर रखा गया है। एकवचन पुल्लिंग संबोधन को 'तुझे/तू' से व्यक्त किया गया है; यह निकट और प्रत्यक्ष है, अपमानसूचक नहीं।
