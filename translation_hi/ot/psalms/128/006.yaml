  text: May you see your children's children[b][a]. Peace be upon Israel.
translation:
  language: hi
  text: तुम अपने बच्चों के बच्चे[a] देखो। इस्राएल पर शांति[b] हो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अधिक शाब्दिक रूप में, “तुम्हारे पुत्रों के लिए पुत्र”—अर्थात “नाती-पोते” या “तुम्हारे बच्चों के बच्चे।”
    reason: lexical_alternative
  - marker: b
    text: “शांति” इब्रानी शब्द शालोम का अनुवाद है; इसमें कुशलता, संपूर्णता और फलना-फूलना भी शामिल हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/רְאֵה
  choice: तुम ... देखो
  rationale: यह क़ाल आज्ञार्थक रूप प्रसंग में आशीर्वाद या मंगलकामना का भाव रखता है। हिंदी में “तुम ... देखो” उस कामना को स्वाभाविक रूप से व्यक्त करता है; इसे केवल भविष्यवाणी बना देना उचित नहीं होगा।
- source_word: בָנִים
  choice: बच्चे
  rationale: शाब्दिक अर्थ “पुत्र” है, पर अगले पदबंध के साथ यह वंशजों के लिए प्रयुक्त पारिवारिक मुहावरा है। “बच्चे” हिंदी में इसका व्यापक और स्वाभाविक अर्थ देता है।
- source_word: לְ/בָנֶי/ךָ
  choice: अपने बच्चों के
  rationale: בָנִים לְבָנֶיךָ का अर्थ शाब्दिक रूप से “तुम्हारे पुत्रों के लिए/को पुत्र” और मुहावरे के रूप में “तुम्हारे बच्चों के बच्चे,” अर्थात नाती-पोते है। हिंदी में संबंधसूचक “के” सहज है।
- source_word: שָׁלוֹם
  choice: शांति
  rationale: “शांति” सीधा और परंपरागत हिंदी प्रतिशब्द है, जबकि इब्रानी शालोम में कुशलता, संपूर्णता और फलना-फूलना भी समाहित हो सकते हैं; इस व्यापकता को पादटिप्पणी में स्पष्ट किया गया है।
- source_word: עַל
  choice: पर
  rationale: शांति के इस आशीर्वचन में “पर” इब्रानी संबंध को संक्षिप्त और स्वाभाविक हिंदी में बनाए रखता है।
- source_word: יִשְׂרָאֵל
  choice: इस्राएल
  rationale: व्यक्तिवाचक नाम का मानक हिंदी रूप।
theological_decisions:
- issue: अंतिम आशीर्वचन का दायरा
  choice: “इस्राएल” को भजन के प्रत्यक्ष अर्थ के अनुसार ज्यों का त्यों रखा गया है।
  alternative: इसे सामान्य उपासक समुदाय या प्रतिरूपात्मक रूप से कलीसिया के अर्थ में विस्तृत करना।
  rationale: इब्रानी पाठ स्पष्ट रूप से इस्राएल कहता है। अनुवाद में बाद की धर्मवैज्ञानिक पहचान को जोड़ने के बजाय ऐतिहासिक-वाचाई संदर्भ सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। एकवचन पुल्लिंग संबोधन को हिंदी में स्वाभाविक “तुम” से व्यक्त किया गया है। पहले वाक्य की आज्ञार्थक रचना को प्रसंगगत मंगलकामना के रूप में समझा जाना चाहिए।
