  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिंदी। भजन की एकवचन संबोधन-शैली बनाए रखने के लिए ‘तू’ का प्रयोग किया गया है; मूल की ठोस छवि को यथासंभव सुरक्षित रखा गया है।
