lexical_decisions:
- source_word: יְגִיעַ כַּפֶּיךָ
  choice: अपने हाथों की मेहनत
  rationale: 'इब्रानी की ठोस अभिव्यक्ति को बनाए रखता है: व्यक्ति अपने परिश्रम से प्राप्त उपज का उपभोग करता है। हिंदी में ‘मेहनत खाना’ कुछ असामान्य है, पर काव्यात्मक संदर्भ में बोधगम्य है और मूल रूपक को सुरक्षित रखता है।'
- source_word: כִּי
  choice: क्योंकि
  rationale: संदर्भ में यह पिछले पद में वर्णित धन्य दशा का आधार या परिणाम स्पष्ट करता है; इसलिए कारणसूचक अर्थ रखा गया है।
- source_word: תֹאכֵל
  choice: तू ... खाएगा
  rationale: अपूर्ण क्रिया को संदर्भानुसार अपेक्षित भावी परिणाम के रूप में अनूदित किया गया है और खाने की ठोस छवि सुरक्षित रखी गई है।
- source_word: אַשְׁרֶיךָ
  choice: तू धन्य है
  rationale: यह बुद्धि-साहित्य की धन्यता-सूचक अभिव्यक्ति है; ‘धन्य’ केवल भावनात्मक प्रसन्नता से अधिक व्यापक कल्याण का संकेत देता है।
- source_word: וְטוֹב לָךְ
  choice: तेरा भला होगा
  rationale: यह सहज आधुनिक हिंदी में व्यक्ति के कल्याण और अनुकूल दशा को व्यक्त करता है।
theological_decisions:
- issue: बुद्धि-साहित्य में धन्यता-सूचक भाषा
  choice: तू धन्य है
  alternative: तू सुखी है / तू भाग्यवान है
  rationale: ‘धन्य’ मूल अभिव्यक्ति के फलते-फूलते कल्याण और परमेश्वर-संबंधी संदर्भ को बनाए रखता है, जबकि इसे केवल मनोदशा या संयोगजन्य भाग्य तक सीमित नहीं करता।
