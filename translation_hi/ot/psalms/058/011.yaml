base_translation:
  language: en
  yaml_path: translation/ot/psalms/058/011.yaml
  text: And people will say[a], “Surely there is fruit for the righteous[b]; surely there is a God who judges on the earth.”
translation:
  language: hi
  text: तब लोग कहेंगे, “निश्चय ही धर्मी के लिए फल है; निश्चय ही पृथ्वी पर न्याय करनेवाला परमेश्वर[a] है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में “न्याय करनेवाला” के लिए बहुवचन कृदंत है। इसे सामान्यतः एक सच्चे परमेश्वर के संदर्भ में “न्याय करनेवाला परमेश्वर” समझा जाता है; एक कम संभावित अनुवाद है, “पृथ्वी पर न्याय करनेवाले देवता हैं।”
    reason: alternative_reading
lexical_decisions:
- source_word: וְיֹאמַר אָדָם
  choice: तब लोग कहेंगे
  rationale: वाव-संयुक्त अपूर्ण क्रिया को पिछले न्याय-दृश्य के परिणामस्वरूप भविष्यकाल में लिया गया है। אָדָם यहाँ समस्त मनुष्यों के लिए प्रयुक्त एकवचन है; आधुनिक हिन्दी में ‘लोग’ इसका स्वाभाविक सामान्य-बोधक रूप है।
- source_word: אַךְ
  choice: निश्चय
  rationale: दोनों स्थानों पर यह प्रतिबंध नहीं, बल्कि दृढ़ पुष्टि व्यक्त करता है।
- source_word: פְּרִי לַצַּדִּיק
  choice: धर्मी के लिए फल है
  rationale: ‘फल’ के मूल रूपक को बनाए रखा गया है; प्रसंग में इसका आशय धर्मी को मिलनेवाले परिणाम या प्रतिफल से है।
- source_word: אֱלֹהִים שֹׁפְטִים
  choice: न्याय करनेवाला परमेश्वर
  rationale: אֱלֹהִים को एक सच्चे परमेश्वर के रूप में लिया गया है। बहुवचन कृदंत की असामान्यता को पादटिप्पणी में सुरक्षित रखते हुए मुख्य पाठ में स्वाभाविक एकवचन हिन्दी रखी गई है।
- source_word: בָּאָרֶץ
  choice: पृथ्वी पर
  rationale: भजन का व्यापक नैतिक और न्यायिक संदर्भ ‘देश में’ की अपेक्षा ‘पृथ्वी पर’ का समर्थन करता है।
theological_decisions:
- issue: אֱלֹהִים שֹׁפְטִים को एकवचन मानें या बहुवचन
  choice: 'एकवचन: ‘न्याय करनेवाला परमेश्वर’'
  alternative: 'बहुवचन: ‘न्याय करनेवाले देवता’'
  rationale: पद का चरमबिंदु संसार में एक सच्चे परमेश्वर के न्याय की स्वीकृति है। फिर भी इब्रानी कृदंत बहुवचन है, इसलिए वास्तविक व्याकरणिक अस्पष्टता को पादटिप्पणी में बताया गया है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘फल’ का काव्यात्मक रूपक जानबूझकर सुरक्षित है; ‘प्रतिफल’ कहकर उसका अर्थ सीमित नहीं किया गया।
