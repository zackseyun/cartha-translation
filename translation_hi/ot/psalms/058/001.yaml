lexical_decisions:
- source_word: הַאֻמְנָם
  choice: क्या तुम सचमुच
  rationale: प्रश्नवाचक कण और बलसूचक भाव को स्वाभाविक हिन्दी में रखता है तथा भजनकार की चुनौतीपूर्ण विडंबना बनाए रखता है।
- source_word: אֵלֶם
  choice: मौन रहकर
  rationale: मसोरेटिक स्वरांकन ‘मौनता/गूंगापन’ की ओर संकेत करता है। क्रियाविशेषण रूप हिन्दी में अगले पद ‘बात करते हो’ के साथ जानबूझकर उपस्थित विरोधाभास को स्पष्ट और स्वाभाविक रखता है।
- source_word: צֶדֶק
  choice: न्याय
  rationale: यहाँ शब्द नैतिक और न्यायिक सहीपन को व्यक्त करता है। ‘न्याय की बात करना’ आधुनिक हिन्दी में स्वाभाविक है और समानांतर पंक्ति के न्यायिक संदर्भ से मेल खाता है।
- source_word: תְּדַבֵּרוּן
  choice: बात करते हो
  rationale: दבר के सामान्य अर्थ ‘बोलना’ को सहज हिन्दी में व्यक्त करता है; ‘न्याय की बात करना’ इस संदर्भ में ‘न्याय बोलना’ से अधिक स्वाभाविक है।
- source_word: מֵישָׁרִים
  choice: निष्पक्षता से
  rationale: शब्द न्याय में सीधेपन, समता और खराई का भाव देता है। न्याय करने के संदर्भ में ‘निष्पक्षता से’ यही कार्यात्मक अर्थ स्पष्ट करता है।
- source_word: תִּשְׁפְּטוּ
  choice: न्याय करते हो
  rationale: क्रिया का यहाँ न्यायिक अर्थ है; यह संक्षिप्त और संदर्भानुकूल हिन्दी है।
- source_word: בְּנֵי אָדָם
  choice: हे मनुष्यो
  rationale: शाब्दिक रूप ‘मनुष्य के पुत्रो’ है, पर यह सम्बोधन नश्वर मनुष्यों के लिए प्रयुक्त इब्रानी मुहावरा है। ‘हे मनुष्यो’ सम्बोधन और अर्थ दोनों को स्वाभाविक आधुनिक हिन्दी में रखता है।
theological_decisions:
- issue: कठिन शब्द אֵלֶם की व्याख्या
  choice: मुख्य पाठ में मसोरेटिक स्वरांकन के अनुसार ‘मौन रहकर’
  alternative: ‘हे सामर्थी जनो’ अथवा ‘हे देवो’ के रूप में सम्बोधन
  rationale: प्राप्त मसोरेटिक पाठ मौनता से संबंधित अर्थ का समर्थन करता है और एक तीखा आलंकारिक प्रश्न बनाता है। वैकल्पिक पठन पुराना और अर्थ की दृष्टि से महत्त्वपूर्ण है, इसलिए उसे दबाने के बजाय पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। दोनों प्रश्नों की आरोपात्मक, आलंकारिक धार सुरक्षित है। ‘मौन रहकर न्याय की बात’ की असामान्य अभिव्यक्ति मूल पाठ की वास्तविक कठिनाई और विडंबना को जानबूझकर बनाए रखती है।
