  footnotes:
  - marker: a
    text: 'इब्रानी शब्द אֵלֶם कठिन है। मसोरेटिक पाठ में इसका अर्थ ‘मौन’ या ‘गूंगापन’ है। कुछ व्याख्याकार इसे अलग स्वरांकन या पाठ-संशोधन के आधार पर ‘हे सामर्थी जनो’ अथवा ‘हे देवताओ’ समझते हैं: “हे सामर्थी जनो, क्या तुम सचमुच न्याय की बात करते हो?”'
