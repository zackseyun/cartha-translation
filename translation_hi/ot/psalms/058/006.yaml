  text: God[a], break their teeth in their mouths; shatter the fangs of the young lions[b], O Yahweh.
translation:
  language: hi
  text: 'हे परमेश्वर, उनके मुँह के दाँत तोड़ दे;

    हे याहवे[b], जवान सिंहों के नुकीले दाँत[a] चकनाचूर कर दे।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘जबड़े’ अथवा ‘जबड़े के दाँत’। इब्रानी शब्द बड़े, हिंसक दाँतों या जबड़े के लिए प्रयुक्त हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में יהוה (YHWH), परमेश्वर का व्यक्तिगत नाम।
    reason: source_term
lexical_decisions:
- source_word: אֱלֹהִים
  choice: हे परमेश्वर
  rationale: यहाँ संज्ञा सीधे संबोधन के रूप में प्रयुक्त है। ‘हे परमेश्वर’ आधुनिक हिन्दी में प्रार्थनापूर्ण संबोधन को स्वाभाविक और स्पष्ट बनाता है।
- source_word: הֲרָס
  choice: तोड़ दे
  rationale: הרס का मूल भाव गिराना या ढहा देना है; दाँतों के संदर्भ में ‘तोड़ दे’ सबसे स्वाभाविक और सजीव हिन्दी है।
- source_word: שִׁנֵּימוֹ
  choice: उनके ... दाँत
  rationale: बहुवचन संज्ञा पर तृतीय पुरुष बहुवचन प्रत्यय का सीधा अर्थ ‘उनके दाँत’ है।
- source_word: בְּפִימוֹ
  choice: उनके मुँह के
  rationale: ב यहाँ दाँतों को उनके मुँह में स्थित बताता है। हिन्दी में ‘उनके मुँह के दाँत’ उसी चित्र को अधिक सहज ढंग से व्यक्त करता है।
- source_word: מַלְתְּעוֹת
  choice: दाढ़ें
  rationale: यह शब्द काटने-कुचलने वाले बड़े दाँतों अथवा जबड़े के दाँतों को सूचित करता है। जवान सिंहों के संदर्भ में ‘दाढ़ें’ हिंसक सामर्थ्य के चित्र को बनाए रखता है, यद्यपि ‘जबड़े’ भी संभव है।
- source_word: כְּפִירִים
  choice: जवान सिंहों
  rationale: כפירים सामान्यतः छोटे शावकों के बजाय पूर्ण बल के निकट पहुँचे जवान सिंहों को दर्शाता है।
- source_word: נְתֹץ
  choice: चकनाचूर कर दे
  rationale: נתץ तोड़ गिराने, ध्वस्त करने या तोड़ डालने की प्रबल क्रिया है। ‘चकनाचूर कर दे’ काव्यात्मक समानांतरता में उसकी तीव्रता को बनाए रखता है, बिना दाँतों को निकाल डालने का अतिरिक्त अर्थ जोड़े।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम יהוה को किसी उपाधि से बदलने के बजाय हिन्दी लिप्यंतरण ‘याहवे’ से प्रस्तुत किया गया है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: याहवे
  alternative: प्रभु / यहोवा
  rationale: मूल पाठ में व्यक्तिगत वाचा-नाम स्पष्ट रूप से उपस्थित है; ‘याहवे’ उसे उपाधि से प्रतिस्थापित किए बिना निकटतम प्रचलित लिप्यंतरण में रखता है।
- issue: शत्रुओं के विरुद्ध हिंसक प्रार्थना-चित्र
  choice: दाँत तोड़ने और दाढ़ें चकनाचूर करने की ठोस भाषा बनाए रखना
  alternative: उनकी शक्ति नष्ट कर दे
  rationale: मूल कविता शत्रुओं की हिंसक शक्ति को सिंहों के दाँतों के मूर्त चित्र द्वारा व्यक्त करती है। इसे अमूर्त या नरम करने से भजन की तीव्रता और रूपक दोनों घट जाते।
translation_notes:
  register: भाषा आधुनिक, प्रार्थनापूर्ण और काव्यात्मक रखी गई है। ‘तोड़ दे’ तथा ‘चकनाचूर कर दे’ मूल समानांतरता और कठोर शाप-प्रार्थना को सुरक्षित रखते हैं; संबोधन के लिए ‘हे’ का प्रयोग हिन्दी में स्पष्टता और गरिमा देता है।
