  text: Even in your heart you work injustice[b][a]; on the earth your hands weigh out violence.
translation:
  language: hi
  text: हाँ, तुम मन ही मन अन्याय करते हो; धरती पर तुम्हारे हाथ हिंसा तौलते हैं।[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘धरती पर’ का अनुवाद ‘देश में’ भी हो सकता है।
