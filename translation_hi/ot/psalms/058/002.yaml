    text: ‘तौलते हैं’ का अनुवाद ‘नापते हैं’ या ‘मापते हैं’ भी हो सकता है।
    reason: lexical_alternative
  revision_rationale: ‘हाँ’ אַף के आरोपात्मक, बल देने वाले कार्य को व्यक्त करता है, बिना उसे निषेध बनाने के। अंतिम पंक्ति में ‘तौलते हैं’ मूल के मापने/तौलने के रूपक को बनाए रखता है और ‘तुम्हारे हाथ’ की ठोस छवि भी सुरक्षित रखता है. अलग footnote anchors lexical alternatives को स्पष्ट करते हैं.
