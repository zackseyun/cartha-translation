  verdict: revise
  source_fidelity: The opening אַף is emphatic ('indeed/even'), not a negation. Rendering it as 'नहीं' reverses its force. The final verb retains a weighing/measuring image; 'तौलकर बाँटते हैं' adds 'distribute' beyond what is explicit, and the draft also shifts the second-person plural address to third person ('बाँटते हैं').
  naturalness: 'The revised wording is natural, dignified modern Hindi while preserving the psalm''s compact poetic parallelism. ''तुम्हारे हाथ हिंसा तौलते हो'' would be ungrammatical, so the hands are retained as the grammatical subject: ''तुम्हारे हाथ हिंसा तौलते हैं।'''
  terminology: ‘अन्याय’ appropriately renders עוֹלֹת, and ‘हिंसा’ directly renders חֲמָס. ‘मन ही मन’ naturally communicates the inward sense of בְּלֵב. ‘धरती’ is suitable for בָּאָרֶץ, with ‘देश’ noted as a possible alternative.
  issues:
  - severity: high
    issue: The emphatic particle אַף is translated as ‘नहीं’.
    rationale: אַף here intensifies the accusation ('indeed/even'); it does not negate it. ‘नहीं’ materially changes the source's rhetorical force.
  - severity: medium
    issue: The final clause changes the addressee's person and expands the verb.
    rationale: The Hebrew addresses ‘you’ in the plural. The draft's ‘बाँटते हैं’ is third person, while ‘बाँटकर’ introduces an explicit distribution action not stated by תְּפַלֵּסוּן. The primary rendering should preserve the weighing/measuring image.
  - severity: low
    issue: The single footnote combines alternatives for two separate source expressions.
    rationale: Separate anchors make clear which alternative belongs to ‘धरती पर’ and which belongs to ‘तौलते हैं’.
  revised_text: हाँ, तुम मन ही मन अन्याय करते हो; धरती पर तुम्हारे हाथ हिंसा तौलते हैं।[a][b]
  revised_footnotes:
