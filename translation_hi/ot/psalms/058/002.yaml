    reason: lexical_alternative
lexical_decisions:
- source_word: אַף
  choice: नहीं
  rationale: यहाँ אַף पिछले पद के प्रश्न का तीखा प्रतिवाद करते हुए आरोप को आगे बढ़ाता है; स्वाभाविक हिन्दी में ‘नहीं’ उस वाक्यगत बल को व्यक्त करता है।
- source_word: בְּלֵב
  choice: मन ही मन
  rationale: ‘हृदय में’ के शाब्दिक अर्थ को स्वाभाविक आधुनिक हिन्दी में आंतरिक मंशा और विचार के रूप में व्यक्त करता है।
- source_word: עוֹלֹת
  choice: अन्याय
  rationale: न्यायिक प्रसंग में עול नैतिक टेढ़ेपन या अन्याय को दर्शाता है; हिन्दी में भाववाचक एकवचन सहज है।
- source_word: תִּפְעָלוּן
  choice: करते हो
  rationale: פעל के सक्रिय अर्थ को सरल और सीधी हिन्दी में रखता है।
- source_word: בָּאָרֶץ
  choice: धरती पर
  rationale: בארץ का व्यापक अर्थ ‘धरती पर’ लिया गया है; ‘देश में’ भी व्याकरणतः संभव है।
- source_word: חֲמַס
  choice: हिंसा
  rationale: חמס हिंसक अन्याय या उत्पीड़न को दर्शाता है; ‘हिंसा’ इसका सीधा और स्थापित हिन्दी प्रतिशब्द है।
- source_word: יְדֵיכֶם
  choice: तुम्हारे हाथ
  rationale: कर्म और कर्तृत्व की ठोस मूल छवि को यथावत रखता है।
- source_word: תְּפַלֵּסוּן
  choice: तौलकर बाँटते हैं
  rationale: פלס के तौलने/नापने के रूपक और हिंसा वितरित करने के आशय, दोनों को स्वाभाविक हिन्दी में सुरक्षित रखता है।
theological_decisions:
- issue: न्यायिक प्रसंग में अंतिम क्रिया का रूपक
  choice: ‘तौलकर बाँटते हैं’ द्वारा मापे हुए वितरण और भ्रष्ट न्याय की विडंबना को बनाए रखना
  alternative: ‘हिंसा नापते हो’ या ‘हिंसा फैलाते हो’
  rationale: मूल क्रिया तौलने या नापने की छवि रखती है। केवल ‘करते’ या ‘फैलाते’ कहने से भ्रष्ट निर्णायकों द्वारा न्याय के स्थान पर हिंसा बाँटने की विडंबना मंद पड़ जाती है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सर्वसुलभ हिन्दी। ‘मन ही मन’ आंतरिक मंशा को स्वाभाविक ढंग से व्यक्त करता है, जबकि ‘तौलकर बाँटते हैं’ मूल न्यायिक रूपक को स्पष्ट रखता है।
