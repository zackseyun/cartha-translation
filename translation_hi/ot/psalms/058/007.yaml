source:
  edition: WLC
  text: יִמָּאֲס֣וּ כְמוֹ מַ֭יִם יִתְהַלְּכוּ לָ֑/מוֹ יִדְרֹ֥ךְ חצ/ו כְּמ֣וֹ יִתְמֹלָֽלוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/058/007.yaml
  text: Let them melt away like water that runs off[a]; when he aims his arrows[c][b], let them be as though cut off.
translation:
  language: hi
  text: वे पानी की तरह बहकर मिट जाएँ[a]; जब वह अपना तीर चढ़ाए[b], तब वे मानो कट जाएँ[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “बहते हुए पानी के समान।” इब्रानी अभिव्यक्ति बहकर दूर हो जाने और ओझल हो जाने वाले पानी की छवि प्रस्तुत करती है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में “उसका तीर” एकवचन है; भाव सामूहिक भी समझा जा सकता है।
    reason: lexical_alternative
  - marker: c
    text: 'अंतिम वाक्यांश का इब्रानी पाठ और अर्थ कठिन है। संभावित अर्थ हैं: “वे कटे हुए से हो जाएँ,” “उसके तीर कुंठित हो जाएँ,” या “वे मुरझा जाएँ।”'
    reason: alternative_reading
lexical_decisions:
- source_word: יִמָּאֲסוּ
  choice: घुलकर मिट जाएँ
  rationale: संदर्भ में क्रिया पानी के समान विलीन होकर नष्ट हो जाने का भाव देती है; यह अनिश्चयात्मक/कामनार्थक बल को भी स्वाभाविक हिन्दी में रखती है।
- source_word: כְמוֹ מַיִם
  choice: पानी के समान
  rationale: मूल उपमा को सीधे और काव्यात्मक ढंग से सुरक्षित रखता है।
- source_word: יִתְהַלְּכוּ לָמוֹ
  choice: बहते हुए
  rationale: जल के आगे बढ़कर ओझल हो जाने की गतिशील छवि व्यक्त करता है; לָמוֹ का सटीक संबंध कठिन है, इसलिए हिन्दी में अनावश्यक रूप से स्पष्ट नहीं किया गया।
- source_word: יִדְרֹךְ
  choice: चढ़ाए
  rationale: तीर के साथ यह क्रिया धनुष को कसकर तीर चलाने के लिए तैयार करने की धनुर्विद्या-संबंधी क्रिया बताती है; हिन्दी में ‘तीर चढ़ाना’ स्वाभाविक है और मूल में निहित धनुष की क्रिया को संकेतित करता है।
- source_word: חצ/ו
  choice: अपना तीर
  rationale: मासोरेटिक पाठ के एकवचन ‘उसका तीर’ को सुरक्षित रखा गया है; कर्ता को स्वाभाविक हिन्दी में ‘अपना’ से व्यक्त किया गया।
- source_word: כְּמוֹ יִתְמֹלָלוּ
  choice: मानो कुंठित हो जाएँ
  rationale: अंतिम दुर्बोध रूप को तीर के निष्प्रभावी हो जाने की संभावित छवि के रूप में प्रस्तुत करता है, पर ‘मानो’ द्वारा पाठ की तुलना और अनिश्चितता बनाए रखता है।
theological_decisions:
- issue: शापात्मक प्रार्थना का बल
  choice: कामनार्थक ‘जाएँ/हो जाएँ’
  alternative: निश्चयात्मक भविष्यकाल
  rationale: पद शत्रुओं के विरुद्ध याचना/कामना व्यक्त करता है; इसे भविष्यवाणी के निश्चित कथन में नहीं बदला गया।
- issue: अंतिम पंक्ति के संदर्भित सर्वनाम की अस्पष्टता
  choice: ‘वे’ को बनाए रखा
  alternative: ‘उसके तीर’ को स्पष्ट कर्ता बनाना
  rationale: व्यंजनात्मक पाठ और दुर्बोध क्रियारूप के कारण यह स्पष्ट नहीं कि निष्प्रभावी होने वाले शत्रु हैं या तीर; मुख्य पाठ पूर्ववर्ती बहुवचन को बनाए रखता है और पादटिप्पणी में विकल्प दिया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण काव्यात्मक शैली रखी गई है। ‘घुलकर मिट जाएँ’ जल की विलुप्ति की छवि को सहज बनाता है। कठिन अंतिम खंड को अत्यधिक निश्चित किए बिना मुख्य पाठ में पठनीय बनाया गया है और वास्तविक पाठगत/शाब्दिक विकल्प पादटिप्पणी में सुरक्षित हैं।
