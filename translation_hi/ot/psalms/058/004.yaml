lexical_decisions:
- source_word: חֲמַת
  choice: विष
  rationale: साँप के समानांतर प्रयोग में इसका अर्थ ‘क्रोध’ नहीं, बल्कि साँप का विष है; हिन्दी में ‘विष’ स्वाभाविक और काव्यात्मक है।
- source_word: לָמוֹ
  choice: उनका
  rationale: 'यहाँ सर्वनामिक रूप अगले संज्ञा-पद के साथ अधिकार-संबंध व्यक्त करता है: ‘उनका विष।’'
- source_word: כִּדְמוּת
  choice: के समान है
  rationale: यह तुलना को स्पष्ट रूप से व्यक्त करता है और हिन्दी काव्य-भाषा में स्वाभाविक है।
- source_word: נָחָשׁ
  choice: साँप
  rationale: यह सामान्य श्रेणी का शब्द है; आधुनिक हिन्दी में स्पष्ट और सहज है।
- source_word: פֶתֶן
  choice: विषधर
  rationale: इब्रानी शब्द किसी विशिष्ट पहचान में अनिश्चित विषैले साँप को दर्शाता है। ‘विषधर’ प्रजाति को अनावश्यक रूप से निश्चित किए बिना विषैले साँप का भाव रखता है।
- source_word: חֵרֵשׁ
  choice: बहरा
  rationale: चित्र ऐसे साँप का है जो सुनता नहीं; इसलिए ‘गूँगा’ नहीं, ‘बहरा’ उपयुक्त है।
- source_word: יַאְטֵם אָזְנוֹ
  choice: अपना कान बंद कर लेता है
  rationale: यह कान को मूँदने या रोक लेने की सजीव छवि को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
