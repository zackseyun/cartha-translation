source:
  edition: WLC
  text: זֹ֣רוּ רְשָׁעִ֣ים מֵ/רָ֑חֶם תָּע֥וּ מִ֝/בֶּ֗טֶן דֹּבְרֵ֥י כָזָֽב׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/058/003.yaml
  text: The wicked are estranged from the womb; they go astray from birth[a], speaking lies.
translation:
  language: hi
  text: 'दुष्ट गर्भ ही से पराए हो गए हैं;

    वे जन्म ही से भटक गए हैं[a],

    और झूठ बोलते हैं।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से पहली पंक्ति में “गर्भ ही से” और दूसरी में “पेट/गर्भ ही से” है। यह काव्यात्मक अतिशयोक्ति दुष्टों को जीवन के आरम्भ से ही भटका हुआ बताती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: זֹרוּ
  choice: पराए हो गए हैं
  rationale: यह זור के अलगाव या परायापन के भाव को सुरक्षित रखता है और समानांतर क्रिया ‘भटक गए हैं’ के साथ स्वाभाविक बैठता है; इसे केवल नैतिक भ्रष्टता के अर्थ तक सीमित नहीं करता।
- source_word: רְשָׁעִים
  choice: दुष्ट
  rationale: רְשָׁעִים के लिए मानक, संक्षिप्त और आधुनिक हिन्दी वर्ग-संज्ञा।
- source_word: מֵרָחֶם
  choice: गर्भ ही से
  rationale: इब्रानी पद का सीधा और काव्यात्मक अनुवाद; ‘ही’ आरम्भिक अवस्था पर दिए गए बल को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: תָּעוּ
  choice: भटक गए हैं
  rationale: תעה के मार्ग से चूकने या भटकने के अर्थ को व्यक्त करता है; पूर्ण क्रिया का परिणाम वर्तमान तक बना रहने का भाव हिन्दी पूर्ण वर्तमान में स्पष्ट है।
- source_word: מִבֶּטֶן
  choice: जन्म ही से
  rationale: בטן का शाब्दिक अर्थ पेट/गर्भ है, पर समानांतर पंक्ति में ‘जन्म ही से’ स्वाभाविक हिन्दी है और आरम्भिक जीवन का आशय देता है; शाब्दिकता पादटिप्पणी में सुरक्षित है।
- source_word: דֹּבְרֵי כָזָב
  choice: और झूठ बोलते हैं
  rationale: सहभागी पदबंध का चरित्रसूचक, निरन्तर भाव सहज आधुनिक हिन्दी में व्यक्त होता है।
- source_word: כָזָב
  choice: झूठ
  rationale: वाणी के प्रसंग में सबसे स्पष्ट और बोलचाल में स्वाभाविक आधुनिक हिन्दी समतुल्य।
theological_decisions:
- issue: क्या पद को गर्भपूर्व नैतिक दोष या वंशानुगत पाप की तकनीकी धर्मसैद्धान्तिक घोषणा के रूप में अनूदित किया जाए
  choice: भजन की इस तीव्र काव्यात्मक अतिशयोक्ति को बनाए रखना कि दुष्ट आरम्भिक जीवन से ही कुमार्गी हैं
  alternative: इसे गर्भधारण से पूर्ण नैतिक भ्रष्टता की स्पष्ट तकनीकी शिक्षा बनाना, अथवा इसे केवल अर्थहीन निन्दात्मक अलंकार मानकर इसकी मानव-सम्बन्धी गंभीरता घटा देना
  rationale: ‘गर्भ ही से’ और ‘जन्म ही से’ काव्यात्मक समानांतरता में हैं। अनुवाद चित्र की तीव्रता बनाए रखता है, पर पद से अधिक व्यवस्थित धर्मसिद्धान्त आरोपित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण काव्यात्मक शैली। ‘पराए हो गए हैं’ मूल के अलगाव-भाव को रखता है; ‘गर्भ ही से / जन्म ही से’ समानांतरता को स्वाभाविक हिन्दी में व्यक्त करते हैं। मुख्य पाठ में पादटिप्पणी चिह्न [a] सम्मिलित है।
