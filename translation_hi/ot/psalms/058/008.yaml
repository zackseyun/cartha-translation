  text: כְּמ֣וֹ שַׁ֭בְּלוּל תֶּ֣מֶס יַהֲלֹ֑ךְ נֵ֥פֶל אֵ֝֗שֶׁת בַּל חָ֥זוּ שָֽׁמֶשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/058/008.yaml
  text: Like a snail that melts away as it goes[b][a], like a stillborn child that has not seen the sun.
translation:
  language: hi
  text: उस घोंघे के समान जो चलते-चलते गल जाता है, उस मृतजन्मा शिशु के समान जिसने सूरज नहीं देखा।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'दूसरी उपमा की इब्रानी वाक्य-रचना कठिन है। शब्दशः लगभग: “स्त्री का गर्भपात—उन्होंने सूरज नहीं देखा।” इब्रानी में “देखा” क्रिया बहुवचन है, यद्यपि “गर्भपात” एकवचन है; भाव उस संतान का है जो जन्म से पहले या जन्म के समय मर गई।'
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּמוֹ
  choice: जैसे
  rationale: यह उपमा का परिचायक है; हिंदी में ‘जैसे’ स्वाभाविक रूप से तुलनात्मक भाव व्यक्त करता है।
- source_word: שַׁבְּלוּל
  choice: घोंघा
  rationale: इस दुर्लभ संज्ञा का पारंपरिक और सर्वाधिक स्थापित अर्थ ‘घोंघा’ है; संदर्भ में उसके चलते हुए गलने की काव्यात्मक छवि है।
- source_word: תֶּמֶס
  choice: गल जाता है
  rationale: यह गलने या घुलने का भाव देता है। क्रियात्मक हिंदी पदबंध मूल काव्य-चित्र को स्पष्ट और स्वाभाविक रखता है।
- source_word: יַהֲלֹךְ
  choice: चलते-चलते
  rationale: मूल क्रिया का अर्थ ‘चलना/जाना’ है; ‘चलते-चलते’ गलने की समकालिक क्रिया को संक्षेप में व्यक्त करता है।
- source_word: נֵפֶל אֵשֶׁת
  choice: मरा हुआ जन्मा बच्चा
  rationale: मूल पद का शाब्दिक भाव ‘स्त्री का गर्भपात/गिरा हुआ गर्भ’ है। संदर्भ में उस संतान की बात है जिसने सूरज नहीं देखा; यह हिंदी रूप अर्थ को स्पष्ट रखता है और अगले वाक्यांश को माता से गलत ढंग से नहीं जोड़ता।
- source_word: בַּל חָזוּ
  choice: जिसने ... नहीं देखा
  rationale: मूल में निषेध के साथ बहुवचन क्रिया है, जबकि निकटवर्ती संज्ञा एकवचन है। हिंदी में भावानुसार एकवचन संबंधवाचक रूप उस मृत-जन्मे बच्चे को स्पष्ट रूप से संदर्भित करता है; व्याकरणिक कठिनाई पादटिप्पणी में बताई गई है।
- source_word: שָׁמֶשׁ
  choice: सूरज
  rationale: यह मूल अर्थ का सीधा, सामान्य और काव्यात्मक हिंदी समतुल्य है।
