base_translation:
  language: en
  yaml_path: translation/ot/psalms/058/000.yaml
  text: 'For the choirmaster: “Do Not Destroy.”[a] Of David. A miktam.[b]'
translation:
  language: hi
  text: 'संगीत-निर्देशक के लिए: “नाश मत कर।”[a] दाऊद का। एक मिक्ताम।[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या संभवतः, “‘नाश मत कर’ के अनुसार,” यदि यह वाक्यांश धुन या संगीत-विन्यास को अधिक स्पष्ट रूप से बताता हो।
    reason: alternative_reading
  - marker: b
    text: इब्रानी शब्द “मिक्ताम” भजन के एक प्रकार का अनिश्चित-अर्थ वाला नाम है; यह किसी रचना-प्रकार या संगीत-विन्यास को सूचित कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: संगीत-निर्देशक के लिए
  rationale: भजन-संहिताओं के शीर्षकों में यह पद संगीत का नेतृत्व करने वाले व्यक्ति को सूचित करता है। यह अनुवाद आधुनिक हिन्दी में स्वाभाविक है और उसके आराधनात्मक-संगीत संबंधी कार्य को स्पष्ट रखता है।
- source_word: אַל תַּשְׁחֵת
  choice: “नष्ट न कर”
  rationale: यह संभवतः किसी धुन या संगीत-विन्यास का नाम है। उद्धरण-चिह्न इसे शीर्षक के रूप में संकेत करते हैं, जबकि इब्रानी में ‘के अनुसार’ जैसा कोई स्पष्ट संबंधसूचक पद न होने के कारण उसे मुख्य पाठ में नहीं जोड़ा गया।
- source_word: לְדָוִד
  choice: दाऊद का
  rationale: इब्रानी संबंधसूचक לְ लेखन, समर्पण या व्यापक संबद्धता बता सकता है। ‘दाऊद का’ इस अस्पष्टता को ‘दाऊद द्वारा’ की अपेक्षा अधिक सुरक्षित रखता है।
- source_word: מִכְתָּם
  choice: एक मिक्ताम
  rationale: इस पारिभाषिक पद का अर्थ अनिश्चित है और यह किसी साहित्यिक या संगीतात्मक प्रकार का नाम हो सकता है। इसलिए अनुमानात्मक अर्थ देने के बजाय उसका लिप्यंतरण किया गया है।
theological_decisions:
- issue: शीर्षक में प्रयुक्त संगीतात्मक और साहित्यिक पदों का स्वरूप
  choice: पूरी पंक्ति को भजन के प्रामाणिक शीर्षक के रूप में रखते हुए अनिश्चित पदों का पारदर्शी अनुवाद किया गया है।
  alternative: אַל תַּשְׁחֵת को सीधे आदेश के रूप में और לְדָוִד को स्पष्ट लेखकत्व, अर्थात् ‘दाऊद द्वारा’, के रूप में समझना।
  rationale: यहाँ कोई प्रमुख सिद्धान्तगत प्रश्न नहीं है, पर इब्रानी पाठ जिन बातों को निश्चित नहीं करता, अनुवाद भी उन्हें अनावश्यक रूप से निश्चित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और आराधनात्मक शैली-स्तर रखा गया है। तकनीकी इब्रानी पद ‘मिक्ताम’ का लिप्यंतरण किया गया है और उसकी अनिश्चितता पाद-टिप्पणी में समझाई गई है।
