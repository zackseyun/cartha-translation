source:
  edition: WLC
  text: בְּ/טֶ֤רֶם יָבִ֣ינוּ סִּֽירֹתֵי/כֶ֣ם אָטָ֑ד כְּמוֹ חַ֥י כְּמוֹ חָ֝ר֗וֹן יִשְׂעָרֶֽ/נּוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/058/009.yaml
  text: Before your pots can feel the thornbush[a], whether green or burning, he will sweep them away.
translation:
  language: hi
  text: इससे पहले कि तुम्हारी हाँडियाँ काँटेदार झाड़ी[a] की आँच महसूस करें—चाहे वह हरी हो या धधकती हुई—वह उसे झकझोरकर उड़ा ले जाएगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इब्रानी पाठ कठिन है। अधिक शाब्दिक रूप से: “इससे पहले कि तुम्हारी हाँडियाँ काँटेदार झाड़ी को पहचानें/अनुभव करें, चाहे वह हरी हो, चाहे धधकती हुई या क्रोध में हो, वह उसे झंझावात की तरह उड़ा ले जाएगा।” आशय संभवतः यह है कि आग के हाँडियों को गरम करने से पहले ही वह वस्तु अचानक हटा दी जाएगी। अंतिम वाक्यांश का अर्थ “वह उन्हें क्रोध में उड़ा ले जाएगा” भी लिया जाता है।'
    reason: वैकल्पिक पाठ और अस्पष्ट इब्रानी वाक्य-विन्यास
lexical_decisions:
- source_word: בְּטֶרֶם
  choice: इससे पहले कि
  rationale: यह समय-सूचक पद दूसरी क्रिया के घटित होने से पहले अचानक होने वाली घटना को व्यक्त करता है।
- source_word: יָבִינוּ
  choice: आँच महसूस करें
  rationale: क्रिया का सामान्य अर्थ ‘समझना/जानना’ है, पर हाँडियों और ईंधन के इस रूपक में ताप का अनुभव करना अभिप्रेत जान पड़ता है। ‘आँच’ संदर्भ को स्पष्ट करती है, जबकि कठिन काव्य-चित्र बना रहता है।
- source_word: סִּירֹתֵיכֶם
  choice: तुम्हारी हाँडियाँ
  rationale: यह पकाने के बर्तनों के लिए प्रयुक्त बहुवचन है। ‘हाँडियाँ’ साधारण, ठोस और अग्नि-संबंधी चित्र के अनुकूल है।
- source_word: אָטָד
  choice: काँटेदार झाड़ी
  rationale: यह शीघ्र जलने वाले ईंधन के रूप में प्रयुक्त काँटेदार झाड़ को दर्शाता है; यह चयन मूल ठोस बिंब को बनाए रखता है।
- source_word: כְּמוֹ חַי
  choice: चाहे वह हरी हो
  rationale: ईंधन के संदर्भ में ‘जीवित’ का आशय ताज़ी या हरी झाड़ी हो सकता है। ‘हरी’ स्वाभाविक हिन्दी में उस अवस्था को व्यक्त करता है।
- source_word: כְּמוֹ חָרוֹן
  choice: या धधकती हुई
  rationale: חָרוֹן प्रायः ‘जलता क्रोध’ है, पर यहाँ आग के चित्र में जलती या प्रज्वलित अवस्था भी संभव है। ‘धधकती हुई’ ताप और क्रोध की अंतर्निहित संगति को पूरी तरह सिद्धांतगत भाषा में नहीं बदलता।
- source_word: יִשְׂעָרֶנּוּ
  choice: वह उसे बवंडर की तरह उड़ा ले जाएगा
  rationale: क्रिया आँधी या बवंडर से हिंसक ढंग से बहा ले जाने का भाव रखती है। एकवचन कर्म-सर्वनाम को ‘उसे’ से सुरक्षित रखा गया है, यद्यपि उसका संदर्भ अस्पष्ट है।
theological_decisions:
- issue: अत्यंत कठिन काव्य-बिंब और חָרוֹן का अर्थ
  choice: मुख्य पाठ में हरी अथवा धधकती काँटेदार झाड़ी से हाँडियों के गरम होने से पहले अचानक उड़ा दिए जाने का चित्र रखा गया है।
  alternative: अंतिम खंड का अर्थ ‘वह क्रोध में उन्हें उड़ा ले जाएगा’ भी लिया जा सकता है।
  rationale: संदर्भ अचानक न्याय की ओर संकेत करता है, लेकिन इब्रानी वाक्य-विन्यास, अवस्थाओं का संबंध और एकवचन कर्म-सर्वनाम अनिश्चित हैं। मुख्य पाठ आग का ठोस बिंब रखता है और पादटिप्पणी वैकल्पिक ‘क्रोध’ अर्थ तथा व्याकरणिक कठिनाई को सुरक्षित रखती है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य हिन्दी। ‘हाँडियाँ’, ‘काँटेदार झाड़ी’ और ‘बवंडर’ मूल घरेलू तथा प्रचंड प्राकृतिक बिंबों को ठोस रखते हैं। पादटिप्पणी पाठ की वास्तविक अस्पष्टता को दर्ज करती है।
