  text: יִשְׂמַ֣ח צַ֭דִּיק כִּי חָזָ֣ה נָקָ֑ם פְּעָמָ֥י/ו יִ֝רְחַ֗ץ בְּ/דַ֣ם הָ/רָשָֽׁע־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/058/010.yaml
  text: The righteous will rejoice when he sees vengeance[b][a]; he will wash his feet in the blood of the wicked.
translation:
  language: hi
  text: धर्मी आनन्दित होगा, जब वह प्रतिशोध देखेगा[a]; वह दुष्ट के लहू में अपने पाँव धोएगा।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इसका अनुवाद ‘क्योंकि उसने प्रतिशोध देखा है’ भी हो सकता है। इब्रानी संयोजक कारण (‘क्योंकि’) और समय (‘जब’) दोनों व्यक्त कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: ‘दुष्ट के लहू में अपने पाँव धोना’ एक काव्यात्मक छवि है, जो न्याय-दण्ड की पूर्णता दिखाती है; यह निजी हिंसा करने की आज्ञा नहीं है।
    reason: cultural_note
lexical_decisions:
- source_word: יִשְׂמַח
  choice: आनन्दित होगा
  rationale: שׂמח के अपूर्ण रूप का भाव यहाँ भविष्यसूचक है; यह चयन काव्यात्मक गरिमा और स्वाभाविक आधुनिक हिन्दी दोनों बनाए रखता है।
- source_word: צַדִּיק
  choice: धर्मी
  rationale: एकवचन विशेषण यहाँ संज्ञा के रूप में प्रतिनिधिक अर्थ देता है। ‘धर्मी’ हिन्दी में स्वाभाविक है और अनावश्यक रूप से ‘मनुष्य’ नहीं जोड़ता।
- source_word: כִּי
  choice: जब
  rationale: यह संयोजक कारणवाचक (‘क्योंकि’) अथवा कालवाचक (‘जब’) हो सकता है। मुख्य पाठ में ‘जब’ उस परिस्थिति को सहज रूप से व्यक्त करता है जिसमें धर्मी आनन्दित होगा; कारणवाचक संभावना पादटिप्पणी में सुरक्षित है।
- source_word: חָזָה
  choice: देखेगा
  rationale: सिद्ध रूप भविष्याभिमुख काव्य-संदर्भ में ‘जब’ के साथ हिन्दी भविष्यकाल में स्वाभाविक रूप से व्यक्त होता है।
- source_word: נָקָם
  choice: प्रतिशोध
  rationale: यह संज्ञा बदला या दण्डात्मक प्रतिकार को दर्शाती है। ‘प्रतिशोध’ मूल की कठोरता को बनाए रखता है, पर मुख्य पाठ में यह नहीं जोड़ता कि वह प्रतिशोध निजी है या स्पष्टतः ईश्वरीय।
- source_word: פְּעָמָיו
  choice: अपने पाँव
  rationale: פעם का अर्थ कदम भी हो सकता है, पर धोने और लहू की इस मूर्त छवि में ‘पाँव’ सर्वाधिक स्वाभाविक है; प्रत्यय को ‘अपने’ से व्यक्त किया गया है।
- source_word: יִרְחַץ
  choice: धोएगा
  rationale: רחץ के अपूर्ण रूप का सीधा भविष्यसूचक अर्थ सुरक्षित रखा गया है।
- source_word: בְּדַם
  choice: लहू में
  rationale: ב का स्थानवाचक अर्थ और मूल की तीखी काव्यात्मक छवि सीधे रूप में सुरक्षित हैं। ‘लहू’ सामान्य पाठक के लिए बोधगम्य और इस काव्य-संदर्भ में प्रभावी है।
- source_word: הָרָשָׁע
  choice: दुष्ट
  rationale: एकवचन विशेषण संज्ञा के रूप में प्रतिनिधिक या सामूहिक अर्थ दे सकता है। ‘दुष्ट’ इस संभावित व्यापकता को बिना विस्तार के बनाए रखता है।
theological_decisions:
- issue: क्या पद निजी बदले की खुशी बताता है या न्यायपूर्ण दण्ड को देखकर आनन्द
  choice: मुख्य पाठ मूल के अनुसार प्रतिशोध को देखकर धर्मी के आनन्दित होने की बात कहता है, पर प्रतिशोध को न निजी घोषित करता है, न मुख्य पाठ में ‘ईश्वरीय’ जोड़ता है।
  alternative: इसे निजी बदले के उत्सव या केवल ईश्वरीय पक्ष-समर्थन के रूप में स्पष्ट कर देना।
  rationale: इब्रानी पाठ प्रतिशोध और रक्त की प्रखर छवि रखता है, किन्तु कर्ता को स्पष्ट नहीं करता। इसलिए अनुवाद उस धार्मिक तनाव को बनाए रखता है और व्याख्यात्मक टिप्पणी केवल हिंसा के आदेश वाली गलत समझ को रोकती है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और काव्यात्मक स्तर रखा गया है। ‘प्रतिशोध’ और ‘लहू’ मूल की कठोरता को नरम किए बिना सामान्य पाठक के लिए स्पष्ट हैं। दोनों पादटिप्पणी-चिह्न मुख्य पाठ में दिए गए हैं।
