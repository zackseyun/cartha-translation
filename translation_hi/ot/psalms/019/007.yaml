id: PSA.19.7
reference: Psalms 19:7
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: תּ֘וֹרַ֤ת יְהוָ֣ה תְּ֭מִימָה מְשִׁ֣יבַת נָ֑פֶשׁ עֵד֥וּת יְהוָ֥ה נֶ֝אֱמָנָ֗ה מַחְכִּ֥ימַת פֶּֽתִי׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/019/007.yaml
  text: The law of Yahweh is perfect[a], restoring the soul; the testimony of Yahweh is trustworthy, making the simple wise.
translation:
  language: hi
  text: याहवे की व्यवस्था पूर्ण है; वह प्राण को बहाल करती है[a]। याहवे की गवाही भरोसेमंद है; वह अनुभवहीन को बुद्धिमान बनाती है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “प्राण को नया जीवन देती है।”
    reason: מְשִׁיבַת נָפֶשׁ में पुनर्स्थापित करने के साथ पुनर्जीवित करने का अर्थ भी सम्भव है।
lexical_decisions:
- source_word: תּוֹרַת
  choice: व्यवस्था
  rationale: תּוֹרָה यहाँ याहवे से प्राप्त अधिकारपूर्ण और वाचागत शिक्षा को दर्शाती है। ‘व्यवस्था’ हिन्दी बाइबलीय भाषा में इस अर्थ-भार को बनाए रखती है, जबकि इसका आशय केवल कानूनी नियमों तक सीमित नहीं है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय दिव्य नाम को किसी उपाधि से बदलने के बजाय हिन्दी लिपि में व्यक्तिगत नाम के रूप में प्रस्तुत किया गया है।
- source_word: תְּמִימָה
  choice: पूर्ण
  rationale: यह शब्द समग्रता, अखंडता और किसी कमी के न होने का भाव देता है। ‘पूर्ण’ आधुनिक हिन्दी में स्वाभाविक और स्पष्ट है।
- source_word: מְשִׁיבַת
  choice: बहाल करती है
  rationale: שׁוב के कारक कृदंत में लौटाने या पूर्व दशा में लाने का मूल भाव है। ‘बहाल करती है’ इस भाव को बनाए रखता है; पुनर्जीवित करने का संदर्भगत अर्थ पादटिप्पणी में दिया गया है।
- source_word: נָפֶשׁ
  choice: प्राण
  rationale: נֶפֶשׁ जीवन, स्वयं और समूचे जीवित व्यक्ति तक विस्तृत अर्थ रखता है। ‘प्राण’ यहाँ काव्यात्मक और स्वाभाविक है तथा इसे केवल शरीर से अलग अमूर्त ‘आत्मा’ तक सीमित नहीं करता।
- source_word: עֵדוּת
  choice: गवाही
  rationale: यह याहवे के विश्वसनीय साक्ष्य अथवा वाचागत प्रमाण को व्यक्त करता है। ‘गवाही’ सीधा और प्रचलित हिन्दी समतुल्य है।
- source_word: נֶאֱמָנָה
  choice: भरोसेमंद
  rationale: शब्द दृढ़ता और विश्वसनीयता व्यक्त करता है। ‘भरोसेमंद’ सामान्य आधुनिक हिन्दी में अर्थ को साफ़ बताता है।
- source_word: מַחְכִּימַת
  choice: बुद्धिमान बनाती है
  rationale: कारक रूप किसी को बुद्धि देने अथवा बुद्धिमान बनाने का अर्थ देता है; यह हिन्दी में उसका सीधा और स्वाभाविक रूप है।
- source_word: פֶּתִי
  choice: अनुभवहीन
  rationale: פֶּתִי ऐसे भोले या अपरिपक्व व्यक्ति को दर्शाता है जो अभी विवेक में प्रशिक्षित नहीं है और आसानी से प्रभावित हो सकता है। ‘अनुभवहीन’ अनावश्यक नैतिक निंदा जोड़े बिना यह भाव व्यक्त करता है।
theological_decisions:
- issue: दिव्य नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा अथवा ‘प्रभु’
  rationale: मूल पाठ व्यक्तिगत दिव्य नाम का प्रयोग करता है। ‘याहवे’ उस नाम को उपाधि से प्रतिस्थापित किए बिना सुरक्षित रखता है।
- issue: מְשִׁיבַת נָפֶשׁ का अर्थ
  choice: प्राण को बहाल करती है
  alternative: प्राण को नया जीवन देती है
  rationale: वाक्यांश लौटाने या पुनर्स्थापित करने और पुनर्जीवित करने—दोनों अर्थों की संभावना रखता है। मुख्य पाठ में मूल धातु का लौटाने वाला भाव रखा गया है और पुनर्जीवन की प्रबल संदर्भगत संभावना पादटिप्पणी में सुरक्षित है।
- issue: נָפֶשׁ की मानव-सम्बन्धी व्यापकता
  choice: प्राण
  alternative: जीवन अथवा स्वयं व्यक्ति
  rationale: यहाँ शब्द को शरीर से पृथक किसी विशेष दार्शनिक सत्ता के रूप में सीमित नहीं किया गया; ‘प्राण’ जीवन और भीतरी व्यक्ति दोनों की काव्यात्मक प्रतिध्वनि बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और काव्यात्मक रखी गई है। समानांतर इब्रानी पंक्तियों को दो संतुलित हिन्दी वाक्यों में प्रस्तुत किया गया है। ‘व्यवस्था’ और ‘गवाही’ पारंपरिक बाइबलीय शब्द हैं, जबकि ‘भरोसेमंद’ और ‘अनुभवहीन’ सामान्य आधुनिक पाठक के लिए स्पष्ट हैं।
