  text: בְּ/כָל הָ/אָ֨רֶץ יָ֘צָ֤א קַוָּ֗/ם וּ/בִ/קְצֵ֣ה תֵ֭בֵל מִלֵּי/הֶ֑ם לַ֝/שֶּׁ֗מֶשׁ שָֽׂם אֹ֥הֶל בָּ/הֶֽם־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/019/004.yaml
  text: Their line has gone out through all the earth[a], and their words to the end of the world. In them he has set a tent for the sun[b],
translation:
  language: hi
  text: सारी पृथ्वी पर उनकी डोरी फैल गई है[a], और संसार के छोर तक उनकी बातें पहुँच गई हैं। उनमें उसने सूर्य के लिए एक तंबू खड़ा किया है[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “सारी पृथ्वी पर उनकी ध्वनि/वाणी फैल गई है।” इब्रानी व्यंजन-पाठ का अर्थ “उनकी डोरी” है, पर कुछ प्राचीन अनुवाद और अनेक व्याख्याकार इस काव्यात्मक संदर्भ में इसे “ध्वनि” या “वाणी” समझते हैं।
    reason: alternative_reading
  - marker: b
    text: “उनमें” का संकेत सम्भवतः पिछले पद में आए आकाश और आकाशमंडल की ओर है।
    reason: cross_reference
lexical_decisions:
- source_word: קַוָּם
  choice: उनकी डोरी
  rationale: मसोरेटी पाठ का सामान्य अर्थ ‘उनकी डोरी’ है। मुख्य पाठ इसे सुरक्षित रखता है; काव्यात्मक समानांतरता के आधार पर ‘उनकी ध्वनि/वाणी’ की प्राचीन और व्यापक व्याख्या पादटिप्पणी में दी गई है। ‘फैल गई है’ हिन्दी में डोरी के पूरी पृथ्वी तक पहुँचने का भाव स्वाभाविक रूप से व्यक्त करता है।
- source_word: מִלֵּיהֶם
  choice: उनकी बातें
  rationale: यह शब्द बातों/वचनों को सूचित करता है। ‘बातें’ सामान्य आधुनिक हिन्दी में सहज है और निर्जीव आकाशीय सृष्टि की मूक उद्घोषणा का काव्यात्मक तनाव बनाए रखता है।
- source_word: תֵבֵל
  choice: संसार
  rationale: यह प्रायः आबाद जगत को दर्शाता है; ‘संसार’ हिन्दी में संक्षिप्त और काव्यात्मक रूप से स्वाभाविक है।
- source_word: יָצָא
  choice: फैल गई है
  rationale: क्रिया का मूल भाव बाहर निकलने का है; ‘डोरी’ के साथ ‘फैल गई है’ उसके समस्त पृथ्वी में विस्तार को सहज हिन्दी में व्यक्त करता है और पूर्ण क्रिया के वर्तमान परिणाम को बनाए रखता है।
- source_word: שָׂם
  choice: खड़ा किया है
  rationale: परमेश्वर द्वारा तंबू रखने/स्थापित करने की पूर्ण क्रिया को हिन्दी में तंबू के साथ स्वाभाविक मुहावरे द्वारा व्यक्त किया गया है।
- source_word: אֹהֶל
  choice: तंबू
  rationale: सामान्य अर्थ ‘तंबू’ है; ‘निवास’ या ‘मिलापवाला तंबू’ जैसे विकल्प अनावश्यक व्याख्यात्मक अथवा उपासना-संबंधी अर्थ जोड़ सकते हैं।
- source_word: בָּהֶם
  choice: उनमें
  rationale: इब्रानी बहुवचन सर्वनाम को ज्यों का त्यों रखा गया है; इसका संभावित पूर्वपद पिछले पद के आकाश/आकाशमंडल हैं, जिसे पादटिप्पणी स्पष्ट करती है।
- source_word: לַשֶּׁמֶשׁ
  choice: सूर्य के लिए
  rationale: पूर्वसर्ग और संज्ञा का सीधा, स्वाभाविक अनुवाद है।
