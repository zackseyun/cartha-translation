  text: तेरा सेवक भी उनके द्वारा चेताया जाता है[a]; उनका पालन करने में बड़ा प्रतिफल है[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उनसे चेतावनी पाकर सावधान होता है”; इब्रानी क्रिया का अर्थ चेताया जाना या चेतावनी पर ध्यान देना हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या “प्रचुर प्रतिफल/परिणाम है।”
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם
  choice: भी
  rationale: यह पद पिछले कथन से जुड़कर यह बताता है कि याहवे के वचनों का प्रभाव उसके सेवक पर भी पड़ता है; ‘भी’ इसके योगात्मक बल को स्वाभाविक हिन्दी में रखता है।
- source_word: עַבְדְּךָ
  choice: तेरा सेवक
  rationale: भजनकार परमेश्वर को संबोधित करके अपने लिए भक्ति और अधीनता का संबंधसूचक पद प्रयोग करता है; ‘सेवक’ प्रसंग के लिए स्वाभाविक है।
- source_word: נִזְהָר
  choice: सावधान किया जाता है
  rationale: זהר के निफ़अल रूप का निष्क्रिय/परिणामात्मक अर्थ ‘चेताया जाना’ या ‘सावधान किया जाना’ है; यह रूप मूल की वाच्यता बनाए रखता है।
- source_word: בָּהֶם
  choice: उनसे
  rationale: सर्वनाम पिछले पदों में वर्णित याहवे के नियमों और निर्णयों की ओर लौटता है; ‘उनसे’ साधन का भाव संक्षेप में व्यक्त करता है।
- source_word: בְּשָׁמְרָם
  choice: उनका पालन करने में
  rationale: בְּ के साथ שמר का क्रियार्थक संज्ञा-रूप परिस्थिति अथवा साधन व्यक्त करता है; ‘पालन करने में’ आज की हिन्दी में स्पष्ट और मूल के निकट है।
- source_word: עֵקֶב
  choice: प्रतिफल
  rationale: यहाँ शब्द उस लाभकारी परिणाम अथवा बदले को दर्शाता है जो पालन के साथ जुड़ा है; ‘प्रतिफल’ परिणाम और पुरस्कार, दोनों की संभावित छाया को खुला रखता है।
- source_word: רָב
  choice: बड़ा
  rationale: यह प्रतिफल की प्रचुरता या महत्ता बताता है; ‘बड़ा प्रतिफल’ सहज और संक्षिप्त हिन्दी है।
theological_decisions:
- issue: क्या पद परमेश्वर के सामने योग्यता के आधार पर कमाई का वादा करता है, या आज्ञापालन के लाभकारी परिणाम को बताता है
  choice: वाक्य केवल यह कहता है कि इनका पालन करने में बड़ा प्रतिफल है; वह प्रतिफल की सटीक प्रकृति या उसके अर्जित होने की धर्मवैज्ञानिक व्यवस्था निर्धारित नहीं करता।
  alternative: ‘इनका पालन करने से परमेश्वर से पुरस्कार कमाया जाता है।’
  rationale: इब्रानी בְּשָׁמְרָם עֵקֶב רָב आज्ञापालन और बड़े प्रतिफल/परिणाम का संबंध बताता है, पर मानव योग्यता की कोई पूर्ण धर्मवैज्ञानिक प्रणाली स्पष्ट नहीं करता; इसलिए मूल का तनाव सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी, देवनागरी और गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज शैली। परमेश्वर के सीधे संबोधन में ‘तेरा’ रखा गया है। ‘प्रतिफल’ ने पुरस्कार और परिणाम के बीच मूल की अर्थगत व्यापकता को यथासंभव सुरक्षित रखा है।
