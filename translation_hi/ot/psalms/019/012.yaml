  text: Who can discern his errors? Clear me from hidden faults[a].
translation:
  language: hi
  text: 'अपनी भूलों को कौन समझ सकता है?

    मुझे छिपे हुए दोषों से मुक्त कर।[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘गुप्त पापों से’ अथवा ‘छिपी हुई बातों से।’ इब्रानी पद उन दोषों को सूचित कर सकता है जो बोलने वाले से छिपे हों, दूसरों से छिपाए गए हों, या सामान्यतः गुप्त हों।
    reason: lexical_alternative
  - marker: b
    text: या ‘मुझे निर्दोष ठहरा’ अथवा ‘मुझे शुद्ध कर।’ इब्रानी क्रिया में दोषमुक्त करने, निर्दोष ठहराने और शुद्ध करने के अर्थों की छाया हो सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁגִיאוֹת
  choice: भूलों
  rationale: यह संज्ञा भटकाव, भूल या अनजाने में हुए पाप को सूचित कर सकती है। ‘भूलों’ सहज हिन्दी है और नैतिक आशय को बनाए रखते हुए अनजानेपन को अनावश्यक रूप से निश्चित नहीं करती।
- source_word: מִי
  choice: कौन
  rationale: अलंकारिक प्रश्न आरम्भ करने वाला स्वाभाविक हिन्दी प्रश्नवाचक सर्वनाम।
- source_word: יָבִין
  choice: समझ सकता है
  rationale: क्रिया का अर्थ समझना या पहचानना है। ‘समझ सकता है’ मनुष्य की अपनी भूलों को पूरी तरह पहचान पाने की असमर्थता व्यक्त करता है।
- source_word: מִנִּסְתָּרוֹת
  choice: छिपे हुए दोषों से
  rationale: शाब्दिक रूप से ‘छिपी हुई बातों से’; समानांतर पंक्ति में ‘भूलों’ के कारण यहाँ नैतिक दोष सम्भावित हैं। अभिव्यक्ति यह खुला रखती है कि वे वक्ता से छिपे हैं, दूसरों से, या सामान्यतः गुप्त हैं।
- source_word: נַקֵּנִי
  choice: मुझे निर्दोष ठहरा
  rationale: पिएल आज्ञार्थक रूप दोषमुक्त करने, निर्दोष ठहराने या शुद्ध करने का अर्थ दे सकता है। ‘निर्दोष ठहरा’ इसके न्यायिक आशय को स्पष्ट करता है, यद्यपि शुद्ध करने की छाया भी सम्भव है।
theological_decisions:
- issue: छिपी हुई बातों या दोषों का स्वरूप
  choice: समानांतरता के आधार पर इन्हें ‘छिपे हुए दोष’ कहा गया है।
  alternative: ‘गुप्त पाप’ या सामान्य रूप से ‘छिपी हुई बातें’।
  rationale: ‘भूलों’ के साथ समानांतरता नैतिक सन्दर्भ का समर्थन करती है, पर मूल इब्रानी यह निश्चित नहीं करती कि दोष भजनकार से छिपे हैं, दूसरों से छिपाए गए हैं, या सामान्यतः गुप्त हैं।
- issue: נַקֵּנִי का न्यायिक और शुद्धिकरण सम्बन्धी आशय
  choice: ‘मुझे निर्दोष ठहरा’
  alternative: ‘मुझे शुद्ध कर’ या ‘मुझे दोषमुक्त कर’।
  rationale: इब्रानी क्रिया निर्दोष ठहराने और दोष से शुद्ध करने, दोनों से सम्बन्ध रख सकती है। मुख्य पाठ में न्यायिक भाव चुना गया है; सम्भव शुद्धिकरण अर्थ को नकारा नहीं गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, काव्यात्मक और गरिमापूर्ण शैली रखी गई है। ‘अपनी’ जोड़कर प्रश्न का आत्मपरीक्षणात्मक सन्दर्भ स्वाभाविक बनाया गया है।
