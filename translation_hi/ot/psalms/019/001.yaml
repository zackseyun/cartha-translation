id: PSA.19.1
reference: Psalms 19:1
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: הַ/שָּׁמַ֗יִם מְֽסַפְּרִ֥ים כְּבֽוֹד אֵ֑ל וּֽ/מַעֲשֵׂ֥ה יָ֝דָ֗י/ו מַגִּ֥יד הָ/רָקִֽיעַ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/019/001.yaml
  text: The heavens declare the glory of God[b][a], and the expanse proclaims the work of his hands.
translation:
  language: hi
  text: आकाश परमेश्वर की महिमा का वर्णन करता है, और नभमंडल[a] उसके हाथों के काम[b] की घोषणा करता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘आकाश का विस्तार’। इब्रानी शब्द फैले हुए आकाश या आकाशीय मेहराब को दर्शाता है।
    reason: lexical_alternative
  - marker: b
    text: या ‘उसकी कारीगरी’।
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשָּׁמַיִם
  choice: आकाश
  rationale: बहुवचन रूप होते हुए भी हिन्दी में ‘आकाश’ स्वाभाविक सामूहिक और काव्यात्मक अर्थ देता है तथा दृश्य आकाश से व्यापक स्वर्गीय विस्तार को व्यक्त कर सकता है।
- source_word: מְסַפְּרִים
  choice: वर्णन करता है
  rationale: ספר का कृदन्त रूप लगातार बताने या बयान करने का भाव रखता है; ‘वर्णन करता है’ हिन्दी में सृष्टि के मानवीकरण और वर्तमानगत क्रिया, दोनों को सहज रूप से रखता है।
- source_word: כְּבוֹד
  choice: महिमा
  rationale: ‘महिमा’ כבוד के गौरव, प्रतिष्ठा और तेज के धार्मिक-काव्यात्मक अर्थ को आधुनिक हिन्दी में स्वाभाविक रूप से व्यक्त करती है।
- source_word: אֵל
  choice: परमेश्वर
  rationale: यहाँ אֵל सृष्टिकर्ता ईश्वर के लिए उपाधि है; ‘परमेश्वर’ हिन्दी बाइबलीय प्रयोग में स्पष्ट और गरिमापूर्ण है, जबकि ‘एल’ अनावश्यक रूप से इसे व्यक्तिनाम ठहरा सकता है।
- source_word: וּמַעֲשֵׂה יָדָיו
  choice: उसके हाथों के काम
  rationale: यह रूप मूल के मानव-सदृश ठोस मुहावरे को बनाए रखता है और उसे केवल सामान्य ‘रचना’ में विलीन नहीं करता।
- source_word: מַגִּיד
  choice: घोषणा करता है
  rationale: נגד के हिफ़ील कृदन्त का अर्थ प्रकट करना या घोषित करना है; यह पहले अर्ध-पद के समानांतर रहते हुए शब्दगत पुनरावृत्ति से बचता है।
- source_word: הָרָקִיעַ
  choice: नभमंडल
  rationale: ‘नभमंडल’ फैले हुए आकाशीय विस्तार या मेहराब की काव्यात्मक छवि रखता है; पाठकों के लिए वैकल्पिक सरल अर्थ पादटिप्पणी में दिया गया है।
theological_decisions:
- issue: אֵל का अनुवाद
  choice: परमेश्वर
  alternative: एल
  rationale: इस प्रसंग में यह उस सृष्टिकर्ता परम सत्ता की उपाधि है जिसकी महिमा सृष्टि प्रकट करती है। लिप्यंतरण ‘एल’ पाठ में ऐसे व्यक्तिनाम का विशेष बल ला सकता है जिसकी यहाँ आवश्यकता नहीं है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण काव्यात्मक शैली रखी गई है। समानांतर पंक्तियों में ‘वर्णन करता है’ और ‘घोषणा करता है’ मूल के दो अलग क्रियापदों को दर्शाते हैं। ‘आकाश’ के साथ हिन्दी की स्वाभाविक एकवचन क्रिया प्रयुक्त हुई है।
