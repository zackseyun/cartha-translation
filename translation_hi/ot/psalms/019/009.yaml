  text: याहवे का भय निर्मल[a] है और सदा बना रहता है[b]; याहवे के न्याय-विधान[c] सत्य हैं; वे सब के सब न्यायपूर्ण हैं[d]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘शुद्ध’।
    reason: lexical_alternative
  - marker: b
    text: 'शाब्दिक अर्थ: ‘सदा खड़ा रहता है।’'
    reason: lexical_alternative
  - marker: c
    text: या ‘याहवे के न्याय’ अथवा ‘याहवे की विधियाँ’।
    reason: lexical_alternative
  - marker: d
    text: इब्रानी में भाव है कि वे सभी मिलकर पूरी तरह न्यायपूर्ण हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: יִרְאַת יְהוָה
  choice: याहवे का भय
  rationale: इब्रानी रचना याहवे के प्रति श्रद्धा, विस्मय और भय के समृद्ध भाव को समेटती है। ‘भय’ मूल अभिव्यक्ति को बनाए रखता है और इसे केवल ‘उपासना’ या ‘धर्म’ कहकर संकुचित नहीं करता।
- source_word: טְהוֹרָה
  choice: निर्मल
  rationale: यह शब्द शुद्धता या स्वच्छता व्यक्त करता है। ‘निर्मल’ आधुनिक हिन्दी में नैतिक और गुणात्मक शुद्धता का स्वाभाविक, गरिमापूर्ण रूप है।
- source_word: עוֹמֶדֶת לָעַד
  choice: सदा बना रहता है
  rationale: शाब्दिक अर्थ ‘सदा खड़ा रहता है’ है; हिन्दी मुहावरे में ‘सदा बना रहता है’ स्थायित्व का भाव अधिक स्वाभाविक रूप से देता है।
- source_word: מִשְׁפְּטֵי יְהוָה
  choice: याहवे के न्याय-विधान
  rationale: מִשְׁפָּטִים में न्यायिक निर्णयों और प्रामाणिक विधानों, दोनों का भाव हो सकता है। ‘न्याय-विधान’ इस व्यापकता को हिन्दी में बनाए रखता है।
- source_word: אֱמֶת
  choice: सत्य हैं
  rationale: यह बहुवचन कर्ता के साथ विधेय रूप में है। ‘सत्य हैं’ इब्रानी कथन का सीधा और स्वाभाविक हिन्दी रूप है।
- source_word: צָדְקוּ יַחְדָּו
  choice: वे सब-के-सब धर्ममय हैं
  rationale: क्रिया और क्रियाविशेषण मिलकर इन न्याय-विधानों की सामूहिक और पूर्ण धार्मिकता व्यक्त करते हैं। ‘सब-के-सब’ יַחְדָּו के समष्टिगत बल को सुरक्षित रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: चार-अक्षरीय परमेश्वर-नाम को उपाधि से बदलने के बजाय उसके प्रचलित लिप्यंतरण ‘याहवे’ से प्रस्तुत किया गया है।
theological_decisions:
- issue: परमेश्वर के प्रकाशन का वर्णन करने वाली शृंखला में ‘याहवे का भय’ किस बात को सूचित करता है
  choice: मूल अभिव्यक्ति ‘याहवे का भय’ को बनाए रखना
  alternative: ‘याहवे की उपासना’ या ‘याहवे का धर्म’
  rationale: यह अभिव्यक्ति श्रद्धा, विस्मय, भय और वाचा-संबंधी निष्ठा के बीच की धार्मिक गहनता को बनाए रखती है; कोई एक व्याख्यात्मक विकल्प इसे अनावश्यक रूप से सीमित कर देगा।
- issue: צָדְקוּ יַחְדָּו में धार्मिकता का सामूहिक बल
  choice: ‘वे सब-के-सब धर्ममय हैं’
  alternative: ‘हर एक धर्ममय है’ या ‘वे पूरी तरह उचित हैं’
  rationale: चुना हुआ रूप न्याय-विधानों को एक समग्र समूह के रूप में पूर्णतः धर्ममय बताता है और इब्रानी की सामूहिकता को सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण और सार्वजनिक पाठ के योग्य रूप अपनाया गया है। वाक्य की समानांतर काव्यात्मक संरचना बनाए रखी गई है; अत्यधिक संस्कृतनिष्ठ या सांप्रदायिक शब्दावली से बचा गया है।
