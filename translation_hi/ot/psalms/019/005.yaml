  text: And it is like a bridegroom coming out from his wedding chamber[a]; it rejoices like a warrior to run a course.
translation:
  language: hi
  text: और वह दूल्हे के समान है, जो अपने विवाह-मंडप[a] से निकलता है; वह वीर के समान अपने मार्ग पर दौड़ने को आनन्दित होता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘अपने विवाह-कक्ष से।’ इब्रानी शब्द חֻפָּה विवाह-मंडप अथवा दूल्हे के कक्ष का बोध करा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוּא
  choice: और वह
  rationale: सर्वनाम पिछले पद के सूर्य की ओर संकेत करता है। हिन्दी में सूर्य पुल्लिंग है, इसलिए ‘वह’ स्वाभाविक है; ‘और’ से इब्रानी संयोजक भी सुरक्षित रहता है।
- source_word: כְּחָתָן
  choice: दूल्हे के समान
  rationale: חָתָן का अर्थ दूल्हा है; यह विवाह-संबंधी काव्यात्मक बिंब को स्पष्ट और सहज रखता है।
- source_word: יֹצֵא
  choice: निकलता है
  rationale: יצא का कृदन्त यहाँ जीवंत, वर्तमान-जैसी क्रिया व्यक्त करता है; ‘निकलता है’ आधुनिक हिन्दी में स्वाभाविक है।
- source_word: מֵחֻפָּתוֹ
  choice: अपने विवाह-मंडप से
  rationale: חֻפָּה विवाह का मंडप अथवा दूल्हे का कक्ष सूचित कर सकता है। ‘विवाह-मंडप’ हिन्दी पाठक के लिए विवाह-बिंब को स्वाभाविक रूप से व्यक्त करता है, जबकि दूसरी सम्भावना पादटिप्पणी में रखी गई है।
- source_word: יָשִׂישׂ
  choice: हर्षित होता है
  rationale: यह क्रिया उल्लास और उमंग व्यक्त करती है। ‘हर्षित होता है’ गरिमापूर्ण तथा सहज है और सूर्य के पुल्लिंग संदर्भ से मेल खाता है।
- source_word: כְּגִבּוֹר
  choice: वीर के समान
  rationale: גִּבּוֹר बलवान वीर या योद्धा को सूचित करता है। ‘वीर’ दौड़ने की सामर्थ्य और काव्यात्मक गरिमा दोनों को संक्षेप में बनाए रखता है।
- source_word: לָרוּץ
  choice: दौड़ने के लिए
  rationale: रूप का सीधा अर्थ ‘दौड़ना’ है; इसमें ऐसी प्रतिस्पर्धा नहीं जोड़ी गई जो मूल में स्पष्ट नहीं है।
- source_word: אֹרַח
  choice: अपना मार्ग
  rationale: אֹרַח का अर्थ मार्ग या पथ है। संदर्भ में यह सूर्य का आकाशीय मार्ग है; हिन्दी में ‘अपना मार्ग’ संबंध को स्वाभाविक बनाता है, यद्यपि इब्रानी में अलग अधिकारसूचक सर्वनाम नहीं है।
