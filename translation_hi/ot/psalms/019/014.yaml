id: PSA.19.14
reference: Psalms 19:14
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: יִֽהְי֥וּ לְ/רָצ֨וֹן אִמְרֵי פִ֡/י וְ/הֶגְי֣וֹן לִבִּ֣/י לְ/פָנֶ֑י/ךָ יְ֝הוָ֗ה צוּרִ֥/י וְ/גֹאֲלִֽ/י׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/019/014.yaml
  text: May the words of my mouth and the meditation of my heart be acceptable before you[a], O Yahweh[b], my rock and my redeemer.
translation:
  language: hi
  text: मेरे मुँह के वचन और मेरे हृदय का मनन तेरे सामने[a] ग्रहणयोग्य हों, हे याहवे, मेरी चट्टान और मेरे छुड़ानेवाले[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “तेरी दृष्टि में।” इब्रानी में शाब्दिक भाव “तेरे मुख/उपस्थिति के सामने” है।
    reason: lexical_alternative
  - marker: b
    text: “छुड़ानेवाला” उस व्यक्ति के लिए प्रयुक्त शब्द का अनुवाद है जो छुड़ाता या वापस प्राप्त करता है; इस्राएली व्यवस्था में यह भूमिका प्रायः किसी निकट संबंधी के दायित्वों से जुड़ी थी।
    reason: cultural_note
lexical_decisions:
- source_word: יִהְיוּ
  choice: हों
  rationale: प्रार्थना और कामना के प्रसंग में प्रयुक्त अपूर्ण क्रिया का विधिलिंग-सदृश भाव स्वाभाविक हिन्दी में “हों” से व्यक्त होता है।
- source_word: לְרָצוֹן
  choice: ग्रहणयोग्य
  rationale: यह पद परमेश्वर के सम्मुख स्वीकार और प्रसन्नता पाने का भाव रखता है; “ग्रहणयोग्य” उपासना-संबंधी अर्थ को संक्षेप में बनाए रखता है।
- source_word: אִמְרֵי פִי
  choice: मेरे मुँह के वचन
  rationale: मूल की ठोस काव्यात्मक अभिव्यक्ति को सीधे और गरिमापूर्ण हिन्दी में सुरक्षित रखा गया है।
- source_word: הֶגְיוֹן לִבִּי
  choice: मेरे हृदय का मनन
  rationale: הֶגְיוֹן भीतर के चिंतन, मनन या मौन विचार को सूचित कर सकता है; “मनन” इस अर्थ-विस्तार को पर्याप्त रूप से बनाए रखता है।
- source_word: לְפָנֶיךָ
  choice: तेरे सामने
  rationale: शाब्दिक भाव “तेरे मुख/उपस्थिति के आगे” है; “तेरे सामने” सम्बन्धपरक और मूल्यांकनात्मक दोनों आशयों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: יְהוָה
  choice: यहवे
  rationale: चार-अक्षरीय दिव्य नाम को किसी उपाधि से बदलने के बजाय हिन्दी में प्रचलित निकट लिप्यंतरण “यहवे” दिया गया है।
- source_word: צוּרִי
  choice: मेरी चट्टान
  rationale: परमेश्वर के लिए स्थिरता और सुरक्षा का मूल रूपक बिना व्याख्यात्मक विस्तार के सुरक्षित रखा गया है।
- source_word: וְגֹאֲלִי
  choice: और मेरे छुड़ानेवाले
  rationale: גאל छुड़ाने, वापस पाने या निकट-संबंधी के दायित्व के अनुसार उद्धार करने का भाव रखता है; “छुड़ानेवाला” सामान्य पाठक के लिए स्पष्ट है और केवल कानूनी रिश्तेदारी तक अर्थ को सीमित नहीं करता।
theological_decisions:
- issue: दिव्य नाम יְהוָה का अनुवाद
  choice: हे यहवे
  alternative: हे यहोवा
  rationale: मूल पाठ व्यक्तिगत दिव्य नाम का प्रयोग करता है। उसे “प्रभु” जैसी उपाधि से प्रतिस्थापित न कर, हिन्दी में उसका निकट लिप्यंतरण रखा गया है।
- issue: צוּרִי का रूपक
  choice: मेरी चट्टान
  alternative: मेरा शरणस्थान
  rationale: मूल का काव्यात्मक रूपक सुरक्षित रखा गया है; “शरणस्थान” उसका सम्भावित आशय बताता, पर मूल चित्र को बदल देता।
- issue: גֹאֲלִי में छुड़ाने वाले की भूमिका
  choice: मेरे छुड़ानेवाले
  alternative: मेरे निकट-संबंधी छुड़ानेवाले
  rationale: इस शब्द में इस्राएली व्यवस्था की निकट-संबंधी भूमिका की पृष्ठभूमि हो सकती है, पर इस संबोधन में उसे अनिवार्य रूप से स्पष्ट करना अर्थ को आवश्यकता से अधिक सीमित करेगा।
translation_notes:
  register: आधुनिक मानक हिन्दी में प्रार्थनापूर्ण, काव्यात्मक और गरिमापूर्ण शैली रखी गई है। परमेश्वर को संबोधन में एकवचन आत्मीय “तेरे” मूल इब्रानी के सीधे व्यक्तिगत संबोधन को दर्शाता है।
