- source_word: י֣וֹם לְיוֹם
  choice: एक दिन दूसरे दिन को
  rationale: यह रूप एक दिन से दूसरे दिन तक क्रम और संप्रेषण की काव्यात्मक छवि को बनाए रखता है और इब्रानी पुनरुक्ति को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: יַבִּיעַ
  choice: उंडेलता है
  rationale: हिफ़ील क्रिया में उमड़ने या बहुतायत से बह निकलने की सजीव छवि है; ‘उंडेलता है’ केवल बोलने की अपेक्षा उस प्रचुर प्रवाह को बेहतर रखता है।
- source_word: אֹמֶר
  choice: वाणी
  rationale: यहाँ शब्द सामान्य मौखिक अभिव्यक्ति को दर्शाता है; ‘वाणी’ काव्यात्मक, गरिमापूर्ण और सहज हिन्दी है।
- source_word: וְלַיְלָה לְּלַיְלָה
  choice: और एक रात दूसरी रात को
  rationale: यह पहले चरण के समानांतर रातों के क्रम और एक से दूसरी तक संप्रेषण की छवि बनाए रखता है।
- source_word: יְחַוֶּה
  choice: प्रकट करती है
  rationale: पिएल रूप का अर्थ किसी बात को ज्ञात कराना या घोषित करना है; ‘प्रकट करती है’ सृष्टि द्वारा ज्ञान उद्घाटित किए जाने की छवि को स्वाभाविक रूप से व्यक्त करता है।
- source_word: דָּעַת
  choice: ज्ञान
  rationale: यह मूल संज्ञा का सीधा और प्रसंगानुकूल हिन्दी पर्याय है तथा पहले चरण की ‘वाणी’ के साथ वैचारिक समानांतरता रखता है।
