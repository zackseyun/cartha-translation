  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ व्यक्तिगत वाचा-नाम का प्रयोग करता है। ‘याहवे’ उसे उपाधि से प्रतिस्थापित किए बिना आधुनिक हिन्दी में प्रस्तुत करता है।
- issue: בָּרָה का अर्थ
  choice: निर्मल
  alternative: उज्ज्वल; स्पष्ट
  rationale: मूल विशेषण मुख्यतः शुद्धता का भाव देता है, जबकि अगले वाक्यांश ‘आँखों को ज्योति देती है’ के कारण उज्ज्वलता या स्पष्टता का अर्थ भी सन्दर्भ में सम्भव है; इस तनाव को पादटिप्पणी में सुरक्षित रखा गया है।
