  yaml_path: translation/ot/psalms/019/008.yaml
  text: The precepts of Yahweh are right[a], rejoicing the heart; the commandment of Yahweh is pure, enlightening the eyes.
translation:
  language: hi
  text: 'याहवे के निर्देश सही हैं, वे हृदय को आनन्दित करते हैं;

    याहवे की आज्ञा निर्मल[a] है, वह आँखों को ज्योति देती है।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘उज्ज्वल’ अथवा ‘स्पष्ट’; इब्रानी विशेषण मुख्यतः शुद्धता या निर्मलता का भाव देता है, पर अगले वाक्यांश ‘आँखों को ज्योति देती है’ के समानान्तर उज्ज्वलता या स्पष्टता का भाव भी सम्भव है।
    reason: lexical_alternative
lexical_decisions:
- source_word: פִּקּוּדֵי
  choice: निर्देश
  rationale: यह शब्द ठहराए हुए आदेशों या बाध्यकारी निर्देशों को दर्शाता है। ‘निर्देश’ आधुनिक हिन्दी में स्वाभाविक है और आगे आए מִצְוָה (‘आज्ञा’) से इसका भेद बनाए रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय हिन्दी लिपि में लिप्यंतरित किया गया है।
- source_word: יְשָׁרִים
  choice: सही
  rationale: बहुवचन विशेषण यहाँ याहवे के निर्देशों के सही और उचित होने को व्यक्त करता है; ‘सही’ आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: מְשַׂמְּחֵי לֵב
  choice: हृदय को आनन्दित करते हैं
  rationale: कारक कृदन्त का निरन्तर प्रभाव और לֵב को उसके कर्म के रूप में सुरक्षित रखा गया है।
- source_word: לֵב
  choice: हृदय
  rationale: काव्यात्मक सन्दर्भ में ‘हृदय’ इब्रानी रूपक को बनाए रखता है और मनुष्य के भीतरी जीवन को व्यापक रूप से व्यक्त कर सकता है।
- source_word: מִצְוַת
  choice: आज्ञा
  rationale: एकवचन रूप को बनाए रखते हुए वाचा-संबंधी आदेश का भाव व्यक्त किया गया है और इसे פִּקּוּדֵי (‘निर्देश’) से अलग रखा गया है।
- source_word: בָּרָה
  choice: निर्मल
  rationale: इस विशेषण का मूल भाव शुद्धता और निष्कलंकता है। ‘निर्मल’ काव्यात्मक गरिमा रखता है; ‘उज्ज्वल/स्पष्ट’ सम्भव अर्थ-विस्तार है, जिसे पादटिप्पणी में रखा गया है।
- source_word: מְאִירַת עֵינָיִם
  choice: आँखों को ज्योति देती है
  rationale: कारक अर्थ और प्रकाश के ठोस रूपक दोनों को सहज हिन्दी में सुरक्षित रखा गया है।
- source_word: עֵינָיִם
  choice: आँखों
  rationale: बोध या दृष्टि जैसे अमूर्त अर्थ से बदलने के बजाय मूल ठोस बिम्ब को बनाए रखा गया है।
theological_decisions:
