  choice: दाऊद का
  alternative: दाऊद द्वारा रचित; दाऊद के लिए
  rationale: इब्रानी पदबंध दाऊद की रचनाकारिता, उनसे संबंध, अथवा उन्हें समर्पण—इनमें से किसी अर्थ की ओर संकेत कर सकता है। मुख्य पाठ किसी एक अर्थ को अनावश्यक रूप से निश्चित नहीं करता, और पादटिप्पणी वास्तविक अस्पष्टता स्पष्ट करती है।
