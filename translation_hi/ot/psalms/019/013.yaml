source:
  edition: WLC
  text: גַּ֤ם מִ/זֵּדִ֨ים חֲשֹׂ֬ךְ עַבְדֶּ֗/ךָ אַֽל יִמְשְׁלוּ בִ֣/י אָ֣ז אֵיתָ֑ם וְ֝/נִקֵּ֗יתִי מִ/פֶּ֥שַֽׁע רָֽב׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/019/013.yaml
  text: Also keep your servant back from presumptuous sins[a]; do not let them rule over me[d][c][b]. Then I will be blameless and be cleared from great transgression.
translation:
  language: hi
  text: जान-बूझकर किए गए पापों से भी अपने सेवक को बचाए रख[a]; उन्हें मुझ पर प्रभुत्व न करने दे। तब मैं निर्दोष[b] ठहरूँगा और बड़े अपराध[c] से मुक्त हो जाऊँगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अभिमानी लोगों से।” हिब्रू शब्द अहंकारी व्यक्तियों अथवा जान-बूझकर, धृष्टता से किए गए पापों, दोनों का संकेत दे सकता है।
    reason: alternative_reading
  - marker: b
    text: या, “संपूर्ण हो जाऊँगा” अथवा “खरा ठहरूँगा।” हिब्रू शब्द अखंडता या पूर्णता का भाव भी रखता है।
    reason: lexical_alternative
  - marker: c
    text: या, “बड़े विद्रोह से।”
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם
  choice: भी
  rationale: पिछले पद में छिपे दोषों की प्रार्थना से इसका योगसूचक संबंध स्वाभाविक हिंदी में बनाए रखता है।
- source_word: מִזֵּדִים
  choice: ढिठाई के पापों से
  rationale: शब्द घमंडी लोगों अथवा अहंकारपूर्ण, जान-बूझकर किए गए पापों का संकेत दे सकता है। पिछले पद के दोषों के समानांतर यहाँ पापों का अर्थ मुख्य पाठ में उपयुक्त है; ‘ढिठाई’ उसके गर्व और धृष्टता के भाव को रखती है।
- source_word: חֲשֹׂךְ
  choice: रोके रख
  rationale: ईश्वर से सेवक को ऐसे पापों से नियंत्रित और दूर रखने की विनती व्यक्त करता है।
- source_word: עַבְדֶּךָ
  choice: अपने सेवक को
  rationale: प्रार्थना में परमेश्वर के प्रति अधीनता को स्वाभाविक और प्रतिष्ठित हिंदी में व्यक्त करता है।
- source_word: אַל יִמְשְׁלוּ בִי
  choice: वे मुझ पर शासन न करने पाएँ
  rationale: משל עם ב का प्रभुत्व जमाने का रूपक स्पष्ट रखता है और पापों को कर्ता मानने वाले हिब्रू बहुवचन से मेल खाता है।
- source_word: אָז
  choice: तब
  rationale: ईश्वर द्वारा रोककर रखे जाने के परिणामी संबंध को सीधे व्यक्त करता है।
- source_word: אֵיתָם
  choice: मैं निर्दोष ठहरूँगा
  rationale: नैतिक अखंडता और दोषरहित अवस्था का भाव देता है, पर पूर्ण पापहीनता का अनावश्यक दावा नहीं करता।
- source_word: וְנִקֵּיתִי
  choice: मुक्त हो जाऊँगा
  rationale: נקה के दोष या दंडनीयता से छूटने के अर्थ को सहज आधुनिक हिंदी में व्यक्त करता है।
- source_word: מִפֶּשַׁע רָב
  choice: बड़े अपराध से
  rationale: פשע के गंभीर उल्लंघन या विद्रोह के अर्थ और רָב की तीव्रता को संक्षिप्त, स्वाभाविक हिंदी में रखता है।
theological_decisions:
- issue: מִזֵּדִים का संदर्भ
  choice: ढिठाई के पाप
  alternative: घमंडी लोग
  rationale: निकट संदर्भ छिपे दोषों और पापों पर केंद्रित है, और उनके शासन करने की अगली पंक्ति पाप के प्रभुत्व पर स्वाभाविक रूप से लागू होती है। फिर भी व्यक्ति-वाचक अर्थ वास्तविक संभावना है, इसलिए उसे पादटिप्पणी में रखा गया है।
- issue: אֵיתָם का आशय
  choice: निर्दोष ठहरूँगा—नैतिक अखंडता के अर्थ में
  alternative: सिद्ध/सम्पूर्ण हो जाऊँगा अथवा निर्दोष माना जाऊँगा
  rationale: शब्द संपूर्णता, खराई या निर्दोषता व्यक्त कर सकता है। चयन संदर्भगत नैतिक अखंडता रखता है, बिना निरपेक्ष पापहीनता आरोपित किए।
- issue: פֶּשַׁע का स्वर
  choice: अपराध
  alternative: विद्रोह
  rationale: ‘अपराध’ आधुनिक पाठक के लिए सहज है, जबकि मूल में परमेश्वर के विरुद्ध विद्रोह का अधिक तीखा भाव भी संभव है और पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: आधुनिक मानक हिंदी का सहज किंतु गरिमामय प्रार्थनात्मक स्वर। ‘ढिठाई के पाप’ मूल के अहंकार और जान-बूझकर उल्लंघन, दोनों आयामों को सामान्य पाठक के लिए समझने योग्य रूप में रखता है। सभी पादटिप्पणी चिह्न मुख्य पाठ में उपस्थित हैं।
