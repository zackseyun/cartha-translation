  text: वे सोने से, वरन् बहुत कुन्दन से भी अधिक मनभावने हैं[a], और मधु तथा छत्ते से टपकते मधु से भी अधिक मीठे हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘चाहने योग्य हैं ... और मधु से मीठे हैं—हाँ, छत्तों से टपकते मधु से।’ इब्रानी में कृदन्तीय रूपों के साथ तुलनात्मक वाक्यांश हैं; अंतिम पदबंध का अधिक शाब्दिक अनुवाद ‘छत्तों का टपकता मधु’ हो सकता है।
