source:
  edition: WLC
  text: מִ/קְצֵ֤ה הַ/שָּׁמַ֨יִם מֽוֹצָא֗/וֹ וּ/תְקוּפָת֥/וֹ עַל קְצוֹתָ֑/ם וְ/אֵ֥ין נִ֝סְתָּ֗ר מֵֽ/חַמָּת/וֹ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/019/006.yaml
  text: Its rising is from one end of the heavens[a], and its circuit to their ends[c][b], and nothing is hidden from its heat.
translation:
  language: hi
  text: उसका उदय आकाश के एक छोर से होता है[a], और उसकी परिक्रमा आकाश के छोरों तक होती है[b]; उसकी तपिश से कुछ भी छिपा नहीं रहता।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसका निकलना।” इब्रानी शब्द सूर्य के उदित होने या अपने आरम्भ-बिन्दु से निकलने, दोनों का बोध दे सकता है।
    reason: lexical_alternative
  - marker: b
    text: या, “उसका चक्कर” अथवा “उसका मार्ग।” यहाँ ‘परिक्रमा’ सूर्य द्वारा आकाश में अपना पूरा पथ तय करने का काव्यात्मक चित्र है।
    reason: lexical_alternative
lexical_decisions:
- source_word: מִקְצֵה הַשָּׁמַיִם
  choice: आकाश के एक छोर से
  rationale: קָצֶה का अर्थ ‘छोर’ या ‘सीमा’ है। हिन्दी में שָׁמַיִם के लिए एकवचन ‘आकाश’ स्वाभाविक है; ‘एक छोर’ आरम्भ-बिन्दु का भाव स्पष्ट करता है।
- source_word: מוֹצָאוֹ
  choice: उसका उदय
  rationale: מוֹצָא का मूल भाव ‘निकलना’ है और सूर्य के प्रसंग में ‘उदय’ स्वाभाविक अर्थ देता है। वैकल्पिक शाब्दिक अर्थ पादटिप्पणी में रखा गया है।
- source_word: וּתְקוּפָתוֹ
  choice: और उसकी परिक्रमा
  rationale: תְּקוּפָה चक्कर, घूमने या पूरा मार्ग तय करने का बोध देता है। ‘परिक्रमा’ काव्यात्मक और संक्षिप्त है, यद्यपि यहाँ आधुनिक खगोलीय तकनीकी कथन अभिप्रेत नहीं है।
- source_word: עַל קְצוֹתָם
  choice: उसके दूसरे छोर तक
  rationale: सन्दर्भ में עַל मार्ग की सीमा या पहुँच दर्शाता है। बहुवचन प्रत्यय का स्वाभाविक हिन्दी रूप आकाश के विपरीत ‘दूसरे छोर’ के रूप में व्यक्त किया गया है।
- source_word: וְאֵין נִסְתָּר
  choice: कुछ भी छिपा नहीं रहता
  rationale: अस्तित्व-निषेध אֵין और निफ़ाल कृदन्त נִסְתָּר मिलकर सार्वभौमिक निषेध व्यक्त करते हैं; यह हिन्दी में सहज और प्रभावशाली है।
- source_word: מֵחַמָּתוֹ
  choice: उसकी तपिश से
  rationale: חַמָּה सूर्य की तीव्र गर्मी को दर्शाता है। ‘तपिश’ काव्यात्मक गरिमा बनाए रखते हुए ‘गरमाहट’ से अधिक प्रबल है।
theological_decisions:
- issue: सूर्य के मानवीकरण की मात्रा
  choice: हिन्दी के स्वाभाविक पुल्लिंग सर्वनाम ‘उसका/उसकी’ का प्रयोग, बिना सूर्य को देवता मानने का संकेत दिए
  alternative: संज्ञा ‘सूर्य’ को बार-बार दोहराकर सर्वनाम से बचना
  rationale: हिन्दी में ‘सूर्य’ व्याकरणिक रूप से पुल्लिंग है; इसलिए पुल्लिंग सर्वनाम सामान्य व्याकरण है, धार्मिक मानवीकरण नहीं। काव्यात्मक गति को बनाए रखने के लिए सर्वनाम उपयुक्त हैं।
- issue: תְּקוּפָה में गति का स्वरूप
  choice: परिक्रमा
  alternative: मार्ग या चक्कर
  rationale: शब्द घूमते हुए पूरे पथ का भाव रख सकता है। ‘परिक्रमा’ उस काव्यात्मक दृश्य को सुरक्षित रखता है, पर इसे आधुनिक वैज्ञानिक कक्षीय विवरण के रूप में नहीं पढ़ना चाहिए।
translation_notes:
  register: आधुनिक मानक हिन्दी, काव्यात्मक किन्तु सरल और गरिमापूर्ण। ‘आकाश’ हिन्दी में स्वाभाविक रूप से इब्रानी द्विवचन/बहुवचन שָׁמַיִם को व्यक्त करता है। अर्धविराम पद की दो समांतर गतियों और अंतिम परिणाम को स्पष्ट करता है।
