lexical_decisions:
- source_word: אֵין
  choice: न कोई … है, न कोई …
  rationale: यह अस्तित्व का निषेध व्यक्त करता है। दो समानांतर पदों में “न कोई” स्वाभाविक हिन्दी है।
- source_word: אֹמֶר
  choice: वाणी
  rationale: यह किसी एक कथन के बजाय व्यापक मौखिक अभिव्यक्ति को दर्शाता है और काव्यात्मक सन्दर्भ में “शब्द” के साथ स्वाभाविक बैठता है।
- source_word: דְּבָרִים
  choice: शब्द
  rationale: यहाँ संचार और सुनने के सन्दर्भ में ठोस अर्थ “शब्द” उपयुक्त है।
- source_word: בְּלִי
  choice: नहीं
  rationale: यह अगले निष्क्रिय क्रियारूप के साथ नकारात्मक परिस्थिति प्रकट करता है; “सुनाई नहीं देती” आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: נִשְׁמָע
  choice: सुनाई देती
  rationale: שׁמע का निष्क्रिय अर्थ सीधे और सहज रूप में व्यक्त होता है।
- source_word: קוֹלָם
  choice: उनकी आवाज़
  rationale: קוֹל का अर्थ “आवाज़” या “ध्वनि” हो सकता है। “आवाज़” आकाश के मानवीकरण को बनाए रखती है, जबकि वैकल्पिक अर्थ पादटिप्पणी में सुरक्षित है।
theological_decisions:
- issue: आकाश की गवाही को शब्दरहित संचार के रूप में समझना
  choice: पद को सामान्य बोली और सुनाई देने वाले शब्दों के अभाव के कथन के रूप में अनूदित किया गया है।
  alternative: पंक्ति का अर्थ यह भी समझा जा सकता है कि उनकी गवाही वाणी और शब्दों के बिना निकलती है—अर्थात मौन होते हुए भी व्यापक गवाही।
  rationale: 'इब्रानी वाक्यरचना साधारण वाणी और सुनाई देने वाले शब्दों के अभाव का अर्थ ग्रहण करने देती है। इससे काव्यात्मक तनाव बना रहता है: सृष्टि परमेश्वर की महिमा घोषित करती है, पर सामान्य मानवीय भाषा में नहीं।'
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। “वाणी” काव्यात्मक ऊँचाई बनाए रखती है, जबकि “सुनाई नहीं देती” सामान्य पाठक के लिए स्वाभाविक है।
