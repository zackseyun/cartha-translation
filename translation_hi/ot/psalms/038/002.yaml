- source_word: וַתִּנְחַת עָלַי
  choice: मुझ पर आ पड़ा है
  rationale: उसी धातु के नीचे आने और भार डालने के चित्र को वर्तमान प्रभाव सहित सहज हिन्दी में व्यक्त करता है।
- source_word: יָדֶךָ
  choice: तेरा हाथ
