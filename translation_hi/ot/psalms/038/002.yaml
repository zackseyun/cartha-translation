theological_decisions:
- issue: परमेश्वर की क्रिया के लिए मानव-सदृश भाषा
  choice: ‘तेरा हाथ’ को अक्षरशः बनाए रखना
  alternative: ‘तेरी शक्ति’ या ‘तेरा दण्ड’
  rationale: हिब्रू ठोस रूपक का प्रयोग करता है। अक्षरशः अभिव्यक्ति परमेश्वर की सक्रिय पीड़ादायक या अनुशासनकारी क्रिया की सम्भावित अर्थ-सीमा को खुला रखती है और किसी एक धर्मवैज्ञानिक व्याख्या को आरोपित नहीं करती।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, काव्यात्मक और गरिमापूर्ण रूप। भजन की सीधी प्रार्थनात्मक संबोधन-शैली के अनुरूप ‘तेरे/तेरा’ रखा गया है। समान हिब्रू धातु की पुनरावृत्ति हिन्दी में क्रमशः ‘धँस गए’ और ‘आ पड़ा’ से व्यक्त की गई है, ताकि दोनों पंक्तियाँ स्वाभाविक रहें और नीचे की ओर गति/दबाव का साझा चित्र भी बना रहे।
