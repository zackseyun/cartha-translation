  text: וּ/מְשַׁלְּמֵ֣י רָ֭עָה תַּ֣חַת טוֹבָ֑ה יִ֝שְׂטְנ֗וּ/נִי תַּ֣חַת רדופ/י טֽוֹב־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/038/020.yaml
  text: And those who repay evil for good oppose me[a], because I pursue what is good.
translation:
  language: hi
  text: जो भलाई के बदले बुराई करते हैं, वे मेरा विरोध करते हैं[a], क्योंकि मैं भलाई का अनुसरण करता हूँ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, अधिक शाब्दिक रूप में, “मेरे भलाई का अनुसरण करने के बदले वे मेरा विरोध करते हैं।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמְשַׁלְּמֵי
  choice: जो...करते हैं
  rationale: שלם का कृदन्त यहाँ प्रतिदान देने वालों को दर्शाता है। हिंदी मुहावरे ‘भलाई के बदले बुराई करना’ में प्रतिदान का भाव स्वाभाविक और स्पष्ट है।
- source_word: רָעָה
  choice: बुराई
  rationale: यह नैतिक अर्थ को बनाए रखता है और ‘भलाई’ के साथ मूल विरोध को स्पष्ट करता है।
- source_word: תַּחַת
  choice: के बदले / क्योंकि
  rationale: पहली बार यह विनिमय या प्रतिदान को व्यक्त करता है। दूसरी बार उसी संबंध को स्वाभाविक हिंदी में कारणसूचक ‘क्योंकि’ से व्यक्त किया गया है; अधिक शाब्दिक विकल्प पादटिप्पणी में रखा गया है।
- source_word: טוֹבָה
  choice: भलाई
  rationale: यह किए या पाए गए अच्छे काम का संज्ञात्मक भाव देता है और ‘बुराई’ के साथ सहज विरोध बनाता है।
- source_word: יִשְׂטְנוּנִי
  choice: वे मेरा विरोध करते हैं
  rationale: שׂטן का मूल भाव विरोधी होना या विरोध करना है। यह अनावश्यक रूप से कानूनी ‘दोष लगाना’ अथवा भावात्मक ‘घृणा करना’ नहीं जोड़ता।
- source_word: רְדֹפִי
  choice: मैं...के पीछे चलता हूँ
  rationale: רדף का शाब्दिक अर्थ पीछा करना है। इस संदर्भ में यह भलाई को सक्रियता से अपनाने और साधने का अर्थ स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: טוֹב
  choice: भलाई
  rationale: विशेषण यहाँ संज्ञा के रूप में प्रयुक्त है; ‘भलाई’ हिंदी में उसके लक्ष्य को संक्षेप और स्पष्ट रूप से व्यक्त करता है।
theological_decisions:
- issue: दूसरे תַּחַת उपवाक्य का संबंध
  choice: क्योंकि मैं भलाई के पीछे चलता हूँ
  alternative: मेरे भलाई के पीछे चलने के बदले वे मेरा विरोध करते हैं
  rationale: हिब्रू संरचना प्रतिदान/कारण का संबंध रखती है। मुख्य पाठ में कारणसूचक रूप सहज हिंदी देता है, जबकि अधिक शाब्दिक प्रतिदान-संबंध पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिंदी। ‘भलाई के बदले बुराई करना’ प्रचलित मुहावरा है; ‘भलाई के पीछे चलना’ मूल के सक्रिय ‘पीछा करने’ के बिंब को बनाए रखता है।
