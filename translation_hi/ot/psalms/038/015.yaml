    text: 'इब्रानी में: ‘क्योंकि तेरे लिए/तेरी ओर, हे याहवे, मैंने आशा से प्रतीक्षा की है।’ क्रिया का अनुवाद ‘मैंने आशा रखी है’ या ‘मैंने आशा से प्रतीक्षा की है’ भी हो सकता है।'
