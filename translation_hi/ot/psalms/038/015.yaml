lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह आसपास के कथन का आधार प्रस्तुत करता है; हिन्दी में ‘क्योंकि’ इस कारणसूचक संबंध को स्वाभाविक रूप से व्यक्त करता है।
- source_word: לְךָ
  choice: तेरी
  rationale: יחל के साथ ל उस व्यक्ति को सूचित करता है जिसकी प्रतीक्षा की जाती है; ‘तेरी बाट’ मूल के ‘तेरे लिए’ भाव का स्वाभाविक हिन्दी रूप है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: चतुरक्षरीय दिव्य नाम को हिन्दी में प्रचलित व्यक्तिगत नाम ‘यहोवा’ से व्यक्त किया गया है, किसी उपाधि से नहीं।
- source_word: הוֹחָלְתִּי
  choice: मैं ... बाट जोहता हूँ
  rationale: क्रिया में आशापूर्ण प्रतीक्षा का भाव है। ‘बाट जोहना’ प्रतीक्षा और अपेक्षा दोनों को गरिमापूर्ण, सहज हिन्दी में व्यक्त करता है; सिद्ध रूप यहाँ स्थिर मनोभाव बताता है।
- source_word: אַתָּה
  choice: तू ही
  rationale: स्वतंत्र सर्वनाम का जोर ‘ही’ द्वारा व्यक्त किया गया है।
- source_word: תַעֲנֶה
  choice: उत्तर देगा
  rationale: क्रिया का सीधा अर्थ ‘उत्तर देना’ है। मूल में कर्म स्पष्ट नहीं है, इसलिए हिन्दी में भी ‘मुझे’ नहीं जोड़ा गया।
- source_word: אֲדֹנָי
  choice: प्रभु
  rationale: परमेश्वर को संबोधित करने वाली इस उपाधि का स्वाभाविक और प्रतिष्ठित हिन्दी रूप ‘प्रभु’ है।
- source_word: אֱלֹהָי
  choice: मेरे परमेश्वर
  rationale: प्रथम पुरुष संबंधसूचक प्रत्यय को स्पष्ट रूप से ‘मेरे’ द्वारा सुरक्षित रखा गया है।
theological_decisions:
- issue: दिव्य नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ में व्यक्तिगत दिव्य नाम है। हिन्दी बाइबलीय प्रयोग में ‘यहोवा’ व्यापक रूप से पहचाना जाता है और इसे ‘प्रभु’ जैसी उपाधि से अलग रखता है।
- issue: אַתָּה के जोर को व्यक्त करना
  choice: तू ही उत्तर देगा
  alternative: तू उत्तर देगा
  rationale: मूल में स्वतंत्र सर्वनाम जोर देता है; ‘ही’ इस बात को स्पष्ट करता है कि भजनकार उत्तर के लिए परमेश्वर की ओर ही देखता है, बिना उत्तर के आशय को विस्तार दिए।
translation_notes:
  register: आधुनिक मानक हिन्दी में काव्यात्मक किंतु सुबोध शैली रखी गई है। परमेश्वर के लिए एकवचन निकट संबोधन ‘तू/तेरी’ भजन की सीधी प्रार्थना के अनुरूप है। ‘बाट जोहना’ सामान्य ‘प्रतीक्षा करना’ की अपेक्षा काव्यात्मक है, पर आज भी सहज समझ में आता है।
