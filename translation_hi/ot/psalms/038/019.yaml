  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण काव्यात्मक गद्य। समानांतर रचना और ‘हो गए हैं’ की पुनरावृत्ति मूल की दो परिणामी क्रियाओं को दर्शाती है।
