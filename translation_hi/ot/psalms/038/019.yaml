  yaml_path: translation/ot/psalms/038/019.yaml
  text: And my enemies are alive and strong[a], and those who hate me falsely are many.
translation:
  language: hi
  text: और मेरे शत्रु जीवित और बलवान हैं, और जो मुझसे झूठा बैर रखते हैं[a], वे बहुत हो गए हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जो बिना कारण मुझसे बैर रखते हैं।” इब्रानी शब्द שָׁקֶר का शाब्दिक अर्थ “झूठ/असत्य” है; यह या तो उनके बैर के झूठे होने को या उसके निराधार होने को बता सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אֹיְבַי
  choice: मेरे शत्रु
  rationale: यह पद व्यक्तिगत विरोधियों को दर्शाता है; ‘मेरे शत्रु’ सीधा, स्वाभाविक और गरिमापूर्ण हिन्दी रूप है।
- source_word: חַיִּים
  choice: जीवित
  rationale: विशेषण सीधे ‘शत्रु’ को विशेषित करता है और भजनकार की निर्बल दशा के विपरीत उनके जीवित तथा सक्रिय बने रहने का भाव बनाए रखता है।
- source_word: עָצֵמוּ
  choice: बलवान हो गए हैं
  rationale: क्रिया बलवान या प्रबल हो जाने का भाव रखती है; यह रूप इब्रानी क्रिया के परिणामी पक्ष को ‘बलवान हैं’ की अपेक्षा अधिक स्पष्ट रूप से सुरक्षित रखता है।
- source_word: רַבּוּ
  choice: बहुत हो गए हैं
  rationale: क्रिया संख्या में बढ़ने या बहुत हो जाने का संकेत देती है; यह अनुवाद उस गतिशील भाव को बनाए रखता है।
- source_word: שֹׂנְאַי
  choice: जो ... मुझसे बैर रखते हैं
  rationale: कृदन्त का संज्ञात्मक प्रयोग है; यह रूप उसकी क्रियात्मक शक्ति को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: שָׁקֶר
  choice: झूठे तौर पर
  rationale: शब्द का मूल अर्थ ‘झूठ/असत्य’ है और यहाँ वह क्रियाविशेषण-सदृश है; चुना हुआ रूप उनकी शत्रुता की असत्यता को व्यक्त करता है, जबकि ‘बिना कारण’ को वैकल्पिक अर्थ के रूप में रखा गया है।
theological_decisions:
- issue: שָׁקֶר का संबंध और अर्थ
  choice: उनके बैर रखने को ‘झूठे तौर पर’ विशेषित किया गया है
  alternative: ‘बिना कारण मुझसे बैर रखते हैं’
  rationale: इब्रानी पदबंध यह खुला छोड़ता है कि उनका बैर झूठा/कपटपूर्ण है या निराधार; मुख्य पाठ मूल शब्द ‘असत्य’ के निकट रहता है और पादटिप्पणी संभावित निराधारता बताती है।
