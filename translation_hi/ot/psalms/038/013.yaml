  text: But I[a], like a deaf man, do not hear; and like a mute man[b], I do not open my mouth.
translation:
  language: hi
  text: परन्तु मैं बहरे के समान नहीं सुनता; और मूक व्यक्ति के समान—वह अपना मुँह नहीं खोलता।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַאֲנִי
  choice: परन्तु मैं
  rationale: संयोजक और सर्वनाम पिछले पदों में बोलनेवाले विरोधियों के बरक्स भजनकार की प्रतिक्रिया दिखाते हैं; ‘परन्तु मैं’ इस विरोध को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: כְחֵרֵשׁ
  choice: बहरे के समान
  rationale: כְ तुलना सूचित करता है और חֵרֵשׁ बहरे व्यक्ति को दर्शाता है; यह रूप एकवचन उपमा को बनाए रखता है।
- source_word: לֹא אֶשְׁמָע
  choice: सुनता नहीं
  rationale: שׁמע का मूल अर्थ ‘सुनना’ है। प्रसंग में उत्तर न देने का भाव निहित है, पर अनुवाद श्रवण-संबंधी मूल रूपक को बनाए रखता है।
- source_word: וּכְאִלֵּם
  choice: और गूँगे के समान
  rationale: אִלֵּם बोल न सकनेवाले व्यक्ति को दर्शाता है और ‘बहरे’ के समानांतर शारीरिक रूपक को बनाए रखता है।
- source_word: לֹא יִפְתַּח פִּיו
  choice: वह अपना मुँह नहीं खोलता
  rationale: इब्रानी में क्रिया और प्रत्यय तीसरे पुरुष एकवचन हैं—शाब्दिक रूप से ‘वह अपना मुँह नहीं खोलता।’ इसे बनाए रखने से व्यक्ति-परिवर्तन और उपमा की संभावित निरंतरता सुरक्षित रहती है।
