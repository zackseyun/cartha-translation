  text: For I am ready to fall, and my pain is always before me.
translation:
  language: hi
  text: 'क्योंकि मैं गिरने के कगार पर हूँ,

    और मेरा दर्द सदा मेरे सामने रहता है।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְצֶלַע נָכוֹן
  choice: गिरने पर हूँ
  rationale: צֶלַע यहाँ लड़खड़ाने, लँगड़ाने या गिरने की दशा की ओर संकेत करता है, और נָכוֹן तत्पर या आसन्न होने का भाव देता है। संदर्भ में स्वाभाविक हिन्दी ‘गिरने पर हूँ’ आसन्न पतन को संक्षेप में व्यक्त करती है।
- source_word: מַכְאוֹבִי
  choice: मेरा दर्द
  rationale: מַכְאוֹב शारीरिक या मानसिक पीड़ा/दर्द के लिए प्रयुक्त हो सकता है; ‘दर्द’ मूल की व्यापकता बनाए रखता है।
- source_word: נֶגְדִּי תָמִיד
  choice: सदा मेरे सामने रहता है
  rationale: शाब्दिक स्थानगत रूपक ‘मेरे सामने’ को बनाए रखते हुए תָמִיד की निरंतरता को ‘सदा’ से व्यक्त किया गया है।
theological_decisions:
- issue: לְצֶלַע में ठोकर, लँगड़ाहट और गिरने के बीच अर्थ-छाया
  choice: गिरने पर हूँ
  alternative: लड़खड़ाने को तैयार हूँ
  rationale: निकटवर्ती संकट और पतन का भाव स्पष्ट है; ‘गिरने पर हूँ’ हिन्दी में आसन्न अवस्था को स्वाभाविक ढंग से कहता है, जबकि ‘तैयार’ स्वेच्छा का भ्रामक संकेत दे सकता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; संक्षिप्त, काव्यात्मक और गरिमापूर्ण। समानांतर पंक्तियों तथा ‘मेरे सामने’ के मूल रूपक को सुरक्षित रखा गया है।
