  text: כִּ֣י עֲ֭וֺנֹתַ/י עָבְר֣וּ רֹאשִׁ֑/י כְּ/מַשָּׂ֥א כָ֝בֵ֗ד יִכְבְּד֥וּ מִמֶּֽ/נִּי׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/038/004.yaml
  text: For my iniquities have gone over my head; like a heavy burden[a], they are too heavy for me.
translation:
  language: hi
  text: क्योंकि मेरे अधर्म मेरे सिर के ऊपर से गुज़र गए हैं; भारी बोझ[a] के समान वे मेरे लिए बहुत भारी हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “मेरा दोष”; यहाँ प्रयुक्त इब्रानी शब्द अधर्म और उससे उत्पन्न दोष—दोनों का बोध करा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह विलाप के कारण या आधार को प्रस्तुत करता है; ‘क्योंकि’ आधुनिक हिन्दी में इसके व्याख्यात्मक-कारणात्मक बल को स्वाभाविक रूप से व्यक्त करता है।
- source_word: עֲוֺנֹתַי
  choice: मेरे अधर्म
  rationale: עָוֹן में अधर्म, दोष और उसके परिणाम—इन सबका अर्थ-क्षेत्र हो सकता है। मुख्य पाठ में ‘अधर्म’ नैतिक अपराधों को सामने रखता है, जबकि पादटिप्पणी ‘दोष’ की संभावना सुरक्षित रखती है।
- source_word: עָבְרוּ רֹאשִׁי
  choice: मेरे सिर के ऊपर से बह निकले हैं
  rationale: यह सिर से ऊपर चढ़ते या बहते जल की सजीव छवि को बनाए रखता है और केवल भावार्थ ‘मुझ पर हावी हो गए’ कहकर रूपक को मिटाता नहीं।
- source_word: כְּמַשָּׂא כָבֵד
  choice: भारी बोझ के समान
  rationale: מַשָּׂא और כָבֵד की भार-संबंधी ठोस छवि को सहज, काव्यात्मक हिन्दी में बनाए रखता है।
- source_word: יִכְבְּדוּ מִמֶּנִּי
  choice: वे मेरे लिए असहनीय हो गए हैं
  rationale: शाब्दिक भाव ‘मुझसे अधिक भारी’ है; ‘मेरे लिए असहनीय’ भार के रूपक और वक्ता की उसे उठा न सकने की दशा, दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: पश्चात्ताप के प्रसंग में עָוֹן का अर्थ-क्षेत्र
  choice: मुख्य पाठ में ‘अधर्म’, जो भजनकार के नैतिक अपराधों पर मुख्य बल देता है
  alternative: ‘दोष’, जो अपराध से उत्पन्न दोषी ठहरने या दायित्व पर बल देता है
  rationale: इब्रानी शब्द अपराध और उससे उत्पन्न दोष दोनों को समेट सकता है। पद में इन्हें डुबो देने वाले जल और असहनीय बोझ के रूप में दिखाया गया है; इसलिए मुख्य पाठ में ‘अधर्म’ रखा गया है और व्यापक अर्थ-संभावना पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और काव्यात्मक रूप अपनाया गया है। जल और भारी बोझ—दोनों मूल रूपकों को बनाए रखा गया है; ‘असहनीय’ अंतिम वाक्यांश को साधारण पाठक के लिए स्वाभाविक बनाता है।
