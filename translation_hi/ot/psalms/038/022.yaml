  text: Hurry to help me[a], Lord[b], my salvation.
translation:
  language: hi
  text: मेरी सहायता के लिए जल्दी कर, हे प्रभु, मेरे उद्धार!
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חוּשָׁה
  choice: शीघ्र आ
  rationale: आज्ञार्थक क्रिया का अर्थ जल्दी करना है। हिंदी में सहायता के लिए पुकार के संदर्भ में ‘शीघ्र आ’ स्वाभाविक रूप से तात्कालिकता व्यक्त करता है, यद्यपि आने की क्रिया मूल में स्पष्ट नहीं है।
- source_word: לְעֶזְרָתִי
  choice: मेरी सहायता करने के लिए
  rationale: शाब्दिक अर्थ ‘मेरी सहायता के लिए’ है; हिंदी में क्रियात्मक अभिव्यक्ति अधिक सहज और स्पष्ट है।
- source_word: אֲדֹנָי
  choice: हे प्रभु
  rationale: यह परमेश्वर के लिए प्रयुक्त मानक संबोधन और उपाधि है; ‘हे’ हिंदी में प्रत्यक्ष संबोधन को स्पष्ट करता है।
- source_word: תְּשׁוּעָתִי
  choice: तू ही मेरा उद्धार है
  rationale: मूल संज्ञात्मक वाक्यांश ‘मेरा उद्धार’ है। हिंदी में संबोधित व्यक्ति के साथ इसका विधेय-संबंध स्पष्ट करने के लिए ‘तू ही ... है’ स्वाभाविक है; ‘ही’ इस अर्थ को उभारता है कि प्रभु स्वयं प्रार्थी का उद्धार है।
theological_decisions:
- issue: ईश्वरीय उपाधि אֲדֹנָי का अनुवाद
  choice: प्रभु
  alternative: मेरे प्रभु
  rationale: यह रूप यहाँ परमेश्वर की प्रचलित उपाधि के रूप में काम करता है; इसलिए हिंदी में स्पष्ट स्वामित्व जोड़े बिना ‘प्रभु’ रखा गया है।
- issue: תְּשׁוּעָתִי का संज्ञात्मक रूप
  choice: तू ही मेरा उद्धार है
  alternative: मुझे छुड़ानेवाले
  rationale: ‘उद्धार’ मूल की अमूर्त संज्ञा और उसकी व्यापक धार्मिक अर्थवत्ता को सुरक्षित रखता है; कर्तृवाचक विकल्प अर्थ को केवल छुड़ानेवाले व्यक्ति तक सीमित कर देता।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और प्रार्थनात्मक हिंदी। तात्कालिक विनती को संक्षिप्त रखा गया है और ईश्वरीय संबोधन में आदर के साथ निकटता व्यक्त करने के लिए ‘तू’ का पारंपरिक काव्यात्मक प्रयोग किया गया है।
