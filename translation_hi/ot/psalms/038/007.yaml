lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पद आसपास के विलाप का कारण बताता है; ‘क्योंकि’ इस व्याख्यात्मक संबंध को स्वाभाविक रूप से व्यक्त करता है।
- source_word: כְסָלַי
  choice: मेरी कमर
