- source_word: מָלְאוּ
  choice: से भरी है
  rationale: מלא यहाँ भरे होने की अवस्था व्यक्त करता है; हिन्दी में एकवचन सामूहिक ‘कमर’ के साथ ‘भरी है’ स्वाभाविक है।
- source_word: נִקְלֶה
  choice: जलन
  rationale: यह दुर्बोध शब्द इस शारीरिक पीड़ा के संदर्भ में दाह, सूजन या प्रदाह का संकेत दे सकता है। ‘जलन’ किसी ऐसे ‘घाव’ को नहीं जोड़ती जिसका मूल में स्पष्ट उल्लेख नहीं है।
- source_word: וְאֵין
  choice: और ... कुछ भी ... नहीं है
  rationale: अस्तित्व के निषेध को सहज हिन्दी में व्यक्त करता है।
- source_word: מְתֹם
  choice: स्वस्थ
  rationale: शारीरिक संदर्भ में מְתֹם निरोगता या सही-सलामत दशा को दर्शाता है; ‘कुछ भी स्वस्थ नहीं’ हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: בִּבְשָׂרִי
  choice: मेरे शरीर में
  rationale: בָּשָׂר यहाँ वास्तविक देह को सूचित करता है। हिन्दी में ‘मेरे शरीर में’ शाब्दिक ‘मेरे मांस में’ की अपेक्षा इसी ठोस शारीरिक अर्थ को अधिक स्वाभाविक ढंग से व्यक्त करता है।
theological_decisions:
- issue: בְּשָׂרִי का अर्थ शारीरिक पीड़ा के प्रसंग में
  choice: शाब्दिक भौतिक शरीर
  alternative: मांस; मानव की पापमय प्रकृति
  rationale: कमर, जलन और अस्वस्थता का समानांतर वर्णन प्रत्यक्ष शारीरिक कष्ट का है; यहाँ इसे नैतिक या धर्मवैज्ञानिक अर्थ देना संदर्भ से असमर्थित होगा।
- issue: נִקְלֶה की कठिन और अनिश्चित व्याख्या
  choice: जलन
  alternative: सूजन; प्रदाह; घिनौनी दशा
  rationale: शारीरिक अर्थ संदर्भानुकूल है, पर मूल शब्द की सटीक रोगगत प्रकृति अनिश्चित है। इसलिए मुख्य पाठ में सामान्य ‘जलन’ रखा गया और विकल्प पादटिप्पणी में दिए गए हैं।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘कमर’ शरीर के मध्य/पार्श्व भाग का स्वाभाविक हिन्दी संकेत है। मूल की अनिश्चितता बनाए रखने के लिए ‘जलते घाव’ जैसे अधिक विशिष्ट शब्द नहीं जोड़े गए।
