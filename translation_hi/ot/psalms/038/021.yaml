  yaml_path: translation/ot/psalms/038/021.yaml
  text: Do not forsake me[a], O Yahweh my God; do not be far from me.
translation:
  language: hi
  text: हे याहवे, मुझे न त्याग; मेरे परमेश्वर, मुझसे दूर न रह।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַל תַּעַזְבֵנִי
  choice: मुझे न त्याग
  rationale: निषेधवाचक אַל के साथ क्रिया प्रार्थना में सीधी विनती व्यक्त करती है। עזב के लिए ‘त्याग’ विलाप की गंभीरता बनाए रखता है और साधारण ‘छोड़’ की अपेक्षा संबंध-विच्छेद के भाव को अधिक ठीक व्यक्त करता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिन्दी बाइबिल परंपरा में परमेश्वर के व्यक्तिगत नाम יְהוָה का व्यापक रूप से पहचाना जाने वाला लिप्यंतरण ‘यहोवा’ है; इसे किसी उपाधि से प्रतिस्थापित नहीं किया गया।
- source_word: אֱלֹהַי
  choice: मेरे परमेश्वर
  rationale: אֱלוֹהַּ के साथ प्रथम पुरुष एकवचन प्रत्यय का सीधा अर्थ ‘मेरे परमेश्वर’ है; संबोधन में ‘हे’ स्वाभाविक हिन्दी प्रार्थना-शैली देता है।
- source_word: אַל תִּרְחַק מִמֶּנִּי
  choice: मुझसे दूर न रह
  rationale: רחק यहाँ दूर होने या रहने का भाव रखता है। ‘दूर न रह’ मूल की स्थानगत और संबंधगत अस्पष्टता को बनाए रखते हुए स्वाभाविक हिन्दी है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे / प्रभु
  rationale: मूल पाठ में व्यक्तिगत ईश्वरीय नाम है। हिन्दी पाठ में परिचित लिप्यंतरण ‘यहोवा’ नाम को नाम ही रहने देता है, जबकि ‘प्रभु’ उसे उपाधि में बदल देता; ‘याहवे’ अधिक संभावित आधुनिक पुनर्निर्मित उच्चारण है, पर सामान्य हिन्दी पाठकों के लिए कम परिचित है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और संक्षिप्त प्रार्थना-भाषा। दोनों समानांतर विनतियों की काव्यात्मक संरचना और ‘हे …’ संबोधन सुरक्षित रखे गए हैं।
