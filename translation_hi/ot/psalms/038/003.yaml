id: PSA.38.3
reference: Psalms 38:3
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: אֵין מְתֹ֣ם בִּ֭/בְשָׂרִ/י מִ/פְּנֵ֣י זַעְמֶ֑/ךָ אֵין שָׁל֥וֹם בַּ֝/עֲצָמַ֗/י מִ/פְּנֵ֥י חַטָּאתִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/038/003.yaml
  text: There is no soundness in my flesh because of your indignation[b][a]; there is no peace in my bones because of my sin.
translation:
  language: hi
  text: तेरे रोष के कारण मेरे शरीर में कुछ भी स्वस्थ नहीं है[a]; मेरे पाप के कारण मेरी हड्डियों में चैन नहीं है[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “मेरे मांस में कोई पूर्णता नहीं है।”
    reason: मूल इब्रानी के ठोस बिंब और शाब्दिक संरचना को सुरक्षित रखने वाला विकल्प।
  - marker: b
    text: या “कुशलता नहीं है।”
    reason: שָׁלוֹם यहाँ चैन के साथ-साथ कुशलता या भली दशा का अर्थ भी दे सकता है।
lexical_decisions:
- source_word: מְתֹם
  choice: कुछ भी स्वस्थ नहीं
  rationale: यह संज्ञा पूर्णता या सही-सलामत दशा को सूचित करती है। शारीरिक विलाप के संदर्भ में यह स्वाभाविक हिन्दी में शरीर के किसी भी भाग के स्वस्थ न होने का भाव व्यक्त करती है।
- source_word: בִּבְשָׂרִי
  choice: मेरे शरीर में
  rationale: בשר का मूल अर्थ ‘मांस’ है, पर यहाँ समूची शारीरिक दशा अभिप्रेत है; आधुनिक हिन्दी में ‘शरीर’ अधिक सहज है और शारीरिक बिंब बनाए रखता है।
- source_word: מִפְּנֵי
  choice: के कारण
  rationale: दोनों पदों में यह संबंधकारक कारण बताता है; ‘के कारण’ स्पष्ट और समानांतर अनुवाद है।
- source_word: זַעְמֶךָ
  choice: तेरे रोष
  rationale: זעם प्रबल क्रोध या आक्रोश को दर्शाता है। ‘रोष’ ईश्वरीय अप्रसन्नता की गंभीरता को स्वाभाविक और गरिमापूर्ण हिन्दी में रखता है।
- source_word: שָׁלוֹם
  choice: चैन
  rationale: यहाँ שׁלום हड्डियों में सुख-चैन अथवा कुशलता के अभाव को व्यक्त करता है। ‘चैन’ शारीरिक और भीतरी व्याकुलता दोनों को सहज हिन्दी में संप्रेषित करता है; ‘कुशलता’ को पादटिप्पणी में रखा गया है।
- source_word: בַּעֲצָמַי
  choice: मेरी हड्डियों में
  rationale: शाब्दिक ‘हड्डियाँ’ गहरी शारीरिक और आंतरिक पीड़ा का काव्यात्मक बिंब सुरक्षित रखता है।
- source_word: חַטָּאתִי
  choice: मेरे पाप
  rationale: यह संज्ञा भजनकार के अपने पाप को उसकी व्यथा के कारण के रूप में प्रस्तुत करती है; ‘मेरा पाप’ सीधा और स्वाभाविक अनुवाद है।
theological_decisions:
- issue: परमेश्वर के रोष, भजनकार के पाप और उसकी शारीरिक पीड़ा का संबंध
  choice: 'पद के दोनों कारणवाचक कथनों को सीधे रखा गया है: शारीरिक अस्वस्थता परमेश्वर के रोष के कारण और हड्डियों में चैन का अभाव अपने पाप के कारण है।'
  alternative: इसे परमेश्वर से दूरी की अनुभूति का काव्यात्मक वर्णन माना जा सकता है, न कि हर प्रकार के दुःख पर लागू होने वाला पूर्ण सिद्धांत।
  rationale: अनुवाद न तो ईश्वरीय रोष को नरम करता है, न व्यक्तिगत पाप को, और न ही उनके बीच की प्रक्रिया समझाकर मूल पाठ के धर्मवैचारिक तनाव को समाप्त करता है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी। ‘तेरे’ का प्रयोग भजन की परमेश्वर से सीधी संबोधन-शैली के अनुरूप है। दोनों समानांतर खंडों और उनके कारणवाचक संबंध को स्पष्ट रखा गया है।
