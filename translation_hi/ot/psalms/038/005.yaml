  text: הִבְאִ֣ישׁוּ נָ֭מַקּוּ חַבּוּרֹתָ֑/י מִ֝/פְּנֵ֗י אִוַּלְתִּֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/038/005.yaml
  text: My wounds stink and fester because of my foolishness[a].
translation:
  language: hi
  text: मेरी मूर्खता के कारण मेरे घावों से दुर्गंध आती है और वे सड़ गए हैं।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मेरी नादानी के कारण मेरी चोटें दुर्गंधित हो गई हैं और गल गई हैं।”
    reason: חַבּוּרֹתָי के लिए ‘चोटें’, הִבְאִישׁוּ के लिए ‘दुर्गंधित हो गई हैं’, नָמַקּוּ के लिए ‘गल गई हैं’, और אִוַּלְתִּי के लिए ‘नादानी’ सम्भव विकल्प हैं।
lexical_decisions:
- source_word: הִבְאִישׁוּ
  choice: बदबू देने लगे हैं
  rationale: हिफ़ील रूप दुर्गंधयुक्त हो जाने या दुर्गंध देने का भाव व्यक्त करता है। यह प्रयोग इब्रानी की तीखी शारीरिक छवि को स्वाभाविक आधुनिक हिन्दी में बनाए रखता है।
- source_word: נָמַקּוּ
  choice: सड़ रहे हैं
  rationale: क्रिया गलने, क्षीण होने या सड़ने का अर्थ देती है। घावों के संदर्भ में ‘सड़ रहे हैं’ स्पष्ट और स्वाभाविक है तथा जारी विकृति का भाव प्रकट करता है।
- source_word: חַבּוּרֹתָי
  choice: मेरे घाव
  rationale: संज्ञा का अर्थ चोट, नील, कोड़े का निशान या घाव हो सकता है। दुर्गंध और सड़न के साथ ‘घाव’ प्रसंग के लिए सबसे उपयुक्त व्यापक शब्द है।
- source_word: מִפְּנֵי
  choice: के कारण
  rationale: यहाँ पूर्वसर्ग स्थान नहीं, कारण बताता है; ‘के कारण’ आधुनिक हिन्दी में इस संबंध को सीधे व्यक्त करता है।
- source_word: אִוַּלְתִּי
  choice: मेरी मूर्खता
  rationale: यह शब्द नैतिक आशय वाली मूर्खता या नादानी को सूचित करता है। ‘मेरी मूर्खता’ वक्ता की आत्म-जिम्मेदारी को बनाए रखता है, पर अर्थ को अज्ञान जैसे संकरे भाव तक सीमित नहीं करता।
theological_decisions:
- issue: दुःख और अपनी मूर्खता के बीच कारणात्मक संबंध
  choice: यह मेरी मूर्खता के कारण हुआ है
  alternative: मेरी मूर्खता के कारण
  rationale: पद वक्ता की दशा को उसकी अपनी मूर्खता से स्पष्टतः जोड़ता है। अनुवाद इस नैतिक-कारणात्मक संबंध को सुरक्षित रखता है, पर समस्त दुःख के कारण पर कोई व्यापक सिद्धान्त नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। दो इब्रानी क्रियाओं को ‘और’ से जोड़ा गया है। पंक्ति-विभाजन काव्यात्मक पठनीयता बढ़ाता है; [a] मुख्य पाठ में उपस्थित है।
