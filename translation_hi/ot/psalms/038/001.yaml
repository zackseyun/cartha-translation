lexical_decisions:
- source_word: יְהוָה
  choice: हे यहोवा
  rationale: परमेश्वर के व्यक्तिगत वाचा-नाम को शीर्षक से बदलने के बजाय हिन्दी में प्रचलित लिप्यंतरण ‘यहोवा’ से व्यक्त किया गया है; सम्बोधन के लिए ‘हे’ जोड़ा गया है।
- source_word: אַל
  choice: न
  rationale: यह निषेधात्मक विनती को स्वाभाविक और संक्षिप्त हिन्दी में व्यक्त करता है तथा दोनों समानांतर क्रियाओं पर लागू होता है।
- source_word: בְּקֶצְפְּךָ
  choice: अपने क्रोध में
  rationale: קֶצֶף ईश्वरीय अप्रसन्नता या क्रोध को दर्शाता है; ‘अपने क्रोध में’ मूल पूर्वसर्ग और सम्बन्ध को सुरक्षित रखता है।
- source_word: תוֹכִיחֵנִי
  choice: मुझे न डाँट
  rationale: יכח के हिफ़िल रूप का यहाँ अर्थ दोष दिखाते हुए डाँटना या झिड़कना है। ‘डाँट’ आधुनिक सामान्य हिन्दी में स्पष्ट है और अगले पदांश की अनुशासनात्मक क्रिया से अलग भी रहता है।
- source_word: וּבַחֲמָתְךָ
  choice: और अपने प्रकोप में
  rationale: חֵמָה तीव्र क्रोध या रोष को व्यक्त करता है। ‘प्रकोप’ पहले पदांश के ‘क्रोध’ से तीव्रता का भेद बनाए रखता है; आरम्भ का निषेध स्वाभाविक रूप से इस समानांतर पदांश तक जारी रहता है।
- source_word: תְיַסְּרֵנִי
  choice: मुझे ताड़ना न दे
  rationale: יסר के पिएल रूप में सुधार के उद्देश्य से अनुशासन या दंड देने का भाव है। ‘ताड़ना देना’ इस अर्थ को गरिमापूर्ण और परिचित हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल में चार अक्षरों वाला व्यक्तिगत ईश्वरीय नाम सीधे प्रयुक्त है। हिन्दी पाठकों में परिचित ‘यहोवा’ को मुख्य पाठ में रखा गया है, जबकि उच्चारण की अनिश्चितता और वैकल्पिक लिप्यंतरण को पादटिप्पणी में स्पष्ट किया गया है।
- issue: क्या प्रार्थना हर प्रकार की डाँट और ताड़ना को अस्वीकार करती है
  choice: क्रोध और प्रकोप में की जाने वाली डाँट तथा ताड़ना से विनती
  alternative: किसी भी डाँट या अनुशासन से पूर्णतः बचाने की विनती
  rationale: दोनों क्रियाएँ בְּ वाले पदबंधों से जुड़ी हैं; इसलिए काव्यात्मक तनाव बनाए रखते हुए पाठ यह नहीं कहता कि सुधार स्वयं अस्वीकार्य है, बल्कि क्रोध और प्रकोप में होने वाले सुधार से दया की याचना करता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, प्रार्थनात्मक और गरिमापूर्ण काव्य-भाषा रखी गई है। समानांतरता के लिए ‘क्रोध/प्रकोप’ और ‘डाँट/ताड़ना’ के अर्थ-भेद सुरक्षित रखे गए हैं।
