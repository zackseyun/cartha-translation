  text: אֲֽדֹנָ/י נֶגְדְּ/ךָ֥ כָל תַּאֲוָתִ֑/י וְ֝/אַנְחָתִ֗/י מִמְּ/ךָ֥ לֹא נִסְתָּֽרָה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/038/009.yaml
  text: Lord[a], all my desire is before you[b], and my groaning is not hidden from you.
translation:
  language: hi
  text: हे प्रभु, मेरी सारी अभिलाषा[a] आपके सामने है, और मेरा कराहना[b] आपसे छिपा नहीं है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “लालसा।”
    reason: lexical_alternative
  - marker: b
    text: या “आह भरना।”
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנָי
  choice: हे प्रभु
  rationale: यह परमेश्वर को सीधे संबोधित करने वाला प्रभुत्व-सूचक पद है; हिन्दी में संबोधन के लिए ‘हे प्रभु’ स्वाभाविक और गरिमापूर्ण है तथा इसे यहोवा नाम से अलग रखता है।
- source_word: נֶגְדְּךָ
  choice: आपके सामने
  rationale: यह किसी की उपस्थिति या दृष्टि में होने का भाव देता है; ‘आपके सामने’ बताता है कि भजनकार की अभिलाषा परमेश्वर की दृष्टि में पूरी तरह खुली है।
- source_word: כָל תַּאֲוָתִי
  choice: मेरी सारी अभिलाषा
  rationale: ‘सारी’ समग्रता को बनाए रखता है, और इस विलाप में ‘अभिलाषा’ तीव्र चाह या लालसा को स्वाभाविक, अश्लीलतारहित ढंग से व्यक्त करती है।
- source_word: וְאַנְחָתִי
  choice: और मेरा कराहना
  rationale: यह दुःख से निकली आह या कराह को व्यक्त करता है; ‘कराहना’ गहरी पीड़ा के स्वर को बनाए रखता है।
- source_word: מִמְּךָ לֹא נִסְתָּרָה
  choice: आपसे छिपा नहीं है
  rationale: 'निफ़अल रूप निष्क्रिय अवस्था बताता है: भजनकार का कराहना परमेश्वर से छिपा हुआ नहीं है। वर्तमानकालीन हिन्दी मूल के तात्कालिक अंगीकार के अनुकूल है।'
theological_decisions:
- issue: אֲדֹנָי द्वारा ईश्वरीय संबोधन, न कि YHWH नाम
  choice: प्रभु
  alternative: यहोवा
  rationale: मूल पाठ में אֲדֹנָי है, चतुरक्षरीय ईश्वरीय नाम YHWH नहीं; इसलिए प्रभुत्व-सूचक ‘प्रभु’ उचित है और दोनों को मिलाया नहीं गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और प्रार्थनामय रूप अपनाया गया है। परमेश्वर के लिए आदरसूचक ‘आप’ रखा गया है। काव्यात्मक समानांतरता और मूल की दो घोषणाएँ स्पष्ट रूप से सुरक्षित हैं।
