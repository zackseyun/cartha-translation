  text: אֹֽהֲבַ֨/י וְ/רֵעַ֗/י מִ/נֶּ֣גֶד נִגְעִ֣/י יַעֲמֹ֑דוּ וּ֝/קְרוֹבַ֗/י מֵ/רָחֹ֥ק עָמָֽדוּ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/038/011.yaml
  text: My loved ones and my friends stand apart from my affliction[c][b][a], and my close kin stand far away.
translation:
  language: hi
  text: मेरे प्रियजन और मेरे मित्र मेरी पीड़ा[a] के कारण मुझसे दूर खड़े हैं[b]; मेरे निकट संबंधी[c] दूर खड़े हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘मेरी व्याधि’, ‘मेरी चोट’ अथवा ‘मेरा घाव’। हिब्रू शब्द शारीरिक प्रहार, रोग जैसी पीड़ा या घाव को सूचित कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: अधिक शाब्दिक रूप में, ‘मेरी पीड़ा के सामने खड़े हैं।’ हिब्रू पद का अर्थ ‘सामने’ या ‘के सामने से’ भी हो सकता है; इस प्रसंग में उससे पीड़ित व्यक्ति से दूरी बनाए रखने का भाव निकलता है।
    reason: source_ambiguity
  - marker: c
    text: या ‘मेरे रिश्तेदार’ अथवा ‘मेरे निकट के लोग’।
    reason: lexical_alternative
lexical_decisions:
- source_word: אֹהֲבַי
  choice: मेरे प्रियजन
  rationale: यह कृदन्त रूप उन लोगों को दर्शाता है जो भजनकार से प्रेम रखते हैं। ‘प्रियजन’ आधुनिक हिन्दी में आत्मीयता व्यक्त करता है और अनावश्यक रूप से केवल प्रणय-संबंध का संकेत नहीं देता।
- source_word: וְרֵעַי
  choice: और मेरे मित्र
  rationale: רֵעַ का सामान्य अर्थ मित्र, साथी या सहचर है; समानांतर पंक्ति में ‘मित्र’ सबसे स्वाभाविक है।
- source_word: מִנֶּגֶד
  choice: से अलग
  rationale: इस स्थान-सूचक पद का मूल अर्थ ‘सामने/सम्मुख’ है, पर प्रसंग और अगली पंक्ति दूरी बनाकर खड़े रहने का भाव देते हैं। ‘से अलग’ सामाजिक और स्थानिक दूरी को स्वाभाविक हिन्दी में व्यक्त करता है; अधिक शाब्दिक विकल्प पादटिप्पणी में रखा गया है।
- source_word: נִגְעִי
  choice: मेरी पीड़ा
  rationale: נֶגַע चोट, घाव, प्रहार अथवा रोगजन्य विपत्ति का बोध करा सकता है। ‘पीड़ा’ इस व्यापकता को बनाए रखती है और भजन के शारीरिक कष्ट के प्रसंग में स्वाभाविक है।
- source_word: יַעֲמֹדוּ
  choice: खड़े हैं
  rationale: עמד किसी स्थान पर खड़े होने या अपना स्थान बनाए रखने को व्यक्त करता है। यहाँ वर्तमान दृश्य के रूप में ‘खड़े हैं’ उपयुक्त है।
- source_word: וּקְרוֹבַי
  choice: मेरे निकट संबंधी
  rationale: קָרוֹב निकट व्यक्ति और विशेषतः निकट रिश्तेदार को सूचित कर सकता है। ‘निकट संबंधी’ संभावित पारिवारिक अर्थ को बनाए रखते हुए काव्यात्मक विरोधाभास—निकट लोग दूर खड़े हैं—भी स्पष्ट करता है।
- source_word: מֵרָחֹק
  choice: दूर
  rationale: यह पद स्पष्ट रूप से स्थानिक दूरी दर्शाता है; ‘दूर’ संक्षिप्त और स्वाभाविक हिन्दी है।
- source_word: עָמָדוּ
  choice: खड़े हैं
  rationale: यद्यपि हिब्रू रूप पूर्णकालिक है, यह पहली अर्धपंक्ति के साथ समानांतर चलकर जारी दृश्य प्रस्तुत करता है; इसलिए हिन्दी वर्तमानकाल स्वाभाविक है।
