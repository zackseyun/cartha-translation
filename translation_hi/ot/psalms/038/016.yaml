  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: כִּֽי אָ֭מַרְתִּי פֶּן יִשְׂמְחוּ לִ֑/י בְּ/מ֥וֹט רַ֝גְלִ֗/י עָלַ֥/י הִגְדִּֽילוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/038/016.yaml
  text: For I said, “Otherwise they would rejoice over me; when my foot slips, they boast against me.”
translation:
  language: hi
  text: क्योंकि मैंने कहा था, “कहीं ऐसा न हो कि वे मुझ पर आनन्द मनाएँ; जब मेरा पैर फिसले, तो वे मेरे विरुद्ध डींगें मारें।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פֶּן
  choice: कहीं ऐसा न हो कि
  rationale: यह आशंका अथवा अवांछित परिणाम को व्यक्त करता है और हिब्रू की निवारक अर्थच्छाया को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: יִשְׂמְחוּ לִי
  choice: वे मुझ पर आनन्द मनाएँ
  rationale: यहाँ आनन्द किसी के दुर्भाग्य पर होने वाला शत्रुतापूर्ण उल्लास है; ‘मुझ पर’ संबंधसूचक לִי को संक्षेप में व्यक्त करता है।
- source_word: בְּמוֹט רַגְלִי
  choice: जब मेरा पैर फिसले
  rationale: מוֹט का मूल भाव डगमगाने या खिसकने का है; प्रसंग में यह पतन या संकट की सजीव उपमा है।
- source_word: עָלַי הִגְדִּילוּ
  choice: वे मेरे विरुद्ध डींगें मारें
  rationale: शाब्दिक रूप से ‘मेरे विरुद्ध बड़ा करें’ अधूरा मुहावरा है; प्रसंग में इसका अर्थ विरोधी की विफलता पर घमंड से अपनी बड़ाई करना है।
theological_decisions:
- issue: עָלַי הִגְדִּילוּ में कर्म का लोप
  choice: वे मेरे विरुद्ध डींगें मारें
  alternative: वे मेरे विरुद्ध अपने को बड़ा करें
  rationale: हिब्रू में किस वस्तु को ‘बड़ा’ किया गया है, यह स्पष्ट नहीं कहा गया। चुना गया अनुवाद उस मुहावरे के घमंडी व्यवहार को स्वाभाविक हिन्दी में व्यक्त करता है, बिना किसी अतिरिक्त सैद्धान्तिक अर्थ को जोड़े।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी। पद की समानांतर काव्य-रचना और शत्रुओं के दुर्भावनापूर्ण उल्लास से घमंडी डींग तक की प्रगति सुरक्षित रखी गई है।
