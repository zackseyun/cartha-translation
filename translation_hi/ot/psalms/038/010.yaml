    text: या, “मेरा हृदय चक्कर खा रहा है।” हिब्रू शब्द धड़कन की व्याकुलता के साथ-साथ घूमने या डगमगाने का भाव भी दे सकता है।
    reason: lexical_alternative
  - marker: b
    text: '“आँखों की रोशनी” से दृष्टि स्वयं या आँखों में दिखाई देने वाली चमक और जीवन्तता अभिप्रेत हो सकती है। हिब्रू में यहाँ बहुवचन है: “वे भी मेरे साथ नहीं हैं”; “वे” संभवतः आँखों की ओर संकेत करता है।'
