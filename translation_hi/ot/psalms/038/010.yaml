- source_word: סְחַרְחַר
  choice: बुरी तरह धड़क रहा है
  rationale: यह शब्द घूमने, डगमगाने या तीव्र व्याकुलता का भाव देता है। हृदय के साथ और शारीरिक संकट के संदर्भ में यह अनियमित या तेज धड़कन का संकेत देता है; ‘बुरी तरह धड़क रहा है’ आधुनिक हिंदी में सहज है, जबकि वैकल्पिक अर्थ पादटिप्पणी में रखा गया है।
- source_word: עֲזָבַנִי כֹחִי
  choice: मेरा बल मुझे छोड़ गया है
  rationale: शाब्दिक संरचना ‘मेरे बल ने मुझे छोड़ दिया’ है। चुना गया रूप हिंदी में स्वाभाविक रहते हुए עזב के ‘छोड़ जाना’ और כֹּחַ के शारीरिक सामर्थ्य के अर्थ को बनाए रखता है।
- source_word: וְאוֹר עֵינַי
  choice: और मेरी आँखों की रोशनी
  rationale: हिब्रू काव्यात्मक अभिव्यक्ति दृष्टि तथा आँखों में दिखाई देने वाली चमक या जीवन्तता—दोनों की ओर संकेत कर सकती है। ‘आँखों की रोशनी’ हिंदी में स्वाभाविक है और इस बिंब को काफी हद तक सुरक्षित रखती है।
- source_word: גַּם הֵם אֵין אִתִּי
  choice: भी जाती रही है
  rationale: हिब्रू में बलाघात सहित शाब्दिक भाव ‘वे भी मेरे साथ नहीं हैं’ है; बहुवचन सर्वनाम संभवतः ‘आँखों’ की ओर लौटता है, जबकि अर्थगत केंद्र उनकी रोशनी है। हिंदी में ‘रोशनी भी जाती रही है’ उसी हानि को स्पष्ट और सहज ढंग से व्यक्त करता है।
