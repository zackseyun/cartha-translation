  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। “मेरे प्राण के पीछे पड़े हैं” जीवन लेने की शत्रुतापूर्ण मंशा को हिन्दी मुहावरे में व्यक्त करता है। समानांतर काव्य-पंक्तियों और धीमी, निरंतर कपटपूर्ण वाणी की छवि को सुरक्षित रखा गया है।
