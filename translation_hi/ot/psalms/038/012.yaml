  text: וַ/יְנַקְשׁ֤וּ מְבַקְשֵׁ֬י נַפְשִׁ֗/י וְ/דֹרְשֵׁ֣י רָ֭עָתִ/י דִּבְּר֣וּ הַוּ֑וֹת וּ֝/מִרְמ֗וֹת כָּל הַ/יּ֥וֹם יֶהְגּֽוּ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/038/012.yaml
  text: Those who seek my life set traps[a], and those who seek my harm speak destruction[d][c][b]; all day long they mutter deceit.
translation:
  language: hi
  text: जो मेरे प्राण लेना चाहते हैं, वे फंदे बिछाते हैं[a]; और जो मेरा अनिष्ट चाहते हैं, वे विनाश की बातें करते हैं। वे दिन भर छल की बातें बुदबुदाते रहते हैं[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “फंदे लगाते हैं।” इब्रानी क्रिया में जाल बिछाकर फँसाने की छवि है।
    reason: lexical_alternative
  - marker: b
    text: “बुदबुदाते” का अनुवाद “मन ही मन सोचते” या “धीमे स्वर में कहते” भी हो सकता है; यहाँ आशय लगातार छलपूर्ण बातों से है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְנַקְשׁוּ
  choice: फंदे बिछाते हैं
  rationale: यह נקשׁ की फँसाने या जाल लगाने की ठोस छवि को स्वाभाविक आधुनिक हिन्दी में सुरक्षित रखता है।
- source_word: מְבַקְשֵׁי נַפְשִׁי
  choice: जो मेरे प्राण के पीछे पड़े हैं
  rationale: शत्रुतापूर्ण प्रसंग में נפשׁ व्यक्ति के जीवन को दर्शाता है; यह हिन्दी मुहावरा जान लेने के इरादे को स्वाभाविक रूप से व्यक्त करता है।
- source_word: וְדֹרְשֵׁי רָעָתִי
  choice: जो मेरा अनिष्ट चाहते हैं
  rationale: यह किसी की हानि या बुराई चाहने के अर्थ को संक्षिप्त और गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: דִּבְּרוּ הַוּוֹת
  choice: विनाश की बातें करते हैं
  rationale: הַוּוֹת में विनाश, विपत्ति या बरबादी का भाव है; यह चयन हानिकारक वाणी की शक्ति बनाए रखता है, पर क्रिया में 'षड्यंत्र रचना' का अतिरिक्त अर्थ नहीं जोड़ता।
- source_word: וּמִרְמוֹת
  choice: छल की बातें
  rationale: बहुवचन रूप छलपूर्ण या कपटभरी उक्तियों को सूचित करता है; हिन्दी में यह पदबंध वाणी के संदर्भ को स्पष्ट और स्वाभाविक रखता है।
- source_word: כָּל הַיּוֹם
  choice: दिन भर
  rationale: निरंतरता व्यक्त करने वाला सहज आधुनिक हिन्दी रूप।
- source_word: יֶהְגּוּ
  choice: बुदबुदाते रहते हैं
  rationale: הגה के धीमे बोलने, मनन करने या गुनगुनाने जैसे व्यापक अर्थों में से यह शत्रुतापूर्ण प्रसंग में लगातार धीमी छलपूर्ण वाणी को दर्शाता है, बिना इसे केवल 'षड्यंत्र रचने' तक सीमित किए।
