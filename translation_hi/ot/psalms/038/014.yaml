  yaml_path: translation/ot/psalms/038/014.yaml
  text: And I became like a man who does not hear[a], and in whose mouth there are no reproofs.
translation:
  language: hi
  text: और मैं ऐसे मनुष्य के समान हो गया जो सुनता नहीं, और जिसके मुँह में कोई प्रतिवाद[a] नहीं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “ताड़नाएँ,” “दलीलें,” अथवा “उत्तर।” हिब्रू शब्द मौखिक सुधार या विरोध में दिए गए उत्तरों का अर्थ दे सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֱהִי
  choice: और मैं ... हो गया
  rationale: היה के प्रथम पुरुष एकवचन रूप को कथन की प्रगति सहित व्यक्त करता है; ‘हो गया’ तुलना में आई स्थिति को स्वाभाविक हिंदी में सामने लाता है।
- source_word: כְּאִישׁ
  choice: ऐसे मनुष्य के समान
  rationale: אִישׁ का पुल्लिंग एकवचन और כְּ की तुलना दोनों सुरक्षित रहते हैं; ‘ऐसे’ आगे आने वाले संबंधवाचक उपवाक्य को सहजता से जोड़ता है।
- source_word: אֲשֶׁר לֹא שֹׁמֵעַ
  choice: जो सुनता नहीं
  rationale: שׁמע का सीधा अर्थ ‘सुनना’ रखा गया है। ‘सुन नहीं सकता’ कहने से ऐसी असमर्थता जुड़ती जो मूल पाठ में स्पष्ट नहीं है।
- source_word: וְאֵין
  choice: और ... कोई ... नहीं
  rationale: अस्तित्व-निषेध אֵין को स्वाभाविक हिंदी में व्यक्त करते हुए आरंभिक संयोजक ‘और’ भी सुरक्षित रखा गया है।
- source_word: בְּפִיו
  choice: जिसके मुँह में
  rationale: शाब्दिक शारीरिक रूपक ‘उसके मुँह में’ को बनाए रखते हुए इसे पहले उपवाक्य से संबंधवाचक ढंग से जोड़ा गया है।
- source_word: תּוֹכָחוֹת
  choice: प्रतिवाद
  rationale: संदर्भ में आरोप लगाने वालों के सामने वक्ता की मौनता है; इसलिए ‘प्रतिवाद’ विरोध में दिए जाने वाले उत्तर या दलील का भाव देता है, जबकि शब्द की अन्य संभव अर्थछायाएँ पादटिप्पणी में रखी गई हैं।
