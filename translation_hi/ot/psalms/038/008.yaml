  language: hi
  text: मैं निढाल हो गया हूँ और बुरी तरह कुचला गया हूँ; अपने हृदय की कराह के कारण मैं दहाड़ता हूँ।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נְפוּגוֹתִי
  choice: मैं निढाल हो गया हूँ
  rationale: यह रूप दुर्बल, शिथिल या सुन्न पड़ जाने की दशा व्यक्त करता है; ‘निढाल’ आधुनिक हिन्दी में शारीरिक और भावनात्मक टूटन दोनों को स्वाभाविक रूप से व्यक्त करता है।
- source_word: וְנִדְכֵּיתִי עַד־מְאֹד
  choice: और बुरी तरह कुचला गया हूँ
  rationale: निफ़अल रूप दबाए या कुचले जाने की दशा बताता है, और עַד־מְאֹד उसकी तीव्रता को अत्यधिक बताता है।
- source_word: שָׁאַגְתִּי
  choice: मैं दहाड़ता हूँ
  rationale: क्रिया सामान्य कराहने से अधिक प्रबल, सिंह की दहाड़ जैसी ऊँची पुकार को दर्शाती है; इसलिए मूल की तीव्रता बनाए रखी गई है।
- source_word: מִנַּהֲמַת לִבִּי
  choice: अपने हृदय की कराह के कारण
  rationale: מִן को कारणसूचक समझा गया है और נַהֲמָה को भीतर की गहरी कराह के रूप में प्रस्तुत किया गया है; ‘हृदय’ मूल के आंतरिक भाव-केंद्र को बनाए रखता है।
