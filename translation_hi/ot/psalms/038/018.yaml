lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले कथन का कारण या स्पष्टीकरण प्रस्तुत करता है; ‘क्योंकि’ हिन्दी में इसके संयोजक बल को स्वाभाविक रूप से रखता है।
- source_word: עֲוֺנִי
  choice: अपना अधर्म
  rationale: עָוֹן अपराधपूर्ण आचरण और उससे जुड़ा दोष, दोनों सूचित कर सकता है। ‘अधर्म’ नैतिक गंभीरता बनाए रखता है, जबकि स्वामित्व के लिए ‘अपना’ स्वाभाविक हिन्दी है।
- source_word: אַגִּיד
  choice: स्वीकार करता हूँ
  rationale: נגד का हिफ़ील रूप मूलतः ‘बताता/प्रकट करता हूँ’ है। अपने अधर्म को प्रकट करने के इस पश्चात्तापपूर्ण संदर्भ में ‘स्वीकार करता हूँ’ स्वाभाविक है, और अधिक शाब्दिक विकल्प पादटिप्पणी में सुरक्षित है।
- source_word: אֶדְאַג
  choice: व्याकुल हूँ
  rationale: דאג चिंतित, उद्विग्न या परेशान होने का भाव व्यक्त करता है। ‘व्याकुल हूँ’ यहाँ पाप के कारण आंतरिक बेचैनी को गरिमापूर्ण और सहज हिन्दी में व्यक्त करता है।
- source_word: מֵחַטָּאתִי
  choice: अपने पाप के कारण
  rationale: यहाँ מִן कारण या अवसर सूचित करता है; ‘के कारण’ उस संबंध को स्पष्ट और स्वाभाविक रखता है।
- source_word: חַטָּאתִי
  choice: अपने पाप
  rationale: חַטָּאת के लिए ‘पाप’ सीधा और सामान्य हिन्दी समतुल्य है।
theological_decisions:
- issue: पश्चात्ताप के भजन में अधर्म प्रकट करने और भीतरी व्याकुलता का संबंध
  choice: पद को अपने अधर्म की व्यक्तिगत स्वीकृति और पाप के कारण व्याकुलता के रूप में प्रस्तुत किया गया है।
  alternative: אַגִּיד को अधिक शाब्दिक रूप से ‘मैं अपना अधर्म बताता/प्रकट करता हूँ’ कहा जा सकता है, जिससे औपचारिक अंगीकार का भाव कम स्पष्ट होगा।
  rationale: इब्रानी क्रिया स्वयं ‘बताने/प्रकट करने’ का अर्थ देती है, जबकि पश्चात्तापपूर्ण प्रसंग ‘स्वीकार करता हूँ’ को उचित बनाता है। अनुवाद इससे आगे बढ़कर पश्चात्ताप का कोई सम्प्रदायगत या व्यवस्थित धर्मवैज्ञानिक अर्थ नहीं जोड़ता।
