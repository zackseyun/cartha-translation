theological_decisions:
- issue: शीर्षक में לְדָוִד का संबंध
  choice: दाऊद का
  alternative: दाऊद द्वारा / दाऊद के लिए
  rationale: मूल इब्रानी में रचनाकारिता, संबंध या समर्पण के बीच पूर्ण स्पष्टता नहीं है; मुख्य पाठ में इस तनाव को किसी एक संकीर्ण अर्थ तक सीमित नहीं किया गया।
- issue: לְהַזְכִּיר में स्मरण का कर्ता अथवा लक्ष्य
  choice: स्मरण कराने के लिए
  alternative: स्मारक के लिए / स्मरण के लिए
  rationale: मूल शीर्षक यह स्पष्ट नहीं करता कि परमेश्वर को, उपासक को, या समुदाय को स्मरण कराया जाता है; अनुवाद उस अनिश्चितता को बनाए रखता है।
