  choice: भजन
  rationale: भजन-संग्रह के शीर्षकों में यह किसी वाद्य-संगीत से जुड़े गीत अथवा स्तोत्र का प्रचलित विधा-सूचक शब्द है; हिन्दी में “भजन” स्वाभाविक और स्थापित समतुल्य है।
- source_word: לְדָוִד
  choice: दाऊद का
