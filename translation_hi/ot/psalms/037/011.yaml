  text: וַ/עֲנָוִ֥ים יִֽירְשׁוּ אָ֑רֶץ וְ֝/הִתְעַנְּג֗וּ עַל רֹ֥ב שָׁלֽוֹם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/037/011.yaml
  text: But the humble will inherit the land and delight themselves in abundant peace[a][b].
translation:
  language: hi
  text: परन्तु नम्र लोग[a] देश को विरासत में पाएँगे और भरपूर शांति में आनंद लेंगे[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘दीन लोग’।
    reason: lexical_alternative
  - marker: b
    text: या ‘पृथ्वी’।
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲנָוִים
  choice: नम्र लोग
  rationale: यह बहुवचन संज्ञा दीनता और नम्रता का भाव व्यक्त करती है। ‘नम्र लोग’ आधुनिक हिन्दी में सहज है और इसे केवल दुर्बलता या संकोच के अर्थ तक सीमित नहीं करती।
- source_word: יִירְשׁוּ
  choice: के अधिकारी होंगे
  rationale: ירשׁ विरासत पाने अथवा अधिकार में लेने को दर्शाता है। ‘के अधिकारी होंगे’ हिन्दी में स्वाभाविक रहते हुए भावी अधिकार और वाचा-संबंधी प्रतिध्वनि बनाए रखता है।
- source_word: אָרֶץ
  choice: देश
  rationale: אֶרֶץ का अर्थ ‘देश/भूमि’ या ‘पृथ्वी’ हो सकता है। इस भजन में अधिकार पाने और देश से काटे जाने की पुनरावृत्ति के कारण ‘देश’ प्रसंगानुकूल है; व्यापक विकल्प फुटनोट में रखा गया है।
- source_word: וְהִתְעַנְּגוּ
  choice: और ... आनन्दित होंगे
  rationale: Hitpael रूप गहरा आनन्द लेने को व्यक्त करता है। हिन्दी में ‘से आनन्दित होंगे’ इस भाव को स्वाभाविक और गरिमापूर्ण ढंग से देता है।
- source_word: עַל
  choice: से
  rationale: यद्यपि इसका मूल स्थानिक अर्थ ‘पर’ है, आनन्द और अमूर्त संज्ञा के साथ हिन्दी मुहावरे में ‘से आनन्दित’ स्वाभाविक है।
- source_word: רֹב
  choice: भरपूर
  rationale: यह शब्द बहुतायत या प्रचुरता बताता है। ‘भरपूर’ सामान्य आधुनिक हिन्दी में शान्ति की प्रचुरता स्पष्ट करता है।
- source_word: שָׁלוֹם
  choice: शान्ति
  rationale: שָׁלוֹם में कुशलता, पूर्णता और सुरक्षित समृद्धि भी समाहित हो सकती है, पर ‘शान्ति’ इसका मानक, संक्षिप्त और प्रसंगानुकूल अनुवाद है।
theological_decisions:
- issue: मत्ती 5:5 और परम्परागत ‘नम्र लोग पृथ्वी के अधिकारी होंगे’ से अन्तरपाठीय संबंध
  choice: मुख्य पाठ में इब्रानी प्रसंग के अनुसार ‘नम्र लोग देश के अधिकारी होंगे’ रखा गया है और ‘पृथ्वी’ को वैध वैकल्पिक अर्थ के रूप में फुटनोट में दिया गया है।
  alternative: नम्र लोग पृथ्वी के अधिकारी होंगे।
  rationale: यह चयन परिचित परम्परागत वाक्यांश को स्वतः प्रधान बनाने के बजाय मूल इब्रानी और भजन के निकटवर्ती प्रसंग का अनुसरण करता है, जबकि व्यापक अर्थ और बाद की अन्तरपाठीय प्रतिध्वनि को दबाता नहीं।
translation_notes:
  register: आधुनिक मानक हिन्दी, सरल किंतु गरिमापूर्ण काव्यात्मक शैली। ‘परन्तु’ विरोधसूचक וַ को स्पष्ट करता है। ‘नम्र’ के लिए अलग फुटनोट आवश्यक नहीं माना गया, क्योंकि हिन्दी में यही पारम्परिक और आधुनिक दोनों संदर्भों में स्वाभाविक है; ‘दीन’ प्रसंगतः सम्भव है, पर उससे आर्थिक या पीड़ित अवस्था पर अनावश्यक बल पड़ सकता है।
