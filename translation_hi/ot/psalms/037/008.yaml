source:
  edition: WLC
  text: הֶ֣רֶף מֵ֭/אַף וַ/עֲזֹ֣ב חֵמָ֑ה אַל תִּ֝תְחַ֗ר אַךְ לְ/הָרֵֽעַ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/037/008.yaml
  text: Let go of anger[a], and abandon wrath[b]; do not be provoked—it only leads to evil.
translation:
  language: hi
  text: क्रोध छोड़ दे, और रोष त्याग दे; मत कुढ़—इससे केवल बुराई ही होती है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या, अधिक शाब्दिक रूप से: “मत कुढ़—केवल बुराई करने ही को।” अंतिम पदबंध को उद्देश्य अथवा परिणाम के अर्थ में समझा जा सकता है।'
    reason: alternative_reading
lexical_decisions:
- source_word: הֶרֶף מֵאַף
  choice: क्रोध छोड़ दे
  rationale: רפה का आदेशात्मक रूप यहाँ किसी भाव को छोड़ने या उससे हट जाने का निर्देश देता है; אַף का प्रचलित रूपकात्मक अर्थ ‘क्रोध’ है। यह हिंदी में स्वाभाविक और संक्षिप्त है।
- source_word: וַעֲזֹב חֵמָה
  choice: और जलजलाहट त्याग दे
  rationale: עזב का अर्थ छोड़ना या त्यागना है, और חֵמָה तीव्र, दहकते क्रोध को व्यक्त करता है। ‘जलजलाहट’ पहले ‘क्रोध’ से काव्यात्मक भेद बनाए रखती है।
- source_word: אַל תִּתְחַר
  choice: मत कुढ़
  rationale: Hitpael रूप भावनात्मक रूप से तपने, खीजने या व्याकुल होने का अर्थ दे सकता है। ‘मत कुढ़’ इस भजन में दुष्टों को देखकर भीतर-ही-भीतर जलने की चेतावनी को सहज हिंदी में व्यक्त करता है।
- source_word: אַךְ לְהָרֵעַ
  choice: इससे केवल बुराई ही होगी
  rationale: אַךְ का सीमात्मक बल ‘केवल ... ही’ से व्यक्त हुआ है। לְהָרֵעַ उद्देश्य (‘बुराई करने के लिए’) अथवा परिणाम की दिशा बता सकता है; मुख्य पाठ में प्रसंगानुकूल परिणाम रखा गया है और अधिक शाब्दिक विकल्प पाद-टिप्पणी में दिया गया है।
theological_decisions:
- issue: अंतिम वाक्यांश का नैतिक बल
  choice: क्रोधपूर्ण कुढ़न का परिणाम बुराई होना
  alternative: ‘केवल बुराई करने के लिए’
  rationale: इब्रानी infinitive construction उद्देश्य और परिणाम, दोनों की छाया रख सकती है। प्रसंग परिणामसूचक चेतावनी का समर्थन करता है, पर उद्देश्यसूचक अधिक शाब्दिक पाठ को पाद-टिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण, काव्यात्मक और सामान्य पाठक के लिए सुबोध शैली। ‘क्रोध’ और ‘जलजलाहट’ समानांतर इब्रानी शब्दों का अर्थगत भेद रखते हैं; ‘कुढ़’ इस भजन में बार-बार आने वाली भीतर की उत्तेजना और खीज को व्यक्त करता है।
