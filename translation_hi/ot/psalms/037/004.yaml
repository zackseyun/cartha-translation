  yaml_path: translation/ot/psalms/037/004.yaml
  text: Delight yourself in Yahweh[a], and he will give you the desires of your heart.
translation:
  language: hi
  text: 'याहवेह में आनन्द ले,

    और वह तुम्हारे मन की अभिलाषाएँ[a] पूरी करेगा।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘तुम्हारे मन की माँगें।’ इब्रानी संज्ञा भीतर की इच्छाओं और उन बातों, दोनों का अर्थ दे सकती है जिन्हें कोई माँगता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הִתְעַנַּג
  choice: आनन्दित हो
  rationale: हित्पएल आज्ञार्थक यहाँ स्वयं याहवेह में आनन्द पाने या प्रसन्न रहने का आह्वान करता है। ‘आनन्दित हो’ आधुनिक हिन्दी में स्वाभाविक है और इस भाव को व्यक्त करता है।
- source_word: עַל
  choice: में
  rationale: यद्यपि इसका मूल स्थानिक अर्थ ‘पर’ है, आनन्द लेने के इस प्रयोग में हिन्दी का स्वाभाविक सम्बन्धसूचक शब्द ‘में’ है।
- source_word: יְהוָה
  choice: याहवेह
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय लिप्यन्तरित किया गया है।
- source_word: יִתֶּן
  choice: पूरी करेगा
  rationale: शाब्दिक अर्थ ‘देगा’ है, पर ‘मन की अभिलाषाएँ देना’ हिन्दी में अस्वाभाविक है; अभिलाषाओं के साथ ‘पूरी करेगा’ वही परिणाम स्वाभाविक रूप से व्यक्त करता है।
- source_word: מִשְׁאֲלוֹת
  choice: अभिलाषाएँ
  rationale: यह बहुवचन संज्ञा माँगी गई वस्तुओं अथवा भीतरी इच्छाओं, दोनों का बोध करा सकती है। ‘मन’ के साथ ‘अभिलाषाएँ’ काव्यात्मक और स्वाभाविक है; दूसरा अर्थ पादटिप्पणी में रखा गया है।
- source_word: לִבֶּךָ
  choice: तुम्हारे मन की
  rationale: इब्रानी ‘हृदय’ इच्छा, संकल्प और भीतरी व्यक्ति को समेटता है। इस वाक्य में हिन्दी ‘मन की अभिलाषाएँ’ सर्वाधिक स्वाभाविक है और आन्तरिक चाह का भाव बनाए रखता है।
theological_decisions:
- issue: प्रतिज्ञा को सांसारिक समृद्धि की गारंटी मान लेने की सम्भावना
  choice: प्रतिज्ञा को बिना किसी अतिरिक्त सीमा के सीधे रूप में रखा गया है।
  alternative: मुख्य पाठ में ‘भली अभिलाषाएँ’ जोड़ना या यह कहना कि परमेश्वर पहले इच्छाओं को बदलता है।
  rationale: इब्रानी पाठ ऐसी व्याख्यात्मक शर्तें नहीं जोड़ता। अनुवाद को प्रतिज्ञा की वास्तविक तीव्रता और उससे उत्पन्न धर्मवैचारिक तनाव दोनों बनाए रखने चाहिए।
- issue: ईश्वरीय नाम का अनुवाद
  choice: याहवेह
  alternative: प्रभु या यहोवा
  rationale: मूल पाठ में יְהוָה व्यक्तिगत नाम है; इसलिए उपाधि रखने के बजाय उसका लिप्यन्तरण किया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और काव्यात्मक रूप अपनाया गया है। दूसरी पंक्ति में ‘देगा’ के स्थान पर हिन्दी की स्वाभाविक अभिव्यक्ति ‘अभिलाषाएँ पूरी करेगा’ रखी गई है। पादटिप्पणी-चिह्न उसी शब्दसमूह के बाद है जिससे उसका सम्बन्ध है।
