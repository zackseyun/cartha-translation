source:
  edition: WLC
  text: ס֣וּר מֵ֭/רָע וַ/עֲשֵׂה ט֗וֹב וּ/שְׁכֹ֥ן לְ/עוֹלָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/037/027.yaml
  text: Turn away from evil and do good[a], and dwell forever.
translation:
  language: hi
  text: बुराई से दूर हो जाओ और भलाई करो[a], और सदा बसे रहो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'भजन में बार-बार आने वाले विषय को ध्यान में रखते हुए इसका भाव यह भी हो सकता है: “और देश में सदा बसे रहो” या “और सदा सुरक्षित रहो।” यहाँ इब्रानी पाठ में “देश में” स्पष्ट रूप से नहीं लिखा है।'
    reason: alternative_reading
lexical_decisions:
- source_word: סוּר
  choice: दूर हो जाओ
  rationale: आज्ञार्थक क्रिया का अर्थ मुड़ जाना, हट जाना या अपने को अलग कर लेना है। नैतिक संदर्भ में ‘दूर हो जाओ’ सहज आधुनिक हिन्दी में इच्छापूर्वक बुराई छोड़ने का भाव व्यक्त करता है।
- source_word: מֵרָע
  choice: बुराई से
  rationale: מִן उपसर्ग उस वस्तु को बताता है जिससे दूर होना है; यहाँ רַע का नैतिक अर्थ ‘बुराई’ सबसे उपयुक्त है।
- source_word: וַעֲשֵׂה טוֹב
  choice: और भलाई करो
  rationale: आज्ञार्थक क्रिया और संज्ञा के समान प्रयुक्त विशेषण का संक्षिप्त तथा स्वाभाविक अनुवाद; यह पहली आज्ञा के समानांतर ढाँचे को बनाए रखता है।
- source_word: וּשְׁכֹן
  choice: और बसे रहो
  rationale: क्रिया में बसने, निवास करने और टिके रहने का भाव है। ‘बसे रहो’ हिन्दी में निवास तथा स्थायित्व दोनों की छवि बनाए रखता है।
- source_word: לְעוֹלָם
  choice: सदा
  rationale: यह दीर्घकालीन अथवा अनिश्चित निरंतरता बताता है। ‘सदा’ यहाँ संक्षिप्त और स्वाभाविक है तथा इब्रानी की संक्षिप्त अभिव्यक्ति को बनाए रखता है।
theological_decisions:
- issue: וּשְׁכֹן לְעוֹלָם में आज्ञा या निहित प्रतिज्ञा तथा निवास के स्थान का प्रश्न
  choice: मुख्य पाठ में आज्ञार्थक क्रम को सीधे ‘और सदा बसे रहो’ कहना और किसी स्थान को स्पष्ट रूप से न जोड़ना
  alternative: ‘और देश में सदा बसे रहो’ अथवा ‘और सदा सुरक्षित रहो’
  rationale: इब्रानी में क्रियाएँ आज्ञार्थक क्रम में हैं और इस पद में निवास का स्थान स्पष्ट नहीं है। पूरे भजन में देश में स्थायी निवास का विषय बार-बार आता है, पर उसे मुख्य पाठ में जोड़ने से मूल की संक्षिप्तता और वास्तविक अस्पष्टता समाप्त हो जाती; इसलिए संदर्भगत अर्थ को पादटिप्पणी में रखा गया है।
translation_notes:
  register: भाषा आधुनिक, सरल और गरिमापूर्ण रखी गई है। ‘बसे रहो’ निवास और स्थायित्व की छवि देता है; पद के आज्ञार्थक समानांतर ढाँचे तथा मूल की अस्पष्टता को सुरक्षित रखा गया है।
