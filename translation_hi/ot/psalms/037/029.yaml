  text: צַדִּיקִ֥ים יִֽירְשׁוּ אָ֑רֶץ וְ/יִשְׁכְּנ֖וּ לָ/עַ֣ד עָלֶֽי/הָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/037/029.yaml
  text: The righteous will inherit the land and dwell on it forever[a].
translation:
  language: hi
  text: धर्मी लोग देश को विरासत में पाएँगे और उस देश में सदा बसे रहेंगे।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘पृथ्वी।’ इब्रानी אֶרֶץ का अर्थ ‘देश’ या ‘पृथ्वी’ हो सकता है; यहाँ भजन 37 में बार-बार प्रयुक्त भाषा के अनुरूप ‘देश’ रखा गया है।
    reason: alternative_reading
lexical_decisions:
- source_word: צַדִּיקִים
  choice: धर्मी लोग
  rationale: बहुवचन विशेषण यहाँ संज्ञा के रूप में धर्मी व्यक्तियों के वर्ग को दर्शाता है। ‘धर्मी लोग’ आधुनिक हिन्दी में स्वाभाविक और स्पष्ट है।
- source_word: יִירְשׁוּ
  choice: वारिस होंगे
  rationale: ירשׁ विरासत पाने या अधिकार में लेने का अर्थ देता है। ‘वारिस होंगे’ भजन 37 में बार-बार आनेवाली प्रतिज्ञा और विरासत की भावछाया को बनाए रखता है।
- source_word: אָרֶץ
  choice: देश
  rationale: אֶרֶץ का अर्थ ‘देश/भूमि’ या ‘पृथ्वी’ हो सकता है। भजन 37 में दोहराई गई विरासत की भाषा के कारण मुख्य पाठ में ‘देश’ उपयुक्त है; व्यापक अर्थ पाद-टिप्पणी में सुरक्षित है।
- source_word: וְיִשְׁכְּנוּ
  choice: और ... बसे रहेंगे
  rationale: שׁכן बसने और स्थायी निवास करने को व्यक्त करता है। ‘बसे रहेंगे’ हिन्दी में स्थिर और निरंतर निवास का स्वाभाविक बोध देता है।
- source_word: לָעַד
  choice: सदा
  rationale: यह पदबंध निरंतर और स्थायी अवधि को दर्शाता है; ‘सदा’ संक्षिप्त, गरिमापूर्ण और सहज आधुनिक हिन्दी है।
- source_word: עָלֶיהָ
  choice: उस पर
  rationale: על के साथ स्त्रीलिंग एकवचन प्रत्यय का संकेत אָרֶץ की ओर है। ‘उस पर’ मूल के स्थान-संबंध को सीधे बनाए रखता है।
theological_decisions:
- issue: प्रतिज्ञा के संदर्भ में אָרֶץ का दायरा
  choice: देश
  alternative: पृथ्वी
  rationale: भजन 37 के निकट साहित्यिक संदर्भ में देश का वारिस होने की भाषा बार-बार आती है, इसलिए मुख्य पाठ में ‘देश’ रखा गया है। चूँकि इब्रानी शब्द व्यापक अर्थ में ‘पृथ्वी’ भी हो सकता है, उस संभावना को पाद-टिप्पणी में रखा गया है और धार्मिक तनाव को निर्णायक रूप से हल नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण शैली। ‘धर्मी लोग’ सामान्य पाठक के लिए स्पष्ट है; ‘वारिस होंगे’ विरासत और प्रतिज्ञा की भावछाया रखता है; ‘बसे रहेंगे’ स्थायी निवास को स्वाभाविक ढंग से व्यक्त करता है।
