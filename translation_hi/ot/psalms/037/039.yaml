base_translation:
  language: en
  yaml_path: translation/ot/psalms/037/039.yaml
  text: The salvation of the righteous is from Yahweh[c][b][a]; he is their stronghold in a time of trouble.
translation:
  language: hi
  text: 'धर्मियों का उद्धार[a] याहवे[b] से होता है;

    संकट के समय वह उनका गढ़[c] है।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘छुटकारा’; इब्रानी शब्द बचाव या विजय का अर्थ भी दे सकता है।
    reason: lexical_alternative
  - marker: b
    text: 'इब्रानी: YHWH; इसे ‘यहोवा’ भी कहा जाता है और परंपरागत रूप से ‘प्रभु’ अनूदित किया जाता है।'
    reason: alternative_reading
  - marker: c
    text: या ‘शरणस्थान’ अथवा ‘किला’।
    reason: lexical_alternative
lexical_decisions:
- source_word: וּתְשׁוּעַת
  choice: उद्धार
  rationale: תְּשׁוּעָה बचाव, छुटकारे या विजय का अर्थ दे सकता है। ‘उद्धार’ भजन के व्यापक धार्मिक भाव और इस प्रसंग के ठोस बचाव—दोनों को समेटता है।
- source_word: צַדִּיקִים
  choice: धर्मियों
  rationale: बहुवचन विशेषण यहाँ संज्ञा के रूप में प्रयुक्त है। ‘धर्मियों’ आधुनिक हिन्दी में स्वाभाविक है और धार्मिकता से पहचाने जाने वाले लोगों के वर्ग को व्यक्त करता है।
- source_word: מֵיְהוָה
  choice: याहवे से होता है
  rationale: מִן स्रोत बताता है। हिन्दी में विधेय को स्पष्ट और स्वाभाविक बनाने के लिए ‘से होता है’ कहा गया है।
- source_word: יְהוָה
  choice: याहवे
  rationale: चार अक्षरों वाले परमेश्वर के निजी नाम YHWH को पदवी से बदलने के बजाय लिप्यंतरित किया गया है।
- source_word: מָעוּזָּם
  choice: उनका दृढ़ गढ़
  rationale: מָעוֹז शक्ति और सुरक्षा देने वाले किलेबंद स्थान का बिंब रखता है। ‘दृढ़ गढ़’ उस रक्षात्मक बिंब तथा बहुवचन संबंधवाचक प्रत्यय—दोनों को बनाए रखता है।
- source_word: בְּעֵת צָרָה
  choice: संकट के समय
  rationale: यह स्वाभाविक आधुनिक हिन्दी में इब्रानी कालवाचक वाक्यांश और צָרָה की विपत्ति या परेशानी की भावना को संक्षेप में व्यक्त करता है।
theological_decisions:
- issue: परमेश्वर के नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में निजी वाचा-नाम सीधे आया है। ‘याहवे’ उसे पदवी में बदले बिना सुरक्षित रखता है; अन्य प्रचलित रूप पादटिप्पणी में दिए गए हैं।
- issue: दूसरे उपवाक्य में निहित कर्ता और योजक क्रिया
  choice: वही उनका दृढ़ गढ़ है
  alternative: संकट के समय उनका दृढ़ गढ़
  rationale: इब्रानी उपवाक्य संज्ञात्मक है और उसमें योजक क्रिया निहित है। हिन्दी में ‘है’ आवश्यक है; ‘वही’ पहले उपवाक्य के याहवे को स्वाभाविक ढंग से पुनः कर्ता बनाता है, बिना नया धार्मिक आशय जोड़े।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। पद की समानांतर काव्यात्मक रचना बनाए रखने के लिए इसे दो पंक्तियों में रखा गया है; ‘दृढ़ गढ़’ मूल के सुरक्षा और सामर्थ्य वाले ठोस बिंब को बनाए रखता है।
