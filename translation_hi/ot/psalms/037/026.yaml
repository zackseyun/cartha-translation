  text: כָּל הַ֭/יּוֹם חוֹנֵ֣ן וּ/מַלְוֶ֑ה וְ֝/זַרְע֗/וֹ לִ/בְרָכָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/037/026.yaml
  text: All day long he is gracious and lends[a], and his offspring are a blessing.
translation:
  language: hi
  text: 'वह दिन भर कृपा करता और उधार देता है,

    और उसकी संतान आशीष बनती है।[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसकी संतान आशीष पाती है।” इब्रानी में शाब्दिक रूप से है, “उसकी संतान आशीष के लिए [होती है]।”
    reason: alternative_reading
lexical_decisions:
- source_word: כָּל הַיּוֹם
  choice: दिन भर
  rationale: यह इब्रानी मुहावरा निरंतर या नियमित रूप से किए जाने वाले कार्य को दर्शाता है; ‘दिन भर’ स्वाभाविक आधुनिक हिन्दी है और उसके कालगत बल को बनाए रखता है।
- source_word: חוֹנֵן
  choice: कृपा करता
  rationale: חנן का कृदन्त रूप अनुग्रह या कृपा दिखाने का भाव रखता है। प्रसंग में इसमें उदारता शामिल है, पर ‘कृपा करता’ मूल शब्द के व्यापक अर्थ को केवल आर्थिक उदारता तक सीमित नहीं करता।
- source_word: וּמַלְוֶה
  choice: और उधार देता है
  rationale: לוה का हिफ़ील रूप यहाँ उधार लेने नहीं, उधार देने का अर्थ देता है। यह हिन्दी प्रयोग नियमित और उदार व्यवहार को स्पष्ट रूप से व्यक्त करता है।
- source_word: וְזַרְעוֹ
  choice: और उसकी संतान
  rationale: זֶרַע सामूहिक अर्थ में संतान या वंशजों को सूचित करता है। ‘संतान’ आधुनिक हिन्दी में स्वाभाविक है और ‘बीज’ के भ्रामक शाब्दिकपन से बचता है।
- source_word: לִבְרָכָה
  choice: आशीष का कारण होती है
  rationale: शाब्दिक रचना ‘आशीष के लिए’ है। ‘आशीष का कारण होती है’ यह भाव सुरक्षित रखता है कि संतान स्वयं दूसरों के लिए आशीष सिद्ध होती है, न कि केवल आशीष पाती है।
theological_decisions:
- issue: अंतिम पदबंध לִבְרָכָה का अर्थ
  choice: उसकी संतान आशीष का कारण होती है
  alternative: उसकी संतान आशीषित होती है
  rationale: ל उपसर्ग के साथ בְּרָכָה अधिक स्वाभाविक रूप से परिणाम या भूमिका—‘आशीष के लिए’—व्यक्त करता है। इसलिए मुख्य पाठ संतान को आशीष का कारण बताता है; फिर भी ‘आशीषित होती है’ की सम्भव समझ को पादटिप्पणी में रखा गया है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। काव्यात्मक समानांतरता के लिए पद को दो पंक्तियों में रखा गया है। ‘कृपा करता’ मूल शब्द का व्यापक नैतिक भाव बनाए रखता है, जबकि ‘उधार देता है’ उसका ठोस सामाजिक प्रकटीकरण बताता है।
