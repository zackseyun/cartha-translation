  text: But he passed by[a], and behold, he was no more; I sought him, but he could not be found.
translation:
  language: hi
  text: फिर वह चला गया, और देखो, वह नहीं था; मैंने उसे ढूँढ़ा, पर वह नहीं मिला।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעֲבֹר
  choice: वह जाता रहा
  rationale: עבר का मूल अर्थ ‘गुज़रना/चले जाना’ है। संदर्भ में यह दुष्ट व्यक्ति के दृश्य से लुप्त हो जाने को व्यक्त करता है, पर उसकी मृत्यु को अनिवार्य रूप से नहीं ठहराता; इसलिए अस्पष्टता बनाए रखी गई है।
- source_word: וְהִנֵּה
  choice: और देखो
  rationale: הִנֵּה अप्रत्याशित परिणाम की ओर ध्यान खींचता है। ‘और देखो’ आधुनिक, सहज हिंदी में उसका कथात्मक और काव्यात्मक बल बनाए रखता है।
- source_word: אֵינֶנּוּ
  choice: वह नहीं रहा
  rationale: यह इब्रानी मुहावरा अनुपस्थिति या अब दिखाई न देने को व्यक्त करता है। हिंदी में ‘वह नहीं रहा’ उसकी संक्षिप्तता और गंभीरता रखता है, यद्यपि संदर्भ में इसे केवल मृत्यु तक सीमित नहीं करना चाहिए।
- source_word: וָאֲבַקְשֵׁהוּ
  choice: मैंने उसे ढूँढ़ा
  rationale: בקשׁ यहाँ किसी को खोजने के अर्थ में है। ‘ढूँढ़ा’ साधारण आधुनिक हिंदी में स्वाभाविक और स्पष्ट है।
- source_word: וְלֹא נִמְצָא
  choice: पर वह नहीं मिला
  rationale: מצא का निफ़अल रूप ‘पाया/मिला जाना’ दर्शाता है। ‘नहीं मिला’ हिंदी में स्वाभाविक रूप से निष्फल खोज का परिणाम बताता है; ‘पर’ निहित विरोध को स्पष्ट करता है।
theological_decisions:
- issue: עבר से मृत्यु या केवल चले जाने का संकेत
  choice: मुख्य पाठ में ‘जाता रहा’ रखकर अर्थ को खुला रखा गया
  alternative: ‘मर गया’ या ‘गुज़र गया’
  rationale: मूल क्रिया स्वयं स्पष्ट रूप से मृत्यु नहीं बताती। संदर्भ अचानक अनुपस्थिति का है, इसलिए मृत्यु को निश्चित करना अनावश्यक धर्मवैचारिक व्याख्या जोड़ देता।
translation_notes:
  register: आधुनिक मानक हिंदी में संक्षिप्त, गरिमापूर्ण और काव्यात्मक शैली रखी गई है। ‘और देखो’ मूल के ध्यानाकर्षक पद को बनाए रखता है; ‘जाता रहा’ मृत्यु का अर्थ थोपे बिना अचानक अनुपस्थिति की ओर ले जाता है।
