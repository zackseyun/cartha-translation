lexical_decisions:
- source_word: וְהוֹצִיא
  choice: प्रकट करेगा
  rationale: हिफ़ील रूप किसी वस्तु को बाहर लाने या सामने ले आने का कारणात्मक भाव देता है। इस प्रसंग में ‘प्रकट करेगा’ धार्मिकता और न्याय के सबके सामने स्पष्ट हो जाने का स्वाभाविक हिन्दी रूप है।
- source_word: כָאוֹר
  choice: प्रकाश के समान
  rationale: כ तुलना सूचित करता है और אוֹר का अर्थ ‘प्रकाश’ है। यह रूप मूल उपमा और स्पष्ट दिखाई देने के बिंब को बनाए रखता है।
- source_word: צִדְקֶךָ
  choice: तुम्हारी धार्मिकता
  rationale: צדק धार्मिकता, सही होने की अवस्था या सही सिद्ध किए जाने का भाव व्यक्त कर सकता है। मुख्य पाठ में ‘धार्मिकता’ मूल शब्द से निकटता और पारंपरिक अर्थ-व्याप्ति बनाए रखता है; प्रसंगगत विकल्प पाद-टिप्पणी में दिया गया है।
- source_word: וּמִשְׁפָּטֶךָ
  choice: और तुम्हारे न्याय
  rationale: מִשְׁפָּט के अर्थों में न्याय, न्यायिक निर्णय और किसी का पक्ष या मुकदमा शामिल हैं। ‘न्याय’ मुख्य पाठ में व्यापक और स्वाभाविक है, जबकि ‘पक्ष’ इस प्रसंग की न्यायिक छाया को विकल्प के रूप में सुरक्षित रखता है।
- source_word: כַצָּהֳרָיִם
  choice: दोपहर के समान
  rationale: צָהֳרַיִם का अर्थ दोपहर है। यह अनुवाद मूल उपमा को बिना ‘सूरज’ या ‘उजाला’ जैसे अतिरिक्त शब्द जोड़े बनाए रखता है।
theological_decisions:
- issue: צִדְקֶךָ में नैतिक धार्मिकता और सार्वजनिक रूप से सही सिद्ध किए जाने के बीच अर्थगत तनाव
  choice: मुख्य पाठ में ‘तुम्हारी धार्मिकता’
  alternative: ‘तुम्हारा सही सिद्ध होना’
  rationale: मूल शब्द की व्यापकता को मुख्य पाठ में रखा गया है और प्रसंगगत न्यायिक अर्थ को पाद-टिप्पणी में दिया गया है, ताकि अनुवाद किसी एक व्याख्या को अनावश्यक रूप से निश्चित न करे।
- issue: מִשְׁפָּטֶךָ का अमूर्त ‘न्याय’ अथवा व्यक्ति के न्यायिक ‘पक्ष’ के रूप में अर्थ
  choice: मुख्य पाठ में ‘तुम्हारे न्याय’
  alternative: ‘तुम्हारे पक्ष’
  rationale: काव्यात्मक समानांतरता दोनों अर्थों की अनुमति देती है। ‘न्याय’ शाब्दिक अर्थ-क्षेत्र को सुरक्षित रखता है, और ‘पक्ष’ संभावित कानूनी-संदर्भ को पाद-टिप्पणी में दर्शाता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण काव्यात्मक शैली रखी गई है। वाक्य-क्रम हिन्दी के लिए स्वाभाविक बनाया गया है, जबकि ‘प्रकाश’ और ‘दोपहर’ की समानांतर उपमाएँ तथा मूल की अर्थगत अस्पष्टता सुरक्षित हैं।
