  yaml_path: translation/ot/psalms/037/005.yaml
  text: Commit your way to Yahweh[a]; trust in him[b], and he will act.
translation:
  language: hi
  text: अपना मार्ग याहवे[a] को सौंप दे; उस पर भरोसा रख, और वह कार्य करेगा।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से, “अपना मार्ग याहवे पर लुढ़का दे।” इस मुहावरे का अर्थ अपना जीवन-पथ या अपनी चिंताएँ उसे सौंप देना है।
    reason: lexical_alternative
  - marker: b
    text: या, “वह इसे करेगा” अथवा “वह इसे पूरा करेगा।” इब्रानी में केवल “वह करेगा/कार्य करेगा” है; क्रिया का कर्म स्पष्ट नहीं किया गया है।
    reason: alternative_reading
lexical_decisions:
- source_word: גּוֹל
  choice: सौंप दे
  rationale: मूल अर्थ ‘लुढ़का दे/पर डाल दे’ है, पर יְהוָה के साथ यह मुहावरा अपना जीवन-पथ या चिंता उसके भरोसे सौंपने का भाव देता है। ‘सौंप दे’ आधुनिक हिन्दी में स्वाभाविक और आज्ञार्थक है।
- source_word: עַל
  choice: को
  rationale: ‘सौंपना’ के साथ हिन्दी में ‘को’ स्वाभाविक है; मूल ‘पर’ वाले रूपक को पादटिप्पणी में रखा गया है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिन्दी बाइबल परंपरा में प्रचलित रूप ‘यहोवा’ व्यक्तिगत दिव्य नाम को उपाधि से अलग बनाए रखता है।
- source_word: דַּרְכֶּךָ
  choice: अपना मार्ग
  rationale: ‘मार्ग’ सीधे अर्थ के साथ ज्ञान-साहित्य में जीवन की दिशा और आचरण को भी व्यक्त करता है।
- source_word: וּבְטַח
  choice: भरोसा रख
  rationale: בטח का आज्ञार्थक भाव व्यक्तिगत निर्भरता है; ‘भरोसा रख’ सरल, स्वाभाविक हिन्दी है।
- source_word: עָלָיו
  choice: उस पर
  rationale: हिन्दी में ‘उस पर भरोसा रखना’ स्वाभाविक मुहावरा है और मूल पूर्वसर्ग का भाव भी बनाए रखता है।
- source_word: וְהוּא
  choice: और वही
  rationale: स्वतंत्र सर्वनाम הוּא कर्ता पर बल देता है; ‘वही’ उस बल को हिन्दी में स्पष्ट करता है।
- source_word: יַעֲשֶׂה
  choice: कार्य करेगा
  rationale: עשה का अर्थ व्यापक रूप से ‘करना/कार्य करना’ है और यहाँ कोई कर्म स्पष्ट नहीं है। ‘कार्य करेगा’ इस खुलेपन को बनाए रखता है, बिना यह जोड़ने के कि वह विशेष रूप से क्या करेगा।
theological_decisions:
- issue: दिव्य नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: पद में व्यक्तिगत दिव्य नाम है, केवल ‘प्रभु’ जैसी उपाधि नहीं। ‘यहोवा’ आधुनिक हिन्दी पाठकों में अधिक परिचित नाम-रूप है, यद्यपि ‘याहवे’ मूल उच्चारण का संभावित निकटतर लिप्यंतरण है।
- issue: יַעֲשֶׂה के निहित कर्म को स्पष्ट करना
  choice: कर्म को अनिर्दिष्ट रखते हुए ‘कार्य करेगा’
  alternative: ‘वह इसे पूरा करेगा’ / ‘वह ऐसा करेगा’
  rationale: इब्रानी में क्रिया का स्पष्ट कर्म नहीं दिया गया। उसे न जोड़ने से प्रतिज्ञा की मूल व्यापकता और तनाव सुरक्षित रहता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। एकवचन आज्ञार्थक ‘दे/रख’ मूल इब्रानी के एकवचन संबोधन को दर्शाता है।
