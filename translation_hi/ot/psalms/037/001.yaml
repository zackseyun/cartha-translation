  text: Of David[a]. Do not be provoked by evildoers[b]; do not envy those who do wrong.
translation:
  language: hi
  text: 'दाऊद का।[a]


    बुराई करने वालों के कारण मत झुँझला;


    अन्याय करने वालों से ईर्ष्या मत कर।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इसे ‘दाऊद द्वारा रचित’ या ‘दाऊद के लिए’ भी समझा जा सकता है; इब्रानी शीर्षक दाऊद से संबंध, रचना या समर्पण दर्शा सकता है।
    reason: source_ambiguity
lexical_decisions:
- source_word: לְדָוִד
  choice: दाऊद का भजन
  rationale: לְדָוִד दाऊद से संबंध, रचना या समर्पण का संकेत दे सकता है। हिन्दी भजन-संहिता में स्वाभाविक शीर्षक के लिए ‘दाऊद का भजन’ रखा गया है, जबकि उसकी संभावित व्यापकता पादटिप्पणी में दी गई है।
- source_word: אַל תִּתְחַר בַּמְּרֵעִים
  choice: बुराई करनेवालों के कारण मत झुँझला
  rationale: हित्पएल क्रिया חרה गरम हो उठने, उत्तेजित या खिन्न होने का भाव देती है; ‘मत झुँझला’ आधुनिक हिन्दी में भीतर की खीझ और उत्तेजना को स्वाभाविक ढंग से व्यक्त करता है। ב को यहाँ कारण के अर्थ में लिया गया है।
- source_word: אַל תְּקַנֵּא
  choice: ईर्ष्या मत कर
  rationale: קנא इस संदर्भ में दुष्कर्मियों की स्थिति देखकर ईर्ष्या करने को सूचित करता है; ‘ईर्ष्या मत कर’ स्पष्ट और प्रचलित निषेध है।
- source_word: בְּעֹשֵׂי עַוְלָה
  choice: अन्याय करनेवालों से
  rationale: עֹשֵׂי सक्रिय कृदंत है और עַוְלָה अन्याय, अनुचित काम या अधर्म को दर्शाता है। ‘अन्याय करनेवाले’ सक्रिय अर्थ और नैतिक-सामाजिक व्यापकता दोनों बनाए रखता है।
