source:
  edition: WLC
  text: קַוֵּ֤ה אֶל יְהוָ֨ה וּ/שְׁמֹ֬ר דַּרְכּ֗/וֹ וִֽ֭/ירוֹמִמְ/ךָ לָ/רֶ֣שֶׁת אָ֑רֶץ בְּ/הִכָּרֵ֖ת רְשָׁעִ֣ים תִּרְאֶֽה־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/037/034.yaml
  text: Wait for Yahweh and keep his way[a], and he will exalt you to inherit the land; when the wicked are cut off[c][b], you will see it.
translation:
  language: hi
  text: याहवे की बाट जोह[a] और उसके मार्ग पर चलता रह। वह तुझे ऊँचा उठाएगा, ताकि तू देश[b] का अधिकारी बने; जब दुष्ट काट डाले जाएँगे, तब तू देखेगा।[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘याहवे पर आशा रख।’ इब्रानी क्रिया में धैर्य और आशाभरे भरोसे के साथ प्रतीक्षा करने का भाव है।
    reason: lexical_alternative
  - marker: b
    text: या ‘पृथ्वी।’ इब्रानी אָרֶץ का अर्थ ‘देश’ या ‘पृथ्वी’ हो सकता है। यहाँ भजन 37 में बार-बार आने वाली वाचा-संबंधी विरासत की भाषा के कारण ‘देश’ चुना गया है।
    reason: alternative_reading
  - marker: c
    text: मत्ती 5:5 से तुलना करें, जहाँ देश/पृथ्वी का अधिकार पाने की यह प्रतिज्ञा फिर सुनाई देती है।
    reason: cross_reference
lexical_decisions:
- source_word: קַוֵּה
  choice: बाट जोह
  rationale: यह आज्ञार्थक क्रिया धैर्य और आशाभरे भरोसे के साथ प्रतीक्षा करने का भाव रखती है। ‘बाट जोह’ इस अपेक्षापूर्ण प्रतीक्षा को स्वाभाविक और काव्यात्मक हिन्दी में व्यक्त करता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत नाम יהוה को किसी उपाधि से बदलने के बजाय लिप्यंतरित किया गया है।
- source_word: שְׁמֹר דַּרְכּוֹ
  choice: उसके मार्ग पर चलता रह
  rationale: शाब्दिक ‘उसके मार्ग को थामे रह’ की अपेक्षा यह हिन्दी में स्वाभाविक है और उसके बताए जीवन-मार्ग पर निष्ठापूर्वक बने रहने का आशय सुरक्षित रखता है।
- source_word: וִירוֹמִמְךָ
  choice: वह तुझे ऊँचा उठाएगा
  rationale: रום के हिफ़ील रूप में उठाने या ऊँचा करने का भाव है; यह अनुवाद भावी प्रतिष्ठा और न्यायोचित ठहराए जाने की काव्यात्मक छवि बनाए रखता है।
- source_word: לָרֶשֶׁת אָרֶץ
  choice: ताकि तू देश का अधिकारी हो
  rationale: ירשׁ अधिकार या विरासत पाने को दर्शाता है। ‘अधिकारी हो’ वाचा से जुड़ी विरासत का भाव व्यक्त करता है, जबकि אָרֶץ के लिए प्रसंगानुसार ‘देश’ चुना गया है।
- source_word: בְּהִכָּרֵת רְשָׁעִים
  choice: जब दुष्ट काट डाले जाएँगे
  rationale: ב के साथ निफ़ाल क्रिया समयसूचक है। ‘काट डाले जाएँगे’ मूल इब्रानी न्यायिक मुहावरे की तीव्रता को सामान्य ‘नष्ट होंगे’ से अधिक निकटता से सुरक्षित रखता है।
- source_word: תִּרְאֶה
  choice: तब तू देखेगा
  rationale: मूल में क्रिया का कोई व्यक्त कर्म नहीं है। हिन्दी में भी कर्म को अनकहा रखकर संक्षिप्तता और मूल की हल्की अस्पष्टता सुरक्षित रखी गई है।
theological_decisions:
- issue: वाचा और ज्ञान-साहित्य के प्रसंग में אָרֶץ का अर्थ
  choice: देश
  alternative: पृथ्वी
  rationale: भजन 37 में बार-बार मिलने वाली विरासत की भाषा इस्राएल को दिए गए देश की वाचा-संबंधी पृष्ठभूमि की ओर संकेत करती है। फिर भी אָרֶץ का अर्थ ‘पृथ्वी’ भी हो सकता है, इसलिए उस व्यापक अर्थ को पादटिप्पणी में सुरक्षित रखा गया है।
- issue: दुष्टों के अंत के लिए כרת का रूपक
  choice: काट डाले जाएँगे
  alternative: नष्ट किए जाएँगे
  rationale: मूल रूपक न्याय और समुदाय से हटाए जाने—दोनों की प्रतिध्वनि रख सकता है। अधिक सामान्य विकल्प चुनकर इस तनाव को समाप्त नहीं किया गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और काव्यात्मक रखी गई है। ‘बाट जोह’ सामान्य पाठक के लिए बोधगम्य रहते हुए धैर्यपूर्ण अपेक्षा का भाव देता है; ‘मार्ग पर चलता रह’ शाब्दिक कठोरता से बचते हुए निष्ठापूर्ण जीवन का अर्थ स्पष्ट करता है।
