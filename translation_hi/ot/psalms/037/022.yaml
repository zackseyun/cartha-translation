source:
  edition: WLC
  text: כִּ֣י מְ֭בֹרָכָי/ו יִ֣ירְשׁוּ אָ֑רֶץ וּ֝/מְקֻלָּלָ֗י/ו יִכָּרֵֽתוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/037/022.yaml
  text: For those blessed by him will inherit the land[a], but those cursed by him will be cut off.
translation:
  language: hi
  text: क्योंकि जो उसके द्वारा आशीषित हैं, वे देश[a] को विरासत में पाएँगे; पर जो उसके द्वारा शापित हैं, वे कट जाएंगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘पृथ्वी।’ इब्रानी אֶרֶץ का अर्थ ‘देश’ या ‘पृथ्वी’ दोनों हो सकता है; यहाँ भजन की वाचा-संबंधी पृष्ठभूमि में ‘देश’ अधिक उपयुक्त है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले कथन का आधार या स्पष्टीकरण प्रस्तुत करता है; हिन्दी में ‘क्योंकि’ तर्क-संबंध को स्वाभाविक रूप से व्यक्त करता है।
- source_word: מְבֹרָכָיו
  choice: जिन पर उसकी आशीष है
  rationale: पुंल्लिंग एकवचन प्रत्यय सहित निष्क्रिय कृदन्त का अर्थ ‘उसके द्वारा आशीष पाए हुए’ है। यह रूप हिन्दी में सहज है और प्रसंगानुसार परमेश्वर की एजेंसी स्पष्ट रखता है।
- source_word: יִירְשׁוּ
  choice: के अधिकारी होंगे
  rationale: ירש का अर्थ विरासत में पाना अथवा अधिकार में लेना हो सकता है। ‘अधिकारी होंगे’ भूमि की प्रतिज्ञा और भावी स्वामित्व—दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: אָרֶץ
  choice: देश
  rationale: אֶרֶץ का अर्थ ‘देश/भूमि’ या ‘पृथ्वी’ हो सकता है। भजन 37 में बार-बार आने वाली वाचा-संबंधी प्रतिज्ञा के कारण ‘देश’ मुख्य पाठ में उपयुक्त है; व्यापक विकल्प पादटिप्पणी में सुरक्षित है।
- source_word: וּמְקֻלָּלָיו
  choice: पर जिन्हें वह शाप देता है
  rationale: संयोजक यहाँ दो विपरीत समूहों का विरोध दिखाता है, इसलिए ‘पर’ उपयुक्त है। हिन्दी में सक्रिय अभिव्यक्ति निष्क्रिय कृदन्त और उसके निहित कर्ता का अर्थ स्पष्ट तथा स्वाभाविक रूप से देती है।
- source_word: יִכָּרֵתוּ
  choice: काट डाले जाएँगे
  rationale: כרת के निफ़अल रूप का शाब्दिक मुहावरा ‘काट दिया जाना’ है। यह उसके न्यायिक और वाचा-संबंधी बल को ‘नष्ट होंगे’ जैसे सामान्यीकृत अनुवाद से बेहतर बनाए रखता है।
theological_decisions:
- issue: दोनों तृतीय पुरुष एकवचन प्रत्ययों का संदर्भ
  choice: पहले खंड में ‘उसकी’ और दूसरे में ‘वह’ द्वारा एजेंसी स्पष्ट की गई; प्रसंग में संदर्भ यहोवा है।
  alternative: ‘उसके आशीष पाए हुए’ और ‘उसके शापित लोग’ जैसे अधिक शाब्दिक रूप, जिनमें एजेंसी कम स्पष्ट रहती।
  rationale: इब्रानी प्रत्यय एकवचन संदर्भ की ओर संकेत करते हैं और प्रसंग उसे यहोवा के रूप में पहचानता है। हिन्दी में एजेंसी स्पष्ट करना कोई नया धर्मवैज्ञानिक दावा नहीं जोड़ता।
- issue: אָרֶץ का दायरा
  choice: देश
  alternative: पृथ्वी
  rationale: भजन 37 की आवर्ती प्रतिज्ञा में ‘देश’ वाचा और ज्ञान-साहित्य की पृष्ठभूमि को सबसे अच्छी तरह सुरक्षित रखता है, जबकि ‘पृथ्वी’ भी वास्तविक शाब्दिक संभावना है और पादटिप्पणी में दी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और सार्वजनिक पाठ के अनुकूल रूप। ‘काट डाले जाएँगे’ इब्रानी मुहावरे को बनाए रखता है; ‘के अधिकारी होंगे’ विरासत और अधिकार के भाव को सहज हिन्दी में व्यक्त करता है।
