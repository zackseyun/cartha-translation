review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the causal כִּי, the contrast between the blessed and cursed groups, and the future outcomes. However, ‘जिन पर उसकी आशीष है’ is less precise than the Hebrew passive participle with suffix (‘those blessed by him’), and ‘काट डाले जाएँगे’ introduces an agentive causative nuance that is not explicit in the Niphal ‘will be cut off.’
  naturalness: The Hindi is generally clear and dignified. ‘जो उसके द्वारा आशीषित हैं’ and ‘जो उसके द्वारा शापित हैं’ are natural enough in a formal biblical register and preserve the matching Hebrew construction. ‘कट जाएंगे’ is the standard idiomatic rendering of the Hebrew judicial expression.
  terminology: ‘आशीषित’ and ‘शापित’ consistently render the passive participles. ‘देश’ is a defensible contextual rendering of אֶרֶץ, while the footnote appropriately retains ‘पृथ्वी’ as an alternative. ‘विरासत में पाएँगे’ better represents ירש than ‘के अधिकारी होंगे,’ which can imply mere entitlement rather than receipt/possession.
  issues:
  - severity: medium
    issue: The first participial phrase is rendered as ‘जिन पर उसकी आशीष है.’
    rationale: This can mean that his blessing rests on them, but it does not clearly express the Hebrew passive participle and its implied agent, ‘those blessed by him.’
  - severity: medium
    issue: The two cola do not retain parallel passive wording.
    rationale: 'The source has matching passive participles: ‘his blessed ones’ and ‘his cursed ones.’ The draft shifts the second to active (‘जिन्हें वह शाप देता है’), reducing the formal parallelism.'
  - severity: medium
    issue: ‘वे काट डाले जाएँगे’ overstates the form of יִכָּרֵתוּ.
    rationale: The Niphal means ‘will be cut off’; ‘काट डाले जाएँगे’ commonly suggests an explicit external agent and adds the emphatic causative ‘डाले.’ ‘कट जाएंगे’ preserves the Hebrew idiom more closely.
  - severity: low
    issue: ‘देश के अधिकारी होंगे’ weakens the inheritance nuance of יִירְשׁוּ.
    rationale: ‘विरासत में पाएँगे’ directly expresses inheritance while remaining natural modern Hindi.
  revised_text: क्योंकि जो उसके द्वारा आशीषित हैं, वे देश[a] को विरासत में पाएँगे; पर जो उसके द्वारा शापित हैं, वे कट जाएंगे।
