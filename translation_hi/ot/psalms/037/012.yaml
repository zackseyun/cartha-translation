  text: The wicked plots against the righteous and gnashes his teeth at him[a][b].
translation:
  language: hi
  text: 'दुष्ट धर्मी के विरुद्ध बुरी योजनाएँ बनाता है[a]

    और उस पर दाँत पीसता है[b]।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘धर्मी के विरुद्ध षड्यंत्र रचता है।’
    reason: lexical_alternative
  - marker: b
    text: ‘दाँत पीसना’ क्रोध और शत्रुता प्रकट करने वाला मुहावरा है।
    reason: cultural_note
lexical_decisions:
- source_word: זֹמֵם
  choice: षड्यंत्र रचता है
  rationale: यह कृदन्त किसी के विरुद्ध बुरी और सोची-समझी योजना बनाने का भाव देता है। ‘षड्यंत्र रचता है’ शत्रुतापूर्ण आशय को स्वाभाविक हिन्दी में स्पष्ट रखता है।
- source_word: רָשָׁע
  choice: दुष्ट
  rationale: यह शब्द यहाँ संज्ञा के रूप में एक दुष्ट व्यक्ति को सूचित करता है; एकवचन क्रियाओं के अनुरूप ‘दुष्ट’ संक्षिप्त और काव्यात्मक है।
- source_word: לַצַּדִּיק
  choice: धर्मी के विरुद्ध
  rationale: पूर्वसर्ग यहाँ शत्रुतापूर्ण कार्य के लक्ष्य को सूचित करता है। ‘धर्मी’ צַדִּיק का प्रचलित हिन्दी बाइबलीय रूप है।
- source_word: חֹרֵק
  choice: दाँत पीसता है
  rationale: क्रिया दाँत घिसने या पीसने को बताती है, जो इस प्रसंग में क्रोध और शत्रुता की अभिव्यक्ति है।
- source_word: עָלָיו
  choice: उस पर
  rationale: यह शत्रुतापूर्ण संकेत की दिशा धर्मी व्यक्ति की ओर बताता है और हिन्दी मुहावरे ‘उस पर दाँत पीसना’ में स्वाभाविक है।
- source_word: שִׁנָּיו
  choice: दाँत
  rationale: हिन्दी में ‘दाँत पीसना’ अपने-आप कर्ता के दाँतों को सूचित करता है; ‘अपने दाँत’ कहना सम्भव है, पर अनावश्यक रूप से भारी होगा।
