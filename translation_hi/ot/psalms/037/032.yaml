  - marker: b
    text: या, “उसे मार डालना चाहता है।”
    reason: lexical_alternative
lexical_decisions:
- source_word: צוֹפֶה
  choice: नज़र रखता है
  rationale: यह צפה के मूल अर्थ ‘देखते रहना/निगरानी रखना’ को स्वाभाविक हिन्दी में व्यक्त करता है। संदर्भ में इसका आशय शत्रुतापूर्ण है, जिसे अगला खंड स्पष्ट करता है; ‘घात लगाए रहता है’ को वैकल्पिक पाठ के रूप में रखा गया है।
- source_word: רָשָׁע
  choice: दुष्ट
  rationale: एकवचन विशेषण यहाँ संज्ञा के रूप में किसी दुष्ट व्यक्ति का प्रतिनिधित्व करता है; हिन्दी में ‘दुष्ट’ संक्षिप्त और स्वाभाविक है।
- source_word: לַצַּדִּיק
  choice: धर्मी पर
  rationale: צַדִּיק के नैतिक अर्थ को ‘धर्मी’ सटीक रूप से व्यक्त करता है, और לְ को צפה के साथ हिन्दी में स्वाभाविक ‘पर’ से व्यक्त किया गया है।
- source_word: וּמְבַקֵּשׁ
  choice: और ... चाहता है
  rationale: בקש यहाँ किसी लक्ष्य को पाने की इच्छा या प्रयास को दर्शा सकता है। ‘चाहता है’ शत्रुतापूर्ण मंशा को सहज हिन्दी में व्यक्त करता है, जबकि प्रयास का अर्थ फुटनोट में सुरक्षित है।
- source_word: לַהֲמִיתוֹ
  choice: उसे मार डालना
  rationale: מות के हिफ़इल रूप का अर्थ ‘मरने का कारण बनाना’ है। ‘मार डालना’ आधुनिक हिन्दी में प्रत्यक्ष, गंभीर और स्वाभाविक है।
- source_word: וּ
  choice: और
  rationale: यह दोनों समांतर क्रियाओं—नज़र रखने और मार डालने की इच्छा—को सीधे जोड़ता है।
