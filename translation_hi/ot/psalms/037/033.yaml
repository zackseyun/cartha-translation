id: PSA.37.33
reference: Psalms 37:33
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: יְ֭הוָה לֹא יַעַזְבֶ֣/נּוּ בְ/יָד֑/וֹ וְ/לֹ֥א יַ֝רְשִׁיעֶ֗/נּוּ בְּ/הִשָּׁפְטֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/037/033.yaml
  text: Yahweh will not leave him in his hand[c][b][a], nor condemn him when he is judged.
translation:
  language: hi
  text: याहवे उसे उसके हाथ में नहीं छोड़ेगा[a][b], और जब उसका न्याय होगा, तब उसे दोषी नहीं ठहराएगा[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसे नहीं त्यागेगा।”
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक अर्थ “उसके हाथ में”; अर्थात दुष्ट के अधिकार या वश में।
    reason: lexical_alternative
  - marker: c
    text: या, “उसे अपराधी घोषित नहीं करेगा।”
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत नाम को उपाधि से बदलने के बजाय हिब्रू नाम का निकट देवनागरी लिप्यंतरण रखा गया है।
- source_word: יַעַזְבֶנּוּ
  choice: उसे ... नहीं छोड़ेगा
  rationale: עזב का मूल अर्थ छोड़ना, त्यागना या बेसहारा कर देना हो सकता है। यहाँ सरल और स्वाभाविक हिंदी में ‘नहीं छोड़ेगा’ रखा गया है, जबकि वैकल्पिक अर्थ पाद-टिप्पणी में दिया गया है।
- source_word: בְיָדוֹ
  choice: उसके हाथ में
  rationale: हिब्रू की शाब्दिक हस्त-छवि सुरक्षित रखी गई है। संदर्भ में इसका आशय दुष्ट के अधिकार या वश में होना है।
- source_word: יַרְשִׁיעֶנּוּ
  choice: उसे दोषी नहीं ठहराएगा
  rationale: רשע के हिफ़ील रूप का यहाँ न्यायिक अर्थ ‘दोषी घोषित करना/ठहराना’ है; यह चुनाव पद के कानूनी भाव को स्पष्ट और स्वाभाविक हिंदी में बनाए रखता है।
- source_word: בְּהִשָּׁפְטוֹ
  choice: जब उसका न्याय होगा
  rationale: בְּ के साथ infinitive construct को यहाँ कालवाचक रूप में समझा गया है। यह हिंदी प्रयोग निष्क्रिय न्यायिक अर्थ को व्यक्त करता है और न्याय के मंच या प्रक्रिया को अनावश्यक रूप से निर्दिष्ट नहीं करता।
theological_decisions:
- issue: पद में सर्वनामों के संदर्भ
  choice: ‘उसे/उसका’ धर्मी पुरुष की ओर और ‘उसके हाथ’ दुष्ट पुरुष की ओर संकेत करता है।
  alternative: इसे सामान्य रूप से किसी धर्मी व्यक्ति और किसी दुष्ट व्यक्ति के बारे में समझना।
  rationale: निकटवर्ती संदर्भ में दुष्ट और धर्मी का एकवचन पुल्लिंग विरोध चलता है। हिंदी पाठ ने उन्हीं सर्वनामों को बनाए रखा है; ‘उसके हाथ’ की संभावित अस्पष्टता पाद-टिप्पणी से स्पष्ट की गई है।
- issue: दूसरे खंड का न्यायिक अर्थ
  choice: याहवे धर्मी को न्याय में दोषी नहीं ठहराएगा।
  alternative: याहवे उसे दुष्ट सिद्ध नहीं होने देगा।
  rationale: יַרְשִׁיעֶנּוּ और בְּהִשָּׁפְטוֹ का मेल न्यायिक भाषा है। अनुवाद उस कानूनी भाव को सुरक्षित रखता है, पर बाद की किसी विशिष्ट धर्मशास्त्रीय व्यवस्था को पद में नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘उसके हाथ में’ हिब्रू बिंब को बचाता है, जबकि पाद-टिप्पणी उसका मुहावरेदार आशय स्पष्ट करती है। न्यायिक शब्दावली के लिए ‘न्याय’ और ‘दोषी ठहराना’ का प्रयोग किया गया है।
