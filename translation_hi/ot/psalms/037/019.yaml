  yaml_path: translation/ot/psalms/037/019.yaml
  text: They will not be put to shame in a time of trouble[c][b][a], and in days of famine they will be satisfied.
translation:
  language: hi
  text: वे विपत्ति के समय लज्जित न होंगे[a][b], और अकाल के दिनों में तृप्त होंगे[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अपमानित न होंगे।” इब्रानी क्रिया लज्जा अनुभव करने और अपमानित या निराश होने—दोनों भाव व्यक्त कर सकती है।
    reason: lexical_alternative
  - marker: b
    text: या, “संकट के समय” अथवा “बुरे समय में।” यहाँ “बुरा” नैतिक बुराई नहीं, बल्कि विपत्ति या प्रतिकूल परिस्थिति को दर्शाता है।
    reason: lexical_alternative
  - marker: c
    text: या, “भरपेट होंगे” अथवा “जी भरकर खाएँगे।”
    reason: lexical_alternative
lexical_decisions:
- source_word: יֵבֹשׁוּ
  choice: लज्जित न होंगे
  rationale: यह इब्रानी क्रिया लज्जा अनुभव करने, निराश होने या अपमानित होने का भाव दे सकती है। “लज्जित न होंगे” स्वाभाविक हिन्दी में इस अर्थ-व्याप्ति को पर्याप्त रूप से खुला रखता है।
- source_word: בְּעֵת רָעָה
  choice: विपत्ति के समय
  rationale: यहाँ רָעָה नैतिक बुराई नहीं, बल्कि प्रतिकूल परिस्थिति या संकट को दर्शाता है। “विपत्ति” इस संदर्भ में संक्षिप्त, स्पष्ट और गरिमापूर्ण है।
- source_word: וּבִימֵי רְעָבוֹן
  choice: और अकाल के दिनों में
  rationale: यह पदबंध अनेक दिनों तक रहने वाली भोजन की गंभीर कमी को व्यक्त करता है; “अकाल के दिनों में” मूल संरचना और अर्थ दोनों को स्वाभाविक हिन्दी में रखता है।
- source_word: יִשְׂבָּעוּ
  choice: तृप्त रहेंगे
  rationale: שׂבע का अर्थ भरपेट होना या पर्याप्त पाकर तृप्त होना है। “तृप्त रहेंगे” अकाल के साथ भोजन-संबंधी अर्थ को स्पष्ट रखते हुए परमेश्वर के प्रबंध की विधि को अनावश्यक रूप से नहीं बताता।
theological_decisions:
- issue: अकाल में ‘तृप्त’ रहने की प्रतिज्ञा का स्वरूप
  choice: कथन को बिना व्याख्यात्मक विस्तार के प्रत्यक्ष प्रतिज्ञा के रूप में रखा गया है।
  alternative: इसे केवल आत्मिक संतोष या हर प्रकार के कष्ट से पूर्ण सुरक्षा के रूप में स्पष्ट करना।
  rationale: मूल पाठ तृप्ति की प्रतिज्ञा करता है, पर उसकी विधि या सीमा नहीं समझाता; इसलिए उस धार्मिक तनाव और खुलेपन को बनाए रखा गया है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की है। “विपत्ति,” “लज्जित” और “तृप्त” जैसे शब्द गरिमापूर्ण होने के साथ सामान्य पाठकों के लिए परिचित हैं। समानांतर काव्य-वाक्य संरचना को बनाए रखा गया है।
