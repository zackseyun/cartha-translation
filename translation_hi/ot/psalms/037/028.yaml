reference: Psalms 37:28
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: כִּ֤י יְהוָ֨ה אֹ֘הֵ֤ב מִשְׁפָּ֗ט וְ/לֹא יַעֲזֹ֣ב אֶת חֲ֭סִידָי/ו לְ/עוֹלָ֣ם נִשְׁמָ֑רוּ וְ/זֶ֖רַע רְשָׁעִ֣ים נִכְרָֽת׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/037/028.yaml
  text: For Yahweh loves justice and does not forsake his faithful ones[a]; they are kept forever[b], but the offspring of the wicked will be cut off.
translation:
  language: hi
  text: 'क्योंकि यहोवा न्याय से प्रेम करता है

    और अपने विश्वासयोग्य जनों[a] को नहीं त्यागता;

    वे सदा सुरक्षित रखे जाते हैं[b],

    पर दुष्टों की संतति काट डाली जाएगी।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘अपने भक्तों,’ ‘अपने पवित्र जनों,’ अथवा ‘अपने निष्ठावान जनों।’
    reason: lexical_alternative
  - marker: b
    text: 'इब्रानी को अधिक घनिष्ठ रूप में भी समझा जा सकता है: ‘उसके विश्वासयोग्य जन सदा सुरक्षित रखे जाते हैं।’'
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: यहोवा
  rationale: परमेश्वर के वाचागत नाम को प्रचलित और पहचाने जाने योग्य हिन्दी रूप में सुरक्षित रखता है।
- source_word: אֹהֵב
  choice: प्रेम करता है
  rationale: אהב का सीधा अर्थ व्यक्त करता है और आधुनिक हिन्दी में स्वाभाविक है।
- source_word: מִשְׁפָּט
  choice: न्याय
  rationale: यहाँ नैतिक न्याय और उचित व्यवस्था का भाव है; ‘न्याय’ इस व्यापक अर्थ को स्पष्ट रूप से व्यक्त करता है।
- source_word: יַעֲזֹב
  choice: त्यागता
  rationale: עזב के ‘छोड़ देना/त्याग देना’ अर्थ को पद के वाचागत और आश्वासनपूर्ण स्वर में व्यक्त करता है।
- source_word: חֲסִידָיו
  choice: अपने विश्वासयोग्य जनों
  rationale: חסד से संबंधित निष्ठा और भक्ति का संबंधपरक भाव रखता है तथा ‘संतों’ जैसे संभावित तकनीकी अर्थ से बचता है।
- source_word: לְעוֹלָם
  choice: सदा
  rationale: दीर्घ और स्थायी अवधि को संक्षिप्त, स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: נִשְׁמָרוּ
  choice: सुरक्षित रखे जाते हैं
  rationale: שמר के निफ़अल रूप का कर्मवाच्य भाव—रक्षा या संरक्षण पाना—स्पष्ट करता है।
- source_word: זֶרַע
  choice: वंश
  rationale: संदर्भ में संतति या भावी पीढ़ी का सामूहिक अर्थ है; ‘वंश’ हिन्दी में संक्षिप्त और स्वाभाविक है।
- source_word: רְשָׁעִים
  choice: दुष्टों
  rationale: बहुवचन संज्ञात्मक विशेषण को मानक हिन्दी सामूहिक रूप में व्यक्त करता है।
- source_word: נִכְרָת
  choice: काट डाला जाएगा
  rationale: כרת के निफ़अल रूप में निहित ‘काट दिया जाना/समाप्त किया जाना’ की बाइबलीय छवि और न्यायिक गंभीरता बनाए रखता है।
theological_decisions:
- issue: חֲסִידָיו का आशय
  choice: ‘अपने विश्वासयोग्य जनों’—यहोवा के प्रति निष्ठावान और भक्ति रखने वाले लोग।
  alternative: ‘अपने भक्तों’, ‘अपने पवित्र जनों’ या ‘अपने निष्ठावान जनों’।
  rationale: यह रूप वाचा-संबंधी निष्ठा और भक्ति दोनों की ओर संकेत करता है, पर किसी बाद की तकनीकी धार्मिक श्रेणी को पाठ में नहीं लाता।
- issue: दो मध्यवर्ती उपवाक्यों का संबंध
  choice: ‘नहीं त्यागता; वे सदा सुरक्षित रखे जाते हैं’—दो परस्पर पूरक कथनों के रूप में।
  alternative: ‘अपने विश्वासयोग्य जनों को सदा सुरक्षित रखता है’—एक अधिक कसकर जुड़ी हुई वाक्यरचना के रूप में।
  rationale: इब्रानी क्रम दूसरी पंक्ति को पहली का विस्तार मानने देता है। अर्धविराम दोनों कथनों को अलग भी रखता है और उनका निकट संबंध भी दिखाता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में काव्यात्मक पंक्ति-विन्यास रखा गया है। भाषा सरल, गरिमापूर्ण और सामान्य पाठकों के लिए सुबोध है; ‘यहोवा’, ‘न्याय’, ‘विश्वासयोग्य जन’ और ‘वंश काट डाला जाएगा’ मूल की वाचागत तथा ज्ञान-साहित्यिक गंभीरता बनाए रखते हैं।
