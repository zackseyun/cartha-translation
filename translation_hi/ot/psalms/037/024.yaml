reference: Psalms 37:24
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: כִּֽי יִפֹּ֥ל לֹֽא יוּטָ֑ל כִּֽי יְ֝הוָ֗ה סוֹמֵ֥ךְ יָדֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/037/024.yaml
  text: Though he falls[a], he will not be hurled down[b], for Yahweh holds his hand.
translation:
  language: hi
  text: चाहे वह गिर भी पड़े[a], फिर भी वह धराशायी नहीं होगा, क्योंकि यहोवा उसका हाथ थामे रहता है[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “क्योंकि यदि वह गिरे, तो वह धराशायी नहीं होगा।” यहाँ इब्रानी संयोजक का अर्थ प्रसंग के अनुसार “क्योंकि,” “यदि,” या रियायती भाव में “चाहे” हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “उसके हाथ को सहारा देता है।”
    reason: translation_clarity
lexical_decisions:
- source_word: כִּי
  choice: चाहे … फिर भी / क्योंकि
  rationale: पहला כִּי प्रसंग में रियायती भाव व्यक्त करता है, जबकि दूसरा कारण बताता है। हिन्दी में ‘चाहे … फिर भी’ और ‘क्योंकि’ इन दोनों संबंधों को स्वाभाविक रूप से स्पष्ट करते हैं।
- source_word: יִפֹּל
  choice: गिर भी पड़े
  rationale: נפל का मूल अर्थ ‘गिरना’ है। सम्भावना और रियायती भाव दिखाने के लिए ‘गिर भी पड़े’ रखा गया है; इससे गिरने को केवल पाप या केवल शारीरिक संकट तक सीमित नहीं किया जाता।
- source_word: יוּטָל
  choice: धराशायी नहीं होगा
  rationale: טול के होफ़ाल रूप में गिरा दिए जाने या नीचे पटक दिए जाने का निष्क्रिय भाव है। ‘धराशायी नहीं होगा’ पहले क्रिया-पद ‘गिर पड़े’ से भेद बनाए रखता है और हिन्दी में सहज है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: परमेश्वर के व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय प्रचलित हिन्दी लिप्यंतरण ‘यहोवा’ से व्यक्त किया गया है।
- source_word: סוֹמֵךְ
  choice: थामे रहता है
  rationale: סמך का कृदंत निरंतर सहारा देने या संभाले रखने का भाव देता है। ‘थामे रहता है’ हाथ के साथ स्वाभाविक हिन्दी प्रयोग है और जारी रहने वाली सहायता व्यक्त करता है।
- source_word: יָדוֹ
  choice: उसका हाथ
  rationale: मूल पाठ में स्पष्ट रूप से ‘उसका हाथ’ है। इसे बनाए रखने से यह चित्र सुरक्षित रहता है कि यहोवा धर्मी का हाथ थामकर उसे सहारा देता है।
theological_decisions:
- issue: ‘गिरने’ का रूपक
  choice: धर्मी के संकटों या असफलताओं के व्यापक अर्थ को खुला रखा गया है।
  alternative: इसे विशेष रूप से पाप, आत्मिक पतन या केवल शारीरिक खतरे के रूप में समझना।
  rationale: इब्रानी पाठ गिरने और धराशायी होने की सामान्य रूपकात्मक भाषा प्रयोग करता है, पर संकट का प्रकार निश्चित नहीं करता; इसलिए अनुवाद भी इस दायरे को संकीर्ण नहीं करता।
- issue: यहोवा द्वारा हाथ थामना
  choice: ‘उसका हाथ’ धर्मी व्यक्ति का हाथ है, जिसे यहोवा थामे रहता है।
  alternative: ‘अपने हाथ से उसे संभालता है’ या ‘उसके हाथ को सहारा देता है’।
  rationale: व्याकरण में ‘उसका हाथ’ को סמך का कर्म समझना सीधा है, किंतु हिन्दी में अर्थ स्पष्ट और स्वाभाविक रखने के लिए ‘हाथ थामे रहता है’ चुना गया है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी रखी गई है। ‘गिर भी पड़े’ और ‘धराशायी नहीं होगा’ समान रूपक-क्षेत्र में रहते हुए इब्रानी की दो अलग क्रियाओं का भेद दिखाते हैं।
