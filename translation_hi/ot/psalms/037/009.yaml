base_translation:
  language: en
  yaml_path: translation/ot/psalms/037/009.yaml
  text: For evildoers will be cut off[a], but those who wait for Yahweh—they will inherit the land.
translation:
  language: hi
  text: 'क्योंकि बुराई करनेवाले मिटा दिए जाएँगे,

    पर जो याहवे की बाट जोहते हैं—

    वे ही देश[a] के वारिस होंगे।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “पृथ्वी।” इब्रानी אֶרֶץ का अर्थ “देश” या “पृथ्वी,” दोनों हो सकता है; यहाँ भजन की वाचा-संबंधी पृष्ठभूमि में “देश” अधिक उपयुक्त है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले उपदेश का कारण प्रस्तुत करता है; ‘क्योंकि’ हिन्दी में इसके व्याख्यात्मक संबंध को स्वाभाविक रूप से व्यक्त करता है।
- source_word: מְרֵעִים
  choice: बुराई करनेवाले
  rationale: हिफ़ील कृदन्त उन लोगों को दर्शाता है जो बुराई करते हैं; यह आधुनिक हिन्दी में स्पष्ट और सहज है।
- source_word: יִכָּרֵתוּן
  choice: मिटा दिए जाएँगे
  rationale: निफ़ाल रूप का अर्थ काटकर अलग कर देना या हटा देना है। हिन्दी में ‘मिटा दिए जाएँगे’ न्यायपूर्ण निष्कासन का भाव रखता है, बिना केवल शारीरिक काटे जाने का भ्रामक चित्र उत्पन्न किए।
- source_word: וְקֹוֵי
  choice: पर जो ... की बाट जोहते हैं
  rationale: קוה आशापूर्ण और धैर्यपूर्ण प्रतीक्षा को व्यक्त करता है। ‘बाट जोहना’ उस सक्रिय भरोसे को रखता है, और ‘पर’ दोनों समूहों का विरोध स्पष्ट करता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिन्दी बाइबलीय प्रयोग में प्रचलित रूप से परमेश्वर के व्यक्तिगत नाम को शीर्षक से बदलने के बजाय नाम के रूप में प्रस्तुत करता है।
- source_word: הֵמָּה
  choice: वे ही
  rationale: स्वतंत्र सर्वनाम के बलाघात को हिन्दी में ‘ही’ द्वारा स्वाभाविक रूप से व्यक्त किया गया है।
- source_word: יִירְשׁוּ
  choice: के अधिकारी होंगे
  rationale: ירשׁ में विरासत में पाने और अधिकार प्राप्त करने का भाव है। ‘अधिकारी होंगे’ हिन्दी के गरिमापूर्ण बाइबलीय प्रयोग में प्रतिज्ञा और स्थायी अधिकार दोनों को व्यक्त करता है।
- source_word: אָרֶץ
  choice: देश
  rationale: इस भजन में बार-बार आनेवाली प्रतिज्ञा वाचा के देश की ओर संकेत करती है; फिर भी इब्रानी शब्द का अर्थ ‘पृथ्वी’ भी हो सकता है, इसलिए वह विकल्प पादटिप्पणी में रखा गया है।
theological_decisions:
- issue: אָרֶץ की प्रतिज्ञा का दायरा
  choice: देश
  alternative: पृथ्वी
  rationale: निकटवर्ती संदर्भ इस्राएल की वाचा-संबंधी देश-प्रतिज्ञा की भाषा को प्रतिध्वनित करता है। ‘देश’ इस पुराने नियम के संदर्भ को बनाए रखता है, जबकि ‘पृथ्वी’ की सम्भावना को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण काव्यात्मक शैली रखी गई है। ‘बाट जोहते हैं’ आशापूर्ण धैर्य को, और ‘वे ही’ मूल के बलाघात को व्यक्त करता है।
