id: PSA.37.20
reference: Psalms 37:20
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: כִּ֤י רְשָׁעִ֨ים יֹאבֵ֗דוּ וְ/אֹיְבֵ֣י יְ֭הוָה כִּ/יקַ֣ר כָּרִ֑ים כָּל֖וּ בֶ/עָשָׁ֣ן כָּֽלוּ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/037/020.yaml
  text: For the wicked will perish[a], and the enemies of Yahweh are like the glory of the pastures; they vanish—like smoke they vanish away.
translation:
  language: hi
  text: 'क्योंकि दुष्ट नाश हो जाएँगे,

    और यहवे के शत्रु चरागाहों की शोभा के समान होंगे[a];

    वे मिट जाएँगे—धुएँ के समान मिट जाएँगे।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या, एक पारंपरिक व्याख्या के अनुसार: “मेमनों की चर्बी के समान।” इब्रानी पदबंध कठिन है।'
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले कथन का कारण या आधार बताता है; ‘क्योंकि’ उसके व्याख्यात्मक-कारणात्मक बल को स्वाभाविक हिन्दी में रखता है।
- source_word: רְשָׁעִים
  choice: दुष्ट
  rationale: भजन और ज्ञान-साहित्य में यह नैतिक रूप से बुरे लोगों के लिए प्रचलित और सहज शब्द है।
- source_word: יֹאבֵדוּ
  choice: नाश हो जाएँगे
  rationale: क्रिया אָבַד का अर्थ नष्ट होना या विनाश को प्राप्त होना है; यह भविष्यगत भाव को स्पष्ट रखता है।
- source_word: וְאֹיְבֵי יְהוָה
  choice: और यहवे के शत्रु
  rationale: सम्बन्धवाचक इब्रानी पदबंध का सीधा और स्वाभाविक हिन्दी रूप है।
- source_word: יְהוָה
  choice: यहवे
  rationale: इब्रानी व्यक्तिगत ईश्वरीय नाम का हिन्दी लिप्यंतरण किया गया है, किसी उपाधि से प्रतिस्थापित नहीं।
- source_word: כִּיקַר כָּרִים
  choice: चरागाहों की शोभा के समान
  rationale: कठिन पदबंध में יקר को ‘शोभा’ और כרים को ‘चरागाह’ समझना व्यंजन-पाठ और क्षणभंगुर प्राकृतिक शोभा की अगली छवि के अनुकूल है; पारम्परिक वैकल्पिक अर्थ पादटिप्पणी में रखा गया है।
- source_word: כָּלוּ
  choice: वे मिट जाएँगे
  rationale: כלה का यहाँ समाप्त हो जाने या लुप्त हो जाने का भाव है; पुनरावृत्ति काव्यात्मक बल को बनाए रखती है।
- source_word: בֶעָשָׁן
  choice: धुएँ के समान
  rationale: בְ־ को यहाँ तुलनात्मक रूप में समझना धुएँ की तरह लुप्त होने वाली छवि को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: यहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में चतुरक्षरीय व्यक्तिगत नाम सीधे प्रयुक्त है; उसका लिप्यंतरण नाम और उपाधि के भेद को सुरक्षित रखता है।
- issue: כִּיקַר כָּרִים की व्याख्या
  choice: चरागाहों की शोभा के समान
  alternative: मेमनों की चर्बी के समान
  rationale: यह इब्रानी पदबंध कठिन और बहुव्याख्येय है। मुख्य पाठ में चरागाहों की क्षणभंगुर शोभा वाला अर्थ रखा गया है और पारम्परिक व्याख्या को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सरल काव्यात्मक शैली अपनाई गई है। इब्रानी की समानांतरता और ‘मिट जाएँगे’ की पुनरावृत्ति सुरक्षित रखी गई है। पादटिप्पणी चिह्न [a] मुख्य पाठ में रखा गया है।
