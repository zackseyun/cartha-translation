  text: וַֽ/יַּעְזְרֵ֥/ם יְהוָ֗ה וַֽ/יְפַ֫לְּטֵ֥/ם יְפַלְּטֵ֣/ם מֵ֭/רְשָׁעִים וְ/יוֹשִׁיעֵ֑/ם כִּי חָ֥סוּ בֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/037/040.yaml
  text: Yahweh helps them and delivers them[a]; he delivers them from the wicked and saves them[b], because they take refuge in him.
translation:
  language: hi
  text: याहवे उनकी सहायता करता है और उन्हें छुड़ाता है[a]; वह उन्हें दुष्टों से छुड़ाता और बचाता है, क्योंकि वे उसकी शरण लेते हैं[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: दोनों स्थानों पर ‘छुड़ाता’ के बदले ‘उबारता’ भी हो सकता है; इब्रानी में बल देने के लिए एक ही उद्धार-सूचक क्रिया दोहराई गई है।
    reason: lexical_alternative
  - marker: b
    text: या ‘क्योंकि वे उस पर भरोसा करते हैं’; इब्रानी में अधिक शाब्दिक रूप से उसकी शरण लेने की बात है।
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय परमेश्वर-नाम का शीर्षक लगाकर प्रतिस्थापन करने के बजाय उसका प्रचलित ध्वन्यात्मक रूप रखा गया है।
- source_word: וַיַּעְזְרֵם
  choice: उनकी सहायता करता
  rationale: עזר का मूल अर्थ सहायता करना है; भजन के इस सार-वचन में वर्तमान काल स्वाभाविक और सामान्य सत्य का बोध कराता है।
- source_word: וַיְפַלְּטֵם / יְפַלְּטֵם
  choice: उन्हें छुड़ाता है; वह उन्हें ... छुड़ाता
  rationale: פלט के उद्धार/छुटकारे के भाव को व्यक्त करते हुए इब्रानी की जानबूझकर की गई पुनरावृत्ति बनाए रखी गई है।
- source_word: מֵרְשָׁעִים
  choice: दुष्टों से
  rationale: बहुवचन विशेषण का संज्ञात्मक प्रयोग है; इसमें कोई अनावश्यक लिंग-सूचक शब्द नहीं जोड़ा गया।
- source_word: וְיוֹשִׁיעֵם
  choice: और बचाता है
  rationale: ישׁע के व्यापक बचाव और उद्धार के अर्थ को सरल, धर्मवैज्ञानिक भार वाला हिंदी शब्द व्यक्त करता है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यह याहवे के बचाने के कार्य का कारण प्रस्तुत करने वाला स्पष्ट कारणवाचक संयोजक है।
- source_word: חָסוּ בוֹ
  choice: वे उसकी शरण लेते हैं
  rationale: חסה के आश्रय लेने के ठोस रूपक को सामान्यीकृत 'भरोसा करना' में बदलने के बजाय सुरक्षित रखा गया है।
theological_decisions:
- issue: परमेश्वर के नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा अथवा ‘प्रभु’
  rationale: मूल पाठ व्यक्तिगत परमेश्वर-नाम का प्रयोग करता है; ‘याहवे’ उसे किसी उपाधि से बदले बिना प्रस्तुत करता है।
- issue: छुड़ाने की क्रिया की पुनरावृत्ति
  choice: दोनों बार ‘छुड़ाता’ रखना
  alternative: दोनों उपवाक्यों को मिलाकर क्रिया केवल एक बार कहना
  rationale: मूल में פלט लगातार दो बार आया है; पुनरावृत्ति काव्यात्मक बल देती है और इसलिए उसे हटाया नहीं गया।
- issue: חסה के रूपक का निर्वाह
  choice: शरण लेते हैं
  alternative: उस पर भरोसा रखते हैं
  rationale: ‘भरोसा’ निहित भाव को बताता है, पर मूल में सुरक्षा के लिए किसी की शरण में आने का अधिक ठोस रूपक है।
translation_notes:
  register: भाषा आधुनिक मानक हिंदी की, सरल किंतु गरिमापूर्ण है। समानांतर काव्य-रचना और मूल की पुनरावृत्ति सुरक्षित रखी गई है; ‘शरण लेना’ सामान्य पाठक के लिए सहज रहते हुए मूल रूपक को बनाए रखता है।
