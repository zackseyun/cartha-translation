- source_word: יְהוָה
  choice: यहोवा
  rationale: चतुर्वर्णीय व्यक्तिगत ईश्वरीय नाम को किसी उपाधि से बदलने के बजाय हिन्दी में प्रचलित नामरूप ‘यहोवा’ से प्रस्तुत किया गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ में व्यक्तिगत नाम है, इसलिए ‘प्रभु’ जैसी उपाधि से प्रतिस्थापित नहीं किया गया। आधुनिक हिन्दी बाइबलीय प्रयोग में व्यापक रूप से पहचाने जाने वाले ‘यहोवा’ रूप को चुना गया, जबकि ‘याहवे’ अधिक प्रत्यक्ष विद्वत्तापूर्ण लिप्यन्तरण है।
- issue: भुजाओं का बिंब
  choice: मुख्य पाठ में ‘भुजाएँ’ बनाए रखना
  alternative: ‘शक्ति’ या ‘सामर्थ्य’ कहना
  rationale: यह बिंब दुष्टों की कार्यकारी शक्ति के नष्ट होने का संकेत दे सकता है, पर मूल की ठोस काव्यात्मक भाषा को व्याख्यात्मक अमूर्तीकरण से बदलना उचित नहीं।
