  choice: तोड़ दी जाएँगी
  rationale: निफ़अल अपूर्ण स्त्रीलिंग बहुवचन ‘भुजाएँ’ से मेल खाता है और भविष्यकालीन कर्मवाच्य अर्थ व्यक्त करता है।
- source_word: וְ
