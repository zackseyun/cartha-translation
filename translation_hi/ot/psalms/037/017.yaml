  rationale: मूल शब्द का ठोस अर्थ ‘भुजाएँ’ है और काव्य में यह सामर्थ्य या शक्ति का बिंब है; बिंब को मुख्य पाठ में बनाए रखा गया है।
- source_word: רְשָׁעִים
