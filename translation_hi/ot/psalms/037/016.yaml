  - marker: b
    text: या, “बहुत-से दुष्टों की बहुतायत।” इब्रानी शब्द बड़ी मात्रा या प्रचुरता का बोध करा सकता है; ‘बहुत-से’ दुष्टों का विशेषण हो सकता है।
