lexical_decisions:
- source_word: טוֹב
  choice: अच्छा है
  rationale: तुलनात्मक रचना में इसका अर्थ ‘से अच्छा है’ बनता है; हिंदी वाक्य में ‘उससे अच्छा है’ इस भाव को स्वाभाविक रूप से व्यक्त करता है।
- source_word: מְעַט
  choice: जो थोड़ा है
  rationale: यह छोटी मात्रा को दर्शाता है। ‘धर्मी के पास जो थोड़ा है’ इब्रानी में निहित स्वामित्व को सहज हिंदी में व्यक्त करता है, पर उसे केवल धन तक सीमित नहीं करता।
- source_word: לַצַּדִּיק
  choice: धर्मी के पास
  rationale: ל उपसर्ग यहाँ हित अथवा स्वामित्व—दोनों की छाया रख सकता है। प्रसंग में स्वामित्व का भाव संभावित है, इसलिए ‘के पास’ चुना गया है; ‘धर्मी’ इब्रानी के एकवचन सामूहिक रूप को बनाए रखता है।
- source_word: מֵהֲמוֹן
  choice: उससे ... जो बहुत है
  rationale: הָמוֹן प्रचुरता, बहुतायत या बड़ी मात्रा का बोध करा सकता है। सहज हिंदी के लिए तुलना को समानांतर वाक्यांश में व्यक्त किया गया है और अर्थ को केवल ‘धन-संपत्ति’ तक संकुचित नहीं किया गया।
- source_word: רְשָׁעִים רַבִּים
  choice: बहुत-से दुष्टों
  rationale: רַבִּים को सबसे स्वाभाविक रूप से बहुवचन ‘दुष्टों’ का विशेषण माना गया है; इसलिए ‘बहुत-से दुष्टों’ चुना गया।
