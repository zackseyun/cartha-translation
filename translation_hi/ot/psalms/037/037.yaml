  yaml_path: translation/ot/psalms/037/037.yaml
  text: Observe the blameless[a], and see the upright[c][b], for there is a future for the man of peace.
translation:
  language: hi
  text: खरे व्यक्ति पर ध्यान दे और सीधे-सच्चे व्यक्ति को देख, क्योंकि शांतिप्रिय मनुष्य का भविष्य है[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: c
    text: इब्रानी אַחֲרִית का अर्थ ‘अंत’ या ‘परिणाम’ भी हो सकता है; कुछ लोग इसका अर्थ ‘वंशज’ समझते हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁמָר
  choice: ध्यान दे
  rationale: यहाँ आज्ञार्थक क्रिया का अर्थ रक्षा करना नहीं, बल्कि किसी व्यक्ति को ध्यान से देखना और उसके जीवन पर गौर करना है।
- source_word: תָּם
  choice: खरे व्यक्ति
  rationale: תָּם नैतिक अखंडता और निष्कपटता बताता है, पापरहित सिद्धता नहीं। हिन्दी में विशेषण के संज्ञात्मक प्रयोग को स्वाभाविक बनाने के लिए ‘व्यक्ति’ जोड़ा गया है।
- source_word: וּרְאֵה
  choice: और ... को देख
  rationale: यह שְׁמָר के समानांतर दूसरी आज्ञा है; ‘देख’ उसकी सीधी और काव्यात्मक शक्ति बनाए रखता है।
- source_word: יָשָׁר
  choice: सीधे-सच्चे
  rationale: यह नैतिक सीधेपन और ईमानदारी को व्यक्त करता है तथा ‘खरे’ के साथ काव्यात्मक समानता रखता है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पहले दिए गए निर्देश का कारण प्रस्तुत करता है।
- source_word: אַחֲרִית
  choice: एक भविष्य
  rationale: शब्द का अर्थ अंतिम दशा, परिणाम या आने वाला भविष्य हो सकता है। प्रसंग में सकारात्मक भावी संभावना प्रमुख है, जबकि अन्य अर्थ पादटिप्पणी में सुरक्षित हैं।
- source_word: לְאִישׁ
  choice: मनुष्य के लिए
  rationale: लְ संबंध को ‘के लिए’ से और स्पष्ट पुल्लिंग एकवचन אִישׁ को ‘मनुष्य’ से व्यक्त किया गया है।
- source_word: שָׁלוֹם
  choice: शांतिप्रिय
  rationale: ‘शांति का मनुष्य’ हिन्दी में अस्वाभाविक है; ‘शांतिप्रिय मनुष्य’ उस व्यक्ति को स्वाभाविक रूप से दर्शाता है जिसका चरित्र शांति से पहचाना जाता है। व्यापक कल्याण और संपूर्णता का भाव पादटिप्पणी में रखा गया है।
theological_decisions:
- issue: ज्ञान-साहित्य के कथन में पुल्लिंग एकवचन אִישׁ
  choice: मनुष्य
  alternative: व्यक्ति
  rationale: जहाँ मूल पाठ स्पष्ट रूप से אִישׁ कहता है, वहाँ पुल्लिंग एकवचन को बनाए रखा गया है; इससे इस ज्ञान-वचन के व्यापक प्रतिनिधिक प्रयोग को नकारा नहीं जाता।
- issue: אַחֲרִית का अर्थ और शांतिप्रिय मनुष्य की अंतिम दशा
  choice: एक भविष्य
  alternative: अंत, परिणाम, या वंशज
  rationale: आसपास का प्रसंग धर्मी और अपराधी की भावी दशाओं की तुलना करता है। ‘भविष्य’ सकारात्मक संभावना को व्यक्त करता है, पर शब्द को केवल परलोक, सांसारिक सफलता या संतान तक सीमित नहीं करता।
- issue: אִישׁ שָׁלוֹם का संबंध
  choice: शांतिप्रिय मनुष्य
  alternative: कल्याण पाने वाला या संपूर्ण मनुष्य
  rationale: यह पद व्यक्ति के शांत स्वभाव को दर्शा सकता है, जबकि שָׁלוֹם में कल्याण और संपूर्णता भी समाहित हो सकते हैं; मुख्य पाठ सहज अर्थ देता है और पादटिप्पणी व्यापकता बचाती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘खरा’ और ‘सीधा-सच्चा’ ज्ञान-साहित्य की नैतिक शब्दावली को स्वाभाविक हिन्दी में व्यक्त करते हैं। समानांतर आज्ञाओं और पद के कारणात्मक प्रवाह को बनाए रखा गया है।
