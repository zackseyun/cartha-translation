source:
  edition: WLC
  text: לְ/דָוִ֨ד אַל תִּתְחַ֥ר בַּ/מְּרֵעִ֑ים אַל תְּ֝קַנֵּ֗א בְּ/עֹשֵׂ֥י עַוְלָֽה׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/037/000.yaml
  text: Of David[a]. Do not fret because of evildoers[b]; do not be envious of those who do wrong.
translation:
  language: hi
  text: 'दाऊद का।[a]


    बुराई करनेवालों के कारण मत कुढ़ो;[b]

    अन्याय करनेवालों से ईर्ष्या मत करो।[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “दाऊद के लिए।” हिब्रू शीर्षक दाऊद द्वारा रचना अथवा दाऊद से संबंध का भाव भी दे सकता है।
    reason: superscription_ambiguity
  - marker: b
    text: “कुढ़ो” के लिए प्रयुक्त हिब्रू क्रिया में क्रोध या खीझ से तपने, उत्तेजित होने अथवा व्याकुल होने का भाव है।
    reason: lexical_alternative
  - marker: c
    text: शाब्दिक रूप से “अन्याय के काम करनेवालों”; इसे “अधर्म करनेवाले” भी कहा जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: לְדָוִד
  choice: दाऊद का
  rationale: शीर्षक के संक्षिप्त हिब्रू रूप को यथासंभव बनाए रखता है; प्रसंगानुसार इसका अर्थ दाऊद द्वारा रचित, दाऊद से संबंधित या दाऊद के लिए हो सकता है।
- source_word: תִּתְחַר
  choice: कुढ़ो
  rationale: यह क्रिया क्रोध या खीझ से भीतर ही भीतर तपने और व्याकुल होने का भाव देती है; ‘कुढ़ना’ इस रूपक और मनोदशा दोनों को स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: מְרֵעִים
  choice: बुराई करनेवाले
  rationale: हिब्रू कृदंत किसी एक घटना के अपराधियों के बजाय बुरा करनेवालों को सामान्य रूप से दर्शाता है।
- source_word: תְּקַנֵּא
  choice: ईर्ष्या मत करो
  rationale: यहाँ क्रिया दूसरों की दशा या सफलता देखकर जलने अथवा ईर्ष्या करने के अर्थ में है।
- source_word: עֹשֵׂי עַוְלָה
  choice: अन्याय करनेवाले
  rationale: शाब्दिक भाव ‘अन्याय/अधर्म के कर्ता’ है; ‘अन्याय करनेवाले’ आधुनिक हिंदी में स्पष्ट है और नैतिक अर्थ को सुरक्षित रखता है।
theological_decisions:
- issue: לְדָוִד शीर्षक का संबंध
  choice: दाऊद का
  alternative: दाऊद द्वारा रचित / दाऊद के लिए
  rationale: हिब्रू संबंधसूचक पद लेखकत्व को संभव बनाता है, पर केवल उसी अर्थ को अनिवार्य नहीं करता; मुख्य पाठ में उसकी संक्षिप्त अस्पष्टता रखी गई है।
- issue: עַוְלָה का नैतिक अर्थ
  choice: अन्याय
  alternative: अधर्म / कुटिलता
  rationale: ‘अन्याय’ व्यापक नैतिक बुराई को सहज हिंदी में व्यक्त करता है और पाठ को किसी विशेष धर्मवैज्ञानिक शब्दावली तक सीमित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिंदी का सरल, गरिमापूर्ण और काव्यात्मक रूप अपनाया गया है। दोनों निषेधात्मक आज्ञाएँ बहुवचन/आदरार्थक रूप में हैं, जो हिंदी पाठकों को संबोधित सामान्य उपदेश के रूप में स्वाभाविक लगती हैं। पंक्ति-विभाजन से भजन की समानांतर काव्य-रचना स्पष्ट होती है।
