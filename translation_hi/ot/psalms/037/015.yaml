  text: Their sword will enter their own heart[a], and their bows will be broken.
translation:
  language: hi
  text: उनकी तलवार उन्हीं के हृदय में धँस जाएगी[a], और उनके धनुष तोड़ दिए जाएँगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उनकी तलवार उन्हीं के हृदयों में धँस जाएगी।” इब्रानी में बहुवचन संबंधसूचक प्रत्यय के साथ ‘हृदय’ एकवचन है; यह एक सामान्य सामूहिक अभिव्यक्ति है।
    reason: lexical_alternative
lexical_decisions:
- source_word: חַרְבָּם
  choice: उनकी तलवार
  rationale: संज्ञा एकवचन है और उसके साथ तृतीय पुरुष बहुवचन संबंधसूचक प्रत्यय है। हिन्दी में सामूहिक अथवा प्रत्येक व्यक्ति पर लागू होने वाला एकवचन ‘उनकी तलवार’ स्वाभाविक है।
- source_word: תָּבוֹא
  choice: धँस जाएगी
  rationale: בוא का मूल अर्थ ‘आना/प्रवेश करना’ है; यहाँ בְּ के साथ ‘हृदय’ लक्ष्य होने के कारण तलवार के भीतर प्रवेश करने का भाव है। ‘धँस जाएगी’ इस प्रसंग को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: בְלִבָּם
  choice: उन्हीं के हृदय में
  rationale: शाब्दिक अर्थ ‘उनके हृदय में’ है। ‘उन्हीं’ प्रसंग में निहित प्रत्यावर्ती विरोध को स्पष्ट करता है कि उनकी अपनी तलवार उन्हीं पर लौटेगी, बिना कोई नया कर्ता जोड़ने के।
- source_word: וְקַשְּׁתוֹתָם
  choice: और उनके धनुष
  rationale: मूल में संज्ञा बहुवचन तथा तृतीय पुरुष बहुवचन संबंधसूचक प्रत्यय के साथ है; इसलिए ‘और उनके धनुष’ सीधा और स्वाभाविक अनुवाद है।
- source_word: תִּשָּׁבַרְנָה
  choice: तोड़ दिए जाएँगे
  rationale: निफ़अल अपूर्ण रूप स्त्रीलिंग बहुवचन है और यहाँ निष्क्रिय अर्थ देता है। हिन्दी में ‘तोड़ दिए जाएँगे’ भावी/काव्यात्मक भविष्यवाणी और निष्क्रियता दोनों को स्पष्ट रखता है।
