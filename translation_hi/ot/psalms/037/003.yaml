base_translation:
  language: en
  yaml_path: translation/ot/psalms/037/003.yaml
  text: Trust in Yahweh and do good[a]; dwell in the land and cultivate faithfulness.
translation:
  language: hi
  text: याहवे पर भरोसा रख और भलाई कर; देश में बसा रह और विश्वासयोग्यता से पोषित होता रह।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इस कठिन हिब्रू पदबंध का अनुवाद ‘विश्वासयोग्यता का पालन कर’ या ‘सुरक्षा का आनंद ले’ भी हो सकता है। मूल क्रिया चरने, चराने या पोषित होने की छवि जगा सकती है।
    reason: alternative_reading
lexical_decisions:
- source_word: בְּטַח
  choice: भरोसा रख
  rationale: आज्ञार्थक रूप किसी पर निर्भर होने और उसमें विश्वास रखने का भाव देता है; आधुनिक हिन्दी में यह स्वाभाविक और स्पष्ट है।
- source_word: בַּיהוָה
  choice: याहवे पर
  rationale: ב यहाँ भरोसे के आधार या व्यक्ति को दर्शाता है; יהוה को परियोजना की रीति के अनुसार ‘याहवे’ लिखा गया है।
- source_word: וַעֲשֵׂה טוֹב
  choice: और भलाई कर
  rationale: संक्षिप्त आज्ञा का सीधा और सहज हिन्दी रूप, जो नैतिक कार्य करने का भाव बनाए रखता है।
- source_word: שְׁכָן אֶרֶץ
  choice: देश में बसा रह
  rationale: שׁכן स्थायी रूप से बसने या रहने को व्यक्त करता है। इस भजन के संदर्भ में אֶרֶץ सामान्य ‘पृथ्वी’ की अपेक्षा प्रतिज्ञात ‘देश’ की ओर संकेत करता है।
- source_word: וּרְעֵה
  choice: अपना आहार बना
  rationale: רעה का मूल चरने, खिलाने या चराने से जुड़ा है। ‘आहार बना’ पोषण की रूपक-छवि को बनाए रखते हुए हिन्दी में बोधगम्य है।
- source_word: אֱמוּנָה
  choice: विश्वासयोग्यता
  rationale: אֱמוּנָה दृढ़ता, विश्वसनीयता और निष्ठा का अर्थ दे सकता है। ‘विश्वासयोग्यता’ नैतिक गुण का भाव रखती है, जबकि अन्य संभावनाएँ पादटिप्पणी में दी गई हैं।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: हिब्रू मूल में उपस्थित वाचा-संबंधी निजी नाम को अस्पष्ट किए बिना लिप्यंतरित किया गया है।
- issue: וּרְעֵה אֱמוּנָה की व्याख्या
  choice: विश्वासयोग्यता को अपना आहार बना
  alternative: विश्वासयोग्यता का पालन कर; सुरक्षित रह
  rationale: हिब्रू पदबंध कठिन और बहुअर्थी है। मुख्य पाठ चरने या पोषित होने की मूल रूपक-छवि को बनाए रखता है; सक्रिय नैतिक और सुरक्षा-संबंधी पाठों को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी। एकवचन आज्ञार्थक शैली को ‘रख’, ‘कर’ और ‘रह’ से सुरक्षित रखा गया है; कठिन अंतिम पदबंध की वास्तविक अस्पष्टता पादटिप्पणी में स्पष्ट की गई है।
