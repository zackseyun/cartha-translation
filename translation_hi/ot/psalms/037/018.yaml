id: PSA.37.18
reference: Psalms 37:18
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: יוֹדֵ֣עַ יְ֭הוָה יְמֵ֣י תְמִימִ֑ם וְ֝/נַחֲלָתָ֗/ם לְ/עוֹלָ֥ם תִּהְיֶֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/037/018.yaml
  text: Yahweh knows the days of the blameless[b][a], and their inheritance will be forever.
translation:
  language: hi
  text: याहवे निर्दोष लोगों[a] के दिनों को जानता है, और उनकी विरासत सदा रहेगी।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘खरे लोगों’ अथवा ‘निष्कपट लोगों’। यहाँ ‘निर्दोष’ का अर्थ अनिवार्य रूप से पूर्णतः निष्पाप नहीं है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “उनकी विरासत सदा रहेगी।” इसका आशय विरासत का स्थायी बने रहना या उस पर चिरस्थायी अधिकार हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत नाम को उपाधि से बदलने के बजाय उसका प्रचलित हिन्दी लिप्यंतरण रखा गया है।
- source_word: יוֹדֵעַ
  choice: जानता है
  rationale: यह चल रहे, ध्यानपूर्ण ज्ञान को सीधे व्यक्त करता है; ‘देखभाल करता है’ जैसे अर्थ को अनावश्यक रूप से पाठ में नहीं जोड़ा गया।
- source_word: יְמֵי
  choice: के दिनों को
  rationale: इब्रानी के शाब्दिक मुहावरे ‘के दिन’ को बनाए रखा गया है; प्रसंग में यह उनके जीवनकाल की ओर संकेत कर सकता है।
- source_word: תְמִימִם
  choice: निर्दोष लोगों
  rationale: यहाँ शब्द संपूर्णता, खराई और निष्कपट आचरण का बोध देता है; ‘निर्दोष’ भजन में दुष्टों के साथ किए गए नैतिक विरोध को स्पष्ट रखता है, पर अपने आप पूर्ण निष्पापता का दावा नहीं करता।
- source_word: נַחֲלָתָם
  choice: उनकी विरासत
  rationale: ‘विरासत’ उत्तराधिकार में मिले भाग या स्थायी संपत्ति—दोनों संभावित अर्थ-संकेतों को सुरक्षित रखती है।
- source_word: לְעוֹלָם
  choice: सदा
  rationale: यह अवधि की निरंतरता को स्वाभाविक और गरिमापूर्ण आधुनिक हिन्दी में व्यक्त करता है।
- source_word: תִּהְיֶה
  choice: रहेगी
  rationale: हिन्दी में ‘विरासत सदा रहेगी’ स्वाभाविक है और मूल के भविष्यकालीन अस्तित्व को व्यक्त करती है, यद्यपि ‘बनी रहेगी’ जैसा अतिरिक्त बल नहीं जोड़ती।
theological_decisions:
- issue: ‘निर्दोष’ का अभिप्राय
  choice: खराई और निष्कपटता से पहचाने जाने वाले लोग
  alternative: पूर्णतः निष्पाप लोग
  rationale: ज्ञान-साहित्य के इस प्रसंग में शब्द धर्मियों और दुष्टों के बीच नैतिक भेद बताता है; यह अनिवार्य रूप से निरपेक्ष पापहीनता का दावा नहीं करता।
- issue: याहवे के ‘जानने’ का आशय
  choice: पाठ में केवल ‘जानता है’ रखा गया, जिससे ध्यानपूर्ण या वाचागत अर्थ-संकेत खुला रहता है
  alternative: ‘देखभाल करता है’ या ‘स्वीकार करता है’
  rationale: प्रसंग में साधारण जानकारी से अधिक आशय हो सकता है, पर मूल क्रिया से आगे बढ़कर किसी एक धार्मिक व्याख्या को मुख्य पाठ में स्थापित नहीं किया गया।
- issue: विरासत की स्थायित्व-वाचक पंक्ति
  choice: ‘उनकी विरासत सदा रहेगी’
  alternative: वे अपनी विरासत पर सदा अधिकार रखेंगे
  rationale: मूल वाक्य विरासत के सदा होने की बात कहता है; स्थायी अधिकार या कब्ज़े का आशय संभव है, लेकिन उसे स्पष्ट करके अस्पष्टता समाप्त नहीं की गई।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण काव्यात्मक गद्य रखा गया है। ‘के दिनों’ द्वारा मूल इब्रानी मुहावरा सुरक्षित है, जबकि पादटिप्पणियाँ प्रमुख अर्थ-विकल्प और वास्तविक अस्पष्टता स्पष्ट करती हैं।
