  text: क्योंकि वे घास के समान शीघ्र मुरझा जाएँगे[a], और हरी वनस्पति के समान सूख जाएँगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “घास के समान शीघ्र काट डाले जाएँगे ... हरी वनस्पति के समान मुरझा जाएँगे।” इस पद की इब्रानी क्रियाओं के अर्थ-क्षेत्र में सूखना, मुरझाना और काटा जाना परस्पर जुड़े हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले पद के निषेध का कारण बताता है; हिन्दी में ‘क्योंकि’ इस व्याख्यात्मक संबंध को स्वाभाविक रूप से व्यक्त करता है।
- source_word: כֶחָצִיר
  choice: घास के समान
  rationale: חָצִיר यहाँ क्षणभंगुर घास या हरियाली का बिंब है; ‘घास’ सरल और सटीक है।
- source_word: מְהֵרָה
  choice: शीघ्र
  rationale: यह उनकी समाप्ति की निकटता और तेजी पर बल देता है; ‘शीघ्र’ काव्यात्मक किंतु सामान्य आधुनिक हिन्दी है।
- source_word: יִמָּלוּ
  choice: मुरझा जाएँगे
  rationale: संदर्भ में वनस्पति के सूखने या काटे जाने की अर्थ-छायाएँ संभव हैं; मुख्य पाठ में ‘मुरझाना’ वनस्पति-बिंब को स्वाभाविक रखता है और विकल्प पादटिप्पणी में सुरक्षित है।
- source_word: וּכְיֶרֶק דֶּשֶׁא
  choice: और हरी वनस्पति के समान
  rationale: युग्म हरी, ताजी उगी वनस्पति का संकेत देता है; ‘हरी वनस्पति’ अर्थ को बनाए रखते हुए ‘घास’ की अनावश्यक पुनरावृत्ति से बचाता है।
- source_word: יִבּוֹלוּן
  choice: सूख जाएँगे
  rationale: क्रिया मुरझाने, कुम्हलाने या सूख जाने को व्यक्त करती है; ‘सूख जाएँगे’ पहले चरण के समानांतर विनाशशीलता को स्पष्ट करता है।
