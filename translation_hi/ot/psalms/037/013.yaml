  text: אֲדֹנָ֥/י יִשְׂחַק ל֑/וֹ כִּֽי רָ֝אָ֗ה כִּֽי יָבֹ֥א יוֹמֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/037/013.yaml
  text: The Lord laughs at him[b][a], for he sees that his day is coming.
translation:
  language: hi
  text: प्रभु उस पर हँसता है[a], क्योंकि वह देखता है कि उसका दिन आ रहा है[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उसका उपहास करता है”; इब्रानी क्रिया का शाब्दिक अर्थ “हँसता है” है, पर यहाँ प्रसंग में हँसी उपहासपूर्ण है।
    reason: lexical_alternative
  - marker: b
    text: “उसका दिन” उस दुष्ट के पतन या न्याय के लिए ठहराए गए दिन को दर्शाता है।
    reason: cultural_note
lexical_decisions:
- source_word: אֲדֹנָי
  choice: प्रभु
  rationale: यह परमेश्वर के स्वामित्व-सूचक संबोधन का स्वाभाविक और प्रतिष्ठित हिन्दी रूप है।
- source_word: יִשְׂחַק
  choice: हँसता है
  rationale: मूल क्रिया का सीधा अर्थ ‘हँसना’ है; प्रसंग में इसका भाव उपहासपूर्ण है, जिसे पाद-टिप्पणी स्पष्ट करती है।
- source_word: לוֹ
  choice: उस पर
  rationale: इस क्रिया के साथ ל उस दुष्ट व्यक्ति को हँसी का लक्ष्य बताता है; हिन्दी में ‘उस पर हँसता है’ स्वाभाविक है।
- source_word: כִּי
  choice: क्योंकि
  rationale: पहला כִּי प्रभु के हँसने का कारण प्रस्तुत करता है।
- source_word: רָאָה
  choice: वह देखता है
  rationale: यद्यपि रूप पूर्णकालिक है, यहाँ वर्तमान में स्पष्ट दिखाई दे रहे निश्चित परिणाम का बोध है; ‘जानता है’ मूल क्रिया से अधिक व्याख्यात्मक होता।
- source_word: כִּי
  choice: कि
  rationale: दूसरा כִּי उस बात की विषय-वस्तु प्रस्तुत करता है जिसे प्रभु देखता है।
- source_word: יָבֹא
  choice: आ रहा है
  rationale: अपूर्ण रूप निकट आते भावी परिणाम को सजीव ढंग से व्यक्त करता है।
- source_word: יוֹמוֹ
  choice: उसका दिन
  rationale: यह मूल की संक्षिप्त काव्यात्मक अभिव्यक्ति को बनाए रखता है; प्रसंग में यह दुष्ट के पतन या न्याय के नियत दिन की ओर संकेत करता है।
theological_decisions:
- issue: परमेश्वर के हँसने का स्वरूप
  choice: मुख्य पाठ में मूल क्रिया के अनुसार ‘हँसता है’ रखा गया है, जबकि प्रसंगगत उपहासपूर्ण भाव पाद-टिप्पणी में बताया गया है।
  alternative: ‘उसका उपहास करता है’
  rationale: इससे मूल का शाब्दिक चित्र सुरक्षित रहता है और साथ ही न्याय के प्रसंग में उसके भाव को बिना अनावश्यक रूप से कठोर किए समझाया जाता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, काव्यात्मक और गरिमापूर्ण शैली; ‘प्रभु’ तथा ‘उसका दिन’ जैसे पारंपरिक बाइबलीय पदों को सामान्य पाठक के लिए सहज रूप में रखा गया है।
