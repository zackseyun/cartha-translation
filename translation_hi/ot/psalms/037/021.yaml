  yaml_path: translation/ot/psalms/037/021.yaml
  text: The wicked borrows and does not repay[b][a], but the righteous is gracious and gives.
translation:
  language: hi
  text: 'दुष्ट उधार लेता है और चुकाता नहीं,

    पर धर्मी कृपालु है और देता है।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לֹוֶה
  choice: उधार लेता है
  rationale: लוה का काल रूप यहाँ सामान्य, नीतिपरक सत्य व्यक्त करता है; ‘उधार लेता है’ आधुनिक हिन्दी में स्वाभाविक है और वस्तु को अनावश्यक रूप से ‘पैसा’ तक सीमित नहीं करता।
- source_word: רָשָׁע
  choice: दुष्ट
  rationale: यह विशेषण संज्ञा के रूप में प्रतिनिधि एकवचन व्यक्ति-वर्ग को दर्शाता है; ‘दुष्ट’ भजन-साहित्य के लिए संक्षिप्त और स्वाभाविक है।
- source_word: לֹא יְשַׁלֵּם
  choice: चुकाता नहीं
  rationale: שלם का पिएल रूप उधार को वापस चुकाने का अर्थ देता है; प्रसंग में ‘चुकाता नहीं’ स्पष्ट और सहज है।
- source_word: צַדִּיק
  choice: धर्मी
  rationale: संज्ञा के रूप में प्रयुक्त यह प्रतिनिधि एकवचन רָשָׁע के साथ सीधा विरोध बनाए रखता है।
- source_word: חוֹנֵן
  choice: कृपा दिखाता है
  rationale: חנן का मूल भाव कृपा या अनुग्रह दिखाना है; यह चयन उदारता के प्रसंग को बनाए रखते हुए क्रिया को केवल आर्थिक उदारता तक सीमित नहीं करता।
- source_word: וְנוֹתֵן
  choice: और देता है
  rationale: נתן का सामान्य अर्थ ‘देना’ है। कुछ लोग प्रसंगवश इसे उधार देने के अर्थ में समझते हैं, पर मूल क्रिया को संकीर्ण किए बिना ‘देता है’ उसकी व्यापकता सुरक्षित रखता है।
theological_decisions:
- issue: नीतिपरक विरोध में प्रतिनिधि पुल्लिंग एकवचन
  choice: ‘दुष्ट’ और ‘धर्मी’ के एकवचन वर्ग-सूचक रूप बनाए रखना
  alternative: ‘दुष्ट लोग’ और ‘धर्मी लोग’, अथवा ‘दुष्ट व्यक्ति’ और ‘धर्मी व्यक्ति’
  rationale: इब्रानी पाठ में दोनों पद पुल्लिंग एकवचन में संज्ञा के समान प्रयुक्त हैं और प्रतिनिधि प्रकारों का विरोध करते हैं। हिन्दी में ‘दुष्ट’ और ‘धर्मी’ इसे स्वाभाविक रूप से सुरक्षित रखते हैं।
- issue: धर्मी के देने का स्वरूप
  choice: ‘देता है’ कहकर क्रिया की व्यापकता बनाए रखना
  alternative: ‘उधार देता है’ अथवा ‘दान देता है’
  rationale: संदर्भ उदार आर्थिक व्यवहार का संकेत देता है, पर נתן स्वयं न तो केवल ऋण देने और न ही केवल दान देने को निर्दिष्ट करता है; अतः अस्पष्टता को नहीं सुलझाया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण और सामान्य पाठक के लिए सहज। दो समानांतर पंक्तियाँ इब्रानी काव्य के दुष्ट–धर्मी विरोध को स्पष्ट रखती हैं। ‘परन्तु’ औपचारिकता और पठनीयता के बीच संतुलन देता है।
