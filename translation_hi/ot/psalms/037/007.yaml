source:
  edition: WLC
  text: דּ֤וֹם לַ/יהוָה֮ וְ/הִתְח֪וֹלֵ֫ל ל֥/וֹ אַל תִּ֭תְחַר בְּ/מַצְלִ֣יחַ דַּרְכּ֑/וֹ בְּ֝/אִ֗ישׁ עֹשֶׂ֥ה מְזִמּֽוֹת׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/037/007.yaml
  text: Be still before Yahweh[a], and wait patiently for him; do not burn with anger because of one who prospers in his way[c][b], because of a man who carries out schemes.
translation:
  language: hi
  text: याहवेह के सामने शांत रहो,[a] और धीरज से उसकी बाट जोहो;[b] उस मनुष्य के कारण क्रोध से मत जलो जो अपने मार्ग में सफल होता है, और उस मनुष्य के कारण जो कुटिल योजनाओं को अंजाम देता है।[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “याहवेह के सामने चुप रहो।” इब्रानी क्रिया स्थिरता के साथ-साथ मौन पर भी बल दे सकती है।
    reason: lexical_alternative
  - marker: b
    text: या, “उसकी उत्कंठापूर्वक प्रतीक्षा करो”; परंपरागत रूप से, “उसमें विश्राम करो।” इब्रानी क्रिया धीरजभरी, यहाँ तक कि तड़पती हुई प्रतीक्षा का भाव दे सकती है।
    reason: lexical_alternative
  - marker: c
    text: परंपरागत रूप से, “कुढ़ो मत।” इब्रानी में अधिक शाब्दिक चित्र गरम होने या क्रोध से जलने का है।
    reason: lexical_alternative
lexical_decisions:
- source_word: דּוֹם
  choice: शांत रहो
  rationale: आज्ञार्थक क्रिया मौन और स्थिरता—दोनों का भाव व्यक्त कर सकती है। ‘शांत रहो’ आधुनिक हिन्दी में स्वाभाविक है और परमेश्वर के सामने संयमित मौन को समेटती है।
- source_word: לַיהוָה
  choice: याहवेह के सामने
  rationale: इस प्रसंग में ל संबंध और उपस्थिति की दिशा बताता है; ‘के सामने’ याहवेह की उपस्थिति में शांत रहने का भाव स्पष्ट करता है।
- source_word: וְהִתְחוֹלֵל לוֹ
  choice: और धीरज से उसकी बाट जोहो
  rationale: हित्पोलेल रूप में व्याकुल या तड़पती हुई प्रतीक्षा की छाया हो सकती है, पर यहाँ उपदेशात्मक संदर्भ में धीरजपूर्ण प्रतीक्षा मुख्य भाव है। ‘बाट जोहो’ dignified और सुबोध हिन्दी है।
- source_word: אַל תִּתְחַר
  choice: क्रोध से मत जलो
  rationale: חרה का मूल रूपक गरम होने या जल उठने का है और यहाँ क्रोधित होने को दर्शाता है। अनुवाद उस रूपक को बनाए रखता है।
- source_word: בְּמַצְלִיחַ דַּרְכּוֹ
  choice: उस मनुष्य के कारण ... जो अपने मार्ग में सफल होता है
  rationale: בְּ यहाँ क्रोध के कारण या लक्ष्य को चिह्नित करता है; מצליח सफलता पानेवाले को और דַּרְכּוֹ उसके जीवन-मार्ग या चाल-चलन को सूचित करता है।
- source_word: בְּאִישׁ
  choice: उस मनुष्य के कारण
  rationale: אִישׁ पुल्लिंग एकवचन है और एक प्रतिनिधि व्यक्ति को सूचित करता है; स्रोत का लिंगगत रूप बनाए रखा गया है।
- source_word: עֹשֶׂה מְזִמּוֹת
  choice: जो षड्यंत्रों को पूरा करता है
  rationale: מְזִמּוֹת योजनाओं, युक्तियों या षड्यंत्रों को सूचित कर सकता है। नकारात्मक संदर्भ में ‘षड्यंत्र’ उपयुक्त है और עֹשֶׂה उनके सक्रिय कार्यान्वयन का भाव देता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवेह
  alternative: यहोवा / प्रभु
  rationale: मूल पाठ में वाचा का विशिष्ट नाम है; उसका लिप्यंतरण नाम को सामान्य उपाधि में बदलने से बचाता है।
- issue: אִישׁ का लिंगगत निरूपण
  choice: मनुष्य
  alternative: व्यक्ति / कोई
  rationale: स्रोत पुल्लिंग एकवचन में एक प्रतिनिधि पुरुष का उल्लेख करता है; ‘मनुष्य’ स्रोत के रूप को रखते हुए आधुनिक हिन्दी में स्वाभाविक है।
- issue: מְזִמּוֹת के नैतिक अर्थ की तीव्रता
  choice: षड्यंत्र
  alternative: योजनाएँ
  rationale: ज्ञान-साहित्य के इस नकारात्मक संदर्भ में शब्द दुष्ट या कपटपूर्ण योजनाओं की ओर संकेत करता है, यद्यपि अकेले संज्ञा का अर्थ व्यापक हो सकता है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, काव्यात्मक किंतु सहज और गरिमापूर्ण रखी गई है। ‘बाट जोहो’ भजन-साहित्य के अनुरूप साहित्यिक पद है, फिर भी सामान्य पाठक के लिए बोधगम्य है। समानांतर वाक्य-विन्यास और ‘क्रोध से मत जलो’ में मूल इब्रानी रूपक सुरक्षित रखा गया है।
