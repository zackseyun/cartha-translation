  text: The mouth of the righteous utters wisdom[b][a], and his tongue speaks justice.
translation:
  language: hi
  text: धर्मी का मुँह बुद्धि की बातें कहता है[a], और उसकी जीभ न्याय की बात कहती है[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “बुद्धि पर मनन करता है” अथवा “बुद्धि की बातें धीमे स्वर में कहता है”; इब्रानी क्रिया मनन करने, बुदबुदाने या धीमे स्वर में बोलने का अर्थ दे सकती है। यहाँ “जीभ ... कहती है” के समानांतर होने के कारण मुखर अभिव्यक्ति की संभावना अधिक है।
    reason: lexical_alternative
  - marker: b
    text: या “उचित निर्णय”; इब्रानी शब्द न्याय, न्यायिक निर्णय या जो उचित है, इन अर्थों में आ सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: פִּי צַדִּיק
  choice: धर्मी का मुँह
  rationale: इब्रानी संबंधसूचक रचना और वाणी के लिए प्रयुक्त ‘मुँह’ के काव्यात्मक लक्षण को बनाए रखता है। צַדִּיק यहाँ पुल्लिंग एकवचन में आदर्श धार्मिक व्यक्ति को दर्शाता है; हिंदी में ‘धर्मी’ स्वाभाविक और पर्याप्त है।
- source_word: יֶהְגֶּה
  choice: बातें करता है
  rationale: הגה धीमे स्वर में बोलने, मनन करने या बुदबुदाने का अर्थ दे सकता है। ‘मुँह’ कर्ता है और अगली पंक्ति में ‘जीभ ... कहती है,’ इसलिए यहाँ मुखर अभिव्यक्ति प्रमुख है।
- source_word: חָכְמָה
  choice: बुद्धि
  rationale: חָכְמָה का मानक अर्थ बुद्धि/ज्ञानपूर्ण विवेक है; यहाँ यह धर्मी की वाणी की विषयवस्तु है।
- source_word: וּלְשׁוֹנוֹ
  choice: और उसकी जीभ
  rationale: मूल का शारीरिक बिंब और ‘मुँह’ के साथ उसका काव्यात्मक समानांतर सुरक्षित रहता है।
- source_word: תְּדַבֵּר
  choice: बात कहती है
  rationale: דבר का सीधा अर्थ बोलना/कहना है; स्त्रीलिंग क्रिया का संबंध ‘जीभ’ से है।
- source_word: מִשְׁפָּט
  choice: न्याय
  rationale: מִשְׁפָּט न्याय, न्यायिक निर्णय या उचित बात को सूचित कर सकता है। ज्ञान-साहित्य के इस संदर्भ में ‘न्याय’ व्यापक नैतिक अर्थ को स्वाभाविक रूप से व्यक्त करता है।
theological_decisions:
- issue: ज्ञान-काव्य में पुल्लिंग एकवचन צַדִּיק
  choice: धर्मी
  alternative: धर्मी पुरुष
  rationale: मूल शब्द व्याकरणतः पुल्लिंग एकवचन है, पर उसमें ‘पुरुष’ अर्थ वाला कोई पृथक संज्ञा-शब्द नहीं है। हिंदी ‘धर्मी’ प्रतिनिधिक एकवचन और मूल की संक्षिप्तता दोनों को बनाए रखता है, बिना दायरे को केवल पुरुषों तक सीमित किए।
- issue: מִשְׁפָּט का अर्थ-क्षेत्र
  choice: न्याय
  alternative: निर्णय / जो उचित है
  rationale: पद किसी विशिष्ट न्यायालयीन निर्णय का स्पष्ट उल्लेख नहीं करता। ‘न्याय’ मूल की नैतिक और न्यायिक दोनों संभावनाओं को सबसे अच्छी तरह खुला रखता है।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण, सहज काव्यात्मक शैली। ‘मुँह’ और ‘जीभ’ के मूल समानांतर बिंब सुरक्षित रखे गए हैं। वैकल्पिक अर्थों को मुख्य पाठ में निर्णायक ढंग से सीमित करने के बजाय पादटिप्पणियों में रखा गया है।
