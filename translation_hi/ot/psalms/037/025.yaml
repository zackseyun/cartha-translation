id: PSA.37.25
reference: Psalms 37:25
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: נַ֤עַר הָיִ֗יתִי גַּם זָ֫קַ֥נְתִּי וְֽ/לֹא רָ֭אִיתִי צַדִּ֣יק נֶעֱזָ֑ב וְ֝/זַרְע֗/וֹ מְבַקֶּשׁ לָֽחֶם׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/037/025.yaml
  text: I was young[a], and now I am old[b], yet I have not seen the righteous forsaken or his offspring begging for bread.
translation:
  language: hi
  text: मैं जवान था और अब बूढ़ा हो गया हूँ; फिर भी मैंने न तो किसी धर्मी को त्यागा हुआ देखा है, न उसके वंश[a] को रोटी माँगते हुए[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से ‘उसका बीज,’ अर्थात उसकी संतान या उसका वंश।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी क्रिया का मूल अर्थ ‘ढूँढ़ना’ या ‘माँगना’ है; यहाँ आशय मूल भोजन के लिए रोटी माँगने से है।
    reason: lexical_alternative
lexical_decisions:
- source_word: נַעַר הָיִיתִי
  choice: मैं जवान था
  rationale: नַעַר यहाँ הָיִיתִי के साथ विधेय रूप में है। ‘मैं जवान था’ स्वाभाविक हिन्दी है और युवावस्था तथा बुढ़ापे के आत्मकथात्मक विरोध को बनाए रखता है।
- source_word: גַּם זָקַנְתִּי
  choice: और अब बूढ़ा हो गया हूँ
  rationale: गַּם इस जीवन-क्रम में अगले चरण को जोड़ता है, और זָקַנְתִּי बूढ़ा हो चुकने की प्राप्त अवस्था बताता है। ‘अब’ प्रसंगगत प्रगति को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וְלֹא רָאִיתִי
  choice: फिर भी मैंने ... नहीं देखा है
  rationale: ‘फिर भी’ जीवनभर के अनुभव के बाद कही गई बात का हल्का विरोधात्मक संबंध व्यक्त करता है। ‘नहीं देखा है’ युवावस्था से वर्तमान बुढ़ापे तक फैले अनुभव के लिए स्वाभाविक है।
- source_word: צַדִּיק
  choice: किसी धर्मी को
  rationale: एकवचन विशेषण संज्ञा के रूप में प्रतिनिधिक अर्थ रखता है। हिन्दी में नकारात्मक वाक्य के भीतर ‘किसी धर्मी’ इस सामान्य अर्थ को स्पष्ट और सहज बनाता है।
- source_word: נֶעֱזָב
  choice: त्यागा हुआ
  rationale: यह עזב का निफ़अल रूप है और छोड़े अथवा परित्यक्त किए जाने की निष्क्रिय अवस्था बताता है। ‘त्यागा हुआ’ मूल की गंभीरता को बनाए रखता है।
- source_word: וְזַרְעוֹ
  choice: न उसके वंश को
  rationale: זֶרַע का शाब्दिक अर्थ ‘बीज’ और यहाँ अर्थ संतान अथवा वंश है। ‘न तो ... न ...’ उन दोनों स्थितियों को स्वाभाविक हिन्दी में जोड़ता है जिन्हें भजनकार ने नहीं देखा।
- source_word: מְבַקֶּשׁ לָחֶם
  choice: रोटी माँगते हुए
  rationale: בקש का मूल अर्थ ढूँढ़ना या माँगना है; रोटी के साथ इस प्रसंग में यह मूल भोजन के लिए माँगने का भाव देता है। ‘रोटी’ ठोस बिंब को सुरक्षित रखती है।
theological_decisions:
- issue: क्या पद को सार्वभौमिक और निरपवाद प्रतिज्ञा बनाया जाए या भजनकार का व्यक्तिगत अनुभव रहने दिया जाए
  choice: 'पहले पुरुष के अनुभव के रूप में रखा गया: ‘मैंने ... नहीं देखा है।’'
  alternative: ऐसी सार्वभौमिक प्रतिज्ञा कि कोई धर्मी या उसका वंश कभी अभाव में नहीं पड़ेगा।
  rationale: इब्रानी पाठ स्पष्ट रूप से वक्ता के युवावस्था से बुढ़ापे तक के अवलोकन को व्यक्त करता है। अनुवाद इसे पाठ की सीमा से आगे बढ़ाकर निरपवाद सिद्धान्त नहीं बनाता।
- issue: צַדִּיק और זַרְעוֹ की प्रतिनिधिक एकवचनता
  choice: ‘किसी धर्मी’ और ‘उसके वंश’ रखा गया।
  alternative: ‘धर्मी लोग’ और ‘उनकी संतानें।’
  rationale: मूल पाठ व्याकरण की दृष्टि से पुल्लिंग एकवचन है, पर उसका प्रयोग प्रतिनिधिक है। चुना हुआ रूप इस एकवचन संरचना और सामान्य आशय दोनों को बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज शैली अपनाई गई है। अर्धविराम जीवन-वृत्तांत और उससे निकले व्यक्तिगत अवलोकन को अलग करता है। ‘न तो ... न ...’ इब्रानी के समन्वित निषेध को स्पष्ट करता है और कथन को अनावश्यक रूप से सार्वभौमिक प्रतिज्ञा नहीं बनाता।
