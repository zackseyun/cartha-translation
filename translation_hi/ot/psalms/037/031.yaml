  text: תּוֹרַ֣ת אֱלֹהָ֣י/ו בְּ/לִבּ֑/וֹ לֹ֖א תִמְעַ֣ד אֲשֻׁרָי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/037/031.yaml
  text: The law of his God is in his heart[a]; his steps do not slip.
translation:
  language: hi
  text: उसके परमेश्वर की व्यवस्था उसके हृदय में है[a]; उसके कदम नहीं फिसलते।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उसके परमेश्वर की शिक्षा उसके हृदय में है; उसके कदम नहीं डगमगाते।”
    reason: lexical_alternative
lexical_decisions:
- source_word: תּוֹרַת
  choice: व्यवस्था
  rationale: תּוֹרָה का अर्थ शिक्षा, निर्देश या व्यवस्था हो सकता है। ज्ञान-साहित्य के इस प्रसंग में “व्यवस्था” परमेश्वर की अधिकारपूर्ण शिक्षा और नैतिक इच्छा का बल बनाए रखती है।
- source_word: אֱלֹהָיו
  choice: उसके परमेश्वर
  rationale: तीसरे पुरुष एकवचन प्रत्यय व्यक्तिगत संबंध और स्वामित्व को व्यक्त करता है; हिन्दी में “उसके परमेश्वर” इसका स्वाभाविक रूप है।
- source_word: בְּלִבּוֹ
  choice: उसके हृदय में है
  rationale: यह वाक्यांश परमेश्वर की व्यवस्था के अंतरीकरण को दर्शाता है। यहाँ “हृदय” विचार, इच्छा और भीतरी मनुष्य को समेटने वाला बाइबलीय रूपक बनाए रखता है।
- source_word: תִמְעַד
  choice: नहीं फिसलते
  rationale: מעד का अर्थ फिसलना, डगमगाना या ठोकर खाना हो सकता है। “कदम” के साथ “फिसलते” स्वाभाविक हिन्दी है और सुरक्षित चाल का रूपक बनाए रखता है।
- source_word: אֲשֻׁרָיו
  choice: उसके कदम
  rationale: बहुवचन संज्ञा व्यक्ति के कदमों और रूपकतः उसके जीवन-मार्ग को सूचित करती है; “उसके कदम” संक्षिप्त और स्वाभाविक है।
theological_decisions:
- issue: ज्ञान-साहित्य के प्रसंग में תּוֹרָה का अर्थ
  choice: व्यवस्था
  alternative: शिक्षा / निर्देश
  rationale: “व्यवस्था” परमेश्वर की अधिकारपूर्ण प्रकट इच्छा और वाचा-संबंधी नैतिक भार को सुरक्षित रखती है, जबकि पादटिप्पणी व्यापक अर्थ “शिक्षा” और क्रिया के वैकल्पिक अर्थ “डगमगाते” को दर्ज करती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और काव्यात्मक वाक्य। “हृदय” बाइबलीय भीतरी-मनुष्य के रूपक को और “कदम” जीवन-चाल के रूपक को बनाए रखता है।
