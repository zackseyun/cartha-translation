  register: भाषा आधुनिक, गरिमापूर्ण और काव्यात्मक रखी गई है। समानांतर पदबंध और युद्ध की तीव्र छवि सुरक्षित हैं; ‘चाल सीधी’ नैतिक जीवन-पथ का सहज हिन्दी रूपक है।
