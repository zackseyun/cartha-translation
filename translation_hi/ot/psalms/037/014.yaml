source:
  edition: WLC
  text: חֶ֤רֶב פָּֽתְח֣וּ רְשָׁעִים֮ וְ/דָרְכ֪וּ קַ֫שְׁתָּ֥/ם לְ֭/הַפִּיל עָנִ֣י וְ/אֶבְי֑וֹן לִ֝/טְב֗וֹחַ יִשְׁרֵי דָֽרֶךְ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/037/014.yaml
  text: The wicked have drawn the sword and bent their bow[a], to bring down the poor and needy[b], to slaughter those upright in way.
translation:
  language: hi
  text: दुष्टों ने तलवार खींच ली है और अपना धनुष तान लिया है, ताकि दीन और दरिद्र को गिरा दें और जिनका मार्ग सीधा है, उनका वध करें।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חֶרֶב פָּתְחוּ
  choice: तलवार खींच ली है
  rationale: शाब्दिक रूप से क्रिया का अर्थ ‘खोलना’ है, पर तलवार के साथ यह उसे म्यान से खींचने का युद्ध-संबंधी मुहावरा है।
- source_word: רְשָׁעִים
  choice: दुष्टों
  rationale: यह बहुवचन संज्ञात्मक विशेषण नैतिक रूप से दुष्ट लोगों को दर्शाता है; ‘दुष्टों’ संक्षिप्त और स्वाभाविक हिन्दी है।
- source_word: וְדָרְכוּ קַשְׁתָּם
  choice: और अपना धनुष चढ़ा लिया है
  rationale: धनुष के साथ דָרַךְ उसे तानने या चलाने के लिए तैयार करने को दर्शाता है। ‘धनुष चढ़ाना’ हिन्दी में इस तैयारी का स्वाभाविक मुहावरा है; एकवचन धनुष मूल पाठ के सामूहिक एकवचन को बनाए रखता है।
- source_word: לְהַפִּיל
  choice: ताकि ... गिरा दें
  rationale: हिफ़ील रूप का मूल भाव ‘गिरा देना’ है। इससे हिंसक आशय बना रहता है, पर अर्थ को अनावश्यक रूप से केवल ‘मार डालना’ तक सीमित नहीं किया जाता।
- source_word: עָנִי וְאֶבְיוֹן
  choice: दीन और दरिद्र
  rationale: दोनों निकटार्थक शब्द सामाजिक दुर्बलता, अभाव और पीड़ा का संकेत देते हैं। यह प्रचलित हिन्दी युग्म उनकी अलग किंतु समानांतर छटाओं को बनाए रखता है।
- source_word: לִטְבֹחַ
  choice: वध करें
  rationale: यह सामान्य ‘मारना’ से अधिक तीव्र शब्द है और निर्मम हत्या का भाव देता है; ‘वध’ गरिमापूर्ण काव्यात्मक भाषा में इसकी शक्ति बनाए रखता है।
- source_word: יִשְׁרֵי דָרֶךְ
  choice: जिनकी चाल सीधी है
  rationale: शाब्दिक संरचना ‘मार्ग के सीधे’ है और जीवन-आचरण की नैतिक खराई को दर्शाती है। यह हिन्दी में स्वाभाविक रहते हुए मूल रूपक को सुरक्षित रखता है।
theological_decisions: []
