    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/פֹשְׁעִים
  choice: परन्तु अपराधी
  rationale: פֹשְׁעִים विद्रोह या नैतिक-व्यवस्था के उल्लंघन करने वालों को दर्शाता है। ‘अपराधी’ इसका नैतिक-कानूनी भाव सहज हिन्दी में रखता है; וּ को प्रसंग में धर्मी लोगों से विरोध दिखाने के लिए ‘परन्तु’ किया गया है।
- source_word: נִשְׁמְדוּ
  choice: नष्ट हो जाएँगे
  rationale: שׁמד का निफ़अल रूप विनष्ट किए जाने या मिट जाने का प्रबल भाव देता है। हिन्दी में भविष्यकाल संदर्भगत परिणति को स्वाभाविक रूप से व्यक्त करता है।
- source_word: יַחְדָּו
  choice: सब मिलकर
  rationale: क्रियाविशेषण का अर्थ ‘एक साथ’ या ‘सभी के सभी’ हो सकता है। ‘सब मिलकर’ सामूहिक और समग्र विनाश—दोनों भावों को सहजता से व्यक्त करता है।
- source_word: אַחֲרִית
  choice: भविष्य
  rationale: इस शब्द का अर्थ भविष्य, अंतिम परिणाम या अंत हो सकता है। यहाँ दुष्टों की अंतिम संभावना या नियति की बात होने के कारण ‘भविष्य’ मुख्य पाठ में उपयुक्त है; ‘अंत’ को पादटिप्पणी में रखा गया है।
- source_word: רְשָׁעִים
  choice: दुष्टों
  rationale: ज्ञान-साहित्य और भजनों में यह नैतिक श्रेणी का मानक, स्पष्ट और स्वाभाविक हिन्दी रूप है।
- source_word: נִכְרָתָה
  choice: काट दिया जाएगा
  rationale: כרת के निफ़अल का मूल बिंब ‘काट दिया जाना’ है। इसे बनाए रखने से न्यायिक और पूर्ण वंचना का बल सपाट ‘नष्ट होगा’ की अपेक्षा अधिक सुरक्षित रहता है।
theological_decisions:
- issue: न्याय के संदर्भ में אַחֲרִית का अर्थ
  choice: दुष्टों का भविष्य काट दिया जाएगा
  alternative: दुष्टों का अंत काट दिया जाएगा; अथवा दुष्टों की भावी पीढ़ी काट दी जाएगी
  rationale: इब्रानी संज्ञा भविष्य, अंतिम परिणाम, अंत या कभी-कभी भावी पीढ़ी को सूचित कर सकती है। प्रसंग में धर्मियों और दुष्टों की नियति का विरोध है, इसलिए ‘भविष्य’ अर्थ को अनावश्यक रूप से वंशजों तक सीमित नहीं करता। ‘अंत’ की वास्तविक संभावना पादटिप्पणी में सुरक्षित रखी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सामान्य-पाठक-सुलभ काव्यात्मक गद्य। समानांतर पंक्तियों और ‘काट दिया जाएगा’ के मूल इब्रानी बिंब को बनाए रखा गया है।
