  text: מֵ֭/יְהוָה מִֽצְעֲדֵי גֶ֥בֶר כּוֹנָ֗נוּ וְ/דַרְכּ֥/וֹ יֶחְפָּֽץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/037/023.yaml
  text: From Yahweh a man's steps are established[b][a], and he delights in his way.
translation:
  language: hi
  text: यहोवा मनुष्य के कदमों को स्थिर करता है, और वह मनुष्य के मार्ग से प्रसन्न होता है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इब्रानी में ‘प्रसन्न होता है’ का कर्ता स्पष्ट नहीं है; इसे मनुष्य भी समझा जा सकता है: वह अपने मार्ग से प्रसन्न होता है।'
    reason: alternative_reading
lexical_decisions:
- source_word: מֵיְהוָה
  choice: यहोवा की ओर से
  rationale: מִן स्रोत या कर्तृत्व को व्यक्त करता है। निष्क्रिय क्रिया के साथ ‘यहोवा की ओर से’ मूल के ‘यहोवा से’ भाव और आरंभिक बलाघात को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: מִצְעֲדֵי
  choice: कदम
  rationale: यह संज्ञा चलने के कदमों को दर्शाती है और यहाँ जीवन की चाल या दिशा के रूपक को भी सहज रूप से बनाए रखती है।
- source_word: גֶבֶר
  choice: मनुष्य के
  rationale: גֶבֶר व्याकरणतः पुल्लिंग है, पर इस ज्ञान-साहित्यिक कथन में सामान्य मानव के लिए प्रयुक्त है। ‘मनुष्य’ आधुनिक हिन्दी में स्वाभाविक है और मूल के मानवीय संदर्भ को सुरक्षित रखता है।
- source_word: כּוֹנָנוּ
  choice: स्थिर किए जाते हैं
  rationale: כון का यह रूप निष्क्रिय है और स्थापित, दृढ़ या स्थिर किए जाने का अर्थ देता है। ‘स्थिर किए जाते हैं’ निष्क्रियता तथा दृढ़ किए जाने—दोनों को स्पष्ट रखता है।
- source_word: וְדַרְכּוֹ
  choice: और ... उसके मार्ग से
  rationale: דֶּרֶךְ के लिए ‘मार्ग’ इसके शाब्दिक और रूपकात्मक दोनों अर्थों तथा ज्ञान-साहित्य से इसके संबंध को बनाए रखता है। प्रत्यय को ‘उसके’ के रूप में रखा गया है।
- source_word: יֶחְפָּץ
  choice: वह ... प्रसन्न होता है
  rationale: חפץ का अर्थ प्रसन्न होना, आनंद लेना या चाहना हो सकता है। यहाँ ‘प्रसन्न होता है’ स्वाभाविक हिन्दी है और निहित तीसरे पुरुष पुल्लिंग कर्ता को खुला रखता है।
theological_decisions:
- issue: יֶחְפָּץ (‘प्रसन्न होता है’) का कर्ता
  choice: 'मुख्य पाठ में ‘वह’ का प्राथमिक संकेत यहोवा की ओर है: यहोवा मनुष्य के मार्ग से प्रसन्न होता है।'
  alternative: ‘वह’ का संकेत मनुष्य की ओर भी समझा जा सकता है।
  rationale: इब्रानी में कर्ता व्यक्त नहीं है। पहले खंड का यहोवा सबसे स्वाभाविक पूर्वपद है, पर व्याकरण मनुष्य को कर्ता मानने की संभावना पूरी तरह समाप्त नहीं करता; इसलिए अस्पष्टता को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध हिन्दी। मूल की निष्क्रिय रचना और दूसरे खंड की वास्तविक सर्वनाम-संबंधी अस्पष्टता को बनाए रखा गया है।
