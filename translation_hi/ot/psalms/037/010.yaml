base_translation:
  language: en
  yaml_path: translation/ot/psalms/037/010.yaml
  text: Yet a little while[a], and the wicked will be no more; though you look carefully at his place, he will not be there.
translation:
  language: hi
  text: बस थोड़े ही समय बाद[a] दुष्ट नहीं रहेगा; तुम उसके स्थान को ध्यान से देखोगे, पर वह वहाँ नहीं होगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में “दुष्ट” एकवचन है, पर इसका अर्थ सामान्य या सामूहिक रूप से “दुष्ट लोग” भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעוֹד מְעַט
  choice: बस थोड़े ही समय बाद
  rationale: यह इब्रानी पदबंध थोड़े समय की भविष्याभिमुख अवधि बताता है। यह हिंदी में स्वाभाविक है और निकट भविष्य का भाव बनाए रखता है।
- source_word: וְאֵין רָשָׁע
  choice: दुष्ट नहीं रहेगा
  rationale: अस्तित्वसूचक निषेध को प्रसंगानुसार भविष्य में दुष्ट के न रहने के रूप में व्यक्त किया गया है। एकवचन 'दुष्ट' प्रतिनिधिक या सामूहिक अर्थ भी रख सकता है।
- source_word: וְהִתְבּוֹנַנְתָּ
  choice: तुम ... ध्यान से देखोगे
  rationale: हित्पोलेल रूप सावधानी से देखने या विचारपूर्वक जाँचने का भाव देता है। भविष्यकाल संदर्भ के अनुकूल है।
- source_word: עַל מְקוֹמוֹ
  choice: उसके स्थान को
  rationale: यह उस जगह की ओर ध्यान लगाने का ठोस चित्र सुरक्षित रखता है जहाँ दुष्ट उपस्थित था।
- source_word: וְאֵינֶנּוּ
  choice: पर वह वहाँ नहीं होगा
  rationale: अंतिम खंड पहले कथन को उसके स्थान से अनुपस्थिति के ठोस रूप में दोहराता है। 'पर' प्रसंग में निहित विरोधात्मक परिणाम को सहज हिंदी में व्यक्त करता है।
theological_decisions:
- issue: रָשָׁע के एकवचन का प्रतिनिधिक दायरा
  choice: मुख्य पाठ में एकवचन 'दुष्ट'
  alternative: बहुवचन या सामूहिक 'दुष्ट लोग'
  rationale: इब्रानी में पुल्लिंग एकवचन है, किंतु वह किसी प्रतिनिधिक व्यक्ति या पूरे वर्ग को सामान्य रूप से सूचित कर सकता है; मुख्य पाठ रूप को सुरक्षित रखता है और पादटिप्पणी दायरा स्पष्ट करती है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण मानक हिंदी। समानांतर पंक्तियों की संक्षिप्तता तथा दुष्ट के लुप्त हो जाने का ठोस स्थानिक चित्र सुरक्षित रखा गया है।
