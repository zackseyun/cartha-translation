  text: I have seen a wicked[a], ruthless man spreading himself out like a flourishing native tree.
translation:
  language: hi
  text: मैंने एक दुष्ट और निर्दयी व्यक्ति को हरे-भरे देशी पेड़ की तरह फैलता हुआ देखा है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मैंने एक दुष्ट और निर्दयी व्यक्ति को हरे-भरे, अपनी भूमि में पनपने वाले पेड़ के समान फैलता हुआ देखा।” इब्रानी अभिव्यक्ति कठिन है। “देशी पेड़” संभवतः उस पेड़ की निहित छवि को स्पष्ट करता है जो अपनी ही मिट्टी में खूब फलता-फूलता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: רָאִיתִי
  choice: मैंने ... देखा है
  rationale: यह קַל पूर्ण रूप, प्रथम पुरुष एकवचन है। हिंदी में ‘देखा है’ भजनकार के अनुभव और उसकी वर्तमान प्रासंगिकता को स्वाभाविक रूप से व्यक्त करता है; ‘देखा’ भी संभव है।
- source_word: רָשָׁע
  choice: दुष्ट
  rationale: यह नैतिक रूप से बुरे व्यक्ति के लिए प्रयुक्त सामान्य ज्ञान-साहित्यिक शब्द है; ‘दुष्ट’ आधुनिक हिंदी में स्पष्ट और स्थापित पर्याय है।
- source_word: עָרִיץ
  choice: अत्याचारी
  rationale: यह शब्द शक्तिशाली, दमनकारी और भय उत्पन्न करने वाले व्यक्ति का बोध कराता है। ‘अत्याचारी’ सामाजिक दमन को व्यक्त करता है, पर शारीरिक हिंसा को अनिवार्य नहीं बनाता।
- source_word: וּמִתְעָרֶה
  choice: फैलते
  rationale: हित्पएल कृदंत समृद्धि में विस्तार पाने या फैलने की गतिशील छवि देता है। ‘फैलते’ हिंदी में पेड़ की उपमा के साथ स्वाभाविक है और मूल की प्रगतिशील क्रिया को बनाए रखता है।
- source_word: כְּאֶזְרָח
  choice: देशज पेड़ की तरह
  rationale: אֶזְרָח का सामान्य अर्थ ‘देशज/मूल निवासी’ है। काव्यात्मक उपमा में अपनी भूमि में पनपते पेड़ की छवि संभवतः निहित है; अर्थ स्पष्ट करने के लिए ‘पेड़’ जोड़ा गया है।
- source_word: רַעֲנָן
  choice: हरे-भरे
  rationale: यह ताजगी, हरियाली और भरपूर बढ़ोतरी को व्यक्त करता है। ‘हरे-भरे’ पेड़ की दृश्य छवि और समृद्ध दशा दोनों को सहज हिंदी में संप्रेषित करता है।
