  text: תְּפִלָּה֮ לְ/מֹשֶׁ֪ה אִֽישׁ הָ/אֱלֹ֫הִ֥ים אֲֽדֹנָ֗/י מָע֣וֹן אַ֭תָּה הָיִ֥יתָ לָּ֗/נוּ בְּ/דֹ֣ר וָ/דֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/090/001.yaml
  text: A prayer of Moses[a], the man of God. Lord[b], you have been a dwelling place for us from generation to generation.
translation:
  language: hi
  text: 'परमेश्वर के जन मूसा की प्रार्थना।[a]


    हे प्रभु, पीढ़ी-दर-पीढ़ी आप हमारे निवास-स्थान रहे हैं।[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शीर्षक में “मूसा की” का अनुवाद “मूसा द्वारा” या “मूसा के लिए” भी हो सकता है; इब्रानी पूर्वसर्ग लेखकत्व, संबंध या समर्पण प्रकट कर सकता है।
    reason: alternative_reading
  - marker: b
    text: “निवास-स्थान” के लिए “शरणस्थान” या “वासस्थान” भी संभव है।
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּפִלָּה
  choice: प्रार्थना
  rationale: भजन के शीर्षक में यह संज्ञा विधा को स्वाभाविक और सीधे रूप में व्यक्त करती है।
- source_word: לְמֹשֶׁה
  choice: मूसा की
  rationale: हिन्दी शीर्षक में यह संबंध को सहज रूप से व्यक्त करता है, जबकि पादटिप्पणी इब्रानी לְ के लेखकत्व, संबंध या समर्पण-सूचक संभावित अर्थों को सुरक्षित रखती है।
- source_word: אִישׁ הָאֱלֹהִים
  choice: परमेश्वर के जन
  rationale: यह मूसा के लिए प्रयुक्त प्रतिष्ठित इब्रानी उपाधि का स्वाभाविक, गरिमापूर्ण हिन्दी रूप है।
- source_word: אֲדֹנָי
  choice: प्रभु
  rationale: यह संबोधन के रूप में प्रयुक्त स्थिर ईश्वरीय उपाधि का प्रचलित और स्वाभाविक हिन्दी अनुवाद है।
- source_word: מָעוֹן
  choice: निवास-स्थान
  rationale: यह स्थान-संबंधी मूल रूपक को बनाए रखता है; ‘शरणस्थान’ सुरक्षा के भाव को स्पष्ट करता, पर अर्थ को कुछ संकुचित कर देता।
- source_word: הָיִיתָ לָּנוּ
  choice: आप हमारे ... रहे हैं
  rationale: यह पूर्ण क्रिया के उस संबंध को स्वाभाविक हिन्दी में व्यक्त करता है जो पिछली पीढ़ियों से वर्तमान तक बना रहा है।
- source_word: בְּדֹר וָדֹר
  choice: पीढ़ी-दर-पीढ़ी
  rationale: यह लगातार आने वाली पीढ़ियों के इब्रानी मुहावरे को संक्षिप्त और स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: शीर्षक לְמֹשֶׁה का आशय
  choice: मुख्य पाठ में ‘मूसा की’ और पादटिप्पणी में व्यापकता
  alternative: ‘मूसा द्वारा’ या ‘मूसा के लिए’
  rationale: इब्रानी पूर्वसर्ग लेखकत्व, संबंध अथवा समर्पण बता सकता है। मुख्य हिन्दी रूप स्वाभाविक संबंध-सूचक है, और पादटिप्पणी उससे अधिक निश्चित ऐतिहासिक दावा करने से बचाती है।
translation_notes:
  register: आधुनिक मानक हिन्दी, आदरपूर्ण ईश्वरीय संबोधन और साधारण पाठकों के लिए सहज किंतु गरिमापूर्ण शैली। शीर्षक तथा पद को अलग रखा गया है; सभी पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित हैं।
