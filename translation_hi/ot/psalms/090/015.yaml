  yaml_path: translation/ot/psalms/090/015.yaml
  text: Make us glad for as many days as you have afflicted us[a], for as many years as we have seen trouble.
translation:
  language: hi
  text: जितने दिनों तक तूने हमें दुःख दिया और जितने वर्षों तक हमने विपत्ति देखी[a], उतने ही दिनों और वर्षों तक हमें आनंदित कर।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “बुराई” अथवा “दुःख।” इब्रानी शब्द संदर्भ के अनुसार विपत्ति, आपदा, या बुराई का अर्थ दे सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: שַׂמְּחֵנוּ
  choice: हमें आनन्दित कर
  rationale: पिएल आज्ञार्थक और प्रथम पुरुष बहुवचन प्रत्यय के कारण यह परमेश्वर से की गई कारणवाचक विनती है। यह हिंदी में स्वाभाविक और गरिमापूर्ण है।
- source_word: כִּימוֹת
  choice: जितने दिन ... उतने ही दिन
  rationale: כְּ के अनुरूपता/परिमाण-संबंधी भाव को हिंदी की ‘जितने…उतने’ रचना स्पष्ट और स्वाभाविक रूप से व्यक्त करती है।
- source_word: עִנִּיתָנוּ
  choice: तूने हमें दुःख दिया
  rationale: पिएल रूप यहाँ पीड़ित करने या दुःख देने का भाव रखता है। ‘दुःख दिया’ समानांतर ‘विपत्ति देखी’ के अनुकूल है और इसे केवल नम्र करने या बाहरी उत्पीड़न तक सीमित नहीं करता।
- source_word: שְׁנוֹת
  choice: जितने वर्ष ... उतने ही वर्ष
  rationale: यह पहले चरण के ‘दिन’ के समानांतर बहुवचन संधिबद्ध रूप है; हिंदी में दोहराई गई परिमाणात्मक रचना समानुपातिक विनती को सुरक्षित रखती है।
- source_word: רָאִינוּ
  choice: हमने ... देखी
  rationale: ‘देखी’ इब्रानी क्रिया का सीधा रूप बनाए रखती है, जबकि संदर्भ में उसका अर्थ अनुभव करना भी है।
- source_word: רָעָה
  choice: विपत्ति
  rationale: यहाँ शब्द नैतिक बुराई की अपेक्षा दुःखद प्रतिकूलता या संकट को दर्शाता है। ‘विपत्ति’ इस संदर्भ में सटीक, वर्तमान और गरिमापूर्ण है।
theological_decisions:
- issue: רָעָה का अर्थ और परमेश्वर के कार्य से उसका संबंध
  choice: अनुभव की गई प्रतिकूलता के अर्थ में ‘विपत्ति’
  alternative: बुराई; दुःख; संकट
  rationale: समानांतर पंक्ति में परमेश्वर द्वारा दिए गए दुःख का उल्लेख है। इसलिए यहाँ समुदाय द्वारा झेली गई विपत्ति अभिप्रेत है, न कि उनके द्वारा किया गया नैतिक पाप। यह विलाप की तीव्रता को घटाए बिना नैतिक अर्थ थोपने से बचता है।
translation_notes:
  register: आधुनिक मानक हिंदी; परमेश्वर के लिए एकवचन आत्मीय ‘तू’ भजन की सीधी प्रार्थना और इब्रानी एकवचन संबोधन को दर्शाता है। ‘जितने…उतने ही’ का समानांतर विन्यास मूल की समानुपातिक याचना को सहज हिंदी में व्यक्त करता है।
