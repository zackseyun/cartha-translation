source:
  edition: WLC
  text: וִ/יהִ֤י נֹ֤עַם אֲדֹנָ֥/י אֱלֹהֵ֗י/נוּ עָ֫לֵ֥י/נוּ וּ/מַעֲשֵׂ֣ה יָ֭דֵי/נוּ כּוֹנְנָ֥/ה עָלֵ֑י/נוּ וּֽ/מַעֲשֵׂ֥ה יָ֝דֵ֗י/נוּ כּוֹנְנֵֽ/הוּ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/090/017.yaml
  text: May the favor of the Lord our God be upon us[a], and establish the work of our hands upon us; yes[c][b], establish the work of our hands.
translation:
  language: hi
  text: 'प्रभु हमारे परमेश्वर की कृपा हम पर बनी रहे[a];


    हमारे हाथों के काम को हमारे लिए स्थिर कर[b]—


    हाँ, हमारे हाथों के काम को स्थिर कर[c]।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “मनोहरता,” “सौंदर्य,” “प्रसन्नता” अथवा “आनंद।”
    reason: lexical_alternative
  - marker: b
    text: 'शाब्दिक रूप से: “हमारे हाथों के काम को हम पर स्थिर कर।” यहाँ “हम पर” का आशय “हमारे लिए” या “हमारे हित में” हो सकता है।'
    reason: source_ambiguity
  - marker: c
    text: इब्रानी में इस विनती को बल देने के लिए “हमारे हाथों के काम” को दोहराया गया है।
    reason: literary_feature
lexical_decisions:
- source_word: וִיהִי
  choice: बनी रहे
  rationale: यहाँ जुसिव रूप प्रार्थना या अभिलाषा व्यक्त करता है। ‘बनी रहे’ आधुनिक हिन्दी में इस भाव को स्वाभाविक रूप से प्रकट करता है।
- source_word: נֹעַם
  choice: कृपा
  rationale: इस संज्ञा का अर्थ मनोहरता, प्रसन्नता या अनुग्रह हो सकता है। मनुष्य के श्रम पर परमेश्वर की आशीष माँगने के संदर्भ में ‘कृपा’ संबंधपरक अर्थ को स्पष्ट रखती है, जबकि अन्य अर्थ पाद-टिप्पणी में सुरक्षित हैं।
- source_word: אֲדֹנָי אֱלֹהֵינוּ
  choice: हमारे प्रभु परमेश्वर
  rationale: यह अनुवाद प्रभुता की उपाधि और ‘हमारे परमेश्वर’—दोनों तत्वों को स्वाभाविक तथा श्रद्धापूर्ण हिन्दी में बनाए रखता है।
- source_word: עָלֵינוּ
  choice: हम पर / हमारे लिए
  rationale: पहले प्रयोग में कृपा के लोगों पर रहने का भाव है। दूसरे प्रयोग में वही पूर्वसर्ग काम को उनके हित में स्थिर किए जाने का भाव दे सकता है; हिन्दी में ‘हमारे लिए’ अधिक स्पष्ट है, और शाब्दिक विकल्प पाद-टिप्पणी में दिया गया है।
- source_word: מַעֲשֵׂה יָדֵינוּ
  choice: हमारे हाथों का काम
  rationale: यह मानवीय श्रम और प्रयत्न का मूर्त इब्रानी बिंब है; हिन्दी में यह सहज और काव्यात्मक दोनों है।
- source_word: כּוֹנְנָה / כּוֹנְנֵהוּ
  choice: स्थिर कर
  rationale: כון का भाव किसी वस्तु को दृढ़, टिकाऊ या स्थापित करना है। ‘स्थिर कर’ मूल अर्थ को रखता है और ‘सफल कर’ जैसे अधिक व्याख्यात्मक अर्थ से बचता है।
theological_decisions:
- issue: परमेश्वर के लिए प्रयुक्त संयुक्त उपाधि
  choice: हमारे प्रभु परमेश्वर
  alternative: हमारे स्वामी परमेश्वर
  rationale: ‘प्रभु’ אֲדֹנָי की श्रद्धापूर्ण उपाधि को व्यक्त करता है और किसी संप्रदाय-विशेष की व्याख्या जोड़े बिना אֱלֹהֵינוּ के साथ स्वाभाविक हिन्दी बनाता है।
- issue: मानवीय श्रम के लिए प्रार्थना का आशय
  choice: काम को स्थिर करने की विनती
  alternative: काम को सफल करने की विनती
  rationale: मूल क्रिया कार्य को दृढ़ या टिकाऊ बनाने पर बल देती है। ‘सफल’ कहना संभावित परिणाम को मूल शब्द से अधिक निश्चित कर देता।
translation_notes:
  register: भाषा आधुनिक, श्रद्धापूर्ण और काव्यात्मक रखी गई है। ‘बनी रहे’ प्रार्थनात्मक भाव देता है; पंक्ति-विभाजन और पुनरुक्ति भजन की समानांतर काव्य-रचना को उभारते हैं।
