source:
  edition: WLC
  text: יְמֵֽי שְׁנוֹתֵ֨י/נוּ בָ/הֶ֥ם שִׁבְעִ֪ים שָׁנָ֡ה וְ/אִ֤ם בִּ/גְבוּרֹ֨ת שְׁמ֘וֹנִ֤ים שָׁנָ֗ה וְ֭/רָהְבָּ/ם עָמָ֣ל וָ/אָ֑וֶן כִּי גָ֥ז חִ֝֗ישׁ וַ/נָּעֻֽפָ/ה־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/090/010.yaml
  text: The days of our years are seventy years[a], or if by strength, eighty years; yet their pride is toil and trouble, for it is soon gone[b], and we fly away.
translation:
  language: hi
  text: हमारे जीवन के वर्ष सत्तर होते हैं, और यदि सामर्थ्य हो तो अस्सी वर्ष; फिर भी उनका गौरव[a] परिश्रम और दुःख है, क्योंकि वह शीघ्र बीत जाता है[b], और हम उड़ जाते हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “फिर भी उनका सर्वोत्तम भाग परिश्रम और दुःख है।” जिस इब्रानी शब्द का अनुवाद “उनका गौरव” किया गया है, वह उन वर्षों के सबसे प्रभावशाली या सबसे बलवान भाग को भी दर्शा सकता है।
    reason: lexical_alternative
  - marker: b
    text: या, “क्योंकि वह तेजी से निकल जाता है”; अथवा, “क्योंकि वह शीघ्र काट दिया जाता है।”
    reason: lexical_alternative
lexical_decisions:
- source_word: יְמֵי שְׁנוֹתֵינוּ
  choice: हमारी आयु के दिन
  rationale: यह हिब्रू काव्यात्मक मुहावरे को पर्याप्त रूप से बनाए रखते हुए आधुनिक हिन्दी में जीवनकाल का स्पष्ट बोध कराता है।
- source_word: בָהֶם שִׁבְעִים שָׁנָה
  choice: सत्तर वर्ष होते हैं
  rationale: בָהֶם यहाँ कुल अवधि बताने वाले मुहावरे का अंग है; हिन्दी में ‘होते हैं’ स्वाभाविक विधेय है।
- source_word: וְאִם בִּגְבוּרֹת
  choice: और यदि बल हो तो
  rationale: यह असाधारण शारीरिक सामर्थ्य के कारण आयु के बढ़ने की सशर्त संभावना को सुरक्षित रखता है।
- source_word: וְרָהְבָּם
  choice: उनका गौरव
  rationale: רֹהַב गर्व, प्रभावशालीपन, या जीवन-वर्षों के सर्वोत्तम/सबसे बलवान अंश का संकेत दे सकता है। ‘गौरव’ मूल की विडंबना और अर्थगत खुलापन बनाए रखता है।
- source_word: עָמָל וָאָוֶן
  choice: परिश्रम और दुःख
  rationale: इस जीवनकाल-संदर्भ में शब्दयुग्म कठिन श्रम और उससे जुड़े क्लेश को दर्शाता है; यहाँ אָוֶן को नैतिक दुष्टता के बजाय दुःख के अर्थ में लेना अधिक संगत है।
- source_word: כִּי גָז חִישׁ
  choice: क्योंकि वह शीघ्र बीत जाता है
  rationale: גָז के ‘बीत जाने’ और संभावित ‘शीघ्र काट दिए जाने’ दोनों भावों में से मुख्य प्रवाह को स्वाभाविक हिन्दी में व्यक्त किया गया है, जबकि वैकल्पिक अर्थ पादटिप्पणी में रखा गया है।
- source_word: וַנָּעֻפָה
  choice: और हम उड़ जाते हैं
  rationale: यह क्रिया के सजीव उड़ जाने वाले बिंब और प्रथम पुरुष बहुवचन को सुरक्षित रखता है।
theological_decisions:
- issue: सत्तर या अस्सी वर्ष का कथन
  choice: इसे मानवीय जीवन की सामान्य और बल होने पर असाधारण अवधि के काव्यात्मक वर्णन के रूप में अनूदित किया गया है।
  alternative: इसे प्रत्येक मनुष्य के लिए ईश्वर द्वारा तय की गई अनिवार्य आयु-सीमा के रूप में स्पष्ट करना।
  rationale: हिब्रू पाठ अनुभवजन्य काव्यात्मक कथन देता है; वह स्वयं इसे सार्वभौमिक विधिक सीमा नहीं कहता, इसलिए अनुवाद में ऐसा सिद्धान्त नहीं जोड़ा गया।
- issue: כִּי גָז חִישׁ में कर्ता/संदर्भ
  choice: ‘वह’ रखा गया है, जो निकटवर्ती ‘गौरव’ या व्यापक जीवनकाल की क्षणभंगुरता से जुड़ सकता है।
  alternative: स्पष्ट रूप से ‘जीवन शीघ्र बीत जाता है’ कहना।
  rationale: स्रोत में निहित संदर्भगत लचीलेपन को अनावश्यक रूप से सीमित नहीं किया गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और काव्यात्मक रखी गई है। ‘आयु के दिन’ और ‘उड़ जाते हैं’ जैसे पद मूल के बिंबों को बचाते हैं, जबकि वाक्य-संरचना सामान्य हिन्दी पाठक के लिए सहज है। अंग्रेज़ी परामर्श-पाठ में [a] का चिह्न ‘seventy years’ के बाद था, पर उसकी पादटिप्पणी וְרָהְבָּם (‘उनका गौरव’) से संबंधित है; इसलिए हिन्दी मुख्य पाठ में चिह्न को उसी पद के बाद रखा गया है।
