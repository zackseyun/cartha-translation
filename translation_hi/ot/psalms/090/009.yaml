  text: क्योंकि हमारे सब दिन तेरे प्रकोप में बीत जाते हैं; हम अपने वर्ष एक आह[a] के समान समाप्त कर देते हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “बुदबुदाहट” अथवा “कराह।” इब्रानी शब्द किसी धीमी ध्वनि को दर्शाता है; प्रसंग में जीवन की क्षणभंगुरता उभारने के लिए मुख्य पाठ में “आह” रखा गया है।
    reason: lexical_alternative
lexical_decisions:
