- source_word: פָּנוּ
  choice: बीत जाते हैं
  rationale: समय के संदर्भ में פנה का अर्थ दिनों का मुड़कर निकल जाना अथवा बीत जाना है; यह आधुनिक हिंदी में स्वाभाविक है।
- source_word: בְעֶבְרָתֶךָ
  choice: तेरे प्रकोप में
  rationale: עֶבְרָה तीव्र और उमड़ते हुए क्रोध को व्यक्त करता है; 'प्रकोप' उसकी गंभीरता बनाए रखता है और 'में' ב की परिस्थिति अथवा क्षेत्र-संबंधी शक्ति को दर्शाता है।
- source_word: כִּלִּינוּ
  choice: हम ... समाप्त कर देते हैं
  rationale: Piel रूप यहाँ वर्षों को पूरा करने अथवा अंत तक पहुँचा देने का भाव देता है।
- source_word: שָׁנֵינוּ
  choice: अपने वर्ष
  rationale: मूल के बहुवचन को बनाए रखते हुए हिंदी में स्वाभाविक स्वामित्व व्यक्त करता है।
- source_word: כְמוֹ
  choice: के समान
  rationale: सरल तुलनात्मक अर्थ को गरिमापूर्ण और सहज हिंदी में व्यक्त करता है।
- source_word: הֶגֶה
  choice: एक आह
  rationale: यह शब्द धीमी ध्वनि—जैसे बुदबुदाहट, कराह या आह—को सूचित कर सकता है। प्रसंग में 'आह' जीवन की क्षणभंगुरता और श्वास-जैसी लघुता को स्वाभाविक रूप से व्यक्त करती है; अन्य संभावनाएँ पादटिप्पणी में रखी गई हैं।
theological_decisions:
- issue: परमेश्वर के क्रोध की शब्दावली
  choice: तेरे प्रकोप में
  alternative: तेरे क्रोध में; तेरे रोष में
  rationale: पद मानव जीवन के बीतने को स्पष्टतः परमेश्वर के עֶבְרָה के संदर्भ में रखता है। 'प्रकोप' मूल की तीव्रता और धर्मवैचारिक तनाव को नरम किए बिना बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिंदी में काव्यात्मक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध शैली। परमेश्वर को संबोधन में भजन की प्रत्यक्षता बनाए रखने के लिए 'तेरे' रखा गया है।
