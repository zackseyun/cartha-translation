  text: Teach us to number our days[a], that we may gain a heart of wisdom.
translation:
  language: hi
  text: हमें अपने दिन गिनना सिखा[a], ताकि हम बुद्धिमान हृदय पाएँ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या अधिक शाब्दिक रूप में, “हमें इस प्रकार अपने दिन गिनना सिखा, और हम बुद्धि का हृदय लाएँ।” अंतिम वाक्यांश का इब्रानी पाठ कठिन है; बहुत-से लोग इसका अर्थ “ताकि हम बुद्धिमान हृदय पाएँ” समझते हैं।
    reason: alternative_reading
lexical_decisions:
- source_word: לִמְנוֹת
  choice: गिनना
  rationale: क्रिया מנה का अर्थ गिनना या संख्या निर्धारित करना है। ‘गिनना’ आधुनिक हिन्दी में स्वाभाविक है और जीवन के सीमित दिनों की ठोस उपमा बनाए रखता है।
- source_word: יָמֵינוּ
  choice: अपने दिन
  rationale: मूल अर्थ ‘हमारे दिन’ है। ‘हमें अपने दिन गिनना’ हिन्दी में अधिक स्वाभाविक ढंग से वही प्रथम पुरुष बहुवचन संबंध व्यक्त करता है।
- source_word: כֵּן
  choice: मुख्य पाठ में अलग शब्द के रूप में व्यक्त नहीं
  rationale: כֵּן का मूल अर्थ ‘इस प्रकार/ऐसे’ है, पर इस संक्षिप्त वाक्य-विन्यास में उसका पृथक हिन्दी अनुवाद अस्वाभाविक और अर्थ को अनावश्यक रूप से निश्चित कर सकता है। उसका अधिक शाब्दिक रूप पादटिप्पणी में दिया गया है।
- source_word: הוֹדַע
  choice: सिखा
  rationale: यह ידע का हिफ़ील आज्ञार्थक रूप है—‘जानने दे/जता’। प्रार्थना के संदर्भ में ‘सिखा’ उसका स्वाभाविक, कारणवाचक हिन्दी रूप है।
- source_word: וְנָבִא
  choice: ताकि हम … पाएँ
  rationale: इस कठिन पद का शाब्दिक अर्थ ‘और हम … लाएँगे/लाएँ’ हो सकता है। संदर्भ में इसे बुद्धि प्राप्त करने के परिणाम या उद्देश्य के रूप में समझना व्यापक रूप से संभव है; मूल की कठिनाई पादटिप्पणी में सुरक्षित रखी गई है।
- source_word: לְבַב חָכְמָה
  choice: बुद्धिमान हृदय
  rationale: शाब्दिक रचना ‘बुद्धि का हृदय’ है, जो हिन्दी में अस्वाभाविक है। ‘बुद्धिमान हृदय’ हृदय को अंतर्मन और विवेक के केंद्र के रूप में रखते हुए अर्थ स्पष्ट करता है।
theological_decisions:
- issue: दूसरे चरण में उद्देश्य/परिणाम का संबंध
  choice: ‘ताकि हम बुद्धिमान हृदय पाएँ’—परमेश्वर से जीवन की सीमित अवधि समझाने की प्रार्थना, जिसके फलस्वरूप प्रार्थी बुद्धि प्राप्त करें।
  alternative: ‘इस प्रकार हमें अपने दिन गिनना जता, और हम बुद्धि का हृदय लाएँगे।’
  rationale: इब्रानी वाक्य संक्षिप्त और व्याकरण की दृष्टि से कठिन है। मुख्य पाठ संदर्भानुकूल और स्वाभाविक अर्थ देता है, जबकि पादटिप्पणी अधिक शाब्दिक संभावना को सुरक्षित रखती है और तनाव को छिपाती नहीं।
translation_notes:
  register: आधुनिक, सरल और प्रार्थनात्मक मानक हिन्दी। एकवचन संबोधन ‘सिखा’ भजन में परमेश्वर से सीधे निवेदन के अनुरूप है। ‘बुद्धिमान हृदय’ सामान्य पाठक के लिए सहज है और मूल के हृदय-केंद्रित चित्र को बनाए रखता है।
