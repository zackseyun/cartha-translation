  text: יֵרָאֶ֣ה אֶל עֲבָדֶ֣י/ךָ פָעֳלֶ֑/ךָ וַ֝/הֲדָרְ/ךָ֗ עַל בְּנֵי/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/090/016.yaml
  text: Let your work appear to your servants, and your splendor upon their children.
translation:
  language: hi
  text: तेरा काम तेरे सेवकों को दिखाई दे, और तेरा वैभव उनकी सन्तानों पर प्रकट हो।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פָעֳלֶךָ
  choice: तेरा काम
  rationale: यह संज्ञा परमेश्वर के कार्य या किए हुए काम को दर्शाती है; सामान्य और स्वाभाविक हिन्दी में ‘काम’ मूल की व्यापकता बनाए रखता है।
- source_word: הֲדָרְךָ
  choice: तेरा वैभव
  rationale: הָדָר महिमा, प्रताप और शोभा का भाव रखता है; ‘वैभव’ यहाँ गरिमापूर्ण तथा सुबोध समतुल्य है।
- source_word: בְּנֵיהֶם
  choice: उनकी सन्तानों
  rationale: शाब्दिक अर्थ ‘उनके पुत्र’ है, पर इस काव्यात्मक सन्दर्भ में वंशज या बच्चे अभिप्रेत हो सकते हैं; ‘सन्तानों’ उस सामूहिक अर्थ को स्वाभाविक ढंग से व्यक्त करता है।
theological_decisions:
- issue: परमेश्वर के वैभव का अगली पीढ़ी पर होना
  choice: उनकी सन्तानों पर प्रकट हो
  alternative: उनकी सन्तानों पर हो
  rationale: इब्रानी दूसरे खंड में क्रिया को लोप करके पहले खंड के יֵרָאֶה से अर्थ ग्रहण कराता है। हिन्दी में ‘प्रकट हो’ जोड़ने से समानांतरता स्पष्ट होती है, जबकि ‘पर’ को बनाए रखने से मूल की छवि सुरक्षित रहती है।
translation_notes:
  register: आधुनिक मानक हिन्दी; प्रार्थनात्मक, काव्यात्मक और गरिमापूर्ण शैली। एकवचन अनौपचारिक-भक्तिपरक संबोधन ‘तेरा’ मूल के एकवचन प्रत्यय को दर्शाता है।
