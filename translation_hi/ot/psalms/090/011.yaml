source:
  edition: WLC
  text: מִֽי י֭וֹדֵעַ עֹ֣ז אַפֶּ֑/ךָ וּ֝/כְ/יִרְאָתְ/ךָ֗ עֶבְרָתֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/090/011.yaml
  text: Who knows the power of your anger[a], and your wrath according to the fear due to you?
translation:
  language: hi
  text: आपके क्रोध की शक्ति और आपके प्रति होने वाले भय के अनुसार आपके प्रकोप को कौन जानता है[a]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “और आपका प्रकोप आपके प्रति भय के अनुसार है,” अथवा, “जैसा आपके प्रति भय, वैसा ही आपका प्रकोप।” इब्रानी अभिव्यक्ति संक्षिप्त है और उसे एक से अधिक प्रकार से समझा जा सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: מִי
  choice: कौन
  rationale: यह प्रश्नवाचक सर्वनाम आलंकारिक प्रश्न आरम्भ करता है; ‘कौन’ उसका सीधा और स्वाभाविक हिन्दी रूप है।
- source_word: יוֹדֵעַ
  choice: जानता है
  rationale: ידע का कृदन्त जानने या पहचानने का भाव देता है। ‘जानता है’ मूल अर्थ और आलंकारिक प्रश्न की शक्ति बनाए रखता है।
- source_word: עֹז
  choice: शक्ति
  rationale: עֹז सामर्थ्य या प्रबलता का सूचक है। ‘क्रोध की शक्ति’ उसके प्रभावी और भयावह सामर्थ्य को व्यक्त करती है।
- source_word: אַפֶּךָ
  choice: आपके क्रोध
  rationale: אַף का मूल सम्बन्ध नाक से है, पर यहाँ यह स्थापित मुहावरे में क्रोध का अर्थ देता है; शाब्दिक देहगत चित्र हिन्दी में अर्थ को धुँधला करता।
- source_word: וּכְיִרְאָתְךָ
  choice: और ... उस भय के अनुसार, जो आपके प्रति होना चाहिए
  rationale: संयोजक और तुलनात्मक उपसर्ग सहित यह संक्षिप्त पद ‘आपका भय/आपके प्रति भय’ और अनुरूपता का भाव देता है। हिन्दी में यह रूप अपेक्षित श्रद्धापूर्ण भय को स्पष्ट करता है, जबकि तुलना को बनाए रखता है।
- source_word: עֶבְרָתֶךָ
  choice: आपके प्रकोप
  rationale: עֶבְרָה तीव्र क्रोध या कोप को दर्शाता है। ‘प्रकोप’ ऊँचे काव्यात्मक स्वर को बनाए रखता और पहले प्रयुक्त ‘क्रोध’ से शब्दगत भेद करता है।
theological_decisions:
- issue: וּכְיִרְאָתְךָ עֶבְרָתֶךָ में परमेश्वर के प्रकोप और भय का सम्बन्ध
  choice: आपके प्रकोप को उस भय के अनुसार, जो आपके प्रति होना चाहिए
  alternative: और आपका प्रकोप आपके भय के अनुसार है; अथवा, जैसा आपका भय, वैसा ही आपका प्रकोप
  rationale: इब्रानी पद अत्यन्त संक्षिप्त है और उसकी वाक्यगत संरचना एक से अधिक प्रकार से समझी जा सकती है। मुख्य पाठ ‘जानता है’ को दोनों कर्मों से जोड़ता है और प्रकोप तथा परमेश्वर के प्रति उचित भय के बीच अनुरूपता रखता है; पाद-टिप्पणी वैकल्पिक पाठों को खुला रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में आदरार्थक ‘आप’ रखा गया है। भाषा काव्यात्मक और गरिमापूर्ण है, पर सामान्य पाठक के लिए बोधगम्य है। ‘क्रोध’ और ‘प्रकोप’ मूल के दो निकटार्थक शब्दों का भेद बनाए रखते हैं।
