base_translation:
  language: en
  yaml_path: translation/ot/psalms/090/000.yaml
  text: A prayer of Moses[a], the man of God. Lord[b], you have been a dwelling place for us from generation to generation.
translation:
  language: hi
  text: 'परमेश्वर के जन मूसा की प्रार्थना।[a]


    हे प्रभु, पीढ़ी-दर-पीढ़ी आप ही हमारे निवास-स्थान रहे हैं।[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शीर्षक में इसका अनुवाद “मूसा द्वारा रचित प्रार्थना” या “मूसा के लिए प्रार्थना” भी हो सकता है; इब्रानी पूर्वसर्ग रचना, संबंध या समर्पण दर्शा सकता है।
    reason: alternative_reading
  - marker: b
    text: “निवास-स्थान” का अनुवाद “आश्रय” या “वासस्थान” भी किया जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּפִלָּה
  choice: प्रार्थना
  rationale: शीर्षक में प्रयुक्त इब्रानी संज्ञा का सीधा और स्वाभाविक हिन्दी रूप।
- source_word: אִישׁ הָאֱלֹהִים
  choice: परमेश्वर के जन
  rationale: मूसा के सम्मानसूचक वर्णन का पारंपरिक, संक्षिप्त और सहज हिन्दी रूप; इसका अर्थ परमेश्वर से विशेष रूप से संबंधित व्यक्ति है।
- source_word: אֲדֹנָי
  choice: हे प्रभु
  rationale: यहाँ संबोधन है; 'हे' हिन्दी में प्रार्थनात्मक संबोधन को स्पष्ट करता है।
- source_word: מָעוֹן
  choice: निवास-स्थान
  rationale: मूल अर्थ 'निवास/वासस्थान' को बनाए रखता है और परमेश्वर को अपनी प्रजा के स्थायी आश्रय के रूप में व्यक्त करता है।
- source_word: בְּדֹר וָדֹר
  choice: पीढ़ी-दर-पीढ़ी
  rationale: इब्रानी पुनरुक्त अभिव्यक्ति का स्वाभाविक हिन्दी समतुल्य, जिसका आशय हर पीढ़ी में निरंतरता है।
theological_decisions:
- issue: शीर्षक में לְמֹשֶׁה का संबंध
  choice: मूसा की प्रार्थना
  alternative: मूसा द्वारा रचित प्रार्थना; मूसा के लिए प्रार्थना
  rationale: לְ रचना, संबंध या समर्पण सूचित कर सकता है। मुख्य पाठ में स्वाभाविक पारंपरिक रूप रखा गया और अस्पष्टता पादटिप्पणी में सुरक्षित की गई।
- issue: परमेश्वर को מָעוֹן कहना
  choice: हमारे निवास-स्थान
  alternative: हमारा आश्रय; हमारा वासस्थान
  rationale: स्थान-संबंधी रूपक को सीधे बनाए रखा गया है; इसे केवल 'रक्षक' जैसे अधिक व्याख्यात्मक अर्थ में सीमित नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी का प्रार्थनात्मक और गरिमापूर्ण रूप अपनाया गया है। परमेश्वर के लिए आदरसूचक 'आप' रखा गया है। शीर्षक और मुख्य वचन को अलग पंक्तियों में रखा गया है, तथा सभी पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित हैं।
