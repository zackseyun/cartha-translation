  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: כִּ֤י אֶ֪לֶף שָׁנִ֡ים בְּֽ/עֵינֶ֗י/ךָ כְּ/י֣וֹם אֶ֭תְמוֹל כִּ֣י יַעֲבֹ֑ר וְ/אַשְׁמוּרָ֥ה בַ/לָּֽיְלָה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/090/004.yaml
  text: For a thousand years in your sight are like yesterday when it is past[c][b][a], or like a watch in the night.
translation:
  language: hi
  text: क्योंकि आपकी दृष्टि में हज़ार वर्ष बीते हुए कल के समान हैं[a], और रात के एक पहर के समान।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “कल के उस दिन के समान, जब वह बीत जाता है।” इब्रानी खंड में थोड़ा भिन्न कालगत भाव संभव है।
    reason: lexical_alternative
  - marker: b
    text: “पहर” रात का वह निश्चित भाग था जिसमें पहरेदार निगरानी करते थे।
    reason: cultural_note
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले कथन का आधार या स्पष्टीकरण प्रस्तुत करता है; हिंदी में ‘क्योंकि’ इस संबंध को स्वाभाविक रूप से व्यक्त करता है।
- source_word: אֶלֶף שָׁנִים
  choice: हज़ार वर्ष
  rationale: मूल की निश्चित संख्यात्मक अभिव्यक्ति को सीधे बनाए रखा गया है।
- source_word: בְּעֵינֶיךָ
  choice: आपकी दृष्टि में
  rationale: शाब्दिक अर्थ ‘आपकी आँखों में’ है, पर यह इब्रानी मुहावरा किसी के परिप्रेक्ष्य को दर्शाता है; ‘आपकी दृष्टि में’ रूपक को बनाए रखते हुए स्वाभाविक हिंदी है।
- source_word: כְּיוֹם אֶתְמוֹל
  choice: बीते हुए कल के समान
  rationale: यह निकट अतीत के उस दिन की छवि देता है जो अब चला गया है। हिंदी में यह रूप संक्षिप्त है और ‘कल’ की भावी अर्थ-संभावना को ‘बीते हुए’ से स्पष्ट करता है।
- source_word: כִּי יַעֲבֹר
  choice: बीते हुए
  rationale: यह खंड ‘कल’ को ऐसे दिन के रूप में विशेषित करता है जो बीत चुका है। क्रिया और संयोजक में उपस्थित हल्की कालगत अस्पष्टता को वैकल्पिक पाठ के रूप में पादटिप्पणी में रखा गया है।
- source_word: וְאַשְׁמוּרָה
  choice: और ... एक पहर
  rationale: वाव दूसरे समानांतर उपमान को जोड़ता है। ‘और’ मूल संयोजक को बनाए रखता है, जबकि हिंदी में दो समान उपमानों का संबंध स्पष्ट रहता है।
- source_word: אַשְׁמוּרָה בַלָּיְלָה
  choice: रात का एक पहर
  rationale: यह रात में पहरा देने के लिए बाँटी गई अवधि को दर्शाता है। ‘रात का एक पहर’ स्वाभाविक और संक्षिप्त हिंदी है; ऐतिहासिक अर्थ पादटिप्पणी में स्पष्ट किया गया है।
theological_decisions:
- issue: समय के संबंध में परमेश्वर की दृष्टि का मानवीय रूपक
  choice: ‘आपकी दृष्टि में’ और दोनों समय-संबंधी उपमानों को बिना दार्शनिक विस्तार के बनाए रखना
  alternative: ‘आपके सामने हज़ार वर्ष कुछ भी नहीं’ या ‘आपको हज़ार वर्ष कल जैसे लगते हैं’
  rationale: पद परमेश्वर और मनुष्य के समय-बोध का काव्यात्मक विरोध प्रस्तुत करता है। अनुवाद बाद की ‘कालातीतता’ संबंधी दार्शनिक धारणाएँ जोड़े बिना मूल रूपक और तनाव को सुरक्षित रखता है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण मानक हिंदी अपनाई गई है। परमेश्वर को संबोधन में आदरसूचक ‘आप’ रखा गया है। काव्यात्मक समानांतरता बनाए रखने के लिए दोनों उपमानों को संतुलित ढंग से प्रस्तुत किया गया है।
