  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: בְּ/טֶ֤רֶם הָ֘רִ֤ים יֻלָּ֗דוּ וַ/תְּח֣וֹלֵֽל אֶ֣רֶץ וְ/תֵבֵ֑ל וּֽ/מֵ/עוֹלָ֥ם עַד ע֝וֹלָ֗ם אַתָּ֥ה אֵֽל׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/090/002.yaml
  text: Before the mountains were born[a], and you brought forth the earth and the world, from everlasting to everlasting you are God.
translation:
  language: hi
  text: पहाड़ों के जन्म लेने और धरती तथा जगत को आपके जन्म देने से पहले, अनादिकाल से अनन्तकाल तक आप परमेश्वर हैं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּטֶרֶם
  choice: से पहले
  rationale: यह सृष्टि के अस्तित्व में आने से पहले के समय को सूचित करता है; संयुक्त वाक्यांश के अंत में ‘से पहले’ रखना स्वाभाविक हिन्दी है और दोनों क्रियाओं पर लागू होता है।
- source_word: הָרִים
  choice: पहाड़ों
  rationale: सप्रत्यय बहुवचन संज्ञा का स्वाभाविक हिन्दी रूप; यह आदिकालीन सृष्टि की काव्यात्मक छवि बनाए रखता है।
- source_word: יֻלָּדוּ
  choice: जन्म लेने
  rationale: ילד के कर्मवाच्य रूप की जन्म-संबंधी छवि को सीधे और स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: וַתְּחוֹלֵל
  choice: आपके ... जन्म देने
  rationale: क्रिया में प्रसव अथवा जन्म देने की छवि है। यह चयन उस काव्यात्मक छवि को मिटाकर केवल ‘बनाने’ या ‘रचने’ तक सीमित नहीं करता।
- source_word: אֶרֶץ
  choice: धरती
  rationale: תֵבֵל के समानांतर और विश्वव्यापी सृष्टि-संदर्भ में ‘धरती’ स्थानीय ‘देश’ या ‘भूमि’ से अधिक उपयुक्त है।
- source_word: וְתֵבֵל
  choice: और जगत
  rationale: यह व्यवस्थित अथवा आबाद संसार का संकेत देता है; ‘जगत’ संक्षिप्त, काव्यात्मक और आधुनिक हिन्दी में बोधगम्य है।
- source_word: וּמֵעוֹלָם עַד עוֹלָם
  choice: अनादिकाल से अनन्तकाल तक
  rationale: यह इब्रानी मुहावरे की दोनों दिशाओं में असीम अवधि को स्पष्ट और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: אַתָּה
  choice: आप ही
  rationale: स्पष्ट सर्वनाम का बल ‘ही’ से सुरक्षित रखा गया है; ‘आप’ आधुनिक हिन्दी में आदरपूर्ण प्रत्यक्ष सम्बोधन है।
- source_word: אֵל
  choice: परमेश्वर
  rationale: यहाँ אֵל ईश्वर के पदनाम के रूप में प्रयुक्त है; ‘परमेश्वर’ स्पष्ट, गरिमापूर्ण और प्रसंगानुकूल है।
theological_decisions:
- issue: सृष्टि के वर्णन में जन्म और प्रसव की मानवीय छवि
  choice: पहाड़ों के लिए ‘जन्म लेने’ और धरती तथा जगत के लिए ‘जन्म देने’ की छवि बनाए रखी गई।
  alternative: चित्र को समतल करके ‘रचने’, ‘बनाने’ या ‘उत्पन्न करने’ का प्रयोग करना।
  rationale: इब्रानी पद सृष्टि की उत्पत्ति और उससे पहले परमेश्वर के अस्तित्व को जन्म-संबंधी काव्यात्मक भाषा में रखता है। इसे बनाए रखना किसी अतिरिक्त सिद्धान्त का दावा किए बिना मूल की काव्यात्मक शक्ति सुरक्षित करता है।
- issue: परमेश्वर की शाश्वतता
  choice: अनादिकाल से अनन्तकाल तक आप ही परमेश्वर हैं
  alternative: युग से युग तक आप परमेश्वर हैं
  rationale: चुना हुआ रूप भूत और भविष्य दोनों दिशाओं में असीम अवधि को व्यक्त करता है और इब्रानी मुहावरे को दार्शनिक रूप से आवश्यकता से अधिक परिभाषित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, आदरपूर्ण और काव्यात्मक रखी गई है। परमेश्वर के लिए ‘आप’ का प्रयोग सामान्य पाठक के लिए स्वाभाविक सम्मान व्यक्त करता है। जन्म की असामान्य परन्तु मूलभूत काव्य-छवि मुख्य पाठ में सुरक्षित है और अधिक सामान्य विकल्प पादटिप्पणी में दिया गया है।
