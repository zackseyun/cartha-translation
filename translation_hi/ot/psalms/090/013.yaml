source:
  edition: WLC
  text: שׁוּבָ֣/ה יְ֭הוָה עַד מָתָ֑י וְ֝/הִנָּחֵ֗ם עַל עֲבָדֶֽי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/090/013.yaml
  text: Return[a], O Yahweh—how long? And have compassion on your servants.
translation:
  language: hi
  text: लौट आ, हे याहवे—कब तक? अपने सेवकों पर दया कर[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अपने सेवकों के विषय में मन बदल।”
    reason: lexical_alternative
lexical_decisions:
- source_word: שׁוּבָה
  choice: लौट आ
  rationale: आज्ञार्थक क्रिया की सीधी संबंधात्मक पुकार को बनाए रखता है; यहाँ ‘मन बदल’ कहने से अगली क्रिया का भाव समय से पहले इसमें आ जाता।
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत नाम का देवनागरी लिप्यंतरण है, न कि उसके स्थान पर कोई उपाधि।
- source_word: עַד מָתָי
  choice: कब तक?
  rationale: विलाप की इब्रानी अभिव्यक्ति का स्वाभाविक और तात्कालिक हिन्दी रूप।
- source_word: וְהִנָּחֵם
  choice: दया कर
  rationale: निफ़ाल आज्ञार्थक रूप में करुणा से द्रवित होने और अपना रुख बदलने, दोनों की छाया हो सकती है। मुख्य पाठ में ‘दया कर’ प्रार्थना के भाव के अनुकूल और सहज है; रुख बदलने की सम्भावना पाद-टिप्पणी में रखी गई है।
- source_word: עַל
  choice: पर
  rationale: दया के लक्ष्य को चिह्नित करता है और हिन्दी में ‘सेवकों पर दया कर’ स्वाभाविक प्रयोग है।
- source_word: עֲבָדֶיךָ
  choice: अपने सेवकों
  rationale: परमेश्वर को सम्बोधित प्रार्थना में ‘सेवक’ प्रसंगानुकूल है और समर्पण तथा अधीनता का भाव बनाए रखता है।
theological_decisions:
- issue: परमेश्वर के लिए נחם का अनुवाद
  choice: दया कर
  alternative: अपने सेवकों के विषय में मन बदल
  rationale: ‘पछता’ आधुनिक हिन्दी में नैतिक भूल स्वीकार करने का अर्थ दे सकता है, जो इब्रानी का आवश्यक आशय नहीं है। ‘दया कर’ करुणा का पक्ष व्यक्त करता है, जबकि पाद-टिप्पणी रुख बदलने की वास्तविक अर्थ-सम्भावना को खुला रखती है।
translation_notes:
  register: भाषा आधुनिक, संक्षिप्त और प्रार्थनात्मक रखी गई है। ‘हे’ संबोधन को गरिमा और विलाप की सीधी पुकार के लिए रखा गया है।
