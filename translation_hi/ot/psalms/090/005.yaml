  - marker: b
    text: या, “वे नींद के समान हैं।” इब्रानी पंक्ति अत्यंत संक्षिप्त है।
    reason: source_ambiguity
lexical_decisions:
- source_word: זְרַמְתָּם
  choice: तू उन्हें बहा ले जाता है
  rationale: क्रिया זָרַם किसी तेज बहाव में बहा ले जाने का बिंब देती है। यह हिंदी अभिव्यक्ति जल-प्रवाह की छवि और मनुष्य के अचानक मिट जाने—दोनों को स्वाभाविक रूप से रखती है।
- source_word: שֵׁנָה
  choice: स्वप्न के समान
  rationale: मूल संज्ञा का सामान्य अर्थ ‘नींद’ है, पर अत्यंत संक्षिप्त काव्य-वाक्य में क्षणभंगुरता का भाव स्वाभाविक हिंदी में ‘स्वप्न के समान’ से स्पष्ट होता है। अधिक शाब्दिक विकल्प पादटिप्पणी में रखा गया है।
- source_word: יִהְיוּ
  choice: वे ... हैं / होते हैं
  rationale: यह अपूर्ण रूप काव्य में सामान्य या वर्णनात्मक वर्तमान व्यक्त कर सकता है। पहले खंड में ‘हैं’ और सुबह के दृश्य में ‘होते हैं’ स्वाभाविक हिंदी देते हैं।
- source_word: בַּבֹּקֶר
  choice: सुबह
  rationale: यह समय-सूचक पद घास के नए उगने और शीघ्र मुरझाने के अगले पद के चित्र को आरंभ करता है।
- source_word: כֶּחָצִיר
  choice: घास के समान
  rationale: חָצִיר यहाँ क्षणभंगुर वनस्पति का सामान्य काव्य-बिंब है; ‘घास’ स्पष्ट और प्रचलित हिंदी विकल्प है।
- source_word: יַחֲלֹף
  choice: नई उगती
  rationale: חלף संदर्भानुसार बदलने, फिर से आने या नया निकलने का अर्थ दे सकता है। पद 6 में सुबह घास का उगना/फलना और शाम को मुरझाना इस स्थान पर नवीनीकरण या अंकुरण का अर्थ समर्थित करता है; एकवचन क्रिया व्याकरणतः ‘घास’ से मेल खाती है।
