translation:
  language: hi
  text: तू उन्हें बहा ले जाता है[a]; वे स्वप्न के समान हैं[b]। सुबह वे उस घास के समान हैं जो नए सिरे से उगती है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तू उन्हें बाढ़ में बहा ले जाता है।”
