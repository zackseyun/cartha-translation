- source_word: יְמוֹלֵל
  choice: मुरझाकर
  rationale: इस क्रिया का अर्थ पौधे का मुरझाना या काटा जाना हो सकता है। “मुरझाकर” किसी बाहरी कर्ता को अनावश्यक रूप से निश्चित किए बिना सूखने की अगली अवस्था से सहज रूप से जुड़ता है।
- source_word: וְיָבֵשׁ
  choice: सूख जाता है
