review_pass:
  verdict: revise
  source_fidelity: 'The draft accurately represents the Hebrew parallelism: God has placed the community''s iniquities before himself, including what is concealed, under the illuminating scrutiny of his face. ‘अधर्मों’ suitably conveys the morally weighted plural עֲוֺנֹתֵינוּ, and ‘छिपे पापों’ is a defensible contextual clarification of עֲלֻמֵנוּ.'
  naturalness: The elevated poetic two-line structure is natural for a psalm. However, ‘अपने सामने’ and especially ‘अपने मुख के’ can create avoidable Hindi reflexive-reference ambiguity in a verse where God is the addressee but not restated in the second line. The direct second-person possessive ‘तेरे’ is clearer and retains the Hebrew address.
  terminology: ‘अधर्म’ and ‘पाप’ maintain the verse’s moral register without importing a denominational interpretation. ‘मुख के प्रकाश’ preserves the concrete Hebrew image of the divine face; the note appropriately explains its force as imagery rather than replacing it with ‘उपस्थिति’ in the text.
  issues:
  - severity: low
    issue: Potentially ambiguous reflexive possessives
    rationale: In ‘अपने सामने’ and ‘अपने मुख के प्रकाश में,’ अपना can be processed with an uncertain antecedent in the elliptical poetic second line. Hebrew explicitly uses second-person suffixes (‘your’). Replacing these with ‘तेरे’ makes the divine addressee unambiguous and is fully source-faithful.
