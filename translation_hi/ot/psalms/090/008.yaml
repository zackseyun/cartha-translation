  text: You have set our iniquities before you[b][a], our hidden sins in the light of your face.
translation:
  language: hi
  text: 'तूने हमारे अधर्मों को तेरे सामने रख दिया है,

    हमारे छिपे पापों को तेरे मुख के प्रकाश में।[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘तेरे मुख के प्रकाश में’ परमेश्वर की उपस्थिति में पूरी तरह उजागर होने की काव्यात्मक छवि है।
    reason: lexical_alternative
lexical_decisions:
- source_word: שת (שִׁית)
  choice: रख दिया है
  rationale: यह क्रिया किसी वस्तु को रखने या सामने स्थापित करने का बोध देती है। पूर्ण रूप को हिन्दी में वर्तमान से जुड़ी पूर्ण की गई कार्रवाई के रूप में व्यक्त किया गया है।
- source_word: עֲוֺנֹתֵינוּ
  choice: हमारे अधर्मों
  rationale: עָוֹן में दुष्कर्म, पाप और दोष का नैतिक भार है। ‘अधर्मों’ बहुवचन और गंभीरता दोनों बनाए रखता है।
- source_word: לְנֶגְדֶּךָ
  choice: अपने सामने
  rationale: यह सीधा अर्थ ‘तेरे सामने’ है; हिन्दी में कर्ता परमेश्वर होने के कारण ‘अपने सामने’ स्वाभाविक है और प्रत्यक्ष दृष्टि में होने का भाव रखता है।
- source_word: עֲלֻמֵנוּ
  choice: हमारे छिपे पापों
  rationale: शब्द का मूल भाव छिपी या गुप्त बातों का है। पहले अर्धपद के ‘अधर्मों’ के समानांतर होने से यहाँ छिपे पाप अभिप्रेत हैं।
- source_word: לִמְאוֹר
  choice: प्रकाश में
  rationale: शाब्दिक संरचना प्रकाश की ओर/प्रकाश में लाए जाने का बोध देती है; हिन्दी में ‘प्रकाश में’ पूर्ण रूप से उजागर होने की छवि स्वाभाविक ढंग से व्यक्त करता है।
- source_word: פָּנֶיךָ
  choice: अपने मुख के
  rationale: ‘मुख’ मूल की ठोस काव्यात्मक छवि को सुरक्षित रखता है; इसे केवल ‘उपस्थिति’ कहने से वह छवि मिट जाती।
theological_decisions:
- issue: עֲלֻמֵנוּ में निहित वस्तु को स्पष्ट करना
  choice: हमारे छिपे पापों
  alternative: हमारी छिपी बातें / हमारे भेद
  rationale: काव्यात्मक समानांतरता इसे निष्पक्ष गुप्त बातों के बजाय छिपे हुए दुष्कर्मों से जोड़ती है। ‘पापों’ जोड़ना निहित अर्थ स्पष्ट करता है, कोई बाहरी धर्मवैज्ञानिक धारणा नहीं जोड़ता।
- issue: ‘मुख के प्रकाश’ की छवि
  choice: अपने मुख के प्रकाश में
  alternative: अपनी उपस्थिति के प्रकाश में
  rationale: मूल पाठ परमेश्वर के ‘मुख’ की ठोस छवि रखता है, जो उसकी उपस्थिति में पूर्ण रूप से उजागर होने का अर्थ देती है; अनुवाद उस छवि को बनाए रखता है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सहज हिन्दी। परमेश्वर को संबोधन में एकवचन ‘तू’ भजन की सीधी, निकट संबोधन-शैली को रखता है। ‘अधर्म’ नैतिक भार सुरक्षित रखता है और ‘मुख का प्रकाश’ मूल इब्रानी काव्य-चित्र को बनाए रखता है।
