  text: For we are consumed by your anger[b][a], and by your wrath we are terrified.
translation:
  language: hi
  text: क्योंकि तेरे क्रोध से हम मिट जाते हैं[a], और तेरे रोष से हम भयभीत हो जाते हैं[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘तेरे क्रोध से हम समाप्त हो गए हैं।’ इब्रानी क्रिया का अर्थ चुक जाना, नष्ट हो जाना या अंत तक पहुँच जाना हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या ‘हम घबरा गए हैं’ अथवा ‘हम व्याकुल हो गए हैं।’ इब्रानी क्रिया भय, घबराहट या गहरी व्याकुलता का भाव व्यक्त करती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले कथन का कारण या स्पष्टीकरण प्रस्तुत करता है; हिन्दी में ‘क्योंकि’ इस संबंध को स्वाभाविक रूप से व्यक्त करता है।
- source_word: כָלִינוּ
  choice: हम मिट जाते हैं
  rationale: כלה यहाँ समाप्त हो जाने, नष्ट हो जाने या चुक जाने का भाव देता है। ‘मिट जाते हैं’ परिणाम की तीव्रता को सहज आधुनिक हिन्दी में व्यक्त करता है, जबकि वैकल्पिक अर्थ पादटिप्पणी में सुरक्षित है।
- source_word: בְאַפֶּךָ
  choice: तेरे क्रोध से
  rationale: בְ को यहाँ कारण अथवा साधन के अर्थ में लिया गया है; אַף के लिए ‘क्रोध’ स्पष्ट और स्वाभाविक है।
- source_word: חֲמָתְךָ
  choice: तेरे प्रचण्ड रोष
  rationale: חֵמָה तीव्र, दहकते हुए रोष का बोध कराता है। ‘प्रचण्ड रोष’ पहले पद के ‘क्रोध’ से भेद रखते हुए काव्यात्मक तीव्रता बनाए रखता है।
- source_word: נִבְהָלְנוּ
  choice: हम आतंकित हो जाते हैं
  rationale: בהל घबरा जाने, व्याकुल होने या भय से विचलित होने का अर्थ देता है। दैवी रोष के संदर्भ में ‘आतंकित’ इसकी तीव्रता को व्यक्त करता है।
theological_decisions:
- issue: दैवी क्रोध के दो समानांतर शब्दों का अनुवाद
  choice: ‘क्रोध’ और ‘प्रचण्ड रोष’ के रूप में भेद बनाए रखा गया
  alternative: दोनों के लिए केवल ‘क्रोध’ कहना, अथवा ‘क्रोध’ और ‘कोप’ कहना
  rationale: इब्रानी में אַף और חֵמָה दो संबंधित किंतु अलग शब्द हैं। अलग हिन्दी पद काव्यात्मक तीव्रता को बनाए रखते हैं और कोई अतिरिक्त सांप्रदायिक अर्थ नहीं जोड़ते।
- issue: पूर्ण क्रियाओं का हिन्दी काल
  choice: संदर्भानुकूल सामान्य वर्तमान—‘मिट जाते हैं’, ‘आतंकित हो जाते हैं’
  alternative: पूर्ण भूत/परिणामी रूप—‘मिट गए हैं’, ‘आतंकित हो गए हैं’
  rationale: इब्रानी पूर्ण क्रियाएँ अनुभव को पूर्ण परिणाम के रूप में रखती हैं, पर भजन के व्यापक, सामूहिक कथन में हिन्दी का सामान्य वर्तमान अधिक स्वाभाविक है। वैकल्पिक कालगत समझ पादटिप्पणियों में संकेतित है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज किंतु गरिमापूर्ण काव्यात्मक रूप। परमेश्वर के लिए एकवचन निकट संबोधन ‘तेरे’ रखा गया है। समानांतरता में ‘क्रोध’ और ‘प्रचण्ड रोष’ का अर्थगत भेद सुरक्षित है।
