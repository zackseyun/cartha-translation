  text: You return man to dust[a], and say, “Return[b], sons of man.”
translation:
  language: hi
  text: तू मनुष्य को धूल में लौटा देता है[a] और कहता है, “लौट जाओ, हे मनुष्यों[b]!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “कुचली हुई अवस्था में” अथवा “चूर्ण होने तक”; इब्रानी शब्द कुचली या चूर्ण की हुई वस्तु अथवा अवस्था को दर्शाता है। संदर्भ में “धूल” उसका भाव स्पष्ट करता है।
    reason: lexical_alternative
  - marker: b
    text: या “हे मनुष्य की संतानों!” इब्रानी में शाब्दिक रूप से “आदम/मनुष्य के पुत्रो” है।
    reason: alternative_reading
lexical_decisions:
- source_word: תָּשֵׁב
  choice: लौटा देता है
  rationale: שׁוב के हिफ़ईल रूप का कारक अर्थ है—‘वापस ले आना/लौटा देना।’ इससे परमेश्वर क्रिया के कर्ता के रूप में स्पष्ट रहता है।
- source_word: אֱנוֹשׁ
  choice: मनुष्य
  rationale: यह शब्द नश्वर और दुर्बल मानवता को सूचित कर सकता है। यहाँ एकवचन सामूहिक अर्थ में ‘मनुष्य’ स्वाभाविक है और अगली पंक्ति के ‘आदम की संतानो’ के समानांतर है।
- source_word: עַד דַּכָּא
  choice: धूल में
  rationale: דַּכָּא कुचली या चूर्ण की हुई अवस्था/वस्तु का बोध कराता है। मृत्यु और धरती में लौटने के संदर्भ में ‘धूल’ आशय को सहज हिंदी में व्यक्त करता है; विकल्प पादटिप्पणी में सुरक्षित है।
- source_word: וַתֹּאמֶר
  choice: और कहता है
  rationale: काव्य में परमेश्वर से प्रत्यक्ष संबोधन और सामान्य, सतत सत्य को व्यक्त करने के लिए वर्तमानकालीन रूप स्वाभाविक है।
- source_word: שׁוּבוּ
  choice: लौट जाओ
  rationale: बहुवचन आज्ञार्थक रूप है। ‘लौट’ पहले खंड के תָּשֵׁב के साथ मूल की शब्दगत पुनरावृत्ति बनाए रखता है।
- source_word: בְנֵי אָדָם
  choice: हे आदम की संतानो
  rationale: शाब्दिक संरचना ‘आदम/मनुष्य के पुत्रो’ है, पर संबोधन में ‘आदम की संतानो’ आधुनिक हिंदी में स्वाभाविक, समावेशी और वंशगत अर्थ के अनुकूल है; ‘आदम’ मानव-उत्पत्ति और नश्वरता की संभावित प्रतिध्वनि को बनाए रखता है।
theological_decisions:
- issue: בְנֵי אָדָם में אָדָם को व्यक्तिनाम मानना या सामान्य ‘मनुष्य’
  choice: आदम की संतानो
  alternative: मनुष्यो / मनुष्य की संतानो
  rationale: इब्रानी पदबंध सामान्य मानवजाति को भी सूचित कर सकता है और ‘आदम’ की ओर संकेत भी दे सकता है। मुख्य पाठ में ‘आदम’ रखकर उत्पत्ति और धूल में लौटने की प्रतिध्वनि बचाई गई है, जबकि पादटिप्पणी सामान्य अर्थ बताती है।
- issue: דַּכָּא का ठोस या अमूर्त अनुवाद
  choice: धूल
  alternative: कुचली हुई अवस्था / चूर्ण
  rationale: मूल शब्द कुचले या चूर्ण किए जाने का बोध देता है। संदर्भ में ‘धूल’ मृत्युशीलता को स्पष्ट करता है, पर मूल की व्यापकता पादटिप्पणी में संरक्षित है।
translation_notes:
  register: आधुनिक मानक हिंदी का गरिमापूर्ण काव्यात्मक संबोधन रखा गया है। परमेश्वर के लिए एकवचन निकट संबोधन ‘तू’ भजन की प्रत्यक्ष प्रार्थनात्मक शैली के अनुरूप है। ‘हे’ संबोधन को स्पष्ट और स्वाभाविक बनाता है।
