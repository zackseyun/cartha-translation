base_translation:
  language: en
  yaml_path: translation/ot/psalms/090/014.yaml
  text: Satisfy us in the morning with your steadfast love[a], and we will sing for joy and be glad all our days.
translation:
  language: hi
  text: सुबह हमें अपने अटल प्रेम[a] से तृप्त कर, ताकि हम जीवन भर जयजयकार करें और आनन्दित हों।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “अपनी निष्ठावान करुणा से” अथवा “अपने वाचा-निष्ठ प्रेम से।” इब्रानी शब्द חֶסֶד में स्थायी प्रेम, निष्ठा, कृपा और करुणा के भाव समाए हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: שַׂבְּעֵנוּ
  choice: हमें ... तृप्त कर
  rationale: पिएल आज्ञार्थक रूप पूर्ण रूप से भरने या तृप्त करने की प्रार्थना व्यक्त करता है। ‘तृप्त कर’ हिन्दी में स्वाभाविक है और प्रचुरता का भाव बनाए रखता है।
- source_word: בַבֹּקֶר
  choice: भोर में
  rationale: इब्रानी पद का सीधा समय-सूचक अर्थ ‘सुबह/भोर में’ है। ‘भोर में’ काव्यात्मक गरिमा रखते हुए इसे ‘हर सुबह’ या ‘भोर तक’ नहीं बनाता।
- source_word: חַסְדֶּךָ
  choice: अपने अटल प्रेम
  rationale: חֶסֶד में निष्ठावान, स्थायी प्रेम और कृपा का भाव है। ‘अटल प्रेम’ प्रेम तथा स्थिर निष्ठा दोनों को संक्षेप और सहज रूप में व्यक्त करता है।
- source_word: וּנְרַנְּנָה
  choice: ताकि हम ... जयजयकार करें
  rationale: רנן आनन्द की ऊँची पुकार या गीत को दर्शाता है। आज्ञार्थक प्रार्थना के बाद सहभावी रूप उद्देश्य/परिणाम का भाव दे सकता है; ‘ताकि’ उसे स्वाभाविक हिन्दी में व्यक्त करता है, जबकि ‘जयजयकार करें’ उसकी मुखर प्रसन्नता बनाए रखता है।
- source_word: וְנִשְׂמְחָה
  choice: और आनन्दित रहें
  rationale: שמח प्रसन्न या आनन्दित होने को दर्शाता है। ‘आनन्दित रहें’ पूर्ववर्ती मुखर जयजयकार से भेद रखते हुए दीर्घकालिक प्रसन्नता व्यक्त करता है।
- source_word: בְּכָל יָמֵינוּ
  choice: जीवन भर
  rationale: शाब्दिक अर्थ ‘हमारे सब दिनों में’ है। ‘जीवन भर’ साधारण आधुनिक हिन्दी में वही सम्पूर्ण जीवनकाल का अर्थ सहजता से देता है।
theological_decisions:
- issue: प्रार्थना में חֶסֶד का अनुवाद
  choice: अपने अटल प्रेम
  alternative: अपनी वाचा की निष्ठा / अपनी करुणा
  rationale: यह पद परमेश्वर के स्थायी, निष्ठावान प्रेम को आनन्द का आधार बनाता है। ‘अटल प्रेम’ अर्थ की व्यापकता रखता है और मुख्य पाठ में वाचा-संबंधी अर्थ को आवश्यकता से अधिक स्पष्ट या ‘करुणा’ तक सीमित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, प्रार्थनापूर्ण और काव्यात्मक शैली। एकवचन परमेश्वर को सम्बोधित अनौपचारिक-निकट आज्ञार्थक ‘कर’ भजन की सीधी विनती को दर्शाता है; किसी सम्प्रदाय-विशेष की शब्दावली नहीं जोड़ी गई।
