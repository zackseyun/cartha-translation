  edition: WLC
  text: אִם אֵלֵ֤ךְ בְּ/קֶ֥רֶב צָרָ֗ה תְּחַ֫יֵּ֥/נִי עַ֤ל אַ֣ף אֹ֭יְבַ/י תִּשְׁלַ֣ח יָדֶ֑/ךָ וְ/ת֖וֹשִׁיעֵ֣/נִי יְמִינֶֽ/ךָ־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/138/007.yaml
  text: If I walk in the midst of trouble[a], you preserve my life; you stretch out your hand against the anger of my enemies[c][b], and your right hand saves me.
translation:
  language: hi
  text: यदि मैं संकट के बीच चलूँ[a], तो तू मुझे जीवित रखेगा[b]; मेरे शत्रुओं के क्रोध के विरुद्ध तू अपना हाथ बढ़ाएगा[c], और तेरा दाहिना हाथ मुझे बचाएगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “चाहे मैं संकट के बीच चलूँ।” इब्रानी אִם प्रसंग में शर्त या रियायत—दोनों का भाव दे सकता है।
    reason: lexical_alternative
  - marker: b
    text: या, “तू मुझे फिर जीवित करेगा” अथवा “तू मुझे जीवित बनाए रखेगा।” इब्रानी क्रिया फिर जीवित करने या जीवित रखने का अर्थ दे सकती है।
    reason: lexical_alternative
  - marker: c
    text: शाब्दिक रूप से, “मेरे शत्रुओं की नाक पर/के विरुद्ध”; इब्रानी में “नाक” क्रोध का मुहावरा है।
    reason: cultural_note
lexical_decisions:
- source_word: אִם
  choice: यदि
  rationale: यह कण शर्त या प्रसंगानुसार रियायत का भाव दे सकता है। मुख्य पाठ में ‘यदि’ उसके सबसे सीधे अर्थ को रखता है, जबकि वैकल्पिक भाव पादटिप्पणी में दिया गया है।
- source_word: אֵלֵךְ בְּקֶרֶב צָרָה
  choice: मैं संकट के बीच चलूँ
  rationale: ‘चलूँ’ मूल क्रियात्मक बिंब को और ‘के बीच’ קֶרֶב की स्थानगत सजीवता को बनाए रखता है; ‘संकट’ צָרָה का स्वाभाविक और व्यापक हिन्दी रूप है।
- source_word: תְּחַיֵּנִי
  choice: तू मुझे जीवित रखता है
  rationale: חיה का पिएल रूप जीवित करने, फिर से जिलाने या जीवित बनाए रखने का अर्थ दे सकता है। शत्रुओं से घिरे संकट के प्रसंग में ‘जीवित रखता है’ जीवन की रक्षा का भाव स्वाभाविक रूप से व्यक्त करता है।
- source_word: עַל אַף אֹיְבַי
  choice: मेरे शत्रुओं के क्रोध के विरुद्ध
  rationale: אַף का शाब्दिक अर्थ ‘नाक’ है, पर यहाँ यह क्रोध का इब्रानी मुहावरा है। עַל के साथ यह परमेश्वर के हस्तक्षेप को शत्रुओं के उग्र क्रोध के विरुद्ध दिखाता है।
- source_word: תִּשְׁלַח יָדֶךָ
  choice: तू अपना हाथ बढ़ाता है
  rationale: यह सक्रिय हस्तक्षेप का मानवरूपी बिंब है; ‘हाथ बढ़ाना’ आधुनिक हिन्दी में स्वाभाविक रहते हुए मूल चित्र को सुरक्षित रखता है।
- source_word: וְתוֹשִׁיעֵנִי
  choice: और ... मुझे बचाता है
  rationale: ישע के हिफ़ील रूप का सामान्य अर्थ बचाना या छुड़ाना है। ‘बचाता है’ उद्धार की रीति को अनावश्यक रूप से सीमित नहीं करता।
- source_word: יְמִינֶךָ
  choice: तेरा दाहिना हाथ
  rationale: शाब्दिक रूप मूल इब्रानी बिंब को बनाए रखता है, जिसमें दाहिना हाथ सामर्थ्य और बचाने वाली कार्रवाई से जुड़ा है।
theological_decisions:
- issue: תְּחַיֵּנִי में परमेश्वर की जीवनदायी कार्रवाई का आशय
  choice: वर्तमान संकट में जीवन की रक्षा
  alternative: पुनर्जीवन या पुनर्स्थापना
  rationale: संकट और शत्रुओं का निकट प्रसंग भजनकार को खतरे के बीच जीवित रखने की ओर संकेत करता है। फिर भी क्रिया की व्यापक अर्थ-सीमा पादटिप्पणी में सुरक्षित रखी गई है।
- issue: עַל אַף אֹיְבַי का बल
  choice: परमेश्वर शत्रुओं के क्रोध के विरुद्ध कार्रवाई करता है
  alternative: परमेश्वर सीधे शत्रुओं के विरुद्ध कार्रवाई करता है
  rationale: אַף यहाँ मुहावरे के रूप में ‘क्रोध’ है; इसलिए उसे हटाकर केवल ‘शत्रुओं के विरुद्ध’ कहना मूल अभिव्यक्ति को सपाट कर देगा।
translation_notes:
  register: आधुनिक मानक हिन्दी में काव्यात्मक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध शैली रखी गई है। परमेश्वर को संबोधित करने के लिए ‘तू/तेरा’ का पारंपरिक निकट संबोधन चुना गया है। वाक्य का समानांतर काव्य-विन्यास और हाथ/दाहिने हाथ के मूल बिंब सुरक्षित हैं।
