  text: Of David[a]. I will give thanks to you with all my heart; before the gods I will sing praises to you.
translation:
  language: hi
  text: 'दाऊद का[a]


    मैं पूरे हृदय से आपका धन्यवाद करूँगा;

    देवताओं[b] के सामने मैं आपकी स्तुति गाऊँगा।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “दाऊद के लिए” अथवा “दाऊद से संबंधित।” हिब्रू शीर्षक दाऊद से संबंध बताता है, पर उस संबंध का ठीक प्रकार स्पष्ट नहीं करता।
    reason: alternative_reading
  - marker: b
    text: या “स्वर्गीय प्राणियों के सामने” अथवा “स्वर्गदूतों के सामने।” हिब्रू शब्द संदर्भ के अनुसार देवताओं, परमेश्वर, या स्वर्गीय प्राणियों के लिए प्रयुक्त हो सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: לְדָוִד
  choice: दाऊद की रचना
  rationale: शीर्षक का हिब्रू पद दाऊद से संबंध बताता है, पर संबंध का सटीक प्रकार अस्पष्ट है; स्वाभाविक हिन्दी में इसे रचना-संबंधी शीर्षक के रूप में व्यक्त किया गया है और वैकल्पिक अर्थ पादटिप्पणी में रखा गया है।
- source_word: אוֹדְךָ
  choice: मैं आपका धन्यवाद करूँगा
  rationale: ידה के हिफ़ील रूप का यहाँ अर्थ धन्यवाद अथवा स्तुति करना है; ‘धन्यवाद’ संदर्भ में सीधा और स्वाभाविक है।
- source_word: בְכָל־לִבִּי
  choice: पूरे मन से
  rationale: हिब्रू ‘अपने सारे हृदय से’ सम्पूर्ण आंतरिक समर्पण दर्शाता है; आधुनिक हिन्दी का स्वाभाविक समतुल्य ‘पूरे मन से’ है।
- source_word: נֶגֶד אֱלֹהִים
  choice: देवताओं के सामने
  rationale: אֱלֹהִים बहुवचन क्रिया-संदर्भ के बिना यहाँ ‘देवताओं’ या स्वर्गीय प्राणियों को सूचित कर सकता है। मुख्य पाठ में सबसे सीधा बहुवचन अर्थ रखा गया और अन्य संभावनाएँ पादटिप्पणी में दी गई हैं।
- source_word: אֲזַמְּרֶךָּ
  choice: मैं आपका भजन गाऊँगा
  rationale: זמר का पिएल रूप वाद्य-सहित या स्वर से स्तुति गाने का भाव देता है; ‘भजन गाऊँगा’ काव्यात्मक और सहज हिन्दी है।
theological_decisions:
- issue: אֱלֹהִים का संदर्भ
  choice: देवताओं
  alternative: स्वर्गीय प्राणियों; स्वर्गदूतों; परमेश्वर
  rationale: हिब्रू शब्द संदर्भानुसार परमेश्वर, देवताओं, न्यायाधीश-सदृश प्राणियों या स्वर्गीय प्राणियों को दर्शा सकता है। अनुवाद ने बहुवचन की वास्तविक अस्पष्टता को पादटिप्पणी सहित सुरक्षित रखा है और किसी विशिष्ट दैवी परिषद-विवेचना को आरोपित नहीं किया।
- issue: לְדָוִד का संबंध
  choice: दाऊद की रचना
  alternative: दाऊद का; दाऊद के लिए; दाऊद से संबंधित
  rationale: לְ उपसर्ग लेखकत्व, समर्पण अथवा संबंध सूचित कर सकता है। मुख्य पाठ में प्रचलित रचना-संबंधी अर्थ अपनाया गया, पर पादटिप्पणी में अस्पष्टता स्पष्ट की गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी में आदरसूचक ‘आप’ का प्रयोग किया गया है। काव्य-पंक्तियाँ संक्षिप्त और गरिमापूर्ण रखी गई हैं। मुख्य पाठ में दोनों पादटिप्पणी-चिह्न आवश्यक स्थानों पर लगाए जाने चाहिए; ‘देवताओं’ के बाद [b] है।
