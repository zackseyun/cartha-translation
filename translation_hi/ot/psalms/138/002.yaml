source:
  edition: WLC
  text: אֶשְׁתַּחֲוֶ֨ה אֶל הֵיכַ֪ל קָדְשְׁ/ךָ֡ וְ/א֘וֹדֶ֤ה אֶת שְׁמֶ֗/ךָ עַל חַסְדְּ/ךָ֥ וְ/עַל אֲמִתֶּ֑/ךָ כִּֽי הִגְדַּ֥לְתָּ עַל כָּל שִׁ֝מְ/ךָ֗ אִמְרָתֶֽ/ךָ־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/138/002.yaml
  text: I bow down toward your holy temple and give thanks to your name for your steadfast love and your faithfulness[a], for you have exalted your word above all your name.
translation:
  language: hi
  text: मैं आपके पवित्र मंदिर की ओर दंडवत् करूँगा और आपके अटल प्रेम और आपकी विश्वासयोग्यता के कारण आपके नाम का धन्यवाद करूँगा, क्योंकि आपने अपने वचन को अपने नाम से भी बढ़कर ऊँचा किया है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या, “क्योंकि आपने अपनी प्रतिज्ञा को सब वस्तुओं से अधिक महान किया है।” इब्रानी में अंतिम उपवाक्य कठिन है; कुछ लोग इसका अर्थ यह समझते हैं: “क्योंकि आपने अपने नाम और अपने वचन को सब वस्तुओं से ऊँचा किया है।”'
    reason: alternative_reading
lexical_decisions:
- source_word: אֶשְׁתַּחֲוֶה
  choice: दण्डवत् करूँगा
  rationale: यह रूप आराधना में झुकने या भूमि पर दण्डवत् होने की ठोस शारीरिक क्रिया व्यक्त करता है; केवल ‘आराधना करूँगा’ कहने से यह मूर्त भाव कम हो जाता।
- source_word: אֶל הֵיכַל קָדְשְׁךָ
  choice: आपके पवित्र मन्दिर की ओर
  rationale: אֶל यहाँ दिशा बताता है और הֵיכָל इस आराधना-सन्दर्भ में ‘मन्दिर’ है; अनुवाद मन्दिर में प्रवेश का संकेत दिए बिना उसकी ओर उन्मुख होने का भाव रखता है।
- source_word: וְאוֹדֶה אֶת שְׁמֶךָ
  choice: आपके नाम का धन्यवाद करूँगा
  rationale: ידה का हिफ़ील रूप धन्यवाद या स्तुति व्यक्त कर सकता है। आगे दिए गए कारणों के कारण यहाँ ‘धन्यवाद’ उपयुक्त है; ‘आपके नाम का’ मूल की अभिव्यक्ति को निकटता से रखता है।
- source_word: עַל חַסְדְּךָ
  choice: आपके अटल प्रेम के कारण
  rationale: חסד प्रेम, निष्ठा और स्थिर प्रतिबद्धता का समृद्ध भाव रखता है। ‘अटल प्रेम’ आधुनिक और सुबोध हिन्दी में उसकी स्थायित्वपूर्ण प्रकृति व्यक्त करता है।
- source_word: וְעַל אֲמִתֶּךָ
  choice: आपकी विश्वासयोग्यता के कारण
  rationale: אמת सत्य, दृढ़ता या विश्वसनीयता का अर्थ दे सकता है। חסד के समानान्तर यहाँ परमेश्वर की भरोसेमन्द निष्ठा प्रमुख है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यह धन्यवाद का कारण प्रस्तुत करता है और हिन्दी में स्पष्ट कारणसूचक सम्बन्ध बनाता है।
- source_word: הִגְדַּלְתָּ
  choice: ऊँचा किया है
  rationale: גדל के हिफ़ील रूप का अर्थ महान करना या महिमा देना है। ‘ऊँचा किया है’ सम्मान में श्रेष्ठ ठहराने का भाव स्वाभाविक हिन्दी में देता है।
- source_word: עַל כָּל שִׁמְךָ
  choice: अपने समस्त नाम से भी ऊँचा
  rationale: इब्रानी पदबंध कठिन और विवादित है। यह चयन मसोराई शब्दक्रम के निकट रहते हुए עַל को तुलनात्मक ‘से भी ऊँचा’ और כָּל שִׁמְךָ को ‘समस्त नाम’ के रूप में रखता है, बिना कठिनाई को चुपचाप मिटाए।
- source_word: אִמְרָתֶךָ
  choice: अपने वचन को
  rationale: אִמְרָה वचन, कथन या प्रतिज्ञा हो सकता है। ‘वचन’ व्यापकता बनाए रखता है और प्रसंग को प्रतिज्ञा का भाव ग्रहण करने देता है।
theological_decisions:
- issue: कठिन अन्तिम उपवाक्य כִּי הִגְדַּלְתָּ עַל כָּל שִׁמְךָ אִמְרָתֶךָ की व्याख्या
  choice: क्योंकि आपने अपने वचन को अपने समस्त नाम से भी ऊँचा किया है
  alternative: क्योंकि आपने अपनी प्रतिज्ञा को सब वस्तुओं से अधिक महान किया है; अथवा, क्योंकि आपने अपने नाम और अपने वचन को सब वस्तुओं से ऊँचा किया है
  rationale: मसोराई पाठ की वाक्यरचना कठिन है। मुख्य पाठ उसके शब्दक्रम और तनाव को निकटता से बनाए रखता है, जबकि अधिक सहज व्याख्यात्मक पाठ फुटनोट में दिए गए हैं। इसका आशय परमेश्वर के नाम को घटाना निश्चित नहीं किया गया है; अनुवाद वचन और नाम के सम्बन्ध को खुला रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में आदरसूचक ‘आप’ का प्रयोग किया गया है। शैली गरिमापूर्ण किन्तु सामान्य पाठक के लिए सुबोध है। ‘दण्डवत्’ आराधना की ठोस शारीरिक क्रिया को सुरक्षित रखता है। अन्तिम कठिन उपवाक्य को मुख्य पाठ में मूल के निकट रखा गया और वैकल्पिक समझ फुटनोट में दी गई।
