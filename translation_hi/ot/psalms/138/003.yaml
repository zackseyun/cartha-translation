- source_word: בְּיוֹם
  choice: जिस दिन
  rationale: समय-सूचक पूर्वसर्ग और संज्ञा की ठोस अभिव्यक्ति को स्वाभाविक आधुनिक हिन्दी में बनाए रखता है।
- source_word: קָרָאתִי
  choice: मैंने पुकारा
