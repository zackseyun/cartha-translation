  choice: परमेश्वर द्वारा प्राण में सामर्थ्य भरकर साहसी किया जाना
  alternative: ‘तूने सामर्थ्य देकर मेरे प्राण को विशाल किया’ अथवा ‘तूने मुझे भीतर से दृढ़ किया’
  rationale: मूल क्रिया साहसी बनाने, विस्तृत करने या बल देने का भाव दे सकती है। मुख्य पाठ प्रसंगानुकूल आंतरिक साहस को व्यक्त करता है, जबकि पाद-टिप्पणी वास्तविक शाब्दिक अनिश्चितता को सुरक्षित रखती है।
