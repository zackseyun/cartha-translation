  text: जिस दिन मैंने पुकारा, तूने मुझे उत्तर दिया; तूने मेरे प्राण में सामर्थ्य भरकर मुझे साहसी बनाया।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तूने सामर्थ्य देकर मेरे प्राण को विशाल किया,” अथवा अधिक सहज रूप में, “तूने मुझे भीतर से दृढ़ किया।” यहाँ प्रयुक्त इब्रानी क्रिया कठिन है और साहसी बनाने, विशाल करने या बल देने का भाव व्यक्त कर सकती है।
    reason: lexical_alternative
