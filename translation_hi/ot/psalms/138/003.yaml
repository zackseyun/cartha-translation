- source_word: וַתַּעֲנֵנִי
  choice: तूने मुझे उत्तर दिया
  rationale: क्रिया के प्रथम पुरुष एकवचन प्रत्यय को ‘मुझे’ द्वारा स्पष्ट रूप से व्यक्त करता है।
- source_word: תַּרְהִבֵנִי
  choice: तूने ... मुझे साहसी बनाया
  rationale: कठिन हिफ़ील रूप का प्रसंगानुकूल अर्थ भीतर से साहस देना या निर्भीक बनाना है; कारक भाव भी सुरक्षित रहता है।
- source_word: בְנַפְשִׁי
  choice: मेरे प्राण में
  rationale: נפש के भीतरी व्यक्तित्व/प्राण के अर्थ को दृश्यमान रखता है और केवल सामान्य ‘मेरे भीतर’ में समतल नहीं करता।
- source_word: עֹז
  choice: सामर्थ्य भरकर
  rationale: עֹז की ‘शक्ति/सामर्थ्य’ धारणा को स्वाभाविक हिन्दी में साधन अथवा प्रदान की गई आंतरिक शक्ति के रूप में व्यक्त करता है।
