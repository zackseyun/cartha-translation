    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָשִׁירוּ
  choice: और वे … गान करेंगे
  rationale: काल अपूर्ण रूप यहाँ पिछले पद में राजाओं द्वारा स्तुति किए जाने के बाद भविष्य की काव्यात्मक अभिव्यक्ति के रूप में स्वाभाविक है; इसे आज्ञार्थक बनाना आवश्यक नहीं है।
- source_word: בְּדַרְכֵי
  choice: मार्गों का
  rationale: पूर्वसर्ग בְּ का शाब्दिक अर्थ यहाँ ‘मार्गों में’ है, पर ‘गाना’ क्रिया के साथ इसका आशय संभवतः याहवे के मार्गों को गीत का विषय बनाना है। ‘मार्गों का गान’ हिंदी में स्वाभाविक है, जबकि शाब्दिक विकल्प पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय हिंदी में उसके प्रचलित लिप्यंतरण ‘याहवे’ से प्रस्तुत किया गया है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पद के दूसरे भाग को पहले भाग का कारण बताने वाले उपवाक्य के रूप में जोड़ता है।
- source_word: גָדוֹל
  choice: महान
  rationale: विशेषण का सीधा अर्थ ‘महान’ है और यह परमेश्वर की महिमा की विशालता को बिना अतिरिक्त व्याख्या के व्यक्त करता है।
- source_word: כְּבוֹד
  choice: महिमा
  rationale: परमेश्वर के संदर्भ में כָּבוֹד के लिए ‘महिमा’ स्वाभाविक और धर्मवैचारिक रूप से व्यापक हिंदी पर्याय है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में व्यक्तिगत वाचा-नाम सीधे आया है। ‘याहवे’ उसे उपाधि से प्रतिस्थापित किए बिना और किसी संप्रदाय-विशेष की व्याख्या जोड़े बिना प्रस्तुत करता है।
- issue: בְּדַרְכֵי में पूर्वसर्ग का आशय
  choice: याहवे के मार्गों का गान
  alternative: याहवे के मार्गों में गान
  rationale: संदर्भ में राजाओं का गाना याहवे के कार्य-मार्गों को गीत का विषय बनाता प्रतीत होता है, पर शाब्दिक स्थानवाचक/क्षेत्रवाचक रूप संभव है; इसलिए मुख्य पाठ स्वाभाविक अर्थ देता है और पादटिप्पणी वास्तविक अस्पष्टता बनाए रखती है।
translation_notes:
  register: भाषा आधुनिक, सहज और काव्यात्मक गरिमा वाली रखी गई है। ‘गान करेंगे’ भजन की शैली के अनुकूल है, और ‘मार्ग’ דֶּרֶךְ के नैतिक तथा कार्य-विधि संबंधी व्यापक अर्थ को बनाए रखता है।
