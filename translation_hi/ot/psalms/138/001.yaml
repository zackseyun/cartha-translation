  text: Of David[a]. I will give thanks to you with my whole heart; before the gods I will sing praises to you.
translation:
  language: hi
  text: 'दाऊद के लिए।[a]


    मैं अपने सारे हृदय से तेरा धन्यवाद करूँगा;


    देवताओं के सामने मैं तेरी स्तुति गाऊँगा।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “दाऊद का” अथवा “दाऊद द्वारा।” इब्रानी शीर्षक रचनाकारिता, संबंध या समर्पण का संकेत दे सकता है। “देवताओं” का अनुवाद “स्वर्गीय प्राणियों,” “स्वर्गदूतों,” या “परमेश्वर” भी हो सकता है; संदर्भ के अनुसार यही इब्रानी शब्द परमेश्वर, देवताओं, या स्वर्गीय प्राणियों के लिए प्रयुक्त हो सकता है।
    reason: लְדָוִד और אֱלֹהִים की भाषिक अस्पष्टता सुरक्षित रखना।
lexical_decisions:
- source_word: לְדָוִד
  choice: दाऊद का भजन
  rationale: लְ उपसर्ग रचनाकार, संबंध या समर्पण का संकेत दे सकता है। हिंदी में प्रचलित भजन-शीर्षक के रूप में “दाऊद का भजन” इस संबंध को स्वाभाविक ढंग से व्यक्त करता है, जबकि पादटिप्पणी इसकी संभावित अस्पष्टता बचाती है।
- source_word: אוֹדְךָ
  choice: तेरा धन्यवाद करूँगा
  rationale: हिफ़ील रूप में ידה धन्यवाद देने, प्रशंसा करने या अंगीकार करने का भाव रखता है। यहाँ आराधना के संदर्भ में “धन्यवाद करूँगा” कृतज्ञता का प्रमुख भाव और द्वितीय पुरुष प्रत्यय दोनों स्पष्ट करता है।
- source_word: בְכָל לִבִּי
  choice: अपने सारे हृदय से
  rationale: यह मूल वाक्यांश का निकट और स्वाभाविक हिंदी रूप है तथा अविभाजित आंतरिक समर्पण का भाव रखता है।
- source_word: נֶגֶד
  choice: के सामने
  rationale: נגד सामने या उपस्थिति में होने का बोध देता है। “के सामने” आधुनिक हिंदी में स्पष्ट, संक्षिप्त और काव्यात्मक रूप से उपयुक्त है।
- source_word: אֱלֹהִים
  choice: देवताओं
  rationale: यह रूप व्याकरणतः बहुवचन है और यहाँ देवताओं अथवा स्वर्गीय प्राणियों का संकेत दे सकता है। मुख्य पाठ में “देवताओं” रखने से प्रत्यक्ष बहुवचन और पद का आलंकारिक तनाव सुरक्षित रहता है; विकल्प पादटिप्पणी में दिया गया है।
- source_word: אֲזַמְּרֶךָ
  choice: मैं तेरी स्तुति गाऊँगा
  rationale: पिएल में זמר संगीत बनाने या स्तुति गाने का अर्थ देता है। “स्तुति गाऊँगा” इसके संगीतमय और आराधनात्मक दोनों भावों को व्यक्त करता है।
theological_decisions:
- issue: “נֶגֶד אֱלֹהִים” में אֱלֹהִים का आशय
  choice: देवताओं के सामने
  alternative: स्वर्गीय प्राणियों के सामने; स्वर्गदूतों के सामने; परमेश्वर के सामने
  rationale: मूल रूप बहुवचन है और संदर्भ में राष्ट्रों के देवताओं या स्वर्गीय प्राणियों की ओर संकेत कर सकता है। एकवचन “परमेश्वर” करने से रूपगत बहुवचन और वास्तविक व्याख्यात्मक तनाव दब जाएगा। इसलिए मुख्य पाठ में सीधा बहुवचन रखा गया और अन्य संभावनाएँ पादटिप्पणी में सुरक्षित की गईं।
- issue: לְדָוִד शीर्षक का संबंध
  choice: दाऊद का भजन
  alternative: दाऊद के लिए; दाऊद द्वारा
  rationale: לְ रचनाकारिता, संबंध या समर्पण में से किसी का संकेत दे सकता है। हिंदी की स्वाभाविक शीर्षक-परंपरा के अनुसार “दाऊद का भजन” चुना गया, पर मूल की अनिश्चितता पादटिप्पणी में बताई गई है।
translation_notes:
  register: आधुनिक मानक हिंदी, श्रद्धापूर्ण और काव्यात्मक किंतु सामान्य पाठक के लिए सहज। द्वितीय पुरुष के लिए निकट, भजनात्मक “तू/तेरा/तेरी” शैली अपनाई गई है। पंक्ति-विन्यास इब्रानी काव्य के दो समानांतर कथनों को स्पष्ट करता है।
