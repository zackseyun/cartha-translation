base_translation:
  language: en
  yaml_path: translation/ot/psalms/138/006.yaml
  text: For Yahweh is high[a], yet he sees the lowly[c][b]; but the haughty he knows from afar.
translation:
  language: hi
  text: क्योंकि यहोवा ऊँचा है, फिर भी वह दीनों को देखता है; परन्तु घमण्डी को वह दूर से जानता है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पद पिछले कथन का आधार बताता है; ‘क्योंकि’ उसके व्याख्यात्मक संबंध को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: רָם
  choice: ऊँचा
  rationale: यह यहोवा की उच्च और महान स्थिति का ऊर्ध्व रूपक बनाए रखता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: परमेश्वर के व्यक्तिगत नाम को हिन्दी में प्रचलित लिप्यंतरण द्वारा प्रस्तुत किया गया है, किसी उपाधि से प्रतिस्थापित नहीं किया गया।
- source_word: שָׁפָל
  choice: दीन जन
  rationale: इसमें नीची सामाजिक स्थिति और विनम्र दशा—दोनों की संभावना बनी रहती है; ‘दीन जन’ सामान्य हिन्दी में सहज है।
- source_word: יִרְאֶה
  choice: देखता है
  rationale: मूल क्रिया ‘देखना’ को सीधे रखा गया है, जबकि प्रसंग में निहित ध्यान और परवाह का भाव पाठक के लिए खुला रहता है।
- source_word: גָבֹהַּ
  choice: घमण्डी
  rationale: शाब्दिक अर्थ ‘ऊँचा’ है, पर ‘दीन’ के विरोध में यह अहंकारी व्यक्ति को सूचित करता है; ‘घमण्डी’ उस नैतिक अर्थ को स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
- source_word: מִמֶּרְחָק
  choice: दूर ही से
  rationale: यह दूरी के स्थानिक रूपक को बनाए रखता है और हिन्दी काव्यात्मक अभिव्यक्ति में स्वाभाविक है।
- source_word: יְיֵדָע
  choice: जान लेता है
  rationale: मूल ‘जानना’ को सुरक्षित रखा गया है; पूर्णतः स्पष्ट अस्वीकृति या दण्ड का अर्थ इसमें नहीं जोड़ा गया।
theological_decisions:
- issue: घमण्डी के विषय में परमेश्वर के ज्ञान की संबंधात्मक दूरी
  choice: ‘घमण्डी को वह दूर ही से जान लेता है’
  alternative: ‘वह घमण्डी को दूर रखता है’ / ‘वह घमण्डी को दूर से पहचानता है’
  rationale: इब्रानी पाठ ‘जानता है’ और ‘दूर से’ कहता है। इससे संबंधात्मक दूरी का संकेत मिल सकता है, पर यहाँ स्पष्ट रूप से अस्वीकार करने या दूर रखने की बात नहीं कही गई; इसलिए मूल तनाव को बनाए रखा गया है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, सहज किन्तु गरिमापूर्ण रखी गई है। अर्धविराम दीन जन और घमण्डी के प्रति दो विपरीत कथनों को स्पष्ट करता है।
