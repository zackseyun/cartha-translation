source:
  edition: WLC
  text: יוֹד֣וּ/ךָ יְ֭הוָה כָּל מַלְכֵי אָ֑רֶץ כִּ֥י שָׁ֝מְע֗וּ אִמְרֵי פִֽי/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/138/004.yaml
  text: All the kings of the earth will give thanks to you[a], O Yahweh, for they have heard the words of your mouth.
translation:
  language: hi
  text: 'हे याहवे[a], पृथ्वी के सब राजा तेरा धन्यवाद करेंगे,

    क्योंकि उन्होंने तेरे मुख के वचन सुने हैं।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इब्रानी में: יהוה (याहवे), परमेश्वर का व्यक्तिगत नाम; कई हिन्दी अनुवादों में इसे “यहोवा” या “प्रभु” लिखा जाता है।'
    reason: divine_name
lexical_decisions:
- source_word: יוֹדוּךָ
  choice: तेरा धन्यवाद करेंगे
  rationale: हिफ़ील रूप यहाँ परमेश्वर को संबोधित धन्यवाद या स्तुति व्यक्त करता है। भजन के धन्यवाद-विषय और दूसरे पुरुष एकवचन प्रत्यय को स्पष्ट रखने के लिए यह अनुवाद चुना गया है।
- source_word: יְהוָה
  choice: हे याहवे
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम יהוה को उपाधि से बदलने के बजाय उसके प्रचलित विद्वत्तापूर्ण लिप्यंतरण के रूप में रखा गया है; सम्बोधन को स्वाभाविक बनाने के लिए ‘हे’ जोड़ा गया है।
- source_word: כָּל מַלְכֵי אָרֶץ
  choice: पृथ्वी के सब राजा
  rationale: यह सामूहिक पदबंध का सीधा और स्वाभाविक हिन्दी रूप है तथा ‘राजा’ की विशिष्टता बनाए रखता है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यहाँ כִּי राजाओं के धन्यवाद करने का कारण बताता है।
- source_word: שָׁמְעוּ
  choice: उन्होंने ... सुने हैं
  rationale: क़ातल रूप उस पूर्ण हुई सुनने की क्रिया को दर्शाता है जो भावी धन्यवाद का आधार है; हिन्दी पूर्ण वर्तमान इस क्रम को सहजता से व्यक्त करता है।
- source_word: אִמְרֵי פִיךָ
  choice: तेरे मुख के वचन
  rationale: यह अनुवाद मूल की ‘मुख’ वाली काव्यात्मक छवि और אִמְרֵי के अर्थ ‘कथन/वचन’ दोनों को बनाए रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में व्यक्तिगत नाम יהוה है। ‘याहवे’ उसे उपाधि ‘प्रभु’ से बदले बिना प्रस्तुत करता है और ‘यहोवा’ की अपेक्षा सम्भावित प्राचीन उच्चारण को अधिक निकटता से दर्शाता है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और काव्यात्मक हिन्दी। परमेश्वर के लिए पारंपरिक एकवचन निकट संबोधन ‘तेरा/तेरे’ रखा गया है। पंक्ति-विभाजन इब्रानी काव्य के दो समानांतर खंडों को स्पष्ट करता है।
