source:
  edition: WLC
  text: יְהוָה֮ יִגְמֹ֪ר בַּ֫עֲדִ֥/י יְ֭הוָה חַסְדְּ/ךָ֣ לְ/עוֹלָ֑ם מַעֲשֵׂ֖י יָדֶ֣י/ךָ אַל תֶּֽרֶף־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/138/008.yaml
  text: Yahweh will fulfill his purpose for me[a]; O Yahweh, your steadfast love endures forever[b]. Do not forsake the work of your hands.
translation:
  language: hi
  text: याहवे मेरे लिए अपना उद्देश्य पूरा करेगा[a]। हे याहवे, आपका अटल प्रेम सदा बना रहता है। अपने हाथों के कामों को मत छोड़िए[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “याहवे वह पूरा करेगा जो मुझसे संबंधित है।”
    reason: alternative_reading
  - marker: b
    text: या, “अपने हाथों के काम को मत त्यागिए।”
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय देवनागरी में लिप्यंतरित किया गया है।
- source_word: יִגְמֹר בַּעֲדִי
  choice: मेरे लिए अपना उद्देश्य पूरा करेगा
  rationale: גמר का अर्थ पूरा करना या पूर्णता तक पहुँचाना है और בַּעֲדִי का अर्थ मेरे लिए, मेरी ओर से, या मुझसे संबंधित हो सकता है। सहज हिन्दी के लिए ‘उद्देश्य’ जोड़ा गया है, जबकि वैकल्पिक अधिक शाब्दिक अर्थ पादटिप्पणी में सुरक्षित है।
- source_word: חַסְדְּךָ
  choice: आपका अटल प्रेम
  rationale: חסד में निष्ठावान, टिकाऊ और संबंधपरक प्रेम का भाव है; ‘अटल प्रेम’ इसे संक्षेप और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: לְעוֹלָם
  choice: सदा बना रहता है
  rationale: यह חסד की स्थायी निरंतरता व्यक्त करता है और हिन्दी में पूर्ण, स्वाभाविक वाक्य बनाता है।
- source_word: מַעֲשֵׂי יָדֶיךָ
  choice: अपने हाथों के कामों को
  rationale: इब्रानी संज्ञा बहुवचन है; बहुवचन रखने से वाक्यांश का व्यापक संकेत सुरक्षित रहता है।
- source_word: אַל תֶּרֶף
  choice: मत छोड़िए
  rationale: רפה यहाँ हाथ ढीला करने, छोड़ देने या त्याग देने का भाव रखता है। ‘मत छोड़िए’ प्रार्थना की विनती को सरल और स्वाभाविक ढंग से व्यक्त करता है।
theological_decisions:
- issue: יִגְמֹר בַּעֲדִי में पूरी की जाने वाली बात का आशय
  choice: याहवे भजनकार के लिए अपना उद्देश्य पूरा करेगा
  alternative: याहवे वह पूरा करेगा जो भजनकार से संबंधित है
  rationale: इब्रानी में ‘उद्देश्य’ स्पष्ट रूप से नहीं लिखा है, पर हिन्दी में क्रिया को सहज बनाने के लिए इसे मुख्य पाठ में व्यक्त किया गया है। मूल की खुली अर्थ-सीमा वैकल्पिक अनुवाद में सुरक्षित रखी गई है।
- issue: מַעֲשֵׂי יָדֶיךָ का संदर्भ
  choice: परमेश्वर के हाथों के कामों के रूप में व्यापक रखा गया है
  alternative: विशेष रूप से भजनकार के जीवन में परमेश्वर का काम
  rationale: मूल बहुवचन वाक्यांश यह निश्चित नहीं करता कि संकेत केवल भजनकार की ओर है या परमेश्वर के कामों की ओर अधिक व्यापक रूप से; इसलिए मुख्य पाठ इस खुलेपन को बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, काव्यात्मक और श्रद्धापूर्ण शैली रखी गई है। परमेश्वर को संबोधित करते समय आदरसूचक ‘आप’ और ‘मत छोड़िए’ का प्रयोग किया गया है।
