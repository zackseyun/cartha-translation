lexical_decisions:
- source_word: נֶאֱלַמְתִּי
  choice: मैं मौन हो गया हूँ
  rationale: निफ़अल रूप चुप या मूक हो जाने की परिणामी अवस्था व्यक्त करता है। यह चयन स्वाभाविक हिन्दी में उस अवस्था को रखता है और किसी बाहरी कर्ता को अनावश्यक रूप से स्पष्ट नहीं करता।
- source_word: לֹא אֶפְתַּח פִּי
  choice: मैं अपना मुँह नहीं खोलता
  rationale: ‘मुँह खोलना’ बोलने का स्वाभाविक मुहावरा है। अपूर्ण क्रिया को यहाँ भजनकार की वर्तमान मौन मुद्रा के रूप में व्यक्त किया गया है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यह भजनकार के मौन रहने का कारण प्रस्तुत करता है।
- source_word: אַתָּה
  choice: तूने
  rationale: इब्रानी में सर्वनाम स्पष्ट और बलयुक्त है। परमेश्वर को प्रत्यक्ष संबोधन होने के कारण हिन्दी काव्य-बाइबलीय शैली में ‘तू’ रखा गया है।
- source_word: עָשִׂיתָ
  choice: यह तूने किया है
  rationale: עשה का अर्थ व्यापक रूप से ‘करना’ है। हिन्दी में वाक्य स्वाभाविक बनाने के लिए ‘यह’ जोड़ा गया है, पर उसका आशय अनिर्दिष्ट रखा गया है।
theological_decisions:
- issue: עָשִׂיתָ का अनकहा कर्म और परमेश्वर की भूमिका
  choice: क्योंकि यह तूने किया है
  alternative: क्योंकि तूने ही ऐसा किया है / क्योंकि तूने कार्य किया है
  rationale: मूल इब्रानी में क्रिया का कर्म नहीं बताया गया। ‘यह’ प्रसंग की परिस्थिति की ओर संकेत करता है, किंतु उसे दुःख, दंड या किसी विशेष घटना के रूप में परिभाषित नहीं करता; इस प्रकार परमेश्वर की भूमिका से जुड़ा मूल तनाव बना रहता है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सहज हिन्दी। ‘मौन हो गया हूँ’ काव्यात्मक संदर्भ के अनुकूल है; ‘अपना मुँह नहीं खोलता’ मूल मुहावरे को निकटता से रखता है। परमेश्वर के प्रत्यक्ष संबोधन में ‘तू’ का प्रयोग किया गया है।
