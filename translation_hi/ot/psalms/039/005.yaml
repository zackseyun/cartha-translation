source:
  edition: WLC
  text: הִנֵּ֤ה טְפָח֨וֹת נָ֘תַ֤תָּה יָמַ֗/י וְ/חֶלְדִּ֣/י כְ/אַ֣יִן נֶגְדֶּ֑/ךָ אַ֥ךְ כָּֽל הֶ֥בֶל כָּל אָ֝דָ֗ם נִצָּ֥ב סֶֽלָה׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/039/005.yaml
  text: Behold[a], you have made my days a few handbreadths, and my lifetime is as nothing before you; surely every man, though standing firm, is altogether vapor[c][b]. Selah
translation:
  language: hi
  text: देख, तूने मेरे दिनों की माप कुछ बालिश्त ठहराई है, और मेरा जीवनकाल तेरे सामने मानो कुछ भी नहीं है; निश्चय ही हर मनुष्य, चाहे वह दृढ़ खड़ा हो, मात्र साँस है।[a][b] सेला।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “दृढ़ खड़ा हो” का अनुवाद “खड़ा हो” या “स्थापित हो” भी हो सकता है। भाव यह हो सकता है कि सुरक्षित दिखाई देने वाला मनुष्य भी क्षणभंगुर है।
    reason: lexical_alternative
  - marker: b
    text: “साँस” के लिए इब्रानी शब्द का अर्थ “वाष्प” या “व्यर्थता” भी हो सकता है; यह किसी क्षणभंगुर और सारहीन वस्तु का बिंब है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: देख
  rationale: ध्यान खींचने वाले उद्गार को आधुनिक, स्वाभाविक और काव्यात्मक हिन्दी में व्यक्त करता है।
- source_word: טְפָחוֹת
  choice: बस कुछ बालिश्त
  rationale: मूल में हाथ की चौड़ाई पर आधारित छोटी माप का ठोस बिंब है; ‘बस कुछ’ जीवन की अत्यल्प अवधि स्पष्ट करता है।
- source_word: נָתַתָּה
  choice: बनाया है
  rationale: इस प्रसंग में परमेश्वर द्वारा दिनों की माप या अवधि नियत किए जाने का भाव है।
- source_word: יָמַי
  choice: मेरे दिनों को
  rationale: जीवन की अवधि के लिए प्रयुक्त मूल इब्रानी बहुवचन मुहावरे को बनाए रखता है।
- source_word: וְחֶלְדִּי
  choice: मेरा जीवनकाल
  rationale: संसार में जीवन की अवधि को स्पष्ट और सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: כְאַיִן
  choice: मानो कुछ भी नहीं
  rationale: परमेश्वर के सामने मानवीय जीवन की नगण्यता की तुलना को स्वाभाविक हिन्दी में रखता है।
- source_word: נֶגְדֶּךָ
  choice: तेरे सामने
  rationale: परमेश्वर की उपस्थिति और उसके परिप्रेक्ष्य, दोनों अर्थों को संक्षेप में बनाए रखता है।
- source_word: אַךְ
  choice: निश्चय ही
  rationale: सामान्य निष्कर्ष पर दिए गए इब्रानी बल को व्यक्त करता है।
- source_word: כָּל אָדָם
  choice: हर मनुष्य
  rationale: אָדָם के जातिवाचक एकवचन और समस्त मानवता पर लागू कथन को स्वाभाविक, समावेशी हिन्दी में व्यक्त करता है।
- source_word: נִצָּב
  choice: चाहे वह दृढ़ खड़ा हो
  rationale: ‘खड़ा/स्थापित’ के मूल बिंब को बचाते हुए उस संभावित विरोधाभास को व्यक्त करता है कि सुरक्षित दिखने वाला मनुष्य भी क्षणभंगुर है।
- source_word: כָּל הֶבֶל
  choice: केवल भाप ही है
  rationale: הֶבֶל के क्षणभंगुर, पकड़ में न आने वाले ठोस बिंब को बनाए रखता है; साथ ही כָּל की समग्रता को ‘केवल…ही’ से व्यक्त करता है।
- source_word: סֶלָה
  choice: सेला
  rationale: इस संगीतात्मक या उपासना-संबंधी संकेत का ठीक अर्थ अनिश्चित होने के कारण पारंपरिक लिप्यंतरण रखा गया है।
theological_decisions:
- issue: אָדָם का जातिवाचक अर्थ
  choice: हर मनुष्य
  alternative: हर पुरुष / सारी मानवजाति
  rationale: यहाँ कथन किसी एक लिंग तक सीमित नहीं, बल्कि प्रत्येक मानव पर लागू है; ‘हर मनुष्य’ मूल के एकवचन रूप और व्यापक अर्थ दोनों को सुरक्षित रखता है।
- issue: נִצָּב का संबंध और भाव
  choice: चाहे वह दृढ़ खड़ा हो
  alternative: अपनी उत्तम दशा में / केवल खड़ा हुआ
  rationale: सहभागी रूप ‘खड़ा, स्थित, स्थापित’ के अर्थ दे सकता है। रियायती वाक्य-विन्यास प्रसंग की विडंबना दिखाता है, पर इसे मुख्य पाठ में रखते हुए पादटिप्पणी में शाब्दिक विकल्प दिया गया है।
- issue: הֶבֶל का रूपक
  choice: भाप
  alternative: साँस / व्यर्थता
  rationale: ठोस रूपक को अमूर्त ‘व्यर्थता’ में बदलने के बजाय जीवन की अस्थिरता और क्षणभंगुरता की मूल छवि सुरक्षित रखी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण काव्यात्मक रूप अपनाया गया है। परमेश्वर के लिए निकट और पारंपरिक एकवचन ‘तू/तेरे’ रखा गया है। ‘बालिश्त’ मूल की ठोस प्राचीन माप को बचाता है, जबकि आसपास की भाषा सामान्य पाठक के लिए सरल रखी गई है।
