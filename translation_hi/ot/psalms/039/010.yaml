  text: Remove your plague from me[d][c][b][a]; by the blow of your hand I am consumed.
translation:
  language: hi
  text: अपनी मार मुझ पर से हटा दे[a]; तेरे हाथ के प्रहार से मैं चुक गया हूँ[b][c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘अपना प्रहार’ अथवा ‘अपनी पीड़ा’।
    reason: lexical_alternative
  - marker: b
    text: या ‘तेरे हाथ के आक्रमण से’ अथवा ‘तेरे हाथ के विरोध से’।
    reason: lexical_alternative
  - marker: c
    text: या ‘मैं क्षीण हो गया हूँ’ अथवा ‘मैं समाप्त हो गया हूँ’।
    reason: lexical_alternative
lexical_decisions:
- source_word: הָסֵר
  choice: हटा ले
  rationale: हिफ़ील आज्ञार्थक रूप सीधी विनती व्यक्त करता है। ‘हटा ले’ आधुनिक हिन्दी में स्वाभाविक है और आज्ञार्थक बल बनाए रखता है।
- source_word: מֵעָלַי
  choice: मुझ पर से
  rationale: इसमें ‘से’ और ‘मेरे ऊपर’ दोनों स्थानिक तत्व हैं। ‘मुझ पर से’ उन्हें स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: נִגְעֶךָ
  choice: अपनी मार
  rationale: נגע का अर्थ मार, विपत्ति या प्रकोप हो सकता है। ‘मार’ यहाँ परमेश्वर से आई पीड़ा को व्यक्त करता है, पर उसे किसी निश्चित रोग के रूप में सीमित नहीं करता।
- source_word: מִתִּגְרַת
  choice: के प्रहार से
  rationale: תגרה विरोध, आक्रमण या झटके जैसी बलपूर्ण कार्रवाई सूचित करता है। ‘हाथ’ के साथ ‘प्रहार’ हिन्दी में सजीव और स्वाभाविक है।
- source_word: יָדְךָ
  choice: तेरे हाथ
  rationale: ईश्वरीय कार्य और सामर्थ्य का मानवाकार बिंब मूल के अनुसार बनाए रखा गया है।
- source_word: אֲנִי כָלִיתִי
  choice: मैं मिटता जा रहा हूँ
  rationale: כלה समाप्त होने, चुक जाने या नष्ट होने की दशा व्यक्त कर सकता है। प्रगतिशील हिन्दी वाक्यांश भजनकार के क्षीण होते जाने का भाव देता है, बिना पूर्ण विनाश को अनिवार्य ठहराए।
theological_decisions:
- issue: נִגְעֶךָ में पीड़ा का स्वरूप
  choice: ‘अपनी मार’—पीड़ा को परमेश्वर की ओर से आया हुआ बताया गया है, पर उसे विशेष रूप से रोग या दण्ड नहीं कहा गया।
  alternative: ‘अपना प्रकोप’ या ‘अपनी दी हुई पीड़ा’
  rationale: इब्रानी पद पीड़ा का सटीक प्रकार निर्धारित नहीं करता। अनुवाद परमेश्वर की प्रत्यक्ष भूमिका और पाठ की तनावपूर्ण भाषा बनाए रखता है, पर अतिरिक्त धर्मवैज्ञानिक निष्कर्ष नहीं जोड़ता।
- issue: מִתִּגְרַת יָדְךָ में ईश्वरीय हाथ की क्रिया
  choice: ‘तेरे हाथ के प्रहार से’
  alternative: ‘तेरे हाथ के आक्रमण से’ या ‘तेरे हाथ के विरोध से’
  rationale: ‘प्रहार’ बलपूर्ण कार्रवाई को व्यक्त करता है और ‘हाथ’ का मूल बिंब बनाए रखता है; यह क्रिया की प्रकृति को आवश्यकता से अधिक सिद्धान्तबद्ध नहीं करता।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और प्रार्थनात्मक हिन्दी। ‘मुझ पर से’ मूल की स्थानिक छवि रखता है; ‘मार’ तथा ‘प्रहार’ साथ आने पर भी क्रमशः पीड़ा और उसके साधन को व्यक्त करते हैं।
