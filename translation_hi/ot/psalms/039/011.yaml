  text: בְּֽ/תוֹכָ֘ח֤וֹת עַל עָוֺ֨ן יִסַּ֬רְתָּ אִ֗ישׁ וַ/תֶּ֣מֶס כָּ/עָ֣שׁ חֲמוּד֑/וֹ אַ֤ךְ הֶ֖בֶל כָּל אָדָ֣ם סֶֽלָה־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/039/011.yaml
  text: With rebukes for iniquity you discipline a man[a], and like a moth you consume what is precious to him; surely every man is vapor[b]. Selah
translation:
  language: hi
  text: दोष के कारण तू डाँट-फटकार से मनुष्य को अनुशासित करता है; पतंगे की तरह तू उसकी प्रिय वस्तु को क्षीण कर देता है[a]। निश्चय ही हर मनुष्य वाष्प मात्र है[b]। सेला
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इसे इस प्रकार भी समझा जा सकता है: ‘तू उसकी प्रिय वस्तु को पतंगे की तरह क्षीण कर देता है।’ ‘प्रिय वस्तु’ के लिए प्रयुक्त इब्रानी शब्द विशेष रूप से ‘उसकी सुंदरता’ या अधिक व्यापक रूप से ‘उसकी बहुमूल्य वस्तुएँ’ भी दर्शा सकता है।'
    reason: lexical_alternative
  - marker: b
    text: ‘वाष्प’ इब्रानी शब्द हेवेल का अनुवाद है। यह साँस या भाप जैसी क्षणभंगुरता और अस्थिरता को दर्शाता है; परंपरागत अनुवादों में प्रायः ‘व्यर्थता’ मिलता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּתוֹכָחוֹת
  choice: डाँट-फटकार से
  rationale: बहुवचन संज्ञा תוכחות सुधारने वाली फटकारों को व्यक्त करती है, और בְּ का साधनवाचक अर्थ ‘से’ द्वारा सुरक्षित रहता है।
- source_word: עַל עָוֺן
  choice: अपराध के कारण
  rationale: עָוֺן यहाँ नैतिक अपराध अथवा दोष को और עַל अनुशासन का कारण सूचित करता है।
- source_word: יִסַּרְתָּ
  choice: तू ... अनुशासित करता है
  rationale: יסר दंडात्मक परंतु सुधारक अनुशासन का बोध कराता है; ‘अनुशासित करता है’ आधुनिक और स्पष्ट है।
- source_word: אִישׁ
  choice: मनुष्य
  rationale: אִישׁ पुल्लिंग एकवचन है, पर यहाँ प्रतिनिधिक अर्थ में है; ‘मनुष्य’ उस रूप और व्यापक मानवीय संदर्भ दोनों को स्वाभाविक हिंदी में रखता है।
- source_word: וַתֶּמֶס
  choice: तू ... नष्ट कर देता है
  rationale: מסס गलाने, क्षीण करने या मिटा देने का भाव रखता है। पतंगे के बिंब के साथ ‘नष्ट कर देता है’ परिणाम को सहज हिंदी में व्यक्त करता है।
- source_word: כָּעָשׁ
  choice: पतंगे के समान
  rationale: तुलनासूचक כְּ और עָשׁ का बिंब धीरे-धीरे खा जाने वाले पतंगे का है।
- source_word: חֲמוּדוֹ
  choice: उसकी प्रिय वस्तु
  rationale: חֲמוּד किसी वांछनीय या मूल्यवान वस्तु को दर्शाता है; यह रूप अर्थ को केवल शारीरिक सुंदरता तक सीमित नहीं करता।
- source_word: אַךְ
  choice: निश्चय ही
  rationale: אַךְ यहाँ गंभीर और बलयुक्त निष्कर्ष प्रस्तुत करता है।
- source_word: הֶבֶל
  choice: वाष्प मात्र
  rationale: הֶבֶל साँस या वाष्प जैसी क्षणिक और अस्थिर वस्तु का मूर्त बिंब देता है; ‘वाष्प’ उसे ‘व्यर्थता’ जैसे अमूर्त अर्थ में सीमित नहीं करता।
- source_word: כָּל אָדָם
  choice: हर मनुष्य
  rationale: אָדָם यहाँ समस्त मानवता के प्रत्येक सदस्य के लिए प्रतिनिधिक एकवचन है।
- source_word: סֶלָה
  choice: सेला
  rationale: इस संगीतात्मक या उपासना-संबंधी पद का सटीक अर्थ अनिश्चित है, इसलिए इसका लिप्यंतरण किया गया है।
theological_decisions:
- issue: प्रतिनिधिक मानवीय संज्ञाएँ
  choice: אִישׁ और אָדָם दोनों के लिए ‘मनुष्य’
  alternative: ‘आदमी’ अथवा ‘हर व्यक्ति’
  rationale: ‘मनुष्य’ मूल की एकवचन प्रतिनिधिक भाषा को बनाए रखते हुए आधुनिक हिंदी में पूरे मानव समुदाय का स्वाभाविक बोध कराता है।
- issue: पतंगे की उपमा का संबंध
  choice: परमेश्वर की नष्ट करने वाली क्रिया से उपमा को जोड़ना
  alternative: मनुष्य की प्रिय वस्तु स्वयं पतंगे की तरह क्षीण हो जाती है
  rationale: शब्दक्रम में ‘तू नष्ट कर देता है’ के बाद ‘पतंगे के समान’ आता है, पर उपमा के सटीक संबंध में कुछ व्याकरणिक लचीलापन है; मुख्य पाठ निकटतम सहज अर्थ देता है और पादटिप्पणी दूसरे संभव संबंध को सुरक्षित रखती है।
- issue: הֶבֶל का मानवीय चित्रण
  choice: ‘वाष्प मात्र’
  alternative: ‘व्यर्थ’, ‘साँस मात्र’ या ‘क्षणभंगुर’
  rationale: मूर्त बिंब मनुष्य की क्षणभंगुरता और असारता दोनों के बीच मूल तनाव को बनाए रखता है, बिना केवल नैतिक ‘व्यर्थता’ का अर्थ थोपे।
translation_notes:
  register: भाषा आधुनिक मानक हिंदी में, गंभीर किंतु सहज रखी गई है। परमेश्वर को संबोधित एकवचन निकट संबोधन ‘तू’ भजन की सीधी प्रार्थनात्मक शैली के अनुरूप है। ‘डाँट-फटकार’, ‘अनुशासित’ और ‘प्रिय वस्तु’ सामान्य पाठक के लिए स्पष्ट हैं, जबकि ‘वाष्प’ काव्यात्मक बिंब और मूल की अर्थगत गहराई बनाए रखता है।
