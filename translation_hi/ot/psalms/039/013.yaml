  yaml_path: translation/ot/psalms/039/013.yaml
  text: Look away from me[a], so that I may smile again before I go and am no more.
translation:
  language: hi
  text: मुझ से अपनी दृष्टि हटा ले[a], ताकि मैं फिर से प्रसन्न हो सकूँ, इससे पहले कि मैं चला जाऊँ और न रहूँ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “ताकि मैं फिर से शक्ति पा सकूँ।” इब्रानी क्रिया में फिर उजला या प्रसन्न होने, राहत पाने अथवा सँभलने का भाव हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הָשַׁע מִמֶּנִּי
  choice: मुझ पर से अपनी दृष्टि हटा ले
  rationale: आज्ञार्थक क्रिया और पृथक्करणसूचक पद मिलकर परमेश्वर से अपना ध्यान अथवा क्लेशकारी दृष्टि हटाने की विनती व्यक्त करते हैं। यह हिंदी में स्वाभाविक है और विलाप के संदर्भ के अनुकूल है।
- source_word: וְאַבְלִיגָה
  choice: ताकि मैं फिर से प्रसन्न हो सकूँ
  rationale: בלג में फिर उजला या प्रफुल्ल होना, राहत पाना अथवा शक्ति सँभालना निहित हो सकता है। मुख्य पाठ में स्वाभाविक हिंदी रखी गई है और अर्थ-सीमा पादटिप्पणी में सुरक्षित है।
- source_word: בְּטֶרֶם
  choice: इससे पहले कि
  rationale: यह कालसूचक पद आगामी घटना से पूर्व के समय को दर्शाता है; आधुनिक हिंदी में यही स्पष्ट और सहज रूप है।
- source_word: אֵלֵךְ
  choice: मैं चला जाऊँ
  rationale: הלך का मूल अर्थ ‘जाना’ है। यहाँ यह मृत्यु की ओर संकेत करता है, पर इब्रानी की अप्रत्यक्ष और संयत अभिव्यक्ति बनाए रखने के लिए ‘चला जाऊँ’ रखा गया है।
- source_word: וְאֵינֶנִּי
  choice: और न रहूँ
  rationale: यह अभिव्यक्ति उपस्थित अथवा जीवित न रहने का संकेत देती है। ‘न रहूँ’ हिंदी में संक्षिप्त, गंभीर और काव्यात्मक है, तथा मृत्यु को मूल पाठ से अधिक स्पष्ट नहीं बनाता।
theological_decisions:
- issue: אֵלֵךְ וְאֵינֶנִּי में मृत्यु के संकेत को कितना स्पष्ट किया जाए
  choice: ‘इससे पहले कि मैं चला जाऊँ और न रहूँ’ के रूप में अप्रत्यक्ष अभिव्यक्ति बनाए रखना
  alternative: ‘इससे पहले कि मैं मर जाऊँ और चला जाऊँ’
  rationale: संदर्भ मृत्यु की ओर संकेत करता है, किंतु इब्रानी उसे सीधे ‘मरना’ नहीं कहता। इसलिए उसकी काव्यात्मक संयमता और वास्तविक अस्पष्टता सुरक्षित रखी गई है।
translation_notes:
  register: आधुनिक मानक हिंदी में सम्मानपूर्ण, प्रार्थनात्मक और काव्यात्मक शैली रखी गई है। परमेश्वर को संबोधन में निकटता और मूल इब्रानी के एकवचन रूप के अनुरूप ‘ले’ प्रयुक्त है; शब्दावली साधारण पाठक के लिए बोधगम्य है।
