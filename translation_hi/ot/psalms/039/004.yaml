  verdict: revise
  source_fidelity: The draft incorrectly adds “कब” (“when”) to קִצִּי, which denotes “my end/limit” but does not explicitly ask when it will occur. The remaining clauses convey the imperative, the measure-of-days question, and the final difficult expression appropriately.
  naturalness: The verse is generally natural and prayerful. Recasting the final cohortative as “ताकि मैं जान सकूँ” is more idiomatic Hindi than “मुझे जानने दे” and clearly expresses the intended result/purpose.
  terminology: “याहवे” is a clear modern Hindi transliteration of Yahweh. “क्षणभंगुर” suitably conveys the contextual sense of the difficult חָדֵל, while the footnote preserves frailty and transience alternatives.
  issues:
  - severity: medium
    issue: “मेरा अंत कब होगा” adds an explicit temporal question.
    rationale: The Hebrew says “my end” (קִצִּי), not “when my end will be.” The context permits reflection on life’s endpoint, but the added “कब” narrows and expands the wording beyond the source.
  - severity: low
    issue: “मुझे जानने दे” is less idiomatic for the Hebrew cohortative in this context.
    rationale: The cohortative expresses the desired outcome of the request. “ताकि मैं जान सकूँ” is natural Hindi and retains that purposive nuance.
