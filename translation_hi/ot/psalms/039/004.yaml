source:
  edition: WLC
  text: הוֹדִ֘יעֵ֤/נִי יְהוָ֨ה קִצִּ֗/י וּ/מִדַּ֣ת יָמַ֣/י מַה הִ֑יא אֵ֝דְעָ֗ה מֶה חָדֵ֥ל אָֽנִי׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/039/004.yaml
  text: O Yahweh[a], make me know my end and what is the measure of my days; let me know how fleeting I am.
translation:
  language: hi
  text: हे याहवे, मुझे बता कि मेरा अंत क्या है और मेरे दिनों की माप क्या है; ताकि मैं जान सकूँ कि मैं कितना क्षणभंगुर हूँ।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मैं कितना दुर्बल हूँ” अथवा “मैं कितना अस्थायी हूँ।” इब्रानी अभिव्यक्ति संक्षिप्त है और मनुष्य की दुर्बलता या जीवन की अल्पता पर बल दे सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹדִיעֵנִי
  choice: मुझे बता
  rationale: ידע के हिफ़ील आज्ञार्थक रूप का कारणवाचक भाव है—‘मुझे जानने योग्य बना/मुझे बता।’ आधुनिक हिन्दी में ‘मुझे बता’ स्वाभाविक और स्पष्ट है।
- source_word: יְהוָה
  choice: हे यहवे
  rationale: मूल पाठ में परमेश्वर का व्यक्तिगत नाम יהוה है; हिन्दी में संबोधन के साथ ‘हे यहवे’ उसका लिप्यंतरण सुरक्षित रखता है।
- source_word: קִצִּי
  choice: मेरा अंत कब होगा
  rationale: קֵץ का मूल अर्थ ‘अंत/सीमा’ है। हिन्दी में ‘मेरा अंत कब होगा’ जीवन के अंतिम बिंदु का आशय स्वाभाविक ढंग से व्यक्त करता है, यद्यपि ‘कब’ प्रसंगगत रूप से स्पष्ट किया गया है।
- source_word: וּמִדַּת יָמַי מַה הִיא
  choice: और मेरे दिनों की माप क्या है
  rationale: מִדָּה की ‘माप’ वाली मूल छवि को बनाए रखा गया है; प्रश्नवाचक संरचना भी सुरक्षित है।
- source_word: אֵדְעָה
  choice: मुझे जानने दे
  rationale: सहोर्टेटिव रूप इच्छित परिणाम अथवा उद्देश्य व्यक्त करता है; ‘मुझे जानने दे’ उस भाव को सीधे रखता है।
- source_word: מֶה חָדֵל אָֽנִי
  choice: मैं कितना क्षणभंगुर हूँ
  rationale: חָדֵל संक्षिप्त और अर्थगत रूप से कठिन है। इस प्रसंग में यह जीवन की अस्थिरता और अल्पता की ओर संकेत करता है; ‘क्षणभंगुर’ इसे सहज हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: יהוה का अनुवाद
  choice: यहवे
  alternative: यहोवा / प्रभु
  rationale: यहाँ मूल इब्रानी पाठ में उपाधि नहीं, चतुरक्षरीय व्यक्तिगत नाम है। ‘यहवे’ उसका प्रचलित विद्वत्तापरक लिप्यंतरण है और नाम को उपाधि में नहीं बदलता।
- issue: מֶה חָדֵל אָֽנִי का आशय
  choice: मैं कितना क्षणभंगुर हूँ
  alternative: मैं कितना दुर्बल हूँ / मेरा जीवन कितना अस्थायी है
  rationale: पद का निकट प्रसंग दिनों की माप और जीवन की अल्पता पर केंद्रित है, फिर भी इब्रानी अभिव्यक्ति दुर्बलता या अस्थायित्व पर बल दे सकती है; इसलिए वैकल्पिक अर्थ पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: आधुनिक मानक हिन्दी, प्रार्थनात्मक और गरिमापूर्ण शैली। ‘माप’ की काव्यात्मक मूल छवि तथा कठिन अंतिम पदबंध की अर्थगत खुलावट बनाए रखी गई है।
