  edition: WLC
  text: אַךְ בְּ/צֶ֤לֶם יִֽתְהַלֶּךְ אִ֗ישׁ אַךְ הֶ֥בֶל יֶהֱמָי֑וּ/ן יִ֝צְבֹּ֗ר וְֽ/לֹא יֵדַ֥ע מִי אֹסְפָֽ/ם־׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/039/006.yaml
  text: Surely a man walks about as a shadow[a]; surely they are in turmoil in vain[c][b]. He heaps up wealth and does not know who will gather it.
translation:
  language: hi
  text: 'निश्चय ही मनुष्य छाया-सा[a] चलता-फिरता है;

    निश्चय ही लोग व्यर्थ ही कोलाहल मचाते हैं[b]।

    वह धन[c] बटोरता जाता है

    और नहीं जानता कि उसे कौन समेटेगा[d]।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘प्रतिरूप-सा,’ ‘केवल आभास-सा’ अथवा ‘प्रेत-छाया-सा’; इब्रानी शब्द का मूल अर्थ ‘छवि’ या ‘प्रतिरूप’ है और यहाँ असार मानव-अस्तित्व का बोध कराता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप में, ‘वे कोलाहल मचाते हैं’; एकवचन ‘मनुष्य’ के बाद बहुवचन क्रिया संभवतः सामान्य रूप से मानवजाति की ओर संकेत करती है।
    reason: grammatical_ambiguity
  - marker: c
    text: ‘धन’ मूल पाठ में स्पष्ट रूप से नहीं है; आगे के संदर्भ से संचित संपत्ति या वस्तुएँ अभिप्रेत हैं।
    reason: implicit_object
  - marker: d
    text: इब्रानी में ‘उन्हें कौन समेटेगा,’ अर्थात उसकी बटोरी हुई वस्तुओं को।
    reason: grammatical_number
lexical_decisions:
- source_word: אַךְ
  choice: निश्चय ही
  rationale: दोनों बार प्रयुक्त बलसूचक अव्यय की पुनरावृत्ति और कथन की दृढ़ता को बनाए रखता है।
- source_word: בְּצֶלֶם
  choice: छाया-सा
  rationale: צֶלֶם का मूल अर्थ ‘प्रतिरूप/छवि’ है, पर यहाँ क्षणभंगुर और असार मानव-अस्तित्व का बिंब है; ‘छाया-सा’ हिन्दी में इसे स्वाभाविक रूप से व्यक्त करता है।
- source_word: יִתְהַלֶּךְ אִישׁ
  choice: मनुष्य ... चलता-फिरता है
  rationale: हित्पएल रूप इधर-उधर चलते रहने का भाव देता है। ‘मनुष्य’ एकवचन पुरुषवाचक रूप के साथ उसके सामान्य मानव-संदर्भ को व्यक्त करता है।
- source_word: הֶבֶל
  choice: व्यर्थ ही
  rationale: यहाँ ‘साँस/असारता’ agitation वाले खंड को क्रियाविशेषणात्मक रूप से व्यर्थता का भाव देता है।
- source_word: יֶהֱמָיוּן
  choice: लोग ... हलचल करते हैं
  rationale: क्रिया बहुवचन है और शोर, बेचैनी या व्यस्त हलचल का अर्थ देती है। ‘लोग’ जोड़कर इब्रानी के बहुवचन को स्पष्ट और स्वाभाविक हिन्दी में रखा गया है।
- source_word: יִצְבֹּר
  choice: बटोरता जाता है
  rationale: צבר का अर्थ ढेर लगाना या जमा करना है; यह रूप निरंतर संचय का चित्र बनाए रखता है।
- source_word: וְלֹא יֵדַע
  choice: और नहीं जानता
  rationale: सरल संयोजन और नकार को इब्रानी के अनुरूप रखा गया है।
- source_word: מִי אֹסְפָם
  choice: उसे कौन समेटेगा
  rationale: मूल में प्रत्यय बहुवचन ‘उन्हें’ है और संचित वस्तुओं की ओर संकेत करता है; हिन्दी में सामूहिक ‘धन’ के साथ एकवचन ‘उसे’ स्वाभाविक है।
theological_decisions:
- issue: אִישׁ में प्रतिनिधिक पुल्लिंग
  choice: मनुष्य
  alternative: आदमी / व्यक्ति
  rationale: एकवचन मानव-प्रतिनिधि को बनाए रखते हुए ‘मनुष्य’ आधुनिक हिन्दी में पूरे मानव जीवन के सामान्य संदर्भ को स्वाभाविक और गरिमापूर्ण ढंग से व्यक्त करता है।
- issue: एकवचन ‘मनुष्य’ के बाद बहुवचन יֶהֱמָיוּן
  choice: लोग ... हलचल करते हैं
  alternative: वह ... हलचल करता है
  rationale: मूल पाठ के वास्तविक बहुवचन को एकवचन में बदलने के बजाय सामान्य मानव समुदाय की ओर संकेत करने वाला बहुवचन रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का काव्यात्मक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रूप। पंक्ति-विन्यास इब्रानी समानांतरता को उभारता है; ‘निश्चय ही’ की पुनरावृत्ति जानबूझकर सुरक्षित रखी गई है।
