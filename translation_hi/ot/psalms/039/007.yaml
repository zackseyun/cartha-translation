  yaml_path: translation/ot/psalms/039/007.yaml
  text: And now[a], Lord, what do I wait for? My hope is in you.
translation:
  language: hi
  text: और अब, हे प्रभु, मैं किसकी बाट जोहूँ?[a] मेरी आशा तुझ पर है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या अधिक शाब्दिक रूप में, “मैंने किसकी आशा की है?” इब्रानी क्रिया קוה में बाट जोहने और आशा करने, दोनों के भाव हो सकते हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: और अब
  rationale: संयोजक וְ और कालसूचक עַתָּה दोनों को स्वाभाविक हिन्दी में व्यक्त करता है और भजनकार के वर्तमान निष्कर्ष की ओर मोड़ बनाए रखता है।
- source_word: מַה
  choice: किसकी
  rationale: यह प्रश्नवाचक सर्वनाम यहाँ प्रतीक्षा के लक्ष्य के विषय में आलंकारिक प्रश्न बनाता है; हिन्दी में ‘मैं किसकी बाट जोहूँ?’ स्वाभाविक है।
- source_word: קִוִּיתִי
  choice: मैं ... बाट जोहूँ
  rationale: קוה में प्रतीक्षा और आशा, दोनों अर्थ समाए हैं। ‘बाट जोहूँ’ अपेक्षापूर्ण प्रतीक्षा को व्यक्त करता है, जबकि अगले वाक्य में ‘आशा’ उस अर्थ-संबंध को स्पष्ट रखती है।
- source_word: אֲדֹנָי
  choice: हे प्रभु
  rationale: ईश्वर को संबोधित करने वाला आदरसूचक स्वामित्व-पद है; सम्बोधन में ‘हे प्रभु’ आधुनिक, प्रतिष्ठित और स्पष्ट हिन्दी है।
- source_word: תּוֹחַלְתִּי
  choice: मेरी आशा
  rationale: यह संज्ञा आशा अथवा अपेक्षा दर्शाती है; संदर्भ में ‘मेरी आशा’ सबसे स्वाभाविक और केंद्रीय अर्थ है।
- source_word: לְךָ הִיא
  choice: तुझी पर है
  rationale: לְךָ आशा की दिशा अथवा उसके आधार को दर्शाता है और הִיא स्त्रीलिंग संज्ञा תּוֹחַלְתִּי को पुनः ग्रहण करता है। ‘तुझी पर है’ ईश्वर पर केंद्रित निर्भरता पर बल देते हुए हिन्दी में स्वाभाविक है।
theological_decisions:
- issue: ईश्वरीय उपाधि אֲדֹנָי का अनुवाद
  choice: हे प्रभु
  alternative: हे मेरे प्रभु
  rationale: אֲדֹנָי प्रचलित श्रद्धापूर्ण ईश्वरीय उपाधि है। ‘हे प्रभु’ उसका सामान्य उपाधिगत प्रयोग सुरक्षित रखता है और ऐतिहासिक प्रथम-पुरुष प्रत्यय को अनावश्यक रूप से स्वतंत्र ‘मेरे’ के रूप में नहीं उभारता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, काव्यात्मक किन्तु सामान्य पाठक के लिए सहज शैली। ‘बाट जोहूँ’ ने प्रतीक्षा और आशा के बीच इब्रानी अर्थ-संबंध को बनाए रखा है; परमेश्वर के सीधे सम्बोधन में एकवचन श्रद्धापूर्ण बाइबिलीय ‘तू’ रूप प्रयुक्त है।
