  text: אָמַ֗רְתִּי אֶֽשְׁמְרָ֣ה דְרָכַ/י֮ מֵ/חֲט֪וֹא בִ/לְשׁ֫וֹנִ֥/י אֶשְׁמְרָ֥ה לְ/פִ֥/י מַחְס֑וֹם בְּ/עֹ֖ד רָשָׁ֣ע לְ/נֶגְדִּֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/039/001.yaml
  text: I said[a], “I will guard my ways from sinning with my tongue; I will keep a muzzle for my mouth while the wicked is before me.”
translation:
  language: hi
  text: मैंने कहा, “मैं अपने मार्गों पर ध्यान रखूँगा कि अपनी जीभ से पाप न करूँ; जब तक दुष्ट[a] मेरे सामने है, मैं अपने मुँह पर लगाम रखूँगा।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “दुष्ट व्यक्ति।” इब्रानी शब्द पुल्लिंग एकवचन है।
    reason: मूल इब्रानी के पुल्लिंग एकवचन संज्ञात्मक विशेषण के व्याकरणिक रूप को स्पष्ट करता है और एक स्वाभाविक वैकल्पिक अनुवाद देता है।
lexical_decisions:
- source_word: אָמַרְתִּי
  choice: मैंने कहा
  rationale: यह אמר का प्रथम पुरुष एकवचन पूर्ण रूप है और भजनकार के पहले किए हुए निश्चय को सीधे कथन के रूप में प्रस्तुत करता है।
- source_word: אֶשְׁמְרָה דְרָכַי
  choice: मैं अपने मार्गों की चौकसी करूँगा
  rationale: שׁמר का रूप दृढ़ संकल्प व्यक्त करता है; ‘मार्ग’ जीवन-चाल या आचरण का इब्रानी रूपक बनाए रखता है।
- source_word: מֵחֲטוֹא בִלְשׁוֹנִי
  choice: ताकि अपनी जीभ से पाप न करूँ
  rationale: מן के साथ क्रियार्थक संज्ञा रोकथाम या बचाव का भाव देती है, और ב यहाँ जीभ को पाप के साधन के रूप में दिखाता है।
- source_word: מַחְסוֹם
  choice: लगाम
  rationale: शब्द मुँह को रोकने वाले बंधन या थूथनबंद को दर्शाता है। ‘लगाम’ आधुनिक हिन्दी में वाणी पर संयम का स्वाभाविक और सजीव रूपक है।
- source_word: בְּעוֹד
  choice: जब तक
  rationale: यह समकालिक अवधि को व्यक्त करता है; प्रसंग में दुष्ट की उपस्थिति की पूरी अवधि तक आत्मसंयम रखने का भाव स्वाभाविक है।
- source_word: רָשָׁע
  choice: दुष्ट जन
  rationale: पुल्लिंग एकवचन विशेषण यहाँ संज्ञा के रूप में प्रयुक्त है। ‘दुष्ट जन’ उसकी एकवचनता और व्यक्ति-संदर्भ को बनाए रखता है।
- source_word: לְנֶגְדִּי
  choice: मेरे सामने है
  rationale: वाक्यांश का अर्थ ‘मेरे सामने’ या ‘मेरी उपस्थिति में’ है; हिन्दी में ‘है’ जोड़ना स्वाभाविक है।
theological_decisions:
- issue: רָשָׁע का लिंग और वचन
  choice: दुष्ट जन
  alternative: दुष्ट; दुष्ट व्यक्ति
  rationale: इब्रानी रूप पुल्लिंग एकवचन है। ‘दुष्ट जन’ बिना अनावश्यक व्याख्या जोड़े किसी एक दुष्ट व्यक्ति का संकेत देता है, जबकि व्यापक प्रतिनिधिक अर्थ की संभावना को बंद नहीं करता।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी। ‘मार्गों’ और ‘जीभ’ की मूल बिंबात्मक भाषा रखी गई है; ‘मुँह पर लगाम’ संयम के ठोस इब्रानी बिंब को हिन्दी में स्वाभाविक ढंग से व्यक्त करता है।
