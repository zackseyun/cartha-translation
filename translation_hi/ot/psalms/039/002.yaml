revisions:
- from: मैं गूँगा बनकर मौन रहा; मैं भली बात कहने से भी चुप रहा[a], और मेरी पीड़ा भड़क उठी।
  to: मैं गूँगा बनकर मौन रहा; मैं भलाई से चुप रहा[a], और मेरी पीड़ा भड़क उठी।
  rationale: The revision retains the Hebrew’s parallel expressions for silence and the natural rendering of the psalmist’s intensified pain. It changes only the difficult מִטּוֹב phrase so that the main text does not prematurely resolve whether ‘good’ refers to good speech or to what is good more broadly. The footnote supplies both principal interpretive possibilities.
