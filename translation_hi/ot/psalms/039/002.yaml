lexical_decisions:
- source_word: נֶאֱלַמְתִּי
  choice: मैं गूँगा बनकर
  rationale: निफ़अल रूप गूँगा या बोलने में असमर्थ हो जाने की दशा व्यक्त करता है। यह अनुवाद यह तय नहीं करता कि मौन स्वेच्छा से था या विवशता से।
- source_word: דּוּמִיָּה
  choice: मौन रहा
  rationale: संज्ञा मौन अथवा निस्तब्धता को व्यक्त करती है। क्रियाविशेषणीय भाव को स्वाभाविक हिन्दी में रखते हुए यह पहले पद के समानांतर है।
- source_word: הֶחֱשֵׁיתִי
  choice: चुप रहा
  rationale: हिफ़ईल रूप चुप रहने या वाणी रोकने का भाव देता है। ‘चुप रहा’ पहले पद के ‘गूँगा बनकर मौन रहा’ से हल्का भेद बनाए रखता है।
- source_word: מִטּוֹב
  choice: भली बात कहने से भी
  rationale: संदर्भ में यह सम्भावित अर्थ सहज हिन्दी देता है, पर इब्रानी पदबंध संक्षिप्त और अस्पष्ट है; इसलिए व्यापक विकल्प पादटिप्पणी में सुरक्षित रखा गया है। ‘भी’ उस विडंबना को व्यक्त करता है कि भली बात तक नहीं कही गई।
- source_word: וּכְאֵבִי
  choice: और मेरी पीड़ा
  rationale: כְּאֵב शारीरिक या भावनात्मक पीड़ा दोनों को व्यक्त कर सकता है; ‘पीड़ा’ इस व्यापकता को बनाए रखता है।
- source_word: נֶעְכָּר
  choice: भड़क उठी
  rationale: निफ़अल रूप के उद्वेलित, व्याकुल या तीव्र हो उठने के भाव को यह स्वाभाविक हिन्दी में व्यक्त करता है और दबाए हुए दुःख की बढ़ती तीव्रता दिखाता है।
theological_decisions:
- issue: מִטּוֹב का आशय
  choice: मुख्य पाठ में ‘भली बात कहने से भी’
  alternative: ‘भलाई से चुप रहा’ अथवा ‘जो अच्छा है उससे अपने को दूर रखा’
  rationale: संदर्भ वाणी रोकने की ओर संकेत करता है, पर मूल पदबंध यह स्पष्ट नहीं करता कि ‘अच्छा’ अच्छी बात बोलने को कहता है या अच्छाई से व्यापक दूरी को। पादटिप्पणी इस वास्तविक अस्पष्टता को बनाए रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, काव्यात्मक और गरिमापूर्ण शैली रखी गई है। ‘गूँगा बनकर मौन रहा’ मूल की दोहरी मौन-अभिव्यक्ति को बचाता है; कठिन מִטּוֹב को मुख्य पाठ में पठनीय बनाया गया है और उसकी अस्पष्टता पादटिप्पणी में दी गई है।
