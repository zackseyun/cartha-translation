lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: संगीत-निर्देशक के लिए
  rationale: भजनों के शीर्षकों में यह पद संगीत-प्रस्तुति का निर्देशन करने वाले व्यक्ति को सूचित करता है। ‘संगीत-निर्देशक’ आधुनिक हिंदी में स्पष्ट है और इसे केवल गायक-मंडली तक सीमित नहीं करता।
- source_word: לִידוּתוּן
  choice: यदूतून के अनुसार
  rationale: पूर्वसर्ग ל संबंध, दिशा या संबद्धता व्यक्त कर सकता है। ‘के अनुसार’ धुन, शैली अथवा यदूतून से जुड़े संगीत-परंपरा के संभावित अर्थ को खुला रखता है; वैकल्पिक अर्थ पाद-टिप्पणी में दिए गए हैं।
- source_word: מִזְמוֹר
  choice: भजन
  rationale: मिज़्मोर के लिए ‘भजन’ हिंदी बाइबलीय परंपरा में स्वाभाविक और सुविज्ञात विधा-सूचक शब्द है तथा संगीतात्मक रचना का भाव देता है।
- source_word: לְדָוִד
  choice: दाऊद का
  rationale: ‘दाऊद का’ मूल इब्रानी के व्यापक संबंधसूचक अर्थ को बनाए रखता है और ‘दाऊद द्वारा’ कहकर लेखकत्व को अनावश्यक रूप से निश्चित नहीं करता।
