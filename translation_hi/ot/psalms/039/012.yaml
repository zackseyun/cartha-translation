  text: שִֽׁמְעָ֥/ה תְפִלָּתִ֨/י יְהוָ֡ה וְ/שַׁוְעָתִ֨/י הַאֲזִינָ/ה֮ אֶֽל דִּמְעָתִ֗/י אַֽל תֶּ֫חֱרַ֥שׁ כִּ֤י גֵ֣ר אָנֹכִ֣י עִמָּ֑/ךְ תּ֝וֹשָׁ֗ב כְּ/כָל אֲבוֹתָֽ/י־׀׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/039/012.yaml
  text: Hear my prayer[a], O Yahweh, and give ear to my cry; do not be deaf to my tears. For I am a sojourner with you[b], a resident alien like all my fathers.
translation:
  language: hi
  text: 'हे याहवे, मेरी प्रार्थना सुन,


    मेरी दुहाई पर कान दे;


    मेरे आँसुओं की अनसुनी न कर।[a]


    क्योंकि मैं तेरे साथ एक परदेशी हूँ,


    अपने सभी पुरखाओं[b] के समान एक अस्थायी निवासी।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मेरे आँसुओं पर चुप न रह।” इब्रानी क्रिया का अर्थ “चुप रहना” हो सकता है; लेकिन पहले की “सुन” और “कान दे” वाली विनतियों के कारण मुख्य पाठ में श्रवण-संबंधी अर्थ रखा गया है।
    reason: lexical_alternative
  - marker: b
    text: या, “पूर्वजों।” मूलतः, “पिताओं।”
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁמְעָה תְפִלָּתִי
  choice: मेरी प्रार्थना सुन
  rationale: आज्ञार्थक שׁמע और תְפִלָּה का सीधा, स्वाभाविक और प्रार्थना-साहित्य के अनुकूल अनुवाद।
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिवाचक नाम को उपाधि से बदलने के बजाय देवनागरी में लिप्यंतरित किया गया है।
- source_word: וְשַׁוְעָתִי הַאֲזִינָה
  choice: मेरी दुहाई पर कान लगा
  rationale: שַׁוְעָה संकट में सहायता के लिए की गई पुकार है; ‘दुहाई’ उसकी भावात्मक शक्ति रखती है, और ‘कान लगा’ אזן के श्रवण-बिंब तथा पहले पद के समानांतर भाव को बनाए रखता है।
- source_word: אֶל דִּמְעָתִי אַל תֶּחֱרַשׁ
  choice: मेरे आँसुओं के सामने चुप न रह
  rationale: חרשׁ के ‘मौन रहना’ अर्थ को आँसुओं के बिंब के साथ सीधे रखा गया है; हिंदी में यह परमेश्वर से निष्क्रिय न रहने की मार्मिक विनती व्यक्त करता है। श्रवण-संदर्भ पर आधारित ‘अनसुनी न कर’ को पादटिप्पणी में रखा गया है।
- source_word: גֵר אָנֹכִי עִמָּךְ
  choice: मैं तेरे साथ परदेशी हूँ
  rationale: גֵר को ‘परदेशी’ और עם को सीधे ‘साथ’ अनूदित किया गया है, ताकि परमेश्वर की उपस्थिति या अधिकार-क्षेत्र में भजनकार की गैर-स्थायी स्थिति का मूल तनाव व्याख्यात्मक विस्तार के बिना बना रहे।
- source_word: תּוֹשָׁב
  choice: प्रवासी
  rationale: यह ऐसे निवासी को सूचित करता है जिसे मूल निवासी का पूर्ण स्थायी दर्जा प्राप्त नहीं है। ‘प्रवासी’ आधुनिक हिंदी में बोधगम्य है और पहले शब्द ‘परदेशी’ से पर्याप्त भिन्न भी है।
- source_word: כְּכָל אֲבוֹתָי
  choice: अपने सभी पुरखाओं के समान
  rationale: אֲבוֹתָי का शाब्दिक पुरुषवाची पैतृक भाव ‘पुरखाओं’ से स्वाभाविक हिंदी में सुरक्षित रहता है; अधिक सामान्य ‘पूर्वजों’ को पादटिप्पणी में दिया गया है।
theological_decisions:
- issue: גֵר और תּוֹשָׁב की युग्मित सामाजिक स्थितियाँ
  choice: ‘परदेशी’ और ‘प्रवासी’ के रूप में अलग-अलग रखना
  alternative: दोनों को ‘परदेशी’ या ‘अजनबी’ जैसे लगभग एक ही अर्थ वाले शब्दों में मिला देना
  rationale: मूल पाठ दो संबद्ध किंतु भिन्न सामाजिक-वैधानिक शब्दों का प्रयोग करता है। भेद बनाए रखने से परमेश्वर के सामने मनुष्य की अस्थायी और अधिकार-विहीन स्थिति का आशय सपाट नहीं होता।
- issue: עִמָּךְ में परमेश्वर के साथ संबंध
  choice: ‘तेरे साथ’
  alternative: ‘तेरे सामने’ या ‘तेरे देश में’
  rationale: עם का सामान्य अर्थ ‘साथ’ है। अधिक स्पष्ट व्याख्या जोड़ने से पद की वास्तविक अस्पष्टता—परमेश्वर की उपस्थिति, संगति या उसके अधिकार-क्षेत्र में रहना—अनावश्यक रूप से सीमित हो जाती।
- issue: אֲבוֹתָי का अनुवाद
  choice: ‘मेरे पुरखाओं’
  alternative: ‘मेरे पूर्वजों’
  rationale: मूल का स्पष्ट पुरुषवाची बहुवचन मुख्य पाठ में रखा गया है, जबकि व्यापक और स्वाभाविक वैकल्पिक अभिव्यक्ति पादटिप्पणी में दी गई है।
translation_notes:
  register: आधुनिक मानक हिंदी का सरल, गरिमापूर्ण और काव्यात्मक प्रार्थना-रजिस्टर अपनाया गया है। संबोधन में निकटता और मूल के एकवचन रूप को बनाए रखने के लिए ‘तेरे’ प्रयोग हुआ है। पंक्ति-विन्यास इब्रानी समानांतरता और विनती से कारण की ओर बढ़ती संरचना को स्पष्ट करता है।
