  text: Deliver me from all my transgressions[a]; do not make me the reproach of a fool.
translation:
  language: hi
  text: मेरे सब अपराधों से मुझे छुड़ा; मुझे मूर्ख की निन्दा का पात्र न बना।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मुझे मूर्खता से जुड़ी लज्जा का पात्र न बना।” इब्रानी वाक्यांश का अर्थ या तो किसी मूर्ख की निन्दा का पात्र बनना हो सकता है, या मूर्खता से जुड़ी लज्जा का पात्र बनना।
    reason: lexical_alternative
lexical_decisions:
- source_word: מִכָּל פְּשָׁעַי
  choice: मेरे सब अपराधों से
  rationale: מִן के साथ כָּל सम्पूर्णता से छुटकारे का भाव देता है। פֶּשַׁע में नैतिक अपराध और विद्रोह दोनों की छाया है; आधुनिक हिन्दी में ‘अपराध’ स्वाभाविक रहते हुए इस नैतिक गम्भीरता को बनाए रखता है।
- source_word: הַצִּילֵנִי
  choice: मुझे छुड़ा
  rationale: נצל के हिफ़ील आज्ञार्थक रूप में बचाने या छुड़ाने की विनती है। ‘मुझे छुड़ा’ प्रार्थना की सीधी और गरिमापूर्ण भाषा है।
- source_word: חֶרְפַּת
  choice: निन्दा
  rationale: חֶרְפָּה अपमान, तिरस्कार या सार्वजनिक लज्जा को व्यक्त कर सकता है। ‘निन्दा’ यहाँ किसी मूर्ख द्वारा किए जाने वाले तिरस्कार के भाव को संक्षेप और स्वाभाविक रूप से व्यक्त करता है।
- source_word: נָבָל
  choice: मूर्ख
  rationale: भजन-साहित्य में נָבָל केवल बुद्धि की कमी नहीं, बल्कि नैतिक और आत्मिक विवेकहीनता भी दर्शाता है। ‘मूर्ख’ इस पारम्परिक तथा संक्षिप्त अर्थ को बिना अतिरिक्त व्याख्या जोड़े बनाए रखता है।
- source_word: אַל תְּשִׂימֵנִי
  choice: मुझे … का पात्र न बना
  rationale: שׂים यहाँ किसी को किसी दशा या स्थिति में कर देने का अर्थ रखता है। हिन्दी में ‘निन्दा का पात्र न बना’ यह स्पष्ट करता है कि प्रार्थी निन्दा का निशाना न बने।
theological_decisions:
- issue: मूर्ख और निन्दा के बीच सम्बन्ध
  choice: प्रार्थी परमेश्वर से विनती करता है कि वह उसे किसी नैतिक रूप से मूर्ख व्यक्ति की निन्दा का पात्र न बनने दे।
  alternative: प्रार्थी विनती करता है कि उसे मूर्खता से जुड़ी लज्जा या मूर्ख के हिस्से का अपमान न मिले।
  rationale: इब्रानी रचना חֶרְפַּת נָבָל का अर्थ ‘मूर्ख की निन्दा’ हो सकता है, पर सम्बन्ध की सटीक दिशा व्याकरण से पूरी तरह निश्चित नहीं होती। मुख्य पाठ सबसे स्वाभाविक व्यक्ति-से-व्यक्ति अर्थ देता है और पादटिप्पणी वास्तविक अस्पष्टता सुरक्षित रखती है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, संक्षिप्त प्रार्थनात्मक और गरिमापूर्ण रखी गई है। ‘छुड़ा’ और ‘न बना’ मूल के सीधे आज्ञार्थक निवेदन को बनाए रखते हैं; पादटिप्पणी इब्रानी सम्बन्धवाचक रचना की अस्पष्टता को खुला रखती है।
