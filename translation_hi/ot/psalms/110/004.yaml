source:
  edition: WLC
  text: נִשְׁבַּ֤ע יְהוָ֨ה וְ/לֹ֥א יִנָּחֵ֗ם אַתָּֽה כֹהֵ֥ן לְ/עוֹלָ֑ם עַל דִּ֝בְרָתִ֗י מַלְכִּי צֶֽדֶק׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/110/004.yaml
  text: 'Yahweh has sworn and will not change his mind: “You are a priest forever after the manner of Melchizedek.”[a]'
translation:
  language: hi
  text: 'याहवे ने शपथ खाई है और वह अपना मन नहीं बदलेगा: “तू मलिकिसिदक की रीति पर सदा के लिए याजक है।”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अथवा, अधिक शाब्दिक रूप से, “मेरे वचन/आदेश के अनुसार, मलिकिसिदक”; इब्रानी वाक्यांश कठिन है, और कुछ लोग इसका अर्थ “मलिकिसिदक की रीति पर” समझते हैं।
    reason: वैकल्पिक पाठ और मूल इब्रानी की वास्तविक वाक्यगत अस्पष्टता को सुरक्षित रखना।
lexical_decisions:
- source_word: נִשְׁבַּע
  choice: शपथ खाई है
  rationale: पूर्ण क्रिया एक पूरी की गई, गंभीर शपथ को व्यक्त करती है; यह आधुनिक हिन्दी में स्वाभाविक है और शपथ की दृढ़ता बनाए रखती है।
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के विशिष्ट वाचा-नाम को उपाधि से बदलने के बजाय उसका प्रचलित हिन्दी लिप्यंतरण रखा गया है।
- source_word: וְלֹא יִנָּחֵם
  choice: और वह अपना मन नहीं बदलेगा
  rationale: यहाँ निफ़अल रूप शपथ को वापस लेने या उससे फिरने का निषेध व्यक्त करता है; यह वाक्य आधुनिक हिन्दी में स्पष्ट है और 'पछताएगा' से उत्पन्न संभावित भ्रम से बचता है।
- source_word: אַתָּה
  choice: तू
  rationale: इब्रानी के प्रत्यक्ष, एकवचन संबोधन को बनाए रखा गया है; काव्यात्मक और धर्मग्रंथीय सन्दर्भ में 'तू' गंभीर तथा स्वाभाविक है।
- source_word: כֹהֵן
  choice: याजक
  rationale: यह पद धार्मिक सेवा के पदनाम को व्यक्त करता है; 'याजक' आधुनिक हिन्दी बाइबलीय प्रयोग में समझने योग्य और स्थापित शब्द है।
- source_word: לְעוֹלָם
  choice: सदा के लिए
  rationale: इस सन्दर्भ में निरन्तर और स्थायी अवधि को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: עַל דִּבְרָתִי
  choice: की रीति पर
  rationale: इब्रानी पद कठिन है। मुख्य पाठ में यह अनुवाद मलिकिसिदक से सम्बद्ध प्रकार या ढंग का अर्थ स्वाभाविक हिन्दी में देता है, जबकि अधिक शाब्दिक सम्भावना पादटिप्पणी में सुरक्षित है।
- source_word: מַלְכִּי־צֶדֶק
  choice: मलिकिसिदक
  rationale: व्यक्तिवाचक नाम को अनुवादित करने के बजाय हिन्दी में प्रचलित रूप से लिप्यंतरित किया गया है।
theological_decisions:
- issue: कठिन पद עַל דִּבְרָתִי מַלְכִּי־צֶדֶק का अर्थ
  choice: मलिकिसिदक की रीति पर
  alternative: मेरे वचन/आदेश के अनुसार, मलिकिसिदक
  rationale: वाक्य-विन्यास कठिन है और एक से अधिक अर्थ सम्भव हैं। मुख्य पाठ में पुरोहिताई के उस प्रकार या ढंग का अर्थ दिया गया है जो मलिकिसिदक से जुड़ा है; अधिक शाब्दिक सम्भावना को पादटिप्पणी में रखकर वास्तविक अस्पष्टता सुरक्षित रखी गई है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, काव्यात्मक गरिमा और सामान्य पाठक के लिए स्पष्टता के साथ रखी गई है। प्रत्यक्ष संबोधन में एकवचन 'तू' मूल पाठ की निकटता और भजन की गंभीर शैली को बनाए रखता है।
