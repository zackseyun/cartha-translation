  text: He will drink from the brook by the way[b][a]; therefore he will lift up his head.
translation:
  language: hi
  text: वह मार्ग में धारा का पानी पीएगा[a]; इसलिए वह अपना सिर उठाएगा[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘जलधारा’ अथवा ‘मौसमी जलधारा’। इब्रानी शब्द धारा, जलधारा, सूखी नदी-तलहटी, या मौसमी जलधारा को सूचित कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: ‘सिर उठाना’ नई शक्ति, आत्मविश्वास, विजय या प्रतिष्ठा का संकेत दे सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: מִנַּחַל
  choice: नाले का पानी
  rationale: נחל बहती धारा, नाले या मौसमी जलधारा को सूचित कर सकता है। हिंदी में केवल ‘नाले से पिएगा’ अस्वाभाविक और आधुनिक संदर्भ में गंदे नाले का बोध करा सकता है; ‘नाले का पानी’ काव्य-चित्र को स्पष्ट और स्वाभाविक रखता है।
- source_word: בַּדֶּרֶךְ
  choice: मार्ग में
  rationale: דרך का अर्थ मार्ग, रास्ता या यात्रा है। ‘मार्ग में’ संक्षिप्त है और चलते अथवा अभियान के दौरान पीने का आशय बनाए रखता है।
- source_word: יִשְׁתֶּה
  choice: पिएगा
  rationale: अपूर्ण क्रिया भविष्य या अभ्यस्त कार्य बता सकती है; भजन के क्रियाक्रम में भविष्यकाल स्वाभाविक है।
- source_word: עַל־כֵּן
  choice: इसलिए
  rationale: यह पदबंध परिणाम या कारण-संबंध बताता है; ‘इसलिए’ आधुनिक हिंदी में स्पष्ट और सहज है।
- source_word: יָרִים רֹאשׁ
  choice: अपना सिर ऊँचा करेगा
  rationale: यह चयन इब्रानी बिंब को बनाए रखते हुए नई शक्ति, आत्मविश्वास या प्रतिष्ठा/विजय की संभावित अर्थ-छायाओं को किसी एक व्याख्या में सीमित नहीं करता।
theological_decisions:
- issue: पुल्लिंग एकवचन क्रियाओं का संदर्भ
  choice: विषय के लिए केवल ‘वह’ रखा गया है; उसकी पहचान स्पष्ट नहीं की गई।
  alternative: दाऊदी राजा, भजन में संबोधित याजक-राजा, अथवा बाद की मसीही प्रामाणिक व्याख्या में मसीह
  rationale: इब्रानी पद में कर्ता पुल्लिंग एकवचन है, पर इस पद में उसका स्पष्ट नाम नहीं है। अनुवाद किसी विशिष्ट मसीही या राजकीय पहचान को पाठ में जोड़ने के बजाय मूल की खुली संदर्भ-संभावना बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिंदी का सहज, गरिमापूर्ण और काव्यात्मक रूप। ‘नाले का पानी’ सामान्य पाठक के लिए क्रिया का स्वाभाविक कर्म देता है; पादटिप्पणी भौगोलिक अर्थ-विस्तार सुरक्षित रखती है।
