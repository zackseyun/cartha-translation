id: PSA.110.5
reference: Psalms 110:5
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: אֲדֹנָ֥/י עַל יְמִֽינְ/ךָ֑ מָחַ֖ץ בְּ/יוֹם אַפּ֣/וֹ מְלָכִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/110/005.yaml
  text: The Lord is at your right hand[a]; he will shatter kings on the day of his wrath.
translation:
  language: hi
  text: प्रभु आपके दाहिने हाथ पर हैं[a]; वे अपने क्रोध के दिन राजाओं को चूर-चूर कर देंगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “आपके दाहिने हाथ पर स्थित प्रभु” से भजन में संबोधित राजा/मसीह का संकेत हो सकता है; अन्य लोग यहाँ “प्रभु” को न्याय करने वाले परमेश्वर के रूप में समझते हैं।
    reason: alternative_reading
lexical_decisions:
- source_word: אֲדֹנָי
  choice: प्रभु
  rationale: यह रूप ‘अदोनाय’ पढ़ा गया है और प्रभुता-सूचक उपाधि है। ‘प्रभु’ हिंदी में स्वाभाविक और गरिमापूर्ण है तथा इसे परमेश्वर के निज नाम यहोवा के रूप में नहीं बदलता। संदर्भगत अस्पष्टता पादटिप्पणी में सुरक्षित रखी गई है।
- source_word: עַל
  choice: पर
  rationale: ‘दाहिने हाथ’ के साथ यह किसी के दाहिनी ओर स्थित होने का भाव देता है। ‘दाहिने हाथ पर’ ठोस बिंब को बनाए रखता है।
- source_word: יְמִינְךָ
  choice: आपके दाहिने हाथ
  rationale: मूल शब्द का शाब्दिक अर्थ ‘दाहिना हाथ’ है। आदरपूर्ण एकवचन ‘आपके’ संबोधित राजकीय व्यक्ति के प्रति आधुनिक हिंदी में स्वाभाविक है।
- source_word: מָחַץ
  choice: चूर-चूर कर देंगे
  rationale: क्रिया का अर्थ प्रहार करके कुचलना या चकनाचूर करना है। भविष्यकाल भजन के न्याय-संबंधी प्रवाह के अनुकूल है, जबकि ‘चूर-चूर’ निर्णायक और हिंसक पराजय व्यक्त करता है।
- source_word: בְּיוֹם
  choice: दिन
  rationale: ‘अपने क्रोध के दिन’ मूल की कालवाचक अभिव्यक्ति को स्वाभाविक हिंदी में बनाए रखता है।
- source_word: אַפּוֹ
  choice: अपने क्रोध
  rationale: शाब्दिक रूप से ‘नाक’ से संबंधित यह मुहावरा तीव्र रोष को व्यक्त करता है; ‘क्रोध’ आधुनिक हिंदी में स्पष्ट और प्रसंगानुकूल है।
- source_word: מְלָכִים
  choice: राजाओं
  rationale: बहुवचन संज्ञा का सीधा अर्थ ‘राजा’ है; न्याय के राजनीतिक लक्ष्यों को स्पष्ट रखा गया है।
theological_decisions:
- issue: भजन 110:5 में ‘प्रभु’ का संदर्भ
  choice: मुख्य पाठ में व्यापक उपाधि ‘प्रभु’ रखी गई है और संदर्भ को निश्चित नहीं किया गया।
  alternative: इसे न्याय करने वाले परमेश्वर के रूप में समझना, अथवा भजन में संबोधित राजा/मसीह के रूप में समझना।
  rationale: इब्रानी में यहाँ יהוה नहीं, बल्कि אֲדֹנָי है। पद के वाक्यविन्यास और भजन के प्रवाह के कारण संदर्भ को लेकर वास्तविक व्याख्यात्मक तनाव है; इसलिए अनुवाद किसी एक धर्मवैज्ञानिक निष्कर्ष को मुख्य पाठ में नहीं थोपता।
translation_notes:
  register: आधुनिक मानक हिंदी में आदरपूर्ण, गरिमापूर्ण और सामान्य पाठक के लिए सहज शैली अपनाई गई है। ‘आपके/हैं/वे’ से संबोधित व्यक्ति और ‘प्रभु’ के प्रति सम्मान व्यक्त होता है; मूल का ‘दाहिने हाथ’ वाला ठोस बिंब और संदर्भगत अस्पष्टता दोनों सुरक्षित हैं।
