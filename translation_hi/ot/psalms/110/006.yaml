base_translation:
  language: en
  yaml_path: translation/ot/psalms/110/006.yaml
  text: He will judge among the nations[a]; he will fill them with corpses[d][c][b]; he will crush the head over a broad land.
translation:
  language: hi
  text: वह जातियों के बीच न्याय करेगा; वह उन्हें लाशों से भर देगा[a]; वह विशाल भूभाग[c] पर सिर[b] कुचल देगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: मूल इब्रानी में ‘भर देगा’ का कर्म स्पष्ट रूप से नहीं दिया गया है; शाब्दिक रूप से, “वह लाशों से भर देगा।”
    reason: lexical_alternative
  - marker: b
    text: ‘सिर’ का अर्थ ‘प्रधान’ भी हो सकता है, अथवा यह सामूहिक अर्थ में ‘सिरों’ को दर्शा सकता है; इब्रानी में शब्द एकवचन है।
    reason: alternative_reading
  - marker: c
    text: या “विशाल पृथ्वी पर”; इब्रानी शब्द का अर्थ ‘भूमि’ या ‘पृथ्वी’ दोनों हो सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: יָדִין
  choice: न्याय करेगा
  rationale: दीन धातु का क़ाल अपूर्ण रूप यहाँ भावी न्यायिक कार्य को व्यक्त करता है। युद्ध के संदर्भ के बावजूद ‘न्याय करेगा’ दंड देने के अर्थ को अनावश्यक रूप से स्पष्ट नहीं करता।
- source_word: בַּגּוֹיִם
  choice: जातियों के बीच
  rationale: גּוֹיִם का सामान्य अर्थ ‘जातियाँ/राष्ट्र’ है और בְּ यहाँ उनके बीच न्याय करने का भाव देता है। भजन की गरिमामय काव्य-भाषा में ‘जातियों’ स्वाभाविक है।
- source_word: מָלֵא גְוִיּוֹת
  choice: वह उन्हें लाशों से भर देगा
  rationale: इब्रानी वाक्य संक्षिप्त है और ‘भरना’ क्रिया का कर्म नहीं बताता। हिंदी में स्पष्टता के लिए पिछले खंड की ‘जातियों’ को ‘उन्हें’ से ग्रहण किया गया है, जबकि पादटिप्पणी मूल की अनिर्दिष्टता बताती है।
- source_word: גְוִיּוֹת
  choice: लाशों
  rationale: यह शब्द निर्जीव शवों को दर्शाता है। ‘लाशें’ आधुनिक हिंदी में सीधा और प्रबल शब्द है तथा युद्धभूमि की कठोर छवि को बनाए रखता है।
- source_word: מָחַץ
  choice: कुचल देगा
  rationale: क्रिया हिंसक प्रहार करके तोड़ने या कुचलने का अर्थ देती है। ‘कुचल देगा’ वर्तमान, सजीव और प्रसंगानुकूल है।
- source_word: רֹאשׁ
  choice: सिर
  rationale: मूल पाठ के एकवचन ठोस बिंब को बनाए रखा गया है। इसका अर्थ प्रधान, सामूहिक ‘सिरों’, या किसी एक प्रतिनिधि शत्रु से हो सकता है; मुख्य पाठ इनमें से किसी एक को निश्चित नहीं करता।
- source_word: עַל אֶרֶץ רַבָּה
  choice: विशाल भूभाग पर
  rationale: עַל का स्थानीय अर्थ ‘पर’ रखा गया है। אֶרֶץ का अर्थ भूमि या पृथ्वी हो सकता है और רַבָּה उसके व्यापक विस्तार को बताता है; ‘विशाल भूभाग’ एकवचन और स्थानगत अस्पष्टता को स्वाभाविक हिंदी में रखता है।
theological_decisions:
- issue: राजकीय-मसीही भजन में एकवचन ‘सिर’ का आशय
  choice: मुख्य पाठ में एकवचन ‘सिर’ को बिना पहचाने बनाए रखना
  alternative: ‘प्रधान’, सामूहिक अर्थ में ‘सिरों’, या किसी एक सर्वोच्च शत्रु के संकेत के रूप में अनुवाद करना
  rationale: इब्रानी पाठ स्वयं उस ‘सिर’ की पहचान नहीं करता। इसलिए किसी विशिष्ट मसीही या शत्रु-संबंधी व्याख्या को मुख्य पाठ में आरोपित नहीं किया गया।
- issue: אֶרֶץ का भौगोलिक विस्तार
  choice: ‘विशाल भूभाग’
  alternative: ‘विशाल पृथ्वी’ या ‘सारी पृथ्वी पर’
  rationale: אֶרֶץ किसी क्षेत्र की भूमि अथवा पूरी पृथ्वी, दोनों को दर्शा सकता है। मुख्य पाठ कम विस्तारवादी विकल्प रखता है और व्यापक अर्थ को पादटिप्पणी में सुरक्षित करता है।
- issue: מָלֵא के अनिर्दिष्ट कर्म की पूर्ति
  choice: पिछले ‘जातियों’ की ओर संकेत करते हुए ‘उन्हें’ जोड़ना
  alternative: कर्म को अनकहा रखते हुए ‘वह लाशों से भर देगा’
  rationale: मूल की संक्षिप्तता वास्तविक है, पर हिंदी में बिना कर्म का वाक्य अस्वाभाविक है। ‘उन्हें’ निकटतम संदर्भ से लिया गया है और इसकी व्याख्यात्मक प्रकृति पादटिप्पणी में स्पष्ट की गई है।
