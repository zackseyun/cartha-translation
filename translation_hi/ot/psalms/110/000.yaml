  text: לְ/דָוִ֗ד מִ֫זְמ֥וֹר נְאֻ֤ם יְהוָ֨ה לַֽ/אדֹנִ֗/י שֵׁ֥ב לִֽ/ימִינִ֑/י עַד אָשִׁ֥ית אֹ֝יְבֶ֗י/ךָ הֲדֹ֣ם לְ/רַגְלֶֽי/ךָ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/110/000.yaml
  text: Of David[a]. A psalm. Yahweh says to my Lord[c][b], “Sit at my right hand until I make your enemies a footstool for your feet.”
translation:
  language: hi
  text: 'दाऊद का[a] भजन।


    यहोवा[b] मेरे प्रभु[c] से यह घोषणा करता है:


    “मेरे दाहिने बैठो,


    जब तक कि मैं तुम्हारे शत्रुओं को


    तुम्हारे पाँवों की चौकी न बना दूँ।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “दाऊद के लिए” अथवा “दाऊद के विषय में।” शीर्षक में प्रयुक्त इब्रानी संबंधसूचक के एक से अधिक अर्थ संभव हैं।
    reason: lexical_alternative
  - marker: b
    text: “यहोवा” इब्रानी में परमेश्वर का विशिष्ट नाम YHWH है।
    reason: divine_name
  - marker: c
    text: इब्रानी पाठ “यहोवा” (YHWH) और “मेरे प्रभु” (अदोनी) के बीच भेद करता है।
    reason: lexical_distinction
lexical_decisions:
- source_word: לְדָוִד
  choice: दाऊद का
  rationale: शीर्षक में לְ का संबंधसूचक प्रयोग स्वाभाविक हिन्दी में ‘दाऊद का’ है, जबकि इसकी व्यापक अर्थ-संभावना पादटिप्पणी में सुरक्षित रखी गई है।
- source_word: נְאֻם
  choice: यह वाणी है
  rationale: यह शब्द साधारण ‘कहा’ से अधिक औपचारिक, अधिकारपूर्ण घोषणा या दिव्य वाणी का भाव रखता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: मूल पाठ के विशिष्ट ईश्वरीय नाम को उपाधि ‘प्रभु’ से अलग बनाए रखा गया है।
- source_word: אדֹנִי
  choice: मेरे प्रभु
  rationale: प्रत्यय सहित संज्ञा का सीधा अर्थ ‘मेरे प्रभु’ है और इसे YHWH से स्पष्ट रूप से अलग रखा गया है।
- source_word: הֲדֹם לְרַגְלֶיךָ
  choice: तुम्हारे पाँवों की चौकी
  rationale: मूल रूपक का ठोस और बोधगम्य रूप बनाए रखा गया है; इसे व्याख्यात्मक रूप से केवल ‘पाँवों के नीचे’ नहीं किया गया।
theological_decisions:
- issue: यहोवा और ‘मेरे प्रभु’ की पहचान तथा भिन्नता
  choice: दोनों के लिए अलग शब्दावली—‘यहोवा’ और ‘मेरे प्रभु’—रखी गई।
  alternative: दोनों को ‘प्रभु’ लिखना, या ‘मेरे प्रभु’ की पहचान को अनुवाद में ही स्पष्ट करना।
  rationale: इब्रानी पाठ दोनों पदों में भेद करता है, पर ‘मेरे प्रभु’ की पहचान इस पंक्ति में स्वयं स्पष्ट नहीं करता; अनुवाद उस तनाव को खुला रखता है।
- issue: शत्रुओं को पाँवों की चौकी बनाने का रूपक
  choice: रूपक को शाब्दिक रूप में सुरक्षित रखा गया।
  alternative: ‘तुम्हारे अधीन कर दूँ’ या ‘तुम्हारे पाँवों तले कर दूँ’।
  rationale: शाब्दिक बिंब विजय और अधीनता व्यक्त करता है तथा हिन्दी में समझने योग्य है; अधिक व्याख्यात्मक रूप मूल बिंब को घटा देता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सार्वजनिक पाठ के अनुकूल रखी गई है। काव्य-पंक्तियाँ इब्रानी वाक्य की गति को दर्शाती हैं। संबोधन में ‘बैठो/तुम्हारे’ स्वाभाविक आधुनिक हिन्दी देता है, जबकि मूल के एकवचन संबोधन को बनाए रखता है।
