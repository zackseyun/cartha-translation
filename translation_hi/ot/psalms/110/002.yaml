id: PSA.110.2
reference: Psalms 110:2
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: מַטֵּֽה עֻזְּ/ךָ֗ יִשְׁלַ֣ח יְ֭הוָה מִ/צִּיּ֑וֹן רְ֝דֵ֗ה בְּ/קֶ֣רֶב אֹיְבֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/110/002.yaml
  text: 'Yahweh sends forth from Zion the scepter of your strength: rule in the midst of your enemies[a][b][c].'
translation:
  language: hi
  text: याहवे सिय्योन से तुम्हारे सामर्थ्य का राजदंड भेजेगा[a][b]। अपने शत्रुओं के बीच शासन करो[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “तुम्हारे सामर्थ्य की छड़ी” अथवा “तुम्हारे सामर्थ्य का डंडा।”
    reason: lexical_alternative
  - marker: b
    text: या “याहवे भेजता है”; अधिक व्याख्यात्मक रूप में, “याहवे फैलाता है।”
    reason: lexical_alternative
  - marker: c
    text: या “अपने शत्रुओं के मध्य शासन करो।”
    reason: lexical_alternative
lexical_decisions:
- source_word: מַטֵּה
  choice: राजदंड
  rationale: इस शब्द का अर्थ छड़ी, डंडा या राजदंड हो सकता है। इस राजकीय भजन में “राजदंड” शासन-अधिकार की ठोस छवि को स्वाभाविक रूप से व्यक्त करता है।
- source_word: עֻזְּךָ
  choice: तुम्हारे सामर्थ्य का
  rationale: עֹז का मूल अर्थ सामर्थ्य या शक्ति है। यह पदबंध उस राजदंड को राजा के सामर्थ्य का प्रतीक अथवा साधन बताता है।
- source_word: יִשְׁלַח
  choice: भेजेगा
  rationale: क्रिया का अर्थ भेजना या आगे भेजना है। अपूर्ण रूप यहाँ काव्यात्मक भविष्य के रूप में सहज है; वर्तमानकालीन कथन भी संदर्भतः संभव है।
- source_word: יְהוָה
  choice: याहवे
  rationale: ईश्वर के व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय देवनागरी लिप्यंतरण में रखा गया है।
- source_word: מִצִּיּוֹן
  choice: सिय्योन से
  rationale: स्रोत अथवा प्रस्थान-बिंदु बताने वाले पदबंध का सीधा अनुवाद; स्थाननाम के राजकीय और धर्मवैचारिक संबंध सुरक्षित रहते हैं।
- source_word: רְדֵה
  choice: शासन करो
  rationale: यह पुल्लिंग एकवचन आज्ञार्थक क्रिया है, जिसका अर्थ शासन करना या प्रभुत्व रखना है। “शासन करो” स्पष्ट और वर्तमान हिन्दी में स्वाभाविक है।
- source_word: בְּקֶרֶב
  choice: के बीच
  rationale: इसका अर्थ “के मध्य में” या “के बीच” है। संक्षिप्त हिन्दी अभिव्यक्ति शत्रुओं से घिरे रहकर शासन करने की छवि बनाए रखती है।
- source_word: אֹיְבֶיךָ
  choice: अपने शत्रुओं
  rationale: बहुवचन संज्ञा पर द्वितीय पुरुष पुल्लिंग एकवचन प्रत्यय है; हिन्दी में आज्ञा के साथ “अपने शत्रुओं” संबोधित राजा से संबंध स्पष्ट करता है।
theological_decisions:
- issue: भजन 110 में राजकीय और मसीही अर्थ-संभावना
  choice: राजदंड और शासन की मूल राजकीय भाषा को बनाए रखा गया है, जिससे तत्कालीन राजकीय संदर्भ और व्यापक मसीही अर्थ-संभावना दोनों खुले रहें।
  alternative: मुख्य पाठ में इस संबोधित राजा को स्पष्ट रूप से “मसीह” कहना, अथवा राजकीय छवि को सामान्य बनाना।
  rationale: इब्रानी पाठ स्वयं एक राजकीय व्यक्ति, उसके अधिकार और याहवे के समर्थन को प्रस्तुत करता है, पर इस पद में उसे स्पष्टतः “मसीह” नहीं कहता। इसलिए अनुवाद बाद की धर्मवैचारिक पहचान को मुख्य पाठ में आरोपित नहीं करता।
- issue: יִשְׁלַח का कालगत मूल्य
  choice: भविष्यसूचक “भेजेगा”
  alternative: वर्तमानकालीन “भेजता है” या व्याख्यात्मक “फैलाता है”
  rationale: इब्रानी अपूर्ण रूप भविष्य अथवा काव्यात्मक वर्तमान दोनों को सह सकता है। संदर्भ में “भेजेगा” स्वाभाविक है, जबकि पादटिप्पणी अन्य संभावना सुरक्षित रखती है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सुबोध हिन्दी। “राजदंड” राजकीय बिंब को सुरक्षित रखता है; “सामर्थ्य” उच्च किंतु प्रचलित धार्मिक-काव्यात्मक शब्द है। संबोधन पुल्लिंग एकवचन रखा गया है।
