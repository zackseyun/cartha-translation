  yaml_path: translation/ot/psalms/110/001.yaml
  text: Of David[a]. A psalm. Yahweh says to my lord[c][b], “Sit at my right hand until I make your enemies a footstool for your feet.”
translation:
  language: hi
  text: दाऊद का भजन। यहोवा मेरे प्रभु से यह गंभीर घोषणा करता है,[a][b] “मेरे दाहिने हाथ पर बैठ, जब तक कि मैं तेरे शत्रुओं को तेरे पैरों की चौकी न बना दूँ।”[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘यह गंभीर घोषणा करता है’ का अनुवाद ‘यहोवा की मेरे प्रभु से यह गंभीर वाणी है’ भी हो सकता है। यहाँ प्रयुक्त इब्रानी संज्ञा अधिकारपूर्ण घोषणा या ईश्वरीय वाणी का भाव रखती है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में ‘यहोवा’ (YHWH) परमेश्वर का नाम है, जबकि ‘मेरे प्रभु’ (अदोनी) एक अलग सम्मानसूचक पद है।
    reason: lexical_alternative
  - marker: c
    text: शाब्दिक भाव ‘तेरे पैरों के लिए चौकी’ है; अर्थानुसार इसका अनुवाद ‘तेरे पैरों के नीचे’ भी किया जाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: לְדָוִד
  choice: दाऊद का
  rationale: भजन-शीर्षक में לְ सम्बन्ध, स्वामित्व या रचनाकार का संकेत दे सकता है। ‘दाऊद का’ स्वाभाविक हिन्दी है और ‘दाऊद द्वारा’ की अपेक्षा मूल की कुछ अस्पष्टता बनाए रखता है।
- source_word: מִזְמוֹר
  choice: भजन
  rationale: इस काव्य-विधा के लिए प्रचलित और प्रसंगानुकूल हिन्दी शब्द।
- source_word: נְאֻם
  choice: घोषणा करता है
  rationale: यह शब्द साधारण कथन से अधिक गंभीर, अधिकारपूर्ण ईश्वरीय वाणी या उद्घोषणा का बोध करा सकता है; इसलिए ‘घोषणा करता है’ उसके औपचारिक बल को व्यक्त करता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: परमेश्वर के व्यक्तिगत नाम को उपाधि से बदलने के बजाय हिन्दी में प्रचलित नाम-रूप ‘यहोवा’ रखा गया है।
- source_word: לַאדֹנִי
  choice: मेरे प्रभु से
  rationale: אֲדֹנִי का अर्थ ‘मेरे प्रभु/स्वामी’ है और यह יְהוָה से अलग पद है। ‘प्रभु’ सम्मानसूचक अर्थ को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: שֵׁב
  choice: बैठ
  rationale: ישב का सीधा एकवचन पुल्लिंग आज्ञार्थ; दाहिने हाथ का प्रसंग राजकीय प्रतिष्ठा का संकेत देता है।
- source_word: לִימִינִי
  choice: मेरे दाहिने हाथ
  rationale: बाइबलीय रूपक और सिंहासन-संबंधी अर्थ को सुरक्षित रखने वाला स्वाभाविक पदबंध।
- source_word: עַד
  choice: जब तक कि
  rationale: आगे बताई गई ईश्वरीय कार्रवाई तक की अवधि व्यक्त करने वाला सामान्य कालवाचक अनुवाद।
- source_word: אָשִׁית
  choice: बना दूँ
  rationale: शाब्दिक अर्थ ‘रखूँ/स्थापित करूँ’ है; पैरों की चौकी के साथ परिणामसूचक ‘बना दूँ’ हिन्दी में अधिक स्वाभाविक है।
- source_word: אֹיְבֶיךָ
  choice: तेरे शत्रुओं को
  rationale: द्वितीय पुरुष एकवचन पुल्लिंग प्रत्यय सहित बहुवचन का सीधा अनुवाद।
- source_word: הֲדֹם
  choice: चौकी
  rationale: पैर रखने की चौकी के राजकीय-विजय रूपक को संक्षिप्त और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: לְרַגְלֶיךָ
  choice: तेरे पैरों की
  rationale: לְ का मूल भाव ‘तेरे पैरों के लिए’ है; ‘पैरों की चौकी’ हिन्दी का स्वाभाविक समास है और मूल से अधिक व्याख्यात्मक ‘पैरों के नीचे’ नहीं जोड़ता।
theological_decisions:
- issue: יְהוָה और אֲדֹנִי के बीच भेद
  choice: यहोवा ... मेरे प्रभु
  alternative: प्रभु ... मेरे प्रभु
  rationale: मूल पाठ पहले पद में परमेश्वर का व्यक्तिगत नाम और दूसरे में सम्मानसूचक उपाधि रखता है। अलग अनुवाद इस महत्वपूर्ण भाषिक और धर्मवैचारिक भेद को स्पष्ट बनाए रखते हैं।
- issue: ‘मेरे प्रभु’ की मसीही व्याख्या
  choice: मूल सम्मानसूचक पद को बिना अतिरिक्त पहचान के रखना
  alternative: मेरे मसीह अथवा किसी अन्य स्पष्ट पहचान का प्रयोग
  rationale: इब्रानी पाठ इस व्यक्ति को नाम से नहीं पहचानता। बाद के धर्मग्रंथीय प्रयोग का महत्व रहते हुए भी अनुवाद में उस व्याख्या को मूल पद के भीतर नहीं जोड़ा गया।
- issue: नְאֻם का काल और वाणी का स्वरूप
  choice: घोषणा करता है
  alternative: कहा अथवा यह वाणी है
  rationale: वर्तमानकालीन कथन उद्धृत ईश्वरीय उद्घोषणा की जीवंत, सूत्रात्मक प्रकृति को व्यक्त करता है; साधारण भूतकाल पाठ में निहित गंभीरता को कुछ कम कर सकता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सार्वजनिक-पाठ योग्य शैली रखी गई है। दाऊद द्वारा अपने से उच्च व्यक्ति के लिए प्रयुक्त संबोधन के अनुरूप ‘मेरे प्रभु’ और प्रत्यक्ष वाणी में एकवचन आत्मीय/अधिकारपूर्ण ‘तेरे’ रखा गया है। वाक्यरचना मूल की संक्षिप्त राजकीय उद्घोषणा और उसकी वास्तविक व्याख्यात्मक तन्यता को बनाए रखती है।
