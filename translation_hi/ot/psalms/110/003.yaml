source:
  edition: WLC
  text: עַמְּ/ךָ֣ נְדָבֹת֮ בְּ/י֪וֹם חֵ֫ילֶ֥/ךָ בְּֽ/הַדְרֵי קֹ֭דֶשׁ מֵ/רֶ֣חֶם מִשְׁחָ֑ר לְ֝/ךָ֗ טַ֣ל יַלְדֻתֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/110/003.yaml
  text: Your people will offer themselves freely on the day of your power[a], in holy splendor; from the womb of the dawn[c][b], to you belongs the dew of your youth.
translation:
  language: hi
  text: तेरे पराक्रम के दिन तेरी प्रजा स्वेच्छा से अपने आपको अर्पित करेगी[a], पवित्र वैभव में[b]; भोर के गर्भ से निकली तेरी जवानी की ओस तेरी है[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तेरी प्रजा तेरे सामर्थ्य अथवा तेरी सेना के दिन स्वेच्छा-भेंटों के समान है।” इब्रानी में ‘स्वेच्छा-भेंटें’ संज्ञा का काव्यात्मक प्रयोग लोगों के स्वेच्छा से स्वयं को प्रस्तुत करने के लिए हुआ है।
    reason: lexical_alternative
  - marker: b
    text: या, “पवित्र सज्जा में,” “पवित्रता के वैभवों में,” अथवा संभवतः “पवित्र वस्त्रों में।”
    reason: lexical_alternative
  - marker: c
    text: 'अंतिम पंक्ति का अर्थ निश्चित नहीं है। इसका अर्थ यह हो सकता है: “तेरे जवान तेरे लिए भोर के गर्भ से निकली ओस के समान हैं”; अथवा यह तेरी जवानी की ताजगी का वर्णन कर सकती है।'
    reason: alternative_reading
lexical_decisions:
- source_word: עַמְּךָ
  choice: तेरी प्रजा
  rationale: עַם का सामान्य अर्थ ‘प्रजा/लोग’ है। युद्ध-संबंधी संदर्भ के बावजूद इसे सीधे ‘सेना’ कहना अर्थ को अनावश्यक रूप से सीमित कर देता।
- source_word: נְדָבֹת
  choice: स्वेच्छा से अपने आपको अर्पित करेगी
  rationale: बहुवचन संज्ञा का शाब्दिक अर्थ ‘स्वेच्छा-भेंटें’ है, पर यहाँ यह प्रजा के स्वेच्छापूर्वक स्वयं को प्रस्तुत करने का काव्यात्मक वर्णन करती है।
- source_word: חֵילֶךָ
  choice: तेरे पराक्रम
  rationale: חיל में सामर्थ्य, सैन्य-बल और सेना—इन सबकी अर्थ-छाया हो सकती है। ‘पराक्रम’ राजकीय और युद्ध-संबंधी संदर्भ में सामर्थ्य को व्यक्त करता है, बिना केवल ‘सेना’ निश्चित किए।
- source_word: בְּהַדְרֵי קֹדֶשׁ
  choice: पवित्र वैभव में
  rationale: यह पदबंध पवित्र शोभा, पवित्र सज्जा अथवा पवित्र वस्त्रों की ओर संकेत कर सकता है। ‘पवित्र वैभव’ उसकी काव्यात्मक व्यापकता बनाए रखता है।
- source_word: מֵרֶחֶם מִשְׁחָר
  choice: भोर के गर्भ से निकली
  rationale: ‘गर्भ’ उद्गम का सजीव रूपक है और מִשְׁחָר भोर को सूचित करता है। ‘निकली’ हिंदी में ओस के साथ संबंध स्पष्ट करती है, जबकि मूल बिंब सुरक्षित रहता है।
- source_word: טַל יַלְדֻתֶיךָ
  choice: तेरी जवानी की ओस
  rationale: यह अत्यंत संक्षिप्त और कठिन काव्यात्मक अभिव्यक्ति है। यह चुनाव युवा ताजगी, यौवन अथवा युवा अनुयायियों—इन संभावनाओं को निर्णायक रूप से बंद नहीं करता।
theological_decisions:
- issue: 'अंतिम चरण का अर्थ: ‘तेरी जवानी की ओस तेरी है’'
  choice: मूल के भोर, गर्भ, जवानी और ओस के बिंबों को मुख्य पाठ में बनाए रखा गया है।
  alternative: इसे ‘तेरे जवान भोर के गर्भ से निकली ओस के समान हैं’ या किसी स्पष्ट जन्म/उत्पत्ति-वचन के रूप में समझना।
  rationale: इब्रानी पाठ काव्यात्मक रूप से संक्षिप्त और व्याख्यात्मक दृष्टि से कठिन है। किसी विशिष्ट मसीही सिद्धांत या केवल सैनिक गणना को मुख्य पाठ में आरोपित करने के बजाय वास्तविक अस्पष्टता को सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, काव्यात्मक और गरिमापूर्ण रखी गई है। भजन के सीधे संबोधन को बनाए रखने के लिए ‘तेरी/तेरे’ का प्रयोग किया गया है। कठिन अंतिम चरण को अत्यधिक व्याख्यात्मक बनाए बिना हिंदी में पठनीय करने हेतु केवल ‘निकली’ जोड़ा गया है।
