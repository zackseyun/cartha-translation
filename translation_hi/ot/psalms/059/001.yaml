  yaml_path: translation/ot/psalms/059/001.yaml
  text: Deliver me from my enemies[a], my God[b]; set me on high above those who rise up against me.
translation:
  language: hi
  text: हे मेरे परमेश्वर, मुझे मेरे शत्रुओं से छुड़ा; मेरे विरुद्ध उठने वालों से मुझे ऊँचे और पहुँच से बाहर स्थान पर रख।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘मेरी रक्षा कर।’ इब्रानी क्रिया का अर्थ किसी को ऊँचे, पहुँच से बाहर स्थान पर रखकर सुरक्षित करना भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הַצִּילֵנִי
  choice: मुझे छुड़ा
  rationale: हिफ़ील आज्ञार्थक रूप यहाँ संकट और शत्रुओं के हाथ से बचाकर निकालने की विनती व्यक्त करता है। ‘छुड़ा’ सामान्य, सीधा और प्रसंगानुकूल है।
- source_word: מֵאֹיְבַי
  choice: मेरे शत्रुओं से
  rationale: אֹיֵב का सामान्य अर्थ ‘शत्रु’ है, और מִן अलग किए जाने या बचाए जाने के स्रोत को दर्शाता है।
- source_word: אֱלֹהָי
  choice: हे मेरे परमेश्वर
  rationale: प्रथम पुरुष एकवचन संबंधसूचक प्रत्यय सहित यह सीधा संबोधन है। ‘हे’ हिंदी में संबोधन को स्वाभाविक रूप से स्पष्ट करता है।
- source_word: מִּמִתְקוֹמְמַי
  choice: मेरे विरुद्ध उठनेवालों से
  rationale: קום का यह सहभागी रूप उन लोगों को दर्शाता है जो वक्ता के विरोध में खड़े होते या स्वयं को उसके विरुद्ध उठाते हैं।
- source_word: תְּשַׂגְּבֵנִי
  choice: मुझे ऊँचे, अगम स्थान पर रख
  rationale: שׂגב के पिएल रूप में किसी को ऊँचा और पहुँच से बाहर रखकर सुरक्षित करने का ठोस बिंब है। यह अनुवाद ऊँचाई और सुरक्षा, दोनों भावों को बनाए रखता है।
theological_decisions:
- issue: אֱלֹהָי में परमेश्वर के प्रति व्यक्तिगत संबोधन
  choice: हे मेरे परमेश्वर
  alternative: मेरे परमेश्वर
  rationale: मूल में व्यक्तिगत संबंधसूचक संबोधन है; हिंदी का ‘हे’ कोई अतिरिक्त धर्मवैज्ञानिक अर्थ जोड़े बिना संबोधन को स्पष्ट और काव्यात्मक बनाता है।
- issue: שׂגב के बिंब और उसके सुरक्षात्मक अर्थ का संबंध
  choice: मुझे ऊँचे, अगम स्थान पर रख
  alternative: मेरी रक्षा कर
  rationale: मूल का ठोस बिंब केवल सामान्य सुरक्षा नहीं, बल्कि शत्रुओं की पहुँच से ऊपर रखे जाने का है। मुख्य पाठ में उसी बिंब को रखा गया है और वैकल्पिक अर्थ पादटिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण, प्रार्थनात्मक और काव्यात्मक शैली रखी गई है। परमेश्वर से निकट संबोधन के अनुरूप एकवचन क्रियारूप ‘छुड़ा’ और ‘रख’ प्रयुक्त हैं। ‘अगम’ अपेक्षाकृत साहित्यिक है, पर यहाँ ‘शत्रुओं की पहुँच से बाहर’ का अर्थ संक्षेप में और स्वाभाविक काव्यात्मक ढंग से व्यक्त करता है।
