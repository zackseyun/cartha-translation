source:
  edition: WLC
  text: חַטַּאת פִּ֗י/מוֹ דְּֽבַר שְׂפָ֫תֵ֥י/מוֹ וְ/יִלָּכְד֥וּ בִ/גְאוֹנָ֑/ם וּ/מֵ/אָלָ֖ה וּ/מִ/כַּ֣חַשׁ יְסַפֵּֽרוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/059/012.yaml
  text: The sin of their mouth is the word of their lips[a]; let them be caught in their pride[b], because of the curse and the lie that they tell.
translation:
  language: hi
  text: उनके मुँह का पाप—उनके होंठों की बात—है[a]; वे अपने घमंड में फँस जाएँ[b], क्योंकि वे शाप और झूठ बोलते हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उनके मुँह के पाप के कारण—अर्थात् उनके होंठों की बात के कारण—वे अपने घमंड में फँस जाएँ, शाप और झूठ के कारण जो वे बोलते हैं।”
    reason: इब्रानी पदबंधों का वाक्यगत संबंध अस्पष्ट है; आरंभिक शब्दों को स्वतंत्र कथन के बजाय ‘फँस जाएँ’ से जोड़ा जा सकता है।
  - marker: b
    text: या, “अपने घमंड के कारण फँस जाएँ।”
    reason: בְּ उपसर्ग यहाँ उस अवस्था अथवा उस कारण को सूचित कर सकता है जिसमें या जिसके द्वारा वे पकड़े जाते हैं।
lexical_decisions:
- source_word: חַטַּאת
  choice: पाप
  rationale: यहाँ संज्ञा वाणी में प्रकट नैतिक बुराई को दर्शाती है, न कि पापबलि को।
- source_word: פִּימוֹ
  choice: उनके मुँह
  rationale: एकवचन संज्ञा पर बहुवचन संबंधसूचक प्रत्यय सामूहिक अर्थ देता है; हिन्दी में भी ‘उनके मुँह’ काव्यात्मक समानांतरता बनाए रखता है।
- source_word: דְּבַר שְׂפָתֵימוֹ
  choice: उनके होंठों की बात
  rationale: ‘मुँह’ और ‘होंठों’ की मूल काव्यात्मक छवि रखते हुए संबंधवाचक रचना को स्वाभाविक हिन्दी में व्यक्त किया गया है।
- source_word: וְיִלָּכְדוּ
  choice: वे ... फँस जाएँ
  rationale: निफ़अल अपूर्ण रूप यहाँ प्रार्थनात्मक कामना व्यक्त करता है; ‘फँस जाएँ’ इस भाव को सहज रूप से देता है।
- source_word: בִגְאוֹנָם
  choice: अपने घमंड में
  rationale: גאון यहाँ अहंकारी आत्म-उन्नयन को सूचित करता है; ‘में’ मूल उपसर्ग की स्थानिक अथवा कारणात्मक अस्पष्टता को कुछ हद तक बनाए रखता है।
- source_word: מֵאָלָה
  choice: क्योंकि वे शाप ... बोलते हैं
  rationale: מן को यहाँ कारणसूचक माना गया है और אלה को हानिकारक शाप-वचन के अर्थ में लिया गया है।
- source_word: מִכַּחַשׁ
  choice: झूठ
  rationale: כחש का अर्थ इस संदर्भ में असत्य अथवा छलपूर्ण कथन है; ‘झूठ’ सामान्य पाठक के लिए सीधा और स्वाभाविक है।
- source_word: יְסַפֵּרוּ
  choice: वे ... बोलते हैं
  rationale: ספר का मूल भाव ‘सुनाना/कहना’ है; शाप और झूठ के साथ हिन्दी में ‘बोलते हैं’ अधिक स्वाभाविक है।
theological_decisions:
- issue: आरंभिक पदबंध और ‘फँस जाएँ’ के बीच वाक्य-संबंध
  choice: 'पहले पदबंध को नामवाचक वाक्य माना गया: ‘उनके मुँह का पाप उनके होंठों की बात है।’'
  alternative: 'पूरे आरंभिक पदबंध को पकड़ने के कारण के रूप में पढ़ा जा सकता है: ‘उनके मुँह के पाप, उनके होंठों की बात के कारण वे अपने घमंड में फँस जाएँ।’'
  rationale: मासोरेटिक उच्चारण-चिह्न आरंभिक कथन को अलग पढ़ने का समर्थन करते हैं, पर व्यंजन-पाठ वैकल्पिक संबंध की गुंजाइश छोड़ता है; इसलिए उसे पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य हिन्दी पाठक के लिए सहज रखी गई है। ‘मुँह’ और ‘होंठ’ की समानांतर काव्यात्मक छवि सुरक्षित है। कारणसूचक अंतिम खंड को स्वाभाविक हिन्दी के लिए ‘क्योंकि’ से व्यक्त किया गया है।
