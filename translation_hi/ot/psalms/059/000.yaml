base_translation:
  language: en
  yaml_path: translation/ot/psalms/059/000.yaml
  text: 'For the choir director: “Do Not Destroy.” Of David[a]. A miktam, when Saul sent men[d][c][b], and they watched the house to kill him.'
translation:
  language: hi
  text: 'संगीत-निर्देशक के लिए: “नष्ट न कर।”[a] दाऊद का मिक्ताम।[b][c] जब शाऊल ने लोगों को भेजा, और उन्होंने उसे मार डालने के लिए घर की निगरानी की।[d]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “नष्ट न कर” सम्भवतः किसी धुन का नाम या संगीत-संबंधी संकेत है।
    reason: cultural_note
  - marker: b
    text: इब्रानी पदबंध का अर्थ “दाऊद का,” “दाऊद के लिए” या दाऊद से सम्बद्ध भी हो सकता है।
    reason: lexical_alternative
  - marker: c
    text: “मिक्ताम” का ठीक अर्थ अनिश्चित है; इसलिए इसका अनुवाद करने के बजाय लिप्यंतरण किया गया है।
    reason: lexical_alternative
  - marker: d
    text: 'मूल इब्रानी में “लोगों” शब्द स्पष्ट रूप से नहीं है; इसके बाद आने वाली बहुवचन क्रिया से भेजे गए लोगों का संकेत मिलता है। अधिक शाब्दिक रूप: “जब शाऊल ने भेजा, और उन्होंने घर की निगरानी की, ताकि उसे मार डालें।”'
    reason: lexical_alternative
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: संगीत-निर्देशक के लिए
  rationale: भजन-शीर्षकों में यह पद संगीत का नेतृत्व करने वाले व्यक्ति को निर्देशित करता है। यह आधुनिक हिन्दी में स्पष्ट है और केवल गायन-मंडली तक अर्थ को सीमित नहीं करता।
- source_word: אַל תַּשְׁחֵת
  choice: “नष्ट न कर”
  rationale: यह सम्भवतः किसी धुन या संगीत-निर्देश का नाम है। उद्धरण-चिह्न इसे भजन के मुख्य कथन के बजाय शीर्षकीय नाम के रूप में दिखाते हैं।
- source_word: לְדָוִד
  choice: दाऊद का
  rationale: शीर्षक में प्रयुक्त לְ सम्बन्ध, समर्पण या रचनाकारिता का संकेत दे सकता है। संक्षिप्त हिन्दी ‘दाऊद का’ इस सम्बन्ध को व्यक्त करती है; अस्पष्टता पादटिप्पणी में सुरक्षित है।
- source_word: מִכְתָּם
  choice: मिक्ताम
  rationale: इस तकनीकी शब्द का अर्थ अनिश्चित है, इसलिए अनुमानित अर्थ देने के बजाय इसका लिप्यंतरण किया गया है।
- source_word: בִּשְׁלֹחַ שָׁאוּל
  choice: जब शाऊल ने लोगों को भेजा
  rationale: בְּ + infinitive construct समयसूचक है। मूल में भेजे गए ‘लोग’ स्पष्ट संज्ञा के रूप में नहीं हैं, पर अगले बहुवचन क्रिया-रूप से अनेक भेजे गए व्यक्तियों का संकेत मिलता है।
- source_word: וַיִּשְׁמְרוּ אֶת הַבַּיִת
  choice: और वे ... घर पर निगरानी रखने लगे
  rationale: शत्रुतापूर्ण उद्देश्य के कारण שׁמר यहाँ सुरक्षा देने के बजाय निगरानी या घात लगाने का भाव रखता है। ‘घर’ के साथ हिन्दी में ‘घर पर निगरानी रखना’ स्वाभाविक है।
- source_word: לַהֲמִיתוֹ
  choice: उसे मार डालने के लिए
  rationale: यह उद्देश्यसूचक infinitive है, जिसके प्रत्यय का अर्थ ‘उसे’ है। हिन्दी रूप उद्देश्य और हिंसक आशय दोनों को सीधे व्यक्त करता है।
theological_decisions:
- issue: לְדָוִד से दाऊद के साथ सम्बन्ध की प्रकृति
  choice: मुख्य पाठ में ‘दाऊद का’ और पादटिप्पणी में अस्पष्टता
  alternative: ‘दाऊद द्वारा’ या ‘दाऊद के लिए’
  rationale: इब्रानी सम्बन्ध को निश्चित रूप से रचनाकारिता या समर्पण तक सीमित नहीं करता; इसलिए किसी एक व्याख्या को सिद्ध तथ्य नहीं बनाया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण भजन-शीर्षक रखा गया है। संगीत-संबंधी तकनीकी पदों को सहज बनाया गया है, जबकि अनिश्चित ‘मिक्ताम’ को लिप्यंतरित किया गया है। विराम-चिह्न समयसूचक उपवाक्य और उसके बाद की मुख्य क्रिया का सम्बन्ध स्पष्ट करते हैं।
