  yaml_path: translation/ot/psalms/059/008.yaml
  text: But you[a], O Yahweh, laugh at them; you mock all the nations.
translation:
  language: hi
  text: परन्तु हे याहवे, तू उन पर हँसता है; तू सभी राष्ट्रों का उपहास करता है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/אַתָּה
  choice: परन्तु ... तू
  rationale: संयोजक वाव के साथ स्वतंत्र सर्वनाम भजन की वाणी में विरोधात्मक मोड़ दिखाता है; ‘परन्तु’ इसे स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: मूल पाठ में परमेश्वर का व्यक्तिगत नाम टेट्राग्रामटन है; हिन्दी में प्रचलित नामरूप ‘यहोवा’ उसे किसी उपाधि से बदले बिना प्रस्तुत करता है।
- source_word: תִּשְׂחַק לָמוֹ
  choice: उन पर हँसता है
  rationale: क्रिया का मूल अर्थ ‘हँसना’ है और לָמוֹ उस हँसी का लक्ष्य बताता है; ‘उन पर हँसता है’ ठोस बिंब को बनाए रखता है।
- source_word: תִּלְעַג
  choice: उपहास करता है
  rationale: यह क्रिया तिरस्कारपूर्ण हँसी या मज़ाक उड़ाने का भाव रखती है; ‘उपहास करता है’ गरिमापूर्ण और स्पष्ट हिन्दी है।
- source_word: לְ/כָל גּוֹיִם
  choice: सब जातियों का
  rationale: גּוֹיִם यहाँ व्यापक रूप से राष्ट्रों अथवा जनजातियों को दर्शाता है; ‘सब जातियाँ’ हिन्दी बाइबलीय प्रयोग में स्वाभाविक और बोधगम्य है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल का व्यक्तिगत ईश्वरीय नाम सुरक्षित रखा गया है, उसे ‘प्रभु’ जैसी उपाधि से नहीं बदला गया। ‘यहोवा’ आधुनिक हिन्दी पाठकों में अधिक परिचित नामरूप है।
- issue: परमेश्वर के हँसने और उपहास करने की मानवरूपी भाषा
  choice: प्रत्यक्ष रूप से सुरक्षित
  alternative: शत्रुओं को तुच्छ समझता है
  rationale: मूल की प्रबल काव्यात्मक और मानवरूपी भाषा को व्याख्यात्मक अमूर्तीकरण से बदलना उचित नहीं है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट हिन्दी; काव्यात्मक समानांतरता बनाए रखी गई है। सम्बोधन में ‘हे’ और परमेश्वर के लिए एकवचन ‘तू’ हिन्दी भजन-परम्परा तथा मूल के एकवचन रूप के अनुरूप हैं।
