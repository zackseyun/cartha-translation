base_translation:
  language: en
  yaml_path: translation/ot/psalms/059/011.yaml
  text: Do not kill them[a], lest my people forget; make them wander by your power and bring them down[b], O Lord our shield.
translation:
  language: hi
  text: उन्हें मत मार, ऐसा न हो कि मेरे लोग भूल जाएँ; अपनी शक्ति[b] से उन्हें भटकाता फिरा[a] और उन्हें नीचे गिरा दे, हे प्रभु, हमारी ढाल।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘उन्हें हिला दे’ अथवा ‘उन्हें डगमगा दे’; इब्रानी क्रिया किसी को बेचैन गति या अस्थिरता में डालने का अर्थ भी दे सकती है।
    reason: lexical_alternative
  - marker: b
    text: या ‘अपने सामर्थ्य से’; इब्रानी शब्द शक्ति, सामर्थ्य या सैन्य बल का अर्थ दे सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל תַּהַרְגֵם
  choice: उन्हें मार न डाल
  rationale: निषेधात्मक אַל और הרג के सामान्य अर्थ को स्पष्ट, स्वाभाविक आधुनिक हिन्दी में रखा गया है।
- source_word: פֶּן יִשְׁכְּחוּ עַמִּי
  choice: ऐसा न हो कि मेरी प्रजा भूल जाए
  rationale: פֶּן से व्यक्त आशंकित परिणाम को हिन्दी के स्वाभाविक निषेध-आशंका वाक्यांश से व्यक्त किया गया है।
- source_word: הֲנִיעֵמוֹ
  choice: उन्हें भटका दे
  rationale: कारक रूप में यह क्रिया किसी को चलायमान, अस्थिर या भटकता हुआ करने का अर्थ दे सकती है। प्रसंग में लगातार अस्थिर भटकाव उपयुक्त है, जबकि अन्य सम्भव अर्थ पादटिप्पणी में सुरक्षित हैं।
- source_word: בְחֵילְךָ
  choice: अपनी शक्ति से
  rationale: חַיִל शक्ति, सामर्थ्य अथवा सैन्य बल को सूचित कर सकता है; परमेश्वर को सम्बोधन में साधनवाचक अर्थ ‘अपनी शक्ति से’ सबसे स्वाभाविक है।
- source_word: וְהוֹרִידֵמוֹ
  choice: और उन्हें नीचे गिरा दे
  rationale: ירד के हिफ़ील रूप का मूल कारक अर्थ ‘नीचे ले आना/गिराना’ सुरक्षित रखा गया है, बिना यह निश्चित किए कि गिराना शारीरिक है या सामाजिक रूप से नीचा करना।
- source_word: מָגִנֵּנוּ אֲדֹנָי
  choice: हे प्रभु, हमारी ढाल
  rationale: אֲדֹנָי को सम्बोधन ‘हे प्रभु’ और מָגֵן के सजीव भजन-साहित्यिक रूपक को ‘हमारी ढाल’ के रूप में बनाए रखा गया है।
theological_decisions:
- issue: माँगे गए न्याय का स्वरूप
  choice: शत्रुओं को तत्काल मारने के बजाय उन्हें भटकाने और गिराने की प्रार्थना
  alternative: सामान्य रूप से उन्हें अस्थिर और दीन करने की प्रार्थना, जिसमें वास्तविक भटकना आवश्यक न हो
  rationale: ‘मार न डाल ... भटका दे ... नीचे गिरा दे’ का क्रम तत्काल मृत्यु और दीर्घ, दिखाई देने वाले न्याय के बीच तनाव रखता है; अनुवाद उस तनाव को किसी विशिष्ट धर्मसैद्धान्तिक निष्कर्ष में बदले बिना बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का स्पष्ट, गरिमापूर्ण प्रार्थना-रजिस्टर अपनाया गया है। ‘प्रजा’ सामूहिक covenant-community भाव को स्वाभाविक ढंग से व्यक्त करता है; ‘ढाल’ का मूल रूपक अक्षुण्ण रखा गया है। पादटिप्पणी-चिह्न उन्हीं शब्दों के तुरंत बाद रखे गए हैं जिनकी वैकल्पिक व्याख्या दी गई है।
