  text: O my strength[a], I will watch for you[c][b], for God is my stronghold.
translation:
  language: hi
  text: उसकी शक्ति[a]—मैं तेरी बाट जोहता रहूँगा[b], क्योंकि परमेश्वर मेरा गढ़ है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'मूल पाठ में शाब्दिक रूप से “उसकी शक्ति” है। पंक्ति कठिन है। एक प्रचलित पारंपरिक अर्थ है: “हे मेरे बल, मैं तेरी बाट जोहता रहूँगा।” कुछ व्याख्याएँ, निकटवर्ती पदों के प्रभाव से, “मैं स्तुति गाऊँगा” भी प्रस्तावित करती हैं।'
    reason: alternative_reading
  - marker: b
    text: “तेरी बाट जोहता रहूँगा” का अर्थ “पहरा देता रहूँगा,” “तेरी प्रतीक्षा करूँगा,” या “तेरी ओर निगाह रखूँगा” भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: עֻזּוֹ
  choice: उसकी शक्ति
  rationale: मसोरेटिक स्वरांकन में तीसरे पुरुष एकवचन का प्रत्यय है, इसलिए इसका सीधा अर्थ ‘उसकी शक्ति’ है। पदबंध कठिन और अचानक है, पर मूल पाठ का पुरुष-भेद मुख्य पाठ में सुरक्षित रखा गया है।
- source_word: אֵלֶיךָ
  choice: तेरी ओर
  rationale: אֶל के साथ द्वितीय पुरुष प्रत्यय दिशा को व्यक्त करता है। ‘तेरी ओर’ मूल अर्थ को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: אֶשְׁמֹרָה
  choice: निगाह लगाए रहूँगा
  rationale: שׁמר का मूल भाव पहरा देने, ध्यान रखने या बाट जोहने का है। इस संदर्भ में यह अभिव्यक्ति सतर्क और आशाभरी प्रतीक्षा—दोनों की गुंजाइश रखती है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यह अगले कथन को निगाह लगाए रहने का कारण बताने वाले वाक्य के रूप में जोड़ता है।
- source_word: אֱלֹהִים
  choice: परमेश्वर
  rationale: यहाँ बहुवचन रूप एकवचन अर्थ में इस्राएल के परमेश्वर के लिए प्रयुक्त है; ‘परमेश्वर’ मानक और संदर्भानुकूल हिन्दी है।
- source_word: מִשְׂגַּבִּי
  choice: मेरा गढ़
  rationale: शब्द ऊँचे और सुरक्षित आश्रय या दुर्ग का बिंब देता है। ‘गढ़’ संक्षिप्त, सहज और रक्षात्मक बिंब को बनाए रखने वाला विकल्प है।
