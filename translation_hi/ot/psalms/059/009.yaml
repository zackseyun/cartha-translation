  choice: मुख्य पाठ में मसोरेटिक रूप के अनुसार ‘उसकी शक्ति’
  alternative: हे मेरे बल, मैं तेरी ओर निगाह लगाए रहूँगा
  rationale: दिए गए WLC पाठ में तीसरे पुरुष एकवचन प्रत्यय स्पष्ट है। फिर भी यह पंक्ति व्याकरण और संदर्भ की दृष्टि से कठिन है, और प्रचलित परंपरा इसे परमेश्वर के लिए संबोधन मानती है; इसलिए उस अर्थ को पाद-टिप्पणी में सुरक्षित रखा गया है।
- issue: אֶשְׁמֹרָה में निगरानी और प्रतीक्षा के बीच अर्थ-सूक्ष्मता
  choice: निगाह लगाए रहूँगा
  alternative: पहरा देता रहूँगा; तेरी बाट जोहूँगा
  rationale: चुनी हुई हिन्दी अभिव्यक्ति सतर्क दृष्टि और आशाभरी प्रतीक्षा दोनों को समेटती है और किसी एक अर्थ को अनावश्यक रूप से निर्णायक नहीं बनाती।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और काव्यात्मक हिन्दी अपनाई गई है। ‘तेरी’ भजन-साहित्य में परमेश्वर को संबोधित करने का स्वाभाविक एकवचन रूप है। कठिन हिब्रू आरंभ को सरल बनाकर छिपाया नहीं गया; उसकी मुख्य वैकल्पिक व्याख्या पाद-टिप्पणी में दी गई है।
