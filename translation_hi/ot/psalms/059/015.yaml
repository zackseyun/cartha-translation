translation:
  language: hi
  text: वे भोजन के लिए इधर-उधर भटकते हैं; यदि वे तृप्त न हों, तो रात बिताते हैं।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या, प्रसंग में भूखे कुत्तों के बिंब के आधार पर: “गुर्राते हैं।” इब्रानी क्रिया का अधिक सीधा अर्थ “रात बिताना” या “ठहरना” है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵמָּה
  choice: वे
  rationale: स्वतंत्र बहुवचन सर्वनाम यहाँ विषय पर हल्का बल देता है; आधुनिक हिन्दी में “वे” स्वाभाविक है।
- source_word: ינועון
  choice: मारे-मारे फिरते हैं
  rationale: נוּעַ इधर-उधर भटकने या घूमने का भाव देता है; भूखे कुत्तों के प्रसंग में यह बेचैन भटकाव को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: לֶאֱכֹל
  choice: भोजन की खोज में
  rationale: לְ सहित क्रिया का infinitive उद्देश्य, अर्थात खाने के लिए घूमना, बताता है; हिन्दी में “भोजन की खोज में” प्रसंगानुकूल है।
- source_word: יִשְׂבְּעוּ
  choice: उनका पेट न भरे
  rationale: שׂבע भोजन से तृप्त होने को दर्शाता है; यह मुहावरा भूख की छवि को स्पष्ट और सहज रखता है।
- source_word: וַיָּלִינוּ
  choice: रात भर गुर्राते रहते हैं
  rationale: इस रूप को לוּן II, ‘कुड़कुड़ाना/गुर्राना’, से समझना निकटवर्ती भूखे और गुर्राते कुत्तों की पुनरावृत्त छवि के अनुकूल है; “रात भर” काव्यात्मक रात्रिकालीन दृश्य को व्यक्त करता है।
