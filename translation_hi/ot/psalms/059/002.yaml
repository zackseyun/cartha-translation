id: PSA.59.2
reference: Psalms 59:2
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: הַ֭צִּילֵ/נִי מִ/פֹּ֣עֲלֵי אָ֑וֶן וּֽ/מֵ/אַנְשֵׁ֥י דָ֝מִ֗ים הוֹשִׁיעֵֽ/נִי׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/059/002.yaml
  text: Deliver me from workers of wickedness[b][a], and save me from men of blood.
translation:
  language: hi
  text: 'दुष्टता करनेवालों[a] से मुझे छुड़ा,

    और रक्तपाती मनुष्यों[b] से मुझे बचा।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “अनर्थ करनेवालों”; इब्रानी शब्द दुष्टता, अनर्थ या अधर्म का बोध करा सकता है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में शाब्दिक रूप से “लहू के मनुष्य”; इसका अर्थ रक्त बहानेवाले या रक्तपात के दोषी मनुष्य हो सकता है।
    reason: idiom_clarification
lexical_decisions:
- source_word: הַצִּילֵנִי
  choice: मुझे छुड़ा
  rationale: नצל के आज्ञार्थक रूप में संकट और शत्रुओं के हाथ से निकाल लेने की विनती है; ‘छुड़ा’ इस भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: מִפֹּעֲלֵי אָוֶן
  choice: दुष्टता करनेवालों से
  rationale: פעל के कृदन्तीय ‘करनेवाले’ और אָוֶן के नैतिक बुराई वाले अर्थ, दोनों को बनाए रखता है; इसे केवल ‘दुष्टों’ कहकर संक्षिप्त नहीं किया गया।
- source_word: וּמֵאַנְשֵׁי דָמִים
  choice: और रक्तपाती मनुष्यों से
  rationale: शाब्दिक ‘लहू के मनुष्य’ हिन्दी में अस्वाभाविक है। ‘रक्तपाती मनुष्य’ हिंसा, रक्त बहाने और रक्तदोष से जुड़े इब्रानी मुहावरे को स्पष्ट रखते हुए पुल्लिंग संकेत भी बनाए रखता है।
- source_word: הוֹשִׁיעֵנִי
  choice: मुझे बचा
  rationale: ישׁע के आज्ञार्थक रूप को तत्काल शत्रु-संकट से उद्धार की विनती के रूप में स्वाभाविक हिन्दी में प्रस्तुत करता है।
theological_decisions:
- issue: אַנְשֵׁי के पुल्लिंग रूप का अनुवाद
  choice: मनुष्यों
  alternative: लोगों
  rationale: इब्रानी पद व्याकरणतः पुल्लिंग है और हिंसक मानवीय विरोधियों को सूचित करता है; ‘मनुष्यों’ से यह विशेषता बनी रहती है, बिना किसी अतिरिक्त पहचान को जोड़े।
- issue: דָמִים के बहुवचन मुहावरे का अर्थ
  choice: रक्तपाती
  alternative: खून के प्यासे; रक्तपात के दोषी
  rationale: यह पद रक्त, रक्तपात अथवा रक्तदोष से जुड़ा मुहावरा है। ‘रक्तपाती’ इसके हिंसक नैतिक आशय को व्यक्त करता है, पर प्यास या न्यायिक दोषसिद्धि जैसी अतिरिक्त सूक्ष्मता नहीं जोड़ता।
- issue: אָוֶן का संदर्भगत अर्थ
  choice: दुष्टता
  alternative: अनर्थ; अधर्म
  rationale: यहाँ हिंसक शत्रुओं के समानांतर नैतिक बुराई प्रमुख है। ‘दुष्टता’ उस अर्थ को स्पष्ट करता है, जबकि शब्द की अन्य संभावित छायाएँ पादटिप्पणी में सुरक्षित हैं।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और प्रार्थनात्मक काव्य-रजिस्टर रखा गया है। दोनों समानांतर आज्ञार्थक विनतियों—‘छुड़ा’ और ‘बचा’—को अलग रखा गया है; इब्रानी शब्दक्रम की कठोर नकल से बचते हुए उसके अर्थ-संतुलन को सुरक्षित किया गया है।
