source:
  edition: WLC
  text: עֻ֭זִּ/י אֵלֶ֣י/ךָ אֲזַמֵּ֑רָה כִּֽי אֱלֹהִ֥ים מִ֝שְׂגַּבִּ֗/י אֱלֹהֵ֥י חַסְדִּֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/059/017.yaml
  text: O my strength[a], to you I will sing praises, for God is my stronghold, the God of my steadfast love.
translation:
  language: hi
  text: 'हे मेरे बल, मैं तेरे लिए स्तुति गाऊँगा,

    क्योंकि परमेश्वर मेरा ऊँचा गढ़ है,

    मेरे अटल प्रेम का परमेश्वर।[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘मेरा करुणामय परमेश्वर’ अथवा ‘वह परमेश्वर जो मुझसे अटल प्रेम करता है।’ इब्रानी में अक्षरशः ‘मेरे अटल प्रेम का परमेश्वर’ है।
    reason: वैकल्पिक अर्थ
lexical_decisions:
- source_word: עֻזִּי
  choice: हे मेरे बल
  rationale: עֹז का अर्थ ‘बल’ या ‘सामर्थ्य’ है। यहाँ यह परमेश्वर को सीधे संबोधित करता है; ‘हे’ हिंदी में संबोधन को स्वाभाविक रूप से स्पष्ट करता है।
- source_word: אֵלֶיךָ
  choice: तेरे लिए
  rationale: אֶל दिशा या अभिमुखता बताता है। זמר के साथ ‘तेरे लिए स्तुति गाऊँगा’ हिंदी में स्वाभाविक है और गायन के परमेश्वर की ओर/उसके लिए होने का भाव रखता है।
- source_word: אֲזַמֵּרָה
  choice: मैं ... स्तुति गाऊँगा
  rationale: זמר का पिएल रूप भजन-साहित्य में प्रायः संगीत सहित प्रशंसा गाने को दर्शाता है। ‘स्तुति गाऊँगा’ आराधना-संबंधी अर्थ को स्पष्ट और सहज रखता है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यहाँ כִּי स्तुति का कारण प्रस्तुत करता है; ‘क्योंकि’ उस कारणात्मक संबंध को स्पष्ट रखता है।
- source_word: אֱלֹהִים
  choice: परमेश्वर
  rationale: रूप की दृष्टि से बहुवचन होते हुए भी इस प्रसंग में אֱלֹהִים इस्राएल के एक परमेश्वर के लिए एकवचन अर्थ में प्रयुक्त है।
- source_word: מִשְׂגַּבִּי
  choice: मेरा ऊँचा गढ़
  rationale: מִשְׂגָּב मूलतः ऊँचे और सुरक्षित स्थान का बोध कराता है। ‘ऊँचा गढ़’ उसकी ऊँचाई और सुरक्षा, दोनों को बनाए रखता है।
- source_word: אֱלֹהֵי חַסְדִּי
  choice: मेरे अटल प्रेम का परमेश्वर
  rationale: यह संक्षिप्त संबंध-वाचक रचना अक्षरशः ‘मेरे חֶסֶד का परमेश्वर’ है। ‘अटल प्रेम’ חֶסֶד की स्थायी, निष्ठापूर्ण प्रेममयता को व्यक्त करता है और वाक्यांश की मूल काव्यात्मक अस्पष्टता को मुख्य पाठ में बनाए रखता है।
theological_decisions:
- issue: חַסְדִּי का परमेश्वर से संबंध
  choice: संबंध-वाचक अस्पष्टता को ‘मेरे अटल प्रेम का परमेश्वर’ के रूप में बनाए रखा गया
  alternative: ‘मेरा करुणामय परमेश्वर’ अथवा ‘वह परमेश्वर जो मुझसे अटल प्रेम करता है’
  rationale: इब्रानी वाक्यांश परमेश्वर के भजनकार के प्रति अटल प्रेम, या उस प्रेम के स्रोत और मूर्त रूप के रूप में परमेश्वर—दोनों भावों की अनुमति देता है। स्पष्ट व्याख्यात्मक रूप चुनने के बजाय मुख्य पाठ मूल की धर्मवैचारिक और काव्यात्मक सघनता बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और काव्यात्मक रखी गई है। परमेश्वर को संबोधित करते हुए ‘तेरे’ का प्रयोग हिंदी भजन-परंपरा के अनुरूप आत्मीय और सम्मानपूर्ण काव्य-रजिस्टर में है। पंक्ति-विभाजन इब्रानी काव्य के संबोधन, कारण और परमेश्वर-वर्णन को उभारता है।
