  text: Look[a], they pour out from their mouths; swords are on their lips, for they say[b], “Who hears?”
translation:
  language: hi
  text: देखो[a], वे अपने मुँह से उगलते हैं; उनके होंठों पर तलवारें हैं, क्योंकि वे कहते हैं[b], “कौन सुनता है?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘वे अपने मुँह से उमड़कर बोलते हैं’; इब्रानी क्रिया में वाणी के उमड़ने या धारा की तरह फूट निकलने का चित्र है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में केवल ‘कौन सुनता है?’ है। सुनने का कर्म नहीं बताया गया है, इसलिए अहंकारी दावा जानबूझकर खुला रहता है।
    reason: alternative_reading
lexical_decisions:
- source_word: הִנֵּה
  choice: देखो
  rationale: यह ध्यान आकर्षित करने वाला अव्यय है। ‘देखो’ आधुनिक हिन्दी में स्वाभाविक रहते हुए उसके संकेतात्मक बल को बनाए रखता है।
- source_word: יַבִּיעוּן
  choice: उगलते हैं
  rationale: नבע के हिफ़ील रूप में बुदबुदाकर या प्रवाह की तरह बाहर निकलने का चित्र है। सन्दर्भ में ‘उगलते हैं’ अनियंत्रित और आक्रामक वाणी को सजीव रूप से व्यक्त करता है।
- source_word: בְּפִיהֶם
  choice: अपने मुँह से
  rationale: पूर्वसर्ग का मूल अर्थ ‘में/से/के द्वारा’ हो सकता है; प्रवाह व्यक्त करने वाली क्रिया के साथ ‘मुँह से’ हिन्दी में स्वाभाविक है।
- source_word: חֲרָבוֹת
  choice: तलवारें
  rationale: संज्ञा का सामान्य अर्थ ‘तलवारें’ है। यह यहाँ हिंसक वाणी का रूपक है, इसलिए रूपक को व्याख्या में बदलने के बजाय बनाए रखा गया है।
- source_word: בְּשִׂפְתוֹתֵיהֶם
  choice: उनके ओष्ठों पर
  rationale: ‘ओष्ठों पर’ मूल चित्र और काव्यात्मक समान्तरता को बनाए रखता है।
- source_word: כִּי
  choice: क्योंकि वे कहते हैं
  rationale: כִּי कारण प्रस्तुत करता है। अगले प्रत्यक्ष प्रश्न को स्पष्ट हिन्दी वाक्य से जोड़ने के लिए मूल में निहित ‘वे कहते हैं’ जोड़ा गया है।
- source_word: מִי שֹׁמֵעַ
  choice: कौन सुनता है?
  rationale: वर्तमान कृदन्त की संक्षिप्तता और अलंकारिक प्रश्न का अहंकारी भाव बना रहता है; सुनने का कर्म मूल की तरह अनिर्दिष्ट है।
theological_decisions:
- issue: अलंकारिक प्रश्न में सुनने की क्रिया का अनिर्दिष्ट कर्म
  choice: “कौन सुनता है?”
  alternative: “हमारी कौन सुनता है?” / “इसे कौन सुनता है?” / “परमेश्वर में से कौन सुनता है?”
  rationale: इब्रानी पाठ कोई कर्म नहीं बताता। प्रश्न को खुला छोड़ना उस अहंकारी दावे को बनाए रखता है कि मानो कोई—यहाँ तक कि परमेश्वर भी—नहीं सुन रहा, पर पाठ में अनुपस्थित कर्म को जोड़ा नहीं जाता।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और काव्यात्मक हिन्दी। ‘उगलते हैं’ मूल के प्रवाही तथा कठोर चित्र को रखता है; ‘ओष्ठ’ काव्य-भाषा में स्वाभाविक है और ‘मुँह’ के साथ समान्तरता बनाए रखता है। सभी पादटिप्पणी-चिह्न मुख्य पाठ में दिए गए हैं।
