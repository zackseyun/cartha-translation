lexical_decisions:
- source_word: וְיָשׁוּבוּ
  choice: वे ... लौटते हैं
  rationale: שׁוב का मूल अर्थ ‘लौटना’ है; वर्तमानकालीन रूप यहाँ बार-बार होने वाली रात की गतिविधि को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: לָעֶרֶב
  choice: शाम को
  rationale: עֶרֶב का सीधा अर्थ ‘शाम’ है; ‘शाम को’ आधुनिक हिन्दी का सहज काल-सूचक प्रयोग है।
- source_word: יֶהֱמוּ
  choice: गुर्राते हैं
  rationale: המה ऊँची, पशु-सदृश ध्वनि करने को सूचित कर सकता है। निकटवर्ती कुत्ते की उपमा के कारण ‘गुर्राते’ प्रसंगानुकूल है, जबकि ‘हुआँ-हुआँ करते’ भी संभव है।
- source_word: כַכָּלֶב
  choice: कुत्तों की तरह
  rationale: इब्रानी में एकवचन ‘कुत्ते की तरह’ जातिवाचक है; बहुवचन कर्ता के साथ हिन्दी में ‘कुत्तों की तरह’ अधिक स्वाभाविक है।
- source_word: וִיסוֹבְבוּ עִיר
  choice: और नगर में चारों ओर घूमते हैं
  rationale: סבב का अर्थ घूमना या चक्कर लगाना है। ‘नगर में चारों ओर घूमते हैं’ शत्रुतापूर्ण गतिविधि का दृश्य बनाए रखता है, पर मूल से अधिक स्पष्ट रूप से ‘शिकार की ताक में’ होने का भाव नहीं जोड़ता।
