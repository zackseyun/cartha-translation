- source_word: אֱלֹהִים
  choice: परमेश्वर
  rationale: इब्रानी में हुई पुनरावृत्ति को सर्वनाम से बदलने के बजाय सुरक्षित रखा गया है।
- source_word: יַרְאֵנִי
  choice: मुझे ... दृष्टि डालने देगा
  rationale: ראה का हिफ़ील रूप ‘दिखाना’ या ‘देखने देना’ है। यह अनुवाद कारणवाचक भाव रखता है, पर विजय या प्रतिशोध को स्पष्ट रूप से जोड़ता नहीं।
- source_word: בְשֹׁרְרָי
  choice: मेरे शत्रुओं पर
  rationale: שׁורר विरोधी या बैरी लोगों को सूचित करता है; ‘शत्रु’ आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है, जबकि בְ का सम्बन्ध ‘पर’ से व्यक्त होता है।
