- issue: याकूब में परमेश्वर का शासन और पृथ्वी के छोर तक उसका विस्तार या बोध
  choice: ‘याकूब में’ और ‘पृथ्वी के छोर तक’ दोनों को मूल क्रम में रखा गया।
  alternative: ‘याकूब पर’ कहना, ‘याकूब’ को केवल ‘इस्राएल’ से बदलना, या वाक्य को केवल राष्ट्रीय अथवा केवल सार्वभौमिक दावे में बदल देना।
  rationale: मूल में परमेश्वर का याकूब से विशिष्ट सम्बन्ध और पृथ्वी के छोर तक फैला व्यापक आयाम साथ-साथ हैं। हिन्दी क्रम इस तनाव तथा ‘छोर तक’ के सम्बन्ध की कुछ वास्तविक अस्पष्टता को सुरक्षित रखता है।
- issue: וְיֵדְעוּ का उद्देश्य, परिणाम या आज्ञार्थक रंग
  choice: ‘और वे जान लें’
  alternative: ‘ताकि वे जानें’ या ‘तब वे जानेंगे’।
  rationale: इब्रानी वाव-अपूर्ण क्रिया उद्देश्य अथवा परिणाम का भाव ग्रहण कर सकती है और प्रसंग में जुस्सिव रंग भी सम्भव है। ‘और वे जान लें’ किसी एक व्याख्या को अनावश्यक रूप से निश्चित नहीं करता।
