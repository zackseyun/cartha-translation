  yaml_path: translation/ot/psalms/059/016.yaml
  text: But I will sing of your strength[a]; I will sing aloud of your steadfast love in the morning, for you have been a stronghold for me[c][b], and a refuge in the day of my distress.
translation:
  language: hi
  text: 'परन्तु मैं तेरी सामर्थ्य का गीत गाऊँगा;

    भोर में तेरे अटल प्रेम[a] का जयगान करूँगा[b],

    क्योंकि तू मेरे लिए एक सुरक्षित गढ़

    और मेरे संकट के दिन में मेरा शरणस्थान रहा है।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘अटल प्रेम’ के लिए प्रयुक्त इब्रानी शब्द में निष्ठावान, स्थायी और संबंध निभाने वाले प्रेम का भाव भी है।
    reason: lexical_alternative
  - marker: b
    text: या ‘आनन्द से ऊँचे स्वर में गाऊँगा।’ इब्रानी क्रिया उल्लासपूर्ण पुकार और गायन—दोनों का भाव दे सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי
  choice: परन्तु मैं
  rationale: स्वतंत्र सर्वनाम और संयोजक पिछले संदर्भ के शत्रुओं के व्यवहार के विपरीत भजनकार का संकल्प सामने रखते हैं; ‘परन्तु मैं’ इस विरोध को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: אָשִׁיר עֻזֶּךָ
  choice: तेरी सामर्थ्य का गीत गाऊँगा
  rationale: आशीर संकल्प अथवा भावी क्रिया को और עֹז परमेश्वर की रक्षणकारी शक्ति को व्यक्त करता है। यह हिन्दी पदबंध अर्थ और काव्यात्मकता दोनों बनाए रखता है।
- source_word: וַאֲרַנֵּן
  choice: जयगान करूँगा
  rationale: רנן में आनन्द से ऊँचे स्वर में पुकारने अथवा गाने का भाव है। ‘जयगान’ संगीतमय और उल्लासपूर्ण स्तुति दोनों को संक्षेप में व्यक्त करता है।
- source_word: לַבֹּקֶר
  choice: भोर को
  rationale: यह समयसूचक पद है और निकटवर्ती रात्रि के संदर्भ के विपरीत प्रातःकाल की ओर संकेत करता है। ‘भोर को’ सहज और काव्यात्मक है।
- source_word: חַסְדֶּךָ
  choice: तेरे अटल प्रेम
  rationale: חסד परमेश्वर के विश्वसनीय, स्थायी और संबंध-निष्ठ प्रेम को व्यक्त करता है। ‘अटल प्रेम’ इसे किसी एक संप्रदायगत व्याख्या तक सीमित किए बिना स्पष्ट करता है।
- source_word: מִשְׂגָּב
  choice: एक सुरक्षित गढ़
  rationale: यह शब्द ऊँचे, अभेद्य और सुरक्षित आश्रय का बोध कराता है। ‘सुरक्षित गढ़’ सुरक्षा की छवि को स्पष्ट रखते हुए अगले ‘शरणस्थान’ से भिन्न रहता है।
- source_word: וּמָנוֹס
  choice: और ... शरणस्थान
  rationale: מנוס वह स्थान है जहाँ संकट में भागकर सुरक्षा ली जाती है। ‘शरणस्थान’ इस आश्रयगत अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: בְּיוֹם צַר לִי
  choice: मेरे संकट के दिन
  rationale: यह निजी विपत्ति के समय को सूचित करता है। अनुवाद मूल की ‘दिन’ वाली छवि और व्यक्तिगत भाव दोनों को बनाए रखता है।
theological_decisions:
- issue: ईश्वरीय छुटकारे के संदर्भ में חֶסֶד का अनुवाद
  choice: तेरे अटल प्रेम
  alternative: तेरी करुणा; तेरा वाचा-निष्ठ प्रेम; तेरी अटल कृपा
  rationale: इस पद में शब्द परमेश्वर की विश्वसनीय और स्थायी भलाई को दर्शाता है, जो संकट में सुरक्षा देने से प्रकट हुई। ‘अटल प्रेम’ उसके संबंधपरक और स्थायी दोनों पहलुओं को रखता है, पर अर्थ को केवल भावुक प्रेम या केवल तकनीकी वाचाई शब्दावली तक सीमित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और काव्यात्मक शैली अपनाई गई है। परमेश्वर के लिए पारंपरिक एकवचन निकट संबोधन ‘तू/तेरी’ रखा गया है। पंक्ति-विन्यास इब्रानी काव्य के समानांतर भावों को स्पष्ट करता है।
