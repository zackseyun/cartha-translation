source:
  edition: WLC
  text: וְ/אַתָּ֤ה יְהוָֽה אֱלֹהִ֥ים צְבָא֡וֹת אֱלֹ֘הֵ֤י יִשְׂרָאֵ֗ל הָקִ֗יצָ/ה לִ/פְקֹ֥ד כָּֽל הַ/גּוֹיִ֑ם אַל תָּחֹ֨ן כָּל בֹּ֖גְדֵי אָ֣וֶן סֶֽלָה־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/059/005.yaml
  text: But you[a], O Yahweh God of hosts, God of Israel, awake to punish all the nations; show no favor to any treacherous evildoers[c][b]. Selah
translation:
  language: hi
  text: 'परन्तु हे याहवे, सेनाओं के परमेश्वर, इस्राएल के परमेश्वर,


    जाग उठ और सब राष्ट्रों को दण्ड दे[a]।


    दुष्टता करने वाले किसी भी विश्वासघाती पर कृपा न कर[b]।


    सेला[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “सब राष्ट्रों का लेखा लेने के लिए जाग उठ।” इब्रानी क्रिया का अर्थ प्रसंग के अनुसार “सुधि लेना,” “ध्यान देना,” “लेखा लेना,” या “दण्ड देना” हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या “किसी भी विश्वासघाती दुष्कर्मी पर दया न कर।” मूल क्रिया का शाब्दिक भाव “कृपा या अनुग्रह दिखाना” है।
    reason: lexical_alternative
  - marker: c
    text: “सेला” सम्भवतः संगीत या उपासना-सम्बन्धी संकेत है; इसका सटीक अर्थ अनिश्चित है।
    reason: cultural_note
lexical_decisions:
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी परमेश्वर-नाम का आधुनिक विद्वत्तापूर्ण लिप्यंतरण; इसे उपाधि से बदलने के बजाय नाम के रूप में रखा गया है।
- source_word: אֱלֹהִים צְבָאוֹת
  choice: सेनाओं के परमेश्वर
  rationale: यह पदवी सैन्य और व्यापक स्वर्गीय अर्थ-क्षेत्र को खुला रखती है और हिन्दी में स्वाभाविक है।
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: इस्राएल के परमेश्वर
  rationale: सम्बन्धसूचक इब्रानी पदबंध का सीधा और स्वाभाविक अनुवाद।
- source_word: הָקִיצָה
  choice: जाग उठ
  rationale: ईश्वर से की गई विनती में प्रयुक्त जागने के काव्यात्मक रूपक को बनाए रखता है।
- source_word: לִפְקֹד
  choice: दण्ड दे
  rationale: न्याय के इस प्रसंग और अगली पंक्ति में कृपा न करने की विनती के कारण यहाँ न्यायात्मक अर्थ प्रमुख है; व्यापक अर्थ-क्षेत्र को पाद-टिप्पणी में सुरक्षित रखा गया है।
- source_word: כָּל הַגּוֹיִם
  choice: सब राष्ट्रों
  rationale: גּוֹיִם का सामूहिक-राजनीतिक अर्थ व्यक्त करता है और बाद की यहूदी-अन्यजाति भिन्नता आरोपित नहीं करता।
- source_word: אַל תָּחֹן
  choice: कृपा न कर
  rationale: חנן के ‘अनुग्रह/कृपा दिखाना’ अर्थ को निकटता से सुरक्षित रखता है।
- source_word: בֹּגְדֵי אָוֶן
  choice: दुष्टता करने वाले किसी भी विश्वासघाती
  rationale: בגד की विश्वासघातिता और און की नैतिक दुष्टता—दोनों को स्पष्ट, स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: סֶלָה
  choice: सेला
  rationale: सटीक अर्थ अनिश्चित होने के कारण इसका अर्थ निर्धारित करने के बजाय लिप्यंतरण किया गया है।
theological_decisions:
- issue: न्याय की विनती में כָּל הַגּוֹיִם का दायरा
  choice: सब राष्ट्रों
  alternative: सब अन्यजातियों
  rationale: मूल पद व्यापक रूप से राष्ट्रों के विरुद्ध ईश्वरीय न्याय की विनती करता है; ‘राष्ट्रों’ से बाद की जातीय या धार्मिक श्रेणी अनावश्यक रूप से आरोपित नहीं होती।
- issue: פקד की न्यायात्मक परन्तु बहुअर्थी प्रकृति
  choice: मुख्य पाठ में ‘दण्ड दे’
  alternative: ‘लेखा ले’ या ‘सुधि ले’
  rationale: तात्कालिक प्रसंग न्यायात्मक अर्थ का समर्थन करता है, पर मूल क्रिया की व्यापकता पाद-टिप्पणी में रखी गई है ताकि अर्थगत तनाव मिटे नहीं।
translation_notes:
  register: आधुनिक मानक हिन्दी में काव्यात्मक, गम्भीर और प्रार्थनात्मक शैली रखी गई है। एकवचन सम्बोधन और आज्ञार्थक क्रियाएँ मूल की सीधी विनती को बनाए रखती हैं; कठिन इब्रानी पदबंधों को सहज हिन्दी में खोला गया है, बिना उनके नैतिक या न्यायात्मक बल को कम किए।
