  text: יָשׁ֣וּבוּ לָ֭/עֶרֶב יֶהֱמ֥וּ כַ/כָּ֗לֶב וִ/יס֥וֹבְבוּ עִֽיר׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/059/006.yaml
  text: They return at evening[c][b][a]; they growl like dogs and go around the city.
translation:
  language: hi
  text: वे साँझ को लौट आते हैं; वे कुत्तों की तरह गुर्राते हैं[a] और नगर में चक्कर लगाते हैं[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “कुत्तों की तरह हुआँ-हुआँ करते हैं।” हिब्रू क्रिया ऊँची पशु-जैसी आवाज़ करने के लिए भी प्रयुक्त हो सकती है।
    reason: lexical_alternative
  - marker: b
    text: या, “नगर में घूमते फिरते हैं।”
    reason: lexical_alternative
lexical_decisions:
- source_word: יָשׁוּבוּ
  choice: वे लौट आते हैं
  rationale: שׁוב के क़ाल अपूर्ण 3 बहुवचन का मूल अर्थ ‘लौटना’ है; ‘लौट आते हैं’ बार-बार होने वाली शत्रुओं की गतिविधि को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: לָעֶרֶב
  choice: साँझ को
  rationale: לְ के साथ עֶרֶב यहाँ समय बताता है। ‘साँझ को’ संक्षिप्त, काव्यात्मक और आधुनिक हिन्दी में सहज है।
- source_word: יֶהֱמוּ
  choice: गुर्राते हैं
  rationale: המה ऊँची, पशु-जैसी ध्वनि करने को सूचित कर सकता है। कुत्ते की उपमा के साथ ‘गुर्राते हैं’ धमकी-भरी ध्वनि को उपयुक्त रूप से व्यक्त करता है, जबकि मूल की व्यापकता को पादटिप्पणी में रखा गया है।
- source_word: כַכָּלֶב
  choice: कुत्तों की तरह
  rationale: हिब्रू में एकवचन ‘कुत्ता’ जातिवाचक है; बहुवचन कर्ता के साथ हिन्दी में ‘कुत्तों की तरह’ अधिक स्वाभाविक है और झुंड-जैसी छवि बनाए रखता है।
- source_word: וִיסוֹבְבוּ
  choice: और ... चक्कर लगाते हैं
  rationale: סבב का अर्थ घूमना या चारों ओर जाना है। ‘चक्कर लगाते हैं’ मूल क्रिया को सीधे व्यक्त करता है और ‘घात लगाकर घूमना’ जैसी अतिरिक्त व्याख्यात्मक छाया नहीं जोड़ता।
- source_word: עִיר
  choice: नगर में
  rationale: संदर्भ किसी निश्चित नगर की ओर संकेत करता है। हिन्दी में ‘नगर में चक्कर लगाना’ स्वाभाविक है; यहाँ अधिकरण ‘में’ घूमने की गतिविधि का क्षेत्र बताता है।
