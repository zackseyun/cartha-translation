  text: בְּֽלִי עָ֭וֺן יְרוּצ֣וּ/ן וְ/יִכּוֹנָ֑נוּ ע֖וּרָ/ה לִ/קְרָאתִ֣/י וּ/רְאֵה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/059/004.yaml
  text: Without guilt[a], they run and set themselves in place; awake to meet me and see.
translation:
  language: hi
  text: किसी अपराध के बिना ही वे दौड़ते हैं और अपनी जगह जमाते हैं[a]; मुझसे मिलने के लिए जाग उठ और देख!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वे दौड़कर अपने को तैयार करते हैं।” दूसरी क्रिया का अर्थ अपने को स्थापित करना या कार्रवाई के लिए तैयार होना हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּלִי עָוֺן
  choice: किसी अपराध के बिना ही
  rationale: यह पदबंध अपराध या दोष के अभाव को व्यक्त करता है। इब्रानी में संबंधसूचक सर्वनाम नहीं है, इसलिए मुख्य पाठ में ‘मेरे’ जोड़ने के बजाय मूल की संक्षिप्तता और संदर्भगत अस्पष्टता बनाए रखी गई है।
- source_word: יְרוּצוּן
  choice: वे दौड़ते
  rationale: रוץ का मूल चित्र दौड़ने या तेजी से बढ़ने का है; ‘दौड़ते’ उस सजीव काव्यात्मक चित्र को सीधे रखता है।
- source_word: וְיִכּוֹנָנוּ
  choice: और मोर्चा बाँधते हैं
  rationale: כון का यह रूप स्वयं को स्थापित करने, स्थान लेने या कार्रवाई के लिए तैयार होने का भाव दे सकता है। शत्रुओं के संदर्भ में ‘मोर्चा बाँधते हैं’ स्वाभाविक और ठोस है, जबकि वैकल्पिक अर्थ पादटिप्पणी में दिया गया है।
- source_word: עוּרָה
  choice: जाग उठ
  rationale: परमेश्वर को संबोधित एकवचन आज्ञार्थक क्रिया का मानवीकरणात्मक रूपक सुरक्षित रखा गया है।
- source_word: לִקְרָאתִי
  choice: मुझसे मिलने को
  rationale: यह इब्रानी मुहावरे का निकट और स्वाभाविक हिन्दी रूप है; संदर्भ में सहायता के लिए आने का भाव पाठक समझ सकता है, पर उसे मुख्य पाठ में स्पष्ट करके मूल से अधिक नहीं कहा गया।
- source_word: וּרְאֵה
  choice: और देख
  rationale: ראה के आज्ञार्थक रूप और पद की संक्षिप्त समानांतरता को सीधे बनाए रखता है।
theological_decisions:
- issue: परमेश्वर को ‘जाग उठ’ कहने वाला मानवीकरणात्मक आज्ञार्थक
  choice: ‘जाग उठ’ रूपक को बनाए रखा गया
  alternative: ‘उठ खड़ा हो’ या ‘अपने को सक्रिय कर’
  rationale: विलाप की प्रार्थना परमेश्वर से हस्तक्षेप की तीव्र विनती करते हुए जागने का रूपक अपनाती है। इसे ज्यों का त्यों रखने से काव्यात्मक बल और धार्मिक तनाव सुरक्षित रहता है, बिना यह समझाए कि परमेश्वर सचमुच सो रहा है।
- issue: अपराध किसका है
  choice: ‘किसी अपराध के बिना’ कहकर संबंध को खुला रखा गया
  alternative: ‘मेरे किसी अपराध के बिना’
  rationale: संदर्भ में भजनकार का अपना निर्दोष होना सबसे संभावित आशय है, किंतु इस पद में इब्रानी संज्ञा के साथ ‘मेरे’ स्पष्ट रूप से नहीं है। अतः अनुवाद ने संदर्भगत अर्थ को अनावश्यक रूप से व्याकरण में नहीं जोड़ा।
translation_notes:
  register: भाषा आधुनिक, संक्षिप्त और प्रार्थनात्मक-काव्यात्मक रखी गई है। ‘मोर्चा बाँधते हैं’ साधारण पाठक के लिए समझने योग्य है और आक्रमण की तैयारी का ठोस भाव देता है; पादटिप्पणी व्यापक शाब्दिक संभावना सुरक्षित रखती है।
