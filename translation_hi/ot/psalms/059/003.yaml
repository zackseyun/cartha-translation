  yaml_path: translation/ot/psalms/059/003.yaml
  text: For look, they lie in wait for my life; fierce men gather against me, for no transgression or sin of mine, O LORD.
translation:
  language: hi
  text: 'क्योंकि देखो, वे मेरे प्राण लेने को घात लगाए बैठे हैं;


    बलवान लोग मेरे विरुद्ध इकट्ठे हो रहे हैं।


    हे यहोवा, यह मेरे किसी अपराध या पाप के कारण नहीं है।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִנֵּה
  choice: देख
  rationale: ध्यान आकर्षित करने वाले हिब्रू उद्गार को सरल और प्रत्यक्ष आधुनिक हिन्दी में रखा गया है।
- source_word: אָרְבוּ לְנַפְשִׁי
  choice: मेरे प्राण लेने के लिए घात लगाए बैठे हैं
  rationale: मुहावरे का आशय वक्ता के जीवन के विरुद्ध छिपकर अवसर की प्रतीक्षा करना है; यह हिन्दी में स्वाभाविक रहते हुए נֶפֶשׁ के जीवन/प्राण संबंधी अर्थ को व्यक्त करता है।
- source_word: יָגוּרוּ עָלַי
  choice: मेरे विरुद्ध इकट्ठे हो रहे हैं
  rationale: यहाँ क्रिया का अर्थ शत्रुतापूर्वक एकत्र होना है; 'मेरे विरुद्ध' עָלַי की विरोधात्मक शक्ति स्पष्ट करता है।
- source_word: עַזִּים
  choice: बलवान लोग
  rationale: विशेषण का मूल अर्थ शक्तिशाली/प्रबल है; संदर्भ उनकी शत्रुता पहले ही स्पष्ट करता है, इसलिए अनावश्यक रूप से 'हिंसक' नहीं जोड़ा गया।
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिब्रू पाठ में आए परमेश्वर के विशिष्ट नाम को हिन्दी में प्रचलित लिप्यंतरण द्वारा व्यक्त किया गया है।
theological_decisions:
- issue: भजनकार की निर्दोषता का दावा
  choice: यह न तो मेरे अपराध के कारण है, न मेरे पाप के कारण
  alternative: मुझसे न कोई अपराध हुआ है, न कोई पाप
  rationale: हिब्रू की संक्षिप्त अभिव्यक्ति को हमले के कारण से जोड़ना संदर्भ और अंग्रेज़ी परामर्श-पाठ के अनुरूप है तथा इसे पूर्ण पापहीनता का सार्वभौमिक दावा बनाने से बचाता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। काव्यात्मक समानांतरता बनाए रखने के लिए पद को चार पंक्तियों में विन्यस्त किया गया है; कोई पादटिप्पणी आवश्यक नहीं समझी गई।
