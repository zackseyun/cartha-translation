  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। शिकार और घात के परस्पर जुड़े बिंबों को बनाए रखा गया है। वाक्यरचना की वास्तविक अस्पष्टता को पादटिप्पणी में दर्शाया गया है, न कि चुपचाप किसी एक अर्थ में सीमित किया गया है।
