  text: טָֽמְנֽוּ גֵאִ֨ים פַּ֡ח לִ֗/י וַ/חֲבָלִ֗ים פָּ֣רְשׂוּ רֶ֭שֶׁת לְ/יַד מַעְגָּ֑ל מֹקְשִׁ֖ים שָֽׁתוּ לִ֣/י סֶֽלָה־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/140/005.yaml
  text: The proud have hidden a trap for me[a], and with cords they have spread a net beside the path; they have set snares for me[c][b]. Selah
translation:
  language: hi
  text: 'अभिमानी लोगों[a] ने मेरे लिए फंदा छिपाया है;

    रस्सियों से[b] उन्होंने रास्ते के किनारे[c] जाल बिछाया है;

    उन्होंने मेरे लिए फंदे लगाए हैं।

    सेला[d]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अहंकारी लोगों।”
    reason: lexical_alternative
  - marker: b
    text: 'इब्रानी वाक्यरचना का यह अर्थ भी सम्भव है: “और रस्सियाँ छिपा रखी हैं।”'
    reason: textual_ambiguity
  - marker: c
    text: या, “पगडंडी के पास।”
    reason: lexical_alternative
  - marker: d
    text: “सेला” सम्भवतः उपासना या संगीत से जुड़ा कोई संकेत है; इसका सटीक अर्थ अनिश्चित है।
    reason: cultural_note
lexical_decisions:
- source_word: טָמְנוּ
  choice: छिपा रखी हैं
  rationale: क्रिया का मूल अर्थ छिपाना है; पूर्ण क्रिया के परिणामस्वरूप फंदे अभी भी छिपे होने का भाव हिन्दी में स्वाभाविक रूप से व्यक्त होता है।
- source_word: גֵאִים
  choice: अभिमानियों
  rationale: यह शब्द घमंडी या अहंकारी लोगों को सूचित करता है; ‘अभिमानियों’ में नैतिक चरित्रांकन बना रहता है और अनावश्यक रूप से लिंग नहीं जोड़ा जाता।
- source_word: פַּח
  choice: फंदा
  rationale: शिकार पकड़ने के लिए छिपाए गए पाश या जाल का बिंब बनाए रखता है।
- source_word: וַחֲבָלִים
  choice: और रस्सियाँ
  rationale: इब्रानी में संज्ञा ‘रस्सियाँ’ पूर्ववर्ती ‘छिपा रखी हैं’ के साथ पढ़ी जा सकती है; पद की वाक्यरचनात्मक अस्पष्टता को मुख्य पाठ और पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: פָּרְשׂוּ רֶשֶׁת
  choice: जाल बिछाया है
  rationale: जाल फैलाने की क्रिया के लिए यह सहज और वर्तमान हिन्दी प्रयोग है।
- source_word: לְיַד מַעְגָּל
  choice: रास्ते के किनारे
  rationale: स्थान-सूचक अर्थ ‘मार्ग के पास/बगल में’ और घात लगाए जाने का दृश्य दोनों स्पष्ट रहते हैं।
- source_word: מֹקְשִׁים שָׁתוּ
  choice: फंदे लगा रखे हैं
  rationale: ‘लगाना’ हिन्दी में फंदों के साथ स्वाभाविक है और इब्रानी ‘रखना/स्थापित करना’ का आशय देता है।
- source_word: סֶלָה
  choice: सेला
  rationale: इसका सटीक अर्थ अनिश्चित है; इसलिए अनुमानित अनुवाद के बजाय लिप्यंतरण किया गया है।
