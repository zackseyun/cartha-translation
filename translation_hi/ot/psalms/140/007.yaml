source:
  edition: WLC
  text: יְהֹוִ֣ה אֲ֭דֹנָ/י עֹ֣ז יְשׁוּעָתִ֑/י סַכֹּ֥תָה לְ֝/רֹאשִׁ֗/י בְּ/י֣וֹם נָֽשֶׁק׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/140/007.yaml
  text: O Yahweh[a], my Lord, the strength of my salvation, you have covered my head in the day of battle.
translation:
  language: hi
  text: हे यहवे[a], मेरे प्रभु, मेरे उद्धार की सामर्थ्य, आपने युद्ध के दिन मेरे सिर को ढाँप लिया है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “शस्त्रों के दिन” अथवा “हथियारों के दिन।” हिब्रू शब्द सशस्त्र संघर्ष के समय का भी संकेत कर सकता है; इसलिए मुख्य पाठ में “युद्ध के दिन” रखा गया है।
    reason: नָשֶׁק के शाब्दिक ‘शस्त्र/हथियार’ अर्थ को सुरक्षित रखते हुए संदर्भानुकूल मुख्य अनुवाद स्पष्ट करना।
lexical_decisions:
- source_word: יְהֹוִה
  choice: हे यहवे
  rationale: प्रत्यक्ष संबोधन को ‘हे’ से और वाचा के विशिष्ट ईश्वरीय नाम को लिप्यंतरण ‘यहवे’ से व्यक्त किया गया है।
- source_word: אֲדֹנָי
  choice: मेरे प्रभु
  rationale: प्रथम पुरुष एकवचन प्रत्यय को ‘मेरे’ से स्पष्ट रखा गया और निकटवर्ती ईश्वरीय नाम से भेद बनाए रखा गया।
- source_word: עֹז יְשׁוּעָתִי
  choice: मेरे उद्धार की सामर्थ्य
  rationale: सम्बन्धवाचक संरचना को सुरक्षित रखते हुए עֹז को ‘सामर्थ्य’ और יְשׁוּעָתִי को प्रसंगानुकूल व्यापक अर्थ ‘मेरे उद्धार’ दिया गया है।
- source_word: סַכֹּתָה לְרֹאשִׁי
  choice: आपने मेरे सिर को ढाँप लिया
  rationale: क्रिया के ठोस आवरण और रक्षा के बिंब को ‘ढाँप लिया’ से रखा गया; पूर्ण क्रिया को हिन्दी के स्वाभाविक पूर्ण भूतकाल में व्यक्त किया गया है।
- source_word: בְּיוֹם נָשֶׁק
  choice: युद्ध के दिन
  rationale: נָשֶׁק मूलतः हथियार या शस्त्र-सज्जा का संकेत दे सकता है, पर पूरे पदबंध में सशस्त्र संघर्ष का समय अभिप्रेत है; इसलिए मुख्य पाठ में स्वाभाविक ‘युद्ध के दिन’ रखा गया।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में विशिष्ट वाचा-नाम है। ‘यहवे’ उसका निकट लिप्यंतरण है और साथ आए אֲדֹנָי (‘मेरे प्रभु’) से उसका भेद सुरक्षित रखता है।
- issue: יְשׁוּעָתִי का अर्थ
  choice: मेरे उद्धार
  alternative: मेरी मुक्ति; मेरी विजय
  rationale: सैन्य संकट के संदर्भ में ‘छुटकारा’ या ‘विजय’ संभव हैं, पर ‘उद्धार’ मूल शब्द की व्यापकता और भजन की धार्मिक गूँज दोनों को बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में प्रार्थनापूर्ण, गरिमामय और सहज शैली। परमेश्वर के लिए आदरसूचक ‘आप’ का प्रयोग किया गया है। ‘ढाँप लिया’ मूल के ठोस रक्षात्मक बिंब को बनाए रखता है; पद छोटा होने और मुख्य पाठ स्पष्ट रहने के कारण कोई पादटिप्पणी आवश्यक नहीं समझी गई।
