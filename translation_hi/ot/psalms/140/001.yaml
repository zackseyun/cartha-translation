  text: חַלְּצֵ֣/נִי יְ֭הוָה מֵ/אָדָ֣ם רָ֑ע מֵ/אִ֖ישׁ חֲמָסִ֣ים תִּנְצְרֵֽ/נִי׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/140/001.yaml
  text: Rescue me[a], O Yahweh, from the evil man; guard me from the violent man.
translation:
  language: hi
  text: हे याहवे, मुझे बुरे मनुष्य से छुड़ा[क]; हिंसक मनुष्य से मेरी रक्षा कर।
  philosophy: optimal-equivalence
  footnotes:
  - marker: क
    text: या, “हे याहवे, मुझे बुरे मनुष्य से बचा ले; हिंसक मनुष्य से मुझे सुरक्षित रख।”
    reason: lexical_alternative
lexical_decisions:
- source_word: חַלְּצֵנִי
  choice: मुझे…छुड़ा
  rationale: हिफ़ील आज्ञार्थक रूप में חלץ का अर्थ संकट से निकालना या छुड़ाना है। यह हिंदी में प्रार्थना की तात्कालिकता को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिंदी बाइबलीय प्रयोग में परमेश्वर के व्यक्तिगत नाम के प्रचलित लिप्यंतरण ‘यहोवा’ को रखा गया है; इसे किसी उपाधि से नहीं बदला गया।
- source_word: מֵאָדָם רָע
  choice: बुरे मनुष्य से
  rationale: אָדָם यहाँ समानांतर אִישׁ के साथ किसी शत्रुतापूर्ण व्यक्ति को सूचित करता है, समस्त मानवजाति को नहीं। अनिश्चित अर्थ बनाए रखने के लिए हिंदी में अतिरिक्त निश्चितता-सूचक शब्द नहीं जोड़ा गया।
- source_word: מֵאִישׁ חֲמָסִים
  choice: हिंसा करनेवाले मनुष्य से
  rationale: חֲמָסִים हिंसक कर्म या हिंसा की प्रवृत्ति का तीव्र बोध देता है। ‘हिंसा करनेवाला’ स्वाभाविक आधुनिक हिंदी में व्यक्ति को उसके हिंसक आचरण से पहचानता है।
- source_word: תִּנְצְרֵנִי
  choice: मेरी रक्षा कर
  rationale: נצר का अर्थ रक्षा करना, सुरक्षित रखना या निगरानी रखना है। ‘रक्षा कर’ पहले क्रियापद से भेद रखते हुए निरंतर संरक्षण का भाव देता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ में व्यक्तिगत ईश्वरीय नाम है, इसलिए उसे ‘प्रभु’ जैसी उपाधि से प्रतिस्थापित नहीं किया गया। हिंदी पाठकों के लिए प्रचलित लिप्यंतरण ‘यहोवा’ चुना गया।
- issue: אָדָם और אִישׁ के पुल्लिंग एकवचन रूप
  choice: मनुष्य
  alternative: व्यक्ति
  rationale: दोनों पद एक शत्रुतापूर्ण मनुष्य का वर्णन करने वाले समानांतर पुल्लिंग एकवचन हैं। ‘मनुष्य’ स्रोत की मानवीय और पुल्लिंग-संदर्भित अभिव्यक्ति को हिंदी में गरिमापूर्ण ढंग से रखता है।
translation_notes:
  register: आधुनिक, सहज और प्रार्थनापरक हिंदी; हिब्रू काव्य के दो समानांतर निवेदनों को अर्धविराम द्वारा स्पष्ट रखा गया है।
