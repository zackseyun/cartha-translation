translation:
  language: hi
  text: 'जो अपने मन में बुरी योजनाएँ बनाते हैं;

    वे दिन भर युद्ध भड़काते हैं।[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “वे हर दिन युद्ध के लिए इकट्ठे होते हैं,” अथवा “वे हर दिन संघर्ष भड़काते हैं।” यहाँ इब्रानी क्रिया יָגוּרוּ का अर्थ निश्चित नहीं है और प्रसंग के आधार पर कई अनुवाद संभव हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲשֶׁר
  choice: जो
  rationale: यह संबंधवाचक अव्यय पिछले संदर्भ में आए दुष्ट लोगों का वर्णन आगे बढ़ाता है; व्यक्तियों के लिए हिंदी में ‘जो’ स्वाभाविक है।
- source_word: חָשְׁבוּ רָעוֹת
  choice: बुरी योजनाएँ बनाते हैं
  rationale: חָשַׁב यहाँ केवल सोचने नहीं, बल्कि जानबूझकर हानिकारक बातों की योजना बनाने का भाव देता है; רָעוֹת का बहुवचन ‘बुरी योजनाएँ’ में स्वाभाविक रूप से व्यक्त होता है।
- source_word: בְּלֵב
  choice: अपने मन में
  rationale: לֵב का मूल अर्थ ‘हृदय’ है, पर इस प्रसंग में यह विचार और संकल्प के भीतरी केंद्र को सूचित करता है; आधुनिक हिंदी में ‘मन’ इसी अर्थ को स्पष्ट और सहज रूप से पहुँचाता है।
- source_word: כָּל יוֹם
  choice: दिन भर
  rationale: इस काव्यात्मक प्रसंग में यह निरंतर गतिविधि पर बल देता है; ‘दिन भर’ स्वाभाविक हिंदी है, जबकि ‘हर दिन’ भी संभव है।
- source_word: יָגוּרוּ
  choice: भड़काते हैं
  rationale: यहाँ क्रिया का अर्थ कठिन और विवादित है। ‘भड़काते हैं’ युद्ध या संघर्ष को उकसाने के प्रसंगानुकूल सक्रिय अर्थ को व्यक्त करता है, पर अन्य संभावनाएँ पादटिप्पणी में सुरक्षित रखी गई हैं।
- source_word: מִלְחָמוֹת
  choice: युद्ध
  rationale: यह बहुवचन रूप युद्धों/लड़ाइयों को दर्शाता है। हिंदी में ‘युद्ध भड़काना’ जातिवाचक प्रयोग के रूप में स्वाभाविक है और मूल की तीव्रता बनाए रखता है।
