base_translation:
  language: en
  yaml_path: translation/ot/psalms/140/011.yaml
  text: A man of tongue will not be established in the land[c][b][a]; evil will hunt down a man of violence to thrustings.
translation:
  language: hi
  text: ज़बान चलाने वाला मनुष्य देश में स्थिर न रहेगा[a]; बुराई हिंसक मनुष्य का पीछा करेगी और उसे बार-बार धकेलेगी[b][c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ज़बान चलाने वाला’ का अर्थ ‘निंदक’ या ‘बदज़बान मनुष्य’ भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: 'अंतिम हिब्रू पद कठिन है। इसका अर्थ ‘बार-बार के धक्कों के लिए’ या ‘बार-बार प्रहार करके’ भी लिया जाता है; इसे कामना के रूप में भी समझा जा सकता है: ‘बार-बार के धक्के उसका पीछा करें।’'
    reason: lexical_alternative
  - marker: c
    text: वैकल्पिक वाक्य-विन्यास में ‘बुरा’ को ‘हिंसक मनुष्य’ का विशेषण माना जाता है; इस पाठ की सटीक कर्ता-रचना विवादित है।
    reason: syntactic_alternative
lexical_decisions:
- source_word: אִישׁ לָשׁוֹן
  choice: जीभ का धनी मनुष्य
  rationale: शाब्दिक चित्र ‘जीभ वाला/जीभ का मनुष्य’ को स्वाभाविक किंतु अर्थ न समेट देने वाली हिन्दी में रखा गया है; प्रसंग में यह निंदक या दुर्भावनापूर्ण बोलने वाले की ओर संकेत कर सकता है।
- source_word: בַּל יִכּוֹן
  choice: स्थिर न रहेगा
  rationale: काव्यात्मक निषेध और כון के निफ़अल अर्थ—स्थापित, दृढ़ या सुरक्षित होना—दोनों को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: בָּאָרֶץ
  choice: देश में
  rationale: אֶרֶץ का यहाँ सामाजिक और निवास-संबंधी अर्थ ‘देश’ उपयुक्त है; ‘पृथ्वी’ सम्भव है, पर प्रसंग को अधिक विश्वव्यापी बना सकता है।
- source_word: אִישׁ חָמָס
  choice: हिंसक मनुष्य
  rationale: ‘हिंसा का मनुष्य’ का स्वाभाविक हिन्दी रूप है और व्यक्ति के हिंसक चरित्र को बनाए रखता है।
- source_word: רָע
  choice: बुराई
  rationale: इसे अगले क्रिया-पद का कर्ता मानकर बुराई का मानवीकरण सुरक्षित रखा गया है; इसे ‘हिंसक मनुष्य’ का विशेषण मानना भी व्याकरणतः सम्भव है।
- source_word: יְצוּדֶנּוּ
  choice: पीछा करके
  rationale: צוד के शिकार करने या फँसाने के भाव को हिन्दी में पीछा करने की सजीव छवि से व्यक्त किया गया है; मुख्य क्रिया के साथ मिलकर लगातार शिकार बनाए जाने का अर्थ देता है।
- source_word: לְמַדְחֵפֹת
  choice: धक्कों पर धक्के दिलाएगी
  rationale: दुर्लभ बहुवचन संज्ञा में धकेलने/झोंकने और पुनरावृत्त आघात का भाव है। हिन्दी मुहावरे में बहुवचन बल को रखा गया है, जबकि कठिन हिब्रू की अनिश्चितता पादटिप्पणी में दी गई है।
theological_decisions:
- issue: दूसरे अर्ध-पद में רָע की वाक्यगत भूमिका
  choice: ‘बुराई’ को יְצוּדֶנּוּ का कर्ता मानना
  alternative: ‘बुरा हिंसक मनुष्य’ अथवा ‘दुष्ट हिंसक मनुष्य’
  rationale: शब्द-क्रम और एकवचन क्रिया बुराई को मानवीकृत शिकारी के रूप में पढ़ने की अनुमति देते हैं और नवीनतम स्रोत-समीक्षा इसी को प्राथमिक मानती है; वैकल्पिक विशेषणात्मक पाठ पादटिप्पणी में सुरक्षित है।
- issue: पद का कथन या कामनात्मक स्वर
  choice: भविष्यसूचक कथन—‘पीछा करके…दिलाएगी’
  alternative: कामनात्मक—‘वह उसका पीछा करे’
  rationale: יִצּוּדֶנּוּ का रूप भविष्यसूचक और कामनात्मक दोनों छायाएँ ले सकता है। मुख्य पाठ में समानांतर ‘स्थिर न रहेगा’ के अनुरूप कथन रखा गया है; कामनात्मक सम्भावना पादटिप्पणी में है।
translation_notes:
  register: भाषा आधुनिक, गरिमामय और काव्यात्मक रखी गई है। ‘जीभ का धनी’ मूल हिब्रू की सजीव उपमा बचाता है, जबकि ‘धक्कों पर धक्के’ दुर्लभ अंतिम पद की पुनरावृत्ति और हिंसक गति को सामान्य पाठक के लिए ग्रहणीय बनाता है।
