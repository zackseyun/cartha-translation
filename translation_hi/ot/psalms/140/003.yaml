  register: भाषा आधुनिक, सहज और काव्यात्मक गरिमा वाली रखी गई है। समानांतर पंक्तियों और छिपे हुए घातक भाषण के साँप-विष रूपक को सुरक्षित रखा गया है। उपलब्ध अंग्रेज़ी परामर्श-पाठ में पादटिप्पणी-चिह्नों का स्थान उनकी सामग्री से मेल नहीं खाता था; स्रोत और टिप्पणियों के विषय के आधार पर प्रजाति-संबंधी टिप्पणी ‘विषधर’ पर और सांस्कृतिक टिप्पणी ‘सेला’ पर लगाई गई है।
