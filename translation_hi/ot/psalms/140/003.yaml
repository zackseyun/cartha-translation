translation:
  language: hi
  text: 'उन्होंने अपनी जीभ साँप के समान तेज़ की है;


    उनके होंठों के नीचे विषैले साँप का विष है[a]।


    सेला[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी शब्द किसी विषैले साँप को दर्शाता है, पर उसकी ठीक प्रजाति अनिश्चित है।
    reason: lexical_alternative
  - marker: b
    text: ‘सेला’ संभवतः उपासना या संगीत से जुड़ा संकेत है; इसका ठीक अर्थ अनिश्चित है।
    reason: cultural_note
lexical_decisions:
- source_word: שָׁנֲנוּ
  choice: पैनी कर रखी है
  rationale: पिएल रूप का मूल अर्थ ‘पैना करना’ है। ‘कर रखी है’ इब्रानी सिद्ध क्रिया से व्यक्त वर्तमान परिणामी दशा को स्वाभाविक हिन्दी में सामने लाता है और घातक वाणी का रूपक बनाए रखता है।
- source_word: לְשׁוֹנָם
  choice: अपनी जीभ
  rationale: इब्रानी में संज्ञा एकवचन है और बहुवचन कर्ता से संबंधित है। हिन्दी में सामूहिक एकवचन ‘अपनी जीभ’ स्वाभाविक है और मूल रूप को सुरक्षित रखता है।
- source_word: כְּמוֹ נָחָשׁ
  choice: साँप के समान
  rationale: נָחָשׁ का सामान्य अर्थ साँप है। ‘साँप’ आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है तथा अनावश्यक रूप से किसी खास प्रजाति का संकेत नहीं देता।
- source_word: חֲמַת
  choice: ज़हर
  rationale: साँप के संदर्भ में חֵמָה क्रोध नहीं, विष को दर्शाता है। सामान्य पाठक के लिए ‘ज़हर’ सहज है और रूपक का घातक आशय स्पष्ट रखता है।
- source_word: עַכְשׁוּב
  choice: विषधर
  rationale: यह शब्द किसी विषैले साँप का नाम है, पर उसकी सटीक प्रजाति अनिश्चित है। ‘विषधर’ उस अर्थ को व्यक्त करता है और किसी निश्चित आधुनिक प्रजाति का दावा नहीं करता।
- source_word: תַּחַת שְׂפָתֵימוֹ
  choice: उनके होंठों के नीचे
  rationale: 'यह मूल स्थान-संबंधी रूपक को सीधे बनाए रखता है: उनकी घातक वाणी का विष होंठों के नीचे छिपा हुआ है।'
- source_word: סֶלָה
  choice: सेला
  rationale: इस पद का ठीक अर्थ अनिश्चित है और संभवतः यह उपासना या संगीत-संबंधी संकेत है; इसलिए इसका अर्थ निर्धारित करने के बजाय लिप्यंतरण किया गया है।
