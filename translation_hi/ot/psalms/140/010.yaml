  text: ימיטו עֲלֵי/הֶ֗ם גֶּֽחָ֫לִ֥ים בָּ/אֵ֥שׁ יַפִּלֵ֑/ם בְּ֝/מַהֲמֹר֗וֹת בַּֽל יָקֽוּמוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/140/010.yaml
  text: Let burning coals fall on them[a]; let him cast them into the fire, into deep pits[b], never to rise again.
translation:
  language: hi
  text: उन पर जलते अंगारे बरसें[a]; वह उन्हें आग में, गहरे गड्ढों में[b] डाल दे, ताकि वे फिर कभी न उठें।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उन पर अंगारे गिरें।” इब्रानी क्रिया किसी वस्तु को गिराने या बरसाने का अर्थ दे सकती है।
    reason: lexical_alternative
  - marker: b
    text: या “अथाह गहराइयों में” अथवा “जल की गहराइयों में।” यहाँ प्रयुक्त इब्रानी शब्द दुर्लभ है और उसका ठीक अर्थ अनिश्चित है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ימיטו
  choice: बरसें
  rationale: हिफ़ील अपूर्ण बहुवचन यहाँ कामनासूचक/शापसूचक बल रखता है और अंगारों के ऊपर गिरने की सजीव छवि देता है। कर्ता को अनिर्दिष्ट रखा गया है।
- source_word: גֶּחָלִים
  choice: जलते अंगारे
  rationale: संज्ञा अंगारों को दर्शाती है; अग्नि-संदर्भ में ‘जलते’ कहना न्याय की छवि को स्वाभाविक हिंदी में स्पष्ट करता है।
- source_word: יַפִּלֵם
  choice: वह उन्हें ... गिरा दे
  rationale: हिफ़ील अपूर्ण एकवचन में पुरुष बहुवचन कर्म-प्रत्यय है। ‘वह’ मूल के एकवचन कर्ता को सुरक्षित रखता है, पर उसे स्पष्ट रूप से परमेश्वर नहीं कहता।
- source_word: בְּמַהֲמֹרוֹת
  choice: गहरे गड्ढों में
  rationale: यह दुर्लभ और अर्थ की दृष्टि से अनिश्चित शब्द है। संदर्भ में विनाशकारी गहरे स्थान या गड्ढे उपयुक्त हैं; अन्य संभावनाएँ पादटिप्पणी में दी गई हैं।
- source_word: בַּל יָקוּמוּ
  choice: ताकि वे फिर कभी न उठें
  rationale: निषेध और קום की ‘उठना/खड़ा होना’ धारणा को अंतिम, अपरिवर्तनीय पतन के रूप में स्वाभाविक हिंदी में व्यक्त करता है।
theological_decisions:
- issue: न्याय की प्रार्थना और एकवचन क्रिया का निहित कर्ता
  choice: वचन को दैवी न्याय की प्रार्थना के रूप में रखा गया है और ‘वह’ द्वारा एकवचन कर्ता को निहित रहने दिया गया है।
  alternative: ‘परमेश्वर उन्हें गिरा दे’ कहकर कर्ता स्पष्ट करना, अथवा कर्मवाच्य ‘वे गिरा दिए जाएँ’ कहना।
  rationale: इब्रानी में पहली क्रिया बहुवचन और दूसरी एकवचन है। एकवचन कर्ता संभवतः परमेश्वर है, किंतु उसका नाम मूल पाठ में नहीं है; इसलिए उसे स्पष्ट जोड़ना या व्याकरणिक बदलाव मिटा देना उचित नहीं।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण, काव्यात्मक और सहज शैली। ‘बरसें’ भजन की प्रार्थनात्मक तीव्रता बनाए रखता है; विराम-चिह्न समानांतर न्याय-चित्रों को स्पष्ट करते हैं।
