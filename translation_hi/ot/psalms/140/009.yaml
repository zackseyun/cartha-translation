  text: רֹ֥אשׁ מְסִבָּ֑/י עֲמַ֖ל שְׂפָתֵ֣י/מוֹ יכסו/מו׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/140/009.yaml
  text: As for the head of those who surround me[b][a], let the trouble of their lips cover them.
translation:
  language: hi
  text: मुझे घेरने वालों के सिर को[a] उनके होंठों का अनिष्ट[b] ढक ले।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मुझे घेरने वालों के सिरों को उनके होंठों का अनिष्ट ढक ले।” इब्रानी बहुत संक्षिप्त है; “सिर” को सामूहिक एकवचन भी समझा जा सकता है।
    reason: alternative_reading
  - marker: b
    text: “अनिष्ट” का अनुवाद “मुसीबत,” “हानि,” या “शरारत” भी हो सकता है; आशय उनके होंठों, अर्थात उनकी वाणी, से संबद्ध हानिकारक बात से है।
    reason: lexical_alternative
lexical_decisions:
- source_word: רֹאשׁ
  choice: सिर
  rationale: इब्रानी का ठोस एकवचन रूप बनाए रखा गया है। यहाँ यह समूह के लिए सामूहिक अर्थ भी रख सकता है, पर उस अस्पष्टता को मुख्य पाठ में बहुवचन करके समाप्त नहीं किया गया।
- source_word: מְסִבָּי
  choice: मुझे घेरनेवालों
  rationale: यह סבב मूल और प्रथम पुरुष एकवचन प्रत्यय को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है तथा प्रसंग के शत्रुतापूर्ण घेराव को बनाए रखता है।
- source_word: עֲמַל
  choice: उपजाई मुसीबत
  rationale: עָמָל यहाँ हानिकारक शरारत, अनिष्ट या मुसीबत का बोध करा सकता है। 'मुसीबत' व्यापक अर्थ रखती है, और 'उपजाई' होंठों से निकलनेवाली हानिकारक वाणी का संबंध स्पष्ट करता है।
- source_word: שְׂפָתֵימוֹ
  choice: उनके होंठों की
  rationale: शाब्दिक देह-अंग 'होंठ' को रखकर इब्रानी काव्य की ठोस छवि और संबंधवाचक रचना सुरक्षित की गई है।
- source_word: יכסומו
  choice: ढक ले
  rationale: כסה का मूल अर्थ 'ढकना' है। भजन के शापात्मक प्रार्थना-प्रसंग में हिन्दी इच्छार्थक रूप 'ढक ले' उपयुक्त है; इसे केवल भविष्यवाणी नहीं बनाया गया।
theological_decisions:
- issue: संक्षिप्त वाक्य-विन्यास और शापात्मक इच्छा
  choice: 'इसे प्रार्थनात्मक इच्छा के रूप में प्रस्तुत किया गया है: ''मुझे घेरनेवालों के सिर को ... ढक ले।'''
  alternative: 'इसे भविष्यवाणी के रूप में पढ़ा जा सकता है: ''... ढक लेगी''; अथवा सामूहिक एकवचन को बहुवचन करके ''उनके सिरों को'' कहा जा सकता है।'
  rationale: इब्रानी वाक्य अत्यंत संक्षिप्त और कुछ हद तक दीर्घवृत्तीय है। आसपास का प्रसंग इच्छार्थक/शापात्मक पाठ का समर्थन करता है, जबकि एकवचन 'सिर' को बनाए रखना स्रोत की वास्तविक अस्पष्टता सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, काव्यात्मक और सामान्य पाठकों के लिए बोधगम्य रूप। संयुक्त रूप 'घेरनेवालों' वर्तमान हिन्दी वर्तनी के अनुसार रखा गया है।
