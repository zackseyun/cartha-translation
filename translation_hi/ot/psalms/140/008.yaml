base_translation:
  language: en
  yaml_path: translation/ot/psalms/140/008.yaml
  text: O Yahweh[a], do not grant the desires of the wicked; do not advance his scheme, lest they be exalted[b]. Selah
translation:
  language: hi
  text: 'हे याहवे, दुष्ट की अभिलाषाएँ पूरी न कर;

    उसकी योजना को आगे न बढ़ा[a],

    कहीं ऐसा न हो कि वे ऊँचे उठें[b]।

    सेला।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘उसकी योजना को सफल न कर’ या ‘पूरा न कर।’ इस उपवाक्य की इब्रानी क्रिया कठिन है; इसका अर्थ उसकी योजना को आगे बढ़ाना, सफल करना, या पूरा करना हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या ‘कहीं ऐसा न हो कि वह ऊँचा उठे।’ इब्रानी पाठ में क्रिया बहुवचन (‘वे ऊँचे उठें’) है, यद्यपि प्रसंग के अनुसार एकवचन अर्थ भी संभव माना जाता है।
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत नाम को उपाधि से बदलने के बजाय देवनागरी में लिप्यंतरित किया गया है।
- source_word: מַאֲוַיֵּי
  choice: अभिलाषाएँ
  rationale: यह शब्द इच्छाओं या लालसाओं को दर्शाता है; ‘अभिलाषाएँ’ आधुनिक, सहज और प्रसंग के अनुरूप है।
- source_word: רָשָׁע
  choice: दुष्ट
  rationale: एकवचन रूप को प्रतिनिधिक वर्ग-संज्ञा के रूप में रखा गया है; इससे आगे आने वाले एकवचन ‘उसकी’ और बहुवचन ‘वे’ के बीच मूल पाठ का तनाव बना रहता है।
- source_word: זְמָמוֹ
  choice: उसकी चाल
  rationale: यहाँ संज्ञा ऐसी योजना का संकेत देती है जिसमें बुरी मंशा निहित है; ‘चाल’ उस नकारात्मक भाव को स्वाभाविक हिन्दी में व्यक्त करती है।
- source_word: תָּפֵק
  choice: सफल न कर
  rationale: क्रिया का अर्थ इस कठिन प्रसंग में योजना को आगे बढ़ाने, पूरा करने या सफल बनाने से संबंधित जान पड़ता है; ‘सफल न कर’ आशय को स्पष्ट रखते हुए अत्यधिक व्याख्या से बचता है।
- source_word: יָרֻמוּ
  choice: वे ऊँचे उठें
  rationale: मसोरा-पाठ की बहुवचन क्रिया को बनाए रखा गया है। ‘ऊँचे उठें’ सफलता, प्रभाव या घमंड में बढ़ने की मूल रूपकात्मक अस्पष्टता सुरक्षित रखता है।
- source_word: סֶלָה
  choice: सेला
  rationale: इस संगीतमय या साहित्यिक संकेत का ठीक अर्थ अनिश्चित है, इसलिए इसका पारंपरिक लिप्यंतरण किया गया है।
theological_decisions:
