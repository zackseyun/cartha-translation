  choice: याहवे
  alternative: यहोवा अथवा ‘प्रभु’
  rationale: व्यक्तिगत नाम को किसी उपाधि से प्रतिस्थापित न करके उसके संभावित प्राचीन उच्चारण का हिन्दी लिप्यंतरण रखा गया है।
- issue: एकवचन ‘दुष्ट/उसकी चाल’ से बहुवचन ‘वे ऊँचे उठें’ की ओर परिवर्तन
  choice: अंतिम उपवाक्य में बहुवचन सुरक्षित रखा गया
  alternative: ‘कहीं ऐसा न हो कि वह ऊँचा उठे’
  rationale: इब्रानी पाठ में व्याकरणिक संख्या का वास्तविक परिवर्तन है। इसे एकवचन में समतल करने के बजाय मूल अस्पष्टता और संभवतः व्यक्ति से उसके साथियों अथवा दुष्टों के समूह की ओर संकेत को सुरक्षित रखा गया है।
