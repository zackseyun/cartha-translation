lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: संगीत-निर्देशक के लिए
  rationale: भजन-शीर्षकों में यह पद संगीत-प्रस्तुति का संचालन करने वाले व्यक्ति को सूचित करता है। यह आधुनिक और सहज हिन्दी में उसके कार्य को व्यक्त करता है; उपसर्ग לַ को शीर्षक के प्रसंग में ‘के लिए’ कहा गया है।
- source_word: מִזְמוֹר
  choice: एक भजन
  rationale: यह संज्ञा इस साहित्यिक प्रसंग में भजन अथवा संगीतबद्ध स्तुति की प्रचलित विधा-संज्ञा है।
- source_word: לְדָוִד
  choice: दाऊद का
  rationale: भजन-शीर्षकों में לְ लेखन, संबंध, समर्पण या संबद्धता दर्शा सकता है। ‘दाऊद का’ हिन्दी में इस संबंध को स्वाभाविक रूप से व्यक्त करते हुए उसकी मूल अस्पष्टता को पर्याप्त रूप से बनाए रखता है।
theological_decisions:
- issue: दाऊद के साथ शीर्षक का संबंध
  choice: दाऊद का
  alternative: दाऊद द्वारा; दाऊद के लिए
  rationale: इब्रानी शीर्षक अनिवार्य रूप से केवल लेखकत्व निर्धारित नहीं करता। चुना हुआ रूप किसी अधिक निश्चित ऐतिहासिक दावे को पाठ में आरोपित किए बिना पारंपरिक अस्पष्टता बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का संक्षिप्त, गरिमापूर्ण शीर्षकीय रूप अपनाया गया है। ‘गवैयों के प्रधान’ जैसे पुराने पद के बजाय स्पष्ट ‘संगीत-निर्देशक’ चुना गया है।
