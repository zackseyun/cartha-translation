source:
  edition: WLC
  text: אַ֣ךְ צַ֭דִּיקִים יוֹד֣וּ לִ/שְׁמֶ֑/ךָ יֵשְׁב֥וּ יְ֝שָׁרִ֗ים אֶת פָּנֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/140/013.yaml
  text: Surely the righteous will give thanks to your name[a]; the upright will dwell before your face.
translation:
  language: hi
  text: निश्चय ही धर्मी तेरे नाम का धन्यवाद करेंगे; सीधे लोग तेरे मुख के सामने[a] बसे रहेंगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या “तेरी उपस्थिति में।” इब्रानी में शाब्दिक रूप से: “तेरे मुख के सामने।”'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  choice: निश्चय ही
  rationale: यहाँ यह शब्द किसी बात को सीमित करने के बजाय भजन के निष्कर्ष को दृढ़ विश्वास के साथ व्यक्त करता है।
- source_word: צַדִּיקִים
  choice: धर्मी
  rationale: बहुवचन विशेषण यहाँ संज्ञा के रूप में प्रयुक्त है; ‘धर्मी’ नैतिक और वाचागत भाव को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: יוֹדוּ
  choice: धन्यवाद करेंगे
  rationale: हिफ़ील रूप ידה भजनों में प्रायः धन्यवाद या स्तुति व्यक्त करता है; यहाँ परमेश्वर के नाम के साथ ‘धन्यवाद करेंगे’ उपयुक्त है।
- source_word: לִשְׁמֶךָ
  choice: तेरे नाम का
  rationale: हिन्दी में ‘तेरे नाम का धन्यवाद करेंगे’ स्वाभाविक है और धन्यवाद को परमेश्वर के नाम की ओर निर्देशित रखने वाले इब्रानी भाव को व्यक्त करता है।
- source_word: יֵשְׁבוּ
  choice: बसे रहेंगे
  rationale: क्रिया का मूल अर्थ बैठना या निवास करना है; इस काव्यात्मक संदर्भ में ‘बसे रहेंगे’ स्थायी रूप से उपस्थिति में रहने का भाव देता है।
- source_word: יְשָׁרִים
  choice: सीधे लोग
  rationale: बहुवचन विशेषण संज्ञा के रूप में है; ‘सीधे लोग’ नैतिक खराई के अर्थ को सामान्य आधुनिक हिन्दी में स्पष्ट रखता है।
- source_word: אֶת פָּנֶיךָ
  choice: तेरे मुख के सामने
  rationale: यह इब्रानी की ठोस ‘मुख’ वाली छवि को बनाए रखता है, जबकि अर्थ परमेश्वर की उपस्थिति में रहने का है।
theological_decisions:
- issue: परमेश्वर की उपस्थिति के लिए मानवरूपी ‘मुख’ की भाषा
  choice: तेरे मुख के सामने
  alternative: तेरी उपस्थिति में; तेरे सम्मुख
  rationale: मूल पाठ की काव्यात्मक और धर्मवैचारिक छवि को बिना व्याख्यात्मक रूप से समतल किए सुरक्षित रखा गया है; सहज अर्थ पादटिप्पणी में दिया गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘तेरे’ का प्रयोग भजन की सीधी, निकट संबोधन-शैली के अनुरूप है; समानांतर पंक्तियों और मूल ‘मुख’ की काव्यात्मक छवि को बनाए रखा गया है।
