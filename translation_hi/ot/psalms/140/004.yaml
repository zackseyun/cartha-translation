- from: हे यहोवा, मुझे दुष्ट के हाथों से बचा[a]; हिंसक मनुष्य से मेरी रक्षा कर[b], जिन्होंने मेरे कदमों को डगमगाने की योजना बनाई है।
  to: हे याहवे, मुझे दुष्ट के हाथों से बचा[a]; हिंसक मनुष्य से मेरी रक्षा कर[b], जो मेरे कदम डगमगा देने की योजना बना रहे हैं।
  rationale: The revision aligns the divine-name rendering with the stated POB Yahweh policy, improves the Hindi expression of the stumbling image, and preserves rather than harmonizes the Hebrew’s singular noun/plural verb tension. Footnote b now describes that tension neutrally and supplies a readable collective alternative.
