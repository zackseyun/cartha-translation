id: PSA.140.4
reference: Psalms 140:4
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: שָׁמְרֵ֤/נִי יְהוָ֨ה מִ֘/ידֵ֤י רָשָׁ֗ע מֵ/אִ֣ישׁ חֲמָסִ֣ים תִּנְצְרֵ֑/נִי אֲשֶׁ֥ר חָ֝שְׁב֗וּ לִ/דְח֥וֹת פְּעָמָֽ/י׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/140/004.yaml
  text: Keep me[a], O Yahweh, from the hands of the wicked; guard me from the violent man[b], who has planned to trip up my feet.
translation:
  language: hi
  text: हे याहवे, मुझे दुष्ट के हाथों से बचा[a]; हिंसक मनुष्य से मेरी रक्षा कर[b], जो मेरे कदम डगमगा देने की योजना बना रहे हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “दुष्ट मनुष्य के हाथ से।” इब्रानी एकवचन का अर्थ किसी एक व्यक्ति या पूरे वर्ग से हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में “हिंसक मनुष्य” एकवचन है, पर “योजना बना रहे हैं” बहुवचन है। या, “हिंसक लोगों से मेरी रक्षा कर, जिन्होंने मेरे कदम डगमगा देने की योजना बनाई है।”
    reason: source_ambiguity
lexical_decisions:
- source_word: שָׁמְרֵנִי
  choice: मुझे…बचा
  rationale: שׁמר का यह आज्ञार्थक रूप सुरक्षा की प्रार्थना है। ‘बचा’ स्वाभाविक हिन्दी है और अगले समानार्थी क्रियापद से स्पष्ट भेद रखता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: परमेश्वर के व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय हिन्दी में प्रचलित लिप्यंतरण ‘यहोवा’ रखा गया है।
- source_word: מִידֵי רָשָׁע
  choice: दुष्ट के हाथों से
  rationale: ‘हाथों से’ शत्रुतापूर्ण शक्ति या वश का इब्रानी बिंब बनाए रखता है; एकवचन רָשָׁע व्यक्ति अथवा सामूहिक वर्ग, दोनों का संकेत दे सकता है।
- source_word: מֵאִישׁ חֲמָסִים
  choice: हिंसक मनुष्य से
  rationale: אִישׁ का एकवचन रखा गया है, जबकि חֲמָסִים की तीव्रता/अमूर्तता को स्वाभाविक हिन्दी विशेषण ‘हिंसक’ से व्यक्त किया गया है।
- source_word: תִּנְצְרֵנִי
  choice: मेरी रक्षा कर
  rationale: נצר भी सुरक्षा की विनती है; ‘रक्षा कर’ पहले पद के ‘बचा’ के साथ समानांतरता बनाए रखते हुए अनावश्यक पुनरावृत्ति से बचता है।
- source_word: חָשְׁבוּ
  choice: योजना बनाई है
  rationale: संदर्भ में חשב केवल सोचने के बजाय हानि की योजना रचने का अर्थ देता है। बहुवचन रूप को हिन्दी क्रिया में सुरक्षित रखा गया है।
- source_word: לִדְחוֹת פְּעָמָי
  choice: मेरे कदमों को डगमगाने
  rationale: דחה में धकेलने, गिराने या अस्थिर करने का भाव है और פְּעָמָי कदम/पग को सूचित करता है; यह अनुवाद चलने से गिरा देने के बिंब को स्वाभाविक हिन्दी में रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे / प्रभु
  rationale: नाम को उपाधि से प्रतिस्थापित न करके हिन्दी पाठकों में व्यापक रूप से पहचाना जाने वाला व्यक्तिगत नाम रखा गया है।
- issue: एकवचन पूर्वपद के बाद बहुवचन חָשְׁבוּ
  choice: ‘हिंसक मनुष्य’ के बाद ‘जिन्होंने…योजना बनाई है’
  alternative: ‘जिसने…योजना बनाई है’
  rationale: मसोरेटिक पाठ में אִישׁ एकवचन है, पर חָשְׁבוּ स्पष्ट बहुवचन है। अनुवाद इस वास्तविक संख्या-तनाव को चुपचाप एकरूप नहीं करता; footnote में सामूहिक/प्रतिनिधिक अर्थ स्पष्ट किया गया है।
- issue: לִדְחוֹת פְּעָמָי का बिंब
  choice: मेरे कदमों को डगमगाने
  alternative: मेरे पाँव गिराने / मेरे कदम उलट देने
  rationale: पाठ किसी को चलने में अस्थिर करके गिराने और उसकी राह विफल करने, दोनों अर्थों के लिए खुला है; ‘कदमों को डगमगाने’ इस तनाव को बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में प्रार्थनात्मक, काव्यात्मक और गरिमापूर्ण शैली। सम्बोधन में ‘हे’ तथा विनती में निकट एकवचन आज्ञार्थक रूप भजन की सीधी पुकार को बनाए रखते हैं।
