  text: ידעת כִּֽי יַעֲשֶׂ֣ה יְ֭הוָה דִּ֣ין עָנִ֑י מִ֝שְׁפַּ֗ט אֶבְיֹנִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/140/012.yaml
  text: I know that Yahweh will uphold the cause of the afflicted[b][a], and justice for the needy.
translation:
  language: hi
  text: मैं जानता हूँ[a] कि याहवे पीड़ित का पक्ष कायम करेगा[b] और ज़रूरतमंदों को न्याय दिलाएगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मैं जान चुका हूँ”; व्यंजनात्मक इब्रानी रूप को “तू जानता है” भी समझा जा सकता है। पारंपरिक पाठ-वाचन में यहाँ भजनकार कहता है, “मैं जानता हूँ।”
    reason: textual_variant
  - marker: b
    text: शाब्दिक रूप से, “पीड़ित का मामला करेगा”—अर्थात उसके कानूनी पक्ष में कार्रवाई करके उसका अधिकार कायम करेगा।
    reason: lexical_alternative
lexical_decisions:
- source_word: ידעת
  choice: मैं जानता हूँ
  rationale: लिखित व्यंजनात्मक रूप को 'तू जानता है' समझा जा सकता है, पर परंपरागत पाठ-वाचन और भजन के समापन-संदर्भ में इसे भजनकार की विश्वासपूर्ण स्वीकारोक्ति, 'मैं जानता हूँ', के रूप में लिया गया है; पाठगत विकल्प पादटिप्पणी में सुरक्षित है।
- source_word: כִּי
  choice: कि
  rationale: यह वक्ता के जानने की विषय-वस्तु प्रस्तुत करता है।
- source_word: יַעֲשֶׂה ... דִּין
  choice: मुकदमा लड़ेगा
  rationale: शाब्दिक अर्थ 'मामला करेगा' है; यह न्यायिक मुहावरा किसी के कानूनी पक्ष में कार्रवाई करने या उसका पक्ष कायम रखने को व्यक्त करता है। आधुनिक हिन्दी में 'मुकदमा लड़ेगा' इस सक्रिय न्यायिक सहायता को स्वाभाविक ढंग से बताता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को हिन्दी में प्रचलित बाइबलीय लिप्यंतरण 'यहोवा' से व्यक्त किया गया है, न कि किसी उपाधि से।
- source_word: עָנִי
  choice: पीड़ित
  rationale: संदर्भ हिंसक अत्याचार का है; इसलिए यह शब्द केवल आर्थिक गरीबी नहीं, दुःख और दमन की अवस्था व्यक्त करता है।
- source_word: מִשְׁפַּט
  choice: न्याय
  rationale: यहाँ न्यायपूर्ण निर्णय अथवा अधिकार की स्थापना अभिप्रेत है।
- source_word: אֶבְיֹנִים
  choice: ज़रूरतमंदों
  rationale: बहुवचन शब्द अभावग्रस्त और सहायता के मोहताज लोगों को दर्शाता है; 'ज़रूरतमंद' आधुनिक हिन्दी में स्पष्ट और व्यापक है।
theological_decisions:
- issue: ידעת का पुरुष और काल
  choice: मैं जानता हूँ
  alternative: तू जानता है / मैंने जाना है
  rationale: मसोरेटिक स्वरांकन के साथ रूप सामान्यतः भजनकार की वर्तमान, स्थिर जानकारी की स्वीकारोक्ति समझा जाता है, जबकि व्यंजनात्मक रूप दूसरे पुरुष की संभावना रखता है; इस वास्तविक पाठगत तनाव को पादटिप्पणी में रखा गया है।
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: नाम को 'प्रभु' जैसी उपाधि से बदलने के बजाय व्यक्तिगत नाम के रूप में रखा गया है। आधुनिक हिन्दी बाइबल-पाठकों के लिए 'यहोवा' अधिक पहचाना हुआ रूप है, यद्यपि 'याहवे' मूल उच्चारण का एक प्रचलित पुनर्निर्माण है।
- issue: न्याय करने में परमेश्वर की भूमिका
  choice: मुकदमा लड़ेगा ... न्याय दिलाएगा
  alternative: मामला करेगा ... न्याय करेगा
  rationale: इब्रानी न्यायिक समानांतरता परमेश्वर को पीड़ितों के पक्ष में सक्रिय होकर उनका अधिकार स्थापित करने वाला दिखाती है; अनुवाद इस अर्थ को स्पष्ट करता है, बिना प्रक्रिया या परिणाम के बारे में अतिरिक्त सिद्धांत जोड़ने के।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। 'मुकदमा लड़ेगा' न्यायिक बिंब को स्वाभाविक हिन्दी में बनाए रखता है; 'न्याय दिलाएगा' समानांतर दूसरे खंड के आशय को स्पष्ट करता है। सभी पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित हैं।
