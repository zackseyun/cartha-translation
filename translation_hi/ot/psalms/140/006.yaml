  text: אָמַ֣רְתִּי לַ֭/יהוָה אֵ֣לִ/י אָ֑תָּה הַאֲזִ֥ינָ/ה יְ֝הוָ֗ה ק֣וֹל תַּחֲנוּנָֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/140/006.yaml
  text: I say to the LORD, “You are my God.” O LORD, listen to the voice of my pleas.
translation:
  language: hi
  text: मैं यहोवा से कहता हूँ, “आप मेरे परमेश्वर हैं।” हे यहोवा, मेरी विनतियों की आवाज़ सुनिए।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אָמַרְתִּי
  choice: मैं ... कहता हूँ
  rationale: हिब्रू पूर्ण रूप यहाँ संदर्भ में वर्तमान, दृढ़ घोषणा के रूप में समझा जा सकता है; अंग्रेज़ी परामर्श-पाठ का वर्तमान काल भी यही संकेत देता है।
- source_word: לַיהוָה / יְהוָה
  choice: यहोवा / हे यहोवा
  rationale: व्यक्तिगत ईश्वरीय नाम को हिन्दी में प्रचलित बाइबलीय लिप्यंतरण से रखा गया है; दूसरी उपस्थिति संबोधन है।
- source_word: אֵלִי
  choice: मेरे परमेश्वर
  rationale: प्रत्यय सहित אֵל का सीधा और स्वाभाविक हिन्दी रूप।
- source_word: הַאֲזִינָה
  choice: सुनिए
  rationale: ध्यान देकर सुनने की विनती को सम्मानसूचक आज्ञार्थक रूप में स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: קוֹל תַּחֲנוּנָי
  choice: मेरी विनतियों की आवाज़
  rationale: ‘आवाज़’ वाली हिब्रू अभिव्यक्ति को बनाए रखते हुए תַּחֲנוּנִים के बहुवचन और करुण याचनाओं के भाव को ‘विनतियों’ से व्यक्त किया गया है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: प्रभु
  rationale: मूल में उपस्थित व्यक्तिगत नाम को पारंपरिक हिन्दी रूप में स्पष्ट रखा गया है; इसे उपाधि में बदलने से नाम और אֲדֹנָי के बीच का भेद मिट सकता है।
- issue: אָמַרְתִּי का काल-पक्ष
  choice: कहता हूँ
  alternative: मैंने कहा
  rationale: मूल का पूर्ण रूप भूतकाल भी व्यक्त कर सकता है, पर भजन की प्रार्थनात्मक घोषणा में वर्तमान दृढ़ कथन सम्भव है; वास्तविक अस्पष्टता को टिप्पणी में दर्ज किया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध। परमेश्वर को संबोधित करते समय सम्मानसूचक ‘आप/सुनिए’ रखा गया है।
