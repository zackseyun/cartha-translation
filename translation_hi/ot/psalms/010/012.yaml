id: PSA.10.12
reference: Psalms 10:12
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: קוּמָ֤/ה יְהוָ֗ה אֵ֭ל נְשָׂ֣א יָדֶ֑/ךָ אַל תִּשְׁכַּ֥ח עניים־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/010/012.yaml
  text: Rise up[a], O Yahweh; O God, lift up your hand. Do not forget the afflicted.
translation:
  language: hi
  text: हे याहवे, उठ! हे परमेश्वर, अपना हाथ उठा; पीड़ितों[a] को न भूल।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘गरीबों,’ ‘दीनों’ अथवा ‘उत्पीड़ितों।’ इब्रानी शब्द व्यापक रूप से उन लोगों को सूचित कर सकता है जिन्हें दबाया गया है और जो असहाय हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: קוּמָה
  choice: उठ
  rationale: קום के आग्रहपूर्ण आज्ञार्थक रूप को संक्षिप्त और स्वाभाविक आधुनिक हिन्दी में रखा गया है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय ईश्वरीय नाम को किसी उपाधि से बदलने के बजाय हिन्दी में लिप्यंतरित किया गया है।
- source_word: אֵל
  choice: हे परमेश्वर
  rationale: यहाँ אֵל सीधे संबोधन में है और יְהוָה के समानांतर आता है; ‘हे’ प्रार्थनात्मक संबोधन को स्पष्ट करता है।
- source_word: נְשָׂא יָדֶךָ
  choice: अपना हाथ उठा
  rationale: मूल के ठोस मानवरूपी बिंब को बनाए रखा गया है; यह परमेश्वर से सक्रिय हस्तक्षेप की पुकार है, पर उस आशय को मुख्य पाठ में व्याख्यात्मक ढंग से नहीं जोड़ा गया।
- source_word: אַל תִּשְׁכַּח
  choice: न भूल
  rationale: निषेधात्मक आग्रह का सीधा अर्थ सुरक्षित रखा गया है; ‘अनदेखा न कर’ अधिक व्याख्यात्मक होता।
- source_word: עניים
  choice: पीड़ितों
  rationale: संदर्भ में दुष्टों द्वारा सताए जा रहे असहाय लोगों पर बल है। यह चयन केवल आर्थिक गरीबी तक अर्थ को सीमित किए बिना उनकी दुर्दशा व्यक्त करता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ व्यक्तिगत ईश्वरीय नाम का प्रयोग करता है। ‘याहवे’ उस नाम को उपाधि में बदले बिना प्रस्तुत करता है।
- issue: परमेश्वर के ‘हाथ’ का बिंब
  choice: अपना हाथ उठा
  alternative: हस्तक्षेप कर
  rationale: काव्यात्मक मानवरूपी भाषा को मूल रूप में रखा गया है, ताकि न्याय या छुटकारे की दिशा में कार्रवाई का निहित अर्थ अनावश्यक रूप से एक ही व्याख्या में सीमित न हो।
translation_notes:
  register: भाषा आधुनिक, संक्षिप्त और प्रार्थनात्मक है। निकट संबोधन के एकवचन आज्ञार्थक रूप मूल की तात्कालिकता और काव्यात्मक समानांतरता को बनाए रखते हैं।
