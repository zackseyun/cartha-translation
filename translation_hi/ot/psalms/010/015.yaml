  text: Break the arm of the wicked and evil man[a]; seek out his wickedness until you find none.
translation:
  language: hi
  text: दुष्ट और बुरे मनुष्य की बाँह तोड़ दे[a]; उसकी दुष्टता को ढूँढ़, जब तक कि कुछ भी न मिले।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “दुष्ट की बाँह तोड़ दे; और बुरे व्यक्ति की दुष्टता को ढूँढ़, जब तक कि कुछ भी न मिले।” इब्रानी में ‘बुरा’ को ‘दुष्ट’ के साथ एक ही व्यक्ति का दूसरा वर्णन, या अगले पद का अलग व्यक्तिवाचक पद, दोनों तरह से समझा जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁבֹר
  choice: तोड़ दे
  rationale: दूसरे पुरुष एकवचन की आज्ञार्थक प्रार्थना है। ‘तोड़ दे’ मूल निवेदन की सीधी और प्रबल भाषा को स्वाभाविक हिन्दी में रखता है।
- source_word: זְרוֹעַ
  choice: बाँह
  rationale: मूल ठोस बिंब को सुरक्षित रखा गया है; प्रसंग में बाँह दुष्ट की शक्ति और हानि पहुँचाने की क्षमता का रूपक है।
- source_word: רָשָׁע
  choice: दुष्ट
  rationale: यह विशेषण संज्ञा के रूप में दुष्ट व्यक्ति को दर्शाता है। ‘दुष्ट’ आधुनिक हिन्दी में संक्षिप्त और स्वाभाविक है।
- source_word: וָרָע
  choice: और बुरे मनुष्य
  rationale: इसे רָשָׁע के समानांतर दूसरे व्यक्तिवाचक वर्णन के रूप में लिया गया है। ‘बुरे मनुष्य’ इस समानांतरता को स्पष्ट करता है, जबकि पाठगत सम्भावना को पादटिप्पणी में रखा गया है।
- source_word: תִּדְרוֹשׁ
  choice: खोज निकाल
  rationale: דרש यहाँ किसी विषय को खोजने, जाँचने या उसका हिसाब लेने का भाव रखता है। ‘खोज निकाल’ खोज और न्यायिक पड़ताल—दोनों के संकेत को सहज हिन्दी में बनाए रखता है।
- source_word: רִשְׁעוֹ
  choice: उसकी दुष्टता
  rationale: यह शब्द उसी दुष्ट व्यक्ति की दुष्टता या दोष को सूचित करता है और मूल शब्दमूल से निकटता रखता है।
- source_word: בַל תִּמְצָא
  choice: जब तक कुछ भी न मिले
  rationale: नकार सहित क्रिया को सीधे रूप में रखा गया है। इससे अपेक्षित परिणाम—दुष्टता का कुछ भी शेष न रहना—व्यक्त होता है, पर ‘न मिले’ की मूल भाषायी कसावट और सम्भावित तनाव भी सुरक्षित रहता है।
theological_decisions:
- issue: दुष्ट की ‘बाँह’ के रूपक का अनुवाद
  choice: मुख्य पाठ में ठोस बिंब ‘बाँह’ बनाए रखना
  alternative: ‘शक्ति’ या ‘सामर्थ्य’ कहना
  rationale: यह प्रार्थना अत्याचारी की हानि पहुँचाने की क्षमता तोड़ने के लिए है। मूल काव्यात्मक बिंब पाठक को यह अर्थ ग्रहण करने देता है और अनुवाद में अमूर्त व्याख्या थोपने से बचाता है।
- issue: अन्तिम पद בַל תִּמְצָא का अर्थ-संबंध
  choice: ‘जब तक कुछ भी न मिले’
  alternative: ‘ताकि कुछ भी न मिले’ अथवा ‘ढूँढ़ने पर वह न मिले’
  rationale: मुख्य पाठ खोज की प्रक्रिया और वांछित परिणाम को जोड़ता है, पर इसे पूर्ण विनाश की स्पष्ट सैद्धान्तिक घोषणा में नहीं बदलता।
- issue: רָשָׁע וָרָע में एक या दो वर्णन
  choice: एक ही प्रतिनिधि व्यक्ति के संयुक्त वर्णन के रूप में ‘दुष्ट और बुरे मनुष्य’
  alternative: 'दो समानांतर व्यक्तिवाचक पद: ‘दुष्ट और कुकर्मी’'
  rationale: एकवचन ‘बाँह’ और ‘उसकी दुष्टता’ संयुक्त वर्णन का समर्थन करते हैं, फिर भी इब्रानी में दो समानांतर संज्ञात्मक विशेषण समझने की सम्भावना है; उसे पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और प्रार्थनात्मक रखी गई है। ‘बाँह तोड़ दे’ मूल काव्यात्मक तीव्रता को बनाए रखता है; ‘खोज निकाल’ सामान्य पाठक के लिए स्पष्ट है और जाँच अथवा न्यायिक पड़ताल का भाव भी देता है।
