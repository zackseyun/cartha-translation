  yaml_path: translation/ot/psalms/010/008.yaml
  text: He sits in ambush in the villages[a]; in the hiding places he murders the innocent[b]; his eyes watch for the helpless.
translation:
  language: hi
  text: वह बस्तियों में घात लगाकर बैठता है[a]; छिपने की जगहों में वह निर्दोष की हत्या करता है; उसकी आँखें असहाय की ताक में रहती हैं[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “बस्तियों” का अनुवाद “गाँवों” या “आबादियों” भी किया जा सकता है; यहाँ “अहातों” का अर्थ भी संभव है, पर उसकी संभावना कम है।
    reason: lexical_alternative
  - marker: b
    text: अंतिम वाक्यांश कठिन और मुहावरेदार है। अधिक शाब्दिक रूप में क्रिया का संबंध छिपने या दुबकने से है; “उसकी आँखें” के साथ आशय किसी असहाय शिकार पर छिपकर निगाह रखने का है।
    reason: lexical_alternative
