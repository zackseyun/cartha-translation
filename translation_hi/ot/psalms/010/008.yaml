- source_word: יַהֲרֹג נָקִי
  choice: निर्दोष की हत्या करता है
  rationale: क्रिया मूलतः मार डालने को व्यक्त करती है; निर्दोष व्यक्ति और घातक संदर्भ के कारण ‘हत्या’ अनैतिक तथा जानबूझकर किए गए वध का स्वाभाविक संकेत देती है।
- source_word: עֵינָיו
  choice: उसकी आँखें
  rationale: मूल की सजीव और ठोस शारीरिक छवि को ज्यों का त्यों रखा गया है।
- source_word: לְחֵלְכָה
  choice: असहाय पर
  rationale: दुर्लभ और कठिन संज्ञा यहाँ शोषण के लिए निशाना बनाए गए निर्बल या दुर्भाग्यग्रस्त व्यक्ति को सूचित करती है; ‘असहाय’ संदर्भ में स्पष्ट और स्वाभाविक है।
- source_word: יִצְפֹּנוּ
  choice: घात लगाए रहती हैं
  rationale: रूप का शाब्दिक संबंध छिपने से है, पर ‘आँखें’ के साथ इसका आशय किसी शिकार पर छिपकर निगाह रखने का है; यह हिन्दी मुहावरा उस शिकारी भाव को सुरक्षित रखता है।
