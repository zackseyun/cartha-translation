id: PSA.10.5
reference: Psalms 10:5
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: יָ֘חִ֤ילוּ דרכ/ו בְּ/כָל עֵ֗ת מָר֣וֹם מִ֭שְׁפָּטֶי/ךָ מִ/נֶּגְדּ֑/וֹ כָּל צ֝וֹרְרָ֗י/ו יָפִ֥יחַ בָּ/הֶֽם׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/010/005.yaml
  text: His ways prosper at all times[a]; your judgments are on high, out of his sight; as for all his adversaries[b], he snorts at them.
translation:
  language: hi
  text: 'उसके मार्ग हर समय सफल होते हैं[a];

    तेरे न्याय बहुत ऊँचे, उसकी दृष्टि से दूर हैं;

    वह अपने सभी विरोधियों पर तिरस्कार से फूँक मारता है[b]।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसके मार्ग हर समय दृढ़ बने रहते हैं।” यहाँ प्रयुक्त इब्रानी क्रिया कठिन है और उसका संबंध ऐंठने या प्रसव-पीड़ा से भी जोड़ा गया है; पर संदर्भ लगातार सफलता या सुरक्षा के अर्थ का समर्थन करता है।
    reason: lexical_alternative
  - marker: b
    text: 'शाब्दिक भाव: वह उन पर फूँकता या फुँफकारता है—यह तिरस्कार का सजीव चित्र है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: יָחִילוּ
  choice: सफल होते हैं
  rationale: क्रिया का अर्थ यहाँ कठिन है, पर भजन के संदर्भ में दुष्ट के लगातार सफल और सुरक्षित बने रहने की शिकायत सबसे उपयुक्त बैठती है।
- source_word: דרכו
  choice: उसके मार्ग
  rationale: इब्रानी मुहावरा व्यक्ति के आचरण और जीवन की दिशा को सूचित करता है; हिन्दी में ‘मार्ग’ काव्यात्मक रूपक को बनाए रखता है।
- source_word: בְּכָל עֵת
  choice: हर समय
  rationale: यह निरंतरता व्यक्त करने वाला स्वाभाविक और स्पष्ट हिन्दी पदबंध है।
- source_word: מָרוֹם מִשְׁפָּטֶיךָ מִנֶּגְדּוֹ
  choice: तेरे न्याय बहुत ऊँचे, उसकी दृष्टि से दूर हैं
  rationale: यह स्थान-संबंधी रूपक और दुष्ट की पहुँच या ध्यान से परमेश्वर के न्याय की दूरी—दोनों को बिना पूरी तरह व्याख्यायित किए बनाए रखता है।
- source_word: כָּל צוֹרְרָיו
  choice: अपने सभी विरोधियों
  rationale: ‘विरोधी’ शत्रुता और सक्रिय प्रतिरोध दोनों को व्यक्त करता है और आधुनिक हिन्दी में सहज है।
- source_word: יָפִיחַ בָּהֶם
  choice: उन पर तिरस्कार से फूँक मारता है
  rationale: यह दर्पपूर्ण, तिरस्कारसूचक श्वास छोड़ने के सजीव चित्र को बचाता है; केवल ‘उपहास करता है’ कहने से मूल चित्र लुप्त हो जाता।
theological_decisions:
- issue: आरंभिक क्रिया יָחִילוּ दुष्ट की दशा के बारे में क्या कहती है
  choice: दुष्ट के मार्ग लगातार सफल होते हैं
  alternative: उसके मार्ग हर समय दृढ़ या सुरक्षित रहते हैं; अथवा क्रिया का अधिक शाब्दिक अर्थ ‘ऐंठना/प्रसव-पीड़ा सहना’ लिया जाए
  rationale: भजन में दुष्ट की दिखाई देने वाली सफलता और घमंड पर विलाप है। आगे परमेश्वर के न्याय का उसकी दृष्टि से दूर होना और विरोधियों के प्रति उसका तिरस्कार इसी अर्थ का समर्थन करते हैं।
- issue: परमेश्वर के न्याय का ‘ऊँचा’ होना
  choice: स्थान-संबंधी रूपक को रखते हुए उन्हें दुष्ट की दृष्टि से दूर बताया गया है
  alternative: इसे सीधे ‘उसकी समझ से परे’ या ‘वह उनकी परवाह नहीं करता’ कहा जाए
  rationale: मूल पाठ ऊँचाई और सामने/दृष्टि के स्थानिक शब्दों का प्रयोग करता है। प्रस्तावित अनुवाद संभावित अर्थों—अप्राप्यता, अदृश्यता और उपेक्षा—को किसी एक व्याख्या में सीमित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण काव्यात्मक शैली रखी गई है। ‘मार्ग’, ‘न्याय’ और ‘दृष्टि से दूर’ मूल इब्रानी रूपकों को सुरक्षित रखते हैं, जबकि वाक्यरचना सामान्य पाठक के लिए सहज है। संबोधन में भजन की निकटता बनाए रखने के लिए एकवचन ‘तेरे’ का प्रयोग किया गया है।
