id: PSA.10.1
reference: Psalms 10:1
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: לָ/מָ֣ה יְ֭הוָה תַּעֲמֹ֣ד בְּ/רָח֑וֹק תַּ֝עְלִ֗ים לְ/עִתּ֥וֹת בַּצָּרָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/010/001.yaml
  text: Why[a], Yahweh, do you stand far away? Why do you hide yourself in times of trouble?
translation:
  language: hi
  text: हे यहोवा, आप दूर क्यों खड़े हैं? संकट के समय आप अपने को क्यों छिपाते हैं?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לָמָה
  choice: क्यों
  rationale: यह प्रश्नवाचक क्रियाविशेषण विलाप की सीधी और भावपूर्ण पूछताछ व्यक्त करता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिन्दी में प्रचलित लिप्यंतरण के द्वारा इब्रानी परमेश्वर-नाम को उपाधि से प्रतिस्थापित किए बिना सुरक्षित रखा गया है।
- source_word: תַּעֲמֹד
  choice: खड़े रहते हैं
  rationale: עמד के स्थानिक बिंब को बनाए रखता है और साथ ही यहाँ व्यक्त लगातार प्रतीत होने वाली दूरी को स्वाभाविक हिन्दी में दर्शाता है।
- source_word: בְּרָחוֹק
  choice: दूर
  rationale: यह परमेश्वर की अनुभव की गई दूरी का स्थानिक रूपक संक्षिप्त और स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: תַּעְלִים
  choice: अपने को छिपाते हैं
  rationale: हिफ़ील रूप यहाँ स्वयं को दृष्टि या अनुभव से ओझल करने का भाव देता है; यह अनावश्यक व्याख्या किए बिना उस भाव को व्यक्त करता है।
- source_word: לְעִתּוֹת
  choice: समय
  rationale: बहुवचन עת का कालवाचक प्रयोग हिन्दी में ‘के समय’ से सहज रूप में व्यक्त होता है; हिन्दी में एकवचन सामूहिक अर्थ समेटता है।
- source_word: בַּצָּרָה
  choice: संकट
  rationale: צָרָה की विपत्ति, परेशानी और घोर कठिनाई की व्यापक अर्थ-सीमा को आधुनिक, गरिमापूर्ण हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: प्रभु
  rationale: मूल पाठ में निजी नाम है; इसलिए उसे सामान्य उपाधि से बदलने के बजाय हिन्दी में परिचित लिप्यंतरण से प्रस्तुत किया गया है।
- issue: दूसरे चरण में प्रश्नवाचक शब्द की पुनरावृत्ति
  choice: दूसरे वाक्य में भी ‘क्यों’ स्पष्ट किया गया
  alternative: ‘संकट के समय आप अपने को छिपाते हैं?’
  rationale: इब्रानी में दूसरा לָמָה नहीं है, पर समानांतर काव्य-संरचना पहले प्रश्न को दूसरे चरण तक विस्तारित करती है; हिन्दी में ‘क्यों’ दोहराने से विलाप का आशय स्पष्ट और स्वाभाविक रहता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; आदरार्थक ‘आप’ और संबोधन ‘हे’ से प्रार्थनात्मक, गरिमापूर्ण स्वर रखा गया है। काव्यात्मक स्थानिक रूपक को सरल भाषा में सुरक्षित रखा गया है।
