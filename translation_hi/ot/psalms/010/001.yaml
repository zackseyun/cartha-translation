  naturalness: The Hindi is clear, dignified, and natural for a lament addressed to God. ‘संकट के समय’ and ‘अपने को छिपाते हैं’ are idiomatic modern standard Hindi.
  terminology: ‘यहोवा’ is an established Hindi rendering of the Tetragrammaton and preserves a personal name rather than replacing it with a title. ‘संकट’ suitably renders the broad sense of צָרָה.
