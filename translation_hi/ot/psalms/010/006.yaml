base_translation:
  language: en
  yaml_path: translation/ot/psalms/010/006.yaml
  text: He says in his heart[a], “I will not be shaken[b]; through generation after generation I will not be in trouble.”
translation:
  language: hi
  text: वह अपने मन में कहता है, “मैं कभी नहीं डगमगाऊँगा; पीढ़ी-दर-पीढ़ी मुझ पर कोई विपत्ति नहीं आएगी[a]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अंतिम वाक्यांश इब्रानी में संक्षिप्त और अस्पष्ट है। इसका अनुवाद यह भी हो सकता है: “पीढ़ी-दर-पीढ़ी मैं विपत्ति में नहीं पड़ूँगा,” अथवा, दीर्घवृत्त को रखते हुए, “पीढ़ी-दर-पीढ़ी, वह जो विपत्ति में नहीं है।”'
    reason: alternative_reading
lexical_decisions:
- source_word: אָמַר
  choice: कहता है
  rationale: काव्य में यह पूर्ण रूप वर्तमान-जैसे सजीव कथन के रूप में प्रयुक्त हो सकता है; संदर्भ दुष्ट के लगातार आत्मविश्वासी विचार को चित्रित करता है।
- source_word: בְּלִבּוֹ
  choice: अपने मन में
  rationale: यह भीतर के विचार या स्वयं से कही गई बात का इब्रानी मुहावरा है; आधुनिक हिन्दी में स्वाभाविक रहते हुए आंतरिक वाणी का भाव सुरक्षित रखता है।
- source_word: בַּל אֶמּוֹט
  choice: मैं कभी नहीं डगमगाऊँगा
  rationale: מוט का निफ़अल रूप हिलने, अस्थिर होने या डगमगाने का अर्थ देता है। नकार के साथ ‘कभी नहीं डगमगाऊँगा’ घमंडी स्थिरता के दावे को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: לְדֹר וָדֹר
  choice: पीढ़ी-दर-पीढ़ी
  rationale: यह लगातार आने वाली पीढ़ियों तक बने रहने का भाव देता है; हिन्दी का यह पदबंध संक्षिप्त, परिचित और काव्यात्मक है।
- source_word: אֲשֶׁר לֹא בְרָע
  choice: मुझ पर कोई विपत्ति नहीं आएगी
  rationale: अंतिम उपवाक्य संक्षिप्त और व्याकरणतः अस्पष्ट है। प्रथम पुरुष के आत्मविश्वासी कथन को जारी रखते हुए यह अनिष्ट या विपत्ति से बचे रहने का आशय स्पष्ट करता है।
theological_decisions:
- issue: अंतिम संक्षिप्त उपवाक्य का संबंध और वक्ता का पुरुष
  choice: 'इसे दुष्ट की प्रथम-पुरुष आत्मवाणी की निरंतरता के रूप में प्रस्तुत किया गया है: ‘मुझ पर कोई विपत्ति नहीं आएगी।’'
  alternative: 'इसे वक्ता का सापेक्ष वर्णन माना जा सकता है: ‘जो विपत्ति में नहीं पड़ेगा,’ अथवा अधिक शाब्दिक रूप में ‘पीढ़ी-दर-पीढ़ी, जो अनिष्ट में नहीं।’'
  rationale: संदर्भ में पूरी पंक्ति दुष्ट के मन का घमंडी दावा है, इसलिए प्रथम पुरुष बनाए रखना सबसे सुसंगत है। फिर भी मूल इब्रानी की वास्तविक दीर्घवृत्तता और वैकल्पिक वाक्य-संबंध को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज किंतु गरिमापूर्ण काव्यात्मक गद्य रखा गया है। ‘डगमगाऊँगा’ स्थिरता के रूपक को बनाए रखता है और ‘विपत्ति’ רָע के संदर्भगत अर्थ को साधारण पाठक के लिए स्पष्ट करता है।
