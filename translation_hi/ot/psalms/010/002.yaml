source:
  edition: WLC
  text: בְּ/גַאֲוַ֣ת רָ֭שָׁע יִדְלַ֣ק עָנִ֑י יִתָּפְשׂ֓וּ בִּ/מְזִמּ֖וֹת ז֣וּ חָשָֽׁבוּ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/010/002.yaml
  text: In the pride of the wicked[a], the poor man is hotly pursued[b]; let them be caught in the schemes they have devised.
translation:
  language: hi
  text: 'दुष्ट के घमंड के कारण गरीब का बुरी तरह पीछा किया जाता है[a];

    वे उन षड्यंत्रों में फँसें, जिन्हें उन्होंने रचा है[b]।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “दुष्ट अपने घमंड में गरीब का बुरी तरह पीछा करता है।” इब्रानी पंक्ति का वाक्य-विन्यास संकुचित है; क्रिया सक्रिय रूप में है, पर गरीब को पीछा किए जाने वाले व्यक्ति के रूप में भी समझा जा सकता है।
    reason: lexical_alternative
  - marker: b
    text: या, “वे उन षड्यंत्रों में फँस जाते हैं, जिन्हें उन्होंने रचा है।” इब्रानी रूप को प्रार्थना के बजाय कथन के रूप में भी पढ़ा जा सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: בְּגַאֲוַת
  choice: घमंड के कारण
  rationale: בְּ के कारणात्मक/परिस्थितिजन्य बल और גַּאֲוָה के अहंकारी गर्व को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: רָשָׁע
  choice: दुष्ट
  rationale: यह एकवचन संज्ञीकृत विशेषण है, जो यहाँ दुष्ट व्यक्ति का प्रतिनिधिक उल्लेख करता है; हिन्दी में ‘दुष्ट’ इसी संक्षिप्तता को बनाए रखता है।
- source_word: יִדְלַק
  choice: डटकर पीछा किया जाता है
  rationale: דלק में जलने और निकटता से पीछा करने, दोनों की अर्थ-छाया है। प्रसंग में शत्रुतापूर्ण, तीव्र पीछा अभिप्रेत है; कर्मवाच्य अनुवाद दरिद्र को पीड़ित पक्ष के रूप में सामने रखता है और संकुचित इब्रानी वाक्य-विन्यास को टिप्पणी में सुरक्षित रखता है।
- source_word: עָנִי
  choice: दरिद्र
  rationale: עָנִי निर्धन, दुःखी अथवा उत्पीड़ित व्यक्ति को सूचित कर सकता है। ‘दरिद्र’ प्रतिनिधिक एकवचन और आर्थिक-सामाजिक असहायता दोनों को संक्षेप में व्यक्त करता है।
- source_word: יִתָּפְשׂוּ
  choice: वे ... फँसें
  rationale: निफ़अल अपूर्ण रूप को यहाँ इच्छा/प्रार्थना के रूप में लिया गया है, जो दुष्टों के अपने ही जाल में पड़ने की विनती व्यक्त करता है। कथनात्मक पाठ की सम्भावना पादटिप्पणी में दी गई है।
- source_word: בִּמְזִמּוֹת
  choice: षड्यंत्रों में
  rationale: מְזִמּוֹת प्रसंग में दुर्भावनापूर्ण योजनाएँ हैं; ‘षड्यंत्र’ कपटपूर्ण और हानिकारक मंशा को स्पष्ट करता है, जबकि ‘में’ उसी योजना के भीतर फँसने की छवि बनाए रखता है।
- source_word: זוּ
  choice: जिन्हें
  rationale: זוּ सम्बन्धसूचक अव्यय है। हिन्दी में ‘जिन्हें’ बहुवचन ‘षड्यंत्रों’ को अगले उपवाक्य से स्वाभाविक रूप से जोड़ता है।
- source_word: חָשָׁבוּ
  choice: उन्होंने रचा है
  rationale: חשב यहाँ सोच-समझकर योजना बनाने को दर्शाता है। ‘रचा है’ जानबूझकर बनाई गई कपटपूर्ण योजना और उसके वर्तमान परिणाम को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: पहले चरण का संकुचित वाक्य-विन्यास और कर्ता-कर्म सम्बन्ध
  choice: दरिद्र को पीछा किए जाने वाले पीड़ित के रूप में रखते हुए कर्मवाच्य अनुवाद
  alternative: दुष्ट घमंड से दरिद्र का डटकर पीछा करता है
  rationale: בְּגַאֲוַת רָשָׁע पदबंध शब्दशः ‘दुष्ट के घमंड में/के कारण’ है, जबकि יִדְלַק सक्रिय रूप है और पंक्ति का वाक्य-विन्यास अत्यन्त संकुचित है। मुख्य पाठ प्रसंगगत अर्थ देता है, पर वैकल्पिक सक्रिय संरचना पादटिप्पणी में सुरक्षित है।
- issue: दूसरे चरण में יִתָּפְשׂוּ का विधि-बल
  choice: 'इच्छा/प्रार्थना: ‘वे ... फँसें’'
  alternative: 'वर्णनात्मक कथन: ‘वे ... फँस जाते हैं/फँसे हैं’'
  rationale: अपूर्ण रूप को प्रार्थनात्मक इच्छा मानना भजन की पुकार और नैतिक प्रतिफल के भाव के अनुकूल है; फिर भी इब्रानी रूप कथन के रूप में भी समझा जा सकता है, इसलिए उस वास्तविक अस्पष्टता को पादटिप्पणी में रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘डटकर पीछा’ तीव्रता व्यक्त करता है; ‘षड्यंत्र’ दुर्भावनापूर्ण योजनाओं के लिए प्रचलित और स्पष्ट शब्द है। काव्यात्मक समानता बनाए रखने के लिए दो चरण अलग पंक्तियों में रखे गए हैं।
