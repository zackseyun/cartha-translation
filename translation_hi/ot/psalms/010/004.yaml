language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: רָשָׁ֗ע כְּ/גֹ֣בַהּ אַ֭פּ/וֹ בַּל יִדְרֹ֑שׁ אֵ֥ין אֱ֝לֹהִ֗ים כָּל מְזִמּוֹתָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/010/004.yaml
  text: In the pride of his face[a], the wicked man does not seek; all his thoughts are[b], “There is no God.”
translation:
  language: hi
  text: अपने घमंडी तेवर में[a] दुष्ट खोजने का प्रयत्न नहीं करता; उसके सारे विचारों में यही बात है—“कोई परमेश्वर नहीं है।”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “उसकी नाक/चेहरे की ऊँचाई में”; यह घमंड या अकड़ भरे तेवर का मुहावरा है।
    reason: cultural_note
  - marker: b
    text: 'इसका अनुवाद यह भी हो सकता है: “उसके किसी भी विचार में परमेश्वर नहीं है।” इब्रानी को दुष्ट के विचार का सीधा कथन या उसके सारे चिंतन से परमेश्वर की अनुपस्थिति—दोनों तरह समझा जा सकता है।'
    reason: alternative_reading
lexical_decisions:
- source_word: רָשָׁע
  choice: दुष्ट
  rationale: एकवचन पुल्लिंग विशेषण यहाँ संज्ञा के रूप में प्रयुक्त है; ‘दुष्ट’ प्रतिनिधि व्यक्ति का चित्र स्वाभाविक और संक्षिप्त ढंग से रखता है।
- source_word: כְּגֹבַהּ אַפּוֹ
  choice: अपने चेहरे के घमंड में
  rationale: גֹבַהּ ऊँचाई या अभिमान और אַף नाक/चेहरे का बिंब देता है। यह रूप इब्रानी की ठोस छवि रखते हुए घमंडी मुख-मुद्रा का भाव व्यक्त करता है।
- source_word: בַּל יִדְרֹשׁ
  choice: परमेश्वर को नहीं खोजता
  rationale: काव्यात्मक निषेध בַּל के साथ क्रिया चरित्रगत व्यवहार बताती है। कर्म मूल में स्पष्ट नहीं है, पर अगला खंड परमेश्वर को निहित विषय बनाता है; हिन्दी में कर्म जोड़ने से वाक्य स्वाभाविक और अर्थ स्पष्ट रहता है।
- source_word: אֵין אֱלֹהִים
  choice: कोई परमेश्वर नहीं है
  rationale: अस्तित्वसूचक निषेध को दुष्ट के विचार की विषयवस्तु के रूप में सीधे व्यक्त किया गया है।
- source_word: כָּל מְזִמּוֹתָיו
  choice: उसके सारे विचार यही हैं
  rationale: מְזִמּוֹת विचार, योजनाएँ या युक्तियाँ हो सकता है। यहाँ पूरे मानसिक रुझान को बताने के लिए ‘विचार’ सबसे उपयुक्त है और आगे के कथन से स्वाभाविक रूप से जुड़ता है।
theological_decisions:
- issue: अंतिम खंड का वाक्य-संबंध
  choice: 'अंतिम शब्दों को दुष्ट के विचार की विषयवस्तु माना गया है: “कोई परमेश्वर नहीं है।”'
  alternative: “उसके किसी भी विचार में परमेश्वर नहीं है।”
  rationale: इब्रानी शब्दक्रम दोनों अर्थों की अनुमति देता है। मुख्य पाठ तीखे अस्तित्व-निषेध को सामने रखता है, जबकि दूसरी प्राचीन और संभव समझ को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण काव्यात्मक गद्य। ‘चेहरे के घमंड’ से मूल बिंब रखा गया है; पादटिप्पणी कठिन मुहावरे और अंतिम खंड की वास्तविक वाक्यगत अस्पष्टता स्पष्ट करती है।
