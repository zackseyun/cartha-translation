  text: अनाथों[a] और कुचले हुओं[b] को न्याय दिलाने के लिए, ताकि धरती से आया कोई मनुष्य[c] फिर कभी आतंक न फैलाए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “पितृहीन।”
    reason: lexical_alternative
  - marker: b
    text: या, “पीड़ित” या “दबा हुआ।”
    reason: lexical_alternative
  - marker: c
    text: हिब्रू में शाब्दिक रूप से, “धरती से मनुष्य”; अर्थात केवल नश्वर मनुष्य।
    reason: lexical_alternative
lexical_decisions:
- source_word: לִשְׁפֹּט
  choice: न्याय दिलाने के लिए
  rationale: यहाँ infinitive पिछले संदर्भ में परमेश्वर के सुनने का उद्देश्य या परिणाम बताता है। ‘न्याय दिलाना’ न्यायिक कार्रवाई और निर्बल के पक्ष में न्याय—दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: יָתוֹם
  choice: अनाथ
  rationale: यह शब्द उस बच्चे के लिए सामाजिक-कानूनी श्रेणी को सूचित करता है जो पिता के संरक्षण से वंचित है। आधुनिक हिन्दी में ‘अनाथ’ सबसे सहज और परिचित समतुल्य है।
- source_word: וָדָךְ
  choice: और कुचले हुए को
  rationale: דךְ का मूल बिंब दबाए या कुचले गए व्यक्ति का है। ‘कुचला हुआ’ सामाजिक उत्पीड़न तथा गहरी दीन दशा दोनों को बनाए रखता है, बिना इसे केवल आर्थिक गरीबी तक सीमित किए।
- source_word: בַּל יוֹסִיף עוֹד
  choice: फिर कभी ... न फैलाए
  rationale: בַּל के साथ יסף और עוֹד आगे उस कार्य के जारी रहने या फिर होने का निषेध व्यक्त करते हैं। ‘फिर कभी ... न’ हिन्दी में उद्देश्य/परिणाम को संक्षेप और स्वाभाविक रूप से रखता है।
- source_word: לַעֲרֹץ
  choice: आतंक ... फैलाए
  rationale: ערץ भय या आतंक उत्पन्न करने का भाव रखता है। ‘आतंक फैलाना’ हिन्दी में इस causative शक्ति को ‘डरना’ की अपेक्षा अधिक स्पष्टता से व्यक्त करता है।
- source_word: אֱנוֹשׁ מִן־הָאָרֶץ
  choice: धरती का मनुष्य
  rationale: אֱנוֹשׁ नश्वर, दुर्बल मनुष्य पर बल दे सकता है और מִן־הָאָרֶץ उसके धरती से संबंध को उभारता है। ‘धरती का मनुष्य’ असामान्य किंतु अर्थपूर्ण हिब्रू अभिव्यक्ति और परमेश्वर के सामने उसकी सीमितता को सुरक्षित रखता है।
theological_decisions:
- issue: אֱנוֹשׁ में एकवचन पुल्लिंग का प्रतिनिधिक प्रयोग
  choice: धरती का मनुष्य
  alternative: धरती के नश्वर लोग
  rationale: मूल पाठ एकवचन पुल्लिंग में एक प्रतिनिधिक मानव अत्याचारी को सामने रखता है। इसे बहुवचन या अमूर्त ‘मानवता’ बनाने के बजाय एकवचन रखने से मूल की आलंकारिक धार और नश्वरता का विरोधाभास बचता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। ‘धरती का मनुष्य’ मूल की चिह्नित अभिव्यक्ति को सुरक्षित रखता है; ‘आतंक फैलाए’ सहज हिन्दी में causative अर्थ देता है।
