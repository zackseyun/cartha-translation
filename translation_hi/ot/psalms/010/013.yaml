  text: עַל מֶ֤ה נִאֵ֖ץ רָשָׁ֥ע אֱלֹהִ֑ים אָמַ֥ר בְּ֝/לִבּ֗/וֹ לֹ֣א תִּדְרֹֽשׁ־׀׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/010/013.yaml
  text: Why does the wicked man despise God? He says in his heart, “You will not call to account.”
translation:
  language: hi
  text: 'दुष्ट परमेश्वर का तिरस्कार क्यों करता है?

    वह अपने मन में कहता है, “तू हिसाब नहीं माँगेगा।”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נִאֵץ
  choice: तिरस्कार करता है
  rationale: यह क्रिया परमेश्वर के प्रति अपमान और अवमानना व्यक्त करती है; आधुनिक हिन्दी में ‘तिरस्कार करना’ स्वाभाविक और गरिमापूर्ण है।
- source_word: רָשָׁע
  choice: दुष्ट
  rationale: संज्ञा के रूप में प्रयुक्त विशेषण को ‘दुष्ट’ कहना संक्षिप्त है और नैतिक अर्थ बनाए रखता है।
- source_word: בְּלִבּוֹ
  choice: अपने मन में
  rationale: इब्रानी में ‘हृदय’ आंतरिक विचार और संकल्प का केंद्र है; हिन्दी में ‘मन में’ इसी भाव को स्वाभाविक रूप से प्रकट करता है।
- source_word: תִּדְרֹשׁ
  choice: हिसाब माँगेगा
  rationale: דרש का मूल अर्थ ‘खोजना/पूछताछ करना’ है और इस प्रसंग में दुष्टता की जाँच करके उत्तरदायी ठहराना अभिप्रेत है; ‘हिसाब माँगना’ इस न्यायिक आशय को सहज हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: לֹא תִּדְרֹשׁ में परमेश्वर की जाँच अथवा दंडात्मक जवाबदेही का आशय
  choice: तू हिसाब नहीं माँगेगा
  alternative: तू इसकी जाँच नहीं करेगा
  rationale: चयनित पाठ जवाबदेही के भाव को स्पष्ट करता है, पर यह नहीं जोड़ता कि परमेश्वर किस प्रकार या कब दंड देगा।
- issue: दूसरे पुरुष के कर्ता की पहचान
  choice: ‘तू’ द्वारा परमेश्वर को प्रत्यक्ष संबोधन
  alternative: ‘वह हिसाब नहीं माँगेगा’
  rationale: मसोरेटिक पाठ תִּדְרֹשׁ दूसरे पुरुष पुल्लिंग एकवचन है, इसलिए दुष्ट के मन की बात परमेश्वर को संबोधित कथन के रूप में रखी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी; संक्षिप्त काव्यात्मक प्रश्न और उसके बाद आंतरिक कथन। ‘तू’ मूल इब्रानी के एकवचन प्रत्यक्ष संबोधन को सुरक्षित रखता है और यहाँ अनादरपूर्ण हिन्दी संबोधन के बजाय काव्यात्मक-धार्मिक प्रयोग है।
