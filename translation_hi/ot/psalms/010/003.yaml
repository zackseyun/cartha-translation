  text: כִּֽי הִלֵּ֣ל רָ֭שָׁע עַל תַּאֲוַ֣ת נַפְשׁ֑/וֹ וּ/בֹצֵ֥עַ בֵּ֝רֵ֗ךְ נִ֘אֵ֥ץ יְהוָֽה־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/010/003.yaml
  text: For the wicked man boasts in the desire of his soul, and the greedy man blesses himself and despises the LORD.
translation:
  language: hi
  text: क्योंकि दुष्ट अपने मन की लालसा पर घमंड करता है, और लोभी अपने आप को आशीष देता और यहोवा का तिरस्कार करता है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִלֵּל
  choice: घमंड करता है
  rationale: यहाँ क्रिया का अर्थ अपनी लालसा पर इतराना या डींग मारना है; ‘घमंड करना’ सहज और संदर्भानुकूल है।
- source_word: תַּאֲוַת נַפְשׁוֹ
  choice: अपने मन की लालसा
  rationale: נפשׁ यहाँ व्यक्ति के भीतरी स्व या मन को सूचित करता है; यह पदबंध मूल की आत्मपरक लालसा को स्वाभाविक हिन्दी में रखता है।
- source_word: בֹצֵעַ
  choice: लोभी
  rationale: शब्द अनुचित लाभ पाने या लालच करने वाले व्यक्ति का बोध कराता है; संक्षिप्त ‘लोभी’ इस नैतिक अर्थ को स्पष्ट रखता है।
- source_word: בֵּרֵךְ
  choice: अपने को धन्य कहता
  rationale: मसोराई स्वरांकन के अनुसार क्रिया ‘आशीष देना/धन्य कहना’ है। कर्म स्पष्ट न होने पर आत्मवाचक अर्थ संदर्भ और प्राचीन अनुवाद-परंपरा के अनुकूल है।
- source_word: נִאֵץ
  choice: तिरस्कार करता है
  rationale: क्रिया अवमानना या अपमानपूर्ण अस्वीकार व्यक्त करती है; ‘तिरस्कार’ इसका सीधा और गरिमापूर्ण हिन्दी रूप है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: व्यक्तिगत दिव्य नाम को सामान्य उपाधि में बदलने के बजाय प्रचलित हिन्दी रूप ‘यहोवा’ से दर्शाया गया है।
theological_decisions:
- issue: וּבֹצֵעַ בֵּרֵךְ נִאֵץ יְהוָה का वाक्य-संबंध
  choice: लोभी अपने को धन्य कहता और यहोवा का तिरस्कार करता है
  alternative: लोभी यहोवा को कोसता और उसका तिरस्कार करता है
  rationale: בֵּרֵךְ का सामान्य अर्थ ‘धन्य कहना/आशीष देना’ बनाए रखा गया है और अंग्रेज़ी परामर्श-पाठ के अनुरूप लुप्त कर्म को आत्मवाचक समझा गया है। साथ ही נִאֵץ को स्वतंत्र समन्वित क्रिया माना गया है। यह कठिन इब्रानी वाक्यरचना की एक संभावित व्याख्या है, पर अनावश्यक रूप से ‘कोसना’ अर्थ नहीं थोपा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण काव्यात्मक गद्य। ‘अपने मन की लालसा’ मूल के נַפְשׁוֹ को अत्यधिक शाब्दिक ‘अपने प्राण की’ की अपेक्षा सामान्य पाठक के लिए स्वाभाविक बनाता है।
