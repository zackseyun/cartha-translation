  text: Yahweh is King forever and ever[a]; nations have perished from his land.
translation:
  language: hi
  text: 'याहवे सदा-सर्वदा राजा है;

    उसकी भूमि से राष्ट्र नष्ट हो गए हैं।[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘उसकी पृथ्वी से।’ इब्रानी संज्ञा का अर्थ प्रसंग के अनुसार ‘भूमि/देश’ या ‘पृथ्वी’ हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय देवनागरी में प्रचलित निकट लिप्यंतरण द्वारा सुरक्षित रखा गया है।
- source_word: מֶלֶךְ
  choice: राजा है
  rationale: विधेय संज्ञा के रूप में इब्रानी की नामवाचक शक्ति को बनाए रखते हुए यह आधुनिक हिन्दी में स्वाभाविक है।
- source_word: עוֹלָם וָעֶד
  choice: सदा-सर्वदा
  rationale: यह युग्म अनंत अवधि पर बल देता है; ‘सदा-सर्वदा’ हिन्दी में उसके प्रबल और काव्यात्मक भाव को स्वाभाविक रूप से व्यक्त करता है।
- source_word: אָבְדוּ
  choice: मिट गई हैं
  rationale: इब्रानी पूर्ण क्रिया संपन्न विनाश या लोप को बताती है। ‘मिट गई हैं’ उस पूर्ण परिणाम को स्वाभाविक हिन्दी में व्यक्त करती है, बिना निष्क्रिय वाच्य जोड़ने के।
- source_word: גּוֹיִם
  choice: जातियाँ
  rationale: यहाँ शब्द विरोधी विदेशी जनसमूहों या राष्ट्रों के लिए है; ‘जातियाँ’ भजन-साहित्य में परिचित है और इसे किसी विशिष्ट धार्मिक श्रेणी तक सीमित नहीं करता।
- source_word: מֵאַרְצוֹ
  choice: उसके देश से
  rationale: אֶרֶץ का अर्थ ‘देश/भूमि’ या ‘पृथ्वी’ हो सकता है। प्रसंग में ठोस क्षेत्रीय अर्थ के कारण ‘उसके देश से’ मुख्य पाठ में रखा गया है और व्यापक विकल्प पादटिप्पणी में सुरक्षित है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में चार अक्षरों वाला व्यक्तिगत ईश्वरीय नाम सीधे आया है। ‘याहवे’ उसे उपाधि से प्रतिस्थापित किए बिना सुरक्षित रखता है।
- issue: אַרְצוֹ का दायरा
  choice: उसके देश से
  alternative: उसकी पृथ्वी से
  rationale: निकट प्रसंग ठोस क्षेत्रीय अर्थ का समर्थन करता है, पर इब्रानी संज्ञा का व्यापक, सार्वभौमिक अर्थ भी संभव है; इसलिए उस अस्पष्टता को पादटिप्पणी में रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और भजनोचित काव्यात्मक शैली अपनाई गई है। ‘सदा-सर्वदा’ मूल की बलवत्ता बनाए रखता है; पंक्ति-विभाजन इब्रानी कथनों की समानांतर संरचना को स्पष्ट करता है।
