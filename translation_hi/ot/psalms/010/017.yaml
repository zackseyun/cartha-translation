  text: תַּאֲוַ֬ת עֲנָוִ֣ים שָׁמַ֣עְתָּ יְהוָ֑ה תָּכִ֥ין לִ֝בָּ֗/ם תַּקְשִׁ֥יב אָזְנֶֽ/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/010/017.yaml
  text: O Yahweh[a], you have heard the desire of the humble; you will prepare their heart[b]; your ear will listen.
translation:
  language: hi
  text: हे याहवे, तूने दीनों[a] की अभिलाषा सुन ली है; तू उनके हृदय को दृढ़ करेगा[b]; तू कान लगाकर सुनेगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘नम्र जनों’ अथवा ‘पीड़ितों’।
    reason: lexical_alternative
  - marker: b
    text: या ‘स्थिर करेगा’ अथवा ‘तैयार करेगा’।
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּאֲוַת
  choice: अभिलाषा
  rationale: यह संज्ञा इच्छा या लालसा को व्यक्त करती है। प्रार्थना के संदर्भ में ‘अभिलाषा’ स्वाभाविक और गरिमापूर्ण है।
- source_word: עֲנָוִים
  choice: दीनों
  rationale: इस शब्द में नम्रता, दबे-कुचले होने और दुःख उठाने के अर्थ परस्पर जुड़े हैं। भजन 10 के पीड़ित जनों के संदर्भ में ‘दीनों’ इस अर्थ-विस्तार को यथासंभव बनाए रखता है।
- source_word: שָׁמַעְתָּ
  choice: तूने ... सुन ली है
  rationale: पूर्ण क्रिया को ऐसी संपन्न क्रिया के रूप में रखा गया है जिसका वर्तमान प्रार्थना में प्रभाव बना हुआ है।
- source_word: יְהוָה
  choice: यहवे
  rationale: इब्रानी व्यक्तिगत दिव्य नाम का लिप्यंतरण किया गया है; उसके स्थान पर कोई उपाधि नहीं रखी गई।
- source_word: תָּכִין
  choice: दृढ़ करेगा
  rationale: כון के हिफ़ील रूप में तैयार करने, स्थिर करने या दृढ़ करने का अर्थ हो सकता है। ‘हृदय’ के साथ ‘दृढ़ करेगा’ स्वाभाविक है और मूल अर्थ की स्थिरता को व्यक्त करता है।
- source_word: לִבָּם
  choice: उनके हृदय को
  rationale: इब्रानी का एकवचन सामूहिक ‘हृदय’ बनाए रखा गया है और उसे मन या अंतःकरण जैसे अधिक व्याख्यात्मक शब्द से नहीं बदला गया।
- source_word: תַּקְשִׁיב אָזְנֶךָ
  choice: तू कान लगाकर सुनेगा
  rationale: यह मुहावरा ध्यानपूर्वक सुनने का अर्थ और कान की मूल काव्यात्मक छवि दोनों स्वाभाविक हिन्दी में रखता है।
theological_decisions:
- issue: दिव्य नाम יְהוָה का अनुवाद
  choice: यहवे
  alternative: प्रभु
  rationale: मूल पाठ में व्यक्तिगत दिव्य नाम है; इसलिए उपाधि से प्रतिस्थापित करने के बजाय उसका लिप्यंतरण किया गया है।
- issue: עֲנָוִים का संदर्भगत अर्थ
  choice: दीनों
  alternative: नम्र जनों / पीड़ितों
  rationale: भजन का संदर्भ उत्पीड़ित लोगों का है, जबकि शब्द स्वयं नम्रता और दीनता भी जता सकता है। ‘दीनों’ इस तनाव को किसी एक अर्थ तक सीमित नहीं करता।
- issue: תָּכִין לִבָּם का अर्थ
  choice: उनके हृदय को दृढ़ करेगा
  alternative: उनके हृदय को तैयार करेगा / स्थिर करेगा
  rationale: क्रिया के अर्थ-क्षेत्र और ‘हृदय’ के साथ उसके प्रयोग को ध्यान में रखते हुए दृढ़ता का भाव मुख्य पाठ में रखा गया है, जबकि अन्य संभव अर्थ पाद-टिप्पणी में दिए गए हैं।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण प्रार्थना-काव्य की शैली अपनाई गई है। परमेश्वर को संबोधन में निकटता और इब्रानी एकवचन के अनुरूप ‘तू’ रखा गया है।
