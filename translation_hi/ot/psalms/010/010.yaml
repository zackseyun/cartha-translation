  text: He crouches[a]; he bows down[c][b], and the helpless fall by his might.
translation:
  language: hi
  text: वह दुबकता है, झुक जाता है, और असहाय लोग उसके बल से गिर पड़ते हैं।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इस पद का इब्रानी पाठ कठिन है। इसका अनुवाद यह भी हो सकता है: “वह दुबकता है, झुक जाता है, और असहाय लोग उसके बलवानों के द्वारा गिर पड़ते हैं।” कुछ लोग अंतिम पदबंध को “उसके शक्तिशाली पंजों में” समझते हैं; और क्रिया को “वह गिर पड़ता है” भी माना गया है।'
    reason: lexical_and_syntactic_alternatives
lexical_decisions:
- source_word: ו/דכה
  choice: वह दुबकता है
  rationale: इब्रानी रूप कठिन है, पर अगले क्रियापद और शिकार के प्रसंग में यह दुष्ट की नीची, घात लगाने वाली मुद्रा को सबसे स्वाभाविक रूप से व्यक्त करता है।
- source_word: יָשֹׁחַ
  choice: झुक जाता है
  rationale: क्रिया नीचे झुकने या दबकर बैठने का भाव देती है; यह पहले क्रियापद के समानांतर शारीरिक मुद्रा को बनाए रखती है।
- source_word: וְ/נָפַ֥ל ... חלכאים
  choice: और असहाय लोग ... गिर पड़ते हैं
  rationale: क्रिया रूप एकवचन है और वाक्य-विन्यास कठिन है, फिर भी निकट प्रसंग में חלכאים को आशयगत कर्ता मानना दुष्ट द्वारा निर्बलों को फँसाने की तस्वीर से अच्छी तरह मेल खाता है।
- source_word: בַּ֝/עֲצוּמָ֗י/ו
  choice: उसके बल से
  rationale: शाब्दिक बहुवचन का अर्थ 'उसके बलवान जन' हो सकता है, पर यहाँ उसे दुष्ट की सामर्थ्य के अर्थ में लेना स्वाभाविक और स्पष्ट है; दूसरी संभावनाएँ पादटिप्पणी में सुरक्षित हैं।
- source_word: חלכאים
  choice: असहाय लोग
  rationale: यह शब्द निर्बल, अभागे या सताए हुए लोगों को सूचित करता है; आधुनिक हिन्दी में 'असहाय लोग' उनकी सामाजिक असुरक्षा को स्पष्ट करता है।
theological_decisions:
- issue: וְנָפַל का कर्ता
  choice: असहाय लोग गिर पड़ते हैं
  alternative: वह गिर पड़ता है
  rationale: रूपात्मक एकवचन के बावजूद संक्षिप्त और कठिन वाक्य-विन्यास तथा आसपास के शिकारी-बनाम-असहाय प्रसंग में असहायों को आशयगत कर्ता मानने से अधिक सुसंगत अर्थ बनता है; अनिश्चितता पादटिप्पणी में बताई गई है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। 'दुबकता है' घात लगाने की मुद्रा को स्वाभाविक हिन्दी में व्यक्त करता है; कठिन इब्रानी पाठ की वास्तविक अस्पष्टता पादटिप्पणी में सुरक्षित रखी गई है।
