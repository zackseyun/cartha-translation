  yaml_path: translation/ot/psalms/010/009.yaml
  text: He lies in wait in hiding[a], like a lion in his lair; he lies in wait to seize the poor[c][b]; he seizes the poor when he drags him into his net.
translation:
  language: hi
  text: 'वह छिपकर[a] घात लगाए रहता है,

    जैसे सिंह अपनी मांद[b] में;

    वह गरीब को दबोचने के लिए घात लगाए रहता है;

    वह गरीब को अपने जाल में खींचकर[c] दबोच लेता है।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘किसी छिपे स्थान में’ या ‘गुप्त रूप से’।
    reason: lexical_alternative
  - marker: b
    text: या ‘अपनी ओट में’; इब्रानी शब्द किसी आश्रय, आड़ या झाड़ीदार छिपने की जगह को भी सूचित कर सकता है।
    reason: lexical_alternative
  - marker: c
    text: या ‘अपने जाल से खींचते हुए’; इब्रानी वाक्यांश साधन या साथ घटती क्रिया, दोनों का भाव दे सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: יֶאֱרֹב
  choice: घात लगाए रहता है
  rationale: यह क्रिया छिपकर आक्रमण के अवसर की प्रतीक्षा करने का भाव व्यक्त करती है। दोनों occurrences में एक ही पद रखकर इब्रानी पुनरावृत्ति और शिकारी भाव सुरक्षित रखा गया है।
- source_word: בַּמִּסְתָּר
  choice: छिपने की जगह में
  rationale: מִסְתָּר किसी गुप्त या ओट वाली जगह को सूचित करता है। यह रूप स्थान और छिपाव, दोनों भाव स्पष्ट करता है।
- source_word: כְּאַרְיֵה
  choice: जैसे सिंह
  rationale: शिकारी और हिंसक उपमा को सीधे और स्वाभाविक रूप में रखा गया है।
- source_word: בְסֻכֹּה
  choice: अपनी मांद में
  rationale: סֻכָּה मूलतः आश्रय, ओट या झाड़ीदार छिपने की जगह हो सकती है; सिंह की उपमा में ‘मांद’ स्वाभाविक है, जबकि व्यापक lexical range पादटिप्पणी में दी गई है।
- source_word: לַחֲטוֹף / יַחְטֹף
  choice: दबोचने / दबोच लेता है
  rationale: חטף अचानक और बलपूर्वक पकड़ लेने को व्यक्त करता है। ‘दबोचना’ सिंह की छवि और हिंसक पकड़ दोनों को सहज हिन्दी में बनाए रखता है; समान धातु की पुनरावृत्ति भी सुरक्षित है।
- source_word: עָנִי
  choice: गरीब
  rationale: עָנִי गरीब, पीड़ित या असहाय व्यक्ति का बोध करा सकता है। इस सामाजिक उत्पीड़न के संदर्भ में ‘गरीब’ सबसे सीधा और सामान्य आधुनिक हिन्दी विकल्प है।
- source_word: בְּמָשְׁכוֹ בְרִשְׁתּוֹ
  choice: अपने जाल में खींचकर
  rationale: ב prefixed infinitive साधन या साथ घटती परिस्थिति व्यक्त कर सकता है। ‘जाल में खींचकर’ प्रसंगगत फँसाने की क्रिया को स्वाभाविक हिन्दी में व्यक्त करता है, पर वैकल्पिक व्याकरणिक समझ पादटिप्पणी में सुरक्षित है।
