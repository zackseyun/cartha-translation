source:
  edition: WLC
  text: אָמַ֣ר בְּ֭/לִבּ/וֹ שָׁ֣כַֽח אֵ֑ל הִסְתִּ֥יר פָּ֝נָ֗י/ו בַּל רָאָ֥ה לָ/נֶֽצַח־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/010/011.yaml
  text: He says in his heart[a], “God has forgotten; he has hidden his face; he will never see.”
translation:
  language: hi
  text: वह अपने मन में कहता है[a], “परमेश्वर भूल गया है; उसने अपना मुख छिपा लिया है; वह कभी नहीं देखेगा।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसने अपने मन में कहा … परमेश्वर भूलता है … वह अपना मुख छिपाता है … वह सदा तक नहीं देखेगा।” हिब्रू कविता में यहाँ के सिद्ध क्रिया-रूपों का अनुवाद वर्तमानकाल या भूतकाल/पूर्ण वर्तमानकाल के भाव में किया जा सकता है।
    reason: क्रियाकाल की वास्तविक काव्यात्मक अस्पष्टता और वैकल्पिक अनुवाद को सुरक्षित रखना।
lexical_decisions:
- source_word: אָמַר
  choice: कहता है
  rationale: काव्य में यह सिद्ध रूप वर्तमान या सामान्यतः जारी कथन का भाव दे सकता है; प्रसंग दुष्ट के मन में चल रहे विचार को सजीव रूप से प्रस्तुत करता है।
- source_word: בְּלִבּוֹ
  choice: अपने मन में
  rationale: हिब्रू मुहावरा भीतर के विचार को व्यक्त करता है। हिन्दी में ‘अपने मन में’ स्वाभाविक है और मूल बिंब को बनाए रखता है।
- source_word: שָׁכַח
  choice: भूल गया है
  rationale: मूल क्रिया का अर्थ ‘भूलना’ है। पूर्ण वर्तमान भाव उस दावे को व्यक्त करता है कि परमेश्वर भूल चुका है और इसलिए कार्रवाई नहीं करेगा।
- source_word: אֵל
  choice: परमेश्वर
  rationale: यहाँ एकवचन אֵל सच्चे परमेश्वर के लिए प्रयुक्त है; आधुनिक हिन्दी बाइबलीय भाषा में ‘परमेश्वर’ स्पष्ट और गरिमापूर्ण है।
- source_word: הִסְתִּיר פָּנָיו
  choice: उसने अपना मुँह छिपा लिया है
  rationale: मूल का मानवरूपी बिंब सुरक्षित रखा गया है। यह ध्यान हटा लेने का संकेत देता है, पर अनुवाद उस निहितार्थ को स्पष्ट व्याख्या में नहीं बदलता।
- source_word: בַּל ... לָנֶצַח
  choice: कभी नहीं
  rationale: निषेध और कालवाचक पद मिलकर स्थायी निषेध, अर्थात ‘कभी नहीं’, व्यक्त करते हैं।
- source_word: רָאָה
  choice: देखेगा
  rationale: मूल अर्थ ‘देखना’ है। प्रसंग में ध्यान देने और न्याय करने का निहितार्थ हो सकता है, पर ‘देखेगा’ मूल की अर्थ-व्याप्ति और अस्पष्टता बनाए रखता है।
theological_decisions:
- issue: परमेश्वर के अपना मुँह छिपाने की मानवरूपी भाषा
  choice: ‘उसने अपना मुँह छिपा लिया है’ बिंब को मुख्य पाठ में बनाए रखना
  alternative: ‘उसने ध्यान हटा लिया है’ या ‘वह मुँह फेर चुका है’
  rationale: हिब्रू की ठोस मानवरूपी अभिव्यक्ति परमेश्वर के कथित रूप से ध्यान न देने की दुष्ट की धारणा प्रस्तुत करती है। बिंब बनाए रखने से पाठ की धर्मवैचारिक बनावट सुरक्षित रहती है और अर्थ को अनावश्यक रूप से सीमित नहीं किया जाता।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और सहज शैली। ‘अपने मन में’ और ‘अपना मुँह छिपा लिया’ जैसे बाइबलीय बिंब स्वाभाविक हिन्दी में सुरक्षित रखे गए हैं।
