source:
  edition: WLC
  text: רָאִ֡תָה כִּֽי אַתָּ֤ה עָ֘מָ֤ל וָ/כַ֨עַס תַּבִּיט֮ לָ/תֵ֪ת בְּ/יָ֫דֶ֥/ךָ עָ֭לֶי/ךָ יַעֲזֹ֣ב חֵלֶ֑כָה יָ֝ת֗וֹם אַתָּ֤ה הָיִ֬יתָ עוֹזֵֽר־׀׀׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/010/014.yaml
  text: You have seen[a], for you look upon trouble and grief, to take it into your hand. The helpless commits himself to you[c][b]; you have been the helper of the fatherless.
translation:
  language: hi
  text: तूने देखा है, क्योंकि तू कष्ट और संताप को ध्यान से देखता है, ताकि तू उन्हें अपने हाथ में ले।[a] असहाय अपने आपको तेरे भरोसे छोड़ देता है।[b] अनाथ[c] का सहायक तू रहा है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या: “उन्हें तेरे हाथ में देने के लिए।” हिब्रू मुहावरे का अर्थ यह भी हो सकता है कि परमेश्वर उस मामले को कार्रवाई के लिए अपने हाथ में लेता है।'
    reason: lexical_alternative
  - marker: b
    text: 'या: “असहाय अपना मामला तुझ पर छोड़ देता है।” हिब्रू में असहाय व्यक्ति स्वयं या उसका मामला—दोनों में से कोई परमेश्वर को सौंपा गया हो सकता है।'
    reason: alternative_reading
  - marker: c
    text: 'शाब्दिक रूप से: “पितृहीन।”'
    reason: lexical_alternative
lexical_decisions:
- source_word: רָאִתָה
  choice: तूने देखा है
  rationale: यह ראה का काल रूप है, जिसमें परमेश्वर को सीधे संबोधित किया गया है। हिन्दी का पूर्ण वर्तमान रूप बीती हुई और अब भी प्रासंगिक परमेश्वर की दृष्टि को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: עָמָל
  choice: कष्ट
  rationale: भजन के विलाप-संदर्भ में यह केवल परिश्रम नहीं, बल्कि पीड़ादायक संकट या उत्पीड़न से उत्पन्न कष्ट को दर्शाता है।
- source_word: כַעַס
  choice: संताप
  rationale: यह शब्द खीज, वेदना या दुःख पहुँचाने वाली बात का अर्थ दे सकता है। עָמָל के साथ 'संताप' पीड़ित की व्यथा को व्यक्त करता है और इसे परमेश्वर के क्रोध के रूप में अनावश्यक रूप से नहीं समझाता।
- source_word: תַּבִּיט
  choice: ध्यान से देखता है
  rationale: נבט का यह रूप केवल देखने के बजाय गौर से देखने या ध्यान देने का भाव रखता है; आधुनिक हिन्दी में यह अर्थ स्पष्ट और सहज है।
- source_word: לָתֵת בְּיָדֶךָ
  choice: उन्हें अपने हाथ में ले
  rationale: शाब्दिक रूप से वाक्यांश 'अपने हाथ में देने' की ओर संकेत करता है, पर संदर्भ में परमेश्वर द्वारा मामले को अपने हाथ में लेकर कार्रवाई करने का भाव संभव है। मुख्य पाठ हिन्दी के स्वाभाविक मुहावरे में यह सक्रियता रखता है और पादटिप्पणी शाब्दिक विकल्प सुरक्षित रखती है।
- source_word: עָלֶיךָ יַעֲזֹב
  choice: अपने आपको तेरे भरोसे छोड़ देता है
  rationale: עזב के साथ עַל यहाँ असहाय व्यक्ति के परमेश्वर पर निर्भर होकर अपने आपको या अपना मामला उसे सौंपने का भाव देता है। 'तेरे भरोसे' नकारात्मक परित्याग के भ्रम से बचाता है।
- source_word: חֵלֶכָה
  choice: असहाय
  rationale: यह दुर्बल, अभागे या संकटग्रस्त व्यक्ति की ओर संकेत करता है। समानांतर 'अनाथ' के साथ 'असहाय' निर्भरता और असुरक्षा को स्पष्ट करता है।
- source_word: יָתוֹם
  choice: अनाथ
  rationale: यह पिता से वंचित बच्चे के लिए प्रयुक्त सामाजिक श्रेणी है। आधुनिक हिन्दी में 'अनाथ' सबसे स्वाभाविक है; अधिक शाब्दिक 'पितृहीन' पादटिप्पणी में दिया गया है।
- source_word: עוֹזֵר
  choice: सहायक
  rationale: कर्तृवाचक कृदंत यहाँ परमेश्वर के स्थायी चरित्र और भूमिका को व्यक्त करता है; 'सहायक' संक्षिप्त, व्यक्तिगत और गरिमापूर्ण है।
theological_decisions:
- issue: क्या यह पद केवल परमेश्वर के देखने की बात करता है या देखने के फलस्वरूप हस्तक्षेप की भी
  choice: परमेश्वर कष्ट और संताप को देखता है और मामले को अपने हाथ में लेता है
  alternative: परमेश्वर कष्ट और संताप को देखता है ताकि उन्हें अपने हाथ में रखे या उसके हाथ में दिया जाए
  rationale: לָתֵת בְּיָדֶךָ संदर्भ में निष्क्रिय जानकारी से आगे बढ़कर मामले को कार्रवाई के लिए हाथ में लेने का संकेत दे सकता है। अनुवाद हस्तक्षेप का भाव रखता है, पर न्याय की विधि को नहीं जोड़ता।
- issue: असहाय व्यक्ति परमेश्वर को क्या सौंपता है
  choice: असहाय अपने आपको परमेश्वर के भरोसे छोड़ता है
  alternative: असहाय अपना मामला परमेश्वर पर छोड़ता है
  rationale: हिब्रू में कर्म स्पष्ट नहीं है, इसलिए व्यक्ति और उसके मामले—दोनों अर्थ संभव हैं। मुख्य पाठ व्यक्तिगत निर्भरता को चुनता है और पादटिप्पणी दूसरे अर्थ को सुरक्षित रखती है।
translation_notes:
  register: परमेश्वर के लिए एकवचन आत्मीय संबोधन 'तू/तेरा' रखा गया है, जो हिन्दी भजन-शैली में सीधा और गरिमापूर्ण है। शब्दावली आधुनिक और सामान्य रखी गई है; अत्यधिक संस्कृतनिष्ठ रूपों से बचते हुए काव्यात्मक गंभीरता बनाए रखी गई है।
