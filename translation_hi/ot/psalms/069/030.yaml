  yaml_path: translation/ot/psalms/069/030.yaml
  text: I will praise the name of God with song[a], and I will magnify him with thanksgiving.
translation:
  language: hi
  text: मैं गीत के साथ परमेश्वर के नाम की स्तुति करूँगा, और धन्यवाद के साथ[a] उसकी महिमा करूँगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “धन्यवाद-बलि के साथ”; इब्रानी शब्द תּוֹדָה का अर्थ संदर्भ के अनुसार धन्यवाद या धन्यवाद-बलि हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲהַלְלָה
  choice: मैं ... स्तुति करूँगा
  rationale: प्रथम पुरुष एकवचन कोहोर्टेटिव यहाँ संकल्प व्यक्त करता है; आधुनिक हिन्दी में भविष्यकाल इस भाव को स्वाभाविक रूप से व्यक्त करता है।
- source_word: שֵׁם אֱלֹהִים
  choice: परमेश्वर के नाम
  rationale: इब्रानी समास की संरचना और उसके श्रद्धापूर्ण आशय को स्पष्ट तथा स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: בְּשִׁיר
  choice: गीत गाकर
  rationale: בְ यहाँ साधन या रीति बताता है। शाब्दिक ‘गीत के साथ’ की अपेक्षा ‘गीत गाकर’ आधुनिक हिन्दी में अधिक स्वाभाविक है और आशय को सुरक्षित रखता है।
- source_word: וַאֲגַדְּלֶנּוּ
  choice: उसकी महिमा का बखान करूँगा
  rationale: גדל का पिएल रूप यहाँ परमेश्वर को बड़ा बनाना नहीं, बल्कि उसकी महानता को स्वीकार करके उसका गुणगान करना दर्शाता है। यह चयन हिन्दी में उस भाव को स्पष्ट रखता है और ‘स्तुति’ के साथ काव्यात्मक समानांतरता बनाए रखता है।
- source_word: בְתוֹדָה
  choice: धन्यवाद देते हुए
  rationale: संदर्भ में स्तुति और गीत के समानांतर मौखिक धन्यवाद सबसे संभावित अर्थ है। फिर भी शब्द धन्यवाद-बलि को भी सूचित कर सकता है, इसलिए उस विकल्प को पादटिप्पणी में रखा गया है।
theological_decisions:
- issue: क्या תּוֹדָה का अर्थ मौखिक धन्यवाद है या धन्यवाद-बलि?
  choice: मौखिक धन्यवाद
  alternative: धन्यवाद-बलि
  rationale: निकटवर्ती समानांतर पदों में स्तुति, गीत और महिमा का बखान है, इसलिए धन्यवाद की मौखिक या गेय अभिव्यक्ति संदर्भ में बेहतर बैठती है; बलिदान-संबंधी अर्थ शब्द की वास्तविक लेकिन कम संभावित संभावना है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘गीत गाकर’ और ‘महिमा का बखान’ शाब्दिक संरचना की कठोरता से बचते हुए इब्रानी काव्य की समानांतरता तथा आराधनात्मक स्वर बनाए रखते हैं।
