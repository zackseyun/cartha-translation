translation:
  language: hi
  text: 'मैंने टाट को अपना वस्त्र बनाया,

    और मैं उनके लिए उपहास की मिसाल बन गया।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וָאֶתְּנָה
  choice: मैंने … बनाया
  rationale: यहाँ נתן का अर्थ किसी वस्तु को किसी भूमिका में रखना या बनाना है; टाट को अपने वस्त्र के रूप में अपनाने का भाव है।
- source_word: לְבוּשִׁי
  choice: अपना वस्त्र
  rationale: यह पद भजनकार के पहने हुए वस्त्र को दर्शाता है। ‘अपना वस्त्र’ स्वाभाविक, गरिमापूर्ण और मूल के संबंधसूचक भाव के अनुरूप है।
- source_word: שָׂק
  choice: टाट
  rationale: टाट मोटे कपड़े और शोक अथवा दीनता के वस्त्र का प्रचलित बाइबलीय संकेत है।
- source_word: וָאֱהִי
  choice: मैं … बन गया
  rationale: 'क्रिया यहाँ परिणामी अवस्था व्यक्त करती है: भजनकार लोगों के उपहास में प्रयुक्त उदाहरण या कथन बन गया।'
- source_word: לָהֶם
  choice: उनके लिए
  rationale: मूल का संबंधपरक अर्थ सीधे और स्वाभाविक ढंग से सुरक्षित रहता है।
- source_word: לְמָשָׁל
  choice: उपहास की कहावत
  rationale: מָשָׁל का अर्थ कहावत, प्रचलित उक्ति या मिसाल हो सकता है। इस विलाप के संदर्भ में उसका नकारात्मक, उपहासपूर्ण प्रयोग प्रधान है; ‘उपहास की कहावत’ कथन और तिरस्कार दोनों भावों को रखता है।
