  yaml_path: translation/ot/psalms/069/024.yaml
  text: Pour out your indignation on them[b][a], and let your burning anger overtake them.
translation:
  language: hi
  text: अपना रोष उन पर उंडेल दे, और तेरे क्रोध की ज्वाला उन्हें जा पकड़े।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שְׁפָךְ
  choice: उंडेल दे
  rationale: यह आज्ञार्थक क्रिया क्रोध को द्रव की तरह उंडेलने का सजीव रूपक रखती है और आधुनिक हिन्दी में स्वाभाविक है।
- source_word: עֲלֵיהֶם
  choice: उन पर
  rationale: पूर्वसर्ग עַל और बहुवचन प्रत्यय का सीधा तथा स्वाभाविक हिन्दी समतुल्य।
- source_word: זַעְמֶךָ
  choice: अपना रोष
  rationale: זַעַם तीव्र और न्याय-संबंधी अप्रसन्नता या रोष व्यक्त करता है; ‘रोष’ अगले पदबंध के ‘क्रोध’ से शब्दगत भेद भी बनाए रखता है।
- source_word: וַחֲרוֹן אַפְּךָ
  choice: और तेरे क्रोध की ज्वाला
  rationale: हिब्रू पदबंध का शाब्दिक बिंब ‘नाक का जलना’ है और अर्थ प्रचंड क्रोध है; ‘क्रोध की ज्वाला’ ताप और तीव्रता के रूपक को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: יַשִּׂיגֵם
  choice: उन्हें आ घेरे
  rationale: हिफ़ील क्रिया का अर्थ पहुँच जाना, जा पकड़ना या आ घेरना हो सकता है। ‘आ घेरे’ पीछा करते न्याय के लक्ष्य तक पहुँचने और उसे अपनी चपेट में लेने का भाव देता है।
theological_decisions:
- issue: शत्रुओं के विरुद्ध दैवी न्याय की सीधी प्रार्थना
  choice: दैवी रोष उंडेलने और क्रोध द्वारा उन्हें आ घेरने की याचना को बिना नरम किए रखा गया।
  alternative: इसे ‘उन पर अपनी अप्रसन्नता प्रकट कर’ जैसे हल्के कथन में बदलना।
  rationale: मूल हिब्रू दैवी न्याय की स्पष्ट और तीव्र याचना करता है। अनुवाद इस धर्मवैचारिक तनाव को शांत या पुनर्व्याख्यायित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए स्पष्ट रखी गई है। ‘उंडेल दे’ मूल रूपक को तथा ‘क्रोध की ज्वाला’ हिब्रू ताप-संबंधी मुहावरे को सुरक्षित रखते हैं।
