  text: עֲנֵ֣/נִי יְ֭הוָה כִּי ט֣וֹב חַסְדֶּ֑/ךָ כְּ/רֹ֥ב רַ֝חֲמֶ֗י/ךָ פְּנֵ֣ה אֵלָֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/069/016.yaml
  text: Answer me[a], O Yahweh, for your steadfast love is good; according to your abundant mercies, turn to me.
translation:
  language: hi
  text: हे याहवे, मुझे उत्तर दे, क्योंकि तेरा अटल प्रेम अच्छा है; अपनी अपार करुणा के अनुसार मेरी ओर मुड़।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עֲנֵנִי
  choice: मुझे उत्तर दे
  rationale: प्रार्थना के संदर्भ में ענה का आज्ञार्थक रूप परमेश्वर से प्रत्युत्तर की विनती करता है; यह स्वाभाविक और अर्थनिष्ठ हिन्दी है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: मूल पाठ में आए परमेश्वर के व्यक्तिगत नाम को हिन्दी में प्रचलित लिप्यंतरण ‘यहोवा’ से व्यक्त किया गया है, किसी उपाधि से नहीं बदला गया।
- source_word: כִּי טוֹב חַסְדֶּךָ
  choice: क्योंकि तेरा अटल प्रेम भला है
  rationale: כִּי विनती का आधार बताता है; טוֹב का सीधा अर्थ ‘भला’ और חֶסֶד का अर्थ निष्ठावान, स्थायी प्रेम है।
- source_word: כְּרֹב רַחֲמֶיךָ
  choice: अपनी अपार करुणा के अनुसार
  rationale: כְּרֹב मात्रा अथवा मानक को दर्शाता है। רַחֲמִים का बहुवचन रूप हिन्दी में स्वाभाविक सामूहिक भाव ‘करुणा’ से व्यक्त हुआ है; ‘अपार’ उसकी प्रचुरता बनाए रखता है।
- source_word: פְּנֵה אֵלָי
  choice: मेरी ओर फिर
  rationale: פנה के आज्ञार्थक रूप और אֶל का संबंध किसी व्यक्ति की ओर मुड़ने का भाव देता है; संक्षिप्त काव्यात्मक हिन्दी में ‘मेरी ओर फिर’ इसे सुरक्षित रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: हिब्रू व्यंजन-समूह YHWH के उच्चारण का विद्वानों में प्रचलित पुनर्निर्माण ‘याहवे’ है, जबकि आधुनिक हिन्दी बाइबलीय प्रयोग में ‘यहोवा’ अधिक परिचित है। पाठ में नाम को उपाधि ‘प्रभु’ से प्रतिस्थापित नहीं किया गया।
- issue: חֶסֶד का अर्थ-क्षेत्र
  choice: अटल प्रेम
  alternative: करुणामय निष्ठा / वाचा का प्रेम
  rationale: ‘अटल प्रेम’ स्नेह और स्थायी निष्ठा दोनों को संक्षेप में रखता है, पर मूल में ‘वाचा’ शब्द न होने के कारण उसे स्पष्ट रूप से नहीं जोड़ा गया।
translation_notes:
  register: भाषा आधुनिक, प्रार्थनामय और गरिमापूर्ण रखी गई है। एकवचन निकट संबोधन के अनुरूप ‘तेरा/मेरी ओर’ प्रयोग हुआ है। पद की समानांतर काव्य-रचना और कारणात्मक प्रवाह सुरक्षित हैं।
