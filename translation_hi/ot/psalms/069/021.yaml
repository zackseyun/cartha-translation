  text: They gave me poison for my food[c][b][a], and for my thirst they gave me vinegar to drink.
translation:
  language: hi
  text: उन्होंने मेरे भोजन में[a] विष[b] दिया, और मेरी प्यास बुझाने के लिए मुझे सिरका[c] पिलाया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘मेरे भोजन के लिए।’ इब्रानी पदबंध का अर्थ भोजन में कुछ देना अथवा भोजन के रूप में कुछ देना हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या, ‘पित्त।’ यहाँ का इब्रानी शब्द किसी विषैले या कड़वे पदार्थ को सूचित करता है; ‘पित्त’ इसका पारंपरिक अनुवाद है।
    reason: lexical_alternative
  - marker: c
    text: या, ‘खट्टी दाखमधु।’ इब्रानी शब्द सिरके अथवा खट्टी हो चुकी दाखमधु को सूचित कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְּנוּ
  choice: उन्होंने ... दिया
  rationale: נתן का सामान्य अर्थ ‘देना’ है; यहाँ भूतकालीन कथन के रूप में इसे स्वाभाविक हिन्दी में रखा गया है।
- source_word: בְּבָרוּתִי
  choice: मेरे भोजन में
  rationale: בָּרוּת का अर्थ भोजन या पोषण है और उपसर्ग ב का सीधा अर्थ यहाँ ‘में’ हो सकता है। इससे भोजन में विष दिए जाने का बिंब बना रहता है; ‘मेरे भोजन के लिए’ भी सम्भव है और पादटिप्पणी में दिया गया है।
- source_word: רֹאשׁ
  choice: विष
  rationale: इस काव्यात्मक प्रयोग में רֹאשׁ किसी विषैले या अत्यन्त कड़वे पदार्थ को सूचित करता है। ‘विष’ आधुनिक हिन्दी में अर्थ को स्पष्ट रखता है; पारम्परिक विकल्प ‘पित्त’ पादटिप्पणी में सुरक्षित है।
- source_word: וְלִצְמָאִי
  choice: और मेरी प्यास में
  rationale: לִצְמָאִי का निकट अर्थ ‘मेरी प्यास के लिए/मेरी प्यास में’ है। ‘मेरी प्यास में’ संक्षिप्त, काव्यात्मक और पहले खंड के समानान्तर है।
- source_word: יַשְׁקוּנִי
  choice: मुझे ... पिलाया
  rationale: שׁקה के हिफ़ील रूप का अर्थ ‘किसी को पिलाना’ है; हिन्दी में ‘मुझे ... पिलाया’ इसका सीधा और स्वाभाविक रूप है।
- source_word: חֹמֶץ
  choice: सिरका
  rationale: חֹמֶץ सिरके अथवा खट्टी हो चुकी दाखमधु को सूचित कर सकता है। मुख्य पाठ में व्यापक और पारम्परिक ‘सिरका’ रखा गया है तथा ‘खट्टी दाखमधु’ पादटिप्पणी में दी गई है।
theological_decisions:
- issue: सुसमाचारों के दुःखभोग-वर्णनों से अन्तर्पाठीय सम्बन्ध
  choice: मुख्य पाठ का अनुवाद भजन के इब्रानी शब्दों के अपने अर्थ के अनुसार किया गया है।
  alternative: रֹאשׁ के लिए पारम्परिक ‘पित्त’ और חֹמֶץ के लिए ‘खट्टी दाखमधु’ लेकर नए नियम के शब्दांकन से अधिक प्रत्यक्ष साम्य दिखाना।
  rationale: मूल इब्रानी को प्राथमिकता देते हुए बाद के अन्तर्पाठीय सम्बन्ध को मुख्य पाठ पर आरोपित नहीं किया गया; अर्थपूर्ण पारम्परिक विकल्प पादटिप्पणियों में रखे गए हैं।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण काव्यात्मक वाक्य रखा गया है। दोनों खंडों में ‘मेरे भोजन में’ और ‘मेरी प्यास में’ की समानान्तरता बनाए रखी गई है; कठिन इब्रानी शब्दों की वास्तविक अर्थ-सीमा पादटिप्पणियों में स्पष्ट की गई है।
