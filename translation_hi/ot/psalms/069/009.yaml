base_translation:
  language: en
  yaml_path: translation/ot/psalms/069/009.yaml
  text: For zeal for your house has consumed me[b][a], and the reproaches of those who reproach you have fallen on me.
translation:
  language: hi
  text: क्योंकि तेरे घर के लिए उत्साह ने मुझे खा लिया है[a][b], और जो तेरा अपमान करते हैं, उनके अपमान मुझ पर आ पड़े हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मुझे पूरी तरह ग्रसित कर लिया है।” मूल में शाब्दिक रूप से, “मुझे खा लिया है।”
    reason: lexical_alternative
  - marker: b
    text: यह पद यूहन्ना 2:17 में यीशु के सम्बन्ध में उद्धृत किया गया है।
    reason: cross_reference
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पद पिछले संदर्भ में भजनकार की दशा का कारण बताता है; ‘क्योंकि’ इस कारणसूचक बल को स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: קִנְאַת
  choice: जोश
  rationale: यहाँ शब्द ईर्ष्या नहीं, बल्कि परमेश्वर के भवन के प्रति प्रबल उत्साह और समर्पण बताता है। ‘जोश’ आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: בֵּיתְךָ
  choice: तेरे भवन
  rationale: हिब्रू का शाब्दिक अर्थ ‘तेरा घर’ है और प्रसंग में पवित्रस्थान अभिप्रेत है। ‘भवन’ धार्मिक संदर्भ में स्वाभाविक रहते हुए ‘मन्दिर’ कहकर अर्थ को अनावश्यक रूप से सीमित नहीं करता।
- source_word: אֲכָלָתְנִי
  choice: मुझे खा लिया है
  rationale: मूल क्रिया का ठोस रूपक ‘खा जाना’ है। इसे बनाए रखने से पंक्ति की तीव्रता और काव्यात्मकता सुरक्षित रहती है; इसका भाव पूरी तरह ग्रसित कर लेना है।
- source_word: וְחֶרְפּוֹת
  choice: और ... निन्दाएँ
  rationale: बहुवचन संज्ञा अपमान और तिरस्कारपूर्ण वचनों को दर्शाती है। ‘निन्दाएँ’ अगले समान-मूल कृदन्त के साथ शब्दगत संबंध बनाए रखती है।
- source_word: חֹרְפֶיךָ
  choice: तेरी निन्दा करनेवालों
  rationale: यह कृदन्त उन लोगों को बताता है जो परमेश्वर की निन्दा करते हैं। यह हिन्दी अभिव्यक्ति संज्ञा ‘निन्दाएँ’ के साथ मूल की शब्द-पुनरावृत्ति सुरक्षित रखती है।
- source_word: נָפְלוּ עָלַי
  choice: मुझ पर आ पड़ी हैं
  rationale: यह हिब्रू मुहावरे का स्वाभाविक हिन्दी रूप है और बताता है कि परमेश्वर पर लक्षित अपमान भजनकार पर आ पड़ा।
theological_decisions:
- issue: पद का मसीही/कैनोनिक अनुनाद
  choice: मुख्य पाठ को भजनकार की तत्काल वाणी के रूप में अनूदित किया गया है; यूहन्ना 2:17 में यीशु पर इसके प्रयोग को पादटिप्पणी में रखा गया है।
  alternative: नए नियम के उद्धरण के आधार पर मुख्य पाठ में स्पष्ट मसीही व्याख्या जोड़ना।
  rationale: हिब्रू पाठ स्वयं भजनकार की वाणी में है। बाद का मसीही प्रयोग महत्वपूर्ण है, पर उसे मुख्य पाठ में मिलाने से मूल पद के तत्काल अर्थ और उसकी व्याख्यात्मक खुलावट सीमित हो जाएगी।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और काव्यात्मक हिन्दी। परमेश्वर को संबोधन में ‘तेरे’ रखा गया है ताकि भजन की सीधी और निकट संबोधन-शैली बनी रहे। ‘खा लिया’ मूल रूपक को सुरक्षित रखता है, जबकि पादटिप्पणी उसका भाव स्पष्ट करती है।
