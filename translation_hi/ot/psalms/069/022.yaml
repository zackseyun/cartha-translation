source:
  edition: WLC
  text: יְהִֽי שֻׁלְחָנָ֣/ם לִ/פְנֵי/הֶ֣ם לְ/פָ֑ח וְ/לִ/שְׁלוֹמִ֥ים לְ/מוֹקֵֽשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/069/022.yaml
  text: May their table before them become a trap[a], and for their well-being a snare.
translation:
  language: hi
  text: 'उनके सामने की मेज़ उनके लिए फंदा बन जाए,

    और उनकी सुख-समृद्धि[a] उनके लिए जाल बन जाए।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या संभवतः, “उनकी शांति-बलियाँ”; इब्रानी शब्द कुशल, सुरक्षा या समृद्धि को भी दर्शा सकता है और बलिदानी भोज की ओर भी संकेत कर सकता है।
    reason: कठिन और बहुअर्थी इब्रानी पद שְׁלוֹמִים की वैकल्पिक बलिदानी अनुगूँज को सुरक्षित रखना।
lexical_decisions:
- source_word: יְהִי
  choice: बन जाए
  rationale: היה का विधिलिंग-सदृश प्रयोग यहाँ शापात्मक कामना व्यक्त करता है; ‘बन जाए’ इस भाव को स्वाभाविक आधुनिक हिन्दी में रखता है।
- source_word: שֻׁלְחָנָם
  choice: उनके सामने की मेज़
  rationale: ‘मेज़’ मूल ठोस बिंब को बनाए रखता है; यह भोजन, दावत या उपलब्ध साधनों का संकेत दे सकता है, पर उस अर्थ को मुख्य पाठ में स्पष्ट करके सीमित नहीं किया गया।
- source_word: לִפְנֵיהֶם
  choice: उनके सामने की
  rationale: स्थान-सूचक अर्थ और यह विडंबना सुरक्षित रहती है कि सामने उपलब्ध वस्तु ही संकट बन जाए।
- source_word: לְפָח
  choice: फंदा
  rationale: פח पकड़ने के फंदे या जाल को दर्शाता है। इसे ‘फंदा’ कहा गया ताकि समानार्थी מוֹקֵשׁ के लिए अलग हिन्दी शब्द रखा जा सके।
- source_word: וְלִשְׁלוֹמִים
  choice: और उनकी सुख-समृद्धि
  rationale: इस कठिन पद में שְׁלוֹמִים को कुशल, सुरक्षा और समृद्धि के व्यापक अर्थ में लिया गया है। प्रसंग में आशय यह है कि जो उनकी भलाई का साधन है, वही विनाशकारी बन जाए; संभावित बलिदानी अनुगूँज पादटिप्पणी में रखी गई है।
- source_word: לְמוֹקֵשׁ
  choice: जाल
  rationale: מוֹקֵשׁ सामान्यतः शिकार पकड़ने के जाल या फंदे के लिए आता है। ‘जाल’ समानांतर पंक्ति में अर्थ-साम्य और शब्द-भिन्नता दोनों रखता है।
theological_decisions:
- issue: शापात्मक प्रार्थना का बल
  choice: कामना के रूप में ‘बन जाए’
  alternative: वर्णनात्मक भविष्यकाल, ‘बन जाएगी’
  rationale: हिब्रू יְהִי न्याय की शापात्मक कामना है, केवल भविष्यवाणी नहीं; इसलिए उसके इच्छार्थक तनाव को सुरक्षित रखा गया।
- issue: שְׁלוֹמִים का अर्थ
  choice: सुख-समृद्धि
  alternative: शांति-बलियाँ
  rationale: इस प्रसंग में अमूर्त अर्थ—कुशल, सुरक्षा या समृद्धि—वाक्य-संबंध और समानांतरता में अधिक स्वाभाविक है। फिर भी שולחן के साथ बलिदानी भोज की अनुगूँज संभव है, इसलिए वैकल्पिक अर्थ पादटिप्पणी में दिया गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और काव्यात्मक रखी गई है। ‘मेज़—फंदा’ और ‘सुख-समृद्धि—जाल’ की दो समानांतर पंक्तियाँ मूल के ठोस बिंब, विडंबना और शापात्मक स्वर को सहज हिन्दी में प्रस्तुत करती हैं।
