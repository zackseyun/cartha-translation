translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और काव्यात्मक शैली रखी गई है। ‘दीन’ मूल शब्द की नैतिक नम्रता और दुःखग्रस्त निम्न दशा—दोनों संभावनाओं को खुला रखता है। बहुवचन ‘हृदय जी उठें’ हिन्दी में समूह-संबोधन के साथ सहज है, जबकि पादटिप्पणी इब्रानी के सामूहिक एकवचन को दर्ज करती है।
