  yaml_path: translation/ot/psalms/069/032.yaml
  text: The humble have seen and rejoice[a]; you who seek God[c][b], let your hearts live.
translation:
  language: hi
  text: दीनों ने देखा और वे आनन्दित होंगे[a]; हे परमेश्वर के खोजियो, तुम्हारे हृदय जी उठें[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘नम्र लोगों ने देखा और वे आनन्दित होंगे’ अथवा ‘पीड़ित लोगों ने देखा और वे आनन्दित होंगे।’
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में शाब्दिक रूप से ‘तुम लोगों का हृदय जीवित हो’; यह नया साहस, जीवनशक्ति या आशा पाने का मुहावरा हो सकता है।
    reason: cultural_note
lexical_decisions:
- source_word: רָאוּ
  choice: देखकर
  rationale: यह ראה का पूर्ण रूप है। हिन्दी में ‘देखकर’ पूर्व घटित देखने और उससे उपजे आनन्द के निकट संबंध को स्वाभाविक रूप से व्यक्त करता है तथा ऐसा कोई कर्म नहीं जोड़ता जो इब्रानी में स्पष्ट नहीं है।
- source_word: עֲנָוִים
  choice: दीन लोग
  rationale: इस शब्द में नम्रता के साथ-साथ दबे-कुचले या दुःख उठानेवाले लोगों की सामाजिक दशा का भाव भी हो सकता है। ‘दीन’ भजन-साहित्य के प्रसंग में दोनों पक्षों को अपेक्षाकृत खुला रखता है।
- source_word: יִשְׂמָחוּ
  choice: आनन्दित हों
  rationale: अपूर्ण क्रिया यहाँ परिणामस्वरूप वर्तमान/भावी आनन्द या इच्छासूचक भाव दे सकती है। ‘आनन्दित हों’ काल को अनावश्यक रूप से निश्चित किए बिना काव्यात्मक और स्वाभाविक है।
- source_word: דֹּרְשֵׁי אֱלֹהִים
  choice: परमेश्वर को खोजनेवालो
  rationale: कृदन्त-रचना को अगले बहुवचन संबोधन के अनुरूप सम्बोधन के रूप में प्रस्तुत किया गया है। ‘खोजना’ यहाँ परमेश्वर की ओर मुड़ने और उसे पाने की अभिलाषा का सामान्य बाइबलीय भाव रखता है।
- source_word: וִיחִי לְבַבְכֶם
  choice: तुम्हारे हृदय जी उठें
  rationale: इब्रानी मुहावरे के ‘जीने’ के चित्र को बनाए रखते हुए हिन्दी में बहुवचन संबोधन के साथ स्वाभाविक रूप दिया गया है। इसका आशय साहस, जीवनशक्ति या आशा के नया होने से हो सकता है।
