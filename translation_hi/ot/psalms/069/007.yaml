source:
  edition: WLC
  text: כִּֽי עָ֭לֶי/ךָ נָשָׂ֣אתִי חֶרְפָּ֑ה כִּסְּתָ֖ה כְלִמָּ֣ה פָנָֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/069/007.yaml
  text: For because of you I have borne reproach[b][a]; disgrace has covered my face.
translation:
  language: hi
  text: क्योंकि तेरे कारण मैंने निन्दा सही है; लज्जा ने मेरे चेहरे को ढक लिया है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यहाँ כִּי पिछले संदर्भ का कारण बताता है। हिन्दी में ‘क्योंकि’ कारणसूचक अर्थ को स्वाभाविक रूप से व्यक्त करता है; अंग्रेज़ी के ‘For because’ जैसे दोहरे संयोजक की आवश्यकता नहीं है।
- source_word: עָלֶיךָ
  choice: तेरे ही कारण
  rationale: यहाँ עַל स्थान नहीं, कारण अथवा संबंध प्रकट करता है। ‘तेरे ही कारण’ इस अर्थ को स्पष्ट रखता है और ‘तेरे लिए’ से उत्पन्न हो सकने वाले हितार्थक भाव से बचता है। ‘ही’ इस बात को उभारता है कि निन्दा परमेश्वर से संबंध के कारण उठानी पड़ी।
- source_word: נָשָׂאתִי
  choice: मैंने ... सही है
  rationale: נשא का मूल बिंब ‘उठाना/ढोना’ है, पर חֶרְפָּה के साथ आधुनिक हिन्दी में ‘निन्दा सहना’ अधिक स्वाभाविक है और भार उठाने की अनुभूति भी पर्याप्त रूप से बनाए रखता है।
- source_word: חֶרְפָּה
  choice: निन्दा
  rationale: חֶרְפָּה में तिरस्कार, अपमान और सार्वजनिक भर्त्सना का भाव है। ‘निन्दा’ काव्यात्मक और सामान्य हिन्दी दोनों में समझने योग्य है तथा अगले खंड के כְלִמָּה से शब्दगत भेद रखता है।
- source_word: כִּסְּתָה
  choice: ने ... ढक लिया है
  rationale: כסה के ठोस ‘ढकना’ रूपक को सुरक्षित रखा गया है। स्त्रीलिंग क्रिया का कर्ता अगला शब्द כְלִמָּה है।
- source_word: כְלִמָּה
  choice: अपमान
  rationale: כְלִמָּה लज्जा, निरादर या अपमान को व्यक्त करता है। ‘अपमान’ सार्वजनिक अनादर का भाव रखता है और ‘निन्दा’ की अनावश्यक पुनरावृत्ति से बचता है।
- source_word: פָנַי
  choice: मेरे मुख
  rationale: यहाँ פנים का प्रत्यक्ष अर्थ ‘मुख/चेहरा’ है और लज्जा से मुख ढक जाने का दृश्य बिंब अभिप्रेत है। ‘मुख’ भजन की गरिमामय काव्य-शैली के अनुकूल है।
