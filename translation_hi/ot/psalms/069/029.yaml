reference: Psalms 69:29
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ֭/אֲנִי עָנִ֣י וְ/כוֹאֵ֑ב יְשׁוּעָתְ/ךָ֖ אֱלֹהִ֣ים תְּשַׂגְּבֵֽ/נִי׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/069/029.yaml
  text: But as for me[a], I am afflicted and in pain; O God[c][b], let your salvation set me on high.
translation:
  language: hi
  text: पर मैं तो दीन और पीड़ा में हूँ; हे परमेश्वर, तेरा उद्धार मुझे ऊँचे सुरक्षित स्थान पर रखे।[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “हे परमेश्वर, तेरा उद्धार मुझे ऊँचे सुरक्षित स्थान पर रखेगा।” इब्रानी क्रियारूप को प्रार्थनापूर्ण इच्छा के बजाय भविष्य के कथन के रूप में भी समझा जा सकता है।
    reason: alternative_reading
  - marker: b
    text: “ऊँचे सुरक्षित स्थान पर रखे” के लिए प्रयुक्त इब्रानी क्रिया का भाव किसी को पहुँच से परे ऊँचाई पर रखकर उसकी रक्षा करना है; इसलिए अर्थ “मुझे सुरक्षित रखे” भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי
  choice: पर मैं तो
  rationale: संयोजक और सर्वनाम पिछले कथन के साथ विरोध तथा ‘मैं’ पर बल दिखाते हैं; ‘पर मैं तो’ इसे स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: עָנִי
  choice: दीन
  rationale: यह शब्द गरीब, दबा हुआ या दुःख से झुका हुआ व्यक्ति बता सकता है। ‘दीन’ आर्थिक गरीबी तक अर्थ को सीमित किए बिना उसकी असहाय दशा व्यक्त करता है।
- source_word: וְכוֹאֵב
  choice: और पीड़ा में हूँ
  rationale: כאֵב का कृदन्त वर्तमान और बनी हुई पीड़ा की दशा बताता है; यह हिन्दी प्रयोग उसी अवस्था को स्पष्ट रखता है।
- source_word: יְשׁוּעָתְךָ
  choice: तेरा उद्धार
  rationale: יְשׁוּעָה बचाव, छुटकारे और सहायता के व्यापक भाव को धारण करता है; ‘उद्धार’ इस व्यापकता को बनाए रखता है।
- source_word: אֱלֹהִים
  choice: हे परमेश्वर
  rationale: यहाँ शब्द प्रत्यक्ष सम्बोधन है; ‘हे परमेश्वर’ प्रार्थनापूर्ण पुकार को स्वाभाविक और गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: תְּשַׂגְּבֵנִי
  choice: मुझे ऊँचे सुरक्षित स्थान पर रखे
  rationale: שׂגב के पिएल रूप में किसी को पहुँच से परे ऊँचाई पर रखकर सुरक्षित करने का चित्र है। यह अनुवाद उस स्थानिक रूपक और उससे जुड़े संरक्षण—दोनों को बनाए रखता है।
theological_decisions:
- issue: תְּשַׂגְּבֵנִי के अपूर्ण क्रियारूप का बल
  choice: 'प्रार्थनापूर्ण इच्छा: ‘मुझे ... रखे’'
  alternative: 'भविष्य का कथन: ‘मुझे ... रखेगा’'
  rationale: विलाप और विनती के प्रसंग में यह रूप स्वाभाविक रूप से इच्छा या प्रार्थना व्यक्त कर सकता है, पर साधारण भविष्य भी व्याकरणतः सम्भव है। मुख्य पाठ में विनती रखी गई है और दूसरी सम्भावना पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, प्रार्थनापूर्ण और काव्यात्मक शैली रखी गई है। ‘दीन’ और ‘उद्धार’ गरिमापूर्ण किन्तु सामान्यतः समझ में आने वाले शब्द हैं। मूल का ऊँचाई-सुरक्षा रूपक स्पष्ट करने के लिए ‘ऊँचे सुरक्षित स्थान’ कहा गया है।
