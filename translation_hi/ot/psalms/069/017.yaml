lexical_decisions:
- source_word: וְ/אַל
  choice: और ... न
  rationale: וְ इस विनती को आसपास की प्रार्थनाओं से जोड़ता है, और אַל अपूर्ण क्रिया के साथ निषेधात्मक विनती व्यक्त करता है।
- source_word: תַּסְתֵּר
  choice: छिपा
  rationale: סתר का मूल अर्थ ‘छिपाना’ है; ‘मुख’ के साथ मूल रूपक को स्वाभाविक हिंदी में बनाए रखता है।
- source_word: פָּנֶיךָ
  choice: अपना मुख
  rationale: इब्रानी ‘तेरा मुख’ को बनाए रखा गया है, क्योंकि यह कृपा, ध्यान और निकट उपस्थिति का काव्यात्मक बिंब है।
- source_word: מֵעַבְדֶּךָ
  choice: अपने दास से
  rationale: עבד दास या सेवक का अर्थ दे सकता है। परमेश्वर से प्रार्थना के इस संदर्भ में ‘दास’ विनम्र अधीनता और अपनेपन, दोनों को संक्षेप में व्यक्त करता है।
- source_word: כִּי צַר לִי
  choice: क्योंकि मैं संकट में हूँ
  rationale: यह संक्षिप्त इब्रानी वाक्य प्रार्थी की व्याकुल और संकटग्रस्त अवस्था बताता है; यह हिंदी रूप कारण-संबंध को स्पष्ट और स्वाभाविक रखता है।
- source_word: מַהֵר
  choice: शीघ्र
  rationale: यह शीघ्रता की आग्रहपूर्ण पुकार है; ‘शीघ्र’ काव्यात्मक गरिमा और तात्कालिकता बनाए रखता है।
- source_word: עֲנֵנִי
  choice: मुझे उत्तर दे
  rationale: प्रार्थना के संदर्भ में ענה का सामान्य अर्थ ‘उत्तर देना’ है।
theological_decisions:
- issue: परमेश्वर के ‘मुख’ का मानवरूपी चित्रण
  choice: मुख को मुख्य पाठ में बनाए रखना
  alternative: उपस्थिति अथवा कृपादृष्टि
  rationale: मूल बिंब परमेश्वर की कृपा, ध्यान और संबंधपरक निकटता को एक साथ व्यक्त करता है; व्याख्यात्मक पर्याय चुनने से इसकी काव्यात्मक और धर्मवैचारिक व्यापकता घटती।
- issue: परमेश्वर के संबंध में עבד का अनुवाद
  choice: दास
  alternative: सेवक
  rationale: ‘दास’ विनम्र अधीनता और परमेश्वर से संबंधित होने की भावना को दृढ़ता से व्यक्त करता है, जबकि यहाँ कानूनी दासता पर विशेष बल नहीं दिया गया है; विकल्प को पादटिप्पणी में रखा गया है।
