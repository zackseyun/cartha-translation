  yaml_path: translation/ot/psalms/069/027.yaml
  text: Add iniquity to their iniquity[b][a], and do not let them come into your righteousness.
translation:
  language: hi
  text: उनके अधर्म पर अधर्म जोड़ दे[a], और उन्हें तेरी धार्मिकता में प्रवेश न करने दे[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '“अधर्म” के लिए प्रयुक्त इब्रानी शब्द का अर्थ दोष या दोष का दंड भी हो सकता है। इसलिए अर्थ यह भी हो सकता है: “उनके दोष पर दोष जोड़ दे।”'
    reason: lexical_alternative
  - marker: b
    text: या, “उन्हें तेरे न्याय में प्रवेश न करने दे।” यहाँ परमेश्वर की धार्मिकता उसके न्यायपूर्ण या न्याय स्थापित करने वाले कार्य की ओर भी संकेत कर सकती है।
    reason: alternative_reading
lexical_decisions:
- source_word: תְּנָה
  choice: बढ़ा दे
  rationale: נתן का यह आज्ञार्थक रूप परमेश्वर को संबोधित है। עָוֺן עַל עֲוֺנָם के साथ इसका भाव एक अधर्म पर दूसरा अधर्म जोड़ने का है; हिन्दी में “बढ़ा दे” संचयी अर्थ को स्वाभाविक रूप से व्यक्त करता है।
- source_word: עָוֺן / עֲוֺנָם
  choice: अधर्म / उनके अधर्म
  rationale: עָוֺן में अधर्म, दोष और दोष का परिणाम—तीनों अर्थ संभव हैं। मुख्य पाठ में “अधर्म” मूल के नैतिक अर्थ तथा दोनों प्रयोगों की पुनरावृत्ति को बनाए रखता है।
- source_word: עַל
  choice: पर
  rationale: मूल पूर्वसर्ग का सामान्य अर्थ “पर” है और “अधर्म पर अधर्म” हिब्रू संरचना तथा संचयी बल दोनों को सुरक्षित रखता है।
- source_word: וְאַל יָבֹאוּ
  choice: और उन्हें ... प्रवेश न करने दे
  rationale: אַל के साथ अपूर्ण क्रिया निषेधात्मक इच्छा या विनती व्यक्त करती है। हिन्दी में यह रचना परमेश्वर से की गई प्रार्थनात्मक मनाही को स्पष्ट करती है।
- source_word: בְּצִדְקָתֶךָ
  choice: अपनी धार्मिकता में
  rationale: צְדָקָה धार्मिकता, न्याय और परमेश्वर के न्यायपूर्ण अथवा निर्दोष ठहराने वाले कार्य का संकेत दे सकती है। “धार्मिकता” व्यापकता बनाए रखती है; “न्याय” को पादटिप्पणी में दिया गया है।
theological_decisions:
- issue: शाप-विनती के संदर्भ में “तेरी धार्मिकता” का अर्थ
  choice: अपनी धार्मिकता में
  alternative: अपने न्याय में
  rationale: मूल शब्द यह निश्चित नहीं करता कि आशय केवल न्याय, निर्दोष ठहराया जाना, वाचा का अनुग्रह या उद्धारकारी धार्मिकता है। इसलिए मुख्य पाठ व्यापक पद रखता है और वैकल्पिक न्याय-संबंधी अर्थ पादटिप्पणी में देता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, प्रार्थनात्मक और सामान्य पाठक के लिए सुबोध रूप। “अधर्म पर अधर्म” जानबूझकर मूल की पुनरावृत्ति और तीखे शाप-विनती स्वर को बनाए रखता है।
