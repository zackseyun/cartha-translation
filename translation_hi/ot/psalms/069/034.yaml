  rationale: इब्रानी में बहुवचन है; हिन्दी में ‘समुद्र’ रूप एकवचन और बहुवचन दोनों प्रसंगों में स्वाभाविक रूप से प्रयुक्त होता है और यहाँ समस्त समुद्रों को सामूहिक रूप में दर्शाता है।
- source_word: וְכָל רֹמֵשׂ
  choice: और ... विचरनेवाले सभी जीव
  rationale: רמש चलने, रेंगने या झुंड में गतिशील होनेवाले प्राणियों को सूचित कर सकता है। समुद्री संदर्भ में ‘विचरनेवाले सभी जीव’ व्यापक, स्वाभाविक और अर्थ-संगत है; ‘जीव’ हिन्दी में इस संज्ञीकृत कृदंत के आशय को स्पष्ट करता है।
- source_word: בָּם
  choice: उनमें
  rationale: बहुवचन प्रत्यय निकटतम पूर्वपद ‘समुद्र’ की ओर संकेत करता है; ‘उनमें’ उसी सर्वनामिक संबंध को बनाए रखता है।
theological_decisions:
