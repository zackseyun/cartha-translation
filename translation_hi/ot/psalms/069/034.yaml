  language: hi
  text: आकाश[b] और पृथ्वी उसकी स्तुति करें[a], समुद्रों और उनमें विचरनेवाले सभी जीव[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी क्रिया को यहाँ स्तुति के आह्वान या कामना के रूप में समझा गया है; इसे अधिक भविष्यसूचक अर्थ में, “आकाश और पृथ्वी उसकी स्तुति करेंगे,” भी समझा जा सकता है।
    reason: alternative_reading
  - marker: b
    text: इब्रानी में शाब्दिक रूप से “आकाशों”; हिन्दी में यहाँ सामूहिक अर्थ में “आकाश” कहा गया है।
    reason: lexical_alternative
  - marker: c
    text: या “रेंगनेवाले” अथवा “झुंड में चलनेवाले”; इब्रानी शब्द गतिशील, रेंगने या झुंड में विचरनेवाले जीवों के लिए प्रयुक्त हो सकता है।
    reason: lexical_alternative
lexical_decisions:
