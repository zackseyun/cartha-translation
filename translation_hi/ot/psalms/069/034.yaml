  rationale: इब्रानी रूप बहुवचन है, पर हिन्दी में ‘आकाश’ स्वाभाविक सामूहिक संज्ञा है और ‘आकाश और पृथ्वी’ सृष्टि की समग्रता बतानेवाला परिचित युग्म है।
- source_word: וָאָרֶץ
