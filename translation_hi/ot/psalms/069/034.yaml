  choice: आकाश, पृथ्वी, समुद्र और उनमें रहनेवाले जीवों को स्तुति करने का विश्वव्यापी आह्वान
  alternative: यह भविष्यसूचक कथन कि सृष्टि उसकी स्तुति करेगी
