  edition: WLC
  text: אַל יֵ֘בֹ֤שׁוּ בִ֨/י קֹוֶי/ךָ֮ אֲדֹנָ֥/י יְהוִ֗ה צְבָ֫א֥וֹת אַל יִכָּ֣לְמוּ בִ֣/י מְבַקְשֶׁ֑י/ךָ אֱ֝לֹהֵ֗י יִשְׂרָאֵֽל־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/069/006.yaml
  text: Let not those who hope in you be put to shame because of me[a], Lord Yahweh of hosts; let not those who seek you be humiliated because of me[b], God of Israel.
translation:
  language: hi
  text: 'हे प्रभु याहवे, सेनाओं के परमेश्वर,

    जो तुझ पर आशा रखते हैं, वे मेरे कारण लज्जित न हों[a];

    हे इस्राएल के परमेश्वर,

    जो तुझे खोजते हैं, वे मेरे कारण अपमानित न हों।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘जो तेरी बाट जोहते हैं।’ इब्रानी शब्द में आशापूर्वक प्रतीक्षा करने का भाव भी है।
    reason: lexical_alternative
lexical_decisions:
- source_word: יֵבֹשׁוּ
  choice: लज्जित हों
  rationale: בוש यहाँ लज्जा अथवा निराशाजनक अपयश का अनुभव करने को दर्शाता है; निषेध के साथ ‘लज्जित न हों’ स्वाभाविक और अर्थनिष्ठ है।
- source_word: בִי
  choice: मेरे कारण
  rationale: 'इस प्रसंग में בִי कारण अथवा अवसर का भाव रखता है: भजनकार नहीं चाहता कि उसकी दशा के कारण विश्वास रखने वालों को लज्जा उठानी पड़े।'
- source_word: קֹוֶיךָ
  choice: जो तुझ पर आशा रखते हैं
  rationale: קוה के कृदन्त में बाट जोहने और आशापूर्वक प्रतीक्षा करने दोनों का भाव है; ‘आशा रखते हैं’ भरोसे से भरी अपेक्षा को सहज हिन्दी में व्यक्त करता है।
- source_word: אֲדֹנָי יְהוָה צְבָאוֹת
  choice: हे प्रभु यहवे, सेनाओं के परमेश्वर
  rationale: אֲדֹנָי को ‘प्रभु’, יהוה को उसके विशिष्ट नाम ‘यहवे’, और צְבָאוֹת को उसकी सैन्य/स्वर्गीय समूहों की मूल छवि बनाए रखते हुए ‘सेनाओं के परमेश्वर’ किया गया है।
- source_word: יִכָּלְמוּ
  choice: अपमानित हों
  rationale: כלם का अपमान और बेइज्जती का भाव בוש से मिलता-जुलता किंतु कुछ अधिक प्रबल है; अलग शब्द रखने से समानांतर पंक्तियों का सूक्ष्म भेद बचता है।
- source_word: מְבַקְשֶׁיךָ
  choice: जो तुझे खोजते हैं
  rationale: בקש का कृदन्त निरन्तर और सक्रिय खोज को दर्शाता है; ‘जो तुझे खोजते हैं’ वर्तमान हिन्दी में सहज है।
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: हे इस्राएल के परमेश्वर
  rationale: रचना-संबोधन को हिन्दी में स्पष्ट करने के लिए ‘हे’ जोड़ा गया है; मूल संबंधवाचक पदबंध सुरक्षित है।
theological_decisions:
- issue: संयुक्त संबोधन אֲדֹנָי יְהוָה में ईश्वरीय नाम का अनुवाद
  choice: प्रभु यहवे
  alternative: प्रभु परमेश्वर
  rationale: יהוה को सामान्य उपाधि में विलीन करने के बजाय विशिष्ट वाचा-नाम के रूप में रखा गया है, जबकि אֲדֹנָי का अलग अर्थ ‘प्रभु’ भी सुरक्षित है।
- issue: צְבָאוֹת की उपाधि
  choice: सेनाओं के परमेश्वर
  alternative: सर्वशक्तिमान
  rationale: ‘सेनाओं’ मूल इब्रानी बिंब को बनाए रखता है; ‘सर्वशक्तिमान’ अर्थ-व्याख्या है और उस बिंब को मिटा देता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण काव्यात्मक संबोधन रखा गया है। परमेश्वर के प्रति एकवचन निकट संबोधन ‘तू/तुझ/तुझे’ भजन की सीधी प्रार्थना और पंक्तियों की सहजता को व्यक्त करता है; शब्दक्रम को हिन्दी काव्य के अनुरूप पुनर्गठित किया गया है।
