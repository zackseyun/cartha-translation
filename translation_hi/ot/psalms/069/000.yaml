lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: संगीत-निर्देशक के लिए
  rationale: भजन के शीर्षक में यह पद प्रस्तुति का नेतृत्व करने वाले व्यक्ति के लिए संगीत-संबंधी निर्देश देता है। यह आधुनिक और सहज हिंदी है तथा केवल गायक-मंडली तक अर्थ को सीमित नहीं करता।
- source_word: עַל
  choice: के अनुसार
  rationale: संगीत-संबंधी शीर्षकों में यह संबंध किसी धुन, शैली या प्रस्तुति-विधि की ओर संकेत कर सकता है। ‘के अनुसार’ इस लचीलेपन को बनाए रखता है।
- source_word: שׁוֹשַׁנִּים
  choice: “सोसन के फूल”
  rationale: इब्रानी शब्द बहुवचन में सोसन के फूलों को दर्शाता है; उद्धरण-चिह्न यह संकेत देते हैं कि यहाँ संभवतः किसी धुन या संगीत-शैली का नाम है, जबकि मूल शाब्दिक चित्र भी बना रहता है।
- source_word: לְדָוִד
  choice: दाऊद का
  rationale: शीर्षक में לְ संबंध, रचना, समर्पण या संबद्धता प्रकट कर सकता है। ‘दाऊद का’ इस व्यापकता को ‘दाऊद द्वारा रचित’ की अपेक्षा अधिक सुरक्षित रखता है।
