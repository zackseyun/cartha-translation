- source_word: תִּשְׁטְפֵנִי
  choice: मुझे बहा न ले जाए
  rationale: שטף यहाँ प्रचण्ड जलधारा द्वारा बहा ले जाने या पूरी तरह अभिभूत कर देने का भाव रखता है; यह हिन्दी में स्वाभाविक और चित्रात्मक है।
- source_word: שִׁבֹּלֶת מַיִם
  choice: पानी की प्रचण्ड धारा
  rationale: שִׁבֹּלֶת מַיִם बहते या उमड़ते पानी की धारा को दर्शाता है। ‘प्रचण्ड धारा’ उसके विनाशकारी वेग को स्पष्ट करती है, जबकि ‘पानी’ मूल पद מַיִם को बनाए रखता है।
- source_word: תִּבְלָעֵנִי
  choice: मुझे निगल न जाए
