- source_word: מְצוּלָה
  choice: गहराई
  rationale: מְצוּלָה जल की अथाह गहराई या गहरे जल को सूचित करता है। ‘गहराई’ संक्षिप्त है और मूल की काव्यात्मक व्यक्तिरचना बनाए रखती है।
- source_word: תֶּאְטַר
  choice: बन्द न कर ले
  rationale: यह क्रिया कसकर बन्द करने का भाव देती है। ‘अपना मुँह बन्द करना’ हिन्दी में मूल रूपक को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: בְּאֵר
  choice: गड्ढा
  rationale: בְּאֵר सामान्यतः कुआँ भी हो सकता है, पर यहाँ मृत्युकारी जल, गहराई और निगलने के समानान्तर चित्र में ‘गड्ढा’ संकटपूर्ण खुली खाई का अर्थ अधिक स्पष्ट करता है; वैकल्पिक अर्थ पादटिप्पणी में रखा गया है।
- source_word: פִּיהָ
  choice: अपना मुँह
  rationale: ‘मुँह’ गड्ढे या कुएँ के खुले मुख का व्यक्तिरूपक सुरक्षित रखता है।
- source_word: עָלַי
  choice: मेरे ऊपर
  rationale: मुँह बन्द होने के प्रसंग में यह वक्ता के ऊपर खुला भाग बन्द हो जाने का स्थानिक चित्र व्यक्त करता है।
