  text: Rescue me from the mire; do not let me sink[a]. Let me be delivered from those who hate me and from the depths of the waters.
translation:
  language: hi
  text: मुझे कीचड़ से बचा ले; मुझे धँसने न दे। जो मुझसे घृणा करते हैं, उनसे और जल की गहराइयों से मुझे छुड़ा ले।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַצִּילֵנִי
  choice: मुझे...बचा ले
  rationale: हिफ़ील आज्ञार्थक रूप सक्रिय बचाव की प्रार्थना व्यक्त करता है; निकट संकट के बिंब में ‘बचा ले’ स्वाभाविक और सजीव है।
- source_word: מִטִּיט
  choice: कीचड़ से
  rationale: טיט का अर्थ कीचड़, दलदल-जैसी मिट्टी या गारा हो सकता है। ‘कीचड़’ सामान्य आधुनिक हिन्दी में स्पष्ट है और धँसने के अगले बिंब से मेल खाता है।
- source_word: וְאַל אֶטְבָּעָה
  choice: मुझे धँसने न दे
  rationale: निषेध के साथ प्रथम पुरुष अपूर्ण क्रिया प्रार्थनात्मक इच्छा व्यक्त करती है। यह हिन्दी प्रयोग उस भाव को स्वाभाविक रूप से सुरक्षित रखता है।
- source_word: אִנָּצְלָה
  choice: मुझे छुड़ा ले
  rationale: निफ़ाल कोहोर्टेटिव उद्धार की पुनरुक्त विनती है। ‘छुड़ा ले’ आरम्भिक ‘बचा ले’ के साथ काव्यात्मक समानांतरता रखते हुए रूप की इच्छार्थक शक्ति व्यक्त करता है।
- source_word: מִשֹּׂנְאַי
  choice: जो मुझसे घृणा करते हैं, उनसे
  rationale: यह शब्दशः ‘मुझसे घृणा करनेवालों से’ है। संबंधवाचक वाक्यांश मूल अर्थ को ‘शत्रु’ जैसे व्याख्यात्मक सामान्यीकरण के बिना स्पष्ट करता है।
- source_word: וּמִמַּעֲמַקֵּי מָיִם
  choice: और गहरे जल से
  rationale: מעמקי מים जल की गहराइयों अथवा गहरे जल को दर्शाता है। ‘गहरे जल’ आधुनिक हिन्दी में सहज है और डूबने के संकट का काव्यात्मक बिंब बनाए रखता है।
