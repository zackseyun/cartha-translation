  text: May their encampment become desolate[b][a]; let there be no one dwelling in their tents.
translation:
  language: hi
  text: उनका पड़ाव उजाड़ हो जाए[a]; उनके तंबुओं में कोई रहनेवाला न हो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उनकी छावनी” अथवा “उनका निवास-स्थान”।
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּהִי
  choice: हो जाए
  rationale: היה का विधिलिंग-सदृश प्रयोग यहाँ शापात्मक कामना व्यक्त करता है; ‘हो जाए’ आधुनिक हिन्दी में इस कामनात्मक बल को स्वाभाविक रूप से प्रकट करता है।
- source_word: טִירָתָם
  choice: उनका पड़ाव
  rationale: טִירָה छावनी, पड़ाव या घिरी हुई बस्ती का बोध करा सकता है। ‘पड़ाव’ सामूहिक और ठोस स्थान का अर्थ रखता है तथा समानांतर ‘तंबुओं’ के साथ स्वाभाविक बैठता है।
- source_word: נְשַׁמָּה
  choice: उजाड़
  rationale: यह शब्द वीरानी और विनाश की दशा बताता है; ‘उजाड़ हो जाए’ अर्थ और काव्यात्मक संक्षिप्तता दोनों बनाए रखता है।
- source_word: בְּאָהֳלֵיהֶם
  choice: उनके तंबुओं में
  rationale: אֹהֶל का मूल अर्थ ‘तंबू’ है। ठोस इब्रानी बिंब को बनाए रखने के लिए इसे सामान्य ‘घरों’ या ‘निवासों’ में नहीं बदला गया।
- source_word: אַל יְהִי
  choice: न हो
  rationale: नकारात्मक कामनात्मक प्रयोग को ‘न हो’ संक्षिप्त और स्वाभाविक हिन्दी में व्यक्त करता है, भविष्यवाणी के बजाय याचना/शाप का बल बनाए रखते हुए।
- source_word: יֹשֵׁב
  choice: कोई रहनेवाला
  rationale: ישב का कृदंत यहाँ बसने या रहने वाले व्यक्ति को दर्शाता है। ‘कोई रहनेवाला’ हिन्दी में स्पष्ट है और क्रियात्मक भाव को सुरक्षित रखता है।
theological_decisions:
- issue: विलाप-भजन में शापात्मक कामनार्थक क्रियाएँ
  choice: 'कामना/याचना के रूप में अनुवाद: ‘हो जाए’; ‘न हो।’'
  alternative: 'साधारण भविष्यवाणी: ‘उजाड़ हो जाएगा; कोई नहीं रहेगा।’'
  rationale: इब्रानी क्रियारूप इच्छार्थक/कामनात्मक हैं; पद केवल भविष्य का कथन नहीं, बल्कि परमेश्वर के सामने रखी गई शापात्मक याचना है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘पड़ाव’ और ‘तंबू’ मूल के ठोस काव्यात्मक समानांतर बिंब को बनाए रखते हैं।
