source:
  edition: WLC
  text: טָבַ֤עְתִּי בִּ/יוֵ֣ן מְ֭צוּלָה וְ/אֵ֣ין מָעֳמָ֑ד בָּ֥אתִי בְ/מַעֲמַקֵּי מַ֝֗יִם וְ/שִׁבֹּ֥לֶת שְׁטָפָֽתְ/נִי׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/069/002.yaml
  text: I have sunk in deep mire[a], and there is no foothold; I have come into deep waters, and the flood has swept over me.
translation:
  language: hi
  text: मैं गहरी कीचड़ में धँस गया हूँ, और खड़े होने की कोई जगह नहीं; मैं गहरे पानी में आ पहुँचा हूँ, और धारा मुझे बहा ले गई है[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “प्रवाह ने मुझे ढाँप लिया है” अथवा “बाढ़ ने मुझे निगल लिया है।”
    reason: שִׁבֹּלֶת और שְׁטָפָתְנִי के संदर्भानुकूल वैकल्पिक अर्थ—प्रवाह/बाढ़ और ढाँप लेना/निगल लेना—को दर्शाता है।
lexical_decisions:
- source_word: טָבַעְתִּי
  choice: मैं ... धँस गया हूँ
  rationale: काल रूप पूर्ण हो चुकी किंतु वर्तमान में बनी हुई संकटपूर्ण अवस्था व्यक्त करता है; हिन्दी का पूर्ण वर्तमान इसे स्वाभाविक ढंग से दर्शाता है।
- source_word: בִּיוֵן מְצוּלָה
  choice: गहरी कीचड़ में
  rationale: יוֵן की कीचड़ और מְצוּלָה की गहराई—दोनों बिंब संक्षिप्त, स्वाभाविक हिन्दी में सुरक्षित रहते हैं।
- source_word: וְאֵין מָעֳמָד
  choice: जहाँ पैर टिकाने की जगह नहीं
  rationale: מָעֳמָד खड़े होने के स्थान या आधार को बताता है; यह प्रयोग अस्थिर भूमि का दृश्य स्पष्ट रखता है।
- source_word: בָּאתִי
  choice: मैं ... आ पहुँचा हूँ
  rationale: בוא का पूर्ण रूप संकट की अवस्था में पहुँच चुकने को व्यक्त करता है और पहली पंक्ति के पूर्ण वर्तमान के समानांतर है।
- source_word: בְמַעֲמַקֵּי מַיִם
  choice: गहरे पानी में
  rationale: शाब्दिक अर्थ ‘पानी की गहराइयों में’ है; चुना हुआ रूप आधुनिक हिन्दी में सहज रहते हुए गहराई का बिंब बनाए रखता है।
- source_word: שִׁבֹּלֶת
  choice: तेज़ धारा
  rationale: यह शब्द बहती धारा, प्रवाह या बाढ़ की धारा को सूचित कर सकता है; ‘तेज़ धारा’ अगले क्रियापद के प्रचंड जल-बिंब के अनुकूल है।
- source_word: שְׁטָפָתְנִי
  choice: मेरे ऊपर से बह गई है
  rationale: שטף का अर्थ उमड़कर बहना, डुबो देना या बहा ले जाना हो सकता है; यह चयन जल के ऊपर से प्रबलता से गुजरने का ठोस बिंब रखता है।
