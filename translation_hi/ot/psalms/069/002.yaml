translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। पद के दो समानांतर संकट-बिंब—कीचड़ में आधार न मिलना और गहरे पानी की धारा से ढक जाना—स्पष्ट रूप से सुरक्षित हैं।
