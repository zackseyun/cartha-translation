source:
  edition: WLC
  text: אֱֽלֹהִ֗ים אַתָּ֣ה יָ֭דַעְתָּ לְ/אִוַּלְתִּ֑/י וְ֝/אַשְׁמוֹתַ֗/י מִמְּ/ךָ֥ לֹא נִכְחָֽדוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/069/005.yaml
  text: God[a], you know my foolishness[b], and my guilt is not hidden from you.
translation:
  language: hi
  text: हे परमेश्वर, तू मेरी मूर्खता जानता है, और मेरे अपराध[a] तुझसे छिपे नहीं हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘मेरे दोष’।
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱלֹהִים
  choice: हे परमेश्वर
  rationale: यह प्रार्थना में सीधा संबोधन है। आधुनिक, गरिमापूर्ण हिन्दी में ‘हे परमेश्वर’ स्वाभाविक है।
- source_word: אַתָּה
  choice: तू
  rationale: इब्रानी में कर्ता-सर्वनाम स्पष्ट रूप से देकर बल दिया गया है। परमेश्वर को संबोधित भजन की प्रार्थना में आदरसूचक निकटता वाला ‘तू’ इस बल को स्वाभाविक रूप से व्यक्त करता है।
- source_word: יָדַעְתָּ
  choice: जानता है
  rationale: कालरूप यहाँ वर्तमान और पूर्ण ज्ञान की अवस्था बताता है; इसलिए हिन्दी का वर्तमानकाल उपयुक्त है।
- source_word: לְאִוַּלְתִּי
  choice: मेरी मूर्खता
  rationale: אִוֶּלֶת केवल बौद्धिक भूल नहीं, बल्कि दोषपूर्ण नैतिक मूर्खता भी सूचित करती है। ‘मूर्खता’ इस अर्थ को स्पष्ट और सहज रूप में रखती है।
- source_word: וְאַשְׁמוֹתַי
  choice: मेरे अपराध
  rationale: बहुवचन संज्ञा वक्ता के दोषों या कसूरों को ठोस बहुवचन में व्यक्त करती है। ‘अपराध’ स्वाभाविक हिन्दी है और इब्रानी बहुवचन के अनुरूप क्रिया से मेल खाता है।
- source_word: מִמְּךָ
  choice: तुझसे
  rationale: पूर्वसर्ग का सीधा अर्थ ‘तुझसे’ है और ‘छिपे’ के साथ हिन्दी में स्वाभाविक मुहावरा बनता है।
- source_word: לֹא נִכְחָדוּ
  choice: छिपे नहीं हैं
  rationale: निफ़अल पूर्ण बहुवचन किसी वस्तु के छिपा न होने की अवस्था बताता है। हिन्दी वर्तमान पूर्ण-अवस्था और बहुवचन विषय दोनों को सहज रूप से व्यक्त करती है।
theological_decisions:
- issue: बाद में मसीही रूप से प्रयुक्त भजन में वक्ता द्वारा मूर्खता और अपराध स्वीकार करना
  choice: पद को भजनकार की अपनी प्रथम-पुरुष स्वीकारोक्ति के रूप में अनूदित किया गया है।
  alternative: इसे केवल सामूहिक या प्रतिनिधिक स्वीकारोक्ति मानकर व्यक्तिगत दोष का भाव कम करना।
  rationale: इब्रानी पाठ स्पष्ट रूप से ‘मेरी मूर्खता’ और ‘मेरे अपराध’ कहता है। अनुवाद को इस तनाव को बनाए रखना चाहिए, न कि बाद के धर्मवैज्ञानिक प्रयोग के आधार पर इसे मिटाना चाहिए।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, प्रार्थनात्मक और गरिमापूर्ण रखी गई है। ‘तू/तुझसे’ भजन की प्रत्यक्ष, निकट संबोधन-शैली को बनाए रखता है। मुख्य पाठ में बहुवचन ‘अपराध’ इब्रानी אַשְׁמוֹתַי के ठोस बहुवचन को सुरक्षित रखता है।
