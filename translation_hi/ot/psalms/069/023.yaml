base_translation:
  language: en
  yaml_path: translation/ot/psalms/069/023.yaml
  text: Let their eyes be darkened from seeing[b][a], and make their loins shake continually.
translation:
  language: hi
  text: उनकी आँखें अँधेरी हो जाएँ, ताकि वे देख न सकें, और उनकी कमरों को निरन्तर डगमगाता रख।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תֶּחְשַׁכְנָה
  choice: ऐसी अँधेरी हो जाएँ
  rationale: काल रूप इस शापमूलक प्रार्थना में इच्छा या विनती व्यक्त करता है; ‘अँधेरी हो जाएँ’ परिणामी दशा को स्वाभाविक हिन्दी में रखता है।
- source_word: עֵינֵיהֶם
  choice: उनकी आँखें
  rationale: मूल शारीरिक बिम्ब का सीधा और स्वाभाविक अनुवाद।
- source_word: מֵרְאוֹת
  choice: कि वे देख न सकें
  rationale: מן के साथ infinitive का शाब्दिक अर्थ ‘देखने से’ है, पर यहाँ उसका भाव देखने की असमर्थता या रोक है; हिन्दी में यह रूप स्पष्ट और सहज है।
- source_word: וּמָתְנֵיהֶם
  choice: और उनकी कमर
  rationale: מָתְנַיִם कमर/कटि-प्रदेश को दर्शाता है; आधुनिक सामान्य हिन्दी में ‘कमर’ सबसे सुबोध है और शारीरिक बिम्ब बनाए रखता है।
- source_word: תָּמִיד
  choice: निरन्तर
  rationale: लगातार चलने वाली अवस्था का काव्यात्मक और सहज हिन्दी रूप।
- source_word: הַמְעַד
  choice: काँपती रहे
  rationale: हिफ़ील रूप डगमगाने या अस्थिर होने का कारण बनने की भावना देता है। हिन्दी में ‘कमर काँपती रहे’ शारीरिक दुर्बलता और अस्थिरता को स्वाभाविक ढंग से व्यक्त करता है, यद्यपि अधिक शाब्दिक विकल्प ‘डगमगाती रहे’ है।
theological_decisions:
- issue: पद का शापमूलक बल
  choice: 'इसे न्याय के लिए प्रार्थना/कामना के रूप में प्रस्तुत किया गया: ‘हो जाएँ… काँपती रहे।’'
  alternative: 'भविष्यवाणी के रूप में: ‘उनकी आँखें अँधेरी हो जाएँगी…।’'
  rationale: सन्दर्भ में क्रियाएँ केवल भविष्यवाणी नहीं, परमेश्वर से न्याय की विनती व्यक्त करती हैं; हिन्दी विधिलिंग-सदृश रचना इस तनाव को बिना नरम किए सुरक्षित रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण काव्यात्मक लहजा और सामान्य पाठक के लिए सुबोध शब्दावली। ‘कटि’ जैसे अत्यधिक संस्कृतनिष्ठ शब्द से बचकर ‘कमर’ चुना गया है।
