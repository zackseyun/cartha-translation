source:
  edition: WLC
  text: אַתָּ֤ה יָדַ֗עְתָּ חֶרְפָּתִ֣/י וּ֭/בָשְׁתִּ/י וּ/כְלִמָּתִ֑/י נֶ֝גְדְּ/ךָ֗ כָּל צוֹרְרָֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/069/019.yaml
  text: You know my reproach[a], my shame, and my humiliation; all my adversaries are before you.
translation:
  language: hi
  text: आप मेरी निन्दा, मेरी लज्जा और मेरा अपमान जानते हैं; मेरे सभी विरोधी आपके सामने हैं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יָדַעְתָּ
  choice: आप जानते हैं
  rationale: यह ידע का क़ाल पूर्ण, द्वितीय पुरुष एकवचन रूप है। परमेश्वर से सीधी प्रार्थना में वर्तमान काल उसकी पूरी और निरंतर जानकारी को स्वाभाविक हिन्दी में व्यक्त करता है। आदरसूचक ‘आप’ आधुनिक मानक हिन्दी में गरिमापूर्ण संबोधन है।
- source_word: חֶרְפָּתִי
  choice: मेरी निन्दा
  rationale: यह शब्द किसी व्यक्ति पर आने वाली निन्दा, तिरस्कार या सामाजिक बदनामी को दर्शाता है। ‘निन्दा’ काव्यात्मक गरिमा और दूसरों द्वारा किए गए अपमान—दोनों को बनाए रखती है।
- source_word: בָשְׁתִּי
  choice: मेरी लज्जा
  rationale: בשת का सीधा अर्थ लज्जा या अनादर है। ‘लज्जा’ अगले निकटार्थक शब्द से अलग रहते हुए मूल की भावात्मक तीव्रता बनाए रखती है।
- source_word: כְלִמָּתִי
  choice: मेरा अपमान
  rationale: כלמה सार्वजनिक रूप से नीचा दिखाए जाने, अनादर या अपमान का बोध कराता है। ‘अपमान’ तीन निकटार्थक संज्ञाओं के मूल क्रम और संचयी प्रभाव को सुरक्षित रखता है।
- source_word: נֶגְדְּךָ
  choice: आपके सामने
  rationale: נגד प्रत्यय सहित किसी की उपस्थिति या दृष्टि के सामने होने का अर्थ देता है। यह वाक्यांश इस भाव को भी स्वाभाविक रूप से व्यक्त करता है कि विरोधी परमेश्वर से छिपे नहीं हैं।
- source_word: כָּל־צוֹרְרָי
  choice: मेरे सभी विरोधी
  rationale: כָּל समग्रता व्यक्त करता है और צרר से बना बहुवचन सक्रिय शत्रुता रखने वालों को दर्शाता है। ‘विरोधी’ स्पष्ट, स्वाभाविक और काव्यात्मक रूप से उपयुक्त है।
theological_decisions:
- issue: परमेश्वर के लिए द्वितीय पुरुष संबोधन
  choice: आदरसूचक ‘आप’
  alternative: परंपरागत काव्यात्मक ‘तू’
  rationale: हिब्रू रूप केवल द्वितीय पुरुष पुल्लिंग एकवचन बताता है और हिन्दी के सामाजिक आदर-स्तर को निर्धारित नहीं करता। आधुनिक सामान्य पाठकों के लिए ‘आप’ गरिमापूर्ण और स्वाभाविक है; इससे कोई अतिरिक्त धर्मवैज्ञानिक दावा नहीं जोड़ा जाता।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण प्रार्थना-शैली अपनाई गई है। मूल के तीन निकटार्थक शब्दों—निन्दा, लज्जा और अपमान—को अलग रखते हुए उनकी क्रमिक भाव-तीव्रता और समानांतर काव्य-रचना सुरक्षित रखी गई है। अंग्रेज़ी परामर्श-पाठ की पादटिप्पणी मूल पद में किसी वास्तविक पाठगत या अर्थगत अस्पष्टता से मेल नहीं खाती, इसलिए हिन्दी मसौदे में अनावश्यक पादटिप्पणी नहीं जोड़ी गई।
