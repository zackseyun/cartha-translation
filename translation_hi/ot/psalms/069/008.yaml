  yaml_path: translation/ot/psalms/069/008.yaml
  text: I have become a stranger to my brothers[b][a], and a foreigner to my mother's sons.
translation:
  language: hi
  text: मैं अपने भाइयों के लिए पराया हो गया हूँ[a], और अपनी माँ के बेटों के लिए अजनबी[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मैं पराया था” अथवा “मैं पराया हो गया।” इब्रानी क्रिया को सामान्य भूतकाल या किसी दशा में आ जाने के अर्थ में समझा जा सकता है।
    reason: lexical_alternative
  - marker: b
    text: “माँ के बेटे” निकट परिवार के सदस्यों, विशेषकर भाइयों, के लिए प्रयुक्त एक काव्यात्मक अभिव्यक्ति है।
    reason: cultural_note
lexical_decisions:
- source_word: מוּזָר
  choice: पराया
  rationale: यह शब्द निकट संबंधियों के बीच भी पराया या अलग समझे जाने की दशा व्यक्त करता है। ‘पराया’ आधुनिक हिन्दी में स्वाभाविक है और अगली पंक्ति के ‘अजनबी’ के साथ काव्यात्मक समानांतरता बनाए रखता है।
- source_word: הָיִיתִי
  choice: हो गया हूँ
  rationale: यहाँ पूर्ण क्रिया उस परिणामी दशा को व्यक्त कर सकती है जिसमें भजनकार आ पहुँचा है। ‘हो गया हूँ’ इस वर्तमान प्रभाव सहित परिवर्तन को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: לְאֶחָי
  choice: अपने भाइयों के लिए
  rationale: इब्रानी में स्पष्ट रूप से ‘मेरे भाइयों’ है। संबंधसूचक לְ को हिन्दी में ‘के लिए’ द्वारा स्वाभाविक रूप से व्यक्त किया गया है।
- source_word: וְנָכְרִי
  choice: और ... अजनबी
  rationale: נָכְרִי किसी बाहरी, विदेशी या अनजाने व्यक्ति का बोध कराता है। पारिवारिक संबंध के संदर्भ में ‘अजनबी’ स्पष्ट और स्वाभाविक है तथा पहली पंक्ति के भाव को तीव्र करता है।
- source_word: לִבְנֵי אִמִּי
  choice: अपनी माँ के बेटों के लिए
  rationale: यह इब्रानी पदबंध का निकट और बोधगम्य अनुवाद है। यह काव्यात्मक समानांतरता तथा मूल के स्पष्ट पुरुषवाची संबंधसूचक शब्द को सुरक्षित रखता है।
theological_decisions:
- issue: लिंगसूचक पारिवारिक भाषा
  choice: मुख्य पाठ में ‘भाइयों’ और ‘माँ के बेटों’ को बनाए रखना
  alternative: ‘भाई-बहनों’ या ‘परिवारवालों’ कहना
  rationale: मूल पद में दोनों स्थानों पर स्पष्ट पुरुषवाची संबंधसूचक संज्ञाएँ हैं। व्यापक पारिवारिक अर्थ संभव होने पर भी उसे मुख्य पाठ में सामान्यीकृत करना मूल की काव्यात्मक समानांतरता और विशिष्ट भाषा को कम कर देगा।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘पराया’ और ‘अजनबी’ मूल की समानांतर किंतु क्रमशः तीव्र होती अभिव्यक्ति को बनाए रखते हैं; शब्दक्रम हिन्दी की स्वाभाविकता के अनुसार है।
