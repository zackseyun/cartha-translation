  yaml_path: translation/ot/psalms/069/036.yaml
  text: The offspring of his servants will inherit it[b][a], and those who love his name will dwell in it.
translation:
  language: hi
  text: उसके सेवकों की संतान उसकी उत्तराधिकारी होगी[a], और उसके नाम से प्रेम करनेवाले उसमें बसेंगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘उसकी’ और ‘उसमें’ का संकेत सिय्योन अथवा पिछली पंक्ति में वर्णित पुनर्निर्मित नगरी की ओर है; कुछ लोग इसे अधिक व्यापक रूप से देश या यरूशलेम के लिए समझते हैं।
    reason: cross_reference
lexical_decisions:
- source_word: זֶרַע
  choice: संतान
  rationale: यहाँ यह शब्द सामूहिक रूप से सेवकों की भावी पीढ़ी को दर्शाता है। ‘संतान’ आधुनिक हिन्दी में स्वाभाविक है और इब्रानी के सामूहिक एकवचन भाव को बनाए रखता है।
- source_word: עֲבָדָיו
  choice: उसके सेवकों
  rationale: भजन के भक्तिपरक और वाचागत संदर्भ में ‘सेवक’ उपयुक्त है; ‘दास’ यहाँ सामाजिक बंधन का अनावश्यक रूप से प्रबल संकेत दे सकता है।
- source_word: יִנְחָלוּהָ
  choice: उसका अधिकारी होगी
  rationale: नחל के उत्तराधिकार में पाने के भाव को ‘अधिकारी होना’ स्वाभाविक हिन्दी में व्यक्त करता है। स्त्रीलिंग प्रत्यय का संबंध निकट संदर्भ के सिय्योन अथवा पुनर्निर्मित नगरी से है।
- source_word: אֹהֲבֵי שְׁמוֹ
  choice: जो उसके नाम से प्रेम रखते हैं
  rationale: यह अभिव्यक्ति परमेश्वर के ‘नाम’ से प्रेम करने की मूल बाइबलीय भाषा को बनाए रखती है और उसे केवल ‘उससे प्रेम करनेवाले’ कहकर सरल नहीं करती।
- source_word: יִשְׁכְּנוּ בָהּ
  choice: वे उसमें बसे रहेंगे
  rationale: ‘बसे रहेंगे’ שׁכן के निवास करने अथवा टिककर बसने के अर्थ को सहज, गरिमापूर्ण हिन्दी में व्यक्त करता है; ‘उसमें’ उसी स्त्रीलिंग पूर्वपद की ओर संकेत करता है।
theological_decisions:
- issue: ‘उसका अधिकारी होगी’ और ‘उसमें बसे रहेंगे’ के स्त्रीलिंग प्रत्ययों का संदर्भ
  choice: इनका निकटतम संदर्भ सिय्योन अथवा पुनर्निर्मित नगरी है; हिन्दी में इसे सर्वनाम द्वारा व्यक्त किया गया है।
  alternative: इसे अधिक व्यापक रूप से देश या यरूशलेम का संकेत माना जा सकता है।
  rationale: पिछली पंक्ति में सिय्योन को बचाने और यहूदा के नगरों को बनाने का उल्लेख है। फिर भी पद स्वयं संज्ञा को दोहराता नहीं, इसलिए अनुवाद में सर्वनाम रखकर मूल की संदर्भगत खुली गुंजाइश सुरक्षित की गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज किंतु भजन के अनुरूप गरिमापूर्ण शैली रखी गई है। ‘संतान’ सामूहिक अर्थ देता है, ‘अधिकारी होगी’ उत्तराधिकार का भाव बचाता है, और ‘नाम से प्रेम’ की मूल धार्मिक अभिव्यक्ति ज्यों की त्यों रखी गई है।
