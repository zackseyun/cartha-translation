  yaml_path: translation/ot/psalms/069/004.yaml
  text: Those who hate me without cause are more than the hairs of my head[a]; those who would destroy me, my false enemies, are mighty. What I did not steal[b], then I must restore.
translation:
  language: hi
  text: जो अकारण मुझसे बैर रखते हैं, वे मेरे सिर के बालों से भी अधिक हैं; जो मुझे नष्ट करना चाहते हैं, मेरे झूठे शत्रु[a], बलवान हैं। जो मैंने नहीं लूटा, उसे भी मुझे लौटाना पड़ता है[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मेरे कपटी शत्रु।” इब्रानी वाक्यांश शत्रुओं को झूठा या कपटी बता सकता है, अथवा यह संकेत कर सकता है कि उनका विरोध झूठा और निराधार है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “तब मैं लौटाता हूँ” या “तब मैं लौटाऊँगा।” आशय यह हो सकता है कि भजनकार को वह वस्तु भी लौटाने के लिए विवश किया जाता है जिसे उसने लूटा ही नहीं।
    reason: lexical_alternative
lexical_decisions:
- source_word: רַבּוּ מִשַּׂעֲרוֹת רֹאשִׁי
  choice: मेरे सिर के बालों से भी अधिक हैं
  rationale: מִן तुलना सूचित करता है; यह स्वाभाविक हिन्दी में शत्रुओं की असंख्य संख्या का काव्यात्मक अतिशयोक्तिपूर्ण चित्र बनाए रखता है।
- source_word: שֹׂנְאַי חִנָּם
  choice: जो अकारण मुझसे बैर रखते हैं
  rationale: חִנָּם यहाँ बिना उचित कारण या आधार के अर्थ में है। ‘अकारण’ संक्षिप्त और वर्तमान हिन्दी में स्पष्ट है।
- source_word: עָצְמוּ
  choice: बलवान हैं
  rationale: क्रिया शक्ति और प्रबलता दर्शाती है; ‘बलवान हैं’ शत्रुओं की सामर्थ्य और खतरे को काव्यात्मक ढंग से व्यक्त करता है।
- source_word: מַצְמִיתַי
  choice: जो मुझे मिटा देना चाहते हैं
  rationale: यह सहभागी रूप उन लोगों को दर्शाता है जो वक्ता का विनाश चाहते हैं। ‘मिटा देना’ तीव्रता रखते हुए सामान्य पाठक के लिए स्वाभाविक है।
- source_word: אֹיְבַי שֶׁקֶר
  choice: वे शत्रु जो झूठ के सहारे मेरा विरोध करते हैं
  rationale: שֶׁקֶר शत्रुओं को झूठा/छली बता सकता है या उनके विरोध को झूठा और निराधार ठहरा सकता है। मुख्य पाठ दोनों पहलुओं को यथासंभव खुला रखता है और पादटिप्पणी वास्तविक व्याकरणिक अस्पष्टता बताती है।
- source_word: אֲשֶׁר לֹא גָזַלְתִּי
  choice: जो मैंने नहीं लूटा
  rationale: גזל बलपूर्वक या अन्याय से छीनने/लूटने का बोध देता है; ‘लूटा’ सामान्य ‘चुराया’ से स्रोत शब्द की तीव्रता के अधिक निकट है।
- source_word: אָז אָשִׁיב
  choice: उसे भी मुझे लौटाना पड़ता है
  rationale: शाब्दिक रूप ‘तब मैं लौटाता हूँ/लौटाऊँगा’ है। प्रसंग में निर्दोष वक्ता से अनुचित प्रतिपूर्ति कराने का भाव है; ‘पड़ता है’ इसे स्वाभाविक हिन्दी में व्यक्त करता है, जबकि पादटिप्पणी शाब्दिक विकल्प सुरक्षित रखती है।
theological_decisions:
- issue: שֶׁקֶר का संबंध शत्रुओं के चरित्र से है या उनके निराधार विरोध से
  choice: वे शत्रु जो झूठ के सहारे मेरा विरोध करते हैं
  alternative: मेरे झूठे शत्रु; जो झूठ-मूठ मेरे शत्रु हैं
  rationale: इब्रानी रचना दोनों अर्थों की अनुमति देती है। अनुवाद किसी एक को पूर्णतः निर्णायक न बनाकर झूठ और अन्यायपूर्ण विरोध दोनों का तनाव बनाए रखता है।
- issue: अंतिम उपवाक्य में निर्दोष होते हुए प्रतिपूर्ति की बाध्यता
  choice: जो मैंने नहीं लूटा, उसे भी मुझे लौटाना पड़ता है
  alternative: जो मैंने नहीं लूटा, तब भी मैं उसे लौटाता हूँ/लौटाऊँगा
  rationale: मूल क्रिया केवल ‘मैं लौटाता हूँ/लौटाऊँगा’ कहती है, पर प्रसंग झूठे आरोप के कारण थोपी गई प्रतिपूर्ति का संकेत देता है। मुख्य पाठ प्रासंगिक भाव देता है और पादटिप्पणी मूल की संक्षिप्तता तथा कालगत अस्पष्टता सुरक्षित रखती है।
