base_translation:
  language: en
  yaml_path: translation/ot/psalms/069/020.yaml
  text: Reproach has broken my heart[a], and I am sick; I looked for sympathy, but there was none, and for comforters, but I found none.
translation:
  language: hi
  text: अपमान ने मेरा हृदय तोड़ दिया है, और मैं बीमार हूँ। मैंने सहानुभूति[a] की बाट जोही, पर कोई न था; और सांत्वना देनेवालों की, पर कोई न मिला।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “दया।” इब्रानी शब्द दुःखी व्यक्ति के प्रति करुणापूर्ण सहभागिता दिखाने का भाव रखता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: חֶרְפָּה
  choice: अपमान
  rationale: यह शब्द दूसरों की निन्दा और उससे होनेवाली सार्वजनिक लज्जा—दोनों को व्यक्त कर सकता है। ‘अपमान’ आधुनिक हिन्दी में दोनों पहलुओं को स्वाभाविक रूप से समेटता है।
- source_word: שָׁבְרָה לִבִּי
  choice: ने मेरा हृदय तोड़ दिया है
  rationale: हिब्रू रूप पूर्ण हुई क्रिया के वर्तमान परिणाम को व्यक्त करता है। ‘हृदय तोड़ दिया है’ मूल रूपक और भजन के भावनात्मक प्रभाव को बनाए रखता है।
- source_word: וָאֲנוּשָׁה
  choice: और मैं बीमार पड़ गया हूँ
  rationale: मूल क्रिया गम्भीर रूप से दुर्बल या रोगग्रस्त होने की दशा बताती है। यह अनुवाद बीमारी के भाव को रखता है, पर उसे ‘असाध्य’ कहकर आवश्यकता से अधिक निश्चित नहीं करता।
- source_word: וָאֲקַוֶּה
  choice: मैंने … की आशा की
  rationale: क्रिया का मूल अर्थ आशा करना या प्रतीक्षा करना है। ‘आशा की’ अपेक्षित मानवीय प्रतिक्रिया की बाट जोहने का भाव बनाए रखता है।
- source_word: לָנוּד
  choice: सहानुभूति
  rationale: यहाँ शब्द दुःखी व्यक्ति के प्रति करुणापूर्ण सहभागिता या हमदर्दी दिखाने को सूचित करता है। ‘सहानुभूति’ अगले पदांश के ‘सांत्वना देनेवालों’ से अनावश्यक पुनरावृत्ति भी नहीं करता।
- source_word: וְלַמְנַחֲמִים
  choice: सांत्वना देनेवालों
  rationale: बहुवचन कृदन्त उन व्यक्तियों को दर्शाता है जो दुःखी को ढाढ़स या सांत्वना दें। यह हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: וְלֹא מָצָאתִי
  choice: पर कोई न मिला
  rationale: यह खोजे गए व्यक्तियों के न मिलने को सीधे व्यक्त करता है और पहले समानान्तर पदांश के साथ विलाप की लय बनाए रखता है।
theological_decisions:
- issue: मसीही व्याख्या में भजन का प्रयोग
  choice: पद का अनुवाद पहले उसके इब्रानी विलाप-संदर्भ के अनुसार किया गया है, बिना मुख्य पाठ में स्पष्ट मसीही भाषा जोड़े।
  alternative: इसे मुख्य पाठ में सीधे मसीह के दुःख की भविष्यवाणी के रूप में व्यक्त करना।
  rationale: नया नियम भजन 69 को यीशु से जोड़ता है, फिर भी इस पद का इब्रानी पाठ एक व्यक्ति के विलाप के रूप में अनूदित होना चाहिए। चुनी हुई भाषा बाद की मसीही प्रयुक्ति के अनुकूल रहती है, पर उसे मूल पाठ में आरोपित नहीं करती।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। समानान्तर पदांशों में ‘आशा की’ की पुनरावृत्ति मूल विलाप की संरचना स्पष्ट करती है। पाद-टिप्पणी का चिह्न उसी शब्द पर रखा गया है जिससे उसका शाब्दिक सम्बन्ध है।
