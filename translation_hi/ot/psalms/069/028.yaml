id: PSA.69.28
reference: Psalms 69:28
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: יִ֭מָּחֽוּ מִ/סֵּ֣פֶר חַיִּ֑ים וְ/עִ֥ם צַ֝דִּיקִ֗ים אַל יִכָּתֵֽבוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/069/028.yaml
  text: Let them be blotted out of the book of life[b][a], and let them not be written with the righteous.
translation:
  language: hi
  text: वे जीवन की पुस्तक[a] में से मिटा दिए जाएँ, और धर्मियों के साथ उनके नाम न लिखे जाएँ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जीवितों की पुस्तक।”
    reason: lexical_alternative
lexical_decisions:
- source_word: יִמָּחוּ
  choice: मिटा दिए जाएँ
  rationale: निफ़ाल अपूर्ण रूप यहाँ अभिशापात्मक प्रार्थना में इच्छासूचक है। निष्क्रिय वाक्यांश मूल भाव और पुस्तक में लिखे नाम मिटाने की छवि दोनों को बनाए रखता है।
- source_word: מִסֵּפֶר
  choice: पुस्तक में से
  rationale: סֵפֶר लिखित पुस्तक, ग्रंथ या सूची को सूचित कर सकता है। यहाँ 'पुस्तक' स्वाभाविक है और आगे के 'लिखे जाएँ' के साथ रूपक को बनाए रखता है।
- source_word: חַיִּים
  choice: जीवन की
  rationale: חַיִּים का अर्थ 'जीवन' अथवा 'जीवित लोग' हो सकता है। मुख्य पाठ में प्रचलित किंतु अर्थ की दृष्टि से खुला पदबंध 'जीवन की पुस्तक' रखा गया है; वैकल्पिक अर्थ पादटिप्पणी में है।
- source_word: וְעִם
  choice: और धर्मियों के साथ
  rationale: עִם का मूल अर्थ 'साथ' है। यह उन लोगों के साथ एक ही लेखे या सूची में सम्मिलित किए जाने की संगति व्यक्त करता है।
- source_word: צַדִּיקִים
  choice: धर्मियों
  rationale: यह बहुवचन संज्ञात्मक विशेषण है। 'धर्मी' आधुनिक हिन्दी में नैतिक और वाचागत श्रेणी को बिना अतिरिक्त व्याख्या के व्यक्त करता है।
- source_word: אַל יִכָּתֵבוּ
  choice: उनके नाम न लिखे जाएँ
  rationale: אַל के साथ निफ़ाल अपूर्ण रूप नकारात्मक इच्छा या याचना व्यक्त करता है। हिन्दी में स्पष्ट और स्वाभाविक पुस्तक-रूपक के लिए निहित कर्ता को 'उनके नाम' के रूप में व्यक्त किया गया है।
theological_decisions:
- issue: '''जीवन की पुस्तक'' का अभिप्राय'
  choice: रूपक को बिना परिभाषित किए 'जीवन की पुस्तक' रखा गया
  alternative: '''जीवितों की पुस्तक'', सांसारिक जीवन का लेखा, या अंतिम उद्धार का दिव्य लेखा'
  rationale: इब्रानी पदबंध इन अर्थों की ओर संकेत कर सकता है, पर इस पद में किसी एक धर्मवैज्ञानिक व्याख्या को निर्णायक नहीं बनाता।
- issue: अभिशापात्मक कथन का बल
  choice: इच्छा/याचना के रूप में 'मिटा दिए जाएँ ... न लिखे जाएँ'
  alternative: भविष्यवाणी के रूप में 'मिटा दिए जाएँगे'
  rationale: संदर्भ और क्रियारूप इच्छासूचक अभिशापात्मक प्रार्थना का समर्थन करते हैं, न कि साधारण भविष्यवाणी का।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। 'उनके नाम' मूल में स्पष्ट रूप से नहीं है, पर 'पुस्तक में लिखे जाने' की हिन्दी अभिव्यक्ति को स्वाभाविक बनाता है और आशय को संकीर्ण नहीं करता।
