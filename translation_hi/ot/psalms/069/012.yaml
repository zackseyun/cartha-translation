  text: Those who sit in the gate talk about me[b][a], and I am the song of those who drink strong drink.
translation:
  language: hi
  text: जो नगर-द्वार पर बैठते हैं, वे मेरे बारे में बातें करते हैं[a]; और मैं मादक पेय पीने वालों का गीत हूँ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: प्राचीन नगर में द्वार सार्वजनिक जीवन और न्याय का प्रमुख स्थान था; इसलिए यहाँ आशय संभवतः केवल द्वारपालों से नहीं, बल्कि सार्वजनिक रूप से प्रभावशाली लोगों द्वारा की गई चर्चा या उपहास से है।
    reason: cultural_note
lexical_decisions:
- source_word: יָשִׂיחוּ בִי
  choice: मेरे बारे में बातें करते हैं
  rationale: שׂיח यहाँ शत्रुतापूर्ण सामाजिक संदर्भ में मनन के बजाय चर्चा या बातचीत को व्यक्त करता है। בִי उस बातचीत का विषय बताता है; इसलिए ‘मेरे बारे में’ स्वाभाविक है और ‘मेरे विरुद्ध’ जैसी अतिरिक्त व्याख्या नहीं जोड़ता।
- source_word: יֹשְׁבֵי שָׁעַר
  choice: जो नगर-द्वार पर बैठते हैं
  rationale: शाब्दिक चित्र को बनाए रखते हुए ‘नगर-द्वार’ प्राचीन नगर के सार्वजनिक और न्यायिक स्थल की ओर संकेत करता है। इससे इसे केवल द्वारपालों या पुरनियों तक सीमित नहीं किया गया।
- source_word: וּנְגִינוֹת
  choice: और मैं ... का गीत बन गया हूँ
  rationale: संज्ञा का अर्थ गीत या संगीत है। समानांतर पंक्ति से आशय है कि भजनकार उनके गाने का विषय बन गया; हिन्दी में निहित विधेय को स्पष्ट करने के लिए ‘मैं ... गीत बन गया हूँ’ स्वाभाविक है।
- source_word: שֹׁתֵי שֵׁכָר
  choice: नशीला पेय पीनेवाले
  rationale: שֵׁכָר दाखमधु से अलग किसी मादक पेय को दर्शाता है। ‘नशीला पेय’ आधुनिक हिन्दी में स्पष्ट है और ‘शराबी’ कहकर उनकी अवस्था को मूल से अधिक निश्चित नहीं करता।
