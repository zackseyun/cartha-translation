source:
  edition: WLC
  text: הוֹשִׁיעֵ֥/נִי אֱלֹהִ֑ים כִּ֤י בָ֖אוּ מַ֣יִם עַד נָֽפֶשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/069/001.yaml
  text: Save me[a], O God, for the waters have come up to my neck.
translation:
  language: hi
  text: हे परमेश्वर, मुझे बचा ले[a], क्योंकि पानी मेरी गर्दन तक आ पहुँचा है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “मेरे प्राण तक।” हिब्रू नेफ़ेश का अर्थ “प्राण,” “जीवन,” “स्वयं,” और ऐसे प्रसंग में “गला/गर्दन” भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹשִׁיעֵנִי
  choice: मुझे बचा ले
  rationale: ישׁע के हिफ़ील आज्ञार्थक रूप और प्रथम पुरुष एकवचन प्रत्यय से संकट में सीधे उद्धार की पुकार व्यक्त होती है। ‘मुझे बचा ले’ आधुनिक हिन्दी में स्वाभाविक, स्पष्ट और प्रार्थनापरक है।
- source_word: אֱלֹהִים
  choice: हे परमेश्वर
  rationale: यह प्रत्यक्ष सम्बोधन है। ‘हे परमेश्वर’ हिन्दी की गरिमापूर्ण प्रार्थना-भाषा में सम्बोधन को स्पष्ट करता है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यह बचाने की पुकार का कारण बताता है; ‘क्योंकि’ आधुनिक हिन्दी में सीधा और स्वाभाविक है।
- source_word: בָאוּ מַיִם
  choice: पानी ... आ पहुँचा है
  rationale: बहुवचन रूप מַיִם का हिन्दी में सामान्य समतुल्य ‘पानी’ व्याकरणतः एकवचन है। ‘आ पहुँचा है’ उस निकट और चरम संकट को व्यक्त करता है जिसमें पानी निर्दिष्ट सीमा तक पहुँच गया है।
- source_word: עַד נָפֶשׁ
  choice: मेरी गर्दन तक
  rationale: נֶפֶשׁ का मूल अर्थ-क्षेत्र ‘प्राण/जीवन/स्वयं’ है और शरीरगत प्रयोग में गला या गर्दन भी सूचित हो सकता है। डूबने के इस बिंब में ‘गर्दन तक’ सहज अर्थ देता है; शाब्दिक विकल्प पादटिप्पणी में सुरक्षित है।
theological_decisions:
- issue: काव्यात्मक संकट-बिंब में נֶפֶשׁ का अर्थ
  choice: डूबने के बिंब के भीतर शरीरगत अर्थ ‘गर्दन’
  alternative: अधिक शाब्दिक ‘मेरे प्राण तक’ अथवा व्यापक ‘मेरे जीवन तक’
  rationale: यहाँ मुख्य बात आत्मा के स्वरूप पर कोई सिद्धान्त देना नहीं, बल्कि जीवन को निगलने वाले निकट संकट का सजीव चित्र खींचना है। फिर भी हिब्रू शब्द की व्यापक अर्थ-छाया पादटिप्पणी में रखी गई है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘हे परमेश्वर’ प्रार्थनापरक सम्बोधन को बनाए रखता है, जबकि ‘पानी मेरी गर्दन तक आ पहुँचा है’ संकट के काव्यात्मक बिंब को सामान्य पाठक के लिए तुरंत बोधगम्य बनाता है।
