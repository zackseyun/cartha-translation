base_translation:
  language: en
  yaml_path: translation/ot/psalms/069/033.yaml
  text: For Yahweh hears the needy[a], and he does not despise his prisoners.
translation:
  language: hi
  text: 'क्योंकि यहोवा ज़रूरतमंदों की सुनता है,

    और अपने बंदियों[a] को तुच्छ नहीं समझता।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “अपने कैदियों।” इब्रानी शब्द कैद या बंधन में रखे गए लोगों के लिए व्यापक अर्थ में प्रयुक्त हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले आह्वान का कारण बताता है और इब्रानी के कारणसूचक बल को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: שֹׁמֵעַ אֶל
  choice: की सुनता है
  rationale: यह प्रार्थना या पुकार सुनने और उस पर ध्यान देने—दोनों की अर्थछाया रखता है; वर्तमान काल सामान्य और निरंतर सत्य व्यक्त करता है।
- source_word: אֶבְיוֹנִים
  choice: ज़रूरतमंदों
  rationale: यह आर्थिक अभाव सहित व्यापक असहायता को व्यक्त करता है और अर्थ को केवल निर्धनता तक सीमित नहीं करता।
- source_word: יְהוָה
  choice: यहोवा
  rationale: इब्रानी में आए परमेश्वर के व्यक्तिगत वाचा-नाम को हिन्दी में प्रचलित रूप से प्रत्यक्ष प्रस्तुत करता है।
- source_word: אֲסִירָיו
  choice: अपने बंदियों
  rationale: अर्थ 'बंदी/कैदी' है और तृतीय पुरुष एकवचन संबंधसूचक प्रत्यय को हिन्दी के स्वाभाविक निजवाचक 'अपने' से सुरक्षित रखा गया है।
- source_word: לֹא בָזָה
  choice: तुच्छ नहीं समझता
  rationale: इब्रानी क्रिया के अवमानना या घृणापूर्वक कमतर मानने के भाव को स्वाभाविक हिन्दी में व्यक्त करता है; सामान्य सत्य के लिए वर्तमान काल रखा गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ के विशिष्ट ईश्वरीय नाम को उपाधि में बदलने के बजाय हिन्दी पाठकों के बीच प्रचलित लिप्यंतरण से रखा गया है।
- issue: אֲסִירָיו में संबंधसूचक प्रत्यय
  choice: अपने बंदियों
  alternative: बंदियों
  rationale: मूल के 'उसके बंदी' संबंध को बनाए रखा गया है, पर यह तय नहीं किया गया कि वे किस अर्थ में यहोवा के हैं या उनके बंधन का स्वरूप क्या है।
- issue: पूर्ण क्रिया בָזָה का कालगत अर्थ
  choice: तुच्छ नहीं समझता
  alternative: तुच्छ नहीं समझा
  rationale: समानांतर कृदंत 'सुनता है' और कथन के सामान्य सत्य वाले काव्यात्मक संदर्भ के कारण वर्तमानकालिक अर्थ चुना गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और काव्यात्मक रूप। 'की सुनता है' सामान्य बोलचाल और प्रार्थना-संदर्भ दोनों में स्वाभाविक है; पंक्ति-विभाजन इब्रानी समानांतरता को स्पष्ट करता है।
