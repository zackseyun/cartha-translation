revisions:
- from: परन्तु हे याहवे, मेरी प्रार्थना तुझसे है—अनुग्रह के समय[a]। हे परमेश्वर, अपनी अपार अटल करुणा के अनुसार, अपने उद्धार की सच्चाई[b] में मुझे उत्तर दे।
  to: परन्तु मैं, हे याहवे, अनुकूल समय पर तुझसे प्रार्थना करता हूँ। हे परमेश्वर, तेरे अटल प्रेम की बहुतायत के अनुसार, तेरे उद्धार की सच्चाई में मुझे उत्तर दे।
  rationale: The translation is revised only where needed for source precision and natural modern Hindi. “अनुकूल समय” captures the temporal force of עֵת רָצוֹן, and the prayer is expressed with an idiomatic Hindi verb while retaining the emphatic “परन्तु मैं.” The clauses concerning God’s abundant steadfast love and the truth/faithfulness of salvation retain the Hebrew’s parallel basis/instrumental phrasing and its lexical ambiguity.
  reviewer_model: gpt-5.6-terra
