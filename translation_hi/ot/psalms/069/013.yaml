language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/אֲנִ֤י תְפִלָּתִֽ/י לְ/ךָ֨ יְהוָ֡ה עֵ֤ת רָצ֗וֹן אֱלֹהִ֥ים בְּ/רָב חַסְדֶּ֑/ךָ עֲ֝נֵ֗/נִי בֶּ/אֱמֶ֥ת יִשְׁעֶֽ/ךָ־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/069/013.yaml
  text: But as for me[a], my prayer is to you, O Yahweh, at a time of favor; O God, in the abundance of your steadfast love[b], answer me in the truth of your salvation.
translation:
  language: hi
  text: परन्तु मैं, हे याहवे, अनुकूल समय पर तुझसे प्रार्थना करता हूँ। हे परमेश्वर, तेरे अटल प्रेम की बहुतायत के अनुसार, तेरे उद्धार की सच्चाई में मुझे उत्तर दे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַאֲנִי
  choice: परन्तु … मेरी
  rationale: संयोजक और स्वतंत्र सर्वनाम पिछले संदर्भ के विपरीत भजनकार पर बल देते हैं। हिन्दी में ‘परन्तु … मेरी प्रार्थना’ इस विरोध और बल को स्वाभाविक रूप से व्यक्त करता है।
- source_word: תְפִלָּתִי לְךָ
  choice: मेरी प्रार्थना तुझसे है
  rationale: शाब्दिक संज्ञात्मक रचना और प्रार्थना की दिशा/सम्बोधन दोनों सुरक्षित रहते हैं।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम का देवनागरी लिप्यंतरण है; इसे किसी उपाधि से नहीं बदला गया।
- source_word: עֵת רָצוֹן
  choice: अनुग्रह के समय
  rationale: यह पदबंध परमेश्वर के सुनने और कार्य करने के अनुकूल अथवा स्वीकार्य समय को दर्शाता है।
- source_word: בְּרָב חַסְדֶּךָ
  choice: अपनी अपार अटल करुणा के अनुसार
  rationale: חסד में स्थिर, निष्ठावान प्रेम और करुणा का भाव है; ‘अटल करुणा’ इसे संक्षेप और सहज हिन्दी में व्यक्त करती है। בְּרָב को उत्तर के आधार के रूप में ‘के अनुसार’ कहा गया है।
- source_word: עֲנֵנִי
  choice: मुझे उत्तर दे
  rationale: प्रार्थना के प्रसंग में क्रिया का सीधा और स्वाभाविक अर्थ यही है।
- source_word: בֶּאֱמֶת יִשְׁעֶךָ
  choice: अपने उद्धार की सच्चाई में
  rationale: אמת के ‘सत्य/सच्चाई’ और ‘विश्वसनीयता/निष्ठा’ दोनों आयाम सम्भव हैं। मुख्य पाठ निकट रूप से ‘सच्चाई’ रखता है और दूसरे अर्थ को पाद-टिप्पणी में सुरक्षित करता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में व्यक्तिगत ईश्वरीय नाम है। ‘याहवे’ उसका लिप्यंतरण करता है और उसे उपाधि से प्रतिस्थापित नहीं करता।
- issue: אֱמֶת का उद्धार से सम्बन्ध
  choice: उद्धार की सच्चाई
  alternative: उद्धार की विश्वसनीयता / निष्ठा
  rationale: इब्रानी शब्द सत्यता और विश्वसनीयता दोनों व्यक्त कर सकता है। मुख्य पाठ ‘सच्चाई’ रखता है, जबकि पाद-टिप्पणी प्रसंगतः सम्भव ‘विश्वसनीयता’ को स्पष्ट करती है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, प्रार्थनात्मक और सहज रूप रखा गया है। परमेश्वर को निकट, एकवचन सम्बोधन के अनुरूप ‘तुझसे/अपनी/मुझे’ प्रयोग हुए हैं। विराम-चिह्न इब्रानी वाक्य की दो सम्बोधन-इकाइयों को स्पष्ट करते हैं, बिना उसकी अर्थगत सम्भावनाओं को मिटाए।
