base_translation:
  language: en
  yaml_path: translation/ot/psalms/069/026.yaml
  text: For they persecute the one you struck[a], and they recount the pain of those you wounded.
translation:
  language: hi
  text: 'क्योंकि जिसे तूने आहत किया है, वे उसका पीछा करते हैं;

    और जिन्हें तूने घायल किया है[a], उनकी पीड़ा का वर्णन करते हैं।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तेरे मारे हुए” अथवा “तेरे बेधे हुए।” इब्रानी शब्द घायल, बेधे हुए, या मारे गए लोगों को सूचित कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले कथन के कारण को प्रस्तुत करता है और इब्रानी के कारणवाचक बल को स्वाभाविक हिंदी में बनाए रखता है।
- source_word: אַתָּה אֲשֶׁר הִכִּיתָ
  choice: जिसे तूने मारा है
  rationale: इब्रानी में कर्म एकवचन और निहित है; हिंदी में ‘जिसे’ उसे स्पष्ट करते हुए एकवचन संदर्भ सुरक्षित रखता है।
- source_word: רָדָפוּ
  choice: वे उसका पीछा करते हैं
  rationale: यह רדף का सीधा अर्थ रखता है; संदर्भ से पीछा करने की शत्रुतापूर्ण प्रकृति स्पष्ट होती है, इसलिए अर्थ को अनावश्यक रूप से अधिक विशिष्ट नहीं किया गया।
- source_word: וְאֶל
  choice: और … की
  rationale: אֶל यहाँ उस विषय की ओर संकेत करता है जिसके बारे में वे बताते हैं; हिंदी में संबंधसूचक रचना से भाव स्वाभाविक रूप में व्यक्त होता है।
- source_word: מַכְאוֹב
  choice: पीड़ा
  rationale: यह शारीरिक या मानसिक दुख दोनों को समेटने वाला सीधा और काव्यात्मक हिंदी समतुल्य है।
- source_word: חֲלָלֶיךָ
  choice: जिन्हें तूने घायल किया है
  rationale: शब्द छेदे या घायल किए गए लोगों को सूचित कर सकता है और कभी-कभी मारे गए लोगों को भी। मुख्य पाठ में ‘घायल’ निकटवर्ती ‘पीड़ा’ के साथ सहज है; वैकल्पिक अर्थ पाद-टिप्पणी में रखा गया है।
- source_word: יְסַפֵּרוּ
  choice: बखान करते हैं
  rationale: Piel रूप का अर्थ बताना या विस्तार से वर्णन करना है। ‘बखान’ काव्यात्मक संदर्भ में उनके द्वारा पीड़ा को बार-बार बयान करने का भाव व्यक्त करता है, बिना उनकी ठीक मनोवृत्ति निश्चित किए।
theological_decisions:
- issue: חֲלָלֶיךָ का अर्थ ‘घायल किए हुए’ है या ‘मारे हुए’
  choice: जिन्हें तूने घायल किया है
  alternative: तेरे मारे हुए लोग / जिन्हें तूने बेधा है
  rationale: ‘पीड़ा’ के साथ जीवित घायल लोगों का अर्थ संदर्भ में अधिक सहज है, पर इब्रानी शब्द मारे गए या बेधे गए लोगों को भी सूचित कर सकता है। इस तनाव को पाद-टिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण काव्यात्मक हिंदी अपनाई गई है। परमेश्वर के लिए ‘तू’ भजन-साहित्य के प्रत्यक्ष संबोधन और मूल के एकवचन रूप के अनुरूप है। समानांतर पंक्तियों में एकवचन ‘जिसे’ और बहुवचन ‘जिन्हें’ का अंतर मूल पाठ के अनुसार बनाए रखा गया है।
