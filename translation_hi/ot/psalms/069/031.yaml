  text: וְ/תִיטַ֣ב לַֽ֭/יהוָה מִ/שּׁ֥וֹר פָּ֗ר מַקְרִ֥ן מַפְרִֽיס׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/069/031.yaml
  text: And it will please Yahweh more than an ox[a], a bull with horns and split hooves.
translation:
  language: hi
  text: और यह यहोवा को एक बैल, अर्थात् सींगों और चिरे हुए खुर वाले साँड़, से भी अधिक प्रसन्न करेगा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְתִיטַב
  choice: और यह ... अधिक प्रसन्न करेगा
  rationale: Qal अपूर्ण 3 स्त्रीलिंग एकवचन का कर्ता पिछले पद में उल्लिखित स्तुति/धन्यवाद है। מן के साथ तुलनात्मक भाव को स्वाभाविक हिन्दी में ‘अधिक प्रसन्न करेगा’ से व्यक्त किया गया है।
- source_word: לַיהוָה
  choice: यहोवा को
  rationale: प्रत्यक्ष ईश्वरीय नाम יהוה को हिन्दी में प्रचलित लिप्यंतरण ‘यहोवा’ के रूप में रखा गया है, न कि उपाधि ‘प्रभु’ से बदला गया है।
- source_word: מִשּׁוֹר
  choice: बैल से भी अधिक
  rationale: מן यहाँ तुलना सूचित करता है। שׁוֹר के लिए सामान्य और स्पष्ट हिन्दी शब्द ‘बैल’ चुना गया है।
- source_word: פָּר
  choice: उस साँड़ से
  rationale: פָּר नर गोवंश, अर्थात साँड़, को निर्दिष्ट करता है। שׁוֹר और פָּר दोनों को रखते हुए हिब्रू की पुनर्निर्देशक समानाधिकरण संरचना को स्पष्ट किया गया है।
- source_word: מַקְרִן
  choice: जिसके सींग ... हैं
  rationale: क्रियाविशेषणात्मक/कृदन्त रूप पशु को सींगों वाला बताता है; यह हिन्दी में सहज वर्णन है।
- source_word: מַפְרִיס
  choice: चिरे हुए खुर
  rationale: פרס का भाव खुर चीरने या विभाजित खुर होने का है। ‘चिरे हुए खुर’ आधुनिक पाठक के लिए स्पष्ट है और बलि-योग्य शुद्ध पशु का वर्णन बनाए रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: याहवे / प्रभु
  rationale: मूल में वाचा-संबंधी विशिष्ट नाम प्रत्यक्ष रूप से आया है। हिन्दी की परिचित बाइबलीय वर्तनी ‘यहोवा’ नाम को नाम ही रहने देती है; उसे सामान्य उपाधि में नहीं बदलती।
- issue: स्तुति और पशुबलि की तुलना
  choice: स्तुति यहोवा को पूर्ण बलि-योग्य साँड़ से अधिक प्रसन्न करेगी
  alternative: स्तुति साँड़ से बेहतर होगी
  rationale: מן के साथ יטב का सन्दर्भ यहोवा को प्रसन्न करने से है। इससे तुलना का लक्ष्य स्पष्ट होता है, पर पद को बलि के सार्वभौमिक निषेध के रूप में नहीं बढ़ाया गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। डैश हिब्रू के שׁוֹר פָּר में दूसरे पशु-पद को पहले की व्याख्या/विशेषीकरण के रूप में दिखाता है। कोई पादटिप्पणी आवश्यक नहीं मानी गई, क्योंकि मुख्य पाठ में तुलना और समानाधिकरण दोनों स्पष्ट हैं।
