  text: For God will save Zion and build the cities of Judah[b][a], and they will dwell there and possess it.
translation:
  language: hi
  text: 'क्योंकि परमेश्वर सिय्योन को बचाएगा

    और यहूदा के नगरों को बनाएगा;

    लोग वहाँ बसेंगे

    और उसे अपने अधिकार में लेंगे।[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी क्रिया का अर्थ “उसे विरासत में लेंगे” या “उस पर अधिकार करेंगे” भी हो सकता है। “उसे” के लिए मूल पाठ में स्त्रीलिंग एकवचन प्रत्यय है, जो संभवतः सिय्योन अथवा मानवीकृत भूमि की ओर संकेत करता है।
    reason: lexical_alternative_and_ambiguous_referent
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पद पिछले कथन के आधार या आश्वासन को प्रस्तुत करता है; इसलिए व्याख्यात्मक संबंध को स्वाभाविक हिन्दी में व्यक्त किया गया है।
- source_word: אֱלֹהִים
  choice: परमेश्वर
  rationale: एकवचन क्रिया के कारण यहाँ इस्राएल के परमेश्वर का एकवचन अर्थ है।
- source_word: יוֹשִׁיעַ
  choice: बचाएगा
  rationale: हिफ़ील रूप का अर्थ ‘बचाना/छुड़ाना’ है; प्रतिज्ञा के इस प्रसंग में भविष्यकाल उपयुक्त है।
- source_word: צִיּוֹן
  choice: सिय्योन
  rationale: स्थान और धार्मिक समुदाय से जुड़ा व्यक्तिवाचक नाम होने के कारण इसका प्रचलित हिन्दी लिप्यंतरण रखा गया है।
- source_word: וְיִבְנֶה
  choice: और ... बनाएगा
  rationale: בנה का मूल अर्थ ‘बनाना/निर्माण करना’ है। ‘फिर से बसाएगा’ या ‘पुनर्निर्माण करेगा’ जैसी पुनरावृत्ति मूल क्रिया में स्पष्ट नहीं है।
- source_word: עָרֵי יְהוּדָה
  choice: यहूदा के नगरों
  rationale: इब्रानी समास का सीधा और स्वाभाविक हिन्दी रूप।
- source_word: וְיָשְׁבוּ
  choice: लोग ... बसेंगे
  rationale: ישׁב यहाँ स्थायी निवास या बसने का भाव देता है। इब्रानी में कर्ता अंतर्निहित बहुवचन है, जिसे हिन्दी की स्पष्टता के लिए ‘लोग’ से व्यक्त किया गया है।
- source_word: שָׁם
  choice: वहाँ
  rationale: यह सिय्योन और यहूदा के अभी उल्लिखित नगरों की ओर संकेत करने वाला स्थानवाचक क्रियाविशेषण है।
- source_word: וִירֵשׁוּהָ
  choice: और उसके अधिकारी होंगे
  rationale: ירשׁ भूमि के उत्तराधिकार, स्वामित्व या अधिकार ग्रहण करने का भाव दे सकता है। ‘अधिकारी होंगे’ इस अर्थ-क्षेत्र को संक्षेप में रखता है और ‘उसके’ द्वारा मूल के स्त्रीलिंग एकवचन प्रत्यय का संदर्भ अनावश्यक रूप से निश्चित नहीं करता।
theological_decisions:
- issue: וִירֵשׁוּהָ में स्त्रीलिंग एकवचन प्रत्यय का संदर्भ
  choice: ‘उसके अधिकारी होंगे’ द्वारा संदर्भ को खुला रखा गया है।
  alternative: ‘सिय्योन के अधिकारी होंगे’, ‘उस भूमि को अपने अधिकार में लेंगे’, या ‘उसे विरासत में पाएँगे’।
  rationale: मूल इब्रानी प्रत्यय स्त्रीलिंग एकवचन है और संभवतः सिय्योन अथवा मानवीकृत भूमि/नगरीय क्षेत्र की ओर संकेत करता है। मुख्य पाठ किसी एक संदर्भ को अंतिम रूप से नहीं बाँधता; पादटिप्पणी व्याकरणिक और शब्दार्थगत विकल्प स्पष्ट करती है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी। काव्यात्मक पंक्ति-विन्यास रखा गया है। ‘बचाएगा’, ‘बसेंगे’ और ‘अधिकारी होंगे’ सामान्य पाठक के लिए बोधगम्य हैं, जबकि मूल के भूमि-अधिकार और संभावित उत्तराधिकार के भाव को पादटिप्पणी में सुरक्षित रखा गया है।
