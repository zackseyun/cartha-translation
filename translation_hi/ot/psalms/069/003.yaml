  text: पुकारते-पुकारते मैं थक गया हूँ; मेरा गला सूख गया है[a]। अपने परमेश्वर की बाट जोहते-जोहते मेरी आँखें धुंधली पड़ गई हैं।
  philosophy: optimal-equivalence
