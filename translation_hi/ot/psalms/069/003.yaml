    reason: lexical_alternative
lexical_decisions:
- source_word: יָגַעְתִּי
  choice: मैं थक गया हूँ
  rationale: यह पूर्ण हो चुकी क्रिया से उत्पन्न वर्तमान थकावट को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: בְקָרְאִי
  choice: पुकारते-पुकारते
  rationale: यहाँ קרא सहायता के लिए लगातार पुकारने को दर्शाता है; पुनरुक्ति दीर्घ और बार-बार की गई पुकार को सहज हिन्दी में सामने लाती है।
- source_word: נִחַר גְּרוֹנִי
  choice: मेरा गला सूख गया है
  rationale: נחר में गर्म, शुष्क या झुलसे होने का भाव है; गले के संदर्भ में यह अनुवाद मूल शारीरिक बिंब को स्पष्ट और स्वाभाविक रूप से रखता है।
- source_word: כָּלוּ עֵינַי
  choice: मेरी आँखें पथरा गई हैं
  rationale: כלה के समाप्त, चुक या निष्फल हो जाने के भाव को लम्बी प्रतीक्षा से थकी आँखों के लिए प्रचलित हिन्दी मुहावरे द्वारा व्यक्त किया गया है।
- source_word: מְיַחֵל לֵאלֹהָי
  choice: अपने परमेश्वर की बाट जोहते-जोहते
  rationale: יחל प्रतीक्षा और आशापूर्ण अपेक्षा दोनों व्यक्त कर सकता है। ‘बाट जोहना’ अपेक्षापूर्ण प्रतीक्षा को दर्शाता है और לֵאלֹהָי को उसके लक्ष्य के रूप में सुरक्षित रखता है।
theological_decisions:
- issue: מְיַחֵל में प्रतीक्षा और आशा का संबंध
  choice: अपने परमेश्वर की बाट जोहते-जोहते
  alternative: अपने परमेश्वर पर आशा रखते-रखते
  rationale: मूल क्रिया दोनों अर्थों को समेट सकती है। मुख्य पाठ में कालगत प्रतीक्षा को प्रमुख रखा गया है, जबकि पादटिप्पणी आशा के वैकल्पिक पक्ष को सुरक्षित रखती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘पुकारते-पुकारते’ और ‘बाट जोहते-जोहते’ निरन्तरता तथा विलाप की तीव्रता व्यक्त करते हैं; ‘आँखें पथरा गई हैं’ शारीरिक थकान के काव्यात्मक बिंब को स्वाभाविक हिन्दी में प्रस्तुत करता है।
