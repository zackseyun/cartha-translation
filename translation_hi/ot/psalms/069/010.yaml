  text: When I wept with fasting in my soul[b][a], it became a reproach to me.
translation:
  language: hi
  text: जब मैं अपनी आत्मा को उपवास से दुःखी करके रोया[a], तो यह मेरे लिए निन्दा का कारण बन गया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से ‘मैं उपवास में रोया, मेरी आत्मा/मेरे प्राण’ है। इस संक्षिप्त पदबंध को ‘मैं उपवास रखकर रोया’ या ‘मैंने उपवास करके अपने आप को दुःखी (या दीन) किया’ भी समझा जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶבְכֶּה
  choice: जब मैं…रोया
  rationale: בכה का अर्थ ‘रोना’ है। आरम्भिक ו को अगले खंड के परिणाम से जोड़ते हुए हिन्दी में स्वाभाविक कालवाचक रचना ‘जब…तो’ अपनाई गई है।
- source_word: בַצּוֹם
  choice: उपवास करते हुए
  rationale: צוֹם ‘उपवास’ को दर्शाता है और ב यहाँ साथ-साथ होने की परिस्थिति बताता है। ‘उपवास करते हुए’ आधुनिक हिन्दी में स्वाभाविक है।
- source_word: נַפְשִׁי
  choice: अपने अंतर में
  rationale: נֶפֶשׁ का अर्थ प्रसंगानुसार ‘प्राण,’ ‘आत्मा,’ ‘स्वयं’ या आन्तरिक व्यक्तित्व हो सकता है। ‘अपने अंतर में’ आन्तरिक शोक को व्यक्त करते हुए इस शब्द को मुख्य पाठ में बनाए रखता है; अन्य सम्भावनाएँ पाद-टिप्पणी में दी गई हैं।
- source_word: וַתְּהִי
  choice: तो यह…बन गया
  rationale: היה यहाँ पिछली क्रिया के परिणामस्वरूप उत्पन्न दशा को बताता है। ‘यह’ उपवास सहित रोने की पूरी घटना की ओर संकेत करता है।
- source_word: לַחֲרָפוֹת
  choice: निन्दा का कारण
  rationale: חֲרָפוֹת रूप की दृष्टि से बहुवचन है और अपमान/निन्दा को दर्शाता है। हिन्दी में ‘निन्दा का कारण’ उस भाव को स्वाभाविक ढंग से व्यक्त करता है कि उसके इस आचरण के कारण लोग उसे अपमानित करने लगे।
- source_word: לִי
  choice: मेरे लिए
  rationale: ל प्रभावित व्यक्ति को चिह्नित करता है; इस वाक्य-विन्यास में ‘मेरे लिए’ सीधा और स्वाभाविक अनुवाद है।
theological_decisions:
- issue: נַפְשִׁי और उपवास का वाक्यगत सम्बन्ध
  choice: ‘अपने अंतर में रोया’ के रूप में आन्तरिक क्षेत्र से जोड़ा गया
  alternative: ‘उपवास से अपने प्राण को दीन किया’ अथवा शाब्दिक रूप से ‘उपवास में मेरी आत्मा’
  rationale: इब्रानी पदबंध संक्षिप्त और कुछ हद तक अस्पष्ट है। मुख्य पाठ किसी अप्रकट क्रिया (‘दीन किया’) को निश्चित मानकर नहीं जोड़ता, जबकि पाद-टिप्पणी वैकल्पिक समझ को सुरक्षित रखती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘अपने अंतर में’ ने נַפְשִׁי को हटाए बिना अत्यधिक अस्वाभाविक शाब्दिक रचना से बचाया है; मूल की व्याकरणिक अस्पष्टता पाद-टिप्पणी में संरक्षित है।
