base_translation:
  language: en
  yaml_path: translation/ot/psalms/069/018.yaml
  text: Come near to my soul[a]; redeem it. Because of my enemies[b], ransom me.
translation:
  language: hi
  text: 'मेरे प्राण के निकट आ, और उसे छुड़ा ले।


    मेरे शत्रुओं के कारण मुझे मुक्त कर।[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मेरे शत्रुओं के निमित्त मुझे मुक्त कर।” हिब्रू पदबंध को इस प्रकार भी समझा जा सकता है; संदर्भ में उसका आशय संभवतः शत्रुओं के कारण, अर्थात् उनके द्वारा उत्पन्न संकट के कारण, है।
    reason: lexical_alternative
lexical_decisions:
- source_word: קָרְבָה
  choice: निकट आ
  rationale: קרב का काल इम्पेरेटिव रूप परमेश्वर से सीधे निकट आने की विनती है; ‘निकट आ’ स्वाभाविक और गरिमापूर्ण हिन्दी है।
- source_word: נַפְשִׁי
  choice: मेरे प्राण
  rationale: נפשׁ यहाँ व्यक्ति के प्राण, जीवन या स्वयं को सूचित कर सकता है। ‘मेरे प्राण’ हिब्रू अभिव्यक्ति और उसके भावात्मक स्वर को बनाए रखता है।
- source_word: גְאָלָהּ
  choice: उसे छुड़ा ले
  rationale: גאל में छुड़ाने या मुक्त कराने का भाव है; स्त्रीलिंग प्रत्यय का संदर्भ נפשׁ से है, इसलिए ‘उसे’ वस्तु-संबंध बनाए रखता है।
- source_word: לְמַעַן
  choice: के कारण
  rationale: इस संदर्भ में शत्रु विनती का कारण या परिस्थिति हैं; ‘के कारण’ यह अर्थ स्पष्ट करता है, जबकि ‘के निमित्त’ वाली संभावित अधिक शाब्दिक समझ टिप्पणी में रखी गई है।
- source_word: אֹיְבַי
  choice: मेरे शत्रुओं
  rationale: बहुवचन संज्ञा और प्रथम पुरुष एकवचन संबंधसूचक प्रत्यय का सीधा और प्रचलित अनुवाद।
- source_word: פְּדֵנִי
  choice: मुझे मुक्त कर
  rationale: פדה का अर्थ छुड़ाना, दाम देकर मुक्त करना या बचाना हो सकता है। ‘मुक्त कर’ पहले प्रयुक्त גאל से हिन्दी में भिन्नता रखते हुए उद्धार का व्यापक भाव देता है और किसी विशिष्ट प्रायश्चित्त-सिद्धान्त को अनावश्यक रूप से आरोपित नहीं करता।
theological_decisions:
- issue: גאל और פדה—दो संबंधित मुक्ति-क्रियाओं की भिन्नता
  choice: גאל के लिए ‘छुड़ा ले’ और פדה के लिए ‘मुक्त कर’
  alternative: दोनों का ‘छुड़ा ले’ अनुवाद करना, अथवा פדה के लिए ‘फिरौती देकर छुड़ा’ कहना
  rationale: अलग हिन्दी क्रियाएँ मूल की काव्यात्मक पुनरुक्ति और सूक्ष्म भिन्नता बचाती हैं। ‘मुक्त कर’ פדה के अर्थ-क्षेत्र को व्यक्त करता है, पर इस पद में भुगतान या विकसित प्रायश्चित्त-सिद्धान्त को निश्चित नहीं मानता।
- issue: לְמַעַן का संबंध
  choice: 'शत्रुओं को बचाव की विनती का कारण मानना: ‘मेरे शत्रुओं के कारण’'
  alternative: ‘मेरे शत्रुओं के निमित्त’ या ‘उनके देखते’
  rationale: संदर्भ में शत्रुओं से उत्पन्न संकट विनती का कारण प्रतीत होता है, फिर भी हिब्रू पदबंध प्रयोजन या निमित्त का भाव भी ले सकता है; इस वास्तविक अस्पष्टता को टिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का संक्षिप्त, प्रार्थनात्मक और गरिमापूर्ण काव्य-रजिस्टर। ‘प्राण’ सामान्य पाठक के लिए बोधगम्य रहते हुए נפשׁ के जीवन/स्वत्व संबंधी विस्तार को बनाए रखता है।
