lexical_decisions:
- source_word: צָרוֹת
  choice: संकट
  rationale: यह बहुवचन संज्ञा विपत्तियों, परेशानियों और संकटपूर्ण परिस्थितियों को व्यक्त करती है। हिंदी में ‘संकट’ स्वाभाविक है और अगले पदबंध में संकुचन की छवि से मेल खाता है।
- source_word: לְבָבִי
  choice: मेरे हृदय के
  rationale: לֵבָב मनुष्य के भीतरी व्यक्तित्व—भावना और विचार—को दर्शा सकता है। ‘हृदय’ मूल मानवीय छवि को बनाए रखता है और हिंदी में परिचित है।
- source_word: הִרְחִיבוּ
  choice: बढ़ गए हैं
  rationale: क्रिया का मूल अर्थ चौड़ा या विस्तृत करना है। यहाँ ‘संकट’ कर्ता होने से आशय उनका बढ़ जाना है; ‘बढ़ गए हैं’ आधुनिक हिंदी में अर्थ स्पष्ट करता है, जबकि पादटिप्पणी शाब्दिक छवि सुरक्षित रखती है।
- source_word: מִמְּצוּקוֹתַי
  choice: मेरी तंगियों से
  rationale: מְצוּקוֹת संकरेपन, घिराव अथवा उससे उत्पन्न क्लेश को व्यक्त करता है। ‘तंगियों’ मूल संकुचन-रूपक और बहुवचन को बनाए रखता है।
- source_word: הוֹצִיאֵנִי
  choice: मुझे ... बाहर निकाल
  rationale: हिफ़ील क्रिया का अर्थ ‘मुझे बाहर निकाल’ है। यह संकट की संकरी अवस्था से छुड़ाने की ठोस छवि को सीधे सुरक्षित रखता है।
