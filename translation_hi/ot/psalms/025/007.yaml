source:
  edition: WLC
  text: חַטֹּ֤אות נְעוּרַ֨/י וּ/פְשָׁעַ֗/י אַל תִּ֫זְכֹּ֥ר כְּ/חַסְדְּ/ךָ֥ זְכָר לִ/י אַ֑תָּה לְמַ֖עַן טוּבְ/ךָ֣ יְהוָֽה׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/025/007.yaml
  text: Do not remember the sins of my youth or my transgressions[a]; according to your steadfast love, remember me—for the sake of your goodness[b], O Yahweh.
translation:
  language: hi
  text: मेरी जवानी के पापों और मेरे अपराधों को याद न कर; अपने अटल प्रेम[a] के अनुसार मुझे याद कर—अपनी भलाई के कारण, हे याहवे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '‘अटल प्रेम’ इब्रानी शब्द ‘हेसेद’ का अनुवाद है; इसमें स्थायी, निष्ठावान प्रेम का भाव है और दया का अर्थ भी हो सकता है। अन्य सम्भव अनुवाद हैं: ‘दया’ या ‘वाचा का प्रेम’।'
    reason: lexical_alternative
lexical_decisions:
- source_word: חַטֹּאות נְעוּרַי
  choice: मेरी जवानी के पापों
  rationale: यह पदबंध जवानी से जुड़े ठोस पाप-कर्मों को दर्शाता है; यह अनुवाद संबंधवाचक रचना को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: וּפְשָׁעַי
  choice: और मेरे अपराधों
  rationale: וְ का सामान्य अर्थ ‘और’ है, और פשע जानबूझकर किए गए उल्लंघन या विद्रोह का भाव रखता है; ‘अपराध’ आधुनिक हिन्दी में इसके नैतिक-न्यायिक बल को सहजता से व्यक्त करता है।
- source_word: אַל תִּזְכֹּר
  choice: याद न कर
  rationale: यह निषेधात्मक विनती है। ‘याद न कर’ पापों को लेखे में न लाने का निहित न्यायिक भाव खोए बिना सीधा और स्वाभाविक है।
- source_word: כְּחַסְדְּךָ
  choice: अपनी अटल करुणा के अनुसार
  rationale: חסד में दया, निष्ठा और स्थायी संबंधपरक प्रेम का व्यापक भाव है। ‘अटल करुणा’ हिन्दी में दयालुता और दृढ़ निष्ठा दोनों को संक्षेप में सामने लाती है।
- source_word: זְכָר לִי אַתָּה
  choice: मुझे याद कर
  rationale: यह पहले निषेध के समानांतर सकारात्मक विनती है। अलग सर्वनाम אַתָּה का जोर हिन्दी की आज्ञार्थक रचना और विरोधात्मक समानांतरता से पर्याप्त रूप से प्रकट होता है।
- source_word: לְמַעַן טוּבְךָ
  choice: अपनी भलाई के कारण
  rationale: לְמַעַן यहाँ विनती का आधार या हेतु बताता है; ‘के कारण’ स्वाभाविक हिन्दी में परमेश्वर की अपनी भलाई को आधार बनाए रखता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: मूल पाठ में प्रयुक्त परमेश्वर के व्यक्तिगत नाम को हिन्दी में प्रचलित प्रतिलेखन ‘यहोवा’ से प्रस्तुत किया गया है, किसी उपाधि से प्रतिस्थापित नहीं किया गया।
theological_decisions:
- issue: חסד का व्यापक अर्थ
  choice: अटल करुणा
  alternative: अटल प्रेम / वाचा का प्रेम / दया
  rationale: यह चयन परमेश्वर की दयालु कृपा और स्थायी निष्ठा दोनों को व्यक्त करता है, पर किसी एक व्यवस्थित धर्मवैज्ञानिक व्याख्या तक अर्थ को सीमित नहीं करता।
- issue: युवावस्था के पाप और अपराध का संबंध
  choice: ‘और’ से दोनों को संयुक्त करना
  alternative: ‘या’ से वैकल्पिक रूप में जोड़ना
  rationale: मूल इब्रानी में וְ है, जिसका सीधा अर्थ ‘और’ है। यहाँ दोनों श्रेणियाँ विनती के संयुक्त विषय हैं; हिन्दी में ‘और’ मूल समन्वय को स्पष्ट रखता है।
- issue: परमेश्वर द्वारा ‘याद करना’
  choice: 'शाब्दिक समानांतरता बनाए रखना: पापों को याद न कर, मुझे याद कर'
  alternative: ‘पापों का लेखा न ले’ और ‘मुझ पर कृपा कर’ जैसे व्याख्यात्मक रूप
  rationale: मूल की जानबूझकर रची गई पुनरुक्ति और धर्मवैज्ञानिक तनाव को बनाए रखा गया है, बिना ‘याद करने’ को केवल मानसिक स्मृति या केवल न्यायिक लेखे तक सीमित किए।
- issue: यְהוָה का निरूपण
  choice: यहोवा
  alternative: याहवे / प्रभु
  rationale: व्यक्तिगत दिव्य नाम को शीर्षक से बदलने के बजाय हिन्दी के परिचित प्रतिलेखन से रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, प्रार्थनात्मक और सहज शैली। परमेश्वर को संबोधन में एकवचन निकटता बनाए रखने के लिए ‘कर’ रूप रखा गया है। मूल की ‘याद न कर / मुझे याद कर’ समानांतरता सुरक्षित है।
