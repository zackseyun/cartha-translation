source:
  edition: WLC
  text: אֱֽלֹהַ֗/י בְּ/ךָ֣ בָ֭טַחְתִּי אַל אֵב֑וֹשָׁה אַל יַֽעַלְצ֖וּ אֹיְבַ֣/י לִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/025/002.yaml
  text: My God[a], in you I trust; do not let me be put to shame[b]; do not let my enemies exult over me.
translation:
  language: hi
  text: 'मेरे परमेश्वर, मैं तुझ पर भरोसा रखता हूँ;

    मुझे लज्जित न होने दे[a];

    मेरे शत्रु मुझ पर आनन्द न मनाएँ[b]।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मुझे अपमानित न होने दे।” इब्रानी क्रिया भीतर की लज्जा अथवा सार्वजनिक रूप से लज्जित या बदनाम होने—दोनों का भाव दे सकती है।
    reason: lexical_alternative
  - marker: b
    text: या, “मेरे शत्रु मुझ पर विजय का उत्सव न मनाएँ” अथवा “मुझ पर हर्षित न हों।”
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱלֹהַי
  choice: मेरे परमेश्वर
  rationale: אֱלֹהַי में प्रथम पुरुष एकवचन प्रत्यय है, जिसका सीधा अर्थ ‘मेरे परमेश्वर’ है। संबोधन को बनाए रखा गया है, पर मूल में न होने के कारण ‘हे’ नहीं जोड़ा गया।
- source_word: בְּךָ בָטַחְתִּי
  choice: मैं तुझ पर भरोसा रखता हूँ
  rationale: ב के साथ בטח भरोसे के आधार अथवा लक्ष्य को व्यक्त करता है। पूर्ण रूप यहाँ बीते कार्य मात्र के बजाय स्थिर और वर्तमान भरोसे की अवस्था बताता है; इसलिए स्वाभाविक हिन्दी वर्तमान काल चुना गया।
- source_word: אַל אֵבוֹשָׁה
  choice: मुझे लज्जित न होने दे
  rationale: בושׁ भीतर की लज्जा और सार्वजनिक रूप से लज्जित या अपमानित होने—दोनों को व्यक्त कर सकता है। ‘लज्जित न होने दे’ प्रार्थनात्मक निवेदन और मूल की व्यापकता को बनाए रखता है।
- source_word: אַל יַעַלְצוּ אֹיְבַי לִי
  choice: मेरे शत्रु मुझ पर आनन्द न मनाएँ
  rationale: עלץ उल्लासपूर्ण आनन्द को दर्शाता है और לִי यहाँ उस व्यक्ति को सूचित करता है जिसकी दशा पर शत्रु हर्ष मनाते हैं। यह अनुवाद शत्रुतापूर्ण प्रसन्नता को रखता है, बिना क्रिया को अनिवार्य रूप से ‘विजय पाना’ बना देने के।
theological_decisions:
- issue: भरोसे के बावजूद लज्जित होने की विनती
  choice: मुझे लज्जित न होने दे
  alternative: मुझे अपमानित न होने दे
  rationale: मुख्य पाठ ऐसा शब्द रखता है जिसमें आंतरिक लज्जा और लोगों के सामने अपमानित होने की संभावना दोनों सुनाई देती हैं। इससे भरोसे और अभी अपेक्षित प्रतिपादन के बीच भजन का तनाव बना रहता है।
- issue: शत्रुओं के उल्लास का स्वरूप
  choice: मेरे शत्रु मुझ पर आनन्द न मनाएँ
  alternative: मेरे शत्रु मुझ पर विजय का उत्सव न मनाएँ
  rationale: मूल क्रिया उल्लास या हर्ष को सीधे व्यक्त करती है; विजय का भाव प्रसंग में संभव है, पर उसे मुख्य पाठ में अनिवार्य अर्थ बनाना उचित नहीं।
translation_notes:
  register: भाषा आधुनिक, प्रार्थनात्मक और काव्यात्मक रखी गई है। परमेश्वर के लिए पारंपरिक निकट संबोधन ‘तुझ’ प्रयुक्त है। पंक्ति-विभाजन इब्रानी काव्य के समानांतर निवेदनों को स्पष्ट करता है।
