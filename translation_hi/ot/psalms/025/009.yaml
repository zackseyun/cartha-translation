  text: He guides the humble in justice[b][a], and he teaches the humble his way.
translation:
  language: hi
  text: 'वह नम्रों[a] को न्याय[b] के मार्ग पर चलाता है,

    और नम्रों को अपना मार्ग सिखाता है।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “दीनों”; इब्रानी शब्द प्रसंग के अनुसार नीची अवस्था वाले या पीड़ित लोगों को भी सूचित कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: या “उचित निर्णय के अनुसार” अथवा “जो सही है उसमें।”
    reason: lexical_alternative
lexical_decisions:
- source_word: יַדְרֵךְ
  choice: मार्ग पर चलाता है
  rationale: हिफ़ील रूप किसी को मार्ग पर चलाने या उसका मार्गदर्शन करने का भाव देता है। यह हिंदी अभिव्यक्ति कारणवाचक अर्थ और मार्ग-संबंधी बिंब दोनों को सुरक्षित रखती है।
- source_word: עֲנָוִים
  choice: दीनों
  rationale: यह शब्द नम्र, दीन, दबे हुए या पीड़ित लोगों को सूचित कर सकता है। यहाँ 'दीनों' नैतिक नम्रता और नीची अवस्था—दोनों की संभावनाएँ खुली रखता है; दोनों occurrences में पुनरावृत्ति सुरक्षित रखी गई है।
- source_word: בַּמִּשְׁפָּט
  choice: न्याय के मार्ग पर
  rationale: מִשְׁפָּט का अर्थ न्याय, उचित निर्णय या जो सही है हो सकता है। 'न्याय के मार्ग पर' को דרך के गतिशील बिंब के साथ स्वाभाविक हिंदी में जोड़ा गया है, जबकि वैकल्पिक अर्थ पादटिप्पणी में रखा गया है।
- source_word: וִילַמֵּד
  choice: और ... सिखाता है
  rationale: למד का पिअेल रूप सिखाने या शिक्षा देने का अर्थ रखता है। सरल और वर्तमान हिंदी के लिए 'सिखाता है' चुना गया है।
- source_word: דַּרְכּוֹ
  choice: अपना मार्ग
  rationale: मूल में एकवचन और तृतीय पुरुष पुल्लिंग प्रत्यय है। एक ही कर्ता के संदर्भ में हिंदी का 'अपना मार्ग' स्वाभाविक रूप से 'उसका मार्ग' का अर्थ देता है और एकवचन सुरक्षित रखता है।
theological_decisions:
- issue: עֲנָוִים में नैतिक नम्रता और सामाजिक दीनता का संबंध
  choice: '''दीनों'' रखा गया है, जिससे परमेश्वर के सामने विनम्र और नीची अवस्था वाले लोगों—दोनों का भाव संभव रहता है।'
  alternative: '''नम्र लोगों'' या ''पीड़ितों'''
  rationale: संदर्भ शिक्षा ग्रहण करने योग्य विनम्रता की ओर संकेत करता है, पर इब्रानी शब्द को केवल आंतरिक गुण तक सीमित करना उचित नहीं। 'दीन' इसकी व्यापक अर्थ-सीमा को अधिक अच्छी तरह सुरक्षित रखता है।
- issue: בַּמִּשְׁפָּט का भाव
  choice: '''न्याय के मार्ग पर''—परमेश्वर का मार्गदर्शन न्याय/सही आचरण के अनुरूप समझा गया है।'
  alternative: '''न्याय में'', ''निर्णय के अनुसार'', या ''जो सही है उसमें'''
  rationale: इब्रानी पदबंध क्षेत्र, मानक या दिशा का भाव दे सकता है। अनुवाद अर्थ को पठनीय बनाता है, और पादटिप्पणी वास्तविक अस्पष्टता को सुरक्षित रखती है।
translation_notes:
  register: आधुनिक मानक हिंदी में संक्षिप्त, काव्यात्मक और गरिमापूर्ण शैली रखी गई है। मूल की समानांतर रचना तथा 'दीनों' की पुनरावृत्ति सुरक्षित है।
