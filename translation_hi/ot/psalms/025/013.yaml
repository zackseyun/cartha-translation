  yaml_path: translation/ot/psalms/025/013.yaml
  text: His soul will dwell in goodness[b][a], and his offspring will inherit the land.
translation:
  language: hi
  text: उसका प्राण भलाई में बसेरा करेगा[a], और उसका वंश भूमि का उत्तराधिकारी होगा[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “रात बिताएगा” अथवा “ठहरा रहेगा।” इब्रानी क्रिया में ठहरने या रात बिताने का बिंब है।
    reason: lexical_alternative
  - marker: b
    text: या, “पृथ्वी का उत्तराधिकारी होगा।” इब्रानी शब्द का अर्थ ‘भूमि/देश’ या ‘पृथ्वी’ दोनों हो सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: נַפְשׁוֹ
  choice: उसका प्राण
  rationale: נֶפֶשׁ यहाँ व्यक्ति के प्राण, जीवन या स्वयं को दर्शा सकता है। ‘उसका प्राण’ इब्रानी काव्यात्मक अभिव्यक्ति को बनाए रखता है, बिना इसे केवल ‘वह’ कर देने के।
- source_word: בְּטוֹב
  choice: भलाई में
  rationale: טוֹב में भलाई, कुशलता और समृद्ध दशा—तीनों का भाव हो सकता है। ‘भलाई’ इस व्यापक नैतिक और अनुभवगत अर्थ को बनाए रखती है।
- source_word: תָלִין
  choice: बसेरा करेगा
  rationale: לון का मूल बिंब रात बिताने या ठहरने का है। ‘बसेरा करेगा’ उस बिंब को स्वाभाविक हिन्दी में सुरक्षित रखता है और स्थिर निवास का भाव भी देता है।
- source_word: וְזַרְעוֹ
  choice: और उसका वंश
  rationale: זֶרַע का शाब्दिक अर्थ ‘बीज’ और प्रसंगगत अर्थ संतान या वंश है। यहाँ ‘वंश’ पारिवारिक निरंतरता को संक्षेप और स्वाभाविक रूप से व्यक्त करता है।
- source_word: יִירַשׁ
  choice: अधिकारी होगा
  rationale: ירשׁ का अर्थ विरासत पाना या अधिकार में लेना हो सकता है। ‘अधिकारी होगा’ भूमि पर प्राप्त अधिकार और वाचा-संबंधी प्रतिध्वनि को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: אָרֶץ
  choice: उस देश
  rationale: אֶרֶץ का अर्थ ‘देश/भूमि’ या ‘पृथ्वी’ हो सकता है। ירשׁ के साथ इस प्रसंग में ‘उस देश’ वाचा में प्रतिज्ञात भूमि के संकेत को सबसे अच्छी तरह सामने लाता है।
theological_decisions:
- issue: יִירַשׁ אָרֶץ में אָרֶץ का दायरा
  choice: उस देश का अधिकारी होगा
  alternative: पृथ्वी का अधिकारी होगा
  rationale: यह पद संभवतः प्रतिज्ञात देश के अधिकारी होने की वाचा-संबंधी भाषा को प्रतिध्वनित करता है; फिर भी व्यापक ‘पृथ्वी’ अर्थ इब्रानी में संभव है, इसलिए उसे पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण काव्यात्मक शैली अपनाई गई है। ‘प्राण’ और ‘बसेरा करेगा’ मूल की काव्यात्मक बनावट तथा ठहरने के बिंब को बनाए रखते हैं; ‘उस देश’ वाचा-संबंधी संकेत को स्पष्ट करता है, जबकि वैकल्पिक व्यापक अर्थ पादटिप्पणी में दिया गया है।
