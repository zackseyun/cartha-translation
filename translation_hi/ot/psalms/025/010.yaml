base_translation:
  language: en
  yaml_path: translation/ot/psalms/025/010.yaml
  text: All the paths of Yahweh are steadfast love and faithfulness to those who keep his covenant and his testimonies[a][b].
translation:
  language: hi
  text: याहवे के सभी मार्ग अटल प्रेम और विश्वासयोग्यता हैं, उनके लिए जो उसकी वाचा और उसके साक्ष्यों का पालन करते हैं।[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘विश्वासयोग्यता’ के स्थान पर ‘सत्य’ भी अनुवाद किया जा सकता है; इस वाचा-संबंधी युग्म में इब्रानी शब्द प्रायः भरोसेमंद निष्ठा का भाव रखता है।
    reason: lexical_alternative
  - marker: b
    text: ‘उनके लिए जो’ के स्थान पर ‘उन लोगों के प्रति जो’ भी अनुवाद किया जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל אָרְחוֹת
  choice: सभी मार्ग
  rationale: यह अभिव्यक्ति याहवे के मार्गों की समग्रता बताती है और मूल के मार्ग-रूपक को स्वाभाविक हिन्दी में बनाए रखती है।
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत नाम का लिप्यंतरण किया गया है, शीर्षक से उसका प्रतिस्थापन नहीं।
- source_word: חֶסֶד
  choice: अटल प्रेम
  rationale: यह वाचा के संदर्भ में स्थिर, कृपालु और निष्ठावान प्रेम का भाव व्यक्त करता है।
- source_word: אֱמֶת
  choice: विश्वासयोग्यता
  rationale: חֶסֶד के साथ इस युग्म में शब्द अमूर्त सत्य से अधिक भरोसेमंद निष्ठा का भाव रखता है।
- source_word: לְנֹצְרֵי
  choice: उनके लिए जो ... पालन करते हैं
  rationale: नצר का कृदंत सावधानी से मानने या संभालकर रखने को सूचित करता है; हिन्दी में ‘पालन करते हैं’ वाचा और साक्षियों दोनों के साथ स्वाभाविक है।
- source_word: בְרִיתוֹ
  choice: उसकी वाचा
  rationale: בְּרִית के लिए स्थापित धर्मग्रंथीय पदावली रखी गई है।
- source_word: וְעֵדֹתָיו
  choice: और उसकी साक्षियों
  rationale: औपचारिक निकटता रखते हुए उन ईश्वरीय घोषणाओं या विधानों का संकेत सुरक्षित है जो साक्षी का कार्य करते हैं।
theological_decisions:
- issue: याहवे के मार्गों और ‘अटल प्रेम और विश्वासयोग्यता’ के बीच विधेय-संबंध
  choice: मार्ग स्वयं अटल प्रेम और विश्वासयोग्यता कहे गए हैं
  alternative: उसके मार्ग अटल प्रेम और विश्वासयोग्यता की ओर ले जाते हैं
  rationale: क्रियारहित इब्रानी वाक्य सबसे स्वाभाविक रूप से חֶסֶד וֶאֱמֶת को याहवे के मार्गों का विधेय बनाता है; इसे केवल परिणाम या दिशा के रूप में नहीं बदला गया।
- issue: לְנֹצְרֵי का संबंध
  choice: उनके लिए जो उसकी वाचा और साक्षियों का पालन करते हैं
  alternative: उनकी ओर जो उसकी वाचा और साक्षियों का पालन करते हैं
  rationale: לְ संबंध या हित दोनों का भाव दे सकता है। मुख्य पाठ में स्वाभाविक हिन्दी ‘उनके लिए’ रखी गई और विकल्प पादटिप्पणी में दिया गया, बिना इस तनाव को इस दावे से सुलझाए कि परमेश्वर का चरित्र मानवीय आज्ञाकारिता पर निर्भर है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य शैली रखी गई है। ‘वाचा’ धर्मग्रंथीय संदर्भ की सटीकता बनाए रखता है; ‘साक्षियाँ’ मूल शब्द की औपचारिक छवि बचाती है।
