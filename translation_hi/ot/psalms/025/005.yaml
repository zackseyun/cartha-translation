  yaml_path: translation/ot/psalms/025/005.yaml
  text: Lead me in your truth and teach me[a], for you are the God of my salvation[b]; for you I wait all day long.
translation:
  language: hi
  text: 'अपने सत्य में मेरी अगुवाई कर[a] और मुझे सिखा,

    क्योंकि तू मेरे उद्धार का परमेश्वर है;

    मैं दिन भर तेरी बाट जोहता हूँ[b]।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘अपनी निष्ठा के अनुसार मेरी अगुवाई कर’; इब्रानी शब्द का अर्थ ‘सत्य’ या ‘निष्ठा/विश्वसनीयता’ हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या ‘मैं दिन भर तुझ पर आशा रखता हूँ’; इब्रानी क्रिया में आशाभरी प्रतीक्षा का भाव है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הַדְרִיכֵנִי
  choice: मेरी अगुवाई कर
  rationale: דרך के हिफ़ील आज्ञार्थक रूप में किसी को मार्ग पर चलाने या दिशा देने का भाव है। ‘मेरी अगुवाई कर’ इस मार्ग-संबंधी रूपक को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: בַאֲמִתֶּךָ
  choice: अपने सत्य में
  rationale: אֱמֶת का अर्थ ‘सत्य’, ‘विश्वसनीयता’ या ‘निष्ठा’ हो सकता है। अगुवाई और शिक्षा के इस संदर्भ में ‘अपने सत्य में’ उस क्षेत्र या मानक को व्यक्त करता है जिसमें भजनकार चलाया जाना चाहता है।
- source_word: וְלַמְּדֵנִי
  choice: और मुझे सिखा
  rationale: למד के पिएल आज्ञार्थक रूप का सीधा अर्थ ‘सिखा’ है; यह आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यह संयोजक प्रार्थना का आधार बताता है; ‘क्योंकि’ उसके कारणसूचक संबंध को स्पष्ट रखता है।
- source_word: אֱלֹהֵי יִשְׁעִי
  choice: मेरे उद्धार का परमेश्वर
  rationale: यह अनुवाद इब्रानी संबंधवाचक संरचना को सुरक्षित रखते हुए परमेश्वर को उद्धार के स्रोत के रूप में प्रस्तुत करता है।
- source_word: קִוִּיתִי
  choice: बाट जोहता हूँ
  rationale: קוה में प्रतीक्षा के साथ आशा और अपेक्षा का भाव है। ‘बाट जोहना’ हिन्दी में प्रतीक्षारत भरोसे को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: אוֹתְךָ
  choice: तेरी
  rationale: קוה के साथ यह सर्वनाम प्रतीक्षा के लक्ष्य को दर्शाता है। हिन्दी मुहावरे ‘तेरी बाट जोहना’ में यही संबंध सहज रूप से व्यक्त होता है।
- source_word: כָּל הַיּוֹם
  choice: दिन भर
  rationale: यह पद पूरे दिन की अवधि को दर्शाता है; ‘दिन भर’ संक्षिप्त और स्वाभाविक आधुनिक हिन्दी है।
theological_decisions:
- issue: ईश्वरीय मार्गदर्शन के संदर्भ में אֱמֶת का अर्थ
  choice: ‘सत्य’
  alternative: ‘निष्ठा’ या ‘विश्वसनीयता’
  rationale: अगुवाई और सिखाने की समानांतर याचिकाएँ ‘सत्य’ को शिक्षा और जीवन-मार्ग के मानक के रूप में ग्रहण करने का समर्थन करती हैं। फिर भी इब्रानी शब्द में परमेश्वर की निष्ठा का अर्थ संभव है, इसलिए उसे पादटिप्पणी में रखा गया है।
- issue: קוה में प्रतीक्षा और आशा का संबंध
  choice: ‘बाट जोहता हूँ’
  alternative: ‘आशा रखता हूँ’ या ‘आशा से प्रतीक्षा करता हूँ’
  rationale: मुख्य पाठ प्रतीक्षा की ठोस छवि को बनाए रखता है, जबकि पादटिप्पणी स्पष्ट करती है कि यह निष्क्रिय प्रतीक्षा नहीं बल्कि आशाभरी अपेक्षा है।
translation_notes:
  register: भाषा आधुनिक, श्रद्धापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। प्रार्थना में परमेश्वर के लिए एकवचन आत्मीय संबोधन ‘तू’ प्रयुक्त हुआ है। पद की काव्यात्मक समानांतरता और तीन-पंक्ति लय सुरक्षित रखी गई है।
