  text: זְכֹר רַחֲמֶ֣י/ךָ יְ֭הוָה וַ/חֲסָדֶ֑י/ךָ כִּ֖י מֵ/עוֹלָ֣ם הֵֽמָּה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/025/006.yaml
  text: Remember your mercies[a], O Yahweh, and your steadfast love[c][b], for they are from of old.
translation:
  language: hi
  text: हे याहवे, अपनी करुणाओं[a] और अपनी स्थिर प्रेमपूर्ण कृपाओं[b] को स्मरण कीजिए, क्योंकि वे प्राचीनकाल से हैं।[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “अपनी दयाएँ।”
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में यहाँ बहुवचन है; इसका अर्थ “अपनी स्थिर प्रेमपूर्ण कृपा के कार्य” भी हो सकता है।
    reason: lexical_alternative
  - marker: c
    text: या “क्योंकि वे अनादिकाल से हैं” अथवा “सदा से हैं।” इब्रानी अभिव्यक्ति सुदूर प्राचीनता या अनंत अवधि, दोनों का बोध करा सकती है।
    reason: alternative_reading
lexical_decisions:
- source_word: זְכֹר
  choice: स्मरण कर
  rationale: यह זכר का काल (Qal) आज्ञार्थक, द्वितीय पुरुष पुल्लिंग एकवचन रूप है और परमेश्वर से की गई सीधी प्रार्थना है। ‘स्मरण कर’ गरिमापूर्ण और स्वाभाविक प्रार्थना-भाषा है।
- source_word: רַחֲמֶיךָ
  choice: अपनी करुणाओं
  rationale: רחמים बहुवचन है और उसके साथ द्वितीय पुरुष पुल्लिंग एकवचन प्रत्यय है। ‘करुणाओं’ मूल के बहुवचन को बनाए रखता है और करुणा की बहुतायत अथवा उसके अनेक कार्यों का संकेत देता है।
- source_word: יְהוָה
  choice: हे यहवे
  rationale: चतुरक्षरीय दिव्य नाम को किसी उपाधि से बदलने के बजाय ‘यहवे’ के रूप में लिप्यंतरित किया गया है; सम्बोधन के लिए ‘हे’ जोड़ा गया है।
- source_word: וַחֲסָדֶיךָ
  choice: और अपनी अटल प्रेममयता
  rationale: חסד निष्ठावान, स्थायी प्रेम को व्यक्त करता है। मूल रूप बहुवचन है, पर हिंदी में भाववाचक एकवचन ‘अटल प्रेममयता’ अधिक स्वाभाविक है; बहुवचन की सूचना पादटिप्पणी में दी गई है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यह प्रार्थना का आधार बताता है; आधुनिक हिंदी में ‘क्योंकि’ स्पष्ट और स्वाभाविक है।
- source_word: מֵעוֹלָם
  choice: प्राचीनकाल से
  rationale: यह अभिव्यक्ति सुदूर अतीत अथवा अनादिकालीन अवधि का बोध करा सकती है। ‘प्राचीनकाल से’ संदर्भ में दीर्घकाल से प्रकट परमेश्वर के चरित्र को व्यक्त करता है और अधिक प्रबल अर्थ को पादटिप्पणी के लिए खुला रखता है।
- source_word: הֵמָּה
  choice: वे ... हैं
  rationale: स्वतंत्र तृतीय पुरुष पुल्लिंग बहुवचन सर्वनाम पिछले दोनों बहुवचन संज्ञा-रूपों की ओर संकेत करता है; हिंदी में ‘वे ... हैं’ इसे स्पष्ट करता है।
theological_decisions:
- issue: दिव्य नाम יְהוָה का अनुवाद
  choice: यहवे
  alternative: यहोवा / प्रभु
  rationale: मूल में व्यक्तिगत दिव्य नाम है। ‘यहवे’ उसे उपाधि से प्रतिस्थापित किए बिना आधुनिक हिंदी लिपि में प्रस्तुत करता है।
- issue: מֵעוֹלָם का कालगत अर्थ
  choice: प्राचीनकाल से
  alternative: अनादिकाल से / सदा से
  rationale: इब्रानी पद सुदूर प्राचीनता और अनंत अवधि—दोनों अर्थ दे सकता है। मुख्य पाठ संदर्भानुकूल प्राचीनता रखता है, जबकि पादटिप्पणी व्यापक संभावना सुरक्षित रखती है।
- issue: חֲסָדֶיךָ के व्याकरणिक बहुवचन का हिंदी रूप
  choice: अटल प्रेममयता
  alternative: अटल प्रेम के कार्य
  rationale: हिंदी में शाब्दिक बहुवचन अस्वाभाविक होगा। भाववाचक एकवचन अर्थ को सहज रखता है और पादटिप्पणी मूल के बहुवचन को दर्ज करती है।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण प्रार्थना-शैली अपनाई गई है। परमेश्वर के लिए निकट सम्बोधन का एकवचन रूप रखा गया है। भाववाचक संज्ञाओं को स्वाभाविक हिंदी में प्रस्तुत करते हुए मूल के बहुवचन और कालगत अस्पष्टता को पादटिप्पणियों में सुरक्षित रखा गया है।
