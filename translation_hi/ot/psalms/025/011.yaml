id: PSA.25.11
reference: Psalms 25:11
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: לְמַֽעַן שִׁמְ/ךָ֥ יְהוָ֑ה וְֽ/סָלַחְתָּ֥ לַ֝/עֲוֺנִ֗/י כִּ֣י רַב הֽוּא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/025/011.yaml
  text: For the sake of your name[a], O Yahweh, forgive my iniquity[b], for it is great.
translation:
  language: hi
  text: हे याहवे, अपने नाम के निमित्त[a] मेरे अधर्म[b] को क्षमा कर, क्योंकि वह बहुत बड़ा है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ ‘नाम’ केवल बोले जाने वाले नाम को नहीं, बल्कि परमेश्वर के चरित्र, प्रतिष्ठा और वाचा-संबंधी सम्मान को भी सूचित करता है।
    reason: cultural_note
  - marker: b
    text: या ‘मेरे दोष’ अथवा ‘मेरे पाप’। इब्रानी עָוֹן कुकर्म, उससे उत्पन्न दोष, या दोष के भार और परिणाम को सूचित कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: לְמַעַן
  choice: के निमित्त
  rationale: यह पदबंध प्रार्थना का आधार या प्रयोजन व्यक्त करता है। ‘के निमित्त’ परमेश्वर के नाम और प्रतिष्ठा की खातिर की गई विनती को स्वाभाविक तथा गरिमापूर्ण हिंदी में व्यक्त करता है।
- source_word: שִׁמְךָ
  choice: अपने नाम
  rationale: इब्रानी में शाब्दिक अर्थ ‘तेरा नाम’ है। हिंदी में संबोधित व्यक्ति के संदर्भ में ‘अपने नाम’ अधिक स्वाभाविक है और मूल की ठोस अभिव्यक्ति को बनाए रखता है।
- source_word: יְהוָה
  choice: हे याहवे
  rationale: मूल पाठ में परमेश्वर का व्यक्तिगत नाम יהוה है। ‘याहवे’ उसका लिप्यंतरण है, और संबोधन को स्पष्ट करने के लिए ‘हे’ रखा गया है।
- source_word: וְסָלַחְתָּ
  choice: क्षमा कर
  rationale: यद्यपि रूप पूर्ण क्रिया का है, इस प्रार्थनात्मक संदर्भ में वह विनती का भाव देता है। ‘क्षमा कर’ आधुनिक हिंदी में उस निवेदन को स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
- source_word: לַעֲוֺנִי
  choice: मेरे अधर्म को
  rationale: עָוֹן में कुकर्म, दोष और उसके दायित्व या परिणाम—इन सबका अर्थक्षेत्र हो सकता है। ‘अधर्म’ नैतिक गंभीरता को बनाए रखता है, जबकि विकल्प पादटिप्पणी में दिए गए हैं।
- source_word: כִּי
  choice: क्योंकि
  rationale: यहाँ כִּי क्षमा की विनती का कारण बताता है; ‘क्योंकि’ इस कारण-संबंध को साफ रूप से व्यक्त करता है।
- source_word: רַב הוּא
  choice: वह बहुत बड़ा है
  rationale: एकवचन ‘अधर्म’ की ओर संकेत करते हुए यह उसकी संख्या नहीं, बल्कि गंभीरता या विशालता बताता है। ‘बहुत बड़ा’ इस बल को सहज हिंदी में व्यक्त करता है।
theological_decisions:
- issue: יהוה परमेश्वर के नाम का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल में उपाधि नहीं, चार अक्षरों वाला व्यक्तिगत नाम है। ‘याहवे’ उसे नाम के रूप में सुरक्षित रखता है और ‘प्रभु’ कहकर उसका स्थानापन्न नहीं करता।
- issue: עָוֹן का अर्थक्षेत्र
  choice: अधर्म
  alternative: दोष; पाप
  rationale: मूल शब्द कुकर्म, उससे उत्पन्न दोष, या दोष के भार को सूचित कर सकता है। मुख्य पाठ में ‘अधर्म’ नैतिक वजन बनाए रखता है, जबकि पादटिप्पणी वास्तविक अर्थगत विस्तार को सुरक्षित रखती है।
- issue: अधर्म की महानता को क्षमा का कारण बताना
  choice: क्योंकि वह बहुत बड़ा है
  alternative: यद्यपि वह बहुत बड़ा है
  rationale: כִּי का सामान्य कारणवाचक अर्थ बनाए रखा गया है। पाठ की धर्मवैचारिक तीक्ष्णता—पाप की गंभीरता ही दया की विनती को और आवश्यक बनाती है—को ‘यद्यपि’ कहकर नरम या परिवर्तित नहीं किया गया।
translation_notes:
  register: भाषा आधुनिक, प्रार्थनापूर्ण और गरिमापूर्ण रखी गई है। ‘के निमित्त’ सामान्य बोलचाल से कुछ ऊँचा, पर व्यापक रूप से समझ में आने वाला पदबंध है। ‘हे याहवे’ प्रत्यक्ष संबोधन और मूल के व्यक्तिगत दिव्य नाम—दोनों को सुरक्षित रखता है।
