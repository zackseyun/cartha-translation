  yaml_path: translation/ot/psalms/025/008.yaml
  text: Good and upright is Yahweh[a]; therefore he instructs sinners in the way.
translation:
  language: hi
  text: 'याहवे भला और सीधा है;

    इसीलिए वह पापियों को मार्ग की शिक्षा देता है।[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “पापियों को मार्ग दिखाता है।” क्रिया का अर्थ “सिखाना,” “निर्देश देना” या “दिशा दिखाना” हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: טוֹב
  choice: भला
  rationale: यहाँ शब्द नैतिक अच्छाई व्यक्त करता है। ‘भला’ आधुनिक हिंदी में स्वाभाविक है और ‘सीधा’ के साथ गुण-वर्णन के रूप में उपयुक्त बैठता है।
- source_word: וְיָשָׁר
  choice: और सीधा
  rationale: यह नैतिक खराई और निष्कपटता का भाव रखता है। ‘सीधा’ मूल के ‘straight/upright’ रूपक को बनाए रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत नाम चतुरक्षर को उपाधि से बदलने के बजाय हिंदी लिप्यंतरण में सुरक्षित रखा गया है।
- source_word: עַל כֵּן
  choice: इसीलिए
  rationale: यह पहले कथन से निकलने वाला परिणाम दिखाता है और सहज आधुनिक हिंदी है।
- source_word: יוֹרֶה
  choice: शिक्षा देता है
  rationale: हिफ़ील क्रिया सिखाने, निर्देश देने या दिशा दिखाने का अर्थ दे सकती है; ‘शिक्षा देता है’ शिक्षण के अर्थ को स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: חַטָּאִים
  choice: पापियों को
  rationale: यह बहुवचन संज्ञा उन लोगों को सीधे ‘पापी’ कहती है; मूल की नैतिक श्रेणी को नरम नहीं किया गया।
- source_word: בַּדָּרֶךְ
  choice: मार्ग की
  rationale: हिब्रू पूर्वसर्ग सहित पदबंध मार्ग के विषय में या मार्ग में शिक्षा देने का संकेत दे सकता है। ‘मार्ग की शिक्षा’ हिंदी में स्वाभाविक है और जीवन-पथ के रूपक को बचाए रखती है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: व्यक्तिगत वाचा-नाम को केवल उपाधि से प्रतिस्थापित न करके उसके नाम का लिप्यंतरण रखा गया है।
- issue: בַּדָּרֶךְ और יוֹרֶה का संबंध
  choice: पापियों को मार्ग की शिक्षा देता है
  alternative: पापियों को मार्ग पर चलाता/दिशा दिखाता है
  rationale: क्रिया में ‘सिखाना’ और ‘दिशा देना’ दोनों संभव हैं। मुख्य पाठ में स्वाभाविक शिक्षण-अर्थ चुना गया है और वैकल्पिक दिशात्मक अर्थ पादटिप्पणी में सुरक्षित है; ‘सही’ जैसा विशेषण नहीं जोड़ा गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। काव्यात्मक संक्षिप्तता बनाए रखते हुए ‘मार्ग’ का नैतिक जीवन-पथ वाला रूपक सुरक्षित रखा गया है।
