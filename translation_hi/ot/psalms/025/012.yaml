base_translation:
  language: en
  yaml_path: translation/ot/psalms/025/012.yaml
  text: Who is the man who fears Yahweh? He will instruct him in the way he should choose[a].
translation:
  language: hi
  text: कौन है वह मनुष्य जो याहवे का भय मानता है? वह उसे उस मार्ग के विषय में सिखाएगा जिसे उसे चुनना चाहिए[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वह उसे उस मार्ग के विषय में सिखाएगा जिसे वह चुनता है,” अथवा “जिसे वह चुनेगा।” अंतिम इब्रानी क्रिया के भाव और उसके कर्ता के संबंध में कुछ भिन्न सूक्ष्म अर्थ सम्भव हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי זֶה
  choice: कौन है वह
  rationale: प्रश्नवाचक और संकेतवाचक पद के संयुक्त बल को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: הָאִישׁ
  choice: वह मनुष्य
  rationale: इब्रानी के पुल्लिंग एकवचन और उसके प्रतिनिधिक, सामान्य अर्थ—दोनों को सुरक्षित रखता है।
- source_word: יְרֵא יְהוָה
  choice: याहवे का भय मानता है
  rationale: यहाँ भय श्रद्धापूर्ण और भक्तिपूर्ण भय है; प्रचलित हिन्दी वाक्यांश स्रोत की धार्मिक गंभीरता बनाए रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: उपाधि से बदलने के बजाय परमेश्वर के व्यक्तिगत नाम का लिप्यंतरण किया गया है।
- source_word: יוֹרֶנּוּ
  choice: वह उसे ... शिक्षा देगा
  rationale: ירה के हिफ़ील रूप में शिक्षा देने और मार्गदर्शन करने दोनों की छाया है। निकट संदर्भ में कर्ता याहवे और कर्म भय मानने वाला मनुष्य है।
- source_word: בְּדֶרֶךְ
  choice: उस मार्ग की
  rationale: דרך के वास्तविक मार्ग और जीवन-पद्धति के रूपक को हिन्दी में स्वाभाविक ढंग से व्यक्त करता है।
- source_word: יִבְחָר
  choice: जिसे उसे चुनना चाहिए
  rationale: अपूर्ण क्रिया के प्रसंगगत निर्देशात्मक भाव को व्यक्त करता है, जबकि अन्य सम्भव सूक्ष्म अर्थ पादटिप्पणी में रखे गए हैं।
theological_decisions:
- issue: ‘वह उसे ... शिक्षा देगा’ में कर्ता की पहचान
  choice: निहित कर्ता याहवे है, जो अपना भय मानने वाले मनुष्य को शिक्षा देता है।
  alternative: क्रिया का कर्ता अनिश्चित माना जाए, अथवा मनुष्य को अपना ही शिक्षक समझा जाए।
  rationale: यद्यपि क्रिया के साथ कर्ता स्पष्ट रूप से नहीं लिखा है, निकट संदर्भ और भजन की वाक्य-रचना याहवे को कर्ता मानने का दृढ़ समर्थन करती है।
- issue: अंतिम क्रिया יִבְחָר का कर्ता और भाव
  choice: मार्ग उस मनुष्य को चुनना चाहिए।
  alternative: ‘जिसे वह चुनता है’ में कर्ता मनुष्य या याहवे समझा जा सकता है; अथवा इसे भविष्यकाल, ‘जिसे वह चुनेगा,’ माना जा सकता है।
  rationale: संदर्भ में निर्देश पाने वाले मनुष्य के उचित चुनाव का भाव सम्भाव्य है, पर इब्रानी की वास्तविक अस्पष्टता पादटिप्पणी में सुरक्षित रखी गई है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘याहवे’ व्यक्तिगत ईश्वरीय नाम को दर्शाता है; ‘भय मानना’ श्रद्धापूर्ण भय के पारम्परिक और अर्थपूर्ण हिन्दी प्रयोग को बनाए रखता है।
