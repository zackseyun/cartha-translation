lexical_decisions:
- source_word: רְאֵה
  choice: दृष्टि कर
  rationale: परमेश्वर से की गई प्रार्थना में यह पुल्लिंग एकवचन आज्ञार्थक रूप है। ‘दृष्टि कर’ निवेदन की शक्ति बनाए रखते हुए गरिमापूर्ण और सुबोध है।
- source_word: אוֹיְבַי
  choice: मेरे शत्रुओं
  rationale: एकवचन प्रथम पुरुष प्रत्यय सहित इस संज्ञा का सीधा और प्रचलित हिन्दी रूप।
- source_word: כִּי
  choice: क्योंकि
  rationale: यह परमेश्वर से शत्रुओं पर ध्यान देने के निवेदन का कारण प्रस्तुत करता है।
- source_word: רָבּוּ
  choice: वे बहुत हैं
  rationale: רבה के काल रूप का प्रसंगगत अर्थ शत्रुओं की बड़ी संख्या है; यह हिन्दी में स्वाभाविक और संक्षिप्त है।
- source_word: וְשִׂנְאַת חָמָס
  choice: हिंसक घृणा से
  rationale: חָמָס हिंसा, क्रूरता या अन्याय का भाव रखता है। यह चयन घृणा के हिंसक और निर्दय चरित्र को बनाए रखता है।
- source_word: שְׂנֵאוּנִי
  choice: मुझसे घृणा करते हैं
  rationale: शाब्दिक रूप पूर्णकालिक है, पर विलाप के प्रसंग में जारी शत्रुता व्यक्त होती है; हिन्दी वर्तमान काल उस अवस्था को स्वाभाविक ढंग से बताता है।
