  text: Redeem Israel[a], O God, from all his troubles.
translation:
  language: hi
  text: हे परमेश्वर, इस्राएल को उसके सभी संकटों से छुड़ा।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
