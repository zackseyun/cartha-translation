    reason: lexical_alternative
lexical_decisions:
- source_word: פְּדֵה
  choice: छुड़ा ले
  rationale: פדה का यह पुल्लिंग एकवचन आज्ञार्थक रूप है और छुड़ाने अथवा मूल्य देकर मुक्त करने का भाव रखता है। आधुनिक हिन्दी में “छुड़ा ले” प्रार्थना के संदर्भ में स्वाभाविक है और दैवी उद्धार का आशय बनाए रखता है।
- source_word: אֱלֹהִים
  choice: हे परमेश्वर
  rationale: यहाँ शब्द सीधे संबोधन में है; “हे” संबोधन को स्पष्ट करता है और “परमेश्वर” आधुनिक मानक हिन्दी में गरिमापूर्ण तथा सहज है।
- source_word: יִשְׂרָאֵל
  choice: इस्राएल
  rationale: इस प्रसंग में यह वाचा-समुदाय का सामूहिक नाम है, न कि केवल कुलपिता याकूब का व्यक्तिगत नाम।
- source_word: מִכֹּל
  choice: सब ... से
  rationale: מִן के साथ כֹּל संकटों की संपूर्णता से मुक्ति व्यक्त करता है; हिन्दी में विभक्ति “से” को संज्ञा के बाद रखना स्वाभाविक है।
- source_word: צָרוֹתָיו
  choice: उसके सब संकटों
  rationale: צָרוֹת विपत्तियों, क्लेशों या संकटों को सूचित करता है। “संकटों” व्यापक और सहज है; “उसके” मूल के तृतीय पुरुष पुल्लिंग एकवचन प्रत्यय को सुरक्षित रखता है।
theological_decisions:
- issue: इस्राएल के लिए सामूहिक एकवचन सर्वनाम
  choice: “उसके सब संकटों” द्वारा एकवचन रूप बनाए रखा
  alternative: “उनके सब संकटों” या “उन सबके संकटों”
  rationale: इब्रानी צָרוֹתָיו में तृतीय पुरुष पुल्लिंग एकवचन प्रत्यय है और “इस्राएल” को एक सामूहिक एकवचन के रूप में लिया गया है। हिन्दी में “उसके” इस व्याकरणिक रूप को बिना बहुवचन में बदलकर सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक, संक्षिप्त और प्रार्थनात्मक रखी गई है। “हे परमेश्वर” गरिमापूर्ण संबोधन है और “छुड़ा ले” आज्ञार्थक प्रार्थना को स्वाभाविक हिन्दी में व्यक्त करता है।
