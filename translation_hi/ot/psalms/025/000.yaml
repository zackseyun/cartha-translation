lexical_decisions:
- source_word: לְדָוִד
  choice: दाऊद की रचना
  rationale: शीर्षक का संबंध दाऊद से बताता है; हिन्दी में केवल ‘दाऊद का’ की अपेक्षा यह स्वाभाविक है, जबकि रचना के सटीक प्रकार के बारे में अनावश्यक दावा नहीं करता।
- source_word: יְהוָה
  choice: यहोवा
  rationale: परमेश्वर के विशिष्ट नाम को सामान्य उपाधि से प्रतिस्थापित न करके हिन्दी में प्रचलित रूप में रखा गया है।
- source_word: נַפְשִׁי
  choice: अपना प्राण
  rationale: נפשׁ का पारंपरिक और प्रसंगानुकूल हिन्दी प्रतिरूप; पादटिप्पणी स्पष्ट करती है कि यहाँ इसका अर्थ केवल देह से अलग कोई अभौतिक अंश नहीं, बल्कि जीवन या संपूर्ण अस्तित्व भी हो सकता है।
- source_word: אֶשָּׂא
  choice: उठाता हूँ
  rationale: मूल क्रिया के रूपक को बनाए रखता है और प्रार्थना में स्वयं को यहोवा की ओर लगाने या सौंपने का भाव खुला छोड़ता है।
theological_decisions:
