  choice: मूल रूपक सहित ‘अपना प्राण’
  alternative: ‘अपने आपको’ या ‘अपना जीवन’
  rationale: मूल की काव्यात्मक अभिव्यक्ति और अर्थ-विस्तार सुरक्षित रखा गया है; पादटिप्पणी संभावित समग्र-व्यक्ति अर्थ बताती है, बिना किसी विशिष्ट द्वैतवादी या अद्वैतवादी मानव-तत्त्वमीमांसा को थोपे।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और प्रार्थनामय हिन्दी। परमेश्वर को एकवचन आत्मीय संबोधन ‘तेरी’ दिया गया है। शीर्षक को मुख्य पंक्ति से अलग रखा गया है और काव्यात्मक ‘प्राण उठाना’ रूपक सुरक्षित है।
