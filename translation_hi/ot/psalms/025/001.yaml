lexical_decisions:
- source_word: לְדָוִד
  choice: दाऊद का
  rationale: शीर्षक में व्यक्ति के नाम से जुड़ा ל दाऊद से संबंध दर्शाता है। ‘दाऊद का’ रचनाकार, समर्पण या संबंध की संभावित अस्पष्टता बनाए रखता है और मूल में अनुपस्थित ‘भजन’ शब्द नहीं जोड़ता।
- source_word: אֵלֶיךָ
  choice: तेरी ओर
  rationale: אֶל के द्वितीय पुरुष एकवचन प्रत्यय का अर्थ ‘तेरी ओर/तुझको’ है। ‘तेरी ओर’ उठाने की क्रिया के साथ स्वाभाविक हिन्दी है और दिशा का भाव स्पष्ट रखता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: चतुरक्षरीय ईश-नाम को किसी उपाधि से बदलने के बजाय हिन्दी में प्रचलित उसके व्यक्तिगत नाम ‘यहोवा’ से व्यक्त किया गया है।
- source_word: נַפְשִׁי
  choice: अपना प्राण
  rationale: נֶפֶשׁ का अर्थ प्राण, जीवन, स्वयं या संपूर्ण व्यक्ति हो सकता है। ‘अपना प्राण’ हिब्रू रूपक और प्रार्थनात्मक गरिमा को बनाए रखता है; व्यापक अर्थ को पादटिप्पणी में बताया गया है।
- source_word: אֶשָּׂא
  choice: उठाता हूँ
  rationale: נָשָׂא का यहाँ अर्थ ‘उठाना’ है। ‘अपना प्राण तेरी ओर उठाता हूँ’ मूल के विश्वास और निवेदन के रूपक को सुरक्षित रखता है।
theological_decisions:
- issue: ईश-नाम יְהוָה का अनुवाद
  choice: हे यहोवा
  alternative: हे याहवे
  rationale: मूल पाठ में व्यक्तिगत ईश-नाम सीधे प्रयुक्त है, इसलिए ‘प्रभु’ जैसी उपाधि से प्रतिस्थापित नहीं किया गया। ‘यहोवा’ आधुनिक हिन्दी बाइबलीय प्रयोग में व्यापक रूप से पहचाना जाने वाला नाम-रूप है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और प्रार्थनात्मक हिन्दी। संबोधन में ‘हे’ तथा निकट व्यक्तिगत संबंध के लिए एकवचन ‘तेरी’ रखा गया है। शीर्षकीय खंड को अलग पंक्ति में रखा गया है।
