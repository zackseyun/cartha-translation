    reason: lexical_alternative
lexical_decisions:
- source_word: דְּרָכֶיךָ
  choice: अपने मार्ग
  rationale: דֶּרֶךְ का मूल मार्ग-रूपक सुरक्षित रहता है और यहाँ परमेश्वर के आचरण तथा उसकी इच्छा के अनुसार चलने के ढंग—दोनों की अर्थ-संभावना खुली रहती है।
- source_word: יְהוָה
  choice: हे यहोवा
  rationale: मूल पाठ के व्यक्तिगत दिव्य नाम को शीर्षक से बदलने के बजाय हिंदी में प्रचलित लिप्यंतरण ‘यहोवा’ से व्यक्त किया गया है; संबोधन को ‘हे’ स्पष्ट करता है।
- source_word: הוֹדִיעֵנִי
  choice: मुझे जानने दे
  rationale: ידע के हिफ़ील आज्ञार्थक का कारणवाचक भाव ‘मुझे ज्ञात करा’ है। ‘मुझे जानने दे’ हिंदी में प्रार्थनापरक और स्वाभाविक रहते हुए इस भाव को रखता है।
- source_word: אֹרְחוֹתֶיךָ
  choice: अपने पथ
  rationale: אֹרַח के लिए ‘पथ’ चुनने से पहले चरण के ‘मार्ग’ के साथ काव्यात्मक समानांतरता बनी रहती है, पर दोनों हिब्रू शब्द एक ही हिंदी शब्द में समतल नहीं होते।
- source_word: לַמְּדֵנִי
  choice: मुझे सिखा
  rationale: למד के पिएल आज्ञार्थक और प्रथम पुरुष एकवचन प्रत्यय का सीधा, सहज हिंदी रूप है।
theological_decisions:
- issue: दिव्य नाम יְהוָה का अनुवाद
  choice: हे यहोवा
  alternative: हे याहवे; हे प्रभु
  rationale: मूल में आया वाचा-संबंधी व्यक्तिगत नाम सुरक्षित रखा गया है। हिंदी के सामान्य बाइबलीय पाठक के लिए ‘यहोवा’ अधिक परिचित और सहज रूप है; ‘प्रभु’ करने से नाम शीर्षक में बदल जाता।
- issue: ‘मार्गों’ का आशय
  choice: रूपक को बिना व्याख्यात्मक विस्तार के बनाए रखना
  alternative: अपनी इच्छा/अपना आचरण मुझे बता
  rationale: पद परमेश्वर के व्यवहार, निर्देश और उस पर चलने के मार्ग के बीच संभावित अर्थ-विस्तार रखता है; किसी एक अर्थ तक सीमित करना मूल की काव्यात्मक और धर्मवैचारिक व्यापकता घटाता।
translation_notes:
  register: आधुनिक, प्रार्थनापरक और गरिमापूर्ण हिंदी। ‘मार्ग/पथ’ की काव्यात्मक समानांतरता और मूल की संक्षिप्तता रखी गई है; एकवचन संबोधन के कारण ‘सिखा’ प्रयुक्त है।
