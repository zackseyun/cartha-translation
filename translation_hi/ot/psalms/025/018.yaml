  text: רְאֵ֣ה עָ֭נְיִ/י וַ/עֲמָלִ֑/י וְ֝/שָׂ֗א לְ/כָל חַטֹּאותָֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/025/018.yaml
  text: Look on my affliction and my trouble[a], and forgive all my sins.
translation:
  language: hi
  text: मेरे दुःख और कष्ट को देख, और मेरे सारे पाप क्षमा कर।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: רְאֵה
  choice: दृष्टि कर
  rationale: परमेश्वर से की गई विनती में यह आज्ञार्थक रूप केवल देखने नहीं, बल्कि ध्यान देने और कृपापूर्वक विचार करने का भाव रखता है।
- source_word: עָנְיִי
  choice: मेरे दुःख
  rationale: यह शब्द दीनता, दुःख या विपत्ति को सूचित कर सकता है; यहाँ इसे केवल आर्थिक गरीबी तक सीमित न करके व्यापक पीड़ा के अर्थ में रखा गया है।
- source_word: וַעֲמָלִי
  choice: और कष्ट
  rationale: यह परिश्रम, परेशानी या पीड़ादायक कठिनाई का बोध करा सकता है; समानांतर पद में 'कष्ट' स्वाभाविक और अर्थपूर्ण है।
- source_word: וְשָׂא
  choice: क्षमा कर
  rationale: נשׂא का मूल अर्थ उठाना या ले जाना है, पर पापों के साथ यह उन्हें दूर करने, अर्थात क्षमा करने का प्रचलित इब्रानी मुहावरा है।
- source_word: לְכָל
  choice: सारे
  rationale: इस मुहावरे में לְ वस्तु को चिह्नित करता है; हिन्दी में इसका स्वाभाविक रूप 'मेरे सारे पाप' है।
- source_word: חַטֹּאותָי
  choice: मेरे पाप
  rationale: बहुवचन संज्ञा यहाँ नैतिक अपराधों के सामान्य अर्थ में है; 'पाप' स्पष्ट और मानक हिन्दी है।
theological_decisions:
- issue: पापों के साथ נשׂא का मुहावरेदार अर्थ
  choice: '''मेरे सारे पाप क्षमा कर'' के रूप में अनुवाद'
  alternative: '''मेरे सारे पाप उठा ले'' या ''दूर कर दे'''
  rationale: मूल चित्र पापों को उठा ले जाने का है, किंतु प्रसंग में आशय परमेश्वर से क्षमा की विनती है। 'क्षमा कर' आधुनिक हिन्दी में स्पष्ट है और कोई अतिरिक्त सिद्धान्त नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी का संक्षिप्त, गरिमापूर्ण प्रार्थनात्मक रूप। 'दृष्टि कर' भजन-साहित्य की ऊँची शैली बनाए रखता है, फिर भी सामान्य पाठक के लिए बोधगम्य है।
