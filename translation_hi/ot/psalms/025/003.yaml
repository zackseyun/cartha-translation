  text: גַּ֣ם כָּל קֹ֭וֶי/ךָ לֹ֣א יֵבֹ֑שׁוּ יֵ֝בֹ֗שׁוּ הַ/בּוֹגְדִ֥ים רֵיקָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/025/003.yaml
  text: Indeed[a], none of those who wait for you will be put to shame[b]; those who deal treacherously without cause will be put to shame.
translation:
  language: hi
  text: 'निश्चय ही, जितने तेरी बाट जोहते हैं[a], उनमें से कोई लज्जित न होगा;

    पर जो अकारण[b] विश्वासघात करते हैं, वे लज्जित होंगे।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘तुझ पर आशा रखते हैं।’ इब्रानी क्रिया में आशापूर्ण प्रतीक्षा का भाव है।
    reason: lexical_alternative
  - marker: b
    text: या ‘व्यर्थ ही’ अथवा ‘बिना किसी लाभ के।’ यहाँ इब्रानी शब्द רֵיקָם के एक से अधिक अर्थ सम्भव हैं; मुख्य पाठ में इसे ‘बिना उचित कारण के’ समझा गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם
  choice: निश्चय ही
  rationale: यहाँ גַּם केवल जोड़ नहीं, बल्कि कथन पर बल देता है; ‘निश्चय ही’ इस बल को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: כָּל קֹוֶיךָ לֹא יֵבֹשׁוּ
  choice: जितने तेरी बाट जोहते हैं, उनमें से कोई लज्जित न होगा
  rationale: इब्रानी की शाब्दिक रचना ‘तेरी बाट जोहनेवाले सभी लज्जित न होंगे’ सार्वभौमिक निषेध व्यक्त करती है। हिन्दी में ‘उनमें से कोई...न होगा’ इसका अर्थ स्पष्ट और सहज रखता है।
- source_word: קֹוֶיךָ
  choice: तेरी बाट जोहते हैं
  rationale: קוה आशापूर्ण प्रतीक्षा का भाव रखता है। ‘बाट जोहना’ प्रतीक्षा को सीधे व्यक्त करता है और प्रसंग में आशा का भाव भी बनाए रखता है।
- source_word: לֹא יֵבֹשׁוּ / יֵבֹשׁוּ
  choice: लज्जित न होगा / लज्जित होंगे
  rationale: בוש यहाँ अपमान या निराशाजनक पराजय के फलस्वरूप लज्जित होने को दर्शाता है। दोनों पंक्तियों में एक ही शब्दावली रखने से मूल का विरोधात्मक समानांतर बना रहता है।
- source_word: הַבּוֹגְדִים
  choice: जो...विश्वासघात करते हैं
  rationale: בגד विश्वास तोड़ने या छलपूर्वक विश्वासघात करने की सक्रिय धारणा देता है; क्रियात्मक हिन्दी मूल कृदंत के भाव को बनाए रखती है।
- source_word: רֵיקָם
  choice: अकारण
  rationale: यहाँ רֵיקָם को बिना उचित कारण या आधार के किए गए विश्वासघात के रूप में समझा गया है; शब्द की अन्य सम्भव व्याख्याएँ पादटिप्पणी में दी गई हैं।
