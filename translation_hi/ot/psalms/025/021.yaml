  text: Integrity and uprightness may preserve me[b][a], for I wait for you.
translation:
  language: hi
  text: खराई और सीधाई मेरी रक्षा करें[a], क्योंकि मैं तेरी बाट जोहता हूँ[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “खराई और सीधाई मेरी रक्षा करेंगी”; इस संदर्भ में इब्रानी क्रिया प्रार्थना अथवा भरोसे से भरी अपेक्षा—दोनों व्यक्त कर सकती है।
    reason: lexical_alternative
  - marker: b
    text: या, “मैं तुझ पर आशा रखता हूँ”; इब्रानी क्रिया में आशा के साथ प्रतीक्षा करने का भाव है।
    reason: lexical_alternative
lexical_decisions:
- source_word: תֹּם
  choice: खराई
  rationale: यह शब्द नैतिक संपूर्णता, निष्कपटता और निर्दोष चाल का भाव रखता है। ‘खराई’ आधुनिक हिन्दी में स्वाभाविक है और पूर्ण पापहीनता का दावा किए बिना चरित्र की अखंडता व्यक्त करता है।
- source_word: וָיֹשֶׁר
  choice: और सीधाई
  rationale: יֹשֶׁר का मूल भाव ‘सीधा होना’ है और यहाँ उसका नैतिक अर्थ है। ‘सीधाई’ ‘खराई’ के साथ काव्यात्मक जोड़ी बनाए रखती है।
- source_word: יִצְּרוּנִי
  choice: मेरी रक्षा करें
  rationale: נצר का अर्थ संभालना, पहरा देना या सुरक्षित रखना है। प्रार्थना के संदर्भ में हिन्दी का विधिलिंग ‘करें’ इच्छा/विनती को व्यक्त करता है; इब्रानी रूप आश्वस्त अपेक्षा भी जता सकता है, जिसे पाद-टिप्पणी में रखा गया है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले कथन का आधार बताता है। ‘क्योंकि’ आधुनिक हिन्दी में संबंध को स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
- source_word: קִוִּיתִיךָ
  choice: मैं तेरी बाट जोहता हूँ
  rationale: קוה आशापूर्ण प्रतीक्षा को व्यक्त करता है। ‘बाट जोहता हूँ’ प्रतीक्षा और अपेक्षा दोनों को स्वाभाविक, गरिमापूर्ण हिन्दी में रखता है; ‘तुझ पर आशा रखता हूँ’ संभव विकल्प है।
theological_decisions:
- issue: क्या भजनकार अपने नैतिक गुणों को आत्म-अर्जित पुण्य और उद्धार का आधार बताता है?
  choice: पद को इस विनती के रूप में रखा गया है कि खराई और सीधाई उसकी रक्षा करें, साथ ही उसका आशापूर्ण प्रतीक्षा करना परमेश्वर की ओर निर्देशित है।
  alternative: इसे अधिक प्रबल पुण्य-आधारित दावे के रूप में समझना कि भजनकार अपनी धार्मिकता के कारण छुटकारे का अधिकारी है।
  rationale: इब्रानी पाठ नैतिक गुणों को रक्षा करने वाले कर्ता के रूप में रखता है और साथ ही परमेश्वर की बाट जोहने की बात कहता है। अनुवाद इस तनाव को बनाए रखता है और न आत्म-धार्मिकता जोड़ता है, न नैतिक भाषा को नरम करता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और काव्यात्मक रूप। परमेश्वर के लिए एकवचन आत्मीय संबोधन ‘तेरी’ रखा गया है। ‘खराई और सीधाई’ निकटार्थक नैतिक गुणों की इब्रानी काव्यात्मक जोड़ी को सुरक्षित रखता है।
