translation_notes:
  register: भाषा आधुनिक, सरल और प्रार्थनामय रखी गई है। संबोधन में निकटता और विनती का भाव बनाए रखने के लिए एकवचन अनौपचारिक आज्ञार्थक “फिर” और “कर” प्रयुक्त हैं। दोनों पादटिप्पणी-चिह्न संबंधित विशेषणों के बाद मुख्य पाठ में दिए गए हैं।
