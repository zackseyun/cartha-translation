  text: Turn to me and be gracious to me[b][a], for I am lonely and afflicted.
translation:
  language: hi
  text: मेरी ओर मुड़ और मुझ पर अनुग्रह कर, क्योंकि मैं अकेला[a] और पीड़ित[b] हूँ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “एकाकी” या “अलग-थलग।” इब्रानी शब्द יָחִיד का अर्थ “अकेला” या “एकाकी” भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या “गरीब” अथवा “उत्पीड़ित।” इब्रानी शब्द עָנִי आर्थिक गरीबी, सामाजिक उत्पीड़न या सामान्य कष्ट की दशा बता सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: פְּנֵה אֵלַי
  choice: मेरी ओर फिर
  rationale: פנה का पुल्लिंग एकवचन आज्ञार्थक रूप, אֵלַי के साथ, परमेश्वर से प्रार्थना में वक्ता की ओर ध्यान देने और मुड़ने की विनती व्यक्त करता है। यह हिंदी में स्वाभाविक रहते हुए मूल दिशा-बोध बनाए रखता है।
- source_word: וְחָנֵּנִי
  choice: और मुझ पर अनुग्रह कर
  rationale: חנן का आज्ञार्थक रूप कृपा या अनुग्रह दिखाने की विनती है। “अनुग्रह कर” दैवी कृपा का भाव रखता है और “दया कर” की अपेक्षा मूल शब्द के कृपा-पक्ष को अधिक स्पष्ट करता है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यह विनती का कारण प्रस्तुत करता है; आधुनिक हिंदी में “क्योंकि” कारण-संबंध को स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: יָחִיד
  choice: अकेला
  rationale: विलाप के संदर्भ में יָחִיד अलग-थलग या अकेले होने का बोध देता है। “अकेला” भावनात्मक अकेलेपन और वस्तुगत रूप से अकेले होने—दोनों संभावनाओं को खुला रखता है।
- source_word: וְעָנִי
  choice: और दुःखी
  rationale: עָנִי गरीबी, दबे-कुचले होने या व्यापक कष्ट की दशा सूचित कर सकता है। “दुःखी” इस व्यक्तिगत विलाप में व्यापक पीड़ा को सहज हिंदी में व्यक्त करता है, जबकि वैकल्पिक अर्थ पादटिप्पणी में सुरक्षित हैं।
- source_word: אָנִי
  choice: मैं ... हूँ
  rationale: स्वतंत्र सर्वनाम वक्ता पर बल देता है। हिंदी में विधेय विशेषणों के साथ “मैं ... हूँ” स्वाभाविक वाक्य-विन्यास है।
