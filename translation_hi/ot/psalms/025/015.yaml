  text: My eyes are continually toward Yahweh[a], for he will bring my feet out of the net.
translation:
  language: hi
  text: 'मेरी आँखें निरन्तर याहवे की ओर लगी रहती हैं,

    क्योंकि वही मेरे पैरों को जाल से बाहर निकालेगा।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עֵינַי
  choice: मेरी आँखें
  rationale: शाब्दिक बहुवचन और प्रथम पुरुष एकवचन प्रत्यय को बनाए रखते हुए इब्रानी की ठोस दृष्टि-छवि सुरक्षित रखता है।
- source_word: תָּמִיד
  choice: निरन्तर
  rationale: लगातार और अभ्यस्त रूप से ध्यान लगाए रहने का भाव स्वाभाविक, गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: אֶל
  choice: की ओर लगी रहती हैं
  rationale: आँखों के साथ दिशा और एकाग्र ध्यान—दोनों को सहज हिन्दी मुहावरे में व्यक्त करता है।
- source_word: יְהוָה
  choice: यहवे
  rationale: चतुरक्षरीय ईश्वरीय नाम को किसी उपाधि से बदलने के बजाय हिन्दी में उसका प्रचलित निकट लिप्यन्तरण प्रस्तुत करता है।
- source_word: כִּי
  choice: क्योंकि
  rationale: दूसरे चरण को पहले चरण में व्यक्त भरोसे का कारण स्पष्ट रूप से दर्शाता है।
- source_word: הוּא
  choice: वही
  rationale: स्वतन्त्र सर्वनाम के बल को हिन्दी में स्वाभाविक ढंग से सुरक्षित रखता है।
- source_word: יוֹצִיא
  choice: बाहर निकालेगा
  rationale: हिफ़ील रूप के ‘बाहर ले आना/निकालना’ अर्थ तथा फँसाव से ठोस मुक्ति की छवि को बनाए रखता है।
- source_word: מֵרֶשֶׁת
  choice: जाल से
  rationale: מִן उपसर्ग के ‘से’ और רֶשֶׁת के प्रत्यक्ष अर्थ ‘जाल’ को संक्षेप और स्पष्टता से व्यक्त करता है।
- source_word: רַגְלָי
  choice: मेरे पैरों को
  rationale: शरीरगत बहुवचन छवि को बनाए रखता है और जाल में फँसे पैरों की तस्वीर स्पष्ट करता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहवे
  alternative: यहोवा; प्रभु
  rationale: मूल में व्यक्तिगत वाचा-नाम सीधे आया है; उसे उपाधि से बदलने के बजाय लिप्यन्तरित करना स्रोत के स्वरूप को सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; काव्यात्मक पर सरल और गरिमापूर्ण। ‘आँखें ... की ओर लगी रहती हैं’ मूल ठोस बिम्ब को स्वाभाविक हिन्दी मुहावरे से जोड़ता है। ‘वही’ सर्वनाम הוּא के हल्के बल को व्यक्त करता है।
