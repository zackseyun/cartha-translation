  text: שָׁמְרָ֣/ה נַ֭פְשִׁ/י וְ/הַצִּילֵ֑/נִי אַל אֵ֝ב֗וֹשׁ כִּֽי חָסִ֥יתִי בָֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/025/020.yaml
  text: Guard my life and rescue me; let me not be put to shame, for I take refuge in you.
translation:
  language: hi
  text: मेरे जीवन की रक्षा कर और मुझे छुड़ा ले; मुझे लज्जित न होने दे, क्योंकि मैंने तुझमें शरण ली है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נַפְשִׁי
  choice: मेरे प्राण
  rationale: यहाँ נֶפֶשׁ पूरे जीवित व्यक्ति अथवा जीवन को दर्शाता है। ‘मेरे प्राण’ काव्यात्मक और स्वाभाविक हिंदी में व्यक्ति के जीवन की रक्षा की विनती को व्यक्त करता है।
- source_word: וְהַצִּילֵנִי
  choice: और मुझे छुड़ा ले
  rationale: נצל के हिफ़ील रूप में संकट या शत्रु से बचाने अथवा छुड़ाने का भाव है; ‘छुड़ा ले’ विनती की निकटता और तात्कालिकता बनाए रखता है।
- source_word: אַל אֵבוֹשׁ
  choice: मुझे लज्जित न होने दे
  rationale: בוש केवल आंतरिक संकोच नहीं, बल्कि भरोसा विफल होने पर सार्वजनिक अपमान या निराशा का भाव भी रख सकता है। यह हिंदी वाक्य उस व्यापक अर्थ को खुला रखता है।
- source_word: חָסִיתִי בָךְ
  choice: मैंने तुझमें शरण ली है
  rationale: חסה में सुरक्षा के लिए किसी की शरण लेना निहित है। पूर्ण क्रिया को ‘ली है’ से प्रस्तुत करने पर पूर्व में किए गए और वर्तमान तक प्रासंगिक भरोसे का भाव बना रहता है।
theological_decisions:
- issue: נֶפֶשׁ को ‘आत्मा’, ‘जीवन’ या ‘प्राण’ के रूप में प्रस्तुत करना
  choice: मेरे प्राण
  alternative: मेरे जीवन / मेरी आत्मा
  rationale: संदर्भ में प्रार्थी अपने पूरे जीवित अस्तित्व की रक्षा माँगता है। ‘आत्मा’ शरीर से पृथक सत्ता का अनावश्यक अर्थ ला सकती है, जबकि ‘प्राण’ काव्यात्मक रूप से जीवन और व्यक्ति दोनों के भाव को सुरक्षित रखता है।
- issue: בוש में लज्जा और आशाभंग की अर्थ-छाया
  choice: मुझे लज्जित न होने दे
  alternative: मेरी आशा को विफल न होने दे
  rationale: प्रत्यक्ष लज्जा-वाची भाषा मूल के अधिक निकट है और परिणामस्वरूप अपमान, निराशा तथा भरोसे के विफल दिखने की संभावित अर्थ-छायाओं को सीमित नहीं करती।
translation_notes:
  register: आधुनिक मानक हिंदी में संक्षिप्त, प्रार्थनात्मक और काव्यात्मक शैली। परमेश्वर के लिए एकवचन आत्मीय संबोधन ‘तू’ के तिर्यक रूप ‘तुझमें’ का प्रयोग भजन-साहित्य की गरिमा और निकटता के अनुरूप है।
