source:
  edition: WLC
  text: שָׁפְטֵ֤/נִי אֱלֹהִ֨ים וְ/רִ֘יבָ֤/ה רִיבִ֗/י מִ/גּ֥וֹי לֹא חָסִ֑יד מֵ֤/אִישׁ מִרְמָ֖ה וְ/עַוְלָ֣ה תְפַלְּטֵֽ/נִי׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/043/001.yaml
  text: Vindicate me[a], O God, and plead my cause against an unfaithful nation; deliver me from the deceitful and unjust man.
translation:
  language: hi
  text: हे परमेश्वर, मुझे न्याय दिला और निष्ठाहीन[a] जाति के विरुद्ध मेरा मुक़दमा लड़; धोखेबाज़ और अन्यायी मनुष्य से मुझे छुड़ा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “भक्तिहीन”; इब्रानी में शाब्दिक भाव है, “ऐसी जाति जो निष्ठावान या वफ़ादार नहीं है।”
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁפְטֵנִי
  choice: मुझे न्याय दिला
  rationale: यह प्रार्थना केवल जाँच या दंड की नहीं, बल्कि प्रार्थी के पक्ष में न्यायिक निर्णय की विनती है। यह पदबंध उस न्यायालयीन भाव को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: אֱלֹהִים
  choice: हे परमेश्वर
  rationale: प्रत्यक्ष प्रार्थनात्मक संबोधन के लिए ‘हे परमेश्वर’ स्वाभाविक और गरिमापूर्ण हिन्दी है।
- source_word: וְרִיבָה רִיבִי
  choice: और मेरा मुक़दमा लड़
  rationale: क्रिया और उसी मूल की संज्ञा से बना इब्रानी पदबंध किसी का कानूनी मामला अपने हाथ में लेने का भाव देता है; ‘मेरा मुक़दमा लड़’ न्यायालयीन रूपक को स्पष्ट और स्वाभाविक रखता है।
- source_word: מִגּוֹי לֹא חָסִיד
  choice: विश्वासघाती जाति के विरुद्ध
  rationale: यहाँ पूर्वसर्ग कानूनी विवाद के विरोधी पक्ष को दर्शाता है। नकारा हुआ חָסִיד निष्ठा अथवा वफ़ादारी के अभाव को व्यक्त करता है, इसलिए ‘विश्वासघाती’ उपयुक्त है।
- source_word: מֵאִישׁ מִרְמָה וְעַוְלָה
  choice: कपटी और अन्यायी मनुष्य से
  rationale: अमूर्त संज्ञाएँ उस मनुष्य के चरित्र को बताती हैं। यह अनुवाद छल और अन्याय दोनों गुणों तथा मूल के एकवचन को बनाए रखता है।
- source_word: תְפַלְּטֵנִי
  choice: मुझे छुड़ा
  rationale: पिएल रूप किसी को संकट से निकालकर सुरक्षित करने की विनती व्यक्त करता है; ‘छुड़ा’ वर्तमान हिन्दी में स्पष्ट और प्रार्थना के अनुरूप है।
theological_decisions:
- issue: नकारात्मक पदबंध לֹא חָסִיד का अनुवाद
  choice: विश्वासघाती
  alternative: भक्तिहीन; निष्ठाहीन
  rationale: חָסִיד का संबंध निष्ठावान प्रेम और वफ़ादारी से है। ‘विश्वासघाती’ इसके संबंधपरक और नैतिक भाव को सामने रखता है, जबकि पादटिप्पणी दूसरी सम्भव समझ को सुरक्षित रखती है।
translation_notes:
  register: भाषा आधुनिक, प्रार्थनात्मक और गरिमापूर्ण रखी गई है। न्यायालयीन रूपक को ‘न्याय दिला’ और ‘मुक़दमा लड़’ के द्वारा स्पष्ट रखा गया है; किसी विशिष्ट सांप्रदायिक अर्थ को नहीं जोड़ा गया।
