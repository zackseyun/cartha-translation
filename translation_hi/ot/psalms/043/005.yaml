source:
  edition: WLC
  text: מַה תִּשְׁתּ֬וֹחֲחִ֨י נַפְשִׁ/י֮ וּֽ/מַה תֶּהֱמִ֪י עָ֫לָ֥/י הוֹחִ֣ילִי לֵֽ֭/אלֹהִים כִּי ע֣וֹד אוֹדֶ֑/נּוּ יְשׁוּעֹ֥ת פָּ֝נַ֗/י וֵֽ/אלֹהָֽ/י־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/043/005.yaml
  text: Why are you cast down[a], O my soul, and why are you in turmoil within me? Hope in God, for I will yet praise him[b], the salvation of my countenance and my God.
translation:
  language: hi
  text: हे मेरे प्राण, तू क्यों निराश है, और मेरे भीतर क्यों व्याकुल है? परमेश्वर पर आशा रख, क्योंकि मैं फिर उसकी स्तुति करूँगा—वही मेरे मुख का उद्धार[a] और मेरा परमेश्वर है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वही मेरे मुख को उठानेवाला और मेरा परमेश्वर है।” इब्रानी में शाब्दिक रूप से “मेरे मुख के उद्धार और मेरा परमेश्वर” है; संभवतः आशय है कि परमेश्वर निराशा से झुके हुए मुख को फिर उठा देता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּשְׁתּוֹחֲחִי
  choice: तू क्यों निराश है
  rationale: क्रिया झुक जाने या हताश होने का बिंब देती है। आधुनिक हिन्दी में ‘निराश’ आंतरिक दशा को स्वाभाविक ढंग से व्यक्त करता है; मुख के नीचे झुकने का बिंब पद के अंतिम वाक्यांश में बना रहता है।
- source_word: נַפְשִׁי
  choice: हे मेरे प्राण
  rationale: נֶפֶשׁ यहाँ कवि के अंतर्मन/स्वयं को संबोधित करता है। ‘प्राण’ भजन-साहित्य के अनुरूप, संक्षिप्त और समझने योग्य है।
- source_word: תֶּהֱמִי עָלָי
  choice: मेरे भीतर क्यों व्याकुल है
  rationale: תֶּהֱמִי आंदोलन और अशांति बताता है; עָלָי शाब्दिक रूप से ‘मुझ पर’ है, पर आत्म-संबोधन में हिन्दी का ‘मेरे भीतर’ आशय को स्वाभाविक रूप से व्यक्त करता है।
- source_word: הוֹחִילִי לֵאלֹהִים
  choice: परमेश्वर पर आशा रख
  rationale: आज्ञार्थक क्रिया धीरज के साथ अपेक्षा रखने का आह्वान करती है। ‘आशा रख’ आधुनिक हिन्दी का सहज समतुल्य है।
- source_word: כִּי עוֹד אוֹדֶנּוּ
  choice: क्योंकि मैं फिर उसकी स्तुति करूँगा
  rationale: עוֹד वर्तमान संकट के बाद भावी स्तुति की ओर संकेत करता है। यहाँ ‘फिर’ हिन्दी में उस प्रत्याशा को स्पष्ट करता है; אוֹדֶנּוּ को भजन के आराधनात्मक प्रसंग में ‘उसकी स्तुति करूँगा’ किया गया है।
- source_word: יְשׁוּעוֹת פָּנַי
  choice: मेरे मुख का उद्धार
  rationale: इब्रानी का निकट रूप ‘मेरे मुख के उद्धार’ है। हिन्दी में ‘मेरे मुख का उद्धार’ असामान्य किंतु बोधगम्य बिंब को बचाता है और परमेश्वर द्वारा झुके मुख को पुनः उठाने की संभावना को बिना व्याख्यात्मक विस्तार के बनाए रखता है।
- source_word: וֵאלֹהָי
  choice: और मेरा परमेश्वर
  rationale: संयोजक וְ को उसके सामान्य योगात्मक अर्थ में रखा गया है, जिससे मसोराई पाठ की वाक्य-संरचना सुरक्षित रहती है।
theological_decisions:
- issue: יְשׁוּעוֹת פָּנַי की व्याख्या
  choice: वही मेरे मुख का उद्धार और मेरा परमेश्वर है
  alternative: वही मेरे मुख को उठानेवाला और मेरा परमेश्वर है
  rationale: मसोराई पाठ शाब्दिक रूप से ‘मेरे मुख के उद्धार और मेरा परमेश्वर’ कहता है। मुख्य पाठ में उसके असामान्य ठोस बिंब को रखा गया है; अधिक व्याख्यात्मक विकल्प पादटिप्पणी में दिया गया है, ताकि यह तनाव बना रहे कि वाक्यांश उद्धार, सहायता या झुके मुख की पुनर्स्थापना की ओर संकेत कर सकता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण काव्यात्मक स्तर रखा गया है। आत्म-संबोधन के कारण एकवचन ‘तू’ स्वाभाविक है। ‘प्राण’, ‘स्तुति’ और ‘उद्धार’ परिचित बाइबिलीय शब्द हैं, जबकि वाक्य-विन्यास को यथासंभव वर्तमान और सहज रखा गया है।
