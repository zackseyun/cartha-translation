  yaml_path: translation/ot/psalms/043/004.yaml
  text: Then I will go to the altar of God[a], to God, the joy of my rejoicing; and I will praise you with the lyre, O God[b], my God.
translation:
  language: hi
  text: तब मैं परमेश्वर की वेदी के पास, उस परमेश्वर के पास जाऊँगा जो मेरे उल्लास का आनंद है[a]; और हे परमेश्वर, मेरे परमेश्वर, मैं लायर नामक तंतुवाद्य के साथ तेरी स्तुति करूँगा[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “मेरे उल्लास का आनंद।” यह आनंद व्यक्त करने वाले दो निकटार्थी इब्रानी शब्दों को जोड़कर विशेष बल देता है; अर्थ “मेरा परम आनंद” भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी किन्नोर एक प्राचीन तंतुवाद्य था, जो सम्भवतः आधुनिक हार्प की अपेक्षा लायर जैसा था।
    reason: cultural_note
lexical_decisions:
- source_word: וְאָבוֹאָה
  choice: तब मैं ... जाऊँगा
  rationale: प्रथम पुरुष का यह रूप पूर्ववर्ती विनतियों के इच्छित परिणाम या दृढ़ संकल्प को व्यक्त करता है। संदर्भ में ‘तब’ स्वाभाविक क्रम दिखाता है।
- source_word: אֶל מִזְבַּח אֱלֹהִים
  choice: परमेश्वर की वेदी के पास
  rationale: यह संबंधवाचक रचना को स्पष्ट और स्वाभाविक हिन्दी में व्यक्त करता है; אֶל के कारण वेदी की ओर जाने का भाव बना रहता है।
- source_word: אֶל אֵל
  choice: उस परमेश्वर के पास
  rationale: אֵל यहाँ אֱלֹהִים के समानांतर परमेश्वर के लिए प्रयुक्त उपाधि है। ‘उस’ हिन्दी में अगले विशेषणात्मक कथन से इसे सहजता से जोड़ता है।
- source_word: שִׂמְחַת גִּילִי
  choice: मेरे उल्लास का आनंद
  rationale: इब्रानी में आनंद के दो निकटार्थी शब्दों की दोहरी अभिव्यक्ति है। यह अनुवाद उसकी काव्यात्मक तीव्रता को अस्वाभाविक बने बिना सुरक्षित रखता है।
- source_word: וְאוֹדְךָ
  choice: मैं ... तेरी स्तुति करूँगा
  rationale: ידה का यह रूप धन्यवाद देने या स्तुति करने का अर्थ दे सकता है; वाद्य-संगीत सहित सार्वजनिक उपासना के प्रसंग में ‘स्तुति’ उपयुक्त है।
- source_word: בְכִנּוֹר
  choice: वीणा बजाकर
  rationale: כִּנּוֹר प्राचीन तंतुवाद्य था, आधुनिक हार्प के ठीक समान नहीं। हिन्दी में ‘वीणा’ निकटतम सहज सांस्कृतिक समतुल्य है; पादटिप्पणी ऐतिहासिक भेद स्पष्ट करती है।
- source_word: אֱלֹהִים אֱלֹהָי
  choice: हे परमेश्वर, मेरे परमेश्वर
  rationale: ‘हे’ प्रत्यक्ष संबोधन को स्वाभाविक हिन्दी में स्पष्ट करता है और पुनरुक्ति व्यक्तिगत भक्ति का बल बनाए रखती है।
theological_decisions:
- issue: אֱלֹהִים और אֵל जैसी दोहराई गई ईश्वरीय उपाधियों का अनुवाद
  choice: दोनों के लिए ‘परमेश्वर’, और दूसरे स्थान पर सहज संबंध के लिए ‘उस परमेश्वर’
  alternative: אֵל को ‘सामर्थी परमेश्वर’ कहना या ‘एल’ लिप्यंतरित करना
  rationale: यहाँ अलग ईश्वरीय व्यक्तियों या किसी विशेष सिद्धान्त का भेद नहीं, बल्कि परमेश्वर के लिए काव्यात्मक समानांतर उपाधियाँ हैं। एक ही हिन्दी शब्द संदर्भ और पुनरुक्ति दोनों को स्पष्ट रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘तेरी’ भजन की सीधी, व्यक्तिगत प्रार्थना का भाव व्यक्त करती है। काव्यात्मक दोहरे आनंद-वाक्यांश को मुख्य पाठ में सुरक्षित रखा गया है और उसके अधिक मुहावरेदार अर्थ को पादटिप्पणी में दिया गया है।
