source:
  edition: WLC
  text: כִּֽי אַתָּ֤ה אֱלֹהֵ֣י מָֽעוּזִּ/י֮ לָ/מָ֪ה זְנַ֫חְתָּ֥/נִי לָֽ/מָּה קֹדֵ֥ר אֶתְהַלֵּ֗ךְ בְּ/לַ֣חַץ אוֹיֵֽב־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/043/002.yaml
  text: For you are the God of my refuge[b][a]; why have you rejected me? Why do I go about mourning under the oppression of the enemy?
translation:
  language: hi
  text: क्योंकि आप ही मेरी शरण के परमेश्वर हैं[a]; आपने मुझे क्यों ठुकरा दिया है? शत्रु के अत्याचार के दबाव में मैं शोक में क्यों फिरता हूँ?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘मेरे दृढ़ गढ़ के परमेश्वर’ अथवा ‘मेरी सामर्थ्य के परमेश्वर।’ इब्रानी संज्ञा प्रसंग के अनुसार शरण, दृढ़ गढ़ या सामर्थ्य का अर्थ दे सकती है।
    reason: lexical_alternative
  - marker: b
    text: या ‘शत्रु के अत्याचार के दबाव में मैं अँधेरा-सा होकर क्यों फिरता हूँ?’ इब्रानी में शाब्दिक रूप से अँधेरा या मलिन होकर फिरने की बात है, जो शोक का मुहावरेदार चित्र है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह भजनकार की विनती का आधार प्रस्तुत करता है और इब्रानी के कारणसूचक अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: אֱלֹהֵי מָעוּזִּי
  choice: मेरी शरण के परमेश्वर
  rationale: מָעוֹז सुरक्षा देने वाली शरण, दृढ़ गढ़ या सामर्थ्य का बोध करा सकता है। यहाँ ‘शरण’ रक्षात्मक बिंब और संबंधवाचक रचना—‘मेरी शरण के परमेश्वर’—दोनों को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: לָמָה
  choice: क्यों
  rationale: दोनों प्रश्नों में इसकी पुनरावृत्ति विलाप की काव्यात्मक और प्रश्नात्मक तीव्रता को बनाए रखती है।
- source_word: זְנַחְתָּנִי
  choice: आपने मुझे ठुकरा दिया है
  rationale: זנח अस्वीकार करने या दूर कर देने का भाव रखता है। ‘ठुकरा दिया’ आधुनिक हिन्दी में स्पष्ट और गंभीर है, पर पूर्णतः त्याग देने का अतिरिक्त अर्थ अनिवार्य नहीं बनाता।
- source_word: קֹדֵר
  choice: शोक में
  rationale: इसका मूल बिंब अँधेरा या मलिन हो जाना है और प्रसंग में यह शोक की दशा का मुहावरेदार संकेत है। ‘शोक में’ मुख्य अर्थ को स्पष्ट करता है; शाब्दिक बिंब पादटिप्पणी में सुरक्षित है।
- source_word: אֶתְהַלֵּךְ
  choice: मैं ... फिरता हूँ
  rationale: हित्पाएल अपूर्ण रूप लगातार चलने-फिरने या उसी दशा में बने रहने का भाव देता है। ‘फिरता हूँ’ हिन्दी में इस निरंतर अनुभव को स्वाभाविक रूप से व्यक्त करता है।
- source_word: בְּלַחַץ
  choice: अत्याचार के कारण
  rationale: לַחַץ दबाव, उत्पीड़न या अत्याचार को दर्शाता है। בְּ को यहाँ परिस्थिति अथवा कारण के रूप में समझना सम्भव है; ‘के कारण’ प्रश्न के भाव को सहज हिन्दी में जोड़ता है।
- source_word: אוֹיֵב
  choice: शत्रु
  rationale: एकवचन किसी ज्ञात या प्रतिनिधि विरोधी को सूचित करता है। ‘शत्रु’ संक्षिप्त, प्रतिष्ठित और प्रसंगानुकूल है।
theological_decisions:
- issue: विलाप में परमेश्वर द्वारा ठुकराए जाने की भाषा
  choice: ‘आपने मुझे क्यों ठुकरा दिया है?’ को सीधे बनाए रखा गया है।
  alternative: ‘आपने मुझे क्यों छोड़ दिया है?’ या शिकायत को केवल भजनकार की भावना बताकर नरम करना।
  rationale: इब्रानी पाठ परमेश्वर से सीधा और तीखा प्रश्न करता है। अनुवाद को अनुभूत ईश्वरीय दूरी और परमेश्वर को शरण मानने के बीच का तनाव समझाकर समाप्त नहीं करना चाहिए।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की है, पर भजन की गरिमा और सीधे संबोधन को बनाए रखती है। ‘आप’ आदरपूर्ण ईश्वरीय संबोधन है; ‘परमेश्वर’, ‘शरण’, ‘शत्रु’ और ‘अत्याचार’ सामान्य पाठक के लिए स्पष्ट रहते हुए काव्यात्मक स्तर बनाए रखते हैं।
