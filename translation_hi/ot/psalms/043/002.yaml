  source_fidelity: The draft accurately retains the causal opening, the emphatic divine address, both rhetorical questions, and the direct lament that God has rejected the psalmist. ‘ठुकरा दिया है’ appropriately conveys זְנַחְתָּנִי. The final phrase, however, renders בְּלַחַץ as a cause (‘के कारण’) rather than the psalmist’s oppressive circumstance; ‘के दबाव में’ more closely reflects the Hebrew and the English audit trail.
  naturalness: The verse is clear and suitably dignified in modern Hindi. ‘शत्रु के अत्याचार के दबाव में’ is a more idiomatic and precise expression than treating the oppression simply as a reason. ‘शोक में क्यों फिरता हूँ’ naturally conveys the mourning sense of קֹדֵר.
  terminology: ‘परमेश्वर,’ ‘शरण,’ ‘ठुकरा दिया,’ ‘शोक,’ and ‘शत्रु’ are appropriate register choices. The lexical-alternative notes are retained, with footnote b adjusted to match the revised main-text relationship.
