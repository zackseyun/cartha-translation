id: PSA.43.3
reference: Psalms 43:3
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: שְׁלַח אוֹרְ/ךָ֣ וַ֭/אֲמִתְּ/ךָ הֵ֣מָּה יַנְח֑וּ/נִי יְבִיא֥וּ/נִי אֶל הַֽר קָ֝דְשְׁ/ךָ֗ וְ/אֶל מִשְׁכְּנוֹתֶֽי/ךָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/043/003.yaml
  text: Send out your light and your truth[a]; let them lead me[b]; let them bring me to your holy mountain and to your dwelling places.
translation:
  language: hi
  text: अपना प्रकाश और अपनी सच्चाई[a] भेज; वे ही मेरा मार्गदर्शन करें, वे मुझे तेरे पवित्र पर्वत और तेरे निवास-स्थानों[b] तक ले आएँ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘अपनी विश्वासयोग्यता’; इब्रानी शब्द का अर्थ सच्चाई, भरोसेमंदी या निष्ठा हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में ‘निवास-स्थान’ बहुवचन में है; परंपरागत अनुवादों में ‘तेरे तंबू’ भी मिलता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁלַח
  choice: भेज
  rationale: यह שׁלח का पुल्लिंग एकवचन आज्ञार्थक रूप है। ‘भेज’ सीधी प्रार्थनात्मक पुकार को स्वाभाविक और संक्षिप्त रूप में रखता है।
- source_word: אוֹרְךָ
  choice: अपना प्रकाश
  rationale: אוֹר का मूल अर्थ ‘प्रकाश’ है। प्रसंग में मार्गदर्शन और उद्धार के संकेत संभव हैं, पर मुख्य पाठ में ठोस काव्यात्मक बिंब सुरक्षित रखा गया है।
- source_word: אֲמִתְּךָ
  choice: अपनी सच्चाई
  rationale: אֱמֶת में सत्य, विश्वसनीयता और निष्ठा का अर्थ-क्षेत्र है। ‘सच्चाई’ सीधा और सहज है, जबकि ‘विश्वासयोग्यता’ का संभावित अर्थ पादटिप्पणी में सुरक्षित है।
- source_word: הֵמָּה
  choice: वे ही
  rationale: स्वतंत्र बहुवचन सर्वनाम का बल ‘वे ही’ से व्यक्त होता है और प्रकाश तथा सच्चाई के काव्यात्मक मानवीकरण को बनाए रखता है।
- source_word: יַנְחוּנִי
  choice: मेरा मार्गदर्शन करें
  rationale: נחה के हिफ़ील रूप में मार्ग दिखाने या अगुवाई करने का भाव है। आज्ञा के बाद इसका इच्छार्थक बल ‘करें’ से स्वाभाविक रूप में व्यक्त होता है।
- source_word: יְבִיאוּנִי
  choice: मुझे ... तक ले आएँ
  rationale: בוא का हिफ़ील रूप यहाँ किसी को गंतव्य तक पहुँचाने का अर्थ देता है। ‘ले आएँ’ वक्ता को परमेश्वर की उपस्थिति की ओर पहुँचाए जाने की गति को व्यक्त करता है।
- source_word: הַר קָדְשְׁךָ
  choice: तेरे पवित्र पर्वत
  rationale: शाब्दिक संरचना ‘तेरी पवित्रता का पर्वत’ है, जिसका स्वाभाविक हिन्दी रूप ‘तेरा पवित्र पर्वत’ है। पाठ में सिय्योन नाम जोड़कर संकेत को अनावश्यक रूप से निश्चित नहीं किया गया।
- source_word: מִשְׁכְּנוֹתֶיךָ
  choice: तेरे निवास-स्थानों
  rationale: מִשְׁכָּן का यह बहुवचन रूप है। ‘निवास-स्थान’ आधुनिक पाठक के लिए स्पष्ट है और मूल का बहुवचन भी बचाए रखता है।
theological_decisions:
- issue: ‘प्रकाश’ और ‘सच्चाई’ को गुणों के रूप में समझाया जाए या काव्यात्मक कर्ताओं के रूप में रखा जाए
  choice: बहुवचन ‘वे ही ... करें’ और ‘वे ... ले आएँ’ के द्वारा काव्यात्मक मानवीकरण सुरक्षित रखा गया है।
  alternative: इन्हें परमेश्वर के उद्धारकारी मार्गदर्शन की व्याख्यात्मक अभिव्यक्ति बनाना।
  rationale: इब्रानी में स्वतंत्र बहुवचन सर्वनाम और बहुवचन क्रियाएँ स्पष्ट रूप से ‘प्रकाश’ और ‘सच्चाई’ की ओर लौटती हैं; इसलिए इस काव्यात्मक तनाव को समझाकर समाप्त नहीं किया गया।
- issue: पवित्र पर्वत और निवास-स्थानों को सिय्योन तथा मंदिर के रूप में स्पष्ट करना
  choice: मुख्य पाठ में व्यापक मूल बिंब ‘तेरा पवित्र पर्वत’ और ‘तेरे निवास-स्थान’ रखा गया है।
  alternative: ‘सिय्योन’ या ‘तेरा मंदिर’ कहना।
  rationale: ऐतिहासिक संकेत संभवतः सिय्योन और पवित्रस्थान की ओर है, पर इब्रानी पाठ स्वयं व्यापक काव्यात्मक पदों का प्रयोग करता है; अधिक विशिष्ट पहचान जोड़ना अनुवाद से आगे चला जाता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और प्रार्थनात्मक है। परमेश्वर के लिए एकवचन आत्मीय संबोधन ‘तेरे’ रखा गया है। ‘वे ही’ मूल के बलाघात और मानवीकरण को बनाए रखता है; धार्मिक रूप से अधिक तकनीकी ‘मिलापवाले तंबू’ या व्याख्यात्मक ‘मंदिर’ से परहेज़ किया गया है।
