source:
  edition: WLC
  text: וַ/אֲנִ֤י עָנִ֣י וְ/אֶבְיוֹן֮ אֱלֹהִ֪ים חֽוּשָׁ֫/ה לִּ֥/י עֶזְרִ֣/י וּ/מְפַלְטִ֣/י אַ֑תָּה יְ֝הוָ֗ה אַל תְּאַחַֽר׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/070/005.yaml
  text: But as for me[a], I am poor and needy; O God, hurry to me. You are my help and my deliverer; O Yahweh[b], do not delay.
translation:
  language: hi
  text: परन्तु मैं दीन और जरूरतमंद हूँ; हे परमेश्वर, मेरी ओर शीघ्र आ[a]। तू मेरा सहायक और मेरा छुड़ानेवाला है; हे याहवे[b], देर न कर।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी का अर्थ ‘मेरे लिए शीघ्रता कर’ भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: 'इब्रानी: YHWH; इसका उच्चारण निश्चित रूप से ज्ञात नहीं है। ‘यहोवा’ एक अन्य प्रचलित हिन्दी रूप है।'
    reason: alternative_reading
lexical_decisions:
- source_word: וַאֲנִי
  choice: परन्तु मैं
  rationale: संयोजक और सर्वनाम पिछले कथन से भजनकार की अपनी दशा की ओर विरोधात्मक मोड़ दिखाते हैं।
- source_word: עָנִי וְאֶבְיוֹן
  choice: दीन और जरूरतमंद
  rationale: यह प्रचलित इब्रानी शब्द-युग्म अभाव, दुर्बलता और संकट की दशा बताता है; दोनों शब्दों का भेद हिन्दी में बनाए रखा गया है।
- source_word: אֱלֹהִים
  choice: हे परमेश्वर
  rationale: यहाँ शब्द प्रत्यक्ष संबोधन में है; ‘हे’ प्रार्थना की पुकार को स्वाभाविक रूप से व्यक्त करता है।
- source_word: חוּשָׁה לִי
  choice: मेरे पास शीघ्र आ
  rationale: आज्ञार्थक रूप तत्काल कार्रवाई की विनती करता है। לִי को लक्ष्यसूचक मानकर ‘मेरे पास’ किया गया है, जबकि ‘मेरे लिए शीघ्रता कर’ भी सम्भव है।
- source_word: עֶזְרִי
  choice: मेरा सहायक
  rationale: עֵזֶר सहायता अथवा सहायक दोनों अर्थ दे सकता है; व्यक्ति को सीधे संबोधित करते हुए ‘सहायक’ स्वाभाविक हिन्दी है।
- source_word: וּמְפַלְטִי
  choice: और मुझे छुड़ानेवाला
  rationale: פלט से बना यह रूप उस व्यक्ति को दर्शाता है जो संकट से निकालता या बचाता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: मूल पाठ में परमेश्वर का व्यक्तिगत नाम YHWH है; ‘याहवे’ उसका प्रचलित विद्वत्तापूर्ण लिप्यंतरण है।
- source_word: אַל תְּאַחַר
  choice: देर न कर
  rationale: निषेधात्मक रूप कार्रवाई को न टालने की अत्यावश्यक विनती व्यक्त करता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; अथवा परम्परागत प्रतिस्थापन ‘यहोवा प्रभु’/‘प्रभु’
  rationale: पद में उपाधि नहीं, चार अक्षरों वाला व्यक्तिगत नाम YHWH आया है। ‘याहवे’ नाम को नाम के रूप में सुरक्षित रखता है; स्वरांकन की ऐतिहासिक अनिश्चितता को पादटिप्पणी में स्पष्ट किया गया है।
- issue: חוּשָׁה לִי में गति या सहायता का आशय
  choice: मेरे पास शीघ्र आ
  alternative: मेरे लिए शीघ्रता कर
  rationale: לִי को व्यक्ति की ओर लक्ष्य के रूप में समझना सन्दर्भ में स्वाभाविक है, पर इब्रानी वाक्यांश परमेश्वर से भजनकार के लिए शीघ्र कार्रवाई की विनती भी हो सकता है; इसलिए वैकल्पिक अर्थ सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, सहज और प्रार्थनापूर्ण रखी गई है। ‘दीन’, ‘सहायक’ और ‘छुड़ानेवाला’ गरिमापूर्ण किन्तु सामान्यतः समझे जाने वाले शब्द हैं। एकवचन प्रत्यक्ष संबोधन में ‘तू’ मूल इब्रानी की निकटता और विनती की तीव्रता को बनाए रखता है।
