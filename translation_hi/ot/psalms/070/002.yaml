review_pass:
  verdict: revise
  source_fidelity: The draft correctly preserves the imprecatory/jussive force, the hostile sense of seeking the psalmist’s נפש, the retreat imagery, and the malicious delight in the speaker’s harm. However, “मेरे प्राण के खोजी” is not idiomatic modern Hindi and does not communicate the life-threatening idiom as clearly as the Hebrew context requires.
  naturalness: “मेरे प्राण के खोजी” and especially “निरादर पाएँ” are awkward in modern standard Hindi. “मेरी जान के पीछे पड़े हैं” naturally expresses a hostile attempt on one’s life, and “लज्जित हों” is a natural rendering for the final shame verb.
  terminology: “जान” is appropriate here for נפש in a life-threatening context and avoids the misleading spiritual sense that “आत्मा” could suggest. “लज्जित,” “शर्मिंदा,” and “अपमानित” retain the linked yet non-identical shame vocabulary without importing interpretive claims.
  issues:
  - severity: medium
    issue: “मेरे प्राण के खोजी” is unnatural and insufficiently transparent.
    rationale: Although formally close to the Hebrew wording, this phrase is not standard contemporary Hindi for persons seeking someone’s life. “मेरी जान के पीछे पड़े हैं” conveys the idiomatic hostile sense clearly.
  - severity: low
    issue: “निरादर पाएँ” is an unnatural verbal collocation in this context.
    rationale: The Hebrew calls for public shame/disgrace. “लज्जित हों” is natural Hindi and faithfully conveys the result, even though it overlaps semantically with the preceding clause.
  revised_text: जो मेरी जान के पीछे पड़े हैं, वे लज्जित और शर्मिंदा हों; जो मेरी हानि से प्रसन्न होते हैं, वे पीछे हटें और अपमानित हों।
  revised_footnotes: []
