id: PSA.70.2
reference: Psalms 70:2
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: יֵבֹ֣שׁוּ וְ/יַחְפְּרוּ֮ מְבַקְשֵׁ֪י נַ֫פְשִׁ֥/י יִסֹּ֣גוּ אָ֭חוֹר וְ/יִכָּלְמ֑וּ חֲ֝פֵצֵ֗י רָעָתִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/070/002.yaml
  text: Let those who seek my life be put to shame and confounded[a]; let those who delight in my harm turn back and be disgraced.
translation:
  language: hi
  text: जो मेरी जान के पीछे पड़े हैं, वे लज्जित और शर्मिंदा हों; जो मेरी हानि से प्रसन्न होते हैं, वे पीछे हटें और अपमानित हों।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יֵבֹשׁוּ
  choice: लज्जित हों
  rationale: בוש यहाँ लज्जा उठाने या लज्जित होने को व्यक्त करता है; प्रार्थनात्मक कामना के अनुरूप ‘हों’ रखा गया है।
- source_word: וְיַחְפְּרוּ
  choice: और अपमानित हों
  rationale: חפר लज्जा और अपमान का अनुभव करने का अर्थ देता है; यह पहले क्रियापद के समानार्थी बल को बनाए रखता है, पर उसे उसी शब्द में नहीं समेटता।
- source_word: מְבַקְשֵׁי נַפְשִׁי
  choice: जो मेरे प्राण के खोजी हैं
  rationale: נפש जीवन, प्राण या स्वयं व्यक्ति को सूचित कर सकता है। ‘मेरे प्राण के खोजी’ हिन्दी में जान लेने के लिए घात लगाने का भाव व्यक्त करता है और मूल रूपक को भी बनाए रखता है।
- source_word: יִסֹּגוּ אָחוֹר
  choice: वे पीछे हटें
  rationale: סוג אחור का अर्थ पीछे हटना या लौट जाना है; ‘पीछे हटें’ संक्षिप्त और स्वाभाविक है।
- source_word: וְיִכָּלְמוּ
  choice: और निरादर पाएँ
  rationale: כלם सार्वजनिक अपमान और अनादर का भाव रखता है। ‘निरादर पाएँ’ पहले खंड के लज्जा-संबंधी शब्दों से अनावश्यक पुनरावृत्ति बचाता है।
- source_word: חֲפֵצֵי רָעָתִי
  choice: जो मेरी हानि से प्रसन्न होते हैं
  rationale: חפץ इच्छा या प्रसन्नता दोनों का भाव दे सकता है, और רעה यहाँ वक्ता पर आने वाली हानि/विपत्ति है, उसका नैतिक दोष नहीं। यह चयन दुर्भावनापूर्ण प्रसन्नता को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: क्रियाओं का प्रार्थनात्मक/कामनात्मक बल
  choice: ‘हों,’ ‘हटें’ और ‘पाएँ’ द्वारा प्रार्थना या कामना के रूप में प्रस्तुत करना
  alternative: 'साधारण भविष्यवाणी: ‘वे लज्जित होंगे ...’'
  rationale: भजन की प्रार्थनात्मक परिस्थिति में ये अपूर्ण क्रियारूप केवल भविष्यवाणी नहीं, बल्कि विनती या कामना व्यक्त करते हैं। हिन्दी संभावनार्थक रूप इस तनाव को बिना निश्चित भविष्यवाणी बनाए सुरक्षित रखता है।
- issue: נפש का अर्थ
  choice: ‘प्राण’—जीवन पर घात का भाव रखते हुए मूल शब्द की व्यापकता सुरक्षित
  alternative: ‘जीवन’ या ‘मुझे’
  rationale: नפש व्यक्ति के जीवन अथवा स्वयं व्यक्ति को सूचित कर सकता है। ‘प्राण’ इस जीवन-संकट के संदर्भ में स्वाभाविक है और अर्थ को केवल अमूर्त ‘आत्मा’ तक सीमित नहीं करता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, काव्यात्मक किंतु सामान्य पाठक के लिए सुबोध रखी गई है। समानांतर लज्जा-संबंधी क्रियाओं के भिन्न रंग बनाए गए हैं और इब्रानी की कामनात्मक प्रार्थना को हिन्दी संभावनार्थक रूपों में व्यक्त किया गया है।
