  yaml_path: translation/ot/psalms/070/004.yaml
  text: Let all who seek you rejoice and be glad in you[a]; let those who love your salvation say continually[b], “May God be magnified!”
translation:
  language: hi
  text: जो तुझे खोजते हैं, वे सब तुझमें हर्षित और आनन्दित हों; जो तेरे उद्धार से प्रेम करते हैं, वे निरन्तर कहते रहें, “परमेश्वर महान ठहरे!”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “परमेश्वर की महिमा हो” अथवा “परमेश्वर की महिमा बढ़े।” इब्रानी में यह परमेश्वर की महानता के विषय में इच्छा अथवा जयघोष है।
    reason: lexical_alternative
lexical_decisions:
- source_word: יָשִׂישׂוּ וְיִשְׂמְחוּ
  choice: आनन्दित और मगन हों
  rationale: दोनों समानार्थी क्रियाओं के काव्यात्मक समानांतर को अलग किंतु स्वाभाविक हिन्दी पदों से बनाए रखता है; पहली क्रिया उल्लास और दूसरी प्रसन्नता व्यक्त करती है।
- source_word: בְּךָ
  choice: तुझमें
  rationale: यहाँ בְּ को आनन्द के क्षेत्र या आधार के रूप में समझते हुए मूल की भक्तिपरक अभिव्यक्ति को सुरक्षित रखा गया है।
- source_word: כָּל מְבַקְשֶׁיךָ
  choice: जितने तुझे खोजते हैं, वे सब
  rationale: सहभागी रूप से व्यक्त, परमेश्वर को खोजने वाले पूरे वर्ग का स्वाभाविक आधुनिक हिन्दी रूप।
- source_word: וְיֹאמְרוּ תָמִיד
  choice: वे निरन्तर कहते रहें
  rationale: अपूर्ण क्रिया और תָמִיד से व्यक्त लगातार या बार-बार होने वाली उद्घोषणा को स्पष्ट करता है।
- source_word: יִגְדַּל אֱלֹהִים
  choice: परमेश्वर की महिमा बढ़े
  rationale: גדל के इच्छार्थक/उद्घोषणात्मक बल को स्वाभाविक हिन्दी में रखता है; इसे केवल तथ्यात्मक कथन नहीं बनाता।
- source_word: אֹהֲבֵי יְשׁוּעָתֶךָ
  choice: जो तेरे उद्धार से प्रेम रखते हैं
  rationale: יְשׁוּעָה के व्यापक धार्मिक अर्थ को ‘उद्धार’ से व्यक्त करता है, जबकि संकट से छुटकारे का आशय भी संदर्भ में संभव रहता है।
theological_decisions:
- issue: יְשׁוּעָה का अर्थ
  choice: उद्धार
  alternative: छुटकारा
  rationale: इब्रानी शब्द तत्काल संकट से बचाव और व्यापक उद्धार दोनों को सूचित कर सकता है। ‘उद्धार’ व्यापक अर्थ सुरक्षित रखता है, पर किसी विशिष्ट धर्मसैद्धान्तिक प्रणाली को नहीं थोपता।
- issue: יִגְדַּל אֱלֹהִים का वाच्यार्थ
  choice: परमेश्वर की महिमा बढ़े
  alternative: परमेश्वर महान है / परमेश्वर महान ठहरे
  rationale: यह रूप इच्छा अथवा जयघोष व्यक्त करता है, केवल वर्णनात्मक कथन नहीं। ‘महिमा बढ़े’ परमेश्वर की महानता की सार्वजनिक प्रशंसा का भाव स्वाभाविक हिन्दी में देता है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और भक्तिपरक हिन्दी। परमेश्वर को सीधे सम्बोधन में एकवचन ‘तू/तेरा’ रूप रखा गया है, जैसा हिन्दी बाइबिल-काव्य में स्वाभाविक है। काव्यात्मक समानांतरता और इच्छार्थक क्रियाओं को स्पष्ट रखा गया है।
