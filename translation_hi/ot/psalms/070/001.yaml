  text: אֱלֹהִ֥ים לְ/הַצִּילֵ֑/נִי יְ֝הוָ֗ה לְ/עֶזְרָ֥תִ/י חֽוּשָֽׁ/ה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/070/001.yaml
  text: O God[a], deliver me; O Yahweh, hurry to help me.
translation:
  language: hi
  text: हे परमेश्वर, मुझे बचा ले; हे याहवे, मेरी सहायता के लिए शीघ्र आ।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֱלֹהִים
  choice: हे परमेश्वर
  rationale: यह प्रार्थना में सीधा संबोधन है; ‘हे’ संबोधन को स्वाभाविक रूप से व्यक्त करता है।
- source_word: לְהַצִּילֵנִי
  choice: मुझे बचा ले
  rationale: हिफ़ील रूप संकट से छुड़ाने या बचाने की याचना व्यक्त करता है; यह वाक्यांश आधुनिक हिन्दी में सहज है और अर्थ को केवल आत्मिक उद्धार तक सीमित नहीं करता।
- source_word: יְהוָה
  choice: हे यहोवा
  rationale: इब्रानी चतुरक्षरीय ईश-नाम को उपाधि से बदलने के बजाय प्रचलित हिन्दी लिप्यंतरण ‘यहोवा’ द्वारा व्यक्त किया गया है।
- source_word: לְעֶזְרָתִי
  choice: मेरी सहायता के लिए
  rationale: לְ के साथ עֶזְרָה सहायता के उद्देश्य की ओर आने का भाव देता है; यह हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: חוּשָׁה
  choice: शीघ्र आ
  rationale: क्रिया तत्काल कार्रवाई की आग्रहपूर्ण पुकार है। हिन्दी में केवल ‘जल्दी कर’ की अपेक्षा ‘शीघ्र आ’ सहायता के लिए आने के निहित भाव को सहज रूप से व्यक्त करता है।
theological_decisions:
- issue: ईश-नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: मूल पाठ व्यक्तिगत ईश-नाम का प्रयोग करता है। ‘यहोवा’ आधुनिक हिन्दी बाइबलीय प्रयोग में पहचाना जाने वाला लिप्यंतरण है और इसे केवल उपाधि ‘प्रभु’ से प्रतिस्थापित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, प्रार्थनात्मक और गरिमापूर्ण रखी गई है। एकवचन निकट संबोधन के अनुरूप ‘बचा ले’ और ‘आ’ प्रयुक्त हैं; इससे विनती की तात्कालिकता बनी रहती है।
