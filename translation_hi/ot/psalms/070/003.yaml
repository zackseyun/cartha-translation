  register: आधुनिक मानक हिन्दी का संक्षिप्त, गरिमापूर्ण और प्रार्थनात्मक काव्य-स्वर रखा गया है। पदक्रम को हिन्दी में स्वाभाविक बनाने के लिए उपहास करने वालों की पहचान पहले और उनके लिए की गई कामना बाद में रखी गई है।
