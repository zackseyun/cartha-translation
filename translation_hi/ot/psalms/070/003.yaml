source:
  edition: WLC
  text: יָ֭שׁוּבוּ עַל עֵ֣קֶב בָּשְׁתָּ֑/ם הָ֝/אֹמְרִ֗ים הֶ֘אָ֥ח הֶאָֽח־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/070/003.yaml
  text: Let them turn back because of their shame[a], those who say, “Aha, aha!”
translation:
  language: hi
  text: 'जो “आहा! आहा!” कहते हैं,

    वे अपनी लज्जा के कारण पीछे हट जाएँ।[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वे अपनी लज्जा के कारण लौट जाएँ।”
    reason: יָשׁוּבוּ का अर्थ सामान्य रूप से “लौट जाएँ” भी हो सकता है; प्रसंग में “पीछे हट जाएँ” विरोधियों की पराजित वापसी को अधिक स्वाभाविक ढंग से व्यक्त करता है।
lexical_decisions:
- source_word: יָשׁוּבוּ
  choice: पीछे हट जाएँ
  rationale: שׁוב का क़ाल अपूर्ण रूप यहाँ कामनासूचक/प्रार्थनात्मक बल रखता है। “पीछे हट जाएँ” विरोधियों के लौटने या पीछे हटने का सीधा और स्वाभाविक भाव देता है; कर्मवाच्य अर्थ को अनावश्यक रूप से नहीं जोड़ता।
- source_word: עַל עֵקֶב
  choice: के कारण
  rationale: यह पदबंध यहाँ कारण या परिणाम बताता है। “के कारण” आधुनिक हिन्दी में स्पष्ट और सहज है; शाब्दिक रूप से “एड़ी” लाने पर मुहावरे का अर्थ अस्पष्ट हो जाएगा।
- source_word: בָּשְׁתָּם
  choice: अपनी लज्जा
  rationale: यह शब्द लज्जा, अपमान या तिरस्कार की अवस्था को व्यक्त करता है। “अपनी लज्जा” संक्षिप्त है और मूल के संबंधसूचक प्रत्यय “उनकी” को हिन्दी की वाक्य-रचना में स्वाभाविक आत्मवाचक रूप से व्यक्त करता है।
- source_word: הָאֹמְרִים
  choice: जो … कहते हैं
  rationale: संज्ञा के रूप में प्रयुक्त निश्चित कृदंत उस समूह को उनके लगातार या विशेषतापूर्ण कथन से पहचानता है। “जो … कहते हैं” इसका स्वाभाविक हिन्दी रूप है।
- source_word: הֶאָח הֶאָח
  choice: आहा! आहा!
  rationale: दोहराया गया विस्मयादिबोधक शब्द दुर्भावनापूर्ण प्रसन्नता या उपहास प्रकट करता है। “आहा! आहा!” मूल की पुनरुक्ति और ताने के स्वर को बनाए रखता है।
theological_decisions: []
