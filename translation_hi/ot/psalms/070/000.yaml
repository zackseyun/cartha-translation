lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: संगीत-निर्देशक के लिए
  rationale: भजन-संग्रह के शीर्षकों में यह पद संगीत या गायन का नेतृत्व करने वाले व्यक्ति को सूचित करता है। ‘संगीत-निर्देशक’ आधुनिक हिन्दी में स्वाभाविक है, और उपसर्ग לַ का प्रयोजनात्मक भाव ‘के लिए’ से व्यक्त होता है।
- source_word: לְדָוִד
  choice: दाऊद का
  rationale: यहाँ לְ संबंध, रचनाकार, समर्पण या संग्रहगत संबद्धता बता सकता है। ‘दाऊद का’ इस बहुअर्थकता को ‘दाऊद द्वारा रचित’ की अपेक्षा अधिक सुरक्षित रखता है।
- source_word: לְהַזְכִּיר
  choice: स्मरण के लिए
  rationale: זכר के हिफ़ील क्रियारूप का अर्थ स्मरण कराना या स्मरण में लाना है। शीर्षक में संक्षिप्त ‘स्मरण के लिए’ प्रयोजन का भाव रखता है, पर यह तय नहीं करता कि किसे या क्या स्मरण कराया जाना है।
theological_decisions:
- issue: शीर्षक में לְהַזְכִּיר का उपासना-संबंधी आशय
  choice: तटस्थ प्रयोजन-सूचक पदबंध ‘स्मरण के लिए’
  alternative: स्मारक अर्पण के लिए; परमेश्वर को स्मरण दिलाने के लिए; उपासक के स्मरण के लिए
  rationale: इब्रानी पाठ यह नहीं बताता कि स्मरण किसका है या किसे कराया जाना है। तटस्थ अनुवाद संभावित उपासना-विधिक अर्थ को खुला रखता है और किसी विशिष्ट धर्मवैज्ञानिक व्याख्या को आरोपित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त भजन-शीर्षक शैली अपनाई गई है। ‘दाऊद का’ जानबूझकर संक्षिप्त रखा गया है, ताकि इब्रानी לְ की लेखकत्व, संबंध या समर्पण संबंधी अस्पष्टता बनी रहे।
