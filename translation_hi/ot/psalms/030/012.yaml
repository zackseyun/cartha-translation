  text: לְמַ֤עַן יְזַמֶּרְ/ךָ֣ כָ֭בוֹד וְ/לֹ֣א יִדֹּ֑ם יְהוָ֥ה אֱ֝לֹהַ֗/י לְ/עוֹלָ֥ם אוֹדֶֽ/ךָּ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/030/012.yaml
  text: so that my glory may sing praise to you and not be silent. O Yahweh my God[a], I will give thanks to you forever.
translation:
  language: hi
  text: ताकि मेरी महिमा[a] आपका गुणगान करे और चुप न रहे। हे याहवे, मेरे परमेश्वर, मैं सदा आपका धन्यवाद करूँगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अथवा, “ताकि मेरा पूरा अस्तित्व आपका गुणगान करे।” इब्रानी में “मेरी महिमा” है—यह एक काव्यात्मक अभिव्यक्ति है, जो भजनकार के भीतरी अस्तित्व या उसकी जीभ की ओर संकेत कर सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: לְמַעַן
  choice: ताकि
  rationale: यह उद्देश्य या परिणाम का परिचय देता है; ‘ताकि’ आधुनिक हिन्दी में इसके प्रयोजनार्थक बल को स्वाभाविक रूप से व्यक्त करता है।
- source_word: יְזַמֶּרְךָ
  choice: आपका गुणगान करे
  rationale: זמר का पिएल रूप संगीत के साथ स्तुति करने या गुणगान करने का अर्थ देता है। ‘गुणगान करे’ संगीतमय और स्तुतिपरक दोनों भावों को व्यक्त करता है।
- source_word: כָבוֹד
  choice: मेरी महिमा
  rationale: शब्द का मूल अर्थ ‘महिमा/सम्मान’ है। यहाँ यह काव्यात्मक रूप से भजनकार के भीतरी अस्तित्व, संपूर्ण व्यक्तित्व या जीभ की ओर संकेत कर सकता है। मुख्य पाठ में मूल रूपक रखा गया है और व्याख्यात्मक विकल्प पादटिप्पणी में दिया गया है।
- source_word: וְלֹא יִדֹּם
  choice: और चुप न रहे
  rationale: דמם का अर्थ चुप या स्थिर रहना हो सकता है; गुणगान के साथ विरोध होने के कारण यहाँ ‘चुप न रहे’ उपयुक्त है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी ईश्वरीय व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय हिन्दी लिपि में लिप्यंतरित किया गया है।
- source_word: אֱלֹהַי
  choice: मेरे परमेश्वर
  rationale: यह प्रथम पुरुष एकवचन संबंधसूचक रूप है और प्रसंग में सीधे संबोधन के रूप में प्रयुक्त हुआ है।
- source_word: לְעוֹלָם
  choice: सदा
  rationale: यह निरंतर और चिरस्थायी अवधि व्यक्त करता है; ‘सदा’ हिन्दी में संक्षिप्त, स्वाभाविक और गरिमापूर्ण है।
- source_word: אוֹדֶךָּ
  choice: मैं आपका धन्यवाद करूँगा
  rationale: ידה के हिफ़ील रूप का यहाँ अर्थ धन्यवाद देना और प्रशंसापूर्वक स्वीकार करना है; भजन के धन्यवादपरक प्रसंग में ‘धन्यवाद करूँगा’ उपयुक्त है।
theological_decisions:
- issue: स्तुति करने वाले कर्ता के रूप में כָבוֹד की व्याख्या
  choice: मुख्य पाठ में शाब्दिक काव्यात्मक रूपक ‘मेरी महिमा’ रखा गया है
  alternative: ‘मेरा पूरा अस्तित्व’, ‘मेरी आत्मा’ या ‘मेरी जीभ’
  rationale: इब्रानी पाठ में כָבוֹד है और काव्यात्मक प्रयोग में इसका सटीक संकेत विवादित है। इसलिए मुख्य पाठ में अस्पष्टता और रूपक सुरक्षित रखे गए हैं तथा अधिक व्याख्यात्मक अर्थ पादटिप्पणी में दिए गए हैं।
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा या ‘प्रभु’
  rationale: व्यक्तिगत वाचा-नाम की उपस्थिति स्पष्ट रखने के लिए उसे उपाधि से बदलने के बजाय लिप्यंतरित किया गया है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की है। ईश्वर के लिए आदरसूचक ‘आप’ का प्रयोग किया गया है। काव्यात्मक ‘मेरी महिमा’ को जानबूझकर मुख्य पाठ में रखा गया है, जबकि उसका संभावित अर्थ पादटिप्पणी में स्पष्ट किया गया है।
