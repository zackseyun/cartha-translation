  text: तूने मेरे विलाप को मेरे लिए नृत्य में बदल दिया; तूने मेरा टाट का वस्त्र खोल दिया और मुझे आनन्द से कमर कस दी।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִסְפְּדִי
  choice: मेरा विलाप
  rationale: यह शब्द शोक मनाने और उसके बाहरी प्रदर्शन का बोध कराता है; ‘विलाप’ पद के नृत्य-विरोधी समानान्तर को स्पष्ट रखता है।
- source_word: לְמָחוֹל לִי
  choice: मेरे लिए नृत्य में
  rationale: לִי को अनदेखा न करके ‘मेरे लिए’ के रूप में रखा गया है, और מָחוֹל का सीधा अर्थ ‘नृत्य’ है।
- source_word: פִּתַּחְתָּ שַׂקִּי
  choice: तूने मेरा टाट का वस्त्र खोल दिया
  rationale: פּתח का मूल भाव खोलना या ढीला करना है; שַׂקִּי शोक में पहना जाने वाला मेरा टाट का वस्त्र है। यह अनुवाद शोक-वस्त्र खोले जाने की ठोस छवि बनाए रखता है।
- source_word: וַתְּאַזְּרֵנִי שִׂמְחָה
  choice: और मुझे आनन्द का कमरबन्द बाँध दिया
  rationale: אָזַר का अर्थ कमर बाँधना या कमरबन्द पहनाना है। ‘आनन्द का कमरबन्द’ वस्त्र-संबंधी रूपक को स्वाभाविक हिन्दी में बनाए रखता है।
theological_decisions:
- issue: परमेश्वर को एकवचन निकट संबोधन
  choice: तूने
  alternative: आपने
  rationale: इब्रानी क्रियाएँ दूसरे पुरुष एकवचन में हैं। भजन की सीधी, व्यक्तिगत और काव्यात्मक प्रार्थना-भाषा के अनुरूप ‘तूने’ रखा गया है; यह अनादर नहीं, निकट संबोधन व्यक्त करता है।
translation_notes:
  register: भाषा आधुनिक, काव्यात्मक और गरिमापूर्ण रखी गई है। ‘टाट का वस्त्र’ शोक-वेश को स्पष्ट करता है, जबकि ‘आनन्द का कमरबन्द’ मूल इब्रानी के वस्त्र-रूपक और समानान्तरता को सुरक्षित रखता है।
