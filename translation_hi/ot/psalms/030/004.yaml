language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: זַמְּר֣וּ לַ/יהוָ֣ה חֲסִידָ֑י/ו וְ֝/הוֹד֗וּ לְ/זֵ֣כֶר קָדְשֽׁ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/030/004.yaml
  text: Sing praise to Yahweh[a], you his faithful ones[c][b], and give thanks to the remembrance of his holiness.
translation:
  language: hi
  text: याहवे का स्तुतिगान करो, हे उसके भक्तो, और उसकी पवित्रता के स्मरण में धन्यवाद दो।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: זַמְּרוּ
  choice: स्तुतिगान करो
  rationale: पिएल बहुवचन आज्ञार्थक यहाँ उपासना में संगीत के साथ स्तुति गाने का भाव देता है; ‘स्तुतिगान करो’ संगीतमय और स्तुतिपरक दोनों पक्ष व्यक्त करता है।
- source_word: לַיהוָה
  choice: यहोवा का
  rationale: इब्रानी चतुरक्षरीय नाम יהוה को हिन्दी में प्रचलित व्यक्तिवाचक रूप ‘यहोवा’ से व्यक्त किया गया है; ‘स्तुतिगान करो’ के साथ स्वाभाविक हिन्दी कारक-रचना के कारण ‘का’ आया है।
- source_word: חֲסִידָיו
  choice: उनके भक्तो
  rationale: חסיד उन लोगों को सूचित करता है जो परमेश्वर के प्रति निष्ठावान और धर्मपरायण हैं। ‘भक्त’ आधुनिक हिन्दी में सहज है और ‘संत’ की संभावित संस्थागत संकीर्णता से बचता है; संबोधन को स्पष्ट करने के लिए ‘भक्तो’ रखा गया है।
- source_word: וְהוֹדוּ
  choice: और धन्यवाद दो
  rationale: ידה का हिफ़ील आज्ञार्थक स्तुति के प्रसंग में सामान्यतः धन्यवाद देने का अर्थ रखता है।
- source_word: לְזֵכֶר
  choice: स्मरण पर
  rationale: זֵכֶר का अर्थ स्मरण, स्मृति या उल्लेख हो सकता है। ‘स्मरण पर’ לְ के प्रसंगगत अर्थ को स्वाभाविक हिन्दी में रखता है और इसे केवल मौखिक उल्लेख तक सीमित नहीं करता।
- source_word: קָדְשׁוֹ
  choice: उनकी पवित्रता
  rationale: קדש पर तृतीय पुरुष एकवचन प्रत्यय का सीधा अर्थ ‘उनकी पवित्रता’ है। ‘पवित्र नाम’ अर्थ की सम्भावना बताता है, पर ‘नाम’ मूल पाठ में नहीं है।
theological_decisions:
- issue: दिव्य नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ में चतुरक्षरीय दिव्य नाम सीधे आया है। हिन्दी पाठकों में व्यापक रूप से पहचाने जाने वाले ‘यहोवा’ को चुना गया है, जबकि ‘याहवे’ अधिक संभावित विद्वत्तापरक उच्चारण है।
- issue: חֲסִידָיו का धार्मिक आशय
  choice: भक्तो
  alternative: निष्ठावान लोगो / पवित्र जनो
  rationale: यह शब्द परमेश्वर से निष्ठापूर्ण संबंध और धर्मपरायणता दोनों को समेटता है। ‘भक्तो’ इस संबंधपरक धार्मिक भाव को सहज हिन्दी में व्यक्त करता है, बिना किसी विशिष्ट सम्प्रदाय की संत-संबंधी धारणा आरोपित किए।
- issue: לְזֵכֶר קָדְשׁוֹ का आशय
  choice: उनकी पवित्रता के स्मरण पर
  alternative: उनके पवित्र नाम के उल्लेख पर
  rationale: मूल में ‘नाम’ नहीं है और पदबंध स्मरण, स्मृति अथवा उल्लेख की ओर संकेत कर सकता है। मुख्य पाठ अधिक शाब्दिक अर्थ रखता है और संभावित ‘पवित्र नाम’ की व्याख्या नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सामूहिक उपासना-संगत संबोधन। सर्वनाम के लिए आदरसूचक बहुवचन ‘उनका/उनकी’ रखा गया है।
