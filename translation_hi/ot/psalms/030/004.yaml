  rationale: The revision aligns the divine name with the current POB Yahweh policy and replaces an unnatural postposition with idiomatic modern Hindi. It preserves the plural imperatives, the direct address to Yahweh’s faithful devotees, and the deliberately non-expanded expression “his holiness.” No footnote is required because the revised main text does not introduce an interpretive expansion.
