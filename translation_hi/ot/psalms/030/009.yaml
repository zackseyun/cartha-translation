  text: What profit is there in my blood[c][b][a], in my going down to the pit? Will the dust praise you? Will it declare your faithfulness?
translation:
  language: hi
  text: मेरे लहू से क्या लाभ होगा[a], गड्ढे में उतरने से? क्या धूल तेरी स्तुति करेगी? क्या वह तेरी विश्वासयोग्यता[c] का वर्णन करेगी?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मेरी मृत्यु से क्या लाभ होगा?” इब्रानी में शाब्दिक रूप से, “मेरे लहू से क्या लाभ होगा?”
    reason: lexical_alternative
  - marker: c
    text: या, “सत्य।” इब्रानी शब्द का अर्थ “सत्य” या “विश्वासयोग्यता” हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: מַה בֶּצַע
  choice: क्या लाभ होगा
  rationale: यह इब्रानी मुहावरा किसी परिणाम से होने वाले लाभ या फ़ायदे पर अलंकारिक प्रश्न करता है; यह चयन संक्षिप्त और स्वाभाविक है।
- source_word: בְּדָמִי
  choice: मेरे लहू से
  rationale: मूल का ठोस चित्र ‘मेरे लहू’ सुरक्षित रखा गया है; प्रसंग में यह मृत्यु या रक्त बहाए जाने की ओर संकेत करता है।
- source_word: בְּרִדְתִּי אֶל שָׁחַת
  choice: मेरे गड्ढे में उतरने से
  rationale: यह उतरने की गति और मृत्यु के गड्ढे की काव्यात्मक छवि दोनों को बनाए रखता है।
- source_word: שָׁחַת
  choice: गड्ढा
  rationale: यहाँ शब्द मृत्यु की ओर उतरने के गड्ढे को दर्शाता है; ‘कब्र’ संभव है, पर अधिक व्याख्यात्मक है।
- source_word: הֲיוֹדְךָ עָפָר
  choice: क्या धूल तेरी स्तुति करेगी
  rationale: ידה का परमेश्वर की ओर निर्देशित भजन-संदर्भ में स्वाभाविक अर्थ ‘स्तुति करना’ है; ‘धूल’ मृत मनुष्य की दशा का सजीव लक्षणालंकार है।
- source_word: הֲיַגִּיד
  choice: क्या वह ... का वर्णन करेगी
  rationale: क्रिया किसी बात को बताने या घोषित करने का भाव देती है; ‘वर्णन करेगी’ यहाँ हिंदी काव्य में सहज है।
- source_word: אֲמִתֶּךָ
  choice: तेरी विश्वासयोग्यता
  rationale: אמת का अर्थ सत्य या विश्वासयोग्यता हो सकता है; इस प्रार्थनात्मक संदर्भ में परमेश्वर की भरोसेमंद निष्ठा प्रमुख है।
theological_decisions:
- issue: मृत्यु की छवियों को स्पष्ट व्याख्या में बदलना या उनकी काव्यात्मक ठोसता बनाए रखना
  choice: मुख्य पाठ में ‘लहू,’ ‘गड्ढा’ और ‘धूल’ की ठोस छवियाँ सुरक्षित रखी गईं
  alternative: ‘मृत्यु,’ ‘कब्र’ और ‘मरे हुए’ जैसे अधिक व्याख्यात्मक शब्द
  rationale: पद का तर्क है कि भजनकार की मृत्यु से उसकी स्तुति रुक जाएगी, पर इब्रानी इसे मृत्यु की सजीव छवियों द्वारा व्यक्त करता है। उन्हें सुरक्षित रखना मूल की काव्यात्मकता और धर्मवैचारिक तनाव दोनों बनाए रखता है।
- issue: אֲמִתֶּךָ को ‘सत्य’ या ‘विश्वासयोग्यता’ कहना
  choice: विश्वासयोग्यता
  alternative: सत्य
  rationale: दोनों अर्थ संभव हैं; परमेश्वर के चरित्र और उसकी भरोसेमंद निष्ठा की स्तुति के संदर्भ में ‘विश्वासयोग्यता’ अधिक उपयुक्त है, जबकि विकल्प पादटिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण काव्यात्मक शैली रखी गई है। परमेश्वर के लिए एकवचन आत्मीय संबोधन ‘तेरी’ प्रयुक्त है, जो भजन की सीधी प्रार्थना के अनुकूल है। मूल की अलंकारिक प्रश्न-रचना और मृत्यु-संबंधी ठोस बिंब सुरक्षित हैं।
