base_translation:
  language: en
  yaml_path: translation/ot/psalms/030/001.yaml
  text: I will exalt you[a], O Yahweh, because you have drawn me up and have not let my enemies rejoice over me.
translation:
  language: hi
  text: 'हे याहवे, मैं तेरा गुणगान करूँगा,

    क्योंकि तूने मुझे ऊपर खींच निकाला

    और मेरे शत्रुओं को मुझ पर हर्षित नहीं होने दिया।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֲרוֹמִמְךָ
  choice: मैं तुझे ऊँचा उठाऊँगा
  rationale: רום के स्तुतिपरक अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है और मूल की ऊर्ध्व दिशा वाली छवि बनाए रखता है।
- source_word: יְהוָה
  choice: हे यहोवा
  rationale: चतुरक्षरीय दिव्य नाम को किसी उपाधि से बदलने के बजाय हिन्दी में प्रचलित लिप्यंतरण ‘यहोवा’ द्वारा प्रस्तुत किया गया है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यह स्तुति का कारण प्रस्तुत करता है; आधुनिक हिन्दी में सीधा और स्पष्ट है।
- source_word: דִלִּיתָנִי
  choice: तूने मुझे गहरे गड्ढे से खींच निकाला
  rationale: דלה की किसी कुएँ या गड्ढे से ऊपर खींचने की ठोस छवि को स्पष्ट, सहज हिन्दी में सुरक्षित रखता है; ‘गहरे गड्ढे से’ मूल क्रिया में निहित रूपक को व्यक्त करता है।
- source_word: וְלֹא שִׂמַּחְתָּ
  choice: और ... आनन्द मनाने नहीं दिया
  rationale: 'हिब्रू के कारक रूप को हिन्दी में स्वाभाविक रीति से व्यक्त करता है: परमेश्वर ने शत्रुओं को विजय का आनन्द प्राप्त नहीं होने दिया।'
- source_word: אֹיְבַי לִי
  choice: मेरे शत्रुओं को मुझ पर
  rationale: אֹיְבַי का सीधा अर्थ ‘मेरे शत्रु’ है और לִי यहाँ भजनकार पर शत्रुओं की विजय अथवा उसके अहित पर उल्लास का संबंध दर्शाता है।
theological_decisions:
- issue: दिव्य नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ में व्यक्तिगत दिव्य नाम है। हिन्दी बाइबलीय प्रयोग में ‘यहोवा’ व्यापक और सामान्य पाठकों के लिए परिचित लिप्यंतरण है; इसे ‘प्रभु’ जैसी उपाधि से नहीं बदला गया।
- issue: דִלִּיתָנִי में उद्धार की रूपकात्मक छवि
  choice: गहरे गड्ढे से खींच निकाला
  alternative: मुझे ऊपर उठाया
  rationale: मूल क्रिया कुएँ या गड्ढे से कुछ खींचने की छवि जगाती है। मुख्य पाठ में इस छवि को स्पष्ट किया गया है, जबकि पादटिप्पणी अधिक सामान्य विकल्प देती है; इसे किसी विशिष्ट ऐतिहासिक संकट तक सीमित नहीं किया गया।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सहज हिन्दी। परमेश्वर के लिए निकट संबोधन ‘तू’ भजन की प्रत्यक्ष प्रार्थनात्मक शैली और हिन्दी बाइबल-काव्य की परंपरा के अनुरूप है। काव्य-पंक्तियाँ मूल वाक्य के स्तुति और उसके दो कारणों वाले प्रवाह को स्पष्ट करती हैं।
