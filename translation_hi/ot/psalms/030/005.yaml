id: PSA.30.5
reference: Psalms 30:5
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: כִּ֤י רֶ֨גַע בְּ/אַפּ/וֹ֮ חַיִּ֪ים בִּ/רְצ֫וֹנ֥/וֹ בָּ֭/עֶרֶב יָלִ֥ין בֶּ֗כִי וְ/לַ/בֹּ֥קֶר רִנָּֽה׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/030/005.yaml
  text: For his anger is for a moment[a]; life is in his favor. Weeping may stay for the night[b], but rejoicing comes in the morning.
translation:
  language: hi
  text: 'क्योंकि उसका क्रोध पल भर का है,

    पर उसकी कृपा में जीवन है।

    संध्या को रोना ठहरता है[a],

    पर भोर में आनंद की पुकार होती है[b]।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक भाव: “रोना रात बिताने के लिए ठहरता है”; हिब्रू क्रिया किसी अतिथि या ठहरने वाले के रात भर ठहरने के लिए भी प्रयुक्त होती है।'
    reason: lexical_alternative
  - marker: b
    text: या “जयघोष” अथवा “आनंद का गान।”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पद पिछले कथन का आधार बताता है; ‘क्योंकि’ आधुनिक हिन्दी में इस व्याख्यात्मक संबंध को स्वाभाविक रूप से व्यक्त करता है।
- source_word: רֶגַע בְּאַפּוֹ
  choice: उसका क्रोध पल भर का है
  rationale: אַף यहाँ शाब्दिक ‘नाक’ नहीं, बल्कि मुहावरे के अनुसार ‘क्रोध’ है; רֶגַע उसकी अत्यल्प अवधि बताता है।
- source_word: חַיִּים בִּרְצוֹנוֹ
  choice: उसकी कृपा में जीवन है
  rationale: חַיִּים यहाँ अमूर्त अर्थ में ‘जीवन’ है और רָצוֹן अनुकूलता, प्रसन्नता या कृपा को दर्शाता है। ‘कृपा में’ मूल की संक्षिप्त समानांतर रचना को बनाए रखता है।
- source_word: בָּעֶרֶב יָלִין בֶּכִי
  choice: संध्या को रोना रात भर ठहरता है
  rationale: לין का मूल भाव रात बिताने या रात के लिए ठहरने का है। यह रूप रोने के मानवीकरण तथा उसकी सीमित अवधि—संध्या से भोर तक—दोनों को सुरक्षित रखता है।
- source_word: וְלַבֹּקֶר רִנָּה
  choice: पर भोर होते ही जयघोष होता है
  rationale: वाव यहाँ समानांतर पंक्तियों में विरोध प्रकट करता है। רִנָּה केवल भीतरी आनंद नहीं, आनंद की सुनाई देने वाली पुकार या गान भी हो सकता है; ‘जयघोष’ उस ध्वन्यात्मक अर्थ को व्यक्त करता है।
theological_decisions:
- issue: ‘उसका क्रोध’ और ‘उसकी कृपा’ में सर्वनाम का संदर्भ
  choice: सर्वनाम परमेश्वर की ओर संकेत करता है, जैसा निकटवर्ती संदर्भ में है।
  alternative: सर्वनाम को अस्पष्ट छोड़ना
  rationale: भजन के संदर्भ में कर्ता यहोवा है। अनुवाद परमेश्वर के वास्तविक किंतु क्षणिक क्रोध और उसकी जीवनदायी कृपा के बीच मूल तनाव को बिना अतिरिक्त धर्मवैज्ञानिक व्याख्या के बनाए रखता है।
- issue: क्रोध और कृपा की अवधियों का विरोध
  choice: ‘पल भर’ और ‘जीवन’ को मूल की संक्षिप्त विषमता के साथ रखा गया है।
  alternative: ‘कृपा जीवन भर रहती है’
  rationale: ‘जीवन भर’ एक संभावित व्याख्या है, पर हिब्रू חַיִּים का सीधा अर्थ ‘जीवन’ है। इसलिए पाठ की वास्तविक संक्षिप्तता और संभावित व्यापक अर्थ को सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, काव्यात्मक और सामान्य पाठक के लिए सहज रखी गई है। ‘संध्या/भोर’ का युग्म काव्यात्मक समय-विरोध को बनाए रखता है; ‘जयघोष’ רִנָּה के श्रव्य आनंद को ‘आनंद’ जैसे अधिक सामान्य शब्द से अधिक स्पष्ट करता है।
