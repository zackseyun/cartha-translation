  to: 'क्योंकि उसका क्रोध पल भर का है,

    पर उसकी कृपा में जीवन है।

    संध्या को रोना ठहरता है[a],

    पर भोर में आनंद की पुकार होती है[b]।'
  rationale: The revision removes the added sense of immediacy in “भोर होते ही,” avoids the potentially victory-specific “जयघोष” in the main text, and lets the Hebrew lodging verb carry the overnight sense without redundant wording. It preserves the original’s compact poetic contrast and the draft’s appropriate reference to divine anger and favor.
