base_translation:
  language: en
  yaml_path: translation/ot/psalms/030/003.yaml
  text: O Yahweh[a], you brought up my soul from Sheol[c][b]; you kept me alive from among those going down to the pit.
translation:
  language: hi
  text: हे यहवे, आपने मेरे प्राण को शिओल[a][b] से ऊपर ले आए; गड्ढे में उतरने वालों के बीच से आपने मुझे जीवित रखा।[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इब्रानी: ‘शिओल’, अर्थात मृतकों का लोक; अथवा ‘कब्र’।'
    reason: lexical_alternative
  - marker: b
    text: ‘मेरे प्राण’ का अनुवाद ‘मेरे जीवन’ भी हो सकता है।
    reason: lexical_alternative
  - marker: c
    text: अथवा, ‘गड्ढे में उतरने वालों के बीच से आपने मुझे फिर जीवित किया’; दूसरी संभव वाक्य-रचना के अनुसार, ‘आपने मुझे जीवित रखा, ताकि मैं गड्ढे में न उतरूँ।’
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: हे यहवे
  rationale: परमेश्वर के व्यक्तिगत नाम को उपाधि से बदलने के बजाय देवनागरी लिप्यंतरण में रखा गया है; संबोधन के लिए ‘हे’ स्वाभाविक है।
- source_word: הֶעֱלִיתָ
  choice: ऊपर निकाला
  rationale: हिफ़ील रूप के ‘ऊपर ले आने’ के अर्थ और मृत्यु-लोक से ऊर्ध्व दिशा में उद्धार के काव्य-बिंब को सुरक्षित रखता है।
- source_word: מִן שְׁאוֹל
  choice: अधोलोक से
  rationale: ‘अधोलोक’ मृतकों के लोक का अर्थ संप्रेषित करता है और इसे केवल भौतिक कब्र तक सीमित नहीं करता; इब्रानी पद और वैकल्पिक अर्थ पादटिप्पणी में दिए गए हैं।
- source_word: נַפְשִׁי
  choice: मेरे प्राण को
  rationale: נפשׁ के जीवन, प्राण अथवा स्वयं व्यक्ति के अर्थ-क्षेत्र को स्वाभाविक हिंदी में बनाए रखता है, बिना किसी बाद की तकनीकी आत्मा-संबंधी धारणा को आरोपित किए।
- source_word: חִיִּיתַנִי
  choice: आपने मुझे जीवित रखा
  rationale: जीवन की रक्षा अथवा पुनर्स्थापना का अर्थ देता है और स्पष्ट पुनरुत्थान का दावा किए बिना मूल की व्यापकता बनाए रखता है।
- source_word: מִיּוֹרְדֵי בוֹר
  choice: गड्ढे में उतरनेवालों के बीच से
  rationale: מן को उस समूह से अलग किए जाने के रूप में समझते हुए उतरने की गतिशील छवि बनाए रखता है; दूसरी संभव वाक्य-रचना पादटिप्पणी में सुरक्षित है।
- source_word: בּוֹר
  choice: गड्ढा
  rationale: मृत्यु अथवा कब्र से जुड़ी मूल काव्यात्मक छवि को पारदर्शी ढंग से बनाए रखता है।
theological_decisions:
- issue: क्या पद को पूर्ण विकसित परलोक अथवा पुनरुत्थान-सिद्धांत सूचित करने के ढंग से अनूदित किया जाए
  choice: अधोलोक और गड्ढे की इब्रानी काव्यात्मक छवियाँ बनाए रखी गईं और ‘जीवित रखा’ कहा गया।
  alternative: ‘कब्र’ तक सीमित करना, ‘नरक’ कहना, अथवा स्पष्ट रूप से ‘मरे हुओं में से जिलाया’ कहना।
  rationale: पद मृत्यु या निकट-मृत्यु से छुटकारे को काव्यात्मक भाषा में व्यक्त करता है; अनुवाद उससे अधिक विशिष्ट धर्मवैज्ञानिक दावा आरोपित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण काव्यात्मक शैली रखी गई है। परमेश्वर के संबोधन में आदरसूचक ‘आप’ प्रयुक्त है। ‘अधोलोक’ सामान्य पाठक के लिए ‘शिओल’ से अधिक बोधगम्य है, जबकि मूल पद पादटिप्पणी में सुरक्षित है।
