  yaml_path: translation/ot/psalms/030/006.yaml
  text: As for me[a], I said in my prosperity[b], “I will never be shaken.”
translation:
  language: hi
  text: 'और मैंने अपनी सुख-शान्ति के समय कहा,

    “मैं कभी नहीं डगमगाऊँगा।”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “मैं सदा तक नहीं डगमगाऊँगा।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי
  choice: और मैंने
  rationale: संयोजक ו और स्वतंत्र सर्वनाम אֲנִי आत्म-संदर्भ पर बल देते हैं। हिन्दी में क्रिया के साथ ‘मैंने’ स्वाभाविक है, और ‘और’ पिछले प्रसंग से संबंध बनाए रखता है।
- source_word: אָמַרְתִּי
  choice: कहा
  rationale: यह प्रथम पुरुष एकवचन पूर्ण क्रिया है; चिंतनात्मक प्रसंग में सामान्य भूतकाल उपयुक्त है।
- source_word: בְשַׁלְוִי
  choice: अपनी सुख-शान्ति के समय
  rationale: שַׁלְוָה निश्चिंतता, शान्त अवस्था और सुरक्षित कुशलता का बोध करा सकता है; ‘सुख-शान्ति’ इसे केवल भौतिक समृद्धि तक सीमित नहीं करता और स्वामित्वसूचक प्रत्यय को ‘अपनी’ से व्यक्त करता है।
- source_word: בַּל ... לְעוֹלָם
  choice: कभी नहीं
  rationale: काव्यात्मक निषेध בַּל और कालवाचक לְעוֹלָם मिलकर स्थायी निषेध व्यक्त करते हैं; आधुनिक हिन्दी में ‘कभी नहीं’ इसका स्वाभाविक रूप है।
- source_word: אֶמּוֹט
  choice: डगमगाऊँगा
  rationale: מוט के निफ़अल रूप में अस्थिर होने, हिलने या डगमगाने का रूपक है; ‘डगमगाऊँगा’ आधुनिक हिन्दी में उस अस्थिरता को स्पष्ट और स्वाभाविक ढंग से रखता है।
