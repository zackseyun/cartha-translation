  text: A psalm[a]. A song for the dedication of the house[b]. Of David.
translation:
  language: hi
  text: दाऊद का एक भजन, घर[a] के समर्पण के लिए एक गीत।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
