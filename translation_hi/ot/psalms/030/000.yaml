    reason: alternative_syntax
lexical_decisions:
- source_word: מִזְמוֹר
  choice: एक भजन
  rationale: यह संगीतमय भजन के लिए प्रयुक्त मानक शब्द है; आधुनिक हिन्दी में ‘भजन’ स्वाभाविक और व्यापक रूप से समझा जाता है।
- source_word: שִׁיר
  choice: एक गीत
  rationale: इब्रानी में प्रयुक्त दूसरे विधा-सूचक शब्द को अलग से व्यक्त किया गया है, ताकि ‘भजन’ और ‘गीत’ की जोड़ी बनी रहे।
- source_word: חֲנֻכַּת
  choice: समर्पण के लिए
  rationale: यह शब्द किसी भवन के विधिवत समर्पण या उद्घाटन को सूचित करता है; शीर्षक में ‘के लिए’ गीत के अवसर अथवा उपयोग को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: הַבַּיִת
  choice: घर
  rationale: इब्रानी शब्द का सीधा अर्थ ‘घर’ है और यहाँ उसका निश्चित संदर्भ नहीं बताया गया; इसलिए मुख्य पाठ मंदिर या राजमहल को निर्दिष्ट नहीं करता।
- source_word: לְדָוִד
  choice: दाऊद का
  rationale: यह रूप लेखन, संबंध, स्वामित्व या समर्पण की संभावित अर्थ-छायाओं को ‘दाऊद द्वारा’ की अपेक्षा अधिक खुला रखता है।
theological_decisions:
- issue: शीर्षक में ‘घर’ का संदर्भ
  choice: घर
  alternative: मंदिर अथवा राजमहल
  rationale: בַּיִת का अर्थ व्यापक है और शीर्षक स्वयं यह स्पष्ट नहीं करता कि यहाँ मंदिर, दाऊद का राजमहल या कोई अन्य घर अभिप्रेत है; अतः व्याख्यात्मक तनाव को बनाए रखा गया है।
- issue: לְדָוִד में दाऊद से संबंध का प्रकार
  choice: दाऊद का
  alternative: दाऊद द्वारा अथवा दाऊद के लिए
  rationale: इब्रानी संबंधसूचक उपसर्ग लेखकीयता को संभव बनाता है, पर उसे अकेला अनिवार्य अर्थ नहीं बनाता; हिन्दी में ‘दाऊद का’ वही खुलापन अपेक्षाकृत अच्छी तरह रखता है।
translation_notes:
  register: भाषा आधुनिक, संक्षिप्त और गरिमापूर्ण रखी गई है। शीर्षक की सूची-जैसी संरचना दिखाने के लिए छोटे वाक्य प्रयुक्त हुए हैं। ‘घर’ सामान्य पाठक के लिए सहज है और मूल की संदर्भगत अस्पष्टता को बनाए रखता है।
