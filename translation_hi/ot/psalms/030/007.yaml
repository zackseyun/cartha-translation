base_translation:
  language: en
  yaml_path: translation/ot/psalms/030/007.yaml
  text: O Yahweh[a], by your favor you made my mountain stand strong; when you hid your face, I was dismayed.
translation:
  language: hi
  text: हे याहवे, अपनी कृपा से आपने मेरे पर्वत को दृढ़ खड़ा किया था[a]; अपना मुख छिपाया, तो मैं घबरा गया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “आपने मेरे पर्वत के लिए सामर्थ्य स्थापित की।” इब्रानी वाक्यांश संक्षिप्त है; इसे सुरक्षित समृद्धि या स्थिरता की छवि के रूप में भी समझा जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: हे यहोवा
  rationale: परमेश्वर के विशिष्ट वाचा-नाम को प्रचलित हिन्दी रूप ‘यहोवा’ में रखा गया है; ‘हे’ सीधे संबोधन को व्यक्त करता है।
- source_word: בִּרְצוֹנְךָ
  choice: अपनी कृपा से
  rationale: רָצוֹן यहाँ अनुग्रह, सद्भाव या प्रसन्नता का बोध कराता है और בְּ साधन/कारण का अर्थ देता है।
- source_word: הֶעֱמַדְתָּה
  choice: दृढ़ खड़ा किया था
  rationale: עמד के हिफ़ील रूप का कारणवाचक अर्थ ‘खड़ा करना’ सुरक्षित है; ‘था’ अगले खंड में आए अचानक परिवर्तन से पहले की स्थिति स्पष्ट करता है।
- source_word: לְהַרְרִי עֹז
  choice: मेरे पर्वत को दृढ़ खड़ा किया
  rationale: कठिन और संक्षिप्त इब्रानी वाक्यांश में ‘मेरे पर्वत’ की काव्यात्मक छवि बनाए रखी गई है और עֹז को विधेयात्मक रूप में ‘दृढ़’ कहा गया है।
- source_word: הִסְתַּרְתָּ פָנֶיךָ
  choice: आपने अपना मुख छिपाया
  rationale: ईश्वरीय अनुग्रह या उपस्थिति के हटने का महत्वपूर्ण इब्रानी मुहावरा शाब्दिक छवि सहित रखा गया है।
- source_word: נִבְהָל
  choice: मैं घबरा गया
  rationale: निफ़ाल रूप व्याकुल, भयभीत या हतप्रभ हो जाने को व्यक्त करता है; ‘घबरा गया’ आधुनिक सामान्य हिन्दी में भाव की तीव्रता को सहजता से पहुँचाता है।
theological_decisions:
- issue: ईश्वरीय नाम का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ में יהוה विशिष्ट ईश्वरीय नाम है। हिन्दी बाइबल परंपरा में व्यापक रूप से पहचाने जाने वाले ‘यहोवा’ को नाम के रूप में रखा गया है, न कि उपाधि ‘प्रभु’ से बदला गया।
- issue: ‘मेरे पर्वत’ की व्याख्या
  choice: मुख्य पाठ में काव्यात्मक छवि को बनाए रखना
  alternative: मेरी समृद्धि / मेरी सुरक्षित स्थिति
  rationale: मूल में ‘मेरे पर्वत’ है, जो स्थिरता, सुरक्षा या उत्कर्ष का रूपक हो सकता है। अनुवाद ने इसे किसी एक व्याख्या में सीमित नहीं किया।
- issue: לְהַרְרִי עֹז की वाक्यगत अस्पष्टता
  choice: मेरे पर्वत को दृढ़ खड़ा किया
  alternative: मेरे पर्वत के लिए सामर्थ्य स्थापित की
  rationale: मुख्य पाठ में स्वाभाविक कारणवाचक अर्थ चुना गया है, जबकि इब्रानी की संक्षिप्त रचना से संभव दूसरा संबंध पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। सम्मानसूचक ‘आप’ प्रयुक्त है। ‘मुख छिपाना’ और ‘मेरे पर्वत’ जैसी भजन-साहित्य की मूल काव्यात्मक छवियाँ सुरक्षित हैं।
