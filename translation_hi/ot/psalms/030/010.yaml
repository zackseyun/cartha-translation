  yaml_path: translation/ot/psalms/030/010.yaml
  text: Hear[a], O Yahweh, and be gracious to me; O Yahweh, be my helper.
translation:
  language: hi
  text: हे याहवे, सुन और मुझ पर अनुग्रह कर[a]; हे याहवे, मेरा सहायक हो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मुझ पर दया कर।” इब्रानी क्रिया सहायता की विनती में अनुग्रह या दया का भाव व्यक्त कर सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁמַע
  choice: मेरी सुन
  rationale: यह שׁמע का पुल्लिंग एकवचन आज्ञार्थक रूप है। इब्रानी में कर्म निहित है; हिन्दी प्रार्थना-भाषा में “मेरी सुन” इस पुकार को स्वाभाविक और संक्षिप्त रूप से व्यक्त करता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम יְהוָה को हिन्दी में प्रचलित नामरूप “यहोवा” से व्यक्त किया गया है, किसी उपाधि से प्रतिस्थापित नहीं किया गया।
- source_word: וְחָנֵּנִי
  choice: और मुझ पर अनुग्रह कर
  rationale: חנן के आज्ञार्थक रूप और प्रथम पुरुष एकवचन प्रत्यय का मूल भाव कृपापूर्वक अनुग्रह दिखाना है। यह चयन दया के संभव प्रसंगगत भाव को नकारे बिना उस मूल अर्थ को बनाए रखता है।
- source_word: הֱיֵה
  choice: हो
  rationale: היה का आज्ञार्थक रूप यहाँ प्रार्थनापूर्ण निवेदन में “हो” के अर्थ में है; “बन जा” अनावश्यक परिवर्तन का भाव जोड़ता।
- source_word: עֹזֵר לִי
  choice: मेरा सहायक
  rationale: עזר का कृदन्त रूप और לִי मिलकर सहायता करने वाले व्यक्ति का भाव देते हैं। “मेरा सहायक” आधुनिक हिन्दी में स्वाभाविक है और “मेरी सहायता” की अपेक्षा व्यक्तिगत कृदन्त भाव को बेहतर सुरक्षित रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ में उपाधि नहीं, व्यक्तिगत ईश्वरीय नाम है। हिन्दी पाठकों के लिए स्थापित देवनागरी रूप “यहोवा” नाम को प्रत्यक्ष रखता है; “याहवे” निकटतर वैकल्पिक लिप्यंतरण है।
- issue: חנן में अनुग्रह और दया का भाव
  choice: मुझ पर अनुग्रह कर
  alternative: मुझ पर दया कर
  rationale: क्रिया का मूल भाव कृपापूर्वक पक्ष या अनुग्रह करना है, जबकि सहायता की इस विनती में “दया कर” भी प्रसंगानुकूल हो सकता है। मुख्य पाठ मूल lexical संबंध को प्राथमिकता देता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण प्रार्थना-शैली अपनाई गई है। समानांतर दोनों पुकारों में “हे यहोवा” बनाए रखा गया है। किसी पंथ-विशेष की शब्दावली नहीं जोड़ी गई।
