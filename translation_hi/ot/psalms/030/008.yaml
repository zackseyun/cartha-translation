  text: To you, O LORD, I call, and to my Lord I plead for mercy.
translation:
  language: hi
  text: 'हे यहोवा, मैं तुझे पुकारता हूँ;

    और अपने प्रभु से दया की विनती करता हूँ।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: यहोवा
  rationale: परमेश्वर के व्यक्तिगत नाम को सामान्य उपाधि में बदलने के बजाय हिन्दी में प्रचलित लिप्यंतरण द्वारा व्यक्त किया गया है।
- source_word: אֶקְרָא
  choice: मैं तुझे पुकारता हूँ
  rationale: क्रिया के अपूर्ण रूप को भजन की वर्तमान, निरंतर प्रार्थना के स्वाभाविक हिन्दी कथन के रूप में प्रस्तुत किया गया है।
- source_word: אֶתְחַנָּן
  choice: दया की विनती करता हूँ
  rationale: हित्पएल रूप अनुग्रह या कृपा पाने के लिए गिड़गिड़ाकर विनती करने का भाव रखता है; यह हिन्दी अभिव्यक्ति उस भाव को स्पष्ट और गरिमापूर्ण ढंग से व्यक्त करती है।
- source_word: אֲדֹנָי
  choice: प्रभु
  rationale: यहाँ मासोरेटिक रूप ईश्वरीय उपाधि 'प्रभु' के रूप में समझा गया है; हिन्दी में 'मेरे प्रभु' जोड़ने से जो स्वामित्व अधिक स्पष्ट हो जाता, वह इस प्रसंग में आवश्यक नहीं है।
theological_decisions:
- issue: यְהוָה और אֲדֹנָי के बीच भेद
  choice: पहले पद को 'यहोवा' और दूसरे को 'प्रभु' रखा गया
  alternative: दोनों को 'प्रभु' कहना, अथवा दूसरे को 'मेरे प्रभु' कहना
  rationale: मूल पाठ व्यक्तिगत दिव्य नाम और प्रभुता की उपाधि के बीच शब्दगत भेद रखता है। अनुवाद में यह भेद बनाए रखा गया है और 'मेरे' को केवल पारंपरिक रूप की वर्तनी से निष्कर्षित करके नहीं जोड़ा गया।
translation_notes:
  register: भाषा आधुनिक, प्रार्थनापूर्ण और गरिमापूर्ण रखी गई है। संबोधन में 'हे' तथा परमेश्वर के लिए निकट, काव्यात्मक एकवचन 'तुझे' भजन की सीधी पुकार को स्वाभाविक रूप से व्यक्त करते हैं।
