  text: יְהוָ֥ה אֱלֹהָ֑/י שִׁוַּ֥עְתִּי אֵ֝לֶ֗י/ךָ וַ/תִּרְפָּאֵֽ/נִי׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/030/002.yaml
  text: O Yahweh my God[a], I cried out to you[c][b], and you healed me.
translation:
  language: hi
  text: हे याहवे, मेरे परमेश्वर[a], मैंने सहायता के लिए तुझे पुकारा[b], और तूने मुझे चंगा किया[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में “YHWH”; परंपरागत रूप से “प्रभु” अनुवादित किया जाता है। वैकल्पिक लिप्यंतरण “याहवे” और “यहोवा” हैं।
    reason: alternative_reading
  - marker: b
    text: या, “मैंने तुझे पुकारा।” इब्रानी क्रिया में सहायता के लिए दुहाई देने का भाव है।
    reason: lexical_alternative
  - marker: c
    text: “चंगा किया” शारीरिक आरोग्य या प्रसंग में अधिक व्यापक बहाली अथवा छुटकारे की ओर संकेत कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: यहवे
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम YHWH को नाम के रूप में रखा गया है; हिंदी में स्वाभाविक देवनागरी लिप्यंतरण ‘यहवे’ है।
- source_word: אֱלֹהָי
  choice: मेरे परमेश्वर
  rationale: एकवचन रूप पर प्रथम पुरुष एकवचन प्रत्यय का सीधा अर्थ ‘मेरे परमेश्वर’ है और यहाँ यह संबोधन का भाग है।
- source_word: שִׁוַּעְתִּי
  choice: मैंने सहायता के लिए पुकारा
  rationale: שׁוע संकट में सहायता माँगते हुए पुकारने का भाव रखता है; यह अनुवाद उस तात्कालिकता को स्पष्ट और स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: אֵלֶיךָ
  choice: तुझे
  rationale: אֶל तथा द्वितीय पुरुष एकवचन प्रत्यय पुकार की दिशा ‘तेरी ओर/तुझसे’ बताते हैं; ‘तुझे पुकारा’ सहज हिंदी प्रयोग है।
- source_word: וַתִּרְפָּאֵנִי
  choice: और तूने मुझे चंगा किया
  rationale: רפא का मूल अर्थ चंगा करना है। यह शारीरिक आरोग्य और प्रसंगानुसार व्यापक पुनर्स्थापना—दोनों की संभावना खुली रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहवे
  alternative: प्रभु; यहोवा
  rationale: मूल पाठ में व्यक्तिगत वाचा-नाम स्पष्ट रूप से है। उसे केवल उपाधि में बदलने के बजाय नाम के रूप में प्रस्तुत किया गया है; वैकल्पिक परंपरागत रूप पादटिप्पणी में दिए गए हैं।
- issue: רפא में चंगाई का आशय
  choice: मुझे चंगा किया
  alternative: मुझे बहाल किया; मुझे स्वस्थ किया
  rationale: ‘चंगा किया’ मूल क्रिया के निकट है और यह तय नहीं करता कि यहाँ केवल शारीरिक रोग से आरोग्य अभिप्रेत है या अधिक व्यापक उद्धार अथवा पुनर्स्थापना।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। परमेश्वर को संबोधित करते हुए ‘तू/तुझे’ का प्रयोग हिंदी बाइबलीय और भक्तिपरक शैली के अनुरूप निकटता तथा एकवचन को व्यक्त करता है; यह अनादर का सूचक नहीं है।
