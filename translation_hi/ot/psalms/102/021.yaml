source:
  edition: WLC
  text: לְ/סַפֵּ֣ר בְּ֭/צִיּוֹן שֵׁ֣ם יְהוָ֑ה וּ֝/תְהִלָּת֗/וֹ בִּ/ירוּשָׁלִָֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/102/021.yaml
  text: to declare the name of Yahweh in Zion[a], and his praise in Jerusalem,
translation:
  language: hi
  text: 'ताकि सिय्योन में याहवे के नाम की घोषणा की जाए,

    और यरूशलेम में उसकी स्तुति की जाए।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְסַפֵּר
  choice: घोषणा की जाए
  rationale: ल उपसर्गयुक्त पिएल infinitive यहाँ प्रसंग में उद्देश्य/परिणाम बताता है। सार्वजनिक रूप से परमेश्वर के नाम को सुनाने के भाव के लिए कर्मवाच्य वाक्यांश स्वाभाविक है।
- source_word: בְּצִיּוֹן
  choice: सिय्योन में
  rationale: स्थानवाचक ב का सीधा और स्वाभाविक अनुवाद ‘में’ है; צִיּוֹן का प्रचलित हिन्दी रूप ‘सिय्योन’ रखा गया है।
- source_word: שֵׁם
  choice: नाम
  rationale: शाब्दिक ‘नाम’ परमेश्वर की प्रकट पहचान और प्रतिष्ठा—दोनों की अर्थ-समृद्धि को सुरक्षित रखता है।
- source_word: יְהוָה
  choice: यहवे
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को उपाधि से बदलने के बजाय आधुनिक हिन्दी में उसके लिप्यंतरण ‘यहवे’ से व्यक्त किया गया है।
- source_word: וּתְהִלָּתוֹ
  choice: और उसकी स्तुति
  rationale: תְּהִלָּה का अर्थ ‘स्तुति’ है और तृतीय पुरुष एकवचन प्रत्यय को ‘उसकी’ से व्यक्त किया गया है; समानांतरता में निहित क्रिया को हिन्दी में स्पष्ट किया गया है।
- source_word: בִּירוּשָׁלִָם
  choice: यरूशलेम में
  rationale: स्थानवाचक ב को ‘में’ और नगर के नाम को उसके प्रचलित हिन्दी रूप ‘यरूशलेम’ में प्रस्तुत किया गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में व्यक्तिगत ईश्वरीय नाम सीधे आया है। ‘यहवे’ उसे उपाधि में बदले बिना सुरक्षित रखता है; ‘यहोवा’ वैकल्पिक पारंपरिक स्वरूप है, जबकि ‘प्रभु’ नाम के स्थान पर उपाधि रखता है।
- issue: וּתְהִלָּתוֹ में संबंध का अर्थ
  choice: उसकी स्तुति
  alternative: उसकी प्रशंसा; उसके लिए स्तुति
  rationale: स्वत्वसूचक प्रत्यय को औपचारिक रूप से ‘उसकी’ रखा गया है, जिससे परमेश्वर को दी जाने वाली स्तुति और उसके विषय में कही जाने वाली प्रशंसा के बीच मूल की अर्थगत व्यापकता बनी रहती है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण काव्यात्मक गद्य। दोनों समानांतर पदांशों में कर्मवाच्य संरचना रखकर उद्देश्यसूचक לְ और इब्रानी समानांतरता को स्वाभाविक हिन्दी में व्यक्त किया गया है।
