  text: לִ֭/שְׁמֹעַ אֶנְקַ֣ת אָסִ֑יר לְ֝/פַתֵּ֗חַ בְּנֵ֣י תְמוּתָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/102/020.yaml
  text: to hear the groaning of the prisoner[a], to release the sons of death,
translation:
  language: hi
  text: 'कि वह बन्दी की कराह सुने,

    और मृत्यु के पुत्रों को मुक्त करे।[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात् ‘वे जो मरने के लिए ठहराए गए हैं’ या ‘वे जिन्हें मृत्युदण्ड मिला है।’ इब्रानी में शाब्दिक रूप से ‘मृत्यु के पुत्र’ है।
    reason: lexical_alternative
lexical_decisions:
- source_word: לִשְׁמֹעַ
  choice: सुने
  rationale: שׁמע के infinitive construct को बड़े वाक्य में प्रयोजन/परिणाम के रूप में स्वाभाविक हिन्दी क्रिया से व्यक्त किया गया है।
- source_word: אֶנְקַת
  choice: कराह
  rationale: यह संकट और पीड़ा में निकली गहरी आह या कराह को दर्शाता है; ‘कराह’ उसके भार को स्पष्ट रखता है।
- source_word: אָסִיר
  choice: बन्दी
  rationale: यह बँधे हुए या कारावास में रखे व्यक्ति को सूचित करता है; ‘बन्दी’ संक्षिप्त, वर्तमान और प्रसंगानुकूल है।
- source_word: לְפַתֵּחַ
  choice: मुक्त करे
  rationale: मूल अर्थ ‘खोलना’ है, पर व्यक्तियों के संदर्भ में यहाँ बन्धन खोलकर छुड़ाने का भाव है; ‘मुक्त करे’ हिन्दी में स्वाभाविक है।
- source_word: בְּנֵי
  choice: पुत्रों
  rationale: इब्रानी construct का शाब्दिक रूप ‘पुत्र’ है। मूल बिम्ब और उसकी असामान्य तीव्रता बचाने के लिए इसे मुख्य पाठ में रखा गया है।
- source_word: תְמוּתָה
  choice: मृत्यु
  rationale: संज्ञा का अर्थ ‘मृत्यु’ है। पूरे पदबंध का संकेत मरने के लिए ठहराए गए लोगों की ओर हो सकता है, जिसे पादटिप्पणी में स्पष्ट किया गया है।
theological_decisions:
- issue: ‘मृत्यु के पुत्र’ पदबंध का अर्थ
  choice: मुख्य पाठ में शाब्दिक इब्रानी बिम्ब ‘मृत्यु के पुत्रों’ को बनाए रखा गया।
  alternative: ‘मरने के लिए ठहराए गए लोगों’ या ‘मृत्युदण्ड पाए लोगों’ को मुक्त करे।
  rationale: सन्दर्भ सम्भावित अर्थ को स्पष्ट करता है, लेकिन मूल पदबंध स्वयं काव्यात्मक और कुछ हद तक व्यापक है; इसलिए उसे किसी एक न्यायिक या नियतिवादी अर्थ तक सीमित नहीं किया गया।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और काव्यात्मक हिन्दी। समानांतर क्रियाओं ‘सुने’ और ‘मुक्त करे’ को बनाए रखा गया है। पादटिप्पणी-चिह्न [a] मुख्य पाठ में सम्बद्ध पदबंध के बाद रखा गया है।
