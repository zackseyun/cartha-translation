  yaml_path: translation/ot/psalms/102/016.yaml
  text: For Yahweh has built Zion[a]; he has appeared in his glory.
translation:
  language: hi
  text: क्योंकि यहोवा ने सिय्योन का निर्माण किया है; वह अपनी महिमा में प्रकट हुआ है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वह अपनी महिमा में दिखाई देता है,” अथवा “वह अपनी महिमा में देखा गया है।” इब्रानी क्रिया का अर्थ परमेश्वर का प्रकट होना या उसका दिखाई देना—दोनों हो सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह शब्द आस-पास के कथन का आधार या कारण बताता है; हिन्दी में ‘क्योंकि’ इसका स्वाभाविक संयोजक है।
- source_word: בָנָה
  choice: बनाया है
  rationale: क़ातल रूप पूर्ण कार्य को व्यक्त करता है। ‘फिर से बनाया’ प्रसंगानुकूल संभव है, पर ‘फिर से’ इब्रानी में स्पष्ट नहीं है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: चतुरक्षरीय व्यक्तिगत ईश्वरीय नाम को हिन्दी में प्रचलित लिप्यंतरण ‘यहोवा’ से प्रस्तुत किया गया है, किसी उपाधि से नहीं।
- source_word: צִיּוֹן
  choice: सिय्योन
  rationale: स्थान के विशिष्ट नाम को प्रचलित हिन्दी बाइबलीय रूप में रखा गया है; इसे ‘यरूशलेम’ जैसे व्यापक संकेतार्थ से नहीं बदला गया।
- source_word: נִרְאָה
  choice: प्रकट हुआ है
  rationale: निफ़अल रूप का अर्थ ‘प्रकट होना’ अथवा ‘दिखाई देना/देखा जाना’ हो सकता है। मुख्य पाठ में ईश्वरीय आत्म-प्रकटन का स्वाभाविक अर्थ चुना गया है और अन्य संभावना पादटिप्पणी में सुरक्षित है।
- source_word: בִּכְבוֹדוֹ
  choice: अपनी महिमा में
  rationale: כָּבוֹד के लिए ‘महिमा’ सीधा और गरिमापूर्ण समतुल्य है; प्रत्यय को हिन्दी में कर्ता-सापेक्ष ‘अपनी’ से स्वाभाविक रूप दिया गया है।
theological_decisions:
- issue: נִרְאָה בִּכְבוֹדוֹ में ईश्वरीय प्रकटन बनाम दिखाई देना
  choice: वह अपनी महिमा में प्रकट हुआ है
  alternative: वह अपनी महिमा में दिखाई देता है / दिखाई दिया है
  rationale: निफ़अल दोनों अर्थों की अनुमति देता है। मुख्य पाठ में ‘प्रकट हुआ है’ पूर्ववर्ती पूर्ण क्रिया के अनुरूप है, पर वास्तविक भाषिक अस्पष्टता पादटिप्पणी में स्पष्ट की गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, काव्यात्मक और गरिमापूर्ण शैली। ‘सिय्योन’ और ‘यहोवा’ जैसे स्थापित धार्मिक नामों को बनाए रखा गया है; वास्तविक क्रियात्मक अस्पष्टता पादटिप्पणी में सुरक्षित है।
