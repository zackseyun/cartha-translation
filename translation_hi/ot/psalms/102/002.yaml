  yaml_path: translation/ot/psalms/102/002.yaml
  text: Do not hide your face from me in the day of my distress[a]; incline your ear to me. In the day I call[c][b], answer me quickly.
translation:
  language: hi
  text: मेरे संकट के दिन अपना मुख मुझसे न छिपाना[a]; मेरी ओर अपना कान झुका। जिस दिन मैं पुकारूँ, मुझे शीघ्र उत्तर दे[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘मुख’ का अर्थ यहाँ परमेश्वर की अनुकूल उपस्थिति भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या, “शीघ्रता कर, मुझे उत्तर दे।”
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל תַּסְתֵּר
  choice: न छिपा
  rationale: निषेधात्मक प्रार्थना को स्वाभाविक और तात्कालिक हिंदी में व्यक्त करता है।
- source_word: פָּנֶיךָ
  choice: अपना मुख
  rationale: इब्रानी का मूर्त काव्यात्मक बिंब बनाए रखता है; यहाँ मुख परमेश्वर की अनुकूल उपस्थिति का भी संकेत दे सकता है।
- source_word: בְּיוֹם צַר לִי
  choice: मेरे संकट के दिन
  rationale: शाब्दिक अर्थ ‘जिस दिन मेरे लिए संकट हो’ को संक्षिप्त, स्वाभाविक हिंदी में रखता है।
- source_word: הַטֵּה אֵלַי אָזְנֶךָ
  choice: अपना कान मेरी ओर लगा
  rationale: ध्यान देकर सुनने के इब्रानी मानवीकरण को हिंदी की परिचित प्रार्थना-भाषा में सुरक्षित रखता है।
- source_word: בְּיוֹם אֶקְרָא
  choice: जिस दिन मैं पुकारूँ
  rationale: दोहराए गए कालवाचक ‘दिन’ को बनाए रखते हुए हिंदी वाक्य-संबंध स्पष्ट करता है।
- source_word: מַהֵר עֲנֵנִי
  choice: मुझे शीघ्र उत्तर दे
  rationale: तात्कालिक उत्तर की विनती को स्पष्ट और गरिमापूर्ण आधुनिक हिंदी में व्यक्त करता है।
theological_decisions:
- issue: परमेश्वर के लिए मानवीय बिंब—‘मुख’ और ‘कान’
  choice: मुख्य पाठ में ठोस बिंब सुरक्षित रखे गए
  alternative: ‘अपनी उपस्थिति न छिपा’ और ‘मेरी सुन’
  rationale: मूल इब्रानी परमेश्वर की अनुकूल उपस्थिति और ध्यान को शारीरिक बिंबों द्वारा व्यक्त करता है; उनका संरक्षण काव्यात्मक बल बनाए रखता है और परमेश्वर के शरीरधारी होने का दावा नहीं करता।
- issue: कालवाचक पदबंधों की पुनरावृत्ति
  choice: दोनों स्थानों पर ‘दिन’ बनाए रखा गया
  alternative: ‘जब मैं संकट में हूँ’ और ‘जब मैं पुकारूँ’
  rationale: पुनरावृत्ति पद की काव्यात्मक संरचना और प्रार्थना की तात्कालिकता का अंग है।
