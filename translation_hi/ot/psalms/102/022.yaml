  text: when peoples gather together[a], and kingdoms[c][b], to serve Yahweh—
translation:
  language: hi
  text: जब लोगों के समुदाय और राज्य याहवे की सेवा करने के लिए एक साथ इकट्ठे हों[a][b]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जब लोगों के समुदाय और राज्य एक साथ इकट्ठे किए जाएँ”; इब्रानी रूप कर्मवाच्य रूप में भी समझा जा सकता है।
    reason: lexical_alternative
  - marker: b
    text: “सेवा करने” का अर्थ यहाँ “आराधना करने” भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּ/הִקָּבֵץ
  choice: जब ... इकट्ठे हों
  rationale: בְּ के साथ निफ़अल infinitive construct यहाँ समयसूचक है। हिंदी में संभावित/भविष्यपरक प्रसंग के अनुरूप ‘जब ... इकट्ठे हों’ स्वाभाविक है; निफ़अल का कर्मवाच्य रूप भी संभव है।
- source_word: עַמִּים
  choice: जाति-जाति के लोग
  rationale: बहुवचन עַמִּים विभिन्न सामूहिक जनसमुदायों को दर्शाता है। यह अभिव्यक्ति आधुनिक राजनीतिक राष्ट्र-राज्यों तक अर्थ को सीमित किए बिना बहुवचन भाव स्पष्ट करती है।
- source_word: יַחְדָּו
  choice: एक साथ
  rationale: यह संयुक्त सभा पर बल देता है; ‘एक साथ’ सहज और स्पष्ट हिंदी है।
- source_word: וּ/מַמְלָכוֹת
  choice: और राज्य भी
  rationale: מַמְלָכוֹת राज्यों या राजसत्ताओं को सूचित करता है। ‘भी’ हिंदी में समन्वित किंतु कुछ हद तक लुप्त क्रिया वाले इब्रानी वाक्य-विन्यास को स्पष्ट करता है।
- source_word: לַ/עֲבֹד
  choice: सेवा करने के लिए
  rationale: עבד का मूल अर्थ सेवा करना है; परमेश्वर के संबंध में इसमें आराधना का भाव भी समाहित हो सकता है, जिसे पादटिप्पणी में रखा गया है।
- source_word: אֶת יְהוָה
  choice: याहवे
  rationale: मूल पाठ में वाचा-संबंधी व्यक्तिगत नाम יהוה है; उसे उपाधि से बदलने के बजाय लिप्यंतरित किया गया है।
theological_decisions:
- issue: יהוה नाम का अनुवाद
  choice: याहवे
  alternative: यहोवा / प्रभु
  rationale: यहाँ मूल पाठ सीधे चार अक्षरों वाला दिव्य नाम देता है। ‘याहवे’ स्रोत के व्यक्तिगत नाम को बनाए रखता है; किसी विशेष सांप्रदायिक व्याख्या को नहीं जोड़ता।
- issue: עבד को सेवा या आराधना के रूप में प्रस्तुत करना
  choice: सेवा करने के लिए
  alternative: आराधना करने के लिए
  rationale: क्रिया का व्यापक मूल अर्थ ‘सेवा करना’ है, जबकि याहवे इसके कर्म होने पर आराधना का आशय संभव है। मुख्य पाठ व्यापकता बनाए रखता है और वैकल्पिक अर्थ पादटिप्पणी में देता है।
- issue: ממלכות का הִקָּבֵץ के साथ व्याकरणिक संबंध
  choice: ‘और राज्य भी’ को इकट्ठा होने की समानांतर इकाई माना
  alternative: केवल ‘लोग’ को स्पष्ट कर्ता मानकर ‘राज्यों’ को अलग, लुप्त क्रिया वाले पद के रूप में पढ़ना
  rationale: इब्रानी में ‘लोग एक साथ’ के बाद ‘और राज्य’ आता है और दोनों का लक्ष्य याहवे की सेवा करना है। हिंदी में ‘भी’ जोड़ना इस समानांतरता को सहज बनाता है, पर मूल की संक्षिप्त रचना को अत्यधिक पुनर्गठित नहीं करता।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सुबोध हिंदी। पद पिछले और अगले संदर्भ से जुड़ा अधूरा काव्यांश है, इसलिए अंत में दीर्घ विराम-चिह्न रखा गया है।
