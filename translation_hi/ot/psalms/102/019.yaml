  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִשְׁקִיף
  choice: नीचे देखा
  rationale: क्रिया ऊँचे स्थान से नीचे की ओर देखने का भाव व्यक्त करती है; संदर्भ में यह सहज और सटीक है।
- source_word: מְרוֹם קָדְשׁוֹ
  choice: अपने पवित्र ऊँचे स्थान से
  rationale: शाब्दिक संरचना ‘उसकी पवित्र ऊँचाई’ है; हिन्दी में स्थानगत आशय स्पष्ट करने के लिए ‘ऊँचे स्थान’ स्वाभाविक है, बिना उसे किसी अधिक विशिष्ट निवास-स्थान में बदलने के।
- source_word: יְהוָה
  choice: यहोवा
  rationale: मूल पाठ के विशिष्ट ईश्वरीय नाम को हिन्दी में प्रचलित लिप्यंतरण से सुरक्षित रखा गया है।
- source_word: הִבִּיט
  choice: दृष्टि की
  rationale: यह ध्यानपूर्वक देखने की दूसरी क्रिया है; ‘दृष्टि की’ काव्यात्मक गरिमा बनाए रखते हुए पहली क्रिया से हल्का शैलीगत भेद रखती है।
- source_word: מִשָּׁמַיִם אֶל אֶרֶץ
  choice: स्वर्ग से पृथ्वी पर
  rationale: दिशात्मक संबंध को संक्षिप्त और स्वाभाविक हिन्दी में रखा गया है।
theological_decisions:
- issue: ईश्वरीय नाम का अनुवाद
  choice: यहोवा
  alternative: प्रभु
  rationale: हिब्रू में सामान्य उपाधि नहीं, बल्कि चार अक्षरों वाला विशिष्ट नाम है; ‘यहोवा’ इस भेद को पाठ में बनाए रखता है।
- issue: ‘पवित्र ऊँचाई’ का आशय
  choice: अपने पवित्र ऊँचे स्थान से
  alternative: अपने पवित्र धाम से
  rationale: ‘धाम’ अर्थ की व्याख्या को अधिक निश्चित कर देता; मूल की स्थानगत लेकिन अपेक्षाकृत खुली अभिव्यक्ति को सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण काव्यात्मक शैली। समानार्थी हिब्रू क्रियाओं की पुनरुक्ति को हिन्दी में ‘नीचे देखा’ और ‘दृष्टि की’ द्वारा बनाए रखा गया है। पद के अगले वाक्य से जुड़े रहने के कारण अंत में अल्पविराम रखा गया है।
