id: PSA.102.15
reference: Psalms 102:15
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/יִֽירְא֣וּ ג֭וֹיִם אֶת שֵׁ֣ם יְהוָ֑ה וְֽ/כָל מַלְכֵ֥י הָ֝/אָ֗רֶץ אֶת כְּבוֹדֶֽ/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/102/015.yaml
  text: Then the nations will fear the name of Yahweh[b][a], and all the kings of the earth your glory.
translation:
  language: hi
  text: तब[a] राष्ट्र याहवे के नाम का भय मानेंगे[b], और पृथ्वी के सभी राजा तेरी महिमा का भय मानेंगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “और राष्ट्र।” यहाँ संयोजक का सीधा अर्थ “और” हो सकता है; “तब” पिछले पद से निकलने वाले परिणाम को स्पष्ट करता है।
    reason: lexical_alternative
  - marker: b
    text: या, “श्रद्धा करेंगे।” हिब्रू क्रिया श्रद्धामिश्रित भय अथवा विस्मय को भी व्यक्त कर सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיִירְאוּ
  choice: तब ... भय मानेंगे
  rationale: יִירְאוּ, ירא का क़ाल अपूर्ण 3 बहुवचन रूप, भय और श्रद्धामिश्रित विस्मय—दोनों अर्थ व्यक्त कर सकता है। पिछले पद में सिय्योन के पुनर्निर्माण के परिणाम के रूप में भविष्यकाल स्वाभाविक है; संदर्भगत परिणाम को व्यक्त करने के लिए וְ का अनुवाद ‘तब’ किया गया है।
- source_word: גּוֹיִם
  choice: राष्ट्र
  rationale: यह शब्द सामूहिक जनसमुदायों अथवा राष्ट्रों को दर्शाता है। ‘अन्यजातियाँ’ बाद का धार्मिक भेद ला सकता है, जबकि ‘जातियाँ’ आधुनिक हिन्दी में जाति-व्यवस्था का अर्थ भी दे सकता है।
- source_word: אֶת שֵׁם יְהוָה
  choice: याहवे के नाम का
  rationale: मूल पाठ के ‘नाम’ को बनाए रखा गया है, क्योंकि यह प्रतिष्ठा और प्रकट पहचान की ओर संकेत कर सकता है; इसे व्याख्यात्मक रूप से विस्तृत नहीं किया गया।
- source_word: יְהוָה
  choice: याहवे
  rationale: हिब्रू चतुराक्षरीय दिव्य नाम को किसी उपाधि से बदलने के बजाय हिन्दी में उसके प्रचलित ध्वन्यात्मक रूप ‘याहवे’ से व्यक्त किया गया है।
- source_word: וְכָל מַלְכֵי הָאָרֶץ
  choice: और पृथ्वी के सभी राजा
  rationale: כָל के साथ बहुवचन संबंध-रचना का स्वाभाविक हिन्दी रूप ‘सभी राजा’ है; ‘पृथ्वी के’ मूल की व्यापकता को बनाए रखता है।
- source_word: אֶת כְּבוֹדֶךָ
  choice: तेरी महिमा का भय मानेंगे
  rationale: כָּבוֹד के लिए ‘महिमा’ काव्यात्मक और धर्मवैचारिक भार को बनाए रखता है। द्वितीय पुरुष एकवचन प्रत्यय को ‘तेरी’ से सुरक्षित रखा गया है। हिब्रू में दूसरी पंक्ति में क्रिया लुप्त है; स्पष्ट और स्वाभाविक हिन्दी के लिए पहली पंक्ति की क्रिया दोहराई गई है।
theological_decisions:
- issue: दिव्य नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: प्रभु / यहोवा
  rationale: मूल में उपाधि नहीं, परमेश्वर का विशिष्ट नाम है। ‘याहवे’ उसे नाम के रूप में सुरक्षित रखता है; ‘प्रभु’ उसे उपाधि में बदल देता, जबकि ‘यहोवा’ एक बाद की मिश्रित स्वर-परंपरा को दर्शाता है।
- issue: ירא में भय और श्रद्धा का संबंध
  choice: भय मानेंगे
  alternative: श्रद्धा करेंगे
  rationale: मूल क्रिया वास्तविक भय तथा श्रद्धामिश्रित विस्मय दोनों को समेट सकती है। मुख्य पाठ में पारंपरिक और व्यापक ‘भय मानेंगे’ रखा गया है तथा वैकल्पिक अर्थ पादटिप्पणी में दिया गया है, ताकि तनाव समाप्त न हो।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सार्वजनिक पाठ के योग्य रखी गई है। ‘तेरी’ मूल के सीधे संबोधन को बनाए रखता है। दूसरी अर्ध-पंक्ति में निहित क्रिया को हिन्दी की स्पष्टता के लिए दोहराया गया है।
