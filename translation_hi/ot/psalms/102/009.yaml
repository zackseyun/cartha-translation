  yaml_path: translation/ot/psalms/102/009.yaml
  text: For I have eaten ashes like bread[a], and mixed my drink with weeping.
translation:
  language: hi
  text: 'क्योंकि मैंने रोटी की तरह राख खाई है,

    और अपने पेय को रोने के साथ मिला लिया है।[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “और अपने पेय में आँसू मिला लिए हैं।” इब्रानी में शाब्दिक रूप से “रोने के साथ” है, जिसे अधिक ठोस रूप में “आँसुओं के साथ” भी अनूदित किया जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पद आसपास के विलाप का कारण बताता है; ‘क्योंकि’ इसके कारणसूचक अर्थ को स्वाभाविक हिंदी में सुरक्षित रखता है।
- source_word: אֵפֶר
  choice: राख
  rationale: शोक और अपमान के संदर्भ में ‘राख’ सटीक और सहज हिंदी शब्द है।
- source_word: כַּלֶּחֶם
  choice: रोटी की तरह
  rationale: उपसर्ग כְּ की उपमा को स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: אָכָלְתִּי
  choice: मैंने ... खाई है
  rationale: पूर्ण क्रिया को ऐसे अनुभव के रूप में व्यक्त करता है जिसका प्रभाव वर्तमान विलाप में बना हुआ है।
- source_word: שִׁקֻּוַי
  choice: अपने पेय
  rationale: यहाँ साधारण पीने की वस्तु अभिप्रेत है; ‘पेय’ संक्षिप्त है और अनावश्यक बलिदानी अर्थ नहीं जोड़ता।
- source_word: בִּבְכִי
  choice: रोने के साथ
  rationale: इब्रानी भाववाचक संज्ञा ‘रोना’ को बनाए रखता है और उसे केवल ठोस ‘आँसुओं’ तक सीमित नहीं करता।
- source_word: מָסָכְתִּי
  choice: मिला लिया है
  rationale: तरल पदार्थों को मिलाने के मूल अर्थ को स्वाभाविक आधुनिक हिंदी में व्यक्त करता है।
