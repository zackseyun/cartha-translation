id: PSA.102.0
reference: Psalms 102:0
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: תְּ֭פִלָּה לְ/עָנִ֣י כִֽי יַעֲטֹ֑ף וְ/לִ/פְנֵ֥י יְ֝הוָ֗ה יִשְׁפֹּ֥ךְ שִׂיחֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/102/000.yaml
  text: A prayer of the afflicted one when he grows faint and pours out his complaint before Yahweh[a][b].
translation:
  language: hi
  text: पीड़ित जन की प्रार्थना, जब वह निढाल हो जाए[a] और याहवे के सामने अपनी व्यथा[b] उँडेल दे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अभिभूत हो जाए।”
    reason: lexical_alternative
  - marker: b
    text: या, “अपना मनन” अथवा “अपना विलाप।”
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּפִלָּה
  choice: प्रार्थना
  rationale: भजन के शीर्षक में प्रयुक्त संज्ञात्मक आरंभ को हिंदी में संक्षिप्त और स्वाभाविक रूप से प्रस्तुत करता है।
- source_word: לְעָנִי
  choice: पीड़ित जन की
  rationale: לְ को यहाँ शीर्षक में संबंधसूचक माना गया है। עָנִי का अर्थ आर्थिक रूप से केवल ‘गरीब’ नहीं, बल्कि दुःख या उत्पीड़न झेलने वाला व्यक्ति भी है; ‘जन’ अनावश्यक रूप से जैविक लिंग पर बल दिए बिना एकवचन व्यक्ति को दर्शाता है।
- source_word: כִי
  choice: जब
  rationale: यहाँ כִּי प्रार्थना किए जाने की परिस्थिति बताता है; इसलिए कारणसूचक ‘क्योंकि’ की अपेक्षा कालसूचक ‘जब’ संदर्भ में अधिक उपयुक्त है।
- source_word: יַעֲטֹף
  choice: निढाल हो जाए
  rationale: क्रिया निर्बल पड़ने, मूर्छित-सा होने या अभिभूत होने का भाव दे सकती है। ‘निढाल हो जाए’ आधुनिक हिंदी में शारीरिक और भावात्मक टूटन, दोनों की गुंजाइश रखता है।
- source_word: וְלִפְנֵי יְהוָה
  choice: और याहवे के सामने
  rationale: לִפְנֵי का संबंधपरक अर्थ ‘के सामने/की उपस्थिति में’ है। ‘के सामने’ संक्षिप्त और सहज है; यְהוָה को व्यक्तिगत वाचा-नाम के रूप में ‘याहवे’ लिखा गया है।
- source_word: יִשְׁפֹּךְ
  choice: उँडेल दे
  rationale: मूल पाठ की ‘उँडेलने’ की रूपकात्मक छवि को बनाए रखता है और हिंदी में मन की पीड़ा खुलकर कहने के लिए स्वाभाविक है।
- source_word: שִׂיחוֹ
  choice: अपनी व्यथा
  rationale: שִׂיחַ का अर्थ मनन, विलाप या व्यथित निवेदन हो सकता है। संकट और प्रार्थना के इस संदर्भ में ‘व्यथा’ विलापपरक भाव को स्पष्ट और स्वाभाविक ढंग से व्यक्त करती है, जबकि अन्य अर्थ पादटिप्पणी में सुरक्षित हैं।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा
  rationale: मूल में चतुरक्षरीय व्यक्तिगत नाम सीधे आया है। ‘याहवे’ उसे उपाधि ‘प्रभु’ से बदलने के बजाय नाम के रूप में प्रस्तुत करता है और ‘Jehovah’ से भिन्न प्रचलित विद्वत् उच्चारण को दर्शाता है।
translation_notes:
  register: भजन-शीर्षक के अनुरूप भाषा संक्षिप्त, गरिमापूर्ण और आधुनिक मानक हिंदी में रखी गई है। ‘पीड़ित जन’ सामान्य पाठक के लिए स्पष्ट है और मूल के एकवचन व्यक्ति को बनाए रखता है। दोनों पादटिप्पणी-चिह्न मुख्य पाठ में अपने संबंधित शब्दों के तुरंत बाद दिए गए हैं।
