lexical_decisions:
- source_word: יְהוָה
  choice: हे यहोवा
  rationale: इब्रानी चतुरक्षरीय नाम को उपाधि से बदलने के बजाय प्रचलित हिन्दी लिप्यंतरण ‘यहोवा’ से व्यक्त किया गया है; ‘हे’ सम्बोधन को स्वाभाविक बनाता है।
- source_word: שִׁמְעָה
  choice: सुन
  rationale: यह पुल्लिंग एकवचन आज्ञार्थक रूप है और परमेश्वर से की गई सीधी विनती को बनाए रखता है।
- source_word: תְפִלָּתִי
  choice: मेरी प्रार्थना
  rationale: תְּפִלָּה का सामान्य और प्रसंगानुकूल हिन्दी समतुल्य ‘प्रार्थना’ है।
- source_word: וְשַׁוְעָתִי
  choice: मेरी सहायता की पुकार
  rationale: שַׁוְעָה संकट में सहायता के लिए की गई पुकार को सूचित करता है; हिन्दी में केवल ‘पुकार’ की अपेक्षा यह अर्थ अधिक स्वाभाविक रूप से स्पष्ट होता है।
- source_word: אֵלֶיךָ
  choice: तुझ तक
  rationale: אֶל दिशा को व्यक्त करता है और בוא के साथ हिन्दी में ‘तुझ तक पहुँचे’ स्वाभाविक है।
- source_word: תָבוֹא
  choice: पहुँचे
  rationale: अपूर्ण रूप यहाँ विनयात्मक/कामनार्थक बल रखता है। ‘पहुँचे’ हिन्दी में पुकार के परमेश्वर तक आने का सहज समतुल्य है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे / प्रभु
  rationale: मूल पाठ में व्यक्तिगत ईश्वरीय नाम है। हिन्दी पाठकों में स्थापित रूप ‘यहोवा’ नाम को उपाधि ‘प्रभु’ से प्रतिस्थापित किए बिना सुरक्षित रखता है; वैकल्पिक लिप्यंतरण पादटिप्पणी में दिया गया है।
translation_notes:
  register: भाषा आधुनिक, सरल और प्रार्थनात्मक है। एकवचन निकट सम्बोधन ‘तुझ’ मूल के द्वितीय पुरुष एकवचन और हिन्दी भजन-परम्परा की गरिमा—दोनों को बनाए रखता है।
