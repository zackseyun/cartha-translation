  text: וְ/אַתָּה ה֑וּא וּ֝/שְׁנוֹתֶ֗י/ךָ לֹ֣א יִתָּֽמּוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/102/027.yaml
  text: But you are the same[a], and your years will not come to an end.
translation:
  language: hi
  text: परन्तु आप वही हैं[a], और आपके वर्षों का अन्त कभी न होगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से, ‘आप वह हैं’; यह मुहावरा ‘आप वही हैं’ या ‘आप अपरिवर्तित रहते हैं’ का भाव देता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אַתָּה
  choice: परन्तु आप
  rationale: संयोजक और स्वतंत्र सर्वनाम मिलकर पिछली पंक्तियों में सृष्टि के नाश और परिवर्तन के विपरीत परमेश्वर की स्थिरता पर बल देते हैं; ‘परन्तु आप’ इस विरोध को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: הוּא
  choice: वही हैं
  rationale: शाब्दिक रूप ‘आप वह हैं’ है। यहाँ यह मुहावरा निरन्तर एक ही बने रहने अथवा अपरिवर्तित पहचान का भाव देता है; ‘वही हैं’ हिन्दी में संक्षिप्त और स्वाभाविक है तथा मूल की अभिव्यक्ति के निकट भी रहता है।
- source_word: וּ/שְׁנוֹתֶיךָ
  choice: और आपके वर्षों
  rationale: שָׁנָה का बहुवचन, द्वितीय पुरुष एकवचन प्रत्यय सहित, सीधे ‘आपके वर्ष’ दर्शाता है। संबंधसूचक रूप में ‘आपके वर्षों का अन्त’ स्वाभाविक हिन्दी है।
- source_word: לֹא
  choice: कभी न होगा
  rationale: निषेध अगले अपूर्ण क्रिया-रूप पर लागू होता है। ‘कभी न’ अनन्त अवधि का स्पष्ट भाव देता है, जबकि भविष्यसूचक ‘होगा’ काव्यात्मक कथन के अनुरूप है।
- source_word: יִתָּמּוּ
  choice: अन्त ... होगा
  rationale: תמם के काल रूप का यहाँ अर्थ समाप्त हो जाना या पूर्ण हो जाना है। ‘अन्त न होगा’ आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है।
theological_decisions:
- issue: ‘आप वह हैं’ मुहावरे का परमेश्वर की अपरिवर्तनशीलता के संदर्भ में अनुवाद
  choice: आप वही हैं
  alternative: आप वह हैं; आप वैसे ही बने रहते हैं
  rationale: इब्रानी अभिव्यक्ति बदलती और नाशवान सृष्टि के विपरीत परमेश्वर की स्थायी पहचान को रखती है। ‘आप वही हैं’ इस बल को व्यक्त करता है, पर पाठ से आगे बढ़कर कोई दार्शनिक परिभाषा नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी में आदरसूचक ‘आप’ अपनाया गया है। शैली संक्षिप्त, काव्यात्मक और गरिमापूर्ण रखी गई है; ‘वही हैं’ मूल मुहावरे की अस्पष्टता और उसके स्थायित्व-संबंधी भाव दोनों को बनाए रखता है।
