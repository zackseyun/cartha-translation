  yaml_path: translation/ot/psalms/102/017.yaml
  text: He turned to the prayer of the destitute and did not despise their prayer[a].
translation:
  language: hi
  text: उसने बेसहारा लोगों[a] की प्रार्थना की ओर ध्यान दिया और उनकी प्रार्थना को तुच्छ नहीं समझा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘अभावग्रस्त’ या ‘असहाय’; इब्रानी शब्द का अर्थ अन्य संदर्भों में रेगिस्तानी झाड़ी भी हो सकता है, जो यहाँ उजड़े या एकाकी व्यक्ति का बिंब हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: פָּנָה
  choice: ध्यान दिया
  rationale: मूल क्रिया का अर्थ ‘मुड़ना/की ओर उन्मुख होना’ है; प्रार्थना के संदर्भ में ‘की ओर ध्यान दिया’ उस ठोस भाव और अनुग्रहपूर्ण सुनवाई को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: תְּפִלַּת
  choice: की प्रार्थना
  rationale: यह संबंधवाचक रूप है और पद में दोहराए गए ‘प्रार्थना’ शब्द को सुरक्षित रखता है।
- source_word: הָעַרְעָר
  choice: बेसहारा लोगों
  rationale: यहाँ शब्द ऐसे अभावग्रस्त, असहाय या अकेले मनुष्यों को सूचित करता है जो प्रार्थना करते हैं; बहुवचन भाव अगले ‘उनकी’ से स्पष्ट होता है। ‘बेसहारा’ आधुनिक हिन्दी में आर्थिक अभाव के साथ असहायता और एकाकीपन भी व्यक्त कर सकता है।
- source_word: בָזָה
  choice: तुच्छ नहीं जाना
  rationale: यह בזה के तिरस्कार या हेय समझने के अर्थ को dignified और स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: תְּפִלָּתָם
  choice: उनकी प्रार्थना
  rationale: मूल में प्रत्यय बहुवचन ‘उनकी’ है, जबकि संज्ञा एकवचन सामूहिक अर्थ में है; हिन्दी में यही संरचना सहज है और मूल की पुनरावृत्ति भी बचाती है।
theological_decisions:
- issue: עַרְעָר का मानव-संबंधी अर्थ
  choice: बेसहारा लोग
  alternative: अभावग्रस्त व्यक्ति; अकेला व्यक्ति; मरुस्थलीय झाड़ी के समान उजड़ा हुआ व्यक्ति
  rationale: ‘उनकी प्रार्थना’ से मानव समुदाय का संकेत मिलता है। इसलिए मुख्य पाठ में मानव दशा व्यक्त की गई है, पर शब्द की दुर्लभता और संभावित झाड़ी-संबंधी बिंब को किसी निश्चित संप्रदायगत अर्थ में नहीं बदला गया।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘ध्यान दिया’ हिन्दी में ‘प्रार्थना की ओर मुड़ा’ से अधिक स्वाभाविक है, जबकि मूल के उन्मुख होकर सुनने के भाव को बनाए रखता है। ‘बेसहारा’ सामान्य पाठक के लिए स्पष्ट है; पद के भीतर ‘प्रार्थना’ की पुनरावृत्ति जानबूझकर सुरक्षित रखी गई है।
