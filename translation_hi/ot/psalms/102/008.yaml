  text: כָּל הַ֭/יּוֹם חֵרְפ֣וּ/נִי אוֹיְבָ֑/י מְ֝הוֹלָלַ֗/י בִּ֣/י נִשְׁבָּֽעוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/102/008.yaml
  text: All day long my enemies reproach me[b][a]; those who mock me swear by me.
translation:
  language: hi
  text: दिन भर मेरे शत्रु मेरी निंदा करते हैं; मेरा उपहास करनेवाले मेरा नाम लेकर शपथ खाते हैं।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी वाक्यांश कठिन है। शाब्दिक रूप से, ‘मेरा उपहास करनेवाले मुझ/मेरे नाम से शपथ खाते हैं।’ इसका अर्थ ‘मेरे विरुद्ध शपथ खाते हैं’ भी हो सकता है। शत्रुतापूर्ण संदर्भ में सम्भवतः वे भजनकार के नाम या उसकी दशा को शपथ में शाप या बददुआ के सूत्र के रूप में इस्तेमाल करते हैं।
    reason: alternative_reading
lexical_decisions:
- source_word: כָּל הַיּוֹם
  choice: दिन भर
  rationale: यह स्वाभाविक आधुनिक हिन्दी में पूरे दिन निरंतर होने का भाव व्यक्त करता है।
- source_word: חֵרְפוּנִי
  choice: मुझे ताने देते हैं
  rationale: חרף यहाँ अपमानपूर्ण निंदा और उपहास का भाव रखता है; ‘ताने देते हैं’ प्रसंग में सहज और स्पष्ट है।
- source_word: אֹיְבַי
  choice: मेरे शत्रु
  rationale: सम्बन्धसूचक संज्ञा का सीधा और स्वाभाविक हिन्दी रूप।
- source_word: מְהוֹלָלַי
  choice: मेरा उपहास करनेवाले
  rationale: रूप कठिन है, पर प्रसंग में शत्रुतापूर्ण ढंग से हँसी उड़ानेवालों का अर्थ सबसे सम्भावित है।
- source_word: בִּי נִשְׁבָּעוּ
  choice: मेरा नाम लेकर शाप देते हैं
  rationale: शाब्दिक अर्थ ‘मुझसे/मेरी शपथ खाते हैं’ है, किन्तु शत्रुतापूर्ण प्रसंग में भजनकार को शापसूचक शपथ या बददुआ के उदाहरण की तरह इस्तेमाल करना अभिप्रेत प्रतीत होता है। हिन्दी में चुना गया वाक्य उस व्यावहारिक अर्थ को स्पष्ट करता है।
theological_decisions:
- issue: בִּי נִשְׁבָּעוּ में शपथ और शाप के बीच अर्थगत तनाव
  choice: मुख्य पाठ में ‘मेरा नाम लेकर शाप देते हैं’
  alternative: ‘मेरी शपथ खाते हैं’ या ‘मेरे विरुद्ध शपथ खाते हैं’
  rationale: पूर्वपद בִּי सामान्यतः शपथ के आधार को दर्शा सकता है, पर यहाँ उपहास और वैर का प्रसंग तटस्थ शपथ के बजाय शापसूचक प्रयोग की ओर संकेत करता है। कठिनाई और अन्य सम्भावनाएँ पादटिप्पणी में सुरक्षित रखी गई हैं।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट हिन्दी। ‘ताने देते हैं’ और ‘उपहास करनेवाले’ शत्रुतापूर्ण वाणी को स्वाभाविक रूप से व्यक्त करते हैं; कठिन इब्रानी शपथ-वाक्य का सम्भावित प्रसंगगत अर्थ मुख्य पाठ में और उसकी वास्तविक अस्पष्टता पादटिप्पणी में दी गई है।
