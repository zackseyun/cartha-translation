base_translation:
  language: en
  yaml_path: translation/ot/psalms/102/012.yaml
  text: But you[a], O Yahweh, sit enthroned forever[b], and your remembrance is from generation to generation.
translation:
  language: hi
  text: परन्तु, हे याहवे, आप सदा विराजमान हैं[a], और आपका स्मरण[b] पीढ़ी-दर-पीढ़ी बना रहता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘सदा बैठे हैं’ अथवा ‘सदा बने रहते हैं।’ इब्रानी क्रिया का मूल अर्थ ‘बैठना’ है; वह बने रहने और राजकीय रूप से विराजमान होने का भाव भी दे सकती है।
    reason: lexical_alternative
  - marker: b
    text: या ‘आपका स्मारक’ अथवा ‘आपकी कीर्ति।’ इब्रानी संज्ञा स्मरण, स्मारक या बनी रहने वाली ख्याति का संकेत दे सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַתָּה
  choice: परन्तु … आप
  rationale: स्वतंत्र सर्वनाम के साथ संयोजक पिछले प्रसंग में मनुष्य की क्षणभंगुरता के विपरीत यहवे की स्थिरता पर बल देता है; आधुनिक हिन्दी में ‘परन्तु’ इस विरोध को स्वाभाविक रूप से व्यक्त करता है।
- source_word: יְהוָה
  choice: यहवे
  rationale: चार अक्षरों वाले परमेश्वर के व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय हिन्दी में निकट ध्वन्यात्मक लिप्यंतरण दिया गया है।
- source_word: לְעוֹלָם
  choice: सदा
  rationale: यहाँ यह शब्द अनन्त काल और स्थायित्व दर्शाता है; ‘सदा’ संक्षिप्त, काव्यात्मक और सहज आधुनिक हिन्दी है।
- source_word: תֵּשֵׁב
  choice: विराजमान रहेंगे
  rationale: ישׁב का मूल अर्थ बैठना या बने रहना है; परमेश्वर के विषय में राजकीय संदर्भ की सम्भावना को ‘विराजमान’ व्यक्त करता है, जबकि ‘रहेंगे’ निरन्तरता बनाए रखता है।
- source_word: וְזִכְרְךָ
  choice: और आपका स्मरण
  rationale: זֵכֶר स्मरण, स्मारक-स्मृति या कीर्ति का बोध करा सकता है। ‘स्मरण’ मूल शब्द की स्मृति-संबंधी व्यापकता को अपेक्षाकृत सुरक्षित रखता है।
- source_word: לְדֹר וָדֹר
  choice: पीढ़ी-दर-पीढ़ी
  rationale: यह प्रचलित हिन्दी अभिव्यक्ति लगातार आने वाली प्रत्येक पीढ़ी तक बने रहने का वितरक भाव स्वाभाविक रूप से व्यक्त करती है।
theological_decisions:
- issue: תֵּשֵׁב में स्थायी अस्तित्व और राजकीय विराजमानता का संबंध
  choice: सदा विराजमान रहेंगे
  alternative: सदा बैठे रहेंगे; सदा बने रहेंगे
  rationale: मुख्य पाठ राजकीय संकेत को व्यक्त करता है, पर उसे परमेश्वर के शासन के बारे में अधिक विस्तृत सिद्धान्त में नहीं बदलता; पादटिप्पणी क्रिया के अधिक शाब्दिक और व्यापक अर्थों को खुला रखती है।
- issue: זִכְרְךָ का आशय
  choice: आपका स्मरण
  alternative: आपका स्मारक; आपकी कीर्ति
  rationale: ‘स्मरण’ मूल संज्ञा की अर्थ-सीमा को संकुचित नहीं करता और पीढ़ियों के बीच यहवे की याद, स्मारक-स्मृति या ख्याति की सम्भावित छटाओं को सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और काव्यात्मक रखी गई है। प्रत्यक्ष संबोधन में ‘आप’ वर्तमान मानक हिन्दी में आदर और सहज बोध बनाए रखता है। दूसरे खंड में इब्रानी के क्रियारहित वाक्य को स्वाभाविक हिन्दी बनाने के लिए ‘बना रहेगा’ जोड़ा गया है; इससे पहले खंड के स्थायित्व के समानांतर भाव स्पष्ट होता है।
