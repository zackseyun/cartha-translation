  text: אַתָּ֣ה תָ֭קוּם תְּרַחֵ֣ם צִיּ֑וֹן כִּי עֵ֥ת לְ֝/חֶֽנְנָ֗/הּ כִּי בָ֥א מוֹעֵֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/102/013.yaml
  text: You will arise and have compassion on Zion[a], for it is time to show her favor[b], for the appointed time has come.
translation:
  language: hi
  text: आप उठेंगे और सिय्योन पर दया करेंगे, क्योंकि उस पर अनुग्रह करने का समय आ गया है; हाँ, नियत समय आ पहुँचा है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תָקוּם
  choice: आप उठेंगे
  rationale: क़ाल अपूर्ण 2 पुल्लिंग एकवचन यहाँ परमेश्वर की भावी निर्णायक कार्रवाई व्यक्त करता है। ‘उठेंगे’ मूल के सजीव मानवरूपी मुहावरे को बनाए रखता है।
- source_word: תְּרַחֵם
  choice: दया करेंगे
  rationale: पिएल अपूर्ण रूप करुणा या दया दिखाने का अर्थ देता है। आधुनिक हिन्दी में ‘दया करेंगे’ स्वाभाविक और गरिमापूर्ण है।
- source_word: צִיּוֹן
  choice: सिय्योन
  rationale: मूल पाठ के स्थान-नाम को व्याख्यात्मक रूप से ‘यरूशलेम’ या ‘परमेश्वर के लोग’ बनाने के बजाय लिप्यंतरित किया गया है।
- source_word: עֵת לְחֶנְנָהּ
  choice: उस पर अनुग्रह करने का समय
  rationale: חנן का अर्थ कृपा या अनुग्रह दिखाना है और स्त्रीलिंग प्रत्यय सिय्योन की ओर संकेत करता है। यह रूप अर्थ और हिन्दी की स्वाभाविकता दोनों को सुरक्षित रखता है।
- source_word: בָא מוֹעֵד
  choice: ठहराया हुआ समय आ पहुँचा है
  rationale: מוֹעֵד किसी निश्चित या नियुक्त समय को दर्शाता है और perfect בָא उसके वर्तमान-सापेक्ष आगमन को व्यक्त करता है। ‘आ पहुँचा है’ इस पूर्ण आगमन पर उचित बल देता है।
- source_word: כִּי
  choice: क्योंकि … हाँ
  rationale: पहला כִּי कारण प्रस्तुत करता है। दूसरे का ‘हाँ’ के रूप में अनुवाद निकटवर्ती कथन की पुष्टि और बल को स्वाभाविक हिन्दी में व्यक्त करता है, जबकि दोनों पदों का संबंध सुरक्षित रहता है।
theological_decisions:
- issue: सिय्योन को ठोस नाम के रूप में रखना या उसकी व्याख्या करना
  choice: सिय्योन को नाम के रूप में बनाए रखा गया।
  alternative: यरूशलेम; परमेश्वर के लोग
  rationale: इब्रानी पाठ स्पष्ट रूप से सिय्योन कहता है। इसके व्यापक धार्मिक-साहित्यिक अर्थ संदर्भ से उभरने चाहिए, मुख्य पाठ में पहले से आरोपित नहीं होने चाहिए।
- issue: מוֹעֵד में समय की नियुक्ति या निश्चितता
  choice: ठहराया हुआ समय
  alternative: निश्चित समय; नियत समय
  rationale: यह पद ऐसे समय को दर्शाता है जो पहले से निर्धारित है। ‘ठहराया हुआ’ परमेश्वर की योजना का संकेत दे सकता है, पर यह स्पष्ट नहीं करता कि नियुक्ति किसने की, इसलिए मूल की संयमित अभिव्यक्ति बनी रहती है।
translation_notes:
  register: आधुनिक मानक हिन्दी, आदरसूचक ‘आप’, और भजन-साहित्य के अनुरूप गरिमापूर्ण किंतु सहज शैली अपनाई गई है। अर्धविराम दोनों कारणसूचक कथनों के निकट संबंध को स्पष्ट करता है।
