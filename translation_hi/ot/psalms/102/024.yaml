language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: אֹמַ֗ר אֵלִ֗/י אַֽל תַּ֭עֲלֵ/נִי בַּ/חֲצִ֣י יָמָ֑/י בְּ/ד֖וֹר דּוֹרִ֣ים שְׁנוֹתֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/102/024.yaml
  text: I say[a], “My God, do not take me away in the middle of my days[b]; your years are through all generations.”
translation:
  language: hi
  text: मैं कहता हूँ, “हे मेरे परमेश्वर, मेरे दिनों के बीच में मुझे न उठा ले[a]; तेरे वर्ष पीढ़ी-दर-पीढ़ी बने रहते हैं।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या अधिक शाब्दिक रूप से, “मेरे दिनों के बीच में मुझे ऊपर न ले जा।” यहाँ इब्रानी क्रिया संदर्भ में संभवतः समय से पहले जीवन से ले लिए जाने का संकेत देती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אֹמַר
  choice: मैं कहता हूँ
  rationale: क़ाल अपूर्ण, प्रथम पुरुष एकवचन, कविता में वर्तमान निवेदन अथवा कथन-परिचायक के रूप में समझा जा सकता है। यहाँ वर्तमानकाल प्रार्थना की तात्कालिकता को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: אֵלִי
  choice: हे मेरे परमेश्वर
  rationale: संज्ञा के साथ प्रथम पुरुष एकवचन प्रत्यय का अर्थ ‘मेरे परमेश्वर’ है; ‘हे’ संबोधन को आधुनिक हिन्दी में स्पष्ट और गरिमापूर्ण बनाता है।
- source_word: אַל תַּעֲלֵנִי
  choice: मुझे उठा न ले
  rationale: אַל निषेधात्मक विनती है और עלה का हिफ़ील रूप मूलतः ‘ऊपर ले जाना/उठाना’ कह सकता है। जीवन के बीच में होने के संदर्भ में यह समय से पहले जीवन से उठा लिए जाने की ओर संकेत करता है; हिन्दी ‘उठा न ले’ मूल बिंब और मृत्यु-संबंधी आशय दोनों को बनाए रखती है।
- source_word: בַּחֲצִי יָמָי
  choice: मेरे जीवन के आधे में
  rationale: शाब्दिक अर्थ ‘मेरे दिनों के आधे में’ है। हिन्दी में ‘मेरे जीवन के आधे में’ जीवनकाल के बीच में काट दिए जाने का रूपक स्पष्ट रखता है और अस्वाभाविक शब्दशः अनुवाद से बचता है।
- source_word: בְּדוֹר דּוֹרִים
  choice: पीढ़ी-दर-पीढ़ी
  rationale: यह इब्रानी पद successive generations में निरंतरता व्यक्त करता है। ‘पीढ़ी-दर-पीढ़ी’ संक्षिप्त, स्वाभाविक और मूल मुहावरे के निकट है।
- source_word: שְׁנוֹתֶיךָ
  choice: तेरे वर्ष
  rationale: बहुवचन संज्ञा के साथ द्वितीय पुरुष पुल्लिंग एकवचन प्रत्यय का सीधा अर्थ है। यह प्रार्थी के सीमित जीवन और परमेश्वर के निरंतर अस्तित्व के बीच विरोध को सुरक्षित रखता है।
theological_decisions:
- issue: मृत्यु के लिए ऊपर उठाए जाने का बिंब
  choice: ‘मुझे उठा न ले’—समय से पहले जीवन से ले लिए जाने की विनती, साथ ही मूल ‘ऊपर उठाने’ का बिंब सुरक्षित
  alternative: ‘मुझे दूर न कर’ अथवा अधिक व्याख्यात्मक ‘मुझे मरने न दे’
  rationale: निकटवर्ती संदर्भ प्रार्थी के घटते जीवन की तुलना परमेश्वर के पीढ़ी-दर-पीढ़ी वर्षों से करता है। ‘मरने न दे’ आशय को अत्यधिक स्पष्ट करके मूल बिंब मिटा देता, जबकि ‘उठा न ले’ हिन्दी में मृत्यु का संभावित संकेत भी देता है और इब्रानी रूपक को भी बनाए रखता है।
- issue: परमेश्वर के वर्षों की निरंतरता
  choice: ‘तेरे वर्ष ... बने रहते हैं’
  alternative: केवल ‘तेरे वर्ष पीढ़ी-दर-पीढ़ी हैं’
  rationale: इब्रानी में नाममात्र वाक्य है और क्रिया निहित है। हिन्दी में ‘बने रहते हैं’ स्वाभाविक वाक्य पूरा करती है, बिना अनंतता की कोई अतिरिक्त व्यवस्थित धर्मवैज्ञानिक परिभाषा जोड़े।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण प्रार्थना-शैली वाला रूप चुना गया है। ‘हे’ और ‘तेरे’ भजन की सीधी संबोधन-भाषा बनाए रखते हैं। मुख्य पाठ में रूपक को अत्यधिक व्याख्यायित नहीं किया गया; आवश्यक शाब्दिक विकल्प पादटिप्पणी में दिया गया है।
