  language: hi
  text: 'मैं जागता रहता हूँ;

    मैं छत पर अकेले पक्षी के समान हूँ।[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “छत पर अकेली गौरैया के समान।” इब्रानी शब्द צִפּוֹר सामान्य रूप से किसी पक्षी को दर्शाता है, हालाँकि परंपरागत रूप से इसका अधिक विशिष्ट अनुवाद “गौरैया” भी किया गया है।
