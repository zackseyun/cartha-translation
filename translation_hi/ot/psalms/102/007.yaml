lexical_decisions:
- source_word: שָׁקַדְתִּי
  choice: मैं जागता रहता हूँ
  rationale: क्रिया שׁקד यहाँ विलाप के संदर्भ में पहरा देने से अधिक जागते या नींद न आने की अवस्था व्यक्त करती है। यह चयन उस निरंतर जागरण को सहज आधुनिक हिन्दी में रखता है।
- source_word: וָאֶהְיֶה
  choice: मैं ... हूँ
  rationale: यह रूप पहले कथन से जुड़ी हुई अवस्था को आगे बढ़ाता है। हिन्दी का वर्तमानकाल काव्यात्मक वर्णन को स्वाभाविक रखता है।
- source_word: כְּצִפּוֹר
  choice: पक्षी के समान
  rationale: צִפּוֹר पक्षी के लिए सामान्य शब्द है और अनिवार्य रूप से गौरैया नहीं दर्शाता; इसलिए व्यापक अर्थ मुख्य पाठ में सुरक्षित रखा गया है।
- source_word: בּוֹדֵד
  choice: अकेले
  rationale: यह शब्द अलग या अकेला होने की अवस्था बताता है। 'अकेले' स्वाभाविक है और 'उदास' या 'एकाकी' कहकर भाव को अनावश्यक रूप से अधिक निश्चित नहीं करता।
- source_word: עַל גָּג
  choice: छत पर
  rationale: यह इब्रानी पदबंध का सीधा और आधुनिक हिन्दी में स्वाभाविक रूप है तथा खुले में अलग पड़े पक्षी का बिंब बनाए रखता है।
