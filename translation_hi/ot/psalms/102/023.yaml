  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: עִנָּ֖ה בַ/דֶּ֥רֶךְ כח/ו קִצַּ֥ר יָמָֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/102/023.yaml
  text: He afflicted my strength on the way[b][a]; he shortened my days.
translation:
  language: hi
  text: उसने मार्ग में[b] उसके बल को क्षीण कर दिया[a]; उसने मेरे दिन घटा दिए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी पाठ में ‘उसके बल’ है; आसपास के प्रथम-पुरुष संदर्भ के कारण बहुत-से लोग इसे ‘मेरे बल’ समझते हैं।
    reason: alternative_reading
  - marker: b
    text: या ‘जीवन-यात्रा में’; शाब्दिक अर्थ ‘मार्ग में’ है।
    reason: lexical_alternative
lexical_decisions:
- source_word: עִנָּה
  choice: क्षीण कर दिया
  rationale: पिएल रूप यहाँ किसी को दबाने, दीन करने या दुर्बल करने का भाव देता है। ‘बल’ कर्म होने के कारण ‘क्षीण कर दिया’ आधुनिक हिन्दी में स्वाभाविक है और दुर्बल किए जाने का अर्थ स्पष्ट रखता है।
- source_word: בַדֶּרֶךְ
  choice: मार्ग में
  rationale: इब्रानी पद का शाब्दिक चित्र ‘मार्ग में’ है। यह जीवन-यात्रा की ओर संकेत कर सकता है, पर मुख्य पाठ में मूल रूपक सुरक्षित रखा गया है।
- source_word: כחו
  choice: उसके बल को
  rationale: दिए गए व्यंजनात्मक पाठ में तीसरे पुरुष एकवचन का प्रत्यय है, इसलिए ‘उसके बल’ रखा गया है। आसपास का प्रथम-पुरुष संदर्भ ‘मेरे बल’ समझने का आधार देता है, जिसे पाद-टिप्पणी में बताया गया है।
- source_word: קִצַּר
  choice: घटा दिए
  rationale: क्रिया का अर्थ छोटा करना या घटा देना है। ‘दिन’ के साथ यह हिन्दी में आयु कम किए जाने का स्वाभाविक काव्यात्मक ढंग है।
- source_word: יָמָי
  choice: मेरे दिन
  rationale: यह प्रथम पुरुष एकवचन प्रत्यय सहित रूप है और भजनकार के जीवन के दिनों को सूचित करता है।
theological_decisions:
- issue: ‘उसके बल’ और ‘मेरे दिन’ के बीच पुरुष-वचन का परिवर्तन
  choice: दिए गए इब्रानी पाठ के अनुसार पहले खंड में तीसरा पुरुष और दूसरे में पहला पुरुष बनाए रखा गया है।
  alternative: 'दोनों खंड प्रथम पुरुष में पढ़े जा सकते हैं: ‘उसने मार्ग में मेरे बल को क्षीण कर दिया; उसने मेरे दिन घटा दिए।’'
  rationale: दिए गए स्रोत-पाठ में वास्तविक व्याकरणिक तनाव है। मुख्य पाठ उसे चुपचाप एकरूप नहीं करता; संदर्भानुकूल प्रथम-पुरुष समझ को पाद-टिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। ‘मार्ग’ मूल काव्यात्मक रूपक को बनाए रखता है, जबकि ‘बल को क्षीण कर दिया’ सामान्य हिन्दी में अर्थ को स्वाभाविक ढंग से व्यक्त करता है।
