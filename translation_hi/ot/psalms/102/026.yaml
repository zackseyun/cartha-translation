  yaml_path: translation/ot/psalms/102/026.yaml
  text: They will perish[a], but you will remain; all of them will wear out like a garment. Like clothing you will change them[b], and they will pass away.
translation:
  language: hi
  text: वे नष्ट हो जाएँगे, पर तू बना रहेगा[a]; वे सब वस्त्र के समान घिस जाएँगे। वस्त्र की तरह तू उन्हें बदल देगा[b], और वे चले जाएँगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक अर्थ ‘तू खड़ा रहेगा’ है; यहाँ इसका भाव स्थायी रूप से बने रहने का है।
    reason: lexical_alternative
  - marker: b
    text: इसका अर्थ ‘तू उनके स्थान पर अन्य रख देगा’ भी हो सकता है; हिब्रू में वस्त्र बदलने का रूपक जारी रहता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵמָּה
  choice: वे
  rationale: यह स्वतंत्र बहुवचन सर्वनाम प्रसंग में पहले उल्लिखित आकाश और पृथ्वी की ओर संकेत करता है और ‘तू’ के साथ विरोध को स्वाभाविक रूप से बनाए रखता है।
- source_word: יֹאבֵדוּ
  choice: नष्ट हो जाएँगे
  rationale: אבד का क़ल अपूर्ण रूप विनाश या मिट जाने की ओर संकेत करता है; यह चयन पूर्ण अस्तित्व-लोप को अनावश्यक रूप से निश्चित किए बिना भाव व्यक्त करता है।
- source_word: וְאַתָּה
  choice: पर तू
  rationale: संयोजक यहाँ नश्वर सृष्टि और स्थायी परमेश्वर के बीच प्रबल विरोध प्रकट करता है। काव्यात्मक संबोधन में ‘तू’ स्वाभाविक है।
- source_word: תַעֲמֹד
  choice: बना रहेगा
  rationale: शाब्दिक अर्थ ‘खड़ा रहेगा’ है, पर यहाँ क्रिया स्थायी बने रहने का भाव देती है। मुख्य पाठ में अर्थ स्पष्ट किया गया है और शाब्दिक विकल्प पादटिप्पणी में रखा गया है।
- source_word: וְכֻלָּם
  choice: वे सब
  rationale: यह पहले उल्लिखित समस्त सृजित वस्तुओं को समावेशी रूप से संदर्भित करता है।
- source_word: כַּבֶּגֶד
  choice: वस्त्र के समान
  rationale: בגד वस्त्र का सामान्य शब्द है और घिसने-पुराने होने के रूपक को बनाए रखता है।
- source_word: יִבְלוּ
  choice: पुराने हो जाएँगे
  rationale: בלה विशेषतः कपड़े के घिसकर पुराना होने को व्यक्त करता है; हिन्दी में यह वाक्यांश वस्त्र-रूपक के भीतर स्वाभाविक है।
- source_word: כַּלְּבוּשׁ
  choice: पहनावे की तरह
  rationale: לבוש भी वस्त्र या पहनावे को दर्शाता है। ‘पहनावा’ समानांतरता रखते हुए बोझिल पुनरावृत्ति से बचाता है।
- source_word: תַּחֲלִיפֵם
  choice: तू उन्हें बदल देगा
  rationale: חלף का हिफ़ील रूप यहाँ बदलने, बदलकर दूसरा रखने, या अदला-बदली करने का भाव दे सकता है। ‘बदल देगा’ कपड़े बदलने के रूपक और मूल अस्पष्टता दोनों को सुरक्षित रखता है।
- source_word: וְיַחֲלֹפוּ
  choice: वे जाते रहेंगे
  rationale: חלף का क़ल रूप बीतने या चले जाने का भाव देता है। ‘जाते रहेंगे’ प्रक्रिया और सृजित जगत की क्षणभंगुरता व्यक्त करता है, बिना इसे पिछले क्रियापद के समान निष्क्रिय ‘बदले जाएँगे’ बना देने के।
theological_decisions:
- issue: परमेश्वर की स्थिरता और सृष्टि की नश्वरता का विरोध
  choice: सृष्टि के नष्ट और पुराने होने के विपरीत परमेश्वर के बने रहने को स्पष्ट किया गया है।
  alternative: ‘तू खड़ा रहेगा’ का अधिक शाब्दिक अनुवाद।
  rationale: प्रसंग में ‘खड़ा रहना’ निरंतर अस्तित्व और स्थायित्व का मुहावरा है। ‘बना रहेगा’ धार्मिक पारिभाषिक शब्दावली जोड़े बिना विरोध का आशय स्पष्ट करता है।
- issue: सृष्टि को बदलने अथवा उसके स्थान पर दूसरी रखने की संभावना
  choice: ‘बदल देगा’ रखा गया है।
  alternative: ‘उनके स्थान पर दूसरा रख देगा’ या ‘उन्हें बदलकर रख देगा’।
  rationale: हिब्रू क्रिया दोनों अर्थ-संभावनाएँ रखती है और वस्त्र बदलने का रूपक भी सक्रिय है; इसलिए मुख्य पाठ को अनावश्यक रूप से किसी एक व्याख्या तक सीमित नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण काव्यात्मक शैली रखी गई है। परमेश्वर को संबोधित करने के लिए ‘तू’ चुना गया है, जो भजन-साहित्य के सीधे, एकवचन संबोधन और निकटता को बनाए रखता है। दोनों पादटिप्पणी चिह्न मुख्य पाठ में उपस्थित हैं।
