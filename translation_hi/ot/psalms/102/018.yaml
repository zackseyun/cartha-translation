  yaml_path: translation/ot/psalms/102/018.yaml
  text: This will be written for a generation to come[a], and a people yet to be created will praise Yah.
translation:
  language: hi
  text: 'यह आने वाली पीढ़ी के लिए लिखा जाएगा,


    और एक ऐसी प्रजा, जो अभी रची जाएगी,


    याह[a] की स्तुति करेगी।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में ‘याह’ परमेश्वर के नाम का संक्षिप्त काव्यात्मक रूप है; कई अनुवाद इसे ‘प्रभु’ कर देते हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּכָּתֶב
  choice: लिखा जाएगा
  rationale: כתב के निफ़ाल अपूर्ण रूप को निष्क्रिय भविष्य के रूप में प्रस्तुत किया गया है; संदर्भ इस साक्ष्य को भावी पीढ़ी के लिए लिखे जाने की ओर संकेत करता है।
- source_word: זֹאת
  choice: यह
  rationale: यह संकेतवाचक सर्वनाम पहले कही गई प्रार्थना या गवाही की ओर समग्र रूप से संकेत करता है; कोई व्याख्यात्मक संज्ञा जोड़ना आवश्यक नहीं है।
- source_word: לְדוֹר אַחֲרוֹן
  choice: आनेवाली पीढ़ी के लिए
  rationale: אַחֲרוֹן यहाँ कालगत अर्थ में बाद की या भावी पीढ़ी बताता है; इसे अनिवार्य रूप से अंतकालीन ‘अन्तिम पीढ़ी’ नहीं माना गया है।
- source_word: וְעַם
  choice: और एक ऐसी प्रजा
  rationale: עַם का अर्थ यहाँ ‘प्रजा/लोगों का समुदाय’ है। लेख की अनुपस्थिति के कारण अनिश्चित भाव को ‘एक ऐसी प्रजा’ से व्यक्त किया गया है।
- source_word: נִבְרָא
  choice: जो अभी रची जानी है
  rationale: ברא का निष्क्रिय कृदन्त भावी संदर्भ में ऐसी प्रजा को दर्शाता है जो अभी अस्तित्व में नहीं आई। यह रूप हिंदी में भावी आशय को स्वाभाविक और स्पष्ट रखता है।
- source_word: יְהַלֶּל
  choice: स्तुति करेगी
  rationale: הלל के पिएल अपूर्ण रूप को भविष्यकाल में रखा गया है और स्त्रीलिंग क्रिया ‘प्रजा’ के हिंदी व्याकरण के अनुरूप है।
- source_word: יָהּ
  choice: याह
  rationale: यह परमेश्वर के नाम का संक्षिप्त काव्यात्मक रूप है, पूर्ण रूप יהוה नहीं। ‘याह’ मूल पाठ का यह वास्तविक भेद बनाए रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יָהּ का अनुवाद
  choice: याह
  alternative: प्रभु
  rationale: मूल पाठ में पूर्ण नाम יהוה के बजाय उसका संक्षिप्त काव्यात्मक रूप יָהּ है। ‘याह’ इस भेद और काव्यात्मक प्रभाव को सुरक्षित रखता है; ‘प्रभु’ अधिक परिचित हो सकता है, पर मूल रूप को समतल कर देता है।
- issue: אַחֲרוֹן का कालगत आशय
  choice: आनेवाली
  alternative: अन्तिम
  rationale: इस संदर्भ में समानांतर पंक्ति भविष्य में रची जानेवाली प्रजा की बात करती है, इसलिए ‘बाद की/भावी’ पीढ़ी स्वाभाविक अर्थ है। ‘अन्तिम’ चुनने से अनावश्यक अंतकालीन निश्चितता आ सकती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सहज रखी गई है। ‘प्रजा’ सामूहिक עַם और एकवचन क्रिया के संबंध को स्वाभाविक हिंदी में बनाए रखती है। पंक्ति-विन्यास इब्रानी काव्य के दो समानांतर कथनों को उभारता है।
