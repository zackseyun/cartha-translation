lexical_decisions:
- source_word: יָמַי
  choice: मेरे दिन
  rationale: इब्रानी में बहुवचन संज्ञा पर प्रथम पुरुष एकवचन प्रत्यय है। ‘मेरे दिन’ मूल बिंब और जीवनकाल की ओर संकेत करने वाले काव्यात्मक मुहावरे—दोनों को बनाए रखता है।
- source_word: כְּצֵל
  choice: छाया के समान
  rationale: उपसर्ग כְּ तुलना प्रकट करता है, और צֵל का सामान्य अर्थ ‘छाया’ है। यह नश्वरता के बाइबलीय बिंब को सुरक्षित रखता है।
- source_word: נָטוּי
  choice: ढलती
  rationale: נטה से बना यह रूप मूलतः ‘फैली हुई/लंबी खिंची हुई’ छाया बताता है। प्रसंग में यह शाम को लंबी होती छाया और निकट आते अंत का बोध कराता है; स्वाभाविक हिन्दी में ‘ढलती छाया’ उस सांध्यकालीन और क्षयशील बिंब को व्यक्त करती है, जबकि शाब्दिक विकल्प पादटिप्पणी में रखा गया है।
- source_word: וַאֲנִי
  choice: और मैं
  rationale: सरल संयोजक और सर्वनाम को बिना अनावश्यक विरोधात्मक अर्थ जोड़े निकटता से प्रस्तुत करता है।
- source_word: כָּעֵשֶׂב
  choice: घास के समान
  rationale: עֵשֶׂב घास अथवा हरी वनस्पति को सूचित करता है। क्षणभंगुरता के इस काव्यात्मक संदर्भ में ‘घास’ सर्वाधिक सहज और परिचित है।
- source_word: אִיבָשׁ
  choice: मुरझा रहा हूँ
  rationale: יבשׁ का अर्थ ‘सूखना, मुरझाना’ है। प्रथम पुरुष क्रिया और क्रमिक क्षीणता को स्वाभाविक आधुनिक हिन्दी में व्यक्त किया गया है।
