source:
  edition: WLC
  text: לְ֭/פָנִים הָ/אָ֣רֶץ יָסַ֑דְתָּ וּֽ/מַעֲשֵׂ֖ה יָדֶ֣י/ךָ שָׁמָֽיִם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/102/025.yaml
  text: Long ago you founded the earth[a], and the heavens are the work of your hands.
translation:
  language: hi
  text: बहुत पहले आपने पृथ्वी की नींव डाली[a], और आकाश आपके हाथों का काम है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “प्राचीनकाल में आपने पृथ्वी को स्थापित किया।”
    reason: יסד के नींव डालने और स्थापित करने—दोनों अर्थ-रंगों को दिखाने वाला शाब्दिक विकल्प।
lexical_decisions:
- source_word: לְפָנִים
  choice: बहुत पहले
  rationale: यह कालवाचक पद ‘प्राचीनकाल में/बहुत पहले’ का अर्थ देता है; ‘बहुत पहले’ सहज आधुनिक हिन्दी में इसकी प्राचीनता का भाव बनाए रखता है।
- source_word: הָאָרֶץ
  choice: पृथ्वी
  rationale: ‘आकाश’ के समानांतर यहाँ स्थानीय ‘भूमि’ नहीं, बल्कि सृष्टि के व्यापक अर्थ में पृथ्वी अभिप्रेत है।
- source_word: יָסַדְתָּ
  choice: आपने ... नींव डाली
  rationale: יסד नींव रखने या स्थापित करने का बिंब व्यक्त करता है; यह चयन उस ठोस सृष्टि-बिंब को स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: וּמַעֲשֵׂה יָדֶיךָ
  choice: आपके हाथों का काम है
  rationale: यह वाक्यांश परमेश्वर की कारीगरी का मानवीय बिंब ज्यों का त्यों रखता है; हिन्दी में पूर्ण वाक्य के लिए ‘है’ जोड़ा गया है।
- source_word: שָׁמָיִם
  choice: आकाश
  rationale: हिन्दी में ‘आकाश’ सामूहिक और व्यापक अर्थ में स्वाभाविक है तथा पृथ्वी के साथ ब्रह्मांडीय समानांतरता बनाए रखता है।
theological_decisions:
- issue: सृष्टि का कार्य सीधे परमेश्वर को सौंपना
  choice: द्वितीय पुरुष संबोधन रखते हुए पृथ्वी की नींव डालने और आकाश को हाथों का काम बताना
  alternative: मानवीय ‘हाथों’ के बिंब को अमूर्त ‘आपकी रचना’ में बदलना
  rationale: इब्रानी पाठ परमेश्वर को सीधे संबोधित करके सृष्टि का कार्य उन्हीं का बताता है और ‘हाथों’ का काव्यात्मक मानवीय बिंब बनाए रखता है; अनुवाद इसे न नरम करता है, न किसी विशिष्ट धर्मवैज्ञानिक व्याख्या से बढ़ाता है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण काव्यात्मक हिन्दी। आदरसूचक ‘आप’ प्रार्थना के सीधे संबोधन को व्यक्त करता है; ‘पृथ्वी’ और ‘आकाश’ ब्रह्मांडीय समानांतरता को बनाए रखते हैं।
