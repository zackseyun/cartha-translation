  yaml_path: translation/ot/psalms/102/003.yaml
  text: For my days vanish like smoke[a], and my bones burn like a hearth.
translation:
  language: hi
  text: 'क्योंकि मेरे दिन धुएँ की तरह विलीन हो गए हैं,

    और मेरी हड्डियाँ अंगीठी की तरह झुलस गई हैं।[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मेरी हड्डियाँ जलती लकड़ी की तरह झुलस गई हैं,” “मेरी हड्डियाँ भट्ठी की तरह झुलस गई हैं,” अथवा “मेरी हड्डियाँ अंगीठी की तरह झुलस गई हैं।” जलती वस्तु या स्थान के लिए प्रयुक्त इब्रानी शब्द दुर्लभ है; इसलिए सटीक छवि अनिश्चित है, यद्यपि तीव्र ताप का भाव स्पष्ट है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पद विलाप का कारण बताता है; ‘क्योंकि’ कारणसूचक संबंध को स्वाभाविक और स्पष्ट रखता है।
- source_word: כָלוּ בְעָשָׁן יָמָי
  choice: मेरे दिन धुएँ की तरह मिट गए हैं
  rationale: כָלוּ समाप्त हो जाने या चुक जाने का भाव देता है, और בְעָשָׁן यहाँ धुएँ के विलीन होने की तुलनात्मक छवि प्रस्तुत करता है। ‘मिट गए हैं’ इस क्षणभंगुरता और समाप्ति दोनों को व्यक्त करता है।
- source_word: וְעַצְמוֹתַי
  choice: और मेरी हड्डियाँ
  rationale: शारीरिक कष्ट की गहरी काव्यात्मक छवि को सीधे बनाए रखता है।
- source_word: כְּמוֹ קֵד
  choice: अंगीठी की तरह
  rationale: कֵד दुर्लभ शब्द है और किसी जलती वस्तु या अग्नि के स्थान को सूचित कर सकता है। ‘अंगीठी’ तीव्र ताप की छवि को सहज हिंदी में व्यक्त करती है, जबकि सटीक संदर्भ की अनिश्चितता पादटिप्पणी में सुरक्षित है।
- source_word: נִחָרוּ
  choice: झुलस गई हैं
  rationale: यह क्रिया तपने, जलने या झुलसने का भाव देती है। ‘झुलस गई हैं’ हड्डियों पर तीव्र ताप के असर को जीवंत ढंग से व्यक्त करती है, बिना पूर्णतः जलकर नष्ट होने का अर्थ थोपे।
