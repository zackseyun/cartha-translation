source:
  edition: WLC
  text: כִּֽי רָצ֣וּ עֲ֭בָדֶי/ךָ אֶת אֲבָנֶ֑י/הָ וְֽ/אֶת עֲפָרָ֥/הּ יְחֹנֵֽנוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/102/014.yaml
  text: For your servants delight in her stones and show favor to her dust[a].
translation:
  language: hi
  text: क्योंकि तेरे सेवक उसके पत्थरों को प्रिय मानते हैं और उसकी धूल पर दया करते हैं।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तेरे सेवक उसके पत्थरों में आनंद पाते हैं और उसकी धूल पर तरस खाते हैं।”
    reason: रָצָה के ‘प्रसन्न होना/आनंद पाना’ और חָנַן के ‘करुणा करना/तरस खाना’ वाले वैकल्पिक अर्थों को दर्शाता है।
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले पद की आशा और विनती का कारण बताता है; हिन्दी में ‘क्योंकि’ इस कारणात्मक सम्बन्ध को स्पष्ट और स्वाभाविक रखता है।
- source_word: רָצוּ
  choice: प्रेम रखते हैं
  rationale: यहाँ क्रिया सिय्योन के पत्थरों के प्रति प्रसन्नता, अनुकूल लगाव और मूल्यवान समझने का भाव व्यक्त करती है। ‘प्रेम रखते हैं’ खंडहरों से सेवकों के गहरे भावनात्मक लगाव को सहज हिन्दी में प्रकट करता है।
- source_word: עֲבָדֶיךָ
  choice: तेरे सेवक
  rationale: भजन में परमेश्वर को सीधे सम्बोधित करते हुए ‘सेवक’ स्वाभाविक और प्रतिष्ठित शब्द है; यह अनावश्यक रूप से दासत्व पर बल नहीं देता।
- source_word: אֶת אֲבָנֶיהָ
  choice: उसके पत्थरों
  rationale: स्त्रीलिंग प्रत्यय सिय्योन/यरूशलेम की ओर संकेत करता है। हिन्दी का ‘उसके’ व्याकरणतः ‘पत्थरों’ से मेल खाता है, जबकि सन्दर्भ नगर के काव्यात्मक व्यक्तिकरण को बनाए रखता है।
- source_word: וְאֶת עֲפָרָהּ
  choice: और उसकी धूल
  rationale: ‘धूल’ मूल बिंब को सुरक्षित रखती है; प्रसंग में इसमें उजड़े नगर की मिट्टी और मलबे का भाव भी समाया है।
- source_word: יְחֹנֵנוּ
  choice: दया करते हैं
  rationale: חנן कृपा, अनुग्रह या करुणा दिखाने का भाव रखता है। धूल को कर्म बनाकर ‘दया करते हैं’ मूल की मार्मिकता और व्यक्तिकरण को बनाए रखता है।
theological_decisions:
- issue: सिय्योन/यरूशलेम का स्त्रीरूप व्यक्तिकरण
  choice: सन्दर्भ में नगर को व्यक्तिरूप मानते हुए ‘उसके/उसकी’ का प्रयोग
  alternative: नगर को निर्जीव स्थान मानकर केवल स्वामित्वसूचक रूप में पढ़ना
  rationale: इब्रानी के स्त्रीलिंग प्रत्यय सिय्योन की ओर संकेत करते हैं। हिन्दी में परसर्गयुक्त बहुवचन ‘पत्थरों’ के साथ ‘उसके’ और स्त्रीलिंग ‘धूल’ के साथ ‘उसकी’ व्याकरणतः आवश्यक हैं; फिर भी करुणा की भाषा मूल व्यक्तिकरण को सुरक्षित रखती है।
- issue: धूल पर दया करने का काव्यात्मक तनाव
  choice: असामान्य किन्तु अर्थपूर्ण बिंब को ज्यों का त्यों रखना
  alternative: इसे सामान्य बनाकर ‘उसकी धूल से भी लगाव रखते हैं’ कहना
  rationale: मूल पाठ प्रेम और करुणा के लिए अलग क्रियाएँ रखता है। उन्हें एक ही ‘लगाव’ में मिला देना स्रोत की शब्दगत तथा भावात्मक भिन्नता को मिटा देता।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, काव्यात्मक और गरिमापूर्ण शैली। परमेश्वर के सीधे सम्बोधन में ‘तेरे’ भजन की निकटता को बनाए रखता है। ‘धूल पर दया’ जानबूझकर कुछ असामान्य रखा गया है, क्योंकि मूल इब्रानी का बिंब भी ऐसा ही मार्मिक व्यक्तिकरण करता है।
