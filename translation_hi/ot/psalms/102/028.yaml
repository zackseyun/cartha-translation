  text: The children of your servants will dwell[a], and their offspring will be established before you.
translation:
  language: hi
  text: तेरे सेवकों की संतान[a] बसेगी, और उनका वंश तेरे सामने स्थिर रहेगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से “पुत्रों”; इसी पद में “वंश” के लिए मूल शब्द का शाब्दिक अर्थ “बीज” है।
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי
  choice: संतान
  rationale: בֵּן का यह संबंधवाचक बहुवचन वंशजों को सूचित करता है। आधुनिक हिन्दी में ‘संतान’ स्त्री और पुरुष दोनों को समेटते हुए स्वाभाविक है; ‘पुत्र’ अधिक शब्दशः विकल्प है।
- source_word: עֲבָדֶיךָ
  choice: तेरे सेवकों
  rationale: भजन में परमेश्वर को संबोधित करते समय עֶבֶד के लिए ‘सेवक’ प्रसंगानुकूल और स्वाभाविक है; यहाँ दासत्व की सामाजिक स्थिति पर बल नहीं है।
- source_word: יִשְׁכּוֹנוּ
  choice: बसी रहेगी
  rationale: שׁכן का अर्थ बसना या निवास करना है। ‘बसी रहेगी’ निरंतर निवास का भाव व्यक्त करता है, पर मूल में न पाए जाने वाले ‘सुरक्षित’ भाव को नहीं जोड़ता।
- source_word: וְזַרְעָם
  choice: और उनका वंश
  rationale: זֶרַע का शाब्दिक अर्थ ‘बीज’ है, पर यहाँ यह सामूहिक रूप से वंश या भावी संतति को दर्शाता है। ‘वंश’ आधुनिक हिन्दी में स्पष्ट और काव्यात्मक रूप से उपयुक्त है।
- source_word: לְפָנֶיךָ
  choice: तेरे सामने
  rationale: यह पदबंध शाब्दिक रूप से ‘तेरे मुख के सामने’ और अर्थतः परमेश्वर की उपस्थिति में होने को व्यक्त करता है। ‘तेरे सामने’ संक्षिप्त तथा सहज है।
- source_word: יִכּוֹן
  choice: स्थिर रहेगा
  rationale: כון के निफ़अल रूप में स्थापित, दृढ़ या स्थिर होने का परिणामसूचक भाव है। ‘स्थिर रहेगा’ हिन्दी में उस टिकाऊ स्थिति को स्वाभाविक ढंग से व्यक्त करता है।
theological_decisions:
- issue: क्या इस प्रतिज्ञा को स्पष्ट रूप से वाचागत या अंत-कालीन बनाया जाए
  choice: सेवकों के वंश के परमेश्वर के सामने टिके रहने का कथन यथावत रखा गया है।
  alternative: इसे इस्राएल के साथ वाचा या अंतिम उद्धार की स्पष्ट प्रतिज्ञा के रूप में अनूदित करना।
  rationale: इब्रानी पाठ स्थायी निवास और दृढ़ता का आश्वासन देता है, पर उसकी विशिष्ट वाचागत व्यवस्था या अंत-कालीन पूर्ति को इस पद में स्पष्ट नहीं करता।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी; परमेश्वर के लिए भजन की एकवचन आत्मीय संबोधन-शैली ‘तेरे’ रखी गई है। ‘बसी रहेगी’ और ‘स्थिर रहेगा’ समानांतर पंक्तियों की स्थायित्व-विषयक गति को बनाए रखते हैं।
