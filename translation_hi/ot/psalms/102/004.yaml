  text: My heart is struck like grass and withered[c][b][a], for I forget to eat my bread.
translation:
  language: hi
  text: मेरा हृदय घास की तरह मारा गया और सूख गया है,[a] क्योंकि मैं अपनी रोटी[b] खाना भूल जाता हूँ।[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “मेरा हृदय मारा गया है, घास की तरह सूख गया है।”
    reason: previous_rendering
  - marker: b
    text: “अपनी रोटी” का अर्थ अधिक सामान्य रूप से “अपना भोजन” भी हो सकता है।
    reason: lexical_alternative
  - marker: c
    text: या “मैं अपनी रोटी खाना भूल गया हूँ”; हिब्रू पूर्ण क्रिया चल रही दशा अथवा पूरी हो चुकी क्रिया के वर्तमान परिणाम—दोनों को व्यक्त कर सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הוּכָּה
  choice: आघात खाकर
  rationale: नכה के निष्क्रिय भाव—मार या आघात सहने—को स्वाभाविक हिन्दी में व्यक्त करता है। ‘मारा गया’ यहाँ मृत्यु का अर्थ दे सकता था, और ‘कुचला गया’ मूल से अधिक विशिष्ट होता।
- source_word: כָעֵשֶׂב
  choice: घास की तरह
  rationale: उपमा को सीधे और सामान्य आधुनिक हिन्दी में बनाए रखता है।
- source_word: וַיִּבַשׁ
  choice: मुरझा गया है
  rationale: יבש का मूल अर्थ सूखना है; घास और हृदय की संयुक्त काव्यात्मक छवि में ‘मुरझाना’ स्वाभाविक है और जीवन-शक्ति के क्षीण होने को व्यक्त करता है।
- source_word: לִבִּי
  choice: मेरा हृदय
  rationale: हृदय व्यक्ति के भीतरी जीवन, विचार और भावनाओं को सूचित करता है; पारंपरिक और पारदर्शी काव्यात्मक शब्दावली रखी गई है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यहाँ कारण बताने वाले संबंध को स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
- source_word: שָׁכַחְתִּי
  choice: मैं भूल जाता हूँ
  rationale: हिब्रू पूर्ण रूप को चल रही विपत्ति के वर्तमान-जैसे वर्णन के रूप में प्रस्तुत किया गया है; पूर्ण क्रिया का वैकल्पिक अर्थ पादटिप्पणी में सुरक्षित है।
- source_word: מֵאֲכֹל
  choice: खाना
  rationale: शाब्दिक रूप से ‘खाने से’ है, पर भूलने की क्रिया के साथ हिन्दी में ‘खाना भूलना’ स्वाभाविक अभिव्यक्ति है।
- source_word: לַחְמִי
  choice: अपनी रोटी
  rationale: לֶחֶם के ठोस अर्थ ‘रोटी’ और मूल की काव्यात्मकता को बनाए रखता है; व्यापक अर्थ ‘भोजन’ पादटिप्पणी में दिया गया है।
