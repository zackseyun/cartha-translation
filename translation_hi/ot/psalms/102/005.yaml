- source_word: מִקּוֹל
  choice: की आवाज़ के कारण
  rationale: מִן के साथ קוֹל यहाँ कारण या स्रोत व्यक्त कर सकता है। मुख्य पाठ में कारण का भाव रखते हुए ‘आवाज़’ से קוֹל को स्पष्ट रूप से व्यक्त किया गया है।
- source_word: אַנְחָתִי
  choice: मेरे कराहने
  rationale: यह शब्द गहरे दुःख से निकली कराह या आह को दर्शाता है; इस विलाप और शारीरिक पीड़ा के संदर्भ में ‘कराहना’ स्वाभाविक और प्रभावशाली है।
- source_word: דָּבְקָה
  choice: चिपक गई हैं
  rationale: דבק का अर्थ कसकर लग जाना या चिपकना है। पूर्ण क्रिया के भाव और हड्डियों के सामूहिक कर्ता के अनुसार यह हिंदी रूप उपयुक्त है।
- source_word: עַצְמִי
  choice: मेरी हड्डियाँ
  rationale: एकवचन रूप यहाँ सामूहिक अर्थ में शरीर की हड्डियों को सूचित करता है; हिंदी में बहुवचन स्वाभाविक है।
- source_word: לִבְשָׂרִי
  choice: मेरे मांस से
  rationale: בשר का मूल और ठोस अर्थ ‘मांस’ है। अत्यधिक दुबलेपन के संदर्भ में ‘त्वचा’ संभव है, पर मुख्य पाठ मूल शब्द की प्रत्यक्ष शारीरिक छवि को बनाए रखता है।
