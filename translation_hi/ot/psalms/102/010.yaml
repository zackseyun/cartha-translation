id: PSA.102.10
reference: Psalms 102:10
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: מִ/פְּנֵֽי זַֽעַמְ/ךָ֥ וְ/קִצְפֶּ֑/ךָ כִּ֥י נְ֝שָׂאתַ֗/נִי וַ/תַּשְׁלִיכֵֽ/נִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/102/010.yaml
  text: because of your indignation and your wrath[a], for you have lifted me up and cast me away.
translation:
  language: hi
  text: तेरे रोष और प्रकोप के कारण, क्योंकि तूने मुझे उठाकर फेंक दिया है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “...और मुझे दूर फेंक दिया है।”
    reason: וַתַּשְׁלִיכֵנִי में ‘दूर/away’ के निहितार्थ को स्पष्ट करने वाला वैकल्पिक अनुवाद; यह ‘पटकने’ का अतिरिक्त दिशात्मक भाव नहीं जोड़ता।
lexical_decisions:
- source_word: מִפְּנֵי
  choice: के कारण
  rationale: यहाँ यह पदबंध स्थान नहीं, कारण व्यक्त करता है; इसलिए स्वाभाविक हिन्दी में ‘के कारण’ उपयुक्त है।
- source_word: זַעַמְךָ
  choice: तेरे रोष
  rationale: ‘रोष’ तीव्र अप्रसन्नता को व्यक्त करता है और काव्यात्मक गरिमा बनाए रखता है।
- source_word: וְקִצְפֶּךָ
  choice: और प्रकोप
  rationale: ‘प्रकोप’ दूसरे तीव्र क्रोध-सूचक शब्द को ‘रोष’ से अलग रखते हुए समानांतरता और तीव्रता सुरक्षित रखता है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पूर्व कथन का कारण अथवा स्पष्टीकरण प्रस्तुत करता है; आधुनिक हिन्दी में ‘क्योंकि’ इसका स्पष्ट और स्वाभाविक रूप है।
- source_word: נְשָׂאתַנִי
  choice: तूने मुझे उठाकर
  rationale: נשא के ‘उठाने’ वाले अर्थ को अगले क्रिया-पद के साथ जुड़ी सजीव छवि में सुरक्षित रखा गया है।
- source_word: וַתַּשְׁלִיכֵנִי
  choice: फेंक दिया है
  rationale: यह क्रिया बलपूर्वक फेंकने को दर्शाती है। ‘फेंक दिया’ वर्तमान हिन्दी में स्वाभाविक है और अस्वीकार किए जाने की काव्यात्मक छवि को भी बनाए रखता है।
theological_decisions:
- issue: परमेश्वर के क्रोध का चित्रण
  choice: ‘रोष’ और ‘प्रकोप’—दोनों तीव्र, किंतु अलग शब्द रखे गए हैं।
  alternative: दोनों इब्रानी शब्दों को केवल ‘क्रोध’ कहकर मिला देना।
  rationale: मूल पाठ परमेश्वर की अप्रसन्नता के लिए निकटार्थी दो शब्दों का प्रयोग करता है। अनुवाद इस तीव्रता और काव्यात्मक समानांतरता को बिना नरम किए तथा बिना अतिरिक्त धर्मवैज्ञानिक व्याख्या जोड़े सुरक्षित रखता है।
- issue: उठाने और फेंकने की छवि
  choice: इसे परमेश्वर की क्रिया के रूप में सीधे और तनाव सहित रखा गया है।
  alternative: इसे केवल त्याग दिए जाने का भावार्थ बनाकर भौतिक छवि हटा देना।
  rationale: मूल पाठ की सजीव और कठोर छवि को सुरक्षित रखना आवश्यक है; पद स्वयं इस क्रिया का व्यापक धर्मवैज्ञानिक स्पष्टीकरण नहीं देता।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, काव्यात्मक और गरिमापूर्ण शैली अपनाई गई है। परमेश्वर को संबोधित करने के लिए भजन-साहित्य के आत्मीय एकवचन ‘तू/तेरे’ का प्रयोग किया गया है।
