  text: כָּל גּוֹיִ֥ם סְבָב֑וּ/נִי בְּ/שֵׁ֥ם יְ֝הוָ֗ה כִּ֣י אֲמִילַֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/118/010.yaml
  text: All the nations surrounded me; in the name of the LORD, I surely cut them off.
translation:
  language: hi
  text: सब जातियों ने मुझे घेर लिया; यहोवा के नाम से मैं निश्चय उन्हें काट डालूँगा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כָּל גּוֹיִם
  choice: सब जातियों
  rationale: כָּל की समग्रता और גּוֹיִם के सामूहिक अर्थ को सहज, परिचित हिन्दी में व्यक्त करता है।
- source_word: סְבָבוּנִי
  choice: मुझे घेर लिया
  rationale: क्रिया के पूर्ण रूप और प्रथम पुरुष कर्म-प्रत्यय को स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: בְּשֵׁם יְהוָה
  choice: यहोवा के नाम से
  rationale: בְּ के साधन/अधिकार-सूचक भाव को ‘के नाम से’ व्यक्त किया गया है और चतुरक्षरीय दिव्य नाम को ‘यहोवा’ से दर्शाया गया है।
- source_word: כִּי אֲמִילַם
  choice: निश्चय उन्हें काट डालूँगा
  rationale: כִּי के यहाँ बलाघाती प्रयोग को ‘निश्चय’ से और אֲמִילַם के अपूर्ण प्रथम पुरुष अर्थ को भविष्यकाल तथा ‘काट डालना’ से व्यक्त करता है।
theological_decisions:
- issue: दिव्य नाम יהוה का निरूपण
  choice: यहोवा
  alternative: प्रभु
  rationale: मूल पाठ में सामान्य उपाधि नहीं, विशिष्ट वाचा-नाम है; इसलिए उसे नाम के रूप में बनाए रखा गया है।
- issue: כִּי का अर्थ
  choice: बलाघाती ‘निश्चय’
  alternative: कारणसूचक ‘क्योंकि’
  rationale: इस समानांतर काव्यात्मक कथन में כִּי प्रतिज्ञा को बल देता है; कारणसूचक अनुवाद हिन्दी में वाक्य-संबंध को अस्वाभाविक और अर्थ को अस्पष्ट कर देगा।
