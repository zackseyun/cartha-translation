  text: פִּתְחוּ לִ֥/י שַׁעֲרֵי צֶ֑דֶק אָֽבֹא בָ֝/ם אוֹדֶ֥ה יָֽהּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/118/019.yaml
  text: Open to me the gates of righteousness[c][b][a]; I will enter through them and give thanks to Yah.
translation:
  language: hi
  text: मेरे लिए धार्मिकता[c] के फाटक खोलो; मैं उनसे होकर प्रवेश करूँगा और याह[a] का धन्यवाद करूँगा[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी ‘याह’, परमेश्वर के नाम का संक्षिप्त रूप; कुछ अनुवादों में ‘प्रभु’।
    reason: alternative_reading
  - marker: b
    text: या, “याह की स्तुति करूँगा।” इब्रानी क्रिया प्रसंग के अनुसार धन्यवाद या स्तुति, दोनों का बोध करा सकती है।
    reason: lexical_alternative
  - marker: c
    text: या, “न्याय के फाटक।” इब्रानी शब्द का अर्थ ‘धार्मिकता’ या ‘न्याय’ हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: פִּתְחוּ לִי
  choice: मेरे लिए ... खोलो
  rationale: बहुवचन आज्ञार्थक क्रिया और לִי के हितार्थक भाव को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: שַׁעֲרֵי צֶדֶק
  choice: धार्मिकता के फाटक
  rationale: צֶדֶק धार्मिकता, न्याय या उचितता का अर्थ दे सकता है; इस उपासना-संदर्भ में ‘धार्मिकता’ मूल की व्यापक नैतिक-धार्मिक छाया को बनाए रखता है।
- source_word: אָבֹא בָם
  choice: मैं उनमें से प्रवेश करके
  rationale: בָם का द्वारों के साथ स्वाभाविक हिन्दी अर्थ ‘उनमें से/उनके द्वारा’ है; कृदन्त रचना अगले आभार-वचन से क्रियाओं का संबंध सहज बनाती है।
- source_word: אוֹדֶה
  choice: धन्यवाद दूँगा
  rationale: ידה का हिफ़ील रूप इस स्तोत्रीय संदर्भ में धन्यवाद अथवा स्तुति व्यक्त कर सकता है; ‘धन्यवाद दूँगा’ यहाँ प्रमुख अर्थ को सीधे व्यक्त करता है।
- source_word: יָהּ
  choice: याह
  rationale: यह परमेश्वर के नाम का संक्षिप्त रूप है; लिप्यंतरण स्रोत-पाठ में प्रयुक्त विशिष्ट रूप को सुरक्षित रखता है।
theological_decisions:
- issue: צֶדֶק का अर्थ
  choice: धार्मिकता
  alternative: न्याय
  rationale: दोनों अर्थ संभव हैं; मुख्य पाठ में पारंपरिक और प्रसंगानुकूल ‘धार्मिकता’ रखा गया है तथा विकल्प पादटिप्पणी में दिया गया है।
- issue: אוֹדֶה का अर्थ
  choice: धन्यवाद दूँगा
  alternative: स्तुति करूँगा
  rationale: क्रिया धन्यवाद और स्तुति दोनों का बोध करा सकती है; इस प्रसंग में धन्यवाद प्रमुख है, पर वास्तविक शब्दार्थगत अस्पष्टता पादटिप्पणी में सुरक्षित है।
- issue: יָהּ का निरूपण
  choice: याह
  alternative: प्रभु
  rationale: इब्रानी में पूर्ण चतुरक्षरीय नाम नहीं, बल्कि उसका संक्षिप्त रूप है; इसलिए नाम को लिप्यंतरित करना अधिक सटीक है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामूहिक उपासना में सहज है। ‘फाटक’ काव्यात्मक तथा मंदिर-संबंधी दृश्य के अनुकूल है। मुख्य पाठ में केवल उन पादटिप्पणियों को रखा गया है जो वास्तविक शब्दार्थगत या नाम-संबंधी विकल्प बताती हैं।
