id: PSA.118.16
reference: Psalms 118:16
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: יְמִ֣ין יְ֭הוָה רוֹמֵמָ֑ה יְמִ֥ין יְ֝הוָה עֹ֣שָׂה חָֽיִל׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/118/016.yaml
  text: The right hand of Yahweh is exalted[b][a]; the right hand of Yahweh does valiantly.
translation:
  language: hi
  text: याहवे का दाहिना हाथ ऊँचा उठा है[a]; याहवे का दाहिना हाथ पराक्रम करता है[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “ऊँचा है,” “महिमामय है,” अथवा “विजयी है।” इब्रानी क्रिया ऊँचा होने या उठाए जाने का भाव देती है और इस संदर्भ में विजय का संकेत भी कर सकती है।
    reason: lexical_alternative
  - marker: b
    text: या “सामर्थ्य दिखाता है,” “शक्तिशाली काम करता है,” अथवा “विजय प्राप्त करता है।” इब्रानी मुहावरे का शाब्दिक भाव “पराक्रम/सामर्थ्य करता है” है।
    reason: lexical_alternative
lexical_decisions:
- source_word: יְמִין
  choice: दाहिना हाथ
  rationale: शाब्दिक बिंब को बनाए रखता है; काव्यात्मक संदर्भ में यह सामर्थ्य और विजयी हस्तक्षेप को व्यक्त करता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी व्यक्तिगत नाम יהוה का देवनागरी लिप्यंतरण किया गया है, न कि उसकी जगह कोई उपाधि रखी गई है।
- source_word: רוֹמֵמָה
  choice: ऊँचा उठा है
  rationale: यह रूप ऊँचा होने या ऊँचा उठाए जाने की परिणामी अवस्था व्यक्त कर सकता है। यह अनुवाद काव्यात्मक चित्र को स्वाभाविक हिन्दी में सुरक्षित रखता है और इसे केवल ‘विजयी है’ कहकर सीमित नहीं करता।
- source_word: עֹשָׂה
  choice: करता है
  rationale: עשה का मूल अर्थ ‘करना’ है; חָיִל के साथ मिलकर यह सामर्थ्यपूर्ण या वीरतापूर्ण कार्य करने का भाव देता है।
- source_word: חָיִל
  choice: पराक्रम
  rationale: חיל यहाँ बल, वीरता और विजयी सामर्थ्य के अर्थ-क्षेत्र में है। ‘पराक्रम करता है’ इब्रानी मुहावरे को संक्षिप्त, गरिमापूर्ण और स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: परमेश्वर के कार्य के लिए मानवरूपी ‘दाहिना हाथ’ का बिंब
  choice: ‘दाहिना हाथ’ को मुख्य पाठ में यथावत रखा गया है।
  alternative: ‘याहवे की सामर्थ्य’
  rationale: इब्रानी कविता का ठोस बिंब परमेश्वर की सामर्थ्य और विजयी हस्तक्षेप को दर्शाता है। इसे अमूर्त ‘सामर्थ्य’ से बदलने पर मूल काव्यात्मक और धर्मवैचारिक प्रतिध्वनि कमजोर हो जाती।
- issue: רוֹמֵמָה का अर्थ
  choice: ‘ऊँचा उठा है’
  alternative: ‘महिमामय है’ अथवा ‘विजयी है’
  rationale: मूल क्रिया ऊँचा होने/उठने का अर्थ देती है और संदर्भ में विजय का संकेत भी हो सकता है। मुख्य पाठ स्थानिक-काव्यात्मक बिंब रखता है, जबकि पादटिप्पणी संभावित विजयी अर्थ बताती है।
translation_notes:
  register: आधुनिक मानक हिन्दी का संक्षिप्त, गरिमापूर्ण काव्यात्मक रूप अपनाया गया है। ‘दाहिना हाथ’ का मूल बिंब और दोनों समानांतर पदखंड सुरक्षित रखे गए हैं; ‘याहवे’ व्यक्तिगत नाम का स्पष्ट देवनागरी रूप है।
