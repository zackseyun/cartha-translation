  text: זֶה הַ֭/יּוֹם עָשָׂ֣ה יְהוָ֑ה נָגִ֖ילָה וְ/נִשְׂמְחָ֣ה בֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/118/024.yaml
  text: This is the day that Yahweh has made; let us rejoice and be glad in it.
translation:
  language: hi
  text: यह वह दिन है जिसे याहवे ने बनाया है; आओ, हम इसमें आनन्दित हों और मगन हों।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: זֶה הַיּוֹם
  choice: यह वही दिन है
  rationale: इब्रानी संकेतवाचक זֶה और निश्चित संज्ञा הַיּוֹם किसी विशेष, सामने उपस्थित दिन पर बल देते हैं। ‘यह वही दिन है’ आधुनिक हिन्दी में इस निर्दिष्टता को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: עָשָׂה
  choice: बनाया है
  rationale: काल पूर्ण किए गए कार्य को वर्तमान महत्त्व के साथ प्रस्तुत करता है; हिन्दी का पूर्ण वर्तमान ‘बनाया है’ इसे सहजता से व्यक्त करता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: मूल पाठ में परमेश्वर का व्यक्तिवाचक वाचा-नाम है; हिन्दी में प्रचलित लिप्यंतरण ‘यहोवा’ शीर्षक से बदलने के बजाय उस नाम को सुरक्षित रखता है।
- source_word: נָגִילָה
  choice: आओ, हम … आनन्दित … हों
  rationale: पहला बहुवचन कोहोर्टेटिव सामूहिक आह्वान व्यक्त करता है; ‘आओ, हम … हों’ उसका स्वाभाविक हिन्दी रूप है।
- source_word: וְנִשְׂמְחָה
  choice: और मगन हों
  rationale: दूसरा कोहोर्टेटिव पहले के समान आह्वान है, किंतु שמח की प्रसन्नता को ‘मगन’ द्वारा व्यक्त करने से दोनों निकटार्थी क्रियाओं का काव्यात्मक भेद बना रहता है।
- source_word: בּוֹ
  choice: इसमें
  rationale: पुल्लिंग एकवचन प्रत्यय का सबसे स्वाभाविक पूर्वपद ‘दिन’ है; ‘इसमें’ उसी दिन के अवसर या दायरे में आनन्द मनाने का भाव देता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल में उपाधि नहीं, चार अक्षरों वाला व्यक्तिवाचक ईश्वरीय नाम है। आधुनिक हिन्दी पाठकों में पहचाने जाने वाले रूप ‘यहोवा’ से नाम को नाम ही रखा गया है; ‘याहवे’ सम्भावित विद्वत्तापरक लिप्यंतरण है।
- issue: בּוֹ का संदर्भ
  choice: दिन—‘इसमें’
  alternative: व्यक्ति—‘उसमें’
  rationale: व्याकरण की दृष्टि से प्रत्यय पुल्लिंग एकवचन है, पर निकटतम और प्रसंगानुकूल पूर्वपद הַיּוֹם ‘दिन’ है। इसलिए किसी व्यक्ति की ओर संकेत करने वाला धर्मवैज्ञानिक अर्थ आरोपित नहीं किया गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामूहिक आराधना में सहज है। समानार्थी काव्यात्मक क्रियाओं को ‘आनन्दित’ और ‘मगन’ द्वारा अलग रखते हुए इब्रानी कोहोर्टेटिव का आह्वानात्मक स्वर बचाया गया है।
