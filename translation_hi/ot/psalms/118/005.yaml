  text: Out of my distress I called on Yah[a]; Yah answered me with spaciousness.
translation:
  language: hi
  text: 'संकट में से मैंने याह को पुकारा;

    याह ने मुझे खुले स्थान में उत्तर दिया।[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक रूप से: “संकरी जगह में से मैंने याह को पुकारा; याह ने मुझे चौड़ी जगह में उत्तर दिया।” इसका अर्थ यह भी हो सकता है कि याह ने मुझे खुलापन अथवा राहत देकर उत्तर दिया। इब्रानी में संकट और राहत के लिए तंग और चौड़ी जगहों का बिंब है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִן
  choice: में से
  rationale: यह संबंधबोधक उपसर्ग स्रोत या उस दशा को दर्शाता है जिसमें से पुकार उठती है। ‘में से’ संकट की अवस्था और मूल स्थानगत बिंब, दोनों को बनाए रखता है।
- source_word: הַמֵּצַר
  choice: संकट
  rationale: इस शब्द का मूल अर्थ तंग या संकरी जगह है और रूपकतः यह विपत्ति या संकट को दर्शाता है। मुख्य पाठ में सहज हिन्दी के लिए ‘संकट’ चुना गया है; संकरी जगह का बिंब पादटिप्पणी में स्पष्ट किया गया है।
- source_word: קָרָאתִי
  choice: मैंने ... पुकारा
  rationale: प्रार्थना के संदर्भ में क्रिया किसी को सहायता के लिए पुकारने या उसका नाम लेकर बुलाने का भाव देती है। हिन्दी में ‘पुकारा’ सीधा, स्वाभाविक और काव्यात्मक है।
- source_word: יָּהּ / יָהּ
  choice: याह
  rationale: यह परमेश्वर के नाम का संक्षिप्त काव्यात्मक रूप है। लिप्यंतरण इसकी विशिष्टता और दोनों पंक्तियों में इसकी पुनरावृत्ति को सुरक्षित रखता है।
- source_word: עָנָנִי
  choice: मुझे ... उत्तर दिया
  rationale: क्रिया के साथ लगा प्रत्यय प्रथम पुरुष कर्म को व्यक्त करता है; ‘मुझे उत्तर दिया’ इसका सीधा और स्वाभाविक हिन्दी रूप है।
- source_word: בַמֶּרְחָב
  choice: खुले स्थान में
  rationale: מֶרְחָב चौड़े, विस्तृत या खुले स्थान को दर्शाता है और रूपकतः राहत या स्वतंत्रता का भाव दे सकता है। उपसर्ग ב को यहाँ स्थानवाचक ‘में’ माना गया है, जबकि साधनवाचक अथवा परिणामसूचक समझ की संभावना पादटिप्पणी में रखी गई है।
theological_decisions:
- issue: ईश्वरीय नाम יָהּ का अनुवाद
  choice: याह
  alternative: प्रभु
  rationale: मूल पाठ में पूर्ण चतुरक्षरीय नाम के बजाय उसका संक्षिप्त काव्यात्मक रूप आया है। ‘याह’ का लिप्यंतरण इस शब्दगत भेद और पद की काव्यात्मक पुनरावृत्ति को बनाए रखता है।
- issue: בַמֶּרְחָב में उत्तर देने का संबंध
  choice: खुले स्थान में उत्तर दिया
  alternative: खुलापन देकर उत्तर दिया / खुले स्थान में पहुँचा दिया
  rationale: इब्रानी उपसर्ग ב स्थान, साधन या परिस्थिति का बोध करा सकता है। मुख्य पाठ स्थानगत बिंब को निकटता से रखता है, पर पादटिप्पणी राहत देने या खुले स्थान में लाने की वैकल्पिक समझ को भी सुरक्षित रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और काव्यात्मक रूप अपनाया गया है। ‘संकट’ सामान्य पाठक के लिए सहज है, जबकि ‘खुले स्थान’ के द्वारा मूल की स्थानगत विरोधी छवि को मुख्य पाठ में बनाए रखा गया है।
