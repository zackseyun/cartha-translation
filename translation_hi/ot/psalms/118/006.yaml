    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत नाम को उपाधि से बदलने के बजाय हिब्रू चतुरक्षरीय नाम का प्रचलित लिप्यंतरण रखा गया है।
- source_word: לִי
  choice: मेरी ओर है
  rationale: पहला לִי यहाँ केवल ‘मेरे लिए’ नहीं, बल्कि समर्थन और पक्ष में होने का भाव व्यक्त करता है; ‘मेरी ओर है’ वर्तमान हिन्दी में इस संबंध को स्वाभाविक रूप से बताता है।
- source_word: לֹא אִירָא
  choice: मैं न डरूँगा
  rationale: हिब्रू अपूर्ण क्रिया विश्वास से भरे भावी निश्चय या संकल्प को व्यक्त कर सकती है; संक्षिप्त हिन्दी इसी बल को बनाए रखती है।
- source_word: מַה יַעֲשֶׂה לִי
  choice: मेरा क्या कर सकता है
  rationale: शाब्दिक रूप ‘मेरा क्या करेगा’ है, पर प्रसंग में प्रश्न मनुष्य की सीमित सामर्थ्य पर बल देने वाला आलंकारिक प्रश्न है; ‘क्या कर सकता है’ हिन्दी में वही आशय स्वाभाविक रूप से देता है।
- source_word: אָדָם
  choice: मनुष्य
  rationale: एकवचन शब्द यहाँ किसी एक पुरुष की पहचान नहीं, बल्कि सामान्य रूप से मानव को दर्शाता है; ‘मनुष्य’ एकवचन और प्रतिनिधिक अर्थ दोनों रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ व्यक्तिगत वाचा-नाम का प्रयोग करता है। ‘याहवे’ उस नाम को उपाधि से बदले बिना हिन्दी लिपि में प्रस्तुत करता है।
- issue: एकवचन सामान्य אָדָם का आशय
  choice: मनुष्य
  alternative: कोई इंसान; मानवजाति
  rationale: ‘मनुष्य’ मूल के एकवचन रूप और सामान्य मानवीय संदर्भ को बनाए रखता है तथा याहवे और सीमित मानव के बीच का विरोध स्पष्ट करता है।
- issue: आलंकारिक प्रश्न में सामर्थ्य का भाव
  choice: क्या कर सकता है
  alternative: क्या करेगा
  rationale: मूल में सामर्थ्यसूचक सहायक क्रिया नहीं है, फिर भी प्रसंगगत प्रश्न का बल इस पर है कि मनुष्य अंततः क्या हानि पहुँचा सकता है। मुख्य पाठ में स्वाभाविक हिन्दी दी गई है और शाब्दिक रूप पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: भाषा आधुनिक, संक्षिप्त और आराधनात्मक गरिमा वाली रखी गई है। ‘मेरी ओर है’ समर्थन का भाव देता है, जबकि ‘मैं न डरूँगा’ भजनकार के दृढ़ विश्वास को सहज हिन्दी में व्यक्त करता है। दोनों पादटिप्पणी-चिह्न संबंधित प्रश्न के बाद रखे गए हैं।
