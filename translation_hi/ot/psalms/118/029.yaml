source:
  edition: WLC
  text: הוֹד֣וּ לַ/יהוָ֣ה כִּי ט֑וֹב כִּ֖י לְ/עוֹלָ֣ם חַסְדּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/118/029.yaml
  text: Give thanks to Yahweh[a], for he is good, for his steadfast love endures forever.
translation:
  language: hi
  text: याहवे को धन्यवाद दो, क्योंकि वह भला है; क्योंकि उसका अटल प्रेम सदा बना रहता है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक शाब्दिक रूप: “क्योंकि उसका अटल प्रेम सदा का है।”'
    reason: मूल इब्रानी में ‘बना रहता है’ के लिए अलग क्रिया नहीं है; यह भाव हिन्दी में स्वाभाविक अभिव्यक्ति के लिए जोड़ा गया है।
lexical_decisions:
- source_word: הוֹדוּ
  choice: धन्यवाद दो
  rationale: यह ידה के हिफ़ील बहुवचन आज्ञार्थक का स्वाभाविक हिन्दी रूप है और भजन के सामूहिक धन्यवाद-गान के भाव को व्यक्त करता है।
- source_word: לַיהוָה
  choice: याहवे को
  rationale: לְ अप्रत्यक्ष कर्म को चिह्नित करता है, और परमेश्वर के विशिष्ट नाम יהוה को लिप्यंतरित करके ‘याहवे’ रखा गया है।
- source_word: כִּי טוֹב
  choice: क्योंकि वह भला है
  rationale: כִּי धन्यवाद देने का कारण बताता है; हिन्दी में स्वाभाविक वाक्य के लिए निहित कर्ता और संयोजक क्रिया जोड़ी गई हैं। ‘भला’ नैतिक अच्छाई और कल्याणकारी स्वभाव, दोनों के लिए उपयुक्त है।
- source_word: לְעוֹלָם
  choice: सदा बना रहता है
  rationale: शाब्दिक अर्थ ‘सदा के लिए’ है। हिन्दी में חַסְדּוֹ के स्थायी बने रहने को स्वाभाविक रूप से व्यक्त करने के लिए क्रियात्मक पदबंध चुना गया है; अधिक शाब्दिक रचना पादटिप्पणी में दी गई है।
- source_word: חַסְדּוֹ
  choice: उसका अटल प्रेम
  rationale: חֶסֶד में प्रेम, कृपा और निष्ठा का संयुक्त भाव है। ‘अटल प्रेम’ इस टिकाऊ, विश्वसनीय प्रेम को सामान्य आधुनिक हिन्दी में व्यक्त करता है, बिना अर्थ को केवल ‘दया’ या किसी तकनीकी वाचा-संबंधी शब्द तक सीमित किए।
theological_decisions:
- issue: परमेश्वर के नाम יהוה का अनुवाद
  choice: याहवे
  alternative: यहोवा / प्रभु
  rationale: मूल पाठ में चार-अक्षरीय विशिष्ट नाम सीधे प्रयुक्त हुआ है। ‘याहवे’ उसका प्रचलित विद्वत्तापूर्ण लिप्यंतरण है और उसे सामान्य उपाधि ‘प्रभु’ से अलग रखता है।
- issue: חֶסֶד का अर्थ-क्षेत्र
  choice: अटल प्रेम
  alternative: करुणा / वाचा की निष्ठा
  rationale: यह पद प्रेमपूर्ण कृपा और स्थायी निष्ठा दोनों को समेटता है। ‘अटल प्रेम’ इस व्यापकता को अपेक्षाकृत सुरक्षित रखता है और किसी एक धर्मवैज्ञानिक व्याख्या को अनिवार्य नहीं बनाता।
translation_notes:
  register: भाषा आधुनिक, सामूहिक आराधना के योग्य और सहज रखी गई है। दोनों כִּי उपवाक्यों में ‘क्योंकि’ रखकर मूल की कारणात्मक समानांतरता सुरक्षित की गई है; अर्धविराम काव्यात्मक दो कारणों को स्पष्ट करता है।
