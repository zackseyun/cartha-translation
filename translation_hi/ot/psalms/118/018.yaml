translation:
  language: hi
  text: याह ने मुझे कड़ा अनुशासन दिया है[a], पर उसने मुझे मृत्यु के हाथ में नहीं सौंपा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “प्रभु ने मुझे कड़ा अनुशासन दिया है।” इब्रानी में परमेश्वर के नाम का संक्षिप्त काव्यात्मक रूप “याह” आया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: יַסֹּר יִסְּרַנִּי
  choice: मुझे कड़ा अनुशासन दिया है
  rationale: एक ही धातु के क्रियारूप से पहले आए infinitive absolute का बल हिन्दी में ‘कड़ा’ द्वारा स्वाभाविक रूप से व्यक्त होता है। ‘अनुशासन’ में सुधारात्मक और शिक्षाप्रद—दोनों भाव बने रहते हैं, जबकि ‘ताड़ना’ अधिक दंडात्मक लग सकती है।
- source_word: יָּהּ
  choice: याह
  rationale: यह परमेश्वर के नाम का संक्षिप्त काव्यात्मक रूप है। लिप्यंतरण मूल पाठ की विशिष्टता को बनाए रखता है और इसे पूर्ण रूप יהוה के सामान्य अनुवाद में विलीन नहीं करता।
- source_word: וְלַמָּוֶת לֹא נְתָנָנִי
  choice: पर उसने मुझे मृत्यु के हाथ में नहीं सौंपा
  rationale: नकार के साथ וְ यहाँ विरोध प्रकट करता है, इसलिए ‘पर’ स्वाभाविक है। נתן के साथ לְ किसी के वश या परिणाम के लिए सौंपे जाने का भाव देता है; ‘मृत्यु के हाथ में सौंपा’ इसे स्पष्ट और मुहावरेदार हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: संक्षिप्त काव्यात्मक ईश्वरीय नाम יָּהּ का अनुवाद
  choice: याह
  alternative: प्रभु
  rationale: मूल में पूर्ण चार-अक्षरीय नाम नहीं, बल्कि उसका संक्षिप्त काव्यात्मक रूप है। ‘याह’ इस शाब्दिक भेद को सुरक्षित रखता है; यह अनुवाद-संबंधी निर्णय है, कोई सांप्रदायिक दावा नहीं।
- issue: अनुशासन और मृत्यु के बीच संबंध
  choice: कड़ा अनुशासन, पर मृत्यु के हवाले नहीं
  alternative: दंड दिया, पर मार नहीं डाला
  rationale: मूल पाठ सुधारात्मक अनुशासन और मृत्यु को अलग रखता है। ‘दंड’ और ‘मार डाला’ कहने से अर्थ अनावश्यक रूप से अधिक निश्चित और संकीर्ण हो जाता।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी। ‘मृत्यु के हाथ में सौंपा’ सामान्य पाठक के लिए बोधगम्य मुहावरा है और मूल के ‘मृत्यु को दे देना’ वाले भाव को बनाए रखता है।
