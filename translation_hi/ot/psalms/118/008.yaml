  text: It is better to take refuge in Yahweh than to trust in man[a].
translation:
  language: hi
  text: मनुष्य पर भरोसा रखने से याहवे की शरण लेना उत्तम है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “मानवजाति पर” या “लोगों पर”; इब्रानी में “मनुष्य” के लिए एकवचन जातिवाचक शब्द है, जो यहाँ सामान्य रूप से मानवों को सूचित करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: טוֹב
  choice: उत्तम है
  rationale: यह विशेषण तुलनात्मक मूल्यांकन व्यक्त करता है; हिन्दी में ‘...से ... उत्तम है’ स्वाभाविक रूप से ‘बेहतर है’ का अर्थ देता है।
- source_word: לַחֲסוֹת
  choice: शरण लेना
  rationale: חסה सुरक्षा के लिए किसी की शरण में जाने का चित्र प्रस्तुत करता है; ‘शरण लेना’ इस रूपक को स्पष्ट और स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: בַּיהוָה
  choice: याहवे की
  rationale: पूर्वसर्ग उस व्यक्ति को सूचित करता है जिसकी शरण ली जाती है; हिन्दी में स्वाभाविक पदबंध ‘याहवे की शरण’ है। परमेश्वर के व्यक्तिगत नाम को लिप्यंतरित किया गया है।
- source_word: מִבְּטֹחַ
  choice: भरोसा रखने से
  rationale: מן सहित क्रियार्थक संज्ञा तुलना व्यक्त करती है; ‘...से’ हिन्दी में संक्षिप्त और स्वाभाविक तुलनात्मक रचना है। בטח के लिए ‘भरोसा रखना’ उपयुक्त है।
- source_word: בָּאָדָם
  choice: मनुष्य पर
  rationale: אָדָם एकवचन जातिवाचक रूप में मानव पर निर्भरता को याहवे की शरण से विपरीत रखता है; ‘मनुष्य’ हिन्दी में एकवचन और सामान्य मानवता—दोनों का भाव रख सकता है।
theological_decisions:
- issue: परमेश्वर के नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में चार अक्षरों वाला व्यक्तिगत वाचा-नाम सीधे आया है; ‘याहवे’ उसे किसी उपाधि से बदलने के बजाय नाम के रूप में सुरक्षित रखता है।
- issue: जातिवाचक एकवचन אָדָם का अर्थ
  choice: मनुष्य
  alternative: मानवजाति; लोगों
  rationale: ‘मनुष्य’ स्रोत के एकवचन जातिवाचक रूप और परमेश्वर बनाम मानव के विरोध—दोनों को बनाए रखता है; पादटिप्पणी सामूहिक अर्थ स्पष्ट करती है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी। ‘शरण लेना’ काव्यात्मक सुरक्षा-रूपक को बनाए रखता है, जबकि ‘भरोसा रखना’ समानार्थी क्रियाओं के बीच मूल पाठ का अंतर सुरक्षित करता है।
