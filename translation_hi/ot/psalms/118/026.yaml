source:
  edition: WLC
  text: בָּר֣וּךְ הַ֭/בָּא בְּ/שֵׁ֣ם יְהוָ֑ה בֵּ֝רַֽכְנוּ/כֶ֗ם מִ/בֵּ֥ית יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/118/026.yaml
  text: Blessed is the one who comes in the name of Yahweh[c][b][a]; we bless you from the house of Yahweh.
translation:
  language: hi
  text: धन्य है वह जो याहवे के नाम से आता है।[a][b][c] हम याहवे के भवन से तुम्हें आशीष देते हैं।[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “धन्य है आनेवाला।” इब्रानी कृदन्त पुल्लिंग एकवचन है।
    reason: lexical_alternative
  - marker: b
    text: “याहवे के नाम से” का अर्थ “याहवे के अधिकार से” या “याहवे के प्रतिनिधि के रूप में” भी हो सकता है।
    reason: lexical_alternative
  - marker: c
    text: नए नियम में यह वचन यीशु के यरूशलेम में प्रवेश के प्रसंग में उद्धृत है (मत्ती 21:9; मरकुस 11:9; लूका 19:38; यूहन्ना 12:13)। किंतु भजन के मुख्य पाठ में उस बाद के प्रयोग को जोड़कर अनुवाद नहीं किया गया है।
    reason: cross_reference
  - marker: d
    text: “तुम्हें” के लिए इब्रानी में बहुवचन रूप है।
    reason: grammar
lexical_decisions:
- source_word: בָּרוּךְ
  choice: धन्य है
  rationale: निष्क्रिय कृदन्त/विशेषण यहाँ आशीर्वचन-सूत्र के रूप में है। ‘धन्य है’ स्वाभाविक और गरिमापूर्ण है तथा इसे केवल इच्छा-सूचक वाक्य नहीं बनाता।
- source_word: הַבָּא
  choice: वह जो ... आता है
  rationale: संज्ञा के रूप में प्रयुक्त निश्चित, पुल्लिंग, एकवचन कृदन्त का अर्थ ‘आनेवाला’ अथवा ‘वह जो आता है’ है। चुना हुआ रूप आधुनिक हिन्दी में स्पष्ट रहते हुए कृदन्त का भाव सुरक्षित रखता है।
- source_word: בְּשֵׁם
  choice: के नाम में
  rationale: मूल रूपक को बनाए रखता है; इस पदबंध में अधिकार, प्रतिनिधित्व या किसी की ओर से आने का भाव भी हो सकता है, जिसे पादटिप्पणी में बताया गया है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को उपाधि ‘प्रभु’ से प्रतिस्थापित करने के बजाय हिन्दी में प्रचलित लिप्यन्तरण ‘यहोवा’ से प्रस्तुत किया गया है।
- source_word: בֵּרַכְנוּכֶם
  choice: हम ... तुम लोगों को आशीष देते हैं
  rationale: प्रथम पुरुष बहुवचन पूर्ण रूप के साथ द्वितीय पुरुष पुल्लिंग बहुवचन प्रत्यय है। उपासना-संबंधी प्रसंग में पूर्ण क्रिया विधिवत वर्तमान घोषणा का कार्य करती है; ‘तुम लोगों को’ बहुवचन को स्पष्ट करता है।
- source_word: מִבֵּית
  choice: के भवन से
  rationale: מִן और בַּיִת के मूल अर्थ को सुरक्षित रखता है। ‘भवन’ मंदिर का संकेत दे सकता है, पर मुख्य पाठ में उसे व्याख्यात्मक रूप से ‘मंदिर’ नहीं बनाया गया।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: प्रभु / याहवे
  rationale: मूल पाठ में व्यक्तिगत ईश्वरीय नाम है। हिन्दी पाठकों के लिए प्रचलित ‘यहोवा’ उसका पारदर्शी लिप्यन्तरण है और उसे केवल उपाधि में नहीं बदलता।
- issue: הַבָּא का तात्कालिक अथवा मसीही संकेत
  choice: मुख्य पाठ में सामान्य उपासना-संबंधी आशीर्वचन बनाए रखना
  alternative: इसे मुख्य पाठ में स्पष्ट रूप से मसीहा के लिए प्रयुक्त करना
  rationale: भजन का इब्रानी वाक्य स्वयं आनेवाले व्यक्ति को आशीष देता है और उसकी पहचान को अधिक स्पष्ट नहीं करता। नया नियम इसे यीशु से जोड़ता है, पर वह बाद की प्रामाणिक प्रयुक्ति पादटिप्पणी में दी गई है, मुख्य पाठ में आरोपित नहीं।
- issue: בְּשֵׁם में निहित प्रतिनिधित्व
  choice: ‘के नाम में’ रूपक बनाए रखना
  alternative: ‘के अधिकार से’ या ‘के प्रतिनिधि के रूप में’
  rationale: मूल पदबंध में अधिकार और प्रतिनिधित्व दोनों की सम्भावना है। शाब्दिक रूप वास्तविक अर्थ-विस्तार और अस्पष्टता को सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी, सरल किंतु गरिमापूर्ण उपासना-शैली। ‘भवन’ ने मंदिर-संबंधी संकेत को निहित रखा है। सर्वनाम का बहुवचन हिन्दी में स्पष्ट किया गया है।
