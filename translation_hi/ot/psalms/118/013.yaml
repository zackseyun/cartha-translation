  text: You pushed me hard so that I might fall[b][a], but Yahweh helped me.
translation:
  language: hi
  text: तूने मुझे ज़ोर से धक्का दिया, ताकि मैं गिर पड़ूँ[a]; लेकिन याहवे ने मेरी सहायता की[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से, “धक्का देते हुए तूने मुझे धक्का दिया”—यह ज़ोर देने वाली रचना है, जिसका अर्थ “तूने मुझे ज़ोर से धक्का दिया” है।
    reason: lexical_alternative
  - marker: b
    text: या, “और याहवे ने मेरी सहायता की।” इब्रानी संयोजक का अर्थ केवल “और” भी हो सकता है, यद्यपि प्रसंग में “लेकिन” का विरोधात्मक भाव उपयुक्त है।
    reason: alternative_reading
lexical_decisions:
- source_word: דַּחֹה דְחִיתַנִי
  choice: तूने मुझे ... ज़ोर से धक्का दिया
  rationale: इनफ़िनिटिव एब्सोल्यूट और सीमित क्रिया की पुनरुक्ति क्रिया पर बल देती है। स्वाभाविक हिन्दी में यह बल ‘ज़ोर से’ द्वारा व्यक्त होता है। एकवचन पुल्लिंग संबोधन के अनुरूप ‘तूने’ रखा गया है।
- source_word: לִנְפֹּל
  choice: गिराने के लिए
  rationale: לְ सहित इनफ़िनिटिव उद्देश्य अथवा अपेक्षित परिणाम बता सकता है। प्रसंग में हमलावर का लक्ष्य वक्ता को गिराना है; हिन्दी में ‘मुझे गिराने के लिए’ संक्षिप्त और स्वाभाविक है।
- source_word: וַיהוָה
  choice: लेकिन यहोवा
  rationale: वाव का मूल अर्थ ‘और’ है, पर यहाँ हमले और परमेश्वर की सहायता के बीच स्पष्ट विरोध है; इसलिए मुख्य पाठ में ‘लेकिन’ रखा गया है और सरल संयोजक अर्थ को पादटिप्पणी में सुरक्षित किया गया है।
- source_word: עֲזָרָנִי
  choice: मेरी सहायता की
  rationale: עזר के काल रूप और प्रथम पुरुष कर्म-प्रत्यय का सीधा, प्रतिष्ठित और सहज हिन्दी अनुवाद।
- source_word: יְהוָה
  choice: यहोवा
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को हिन्दी में प्रचलित नाम-रूप ‘यहोवा’ से व्यक्त किया गया है, न कि उपाधि से।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: मूल पाठ व्यक्तिगत वाचा-नाम का प्रयोग करता है। ‘यहोवा’ सामान्य हिन्दी पाठकों में पहचाना जाने वाला नाम-रूप है और इसे केवल ‘प्रभु’ जैसी उपाधि में नहीं बदलता।
- issue: वाव का संबंधसूचक अर्थ
  choice: लेकिन
  alternative: और
  rationale: प्रसंग प्रबल विरोध दर्शाता है, फिर भी इब्रानी संयोजक अपने आप में ‘और’ भी हो सकता है; इसलिए वैकल्पिक पाठ पादटिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज किंतु गरिमापूर्ण काव्यात्मक गद्य। मूल के एकवचन दूसरे पुरुष को ‘तू’ से बनाए रखा गया है। ‘धक्का दिया’ सामान्य पाठक के लिए स्पष्ट है; बलसूचक इब्रानी पुनरुक्ति को मुख्य पाठ में ‘ज़ोर से’ और पादटिप्पणी में शाब्दिक संरचना द्वारा सुरक्षित किया गया है।
