    reason: lexical_alternative
lexical_decisions:
- source_word: יֹאמְרוּ
  choice: कहें
  rationale: इस स्तुतिपरक संदर्भ में अपूर्ण क्रिया का भाव साधारण भविष्य नहीं, बल्कि आह्वान या प्रोत्साहन है; हिंदी में “कहें” इसे स्वाभाविक रूप से व्यक्त करता है।
- source_word: נָא
  choice: अब
  rationale: यह अव्यय यहाँ विनम्र निवेदन से अधिक तत्काल आह्वान पर बल देता है; दोहराए गए स्तुतिपरक ढाँचे में “अब” उपयुक्त है।
- source_word: יִרְאֵי יְהוָה
  choice: याहवे का भय माननेवाले
  rationale: यह पद उन लोगों को दर्शाता है जिनकी पहचान याहवे के प्रति श्रद्धामय भय से है। “भय माननेवाले” मूल की ‘भय’ संबंधी भाषा को बनाए रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय लिप्यंतरित किया गया है।
- source_word: כִּי
  choice: प्रत्यक्ष रूप से अनूदित नहीं
  rationale: यहाँ כִּי कथन की विषयवस्तु प्रस्तुत करता है। हिंदी उद्धरण में बिना किसी आरंभिक संयोजक के वही अर्थ अधिक स्वाभाविक और स्पष्ट रहता है।
- source_word: לְעוֹלָם
  choice: सदा बना रहता है
  rationale: शाब्दिक अर्थ ‘सदा के लिए’ है; חֶסֶד के साथ हिंदी में “सदा बना रहता है” निरंतरता को सहज ढंग से व्यक्त करता है।
- source_word: חַסְדּוֹ
  choice: उसका अटल प्रेम
  rationale: חֶסֶד में प्रेम, निष्ठा और दृढ़ प्रतिबद्धता का संयुक्त भाव है। “अटल प्रेम” संक्षिप्त और सहज है तथा केवल दया या केवल निष्ठा तक अर्थ को सीमित नहीं करता।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में व्यक्तिगत ईश्वरीय नाम है; “याहवे” उसका सीधा लिप्यंतरण है और उसे उपाधि में नहीं बदलता।
- issue: חֶסֶד का अर्थ-क्षेत्र
  choice: अटल प्रेम
  alternative: वाचा की निष्ठा; करुणा
  rationale: मूल शब्द प्रेम, निष्ठा, दया और संबंधपरक प्रतिबद्धता को समेटता है। मुख्य पाठ में व्यापक तथा स्वाभाविक पद रखा गया है और वाचागत निष्ठा का वैकल्पिक आयाम पादटिप्पणी में बताया गया है।
translation_notes:
  register: आधुनिक मानक हिंदी में संक्षिप्त, गरिमापूर्ण और सामूहिक उपासना के अनुकूल शैली। “माननेवाले” को संयुक्त रूप में रखा गया है; उद्धरण में हिंदी के स्वाभाविक वाक्यक्रम का प्रयोग हुआ है।
