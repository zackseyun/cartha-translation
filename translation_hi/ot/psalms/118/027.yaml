base_translation:
  language: en
  yaml_path: translation/ot/psalms/118/027.yaml
  text: Yahweh is God[a], and he has given light to us. Bind the festal sacrifice with cords[d][c][b], up to the horns of the altar.
translation:
  language: hi
  text: याहवेह परमेश्वर है, और उसने हमें प्रकाश दिया है।[d] उत्सव के बलिदान को रस्सियों से बाँधो[a][b], वेदी के सींगों तक।[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उत्सव को बाँधो।” इब्रानी संज्ञा का सामान्य अर्थ “उत्सव” या “पर्व” है; यहाँ बहुत-से लोग इसे उत्सव के बलि-पशु के लिए लाक्षणिक प्रयोग मानते हैं, जबकि दूसरे इसे उत्सव की शोभायात्रा से जोड़ते हैं।
    reason: alternative_reading
  - marker: b
    text: या, “मोटी रस्सियों से।” कुछ लोग इस शब्द का अर्थ “डालियों से” मानते हैं, पर “रस्सियाँ” अधिक संभावित है।
    reason: lexical_alternative
  - marker: c
    text: “वेदी के सींग” वेदी के चारों कोनों से बाहर निकले हुए भाग थे। “तक” मूल पाठ की सीमा-सूचक भाषा को बनाए रखता है; वाक्य का ठीक आशय अनिश्चित है।
    reason: cultural_and_syntactic_clarification
  - marker: d
    text: या, “वह हम पर चमका है।” इब्रानी क्रिया का अर्थ लोगों को प्रकाश देना भी हो सकता है और उन पर अनुग्रहपूर्वक चमकना भी।
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵל יְהוָה
  choice: याहवेह परमेश्वर है
  rationale: क्रियारहित इब्रानी वाक्य में याहवेह की पहचान परमेश्वर के रूप में की गई है। ‘याहवेह’ व्यक्तिगत नाम को और ‘परमेश्वर’ विधेय אֵל को स्पष्ट रखता है।
- source_word: וַיָּאֶר לָנוּ
  choice: और उसने हमें प्रकाश दिया है
  rationale: אור के हिफ़ील रूप का सामान्य अर्थ ‘प्रकाश देना’ है। यह अनुवाद कारक भाव को रखता है, जबकि अनुग्रहपूर्वक चमकने की संभावना पादटिप्पणी में दी गई है।
- source_word: אִסְרוּ
  choice: बाँधो
  rationale: बहुवचन आज्ञार्थक क्रिया का सीधा अर्थ ‘बाँधना’ है। हिंदी में ‘बाँधो’ स्वाभाविक और स्पष्ट है।
- source_word: חַג
  choice: उत्सव का बलिदान
  rationale: संज्ञा सामान्यतः ‘उत्सव’ है, पर ‘बाँधो’ और वेदी के संदर्भ में यह संभवतः उत्सव से जुड़े बलि-पशु के लिए लाक्षणिक प्रयोग है।
- source_word: בַּעֲבֹתִים
  choice: रस्सियों से
  rationale: शब्द का अधिक संभावित अर्थ मोटी डोरियाँ या रस्सियाँ है। ‘डालियाँ’ का प्रस्तावित अर्थ कम संभावित है।
- source_word: עַד קַרְנוֹת הַמִּזְבֵּחַ
  choice: वेदी के सींगों तक
  rationale: यह עַד के सीमासूचक अर्थ और प्राचीन वेदी के निकले हुए कोनों के पारिभाषिक नाम ‘सींग’—दोनों को बनाए रखता है, बिना यह तय किए कि बलिदान ठीक किस प्रकार बाँधा गया था।
theological_decisions:
- issue: חַג का उपासना-संबंधी आशय
  choice: उत्सव का बलिदान
  alternative: ‘उत्सव’ अथवा ‘उत्सव की शोभायात्रा’
  rationale: वेदी का संदर्भ और ‘बाँधो’ क्रिया बलि-पशु के लाक्षणिक आशय का समर्थन करते हैं; फिर भी मूल संज्ञा की वास्तविक अस्पष्टता पादटिप्पणी में सुरक्षित रखी गई है।
- issue: וַיָּאֶר לָנוּ में प्रकाश देने और अनुग्रहपूर्वक चमकने के बीच अर्थ
  choice: उसने हमें प्रकाश दिया है
  alternative: ‘वह हम पर चमका है’
  rationale: हिफ़ील रूप कारक अर्थ का समर्थन करता है, पर संदर्भ में ईश्वरीय कृपादृष्टि का भाव भी संभव है; इसलिए वैकल्पिक अर्थ को दबाया नहीं गया है।
- issue: बलिदान को वेदी से बाँधने की सीमा या दिशा
  choice: वेदी के सींगों तक
  alternative: ‘वेदी के सींगों से’
  rationale: עַד का सीधा अर्थ ‘तक’ है। ‘से’ अधिक सहज व्याख्या हो सकती है, किंतु वह संबंध की प्रकृति को मूल पाठ से अधिक निश्चित कर देती है।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण किंतु सरल शैली अपनाई गई है। ‘याहवेह’ से व्यक्तिगत ईश्वरीय नाम को प्रत्यक्ष रखा गया है। ‘वेदी के सींग’ बाइबलीय उपासना की पारिभाषिक छवि को सुरक्षित रखता है; आवश्यक सांस्कृतिक स्पष्टीकरण पादटिप्पणी में है।
