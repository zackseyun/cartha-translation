  yaml_path: translation/ot/psalms/118/009.yaml
  text: It is better to take refuge in Yahweh than to trust in nobles[a].
translation:
  language: hi
  text: 'याहवे की शरण लेना

    कुलीनों[a] पर भरोसा रखने से अच्छा है।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘राजकुमारों।’ इब्रानी शब्द נְדִיבִים कुलीनों, प्रमुख व्यक्तियों, या राजकुमारों के लिए प्रयुक्त हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: טוֹב
  choice: अच्छा है
  rationale: यह विशेषण तुलनात्मक लाभ व्यक्त करता है; מִן के साथ हिन्दी में ‘से अच्छा है’ स्वाभाविक और अर्थसंगत है।
- source_word: לַחֲסוֹת
  choice: शरण लेना
  rationale: חסה का अर्थ सुरक्षा और आश्रय के लिए किसी की शरण लेना है; यह सक्रिय भरोसे और संरक्षण, दोनों को व्यक्त करता है।
- source_word: בַּיהוָה
  choice: याहवे की
  rationale: ב यहाँ उस व्यक्ति को चिह्नित करता है जिसकी शरण ली जाती है; हिन्दी मुहावरे में ‘याहवे की शरण’ स्वाभाविक है। परमेश्वर के नाम יהוה को ‘याहवे’ रूप में रखा गया है।
- source_word: מִבְּטֹחַ
  choice: पर भरोसा रखने से
  rationale: מִן तुलना को और בטח भरोसा या निर्भरता को व्यक्त करता है; ‘से’ पहले खंड के साथ स्पष्ट तुलना बनाए रखता है।
- source_word: בִּנְדִיבִים
  choice: प्रतिष्ठित शासकों पर
  rationale: נְדִיבִים यहाँ उदार लोगों के बजाय कुलीन, प्रभावशाली अथवा प्रमुख शासकीय व्यक्तियों को सूचित करता है। यह चयन ‘राजकुमारों’ से कुछ व्यापक रहते हुए प्रसंग का सत्ता-संबंधी भाव स्पष्ट करता है।
theological_decisions:
- issue: परमेश्वर के नाम יהוה का रूप
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में चार-अक्षरी व्यक्तिगत नाम सीधे आया है। ‘याहवे’ उसे उपाधि में बदलने के बजाय नाम के रूप में सुरक्षित रखता है।
- issue: נְדִיבִים का सामाजिक-राजनीतिक संकेत
  choice: प्रतिष्ठित शासक
  alternative: कुलीन लोग; राजकुमार
  rationale: शब्द प्रमुख, कुलीन या शासक वर्ग के लोगों को सूचित कर सकता है। मुख्य पाठ में व्यापक अर्थ रखा गया है और पारंपरिक विकल्प पाद-टिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी। मूल की समानांतर तुलना को दो पंक्तियों में रखा गया है। ‘शरण लेना’ और ‘भरोसा रखना’ के बीच का अर्थ-संबंध सुरक्षित है, पर दोनों क्रियाओं को एक समान नहीं बनाया गया।
