source:
  edition: WLC
  text: סַבּ֤וּ/נִי כִ/דְבוֹרִ֗ים דֹּ֭עֲכוּ כְּ/אֵ֣שׁ קוֹצִ֑ים בְּ/שֵׁ֥ם יְ֝הוָ֗ה כִּ֣י אֲמִילַֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/118/012.yaml
  text: They surrounded me like bees[a]; they went out like a fire among thorns. In the name of Yahweh[b], I surely cut them down.
translation:
  language: hi
  text: उन्होंने मुझे मधुमक्खियों की तरह घेर लिया; वे काँटों की आग की तरह बुझ गए[a]। याहवे के नाम से मैं निश्चय ही उन्हें काट डालूँगा[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इसे ‘वे काँटों में लगी आग की तरह बुझ गए’ भी कहा जा सकता है। इब्रानी पदबंध संक्षिप्त है और शत्रुओं की तुलना ऐसी काँटों की आग से करता है जो तेजी से भड़कती और शीघ्र बुझ जाती है।
    reason: lexical_alternative
  - marker: b
    text: या, ‘मैं उन्हें काटकर अलग कर दूँगा।’ इब्रानी क्रिया में ‘काट डालने’ और ‘काटकर अलग करने’ दोनों का भाव हो सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: סַבּוּנִי
  choice: उन्होंने मुझे घेर लिया
  rationale: סבב का अर्थ चारों ओर से घेरना है; यह अनुवाद शत्रुतापूर्ण घेराबंदी को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: כִדְבוֹרִים
  choice: मधुमक्खियों की तरह
  rationale: उपसर्ग כ तुलना सूचित करता है; यह मधुमक्खियों के झुंड का सजीव बिंब बनाए रखता है।
- source_word: דֹּעֲכוּ
  choice: वे ... बुझ गए
  rationale: דעך आग या प्रकाश के बुझ जाने को दर्शाता है। अगले पदबंध में आग का स्पष्ट बिंब होने के कारण ‘बुझ गए’ सटीक और सहज है।
- source_word: כְּאֵשׁ קוֹצִים
  choice: काँटों की आग की तरह
  rationale: शाब्दिक रूप से ‘काँटों की आग के समान’; सूखे काँटों की आग के तेजी से भड़ककर शीघ्र बुझ जाने का बिंब सुरक्षित रहता है।
- source_word: בְּשֵׁם יְהוָה
  choice: याहवे के नाम से
  rationale: यह पदबंध याहवे के नाम के आह्वान अथवा उनके अधिकार और सामर्थ्य के भरोसे किए गए कार्य को व्यक्त करता है।
- source_word: כִּי
  choice: निश्चय ही
  rationale: यहाँ כִּי कारण बताने के बजाय कथन पर बल देता है; ‘निश्चय ही’ भजनकार के दृढ़ विश्वास को व्यक्त करता है।
- source_word: אֲמִילַם
  choice: मैं ... उन्हें काट डालूँगा
  rationale: मूल क्रिया מול के हिफ़ईल रूप में काट देने या काटकर अलग करने का भाव है। अपूर्ण रूप यहाँ भावी अथवा दृढ़ संकल्प का अर्थ दे सकता है; ‘काट डालूँगा’ युद्ध-संबंधी बिंब और कथन की दृढ़ता दोनों रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: प्रभु
  rationale: मूल पाठ में चार अक्षरों वाला व्यक्तिगत ईश्वरीय नाम सीधे प्रयुक्त है; ‘याहवे’ उसे किसी उपाधि से बदलने के बजाय नाम के रूप में प्रस्तुत करता है।
- issue: אֲמִילַם का काल और भाव
  choice: मैं निश्चय ही उन्हें काट डालूँगा
  alternative: मैंने निश्चय ही उन्हें काट डाला
  rationale: हिब्रू का अपूर्ण क्रियारूप इस संदर्भ में भावी कार्य या दृढ़ संकल्प व्यक्त कर सकता है। आसपास की पूर्ण क्रियाओं के बावजूद इसे भूतकाल में बदलना मूल की कालगत तनाव को अनावश्यक रूप से समाप्त कर देगा।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘मधुमक्खियों की तरह’ और ‘काँटों की आग’ जैसे ठोस काव्य-बिंब सुरक्षित हैं। अंतिम क्रिया को भावी दृढ़ संकल्प के रूप में रखा गया है, क्योंकि हिब्रू अपूर्ण रूप यही संभावना खुली रखता है।
