lexical_decisions:
- source_word: זֶה
  choice: यह ... है
  rationale: संकेतवाचक सर्वनाम सामने बताए या दिखाए गए फाटक की पहचान कराता है; स्वाभाविक हिन्दी वाक्य के लिए ‘है’ जोड़ा गया है।
- source_word: הַשַּׁעַר
  choice: फाटक
  rationale: यह शब्द ठोस प्रवेश-द्वार को दर्शाता है; मन्दिर अथवा जुलूस के प्रसंग में ‘फाटक’ इस बिंब को स्पष्ट रखता है।
- source_word: לַיהוָה
  choice: यहोवा का
  rationale: ל संबंध, अधिकार अथवा दिशा व्यक्त कर सकता है। यहाँ ‘यहोवा का’ फाटक के यहोवा से संबंध को स्वाभाविक हिन्दी में व्यक्त करता है, जबकि अन्य संभावनाएँ पाद-टिप्पणी में सुरक्षित हैं।
- source_word: צַדִּיקִים
  choice: धर्मी
  rationale: बहुवचन विशेषण संज्ञा के रूप में उन लोगों को दर्शाता है जिनका चरित्र धार्मिकता से पहचाना जाता है; हिन्दी में ‘धर्मी’ स्वाभाविक और संक्षिप्त है।
- source_word: יָבֹאוּ
  choice: प्रवेश करेंगे
  rationale: בוא का अपूर्ण रूप यहाँ भावी अथवा निश्चित प्रवेश व्यक्त करता है; फाटक के साथ ‘प्रवेश करेंगे’ सटीक और सहज है।
- source_word: בוֹ
  choice: इसी से
  rationale: फाटक के संदर्भ में בּוֹ उसके माध्यम से होकर प्रवेश करने का अर्थ देता है। ‘इसी से’ मूल के एकवचन संकेत और बल को संक्षेप में बनाए रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ में चार अक्षरों वाला निजी ईश्वरीय नाम सीधे आया है। हिन्दी में व्यापक रूप से पहचाना जाने वाला रूप ‘यहोवा’ नाम को सामान्य उपाधि ‘प्रभु’ में बदलने के बजाय उसकी विशिष्टता बनाए रखता है।
- issue: לַיהוָה में संबंध का प्रकार
  choice: यहोवा का
  alternative: यहोवा के लिए / यहोवा की ओर ले जाने वाला
  rationale: ל संबंध, अधिकार या दिशा में से किसी को व्यक्त कर सकता है। मुख्य पाठ में प्रसंगानुकूल संबंधसूचक ‘का’ रखा गया है, पर मूल की वास्तविक अस्पष्टता पाद-टिप्पणी में स्पष्ट की गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी का संक्षिप्त, गरिमापूर्ण और सार्वजनिक पाठ के अनुकूल रूप। ‘फाटक’ ठोस काव्यात्मक बिंब बनाए रखता है और ‘इसी से प्रवेश करेंगे’ मूल की संरचना तथा निश्चितता को स्वाभाविक हिन्दी में व्यक्त करता है।
