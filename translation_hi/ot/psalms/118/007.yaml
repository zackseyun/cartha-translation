lexical_decisions:
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत नाम को उपाधि से बदलने के बजाय उसके प्रचलित निकट लिप्यंतरण से प्रस्तुत किया गया है।
- source_word: לִי בְּעֹזְרָי
  choice: मेरे सहायकों में है
  rationale: לִי का ‘मेरे लिए/मेरी ओर’ भाव और בְּעֹזְרָי के बहुवचन ‘मेरी सहायता करनेवालों में/साथ’ को बनाए रखता है; इसे एकवचन ‘मेरा सहायक’ नहीं बनाया गया।
- source_word: וַאֲנִי
  choice: और मैं स्वयं
  rationale: स्वतंत्र सर्वनाम אֲנִי के संभावित बल को स्वाभाविक हिन्दी में ‘मैं स्वयं’ से व्यक्त किया गया है।
- source_word: אֶרְאֶה
  choice: देखूँगा
  rationale: ראה के मूल अर्थ ‘देखना’ को रखा गया है और विजय या शत्रुओं के पतन का भाव मुख्य पाठ में स्पष्ट रूप से नहीं जोड़ा गया।
- source_word: בְשֹׂנְאָי
  choice: मुझसे बैर रखनेवालों को
  rationale: यह कृदन्त रूप सामान्य ‘शत्रुओं’ से अधिक विशिष्ट रूप से उन लोगों को बताता है जो वक्ता से घृणा या बैर रखते हैं; हिन्दी में यह ‘मेरे बैरियों’ की अपेक्षा अधिक सहज है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल में चार अक्षरों वाला व्यक्तिगत ईश्वरीय नाम सीधे आया है; इसलिए उसे किसी उपाधि से प्रतिस्थापित न करके हिन्दी लिपि में निकट लिप्यंतरण दिया गया है।
- issue: याहवे और अन्य सहायकों के बीच संबंध
  choice: याहवे मेरे सहायकों में है
  alternative: याहवे मेरी ओर है, वह मेरा सहायक है
  rationale: मूल का बहुवचन रूप बनाए रखने से यह वास्तविक अस्पष्टता सुरक्षित रहती है कि याहवे भजनकार के सहायकों के बीच/साथ खड़ा है या वाक्य अधिक सामान्य रूप से उसके पक्ष में होने की बात कहता है।
- issue: विरोधियों को ‘देखने’ का आशय
  choice: देखूँगा
  alternative: उनकी हार को विजयी होकर देखूँगा
  rationale: सन्दर्भ विजय का संकेत दे सकता है, पर मूल क्रिया शत्रुओं के पतन या विजय को स्पष्ट रूप से नहीं कहती; अतः वह निहितार्थ पादटिप्पणी में रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण काव्यात्मक गद्य रखा गया है। ‘सहायकों’ से मूल का बहुवचन सुरक्षित है, ‘मुझसे बैर रखनेवालों’ से कृदन्त का अर्थ स्वाभाविक हिन्दी में आता है, और अर्धविराम दोनों समानांतर खंडों को स्पष्ट करता है।
