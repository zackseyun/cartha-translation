id: PSA.118.17
reference: Psalms 118:17
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: לֹֽא אָמ֥וּת כִּי אֶֽחְיֶ֑ה וַ֝/אֲסַפֵּ֗ר מַֽעֲשֵׂ֥י יָֽהּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/118/017.yaml
  text: I will not die[a], but I will live and recount the deeds of Yah.
translation:
  language: hi
  text: मैं मरूँगा नहीं, बल्कि जीवित रहूँगा और याह[a] के कामों का बखान करूँगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में ‘याह’, जो परमेश्वर के नाम का संक्षिप्त काव्यात्मक रूप है; अनेक अनुवाद इसे अधिक सामान्य रूप से ‘प्रभु’ लिखते हैं।
    reason: मूल ईश्वरीय नाम के विशिष्ट संक्षिप्त रूप और प्रचलित वैकल्पिक अनुवाद को स्पष्ट करना।
lexical_decisions:
- source_word: לֹא אָמוּת
  choice: मैं मरूँगा नहीं
  rationale: निषेध और प्रथम पुरुष एकवचन अपूर्ण क्रिया को यहाँ भजनकार की भविष्य-संबंधी विश्वासपूर्ण घोषणा के रूप में स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: כִּי
  choice: बल्कि
  rationale: इस विरोधात्मक काव्य-संरचना में यह मरने और जीवित रहने के बीच तीखा अंतर प्रकट करता है; हिन्दी में ‘बल्कि’ उस संबंध को स्पष्ट और स्वाभाविक रखता है।
- source_word: אֶחְיֶה
  choice: जीवित रहूँगा
  rationale: प्रथम पुरुष एकवचन अपूर्ण क्रिया को भविष्य की आश्वस्त घोषणा के रूप में प्रस्तुत करता है और ‘मरूँगा नहीं’ के साथ काव्यात्मक संतुलन बनाए रखता है।
- source_word: וַאֲסַפֵּר
  choice: और … बखान करूँगा
  rationale: ספר के पिएल रूप में बताने, सुनाने या विस्तार से वर्णन करने का भाव है; ‘बखान करूँगा’ परमेश्वर के कामों की सार्वजनिक और प्रशंसापूर्ण घोषणा के लिए स्वाभाविक तथा गरिमापूर्ण है।
- source_word: מַעֲשֵׂי
  choice: कामों
  rationale: यह מַעֲשֶׂה का संबंधवाचक बहुवचन है और यहाँ किए गए कार्यों को दर्शाता है; ‘कामों’ सरल, व्यापक और आधुनिक हिन्दी है।
- source_word: יָהּ
  choice: याह
  rationale: यह परमेश्वर के नाम का संक्षिप्त काव्यात्मक रूप है, कोई सामान्य उपाधि नहीं; लिप्यंतरण मूल रूप की विशिष्टता सुरक्षित रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יָהּ का अनुवाद
  choice: याह
  alternative: यहोवा / प्रभु
  rationale: मूल पाठ में पूर्ण चतुरक्षरीय नाम יְהוָה नहीं, उसका संक्षिप्त काव्यात्मक रूप יָהּ है। ‘याह’ इस भेद को सुरक्षित रखता है और किसी सामान्य उपाधि से नाम को प्रतिस्थापित नहीं करता।
- issue: כִּי का संबंध
  choice: विरोधात्मक ‘बल्कि’
  alternative: कारणसूचक ‘क्योंकि’
  rationale: दो समानांतर कथनों—‘मरूँगा नहीं’ और ‘जीवित रहूँगा’—का प्रत्यक्ष विरोध यहाँ विरोधात्मक अर्थ को संदर्भानुकूल बनाता है, यद्यपि כִּי अन्य संदर्भों में कारणसूचक भी हो सकता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, विश्वासपूर्ण और काव्यात्मक घोषणा। ‘बखान’ गरिमापूर्ण है, पर सामान्य पाठकों के लिए सुबोध भी; वाक्य ने इब्रानी की विरोधात्मक समानांतरता बनाए रखी है।
