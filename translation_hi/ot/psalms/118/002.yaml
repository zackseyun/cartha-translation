source:
  edition: WLC
  text: יֹֽאמַר נָ֥א יִשְׂרָאֵ֑ל כִּ֖י לְ/עוֹלָ֣ם חַסְדּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/118/002.yaml
  text: Let Israel now say[b][a], “His steadfast love endures forever.”
translation:
  language: hi
  text: अब इस्राएल कहे[a], “उसका अटल प्रेम सदा बना रहता है।”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या, “इस्राएल कहे: ‘क्योंकि उसका अटल प्रेम सदा बना रहता है।’” इब्रानी כִּי का अनुवाद “क्योंकि” या “कि” हो सकता है, अथवा यह कहे जाने वाले अंगीकार की विषयवस्तु आरम्भ कर सकता है।'
    reason: lexical_alternative
  - marker: b
    text: “अटल प्रेम” इब्रानी חֶסֶד का अनुवाद है, जिसमें प्रायः निष्ठावान, वाचा-संबंधी प्रेम का भाव होता है; प्रसंग के अनुसार “निष्ठावान प्रेम,” “वाचा का प्रेम,” या “करुणा” भी संभव हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: יֹאמַר נָא
  choice: अब ... कहे
  rationale: יֹאמַר का यहाँ आदेशात्मक/प्रेरणार्थक भाव है, और נָא आह्वान में तत्परता तथा बल जोड़ता है; इसलिए आधुनिक हिन्दी में “अब ... कहे” स्वाभाविक है।
- source_word: יִשְׂרָאֵל
  choice: इस्राएल
  rationale: व्यक्तिवाचक नाम को प्रचलित हिन्दी बाइबलीय रूप में रखा गया है; प्रसंग में यह सामूहिक रूप से इस्राएल की प्रजा को दर्शाता है।
- source_word: כִּי
  choice: प्रत्यक्ष कथन का परिचायक
  rationale: यहाँ כִּי उस अंगीकार की विषयवस्तु प्रस्तुत कर सकता है जो इस्राएल को कहना है। मुख्य पाठ में प्रत्यक्ष उद्धरण स्वाभाविक हिन्दी देता है, जबकि “क्योंकि” वाला विकल्प पादटिप्पणी में सुरक्षित है।
- source_word: לְעוֹלָם
  choice: सदा बना रहता है
  rationale: शाब्दिक अर्थ “सदा के लिए” है। חֶסֶד के साथ “सदा बना रहता है” उसकी निरंतरता को स्पष्ट और सहज हिन्दी में व्यक्त करता है।
- source_word: חַסְדּוֹ
  choice: उसका अटल प्रेम
  rationale: חֶסֶד में प्रेम, कृपा और निष्ठावान प्रतिबद्धता का भाव है। “अटल प्रेम” संक्षिप्त, आधुनिक और गरिमापूर्ण है तथा उसकी स्थिरता को व्यक्त करता है।
theological_decisions:
- issue: חֶסֶד का वाचा-संबंधी स्तुति-वाक्य में अनुवाद
  choice: अटल प्रेम
  alternative: करुणा; निष्ठावान प्रेम; वाचा का प्रेम
  rationale: “अटल प्रेम” प्रेम और स्थायी निष्ठा दोनों को व्यक्त करता है, पर किसी संप्रदाय-विशेष की व्याख्या नहीं थोपता। अन्य वैध अर्थछायाएँ पादटिप्पणी में दी गई हैं।
- issue: כִּי का वाक्यगत कार्य
  choice: उद्धृत अंगीकार की विषयवस्तु का परिचायक
  alternative: कारणसूचक “क्योंकि”
  rationale: इब्रानी में दोनों संबंध संभव हैं। मुख्य पाठ सहज प्रत्यक्ष कथन देता है, और कारणसूचक विकल्प पादटिप्पणी में रखकर वास्तविक अस्पष्टता सुरक्षित की गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सामूहिक उपासना के आह्वान के अनुरूप संक्षिप्त, गरिमापूर्ण और बोलने योग्य शैली। “कहे” से इब्रानी प्रेरणार्थक भाव तथा “अब” से נָא का आग्रह व्यक्त किया गया है।
