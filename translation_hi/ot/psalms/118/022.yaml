base_translation:
  language: en
  yaml_path: translation/ot/psalms/118/022.yaml
  text: The stone the builders rejected has become the cornerstone[a][b].
translation:
  language: hi
  text: 'जिस पत्थर को बनाने वालों ने ठुकरा दिया था,

    वही कोने का प्रमुख पत्थर बन गया है।[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक अर्थ: “कोने का सिर/प्रधान भाग।” यह किसी प्रमुख कोने के पत्थर को दर्शाता है; उसका सटीक वास्तु-स्थान अनिश्चित है।'
    reason: lexical_alternative
  - marker: b
    text: नए नियम में यह पद मसीह के संदर्भ में उद्धृत किया गया है (जैसे मत्ती 21:42; प्रेरितों के काम 4:11; 1 पतरस 2:7)।
    reason: cross_reference
lexical_decisions:
- source_word: אֶבֶן
  choice: पत्थर
  rationale: यह सामान्य संज्ञा है और रूपक को बिना आकार या विशेष उपयोग तय किए स्वाभाविक हिन्दी में बनाए रखती है।
- source_word: מָאֲסוּ
  choice: ठुकरा दिया था
  rationale: क्रिया जानबूझकर अस्वीकार करने का भाव देती है; ‘ठुकराना’ निर्माण-संबंधी रूपक में स्वाभाविक और स्पष्ट है।
- source_word: הַבּוֹנִים
  choice: राजमिस्त्रियों
  rationale: शाब्दिक अर्थ ‘बनानेवाले’ है। इस वास्तु-संदर्भ में ‘राजमिस्त्री’ सामान्य हिन्दी पाठक के लिए अधिक ठोस और स्वाभाविक है, यद्यपि ‘निर्माता’ भी संभव है।
- source_word: הָיְתָה
  choice: बन गया है
  rationale: हिब्रू पूर्ण पक्ष परिणामी अवस्था व्यक्त कर सकता है; हिन्दी पूर्णकाल वर्तमान परिणाम को स्वाभाविक रूप से सामने लाता है।
- source_word: לְרֹאשׁ פִּנָּה
  choice: कोने का प्रमुख पत्थर
  rationale: यह ‘कोने के सिर/मुख’ का निकट और सुबोध रूप है। इससे पत्थर की प्रमुख वास्तु-भूमिका बनी रहती है और ‘नींव का पत्थर’ या ‘चोटी का पत्थर’ जैसी अनिश्चित विशिष्टता आरोपित नहीं होती।
theological_decisions:
- issue: बाद की बाइबलीय व्याख्या में मसीही प्रयोग
  choice: मुख्य पाठ में मूल वास्तु-रूपक और उलटाव/प्रतिष्ठा के भाव को रखा गया है; मसीह-संबंधी प्रयोग पादटिप्पणी में बताया गया है।
  alternative: नए नियम के उद्धरणों के आधार पर मुख्य पाठ में स्पष्ट मसीही अर्थ जोड़ना।
  rationale: हिब्रू पद स्वयं किसी व्यक्ति को मसीह के रूप में स्पष्ट नहीं करता। इसलिए मूल अर्थ में धर्मवैज्ञानिक निष्कर्ष नहीं जोड़ा गया, जबकि बाद का कैनोनिक प्रयोग संदर्भ के रूप में सुरक्षित है।
- issue: רֹאשׁ פִּנָּה की वास्तु-संबंधी पहचान
  choice: कोने का प्रमुख पत्थर
  alternative: कोने का पत्थर; नींव का कोने का पत्थर; शिखर-पत्थर
  rationale: हिब्रू पद पत्थर की प्रमुखता स्पष्ट करता है, पर उसका सटीक वास्तु-स्थान पूरी तरह निश्चित नहीं करता। चुना हुआ रूप इस वास्तविक अस्पष्टता को बनाए रखता है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध हिन्दी। काव्यात्मक पंक्ति-विन्यास रखा गया है। ‘राजमिस्त्री’ वास्तु-संदर्भ को स्पष्ट करता है, और ‘कोने का प्रमुख पत्थर’ मूल हिब्रू की प्रमुखता तथा वास्तु-संबंधी अस्पष्टता दोनों को बचाता है।
