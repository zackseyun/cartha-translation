  yaml_path: translation/ot/psalms/118/021.yaml
  text: I will give thanks to you[a], for you answered me and became my salvation.
translation:
  language: hi
  text: 'मैं तेरा धन्यवाद करूँगा,

    क्योंकि तूने मुझे उत्तर दिया

    और मेरा उद्धार[a] बन गया।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “छुटकारा।” इब्रानी शब्द किसी ठोस परिस्थिति में बचाव के साथ-साथ व्यापक उद्धार का भी अर्थ दे सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אוֹדְךָ
  choice: मैं तेरा धन्यवाद करूँगा
  rationale: ידה के हिफ़ील रूप में यहाँ कृतज्ञतापूर्वक धन्यवाद देने का भाव है। भविष्य/संकल्पसूचक रूप इब्रानी अपूर्ण क्रिया के भाव को सुरक्षित रखता है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यहाँ यह धन्यवाद देने का कारण बताने वाला संबंधसूचक शब्द है।
- source_word: עֲנִיתָנִי
  choice: तूने मुझे उत्तर दिया
  rationale: यह ענה II, अर्थात ‘उत्तर देना’, से है; प्रार्थना और छुटकारे के प्रसंग में यही सीधा अर्थ है, न कि ‘दुःख देना’।
- source_word: וַתְּהִי
  choice: और ... बन गया
  rationale: היה का क्रमवर्ती क्रियारूप घटना की प्रगति दिखाता है; ‘बन गया’ इसके गतिशील अर्थ को ‘था’ से बेहतर सुरक्षित रखता है।
- source_word: לִי
  choice: मेरा
  rationale: शाब्दिक अर्थ ‘मेरे लिए/मेरे वास्ते’ है, पर ‘मेरा उद्धार बन गया’ स्वाभाविक हिन्दी में उसी संबंध को संक्षेप और स्पष्टता से व्यक्त करता है।
- source_word: לִישׁוּעָה
  choice: उद्धार
  rationale: יְשׁוּעָה ठोस संकट से छुटकारे और व्यापक उद्धार—दोनों को व्यक्त कर सकता है। ‘उद्धार’ हिन्दी में इस व्यापकता और भजन के धार्मिक भार को बनाए रखता है।
theological_decisions:
- issue: יְשׁוּעָה का अनुवाद, जहाँ तत्काल छुटकारे और व्यापक धार्मिक अर्थ दोनों संभव हैं
  choice: उद्धार
  alternative: छुटकारा
  rationale: ‘उद्धार’ तत्काल बचाव को समेटते हुए शब्द के व्यापक धार्मिक और साहित्यिक अनुनाद को सुरक्षित रखता है, पर पाठ में बाद की कोई विशिष्ट धर्मसैद्धांतिक धारणा नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी; परमेश्वर के लिए एकवचन आत्मीय ‘तू’ रखा गया है, जो भजन की सीधी प्रार्थनात्मक वाणी के अनुरूप है। भाषा सरल, गरिमापूर्ण और सार्वजनिक पाठ के अनुकूल है।
