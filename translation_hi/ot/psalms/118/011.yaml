  text: They surrounded me[a], yes, they surrounded me[c][b]; in the name of Yahweh I cut them down.
translation:
  language: hi
  text: उन्होंने मुझे घेर लिया[a]—हाँ, उन्होंने मुझे घेर लिया; याहवे[b] के नाम से मैं निश्चय ही उन्हें काट डालूँगा[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘उन्होंने मुझे चारों ओर से घेर लिया’; दोनों दोहराए गए खंडों में यही अनुवाद किया जा सकता है।
    reason: lexical_alternative
  - marker: b
    text: ईश्वरीय नाम को परंपरागत रूप से ‘यहोवा’ या ‘प्रभु’ भी लिखा जाता है।
    reason: alternative_reading
  - marker: c
    text: या ‘मैं उन्हें काटकर अलग कर दूँगा’; संभवतः ‘मैं उन्हें दूर कर दूँगा।’ हिब्रू क्रिया शत्रुओं के विरुद्ध निर्णायक कार्रवाई का भाव देती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: סַבּוּנִי / סְבָבוּנִי
  choice: उन्होंने मुझे घेर लिया / उन्होंने मुझे चारों ओर से घेर लिया
  rationale: दोनों रूप סבב से हैं और शत्रुतापूर्ण ढंग से चारों ओर घेरने का भाव देते हैं। हिन्दी में स्वाभाविकता रखते हुए मूल की पुनरुक्ति और बढ़ते दबाव को बनाए रखा गया है।
- source_word: גַם
  choice: हाँ
  rationale: यहाँ यह केवल ‘भी’ जोड़ने के बजाय दोहराए गए कथन पर बल देता है; ‘हाँ’ उस काव्यात्मक दृढ़ता को सहज हिन्दी में व्यक्त करता है।
- source_word: בְּשֵׁם יְהוָה
  choice: याहवे के नाम से
  rationale: בְּ यहाँ नाम के आह्वान, अधिकार या सामर्थ्य के आधार पर की गई क्रिया दर्शाता है। ‘के नाम से’ हिन्दी में इस संबंध को स्वाभाविक रूप से बनाए रखता है।
- source_word: כִּי
  choice: निश्चय ही
  rationale: इस आवर्ती काव्य-पंक्ति में כִּי को कारणसूचक ‘क्योंकि’ के बजाय बलसूचक समझना संदर्भानुकूल है।
- source_word: אֲמִילַם
  choice: मैं उन्हें काट डालूँगा
  rationale: מול के हिफ़ील रूप में शत्रुओं के विरुद्ध निर्णायक रूप से काट देने या समाप्त कर देने का सजीव भाव है। भविष्यकालीन हिन्दी क्रिया हिब्रू के अपूर्ण रूप और इस प्रसंग की दृढ़ घोषणा को दर्शाती है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में उपाधि नहीं, चार अक्षरों वाला व्यक्तिगत ईश्वरीय नाम है। ‘याहवे’ उसका आधुनिक हिन्दी लिप्यंतरण है और नाम तथा उपाधि के भेद को सुरक्षित रखता है।
- issue: אֲמִילַם के काल और आशय
  choice: मैं निश्चय ही उन्हें काट डालूँगा
  alternative: मैंने उन्हें काट डाला; मैं उन्हें दूर करूँगा
  rationale: हिब्रू अपूर्ण क्रियारूप भविष्य अथवा प्रसंगाधारित क्रिया व्यक्त कर सकता है। आसपास की आवर्ती प्रतिज्ञात्मक पंक्तियों में भविष्यकाल उपयुक्त है, पर क्रिया की सटीक बारीकी विवादित है; इसलिए विकल्प पादटिप्पणी में दिए गए हैं।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और काव्यात्मक रखी गई है। डैश और पुनरुक्ति घेराव की तीव्रता व्यक्त करते हैं। ‘काट डालूँगा’ मूल की प्रबल छवि को बचाता है, जबकि पादटिप्पणी अर्थगत अनिश्चितता को स्पष्ट करती है।
