lexical_decisions:
- source_word: אֵלִי
  choice: मेरा परमेश्वर
  rationale: אֵל पर प्रथम पुरुष एकवचन प्रत्यय सीधा व्यक्तिगत संबोधन व्यक्त करता है; आधुनिक हिन्दी में “मेरा परमेश्वर” स्वाभाविक और श्रद्धापूर्ण है।
- source_word: אַתָּה
  choice: तू ... है
  rationale: स्वतंत्र सर्वनाम निर्क्रिय वाक्य को बल देता है। हिन्दी में “तू मेरा परमेश्वर है” इस बल और निकट संबोधन को स्वाभाविक रूप से व्यक्त करता है।
- source_word: וְאוֹדֶךָ
  choice: और मैं तेरा धन्यवाद करूँगा
  rationale: ידה का हिफ़ील भजन-साहित्य में सामान्यतः धन्यवाद देना बताता है, यद्यपि इसमें स्तुति का भाव भी हो सकता है; “तेरा धन्यवाद करूँगा” द्वितीय पुरुष कर्म-संबंध को स्पष्ट रखता है।
- source_word: אֱלֹהַי
  choice: हे मेरे परमेश्वर
  rationale: यह אֵלִי के समानांतर दूसरा सीधा संबोधन है। “हे” हिन्दी में संबोधन को स्पष्ट करता है और मूल की काव्यात्मक पुनरुक्ति बनाए रखता है।
- source_word: אֲרוֹמְמֶךָ
  choice: मैं तुझे ऊँचा करूँगा
  rationale: רום का यह रूप ऊँचा करने अथवा महिमा बढ़ाने का भाव देता है। “ऊँचा करूँगा” मूल के ऊर्ध्व रूपक को सुरक्षित रखते हुए सहज हिन्दी है।
theological_decisions:
- issue: אֵלִי और אֱלֹהַי दो दिव्य संबोधनों का अनुवाद
  choice: मेरा परमेश्वर ... हे मेरे परमेश्वर
  alternative: मेरे सामर्थी ... हे मेरे परमेश्वर
  rationale: दोनों पद उपासना के प्रसंग में इस्राएल के परमेश्वर को व्यक्तिगत रूप से संबोधित करते हैं। समान हिन्दी पद काव्यात्मक पुनरुक्ति और व्यक्तिगत भक्ति को बनाए रखता है, बिना अर्थ में अनावश्यक भेद जोड़े।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, काव्यात्मक और सामान्य पाठक के लिए स्पष्ट भाषा। परमेश्वर से निकट तथा पारंपरिक भक्तिपूर्ण संबोधन के लिए “तू/तेरा/तुझे” रखा गया है; दोनों समानांतर खंडों की पुनरुक्ति सुरक्षित है।
