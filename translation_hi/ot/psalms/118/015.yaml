base_translation:
  language: en
  yaml_path: translation/ot/psalms/118/015.yaml
  text: 'The sound of joyful shouting and salvation is in the tents of the righteous: “The right hand of Yahweh does valiantly!”[a][b]'
translation:
  language: hi
  text: 'धर्मियों के तंबुओं में हर्षनाद और उद्धार[a] की ध्वनि सुनाई देती है:


    “याहवे का दाहिना हाथ पराक्रम करता है!”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “विजय” अथवा “छुटकारा”।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी मुहावरा; इसका अनुवाद “सामर्थ्य से कार्य करता है” या “बड़े सामर्थ्य के काम करता है” भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ק֤וֹל
  choice: ध्वनि गूँजती है
  rationale: קוֹל यहाँ तंबुओं में सुनाई देने वाली आवाज़ या ध्वनि को दर्शाता है। हिंदी में ‘ध्वनि गूँजती है’ मूल के श्रव्य बिंब को स्वाभाविक रूप से व्यक्त करता है।
- source_word: רִנָּה
  choice: हर्षनाद
  rationale: רִנָּה आनंद की मुखर पुकार या उल्लासपूर्ण जयघोष है; ‘हर्षनाद’ उसके आनंद और ऊँचे स्वर, दोनों को बनाए रखता है।
- source_word: וִישׁוּעָה
  choice: उद्धार
  rationale: יְשׁוּעָה का अर्थ उद्धार, छुटकारा या विजय हो सकता है। ‘उद्धार’ व्यापक अर्थ बनाए रखता है, जबकि अन्य संभव अर्थ पादटिप्पणी में दिए गए हैं।
- source_word: בְּאָהֳלֵי
  choice: के तंबुओं में
  rationale: मूल में אֹהֶל का बहुवचन स्पष्ट रूप से ‘तंबू’ है; उसके ठोस बिंब को बनाए रखा गया है।
- source_word: צַדִּיקִים
  choice: धर्मियों
  rationale: צַדִּיקִים उन लोगों को दर्शाता है जो धर्मी या न्यायी हैं। ‘धर्मी’ आधुनिक बाइबलीय हिंदी में सहज और अर्थ-संगत है।
- source_word: יְמִין יְהוָה
  choice: याहवे का दाहिना हाथ
  rationale: यह पदबंध परमेश्वर की सामर्थ्यपूर्ण, उद्धारकारी क्रिया का मानवीय बिंब है। यְהוָה को व्यक्तिगत वाचा-नाम ‘याहवे’ के रूप में रखा गया है।
- source_word: עֹשָׂה חָיִל
  choice: पराक्रम दिखाता है
  rationale: यह इब्रानी मुहावरा सामर्थ्य या वीरता के साथ कार्य करने को व्यक्त करता है। ‘पराक्रम दिखाता है’ हिंदी में स्वाभाविक है और युद्ध-विजय का अर्थ अनावश्यक रूप से निश्चित नहीं करता।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में वाचा का व्यक्तिगत नाम יְהוָה है। ‘याहवे’ उसका सीधा लिप्यंतरण है और उसे किसी उपाधि से प्रतिस्थापित नहीं करता।
- issue: विजय-भजन में יְשׁוּעָה का अर्थ
  choice: उद्धार
  alternative: विजय; छुटकारा
  rationale: शब्द ठोस बचाव और विजय, दोनों की ओर संकेत कर सकता है। मुख्य पाठ में व्यापक ‘उद्धार’ रखा गया है और संकुचित संभावनाएँ पादटिप्पणी में सुरक्षित हैं।
- issue: יְמִין יְהוָה का बिंब
  choice: याहवे का दाहिना हाथ
  alternative: याहवे की सामर्थ्य
  rationale: मूल का मानवीय रूपक परमेश्वर की शक्तिशाली क्रिया को दर्शाता है; उसे अमूर्त व्याख्या में बदलने के बजाय ज्यों का त्यों रखा गया है।
translation_notes:
  register: आधुनिक मानक हिंदी में सहज, गरिमापूर्ण और सामूहिक स्तुति के अनुकूल शैली अपनाई गई है। ‘तंबुओं’ और ‘दाहिना हाथ’ जैसे मूल बिंब सुरक्षित रखे गए हैं; ‘हर्षनाद’ मुखर उत्सव को और ‘पराक्रम दिखाता है’ इब्रानी मुहावरे को स्वाभाविक हिंदी में व्यक्त करता है।
