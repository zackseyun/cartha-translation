  text: יֹֽאמְרוּ נָ֥א בֵֽית אַהֲרֹ֑ן כִּ֖י לְ/עוֹלָ֣ם חַסְדּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/118/003.yaml
  text: Let the house of Aaron now say[a], “His steadfast love endures forever.”
translation:
  language: hi
  text: 'हारून का घराना अब यह कहे: “उसका अटल प्रेम[a] सदा बना रहता है।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसकी वाचा-निष्ठा सदा बनी रहती है।” इब्रानी शब्द חֶסֶד (हेसेद) अटल प्रेम, दया या वाचा के प्रति निष्ठा का अर्थ दे सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: יֹאמְרוּ נָא
  choice: अब कहे
  rationale: यֹאמְרוּ यहाँ उपदेशात्मक/आह्वानात्मक अर्थ वाला अपूर्ण रूप है और נָא आग्रह को बल देता है; ‘अब कहे’ सामूहिक आराधना के आह्वान को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: בֵית אַהֲרֹן
  choice: हारून का घराना
  rationale: यह रचना हारून के वंश, विशेषकर याजकीय समुदाय, को सामूहिक रूप से संबोधित करती है। ‘घराना’ मूल के पारिवारिक-सामुदायिक मुहावरे को सहज हिन्दी में बनाए रखता है।
- source_word: לְעוֹלָם
  choice: सदा बना रहता है
  rationale: शाब्दिक भाव ‘सदा के लिए’ है। חֶסֶד के साथ ‘सदा बना रहता है’ उसके निरंतर और स्थायी होने को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: חַסְדּוֹ
  choice: उसका अटल प्रेम
  rationale: חֶסֶד में प्रेम, दया, निष्ठा और संबंधपरक प्रतिबद्धता का व्यापक भाव है। ‘अटल प्रेम’ प्रेम और स्थिर निष्ठा दोनों को समेटता है, बिना अर्थ को केवल दया या केवल अनुबंधगत निष्ठा तक सीमित किए।
theological_decisions:
- issue: חֶסֶד का वाचागत स्तुति-सूत्र में अनुवाद
  choice: अटल प्रेम
  alternative: वाचा के प्रति निष्ठा; करुणा; दयालु प्रेम
  rationale: यह पद परमेश्वर की स्थायी, संबंधपरक निष्ठा की स्तुति करता है। ‘अटल प्रेम’ मूल शब्द की भावात्मक और निष्ठापरक व्यापकता को बनाए रखता है; पादटिप्पणी प्रमुख वैकल्पिक अर्थ को स्पष्ट करती है।
- issue: כִּי का उद्धृत कथन में कार्य
  choice: हिन्दी में अलग संयोजक न जोड़कर सीधे कथन देना
  alternative: क्योंकि उसका अटल प्रेम सदा बना रहता है
  rationale: כִּי यहाँ कही जाने वाली स्तुति की विषयवस्तु प्रस्तुत करता है। हिन्दी में ‘क्योंकि’ जोड़ने पर कथन किसी पहले दिए गए कारण का उत्तर-सा लग सकता है; सीधे कथन से आवर्ती आराधनात्मक सूत्र अधिक स्वाभाविक रहता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और सामूहिक आराधना के योग्य शैली रखी गई है। ‘घराना’ बाइबलीय सामुदायिक भाव को सहज बनाता है, और ‘अटल प्रेम’ सामान्य पाठक के लिए स्पष्ट रहते हुए मूल की अर्थ-व्याप्ति को सुरक्षित रखता है।
