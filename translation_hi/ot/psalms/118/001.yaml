id: PSA.118.1
reference: Psalms 118:1
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: הוֹד֣וּ לַ/יהוָ֣ה כִּי ט֑וֹב כִּ֖י לְ/עוֹלָ֣ם חַסְדּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/118/001.yaml
  text: Give thanks to Yahweh[a], for he is good[b], for his steadfast love endures forever.
translation:
  language: hi
  text: याहवे[a] का धन्यवाद करो, क्योंकि वह भला है, क्योंकि उसका अटल प्रेम सदा बना रहता है।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में YHWH (יהוה), जिसे परंपरागत रूप से ‘प्रभु’ भी लिखा जाता है।
    reason: alternative_reading
  - marker: b
    text: ‘अटल प्रेम’ के लिए प्रयुक्त इब्रानी शब्द חֶסֶד में करुणा, निष्ठावान प्रेम और वाचा के प्रति निष्ठा के भाव शामिल हैं। इसका अनुवाद ‘उसकी वाचा की निष्ठा सदा बनी रहती है’ भी किया जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹדוּ
  choice: धन्यवाद करो
  rationale: ידה के हिफ़ईल बहुवचन आज्ञार्थक रूप का यहाँ अर्थ धन्यवाद या स्तुति करना है। भजन के आराधनात्मक आह्वान में ‘धन्यवाद करो’ स्वाभाविक और अर्थानुकूल है।
- source_word: לַיהוָה
  choice: याहवे का
  rationale: לְ संबंध-सूचक है और יְהוָה परमेश्वर का विशिष्ट नाम है। हिंदी में ‘याहवे का धन्यवाद करो’ इस संबंध को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: כִּי
  choice: क्योंकि
  rationale: दोनों बार כִּי धन्यवाद करने के कारण प्रस्तुत करता है। ‘क्योंकि’ को दोहराने से मूल की समानांतर रचना बनी रहती है।
- source_word: טוֹב
  choice: भला
  rationale: טוֹב यहाँ याहवे के स्वभाव की अच्छाई बताता है। ‘भला’ व्यक्तिगत नैतिक और हितकारी अच्छाई—दोनों को समेटता है।
- source_word: לְעוֹלָם
  choice: सदा बना रहता है
  rationale: शाब्दिक अर्थ ‘सदा के लिए’ है। חַסְדּוֹ के साथ हिंदी में ‘सदा बना रहता है’ स्थायित्व को स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
- source_word: חַסְדּוֹ
  choice: उसका अटल प्रेम
  rationale: חֶסֶד में प्रेम, दया, निष्ठा और वाचा-संबंधी विश्वसनीयता के परस्पर जुड़े भाव हैं। ‘अटल प्रेम’ इसकी स्नेहपूर्णता और स्थिरता को बनाए रखता है, जबकि पादटिप्पणी इसकी व्यापक अर्थ-छाया बताती है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में विशिष्ट ईश्वरीय नाम יְהוָה है। ‘याहवे’ उसे सामान्य उपाधि में बदलने के बजाय नाम के रूप में सुरक्षित रखता है; परंपरागत विकल्प पादटिप्पणी में दिया गया है।
- issue: חֶסֶד का वाचा-संबंधी अर्थ
  choice: अटल प्रेम
  alternative: वाचा की निष्ठा; करुणा; स्थिर प्रेम
  rationale: ‘अटल प्रेम’ शब्द के प्रेमपूर्ण और स्थायी दोनों पक्षों को व्यक्त करता है, पर उसके अर्थ को केवल दया या केवल कानूनी वाचा-निष्ठा तक सीमित नहीं करता। व्यापक अर्थ पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामूहिक आराधना में सहज पाठ के योग्य रखी गई है। मूल की दोहरी ‘क्योंकि’ संरचना और संक्षिप्त स्तोत्रात्मक लय सुरक्षित है।
