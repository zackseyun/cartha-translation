  text: याह[a] मेरा बल और मेरा गीत है; वह मेरा उद्धार बन गया है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में यहाँ परमेश्वर के नाम का संक्षिप्त रूप “याह” है, न कि पूर्ण रूप יהוה, जिसे अन्य स्थानों पर कई अनुवादों में “प्रभु” से दर्शाया जाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: עָזִּי
  choice: मेरा बल
  rationale: עֹז का सामान्य अर्थ ‘बल’ या ‘सामर्थ्य’ है। काव्यात्मक समानांतरता में ‘मेरा बल’ स्वाभाविक और संक्षिप्त है।
- source_word: וְזִמְרָת
  choice: और मेरा गीत
  rationale: इस स्थिर बाइबलीय अभिव्यक्ति में זִמְרָה का सीधा अर्थ ‘गीत’ है। संबंधसूचक रूप को हिन्दी में स्पष्ट करने के लिए ‘मेरा’ दोहराया गया है।
- source_word: יָהּ
  choice: याह
  rationale: यह परमेश्वर के नाम का संक्षिप्त काव्यात्मक रूप है; लिप्यंतरण इसे पूर्ण रूप से अलग पहचान देता है।
- source_word: וַיְהִי לִי
  choice: वह मेरा ... बन गया है
  rationale: היה का परिणामी भाव ‘बन गया है’ से सुरक्षित रहता है, और לִי को स्वाभाविक हिन्दी में संबंधसूचक ‘मेरा’ से व्यक्त किया गया है।
- source_word: לִישׁוּעָה
  choice: उद्धार
  rationale: יְשׁוּעָה का अर्थ उद्धार, छुटकारा या विजय हो सकता है; ‘उद्धार’ व्यापक अर्थ रखता है और प्रसंग में बचाव को समेटता है।
theological_decisions:
- issue: संक्षिप्त ईश्वरीय नाम יָהּ का निरूपण
  choice: याह
  alternative: यहोवा / प्रभु
  rationale: मूल में पूर्ण चतुरक्षरीय नाम नहीं, बल्कि उसका संक्षिप्त काव्यात्मक रूप है। ‘याह’ इस भेद को सुरक्षित रखता है और नाम को उपाधि में नहीं बदलता।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सहज हिन्दी; मूल पद की संक्षिप्त काव्यात्मक संरचना तथा व्यक्तिगत स्वीकारोक्ति को बनाए रखा गया है।
