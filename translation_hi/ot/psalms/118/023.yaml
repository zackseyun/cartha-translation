lexical_decisions:
- source_word: מֵאֵת
  choice: की ओर से
  rationale: यह पदबंध स्रोत या उद्गम बताता है। ‘की ओर से’ स्वाभाविक हिन्दी में इस बात को व्यक्त करता है कि यह घटना यहोवा से हुई है, बिना ‘हाथ’ की ऐसी छवि जोड़े जो मूल में स्पष्ट नहीं है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: मूल पाठ में परमेश्वर का व्यक्तिगत नाम יהוה है। हिन्दी में प्रचलित लिप्यंतरण ‘यहोवा’ शीर्षक ‘प्रभु’ से अलग इस नाम को स्पष्ट रखता है।
- source_word: הָיְתָה זֹּאת
  choice: यह ... हुआ है
  rationale: शाब्दिक अर्थ ‘यह हुआ/हो आया है’ है। प्रसंग में यह किसी घटना या परिस्थिति की ओर संकेत करता है; पूर्ण पक्ष को ‘हुआ है’ स्वाभाविक रूप से व्यक्त करता है।
- source_word: הִיא
  choice: यह
  rationale: स्वतंत्र सर्वनाम कथन पर बल देता है। हिन्दी में दूसरे वाक्य का ‘यह’ उसी घटना को दोबारा सामने रखकर उस बल को स्वाभाविक ढंग से बनाए रखता है।
- source_word: נִפְלָאת
  choice: अद्भुत
  rationale: פלא का निफ़अल रूप विस्मयकारी या असाधारण होने का भाव देता है। ‘अद्भुत’ आधुनिक, गरिमापूर्ण और स्तुति के प्रसंग के अनुकूल है।
- source_word: בְּעֵינֵינוּ
  choice: हमारी आँखों में
  rationale: यह मूल इब्रानी मुहावरे का निकट और हिन्दी में समझ में आने वाला रूप है; यह वक्ताओं के अनुभवात्मक दृष्टिकोण को बनाए रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: पद में चार अक्षरों वाला व्यक्तिगत ईश्वरीय नाम सीधे आया है। ‘यहोवा’ हिन्दी पाठकों में प्रचलित नाम-रूप है और इसे केवल उपाधि ‘प्रभु’ से प्रतिस्थापित नहीं करता। उच्चारण के पुनर्निर्माण के अनुसार ‘याहवे’ भी संभव है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण काव्यात्मक शैली रखी गई है। दोनों छोटे खंडों की समानांतर रचना और ‘हमारी आँखों में’ वाला इब्रानी दृष्टि-मुहावरा सुरक्षित रखा गया है।
