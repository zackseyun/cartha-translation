  text: This has come from Yahweh[b][a]; it is marvelous in our eyes.
translation:
  language: hi
  text: यह याहवे की ओर से हुआ है[a]; यह हमारी आँखों में अद्भुत है[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “यह याहवे से हुआ है” अथवा “यह याहवे के द्वारा हुआ है।”
