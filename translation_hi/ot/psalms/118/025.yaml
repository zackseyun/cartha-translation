  text: אָנָּ֣א יְ֭הוָה הוֹשִׁ֘יעָ֥/ה נָּ֑א אָֽנָּ֥א יְ֝הוָ֗ה הַצְלִ֘יחָ֥/ה נָּֽא׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/118/025.yaml
  text: Please, LORD, save us! Please, LORD, grant us success[a]!
translation:
  language: hi
  text: हे यहोवा, कृपा करके हमें बचा! हे यहोवा, कृपा करके हमें सफलता दे[a]!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में इन आज्ञार्थक क्रियाओं का कर्म नहीं बताया गया है; सामुदायिक प्रार्थना के भाव के आधार पर ‘हमें’ जोड़ा गया है।
    reason: implicit_object
lexical_decisions:
- source_word: אָנָּא ... נָּא
  choice: कृपा करके
  rationale: दोनों कण मिलकर समय-सूचक ‘अब’ नहीं, बल्कि आग्रहपूर्ण विनती व्यक्त करते हैं; आधुनिक हिन्दी में ‘कृपा करके’ इस भाव को स्वाभाविक रूप से व्यक्त करता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: इब्रानी पाठ में परमेश्वर का विशिष्ट नाम है; ‘यहोवा’ हिन्दी बाइबलीय परंपरा में उसका प्रचलित और पहचाना जाने वाला रूप है।
- source_word: הוֹשִׁיעָה
  choice: बचा
  rationale: यह हिफ़ील आज्ञार्थक रूप संकट से बचाने या उद्धार करने की विनती है; ‘बचा’ साधारण पाठक के लिए स्पष्ट और सीधा है।
- source_word: הַצְלִיחָה
  choice: सफलता दे
  rationale: यह हिफ़ील आज्ञार्थक रूप सफल कराने या उन्नति देने का भाव रखता है; यहाँ सामुदायिक प्रार्थना के संदर्भ में ‘सफलता दे’ स्वाभाविक है।
theological_decisions:
- issue: आज्ञार्थक क्रियाओं का अनकहा कर्म
  choice: दोनों पंक्तियों में ‘हमें’ जोड़ा गया
  alternative: कर्म को अनकहा छोड़कर ‘बचा’ और ‘सफल कर’ कहना
  rationale: इब्रानी में कर्म स्पष्ट नहीं है, पर सामुदायिक प्रार्थना से बहुवचन ‘हमें’ निहित है। इसे पाठ में स्पष्ट किया गया और पादटिप्पणी द्वारा पारदर्शी रखा गया।
- issue: אָנָּא/נָּא को समय-सूचक समझने की संभावना
  choice: इसे आग्रहपूर्ण विनती ‘कृपा करके’ के रूप में व्यक्त किया गया
  alternative: ‘अब’
  rationale: इस संदर्भ में कण का प्रमुख कार्य विनती पर बल देना है, किसी विशेष समय को बताना नहीं।
translation_notes:
  register: भाषा आधुनिक, सरल और प्रार्थनामय रखी गई है। ‘हे’ संबोधन को गरिमा के लिए और ‘कृपा करके’ को आग्रहपूर्ण विनती के स्वाभाविक हिन्दी रूप के लिए चुना गया है।
