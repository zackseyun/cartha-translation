base_translation:
  language: en
  yaml_path: translation/ot/psalms/087/005.yaml
  text: And of Zion it will be said[a], “This one and that one were born in her,” and the Most High himself will establish her.
translation:
  language: hi
  text: और सिय्योन के विषय में कहा जाएगा[a], “यह व्यक्ति और वह व्यक्ति उसमें जन्मे हैं,” और परमप्रधान स्वयं उसे स्थिर करेगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “व्यक्ति पर व्यक्ति उसमें जन्मा है।” इब्रानी में “मनुष्य और मनुष्य” की पुनरावृत्ति व्यक्तियों को एक-एक करके बताती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלֲצִיּוֹן
  choice: और सिय्योन के विषय में
  rationale: לְ यहाँ विषय का परिचय देता है; ‘के विषय में’ स्वाभाविक हिन्दी में अर्थ स्पष्ट करता है और וּ की काव्यात्मक निरन्तरता ‘और’ से बनी रहती है।
- source_word: יֵאָמַר
  choice: कहा जाएगा
  rationale: אמר का निफ़अल अपूर्ण रूप यहाँ अनिश्चित कर्ता वाले भावी कर्मवाच्य कथन को व्यक्त करता है।
- source_word: אִישׁ וְאִישׁ
  choice: एक-एक जन
  rationale: शब्द की पुनरावृत्ति वितरणात्मक अर्थ देती है—व्यक्तियों को अलग-अलग गिनते हुए—जिसे आधुनिक हिन्दी में ‘एक-एक जन’ सहज रूप से व्यक्त करता है।
- source_word: יֻלַּד בָּהּ
  choice: उसमें जन्मा है
  rationale: एकवचन क्रिया वितरणात्मक ‘एक-एक जन’ के अनुरूप एकवचन रखी गई है; ‘उसमें’ स्त्रीलिंग नगर सिय्योन की ओर संकेत को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: וְהוּא
  choice: और ... स्वयं
  rationale: स्वतंत्र सर्वनाम का बल ‘स्वयं’ से व्यक्त किया गया है और उसे परमप्रधान से जोड़ा गया है।
- source_word: יְכוֹנְנֶהָ
  choice: उसे दृढ़ करेगा
  rationale: כון का अर्थ स्थापित करना और स्थिर या सुरक्षित करना दोनों हो सकता है; ‘दृढ़ करेगा’ इस संदर्भ में सिय्योन को स्थायित्व देने का भाव रखता है।
- source_word: עֶלְיוֹן
  choice: परमप्रधान
  rationale: यह परमेश्वर की उपाधि है; ‘परमप्रधान’ हिन्दी बाइबलीय परम्परा में स्पष्ट, संक्षिप्त और गरिमापूर्ण है।
theological_decisions:
- issue: וְהוּא के बलयुक्त सर्वनाम और עֶלְיוֹן का सम्बन्ध
  choice: ‘परमप्रधान स्वयं’—सर्वनाम को परमेश्वर की ओर संकेत करने वाला और बलयुक्त रखा गया है।
  alternative: ‘और वह, परमप्रधान, उसे दृढ़ करेगा।’
  rationale: इब्रानी वाक्य का समापन सिय्योन की दृढ़ता को परमप्रधान के अपने कार्य पर टिकाता है; ‘स्वयं’ मूल के बल को सुरक्षित रखता है, बिना अतिरिक्त सिद्धान्त जोड़ने के।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज किन्तु गरिमापूर्ण काव्यात्मक रूप। ‘एक-एक जन’ मूल की वितरणात्मक पुनरावृत्ति को स्वाभाविक ढंग से रखता है; ‘उसमें’ हिन्दी में सिय्योन-नगर के व्यक्तिकरण को अनावश्यक रूप से कठोर बनाए बिना सुरक्षित करता है।
