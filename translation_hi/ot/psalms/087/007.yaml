  text: וְ/שָׁרִ֥ים כְּ/חֹלְלִ֑ים כָּֽל מַעְיָנַ֥/י בָּֽ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/087/007.yaml
  text: Singers and dancers alike say[b][a], “All my springs are in you.”
translation:
  language: hi
  text: गायक और नर्तक, दोनों कहते हैं[a], “मेरे सब सोते तुझमें हैं।”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “बाँसुरी बजानेवाले”; इब्रानी शब्द को परम्परागत रूप से नाचने या घूमनेवालों के लिए समझा गया है, हालांकि वाद्य बजाने का अर्थ भी प्रस्तावित किया गया है।
    reason: lexical_alternative
  - marker: b
    text: “मेरे सब सोते तुझमें हैं” एक काव्यात्मक रूपक है; इसका आशय “मेरे सभी जलस्रोत” या “मेरे जीवन के सभी स्रोत तुझमें हैं” हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁרִים
  choice: गानेवाले
  rationale: यह שׁיר (‘गाना’) का कृदन्त रूप है और समानांतर पद כְּחֹלְלִים के साथ स्वाभाविक रूप से गायकों को दर्शाता है; ‘हाकिम’ का अर्थ यहाँ कम उपयुक्त है।
- source_word: כְּחֹלְלִים
  choice: नाचनेवाले समान रूप से
  rationale: यह सम्भवतः חול के ‘नाचना/घूमना’ अर्थ से है। उपसर्ग כְּ को इस संक्षिप्त काव्य-पंक्ति में तुलनात्मक अथवा साहचर्यसूचक मानकर गायकों और नर्तकों को साथ रखा गया है; वाद्य बजाने का सम्भावित अर्थ पादटिप्पणी में दिया गया है।
- source_word: כָּל
  choice: सब
  rationale: यह समग्रता व्यक्त करता है और हिन्दी की काव्यात्मक घोषणा ‘मेरे सब सोते’ में स्वाभाविक है।
- source_word: מַעְיָנַי
  choice: मेरे सोते
  rationale: מַעְיָן जल के सोते या झरने को दर्शाता है। ‘सोते’ ठोस और काव्यात्मक बिम्ब को बनाए रखता है तथा जीवन-स्रोत के रूपक की सम्भावना खुली छोड़ता है।
- source_word: בָּךְ
  choice: तुझमें
  rationale: ב का सामान्य अर्थ ‘में’ है और स्त्रीलिंग एकवचन सम्बोधन सिय्योन की ओर है। ‘तुझमें’ मूल के स्थान अथवा रूपकात्मक स्रोत—दोनों आयामों को बिना अनावश्यक व्याख्या के बनाए रखता है।
theological_decisions:
- issue: सिय्योन को सम्बोधित ‘मेरे सोते’ का रूपकात्मक आशय
  choice: ‘मेरे सब सोते तुझमें हैं’ कहकर मूल रूपक को बनाए रखा गया है।
  alternative: ‘मेरे जीवन के सभी स्रोत तुझमें हैं’ अथवा ‘मेरी सारी आशीषें तुझमें हैं।’
  rationale: भजन सिय्योन को जीवन और अपनेपन के केन्द्र के रूप में प्रस्तुत कर सकता है, पर इब्रानी बिम्ब अर्थ की काव्यात्मक खुलावट रखता है। व्याख्यात्मक धार्मिक निष्कर्ष थोपने के बजाय वही तनाव सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और काव्यात्मक शैली रखी गई है। सिय्योन के स्त्रीलिंग एकवचन सम्बोधन के कारण ‘तुझमें’ चुना गया है। ‘सोते’ ने जलस्रोत का ठोस बिम्ब और उसके सम्भावित रूपकात्मक अर्थ दोनों सुरक्षित रखे हैं।
