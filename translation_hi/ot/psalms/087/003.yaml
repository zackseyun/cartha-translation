  text: तेरे विषय में गौरवपूर्ण बातें कही जाती हैं, हे परमेश्वर के नगर। सेला
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נִכְבָּדוֹת
  choice: महिमामय बातें
  rationale: यह כבד से बना स्त्रीलिंग बहुवचन रूप है, जो यहाँ संज्ञा की तरह प्रयुक्त होकर सम्मान, वैभव और गौरव से भरी बातों को दर्शाता है। काव्यात्मक स्तुति में ‘महिमामय बातें’ स्वाभाविक और गरिमापूर्ण है।
- source_word: מְדֻבָּר
  choice: कही जाती हैं
  rationale: דבר का पुअल कृदंत है और נִכְבָּדוֹת के साथ विधेय रूप में आया है। हिंदी में बहुवचन कर्ता के अनुसार ‘कही जाती हैं’ सहज है और कर्मवाच्य भाव बनाए रखता है।
- source_word: בָּךְ
  choice: तेरे विषय में
  rationale: דבר के साथ ב यहाँ संबोधित नगर के संबंध में कही गई बातों का अर्थ देता है। ‘तेरे विषय में’ आधुनिक हिंदी में स्पष्ट है, जबकि ‘तुझमें’ भी व्याकरणतः संभव होने के कारण पादटिप्पणी में रखा गया है।
- source_word: עִיר הָאֱלֹהִים
  choice: हे परमेश्वर के नगर
  rationale: यह संबंधवाचक रचना ‘परमेश्वर का नगर’ है। पहले से उपस्थित द्वितीय पुरुष संबोधन को हिंदी में स्पष्ट और स्वाभाविक बनाने के लिए ‘हे ... नगर’ प्रयुक्त किया गया है।
- source_word: סֶלָה
  choice: सेला
  rationale: इसका ठीक अर्थ अनिश्चित है और यह संभवतः उपासना या संगीत से जुड़ा संकेत है; इसलिए अर्थ निर्धारित करने के बजाय इसका लिप्यंतरण किया गया है।
