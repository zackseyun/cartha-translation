  register: भाषा आधुनिक, गरिमापूर्ण और काव्यात्मक रखी गई है। परमेश्वर के नगर को प्रत्यक्ष संबोधन दिखाने के लिए ‘हे’ तथा निकट, काव्यात्मक एकवचन संबोधन के लिए ‘तेरे’ चुना गया है। विस्मयादिबोधक चिह्न संबोधन की स्तुतिपरक तीव्रता व्यक्त करता है; ‘सेला’ अलग उपासना-संगीत संकेत के रूप में रखा गया है।
