    reason: lexical_alternative
lexical_decisions:
- source_word: לִבְנֵי קֹרַח
  choice: कोरह के पुत्रों का
  rationale: उपसर्ग לִ भजन के शीर्षकों में रचना, संबंध या समर्पण का संकेत दे सकता है। ‘के पुत्रों का’ सहज और संक्षिप्त है; वैकल्पिक संबंध-सूचक अर्थ पादटिप्पणी में रखा गया है।
- source_word: מִזְמוֹר שִׁיר
  choice: भजन; एक गीत
  rationale: दोनों इब्रानी विधा-संज्ञाओं को अलग-अलग बनाए रखा गया है; उन्हें एक ही शब्द में समेटा नहीं गया। अर्धविराम शीर्षक के दोनों जुड़े हुए अंशों को स्वाभाविक रूप से जोड़ता है।
- source_word: יְסוּדָתוֹ
  choice: उसकी नींव
  rationale: יְסוּדָה का सीधा अर्थ ‘नींव’ है और प्रत्यय तृतीय पुरुष एकवचन है। ‘उसकी’ अनकहे संदर्भ को स्पष्ट किए बिना मूल की काव्यात्मक अस्पष्टता बनाए रखता है।
- source_word: בְּהַרְרֵי קֹדֶשׁ
  choice: पवित्र पर्वतों पर
  rationale: בְּ स्थान के लिए ‘पर’ या ‘में’ हो सकता है। यहाँ नींव के स्थान के साथ ‘पर्वतों पर’ आधुनिक हिन्दी में अधिक स्वाभाविक है। קֹדֶשׁ को विशेषणात्मक अर्थ में ‘पवित्र’ किया गया है।
theological_decisions:
- issue: יְסוּדָתוֹ में सर्वनाम का संदर्भ
  choice: मुख्य पाठ में ‘उसकी नींव’ रखकर संदर्भ को अनिर्दिष्ट रहने देना
  alternative: ‘इसकी नींव’, जिसका संकेत सिय्योन/यरूशलेम की ओर समझा जाए; अथवा व्याख्यात्मक रूप से ‘उसने इसे स्थापित किया है’
  rationale: इब्रानी पद में सर्वनाम का पूर्वपद स्पष्ट नहीं है। यह परमेश्वर से संबंधित नींव या आगे वर्णित सिय्योन/नगर की नींव की ओर समझा जा सकता है। किसी एक अर्थ को मुख्य पाठ में थोपने के बजाय मूल तनाव सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘भजन’ और ‘गीत’ परिचित बाइबलीय विधा-संज्ञाएँ हैं। शीर्षक को मुख्य पंक्ति से अलग किए बिना अर्धविराम से जोड़ा गया है; सर्वनाम की मूल अस्पष्टता जानबूझकर सुरक्षित रखी गई है।
