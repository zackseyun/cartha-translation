  text: A psalm of the sons of Korah[a]; a song[c][b]. His foundation is in the holy mountains.
translation:
  language: hi
  text: कोरह के पुत्रों का भजन और गीत। उसकी नींव[a] पवित्र पर्वतों पर[b] है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ “उसकी” का संदर्भ स्पष्ट नहीं है। इसे परमेश्वर से संबंधित समझा जा सकता है, या आगे वर्णित सिय्योन/यरूशलेम की ओर संकेत मानकर “इसकी नींव” अनुवाद किया जा सकता है।
