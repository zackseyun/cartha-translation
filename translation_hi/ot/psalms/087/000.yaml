lexical_decisions:
- source_word: לִבְנֵי קֹרַח
  choice: कोरह के पुत्रों का
  rationale: लְ उपसर्ग यहाँ संबंध या रचनाकारिता सूचित कर सकता है; हिन्दी में ‘का’ शीर्षक के स्वाभाविक संबंध को व्यक्त करता है, जबकि ‘के लिए’ की संभावना पादटिप्पणी में रखी गई है।
