- source_word: בְּהַרְרֵי קֹדֶשׁ
  choice: पवित्र पर्वतों पर
  rationale: बहुवचन ‘पर्वतों’ और स्थानवाचक בְּ का स्वाभाविक हिन्दी रूप दिया गया है; ‘पवित्र’ मूल के विशेषणात्मक भाव को व्यक्त करता है।
theological_decisions:
- issue: ‘उसकी’ का निहित संदर्भ
  choice: मुख्य पाठ में संदर्भ को अनिर्धारित रखा गया
  alternative: ‘सिय्योन की नींव’ या ‘यरूशलेम की नींव’
  rationale: इब्रानी पाठ में संज्ञा स्पष्ट रूप से नहीं दी गई है; सिय्योन/यरूशलेम संदर्भ से संभावित है, पर उसे मुख्य पाठ में जोड़ना वास्तविक अस्पष्टता को समाप्त कर देता।
- issue: कोरह के पुत्रों से संबंध
  choice: ‘का’
  alternative: ‘के लिए’
  rationale: לְ संबंध, समर्पण या संबोधन बता सकता है; प्रत्यक्ष रचनाकारिता को सिद्धांततः निश्चित किए बिना सामान्य शीर्षकीय संबंध रखा गया है।
