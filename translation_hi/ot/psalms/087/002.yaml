  text: אֹהֵ֣ב יְ֭הוָה שַׁעֲרֵ֣י צִיּ֑וֹן מִ֝/כֹּ֗ל מִשְׁכְּנ֥וֹת יַעֲקֹֽב׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/087/002.yaml
  text: Yahweh loves the gates of Zion more than all the dwellings of Jacob[a].
translation:
  language: hi
  text: 'याहवे सिय्योन के फाटकों से

    याकूब के सभी निवासों से बढ़कर प्रेम करता है।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֹהֵב
  choice: प्रेम करता है
  rationale: यहाँ אהב का काल रूप सामान्य और निरंतर भाव व्यक्त करता है; आधुनिक हिन्दी में ‘प्रेम करता है’ स्वाभाविक और गरिमापूर्ण है।
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत नाम को उपाधि से बदलने के बजाय हिन्दी लिप्यंतरण में सुरक्षित रखा गया है।
- source_word: שַׁעֲרֵי
  choice: फाटकों
  rationale: बहुवचन संबंध-रचना की ठोस छवि को बनाए रखा गया है; इसे व्याख्यात्मक रूप से पूरे नगर में नहीं बदला गया।
- source_word: צִיּוֹן
  choice: सिय्योन
  rationale: स्थान-नाम का प्रचलित हिन्दी बाइबलीय लिप्यंतरण रखा गया है।
- source_word: מִכֹּל
  choice: सभी ... से बढ़कर
  rationale: מִן के तुलनात्मक अर्थ को स्पष्ट और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: מִשְׁכְּנוֹת
  choice: निवासों
  rationale: यहाँ शब्द सामान्य रहने के स्थानों को सूचित करता है; ‘निवास’ अनावश्यक रीति-संबंधी अर्थ से बचता है।
- source_word: יַעֲקֹב
  choice: याकूब
  rationale: मूल पाठ के नाम को बनाए रखा गया है, यद्यपि यहाँ उसका सामूहिक संदर्भ याकूब के लोगों या उनके क्षेत्र से है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा / प्रभु
  rationale: मूल में व्यक्तिगत नाम है; इसलिए उसे किसी उपाधि से प्रतिस्थापित किए बिना लिप्यंतरित किया गया है।
- issue: מִכֹּל का तुलनात्मक बल
  choice: सभी निवासों से बढ़कर
  alternative: सभी निवासों के ऊपर
  rationale: सन्दर्भ में परमेश्वर के प्रेम की तुलना सिय्योन के फाटकों और याकूब के अन्य निवासों के बीच है; ‘से बढ़कर’ इसे स्पष्ट रखते हुए अतिरिक्त धर्मवैज्ञानिक निष्कर्ष नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी, काव्यात्मक पंक्ति-विन्यास और गरिमापूर्ण सामान्य शब्दावली। ‘फाटक’ और ‘निवास’ मूल की ठोस तथा सामूहिक छवियों को बनाए रखते हैं।
