lexical_decisions:
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत वाचा-नाम को उपाधि से बदलने के बजाय देवनागरी में लिप्यंतरित किया गया है।
- source_word: יִסְפֹּר
  choice: गिनेगा
  rationale: काल क्रिया ספר का मूल अर्थ ‘गिनना’ है; पंजीकरण का भाव अगले पदबंध से स्पष्ट होता है।
- source_word: בִּכְתוֹב
  choice: जब ... लेखा लिखेगा
  rationale: ב के साथ infinitive construct यहाँ कालवाचक है; ‘लेखा लिखना’ जनसमूहों के पंजीकरण का स्वाभाविक हिंदी चित्र देता है।
- source_word: עַמִּים
  choice: जाति-जाति के लोगों
  rationale: बहुवचन עַמִּים अनेक जनसमुदायों को सूचित करता है; यह हिंदी में केवल राजनीतिक ‘राष्ट्रों’ की अपेक्षा व्यापक और सहज है।
- source_word: זֶה
  choice: यह व्यक्ति
  rationale: पुल्लिंग एकवचन संकेतवाचक किसी सूचीबद्ध व्यक्ति की ओर संकेत करता है; ‘व्यक्ति’ अनावश्यक रूप से पुरुष लिंग आरोपित नहीं करता।
- source_word: יֻלַּד
  choice: जन्मा था
  rationale: ילד का पुअल रूप जन्म लेने के निष्क्रिय अर्थ को व्यक्त करता है; हिंदी में ‘जन्मा था’ अभिलेखीय घोषणा के अनुकूल है।
- source_word: שָׁם
  choice: वहाँ
  rationale: मूल में स्थानवाचक क्रियाविशेषण ‘वहाँ’ है; सिय्योन संदर्भ से समझ में आता है, पर उसे मुख्य पाठ में स्पष्ट करके मूल की अस्पष्टता नहीं मिटाई गई।
- source_word: סֶלָה
  choice: सेला
  rationale: इस उपासना-संगीत संबंधी पद का सटीक अर्थ अनिश्चित है, इसलिए इसका पारंपरिक लिप्यंतरण रखा गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा
  rationale: यह इब्रानी चतुरक्षरीय व्यक्तिगत नाम का प्रचलित विद्वत्तापूर्ण लिप्यंतरण है और उसे ‘प्रभु’ जैसी उपाधि से प्रतिस्थापित नहीं करता।
- issue: שָׁם के स्थान-संदर्भ को स्पष्ट करना
  choice: वहाँ
  alternative: उसमें / सिय्योन में
  rationale: आसपास के पदों में संकेत सिय्योन की ओर है, किंतु इब्रानी पाठ स्वयं केवल ‘वहाँ’ कहता है; मुख्य पाठ में यही अभिव्यक्ति रखने से वास्तविक संदर्भगत खुलापन सुरक्षित रहता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘जाति-जाति के लोगों का लेखा’ पंजीकरण की छवि व्यक्त करता है, जबकि ‘गिनेगा’ मूल क्रिया का प्रमुख अर्थ सुरक्षित रखता है।
