base_translation:
  language: en
  yaml_path: translation/ot/psalms/087/004.yaml
  text: 'I will mention Rahab and Babylon among those who know me[a]; behold, Philistia and Tyre[c][b], along with Cush: this one was born there.'
translation:
  language: hi
  text: मैं रहब[a] और बाबेल को उन लोगों में गिनूँगा जो मुझे जानते हैं; देखो, पलिश्त और सोर, कूश के साथ—यह वहाँ जन्मा था।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: रहब मिस्र का एक काव्यात्मक नाम है।
    reason: alternative_reading
  - marker: b
    text: अर्थात्, भजन के संदर्भ में सिय्योन में।
    reason: cross_reference
lexical_decisions:
- source_word: אַזְכִּיר
  choice: उल्लेख करूँगा
  rationale: זכר के हिफ़ील रूप का यहाँ अर्थ किसी का नाम लेना या उल्लेख करना है; राष्ट्रों की काव्यात्मक सूची में यह स्वाभाविक है।
- source_word: רַהַב
  choice: रहब
  rationale: मूल का काव्यात्मक नाम सुरक्षित रखा गया है; यह यहाँ मिस्र का नाम है, जिसे पादटिप्पणी स्पष्ट करती है।
- source_word: וּבָבֶל
  choice: और बाबेल
  rationale: स्थानवाचक नाम का प्रचलित हिन्दी बाइबलीय रूप रखा गया है।
- source_word: לְיֹדְעָי
  choice: अपने जाननेवालों में
  rationale: संक्षिप्त काव्यात्मक पदबंध को ऐसे वर्ग में सम्मिलन के अर्थ में प्रस्तुत किया गया है जो वक्ता को जानते या स्वीकार करते हैं; ‘मेरे जाननेवालों से’ भी व्याकरणतः सम्भव है।
- source_word: הִנֵּה
  choice: देखो
  rationale: ध्यान आकर्षित करने वाले हिब्रू अव्यय का वर्तमान, गरिमापूर्ण और सहज हिन्दी रूप।
- source_word: פְלֶשֶׁת
  choice: पलिश्त
  rationale: मूल में लोगों के बजाय भूभाग का नाम है; इसलिए स्थानवाचक रूप रखा गया है।
- source_word: וְצוֹר
  choice: और सोर
  rationale: स्थान के नाम का प्रचलित हिन्दी बाइबलीय रूप।
- source_word: עִם כּוּשׁ
  choice: कूश के साथ
  rationale: עִם के साहचर्य या साथ होने के सीधे अर्थ को सुरक्षित रखता है।
- source_word: זֶה
  choice: यह
  rationale: एकवचन पुल्लिंग संकेतवाचक का संक्षिप्त रूप रखा गया है; ‘यह व्यक्ति’ जोड़ना मूल से अधिक स्पष्टता लाता।
- source_word: יֻלַּד שָׁם
  choice: वहाँ जन्मा था
  rationale: ילד के पुअल रूप और שָׁם का सीधा अर्थ; ‘वहाँ’ का संदर्भ मुख्य पाठ में अनिर्दिष्ट रखा गया है।
theological_decisions:
- issue: ‘अपने जाननेवालों’ में प्रथम पुरुष वक्ता की पहचान
  choice: प्रथम पुरुष को सुरक्षित रखा गया, वक्ता की पहचान नहीं जोड़ी गई।
  alternative: वक्ता को स्पष्ट रूप से यहोवा या मानवीकृत सिय्योन कहना।
  rationale: पद की पंक्ति स्वयं वक्ता का स्पष्ट नाम नहीं देती; संदर्भ से पहचान करने की गुंजाइश बनी रहनी चाहिए।
- issue: ‘वहाँ’ का संदर्भ
  choice: मुख्य पाठ में केवल ‘वहाँ’ रखा गया।
  alternative: ‘सिय्योन में’ या ‘परमेश्वर के नगर में’ कहना।
  rationale: भजन का संदर्भ सिय्योन की ओर संकेत करता है, पर मूल पद केवल स्थानवाचक क्रियाविशेषण देता है; अतः व्याख्या पादटिप्पणी में दी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण काव्यात्मक शैली रखी गई है। ‘देखो’ मूल के ध्यानाकर्षक הִנֵּה को सहज ढंग से व्यक्त करता है। स्थानों के नाम प्रचलित हिन्दी बाइबलीय वर्तनी में हैं।
