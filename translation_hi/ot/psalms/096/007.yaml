base_translation:
  language: en
  yaml_path: translation/ot/psalms/096/007.yaml
  text: Ascribe to Yahweh[a], families of the peoples[c][b], ascribe to Yahweh glory and strength.
translation:
  language: hi
  text: हे जनसमूहों के कुलों[b], याहवे[a] को उसका उचित आदर दो[c]; याहवे को महिमा और सामर्थ्य दो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘याहवे’ हिब्रू में परमेश्वर के निज नाम יהוה (YHWH) का लिप्यंतरण है; कई हिन्दी अनुवादों में इसके लिए ‘यहोवा’ या ‘प्रभु’ मिलता है।
    reason: alternative_reading
  - marker: b
    text: या, ‘राष्ट्रों के घरानों।’
    reason: lexical_alternative
  - marker: c
    text: शाब्दिक रूप से, ‘याहवे को दो।’ यहाँ भाव है कि जो आदर उसका है, उसे स्वीकार करके उसे दिया जाए।
    reason: lexical_alternative
lexical_decisions:
- source_word: הָבוּ
  choice: उसका उचित मान दो / दो
  rationale: इस स्तुतिगान में क्रिया का अर्थ याहवे को कोई वस्तु देना नहीं, बल्कि जो आदर उसका है उसे स्वीकार करके देना है। पहली पंक्ति में अर्थ स्पष्ट करने के लिए ‘उसका उचित मान दो’ और दूसरी में मूल की संक्षिप्त पुनरावृत्ति बनाए रखने के लिए ‘दो’ रखा गया है।
- source_word: לַיהוָה
  choice: याहवे को
  rationale: ל संबंधसूचक अप्रत्यक्ष कर्म को चिह्नित करता है और יהוה परमेश्वर का निज नाम है; इसलिए इसे ‘याहवे’ के रूप में लिप्यंतरित किया गया है।
- source_word: מִשְׁפְּחוֹת עַמִּים
  choice: विभिन्न जनसमूहों के कुलो
  rationale: מִשְׁפְּחוֹת परिवार-समूहों या कुलों को और עַמִּים अनेक लोगों/जनसमूहों को दर्शाता है। यह अनुवाद जातीय-सामुदायिक बहुवचन को बनाए रखता है और आधुनिक हिन्दी में ‘जाति’ से उत्पन्न हो सकने वाले वर्ण-व्यवस्था के अर्थ से बचता है।
- source_word: כָּבוֹד
  choice: महिमा
  rationale: आराधना के प्रसंग में כָּבוֹד परमेश्वर के गौरव और आदर को दर्शाता है; ‘महिमा’ स्वाभाविक और प्रतिष्ठित बाइबलीय पद है।
- source_word: וָעֹז
  choice: और सामर्थ्य
  rationale: עֹז शक्ति, बल या पराक्रम को दर्शाता है। ‘सामर्थ्य’ महिमा के साथ स्वाभाविक बैठता है और दिव्य शक्ति का भाव बनाए रखता है।
theological_decisions:
- issue: परमेश्वर के निज नाम יהוה का अनुवाद
  choice: याहवे
  alternative: यहोवा / प्रभु
  rationale: मूल पाठ में चार अक्षरों वाला निज नाम सीधे आया है। ‘याहवे’ उसे उपाधि में बदलने के बजाय नाम के रूप में सुरक्षित रखता है; पादटिप्पणी प्रचलित हिन्दी विकल्पों की जानकारी देती है।
- issue: मनुष्यों द्वारा परमेश्वर को महिमा और सामर्थ्य ‘देना’
  choice: उचित मान देना; महिमा और सामर्थ्य देना
  alternative: महिमा और सामर्थ्य का श्रेय देना
  rationale: 'मूल का काव्यात्मक तनाव बनाए रखा गया है: आराधक परमेश्वर में किसी कमी को पूरा नहीं करते, बल्कि जो उसका है उसे स्वीकार करते हैं। पहली पंक्ति इसे स्वाभाविक हिन्दी में स्पष्ट करती है और दूसरी मूल रूपक को बनाए रखती है।'
translation_notes:
  register: भाषा आधुनिक, काव्यात्मक और आराधनात्मक रखी गई है। संबोधन ‘कुलो’ मूल के सामुदायिक बहुवचन को बचाता है। अर्धविराम समानांतर आज्ञाओं को जोड़ता है, जबकि दूसरी आज्ञा की पुनरावृत्ति मूल की लय बनाए रखती है।
