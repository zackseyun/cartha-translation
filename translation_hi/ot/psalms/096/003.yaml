source:
  edition: WLC
  text: סַפְּר֣וּ בַ/גּוֹיִ֣ם כְּבוֹד֑/וֹ בְּ/כָל הָֽ֝/עַמִּ֗ים נִפְלְאוֹתָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/096/003.yaml
  text: Declare his glory among the nations[a], his wondrous deeds among all the peoples.
translation:
  language: hi
  text: 'राष्ट्रों के बीच उसकी महिमा का वर्णन करो,

    सब लोगों के बीच उसके अद्भुत कामों[a] का वर्णन करो।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘आश्चर्यकर्मों’ अथवा ‘अद्भुत कार्यों’।
    reason: नִפְלְאוֹתָיו के लिए वैध शब्दगत विकल्प; मूल शब्द विस्मयकारी घटनाओं और किए गए असाधारण कार्यों—दोनों का भाव दे सकता है।
lexical_decisions:
- source_word: סַפְּרוּ
  choice: वर्णन करो / बखान करो
  rationale: पिएल बहुवचन आज्ञार्थक सार्वजनिक रूप से बताने और विस्तार से सुनाने का आह्वान करता है। दोनों पदों में स्वाभाविक हिंदी काव्यात्मक विविधता के लिए ‘वर्णन करो’ और ‘बखान करो’ रखा गया है।
- source_word: בַגּוֹיִם
  choice: राष्ट्रों के बीच
  rationale: גּוֹיִם यहाँ व्यापक मानव-समुदायों या राष्ट्रों को दर्शाता है। ‘राष्ट्रों’ सार्वभौमिक दायरे को स्पष्ट करता है और बाद की धार्मिक-जातीय अर्थछाया थोपने से बचता है।
- source_word: כְּבוֹדוֹ
  choice: उसकी महिमा
  rationale: כָּבוֹד आदर, वैभव और गौरव का भाव रखता है; स्तुति के प्रसंग में ‘महिमा’ स्वाभाविक और धर्मवैचारिक रूप से उपयुक्त है।
- source_word: בְּכָל הָעַמִּים
  choice: सब जातियों के बीच
  rationale: עַמִּים को ‘जातियों’ कहने से पहले पद के גּוֹיִם (‘राष्ट्रों’) से काव्यात्मक भेद बना रहता है। यहाँ ‘जातियाँ’ का अर्थ विभिन्न जन-समुदाय है, न कि भारतीय सामाजिक जाति-व्यवस्था।
- source_word: נִפְלְאוֹתָיו
  choice: उसके अद्भुत कामों
  rationale: פלא से बना यह शब्द विस्मय उत्पन्न करने वाले असाधारण कार्यों को दर्शाता है। ‘अद्भुत काम’ गुण और कर्म—दोनों को सहज आधुनिक हिंदी में व्यक्त करता है।
theological_decisions:
- issue: घोषणा का सार्वभौमिक दायरा
  choice: परमेश्वर की महिमा और उसके अद्भुत कामों का वर्णन सभी राष्ट्रों और जन-समुदायों के बीच करने की आज्ञा
  alternative: इसे मुख्यतः इस्राएल के निकटवर्ती राष्ट्रों तक सीमित समझना
  rationale: גּוֹיִם और כָּל הָעַמִּים का समानांतर प्रयोग व्यापक अंतरराष्ट्रीय दायरे पर बल देता है। अनुवाद इस व्यापकता को बनाए रखता है, पर पद में स्पष्ट न की गई बाद की मिशन-संबंधी अवधारणाएँ नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिंदी का गरिमापूर्ण, सार्वजनिक स्तुति के योग्य काव्यात्मक रजिस्टर। ‘राष्ट्रों’ और ‘जातियों’ से मूल के दो समानांतर बहुवचन संज्ञा-समूहों का भेद रखा गया है; ‘बखान’ सामान्य पाठक के लिए बोधगम्य रहते हुए स्तोत्र की घोषणात्मक शैली को पुष्ट करता है।
