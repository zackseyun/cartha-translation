  register: भाषा आधुनिक, गरिमापूर्ण और सार्वजनिक पाठ के अनुकूल रखी गई है। ‘अत्यन्त स्तुति के योग्य’ तथा ‘भययोग्य’ काव्यात्मक संक्षिप्तता और मूल के धार्मिक बल के बीच संतुलन रखते हैं।
