base_translation:
  language: en
  yaml_path: translation/ot/psalms/096/004.yaml
  text: For Yahweh is great and greatly to be praised[c][b][a]; he is to be feared above all gods.
translation:
  language: hi
  text: क्योंकि याहवे महान है और अत्यन्त स्तुति के योग्य है[a]; वह सब देवताओं से अधिक भय मानने योग्य है[b][c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “क्योंकि याहवे महान है और अत्यन्त प्रशंसित है।” इब्रानी निष्क्रिय कृदन्त का अधिक शाब्दिक भाव “बहुत प्रशंसित” है; मुख्य पाठ में इसे स्वाभाविक हिन्दी में “अत्यन्त स्तुति के योग्य” कहा गया है।
    reason: lexical_alternative
  - marker: b
    text: या, “विस्मयकारी” अथवा “भय उत्पन्न करनेवाला।” इब्रानी शब्द श्रद्धापूर्ण भय जगाने का भाव रखता है।
    reason: lexical_alternative
  - marker: c
    text: “देवताओं” से राष्ट्रों के देवता अभिप्रेत हो सकते हैं; अगला पद उन्हें व्यर्थ मूर्तियाँ बताता है।
    reason: cross_reference
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पद आसपास के आराधना-आह्वान का कारण बताता है; ‘क्योंकि’ उसके व्याख्यात्मक संबंध को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: גָדוֹל
  choice: महान
  rationale: यह शब्द प्रतिष्ठा और महिमा की महानता व्यक्त करता है; ‘महान’ सहज और पर्याप्त व्यापक है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय हिन्दी लिपि में लिप्यंतरित किया गया है।
- source_word: וּמְהֻלָּל מְאֹד
  choice: और अत्यन्त स्तुति के योग्य है
  rationale: निष्क्रिय कृदन्त का अधिक शाब्दिक अर्थ ‘बहुत स्तुति किया हुआ’ हो सकता है, पर इस स्तुतिगान में यह उस स्तुति को व्यक्त करता है जो याहवे को दी जानी चाहिए; चुना हुआ रूप स्वाभाविक हिन्दी में उसी बल को रखता है।
- source_word: נוֹרָא
  choice: भययोग्य
  rationale: यह रूप ऐसा भय और विस्मय उत्पन्न करने का भाव रखता है जो श्रद्धापूर्ण आराधना से जुड़ा है; ‘भययोग्य’ आधुनिक अर्थ में कमजोर पड़े ‘अद्भुत’ से अधिक निकट है।
- source_word: הוּא
  choice: वह … है
  rationale: इब्रानी का स्पष्ट सर्वनाम हिन्दी वाक्य में भी स्पष्ट रखा गया है।
- source_word: עַל כָּל אֱלֹהִים
  choice: सब देवताओं से बढ़कर
  rationale: यहाँ עַל श्रेष्ठता दर्शाता है। ‘देवताओं’ मूल की सीधी शब्दावली बनाए रखता है, जबकि ‘से बढ़कर’ स्वाभाविक हिन्दी में तुलना और श्रेष्ठता व्यक्त करता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा / प्रभु
  rationale: मूल पाठ में व्यक्तिगत ईश्वरीय नाम है; ‘याहवे’ उसे उपाधि से बदले बिना आधुनिक हिन्दी देवनागरी में प्रस्तुत करता है।
- issue: אֱלֹהִים का संदर्भगत अर्थ
  choice: देवताओं
  alternative: दैवी प्राणी / मूर्तियाँ
  rationale: पद स्वयं ‘देवताओं’ कहता है। अगला पद उनकी व्यर्थता स्पष्ट करता है, इसलिए यहाँ पहले से ‘मूर्तियाँ’ कहकर अर्थ को संकीर्ण नहीं किया गया।
- issue: נוֹרָא में भय और श्रद्धा का संबंध
  choice: भययोग्य
  alternative: विस्मयकारी / भयानक
  rationale: यह चयन श्रद्धापूर्ण भय की शक्ति बनाए रखता है, न तो उसे केवल आश्चर्य तक सीमित करता है और न आतंक का अनावश्यक भाव जोड़ता है।
