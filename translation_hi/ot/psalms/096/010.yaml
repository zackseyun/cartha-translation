source:
  edition: WLC
  text: אִמְר֤וּ בַ/גּוֹיִ֨ם יְה֘וָ֤ה מָלָ֗ךְ אַף תִּכּ֣וֹן תֵּ֭בֵל בַּל תִּמּ֑וֹט יָדִ֥ין עַ֝מִּ֗ים בְּ/מֵישָׁרִֽים׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/096/010.yaml
  text: Say among the nations[a], “Yahweh reigns! Indeed, the world is established; it shall not be moved[c][b]. He will judge the peoples with equity.”
translation:
  language: hi
  text: 'राष्ट्रों के बीच कहो,


    “याहवे राज्य करता है![a]


    सचमुच, जगत[b] स्थापित किया गया है;


    वह डगमगाएगा नहीं।


    वह लोगों का न्याय निष्पक्षता से[c] करेगा।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “याहवे राजा है!” अथवा “याहवे राजा हो गया है!” हिब्रू को वर्तमान राजत्व या राज्यारोहण की घोषणा के रूप में समझा जा सकता है।
    reason: alternative_reading
  - marker: b
    text: या “बसा हुआ संसार।”
    reason: lexical_alternative
  - marker: c
    text: या “खराई से” अथवा “न्यायपूर्वक।”
    reason: lexical_alternative
lexical_decisions:
- source_word: אִמְרוּ בַגּוֹיִם
  choice: राष्ट्रों के बीच कहो
  rationale: बहुवचन आज्ञार्थक क्रिया और בְ के सामाजिक-स्थानवाचक अर्थ को सीधे व्यक्त करता है; घोषणा राष्ट्रों के बीच की जानी है।
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत नाम चतुरक्षर का हिन्दी लिप्यंतरण है; इसे किसी उपाधि से नहीं बदला गया।
- source_word: מָלָךְ
  choice: राज्य करता है
  rationale: राजकीय घोषणा के प्रसंग में पूर्ण रूप वर्तमान राजत्व की उद्घोषणा व्यक्त कर सकता है; हिन्दी में यह स्वाभाविक और स्पष्ट है।
- source_word: אַף
  choice: सचमुच
  rationale: यह अगले कथन को बल देकर राजत्व की घोषणा से जोड़ता है।
- source_word: תִּכּוֹן
  choice: स्थिर किया गया है
  rationale: निफ़अल रूप के कर्मवाच्य और परिणामस्वरूप दृढ़ स्थापना—दोनों को बनाए रखता है।
- source_word: תֵּבֵל
  choice: जगत
  rationale: व्यवस्थित, बसा हुआ संसार इसका सामान्य काव्यात्मक अर्थ है; ‘जगत’ संक्षिप्त और गरिमापूर्ण है।
- source_word: בַּל תִּמּוֹט
  choice: वह डगमगाएगा नहीं
  rationale: מוֹט के अस्थिर होने या अपने स्थान से हिलने के भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: יָדִין עַמִּים
  choice: वह देश-देश के लोगों का न्याय ... करेगा
  rationale: דין का न्यायिक अर्थ सुरक्षित रहता है और עַמִּים को पहले आए גּוֹיִם से शब्दगत रूप से अलग रखते हुए अनेक जनसमूहों का भाव व्यक्त होता है।
- source_word: בְּמֵישָׁרִים
  choice: निष्पक्षता से
  rationale: न्याय के प्रसंग में सीधाई, खराई और समता के भाव को साधारण आधुनिक हिन्दी में स्पष्ट करता है।
theological_decisions:
- issue: יְהוָה परमेश्वर के नाम का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में व्यक्तिगत नाम है। लिप्यंतरण उसे उपाधि से बदलने के बजाय सुरक्षित रखता है।
- issue: राज्यारोहण-संबंधी घोषणा में מָלָךְ का काल-पक्ष
  choice: राज्य करता है
  alternative: राजा है; राजा हो गया है
  rationale: हिब्रू रूप वर्तमान राजत्व की घोषणा या राज्यारोहण की घोषणा—दोनों की ओर संकेत कर सकता है। मुख्य पाठ स्वाभाविक वर्तमान घोषणा देता है और पादटिप्पणी वास्तविक अस्पष्टता सुरक्षित रखती है।
- issue: विश्व की स्थिरता और ईश्वरीय राजत्व का संबंध
  choice: सचमुच, जगत स्थिर किया गया है
  alternative: हाँ, जगत दृढ़ता से स्थापित है
  rationale: אַף की बलात्मक कड़ी और כון के कर्मवाच्य परिणाम को बनाए रखा गया है, बिना स्थिरता की प्रकृति के बारे में अतिरिक्त धर्मवैज्ञानिक निष्कर्ष जोड़े।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में सरल, सार्वजनिक उद्घोषणा के योग्य और काव्यात्मक गरिमा वाली रखी गई है। पंक्ति-विन्यास हिब्रू कविता के विचार-खंडों को दिखाता है। ‘राष्ट्रों’ और ‘देश-देश के लोगों’ से גּוֹיִם तथा עַמִּים का शब्दगत भेद यथासंभव सुरक्षित है।
