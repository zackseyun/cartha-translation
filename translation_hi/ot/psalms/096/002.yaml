id: PSA.96.2
reference: Psalms 96:2
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: שִׁ֣ירוּ לַ֭/יהוָה בָּרֲכ֣וּ שְׁמ֑/וֹ בַּשְּׂר֥וּ מִ/יּֽוֹם לְ֝/י֗וֹם יְשׁוּעָתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/096/002.yaml
  text: Sing to Yahweh[a]; bless his name; proclaim his salvation from day to day.
translation:
  language: hi
  text: याहवे के लिए गाओ; उसके नाम को धन्य कहो; दिन-प्रतिदिन उसके उद्धार की घोषणा करो[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसके उद्धार का शुभ समाचार सुनाओ।”
    reason: בשׂר में केवल सामान्य घोषणा नहीं, बल्कि शुभ समाचार सुनाने का विशिष्ट भाव भी निहित हो सकता है।
lexical_decisions:
- source_word: שִׁירוּ
  choice: गाओ
  rationale: שׁיר का बहुवचन आज्ञार्थक रूप सीधे गाने का आह्वान करता है; मूल में कोई अतिरिक्त कर्म, जैसे ‘स्तुति’, नहीं है।
- source_word: לַיהוָה
  choice: याहवे के लिए
  rationale: ל गीत के संबोधन या समर्पण को सूचित करता है, और יְהוָה को उसके व्यक्तिगत वाचा-नाम ‘याहवे’ के रूप में रखा गया है।
- source_word: בָּרֲכוּ
  choice: धन्य कहो
  rationale: ברך के पिएल आज्ञार्थक का यह स्वाभाविक हिन्दी रूप है और ‘गाओ’ से इसकी शाब्दिक विशिष्टता बनाए रखता है।
- source_word: שְׁמוֹ
  choice: उसके नाम को
  rationale: यह 3 पुरुष एकवचन प्रत्यय सहित שׁם का सीधा रूप है; ‘नाम’ प्रतिष्ठा और प्रकट पहचान की बाइबलीय गूँज भी बनाए रखता है।
- source_word: בַּשְּׂרוּ
  choice: घोषणा करो
  rationale: בשׂר के पिएल आज्ञार्थक में सार्वजनिक रूप से शुभ समाचार सुनाने का भाव है। संक्षिप्त मुख्य पाठ में ‘घोषणा करो’ स्वाभाविक है, जबकि शुभ समाचार का विशेष भाव पाद-टिप्पणी में सुरक्षित है।
- source_word: מִיּוֹם לְיוֹם
  choice: दिन-प्रतिदिन
  rationale: यह निरंतर दैनिक पुनरावृत्ति व्यक्त करने वाले इब्रानी मुहावरे का निकट और स्वाभाविक हिन्दी रूप है।
- source_word: יְשׁוּעָתוֹ
  choice: उसके उद्धार
  rationale: יְשׁוּעָה उद्धार, छुटकारा या विजय को सूचित कर सकता है; आराधना के इस संदर्भ में ‘उद्धार’ सबसे व्यापक अर्थ सुरक्षित रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा / प्रभु
  rationale: मूल पाठ में चतुरक्षरीय व्यक्तिगत नाम सीधे प्रयुक्त है। ‘याहवे’ उसे सामान्य उपाधि में बदले बिना और किसी सांप्रदायिक व्याख्या को जोड़े बिना सुरक्षित रखता है।
- issue: יְשׁוּעָה का अर्थ-क्षेत्र
  choice: उद्धार
  alternative: छुटकारा / विजय
  rationale: संदर्भ किसी एक प्रकार के संकट या सैन्य विजय तक अर्थ सीमित नहीं करता; इसलिए व्यापक ‘उद्धार’ चुना गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामूहिक आराधना में सहज उच्चारण योग्य रखी गई है। तीनों आज्ञार्थक क्रियाओं की समानांतर लय और मूल पद का संक्षिप्त काव्यात्मक रूप सुरक्षित है।
