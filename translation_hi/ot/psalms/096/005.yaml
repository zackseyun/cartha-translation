- source_word: שָׁמַיִם
  choice: आकाश
  rationale: हिब्रू बहुवचन रूप आकाश/आकाशमण्डल के लिए प्रचलित है; हिन्दी में ‘आकाश’ इसका स्वाभाविक सामूहिक समतुल्य है।
- source_word: עָשָׂה
  choice: बनाया
  rationale: עשה का सीधा अर्थ ‘बनाना’ है; यह ‘सृजा’ की अपेक्षा मूल क्रिया की सामान्य व्यापकता को बनाए रखता है।
theological_decisions:
- issue: जातियों के देवताओं का स्वरूप
  choice: देवता मूर्तियाँ हैं
  alternative: देवता निकम्मी मूर्तियाँ हैं / कुछ भी नहीं हैं
  rationale: אֱלִילִים में मूर्तियों का सीधा अर्थ और उनके खोखलेपन का तिरस्कारपूर्ण संकेत दोनों संभव हैं। मुख्य पाठ प्रत्यक्ष अर्थ रखता है और तीव्रतर अर्थ को पादटिप्पणी में बताता है।
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: याहवे / प्रभु
  rationale: मूल पाठ में परमेश्वर का विशिष्ट नाम יהוה है। हिन्दी पाठकों के लिए सुस्थापित नामरूप ‘यहोवा’ नाम की विशिष्टता बनाए रखता है; उच्चारण की अनिश्चितता पादटिप्पणी में दी गई है।
- issue: ו का संबंध
  choice: परन्तु
  alternative: और
  rationale: दूसरे खंड में यहोवा के सृष्टिकर्ता होने और पहले खंड के देवताओं के मूर्ति होने के बीच स्पष्ट विरोध है, इसलिए प्रसंगानुसार विरोधसूचक अनुवाद चुना गया।
