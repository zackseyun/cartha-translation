source:
  edition: WLC
  text: לִ/פְנֵ֤י יְהוָ֨ה כִּ֬י בָ֗א כִּ֥י בָא֮ לִ/שְׁפֹּ֪ט הָ֫/אָ֥רֶץ יִשְׁפֹּֽט תֵּבֵ֥ל בְּ/צֶ֑דֶק וְ֝/עַמִּ֗ים בֶּ/אֱמוּנָתֽ/וֹ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/096/013.yaml
  text: before Yahweh[a], for he is coming, for he is coming to judge the earth. He will judge the world with righteousness[c][b], and the peoples with his faithfulness.
translation:
  language: hi
  text: यहोवा के सामने—क्योंकि वह आ रहा है, क्योंकि वह पृथ्वी का न्याय करने आ रहा है। वह संसार का धार्मिकता से और लोगों का अपनी विश्वासयोग्यता के अनुसार न्याय करेगा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לִפְנֵי
  choice: के सामने
  rationale: यह पदबंध ‘के सामने’ या ‘की उपस्थिति में’ का अर्थ देता है; ‘के सामने’ संक्षिप्त, स्वाभाविक और संबंधपरक भाव को सुरक्षित रखता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिन्दी में प्रचलित रूप ‘यहोवा’ परमेश्वर के व्यक्तिगत नाम को उपाधि से बदलने के बजाय नाम के रूप में प्रस्तुत करता है।
- source_word: כִּי בָא ... כִּי בָא
  choice: क्योंकि वह आ रहा है, क्योंकि वह ... आ रहा है
  rationale: काव्यात्मक प्रसंग में पूर्ण क्रिया आसन्न और निश्चित आगमन को सजीव रूप से व्यक्त करती है; हिन्दी वर्तमान प्रगतिशील रूप और मूल पुनरावृत्ति दोनों को बनाए रखता है।
- source_word: לִשְׁפֹּט
  choice: न्याय करने
  rationale: यद्यपि क्रिया में शासन का भाव भी हो सकता है, आगे धार्मिकता और विश्वासयोग्यता का उल्लेख न्यायिक अर्थ को प्रमुख बनाता है।
- source_word: הָאָרֶץ
  choice: पृथ्वी
  rationale: ‘संसार’ के समानांतर होने के कारण यहाँ किसी विशेष देश के बजाय समस्त पृथ्वी अभिप्रेत है।
- source_word: תֵּבֵל
  choice: संसार
  rationale: यह शब्द व्यवस्थित अथवा आबाद जगत को सूचित करता है; ‘संसार’ स्वाभाविक हिन्दी समतुल्य है।
- source_word: בְּצֶדֶק
  choice: धार्मिकता से
  rationale: यह न्याय के नैतिक रूप से सही और निष्पक्ष चरित्र को व्यक्त करता है तथा मूल संज्ञा צֶדֶק के निकट रहता है।
- source_word: וְעַמִּים
  choice: लोगों
  rationale: बहुवचन עַמִּים अनेक जनसमूहों को सामूहिक रूप से दर्शाता है; ‘लोगों’ इसे सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: בֶּאֱמוּנָתוֹ
  choice: अपनी विश्वासयोग्यता से
  rationale: אֱמוּנָה यहाँ दृढ़ विश्वसनीयता और निष्ठा को दर्शाता है; यह अनुवाद परमेश्वर के न्याय की भरोसेमंदता को व्यक्त करता है।
theological_decisions:
- issue: काव्यात्मक प्रसंग में ईश्वरीय न्याय का स्वरूप
  choice: ‘न्याय’ की भाषा को यथावत रखना
  alternative: इसे केवल ‘शासन करना’ कहना या अंतिम न्याय के विस्तृत सिद्धान्त के रूप में खोलना
  rationale: पद सार्वभौमिक न्याय की घोषणा करता है, पर अनुवाद को न तो उसका न्यायिक भाव नरम करना चाहिए और न मूल पाठ से अधिक धर्मवैज्ञानिक विस्तार जोड़ना चाहिए।
- issue: यְהוָה का निरूपण
  choice: यहोवा
  alternative: प्रभु अथवा याहवे
  rationale: व्यक्तिगत ईश्वरीय नाम को हिन्दी के परिचित नामरूप में रखना, उसे केवल उपाधि से प्रतिस्थापित नहीं करता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। मूल की पुनरावृत्ति सुरक्षित है, पर दूसरी बार ‘पृथ्वी का न्याय करने’ को क्रिया के साथ जोड़कर हिन्दी वाक्य को स्वाभाविक बनाया गया है।
