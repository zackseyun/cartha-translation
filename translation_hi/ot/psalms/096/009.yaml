id: PSA.96.9
reference: Psalms 96:9
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: הִשְׁתַּחֲו֣וּ לַ֭/יהוָה בְּ/הַדְרַת קֹ֑דֶשׁ חִ֥ילוּ מִ֝/פָּנָ֗י/ו כָּל הָ/אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/096/009.yaml
  text: Worship Yahweh in the splendor of holiness; tremble before him[a], all the earth.
translation:
  language: hi
  text: पवित्रता के वैभव में याहवे को दण्डवत करो[a]; हे सारी पृथ्वी, उसके सामने थरथराओ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “पवित्र वेशभूषा में” अथवा “पवित्र वैभव में।” इब्रानी पदबंध पवित्रता से जुड़े वैभव या आराधना के समय पहने गए पवित्र वस्त्रों अथवा अलंकरण—दोनों का बोध करा सकता है।
    reason: इब्रानी पदबंध בְּהַדְרַת קֹדֶשׁ की वास्तविक अर्थगत अस्पष्टता को बनाए रखना।
lexical_decisions:
- source_word: הִשְׁתַּחֲווּ
  choice: दण्डवत करो
  rationale: यह क्रिया श्रद्धापूर्वक झुकने या भूमि पर गिरकर आराधना करने को व्यक्त करती है। ‘दण्डवत करो’ उसके शारीरिक भाव और आराधनात्मक आशय दोनों को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: לַיהוָה
  choice: याहवे को
  rationale: यह इब्रानी चतुरक्षरीय दिव्य नाम יְהוָה है; ‘याहवे’ उसका प्रचलित विद्वत्तापूर्ण लिप्यंतरण है और मूल पाठ में आए व्यक्तिगत वाचा-नाम को बनाए रखता है।
- source_word: בְּהַדְרַת קֹדֶשׁ
  choice: पवित्रता के वैभव में
  rationale: הֲדָר वैभव, शोभा या अलंकरण का बोध कराता है और קֹדֶשׁ पवित्रता का। मुख्य पाठ व्यापक काव्यात्मक अर्थ रखता है; पवित्र वेशभूषा अथवा अलंकरण का संभावित अर्थ पादटिप्पणी में दिया गया है।
- source_word: חִילוּ
  choice: थरथराओ
  rationale: यह क्रिया काँपने, भय या तीव्र व्याकुलता से हिल उठने का भाव रखती है। यहाँ ‘थरथराओ’ दिव्य उपस्थिति के सामने विस्मय और भय की तीव्रता व्यक्त करता है, बिना पीड़ा का अर्थ अनिवार्य किए।
- source_word: מִפָּנָיו
  choice: उसके सामने
  rationale: शाब्दिक भाव ‘उसके मुख/उपस्थिति के सामने’ है। ‘उसके सामने’ स्वाभाविक हिन्दी में दिव्य उपस्थिति का आशय बनाए रखता है।
- source_word: כָּל־הָאָרֶץ
  choice: हे सारी पृथ्वी
  rationale: भजन का आह्वान विश्वव्यापी है। सम्बोधनसूचक ‘हे’ वाक्य में पृथ्वी को सीधे संबोधित किए जाने को स्पष्ट करता है।
theological_decisions:
- issue: दिव्य नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: प्रभु; यहोवा
  rationale: मूल पाठ व्यक्तिगत दिव्य नाम का सीधे प्रयोग करता है। ‘याहवे’ उसे किसी उपाधि से बदलने के बजाय नाम के रूप में सुरक्षित रखता है और ‘यहोवा’ की अपेक्षा इब्रानी उच्चारण के विद्वत्तापूर्ण पुनर्निर्माण के अधिक निकट है।
- issue: בְּהַדְרַת קֹדֶשׁ का आशय
  choice: पवित्रता के वैभव में
  alternative: पवित्र वेशभूषा में; पवित्र वैभव में
  rationale: इब्रानी पदबंध पवित्रता से संबंधित वैभव या आराधकों के पवित्र अलंकरण/वेशभूषा—दोनों की ओर संकेत कर सकता है। मुख्य पाठ व्यापक काव्यात्मक अर्थ देता है और वैकल्पिक अर्थ को पादटिप्पणी में सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और काव्यात्मक रखी गई है। ‘दण्डवत करो’ मूल क्रिया की शारीरिक तथा आराधनात्मक शक्ति बनाए रखता है; ‘थरथराओ’ विस्मयपूर्ण भय की तीव्रता व्यक्त करता है।
