id: PSA.96.12
reference: Psalms 96:12
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: יַעֲלֹ֣ז שָׂ֭דַי וְ/כָל אֲשֶׁר בּ֑/וֹ אָ֥ז יְ֝רַנְּנ֗וּ כָּל עֲצֵי יָֽעַר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/096/012.yaml
  text: Let the field exult[a], and all that is in it; then all the trees of the forest will sing for joy.
translation:
  language: hi
  text: खेत और उसमें जो कुछ है, सब आनन्दित हों; तब वन के सारे वृक्ष आनन्द से गा उठेंगे[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “आनन्द से जयजयकार करेंगे।”
    reason: इब्रानी क्रिया ऊँचे स्वर में हर्ष व्यक्त करने या जयजयकार करने का अर्थ भी दे सकती है।
lexical_decisions:
- source_word: יַעֲלֹז
  choice: आनन्दित हों
  rationale: यह क्रिया प्रबल हर्ष व्यक्त करती है और यहाँ इच्छार्थक/आह्वानात्मक भाव में है। ‘आनन्दित हों’ उस भाव को स्वाभाविक आधुनिक हिन्दी में बनाए रखता है।
- source_word: שָׂדַי
  choice: खेत
  rationale: एकवचन रूप यहाँ सामूहिक अर्थ में खुले खेत या कृषिक्षेत्र को दर्शाता है। ‘खेत’ संक्षिप्त, सहज और काव्यात्मक मानवीकरण के अनुकूल है।
- source_word: וְכָל אֲשֶׁר בּוֹ
  choice: और उसमें जो कुछ है, सब
  rationale: यह खेत में विद्यमान सभी वस्तुओं और प्राणियों को समेटता है। हिन्दी वाक्य-विन्यास में ‘सब’ जोड़ने से समग्रता और साझा क्रिया स्पष्ट होती है।
- source_word: אָז
  choice: तब
  rationale: यह अगले काव्यात्मक दृश्य या परिणामी प्रतिक्रिया की ओर बढ़ने का संकेत देता है।
- source_word: יְרַנְּנוּ
  choice: आनन्द से गा उठेंगे
  rationale: पिएल रूप ऊँचे स्वर में हर्ष प्रकट करने को दर्शाता है। वृक्षों के काव्यात्मक मानवीकरण के संदर्भ में ‘गा उठेंगे’ स्वाभाविक है, जबकि जयजयकार का अर्थ भी संभव है।
- source_word: כָּל עֲצֵי יָעַר
  choice: वन के सारे वृक्ष
  rationale: यह रचना-संबंध और כָל की समग्रता दोनों को सहज हिन्दी में सुरक्षित रखता है।
theological_decisions:
- issue: सृष्टि का स्तुतिपूर्ण मानवीकरण
  choice: खेत और वृक्षों को सीधे आनन्दित होते और गाते हुए प्रस्तुत किया गया है।
  alternative: इसे केवल प्रकृति की सुंदरता या मनुष्यों के आनन्द के रूपक के रूप में समझाकर अनुवाद करना।
  rationale: मूल पद निर्जीव और गैर-मानवीय सृष्टि को प्रत्यक्ष रूप से आनन्द में सहभागी दिखाता है। इस काव्यात्मक तनाव को बिना व्याख्यात्मक रूप से सीमित किए बनाए रखना उचित है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और काव्यात्मक शैली रखी गई है। पहले खंड को हिन्दी में स्वाभाविक बनाने के लिए संयुक्त कर्ता-विन्यास अपनाया गया है, जबकि मूल का आह्वानात्मक भाव और दूसरे खंड का भावी ‘तब’ सुरक्षित है।
