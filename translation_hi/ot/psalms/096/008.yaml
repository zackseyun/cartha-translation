base_translation:
  language: en
  yaml_path: translation/ot/psalms/096/008.yaml
  text: Ascribe to Yahweh the glory of his name[a]; bring an offering and come into his courts.
translation:
  language: hi
  text: याहवे को उसके नाम की महिमा दो; भेंट[a] लेकर उसके प्रांगणों में आओ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘उपहार’ अथवा ‘कर-स्वरूप भेंट’। इब्रानी शब्द प्रसंग के अनुसार उपहार, कर या उपासना में चढ़ाई जाने वाली भेंट को दर्शा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הָבוּ
  choice: दो
  rationale: बहुवचन आज्ञार्थक क्रिया का सीधा अर्थ ‘दो’ है। यहाँ इसका आशय याहवे की महिमा को स्वीकार करके उसका गुणगान करना है; हिन्दी में ‘महिमा दो’ भजन-साहित्य की संक्षिप्तता और आज्ञार्थक बल बनाए रखता है।
- source_word: לַיהוָה
  choice: याहवे को
  rationale: मूल पाठ में परमेश्वर का व्यक्तिवाचक वाचा-नाम יהוה है; इसे उपाधि से बदलने के बजाय ‘याहवे’ के रूप में प्रस्तुत किया गया है।
- source_word: כְּבוֹד שְׁמוֹ
  choice: उसके नाम की महिमा
  rationale: यह अनुवाद इब्रानी संबंधसूचक रचना को सीधे बनाए रखता है और ‘नाम’ में निहित चरित्र व प्रतिष्ठा के अर्थ को पाठ में विस्तार देकर सीमित नहीं करता।
- source_word: שְׂאוּ מִנְחָה
  choice: भेंट लेकर
  rationale: נשׂא का मूल भाव उठाने या ले चलने का है, पर מִנְחָה के साथ इसका स्वाभाविक अर्थ भेंट लेकर आने का है। ‘लेकर’ अगले क्रियापद ‘आओ’ से सहज रूप से जुड़ता है।
- source_word: מִנְחָה
  choice: भेंट
  rationale: यह शब्द उपहार, कर-स्वरूप भेंट या उपासना की भेंट बता सकता है। इस उपासना-संदर्भ में ‘भेंट’ व्यापक और स्वाभाविक है तथा इसे अनावश्यक रूप से अन्नबलि तक सीमित नहीं करता।
- source_word: וּבֹאוּ לְחַצְרוֹתָיו
  choice: उसके आँगनों में आओ
  rationale: חֲצֵרוֹת बहुवचन में पवित्रस्थान के खुले प्रांगणों को दर्शाता है। ‘आँगनों’ सामान्य आधुनिक हिन्दी में बोधगम्य है और ‘में आओ’ प्रवेश की दिशा स्पष्ट करता है।
theological_decisions:
- issue: יהוה परमेश्वर के नाम का अनुवाद
  choice: याहवे
  alternative: प्रभु / यहोवा
  rationale: मूल में वाचा-नाम स्पष्ट रूप से उपस्थित है। उसका लिप्यंतरण नाम और उपाधि के बीच का भेद बनाए रखता है; ‘याहवे’ प्रचलित विद्वत् पुनर्निर्मित उच्चारण के निकट है।
- issue: כְּבוֹד שְׁמוֹ में संबंध
  choice: उसके नाम की महिमा
  alternative: उसके नाम के योग्य महिमा
  rationale: मूल पाठ में ‘योग्य’ जैसा स्पष्ट शब्द नहीं है। यद्यपि वह अर्थ प्रसंग में निहित हो सकता है, मुख्य पाठ में संबंधसूचक वाक्यांश को बनाए रखने से मूल की संक्षिप्तता और अर्थगत खुलापन सुरक्षित रहता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामूहिक उपासना में सहज पाठ के योग्य रखी गई है। ‘महिमा दो’ इब्रानी काव्य-सूत्र की संक्षिप्तता बनाए रखता है, जबकि ‘भेंट लेकर … आओ’ हिन्दी में स्वाभाविक क्रियात्मक प्रवाह देता है।
