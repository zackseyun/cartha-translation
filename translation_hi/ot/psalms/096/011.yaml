id: PSA.96.11
reference: Psalms 96:11
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: יִשְׂמְח֣וּ הַ֭/שָּׁמַיִם וְ/תָגֵ֣ל הָ/אָ֑רֶץ יִֽרְעַ֥ם הַ֝/יָּ֗ם וּ/מְלֹאֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/096/011.yaml
  text: Let the heavens rejoice[a], and let the earth be glad; let the sea thunder, and all that fills it.
translation:
  language: hi
  text: आकाश आनन्द करे और पृथ्वी मगन हो; समुद्र गरजे[a], और वह सब भी जो उसमें भरा है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “समुद्र और उसमें जो कुछ है, गर्जना करें।”
    reason: רעם और וּמְלֹאוֹ के संयुक्त काव्यात्मक चित्र को अधिक स्पष्ट, किंतु कुछ कम शाब्दिक, ढंग से व्यक्त करने वाला विकल्प।
lexical_decisions:
- source_word: יִשְׂמְחוּ
  choice: आनन्द करे
  rationale: שׂמח के क़ाल अपूर्ण रूप को स्तुति के इस आह्वानात्मक क्रम में भविष्यवाणी के बजाय इच्छार्थक भाव में प्रस्तुत किया गया है।
- source_word: הַשָּׁמַיִם
  choice: आकाश
  rationale: द्विवचन/बहुवचन रूप यहाँ समूचे आकाशीय क्षेत्र को दर्शाता है; आधुनिक हिन्दी में ‘आकाश’ स्वाभाविक और काव्यात्मक है।
- source_word: וְתָגֵל
  choice: और ... मगन हो
  rationale: גיל उल्लास और हर्ष व्यक्त करता है। ‘मगन हो’ पहले खंड के ‘आनन्द करे’ से काव्यात्मक भिन्नता बनाए रखता है।
- source_word: הָאָרֶץ
  choice: पृथ्वी
  rationale: आकाश, पृथ्वी और समुद्र के विश्वव्यापी क्रम में अर्थ ‘देश’ नहीं, ‘पृथ्वी’ है।
- source_word: יִרְעַם
  choice: गरजे
  rationale: רעם का अर्थ गरजना या गूँजता हुआ प्रचंड शब्द करना है। ‘गरजे’ समुद्र की ध्वनि और उसके मानवीकरण, दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: הַיָּם
  choice: समुद्र
  rationale: ים का सामान्य और प्रसंगानुकूल हिन्दी रूप ‘समुद्र’ है।
- source_word: וּמְלֹאוֹ
  choice: और वह सब भी जो उसमें भरा है
  rationale: शाब्दिक अर्थ ‘और उसकी भरपूरी’ है; यह मुहावरा समुद्र में विद्यमान सभी वस्तुओं और जीवों को समेटता है। चुना गया रूप इस ठोस बिंब को आधुनिक हिन्दी में स्पष्ट रखता है।
theological_decisions:
- issue: काव्यात्मक अपूर्ण क्रियाओं का इच्छार्थक या भविष्यसूचक बल
  choice: 'क्रम को आह्वान के रूप में प्रस्तुत किया गया है: ‘आकाश आनन्द करे ... समुद्र गरजे।’'
  alternative: 'भविष्यसूचक रूप: ‘आकाश आनन्द करेगा ... समुद्र गरजेगा।’'
  rationale: भजन का निकटवर्ती संदर्भ समस्त सृष्टि को आनन्द और स्तुति के लिए बुलाता है; इसलिए इच्छार्थक प्रयोग भाषिक और प्रसंगगत रूप से अधिक उपयुक्त है, जबकि भविष्यसूचक संभावना को कोई अतिरिक्त धर्मवैज्ञानिक निष्कर्ष जोड़कर नहीं चुना गया।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सहज और काव्यात्मक स्तर रखा गया है। ‘आनन्द करे’ और ‘मगन हो’ समानांतरता के भीतर हिब्रू क्रियाओं की भिन्न छटा बनाए रखते हैं।
