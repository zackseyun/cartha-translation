    reason: alternative_reading
lexical_decisions:
- source_word: שִׁירוּ
  choice: गाओ
  rationale: यह שׁיר का बहुवचन आज्ञार्थक रूप है और सीधे अनेक श्रोताओं को गाने के लिए बुलाता है। हिंदी में ‘गाओ’ स्वाभाविक और अर्थानुकूल है; ‘स्तुति गाओ’ कहने से मूल में निहित न होने वाला कर्म जुड़ जाता।
- source_word: לַיהוָה
  choice: याहवेह के लिए
  rationale: ל यहाँ गीत की दिशा या संबोधन का लक्ष्य बताता है। ‘के लिए’ वर्तमान हिंदी में स्वाभाविक है और परमेश्वर के नाम को लिप्यंतरित रूप में सुरक्षित रखता है।
- source_word: שִׁיר חָדָשׁ
  choice: नया गीत
  rationale: שִׁיר का सामान्य अर्थ ‘गीत’ और חָדָשׁ का सामान्य अर्थ ‘नया’ है। हिंदी में अनिश्चित उपपद की आवश्यकता नहीं होती।
- source_word: כָּל הָאָרֶץ
  choice: हे सारी पृथ्वी के लोगो
  rationale: शाब्दिक रूप ‘सारी पृथ्वी’ है, पर गाने की आज्ञा लोगों को संबोधित करती है। संबोधन को हिंदी में स्पष्ट और स्वाभाविक बनाने के लिए ‘के लोगो’ जोड़ा गया है, जबकि विश्वव्यापी विस्तार सुरक्षित है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का रूप
  choice: याहवेह
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में चार अक्षरों वाला व्यक्तिगत ईश्वरीय नाम सीधे आता है। ‘याहवेह’ संभावित प्राचीन उच्चारण का हिंदी लिप्यंतरण है; इसे ‘प्रभु’ से बदलने पर नाम और उपाधि का भेद मिट जाता, जबकि ‘यहोवा’ बाद की मिश्रित स्वर-परंपरा को दर्शाता है।
translation_notes:
  register: भाषा आधुनिक, सरल और आराधनापूर्ण रखी गई है। मूल की दोहरावपूर्ण काव्यात्मक आज्ञा सुरक्षित है। ‘हे सारी पृथ्वी के लोगो’ में संबोधन स्पष्ट किया गया है ताकि हिंदी पाठक निर्जीव पृथ्वी को गाने की अस्वाभाविक आज्ञा न समझें।
