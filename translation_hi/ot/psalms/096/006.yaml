  text: Splendor and majesty are before him[a]; strength and beauty are in his sanctuary.
translation:
  language: hi
  text: वैभव और महिमा उसके सामने हैं; सामर्थ्य और शोभा[a] उसके पवित्र स्थान में हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘शोभा’ के लिए इब्रानी शब्द का अनुवाद ‘वैभव’ या ‘महिमा’ भी किया जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹד
  choice: वैभव
  rationale: यह शब्द भव्यता, गौरव और राजसी दीप्ति का बोध कराता है। ‘वैभव’ काव्यात्मक जोड़ी में स्वाभाविक है और הָדָר से भेद बनाए रखता है।
- source_word: הָדָר
  choice: प्रताप
  rationale: यहाँ राजसी गरिमा और महिमा का भाव है। ‘प्रताप’ ‘वैभव’ के साथ स्वाभाविक काव्यात्मक युग्म बनाता है।
- source_word: לְפָנָיו
  choice: उसके सामने
  rationale: यह इब्रानी के स्थानिक और उपस्थिति-संबंधी बिंब को सीधे बनाए रखता है; हिंदी में निहित क्रिया को ‘हैं’ से स्पष्ट किया गया है।
- source_word: עֹז
  choice: सामर्थ्य
  rationale: यह शक्ति या बल का सामान्य अर्थ व्यक्त करता है और पद के गरिमामय काव्यात्मक स्तर के अनुकूल है।
- source_word: תִפְאֶרֶת
  choice: शोभा
  rationale: इस शब्द में शोभा, महिमा और वैभव की अर्थ-छायाएँ हैं। ‘शोभा’ यहाँ ‘सामर्थ्य’ के साथ संतुलित है और पहले चरण के ‘वैभव’ की पुनरावृत्ति से बचाती है।
- source_word: בְּמִקְדָּשׁוֹ
  choice: उसके पवित्रस्थान में
  rationale: מִקְדָּשׁ किसी पवित्र स्थान या पवित्र धाम को दर्शाता है। ‘पवित्रस्थान’ मंदिर को अनावश्यक रूप से विशिष्ट किए बिना पवित्र स्थान का भाव सुरक्षित रखता है।
theological_decisions:
- issue: सर्वनाम-प्रत्ययों का संदर्भ
  choice: ‘उसके’ सर्वनाम को बनाए रखा गया है; संदर्भ में यह यहोवा की ओर संकेत करता है।
  alternative: सर्वनाम के स्थान पर ‘यहोवा’ को स्पष्ट रूप से लिखना।
  rationale: इब्रानी पद में ईश्वरीय नाम दुबारा नहीं आया है। सर्वनाम बनाए रखने से मूल की काव्यात्मक गति सुरक्षित रहती है, जबकि आसपास का संदर्भ उसके अभिप्राय को स्पष्ट करता है।
- issue: תִפְאֶרֶת की अर्थ-व्याप्ति
  choice: मुख्य पाठ में ‘शोभा’।
  alternative: ‘वैभव’ या ‘महिमा’।
  rationale: शब्द की वास्तविक अर्थगत व्यापकता को मुख्य पाठ में एक स्वाभाविक हिंदी विकल्प से व्यक्त किया गया है और अन्य संभव अर्थों को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिंदी में संक्षिप्त, गरिमामय और काव्यात्मक शैली। ‘वैभव और प्रताप’ तथा ‘सामर्थ्य और शोभा’ समानांतर पदबंधों को बनाए रखते हैं।
