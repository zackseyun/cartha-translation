base_translation:
  language: en
  yaml_path: translation/ot/psalms/098/001.yaml
  text: A psalm. Sing to Yahweh a new song[a], for he has done wondrous things; his right hand and his holy arm have worked salvation for him.
translation:
  language: hi
  text: 'भजन।

    यहोवा के लिए एक नया गीत गाओ,

    क्योंकि उसने अद्भुत कार्य किए हैं;

    उसके दाहिने हाथ और उसकी पवित्र भुजा ने

    उसके लिए विजय प्राप्त की है।[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या, अधिक शाब्दिक रूप से: “उसे बचाया है,” “उसके लिए उद्धार किया है,” या “उसके लिए उद्धार प्राप्त किया है।” इब्रानी पदबंध का अभिप्राय है कि यहोवा की अपनी सामर्थ्य ने उद्धार या विजय संपन्न की है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִזְמוֹר
  choice: भजन
  rationale: यह शीर्षक या रचना-प्रकार का संकेत है; आधुनिक हिन्दी बाइबल और उपासना-भाषा में ‘भजन’ स्पष्ट तथा स्वाभाविक है।
- source_word: שִׁירוּ לַיהוָה
  choice: यहोवा के लिए ... गाओ
  rationale: बहुवचन आज्ञार्थक क्रिया को सीधे ‘गाओ’ से व्यक्त किया गया है; ל को गीत के अभिप्रेत प्राप्तकर्ता के अर्थ में ‘के लिए’ रखा गया है।
- source_word: שִׁיר חָדָשׁ
  choice: एक नया गीत
  rationale: मूल पदबंध का सीधा, स्वाभाविक और काव्यात्मक हिन्दी रूप।
- source_word: נִפְלָאוֹת עָשָׂה
  choice: उसने अद्भुत काम किए हैं
  rationale: נִפְלָאוֹת विस्मय उत्पन्न करने वाले कार्यों को दर्शाता है; पूर्ण क्रिया को वर्तमान महत्त्व सहित हिन्दी पूर्णकाल में रखा गया है।
- source_word: הוֹשִׁיעָה לּוֹ
  choice: उसके लिए उद्धार सिद्ध किया है
  rationale: यह रूप शाब्दिक ‘उसके लिए उद्धार किया/पाया’ के निकट रहते हुए इस भाव को व्यक्त करता है कि यहोवा की अपनी सामर्थ्य ने उद्धार अथवा विजय को संपन्न किया।
- source_word: יְמִינוֹ וּזְרוֹעַ קָדְשׁוֹ
  choice: उसके दाहिने हाथ और उसकी पवित्र भुजा
  rationale: ईश्वरीय सामर्थ्य और सक्रिय हस्तक्षेप की समानांतर काव्यात्मक छवियों को बिना व्याख्यात्मक विस्तार के सुरक्षित रखा गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का रूप
  choice: यहोवा
  alternative: याहवे
  rationale: हिन्दी में व्यापक रूप से पहचाने जाने वाले नामरूप ‘यहोवा’ का प्रयोग किया गया है; इसे सामान्य उपाधि ‘प्रभु’ से बदलकर मूल के व्यक्तिगत नाम को छिपाया नहीं गया।
- issue: הוֹשִׁיעָה לּוֹ का अर्थ
  choice: उसके लिए उद्धार सिद्ध किया है
  alternative: उसे बचाया है; उसके लिए विजय प्राप्त की है
  rationale: मूल इब्रानी अभिव्यक्ति असामान्य रूप से ‘उसके लिए बचाया/उद्धार किया’ कहती है। चुना हुआ रूप उद्धार की धारणा और לּוֹ (‘उसके लिए’) दोनों को बनाए रखता है तथा यह स्पष्ट करता है कि यहोवा की अपनी शक्ति ने इसे संपन्न किया, बिना केवल सैन्य ‘विजय’ तक अर्थ सीमित किए।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और गेय काव्य-पंक्तियाँ रखी गई हैं। ‘दाहिना हाथ’ और ‘पवित्र भुजा’ की मानवरूपी काव्य-छवियाँ यथावत हैं। कोई पादटिप्पणी आवश्यक नहीं मानी गई, क्योंकि अंतिम पदबंध में मूल की संरचना पर्याप्त रूप से दिखाई देती है।
