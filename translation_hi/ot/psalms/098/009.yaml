  text: לִֽ/פְֽנֵי יְהוָ֗ה כִּ֥י בָא֮ לִ/שְׁפֹּ֪ט הָ֫/אָ֥רֶץ יִשְׁפֹּֽט תֵּבֵ֥ל בְּ/צֶ֑דֶק וְ֝/עַמִּ֗ים בְּ/מֵישָׁרִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/098/009.yaml
  text: before Yahweh[a], for he comes to judge the earth; he will judge the world with righteousness[e][d][c][b], and the peoples with equity.
translation:
  language: hi
  text: याहवे[a] के सामने[b], क्योंकि वह पृथ्वी का न्याय करने आ रहा है[c]; वह धार्मिकता से जगत[d] का न्याय करेगा और निष्पक्षता से लोगों का न्याय करेगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में יהוה (YHWH), परमेश्वर का व्यक्तिगत नाम; इसका लिप्यंतरण ‘याहवे’ किया गया है।
    reason: alternative_reading
  - marker: b
    text: या, ‘याहवे की उपस्थिति में।’
    reason: lexical_alternative
  - marker: c
    text: या, ‘क्योंकि वह पृथ्वी का न्याय करने आता है।’ इब्रानी काव्य में यह रूप आसन्न अथवा निश्चित कार्य को व्यक्त कर सकता है।
    reason: lexical_alternative
  - marker: d
    text: अर्थात् ‘बसा हुआ संसार।’
    reason: lexical_alternative
lexical_decisions:
- source_word: לִפְנֵי
  choice: के सामने
  rationale: यह पदबंध स्थान और संबंध—दोनों की दृष्टि से ‘के सामने’ अथवा ‘की उपस्थिति में’ का अर्थ देता है। ‘के सामने’ संक्षिप्त, स्वाभाविक और काव्यात्मक है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम יהוה को उपाधि से बदलने के बजाय आधुनिक हिन्दी लिप्यंतरण ‘याहवे’ से प्रस्तुत किया गया है।
- source_word: כִּי בָא
  choice: क्योंकि वह ... करने आ रहा है
  rationale: כִּי पिछले आह्वान का कारण बताता है, और काव्य में בָא निकट अथवा निश्चित आगमन को सजीव रूप से व्यक्त कर सकता है।
- source_word: לִשְׁפֹּט / יִשְׁפֹּט
  choice: न्याय करने / न्याय करेगा
  rationale: שׁפט में न्याय करने और शासन द्वारा उचित व्यवस्था स्थापित करने का व्यापक भाव है; यहाँ ‘न्याय’ सबसे सीधा है और निंदा तथा प्रतिपादन—दोनों संभावनाओं को खुला रखता है।
- source_word: הָאָרֶץ
  choice: पृथ्वी
  rationale: ‘जगत’ और ‘लोगों’ के समानांतर होने के कारण यहाँ स्थानीय ‘देश’ नहीं, बल्कि सारी पृथ्वी अभिप्रेत है।
- source_word: תֵּבֵל
  choice: जगत
  rationale: यह शब्द विशेषतः बसे हुए संसार को सूचित कर सकता है; ‘जगत’ हिन्दी काव्य में स्वाभाविक और व्यापक है।
- source_word: בְּצֶדֶק
  choice: धार्मिकता से
  rationale: בְ यहाँ रीति या मानदंड बताता है। ‘धार्मिकता से’ न्याय के नैतिक रूप से सही और न्यायपूर्ण चरित्र को बनाए रखता है।
- source_word: עַמִּים
  choice: लोगों
  rationale: बहुवचन עַמִּים अलग-अलग जनसमूहों को दर्शाता है। ‘लोगों’ से यह अर्थ ‘राष्ट्रों’ की अपेक्षा अधिक सीधे और सामान्य हिन्दी में व्यक्त होता है।
- source_word: בְּמֵישָׁרִים
  choice: निष्पक्षता से
  rationale: यह बहुवचन संज्ञा सीधेपन, समानता और न्यायोचित व्यवहार का भाव रखती है। न्यायिक प्रसंग में ‘निष्पक्षता से’ सर्वाधिक स्पष्ट और स्वाभाविक है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ व्यक्तिगत ईश्वरीय नाम का प्रयोग करता है। ‘याहवे’ नाम को नाम के रूप में बनाए रखता है और उसे किसी उपाधि से नहीं बदलता।
- issue: בָא का कालगत भाव
  choice: करने आ रहा है
  alternative: करने आता है; करने आ चुका है
  rationale: काव्यात्मक पूर्ण रूप आसन्न अथवा निश्चित घटना को व्यक्त कर सकता है। वर्तमान प्रगतिशील हिन्दी इस सजीव आसन्नता को रखती है, जबकि पादटिप्पणी अन्य संभव कालगत समझ बताती है।
- issue: שׁפט में ईश्वरीय न्याय का स्वरूप
  choice: न्याय करना
  alternative: शासन करना; निर्दोष ठहराना
  rationale: ‘न्याय करना’ मूल शब्द के व्यापक न्यायिक भाव को बनाए रखता है और यह पहले से तय नहीं करता कि परिणाम केवल दंड, उद्धार अथवा शासन होगा।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सार्वजनिक पाठ के योग्य रखी गई है। समानांतर काव्य-पंक्तियों में ‘पृथ्वी—जगत—लोगों’ तथा ‘धार्मिकता—निष्पक्षता’ का संतुलन बनाए रखा गया है।
