  text: זָ֘כַ֤ר חַסְדּ֨/וֹ וֶֽ/אֱֽמוּנָת/וֹ֮ לְ/בֵ֪ית יִשְׂרָ֫אֵ֥ל רָא֥וּ כָל אַפְסֵי אָ֑רֶץ אֵ֝֗ת יְשׁוּעַ֥ת אֱלֹהֵֽי/נוּ׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/098/003.yaml
  text: He has remembered his steadfast love and his faithfulness to the house of Israel[a]; all the ends of the earth have seen the salvation of our God.
translation:
  language: hi
  text: उसने इस्राएल के घराने के प्रति अपने अटल प्रेम और अपनी विश्वासयोग्यता को याद रखा है; पृथ्वी के सभी छोरों ने हमारे परमेश्वर का उद्धार[a] देखा है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘छुटकारा’; भजन के प्रसंग में इब्रानी शब्द विजयी रीति से बचाने के कार्य का भाव भी रख सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: זָכַר
  choice: याद रखा है
  rationale: काल रूप पूर्ण किए गए कार्य को दिखाता है जिसका प्रभाव वर्तमान स्तुति में बना हुआ है। ‘याद रखा है’ मूल क्रिया के सामान्य अर्थ को स्वाभाविक आधुनिक हिन्दी में रखता है और प्रसंग में अपने प्रेम के अनुसार कार्य करने का भाव भी ग्रहण कर सकता है।
- source_word: חַסְדּוֹ
  choice: अपने अटल प्रेम
  rationale: חֶסֶד यहाँ स्थायी, निष्ठावान और वाचा-संबंधी प्रेम का भाव रखता है। ‘अटल प्रेम’ इसे केवल दया तक सीमित किए बिना स्पष्ट और सहज हिन्दी में व्यक्त करता है।
- source_word: וֶאֱמוּנָתוֹ
  choice: और अपनी विश्वासयोग्यता
  rationale: यह शब्द חֶסֶד के समानांतर परमेश्वर की भरोसेमंदी और निष्ठा दर्शाता है। ‘विश्वासयोग्यता’ संबंधपरक अर्थ को बनाए रखता है।
- source_word: לְבֵית יִשְׂרָאֵל
  choice: इस्राएल के घराने के प्रति
  rationale: לְ संबंध या दिशा बता सकता है। ‘के प्रति’ प्रेम और विश्वासयोग्यता के लक्ष्य को स्वाभाविक हिन्दी में स्पष्ट करता है, जबकि ‘घराना’ मूल सामुदायिक अभिव्यक्ति को बनाए रखता है।
- source_word: רָאוּ
  choice: देखा है
  rationale: 'पूर्ण क्रिया को वर्तमान प्रासंगिकता के साथ व्यक्त किया गया है: पृथ्वी के दूरस्थ भाग परमेश्वर के उद्धारकारी कार्य के साक्षी बन चुके हैं।'
- source_word: כָל אַפְסֵי אָרֶץ
  choice: पृथ्वी के सभी छोरों
  rationale: यह संसार के सबसे दूरस्थ क्षेत्रों के लिए प्रयुक्त इब्रानी मुहावरा है। ‘पृथ्वी के सभी छोर’ हिन्दी में परिचित और काव्यात्मक है।
- source_word: אֵת
  choice: '[प्रत्यक्ष कर्म-चिह्न, अनूदित नहीं]'
  rationale: इस इब्रानी व्याकरणिक चिह्न का अलग हिन्दी समानार्थी आवश्यक नहीं; कर्म-संबंध वाक्य-रचना से व्यक्त होता है।
- source_word: יְשׁוּעַת
  choice: उद्धार
  rationale: יְשׁוּעָה उद्धार या छुटकारा बता सकता है और भजन के प्रसंग में विजयी बचाव का भाव भी रख सकता है। ‘उद्धार’ इसकी व्यापकता बनाए रखता है।
- source_word: אֱלֹהֵינוּ
  choice: हमारे परमेश्वर का
  rationale: यह יְשׁוּעַת के साथ संबंधसूचक पदबंध बनाता है। ‘हमारे परमेश्वर का उद्धार’ मूल संरचना को बनाए रखता है और कर्तृत्व को अनावश्यक रूप से संकीर्ण नहीं करता।
theological_decisions:
- issue: חֶסֶד और אֱמוּנָה का वाचा-संबंधी भाव
  choice: ‘अटल प्रेम’ और ‘विश्वासयोग्यता’
  alternative: ‘दया’ और ‘सच्चाई’
  rationale: चुना हुआ युग्म इस्राएल के प्रति परमेश्वर के स्थायी प्रेम और भरोसेमंद निष्ठा को व्यक्त करता है। यह חֶסֶד को केवल करुणा और אֱמוּנָה को केवल तथ्यात्मक सत्य तक सीमित नहीं करता।
- issue: יְשׁוּעַת אֱלֹהֵינוּ का अर्थ-क्षेत्र
  choice: ‘हमारे परमेश्वर का उद्धार’
  alternative: ‘हमारे परमेश्वर की विजय’ अथवा ‘हमारे परमेश्वर का छुटकारा’
  rationale: मूल शब्द व्यापक उद्धारकारी या छुड़ाने वाले कार्य को दर्शाता है और उसमें विजय का स्वर भी हो सकता है। ‘उद्धार’ किसी विशेष सैन्य अर्थ को थोपे बिना इस व्यापकता को बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण और भजन की काव्यात्मकता के अनुरूप रखी गई है। ‘इस्राएल का घराना’ और ‘पृथ्वी के सभी छोर’ मूल की सामुदायिक तथा वैश्विक छवियों को बनाए रखते हैं।
