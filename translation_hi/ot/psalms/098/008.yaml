lexical_decisions:
- source_word: נְהָרוֹת
  choice: नदियाँ
  rationale: बहुवचन संज्ञा का सीधा और स्वाभाविक हिन्दी रूप; यह सृष्टि के स्तुतिगान का काव्यात्मक चित्र बनाए रखता है।
- source_word: יִמְחֲאוּ כָף
  choice: तालियाँ बजाएँ
  rationale: शाब्दिक रूप में ‘हथेली/हाथ बजाना’ है, पर यह इब्रानी मुहावरा हिन्दी में स्वाभाविक रूप से ‘तालियाँ बजाना’ कहलाता है। क्रियारूप को काव्यात्मक आह्वान के रूप में रखा गया है।
- source_word: יַחַד
  choice: मिलकर
  rationale: ‘एक साथ’ का स्वाभाविक और संक्षिप्त हिन्दी रूप, जो पर्वतों की संयुक्त स्तुति व्यक्त करता है।
- source_word: הָרִים
  choice: पर्वत
  rationale: मूल के भव्य प्राकृतिक बिंब को ‘पहाड़ियों’ की अपेक्षा ‘पर्वत’ अधिक ठीक बनाए रखता है।
- source_word: יְרַנֵּנוּ
  choice: आनंद से गाएँ
  rationale: क्रिया उल्लासपूर्ण गायन या आनंद की ऊँची पुकार—दोनों का बोध करा सकती है। मुख्य पाठ में काव्य-समानांतरता के अनुरूप स्वाभाविक विकल्प चुना गया है और दूसरा अर्थ पादटिप्पणी में सुरक्षित है।
theological_decisions:
- issue: स्तुति करती हुई सृष्टि का मानवीकरण
  choice: नदियों के ताली बजाने और पर्वतों के आनंद से गाने का चित्र सीधे बनाए रखा गया है।
  alternative: इसे सृष्टि से प्रेरित मनुष्यों की स्तुति के रूप में व्याख्यायित करना।
  rationale: इब्रानी पाठ नदियों और पर्वतों को स्वयं उल्लासपूर्ण स्तुति में भाग लेते हुए चित्रित करता है; इसे अमूर्त व्याख्या में बदलना मूल कविता की शक्ति घटा देता।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सहज मानक हिन्दी। ‘तालियाँ बजाएँ’ हिन्दी मुहावरे के अनुसार है; ‘मिलकर आनंद से गाएँ’ मूल की सामूहिक, उल्लासपूर्ण स्तुति और उसकी काव्यात्मक लय को बनाए रखता है।
