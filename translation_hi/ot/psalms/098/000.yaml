  text: מִזְמ֡וֹר שִׁ֤ירוּ לַֽ/יהוָ֨ה שִׁ֣יר חָ֭דָשׁ כִּֽי נִפְלָא֣וֹת עָשָׂ֑ה הוֹשִֽׁיעָה לּ֥/וֹ יְ֝מִינ֗/וֹ וּ/זְר֥וֹעַ קָדְשֽׁ/וֹ׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/098/000.yaml
  text: A psalm. Sing to Yahweh a new song[a], for he has done wondrous things; his right hand and his holy arm have brought him salvation.
translation:
  language: hi
  text: 'भजन।


    याहवे के लिए नया गीत गाओ,

    क्योंकि उसने अद्भुत काम किए हैं;

    उसके दाहिने हाथ और उसकी पवित्र भुजा ने

    उसके लिए उद्धार सिद्ध किया है।[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या: “उसे बचाया है” अथवा “उसके लिए विजय प्राप्त की है।” इब्रानी अभिव्यक्ति बताती है कि याहवे की अपनी सामर्थ्य ने उद्धार या विजय सिद्ध की है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִזְמוֹר
  choice: भजन
  rationale: शीर्षक के रूप में संक्षिप्त और प्रचलित हिन्दी शब्द, जो संगीतात्मक स्तुति-रचना का संकेत देता है।
- source_word: יהוה
  choice: याहवे
  rationale: मूल पाठ में आए परमेश्वर के विशिष्ट नाम को उपाधि से बदलने के बजाय लिप्यंतरित किया गया है।
- source_word: שִׁיר חָדָשׁ
  choice: नया गीत
  rationale: मूल संज्ञा-विशेषण पदबंध का सीधा और स्वाभाविक हिन्दी रूप।
- source_word: נִפְלָאוֹת
  choice: अद्भुत काम
  rationale: यह बहुवचन परमेश्वर के आश्चर्यजनक कार्यों को दर्शाता है; 'अद्भुत काम' सामान्य पाठक के लिए स्वाभाविक है।
- source_word: הוֹשִׁיעָה לּוֹ
  choice: उसके लिए उद्धार प्राप्त किया है
  rationale: मूल के 'उसके लिए' और उद्धार/विजय के अर्थ को बनाए रखता है, यद्यपि हिन्दी में यह कुछ औपचारिक है। वैकल्पिक अर्थ फुटनोट में दिया गया है।
- source_word: זְרוֹעַ קָדְשׁוֹ
  choice: उसकी पवित्र भुजा
  rationale: मूल रूपक और उसके धार्मिक काव्यात्मक स्वर को यथावत रखता है।
theological_decisions:
- issue: הוֹשִׁיעָה לּוֹ में उद्धार का कर्ता और लाभार्थी
  choice: दाहिने हाथ और पवित्र भुजा ने 'उसके लिए उद्धार प्राप्त किया'
  alternative: '''उसे बचाया'' या ''उसे विजय दिलाई'''
  rationale: मूल व्याकरण में परमेश्वर की अपनी सामर्थ्य द्वारा उसके लिए उद्धार/विजय सिद्ध होने की तनावपूर्ण अभिव्यक्ति है। मुख्य पाठ इसे मिटाता नहीं, और फुटनोट सम्भव अर्थ स्पष्ट करता है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और काव्यात्मक हिन्दी; पंक्ति-विन्यास इब्रानी समानांतरता को उभारता है। बहुवचन आज्ञा 'गाओ' सामूहिक आह्वान को व्यक्त करती है।
