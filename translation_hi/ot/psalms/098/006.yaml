  text: With trumpets and the sound of the horn[a], raise a shout before the King, Yahweh.
translation:
  language: hi
  text: तुरहियों और नरसिंगे[a] की ध्वनि के साथ राजा याहवे के सामने जयजयकार करो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मेढ़े के सींग की ध्वनि।” हिब्रू शब्द שׁוֹפָר प्रायः मेढ़े के सींग से बने वाद्य को दर्शाता है, जो इस पद में पहले आई तुरहियों से भिन्न है।
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּחֲצֹצְרוֹת
  choice: तुरहियों के साथ
  rationale: חֲצֹצְרוֹת सीधे धातु के तुरही-जैसे वाद्यों को दर्शाता है और שׁוֹפָר से भिन्न है। उपसर्ग ב को साधनवाचक ‘के साथ’ से व्यक्त किया गया है; मूल में ‘चाँदी’ नहीं है।
- source_word: וְקוֹל שׁוֹפָר
  choice: और नरसिंगे की ध्वनि
  rationale: קוֹל का अर्थ ‘ध्वनि’ और שׁוֹפָר का अर्थ सींग से बना फूँक वाद्य है। ‘नरसिंगा’ हिंदी में तुरही से भिन्न सींगाकार वाद्य का स्वाभाविक नाम है; अधिक विशिष्ट ‘मेढ़े के सींग’ को पादटिप्पणी में रखा गया है।
- source_word: הָרִיעוּ
  choice: जयजयकार करो
  rationale: רוע का हिफ़ील बहुवचन आज्ञार्थ यहाँ ऊँची उत्सवी उद्घोषणा करने का भाव देता है। ‘जयजयकार करो’ आधुनिक हिंदी में इस राजकीय और आनंदपूर्ण उद्घोष को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: לִפְנֵי
  choice: के सामने
  rationale: यह स्थान-संबंधी पद ‘के सामने’ अथवा ‘की उपस्थिति में’ का अर्थ देता है; ‘के सामने’ संक्षिप्त और सहज है।
- source_word: הַמֶּלֶךְ
  choice: राजा
  rationale: निश्चित संज्ञा को ‘राजा’ के रूप में रखा गया है और अगले पद ‘यहोवा’ को समानाधिकरण में उसका परिचय माना गया है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिंदी में प्रचलित बाइबलीय लिप्यंतरण ‘यहोवा’ व्यक्तिगत दिव्य नाम को किसी उपाधि से प्रतिस्थापित किए बिना व्यक्त करता है।
theological_decisions:
- issue: दिव्य नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल में चार-अक्षरीय दिव्य नाम प्रत्यक्ष रूप से है। हिंदी पाठकों में परिचित ‘यहोवा’ को नाम के रूप में रखा गया है; ‘प्रभु’ जैसी उपाधि से उसका प्रतिस्थापन नहीं किया गया।
- issue: ‘राजा’ और ‘यहोवा’ का संबंध
  choice: 'समानाधिकरण: ‘राजा यहोवा’'
  alternative: ‘यहोवा, जो राजा है’ अथवा ‘राजा, यहोवा’
  rationale: हिब्रू क्रम הַמֶּלֶךְ יְהוָה स्वाभाविक रूप से यहोवा की पहचान राजा के रूप में कराता है। हिंदी में ‘राजा यहोवा’ मूल क्रम और संक्षिप्तता दोनों बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सार्वजनिक आराधना में सहज पाठ के योग्य रखी गई है। ‘तुरही’ और ‘नरसिंगा’ से दोनों इब्रानी वाद्यों का भेद सुरक्षित है; ‘जयजयकार’ राजकीय अभिनंदन और उत्सवी उद्घोष दोनों को व्यक्त करता है।
