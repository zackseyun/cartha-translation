  rationale: ל यहाँ स्तुति के लक्ष्य को सूचित करता है। हिन्दी में ‘यहवे का गुणगान’ अपेक्षाकृत स्वाभाविक है और मूल में आए वाचा-संबंधी नाम को नाम के रूप में सुरक्षित रखता है।
- source_word: בְּכִנּוֹר
  choice: वीणा बजाकर
  rationale: כִּנּוֹר प्राचीन तंतुवाद्य था। ‘वीणा’ आधुनिक हिन्दी पाठक के लिए समझने योग्य निकटतम सांस्कृतिक समतुल्य है; बְּ का वाद्य-साधनार्थक भाव ‘बजाकर’ से स्पष्ट होता है।
- source_word: בְּכִנּוֹר
  choice: वीणा
  rationale: मूल की पुनरुक्ति और काव्यात्मक बल को बनाए रखने के लिए वाद्य का उल्लेख दूसरी पंक्ति में भी रखा गया है।
- source_word: וְקוֹל זִמְרָה
  choice: और गीत की ध्वनि के साथ
  rationale: קוֹל का ठोस ‘ध्वनि/स्वर’ भाव और זִמְרָה का ‘गीत/संगीत’ भाव सुरक्षित रहता है; हिन्दी में यह पदबंध स्पष्ट और गरिमापूर्ण है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में चतुरक्षरीय व्यक्तिगत नाम सीधे आया है। ‘यहवे’ उसका प्रचलित विद्वत्तापूर्ण लिप्यंतरण है और उसे सामान्य उपाधि ‘प्रभु’ से प्रतिस्थापित नहीं करता।
