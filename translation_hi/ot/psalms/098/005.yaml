lexical_decisions:
- source_word: זַמְּרוּ
  choice: गुणगान करो
  rationale: पिएल बहुवचन आज्ञार्थक रूप संगीतमय स्तुति का आह्वान करता है। ‘गुणगान करो’ स्तुति और गायन—दोनों भावों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: לַיהוָה
