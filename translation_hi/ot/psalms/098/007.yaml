  text: Let the sea roar[a], and all that fills it[b], the world and those who dwell in it.
translation:
  language: hi
  text: समुद्र और जो कुछ उसमें भरा है, गरजें; जगत और उसमें रहनेवाले भी।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יִרְעַם
  choice: गरज उठें
  rationale: רעם ऊँची, गर्जनापूर्ण ध्वनि करने को दर्शाता है। स्तुति के इस काव्यात्मक आह्वान में अपूर्ण क्रिया का इच्छासूचक भाव बहुवचन संयुक्त कर्ता के अनुसार ‘गरज उठें’ से स्वाभाविक रूप में व्यक्त होता है।
- source_word: הַיָּם
  choice: समुद्र
  rationale: יָם का मानक और स्वाभाविक हिन्दी पर्याय ‘समुद्र’ है।
- source_word: וּמְלֹאוֹ
  choice: और जो कुछ उसमें भरा है
  rationale: शाब्दिक अर्थ ‘और उसकी भरपूरी’ है; यहाँ आशय समुद्र में समाई हुई हर वस्तु से है। यह रूप मूल बिंब को रखते हुए आधुनिक हिन्दी में स्पष्ट है।
- source_word: תֵּבֵל
  choice: जगत
  rationale: תֵּבֵל व्यवस्थित अथवा बसा हुआ संसार दर्शाता है। ‘जगत’ काव्यात्मक, गरिमापूर्ण और संक्षिप्त है; अगला वाक्यांश उसके निवासियों को स्पष्ट करता है।
- source_word: וְיֹשְׁבֵי בָהּ
  choice: और उसमें रहनेवाले भी
  rationale: प्रतिभागी रूप का अर्थ ‘उसमें रहनेवाले’ है। ‘भी’ पहले संयुक्त कर्ता के साथ दूसरे काव्यात्मक पद को स्वाभाविक रूप से जोड़ता है।
