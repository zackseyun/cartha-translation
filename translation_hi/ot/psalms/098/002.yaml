  yaml_path: translation/ot/psalms/098/002.yaml
  text: Yahweh has made his salvation known[b][a]; before the eyes of the nations he has revealed his righteousness.
translation:
  language: hi
  text: याहवे ने अपने उद्धार को ज्ञात कराया है; राष्ट्रों की आँखों के सामने[a] उसने अपनी धार्मिकता[b] प्रकट की है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘राष्ट्रों की दृष्टि में।’
    reason: lexical_alternative
  - marker: b
    text: या, ‘अपना न्याय।’ इब्रानी शब्द प्रसंग के अनुसार धार्मिकता, न्याय, या सही ठहरानेवाली सत्यनिष्ठा का भाव दे सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय देवनागरी में लिप्यंतरित किया गया है।
- source_word: הוֹדִיעַ
  choice: प्रकट किया है
  rationale: हिफ़ील रूप का अर्थ ‘ज्ञात कराया’ है; ‘प्रकट किया है’ आधुनिक हिन्दी में स्वाभाविक है और समानांतर पंक्ति से भी मेल रखता है।
- source_word: יְשׁוּעָתוֹ
  choice: अपना उद्धार
  rationale: यह शब्द उद्धार, छुटकारे या विजय का अर्थ दे सकता है; ‘उद्धार’ व्यापक अर्थ और परमेश्वर के बचाने के कार्य—दोनों को बनाए रखता है।
- source_word: לְעֵינֵי
  choice: आँखों के सामने
  rationale: इब्रानी मुहावरे की दृश्यात्मकता को स्वाभाविक हिन्दी में सुरक्षित रखा गया है।
- source_word: הַגּוֹיִם
  choice: राष्ट्रों
  rationale: यहाँ आशय व्यापक रूप से इस्राएल से बाहर के राष्ट्रों से है; ‘राष्ट्र’ अनावश्यक नवविधान-संबंधी रंग से बचता है।
- source_word: גִּלָּה
  choice: प्रकट की है
  rationale: पिएल रूप का अर्थ खोलकर दिखाना या प्रकट करना है; चुना गया रूप हिन्दी में सहज है।
- source_word: צִדְקָתוֹ
  choice: अपनी धार्मिकता
  rationale: यह शब्द धार्मिकता, न्याय और सही ठहरानेवाली सत्यनिष्ठा के अर्थ-क्षेत्र को समेटता है; मुख्य पाठ में व्यापक अर्थ वाला ‘धार्मिकता’ रखा गया है।
theological_decisions:
- issue: उद्धार के संदर्भ में परमेश्वर की צִדְקָה का अनुवाद
  choice: अपनी धार्मिकता
  alternative: अपना न्याय
  rationale: ‘धार्मिकता’ परमेश्वर की नैतिक सत्यता, विश्वासयोग्यता और उद्धारकारी कार्य के व्यापक संबंध को बनाए रखती है; ‘न्याय’ संभव है, पर अर्थ को कुछ संकीर्ण कर सकता है, इसलिए उसे पादटिप्पणी में रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। काव्यात्मक समानांतरता और ‘आँखों के सामने’ की इब्रानी दृश्यात्मकता सुरक्षित है।
