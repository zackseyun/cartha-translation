source:
  edition: WLC
  text: הָרִ֣יעוּ לַֽ֭/יהוָה כָּל הָ/אָ֑רֶץ פִּצְח֖וּ וְ/רַנְּנ֣וּ וְ/זַמֵּֽרוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/098/004.yaml
  text: Shout joyfully to Yahweh[a], all the earth[b]; break forth and sing for joy and make music.
translation:
  language: hi
  text: हे सारी पृथ्वी, याहवे के लिए जयजयकार करो; फूट पड़ो, आनंद से गाओ और स्तुति-गान करो।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָרִיעוּ
  choice: जयजयकार करो
  rationale: हिफ़ील आज्ञार्थक यहाँ सामूहिक, उल्लासपूर्ण जयध्वनि का आह्वान करता है। ‘जयजयकार करो’ आधुनिक हिंदी में स्वाभाविक है और स्तुति के प्रसंग को स्पष्ट रखता है।
- source_word: לַיהוָה
  choice: यहवे के लिए
  rationale: ל उपसर्ग जयध्वनि की दिशा अथवा उसके प्राप्तकर्ता को दर्शाता है; יְהוָה को उसके व्यक्तिगत वाचा-नाम ‘यहवे’ से प्रस्तुत किया गया है।
- source_word: כָּל־הָאָרֶץ
  choice: हे सारी पृथ्वी
  rationale: भजन के विश्वव्यापी आह्वान में אָרֶץ का अर्थ किसी स्थानीय देश के बजाय पूरी पृथ्वी है। संबोधनसूचक ‘हे’ हिंदी में आज्ञा के लक्षित समुदाय को स्वाभाविक रूप से व्यक्त करता है।
- source_word: פִּצְחוּ
  choice: फूट पड़ो
  rationale: यह क्रिया अचानक और प्रबल रूप से स्वर या गीत फूट निकलने का सजीव बिंब देती है; ‘फूट पड़ो’ उस काव्यात्मक तीव्रता को बनाए रखता है।
- source_word: וְרַנְּנוּ
  choice: आनंद से गाओ
  rationale: पिएल रूप उल्लासभरे स्वर या गान को सूचित करता है। ‘आनंद से गाओ’ पहले आए जयघोष से अलग रहते हुए संगीतमय प्रसन्नता व्यक्त करता है।
- source_word: וְזַמֵּרוּ
  choice: स्तुति-गान करो
  rationale: זמר स्तुति के प्रसंग में गायन और संगीत, कभी वाद्य-संगति सहित, को व्यक्त कर सकता है। ‘स्तुति-गान करो’ केवल वाद्य बजाने तक अर्थ को सीमित नहीं करता और हिंदी में गरिमापूर्ण है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहवे
  alternative: प्रभु
  rationale: मूल पाठ में सामान्य उपाधि नहीं, चार-अक्षरी व्यक्तिगत नाम יְהוָה है। ‘यहवे’ नाम और उपाधि का भेद सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक, काव्यात्मक और सामूहिक आराधना के योग्य रखी गई है। समानार्थी आज्ञाओं की क्रमिक तीव्रता—जयजयकार, फूट पड़ना, आनंद से गाना और स्तुति-गान—को यथासंभव सुरक्षित रखा गया है।
