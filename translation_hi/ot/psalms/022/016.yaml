source:
  edition: WLC
  text: כִּ֥י סְבָב֗וּ/נִי כְּלָ֫בִ֥ים עֲדַ֣ת מְ֭רֵעִים הִקִּיפ֑וּ/נִי כָּ֝/אֲרִ֗י יָדַ֥/י וְ/רַגְלָֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/022/016.yaml
  text: For dogs have surrounded me[a]; a company of evildoers has encircled me[b]; like a lion are my hands and my feet.
translation:
  language: hi
  text: क्योंकि कुत्तों ने मुझे घेर लिया है; कुकर्मियों की मंडली ने मुझे चारों ओर से घेर रखा है; सिंह के समान—मेरे हाथ और मेरे पैर।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: मृत सागर-पांडुलिपियों के कुछ साक्ष्य, सेप्टुआजिंट और अनेक अनुवाद यहाँ “उन्होंने मेरे हाथ और मेरे पैर बेध दिए” (या “खोद डाले”) पढ़ते हैं; मसोराई पाठ का कठिन पाठ है, “सिंह के समान—मेरे हाथ और मेरे पैर।”
    reason: textual_variant
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह विलाप के कारण या आधार को प्रस्तुत करता है और इब्रानी के व्याख्यात्मक-कारणात्मक संबंध को बनाए रखता है।
- source_word: סְבָבוּנִי
  choice: मुझे घेर लिया है
  rationale: סבב का अर्थ घेरना है; पूर्ण क्रिया के वर्तमान परिणाम को स्वाभाविक हिन्दी में व्यक्त किया गया है।
- source_word: כְּלָבִים
  choice: कुत्तों
  rationale: शत्रुओं के लिए प्रयुक्त अपमानजनक रूपक को व्याख्यात्मक शब्द से बदलने के बजाय ज्यों का त्यों रखा गया है।
- source_word: עֲדַת מְרֵעִים
  choice: कुकर्मियों की मंडली
  rationale: עֲדָה एक एकत्रित समूह या मंडली और מְרֵעִים बुराई करने वालों को दर्शाता है; यह चयन संक्षिप्त तथा गरिमापूर्ण हिन्दी है।
- source_word: הִקִּיפוּנִי
  choice: मुझे चारों ओर से घेर रखा है
  rationale: क्रिया के घेरने या चारों ओर बंद कर देने के भाव को व्यक्त करते हुए पहले समानांतर पद से हल्का शाब्दिक अंतर रखा गया है।
- source_word: כָּאֲרִי
  choice: सिंह के समान
  rationale: स्वरीकृत मसोराई पाठ का शाब्दिक अर्थ यही है। इसकी कठिन वाक्य-रचना को बिना अनुमानित क्रिया जोड़कर सुरक्षित रखा गया है।
- source_word: יָדַי וְרַגְלָי
  choice: मेरे हाथ और मेरे पैर
  rationale: दोनों शरीर-अंगों का सीधा अनुवाद है और कठिन क्रियारहित उपवाक्य को अनावश्यक रूप से स्पष्ट नहीं किया गया।
theological_decisions:
- issue: मसोराई पाठ כָּאֲרִי और प्राचीन साक्षियों में मिलने वाले ‘उन्होंने बेधा/खोद डाला’ के बीच विवादित पाठ
  choice: मुख्य पाठ में ‘सिंह के समान’
  alternative: ‘उन्होंने मेरे हाथ और मेरे पैर बेध दिए’ अथवा ‘खोद डाले’
  rationale: मुख्य पाठ WLC के स्वरीकृत मसोराई रूप का अनुसरण करता है, भले ही उसकी वाक्य-रचना कठिन हो। प्राचीन और धर्मवैज्ञानिक दृष्टि से महत्त्वपूर्ण वैकल्पिक पाठ को पाद-टिप्पणी में रखा गया है, ताकि किसी एक व्याख्या से तनाव को चुपचाप समाप्त न किया जाए।
translation_notes:
  register: आधुनिक मानक हिन्दी में स्वाभाविक, गरिमापूर्ण शैली रखी गई है। शत्रुओं के लिए ‘कुत्तों’ का मूल रूपक और अंतिम क्रियारहित, कठिन वाक्यांश दोनों सुरक्षित हैं; पाद-टिप्पणी पाठांतर को स्पष्ट करती है।
