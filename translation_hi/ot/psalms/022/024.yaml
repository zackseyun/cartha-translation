id: PSA.22.24
reference: Psalms 22:24
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: כִּ֤י לֹֽא בָזָ֨ה וְ/לֹ֪א שִׁקַּ֡ץ עֱנ֬וּת עָנִ֗י וְ/לֹא הִסְתִּ֣יר פָּנָ֣י/ו מִמֶּ֑/נּוּ וּֽ/בְ/שַׁוְּע֖/וֹ אֵלָ֣י/ו שָׁמֵֽעַ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/022/024.yaml
  text: For he has not despised or abhorred the affliction of the afflicted[a], and he has not hidden his face from him; but when he cried to him, he heard.
translation:
  language: hi
  text: क्योंकि उसने पीड़ित जन की पीड़ा को न तो तुच्छ जाना, न घृणित समझा[a]; उसने उससे अपना मुख नहीं छिपाया, बल्कि जब उस पीड़ित ने उसे पुकारा, तो उसने सुन लिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘दीन जन की दुर्दशा को’; या ‘पीड़ित जन के अपमान को’।
    reason: עֱנוּת और עָנִי के अर्थ-क्षेत्र में पीड़ा, दीनता, निर्धनता और अपमान के परस्पर जुड़े भाव संभव हैं।
lexical_decisions:
- source_word: בָזָה
  choice: तुच्छ जाना
  rationale: यह क्रिया किसी को या किसी दशा को तिरस्कार की दृष्टि से देखने का भाव व्यक्त करती है; ‘तुच्छ जाना’ आधुनिक हिन्दी में स्वाभाविक और सटीक है।
- source_word: שִׁקַּץ
  choice: घृणित समझा
  rationale: यह בָזָה से अधिक प्रबल घृणा या जुगुप्सा का भाव रखती है। ‘घृणित समझा’ दोनों क्रियाओं के बीच की तीव्रता बनाए रखता है।
- source_word: עֱנוּת
  choice: पीड़ा
  rationale: यह दुःख, क्लेश या दीन दशा को सूचित करता है। ‘पीड़ा’ प्रसंग में सहज है और इसे केवल आर्थिक गरीबी या सामाजिक अपमान तक सीमित नहीं करती।
- source_word: עָנִי
  choice: पीड़ित जन
  rationale: शब्द निर्धन, दीन या सताया हुआ व्यक्ति सूचित कर सकता है। इस भजन के दुःख के प्रसंग में ‘पीड़ित जन’ व्यापक अर्थ सुरक्षित रखता है।
- source_word: הִסְתִּיר פָּנָיו
  choice: अपना मुख नहीं छिपाया
  rationale: इब्रानी बिंब को बनाए रखा गया है; इसका भाव अनुग्रहपूर्ण ध्यान या उपस्थिति न हटाना है और हिन्दी में यह बिंब समझने योग्य है।
- source_word: מִמֶּנּוּ
  choice: उससे
  rationale: एकवचन सर्वनाम पहले आए ‘पीड़ित जन’ की ओर लौटता है और मूल पाठ की एकवचन संरचना को बनाए रखता है।
- source_word: בְשַׁוְּעוֹ
  choice: जब उस पीड़ित ने ... पुकारा
  rationale: रूप सहायता के लिए की गई व्याकुल पुकार दर्शाता है। हिन्दी में सर्वनामों की उलझन से बचने के लिए कर्ता ‘उस पीड़ित’ स्पष्ट किया गया है।
- source_word: אֵלָיו
  choice: उसे
  rationale: यह सर्वनाम प्रसंग में परमेश्वर की ओर संकेत करता है; मूल में अनुपस्थित कोई ईश्वरीय उपाधि जोड़े बिना सर्वनाम रखा गया है।
- source_word: שָׁמֵעַ
  choice: उसने सुन लिया
  rationale: मूल अर्थ ‘सुनना’ है। ‘उत्तर दिया’ कहने से जो अतिरिक्त अर्थ जुड़ता, उससे बचते हुए हिन्दी में पूर्ण क्रिया का स्वाभाविक रूप चुना गया है।
theological_decisions:
- issue: पीड़ित जन का संदर्भ
  choice: वचन एकवचन पीड़ित जन की बात करता है, जो भजनकार के तत्काल अनुभव से मेल खाता है और साथ ही व्यापक कथन के रूप में भी पढ़ा जा सकता है।
  alternative: इसे केवल मसीह के विषय में विशेष भविष्यसूचक कथन या केवल किसी भी निर्धन व्यक्ति के विषय में सामान्य कथन मानना।
  rationale: इब्रानी एकवचन दोनों आयामों की गुंजाइश रखता है। अनुवाद किसी एक धर्मवैज्ञानिक पहचान को मुख्य पाठ में आरोपित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज किंतु गरिमापूर्ण रूप रखा गया है। ‘अपना मुख नहीं छिपाया’ जैसे मूल इब्रानी बिंब को सुरक्षित रखा गया है, जबकि अंतिम उपवाक्य में हिन्दी के अस्पष्ट सर्वनामों से बचने के लिए ‘उस पीड़ित’ स्पष्ट किया गया है।
