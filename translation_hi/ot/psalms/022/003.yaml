base_translation:
  language: en
  yaml_path: translation/ot/psalms/022/003.yaml
  text: Yet you are holy[a], enthroned on the praises of Israel.
translation:
  language: hi
  text: फिर भी तू पवित्र है, इस्राएल की स्तुतियों पर विराजमान है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “परन्तु तू पवित्र है, इस्राएल की स्तुतियों में निवास करता है।” इब्रानी कृदंत का अर्थ “बैठा हुआ” या “निवास करने वाला” भी हो सकता है; यहाँ “विराजमान” राजकीय काव्य-बिंब को व्यक्त करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אַתָּה
  choice: फिर भी तू
  rationale: संयोजक और स्वतंत्र सर्वनाम पिछले विलाप के विपरीत एक स्पष्ट विरोध दिखाते हैं। ‘फिर भी’ इस भाव को स्वाभाविक हिन्दी में व्यक्त करता है, और ‘तू’ परमेश्वर को किए गए सीधे, एकवचन संबोधन को बनाए रखता है।
- source_word: קָדוֹשׁ
  choice: पवित्र
  rationale: यह विशेषण परमेश्वर की पवित्रता को उसके व्यापक धार्मिक अर्थ में व्यक्त करता है; आधुनिक हिन्दी में ‘पवित्र’ मानक और स्वाभाविक शब्द है।
- source_word: יֹשֵׁב
  choice: विराजमान
  rationale: मूल कृदंत का शाब्दिक अर्थ ‘बैठा हुआ’ या ‘निवास करने वाला’ हो सकता है, पर परमेश्वर के संबंध में यहाँ राजकीय सिंहासन का काव्यात्मक बिंब संभावित है। ‘विराजमान’ उस गरिमामय अर्थ को सहज हिन्दी में बनाए रखता है।
- source_word: תְּהִלּוֹת
  choice: स्तुतियों
  rationale: बहुवचन को बनाए रखते हुए यह इस्राएल द्वारा की जाने वाली स्तुति की अनेक अभिव्यक्तियों को दर्शाता है।
- source_word: יִשְׂרָאֵל
  choice: इस्राएल
  rationale: व्यक्तिवाचक नाम का प्रचलित हिन्दी बाइबलीय रूप रखा गया है।
theological_decisions:
- issue: יֹשֵׁב תְּהִלּוֹת יִשְׂרָאֵל का अर्थ
  choice: परमेश्वर को इस्राएल की स्तुतियों पर विराजमान बताया गया है।
  alternative: परमेश्वर इस्राएल की स्तुतियों में निवास करता है।
  rationale: इब्रानी कृदंत बैठने, निवास करने या सिंहासन पर विराजने का अर्थ दे सकता है। मुख्य पाठ में राजकीय-काव्यात्मक बिंब रखा गया है, जबकि पादटिप्पणी वास्तविक शाब्दिक विकल्प को सुरक्षित रखती है।
translation_notes:
  register: आधुनिक, गरिमामय और काव्यात्मक हिन्दी। भजन की सीधी प्रार्थना के अनुरूप एकवचन निकट संबोधन ‘तू’ रखा गया है। ‘विराजमान’ राजकीय बिंब को व्यक्त करता है, जबकि पादटिप्पणी में ‘निवास’ का विकल्प सुरक्षित है।
