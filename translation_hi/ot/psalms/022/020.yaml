  text: הַצִּ֣ילָ/ה מֵ/חֶ֣רֶב נַפְשִׁ֑/י מִ/יַּד כֶּ֝֗לֶב יְחִידָתִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/022/020.yaml
  text: Deliver my life from the sword[c][b][a], my only one from the power of the dog.
translation:
  language: hi
  text: 'मेरे प्राण को तलवार से बचा ले,

    और मेरे एकमात्र जीवन को कुत्ते के वश से छुड़ा ले।[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘मेरे एकमात्र जीवन’ का शाब्दिक अर्थ ‘मेरी इकलौती’ भी हो सकता है; इसका आशय ‘मेरे अनमोल प्राण’ भी समझा गया है।
    reason: lexical_alternative
  - marker: b
    text: ‘कुत्ते के वश से’ का शाब्दिक रूप ‘कुत्ते के हाथ से’ है; ‘हाथ’ यहाँ अधिकार, पकड़, या नियंत्रण का मुहावरा है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הַצִּילָה
  choice: बचा ले / छुड़ा ले
  rationale: नצל का यह आग्रहपूर्ण रूप संकट से तत्काल उद्धार की पुकार है। समानार्थी हिंदी क्रियाएँ काव्यात्मक समानांतरता को स्वाभाविक रखती हैं।
- source_word: מֵחֶרֶב
  choice: तलवार से
  rationale: מן अलग किए जाने या संकट से बचाए जाने का भाव देता है; तलवार यहाँ घातक हिंसा का सजीव प्रतीक है।
- source_word: נַפְשִׁי
  choice: मेरे प्राण
  rationale: נפש इस संदर्भ में जीवित व्यक्ति अथवा जीवन को दर्शाता है। 'प्राण' आधुनिक हिंदी में मृत्यु-संकट की इस पुकार के अनुकूल है और केवल देह से अलग किसी अमूर्त आत्मा का अर्थ आरोपित नहीं करता।
- source_word: מִיַּד
  choice: पंजे से
  rationale: יד का मूल अर्थ 'हाथ' है और मुहावरे में अधिकार या पकड़ भी हो सकता है। कुत्ते के साथ 'पंजा' हिंदी में चित्र को बनाए रखते हुए उसकी पकड़ का भाव देता है।
- source_word: כֶּלֶב
  choice: कुत्ते
  rationale: इब्रानी शब्द एकवचन है। इसे बहुवचन या सीधे 'शत्रु' न बनाकर मूल रूपक सुरक्षित रखा गया है।
- source_word: יְחִידָתִי
  choice: मेरे इस एकमात्र जीवन को
  rationale: יחידה का मूल भाव 'एकमात्र/अकेला' है। यहाँ נפשי के समानांतर यह वक्ता के एक ही, न लौटने वाले जीवन की ओर संकेत करता है; 'जीवन' जोड़ने से हिंदी में आशय स्पष्ट रहता है।
theological_decisions:
- issue: נַפְשִׁי का मानव-स्वरूप संबंधी अर्थ
  choice: '''मेरे प्राण''—अर्थात मेरा जीवन/जीवित अस्तित्व'
  alternative: '''मेरी आत्मा'''
  rationale: प्रसंग शारीरिक मृत्यु के संकट से बचाव की विनती है। इसलिए ऐसा तकनीकी देह-आत्मा भेद नहीं जोड़ा गया जो इब्रानी पद में यहाँ आवश्यक नहीं है।
- issue: יְחִידָתִי की संदर्भगत व्याख्या
  choice: '''मेरे इस एकमात्र जीवन को'''
  alternative: '''मेरी इकलौती'' अथवा ''मेरे अनमोल प्राण को'''
  rationale: स्त्रीलिंग रूप संभवतः समानांतर נַפְשִׁי की ओर लौटता है। 'एकमात्र जीवन' मूल की विशिष्टता बचाता है, जबकि 'अनमोल' मूल्य का एक अतिरिक्त भाव जोड़ सकता है।
translation_notes:
  register: भाषा आधुनिक, प्रार्थनापूर्ण और काव्यात्मक रखी गई है। 'प्राण' गरिमापूर्ण किंतु सामान्यतः समझा जाने वाला शब्द है। दूसरे चरण में 'इस' जोड़कर 'एकमात्र जीवन' को स्वाभाविक हिंदी संदर्भ मिला है; मूल का एकवचन 'कुत्ता' और उसका तीखा रूपक सुरक्षित है।
