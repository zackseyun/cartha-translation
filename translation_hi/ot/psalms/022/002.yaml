base_translation:
  language: en
  yaml_path: translation/ot/psalms/022/002.yaml
  text: My God[a], I cry out by day, but you do not answer, and by night[b], but I have no rest.
translation:
  language: hi
  text: 'मेरे परमेश्वर, मैं दिन में पुकारता हूँ, पर तू उत्तर नहीं देता;

    और रात में मुझे चैन नहीं मिलता।[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मेरे लिए मौन नहीं है।”
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱלֹהַי
  choice: मेरे परमेश्वर
  rationale: प्रथम पुरुष एकवचन प्रत्यय सहित संबोधन है। ‘मेरे परमेश्वर’ मूल का सीधा और स्वाभाविक हिन्दी रूप है; ‘हे’ जोड़ना आवश्यक नहीं है।
- source_word: אֶקְרָא
  choice: मैं ... पुकारता हूँ
  rationale: विलाप के संदर्भ में קרא सहायता के लिए व्याकुल पुकार को व्यक्त करता है। ‘पुकारता हूँ’ हिन्दी में स्वाभाविक है और अनावश्यक विस्तार से बचता है।
- source_word: יוֹמָם
  choice: दिन में
  rationale: यह क्रियाविशेषण रूप में ‘दिन के समय’ का अर्थ देता है और ‘रात में’ के साथ स्वाभाविक समानांतर बनाता है।
- source_word: וְלֹא תַעֲנֶה
  choice: पर तू उत्तर नहीं देता
  rationale: וְ यहाँ शिकायत में निहित विरोध को व्यक्त करता है। ‘पर’ उस भाव को स्वाभाविक हिन्दी में स्पष्ट करता है, जबकि क्रिया का सीधा अर्थ सुरक्षित रहता है।
- source_word: וְלַיְלָה
  choice: रात में भी पुकारता हूँ
  rationale: इब्रानी काव्य में पहली पंक्ति की क्रिया दूसरी पंक्ति में अध्याहृत है। हिन्दी में उसे दोहराने से अर्थ स्पष्ट होता है; ‘भी’ दिन और रात के समानांतर संबंध को व्यक्त करता है।
- source_word: וְלֹא דֽוּמִיָּה לִי
  choice: पर मुझे चैन नहीं मिलता
  rationale: דומיה का मूल अर्थ मौन, शांति या निस्तब्धता है। इस संक्षिप्त इब्रानी वाक्यांश को ‘मुझे चैन नहीं मिलता’ स्वाभाविक हिन्दी में उसकी अशांति का भाव देता है; अधिक शाब्दिक और वैकल्पिक अर्थ पाद-टिप्पणी में सुरक्षित है।
theological_decisions:
- issue: अंतिम वाक्यांश וְלֹא דֽוּמִיָּה לִי का अर्थ
  choice: मुझे चैन नहीं मिलता
  alternative: मैं चुप नहीं रहता; अथवा, मेरे लिए मौन नहीं है
  rationale: वाक्यांश जानबूझकर संक्षिप्त है और इसका संकेत भजनकार को विश्राम न मिलने या उसके लगातार पुकारते रहने—दोनों ओर हो सकता है। मुख्य पाठ में स्वाभाविक हिन्दी रखी गई है और पाद-टिप्पणी में मूल की अस्पष्टता तथा शाब्दिक चित्र सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी। काव्यात्मक समानांतरता दिखाने के लिए दो पंक्तियाँ रखी गई हैं। परमेश्वर के लिए ‘तू’ प्रार्थना और भजन की निकट, पारंपरिक संबोधन-शैली को व्यक्त करता है; यह अनादर सूचक नहीं है।
