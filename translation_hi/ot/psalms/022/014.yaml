id: PSA.22.14
reference: Psalms 22:14
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: כַּ/מַּ֥יִם נִשְׁפַּכְתִּי֮ וְ/הִתְפָּֽרְד֗וּ כָּֽל עַצְמ֫וֹתָ֥/י הָיָ֣ה לִ֭בִּ/י כַּ/דּוֹנָ֑ג נָ֝מֵ֗ס בְּ/ת֣וֹךְ מֵעָֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/022/014.yaml
  text: I am poured out like water[a], and all my bones are out of joint; my heart has become like wax, melted within me.
translation:
  language: hi
  text: 'मैं पानी के समान उंडेल दिया गया हूँ,

    और मेरी सारी हड्डियाँ अलग हो गई हैं;

    मेरा हृदय मोम के समान हो गया है,

    वह मेरी अंतड़ियों के भीतर पिघल गया है।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כַּמַּיִם
  choice: पानी के समान
  rationale: उपसर्ग כַּ तुलना प्रकट करता है; यह चयन जल की तरह पूरी तरह उंडेल दिए जाने के काव्यात्मक बिंब को सहज और स्पष्ट रखता है।
- source_word: נִשְׁפַּכְתִּי
  choice: मैं ... उंडेल दिया गया हूँ
  rationale: निफ़अल रूप वक्ता पर घटी क्रिया और उससे बनी वर्तमान दशा को व्यक्त करता है; कर्मवाच्य हिन्दी मूल की संरचना और जीवंत अवस्था दोनों को सुरक्षित रखती है।
- source_word: וְהִתְפָּרְדוּ
  choice: अलग-अलग हो गई हैं
  rationale: हित्पअेल रूप अलग हो जाने या एक-दूसरे से छूट जाने का अर्थ देता है। यह हिन्दी मूल अर्थ को बनाए रखती है और चिकित्सकीय अर्थ ‘जोड़ों से उतरना’ को अनावश्यक रूप से निश्चित नहीं करती।
- source_word: כָּל עַצְמוֹתַי
  choice: मेरी सारी हड्डियाँ
  rationale: כָּל की पूर्णता और עֲצָמוֹת के ठोस शारीरिक बिंब का सीधा अनुवाद है।
- source_word: הָיָה לִבִּי
  choice: मेरा हृदय ... हो गया है
  rationale: यह किसी दशा में आ जाने का भाव व्यक्त करता है; ‘हो गया है’ उस परिवर्तन और परिणामी अवस्था दोनों को स्वाभाविक हिन्दी में रखता है।
- source_word: כַּדּוֹנָג
  choice: मोम के समान
  rationale: דוֹנָג का सीधा अर्थ ‘मोम’ है; उपमा को ज्यों का त्यों रखा गया है।
- source_word: נָמֵס
  choice: पिघल गया है
  rationale: מסס का अर्थ पिघलना या गल जाना है; मोम के बिंब के साथ ‘पिघल गया है’ सर्वाधिक स्वाभाविक और सटीक है।
- source_word: בְּתוֹךְ מֵעָי
  choice: मेरी अंतड़ियों के भीतर
  rationale: מֵעִים शरीर के भीतरी अंगों, विशेषतः अंतड़ियों, को सूचित करता है। ठोस, आंतरिक शारीरिक बिंब को अमूर्त ‘मेरे भीतर’ बनाकर कमजोर करने के बजाय यहाँ स्वाभाविक हिन्दी में संरक्षित किया गया है।
theological_decisions:
- issue: भीतरी व्यथा का शारीरिक-मानववैज्ञानिक चित्रण
  choice: मेरी अंतड़ियों के भीतर
  alternative: मेरे भीतर
  rationale: इब्रानी पाठ अमूर्त आत्मिक श्रेणी नहीं, बल्कि भीतरी अंगों का तीखा शारीरिक बिंब प्रस्तुत करता है। ठोस अभिव्यक्ति बनाए रखने से व्यथा का देहगत आयाम सुरक्षित रहता है और पाठ का अति-आध्यात्मिकीकरण नहीं होता।
- issue: हड्डियों के अलग होने की अभिव्यक्ति
  choice: अलग-अलग हो गई हैं
  alternative: जोड़ों से उतर गई हैं
  rationale: मूल क्रिया अलग या पृथक हो जाने को व्यक्त करती है, पर किसी विशिष्ट चिकित्सकीय दशा को अनिवार्य नहीं करती। व्यापक मूल अर्थ चुनकर उसकी वास्तविक अस्पष्टता सुरक्षित रखी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण काव्यात्मक गद्य-पद्य प्रयोग किया गया है। समानांतर पंक्तियाँ मूल भजन की देहगत और भावात्मक तीव्रता को स्पष्ट रखती हैं। ‘हृदय’ और ‘अंतड़ियाँ’ मूल के दो अलग शारीरिक बिंबों को बनाए रखते हैं; भाषा सहज है, पर मूल की तीक्ष्णता को नरम नहीं करती।
