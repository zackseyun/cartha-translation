review_pass:
  verdict: revise
  source_fidelity: 'The draft accurately conveys the principal Hebrew images: being poured out like water, the bones'' separation, the heart becoming like wax, and melting in the inward parts. However, “अलग-अलग हो गई हैं” can suggest that each bone has become individually distinct rather than that the bones have come apart from one another. “अलग हो गई हैं” more directly preserves the Hebrew reflexive/separative image without imposing the more specific medical sense of dislocation.'
  naturalness: The poetic register and parallel lineation are natural modern standard Hindi. “मैं पानी के समान उंडेल दिया गया हूँ” is intelligible and suitably vivid. Removing the reduplication in “अलग-अलग” also improves precision and flow.
  terminology: “हृदय,” “मोम,” and “अंतड़ियों” appropriately retain the distinct bodily terms and visceral register of the Hebrew. No doctrinally loaded interpretation is introduced. Because the Hindi main text already retains the concrete anatomical expression, no explanatory footnote is required; the English audit footnote addresses a generalizing English rendering that is not used here.
  issues:
  - severity: low
    issue: “अलग-अलग हो गई हैं” slightly overstates or shifts the image of the bones' separation.
    rationale: וְהִתְפָּרְדוּ means ‘have separated/come apart.’ The reduplicated Hindi adjective may imply individual distribution or distinctness. “अलग हो गई हैं” preserves the source's broader ambiguity and avoids specifying a medical diagnosis.
