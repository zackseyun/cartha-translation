id: PSA.22.26
reference: Psalms 22:26
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: יֹאכְל֬וּ עֲנָוִ֨ים וְ/יִשְׂבָּ֗עוּ יְהַֽלְל֣וּ יְ֭הוָה דֹּ֣רְשָׁ֑י/ו יְחִ֖י לְבַבְ/כֶ֣ם לָ/עַֽד׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/022/026.yaml
  text: The afflicted will eat and be satisfied[a]; those who seek him will praise Yahweh[c][b]. May your hearts live forever.
translation:
  language: hi
  text: 'दीन लोग[a] खाएँगे और तृप्त होंगे[c];

    याहवे को खोजने वाले उसकी स्तुति करेंगे।

    तुम सबका हृदय सदा जीवित रहे![b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘दीन’ का अनुवाद ‘नम्र,’ ‘गरीब’ या ‘दुःख से दबे हुए’ भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: मूल इब्रानी में ‘हृदय’ एकवचन है, जबकि ‘तुम सबका’ बहुवचन है; संभवतः यह संबोधित समुदाय के भीतरी जीवन के लिए सामूहिक एकवचन है।
    reason: lexical_alternative
  - marker: c
    text: भजन के प्रसंग में यह खाना किसी बलिदानी या मन्नत-भोज की ओर संकेत कर सकता है, यद्यपि इस पद में ऐसा स्पष्ट रूप से नहीं कहा गया है।
    reason: cultural_note
lexical_decisions:
- source_word: עֲנָוִים
  choice: दीन लोग
  rationale: यह शब्द दुःख और अभाव से दबे हुए लोगों के साथ-साथ नम्रता का भाव भी व्यक्त कर सकता है। ‘दीन लोग’ आधुनिक हिन्दी में संक्षिप्त और गरिमापूर्ण है तथा प्रसंग के सामाजिक और अनुभवगत पहलू को बनाए रखता है।
- source_word: יֹאכְלוּ וְיִשְׂבָּעוּ
  choice: खाएँगे और तृप्त होंगे
  rationale: दोनों अपूर्ण क्रियाओं को प्रसंगानुसार भविष्यकाल में रखा गया है। ‘तृप्त होंगे’ भरपेट होने और संतोष पाने—दोनों भावों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: יְהַלְלוּ יְהוָה
  choice: याहवे की स्तुति करेंगे
  rationale: पिएल क्रिया का उपासना-संबंधी अर्थ ‘स्तुति करेंगे’ से स्पष्ट होता है। परमेश्वर के व्यक्तिगत नाम को उपाधि से बदलने के बजाय ‘याहवे’ रूप में रखा गया है।
- source_word: דֹּרְשָׁיו
  choice: याहवे को खोजने वाले
  rationale: कृदंत निरंतर परमेश्वर की ओर उन्मुख होकर उसे खोजने वालों को दर्शाता है। हिन्दी में संज्ञा को दोहराने से सर्वनाम का संदर्भ अस्पष्ट नहीं रहता।
- source_word: יְחִי לְבַבְכֶם לָעַד
  choice: तुम सबका हृदय सदा जीवित रहे
  rationale: יְחִי को आशीर्वाद या कामना के रूप में ‘जीवित रहे’ किया गया है। एकवचन ‘हृदय’ और बहुवचन संबोधन, दोनों को बनाए रखने के लिए ‘तुम सबका हृदय’ चुना गया है; לָעַד के लिए स्वाभाविक ‘सदा’ प्रयुक्त है।
theological_decisions:
- issue: अंतिम उपवाक्य में संबोधन और सामूहिक एकवचन
  choice: ‘तुम सबका हृदय सदा जीवित रहे’—बहुवचन समुदाय को सीधे संबोधित करते हुए एकवचन ‘हृदय’ बनाए रखा गया है।
  alternative: ‘तुम्हारे हृदय सदा जीवित रहें’ अथवा ‘उनका हृदय सदा जीवित रहेगा।’
  rationale: इब्रानी में ‘हृदय’ एकवचन है, पर उसका प्रत्यय दूसरे पुरुष बहुवचन का है। यह संभवतः समुदाय के भीतरी जीवन के लिए सामूहिक एकवचन है। कामनासूचक भाव और सीधे बहुवचन संबोधन को बनाए रखना व्याकरण और भजन के आशीर्वादात्मक स्वर, दोनों के अनुरूप है।
- issue: खाने का स्वरूप
  choice: मुख्य पाठ में केवल खाना और तृप्त होना कहा गया है।
  alternative: इसे स्पष्ट रूप से बलिदान या मन्नत-भोज बताना।
  rationale: आस-पास का प्रसंग सामुदायिक बलिदानी अथवा मन्नत-भोज का संकेत दे सकता है, पर इस पद में यह बात स्पष्ट रूप से नहीं कही गई; इसलिए व्याख्यात्मक विस्तार केवल टिप्पणी में रखा गया है।
translation_notes:
  register: भाषा आधुनिक, सहज और उपासना-योग्य रखी गई है। ‘दीन,’ ‘तृप्त,’ ‘स्तुति’ और ‘हृदय’ जैसे परिचित, गरिमापूर्ण शब्द मूल पाठ की काव्यात्मक संक्षिप्तता बनाए रखते हैं। अर्धविराम पद के दो निकट जुड़े कथनों को जोड़ता है, जबकि अंतिम पंक्ति को आशीर्वादात्मक कामना के रूप में अलग रखा गया है।
