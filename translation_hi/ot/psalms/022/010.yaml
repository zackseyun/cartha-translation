  yaml_path: translation/ot/psalms/022/010.yaml
  text: Upon you I was cast from the womb[b][a]; from my mother's belly you have been my God.
translation:
  language: hi
  text: गर्भ से मुझे तुझ पर डाल दिया गया था; मेरी माँ के पेट[a] से तू मेरा परमेश्वर रहा है।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मेरी माँ के गर्भ से।” इब्रानी בֶּטֶן का अर्थ “पेट” या “गर्भ” हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या, “तू मेरा परमेश्वर है।” इब्रानी में अंतिम उपवाक्य अक्षरशः “मेरा परमेश्वर तू [है]” है; प्रसंग इसे जन्म से अब तक चले आ रहे संबंध के रूप में भी समझने देता है।
    reason: alternative_reading
lexical_decisions:
- source_word: עָלֶיךָ
  choice: तुझ पर
  rationale: עַל के साथ प्रत्यय यहाँ किसी पर रखे जाने और उसके सहारे छोड़े जाने की सजीव उपमा व्यक्त करता है; ‘तुझ पर’ इसे बिना व्याख्यात्मक विस्तार के बनाए रखता है।
- source_word: הָשְׁלַכְתִּי
  choice: मुझे ... डाल दिया गया था
  rationale: यह रूप यहाँ कर्मवाच्य अर्थ देता है। ‘डाल दिया गया’ मूल की तीखी और ठोस छवि को रखता है; ‘सौंप दिया गया’ अर्थ को अधिक स्पष्ट करता, पर मूल से अधिक व्याख्यात्मक होता।
- source_word: מֵרָחֶם
  choice: गर्भ से ही
  rationale: רֶחֶם का ठोस अर्थ ‘गर्भ’ है। ‘जन्म से’ कहने की अपेक्षा यह मूल बिंब को सुरक्षित रखता है। ‘ही’ आरंभिक समय पर काव्यात्मक बल को स्वाभाविक हिन्दी में प्रकट करता है।
- source_word: מִבֶּטֶן אִמִּי
  choice: अपनी माँ के पेट से
  rationale: בֶּטֶן का अर्थ ‘पेट’ या संदर्भानुसार ‘गर्भ’ हो सकता है। पहले पदांश के רֶחֶם को ‘गर्भ’ कहा गया है, इसलिए यहाँ ‘पेट’ मूल की शब्द-विविधता को बनाए रखता है।
- source_word: אֵלִי
  choice: मेरा परमेश्वर
  rationale: אֵל के प्रथम पुरुष एकवचन प्रत्यय का सीधा अर्थ ‘मेरा परमेश्वर’ है और यह व्यक्तिगत संबंध का भाव सुरक्षित रखता है।
- source_word: אָתָּה
  choice: तू ... रहा है
  rationale: 'मूल उपवाक्य क्रियारहित है: अक्षरशः ‘मेरा परमेश्वर तू [है]।’ प्रसंग जन्म से अब तक बने संबंध की ओर संकेत करता है, जिसे हिन्दी में ‘रहा है’ स्वाभाविक रूप से व्यक्त करता है।'
theological_decisions:
- issue: अंतिम क्रियारहित उपवाक्य में काल की पूर्ति
  choice: तू मेरा परमेश्वर रहा है
  alternative: तू मेरा परमेश्वर है
  rationale: אֵלִי אָתָּה में व्यक्त क्रिया नहीं है, इसलिए वर्तमान काल भी सम्भव है। जन्म से चले आ रहे संबंध के प्रसंग में ‘रहा है’ निरंतरता को स्वाभाविक हिन्दी में व्यक्त करता है, जबकि पादटिप्पणी औपचारिक रूप से सम्भव वर्तमान अर्थ सुरक्षित रखती है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सहज हिन्दी; परमेश्वर को संबोधन में भजन की निकटता बनाए रखने के लिए एकवचन ‘तू/तुझ’ रखा गया है। ‘माँ के पेट’ जानबूझकर ठोस काव्यात्मक अभिव्यक्ति है और רֶחֶם तथा בֶּטֶן के बीच की शब्द-विविधता को बचाती है।
