reference: Psalms 22:27
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: יִזְכְּר֤וּ וְ/יָשֻׁ֣בוּ אֶל יְ֭הוָה כָּל אַפְסֵי אָ֑רֶץ וְ/יִֽשְׁתַּחֲו֥וּ לְ֝/פָנֶ֗י/ךָ כָּֽל מִשְׁפְּח֥וֹת גּוֹיִֽם׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/022/027.yaml
  text: All the ends of the earth will remember and return to Yahweh[b][a], and all the families of the nations will bow down before you.
translation:
  language: hi
  text: पृथ्वी के दूर-दूर के सभी लोग स्मरण करेंगे और याहवे[a] की ओर लौटेंगे; और राष्ट्रों के सब कुल तेरे सामने दण्डवत् करेंगे[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में परमेश्वर का व्यक्तिगत नाम YHWH है; इसे ‘याहवे’ भी लिखा जाता है।
    reason: alternative_reading
  - marker: b
    text: इसका अनुवाद ‘तेरे सामने आराधना करेंगे’ भी हो सकता है। इब्रानी क्रिया का शाब्दिक अर्थ झुककर दण्डवत् करना है, जो प्रायः आराधना के रूप में किया जाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: יִזְכְּרוּ
  choice: स्मरण करेंगे
  rationale: ज़כר के काल-अपूर्ण रूप का यहाँ भावी, भविष्यसूचक बल है। ‘स्मरण करेंगे’ मूल अर्थ को सीधे और गरिमापूर्ण ढंग से रखता है।
- source_word: וְיָשֻׁבוּ אֶל
  choice: की ओर लौटेंगे
  rationale: שׁוב के ‘लौटना/फिरना’ अर्थ और אֶל की दिशात्मकता दोनों सुरक्षित रहते हैं; ‘मन फिराएँगे’ कहने से पश्चात्ताप का अर्थ आवश्यकता से अधिक स्पष्ट हो जाता।
- source_word: יְהוָה
  choice: यहोवा
  rationale: इब्रानी व्यक्तिवाचक परमेश्वरीय नाम YHWH को हिन्दी में प्रचलित लिप्यंतरण ‘यहोवा’ से व्यक्त किया गया है; पदवी ‘प्रभु’ से इसे प्रतिस्थापित नहीं किया गया।
- source_word: כָּל אַפְסֵי אָרֶץ
  choice: पृथ्वी के दूर-दूर के सभी लोग
  rationale: शाब्दिक ‘पृथ्वी के सभी छोर’ यहाँ उन छोरों में रहने वाले लोगों के लिए स्थानवाची प्रयोग है। हिन्दी में यह रूप विश्वव्यापी मानवीय प्रत्युत्तर को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: וְיִשְׁתַּחֲווּ
  choice: दण्डवत् करेंगे
  rationale: क्रिया झुककर भूमि तक प्रणाम करने की साकार क्रिया बताती है, जो आराधना का कार्य हो सकती है। ‘दण्डवत् करेंगे’ उस शारीरिक बिंब को बनाए रखता है।
- source_word: לְפָנֶיךָ
  choice: तेरे सामने
  rationale: शाब्दिक ‘तेरे मुख के सामने’ का सहज हिन्दी समतुल्य है। एकवचन प्रत्यक्ष संबोधन को बनाए रखा गया है।
- source_word: כָּל מִשְׁפְּחוֹת גּוֹיִם
  choice: सब राष्ट्रों के सभी कुल
  rationale: מִשְׁפְּחוֹת परिवार-समूहों या कुलों को और גּוֹיִם राष्ट्रों/जातियों को दर्शाता है। ‘कुल’ सामूहिक सामाजिक इकाई को संक्षेप और स्पष्टता से रखता है।
theological_decisions:
- issue: परमेश्वर के नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: मूल में वाचा-संबंधी व्यक्तिवाचक नाम है। उसे सामान्य पदवी में बदलने के बजाय हिन्दी में परिचित नामरूप रखा गया; स्वरांकन ऐतिहासिक पुनर्निर्माण के कारण ‘याहवे’ भी सम्भव है।
- issue: וְיִשְׁתַּחֲווּ में आराधना को स्पष्ट करना
  choice: दण्डवत् करेंगे
  alternative: आराधना करेंगे
  rationale: मूल क्रिया शारीरिक रूप से झुकने को सामने रखती है और संदर्भ में आराधनापूर्ण सम्मान सूचित करती है। ठोस क्रिया को बनाए रखने से अर्थ को अनावश्यक रूप से संकुचित नहीं किया गया।
- issue: וְיָשֻׁבוּ में पश्चात्ताप का भाव
  choice: की ओर लौटेंगे
  alternative: मन फिराकर ... के पास आएँगे
  rationale: परमेश्वर की ओर लौटना पश्चात्ताप का संकेत दे सकता है, पर क्रिया स्वयं व्यापक ‘लौटना/फिरना’ अर्थ रखती है; इसलिए अंतर्निहित धार्मिक तनाव सुरक्षित रखा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण काव्यात्मक गद्य। ‘तेरे’ से भजन में परमेश्वर के प्रति प्रत्यक्ष एकवचन संबोधन सुरक्षित है। ‘दण्डवत्’ सामान्य धार्मिक हिन्दी में समझा जाने वाला ठोस शब्द है; ‘पृथ्वी के दूर-दूर के सभी लोग’ इब्रानी स्थानवाची मुहावरे का स्वाभाविक अर्थ खोलता है।
