  text: A seed will serve him; it will be proclaimed about the Lord to the generation.
translation:
  language: hi
  text: संतान उसकी सेवा करेगी; पीढ़ी को प्रभु के विषय में बताया जाएगा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: זֶרַע
  choice: वंश
  rationale: शाब्दिक अर्थ ‘बीज’ है, पर यहाँ सामूहिक अर्थ में भावी संतान अथवा वंश अभिप्रेत है; हिंदी में ‘वंश’ इस सामूहिक और निरंतरता के भाव को स्वाभाविक रूप से व्यक्त करता है।
- source_word: יַעַבְדֶנּוּ
  choice: उसकी सेवा करेगा
  rationale: क्रिया עבד का सामान्य धार्मिक-संदर्भीय अर्थ ‘सेवा करना’ है; प्रत्यय ‘उसकी’ को सूचित करता है।
- source_word: יְסֻפַּר
  choice: बताया जाएगा
  rationale: ספר का पुअल रूप निष्क्रिय भाव देता है—‘कहा/सुनाया/बताया जाएगा’; हिंदी में ‘बताया जाएगा’ सहज और अर्थानुकूल है।
- source_word: לַאדֹנָי
  choice: प्रभु के विषय में
  rationale: לְ यहाँ कथन की विषयवस्तु दर्शा सकता है; ‘प्रभु के विषय में’ इस संबंध को स्पष्ट किए बिना अत्यधिक व्याख्यात्मक हुए व्यक्त करता है।
- source_word: לַדּוֹר
  choice: आनेवाली पीढ़ी को
  rationale: निश्चित ‘पीढ़ी’ संदर्भ में अगली अथवा भावी पीढ़ी की ओर संकेत करती है; पिछले पद के भावी वंश-संदर्भ के कारण ‘आनेवाली’ स्वाभाविक है।
theological_decisions:
- issue: זֶרַע को एकवचन व्यक्ति या सामूहिक उत्तरवंश मानना
  choice: सामूहिक ‘वंश’
  alternative: ‘एक संतान’ अथवा शाब्दिक ‘बीज’
  rationale: एकवचन रूप सामूहिक संज्ञा के रूप में प्रयुक्त हो सकता है और अगली पीढ़ी को घोषणा किए जाने का संदर्भ उत्तरवंश को उपयुक्त बनाता है; किसी विशिष्ट मसीही व्यक्ति की पहचान पाठ में जोड़ना उचित नहीं।
- issue: יְסֻפַּר का अवैयक्तिक निष्क्रिय कर्ता
  choice: कर्ताहीन निष्क्रिय वाक्य रखा गया
  alternative: ‘वह प्रभु के विषय में बताएगा’
  rationale: मसोरेटी पाठ में क्रिया निष्क्रिय है; इसे सक्रिय बनाना वंश को अनकहा कर्ता मानकर अस्पष्टता का समाधान कर देता।
translation_notes:
  register: आधुनिक मानक हिंदी; संक्षिप्त, काव्यात्मक और गरिमापूर्ण। ‘वंश’ सामान्य पाठक के लिए ‘बीज’ की अपेक्षा अधिक स्वाभाविक है, जबकि सामूहिक अर्थ सुरक्षित रहता है।
