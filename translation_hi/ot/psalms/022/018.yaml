lexical_decisions:
- source_word: יְחַלְּקוּ
  choice: बाँटते हैं
  rationale: חלק के पिएल अपूर्ण 3 बहुवचन का यह स्वाभाविक और काव्यात्मक वर्तमान-कालीन रूप है, जो दृश्य को सजीव रखता है।
- source_word: בְגָדַי
  choice: मेरे वस्त्र
  rationale: בגד के लिए 'वस्त्र' गरिमापूर्ण किंतु सुबोध है और पद के दूसरे वस्त्र-सूचक शब्द से कुछ भेद बनाए रखता है।
- source_word: לָהֶם
  choice: आपस में
  rationale: शाब्दिक अर्थ 'अपने लिए/उन्हें' है; बाँटने की क्रिया के साथ 'आपस में' समूह के भीतर वितरण का भाव स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: לְבוּשִׁי
  choice: मेरे पहनावे के लिए
  rationale: לבוש सामान्यतः पहनावे या परिधान को दर्शाता है; यह किसी विशिष्ट वस्तु, जैसे चोगे, का अनावश्यक अर्थ नहीं जोड़ता।
- source_word: יַפִּילוּ גוֹרָל
  choice: चिट्ठी डालते हैं
  rationale: हिफ़ील נפל और גוֹרָל का संयुक्त अर्थ भाग निर्धारित करने के लिए चिट्ठी डालना है; हिंदी में यह स्थापित और सुबोध मुहावरा है।
theological_decisions:
- issue: मसीहाई अनुगूँज और नए नियम में प्रतिध्वनि
  choice: इब्रानी काव्य-वर्णन का सीधा अनुवाद किया गया है; क्रूस पर चढ़ाए जाने की भाषा मुख्य पाठ में नहीं जोड़ी गई।
  alternative: ऐसा परंपरा-आधारित अनुवाद जो यीशु के क्रूसारोहण में इसकी पूर्ति को मुख्य पाठ में प्रमुख बनाए।
  rationale: मूल इब्रानी पद अपने स्तर पर वस्त्र बाँटने और चिट्ठी डालने का वर्णन करता है। सुसमाचारों में इसकी मसीहाई प्रतिध्वनि महत्त्वपूर्ण है, पर उसे पाठ बदलने के बजाय पादटिप्पणी में दिखाना स्रोत-प्रधान अनुवाद के अनुरूप है।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण, सहज काव्यात्मक शैली रखी गई है। 'वस्त्र' और 'पहनावा' मूल के दो निकटार्थी शब्दों के समानांतर भेद को यथासंभव बनाए रखते हैं।
