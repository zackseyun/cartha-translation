base_translation:
  language: en
  yaml_path: translation/ot/psalms/022/001.yaml
  text: My God[a], my God[c][b], why have you forsaken me? Far from my salvation are the words of my roaring.
translation:
  language: hi
  text: हे मेरे परमेश्वर, मेरे परमेश्वर, तूने मुझे क्यों छोड़ दिया? मेरी दहाड़ के शब्द मेरे छुटकारे से दूर हैं।[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या ‘मेरे उद्धार से’ अथवा ‘मेरी सहायता से।’ इस अर्धपद का अधिक व्याख्यात्मक अनुवाद सम्भव है: ‘तू मुझसे इतना दूर क्यों है—मुझे छुड़ाने से और मेरी दहाड़-भरी पुकार से?’'
    reason: lexical_and_syntactic_alternative
  - marker: b
    text: या ‘मेरी कराह की बातें’ अथवा ‘मेरी पुकार के शब्द।’ इब्रानी में शाब्दिक रूप से ‘मेरी दहाड़ के शब्द’ है, जो घोर पीड़ा की प्रबल छवि प्रस्तुत करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלִי אֵלִי
  choice: हे मेरे परमेश्वर, मेरे परमेश्वर
  rationale: सम्बोधन, प्रथम पुरुष एकवचन सम्बन्धसूचक प्रत्यय और व्याकुल पुनरुक्ति—तीनों को बनाए रखता है। पहले पद में लगाया गया ‘हे’ हिन्दी में पूरे दोहराए हुए सम्बोधन पर स्वाभाविक रूप से लागू होता है।
- source_word: לָמָה
  choice: क्यों
  rationale: कारण पूछने वाले इब्रानी प्रश्नवाचक का सीधा और स्वाभाविक हिन्दी समानार्थक है।
- source_word: עֲזַבְתָּנִי
  choice: तूने मुझे क्यों छोड़ दिया
  rationale: क्रिया का अर्थ छोड़ देना या त्याग देना है। ‘छोड़ दिया’ आधुनिक सामान्य हिन्दी में स्वाभाविक है और विलाप की गंभीरता बनाए रखता है। परमेश्वर को एकवचन ‘तू’ कहकर संबोधित करना इब्रानी के एकवचन प्रत्यक्ष सम्बोधन और भजन की निकटता को दर्शाता है।
- source_word: רָחוֹק
  choice: दूर हैं
  rationale: इब्रानी के विधेय विशेषण को हिन्दी में स्वाभाविक विधेय के रूप में रखा गया है; बहुवचन ‘शब्द’ के अनुसार ‘हैं’ प्रयुक्त हुआ है।
- source_word: מִישׁוּעָתִי
  choice: मेरे छुटकारे से
  rationale: יְשׁוּעָה यहाँ संकट से बचाए जाने या छुड़ाए जाने का भाव रखता है। ‘छुटकारा’ तत्कालीन विलाप-संदर्भ में ठोस बचाव को व्यक्त करता है, जबकि ‘उद्धार’ सम्भव विकल्प है।
- source_word: דִּבְרֵי שַׁאֲגָתִי
  choice: मेरी दहाड़ के शब्द
  rationale: सम्बन्धवाचक रचना और שְׁאָגָה की तीव्र, गर्जना-जैसी व्याकुल पुकार की सजीव छवि को यथासम्भव बनाए रखता है।
theological_decisions:
- issue: मसीही महत्त्व वाले भजन में יְשׁוּעָה का अनुवाद
  choice: मेरे छुटकारे से
  alternative: मेरे उद्धार से; मेरी सहायता से
  rationale: निकट संदर्भ में संकट से ठोस बचाव प्रमुख है। ‘छुटकारा’ बाद की किसी संकीर्ण धर्मवैज्ञानिक परिभाषा को आरोपित नहीं करता; वैध विकल्प पादटिप्पणी में रखा गया है।
- issue: दूसरे अर्धपद की संक्षिप्त और कठिन वाक्यरचना
  choice: मेरे छुटकारे से मेरी दहाड़ के शब्द दूर हैं
  alternative: तू मुझे छुड़ाने से और मेरी दहाड़ की पुकार से दूर क्यों है?
  rationale: मुख्य पाठ इब्रानी में उपस्थित शब्दों और विधेय संरचना को सुरक्षित रखता है तथा लुप्त कर्ता और प्रश्नवाचक बल जोड़कर कठिनाई को चुपचाप हल नहीं करता। अधिक व्याख्यात्मक सम्भावना पादटिप्पणी में दी गई है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य रखी गई है। ‘दहाड़’ जानबूझकर सजीव और तीव्र है; दूसरे अर्धपद की इब्रानी असहजता को पूरी तरह समतल करने के बजाय सीमित रूप में सुरक्षित रखा गया है।
