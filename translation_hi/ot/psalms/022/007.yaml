  text: मुझे देखनेवाले सभी मेरा उपहास करते हैं; वे होंठ बिचकाते हैं[a] और सिर हिलाते हैं[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वे होंठ बाहर निकालते हैं।” यह हिब्रू मुहावरा तिरस्कार प्रकट करनेवाली मुख-मुद्रा का संकेत करता है।
    reason: lexical_alternative
  - marker: b
    text: या, “वे सिर मटकाते हैं।” यह तिरस्कार की भाव-भंगिमा है, जिसकी प्रतिध्वनि सुसमाचारों के दुःखभोग-वर्णनों में भी मिलती है।
    reason: cross_reference
lexical_decisions:
- source_word: כָּל רֹאַי
  choice: मुझे देखनेवाले सभी
  rationale: כָּל के समग्र अर्थ और רֹאַי के ‘मुझे देखनेवाले’ भाव को स्वाभाविक हिन्दी संबंधवाचक संरचना में व्यक्त करता है।
- source_word: יַלְעִגוּ לִי
  choice: मेरा उपहास करते हैं
  rationale: לעג के तिरस्कारपूर्ण उपहास को स्पष्ट, वर्तमान और गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: יַפְטִירוּ בְשָׂפָה
  choice: वे होंठ फैलाते हैं
  rationale: कठिन हिब्रू मुहावरे की शारीरिक छवि को बनाए रखता है और उसे केवल वाणी या किसी एक निश्चित भाव-भंगिमा के रूप में नहीं सुलझाता।
- source_word: יָנִיעוּ רֹאשׁ
  choice: सिर हिलाते हैं
  rationale: सिर की तिरस्कारसूचक गति के लिए सहज हिन्दी है और मूल की क्रियात्मक छवि को सुरक्षित रखता है।
theological_decisions:
- issue: बाद की मसीही व्याख्या में मसीह-संबंधी प्रयोग
  choice: पद को पहले भजन में पीड़ित वक्ता की वाणी के रूप में अनूदित किया गया है।
  alternative: सुसमाचारों के दुःखभोग-वर्णनों में इसकी प्रतिध्वनि को मुख्य पाठ में स्पष्ट किया जा सकता था।
  rationale: हिब्रू पाठ स्वयं किसी बाद की पूर्ति का नाम नहीं लेता; इसलिए अनुवाद मूल संदर्भ और बाद की वैध पाठकीय प्रतिध्वनि के बीच का तनाव बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और सार्वजनिक पाठ के अनुकूल। कठिन शारीरिक मुहावरे को मुख्य पाठ में अपेक्षाकृत शाब्दिक रखा गया है और उसका अर्थ पादटिप्पणी में स्पष्ट किया गया है।
