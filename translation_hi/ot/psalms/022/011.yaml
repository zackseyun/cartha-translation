  yaml_path: translation/ot/psalms/022/011.yaml
  text: Do not be far from me[a], for trouble is near, for there is no helper.
translation:
  language: hi
  text: मुझसे दूर न रह, क्योंकि संकट निकट है, क्योंकि कोई सहायक नहीं है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַל תִּרְחַק מִמֶּנִּי
  choice: मुझसे दूर न रह
  rationale: निषेधात्मक विनती और רחק की स्थान-संबंधी उपमा को स्वाभाविक, काव्यात्मक हिन्दी में बनाए रखता है; ‘मुझे न छोड़’ मूल से अधिक अर्थ जोड़ता।
- source_word: כִּי
  choice: क्योंकि
  rationale: दोनों बार यह विनती का कारण प्रस्तुत करता है; पुनरावृत्ति इब्रानी काव्य की संरचना को बनाए रखती है।
- source_word: צָרָה קְרוֹבָה
  choice: संकट निकट है
  rationale: צָרָה के व्यापक अर्थ—संकट, विपत्ति या क्लेश—को अनावश्यक रूप से सीमित किए बिना आसन्न कठिनाई व्यक्त करता है।
- source_word: אֵין עוֹזֵר
  choice: कोई सहायक नहीं है
  rationale: अस्तित्व के निषेध और עוֹזֵר के व्यक्तिवाचक कृदन्त-अर्थ, ‘सहायता करने वाला’, दोनों को सुरक्षित रखता है।
theological_decisions:
- issue: विलाप में परमेश्वर की दूरी की भाषा
  choice: मुझसे दूर न रह
  alternative: मुझे न छोड़
  rationale: मूल पाठ स्थान-संबंधी भाषा का प्रयोग करता है। ‘मुझे न छोड़’ परित्याग का अधिक प्रबल दावा जोड़ देता; चुना हुआ रूप विलाप के तनाव को बिना समझाए या नरम किए बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और प्रार्थनात्मक काव्य-शैली। ‘तू’ सर्वनाम को प्रत्यक्ष रूप से न रखकर क्रिया का एकवचन आत्मीय रूप बनाए रखा गया है, जो भजन की ईश्वर-संबोधित विनती में स्वाभाविक है।
