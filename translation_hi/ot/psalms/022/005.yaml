  text: אֵלֶ֣י/ךָ זָעֲק֣וּ וְ/נִמְלָ֑טוּ בְּ/ךָ֖ בָטְח֣וּ וְ/לֹא בֽוֹשׁוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/022/005.yaml
  text: To you they cried out and were delivered[b][a]; in you they trusted and were not put to shame.
translation:
  language: hi
  text: 'उन्होंने तुझे पुकारा और बचाए गए[a];

    उन्होंने तुझ पर भरोसा रखा और लज्जित नहीं हुए[b]।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “बच निकले” अथवा “छुड़ाए गए।” इब्रानी क्रिया संकट से निकलने या बचाए जाने—दोनों का भाव दे सकती है।
    reason: lexical_alternative
  - marker: b
    text: या “अपमानित नहीं हुए” अथवा “निराश नहीं हुए।” यहाँ इब्रानी शब्द उस लज्जा या निराशा को भी व्यक्त कर सकता है जो भरोसा विफल होने पर होती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶיךָ
  choice: तुझे
  rationale: אֶל के साथ द्वितीय पुरुष एकवचन प्रत्यय पुकार की दिशा और लक्ष्य बताता है। हिंदी में ‘तुझे पुकारा’ स्वाभाविक और स्पष्ट है।
- source_word: זָעֲקוּ
  choice: पुकारा
  rationale: זעק संकट में सहायता के लिए तीव्र पुकार को व्यक्त करता है। संदर्भ में ‘पुकारा’ सामान्य पाठक के लिए सहज है और प्रार्थनापूर्ण विनती का भाव रखता है।
- source_word: וְנִמְלָטוּ
  choice: और बचाए गए
  rationale: מלט के निफ़अल रूप में बच निकलने अथवा बचाए जाने—दोनों का भाव हो सकता है। परमेश्वर को पुकारने के परिणाम के रूप में ‘बचाए गए’ प्रसंगानुकूल है, जबकि विकल्प पाद-टिप्पणी में सुरक्षित है।
- source_word: בְּךָ
  choice: तुझ पर
  rationale: בטח के साथ ב भरोसे के आधार या लक्ष्य को बताता है। आधुनिक हिंदी में ‘तुझ पर भरोसा रखना’ स्वाभाविक प्रयोग है।
- source_word: בָטְחוּ
  choice: भरोसा रखा
  rationale: בטח का अर्थ भरोसा करना या किसी पर निर्भर रहना है। ‘भरोसा रखा’ सरल, प्रतिष्ठित और प्रसंगानुकूल है।
- source_word: וְלֹא בֹשׁוּ
  choice: और लज्जित नहीं हुए
  rationale: בוש लज्जित, अपमानित अथवा आशा विफल होने से निराश होने का अर्थ दे सकता है। ‘लज्जित नहीं हुए’ मूल की संक्षिप्तता और अर्थगत व्यापकता को बनाए रखता है।
theological_decisions:
- issue: נִמְלָטוּ में उद्धार की प्रकृति
  choice: परमेश्वर को पुकारने के बाद बचाए जाना
  alternative: अपने संकट से बच निकलना
  rationale: वाक्य का क्रम पुकार और उसके परिणाम को जोड़ता है, इसलिए कर्मवाच्य ‘बचाए गए’ परमेश्वर द्वारा सहायता के प्रसंगगत संकेत को व्यक्त करता है; फिर भी मूल क्रिया में ‘बच निकले’ का अर्थ संभव है और उसे पाद-टिप्पणी में रखा गया है।
- issue: בֹשׁוּ में लज्जा, अपमान और निराशा का संबंध
  choice: लज्जित नहीं हुए
  alternative: अपमानित नहीं हुए / निराश नहीं हुए
  rationale: ‘लज्जित नहीं हुए’ भरोसे के विफल सिद्ध होने से होने वाली सामाजिक लज्जा और व्यक्तिगत निराशा—दोनों की संभावना खुली रखता है, बिना किसी एक अर्थ को अनावश्यक रूप से निश्चित किए।
translation_notes:
  register: आधुनिक मानक हिंदी में सरल, काव्यात्मक और गरिमापूर्ण शैली रखी गई है। परमेश्वर के लिए निकट और पारंपरिक एकवचन संबोधन ‘तुझे/तुझ पर’ प्रयोग किया गया है। दोनों समानांतर पंक्तियों की संरचना सुरक्षित रखी गई है।
