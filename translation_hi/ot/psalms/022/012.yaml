  text: סְ֭בָבוּ/נִי פָּרִ֣ים רַבִּ֑ים אַבִּירֵ֖י בָשָׁ֣ן כִּתְּרֽוּ/נִי׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/022/012.yaml
  text: Many bulls surround me[a]; mighty bulls of Bashan encircle me.
translation:
  language: hi
  text: 'बहुत-से बैलों ने मुझे घेर लिया है;

    बाशान[a] के बलवान बैलों ने मुझे चारों ओर से घेर रखा है।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: बाशान यरदन के पूर्व का एक क्षेत्र था, जो अपने शक्तिशाली, हृष्ट-पुष्ट मवेशियों के लिए प्रसिद्ध था; यह पदबंध शक्तिशाली और भयावह विरोधियों का बिंब प्रस्तुत करता है।
    reason: cultural_note
lexical_decisions:
- source_word: סְבָבוּנִי
  choice: मुझे घेर लिया है
  rationale: סבב का अर्थ ‘चारों ओर घेरना’ है। पूर्ण क्रिया भजनकार की वर्तमान अवस्था को उसके पहले ही घिर चुके होने के रूप में दिखाती है; हिन्दी का पूर्ण वर्तमान इसे स्वाभाविक ढंग से व्यक्त करता है।
- source_word: פָּרִים רַבִּים
  choice: बहुत-से बैल
  rationale: פָּרִים, פַּר का बहुवचन है और यहाँ शत्रुतापूर्ण पशु-रूपक में ‘बैल’ स्वाभाविक है; רַבִּים की संख्या-सूचक शक्ति ‘बहुत-से’ से स्पष्ट होती है।
- source_word: אַבִּירֵי בָשָׁן
  choice: बाशान के बलवान बैल
  rationale: אַבִּירֵי का अर्थ ‘बलवान/शक्तिशाली जन’ हो सकता है, पर पहले चरण के बैलों के समानांतर यहाँ भी गोवंशीय बिंब जारी है। ‘बलवान बैल’ उस निहित संज्ञा को स्पष्ट रखते हुए रूपक बचाता है।
- source_word: כִּתְּרוּנִי
  choice: मुझे चारों ओर से घेर रखा है
  rationale: כתר यहाँ ‘चारों ओर घेरना’ व्यक्त करता है। ‘घेर रखा है’ पहले चरण की समानांतरता बनाए रखता है और पूरी तरह घेरे जाने की तीव्रता को स्वाभाविक हिन्दी में प्रकट करता है।
- source_word: בָשָׁן
  choice: बाशान
  rationale: स्थान-नाम का प्रचलित हिन्दी लिप्यंतरण रखा गया है; इसकी सांस्कृतिक संगति पादटिप्पणी में समझाई गई है।
theological_decisions:
- issue: विरोधियों के लिए बैलों का रूपक
  choice: मुख्य पाठ में ‘बैल’ का प्रत्यक्ष रूपक बनाए रखा गया।
  alternative: ‘शत्रु’ कहकर रूपक का अर्थ खोल देना।
  rationale: इब्रानी पाठ विरोधियों को स्पष्ट रूप से बैलों के बिंब में प्रस्तुत करता है। इसे ‘शत्रु’ में बदलना कविता की तीव्रता घटाता और स्रोत से अधिक व्याख्या जोड़ता।
- issue: אַבִּירֵי में संज्ञा की निहितता
  choice: समानांतर संदर्भ के आधार पर ‘बलवान बैल’ कहा गया।
  alternative: ‘बाशान के बलवान जन’ या केवल ‘बाशान के बलवान’।
  rationale: शब्द अपने आप में ‘बलवान जन’ कह सकता है, पर פָּרִים के साथ समानाधिकरण और बाशान के पशु-बिंब के कारण ‘बैल’ को स्पष्ट करना सर्वाधिक संदर्भ-संगत है; फिर भी रूपक को वास्तविक मानव विरोधियों में नहीं बदला गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज काव्यात्मक शैली रखी गई है। दोनों चरणों की समानांतरता बनाए रखने के लिए ‘घेर’ की पुनरावृत्ति स्वीकार की गई है, जबकि ‘घेर लिया है’ और ‘घेर रखा है’ से क्रियात्मक विविधता तथा घिर जाने की अवस्था दोनों व्यक्त होती हैं।
