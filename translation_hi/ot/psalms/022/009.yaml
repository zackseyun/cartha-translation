base_translation:
  language: en
  yaml_path: translation/ot/psalms/022/009.yaml
  text: For you are the one who brought me out from the womb[a], making me secure at my mother’s breasts.
translation:
  language: hi
  text: क्योंकि तू ही मुझे गर्भ से बाहर लाया; तूने मुझे मेरी माँ की छातियों पर सुरक्षित रखा।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तूने मुझे मेरी माँ की छातियों पर भरोसा दिलाया।”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले कथन के आधार को प्रस्तुत करता है और भजन के तर्कपूर्ण प्रवाह में स्वाभाविक है।
- source_word: אַתָּה
  choice: तू ही
  rationale: 'स्पष्ट सर्वनाम के बल को ‘ही’ द्वारा बनाए रखा गया है: कार्य करने वाला स्वयं परमेश्वर है।'
- source_word: גֹחִי
  choice: मुझे ... बाहर लाया
  rationale: जन्म के संदर्भ में यह गर्भ से बाहर लाने को दर्शाता है; इससे ठोस प्रसव-चित्र सुरक्षित रहता है।
- source_word: מִבָּטֶן
  choice: गर्भ से
  rationale: पूर्वसर्ग और संज्ञा का सीधा, स्वाभाविक हिन्दी रूप।
- source_word: מַבְטִיחִי
  choice: तूने मुझे ... निश्चिंत रखा
  rationale: हिफ़ील रूप सुरक्षा या भरोसे की अवस्था उत्पन्न करने का अर्थ दे सकता है। शैशव-संदर्भ में ‘निश्चिंत रखा’ सुरक्षा और आश्वस्तता को व्यक्त करता है, बिना नवजात में परिपक्व सचेत विश्वास आरोपित किए।
- source_word: עַל
  choice: पर
  rationale: माँ की छातियों से दूध पीने और आश्रय पाने की ठोस स्थिति को निकटता से प्रतिबिंबित करता है।
- source_word: שְׁדֵי
  choice: छातियों
  rationale: इब्रानी संज्ञा का विशिष्ट और अनावृत अर्थ ‘स्तन/छातियाँ’ है; यहाँ ‘छातियाँ’ सहज और गरिमापूर्ण है।
- source_word: אִמִּי
  choice: मेरी माँ की
  rationale: प्रथम पुरुष संबंधसूचक प्रत्यय को स्वाभाविक हिन्दी संबंध-रचना में सुरक्षित रखा गया है।
theological_decisions:
- issue: מַבְטִיחִי को शिशु के स्पष्ट ‘विश्वास’ के रूप में अनूदित किया जाए या व्यापक सुरक्षा/निश्चिंतता के रूप में
  choice: तूने मुझे निश्चिंत रखा
  alternative: तूने मुझे भरोसा करना सिखाया
  rationale: माँ की छातियों पर शिशु का संदर्भ सुरक्षा और आश्वस्तता की ठोस छवि को प्रमुख बनाता है। फिर भी ‘भरोसा कराने’ का अर्थ शब्द की दृष्टि से संभव और पारंपरिक है, इसलिए उसे पादटिप्पणी में रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी; परमेश्वर के लिए काव्यात्मक एकवचन ‘तू’ रखा गया है। भाषा सहज, गरिमापूर्ण और ठोस जन्म तथा शैशव-चित्र के निकट है।
