id: PSA.22.6
reference: Psalms 22:6
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/אָנֹכִ֣י תוֹלַ֣עַת וְ/לֹא אִ֑ישׁ חֶרְפַּ֥ת אָ֝דָ֗ם וּ/בְז֥וּי עָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/022/006.yaml
  text: But I am a worm and not a man[c][b][a], scorned by mankind and despised by the people.
translation:
  language: hi
  text: पर मैं तो कीड़ा हूँ, मनुष्य नहीं—मानवों की निंदा का पात्र और लोगों द्वारा तिरस्कृत।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/אָנֹכִי
  choice: पर मैं तो
  rationale: आरम्भिक וְ पिछले पदों की भरोसे-भरी बात के विपरीत तीखा विरोध व्यक्त करता है; אָנֹכִי का बल हिन्दी में ‘मैं तो’ से स्वाभाविक रूप से प्रकट होता है।
- source_word: תוֹלַעַת
  choice: कीड़ा
  rationale: यह शब्द कृमि/कीड़े को सूचित करता है और यहाँ अत्यन्त दीनता तथा अपमान का रूपक है; ‘कीड़ा’ सामान्य, स्पष्ट और अनावश्यक जैविक विशिष्टता से मुक्त है।
- source_word: וְ/לֹא אִישׁ
  choice: मनुष्य नहीं
  rationale: אִישׁ एक मनुष्य को सूचित करता है; हिन्दी में ‘मनुष्य नहीं’ वक्ता से मानवीय गरिमा छीन लिए जाने के तीखे विरोध को बनाए रखता है।
- source_word: חֶרְפַּת אָדָם
  choice: मानवों की निन्दा का पात्र
  rationale: חֶרְפַּת का अर्थ निन्दा, अपमान या ताना है और construct-वाक्यांश में वक्ता को सामूहिक मानवीय निन्दा का लक्ष्य बताता है। ‘निन्दा का पात्र’ संज्ञात्मक रूप तथा भाव दोनों को स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: וּ/בְזוּי עָם
  choice: लोगों की दृष्टि में तुच्छ
  rationale: בְזוּי निष्क्रिय भाव में तिरस्कृत अथवा तुच्छ समझे जाने को व्यक्त करता है और עָם सामूहिक ‘लोग’ है; यह हिन्दी प्रयोग सार्वजनिक तिरस्कार को स्पष्ट और सहज रूप से व्यक्त करता है।
theological_decisions:
- issue: मसीही/प्रतिरूपात्मक व्याख्या
  choice: पद को इब्रानी काव्य में वक्ता के अपमान और दीनता के कथन के रूप में अनूदित किया गया है।
  alternative: अनुवाद में स्पष्ट रूप से मसीह-संबंधी पूर्ति को सामने लाने वाली व्याख्यात्मक शब्दावली जोड़ना।
  rationale: भजन 22 का मसीही परम्परा और नए नियम में विशेष महत्व है, पर इस पद की इब्रानी भाषा स्वयं वक्ता के अपमान का चित्र प्रस्तुत करती है। इसलिए धर्मवैज्ञानिक संबंधों को अनुवाद में जोड़ने के बजाय व्यापक सन्दर्भ से उभरने दिया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी; गरिमापूर्ण पर सामान्य पाठक के लिए सहज। ‘मानवों’ और ‘लोगों’ से אָדָם तथा עָם का काव्यात्मक समानांतर भेद रखा गया है।
