  terminology: ‘कीड़ा,’ ‘मनुष्य,’ ‘मानवों,’ and ‘लोगों’ are suitable, preserving the poetic distinction between אָדָם and עָם without importing interpretive or theological language. ‘तिरस्कृत’ fittingly conveys public contempt.
