source:
  edition: WLC
  text: מֵ֥/אִתְּ/ךָ֗ תְֽהִלָּ֫תִ֥/י בְּ/קָהָ֥ל רָ֑ב נְדָרַ֥/י אֲ֝שַׁלֵּ֗ם נֶ֣גֶד יְרֵאָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/022/025.yaml
  text: From you comes my praise in the great assembly[a]; I will pay my vows before those who fear him.
translation:
  language: hi
  text: बड़ी सभा में मेरी स्तुति तुझसे आती है; जो उसका भय मानते हैं[a], उनके सामने मैं अपनी मन्नतें पूरी करूँगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से ‘जो उसका भय मानते हैं’ है; पहले आए सीधे संबोधन से एकरूपता रखने के लिए कुछ अनुवाद ‘जो तेरा भय मानते हैं’ लिखते हैं।
    reason: alternative_reading
lexical_decisions:
- source_word: מֵאִתְּךָ
  choice: तुझसे ही आती है
  rationale: מֵאֵת के साथ द्वितीय पुरुष एकवचन प्रत्यय स्रोत या उद्गम बताता है। हिन्दी में ‘आती है’ जोड़ने से स्वाभाविक वाक्य बनता है और यह भाव बना रहता है कि स्तुति का स्रोत परमेश्वर है। ‘ही’ इब्रानी पदक्रम में इस वाक्यांश पर दिए गए बल को व्यक्त करता है।
- source_word: תְהִלָּתִי
  choice: मेरी स्तुति
  rationale: यह संज्ञा स्तुति या प्रशंसा को दर्शाती है। ‘मेरी स्तुति’ सीधा और स्वाभाविक अनुवाद है; इसमें गीत या बलिदान का ऐसा भाव नहीं जोड़ा गया जो शब्द में स्पष्ट नहीं है।
- source_word: בְּקָהָל רָב
  choice: बड़ी सभा में
  rationale: קָהָל एकत्र समुदाय या सभा है और רָב यहाँ उसके बड़े होने को बताता है। ‘बड़ी सभा’ आधुनिक हिन्दी में स्पष्ट और उपासना के सामुदायिक प्रसंग के अनुकूल है।
- source_word: נְדָרַי
  choice: अपनी मन्नतें
  rationale: बहुवचन संज्ञा परमेश्वर से की गई प्रतिज्ञाओं को दर्शाती है। धार्मिक प्रसंग में ‘मन्नतें’ सामान्य हिन्दी में सहज है और अगले क्रियापद के साथ स्वाभाविक बैठती है।
- source_word: אֲשַׁלֵּם
  choice: पूरी करूँगा
  rationale: पिएल रूप में שׁלם का अर्थ चुकाना या पूरा करना है। मन्नतों के साथ ‘पूरी करूँगा’ आधुनिक हिन्दी में ‘चुकाऊँगा’ से अधिक स्वाभाविक है और प्रतिज्ञा निभाने का भाव ठीक व्यक्त करता है।
- source_word: נֶגֶד
  choice: के सामने
  rationale: यह शब्द किसी की उपस्थिति या दृष्टि के सामने होने का भाव देता है। ‘के सामने’ स्पष्ट और सहज हिन्दी है।
- source_word: יְרֵאָיו
  choice: जो उसका भय मानते हैं
  rationale: यह भय मानने वाले लोगों को सूचित करने वाला रूप है, जिसके साथ तृतीय पुरुष एकवचन प्रत्यय ‘उसका’ है। ‘भय मानते हैं’ परमेश्वर के प्रति श्रद्धामिश्रित भय की बाइबिलीय अभिव्यक्ति को बनाए रखता है।
theological_decisions:
- issue: द्वितीय पुरुष ‘तुझसे’ से तृतीय पुरुष ‘उसका’ की ओर सर्वनाम-परिवर्तन
  choice: 'मसोरेटिक पाठ का परिवर्तन बनाए रखा गया: ‘तुझसे ... जो उसका भय मानते हैं।’'
  alternative: 'एकरूपता के लिए तृतीय पुरुष को द्वितीय पुरुष करना: ‘जो तेरा भय मानते हैं।’'
  rationale: इब्रानी पाठ पहले परमेश्वर को सीधे संबोधित करता है और फिर उसके लिए तृतीय पुरुष प्रत्यय प्रयोग करता है। भजन-साहित्य में ऐसा शैलीगत परिवर्तन संभव है; इसे समतल करने के बजाय मूल पाठ की वास्तविक व्याकरणिक असंगति और उसका धर्मवैचारिक तनाव सुरक्षित रखा गया है। संदर्भ में ‘उसका’ परमेश्वर की ओर ही संकेत करता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सहज रखी गई है। ‘तुझसे’ भजन की परमेश्वर से निकट, प्रत्यक्ष संबोधन-शैली को बनाए रखता है; ‘मन्नतें पूरी करूँगा’ वर्तमान हिन्दी में स्वाभाविक है। पद के काव्यात्मक प्रवाह के लिए पहली पंक्ति में निहित क्रिया को ‘आती है’ के रूप में व्यक्त किया गया है।
