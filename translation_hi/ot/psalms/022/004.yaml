    reason: lexical_alternative
lexical_decisions:
- source_word: בְּךָ
  choice: तुझी पर
  rationale: בְּ के साथ द्वितीय पुरुष एकवचन प्रत्यय भरोसे के व्यक्तिगत लक्ष्य को दिखाता है। ‘तुझी पर’ स्वाभाविक हिन्दी है और बल को व्यक्त करता है, पर ‘केवल’ जैसी अनकही विशिष्टता नहीं जोड़ता।
- source_word: בָּטְחוּ
  choice: भरोसा रखा
  rationale: בטח सुरक्षित भरोसा या निर्भरता व्यक्त करता है। दोनों बार एक ही वाक्यांश रखकर इब्रानी की अर्थपूर्ण पुनरावृत्ति सुरक्षित की गई है।
- source_word: אֲבֹתֵינוּ
  choice: हमारे पुरखाओं
  rationale: אבות का शाब्दिक अर्थ ‘पिता’ है, पर वंशगत बहुवचन सन्दर्भ में आधुनिक हिन्दी का ‘पुरखा’ स्वाभाविक रूप से पूर्वज पिताओं को व्यक्त करता है और सामान्य पाठक के लिए स्पष्ट है।
- source_word: וַתְּפַלְּטֵמוֹ
  choice: और तूने उन्हें छुड़ाया
  rationale: פלט का अर्थ छुड़ाना, बचाना या निकल भागने देना है। ‘छुड़ाया’ दैवी उद्धार को स्वाभाविक और गरिमामय हिन्दी में व्यक्त करता है, बिना उसके ढंग को अनावश्यक रूप से निश्चित किए।
theological_decisions:
- issue: אֲבֹתֵינוּ का ऐतिहासिक और प्रतिनिधिक अर्थ
  choice: हमारे पुरखाओं
  alternative: हमारे पिताओं / हमारे पूर्वजों
  rationale: ‘पुरखाओं’ मूल के पुरुषवाची वंशगत स्वर को बनाए रखते हुए हिन्दी में ऐतिहासिक पूर्वजों का स्वाभाविक बोध कराता है; ‘पूर्वजों’ अधिक लिंग-तटस्थ होता और ‘पिताओं’ यहाँ कम स्वाभाविक लग सकता है।
translation_notes:
  register: आधुनिक, गरिमामय भजनात्मक हिन्दी; परमेश्वर के लिए निकट एकवचन ‘तू’ का प्रयोग। इब्रानी में בָּטְחוּ की पुनरावृत्ति को हिन्दी में भी ज्यों का त्यों बनाए रखा गया है।
