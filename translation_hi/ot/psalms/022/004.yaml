  source_fidelity: The draft preserves the repeated Hebrew verb בָּטְחוּ and correctly addresses God in the second-person singular. However, “तुझी पर” is not standard modern Hindi, and “छुड़ाया” can suggest releasing from a restraint more than the broad rescue/deliverance sense of וַתְּפַלְּטֵמוֹ. “बचाया” conveys the latter more directly in this context.
  naturalness: 'Correction is needed for idiomatic and grammatical modern Hindi: “तुझ पर” is standard, and the oblique plural after “हमारे” is “पुरखों,” not “पुरखाओं.” The revised line remains concise and suitably elevated for a psalm.'
