id: PSA.22.29
reference: Psalms 22:29
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: אָכְל֬וּ וַ/יִּֽשְׁתַּחֲוּ֨וּ כָּֽל דִּשְׁנֵי אֶ֗רֶץ לְ/פָנָ֣י/ו יִ֭כְרְעוּ כָּל יוֹרְדֵ֣י עָפָ֑ר וְ֝/נַפְשׁ֗/וֹ לֹ֣א חִיָּֽה׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/022/029.yaml
  text: All the prosperous of the earth will eat and bow down[c][b][a]; before him all who go down to the dust will kneel—even he who could not keep himself alive.
translation:
  language: hi
  text: पृथ्वी के सब समृद्ध लोग खाएँगे और दण्डवत् करेंगे[a]; उसके सामने वे सब घुटने टेकेंगे जो धूल में उतरते हैं[b]—यहाँ तक कि वह भी, जो अपने आपको जीवित नहीं रख सकता[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से, “पृथ्वी के सब मोटे लोग।” इसका आशय सम्भवतः समृद्ध या भरपेट लोगों से है।
    reason: lexical_alternative
  - marker: b
    text: या “वे सब जो धूल में उतरते हैं।” यहाँ “धूल” नश्वरता और मृत्यु का इब्रानी बिंब है।
    reason: lexical_alternative
  - marker: c
    text: अंतिम इब्रानी खंड कठिन है; शाब्दिक रूप से, “और उसने अपने प्राण/जीवन को जीवित नहीं रखा।” इसे प्रायः ऐसे व्यक्ति के विषय में समझा जाता है जो अपने आपको जीवित नहीं रख सकता।
    reason: alternative_reading
lexical_decisions:
- source_word: אָכְלוּ
  choice: खाएँगे
  rationale: काव्यात्मक और आगे की ओर संकेत करने वाले संदर्भ में पूर्ण रूप को भविष्य अर्थ में लिया गया है; यह आगामी सार्वभौमिक उपासना की दृष्टि से मेल खाता है।
- source_word: וַיִּשְׁתַּחֲווּ
  choice: दण्डवत् करेंगे
  rationale: यह क्रिया झुकने या भूमि पर दण्डवत् होने का शारीरिक चित्र देती है और संदर्भ में उपासना का भाव भी बनाए रखती है।
- source_word: כָּל דִּשְׁנֵי אֶרֶץ
  choice: पृथ्वी के सब समृद्ध लोग
  rationale: शाब्दिक अर्थ ‘पृथ्वी के सब मोटे लोग’ है, पर मुहावरे में आशय भरपेट और संपन्न लोगों से है; ‘समृद्ध’ आधुनिक हिन्दी में सामाजिक अर्थ स्पष्ट करता है।
- source_word: לְפָנָיו
  choice: उसके सामने
  rationale: पूर्वसर्गीय पद का सीधा और स्वाभाविक हिन्दी रूप।
- source_word: יִכְרְעוּ
  choice: घुटने टेकेंगे
  rationale: क्रिया घुटने मोड़ने या टेकने को दर्शाती है और पहले खंड के दण्डवत् करने से संबंधित किंतु अलग शारीरिक बिंब रखती है।
- source_word: כָּל יוֹרְדֵי עָפָר
  choice: वे सब जो धूल में उतरते हैं
  rationale: ‘धूल’ मृत्यु और नश्वरता का इब्रानी बिंब है; इसे ‘कब्र’ कहकर स्पष्ट करने के बजाय मूल चित्र सुरक्षित रखा गया है।
- source_word: וְנַפְשׁוֹ לֹא חִיָּה
  choice: यहाँ तक कि वह भी, जो अपने आपको जीवित नहीं रख सकता
  rationale: खंड का वाक्य-विन्यास कठिन है। यह रूप सामान्य व्याख्या व्यक्त करता है कि मनुष्य अपना जीवन बचाए रखने में असमर्थ है, और मूल की कठिनता को पादटिप्पणी में दर्शाता है।
theological_decisions:
- issue: अंतिम खंड וְנַפְשׁוֹ לֹא חִיָּה का अभिप्राय
  choice: ऐसे व्यक्ति का उल्लेख जो अपने आपको जीवित नहीं रख सकता
  alternative: ‘और उसने अपने प्राण को जीवित नहीं रखा’ अथवा ‘और उसका प्राण जीवित नहीं रखा गया’
  rationale: इब्रानी वाक्य संक्षिप्त और विवादित है। चुना हुआ रूप समृद्ध लोगों और मृत्यु की ओर उतरने वालों के बीच काव्यात्मक विस्तार को स्पष्ट करता है, लेकिन किसी अतिरिक्त सिद्धान्तगत निष्कर्ष को नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सामान्य-पाठक-सुलभ रूप अपनाया गया है। ‘दण्डवत्’ और ‘घुटने टेकना’ दोनों मूल की अलग-अलग शारीरिक क्रियाओं को बनाए रखते हैं। पादटिप्पणी-चिह्न संबंधित पदों के तुरंत बाद क्रम से लगाए गए हैं।
