  yaml_path: translation/ot/psalms/022/021.yaml
  text: Save me from the mouth of the lion[b][a], and from the horns of the wild oxen—you have answered me.
translation:
  language: hi
  text: 'मुझे सिंह के मुँह से बचा,

    और जंगली बैलों[a] के सींगों से—

    तूने मुझे उत्तर दिया है।[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘जंगली साँड़’ अथवा ‘ऑरॉक्स’; इब्रानी शब्द एक शक्तिशाली जंगली गोवंशी पशु को सूचित करता है।
    reason: lexical_alternative
  - marker: b
    text: अंतिम वाक्यांश को प्रार्थना का उत्तर मिल जाने की अचानक घोषणा के रूप में समझा जा सकता है—‘तूने मुझे उत्तर दिया है’; इससे विनती से भरोसे की ओर मोड़ प्रकट होता है।
    reason: alternative_reading
lexical_decisions:
- source_word: הוֹשִׁיעֵנִי
  choice: मुझे बचा
  rationale: ישׁע के हिफ़ील आज्ञार्थक रूप और प्रथम पुरुष एकवचन प्रत्यय को सीधी तथा तात्कालिक उद्धार-पुकार के रूप में व्यक्त करता है। ‘बचा’ सामान्य आधुनिक हिन्दी में स्वाभाविक है और संकट से छुड़ाने का व्यापक भाव रखता है।
- source_word: מִפִּי
  choice: मुँह से
  rationale: इब्रानी का शाब्दिक अर्थ ‘मुँह से’ है। ‘जबड़ों से’ अधिक मुहावरेदार हो सकता था, पर ‘मुँह’ मूल काव्य-बिंब को ठीक रूप में बनाए रखता है।
- source_word: אַרְיֵה
  choice: सिंह
  rationale: एकवचन संज्ञा को हिन्दी में जातिवाचक और सजीव काव्य-बिंब के रूप में स्वाभाविक ढंग से रखा गया है; हिन्दी में यहाँ किसी निश्चयवाचक उपपद की आवश्यकता नहीं है।
- source_word: וּמִקַּרְנֵי
  choice: और ... के सींगों से
  rationale: संयोजक और संबंधसूचक उपसर्ग दूसरी संकट-छवि को पहली पुकार से जोड़ते हैं। ‘सींग’ को ठोस और काव्यात्मक बिंब के कारण अक्षरशः बनाए रखा गया है।
- source_word: רֵמִים
  choice: जंगली बैलों
  rationale: רְאֵם/רֵמִים एक शक्तिशाली जंगली गोवंशी पशु को सूचित करता है। ‘जंगली बैल’ आधुनिक हिन्दी पाठक के लिए स्पष्ट है; ‘ऑरॉक्स’ अधिक प्राणीवैज्ञानिक रूप से विशिष्ट, पर कम परिचित है।
- source_word: עֲנִיתָנִי
  choice: तूने मुझे उत्तर दिया है
  rationale: ענה का काल रूप पूर्ण क्रिया, द्वितीय पुरुष पुल्लिंग एकवचन, प्रथम पुरुष एकवचन कर्म-प्रत्यय सहित है। पूर्णतासूचक हिन्दी रूप अचानक प्रार्थना से उत्तर मिलने के विश्वास की ओर हुए मोड़ को व्यक्त करता है।
theological_decisions:
- issue: क्या עֲנִיתָנִי को जारी विनती समझा जाए या प्रार्थना का उत्तर मिल जाने की घोषणा
  choice: 'घोषणा: ‘तूने मुझे उत्तर दिया है’'
  alternative: इसे पहले आज्ञार्थक के साथ जुड़ी विनती मानना, जैसे ‘जंगली बैलों के सींगों से मुझे बचा/मेरी सुन’
  rationale: इब्रानी रूप आज्ञार्थक नहीं, बल्कि पूर्ण क्रिया है। विनती से भरोसे और आगे आने वाली स्तुति की ओर अचानक परिवर्तन भजन की साहित्यिक गति के अनुकूल है। विराम-चिह्न और पादटिप्पणी इस तनाव को मिटाने के बजाय पाठक के सामने रखते हैं।
translation_notes:
  register: भाषा आधुनिक, सरल और गरिमापूर्ण रखी गई है। ‘तूने’ भजन में परमेश्वर को किए गए सीधे, निकट संबोधन को स्वाभाविक हिन्दी काव्य-शैली में व्यक्त करता है। पंक्ति-विभाजन और दीर्घ विराम विनती से उत्तर-घोषणा की ओर अचानक परिवर्तन को उभारते हैं।
