  text: I will declare your name to my brothers[a]; in the midst of the assembly I will praise you.
translation:
  language: hi
  text: मैं अपने भाइयों[a] को तेरे नाम की घोषणा करूँगा; सभा के बीच में मैं तेरी स्तुति करूँगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, यदि इस पारिवारिक संबोधन को प्रसंग में समावेशी समझा जाए, “अपने भाई-बहनों को”; इब्रानी पाठ का शाब्दिक अर्थ “अपने भाइयों को” है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲסַפְּרָה
  choice: मैं वर्णन करूँगा
  rationale: पिएल रूप यहाँ बताने, सुनाने या घोषित करने का भाव देता है। ‘वर्णन करूँगा’ परमेश्वर के नाम और कार्यों को सार्वजनिक रूप से सुनाने का अर्थ स्वाभाविक ढंग से व्यक्त करता है।
- source_word: שִׁמְךָ
  choice: तेरे नाम
  rationale: इब्रानी मुहावरे ‘तेरा नाम’ को बनाए रखा गया है; यह केवल संबोधन नहीं, बल्कि परमेश्वर के प्रकट चरित्र और कीर्ति की ओर भी संकेत कर सकता है।
- source_word: לְאֶחָי
  choice: अपने भाइयों से
  rationale: मूल शब्द पुल्लिंग बहुवचन है और उस पर प्रथम पुरुष एकवचन संबंधसूचक प्रत्यय है। ‘अपने भाइयों’ मूल रूप को सुरक्षित रखता है; व्यापक समावेशी आशय की संभावना पादटिप्पणी में दी गई है।
- source_word: בְּתוֹךְ
  choice: के बीच में
  rationale: यह सभा के भीतर सार्वजनिक उपस्थिति का स्थानिक भाव बनाए रखता है और आधुनिक हिन्दी में स्वाभाविक है।
- source_word: קָהָל
  choice: सभा
  rationale: קָהָל एकत्र हुए समुदाय को दर्शाता है। ‘सभा’ स्पष्ट, संक्षिप्त और अपेक्षाकृत परंपरा-निरपेक्ष शब्द है।
- source_word: אֲהַלְלֶךָּ
  choice: मैं तेरी स्तुति करूँगा
  rationale: הלל के पिएल रूप का सीधा अर्थ ‘स्तुति करना’ है; कर्मवाचक प्रत्यय को ‘तेरी’ से व्यक्त किया गया है, बिना गायन का अतिरिक्त भाव जोड़े।
theological_decisions:
- issue: सार्वजनिक उपासना के प्रसंग में लिंग-सूचक पारिवारिक संबोधन
  choice: अपने भाइयों से
  alternative: अपने भाई-बहनों से
  rationale: इब्रानी पाठ में संज्ञा स्पष्टतः पुल्लिंग बहुवचन है, इसलिए मुख्य पाठ में उसी रूप को रखा गया है। यदि प्रसंग में संबोधन पूरे विश्वास-समुदाय के लिए प्रतिनिधिक रूप से समझा जाए, तो समावेशी आशय की संभावना पादटिप्पणी में बताई गई है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और काव्यात्मक हिन्दी। परमेश्वर के लिए निकट संबोधन ‘तेरा/तेरी’ रखा गया है। दोनों समानांतर पंक्तियों में भविष्यत् संकल्प का भाव सुरक्षित है।
