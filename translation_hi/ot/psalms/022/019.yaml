  text: परन्तु तू, हे याहवे, दूर न रह; हे मेरे बल[a], मेरी सहायता के लिए शीघ्र आ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'हिब्रू: ‘मेरा बल’; इसे ‘मेरी सहायता’ या, यहाँ कम सम्भावित रूप से, ‘मेरी हरिणी’ भी समझा गया है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אַתָּה
  choice: परन्तु ... तू
  rationale: संयोजक और स्वतंत्र सर्वनाम पिछले संकट के वर्णन के विपरीत एक प्रबल पुकार व्यक्त करते हैं; हिन्दी में ‘परन्तु ... तू’ इस विरोध को स्वाभाविक रूप से रखता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: चार-अक्षरीय ईश्वरीय नाम को किसी उपाधि से बदलने के बजाय हिन्दी में प्रचलित नाम-रूप ‘यहोवा’ से व्यक्त किया गया है।
- source_word: אַל תִּרְחָק
  choice: दूर न रह
  rationale: निषेधात्मक विनती क्रिया רחק के ‘दूर होना/रहना’ अर्थ को सीधे और स्वाभाविक हिन्दी में व्यक्त करती है।
- source_word: אֱיָלוּתִי
  choice: मेरे सामर्थ्य
  rationale: इस संदर्भ में यह संबोधन परमेश्वर को भजनकार के सामर्थ्य के रूप में प्रस्तुत करता है; शब्द का अर्थ विवादित है, इसलिए विकल्प पाद-टिप्पणी में दिए गए हैं।
- source_word: לְעֶזְרָתִי
  choice: मेरी सहायता के लिए
  rationale: पूर्वसर्गयुक्त संज्ञा का दिशात्मक/उद्देश्यात्मक भाव औपचारिकता और स्पष्टता के साथ सुरक्षित रहता है।
- source_word: חוּשָׁה
  choice: शीघ्र आ
  rationale: आज्ञार्थक रूप तत्काल सहायता की पुकार है। केवल ‘शीघ्रता कर’ की अपेक्षा ‘शीघ्र आ’ हिन्दी में अधिक स्वाभाविक है और संदर्भ में निहित आगमन को स्पष्ट करता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे / प्रभु
  rationale: मूल पाठ में व्यक्तिगत ईश्वरीय नाम है। उसे ‘प्रभु’ जैसी उपाधि से प्रतिस्थापित न करके हिन्दी पाठकों में परिचित लिप्यंतरण ‘यहोवा’ रखा गया है।
- issue: אֱיָלוּתִי का अर्थ
  choice: मेरे सामर्थ्य
  alternative: मेरी सहायता / मेरी हरिणी
  rationale: वाक्य-संदर्भ सहायता के लिए परमेश्वर से पुकार है, इसलिए अमूर्त अर्थ ‘सामर्थ्य’ सर्वाधिक संगत है; फिर भी कठिन हिब्रू रूप की वास्तविक शब्दार्थगत अनिश्चितता पाद-टिप्पणी में सुरक्षित रखी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण प्रार्थनात्मक लहजा रखा गया है। ‘तू’ निकट और प्रत्यक्ष संबोधन को बनाए रखता है; वाक्य संक्षिप्त और तात्कालिक विनती के अनुरूप है।
