  yaml_path: translation/ot/psalms/022/008.yaml
  text: “Commit yourself to Yahweh; let him rescue him; let him deliver him[a], since he delights in him!”
translation:
  language: hi
  text: “अपने को याहवे के भरोसे छोड़ दे![a] वह उसे बचाए, वह उसे छुड़ाए, क्योंकि वह उससे प्रसन्न है!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से, “याहवे की ओर लुढ़का दे।” यह मुहावरा अपने आप को या अपना मामला उसके भरोसे सौंप देने का अर्थ देता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: גֹּל אֶל
  choice: अपने को ... के भरोसे छोड़ दे
  rationale: गֹּל का शाब्दिक अर्थ ‘लुढ़का दे’ है, पर याहवे की ओर/पर लुढ़काने का यह मुहावरा अपने आप या अपना मामला उसके भरोसे सौंपने का भाव देता है। हिंदी में यह रूप आज्ञार्थक उपहास को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत नाम को उपाधि से बदलने के बजाय देवनागरी में लिप्यंतरित किया गया है।
- source_word: יְפַלְּטֵהוּ
  choice: वह उसे बचाए
  rationale: פלט के पिएल रूप में संकट से बचाने या निकलने देने का भाव है। यहाँ संभावनार्थक/चुनौतीसूचक रूप उपहास की ध्वनि बनाए रखता है।
- source_word: יַצִּילֵהוּ
  choice: वह उसे छुड़ाए
  rationale: נצל के हिफ़ील रूप का अर्थ किसी को खतरे से छुड़ाना या निकाल लेना है। ‘छुड़ाए’ पहले समानांतर क्रियापद से हल्का lexical भेद बनाए रखता है।
- source_word: כִּי חָפֵץ בּוֹ
  choice: क्योंकि वह उससे प्रसन्न है
  rationale: כִּי कारण बताता है, और חפץ ב का अर्थ किसी से प्रसन्न होना या उसमें आनंद लेना है। चुना हुआ हिंदी रूप संबंधपरक भाव को सहजता से व्यक्त करता है।
theological_decisions:
- issue: आज्ञा और तीसरे पुरुष के सर्वनामों के बीच परिवर्तन
  choice: पहले पीड़ित व्यक्ति को सीधे संबोधित किया गया है—‘अपने को ... छोड़ दे’—और फिर उसके विषय में तीसरे पुरुष में कहा गया है—‘वह उसे...’।
  alternative: सभी क्रियाओं और सर्वनामों को दूसरे पुरुष में कर देना, या आरंभिक आज्ञा को ‘उसे याहवे को सौंप दो’ बनाना।
  rationale: גֹּל स्पष्टतः दूसरे पुरुष एकवचन की आज्ञा है, जबकि दोनों अगले क्रियापद तीसरे पुरुष हैं और उनके कर्मवाचक प्रत्यय भी तीसरे पुरुष के हैं। हिंदी में यह व्याकरणिक और आलंकारिक तनाव सुरक्षित रखा गया है; इसे चुपचाप समतल नहीं किया गया।
- issue: חָפֵץ בּוֹ में कर्ता और सर्वनाम-संदर्भ
  choice: ‘वह उससे प्रसन्न है’ के रूप में सर्वनामात्मक संरचना बनाए रखी गई है।
  alternative: स्पष्ट करके ‘याहवे उस पीड़ित से प्रसन्न है’ लिखना।
  rationale: संदर्भ से आशय समझ में आता है, पर मूल पाठ नामों को दोहराकर संदर्भ स्पष्ट नहीं करता। इसलिए उसकी संक्षिप्तता और कुछ हद तक सर्वनामगत अस्पष्टता सुरक्षित रखी गई है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। प्रत्यक्ष उपहास की तीखी आज्ञार्थक ध्वनि तथा दूसरे पुरुष से तीसरे पुरुष में मूल पाठ का अचानक परिवर्तन सुरक्षित है। ‘याहवे’ को ईश्वरीय नाम के रूप में रखा गया है।
