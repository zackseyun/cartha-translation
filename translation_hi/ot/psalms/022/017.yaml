    reason: lexical_alternative
lexical_decisions:
- source_word: אֲסַפֵּר
  choice: मैं … गिन सकता हूँ
  rationale: पिएल रूप का अर्थ ‘गिनना’ या ‘वर्णन करना’ हो सकता है। ‘मेरी सारी हड्डियाँ’ कर्म होने के कारण यहाँ एक-एक करके गिन पाने का भाव अधिक स्वाभाविक है; ‘सकता हूँ’ हिन्दी में इस भयावह दृश्यता और कृशता को सहज रूप से व्यक्त करता है।
- source_word: כָּל עַצְמוֹתָי
  choice: अपनी सारी हड्डियाँ
  rationale: यह सीधा और सजीव अनुवाद हिब्रू की समग्रता और वक्ता की शारीरिक दुर्दशा को बिना व्याख्यात्मक विस्तार के बनाए रखता है।
- source_word: הֵמָּה
  choice: वे
  rationale: स्वतंत्र और बलयुक्त सर्वनाम को स्पष्ट कर्ता ‘वे’ से व्यक्त किया गया है; इसका संकेत देखने वाले लोगों की ओर है।
- source_word: יַבִּיטוּ
  choice: देखते हैं
  rationale: क्रिया ध्यान लगाकर देखने का अर्थ देती है। ‘देखते हैं’ आधुनिक हिन्दी में स्वाभाविक है, जबकि अगली क्रिया इस दृष्टि की तीव्रता बढ़ाती है।
- source_word: יִרְאוּ
  choice: घूरते हैं
  rationale: पहली दर्शन-क्रिया के साथ इसकी जोड़ी बलाघात उत्पन्न करती है। ‘घूरते हैं’ लगातार और शत्रुतापूर्ण दृष्टि का भाव सहज हिन्दी में व्यक्त करता है, यद्यपि इसका मूल अर्थ सामान्यतः ‘देखना’ भी हो सकता है।
- source_word: בִי
  choice: मुझे
  rationale: दर्शन-संबंधी क्रियाओं के साथ हिन्दी में ‘मुझे देखते/घूरते हैं’ स्वाभाविक है और वक्ता को उस दृष्टि का लक्ष्य बनाए रखता है।
theological_decisions:
- issue: ईसाई परंपरा में मसीही प्रयोग
  choice: पद का अनुवाद उसके हिब्रू काव्यात्मक अर्थ के अनुसार किया गया है और मुख्य पाठ में क्रूस पर चढ़ाए जाने से जुड़ी कोई अतिरिक्त शब्दावली नहीं जोड़ी गई।
  alternative: परंपरा से अधिक प्रभावित अनुवाद इस पद की मसीह-संबंधी अनुगूँज को अधिक स्पष्ट कर सकता था।
  rationale: भजन 22 ईसाई व्याख्या में अत्यंत महत्वपूर्ण है, पर यह पंक्ति स्वयं दृश्य शारीरिक पीड़ा और शत्रुतापूर्ण दर्शकों का विलाप प्रस्तुत करती है। मूल शब्दों को बनाए रखने से व्यापक धर्मवैज्ञानिक संबंध संदर्भ से उभर सकते हैं, अनुवाद में जोड़े बिना।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘हड्डियाँ गिन सकता हूँ’ मूल बिंब की तीव्रता को बनाए रखता है, और ‘देखते हैं, घूरते हैं’ हिब्रू की दो समानार्थी क्रियाओं के काव्यात्मक बल को स्वाभाविक हिन्दी में व्यक्त करता है।
