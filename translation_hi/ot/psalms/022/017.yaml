  text: मैं अपनी सारी हड्डियाँ गिन सकता हूँ[a]; वे मुझे देखते हैं, मुझे निहारते हैं[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मैं अपनी सारी हड्डियाँ गिनता हूँ।” हिब्रू क्रिया का अर्थ “गिनना” या “गिनाकर बताना” हो सकता है, पर यहाँ “अपनी सारी हड्डियाँ” कर्म होने के कारण उन्हें एक-एक करके गिनने का अर्थ अधिक उपयुक्त है।
    reason: lexical_alternative
  - marker: b
