  edition: WLC
  text: יָ֘בֵ֤שׁ כַּ/חֶ֨רֶשׂ כֹּחִ֗/י וּ֭/לְשׁוֹנִ/י מֻדְבָּ֣ק מַלְקוֹחָ֑/י וְֽ/לַ/עֲפַר מָ֥וֶת תִּשְׁפְּתֵֽ/נִי׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/022/015.yaml
  text: My strength is dried up like a potsherd[a], and my tongue sticks to my jaws; you lay me in the dust of death.
translation:
  language: hi
  text: 'मेरा बल मिट्टी के ठीकरों की तरह सूख गया है,


    और मेरी जीभ मेरे जबड़ों से चिपक गई है[a];


    तू मुझे मृत्यु की धूल में रख देता है।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘मेरे तालू से।’ मुख के जिस भाग के लिए इब्रानी शब्द आया है, उसका अर्थ अनिश्चित है।
    reason: lexical_alternative
lexical_decisions:
- source_word: יָבֵשׁ
  choice: सूख गया है
  rationale: यह क्रिया सूख जाने या मुरझाने की अवस्था बताती है; पूर्ण हुई क्रिया के वर्तमान परिणाम को स्वाभाविक हिन्दी में व्यक्त किया गया है।
- source_word: כַּחֶרֶשׂ
  choice: मिट्टी के ठीकरा-सा
  rationale: חֶרֶשׂ मिट्टी के बर्तन या उसके टूटे टुकड़े को सूचित करता है। ‘ठीकरा’ सूखेपन और भंगुरता के काव्यात्मक बिंब को बनाए रखता है।
- source_word: כֹּחִי
  choice: मेरा बल
  rationale: यहाँ כֹּחַ शारीरिक सामर्थ्य या जीवन-शक्ति को सूचित करता है; ‘बल’ संक्षिप्त, स्वाभाविक और काव्यात्मक है।
- source_word: וּלְשׁוֹנִי
  choice: और मेरी जीभ
  rationale: मूल के सीधे शारीरिक संदर्भ को बिना अनावश्यक व्याख्या के रखा गया है।
- source_word: מֻדְבָּק
  choice: चिपक गई है
  rationale: निष्क्रिय कृदन्त किसी वस्तु के चिपका दिए जाने अथवा चिपकी अवस्था में होने को दर्शाता है; हिन्दी में यह चरम प्यास का शारीरिक चित्र स्पष्ट करता है।
- source_word: מַלְקוֹחָי
  choice: मेरे जबड़ों से
  rationale: यह दुर्लभ शब्द मुख के किसी भाग को सूचित करता है और उसका सटीक अर्थ अनिश्चित है। मुख्य पाठ में सम्भावित अर्थ ‘जबड़े’ रखा गया है तथा ‘तालू’ को पाद-टिप्पणी में दिया गया है।
- source_word: וְלַעֲפַר מָוֶת
  choice: मृत्यु की धूल में
  rationale: ל को यहाँ रखे जाने की दिशा या परिणति के रूप में समझा गया है। ‘मृत्यु की धूल’ मूल की संबंधात्मक और काव्यात्मक अभिव्यक्ति को सुरक्षित रखती है।
- source_word: תִּשְׁפְּתֵנִי
  choice: तू मुझे ... डाल देता है
  rationale: क्रिया का अर्थ रखना या स्थापित करना है। ‘डाल देता है’ हिन्दी में धूल में पहुँचाए जाने का स्वाभाविक और तीव्र चित्र देता है, जबकि दूसरे पुरुष के सीधे सम्बोधन को बनाए रखता है।
theological_decisions:
- issue: अन्तिम उपवाक्य में कर्तृत्व
  choice: 'परमेश्वर को सीधा सम्बोधन: ‘तू मुझे मृत्यु की धूल में डाल देता है।’'
  alternative: 'कर्तारहित या परिणामसूचक अनुवाद: ‘मैं मृत्यु की धूल में डाल दिया गया हूँ।’'
  rationale: इब्रानी क्रिया दूसरे पुरुष पुल्लिंग एकवचन है और उसका कर्म पहले पुरुष एकवचन है; इसलिए इसे परमेश्वर से सीधा सम्बोधन मानना सबसे स्वाभाविक है। यह कथन पीड़ित की दुर्दशा के पीछे परमेश्वर के कर्तृत्व और मानवीय शत्रुओं की भूमिका के बीच के धर्मवैज्ञानिक तनाव को समझाकर समाप्त नहीं करता, बल्कि बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, काव्यात्मक किन्तु सामान्य पाठक के लिए सुबोध रखी गई है। परमेश्वर से प्रार्थनात्मक सीधे सम्बोधन के कारण ‘तू’ का प्रयोग किया गया है। पंक्ति-विन्यास ने पद के तीन प्रमुख चित्रों—सूखा बल, चिपकी जीभ और मृत्यु की धूल—को स्पष्ट रखा है।
