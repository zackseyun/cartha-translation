translation:
  language: hi
  text: 'वे मेरे विरुद्ध अपना मुँह खोलते हैं,

    जैसे फाड़ने और दहाड़ने वाला सिंह।[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वे मेरे विरुद्ध अपना मुँह खोलते हैं—फाड़ने और दहाड़ने वाला सिंह।” इब्रानी में सिंह की छवि संक्षिप्त रूप में है और वहाँ ‘जैसे’ स्पष्ट रूप से नहीं आया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: פָּצ֣וּ
  choice: फाड़ते हैं
  rationale: פצה का अर्थ मुँह को चौड़ा खोलना है। सिंह की हिंसक छवि के संदर्भ में ‘मुँह फाड़ते हैं’ स्वाभाविक और सजीव है; इब्रानी पूर्ण क्रिया को काव्यात्मक जीवंतता के कारण वर्तमान काल में व्यक्त किया गया है।
- source_word: עָלַי
  choice: मेरे विरुद्ध
  rationale: עַל यहाँ शत्रुतापूर्ण दिशा व्यक्त करता है; ‘मेरे विरुद्ध’ इस भाव को स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
- source_word: פִּיהֶם
  choice: अपना मुँह
  rationale: इब्रानी में संज्ञा एकवचन और संबंधसूचक प्रत्यय बहुवचन है। ‘वे ... अपना मुँह’ हिन्दी में सामूहिक एकवचन को स्वाभाविक ढंग से सुरक्षित रखता है।
- source_word: אַרְיֵה
  choice: जैसे ... सिंह
  rationale: इब्रानी में तुलना-सूचक अव्यय नहीं है, पर संक्षिप्त समानाधिकरणात्मक सिंह-छवि प्रसंग में उपमा का कार्य करती है। हिन्दी में आशय स्पष्ट करने के लिए ‘जैसे’ जोड़ा गया है, और वैकल्पिक सीधा रूप पादटिप्पणी में रखा गया है।
- source_word: טֹרֵף
  choice: शिकार को चीरता
  rationale: טרף का कृदन्त सिंह की फाड़ने-चीरने वाली शिकारी क्रिया बताता है। ‘शिकार को’ हिन्दी में क्रिया की छवि को स्पष्ट और स्वाभाविक बनाता है, यद्यपि वह इब्रानी में व्यक्त कर्म नहीं है।
- source_word: וְשֹׁאֵג
  choice: और दहाड़ता हुआ
  rationale: שׁאג सिंह की दहाड़ के लिए सामान्य क्रिया है; ‘दहाड़ता हुआ’ इसका सीधा, प्रचलित हिन्दी रूप है।
