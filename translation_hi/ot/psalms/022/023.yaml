language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: יִרְאֵ֤י יְהוָ֨ה הַֽלְל֗וּ/הוּ כָּל זֶ֣רַע יַעֲקֹ֣ב כַּבְּד֑וּ/הוּ וְ/ג֥וּרוּ מִ֝מֶּ֗/נּוּ כָּל זֶ֥רַע יִשְׂרָאֵֽל׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/022/023.yaml
  text: You who fear Yahweh[a], praise him! All offspring of Jacob, honor him! Stand in awe of him, all offspring of Israel!
translation:
  language: hi
  text: 'हे याहवे का भय मानने वालो, उसकी स्तुति करो!


    याकूब के सभी वंशजो, उसका आदर करो!


    इस्राएल के सभी वंशजो, उससे भय मानो![a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उसके प्रति भययुक्त श्रद्धा रखो” अथवा “उसके प्रति विस्मययुक्त भय रखो।” इब्रानी क्रिया में भय और श्रद्धापूर्ण विस्मय दोनों का भाव है।
    reason: शब्दार्थ के निकट विकल्प और मूल क्रिया की व्यापक अर्थ-सीमा स्पष्ट करना।
lexical_decisions:
- source_word: יִרְאֵי יְהוָה
  choice: याहवे का भय माननेवालो
  rationale: यह रचना उन लोगों को सीधे संबोधित करती है जिनकी पहचान याहवे का भय मानने से होती है। संबोधन-रूप आगामी बहुवचन आज्ञाओं के अनुरूप है।
- source_word: יְהוָה
  choice: याहवे
  rationale: चतुर्वर्णी निजी नाम को उपाधि से बदलने के बजाय आधुनिक हिन्दी में उसके प्रचलित लिप्यंतरण से प्रस्तुत किया गया है।
- source_word: הַלְלוּהוּ
  choice: उसकी स्तुति करो
  rationale: बहुवचन आज्ञार्थक क्रिया और एकवचन पुल्लिंग कर्म-प्रत्यय दोनों को स्पष्ट रखता है; सर्वनाम का संकेत याहवे की ओर है।
- source_word: כָּל זֶרַע יַעֲקֹב
  choice: याकूब के सारे वंशजो
  rationale: זֶרַע यहाँ सामूहिक अर्थ में है। हिन्दी में सीधे संबोधन के लिए ‘वंशजो’ स्वाभाविक है और ‘सारे’ आह्वान की व्यापकता बनाए रखता है।
- source_word: כַּבְּדֻהוּ
  choice: उसका आदर करो
  rationale: כבד के पिएल आज्ञार्थक का मूल भाव किसी को उचित मान और महत्त्व देना है; ‘आदर करो’ संक्षिप्त और स्वाभाविक है।
- source_word: וְגוּרוּ מִמֶּנּוּ
  choice: उसके भय से काँपो
  rationale: גור और מן का संयोजन भययुक्त श्रद्धा तथा काँपने का भाव व्यक्त करता है। यह अनुवाद आरंभ के ‘भय मानने’ से संबंध भी रखता है और उसकी तीव्रता को सपाट नहीं करता।
- source_word: כָּל זֶרַע יִשְׂרָאֵל
  choice: इस्राएल के सारे वंशजो
  rationale: पहले समानांतर चरण के अनुरूप सामूहिक वंश और सीधे संबोधन—दोनों को बनाए रखा गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा
  rationale: मूल पाठ में निजी वाचा-नाम सीधे आया है। ‘याहवे’ उसे किसी उपाधि से प्रतिस्थापित किए बिना प्रस्तुत करता है।
- issue: וְגוּרוּ מִמֶּנּוּ में भय और श्रद्धा का संबंध
  choice: उसके भय से काँपो
  alternative: उसके प्रति श्रद्धा से विस्मित रहो / उससे डरो
  rationale: मूल क्रिया में केवल शांत सम्मान नहीं, भययुक्त श्रद्धा और काँपने की तीव्रता भी है। चुना हुआ रूप इस धार्मिक तनाव को बनाए रखता है; पादटिप्पणी निकट विकल्प बताती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सार्वजनिक पाठ के योग्य रखी गई है। तीनों आज्ञाओं की काव्यात्मक गति तथा याकूब/इस्राएल की समानांतरता सुरक्षित है। ‘वंशजो’ साधारण पाठक के लिए ‘सन्तान’ की अपेक्षा संबोधन में अधिक स्पष्ट है।
