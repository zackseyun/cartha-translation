  yaml_path: translation/ot/psalms/022/031.yaml
  text: They will come and declare his righteousness to a people yet to be born[c][b][a], that he has done it.
translation:
  language: hi
  text: वे आएँगे और आने वाली पीढ़ी को उसकी धार्मिकता की घोषणा करेंगे—कि उसने यह किया है।[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसके न्याय की।” इब्रानी शब्द ‘धार्मिकता’ के व्यापक अर्थ में न्यायपूर्ण और उद्धारकारी कार्य भी सम्मिलित कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: या, “जन्म लेने वाले लोगों को” अथवा “जो जन्म लेंगे उन लोगों को।”
    reason: lexical_alternative
  - marker: c
    text: या, “क्योंकि उसने यह किया है।” अंतिम इब्रानी वाक्यांश संक्षिप्त है; इसे घोषित बात की विषयवस्तु या घोषणा का कारण—दोनों माना जा सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: יָבֹאוּ
  choice: वे आएँगे
  rationale: בוא के क़ाल अपूर्ण 3 पुं. बहु. का भविष्याभिमुख अर्थ स्वाभाविक आधुनिक हिन्दी में व्यक्त होता है।
- source_word: וְיַגִּידוּ
  choice: और … वर्णन करेंगे
  rationale: נגד के हिफ़ील रूप में किसी बात को प्रकट करने या सुनाने का अर्थ है; यहाँ सार्वजनिक घोषणा का भाव रखते हुए ‘वर्णन करेंगे’ सहज हिन्दी देता है।
- source_word: צִדְקָתוֹ
  choice: उसकी धार्मिकता
  rationale: צדקה नैतिक धार्मिकता के साथ न्यायपूर्ण और उद्धारकारी कार्य को भी समेट सकती है। मुख्य पाठ में व्यापक, पारंपरिक समतुल्य रखा गया है और ‘न्याय’ को पादटिप्पणी में सुरक्षित किया गया है।
- source_word: לְעַם נוֹלָד
  choice: उस भावी जाति से
  rationale: לְ घोषणा के प्राप्तकर्ता को दर्शाता है और נוֹלָד आने वाले समय में जन्म लेने वाले जनसमुदाय की ओर संकेत करता है। ‘भावी जाति’ हिन्दी में संक्षिप्त और स्वाभाविक है।
- source_word: כִּי
  choice: कि
  rationale: यहाँ כִּי को घोषित बात की विषयवस्तु बताने वाला माना गया है; कारणसूचक अर्थ भी सम्भव है और पादटिप्पणी में दिया गया है।
- source_word: עָשָׂה
  choice: उसने यह किया है
  rationale: עשה का कर्म मूल पाठ में व्यक्त नहीं है। ‘यह’ जोड़ना हिन्दी में आवश्यक स्पष्टता देता है, फिर भी इब्रानी की संक्षिप्त और निर्णायक समाप्ति बनाए रखता है।
theological_decisions:
- issue: צדקה का अर्थ-क्षेत्र
  choice: मुख्य पाठ में ‘धार्मिकता’
  alternative: ‘न्याय’ अथवा ‘उद्धारकारी धार्मिकता’
  rationale: शब्द को केवल नैतिक गुण या केवल उद्धारकारी कार्य तक सीमित न करके उसकी व्यापकता सुरक्षित रखी गई है।
- issue: अंतिम वाक्यांश כִּי עָשָׂה का सम्बन्ध
  choice: 'घोषणा की विषयवस्तु: ‘कि उसने यह किया है’'
  alternative: 'घोषणा का कारण: ‘क्योंकि उसने यह किया है’'
  rationale: इब्रानी वाक्यांश अत्यन्त संक्षिप्त है और दोनों सम्बन्ध सम्भव हैं। मुख्य पाठ में प्रसंगानुकूल विषयवस्तु वाला अर्थ रखा गया है तथा कारणसूचक अर्थ पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: आधुनिक मानक हिन्दी में काव्यात्मक गरिमा और सामान्य बोधगम्यता का संतुलन रखा गया है। ‘भावी जाति’ भविष्य में जन्म लेने वाले जनसमुदाय को संक्षेप में व्यक्त करती है। सभी वास्तविक अर्थ-विकल्प पादटिप्पणियों में सुरक्षित हैं।
