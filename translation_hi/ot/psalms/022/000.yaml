  text: 'For the choirmaster: according to The Doe of the Dawn[a]. A psalm of David[b].'
translation:
  language: hi
  text: 'संगीत-निर्देशक के लिए: “भोर की हिरनी”[a] के अनुसार। दाऊद का[b] भजन।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यह इब्रानी पद संभवतः किसी धुन या संगीत-रचना का नाम है।
    reason: lexical_alternative
  - marker: b
    text: “दाऊद का” लेखकत्व, संबंध, संग्रह या समर्पण का संकेत दे सकता है; इब्रानी इससे अधिक स्पष्ट नहीं है।
    reason: alternative_reading
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: संगीत-निर्देशक के लिए
  rationale: भजन-संहिताओं के शीर्षकों में यह पद संगीत-प्रस्तुति का नेतृत्व करने वाले व्यक्ति को सूचित करता है। यह अनुवाद उपासना-संगीत के संदर्भ को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: עַל
  choice: के अनुसार
  rationale: यहाँ यह संभवतः धुन, संगीत-शैली या प्रस्तुति-संकेत का परिचय देता है। ‘के अनुसार’ इस अर्थ को खुला रखता है और ‘इस धुन पर’ जैसी अधिक निश्चित व्याख्या से बचता है।
- source_word: אַיֶּלֶת הַשַּׁחַר
  choice: भोर की हिरनी
  rationale: אַיֶּלֶת स्त्रीलिंग एकवचन है, इसलिए ‘हिरनी’ उपयुक्त है; הַשַּׁחַר का स्वाभाविक अर्थ ‘भोर’ है। उद्धरण-चिह्न इसे संभावित धुन अथवा संगीत-रचना के नाम के रूप में दिखाते हैं।
- source_word: מִזְמוֹר
  choice: भजन
  rationale: यह संगीत के साथ गाए जाने वाले स्तुति-गीत या भजन को सूचित करता है; हिन्दी बाइबलीय प्रयोग में ‘भजन’ स्पष्ट और प्रतिष्ठित है।
- source_word: לְדָוִד
  choice: दाऊद का
  rationale: शीर्षकों में לְ लेखकत्व, संबंध, संग्रह या समर्पण सूचित कर सकता है। ‘दाऊद का’ इस व्यापक संबंध को बनाए रखता है और ‘दाऊद द्वारा रचित’ जितना विशिष्ट नहीं है।
theological_decisions:
- issue: אַיֶּלֶת הַשַּׁחַר की व्याख्या
  choice: इसे संभावित धुन या संगीत-निर्देश के नाम के रूप में प्रस्तुत किया गया है
  alternative: इसे भजन की विषयवस्तु से जुड़ा प्रतीकात्मक शीर्षक मानना
  rationale: עַל के साथ शीर्षक की वाक्यरचना संगीत अथवा प्रस्तुति-संकेत की ओर अधिक स्वाभाविक रूप से इंगित करती है, किंतु पादटिप्पणी में इसकी संभाव्यता स्पष्ट रखी गई है।
- issue: לְדָוִד का आशय
  choice: दाऊद का
  alternative: दाऊद द्वारा रचित; दाऊद के लिए
  rationale: इब्रानी संबंधसूचक रूप लेखकत्व तक सीमित नहीं है; व्यापक हिन्दी अभिव्यक्ति मूल की अस्पष्टता और संभावित धार्मिक-साहित्यिक तनाव को सुरक्षित रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण शीर्षकीय रूप अपनाया गया है। छोटे वाक्यों से इब्रानी शीर्षक के अलग-अलग संगीत-संकेत स्पष्ट रहते हैं; संभावित धुन के नाम को उद्धरण-चिह्नों में रखा गया है।
