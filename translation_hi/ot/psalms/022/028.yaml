  text: For the kingdom belongs to Yahweh[b][a], and he rules over the nations.
translation:
  language: hi
  text: क्योंकि राजसत्ता याहवे[a] की है, और वही राष्ट्रों पर शासन करता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में YHWH, ईश्वरीय नाम; ‘याहवे’ इसका एक लिप्यंतरण है। इसे परंपरागत रूप से ‘प्रभु’ भी अनूदित किया जाता है। ‘राजसत्ता’ का अनुवाद ‘राज्य,’ ‘राजत्व’ या ‘शासन’ भी हो सकता है।
    reason: divine_name_and_lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह शब्द पिछली बात का आधार या कारण प्रस्तुत करता है; ‘क्योंकि’ उसके कारणसूचक बल को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: לַיהוָה
  choice: यहोवा की है
  rationale: לְ यहाँ स्वामित्व का संबंध व्यक्त करता है। हिन्दी में ‘यहोवा की है’ इस संबंध को स्पष्ट और सहज रूप से व्यक्त करता है।
- source_word: הַמְּלוּכָה
  choice: राजसत्ता
  rationale: מְלוּכָה का अर्थ राजत्व, राजकीय शासन या राज्य हो सकता है। ‘राजसत्ता’ यहाँ शासन करने के अधिकार और प्रभुता को स्वाभाविक हिन्दी में व्यक्त करती है, जबकि वैकल्पिक अर्थ को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: וּמֹשֵׁל
  choice: और वही ... शासन करता है
  rationale: Qal कृदन्त स्थायी और सामान्य वर्तमान सत्य व्यक्त करता है। ‘वही’ यहोवा को कर्ता के रूप में स्पष्ट करता और पद की समानांतरता को स्वाभाविक बनाता है।
- source_word: בַּגּוֹיִם
  choice: राष्ट्रों पर
  rationale: מֹשֵׁל के साथ בְ शासन के अधीन क्षेत्र या समूह को सूचित करता है; इसलिए ‘राष्ट्रों पर’ उपयुक्त है। גּוֹיִם यहाँ व्यापक रूप से राष्ट्रों को दर्शाता है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: मूल पाठ में व्यक्तिगत वाचा-नाम יהוה है। हिन्दी में व्यापक रूप से पहचाना जाने वाला लिप्यंतरण ‘यहोवा’ नाम को सामान्य उपाधि में बदले बिना सुरक्षित रखता है; वैकल्पिक पारंपरिक प्रस्तुति पादटिप्पणी में दी गई है।
- issue: מְלוּכָה की अर्थ-व्याप्ति
  choice: राजसत्ता यहोवा की है
  alternative: राज्य यहोवा का है; राजत्व यहोवा का है; शासन यहोवा का है
  rationale: इब्रानी संज्ञा राज्य, राजत्व अथवा शासन-सत्ता का बोध करा सकती है। ‘राजसत्ता’ सार्वभौम शासन के भाव को व्यक्त करती है, पर अर्थ-व्याप्ति को पादटिप्पणी में खुला रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण काव्यात्मक गद्य। ‘राजसत्ता’ सामान्य पाठक के लिए बोधगम्य रहते हुए मूल संज्ञा के राजकीय शासन-अर्थ को बनाए रखती है।
