  text: ס֣וּרוּ מִ֭מֶּ/נִּי כָּל פֹּ֣עֲלֵי אָ֑וֶן כִּֽי שָׁמַ֥ע יְ֝הוָ֗ה ק֣וֹל בִּכְיִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/006/008.yaml
  text: Depart from me[a], all you workers of wickedness[b], for Yahweh has heard the sound of my weeping.
translation:
  language: hi
  text: हे बुराई करनेवालो,[a] तुम सब मुझसे दूर हो जाओ, क्योंकि याहवे ने मेरे रोने की आवाज़ सुन ली है।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “अनर्थ करनेवालो” अथवा संक्षेप में “कुकर्मियो।”
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “मेरे रोने का स्वर।”
    reason: lexical_alternative
lexical_decisions:
- source_word: סוּרוּ מִמֶּנִּי
  choice: मुझसे दूर हो जाओ
  rationale: बहुवचन आज्ञार्थक क्रिया और ‘मुझसे’ के भाव को स्वाभाविक, स्पष्ट और प्रभावशाली आधुनिक हिन्दी में व्यक्त करता है।
- source_word: כָּל פֹּעֲלֵי אָוֶן
  choice: हे बुराई करनेवालो, तुम सब
  rationale: सम्बोधन और समावेशी ‘सब’ को स्पष्ट रखते हुए मूल के ‘बुराई करने/करनेवाले’ वाले क्रियात्मक बिम्ब को सुरक्षित रखा गया है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यह आज्ञा का कारण बताता है; आधुनिक हिन्दी में ‘क्योंकि’ स्पष्ट और स्वाभाविक है।
- source_word: שָׁמַע
  choice: सुन ली है
  rationale: पूर्ण क्रिया के वर्तमान-प्रासंगिक परिणाम और भजनकार के भरोसे को हिन्दी के पूर्ण वर्तमान रूप में व्यक्त करता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय देवनागरी में लिप्यंतरित किया गया है।
- source_word: קוֹל בִּכְיִי
  choice: मेरे रोने की आवाज़
  rationale: मूल के ‘मेरे रोने का स्वर/आवाज़’ को बनाए रखता है और श्रव्य विलाप का बिम्ब स्पष्ट करता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: पाठ में व्यक्तिगत ईश्वरीय नाम सीधे आया है; ‘याहवे’ मूल नाम के प्रचलित विद्वत्तापूर्ण उच्चारण का देवनागरी लिप्यंतरण है और उसे उपाधि में नहीं बदलता।
- issue: פֹּעֲלֵי אָוֶן की नैतिक अभिव्यक्ति
  choice: बुराई करनेवालो
  alternative: अनर्थ करनेवालो; कुकर्मियो
  rationale: यह चयन मूल के कर्म करने वाले बिम्ब और नैतिक नकारात्मकता दोनों को सुरक्षित रखता है, बिना अर्थ को किसी विशेष प्रकार के अपराध तक सीमित किए।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और मौखिक पाठ में सहज है। ‘हे’ सम्बोधन काव्यात्मक प्रत्यक्षता बनाए रखता है; ‘दूर हो जाओ’ आज्ञा की तीव्रता व्यक्त करता है।
