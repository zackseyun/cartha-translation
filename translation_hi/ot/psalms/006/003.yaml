- source_word: וְנַפְשִׁי
  choice: और मेरा प्राण
  rationale: נֶפֶשׁ यहाँ व्यक्ति के भीतरी जीवन/स्वयं को सूचित करता है। ‘मेरा प्राण’ काव्यात्मक और भावात्मक बल को बनाए रखता है; ‘मेरा जीवन’ या ‘मैं स्वयं’ भी सम्भव अर्थ हैं।
- source_word: נִבְהֲלָה מְאֹד
  choice: बहुत घबरा उठा है
  rationale: בהל तीव्र व्याकुलता, घबराहट या भय को व्यक्त करता है, और מְאֹד उसकी तीव्रता बढ़ाता है। यह अभिव्यक्ति आधुनिक हिन्दी में स्वाभाविक रहते हुए मूल की तीव्रता रखती है।
- source_word: וְאַתָּה
  choice: परन्तु हे
  rationale: वाव का मूल रूप ‘और’ है, किन्तु यहाँ विलाप में तीखा मोड़ आता है; सम्बोधन सहित ‘परन्तु हे’ हिन्दी में इस विरोधात्मक मोड़ को स्पष्ट करता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिन्दी बाइबलीय प्रयोग में परमेश्वर के व्यक्तिगत नाम YHWH का परिचित लिप्यंतरण ‘यहोवा’ है; पदवी से बदलने के बजाय नाम को रखा गया है।
- source_word: עַד מָתָי
  choice: कब तक?
  rationale: यह इब्रानी विलाप-सूत्र का स्वाभाविक हिन्दी रूप है और अधूरे, व्याकुल प्रश्न की तात्कालिकता बनाए रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: मूल में व्यक्तिगत नाम YHWH है। हिन्दी पाठकों के लिए स्थापित ‘यहोवा’ नाम को सुरक्षित रखता है; ‘याहवे’ निकटतर पुनर्निर्मित उच्चारण है, जबकि ‘प्रभु’ नाम के स्थान पर पदवी रखता है।
- issue: अपूर्ण प्रश्न ‘और/परन्तु तू, YHWH—कब तक?’
  choice: परन्तु हे यहोवा, कब तक?
  alternative: और तू, हे यहोवा, कब तक?
  rationale: मूल वाक्य जानबूझकर अधूरा और तनावपूर्ण है। हिन्दी में कोई पूरक क्रिया जोड़कर अर्थ को निश्चित नहीं किया गया; विरोधात्मक मोड़ मात्र स्पष्ट किया गया है।
