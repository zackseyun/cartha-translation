  text: עָֽשְׁשָׁ֣ה מִ/כַּ֣עַס עֵינִ֑/י עָֽ֝תְקָ֗ה בְּ/כָל צוֹרְרָֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/006/007.yaml
  text: My eye has wasted away from grief[a]; it has grown old because of all my enemies.
translation:
  language: hi
  text: शोक के मारे मेरी आँख क्षीण हो गई है; मेरे सभी शत्रुओं के कारण वह बूढ़ी हो गई है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עָשְׁשָׁה
  choice: क्षीण हो गई है
  rationale: यह क्रिया घटते जाने, चुकने या दुर्बल पड़ने का भाव देती है। आँख के संदर्भ में ‘क्षीण हो गई है’ शारीरिक ह्रास की छवि बनाए रखता है, बिना केवल दृष्टि के धुँधलेपन तक अर्थ सीमित किए।
- source_word: מִכַּעַס
  choice: शोक के मारे
  rationale: כַּעַס शोक, संताप, खीझ या व्यथा का संकेत दे सकता है। व्यक्तिगत विलाप में ‘शोक के मारे’ भावनात्मक कारण को स्वाभाविक हिंदी में व्यक्त करता है, जबकि शब्द की संभावित तीक्ष्णता को पूरी तरह विशिष्ट नहीं बनाता।
- source_word: עֵינִי
  choice: मेरी आँख
  rationale: इब्रानी पाठ में संज्ञा एकवचन है। हिंदी में भी विलाप और रोने से प्रभावित अंग के रूप में ‘आँख’ का एकवचन स्वाभाविक है।
- source_word: עָתְקָה
  choice: बूढ़ी हो गई है
  rationale: क्रिया का मूल भाव बूढ़ा, जीर्ण या घिसा हुआ हो जाना है। ‘बूढ़ी हो गई है’ मूल रूपक की असामान्य किंतु प्रभावशाली छवि को सुरक्षित रखता है।
- source_word: בְּכָל
  choice: मेरे सभी ... के कारण
  rationale: यहाँ संबंध कारण या अवसर का भाव देता है। हिंदी में ‘के कारण’ इसे स्पष्ट और सहज रूप से व्यक्त करता है।
- source_word: צוֹרְרָי
  choice: मेरे सभी शत्रुओं
  rationale: यह रूप उन लोगों को दर्शाता है जो विरोध या शत्रुता करते हैं। ‘शत्रु’ आधुनिक हिंदी में स्वाभाविक और प्रसंगानुकूल है।
theological_decisions: []
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और विलाप-काव्य के अनुरूप रखी गई है। ‘आँख बूढ़ी हो गई’ जैसे मूल रूपक को सहज बनाने के लिए सपाट अर्थ में नहीं बदला गया; इससे इब्रानी काव्य की तीव्रता और तनाव सुरक्षित रहते हैं।
