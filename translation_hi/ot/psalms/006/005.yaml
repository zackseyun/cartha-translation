base_translation:
  language: en
  yaml_path: translation/ot/psalms/006/005.yaml
  text: For in death there is no remembrance of you[a]; in Sheol who will give thanks to you?
translation:
  language: hi
  text: क्योंकि मृत्यु में तेरा स्मरण नहीं होता; शीओल में[a] कौन तेरा धन्यवाद करेगा?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या “कब्र में” अथवा “मृतकों के लोक में”; इब्रानी: “शीओल।”'
    reason: שְׁאוֹל के अर्थ-क्षेत्र और उसके संभावित हिंदी रूपों को सुरक्षित रखना।
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले पद की विनती का कारण प्रस्तुत करता है; हिंदी में ‘क्योंकि’ इस व्याख्यात्मक संबंध को स्वाभाविक रूप से व्यक्त करता है।
- source_word: אֵין
  choice: नहीं होता
  rationale: अस्तित्व-सूचक निषेध को ‘तेरा स्मरण नहीं होता’ में सहज और काव्यात्मक हिंदी मिली है।
- source_word: בַּמָּוֶת
  choice: मृत्यु में
  rationale: शाब्दिक स्थानवाचक भाव बनाए रखता है और दूसरे चरण के ‘अधोलोक में’ के साथ समानांतरता सुरक्षित करता है।
- source_word: זִכְרֶךָ
  choice: तेरा स्मरण
  rationale: זכר का अर्थ स्मरण अथवा स्मरणपूर्वक उल्लेख हो सकता है; ‘स्मरण’ मूल की व्यापकता और विलाप-काव्य की गरिमा बनाए रखता है।
- source_word: בִּשְׁאוֹל
  choice: अधोलोक में
  rationale: ‘अधोलोक’ मृतकों के लोक के प्राचीन इब्रानी भाव को सामान्य हिंदी पाठक के लिए समझने योग्य रखते हुए केवल ‘कब्र’ तक सीमित नहीं करता।
- source_word: מִי
  choice: कौन
  rationale: मूल के सीधे आलंकारिक प्रश्न को यथावत रखता है।
- source_word: יוֹדֶה לָּךְ
  choice: तेरा धन्यवाद करेगा
  rationale: ידה के हिफ़ील रूप का सीधा अर्थ धन्यवाद देना अथवा स्तुति करना है; ‘धन्यवाद करेगा’ मूल क्रिया को स्पष्ट रूप से दर्शाता है।
theological_decisions:
- issue: שְׁאוֹל का अनुवाद
  choice: अधोलोक
  alternative: कब्र; मृतकों का लोक; शीओल
  rationale: यह चयन शब्द को केवल भौतिक कब्र न मानकर मृतकों के लोक का व्यापक भाव बनाए रखता है। पादटिप्पणी वास्तविक शाब्दिक विकल्पों को खुला रखती है और परलोक के विषय में पद से अधिक निश्चित निष्कर्ष नहीं जोड़ती।
- issue: मृत्यु में परमेश्वर के स्मरण का अभाव
  choice: तेरा स्मरण नहीं होता
  alternative: कोई तेरा उल्लेख नहीं करता
  rationale: काव्यात्मक कथन को उसके आलंकारिक विलाप-संदर्भ में यथावत रखा गया है; इसे मृतकों की दशा पर कोई विस्तृत सिद्धांत बनाकर स्पष्ट नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिंदी, एकवचन निकट संबोधन ‘तेरा’ के साथ, जो भजन की परमेश्वर से सीधी और आत्मीय विनती के अनुरूप है। वाक्य काव्यात्मक समानांतरता तथा आलंकारिक प्रश्न को बनाए रखता है।
