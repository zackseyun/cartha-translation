  text: मैं कराहते-कराहते थक गया हूँ; हर रात मैं अपने बिछौने को जलमग्न कर देता हूँ[a]; अपने आँसुओं से अपनी शय्या भिगो देता हूँ।
  philosophy: optimal-equivalence
  footnotes:
