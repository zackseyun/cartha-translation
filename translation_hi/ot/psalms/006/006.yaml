- source_word: מִטָּתִי
  choice: अपने बिछौने
  rationale: מִטָּה सोने के स्थान या पलंग को बताता है; ‘बिछौना’ यहाँ सामान्य और काव्यात्मक दोनों है।
- source_word: בְּדִמְעָתִי
  choice: अपने आँसुओं से
  rationale: पूर्वसर्ग בְּ यहाँ साधन का बोध कराता है; आँसू शय्या भिगोने का माध्यम हैं।
- source_word: עַרְשִׂי
  choice: अपनी शय्या
  rationale: עֶרֶשׂ विश्राम की शय्या या पलंग है। ‘शय्या’ पहले पद के ‘बिछौने’ से हिब्रू समानांतरता की शब्द-विविधता बनाए रखता है।
- source_word: אַמְסֶה
  choice: भिगो देता हूँ
  rationale: मूल क्रिया का अर्थ गलाना या पिघला देना हो सकता है, पर इस संदर्भ में आँसुओं से पूरी तरह भिगो देना अभिप्रेत है।
