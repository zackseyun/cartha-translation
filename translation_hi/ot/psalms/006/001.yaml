id: PSA.6.1
reference: Psalms 6:1
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: יְֽהוָ֗ה אַל בְּ/אַפְּ/ךָ֥ תוֹכִיחֵ֑/נִי וְֽ/אַל בַּ/חֲמָתְ/ךָ֥ תְיַסְּרֵֽ/נִי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/006/001.yaml
  text: O Yahweh[a], do not rebuke me in your anger[c][b], and do not discipline me in your wrath.
translation:
  language: hi
  text: हे यहवे,[a] अपने क्रोध में मुझे न डाँटें, और अपने रोष में मुझे ताड़ना न दें।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: हिब्रू में परमेश्वर का व्यक्तिगत नाम יהוה (YHWH) है; यहाँ उसका लिप्यंतरण ‘यहवे’ किया गया है।
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: हे यहवे
  rationale: प्रत्यक्ष संबोधन को ‘हे’ से व्यक्त किया गया है और परमेश्वर के व्यक्तिगत नाम को उसके प्रचलित हिन्दी लिप्यंतरण ‘यहवे’ से रखा गया है।
- source_word: אַל
  choice: न
  rationale: निषेधात्मक विनती को संक्षिप्त और काव्यात्मक हिन्दी में व्यक्त करता है।
- source_word: בְּאַפְּךָ
  choice: अपने क्रोध में
  rationale: אַף का शाब्दिक अर्थ ‘नाक’ है, पर यहाँ इसका मुहावरेदार अर्थ ‘क्रोध’ है; בְּ को ‘में’ से व्यक्त किया गया है।
- source_word: תוֹכִיחֵנִי
  choice: मुझे न डाँट
  rationale: हिफ़ील रूप यहाँ दोष दिखाने अथवा झिड़कने के अर्थ में है; ‘डाँट’ सामान्य पाठक के लिए स्पष्ट और प्रार्थना के भाव के अनुकूल है।
- source_word: וְאַל
  choice: और ... न
  rationale: संयोजक और निषेध को बनाए रखते हुए दोनों समानांतर पंक्तियों की संरचना सुरक्षित रखी गई है।
- source_word: בַּחֲמָתְךָ
  choice: अपने रोष में
  rationale: חֵמָה तीव्र, जलते हुए कोप का बोध कराता है; ‘रोष’ पहली पंक्ति के ‘क्रोध’ से सूक्ष्म भेद रखते हुए गरिमामय काव्यात्मक भाषा देता है।
- source_word: תְיַסְּרֵנִי
  choice: मुझे ताड़ना न दे
  rationale: पिएल रूप יסר सुधारने के उद्देश्य से अनुशासन या ताड़ना देने को सूचित करता है; ‘ताड़ना देना’ दंड तक अर्थ को सीमित नहीं करता।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में व्यक्तिगत वाचा-नाम सीधे आया है। ‘यहवे’ उसे उपाधि में बदलने के बजाय नाम के रूप में सुरक्षित रखता है।
- issue: ईश्वरीय अप्रसन्नता के दो समानांतर शब्दों का भेद
  choice: क्रोध / रोष
  alternative: क्रोध / प्रचण्ड क्रोध; कोप / रोष
  rationale: אַף और חֵמָה परस्पर निकटार्थी हैं, फिर भी अलग शब्द हैं। दो हिन्दी शब्द समानांतरता और अर्थगत सूक्ष्म भेद दोनों को बनाए रखते हैं।
- issue: भजनकार की विनती का आशय
  choice: क्रोध में डाँटने और रोष में ताड़ना देने से रोकने की विनती
  alternative: किसी भी प्रकार की डाँट या अनुशासन न देने की विनती
  rationale: दोनों क्रियाएँ ‘अपने क्रोध में’ और ‘अपने रोष में’ से विशेषित हैं। अनुवाद इस तनाव को बनाए रखता है और यह निष्कर्ष नहीं जोड़ता कि भजनकार हर प्रकार के सुधार को अस्वीकार कर रहा है।
translation_notes:
  register: आधुनिक, गरिमामय प्रार्थना-काव्य की शैली अपनाई गई है। ‘डाँट’ सहज आधुनिक शब्द है, जबकि ‘रोष’ और ‘ताड़ना’ पद्य की गंभीरता बनाए रखते हैं। एकवचन निकट संबोधन के अनुरूप ‘अपने’ और क्रियाओं के एकवचन रूप रखे गए हैं।
