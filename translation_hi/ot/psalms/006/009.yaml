  yaml_path: translation/ot/psalms/006/009.yaml
  text: Yahweh has heard my plea[a]; Yahweh will receive my prayer.
translation:
  language: hi
  text: 'याहवे ने मेरी विनती सुन ली है;

    याहवे मेरी प्रार्थना ग्रहण करेगा।[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “लेगा”; अर्थ “स्वीकार करेगा” भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत नाम को उपाधि से बदलने के बजाय देवनागरी में लिप्यंतरित किया गया है।
- source_word: שָׁמַע
  choice: सुन ली है
  rationale: 'पूर्ण क्रिया को वर्तमान प्रभाव वाली पूर्ण घटना के रूप में व्यक्त करता है: भजनकार विश्वास के साथ कहता है कि उसकी विनती सुनी जा चुकी है।'
- source_word: תְּחִנָּה
  choice: विनती
  rationale: अनुग्रह या दया के लिए की गई गंभीर प्रार्थना का स्वाभाविक और भावपूर्ण हिन्दी रूप।
- source_word: תְּפִלָּה
  choice: प्रार्थना
  rationale: प्रार्थना के लिए सामान्य शब्द है और पहले खंड के ‘विनती’ से काव्यात्मक भिन्नता बनाए रखता है।
- source_word: לָקַח
  choice: ग्रहण करेगा
  rationale: मूल अर्थ ‘लेना’ है, पर प्रार्थना के साथ इसका आशय उसे ग्रहण या स्वीकार करना है। ‘ग्रहण करेगा’ अपूर्ण क्रिया में व्यक्त भावी विश्वास को बनाए रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: इब्रानी पाठ में व्यक्तिगत ईश्वरीय नाम सीधे आया है; लिप्यंतरण नाम को सुरक्षित रखता है और उसे किसी उपाधि से नहीं बदलता।
- issue: לָקַח को ‘ग्रहण’ या ‘स्वीकार’ कहना
  choice: ग्रहण करेगा
  alternative: स्वीकार करेगा; लेगा
  rationale: ‘ग्रहण’ मूल क्रिया ‘लेना’ के निकट रहते हुए प्रसंगानुकूल अर्थ देता है और यह अतिरिक्त दावा नहीं करता कि प्रार्थना की हर माँग अनिवार्यतः पूरी होगी।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। दो समानांतर पंक्तियाँ इब्रानी काव्य की संरचना बनाए रखती हैं; ‘विनती’ और ‘प्रार्थना’ अलग शब्द रखे गए हैं।
