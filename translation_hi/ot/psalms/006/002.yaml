source:
  edition: WLC
  text: חָנֵּ֥/נִי יְהוָה֮ כִּ֤י אֻמְלַ֫ל אָ֥נִי רְפָאֵ֥/נִי יְהוָ֑ה כִּ֖י נִבְהֲל֣וּ עֲצָמָֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/006/002.yaml
  text: Be gracious to me[a], O Yahweh, for I am weak; heal me, O Yahweh[b], for my bones are trembling.
translation:
  language: hi
  text: हे याहवे, मुझ पर अनुग्रह कर[a], क्योंकि मैं निर्बल हूँ; हे याहवे, मुझे चंगा कर, क्योंकि मेरी हड्डियाँ काँप रही हैं[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘मुझ पर दया कर।’
    reason: lexical_alternative
  - marker: b
    text: या ‘मेरी हड्डियाँ व्याकुल हैं’ अथवा ‘मेरी हड्डियाँ भयभीत हैं।’ ‘हड्डियाँ’ यहाँ गहरी शारीरिक या भीतरी व्यथा को व्यक्त कर सकती हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: חָנֵּנִי
  choice: मुझ पर अनुग्रह कर
  rationale: חנן का यह आज्ञार्थक रूप कृपा या अनुग्रह दिखाने की विनती है। यह अभिव्यक्ति मूल की सीधी प्रार्थना को स्वाभाविक और गरिमापूर्ण हिन्दी में रखती है।
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत नाम יהוה को किसी उपाधि से बदलने के बजाय हिन्दी में लिप्यंतरित किया गया है।
- source_word: כִּי
  choice: क्योंकि
  rationale: दोनों स्थानों पर כִּי विनती का कारण प्रस्तुत करता है; ‘क्योंकि’ उसके कारणवाचक अर्थ को स्पष्ट रखता है।
- source_word: אֻמְלַל
  choice: निर्बल हूँ
  rationale: यह शब्द क्षीण, अशक्त या मुरझाई हुई दशा व्यक्त करता है। ‘निर्बल हूँ’ आधुनिक हिन्दी में स्पष्ट है और चंगाई की अगली विनती के अनुकूल है।
- source_word: רְפָאֵנִי
  choice: मुझे चंगा कर
  rationale: רפא का सीधा अर्थ चंगा करना है। यहाँ शारीरिक और समूचे व्यक्ति की व्यथा दोनों निहित हो सकती हैं, जिन्हें यह अनुवाद अनावश्यक रूप से सीमित नहीं करता।
- source_word: נִבְהֲלוּ
  choice: काँप रही हैं
  rationale: בהל भय, घबराहट या गहरे व्याकुल होने की अवस्था बता सकता है। ‘हड्डियाँ’ के साथ ‘काँप रही हैं’ इस तीव्र, देहगत व्यथा को स्वाभाविक हिन्दी में व्यक्त करता है; अन्य सम्भव अर्थ पादटिप्पणी में सुरक्षित हैं।
- source_word: עֲצָמַי
  choice: मेरी हड्डियाँ
  rationale: मूल का ठोस रूपक ज्यों का त्यों रखा गया है। भजन की भाषा में ‘हड्डियाँ’ गहरी शारीरिक अथवा भीतरी पीड़ा को भी व्यक्त कर सकती हैं।
theological_decisions:
- issue: יהוה परमेश्वर के नाम का अनुवाद
  choice: याहवे
  alternative: यहोवा
  rationale: पद में चार अक्षरों वाला व्यक्तिगत नाम सीधे प्रयुक्त है। ‘याहवे’ उसे उपाधि से प्रतिस्थापित किए बिना प्रचलित विद्वत्तापूर्ण उच्चारण के अनुसार प्रस्तुत करता है।
- issue: ‘हड्डियों’ की व्यथा का आशय
  choice: मूल रूपक ‘मेरी हड्डियाँ’ बनाए रखा गया
  alternative: मेरा सारा शरीर / मेरा अंतरतम
  rationale: यह कथन शारीरिक रोग, गहरी आन्तरिक व्याकुलता, या दोनों को व्यक्त कर सकता है। मूल रूपक बनाए रखने से यह वास्तविक अर्थगत व्यापकता बनी रहती है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की, प्रार्थनापूर्ण और गरिमापूर्ण रखी गई है। ‘तू’ जैसे स्पष्ट सर्वनाम को जोड़े बिना हिब्रू के सीधे आज्ञार्थक सम्बोधन को हिन्दी की स्वाभाविक क्रिया-रचना में व्यक्त किया गया है। काव्यात्मक समानता और दोनों कारणवाचक उपवाक्य सुरक्षित हैं।
