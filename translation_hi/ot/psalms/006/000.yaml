lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: संगीत-निर्देशक के लिए
  rationale: भजन-संग्रह के शीर्षकों में यह पद संगीत-प्रस्तुति का संचालन करने वाले व्यक्ति को सूचित करता है। ‘संगीत-निर्देशक’ आधुनिक हिन्दी में स्पष्ट है और केवल गायक-मंडली तक अर्थ को सीमित नहीं करता।
- source_word: בִּנְגִינוֹת
  choice: तार वाले वाद्यों के साथ
  rationale: यहाँ संज्ञा तार वाले वाद्यों अथवा उनसे बजाए जाने वाले संगीत को सूचित करती है। यह अनुवाद वाद्य-संबंधी अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: עַל
  choice: के अनुसार
  rationale: संगीत-संबंधी शीर्षकों में यह पद धुन, शैली या प्रस्तुति-विन्यास का परिचय दे सकता है। ‘के अनुसार’ किसी एक संभावित अर्थ को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: הַשְּׁמִינִית
  choice: शमीनित
  rationale: इस तकनीकी संगीत-पद का सटीक आशय अनिश्चित है; यह ‘आठवाँ’, सप्तक-संबंधी विन्यास या आठ तारों वाला वाद्य हो सकता है। इसलिए मुख्य पाठ में इसका लिप्यंतरण रखा गया है।
- source_word: מִזְמוֹר
  choice: भजन
  rationale: यह संगीत के साथ प्रस्तुत गीत के लिए प्रचलित इब्रानी पद है; ‘भजन’ इसका स्थापित और स्वाभाविक हिन्दी पर्याय है।
- source_word: לְדָוִד
  choice: दाऊद का
  rationale: यह अभिव्यक्ति लेखन, संबंध, समर्पण या संग्रहगत संबद्धता बता सकती है। ‘दाऊद का’ हिन्दी में इस व्यापकता को ‘दाऊद द्वारा’ की अपेक्षा अधिक सुरक्षित रखता है।
theological_decisions:
- issue: शीर्षक में לְדָוִד से सूचित रचनाकारिता अथवा संबद्धता
  choice: दाऊद का
  alternative: दाऊद द्वारा; दाऊद के लिए
  rationale: इब्रानी संबंधसूचक उपसर्ग प्रत्यक्ष रचनाकारिता को अनिवार्य नहीं करता। चुना हुआ अनुवाद पाठ की अस्पष्टता बनाए रखता है और उससे अधिक विशिष्ट ऐतिहासिक दावा नहीं करता।
