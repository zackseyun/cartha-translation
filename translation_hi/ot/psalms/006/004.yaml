  text: שׁוּבָ֣/ה יְ֭הוָה חַלְּצָ֣/ה נַפְשִׁ֑/י ה֝וֹשִׁיעֵ֗/נִי לְמַ֣עַן חַסְדֶּֽ/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/006/004.yaml
  text: Return, O LORD; rescue my life; save me for the sake of your steadfast love.
translation:
  language: hi
  text: लौट आ, हे यहोवा; मेरे प्राण को छुड़ा; अपने अटल प्रेम के कारण मुझे बचा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שׁוּבָה
  choice: लौट आ
  rationale: यह क्रिया मूल पाठ की सीधी आज्ञार्थक पुकार को बनाए रखती है और परमेश्वर से फिर निकट होकर सहायता करने की विनती व्यक्त करती है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: मूल पाठ में आए परमेश्वर के व्यक्तिगत नाम को हिन्दी में प्रचलित रूप से प्रस्तुत किया गया है।
- source_word: נַפְשִׁי
  choice: मेरे प्राण
  rationale: נפשׁ यहाँ केवल अमूर्त ‘आत्मा’ नहीं, बल्कि संकट में पड़े व्यक्ति के जीवन/स्वयं को दर्शाता है; ‘प्राण’ काव्यात्मकता और जीवन-संकट दोनों को बनाए रखता है।
- source_word: חַסְדֶּךָ
  choice: अपने अटल प्रेम
  rationale: חסד में प्रेम, निष्ठा और विश्वसनीय करुणा का संयुक्त भाव है; ‘अटल प्रेम’ इस स्थायी संबंधपरक भाव को सहज हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: ‘लौट आ’ में परमेश्वर के लौटने की विनती
  choice: लौट आ
  alternative: फिर मेरी ओर ध्यान दे
  rationale: मूल की साहसपूर्ण और संबंधपरक भाषा को व्याख्यात्मक रूप से नरम नहीं किया गया; भजनकार की अनुभूत दूरी और तत्काल सहायता की पुकार बनी रहती है।
- issue: נפשׁ को ‘आत्मा’ या ‘जीवन/प्राण’ के रूप में समझना
  choice: मेरे प्राण
  alternative: मेरी आत्मा
  rationale: इस प्रसंग में निवेदन पूरे जीवित व्यक्ति की रक्षा का है। ‘आत्मा’ कहने से शरीर से पृथक किसी तत्व का अनावश्यक धार्मिक अर्थ प्रमुख हो सकता था।
- issue: उद्धार का आधार
  choice: अपने अटल प्रेम के कारण
  alternative: अपनी दया के कारण
  rationale: मूल का חסד केवल सामान्य दया से अधिक, परमेश्वर के निष्ठावान और स्थिर प्रेम की ओर संकेत करता है; अनुवाद उसी व्यापक तनाव को बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, काव्यात्मक और विनतीपूर्ण शैली रखी गई है। तीनों आज्ञार्थक पुकारों—‘लौट आ’, ‘छुड़ा’, ‘बचा’—की तीव्रता और समानांतर संरचना सुरक्षित है।
