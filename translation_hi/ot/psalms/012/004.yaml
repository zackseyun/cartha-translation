  text: who say[a], “With our tongue we will prevail[d][c][b]; our lips are with us—who is lord over us?”
translation:
  language: hi
  text: जो कहते हैं, “अपनी जीभ के बल पर हम प्रबल होंगे; हमारे होंठ हमारे अपने हैं[a]—हमारा स्वामी कौन है?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक, “हमारे होंठ हमारे साथ हैं”; अथवा “हमारे होंठ हमारे पक्ष में हैं।”
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲשֶׁר אָמְרוּ
  choice: जो कहते हैं
  rationale: सम्बन्धवाचक पद पिछले पद में वर्णित दुष्टों का परिचय आगे बढ़ाता है; पूर्ण क्रिया यहाँ उनकी लगातार बनी रहने वाली मनोवृत्ति बताती है।
- source_word: לִלְשֹׁנֵנוּ
  choice: अपनी जीभ के बल पर
  rationale: ל को साधनवाचक समझना प्रसंगानुकूल है और बताता है कि वे वाणी को प्रभुत्व पाने का साधन मानते हैं।
- source_word: נַגְבִּיר
  choice: हम प्रबल होंगे
  rationale: גבר के हिफ़ील रूप में सामर्थ्य दिखाने अथवा बढ़त पाने का भाव है; यह अनुवाद मूल की सम्भावित अकर्मक/आत्म-दृढ़तापूर्ण ध्वनि को बनाए रखता है।
- source_word: שְׂפָתֵינוּ
  choice: हमारे होंठ
  rationale: ‘वाणी’ जैसे अमूर्त शब्द के बजाय मूल का ठोस काव्य-बिम्ब सुरक्षित रखा गया है।
- source_word: אִתָּנוּ
  choice: हमारे साथ हैं
  rationale: यह मूल का निकट अनुवाद है। कथन में अधिकार, उपलब्ध साधन अथवा अपने पक्ष में होने की ध्वनि हो सकती है; अस्पष्टता को मुख्य पाठ में सुरक्षित रखा गया है।
- source_word: מִי אָדוֹן לָנוּ
  choice: हमारा स्वामी कौन है?
  rationale: אָדוֹן यहाँ सामान्य अधिकार रखने वाले स्वामी को सूचित करता है, परमेश्वर के विशिष्ट नाम को नहीं; सहज हिन्दी में प्रश्न उनकी उद्दंड स्वायत्तता व्यक्त करता है।
theological_decisions:
- issue: אָדוֹן को सामान्य अधिकार-सूचक पद के रूप में प्रस्तुत करना
  choice: स्वामी
  alternative: प्रभु
  rationale: यहाँ वक्ता अपने ऊपर किसी भी सत्ता को नकारते हैं। ‘स्वामी’ सामान्य अधिकार का भाव स्पष्ट करता है और अनावश्यक रूप से इसे परमेश्वर की विशिष्ट उपाधि नहीं बनाता।
- issue: אִתָּנוּ की अस्पष्टता
  choice: हमारे होंठ हमारे साथ हैं
  alternative: हमारे होंठ हमारे अपने हैं / हमारे होंठ हमारे पक्ष में हैं
  rationale: मूल वाक्य अधिकार, नियंत्रण या लाभ—इनमें से एक से अधिक भाव जगा सकता है। निकट अनुवाद इस तनाव को बिना निर्णायक व्याख्या थोपे बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण काव्यात्मक गद्य रखा गया है। ‘जीभ’ और ‘होंठ’ के मूल बिम्ब सुरक्षित हैं; ‘के बल पर’ साधनवाचक अर्थ को सामान्य पाठक के लिए स्वाभाविक बनाता है।
