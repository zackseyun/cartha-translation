  text: They speak emptiness[a], each man to his neighbor; with flattering lips[b], with a double heart they speak.
translation:
  language: hi
  text: 'वे खोखली बातें करते हैं, हर व्यक्ति अपने पड़ोसी से;

    चापलूसी भरे होंठों से[a] और दोहरे हृदय से[b] वे बोलते हैं।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘चिकने होंठों से’; इब्रानी में चिकनी, और इसलिए चापलूसी भरी तथा छलपूर्ण, वाणी का बिंब है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, ‘हृदय और हृदय से’; यह कपट या भीतर से बँटे हुए इरादे की अभिव्यक्ति है।
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁוְא
  choice: खोखली बातें
  rationale: यह शब्द ऐसी बातों को दर्शा सकता है जो खाली, व्यर्थ या झूठी हों। ‘खोखली बातें’ इसके व्यापक अर्थ को बनाए रखता है और इसे केवल तथ्यात्मक झूठ तक सीमित नहीं करता।
- source_word: יְדַבְּרוּ / יְדַבֵּרוּ
  choice: बातें करते हैं / बोलते हैं
  rationale: दोनों रूप ‘बोलने’ के सामान्य अर्थ में हैं। हिंदी में स्वाभाविकता रखते हुए पद के आरंभ और अंत में क्रिया की पुनरावृत्ति सुरक्षित रखी गई है।
- source_word: אִישׁ אֶת־רֵעֵהוּ
  choice: हर व्यक्ति अपने पड़ोसी से
  rationale: एकवचन אִישׁ यहाँ वितरणात्मक अर्थ में है, और רֵעֵהוּ सामाजिक निकटता वाले दूसरे व्यक्ति या पड़ोसी को दर्शाता है। यह हिंदी में स्वाभाविक और स्रोत के अर्थ के अनुरूप है।
- source_word: שְׂפַת חֲלָקוֹת
  choice: चिकने होंठों से
  rationale: शाब्दिक बिंब ‘चिकनाई/चिकनी बातों के होंठ’ का है। ‘चिकने होंठ’ उस मधुर, चापलूसी भरे और छलपूर्ण भाषण के बिंब को सुरक्षित रखता है।
- source_word: בְּלֵב וָלֵב
  choice: दोहरे मन से
  rationale: शाब्दिक अभिव्यक्ति ‘मन और मन से’ कपटपूर्ण या बँटे हुए भीतरी इरादे को व्यक्त करती है। ‘दोहरे मन से’ हिंदी में समझने योग्य रहते हुए मूल की तनावपूर्ण छवि को बनाए रखता है।
