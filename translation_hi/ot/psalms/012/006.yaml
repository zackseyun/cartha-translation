source:
  edition: WLC
  text: אִֽמֲר֣וֹת יְהוָה֮ אֲמָר֪וֹת טְהֹ֫ר֥וֹת כֶּ֣סֶף צָ֭רוּף בַּ/עֲלִ֣יל לָ/אָ֑רֶץ מְ֝זֻקָּ֗ק שִׁבְעָתָֽיִם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/012/006.yaml
  text: The words of Yahweh are pure words[a], like silver refined in a furnace on the earth[b], purified seven times.
translation:
  language: hi
  text: 'याहवे के वचन निर्मल वचन हैं,


    उस चाँदी के समान जो भट्ठी में[a] तपी हुई,


    धरती पर[b] सात बार शुद्ध की हुई हो।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘भट्ठी में’ के बदले ‘कुठाली में’ या ‘गलाने के पात्र में’ भी संभव है। इब्रानी शब्द दुर्लभ है और उसका ठीक आशय अनिश्चित है, यद्यपि धातु-शोधन का भाव स्पष्ट है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में ‘धरती पर।’ यह वाक्यांश शोधन के स्थान या परिवेश को बता सकता है; इसका ठीक सूक्ष्म अर्थ अनिश्चित है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אִמֲרוֹת / אֲמָרוֹת
  choice: वचन
  rationale: दोहराया गया संज्ञा-रूप व्यापक रूप से कही हुई बातों को दर्शाता है। ‘वचन’ काव्यात्मक पुनरुक्ति बनाए रखता है और अर्थ को केवल ‘प्रतिज्ञाओं’ तक सीमित नहीं करता।
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत नाम को उपाधि से बदलने के बजाय देवनागरी लिप्यंतरण में प्रस्तुत किया गया है।
- source_word: טְהֹרוֹת
  choice: निर्मल
  rationale: यह नैतिक शुद्धता और आगे आने वाले धातु-शोधन के बिंब, दोनों के अनुकूल स्वाभाविक हिंदी विशेषण है।
- source_word: כֶּסֶף
  choice: चाँदी
  rationale: यह संज्ञा सीधे चाँदी धातु को सूचित करती है।
- source_word: צָרוּף
  choice: तपाई गई
  rationale: निष्क्रिय रूप धातु के परिशोधन को व्यक्त करता है। ‘तपाई गई’ हिंदी में भट्ठी के बिंब के साथ स्वाभाविक है।
- source_word: בַּעֲלִיל
  choice: भट्ठी में
  rationale: यह दुर्लभ और अनिश्चित शब्द है; चाँदी और शुद्ध करने के प्रसंग में धातु गलाने या परिशोधित करने के पात्र अथवा भट्ठी का संकेत सबसे संभावित है।
- source_word: לָאָרֶץ
  choice: धरती पर
  rationale: वाक्यांश का संबंध और सूक्ष्म अर्थ अनिश्चित है। अपेक्षाकृत शाब्दिक अनुवाद स्थान अथवा परिवेश की संभावना को बिना निश्चित किए सुरक्षित रखता है।
- source_word: מְזֻקָּק
  choice: शुद्ध की गई
  rationale: यह कृदंत धातु-परिशोधन के बिंब को आगे बढ़ाकर तीव्र करता है और पहले प्रयुक्त ‘तपाई’ की अनावश्यक पुनरावृत्ति से बचता है।
- source_word: שִׁבְעָתָיִם
  choice: सात बार
  rationale: यह पारदर्शी अनुवाद बार-बार शोधन और उससे संकेतित पूर्णता को व्यक्त करता है।
theological_decisions:
- issue: याहवे के वचनों की निर्मलता का स्वरूप
  choice: पद याहवे के कहे हुए वचनों की पूर्ण निर्मलता और विश्वसनीयता को धातु-शोधन के काव्यात्मक बिंब द्वारा व्यक्त करता है।
  alternative: इसे केवल नैतिक शुद्धता तक सीमित करना, अथवा बाद के पवित्रशास्त्रीय पाठ-संरक्षण के सिद्धांतों का स्पष्ट कथन मानना।
  rationale: इब्रानी पाठ याहवे के वचनों की तुलना पूरी तरह शुद्ध की गई चाँदी से करता है; अनुवाद इस दावे को बनाए रखता है, पर पद में न कही गई बाद की धर्मसैद्धांतिक अवधारणाएँ नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिंदी का सरल, गरिमापूर्ण और काव्यात्मक रूप अपनाया गया है। इब्रानी की पुनरुक्ति ‘वचन ... वचन’ में सुरक्षित है। दुर्लभ धातु-शोधन शब्द और ‘धरती पर’ की वास्तविक अनिश्चितता पादटिप्पणियों में स्पष्ट की गई है।
