  text: 'प्रधान गायक के लिए: आठवें के अनुसार[a]। दाऊद का भजन[b]।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक अर्थ “आठवाँ” है। संभवतः यह कोई संगीत या आराधना-संबंधी संकेत था—शायद किसी धुन, वाद्य या सप्तक-विन्यास का नाम। परंपरागत रूप से इसे “शेमिनीथ” कहा जाता है।
    reason: cultural_note
  - marker: b
    text: इसका अनुवाद “दाऊद द्वारा” या “दाऊद के लिए” भी हो सकता है; इब्रानी में दाऊद से संबंध का ठीक प्रकार खुला छोड़ा गया है।
    reason: alternative_reading
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: प्रधान गायक के लिए
  rationale: भजन-संग्रह के शीर्षकों में यह पद संगीत-प्रस्तुति का निर्देशन करने वाले व्यक्ति को सूचित करता है; यह हिंदी में संक्षिप्त और स्वाभाविक है।
- source_word: עַל
  choice: के अनुसार
  rationale: यहाँ यह संभवतः किसी धुन, शैली या संगीत-विन्यास का परिचय देता है; ‘के अनुसार’ इस कार्यगत अर्थ को व्यक्त करता है।
- source_word: הַשְּׁמִינִית
  choice: आठवें
  rationale: शब्द का शाब्दिक अर्थ ‘आठवाँ’ है, पर इसका ठीक संगीत-संबंधी आशय अनिश्चित है; अनुवाद मूल की पारदर्शिता और अस्पष्टता दोनों रखता है।
- source_word: מִזְמוֹר
  choice: भजन
  rationale: यह इस काव्य-संगीत विधा के लिए प्रचलित और संदर्भानुकूल हिंदी पद है।
- source_word: לְדָוִד
  choice: दाऊद का
  rationale: यह स्वाभाविक हिंदी है और दाऊद से संबंध व्यक्त करता है; संबंध के ठीक प्रकार—रचना, समर्पण या संबद्धता—को पादटिप्पणी खुला रखती है।
theological_decisions:
- issue: शीर्षक में לְדָוִד से सूचित रचनाकारिता या संबद्धता
  choice: दाऊद का
  alternative: दाऊद द्वारा; दाऊद के लिए
  rationale: इब्रानी रचना किसी एक संबंध को अनिवार्य नहीं करती। मुख्य पाठ में सहज हिंदी रखते हुए पादटिप्पणी संभावित अर्थों को सुरक्षित रखती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सार्वजनिक पाठ के अनुकूल रखी गई है। शीर्षक की संक्षिप्त लय बचाई गई है और अनिश्चित संगीत-पद को अधिक स्पष्ट बनाकर नहीं समझाया गया।
