id: PSA.12.5
reference: Psalms 12:5
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: מִ/שֹּׁ֥ד עֲנִיִּים֮ מֵ/אַנְקַ֪ת אֶבְי֫וֹנִ֥ים עַתָּ֣ה אָ֭קוּם יֹאמַ֣ר יְהוָ֑ה אָשִׁ֥ית בְּ֝/יֵ֗שַׁע יָפִ֥יחַֽ לֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/012/005.yaml
  text: Because of the devastation of the poor[a], because of the groaning of the needy, now I will arise, says Yahweh; I will set him in the safety for which he longs.
translation:
  language: hi
  text: '“दीनों पर हुई तबाही के कारण,

    ज़रूरतमंदों की कराह के कारण,

    अब मैं उठूँगा,” याहवे कहता है;

    “मैं उसे उस सुरक्षा में रखूँगा जिसकी वह लालसा करता है।”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अंतिम इब्रानी उपवाक्य कठिन है। अधिक शाब्दिक अनुवाद हो सकता है, “मैं सुरक्षा में रखूँगा; वह उसके लिए हाँफता है।” कुछ लोग इसका अर्थ लगभग यह लेते हैं, “मैं उसे उससे सुरक्षा में रखूँगा जो उस पर फुँफकारता है।”
    reason: alternative_reading
lexical_decisions:
- source_word: מִשֹּׁד עֲנִיִּים
  choice: दीनों पर हुई तबाही के कारण
  rationale: מִן को यहाँ परमेश्वर के हस्तक्षेप का कारण बताने वाला माना गया है। שֹׁד विनाशकारी हिंसा, लूट या तबाही को व्यक्त करता है; ‘तबाही’ इसकी व्यापकता और तीव्रता बनाए रखता है। עֲנִיִּים के लिए ‘दीनों’ से गरीबी के साथ उनकी पीड़ित अवस्था भी व्यक्त होती है।
- source_word: מֵאַנְקַת אֶבְיוֹנִים
  choice: ज़रूरतमंदों की कराह के कारण
  rationale: पहली पंक्ति के समान מִן कारणसूचक है। אֲנָקָה की श्रव्य पीड़ा के लिए ‘कराह’ स्वाभाविक है, और אֶבְיוֹנִים के लिए ‘ज़रूरतमंदों’ से पहली पंक्ति के ‘दीनों’ के साथ काव्यात्मक भिन्नता बनी रहती है।
- source_word: עַתָּה אָקוּם
  choice: अब मैं उठूँगा
  rationale: यह अनुवाद हस्तक्षेप की तात्कालिकता और परमेश्वर के कार्य करने हेतु उठने की मानवरूपी छवि दोनों को बनाए रखता है।
- source_word: יֹאמַר יְהוָה
  choice: याहवे कहता है
  rationale: יְהוָה को उपाधि से बदलने के बजाय व्यक्तिगत दिव्य नाम ‘याहवे’ के रूप में लिप्यंतरित किया गया है। वचन-सूचक पद को हिंदी में स्वाभाविक क्रम दिया गया है।
- source_word: אָשִׁית בְּיֵשַׁע
  choice: मैं उसे उस सुरक्षा में रखूँगा
  rationale: שׂים का मूल भाव ‘रखना/स्थापित करना’ है और יֵשַׁע यहाँ उद्धार के परिणामस्वरूप प्राप्त सुरक्षित अवस्था को दर्शाता है। संदर्भ से निहित पीड़ित व्यक्ति को कर्म के रूप में स्पष्ट करना हिंदी में स्वाभाविक है।
- source_word: יָפִיחַ לוֹ
  choice: जिसकी वह लालसा करता है
  rationale: कठिन अंतिम पदबंध को ‘उसके लिए हाँफना/लालसा करना’ अर्थ में लिया गया है। इससे पीड़ित व्यक्ति की चाही हुई सुरक्षा का सुसंगत भाव मिलता है, जबकि अन्य संभावित अर्थ पादटिप्पणी में सुरक्षित हैं।
theological_decisions:
- issue: दिव्य नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा / प्रभु
  rationale: मूल पाठ में चतुरक्षरीय व्यक्तिगत नाम है। ‘याहवे’ उसका निकट लिप्यंतरण है और उसे किसी उपाधि से नहीं बदलता।
- issue: कठिन अंतिम उपवाक्य יָפִיחַ לוֹ का संबंध
  choice: सुरक्षा की लालसा करने वाला पीड़ित व्यक्ति
  alternative: उस पर फुँफकारने वाला उत्पीड़क, अथवा शाब्दिक रूप से ‘वह उसके लिए हाँफता है’
  rationale: वाक्य-संदर्भ में पीड़ित को उसकी चाही हुई सुरक्षा में रखने का अर्थ सुसंगत है, पर इब्रानी संरचना अनिश्चित है; इसलिए वैकल्पिक अर्थ को दबाया नहीं गया है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और काव्यात्मक हिंदी अपनाई गई है। समानांतर पंक्तियों में ‘दीनों’ और ‘ज़रूरतमंदों’ से मूल के दो निकटार्थक सामाजिक शब्दों का अंतर बनाए रखा गया है। कठिन अंतिम पदबंध की अनिश्चितता मुख्य पाठ और पादटिप्पणी के संयोजन से प्रस्तुत है।
