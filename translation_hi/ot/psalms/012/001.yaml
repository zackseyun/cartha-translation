source:
  edition: WLC
  text: הוֹשִׁ֣יעָ/ה יְ֭הוָה כִּי גָמַ֣ר חָסִ֑יד כִּי פַ֥סּוּ אֱ֝מוּנִ֗ים מִ/בְּנֵ֥י אָדָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/012/001.yaml
  text: Save[a], O Yahweh, for the godly are gone[b]; for the faithful have vanished from among the sons of man.
translation:
  language: hi
  text: हे याहवे, बचा ले! क्योंकि भक्त जन नहीं रहे[a]; मनुष्यों के बीच से[b] विश्वासयोग्य लोग लुप्त हो गए हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “क्योंकि भक्त जन समाप्त हो गया है” अथवा “निष्ठावान व्यक्ति अब नहीं रहा।” इब्रानी में ‘भक्त जन’ एकवचन है और उसका अर्थ व्यक्तिगत या प्रतिनिधिक-सामूहिक हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “मनुष्य की संतानों में से”; यह मानव समुदाय के लिए इब्रानी मुहावरा है।
    reason: cultural_note
lexical_decisions:
- source_word: הוֹשִׁיעָה
  choice: बचा ले
  rationale: यह ישׁע का परमेश्वर को संबोधित आज्ञार्थक रूप है। ‘बचा ले’ प्रार्थना की तात्कालिकता को स्वाभाविक और सीधे ढंग से व्यक्त करता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत नाम चतुरक्षर को किसी उपाधि से बदलने के बजाय हिन्दी में लिप्यंतरित किया गया है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यहाँ दोनों बार यह विनती का आधार बताता है; ‘क्योंकि’ आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: גָמַר
  choice: नहीं रहे
  rationale: क्रिया का मूल भाव समाप्त हो जाना या न रहना है। सन्दर्भ में यह समाज से भक्त लोगों के गायब हो जाने को सहज हिन्दी में व्यक्त करता है।
- source_word: חָסִיד
  choice: भक्त जन
  rationale: यह शब्द भक्ति और निष्ठावान आचरण से पहचाने जाने वाले व्यक्ति को सूचित करता है। एकवचन रूप सामूहिक या प्रतिनिधिक अर्थ रख सकता है; ‘भक्त जन’ उस अर्थ को सहज हिन्दी में व्यक्त करता है, जबकि वैकल्पिक एकवचन पाठ पादटिप्पणी में सुरक्षित है।
- source_word: פַסּוּ
  choice: लुप्त हो गए हैं
  rationale: बहुवचन क्रिया के मिट जाने, समाप्त हो जाने या दिखाई न देने का काव्यात्मक बल इस अभिव्यक्ति में बना रहता है।
- source_word: אֱמוּנִים
  choice: विश्वासयोग्य लोग
  rationale: यहाँ शब्द भरोसेमंद, निष्ठावान लोगों को दर्शाता है; ‘विश्वासयोग्य लोग’ धार्मिक विश्वास मात्र के बजाय नैतिक विश्वसनीयता को भी व्यक्त करता है।
- source_word: מִבְּנֵי אָדָם
  choice: मनुष्यों के बीच से
  rationale: शाब्दिक इब्रानी ‘मनुष्य/आदम के पुत्रों में से’ मानव समुदाय के लिए मुहावरा है। मुख्य पाठ में अर्थ को स्वाभाविक हिन्दी में दिया गया है और शाब्दिक रूप पादटिप्पणी में रखा गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: प्रभु / यहोवा
  rationale: मूल पाठ व्यक्तिगत वाचा-नाम का प्रयोग करता है। ‘याहवे’ उसे उपाधि से बदले बिना निकट लिप्यंतरण में सुरक्षित रखता है।
- issue: एकवचन חָסִיד का सामूहिक या व्यक्तिगत अर्थ
  choice: भक्त जन नहीं रहे
  alternative: भक्त जन नहीं रहा / निष्ठावान व्यक्ति अब नहीं रहा
  rationale: इब्रानी रूप व्याकरणतः पुल्लिंग एकवचन है, पर वह किसी वर्ग के प्रतिनिधि के रूप में भी प्रयुक्त हो सकता है। मुख्य पाठ सन्दर्भगत सामूहिक शिकायत को व्यक्त करता है और एकवचन सम्भावना को पादटिप्पणी में सुरक्षित रखता है।
- issue: בְּנֵי אָדָם में लिंगयुक्त इब्रानी मुहावरा
  choice: मनुष्यों के बीच से
  alternative: आदम के पुत्रों के बीच से / मनुष्य के पुत्रों के बीच से
  rationale: यह पदबंध समूचे मानव समुदाय के लिए प्रचलित इब्रानी मुहावरा है। अर्थप्रधान हिन्दी पाठ अनावश्यक रूप से केवल पुरुषों का संकेत नहीं देता, जबकि शाब्दिक संरचना पादटिप्पणी में बताई गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, तात्कालिक प्रार्थना-काव्य का स्वर रखा गया है। ‘बचा ले’ आत्मीय विनती को, अर्धविराम समानांतर शिकायतों को, और ‘लुप्त हो गए हैं’ काव्यात्मक तीव्रता को बनाए रखता है।
