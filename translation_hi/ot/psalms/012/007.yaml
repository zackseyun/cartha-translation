  yaml_path: translation/ot/psalms/012/007.yaml
  text: You[a], O Yahweh, will keep them; you will guard us from this generation forever.
translation:
  language: hi
  text: 'हे याहवे, आप ही उन्हें सुरक्षित रखेंगे;

    आप इस पीढ़ी से उसकी[a] सदा रक्षा करेंगे।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: हिब्रू में कर्म बहुवचन (‘उन्हें’) से एकवचन (‘उसकी’) हो जाता है। कुछ अनुवाद इस बदलाव को समतल करके दोनों जगह बहुवचन रखते हैं; दूसरे अनुवाद दूसरे रूप को ‘हमारी’ समझते हैं।
    reason: alternative_reading
lexical_decisions:
- source_word: אַתָּה
  choice: आप ही
  rationale: स्वतंत्र और वाक्य के आरम्भ में रखा द्वितीय पुरुष एकवचन सर्वनाम विशेष बल देता है; हिन्दी में ‘आप ही’ इस बल को स्वाभाविक रूप से व्यक्त करता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: ईश्वर के व्यक्तिगत नाम का लिप्यंतरण किया गया है, किसी उपाधि से उसका स्थानापन्न नहीं किया गया।
- source_word: תִּשְׁמְרֵם
  choice: उन्हें सुरक्षित रखेंगे
  rationale: שׁמר का अर्थ रक्षा करना, संभालना या सुरक्षित रखना है; बहुवचन कर्म-प्रत्यय को ‘उन्हें’ से स्पष्ट रखा गया है।
- source_word: תִּצְּרֶנּוּ
  choice: उसकी रक्षा ... करेंगे
  rationale: נצר का अर्थ रक्षा करना या बचाए रखना है। मासोरेटिक स्वरांकन में नून का द्वित्व काव्यात्मक/ऊर्जित तृतीय पुरुष पुल्लिंग एकवचन प्रत्यय की ओर संकेत करता है; इसलिए पहले बहुवचन के बाद आए एकवचन को नहीं समतल किया गया।
- source_word: מִן הַדּוֹר זּוּ
  choice: इस पीढ़ी से
  rationale: מִן का पृथक्करण/बचाव का अर्थ और דור का सामान्य अर्थ ‘पीढ़ी’ संदर्भ के अनुकूल हैं।
- source_word: לְעוֹלָם
  choice: सदा
  rationale: भजन की काव्यात्मक प्रार्थना में अनवरत अवधि व्यक्त करने वाला संक्षिप्त और स्वाभाविक हिन्दी रूप।
theological_decisions:
- issue: दोनों क्रियाओं के कर्म-प्रत्ययों में वचन-परिवर्तन
  choice: ‘उन्हें ... उसकी’ के रूप में बहुवचन से एकवचन की ओर बदलाव बनाए रखा
  alternative: ‘उन्हें ... उनकी’ कहकर दोनों को बहुवचन बनाना; अथवा पाठ को प्रथम पुरुष ‘हमारी’ समझना
  rationale: मासोरेटिक स्वरांकन पहले प्रत्यय को बहुवचन और दूसरे को काव्यात्मक तृतीय पुरुष एकवचन समझने का आधार देता है। संदर्भगत कठिनाई को चुपचाप दूर करने के बजाय मुख्य पाठ में सुरक्षित रखा गया है और पादटिप्पणी में बताया गया है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध हिन्दी। परमेश्वर के लिए आदरसूचक ‘आप’ रखा गया है। पंक्ति-विन्यास हिब्रू समानांतरता को उभारता है।
