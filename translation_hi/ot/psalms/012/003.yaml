  yaml_path: translation/ot/psalms/012/003.yaml
  text: May Yahweh cut off all flattering lips[b][a], the tongue that speaks great things.
translation:
  language: hi
  text: याहवे सभी चापलूस होंठों[a] को काट डाले, और बड़ी-बड़ी बातें[b] बोलने वाली जीभ को भी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, ‘चिकने होंठ’; इसका आशय चिकनी-चुपड़ी, चापलूसी भरी वाणी से है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, ‘बड़ी बातें’; अर्थात डींग भरे या घमंडी दावे।
    reason: lexical_alternative
lexical_decisions:
- source_word: יַכְרֵת
  choice: काट डाले
  rationale: हिफ़िल अपूर्ण रूप यहाँ प्रार्थना या अभिशापसूचक कामना के रूप में स्वाभाविक है। ‘काट डाले’ मूल बिंब और हटाकर नष्ट करने के भाव, दोनों को बनाए रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय देवनागरी में लिप्यंतरित किया गया है।
- source_word: כָּל שִׂפְתֵי חֲלָקוֹת
  choice: चापलूसी करनेवाले सभी होंठों
  rationale: शाब्दिक बिंब ‘चिकनाई के होंठ’ का है; आधुनिक हिन्दी में ‘चापलूसी करनेवाले होंठ’ उसके चिकने, लुभावने और छलपूर्ण बोल का स्वाभाविक अर्थ देता है। ‘सभी’ כָּל की व्यापकता रखता है।
- source_word: לָשׁוֹן מְדַבֶּרֶת
  choice: उस जीभ को भी, जो ... बोलती है
  rationale: एकवचन ‘जीभ’ और उसे विशेषित करनेवाले स्त्रीलिंग कृदंत को सजीव, स्वाभाविक सम्बन्धवाचक उपवाक्य में रखा गया है। ‘भी’ दूसरे कर्म को पहले के साथ स्पष्ट रूप से जोड़ता है।
- source_word: גְּדֹלוֹת
  choice: बड़ी-बड़ी बातें
  rationale: शाब्दिक अर्थ ‘बड़ी बातें’ है। हिन्दी का ‘बड़ी-बड़ी बातें बोलना’ मूल शब्दावली को रखते हुए डींग और घमंड का प्रसंगगत संकेत भी देता है।
theological_decisions:
- issue: יְהוָה परमेश्वर के नाम का अनुवाद
  choice: याहवे
  alternative: यहोवा
  rationale: मूल पाठ में व्यक्तिगत दिव्य नाम सीधे आया है; इसलिए उसे उपाधि से प्रतिस्थापित न करके ‘याहवे’ के रूप में प्रस्तुत किया गया है।
- issue: יַכְרֵת का वाक्य-भाव
  choice: 'कामना/प्रार्थना: ‘काट डाले’'
  alternative: 'भविष्यवाणी: ‘काट डालेगा’'
  rationale: भजन के प्रसंग में यह दुष्ट वाणी के विरुद्ध प्रार्थनात्मक कामना के रूप में स्वाभाविक है, यद्यपि इब्रानी अपूर्ण रूप अपने आप में भविष्यसूचक अर्थ भी ले सकता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण और सहज शैली रखी गई है। ‘होंठ’ और ‘जीभ’ के मूल काव्यात्मक बिंब सुरक्षित हैं; ‘काट डाले’ भजन की तीखी प्रार्थनात्मक भाषा को नरम नहीं करता।
