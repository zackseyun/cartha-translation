  text: סָבִ֗יב רְשָׁעִ֥ים יִתְהַלָּכ֑וּ/ן כְּ/רֻ֥ם זֻ֝לּ֗וּת לִ/בְנֵ֥י אָדָֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/012/008.yaml
  text: The wicked walk all around[b][a], when vileness is exalted among the sons of man.
translation:
  language: hi
  text: दुष्ट चारों ओर घूमते फिरते हैं,[a] जब मनुष्यों के बीच नीचता को ऊँचा उठाया जाता है।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “दुष्ट हर ओर मँडराते फिरते हैं।”
    reason: alternative_reading
  - marker: b
    text: या, “जैसे मनुष्यों के बीच नीचता को ऊँचा उठाया जाता है।” शाब्दिक रूप से, “मनुष्य की सन्तानों के बीच।”
    reason: lexical_and_syntactic_alternative
lexical_decisions:
- source_word: סָבִיב
  choice: चारों ओर
  rationale: यह क्रियाविशेषण चारों तरफ होने या घूमने का भाव देता है; ‘चारों ओर’ आधुनिक हिन्दी में स्वाभाविक है।
- source_word: רְשָׁעִים
  choice: दुष्ट
  rationale: यह बहुवचन संज्ञात्मक रूप से दुष्ट व्यक्तियों को सूचित करता है; हिन्दी में ‘दुष्ट’ संक्षिप्त और स्वाभाविक है।
- source_word: יִתְהַלָּכוּן
  choice: घूमते फिरते हैं
  rationale: הלך के हित्पएल रूप में इधर-उधर चलते रहने का भाव है। यह अनिष्टकारी आशय को अत्यधिक स्पष्ट किए बिना मूल गतिशील बिंब बनाए रखता है।
- source_word: כְּרֻם
  choice: जब ... ऊँचा उठाया जाता है
  rationale: 'कठिन संरचना को काल-सूचक/परिस्थितिसूचक अर्थ में लिया गया है: दुष्ट उस समय निर्बाध घूमते हैं जब नीचता प्रतिष्ठित होती है। ‘जैसे-जैसे’ भी सम्भव है और पादटिप्पणी में रखा गया है।'
- source_word: זֻלּוּת
  choice: नीचता
  rationale: यह शब्द तुच्छ, घटिया या नैतिक रूप से अधम बात का बोध कराता है; ‘नीचता’ हिन्दी में उसके नैतिक बल को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: לִבְנֵי אָדָם
  choice: मनुष्यों के बीच
  rationale: शाब्दिक अर्थ ‘आदम की सन्तानों/मनुष्य के पुत्रों के बीच’ है, पर इसका सन्दर्भ समस्त मानव-समाज से है। ‘मनुष्यों के बीच’ उस सामान्य मानवीय अर्थ को स्पष्ट, आधुनिक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: לִבְנֵי אָדָם का सामान्य मानवीय सन्दर्भ
  choice: मनुष्यों के बीच
  alternative: मनुष्य की सन्तानों के बीच
  rationale: इब्रानी पद व्याकरणिक रूप से पुल्लिंग मुहावरा है, पर आशय सामान्य रूप से मानवजाति है। मुख्य पाठ में स्वाभाविक हिन्दी रखी गई और अधिक शाब्दिक रूप पादटिप्पणी में दिया गया।
- issue: כְּרֻם का वाक्यगत सम्बन्ध
  choice: जब ... ऊँचा उठाया जाता है
  alternative: जैसे-जैसे ... ऊँचा उठाया जाता है
  rationale: इब्रानी संरचना कठिन और कुछ हद तक अस्पष्ट है। मुख्य पाठ परिस्थितिसूचक/कालसूचक सम्बन्ध देता है, जबकि क्रमिक सम्बन्ध की सम्भावना पादटिप्पणी में सुरक्षित रखी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सरल काव्यात्मक गद्य। ‘घूमते फिरते हैं’ ने मूल चलने के बिंब को बनाए रखा है; ‘मँडराते’ अधिक व्याख्यात्मक विकल्प है। पादटिप्पणी-चिह्न सम्बद्ध वाक्यांशों के बाद रखे गए हैं।
