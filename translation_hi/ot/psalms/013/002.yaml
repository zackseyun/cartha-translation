source:
  edition: WLC
  text: עַד אָ֨נָה אָשִׁ֪ית עֵצ֡וֹת בְּ/נַפְשִׁ֗/י יָג֣וֹן בִּ/לְבָבִ֣/י יוֹמָ֑ם עַד אָ֓נָה יָר֖וּם אֹיְבִ֣/י עָלָֽ/י־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/013/002.yaml
  text: How long must I take counsel in my soul[b][a], with sorrow in my heart all day? How long will my enemy be exalted over me?
translation:
  language: hi
  text: कब तक मैं अपने भीतर योजनाएँ बनाता रहूँ[a], और दिन भर मेरे हृदय में शोक बना रहे? कब तक मेरा शत्रु मुझ पर ऊँचा उठता रहेगा[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “कब तक मैं अपने ही भीतर उपाय सोचता रहूँ?”
    reason: עֵצוֹת का अर्थ ‘सलाहें’, ‘युक्तियाँ’ या ‘योजनाएँ’ हो सकता है; यह वैकल्पिक रूप भीतरी विचार-विमर्श का भाव अधिक स्पष्ट करता है।
  - marker: b
    text: या, “कब तक मेरा शत्रु मुझ पर विजय पाता रहेगा?” इब्रानी में अधिक शाब्दिक अर्थ “मुझ पर ऊँचा उठेगा” है।
    reason: ‘विजय पाना’ प्रसंगगत अर्थ को स्पष्ट करता है, जबकि मुख्य पाठ मूल इब्रानी की ऊँचाई वाली छवि को बनाए रखता है।
lexical_decisions:
- source_word: עַד־אָנָה
  choice: कब तक
  rationale: यह इब्रानी विलाप में बार-बार आने वाला समयसूचक प्रश्न है; ‘कब तक’ उसका स्वाभाविक और प्रभावशाली हिन्दी रूप है।
- source_word: אָשִׁית עֵצוֹת
  choice: मैं ... योजनाएँ बनाता रहूँ
  rationale: שׁית का मूल अर्थ ‘रखना/ठहराना’ और עֵצוֹת का अर्थ ‘सलाहें/योजनाएँ’ हो सकता है। प्रसंग में यह अकेले अपने भीतर बार-बार उपाय सोचने की विवशता व्यक्त करता है; ‘योजनाएँ बनाता रहूँ’ आधुनिक हिन्दी में स्वाभाविक है।
- source_word: בְּנַפְשִׁי
  choice: अपने भीतर
  rationale: यहाँ נֶפֶשׁ मनुष्य के भीतरी स्व या स्वयं को सूचित करता है। ‘अपने भीतर’ अर्थ को सहज हिन्दी में रखता है और अगले पद के ‘हृदय’ से अनावश्यक शब्दगत टकराव से बचाता है।
- source_word: יָגוֹן
  choice: शोक
  rationale: यह शब्द गहरे दुःख या संताप को व्यक्त करता है। ‘शोक’ संक्षिप्त, गरिमापूर्ण और काव्यात्मक रूप है।
- source_word: בִּלְבָבִי
  choice: मेरे हृदय में
  rationale: לֵבָב विचार, इच्छा और भावना के भीतरी केंद्र को सूचित कर सकता है; ‘हृदय’ मूल बिंब और काव्यात्मक समानांतरता बनाए रखता है।
- source_word: יוֹמָם
  choice: दिन भर
  rationale: यह दिन के समय अथवा दिन-प्रतिदिन बने रहने की अवधि का संकेत देता है। यहाँ ‘दिन भर’ निरंतर शोक का स्वाभाविक हिन्दी बोध कराता है।
- source_word: יָרוּם ... עָלָי
  choice: मुझ पर ऊँचा उठता रहेगा
  rationale: רוּם का मूल बिंब ऊँचा होने या उठने का है और עָלָי ‘मुझ पर/मेरे ऊपर’ है। यह रूप शत्रु की बढ़त का अर्थ रखते हुए मूल की ऊर्ध्वाधर छवि को भी बचाता है।
- source_word: אֹיְבִי
  choice: मेरा शत्रु
  rationale: एकवचन संज्ञा और प्रथम पुरुष संबंधसूचक प्रत्यय का सीधा, मानक हिन्दी रूप।
