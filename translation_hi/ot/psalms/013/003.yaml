  text: הַבִּ֣יטָֽ/ה עֲ֭נֵ/נִי יְהוָ֣ה אֱלֹהָ֑/י הָאִ֥ירָ/ה עֵ֝ינַ֗/י פֶּן אִישַׁ֥ן הַ/מָּֽוֶת־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/013/003.yaml
  text: Look and answer me[a], O Yahweh my God; give light to my eyes[b], lest I sleep the sleep of death.
translation:
  language: hi
  text: हे याहवे, मेरे परमेश्वर, मेरी ओर देख और मुझे उत्तर दे; मेरी आँखों को उजाला दे[a], कहीं ऐसा न हो कि मैं मृत्यु की नींद सो जाऊँ[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इसका अनुवाद ‘मेरी आँखों को चमका दे’ या ‘मेरी आँखों को ज्योति दे’ भी हो सकता है। इब्रानी बिंब नई स्फूर्ति, स्पष्टता या आशा की ओर संकेत कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: अधिक शाब्दिक रूप में, ‘कहीं ऐसा न हो कि मैं मृत्यु में सो जाऊँ’; परंपरागत रूप में, ‘कहीं मैं मृत्यु की नींद न सो जाऊँ।’
    reason: lexical_alternative
lexical_decisions:
- source_word: הַבִּיטָה
  choice: मेरी ओर देख
  rationale: नבט का आज्ञार्थ परमेश्वर से ध्यानपूर्वक देखने की सीधी विनती है। ‘मेरी ओर देख’ आधुनिक हिन्दी में स्वाभाविक है और प्रार्थना का व्यक्तिगत स्वर बनाए रखता है।
- source_word: עֲנֵנִי
  choice: मुझे उत्तर दे
  rationale: प्रार्थना के प्रसंग में ענה का सामान्य अर्थ ‘उत्तर देना’ है। यह अनुकूल हस्तक्षेप का भाव अनावश्यक रूप से जोड़े बिना विनती को सीधा रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय देवनागरी में लिप्यंतरित किया गया है।
- source_word: אֱלֹהָי
  choice: मेरे परमेश्वर
  rationale: स्वत्वसूचक रूप को सीधे व्यक्त करते हुए व्यक्तिगत और वाचागत संबोधन सुरक्षित रखा गया है।
- source_word: הָאִירָה עֵינַי
  choice: मेरी आँखों में उजाला कर
  rationale: हिफ़ील रूप ‘प्रकाश देना/उजाला करना’ और ‘मेरी आँखें’ के शारीरिक बिंब को स्वाभाविक हिन्दी में बनाए रखता है; इसे केवल शक्ति, समझ या आशा के अर्थ में सीमित नहीं किया गया।
- source_word: פֶּן
  choice: कहीं ऐसा न हो कि
  rationale: यह आशंकित परिणाम का परिचय देता है। यह हिन्दी में स्पष्ट और प्रार्थनात्मक काव्य के अनुरूप है।
- source_word: אִישַׁן הַמָּוֶת
  choice: मैं मृत्यु की नींद सो जाऊँ
  rationale: शाब्दिक संरचना अत्यंत संक्षिप्त और हिन्दी में अस्वाभाविक है। पारंपरिक काव्यात्मक अभिव्यक्ति मृत्यु और नींद के रूपक को स्पष्ट रखती है, जबकि पादटिप्पणी अधिक शाब्दिक संभावनाएँ बताती है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: प्रभु
  rationale: मूल पाठ में चतुरक्षरीय व्यक्तिगत नाम सीधे आया है; इसलिए उपाधि रखने के बजाय नाम का लिप्यंतरण किया गया है।
- issue: ‘मेरी आँखों में उजाला कर’ का रूपक
  choice: रूपक को बनाए रखना
  alternative: मुझे फिर से शक्ति दे / मुझे आशा दे / मुझे स्पष्ट समझ दे
  rationale: यह बिंब नई स्फूर्ति, स्पष्टता या आशा का संकेत दे सकता है, पर मूल पाठ किसी एक अर्थ को निश्चित नहीं करता; इसलिए अर्थगत खुलापन सुरक्षित रखा गया है।
- issue: मृत्यु को नींद के रूप में व्यक्त करना
  choice: मृत्यु की नींद सो जाऊँ
  alternative: मृत्यु में सो जाऊँ / मृत्यु सो जाऊँ
  rationale: यह हिन्दी में काव्यात्मक और बोधगम्य है तथा मृत्यु-नींद के मूल रूपक को बनाए रखता है। इसका उद्देश्य मृत्यु की दशा के विषय में कोई विस्तृत सिद्धांत स्थापित करना नहीं है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और प्रार्थनात्मक रखी गई है। ‘हे’ संबोधन की गंभीरता व्यक्त करता है; ‘मेरी ओर देख’ तथा ‘मुझे उत्तर दे’ सामान्य पाठक के लिए सीधे और सहज हैं। दोनों पादटिप्पणी-चिह्न मुख्य पाठ में अपने संबंधित वाक्यांशों के तुरंत बाद दिए गए हैं।
