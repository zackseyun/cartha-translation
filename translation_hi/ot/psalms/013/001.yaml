  text: עַד אָ֣נָה יְ֭הוָה תִּשְׁכָּחֵ֣/נִי נֶ֑צַח עַד אָ֓נָה תַּסְתִּ֖יר אֶת פָּנֶ֣י/ךָ מִמֶּֽ/נִּי־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/013/001.yaml
  text: How long[a], O Yahweh, will you forget me forever? How long will you hide your face from me?
translation:
  language: hi
  text: कब तक, हे याहवे, तू मुझे सदा के लिए भूलता रहेगा? कब तक तू अपना मुख[a] मुझसे छिपाए रखेगा?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “अपनी उपस्थिति।” शाब्दिक अर्थ “अपना मुख” है। इब्रानी में किसी से मुख छिपाना अपनी कृपा या उपस्थिति हटा लेने का संकेत हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: עַד־אָנָה
  choice: कब तक
  rationale: विलाप में अवधि पूछने वाला स्वाभाविक हिन्दी प्रश्न; इसकी पुनरावृत्ति मूल की व्याकुल पुकार बनाए रखती है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिन्दी में परमेश्वर के व्यक्तिगत वाचा-नाम का प्रचलित लिप्यंतरण; इसे किसी उपाधि से नहीं बदला गया है।
- source_word: תִּשְׁכָּחֵנִי
  choice: तू मुझे भूलता रहेगा
  rationale: अपूर्ण क्रिया चलती आ रही और आगे जारी प्रतीत होने वाली दशा को व्यक्त करती है; हिन्दी में यह प्रयोग शिकायत की अवधि को स्वाभाविक रूप से दर्शाता है।
- source_word: נֶצַח
  choice: क्या सदा के लिए?
  rationale: मूल में यह तीव्र प्रश्नात्मक शिकायत है। अलग प्रश्नांश के रूप में रखने से उस भावात्मक तनाव की रक्षा होती है और यह अर्थ नहीं निकलता कि भूलना सचमुच अनंत होगा।
- source_word: תַּסְתִּיר
  choice: छिपाए रखेगा
  rationale: हिफ़ील अपूर्ण रूप और प्रसंग की निरंतरता को हिन्दी में स्वाभाविक ढंग से व्यक्त करता है।
- source_word: פָּנֶיךָ
  choice: अपना मुख
  rationale: मूल के ठोस काव्यात्मक रूपक को सुरक्षित रखा गया है; यहाँ मुख परमेश्वर की उपस्थिति या कृपा का संकेत भी हो सकता है।
- source_word: מִמֶּנִּי
  choice: मुझसे
  rationale: वियोग दर्शाने वाले पूर्वसर्ग का 'मुख छिपाना' के साथ संक्षिप्त और स्वाभाविक हिन्दी रूप।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: मूल में व्यक्तिगत ईश्वरीय नाम है। हिन्दी पाठकों के लिए परिचित लिप्यंतरण 'यहोवा' नाम को नाम ही रहने देता है, उपाधि में नहीं बदलता।
- issue: '''अपना मुख छिपाना'' का अर्थ'
  choice: मुख को मुख्य पाठ में बनाए रखना
  alternative: अपनी उपस्थिति मुझसे दूर रखना; अपनी कृपा हटा लेना
  rationale: हिब्रू का ठोस काव्यात्मक मुहावरा उपस्थिति और कृपा दोनों की ओर संकेत कर सकता है। किसी एक आशय को मुख्य पाठ में निश्चित कर देना मूल की अर्थ-व्याप्ति को संकुचित करता।
- issue: נֶצַח को कथन या व्याकुल प्रश्न के रूप में पढ़ना
  choice: क्या सदा के लिए?
  alternative: सदा तक मुझे भूलता रहेगा?
  rationale: यह अवधि को तीव्र करने वाला पद है। प्रश्न के भीतर अलग बलाघात देने से भजनकार की अनुभूति व्यक्त होती है, बिना यह सिखाए कि परमेश्वर वास्तव में उसे सदा के लिए भूल गया है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और काव्यात्मक हिन्दी। परमेश्वर के लिए एकवचन आत्मीय संबोधन 'तू' रखा गया है, जो भजन की सीधी पुकार और पारंपरिक हिन्दी बाइबिलीय शैली के अनुरूप है। पुनरुक्त 'कब तक' तथा प्रश्नात्मक तनाव सुरक्षित हैं।
