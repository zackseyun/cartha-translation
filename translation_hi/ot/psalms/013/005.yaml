language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/אֲנִ֤י בְּ/חַסְדְּ/ךָ֣ בָטַחְתִּי֮ יָ֤גֵ֥ל לִבִּ֗/י בִּֽ/ישׁוּעָ֫תֶ֥/ךָ אָשִׁ֥ירָה לַ/יהוָ֑ה כִּ֖י גָמַ֣ל עָלָֽ/י׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/013/005.yaml
  text: But as for me[a], I have trusted in your steadfast love; my heart will rejoice in your salvation. I will sing to Yahweh, because he has dealt bountifully with me.
translation:
  language: hi
  text: परन्तु मैंने तेरे अटल प्रेम पर भरोसा रखा है; मेरा हृदय तेरे उद्धार[a] से आनन्दित होगा। मैं याहवे के लिए गाऊँगा, क्योंकि उसने मेरे साथ भरपूर भलाई की है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘छुटकारे’। इब्रानी शब्द वर्तमान संकट से बचाए जाने के साथ-साथ व्यापक अर्थ में उद्धार को भी दर्शा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי
  choice: परन्तु मैंने
  rationale: संयोजक और बलसूचक सर्वनाम पिछले विलाप के विपरीत भजनकार के भरोसे को सामने लाते हैं; हिन्दी में ‘परन्तु मैंने’ यह विरोध स्वाभाविक रूप से व्यक्त करता है।
- source_word: בְּחַסְדְּךָ
  choice: तेरे अटल प्रेम पर
  rationale: חֶסֶד कृपापूर्ण, निष्ठावान और टिकाऊ प्रेम को दर्शाता है। ‘अटल प्रेम’ इसकी स्थिरता और आत्मीयता दोनों को सहज हिन्दी में बनाए रखता है।
- source_word: בָטַחְתִּי
  choice: भरोसा रखा है
  rationale: पूर्ण क्रिया बीते हुए किंतु वर्तमान में कायम भरोसे को व्यक्त करती है; ‘भरोसा रखा है’ इस स्थिर अवस्था को स्वाभाविक ढंग से दर्शाता है।
- source_word: יָגֵל לִבִּי
  choice: मेरा हृदय ... से आनन्दित होगा
  rationale: अपूर्ण क्रिया अपेक्षित भावी आनन्द की ओर देखती है और ‘हृदय’ भीतरी व्यक्ति को दर्शाता है।
- source_word: בִּישׁוּעָתֶךָ
  choice: तेरे उद्धार से
  rationale: יְשׁוּעָה तत्काल संकट से छुटकारे और व्यापक उद्धार दोनों को समेट सकता है। ‘उद्धार’ व्यापक अर्थ बनाए रखता है, जबकि ‘से’ हिन्दी में आनन्द के आधार को स्वाभाविक बनाता है।
- source_word: אָשִׁירָה
  choice: मैं ... गाऊँगा
  rationale: कोहोर्टेटिव रूप संकल्प या दृढ़ इच्छा व्यक्त करता है; भविष्यकालीन ‘गाऊँगा’ इसे सहज हिन्दी में व्यक्त करता है।
- source_word: לַיהוָה
  choice: याहवे के लिए
  rationale: मूल पाठ में परमेश्वर का विशिष्ट नाम יהוה है; उसका लिप्यंतरण ‘याहवे’ नाम को स्पष्ट रूप से सुरक्षित रखता है।
- source_word: כִּי גָמַל עָלָי
  choice: क्योंकि उसने मेरे साथ भरपूर भलाई की है
  rationale: כִּי कारण बताता है, और גמל עלי यहाँ उदारतापूर्वक हित करने का भाव रखता है। यह रूप उदार भलाई को व्यक्त करता है, बिना उसे लेन-देन या प्रतिफल तक सीमित किए।
theological_decisions:
- issue: परमेश्वर के नाम יהוה का अनुवाद
  choice: याहवे
  alternative: प्रभु
  rationale: मूल में वाचा-संबंधी विशिष्ट नाम सीधे आया है; ‘याहवे’ उसे सामान्य उपाधि में बदले बिना सुरक्षित रखता है।
- issue: יְשׁוּעָה का अर्थ-क्षेत्र
  choice: उद्धार
  alternative: छुटकारा
  rationale: ‘उद्धार’ व्यापक धार्मिक अर्थ और वर्तमान संकट से बचाए जाने, दोनों की संभावना खुली रखता है; ठोस ‘छुटकारा’ को पादटिप्पणी में रखा गया है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी अपनाई गई है। भजन की सीधी प्रार्थनात्मक निकटता बनाए रखने के लिए परमेश्वर के लिए एकवचन आत्मीय संबोधन ‘तेरे’ रखा गया है; भाषा को न अत्यधिक संस्कृतनिष्ठ बनाया गया है, न बोलचाल की सीमा तक सरल।
