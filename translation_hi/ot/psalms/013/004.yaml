lexical_decisions:
- source_word: פֶּן
  choice: कहीं ... न
  rationale: यह नकारात्मक आशंका तथा उस परिणाम को व्यक्त करता है जिसे भजनकार रोकना चाहता है; आधुनिक हिन्दी में ‘कहीं ... न’ स्वाभाविक है।
- source_word: אֹיְבִי
  choice: मेरा शत्रु
  rationale: एकवचन संज्ञा और प्रथम पुरुष एकवचन प्रत्यय को सीधे रूप में व्यक्त करता है।
- source_word: יְכָלְתִּיו
  choice: मैं उस पर प्रबल हो गया हूँ
