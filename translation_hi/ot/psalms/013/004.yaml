- source_word: צָרַי
  choice: मेरे विरोधी
  rationale: बहुवचन को बनाए रखता है और पहले खंड के एकवचन ‘शत्रु’ से शब्दगत भेद भी दिखाता है।
- source_word: יָגִילוּ
  choice: आनन्द मनाएँ
  rationale: विरोधियों के उल्लासपूर्ण आनन्द को सहज और गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: כִּי
  choice: इसलिए ... कि
  rationale: यहाँ विरोधियों के आनन्द का कारण प्रस्तुत करने वाले सम्भावित कारणवाचक अर्थ को व्यक्त करता है।
- source_word: אֶמּוֹט
  choice: मैं डगमगा गया हूँ
  rationale: מוט के निफ़अल रूप में अस्थिर होने या डगमगाने का भाव है; यह बिना वास्तविक गिर पड़ने का अर्थ जोड़े संकटग्रस्त दशा को बताता है।
