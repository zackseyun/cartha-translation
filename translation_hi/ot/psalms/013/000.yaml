lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: संगीत-निर्देशक के लिए
  rationale: भजनों के शीर्षकों में यह पद संगीत-प्रस्तुति की देखरेख करने वाले व्यक्ति को सूचित करता है। ‘संगीत-निर्देशक’ आधुनिक हिन्दी में स्पष्ट है और उपसर्ग לַ को शीर्षक के संदर्भ में स्वाभाविक रूप से ‘के लिए’ कहा गया है।
- source_word: מִזְמוֹר
  choice: भजन
  rationale: यह संगीतबद्ध धार्मिक गीत की मानक विधा-संज्ञा है; हिन्दी बाइबल-परंपरा और सामान्य प्रयोग में ‘भजन’ स्वाभाविक तथा सटीक है।
- source_word: לְדָוִד
  choice: दाऊद का
  rationale: भजन-शीर्षकों में לְ लेखकत्व, संबंध, समर्पण या संग्रह-संबंध का संकेत दे सकता है। ‘दाऊद का’ सहज हिन्दी में इस संबंध को व्यक्त करता है और ‘दाऊद द्वारा रचित’ की अपेक्षा कम निर्णायक है।
theological_decisions:
- issue: शीर्षक में לְדָוִד का आशय
  choice: दाऊद का
  alternative: दाऊद द्वारा रचित; दाऊद के लिए
  rationale: इब्रानी संबंधसूचक प्रयोग केवल लेखकत्व तक सीमित नहीं है। मुख्य पाठ में ‘दाऊद का’ रखकर व्यापक संबंध बनाए रखा गया है और टिप्पणी में संभावित अर्थ स्पष्ट किए गए हैं, ताकि मूल की अस्पष्टता अनावश्यक रूप से समाप्त न हो।
translation_notes:
  register: भाषा आधुनिक, संक्षिप्त और गरिमापूर्ण रखी गई है। ‘गायक-मंडली के निर्देशक’ की अपेक्षा ‘संगीत-निर्देशक’ चुना गया है, क्योंकि मूल पद की भूमिका केवल गायन-मंडली तक सीमित नहीं की जानी चाहिए।
