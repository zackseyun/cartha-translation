translation:
  language: hi
  text: मैं यहोवा के सामने जीवितों के प्रदेशों में चलूँगा।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मैं यहोवा के सामने जीवितों की भूमि में जीवित रहूँगा।” इब्रानी में “सामने चलना” किसी के जीवन और आचरण को भी व्यक्त कर सकता है; और इब्रानी बहुवचन “प्रदेशों” को अधिक सामान्य अर्थ में “भूमि” या “संसार” भी समझा जा सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: אֶתְהַלֵּךְ
  choice: चलता रहूँगा
  rationale: हित्पएल अपूर्ण 1cs गति और जीवन-व्यवहार दोनों का संकेत दे सकता है। ‘चलता रहूँगा’ ठोस इब्रानी बिंब को बनाए रखता है और निरंतर जीवन या आचरण की संभावित छाया को खुला छोड़ता है।
- source_word: לִפְנֵי
  choice: के सामने
  rationale: यह स्थानिक और संबंधपरक दोनों अर्थों में ‘सामने/उपस्थिति में’ व्यक्त करता है; यहाँ ‘के सामने’ सहज और संक्षिप्त है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: परमेश्वर के व्यक्तिगत नाम को हिन्दी में प्रचलित लिप्यंतरण ‘यहोवा’ से प्रस्तुत किया गया है, न कि किसी उपाधि से बदला गया है।
- source_word: בְּאַרְצוֹת
  choice: धरतियों में
  rationale: संज्ञा व्याकरणतः बहुवचन है। ‘धरती’ का बहुवचन मूल रूप को सुरक्षित रखते हुए यहाँ जीवित लोगों के क्षेत्र या संसार का काव्यात्मक भाव देता है।
- source_word: הַחַיִּים
  choice: जीवितों
  rationale: यह निश्चित बहुवचन विशेषण का संज्ञात्मक प्रयोग है, अर्थात ‘जो जीवित हैं’; ‘जीवितों’ हिन्दी में संक्षिप्त और स्वाभाविक है।
theological_decisions:
- issue: क्या पद का आशय शारीरिक रूप से जीवित रहना है या परमेश्वर की उपस्थिति में जीवन-आचरण करना
  choice: ‘चलता रहूँगा’ के चलने वाले मुहावरे को बनाए रखा गया
  alternative: ‘मैं यहोवा के सामने जीवित रहूँगा’ अथवा ‘मैं यहोवा के सामने अपना जीवन बिताऊँगा’
  rationale: इब्रानी कथन उद्धार के बाद जीवित बने रहने और परमेश्वर के सामने जीवन बिताने—दोनों भावों को धारण कर सकता है। अनुवाद किसी एक भाव तक इसे सीमित नहीं करता।
- issue: בְּאַרְצוֹת के बहुवचन को कैसे समझा जाए
  choice: मुख्य पाठ में ‘धरतियों’ बहुवचन रखा गया
  alternative: ‘जीवितों की धरती में’ या ‘जीवितों के संसार में’
  rationale: मसोरेटिक पाठ स्पष्ट रूप से बहुवचन है, यद्यपि पूरा पदबंध सामान्यतः जीवितों के क्षेत्र या संसार को सूचित कर सकता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में काव्यात्मक और गरिमापूर्ण शैली रखी गई है। ‘जीवितों की धरतियों’ कुछ असामान्य सुनाई देता है, पर यह मूल के वास्तविक बहुवचन को जानबूझकर सुरक्षित रखता है; पादटिप्पणी अधिक स्वाभाविक एकवचन विकल्प स्पष्ट करती है।
