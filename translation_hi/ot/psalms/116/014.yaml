  yaml_path: translation/ot/psalms/116/014.yaml
  text: I will fulfill my vows to Yahweh in the presence of all his people[a][b].
translation:
  language: hi
  text: मैं याहवे के प्रति अपनी मन्नतें उसकी सारी प्रजा के सामने निश्चय ही[b] पूरी करूँगा[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘अपनी मन्नतें चुकाऊँगा।’ इब्रानी क्रिया का अर्थ मानी हुई मन्नत का दायित्व पूरा करना या चुकाना हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: यहाँ ‘निश्चय ही’ के लिए आया इब्रानी अव्यय ‘अब’ भी समझा जा सकता है; इस संदर्भ में वह कथन और मन्नतों के सार्वजनिक निर्वाह पर बल देता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: נְדָרַי
  choice: अपनी मन्नतें
  rationale: נֶדֶר किसी प्रतिज्ञाबद्ध वचन या मन्नत को दर्शाता है। प्रथम पुरुष एकवचन संबंधसूचक प्रत्यय के साथ बहुवचन का स्वाभाविक हिन्दी रूप ‘अपनी मन्नतें’ है।
- source_word: לַיהוָה
  choice: यहोवा से की हुई
  rationale: ל यहाँ बताता है कि मन्नतें यहोवा के प्रति मानी गई हैं। हिन्दी में ‘यहोवा से की हुई अपनी मन्नतें’ इस संबंध को स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है। परमेश्वर के व्यक्तिगत नाम יהוה को ‘यहोवा’ लिखा गया है।
- source_word: אֲשַׁלֵּם
  choice: पूरी करूँगा
  rationale: שׁלם का पिएल रूप यहाँ मानी हुई मन्नत को पूरा करने या उसका दायित्व चुकाने के अर्थ में है। आधुनिक हिन्दी में ‘मन्नतें पूरी करूँगा’ स्वाभाविक है।
- source_word: נֶגְדָה
  choice: के सामने
  rationale: यह शब्द उपस्थिति और सार्वजनिक रूप से किए जाने का भाव देता है; ‘उसके सब लोगों के सामने’ दोनों बातों को सहज हिन्दी में व्यक्त करता है।
- source_word: נָא
  choice: हाँ
  rationale: इस काव्यात्मक संदर्भ में נָא विनतीसूचक न होकर कथन पर बल देने वाला अव्यय है। ‘हाँ’ उसके पुष्टिकारक बल को बनाए रखता है।
- source_word: לְכָל עַמּוֹ
  choice: उसके सब लोगों के सामने
  rationale: यह वाक्यांश उस सार्वजनिक समुदाय को बताता है जिसकी उपस्थिति में मन्नतें पूरी की जाएँगी। ‘सब’ כָל की व्यापकता को रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ में चार अक्षरों वाला व्यक्तिगत वाचा-नाम सीधे आया है। हिन्दी में व्यापक रूप से पहचाने जाने वाले नामरूप ‘यहोवा’ से इसे सामान्य उपाधि ‘प्रभु’ में बदले बिना सुरक्षित रखा गया है।
- issue: मन्नत पूरी करने का सार्वजनिक स्वरूप
  choice: उसके सब लोगों के सामने
  alternative: उसके सब लोगों की उपस्थिति में
  rationale: दोनों रूप נֶגְדָה का अर्थ दे सकते हैं; चुना हुआ रूप अधिक सहज है और इस बात को बनाए रखता है कि मन्नत का निर्वाह समुदाय के समक्ष होगा।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सार्वजनिक पाठ के योग्य रखी गई है। ‘मन्नतें पूरी करना’ सामान्य हिन्दी मुहावरा है; डैश और ‘हाँ’ मूल के बलाघात को सुनने योग्य बनाते हैं।
