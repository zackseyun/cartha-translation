  text: נְ֭דָרַ/י לַ/יהוָ֣ה אֲשַׁלֵּ֑ם נֶגְדָ/ה נָּ֝֗א לְ/כָל עַמּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/116/018.yaml
  text: I will fulfill my vows to Yahweh in the presence of all his people[a][b].
translation:
  language: hi
  text: 'मैं याहवे के प्रति अपनी मन्नतें पूरी करूँगा,

    उसकी सारी प्रजा के सामने।[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में ‘सामने’ के बाद नָא नामक कण है, जिसका अर्थ यहाँ अनिश्चित है और जो संभवतः बल देता है; इसलिए इसका अलग अनुवाद नहीं किया गया है।
    reason: नֶגְדָה־נָא की कठिन, संभवतः बलदर्शक नָא को बिना अनावश्यक निश्चितता के स्पष्ट करता है।
lexical_decisions:
- source_word: נְדָרַי
  choice: अपनी मन्नतें
  rationale: נֶדֶר प्रतिज्ञा या मन्नत को दर्शाता है; प्रथम पुरुष एकवचन प्रत्यय के कारण अर्थ 'मेरी मन्नतें' है। हिंदी वाक्य-विन्यास में कर्ता के संदर्भ से 'अपनी' स्वाभाविक है।
- source_word: לַיהוָה
  choice: यहोवा के सामने
  rationale: לַיהוָה को क्रिया אֲשַׁלֵּם के साथ ग्रहण करने पर मन्नतें यहोवा के प्रति पूरी की जाती हैं; हिंदी में पंक्तियों की समानता बनाए रखने के लिए 'यहोवा के सामने' कहा गया है, किंतु यह स्रोत के ל का शाब्दिक प्रतिरूप नहीं है।
- source_word: אֲשַׁלֵּם
  choice: पूरी करूँगा
  rationale: पिएल रूप שׁלם मन्नत के संदर्भ में उसे चुकाने या पूरा करने का अर्थ देता है। आधुनिक हिंदी में 'मन्नत पूरी करना' स्वाभाविक है और अनावश्यक आर्थिक अर्थ से बचाता है।
- source_word: נֶגְדָה־נָּא
  choice: के सामने
  rationale: נֶגֶד का अर्थ 'सामने/उपस्थिति में' है। נָא यहाँ कठिन और संभवतः बलदर्शक है; उसका अलग कालगत अनुवाद नहीं किया गया।
- source_word: לְכָל עַמּוֹ
  choice: उसकी सारी प्रजा के सामने
  rationale: यह वाक्यांश यहोवा की समस्त प्रजा की दृष्टि में सार्वजनिक रूप से मन्नत पूरी करने को बताता है। प्रत्यय 'उसकी' यहोवा की ओर संकेत करता है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का रूपांतरण
  choice: यहोवा
  alternative: याहवे
  rationale: हिंदी के सामान्य बाइबलीय प्रयोग में 'यहोवा' परिचित नामरूप है और मूल पाठ में आए व्यक्तिगत वाचा-नाम को सामान्य पदवी से नहीं बदलता।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सार्वजनिक उपासना में सहज हिंदी। 'मन्नतें पूरी करना' प्रचलित मुहावरा है; काव्यात्मक समानता के लिए दो पंक्तियाँ रखी गई हैं।
