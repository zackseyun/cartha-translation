  text: To you I will offer a sacrifice of thanksgiving[a], and I will call on the name of Yahweh.
translation:
  language: hi
  text: मैं तुझे धन्यवाद की बलि चढ़ाऊँगा और याहवे[a] का नाम लेकर पुकारूँगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में YHWH; परंपरागत रूप से इसे “प्रभु” से प्रतिस्थापित किया जाता है। “यहोवा” भी एक प्रचलित रूप है।
    reason: ईश्वरीय नाम के मूल रूप और वैकल्पिक पारंपरिक प्रस्तुतियों को स्पष्ट करना।
lexical_decisions:
- source_word: לְךָ
  choice: तुझे
  rationale: लְ उपसर्ग और द्वितीय पुरुष एकवचन प्रत्यय बलि के प्राप्तकर्ता की ओर संकेत करते हैं; वाक्य के आरंभ में रखकर इब्रानी के संबोधन-बल को बनाए रखा गया है।
- source_word: אֶזְבַּח
  choice: चढ़ाऊँगा
  rationale: זבח यहाँ बलि-संबंधी क्रिया है। हिंदी में ‘बलि चढ़ाना’ स्वाभाविक और स्पष्ट है तथा केवल पशु-वध का संकीर्ण अर्थ नहीं देता।
- source_word: זֶבַח תּוֹדָה
  choice: धन्यवाद-बलि
  rationale: यह रचना धन्यवाद व्यक्त करने वाली बलि को दर्शाती है। ‘धन्यवाद-बलि’ बलि और कृतज्ञता—दोनों अर्थों को संक्षेप में सुरक्षित रखती है।
- source_word: וּבְשֵׁם ... אֶקְרָא
  choice: और ... का नाम पुकारूँगा
  rationale: קרא בשם का मुहावरा नाम लेकर परमेश्वर को पुकारने अथवा उसका आह्वान करने का भाव देता है; ‘नाम पुकारूँगा’ इसे सहज हिंदी में व्यक्त करता है, बिना इसे केवल घोषणा या किसी विशेष पूजा-विधि तक सीमित किए।
- source_word: יְהוָה
  choice: याहवे
  rationale: चार अक्षरों वाले व्यक्तिगत ईश्वरीय नाम YHWH को उपाधि से बदलने के बजाय हिंदी लिप्यंतरण ‘याहवे’ से प्रस्तुत किया गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; ‘प्रभु’
  rationale: मूल पाठ में व्यक्तिगत नाम YHWH है। ‘याहवे’ संभावित प्राचीन उच्चारण का प्रचलित लिप्यंतरण है; पादटिप्पणी पारंपरिक प्रतिस्थापन और दूसरे प्रचलित रूप की जानकारी देती है।
translation_notes:
  register: भाषा आधुनिक, संक्षिप्त और भक्तिपूर्ण है। ‘धन्यवाद-बलि’ सामान्य पाठक के लिए समझने योग्य रहते हुए प्राचीन बलिदानी संदर्भ को बनाए रखती है।
