  text: כּוֹס יְשׁוּע֥וֹת אֶשָּׂ֑א וּ/בְ/שֵׁ֖ם יְהוָ֣ה אֶקְרָֽא־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/116/013.yaml
  text: I will lift up the cup of salvations[a], and I will call on the name of Yahweh.
translation:
  language: hi
  text: मैं उद्धारों[a] का प्याला उठाऊँगा, और याहवे के नाम की दुहाई दूँगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में यहाँ ‘उद्धार’ या ‘छुटकारे’ बहुवचन में है; यह परमेश्वर के अनेक उद्धारकारी कामों को अथवा प्रबल काव्यात्मक भाव को व्यक्त कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כּוֹס
  choice: प्याला
  rationale: यह शब्द पीने के पात्र को दर्शाता है। ‘प्याला’ आधुनिक हिन्दी में स्वाभाविक है और काव्यात्मक रूपक को बनाए रखता है।
- source_word: יְשׁוּעוֹת
  choice: उद्धारों
  rationale: इब्रानी शब्द रूप की दृष्टि से बहुवचन है। हिन्दी में यह प्रयोग असामान्य होते हुए भी परमेश्वर के अनेक छुटकारे के कामों या भाववाचक प्रबल बहुवचन की संभावना को सुरक्षित रखता है।
- source_word: אֶשָּׂא
  choice: उठाऊँगा
  rationale: נשׂא का मूल अर्थ उठाना या ऊपर करना है; प्याले के साथ ‘उठाऊँगा’ काव्यात्मक चित्र को स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: וּבְשֵׁם ... אֶקְרָא
  choice: और ... का नाम पुकारूँगा
  rationale: קרא בשם किसी का नाम लेकर उसे पुकारने या उसकी दुहाई देने का मुहावरा है। यह अनुवाद प्रार्थना और आह्वान का भाव रखते हुए ‘नाम’ को भी स्पष्ट रूप से बनाए रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: चार अक्षरों वाले दिव्य नाम יהוה को किसी उपाधि से बदलने के बजाय हिन्दी में उसके प्रचलित विद्वत्तापूर्ण उच्चारण के निकट लिप्यंतरित किया गया है।
theological_decisions:
- issue: दिव्य नाम יהוה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में व्यक्तिगत दिव्य नाम आया है। ‘याहवे’ उसे उपाधि से बदले बिना और ‘यहोवा’ वाले बाद के मिश्रित उच्चारण को अपनाए बिना प्रस्तुत करता है।
- issue: יְשׁוּעוֹת के बहुवचन का निर्वाह
  choice: उद्धारों
  alternative: उद्धार; छुटकारों
  rationale: मूल का बहुवचन कई उद्धारकारी कार्यों को सूचित कर सकता है, पर यह काव्यात्मक या भाववाचक प्रबल बहुवचन भी हो सकता है। मुख्य पाठ में बहुवचन रखकर और पादटिप्पणी में दोनों संभावनाएँ बताकर इस तनाव को खुला रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और काव्यात्मक रखी गई है। ‘उद्धारों का प्याला’ हिन्दी में जानबूझकर कुछ असामान्य है, क्योंकि यह मूल इब्रानी बहुवचन को सुरक्षित रखता है; पादटिप्पणी उसका अर्थ स्पष्ट करती है।
