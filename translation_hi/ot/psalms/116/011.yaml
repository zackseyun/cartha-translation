  yaml_path: translation/ot/psalms/116/011.yaml
  text: I said in my alarm[b][a], “Every man is a liar.”
translation:
  language: hi
  text: मैंने अपनी घबराहट में कहा[a], “हर मनुष्य झूठा है।”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “अपनी जल्दबाज़ी में।” इब्रानी शब्द जल्दबाज़ी से उपजी व्याकुलता, घबराहट या आतंक का भाव व्यक्त कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: या “सारी मानवजाति झूठी है।” इब्रानी में शाब्दिक रूप से “हर मनुष्य” है, जहाँ “मनुष्य” का प्रयोग सामूहिक सामान्य अर्थ में हुआ है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲנִי
  choice: मैंने
  rationale: प्रथम पुरुष एकवचन को स्पष्ट रखा गया है; हिन्दी में यह क्रिया ‘कहा’ के साथ स्वाभाविक रूप से ‘मैंने’ बनता है।
- source_word: אָמַרְתִּי
  choice: कहा
  rationale: सामान्य बोलने की क्रिया के लिए सहज और प्रसंगानुकूल हिन्दी रूप।
- source_word: בְחָפְזִי
  choice: अपनी घबराहट में
  rationale: यह पद जल्दबाज़ी के साथ व्याकुलता, घबराहट या आतंक का भाव भी व्यक्त कर सकता है; संकट के प्रसंग में ‘घबराहट’ भावात्मक बल को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: כָּל־הָאָדָם
  choice: हर मनुष्य
  rationale: כָּל के साथ सामूहिक אָדָם का सार्वभौमिक आशय है; ‘हर मनुष्य’ मूल के एकवचन-सामूहिक रूप और सामान्य मानवीय संदर्भ दोनों को सुरक्षित रखता है।
- source_word: כֹּזֵב
  choice: झूठा है
  rationale: कर्ता को असत्य या छल से चिह्नित करने वाले विधेयात्मक कृदन्त का सीधा और प्रभावशाली हिन्दी रूप।
