language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: שׁוּבִ֣י נַ֭פְשִׁ/י לִ/מְנוּחָ֑יְ/כִי כִּֽי יְ֝הוָ֗ה גָּמַ֥ל עָלָֽיְ/כִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/116/007.yaml
  text: Return[a], my soul, to your rest, for Yahweh has dealt bountifully with you.
translation:
  language: hi
  text: हे मेरे प्राण, अपने विश्राम में लौट आ, क्योंकि याहवे ने तेरा भला किया है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שׁוּבִי
  choice: लौट आ
  rationale: स्त्रीलिंग एकवचन आज्ञार्थक रूप संबोधित ‘प्राण’ से मेल खाता है और पहले की विश्राम-अवस्था में वापस आने का भाव स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: נַפְשִׁי
  choice: हे मेरे प्राण
  rationale: यहाँ कवि स्वयं को संबोधित कर रहा है। ‘मेरे प्राण’ आत्म-संबोधन की काव्यात्मक और पारंपरिक शक्ति बनाए रखता है।
- source_word: לִמְנוּחָיְכִי
  choice: अपने विश्राम में
  rationale: מנוחה विश्राम या विश्राम की अवस्था/जगह का संकेत दे सकता है। ‘अपने विश्राम में’ रूपक को सुरक्षित रखते हुए हिंदी में सहज है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यह आज्ञा का कारण प्रस्तुत करता है; ‘क्योंकि’ आधुनिक हिंदी में स्पष्ट और स्वाभाविक है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को उपाधि से बदलने के बजाय हिंदी में प्रचलित लिप्यंतरण द्वारा प्रस्तुत किया गया है।
- source_word: גָּמַל עָלָיְכִי
  choice: तेरा भला किया है
  rationale: גמל का मूल अर्थ किसी के साथ व्यवहार करना या उसे प्रतिफल देना हो सकता है; धन्यवाद-गीत के इस सकारात्मक संदर्भ में ‘भला किया है’ अर्थ को स्वाभाविक हिंदी में व्यक्त करता है, बिना मात्रा या प्रकार को अनावश्यक रूप से निश्चित किए।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ में व्यक्तिगत ईश्वरीय नाम है। हिंदी पाठकों के लिए सुविख्यात ‘यहोवा’ नाम की पहचान बनाए रखता है और इसे ‘प्रभु’ जैसी उपाधि से प्रतिस्थापित नहीं करता।
- issue: גמל के सकारात्मक व्यवहार का स्वरूप
  choice: तेरा भला किया है
  alternative: तेरे साथ उदारता से व्यवहार किया है
  rationale: संदर्भ स्पष्टतः कल्याणकारी व्यवहार बताता है, पर क्रिया अपने आप में उदारता की मात्रा को निश्चित नहीं करती। संक्षिप्त विकल्प मूल की अर्थ-व्याप्ति और काव्यात्मकता को बेहतर सुरक्षित रखता है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और काव्यात्मक हिंदी। आत्म-संबोधन के लिए ‘हे मेरे प्राण’ तथा स्त्रीलिंग क्रिया ‘लौट आ’ का प्रयोग किया गया है; वाक्य संक्षिप्त रखा गया है ताकि भजन की अंतरंग आश्वस्ति बनी रहे।
