translation:
  language: hi
  text: 'क्योंकि उसने मेरी ओर अपना कान झुकाया है,

    मैं जीवन भर उसे पुकारूँगा।[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक: “और अपने दिनों में मैं पुकारूँगा।” इस पदबंध का अर्थ है कि भजनकार अपने पूरे जीवन भर यहोवा को पुकारता रहेगा।'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले कथन का कारण बताता है; आधुनिक हिन्दी में कारण-संबंध स्पष्ट और स्वाभाविक है।
- source_word: הִטָּה אָזְנוֹ לִי
  choice: उसने मेरी ओर अपना कान लगाया है
  rationale: कान झुकाने या लगाने का इब्रानी रूपक बनाए रखते हुए ध्यान से सुनने का भाव व्यक्त करता है। 'मेरी ओर' לִי की दिशात्मकता को स्वाभाविक हिन्दी में दर्शाता है।
- source_word: וּבְיָמַי
  choice: इसलिए मैं जीवन भर
  rationale: शाब्दिक अर्थ 'और अपने दिनों में' है। प्रसंग में यह भजनकार के जीवनकाल की अवधि बताता है; हिन्दी में 'जीवन भर' उसी भाव को सहजता से व्यक्त करता है। संयोजक ו को यहाँ कारण से उत्पन्न संकल्प के रूप में 'इसलिए' से व्यक्त किया गया है।
- source_word: אֶקְרָא
  choice: उसे पुकारूँगा
  rationale: प्रार्थना के प्रसंग में קרא का अर्थ प्रभु को पुकारना है। कर्म मूल पाठ में व्यक्त नहीं है, पर पूर्वसंदर्भ से स्पष्ट होने के कारण हिन्दी में 'उसे' स्वाभाविक रूप से जोड़ा गया है।
