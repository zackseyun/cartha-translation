  edition: WLC
  text: וּ/בְ/שֵֽׁם יְהוָ֥ה אֶקְרָ֑א אָנָּ֥ה יְ֝הוָ֗ה מַלְּטָ֥/ה נַפְשִֽׁ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/116/004.yaml
  text: 'Then I called on the name of the LORD: “Please, LORD, rescue my life!”'
translation:
  language: hi
  text: 'तब मैंने यहोवा का नाम लेकर पुकारा: “हे यहोवा, कृपा करके मेरे प्राण[a] बचा ले!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “मेरा जीवन”; इब्रानी शब्द व्यक्ति, प्राण या जीवन का बोध करा सकता है।
    reason: נֶפֶשׁ के अर्थ-क्षेत्र और इस प्रसंग में संभव अनुवाद को स्पष्ट करना।
lexical_decisions:
- source_word: וּבְשֵׁם יְהוָה אֶקְרָא
  choice: तब मैंने यहोवा का नाम लेकर पुकारा
  rationale: בְשֵׁם के धार्मिक आशय—यहोवा को नाम लेकर सहायता के लिए पुकारना—को स्वाभाविक हिन्दी में व्यक्त किया गया है। प्रसंग में וּ को घटनाक्रम आगे बढ़ाने वाले ‘तब’ के रूप में लिया गया है।
- source_word: אָנָּה
  choice: कृपा करके
  rationale: यह विनती को प्रबल करने वाला कण है; ‘कृपा करके’ आधुनिक हिन्दी में उसकी नम्र और व्याकुल प्रार्थना व्यक्त करता है।
- source_word: מַלְּטָה
  choice: बचा ले
  rationale: पील आज्ञार्थक रूप तत्काल उद्धार या संकट से छुड़ाने की विनती है; ‘बचा ले’ बोलचाल में स्वाभाविक और प्रसंगानुकूल है।
- source_word: נַפְשִׁי
  choice: मेरे प्राण
  rationale: נֶפֶשׁ यहाँ केवल अमूर्त ‘आत्मा’ नहीं, संकट में पड़े जीवित व्यक्ति अथवा उसके जीवन को दर्शाता है; ‘मेरे प्राण’ इस अर्थ और मूल बिंब दोनों को बनाए रखता है।
theological_decisions:
- issue: נֶפֶשׁ का अर्थ-क्षेत्र
  choice: मेरे प्राण
  alternative: मेरी आत्मा / मेरा जीवन / मुझे
  rationale: मृत्यु के संकट के संदर्भ में जीवन का अर्थ प्रमुख है, किंतु ‘प्राण’ मूल शब्द के व्यक्ति और जीवन दोनों से जुड़े अर्थ को बिना शरीर–आत्मा संबंध पर कोई संप्रदायगत निष्कर्ष थोपे सुरक्षित रखता है।
- issue: दिव्य नाम יהוה का निरूपण
  choice: यहोवा
  alternative: प्रभु
  rationale: मूल में व्यक्तिगत दिव्य नाम स्पष्ट रूप से दो बार आया है। हिन्दी पाठक के लिए परिचित रूप ‘यहोवा’ उस भेद को बनाए रखता है और सामान्य उपाधि ‘प्रभु’ में नहीं बदलता।
translation_notes:
  register: भाषा आधुनिक, सरल और प्रार्थनापूर्ण रखी गई है। ‘हे यहोवा’ संबोधन की गंभीरता बनाए रखता है, जबकि ‘कृपा करके’ और ‘बचा ले’ व्याकुल व्यक्तिगत विनती को स्वाभाविक हिन्दी में व्यक्त करते हैं।
