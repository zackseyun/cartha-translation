  text: מָֽה אָשִׁ֥יב לַ/יהוָ֑ה כָּֽל תַּגְמוּל֥וֹ/הִי עָלָֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/116/012.yaml
  text: What shall I return to Yahweh for all his benefits to me?[a]
translation:
  language: hi
  text: याहवे ने मेरे लिए जितने उपकार किए हैं, उन सबके बदले मैं उन्हें क्या लौटाऊँ?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “याहवे ने मेरे साथ जो कुछ किया है, उसके बदले मैं उन्हें क्या चुकाऊँ?” इब्रानी शब्द का अर्थ ‘व्यवहार’, ‘प्रतिफल’ या ‘उपकार’ हो सकता है; धन्यवाद के इस प्रसंग में मुख्य पाठ ने “उपकार” चुना है।
    reason: lexical_alternative
lexical_decisions:
- source_word: מָה
  choice: क्या
  rationale: यह प्रश्नवाचक सर्वनाम भजनकार के प्रश्न को सीधे प्रस्तुत करता है।
- source_word: אָשִׁיב
  choice: मैं ... क्या लौटाऊँ
  rationale: שׁוב के हिफ़ील रूप का मूल भाव ‘वापस करना/लौटाना’ है; यहाँ यह परमेश्वर के उपकारों के प्रत्युत्तर का भाव भी रखता है, बिना पूर्ण ऋण-चुकौती का अर्थ थोपे।
- source_word: לַיהוָה
  choice: याहवे ... उन्हें
  rationale: ל अप्रत्यक्ष कर्म को चिह्नित करता है। יהוה को वाचा-संबंधी व्यक्तिगत नाम ‘याहवे’ के रूप में रखा गया है; आगे सम्मानसूचक सर्वनाम ‘उन्हें’ स्वाभाविक हिन्दी देता है।
- source_word: כָּל
  choice: जितने ... उन सब
  rationale: यह समस्त उपकारों की पूर्णता पर बल देता है; हिन्दी में सहसंबंधी रचना वाक्य को स्वाभाविक बनाती है।
- source_word: תַּגְמוּלֹהִי
  choice: उपकार
  rationale: גמול से बना यह शब्द व्यवहार, प्रतिफल या लाभकारी कृपाकर्म का अर्थ रख सकता है। धन्यवाद के प्रसंग में ‘उपकार’ सकारात्मक भाव को स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
- source_word: עָלָי
  choice: मेरे लिए
  rationale: इस प्रयोग में על भजनकार की ओर किए गए कार्यों को दर्शाता है; ‘मेरे लिए’ आधुनिक हिन्दी में सहज है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में चार-अक्षरीय व्यक्तिगत नाम सीधे आया है। ‘याहवे’ उसे उपाधि में बदलने के बजाय नाम के रूप में सुरक्षित रखता है।
- issue: मनुष्य की प्रतिक्रिया को ऋण-चुकौती मानना
  choice: क्या लौटाऊँ
  alternative: क्या चुका सकता हूँ
  rationale: ‘लौटाऊँ’ मूल क्रिया के ठोस अर्थ और प्रत्युत्तर के भाव को रखता है, जबकि ‘चुकाऊँ’ ऐसा लेन-देन या पूर्ण प्रतिदान सुझा सकता है जिसे पद अनिवार्यतः नहीं कहता।
translation_notes:
  register: भाषा आधुनिक, सम्मानपूर्ण और सामान्य पाठकों के लिए सहज रखी गई है। प्रश्न की काव्यात्मकता बनाए रखते हुए हिन्दी की स्वाभाविक सहसंबंधी रचना ‘जितने...उन सब’ अपनाई गई है।
