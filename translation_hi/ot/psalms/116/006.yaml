  yaml_path: translation/ot/psalms/116/006.yaml
  text: Yahweh preserves the simple[a]; I was brought low[c][b], and he saved me.
translation:
  language: hi
  text: याहवे भोले-भाले लोगों[a] की रक्षा करता है; मैं दीन दशा में पहुँच गया था[b], और उसने मुझे बचाया[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “सरल लोगों,” “अनुभवहीन लोगों” अथवा “असावधान लोगों।” इब्रानी शब्द का अर्थ आवश्यक नहीं कि नैतिक रूप से मूर्ख लोग हो।
    reason: lexical_alternative
  - marker: b
    text: या “मैं निर्बल हो गया था” अथवा “मैं बहुत नीचे गिर गया था।” इब्रानी अभिव्यक्ति घट जाने, दुर्बल होने या दीन किए जाने का भाव दे सकती है।
    reason: lexical_alternative
  - marker: c
    text: या “उसने मुझे छुड़ाया।”
    reason: lexical_alternative
lexical_decisions:
- source_word: שֹׁמֵר
  choice: रक्षा करता है
  rationale: इब्रानी कृदंत लगातार पहरा देने, सुरक्षित रखने या संभालने का भाव व्यक्त करता है। वर्तमानकालीन हिंदी अभिव्यक्ति ‘रक्षा करता है’ इस निरंतर संरक्षण को स्वाभाविक रूप से व्यक्त करती है।
- source_word: פְּתָאיִם
  choice: भोले-भाले लोगों
  rationale: यह शब्द ऐसे सरल, अनुभवहीन या असावधान लोगों को दर्शाता है जो आवश्यक नहीं कि नैतिक रूप से मूर्ख हों। ‘भोले-भाले’ सामान्य हिंदी में इस भाव को सहजता से व्यक्त करता है।
- source_word: יְהֹוָה
  choice: याहवे
  rationale: मूल पाठ में परमेश्वर का विशिष्ट वाचा-नाम है; इसलिए उसे उपाधि में बदलने के बजाय हिंदी में लिप्यंतरित किया गया है।
- source_word: דַּלּוֹתִי
  choice: मैं दीन दशा में पहुँच गया था
  rationale: दलल धातु का यह रूप नीचे गिरने, घट जाने, निर्बल होने या दीन दशा में पहुँचने का व्यापक भाव रखता है। यह चयन अर्थ को केवल आर्थिक निर्धनता या शारीरिक दुर्बलता तक सीमित नहीं करता।
- source_word: וְלִי
  choice: और
  rationale: शाब्दिक ‘और मेरे लिए’ हिंदी में अस्वाभाविक होगा। संदर्भ में इसका आशय है कि याहवे ने वक्ता की ओर से कार्य किया; यह भाव अगले वाक्य में स्वाभाविक रूप से समाहित है।
- source_word: יְהוֹשִׁיעַ
  choice: उसने मुझे बचाया
  rationale: हिफ़ील रूप व्यक्तिगत संकट से बचाने या छुड़ाने की क्रिया बताता है। ‘मुझे बचाया’ सीधा, सामान्य और संदर्भानुकूल है।
theological_decisions:
- issue: יהוה परमेश्वर के नाम का अनुवाद
  choice: याहवे
  alternative: प्रभु
  rationale: पद में सामान्य उपाधि नहीं, चार अक्षरों वाला विशिष्ट दिव्य नाम प्रयुक्त है। ‘याहवे’ मूल की पहचान बनाए रखता है, जबकि ‘प्रभु’ पाठ में उपस्थित नाम और उपाधि के अंतर को मिटा देता।
- issue: פְּתָאיִם का नैतिक आशय
  choice: भोले-भाले लोगों
  alternative: मूर्खों
  rationale: मूल शब्द यहाँ अनुभवहीन, असुरक्षित या सरल लोगों का संकेत दे सकता है; उसे ‘मूर्खों’ के रूप में प्रस्तुत करना अनावश्यक नैतिक निंदा जोड़ देगा।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। अर्धविराम इब्रानी पद की दो संबद्ध पंक्तियों—याहवे के सामान्य संरक्षण और भजनकार के व्यक्तिगत अनुभव—को स्पष्ट रूप से जोड़ता है।
