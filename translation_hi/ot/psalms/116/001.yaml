  text: אָ֭הַבְתִּי כִּֽי יִשְׁמַ֥ע יְהוָ֑ה אֶת ק֝וֹלִ֗/י תַּחֲנוּנָֽ/י־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/116/001.yaml
  text: I love that the LORD hears my voice, my pleas for mercy.
translation:
  language: hi
  text: मैं प्रेम करता हूँ, क्योंकि यहोवा मेरी आवाज़ और दया के लिए मेरी विनतियाँ सुनता है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אָהַבְתִּי
  choice: मैं प्रेम करता हूँ
  rationale: इब्रानी का शाब्दिक अर्थ ‘मैं प्रेम करता हूँ’ है। कर्म स्पष्ट रूप से व्यक्त नहीं है, इसलिए अनुवाद में भी इस खुलेपन को बनाए रखा गया है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यहाँ पद के अगले कथन को प्रेम का कारण बताने वाला संबंध मानना स्वाभाविक है; ‘कि’ भी व्याकरणतः संभव है, पर हिंदी में उससे वाक्य अधिक अधूरा सुनाई देता है।
- source_word: יִשְׁמַע
  choice: सुनता है
  rationale: अपूर्ण क्रिया-रूप को यहाँ यहोवा के वर्तमान/निरंतर सुनने के रूप में प्रस्तुत किया गया है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: व्यक्तिगत दिव्य नाम को हिंदी में प्रचलित लिप्यंतरण से दिया गया है, सामान्य उपाधि से प्रतिस्थापित नहीं किया गया।
- source_word: תַּחֲנוּנָי
  choice: दया के लिए मेरी विनती
  rationale: शब्द कृपा या दया पाने के लिए की गई गिड़गिड़ाहट/विनती को व्यक्त करता है; यह रूप अर्थ को सहज आधुनिक हिंदी में स्पष्ट करता है।
theological_decisions:
- issue: ‘मैं प्रेम करता हूँ’ का अव्यक्त कर्म
  choice: कर्म को नहीं जोड़ा गया
  alternative: ‘मैं यहोवा से प्रेम करता हूँ’
  rationale: मसोराई पाठ में אָהַבְתִּי के बाद प्रत्यक्ष कर्म नहीं है। संदर्भ से यहोवा संभावित कर्म है, पर उसे जोड़ने से मूल की वास्तविक वाक्यगत अस्पष्टता समाप्त हो जाती।
- issue: כִּי का संबंध
  choice: ‘क्योंकि’—यहोवा का सुनना प्रेम का कारण है
  alternative: ‘मुझे यह प्रिय है कि यहोवा सुनता है’
  rationale: दोनों व्याख्याएँ संभव हैं। ‘क्योंकि’ पारंपरिक और वाक्य-संदर्भानुकूल पठन है, जबकि अव्यक्त कर्म को फिर भी खुला रखा गया है।
translation_notes:
  register: आधुनिक मानक हिंदी; सरल, गरिमापूर्ण और पाठ के काव्यात्मक संक्षेप को बनाए रखने वाला रूप। ‘आवाज़’ और ‘विनती’ सामान्य पाठक के लिए सहज हैं।
