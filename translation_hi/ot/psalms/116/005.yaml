source:
  edition: WLC
  text: חַנּ֣וּן יְהֹוָ֣ה וְ/צַדִּ֑יק וֵ֖/אלֹהֵ֣י/נוּ מְרַחֵֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/116/005.yaml
  text: Gracious is Yahweh[a], and righteous[b]; our God is compassionate.
translation:
  language: hi
  text: याहवे अनुग्रहकारी और धर्मी है; हमारा परमेश्वर करुणामय है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חַנּוּן
  choice: अनुग्रहकारी
  rationale: यह विशेषण याहवे के अनुग्रह और कृपा करने वाले स्वभाव को व्यक्त करता है; ‘अनुग्रहकारी’ वाचा-संबंधी भाव को केवल सामान्य दयालुता तक सीमित नहीं करता।
- source_word: יְהֹוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को हिन्दी में ध्वन्यात्मक रूप से प्रस्तुत किया गया है।
- source_word: צַדִּיק
  choice: धर्मी
  rationale: यह शब्द नैतिक खराई और न्यायशीलता दोनों को समेटता है; ‘धर्मी’ भजन के स्तुतिपरक संदर्भ में स्वाभाविक और पारंपरिक है।
- source_word: אֱלֹהֵינוּ
  choice: हमारा परमेश्वर
  rationale: प्रथम पुरुष बहुवचन प्रत्यय को स्पष्ट रखते हुए सामुदायिक और वाचा-संबंधी स्वीकारोक्ति सुरक्षित की गई है।
- source_word: מְרַחֵם
  choice: करुणामय है
  rationale: רחם का पिएल कृदंत निरंतर करुणा करने वाले स्वभाव या आचरण को व्यक्त करता है; हिन्दी में ‘करुणामय है’ इस विधेयात्मक प्रवाह को स्वाभाविक रूप से रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा / प्रभु
  rationale: मूल पाठ में व्यक्तिगत वाचा-नाम सीधे आया है; ‘याहवे’ उसे सामान्य उपाधि में बदले बिना सुरक्षित रखता है।
- issue: צַדִּיק में धार्मिकता और न्याय का संबंध
  choice: धर्मी
  alternative: न्यायी
  rationale: ‘धर्मी’ मूल शब्द के व्यापक नैतिक अर्थ को रखता है, जबकि ‘न्यायी’ न्याय-संबंधी पक्ष पर अधिक बल देता; संदर्भ किसी एक पक्ष को सीमित रूप से चुनने के लिए बाध्य नहीं करता।
- issue: מְרַחֵם को गुण या क्रिया के रूप में व्यक्त करना
  choice: करुणामय है
  alternative: करुणा करता है
  rationale: कृदंत स्वभाव और निरंतर आचरण दोनों का संकेत दे सकता है; मुख्य पाठ में स्वाभाविक विधेयात्मक विशेषण रखा गया है, बिना करुणा के सक्रिय भाव को नकारे।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य शैली। इब्रानी की तीन समानांतर विधेयात्मक अभिव्यक्तियों और ‘हमारा’ के सामुदायिक बल को सुरक्षित रखा गया है।
