  edition: WLC
  text: אָֽנָּ֣ה יְהוָה֮ כִּֽי אֲנִ֪י עַ֫בְדֶּ֥/ךָ אֲֽנִי עַ֭בְדְּ/ךָ בֶּן אֲמָתֶ֑/ךָ פִּ֝תַּ֗חְתָּ לְ/מוֹסֵרָֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/116/016.yaml
  text: Please[a], Yahweh, for I am your servant; I am your servant, the son of your maidservant[c][b]. You have loosed my bonds.
translation:
  language: hi
  text: 'हे याहवे, मैं विनती करता हूँ[a], क्योंकि मैं आपका सेवक[b] हूँ;

    मैं आपका सेवक, आपकी दासी का पुत्र[c] हूँ।

    आपने मेरे बंधन खोल दिए हैं[d]।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में आग्रह की एक संक्षिप्त पुकार है; इसका अनुवाद ‘कृपा करके’ या ‘हे याहवे, मैं विनती करता हूँ’ भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या ‘आपका दास’; इब्रानी शब्द बंधुआ सेवा का अर्थ भी दे सकता है, पर यहाँ यह याहवे के प्रति समर्पित संबंध प्रकट करता है।
    reason: lexical_alternative
  - marker: c
    text: शाब्दिक रूप से ‘आपकी स्त्री-सेविका का पुत्र’। यह अभिव्यक्ति सेवा से जुड़े जन्मगत संबंध पर बल दे सकती है।
    reason: lexical_alternative
  - marker: d
    text: 'भावार्थ: ‘आपने मुझे छुड़ा दिया है।’ मूल में बंधनों को खोलने का चित्र है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: אָֽנָּה
  choice: विनती है
  rationale: यह आग्रह और विनय प्रकट करने वाला अव्यय है। यहाँ कोई स्पष्ट निवेदन-वस्तु नहीं दी गई है, इसलिए ‘विनती है’ मूल की संक्षिप्त और कुछ हद तक अपूर्ण पुकार को बनाए रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय देवनागरी में लिप्यंतरित किया गया है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यह भजनकार की विनती के आधार को प्रस्तुत करता है और मूल के कारणसूचक संबंध को स्पष्ट रखता है।
- source_word: עַבְדֶּךָ / עַבְדְּךָ
  choice: आपका सेवक
  rationale: עבד दास या सेवक दोनों अर्थ दे सकता है। परमेश्वर को संबोधित इस भजन में ‘सेवक’ समर्पण और अधीनता को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है, जबकि अधिक प्रबल स्वामित्व-संबंधी अर्थ पादटिप्पणी में सुरक्षित है।
- source_word: בֶּן אֲמָתֶךָ
  choice: आपकी दासी का बेटा
  rationale: यह लिंग और वंश-संबंध दोनों को स्पष्ट रखते हुए मूलतः ‘आपकी स्त्री-सेविका का पुत्र’ का स्वाभाविक हिन्दी रूप है।
- source_word: פִּתַּחְתָּ לְמוֹסֵרָי
  choice: आपने मेरे बंधन खोल दिए हैं
  rationale: क्रिया का मूल अर्थ ‘खोलना’ है और ‘बंधन’ के साथ इसका भाव छुड़ाने का है। यह अनुवाद मुक्ति के भाव के साथ मूल रूपक भी बनाए रखता है।
theological_decisions:
- issue: परमेश्वर के सामने भजनकार की स्थिति
  choice: सेवक
  alternative: दास
  rationale: पद नम्र अधीनता, समर्पित संबंध और ‘आपकी दासी का बेटा’ कहकर सेवा की जन्मगत निरंतरता पर बल देता है। ‘सेवक’ वर्तमान हिन्दी में इस आशय को सहजता से संप्रेषित करता है; ‘दास’ का अधिक प्रबल स्वामित्व-सूचक अर्थ पादटिप्पणी में दिया गया है।
- issue: יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल में व्यक्तिगत ईश्वरीय नाम स्पष्ट रूप से उपस्थित है। ‘याहवे’ उसे उपाधि से प्रतिस्थापित किए बिना दर्शाता है।
- issue: दूसरे पुरुष का संबोधन
  choice: आप/आपका
  alternative: तू/तेरा
  rationale: इब्रानी में व्याकरणिक रूप से एकवचन संबोधन है, पर हिन्दी में ‘आप’ एक व्यक्ति को आदरपूर्वक संबोधित कर सकता है। यह आधुनिक, गरिमापूर्ण और सहज है तथा बहुवचन देवत्व का कोई दावा नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में आदरपूर्ण ‘आप’ का प्रयोग किया गया है। भाषा सरल किंतु भजन के योग्य गरिमापूर्ण रखी गई है। पंक्ति-विभाजन इब्रानी काव्य की समानांतर रचना—‘मैं आपका सेवक’ की पुनरावृत्ति—को दिखाई देता रहने देता है।
