  text: Precious in the eyes of Yahweh is the death of his faithful ones[a][b].
translation:
  language: hi
  text: याहवे की दृष्टि में उसके निष्ठावान जनों की मृत्यु अनमोल[a] है।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “याहवे की दृष्टि में उसके निष्ठावान जनों की मृत्यु बहुमूल्य है।”
    reason: lexical_alternative
  - marker: b
    text: “निष्ठावान जन” का अनुवाद “भक्त जन” या “पवित्र जन” भी हो सकता है; इब्रानी शब्द परमेश्वर के प्रति निष्ठावान लोगों को दर्शाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: יָקָר
  choice: अनमोल
  rationale: यह शब्द किसी वस्तु के बहुमूल्य, मूल्यवान या महँगे होने का भाव रखता है। ‘अनमोल’ यहाँ परमेश्वर की दृष्टि में गहरे मूल्य और महत्त्व को व्यक्त करता है, बिना यह संकेत दिए कि वह मृत्यु से प्रसन्न होता है।
- source_word: בְּעֵינֵי
  choice: की दृष्टि में
  rationale: इब्रानी मुहावरे ‘आँखों में’ का स्वाभाविक आधुनिक हिन्दी रूप ‘की दृष्टि में’ है; यह किसी के मूल्यांकन या परिप्रेक्ष्य को व्यक्त करता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत नाम चतुरक्षरीय יהוה को किसी उपाधि से बदलने के बजाय हिन्दी लिप्यंतरण ‘याहवे’ से व्यक्त किया गया है।
- source_word: הַמָּוְתָה
  choice: मृत्यु
  rationale: संज्ञा का सीधा और स्वाभाविक हिन्दी रूप ‘मृत्यु’ है; हिन्दी वाक्य में निश्चितता के लिए अलग उपपद आवश्यक नहीं है।
- source_word: לַחֲסִידָיו
  choice: उसके विश्वासयोग्य जनों की
  rationale: חָסִיד उन लोगों को दर्शाता है जिनमें परमेश्वर के प्रति निष्ठा, भक्ति और वाचा-संबंधी विश्वासयोग्यता है। ‘विश्वासयोग्य जन’ यह अर्थ सामान्य आधुनिक हिन्दी में देता है और ‘सन्त’ के संभावित बाद के धार्मिक अर्थों से बचता है।
theological_decisions:
- issue: विश्वासयोग्य जनों की मृत्यु के विषय में पद का आशय
  choice: उनकी मृत्यु याहवे की दृष्टि में अनमोल, अर्थात गहरे मूल्य और महत्त्व की है।
  alternative: उनकी मृत्यु याहवे के लिए बहुत महँगी या भारी पड़ती है।
  rationale: יָקָר में ‘अनमोल’ और ‘महँगा’ दोनों भाव संभव हैं। मुख्य पाठ पारंपरिक और सीधा ‘अनमोल’ रखता है, जबकि पादटिप्पणी लागत या भारी क्षति के वास्तविक वैकल्पिक अर्थ को सुरक्षित रखती है। इससे यह नहीं कहा जाता कि परमेश्वर मृत्यु में आनन्दित होता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और सामान्य पाठक के लिए सहज शैली रखी गई है। ‘की दृष्टि में’ हिन्दी में स्वाभाविक मुहावरा है। ‘विश्वासयोग्य जन’ वाचा-निष्ठा का भाव व्यक्त करता है, और पादटिप्पणियाँ יָקָר तथा חָסִיד की अर्थ-व्याप्ति सुरक्षित रखती हैं।
