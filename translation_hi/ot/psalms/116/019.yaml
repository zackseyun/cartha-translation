  text: in the courts of the house of Yahweh[a], in your midst, Jerusalem[b]. Praise Yah!
translation:
  language: hi
  text: 'याहवे के भवन[a] के आँगनों में,


    हे यरूशलेम, तेरे बीच में।


    याह की स्तुति करो![b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘याहवे के मंदिर के आँगनों में।’
    reason: lexical_alternative
  - marker: b
    text: इब्रानी ‘याह की स्तुति करो’ उस अभिव्यक्ति का अर्थ है जिससे ‘हालेलूयाह’ बना है।
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּחַצְרוֹת
  choice: आँगनों में
  rationale: बहुवचन חָצֵר यहाँ याहवे के भवन से जुड़े घिरे हुए प्रांगणों को दर्शाता है। ‘आँगनों’ सहज आधुनिक हिन्दी है और मंदिर-परिसर का भाव स्पष्ट रखता है।
- source_word: בֵּית יְהוָה
  choice: याहवे के भवन
  rationale: यह इब्रानी पद का निकट और स्वाभाविक रूप है। प्रसंग में ‘भवन’ मंदिर को सूचित करता है, पर मुख्य पाठ में ‘मंदिर’ कहकर अर्थ को आवश्यकता से अधिक स्पष्ट नहीं किया गया।
- source_word: יְהוָה
  choice: याहवे
  rationale: चार अक्षरों वाले व्यक्तिगत ईश्वरीय नाम को उपाधि से बदलने के बजाय हिन्दी लिपि में लिप्यंतरित किया गया है।
- source_word: בְּתוֹכֵכִי
  choice: तेरे बीच में
  rationale: यह रूप स्त्रीलिंग एकवचन संबोधन है और यरूशलेम को सीधे संबोधित करता है। ‘तेरे बीच में’ उस मानवीकरण और व्याकरणिक संबंध को बनाए रखता है।
- source_word: יְרוּשָׁלִָם
  choice: यरूशलेम
  rationale: स्थान-नाम का हिन्दी में प्रचलित रूप अपनाया गया है।
- source_word: הַלְלוּ יָהּ
  choice: याह की स्तुति करो!
  rationale: बहुवचन आज्ञार्थक क्रिया और ईश्वरीय नाम के संक्षिप्त रूप יָהּ, दोनों को स्पष्ट रूप से व्यक्त करता है; यही पद ‘हालेलूयाह’ के पीछे है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: प्रभु / यहोवा
  rationale: मूल पाठ में व्यक्तिगत ईश्वरीय नाम है। उसे केवल ‘प्रभु’ जैसी उपाधि से बदलने के बजाय लिप्यंतरित करने से मूल का भेद सुरक्षित रहता है।
- issue: समापन में יָהּ का रूप
  choice: याह
  alternative: प्रभु / हालेलूयाह
  rationale: יָהּ, יְהוָה का संक्षिप्त नामरूप है। ‘याह की स्तुति करो’ मूल पदों को स्पष्ट रखता है और पारंपरिक उद्गार ‘हालेलूयाह’ का अर्थ भी दिखाता है।
- issue: यरूशलेम का प्रत्यक्ष संबोधन
  choice: हे यरूशलेम, तेरे बीच में
  alternative: यरूशलेम के बीच में
  rationale: בְּתוֹכֵכִי में स्त्रीलिंग एकवचन प्रत्यय है, इसलिए नगर को मानवीकृत करके सीधे संबोधित करने की काव्यात्मक विशेषता सुरक्षित रखी गई है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। काव्य-पंक्तियों में मूल की स्थान-सूचक समानांतरता तथा यरूशलेम के प्रत्यक्ष संबोधन को बनाए रखा गया है।
