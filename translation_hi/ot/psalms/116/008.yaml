source:
  edition: WLC
  text: כִּ֤י חִלַּ֥צְתָּ נַפְשִׁ֗/י מִ֫/מָּ֥וֶת אֶת עֵינִ֥/י מִן דִּמְעָ֑ה אֶת רַגְלִ֥/י מִ/דֶּֽחִי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/116/008.yaml
  text: For you have delivered my soul from death[a], my eyes from tears[b], my feet from stumbling.
translation:
  language: hi
  text: 'क्योंकि तूने मेरे प्राण को मृत्यु से[a],

    मेरी आँखों को आँसुओं से,

    और मेरे पाँव को लड़खड़ाने से[b] बचाया है।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मेरे जीवन को मृत्यु से।” इब्रानी נֶפֶשׁ का अर्थ प्राण, जीवन या स्वयं व्यक्ति हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या, “मेरे पाँव को ठोकर खाने से” अथवा “गिरने से।” इब्रानी शब्द लड़खड़ाने, ठोकर, या गिरावट का भाव दे सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह आसपास के स्तुति-वचन का कारण बताता है; ‘क्योंकि’ इसके व्याख्यात्मक संबंध को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: חִלַּצְתָּ
  choice: बचाया है
  rationale: पिएल रूप संकट से छुड़ाने या बचाने का भाव देता है। यह क्रिया पद की तीनों समानांतर बातों पर लागू होती है।
- source_word: נַפְשִׁי
  choice: मेरे प्राण
  rationale: נֶפֶשׁ व्यक्ति, जीवन या प्राण का बोध करा सकता है। ‘मृत्यु से’ के साथ ‘प्राण’ स्वाभाविक है और मूल शब्द की व्यापकता को केवल देहधारी जीवन तक सीमित नहीं करता।
- source_word: מִמָּוֶת
  choice: मृत्यु से
  rationale: पूर्वसर्ग और संज्ञा का सीधा अर्थ मृत्यु से छुटकारा है; यह काव्यात्मक और स्पष्ट है।
- source_word: אֶת עֵינַי מִן דִּמְעָה
  choice: मेरी आँखों को आँसुओं से
  rationale: संक्षिप्त मूल अभिव्यक्ति और त्रिपदीय समानांतरता सुरक्षित रखी गई है; हिन्दी में ‘आँसू’ का बहुवचन स्वाभाविक है।
- source_word: אֶת רַגְלִי מִדֶּחִי
  choice: मेरे पाँव को ठोकर खाकर गिरने से
  rationale: דֶּחִי लड़खड़ाने, धकेले जाने या गिरने की स्थिति का संकेत कर सकता है। ‘ठोकर खाकर गिरने’ से इसकी गति और परिणाम दोनों स्वाभाविक हिन्दी में व्यक्त होते हैं; ‘पाँव’ का एकवचन मूल के अनुरूप रखा गया है।
theological_decisions:
- issue: נַפְשִׁי का मानव-स्वरूप संबंधी अर्थ
  choice: मेरे प्राण
  alternative: मेरे जीवन को; मुझे
  rationale: काव्य में यह शब्द जीवन और स्वयं व्यक्ति—दोनों का संकेत दे सकता है। ‘प्राण’ इस व्यापकता तथा धार्मिक-काव्यात्मक गूँज को बनाए रखता है, जबकि पादटिप्पणी ‘जीवन’ की प्रासंगिक संभावना स्पष्ट करती है।
- issue: דֶּחִי में लड़खड़ाने और गिरने का संबंध
  choice: ठोकर खाकर गिरने से
  alternative: ठोकर खाने से; गिरने से
  rationale: मूल संज्ञा गिराए जाने, लड़खड़ाने या गिरावट का भाव रख सकती है। संयुक्त हिन्दी अभिव्यक्ति किसी एक सूक्ष्म अर्थ को अनावश्यक रूप से निर्णायक बनाए बिना प्रसंग का आशय देती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में भक्तिपूर्ण, काव्यात्मक और सहज शैली अपनाई गई है। ईश्वर को संबोधन में ‘तूने’ भजन की निकटता और मूल के एकवचन संबोधन को बनाए रखता है। मूल की तीन समानांतर बचाव-अभिव्यक्तियों को पंक्ति-विन्यास और अंत में एक साझा क्रिया द्वारा सुरक्षित रखा गया है।
