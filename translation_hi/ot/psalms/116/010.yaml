  text: 'I believed[b][a], therefore I spoke: “I am greatly afflicted.”'
translation:
  language: hi
  text: मैंने विश्वास किया[b], इसलिए[a] मैंने कहा, “मैं बहुत पीड़ित हूँ।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “क्योंकि मैं कहता हूँ”; हिब्रू शब्द כִּי को एक से अधिक प्रकार से समझा जा सकता है।
    reason: lexical_alternative
  - marker: b
    text: या “जब मैंने कहा, ‘मैं बहुत पीड़ित था,’ तब भी मैंने विश्वास किया।” हिब्रू वाक्य-विन्यास संक्षिप्त है और उसका संबंध दूसरे ढंग से भी समझा जा सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: הֶאֱמַנְתִּי
  choice: मैंने विश्वास किया
  rationale: हिफ़ील रूप यहाँ विश्वास या भरोसा करने का भाव व्यक्त करता है। ‘विश्वास किया’ सीधा, स्वाभाविक और परंपरागत उद्धरण से संगत है।
- source_word: כִּי
  choice: इसलिए
  rationale: כִּי के अनेक अर्थ हो सकते हैं। यहाँ इसे विश्वास और कथन के बीच परिणामसूचक संबंध के रूप में समझना सहज है; ‘क्योंकि’ भी संभव है और उसे पाद-टिप्पणी में रखा गया है।
- source_word: אֲדַבֵּר
  choice: मैंने कहा
  rationale: रूप अपूर्ण है, पर काव्यात्मक संदर्भ और पहले आए पूर्ण रूप के साथ इसे भूतकालीन कथन के रूप में समझा जा सकता है। हिंदी में उद्धरण प्रस्तुत करने के लिए ‘कहा’ स्वाभाविक है।
- source_word: אֲנִי
  choice: मैं
  rationale: स्वतंत्र सर्वनाम बल देता है; उद्धृत पूर्ण वाक्य ‘मैं बहुत पीड़ित हूँ’ में इसे स्पष्ट रखा गया है।
- source_word: עָנִיתִי
  choice: मैं पीड़ित हूँ
  rationale: यहाँ क्रिया दुःख सहने या दबाए जाने का भाव देती है। यद्यपि हिब्रू रूप पूर्ण है, प्रत्यक्ष कथन की विषयवस्तु के रूप में हिंदी वर्तमानकाल स्वाभाविक है; भूतकालीन अर्थ की संभावना पाद-टिप्पणी में सुरक्षित है।
- source_word: מְאֹד
  choice: बहुत
  rationale: यह तीव्रता बताने वाला क्रियाविशेषण है। ‘बहुत’ आधुनिक मानक हिंदी में सहज और स्पष्ट है।
theological_decisions:
- issue: विश्वास और कथन का वाक्यगत संबंध
  choice: विश्वास को कथन की ओर ले जाने वाला माना गया है, और अंतिम उपवाक्य को कहे गए शब्दों के रूप में प्रस्तुत किया गया है।
  alternative: इसे ‘मैंने विश्वास किया, क्योंकि मैं कहता हूँ…’ या ‘जब मैंने कहा… तब भी मैंने विश्वास किया’ के अर्थ में समझना संभव है।
  rationale: हिब्रू वाक्य-विन्यास संक्षिप्त और बहुअर्थी है। मुख्य पाठ एक सहज अर्थ देता है, जबकि वास्तविक वैकल्पिक व्याख्याएँ पाद-टिप्पणियों में सुरक्षित रखी गई हैं।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘पीड़ित’ दुःख और क्लेश का भाव बनाए रखता है; दोनों पाद-टिप्पणी चिह्न मुख्य पाठ में उपस्थित हैं।
