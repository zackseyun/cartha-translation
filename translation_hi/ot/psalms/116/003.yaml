id: PSA.116.3
reference: Psalms 116:3
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: אֲפָפ֤וּ/נִי חֶבְלֵי מָ֗וֶת וּ/מְצָרֵ֣י שְׁא֣וֹל מְצָא֑וּ/נִי צָרָ֖ה וְ/יָג֣וֹן אֶמְצָֽא׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/116/003.yaml
  text: The cords of death encircled me[a], and the distresses of Sheol found me; I found trouble and sorrow.
translation:
  language: hi
  text: मृत्यु की रस्सियों ने मुझे घेर लिया; शीओल[a] की यातनाओं ने मुझे पा लिया; मैंने संकट और शोक पाया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या “कब्र” अथवा “मृतकों का लोक।” हिब्रू: “शीओल।”'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲפָפוּנִי
  choice: मुझे घेर लिया
  rationale: क्रिया चारों ओर से घिर जाने का भाव देती है। यह चयन ठोस बिंब को स्वाभाविक आधुनिक हिन्दी में बनाए रखता है।
- source_word: חֶבְלֵי מָוֶת
  choice: मृत्यु की रस्सियाँ
  rationale: חבל का मूल अर्थ रस्सी या डोरी है। ‘रस्सियाँ’ मृत्यु की बाँध लेने वाली शक्ति का काव्यात्मक रूपक सुरक्षित रखता है।
- source_word: וּמְצָרֵי שְׁאוֹל
  choice: शीओल की घुटन
  rationale: מֵצַר में संकरेपन, दबाव और संकट का भाव है। ‘घुटन’ उस दबावपूर्ण अनुभव को संक्षिप्त और स्वाभाविक हिन्दी में व्यक्त करती है, यद्यपि हिब्रू का रूप बहुवचन है।
- source_word: שְׁאוֹל
  choice: शीओल
  rationale: लिप्यंतरण हिब्रू धारणा को केवल ‘कब्र’ तक सीमित नहीं करता; पादटिप्पणी सामान्य पाठक के लिए संभावित अर्थ स्पष्ट करती है।
- source_word: מְצָאוּנִי
  choice: मुझे आ पकड़ा
  rationale: शाब्दिक अर्थ ‘मुझे पाया’ है, पर निर्जीव ‘घुटन’ के साथ ‘मुझे आ पकड़ा’ आधुनिक हिन्दी में अधिक स्वाभाविक है और संकट के व्यक्ति तक पहुँच जाने का भाव रखता है।
- source_word: צָרָה
  choice: संकट
  rationale: यह शब्द मुसीबत, विपत्ति या संकट का अर्थ देता है। ‘संकट’ संक्षिप्त, वर्तमान और काव्यात्मक सन्दर्भ के अनुकूल है।
- source_word: וְיָגוֹן
  choice: और शोक
  rationale: יָגוֹן दुःख या शोक को सूचित करता है। ‘शोक’ पद्य के गम्भीर भाव और ‘संकट’ के साथ संतुलित युग्म को बनाए रखता है।
- source_word: אֶמְצָא
  choice: मैंने … पाया
  rationale: यह उसी מצא धातु की पुनरावृत्ति है जो पहले ‘मुझे पाया’ के अर्थ में आई है। अंतिम खण्ड में ‘पाया’ रखने से मूल की शब्दावली और संक्षिप्त काव्यात्मक शैली आंशिक रूप से सुरक्षित रहती है।
theological_decisions:
- issue: שְׁאוֹל का अनुवाद
  choice: शीओल
  alternative: कब्र; मृतकों का लोक
  rationale: हिब्रू शब्द कब्र से व्यापक मृतकों के लोक की धारणा भी व्यक्त कर सकता है। लिप्यंतरण अर्थ को किसी एक धर्मवैज्ञानिक व्याख्या तक सीमित नहीं करता, जबकि पादटिप्पणी पाठक को अर्थ-संभावनाएँ देती है।
translation_notes:
  register: भाषा आधुनिक, गम्भीर और काव्यात्मक रखी गई है। ‘रस्सियाँ’ मूल रूपक को स्पष्ट रखता है; ‘घुटन’ מְצָרֵי के संकरेपन और दबाव को सहज हिन्दी में व्यक्त करती है। अंतिम ‘पाया’ मूल की מצא-धातु की पुनरावृत्ति का कुछ अंश सुरक्षित रखता है।
