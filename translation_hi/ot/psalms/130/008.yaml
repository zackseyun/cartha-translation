  text: וְ֭/הוּא יִפְדֶּ֣ה אֶת יִשְׂרָאֵ֑ל מִ֝/כֹּ֗ל עֲוֺנֹתָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/130/008.yaml
  text: And he will redeem Israel from all his iniquities[a].
translation:
  language: hi
  text: और वह इस्राएल को उसके सारे अधर्मों से छुड़ाएगा।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक स्पष्ट रूप में: “इस्राएलियों के सारे अधर्मों से।” इब्रानी में “इस्राएल” को एक सामूहिक इकाई मानकर एकवचन “उसके” का प्रयोग हुआ है।'
    reason: सामूहिक एकवचन प्रत्यय और उसके मुहावरेदार बहुवचन अर्थ को स्पष्ट करना।
lexical_decisions:
- source_word: וְהוּא
  choice: और वह
  rationale: संयोजक और स्वतंत्र सर्वनाम को स्वाभाविक हिन्दी में रखा गया है। ‘वही’ कहने से मूल के हल्के बल पर अनावश्यक अधिक जोर पड़ सकता था।
- source_word: יִפְדֶּה
  choice: छुड़ाएगा
  rationale: פדה बन्धन, दायित्व या संकट से छुड़ाने अथवा मूल्य देकर मुक्त करने का भाव रखता है। इस प्रसंग में ‘छुड़ाएगा’ सरल, स्वाभाविक और आशा से भरा हुआ समतुल्य है।
- source_word: אֶת
  choice: '[प्रत्यक्ष कर्म-चिह्न; अलग से अनूदित नहीं]'
  rationale: यह ‘इस्राएल’ को निश्चित प्रत्यक्ष कर्म के रूप में चिह्नित करता है; हिन्दी में ‘को’ इसी व्याकरणिक सम्बन्ध को व्यक्त करता है।
- source_word: יִשְׂרָאֵל
  choice: इस्राएल
  rationale: वाचा-समुदाय के सामूहिक नाम को मानक हिन्दी वर्तनी में रखा गया है।
- source_word: מִכֹּל
  choice: सारे … से
  rationale: מן और כֹּל का मेल सम्पूर्णता का भाव देता है। हिन्दी में ‘सारे … से’ इस व्यापकता को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: עֲוֺנֹתָיו
  choice: उसके सारे अधर्मों
  rationale: עָוֹן में पाप के साथ अपराध, दोष और टेढ़ेपन का भाव भी हो सकता है; ‘अधर्म’ इस व्यापक नैतिक अर्थ को बनाए रखता है। प्रत्यय तीसरे पुरुष एकवचन पुल्लिंग है और सामूहिक एकवचन ‘इस्राएल’ की ओर संकेत करता है।
theological_decisions:
- issue: ‘इस्राएल’ के साथ सामूहिक एकवचन प्रत्यय
  choice: ‘उसके सारे अधर्मों’ कहकर इब्रानी के एकवचन रूप को बनाए रखा गया है।
  alternative: ‘उनके सारे अधर्मों’ अथवा ‘इस्राएलियों के सारे अधर्मों’ कहकर समुदाय की बहुलता स्पष्ट की जा सकती है।
  rationale: मूल पाठ ‘इस्राएल’ को एक सामूहिक इकाई मानते हुए एकवचन प्रत्यय लगाता है। मुख्य पाठ में इसे सुरक्षित रखना सामुदायिक और व्यक्तिगत चित्रण के बीच मूल तनाव को बनाए रखता है; अधिक मुहावरेदार बहुवचन अर्थ पादटिप्पणी में स्पष्ट किया गया है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी। ‘छुड़ाएगा’ सामान्य पाठक के लिए स्पष्ट है, जबकि ‘अधर्मों’ मूल शब्द के पाप, दोष और नैतिक विकृति के व्यापक भाव को बनाए रखता है।
