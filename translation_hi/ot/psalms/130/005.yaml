  text: I wait for Yahweh[a]; my soul waits[b], and in his word I hope.
translation:
  language: hi
  text: मैं यहोवा की बाट जोहता हूँ[a]; मेरा प्राण बाट जोहता है, और उसके वचन में मैं आशा रखता हूँ[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मैंने यहोवा की बाट जोही है; मेरे प्राण ने बाट जोही है।” इब्रानी के पूर्ण क्रियारूप इस संदर्भ में दृढ़ निश्चय अथवा वर्तमान मनोदशा को भी व्यक्त कर सकते हैं।
    reason: lexical_alternative
  - marker: b
    text: या, “मैं उसके वचन की प्रतीक्षा करता हूँ,” अथवा “मैं उसकी प्रतिज्ञा की आशा रखता हूँ।” इब्रानी शब्द सामान्य रूप से परमेश्वर के कहे हुए वचन को, और संदर्भतः उसकी प्रतिज्ञा को भी सूचित कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: קִוִּיתִי
  choice: मैं ... बाट जोहता हूँ
  rationale: קוה यहाँ आशाभरी प्रतीक्षा व्यक्त करता है। वर्तमानकालीन हिंदी भजन के संदर्भ में वक्ता की जारी मनोदशा को स्वाभाविक रूप से प्रकट करती है, जबकि इब्रानी पूर्ण रूप के कारण ‘मैंने बाट जोही है’ भी संभव है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: इब्रानी चतुरक्षरीय परमेश्वर-नाम को किसी उपाधि से बदलने के बजाय हिंदी में प्रचलित नामरूप ‘यहोवा’ से व्यक्त किया गया है।
- source_word: קִוְּתָה
  choice: बाट जोहता है
  rationale: पहले खंड के קוה की पुनरावृत्ति और काव्यात्मक समानांतरता बनाए रखी गई है।
- source_word: נַפְשִׁי
  choice: मेरा प्राण
  rationale: נפש यहाँ व्यक्ति के भीतरी अस्तित्व अथवा स्वयं को दर्शाता है। ‘मेरा प्राण’ भजन की काव्यात्मक गरिमा रखते हुए आधुनिक हिंदी में बोधगम्य है।
- source_word: לִדְבָרוֹ
  choice: उसके वचन पर
  rationale: דבר का मूल अर्थ ‘वचन/कही हुई बात’ है और ל यहाँ आशा के आधार या लक्ष्य को सूचित कर सकता है। ‘प्रतिज्ञा’ संभावित निहितार्थ है, पर मुख्य पाठ में उससे अर्थ को सीमित नहीं किया गया।
- source_word: הוֹחָלְתִּי
  choice: मैं आशा रखता हूँ
  rationale: יחל आशापूर्ण प्रतीक्षा को व्यक्त करता है। ‘आशा रखता हूँ’ इसे पहले प्रयुक्त קוה से शैलीगत रूप से अलग रखते हुए अर्थगत निकटता बचाता है।
theological_decisions:
- issue: परमेश्वर के नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ में व्यक्तिगत परमेश्वर-नाम है, इसलिए उसे ‘प्रभु’ जैसी उपाधि से प्रतिस्थापित नहीं किया गया। हिंदी पाठकों के लिए स्थापित और सहज नामरूप ‘यहोवा’ चुना गया; ‘याहवे’ अधिक निकट लिप्यंतरण है।
- issue: דבר को सामान्य वचन या प्रतिज्ञा समझना
  choice: वचन
  alternative: प्रतिज्ञा
  rationale: ‘वचन’ मूल शब्द की व्यापकता बनाए रखता है; संदर्भ में वह प्रतिज्ञा का संकेत दे सकता है, पर मूल शब्द स्वयं अर्थ को केवल प्रतिज्ञा तक सीमित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिंदी में सहज, श्रद्धापूर्ण और काव्यात्मक शैली अपनाई गई है। ‘बाट जोहना’ भजन-साहित्य के अनुकूल गरिमापूर्ण मुहावरा है और सामान्य पाठक के लिए बोधगम्य है।
