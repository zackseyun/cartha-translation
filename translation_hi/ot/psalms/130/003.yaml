  text: אִם עֲוֺנ֥וֹת תִּשְׁמָר יָ֑הּ אֲ֝דֹנָ֗/י מִ֣י יַעֲמֹֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/130/003.yaml
  text: If you[a], Yah, should keep watch over iniquities, Lord, who could stand?
translation:
  language: hi
  text: यदि तू, हे याह, अधर्मों का लेखा रखे[a], तो हे प्रभु, कौन खड़ा रह सकेगा?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘अधर्मों पर दृष्टि रखे’ अथवा ‘पापों का हिसाब रखे।’ इब्रानी क्रिया का शाब्दिक अर्थ ‘रखना, देखना या पहरा देना’ है; यहाँ आशय गलत कामों को हिसाब में रखने से है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: यदि
  rationale: यह शर्तसूचक उपवाक्य आरम्भ करता है; ‘यदि’ स्वाभाविक और मूल वाक्य-विन्यास के अनुरूप है।
- source_word: עֲוֺנוֹת
  choice: अधर्मों
  rationale: बहुवचन रूप दोषपूर्ण और अपराधपूर्ण कामों का नैतिक भार व्यक्त करता है; ‘अधर्मों’ उस भार और बहुवचन दोनों को बनाए रखता है।
- source_word: תִּשְׁמָר
  choice: लेखा रखे
  rationale: שׁמר का मूल अर्थ रखना, देखना या पहरा देना है; यहाँ प्रसंग में अपराधों को हिसाब में रखने का भाव है। मुख्य पाठ में स्वाभाविक हिन्दी दी गई है और शाब्दिक बिंब पादटिप्पणी में सुरक्षित है।
- source_word: יָהּ
  choice: याह
  rationale: यह परमेश्वर के नाम का संक्षिप्त काव्यात्मक रूप है; लिप्यंतरण इसे אֲדֹנָי से अलग रखता है।
- source_word: אֲדֹנָי
  choice: प्रभु
  rationale: यह सीधे संबोधन में प्रयुक्त प्रचलित ईश्वरीय उपाधि है; आधुनिक गरिमापूर्ण हिन्दी में ‘प्रभु’ स्वाभाविक है।
- source_word: מִי יַעֲמֹד
  choice: कौन खड़ा रह सकेगा
  rationale: यह अलंकारिक प्रश्न न्याय के सामने टिक सकने या बने रहने की असमर्थता व्यक्त करता है।
theological_decisions:
- issue: एक ही पद में יָהּ और אֲדֹנָי का अनुवाद
  choice: יָהּ को ‘याह’ और אֲדֹנָי को ‘प्रभु’
  alternative: दोनों को ‘प्रभु’ कहना, अथवा יָהּ को ‘यहोवा’ कहना
  rationale: दो अलग इब्रानी संबोधनों का भेद सुरक्षित रहता है और काव्यात्मक संक्षिप्त दिव्य नाम को पूर्ण नाम में नहीं बदला जाता।
- issue: תִּשְׁמָר में ईश्वरीय जाँच या हिसाब का भाव
  choice: ‘अधर्मों का लेखा रखे’
  alternative: ‘अधर्मों पर दृष्टि रखे’ या ‘अधर्मों को चिह्नित करे’
  rationale: प्रसंग यह पूछता है कि यदि परमेश्वर अपराधों को हिसाब में रखे तो उसके न्याय के सामने कौन टिकेगा; यह न्यायिक भाव स्पष्ट करता है, पर क्षमा के अगले पद को इसमें आयात नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी; एकवचन निकट संबोधन ‘तू’ भजन की सीधी प्रार्थना और इब्रानी द्वितीय पुरुष एकवचन को बनाए रखता है। भाषा गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज रखी गई है।
