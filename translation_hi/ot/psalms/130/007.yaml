id: PSA.130.7
reference: Psalms 130:7
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: יַחֵ֥ל יִשְׂרָאֵ֗ל אֶל יְה֫וָה כִּֽי עִם יְהוָ֥ה הַ/חֶ֑סֶד וְ/הַרְבֵּ֖ה עִמּ֣/וֹ פְדֽוּת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/130/007.yaml
  text: Israel[a], wait for Yahweh, for with Yahweh there is steadfast love, and with him is abundant redemption.
translation:
  language: hi
  text: इस्राएल याहवे की बाट जोहे[a], क्योंकि याहवे के पास अटल प्रेम है, और उसके पास भरपूर छुटकारा है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अथवा, “याहवे पर आशा रखे।” इब्रानी क्रिया में आशा के साथ बाट जोहने का भाव है।
    reason: मूल क्रिया प्रतीक्षा और आशा—दोनों निकटवर्ती अर्थ रखती है; सार्थक वैकल्पिक अनुवाद सुरक्षित रखा गया है।
lexical_decisions:
- source_word: יַחֵל
  choice: बाट जोहे
  rationale: यह इब्रानी क्रिया धैर्यपूर्वक प्रतीक्षा और आशा रखने—दोनों भावों को समेटती है। ‘बाट जोहे’ प्रत्याशापूर्ण प्रतीक्षा को स्वाभाविक और काव्यात्मक हिन्दी में व्यक्त करता है; दूसरा सम्भव अर्थ पादटिप्पणी में दिया गया है।
- source_word: יִשְׂרָאֵל
  choice: इस्राएल
  rationale: वाचा के लोगों का व्यक्तिवाचक नाम; हिन्दी में प्रचलित लिप्यंतरण रखा गया है।
- source_word: אֶל יְהוָה
  choice: याहवे की बाट
  rationale: אֶל का मूल भाव ‘की ओर’ है, पर יחל के साथ हिन्दी मुहावरे ‘किसी की बाट जोहना’ में लक्ष्य स्वाभाविक रूप से सम्बन्धकारक द्वारा व्यक्त होता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: चार अक्षरों वाले परमेश्वर के निजी नाम का लिप्यंतरण किया गया है, किसी उपाधि से उसका स्थान नहीं लिया गया।
- source_word: כִּי
  choice: क्योंकि
  rationale: यह इस्राएल को दिए गए प्रोत्साहन का आधार प्रस्तुत करता है।
- source_word: עִם יְהוָה
  choice: याहवे के पास
  rationale: शाब्दिक ‘याहवे के साथ’ हिन्दी में अस्वाभाविक है; ‘के पास’ मूल के निकट रहते हुए उपलब्धता और अधिकार का भाव व्यक्त करता है।
- source_word: הַחֶסֶד
  choice: अटल प्रेम
  rationale: חֶסֶד में प्रेम, निष्ठा और स्थिर प्रतिबद्धता के संयुक्त भाव हैं; ‘अटल प्रेम’ इन्हें सामान्य आधुनिक हिन्दी में संक्षेप से व्यक्त करता है।
- source_word: וְהַרְבֵּה
  choice: भरपूर
  rationale: यह प्रचुर मात्रा का भाव देता है और ‘छुटकारा’ के साथ स्वाभाविक हिन्दी प्रयोग है।
- source_word: עִמּוֹ
  choice: उसके पास
  rationale: याहवे की ओर संकेत करने वाले सर्वनाम के साथ पहले खंड की समानांतर संरचना बनाए रखी गई है।
- source_word: פְדוּת
  choice: छुटकारा
  rationale: यह छुड़ाने, मुक्त करने या दाम देकर छुड़ाने का अर्थ रखता है; प्रसंग में ‘छुटकारा’ व्यापक और सहज हिन्दी समतुल्य है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा अथवा प्रभु
  rationale: मूल पाठ में निजी वाचा-नाम सीधे आया है; ‘याहवे’ उसका लिप्यंतरण है और उसे किसी उपाधि से नहीं बदलता।
- issue: יחל में प्रतीक्षा और आशा का अर्थ-संबंध
  choice: याहवे की बाट जोहे
  alternative: याहवे पर आशा रखे
  rationale: मुख्य पाठ प्रत्याशापूर्ण प्रतीक्षा को सामने रखता है, जबकि अर्थ में निहित आशा को पादटिप्पणी में सुरक्षित रखा गया है; इस प्रकार मूल की अर्थगत व्यापकता को एक ही अर्थ तक सीमित नहीं किया गया।
- issue: פְדוּת का स्वरूप
  choice: छुटकारा
  alternative: मुक्ति अथवा छुड़ौती
  rationale: पद स्वयं छुटकारे की सटीक रीति को स्पष्ट नहीं करता। ‘छुटकारा’ इस व्यापकता को बनाए रखता है और अगले पद के पापों से छुड़ाने वाले प्रसंग के अनुकूल है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण काव्यात्मक शैली रखी गई है। ‘बाट जोहे’ सामान्य गद्य से कुछ अधिक काव्यात्मक है, पर भजन की शैली और प्रत्याशापूर्ण प्रतीक्षा—दोनों के लिए सहज बोधगम्य है। समानांतर ‘याहवे के पास ... उसके पास ...’ मूल इब्रानी संरचना को स्वाभाविक हिन्दी में बनाए रखता है।
