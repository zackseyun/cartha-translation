  yaml_path: translation/ot/psalms/130/000.yaml
  text: A Song of Ascents[a]. Out of the depths I have called to you[b], Yahweh.
translation:
  language: hi
  text: 'चढ़ाइयों का गीत।[a]


    गहराइयों में से मैंने तुझे पुकारा है, हे याहवे![b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी शीर्षक का अर्थ “चढ़ाइयों का गीत” है। यह उन गीतों के समूह का पारंपरिक शीर्षक है जिन्हें संभवतः यरूशलेम की ओर चढ़ते समय गाया जाता था; इसका अनुवाद “सीढ़ियों का गीत” भी किया जा सकता है।
    reason: cultural_note
  - marker: b
    text: 'इब्रानी: याहवे—परमेश्वर का विशिष्ट नाम; इसे परंपरागत रूप से “यहोवा” और कई अनुवादों में “प्रभु” लिखा जाता है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁיר הַמַּעֲלוֹת
  choice: चढ़ाइयों का गीत
  rationale: यह इब्रानी शीर्षक का निकट और स्वाभाविक रूप है। बहुवचन ‘चढ़ाइयों’ को बनाए रखा गया है; इसका संकेत तीर्थयात्रा, ऊपर जाने के चरणों या सीढ़ियों की ओर हो सकता है।
- source_word: מִמַּעֲמַקִּים
  choice: गहराइयों में से
  rationale: बहुवचन और संकट की रूपकात्मक गहराई—दोनों को सुरक्षित रखता है, बिना यह तय किए कि आशय केवल भौतिक स्थान है या गहरा दुःख।
- source_word: קְרָאתִיךָ
  choice: मैंने तुझे पुकारा है
  rationale: इब्रानी पूर्ण क्रिया को ऐसे वर्तमान-संबद्ध भूत रूप में व्यक्त किया गया है जो की गई पुकार और प्रार्थना की चलती हुई तात्कालिकता दोनों को दर्शाता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: चार अक्षरों वाले विशिष्ट इब्रानी ईश्वरीय नाम को सामान्य पदवी ‘प्रभु’ से बदलने के बजाय लिप्यंतरित किया गया है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का प्रस्तुतीकरण
  choice: याहवे
  alternative: यहोवा / प्रभु
  rationale: मूल पाठ में सामान्य पदवी नहीं, परमेश्वर का विशिष्ट नाम है। ‘याहवे’ उसका व्यापक रूप से मान्य विद्वत्तापूर्ण उच्चारण दर्शाता है; पादटिप्पणी परिचित विकल्प बताती है।
- issue: ‘गहराइयों’ का आशय
  choice: रूपक को अनिर्धारित रखा गया
  alternative: निराशा, पाप या मृत्यु की गहराइयाँ स्पष्ट कर देना
  rationale: मूल पद इन संभावनाओं में से किसी एक को स्पष्ट रूप से निश्चित नहीं करता, इसलिए अनुवाद भी इस अर्थगत विस्तार को बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, सहज और प्रार्थनामय रखी गई है। ‘तुझे’ निकट, सीधा संबोधन व्यक्त करता है और भजन की व्यक्तिगत विनती के अनुरूप है; विस्मयादिबोधक चिह्न पुकार की तीव्रता दर्शाता है।
