  yaml_path: translation/ot/psalms/130/004.yaml
  text: But with you there is forgiveness[a], so that you may be feared.
translation:
  language: hi
  text: परन्तु तेरे पास क्षमा है, ताकि लोग तेरा भय मानें।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “ताकि लोग तेरे प्रति श्रद्धा रखें।” इब्रानी में ‘भय’ शब्द है; परमेश्वर के विषय में यह प्रायः श्रद्धा और विस्मय से भरे भय को दर्शाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: परन्तु
  rationale: यहाँ यह कण पिछले पद में कठोर न्याय से उत्पन्न निराशा के विपरीत स्थिति प्रस्तुत करता है; इसलिए प्रसंगानुसार विरोधसूचक अनुवाद स्वाभाविक है।
- source_word: עִמְּךָ
  choice: तेरे पास
  rationale: शाब्दिक अर्थ ‘तेरे साथ’ है, पर हिन्दी में ‘तेरे पास’ अधिक स्वाभाविक ढंग से व्यक्त करता है कि क्षमा परमेश्वर में उपलब्ध और उसी के अधिकार में है।
- source_word: הַסְּלִיחָה
  choice: क्षमा
  rationale: यह संज्ञा क्षमा अथवा अपराध-मोचन को दर्शाती है; ‘क्षमा’ आधुनिक हिन्दी में स्पष्ट, गरिमापूर्ण और व्यापक रूप से समझी जाती है।
- source_word: לְמַעַן
  choice: ताकि
  rationale: यह उद्देश्य या परिणाम का बोध कराता है; ‘ताकि’ दोनों के बीच की सम्भावित अर्थगत गुंजाइश को सहज हिन्दी में बनाए रखता है।
- source_word: תִּוָּרֵא
  choice: तेरा भय माना जाए
  rationale: יִרְאָה से सम्बद्ध निफ़अल रूप का अर्थ ‘तू भय माना जाए/तेरा भय माना जाए’ है। यह हिन्दी में परमेश्वर के प्रति श्रद्धायुक्त भय की बाइबिलीय अभिव्यक्ति को बनाए रखता है, बिना उसे केवल आतंक या केवल सम्मान में सीमित किए।
theological_decisions:
- issue: परमेश्वर की क्षमा से उत्पन्न प्रतिक्रिया का स्वरूप
  choice: क्षमा का परिणाम अथवा उद्देश्य यह है कि परमेश्वर का भय माना जाए।
  alternative: क्षमा के कारण परमेश्वर के प्रति श्रद्धा रखी जाए।
  rationale: इब्रानी पाठ स्पष्ट रूप से ירא (‘भय मानना’) क्रिया का प्रयोग करता है। मुख्य पाठ उस तनाव को सुरक्षित रखता है, जबकि पादटिप्पणी स्पष्ट करती है कि यहाँ श्रद्धा और विस्मय से भरा भय अभिप्रेत हो सकता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण काव्यात्मक गद्य। परमेश्वर को एकवचन निकट सम्बोधन ‘तेरे’ से संबोधित किया गया है, जो भजन की सीधी प्रार्थनात्मक वाणी के अनुरूप है।
