  text: אֲדֹנָ/י֮ שִׁמְעָ֪/ה בְ/ק֫וֹלִ֥/י תִּהְיֶ֣ינָה אָ֭זְנֶי/ךָ קַשֻּׁב֑וֹת לְ֝/ק֗וֹל תַּחֲנוּנָֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/130/002.yaml
  text: Lord[a], hear my voice; let your ears be attentive to the voice of my pleas for mercy.
translation:
  language: hi
  text: हे प्रभु, मेरी पुकार सुन; मेरी दया-याचनाओं की आवाज़ पर तेरे कान लगे रहें।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֲדֹנָי
  choice: हे प्रभु
  rationale: यह परमेश्वर को सीधे संबोधित करने वाला आदरसूचक पद है; संबोधन की स्पष्टता के लिए ‘हे’ जोड़ा गया है।
- source_word: שִׁמְעָה בְקוֹלִי
  choice: मेरी पुकार सुन
  rationale: शाब्दिक रूप ‘मेरी आवाज़ सुन’ संभव है, पर प्रार्थना के प्रसंग में ‘मेरी पुकार सुन’ स्वाभाविक हिन्दी में उसी विनतीपूर्ण भाव को व्यक्त करता है।
- source_word: תִּהְיֶינָה אָזְנֶיךָ קַשֻּׁבוֹת
  choice: तेरे कान लगे रहें
  rationale: यह सहज आधुनिक हिन्दी मुहावरा ध्यानपूर्वक सुनने का अर्थ देता है और मूल की ठोस शारीरिक बिंब-भाषा ‘तेरे कान’ को बनाए रखता है।
- source_word: לְקוֹל תַּחֲנוּנָי
  choice: मेरे दया के निवेदनों की आवाज़ पर
  rationale: मूल में ‘आवाज़’ की पुनरावृत्ति और विनती में कृपा/दया पाने की earnest भावना दोनों को सुरक्षित रखा गया है।
theological_decisions:
- issue: परमेश्वर के सुनने के लिए मानवरूपी भाषा
  choice: ‘तेरे कान लगे रहें’ के रूप में ठोस बिंब बनाए रखना
  alternative: ‘मेरी बात ध्यान से सुन’
  rationale: मूल पाठ स्पष्टतः ‘कान’ कहता है; इसे बनाए रखने से काव्यात्मक और संबंधपरक बल सुरक्षित रहता है।
- issue: תַּחֲנוּנַי में दया अथवा अनुग्रह की याचना
  choice: ‘दया के निवेदन’
  alternative: ‘विनतियाँ’ अथवा ‘प्रार्थनाएँ’
  rationale: यह पद केवल सामान्य प्रार्थना नहीं, अनुग्रह या दया पाने के लिए की गई गंभीर विनती दर्शाता है; चुना हुआ रूप इस अर्थ को बिना अतिरिक्त सिद्धान्त जोड़े स्पष्ट करता है।
translation_notes:
  register: भाषा आधुनिक, प्रार्थनापूर्ण और गरिमापूर्ण रखी गई है। ‘तेरे’ का प्रयोग भजन की निकट, प्रत्यक्ष ईश्वर-संबोधन शैली के अनुरूप है; वाक्य में मूल की आवाज़/सुनने और कान लगाने की काव्यात्मक समानता सुरक्षित है।
