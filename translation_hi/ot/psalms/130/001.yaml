id: PSA.130.1
reference: Psalms 130:1
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: שִׁ֥יר הַֽ/מַּעֲל֑וֹת מִ/מַּעֲמַקִּ֖ים קְרָאתִ֣י/ךָ יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/130/001.yaml
  text: A Song of Ascents[a]. Out of the depths I cry to you[b], O Yahweh.
translation:
  language: hi
  text: 'चढ़ाइयों का गीत[a]।


    हे याहवे, गहराइयों में से मैंने तुझे पुकारा है[b]।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक रूप से: “चढ़ाइयों का गीत।” यह इस भजन-समूह का पारंपरिक शीर्षक है; इसका सटीक ऐतिहासिक आशय निश्चित नहीं है।'
    reason: cultural_note
  - marker: b
    text: 'या: “मैं तुझे पुकारता हूँ।” हिब्रू क्रिया को बीते/पूर्ण कार्य के रूप में या प्रार्थना की वर्तमान पुकार के रूप में समझा जा सकता है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁיר
  choice: गीत
  rationale: यह संज्ञा सामान्य रूप से ‘गीत’ को दर्शाती है; यहाँ ‘भजन’ कहने से मूल पाठ से अधिक विशिष्ट विधा जुड़ जाती।
- source_word: הַמַּעֲלוֹת
  choice: चढ़ाइयों का
  rationale: यह עלה (‘चढ़ना’) से बना बहुवचन रूप है। ‘चढ़ाइयों’ मूल बिंब और इस भजन-समूह के पारंपरिक शीर्षक को बचाता है, जबकि इसके ठीक ऐतिहासिक संदर्भ—तीर्थयात्रा, मंदिर की सीढ़ियाँ, या कोई और आरोहण—को निर्धारित नहीं करता।
- source_word: מִמַּעֲמַקִּים
  choice: गहराइयों में से
  rationale: बहुवचन ‘गहराइयों/गहरे स्थानों’ का सजीव बिंब सुरक्षित रखा गया है; संदर्भ में यह घोर संकट को सूचित करता है, पर अनुवाद उस रूपक को सीधे ‘विपत्ति’ में नहीं बदलता।
- source_word: קְרָאתִיךָ
  choice: मैंने तुझे पुकारा है
  rationale: קרא का मूल अर्थ ‘पुकारना’ है और प्रत्यय एकवचन संबोधन ‘तुझे’ बताता है। पूर्ण क्रिया-रूप को हिन्दी के पूर्ण पक्ष में रखा गया है; वर्तमानकालीन प्रार्थना के रूप में समझना भी संभव है और उसे पादटिप्पणी में दिया गया है।
- source_word: יְהוָה
  choice: याहवे
  rationale: चार अक्षरों वाले परमेश्वर के व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय हिन्दी लिपि में लिप्यंतरित किया गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में व्यक्तिगत नाम सीधे आया है। ‘याहवे’ संभावित प्राचीन उच्चारण का प्रचलित लिप्यंतरण है और ‘प्रभु’ जैसी प्रतिस्थापन-उपाधि से मूल नाम को नहीं छिपाता।
- issue: कवि की पुकार का काल/पक्ष
  choice: मैंने तुझे पुकारा है
  alternative: मैं तुझे पुकारता हूँ
  rationale: हिब्रू पूर्ण क्रिया-रूप बीती या पूर्ण हुई पुकार को व्यक्त कर सकता है, पर काव्यात्मक प्रार्थना में इसे वर्तमान, प्रत्यक्ष पुकार के रूप में भी समझा जा सकता है। मुख्य पाठ रूप-रचना के निकट है और वैकल्पिक समझ पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और प्रार्थनामय रखी गई है। ‘गहराइयों’ का काव्यात्मक बहुवचन मूल रूपक को बचाता है; ‘तुझे’ एकवचन, निकट और प्रत्यक्ष संबोधन को स्वाभाविक हिन्दी में व्यक्त करता है।
