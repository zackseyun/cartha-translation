  text: मेरा प्राण प्रभु की बाट जोहता है—भोर की बाट जोहते पहरेदारों से भी बढ़कर[a], भोर की बाट जोहते पहरेदारों से भी बढ़कर।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मेरा प्राण प्रभु की ओर है—भोर की बाट जोहते पहरेदारों से भी बढ़कर।” इब्रानी में यहाँ कोई स्पष्ट क्रिया नहीं है; “बाट जोहता है” भजन के संदर्भ से जोड़ा गया है।
