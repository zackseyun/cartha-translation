lexical_decisions:
- source_word: נַפְשִׁי
  choice: मेरा प्राण
  rationale: נֶפֶשׁ पर प्रथम पुरुष एकवचन प्रत्यय का शाब्दिक अर्थ ‘मेरा प्राण’ है। यहाँ यह लालसा और निर्भरता में लगे पूरे व्यक्तित्व को व्यक्त करता है; ‘मैं’ की अपेक्षा ‘मेरा प्राण’ काव्यात्मक बल को बनाए रखता है।
- source_word: לַאדֹנָי
  choice: प्रभु की बाट
  rationale: ל यहाँ निहित प्रतीक्षा या अभिलाषा के लक्ष्य को सूचित करता है। हिंदी मुहावरे ‘प्रभु की बाट जोहना’ में इसका अर्थ स्वाभाविक रूप से व्यक्त होता है। אֲדֹנָי परमेश्वर के लिए आदरसूचक उपाधि है।
- source_word: מִשֹּׁמְרִים
  choice: पहरेदारों से भी बढ़कर
  rationale: तुलनात्मक מִן का अर्थ ‘से बढ़कर’ है, और שֹׁמְרִים रात में पहरा देने वालों को दर्शाता है। ‘पहरेदार’ इस दृश्य को सामान्य आधुनिक हिंदी में स्पष्ट रखता है।
- source_word: לַבֹּקֶר
  choice: भोर की बाट
  rationale: בֹּקֶר का अर्थ ‘सुबह/भोर’ है। रात के पहरेदारों के संदर्भ में ‘भोर’ दिन निकलने की प्रतीक्षा को अधिक सजीव और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: שֹׁמְרִים לַבֹּקֶר
  choice: भोर की बाट जोहते पहरेदारों
  rationale: इब्रानी में यह वाक्यांश दोहराया गया है। अनुवाद भी इस पुनरुक्ति को बनाए रखता है, क्योंकि इसी से तीव्र प्रतीक्षा पर काव्यात्मक बल पड़ता है।
theological_decisions:
- issue: אֲדֹנָי को परमेश्वर की उपाधि के रूप में प्रस्तुत करना
  choice: प्रभु
  alternative: मेरे प्रभु
  rationale: इस भजन में संबोधन परमेश्वर के लिए है। ‘प्रभु’ स्पष्ट, आदरपूर्ण और हिंदी बाइबलीय प्रयोग में स्वाभाविक उपाधि है; इब्रानी रूप का व्याकरणिक इतिहास ‘मेरे प्रभु’ की संभावना समझा सकता है, पर यहाँ वह आवश्यक रूप से व्यक्तिगत स्वामित्व पर बल नहीं देता।
- issue: इब्रानी में स्पष्ट क्रिया का अभाव
  choice: ‘बाट जोहता है’ को संदर्भ से पूरा करना
  alternative: मेरा प्राण प्रभु की ओर है
  rationale: मूल पंक्ति में स्पष्ट क्रिया नहीं है। पिछले पद में प्रतीक्षा की क्रियाएँ और इसी पद में पहरेदारों का रूपक ‘बाट जोहना’ सुझाते हैं, फिर भी शब्दशः अधिक अपूर्ण विकल्प को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और काव्यात्मक हिंदी अपनाई गई है। ‘बाट जोहना’ सामान्य पाठक के लिए समझने योग्य रहते हुए मूल की प्रतीक्षा और लालसा को व्यक्त करता है। इब्रानी की बलदायक पुनरुक्ति ज्यों की त्यों रखी गई है।
