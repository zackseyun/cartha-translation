  yaml_path: translation/ot/psalms/078/001.yaml
  text: A Maskil of Asaph. Give ear[a], my people, to my instruction; incline your ears to the words of my mouth.
translation:
  language: hi
  text: 'आसाफ़ का मस्कील।[a]

    हे मेरे लोगो, मेरी शिक्षा पर ध्यान दो;

    मेरे मुँह के वचनों की ओर अपने कान लगाओ।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “मस्कील” भजनों के शीर्षकों में प्रयुक्त एक तकनीकी शब्द है; इसका आशय शिक्षाप्रद या मननशील रचना हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: מַשְׂכִּיל
  choice: मस्कील
  rationale: यह भजन-शीर्षकों में प्रयुक्त एक तकनीकी शब्द है, जिसका ठीक अर्थ अनिश्चित है। लिप्यंतरण उस अनिश्चितता को सुरक्षित रखता है; संभावित अर्थ पादटिप्पणी में दिए गए हैं।
- source_word: לְאָסָף
  choice: आसाफ़ का
  rationale: शीर्षक में לְ संबंध, रचनाकारिता या समर्पण का संकेत दे सकता है। ‘आसाफ़ का’ स्वाभाविक है और संबंध को आवश्यकता से अधिक निश्चित नहीं करता।
- source_word: הַאֲזִינָה
  choice: ध्यान दो
  rationale: आज्ञार्थक क्रिया ध्यानपूर्वक सुनने का आह्वान करती है। हिंदी में ‘ध्यान दो’ स्वाभाविक रूप से यही भाव व्यक्त करता है।
- source_word: עַמִּי
  choice: हे मेरे लोगो
  rationale: हिब्रू में प्रथम पुरुष संबंधसूचक स्पष्ट है। हिंदी संबोधन में ‘हे’ काव्यात्मक गरिमा और संबोधन की स्पष्टता बनाए रखता है।
- source_word: תּוֹרָתִי
  choice: मेरी शिक्षा
  rationale: תּוֹרָה यहाँ केवल विधिक ‘व्यवस्था’ नहीं, बल्कि शिक्षा या उपदेश को दर्शाती है; भजन के ज्ञानपरक-ऐतिहासिक आरंभ में ‘शिक्षा’ उपयुक्त है।
- source_word: הַטּוּ
  choice: लगाओ
  rationale: कान को झुकाने या मोड़ने का हिब्रू मुहावरा ध्यानपूर्वक सुनने को व्यक्त करता है। ‘कान लगाओ’ हिंदी का स्वाभाविक और चित्रात्मक समतुल्य है।
- source_word: אָזְנְכֶם
  choice: अपने कान
  rationale: हिब्रू में बहुवचन है और सामूहिक श्रोताओं को संबोधित किया गया है; हिंदी में ‘अपने कान’ स्वाभाविक है।
- source_word: לְאִמְרֵי
  choice: वचनों की ओर
  rationale: ‘वचन’ काव्यात्मक और गरिमापूर्ण है तथा बोले गए शब्दों का अर्थ स्पष्ट रखता है।
- source_word: פִי
  choice: मेरे मुँह के
  rationale: ठोस शारीरिक बिंब और ‘कान’ के साथ समानांतरता को बनाए रखने के लिए मूल अभिव्यक्ति सुरक्षित रखी गई है।
