base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/044.yaml
  text: He turned their rivers to blood[a], and their flowing streams[c][b], so that they could not drink.
translation:
  language: hi
  text: 'उसने उनकी नदियों[a] को लहू में बदल दिया,

    और वे उनकी बहती धाराओं का पानी न पी सके।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “नील की जलधाराओं”; मिस्र के प्रसंग में इब्रानी शब्द प्रायः नील नदी या उसकी नहरों के लिए प्रयुक्त होता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּהֲפֹךְ
  choice: उसने ... बदल दिया
  rationale: הפך किसी वस्तु को दूसरी अवस्था में बदल देने का भाव व्यक्त करता है। यह प्रयोग हिन्दी में स्वाभाविक है और परिवर्तन का अर्थ स्पष्ट रखता है।
- source_word: לְדָם
  choice: लहू में
  rationale: לְ परिणामस्वरूप बनी अवस्था को सूचित करता है। ‘लहू में बदल दिया’ सहज और काव्यात्मक हिन्दी है।
- source_word: יְאֹרֵיהֶם
  choice: उनकी नदियों
  rationale: יְאֹר मिस्री प्रसंगों में प्रायः नील या उसकी जलधाराओं और नहरों को दर्शाता है। मुख्य पाठ में ‘नदियों’ सामान्य पाठक के लिए स्पष्ट है, जबकि मिस्री विशिष्टता पादटिप्पणी में सुरक्षित रखी गई है।
- source_word: וְנֹזְלֵיהֶם
  choice: उनकी बहती धाराओं का पानी
  rationale: נזל से बना यह रूप बहते हुए जलस्रोतों को दर्शाता है। ‘बहती धाराओं का पानी’ प्रवाह की छवि बनाए रखता है और हिन्दी में ‘पीने’ का स्वाभाविक कर्म प्रदान करता है।
- source_word: בַּל יִשְׁתָּיוּן
  choice: न पी सके
  rationale: काव्यात्मक निषेध בַּל और अपूर्ण क्रिया यहाँ उस परिणामी असमर्थता को व्यक्त करते हैं कि पानी पीने योग्य नहीं रहा।
theological_decisions:
- issue: दूसरे अर्धपद का पहले अर्धपद से वाक्यगत संबंध
  choice: 'इसे अलग समन्वित उपवाक्य माना गया: वे बहती धाराओं का पानी न पी सके'
  alternative: ‘बहती धाराओं’ को भी ‘लहू में बदल दिया’ का समानांतर कर्म मानना
  rationale: יְאֹרֵיהֶם के बाद अथनाख विभाजन है, और दूसरे अर्धपद में וְנֹזְלֵיהֶם को आगे रखा गया कर्म समझना सहज है। इससे मूल की काव्यात्मक समानता बनी रहती है, बिना चुपचाप दूसरे पद में ‘बदल दिया’ जोड़ने के।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। ‘लहू’ काव्यात्मक-बाइबलीय प्रसंग के अनुरूप है, जबकि वाक्य-विन्यास स्वाभाविक आधुनिक हिन्दी का है।
