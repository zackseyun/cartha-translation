  text: Then he led out his people like sheep, and guided them like a flock in the wilderness.
translation:
  language: hi
  text: तब उसने अपने लोगों को भेड़ों की तरह निकालकर ले चला, और निर्जन प्रदेश में झुंड की तरह उनकी अगुवाई की।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּסַּע
  choice: निकाल ले गया
  rationale: हिफ़ील रूप यहाँ यात्रा आरम्भ कराने या आगे ले चलने का कारक भाव देता है। मिस्र से निर्गमन के संदर्भ में ‘निकाल ले गया’ इस भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: כַּצֹּאן
  choice: भेड़ों के समान
  rationale: צֹאן छोटे पालतू पशुओं, विशेषकर भेड़-बकरियों, के लिए प्रयुक्त होता है; चरवाहे के इस चित्र में ‘भेड़ों’ स्वाभाविक और स्पष्ट है।
- source_word: עַמּוֹ
  choice: अपनी प्रजा
  rationale: עַם का अर्थ सामुदायिक या राष्ट्रीय अर्थ में ‘लोग/प्रजा’ है। राजा-सदृश या प्रभु-संबंधी संदर्भ में ‘अपनी प्रजा’ आधुनिक हिन्दी में स्वाभाविक है और परमेश्वर से उनके संबंध को बनाए रखता है।
- source_word: וַיְנַהֲגֵם
  choice: उनकी अगुवाई की
  rationale: נהג का अर्थ आगे ले जाना, हाँकना या मार्ग दिखाना हो सकता है। यहाँ झुंड के रूपक के साथ ‘अगुवाई की’ दिशा देने वाले चरवाहे का भाव रखता है, बिना अनावश्यक कठोरता जोड़े।
- source_word: כָּעֵדֶר
  choice: झुंड के समान
  rationale: עֵדֶר पशुओं के झुंड को दर्शाता है। पहले चरण की भेड़ों वाली उपमा के साथ ‘झुंड’ सुसंगत और सामान्य हिन्दी है।
- source_word: בַּמִּדְבָּר
  choice: जंगल में
  rationale: מִדְבָּר निर्जन, अनाबाद या चरागाही वनप्रदेश को दर्शा सकता है, केवल रेतीले मरुस्थल को नहीं। निर्गमन-वर्णन में ‘जंगल’ प्रचलित बाइबलीय हिन्दी है और अर्थ को अनावश्यक रूप से सीमित नहीं करता।
theological_decisions:
- issue: निर्गमन के संदर्भ में परमेश्वर का चरवाहे के रूप में चित्रण
  choice: भेड़ों और झुंड की दोनों उपमाएँ सीधे बनाए रखी गईं।
  alternative: रूपक को खोलकर परमेश्वर की सुरक्षा या देखभाल का स्पष्ट उल्लेख करना।
  rationale: इब्रानी पद परमेश्वर को चरवाहे के समान चित्रित करता है, पर सुरक्षा अथवा अन्य बाद की धर्मवैज्ञानिक धारणाएँ स्पष्ट रूप से नहीं जोड़ता। इसलिए रूपक और संबंध को बिना विस्तार के सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य हिन्दी। समानांतर काव्य-रचना को ‘भेड़ों के समान… झुंड के समान’ द्वारा बनाए रखा गया है; ‘निकाल ले गया’ और ‘अगुवाई की’ मूल की दो अलग क्रियाओं का भेद भी दर्शाते हैं।
