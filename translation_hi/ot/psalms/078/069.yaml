  yaml_path: translation/ot/psalms/078/069.yaml
  text: And he built his sanctuary like the heights[b][a], like the earth that he established forever.
translation:
  language: hi
  text: और उसने अपना पवित्रस्थान ऊँचाइयों[a] के समान बनाया, पृथ्वी के समान जिसे उसने सदा तक स्थापित किया[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “ऊँचे स्वर्गों” अथवा “ऊँचे शिखरों।” इब्रानी अभिव्यक्ति काव्यात्मक है और ऊँचे स्वर्गीय या पर्वतीय बिंब जगा सकती है।
    reason: lexical_alternative
  - marker: b
    text: या “जिसकी उसने सदा तक नींव डाली।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּבֶן
  choice: और उसने ... बनाया
  rationale: वय्यिक्तोल रूप कथा के अगले कार्य को आगे बढ़ाता है; यह अनुवाद मूल क्रिया और प्रवाह दोनों को सहज हिन्दी में रखता है।
- source_word: כְּמוֹ רָמִים
  choice: ऊँचाइयों के समान
  rationale: רָמִים ऊँचे अथवा महान स्थानों का काव्यात्मक बहुवचन है। ‘ऊँचाइयों’ से स्वर्गीय या पर्वतीय बिंब की वास्तविक अस्पष्टता बनी रहती है और इसे उपासना के ‘ऊँचे स्थानों’ के अर्थ में सीमित नहीं किया जाता।
- source_word: מִקְדָּשׁוֹ
  choice: अपना पवित्रस्थान
  rationale: מִקְדָּשׁ पवित्र स्थान या पवित्रधाम को दर्शाता है। ‘पवित्रस्थान’ मन्दिर-भवन तक अर्थ को अनावश्यक रूप से सीमित किए बिना परमेश्वर के पवित्र निवास का भाव देता है।
- source_word: כְּאֶרֶץ
  choice: उस पृथ्वी के समान
  rationale: यहाँ तुलना स्थिर और स्थापित पृथ्वी से है; विश्वगत समानांतरता में ‘पृथ्वी’ ‘भूमि’ से अधिक उपयुक्त है। संकेतवाचक ‘उस’ अगले सम्बन्धवाचक उपवाक्य को स्वाभाविक हिन्दी में जोड़ता है।
- source_word: יְסָדָהּ
  choice: जिसे उसने ... स्थापित किया
  rationale: יסד का अर्थ नींव डालना या दृढ़ता से स्थापित करना है। ‘स्थापित किया’ प्राकृतिक हिन्दी में स्थायित्व का भाव व्यक्त करता है; स्त्रीलिंग प्रत्यय का सम्बन्ध पृथ्वी से है।
- source_word: לְעוֹלָם
  choice: सदा के लिए
  rationale: यह पद स्थायी निरन्तरता व्यक्त करता है; ‘सदा के लिए’ आधुनिक हिन्दी में सहज है और काव्यात्मक बल बनाए रखता है।
theological_decisions:
- issue: पवित्रस्थान की तुलना में רָמִים का सन्दर्भ और बिंब
  choice: पवित्रस्थान की तुलना अनिर्दिष्ट महान ऊँचाइयों से और दृढ़ता से स्थापित पृथ्वी से की गई है।
  alternative: इसे विशेष रूप से ‘ऊँचे स्वर्गों’ अथवा ‘पर्वत-शिखरों’ की तुलना माना जा सकता है।
  rationale: इब्रानी अभिव्यक्ति संक्षिप्त और काव्यात्मक है। मुख्य पाठ में ‘ऊँचाइयों’ रखने से स्वर्गीय और पर्वतीय दोनों सम्भावनाएँ खुली रहती हैं तथा पाठ की भव्यता और स्थायित्व का तनाव बिना किसी एक व्याख्या को थोपे सुरक्षित रहता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सामान्य पाठकों के लिए सुबोध काव्यात्मक गद्य। ‘पवित्रस्थान’ व्यापक मूल शब्द को सुरक्षित रखता है और ‘ऊँचाइयों’ मूल बिंब की अस्पष्टता बनाए रखता है।
