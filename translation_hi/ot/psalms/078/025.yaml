  yaml_path: translation/ot/psalms/078/025.yaml
  text: Man ate the bread of the mighty[a]; he sent them provisions to the full.
translation:
  language: hi
  text: मनुष्य ने शक्तिशाली जनों की रोटी खाई[a]; उसने उन्हें तृप्ति तक भोजन भेजा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “स्वर्गदूतों की रोटी।” इब्रानी में यह पदबंध शाब्दिक रूप से “शक्तिशाली जनों की रोटी” है।
    reason: वैकल्पिक पारंपरिक व्याख्या को सुरक्षित रखते हुए इब्रानी शब्द की मूल अर्थ-सीमा स्पष्ट करना।
lexical_decisions:
- source_word: לֶחֶם
  choice: रोटी
  rationale: मूल शब्द का ठोस और सामान्य अर्थ ‘रोटी’ है; इससे काव्यात्मक बिंब बना रहता है।
- source_word: אַבִּירִים
  choice: शक्तिशाली जनों
  rationale: यह बहुवचन शब्द मूलतः बलवान या शक्तिशाली जनों को दर्शाता है। ‘वीरों’ से योद्धाओं का अनावश्यक संकेत मिल सकता है, जबकि ‘शक्तिशाली जनों’ से मूल की व्यापकता और व्याख्यात्मक तनाव सुरक्षित रहता है।
- source_word: אָכַל
  choice: खाई
  rationale: यहाँ पूर्ण क्रिया को कथात्मक-काव्यात्मक संदर्भ में सामान्य भूतकाल से व्यक्त किया गया है।
- source_word: אִישׁ
  choice: मनुष्य
  rationale: एकवचन संज्ञा यहाँ प्रतिनिधिक अर्थ रखती है; ‘मनुष्य’ मूल के एकवचन और सामान्य मानवीय संदर्भ दोनों को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: צֵידָה
  choice: भोजन
  rationale: शब्द का आशय आवश्यकता के लिए दी गई खाद्य-सामग्री या रसद है। इस प्रसंग में ‘भोजन’ सहज है और मन्ना की खाद्य-पूर्ति को स्पष्ट रखता है।
- source_word: שָׁלַח
  choice: भेजा
  rationale: यह क्रिया का सीधा अर्थ है और ‘दिया’ जैसी व्याख्यात्मक ढील से बचता है।
- source_word: לָהֶם
  choice: उन्हें
  rationale: हिन्दी में ‘भेजा’ के साथ अप्रत्यक्ष कर्म का स्वाभाविक रूप है।
- source_word: לָשֹׂבַע
  choice: भरपेट
  rationale: यह तृप्ति और पर्याप्त मात्रा—दोनों का भाव संक्षेप और स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: אַבִּירִים का अर्थ और स्वर्गदूतों से उसका पारंपरिक संबंध
  choice: मुख्य पाठ में ‘शक्तिशाली जनों’
  alternative: ‘स्वर्गदूतों’
  rationale: इब्रानी शब्द अपने आप में स्पष्ट रूप से ‘स्वर्गदूत’ नहीं कहता, बल्कि ‘शक्तिशाली जनों’ का अर्थ देता है। मन्ना और स्वर्गीय भोजन के संदर्भ से प्राचीन पारंपरिक व्याख्या ‘स्वर्गदूतों’ की बनी; उसे पादटिप्पणी में रखते हुए मुख्य पाठ में मूल की अर्थगत खुलावट सुरक्षित रखी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण और संक्षिप्त काव्यात्मक गद्य। ‘शक्तिशाली जनों’ जानबूझकर थोड़ा औपचारिक रखा गया है ताकि ‘वीरों’ के सैन्य अर्थ से बचते हुए मूल की बहुवचन संज्ञा और उसकी अस्पष्टता बनी रहे।
