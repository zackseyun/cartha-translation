id: PSA.78.7
reference: Psalms 78:7
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/יָשִׂ֥ימוּ בֵֽ/אלֹהִ֗ים כִּ֫סְלָ֥/ם וְ/לֹ֣א יִ֭שְׁכְּחוּ מַֽעַלְלֵי אֵ֑ל וּ/מִצְוֺתָ֥י/ו יִנְצֹֽרוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/007.yaml
  text: so that they might set their hope in God and not forget the deeds of God[b][a], but keep his commandments.
translation:
  language: hi
  text: ताकि वे परमेश्वर पर अपनी आशा[a] रखें, परमेश्वर के कामों[b] को न भूलें और उसकी आज्ञाओं का पालन करें।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “अपना भरोसा” अथवा “अपना विश्वास”।
    reason: lexical_alternative
  - marker: b
    text: या “परमेश्वर के कार्य” अथवा “परमेश्वर के किए हुए काम”।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָשִׂימוּ
  choice: ताकि वे ... रखें
  rationale: שׂים का मूल अर्थ ‘रखना/स्थापित करना’ है। पिछले पद से जारी उद्देश्यसूचक प्रवाह को स्वाभाविक हिन्दी में ‘ताकि’ से व्यक्त किया गया है।
- source_word: בֵאלֹהִים
  choice: परमेश्वर पर
  rationale: यहाँ ב उस व्यक्ति को चिह्नित करता है जिस पर आशा या भरोसा रखा जाता है; हिन्दी में ‘परमेश्वर पर’ स्वाभाविक है।
- source_word: כִּסְלָם
  choice: अपनी आशा[a]
  rationale: כֶּסֶל यहाँ आशा, भरोसा या विश्वासपूर्ण निर्भरता का अर्थ दे सकता है। ‘आशा’ प्रसंग के अनुकूल है और वैकल्पिक अर्थ पादटिप्पणी में सुरक्षित हैं।
- source_word: וְלֹא יִשְׁכְּחוּ
  choice: न भूलें
  rationale: שׁכח के निषेधात्मक अपूर्ण रूप का सीधा और स्वाभाविक हिन्दी अनुवाद।
- source_word: מַעַלְלֵי אֵל
  choice: परमेश्वर के कामों[b]
  rationale: מַעֲלָלִים का अर्थ किए हुए काम या कार्य है। ‘कामों’ को साधारण आधुनिक हिन्दी में सहजता के कारण चुना गया; वैकल्पिक ‘कार्यों’ को पादटिप्पणी में रखा गया है।
- source_word: וּמִצְוֺתָיו
  choice: उसकी आज्ञाओं
  rationale: מִצְוֹת के वाचाई और शास्त्रीय भाव को ‘आज्ञाओं’ स्पष्ट रूप से व्यक्त करता है।
- source_word: יִנְצֹרוּ
  choice: पालन करें
  rationale: נצר का शाब्दिक भाव ‘सुरक्षित रखना/चौकसी से रखना’ है; आज्ञाओं के साथ आधुनिक हिन्दी में ‘पालन करना’ अर्थ को स्वाभाविक रूप से व्यक्त करता है।
theological_decisions:
- issue: אֱלֹהִים और אֵל—दो ईश्वरीय संबोधनों का समानांतर प्रयोग
  choice: दोनों के लिए ‘परमेश्वर’
  alternative: אֵל के लिए ‘सामर्थी परमेश्वर’ या ‘ईश्वर’
  rationale: दोनों सामान्य ईश्वरीय पद हैं और यहाँ काव्यात्मक समानांतरता में प्रयुक्त हुए हैं। दोनों को ‘परमेश्वर’ कहना अनावश्यक धर्मवैज्ञानिक भेद जोड़े बिना आशय को बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और काव्यात्मक वाक्य-विन्यास रखा गया है। ‘बल्कि’ अंतिम खंड के विरोधात्मक बल को स्पष्ट करता है। सभी पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित हैं।
