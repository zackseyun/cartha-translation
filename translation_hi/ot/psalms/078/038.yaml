  text: וְ/ה֤וּא רַח֨וּם יְכַפֵּ֥ר עָוֺן֮ וְֽ/לֹא יַ֫שְׁחִ֥ית וְ֭/הִרְבָּה לְ/הָשִׁ֣יב אַפּ֑/וֹ וְ/לֹֽא יָ֝עִיר כָּל חֲמָתֽ/וֹ׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/038.yaml
  text: But he[a], being compassionate, made atonement for iniquity and did not destroy; he often turned back his anger and did not stir up all his wrath.
translation:
  language: hi
  text: फिर भी वह करुणामय था; वह अधर्म का प्रायश्चित[a] करता और विनाश नहीं करता था। वह बार-बार अपना क्रोध लौटा लेता और अपने पूरे प्रकोप को नहीं भड़काता था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘अधर्म क्षमा करता था।’ इब्रानी क्रिया सामान्यतः ‘प्रायश्चित करना’ के अर्थ में प्रयुक्त होती है; इसलिए मुख्य पाठ में उसका धर्मवैचारिक भार सुरक्षित रखा गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: רַחוּם
  choice: करुणामय
  rationale: यह शब्द दया से प्रेरित करुणा को व्यक्त करता है। ‘करुणामय’ आधुनिक, गरिमापूर्ण और चरित्र-सूचक विशेषण है।
- source_word: יְכַפֵּר
  choice: प्रायश्चित करता
  rationale: כפר के पिएल रूप का सामान्य अर्थ प्रायश्चित करना अथवा दोष का निवारण करना है। मुख्य पाठ में ‘प्रायश्चित’ रखने से मूल का धर्मवैचारिक भार बना रहता है।
- source_word: עָוֺן
  choice: अधर्म
  rationale: यहाँ शब्द पापमय कुटिलता अथवा उससे जुड़े दोष को सूचित कर सकता है। ‘अधर्म’ नैतिक अर्थ को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: יַשְׁחִית
  choice: नाश करता
  rationale: हिफ़ील रूप यहाँ दंडस्वरूप विनाश को दर्शाता है; ‘नाश करना’ स्पष्ट और प्रसंगानुकूल है।
- source_word: וְהִרְבָּה לְהָשִׁיב
  choice: बार-बार ... लौटा लेता
  rationale: הִרְבָּה के साथ क्रिया का यह प्रयोग किसी कार्य को बारंबार करने का भाव देता है।
- source_word: אַפּוֹ
  choice: अपना क्रोध
  rationale: אַף का मूल अर्थ ‘नाक’ है, पर यहाँ यह क्रोध के लिए प्रचलित इब्रानी मुहावरा है।
- source_word: יָעִיר
  choice: भड़काता
  rationale: עור के हिफ़ील रूप का अर्थ जगाना या उकसाना है; प्रकोप के साथ ‘भड़काना’ स्वाभाविक हिन्दी है।
- source_word: כָּל חֲמָתוֹ
  choice: अपने पूरे प्रकोप
  rationale: כָּל की समग्रता और חֵמָה की तीव्रता को ‘पूरा प्रकोप’ स्पष्ट रूप से व्यक्त करता है।
theological_decisions:
- issue: ऐतिहासिक भजन के गैर-अनुष्ठानिक प्रसंग में כפר का अनुवाद
  choice: अधर्म के लिए प्रायश्चित करता
  alternative: अधर्म क्षमा करता
  rationale: ‘क्षमा करता’ प्रसंगगत परिणाम को सहज बनाता, पर כפר प्रायश्चित के लिए प्रयुक्त सामान्य इब्रानी क्रिया है। ‘प्रायश्चित करता’ मूल की धर्मवैचारिक गहराई को बनाए रखता है, जबकि पद में न बताई गई किसी विशिष्ट विधि को नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, काव्यात्मक किंतु सामान्य पाठक के लिए सुबोध रखी गई है। ‘उनका’ संदर्भ से स्पष्ट समुदाय को हिन्दी में स्वाभाविक रूप से व्यक्त करता है, यद्यपि इब्रानी में कर्म निहित है। अपूर्ण क्रियाओं के आवर्ती भूतकालीन भाव को ‘करता था/लेता था’ से व्यक्त किया गया है।
