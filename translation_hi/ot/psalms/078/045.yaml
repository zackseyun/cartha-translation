  text: उसने उनके बीच मक्खियों के झुंड[a] भेजे, जिन्होंने उन्हें खा लिया, और मेंढक, जिन्होंने उन्हें नष्ट कर दिया।
  philosophy: optimal-equivalence
  footnotes:
