    reason: lexical_alternative
lexical_decisions:
- source_word: יְשַׁלַּח
  choice: उसने भेजे
  rationale: पिएल रूप यहाँ विपत्ति को मिस्रियों के बीच भेजने को व्यक्त करता है। हिंदी में ‘भेजे’ स्वाभाविक है और प्रसंग में पर्याप्त बल रखता है।
- source_word: בָּהֶם
  choice: उनके बीच
  rationale: בְּ का स्थानवाचक अर्थ विपत्ति के उनके मध्य पहुँचने को सीधे व्यक्त करता है; ‘उनके विरुद्ध’ प्रसंगतः संभव है, पर कम प्रत्यक्ष।
- source_word: עָרֹב
  choice: डाँसों के झुंड
  rationale: निर्गमन की विपत्ति के प्रसंग में यह झुंड बनाकर आने वाले काटने वाले कीटों का संकेत देता है। पारंपरिक समझ को मुख्य पाठ में रखते हुए ‘डाँसों के झुंड’ स्पष्ट और स्वाभाविक है; मूल शब्द की व्यापक अनिश्चितता पादटिप्पणी में सुरक्षित है।
- source_word: וַיֹּאכְלֵם
  choice: जिन्होंने उन्हें खा लिया
  rationale: אָכַל का सजीव, विनाशकारी भाव ‘खा लिया’ से बना रहता है। हिंदी के बहुवचन ‘झुंड’ के अनुरूप संबंधवाचक उपवाक्य स्वाभाविक है।
- source_word: וּצְפַרְדֵּעַ
  choice: और मेंढक
  rationale: इब्रानी में एकवचन संज्ञा सामूहिक अर्थ में है; हिंदी में प्रजाति और विपत्ति के सामूहिक अर्थ के लिए ‘मेंढक’ स्वाभाविक है।
- source_word: וַתַּשְׁחִיתֵם
  choice: जिन्होंने उन्हें नष्ट कर दिया
  rationale: שׁחת गंभीर विनाश या बरबादी व्यक्त करता है; ‘नष्ट कर दिया’ इस बल को बनाए रखता है।
