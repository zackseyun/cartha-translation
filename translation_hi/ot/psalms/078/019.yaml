lexical_decisions:
- source_word: וַיְדַבְּרוּ
  choice: उन्होंने कहा
  rationale: דבר का यह कथात्मक रूप लोगों के बोलने का वर्णन करता है; आधुनिक हिन्दी में ‘कहा’ स्वाभाविक और सीधा है।
- source_word: בֵּאלֹהִים
  choice: परमेश्वर के विरुद्ध
  rationale: דבר के साथ ב यहाँ विरोधात्मक अर्थ दे सकता है। आगे का चुनौतीपूर्ण प्रश्न और भजन में विद्रोह का प्रसंग इस अर्थ का समर्थन करते हैं।
- source_word: אָמְרוּ
  choice: वे बोले
  rationale: प्रत्यक्ष कथन का परिचय देने वाली दूसरी कथन-क्रिया को अलग रखकर इब्रानी की दोहरी वाक्-संरचना सुरक्षित की गई है।
- source_word: הֲיוּכַל
  choice: क्या ... सकता है
  rationale: प्रश्नवाचक ה और יכל सामर्थ्य के विषय में चुनौती व्यक्त करते हैं; हिन्दी में यह संरचना स्पष्ट और स्वाभाविक है।
- source_word: אֵל
  choice: परमेश्वर
  rationale: यहाँ אֵל उसी ईश्वर के लिए प्रयुक्त दैवी पद है जिसका पहले אֱלֹהִים से उल्लेख है; ‘परमेश्वर’ अर्थ को स्पष्ट रखता है और ‘सामर्थी’ जैसी व्याख्या नहीं जोड़ता।
- source_word: לַעֲרֹךְ
  choice: मेज़ लगा
  rationale: ערך के साथ שֻׁלְחָן का अर्थ मेज़ को व्यवस्थित करना अथवा भोजन के लिए तैयार करना है; ‘मेज़ लगाना’ हिन्दी का स्वाभाविक मुहावरा है और मूल बिंब बनाए रखता है।
- source_word: שֻׁלְחָן
  choice: मेज़
  rationale: शब्द का ठोस अर्थ ‘मेज़’ है। प्रसंग में भोजन की व्यवस्था निहित है, पर उसे ‘भोजन’ कहकर मूल बिंब को परोक्ष नहीं किया गया।
- source_word: בַּמִּדְבָּר
  choice: निर्जन प्रदेश में
  rationale: מִדְבָּר इस्राएल के भटकने के सूने, कम बसे भूभाग को दर्शाता है; ‘निर्जन प्रदेश’ अर्थ को केवल रेतीले मरुस्थल तक सीमित नहीं करता।
theological_decisions:
- issue: परमेश्वर के प्रति इस्राएल की वाणी का स्वर
  choice: ‘परमेश्वर के विरुद्ध’—विद्रोही और आरोपपूर्ण स्वर
  alternative: ‘परमेश्वर के विषय में’ अथवा ‘परमेश्वर से’
  rationale: भजन का व्यापक प्रसंग इस्राएल के अविश्वास और परमेश्वर को उकसाने का वर्णन करता है। फिर भी बְּ का अधिक तटस्थ अर्थ व्याकरणतः संभव है, इसलिए उसे पादटिप्पणी में सुरक्षित रखा गया है।
