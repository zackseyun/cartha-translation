  text: וַ/יְכַל בַּ/הֶ֥בֶל יְמֵי/הֶ֑ם וּ֝/שְׁנוֹתָ֗/ם בַּ/בֶּהָלָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/033.yaml
  text: So he consumed their days in futility[a], and their years in terror.
translation:
  language: hi
  text: 'तब उसने उनके दिन व्यर्थता में समाप्त कर दिए[a],

    और उनके वर्ष दहशत में।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अथवा, “तब उसने उनके दिन व्यर्थता में समाप्त कर दिए, और उनके वर्ष अचानक दहशत में।”
    reason: בֶּהָלָה can emphasize sudden terror or alarm; this preserves the lexical alternative documented in the English audit trail.
lexical_decisions:
- source_word: וַיְכַל
  choice: समाप्त कर दिए
  rationale: כלה का यह रूप प्रसंग में परमेश्वर को निहित कर्ता मानते हुए ‘अंत कर देना/समाप्त कर देना’ बताता है। यह हिन्दी में स्वाभाविक है और मूल की सक्रिय दैवी भूमिका बनाए रखता है।
- source_word: בַּהֶבֶל
  choice: व्यर्थता में
  rationale: הֶבֶל का मूल बिंब सांस या भाप से जुड़ा है और यहाँ निष्फलता, खोखलेपन तथा क्षणभंगुरता का भाव देता है। ‘व्यर्थता में’ काव्यात्मक और सुबोध है।
- source_word: יְמֵיהֶם
  choice: उनके दिन
  rationale: मूल का काल-संबंधी बिंब और समानांतर काव्य-रचना बनाए रखने के लिए ‘दिन’ को ज्यों का त्यों रखा गया है।
- source_word: וּשְׁנוֹתָם
  choice: और उनके वर्ष
  rationale: ‘उनके दिन’ के समानांतर मूल पद को सीधे और स्वाभाविक रूप में प्रस्तुत करता है।
- source_word: בַּבֶּהָלָה
  choice: आतंक में
  rationale: בֶּהָלָה अचानक भय, घबराहट या बदहवासी व्यक्त कर सकता है। न्याय के प्रसंग में ‘आतंक’ इसकी तीव्रता को संक्षेप और गरिमापूर्ण ढंग से व्यक्त करता है।
theological_decisions:
- issue: क्रिया का निहित कर्ता
  choice: ‘उसने’—अर्थात प्रसंगानुसार परमेश्वर—को कर्ता रखा गया है।
  alternative: ‘उनके दिन समाप्त हो गए’ जैसा निर्वैयक्तिक अनुवाद।
  rationale: इब्रानी क्रिया एकवचन पुल्लिंग कर्ता की ओर संकेत करती है और निकटवर्ती प्रसंग न्याय की इस कार्रवाई को परमेश्वर से जोड़ता है; इसलिए दैवी सक्रियता को अस्पष्ट नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण काव्य-पंक्तियाँ। ‘व्यर्थता’ और ‘आतंक’ मूल के समानांतर अमूर्त पदों तथा न्याय की गंभीरता को बनाए रखते हैं।
