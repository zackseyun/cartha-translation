  naturalness: “उनके दिन व्यर्थता में समाप्त कर दिए” is understandable and suitably concise. Replacing “इसलिए” with “तब” and “आतंक” with “दहशत” improves idiomatic modern Hindi while retaining the solemn poetic register.
  terminology: “व्यर्थता” is an appropriate rendering of הֶבֶל here. “दिन” and “वर्ष” correctly preserve the Hebrew imagery and parallelism. “दहशत” accurately represents the fear/alarm sense of בֶּהָלָה without importing a modern political sense.
