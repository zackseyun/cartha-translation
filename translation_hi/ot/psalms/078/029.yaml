  text: וַ/יֹּאכְל֣וּ וַ/יִּשְׂבְּע֣וּ מְאֹ֑ד וְ֝/תַֽאֲוָתָ֗/ם יָבִ֥א לָ/הֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/029.yaml
  text: So they ate and were very full[a], and he brought them what they craved.
translation:
  language: hi
  text: तब उन्होंने खाया और पूरी तरह तृप्त हो गए; और जिस चीज़ की उन्हें लालसा थी[a], उसे उसने उनके पास पहुँचा दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उनकी लालसा।” इब्रानी संज्ञा इच्छा या लालसा के भाव को, अथवा उस वस्तु को जिसकी लालसा की गई हो, सूचित कर सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאכְלוּ
  choice: उन्होंने खाया
  rationale: אכל का सामान्य अर्थ ‘खाना’ है; यह सरल और स्वाभाविक हिन्दी अभिव्यक्ति है।
- source_word: וַיִּשְׂבְּעוּ מְאֹד
  choice: पूरी तरह तृप्त हो गए
  rationale: שׂבע पेट भरने और तृप्त होने का भाव देता है, और מְאֹד उसकी तीव्रता बढ़ाता है। यह अनुवाद भरपूर भोजन और पूर्ण तृप्ति—दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: תַאֲוָתָם
  choice: जिस चीज़ की उन्हें लालसा थी
  rationale: תַּאֲוָה इच्छा, तीव्र चाह या लालसा तथा सन्दर्भानुसार इच्छित वस्तु को सूचित कर सकता है। इस प्रसंग में वस्तु को स्पष्ट करते हुए ‘लालसा’ शब्द मूल की तीव्रता बनाए रखता है।
- source_word: יָבִא לָהֶם
  choice: उसे उसने उनके पास पहुँचा दिया
  rationale: בוא का हिफ़ील रूप ‘ले आना’ या ‘पहुँचा देना’ व्यक्त करता है। यह चयन causative अर्थ और לָהֶם के ‘उनके पास/लिए’ भाव को सहज हिन्दी में रखता है।
theological_decisions:
- issue: יָבִא का निहित कर्ता
  choice: ‘उसने’—सन्दर्भ में परमेश्वर निहित कर्ता है
  alternative: निर्वैयक्तिक रूप में ‘उनकी लालसा उनके पास आ गई’
  rationale: भजन के वर्णन-क्रम में भोजन उपलब्ध कराने वाला परमेश्वर है, और בוא का हिफ़ील रूप सकर्मक/कारक अर्थ ‘पहुँचा दिया’ का समर्थन करता है। फिर भी मूल में नाम दोहराया नहीं गया है, इसलिए अनुवाद में केवल ‘उसने’ रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट शैली अपनाई गई है। ‘पूरी तरह तृप्त’ भोजन के ठोस प्रसंग और संतुष्टि के भाव को साथ रखता है; ‘लालसा’ व्यापक भजन में उपस्थित आलोचनात्मक तनाव को अनावश्यक रूप से बढ़ाए बिना सुरक्षित रखता है।
