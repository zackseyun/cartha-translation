  text: Fire consumed his young men[a], and his virgins were not praised in song.
translation:
  language: hi
  text: 'आग ने उसके जवानों को भस्म कर दिया,

    और उसकी कुँवारियों का गुणगान नहीं हुआ।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בַּחוּרָיו
  choice: उसके जवानों
  rationale: בָּחוּר यहाँ जीवन के उत्कर्ष पर पहुँचे, सम्भवतः युद्ध और विवाह की आयु वाले युवकों को दर्शाता है। ‘जवानों’ से अर्थ और काव्यात्मक समानांतरता स्वाभाविक रूप से बनी रहती है।
- source_word: אָכְלָה אֵשׁ
  choice: आग ने ... भस्म कर दिया
  rationale: אָכַל का मूल अर्थ ‘खाना’ है, पर आग के साथ इसका मुहावरेदार अर्थ ‘भस्म कर देना’ है; यह विनाशकारी बिंब को स्पष्ट और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וּבְתוּלֹתָיו
  choice: और उसकी कुँवारियों
  rationale: בְּתוּלָה विवाह-पूर्व युवती और उसकी कुँवारी अवस्था को संकेतित करता है। ‘कुँवारियों’ मूल शब्द की स्पष्ट अर्थ-विशेषता को बनाए रखता है।
- source_word: לֹא הוּלָּלוּ
  choice: के लिए मंगलगीत नहीं गाए गए
  rationale: הלל के पुअल रूप का यहाँ अर्थ प्रशंसा अथवा उत्सव-गीतों से सम्मानित किया जाना है। प्रसंग में विवाहयोग्य युवतियों के लिए विवाहोत्सव के गीत न गाए जाने का भाव सम्भावित है; ‘मंगलगीत’ इसे स्वाभाविक हिन्दी में व्यक्त करता है, बिना ‘विवाह’ को स्पष्ट रूप से जोड़कर अर्थ को अत्यधिक सीमित किए।
