  yaml_path: translation/ot/psalms/078/022.yaml
  text: because they did not believe in God, and did not trust in his salvation.
translation:
  language: hi
  text: क्योंकि उन्होंने परमेश्वर पर विश्वास नहीं किया और उसके उद्धार पर भरोसा नहीं रखा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הֶאֱמִינוּ בֵאלֹהִים
  choice: परमेश्वर पर विश्वास नहीं किया
  rationale: हिफ़ील रूप הֶאֱמִינוּ के साथ בְ यहाँ किसी पर विश्वास या भरोसा रखने का भाव देता है; इसलिए हिंदी में स्वाभाविक ‘पर विश्वास करना’ चुना गया।
- source_word: בָטְחוּ
  choice: भरोसा नहीं रखा
  rationale: בָּטַח सुरक्षा और विश्वास के साथ आश्रित होने का भाव रखता है; ‘भरोसा रखना’ इसे सहज आधुनिक हिंदी में व्यक्त करता है।
- source_word: בִישׁוּעָתוֹ
  choice: उसके उद्धार पर
  rationale: יְשׁוּעָה का अर्थ यहाँ परमेश्वर द्वारा दिया जाने वाला छुटकारा/उद्धार है; संबंधवाचक प्रत्यय וֹ को ‘उसके’ से स्पष्ट किया गया है।
theological_decisions:
- issue: ‘परमेश्वर पर विश्वास’ और ‘परमेश्वर की बात मानना’ के बीच चुनाव
  choice: परमेश्वर पर विश्वास नहीं किया
  alternative: परमेश्वर की बात पर विश्वास नहीं किया
  rationale: मसोरी पाठ में אֱלֹהִים से पहले בְ है, जो सीधे परमेश्वर पर विश्वास/भरोसा रखने की ओर संकेत करता है। संदर्भ से उसकी प्रतिज्ञाओं पर अविश्वास भी निहित हो सकता है, पर उसे पाठ में जोड़कर अर्थ सीमित नहीं किया गया।
- issue: יְשׁוּעָה का धार्मिक अर्थ
  choice: उद्धार
  alternative: छुटकारा
  rationale: भजन के संदर्भ में यह परमेश्वर की बचाने वाली सामर्थ्य और कार्य को दर्शाता है। ‘उद्धार’ व्यापक अर्थ बनाए रखता है और इसे केवल किसी एक तत्काल संकट से छुटकारे तक सीमित नहीं करता।
translation_notes:
  register: सरल, आधुनिक और गरिमापूर्ण मानक हिंदी। दोनों समानांतर खंडों की नकारात्मक संरचना और ‘विश्वास/भरोसा’ का काव्यात्मक साम्य सुरक्षित रखा गया है।
