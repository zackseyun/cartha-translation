  yaml_path: translation/ot/psalms/078/049.yaml
  text: He sent against them his burning anger[a], fury, indignation, and distress, a band of destructive messengers.
translation:
  language: hi
  text: उसने उन पर अपना धधकता क्रोध, रोष, प्रकोप और संकट भेजा—विनाश लाने वाले दूतों का भेजा हुआ दल।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “विपत्ति लाने वाले स्वर्गदूतों का भेजा हुआ दल”; परंपरागत रूप से, “दुष्ट स्वर्गदूत।” इब्रानी वाक्यांश नैतिक रूप से दुष्ट प्राणियों के बजाय विनाशकारी विपत्ति पहुँचाने वाले दूतों को भी सूचित कर सकता है।
    reason: वैकल्पिक पाठ
lexical_decisions:
- source_word: יְשַׁלַּח
  choice: उसने ... भेजा
  rationale: पिएल रूप यहाँ परमेश्वर द्वारा उनके विरुद्ध न्याय भेजने की कथा-वाचक क्रिया है; हिन्दी का सामान्य भूतकाल काव्यात्मक प्रसंग के अनुकूल है।
- source_word: בָּם
  choice: उन पर
  rationale: शत्रुतापूर्ण न्याय के संदर्भ में ב का आशय उन पर लक्षित कार्रवाई है, केवल उनके बीच की स्थिति नहीं।
- source_word: חֲרוֹן אַפּוֹ
  choice: अपना धधकता क्रोध
  rationale: इब्रानी मुहावरे में क्रोध की तपिश निहित है; यह चयन उसकी तीव्रता बचाते हुए आधुनिक हिन्दी में स्वाभाविक है।
- source_word: עֶבְרָה
  choice: रोष
  rationale: यह उफनते हुए क्रोध को व्यक्त करता है और निकटार्थक शब्दों की काव्यात्मक शृंखला में अलग शब्द बनाए रखता है।
- source_word: וָזַעַם
  choice: प्रकोप
  rationale: זעם निंदा-युक्त उग्र क्रोध या प्रकोप को सूचित कर सकता है; यह आसपास के क्रोध-संबंधी पदों को एक ही हिन्दी शब्द में नहीं मिलाता।
- source_word: וְצָרָה
  choice: और संकट
  rationale: यह उन पर लाई गई विपत्ति और घोर परेशानी को संक्षेप में व्यक्त करता है।
- source_word: מִשְׁלַחַת
  choice: एक दल
  rationale: संज्ञा भेजे जाने या भेजे हुए समूह का बोध कराती है; दूतों के साथ ‘एक दल’ स्वाभाविक हिन्दी है, जबकि भेजे जाने का भाव मुख्य क्रिया और संदर्भ में बना रहता है।
- source_word: מַלְאֲכֵי
  choice: दूतों
  rationale: מלאך का अर्थ दूत है और वह मानवीय अथवा अलौकिक संदेशवाहक दोनों के लिए प्रयुक्त हो सकता है; मुख्य पाठ अनावश्यक रूप से उनका स्वरूप निर्धारित नहीं करता।
- source_word: רָעִים
  choice: विनाश लाने वाले
  rationale: यहाँ विशेषण उनके नैतिक रूप से दुष्ट होने के बजाय उनके हानिकारक या विपत्तिकारी कार्य को बता सकता है; यह अनुवाद न्याय के विनाशकारी परिणाम को स्पष्ट रखता है।
theological_decisions:
- issue: क्या מַלְאֲכֵי רָעִים को नैतिक रूप से दुष्ट स्वर्गदूत माना जाए या विनाशकारी न्याय के दूत
  choice: विनाश लाने वाले दूतों का एक दल
  alternative: दुष्ट स्वर्गदूत; विपत्ति लाने वाले स्वर्गदूतों का एक भेजा हुआ दल
  rationale: מלאך व्यापक रूप से ‘दूत’ है और רָעִים नैतिक बुराई के साथ-साथ हानि या विपत्ति भी व्यक्त कर सकता है। मुख्य पाठ विनाशकारी न्याय का अर्थ रखता है, पर इब्रानी की दूसरी संभव समझ को पादटिप्पणी में सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण काव्यात्मक शैली रखी गई है। ‘धधकता क्रोध, रोष, प्रकोप और संकट’ मूल की निकटार्थक संचयी शृंखला को बनाए रखता है। डैश अंतिम पदबंध को भेजे गए न्याय की व्याख्यात्मक परिणति के रूप में प्रस्तुत करता है, बिना दूतों की प्रकृति को मुख्य पाठ में आवश्यकता से अधिक निश्चित किए।
