    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּפֵּל
  choice: उसने उन्हें गिराया
  rationale: हिफ़ील रूप का कारणवाचक भाव है। पिछले पद में आए पक्षियों का संकेतित कर्म हिन्दी में बहुवचन ‘उन्हें’ से स्वाभाविक और स्पष्ट होता है।
- source_word: בְּקֶרֶב
  choice: के बीच
  rationale: यह निकटता मात्र नहीं, बल्कि छावनी के भीतर या मध्य में स्थान को व्यक्त करता है।
- source_word: מַחֲנֵהוּ
  choice: उनकी छावनी
  rationale: प्रत्यय रूप की दृष्टि से एकवचन ‘उसकी’ है, पर वह इस्राएल की सामूहिक प्रजा को सूचित करता है; आधुनिक हिन्दी में ‘उनकी’ यही सामूहिक अर्थ सहजता से देता है।
- source_word: סָבִיב
  choice: चारों ओर
  rationale: यह चारों तरफ व्यापक रूप से बिखरे होने का स्थानिक भाव स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: לְמִשְׁכְּנֹתָיו
  choice: उनके निवासों के
  rationale: מִשְׁכָּן यहाँ व्यापक अर्थ में रहने के स्थानों को बताता है; ‘निवास’ ‘तंबू’ की अपेक्षा अधिक सटीक है। सामूहिक संदर्भ के कारण एकवचन प्रत्यय का हिन्दी रूप बहुवचन ‘उनके’ रखा गया है।
