  text: He led them securely[a], and they were not afraid; and the sea covered their enemies.
translation:
  language: hi
  text: वह उन्हें सुरक्षित रूप से ले चला, और वे नहीं डरे; और समुद्र[क] ने उनके शत्रुओं को ढक लिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: क
    text: 'इब्रानी में: “समुद्र।” यह पद निर्गमन के समय इस्राएलियों के समुद्र पार करने की घटना की ओर संकेत करता है। “लाल समुद्र” या “सरकंडों का समुद्र” संभावित व्याख्यात्मक विस्तार हैं, पर इब्रानी पाठ यहाँ अधिक विशिष्ट नहीं है।'
    reason: cross_reference
lexical_decisions:
- source_word: וַיַּנְחֵם
  choice: उसने उन्हें मार्ग दिखाया
  rationale: נחה के हिफ़ील रूप का अर्थ अगुवाई करना या मार्ग दिखाना है। यह चयन निर्गमन के प्रसंग में वास्तविक यात्रा की छवि को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: לָבֶטַח
  choice: सुरक्षित
  rationale: בֶּטַח सुरक्षा और निश्चिंतता का बोध कराता है; यहाँ ל उपसर्ग क्रियाविशेषणीय ढंग से अगुवाई के सुरक्षित होने का वर्णन करता है।
- source_word: וְלֹא פָחָדוּ
  choice: और वे नहीं डरे
  rationale: सरल संयोजक וְ को 'और' तथा פחד को 'डरना' अनूदित किया गया है; इससे मूल का सीधा समन्वय बना रहता है और परिणाम-संबंध को अनावश्यक रूप से स्पष्ट नहीं किया जाता।
- source_word: אֹיְבֵיהֶם
  choice: उनके शत्रुओं
  rationale: אויב का स्पष्ट और गरिमापूर्ण आधुनिक हिन्दी पर्याय 'शत्रु' है।
- source_word: כִּסָּה
  choice: ढक लिया
  rationale: כסה का मूल अर्थ 'ढकना' है। यह समुद्र की ठोस छवि को बनाए रखता है और 'नष्ट कर दिया' जैसे व्याख्यात्मक विस्तार से बचता है।
- source_word: הַיָּם
  choice: समुद्र
  rationale: इब्रानी में निश्चित सामान्य संज्ञा 'समुद्र' है; पद स्वयं 'लाल समुद्र' या 'सरकंडों का समुद्र' जैसा विशिष्ट नाम नहीं देता।
theological_decisions:
- issue: निर्गमन के समय समुद्र पार करने की ऐतिहासिक ओर संकेत
  choice: मुख्य पाठ में सामान्य पद 'समुद्र' रखा गया।
  alternative: '''लाल समुद्र'' या ''सरकंडों का समुद्र'''
  rationale: प्रसंग निर्गमन की घटना की ओर संकेत करता है, पर इस पद का इब्रानी पाठ केवल הַיָּם, अर्थात 'समुद्र', कहता है। अधिक विशिष्ट पहचान जोड़ने से मूल पाठ की अभिव्यक्ति संकुचित हो जाती।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण और सामान्य पाठकों के लिए बोधगम्य शैली। इब्रानी की तीन समन्वित क्रियाओं को 'और' से जोड़ा गया है; अनावश्यक कारणात्मक या विरोधात्मक संबंध नहीं जोड़ा गया।
