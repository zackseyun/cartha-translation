  yaml_path: translation/ot/psalms/078/011.yaml
  text: They forgot his deeds[b][a], and his wonders that he had shown them.
translation:
  language: hi
  text: 'वे उसके कामों को भूल गए,

    और उसके अद्भुत कामों को, जो उसने उन्हें दिखाए थे।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁכְּחוּ
  choice: वे ... भूल गए
  rationale: שׁכח का क़ाल वय्यिक्तोल रूप बीते हुए क्रमिक कार्य को बताता है; सरल कथात्मक हिंदी में ‘भूल गए’ स्वाभाविक है।
- source_word: עֲלִילוֹתָיו
  choice: उसके कामों
  rationale: עֲלִילוֹת का अर्थ किए गए काम या कार्य है। ‘कामों’ व्यापक, सहज और आधुनिक हिंदी है।
- source_word: וְנִפְלְאוֹתָיו
  choice: और उन अद्भुत कामों को भी
  rationale: פלא से बना यह शब्द असाधारण और विस्मयकारी कार्यों को दर्शाता है। ‘अद्भुत काम’ अर्थ को स्पष्ट रखता है और इसे केवल ‘चमत्कारों’ तक सीमित नहीं करता।
- source_word: אֲשֶׁר
  choice: जो
  rationale: यह संबंधवाचक उपवाक्य आरंभ करता है और हिंदी में ‘जो’ उसका स्वाभाविक समतुल्य है।
- source_word: הֶרְאָם
  choice: उसने उन्हें दिखाए थे
  rationale: ראה का हिफ़ील पूर्ण रूप, बहुवचन कर्म-प्रत्यय के साथ, शाब्दिक रूप से ‘उसने उन्हें देखने दिया’ और मुहावरेदार रूप से ‘उसने उन्हें दिखाया’ है। ‘दिखाए थे’ बताता है कि दिखाना भूलने से पहले हुआ था।
theological_decisions:
- issue: सर्वनामिक प्रत्ययों का संदर्भ
  choice: ‘उसके कामों ... उसने’ में संकेत परमेश्वर की ओर है।
  alternative: संज्ञा ‘परमेश्वर’ को स्पष्ट रूप से जोड़ना।
  rationale: भजन के संदर्भ में ये इस्राएल को दिखाए गए परमेश्वर के कार्य हैं। सर्वनाम बनाए रखने से मूल की अभिव्यक्ति और संदर्भगत स्पष्टता दोनों सुरक्षित रहते हैं, बिना अनावश्यक व्याख्या जोड़े।
translation_notes:
  register: आधुनिक मानक हिंदी; सरल, गरिमापूर्ण और सार्वजनिक पाठ के अनुकूल। दूसरी पंक्ति में ‘भी’ मूल के संयोजक बल को स्वाभाविक हिंदी में व्यक्त करता है।
