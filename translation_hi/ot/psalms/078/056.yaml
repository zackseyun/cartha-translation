source:
  edition: WLC
  text: וַ/יְנַסּ֣וּ וַ֭/יַּמְרוּ אֶת אֱלֹהִ֣ים עֶלְי֑וֹן וְ֝/עֵדוֹתָ֗י/ו לֹ֣א שָׁמָֽרוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/056.yaml
  text: Yet they tested God Most High and rebelled[c][b][a], and they did not keep his testimonies.
translation:
  language: hi
  text: फिर भी उन्होंने परमप्रधान परमेश्वर को परखा और उसके विरुद्ध विद्रोह किया; उन्होंने उसकी विधियों[a] का पालन नहीं किया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उसकी साक्षियों” अथवा “उसके नियमों”।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְנַסּוּ
  choice: उन्होंने ... परखा
  rationale: נסה यहाँ परमेश्वर की परीक्षा लेने के आरोपात्मक अर्थ में है; ‘परखा’ आधुनिक और स्पष्ट है।
- source_word: וַיַּמְרוּ
  choice: उसके विरुद्ध विद्रोह किया
  rationale: מרה सक्रिय अवज्ञा और विद्रोह को व्यक्त करता है; ‘विद्रोह किया’ इस बल को बनाए रखता है।
- source_word: אֶת אֱלֹהִים עֶלְיוֹן
  choice: परमप्रधान परमेश्वर को
  rationale: אֵת पहले क्रिया के प्रत्यक्ष कर्म को चिह्नित करता है। ‘परमप्रधान परमेश्वर’ हिंदी में स्वाभाविक दिव्य उपाधि है; दूसरी क्रिया के साथ ‘उसके विरुद्ध’ स्पष्ट किया गया है।
- source_word: וְעֵדוֹתָיו
  choice: उसकी चितौनियों
  rationale: עֵדוֹת परमेश्वर की साक्षी देने वाली वाचागत आज्ञाओं/विधियों को सूचित करता है। ‘चितौनियाँ’ स्थापित बाइबिलीय अर्थ-संबंध को रखता है, जबकि विकल्प पादटिप्पणी में दिए गए हैं।
- source_word: לֹא שָׁמָרוּ
  choice: पालन नहीं किया
  rationale: आज्ञाओं या चितौनियों के साथ שׁמר का अर्थ उन्हें मानना/पालन करना है; हिंदी में ‘पालन करना’ सबसे स्वाभाविक है।
- source_word: וַ
  choice: फिर भी
  rationale: संदर्भ में यह पूर्ववर्णित परमेश्वर के कार्यों के विपरीत इस्राएल की प्रतिक्रिया दिखाता है; ‘फिर भी’ उस विरोधात्मक संबंध को व्यक्त करता है।
theological_decisions:
- issue: दिव्य उपाधि אֱלֹהִים עֶלְיוֹן का अनुवाद
  choice: परमप्रधान परमेश्वर
  alternative: परमेश्वर, जो परमप्रधान है
  rationale: यह परमेश्वर की सर्वोच्चता व्यक्त करने वाली उपाधि है; चुना हुआ रूप संक्षिप्त, स्वाभाविक और मूल के दोनों पदों के प्रति निष्ठावान है।
- issue: עֵדוֹתָיו का वाचागत/विधिक आशय
  choice: उसकी चितौनियाँ
  alternative: उसकी विधियाँ / उसकी साक्षियाँ
  rationale: यह शब्द केवल सामान्य नियम नहीं, बल्कि परमेश्वर की साक्षी देने वाली वाचागत आज्ञाओं को सूचित कर सकता है। मुख्य पाठ में पारंपरिक अर्थ-संबंध रखा गया है और संभावित विधिक विकल्प पादटिप्पणी में सुरक्षित हैं।
- issue: दोनों क्रियाओं के साथ परमेश्वर का संबंध
  choice: परमेश्वर को परखा और उसके विरुद्ध विद्रोह किया
  alternative: परमप्रधान परमेश्वर को परखा और विद्रोह किया
  rationale: पहली क्रिया मूल में प्रत्यक्ष कर्म लेती है, जबकि हिंदी में ‘विद्रोह’ के साथ ‘के विरुद्ध’ स्वाभाविक है। यह वाक्य-विन्यास दोनों क्रियाओं को एक ही अस्वाभाविक कारक में बाँधने से बचाता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘परमप्रधान परमेश्वर’ मानक दिव्य उपाधि है; ‘परखा’ और ‘विद्रोह किया’ मूल की दो अलग आरोपात्मक क्रियाओं को स्पष्ट रखते हैं।
