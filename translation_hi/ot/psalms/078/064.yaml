  text: כֹּ֭הֲנָי/ו בַּ/חֶ֣רֶב נָפָ֑לוּ וְ֝/אַלְמְנֹתָ֗י/ו לֹ֣א תִבְכֶּֽינָה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/064.yaml
  text: His priests fell by the sword[a], and his widows could not weep.
translation:
  language: hi
  text: 'उसके याजक तलवार से मारे गए,

    और उसकी विधवाएँ नहीं रोईं।[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “रो न सकीं।” इब्रानी में शाब्दिक रूप से “नहीं रोईं” है। यह सीधा तथ्य भी बता सकता है, या संकेत कर सकता है कि भारी विनाश के कारण प्रचलित रीति से शोक करने का अवसर नहीं मिला।
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּהֲנָיו
  choice: उसके याजक
  rationale: כֹּהֵן का सामान्य और प्रसंगानुकूल अर्थ ‘याजक’ है। एकवचन संबंधसूचक प्रत्यय को ‘उसके’ से बनाए रखा गया है।
- source_word: בַּחֶרֶב
  choice: तलवार से
  rationale: בְּ यहाँ साधन बताता है; ‘तलवार से’ हिंसक मृत्यु का स्वाभाविक हिन्दी प्रयोग है।
- source_word: נָפָלוּ
  choice: मारे गए
  rationale: נפל का मूल अर्थ ‘गिरना’ है, पर युद्ध और तलवार के प्रसंग में यह मृत्यु को सूचित करता है। हिन्दी में ‘तलवार से गिर पड़े’ अस्पष्ट या अस्वाभाविक हो सकता है, इसलिए ‘मारे गए’ प्रसंगगत अर्थ स्पष्ट करता है।
- source_word: וְאַלְמְנֹתָיו
  choice: और उसकी विधवाएँ
  rationale: इब्रानी प्रत्यय पुल्लिंग एकवचन है; ‘उसकी’ उस व्याकरणिक रूप और सामूहिक इकाई के रूप में संदर्भित समुदाय को बनाए रखता है।
- source_word: לֹא תִבְכֶּינָה
  choice: नहीं रोईं
  rationale: इब्रानी का सीधा अर्थ ‘नहीं रोईं’ है। यह अनुष्ठानिक शोक का अवसर न मिल पाने का संकेत दे सकता है, पर मुख्य पाठ में संभाव्यता जोड़कर अस्पष्टता को हल नहीं किया गया।
theological_decisions:
- issue: विधवाओं के न रोने का अभिप्राय
  choice: मुख्य पाठ में तथ्यात्मक और अस्पष्ट ‘नहीं रोईं’ रखा गया।
  alternative: ‘रो न सकीं’, अर्थात विनाश के कारण उन्हें विधिवत शोक करने का अवसर नहीं मिला।
  rationale: नकारयुक्त इब्रानी क्रिया सीधे तौर पर ‘नहीं रोईं’ कहती है। प्रसंग असमर्थता या अवसर के अभाव का संकेत दे सकता है, किंतु वह अर्थ व्याकरण में स्पष्ट रूप से व्यक्त नहीं है; इसलिए उसे पाद-टिप्पणी में रखा गया है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। काव्य-पंक्ति की संक्षिप्तता तथा इब्रानी के एकवचन संबंधसूचक रूप को सुरक्षित रखा गया है।
