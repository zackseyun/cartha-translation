  yaml_path: translation/ot/psalms/078/018.yaml
  text: They tested God in their heart by asking for food for themselves[a][b].
translation:
  language: hi
  text: उन्होंने अपने मन में परमेश्वर को परखा—अपने लिए भोजन माँगकर।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अपनी भूख मिटाने के लिए भोजन माँगकर।” इब्रानी में प्रयुक्त शब्द का अर्थ “प्राण,” “स्वयं,” “भूख” या “लालसा” हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְנַסּוּ
  choice: उन्होंने ... परखा
  rationale: पिएल रूप का अर्थ यहाँ परमेश्वर को चुनौती देकर ‘परखना’ है; ‘परीक्षा ली’ की अपेक्षा ‘परखा’ अधिक स्वाभाविक और सटीक है।
- source_word: אֵל
  choice: परमेश्वर
  rationale: אֵל यहाँ सामान्य ईश्वरीय उपाधि है; आधुनिक मानक हिन्दी में ‘परमेश्वर’ स्पष्ट और गरिमापूर्ण है।
- source_word: בִּלְבָבָם
  choice: अपने मन में
  rationale: इब्रानी में संज्ञा एकवचन और प्रत्यय बहुवचन है। हिन्दी का ‘अपने मन में’ प्रत्येक व्यक्ति की भीतरी प्रवृत्ति और सामूहिक भाव—दोनों को स्वाभाविक रूप से व्यक्त करता है।
- source_word: לִשְׁאָל
  choice: माँगकर
  rationale: 'ל के साथ infinitive यहाँ साधन या रीति बताता है: उन्होंने भोजन माँगने के द्वारा परमेश्वर को परखा।'
- source_word: אֹכֶל
  choice: भोजन
  rationale: यह सामान्य अर्थ वाला शब्द है; इसे ‘रोटी’ तक सीमित करने का आधार नहीं है।
- source_word: לְנַפְשָׁם
  choice: अपने लिए
  rationale: נֶפֶשׁ यहाँ ‘स्वयं’ अथवा भोजन की लालसा/भूख की ओर संकेत कर सकता है। मुख्य पाठ में ‘अपने लिए’ इब्रानी के निकट और सहज है, जबकि वैकल्पिक अर्थ पादटिप्पणी में सुरक्षित है।
theological_decisions:
- issue: भोजन की माँग के प्रसंग में נֶפֶשׁ का अर्थ
  choice: अपने लिए
  alternative: अपनी भूख मिटाने के लिए / अपनी लालसा के अनुसार
  rationale: ‘अपने लिए’ शब्द के ‘स्वयं’ वाले अर्थ को सीधे रखता है और ‘आत्मा’ संबंधी बाद की मानवशास्त्रीय धारणाएँ पाठ में नहीं लाता। प्रसंगगत ‘भूख/लालसा’ का अर्थ पादटिप्पणी में दिया गया है, ताकि वास्तविक अर्थ-व्याप्ति बनी रहे।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। डैश क्रिया और उसके साधन के संबंध को स्पष्ट करता है; ‘अपने मन में’ भीतरी विद्रोही मनोभाव को बिना अतिरिक्त व्याख्या के व्यक्त करता है।
