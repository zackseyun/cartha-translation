id: PSA.78.4
reference: Psalms 78:4
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: לֹ֤א נְכַחֵ֨ד מִ/בְּנֵי/הֶ֗ם לְ/ד֥וֹר אַחֲר֗וֹן מְֽ֭סַפְּרִים תְּהִלּ֣וֹת יְהוָ֑ה וֶ/עֱזוּז֥/וֹ וְ֝/נִפְלְאוֹתָ֗י/ו אֲשֶׁ֣ר עָשָֽׂה׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/004.yaml
  text: We will not hide them from their children[a], telling the coming generation the praiseworthy deeds of Yahweh, and his strength[c][b], and his wonders that he has done.
translation:
  language: hi
  text: हम उन्हें उनकी सन्तान से नहीं छिपाएँगे, बल्कि आनेवाली पीढ़ी[b] को याहवे के प्रशंसनीय कामों[a], उसके सामर्थ्य और उसके किए हुए अद्भुत कामों का वर्णन करेंगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “याहवे की स्तुतियों।” इब्रानी शब्द का अर्थ याहवे को अर्पित स्तुति या उसके प्रशंसा-योग्य काम, दोनों हो सकता है; यहाँ आगे उल्लिखित सामर्थ्य और अद्भुत कामों के कारण दूसरा अर्थ अधिक संभावित है।
    reason: lexical_alternative
  - marker: b
    text: या, “बाद की पीढ़ी” अथवा “अगली पीढ़ी।”
    reason: lexical_alternative
lexical_decisions:
- source_word: נְכַחֵד
  choice: हम ... नहीं छिपाएँगे
  rationale: पिअल रूप यहाँ किसी बात को छिपाने या रोक रखने का भाव देता है। यह वाक्यांश संकल्प और भविष्याभिमुखता दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: מִבְּנֵיהֶם
  choice: उनकी सन्तान से
  rationale: בנים का अर्थ बेटे, बच्चे या वंशज हो सकता है। पीढ़ियों के बीच शिक्षा पहुँचाने के प्रसंग में ‘सन्तान’ लिंग-विशेष तक सीमित हुए बिना व्यापक अर्थ को बनाए रखता है।
- source_word: לְדוֹר אַחֲרוֹן
  choice: आनेवाली पीढ़ी को
  rationale: यह पद आगे आने वाली या बाद की पीढ़ी को सूचित करता है। ‘आनेवाली पीढ़ी’ उसके भविष्याभिमुख भाव को सहज हिन्दी में रखता है।
- source_word: מְסַפְּרִים
  choice: वर्णन करेंगे
  rationale: इब्रानी कृदन्त बताता है कि न छिपाने का काम सुनाने या वर्णन करने के द्वारा होगा। हिन्दी में मुख्य क्रिया के रूप में ‘वर्णन करेंगे’ अर्थ-संबंध को स्पष्ट और स्वाभाविक रखता है; ‘बल्कि’ नकारात्मक और सकारात्मक पक्षों को जोड़ता है।
- source_word: תְּהִלּוֹת יְהוָה
  choice: याहवे के प्रशंसनीय कामों
  rationale: תהלות का अर्थ याहवे को दी गई स्तुतियाँ अथवा उसके प्रशंसा-योग्य कार्य/गुण हो सकता है। ‘उसके सामर्थ्य’ और ‘उसके किए हुए अद्भुत कामों’ के साथ समानांतर प्रयोग के कारण यहाँ उसके प्रशंसनीय काम अधिक संभावित हैं।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी पाठ में परमेश्वर का निजी नाम יהוה है। ‘याहवे’ उसका हिन्दी लिप्यन्तरण है, न कि उसके स्थान पर प्रयुक्त कोई उपाधि।
- source_word: עֱזוּזוֹ
  choice: उसके सामर्थ्य
  rationale: यह संज्ञा शक्ति या पराक्रम का बोध कराती है। ‘सामर्थ्य’ गरिमापूर्ण, स्पष्ट और प्रसंगानुकूल है।
- source_word: נִפְלְאוֹתָיו אֲשֶׁר עָשָׂה
  choice: उसके किए हुए अद्भुत कामों
  rationale: נפלאות विस्मय उत्पन्न करने वाले असाधारण कार्यों को दर्शाता है, और אֲשֶׁר עָשָׂה स्पष्ट करता है कि उसने उन्हें किया। संयुक्त हिन्दी वाक्यांश इस संबंध को बिना अनावश्यक पुनरुक्ति के व्यक्त करता है।
theological_decisions:
- issue: יהוה परमेश्वर के नाम का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ निजी नाम יהוה का प्रयोग करता है। ‘याहवे’ उस नाम का प्रत्यक्ष लिप्यन्तरण है और उसे किसी उपाधि से नहीं बदलता।
- issue: תְּהִלּוֹת יְהוָה का अर्थ
  choice: याहवे के प्रशंसनीय काम
  alternative: याहवे की स्तुतियाँ
  rationale: शब्द दोनों अर्थ ग्रहण कर सकता है। इस पद में सामर्थ्य और किए हुए अद्भुत कामों के साथ उसका समन्वय वस्तुगत अर्थ—याहवे के प्रशंसा-योग्य कार्य—के पक्ष में है; वैकल्पिक अर्थ पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘सन्तान’ पीढ़ीगत प्रसंग में पुत्रों और पुत्रियों दोनों को समेटता है। इब्रानी कृदन्त को हिन्दी की स्वाभाविक मुख्य क्रिया में बदला गया है, जबकि ‘बल्कि’ यह स्पष्ट करता है कि सक्रिय वर्णन करना ही बातों को न छिपाने का तरीका है।
