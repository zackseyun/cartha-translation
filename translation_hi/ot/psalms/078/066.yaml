  yaml_path: translation/ot/psalms/078/066.yaml
  text: He struck his foes backward[a]; he put everlasting disgrace on them.
translation:
  language: hi
  text: उसने अपने शत्रुओं को पीछे की ओर मारा[a]; उसने उन्हें सदा का अपमान दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसने अपने शत्रुओं की पीठ पर मारा।” इब्रानी शब्द אָחוֹר का अर्थ क्रियाविशेषण के रूप में “पीछे की ओर” हो सकता है, या यह उस स्थान को बता सकता है जहाँ प्रहार किया गया—“पीठ पर।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּךְ
  choice: उसने मारा
  rationale: נכה का यह रूप बीते हुए कथात्मक कार्य को बताता है। ‘मारा’ सहज आधुनिक हिन्दी है और मृत्यु या पूर्ण विनाश का अतिरिक्त अर्थ नहीं जोड़ता।
- source_word: צָרָיו
  choice: अपने शत्रुओं को
  rationale: צַר का अर्थ यहाँ विरोधी या शत्रु है। ‘शत्रु’ काव्यात्मक गरिमा और सामान्य बोध, दोनों बनाए रखता है।
- source_word: אָחוֹר
  choice: पीछे की ओर
  rationale: यह क्रियाविशेषण के रूप में पीछे की दिशा बता सकता है। मुख्य पाठ में यह अर्थ रखा गया है, जबकि शरीर के स्थान के रूप में ‘पीठ पर’ की वास्तविक अस्पष्टता पादटिप्पणी में दी गई है।
- source_word: חֶרְפַּת עוֹלָם
  choice: सदा का अपमान
  rationale: यह पदबंध लंबे समय तक बने रहने वाले सार्वजनिक तिरस्कार या कलंक को व्यक्त करता है। ‘सदा का अपमान’ आधुनिक, स्पष्ट और काव्यात्मक है; यह עוֹלָם को अनावश्यक रूप से दार्शनिक अनन्तता तक सीमित नहीं करता।
- source_word: נָתַן לָמוֹ
  choice: उसने उन्हें ... दिया
  rationale: נתן + לָמוֹ का मूल ‘उन्हें दिया’ है और यहाँ किसी दशा या अपमान को उनके हिस्से में डालने का भाव है। हिन्दी में ‘अपमान दिया’ मूल रूपक को स्पष्ट और संक्षिप्त ढंग से बनाए रखता है।
