  yaml_path: translation/ot/psalms/078/065.yaml
  text: Then the Lord awoke as from sleep[a], like a warrior shouting because of wine.
translation:
  language: hi
  text: तब प्रभु मानो नींद से जाग उठे—जैसे दाखमधु से हुंकार भरता हुआ कोई योद्धा।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘जैसे दाखमधु से हर्षित कोई वीर,’ अथवा ‘जैसे दाखमधु से हुंकार भरता हुआ कोई बलवान पुरुष।’
    reason: मִתְרוֹנֵן का अर्थ ऊँची पुकार, विजयोल्लास या हर्षपूर्ण हुंकार हो सकता है; גִּבּוֹר के लिए ‘योद्धा’, ‘वीर’ और ‘बलवान पुरुष’ संभव हैं।
lexical_decisions:
- source_word: וַיִּקַץ
  choice: जाग उठे
  rationale: क्रिया יקץ का अर्थ नींद से जागना या सचेत होकर उठना है। ‘जाग उठे’ काव्यात्मक प्रसंग में स्वाभाविक और प्रभावशाली है।
- source_word: כְּיָשֵׁן
  choice: मानो नींद से जागे हों
  rationale: उपसर्ग כ तुलना सूचित करता है। यह अभिव्यक्ति स्पष्ट रखती है कि यहाँ प्रभु के सचमुच सोने का कथन नहीं, बल्कि उपमा है।
- source_word: אֲדֹנָי
  choice: प्रभु
  rationale: यहाँ אֲדֹנָי ईश्वरीय उपाधि है, टेट्राग्राम नहीं। आधुनिक मानक हिन्दी में ‘प्रभु’ इसका स्वाभाविक और प्रतिष्ठित रूप है।
- source_word: כְּגִבּוֹר
  choice: जैसे ... कोई योद्धा
  rationale: גבור बलवान पुरुष अथवा युद्धवीर को दर्शाता है। प्रसंग की युद्ध-संबंधी छवि के लिए ‘योद्धा’ सजीव और सहज है।
- source_word: מִתְרוֹנֵן
  choice: ललकारता हुआ
  rationale: यह रूप ऊँची, उत्साहपूर्ण पुकार या हुंकार का भाव देता है। ‘ललकारता हुआ’ योद्धा की छवि और मुखर ध्वनि दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: מִיָּיִן
  choice: दाखमधु के कारण
  rationale: 'מן यहाँ कारण या प्रभाव का बोध करा सकता है: योद्धा दाखमधु के प्रभाव से ऊँची पुकार करता है। ‘के कारण’ इस संबंध को स्पष्ट रखता है, जबकि पादटिप्पणी अधिक शाब्दिक विकल्पों को सुरक्षित रखती है।'
theological_decisions:
- issue: परमेश्वर के जागने और दाखमधु से उत्तेजित योद्धा से उनकी तुलना का मानवरूपी चित्रण
  choice: इस उपमा को बिना नरम किए साहसपूर्ण काव्यात्मक मानवरूपी चित्रण के रूप में बनाए रखा गया है।
  alternative: मानवरूपी भाषा हटाकर भावार्थ करना, अथवा दाखमधु को उपमा का वास्तविक अंग न मानकर रूपकात्मक ढंग से समझाना।
  rationale: भजन प्रत्यक्ष निष्क्रियता के बाद प्रभु के निर्णायक हस्तक्षेप को दर्शाने के लिए प्रबल काव्यात्मक भाषा प्रयोग करता है। अनुवाद को इस साहित्यिक बल और धर्मवैचारिक तनाव को समझाकर समाप्त करने के बजाय सुरक्षित रखना चाहिए।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की, काव्यात्मक किंतु सामान्य पाठक के लिए सहज रखी गई है। ‘दाखमधु’ बाइबिलीय गरिमा बनाए रखते हुए ‘मदिरा’ की अपेक्षा स्रोत के יין के अधिक सीधे अनुरूप है। मुख्य पाठ में डैश उपमा के दूसरे, तीव्र चित्र को स्पष्ट करता है।
