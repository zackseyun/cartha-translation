  text: The sons of Ephraim[a], armed with bows, turned back on the day of battle.
translation:
  language: hi
  text: एप्रैम के बेटे[a], हथियारों से लैस और धनुष चलानेवाले, युद्ध के दिन पीछे हट गए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “एप्रैमी, हथियारों से लैस और धनुष चलानेवाले, युद्ध के दिन पीछे हट गए।” इब्रानी में प्रयुक्त संक्षिप्त कृदंत-वाक्यांश का अनुवाद एक से अधिक स्वाभाविक तरीकों से किया जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי אֶפְרַיִם
  choice: एप्रैम के बेटे
  rationale: यह इब्रानी के वंशगत और गोत्रीय मुहावरे का सीधा रूप है; यहाँ इसका आशय एप्रैम के गोत्र के लोगों से है।
- source_word: נוֹשְׁקֵי
  choice: हथियारों से लैस
  rationale: यह कृदंत युद्ध के लिए हथियार धारण करने या सुसज्जित होने का भाव व्यक्त करता है।
- source_word: רוֹמֵי קָשֶׁת
  choice: धनुष चलानेवाले
  rationale: शाब्दिक रूप से यह ‘धनुष चलाने/तीर छोड़नेवाले’ लोगों को बताता है; यह रूप इब्रानी की क्रियात्मक अभिव्यक्ति को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: הָפְכוּ
  choice: पीछे हट गए
  rationale: युद्ध के संदर्भ में क्रिया पलटने या वापस मुड़ने का भाव देती है; ‘पीछे हट गए’ उस चित्र को स्पष्ट रखता है, पर हार या पलायन जैसी अतिरिक्त बात नहीं जोड़ता।
- source_word: בְּיוֹם קְרָב
  choice: युद्ध के दिन
  rationale: यह समय-सूचक पदबंध का सीधा, स्वाभाविक और गरिमापूर्ण हिन्दी रूप है।
