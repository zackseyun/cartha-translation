  yaml_path: translation/ot/psalms/078/015.yaml
  text: He split rocks in the wilderness and gave them drink abundantly[a], as from the great depths.
translation:
  language: hi
  text: 'उसने निर्जन प्रदेश में चट्टानें चीर दीं,

    और उन्हें भरपूर पानी पिलाया,[a]

    मानो अथाह गहराइयों से।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “और उन्हें अथाह गहराइयों के समान पिलाया।”
    reason: כִּתְהֹמוֹת רַבָּה की रचना को पिलाने की प्रचुरता पर बल देने वाली उपमा, अथवा विशाल गहराइयों की उपमा के रूप में समझा जा सकता है। यह विकल्प כְּ (‘के समान’) को बनाए रखता है।
lexical_decisions:
- source_word: יְבַקַּע
  choice: चीर दीं
  rationale: पिएल रूप चट्टानों को बलपूर्वक फाड़ने या खोलने की सजीव क्रिया व्यक्त करता है; ‘चीर दीं’ आधुनिक हिन्दी में स्वाभाविक और काव्यात्मक है।
- source_word: צֻרִים
  choice: चट्टानें
  rationale: बहुवचन को बनाए रखते हुए बड़े पत्थरों या शैलखंडों का स्पष्ट बोध कराता है।
- source_word: בַּמִּדְבָּר
  choice: निर्जन प्रदेश में
  rationale: מִדְבָּר जंगल, वीराना या मरुस्थलीय निर्जन क्षेत्र को सूचित कर सकता है; ‘निर्जन प्रदेश’ केवल रेतीले रेगिस्तान का अनावश्यक अर्थ नहीं थोपता।
- source_word: וַיַּשְׁקְ
  choice: उन्हें ... पानी पिलाया
  rationale: हिफ़ील रूप का अर्थ ‘पीने को देना’ है। कर्म संदर्भ से इस्राएली लोग हैं, इसलिए हिन्दी में ‘उन्हें’ स्वाभाविक रूप से जोड़ा गया है; ‘पानी’ निहित वस्तु को स्पष्ट करता है।
- source_word: כִּתְהֹמוֹת
  choice: मानो अथाह गहराइयों से
  rationale: כְּ तुलना को और תְּהֹמוֹת गहरे अथवा आदिम जलों की बहुवचन छवि को व्यक्त करता है। ‘मानो’ काव्यात्मक तुलना को बनाए रखता है और ‘अथाह गहराइयाँ’ उस विराट जल-छवि को सुरक्षित रखती हैं।
- source_word: רַבָּה
  choice: भरपूर
  rationale: यहाँ रूपात्मक असंगति के कारण इसे पिलाने की प्रचुरता बताने वाला क्रियाविशेषण समझना संभव है। ‘भरपूर’ पर्याप्त और बहुतायत से पानी दिए जाने का अर्थ स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: जल की छवि का स्वरूप
  choice: तुलना को बनाए रखा गया है—‘मानो अथाह गहराइयों से’—और साथ ही רַבָּה को ‘भरपूर’ के रूप में व्यक्त किया गया है।
  alternative: ‘और उन्हें विशाल अथाह जल से पिलाया’
  rationale: इब्रानी पद गहरे जलों की काव्यात्मक छवि देता है, पर यह निर्णायक रूप से नहीं बताता कि जल किसी वास्तविक भूमिगत जलाशय से निकला था। मुख्य पाठ तुलना और प्रचुरता दोनों को रखता है; वैकल्पिक संरचना पादटिप्पणी में दी गई है।
translation_notes:
  register: भाषा आधुनिक, सरल और गरिमापूर्ण रखी गई है। पद की काव्यात्मक समानांतरता दिखाने के लिए तीन पंक्तियाँ प्रयुक्त हैं। ‘निर्जन प्रदेश’ सामान्य पाठक के लिए सहज है और ‘अथाह गहराइयाँ’ मूल की विराट जल-छवि बनाए रखती हैं।
