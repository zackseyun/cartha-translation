    text: या, ‘वे वापस मुड़ते।’ प्रसंग में इसका आशय पश्चात्ताप करना भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, ‘भोर में खोजते’; यह लगन या तत्परता से खोजने का मुहावरा है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: जब
  rationale: इस काव्यात्मक-ऐतिहासिक प्रसंग में यह कालसूचक, बार-बार होने वाली परिस्थिति बताता है; इसलिए शर्तसूचक ‘यदि’ की अपेक्षा ‘जब’ अधिक स्वाभाविक है।
- source_word: הֲרָגָם
  choice: वह उन्हें मार डालता
  rationale: הרג का सीधा अर्थ मारना है। कर्ता इब्रानी में निहित है और प्रसंग में परमेश्वर की ओर संकेत करता है।
- source_word: וּדְרָשׁוּהוּ
  choice: वे उसे खोजने लगते
  rationale: דרש किसी व्यक्ति के कर्म के साथ उसे खोजने या उसकी ओर सहायता के लिए मुड़ने का भाव देता है। ‘खोजने लगते’ प्रसंग के प्रतिक्रियात्मक और पुनरावृत्त भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וְשָׁבוּ
  choice: वे लौट आते
  rationale: שוב का मूल अर्थ लौटना या वापस मुड़ना है। यह प्रसंग में पश्चात्ताप का संकेत दे सकता है, पर मुख्य पाठ में उससे अधिक स्पष्ट धार्मिक अर्थ नहीं जोड़ा गया।
- source_word: וְשִׁחֲרוּ
  choice: लगन से ... खोज करते
  rationale: Piel में שחר का शाब्दिक भाव ‘भोर में खोजना’ है और मुहावरे के रूप में तत्परता या उत्कट लगन से खोजने को व्यक्त करता है।
- source_word: אֵל
  choice: परमेश्वर
  rationale: אֵל यहाँ सामान्य ईश्वरीय उपाधि है; ‘परमेश्वर’ आधुनिक मानक हिन्दी में स्वाभाविक और गरिमापूर्ण है।
theological_decisions:
- issue: וְשָׁבוּ में पश्चात्ताप का भाव स्पष्ट करना या मूल ‘लौटना’ बनाए रखना
  choice: वे लौट आते
  alternative: वे पश्चात्ताप करते
  rationale: प्रसंग पश्चात्ताप का संकेत दे सकता है, लेकिन इब्रानी क्रिया का मूल अर्थ ‘लौटना/वापस मुड़ना’ है। मुख्य पाठ इस धार्मिक तनाव को खुला रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और काव्यात्मक गद्य-विन्यास रखा गया है। समानांतर पदों की गति बनाए रखने के लिए अर्धविराम का प्रयोग किया गया है; ‘पश्चात्ताप’ को मुख्य पाठ में न रखकर पादटिप्पणी में संभावित अर्थ के रूप में सुरक्षित किया गया है।
