  text: He gave their produce to the devouring locust[b][a], and their labor to the swarming locust.
translation:
  language: hi
  text: 'उसने उनकी उपज भस्म करनेवाली टिड्डी[a] को दे दी,

    और उनकी मेहनत का फल[b] झुंड में आनेवाली टिड्डी को।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “फसल चट करनेवाले कीट को”; חָסִיל संभवतः फसल नष्ट करनेवाले किसी कीट का व्यापक नाम है, जिसे विपत्ति के वर्णनों में अक्सर एक प्रकार की टिड्डी समझा जाता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप में, “उनकी मेहनत”; इब्रानी शब्द मेहनत स्वयं या उससे प्राप्त फल—दोनों को सूचित कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: उसने ... दे दी
  rationale: נתן का सामान्य अर्थ ‘देना’ है। न्याय के इस प्रसंग में इसका भाव ‘हवाले कर देना’ हो सकता है, पर ‘दे दी’ इब्रानी अभिव्यक्ति की सादगी बनाए रखता है।
- source_word: לֶחָסִיל
  choice: भस्म करनेवाली टिड्डी
  rationale: חָסִיל फसल नष्ट करनेवाले कीट को सूचित करता है और विपत्ति-वर्णनों में प्रायः टिड्डी की एक किस्म माना जाता है। यह चुनाव विनाशकारी भाव व्यक्त करता है, पर सटीक प्राणी-वर्ग का अनावश्यक दावा नहीं करता।
- source_word: יְבוּלָם
  choice: उनकी उपज
  rationale: יְבוּל भूमि की पैदावार या उपज है। ‘उपज’ आधुनिक हिंदी में सहज और पर्याप्त व्यापक है।
- source_word: וִיגִיעָם
  choice: उनकी मेहनत का फल
  rationale: יְגִיעַ मेहनत, परिश्रम, अथवा उससे प्राप्त फल को दर्शा सकता है। यहाँ ‘उपज’ के समानांतर विनष्ट होनेवाली वस्तु अभिप्रेत होने के कारण ‘मेहनत का फल’ प्रसंग में स्वाभाविक है; पादटिप्पणी शाब्दिक विकल्प सुरक्षित रखती है।
- source_word: לָאַרְבֶּה
  choice: दल बाँधकर आनेवाली टिड्डी
  rationale: אַרְבֶּה टिड्डी का सामान्य शब्द है। पहले कीट-शब्द से अंतर दिखाने और टिड्डियों के झुंड में आने की विशेषता व्यक्त करने के लिए यह रूप चुना गया है, बिना सटीक जैविक पहचान का दावा किए।
