  text: He drove out nations before them and allotted them an inheritance by measuring line[b][a]; he settled the tribes of Israel in their tents.
translation:
  language: hi
  text: 'उसने उनके सामने से जातियों को निकाल दिया

    और नापने की डोरी से उन्हें विरासत का भाग बाँट दिया[a];

    उसने इस्राएल के गोत्रों को उनके तंबुओं[b] में बसाया।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “नापने की डोरी से उन्हें विरासत दी”; इब्रानी मुहावरा भूमि नापने और उसे विरासत के भागों में बाँटने—दोनों भावों को समेटता है।
    reason: lexical_alternative
  - marker: b
    text: या, “उनके निवास-स्थानों में”; मूल शब्द का शाब्दिक अर्थ “तंबू” है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְגָרֶשׁ מִפְּנֵיהֶם גּוֹיִם
  choice: उसने उनके सामने से जातियों को निकाल दिया
  rationale: גרש का अर्थ बलपूर्वक निकालना या खदेड़ना है। ‘सामने से’ מִפְּנֵיהֶם की स्थान-संबंधी छवि को बनाए रखता है, और ‘जातियाँ’ इस प्रसंग में גּוֹיִם का स्वाभाविक हिन्दी रूप है।
- source_word: וַיַּפִּילֵם בְּחֶבֶל נַחֲלָה
  choice: नापने की डोरी से उनकी भूमि विरासत के रूप में बाँट दी
  rationale: यह पदबंध भूमि को नापकर विरासत के हिस्सों में बाँटने की प्राचीन रीति दर्शाता है। प्रत्यय ‘उन्हें’ का संबंध निकाली गई जातियों से है; हिन्दी में ‘उनकी भूमि’ कहने से आशय स्वाभाविक रूप से स्पष्ट होता है, बिना लाक्षणिक भाव खोए।
- source_word: וַיַּשְׁכֵּן
  choice: बसाया
  rationale: שׁכן का हिफ़ील रूप ‘रहने के लिए स्थापित करना’ बताता है; ‘बसाया’ उसका संक्षिप्त और स्वाभाविक हिन्दी रूप है।
- source_word: בְּאָהֳלֵיהֶם
  choice: उनके तंबुओं में
  rationale: אֹהֶל का ठोस अर्थ ‘तंबू’ है। सर्वनाम को बनाए रखने से मूल की संदर्भगत बनावट और संभावित अस्पष्टता सुरक्षित रहती है।
- source_word: שִׁבְטֵי יִשְׂרָאֵל
  choice: इस्राएल के गोत्रों
  rationale: यह पदबंध आधुनिक बाइबलीय हिन्दी में स्पष्ट और प्रतिष्ठित है।
theological_decisions:
- issue: देश-विजय और बसाए जाने में कर्ता
  choice: तीनों क्रियाओं का कर्ता परमेश्वर ही बना रहता है
  alternative: इस्राएल को प्रत्यक्ष कर्ता बनाना
  rationale: भजन के प्रसंग और एकवचन क्रियाओं के अनुसार परमेश्वर ही जातियों को निकालता, भूमि बाँटता और इस्राएल के गोत्रों को बसाता है। अनुवाद इससे आगे कोई धर्मसैद्धांतिक निष्कर्ष नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। काव्यात्मक समानांतरता के लिए पद को तीन पंक्तियों में रखा गया है। ‘विरासत’ भूमि के स्थायी निज भाग का भाव देती है, जबकि ‘नापने की डोरी’ मूल की ठोस छवि सुरक्षित रखती है।
