source:
  edition: WLC
  text: שָׁמַ֣ע אֱ֭לֹהִים וַֽ/יִּתְעַבָּ֑ר וַ/יִּמְאַ֥ס מְ֝אֹ֗ד בְּ/יִשְׂרָאֵֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/059.yaml
  text: God heard and was furious[b][a], and he utterly rejected Israel.
translation:
  language: hi
  text: परमेश्वर ने सुना और वह क्रोध से भड़क उठा[a]; उसने इस्राएल को पूरी तरह ठुकरा दिया[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “क्रोध से भर गया।” इब्रानी क्रिया क्रोधित हो उठने या रोष से भर जाने का भाव व्यक्त कर सकती है।
    reason: lexical_alternative
  - marker: b
    text: या, “तुच्छ जाना” अथवा “अस्वीकार कर दिया।”
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁמַע
  choice: सुना
  rationale: काल रूप में प्रयुक्त इस क्रिया का सामान्य अर्थ ‘सुनना’ है; यहाँ यह इस्राएल के आचरण पर परमेश्वर की प्रतिक्रिया का आरम्भ बताती है।
- source_word: אֱלֹהִים
  choice: परमेश्वर
  rationale: रूप की दृष्टि से यह शब्द बहुवचन है, पर यहाँ एकवचन क्रिया-संदर्भ में इस्राएल के परमेश्वर को सूचित करता है।
- source_word: וַיִּתְעַבָּר
  choice: क्रोध से भड़क उठा
  rationale: Hitpael रूप यहाँ तीव्र क्रोध में आने का भाव देता है। यह हिन्दी प्रयोग मूल की प्रबल भावात्मकता बनाए रखता है और कारण को अनावश्यक रूप से स्पष्ट नहीं करता।
- source_word: וַיִּמְאַס
  choice: ठुकरा दिया
  rationale: מָאַס का अर्थ अस्वीकार करना, ठुकराना या तुच्छ जानना हो सकता है। ‘ठुकरा दिया’ यहाँ न्याय और सम्बन्ध-विच्छेद के क्रियात्मक भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: מְאֹד
  choice: पूरी तरह
  rationale: यह क्रियाविशेषण ठुकराने की तीव्रता बढ़ाता है; ‘पूरी तरह’ हिन्दी में ‘अत्यन्त/सर्वथा’ के बल को सहजता से व्यक्त करता है।
- source_word: בְּיִשְׂרָאֵל
  choice: इस्राएल को
  rationale: מָאַס के साथ בְ उस व्यक्ति या समुदाय को चिह्नित करता है जिसकी ओर अस्वीकार निर्देशित है; हिन्दी में कर्मकारक ‘इस्राएल को’ स्वाभाविक है।
theological_decisions:
- issue: परमेश्वर के क्रोध और अस्वीकार के लिए मानवीय भाव-सदृश भाषा
  choice: ‘क्रोध से भड़क उठा’ और ‘पूरी तरह ठुकरा दिया’ जैसी प्रबल भाषा को बनाए रखा गया।
  alternative: इसे नरम करके ‘अप्रसन्न हुआ’ और ‘अनुग्रह न किया’ कहा जा सकता था।
  rationale: इब्रानी पाठ वाचा-संबंधी न्याय की तीव्र भाषा प्रयोग करता है। पाठ में उपस्थित धर्मवैचारिक तनाव को कम किए बिना उसी रूप में व्यक्त करना उचित है।
translation_notes:
  register: आधुनिक मानक हिन्दी का स्वाभाविक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रूप। ‘भड़क उठा’ मूल क्रिया की तीव्रता रखता है, जबकि ‘पूरी तरह ठुकरा दिया’ מְאֹד की प्रबलता और מָאַס के अस्वीकारात्मक बल दोनों को व्यक्त करता है।
