  register: आधुनिक मानक हिंदी में गरिमापूर्ण, पठनीय बाइबलीय शैली अपनाई गई है। ‘याकूब में/इस्राएल में’ की समानांतर काव्य-रचना सुरक्षित रखी गई है। ‘साक्षी-वचन’ अपेक्षाकृत औपचारिक है, पर עֵדוּת की साक्षी और वाचा-विधान संबंधी अर्थ-सीमा को केवल ‘गवाही’ या ‘आदेश’ तक संकुचित नहीं करता।
