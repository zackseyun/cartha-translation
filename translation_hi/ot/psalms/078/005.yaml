base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/005.yaml
  text: For he established a testimony in Jacob and set a law in Israel[c][b][a], which he commanded our fathers to make known to their children.
translation:
  language: hi
  text: उसने याकूब में एक साक्ष्य ठहराया और इस्राएल में व्यवस्था[a] रखी; उसने हमारे पितरों[b] को आज्ञा दी कि वे इन्हें अपनी संतानों[c] को ज्ञात कराएँ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या “शिक्षा”; इब्रानी: तोराह।'
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में शाब्दिक अर्थ “हमारे पिता” है; यहाँ पिछली पीढ़ियों के पिताओं का संकेत है।
    reason: lexical_alternative
  - marker: c
    text: इब्रानी में शाब्दिक अर्थ “उनके पुत्रों” है; इस पीढ़ीगत संदर्भ में इसका अर्थ संतानों या बच्चों को व्यापक रूप से भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקֶם
  choice: ठहराया
  rationale: हिफ़ील रूप का अर्थ किसी वस्तु को स्थिर या स्थापित करना है; ‘ठहराया’ दैवी विधान के संदर्भ में स्वाभाविक और गरिमापूर्ण है।
- source_word: עֵדוּת
  choice: एक साक्षी-वचन
  rationale: यह शब्द साक्षी, गवाही या वाचा-संबंधी विधान का बोध करा सकता है। ‘साक्षी-वचन’ इसके वाचिक और वाचा-संबंधी दोनों पहलुओं को बिना केवल कानूनी आदेश बना देने के सुरक्षित रखता है।
- source_word: בְּיַעֲקֹב
  choice: याकूब में
  rationale: ב का सीधा अर्थ ‘में’ रखा गया है और याकूब को वाचा-समुदाय के सामूहिक नाम के रूप में प्रस्तुत करने वाला काव्यात्मक समानांतर सुरक्षित है।
- source_word: וְתוֹרָה
  choice: और व्यवस्था
  rationale: תורה का अर्थ शिक्षा या व्यवस्था हो सकता है। यहाँ साक्षी-वचन और आज्ञा के साथ प्रयुक्त होने के कारण ‘व्यवस्था’ उसके मानक और वाचा-संबंधी बल को व्यक्त करती है।
- source_word: שָׂם
  choice: स्थापित की
  rationale: क्रिया का मूल अर्थ रखना या स्थापित करना है; यहाँ ‘स्थापित की’ संस्थापन का भाव स्वाभाविक ढंग से देता है।
- source_word: בְּיִשְׂרָאֵל
  choice: इस्राएल में
  rationale: मूल पूर्वसर्ग और ‘याकूब में’ के साथ काव्यात्मक समानांतरता दोनों सुरक्षित रखे गए हैं।
- source_word: אֲשֶׁר צִוָּה
  choice: जिसे उसने ... आज्ञा दी
  rationale: संबंधवाचक खंड को हिंदी वाक्य-विन्यास के अनुसार रखा गया है; यह पहले उल्लिखित साक्षी-वचन और व्यवस्था की विषयवस्तु की ओर संकेत करता है।
- source_word: אֶת אֲבוֹתֵינוּ
  choice: हमारे पितरों को
  rationale: मूल का स्पष्ट पुल्लिंग बहुवचन सुरक्षित है। ‘पितर’ आधुनिक बाइबलीय हिंदी में पूर्वज-पिताओं के लिए संक्षिप्त और गरिमापूर्ण शब्द है।
- source_word: לְהוֹדִיעָם
  choice: कि वे उसे ... बताएँ
  rationale: ידע के हिफ़ील का अर्थ ‘ज्ञात कराना’ है। हिंदी में ‘बताएँ’ स्वाभाविक है। मूल का बहुवचन प्रत्यय संभवतः साक्षी-वचन और व्यवस्था को सामूहिक विषयवस्तु मानता है; हिंदी में एकवचन ‘उसे’ निकटवर्ती ‘व्यवस्था’ तथा समूची दी हुई शिक्षा की ओर सामूहिक संकेत करता है।
- source_word: לִבְנֵיהֶם
  choice: अपने पुत्रों को
  rationale: בנים का शाब्दिक रूप ‘पुत्र’ है। मुख्य पाठ में स्पष्ट पुल्लिंग रूप सुरक्षित रखा गया है, जबकि पादटिप्पणी इसके व्यापक, पीढ़ीगत अर्थ की संभावना बताती है।
theological_decisions:
- issue: वाचा-संबंधी भजन में תּוֹרָה का अनुवाद
  choice: व्यवस्था
  alternative: शिक्षा
  rationale: साक्षी-वचन, आज्ञा और पीढ़ीगत संप्रेषण का संदर्भ इसके मानक वाचा-संबंधी बल को प्रमुख बनाता है; फिर भी ‘शिक्षा’ वास्तविक शब्दार्थ-संभावना है और पादटिप्पणी में दी गई है।
- issue: אֲבוֹתֵינוּ और לִבְנֵיהֶם में लिंग-सूचक संबंधवाची भाषा
  choice: हमारे पितरों ... अपने पुत्रों
  alternative: हमारे पूर्वजों ... अपने बच्चों
  rationale: दोनों इब्रानी संज्ञाएँ रूपतः पुल्लिंग हैं। मुख्य पाठ उस रूप को सुरक्षित रखता है; पुत्रों के मामले में संदर्भ व्यापक संतति को समेट सकता है, इसलिए यह संभावना पादटिप्पणी में स्पष्ट की गई है।
- issue: לְהוֹדִיעָם में बहुवचन कर्म-प्रत्यय का संदर्भ
  choice: उसे ... बताएँ
  alternative: उन्हें ... ज्ञात कराएँ
  rationale: प्रत्यय रूपतः बहुवचन है और संभवतः ‘साक्षी-वचन’ तथा ‘व्यवस्था’ की संयुक्त विषयवस्तु को ग्रहण करता है। स्वाभाविक हिंदी में ‘उसे’ समूची स्थापित शिक्षा को सामूहिक इकाई के रूप में ग्रहण करता है; इससे किसी एक पूर्वपद तक संदर्भ को सिद्धांततः सीमित नहीं किया गया।
