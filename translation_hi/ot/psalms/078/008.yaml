source:
  edition: WLC
  text: וְ/לֹ֤א יִהְי֨וּ כַּ/אֲבוֹתָ֗/ם דּוֹר֮ סוֹרֵ֪ר וּ/מֹ֫רֶ֥ה דּ֭וֹר לֹא הֵכִ֣ין לִבּ֑/וֹ וְ/לֹא נֶאֶמְנָ֖ה אֶת אֵ֣ל רוּחֽ/וֹ׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/008.yaml
  text: and that they should not be like their fathers[a], a stubborn and rebellious generation[b], a generation that did not set its heart aright and whose spirit was not faithful to God.
translation:
  language: hi
  text: और वे अपने पुरखों के समान न हों—एक हठी और विद्रोही पीढ़ी, ऐसी पीढ़ी जिसने अपने हृदय को दृढ़ नहीं किया[a] और जिसकी आत्मा परमेश्वर के प्रति विश्वासयोग्य नहीं रही[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “अपने हृदय को तैयार नहीं किया” अथवा “अपने हृदय को स्थिर नहीं किया।”
    reason: הֵכִין के अर्थ-क्षेत्र में तैयार करना, स्थापित करना और दृढ़ या स्थिर करना सम्मिलित हैं।
  - marker: b
    text: या “जिसकी आत्मा परमेश्वर के साथ स्थिर नहीं रही।”
    reason: נֶאֶמְנָה और אֶת का संयोजन विश्वासयोग्यता के साथ-साथ स्थिरता और ‘के साथ’ का संबंध भी व्यक्त कर सकता है।
lexical_decisions:
- source_word: וְלֹא יִהְיוּ
  choice: और वे ... न हों
  rationale: पिछले पद के उद्देश्यसूचक प्रवाह को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: כַאֲבוֹתָם
  choice: अपने पुरखों के समान
  rationale: यह पूर्वजों की पीढ़ी की ओर संकेत करता है; ‘पुरखे’ सामान्य आधुनिक हिन्दी में पारिवारिक और पीढ़ीगत संबंध स्पष्ट करता है।
- source_word: דּוֹר
  choice: पीढ़ी
  rationale: समकालीन या वंशगत समुदाय के लिए मानक अर्थ है और पद में इसकी पुनरावृत्ति को सुरक्षित रखता है।
- source_word: סוֹרֵר וּמֹרֶה
  choice: हठीली और विद्रोही
  rationale: पहला शब्द अड़ियल, भटकनेवाले प्रतिरोध और दूसरा सक्रिय विद्रोह को व्यक्त करता है।
- source_word: הֵכִין לִבּוֹ
  choice: अपने हृदय को दृढ़ नहीं किया
  rationale: הכין के स्थापित करने, तैयार करने या स्थिर करने के अर्थों में से यहाँ आंतरिक संकल्प की स्थिरता को सुरक्षित रखता है, बिना ‘सीधा’ जैसे नैतिक अर्थ को अनावश्यक रूप से जोड़ने के।
- source_word: לִבּוֹ
  choice: अपने हृदय
  rationale: हिब्रू में हृदय इच्छा, संकल्प और भीतरी प्रवृत्ति का केंद्र है; बाइबलीय रूपक को बनाए रखा गया है।
- source_word: נֶאֶמְנָה
  choice: विश्वासयोग्य नहीं रही
  rationale: अमन धातु का निफ़ाल रूप स्थिरता, भरोसेमंदी और निष्ठा व्यक्त कर सकता है; ‘विश्वासयोग्य’ संबंधपरक निष्ठा को दर्शाता है।
- source_word: אֶת אֵל
  choice: परमेश्वर के प्रति
  rationale: यह संबंध और दिशा दोनों को स्वाभाविक हिन्दी में व्यक्त करता है; ‘के साथ’ भी व्याकरणतः संभव है।
- source_word: רוּחוֹ
  choice: जिसकी आत्मा
  rationale: ‘आत्मा’ व्यक्ति की भीतरी प्रवृत्ति को दर्शाती है और ‘हृदय’ से अलग स्रोत-पद को बनाए रखती है।
theological_decisions:
- issue: ‘हृदय’ और ‘आत्मा’ का मानवशास्त्रीय युग्म
  choice: 'दोनों शब्द अलग रखे गए: ‘हृदय’ और ‘आत्मा’।'
  alternative: दोनों को ‘मन’ या ‘अंतर्मन’ जैसे एक ही शब्द में मिला देना।
  rationale: मूल पाठ दो निकट किंतु भिन्न आंतरिक पदों का प्रयोग करता है; उन्हें अलग रखने से काव्यात्मक और धर्मवैचारिक तनाव सुरक्षित रहता है।
- issue: सामूहिक एकवचन ‘पीढ़ी’
  choice: ‘ऐसी पीढ़ी जिसने अपने हृदय... और जिसकी आत्मा...’
  alternative: बहुवचन में ‘जिन्होंने अपने हृदयों... जिनकी आत्माएँ...’।
  rationale: हिब्रू प्रत्यय एकवचन सामूहिक संज्ञा דּוֹר की ओर लौटते हैं; हिन्दी में भी एकवचन संबंध स्वाभाविक और स्रोत-संगत है।
- issue: परमेश्वर से आत्मा के संबंध का अर्थ
  choice: ‘परमेश्वर के प्रति विश्वासयोग्य’
  alternative: ‘परमेश्वर के साथ स्थिर’।
  rationale: मूल निर्माण निष्ठा अथवा स्थिरता दोनों का भाव दे सकता है; मुख्य पाठ में संबंधपरक निष्ठा ली गई है और वैकल्पिक अर्थ पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘पुरखे’, ‘हठीली’, ‘विद्रोही’, ‘हृदय’ और ‘आत्मा’ काव्यात्मक समानांतरता तथा पीढ़ीगत संदर्भ को बनाए रखते हैं।
