  yaml_path: translation/ot/psalms/078/051.yaml
  text: He struck down every firstborn in Egypt[a], the firstfruits of their vigor in the tents of Ham.
translation:
  language: hi
  text: 'उसने मिस्र में हर पहलौठे को मार डाला,

    हाम के तंबुओं में उनकी जनन-शक्ति की पहली उपज को।[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात उनकी जनन-शक्ति से उत्पन्न पहली संतान; यह इब्रानी मुहावरा पहलौठों को जनन-सामर्थ्य की पहली उपज के रूप में व्यक्त करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּךְ
  choice: उसने ... मार डाला
  rationale: נכה का यह रूप बीती हुई घटना का वर्णन करता है। पहलौठों की मृत्यु के प्रसंग में ‘मार डाला’ क्रिया के घातक परिणाम को स्वाभाविक हिन्दी में स्पष्ट करता है।
- source_word: כָּל בְּכוֹר
  choice: हर पहलौठे
  rationale: כָּל यहाँ समग्रता का वितरणात्मक भाव देता है। ‘हर पहलौठे’ लिंग का ऐसा उल्लेख नहीं जोड़ता जो इब्रानी में स्पष्ट नहीं है।
- source_word: בְּמִצְרַיִם
  choice: मिस्र में
  rationale: ב स्थान सूचित करता है; यह निर्गमन की विपत्ति की ओर संकेत करते हुए सीधा भौगोलिक अनुवाद है।
- source_word: רֵאשִׁית אֹנִים
  choice: उनकी जनन-शक्ति के प्रथम फल
  rationale: यह मुहावरा जनन-सामर्थ्य की पहली उपज, अर्थात पहलौठों, को सूचित करता है। ‘प्रथम फल’ רֵאשִׁית की उपज-संबंधी काव्यात्मक छवि रखता है और ‘जनन-शक्ति’ אֹנִים के प्रजनन-सामर्थ्य वाले आशय को स्पष्ट करता है।
- source_word: בְּאָהֳלֵי חָם
  choice: हाम के तंबुओं में
  rationale: यह हाम के द्वारा मिस्र का काव्यात्मक और वंशावली-संबंधी संकेत है। शाब्दिक बिंब को बनाए रखना पद की समानांतर रचना और धर्मग्रंथीय बनावट को सुरक्षित रखता है।
theological_decisions:
- issue: मिस्र के लिए काव्यात्मक नाम ‘हाम’
  choice: मुख्य पाठ में ‘हाम’ को बनाए रखा गया है।
  alternative: ‘मिस्रियों के निवासों में’ या ‘मिस्र के घरों में’
  rationale: पहली पंक्ति में मिस्र पहले ही स्पष्ट है; दूसरी पंक्ति का ‘हाम के तंबू’ काव्यात्मक और वंशावली-संबंधी गहराई जोड़ता है। इसे व्याख्यात्मक रूप से ‘मिस्र’ कर देना मूल की विशिष्टता मिटा देता।
- issue: רֵאשִׁית אֹנִים का मुहावरेदार अर्थ
  choice: ‘जनन-शक्ति के प्रथम फल’ द्वारा मूल रूपक और प्रजनन-सामर्थ्य का भाव दोनों रखे गए हैं।
  alternative: ‘उनकी शक्ति की पहली संतान’
  rationale: वैकल्पिक अनुवाद अधिक सहज है, पर ‘संतान’ मूल में प्रत्यक्ष नहीं और ‘शक्ति’ से प्रजनन का आशय अस्पष्ट हो सकता है। मुख्य पाठ मूल की तनावपूर्ण काव्यात्मकता को बनाए रखता है और पादटिप्पणी अर्थ खोलती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और काव्यात्मक रखी गई है। ‘पहलौठा’, ‘हाम’ और ‘तंबू’ जैसे परिचित बाइबलीय शब्द मूल के सांस्कृतिक बिंब को सुरक्षित रखते हैं; अपेक्षाकृत असामान्य मुहावरे को पादटिप्पणी में स्पष्ट किया गया है।
