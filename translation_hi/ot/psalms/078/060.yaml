  yaml_path: translation/ot/psalms/078/060.yaml
  text: So he abandoned the tabernacle of Shiloh[b][a], the tent where he dwelt among mankind.
translation:
  language: hi
  text: तब उसने शीलो के निवासस्थान को त्याग दिया—उस तंबू को, जिसे उसने मनुष्यों के बीच स्थापित किया था।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उस तंबू को, जिसमें वह मनुष्यों के बीच वास करता था।”
    reason: שִׁכֵּן को प्रसंगानुसार परमेश्वर के वास के अर्थ में समझने वाला वैकल्पिक अनुवाद।
lexical_decisions:
- source_word: וַיִּטֹּשׁ
  choice: त्याग दिया
  rationale: यह क्रिया किसी को या किसी स्थान को छोड़ देने अथवा त्याग देने का प्रबल भाव व्यक्त करती है; आधुनिक हिन्दी में ‘त्याग दिया’ स्वाभाविक और गरिमापूर्ण है।
- source_word: מִשְׁכַּן
  choice: निवासस्थान
  rationale: मूल शब्द परमेश्वर के निवास अथवा पवित्र डेरे को सूचित करता है। ‘निवासस्थान’ उसके मूल अर्थ को बनाए रखता है और समानांतर पद ‘तंबू’ से भेद भी रहने देता है।
- source_word: שִׁלֹה
  choice: शीलो
  rationale: स्थाननाम का प्रचलित हिन्दी लिप्यंतरण।
- source_word: אֹהֶל
  choice: तंबू
  rationale: यह सामान्यतः तंबू या डेरा है; ‘निवासस्थान’ के साथ काव्यात्मक समानांतरता में अलग शब्द रखना इब्रानी भेद को सुरक्षित रखता है।
- source_word: שִׁכֵּן
  choice: स्थापित किया था
  rationale: पिएल रूप यहाँ तंबू को लोगों के बीच ठहराने या स्थापित करने के अर्थ में स्वाभाविक रूप से समझा जा सकता है। यह रूप के सकर्मक बल को ‘वास करता था’ की अपेक्षा अधिक सीधे व्यक्त करता है।
- source_word: בָּאָדָם
  choice: मनुष्यों के बीच
  rationale: אָדָם यहाँ सामूहिक और सामान्य अर्थ में मानवजाति को दर्शाता है; ‘मनुष्यों के बीच’ आधुनिक हिन्दी में स्पष्ट, समावेशी और स्वाभाविक है।
theological_decisions:
- issue: शִׁכֵּן में स्थापित करने और वास करने के बीच अर्थ-संबंध
  choice: तंबू को मनुष्यों के बीच स्थापित करना
  alternative: वह तंबू जिसमें परमेश्वर मनुष्यों के बीच वास करता था
  rationale: इब्रानी का पिएल रूप सकर्मक अर्थ ‘स्थापित किया/बसाया’ का समर्थन करता है। फिर भी प्रसंग में यह स्थापना परमेश्वर की उपस्थिति और निवास से जुड़ी है; इसलिए प्रचलित निवास-संबंधी समझ को पादटिप्पणी में सुरक्षित रखा गया है।
- issue: אָדָם का सामूहिक अर्थ
  choice: मनुष्यों के बीच
  alternative: मानवजाति के बीच
  rationale: यहाँ किसी एक पुरुष का उल्लेख नहीं, बल्कि मनुष्य समुदाय का सामूहिक उल्लेख है। ‘मनुष्यों’ से यह अर्थ बिना लैंगिक संकीर्णता के स्पष्ट होता है।
translation_notes:
  register: भाषा आधुनिक, काव्यात्मक और गरिमापूर्ण रखी गई है। ‘निवासस्थान’ और ‘तंबू’ द्वारा इब्रानी समानांतरता के दोनों अलग शब्द सुरक्षित हैं; डैश दूसरे पद को पहले पद की व्याख्यात्मक पुनरुक्ति के रूप में स्पष्ट करता है।
