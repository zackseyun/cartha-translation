  text: וַ/יְצַ֣ו שְׁחָקִ֣ים מִ/מָּ֑עַל וְ/דַלְתֵ֖י שָׁמַ֣יִם פָּתָֽח׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/023.yaml
  text: Yet he commanded the clouds above[b][a], and opened the doors of heaven.
translation:
  language: hi
  text: 'फिर भी उसने ऊपर के बादलों को आज्ञा दी[a]

    और आकाश के द्वार खोल दिए[b]।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “ऊपर के आकाशों को आज्ञा दी।”
    reason: lexical_alternative
  - marker: b
    text: या, “आकाश के फाटक।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְצַו
  choice: आज्ञा दी
  rationale: צוה का सामान्य अर्थ ‘आज्ञा देना’ है। यह परमेश्वर के अधिकारपूर्ण कार्य को स्पष्ट रखता है और भूतकालीन काव्य-वर्णन में स्वाभाविक है।
- source_word: שְׁחָקִים
  choice: बादलों
  rationale: שׁחקים का अर्थ ‘बादल’ या ‘ऊपरी आकाश’ हो सकता है। अगले पद में मन्ना बरसाने के संदर्भ में ‘बादल’ ठोस और स्वाभाविक है, जबकि वैकल्पिक अर्थ पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: מִמָּעַל
  choice: ऊपर के
  rationale: यह ऊँचाई या ऊपर स्थित होने का बोध देता है। ‘ऊपर के बादल’ सहज हिन्दी है और मूल की स्थान-संबंधी अभिव्यक्ति को बनाए रखता है।
- source_word: דַלְתֵי
  choice: द्वार
  rationale: דלת का सीधा अर्थ ‘द्वार’ है। बहुवचन रचना ‘आकाश के द्वार’ मूल रूपक और काव्यात्मक गरिमा को बनाए रखती है।
- source_word: שָׁמַיִם
  choice: आकाश
  rationale: इस संदर्भ में שמים दृश्य आकाश और परमेश्वर की ओर से आने वाली वर्षा-सदृश देन—दोनों की काव्यात्मक छवि बनाता है। हिन्दी में ‘आकाश के द्वार’ स्वाभाविक और गरिमापूर्ण है।
- source_word: פָּתָח
  choice: खोल दिए
  rationale: פתח का सामान्य अर्थ ‘खोलना’ है। ‘खोल दिए’ पूर्ण हुए भूतकालीन कार्य को सहज हिन्दी में व्यक्त करता है, बिना अतिरिक्त तीव्रता जोड़े।
- source_word: וַ
  choice: फिर भी
  rationale: वाव अपने आप में ‘और’ भी हो सकता है, पर निकटवर्ती संदर्भ में इस्राएल के अविश्वास के बावजूद परमेश्वर की व्यवस्था का विरोधात्मक संबंध उभरता है। ‘फिर भी’ उस प्रसंगगत तनाव को व्यक्त करता है।
theological_decisions:
- issue: इस्राएल के अविश्वास और परमेश्वर की व्यवस्था के बीच आरंभिक וַ का प्रसंगगत संबंध
  choice: ‘फिर भी’ के रूप में विरोधात्मक अनुवाद
  alternative: ‘और’ या ‘तब’
  rationale: इब्रानी संयोजक व्यापक है, किंतु भजन 78 के प्रवाह में लोगों के अविश्वास के बाद परमेश्वर का प्रबंध एक स्पष्ट विरोध प्रस्तुत करता है। ‘फिर भी’ उस तनाव को सामने लाता है, जबकि शाब्दिक विकल्प पादटिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल किंतु काव्यात्मक शैली रखी गई है। ‘बादल,’ ‘आकाश’ और ‘द्वार’ सामान्य पाठक के लिए स्पष्ट हैं; समानांतर पंक्तियाँ इब्रानी कविता की संरचना को दर्शाती हैं।
