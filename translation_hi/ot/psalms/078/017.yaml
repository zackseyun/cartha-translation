  text: וַ/יּוֹסִ֣יפוּ ע֭וֹד לַ/חֲטֹא ל֑/וֹ לַֽ/מְר֥וֹת עֶ֝לְי֗וֹן בַּ/צִּיָּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/017.yaml
  text: Yet they continued to sin against him[a], rebelling against the Most High in the dry land.
translation:
  language: hi
  text: फिर भी वे उसके विरुद्ध पाप करते ही गए; सूखे प्रदेश में वे परमप्रधान से विद्रोह करते रहे।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “निर्जल भूमि में” अथवा “झुलसे हुए प्रदेश में।” इब्रानी शब्द विशेष रूप से किसी सूखी, निर्जल जगह को दर्शाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיּוֹסִפוּ עוֹד
  choice: फिर भी ... करते ही गए
  rationale: हिफ़ईल क्रिया के साथ עוֹד पाप के लगातार जारी रहने और प्रसंगगत विरोध—दोनों को व्यक्त करता है। यह हिंदी प्रयोग पुनरावृत्ति और हठधर्मिता को स्वाभाविक ढंग से सामने लाता है।
- source_word: לַחֲטֹא לוֹ
  choice: उसके विरुद्ध पाप
  rationale: חטא के साथ ל यहाँ किसी के विरुद्ध पाप करने का भाव देता है; सर्वनाम प्रसंग में परमेश्वर की ओर संकेत करता है।
- source_word: לַמְרוֹת
  choice: से विद्रोह करते रहे
  rationale: מרה का अर्थ विद्रोह करना या अवज्ञाकारी होना है। यह पदबंध उनके पाप का स्वरूप स्पष्ट करता है और मूल के निरंतर भाव को हिंदी में बनाए रखता है।
- source_word: עֶלְיוֹן
  choice: परमप्रधान
  rationale: यह परमेश्वर की सर्वोच्चता बताने वाली उपाधि है। ‘परमप्रधान’ आधुनिक हिंदी बाइबलीय शैली में संक्षिप्त, गरिमापूर्ण और स्पष्ट है।
- source_word: בַּצִּיָּה
  choice: सूखे प्रदेश में
  rationale: צִיָּה विशेष रूप से सूखी, निर्जल या झुलसी हुई भूमि/जगह को दर्शाता है। ‘सूखा प्रदेश’ सामान्य ‘जंगल’ की अपेक्षा मूल शब्द की विशिष्टता अधिक स्पष्ट रखता है।
theological_decisions:
- issue: परमेश्वर की उपाधि עֶלְיוֹן का अनुवाद
  choice: परमप्रधान
  alternative: सर्वोच्च परमेश्वर
  rationale: ‘परमप्रधान’ मूल की संक्षिप्त उपाधि और उसके धर्मवैज्ञानिक भार को बिना व्याख्यात्मक विस्तार के सुरक्षित रखता है।
- issue: לוֹ में सर्वनाम का संदर्भ
  choice: उसके
  alternative: परमेश्वर के
  rationale: प्रसंग में इसका संकेत परमेश्वर की ओर है, किंतु मूल पाठ सर्वनाम ही रखता है; इसलिए हिंदी में भी सर्वनाम बनाए रखा गया है और अनावश्यक स्पष्टकारी नाम नहीं जोड़ा गया।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। अर्धविराम पद की दो निकट जुड़ी क्रियाओं—पाप करते रहना और विद्रोह करना—को स्पष्ट करता है। पाद-टिप्पणी का चिह्न उसी पदबंध के बाद रखा गया है जिससे वह संबंधित है।
