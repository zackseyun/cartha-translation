    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּנְחֵם
  choice: उसने...उनकी अगुवाई की
  rationale: נחה के हिफ़ील रूप और 3mp प्रत्यय का अर्थ ‘उनकी अगुवाई की’ या ‘उन्हें मार्ग दिखाया’ है। ‘अगुवाई की’ परमेश्वर द्वारा दिशा देने के ठोस भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: בֶּעָנָן
  choice: बादल के द्वारा
  rationale: 'यहाँ ב साधन का बोध कराता है: बादल वह माध्यम था जिसके द्वारा उनकी अगुवाई हुई।'
- source_word: יוֹמָם
  choice: दिन में
  rationale: यह क्रियाविशेषणात्मक प्रयोग ‘दिन के समय’ का अर्थ देता है; ‘दिन में’ संक्षिप्त और स्वाभाविक हिन्दी है।
- source_word: וְכָל הַלַּיְלָה
  choice: और रात भर
  rationale: शाब्दिक ‘और सारी रात’ का पूर्ण अवधि वाला भाव ‘रात भर’ में स्वाभाविक रूप से सुरक्षित रहता है।
- source_word: בְּאוֹר אֵשׁ
  choice: आग के प्रकाश के द्वारा
  rationale: यह पदबंध आग से मिलने वाले प्रकाश को व्यक्त करता है। दोनों संज्ञाओं को अलग रखते हुए साधन का भाव भी सुरक्षित रखा गया है।
theological_decisions:
- issue: निर्जन प्रदेश में मार्गदर्शन के चित्रण का स्वरूप
  choice: पद को बादल और आग के द्वारा इस्राएल की ऐतिहासिक अगुवाई के वर्णन के रूप में प्रस्तुत किया गया है।
  alternative: मुख्य पाठ में बादल और आग की प्रतिरूपात्मक या व्यापक धर्मवैज्ञानिक व्याख्या जोड़ना।
  rationale: इब्रानी पाठ स्वयं निर्गमन-कालीन मार्गदर्शन की घटना का वर्णन करता है; अनुवाद में उससे आगे की धर्मवैज्ञानिक व्याख्या नहीं जोड़ी गई।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और काव्यात्मक रूप रखा गया है। ‘अगुवाई की’ और ‘मार्ग दिखाया’ दोनों सम्भव अर्थों को मुख्य पाठ और पादटिप्पणी में प्रस्तुत किया गया है।
