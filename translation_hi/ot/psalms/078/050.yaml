id: PSA.78.50
reference: Psalms 78:50
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: יְפַלֵּ֥ס נָתִ֗יב לְ/אַ֫פּ֥/וֹ לֹא חָשַׂ֣ךְ מִ/מָּ֣וֶת נַפְשָׁ֑/ם וְ֝/חַיָּתָ֗/ם לַ/דֶּ֥בֶר הִסְגִּֽיר־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/050.yaml
  text: He leveled a path for his anger[a]; he did not spare their soul from death[c][b], but gave over their life to the plague.
translation:
  language: hi
  text: उसने अपने क्रोध के लिए मार्ग समतल किया[a]; उसने उनके प्राणों को मृत्यु से नहीं बचाया, बल्कि उनके जीवन को महामारी के हवाले कर दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसने अपने क्रोध के लिए रास्ता बनाया।”
    reason: lexical_alternative
lexical_decisions:
- source_word: יְפַלֵּס נָתִיב
  choice: मार्ग समतल किया
  rationale: 'पिएल क्रिया और ‘मार्ग’ की ठोस काव्यात्मक छवि को बनाए रखता है: क्रोध के आगे बढ़ने के लिए रास्ता तैयार करना।'
- source_word: לְאַפּוֹ
  choice: अपने क्रोध के लिए
  rationale: אַף का शाब्दिक अर्थ ‘नाक’ है, पर यहाँ इसका प्रचलित अर्थ ‘क्रोध’ है; संबंधवाचक प्रत्यय को ‘अपने’ से व्यक्त किया गया है।
- source_word: לֹא חָשַׂךְ מִמָּוֶת נַפְשָׁם
  choice: उसने उनके प्राण को मृत्यु से नहीं बचाया
  rationale: חשׂך מן का अर्थ यहाँ मृत्यु से बचाना अथवा सुरक्षित रखना है। נֶפֶשׁ इस प्रसंग में नश्वर प्राण/जीवन को दर्शाता है, अलग अभौतिक आत्मा को नहीं।
- source_word: וְחַיָּתָם
  choice: उनके जीवन को
  rationale: नपुंसकलिंगी या अभौतिक अर्थ थोपे बिना उनकी जीवित अवस्था/जीवन को व्यक्त करता है और इब्रानी सामूहिक एकवचन के निकट रहता है।
- source_word: לַדֶּבֶר
  choice: महामारी के
  rationale: דֶּבֶר न्याय के प्रसंगों में घातक संक्रामक रोग या महामारी को दर्शाता है; ‘महामारी’ आधुनिक हिन्दी में स्पष्ट है।
- source_word: הִסְגִּיר
  choice: हवाले कर दिया
  rationale: हिफ़ील रूप का अर्थ सौंप देना या अधिकार में दे देना है; यह हिन्दी में सक्रिय और स्वाभाविक अभिव्यक्ति है।
theological_decisions:
- issue: ईश्वरीय न्याय के लिए मानवीकरणयुक्त रूपक
  choice: ‘अपने क्रोध के लिए मार्ग समतल किया’ रूपक को बनाए रखा गया।
  alternative: ‘उसने अपना क्रोध खुलकर बरसाया’
  rationale: मूल इब्रानी क्रोध के लिए रास्ता बनाने की सजीव छवि देता है; इसे बनाए रखना काव्यात्मक तनाव को सुरक्षित रखता है और अतिरिक्त धर्मवैचारिक व्याख्या नहीं जोड़ता।
- issue: נֶפֶשׁ का अर्थ
  choice: ‘प्राण’
  alternative: ‘आत्मा’ या ‘जीवन’
  rationale: यहाँ आशय मृत्यु के अधीन नश्वर जीवन से है। ‘प्राण’ मूल पद की अभिव्यक्ति को कुछ हद तक बनाए रखते हुए अभौतिक आत्मा की अनावश्यक धारणा से बचाता है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सहज मानक हिन्दी। समानांतर पंक्तियों में ‘प्राण’ और ‘जीवन’ का प्रयोग इब्रानी נֶפֶשׁ तथा חַיָּה के निकट अर्थभेद को हल्के रूप में बनाए रखता है।
