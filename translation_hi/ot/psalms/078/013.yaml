  text: בָּ֣קַע יָ֭ם וַ/יַּֽעֲבִירֵ֑/ם וַֽ/יַּצֶּב מַ֥יִם כְּמוֹ נֵֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/013.yaml
  text: He split the sea and made them pass through[c][b][a]; he made the waters stand like a heap.
translation:
  language: hi
  text: उसने समुद्र को चीर दिया और उन्हें पार कराया; उसने जल को ढेर के समान खड़ा कर दिया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בָּקַע
  choice: चीर दिया
  rationale: क्रिया समुद्र को फाड़कर या चीरकर खोलने का सजीव भाव व्यक्त करती है; यह आधुनिक हिन्दी में स्वाभाविक है और मूल बिंब को बनाए रखती है।
- source_word: יָם
  choice: समुद्र
  rationale: यह निर्गमन की परंपरा में पार किए गए समुद्र की ओर संकेत करता है, पर पद स्वयं उसका विशिष्ट नाम नहीं देता।
- source_word: וַיַּעֲבִירֵם
  choice: उन्हें पार कराया
  rationale: 'हिफ़ील रूप का कारणवाचक अर्थ स्पष्ट रखता है: परमेश्वर ने उन्हें पार होने दिया ही नहीं, बल्कि पार कराया।'
- source_word: וַיַּצֶּב
  choice: खड़ा कर दिया
  rationale: यह जल को स्थिर रूप से खड़ा करने या स्थापित करने का कारणवाचक भाव सुरक्षित रखता है।
- source_word: מַיִם
  choice: जल
  rationale: हिन्दी में सामूहिक संज्ञा ‘जल’ काव्यात्मक, स्वाभाविक और गरिमापूर्ण है।
- source_word: כְּמוֹ
  choice: के समान
  rationale: तुलना को स्पष्ट और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: נֵד
  choice: ढेर
  rationale: यह मूल के संचित या ऊपर उठे हुए जल के ठोस बिंब को बनाए रखता है; ‘दीवार’ अधिक व्याख्यात्मक होता।
theological_decisions:
- issue: समुद्र के चमत्कार का बिंब
  choice: ‘जल को ढेर के समान खड़ा कर दिया’ के ठोस काव्यात्मक बिंब को बनाए रखा गया।
  alternative: इसे ‘जल को रोक दिया’ या ‘दीवार के समान खड़ा किया’ कहकर अधिक व्याख्यात्मक बनाना।
  rationale: मूल पाठ घटना की प्रक्रिया नहीं समझाता, बल्कि परमेश्वर के कार्य को सजीव निर्गमन-बिंब में प्रस्तुत करता है; अनुवाद उस तनाव और ठोस भाषा को बिना अतिरिक्त व्याख्या के सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; संक्षिप्त, काव्यात्मक और गरिमापूर्ण शैली। ‘चीर दिया’, ‘पार कराया’ और ‘खड़ा कर दिया’ मूल क्रियाओं की सजीवता तथा कारणवाचकता बनाए रखते हैं।
