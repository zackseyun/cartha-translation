  yaml_path: translation/ot/psalms/078/030.yaml
  text: They had not yet turned away from their craving[a]; their food was still in their mouths.
translation:
  language: hi
  text: वे अपनी लालसा से अभी हटे भी न थे[a]; उनका भोजन अब भी उनके मुँह में ही था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वे अपनी लालसा से अभी अलग भी न हुए थे।” हिब्रू क्रिया का यह अधिक शाब्दिक अनुवाद सम्भव है; मुख्य पाठ सन्दर्भ में सम्भावित भाव व्यक्त करता है कि वे अपनी लालसा से अभी हटे नहीं थे।
    reason: lexical_alternative
lexical_decisions:
- source_word: זָרוּ
  choice: हटे
  rationale: यहाँ זור के साथ מִן का भाव किसी इच्छा से विमुख होने या उससे हटने का है। ‘हटे’ आधुनिक हिन्दी में स्वाभाविक है और सन्दर्भ में उस लालसा का पीछा न छोड़ने का अर्थ देता है।
- source_word: מִתַּאֲוָתָם
  choice: अपनी लालसा से
  rationale: תַּאֲוָה तीव्र इच्छा या लालसा को सूचित करता है। भोजन की लोभी माँग के इस सन्दर्भ में ‘लालसा’ अत्यधिक इच्छा को स्पष्ट करता है, बिना अनावश्यक रूप से यौन अर्थ देने के।
- source_word: עוֹד
  choice: अब भी
  rationale: 'यह क्रिया की जारी अवस्था को दर्शाता है: उसी समय भोजन उनके मुँह में बना हुआ था। पहली पंक्ति में इसी शब्द-भाव को ‘अभी’ से स्वाभाविक रूप में व्यक्त किया गया है।'
- source_word: אָכְלָם
  choice: उनका भोजन
  rationale: אֹכֶל का सीधा अर्थ ‘भोजन’ है; यह स्पष्ट, गरिमापूर्ण और काव्य-सन्दर्भ के अनुकूल है।
- source_word: בְּפִיהֶם
  choice: उनके मुँह में
  rationale: हिब्रू में एकवचन ‘मुँह’ के साथ बहुवचन संबंधसूचक प्रत्यय है। हिन्दी में ‘उनके मुँह में’ सामूहिक अर्थ में स्वाभाविक है और मूल की संख्या-रचना के निकट रहता है।
