base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/061.yaml
  text: He gave his strength to captivity[c][b][a], and his splendor into the hand of the foe.
translation:
  language: hi
  text: उसने अपने सामर्थ्य को बँधुआई में दे दिया[a], और अपनी शोभा को शत्रु के हाथ में दे दिया[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘अपने सामर्थ्य’ से सम्भवतः वाचा के सन्दूक की ओर संकेत है, जो इस्राएल के बीच परमेश्वर के सामर्थ्य का चिह्न था; हिब्रू पाठ उसका नाम सीधे नहीं लेता।
    reason: cultural_note
  - marker: b
    text: ‘शत्रु के हाथ में’ का अर्थ है ‘शत्रु के अधिकार में।’
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: उसने ... दे दिया
  rationale: נתן का सामान्य कथात्मक अर्थ बनाए रखा गया है; प्रसंग में सौंप दिए जाने का भाव स्वतः प्रकट होता है, इसलिए मुख्य पाठ में उसे अधिक स्पष्ट नहीं किया गया।
- source_word: לַשְּׁבִי
  choice: बँधुआई में
  rationale: שְׁבִי यहाँ पकड़े जाकर बंदी अवस्था में पहुँचने का भाव देता है। ‘बँधुआई में’ आधुनिक हिन्दी में स्वाभाविक है और अमूर्त/गंतव्य अर्थ को सुरक्षित रखता है।
- source_word: עֻזּוֹ
  choice: अपने सामर्थ्य को
  rationale: עֹז का अर्थ सामर्थ्य या शक्ति है। ‘सामर्थ्य’ काव्यात्मक गरिमा बनाए रखता है और संभावित संकेत—जैसे वाचा का सन्दूक—को मुख्य पाठ में अनावश्यक रूप से निश्चित नहीं करता।
- source_word: וְתִפְאַרְתּוֹ
  choice: और अपनी शोभा को
  rationale: תִּפְאֶרֶת शोभा, महिमा या वैभव बता सकता है। ‘शोभा’ यहाँ काव्यात्मक और सुबोध है तथा अर्थ की व्यापकता को बनाए रखता है।
- source_word: בְיַד
  choice: के हाथ में
  rationale: हिब्रू मुहावरे का चित्र सुरक्षित रखा गया है; हिन्दी में ‘हाथ में देना’ किसी के अधिकार में सौंपे जाने का स्वाभाविक बोध देता है।
- source_word: צָר
  choice: शत्रु
  rationale: צַר का अर्थ शत्रु, बैरी या विरोधी है। ‘शत्रु’ आधुनिक मानक हिन्दी में स्पष्ट और गरिमापूर्ण है।
theological_decisions:
- issue: ‘उसके सामर्थ्य’ और ‘उसकी शोभा’ को वाचा के सन्दूक, पवित्रस्थान या परमेश्वर की प्रकट उपस्थिति के रूप में स्पष्टतः पहचानना
  choice: मुख्य पाठ में ‘अपने सामर्थ्य’ और ‘अपनी शोभा’ जैसी काव्यात्मक अभिव्यक्तियाँ बनाए रखना
  alternative: ‘सामर्थ्य’ को वाचा का सन्दूक, अथवा दोनों पदों को पवित्रस्थान/परमेश्वर की महिमामय उपस्थिति के स्पष्ट संदर्भ के रूप में अनूदित करना
  rationale: ऐतिहासिक प्रसंग संभवतः वाचा के सन्दूक के शत्रुओं के हाथ पड़ने की ओर संकेत करता है, पर हिब्रू पाठ स्वयं उसका नाम नहीं लेता। इसलिए संकेत और धर्मवैचारिक तनाव को मुख्य पाठ में खुला रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, काव्यात्मक और गरिमापूर्ण शैली रखी गई है। ‘सामर्थ्य’ और ‘शोभा’ मूल की समानांतर काव्यात्मकता तथा संदर्भ की अस्पष्टता को सुरक्षित रखते हैं।
