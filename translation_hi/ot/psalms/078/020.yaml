base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/020.yaml
  text: Look[a], he struck the rock, and waters gushed out, and streams overflowed. Can he also give bread, or provide meat for his people?
translation:
  language: hi
  text: देखो, उसने चट्टान पर प्रहार किया, तो पानी फूट निकला और धाराएँ उमड़ पड़ीं। क्या वह रोटी भी दे सकता है, या अपने लोगों के लिए मांस[a] जुटा सकता है?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “शरीर का मांस”; इब्रानी शब्द का शाब्दिक अर्थ मांस है, और यहाँ संभवतः खाने योग्य मांस अभिप्रेत है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן
  choice: देखो
  rationale: यह प्रत्यक्ष और ज्ञात घटना की ओर जोर देकर ध्यान खींचता है; आधुनिक हिन्दी में स्वाभाविक है।
- source_word: הִכָּה צוּר
  choice: उसने चट्टान पर प्रहार किया
  rationale: विशिष्ट मरुभूमि-घटना का संकेत रखते हुए क्रिया का बल सुरक्षित रहता है।
- source_word: וַיָּז֣וּבוּ מַיִם
  choice: पानी फूट निकला
  rationale: चट्टान से पानी के प्रचुर और सजीव रूप से निकलने का भाव व्यक्त करता है।
- source_word: וּנְחָלִים יִשְׁטֹפוּ
  choice: और धाराएँ उमड़ पड़ीं
  rationale: बहती जलधाराओं की प्रचुर, वेगपूर्ण गति को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: הֲגַם לֶחֶם יוּכַל תֵּת
  choice: क्या वह रोटी भी दे सकता है
  rationale: प्रश्नवाचक अविश्वास और גם के ‘भी’ वाले विस्तार को सुरक्षित रखता है।
- source_word: אִם יָכִין
  choice: या ... जुटा सकता है
  rationale: यहाँ אִם दूसरे वैकल्पिक प्रश्नांश को जोड़ता है; יכין का आशय लोगों के लिए भोजन उपलब्ध कराने से है।
- source_word: שְׁאֵר
  choice: मांस
  rationale: शब्द का मूल अर्थ देह/मांस है, पर यहाँ खाने योग्य मांस अभिप्रेत है।
- source_word: לְעַמּוֹ
  choice: अपने लोगों के लिए
  rationale: इस ऐतिहासिक वाचा-संदर्भ में עם इस्राएल को परमेश्वर के लोगों के रूप में दर्शाता है।
theological_decisions:
- issue: इस्राएल के संदेह का आलंकारिक प्रश्न
  choice: अंतिम दोनों उपवाक्यों को परमेश्वर की भोजन देने की सामर्थ्य पर संदेह जताने वाले प्रश्न के रूप में प्रस्तुत किया
  alternative: उन्हें सपाट कथनों के रूप में प्रस्तुत करना
  rationale: प्रश्नवाचक अव्यय और भजन का निकट संदर्भ लोगों के अविश्वासपूर्ण प्रश्न का समर्थन करते हैं; अनुवाद उस तनाव को बिना व्याख्यात्मक समाधान के बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण और मौखिक रूप से स्पष्ट पद। ‘देखो’ ध्यानाकर्षक बल रखता है; ‘फूट निकला’ और ‘उमड़ पड़ीं’ काव्यात्मक चित्र को स्वाभाविक ढंग से व्यक्त करते हैं।
