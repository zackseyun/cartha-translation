    reason: cultural_note
lexical_decisions:
- source_word: אֲשֶׁר
  choice: जब
  rationale: पद 42–43 के संदर्भ में यह संबंधवाचक अव्यय परमेश्वर के कार्यों को स्मरण करने की विषयवस्तु आरंभ करता है; हिन्दी में कालवाचक ‘जब’ स्वाभाविक है।
- source_word: שָׂם
  choice: दिखाए / किए
  rationale: मूल क्रिया का आधारभूत अर्थ ‘रखना/स्थापित करना’ है, पर चिन्हों और अद्भुत कामों के साथ हिन्दी में एक ही शाब्दिक क्रिया अस्वाभाविक होगी। ‘दिखाए’ और ‘किए’ स्थान में उन्हें प्रकट/घटित करने का भाव देते हैं, बिना ‘चमत्कार’ कहकर अधिक व्याख्या जोड़े।
- source_word: בְּמִצְרַיִם
  choice: मिस्र में
  rationale: בְ यहाँ स्थान सूचित करता है; ‘मिस्र के विरुद्ध’ मूल में स्पष्ट निहित विरोधात्मक अर्थ जोड़ देता।
- source_word: אֹתוֹתָיו
  choice: अपने चिन्ह
  rationale: ‘चिन्ह’ אוֹת के संकेतात्मक अर्थ को बनाए रखता और अगले מוֹפֵת से भेद सुरक्षित रखता है।
- source_word: וּמוֹפְתָיו
  choice: अपने अद्भुत काम
  rationale: ‘अद्भुत काम’ सामान्य आधुनिक हिन्दी में स्वाभाविक है और ‘चिन्ह’ से अलग आश्चर्यजनक दैवी कृत्यों का भाव व्यक्त करता है।
- source_word: בִּשְׂדֵה
  choice: के मैदानों में
  rationale: यद्यपि इब्रानी रूप एकवचन है, स्थान-नाम के साथ यह आसपास के खुले क्षेत्र या भूभाग को सूचित करता है; हिन्दी में बहुवचन ‘मैदानों’ अधिक स्वाभाविक है।
- source_word: צֹעַן
  choice: सोअन
  rationale: इब्रानी स्थान-नाम का देवनागरी लिप्यंतरण किया गया है; बाद की पहचान ‘तानिस’ को टिप्पणी में रखा गया है।
theological_decisions: []
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘चिन्ह’ और ‘अद्भुत काम’ मूल के दो अलग शब्दों का भेद बनाए रखते हैं। टिप्पणी-चिह्न [a] ‘मिस्र’ के बाद रखा गया है, यद्यपि टिप्पणी विशेष रूप से इसी पद में आगे आने वाले सोअन की पहचान समझाती है।
