  yaml_path: translation/ot/psalms/078/058.yaml
  text: They provoked him to anger with their high places[c][b][a], and with their carved images they made him jealous.
translation:
  language: hi
  text: उन्होंने अपने ऊँचे स्थानों[a] से उसे क्रोधित किया, और अपनी तराशी हुई मूर्तियों से उसे ईर्ष्या दिलाई[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ऊँचे स्थान’ स्थानीय उपासना-स्थल थे, जो प्रायः अनुचित उपासना और मूर्तिपूजा से जुड़े होते थे।
    reason: cultural_note
  - marker: b
    text: या, “उसे ईर्ष्या करने को उकसाया।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּכְעִיסוּהוּ
  choice: उन्होंने ... उसे क्रोध दिलाया
  rationale: 'כעס के हिफ़ील रूप का कारक भाव सुरक्षित रहता है: उन्होंने उसे क्रोधित किया या उसके क्रोध को भड़काया।'
- source_word: בְּבָמוֹתָם
  choice: अपने ऊँचे स्थानों से
  rationale: במות स्थानीय उपासना-स्थलों का तकनीकी पद है; प्रसंग में वे अनुचित उपासना और मूर्तिपूजा से जुड़े हैं। करणवाचक ב को ‘से’ से व्यक्त किया गया है।
- source_word: וּבִפְסִילֵיהֶם
  choice: और अपनी खुदी हुई मूर्तियों से
  rationale: פסילים तराशकर बनाई गई उपासना-मूर्तियों को दर्शाता है। ‘खुदी हुई मूर्तियाँ’ उनके निर्मित और मूर्तिपूजक स्वरूप को स्पष्ट रखता है।
- source_word: יַקְנִיאוּהוּ
  choice: उसे जलन दिलाई
  rationale: קנא के हिफ़ील का अर्थ ‘जलन दिलाना/ईर्ष्या भड़काना’ है। यह अनन्य वाचा-संबंध के उल्लंघन पर परमेश्वर की जलन का तनाव बनाए रखता है।
theological_decisions:
- issue: परमेश्वर के लिए जलन/ईर्ष्या की भाषा
  choice: उसे जलन दिलाई
  alternative: उसे ईर्ष्या दिलाई; उसकी जलन भड़काई
  rationale: मूल में קנא स्पष्ट रूप से वाचागत जलन व्यक्त करता है। इसे केवल क्रोध या उत्साह में बदल देने से समानांतर पंक्तियों का भेद और मूल का धार्मिक तनाव कम हो जाता।
translation_notes:
  register: आधुनिक मानक हिंदी में सरल, गरिमापूर्ण काव्यात्मक गद्य रखा गया है। ‘ऊँचे स्थान’ बाइबलीय सांस्कृतिक पद को सुरक्षित रखता है और पादटिप्पणी उसे स्पष्ट करती है। ‘जलन’ सामान्य पाठक के लिए ‘ईर्ष्या’ से अधिक स्वाभाविक है, जबकि पादटिप्पणी कारक क्रिया का वैकल्पिक रूप देती है।
