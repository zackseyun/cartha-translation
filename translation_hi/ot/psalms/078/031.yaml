source:
  edition: WLC
  text: וְ/אַ֤ף אֱלֹהִ֨ים עָ֘לָ֤ה בָ/הֶ֗ם וַֽ֭/יַּהֲרֹג בְּ/מִשְׁמַנֵּי/הֶ֑ם וּ/בַחוּרֵ֖י יִשְׂרָאֵ֣ל הִכְרִֽיעַ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/031.yaml
  text: Then the anger of God rose against them[a], and he killed the stoutest among them; he struck down the young men of Israel.
translation:
  language: hi
  text: तब परमेश्वर का क्रोध उन पर भड़क उठा, और उसने उनके हृष्ट-पुष्ट लोगों को मार डाला; उसने इस्राएल के जवानों को धराशायी कर दिया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאַף אֱלֹהִים
  choice: तब परमेश्वर का क्रोध
  rationale: אַף यहाँ शाब्दिक ‘नाक’ नहीं, बल्कि क्रोध का मुहावरा है। आरंभिक וְ कथा की अगली घटना को दर्शाता है, इसलिए ‘तब’ स्वाभाविक है।
- source_word: עָלָה בָהֶם
  choice: उन पर भड़क उठा
  rationale: עָלָה के ‘ऊपर उठने’ के बिंब को हिंदी में क्रोध के लिए प्रचलित ‘भड़क उठा’ से व्यक्त किया गया है; בָהֶם का विरोधात्मक लक्ष्य ‘उन पर’ है।
- source_word: וַיַּהֲרֹג
  choice: उसने ... मार डाला
  rationale: הרג की सीधी और प्रबल क्रिया को आधुनिक, स्पष्ट हिंदी में व्यक्त करता है।
- source_word: בְּמִשְׁמַנֵּיהֶם
  choice: उनके हृष्ट-पुष्ट लोगों को
  rationale: शब्द मूलतः उनके ‘मोटे/पुष्ट जनों’ को सूचित करता है। ‘हृष्ट-पुष्ट’ शारीरिक पुष्टता और सामर्थ्य दोनों की संभावित छाया बचाता है, बिना अर्थ को केवल ‘सबसे बलवान’ तक सीमित किए।
- source_word: וּבַחוּרֵי יִשְׂרָאֵל
  choice: इस्राएल के जवानों को
  rationale: בָּחוּר युवावस्था के उत्कर्ष में स्थित पुरुष को दर्शाता है; ‘जवान’ संक्षिप्त, स्वाभाविक और काव्यात्मक है।
- source_word: הִכְרִיעַ
  choice: धराशायी कर दिया
  rationale: כרע के हिफ़ील रूप में किसी को झुकाने या गिराने का भाव है। ‘धराशायी कर दिया’ समानांतर पंक्ति में मृत्युजनक पराजय का बिंब बनाए रखता है।
theological_decisions:
- issue: ईश्वरीय क्रोध का मानवीय-बिंबात्मक वर्णन
  choice: परमेश्वर का क्रोध उन पर भड़क उठा
  alternative: परमेश्वर उन पर क्रोधित हुआ
  rationale: संज्ञा ‘क्रोध’ और उसके उठने के मूल बिंब को यथासंभव बनाए रखा गया है; इसे केवल परमेश्वर की मनोदशा बताने वाले सपाट कथन में नहीं बदला गया।
- issue: מִשְׁמַנֵּיהֶם का आशय
  choice: उनके हृष्ट-पुष्ट लोगों को
  alternative: उनके सबसे बलवान लोगों को
  rationale: इब्रानी शब्द का ठोस अर्थ पुष्ट या मोटे लोगों की ओर संकेत करता है और संदर्भ में श्रेष्ठ/बलवान लोगों का भाव हो सकता है। ‘हृष्ट-पुष्ट’ इस अर्थ-तनाव को ‘सबसे बलवान’ की अपेक्षा अधिक सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक मानक हिंदी, गरिमापूर्ण और काव्यात्मक है। ‘हृष्ट-पुष्ट’ मूल शब्द की देहगत पुष्टता को सुरक्षित रखता है, और ‘धराशायी’ दूसरे अर्धांश के गिरा देने वाले बिंब को व्यक्त करता है।
