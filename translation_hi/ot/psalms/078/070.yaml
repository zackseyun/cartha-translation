source:
  edition: WLC
  text: וַ֭/יִּבְחַר בְּ/דָוִ֣ד עַבְדּ֑/וֹ וַ֝/יִּקָּחֵ֗/הוּ מִֽ/מִּכְלְאֹ֥ת צֹֽאן׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/070.yaml
  text: He chose David his servant and took him from the sheepfolds[a].
translation:
  language: hi
  text: 'उसने अपने सेवक दाऊद को चुना

    और उसे भेड़ों के बाड़ों[a] से ले लिया।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “बाड़ों” अथवा “घेरों” से।
    reason: मִכְלְאֹת का अर्थ पशुओं के बाड़े या घेरे भी हो सकता है; צֹאן छोटे पालतू पशुओं, विशेषकर भेड़-बकरियों, के लिए प्रयुक्त हो सकता है।
lexical_decisions:
- source_word: וַיִּבְחַר
  choice: उसने...चुना
  rationale: בחר के कालगत कथात्मक रूप को स्वाभाविक हिन्दी भूतकाल में व्यक्त किया गया है; इससे चुनने का सीधा अर्थ बना रहता है और कोई अतिरिक्त धर्मवैज्ञानिक व्याख्या नहीं जुड़ती।
- source_word: בְּדָוִד
  choice: दाऊद को
  rationale: व्यक्तिनाम को हिन्दी बाइबलीय परंपरा के प्रचलित रूप में रखा गया है; בְ यहाँ क्रिया בחר के कर्म को चिह्नित करता है, इसलिए हिन्दी में ‘को’ स्वाभाविक है।
- source_word: עַבְדּוֹ
  choice: अपने सेवक
  rationale: इस प्रसंग में עבד दाऊद का परमेश्वर से संबंध बताने वाली सम्मानसूचक भूमिका है; ‘सेवक’ स्वामित्व और सेवा दोनों को व्यक्त करता है, जबकि ‘दास’ यहाँ अनावश्यक रूप से बंधुआ स्थिति पर बल दे सकता है।
- source_word: וַיִּקָּחֵהוּ
  choice: और उसे...ले आया
  rationale: לקח का मूल अर्थ ‘लेना’ है। प्रसंग में दाऊद को पशुपालन के स्थान से नई भूमिका में बुलाकर लाने की गति निहित है; ‘ले आया’ आधुनिक हिन्दी में स्वाभाविक है और अगले पद की दिशा के अनुरूप है।
- source_word: מִמִּכְלְאֹת צֹאן
  choice: भेड़-बाड़ों से
  rationale: מִכְלְאֹת पशुओं के घेरे या बाड़े हैं और צֹאן छोटे पालतू पशुओं का झुंड है। संयुक्त पद के लिए ‘भेड़-बाड़े’ संक्षिप्त, स्पष्ट और ग्रामीण-पशुपालकीय संदर्भ के अनुकूल है; व्यापक अर्थ की संभावना पादटिप्पणी में रखी गई है।
theological_decisions:
- issue: परमेश्वर के संबंध में दाऊद की עבד स्थिति
  choice: अपने सेवक
  alternative: अपने दास
  rationale: पद दाऊद के परमेश्वर के अधीन होकर उसकी सेवा करने और उससे संबंधित होने को व्यक्त करता है, पर बंधुआपन को प्रमुख नहीं बनाता। इसलिए सम्मानसूचक और प्रसंगानुकूल ‘सेवक’ चुना गया है।
translation_notes:
  register: भाषा आधुनिक, सरल और गरिमापूर्ण रखी गई है। काव्य-पंक्ति विभाजन ने इब्रानी के दो समानांतर क्रियात्मक खंडों को स्पष्ट किया है। ‘भेड़-बाड़ा’ सामान्य पाठक के लिए दृश्यात्मक है, जबकि स्रोत की व्यापक शब्दार्थ-संभावना पादटिप्पणी में सुरक्षित है।
