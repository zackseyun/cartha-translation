  yaml_path: translation/ot/psalms/078/037.yaml
  text: Their heart was not steadfast with him[b][a], and they were not faithful to his covenant.
translation:
  language: hi
  text: 'उनका हृदय उसके साथ स्थिर नहीं था,

    और वे उसकी वाचा के प्रति निष्ठावान नहीं थे।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לִבָּם
  choice: उनका हृदय
  rationale: इब्रानी में एकवचन संज्ञा के साथ बहुवचन संबंधसूचक प्रत्यय है; यह इस्राएल के सामूहिक अंतर्मन और इच्छा को दर्शाता है, इसलिए एकवचन ‘उनका हृदय’ सुरक्षित रखा गया है।
- source_word: נָכוֹן
  choice: दृढ़
  rationale: यहाँ शब्द हृदय की स्थिरता और भरोसेमंद निष्ठा को व्यक्त करता है। ‘दृढ़’ आधुनिक हिन्दी में स्वाभाविक है और ‘स्थापित’ की अपेक्षा संदर्भगत अर्थ को अधिक स्पष्ट करता है।
- source_word: עִמּוֹ
  choice: उसके प्रति
  rationale: मूल अर्थ ‘उसके साथ’ है, पर हृदय की मनोवृत्ति के संदर्भ में हिन्दी का ‘उसके प्रति’ संबंधपरक अभिमुखता को अधिक स्वाभाविक ढंग से व्यक्त करता है।
- source_word: נֶאֶמְנוּ
  choice: विश्वासयोग्य नहीं रहे
  rationale: निफ़अल रूप यहाँ भरोसेमंद और निष्ठावान बने रहने का भाव देता है। वाचा के संदर्भ में ‘विश्वासयोग्य’ नैतिक और संबंधपरक निष्ठा को व्यक्त करता है।
- source_word: בִּבְרִיתוֹ
  choice: उसकी वाचा के प्रति
  rationale: इब्रानी में पूर्वसर्ग का शाब्दिक अर्थ ‘में’ है, किंतु हिन्दी में ‘विश्वासयोग्य’ के साथ ‘के प्रति’ स्वाभाविक है और वाचा-संबंधी निष्ठा को ठीक प्रकार व्यक्त करता है।
theological_decisions:
- issue: वाचा के प्रति निष्ठा
  choice: पद इस्राएल के अस्थिर अंतर्मन और परमेश्वर की वाचा के प्रति उसकी अविश्वसनीयता का वर्णन करता है।
  alternative: इसे अधिक शाब्दिक रूप में ‘वे उसकी वाचा में स्थिर नहीं थे’ कहा जा सकता है।
  rationale: दोनों पंक्तियों का समानांतर भाव हृदय की दृढ़ता को वाचा-संबंधी निष्ठा से जोड़ता है। ‘विश्वासयोग्य नहीं रहे’ इस संबंधपरक और नैतिक भाव को बनाए रखता है, बिना बाद की किसी विशिष्ट सैद्धांतिक धारणा को आरोपित किए।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और काव्यात्मक समानांतरता को बनाए रखने वाला रूप। ‘वाचा’ बाइबिलीय संदर्भ में प्रचलित और अर्थ-सटीक शब्द है।
