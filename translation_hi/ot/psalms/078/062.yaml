  text: וַ/יַּסְגֵּ֣ר לַ/חֶ֣רֶב עַמּ֑/וֹ וּ֝/בְ/נַחֲלָת֗/וֹ הִתְעַבָּֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/062.yaml
  text: He gave his people over to the sword[b][a], and was enraged with his inheritance.
translation:
  language: hi
  text: उसने अपनी प्रजा को तलवार के हवाले कर दिया, और अपनी विरासत पर अत्यन्त क्रोधित हुआ।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּסְגֵּר
  choice: हवाले कर दिया
  rationale: हिफ़ील रूप यहाँ किसी को दूसरे की शक्ति में सौंप देने का अर्थ देता है; ‘हवाले कर दिया’ इस कारक भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: לַחֶרֶב
  choice: तलवार के
  rationale: ‘तलवार’ मूल बिम्ब को बनाए रखती है और यहाँ युद्ध में हिंसक मृत्यु का लाक्षणिक संकेत देती है।
- source_word: עַמּוֹ
  choice: अपनी प्रजा
  rationale: यह परमेश्वर की अपनी वाचा-सम्बन्धी प्रजा को सूचित करता है; हिन्दी में ‘प्रजा’ इस भजन के राजकीय और सामुदायिक सन्दर्भ में स्वाभाविक है।
- source_word: וּבְנַחֲלָתוֹ
  choice: अपनी विरासत पर
  rationale: ‘विरासत’ इस्राएल के लिए प्रयुक्त वाचा-सम्बन्धी पद को सुरक्षित रखती है; בְ को क्रोध के लक्ष्य के रूप में ‘पर’ कहना स्वाभाविक हिन्दी है।
- source_word: הִתְעַבָּר
  choice: अत्यन्त क्रोधित हुआ
  rationale: हित्पाएल रूप प्रबल क्रोध में आने या क्रोध दिखाने को व्यक्त करता है; यह चयन तीव्रता बनाए रखते हुए वर्तमान, गरिमापूर्ण हिन्दी देता है।
theological_decisions:
- issue: इस्राएल के लिए वाचा-सम्बन्धी पदों का अनुवाद
  choice: अपनी प्रजा ... अपनी विरासत
  alternative: अपने लोग ... अपनी धरोहर
  rationale: दोनों अलग पदों को बनाए रखने से यह तनाव सुरक्षित रहता है कि दण्ड पाने वाले फिर भी परमेश्वर की अपनी प्रजा और उसका निज भाग हैं।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और सहज वाक्य। ‘तलवार’ का इब्रानी बिम्ब तथा ‘प्रजा/विरासत’ की वाचा-सम्बन्धी समानान्तरता सुरक्षित रखी गई है।
