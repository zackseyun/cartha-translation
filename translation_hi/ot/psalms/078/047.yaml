lexical_decisions:
- source_word: יַהֲרֹג
  choice: नष्ट किया
  rationale: मूल क्रिया का सामान्य अर्थ ‘मार डालना’ है, पर यहाँ उसके कर्म पौधे हैं; इसलिए आधुनिक हिन्दी में ‘नष्ट किया’ प्रभाव को स्वाभाविक और ठीक ढंग से व्यक्त करता है।
- source_word: בַּבָּרָד
  choice: ओलों से
  rationale: यहाँ ב साधन का बोध कराता है; ‘ओलों से’ विनाश के माध्यम को स्पष्ट और सहज हिन्दी में व्यक्त करता है।
- source_word: גַּפְנָם
  choice: उनकी दाखलताओं
  rationale: एकवचन सामूहिक संज्ञा अंगूर की बेलों को सूचित करती है। ‘दाखलताओं’ से पौधों का अर्थ बना रहता है; ‘दाख की बारियों’ कहने से अर्थ खेती के क्षेत्र की ओर खिसक जाता।
- source_word: וְשִׁקְמוֹתָם
  choice: और उनके गूलर के पेड़ों को
  rationale: यह शब्द सिकमोर अंजीर की जाति के वृक्ष के लिए है। ‘गूलर के पेड़’ हिन्दी पाठकों के लिए परिचित और सहज वृक्ष-संज्ञा है।
- source_word: בַּחֲנָמַל
  choice: पाले से
  rationale: यह दुर्लभ और अनिश्चित संज्ञा है। ओलों के समानांतर फसलों को नष्ट करने वाली मौसमी घटना के रूप में ‘पाला’ एक पुराना और संभव अर्थ है; अन्य प्रस्तावित अर्थ पादटिप्पणी में दिए गए हैं।
