id: PSA.78.6
reference: Psalms 78:6
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: לְמַ֤עַן יֵדְע֨וּ דּ֣וֹר אַ֭חֲרוֹן בָּנִ֣ים יִוָּלֵ֑דוּ יָ֝קֻ֗מוּ וִֽ/יסַפְּר֥וּ לִ/בְנֵי/הֶֽם׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/006.yaml
  text: so that a later generation might know[a], children yet to be born, and might arise and tell their children,
translation:
  language: hi
  text: ताकि आनेवाली पीढ़ी के बच्चे, जो जन्म लेंगे, जानें, उठें और अपने बच्चों को बताएँ,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְמַעַן
  choice: ताकि
  rationale: यह उद्देश्य अथवा अभिप्रेत परिणाम प्रकट करता है; आधुनिक हिन्दी में संक्षिप्त और स्वाभाविक है।
- source_word: יֵדְעוּ
  choice: जाने
  rationale: לְמַעַן के बाद प्रयुक्त अपूर्ण क्रिया अभिप्रेत परिणाम व्यक्त करती है; हिन्दी का संभावनार्थक रूप इसे स्वाभाविक ढंग से रखता है।
- source_word: דּוֹר אַחֲרוֹן
  choice: आनेवाली पीढ़ी
  rationale: यह बाद की अथवा भावी पीढ़ी को सूचित करता है, अनिवार्यतः अंतिम या युगान्तकालीन पीढ़ी को नहीं।
- source_word: בָּנִים יִוָּלֵדוּ
  choice: वे बच्चे भी, जो जन्म लेनेवाले हैं
  rationale: בָּנִים यहाँ वंशजों के लिए सामान्य अर्थ में है और יִוָּלֵדוּ भावी निष्क्रिय अर्थ देता है।
- source_word: יָקֻמוּ
  choice: उठकर
  rationale: קום यहाँ केवल शारीरिक रूप से खड़े होने के बजाय आगे आकर कार्य करने का सजीव भाव देता है।
- source_word: וִיסַפְּרוּ
  choice: यह बताएँ
  rationale: ספר अगली पीढ़ी को बात सुनाने या बताने को व्यक्त करता है; 'यह' पूर्ववर्ती प्रसंग की शिक्षा और कामों की ओर संकेत करता है।
- source_word: לִבְנֵיהֶם
  choice: अपने बच्चों को
  rationale: हिब्रू का पुल्लिंग बहुवचन यहाँ संतान को सामान्य रूप से सूचित करता है; हिन्दी में 'अपने बच्चों' से पीढ़ी-दर-पीढ़ी पारिवारिक संप्रेषण स्पष्ट होता है।
theological_decisions:
- issue: בָּנִים / לִבְנֵיהֶם में लिंगसूचक वंशज-भाषा
  choice: '''बच्चे'' / ''अपने बच्चों'' के रूप में सामान्य अर्थ'
  alternative: '''पुत्र'' / ''अपने पुत्रों'''
  rationale: हिब्रू का पुल्लिंग बहुवचन संतान के लिए प्रतिनिधिक रूप से प्रयुक्त हो सकता है। प्रसंग शिक्षा को अगली पीढ़ियों तक पहुँचाने का है, केवल पुरुष संतानों तक सीमित करने का नहीं।
- issue: דּוֹר אַחֲרוֹן का कालगत अर्थ
  choice: आनेवाली पीढ़ी
  alternative: अंतिम पीढ़ी
  rationale: यह पदबंध बाद की या भावी पीढ़ी को दर्शाता है; पाठ स्वयं इसे युगान्त की अंतिम पीढ़ी तक सीमित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण काव्यात्मक गद्य। दोनों ओर के डैश इब्रानी वाक्य में ‘जन्म लेनेवाले बच्चों’ को ‘आनेवाली पीढ़ी’ के स्पष्टीकरण के रूप में रखते हैं। ‘इसे’ और ‘यह’ पूर्ववर्ती पदों में बताई गई शिक्षा और परमेश्वर के कार्यों को स्वाभाविक रूप से संदर्भित करते हैं।
