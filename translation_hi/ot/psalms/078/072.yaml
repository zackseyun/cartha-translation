  text: So he shepherded them with integrity of heart[b][a], and guided them with the skill of his hands.
translation:
  language: hi
  text: उसने मन की खराई से उनकी चरवाही की[a], और अपने हाथों की कुशलता से उनका मार्गदर्शन किया[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अपने मन की खराई के अनुसार।”
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “अपने हाथों की समझ-बूझ से,” अर्थात् नेतृत्व में व्यावहारिक विवेक और कुशलता से।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּרְעֵם
  choice: उसने ... उनकी चरवाही की
  rationale: רעה की चरवाहे वाली सजीव उपमा को बनाए रखता है; प्रसंग में यह दाऊद के राजकीय नेतृत्व को चरवाही के रूप में प्रस्तुत करता है।
- source_word: כְּתֹם לְבָבוֹ
  choice: मन की खराई से
  rationale: תֹם नैतिक अखंडता, निष्कपटता और खरेपन को व्यक्त करता है। आधुनिक हिन्दी में ‘मन की खराई’ स्वाभाविक है और לֵבָב को केवल भावना तक सीमित नहीं करती।
- source_word: וּבִתְבוּנוֹת כַּפָּיו
  choice: अपने हाथों की कुशलता से
  rationale: תְּבוּנוֹת का मूल अर्थ समझ-बूझ या विवेक है, पर ‘हाथों’ के साथ इसका आशय व्यावहारिक दक्षता है; यह रूपक को सुरक्षित रखते हुए सहज हिन्दी देता है।
- source_word: יַנְחֵם
  choice: उनका मार्गदर्शन किया
  rationale: נחה के हिफ़ील रूप का अर्थ नेतृत्व करना या राह दिखाना है; ‘मार्गदर्शन किया’ बुद्धिमान और उद्देश्यपूर्ण अगुवाई को व्यक्त करता है।
theological_decisions:
- issue: दाऊद के लिए राजकीय चरवाहे की छवि
  choice: मुख्य पाठ में ‘चरवाही’ की स्पष्ट छवि बनाए रखी गई।
  alternative: ‘उसने उनकी देखभाल की’ या ‘उसने उनकी अगुवाई की।’
  rationale: भजन का समापन दाऊद को परमेश्वर द्वारा चुने गए चरवाहे-राजा के रूप में दिखाता है। स्पष्ट चरवाहा-भाषा मूल रूपक और उसके धर्मवैचारिक महत्व को सुरक्षित रखती है, पर इस पद में बाद के मसीही निष्कर्ष नहीं जोड़ती।
- issue: כְּ उपसर्ग का अर्थ
  choice: ‘से’—रीति या भाव को दर्शाने वाला अर्थ।
  alternative: ‘अपने मन की खराई के अनुसार।’
  rationale: यहाँ उपसर्ग चरवाही की रीति बता सकता है, यद्यपि मानक या अनुरूपता का अर्थ भी व्याकरणतः संभव है; वैकल्पिक अर्थ पादटिप्पणी में रखा गया है।
- issue: תְּבוּנוֹת और ‘हाथों’ का संबंध
  choice: व्यावहारिक अर्थ में ‘हाथों की कुशलता।’
  alternative: अधिक शाब्दिक ‘हाथों की समझ-बूझ।’
  rationale: बहुवचन תְּבוּנוֹת समझ, विवेक या दक्षता व्यक्त कर सकता है। ‘हाथों’ के साथ हिन्दी में ‘कुशलता’ आशय को स्वाभाविक रूप से देता है, जबकि शाब्दिक संभावना पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण काव्यात्मक गद्य। ‘चरवाही’ मूल राजकीय-चरवाहा रूपक को बचाती है; ‘मन की खराई’ और ‘हाथों की कुशलता’ सामान्य पाठक के लिए स्पष्ट हैं। सभी पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित हैं।
