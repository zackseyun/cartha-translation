source:
  edition: WLC
  text: וַ/יִּסֹּ֣גוּ וַֽ֭/יִּבְגְּדוּ כַּ/אֲבוֹתָ֑/ם נֶ֝הְפְּכ֗וּ כְּ/קֶ֣שֶׁת רְמִיָּֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/057.yaml
  text: But they turned back and acted treacherously like their fathers[a]; they turned aside like a deceitful bow.
translation:
  language: hi
  text: परन्तु वे अपने पुरखाओं के समान पीछे हट गए और विश्वासघात किया; वे अविश्वसनीय धनुष की तरह मुड़ गए।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “ढीले धनुष” अथवा “दोषपूर्ण धनुष” के समान—अर्थात ऐसा धनुष जिससे ठीक निशाना नहीं लगाया जा सकता।
    reason: רְמִיָּה यहाँ छल के साथ-साथ ढिलाई या दोष के कारण अविश्वसनीय होने का अर्थ भी दे सकता है।
lexical_decisions:
- source_word: וַיִּסֹּגוּ
  choice: पीछे हट गए
  rationale: यह סוּג के पीछे लौटने या पहले मार्ग से हटने के भाव को स्वाभाविक हिन्दी में व्यक्त करता है और बाद की पारिभाषिक धार्मिक शब्दावली नहीं जोड़ता।
- source_word: וַיִּבְגְּדוּ
  choice: विश्वासघात किया
  rationale: בגד में निष्ठाहीनता और छलपूर्ण द्रोह का नैतिक भार है। यह प्रयोग किसी अनुल्लिखित कर्म या वाचा-संबंधी विस्तार को जोड़े बिना उस भार को बनाए रखता है।
- source_word: כַּאֲבוֹתָם
  choice: अपने पुरखाओं के समान
  rationale: शाब्दिक अर्थ ‘अपने पितरों के समान’ है; ‘पुरखाओं’ आधुनिक हिन्दी में पूर्वज पुरुषों का स्वाभाविक और गरिमापूर्ण संकेत देता है।
- source_word: נֶהְפְּכוּ
  choice: मुड़ गए
  rationale: הפך के यहाँ के निष्क्रिय/आत्मवाचक भाव को धनुष के लक्ष्य से विक्षेपित हो जाने के रूपक के साथ संक्षेप और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: כְּקֶשֶׁת רְמִיָּה
  choice: धोखा देनेवाले धनुष के समान
  rationale: קֶשֶׁת ‘धनुष’ है और רְמִיָּה छल, ढिलाई या अविश्वसनीयता का संकेत दे सकता है। मुख्य पाठ में छल का रूपक रखा गया है, जबकि अन्य सम्भव अर्थ पाद-टिप्पणी में दिए गए हैं।
theological_decisions:
- issue: इस्राएल की निष्ठाहीनता में वाचा-संबंधी संकेत
  choice: ‘विश्वासघात किया’ द्वारा नैतिक और संबंधपरक गंभीरता बनाए रखना, पर परमेश्वर या वाचा को स्पष्ट कर्म के रूप में न जोड़ना
  alternative: ‘अविश्वासी रहे’ कहना या ‘परमेश्वर की वाचा तोड़ी’ जैसा विस्तार करना
  rationale: व्यापक प्रसंग वाचा के प्रति निष्ठाहीनता से जुड़ा है, किन्तु इस पद में בגד का कोई स्पष्ट कर्म नहीं दिया गया। इसलिए अनुवाद संकेत को बनाए रखता है, पर उसे व्याख्यात्मक सिद्धान्त-वाक्य में नहीं बदलता।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण काव्यात्मक गद्य रखा गया है। ‘परन्तु’, ‘पुरखाओं’ और ‘विश्वासघात’ सामान्य पाठक के लिए बोधगम्य हैं; धनुष का रूपक और मूल की अर्थगत अनिश्चितता सुरक्षित रखी गई है।
