  text: But he chose the tribe of Judah[b][a], Mount Zion which he loved.
translation:
  language: hi
  text: परन्तु उसने यहूदा के गोत्र और सिय्योन पर्वत को चुना, जिससे वह प्रेम करता था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּבְחַר
  choice: परन्तु उसने ... चुन लिया
  rationale: वाव-क्रम कथा को आगे बढ़ाता है; पिछले पद में यूसुफ और एप्रैम को अस्वीकार करने के विपरीत यहाँ चुनाव है, इसलिए ‘परन्तु’ प्रसंगगत विरोध को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: שֵׁבֶט יְהוּדָה
  choice: यहूदा का गोत्र
  rationale: इस इस्राएली जनजातीय प्रसंग में שֵׁבֶט का सामान्य अर्थ ‘गोत्र’ है।
- source_word: הַר צִיּוֹן
  choice: सिय्योन पर्वत
  rationale: स्थानवाचक पद का प्रचलित और स्पष्ट हिन्दी रूप।
- source_word: אֲשֶׁר אָהֵב
  choice: जिसे वह प्रेम करता था
  rationale: सम्बन्धवाचक उपवाक्य निकटतम पद ‘सिय्योन पर्वत’ को स्पष्ट रूप से विशेषित करता है और स्रोत के कालगत भाव को सहज हिन्दी में रखता है।
- source_word: אֶת ... אֶת
  choice: यहूदा के गोत्र को, अर्थात् सिय्योन पर्वत को
  rationale: दोनों पदों पर कर्मचिह्न है, किन्तु समानांतर काव्य-संरचना दूसरे पद को पहले चुनाव की स्थानगत व्याख्या के रूप में भी पढ़ने देती है। ‘अर्थात्’ मुख्य पाठ में इस सम्भावित व्याख्यात्मक सम्बन्ध को स्वाभाविक बनाता है; वैकल्पिक समन्वयी पठन पादटिप्पणी में सुरक्षित है।
theological_decisions:
- issue: यहूदा और सिय्योन के चुनाव का परस्पर सम्बन्ध
  choice: सिय्योन पर्वत को यहूदा के चुनाव की स्थानगत व्याख्या के रूप में प्रस्तुत किया
  alternative: ‘उसने यहूदा के गोत्र और सिय्योन पर्वत को चुना’—दो अलग, समन्वित कर्म
  rationale: इब्रानी में एक ही क्रिया के बाद אֶת से चिह्नित दो पद हैं। व्याकरण दोनों को कर्म बनाता है, जबकि पद की काव्यगत समानांतरता निकट व्याख्यात्मक सम्बन्ध की अनुमति देती है। मुख्य पाठ एक स्वाभाविक हिन्दी पठन देता है और पादटिप्पणी वास्तविक संरचनात्मक अस्पष्टता सुरक्षित रखती है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी। ‘गोत्र’, ‘सिय्योन पर्वत’ और ‘चुन लिया’ बाइबलीय प्रसंग के परिचित शब्द हैं।
