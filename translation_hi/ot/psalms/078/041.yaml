  yaml_path: translation/ot/psalms/078/041.yaml
  text: Again they turned back and tested God[a], and they limited the Holy One of Israel.
translation:
  language: hi
  text: वे फिर लौटे और परमेश्वर को परखा; उन्होंने इस्राएल के पवित्र परमेश्वर को सीमित किया[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ प्रयुक्त इब्रानी क्रिया दुर्लभ और कठिन है। इसका अनुवाद ‘उस पर चिह्न लगाया’, ‘ललकारा’, या ‘उकसाया’ भी किया गया है।
    reason: alternative_reading
lexical_decisions:
- source_word: וַיָּשׁוּבוּ
  choice: वे फिर लौटे
  rationale: שׁוּב यहाँ पिछली विद्रोही चाल की ओर दोबारा लौटने का भाव देता है। ‘फिर लौटे’ पुनरावृत्ति को स्वाभाविक और संक्षिप्त हिन्दी में व्यक्त करता है।
- source_word: וַיְנַסּוּ
  choice: परखा
  rationale: נסה का सामान्य अर्थ ‘परखना/परीक्षा लेना’ है। यहाँ यह अविश्वास के कारण परमेश्वर को चुनौती देकर परखने का आरोप व्यक्त करता है।
- source_word: אֵל
  choice: परमेश्वर
  rationale: אֵל यहाँ इस्राएल के परमेश्वर के लिए प्रयुक्त ईश्वरीय पद है; ‘परमेश्वर’ आधुनिक मानक हिन्दी में स्पष्ट और गरिमापूर्ण है।
- source_word: וּקְדוֹשׁ יִשְׂרָאֵל
  choice: इस्राएल के पवित्र जन
  rationale: यह विशिष्ट बाइबलीय उपाधि परमेश्वर की पवित्रता और इस्राएल से उसके संबंध को बनाए रखती है।
- source_word: הִתְווּ
  choice: उकसाया
  rationale: यह दुर्लभ और कठिन क्रिया है। ‘उकसाया’ समानांतर पद ‘परमेश्वर को परखा’ के अनुरूप विरोधपूर्ण चुनौती या अपमान का संभावित भाव देता है, जबकि अन्य प्रामाणिक संभावनाएँ पादटिप्पणी में रखी गई हैं।
theological_decisions:
- issue: दुर्लभ क्रिया הִתְווּ का अनुवाद
  choice: उकसाया
  alternative: सीमित किया; उस पर चिह्न लगाया
  rationale: संदर्भ में यह इस्राएल के विद्रोही व्यवहार और परमेश्वर को परखने के समानांतर है, इसलिए ‘उकसाया’ संभावित आशय को सहज हिन्दी में व्यक्त करता है। फिर भी मूल क्रिया अत्यंत दुर्लभ और अर्थ की दृष्टि से अनिश्चित है; अतः ‘सीमित किया’ जैसी परंपरागत व्याख्या को मूल पाठ का निर्विवाद अर्थ या परमेश्वर की वास्तविक सामर्थ्य पर सीमा नहीं माना गया, बल्कि विकल्प के रूप में पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। अर्धविराम इब्रानी काव्य की दो समानांतर क्रियाओं को स्पष्ट करता है। कठिन अंतिम क्रिया की अनिश्चितता मुख्य पाठ को बोझिल किए बिना पादटिप्पणी में सुरक्षित है।
