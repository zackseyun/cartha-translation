source:
  edition: WLC
  text: בְּ/כָל זֹ֭את חָֽטְאוּ ע֑וֹד וְ/לֹֽא הֶ֝אֱמִ֗ינוּ בְּ/נִפְלְאוֹתָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/032.yaml
  text: In spite of all this[a], they still sinned and did not believe in his wondrous works.
translation:
  language: hi
  text: इन सबके बावजूद वे पाप करते ही रहे, और उन्होंने उसके अद्भुत कार्यों पर विश्वास नहीं किया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּכָל זֹאת
  choice: इन सबके बावजूद
  rationale: 'यह पदबंध प्रसंग में रियायती अर्थ देता है: परमेश्वर के न्याय और प्रबंध के सभी पिछले कामों के बावजूद लोग पाप में लगे रहे।'
- source_word: חָטְאוּ עוֹד
  choice: पाप करते ही रहे
  rationale: חָטְאוּ का सामान्य अर्थ ‘पाप किया’ है, और עוֹד निरंतरता तथा हठपूर्ण बने रहने का भाव देता है; संयुक्त हिंदी अभिव्यक्ति इसे स्वाभाविक रूप से व्यक्त करती है।
- source_word: וְלֹא הֶאֱמִינוּ
  choice: और ... विश्वास नहीं किया
  rationale: साधारण संयोजन और निषेध को बनाए रखा गया है। אמן के हिफ़ील रूप में विश्वास करने और भरोसा रखने दोनों की अर्थ-छाया हो सकती है।
- source_word: בְּנִפְלְאוֹתָיו
  choice: उसके अद्भुत कामों पर
  rationale: נִפְלָאוֹת परमेश्वर के असाधारण और विस्मयकारी कार्यों को दर्शाता है। ‘अद्भुत काम’ आधुनिक हिंदी में ठोस दैवी कार्यों को स्पष्ट करता है; प्रत्यय का अर्थ ‘उसके’ है।
theological_decisions:
- issue: परमेश्वर के अद्भुत कामों के प्रति इस्राएल की प्रतिक्रिया
  choice: उसके अद्भुत कामों पर विश्वास नहीं किया
  alternative: उसके अद्भुत कामों पर भरोसा नहीं रखा / उसके अद्भुत कामों को सच नहीं माना
  rationale: इब्रानी क्रिया विश्वास और भरोसे दोनों की अर्थ-छाया रखती है। मुख्य पाठ में स्वाभाविक हिंदी ‘विश्वास नहीं किया’ रखी गई है, बिना अविश्वास की प्रकृति पर कोई अतिरिक्त धर्मवैज्ञानिक निष्कर्ष थोपे।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘पाप करते ही रहे’ मूल के पूर्ण क्रियारूप और עוֹד से व्यक्त निरंतर हठ को स्वाभाविक हिंदी में सामने लाता है। कोई पादटिप्पणी नहीं जोड़ी गई, क्योंकि हिंदी में ‘पर विश्वास करना’ संदर्भगत अर्थ को पर्याप्त रूप से व्यक्त करता है।
