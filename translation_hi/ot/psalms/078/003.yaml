- source_word: סִפְּרוּ־לָנוּ
  choice: हमें बताया है
  rationale: क्रिया का अर्थ सुनाना या वर्णन करना है; संदर्भ में पीढ़ी-दर-पीढ़ी बताई गई बात के लिए यह सहज और पर्याप्त निकट है।
