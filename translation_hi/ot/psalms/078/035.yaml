  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַֽ֭/יִּזְכְּרוּ כִּֽי אֱלֹהִ֣ים צוּרָ֑/ם וְ/אֵ֥ל עֶ֝לְיוֹן גֹּאֲלָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/035.yaml
  text: Then they remembered that God was their rock[a], and God Most High was their redeemer.
translation:
  language: hi
  text: तब उन्होंने याद किया कि परमेश्वर उनकी चट्टान था, और परमप्रधान परमेश्वर उनका छुड़ानेवाला था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּזְכְּרוּ
  choice: तब उन्होंने याद किया
  rationale: वाव-क्रमिक कथानक को आगे बढ़ाता है; ‘तब’ स्वाभाविक हिन्दी में क्रमिक भाव और भूतकाल दोनों व्यक्त करता है।
- source_word: כִּי
  choice: कि
  rationale: यहाँ כִּי स्मरण की विषय-वस्तु प्रस्तुत करता है, कारण नहीं।
- source_word: אֱלֹהִים
  choice: परमेश्वर
  rationale: रूप की दृष्टि से बहुवचन होते हुए भी यहाँ इस्राएल के एकमात्र परमेश्वर के लिए एकवचन अर्थ में प्रयुक्त है।
- source_word: צוּרָם
  choice: उनकी चट्टान
  rationale: यह परमेश्वर को स्थिर आश्रय और सामर्थ्य के रूप में प्रस्तुत करनेवाला सीधा रूपक है।
- source_word: וְאֵל עֶלְיוֹן
  choice: और परमप्रधान परमेश्वर
  rationale: אֵל को ईश्वरीय पदवी के रूप में ‘परमेश्वर’ और עֶלְיוֹן को प्रचलित पदवी ‘परमप्रधान’ से व्यक्त किया गया है; हिन्दी में यह क्रम स्वाभाविक रहते हुए दोनों शब्दों को सुरक्षित रखता है।
- source_word: גֹּאֲלָם
  choice: उनका छुड़ानेवाला
  rationale: गאל के कृदन्त-संज्ञात्मक भाव को बनाए रखता है और इस काव्यात्मक प्रसंग में अस्पष्ट, अधिक विशिष्ट ‘कुटुम्बी-छुड़ानेवाला’ कानूनी अर्थ नहीं जोड़ता।
theological_decisions:
- issue: אֱלֹהִים ... וְאֵל עֶלְיוֹן की समानांतर ईश्वरीय पदवियाँ
  choice: दोनों अर्धपंक्तियों में उसी एक परमेश्वर का उल्लेख रखते हुए ‘परमेश्वर ... और परमप्रधान परमेश्वर’
  alternative: ‘परमेश्वर ... और एल परमप्रधान’ अथवा ‘परमेश्वर ... और परमप्रधान’
  rationale: इब्रानी काव्य-समानांतरता एक ही परमेश्वर के लिए दो पदवियाँ रखती है। אֵל का अनुवाद करने से दो अलग सत्ताओं का संकेत नहीं मिलता और अनावश्यक लिप्यंतरण से बचा जाता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और काव्यात्मक भाषा। ‘चट्टान’ मूल रूपक को अक्षुण्ण रखता है; ‘छुड़ानेवाला’ सामान्य पाठक के लिए बोधगम्य है।
