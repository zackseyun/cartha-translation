  source_fidelity: The translation accurately renders the narrative sequence (וַיִּזְכְּרוּ), the content clause introduced by כִּי, and both poetic cola. ‘परमेश्वर’ and ‘परमप्रधान परमेश्वर’ appropriately represent the parallel divine titles, while ‘उनकी चट्टान’ preserves צוּרָם as a direct metaphor and ‘उनका छुड़ानेवाला’ conveys the participial גֹּאֲלָם without importing a specific kinship-law sense.
