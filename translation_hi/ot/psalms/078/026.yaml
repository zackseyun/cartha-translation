  text: יַסַּ֣ע קָ֭דִים בַּ/שָּׁמָ֑יִם וַ/יְנַהֵ֖ג בְּ/עֻזּ֣/וֹ תֵימָֽן׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/026.yaml
  text: He stirred up the east wind in the heavens[b][a], and by his strength he guided the south wind.
translation:
  language: hi
  text: उसने आकाश में पुरवाई चलाई[a], और अपने सामर्थ्य से दक्षिणी हवा को हाँका।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसने आकाश में पुरवाई को प्रस्थान कराया।”
    reason: יַסַּע के अधिक शाब्दिक अर्थ ‘चलने के लिए प्रस्थान कराना’ को सुरक्षित रखने वाला वैकल्पिक अनुवाद।
lexical_decisions:
- source_word: יַסַּע
  choice: चलाई
  rationale: נסע के हिफ़ील रूप का मूल भाव ‘चलने के लिए प्रस्थान कराना’ है। हवा के संदर्भ में ‘चलाई’ स्वाभाविक हिन्दी में परमेश्वर द्वारा उसे गतिमान करने का भाव रखता है।
- source_word: קָדִים
  choice: पुरवाई
  rationale: קָדִים यहाँ केवल पूर्व दिशा नहीं, पूर्व से आने वाली हवा को सूचित करता है। ‘पुरवाई’ आधुनिक हिन्दी का सहज और काव्यात्मक शब्द है।
- source_word: בַּשָּׁמָיִם
  choice: आकाश में
  rationale: שָׁמַיִם का इस प्रसंग में आशय उस आकाश से है जहाँ हवा चलती है। ‘आकाश में’ हिन्दी में स्वाभाविक है और काव्यात्मक गरिमा बनाए रखता है।
- source_word: וַיְנַהֵג
  choice: हाँका
  rationale: נהג में आगे ले जाने, दिशा देने या हाँकने का भाव है। हवा के साथ ‘हाँका’ सक्रिय नियंत्रण और काव्यात्मक समानांतरता को स्पष्ट करता है।
- source_word: בְּעֻזּוֹ
  choice: अपने सामर्थ्य से
  rationale: עֹז शक्ति, सामर्थ्य या पराक्रम को दर्शाता है। ‘अपने सामर्थ्य से’ साधन के भाव सहित मूल के निकट और सामान्य पाठक के लिए स्पष्ट है।
- source_word: תֵימָן
  choice: दक्खिनी हवा
  rationale: תֵימָן का शाब्दिक अर्थ ‘दक्षिण’ है, पर קָדִים के समानांतर यहाँ दक्षिण से आने वाली हवा अभिप्रेत है। ‘दक्खिनी हवा’ इस अर्थ को स्वाभाविक हिन्दी में स्पष्ट करती है।
theological_decisions:
- issue: प्राकृतिक शक्तियों पर परमेश्वर की सक्रिय सत्ता
  choice: दोनों क्रियाओं में परमेश्वर को हवा चलाने और उसे हाँकने वाला कर्ता बनाए रखा गया है।
  alternative: हवाओं के अपने-आप उठने का अधिक निर्वैयक्तिक वर्णन।
  rationale: इब्रानी पाठ में दोनों क्रियाओं का कर्ता वही है; इसलिए अनुवाद प्राकृतिक शक्तियों पर उसकी सक्रिय दिशा और नियंत्रण को दिखाता है, पर पाठ से आगे कोई सिद्धान्त नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक, सुबोध और काव्यात्मक रखी गई है। ‘पुरवाई’ और ‘दक्खिनी हवा’ दिशात्मक हवाओं की समानांतरता व्यक्त करते हैं; ‘हाँका’ मूल क्रिया की सक्रियता और परमेश्वर के नियंत्रण को बनाए रखता है।
