id: PSA.78.21
reference: Psalms 78:21
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: לָ/כֵ֤ן שָׁמַ֥ע יְהוָ֗ה וַֽ/יִּתְעַבָּ֥ר וְ֭/אֵשׁ נִשְּׂקָ֣ה בְ/יַעֲקֹ֑ב וְ/גַם אַ֝֗ף עָלָ֥ה בְ/יִשְׂרָאֵֽל׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/021.yaml
  text: Therefore Yahweh heard and was enraged[a]; and a fire was kindled against Jacob[c][b], and anger also rose against Israel.
translation:
  language: hi
  text: इसलिए यहोवा ने सुना और क्रोध से भड़क उठा[a]; याकूब के विरुद्ध आग भड़क उठी[b], और इस्राएल के विरुद्ध भी उसका क्रोध उमड़ पड़ा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “क्रोध से भर गया।”
    reason: וַיִּתְעַבָּר के तीव्र क्रोध-सूचक अर्थ का वैकल्पिक हिन्दी रूप।
  - marker: b
    text: शाब्दिक रूप से “याकूब में”; इसी प्रकार आगे “इस्राएल में।” यहाँ दंडात्मक प्रसंग के कारण “के विरुद्ध” अनुवाद किया गया है।
    reason: हिब्रू पूर्वसर्ग בְ की शाब्दिक बनावट और प्रसंगगत अर्थ दोनों को दर्ज करना।
lexical_decisions:
- source_word: לָכֵן
  choice: इसलिए
  rationale: यह पिछले पदों में कही गई बातों के परिणाम को स्पष्ट करता है और हिब्रू के निष्कर्षसूचक बल को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: שָׁמַע
  choice: सुना
  rationale: क्रिया का सीधा अर्थ सुनना है; प्रसंग में ध्यान देने का भाव निहित है, पर उसे अनावश्यक रूप से स्पष्ट नहीं किया गया।
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिब्रू के व्यक्तिगत ईश्वरीय नाम को हिन्दी में प्रचलित लिप्यंतरण द्वारा रखा गया है, किसी उपाधि से प्रतिस्थापित नहीं किया गया।
- source_word: וַיִּתְעַבָּר
  choice: क्रोध से भड़क उठा
  rationale: हित्पाएल रूप यहाँ तीव्र क्रोध में आने का भाव देता है; यह हिन्दी में सशक्त और स्वाभाविक है तथा अगले अग्नि-बिंब से भी मेल खाता है।
- source_word: אֵשׁ נִשְּׂקָה
  choice: आग भड़क उठी
  rationale: आग और उसके प्रज्वलित होने के मूल बिंब को बनाए रखते हुए निष्क्रिय हिब्रू अभिव्यक्ति का स्वाभाविक हिन्दी रूप दिया गया है।
- source_word: בְיַעֲקֹב
  choice: याकूब के विरुद्ध
  rationale: मूल पूर्वसर्ग का शाब्दिक अर्थ ‘में’ हो सकता है, पर दंडात्मक और विरोधी प्रसंग में ‘के विरुद्ध’ आशय को स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
- source_word: וְגַם
  choice: और ... भी
  rationale: संयोजक और योगात्मक दोनों बलों को हिन्दी की स्वाभाविक संरचना में सुरक्षित रखा गया है।
- source_word: אַף עָלָה
  choice: क्रोध उमड़ पड़ा
  rationale: אַף क्रोध का रूढ़ अर्थ रखता है और עָלָה के ऊपर उठने/बढ़ने के रूपक को ‘उमड़ पड़ा’ तीव्र, प्रवहमान हिन्दी में व्यक्त करता है।
- source_word: בְיִשְׂרָאֵל
  choice: इस्राएल के विरुद्ध
  rationale: समानांतर पहली पंक्ति की तरह यहाँ भी दंड की दिशा दिखाने के लिए ‘के विरुद्ध’ चुना गया है।
theological_decisions:
- issue: ईश्वरीय क्रोध की तीव्रता
  choice: ‘क्रोध से भड़क उठा’ और ‘क्रोध उमड़ पड़ा’ जैसे सशक्त शब्द बनाए गए।
  alternative: हल्का रूप, जैसे ‘अप्रसन्न हुआ’।
  rationale: हिब्रू पाठ तीव्र ईश्वरीय रोष व्यक्त करता है; उसे नरम करना मूल के धर्मवैचारिक भार को घटा देता।
- issue: आग के बिंब की व्याख्या
  choice: ‘आग भड़क उठी’ को बिना यह तय किए रखा गया कि आग शाब्दिक है या रूपकात्मक।
  alternative: इसे स्पष्ट रूप से वास्तविक आग अथवा केवल न्याय के रूपक के रूप में समझाना।
  rationale: पद स्वयं इस प्रश्न को पूरी तरह हल नहीं करता; इसलिए मूल की अर्थगत खुली गुंजाइश सुरक्षित रखी गई।
- issue: वְ के संबंध का स्वरूप
  choice: इसे ‘और’ के रूप में रखा गया।
  alternative: इसे व्याख्यात्मक ‘क्योंकि’ या ‘अर्थात्’ के रूप में प्रस्तुत करना।
  rationale: व्याख्यात्मक संबंध संभव है, पर साधारण संयोजन पाठ की समानांतर रचना और वास्तविक अस्पष्टता को बेहतर बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सहज काव्यात्मक गद्य। ‘भड़क उठा/भड़क उठी’ की पुनरावृत्ति हिब्रू के क्रोध और आग के निकटवर्ती बिंबों को जानबूझकर जोड़ती है। दिव्य नाम के लिए ‘यहोवा’ और जातीय/वाचा-संबंधी नामों के लिए ‘याकूब’ तथा ‘इस्राएल’ प्रयुक्त हैं।
