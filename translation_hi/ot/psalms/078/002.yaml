  text: אֶפְתְּחָ֣ה בְ/מָשָׁ֣ל פִּ֑/י אַבִּ֥יעָה חִ֝יד֗וֹת מִנִּי קֶֽדֶם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/002.yaml
  text: I will open my mouth in a parable[d][c][b][a]; I will utter riddles from of old.
translation:
  language: hi
  text: मैं दृष्टान्त में अपना मुँह खोलूँगा[a][d]; मैं प्राचीन काल की पहेलियाँ कहूँगा[b][c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “नीतिवचन के द्वारा” अथवा “एक कथन में।” इब्रानी शब्द का अर्थ नीतिवचन, दृष्टान्त या आलंकारिक कथन हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या “गूढ़ बातें” अथवा “रहस्यपूर्ण कथन।”
    reason: lexical_alternative
  - marker: c
    text: या “पुराने समय से चली आती।”
    reason: lexical_alternative
  - marker: d
    text: मत्ती 13:35 में यह पद यीशु के दृष्टान्तों में बोलने के सम्बन्ध में उद्धृत किया गया है।
    reason: cross_reference
lexical_decisions:
- source_word: אֶפְתְּחָה
  choice: मैं ... खोलूँगा
  rationale: प्रथम पुरुष एकवचन का यह काव्यात्मक रूप संकल्प अथवा भावी कथन व्यक्त करता है; इसलिए ‘मैं खोलूँगा’ स्वाभाविक है।
- source_word: בְמָשָׁל
  choice: दृष्टान्त में
  rationale: מָשָׁל का अर्थ नीतिवचन, दृष्टान्त या आलंकारिक कथन हो सकता है। समानांतर ‘पहेलियाँ’ के साथ यहाँ ‘दृष्टान्त’ शिक्षाप्रद आलंकारिक वाणी का भाव सुरक्षित रखता है।
- source_word: פִּי
  choice: अपना मुँह
  rationale: मूल का ठोस बिंब हिन्दी में भी स्वाभाविक मुहावरे के रूप में रखा गया है।
- source_word: אַבִּיעָה
  choice: कहूँगा
  rationale: हिफ़ील रूप का मूल बिंब ‘उमड़ने/बहा देने’ का है और लाक्षणिक अर्थ वचन प्रकट करना है; सहज आधुनिक हिन्दी में ‘कहूँगा’ स्पष्ट है।
- source_word: חִידוֹת
  choice: पहेलियाँ
  rationale: חִידָה का सीधा अर्थ पहेली अथवा गूढ़ कथन है; बहुवचन को ‘पहेलियाँ’ से व्यक्त किया गया है।
- source_word: מִנִּי קֶדֶם
  choice: प्राचीन काल की
  rationale: यह पदबंध पुराने अथवा प्राचीन समय का संकेत करता है, किसी अनिवार्य निरपेक्ष आरम्भ का नहीं। हिन्दी में सम्बन्धसूचक ‘की’ मुहावरेदार ढंग से प्राचीन काल से चली आती बातों का भाव देता है।
theological_decisions:
- issue: मत्ती 13:35 से सम्बन्ध और מָשָׁל / חִידוֹת का अर्थ
  choice: इब्रानी पद को उसके अपने अर्थ में ‘दृष्टान्त’ और ‘पहेलियाँ’ के रूप में प्रस्तुत किया गया है।
  alternative: ‘नीतिवचन’ और ‘गूढ़ बातें’, अथवा बाद के उद्धरण के अनुरूप ‘छिपी हुई बातें’।
  rationale: नए नियम के उद्धरण के अनुसार इब्रानी को चुपचाप ढालने के बजाय मूल पाठ की आलंकारिक और रहस्यमय शिक्षापरक वाणी को बनाए रखा गया है; अन्तरपाठीय सम्बन्ध पादटिप्पणी में बताया गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘अपना मुँह खोलूँगा’ मूल इब्रानी के काव्यात्मक बिंब को सुरक्षित रखता है; ‘दृष्टान्त’ और ‘पहेलियाँ’ अर्थगत अस्पष्टता को पादटिप्पणियों सहित बनाए रखते हैं।
