  - marker: b
    text: ‘विरासत’ का अनुवाद ‘धरोहर’ या ‘अधिकार’ भी किया जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵאַחַר
  choice: के पीछे से
  rationale: यह पदबंध झुंड के पीछे चलने या वहाँ से बुलाए जाने की चरवाही-संबंधी छवि को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: עָלוֹת
  choice: दूध पिलानेवाली भेड़ों
  rationale: यह स्त्रीलिंग बहुवचन रूप उन मादा भेड़ों को सूचित करता है जो अपने बच्चों को दूध पिला रही हैं; हिन्दी में यह अर्थ स्पष्ट है।
- source_word: הֱבִיאוֹ
  choice: वह उसे ले आया
  rationale: हिफ़ील रूप का सीधा अर्थ ‘ले आना’ है; पूर्ववर्ती प्रसंग में परमेश्वर कर्ता और दाऊद कर्म है।
- source_word: לִרְעוֹת
  choice: चरवाही करे
  rationale: यह चयन दाऊद के वास्तविक चरवाहे के काम और प्रजा पर उसके राजकीय दायित्व के बीच की काव्यात्मक उपमा को सुरक्षित रखता है।
- source_word: בְּיַעֲקֹב עַמּוֹ
  choice: उसकी प्रजा याकूब की
  rationale: यह हिन्दी क्रम याकूब और ‘उसकी प्रजा’ के समानाधिकरण संबंध को स्पष्ट करते हुए अगले समांतर वाक्यांश से मेल रखता है।
- source_word: וּבְיִשְׂרָאֵל נַחֲלָתוֹ
  choice: उसकी विरासत इस्राएल की
  rationale: ‘विरासत’ נַחֲלָה का सीधा और वाचा-संबंधी भाव वाला समतुल्य है; वाक्यक्रम काव्यात्मक समानांतरता को बनाए रखता है।
theological_decisions:
- issue: दाऊद की बुलाहट में राजकीय-चरवाही की उपमा
  choice: ‘चरवाही करे’ कहकर चरवाहे की छवि स्पष्ट रूप से बनाए रखना
  alternative: ‘अगुवाई करे’ या ‘देखभाल करे’
  rationale: पद दाऊद के भेड़ों की चरवाही करने के पुराने काम को इस्राएल के प्रति उसकी बाद की भूमिका से जानबूझकर जोड़ता है; इसे बनाए रखना साहित्यिक और धर्मवैचारिक तनाव को बिना अतिरिक्त सिद्धांत जोड़े सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और काव्यात्मक गद्य; ‘चरवाही’ द्वारा मूल की विस्तृत pastoral metaphor सुरक्षित रखी गई है।
