translation:
  language: hi
  text: दूध पिलानेवाली भेड़ों के पीछे से उसने उसे लाकर[a] अपनी प्रजा याकूब और अपनी विरासत[b] इस्राएल की चरवाही करने के लिए नियुक्त किया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘बच्चोंवाली भेड़ों के पीछे से।’
