base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/036.yaml
  text: But they flattered him with their mouth[a], and with their tongue they lied to him.
translation:
  language: hi
  text: पर वे अपने मुँह से उसकी चापलूसी करते थे[a], और अपनी जीभ से उससे झूठ बोलते थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उसे धोखा देते थे” अथवा “उसे बहकाते थे।” इब्रानी क्रिया के ये अर्थ भी हो सकते हैं; यहाँ संभवतः कपटपूर्ण, खुशामदी वाणी का भाव है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְפַתּוּהוּ
  choice: वे उसकी चापलूसी करते थे
  rationale: पिअेल रूप यहाँ बहकाने, छलने या लुभाने का अर्थ दे सकता है। समानांतर पंक्ति में झूठ बोलने का उल्लेख होने के कारण संदर्भ कपटपूर्ण, खुशामदी वाणी का है; ‘चापलूसी’ इस भाव को स्वाभाविक हिन्दी में व्यक्त करती है, जबकि अन्य अर्थ पादटिप्पणी में सुरक्षित हैं।
- source_word: בְּפִיהֶם
  choice: अपने मुँह से
  rationale: בְּ साधन का बोध कराता है। ‘मुँह’ को एकवचन में रखने से इब्रानी की सामूहिक अभिव्यक्ति और काव्यात्मक समानांतरता बनी रहती है।
- source_word: וּבִלְשׁוֹנָם
  choice: और अपनी जीभ से
  rationale: ‘जीभ’ को रूपकात्मक वाणी के अर्थ में शाब्दिक रूप से रखा गया है, जिससे ‘मुँह’ के साथ मूल का काव्यात्मक समानांतर सुरक्षित रहता है।
- source_word: יְכַזְּבוּ
  choice: झूठ बोलते थे
  rationale: כזב का पिअेल रूप झूठ बोलने या मिथ्या व्यवहार करने को दर्शाता है। ‘झूठ बोलते थे’ सीधा, स्पष्ट और आधुनिक हिन्दी में स्वाभाविक है।
- source_word: לוֹ
  choice: उससे
  rationale: לְ प्रत्यय सहित यहाँ झूठी वाणी के अप्रत्यक्ष लक्ष्य, अर्थात परमेश्वर, को सूचित करता है। ‘उससे झूठ बोलते थे’ हिन्दी में स्वाभाविक है।
theological_decisions:
- issue: क्या पद का अर्थ यह है कि लोगों ने परमेश्वर को वास्तव में धोखा दे दिया, या यह कि उन्होंने उससे कपटपूर्ण बातें कीं?
  choice: मुख्य पाठ में परमेश्वर को संबोधित कपटपूर्ण चापलूसी व्यक्त की गई है, न कि यह दावा कि वह वास्तव में धोखा खा गया।
  alternative: ‘उन्होंने उसे धोखा दिया’ या ‘उन्होंने उसे बहकाया’ अनुवाद भी क्रिया के संभावित अर्थ हैं।
  rationale: मूल क्रिया की अर्थ-सीमा पादटिप्पणी में सुरक्षित रखी गई है। निकट संदर्भ में झूठी वाणी और निष्कपट न रहने का आरोप है; इसलिए ‘चापलूसी’ प्रसंगानुकूल है, पर अस्पष्टता को पूरी तरह मिटाया नहीं गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण और काव्यात्मक शैली रखी गई है। ‘मुँह’ और ‘जीभ’ के समानांतर बिंब सुरक्षित हैं; अपूर्णकालिक इब्रानी क्रियाओं को कथा-संदर्भ के अनुरूप ‘करते थे/बोलते थे’ से व्यक्त किया गया है।
