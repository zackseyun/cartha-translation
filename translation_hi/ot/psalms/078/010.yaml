  text: They did not keep the covenant of God[a], and they refused to walk in his law.
translation:
  language: hi
  text: 'उन्होंने परमेश्वर की वाचा का पालन नहीं किया,

    और उसकी व्यवस्था[a] के अनुसार चलने से इनकार किया।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “शिक्षा” अथवा “निर्देश”; इब्रानी शब्द तोराह परमेश्वर की व्यवस्था, शिक्षा या निर्देश को दर्शा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁמְרוּ
  choice: पालन किया
  rationale: वाचा के साथ שׁמר का अर्थ उसे मानना और उसके प्रति निष्ठावान रहना है; आधुनिक हिन्दी में ‘वाचा का पालन करना’ स्वाभाविक और स्पष्ट है।
- source_word: בְּרִית אֱלֹהִים
  choice: परमेश्वर की वाचा
  rationale: यह संबंधवाचक पद परमेश्वर द्वारा स्थापित अथवा उससे संबंधित वाचा को दर्शाता है; ‘परमेश्वर की वाचा’ संक्षिप्त, गरिमापूर्ण और स्वाभाविक हिन्दी है।
- source_word: וּבְתוֹרָתוֹ
  choice: और उसकी व्यवस्था[a] पर
  rationale: תּוֹרָה में बाध्यकारी व्यवस्था के साथ शिक्षा या निर्देश का व्यापक भाव भी हो सकता है। वाचा के संदर्भ में ‘व्यवस्था’ उपयुक्त है, और चलने के रूपक के साथ हिन्दी में ‘पर’ स्वाभाविक है।
- source_word: מֵאֲנוּ
  choice: इनकार किया
  rationale: מֵאֲנוּ जानबूझकर अस्वीकार करने या अनिच्छुक होने को व्यक्त करता है; ‘इनकार किया’ आरोप की स्पष्ट शक्ति बनाए रखता है।
- source_word: לָלֶכֶת
  choice: चलने
  rationale: הלך का शाब्दिक अर्थ ‘चलना’ है और यहाँ यह जीवन के आचरण का रूपक है; इसे बनाए रखने से मूल बाइबिलीय चित्र सुरक्षित रहता है।
- source_word: לֹא
  choice: नहीं
  rationale: साधारण निषेध को आधुनिक हिन्दी में सीधे ‘नहीं’ से व्यक्त किया गया है।
theological_decisions:
- issue: वाचा के संदर्भ में תּוֹרָה का अनुवाद
  choice: व्यवस्था
  alternative: शिक्षा / निर्देश
  rationale: वाचा का पालन करने के समानांतर यहाँ परमेश्वर की תּוֹרָה के अनुसार आचरण की बाध्यकारी अपेक्षा सामने आती है, इसलिए ‘व्यवस्था’ मुख्य पाठ में उचित है। फिर भी मूल शब्द केवल विधिक नियमों तक सीमित नहीं है; उसका व्यापक ‘शिक्षा’ या ‘निर्देश’ वाला अर्थ पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण काव्यात्मक गद्य रखा गया है। ‘वाचा’, ‘व्यवस्था’ और ‘चलना’ मूल के प्रमुख वाचाई तथा नैतिक शब्दचित्रों को सुरक्षित रखते हैं।
