  text: וַ֭/יִּמְאַס בְּ/אֹ֣הֶל יוֹסֵ֑ף וּֽ/בְ/שֵׁ֥בֶט אֶ֝פְרַ֗יִם לֹ֣א בָחָֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/067.yaml
  text: Then he rejected the tent of Joseph[b][a], and he did not choose the tribe of Ephraim.
translation:
  language: hi
  text: तब उसने यूसुफ के तम्बू को ठुकरा दिया[a][b], और एप्रैम के गोत्र को नहीं चुना।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “यूसुफ के तम्बू को अस्वीकार कर दिया।”
    reason: lexical_alternative
  - marker: b
    text: यहाँ यूसुफ से जुड़े गोत्रों में प्रमुख एप्रैम का संकेत है; आगे के पदों में यहूदा और सिय्योन के चुने जाने का वर्णन आता है।
    reason: cross_reference
lexical_decisions:
- source_word: וַיִּמְאַס
  choice: तब उसने ... ठुकरा दिया
  rationale: מָאַס का अर्थ ‘अस्वीकार करना, ठुकराना, तुच्छ जानना’ हो सकता है। ‘ठुकरा दिया’ यहाँ स्पष्ट और स्वाभाविक है तथा तिरस्कार की मात्रा को अनावश्यक रूप से नहीं बढ़ाता। आरम्भिक וַ कथा को आगे बढ़ाता है, जिसे ‘तब’ व्यक्त करता है।
- source_word: בְּאֹהֶל יוֹסֵף
  choice: यूसुफ के तम्बू को
  rationale: אֹהֶל का मूल अर्थ ‘तम्बू’ है। इसे बनाए रखने से काव्यात्मक बिम्ब सुरक्षित रहता है और इसे ‘घर’ या किसी विशिष्ट पवित्रस्थान के रूप में अधिक व्याख्यायित नहीं किया जाता।
- source_word: וּבְשֵׁבֶט אֶפְרַיִם
  choice: एप्रैम के गोत्र को
  rationale: שֵׁבֶט के अर्थों में ‘गोत्र’, ‘छड़ी’ और ‘राजदण्ड’ आते हैं। गोत्रनाम एप्रैम तथा समानांतर पद ‘यूसुफ का तम्बू’ के कारण यहाँ ‘गोत्र’ सर्वाधिक स्वाभाविक है।
- source_word: לֹא בָחָר
  choice: नहीं चुना
  rationale: בָּחַר का सीधा अर्थ ‘चुनना’ है। यह अनुवाद मूल की समानांतर रचना और चयन-संबंधी भाषा को बनाए रखता है, बिना किसी बाद की पारिभाषिक धर्मवैज्ञानिक शब्दावली को जोड़ने के।
theological_decisions:
- issue: इस्राएल के गोत्रीय केन्द्रों के बीच परमेश्वर के ठुकराने और चुनने का ऐतिहासिक-धर्मवैज्ञानिक आशय
  choice: यूसुफ के तम्बू और एप्रैम के गोत्र के विषय में ठुकराने तथा न चुनने की ठोस ऐतिहासिक भाषा बनाए रखी गई है।
  alternative: यूसुफ और एप्रैम को सीधे पूरे उत्तरी राज्य के प्रतीक के रूप में अनूदित करना।
  rationale: भजन 78 इस्राएल का इतिहास सुनाता है और आगे यहूदा तथा सिय्योन के चयन का वर्णन करता है। मूल की गोत्रीय भाषा को मुख्य पाठ में बनाए रखने से व्यापक ऐतिहासिक संकेत संदर्भ से उभरता है, अनुवाद में थोपा नहीं जाता।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और काव्यात्मक भाषा। ‘तम्बू’, ‘गोत्र’ और ‘चुना’ मूल इब्रानी के ठोस बिम्ब और समानांतरता को सुरक्षित रखते हैं।
