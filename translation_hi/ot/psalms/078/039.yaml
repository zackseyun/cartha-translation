  text: וַ֭/יִּזְכֹּר כִּי בָשָׂ֣ר הֵ֑מָּה ר֥וּחַ ה֝וֹלֵ֗ךְ וְ/לֹ֣א יָשֽׁוּב־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/039.yaml
  text: He remembered that they were flesh[a], a wind that passes and does not return.
translation:
  language: hi
  text: उसने स्मरण किया कि वे देह हैं—एक हवा, जो बह जाती है और फिर नहीं लौटती।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “एक श्वास, जो चली जाती है और फिर नहीं लौटती।” इब्रानी शब्द רוּחַ का अर्थ “हवा,” “श्वास” या “आत्मा” हो सकता है; यहाँ मुख्य भाव संभवतः क्षणभंगुरता और दुर्बलता का है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּזְכֹּר
  choice: उसने स्मरण किया
  rationale: ज़כר के काल क़ल वय्यिक्तोल रूप को भूतकालीन कथन के रूप में रखा गया है; प्रसंग से कर्ता परमेश्वर है, पर इब्रानी की तरह यहाँ नाम नहीं जोड़ा गया।
- source_word: כִּי
  choice: कि
  rationale: यह उस बात की विषय-वस्तु प्रस्तुत करता है जिसे उसने स्मरण किया।
- source_word: בָשָׂר הֵמָּה
  choice: वे देह ही हैं
  rationale: ‘देह’ इब्रानी के ठोस बिंब और मानव की नश्वरता को बनाए रखता है; ‘ही’ स्वतंत्र सर्वनाम הֵמָּה के बल को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: רוּחַ
  choice: एक हवा
  rationale: यहाँ शब्द क्षणभंगुर और अस्थायी जीवन का बिंब है। ‘हवा’ הוֹלֵךְ और ‘नहीं लौटती’ के साथ स्वाभाविक बैठता है, जबकि ‘श्वास’ भी संभव है और पादटिप्पणी में दिया गया है।
- source_word: הוֹלֵךְ
  choice: जो चली जाती है
  rationale: कृदन्त की गतिशीलता और क्षणभंगुरता को वर्तमान-सामान्य अर्थ में स्वाभाविक हिन्दी द्वारा व्यक्त किया गया है।
- source_word: וְלֹא יָשׁוּב
  choice: और फिर नहीं लौटती
  rationale: अपूर्ण क्रिया के सामान्य काव्यात्मक भाव को रखा गया है; ‘फिर’ हिन्दी में लौटने की धारणा स्पष्ट करता है, बिना किसी अतिरिक्त सिद्धान्त को जोड़े।
theological_decisions:
- issue: मानव दुर्बलता और नश्वरता का बिंब
  choice: पद मनुष्यों को नश्वर और क्षणभंगुर बताता है—‘देह’ और चली जाने वाली ‘हवा’ के रूप में।
  alternative: רוּחַ को ‘आत्मा’ मानकर इसे मनुष्य की आत्मा के प्रस्थान के विषय में तकनीकी कथन समझना।
  rationale: तात्कालिक काव्यात्मक समानांतरता दुर्बलता और क्षणभंगुरता पर केंद्रित है। ‘हवा’ किसी विकसित आत्मा-सिद्धान्त को पाठ में आरोपित नहीं करती, जबकि ‘श्वास’ की वास्तविक शाब्दिक संभावना पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज काव्यात्मक गद्य। ‘स्मरण किया’ भजन की औपचारिक शैली के अनुकूल है; ‘देह’ और ‘हवा’ मूल बिंबों को बनाए रखते हैं। पादटिप्पणी-चिह्न मुख्य पाठ में स्पष्ट रूप से रखा गया है।
