  yaml_path: translation/ot/psalms/078/024.yaml
  text: He rained down manna on them to eat[a], and gave them the grain of heaven.
translation:
  language: hi
  text: उसने उन पर खाने के लिए मन्ना बरसाया और उन्हें स्वर्ग का अन्न दिया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּמְטֵר
  choice: बरसाया
  rationale: हिफ़ील रूप का अर्थ ‘बरसाना’ है; यह चयन कारणवाचक अर्थ और काव्यात्मक चित्र दोनों को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: עֲלֵיהֶם
  choice: उनके लिए
  rationale: मूलतः इसका अर्थ ‘उन पर’ है, पर मन्ना लोगों के ऊपर नहीं बल्कि उनके उपयोग हेतु बरसाए जाने के आशय को स्वाभाविक हिन्दी में ‘उनके लिए’ व्यक्त करता है।
- source_word: מָן
  choice: मन्ना
  rationale: जंगल-यात्रा में दिए गए विशिष्ट भोजन के लिए हिन्दी बाइबलीय परंपरा में प्रचलित लिप्यंतरण।
- source_word: לֶאֱכֹל
  choice: खाने को
  rationale: ל के साथ क्रियार्थक संज्ञा यहाँ उद्देश्य बताती है; ‘खाने को’ संक्षिप्त, सहज और मूल के निकट है।
- source_word: דְגַן
  choice: अन्न
  rationale: דגן अनाज या धान्य को सूचित करता है। काव्यात्मक हिन्दी में ‘अन्न’ स्वाभाविक है और इसे सामान्य ‘भोजन’ बनाकर रूपक को मिटाता नहीं।
- source_word: שָׁמַיִם
  choice: स्वर्ग
  rationale: रचनात्मक संबंध में यह ‘स्वर्ग का अन्न’ बनता है; ‘आकाश’ की तुलना में ‘स्वर्ग’ पद की ऊँची धार्मिक-काव्यात्मक ध्वनि को बेहतर बनाए रखता है।
- source_word: נָתַן
  choice: दिया
  rationale: सामान्य क्रिया נתן का सीधा और स्वाभाविक हिन्दी समतुल्य।
- source_word: לָמוֹ
  choice: उन्हें
  rationale: यह काव्यात्मक सर्वनाम रूप ‘उनको/उन्हें’ के अर्थ में है; ‘दिया’ के साथ ‘उन्हें’ स्वाभाविक अप्रत्यक्ष कर्म है।
theological_decisions:
- issue: मन्ना का ‘स्वर्ग का अन्न’ के रूप में काव्यात्मक वर्णन
  choice: स्वर्ग का अन्न
  alternative: स्वर्ग से आया भोजन / स्वर्ग की रोटी
  rationale: इब्रानी דְגַן का मूल अर्थ ‘अनाज/अन्न’ है। इसे ‘भोजन’ या ‘रोटी’ कहना रूपक की व्याख्या कर देता; ‘स्वर्ग का अन्न’ मूल काव्यात्मक तनाव और मन्ना के साथ समानांतरता बनाए रखता है।
translation_notes:
  register: आधुनिक, सरल और गरिमापूर्ण हिन्दी; समानांतर काव्य-रचना को दो समन्वित खंडों में रखा गया है। ‘मन्ना’ स्थापित बाइबलीय शब्द है और ‘स्वर्ग का अन्न’ मूल रूपक को अक्षुण्ण रखता है।
