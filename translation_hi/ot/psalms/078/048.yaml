  text: उसने उनके पशुओं को ओलों के हवाले कर दिया, और उनके मवेशियों को बिजली के प्रहारों के हवाले कर दिया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּסְגֵּר
  choice: उसने ... के हवाले कर दिया
  rationale: סגר का यहाँ अर्थ किसी विनाशकारी शक्ति के अधीन कर देना है; यह प्रयोग स्वाभाविक हिन्दी में ‘सौंप दिया’ की अपेक्षा विपत्ति के लिए छोड़ दिए जाने का भाव अधिक स्पष्ट रखता है।
- source_word: לַבָּרָד
  choice: ओलों के
  rationale: בָּרָד का सीधा अर्थ ‘ओला/ओले’ है; ל उपसर्ग उस विनाशकारी शक्ति को सूचित करता है जिसके हवाले पशु किए गए।
- source_word: בְּעִירָם
  choice: उनके पशुओं
  rationale: בְּעִיר सामान्यतः घरेलू पशु या भार ढोने वाले पशु को सूचित करता है। ‘पशु’ व्यापक और सहज सामूहिक शब्द है।
- source_word: וּמִקְנֵיהֶם
  choice: और उनके मवेशियों
  rationale: מִקְנֶה संपत्ति के रूप में रखे गए पशुधन को सूचित करता है। ‘मवेशी’ पहले पद के साथ काव्यात्मक समानांतरता और आंशिक अर्थगत भेद दोनों बनाए रखता है।
- source_word: לָרְשָׁפִים
  choice: अग्निबाणों
  rationale: רְשָׁפִים दहकते या चमकते विनाशकारी प्रहारों को सूचित कर सकता है। ‘अग्निबाण’ मूल की आग और प्रहार—दोनों छवियाँ रखता है, जबकि बिजली या लपट की सम्भावना पादटिप्पणी में सुरक्षित है।
