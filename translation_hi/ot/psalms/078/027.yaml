- source_word: וַיַּמְטֵר
  choice: उसने ... बरसाया
  rationale: हिफ़ील रूप का अर्थ ‘बरसाना’ या ‘वर्षा के समान गिराना’ है; हिन्दी में ‘बरसाया’ कारणवाचक भाव और काव्यात्मक चित्र दोनों को स्वाभाविक रूप से रखता है।
- source_word: עֲלֵיהֶם
  choice: उन पर
  rationale: על तथा सर्वनाम-प्रत्यय का सीधा और स्वाभाविक हिन्दी रूप ‘उन पर’ है।
- source_word: כֶּעָפָר
  choice: धूल के समान
  rationale: उपसर्ग כ की उपमा को स्पष्ट और गरिमापूर्ण आधुनिक हिन्दी में व्यक्त करता है।
- source_word: שְׁאֵר
  choice: मांस
  rationale: यह शब्द ‘देह/मांस’ अथवा भोजन के रूप में ‘मांस’ बता सकता है; जंगल में दिए गए खाने और अगले पदांश के पक्षियों के संदर्भ में ‘मांस’ सबसे स्वाभाविक है।
- source_word: וּכְחוֹל יַמִּים
  choice: और समुद्रों की रेत के समान
  rationale: मूल में יַמִּים बहुवचन ‘समुद्रों’ है। हिन्दी में बहुवचन बनाए रखने से इब्रानी अभिव्यक्ति सुरक्षित रहती है और अर्थ स्पष्ट रहता है।
- source_word: עוֹף כָּנָף
  choice: पंखवाले पक्षी
  rationale: शाब्दिक भाव ‘पंख के पक्षी’ है; ‘पंखवाले पक्षी’ मूल बिंब को रखते हुए आधुनिक हिन्दी में सहज है।
