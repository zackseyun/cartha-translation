  text: They did not remember his hand[b][a], the day when he redeemed them from the foe.
translation:
  language: hi
  text: उन्होंने उसके हाथ[a] को स्मरण नहीं किया, उस दिन जब उसने उन्हें शत्रु[b] से छुड़ाया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘उसकी सामर्थ्य’ अथवा ‘उसके हाथ ने जो किया था।’ इब्रानी में शाब्दिक रूप से ‘उसका हाथ’ है।
    reason: lexical_alternative
  - marker: b
    text: या ‘बैरी’ अथवा ‘विरोधी’।
    reason: lexical_alternative
lexical_decisions:
- source_word: זָכְרוּ
  choice: स्मरण नहीं किया
  rationale: क़ाल रूप का सामान्य अर्थ ‘स्मरण करना’ है। नकार के साथ यह अनुवाद इब्रानी अभिव्यक्ति को पारदर्शी ढंग से बनाए रखता है और ‘भूल गए’ की अपेक्षा कम व्याख्यात्मक है।
- source_word: יָדוֹ
  choice: उसके हाथ
  rationale: इब्रानी में ‘हाथ’ सामर्थ्य और कार्य का सजीव रूपक है। इसे मुख्य पाठ में बनाए रखने से मूल बिंब सुरक्षित रहता है।
- source_word: יוֹם אֲשֶׁר
  choice: उस दिन को, जब
  rationale: यह पदबंध दिन और छुटकारे की घटना के बीच कालगत संबंध व्यक्त करता है। वाक्य-विन्यास में ‘दिन’ को ‘स्मरण नहीं किया’ के समानांतर कर्म मानने की संभावना भी सुरक्षित रहती है।
- source_word: פָּדָם
  choice: उसने उन्हें छुड़ाया था
  rationale: פדה का अर्थ मूल्य देकर छुड़ाना, मुक्त करना अथवा संकट से बचाना हो सकता है। निर्गमन-संदर्भ में ‘छुड़ाया’ सामान्य हिन्दी में स्वाभाविक है और उद्धार की क्रिया को स्पष्ट रखता है, बिना मूल्य चुकाने का ऐसा भाव जोड़ने के जो इस पद में प्रत्यक्ष नहीं है।
- source_word: מִנִּי צָר
  choice: शत्रु से
  rationale: צָר विरोधी, बैरी या सताने वाले शत्रु को सूचित करता है। ‘शत्रु’ आधुनिक मानक हिन्दी में स्पष्ट, गरिमापूर्ण और काव्य-संदर्भ के अनुकूल है।
theological_decisions:
- issue: ‘उसके हाथ’ का रूपकात्मक बल
  choice: मुख्य पाठ में ‘उसके हाथ’ रूपक को बनाए रखा गया।
  alternative: उसकी सामर्थ्य; उसके हाथ के किए काम
  rationale: मूल पाठ का ठोस बिंब परमेश्वर की सामर्थ्य अथवा कार्य की ओर संकेत करता है। उसे स्पष्टार्थ में बदलने के बजाय पाठ में सुरक्षित रखना व्याख्यात्मक अति से बचाता है।
- issue: निर्गमन-संदर्भ में פדה का अनुवाद
  choice: छुड़ाया
  alternative: छुड़ौती देकर मुक्त किया; उद्धार किया
  rationale: यह चयन दासता या शत्रु से परमेश्वर की मुक्तिदायक क्रिया को व्यक्त करता है, पर बाद की धर्मवैज्ञानिक शब्दावली को अनावश्यक रूप से पद में नहीं आरोपित करता।
- issue: יוֹם אֲשֶׁר का वाक्यगत संबंध
  choice: ‘उस दिन को, जब’ को ‘स्मरण नहीं किया’ के दूसरे कर्म के रूप में प्रस्तुत किया गया।
  alternative: उस दिन, जब उसने उन्हें शत्रु से छुड़ाया था
  rationale: इब्रानी में את केवल ‘उसके हाथ’ से पहले है, फिर भी ‘दिन’ को स्मरण की दूसरी विषय-वस्तु या उस घटना के काल-संदर्भ—दोनों रूपों में समझा जा सकता है। चुना हुआ विराम पाठ की संभावित समानांतरता को उभारता है, जबकि मूल अर्थगत संबंध खुला रहता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, काव्यात्मक किंतु सहज शैली। ‘स्मरण नहीं किया’ ने मूल की औपचारिक अभिव्यक्ति और ‘हाथ’ ने उसके सजीव रूपक को बनाए रखा है।
