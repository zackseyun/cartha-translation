  yaml_path: translation/ot/psalms/078/000.yaml
  text: A Maskil of Asaph. Give ear[a], my people, to my instruction; incline your ears to the words of my mouth.
translation:
  language: hi
  text: 'आसाफ का मस्कील[a]।


    हे मेरी प्रजा, मेरी शिक्षा पर कान लगाओ;

    मेरे मुँह की बातों की ओर अपने कान झुकाओ।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “मस्कील” भजनों के शीर्षकों में प्रयुक्त एक तकनीकी शब्द है; संभवतः इसका अर्थ शिक्षाप्रद या मननपरक रचना है।
    reason: मूल शब्द का सटीक अर्थ अनिश्चित है, इसलिए उसके संभावित अर्थ बताए गए हैं।
lexical_decisions:
- source_word: מַשְׂכִּיל
  choice: मस्कील
  rationale: भजन-शीर्षकों में प्रयुक्त इस तकनीकी शब्द का निश्चित अर्थ स्पष्ट नहीं है; इसलिए अर्थ को मुख्य पाठ में सीमित करने के बजाय इसका लिप्यंतरण किया गया है और संभावित अर्थ पाद-टिप्पणी में दिया गया है।
- source_word: תּוֹרָתִי
  choice: मेरी शिक्षा
  rationale: यहाँ तोराह का अर्थ किसी संहिताबद्ध व्यवस्था के बजाय भजनकार द्वारा दी जाने वाली शिक्षा या उपदेश है; ‘शिक्षा’ इस संदर्भ को स्वाभाविक रूप से व्यक्त करता है।
- source_word: הַאֲזִינָה … הַטּוּ אָזְנְכֶם
  choice: कान लगाओ … अपने कान झुकाओ
  rationale: दोनों श्रवण-संबंधी आज्ञाओं और उनकी समानांतर काव्यात्मक छवि को बनाए रखते हुए आधुनिक हिन्दी में बोधगम्य अभिव्यक्ति चुनी गई है।
theological_decisions: []
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। शीर्षक के तकनीकी शब्द को मूल रूप के निकट रखा गया है, जबकि पद की समानांतर काव्य-रचना संरक्षित की गई है।
