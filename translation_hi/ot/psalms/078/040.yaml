  text: कितनी ही बार उन्होंने निर्जन प्रदेश में उसके विरुद्ध विद्रोह किया और उजाड़ भूमि में उसे दुःखी किया![a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “कितनी बार उन्होंने निर्जन प्रदेश में उसके विरुद्ध विद्रोह किया।” आरम्भिक अभिव्यक्ति विद्रोह के बार-बार होने पर बल दे सकती है।
    reason: lexical_alternative
  - marker: b
    text: या, “उसे पीड़ा पहुँचाई” अथवा “उसे खिन्न किया।”
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּמָּה
  choice: कितनी ही बार
  rationale: विस्मयात्मक प्रश्नवाचक प्रयोग यहाँ बार-बार होने को उभारता है; यह शाब्दिक संख्या पूछने के बजाय विगत विद्रोहों की पुनरावृत्ति पर विलाप करता है।
- source_word: יַמְרוּהוּ
  choice: उन्होंने उसके विरुद्ध विद्रोह किया
  rationale: מרה का मूल भाव परमेश्वर की अवज्ञा और उसके विरुद्ध विद्रोह है; यह चयन अर्थ को स्पष्ट और स्वाभाविक हिन्दी में रखता है।
- source_word: בַמִּדְבָּר
  choice: निर्जन प्रदेश में
  rationale: מִדְבָּר इस्राएल के भटकने के वनहीन, कम आबाद भूभाग को सूचित करता है; ‘निर्जन प्रदेश’ आधुनिक हिन्दी में व्यापक भौगोलिक अर्थ देता है और इसे केवल रेतीले मरुस्थल तक सीमित नहीं करता।
- source_word: יַעֲצִיבוּהוּ
  choice: उसे दुःखी किया
  rationale: עצב के हिफ़ील रूप में पीड़ा या शोक पहुँचाने का भाव है; ‘दुःखी किया’ सम्बन्धपरक और भावात्मक बल को बनाए रखता है।
- source_word: בִּישִׁימוֹן
  choice: उजाड़ भूमि में
  rationale: יְשִׁימוֹן उजाड़ और वीरान भूभाग को दर्शाता है; यह चयन पहले समानांतर पद के ‘निर्जन प्रदेश’ से निकटता भी रखता है और दोनों इब्रानी शब्दों का अंतर भी बचाता है।
theological_decisions:
- issue: יַעֲצִיבוּהוּ में परमेश्वर के लिए मानवीय भावात्मक भाषा
  choice: मुख्य पाठ में ‘उसे दुःखी किया’ बनाए रखा गया है।
  alternative: ‘उसे पीड़ा पहुँचाई’ या ‘उसे खिन्न किया’
  rationale: इब्रानी पाठ इस्राएल के कार्यों से परमेश्वर को हुए वास्तविक सम्बन्धपरक दुःख को भावात्मक भाषा में व्यक्त करता है। इसे केवल ‘उकसाया’ जैसे निर्वैयक्तिक कथन में बदलने के बजाय मूल तनाव को सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘निर्जन प्रदेश’ और ‘उजाड़ भूमि’ के द्वारा इब्रानी काव्य की समानांतर किन्तु भिन्न भौगोलिक अभिव्यक्तियाँ सुरक्षित हैं।
