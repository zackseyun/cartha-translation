base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/016.yaml
  text: He brought streams out of the rock and made water flow down like rivers[a].
translation:
  language: hi
  text: उसने चट्टान से जलधाराएँ निकालीं और पानी को नदियों के समान बहा दिया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיּוֹצִא
  choice: उसने … निकालीं
  rationale: हिफ़ील रूप कारणवाचक है; यह प्रयोग स्वाभाविक हिन्दी में बताता है कि परमेश्वर ने जलधाराओं को चट्टान से बाहर निकाला।
- source_word: נוֹזְלִים
  choice: जलधाराएँ
  rationale: यह शब्द बहती हुई वस्तुओं या जल को सूचित करता है। प्रसंग में ‘जलधाराएँ’ प्रवाह का भाव स्पष्ट और काव्यात्मक ढंग से व्यक्त करता है।
- source_word: מִסָּלַע
  choice: चट्टान से
  rationale: סלע का अर्थ चट्टान या शिलाखंड है; यहाँ जंगल में चट्टान से पानी निकलने की घटना की ओर संकेत है।
- source_word: וַיּוֹרֶד
  choice: बहा दिया
  rationale: हिफ़ील रूप का मूल भाव ‘नीचे उतारना’ या ‘नीचे बहाना’ है। पानी के साथ ‘बहा दिया’ कारणवाचक अर्थ को स्वाभाविक हिन्दी में रखता है।
- source_word: כַּנְּהָרוֹת
  choice: नदियों के समान
  rationale: उपसर्ग כ तुलना प्रकट करता है और נהרות बहुवचन में ‘नदियाँ’ है; इसलिए यह सीधी उपमा है।
- source_word: מָיִם
  choice: पानी
  rationale: इब्रानी में रूप बहुवचन-सदृश है, पर यह सामान्यतः द्रव्यवाचक संज्ञा के रूप में प्रयुक्त होता है; आधुनिक हिन्दी में ‘पानी’ स्वाभाविक है।
theological_decisions: []
