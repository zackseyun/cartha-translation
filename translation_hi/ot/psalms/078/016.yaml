  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और काव्यात्मक। समानांतर पंक्तियों में ‘जलधाराएँ’ और ‘पानी’ रखकर इब्रानी काव्य की पुनरुक्ति तथा नदी-जैसे प्रचुर प्रवाह की छवि सुरक्षित रखी गई है।
