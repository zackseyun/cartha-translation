  text: וַ֭/יְבִיאֵ/ם אֶל גְּב֣וּל קָדְשׁ֑/וֹ הַר זֶ֝֗ה קָנְתָ֥ה יְמִינֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/054.yaml
  text: So he brought them to his holy border[d][c][b][a], this mountain that his right hand acquired.
translation:
  language: hi
  text: इस प्रकार वह उन्हें अपने पवित्र प्रदेश[a] में ले आया—इस पर्वत पर, जिसे उसके दाहिने हाथ ने प्राप्त किया।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “पवित्र प्रदेश” का अनुवाद “उसकी पवित्रता का सीमाक्षेत्र” या “उसकी पवित्र सीमा” भी हो सकता है; इब्रानी शब्द का अर्थ सीमा, सीमाक्षेत्र या प्रदेश हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: “प्राप्त किया” का अनुवाद “जीता,” “अधिकार में लिया” या “खरीदा” भी हो सकता है। यहाँ यह बताता है कि परमेश्वर के दाहिने हाथ ने उसे अपने अधिकार में किया।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְבִיאֵם
  choice: इस प्रकार वह उन्हें ... ले आया
  rationale: हिफ़ील रूप का अर्थ ‘ले आना’ है। आरंभिक वाव को प्रसंग में परमेश्वर के कार्यों के क्रम और परिणाम को व्यक्त करने के लिए ‘इस प्रकार’ कहा गया है।
- source_word: גְּבוּל קָדְשׁוֹ
  choice: अपने पवित्र प्रदेश में
  rationale: גְּבוּל का अर्थ सीमा, सीमाक्षेत्र या प्रदेश हो सकता है। यहाँ गंतव्य के रूप में भूमि अभिप्रेत होने से ‘प्रदेश’ स्वाभाविक है; קָדְשׁוֹ के संबंध और स्वामित्व को ‘अपने पवित्र’ बनाए रखता है।
- source_word: הַר זֶה
  choice: इस पर्वत पर
  rationale: संकेतवाचक और विशिष्ट पदबंध ‘यह/इस पर्वत’ को सुरक्षित रखा गया है। हिंदी में गति के साथ ‘पर्वत पर’ अधिक स्वाभाविक है।
- source_word: קָנְתָה
  choice: प्राप्त किया था
  rationale: קנה में प्राप्त करना, अधिकार में लेना, खरीदना और कुछ प्रसंगों में रचना शामिल हैं। यहाँ परमेश्वर के दाहिने हाथ द्वारा भूभाग को हासिल करने के अर्थ में ‘प्राप्त किया’ व्यापकता को अनावश्यक रूप से सीमित नहीं करता।
- source_word: יְמִינוֹ
  choice: उसके दाहिने हाथ
  rationale: मूल का मानवरूपी बिंब ज्यों का त्यों रखा गया है; यह सामर्थ्य और विजय को सूचित करता है।
theological_decisions:
- issue: ‘इस पर्वत’ का संदर्भ
  choice: मुख्य पाठ में ‘इस पर्वत’ रखा गया है, बिना इसे सिय्योन या कनान के रूप में निश्चित किए।
  alternative: सिय्योन; कनान का पहाड़ी प्रदेश; इस्राएल को दिया गया पर्वतीय देश
  rationale: पद स्वयं संदर्भ को स्पष्ट नाम नहीं देता। व्यापक भजन भूमि और सिय्योन दोनों की ओर संकेत कर सकता है, इसलिए मूल की खुली अर्थ-संभावना सुरक्षित रखी गई है।
- issue: प्रदेश को प्राप्त करने का अर्थ
  choice: प्राप्त किया
  alternative: जीता; अधिकार में लिया; खरीदा; रचा
  rationale: क्रिया की अर्थ-सीमा को किसी व्यावसायिक लेन-देन, सृष्टि-विधान या केवल सैन्य विजय तक सीमित नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिंदी का गरिमापूर्ण, सहज काव्यात्मक गद्य। डैश द्वारा दूसरे अर्धपद को पहले ‘पवित्र प्रदेश’ की समानाधिकरणात्मक व्याख्या के रूप में रखा गया है। ‘पहाड़’ की अपेक्षा ‘पर्वत’ भजन की गरिमा के अनुकूल है।
