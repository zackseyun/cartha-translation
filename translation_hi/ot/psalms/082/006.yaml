  text: אֲֽנִי אָ֭מַרְתִּי אֱלֹהִ֣ים אַתֶּ֑ם וּ/בְנֵ֖י עֶלְי֣וֹן כֻּלְּ/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/082/006.yaml
  text: I said, “You are gods, and all of you are sons of the Most High.”
translation:
  language: hi
  text: मैंने कहा, “तुम देवता हो, और तुम सब परमप्रधान के पुत्र हो।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֱלֹהִים
  choice: देवता
  rationale: यहाँ बहुवचन संबोधन है; ‘देवता’ मूल शब्द की अर्थगत और व्याकरणिक अस्पष्टता को बनाए रखता है, बिना संदर्भित व्यक्तियों की पहचान पहले से तय किए।
- source_word: עֶלְיוֹן
  choice: परमप्रधान
  rationale: ईश्वर के लिए प्रयुक्त इस उपाधि का प्रचलित, गरिमापूर्ण और अर्थ-सटीक हिन्दी रूप।
- source_word: בְנֵי
  choice: पुत्र
  rationale: हिब्रू संबंध-वाचक अभिव्यक्ति का सीधा रूप, जो मूल पाठ की पारिवारिक और पदगत भाषा को सुरक्षित रखता है।
- source_word: כֻּלְּכֶם
  choice: तुम सब
  rationale: द्वितीय पुरुष बहुवचन और समावेशी बल को स्वाभाविक हिन्दी में स्पष्ट करता है।
theological_decisions:
- issue: אֱלֹהִים से संबोधित समूह की पहचान
  choice: ‘देवता’ रखकर पहचान को अनिर्णीत छोड़ा गया
  alternative: ‘न्यायाधीश’ या ‘ईश्वरीय प्राणी’
  rationale: पद स्वयं संबोधित समूह को स्पष्ट रूप से परिभाषित नहीं करता; किसी विशिष्ट व्याख्या को अनुवाद में आरोपित नहीं किया गया।
- issue: ‘परमप्रधान के पुत्र’ का आशय
  choice: मूल संबंधपरक भाषा को ज्यों का त्यों रखा गया
  alternative: ‘परमप्रधान की संतान’ या व्याख्यात्मक पदवी
  rationale: ‘पुत्र’ मूल के औपचारिक और धर्मवैचारिक तनाव को बनाए रखता है; इसे जैविक या केवल पदवीगत अर्थ में सीमित नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी; संक्षिप्त, गरिमापूर्ण और सामान्य पाठक के लिए सहज। पद की काव्यात्मक समानांतरता तथा मूल की व्याख्यात्मक खुलावट सुरक्षित रखी गई है।
