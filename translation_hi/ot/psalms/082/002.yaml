  yaml_path: translation/ot/psalms/082/002.yaml
  text: How long will you judge unjustly and show partiality to the wicked? Selah[a]
translation:
  language: hi
  text: तुम कब तक अन्यायपूर्ण रीति से न्याय करते रहोगे और दुष्टों के प्रति पक्षपात करते रहोगे? सेला।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक अर्थ है, “दुष्टों का मुख उठाना”; यह किसी के प्रति पक्षपात या कृपा दिखाने का मुहावरा है।
    reason: lexical_alternative
lexical_decisions:
- source_word: עַד מָתַי
  choice: कब तक
  rationale: यह समयवाचक प्रश्न फटकार व्यक्त करता है; आधुनिक हिन्दी में ‘कब तक’ स्वाभाविक और प्रभावपूर्ण है।
- source_word: תִּשְׁפְּטוּ
  choice: न्याय करते रहोगे
  rationale: अपूर्ण क्रिया का बहुवचन रूप यहाँ जारी आचरण पर प्रश्नात्मक फटकार है; ‘करते रहोगे’ इस निरंतरता और विरोध को स्पष्ट करता है।
- source_word: עָוֶל
  choice: अन्याय से
  rationale: संज्ञा यहाँ क्रियाविशेषणीय ढंग से न्याय करने की अन्यायपूर्ण रीति बताती है; ‘अन्याय से’ स्रोत की संज्ञात्मक छाया भी बनाए रखता है।
- source_word: וּפְנֵי רְשָׁעִים תִּשְׂאוּ
  choice: और दुष्टों का पक्ष लेते रहोगे
  rationale: शाब्दिक रूप से ‘दुष्टों का मुख उठाना’ न्यायिक संदर्भ में पक्षपात या कृपा दिखाने का मुहावरा है; हिन्दी में ‘पक्ष लेना’ अर्थ को सहज रूप से व्यक्त करता है।
- source_word: רְשָׁעִים
  choice: दुष्टों
  rationale: यह नैतिक रूप से दोषी लोगों की सामान्य श्रेणी को व्यक्त करता है, बिना इसे केवल कानूनी अपराध तक सीमित किए।
- source_word: סֶלָה
  choice: सेला
  rationale: इस संगीतात्मक या पाठ-संबंधी संकेत का सटीक अर्थ अनिश्चित है; इसलिए व्याख्यात्मक अनुवाद के बजाय लिप्यंतरण रखा गया है।
theological_decisions:
- issue: दुष्टों के प्रति न्यायिक पक्षपात का मुहावरा
  choice: दुष्टों का पक्ष लेते रहोगे
  alternative: दुष्टों का मुख उठाते रहोगे
  rationale: अर्थगत अनुवाद भ्रष्ट न्याय की निंदा को स्पष्ट रखता है, जबकि शाब्दिक रूप हिन्दी में अस्पष्ट होता; पद में कोई अतिरिक्त सांप्रदायिक या सैद्धांतिक अर्थ नहीं जोड़ा गया।
translation_notes:
  register: भाषा आधुनिक, सरल और गरिमापूर्ण रखी गई है। बहुवचन संबोधन के लिए ‘तुम’ स्रोत के द्वितीय पुरुष बहुवचन को स्वाभाविक हिन्दी में व्यक्त करता है। ‘सेला’ का अनिश्चित अर्थ सुरक्षित रखने के लिए उसका लिप्यंतरण किया गया है।
