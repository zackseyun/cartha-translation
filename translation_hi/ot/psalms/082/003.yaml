  text: שִׁפְטוּ דַ֥ל וְ/יָת֑וֹם עָנִ֖י וָ/רָ֣שׁ הַצְדִּֽיקוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/082/003.yaml
  text: Defend the weak and the fatherless; vindicate the afflicted and the poor.
translation:
  language: hi
  text: 'निर्बल और अनाथ के पक्ष में न्याय करो;

    पीड़ित और निर्धन को न्याय दिलाओ।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שִׁפְטוּ
  choice: न्याय करो
  rationale: मूल क्रिया का अर्थ यहाँ केवल मुकदमा सुनना नहीं, बल्कि निर्बल और अनाथ के लिए न्यायपूर्ण निर्णय करना है; ‘के पक्ष में’ इस प्रसंगगत आशय को स्वाभाविक हिन्दी में स्पष्ट करता है।
- source_word: דַּל
  choice: निर्बल
  rationale: यह शब्द सामाजिक या आर्थिक रूप से कमजोर व्यक्ति को सूचित कर सकता है; ‘निर्बल’ मूल की व्यापकता बनाए रखता है।
- source_word: יָתוֹם
  choice: अनाथ
  rationale: इब्रानी शब्द सामान्यतः पिता-विहीन या अभिभावकहीन बच्चे के लिए है; आधुनिक हिन्दी में ‘अनाथ’ इसका सहज समतुल्य है।
- source_word: עָנִי
  choice: पीड़ित
  rationale: शब्द में दीनता, कष्ट और उत्पीड़न का भाव है; निकटवर्ती गरीबी-सूचक शब्द से भेद बनाए रखने के लिए ‘पीड़ित’ चुना गया है।
- source_word: רָשׁ
  choice: निर्धन
  rationale: यह अभावग्रस्त या गरीब व्यक्ति को दर्शाता है; ‘निर्धन’ सटीक और गरिमापूर्ण आधुनिक हिन्दी है।
- source_word: הַצְדִּיקוּ
  choice: न्याय दिलाओ
  rationale: हिफ़ील रूप का आशय यहाँ पीड़ित और निर्धन को निर्दोष घोषित करना मात्र नहीं, बल्कि उनका उचित दावा मानकर उन्हें न्याय दिलाना है।
theological_decisions:
- issue: הַצְדִּיקוּ में ‘धर्मी ठहराने’ और ‘न्याय दिलाने’ का संबंध
  choice: न्याय दिलाओ
  alternative: निर्दोष ठहराओ / अधिकार की रक्षा करो
  rationale: न्यायालय-सदृश संदर्भ में क्रिया का अर्थ उनके पक्ष में सही निर्णय देकर न्याय स्थापित करना है। ‘न्याय दिलाओ’ इस क्रियात्मक आशय को व्यक्त करता है और यहाँ किसी विशिष्ट धर्मसैद्धांतिक ‘धर्मी ठहराए जाने’ की धारणा को अनावश्यक रूप से आरोपित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण आज्ञार्थक शैली रखी गई है। दोनों पंक्तियों की इब्रानी समानांतरता को ‘न्याय करो / न्याय दिलाओ’ द्वारा बनाए रखते हुए דל, עני और רשׁ के अर्थगत भेद को क्रमशः ‘निर्बल’, ‘पीड़ित’ और ‘निर्धन’ से व्यक्त किया गया है।
