lexical_decisions:
- source_word: קוּמָה
  choice: उठ
  rationale: קום का यह आग्रहसूचक एकवचन रूप परमेश्वर से हस्तक्षेप करने की प्रार्थना है। ‘उठ’ आधुनिक, स्वाभाविक और तात्कालिकता से भरा है; वैकल्पिक ‘उठ खड़ा हो’ को पादटिप्पणी में रखा गया है।
- source_word: אֱלֹהִים
  choice: हे परमेश्वर
  rationale: एकवचन क्रियाओं और सर्वनाम से संबोधित सत्ता एकवचन है। ‘हे परमेश्वर’ हिन्दी प्रार्थना में स्वाभाविक प्रत्यक्ष संबोधन है।
- source_word: שָׁפְטָה
  choice: न्याय कर
  rationale: שׁפט में न्यायिक निर्णय और राजकीय शासन दोनों की छाया हो सकती है। ‘न्याय कर’ मूल का प्रमुख अर्थ सुरक्षित रखता है और इसे केवल शासन या दोषमुक्ति तक सीमित नहीं करता।
- source_word: הָאָרֶץ
  choice: पृथ्वी
  rationale: ‘सब राष्ट्रों’ के समानांतर यहाँ स्थानीय ‘देश’ की अपेक्षा विश्वव्यापी ‘पृथ्वी’ अभिप्रेत है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यह प्रार्थना का आधार प्रस्तुत करता है; ‘क्योंकि’ आधुनिक हिन्दी में कारण-संबंध स्पष्ट और स्वाभाविक बनाता है।
- source_word: אַתָּה
  choice: तू ही
  rationale: हिब्रू में स्पष्ट सर्वनाम बलाघात देता है। ‘ही’ उस जोर को हिन्दी में व्यक्त करता है, जबकि परमेश्वर के लिए ‘तू’ भजन की सीधी, निकट प्रार्थना की शैली बनाए रखता है।
- source_word: תִנְחַל
  choice: विरासत में पाएगा
  rationale: נחל विरासत पाने और फलतः अधिकार में लेने का अर्थ देता है। यह चयन विरासत की बाइबलीय छाया बनाए रखता है; ‘अपने अधिकार में लेगा’ को पादटिप्पणी में विकल्प के रूप में दिया गया है।
- source_word: בְּכָל הַגּוֹיִם
  choice: सब राष्ट्रों को
  rationale: נחל के साथ यह पदबंध उन सभी राष्ट्रों को विरासत/अधिकार की वस्तु के रूप में दर्शाता है। हिन्दी में कर्मचिह्न ‘को’ इस संबंध को स्वाभाविक ढंग से व्यक्त करता है।
theological_decisions:
- issue: תִנְחַל בְּכָל הַגּוֹיִם में परमेश्वर और राष्ट्रों का संबंध
  choice: क्योंकि तू ही सब राष्ट्रों को विरासत में पाएगा
  alternative: क्योंकि तू ही सब राष्ट्रों को अपने अधिकार में लेगा
  rationale: पद पृथ्वी का न्याय करने की विनती को राष्ट्रों पर परमेश्वर के सार्वभौमिक दावे से जोड़ता है। ‘विरासत में पाएगा’ נחל की विरासत-संबंधी और राजकीय अर्थछाया बचाता है, जबकि विकल्प अधिकार ग्रहण करने के निहित परिणाम को स्पष्ट करता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण प्रार्थनात्मक शैली। परमेश्वर को प्रत्यक्ष संबोधन में ‘तू’ मूल के एकवचन और भजन की निकटता को व्यक्त करता है। मुख्य पाठ में सभी पादटिप्पणी-चिह्न उपस्थित होने चाहिए; इसलिए अंतिम प्रकाशन-पाठ में ‘पाएगा’ के बाद [b] अपेक्षित है।
