source:
  edition: WLC
  text: לֹ֤א יָֽדְע֨וּ וְ/לֹ֥א יָבִ֗ינוּ בַּ/חֲשֵׁכָ֥ה יִתְהַלָּ֑כוּ יִ֝מּ֗וֹטוּ כָּל מ֥וֹסְדֵי אָֽרֶץ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/082/005.yaml
  text: They do not know[a], and they do not understand; they walk about in darkness[b]; all the foundations of the earth are shaken.
translation:
  language: hi
  text: वे न तो जानते हैं, न समझते हैं; वे अंधकार में चलते फिरते हैं; पृथ्वी की सारी नींवें डगमगा रही हैं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לֹא יָדְעוּ
  choice: वे न तो जानते हैं
  rationale: ידע का कालगत रूप यहाँ अगले अपूर्ण रूप के समानांतर वर्तमान अज्ञान की अवस्था बताता है; ‘जानते हैं’ स्वाभाविक हिन्दी में इसे स्पष्ट रखता है।
- source_word: וְלֹא יָבִינוּ
  choice: न समझते हैं
  rationale: בין का हिफ़ील रूप समझने या परखने का भाव रखता है। ‘समझते हैं’ पहले खंड के साथ काव्यात्मक समानांतरता बनाए रखता है।
- source_word: בַּחֲשֵׁכָה
  choice: अन्धकार में
  rationale: पूर्वसर्ग सहित संज्ञा स्थानगत अर्थ देती है; यह हिन्दी में स्वाभाविक तथा मूल बिंब के निकट है।
- source_word: יִתְהַלָּכוּ
  choice: भटकते फिरते हैं
  rationale: הלך का हितपाएल रूप लगातार इधर-उधर चलते रहने का भाव दे सकता है। ‘भटकते फिरते हैं’ अन्धकार के बिंब में दिशाहीन व्यवहार को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: יִמּוֹטוּ
  choice: डगमगा रही हैं
  rationale: מוט का निफ़ाल हिलने, अस्थिर होने या डगमगाने का अर्थ देता है। यह चयन पूर्ण पतन का अर्थ जोड़े बिना अस्थिरता व्यक्त करता है।
- source_word: כָּל מוֹסְדֵי אָרֶץ
  choice: पृथ्वी की सारी नींवें
  rationale: מוֹסְדֵי आधारों या नींवों को सूचित करता है, और इस व्यापक काव्यात्मक संदर्भ में אָרֶץ के लिए ‘पृथ्वी’ उपयुक्त है।
theological_decisions:
- issue: אָרֶץ का दायरा और विश्वव्यापी अस्थिरता का बिंब
  choice: ‘पृथ्वी’—अर्थात व्यापक सृष्टि या विश्व-व्यवस्था का बिंब
  alternative: ‘देश/भूमि’—स्थानीय भूभाग का संकेत
  rationale: भजन में अन्याय का प्रभाव व्यापक व्यवस्था की स्थिरता तक पहुँचता दिखाया गया है। ‘पृथ्वी’ मूल की व्यापक काव्यात्मक संभावना सुरक्षित रखता है, बिना बिंब को व्याख्यात्मक गद्य में बदलने के।
translation_notes:
  register: आधुनिक मानक हिन्दी का संक्षिप्त, गरिमापूर्ण काव्यात्मक गद्य। ‘न तो…न…’ समानांतरता को सहज बनाता है; ‘नींवें’ प्रचलित हिन्दी बहुवचन है। मूल पाठ की मुख्य शब्दगत अस्पष्टताएँ अनुवाद में ‘डगमगा’ और ‘पृथ्वी’ द्वारा पर्याप्त रूप से सुरक्षित हैं, इसलिए पादटिप्पणी आवश्यक नहीं मानी गई।
