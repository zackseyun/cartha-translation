  yaml_path: translation/ot/psalms/082/007.yaml
  text: Nevertheless[a], you will die like men[b], and fall like one of the princes.
translation:
  language: hi
  text: फिर भी[a] तुम मनुष्यों[b] के समान मरोगे, और शासकों में से किसी एक के समान गिरोगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “निश्चय ही।”
    reason: אָכֵן के बलयुक्त वैकल्पिक अर्थ को सुरक्षित रखना।
  - marker: b
    text: या, “आदम के समान,” यदि यहाँ सामान्य मानवजाति के बजाय पहले मनुष्य की ओर संकेत माना जाए।
    reason: כְּאָדָם की वास्तविक वैकल्पिक व्याख्या को उसके संबंधित पदांश पर सुरक्षित रखना।
lexical_decisions:
- source_word: אָכֵן
  choice: फिर भी
  rationale: यह पिछले पद में बताए गए ऊँचे पद और अब सुनाए जा रहे मृत्यु-दण्ड के बीच बलयुक्त विरोध प्रकट करता है।
- source_word: כְּאָדָם
  choice: मनुष्यों के समान
  rationale: אָדָם यहाँ सामान्य मानवजाति या मनुष्य की नश्वरता को सूचित करता है; स्वाभाविक हिन्दी में बहुवचन इस प्रतिनिधिक अर्थ को स्पष्ट करता है, जबकि 'आदम के समान' की वास्तविक संभावना पादटिप्पणी में रखी गई है।
- source_word: תְּמוּתוּן
  choice: तुम ... मरोगे
  rationale: मूल का द्वितीय पुरुष बहुवचन अपूर्ण रूप इस न्याय-वचन में भावी परिणाम बताता है।
- source_word: וּכְאַחַד
  choice: और ... में से किसी एक के समान
  rationale: यह किसी वर्ग के एक सदस्य से तुलना करता है; हिन्दी में यह संरचना अर्थ को स्पष्ट और स्वाभाविक रखती है।
- source_word: הַשָּׂרִים
  choice: शासकों
  rationale: שׂרים उच्च पदस्थ शासकों, प्रधानों या राजकुमारों का बोध करा सकता है; भजन के न्यायाधीन अधिकारियों के संदर्भ में 'शासक' व्यापक और सहज है।
- source_word: תִּפֹּלוּ
  choice: गिरोगे
  rationale: यह न्याय के अधीन पतन का रूपक बनाए रखता है और मूल क्रिया का सीधा अर्थ देता है।
theological_decisions:
- issue: כְּאָדָם में אָדָם का अर्थ
  choice: 'मुख्य पाठ में सामान्य मानवजाति: ''मनुष्यों के समान'''
  alternative: '''आदम के समान''—पहले मनुष्य के संकेत के रूप में'
  rationale: तात्कालिक संदर्भ ऊँचा दर्जा पाने वालों की साधारण मानवीय नश्वरता से उसका विरोध करता है। फिर भी व्यक्तिवाचक 'आदम' का अर्थ भाषिक रूप से संभव है, इसलिए उसे पादटिप्पणी में सुरक्षित रखा गया है।
- issue: הַשָּׂרִים का पद-सूचक अर्थ
  choice: शासक
  alternative: राजकुमार या प्रधान
  rationale: मूल शब्द कई प्रकार के उच्च पदस्थ अधिकारियों को सूचित कर सकता है। 'शासक' संदर्भ के अनुकूल व्यापक अर्थ देता है और किसी विशेष राजकीय व्यवस्था को अनावश्यक रूप से निश्चित नहीं करता।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी। मूल के द्वितीय पुरुष बहुवचन और पतन के रूपक को बनाए रखा गया है; अनावश्यक पुरातन या सांप्रदायिक शब्दावली से बचा गया है।
