  yaml_path: translation/ot/psalms/082/000.yaml
  text: A psalm of Asaph[a]. God stands in the assembly of God; in the midst of the gods he judges.
translation:
  language: hi
  text: 'आसाप का भजन।


    परमेश्वर ईश्वर की सभा में खड़ा है;


    देवताओं[a] के बीच वह न्याय करता है।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “दिव्य प्राणियों।” कुछ लोग यहाँ “देवताओं” से मानवीय न्यायाधीशों या शासकों को समझते हैं।
    reason: alternative_reading
lexical_decisions:
- source_word: מִזְמוֹר לְאָסָף
  choice: आसाप का भजन
  rationale: शीर्षक को उसके स्वाभाविक संबंध सहित संक्षेप और परंपरागत ढंग से व्यक्त किया गया है; हिब्रू संबंधसूचक לְ की संभावित व्यापकता को किसी निश्चित लेखकत्व-दावे से अधिक नहीं बढ़ाया गया।
- source_word: אֱלֹהִים
  choice: परमेश्वर / देवताओं
  rationale: पहली बार एकवचन क्रिया के साथ यह इस्राएल के परमेश्वर को सूचित करता है, जबकि दूसरी बार सभा के सदस्यों के लिए अर्थानुसार बहुवचन ‘देवताओं’ रखा गया है; इसकी व्याख्यात्मक संभावनाएँ पादटिप्पणी में दी गई हैं।
- source_word: עֲדַת אֵל
  choice: ईश्वर की सभा
  rationale: हिब्रू पदबंध का औपचारिक संबंध सुरक्षित रखते हुए ‘सभा’ चुना गया है; ‘स्वर्गीय परिषद’ जैसा अधिक व्याख्यात्मक विस्तार मुख्य पाठ में नहीं जोड़ा गया।
- source_word: יִשְׁפֹּט
  choice: न्याय करता है
  rationale: क्रिया का सामान्य न्यायिक अर्थ और वर्तमान दृश्य की सजीवता दोनों बनाए रखे गए हैं।
theological_decisions:
- issue: सभा में אֱלֹהִים की पहचान
  choice: मुख्य पाठ में ‘देवताओं’
  alternative: ‘दिव्य प्राणियों’, ‘न्यायियों’ या ‘शासकों’
  rationale: बहुवचन रूप को मुख्य पाठ में प्रत्यक्ष रखा गया है और उसे मनुष्य न्यायियों अथवा स्वर्गीय प्राणियों में से किसी एक के रूप में निर्णायक ढंग से सीमित नहीं किया गया; प्रमुख वैकल्पिक समझ पादटिप्पणी में दर्ज है।
- issue: परमेश्वर का सभा में खड़ा होना
  choice: ‘खड़ा है’ का सीधा चित्र बनाए रखा
  alternative: ‘अध्यक्षता करता है’
  rationale: ‘अध्यक्षता’ प्रसंगानुकूल हो सकती है, पर वह נִצָּב के ठोस चित्र को व्याख्यात्मक रूप से विस्तृत करती; इसलिए मूल की न्यायसभा-संबंधी तनावपूर्ण छवि सुरक्षित रखी गई।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और काव्यात्मक पंक्ति-विन्यास रखा गया है। ‘परमेश्वर’ और ‘ईश्वर’ का साथ-साथ प्रयोग हिब्रू אֱלֹהִים और אֵל के निकट संबंध को दिखाता है, यद्यपि हिन्दी में अनावश्यक पुनरुक्ति से बचाता है। पादटिप्पणी-चिह्न उसी विवादित बहुवचन पद ‘देवताओं’ पर लगाया गया है।
