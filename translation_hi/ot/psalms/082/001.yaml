  text: A psalm of Asaph[a]. God stands in the divine assembly; in the midst of the gods he judges.
translation:
  language: hi
  text: 'आसाफ का भजन।


    परमेश्वर ईश्वरीय सभा में खड़ा है;

    देवताओं[a] के बीच वह न्याय करता है।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “दिव्य प्राणी।” कुछ लोग यहाँ “देवताओं” को मानवीय न्यायाधीश या शासक समझते हैं।
    reason: दूसरे אֱלֹהִים की अर्थगत और व्याख्यात्मक अस्पष्टता को सुरक्षित रखना।
lexical_decisions:
- source_word: מִזְמוֹר
  choice: भजन
  rationale: भजन-संग्रह की शीर्षक-परंपरा के लिए यह मानक, स्वाभाविक और विधागत रूप से उपयुक्त हिन्दी शब्द है।
- source_word: לְאָסָף
  choice: आसाफ का
  rationale: לְ यहाँ रचना, संबंध या समर्पण का संकेत दे सकता है। ‘आसाफ का’ इन संभावनाओं को अनावश्यक रूप से अधिक स्पष्ट किए बिना स्वाभाविक हिन्दी देता है।
- source_word: אֱלֹהִים (पहला प्रयोग)
  choice: परमेश्वर
  rationale: एकवचन कृदंत נִצָּב और आगे एकवचन क्रिया יִשְׁפֹּט से यहाँ इस्राएल के परमेश्वर का एकवचन कर्ता होना स्पष्ट है।
- source_word: נִצָּב
  choice: खड़ा है
  rationale: यह न्यायिक सभा में परमेश्वर की खड़ी मुद्रा को सीधे व्यक्त करता है और वर्तमान कृदंत का दृश्यात्मक बल बनाए रखता है।
- source_word: בַּעֲדַת אֵל
  choice: ईश्वरीय सभा में
  rationale: עֵדָה एक एकत्रित सभा है और אֵל इस प्रसंग में उसके दिव्य स्वरूप को बताता है। ‘ईश्वरीय सभा’ स्वाभाविक हिन्दी में स्वर्गीय-न्यायिक परिवेश को व्यक्त करती है, यद्यपि ‘परमेश्वर की सभा’ भी व्याकरणतः संभव है।
- source_word: בְּקֶרֶב
  choice: के बीच
  rationale: यह समूह के मध्य परमेश्वर की स्थिति बताता है; ‘के बीच’ आधुनिक हिन्दी में संक्षिप्त और स्वाभाविक है।
- source_word: אֱלֹהִים (दूसरा प्रयोग)
  choice: देवताओं
  rationale: यहाँ शब्द बहुवचन समूह को सूचित करता है, जिसके बीच परमेश्वर खड़ा होकर न्याय करता है। ‘देवताओं’ मूल शब्द की सीधी बहुवचन शक्ति बनाए रखता है; संभावित अर्थ ‘दिव्य प्राणी’ और मानवीय न्यायियों की व्याख्या पादटिप्पणी में दी गई है।
- source_word: יִשְׁפֹּט
  choice: वह न्याय करता है
  rationale: שפט का इस सभा-परिवेश में न्यायिक अर्थ है। यह रूप संक्षिप्त है और मूल के न्यायालय-सदृश चित्र को बनाए रखता है।
theological_decisions:
- issue: भजन 82:1 में दूसरे אֱלֹהִים का अभिप्राय
  choice: मुख्य पाठ में ‘देवताओं’
  alternative: ‘दिव्य प्राणी’; अथवा मानवीय न्यायी या शासक
  rationale: पहला אֱלֹהִים एकवचन कर्ता है, जबकि दूसरा उसके बीच स्थित एक बहुवचन समूह है। निकट प्रसंग और ‘ईश्वरीय सभा’ स्वर्गीय सभा की ओर संकेत करते हैं, पर मानवीय शासकों की व्याख्या भी प्रचलित है। मुख्य पाठ मूल की स्पष्ट शब्दावली रखता है और पादटिप्पणी विकल्पों को बिना निर्णायक रूप से मिटाए सुरक्षित रखती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सहज रखी गई है। अर्धविराम मूल की दो समांतर न्यायिक पंक्तियों को जोड़ता है। पादटिप्पणी-चिह्न उसी शब्द के बाद रखा गया है जिसकी वैकल्पिक व्याख्या दी गई है।
