base_translation:
  language: en
  yaml_path: translation/ot/psalms/082/004.yaml
  text: Rescue the poor and needy[a]; deliver them from the hand of the wicked.
translation:
  language: hi
  text: 'निर्धन और ज़रूरतमंद[a] को बचाओ;

    उन्हें दुष्टों के हाथ से छुड़ाओ।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “दुर्बल और ज़रूरतमंद।” इब्रानी शब्द דַּל का अर्थ “निर्धन” या “दुर्बल” हो सकता है; इसमें गरीबी के साथ असहायता भी निहित है।
    reason: lexical_alternative
lexical_decisions:
- source_word: פַּלְּטוּ
  choice: बचाओ
  rationale: पुल्लिंग बहुवचन आज्ञार्थक रूप सक्रिय हस्तक्षेप करके किसी को सुरक्षित निकालने का आह्वान करता है; ‘बचाओ’ सहज, तात्कालिक और संदर्भानुकूल है।
- source_word: דַל
  choice: निर्धन
  rationale: यह शब्द निर्धन, दुर्बल या सामाजिक रूप से असहाय व्यक्ति को सूचित कर सकता है। אֶבְיוֹן के साथ न्याय-संबंधी संदर्भ में ‘निर्धन’ आर्थिक और सामाजिक असुरक्षा को स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: אֶבְיוֹן
  choice: ज़रूरतमंद
  rationale: यह अभावग्रस्त या अत्यंत दरिद्र व्यक्ति को दर्शाता है। ‘ज़रूरतमंद’ דַל से अर्थगत निकटता रखते हुए भी दोनों शब्दों का भेद बनाए रखता है।
- source_word: מִיַּד
  choice: के हाथ से
  rationale: इब्रानी मुहावरा किसी की शक्ति, पकड़ या नियंत्रण से छुटकारे को व्यक्त करता है। हिंदी में ‘के हाथ से’ स्रोत की देहात्मक छवि को स्पष्ट रूप से बनाए रखता है।
- source_word: רְשָׁעִים
  choice: दुष्टों
  rationale: बहुवचन संज्ञार्थक विशेषण नैतिक रूप से दोषी अत्याचारियों को दर्शाता है। ‘दुष्टों’ संक्षिप्त और लिंग-समावेशी है तथा नैतिक बल बनाए रखता है।
- source_word: הַצִּילוּ
  choice: छुड़ाओ
  rationale: बहुवचन आज्ञार्थक रूप संकट या शत्रुतापूर्ण अधिकार से निकालने का आदेश देता है। ‘छुड़ाओ’ पहले ‘बचाओ’ से संबंधित किंतु अलग क्रिया रखकर काव्यात्मक समानांतरता बनाए रखता है।
theological_decisions:
- issue: दो समानांतर आज्ञार्थक क्रियाओं की काव्यात्मक शक्ति
  choice: 'दो आदेश बनाए रखे गए: ‘बचाओ; ... छुड़ाओ।’'
  alternative: 'एक ही आदेश में समेटना: ‘निर्धन और ज़रूरतमंद को दुष्टों के हाथ से बचाओ।’'
  rationale: इब्रानी में दो आज्ञार्थक क्रियाएँ हैं, जो निर्बलों के पक्ष में हस्तक्षेप की पुकार को तीव्र करती हैं। दोनों को बनाए रखने से काव्यात्मक और नैतिक आग्रह सुरक्षित रहता है।
- issue: דַל में आर्थिक निर्धनता और दुर्बलता की अर्थगत व्यापकता
  choice: मुख्य पाठ में ‘निर्धन’, और पादटिप्पणी में ‘दुर्बल’ विकल्प
  alternative: मुख्य पाठ में ‘दुर्बल’
  rationale: אֶבְיוֹן के साथ न्याय के संदर्भ में निर्धनता प्रमुख है, पर דַל सामाजिक या शारीरिक दुर्बलता भी व्यक्त कर सकता है; पादटिप्पणी इस वास्तविक अस्पष्टता को सुरक्षित रखती है।
translation_notes:
  register: आधुनिक मानक हिंदी का सहज और गरिमापूर्ण आज्ञार्थक बहुवचन प्रयोग किया गया है। अर्धविराम इब्रानी की दो समानांतर आज्ञाओं को अलग रखते हुए उनकी निकटता दिखाता है।
