  text: יְֽהוָ֗ה אָ֭הַבְתִּי מְע֣וֹן בֵּיתֶ֑/ךָ וּ֝/מְק֗וֹם מִשְׁכַּ֥ן כְּבוֹדֶֽ/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/026/008.yaml
  text: O Yahweh[a], I love the habitation of your house, the place where your glory dwells.
translation:
  language: hi
  text: हे यहवे, मुझे वह निवास-स्थान प्रिय है जो आपका भवन है, और वह स्थान जहाँ आपकी महिमा वास करती है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: हे यहवे
  rationale: परमेश्वर के व्यक्तिगत नाम को उपाधि से बदलने के बजाय देवनागरी में लिप्यंतरित किया गया है; सम्बोधन को व्यक्त करने के लिए ‘हे’ रखा गया है।
- source_word: אָהַבְתִּי
  choice: मुझे ... प्रिय है
  rationale: इब्रानी पूर्ण क्रिया यहाँ भजनकार की स्थिर वर्तमान अभिवृत्ति व्यक्त करती है। हिंदी में ‘मुझे ... प्रिय है’ स्वाभाविक और गरिमापूर्ण है।
- source_word: מְעוֹן בֵּיתֶךָ
  choice: आपके भवन का निवास
  rationale: מְעוֹן के निवास-स्थान संबंधी ठोस अर्थ और בֵּיתֶךָ के शाब्दिक ‘आपके भवन’ को बनाए रखा गया है; ‘मन्दिर’ कहकर संदर्भ को आवश्यकता से अधिक निश्चित नहीं किया गया।
- source_word: וּמְקוֹם
  choice: और वह स्थान
  rationale: संयोजक ו और ‘स्थान’ का अर्थ स्पष्ट रखा गया है; ‘वह’ हिंदी में अगले संबंधवाचक उपवाक्य को स्वाभाविक बनाता है।
- source_word: מִשְׁכַּן כְּבוֹדֶךָ
  choice: जहाँ आपकी महिमा वास करती है
  rationale: शाब्दिक संज्ञा-श्रृंखला ‘आपकी महिमा के निवास का स्थान’ की अपेक्षा अर्थ को स्वाभाविक हिंदी संबंधवाचक उपवाक्य में व्यक्त किया गया है।
- source_word: כְּבוֹדֶךָ
  choice: आपकी महिमा
  rationale: כָּבוֹד का ईश्वरीय उपस्थिति और प्रताप से जुड़ा सामान्य अर्थ ‘महिमा’ से ठीक व्यक्त होता है।
theological_decisions:
- issue: पवित्रस्थान की भाषा को कितना विशिष्ट बनाया जाए
  choice: ‘आपके भवन’ और ‘जहाँ आपकी महिमा वास करती है’
  alternative: ‘आपके मन्दिर’ अथवा ‘जहाँ आपकी महिमा विराजमान है’
  rationale: मूल पाठ ‘भवन/घर’ और ‘वास’ की छवि रखता है। उसे बनाए रखने से किसी विशिष्ट स्थापत्य या सिंहासन-संबंधी अर्थ को पाठ में जोड़ा नहीं जाता।
- issue: दिव्य नाम का अनुवाद
  choice: यहवे
  alternative: यहोवा; प्रभु
  rationale: चार अक्षरों वाले व्यक्तिगत दिव्य नाम को किसी उपाधि से प्रतिस्थापित न करके प्रचलित विद्वत्तापूर्ण उच्चारण के निकट हिंदी लिप्यंतरण दिया गया है।
translation_notes:
  register: आधुनिक मानक हिंदी; भक्तिपूर्ण, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध। परमेश्वर के लिए आदरसूचक ‘आप’ का प्रयोग किया गया है।
