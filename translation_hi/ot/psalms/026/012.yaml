    text: या, “समतल स्थान पर”; इब्रानी में सीधेपन या खराई की ध्वनि भी हो सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: רַגְלִי
  choice: मेरा पाँव
  rationale: इब्रानी संज्ञा एकवचन है और उस पर प्रथम पुरुष एकवचन प्रत्यय है; हिंदी में भी एकवचन स्वाभाविक रूप से मूल बिंब को बनाए रखता है।
- source_word: עָמְדָה
  choice: स्थिर है
  rationale: यह स्त्रीलिंग एकवचन पूर्ण क्रिया है, जो काव्य-संदर्भ में स्थापित होकर वर्तमान में बनी हुई अवस्था व्यक्त कर सकती है; ‘स्थिर है’ दृढ़ता और वर्तमान परिणाम दोनों को सहज हिंदी में व्यक्त करता है।
- source_word: בְמִישׁוֹר
  choice: समतल भूमि पर
  rationale: מִישׁוֹר का प्राथमिक ठोस अर्थ समतल या बराबर स्थान है; यह अनुवाद उस दृश्य बिंब को रखता है और सीधेपन अथवा खराई की संभावित नैतिक छाया को अनिर्णीत छोड़ता है।
- source_word: בְמַקְהֵלִים
  choice: सभाओं में
  rationale: बहुवचन रूप एकत्र समुदायों या सभाओं को दर्शाता है; ‘सभाओं में’ आधुनिक, स्पष्ट और अनावश्यक सांप्रदायिक रंग से मुक्त है।
- source_word: אֲבָרֵךְ
  choice: मैं ... धन्य कहूँगा
  rationale: ברך के पिएल रूप का सीधा अर्थ आशीष देना या धन्य कहना है; परमेश्वर के संबंध में ‘धन्य कहूँगा’ हिंदी में अर्थपूर्ण है और इसे केवल ‘स्तुति करूँगा’ में सीमित नहीं करता।
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिंदी बाइबलीय प्रयोग में टेट्राग्राम का प्रचलित व्यक्तिगत नाम-रूप ‘यहोवा’ है; यह किसी पदवी से बदलने के बजाय नाम को नाम के रूप में रखता है।
theological_decisions:
- issue: समतल स्थान के बिंब में नैतिक खराई की संभावित ध्वनि
  choice: मुख्य पाठ में ठोस अर्थ ‘समतल भूमि’ रखा गया
  alternative: सीधाई/खराई में
  rationale: मूल शब्द ठोस भू-आकृति और रूपकात्मक सीधेपन दोनों की गुंजाइश देता है; मुख्य पाठ में ठोस बिंब तथा पादटिप्पणी में वैकल्पिक ध्वनि रखने से अस्पष्टता सुरक्षित रहती है।
- issue: יְהוָה का हिंदी रूप
  choice: यहोवा
  alternative: याहवे
  rationale: दोनों नाम के लिप्यंतरण हैं; आधुनिक हिंदी के व्यापक बाइबलीय पाठक-वर्ग में अधिक पहचाने जाने वाले ‘यहोवा’ को चुना गया है, बिना इसे ‘प्रभु’ जैसी पदवी से प्रतिस्थापित किए।
- issue: אֲבָרֵךְ का परमेश्वर के संदर्भ में अर्थ
  choice: धन्य कहूँगा
  alternative: स्तुति करूँगा
  rationale: ‘धन्य कहूँगा’ मूल क्रिया की शब्दार्थीय विशिष्टता बचाता है, जबकि ‘स्तुति’ उसके आशय का स्वाभाविक परंतु कुछ अधिक व्याख्यात्मक रूप है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। एकवचन ‘पाँव’ और बहुवचन ‘सभाओं’ को मूल के अनुसार सुरक्षित रखा गया है; काव्यात्मक संक्षिप्तता बनाए रखने के लिए दो उपवाक्यों को अर्धविराम से जोड़ा गया है।
