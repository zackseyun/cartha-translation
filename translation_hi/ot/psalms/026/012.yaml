  text: My foot stands on level ground[a]; in the assemblies I will bless Yahweh.
translation:
  language: hi
  text: मेरा पाँव समतल भूमि पर टिका है[a]; सभाओं में मैं याहवे को धन्य कहूँगा।
  philosophy: optimal-equivalence
  footnotes:
