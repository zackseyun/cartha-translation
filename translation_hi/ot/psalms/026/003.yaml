lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले दावे का कारण बताता है; आधुनिक हिन्दी में ‘क्योंकि’ इसका व्याख्यात्मक बल स्वाभाविक रूप से व्यक्त करता है।
- source_word: חַסְדְּךָ
  choice: आपकी अटल प्रेममय निष्ठा
  rationale: חֶסֶד में प्रेम, स्थिरता और संबंधपरक निष्ठा—तीनों निहित हैं। यह पदबंध अर्थ-क्षेत्र को केवल दया या भावना तक सीमित नहीं करता।
- source_word: לְנֶגֶד עֵינַי
  choice: मेरी आँखों के सामने
  rationale: यह मूल बिंब को बनाए रखते हुए उस बात को सूचित करता है जिसे भजनकार निरंतर ध्यान में रखता है।
- source_word: וְהִתְהַלַּכְתִּי
  choice: और मैं ... चला हूँ
  rationale: הלך का आत्मवाचक रूप जीवन-आचरण दर्शा सकता है। ‘चला हूँ’ उस रूपक और पूर्ण क्रिया की वर्तमान प्रासंगिकता दोनों को सुरक्षित रखता है।
- source_word: בַּאֲמִתֶּךָ
  choice: आपकी सच्चाई के मार्ग पर
  rationale: אֱמֶת का अर्थ सच्चाई, सत्यता या विश्वासयोग्यता हो सकता है। ‘के मार्ग पर’ हिन्दी में चलने के रूपक को स्वाभाविक बनाता है, जबकि ‘सच्चाई’ मूल की व्यापकता बनाए रखती है।
theological_decisions:
- issue: ईश्वर के חֶסֶד और אֱמֶת का अर्थ-क्षेत्र
  choice: חֶסֶד को ‘अटल प्रेममय निष्ठा’ और אֱמֶת को ‘सच्चाई’ कहना
  alternative: क्रमशः ‘वाचा की निष्ठा’ और ‘विश्वासयोग्यता’ कहना
  rationale: चुना हुआ अनुवाद प्रेम, निष्ठा, सत्य और भरोसेमंदी के परस्पर जुड़े अर्थों को बनाए रखता है और किसी एक सिद्धान्तगत अर्थ तक सीमित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी; आदरसूचक ‘आप’ का प्रयोग। शैली गरिमापूर्ण और सहज है। ‘अटल प्रेममय निष्ठा’ सामान्य ‘करुणा’ से अधिक स्पष्ट रूप से חֶסֶד की स्थिर, संबंधपरक प्रकृति व्यक्त करती है।
