id: PSA.26.9
reference: Psalms 26:9
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: אַל תֶּאֱסֹ֣ף עִם חַטָּאִ֣ים נַפְשִׁ֑/י וְ/עִם אַנְשֵׁ֖י דָמִ֣ים חַיָּֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/026/009.yaml
  text: Do not gather my soul with sinners[b][a], nor my life with men of bloodshed.
translation:
  language: hi
  text: पापियों के साथ मेरे प्राण को न समेट ले[a], न ही खून बहाने वालों[b] के साथ मेरे जीवन को।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “पापियों के साथ मेरे प्राण को उठा न ले।” इस क्रिया में न्याय के समय दुष्टों के साथ ले जाए जाने का भाव हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से “खूनों के जन”; यह इब्रानी मुहावरा हिंसक या रक्त-दोषी लोगों के लिए है।
    reason: lexical_alternative
lexical_decisions:
- source_word: תֶּאֱסֹף
  choice: समेट ले
  rationale: मूल क्रिया का सामान्य अर्थ इकट्ठा करना है, पर न्याय के प्रसंग में यह दूसरों के साथ उठा लिए जाने या नाश में सम्मिलित किए जाने का भाव भी रखती है। ‘समेट ले’ इस बिंब और प्रसंगगत अर्थ—दोनों को बनाए रखता है।
- source_word: נַפְשִׁי
  choice: मेरे प्राण
  rationale: נֶפֶשׁ व्यक्ति, प्राण या जीवन का बोध करा सकता है। यहाँ חַיָּי के समानांतर होने के कारण ‘मेरे प्राण’ और ‘मेरे जीवन’ मूल के दो अलग, किंतु निकट, काव्यात्मक पदों को बनाए रखते हैं।
- source_word: חַטָּאִים
  choice: पापियों
  rationale: यह संज्ञा पाप से पहचाने जाने वाले लोगों को सीधे दर्शाती है; ‘पापियों’ संक्षिप्त, स्वाभाविक और नैतिक अर्थ में स्पष्ट है।
- source_word: אַנְשֵׁי דָמִים
  choice: खून बहाने वालों
  rationale: शाब्दिक इब्रानी ‘खूनों के जन’ हिंसक या रक्त-दोषी लोगों के लिए मुहावरा है। ‘खून बहाने वाले’ हिंसा और रक्तपात का भाव रखता है, पर अर्थ को केवल विधिक हत्या तक सीमित नहीं करता।
- source_word: חַיָּי
  choice: मेरे जीवन
  rationale: נַפְשִׁי के समानांतर यह स्वाभाविक रूप से ‘मेरे जीवन’ का अर्थ देता है और काव्यात्मक तीव्रता को बनाए रखता है।
- source_word: אַל
  choice: न
  rationale: अपूर्ण क्रिया के साथ אַל निषेधात्मक विनती व्यक्त करता है। हिंदी प्रार्थना में ‘न ... ले’ स्वाभाविक रूप से यही भाव देता है।
theological_decisions:
- issue: נַפְשִׁי और חַיָּי का मानव-स्वरूप संबंधी अर्थ
  choice: दोनों को अलग काव्यात्मक पदों—‘मेरे प्राण’ और ‘मेरे जीवन’—के रूप में रखा गया है।
  alternative: दोनों को अधिक सामान्य रूप से ‘मुझे’ और ‘मेरे जीवन को’ कहना।
  rationale: पद शरीर और आत्मा के संबंध पर कोई तकनीकी सिद्धांत निर्धारित नहीं करता, फिर भी इब्रानी में दो निकट पर भिन्न पद जानबूझकर समानांतर रखे गए हैं। यह अनुवाद उस भिन्नता को बिना अतिरिक्त धर्मवैज्ञानिक निष्कर्ष जोड़े सुरक्षित रखता है।
- issue: दुष्टों के साथ ‘समेटे जाने’ का आशय
  choice: मूल के ‘इकट्ठा करने’ वाले बिंब को रखते हुए न्याय में उनके भाग्य में सम्मिलित किए जाने की संभावना खुली रखी गई है।
  alternative: स्पष्ट रूप से ‘नाश न कर’ या ‘उठा न ले’ कहना।
  rationale: संदर्भ न्याय में साथ ले जाए जाने का भाव सुझाता है, पर क्रिया स्वयं ‘इकट्ठा करना’ भी कहती है। ‘समेट ले’ वास्तविक अर्थगत अस्पष्टता को सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और प्रार्थनात्मक रखी गई है। ‘न ही’ दूसरे समानांतर खंड में छूटी हुई क्रिया को स्वाभाविक हिंदी में जोड़ता है। ‘खून’ सामान्य आधुनिक हिंदी में ‘रक्त’ से अधिक सहज है, जबकि ‘खून बहाने वाले’ मूल की गंभीरता बनाए रखता है।
