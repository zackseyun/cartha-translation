  text: in whose hands is wickedness[a], and whose right hand is full of bribes.
translation:
  language: hi
  text: जिनके हाथों में दुष्टता[a] है, और जिनका दाहिना हाथ घूस से भरा है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘अपराध,’ ‘भ्रष्टता,’ अथवा ‘बुरी योजना।’
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲשֶׁר בִּידֵיהֶם
  choice: जिनके हाथों में
  rationale: सम्बन्धवाचक אֲשֶׁר पिछले पद में आए लोगों का वर्णन आगे बढ़ाता है। यह अनुवाद בִּידֵיהֶם में निहित ‘हाथों में’ की इब्रानी छवि को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: זִמָּה
  choice: दुष्टता
  rationale: इस शब्द का अर्थ दुष्टता, अपराधपूर्ण आचरण, भ्रष्टता या बुरी योजना हो सकता है। घूस के समानांतर यहाँ व्यापक नैतिक बुराई का भाव उपयुक्त है; इसलिए ‘दुष्टता’ चुना गया है और अन्य सम्भावनाएँ पादटिप्पणी में रखी गई हैं।
- source_word: וִימִינָם
  choice: और जिनका दाहिना हाथ
  rationale: इब्रानी के एकवचन सामूहिक रूप और कार्य अथवा सामर्थ्य के साधन के रूप में ‘दाहिने हाथ’ की छवि को सुरक्षित रखा गया है।
- source_word: מָלְאָה
  choice: से भरा है
  rationale: यह वर्तमान दशा का बोध कराने वाले इब्रानी रूप को सहज और स्पष्ट हिन्दी में व्यक्त करता है।
- source_word: שֹׁחַד
  choice: घूस
  rationale: इब्रानी संज्ञा रूपतः एकवचन है, पर यहाँ भ्रष्ट लेन-देन का सामान्य या सामूहिक भाव देती है। हिन्दी में ‘घूस’ इसी अर्थ में स्वाभाविक सामूहिक संज्ञा है।
