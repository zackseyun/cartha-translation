- source_word: בְּקוֹל
  choice: आवाज़
  rationale: בְּ के साथ קוֹל का अर्थ यहाँ स्वर या आवाज़ के माध्यम से व्यक्त करना है; ‘आवाज़’ मूल की मूर्त काव्यात्मक अभिव्यक्ति बनाए रखता है।
- source_word: תּוֹדָה
  choice: धन्यवाद
  rationale: यह शब्द यहाँ बोले या गाए गए आभार को दर्शाता है। ‘धन्यवाद’ आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है तथा व्यापक ‘स्तुति’ की अपेक्षा अधिक सटीक है।
- source_word: וּלְסַפֵּר
  choice: और ... वर्णन करूँ
  rationale: पिएल रूप का अर्थ विस्तार से बताना या गिनाना है। ‘वर्णन करूँ’ काव्यात्मक समानांतरता में स्वाभाविक है और पहले पदांश की क्रिया को अनावश्यक रूप से नहीं दोहराता।
- source_word: כָּל
  choice: सब
  rationale: समग्रता का सीधा अर्थ ‘सब’ है, जो आधुनिक हिन्दी में सहज है।
- source_word: נִפְלְאוֹתֶיךָ
  choice: तेरे ... अद्भुत कामों
  rationale: बहुवचन संज्ञा परमेश्वर के आश्चर्यजनक कार्यों को दर्शाती है। ‘अद्भुत काम’ केवल अमूर्त आश्चर्यों के बजाय क्रियात्मक अर्थ स्पष्ट करता है।
