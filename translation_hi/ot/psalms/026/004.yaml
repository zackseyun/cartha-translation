source:
  edition: WLC
  text: לֹא יָ֭שַׁבְתִּי עִם מְתֵי שָׁ֑וְא וְ/עִ֥ם נַ֝עֲלָמִ֗ים לֹ֣א אָבֽוֹא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/026/004.yaml
  text: I have not sat with men of falsehood[a], and I do not go in with those who conceal themselves.
translation:
  language: hi
  text: 'मैं झूठे लोगों के साथ नहीं बैठा,

    और जो अपने को छिपाए रखते हैं[a], उनके साथ नहीं जाऊँगा।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “छिपे हुए लोगों के साथ नहीं जाऊँगा।” इब्रानी शब्द का अर्थ संभवतः ऐसे लोग हैं जो अपने वास्तविक चरित्र को छिपाते हैं; इसलिए ‘कपटी’ या ‘ढोंगी’ भी संभावित व्याख्याएँ हैं, पर मूल शब्द स्वयं इतना विशिष्ट नहीं है।
    reason: नַעֲלָמִים के शाब्दिक विकल्प और उसके संभावित ‘छलपूर्ण/कपटी’ आशय को बिना किसी एक व्याख्या को अनिवार्य किए सुरक्षित रखना।
lexical_decisions:
- source_word: יָשַׁבְתִּי
  choice: नहीं बैठा
  rationale: ישׁב का मूल अर्थ ‘बैठना’ है; עִם के साथ यह संगति रखने का भाव भी देता है। ‘नहीं बैठा’ इब्रानी बिंब और संदर्भगत अर्थ दोनों को बनाए रखता है।
- source_word: מְתֵי שָׁוְא
  choice: झूठे लोगों
  rationale: שָׁוְא झूठ, मिथ्यापन या छल को सूचित कर सकता है। ‘झूठे लोगों’ से नैतिक आशय सहज आधुनिक हिन्दी में स्पष्ट रहता है।
- source_word: נַעֲלָמִים
  choice: जो अपना असली रूप छिपाते हैं
  rationale: עלם से बना यह रूप छिपे रहने या स्वयं को छिपाने वालों की ओर संकेत करता है। यह अनुवाद ‘कपटी’ जैसी अधिक व्याख्यात्मक संज्ञा से बचते हुए छिपाव का भाव स्पष्ट करता है।
- source_word: אָבוֹא
  choice: नहीं जाता
  rationale: בוא का अर्थ आना, जाना या प्रवेश करना हो सकता है। עִם के साथ और पहली पंक्ति के समानांतर यहाँ किसी की संगति में जाने का भाव स्वाभाविक है।
- source_word: וְעִם
  choice: और ... उनके साथ
  rationale: संयोजक और संबंधबोधक पद दूसरी पंक्ति को पहली से समानांतर रूप में जोड़ते हैं; हिन्दी में ‘और ... उनके साथ’ यह संबंध सहजता से व्यक्त करता है।
theological_decisions: []
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। काव्यात्मक समानांतरता बनाए रखने के लिए पद को दो पंक्तियों में रखा गया है; अस्पष्ट ‘छिपे हुए लोग’ के स्थान पर संदर्भानुकूल वर्णनात्मक वाक्यांश लिया गया है।
