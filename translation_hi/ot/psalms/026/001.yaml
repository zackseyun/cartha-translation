  text: לְ/דָוִ֨ד שָׁפְטֵ֤/נִי יְהוָ֗ה כִּֽי אֲ֭נִי בְּ/תֻמִּ֣/י הָלַ֑כְתִּי וּ/בַ/יהוָ֥ה בָּ֝טַ֗חְתִּי לֹ֣א אֶמְעָֽד׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/026/001.yaml
  text: Of David[a]. Vindicate me, O Yahweh, for I have walked in my integrity, and I have trusted in Yahweh[c][b]; I will not slip.
translation:
  language: hi
  text: 'दाऊद का[a]।


    हे याहवे, मेरा न्याय कर[b], क्योंकि मैं खराई से चलता आया हूँ; मैंने याहवे पर भरोसा रखा है—मैं नहीं डगमगाऊँगा[d]।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “दाऊद के लिए।” शीर्षक दाऊद की रचना, उससे संबद्धता या उसके लिए समर्पण का संकेत दे सकता है।
    reason: source_ambiguity
  - marker: b
    text: या “मेरे पक्ष में न्याय कर” अथवा “मुझे निर्दोष ठहरा।”
    reason: lexical_alternative
  - marker: d
    text: या “मैं नहीं फिसलूँगा” अथवा “मैं नहीं लड़खड़ाऊँगा।” मूल बिंब पैर फिसलने या लड़खड़ाने का है।
    reason: lexical_alternative
lexical_decisions:
- source_word: לְדָוִד
  choice: दाऊद का
  rationale: भजन के शीर्षक में לְ और व्यक्ति के नाम का संबंध रचनाकार, संबद्धता या समर्पण का संकेत दे सकता है। ‘दाऊद का’ इस संबंध को किसी एक अर्थ तक सीमित नहीं करता।
- source_word: שָׁפְטֵנִי
  choice: मेरा न्याय कर
  rationale: שׁפט का मूल अर्थ ‘न्याय करना’ है; इस संदर्भ में प्रार्थी अपने पक्ष में अनुकूल निर्णय, अर्थात निर्दोष ठहराए जाने की याचना करता है। मुख्य पाठ मूल न्यायिक भाषा और उसकी हल्की अस्पष्टता को बनाए रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय निजी नाम יהוה को किसी उपाधि से बदलने के बजाय आधुनिक हिन्दी में ‘याहवे’ के रूप में लिप्यंतरित किया गया है।
- source_word: בְּתֻמִּי
  choice: अपनी खराई में
  rationale: תֹּם/תֻּמָּה संपूर्णता, निष्कपटता और निर्दोष आचरण का भाव रखता है। ‘खराई’ नैतिक सत्यनिष्ठा व्यक्त करती है, पर पापरहित सिद्धता का अनावश्यक दावा नहीं जोड़ती।
- source_word: הָלַכְתִּי
  choice: मैं ... चला हूँ
  rationale: ‘चलना’ जीवन-आचरण के लिए प्रयुक्त इब्रानी रूपक है। यह हिन्दी में भी बोधगम्य है और मूल बिंब को सुरक्षित रखता है।
- source_word: בָּטַחְתִּי
  choice: मैंने ... भरोसा रखा है
  rationale: בטח भरोसे के साथ निर्भर रहने को व्यक्त करता है। ‘भरोसा रखा है’ हिन्दी में स्वाभाविक और अर्थ की दृष्टि से सीधा है।
- source_word: לֹא אֶמְעָד
  choice: मैं नहीं डगमगाऊँगा
  rationale: מעד का बिंब पैर फिसलने, लड़खड़ाने या स्थिरता खोने का है। ‘डगमगाऊँगा’ शारीरिक बिंब और दृढ़ विश्वास, दोनों को व्यक्त करता है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में निजी वाचा-नाम है। लिप्यंतरण नाम को उपाधि से प्रतिस्थापित नहीं करता।
- issue: भजनकार की תֻם संबंधी आत्मघोषणा
  choice: खराई
  alternative: निर्दोषता
  rationale: ‘खराई’ वास्तविक नैतिक सत्यनिष्ठा के दावे को बनाए रखती है, लेकिन उसे पूर्ण पापरहितता के दावे में नहीं बदलती।
- issue: לֹא אֶמְעָד का काल और भाव
  choice: भरोसे से उपजा दृढ़ कथन—‘मैं नहीं डगमगाऊँगा’
  alternative: ‘मैं नहीं डगमगाता’
  rationale: इब्रानी अपूर्ण क्रिया भविष्य या परिणामसूचक दृढ़ विश्वास व्यक्त कर सकती है। हिन्दी भविष्यकाल इस आश्वस्त कथन को स्वाभाविक रूप देता है, जबकि कारणसूचक ‘इसलिए’ मूल में न होने के कारण नहीं जोड़ा गया।
translation_notes:
  register: भाषा आधुनिक, प्रार्थनात्मक और गरिमापूर्ण रखी गई है। ‘खराई’ तथा ‘डगमगाना’ सामान्य पाठक के लिए बोधगम्य हैं और क्रमशः नैतिक तथा शारीरिक बिंबों को सुरक्षित रखते हैं। इब्रानी वाक्य-संयोजन की निकटता बनाए रखने के लिए ‘इसलिए’ नहीं जोड़ा गया।
