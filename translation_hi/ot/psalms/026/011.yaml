  text: וַ֭/אֲנִי בְּ/תֻמִּ֥/י אֵלֵ֗ךְ פְּדֵ֣/נִי וְ/חָנֵּֽ/נִי׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/026/011.yaml
  text: But as for me[a], I will walk in my integrity[b]; redeem me and be gracious to me.
translation:
  language: hi
  text: परन्तु मैं अपनी खराई[a] में चलूँगा; मुझे छुड़ा ले और मुझ पर अनुग्रह कर[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘अपनी निर्दोषता में’ अथवा ‘अपनी निष्कपटता में’।
    reason: lexical_alternative
  - marker: b
    text: या ‘मुझ पर दया कर।’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי
  choice: परन्तु मैं
  rationale: संयोजक और स्वतंत्र सर्वनाम मिलकर पिछले कथन के विपरीत भजनकार पर बल देते हैं। ‘परन्तु मैं’ आधुनिक हिन्दी में इस विरोध और बल को स्वाभाविक रूप से व्यक्त करता है।
- source_word: בְּתֻמִּי
  choice: अपनी खराई में
  rationale: תֻּם नैतिक सम्पूर्णता, निष्कपटता या निर्दोष आचरण का भाव रखता है। ‘खराई’ सकारात्मक नैतिक दावे को बनाए रखती है, पर इसे पूर्ण पापहीनता का दावा नहीं बनाती; ‘में’ मूल पूर्वसर्ग ב को भी दर्शाता है।
- source_word: אֵלֵךְ
  choice: चलूँगा
  rationale: הלך यहाँ जीवन-आचरण के लिए प्रयुक्त ‘चलने’ के रूपक को बनाए रखता है। भविष्यकालीन ‘चलूँगा’ संकल्प और आगे जारी रहने वाले आचरण—दोनों का स्वाभाविक संकेत देता है।
- source_word: פְּדֵנִי
  choice: मुझे छुड़ा ले
  rationale: פדה संकट या बन्धन से छुड़ाने अथवा मुक्ति दिलाने का अर्थ देता है। ‘छुड़ा ले’ सामान्य पाठक के लिए सहज है और मूल क्रिया के उद्धारात्मक बल को बनाए रखता है।
- source_word: וְחָנֵּנִי
  choice: और मुझ पर अनुग्रह कर
  rationale: חנן कृपा या अनुग्रह दिखाने को व्यक्त करता है। ‘मुझ पर अनुग्रह कर’ कृपापूर्ण पक्ष को सीधे रखता है; ‘दया कर’ सम्भव है, पर करुणा के पक्ष को अधिक उभारता है।
theological_decisions:
- issue: भजनकार का תֻּם अर्थात ‘खराई’ का दावा
  choice: इसे नैतिक खराई और निष्कपट आचरण के दावे के रूप में रखा गया है, पूर्ण पापहीनता के दावे के रूप में नहीं।
  alternative: ‘निर्दोषता’ या ‘निष्पापता’ जैसा अधिक प्रबल दावा।
  rationale: सन्दर्भ में भजनकार अपने आचरण को दुष्टों के आचरण से अलग बताता है, फिर भी छुटकारे और अनुग्रह की प्रार्थना करता है। ‘खराई’ इस सकारात्मक नैतिक दावे और अनुग्रह की आवश्यकता के बीच के तनाव को बनाए रखती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य हिन्दी पाठक के लिए सहज रखी गई है। ‘चलूँगा’ द्वारा इब्रानी जीवन-आचरण का रूपक सुरक्षित है; ‘खराई’ नैतिक बल को बनाए रखते हुए अनावश्यक रूप से पापहीनता का सिद्धान्त नहीं जोड़ती।
