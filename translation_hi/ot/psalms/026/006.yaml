  text: I wash my hands in innocence[a], and go around your altar, O Yahweh[b],
translation:
  language: hi
  text: मैं निर्दोषता से अपने हाथ धोता हूँ, और तेरी वेदी की परिक्रमा करता हूँ, हे याहवे,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֶרְחַץ
  choice: मैं ... धोता हूँ
  rationale: רחץ के प्रथम पुरुष एकवचन अपूर्ण रूप को इस काव्यात्मक संदर्भ में वर्तमान या नियमित क्रिया के रूप में समझना स्वाभाविक है। भविष्यकाल ‘मैं धोऊँगा’ भी व्याकरणतः संभव है, पर संदर्भ में अनावश्यक रूप से भविष्य पर बल देता है।
- source_word: בְּנִקָּיוֹן
  choice: निर्दोषता में
  rationale: נִקָּיוֹן में स्वच्छता, शुद्धता और नैतिक निर्दोषता—इन अर्थों का विस्तार है। यहाँ हाथ धोने की धार्मिक छवि के साथ भजनकार की नैतिक निष्कपटता भी सामने आती है; ‘निर्दोषता में’ इस प्रमुख भाव को बनाए रखता है।
- source_word: כַּפָּי
  choice: अपने हाथ
  rationale: כף का शाब्दिक अर्थ हथेली हो सकता है, किंतु हाथ धोने के प्रसंग में स्वाभाविक हिन्दी अभिव्यक्ति ‘अपने हाथ’ है।
- source_word: וַאֲסֹבְבָה
  choice: और ... परिक्रमा करता हूँ
  rationale: סבב का अर्थ चारों ओर जाना या चक्कर लगाना है। वेदी के संदर्भ में ‘परिक्रमा करना’ संक्षिप्त और स्वाभाविक है। अंतिम ה संकल्प या इच्छाभाव का संकेत दे सकता है, पर पहली क्रिया के साथ इसकी काव्यात्मक श्रृंखला को वर्तमान कथन के रूप में रखा गया है।
- source_word: מִזְבַּחֲךָ
  choice: तेरी वेदी
  rationale: מזבח का मानक अर्थ ‘वेदी’ है और द्वितीय पुरुष एकवचन प्रत्यय को ‘तेरी’ से व्यक्त किया गया है।
- source_word: יְהוָה
  choice: हे यहोवा
  rationale: मूल पाठ में परमेश्वर का व्यक्तिगत नाम יהוה है। हिन्दी में प्रचलित नामरूप ‘यहोवा’ इसे किसी उपाधि से बदलने के बजाय नाम के रूप में प्रस्तुत करता है।
theological_decisions:
- issue: בְּנִקָּיוֹן में नैतिक निर्दोषता और धार्मिक शुद्धता का संबंध
  choice: मुख्य पाठ में ‘निर्दोषता’, पादटिप्पणी में ‘शुद्धता’ और ‘स्वच्छता’
  alternative: मुख्य पाठ में ‘शुद्धता’
  rationale: प्रसंग हाथ धोने की शुद्धिकरण-संबंधी छवि रखता है, जबकि पिछले पदों में भजनकार का नैतिक चालचलन प्रमुख है। इसलिए मुख्य पाठ नैतिक पहलू व्यक्त करता है और पादटिप्पणी मूल शब्द की व्यापकता सुरक्षित रखती है।
- issue: וַאֲסֹבְבָה का काल और इच्छाभाव
  choice: परिक्रमा करता हूँ
  alternative: परिक्रमा करूँगा / परिक्रमा करूँ
  rationale: अपूर्ण क्रिया और cohortative-सदृश रूप वर्तमान, संकल्प या इच्छाभाव की ओर संकेत कर सकता है। निकटवर्ती क्रिया के साथ वर्तमान कथन हिन्दी में सबसे सहज है, पर व्याकरणिक तनाव को टिप्पणी में स्वीकार किया गया है।
- issue: יהוה का अनुवाद
  choice: यहोवा
  alternative: याहवे / प्रभु
  rationale: मूल में व्यक्तिगत दिव्य नाम है, उपाधि नहीं। ‘यहोवा’ आधुनिक हिन्दी बाइबलीय प्रयोग में पहचाना जाने वाला नामरूप है; इसे ‘प्रभु’ से बदलने पर नाम और उपाधि का भेद मिट जाता। नाम के उच्चारण का ठीक प्राचीन स्वरूप निश्चित नहीं है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और काव्यात्मक रखी गई है। ‘तेरी’ भजन की सीधी प्रार्थनात्मक संबोधन-शैली को बनाए रखता है। पद के अंत का अल्पविराम अगले पद में वाक्य जारी रहने का संकेत देता है।
