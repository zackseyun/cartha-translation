  yaml_path: translation/ot/psalms/026/000.yaml
  text: Of David[a]. Judge me, Yahweh, for I have walked in my integrity, and I have trusted in Yahweh[c][b]; I will not slip.
translation:
  language: hi
  text: दाऊद का। हे यहोवा, मेरा न्याय कर[a], क्योंकि मैं अपनी खराई[b] में चलता रहा हूँ; मैंने यहोवा पर भरोसा रखा है, मैं नहीं डगमगाऊँगा[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इसका अर्थ ‘मेरे पक्ष में न्याय कर’ या ‘मुझे निर्दोष ठहरा’ भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या ‘अपनी निर्दोषता में।’ इब्रानी शब्द खराई, संपूर्णता और निर्दोष आचरण का भाव देता है।
    reason: lexical_alternative
  - marker: c
    text: या ‘मैं नहीं फिसलूँगा’ अथवा ‘मैं विचलित नहीं होऊँगा।’ इब्रानी में पैर फिसलने या आधार खोने का बिंब है।
    reason: lexical_alternative
lexical_decisions:
- source_word: לְדָוִד
  choice: दाऊद की रचना
  rationale: शीर्षक में לְ लेखकत्व, संबंध या समर्पण व्यक्त कर सकता है। मुख्य पाठ के लिए स्वाभाविक पारंपरिक अर्थ चुना गया, जबकि अनिश्चितता को पूर्णतः कठोर नहीं बनाया गया।
- source_word: שָׁפְטֵנִי
  choice: मेरा न्याय कर
  rationale: मूल क्रिया का औपचारिक अर्थ ‘न्याय करना’ है; संदर्भ में अपने पक्ष में निर्णय या निर्दोष ठहराए जाने की विनती भी निहित हो सकती है, जिसे पादटिप्पणी में रखा गया है।
- source_word: בְתֻמִּי
  choice: अपनी खराई में
  rationale: תֹּם यहाँ संपूर्णता, नैतिक सत्यनिष्ठा और निर्दोष आचरण का भाव रखता है। ‘खराई’ इस दायरे को संक्षेप में बनाए रखती है।
- source_word: לֹא אֶמְעָד
  choice: मैं नहीं डगमगाऊँगा
  rationale: מעד का बिंब पैर फिसलने, अस्थिर होने या गिरने का है। ‘डगमगाना’ शारीरिक बिंब और विश्वास में स्थिरता, दोनों को स्वाभाविक हिंदी में व्यक्त करता है।
theological_decisions:
- issue: भजनकार का अपनी खराई का दावा
  choice: ‘मैं अपनी खराई में चलता रहा हूँ’ के रूप में दावे को यथावत रखा
  alternative: इसे पूर्ण पापरहितता अथवा केवल सापेक्ष धार्मिकता के रूप में स्पष्ट करना
  rationale: इब्रानी पाठ दावे की सीमा का धर्मवैज्ञानिक स्पष्टीकरण नहीं देता; इसलिए तनाव और संभावित व्यापकता को सुरक्षित रखा गया।
- issue: अंतिम क्रिया का काल और भरोसे से संबंध
  choice: ‘इसलिए मैं नहीं डगमगाऊँगा’
  alternative: ‘मैं नहीं डगमगाया हूँ’ या ‘मैं डगमगाता नहीं’
  rationale: אֶמְעָד अपूर्ण रूप है और यहाँ भविष्य/परिणाम का भाव स्वाभाविक है। ‘इसलिए’ भरोसे और स्थिरता के निहित संबंध को हिंदी में स्पष्ट करता है, बिना कोई अतिरिक्त सिद्धांत जोड़े।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण, सहज काव्यात्मक शैली रखी गई है। परमेश्वर के नाम יהוה को प्रचलित हिंदी रूप ‘यहोवा’ में दिया गया है। शीर्षक और पद को एक साथ प्रस्तुत किया गया है; पादटिप्पणी-चिह्न संबंधित शब्दों के तुरंत बाद रखे गए हैं।
