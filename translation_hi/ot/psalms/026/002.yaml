source:
  edition: WLC
  text: בְּחָנֵ֣/נִי יְהוָ֣ה וְ/נַסֵּ֑/נִי צרופ/ה כִלְיוֹתַ֣/י וְ/לִבִּֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/026/002.yaml
  text: Examine me[a], O Yahweh, and test me; refine my mind and my heart.
translation:
  language: hi
  text: हे याहवे, मुझे जाँच और परख; मेरे गुर्दों[a] और मेरे हृदय को तपाकर शुद्ध कर।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से “गुर्दों”; प्राचीन इब्रानी में यह मनुष्य के गहनतम विचारों और भावों का रूपक है।
    reason: cultural_note
lexical_decisions:
- source_word: בְּחָנֵנִי
  choice: मुझे जाँच
  rationale: בּחן किसी की वास्तविकता या खराई जाँचने का भाव रखता है। “जाँच” अगले समानार्थी क्रियापद से भेद बनाए रखते हुए स्वाभाविक हिन्दी देता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: ईश्वर के व्यक्तिगत नाम יהוה को किसी उपाधि से बदलने के बजाय हिन्दी में उसके प्रचलित विद्वत्तापरक लिप्यंतरण “याहवे” से व्यक्त किया गया है।
- source_word: וְנַסֵּנִי
  choice: और परख
  rationale: נסה परीक्षा द्वारा सिद्ध करने या परखने का भाव देता है। “परख” पहले प्रयुक्त “जाँच” के साथ काव्यात्मक समानांतरता और हल्का अर्थभेद दोनों बनाए रखता है।
- source_word: צרופה
  choice: तपाकर शुद्ध कर
  rationale: צרף धातु को आग में तपाकर मैल अलग करने की धातुकर्म-संबंधी छवि रखता है। यह पद उस ठोस छवि और शुद्धीकरण के आशय दोनों को स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: כִלְיוֹתַי
  choice: मेरे गुर्दों
  rationale: शाब्दिक शारीरिक बिंब “गुर्दों” को बनाए रखा गया है; प्राचीन इब्रानी प्रयोग में यह मनुष्य के गहनतम विचारों और भावों का रूपक है, जिसे पादटिप्पणी स्पष्ट करती है।
- source_word: וְלִבִּי
  choice: और मेरे हृदय
  rationale: לֵב आंतरिक मनुष्य—विचार, इच्छा और भाव—को सूचित कर सकता है। “हृदय” हिन्दी में मानक, व्यापक और काव्यात्मक समतुल्य है।
theological_decisions:
- issue: इब्रानी काव्य में आंतरिक मनुष्य के लिए शारीरिक बिंब
  choice: मुख्य पाठ में “गुर्दों” और “हृदय” के ठोस बिंब को बनाए रखना
  alternative: “मेरे अंतरतम मन और मेरे हृदय” अथवा “मेरे विचारों और हृदय”
  rationale: मूल पद आंतरिक जीवन के लिए दो शारीरिक अंगों का काव्यात्मक प्रयोग करता है। इसे व्याख्यात्मक भावार्थ से बदलने के बजाय मूल तनाव और काव्य-चित्र को रखा गया है तथा अपरिचित रूपक को पादटिप्पणी में समझाया गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और प्रार्थनात्मक रखी गई है। “जाँच” और “परख” निकटार्थी इब्रानी क्रियाओं का भेद बनाए रखते हैं, जबकि “तपाकर शुद्ध कर” मूल धातुकर्म-संबंधी बिंब को स्पष्ट और सहज बनाता है।
