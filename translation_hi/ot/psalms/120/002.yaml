id: PSA.120.2
reference: Psalms 120:2
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: יְֽהוָ֗ה הַצִּ֣ילָ/ה נַ֭פְשִׁ/י מִ/שְּׂפַת שֶׁ֑קֶר מִ/לָּשׁ֥וֹן רְמִיָּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/120/002.yaml
  text: O Yahweh[a], deliver my soul from lying lips[b], from a deceitful tongue.
translation:
  language: hi
  text: हे याहवे, मुझे[a] झूठे होंठों[b] से, छल भरी जीभ से बचा ले।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी अभिव्यक्ति का शाब्दिक रूप ‘मेरे प्राण’ है; इसका अर्थ ‘मुझे’ या ‘मेरे जीवन को’ भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या, ‘झूठ के होंठों से, छल की जीभ से।’
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: हे याहवे
  rationale: ईश्वर के व्यक्तिगत नाम को शीर्षक से बदलने के बजाय आधुनिक हिन्दी में लिप्यंतरित किया गया है; सम्बोधन को व्यक्त करने के लिए ‘हे’ जोड़ा गया है।
- source_word: הַצִּילָה
  choice: बचा ले
  rationale: यह נצל का आग्रहपूर्ण आज्ञार्थक रूप है। ‘बचा ले’ प्रार्थना के प्रसंग में स्वाभाविक है और विरोधी वाणी से छुटकारे की याचना व्यक्त करता है।
- source_word: נַפְשִׁי
  choice: मुझे
  rationale: נפש यहाँ पूरे व्यक्ति के लिए प्रयुक्त हो सकता है। ‘मुझे’ आधुनिक हिन्दी में स्वाभाविक है, जबकि ‘मेरे प्राण’ और ‘मेरे जीवन को’ की संभावनाएँ पादटिप्पणी में सुरक्षित रखी गई हैं।
- source_word: מִשְּׂפַת שֶׁקֶר
  choice: झूठे होंठों से
  rationale: שׂפה का मूल अर्थ ‘होंठ’ है और यहाँ वह वाणी का द्योतक है; שׁקר के साथ ‘झूठे होंठ’ संक्षिप्त, स्पष्ट और काव्यात्मक है।
- source_word: מִלָּשׁוֹן רְמִיָּה
  choice: छल भरी जीभ से
  rationale: ‘जीभ’ को बनाए रखने से ‘होंठों’ के साथ मूल समानांतरता सुरक्षित रहती है। ‘छल भरी’ רמיה के छलपूर्ण या कपटपूर्ण स्वभाव को सहज हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में आए व्यक्तिगत नाम को उपाधि से प्रतिस्थापित न करके हिन्दी लिप्यंतरण में रखा गया है।
- issue: נַפְשִׁי का अर्थ
  choice: मुझे
  alternative: मेरे प्राण को; मेरे जीवन को
  rationale: प्रसंग में यह वक्ता के समूचे व्यक्तित्व को सूचित करता है। मुख्य पाठ में स्वाभाविक हिन्दी चुनी गई है, पर अर्थगत विस्तार पादटिप्पणी में दिया गया है।
translation_notes:
  register: भाषा आधुनिक, प्रार्थनापूर्ण और गरिमामय रखी गई है। ‘होंठों’ और ‘जीभ’ की काव्यात्मक समानांतरता तथा दोनों पदों में ‘से’ की पुनरावृत्ति मूल इब्रानी संरचना को प्रतिध्वनित करती है।
