  text: חִצֵּ֣י גִבּ֣וֹר שְׁנוּנִ֑ים עִ֝֗ם גַּחֲלֵ֥י רְתָמִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/120/004.yaml
  text: Sharp arrows of a warrior[b][a], with coals of the broom tree.
translation:
  language: hi
  text: 'वीर के पैने तीर,

    और रेतम[a] के अंगारे।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: रेतम मरुस्थल में उगने वाली एक झाड़ी है, जिसकी लकड़ी से लंबे समय तक जलने वाला कोयला बनाया जाता था।
    reason: cultural_note
lexical_decisions:
- source_word: חִצֵּי
  choice: तीर
  rationale: חֵץ का संबंध-रूप बहुवचन है; अगले शब्द גִבּוֹר के साथ मिलकर ‘वीर के तीर’ बनता है।
- source_word: גִבּוֹר
  choice: वीर
  rationale: यहाँ युद्ध और दंड के बिंब में ‘वीर’ बलशाली योद्धा का अर्थ स्वाभाविक और संक्षिप्त रूप से व्यक्त करता है।
- source_word: שְׁנוּנִים
  choice: पैने
  rationale: שנן से बना यह रूप तीरों के धारदार या पैना किए हुए होने को बताता है; ‘पैने’ आधुनिक हिंदी में सहज है।
- source_word: עִם
  choice: और
  rationale: मूलतः ‘के साथ’; हिंदी काव्य-पंक्ति में ‘और’ दोनों दंड-बिंबों को स्वाभाविक रूप से जोड़ता है, जबकि सहवर्ती अर्थ बना रहता है।
- source_word: גַּחֲלֵי
  choice: अंगारे
  rationale: गर्म या दहकते कोयलों के लिए ‘अंगारे’ संक्षिप्त और चित्रात्मक हिंदी है; मूल में अलग से ‘जलते हुए’ विशेषण नहीं जोड़ा गया।
- source_word: רְתָמִים
  choice: रेतम
  rationale: विशिष्ट मरुस्थलीय झाड़ी का हिब्रू नाम लिप्यंतरित किया गया है, क्योंकि हिंदी में इसका कोई सर्वमान्य साधारण नाम नहीं है; पादटिप्पणी इसे स्पष्ट करती है।
