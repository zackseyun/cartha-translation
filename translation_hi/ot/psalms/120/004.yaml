  register: संक्षिप्त काव्यात्मक समानांतरता रखी गई है। भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध है; ‘रेतम’ की सांस्कृतिक जानकारी पादटिप्पणी में दी गई है।
