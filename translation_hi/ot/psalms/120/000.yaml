lexical_decisions:
- source_word: שִׁיר הַמַּעֲלוֹת
  choice: चढ़ाइयों का गीत
  rationale: बहुवचन מַעֲלוֹת का मूल अर्थ ‘चढ़ाइयाँ/ऊपर जाने की क्रियाएँ’ है। यह भजन 120–134 में प्रयुक्त पारंपरिक शीर्षक है; स्वाभाविक हिन्दी रखते हुए इसकी अर्थगत खुली प्रकृति बचाई गई है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी व्यक्तिवाचक दिव्य नाम का लिप्यंतरण किया गया है, उसे सामान्य उपाधि ‘प्रभु’ से नहीं बदला गया।
- source_word: בַּצָּרָתָה לִּי
  choice: अपने संकट में
  rationale: इब्रानी पदबंध का स्वाभाविक हिन्दी रूप; ‘मेरे लिए संकट में’ की शाब्दिक कठोरता से बचते हुए वक्ता के निजी संकट का भाव सुरक्षित है।
- source_word: קָרָאתִי וַיַּעֲנֵנִי
  choice: मैंने … पुकारा, और उन्होंने मुझे उत्तर दिया
  rationale: दोनों पूर्ण क्रियाओं और उनके क्रम को स्पष्ट, स्वाभाविक हिन्दी में रखा गया है। याहवे के लिए आदरसूचक बहुवचन हिन्दी की सामान्य मर्यादित शैली है; अर्थ में कर्ता एकवचन ही है।
theological_decisions:
- issue: दिव्य नाम का अनुवाद
  choice: याहवे
  alternative: प्रभु / यहोवा
  rationale: मूल पाठ में सामान्य उपाधि नहीं बल्कि चार अक्षरों वाला व्यक्तिवाचक नाम है; इसलिए नाम को दृश्यमान रखना स्रोत के अधिक निकट है।
- issue: उत्तर मिलने की कालगत धारणा
  choice: भूतकाल की पूर्ण घटना—‘उन्होंने मुझे उत्तर दिया’
  alternative: वर्तमान या सामान्य सत्य—‘वह मुझे उत्तर देते हैं’
  rationale: मूल की पूर्ण क्रियाएँ वक्ता की पुकार और मिले उत्तर को पूर्ण घटनाओं के रूप में प्रस्तुत करती हैं; पाठ में उत्तर के ढंग को निर्दिष्ट नहीं किया गया।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। काव्य-पंक्ति विभाजन में पुकार और उत्तर को अलग पंक्तियों में रखा गया है। शीर्षक के अर्थ को किसी एक ऐतिहासिक या उपासना-संबंधी व्याख्या तक सीमित नहीं किया गया।
