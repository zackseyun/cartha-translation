translation_notes:
  register: आधुनिक, गरिमापूर्ण और काव्यात्मक हिन्दी। ‘मेरे प्राण’ मूल की נפש-भाषा को सुरक्षित रखता है; ‘बसे हैं’ निवास की निरन्तरता व्यक्त करता है। सभी पदचिह्न देवनागरी हिन्दी परम्परा के अनुसार रखे गए हैं।
