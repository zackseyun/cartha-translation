  yaml_path: translation/ot/psalms/120/006.yaml
  text: My soul has long dwelt with one who hates peace[a].
translation:
  language: hi
  text: मेरा प्राण बहुत समय से शांति से बैर रखने वाले के साथ रहता आया है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मेरा प्राण शांति से बैर रखने वाले के साथ आवश्यकता से अधिक समय से रहता आया है।” इब्रानी का आरंभिक शब्द लंबी अवधि पर बल देता है और यह संकेत भी दे सकता है कि अवधि आवश्यकता से अधिक हो गई है।
    reason: lexical_alternative
lexical_decisions:
- source_word: רַבַּת
  choice: बहुत समय से
  rationale: यह रूप अगले क्रिया-पद के साथ मिलकर लम्बी अवधि व्यक्त करता है। ‘बहुत समय से’ अवधि को स्वाभाविक हिन्दी में प्रकट करता है, जबकि ‘बहुत अधिक समय से’ अवधि की अति को अधिक स्पष्ट कर देता है, जो सम्भव तो है पर अनिवार्य नहीं।
- source_word: שָׁכְנָה
  choice: बसे हैं
  rationale: שכן का अर्थ बसना या निवास करना है। पूर्ण क्रिया और अवधि-सूचक רַבַּת के साथ ‘बसे हैं’ अतीत से अब तक प्रासंगिक निवास को व्यक्त करता है।
- source_word: לָּהּ
  choice: अलग से अनूदित नहीं; ‘मेरे प्राण’ को कर्ता बनाया गया
  rationale: स्त्रीलिंग एकवचन प्रत्यय वाक्य-विन्यास में कठिन है और सम्भवतः נַפְשִׁי के सम्बन्ध में पुनरुक्त या बलदायक है। अलग सर्वनाम जोड़ने से हिन्दी अस्वाभाविक और अर्थ अनावश्यक रूप से निश्चित हो जाता।
- source_word: נַפְשִׁי
  choice: मेरे प्राण
  rationale: נפש व्यक्ति, जीवन या भीतरी अस्तित्व का बोध करा सकता है। ‘मेरे प्राण’ भजन की काव्यात्मक बनावट को बनाए रखता है और केवल ‘मैं’ कहकर उसे सपाट नहीं करता।
- source_word: עִם
  choice: के साथ
  rationale: यह सहवास या संगति का सीधा बोध कराता है; हिन्दी में ‘के साथ’ स्वाभाविक समतुल्य है।
- source_word: שׂוֹנֵא
  choice: बैर रखनेवाले
  rationale: कर्तृवाचक कृदन्त किसी व्यक्ति की स्थायी प्रवृत्ति बताता है। ‘बैर रखनेवाले’ हिन्दी में स्वाभाविक है और शान्ति के प्रति सक्रिय विरोध को व्यक्त करता है।
- source_word: שָׁלוֹם
  choice: शान्ति
  rationale: सन्दर्भ में विरोध और मेलपूर्ण सम्बन्धों का प्रश्न है, इसलिए व्यापक अर्थ-क्षेत्र वाले שָׁלוֹם के लिए ‘शान्ति’ सबसे स्पष्ट चयन है।
