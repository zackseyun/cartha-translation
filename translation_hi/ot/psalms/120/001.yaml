  text: A Song of Ascents. In my distress I called to Yahweh[a], and he answered me.
translation:
  language: hi
  text: 'चढ़ाइयों का गीत।[a]


    अपने संकट में मैंने याहवे को पुकारा,


    और उसने मुझे उत्तर दिया।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इब्रानी शीर्षक: ‘चढ़ाइयों का गीत’; इसका अर्थ ‘ऊपर जाने का गीत’ भी हो सकता है। यह भजन 120–134 का पारंपरिक शीर्षक है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁיר
  choice: गीत
  rationale: यह संज्ञा सीधे तौर पर गाए जाने वाले गीत को दर्शाती है; ‘भजन’ यहाँ अधिक व्याख्यात्मक होता।
- source_word: הַמַּעֲלוֹת
  choice: चढ़ाई
  rationale: यह ऊपर जाने की मूल धारणा को बनाए रखता है और भजन 120–134 की पारंपरिक शीर्षक-श्रृंखला के लिए स्वाभाविक हिन्दी है।
- source_word: אֶל־יְהוָה
  choice: यहोवा को
  rationale: אֶל पुकार की दिशा बताता है; हिन्दी में ‘यहोवा को पुकारा’ स्वाभाविक है। יְהוָה को उपाधि से बदलने के बजाय प्रचलित हिन्दी रूप ‘यहोवा’ से व्यक्त किया गया है।
- source_word: בַּצָּרָתָה לִּי
  choice: अपने संकट में
  rationale: शाब्दिक ‘मेरे लिए संकट में’ को स्वाभाविक हिन्दी स्वामित्व-रचना में दिया गया है; ‘संकट’ צרה की तीव्रता बनाए रखता है।
- source_word: קָרָאתִי
  choice: मैंने ... पुकारा
  rationale: मूल क्रिया सामान्यतः ‘पुकारना’ है; ‘दुहाई दी’ या ‘चिल्लाया’ अतिरिक्त भावात्मक रंग जोड़ते।
- source_word: וַיַּעֲנֵנִי
  choice: और उसने मुझे उत्तर दिया
  rationale: वाव क्रम को आगे बढ़ाता है और क्रिया का प्रथम पुरुष कर्म-प्रत्यय ‘मुझे’ है; कर्ता प्रसंग से यहोवा है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे / प्रभु
  rationale: मूल में व्यक्तिगत ईश्वरीय नाम है। हिन्दी बाइबलीय प्रयोग में व्यापक रूप से पहचाने जाने वाले ‘यहोवा’ को रखा गया, न कि उसे केवल उपाधि ‘प्रभु’ से बदला गया।
- issue: उत्तर मिलने का कालगत अर्थ
  choice: और उसने मुझे उत्तर दिया
  alternative: और वह मुझे उत्तर देता है
  rationale: קָרָאתִי और וַיַּעֲנֵנִי पूर्ण घटनाओं के क्रम को व्यक्त करते हैं; इसलिए भूतकाल रखा गया, बिना उत्तर के स्वरूप को स्पष्ट किए।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी। काव्यात्मक पंक्ति-विन्यास रखा गया है; शीर्षक की वास्तविक अर्थगत अनिश्चितता पादटिप्पणी में सुरक्षित है।
