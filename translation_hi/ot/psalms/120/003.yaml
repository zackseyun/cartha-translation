base_translation:
  language: en
  yaml_path: translation/ot/psalms/120/003.yaml
  text: What will he give to you[a], and what more will he add to you, O deceitful tongue?
translation:
  language: hi
  text: वह तुझे क्या देगा[a], और वह तुझे और क्या देगा, हे छलपूर्ण जीभ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तेरे साथ क्या किया जाएगा, और तेरे साथ और क्या किया जाएगा, हे छलपूर्ण जीभ?” निहित कर्ता को सामान्य अर्थ में समझा जा सकता है, यद्यपि संदर्भ के कारण बहुत-से व्याख्याकार इसे परमेश्वर के न्याय की ओर संकेत मानते हैं।
    reason: alternative_reading
lexical_decisions:
- source_word: מַה
  choice: क्या
  rationale: प्रश्नवाचक सर्वनाम को सीधे और स्वाभाविक रूप में रखा गया है; इससे आलंकारिक प्रश्न की तीक्ष्णता बनी रहती है।
- source_word: יִתֵּן
  choice: वह ... देगा
  rationale: נתן के कालगत रूप और निहित पुल्लिंग एकवचन कर्ता को सुरक्षित रखा गया है; कर्ता की पहचान स्पष्ट नहीं की गई।
- source_word: לְךָ
  choice: तुझे
  rationale: לְ के साथ द्वितीय पुरुष एकवचन प्रत्यय का स्वाभाविक हिन्दी रूप।
- source_word: וּמַה יֹסִיף
  choice: और ... इससे अधिक क्या देगा
  rationale: יסף के ‘और जोड़ना/अधिक करना’ भाव को सहज हिन्दी में व्यक्त किया गया है, साथ ही पहली पंक्ति के ‘देगा’ से समानांतरता रखी गई है।
- source_word: לָךְ
  choice: तुझे
  rationale: यह संबोधन स्त्रीलिंग ‘जीभ’ की ओर है; हिन्दी में ‘तुझे’ लिंग-भेद किए बिना सीधे संबोधन को बनाए रखता है।
- source_word: לָשׁוֹן רְמִיָּה
  choice: हे छल से भरी जीभ
  rationale: ‘जीभ’ का सजीव काव्यात्मक संबोधन बनाए रखा गया है। ‘छल से भरी’ רְמִיָּה के धोखे और कपट के नैतिक भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: क्रिया ‘देगा’ का निहित कर्ता
  choice: ‘वह’ रखा गया, पर उसकी पहचान नहीं बताई गई
  alternative: संदर्भ के आधार पर कर्ता को स्पष्ट रूप से ‘परमेश्वर’ कहना, या सामान्य अर्थ में ‘तेरे साथ क्या किया जाएगा’ कहना
  rationale: इब्रानी पाठ में कर्ता निहित और अस्पष्ट है। संदर्भ में इसे परमेश्वर के न्याय से जोड़ना संभव है, पर पद स्वयं ऐसा स्पष्ट नहीं करता; इसलिए वास्तविक अस्पष्टता सुरक्षित रखी गई है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और काव्यात्मक हिन्दी। प्रत्यक्ष संबोधन तथा इब्रानी समानांतरता को रखा गया है; ‘हे’ भजन की काव्य-शैली के अनुरूप है।
