source:
  edition: WLC
  text: אֽוֹיָה לִ֭/י כִּי גַ֣רְתִּי מֶ֑שֶׁךְ שָׁ֝כַ֗נְתִּי עִֽם אָהֳלֵ֥י קֵדָֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/120/005.yaml
  text: Woe to me[a], for I have sojourned in Meshech[b]; I have dwelt among the tents of Kedar.
translation:
  language: hi
  text: हाय, मुझ पर विपत्ति है! क्योंकि मैं मेशेक में परदेशी होकर रहा हूँ[a]; मैं केदार के तंबुओं के बीच निवास करता आया हूँ[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: मेशेक और केदार यहाँ दूरस्थ तथा विरोधी लोगों के काव्यात्मक प्रतीक हो सकते हैं; यह आवश्यक नहीं कि भजनकार सचमुच एक ही समय दोनों स्थानों में रहा हो।
    reason: cultural_note
  - marker: b
    text: शाब्दिक रूप से, “केदार के तंबुओं के साथ।”
    reason: lexical_alternative
lexical_decisions:
- source_word: אֽוֹיָה לִי
  choice: हाय मुझ पर!
  rationale: यह संक्षिप्त और तीव्र व्यक्तिगत विलाप को स्वाभाविक, गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यह विलाप का कारण प्रस्तुत करने वाली इब्रानी संयोजक की कारणवाचक शक्ति को स्पष्ट रखता है।
- source_word: גַרְתִּי
  choice: मैं ... परदेशी होकर रहा हूँ
  rationale: גור में केवल रहने का नहीं, बल्कि बाहरी व्यक्ति या प्रवासी के रूप में अस्थायी निवास करने का भाव है।
- source_word: מֶשֶׁךְ
  choice: मेशेक
  rationale: व्यक्तिवाचक नाम को लिप्यंतरित कर मूल का ऐतिहासिक और काव्यात्मक बिंब सुरक्षित रखा गया है।
- source_word: שָׁכַנְתִּי
  choice: मैं ... निवास करता रहा हूँ
  rationale: שׁכן के निवास करने के सामान्य अर्थ को रखा गया है और इसे पहले प्रयुक्त परदेशी होकर रहने की विशिष्ट अभिव्यक्ति से अलग किया गया है।
- source_word: עִם אָהֳלֵי קֵדָר
  choice: केदार के तंबुओं के बीच
  rationale: עִם का मूल भाव ‘साथ’ है, पर तंबुओं के संदर्भ में हिन्दी का ‘के बीच’ उस समुदाय के मध्य निवास का आशय स्वाभाविक रूप से व्यक्त करता है; तंबुओं का ठोस बिंब भी बना रहता है।
- source_word: קֵדָר
  choice: केदार
  rationale: व्यक्तिवाचक नाम को लिप्यंतरित किया गया है, जिससे संबंधित तंबू-निवासी समुदाय का ऐतिहासिक-काव्यात्मक संकेत सुरक्षित रहता है।
theological_decisions:
- issue: क्या मेशेक और केदार को मूल नामों के रूप में रखा जाए या दूरस्थ और शत्रुतापूर्ण लोगों के सामान्य प्रतीक के रूप में अनूदित किया जाए?
  choice: मुख्य पाठ में मेशेक और केदार के नाम ज्यों के त्यों रखे गए हैं।
  alternative: इन्हें ‘दूर के शत्रुतापूर्ण लोगों’ जैसे व्याख्यात्मक सामान्य शब्दों में प्रस्तुत किया जा सकता था।
  rationale: इब्रानी पाठ दोनों नाम स्पष्ट रूप से देता है। उनका संभावित काव्यात्मक कार्य पादटिप्पणी में बताया गया है, ताकि मुख्य पाठ ऐतिहासिक बिंब और उसकी वास्तविक अस्पष्टता को बनाए रखे।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में है। ‘हाय मुझ पर’ विलाप की तीव्रता और काव्यात्मक संक्षिप्तता रखता है; ‘परदेशी होकर रहा हूँ’ और ‘निवास करता रहा हूँ’ दोनों इब्रानी क्रियाओं के अर्थभेद को सहज रूप में व्यक्त करते हैं।
