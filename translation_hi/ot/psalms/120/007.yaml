lexical_decisions:
- source_word: אֲנִי שָׁלוֹם
  choice: मैं तो शान्ति के पक्ष में हूँ
  rationale: मूल इब्रानी का क्रियारहित वाक्यांश शाब्दिक रूप से ‘मैं—शान्ति’ है। हिन्दी में ‘शान्ति के पक्ष में हूँ’ वक्ता की शान्ति के प्रति प्रवृत्ति को स्वाभाविक ढंग से व्यक्त करता है; ‘तो’ मूल के स्पष्ट सर्वनाम और आगे आने वाले विरोध पर बल देता है।
- source_word: וְכִי
  choice: पर जब
  rationale: 'संयोजक और अव्यय का मेल प्रसंग में विरोध प्रकट करता है: वक्ता शान्ति के पक्ष में है, पर उसके बोलने पर विरोधी युद्ध की ओर उन्मुख होते हैं।'
- source_word: אֲדַבֵּר
  choice: मैं बोलता हूँ
  rationale: דבר का पिएल अपूर्ण, प्रथम पुरुष एकवचन, यहाँ सामान्य वर्तमान के रूप में स्वाभाविक है। ‘शान्ति की बात करता हूँ’ कहना मूल में निहित न होने वाली विषयवस्तु जोड़ देता।
- source_word: הֵמָּה
  choice: वे
  rationale: यह तृतीय पुरुष पुल्लिंग बहुवचन सर्वनाम विरोधियों को सूचित करता है। हिन्दी में ‘वे’ पर्याप्त है और वाक्य का विरोध उसका बल बनाए रखता है।
- source_word: לַמִּלְחָמָה
  choice: युद्ध के पक्ष में
  rationale: ל उपसर्ग यहाँ दिशा या रुझान बताता है। ‘युद्ध के पक्ष में’ पहले खंड के ‘शान्ति के पक्ष में’ के साथ स्पष्ट काव्यात्मक समानांतरता रखता है।
