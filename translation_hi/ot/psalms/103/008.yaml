  yaml_path: translation/ot/psalms/103/008.yaml
  text: Yahweh is compassionate and gracious[b][a], slow to anger and abounding in steadfast love.
translation:
  language: hi
  text: याहवे करुणामय और अनुग्रहकारी है, क्रोध करने में धीमा और अटल प्रेम से भरपूर है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी חָסֶד में अटल और विश्वासयोग्य प्रेम का भाव है, विशेषकर वाचा के संबंध में; इसका अनुवाद ‘विश्वासयोग्य प्रेम’ या ‘वाचा की निष्ठा’ भी किया जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: רַחוּם
  choice: करुणामय
  rationale: यह विशेषण गहरी करुणा और दया व्यक्त करता है; ‘करुणामय’ आधुनिक, स्वाभाविक और गरिमापूर्ण हिन्दी है।
- source_word: חַנּוּן
  choice: अनुग्रहकारी
  rationale: यह बिना कमाए कृपा और अनुग्रह देने वाले स्वभाव को व्यक्त करता है तथा पहले विशेषण का केवल पर्याय बन जाने से बचाता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: मूल पाठ में परमेश्वर का व्यक्तिगत नाम है; इसलिए उपाधि से बदलने के बजाय उसका हिन्दी लिप्यंतरण किया गया है।
- source_word: אֶרֶךְ אַפַּיִם
  choice: क्रोध करने में धीरजवन्त
  rationale: शाब्दिक मुहावरा ‘लम्बी नासिका वाला’ विलम्ब से क्रोधित होने का भाव देता है; यह हिन्दी रूप अर्थ को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: רַב
  choice: भरपूर
  rationale: यह חָסֶד की प्रचुरता को सहज और सशक्त हिन्दी में व्यक्त करता है।
- source_word: חָסֶד
  choice: अटल प्रेम
  rationale: यह प्रेम, निष्ठा और स्थायित्व के संयुक्त भाव को संक्षेप में बनाए रखता है; covenantal आयाम को पादटिप्पणी में स्पष्ट किया गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: यहाँ मूल इब्रानी पाठ व्यक्तिगत ईश्वरीय नाम का प्रयोग करता है। लिप्यंतरण नाम और उपाधि के भेद को सुरक्षित रखता है।
- issue: חָסֶד का अर्थ-क्षेत्र
  choice: अटल प्रेम
  alternative: विश्वासयोग्य प्रेम; वाचा की निष्ठा; करुणा
  rationale: ‘अटल प्रेम’ स्नेह और स्थायी निष्ठा दोनों को समेटता है, जबकि किसी एक संकीर्ण धर्मवैचारिक व्याख्या को निर्णायक नहीं बनाता।
translation_notes:
  register: आधुनिक मानक हिन्दी; सामान्य पाठक के लिए सहज, किंतु काव्यात्मक और गरिमापूर्ण। समानांतर इब्रानी विशेषणों का भेद बनाए रखा गया है और मूल पंक्ति की संक्षिप्तता सुरक्षित रखी गई है।
