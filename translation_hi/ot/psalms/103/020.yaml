id: PSA.103.20
reference: Psalms 103:20
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: בָּרֲכ֥וּ יְהוָ֗ה מַלְאָ֫כָ֥י/ו גִּבֹּ֣רֵי כֹ֭חַ עֹשֵׂ֣י דְבָר֑/וֹ לִ֝/שְׁמֹ֗עַ בְּ/ק֣וֹל דְּבָרֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/103/020.yaml
  text: Bless Yahweh[a], his angels, mighty in strength, who do his word[b], obeying the voice of his word.
translation:
  language: hi
  text: हे यहोवा के स्वर्गदूतों, यहोवा को धन्य कहो—तुम जो सामर्थ्यवान हो, उसके वचन को पूरा करते हो और उसके वचन की वाणी मानते हुए ऐसा करते हो।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בָּרֲכוּ
  choice: धन्य कहो
  rationale: बहुवचन आज्ञार्थक क्रिया ברך को भजन 103 में बार-बार आने वाले आह्वान के अनुरूप रखा गया है। हिंदी में परमेश्वर को संबोधित करते हुए ‘धन्य कहो’ स्वाभाविक है और इसे सामान्य ‘स्तुति करो’ तक सीमित नहीं करता।
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिंदी बाइबल-परंपरा में व्यापक रूप से पहचाने जाने वाले रूप ‘यहोवा’ से चतुरक्षरीय व्यक्तिगत नाम को उपाधि से बदलने के बजाय नाम के रूप में सुरक्षित रखा गया है।
- source_word: מַלְאָכָיו
  choice: उसके स्वर्गदूतों
  rationale: इस स्वर्गीय काव्य-संदर्भ में מַלְאָך मानव दूतों के बजाय स्वर्गीय प्राणियों को सूचित करता है; ‘स्वर्गदूत’ आधुनिक हिंदी में स्पष्ट और प्रचलित है।
- source_word: גִּבֹּרֵי כֹחַ
  choice: सामर्थ्य में बलवान
  rationale: रचना की ‘शक्ति/सामर्थ्य में पराक्रमी’ भावना बचती है, किंतु अनावश्यक सैनिक अर्थ नहीं जोड़ा जाता।
- source_word: עֹשֵׂי דְבָרוֹ
  choice: उसके वचन को पूरा करते हो
  rationale: ‘वचन करना’ हिंदी में अस्वाभाविक है। ‘पूरा करते हो’ दैवी वचन को कार्यान्वित करने का अर्थ देता है और דָּבָר को संकुचित करके केवल ‘आज्ञा’ नहीं बनाता।
- source_word: לִשְׁמֹעַ בְּקוֹל דְּבָרוֹ
  choice: उसके वचन की वाणी मानते हो
  rationale: שׁמע בְּקוֹל का मुहावरा सुनने के साथ आज्ञापालन/मानने का भाव रखता है। ‘वाणी मानते हो’ उस प्रत्युत्तरकारी श्रवण को व्यक्त करता और קוֹל की ‘वाणी’ छवि बचाता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल में व्यक्तिगत ईश्वरीय नाम है, इसलिए ‘प्रभु’ जैसी उपाधि से प्रतिस्थापन नहीं किया गया। ‘यहोवा’ हिंदी के सामान्य पाठक के लिए अधिक परिचित नामरूप है; ‘याहवे’ भी संभावित लिप्यंतरण है।
- issue: לִשְׁמֹעַ में सुनने और आज्ञापालन का संबंध
  choice: वाणी मानते हो
  alternative: वाणी सुनते हो
  rationale: इस प्रसंग में स्वर्गदूत परमेश्वर के वचन को पूरा करते हैं; अतः क्रिया में निहित प्रत्युत्तरकारी आज्ञापालन को ‘मानते हो’ से व्यक्त किया गया, बिना केवल श्रवण की छवि को पूर्णतः मिटाए।
translation_notes:
  register: आधुनिक मानक हिंदी में काव्यात्मक, गरिमापूर्ण और सीधे संबोधन वाला रूप। ‘हे यहोवा के स्वर्गदूतों’ से वाक्य-संबंध हिंदी में स्पष्ट किया गया है। किसी पादटिप्पणी की आवश्यकता नहीं पड़ी।
