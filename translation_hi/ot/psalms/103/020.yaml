revisions:
- from: हे यहोवा के स्वर्गदूतों, उसे धन्य कहो—तुम जो सामर्थ्य में बलवान हो, उसके वचन को पूरा करते हो और उसके वचन की वाणी मानते हो।
  to: हे यहोवा के स्वर्गदूतों, यहोवा को धन्य कहो—तुम जो सामर्थ्यवान हो, उसके वचन को पूरा करते हो और उसके वचन की वाणी मानते हुए ऐसा करते हो।
  rationale: The revised text explicitly renders the object ‘Yahweh,’ improves the syntactic relation of the final infinitive to ‘doing his word,’ and makes the Hindi more natural while preserving the Hebrew repetition of ‘his word’ and the קול (‘voice’) imagery. No footnote is needed because the translation itself retains the relevant semantic range without presenting a disputed textual reading.
