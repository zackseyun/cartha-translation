  text: to those who keep his covenant[a], and to those who remember his precepts[b], to do them.
translation:
  language: hi
  text: उनके लिए जो उसकी वाचा का पालन करते हैं[a], और जो उसके उपदेशों को याद रखते हैं[b], ताकि वे उनका पालन करें।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘उसकी वाचा की रक्षा करते हैं।’
    reason: lexical_alternative
  - marker: b
    text: या ‘उसके निर्देशों’ अथवा ‘उसकी आज्ञाओं।’
    reason: lexical_alternative
lexical_decisions:
- source_word: שֹׁמְרֵי
  choice: जो ... पालन करते हैं
  rationale: यह कृदन्त वाचा को सँभालने, मानने और उसके प्रति निष्ठावान रहने का भाव रखता है। हिन्दी में ‘पालन करते हैं’ वाचागत आज्ञाकारिता को स्वाभाविक और स्पष्ट रूप से व्यक्त करता है।
- source_word: בְרִיתוֹ
  choice: उसकी वाचा
  rationale: בְּרִית परमेश्वर और उसके लोगों के बीच स्थापित बंधन के लिए प्रयुक्त प्रमुख बाइबलीय शब्द है; ‘वाचा’ इसका धार्मिक और साहित्यिक भार सुरक्षित रखता है।
- source_word: וּלְזֹכְרֵי
  choice: और जो ... याद रखते हैं
  rationale: זכר यहाँ केवल मानसिक स्मरण नहीं, बल्कि ऐसा सचेत ध्यान बताता है जो आचरण की ओर ले जाता है। अगले वाक्यांश से इसका व्यावहारिक आशय स्पष्ट होता है।
- source_word: פִקֻּדָיו
  choice: उसके उपदेशों
  rationale: פִּקּוּדִים परमेश्वर द्वारा ठहराए गए निर्देशों या आदेशों को दर्शाता है। ‘उपदेश’ आधुनिक हिन्दी में समझने योग्य है और इसे निकटवर्ती अन्य व्यवस्था-संबंधी शब्दों से कुछ अलग रखता है।
- source_word: לַעֲשׂוֹתָם
  choice: ताकि उनका पालन करें
  rationale: ל के साथ infinitive construct प्रयोजन या लक्ष्य व्यक्त कर सकता है। हिन्दी में ‘ताकि’ स्मरण और आज्ञापालन का संबंध स्पष्ट करता है; ‘पालन करें’ आदेशों को व्यवहार में लाने का स्वाभाविक मुहावरा है।
theological_decisions:
- issue: परमेश्वर के उपदेशों को ‘याद रखने’ का नैतिक और व्यावहारिक बल
  choice: ‘याद रखते हैं, ताकि उनका पालन करें’
  alternative: ‘याद रखते हैं, उन्हें करने के लिए’
  rationale: इब्रानी वाक्य-विन्यास स्मरण को आचरण से जोड़ता है। चुना हुआ रूप आज्ञाकारी स्मरण को व्यक्त करता है, पर उद्धार या धार्मिकता के साधन के विषय में पाठ से आगे कोई मत नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। पद अपने पूर्ववर्ती वाक्य से जुड़ा होने के कारण आरम्भ में ‘उनके लिए’ रखा गया है। सभी सर्वनाम मूल पाठ के पुल्लिंग एकवचन कर्ता और बहुवचन उपदेशों के अनुरूप हैं।
