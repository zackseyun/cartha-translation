    reason: lexical_alternative
lexical_decisions:
- source_word: לָנֶצַח
  choice: सदा
  rationale: लְ के साथ נֶצַח दीर्घ अथवा निरंतर अवधि व्यक्त करता है। ‘सदा’ काव्यात्मक समानांतरता और स्वाभाविक हिन्दी दोनों को बनाए रखता है।
- source_word: יָרִיב
  choice: विवाद नहीं करता रहेगा
  rationale: ריב में विवाद करने, संघर्ष करने या किसी के विरुद्ध मामला उठाने का भाव हो सकता है। ‘विवाद करना’ न्यायिक अर्थ को अनावश्यक रूप से सीमित किए बिना संबंधात्मक टकराव का भाव सुरक्षित रखता है।
- source_word: לְעוֹלָם
  choice: हमेशा
  rationale: עוֹלָם अनिश्चित अथवा स्थायी दीर्घावधि को दर्शाता है। दूसरे चरण में ‘हमेशा’ पहले चरण के ‘सदा’ के समानांतर अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: יִטּוֹר
  choice: मन में रखे रहेगा
  rationale: נטר का मूल भाव किसी बात को रखे या सँभाले रहने का है और इस प्रसंग में यह क्रोध अथवा वैर मन में बनाए रखने का मुहावरेदार अर्थ देता है। यह हिन्दी प्रयोग उस भाव को व्यक्त करते हुए कर्म को स्पष्ट नहीं करता।
theological_decisions:
- issue: परमेश्वर किस बात को मन में रखता है, इसे स्पष्ट करना या न करना
  choice: 'इब्रानी की तरह कर्म को अनकहा रखा गया है: ‘मन में रखे रहेगा।’'
  alternative: ‘अपना क्रोध बनाए रखेगा’ अथवा ‘वैर रखेगा।’
  rationale: आसपास का प्रसंग क्रोध या अप्रसन्नता की ओर संकेत करता है, पर इस पद में उसका स्पष्ट उल्लेख नहीं है। कर्म को अनकहा रखने से मूल की संक्षिप्तता और अर्थगत खुलापन सुरक्षित रहता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और काव्यात्मक रूप अपनाया गया है। दोनों समानांतर चरणों में ‘सदा/हमेशा’ रखा गया है; दूसरे चरण में मूल की तरह कर्म को अनकहा छोड़ा गया है।
