source:
  edition: WLC
  text: יְֽהוָ֗ה בַּ֭/שָּׁמַיִם הֵכִ֣ין כִּסְא֑/וֹ וּ֝/מַלְכוּת֗/וֹ בַּ/כֹּ֥ל מָשָֽׁלָה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/103/019.yaml
  text: Yahweh has established his throne in the heavens[b][a], and his kingdom rules over all.
translation:
  language: hi
  text: याहवे ने स्वर्गमंडल में अपना सिंहासन स्थापित किया है, और उसका राज्य सब पर शासन करता है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत वाचा-नाम को शीर्षक से बदलने के बजाय देवनागरी में लिप्यंतरित किया गया है।
- source_word: בַּשָּׁמַיִם
  choice: स्वर्गमंडल में
  rationale: हिब्रू का रूप बहुवचन है; हिंदी में ‘स्वर्गमंडल’ उसकी व्यापकता और काव्यात्मक गरिमा को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: הֵכִין
  choice: स्थापित किया है
  rationale: हिफ़ील रूप यहाँ दृढ़तापूर्वक स्थापित करने का भाव देता है और सिद्ध भूतकालीन क्रिया के वर्तमान परिणाम को भी बनाए रखता है।
- source_word: כִּסְאוֹ
  choice: अपना सिंहासन
  rationale: राजकीय संदर्भ में यह स्वाभाविक और सटीक हिंदी है; कर्ता याहवे की ओर लौटने के कारण ‘अपना’ उपयुक्त है।
- source_word: וּמַלְכוּתוֹ
  choice: और उसका राज
  rationale: מַלְכוּת राज्य, राजत्व या शासन को सूचित कर सकता है। ‘राज’ हिंदी में क्षेत्र और राजकीय प्रभुता दोनों का भाव रखता है और अगले ‘शासन करता है’ के साथ स्वाभाविक है।
- source_word: בַּכֹּל
  choice: सब पर
  rationale: מָשָׁלָה के साथ यह सार्वभौमिक प्रभुता के विस्तार को व्यक्त करता है।
- source_word: מָשָׁלָה
  choice: शासन करता है
  rationale: स्त्रीलिंग एकवचन सिद्ध रूप अपने विषय מַלְכוּת से सहमत है; यहाँ काव्यात्मक सार्वकालिक कथन होने के कारण हिंदी वर्तमान काल स्वाभाविक है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा अथवा ‘प्रभु’
  rationale: व्यक्तिगत वाचा-नाम को शीर्षक से प्रतिस्थापित न करके उसका लिप्यंतरण किया गया है; इससे मूल पाठ का नामगत स्वरूप सुरक्षित रहता है।
- issue: מָשָׁלָה का काल और पक्ष
  choice: शासन करता है
  alternative: शासन किया है
  rationale: यद्यपि हिब्रू क्रिया सिद्ध रूप में है, यहाँ वह परमेश्वर की सार्वकालिक और सतत प्रभुता का कथन करती है; हिंदी का सामान्य वर्तमान इस अर्थ को स्वाभाविक रूप से व्यक्त करता है।
- issue: מַלְכוּת की अर्थ-सीमा
  choice: राज
  alternative: राजत्व अथवा शासन
  rationale: ‘राज’ मूल शब्द की राज्य/राजत्व/राजकीय शासन की अर्थ-सीमा को पूरी तरह किसी एक अमूर्त या भौगोलिक अर्थ में सीमित किए बिना बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिंदी में संक्षिप्त, गरिमापूर्ण काव्यात्मक वाक्य। ‘स्वर्गमंडल’ बहुवचन שָׁמַיִם की व्यापकता को हिंदी में अप्राकृतिक बहुवचन बनाए बिना दर्शाता है; ‘राज’ सामान्य पाठक के लिए सुबोध रहते हुए राजकीय प्रभुता का भाव रखता है।
