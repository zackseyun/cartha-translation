  text: עֹשֵׂ֣ה צְדָק֣וֹת יְהוָ֑ה וּ֝/מִשְׁפָּטִ֗ים לְ/כָל עֲשׁוּקִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/103/006.yaml
  text: Yahweh works righteousness and justice for all who are oppressed[a].
translation:
  language: hi
  text: याहवे सभी शोषितों के लिए धर्मपूर्ण कार्य करता है और न्याय करता है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “याहवे सभी शोषितों के लिए धर्मपूर्ण कार्य करता है और न्यायिक निर्णय देता है।”
    reason: צְדָקוֹत और מִשְׁפָּטִים दोनों बहुवचन हैं; वे क्रमशः धर्मपूर्ण कार्यों और न्यायिक निर्णयों का अधिक ठोस अर्थ दे सकते हैं।
lexical_decisions:
- source_word: עֹשֵׂה
  choice: काम करता है
  rationale: कल (Qal) कृदन्त यहाँ याहवे के निरन्तर और स्वभावगत कार्य को व्यक्त करता है; वर्तमान काल का यह रूप आधुनिक हिन्दी में स्वाभाविक है।
- source_word: צְדָקוֹת
  choice: धार्मिकता के काम
  rationale: बहुवचन संज्ञा यहाँ धर्मपूर्ण अथवा न्यायोचित कार्यों को सूचित कर सकती है। 'धार्मिकता के काम' बहुवचन की ठोस क्रियात्मकता बनाए रखता है और अगले מִשְׁפָּטִים से इसका भेद भी स्पष्ट करता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी परमेश्वर-नाम को किसी उपाधि से बदलने के बजाय देवनागरी में लिप्यन्तरित किया गया है।
- source_word: וּמִשְׁפָּטִים
  choice: और न्याय
  rationale: מִשְׁפָּטִים न्यायिक निर्णयों अथवा न्याय के कार्यों को सूचित कर सकता है; सामूहिक अर्थ में 'न्याय' स्पष्ट और स्वाभाविक हिन्दी है।
- source_word: לְכָל
  choice: उन सबके लिए
  rationale: לְ यहाँ लाभार्थी को चिह्नित करता है और כָל की सर्वसमावेशी शक्ति 'सब' से बनी रहती है।
- source_word: עֲשׁוּקִים
  choice: जो सताए जाते हैं
  rationale: עשק का निष्क्रिय कृदन्त अत्याचार, शोषण या अन्याय सह रहे लोगों को दर्शाता है; 'सताए जाते हैं' निष्क्रिय और जारी अवस्था को सरल आधुनिक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: परमेश्वर-नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा अथवा प्रभु
  rationale: मूल पाठ में व्यक्तिगत चतुरक्षरीय नाम है; 'याहवे' उसका व्यापक रूप से स्वीकृत विद्वत्तापूर्ण लिप्यन्तरण है और उसे उपाधि में नहीं बदलता।
- issue: צְדָקוֹת और מִשְׁפָּטִים के बीच सम्बन्ध
  choice: धार्मिकता के काम और न्याय
  alternative: धार्मिकता और न्याय; धर्मपूर्ण कार्य और न्यायिक निर्णय
  rationale: पहले शब्द के बहुवचन और क्रियात्मक अर्थ को रखा गया है, जबकि दूसरे को सामूहिक 'न्याय' के रूप में प्रस्तुत किया गया है; पादटिप्पणी दोनों के अधिक ठोस बहुवचन विकल्प को सुरक्षित रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और सार्वजनिक पाठ के योग्य रूप। 'धार्मिकता' बाइबिलीय अर्थक्षेत्र को बनाए रखता है, जबकि 'काम करता है' और 'जो सताए जाते हैं' सामान्य पाठक के लिए सहज हैं।
