  text: He has not dealt with us according to our sins[a], nor repaid us according to our iniquities.
translation:
  language: hi
  text: 'उसने हमारे पापों के अनुसार[a] हमारे साथ व्यवहार नहीं किया,

    और न हमारे अधर्मों के अनुसार हमें प्रतिफल दिया।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसने हमारे साथ वैसा नहीं किया जैसा हमारे पापों के योग्य था, और न हमारे अधर्मों के योग्य हमें प्रतिफल दिया।”
    reason: כ उपसर्ग को ‘के अनुसार’ अथवा योग्यता और अनुपात स्पष्ट करने वाले वाक्यांश से व्यक्त किया जा सकता है।
lexical_decisions:
- source_word: כַּחֲטָאֵינוּ
  choice: हमारे पापों के अनुसार
  rationale: उपसर्ग כ तुलना और अनुपात व्यक्त करता है। ‘के अनुसार’ यह अर्थ स्वाभाविक हिन्दी में बनाए रखता है, और बहुवचन חטאים को पापपूर्ण कामों के रूप में व्यक्त करता है।
- source_word: עָשָׂה לָנוּ
  choice: हमारे साथ व्यवहार किया
  rationale: עשה का मूल अर्थ व्यापक है—‘करना’ या ‘कार्य करना’। לָנוּ के साथ यहाँ यह परमेश्वर के हमारे प्रति आचरण को बताता है; इसलिए ‘हमारे साथ व्यवहार किया’ प्रसंगानुकूल और सहज है।
- source_word: וְלֹא
  choice: और न
  rationale: संयोजक और निषेध दूसरे काव्य-पाद को पहले से जोड़ते हैं। ‘और न’ समानांतर निषेध को स्पष्ट रखता है।
- source_word: כַּעֲוֺנֹתֵינוּ
  choice: हमारे अधर्मों के अनुसार
  rationale: עון में अधर्म, दोष और दोष का परिणाम—इन अर्थों की गुंजाइश है। ‘अधर्मों’ पहले पाद के ‘पापों’ से शब्दगत भेद बनाए रखता है और अर्थ को केवल दोषभाव तक सीमित नहीं करता।
- source_word: גָּמַל עָלֵינוּ
  choice: हमें बदला दिया
  rationale: גמל किसी के कर्म के अनुरूप उसे लौटाने या प्रतिफल देने का भाव रखता है। इस नकारात्मक प्रसंग में ‘बदला दिया’ सहज रूप से वह दंडात्मक प्रतिदान व्यक्त करता है जो अधर्मों के कारण मिल सकता था; यह किसी सकारात्मक पुरस्कार का संकेत नहीं देता।
- source_word: לֹא ... לֹא
  choice: नहीं ... और न
  rationale: दोहराया गया निषेध दोनों संतुलित पादों में परमेश्वर की दयापूर्ण रोक को उभारता है। हिन्दी में ‘नहीं ... और न’ इस समानांतरता को स्वाभाविक ढंग से रखता है।
theological_decisions:
- issue: परमेश्वर की दया को इस प्रकार व्यक्त करना कि प्रायश्चित के किसी विशेष सिद्धांत या न्याय के समय को पाठ में न जोड़ा जाए
  choice: सामान्य कथन कि परमेश्वर ने हमारे पापों और अधर्मों के अनुपात में हमारे साथ व्यवहार या प्रतिदान नहीं किया
  alternative: इसे केवल सांसारिक दंडों तक सीमित करना, या इसे हर प्रकार के ईश्वरीय न्याय का पूर्ण निषेध मानना
  rationale: इब्रानी पाठ परमेश्वर के दयापूर्ण व्यवहार और पाप के अनुपात में प्रतिदान न देने की व्यापक बात करता है। अनुवाद न इसे केवल इस जीवन के परिणामों तक सीमित करता है, न किसी भी न्याय के पूर्ण अभाव का दावा करता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और काव्यात्मक रूप अपनाया गया है। दो पादों की समानांतर संरचना तथा ‘पापों/अधर्मों’ का शब्दगत भेद बनाए रखा गया है।
