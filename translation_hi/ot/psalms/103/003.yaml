lexical_decisions:
- source_word: הַסֹּלֵחַ
  choice: जो…क्षमा करता है
  rationale: निश्चित उपपद के साथ आया कृदंत यहाँ यहोवा के निरंतर स्वभावगत कार्य का वर्णन करता है। ‘जो…क्षमा करता है’ आधुनिक हिन्दी में स्वाभाविक है और इब्रानी रचना का संबंधवाचक भाव बनाए रखता है।
- source_word: לְכָל
  choice: सारे
  rationale: यह व्यापकता को व्यक्त करता है और ‘अधर्म’ तथा ‘रोगों’ दोनों के साथ सहज हिन्दी देता है।
- source_word: עֲוֺנֵכִי
  choice: तेरे सारे अधर्म
  rationale: עָוֹן में अधर्म, दोष और पाप—इनसे जुड़े अर्थ संभव हैं। ‘अधर्म’ उसके नैतिक भार को बनाए रखता है; इब्रानी का एकवचन यहाँ सामूहिक अर्थ में है। स्त्रीलिंग एकवचन प्रत्यय उस ‘प्राण’ को संबोधित करता है जिससे भजनकार बात कर रहा है; हिन्दी में उसका स्वाभाविक रूप ‘तेरे’ है।
- source_word: הָרֹפֵא
  choice: जो…चंगा करता है
  rationale: यह भी निश्चित उपपद वाला कृदंत है और पिछले खंड के समानांतर यहोवा के स्वभावगत कार्य को बताता है। ‘चंगा करता है’ रोग से आरोग्य देने के ठोस अर्थ को स्पष्ट रखता है।
- source_word: תַּחֲלֻאָיִכִי
  choice: तेरे सारे रोगों
  rationale: संज्ञा बीमारी या रोग को दर्शाती है। ‘रोगों’ से उसका मूल शारीरिक अर्थ बना रहता है, जबकि काव्यात्मक संदर्भ में व्यापक अर्थ की संभावना को अनुवाद में बंद नहीं किया जाता।
theological_decisions:
- issue: चंगा करने की भाषा को केवल आत्मिक अर्थ देना या उसके ठोस अर्थ को बनाए रखना
  choice: मुख्य पाठ में ‘तेरे सारे रोगों को चंगा करता है’
  alternative: ‘तेरे सारे आत्मिक रोगों को चंगा करता है’ अथवा रूपकात्मक ‘तेरी सारी दुर्बलताएँ दूर करता है’
  rationale: इब्रानी शब्द स्वाभाविक रूप से रोग या बीमारी को दर्शाता है। भजन का काव्यात्मक संदर्भ व्यापक धार्मिक चिंतन की अनुमति दे सकता है, पर अनुवाद को इसे केवल शारीरिक या केवल आत्मिक अर्थ तक सीमित नहीं करना चाहिए।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। दोनों समानांतर इब्रानी कृदंतों को ‘जो…करता है’ से प्रस्तुत किया गया है। ‘तेरे’ का प्रयोग निकट, एकवचन संबोधन को बनाए रखता है; यह भजनकार द्वारा अपने ही ‘प्राण’ को संबोधित करने के संदर्भ में स्वाभाविक हिन्दी है।
