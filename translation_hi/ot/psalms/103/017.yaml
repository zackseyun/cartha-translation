  text: But the steadfast love of Yahweh is from everlasting to everlasting on those who fear him[a], and his righteousness to children's children.
translation:
  language: hi
  text: 'परन्तु याहवे का अटल प्रेम

    उसका भय मानने वालों पर

    अनादिकाल से अनन्तकाल तक बना रहता है,

    और उसकी धार्मिकता[a]

    उनकी सन्तानों की सन्तानों तक बनी रहती है।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “न्याय।” यहाँ प्रयुक्त इब्रानी शब्द प्रसंग में धार्मिकता और न्याय—दोनों अर्थ दे सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְחֶסֶד
  choice: परन्तु ... अटल प्रेम
  rationale: वाव को पिछले पद में मनुष्य के क्षणभंगुर जीवन के साथ विरोध दिखाने के लिए ‘परन्तु’ कहा गया है। חֶסֶד के निष्ठावान और स्थायी प्रेम के भाव को सहज आधुनिक हिन्दी में ‘अटल प्रेम’ व्यक्त करता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय हिन्दी में लिप्यन्तरित किया गया है।
- source_word: מֵעוֹלָם וְעַד עוֹלָם
  choice: अनादिकाल से अनन्तकाल तक
  rationale: यह युग्म दोनों दिशाओं में असीम कालावधि का काव्यात्मक बोध देता है; चुना हुआ रूप हिन्दी में स्वाभाविक और गरिमापूर्ण है।
- source_word: עַל יְרֵאָיו
  choice: उन पर जो उसका भय मानते हैं
  rationale: עַל को ‘उन पर’ और יְרֵאָיו को ‘जो उसका भय मानते हैं’ कहा गया है, जिससे भय और श्रद्धा से जुड़ा वाचा-संबंधी भाव कमज़ोर नहीं पड़ता।
- source_word: וְצִדְקָתוֹ
  choice: और उसकी धार्मिकता
  rationale: צְדָקָה में धार्मिकता और न्याय दोनों अर्थ संभव हैं। समानान्तर पंक्ति में परमेश्वर के स्थायी सही और विश्वासयोग्य आचरण का व्यापक भाव रखने के लिए ‘धार्मिकता’ मुख्य पाठ में है।
- source_word: לִבְנֵי בָנִים
  choice: उनकी सन्तानों की सन्तानों तक
  rationale: यह रूप मूल के पीढ़ी-दर-पीढ़ी बिम्ब को बनाए रखता है और केवल ‘पोते-पोतियों’ जितना संकीर्ण नहीं है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा
  rationale: मूल में व्यक्तिगत वाचा-नाम है; ‘याहवे’ उसका स्रोत-संगत आधुनिक लिप्यन्तरण है, न कि ‘प्रभु’ जैसी स्थानापन्न उपाधि।
- issue: צִדְקָה का प्रसंगगत अर्थ
  choice: धार्मिकता
  alternative: न्याय
  rationale: यहाँ अटल प्रेम के समानान्तर परमेश्वर के पीढ़ियों तक बने रहने वाले सही और विश्वासयोग्य आचरण का व्यापक अर्थ उपयुक्त है; फिर भी ‘न्याय’ वास्तविक शाब्दिक संभावना है, इसलिए उसे पादटिप्पणी में रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और काव्यात्मक रूप रखा गया है। ‘बना रहता है’ मूल में निहित संबंध को हिन्दी में स्पष्ट और स्वाभाविक बनाता है। पादटिप्पणी-चिह्न उसी शब्द ‘धार्मिकता’ के साथ रखा गया है जिससे उसका वैकल्पिक अर्थ संबंधित है।
