id: PSA.103.12
reference: Psalms 103:12
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: כִּ/רְחֹ֣ק מִ֭זְרָח מִֽ/מַּֽעֲרָ֑ב הִֽרְחִ֥יק מִ֝מֶּ֗/נּוּ אֶת פְּשָׁעֵֽי/נוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/103/012.yaml
  text: As far as the east is from the west[b][a], so far he has removed our transgressions from us.
translation:
  language: hi
  text: पूरब पश्चिम से जितना दूर है, उसने हमारे अपराधों को हमसे उतना ही दूर कर दिया है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “अपराधों” के लिए इब्रानी शब्द का अर्थ “विद्रोह” या “उल्लंघन” भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּרְחֹק
  choice: जितनी दूर ... उतनी ही दूर
  rationale: यह तुलनात्मक रचना दूरी की समान मात्रा व्यक्त करती है; हिन्दी में यह स्वाभाविक ढंग से इब्रानी तुलना को बनाए रखती है।
- source_word: מִזְרָח מִמַּעֲרָב
  choice: पूरब पश्चिम से
  rationale: ये सूर्योदय और सूर्यास्त की दिशाओं की जोड़ी हैं और असीम दूरी का चित्र प्रस्तुत करती हैं। आधुनिक सामान्य हिन्दी में ‘पूरब’ और ‘पश्चिम’ सहज हैं।
- source_word: הִרְחִיק
  choice: दूर ... कर दिया है
  rationale: רחק के हिफ़ील रूप का अर्थ किसी वस्तु को दूर करना या दूर कर देना है। यह चयन कारक भाव और स्थानिक रूपक दोनों को स्पष्ट रखता है।
- source_word: מִמֶּנּוּ
  choice: हमसे
  rationale: प्रथम पुरुष बहुवचन प्रत्यय को सीधे ‘हमसे’ अनूदित किया गया है, जिससे उपासक समुदाय से अपराधों का अलग किया जाना व्यक्त होता है।
- source_word: פְּשָׁעֵינוּ
  choice: हमारे अपराधों
  rationale: פשע जानबूझकर किए गए उल्लंघन, विद्रोह या अपराध को सूचित कर सकता है। ‘अपराध’ सामान्य आधुनिक हिन्दी में स्वाभाविक है और नैतिक गंभीरता बनाए रखता है।
theological_decisions:
- issue: क्षमा के लिए स्थानिक रूपक
  choice: पूरब और पश्चिम की दूरी के रूपक को बनाए रखते हुए कहा गया है कि परमेश्वर ने अपराधों को हमसे दूर कर दिया है।
  alternative: इसे केवल सामान्य रूप से ‘उसने हमें क्षमा किया है’ कहना।
  rationale: इब्रानी पाठ अपराधों को दूर करने की क्रिया को दिशाओं के बीच की दूरी से जोड़ता है। रूपक को बनाए रखना क्षमा की पूर्णता पर भजन के बल को सुरक्षित रखता है, बिना उसकी प्रक्रिया की अतिरिक्त व्याख्या किए।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘जितनी दूर ... उतनी ही दूर’ मूल तुलना को स्वाभाविक हिन्दी में व्यक्त करता है; ‘दूर कर दिया है’ मूल के कारक और स्थानिक भाव को सुरक्षित रखता है।
