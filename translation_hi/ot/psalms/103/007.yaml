base_translation:
  language: en
  yaml_path: translation/ot/psalms/103/007.yaml
  text: He made his ways known to Moses[a], his deeds to the sons of Israel.
translation:
  language: hi
  text: 'उसने मूसा को अपने मार्ग प्रकट किए,

    और इस्राएल के पुत्रों[a] को अपने कार्य दिखाए।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘इस्राएल की सन्तान’ अथवा ‘इस्राएल के लोग।’
    reason: lexical_alternative
lexical_decisions:
- source_word: יוֹדִיעַ
  choice: प्रकट किए
  rationale: ידע के हिफ़ील रूप का अर्थ ‘जानने योग्य करना/जता देना’ है। ‘प्रकट किए’ हिन्दी में स्वाभाविक है और कारणवाचक भाव बनाए रखता है।
- source_word: דְּרָכָיו
  choice: अपने मार्ग
  rationale: דֶּרֶךְ का मूल अर्थ ‘मार्ग’ है और यहाँ परमेश्वर के कार्य करने के ढंग की ओर संकेत करता है। ‘मार्ग’ मूल रूपक को सुरक्षित रखता है।
- source_word: לְמֹשֶׁה
  choice: मूसा पर
  rationale: לְ यहाँ יוֹדִיעַ के साथ उस व्यक्ति को सूचित करता है जिसे मार्ग बताए गए; हिन्दी में ‘पर ... प्रकट किए’ स्वाभाविक और अर्थ-सटीक है।
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: इस्राएल के पुत्रों पर
  rationale: यह इब्रानी पद का लिंग-सटीक और निकट अनुवाद है। अधिक मुहावरेदार सामूहिक अर्थ पादटिप्पणी में दिया गया है।
- source_word: עֲלִילוֹתָיו
  choice: अपने कार्य
  rationale: यह संज्ञा किए गए कामों या कृत्यों को दर्शाती है। ‘कार्य’ स्पष्ट और गरिमापूर्ण है; ‘सामर्थी काम’ कहना मूल शब्द में निहित न होने वाला मूल्यांकन जोड़ सकता है।
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל का लिंगयुक्त सामूहिक प्रयोग
  choice: इस्राएल के पुत्रों
  alternative: इस्राएल की सन्तान; इस्राएल के लोग
  rationale: इब्रानी पद व्याकरण की दृष्टि से पुल्लिंग बहुवचन है और वाचा-समुदाय का पारंपरिक नाम है। मुख्य पाठ में उसका रूप बनाए रखते हुए अधिक मुहावरेदार सामूहिक विकल्प पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण काव्यात्मक रूप; समानांतर पंक्तियों को बनाए रखा गया है। ‘अपने’ का प्रयोग हिन्दी में एक ही कर्ता के मार्गों और कार्यों को स्पष्ट रूप से उससे जोड़ता है।
