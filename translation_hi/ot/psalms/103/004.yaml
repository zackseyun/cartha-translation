translation:
  language: hi
  text: 'जो तेरे जीवन को गड्ढे से छुड़ाता है[a],

    जो तुझे अटल प्रेम और करुणा से मुकुट पहनाता है[b]।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “विनाश से”; या, “कब्र से”
    reason: lexical_alternative
  - marker: b
    text: 'बहुवचन रूप: “करुणाएँ” या “दयाएँ।”'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַגּוֹאֵל
  choice: छुड़ाता है
  rationale: גאל का अर्थ छुड़ाना या वापस पा लेना है। यहाँ “छुड़ाता है” काव्यात्मक उद्धार के भाव को स्वाभाविक हिन्दी में व्यक्त करता है, बिना इसे केवल कानूनी या किसी एक धर्मसैद्धांतिक अर्थ तक सीमित किए।
- source_word: מִשַּׁחַת
  choice: गड्ढे से
  rationale: שַׁחַת गड्ढे, कब्र या विनाश का बोध करा सकता है। “गड्ढा” मूल बिंब को ठोस रूप में बनाए रखता है; अन्य अर्थ पादटिप्पणी में दिए गए हैं।
- source_word: חַיָּיְכִי
  choice: तेरे जीवन को
  rationale: חַיִּים यहाँ पूरे व्यक्ति के जीवन को दर्शाता है। “जीवन” स्वाभाविक हिन्दी है और “प्राण” या “आत्मा” द्वारा अर्थ को अनावश्यक रूप से संकुचित नहीं करता।
- source_word: הַמְעַטְּרֵכִי
  choice: तुझे ... का मुकुट पहनाता है
  rationale: עטר का प्रमुख बिंब मुकुट पहनाने या सम्मान से घेरने का है। यह प्रयोग हिन्दी में बोधगम्य है और मूल रूपक को सुरक्षित रखता है।
- source_word: חֶסֶד
  choice: अटल प्रेम
  rationale: חֶסֶד निष्ठावान, स्थिर और संबंधपरक प्रेम को व्यक्त करता है। “अटल प्रेम” इसकी दृढ़ता और स्नेह दोनों को संक्षेप में रखता है।
- source_word: וְרַחֲמִים
  choice: और करुणा
  rationale: רַחֲמִים रूप की दृष्टि से बहुवचन है, पर प्रायः प्रचुर या गहरी करुणा का सामूहिक भाव देता है। हिन्दी में “करुणा” अधिक स्वाभाविक है; बहुवचन-सदृश विकल्प पादटिप्पणी में रखा गया है।
theological_decisions:
- issue: छुटकारे के बिंब का दायरा
  choice: ऐसा काव्यात्मक छुटकारा जो जीवन को घातक विनाश से बचाने का व्यापक अर्थ रखता है
  alternative: विशेष रूप से कब्र या मृत्यु से छुटकारा; अथवा केवल आत्मिक उद्धार
  rationale: שַׁחַת का अर्थ-क्षेत्र गड्ढे, कब्र और विनाश तक फैला है। मुख्य पाठ किसी एक धर्मसैद्धांतिक अर्थ को अनिवार्य नहीं बनाता और मूल की व्यापकता बनाए रखता है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी। दूसरे पुरुष एकवचन “तेरे/तुझे” स्तोत्र में अपने ही प्राण को संबोधित करने वाले निकट, काव्यात्मक स्वर के अनुरूप है। समानांतर participles को “जो ... है” की पुनरावृत्ति से सुरक्षित रखा गया है।
