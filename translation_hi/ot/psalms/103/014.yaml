id: PSA.103.14
reference: Psalms 103:14
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: כִּי ה֖וּא יָדַ֣ע יִצְרֵ֑/נוּ זָ֝כ֗וּר כִּי עָפָ֥ר אֲנָֽחְנוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/103/014.yaml
  text: For he knows our frame[a]; he remembers that we are dust.
translation:
  language: hi
  text: क्योंकि वह हमारी बनावट[a] जानता है; वह स्मरण रखता है कि हम धूल हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘हमारी रचना’ या ‘हम कैसे बनाए गए हैं।’ इब्रानी शब्द उस चीज़ को सूचित करता है जिसे रचा या आकार दिया गया हो।
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले कथन का आधार या कारण प्रस्तुत करता है; हिन्दी में ‘क्योंकि’ उसके कारणसूचक बल को स्वाभाविक रूप से व्यक्त करता है।
- source_word: הוּא
  choice: वह
  rationale: इब्रानी का स्पष्ट सर्वनाम बनाए रखा गया है; प्रसंग में इसका संकेत परमेश्वर की ओर है।
- source_word: יָדַע
  choice: जानता है
  rationale: यहाँ पूर्ण रूप स्थायी और वर्तमान ज्ञान को व्यक्त करता है; ‘जानता है’ सीधा और स्वाभाविक अनुवाद है।
- source_word: יִצְרֵנוּ
  choice: हमारी बनावट
  rationale: יֵצֶר उस चीज़ को सूचित करता है जिसे रचा या आकार दिया गया हो। ‘हमारी बनावट’ मनुष्य की सृजित दशा को व्यक्त करती है और शब्द की अर्थगत व्यापकता बनाए रखती है।
- source_word: זָכוּר
  choice: स्मरण रखता है
  rationale: रूपतः यह निष्क्रिय कृदन्त/विशेषण है, पर प्रसंग में परमेश्वर की सतत स्मृति का विधेय है। ‘स्मरण रखता है’ इस निरंतर भाव और समानांतरता को स्पष्ट करता है।
- source_word: כִּי
  choice: कि
  rationale: यहाँ यह परमेश्वर के स्मरण की विषयवस्तु प्रस्तुत करता है, इसलिए हिन्दी में ‘कि’ उपयुक्त है।
- source_word: עָפָר
  choice: धूल
  rationale: यह शाब्दिक अर्थ के साथ सृष्टि, नश्वरता और मानवीय दुर्बलता की बाइबलीय छवि को सुरक्षित रखता है।
- source_word: אֲנָחְנוּ
  choice: हम ... हैं
  rationale: इब्रानी का वाक्य क्रियारहित है; स्वाभाविक हिन्दी में ‘हैं’ जोड़कर ‘हम धूल हैं’ कहा गया है।
theological_decisions:
- issue: मानवीय दुर्बलता और सृजित दशा की छवि
  choice: हम धूल हैं
  alternative: हम केवल धूल हैं
  rationale: सरल रूप इब्रानी की छवि और मनुष्य की नश्वरता को बनाए रखता है, पर ‘केवल’ जोड़कर मनुष्य की गरिमा के विषय में अतिरिक्त व्याख्यात्मक बल नहीं देता।
- issue: יִצְרֵנוּ में मनुष्य की रचना या संरचना
  choice: हमारी बनावट
  alternative: हमारी रचना / हम कैसे बनाए गए हैं
  rationale: ‘बनावट’ रचे और आकार दिए जाने, दोनों अर्थों के लिए स्थान छोड़ती है और किसी विशिष्ट मानवशास्त्रीय व्याख्या को अनावश्यक रूप से निश्चित नहीं करती।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, सरल किंतु गरिमापूर्ण रखी गई है। ‘स्मरण रखता है’ सामान्य ‘याद रखता है’ से कुछ अधिक औपचारिक है और काव्यात्मक/भक्तिपरक प्रसंग के अनुकूल है।
