source:
  edition: WLC
  text: בָּרֲכ֤וּ יְהוָ֨ה כָּֽל מַעֲשָׂ֗י/ו בְּ/כָל מְקֹמ֥וֹת מֶמְשַׁלְתּ֑/וֹ בָּרֲכִ֥י נַ֝פְשִׁ֗/י אֶת יְהוָֽה׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/103/022.yaml
  text: Bless Yahweh[a], all his works, in all the places of his dominion. Bless Yahweh[c][b], O my soul.
translation:
  language: hi
  text: याहवे को धन्य कहो[a], हे उसके सब कार्यों, हर उस स्थान में जहाँ उसका शासन है! हे मेरे प्राण, याहवे को धन्य कह!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “याहवे की स्तुति करो।” इब्रानी में यहाँ और पद के अंत में एक ही क्रिया दोहराई गई है।
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּרֲכ֤וּ / בָּרֲכִ֥י
  choice: धन्य कहो / धन्य कह
  rationale: ברך के दोनों आज्ञार्थक रूपों को एक ही अभिव्यक्ति से प्रस्तुत किया गया है, ताकि पद का दोहराव बना रहे। पहले बहुवचन और अंत में स्त्रीलिंग एकवचन संबोधन का अंतर हिन्दी के बहुवचन ‘कहो’ और एकवचन ‘कह’ से व्यक्त होता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: मूल पाठ में आए परमेश्वर के व्यक्तिगत वाचा-नाम को उपाधि से बदलने के बजाय हिन्दी लिप्यंतरण में रखा गया है।
- source_word: כָּל מַעֲשָׂיו
  choice: उसके सब कार्य
  rationale: מַעֲשֶׂה यहाँ परमेश्वर के किए या बनाए हुए सब कुछ को व्यापक रूप से समेटता है। ‘कार्य’ इस व्यापकता को बनाए रखता है; संबोधन में ‘कार्यो’ रूप प्रयुक्त है।
- source_word: בְּכָל מְקֹמוֹת מֶמְשַׁלְתּוֹ
  choice: हर उस स्थान में जहाँ उसका शासन है
  rationale: शाब्दिक ‘उसके शासन के सभी स्थानों में’ हिन्दी में असहज है। यह रूप स्थानवाचक व्यापकता और מֶמְשָׁלָה के ‘शासन/प्रभुत्व’ अर्थ दोनों को स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: נַפְשִׁי
  choice: हे मेरे प्राण
  rationale: נֶפֶשׁ का यहाँ अर्थ भजनकार का अपना भीतरी व्यक्तित्व है, जिसे वह सीधे संबोधित करता है। ‘प्राण’ काव्यात्मक और प्रतिष्ठित है तथा आत्म-संबोधन को बनाए रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: याहवे
  alternative: प्रभु / यहोवा
  rationale: मूल इब्रानी में व्यक्तिगत नाम स्पष्ट रूप से उपस्थित है। ‘याहवे’ उसे उपाधि में बदले बिना प्रस्तुत करता है; ‘यहोवा’ बाद की मिश्रित उच्चारण-परंपरा को दर्शाता है।
- issue: ברך को ‘धन्य कहना’ या ‘स्तुति करना’
  choice: धन्य कहना
  alternative: स्तुति करना
  rationale: ‘धन्य कहना’ मूल क्रिया के अधिक निकट है और पूरे भजन में दोहराए गए आह्वान को सुरक्षित रखता है। सन्दर्भ में इसका आशय स्तुति करना है, जिसे पादटिप्पणी में दिया गया है।
- issue: ‘सब कार्य’ किसे दर्शाता है
  choice: व्यापक और व्यक्तिरूप संबोधन को बनाए रखना
  alternative: सारी सृष्टि
  rationale: מַעֲשָׂיו में परमेश्वर की बनाई हुई वस्तुएँ और उसके किए हुए काम दोनों समा सकते हैं। केवल ‘सृष्टि’ कहने से यह वास्तविक व्यापकता संकुचित हो जाती।
translation_notes:
  register: भाषा आधुनिक, काव्यात्मक और उपासना-योग्य रखी गई है। ‘हे उसके सब कार्यो’ मूल के व्यक्तिरूप प्रत्यक्ष संबोधन को बनाए रखता है, जबकि ‘हर उस स्थान में जहाँ उसका शासन है’ असहज शाब्दिक हिन्दी से बचते हुए मूल स्थानवाचक अर्थ देता है।
