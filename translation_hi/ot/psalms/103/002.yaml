  yaml_path: translation/ot/psalms/103/002.yaml
  text: Bless Yahweh[a], O my soul, and do not forget all his benefits.
translation:
  language: hi
  text: हे मेरे प्राण, याहवे को धन्य कह, और उसके सभी उपकारों को मत भूल।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उसके सारे व्यवहार” अथवा “उसके सारे प्रतिफल।” इब्रानी शब्द का अर्थ व्यापक रूप से वह हो सकता है जो किसी से प्राप्त होता है; यहाँ आगे के संदर्भ के कारण “उपकार” अधिक उपयुक्त है।
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּרֲכִי
  choice: धन्य कह
  rationale: स्त्रीलिंग एकवचन आज्ञार्थक रूप यहाँ ‘प्राण’ को संबोधित है। ‘धन्य कह’ मूल क्रिया ברך का धार्मिक और काव्यात्मक भाव सुरक्षित रखता है; केवल ‘स्तुति कर’ कहना अर्थ को कुछ व्यापक बना देता।
- source_word: נַפְשִׁי
  choice: हे मेरे प्राण
  rationale: נפש यहाँ भजनकार के अपने समूचे व्यक्तित्व को प्रत्यक्ष संबोधन में दर्शाता है। ‘हे मेरे प्राण’ हिंदी की गरिमामय काव्य-परंपरा और संबोधन-भाव दोनों को बनाए रखता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: मूल में परमेश्वर का विशिष्ट वाचा-नाम है। हिंदी में परिचित लिप्यंतरण ‘यहोवा’ नाम की विशिष्टता को सामान्य उपाधि ‘प्रभु’ में बदलने से बचाता है।
- source_word: וְאַל תִּשְׁכְּחִי
  choice: और ... मत भूल
  rationale: संयोजक וְ और निषेधात्मक אַל के साथ दूसरे स्त्रीलिंग एकवचन रूप को सरल, स्वाभाविक हिंदी निषेधाज्ञा में व्यक्त किया गया है।
- source_word: כָּל גְּמוּלָיו
  choice: उसके किसी भी उपकार को
  rationale: निषेध के साथ ‘किसी भी ... को मत भूल’ हिंदी में כָּל की समग्रता स्वाभाविक रूप से व्यक्त करता है। संदर्भ में גמול सकारात्मक कृपापूर्ण कार्यों को सूचित करता है, इसलिए ‘उपकार’ उपयुक्त है, जबकि इसकी व्यापक अर्थ-सीमा पादटिप्पणी में रखी गई है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: पद में विशिष्ट चतुरक्षरीय ईश्वरीय नाम सीधे प्रयुक्त है। हिंदी पाठकों में प्रचलित ‘यहोवा’ उस नाम को स्पष्ट रखता है और उसे केवल उपाधि में परिवर्तित नहीं करता; ‘याहवे’ अधिक प्रत्यक्ष विद्वत्तापरक लिप्यंतरण है।
- issue: גְּמוּלָיו का सकारात्मक या व्यापक अर्थ
  choice: उसके उपकार
  alternative: उसके सारे व्यवहार; उसके प्रतिफल
  rationale: अगले पदों में क्षमा, चंगाई और छुटकारे जैसे कृपापूर्ण कार्य गिनाए गए हैं, इसलिए यहाँ सकारात्मक अर्थ संदर्भानुकूल है। फिर भी मूल शब्द की व्यापकता को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमामय काव्यात्मक संबोधन रखा गया है। ‘प्राण’ और ‘धन्य कह’ पारंपरिक धार्मिक प्रतिध्वनि बनाए रखते हैं, जबकि वाक्य-संरचना सामान्य पाठक के लिए सीधी है। पादटिप्पणी-चिह्न मुख्य पाठ में संबंधित शब्द-समूह के बाद दिया गया है।
