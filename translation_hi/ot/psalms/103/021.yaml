  text: בָּרֲכ֣וּ יְ֭הוָה כָּל צְבָאָ֑י/ו מְ֝שָׁרְתָ֗י/ו עֹשֵׂ֥י רְצוֹנֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/103/021.yaml
  text: Bless Yahweh[a], all his hosts, his ministers[b], who do his will.
translation:
  language: hi
  text: याहवे को धन्य कहो, हे उसकी सारी सेनाओं, हे उसके सेवकों, जो उसकी इच्छा पूरी करते हो।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בָּרֲכוּ
  choice: धन्य कहो
  rationale: बहुवचन आज्ञार्थक रूप है। ‘धन्य कहो’ पूरे भजन में दोहराए गए ברך के भाव को बनाए रखता है और केवल सामान्य ‘स्तुति करो’ से अधिक सटीक है।
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत नाम יהוה को किसी उपाधि से बदलने के बजाय देवनागरी में लिप्यंतरित किया गया है।
- source_word: כָּל־צְבָאָיו
  choice: उसकी सारी सेनाओ
  rationale: צָבָא का मूल अर्थ सेना या सैन्य-दल है। संबोधन में ‘सेनाओ’ स्वाभाविक है और प्रसंग के आकाशीय संकेत को पाठ में आवश्यकता से अधिक निश्चित नहीं बनाता।
- source_word: מְשָׁרְתָיו
  choice: उसके सेवको
  rationale: שׁרת औपचारिक रूप से सेवा करने को व्यक्त करता है। आधुनिक हिन्दी में ‘सेवक’ गरिमापूर्ण और सहज है; ‘मंत्री’ यहाँ भ्रामक राजनीतिक अर्थ दे सकता है।
- source_word: עֹשֵׂי רְצוֹנוֹ
  choice: जो उसकी इच्छा पूरी करते हो
  rationale: कृदन्तीय वाक्यांश को संबोधित समूह से जुड़े स्वाभाविक सम्बन्धवाचक उपवाक्य के रूप में प्रस्तुत किया गया है। ‘इच्छा पूरी करना’ רָצוֹן और עשה के संयुक्त भाव को सहज हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: ‘उसकी सेनाओं’ और ‘उसके सेवकों’ का अभिप्रेत समूह
  choice: मुख्य पाठ में व्यापक शब्दावली रखी गई है, जबकि निकट प्रसंग आकाशीय प्राणियों की ओर संकेत करता है।
  alternative: इसे स्पष्ट रूप से केवल स्वर्गदूतों अथवा आकाशीय सैन्य-दलों के रूप में अनूदित करना।
  rationale: पद 20 में स्वर्गदूतों का उल्लेख होने से आकाशीय दरबार सम्भावित सन्दर्भ है, पर इस पद के इब्रानी शब्द स्वयं अधिक व्यापक हैं। इसलिए अनुवाद मूल की व्यापकता और प्रसंगगत तनाव दोनों को सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, प्रत्यक्ष संबोधन रखा गया है। ‘हे’ से बहुवचन संबोधन स्पष्ट होता है। ‘याहवे’ व्यक्तिगत दिव्य नाम का लिप्यंतरण है; ‘धन्य कहो’ भजन में दोहराए गए आह्वान को सुरक्षित रखता है।
