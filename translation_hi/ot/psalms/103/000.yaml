lexical_decisions:
- source_word: לְדָוִד
  choice: दाऊद का भजन
  rationale: भजन-शीर्षक में לְ लेखकत्व, संबंध अथवा समर्पण सूचित कर सकता है। स्वाभाविक हिन्दी शीर्षक के लिए ‘दाऊद का भजन’ चुना गया है, जबकि मूल की संक्षिप्तता और संभावित व्यापकता पादटिप्पणी में दी गई है।
- source_word: בָּרֲכִי
  choice: धन्य कह
  rationale: मनुष्य द्वारा यहोवा को संबोधित करते समय ברך का अर्थ उसकी स्तुति करना और उसे धन्य कहना है; स्त्रीलिंग एकवचन आज्ञार्थक रूप נַפְשִׁי से मेल खाता है।
- source_word: נַפְשִׁי
  choice: हे मेरे प्राण
  rationale: נפש यहाँ स्वयं के भीतरी जीवित व्यक्तित्व को आत्म-संबोधन में दर्शाता है। ‘प्राण’ हिन्दी भजन-शैली में गरिमापूर्ण और समझने योग्य है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: व्यक्तिगत दिव्य नाम को सामान्य उपाधि ‘प्रभु’ में बदलने के बजाय हिन्दी में प्रचलित लिप्यंतरण से प्रस्तुत किया गया है।
- source_word: כָל־קְרָבַי
  choice: जो कुछ मेरे भीतर है
  rationale: शाब्दिक रूप से ‘मेरे सब भीतरी अंग’; सन्दर्भ में यह समूचे आंतरिक अस्तित्व का संकेत है। मुख्य पाठ में स्वाभाविक समष्टिगत अभिव्यक्ति रखी गई है और शाब्दिक विकल्प पादटिप्पणी में सुरक्षित है।
- source_word: שֵׁם קָדְשׁוֹ
  choice: उसके पवित्र नाम
  rationale: मूल का संबंधसूचक अर्थ सीधे और स्वाभाविक हिन्दी में सुरक्षित रखा गया है।
theological_decisions:
- issue: לְדָוִד में लेखकत्व अथवा संबंध
  choice: दाऊद का भजन
  alternative: दाऊद के लिए / दाऊद से संबंधित
  rationale: शीर्षक का पारंपरिक और सहज अर्थ दिया गया है, पर मूल पूर्वसर्ग की संभावित व्यापकता को पादटिप्पणी में स्पष्ट किया गया है।
- issue: समूचे आंतरिक अस्तित्व का व्यक्तिकरण
  choice: ‘जो कुछ मेरे भीतर है’ को एकवचन ‘वह’ के साथ आज्ञा
  alternative: ‘मेरे भीतर की सब वस्तुएँ’ को बहुवचन आज्ञा
  rationale: इब्रानी वाक्य में दूसरी आज्ञा निहित है; हिन्दी में सामूहिक अभिव्यक्ति को एक इकाई मानकर ‘वह ... धन्य कह’ प्राकृतिक है और आत्मा के साथ पूरे भीतरी अस्तित्व की समानांतर पुकार बनाए रखती है।
