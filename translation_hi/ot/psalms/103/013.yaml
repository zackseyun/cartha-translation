  yaml_path: translation/ot/psalms/103/013.yaml
  text: As a father has compassion on his children[a], so Yahweh has compassion on those who fear him.
translation:
  language: hi
  text: जैसे एक पिता अपने बच्चों[a] पर करुणा करता है, वैसे ही याहवे उन पर करुणा करता है जो उसका भय मानते हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “पुत्रों।”
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּ/רַחֵם
  choice: जैसे ... दया करता है
  rationale: उपसर्ग כְּ तुलना व्यक्त करता है, और רחם कोमल तथा गहरी करुणा को दर्शाता है। हिंदी में ‘दया करता है’ स्वाभाविक है और अगली पंक्ति की पुनरावृत्ति बनाए रखता है।
- source_word: אָב
  choice: पिता
  rationale: यह एक सामान्य, नीतिवचन-जैसी तुलना में प्रयुक्त अनिश्चित एकवचन है; हिंदी में बिना अनिश्चित उपपद के ‘पिता’ यह अर्थ स्वाभाविक रूप से देता है।
- source_word: עַל
  choice: पर
  rationale: רחם के साथ עַל दया के पात्र को चिह्नित करता है; ‘पर दया करना’ स्वाभाविक हिंदी मुहावरा है।
- source_word: בָּנִים
  choice: अपने बच्चों
  rationale: पुल्लिंग बहुवचन यहाँ पिता की संतान के लिए सामान्य अर्थ में है। ‘बच्चों’ में पुत्र-पुत्रियाँ दोनों सम्मिलित हैं; ‘अपने’ पिता-संतान के निहित संबंध को स्पष्ट करता है।
- source_word: רִחַם
  choice: दया करता है
  rationale: पहले רחם के समान अनुवाद से काव्यात्मक पुनरावृत्ति सुरक्षित रहती है। भूतकालीन रूप इस संदर्भ में सामान्य और निरंतर सत्य व्यक्त करता है, जिसे हिंदी वर्तमान काल स्वाभाविक रूप से प्रकट करता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: चतुरक्षरीय परमेश्वर-नाम को किसी उपाधि से बदलने के बजाय देवनागरी में उसके प्रचलित लिप्यंतरण ‘याहवे’ से प्रस्तुत किया गया है।
- source_word: יְרֵאָיו
  choice: अपने डरवैयों
  rationale: यह कृदन्त उन लोगों को दर्शाता है जिनकी विशेषता याहवे का भय मानना है। ‘डरवैये’ स्रोत की संक्षिप्त संज्ञात्मक अभिव्यक्ति और भय के अर्थ को सुरक्षित रखता है।
theological_decisions:
- issue: परमेश्वर के नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा / प्रभु
  rationale: मूल पाठ व्यक्तिगत चतुरक्षरीय नाम का प्रयोग करता है; ‘याहवे’ उसे उपाधि से प्रतिस्थापित किए बिना प्रस्तुत करता है।
- issue: בָּנִים में पारिवारिक लिंग-संदर्भ
  choice: बच्चों
  alternative: पुत्रों
  rationale: इस पिता-संतान तुलना में पुल्लिंग बहुवचन संतान के लिए सामान्य रूप से प्रयुक्त है; ‘बच्चों’ संदर्भित समूह को अनावश्यक रूप से केवल पुरुषों तक सीमित नहीं करता।
- issue: יְרֵאָיו में भय और श्रद्धा का संबंध
  choice: डरवैयों
  alternative: श्रद्धा रखनेवालों
  rationale: ‘डरवैये’ मूल के भय-अर्थ को सीधे बनाए रखता है; केवल ‘श्रद्धा’ कहना अर्थ को नरम करके निहित धार्मिक भय को चुपचाप हल कर देता।
translation_notes:
  register: आधुनिक मानक हिंदी में संक्षिप्त, काव्यात्मक और गरिमापूर्ण वाक्य। दोनों अर्धपंक्तियों में ‘दया करता है’ की पुनरावृत्ति और ‘जैसे ... वैसे ही’ की तुलना सुरक्षित रखी गई है। ‘डरवैयों’ लोकबोधगम्य पर गरिमापूर्ण संज्ञात्मक प्रयोग है।
