  text: כִּ֤י כִ/גְבֹ֣הַּ שָׁ֭מַיִם עַל הָ/אָ֑רֶץ גָּבַ֥ר חַ֝סְדּ֗/וֹ עַל יְרֵאָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/103/011.yaml
  text: For as high as the heavens are above the earth[a], so great is his steadfast love toward those who fear him.
translation:
  language: hi
  text: क्योंकि जितना ऊँचा आकाश पृथ्वी के ऊपर है, उसका अटल प्रेम[a] उन लोगों के प्रति उतना ही महान है जो उसका भय मानते हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उसकी करुणा” अथवा “उसकी वाचा-निष्ठा”; इब्रानी חֶסֶד में वाचा के संबंध में निष्ठावान, अटल प्रेम और दया का भाव समाया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले कथन का आधार या कारण प्रस्तुत करता है और हिंदी में काव्यात्मक व्याख्यात्मक संबंध को स्वाभाविक रूप से व्यक्त करता है।
- source_word: כִגְבֹהַּ שָׁמַיִם עַל־הָאָרֶץ
  choice: जितना ऊँचा आकाश पृथ्वी के ऊपर है
  rationale: כִ के तुलनात्मक बल और ऊर्ध्व दूरी के बिंब को स्वाभाविक हिंदी समतुल्य संरचना में सुरक्षित रखता है। शָׁמַיִם रूपतः बहुवचन है, पर आधुनिक हिंदी में इस अर्थ में ‘आकाश’ अधिक स्वाभाविक और गरिमापूर्ण है।
- source_word: גָּבַר
  choice: उतना ही प्रबल ... है
  rationale: क्रिया के ‘बलवान होना/प्रबल होना’ अर्थ को बनाए रखता है और पहले चरण की ऊँचाई के साथ मात्रा की तुलना भी स्पष्ट करता है।
- source_word: חַסְדּוֹ
  choice: उसका अटल प्रेम
  rationale: חֶסֶד में प्रेम, निष्ठा और करुणा का समृद्ध संबंधपरक अर्थ है। ‘अटल प्रेम’ इसकी स्थिरता और स्नेह दोनों को संक्षेप में व्यक्त करता है; अन्य वैध अर्थ पादटिप्पणी में दिए गए हैं।
- source_word: עַל יְרֵאָיו
  choice: उन पर ... जो उसका भय मानते हैं
  rationale: עַל के संबंधपरक लक्ष्य और יְרֵאָיו के सीधे ‘उसका भय मानने वाले’ अर्थ को सुरक्षित रखता है, बिना ‘भय’ को केवल श्रद्धा में नरम किए।
theological_decisions:
- issue: חֶסֶד का अनुवाद
  choice: उसका अटल प्रेम
  alternative: उसकी करुणा; उसकी वाचा-निष्ठा
  rationale: मुख्य पाठ में स्नेह और स्थिर निष्ठा दोनों को व्यक्त किया गया है, जबकि शब्द की वाचागत और दयामय अर्थ-छटाओं को पादटिप्पणी में सुरक्षित रखा गया है; किसी संकीर्ण सांप्रदायिक व्याख्या को नहीं थोपा गया।
- issue: יְרֵאָיו में ‘भय’ की प्रकृति
  choice: जो उसका भय मानते हैं
  alternative: जो उसके प्रति श्रद्धा रखते हैं
  rationale: सीधा शब्दार्थ और भजन की धर्मवैज्ञानिक गंभीरता बनाए रखने के लिए ‘भय मानते हैं’ चुना गया है; ‘श्रद्धा’ अकेले मूल पद की तीव्रता को कम कर सकती है।
translation_notes:
  register: आधुनिक मानक हिंदी में काव्यात्मक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध शैली। ‘जितना... उतना ही’ संरचना मूल तुलना को स्पष्ट करती है; ‘प्रबल’ मूल क्रिया की शक्ति को बनाए रखता है।
