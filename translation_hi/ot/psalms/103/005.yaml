translation:
  language: hi
  text: जो तुझे भलाई से तृप्त करता है[a], जिससे तेरी जवानी उकाब के समान फिर नई हो जाती है[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से ‘तेरे आभूषण को’ है। यह वाक्यांश कठिन है; कई लोग इसका अर्थ ‘जो जीवन भर तुझे भलाई से तृप्त करता है’ समझते हैं, जबकि एक दूसरी व्याख्यात्मक परम्परा में ‘जो तेरे मुँह को भलाई से तृप्त करता है’ है।
    reason: alternative_reading
  - marker: b
    text: या ‘किसी उकाब के समान।’ इब्रानी शब्द एक बड़े शिकारी पक्षी का नाम है, जिसका पारम्परिक अनुवाद ‘उकाब’ है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמַּשְׂבִּיעַ
  choice: तृप्त करता है
  rationale: שׂבע के हिफ़ील कृदन्त का अर्थ पूरी तरह संतुष्ट या परिपूर्ण करना है। ‘तृप्त करता है’ स्वाभाविक और गरिमापूर्ण है तथा प्रभु के कार्यों की जारी सूची के अनुरूप है।
- source_word: בַּטּוֹב
  choice: भलाई से
  rationale: טוֹב यहाँ संज्ञा के रूप में प्रयुक्त सामूहिक भाव रखता है। ‘भलाई से’ मूल की संक्षिप्तता बनाए रखता है और अनावश्यक रूप से वस्तुओं की सूची का संकेत नहीं देता।
- source_word: עֶדְיֵךְ
  choice: तेरे जीवन को
  rationale: मसोरेटिक स्वरांकन के अनुसार शब्द का सामान्य अर्थ ‘तेरा आभूषण’ है, पर इस पद में वाक्यांश अत्यन्त कठिन है। सन्दर्भानुकूल ‘तेरे जीवन को’ व्यक्ति के जीवनकाल या समग्र जीवन के तृप्त किए जाने का सम्भावित भाव देता है; अनिश्चितता को पादटिप्पणी में स्पष्ट किया गया है।
- source_word: תִּתְחַדֵּשׁ
  choice: नई हो जाती है
  rationale: חדש के हित्पएल रूप में निष्क्रिय-आत्मवाचक भाव है। ‘नई हो जाती है’ आधुनिक हिन्दी में स्वाभाविक रहते हुए नवीकरण का भाव व्यक्त करता है।
- source_word: כַּנֶּשֶׁר
  choice: उकाब की तरह
  rationale: נֶשֶׁר किसी बड़े शिकारी पक्षी का नाम है, जिसे परम्परागत रूप से eagle कहा जाता है। आधुनिक मानक हिन्दी में ‘उकाब’ इस काव्यात्मक तुलना के लिए उपयुक्त है; जीववैज्ञानिक अनिश्चितता पादटिप्पणी में रखी गई है।
- source_word: נְעוּרָיִכִי
  choice: तेरी जवानी
  rationale: बहुवचन अमूर्त संज्ञा נְעוּרִים यहाँ जवानी या युवावस्था की शक्ति का भाव देती है। ‘तेरी जवानी’ मूल काव्य-चित्र को सुरक्षित रखती है।
