  yaml_path: translation/ot/psalms/103/001.yaml
  text: Of David. Bless Yahweh[a], O my soul, and all that is within me, bless his holy name.
translation:
  language: hi
  text: 'दाऊद का।


    हे मेरे प्राण, याहवे को धन्य कह;

    मेरे भीतर का सब कुछ[a] उसके पवित्र नाम को धन्य कहे।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इब्रानी में शाब्दिक अर्थ: ‘मेरे सभी भीतरी अंग’; भावार्थ: ‘मेरा समूचा अंतरमन।’'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְדָוִד
  choice: दाऊद का
  rationale: शीर्षक में לְ किसी व्यक्ति के साथ रचना, संबंध या समर्पण का संकेत दे सकता है। ‘दाऊद का’ इस संबंध को संक्षेप में रखता है और लेखकत्व को आवश्यकता से अधिक निश्चित नहीं करता।
- source_word: בָּרֲכִי
  choice: धन्य कह
  rationale: पिएल रूप का मूल अर्थ ‘आशीष देना/धन्य कहना’ है। परमेश्वर के लिए हिंदी में ‘धन्य कह’ श्रद्धापूर्ण स्तुति का अर्थ स्पष्ट करता है और इसे केवल ‘स्तुति कर’ में नहीं बदलता।
- source_word: נַפְשִׁי
  choice: हे मेरे प्राण
  rationale: נפש यहाँ कवि के अपने समूचे आंतरिक व्यक्तित्व को संबोधित करता है। ‘हे मेरे प्राण’ काव्यात्मक संबोधन और अर्थ-व्याप्ति दोनों को सुरक्षित रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: यह चार-अक्षरीय व्यक्तिगत ईश्वरीय नाम का हिंदी लिप्यंतरण है; इसे किसी उपाधि से प्रतिस्थापित नहीं किया गया।
- source_word: וְכָל־קְרָבַי
  choice: मेरे भीतर का सब कुछ
  rationale: קְרָבַי का शाब्दिक आशय ‘मेरे भीतरी अंग’ है, पर संदर्भ में यह संपूर्ण अंतरात्मा या आंतरिक अस्तित्व को दर्शाता है। चुना हुआ रूप आधुनिक हिंदी में स्वाभाविक है और व्यापकता बनाए रखता है।
- source_word: שֵׁם קָדְשׁוֹ
  choice: उसके पवित्र नाम
  rationale: इब्रानी संबंधसूचक पदबंध का स्वाभाविक हिंदी रूप ‘उसके पवित्र नाम’ है, जिसमें नाम और पवित्रता दोनों बने रहते हैं।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में व्यक्तिगत वाचा-नाम सीधे आया है। ‘याहवे’ उसका प्रचलित विद्वतापूर्ण लिप्यंतरण है और नाम को किसी उपाधि में नहीं बदलता।
- issue: मनुष्य के आंतरिक अस्तित्व के लिए נֶפֶשׁ और קְרָבַי का संबंध
  choice: ‘प्राण’ और ‘मेरे भीतर का सब कुछ’
  alternative: ‘आत्मा’ और ‘मेरे भीतरी अंग’
  rationale: पंक्ति अपने संपूर्ण अस्तित्व को परमेश्वर को धन्य कहने के लिए पुकारती है। चुना हुआ पाठ शारीरिक और अशारीरिक हिस्सों का कोई कठोर धर्मवैज्ञानिक विभाजन आरोपित नहीं करता।
