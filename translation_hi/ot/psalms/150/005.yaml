  choice: उसकी स्तुति करो
  rationale: बहुवचन आज्ञार्थक क्रिया और तीसरे पुरुष एकवचन कर्म-प्रत्यय को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है; दोनों अर्धपंक्तियों में इसकी पुनरावृत्ति मूल के आह्वानात्मक बल को बनाए रखती है।
