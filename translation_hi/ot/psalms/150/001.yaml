id: PSA.150.1
reference: Psalms 150:1
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: הַ֥לְלוּ יָ֨הּ הַֽלְלוּ אֵ֥ל בְּ/קָדְשׁ֑/וֹ הַֽ֝לְל֗וּ/הוּ בִּ/רְקִ֥יעַ עֻזּֽ/וֹ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/150/001.yaml
  text: Praise Yah! Praise God in his sanctuary[c][b][a]; praise him in the expanse of his strength.
translation:
  language: hi
  text: 'याह[a] की स्तुति करो!

    परमेश्वर की स्तुति उसके पवित्रस्थान[b] में करो;

    उसकी स्तुति उसके सामर्थ्य के आकाश-विस्तार[c] में करो।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी ‘याह’ परमेश्वर के नाम का संक्षिप्त रूप है; अनेक अनुवाद इसे ‘प्रभु’ लिखते हैं।
    reason: alternative_reading
  - marker: b
    text: इसका अनुवाद ‘उसकी पवित्रता में’ या ‘उसके पवित्र स्थान में’ भी हो सकता है।
    reason: lexical_alternative
  - marker: c
    text: इसका अनुवाद ‘उसके सामर्थ्य के आकाश-मंडल में’ या ‘उसके सामर्थ्यवान विस्तार में’ भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הַ֥לְלוּ
  choice: स्तुति करो
  rationale: הלל का यह बहुवचन आज्ञार्थक रूप सामूहिक उपासना का आह्वान है। ‘स्तुति करो’ हिन्दी में स्वाभाविक और संक्षिप्त है तथा पद में इसकी पुनरावृत्ति बनाए रखता है।
- source_word: יָ֨הּ
  choice: याह
  rationale: यह परमेश्वर के नाम का संक्षिप्त रूप है, पूरा चतुरक्षरीय नाम नहीं। लिप्यंतरण ‘याह’ मूल का भेद और आरम्भिक उपासना-घोष की ध्वनि सुरक्षित रखता है।
- source_word: אֵ֥ל
  choice: परमेश्वर
  rationale: यहाँ אֵל परमेश्वर के लिए सामान्य उपाधि है। ‘परमेश्वर’ आधुनिक हिन्दी के धार्मिक साहित्य में स्वाभाविक है और ‘सर्वशक्तिमान’ जैसे अनावश्यक अर्थ-विस्तार से बचता है।
- source_word: בְּ/קָדְשׁ֑/וֹ
  choice: उसके पवित्रस्थान में
  rationale: קֹדֶשׁ का अर्थ ‘पवित्रता’ अथवा ‘पवित्र स्थान’ हो सकता है। अगले स्थानवाचक वाक्यांश के साथ समानांतरता के कारण मुख्य पाठ में स्थानवाचक अर्थ चुना गया है, जबकि अस्पष्टता पादटिप्पणी में सुरक्षित है।
- source_word: הַֽ֝לְל֗וּ/הוּ
  choice: उसकी स्तुति ... करो
  rationale: आज्ञार्थक क्रिया के साथ लगा तृतीय पुरुष एकवचन कर्म-प्रत्यय हिन्दी में ‘उसकी स्तुति करो’ के रूप में स्वाभाविक ढंग से व्यक्त होता है।
- source_word: בִּ/רְקִ֥יעַ
  choice: आकाश-विस्तार में
  rationale: רָקִיעַ फैले हुए आकाशीय विस्तार की छवि देता है। ‘आकाश-विस्तार’ उस प्राचीन चित्र को बनाए रखता है और केवल ‘आकाश’ कहकर अर्थ को सपाट नहीं करता।
- source_word: עֻזּֽ/וֹ
  choice: उसके सामर्थ्य के
  rationale: עֹז सामर्थ्य, बल या शक्ति को दर्शाता है। ‘सामर्थ्य’ गरिमापूर्ण और स्पष्ट है तथा मूल के संबंधवाचक विन्यास को बनाए रखता है।
theological_decisions:
- issue: संक्षिप्त दिव्य नाम יָהּ का अनुवाद
  choice: याह
  alternative: प्रभु
  rationale: मूल में पूरा नाम יְהוָה नहीं, उसका संक्षिप्त रूप יָהּ है। ‘याह’ इस शाब्दिक भेद और स्तुति-घोष के चरित्र को सुरक्षित रखता है; पाठकों के लिए व्याख्या पादटिप्पणी में दी गई है।
- issue: בקדשו का स्थानवाचक या भाववाचक अर्थ
  choice: उसके पवित्रस्थान में
  alternative: उसकी पवित्रता में
  rationale: ‘आकाश-विस्तार में’ के साथ काव्यात्मक समानांतरता स्थानवाचक अर्थ का समर्थन करती है, पर मूल की वास्तविक अर्थ-संभावना को पादटिप्पणी में रखा गया है।
- issue: רקיע עזו का संबंध
  choice: उसके सामर्थ्य के आकाश-विस्तार में
  alternative: उसके सामर्थ्यवान आकाश-विस्तार में
  rationale: मुख्य पाठ मूल के संबंधवाचक विन्यास को निकटता से रखता है और यह तय नहीं करता कि विस्तार स्वयं सामर्थ्यवान है या परमेश्वर के सामर्थ्य को प्रकट करता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, सामूहिक उपासना-आह्वान का गरिमापूर्ण स्वर रखा गया है। ‘पवित्रस्थान’ और ‘आकाश-विस्तार’ मूल की काव्यात्मक तथा स्थानवाचक समानांतरता को बनाए रखते हैं। सभी पादटिप्पणी-चिह्न मुख्य पाठ में संबंधित पदों के तुरंत बाद दिए गए हैं।
