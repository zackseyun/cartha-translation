  text: Praise him for his mighty acts[b][a]; praise him according to the abundance of his greatness.
translation:
  language: hi
  text: उसके सामर्थ्य के कार्यों के लिए उसकी स्तुति करो; उसकी अपार महानता के अनुरूप उसकी स्तुति करो।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उसकी महानता की प्रचुरता के अनुसार।” इब्रानी में स्तुति को उसकी महानता के अनुरूप, अर्थात उसके अनुपात में, करने का भाव है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הַֽלְלוּהוּ
  choice: उसकी स्तुति करो
  rationale: הלל का बहुवचन आज्ञार्थक रूप और तीसरे पुरुष एकवचन कर्म-प्रत्यय है। यह आधुनिक हिन्दी में उपासक समुदाय को दिया गया स्वाभाविक और सीधा आदेश है।
- source_word: בִגְבוּרֹתָיו
  choice: उसके पराक्रम के कामों के लिए
  rationale: גְּבוּרוֹת शक्ति प्रकट करने वाले पराक्रमी कार्यों को दर्शाता है। यहाँ ב को स्तुति के आधार या कारण के रूप में लेना हिन्दी में स्वाभाविक है।
- source_word: כְּרֹב
  choice: अपार ... के अनुरूप
  rationale: כְּרֹב मात्रा या अनुपात का भाव देता है। 'के अनुरूप' इस आनुपातिक अर्थ को बनाए रखता है, जबकि רֹב का प्रचुरता-भाव 'अपार' से व्यक्त होता है।
- source_word: גֻּדְלוֹ
  choice: उसकी ... महानता
  rationale: גדל से बना यह शब्द मूलतः महानता या विशालता को दर्शाता है। 'महानता' सीधा, गरिमापूर्ण और धार्मिक रूप से अनावश्यक व्याख्या से मुक्त विकल्प है।
theological_decisions:
- issue: स्तुति का आधार और परिमाण
  choice: पहला चरण परमेश्वर के पराक्रमी कामों को स्तुति का कारण बताता है, और दूसरा उसकी अपार महानता के अनुरूप स्तुति करने को कहता है।
  alternative: 'दूसरे चरण को भी केवल स्तुति का एक और कारण माना जा सकता है: ''उसकी अपार महानता के लिए।'''
  rationale: 'ב और כ के अलग-अलग बल को बनाए रखने से कविता की अर्थगत भिन्नता सुरक्षित रहती है: उसके कार्य स्तुति का आधार हैं और उसकी महानता स्तुति का मान या अनुपात।'
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और सामुदायिक उपासना के अनुकूल आदेशात्मक रूप। 'पराक्रम के काम' ठोस कार्यों और शक्ति, दोनों को व्यक्त करता है; 'अपार महानता के अनुरूप' दूसरे चरण के आनुपातिक बल को स्वाभाविक हिन्दी में बनाए रखता है।
