  text: Praise him with the blast of the trumpet[a]; praise him with harp and lyre.
translation:
  language: hi
  text: शोफार की ध्वनि के साथ उसकी स्तुति करो[a]; वीणा और किन्नोर के साथ उसकी स्तुति करो[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शोफार सींग से बना वाद्य था, प्रायः मेढ़े का सींग, जिसे उपासना और संकेत देने के लिए फूँका जाता था।
    reason: lexical_clarification
  - marker: b
    text: किन्नोर एक प्राचीन तार-वाद्य था; इसका किसी एक आधुनिक वाद्य से ठीक-ठीक मिलान निश्चित नहीं है।
    reason: lexical_clarification
lexical_decisions:
- source_word: הַֽלְלוּ/הוּ
  choice: उसकी स्तुति करो
  rationale: הלל का बहुवचन आज्ञार्थक रूप और तृतीय पुरुष एकवचन प्रत्यय है। यह चयन उपासक समुदाय को दिए गए सीधे आह्वान को स्वाभाविक और गरिमापूर्ण हिन्दी में व्यक्त करता है तथा पुनरावृत्ति बनाए रखता है।
- source_word: בְּ/תֵקַע
  choice: की ध्वनि के साथ
  rationale: תֵּקַע फूँकने से उत्पन्न नाद या ध्वनि को सूचित करता है; इसलिए अनुवाद केवल वाद्य का उल्लेख करने के बजाय उसके बजने की ध्वनि को स्पष्ट करता है।
- source_word: שׁוֹפָר
  choice: तुरही
  rationale: שׁוֹפָר उपासना और संकेत देने में प्रयुक्त सींग-वाद्य था। मुख्य पाठ में 'तुरही' सहज आधुनिक हिन्दी है, जबकि उसके विशिष्ट सांस्कृतिक स्वरूप को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: בְּ/נֵבֶל
  choice: सारंगी
  rationale: נֵבֶל एक तार वाला वाद्य था। 'सारंगी' सामान्य पाठक के लिए बोधगम्य तार-वाद्य नाम है और इसे अगले अलग वाद्य से पृथक रखता है, यद्यपि प्राचीन वाद्य से इसकी ठीक-ठीक समानता निश्चित नहीं है।
- source_word: וְ/כִנּוֹר
  choice: और वीणा
  rationale: כִּנּוֹר एक अन्य तार वाला वाद्य है। 'वीणा' स्वाभाविक, प्रतिष्ठित हिन्दी पद है और נֵבֶל के साथ दो अलग वाद्यों की जोड़ी बनाए रखता है।
