  yaml_path: translation/ot/psalms/150/006.yaml
  text: Let everything that has breath praise Yah[a]. Praise Yah!
translation:
  language: hi
  text: हर श्वासधारी याह की स्तुति करे। याह की स्तुति करो![a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या: “हल्लेलूयाह!” इब्रानी पदबंध הַלְלוּ־יָהּ से उपासना में प्रचलित शब्द “हल्लेलूयाह” बना है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּל הַנְּשָׁמָה
  choice: हर श्वासधारी
  rationale: इब्रानी पदबंध का आशय सार्वभौमिक है—हर वह प्राणी जिसमें श्वास है। ‘हर श्वासधारी’ इस संक्षिप्त चित्र को स्वाभाविक आधुनिक हिन्दी में बनाए रखता है और ‘आत्मा’ जैसे अधिक व्याख्यात्मक अर्थ से बचता है।
- source_word: תְּהַלֵּל
  choice: स्तुति करे
  rationale: संदर्भ में अपूर्ण क्रिया का भाव आदेशात्मक/प्रेरणार्थक है। ‘स्तुति करे’ हिन्दी में इस आह्वान को स्वाभाविक रूप से व्यक्त करता है।
- source_word: יָהּ
  choice: याह
  rationale: यह परमेश्वर के नाम का संक्षिप्त काव्यात्मक रूप है। ‘याह’ उसका ध्वन्यात्मक और शब्दगत वैशिष्ट्य सुरक्षित रखता है।
- source_word: הַלְלוּ יָהּ
  choice: याह की स्तुति करो!
  rationale: बहुवचन आज्ञार्थक पदबंध का अर्थ सीधे व्यक्त किया गया है; पारंपरिक लिप्यंतरण ‘हल्लेलूयाह’ को पाद-टिप्पणी में सुरक्षित रखा गया है।
theological_decisions:
- issue: परमेश्वर के संक्षिप्त काव्यात्मक नाम יָהּ का अनुवाद
  choice: याह
  alternative: प्रभु
  rationale: मूल पाठ में पूर्ण नाम יְהוָה नहीं, बल्कि उसका संक्षिप्त काव्यात्मक रूप יָהּ है। ‘याह’ इस भेद को बिना किसी सांप्रदायिक व्याख्या के सुरक्षित रखता है।
- issue: הַלְלוּ־יָהּ को अर्थानुवाद करना या पारंपरिक रूप में रखना
  choice: मुख्य पाठ में ‘याह की स्तुति करो!’
  alternative: हल्लेलूयाह!
  rationale: मूल इब्रानी आज्ञा का अर्थ पाठक के लिए स्पष्ट करना प्राथमिक है, जबकि प्रचलित उपासना-संबंधी रूप को पाद-टिप्पणी में दिया गया है।
translation_notes:
  register: भाषा आधुनिक, संक्षिप्त और स्तुतिगीत के समापन के अनुकूल गरिमापूर्ण रखी गई है। ‘श्वासधारी’ मूल के श्वास-संबंधी बिंब और उसके सार्वभौमिक विस्तार दोनों को संजोता है।
