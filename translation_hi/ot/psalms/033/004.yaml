reference: Psalms 33:4
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: כִּֽי יָשָׁ֥ר דְּבַר יְהוָ֑ה וְ/כָל מַ֝עֲשֵׂ֗/הוּ בֶּ/אֱמוּנָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/033/004.yaml
  text: For the word of Yahweh is upright[b][a], and all his work is done in faithfulness.
translation:
  language: hi
  text: 'क्योंकि याहवे का वचन खरा है[a],

    और उसका हर काम विश्वासयोग्यता से होता है।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “सीधा” अथवा “सही”।
    reason: इब्रानी יָשָׁר में सीधाई, सहीपन और नैतिक खराई के परस्पर जुड़े अर्थ हैं।
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले पद में स्तुति के आह्वान का कारण बताता है; हिन्दी में ‘क्योंकि’ इसके कारणसूचक अर्थ को स्वाभाविक रूप से व्यक्त करता है।
- source_word: יָשָׁר
  choice: खरा
  rationale: यहाँ शब्द की सीधाई, सहीपन और नैतिक विश्वसनीयता का भाव है। ‘खरा’ आधुनिक हिन्दी में इन अर्थों को संक्षेप और काव्यात्मक ढंग से व्यक्त करता है।
- source_word: דְּבַר יְהוָה
  choice: याहवे का वचन
  rationale: דָּבָר यहाँ परमेश्वर की कही हुई बात या घोषणा को दर्शाता है; ‘वचन’ हिन्दी बाइबलीय शैली में स्वाभाविक और गरिमापूर्ण है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय निज नाम को उपाधि से बदलने के बजाय हिन्दी लिप्यंतरण में सुरक्षित रखा गया है।
- source_word: וְכָל־מַעֲשֵׂהוּ
  choice: और उसका हर काम
  rationale: एकवचन מַעֲשֶׂה समष्टिगत अर्थ में परमेश्वर के समस्त कार्य को समेटता है; ‘हर काम’ हिन्दी में व्यापकता को स्वाभाविक रूप से व्यक्त करता है।
- source_word: בֶּאֱמוּנָה
  choice: विश्वासयोग्यता से
  rationale: אֱמוּנָה यहाँ स्थिरता, भरोसेमंदी और निष्ठा का गुण बताता है। क्रिया-विहीन इब्रानी वाक्य को हिन्दी में ‘होता है’ जोड़कर स्वाभाविक बनाया गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा / प्रभु
  rationale: मूल पाठ में ईश्वर का निज नाम है; ‘याहवे’ उसे नाम के रूप में बनाए रखता है और उसे किसी उपाधि में नहीं बदलता।
- issue: מַעֲשֵׂהוּ के एकवचन का दायरा
  choice: उसका हर काम
  alternative: उसका सारा कार्य
  rationale: इब्रानी शब्द व्याकरणतः एकवचन है, पर כָל के साथ समष्टिगत व्यापकता रखता है। ‘हर काम’ उस व्यापक अर्थ को स्पष्ट करता है, बिना किसी विशेष प्रकार के कार्य तक सीमित किए।
- issue: בֶּאֱמוּנָה का सम्बन्ध
  choice: उसका हर काम विश्वासयोग्यता से होता है
  alternative: उसका हर काम विश्वासयोग्यता में है
  rationale: मूल उपवाक्य क्रिया-विहीन है। हिन्दी में ‘होता है’ कार्य करने की रीति को स्वाभाविक रूप से व्यक्त करता है, जबकि संज्ञा ‘विश्वासयोग्यता’ मूल के गुणात्मक बल को बनाए रखती है।
translation_notes:
  register: भाषा आधुनिक, सरल और गरिमापूर्ण रखी गई है। दो काव्य-पंक्तियाँ इब्रानी समानांतरता को दर्शाती हैं। ‘खरा’ और ‘विश्वासयोग्यता’ अलग-अलग मूल शब्दों के अर्थों को मिलाए बिना वचन और कार्य—दोनों की भरोसेमंदी सामने रखते हैं।
