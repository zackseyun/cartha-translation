  text: A horse is a false hope for deliverance[b][a], and by its great strength it cannot rescue.
translation:
  language: hi
  text: उद्धार के लिए घोड़ा झूठी आशा है[a], और अपने बहुत बल के होते हुए भी वह बचा नहीं सकता।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, ‘उद्धार के लिए घोड़ा झूठ है’; इब्रानी वाक्य संक्षिप्त है और इसका भाव है कि उद्धार के साधन के रूप में घोड़ा भ्रामक या व्यर्थ सिद्ध होता है। ‘उद्धार’ का अनुवाद ‘बचाव’ या ‘विजय’ भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: שֶׁקֶר
  choice: झूठी आशा
  rationale: इस संज्ञा का मूल अर्थ झूठ या छल है। घोड़े को उद्धार का साधन बताने वाली इस संक्षिप्त रचना में ‘झूठी आशा’ स्वाभाविक हिन्दी में यह भाव देती है कि उस पर भरोसा अंततः धोखा देता है।
- source_word: הַסּוּס
  choice: घोड़ा
  rationale: इब्रानी में निश्चित उपपद है, पर यह नीतिवचन-सदृश कथन प्रतिनिधि एकवचन में घोड़े को सामान्य वर्ग के रूप में प्रस्तुत करता है; हिन्दी में बिना ‘वह’ के ‘घोड़ा’ स्वाभाविक है।
- source_word: לִתְשׁוּעָה
  choice: उद्धार के लिए
  rationale: תְּשׁוּעָה का अर्थ उद्धार, बचाव या विजय हो सकता है। सैनिक संदर्भ में ‘उद्धार’ व्यापक अर्थ को बनाए रखता है और अगले खंड के ‘बचा’ से अर्थगत समानांतरता रखता है।
- source_word: וּבְרֹב חֵילוֹ
  choice: और अपने बहुत बल के होते हुए भी
  rationale: בְּרֹב का शाब्दिक भाव ‘बहुतायत में/के द्वारा’ है। नकारात्मक मुख्य क्रिया के साथ हिन्दी में रियायती ‘होते हुए भी’ स्वाभाविक रूप से बताता है कि घोड़े का प्रचुर बल भी बचाने में समर्थ नहीं है।
- source_word: לֹא יְמַלֵּט
  choice: वह बचा नहीं सकता
  rationale: मלט के पिएल रूप का अर्थ छुड़ाना या बचाना है। संदर्भ में नकार केवल भविष्य की घटना नहीं, बल्कि घोड़े की असमर्थता व्यक्त करता है; इसलिए ‘बचा नहीं सकता’ उपयुक्त है।
theological_decisions:
- issue: תְּשׁוּעָה का अर्थ-क्षेत्र
  choice: उद्धार
  alternative: बचाव या विजय
  rationale: यह पद सैन्य साधन के रूप में घोड़े की अविश्वसनीयता पर केंद्रित है। ‘उद्धार’ मूल शब्द की व्यापकता बचाता है, जबकि इसे केवल आत्मिक मुक्ति या केवल युद्ध-विजय तक सीमित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘बहुत बल के होते हुए भी’ मूल के साधन/परिस्थिति-सूचक प्रयोग को स्वाभाविक हिन्दी में व्यक्त करता है, जबकि पद की काव्यात्मक समानांतरता बनी रहती है।
