  text: He loves righteousness and justice[a]; the earth is full of the steadfast love of Yahweh.
translation:
  language: hi
  text: वह धार्मिकता और न्याय से प्रेम करता है; याहवे के अटल प्रेम[a] से पृथ्वी भरी हुई है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘अटल प्रेम’ के स्थान पर ‘निष्ठावान प्रेम’ भी हो सकता है। इब्रानी חֶסֶד प्रेम के साथ स्थिर निष्ठा और कृपा का भाव रखता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אֹהֵב
  choice: वह ... से प्रेम करता है
  rationale: पुल्लिंग एकवचन कर्तृवाचक कृदन्त यहाँ यहोवा के स्थायी स्वभाव का वर्णन करता है; आधुनिक हिन्दी में वर्तमानकालीन क्रिया स्वाभाविक है।
- source_word: צְדָקָה
  choice: धार्मिकता
  rationale: מִשְׁפָּט के साथ युग्म में यह नैतिक खराई और सही आचरण को व्यक्त करता है, इसलिए दोनों संज्ञाओं का भेद बनाए रखा गया है।
- source_word: מִשְׁפָּט
  choice: न्याय
  rationale: यहाँ अर्थ न्यायपूर्ण व्यवस्था और निर्णय का है; हिन्दी में ‘न्याय’ संक्षिप्त और स्वाभाविक है।
- source_word: חֶסֶד
  choice: अटल प्रेम
  rationale: यह पद प्रेम, निष्ठा और स्थिर कृपा के संयुक्त भाव को व्यक्त करता है; ‘अटल प्रेम’ सामान्य पाठक के लिए स्पष्ट रहते हुए उसकी स्थायित्वपूर्ण प्रकृति को उभारता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को हिन्दी में प्रचलित लिप्यंतरण ‘यहोवा’ से व्यक्त किया गया है, किसी उपाधि से नहीं।
- source_word: מָלְאָה
  choice: भरी हुई है
  rationale: पूर्ण रूप यहाँ वर्तमान परिणामात्मक अथवा अवस्थात्मक अर्थ देता है और स्त्रीलिंग ‘पृथ्वी’ से मेल खाता है।
- source_word: הָאָרֶץ
  choice: पृथ्वी
  rationale: भजन के व्यापक सृष्टिगत संदर्भ में स्थानीय ‘देश’ की अपेक्षा पूरी पृथ्वी अभिप्रेत है।
theological_decisions:
- issue: חֶסֶד का अर्थ-क्षेत्र
  choice: अटल प्रेम
  alternative: निष्ठावान प्रेम
  rationale: मूल शब्द में प्रेम, कृपा और निष्ठा साथ-साथ निहित हैं। मुख्य पाठ में सहज ‘अटल प्रेम’ रखा गया और वैकल्पिक बल को पादटिप्पणी में बताया गया, बिना वाचा-संबंधी अर्थ को अनावश्यक रूप से स्पष्ट करके मूल की अर्थविस्तारिता घटाए।
- issue: ईश्वरीय नाम יְהוָה का रूप
  choice: यहोवा
  alternative: याहवे
  rationale: मूल में व्यक्तिगत ईश्वरीय नाम है। आधुनिक हिन्दी बाइबलीय प्रयोग में व्यापक रूप से पहचाने जाने वाले ‘यहोवा’ को चुना गया; ‘प्रभु’ जैसी उपाधि रखकर नाम को प्रतिस्थापित नहीं किया गया।
