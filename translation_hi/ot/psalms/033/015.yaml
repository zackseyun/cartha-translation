  text: הַ/יֹּצֵ֣ר יַ֣חַד לִבָּ֑/ם הַ֝/מֵּבִ֗ין אֶל כָּל מַעֲשֵׂי/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/033/015.yaml
  text: the one who forms the hearts of them all[a], who understands all their deeds.
translation:
  language: hi
  text: वही सबके हृदयों को रचता है[a], और उनके सब कामों को समझता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उनके हृदयों को एक साथ रचता है।” हिब्रू शब्द का अर्थ “एक साथ” भी हो सकता है; यहाँ “सबके” सभी मनुष्यों के हृदय रचने का भाव व्यक्त करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הַיֹּצֵר
  choice: वही ... रचता है
  rationale: संज्ञा के रूप में प्रयुक्त निश्चित कालवाचक कृदन्त परमेश्वर की निरन्तर विशेषता बताता है; ‘रचता है’ आधुनिक और स्वाभाविक है।
- source_word: יַחַד
  choice: सबके
  rationale: सन्दर्भ में यह सभी मनुष्यों के हृदयों को सामूहिक रूप से समेटता है। हिन्दी में ‘सबके हृदयों’ से यह भाव स्वाभाविक रूप में आता है; ‘एक साथ’ सम्भावित शाब्दिक विकल्प है, इसलिए उसे पादटिप्पणी में रखा गया है।
- source_word: לִבָּם
  choice: उनके हृदयों
  rationale: हिब्रू में संज्ञा एकवचन है, पर बहुवचन सम्बन्धसूचक प्रत्यय के कारण हिन्दी में वितरणात्मक बहुवचन ‘हृदयों’ अधिक स्वाभाविक है।
- source_word: הַמֵּבִין
  choice: समझता है
  rationale: בין का हिफ़ील कृदन्त समझने और परखने का भाव देता है; ‘समझता है’ स्पष्ट और सामान्य आधुनिक हिन्दी है।
- source_word: אֶל כָּל מַעֲשֵׂיהֶם
  choice: उनके सब कामों को
  rationale: אֶל क्रिया के कर्म को चिह्नित करता है और हिन्दी में ‘को’ द्वारा स्वाभाविक ढंग से व्यक्त होता है; מַעֲשֵׂיהֶם के लिए ‘कामों’ सामान्य तथा नैतिक कर्मों सहित व्यापक है।
theological_decisions:
- issue: पद के कर्तृविषय का दायरा
  choice: परमेश्वर सभी मनुष्यों के हृदय रचता और उनके सभी काम समझता है।
  alternative: इसे निकटवर्ती सन्दर्भ के राजाओं या जातियों तक सीमित माना जा सकता है।
  rationale: पद 13–15 में ‘मनुष्य के सब पुत्रों’ और ‘पृथ्वी के सब निवासियों’ का व्यापक सन्दर्भ है; अनुवाद इस व्यापकता को बनाए रखता है, पर पाठ से आगे कोई सैद्धान्तिक निष्कर्ष नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी; भाषा सरल, गरिमापूर्ण और काव्यात्मक समानान्तरता के अनुकूल है। ‘हृदय’ बाइबिलीय मानव-अन्तरंग के व्यापक अर्थ को बनाए रखता है।
