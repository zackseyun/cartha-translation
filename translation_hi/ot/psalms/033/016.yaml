  text: אֵֽין הַ֭/מֶּלֶךְ נוֹשָׁ֣ע בְּ/רָב חָ֑יִל גִּ֝בּ֗וֹר לֹֽא יִנָּצֵ֥ל בְּ/רָב כֹּֽחַ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/033/016.yaml
  text: The king is not saved by a great army[b][a]; a warrior is not delivered by great strength.
translation:
  language: hi
  text: राजा बड़ी सेना[a] से नहीं बचाया जाता; योद्धा[b] अपार शक्ति से नहीं बचाया जाता।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “राजा बहुत सामर्थ्य से नहीं बचाया जाता”; जिस इब्रानी शब्द का अनुवाद “सेना” किया गया है, उसका अर्थ सामर्थ्य या व्यापक रूप से सैन्य संसाधन भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: “योद्धा” के लिए या, “पराक्रमी पुरुष।”
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵין
  choice: नहीं
  rationale: यहाँ निषेध व्यक्त करता है; हिंदी में कृदन्त-सदृश कथन के साथ स्वाभाविक रूप से ‘नहीं बचता’ बनता है।
- source_word: הַמֶּלֶךְ
  choice: राजा
  rationale: मूल में निश्चित उपपद है और एकवचन निश्चित संज्ञा के द्वारा सामान्य सत्य कहा गया है; हिंदी में ‘राजा’ यही प्रभाव स्वाभाविक ढंग से देता है।
- source_word: נוֹשָׁע
  choice: बचता
  rationale: ישׁע के निफ़अल कृदन्त का अर्थ बचाया जाना या उद्धार पाना है। सैन्य प्रसंग में ‘बचता’ सहज है और बाहरी सहायता से रक्षा पाने का भाव बनाए रखता है।
- source_word: בְּרָב חָיִל
  choice: विशाल सेना के बल पर
  rationale: ב साधन को और רָב प्रचुरता को व्यक्त करता है। חָיִל यहाँ सैन्य प्रसंग में सेना या सैन्य सामर्थ्य हो सकता है; ‘विशाल सेना के बल पर’ दोनों भावों को स्वाभाविक हिंदी में जोड़ता है।
- source_word: גִּבּוֹר
  choice: योद्धा
  rationale: यह शक्तिशाली या वीर लड़ाके को सूचित करता है; ‘योद्धा’ आधुनिक, स्पष्ट और सैन्य समानांतर के अनुकूल है।
- source_word: יִנָּצֵל
  choice: नहीं छूटता
  rationale: נצל के निफ़अल का अर्थ छुड़ाया जाना, बच निकलना या बचाया जाना है। ‘छूटता’ पहले खंड के ‘बचता’ से अर्थगत समानांतर रखते हुए शब्दगत भेद भी बनाए रखता है।
- source_word: בְּרָב כֹּחַ
  choice: अपार शक्ति के कारण
  rationale: כֹּחַ शक्ति या सामर्थ्य है और רָב उसकी बहुतायत बताता है। यहाँ ב को साधन/आधार के अर्थ में ‘के कारण’ से व्यक्त किया गया है, अर्थात बहुत शक्ति भी छुटकारे की निर्णायक वजह नहीं बनती।
