  yaml_path: translation/ot/psalms/033/011.yaml
  text: The counsel of Yahweh stands forever[a], the plans of his heart from generation to generation.
translation:
  language: hi
  text: 'याहवे की योजना[a] सदा स्थिर रहती है;

    उसके हृदय की योजनाएँ पीढ़ी-दर-पीढ़ी बनी रहती हैं।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘योजना’ का अनुवाद ‘उद्देश्य’ या ‘परामर्श’ भी हो सकता है; और ‘योजनाएँ’ का अनुवाद ‘विचार’ या ‘अभिप्राय’ भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲצַת
  choice: युक्ति
  rationale: यह शब्द परामर्श, योजना या उद्देश्य का भाव रखता है। ‘युक्ति’ यहाँ सोच-विचार से ठहराए गए उद्देश्य को व्यक्त करती है और समानांतर पद ‘योजनाएँ’ से स्वाभाविक संबंध रखती है।
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत नाम יהוה को किसी उपाधि से बदलने के बजाय आधुनिक हिन्दी में निकट लिप्यंतरण ‘याहवे’ दिया गया है।
- source_word: לְעוֹלָם
  choice: सदा
  rationale: यह कालगत स्थायित्व और निरंतरता व्यक्त करता है; ‘सदा’ आधुनिक हिन्दी में संक्षिप्त और स्वाभाविक है।
- source_word: תַּעֲמֹד
  choice: स्थिर रहती है
  rationale: अपूर्ण क्रिया यहाँ सामान्य और निरंतर सत्य बताती है। ‘स्थिर रहती है’ याहवे की युक्ति के अटल बने रहने का भाव स्पष्ट करती है।
- source_word: מַחְשְׁבוֹת
  choice: योजनाएँ
  rationale: इस बहुवचन संज्ञा का अर्थ विचार, अभिप्राय या योजनाएँ हो सकता है। ईश्वरीय संकल्प और पहले चरण की ‘युक्ति’ के समानांतर ‘योजनाएँ’ उपयुक्त है।
- source_word: לִבּוֹ
  choice: उसके हृदय की
  rationale: इब्रानी में ‘हृदय’ विचार और इच्छा के केंद्र को भी दर्शाता है। शाब्दिक रूप बनाए रखने से मूल मानवीय-रूपक सुरक्षित रहता है।
- source_word: לְדֹר וָדֹר
  choice: पीढ़ी-दर-पीढ़ी
  rationale: यह मुहावरा लगातार आने वाली सभी पीढ़ियों में बने रहने का भाव देता है; ‘पीढ़ी-दर-पीढ़ी’ सहज और सटीक हिन्दी है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में चार-अक्षरी व्यक्तिगत नाम सीधे प्रयुक्त हुआ है। ‘याहवे’ नाम को उपाधि से प्रतिस्थापित किए बिना उसका निकट हिन्दी लिप्यंतरण प्रस्तुत करता है।
- issue: ईश्वरीय ‘हृदय’ का मानव-सदृश रूपक
  choice: उसके हृदय की
  alternative: उसके मन की
  rationale: मूल का ‘हृदय’ विचार और इच्छा दोनों समेटता है। इसे बनाए रखने से रूपक और उसकी अर्थगत व्यापकता सुरक्षित रहती है; ‘मन’ अर्थ को केवल मानसिक प्रक्रिया की ओर सीमित कर सकता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। काव्यात्मक समानांतरता को दो पंक्तियों में सुरक्षित किया गया है; ‘स्थिर रहती है’ और ‘बनी रहती हैं’ अनावश्यक पुनरावृत्ति घटाते हुए मूल की निरंतरता व्यक्त करते हैं।
