  text: From heaven Yahweh looks[a]; he sees all the sons of man.
translation:
  language: hi
  text: 'स्वर्ग से याहवे निहारता है;

    वह सभी मनुष्यों[a] को देखता है।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “मनुष्य के सब पुत्रों”; यह समस्त मानवजाति के लिए प्रयुक्त काव्यात्मक अभिव्यक्ति है।
    reason: शाब्दिक रूप और सामूहिक अर्थ स्पष्ट करना
lexical_decisions:
- source_word: מִשָּׁמַיִם
  choice: स्वर्ग से
  rationale: מִן स्रोत या स्थानगत दृष्टिबिंदु को दर्शाता है। हिन्दी में ‘स्वर्ग से’ स्वाभाविक है और שָׁמַיִם के आकाशीय दृष्टिबिंदु को स्पष्ट रखता है।
- source_word: הִבִּיט
  choice: दृष्टि करता है
  rationale: נבט का हिफ़ील रूप ध्यानपूर्वक या लक्ष्य करके देखने का भाव देता है। काव्य में पूर्ण क्रिया यहाँ सामान्य और सतत सत्य व्यक्त करती है, इसलिए वर्तमान काल चुना गया है।
- source_word: יְהוָה
  choice: याहवे
  rationale: यह परमेश्वर का व्यक्तिगत वाचा-नाम है; इसे उपाधि से बदलने के बजाय हिन्दी में लिप्यंतरित किया गया है।
- source_word: רָאָה
  choice: वह ... देखता है
  rationale: ראה का सामान्य अर्थ ‘देखना’ है। समानांतर काव्य-पंक्ति में इसे भी सामान्य वर्तमान सत्य के रूप में प्रस्तुत किया गया है।
- source_word: כָּל בְּנֵי הָאָדָם
  choice: सभी मनुष्यों
  rationale: इब्रानी मुहावरा शाब्दिक रूप से ‘मनुष्य के सब पुत्रों’ है, पर सामूहिक रूप से समस्त मनुष्यों को दर्शाता है। ‘सभी मनुष्यों’ हिन्दी में स्वाभाविक है और उसके समावेशी सामूहिक अर्थ को ठीक प्रकार व्यक्त करता है; शाब्दिक रूप पादटिप्पणी में सुरक्षित है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: प्रभु / यहोवा
  rationale: मूल पाठ में उपाधि नहीं, चार अक्षरों वाला व्यक्तिगत ईश्वरीय नाम है। ‘याहवे’ स्रोत-रूप के निकट प्रचलित विद्वत्तापूर्ण लिप्यंतरण है।
- issue: בְּנֵי הָאָדָם का सामूहिक अर्थ
  choice: सभी मनुष्यों
  alternative: मनुष्य के सब पुत्रों
  rationale: शाब्दिक पुरुषवाची संरचना इब्रानी में मानवजाति के लिए सामूहिक काव्यात्मक मुहावरा है। मुख्य पाठ में स्वाभाविक हिन्दी द्वारा उसका आशय रखा गया है, जबकि पादटिप्पणी मूल रूप को बताती है और केवल पुरुषों तक अर्थ सीमित नहीं करती।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और काव्यात्मक है। दो समानांतर क्रियाओं के भेद को ‘दृष्टि करता है’ और ‘देखता है’ से बनाए रखा गया है। वर्तमान काल पद को परमेश्वर की निरंतर निगरानी के सामान्य सत्य के रूप में प्रस्तुत करता है।
