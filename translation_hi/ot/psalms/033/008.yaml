lexical_decisions:
- source_word: יִירְאוּ מֵיְהוָה
  choice: याहवे से डरे
  rationale: יִירְאוּ का अपूर्ण रूप यहाँ काव्यात्मक आग्रह व्यक्त करता है। ‘डरे’ भय और श्रद्धामिश्रित विस्मय—दोनों की संभावना बनाए रखता है; מן के साथ हिन्दी में ‘से’ स्वाभाविक है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय परमेश्वर-नाम को उपाधि से बदलने के बजाय उसके प्रचलित हिन्दी लिप्यंतरण में रखा गया है।
- source_word: כָּל הָאָרֶץ
  choice: सारी पृथ्वी
  rationale: अगली पंक्ति के ‘जगत के सभी निवासी’ के समानांतर यहाँ אֶרֶץ का आशय किसी स्थानीय देश से नहीं, पूरी पृथ्वी से है।
- source_word: יָגוּרוּ מִמֶּנּוּ
  choice: उसके भय से काँपें
  rationale: גור यहाँ भय, आतंक या भयमिश्रित विस्मय से काँपने का भाव देता है। यह अनुवाद पहली पंक्ति के ‘डरे’ को केवल दोहराने के बजाय काव्यात्मक समानांतरता को बनाए रखता है।
- source_word: כָּל יֹשְׁבֵי תֵבֵל
  choice: जगत के सभी निवासी
  rationale: תֵבֵל बसी हुई दुनिया और יֹשְׁבֵי उसके निवासियों को सूचित करता है; चुना हुआ रूप स्वाभाविक हिन्दी में सार्वभौमिक दायरा बनाए रखता है।
theological_decisions:
- issue: परमेश्वर के नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: प्रभु / यहोवा
  rationale: मूल पाठ में विशिष्ट वाचा-नाम सीधे आया है। ‘याहवे’ उसे उपाधि में बदलने के बजाय नाम के रूप में सुरक्षित रखता है।
- issue: भय को श्रद्धा या आतंक में सीमित करना
  choice: ‘डरे’ और ‘भय से काँपें’ द्वारा अर्थ की तीव्रता बनाए रखना
  alternative: केवल ‘श्रद्धा करे’ या ‘विस्मित हो’
  rationale: יִירְאוּ और יָגוּרוּ में वास्तविक भय के साथ विस्मय और श्रद्धा का आयाम हो सकता है। केवल ‘श्रद्धा’ कहने से मूल की भय-संबंधी तीव्रता कम हो जाती।
translation_notes:
  register: भाषा आधुनिक, संक्षिप्त और काव्यात्मक रखी गई है। ‘सारी पृथ्वी’ तथा ‘जगत के सभी निवासी’ मूल की समानांतर सार्वभौमिकता को बनाए रखते हैं; अर्धविराम दोनों काव्य-पंक्तियों को स्पष्ट करता है।
