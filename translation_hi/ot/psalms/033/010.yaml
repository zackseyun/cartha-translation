  terminology: ‘याहवे’ appropriately represents YHWH, with ‘यहोवा’ correctly noted as a traditional alternative. ‘राष्ट्रों’ and ‘लोगों’ preserve the Hebrew distinction between גּוֹיִם and עַמִּים without introducing a specifically religious sense.
