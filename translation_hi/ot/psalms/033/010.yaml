id: PSA.33.10
reference: Psalms 33:10
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: יְֽהוָ֗ה הֵפִ֥יר עֲצַת גּוֹיִ֑ם הֵ֝נִ֗יא מַחְשְׁב֥וֹת עַמִּֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/033/010.yaml
  text: Yahweh frustrates the counsel of the nations[a]; he thwarts the plans of the peoples.
translation:
  language: hi
  text: 'याहवे[a] राष्ट्रों की मंत्रणा निष्फल कर देता है;

    वह लोगों की योजनाएँ विफल कर देता है।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इब्रानी: YHWH; ‘याहवे’ अथवा परंपरागत रूप से ‘यहोवा’।'
    reason: परमेश्वर के इब्रानी नाम और उसके वैकल्पिक पारंपरिक रूप की जानकारी।
lexical_decisions:
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत नाम के चार इब्रानी व्यंजनों YHWH का प्रचलित विद्वत्तापूर्ण लिप्यंतरण अपनाया गया है; इसे किसी उपाधि से नहीं बदला गया।
- source_word: הֵפִיר
  choice: निष्फल कर देता है
  rationale: हिफ़ील क्रिया यहाँ किसी मंत्रणा को तोड़ने अथवा प्रभावहीन बनाने का भाव देती है। यह हिंदी प्रयोग सक्रिय रूप से उसे सफल न होने देने का अर्थ स्पष्ट करता है।
- source_word: עֲצַת
  choice: मंत्रणा
  rationale: शब्द का अर्थ सलाह, योजना या उद्देश्य हो सकता है। राष्ट्रों के सामूहिक विचार-विमर्श के संदर्भ में ‘मंत्रणा’ उपयुक्त है और दूसरी पंक्ति की ‘योजनाएँ’ से काव्यात्मक भेद बनाए रखता है।
- source_word: גּוֹיִם
  choice: राष्ट्रों
  rationale: इस भजन में शब्द व्यापक रूप से राष्ट्रों को सूचित करता है, न कि विशेष धार्मिक अर्थ में गैर-यहूदियों को।
- source_word: הֵנִיא
  choice: विफल कर देता है
  rationale: यह क्रिया रोकने, फेर देने या किसी अभिप्राय को पूरा न होने देने का भाव रखती है। ‘विफल कर देता है’ हिंदी में इस अर्थ को स्वाभाविक और सशक्त रूप से व्यक्त करता है।
- source_word: מַחְשְׁבוֹת
  choice: योजनाएँ
  rationale: यद्यपि शब्द का शाब्दिक क्षेत्र विचार और अभिप्राय तक फैला है, समानांतर पंक्ति में सामूहिक योजनाएँ संदर्भानुकूल अर्थ है।
- source_word: עַמִּים
  choice: जन-समूहों
  rationale: बहुवचन सामूहिक समुदायों या peoples को दर्शाता है। ‘जन-समूहों’ पहले पद के ‘राष्ट्रों’ से भेद रखते हुए अर्थ संप्रेषित करता है।
theological_decisions:
- issue: परमेश्वर के नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में चार अक्षरों वाला व्यक्तिगत नाम सीधे आया है। ‘याहवे’ नाम को सुरक्षित रखता है, जबकि ‘प्रभु’ उसे उपाधि से बदल देता; ‘यहोवा’ उसका परंपरागत वैकल्पिक रूप है।
translation_notes:
  register: आधुनिक मानक हिंदी में सहज, गरिमापूर्ण और काव्यात्मक समानांतरता वाला रूप। ‘मंत्रणा/योजनाएँ’, ‘राष्ट्रों/जन-समूहों’ और ‘निष्फल/विफल’ के माध्यम से दोनों पंक्तियों की निकट समानता तथा शब्दगत भेद सुरक्षित रखे गए हैं।
