  text: הוֹד֣וּ לַ/יהוָ֣ה בְּ/כִנּ֑וֹר בְּ/נֵ֥בֶל עָ֝שׂ֗וֹר זַמְּרוּ לֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/033/002.yaml
  text: Give thanks to Yahweh with the lyre[a]; make music to him with a ten-stringed harp.
translation:
  language: hi
  text: वीणा के साथ यहोवा का धन्यवाद करो; दस तारों वाले तंत्री-वाद्य पर उसके लिए संगीत बजाओ।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הוֹדוּ
  choice: धन्यवाद करो
  rationale: हिफ़ील बहुवचन आज्ञार्थक यहाँ आराधना के संदर्भ में धन्यवाद देने का सामान्य भाव व्यक्त करता है; यह व्यापक ‘स्तुति करो’ की अपेक्षा अधिक विशिष्ट है।
- source_word: לַיהוָה
  choice: यहोवा का
  rationale: इब्रानी वाचा-नाम יהוה को सामान्य हिंदी बाइबलीय रूप ‘यहोवा’ से व्यक्त किया गया है; ‘धन्यवाद करना’ के साथ स्वाभाविक हिंदी में संबंधसूचक ‘का’ प्रयुक्त हुआ है।
- source_word: בְּכִנּוֹר
  choice: वीणा बजाकर
  rationale: כִּנּוֹר एक प्राचीन तार वाला वाद्य था, प्रायः lyre समझा जाता है। हिंदी में ‘वीणा’ सुबोध और गरिमापूर्ण निकटतम सामान्य पद है; ‘बजाकर’ साधन-सूचक בְּ को स्वाभाविक बनाता है।
- source_word: בְּנֵבֶל עָשׂוֹר
  choice: दस तारों वाली सारंगी पर
  rationale: נֵבֶל की ठीक बनावट अनिश्चित है, पर यह כִּנּוֹר से अलग तार वाला वाद्य था; עָשׂוֹר उसके दस तार होने का संकेत देता है। ‘सारंगी’ पाठ में दोनों वाद्यों का भेद बनाए रखती है, जबकि अनिश्चितता पादटिप्पणी में स्पष्ट है।
- source_word: זַמְּרוּ לוֹ
  choice: उसके लिए संगीत बजाओ
  rationale: पिएल आज्ञार्थक זמר संगीत बनाने अथवा स्तुति-गान करने का अर्थ दे सकता है। निकटवर्ती वाद्यों के कारण ‘संगीत बजाओ’ उपयुक्त है, और ‘उसके लिए’ לוֹ को सुरक्षित रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ में उपाधि नहीं, चार अक्षरों वाला वाचा-नाम है। हिंदी के सामान्य बाइबलीय व्यवहार में पहचाने जाने वाले ‘यहोवा’ को रखा गया है; मूल उच्चारण की पूर्ण निश्चितता का दावा नहीं किया गया।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिंदी। दोनों समानांतर आज्ञाओं को बनाए रखा गया है। प्राचीन वाद्यों की सटीक पहचान अनिश्चित होने के कारण मुख्य पाठ में परिचित हिंदी नाम और पादटिप्पणी में आवश्यक सावधानी दी गई है।
