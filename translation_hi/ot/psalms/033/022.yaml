  text: Let your steadfast love be upon us, O LORD, even as we hope in you.
translation:
  language: hi
  text: 'हे यहोवा,

    तेरा अटल प्रेम हम पर हो,

    जैसा हम तुझ पर आशा रखते हैं।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חֶסֶד (חַסְדְּךָ)
  choice: अटल करुणा
  rationale: यह शब्द वाचा-संबंधी निष्ठा, प्रेम और कृपा का व्यापक भाव रखता है; ‘अटल करुणा’ इसके स्थायी और दयालु दोनों पक्षों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: ईश्वर के व्यक्तिगत वाचा-नाम को सामान्य उपाधि में बदलने के बजाय हिन्दी में प्रचलित लिप्यंतरण द्वारा रखा गया है।
- source_word: יָחַל (יִחַלְנוּ)
  choice: आशा रखी है
  rationale: मूल क्रिया प्रतीक्षा-भरी आशा या भरोसे का भाव देती है; पूर्ण क्रिया-रूप के कारण ‘रखी है’ उपयुक्त है।
- source_word: כַּאֲשֶׁר
  choice: क्योंकि
  rationale: यहाँ अनुपात (‘जितनी’) या अनुरूपता (‘जिस प्रकार’) भी संभव है, पर प्रार्थना के आधार के रूप में समुदाय की आशा व्यक्त करने वाला कारणवाचक अर्थ प्रसंग में स्वाभाविक है।
theological_decisions:
- issue: כַּאֲשֶׁר का संबंध—कारण अथवा अनुरूपता
  choice: क्योंकि हमने तुझ पर आशा रखी है
  alternative: जिस प्रकार हम तुझ पर आशा रखते हैं / हमारी आशा के अनुसार
  rationale: हिब्रू संयोजक दोनों अर्थों की अनुमति देता है। यहाँ कारणवाचक अनुवाद प्रार्थना और भरोसे का संबंध स्पष्ट करता है, बिना आशा को ईश्वरीय करुणा अर्जित करने वाला गुण बनाए।
- issue: חֶסֶד का धार्मिक अर्थ
  choice: अटल करुणा
  alternative: करुणा / अटल प्रेम / वाचा की निष्ठा
  rationale: चयन प्रेमपूर्ण दया और स्थिर निष्ठा दोनों को साथ रखता है तथा किसी विशिष्ट सम्प्रदायगत परिभाषा को आरोपित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी; काव्यात्मक, प्रार्थनापूर्ण और गरिमामय शैली। एकवचन संबोधन ‘तेरी/तुझ’ भजन की प्रत्यक्ष और आत्मीय प्रार्थना को बनाए रखता है।
