  to: 'हे यहोवा,

    तेरा अटल प्रेम हम पर हो,

    जैसा हम तुझ पर आशा रखते हैं।'
  rationale: The revision restores the verse's jussive petition ('हो'), its comparative relation ('जैसा'), and the ongoing plural hope ('हम ... आशा रखते हैं'). It preserves the direct prayerful address and poetic compactness of the Hebrew.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T20:29:13Z'
review_pass:
  verdict: revise
  source_fidelity: The draft correctly addresses YHWH and renders חַסְדְּךָ with a broadly appropriate expression, but it mistranslates כַּאֲשֶׁר as causal ('because'). The Hebrew means 'as/just as/according as,' expressing correspondence. יִחַלְנוּ is imperfect ('we hope/wait'), not a perfect completed action ('we have hoped'). יְהִי is a jussive wish, best represented by 'हो.'
  naturalness: The Hindi is dignified and clear, but 'क्योंकि हमने ... आशा रखी है' both departs from the source and sounds more explanatory than the compact poetic prayer. The revision is natural modern standard Hindi while retaining a prayerful register.
  terminology: '''यहोवा'' consistently represents the divine name. ''अटल प्रेम'' conveys the enduring, loyal-love sense of חֶסֶד more directly than ''अटल करुणा,'' while avoiding an overly technical formulation. ''आशा रखते हैं'' suitably renders the communal, ongoing sense of יִחַלְנוּ.'
  issues:
  - severity: high
    issue: כַּאֲשֶׁר is rendered as 'क्योंकि.'
    rationale: The conjunction is comparative/correspondential ('जैसा/जिस प्रकार,' or 'हमारी आशा के अनुसार'), not causal. The causal wording changes the relationship expressed in the prayer.
  - severity: medium
    issue: יִחַלְנוּ is rendered as completed past/perfect ('हमने ... रखी है').
    rationale: The Hebrew imperfect expresses the community's ongoing hope or waiting; present habitual 'हम ... आशा रखते हैं' preserves this.
  - severity: medium
    issue: יְהִי is rendered 'बनी रहे.'
    rationale: Although understandable, 'बनी रहे' can imply that the love is already present and continuing. 'हो' more directly conveys the Hebrew jussive petition without adding that implication.
  revised_text: 'हे यहोवा,

    तेरा अटल प्रेम हम पर हो,

    जैसा हम तुझ पर आशा रखते हैं।'
  revised_footnotes: []
