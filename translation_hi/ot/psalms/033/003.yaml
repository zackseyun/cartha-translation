base_translation:
  language: en
  yaml_path: translation/ot/psalms/033/003.yaml
  text: Sing to him a new song[a]; play skillfully with a joyful shout.
translation:
  language: hi
  text: उसके लिए नया गीत गाओ; आनन्दमय जयघोष[a] के साथ कुशलता से वाद्य बजाओ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘जयजयकार के साथ’ अथवा ‘तुरही-जैसी ध्वनि के साथ।’ हिब्रू शब्द ऊँची उल्लासपूर्ण पुकार, सार्वजनिक जयघोष, या कुछ प्रसंगों में तुरही-जैसी ध्वनि का अर्थ दे सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁירוּ
  choice: गाओ
  rationale: यह שׁיר का बहुवचन आज्ञार्थक रूप है; ‘गाओ’ इसका सीधा और स्वाभाविक हिन्दी रूप है।
- source_word: לוֹ
  choice: उसके लिए
  rationale: לְ के साथ तृतीय पुरुष एकवचन प्रत्यय गीत के सम्बोधन अथवा समर्पण की दिशा बताता है; प्रसंग में संकेत यहोवा की ओर है।
- source_word: שִׁיר חָדָשׁ
  choice: नया गीत
  rationale: यह भजनों में प्रयुक्त परिचित पदबंध है; सीधा अनुवाद इसके अर्थ और उपासना-संबंधी अनुगूँज दोनों को बनाए रखता है।
- source_word: הֵיטִיבוּ נַגֵּן
  choice: कुशलता से वाद्य बजाओ
  rationale: הֵיטִיבוּ यहाँ नַגֵּן की क्रिया-रीति बताता है—अच्छी तरह अथवा निपुणता से बजाना। נגן प्रायः वाद्य, विशेषकर तार वाले वाद्य, बजाने के लिए आता है; हिन्दी में ‘वाद्य बजाओ’ आशय स्पष्ट करता है।
- source_word: בִּתְרוּעָה
  choice: आनन्द के जयघोष के साथ
  rationale: תְּרוּעָה ऊँची सामूहिक पुकार, जयजयकार अथवा कभी तुरही-जैसी ध्वनि को सूचित कर सकता है। स्तुति के इस प्रसंग में ‘आनन्द का जयघोष’ उत्साह और श्रव्य प्रबलता दोनों व्यक्त करता है, जबकि पादटिप्पणी वैकल्पिक अर्थ सुरक्षित रखती है।
theological_decisions:
- issue: לוֹ (‘उसके लिए’) में सर्वनाम का अभिप्राय
  choice: प्रसंगानुसार सर्वनाम परमेश्वर, अर्थात यहोवा, की ओर संकेत करता है, पर मुख्य पाठ में केवल ‘उसके लिए’ रखा गया है।
  alternative: मुख्य पाठ में स्पष्ट रूप से ‘यहोवा के लिए’ कहना।
  rationale: आस-पास के पदों से सम्बोधन स्पष्ट है, किन्तु हिब्रू के सर्वनाम को संज्ञा से बदलना अनावश्यक विस्तार होता।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी अपनाई गई है। समानांतर आज्ञाओं की काव्यात्मक गति बनाए रखने के लिए वाक्य संक्षिप्त रखा गया है; ‘वाद्य’ जोड़कर נגן का वाद्य-संगीत संबंध हिन्दी पाठक के लिए स्पष्ट किया गया है।
