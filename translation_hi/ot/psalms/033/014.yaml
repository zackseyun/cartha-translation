- source_word: כָּל
  choice: सभी
  rationale: यह आगे आने वाले बहुवचन समूह की पूर्ण व्यापकता बताता है।
- source_word: יֹשְׁבֵי
  choice: निवासियों
  rationale: ישׁב का कृदंत यहाँ संज्ञा की तरह ‘रहनेवाले लोगों’ के अर्थ में है; ‘निवासी’ संक्षिप्त और स्वाभाविक हिंदी है।
- source_word: הָאָרֶץ
  choice: पृथ्वी
  rationale: भजन के सार्वभौमिक संदर्भ और ‘सभी निवासियों’ के साथ यहाँ किसी विशेष देश के बजाय पूरी पृथ्वी अभिप्रेत है।
theological_decisions:
- issue: परमेश्वर के अवलोकन का दायरा
  choice: सार्वभौमिक—वह पृथ्वी के सभी निवासियों को देखता है
  alternative: क्षेत्रीय—वह देश के सभी निवासियों को देखता है
  rationale: כָּל יֹשְׁבֵי הָאָרֶץ और निकटवर्ती संदर्भ समस्त मानवजाति पर व्यापक दृष्टि का संकेत देते हैं। यह संदर्भगत निर्णय है, कोई अतिरिक्त सांप्रदायिक दावा नहीं।
translation_notes:
  register: आधुनिक मानक हिंदी; सहज किंतु गरिमापूर्ण शैली। ‘अपने निवास-स्थान से’ मूल की स्थानवाचक रचना को बनाए रखता है, और ‘दृष्टि रखता है’ ध्यानपूर्ण अवलोकन के भाव को बिना अनावश्यक व्याख्या के व्यक्त करता है।
