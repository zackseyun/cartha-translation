  choice: स्थान से
  rationale: מָכוֹן किसी स्थापित या निश्चित स्थान को दर्शाता है। שִׁבְתּוֹ के साथ मिलकर ‘अपने निवास-स्थान से’ स्वाभाविक और अर्थ-संगत है।
