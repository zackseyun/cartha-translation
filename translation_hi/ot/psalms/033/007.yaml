  yaml_path: translation/ot/psalms/033/007.yaml
  text: He gathers the waters of the sea like a heap[b][a]; he puts the depths in storehouses.
translation:
  language: hi
  text: वह समुद्र के जल को ढेर के समान इकट्ठा करता है[a]; वह गहराइयों को भंडारों में रखता है[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘टीले के समान’; जल के ऐसे ही बिंबों के आधार पर कुछ लोग इसका अर्थ ‘दीवार के समान’ समझते हैं।
    reason: lexical_alternative
  - marker: b
    text: या ‘अथाह जलराशियों को।’ इब्रानी बहुवचन विशाल समुद्री गहराइयों या आदिम अथाह जलों की ओर संकेत कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּנֵס
  choice: इकट्ठा करता है
  rationale: כנס के काल-वाचक कृदंत का अर्थ बटोरना या एकत्र करना है। यह चयन पद के वर्णनात्मक, निरंतर भाव को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: כַּנֵּד
  choice: ढेर के समान
  rationale: נֵד सामान्यतः ढेर या जमा हुई राशि को दर्शाता है, विशेषकर जल के संबंध में। यह रूपक को ज्यों का त्यों रखता है; कुछ प्रसंगों में ‘टीला’ या ‘दीवार’ भी संभव है।
- source_word: מֵי הַיָּם
  choice: समुद्र के जल
  rationale: यह रचना शाब्दिक रूप से ‘समुद्र के जल’ है और हिन्दी में भी सहज तथा काव्यात्मक है।
- source_word: נֹתֵן
  choice: रखता है
  rationale: נתן का मूल अर्थ देना या रखना है। यहाँ स्थान में जमा करने के संदर्भ में ‘रखता है’ स्वाभाविक है और समानांतर पंक्ति से मेल खाता है।
- source_word: בְּאֹצָרוֹת
  choice: भंडारों में
  rationale: אֹצָר भंडार, कोष या संग्रह-स्थान को दर्शाता है। ‘भंडारों’ से ब्रह्मांडीय-काव्यात्मक चित्र स्पष्ट रहता है।
- source_word: תְּהוֹמוֹת
  choice: अथाह जलराशियों
  rationale: תְּהוֹם का बहुवचन महासागर की गहराइयों या आदिम अथाह जलों को दर्शा सकता है। ‘अथाह जलराशियों’ से जल-संदर्भ और बहुवचन दोनों आधुनिक हिन्दी में स्पष्ट रहते हैं।
theological_decisions:
- issue: समुद्र पर परमेश्वर की प्रभुता का ब्रह्मांडीय चित्रण
  choice: ‘ढेर’ और ‘भंडारों’ के ठोस काव्यात्मक बिंब बनाए रखे गए हैं।
  alternative: भावार्थ के रूप में ‘वह समुद्र को नियंत्रित करता है’ या ‘महासागरों को संचित करता है।’
  rationale: मूल पद अराजक अथाह जलों पर परमेश्वर की प्रभुता को मूर्त काव्यात्मक चित्रों से व्यक्त करता है। इसे अमूर्त व्याख्या में बदलने से मूल का तनाव और बिंब कम हो जाएगा।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। समानांतर काव्य-पंक्तियों और मूल के ब्रह्मांडीय जल-बिंबों को संरक्षित किया गया है।
