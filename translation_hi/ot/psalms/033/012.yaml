  yaml_path: translation/ot/psalms/033/012.yaml
  text: Blessed is the nation whose God is Yahweh[b][a], the people he has chosen for his inheritance.
translation:
  language: hi
  text: 'धन्य है वह राष्ट्र जिसका परमेश्वर याहवे है,

    वह प्रजा जिसे उसने अपनी विरासत के रूप में चुना है।[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: दूसरी पंक्ति विशेष रूप से इस्राएल की ओर संकेत करती प्रतीत होती है, पर इब्रानी पाठ काव्यात्मक रूप में केवल ‘प्रजा’ कहता है।
    reason: referent_clarification
lexical_decisions:
- source_word: אַשְׁרֵי
  choice: धन्य है
  rationale: यह इब्रानी धन्य-वचन किसी क्षणिक भावना से अधिक अनुग्रहपूर्ण और कल्याणमय दशा बताता है; ‘धन्य है’ भजन की आराधनात्मक गरिमा भी बनाए रखता है।
- source_word: הַגּוֹי
  choice: वह राष्ट्र
  rationale: גּוֹי का सीधा अर्थ ‘राष्ट्र’ है और यह अगले काव्यांश के ‘प्रजा’ के समानांतर एक सामूहिक इकाई को दर्शाता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: मूल पाठ में आए परमेश्वर के व्यक्तिगत वाचा-नाम को हिंदी में प्रचलित लिप्यंतरण ‘यहोवा’ से व्यक्त किया गया है, किसी उपाधि से प्रतिस्थापित नहीं किया गया।
- source_word: אֱלֹהָיו
  choice: जिसका परमेश्वर
  rationale: पुल्लिंग एकवचन संबंधसूचक प्रत्यय को राष्ट्र के संदर्भ में स्वाभाविक हिंदी ‘जिसका परमेश्वर’ के रूप में व्यक्त किया गया है।
- source_word: הָעָם
  choice: वह प्रजा
  rationale: עָם सामुदायिक अथवा वाचागत पहचान वाले जनसमूह को सूचित करता है; ‘प्रजा’ ‘राष्ट्र’ के साथ काव्यात्मक समानांतरता रखते हुए दोनों पदों का भेद भी बचाती है।
- source_word: בָּחַר
  choice: चुना है
  rationale: पूर्ण क्रिया को ऐसे संपन्न चुनाव के रूप में रखा गया है जिसका परिणाम वर्तमान में बना हुआ है।
- source_word: לְנַחֲלָה לוֹ
  choice: अपनी विरासत होने के लिए
  rationale: यह पदसमूह परमेश्वर के अपने लिए चुने हुए अधिकार और भाग को व्यक्त करता है; यह अनुवाद לְ और לוֹ दोनों की दिशा/संबंध को स्वाभाविक हिंदी में बनाए रखता है।
theological_decisions:
- issue: יְהוָה परमेश्वर के नाम का अनुवाद
  choice: यहोवा
  alternative: प्रभु
  rationale: मूल में व्यक्तिगत वाचा-नाम स्पष्ट रूप से उपस्थित है; इसलिए उसे उपाधि ‘प्रभु’ से बदलने के बजाय हिंदी के परिचित लिप्यंतरण से रखा गया है।
- issue: ‘राष्ट्र’ और ‘प्रजा’ का संदर्भ
  choice: मुख्य पाठ में इस्राएल नाम जोड़े बिना काव्यात्मक शब्दावली बनाए रखना
  alternative: दोनों पदों को स्पष्ट रूप से ‘इस्राएल’ कहना
  rationale: संदर्भ विशेषतः इस्राएल की ओर संकेत करता है, पर इब्रानी पाठ स्वयं ‘राष्ट्र’ और ‘प्रजा’ कहता है। अनुवाद इस निहित विशिष्टता और शाब्दिक व्यापकता के बीच का तनाव सुरक्षित रखता है।
- issue: נַחֲלָה में स्वामित्व का रूपक
  choice: विरासत
  alternative: निज भाग / संपत्ति
  rationale: ‘विरासत’ मूल के भूमि, भाग और वाचागत स्वामित्व से जुड़े अर्थ-संबंधों को खुला रखती है; इसका आशय यह नहीं कि परमेश्वर ने इसे किसी पूर्व स्वामी की मृत्यु पर पाया।
translation_notes:
  register: आधुनिक मानक हिंदी का गरिमापूर्ण भजनात्मक रूप अपनाया गया है। ‘धन्य’, ‘राष्ट्र’, ‘प्रजा’ और ‘विरासत’ सामान्य पाठक के लिए बोधगम्य रहते हुए मूल की काव्यात्मक तथा वाचागत भाषा को सुरक्षित रखते हैं।
