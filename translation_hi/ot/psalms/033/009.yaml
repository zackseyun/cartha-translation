id: PSA.33.9
reference: Psalms 33:9
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: כִּ֤י ה֣וּא אָמַ֣ר וַ/יֶּ֑הִי הֽוּא צִ֝וָּ֗ה וַֽ/יַּעֲמֹֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/033/009.yaml
  text: For he spoke[a], and it came to be; he commanded[b], and it stood firm.
translation:
  language: hi
  text: क्योंकि उसने कहा[a], और वह अस्तित्व में आ गया; उसने आज्ञा दी[b], और वह स्थिर हो गया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या “और वह हो गया”; इब्रानी बहुत संक्षिप्त है: “और वह हुआ/हो गया।”'
    reason: lexical_alternative
  - marker: b
    text: या “और वह खड़ा हो गया” अथवा “और वह स्थापित हो गया।”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पद पिछले कथन का आधार बताता है; हिन्दी में ‘क्योंकि’ इसके कारणसूचक बल को स्वाभाविक रूप से व्यक्त करता है।
- source_word: הוּא
  choice: उसने
  rationale: स्वतंत्र सर्वनाम पर हल्का बल है, पर हिन्दी क्रिया-रचना में ‘उसने’ स्वाभाविक है; अनावश्यक रूप से ‘उसी ने’ कहने से अधिक बल पड़ सकता है।
- source_word: אָמַר
  choice: कहा
  rationale: मूल क्रिया का सीधा और स्वाभाविक हिन्दी समतुल्य; काव्यात्मक समानांतरता में यह अगले ‘आज्ञा दी’ के साथ स्पष्ट बैठता है।
- source_word: וַיְהִי
  choice: और वह अस्तित्व में आ गया
  rationale: अत्यंत संक्षिप्त इब्रानी अभिव्यक्ति यहाँ परमेश्वर के कहने के तत्काल परिणाम को दिखाती है; यह चयन सृष्टि-सदृश भाव स्पष्ट करता है, जबकि वैकल्पिक शाब्दिक अर्थ पादटिप्पणी में रखा गया है।
- source_word: צִוָּה
  choice: आज्ञा दी
  rationale: यह आदेश देने की क्रिया को सीधे और आधुनिक मानक हिन्दी में व्यक्त करता है।
- source_word: וַיַּעֲמֹד
  choice: और वह स्थिर हो गया
  rationale: עמד का मूल चित्र ‘खड़ा होना’ है, पर यहाँ परिणामतः स्थापित और टिके रहने का भाव है; ‘स्थिर हो गया’ ठोसपन और स्थायित्व दोनों बनाए रखता है।
theological_decisions:
- issue: परमेश्वर के वचन के बाद सृष्टि/परिणाम की भाषा
  choice: पहले परिणाम को ‘वह अस्तित्व में आ गया’ और दूसरे को ‘वह स्थिर हो गया’ कहा गया।
  alternative: ‘वह हो गया/था’ और ‘वह खड़ा रहा/स्थापित हो गया।’
  rationale: यह अनुवाद परमेश्वर के वचन और आज्ञा की तत्काल तथा स्थायी प्रभावशीलता को व्यक्त करता है, पर पद में कोई अतिरिक्त सैद्धान्तिक व्याख्या नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी, संक्षिप्त और गरिमापूर्ण काव्यात्मक शैली। दोनों अर्धपंक्तियों की समानांतर रचना सुरक्षित रखी गई है।
