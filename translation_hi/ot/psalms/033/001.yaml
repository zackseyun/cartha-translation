source:
  edition: WLC
  text: רַנְּנ֣וּ צַ֭דִּיקִים בַּֽ/יהוָ֑ה לַ֝/יְשָׁרִ֗ים נָאוָ֥ה תְהִלָּֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/033/001.yaml
  text: Shout for joy in Yahweh[a], you righteous[b]; praise is fitting for the upright.
translation:
  language: hi
  text: हे धर्मियो, याहवे में आनन्द से जयजयकार करो; खरे लोगों को स्तुति शोभा देती है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: רַנְּנוּ
  choice: आनन्द से जयजयकार करो
  rationale: बहुवचन आज्ञार्थक क्रिया उल्लासपूर्ण और सुनाई देने वाली अभिव्यक्ति बताती है। यह विकल्प केवल मन के आनन्द के बजाय मुखर हर्ष को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: צַדִּיקִים
  choice: हे धर्मियो
  rationale: आज्ञा के साथ यह सम्बोधन है। ‘हे धर्मियो’ विशेषण के संज्ञात्मक और बहुवचन प्रयोग को स्पष्ट तथा गरिमापूर्ण हिन्दी में रखता है।
- source_word: בַּיהוָה
  choice: यहोवा में
  rationale: पूर्वसर्ग ב यहाँ आनन्द के आधार या क्षेत्र को दर्शाता है; इसलिए ‘यहोवा में’ मूल संरचना और अर्थ को सुरक्षित रखता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: चतुरक्षरीय व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय हिन्दी में प्रचलित लिप्यंतरण ‘यहोवा’ से व्यक्त किया गया है।
- source_word: לַיְשָׁרִים
  choice: सीधे लोगों के लिए
  rationale: יְשָׁרִים नैतिक खरेपन या सीधेपन वाले लोगों को सूचित करता है, और ל यहाँ उपयुक्तता के सम्बन्ध को दर्शाता है।
- source_word: נָאוָה
  choice: शोभा देता है
  rationale: यह शब्द उचित, सुन्दर या अनुकूल होने का अर्थ दे सकता है। ‘शोभा देता है’ हिन्दी में सौन्दर्य और उपयुक्तता—दोनों भावों को स्वाभाविक रूप से समेटता है।
- source_word: תְהִלָּה
  choice: स्तुति करना
  rationale: संज्ञा ‘स्तुति’ को हिन्दी वाक्य में सहज बनाने के लिए क्रियात्मक पद ‘स्तुति करना’ रखा गया है, बिना उसके स्वरूप को किसी विशेष गीत तक सीमित किए।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: याहवे / प्रभु
  rationale: मूल पाठ व्यक्तिगत ईश्वरीय नाम יהוה का प्रयोग करता है। हिन्दी पाठकों के लिए परिचित लिप्यंतरण ‘यहोवा’ नाम को उपाधि में बदले बिना सुरक्षित रखता है; ‘याहवे’ अधिक ध्वन्यात्मक विकल्प है और ‘प्रभु’ पारम्परिक प्रतिस्थापन, पर मूल की नामात्मकता को कम स्पष्ट करता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में काव्यात्मक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध शैली। ‘जयजयकार’ मुखर उल्लास को और ‘शोभा देता है’ उपयुक्तता तथा सुन्दरता की अर्थ-छाया को बनाए रखते हैं।
