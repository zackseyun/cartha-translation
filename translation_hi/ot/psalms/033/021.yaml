reference: Psalms 33:21
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: כִּי ב֭/וֹ יִשְׂמַ֣ח לִבֵּ֑/נוּ כִּ֤י בְ/שֵׁ֖ם קָדְשׁ֣/וֹ בָטָֽחְנוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/033/021.yaml
  text: For our heart rejoices in him[b][a], because we have trusted in his holy name.
translation:
  language: hi
  text: क्योंकि हमारा हृदय उसी में आनन्दित होता है[a][b], क्योंकि हमने उसके पवित्र नाम पर भरोसा रखा है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “हमारा हृदय उसी में आनन्दित होगा”; हिब्रू अपूर्ण क्रिया को वर्तमान सामान्य भाव के बजाय भविष्य के रूप में भी समझा जा सकता है।
    reason: lexical_alternative
  - marker: b
    text: हिब्रू में “हमारा हृदय” एकवचन है; यह पूरे समुदाय के सामूहिक भीतरी जीवन को व्यक्त करता है।
    reason: cultural_note
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: पहला כִּי पिछले कथन का कारण बताता है; हिन्दी में ‘क्योंकि’ causal संबंध को स्वाभाविक और स्पष्ट रखता है।
- source_word: בּוֹ
  choice: उसी में
  rationale: पुल्लिंग एकवचन सर्वनाम प्रसंग में यहोवा की ओर संकेत करता है; ‘उसी’ विश्वास और आनन्द के उसी आधार पर हल्का बल भी बनाए रखता है।
- source_word: יִשְׂמַח
  choice: आनन्दित होता है
  rationale: हिब्रू अपूर्ण क्रिया वर्तमान की निरंतर या सामान्य दशा व्यक्त कर सकती है। वर्तमान भाव भजन की स्वीकारोक्ति के अनुकूल है, जबकि भविष्य की सम्भावना पादटिप्पणी में सुरक्षित है।
- source_word: לִבֵּנוּ
  choice: हमारा हृदय
  rationale: हिब्रू में एकवचन ‘हृदय’ बहुवचन समुदाय के सामूहिक भीतरी जीवन को व्यक्त करता है; हिन्दी में इसे एकवचन रखना अर्थ और काव्यात्मक एकता दोनों बचाता है।
- source_word: כִּי
  choice: क्योंकि
  rationale: दूसरा כִּי आनन्द का आधार बताता है और हिन्दी में कारण-संबंध को स्पष्ट करता है।
- source_word: בְשֵׁם
  choice: नाम पर
  rationale: בטח के साथ בְ भरोसे के आधार या लक्ष्य को दर्शाता है; आधुनिक हिन्दी में ‘नाम पर भरोसा रखना’ स्वाभाविक प्रयोग है।
- source_word: קָדְשׁוֹ
  choice: उसके पवित्र
  rationale: ‘पवित्र’ धार्मिक और नैतिक पवित्रता का प्रतिष्ठित तथा सटीक हिन्दी पद है।
- source_word: בָטָחְנוּ
  choice: हमने ... भरोसा रखा है
  rationale: हिब्रू पूर्ण क्रिया ऐसे स्थापित भरोसे को व्यक्त करती है जिसका प्रभाव वर्तमान में बना है; हिन्दी पूर्ण वर्तमान इसे स्वाभाविक रूप से संप्रेषित करता है।
theological_decisions:
- issue: בּוֹ और קָדְשׁוֹ के पुल्लिंग एकवचन सर्वनामों का संदर्भ
  choice: सर्वनाम निकटवर्ती प्रसंग में यहोवा की ओर संकेत करते हैं, पर पद में नाम जोड़ने के बजाय ‘उसी’ और ‘उसके’ रखा गया है।
  alternative: सामान्य रूप से परमेश्वर का संदर्भ मानकर उसका स्पष्ट नाम जोड़ना।
  rationale: आसपास के पद संदर्भ को स्पष्ट करते हैं, किन्तु इस पद में ईश्वरीय नाम प्रत्यक्ष रूप से नहीं आया; इसलिए अनुवाद स्रोत-पाठ की अभिव्यक्ति से आगे नहीं जाता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘आनन्दित होता है’ काव्यात्मक होते हुए भी प्रचलित है; ‘भरोसा रखा है’ स्थापित और अब भी जारी विश्वास का भाव देता है।
