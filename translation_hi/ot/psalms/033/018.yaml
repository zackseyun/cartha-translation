  text: Behold[a], the eye of Yahweh is on those who fear him, on those who wait for his steadfast love,
translation:
  language: hi
  text: देखो[a], यहोवा की दृष्टि उन पर लगी रहती है जो उसका भय मानते हैं, जो उसके अटल प्रेम की आशा रखते हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘जो उसके अटल प्रेम की प्रतीक्षा करते हैं।’ हिब्रू क्रिया में आशा रखने और प्रतीक्षा करने, दोनों का भाव हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: देखो
  rationale: यह ध्यान आकर्षित करने और कथन पर बल देने वाला काव्यात्मक अव्यय है; आधुनिक हिन्दी में ‘देखो’ इसका स्वाभाविक और सजीव रूप है।
- source_word: עֵין
  choice: दृष्टि
  rationale: शाब्दिक अर्थ ‘आँख’ है, पर ‘यहोवा की दृष्टि ... पर लगी रहती है’ हिन्दी में मूल मानवरूपी बिंब और सजग निगरानी का भाव स्वाभाविक रूप से व्यक्त करता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: मूल में परमेश्वर का विशिष्ट नाम है; हिन्दी बाइबलीय परंपरा में प्रचलित लिप्यंतरण ‘यहोवा’ शीर्षक से प्रतिस्थापित किए बिना नाम को बनाए रखता है।
- source_word: אֶל
  choice: पर लगी रहती है
  rationale: ‘की ओर’ मूल संबंध है, पर आँख/दृष्टि के साथ यह ध्यानपूर्वक निगाह रखने का मुहावरा है; हिन्दी में ‘पर लगी रहती है’ निरंतर सजग ध्यान को व्यक्त करता है।
- source_word: יְרֵאָיו
  choice: जो उसका भय मानते हैं
  rationale: यह कृदन्त उन लोगों को बताता है जिनका जीवन यहोवा के भय से चिह्नित है; ‘भय मानना’ श्रद्धा और जवाबदेही दोनों की बाइबलीय व्यापकता बनाए रखता है।
- source_word: לַמְיַחֲלִים
  choice: जो ... आशा लगाए रहते हैं
  rationale: יחל में प्रतीक्षा और आशा दोनों निहित हैं। हिन्दी का यह प्रयोग प्रत्याशापूर्ण, टिके रहने वाली आशा को सहज रूप से व्यक्त करता है।
- source_word: לְחַסְדּוֹ
  choice: उसकी अटल करुणा की
  rationale: חֶסֶד में निष्ठावान, स्थायी प्रेमपूर्ण कृपा का भाव है। ‘अटल करुणा’ सामान्य हिन्दी में सुबोध रहते हुए स्थिरता और अनुग्रह दोनों को व्यक्त करती है; संबंधकारक ‘की’ आशा लगाने के स्वाभाविक हिन्दी प्रयोग के अनुरूप है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल के व्यक्तिगत वाचा-नाम को किसी उपाधि से बदलने के बजाय हिन्दी में परिचित लिप्यंतरण द्वारा रखा गया है।
- issue: חֶסֶד की अर्थ-व्याप्ति
  choice: अटल करुणा
  alternative: अटल प्रेम / विश्वासयोग्य प्रेम / दया
  rationale: यह चयन केवल भावात्मक प्रेम या क्षणिक दया तक अर्थ को सीमित नहीं करता, बल्कि परमेश्वर की स्थायी, अनुग्रहपूर्ण निष्ठा का भाव रखता है।
- issue: יחל में प्रतीक्षा और आशा का संबंध
  choice: आशा लगाए रहते हैं
  alternative: प्रतीक्षा करते हैं
  rationale: मूल क्रिया दोनों अर्थ दे सकती है। यहाँ ‘आशा लगाए रहते हैं’ प्रत्याशा और निरंतर प्रतीक्षा का संयुक्त भाव देता है, बिना निश्चित प्राप्ति का समय निर्धारित किए।
translation_notes:
  register: आधुनिक मानक हिन्दी, काव्यात्मक परंतु सामान्य पाठक के लिए सहज। ‘देखो’ से मूल का ध्यानाकर्षक बल रखा गया है। समानांतर दोनों उपवाक्यों की संरचना बनाए रखी गई है।
