  text: By the word of Yahweh the heavens were made[a], and by the breath of his mouth all their host.
translation:
  language: hi
  text: याहवे के वचन से आकाश बनाए गए, और उसके मुँह की साँस से उनका सारा गण।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘और उसके मुँह की आत्मा से उनका सारा गण।’ इब्रानी शब्द का अर्थ ‘साँस,’ ‘वायु,’ या ‘आत्मा’ हो सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: בִּדְבַר
  choice: के वचन से
  rationale: पूर्वसर्ग ב यहाँ साधन का बोध कराता है; ‘के वचन से’ इस अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत नाम יהוה को उपाधि से बदलने के बजाय हिन्दी लिप्यंतरण में रखा गया है।
- source_word: שָׁמַיִם
  choice: आकाश
  rationale: यहाँ बहुवचन रूप समूचे आकाशीय विस्तार को सूचित करता है; हिन्दी में ‘आकाश’ इसी अर्थ में स्वाभाविक सामूहिक संज्ञा है।
- source_word: נַעֲשׂוּ
  choice: बनाए गए
  rationale: עשה का सीधा और व्यापक अर्थ ‘बनाना’ है; ‘सृजे गए’ मूल से अधिक विशिष्ट अर्थ जोड़ सकता है।
- source_word: וּבְרוּחַ
  choice: और ... साँस से
  rationale: רוּחַ के अर्थ साँस, वायु और आत्मा हो सकते हैं। ‘उसके मुँह’ के साथ काव्यात्मक समानांतरता में ‘साँस’ सर्वाधिक सहज है, जबकि ‘आत्मा’ को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: פִּיו
  choice: उसके मुँह की
  rationale: यह शाब्दिक रूप काव्यात्मक मानवीकरण तथा ‘वचन’ के साथ समानांतरता बनाए रखता है।
- source_word: כָּל־צְבָאָם
  choice: उनका सारा गण
  rationale: צָבָא यहाँ आकाश के समस्त समुदाय या समूह—विशेषतः आकाशीय पिंडों—को दर्शाता है। ‘गण’ काव्यात्मक और व्यापक है तथा सैन्य अर्थ को अनावश्यक रूप से प्रमुख नहीं करता।
theological_decisions:
- issue: सृष्टि के संदर्भ में רוּחַ और सम्भावित त्रिएक-संबंधी अनुगूँज
  choice: साँस
  alternative: आत्मा
  rationale: ‘याहवे के वचन’ और ‘उसके मुँह की साँस’ की काव्यात्मक समानांतरता मुख्य पाठ में ‘साँस’ का समर्थन करती है। फिर भी मूल शब्द में ‘आत्मा’ का अर्थ सम्भव है, इसलिए theological tension को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और काव्यात्मक रखी गई है। ‘आकाश’ हिन्दी में सामूहिक अर्थ देता है, और ‘सारा गण’ मूल के संक्षिप्त काव्यात्मक रूप को बनाए रखता है।
