translation:
  language: hi
  text: 'उनके प्राणों को मृत्यु से बचाने

    और अकाल में उन्हें जीवित रखने के लिए।[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘उनके प्राणों’ के स्थान पर ‘उनका जीवन’ भी सम्भव है; इब्रानी नेफ़ेश का अर्थ प्राण, स्वयं व्यक्ति या जीवन हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: לְהַצִּיל
  choice: बचाने
  rationale: हिफ़ील क्रिया का अर्थ संकट से छुड़ाना या बचाना है। ‘मृत्यु से बचाने’ आधुनिक हिन्दी में स्वाभाविक है और साधन को अनावश्यक रूप से स्पष्ट नहीं करता।
- source_word: מִמָּוֶת
  choice: मृत्यु से
  rationale: מן के साथ מָוֶת का सीधा पृथक्करणार्थक भाव है; यह संक्षिप्त इब्रानी अभिव्यक्ति को बनाए रखता है।
- source_word: נַפְשָׁם
  choice: उनके प्राण
  rationale: נֶפֶשׁ व्यक्ति, प्राण या जीवन को सूचित कर सकता है। सामूहिक एकवचन के भाव को ‘उनके प्राण’ से सुरक्षित रखा गया है; सन्दर्भ में ‘जीवन’ भी सम्भव है, इसलिए उसे पाद-टिप्पणी में दिया गया है।
- source_word: וּלְחַיּוֹתָם
  choice: और … उन्हें जीवित रखने
  rationale: यहाँ חיה का अर्थ जीवित बनाए रखना है। ‘उन्हें जीवित रखने’ सहज आधुनिक हिन्दी में निरन्तर संरक्षण का भाव व्यक्त करता है।
- source_word: בָּרָעָב
  choice: अकाल में
  rationale: इस सन्दर्भ में רָעָב केवल व्यक्तिगत भूख नहीं, बल्कि अकाल की परिस्थिति को दर्शाता है।
