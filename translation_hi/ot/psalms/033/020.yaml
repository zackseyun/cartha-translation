  text: Our soul waits for Yahweh[a]; he is our help and our shield.
translation:
  language: hi
  text: 'हमारा प्राण[a] याहवे की बाट जोहता है;

    वही हमारी सहायता और हमारी ढाल है।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक अर्थ ‘हमारा प्राण’ है। यहाँ ‘प्राण’ किसी व्यक्ति के केवल अभौतिक भाग को नहीं, बल्कि समुदाय के समूचे अंतर्मन और अस्तित्व को व्यक्त करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: נַפְשֵׁנוּ
  choice: हमारा प्राण
  rationale: נֶפֶשׁ यहाँ समुदाय के सामूहिक, समूचे अंतर्मन या अस्तित्व को एकवचन में व्यक्त करता है। ‘हमारा प्राण’ हिब्रू की काव्यात्मक छवि बनाए रखता है; इसे केवल ‘हम’ कहने से वह छवि मिट जाती।
- source_word: חִכְּתָה
  choice: बाट जोहता है
  rationale: חכה आशा और अपेक्षा के साथ प्रतीक्षा करने का भाव देता है। ‘बाट जोहता है’ हिंदी में स्वाभाविक काव्यात्मक अभिव्यक्ति है और साधारण प्रतीक्षा से अधिक अपेक्षापूर्ण भाव प्रकट करती है।
- source_word: לַיהוָה
  choice: याहवे की
  rationale: ל यहाँ उस व्यक्ति को सूचित करता है जिसकी प्रतीक्षा की जा रही है। ‘बाट जोहना’ के साथ हिंदी में संबंधसूचक ‘की’ स्वाभाविक है। יהוה को उसके व्यक्तिगत वाचा-नाम ‘याहवे’ के रूप में लिप्यंतरित किया गया है।
- source_word: עֶזְרֵנוּ
  choice: हमारी सहायता
  rationale: עֵזֶר का मूल अर्थ ‘सहायता’ है। यह चयन हिब्रू की भाववाचक संज्ञा को बनाए रखता है, उसे ‘सहायक’ में नहीं बदलता।
- source_word: וּמָגִנֵּנוּ
  choice: और हमारी ढाल
  rationale: מָגֵן का ठोस अर्थ ‘ढाल’ है। सुरक्षा का यह स्पष्ट रूपक हिंदी में भी सहज और बोधगम्य है।
- source_word: הוּא
  choice: वही ... है
  rationale: स्वतंत्र सर्वनाम הוּא इस क्रियारहित वाक्य में बल देता है। हिंदी का ‘वही’ उस बल को स्वाभाविक रूप से व्यक्त करता है, बिना ‘केवल’ जैसा अतिरिक्त अर्थ जोड़े।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में चतुराक्षरी व्यक्तिगत नाम יהוה है। ‘याहवे’ उसे उपाधि ‘प्रभु’ से बदलने के बजाय नाम के रूप में सुरक्षित रखता है और उपलब्ध प्राचीन भाषिक साक्ष्य के निकट है।
translation_notes:
  register: भाषा आधुनिक मानक हिंदी में है, किंतु भजन की काव्यात्मक गरिमा के लिए ‘प्राण’ और ‘बाट जोहता है’ जैसे सहज साहित्यिक पद रखे गए हैं। सामूहिक एकवचन को मूल की काव्यात्मक संरचना के अनुसार सुरक्षित रखा गया है।
