  text: He turns a wilderness into a pool of water[c][b][a], and dry land into springs of water.
translation:
  language: hi
  text: वह मरुभूमि को जल के सरोवर में बदल देता है[a], और सूखी भूमि को जल के सोतों में[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “बना देता है” या “स्थापित करता है”; इब्रानी क्रिया का अर्थ प्रसंग के अनुसार “रखना,” “बनाना,” या “बदल देना” हो सकता है। ‘मरुभूमि’ के लिए “उजाड़ प्रदेश” या “रेगिस्तान” भी संभव है।
    reason: lexical_alternative
  - marker: b
    text: या, “जल के स्रोत” या “जल के फव्वारे।”
    reason: lexical_alternative
lexical_decisions:
- source_word: יָשֵׂם
  choice: बना देता है
  rationale: שׂים का मूल अर्थ ‘रखना/स्थापित करना/बनाना’ है; इस काव्यात्मक समानांतरता में ‘बना देता है’ अवस्था-परिवर्तन को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: מִדְבָּר
  choice: उजाड़
  rationale: מִדְבָּר निर्जन, शुष्क वनप्रदेश या मरुभूमि को सूचित कर सकता है। ‘उजाड़’ व्यापक अर्थ बनाए रखता है और केवल रेतीले रेगिस्तान का संकेत नहीं देता।
- source_word: לַאֲגַם מַיִם
  choice: जल का ताल
  rationale: אֲגַם ताल, जलाशय या दलदली जल-क्षेत्र हो सकता है। ‘जल का ताल’ स्थिर और प्रचुर जल की काव्यात्मक छवि को स्पष्ट रूप से रखता है।
- source_word: וְאֶרֶץ צִיָּה
  choice: और सूखी भूमि
  rationale: צִיָּה शुष्क या प्यासी भूमि को दर्शाता है; ‘सूखी भूमि’ सरल और सटीक आधुनिक हिन्दी है।
- source_word: לְמֹצָאֵי מָיִם
  choice: जल के सोते
  rationale: מוֹצָאֵי מַיִם का अर्थ वे स्थान या स्रोत हैं जहाँ से जल निकलता है। ‘जल के सोते’ इस प्राकृतिक उद्गम की छवि को सहज हिन्दी में व्यक्त करता है।
