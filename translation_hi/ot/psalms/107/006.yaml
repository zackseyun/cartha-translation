lexical_decisions:
- source_word: וַיִּצְעֲקוּ
  choice: तब उन्होंने ... पुकारा
  rationale: वाव-क्रमिक कथा को आगे बढ़ाता है, इसलिए ‘तब’ उपयुक्त है; संकट के प्रसंग में צעק व्याकुल होकर सहायता पुकारने का भाव व्यक्त करता है।
- source_word: אֶל
  choice: को
  rationale: पुकारने के लक्ष्य को आधुनिक स्वाभाविक हिन्दी में ‘को’ से व्यक्त किया गया है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: मूल पाठ में आए परमेश्वर के व्यक्तिगत नाम को हिन्दी में प्रचलित लिप्यंतरण ‘यहोवा’ से रखा गया है, किसी उपाधि से प्रतिस्थापित नहीं किया गया।
- source_word: בַּצַּר לָהֶם
  choice: अपने संकट में
  rationale: צַר यहाँ तंगी, परेशानी या संकट की अवस्था बताता है। एकवचन सामूहिक अर्थ को ‘संकट’ स्वाभाविक रूप से व्यक्त करता है।
- source_word: מִמְּצוּקוֹתֵיהֶם
  choice: उनकी विपत्तियों से
  rationale: מְצוּקוֹת दबावपूर्ण और अनेक प्रकार की कठिन अवस्थाओं को दर्शाता है। ‘विपत्तियों’ से मूल का बहुवचन और पहले आए एकवचन ‘संकट’ से उसका अंतर सुरक्षित रहता है।
- source_word: יַצִּילֵם
  choice: उसने उन्हें ... छुड़ाया
  rationale: נצל के हिफ़ील रूप का अर्थ छुड़ाना या बचाना है। भूतकाल पूर्ववर्ती कथात्मक क्रिया के क्रम के अनुरूप है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: नाम को ‘प्रभु’ जैसी उपाधि से बदलने के बजाय व्यक्तिगत नाम के रूप में रखा गया है। आधुनिक हिन्दी बाइबलीय प्रयोग में ‘यहोवा’ व्यापक रूप से पहचाना जाने वाला रूप है; ‘याहवे’ स्रोत उच्चारण के निकट एक वैकल्पिक लिप्यंतरण है।
translation_notes:
  register: भाषा आधुनिक, सरल और गरिमापूर्ण रखी गई है। समानांतर पंक्तियों में एकवचन ‘संकट’ और बहुवचन ‘विपत्तियों’ का भेद मूल इब्रानी के काव्यात्मक तनाव को बनाए रखता है।
