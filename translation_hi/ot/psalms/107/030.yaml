  text: Then they were glad that they grew quiet[b][a], and he led them to their desired haven.
translation:
  language: hi
  text: तब वे इस बात से आनंदित हुए कि शांति हो गई[a], और वह उन्हें उनके मनचाहे बंदरगाह[b] तक ले गया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से, ‘कि वे शांत हो गए।’ ‘वे’ का कर्ता स्पष्ट नहीं है; प्रसंग में यह लहरों या जल के शांत होने का संकेत हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: अथवा ‘आश्रय-स्थान’ या ‘गंतव्य’।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׂמְחוּ
  choice: तब वे आनन्दित हुए
  rationale: שׂמח आनन्दित होने को व्यक्त करता है; वाव-युक्त कथात्मक रूप के क्रम को आधुनिक हिन्दी में ‘तब’ स्वाभाविक रूप से दिखाता है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यहाँ כִּי उनके आनन्द का कारण प्रस्तुत करता है; हिन्दी में ‘क्योंकि’ इस संबंध को स्पष्ट और स्वाभाविक रखता है।
- source_word: יִשְׁתֹּקוּ
  choice: वे शांत हो गईं
  rationale: שׁתק का अर्थ शांत या स्थिर हो जाना है। क्रिया का कर्ता स्पष्ट नहीं है; स्त्रीलिंग ‘गईं’ निकटवर्ती प्रसंग की लहरों की ओर संकेत करता है, जबकि पादटिप्पणी मूल की अस्पष्टता बताती है।
- source_word: וַיַּנְחֵם
  choice: और वह उन्हें ... ले गया
  rationale: נחה का मूल भाव अगुवाई करना या ले जाना है। एकवचन पुल्लिंग कर्ता प्रसंग में परमेश्वर है; मूल की तरह नाम जोड़े बिना ‘वह’ रखा गया है।
- source_word: מְחוֹז
  choice: बंदरगाह
  rationale: यह आगमन-स्थान, विशेषतः समुद्री आश्रय या बंदरगाह, को दर्शाता है। ‘बंदरगाह’ सामान्य आधुनिक हिन्दी में स्पष्ट है और समुद्री प्रसंग बनाए रखता है।
- source_word: חֶפְצָם
  choice: उनके मनचाहे
  rationale: חפץ इच्छा या अभिलाषा का भाव रखता है; ‘मनचाहा’ उस गंतव्य को स्वाभाविक हिन्दी में व्यक्त करता है जिसकी वे चाह रखते थे।
theological_decisions:
- issue: וַיַּנְחֵם का अप्रकट कर्ता
  choice: ‘वह’—प्रसंग में परमेश्वर
  alternative: 'कर्मवाच्य: ‘उन्हें पहुँचा दिया गया’'
  rationale: इब्रानी क्रिया का कर्ता तीसरे पुरुष एकवचन पुल्लिंग में है और पूर्ववर्ती प्रसंग में यहोवा कार्य करता है। ‘वह’ व्यक्तिगत कर्तृत्व को बनाए रखता है, पर पद में नाम स्पष्ट न होने के कारण उसे नहीं जोड़ता।
- issue: יִשְׁתֹּקוּ का अप्रकट कर्ता
  choice: मुख्य पाठ में लहरों की ओर संकेत करने वाला ‘वे ... हो गईं’
  alternative: नाविक स्वयं शांत हो गए
  rationale: समुद्री तूफान के प्रसंग में लहरों या जल का शांत होना सबसे संभावित है, फिर भी मूल पद कर्ता को स्पष्ट नहीं करता; इसलिए वैकल्पिक समझ पादटिप्पणी में सुरक्षित रखी गई है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सहज हिन्दी। ‘आनन्दित’ भजन की काव्यात्मक गरिमा रखता है; ‘मनचाहा बंदरगाह’ समुद्री चित्र और इच्छा-पूर्ति दोनों को स्पष्ट करता है।
