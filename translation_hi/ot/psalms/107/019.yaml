  edition: WLC
  text: וַ/יִּזְעֲק֣וּ אֶל יְ֭הוָה בַּ/צַּ֣ר לָ/הֶ֑ם מִ֝/מְּצֻֽקוֹתֵי/הֶ֗ם יוֹשִׁיעֵֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/107/019.yaml
  text: Then they cried out to Yahweh in their trouble[a]; he saved them from their distresses.
translation:
  language: hi
  text: तब उन्होंने अपने संकट में याहवे[a] की दुहाई दी; उसने उन्हें उनकी विपत्तियों से बचाया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में “YHWH,” परमेश्वर का नाम; इसे सामान्यतः “याहवे” उच्चारित किया जाता है और परंपरागत रूप से “प्रभु” अनूदित किया जाता है।
    reason: ईश्वरीय नाम के इब्रानी रूप, प्रचलित उच्चारण और पारंपरिक प्रतिस्थापन को स्पष्ट करना।
lexical_decisions:
- source_word: וַיִּזְעֲקוּ
  choice: तब उन्होंने ... दुहाई दी
  rationale: वाव-क्रम कथा और भजन के आवर्ती क्रम को आगे बढ़ाता है; זעק सहायता के लिए की गई व्याकुल पुकार को व्यक्त करता है, जिसे स्वाभाविक हिन्दी में ‘दुहाई दी’ कहा गया है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: यह चार-अक्षरीय व्यक्तिगत परमेश्वर-नाम का हिन्दी में प्रचलित लिप्यंतरण है; इसे किसी उपाधि से नहीं बदला गया।
- source_word: בַּצַּר לָהֶם
  choice: अपने संकट में
  rationale: צַר यहाँ तंगी या संकट की अवस्था बताता है और לָהֶם संबंधसूचक अर्थ देता है; हिन्दी में यह संयुक्त रूप स्पष्ट और स्वाभाविक है।
- source_word: מִמְּצֻקוֹתֵיהֶם
  choice: उनकी विपत्तियों से
  rationale: מְצוּקוֹת बहुवचन में गंभीर कष्ट या दबाव की स्थितियाँ दर्शाता है; ‘विपत्तियों’ से पहले आए ‘संकट’ के साथ शब्दगत भेद भी बना रहता है।
- source_word: יוֹשִׁיעֵם
  choice: उसने उन्हें ... बचाया
  rationale: ישׁע का हिफ़ील रूप बचाने या छुड़ाने का अर्थ देता है; ‘बचाया’ संक्षिप्त, सहज और उद्धार का आशय बनाए रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: मूल पाठ में व्यक्तिगत ईश्वरीय नाम सीधे आया है। ‘यहोवा’ आधुनिक हिन्दी बाइबलीय प्रयोग में जाना-पहचाना लिप्यंतरण है; पादटिप्पणी ‘याहवे’ उच्चारण और ‘प्रभु’ पारंपरिक प्रतिस्थापन दोनों बताती है, बिना किसी एक उच्चारण को पूर्णतः निश्चित ठहराए।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘दुहाई दी’ तत्काल और व्याकुल सहायता-पुकार का भाव देता है; ‘संकट’ और ‘विपत्तियों’ से मूल के दो संबंधित किन्तु भिन्न शब्दों का अंतर सुरक्षित है।
