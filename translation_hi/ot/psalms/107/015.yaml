source:
  edition: WLC
  text: יוֹד֣וּ לַ/יהוָ֣ה חַסְדּ֑/וֹ וְ֝/נִפְלְאוֹתָ֗י/ו לִ/בְנֵ֥י אָדָֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/107/015.yaml
  text: Let them give thanks to Yahweh for his steadfast love and for his wondrous deeds to the children of man[a][b].
translation:
  language: hi
  text: वे याहवे का धन्यवाद करें—उसके अटल प्रेम के लिए, और मनुष्यों के लिए किए गए उसके अद्भुत कामों के लिए।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יוֹדוּ
  choice: वे ... धन्यवाद करें
  rationale: ידה का हिफ़ील बहुवचन रूप यहाँ भजन के आवर्ती आह्वान में प्रयुक्त है; यह रचना स्वाभाविक हिन्दी में उपदेशात्मक/कामनात्मक बल बनाए रखती है।
- source_word: לַיהוָה
  choice: यहोवा का
  rationale: हिन्दी में ‘धन्यवाद करना’ के साथ ‘का’ स्वाभाविक है; יהוה को उसके व्यक्तिवाचक वाचा-नाम ‘यहोवा’ से व्यक्त किया गया है।
- source_word: חַסְדּוֹ
  choice: उसकी अटल करुणा
  rationale: חסד में स्थिर निष्ठा, प्रेम और कृपा का संयुक्त भाव है; ‘अटल करुणा’ इस प्रसंग में संक्षिप्त, गरिमापूर्ण और बोधगम्य है।
- source_word: וְנִפְלְאוֹתָיו
  choice: और ... उसके अद्भुत कामों
  rationale: פלא से बना यह बहुवचन संज्ञा-रूप असाधारण ईश्वरीय कार्यों को दर्शाता है; ‘अद्भुत काम’ आधुनिक हिन्दी में सक्रिय अर्थ स्पष्ट करता है।
- source_word: לִבְנֵי אָדָם
  choice: मनुष्यों के लिए
  rationale: शाब्दिक ‘आदम की सन्तानों के लिए/प्रति’ यहाँ सामूहिक रूप से मानवजाति और ईश्वरीय कार्यों के लाभार्थियों को दर्शाता है; स्वाभाविक हिन्दी में ‘मनुष्यों के लिए’ अर्थ और पूर्वसर्गीय संबंध बनाए रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: मूल पाठ में वाचा का व्यक्तिवाचक नाम सीधे आया है। ‘यहोवा’ हिन्दी बाइबलीय प्रयोग में व्यापक रूप से पहचाना जाता है और इसे सामान्य उपाधि ‘प्रभु’ में नहीं बदलता।
- issue: בני אדם में אדם का सामूहिक अर्थ
  choice: मनुष्यों
  alternative: आदम की सन्तानों; मानवजाति
  rationale: वाक्यांश व्याकरणतः ‘आदम/मनुष्य की सन्तान’ है, पर यहाँ समस्त मनुष्यों का प्रतिनिधिक बोध देता है। ‘मनुष्यों’ से अनावश्यक रूप से केवल पुरुषों का अर्थ नहीं निकलता और लाभार्थी संबंध स्पष्ट रहता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण भजनात्मक शैली। समानांतर दो कारणों को स्पष्ट करने के लिए डैश और ‘के लिए’ की पुनरावृत्ति रखी गई है।
