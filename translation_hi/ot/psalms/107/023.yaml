- source_word: יוֹרְדֵי
  choice: जो ... उतरते हैं
  rationale: कर्ता के रूप में प्रयुक्त बहुवचन कृदन्त को बनाए रखता है। ‘उतरते हैं’ समुद्र की ओर जाने की इब्रानी काव्यात्मक छवि को सुरक्षित रखता है।
- source_word: הַיָּם
  choice: समुद्र
  rationale: यहाँ किसी नामित समुद्र के बजाय सामान्य समुद्री क्षेत्र का उल्लेख है।
- source_word: בָּאֳנִיּוֹת
  choice: जहाज़ों में
  rationale: पूर्वसर्ग और बहुवचन संज्ञा का सीधा तथा स्वाभाविक अर्थ है; इससे समुद्री यात्रा का साधन स्पष्ट होता है।
- source_word: עֹשֵׂי מְלָאכָה
  choice: अपना काम करते हैं
  rationale: व्यापक अर्थ वाले पदबंध को अनावश्यक रूप से केवल व्यापार तक सीमित नहीं करता, पर व्यावसायिक या श्रम-संबंधी गतिविधि दोनों को समेट सकता है।
- source_word: בְּמַיִם רַבִּים
  choice: विशाल जलराशि पर
  rationale: इब्रानी काव्यात्मक अभिव्यक्ति के खुले अथवा विस्तृत समुद्र वाले भाव को आधुनिक हिन्दी में स्वाभाविक ढंग से व्यक्त करता है।
