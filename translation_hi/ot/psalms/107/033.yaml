  text: He turns rivers into a wilderness[a], and springs of water into thirsty ground.
translation:
  language: hi
  text: 'वह नदियों को मरुभूमि में बदल देता है,

    और जल-स्रोतों को प्यासी धरती में बदल देता है।[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक अर्थ: “प्यास।” यहाँ इसका आशय सूखी, जलहीन धरती की अवस्था से है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: יָשֵׂם
  choice: बना देता है
  rationale: שׂים का मूल अर्थ ‘रखना/ठहराना’ है, पर यहाँ एक अवस्था को दूसरी अवस्था में बदलने का भाव है; ‘बना देता है’ हिन्दी में इस परिणाम को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: נְהָרוֹת
  choice: नदियों
  rationale: बहुवचन संज्ञा का सीधा और सामान्य हिन्दी समतुल्य ‘नदियाँ’ है।
- source_word: לְמִדְבָּר
  choice: मरुभूमि
  rationale: מִדְבָּר निर्जन, शुष्क भूभाग अथवा जंगल का बोध करा सकता है। जलपूर्ण नदियों के विरोध में ‘मरुभूमि’ यहाँ शुष्क और उजाड़ परिणाम को स्पष्ट तथा काव्यात्मक ढंग से व्यक्त करता है।
- source_word: וּמֹצָאֵי מַיִם
  choice: और जल-स्रोतों
  rationale: מוֹצָאֵי מַיִם का आशय उन स्थानों से है जहाँ से जल निकलता है। ‘जल-स्रोत’ मूल अभिव्यक्ति की व्यापकता बनाए रखता है और केवल किसी एक प्रकार के सोते तक अर्थ को सीमित नहीं करता।
- source_word: לְצִמָּאוֹן
  choice: प्यासी धरती
  rationale: צִמָּאוֹן का शाब्दिक अर्थ ‘प्यास’ या ‘प्यास की दशा’ है। समानांतर पंक्ति में यह जलहीन भूभाग के लिए प्रयुक्त है; ‘प्यासी धरती’ मूल रूपक को स्वाभाविक हिन्दी में बनाए रखता है।
