base_translation:
  language: en
  yaml_path: translation/ot/psalms/107/043.yaml
  text: Who is wise? Let him keep these things[c][b][a], and let them consider the steadfast love of Yahweh.
translation:
  language: hi
  text: कौन बुद्धिमान है? वह इन बातों को ध्यान में रखे, और वे[a] याहवे के अटल प्रेम के कार्यों[b] पर मनन करें।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में पहली क्रिया एकवचन (‘वह … रखे’) और दूसरी बहुवचन (‘वे … मनन करें’) है।
    reason: मूल पाठ के असामान्य एकवचन-बहुवचन परिवर्तन को स्पष्ट करना।
  - marker: b
    text: शाब्दिक रूप से ‘याहवे के अटल प्रेमों’; बहुवचन संभवतः उसके अटल प्रेम और दया की अनेक अभिव्यक्तियों की ओर संकेत करता है।
    reason: חַסְדֵי के बहुवचन रूप और उसके संभावित आशय को बताना।
lexical_decisions:
- source_word: מִי חָכָם
  choice: कौन बुद्धिमान है?
  rationale: प्रश्नवाचक, ज्ञान-साहित्य जैसी सीधी चुनौती को बनाए रखता है; इसे ‘जो कोई बुद्धिमान हो’ कहकर शर्तवाचक नहीं बनाया गया।
- source_word: וְיִשְׁמָר אֵלֶּה
  choice: वह इन बातों को ध्यान में रखे
  rationale: שמר यहाँ भजन में कही गई बातों को सावधानी से याद रखने और उन पर ध्यान देने का भाव देता है। हिंदी में ‘ध्यान में रखे’ इस व्यापक अर्थ को स्वाभाविक रूप से व्यक्त करता है।
- source_word: וְיִתְבּוֹנְנוּ
  choice: और वे … पर मनन करें
  rationale: בין के इस रूप में गंभीरता से विचार करके समझने का भाव है। ‘मनन करें’ चिंतनशील विवेक को व्यक्त करता है और बहुवचन क्रिया को भी बनाए रखता है।
- source_word: חַסְדֵי
  choice: अटल प्रेम के कामों
  rationale: חסד का बहुवचन याहवे के वाचा-निष्ठ प्रेम और दया की अनेक अभिव्यक्तियों की ओर संकेत करता है। ‘अटल प्रेम के कामों’ से हिंदी में बहुवचन का आशय स्वाभाविक और स्पष्ट रहता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी व्यक्तिगत नाम יהוה का हिंदी लिप्यंतरण किया गया है; उसके स्थान पर कोई उपाधि नहीं रखी गई।
theological_decisions:
- issue: एकवचन से बहुवचन की ओर व्याकरणिक परिवर्तन
  choice: वह … और वे
  alternative: वह … और वह
  rationale: इब्रानी पाठ पहले पुल्लिंग एकवचन क्रिया और फिर बहुवचन क्रिया प्रयोग करता है। कुछ असामान्य लगने पर भी इस परिवर्तन को बनाए रखा गया है, ताकि पाठ की वास्तविक संरचना और सामूहिक आह्वान मिट न जाए।
- issue: חַסְדֵי का बहुवचन
  choice: अटल प्रेम के कामों
  alternative: अटल प्रेम
  rationale: सामूहिक एकवचन सहज होता, पर मूल का बहुवचन संभवतः याहवे के निष्ठावान प्रेम के अनेक कार्यों को दर्शाता है; मुख्य पाठ में यही अर्थ स्पष्ट किया गया है।
- issue: ईश्वरीय नाम יהוה
  choice: याहवे
  alternative: प्रभु
  rationale: मूल पाठ में उपाधि नहीं, परमेश्वर का व्यक्तिगत वाचा-नाम है; इसलिए उसका लिप्यंतरण सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘ध्यान में रखे’ और ‘मनन करें’ ज्ञानपरक उपदेश का स्वर बनाए रखते हैं। मूल का एकवचन से बहुवचन में परिवर्तन जानबूझकर नहीं सुधारा गया।
