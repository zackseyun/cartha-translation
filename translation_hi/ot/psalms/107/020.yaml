  yaml_path: translation/ot/psalms/107/020.yaml
  text: He sent his word and healed them[a], and delivered them from their pits.
translation:
  language: hi
  text: उसने अपना वचन भेजा और उन्हें चंगा किया, और उनके गड्ढों[a] से उन्हें बचाया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उनके विनाशों से।” इब्रानी शब्द का अर्थ गड्ढे, कब्रें, या विनाश अथवा बरबादी की अवस्थाएँ हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: יִשְׁלַח
  choice: भेजकर
  rationale: काव्यात्मक वर्णन में यह क्रिया बीते हुए उद्धार-कार्य को व्यक्त करती है। हिन्दी में संयुक्त क्रिया-रचना ‘भेजकर…किया’ मूल की क्रियाओं का संबंध स्वाभाविक रूप से दिखाती है।
- source_word: דְּבָרוֹ
  choice: अपना वचन
  rationale: यह ‘उसका वचन’ का स्वाभाविक हिन्दी रूप है और परमेश्वर के प्रभावकारी कथन का संकेत बनाए रखता है, बिना उसे किसी विशिष्ट व्यक्तित्व या सिद्धान्त से जोड़ने के।
- source_word: וְיִרְפָּאֵם
  choice: उन्हें चंगा किया
  rationale: רפא का सीधा अर्थ ‘चंगा करना’ है; प्रसंग रोग और मृत्यु के संकट से पीड़ित लोगों का है।
- source_word: וִימַלֵּט
  choice: उन्हें बचाया
  rationale: מלט का पिएल रूप किसी को संकट से निकालने या बचाने का अर्थ देता है। ‘बचाया’ साधारण, स्पष्ट और भजन की उद्धार-संबंधी भाषा के अनुकूल है।
- source_word: מִשְּׁחִיתוֹתָם
  choice: उनके विनाश से
  rationale: שְׁחִיתוֹת बहुवचन रूप में है और विनाश, कब्र या गड्ढों का बोध करा सकता है। हिन्दी में ‘विनाशों से’ अस्वाभाविक है; सामूहिक भाव वाला ‘उनके विनाश से’ व्यापक अर्थ को बनाए रखता है, जबकि ठोस वैकल्पिक अर्थ पाद-टिप्पणी में दिए गए हैं।
theological_decisions:
- issue: ‘अपना वचन’ का सम्भावित धर्मवैज्ञानिक अति-पाठ
  choice: इसे परमेश्वर के प्रभावकारी कथन के रूप में अनिर्दिष्ट रखना
  alternative: इसे ‘अपनी आज्ञा’ कहना या किसी व्यक्तिरूप ‘वचन’ के रूप में स्पष्ट करना
  rationale: इब्रानी पाठ परमेश्वर द्वारा अपना वचन भेजने की बात करता है, पर इस पद में किसी मसीही या व्यक्तिरूप पहचान को स्पष्ट नहीं करता। अनुवाद को उस पहचान को आयात नहीं करना चाहिए।
- issue: מִשְּׁחִיתוֹתָם की ठोस या अमूर्त व्याख्या
  choice: मुख्य पाठ में ‘उनके विनाश से’
  alternative: ‘उनके गड्ढों से’ या ‘उनकी कब्रों से’
  rationale: शब्द विनाश/बरबादी की अवस्था और गड्ढों अथवा कब्रों, दोनों का संकेत दे सकता है। मुख्य पाठ व्यापक अर्थ रखता है और पाद-टिप्पणी वास्तविक शाब्दिक विकल्पों को सुरक्षित करती है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और काव्यात्मक। ‘चंगा किया’ भजन के रोग-संबंधी प्रसंग में सहज है। ‘विनाश से’ शाब्दिक बहुवचन को हिन्दी में अस्वाभाविक बनाए बिना मूल की अर्थगत व्यापकता सुरक्षित रखता है।
