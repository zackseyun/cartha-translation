id: PSA.107.11
reference: Psalms 107:11
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: כִּֽי הִמְר֥וּ אִמְרֵי אֵ֑ל וַ/עֲצַ֖ת עֶלְי֣וֹן נָאָֽצוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/107/011.yaml
  text: For they rebelled against the words of God and despised the counsel of the Most High[a].
translation:
  language: hi
  text: क्योंकि उन्होंने परमेश्वर के वचनों के विरुद्ध विद्रोह किया और परमप्रधान की सम्मति को तुच्छ जाना।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पद पिछली दशा या दण्ड का कारण बताता है; हिन्दी में ‘क्योंकि’ इस कारण-संबंध को स्वाभाविक और स्पष्ट रखता है।
- source_word: הִמְרוּ
  choice: के विरुद्ध विद्रोह किया
  rationale: मूल क्रिया מרה अवज्ञापूर्ण विरोध या विद्रोह व्यक्त करती है; यह अनुवाद उसकी सक्रिय और संबंधपरक तीव्रता बनाए रखता है।
- source_word: אִמְרֵי
  choice: वचनों
  rationale: אמרה का रचनात्मक बहुवचन यहाँ परमेश्वर की कही हुई बातों को सूचित करता है; ‘वचन’ गरिमापूर्ण होने के साथ सामान्य हिन्दी पाठक के लिए स्पष्ट है।
- source_word: אֵל
  choice: परमेश्वर
  rationale: यहाँ אֵל सामान्य ईश्वरीय पदवी है; ‘परमेश्वर’ आधुनिक हिन्दी बाइबलीय भाषा में स्वाभाविक है और अनावश्यक अतिरिक्त अर्थ नहीं जोड़ता।
- source_word: וַעֲצַת
  choice: और ... की सम्मति
  rationale: עֵצָה सलाह, सम्मति, योजना या उद्देश्य का अर्थ दे सकता है; ‘सम्मति’ ईश्वरीय सलाह और बुद्धिमान निर्देश का भाव रखते हुए अर्थ को किसी निश्चित योजना तक सीमित नहीं करती।
- source_word: עֶלְיוֹן
  choice: परमप्रधान
  rationale: यह עֶלְיוֹן की स्थापित और संक्षिप्त हिन्दी ईश्वरीय पदवी है तथा सर्वोच्चता का भाव सुरक्षित रखती है।
- source_word: נָאָצוּ
  choice: तुच्छ जाना
  rationale: נאץ तिरस्कार करने या अवमानना से ठुकराने का प्रबल भाव रखता है; ‘तुच्छ जाना’ इस भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: काव्यात्मक समानांतरता में אֵל और עֶלְיוֹן ईश्वरीय पदवियों का अनुवाद
  choice: परमेश्वर ... परमप्रधान
  alternative: सामर्थी ... सर्वोच्च
  rationale: दोनों अलग ईश्वरीय पदवियों को अलग रखते हुए यह अनुवाद समानांतरता और गरिमा बचाता है, पर मूल में निहित न होने वाली कोई अतिरिक्त धर्मवैज्ञानिक व्याख्या नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, स्पष्ट और काव्यात्मक गद्य; कारण-संबंध तथा दोनों समानांतर क्रियाओं की तीव्रता सुरक्षित रखी गई है।
