  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּמְעֲטוּ
  choice: घट गए
  rationale: מעט का काल-वाचक रूप संख्या या स्थिति में कम हो जाने को दर्शाता है। ‘घट गए’ संक्षिप्त और स्वाभाविक है तथा पद में आए उलटाव को बनाए रखता है।
- source_word: וַיָּשֹׁחוּ
  choice: दब गए
  rationale: שׁחח झुक जाने या नीचा किए जाने का भाव देता है। ‘दब गए’ यहाँ कष्ट के कारण दीन और पराजित दशा में पहुँचने का भाव सहज हिन्दी में व्यक्त करता है, बिना केवल शारीरिक मुद्रा तक अर्थ सीमित किए।
- source_word: מֵעֹצֶר
  choice: अत्याचार के कारण
  rationale: עֹצֶר बंधन, दमन या उत्पीड़नकारी दबाव का अर्थ दे सकता है, और מִן यहाँ कारण सूचित कर सकता है। ‘अत्याचार के कारण’ संदर्भ में इस पीड़ादायक दबाव को स्पष्ट करता है।
- source_word: רָעָה
  choice: विपत्ति
  rationale: यहाँ רָעָה नैतिक बुराई के बजाय संकट या दुर्दशा का बोध कराता है। ‘विपत्ति’ काव्यात्मक और सामान्य पाठकों के लिए स्पष्ट है।
- source_word: וְיָגוֹן
  choice: और शोक
  rationale: יָגוֹן दुःख या शोक को दर्शाता है। ‘शोक’ पद की भावनात्मक तीव्रता को गरिमापूर्ण ढंग से व्यक्त करता है।
