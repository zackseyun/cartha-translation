reference: Psalms 107:21
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: יוֹד֣וּ לַ/יהוָ֣ה חַסְדּ֑/וֹ וְ֝/נִפְלְאוֹתָ֗י/ו לִ/בְנֵ֥י אָדָֽם׃׆
base_translation:
  language: en
  yaml_path: translation/ot/psalms/107/021.yaml
  text: Let them give thanks to Yahweh for his steadfast love and for his wondrous deeds to the children of man[a][b].
translation:
  language: hi
  text: वे यहोवा का धन्यवाद करें—उसके अटल प्रेम के लिए और मनुष्यों के लिए किए गए उसके अद्भुत कामों के लिए।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יוֹדוּ
  choice: वे ... धन्यवाद करें
  rationale: ידה के हिफ़ील रूप का इस भजन में बार-बार आने वाले प्रत्युत्तर-सूत्र में अर्थ उद्धार के उत्तर में धन्यवाद देना है; यह हिन्दी में स्वाभाविक और संदर्भानुकूल है।
- source_word: לַיהוָה
  choice: यहोवा का
  rationale: ल उपसर्ग धन्यवाद के प्राप्तकर्ता को सूचित करता है। हिन्दी मुहावरे में 'यहोवा का धन्यवाद करें' स्वाभाविक है और יהוה के व्यक्तिगत नाम को प्रत्यक्ष रूप से सुरक्षित रखता है।
- source_word: חַסְדּוֹ
  choice: उसकी अटल करुणा
  rationale: חסד में स्थायी निष्ठा, प्रेमपूर्ण कृपा और करुणा का भाव है। 'अटल करुणा' इसकी दृढ़ता और कृपालुता दोनों को सामान्य आधुनिक हिन्दी में व्यक्त करती है।
- source_word: וְנִפְלְאוֹתָיו
  choice: और ... उसके अद्भुत कामों के लिए
  rationale: נפלאות ऐसे असाधारण कार्यों को दर्शाता है जो विस्मय उत्पन्न करते हैं। 'अद्भुत काम' अमूर्त 'आश्चर्यों' की अपेक्षा ठोस कार्यों को स्पष्ट करता है।
- source_word: לִבְנֵי אָדָם
  choice: मनुष्यों के लिए
  rationale: यह हिब्रानी मुहावरा सामान्य रूप से समस्त मानवजाति को दर्शाता है। हिन्दी में शाब्दिक 'आदम की संतानों' से अनचाहा वंशगत अर्थ उभर सकता है; 'मनुष्यों के लिए' उसके सामान्य और समावेशी आशय को स्वाभाविक रूप से देता है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ में चतुरक्षरीय व्यक्तिगत नाम प्रत्यक्ष है। हिन्दी बाइबलीय प्रयोग में व्यापक रूप से पहचाना जाने वाला 'यहोवा' नाम को किसी उपाधि में बदले बिना सुरक्षित रखता है।
- issue: חסד में निहित अर्थ-परास
  choice: अटल करुणा
  alternative: अटल प्रेम
  rationale: यहाँ शब्द परमेश्वर की स्थायी, कृपालु निष्ठा को दर्शाता है। 'अटल करुणा' प्रसंग में उसके बचाने वाले अनुग्रह को उभारती है, जबकि 'अटल प्रेम' भी वैध विकल्प है; पाठ किसी तकनीकी वाचा-सिद्धांत को जोड़ता नहीं है।
- issue: בני אדם की सामान्य मानवता-सूचक अभिव्यक्ति
  choice: मनुष्यों के लिए
  alternative: आदम की संतानों के लिए
  rationale: यह पदबंध व्याकरणतः पुल्लिंग हिब्रानी मुहावरा होते हुए भी मानवजाति के लिए सामान्य अभिव्यक्ति है। अर्थ-स्पष्ट हिन्दी चुनी गई है ताकि इसे केवल पुरुषों या आदम की जैविक वंशावली तक सीमित न समझा जाए।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामूहिक स्तुति के योग्य रखी गई है। डैश दो समानांतर कारणों—अटल करुणा और अद्भुत कामों—को स्पष्ट करता है।
