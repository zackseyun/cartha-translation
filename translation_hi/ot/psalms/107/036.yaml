  text: וַ/יּ֣וֹשֶׁב שָׁ֣ם רְעֵבִ֑ים וַ֝/יְכוֹנְנ֗וּ עִ֣יר מוֹשָֽׁב׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/107/036.yaml
  text: There he settled the hungry[a], and they established a city to live in.
translation:
  language: hi
  text: 'वहाँ उसने भूखे लोगों को बसाया,

    और उन्होंने रहने के लिए एक नगर स्थापित किया।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיּוֹשֶׁב
  choice: उसने ... बसाया
  rationale: हिफ़ील रूप का कारक अर्थ ‘बसाना’ स्वाभाविक और संक्षिप्त हिंदी में सुरक्षित रहता है। एकवचन कर्ता प्रसंगानुसार परमेश्वर है, पर मूल की तरह यहाँ उसका नाम स्पष्ट नहीं किया गया।
- source_word: שָׁם
  choice: वहाँ
  rationale: स्थानवाचक क्रियाविशेषण का सीधा और स्वाभाविक हिंदी रूप।
- source_word: רְעֵבִים
  choice: भूखों को
  rationale: विशेषण यहाँ संज्ञा के रूप में भूखे लोगों के सामूहिक समूह को दर्शाता है; ‘भूखों’ संक्षिप्त और सहज है।
- source_word: וַיְכוֹנְנוּ
  choice: उन्होंने ... बसाया
  rationale: नगर के संदर्भ में क्रिया का अर्थ स्थापित करना या दृढ़ रूप से बसाना है। हिंदी में ‘नगर बसाया’ अधिक स्वाभाविक है और बस्ती की स्थापना का भाव देता है।
- source_word: עִיר
  choice: एक नगर
  rationale: ‘नगर’ मूल शब्द का सामान्य और गरिमापूर्ण हिंदी समतुल्य है; अनिश्चितता को ‘एक’ से व्यक्त किया गया है।
- source_word: מוֹשָׁב
  choice: रहने के लिए
  rationale: यह शब्द निवास या बसने के स्थान का बोध कराता है। रचनात्मक संबंध עִיר מוֹשָׁב को उद्देश्यसूचक, स्वाभाविक हिंदी में व्यक्त किया गया है।
theological_decisions:
- issue: एकवचन क्रिया וַיּוֹשֶׁב का निहित कर्ता
  choice: आसपास के संदर्भ से परमेश्वर को निहित कर्ता मानते हुए ‘उसने’
  alternative: अनिर्दिष्ट कर्ता, जैसे ‘किसी ने’
  rationale: भजन के निकटवर्ती प्रसंग में कार्य करने वाला कर्ता यहोवा है। फिर भी मूल पद की सर्वनामात्मक शैली बनाए रखने के लिए यहाँ ‘परमेश्वर’ या ‘यहोवा’ नाम स्पष्ट रूप से नहीं जोड़ा गया।
translation_notes:
  register: 'आधुनिक मानक हिंदी, सहज किंतु गरिमापूर्ण। ‘बसाया’ की पुनरावृत्ति मूल की दो अलग क्रियाओं को हिंदी में स्वाभाविक ढंग से व्यक्त करती है: पहले लोगों को बसाना, फिर नगर स्थापित करना।'
