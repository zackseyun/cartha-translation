base_translation:
  language: en
  yaml_path: translation/ot/psalms/107/014.yaml
  text: He brought them out from darkness and the shadow of death[b][a], and he tore apart their bonds.
translation:
  language: hi
  text: उसने उन्हें अन्धकार और मृत्यु की छाया[a] से बाहर निकाला, और उनके बन्धनों को तोड़ डाला।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “घोर अन्धकार।” इब्रानी शब्द का अर्थ “मृत्यु की छाया” या “घोर अन्धकार,” दोनों हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: יוֹצִיאֵם
  choice: उसने उन्हें ... बाहर निकाला
  rationale: יצא के हिफ़ील रूप का अर्थ किसी को बाहर निकालना है। भजन के इस प्रसंग में परमेश्वर के किए हुए उद्धार का वर्णन है, इसलिए हिन्दी में भूतकाल स्वाभाविक है।
- source_word: מֵחֹשֶׁךְ
  choice: अन्धकार ... से
  rationale: חֹשֶׁךְ अन्धकार का सामान्य शब्द है; מִן को ‘से’ द्वारा व्यक्त किया गया है।
- source_word: וְצַלְמָוֶת
  choice: और मृत्यु की छाया
  rationale: צַלְמָוֶת का अर्थ ‘मृत्यु की छाया’ अथवा ‘घोर अन्धकार’ हो सकता है। मुख्य पाठ में पारम्परिक और शब्दार्थ की दृष्टि से सम्भव अभिव्यक्ति रखी गई है, और दूसरा अर्थ पादटिप्पणी में दिया गया है।
- source_word: וּמוֹסְרוֹתֵיהֶם
  choice: उनके बन्धनों को
  rationale: מוֹסְרוֹת का आशय बाँधने वाले बन्धनों, बेड़ियों या जकड़नों से है। ‘बन्धन’ हिन्दी में व्यापक और स्वाभाविक है तथा נתק के साथ सुगठित बैठता है।
- source_word: יְנַתֵּק
  choice: तोड़ डाला
  rationale: נתק का पिएल रूप बलपूर्वक अलग करने, तोड़ने या उखाड़ने का भाव देता है। ‘तोड़ डाला’ उस प्रबल और पूर्ण मुक्ति को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: צַלְמָוֶת का अर्थ
  choice: मृत्यु की छाया
  alternative: घोर अन्धकार
  rationale: इब्रानी शब्द में दोनों अर्थ सम्भव हैं। मुख्य पाठ पारम्परिक मृत्यु-संकट की छवि को बनाए रखता है, जबकि पादटिप्पणी वास्तविक शाब्दिक विकल्प सुरक्षित रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण शैली अपनाई गई है। ‘बन्धनों को तोड़ डाला’ कारागार और मुक्ति की छवि को स्पष्ट रखते हुए शब्दशः कठोरता से बचाता है।
