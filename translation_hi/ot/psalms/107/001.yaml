  text: Give thanks to Yahweh[a], for he is good[b], for his steadfast love endures forever.
translation:
  language: hi
  text: याहवे का धन्यवाद करो, क्योंकि वह भला है, क्योंकि उसका अटल प्रेम[a] सदा बना रहता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘अटल प्रेम’ का अनुवाद ‘वाचा के प्रति निष्ठावान प्रेम’ भी किया जा सकता है। इब्रानी חֶסֶד में प्रेम, दया और संबंध के प्रति अडिग निष्ठा के भाव शामिल हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: הֹדוּ
  choice: धन्यवाद करो
  rationale: ידה का हिफ़ील बहुवचन आज्ञार्थक रूप भजन-संदर्भ में धन्यवाद देने या कृतज्ञतापूर्वक स्तुति करने का आह्वान है; ‘धन्यवाद करो’ इसका स्वाभाविक और सीधा हिन्दी रूप है।
- source_word: לַיהוָה
  choice: याहवे का
  rationale: ל यहाँ उस व्यक्ति को चिह्नित करता है जिसकी ओर धन्यवाद निर्देशित है। हिन्दी में ‘याहवे का धन्यवाद करो’ स्वाभाविक है और יהוה के व्यक्तिगत नाम को बनाए रखता है।
- source_word: כִּי
  choice: क्योंकि
  rationale: दोनों बार כִּי आह्वान का आधार बताता है; ‘क्योंकि’ कारण-संबंध को स्पष्ट रूप से सुरक्षित रखता है।
- source_word: טוֹב
  choice: भला
  rationale: טוֹב परमेश्वर की व्यापक नैतिक और उपकारी अच्छाई को व्यक्त करता है; ‘भला’ गरिमापूर्ण, परिचित और अर्थ की व्यापकता बनाए रखने वाला शब्द है।
- source_word: לְעוֹלָם
  choice: सदा बनी रहती है
  rationale: शाब्दिक अर्थ ‘सदा के लिए’ है। חֶסֶד के साथ हिन्दी में ‘सदा बनी रहती है’ स्थायित्व का भाव स्वाभाविक ढंग से व्यक्त करता है।
- source_word: חַסְדּוֹ
  choice: उसकी अटल करुणा
  rationale: חֶסֶד में प्रेम, दया और निष्ठावान संबंधपरक प्रतिबद्धता साथ-साथ निहित हैं। ‘अटल करुणा’ उसकी स्थिरता और कृपालुता दोनों को संक्षेप में व्यक्त करती है; वैकल्पिक वाचा-संबंधी अर्थ पादटिप्पणी में रखा गया है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में व्यक्तिगत वाचा-नाम יהוה स्पष्ट रूप से है। ‘याहवे’ उसका प्रचलित विद्वत्तापूर्ण लिप्यंतरण है और नाम को सामान्य उपाधि में नहीं बदलता।
- issue: חֶסֶד का अर्थ
  choice: अटल करुणा
  alternative: वाचा की निष्ठा; अटल प्रेम; दया
  rationale: यह चुनाव करुणामय प्रेम और टिकाऊ निष्ठा को साथ रखता है, पर शब्द को केवल भावनात्मक प्रेम, केवल कानूनी वाचा-निष्ठा या केवल दया तक सीमित नहीं करता। पादटिप्पणी इसकी अर्थ-समृद्धि बताती है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और सामूहिक उपासना के योग्य शैली। इब्रानी के दोहरे कारणसूचक כִּי को दोनों बार ‘क्योंकि’ कहकर संरचना बनाए रखी गई है।
