base_translation:
  language: en
  yaml_path: translation/ot/psalms/107/038.yaml
  text: He blessed them[a], and they multiplied greatly; and he did not let their livestock decrease.
translation:
  language: hi
  text: उसने उन्हें आशीष दी, और उनकी संख्या बहुत बढ़ गई; उसने उनके पशुधन को घटने नहीं दिया।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उनका पशुधन नहीं घटा।” इब्रानी में क्रिया एकवचन है; इसका कर्ता परमेश्वर ही बना रहता है—“उसने ... घटने नहीं दिया”—ऐसा समझा जा सकता है, अथवा इसे परिणाम के रूप में “पशुधन नहीं घटा” समझा जा सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְבָרֲכֵם
  choice: उसने उन्हें आशीष दी
  rationale: पिएल रूप और तृतीय पुरुष बहुवचन कर्म-प्रत्यय को स्पष्ट करता है; एकवचन कर्ता भजन के प्रसंग में परमेश्वर है।
- source_word: וַיִּרְבּוּ מְאֹד
  choice: वे बहुत बढ़ गए
  rationale: רבה का अकर्मक बहुवचन रूप संख्यात्मक वृद्धि बताता है, और מְאֹד उसकी तीव्रता व्यक्त करता है। यह आधुनिक हिन्दी में स्वाभाविक है और मनुष्यों की संख्या बढ़ने का भाव बनाए रखता है।
- source_word: וּבְהֶמְתָּם
  choice: उनके पशुधन को
  rationale: בְּהֵמָה यहाँ सामूहिक रूप से पाले जाने वाले पशुओं के लिए है; ‘पशुधन’ ‘मवेशी’ से अधिक व्यापक और प्रसंगानुकूल है।
- source_word: לֹא יַמְעִיט
  choice: उसने ... घटने नहीं दिया
  rationale: מעט का हिफ़ील एकवचन रूप घटाने या कम होने देने का कारणात्मक भाव रखता है। यह अनुवाद परमेश्वर को जारी कर्ता मानते हुए उस भाव को सहज हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: अंतिम उपवाक्य का कर्ता
  choice: 'परमेश्वर ही कर्ता बना रहता है: ‘उसने उनके पशुधन को घटने नहीं दिया।’'
  alternative: ‘उनका पशुधन नहीं घटा।’
  rationale: इब्रानी क्रिया एकवचन है और पूर्ववर्ती एकवचन दिव्य कर्ता को आगे जारी रख सकती है। फिर भी वाक्य को परिणाम के रूप में समझना भी व्याकरणतः संभव है; इसलिए वैकल्पिक समझ पादटिप्पणी में दी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण और सामान्य पाठकों के लिए स्पष्ट रूप। ‘आशीष’ बाइबलीय प्रयोग में परिचित है; ‘पशुधन’ मूल के सामूहिक अर्थ को सटीक रूप से व्यक्त करता है।
