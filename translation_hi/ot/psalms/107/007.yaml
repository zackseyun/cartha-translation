  register: आधुनिक मानक हिन्दी; भाषा सरल, गरिमापूर्ण और काव्यात्मक रूप से संक्षिप्त रखी गई है। कर्ता के लिए ‘वह’ रखा गया है, क्योंकि इस पद में हिब्रू क्रिया स्वयं ईश्वर का नाम नहीं दोहराती; संदर्भ से कर्ता स्पष्ट है।
