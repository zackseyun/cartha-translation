translation:
  language: hi
  text: वह उन्हें सीधे मार्ग से ले चला, ताकि वे ऐसे नगर तक पहुँचें जहाँ वे बस सकें।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּדְרִיכֵם
  choice: वह उन्हें ... ले चला
  rationale: हिफ़ील रूप मार्ग पर अगुवाई करने का कारक भाव व्यक्त करता है। ‘ले चला’ स्वाभाविक हिन्दी में निरंतर मार्गदर्शन को दर्शाता है।
- source_word: בְּדֶרֶךְ יְשָׁרָה
  choice: सीधे मार्ग से
  rationale: דֶּרֶךְ मार्ग/रास्ता है और יְשָׁרָה यहाँ यात्रा के संदर्भ में सीधा या सही दिशा वाला मार्ग बताता है। ‘सीधे मार्ग से’ ठोस यात्रा-चित्र बनाए रखता है।
- source_word: לָלֶכֶת אֶל
  choice: ताकि वे ... पहुँचें
  rationale: शाब्दिक अर्थ ‘जाने के लिए’ है; गंतव्य तक मार्गदर्शन के इस संदर्भ में ‘ताकि ... पहुँचें’ उद्देश्य को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: עִיר מוֹשָׁב
  choice: उस नगर में ... जहाँ वे बस सकें
  rationale: रचना का अधिक शाब्दिक अर्थ ‘बसने का नगर’ या ‘निवास का नगर’ है। संदर्भ में आशय ऐसा नगर है जहाँ भटके हुए लोग स्थायी निवास पा सकें; हिन्दी वाक्य में ‘जहाँ वे बस सकें’ यही अर्थ स्पष्ट और सहज रूप से देता है।
theological_decisions: []
