translation:
  language: hi
  text: उनका जी हर प्रकार के भोजन से घृणा करता था,[a] और वे मृत्यु के फाटकों के निकट जा पहुँचे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में “उनका नेफ़ेश” (נַפְשָׁם) है। इस शब्द का अर्थ व्यक्ति का भीतरी स्व, जीवन या, इस संदर्भ में, भूख/रुचि हो सकता है; अर्थात, “उन्हें हर प्रकार के भोजन से घृणा थी” भी कहा जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל אֹכֶל
  choice: हर प्रकार का भोजन
  rationale: כָּל के साथ אֹכֶל का अर्थ समस्त भोजन या हर प्रकार का भोजन है। यह हिंदी में स्वाभाविक रहते हुए व्यापकता को बनाए रखता है।
- source_word: תְּתַעֵב
  choice: घृणा करता था
  rationale: תעב का पिएल रूप तीव्र अरुचि और विकर्षण व्यक्त करता है। 'घृणा करता था' आधुनिक हिंदी में इसकी प्रबलता को स्पष्ट रूप से व्यक्त करता है।
- source_word: נַפְשָׁם
  choice: उनका मन
  rationale: נֶפֶשׁ यहाँ व्यक्ति के भीतरी अस्तित्व, स्वयं, जीवन अथवा भूख की ओर संकेत कर सकता है। 'मन' हिंदी में भोजन के प्रति भीतरी विकर्षण को स्वाभाविक ढंग से व्यक्त करता है, जबकि पादटिप्पणी मूल की अर्थ-व्याप्ति सुरक्षित रखती है।
- source_word: וַיַּגִּיעוּ עַד
  choice: वे ... के निकट जा पहुँचे
  rationale: इस प्रसंग में נגע का हिफ़ील और עַד मृत्यु की सीमा तक पहुँचने, अर्थात आसन्न मृत्यु, का भाव देते हैं। 'निकट जा पहुँचे' आगमन और निकटता दोनों को व्यक्त करता है।
- source_word: שַׁעֲרֵי מָוֶת
  choice: मृत्यु के फाटक
  rationale: यह इब्रानी रूपक का सीधा और स्पष्ट अनुवाद है, जो मृत्यु की दहलीज़ का बिंब बनाए रखता है; यहाँ 'अधोलोक' कहना मूल में अनुपस्थित संज्ञा जोड़ देता।
theological_decisions:
- issue: गंभीर बीमारी के संदर्भ में נֶפֶשׁ का अर्थ
  choice: उनका मन
  alternative: उनकी भूख; उनका प्राण; वे स्वयं
  rationale: पद शारीरिक दुर्बलता का वर्णन करता है, पर मूल में साधारण सर्वनाम के स्थान पर נֶפֶשׁ है। 'मन' व्यक्ति की भीतरी अवस्था को बनाए रखता है और इसे केवल जैविक भूख तक सीमित नहीं करता; पादटिप्पणी संभावित अर्थों को स्पष्ट करती है।
- issue: שַׁעֲרֵי מָוֶת के रूपक की व्याख्या
  choice: मृत्यु के फाटक
  alternative: मृत्यु की दहलीज़; अधोलोक के फाटक
  rationale: मूल रूपक को बिना धर्मवैचारिक विस्तार के ज्यों का त्यों रखा गया है। 'अधोलोक' मूल पद में नहीं है, जबकि 'दहलीज़' रूपक को समझाता पर बदल देता।
translation_notes:
  register: आधुनिक मानक हिंदी में काव्यात्मक गरिमा बनाए रखी गई है। 'मृत्यु के फाटक' मूल बिंब को सुरक्षित रखता है, और 'निकट जा पहुँचे' आसन्न मृत्यु का स्वाभाविक हिंदी भाव देता है।
