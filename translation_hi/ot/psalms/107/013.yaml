source:
  edition: WLC
  text: וַ/יִּזְעֲק֣וּ אֶל יְ֭הוָה בַּ/צַּ֣ר לָ/הֶ֑ם מִ֝/מְּצֻֽקוֹתֵי/הֶ֗ם יוֹשִׁיעֵֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/107/013.yaml
  text: Then they cried out to Yahweh in their trouble[a]; he saved them from their distresses.
translation:
  language: hi
  text: तब उन्होंने अपनी मुसीबत में याहवे की दुहाई दी, और उसने उन्हें उनके संकटों[a] से बचाया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उनकी तंगियों” अथवा “उनकी विपत्तियों।”
    reason: हिब्रू מְצוּקוֹת ऐसी विकट दशाओं का बोध करा सकता है जिनमें व्यक्ति स्वयं को घिरा या दबा हुआ पाता है; इसके लिए कई निकटार्थी हिन्दी विकल्प संभव हैं।
lexical_decisions:
- source_word: וַיִּזְעֲקוּ
  choice: तब उन्होंने…दुहाई दी
  rationale: वाव-क्रम कथा को आगे बढ़ाता है, और זעק सहायता के लिए व्याकुल पुकार को व्यक्त करता है। ‘दुहाई दी’ उसकी तीव्रता और सहायता की याचना—दोनों को स्वाभाविक हिन्दी में रखता है।
- source_word: אֶל
  choice: याहवे की दुहाई दी
  rationale: אֶל पुकार की दिशा बताता है। हिन्दी मुहावरे में ‘की दुहाई दी’ उसी संबंध को स्वाभाविक रूप से व्यक्त करता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: मूल पाठ में परमेश्वर का व्यक्तिगत नाम יהוה है; इसलिए किसी उपाधि से बदलने के बजाय उसका प्रचलित हिन्दी लिप्यंतरण रखा गया है।
- source_word: בַּצַּר לָהֶם
  choice: अपनी मुसीबत में
  rationale: צַר यहाँ सामूहिक रूप से संकट या मुसीबत की दशा को दर्शाता है। ‘अपनी मुसीबत में’ सहज हिन्दी है और एकवचन भाव को बनाए रखता है।
- source_word: מִמְּצֻקוֹתֵיהֶם
  choice: उनके संकटों से
  rationale: מְצוּקוֹת संकुचित या घिरी हुई दशाओं से उत्पन्न अनेक विपत्तियों या संकटों को दर्शाता है। बहुवचन ‘संकटों’ मूल रूप का सम्मान करता है।
- source_word: יוֹשִׁיעֵם
  choice: उसने उन्हें…बचाया
  rationale: ישׁע का हिफ़ईल रूप बचाने या छुड़ाने का अर्थ देता है। प्रसंग में ‘बचाया’ सीधा, स्पष्ट और स्वाभाविक है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: पद में चार-अक्षरी व्यक्तिगत नाम सीधे उपस्थित है। ‘याहवे’ नाम को उपाधि में बदले बिना सुरक्षित रखता है और किसी संप्रदायगत व्याख्या को नहीं जोड़ता।
- issue: יוֹשִׁיעֵם के काल-पक्ष का हिन्दी रूप
  choice: उसने उन्हें बचाया
  alternative: वह उन्हें बचाता है
  rationale: हिब्रू रूप अपूर्ण क्रिया है, पर इस स्तोत्र के आवर्ती कथात्मक ढाँचे में पूर्ववर्ती पुकार के उत्तरस्वरूप पूर्ण बचाव का वर्णन करता है। हिन्दी में भूतकाल प्रसंगगत क्रम को सबसे स्वाभाविक रूप से व्यक्त करता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘दुहाई दी’ सहायता के लिए तीव्र पुकार को सामान्य पाठक के लिए स्पष्ट करती है; ‘संकटों’ बहुवचन और मूल की व्यापक अर्थ-छाया को बनाए रखता है।
