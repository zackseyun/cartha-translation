translation:
  language: hi
  text: 'वे भूखे और प्यासे थे;

    उनका प्राण उनके भीतर क्षीण हो रहा था।[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उनका जीवन उनके भीतर क्षीण हो रहा था” अथवा “वे भीतर ही भीतर निढाल हो रहे थे”; इब्रानी शब्द नेफ़ेश का अर्थ प्राण, जीवन, या स्वयं व्यक्ति हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: רְעֵבִים
  choice: भूखे
  rationale: यह विशेषण सामान्य रूप से भूख की दशा बताता है; ‘भूखे’ स्वाभाविक है और मूल से अधिक तीव्र अर्थ नहीं जोड़ता।
- source_word: גַּם
  choice: और
  rationale: यहाँ यह भूख के साथ प्यास की अतिरिक्त दशा जोड़ता है। हिंदी में ‘भूखे और प्यासे’ इस संयोजन को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: צְמֵאִים
  choice: प्यासे
  rationale: यह प्यास की दशा के लिए सीधा और प्रचलित हिंदी शब्द है।
- source_word: נַפְשָׁם
  choice: उनका प्राण
  rationale: נֶפֶשׁ यहाँ प्राण, जीवन या स्वयं व्यक्ति के भीतरी अस्तित्व का बोध करा सकता है। ‘प्राण’ मूल की मानवशास्त्रीय छवि को बनाए रखते हुए हिंदी में बोधगम्य है।
- source_word: בָּהֶם
  choice: उनके भीतर
  rationale: सर्वनामयुक्त पूर्वसर्ग यहाँ आंतरिक स्थान को दर्शाता है—उनकी जीवन-शक्ति उनके भीतर क्षीण हो रही थी।
- source_word: תִּתְעַטָּף
  choice: मूर्छित हो रहा था
  rationale: यह क्रिया ढक जाने, निढाल होने या चेतना/शक्ति क्षीण पड़ने का भाव रखती है। अपूर्ण रूप चलती हुई या घटती दशा को व्यक्त कर सकता है; ‘मूर्छित हो रहा था’ उस भाव को सुरक्षित रखता है।
theological_decisions:
- issue: נֶפֶשׁ का अर्थ-क्षेत्र
  choice: उनका प्राण
  alternative: उनका जीवन; वे स्वयं
  rationale: किसी एक व्यवस्थित मानवशास्त्रीय अर्थ को थोपे बिना मूल की ‘प्राण/जीवन/स्व’ संबंधी अर्थगत व्यापकता को मुख्य पाठ और पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिंदी में काव्यात्मक परंतु सहज शैली। ‘प्राण’ गरिमामय और परिचित है; पादटिप्पणी मूल की वास्तविक अर्थगत व्यापकता स्पष्ट करती है। ‘גם’ के लिए अलग पादटिप्पणी आवश्यक नहीं मानी गई, क्योंकि हिंदी का स्वाभाविक ‘और’ यहाँ उसके योगात्मक अर्थ को पर्याप्त रूप से व्यक्त करता है।
