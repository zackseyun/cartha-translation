  yaml_path: translation/ot/psalms/107/040.yaml
  text: He pours contempt on nobles and makes them wander in a trackless waste[a][b].
translation:
  language: hi
  text: वह कुलीनों पर तिरस्कार उंडेलता है[a] और उन्हें ऐसे उजाड़ में भटकाता है जहाँ कोई रास्ता नहीं[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “हाकिमों” अथवा “राजकुमारों पर।” इब्रानी शब्द ऊँचे पद, कुलीनता या नेतृत्व वाले लोगों को सूचित कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “उजाड़ में—कोई रास्ता नहीं”; अर्थात ऐसे निर्जन स्थान में जहाँ कोई पथ न हो।
    reason: lexical_alternative
lexical_decisions:
- source_word: שֹׁפֵךְ
  choice: उंडेलता है
  rationale: यह कृदंत सामान्य या निरंतर ईश्वरीय कार्य को वर्तमान काल में व्यक्त करता है। ‘उंडेलता है’ मूल के सजीव रूपक को बनाए रखता है।
- source_word: בּוּז
  choice: तिरस्कार
  rationale: यह शब्द अवमानना और सार्वजनिक अपमान का भाव देता है; ‘तिरस्कार’ आधुनिक मानक हिन्दी में स्वाभाविक और गरिमापूर्ण है।
- source_word: נְדִיבִים
  choice: प्रतिष्ठित अगुओं
  rationale: संदर्भ में यह उदार लोगों के बजाय ऊँचे पद या सामाजिक प्रतिष्ठा वाले शासकीय अगुओं को सूचित करता है। यह चयन किसी विशिष्ट राजकीय पद को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: וַיַּתְעֵם
  choice: उन्हें ... भटकाता है
  rationale: हिफ़ील रूप कारणवाचक है—उन्हें भटकने को विवश करना। यहाँ उजाड़ और रास्ते की छवि के कारण भौतिक भटकाव प्रमुख है।
- source_word: בְּתֹהוּ
  choice: उजाड़ में
  rationale: תֹהוּ यहाँ निर्जनता, रिक्तता या अव्यवस्थित वीराने का बोध देता है। ‘उजाड़’ हिन्दी में स्थानगत छवि को स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
- source_word: לֹא דָרֶךְ
  choice: जहाँ कोई रास्ता नहीं
  rationale: यह मूल अभिव्यक्ति ‘कोई मार्ग नहीं’ को लगभग प्रत्यक्ष रूप से रखता है और हिन्दी में किसी पथ-विहीन स्थान की स्वाभाविक तस्वीर प्रस्तुत करता है।
theological_decisions:
- issue: अव्यक्त कर्ता
  choice: ‘वह’ से परमेश्वर को संदर्भित किया गया है।
  alternative: अनिश्चित या सामान्य कर्ता
  rationale: आस-पास का साहित्यिक संदर्भ इन उलटफेरों का कर्ता यहोवा को बताता है। हिन्दी में कर्ता स्पष्ट करना स्वाभाविक है, पर पद में परमेश्वर का नाम जोड़ना आवश्यक नहीं।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, काव्यात्मक और गरिमापूर्ण रूप अपनाया गया है। ‘उंडेलता है’ मूल रूपक को बनाए रखता है, जबकि ‘जहाँ कोई रास्ता नहीं’ इब्रानी की संक्षिप्त अभिव्यक्ति को स्वाभाविक हिन्दी में खोलता है।
