  text: Let them offer sacrifices of thanksgiving[b][a], and recount his works with joyful singing.
translation:
  language: hi
  text: वे धन्यवाद के बलिदान चढ़ाएँ[a] और आनन्द के गीत गाते हुए उसके कामों का वर्णन करें।[b]
  philosophy: optimal-equivalence
  footnotes:
