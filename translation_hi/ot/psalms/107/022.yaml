  source_fidelity: 'The Hindi accurately reflects the Hebrew exhortative imperfects: “वे … चढ़ाएँ” and “वर्णन करें” properly convey the psalmic wish/exhortation. “धन्यवाद के बलिदान” represents זִבְחֵי תוֹדָה, “उसके कामों” represents מַעֲשָׂיו, and “आनन्द के गीत गाते हुए” naturally conveys the joyful, potentially sung/acclaimed force of בְּרִנָּה without over-specifying it as only singing.'
