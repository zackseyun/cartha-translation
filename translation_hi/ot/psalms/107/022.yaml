  - marker: b
    text: या, “जयजयकार के साथ उसके कामों का बखान करें।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיִזְבְּחוּ
  choice: वे ... चढ़ाएँ
  rationale: यहाँ अपूर्ण क्रिया का भाव आह्वान या इच्छा का है। ‘चढ़ाएँ’ हिन्दी में बलिदान अर्पित करने का स्वाभाविक और उपासना-संबंधी अर्थ स्पष्ट करता है।
- source_word: זִבְחֵי תוֹדָה
  choice: धन्यवाद के बलिदान
  rationale: यह संबंध-वाचक पद ऐसे बलिदानों को दर्शाता है जो परमेश्वर के प्रति धन्यवाद व्यक्त करते हैं। यह अनुवाद मूल के निकट और सामान्य पाठक के लिए स्पष्ट है।
- source_word: וִיסַפְּרוּ
  choice: वर्णन करें
  rationale: पिएल रूप यहाँ परमेश्वर के कार्यों को विस्तार से सुनाने या बयान करने का अर्थ देता है; ‘वर्णन करें’ इस अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: מַעֲשָׂיו
  choice: उसके कामों
  rationale: यह शब्द परमेश्वर द्वारा किए गए कार्यों को दर्शाता है। ‘कामों’ सरल, व्यापक और काव्यात्मक सन्दर्भ में स्वाभाविक है।
- source_word: בְּרִנָּה
  choice: आनन्द के गीत गाते हुए
  rationale: यह पद हर्ष से भरी ऊँची पुकार या गायन को व्यक्त कर सकता है। मुख्य पाठ में आनन्द और सम्भावित गीतात्मक अभिव्यक्ति दोनों को रखा गया है, जबकि वैकल्पिक अर्थ पादटिप्पणी में दिया गया है।
