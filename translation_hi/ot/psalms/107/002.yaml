lexical_decisions:
- source_word: יֹאמְרוּ
  choice: कहें
  rationale: इस स्तोत्रीय आह्वान में अपूर्ण क्रिया का भाव इच्छार्थक/प्रेरणार्थक है; ‘कहें’ इसे स्वाभाविक और संक्षिप्त हिन्दी में व्यक्त करता है।
- source_word: גְּאוּלֵי ... גְּאָלָם
  choice: छुड़ाए हुए ... छुड़ाया है
  rationale: दोनों रूपों में एक ही मूल גאל है। ‘छुड़ाए हुए’ और ‘छुड़ाया है’ मूल की पुनरावृत्ति बनाए रखते हैं और दैवी उद्धार को सामान्य आधुनिक हिन्दी में स्पष्ट करते हैं।
- source_word: יְהוָה
  choice: याहवे
  rationale: मूल में परमेश्वर का व्यक्तिगत नाम है; उसे किसी उपाधि से बदलने के बजाय देवनागरी में लिप्यंतरित किया गया है।
- source_word: מִיַּד
  choice: के हाथ से
  rationale: यह किसी की शक्ति या वश से मुक्ति का इब्रानी मुहावरा है। हिन्दी में ‘के हाथ से’ मूल रूपक को सहज रूप से बनाए रखता है।
- source_word: צָר
  choice: शत्रु
  rationale: यहाँ संज्ञा किसी विरोधी, बैरी या उत्पीड़क व्यक्ति/शक्ति को सूचित करती है। ‘शत्रु’ काव्यात्मक गरिमा और सामूहिक एकवचन दोनों के अनुकूल है।
theological_decisions:
- issue: परमेश्वर के नाम יהוה का अनुवाद
  choice: याहवे
  alternative: यहोवा / प्रभु
  rationale: मूल पाठ में चतुरक्षरी व्यक्तिगत नाम सीधे प्रयुक्त है; ‘याहवे’ उसे उपाधि में बदले बिना सुरक्षित रखता है।
- issue: גאל की उद्धार-संबंधी भाषा
  choice: छुड़ाए हुए ... छुड़ाया है
  alternative: छुड़ौती पाए हुए ... छुड़ौती देकर छुड़ाया है
  rationale: संदर्भ में बल शत्रु के वश से दैवी छुटकारे पर है। ‘छुड़ाया’ व्यापक अर्थ को बनाए रखता है और किसी विशिष्ट लेन-देन की धारणा अनावश्यक रूप से नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, काव्यात्मक और गरिमापूर्ण शैली रखी गई है। डैश मुख्य आह्वान और उसके बाद आने वाले संबंधवाचक स्पष्टीकरण को स्पष्ट करता है।
