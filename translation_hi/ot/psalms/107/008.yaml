review_pass:
  verdict: revise
  source_fidelity: The imperative/jussive sense of יוֹדוּ is conveyed accurately by “धन्यवाद करें,” and “यहोवा” preserves the divine name. The draft correctly understands לִבְנֵי אָדָם as referring generally to human beings and appropriately connects the wondrous deeds with their beneficiaries. However, “करुणा” alone narrows חֶסֶד toward compassion/mercy and does not adequately represent its central sense of faithful, steadfast love.
  naturalness: The Hindi is generally clear and suitably elevated. Reordering the parallel objects before the final verb gives a more balanced, natural poetic sentence.
  terminology: Replace “अटल करुणा” with “अटल प्रेम” to represent חֶסֶד more directly without importing a technical covenantal interpretation. “अद्भुत काम” is natural and retains the active force of the Hebrew plural.
  issues:
  - severity: medium
    issue: “अटल करुणा” is too narrow for חַסְדּוֹ.
    rationale: חֶסֶד includes kindness and mercy but, in this refrain, principally denotes Yahweh’s steadfast/faithful love. “करुणा” can suggest pity or compassion without conveying love and loyalty.
