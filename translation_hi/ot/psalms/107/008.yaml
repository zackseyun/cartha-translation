id: PSA.107.8
reference: Psalms 107:8
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: יוֹד֣וּ לַ/יהוָ֣ה חַסְדּ֑/וֹ וְ֝/נִפְלְאוֹתָ֗י/ו לִ/בְנֵ֥י אָדָֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/107/008.yaml
  text: Let them give thanks to Yahweh for his steadfast love[a], and for his wondrous deeds to the children of man.
translation:
  language: hi
  text: वे यहोवा का उसके अटल प्रेम के लिए और मनुष्यों के लिए किए गए उसके अद्भुत कामों के लिए धन्यवाद करें।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יוֹדוּ
  choice: धन्यवाद करें
  rationale: हिफ़ील रूप यहाँ भजन के दोहराए जाने वाले आह्वान में कृतज्ञतापूर्वक धन्यवाद देने का अर्थ रखता है।
- source_word: לַיהוָה
  choice: यहोवा का
  rationale: हिन्दी में ‘धन्यवाद करना’ के साथ संबंधसूचक ‘का’ स्वाभाविक है; יהוה को उसके व्यक्तिगत वाचा-नाम ‘यहोवा’ से व्यक्त किया गया है।
- source_word: חַסְדּוֹ
  choice: उसकी अटल करुणा
  rationale: חֶסֶד में स्थायी निष्ठा, कृपा और करुणा का संयुक्त भाव है; ‘अटल करुणा’ इसे सहज और गरिमापूर्ण हिन्दी में व्यक्त करती है।
- source_word: וְנִפְלְאוֹתָיו
  choice: उसके अद्भुत कामों
  rationale: बहुवचन संज्ञा परमेश्वर के असाधारण और विस्मयकारी कार्यों को सूचित करती है; ‘कामों’ से क्रियात्मक भाव बना रहता है।
- source_word: לִבְנֵי אָדָם
  choice: मनुष्यों के लिए
  rationale: यह सामान्य इब्रानी मुहावरा समस्त मानवजाति को दर्शाता है। शाब्दिक ‘मनुष्य की संतानों’ की अपेक्षा ‘मनुष्यों’ आधुनिक हिन्दी में अधिक स्वाभाविक है और सामूहिक अर्थ सुरक्षित रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ के व्यक्तिगत वाचा-नाम को ‘प्रभु’ जैसी उपाधि से नहीं बदला गया; हिन्दी बाइबलीय परंपरा में व्यापक रूप से पहचाना जाने वाला रूप ‘यहोवा’ चुना गया।
- issue: חֶסֶד का अर्थ-क्षेत्र
  choice: अटल करुणा
  alternative: वाचा की निष्ठावान प्रीति
  rationale: मुख्य पाठ में किसी एक तकनीकी धर्मवैज्ञानिक व्याख्या को थोपे बिना स्थायित्व और कृपालु प्रेम दोनों को बनाए रखा गया।
- issue: בני אדם का सामूहिक मानवीय संदर्भ
  choice: मनुष्यों
  alternative: मनुष्य की संतानों
  rationale: मुहावरे का आशय सामान्य रूप से मानवजाति है; स्वाभाविक हिन्दी को प्राथमिकता देते हुए अर्थ को न तो पुरुषों तक सीमित किया गया, न किसी विशेष समूह तक।
translation_notes:
  register: आधुनिक मानक हिन्दी; काव्यात्मक समानांतरता को डैश और दो समांतर ‘के लिए’ पदबंधों से स्पष्ट रखा गया है। भाषा गरिमापूर्ण पर सामान्य पाठक के लिए सहज है।
