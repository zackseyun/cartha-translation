  text: For he shattered the doors of bronze and cut through the bars of iron[a].
translation:
  language: hi
  text: क्योंकि उसने काँसे के द्वार चकनाचूर कर दिए और लोहे की अर्गलाएँ काट डालीं[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
