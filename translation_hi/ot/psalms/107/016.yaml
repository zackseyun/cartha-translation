    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले पद में धन्यवाद देने के आह्वान का कारण बताता है; ‘क्योंकि’ हिब्रू के व्याख्यात्मक संबंध को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: שִׁבַּר
  choice: चकनाचूर कर दिए
  rationale: क्रिया बलपूर्वक और निर्णायक रूप से तोड़ने का भाव देती है; यह चयन उस तीव्रता को व्यक्त करता है।
- source_word: דַּלְתוֹת
  choice: द्वार
  rationale: संज्ञा का मूल अर्थ दरवाज़े या द्वार-पल्ले है; किलेबंद फाटकों का संदर्भ संभव है, पर मुख्य पाठ में अधिक सीधा शब्द रखा गया है।
- source_word: נְחֹשֶׁת
  choice: काँसे
  rationale: इस प्रसंग में यह ताँबे की मिश्रधातु, अर्थात काँसा, सूचित करता है; आधुनिक हिन्दी में ‘काँसा’ ऐतिहासिक और धात्विक रूप से उपयुक्त है।
- source_word: בְרִיחֵי
  choice: अर्गलाएँ
  rationale: यह द्वारों को बंद रखने वाली मजबूत आड़ी छड़ों या सिटकनियों को दर्शाता है; ‘अर्गलाएँ’ काव्यात्मक गरिमा और वस्तु का कार्य दोनों बनाए रखता है।
- source_word: בַרְזֶל
  choice: लोहे
  rationale: धातु-संज्ञा का सीधा और मानक हिन्दी रूप।
- source_word: גִּדֵּעַ
  choice: काट डालीं
  rationale: क्रिया काटकर अलग करने या धराशायी करने का प्रबल भाव रखती है; लोहे की अर्गलाओं के साथ यह स्वाभाविक और सशक्त हिन्दी है।
theological_decisions:
- issue: ईश्वरीय कर्ता का संदर्भ
  choice: उसने
  alternative: यहोवा ने
  rationale: हिब्रू में इस पद की क्रियाओं का कर्ता स्पष्ट संज्ञा के रूप में नहीं आया, बल्कि पिछले संदर्भ में यहोवा की ओर संकेत करता है। ‘उसने’ मूल पाठ के प्रवचन-प्रवाह और अंतर्निहित कर्ता को बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में काव्यात्मक परंतु सहज और गरिमापूर्ण शैली। ‘अर्गलाएँ’ कुछ साहित्यिक शब्द है, लेकिन द्वार बंद करने वाली मजबूत छड़ों के लिए सटीक है; पद की धातु और दुर्ग-विनाश की समानांतर छवि सुरक्षित रखी गई है।
