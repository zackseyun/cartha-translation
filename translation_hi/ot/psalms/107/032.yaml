  text: Let them exalt him in the assembly of the people[b][a], and praise him in the council of the elders.
translation:
  language: hi
  text: 'वे लोगों की सभा[a] में उसे महान ठहराएँ,

    और बुज़ुर्गों की परिषद[b] में उसकी स्तुति करें।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘मण्डली’।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक अर्थ ‘बुज़ुर्गों की बैठक’ है; यहाँ आशय उनकी बैठी हुई परिषद से है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וִירֹמְמוּהוּ
  choice: वे उसे महान ठहराएँ
  rationale: रומם का गहन अर्थ सार्वजनिक रूप से ऊँचा और सम्मानित करना है। ‘महान ठहराएँ’ आधुनिक हिन्दी में स्वाभाविक है और शारीरिक रूप से उठाने का भ्रम नहीं देता।
- source_word: בִּקְהַל עָם
  choice: लोगों की सभा में
  rationale: קהל किसी एकत्र समुदाय को और עָם यहाँ सामान्य जनसमुदाय को दर्शाता है। ‘लोगों की सभा’ सार्वजनिक सामुदायिक संदर्भ को स्पष्ट रखता है।
- source_word: וּבְמוֹשַׁב זְקֵנִים
  choice: और पुरनियों की परिषद में
  rationale: מוֹשָׁב का मूल संबंध बैठने या बैठक से है; זְקֵנִים के साथ यह मान्य अगुओं की बैठी हुई विचार-विमर्श सभा को दर्शाता है। ‘परिषद’ इस कार्यात्मक अर्थ को सहज हिन्दी में व्यक्त करता है।
- source_word: זְקֵנִים
  choice: पुरनियों
  rationale: यहाँ शब्द केवल वृद्ध पुरुषों के लिए नहीं, बल्कि समुदाय के मान्य वरिष्ठ अगुओं के लिए है। ‘पुरनिये’ हिन्दी बाइबलीय भाषा में इस सामाजिक भूमिका को संक्षेप में व्यक्त करता है।
- source_word: יְהַלְלוּהוּ
  choice: उसकी स्तुति करें
  rationale: הלל के पिएल रूप का सीधा और प्रसंगानुकूल अर्थ स्तुति करना है।
