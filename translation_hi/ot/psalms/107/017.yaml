  yaml_path: translation/ot/psalms/107/017.yaml
  text: Fools[a], because of the way of their transgression and because of their iniquities[c][b], were afflicted.
translation:
  language: hi
  text: मूर्ख लोग[a] अपने विद्रोह के मार्ग के कारण और अपने अधर्मों के कारण पीड़ित हुए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मूर्ख लोग अपने विद्रोह के मार्ग से और अपने अधर्मों से पीड़ित हुए।” इब्रानी संबंधबोधक शब्द का अधिक शाब्दिक अनुवाद “से” हो सकता है, यद्यपि यहाँ उसका अर्थ संभवतः “के कारण” है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱוִלִים
  choice: मूर्ख लोग
  rationale: यह शब्द केवल बौद्धिक कमी नहीं, बल्कि नैतिक मूर्खता वाले लोगों को दर्शाता है। आधुनिक हिन्दी में ‘मूर्ख लोग’ सीधा और स्वाभाविक है।
- source_word: מִדֶּרֶךְ
  choice: अपने ... मार्ग ... के कारण
  rationale: מִן को यहाँ कारणसूचक माना गया है, जबकि ‘मार्ग’ को जीवन-चाल या आचरण की दिशा के रूप में बनाए रखा गया है।
- source_word: פִּשְׁעָם
  choice: अपने विद्रोह
  rationale: פֶּשַׁע में अधिकार के विरुद्ध अपराध या विद्रोह का भाव है। ‘विद्रोह’ इसकी नैतिक और संबंधपरक तीव्रता को स्पष्ट रखता है।
- source_word: וּמֵעֲוֺנֹתֵיהֶם
  choice: और अपने अधर्मों के कारण
  rationale: עָוֹן अपराध, दोष या उसके परिणाम का अर्थ दे सकता है। बहुवचन में ‘अधर्मों’ उनके दोषपूर्ण कामों को दर्शाता और פֶּשַׁע से शब्दगत भेद बनाए रखता है।
- source_word: יִתְעַנּוּ
  choice: दुःख उठाते थे
  rationale: Hitpael रूप यहाँ पीड़ित या क्लेशित होने की दशा व्यक्त करता है। भजन के वर्णनात्मक संदर्भ में ‘दुःख उठाते थे’ सहज हिन्दी है और अपूर्ण भूतकाल की पुनरावृत्त/स्थितिगत छाया को भी संभव रखता है।
theological_decisions:
- issue: पाप और दुःख के बीच कारण-संबंध
  choice: पद में इन लोगों का दुःख उनके विद्रोही मार्ग और अधर्मों के कारण बताया गया है।
  alternative: מִן को अधिक शाब्दिक रूप से ‘से’ लिया जा सकता है, जिससे उद्गम या संबंध का भाव अधिक उभरे।
  rationale: दोनों מִן इस काव्य-संदर्भ में कारणसूचक समझे जा सकते हैं। अनुवाद इस विशेष समूह के दुःख और उनके पाप के बीच संबंध रखता है, पर इसे हर प्रकार के दुःख पर लागू सार्वभौमिक सिद्धांत नहीं बनाता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘मार्ग’ की बाइबिलीय रूपक-छवि को बनाए रखते हुए वाक्य को स्वाभाविक हिन्दी क्रम दिया गया है।
