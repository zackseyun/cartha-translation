translation:
  language: hi
  text: 'फलदायी भूमि को खारी बंजर भूमि[a] बना देता है,

    उसमें रहनेवालों की बुराई के कारण।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “खारेपन में” अथवा “खारी भूमि में”; इब्रानी चित्र सम्भवतः बंजर, अनुपजाऊ क्षेत्र की ओर संकेत करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶרֶץ פְּרִי
  choice: फलवन्त भूमि
  rationale: शाब्दिक रूप से ‘फल की भूमि’; यह पदबंध उपजाऊ और उत्पादक भूमि का बोध कराता है। ‘फलवन्त भूमि’ कृषि-संबंधी चित्र को संक्षिप्त और स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: לִמְלֵחָה
  choice: खारी उजाड़ भूमि
  rationale: ל परिणामस्वरूप परिवर्तन दर्शाता है और מְלֵחָה खारेपन अथवा लवणयुक्त दशा को। प्रसंग में यह अनुपजाऊपन का चित्र है; ‘खारी उजाड़ भूमि’ नमक के ठोस बिम्ब और उसके विनाशकारी परिणाम दोनों को व्यक्त करता है।
- source_word: מֵרָעַת
  choice: बुराई की है
  rationale: מֵ यहाँ कारण बताता है और רָעָה नैतिक बुराई को सूचित करता है। हिन्दी उपवाक्य ‘क्योंकि…बुराई की है’ मूल के नैतिक-कारण संबंध को स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: יֹשְׁבֵי בָהּ
  choice: उसमें रहनेवालों
  rationale: ישב का कृदन्त उन लोगों को दर्शाता है जो उस भूमि में रहते हैं। ‘उसमें रहनेवालों’ भूमि के साथ संबंध और क्रियात्मक भाव दोनों बनाए रखता है।
theological_decisions:
- issue: भूमि के उजड़ने का कारण
  choice: फलवन्त भूमि का खारी उजाड़ भूमि बनना उसमें रहनेवालों की बुराई के कारण बताया गया है।
  alternative: परिवर्तन को केवल पर्यावरणीय या ऐतिहासिक घटना मानना, जिसमें नैतिक कारण न हो।
  rationale: मूल इब्रानी מֵרָעַת יֹשְׁבֵי בָהּ स्पष्ट रूप से निवासियों की बुराई को इस उलटाव का कारण बताता है; अनुवाद इस नैतिक-कारण संबंध को बनाए रखता है।
- issue: निहित कर्ता
  choice: पूर्ववर्ती पदों से चले आ रहे एकवचन कर्ता के अनुरूप ‘बना देता है’ रखा गया है।
  alternative: कर्मवाच्य ‘बन जाती है’, जिससे कर्ता अप्रकट हो जाए।
  rationale: इस पद में कर्ता दोहराया नहीं गया, पर भजन 107:33 से चली आ रही क्रियाओं का कर्ता परमेश्वर है। सक्रिय रूप काव्य के वाक्य-विन्यास को बनाए रखता है, बिना इस पद में नाम जोड़ने के।
translation_notes:
  register: आधुनिक मानक हिन्दी में काव्यात्मक, गरिमापूर्ण और सामान्य पाठकों के लिए सुबोध शैली। ‘फलवन्त’ और ‘खारी उजाड़ भूमि’ मूल कृषि एवं लवणता के बिम्बों को बनाए रखते हैं; नैतिक कारण को स्वाभाविक हिन्दी उपवाक्य में व्यक्त किया गया है।
