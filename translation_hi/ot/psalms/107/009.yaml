  text: כִּי הִ֭שְׂבִּיעַ נֶ֣פֶשׁ שֹׁקֵקָ֑ה וְ/נֶ֥פֶשׁ רְ֝עֵבָה מִלֵּא טֽוֹב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/107/009.yaml
  text: For he satisfies the thirsty soul[b][a], and he fills the hungry soul with good things.
translation:
  language: hi
  text: 'क्योंकि वह प्यासे प्राण को तृप्त करता है,

    और भूखे प्राण को अच्छी वस्तुओं से भर देता है।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह आसपास के धन्यवाद और स्तुति के आह्वान का कारण बताता है; ‘क्योंकि’ इसके व्याख्यात्मक बल को सहज हिन्दी में बनाए रखता है।
- source_word: הִשְׂבִּיעַ
  choice: तृप्त करता है
  rationale: हिफ़ील रूप का अर्थ किसी को भरपूर संतुष्ट या तृप्त करना है। सामान्य वर्तमान काल पद के सार्वकालिक काव्यात्मक कथन के अनुकूल है।
- source_word: נֶפֶשׁ
  choice: जान
  rationale: यहाँ נֶפֶשׁ केवल देह से अलग किसी अमूर्त अंश को नहीं, बल्कि चाह और भूख का अनुभव करने वाले पूरे जीवित व्यक्ति या उसके प्राणमय अस्तित्व को सूचित कर सकता है। ‘जान’ काव्यात्मकता और व्यापक अर्थ दोनों को बनाए रखता है।
- source_word: שֹׁקֵקָה
  choice: प्यासी
  rationale: यह शब्द तीव्र लालसा या प्यास को व्यक्त करता है। समानांतर ‘भूखी’ के साथ ‘प्यासी’ ठोस बिंब और काव्य-संतुलन बनाए रखता है।
- source_word: רְעֵבָה
  choice: भूखी
  rationale: यह विशेषण सीधे भूख की दशा बताता है और ‘प्यासी’ के समानांतर स्वाभाविक आधुनिक हिन्दी देता है।
- source_word: מִלֵּא
  choice: भर देता है
  rationale: पिएल रूप ‘भरना’ दर्शाता है। ‘भर देता है’ हिन्दी में पूर्ण और उदार पूर्ति का भाव स्वाभाविक रूप से व्यक्त करता है।
- source_word: טוֹב
  choice: भलाई
  rationale: एकवचन/सामूहिक ‘अच्छाई, भलाई, जो अच्छा है’ को ‘भलाई’ बिना अनावश्यक बहुवचन जोड़े व्यक्त करता है और मूल की अर्थगत खुलावट बनाए रखता है।
theological_decisions:
- issue: נֶפֶשׁ का मानव-विषयक अर्थ
  choice: दोनों पंक्तियों में ‘जान’
  alternative: ‘प्राण’, ‘व्यक्ति’, ‘जीवन’ या ‘मन’
  rationale: ‘जान’ पूरे जीवित व्यक्ति और उसके भीतर अनुभव की जाने वाली गहरी आवश्यकता—दोनों की ओर संकेत कर सकती है; इससे मूल का काव्यात्मक भार बना रहता है और देह-आत्मा संबंधी कोई तकनीकी मत आरोपित नहीं होता।
- issue: טוֹב का स्वरूप
  choice: ‘भलाई से’
  alternative: ‘अच्छी वस्तुओं से’ या ‘जो अच्छा है उससे’
  rationale: ‘भलाई’ मूल के व्यापक, सामूहिक अर्थ को सुरक्षित रखती है; पद यह निश्चित नहीं करता कि पूर्ति केवल भौतिक वस्तुओं की है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘प्यासी जान’ और ‘भूखी जान’ मूल की समानांतर काव्य-रचना को बनाए रखते हैं; ‘भलाई से’ טוֹב की व्यापकता और संभावित अर्थगत तनाव को सुरक्षित रखता है।
