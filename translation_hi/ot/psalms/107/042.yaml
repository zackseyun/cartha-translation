  yaml_path: translation/ot/psalms/107/042.yaml
  text: The upright see and rejoice[a], and all injustice shuts its mouth.
translation:
  language: hi
  text: सीधे-सच्चे लोग देखेंगे और आनन्दित होंगे, और सारा अन्याय[a] अपना मुँह बंद कर लेगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “सारी दुष्टता अपना मुँह बंद कर लेगी।” इब्रानी में “अन्याय/दुष्टता” स्त्रीलिंग एकवचन संज्ञा है और उसे मुँह वाली सत्ता के रूप में चित्रित किया गया है।
    reason: शाब्दिक विकल्प और इब्रानी मानवीकरण को स्पष्ट करना।
lexical_decisions:
- source_word: יִרְאוּ
  choice: यह देखेंगे
  rationale: रָאָה के क़ाल अपूर्ण, तृतीय पुरुष बहुवचन को भविष्यात्मक रूप में रखा गया है। हिन्दी में संदर्भ की ओर संकेत करने वाला ‘यह’ स्वाभाविक है, यद्यपि इब्रानी में कर्म स्पष्ट रूप से नहीं दिया गया।
- source_word: יְשָׁרִים
  choice: सीधे-सच्चे लोग
  rationale: बहुवचन विशेषण यहाँ संज्ञा के रूप में उन लोगों के लिए है जो नैतिक रूप से सीधे हैं। ‘सीधे-सच्चे लोग’ सामान्य आधुनिक हिन्दी में इस नैतिक भाव को स्पष्ट करता है और इसे צַדִּיק के अधिक विशिष्ट शब्द से नहीं मिलाता।
- source_word: וְיִשְׂמָחוּ
  choice: और आनन्दित होंगे
  rationale: שׂמח के क़ाल अपूर्ण बहुवचन का सक्रिय हर्ष व्यक्त किया गया है और पहले क्रियापद के भविष्यात्मक रूप से समानता रखी गई है।
- source_word: וְכָל
  choice: और सारा
  rationale: सरल संयोजक और समग्रता के अर्थ को सीधे रखा गया है; इब्रानी में कोई स्पष्ट विरोधसूचक अव्यय नहीं है।
- source_word: עַוְלָה
  choice: अन्याय
  rationale: यह अमूर्त संज्ञा गलत काम, अन्याय या अधर्म का बोध कराती है। ‘अन्याय’ मूल अर्थ और काव्यात्मक मानवीकरण को बनाए रखता है, बिना विषय को ‘दुष्ट लोग’ में बदलने के।
- source_word: קָפְצָה
  choice: बंद कर लेगा
  rationale: קפץ का क़ाल पूर्ण, स्त्रीलिंग एकवचन यहाँ ‘मुँह’ के साथ बंद करने के मुहावरे में है। हिन्दी में भविष्यात्मक ‘बंद कर लेगा’ पहले खंड के साथ स्वाभाविक है और निर्णायक रूप से चुप हो जाने का भाव देता है।
- source_word: פִּיהָ
  choice: अपना मुँह
  rationale: स्त्रीलिंग एकवचन प्रत्यय विषय की ओर लौटता है। हिन्दी का ‘अपना’ लिंग-विशिष्ट सर्वनाम की आवश्यकता के बिना उसी संबंध और मानवीकरण को सुरक्षित रखता है।
theological_decisions:
- issue: अन्याय का मानवीकरण
  choice: अमूर्त ‘अन्याय’ को ऐसे प्रस्तुत करना जो ‘अपना मुँह बंद कर लेता’ है।
  alternative: विषय को व्यक्तिगत बनाकर ‘दुष्ट लोग चुप हो जाएँगे’ कहना, या ‘दुष्टता’ चुनना।
  rationale: इब्रानी में विषय कोई व्यक्ति-संज्ञा नहीं, बल्कि स्त्रीलिंग अमूर्त संज्ञा עַוְלָה है। इसलिए गलत काम को चुप करा दिए जाने का काव्यात्मक चित्र बनाए रखा गया है।
- issue: क्रियाओं का कालगत संबंध
  choice: दोनों खंडों को हिन्दी भविष्यकाल में प्रस्तुत करना।
  alternative: 'पहले खंड को वर्तमान और दूसरे को पूर्ण भूतकाल में देना: ‘देखते और आनन्दित होते हैं... अन्याय ने अपना मुँह बंद कर लिया है।’'
  rationale: इब्रानी में पहले दो क्रियापद अपूर्ण और अंतिम क्रियापद पूर्ण है; काव्य में अंतिम पूर्ण रूप परिणाम की निश्चितता को उभार सकता है। हिन्दी का एकरूप भविष्यकाल पद के संदर्भगत परिणाम को स्वाभाविक ढंग से व्यक्त करता है, बिना इसे केवल अतीत की घटना मानने के।
translation_notes:
  register: भाषा आधुनिक, सरल और गरिमापूर्ण रखी गई है। ‘सीधे-सच्चे लोग’ सामान्य पाठक के लिए नैतिक सीधाई का सहज बोध देता है। ‘अपना मुँह बंद कर लेगा’ परिचित हिन्दी मुहावरा है और मूल काव्यात्मक मानवीकरण को बनाए रखता है।
