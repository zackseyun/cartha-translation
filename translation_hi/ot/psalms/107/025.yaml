  text: וַ/יֹּ֗אמֶר וַֽ֭/יַּעֲמֵד ר֣וּחַ סְעָרָ֑ה וַ/תְּרוֹמֵ֥ם גַּלָּֽי/ו׃׆
base_translation:
  language: en
  yaml_path: translation/ot/psalms/107/025.yaml
  text: For he spoke and raised up a storm wind[a], and it lifted up its waves.
translation:
  language: hi
  text: उसने कहा और तूफ़ानी हवा उठाई[a]; उस हवा ने समुद्र की लहरों को ऊँचा उठा दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसने कहा और आँधी उठाई।”
    reason: וַיַּעֲמֵד के कारक भाव तथा רוּחַ סְעָרָה के संक्षिप्त वैकल्पिक हिन्दी रूप को दर्शाने के लिए।
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: उसने कहा
  rationale: אמר का सामान्य अर्थ ‘कहना’ है। इससे परमेश्वर के वचन पर आँधी उठने का भाव बना रहता है, पर क्रिया में ‘आज्ञा दी’ का अर्थ अनावश्यक रूप से नहीं जोड़ा जाता।
- source_word: וַיַּעֲמֵד
  choice: उठा दी
  rationale: עמד के हिफ़ील रूप का कारक भाव है—किसी चीज़ को उठाना या खड़ा करना। ‘उठा दी’ आधुनिक हिन्दी में स्वाभाविक है और तूफ़ानी हवा के आरम्भ होने का चित्र व्यक्त करता है।
- source_word: רוּחַ סְעָרָה
  choice: तूफ़ानी हवा
  rationale: यह पदबंध तूफ़ान से चिह्नित प्रचंड हवा को दर्शाता है। ‘तूफ़ानी हवा’ दोनों शब्दों का भाव स्पष्ट और स्वाभाविक हिन्दी में रखता है।
- source_word: וַתְּרוֹמֵם
  choice: उस हवा ने ... ऊँची कर दीं
  rationale: स्त्रीलिंग एकवचन क्रिया का कर्ता רוּחַ, अर्थात तूफ़ानी हवा, है। हिन्दी में कर्ता दोहराने से यह संबंध स्पष्ट रहता है और लहरों के ऊँचे उठने का चित्र सहज बनता है।
- source_word: גַּלָּיו
  choice: समुद्र की लहरें
  rationale: पुल्लिंग एकवचन प्रत्यय का स्वाभाविक संदर्भ प्रसंग में निहित समुद्र है। केवल ‘उसकी लहरें’ हिन्दी में निकटस्थ ‘हवा’ से गलत ढंग से जुड़ सकता था, इसलिए संदर्भित संज्ञा स्पष्ट की गई है।
theological_decisions:
- issue: क्रियाओं का निहित कर्ता
  choice: ‘उसने’ से परमेश्वर को कर्ता बनाए रखा गया है।
  alternative: निर्वैयक्तिक अनुवाद, जैसे ‘हवा उठी,’ किया जा सकता था, पर उससे इब्रानी का कारक कर्ता छूट जाता।
  rationale: आसपास के पदों में कर्ता यहोवा है; पद उसके वचन और समुद्र पर उसके अधिकार का वर्णन जारी रखता है।
- issue: גַּלָּיו के प्रत्यय का संदर्भ
  choice: इसे प्रसंग में समुद्र की लहरों के रूप में व्यक्त किया गया है।
  alternative: शाब्दिक रूप ‘उसकी लहरें’ है, जिसे परमेश्वर के अधिकार वाली लहरों के रूप में भी पढ़ा जा सकता है।
  rationale: व्याकरणिक पुल्लिंग प्रत्यय स्त्रीलिंग רוּחַ ‘हवा’ की ओर संकेत नहीं करता; समुद्री प्रसंग में निहित ים ‘समुद्र’ सबसे स्वाभाविक संदर्भ है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। अर्धविराम से परमेश्वर द्वारा हवा उठाने और हवा द्वारा लहरें ऊँची करने के क्रम को स्पष्ट किया गया है।
