  yaml_path: translation/ot/psalms/107/026.yaml
  text: They rose up to the heavens; they went down to the depths[a]. Their soul melted away in distress.
translation:
  language: hi
  text: वे आकाश तक चढ़ जाते हैं, फिर गहराइयों में उतर जाते हैं; विपत्ति में उनका जी घुल जाता है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “विपत्ति में उनका प्राण पिघल जाता है।” נֶפֶשׁ का अर्थ ‘जी’, ‘प्राण’, ‘जीवन’ या ‘स्वयं व्यक्ति’ हो सकता है; और רָעָה यहाँ ‘संकट’, ‘मुसीबत’ या ‘विपत्ति’ का बोध करा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: יַעֲלוּ
  choice: चढ़ जाते हैं
  rationale: עלה का सामान्य अर्थ ऊपर जाना या चढ़ना है। यह चयन तूफ़ानी समुद्र में ऊँचे उठने की सजीव गति को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: שָׁמַיִם
  choice: आकाश तक
  rationale: काव्यात्मक अतिशयोक्ति में שָׁמַיִם अत्यधिक ऊँचाई दिखाता है। ‘आकाश तक’ आधुनिक हिन्दी में स्पष्ट और गरिमापूर्ण है।
- source_word: יֵרְדוּ
  choice: उतर जाते हैं
  rationale: ירד, עלה के विपरीत नीचे जाने की गति बताता है। ‘उतर जाते हैं’ दोनों क्रियाओं का संतुलन बनाए रखता है और डूबने का अनावश्यक अर्थ नहीं जोड़ता।
- source_word: תְהוֹמוֹת
  choice: गहराइयों में
  rationale: תְּהוֹם का बहुवचन यहाँ समुद्र की गहरी घाटियों या अथाह गहराइयों को सूचित करता है। ‘गहराइयों’ समुद्री दृश्य को स्पष्ट रखते हुए बहुवचन भी सुरक्षित रखता है।
- source_word: נַפְשָׁם
  choice: उनका जी
  rationale: נֶפֶשׁ यहाँ मनुष्य के भीतरी जीवन, प्राण या स्वयं व्यक्ति का बोध करा सकता है। हिन्दी मुहावरे में ‘जी घुल जाना’ भीतरी भय और टूटन को स्वाभाविक ढंग से व्यक्त करता है, जबकि शब्द की व्यापकता फुटनोट में सुरक्षित है।
- source_word: בְּרָעָה
  choice: विपत्ति में
  rationale: इस प्रसंग में רָעָה नैतिक बुराई नहीं, बल्कि संकट, मुसीबत या विनाशकारी परिस्थिति को दर्शाता है। ‘विपत्ति में’ पूर्वसर्गीय रचना और स्थिति की गंभीरता दोनों बनाए रखता है।
- source_word: תִתְמוֹגָג
  choice: घुल जाता है
  rationale: מוג से बना यह रूप पिघलने, गलने या भीतर से ढह जाने का रूपक व्यक्त करता है। ‘जी घुल जाता है’ हिन्दी में प्राकृतिक है और मूल रूपक को पूरी तरह सपाट नहीं करता।
