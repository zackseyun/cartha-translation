  yaml_path: translation/ot/psalms/107/003.yaml
  text: and gathered them from the lands[a], from the east and from the west[b], from the north and from the sea.
translation:
  language: hi
  text: और उन्हें उसने देशों से इकट्ठा किया—पूर्व से और पश्चिम से, उत्तर से और समुद्र से।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘दक्षिण से’। इब्रानी में ‘समुद्र से’ है। कुछ प्रसंगों में ‘समुद्र’ दिशा-सूचक होकर पश्चिम का बोध करा सकता है, पर यहाँ पश्चिम का उल्लेख पहले ही हो चुका है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמֵאֲרָצוֹת
  choice: और ... अलग-अलग देशों से
  rationale: אֲרָצוֹת, אֶרֶץ का बहुवचन है और यहाँ अनेक भूभागों या देशों को दर्शाता है। ‘अलग-अलग देशों’ से बहुवचन और भौगोलिक विस्तार दोनों सहज हिन्दी में व्यक्त होते हैं।
- source_word: קִבְּצָם
  choice: जिन्हें उसने ... इकट्ठा किया
  rationale: קבץ का अर्थ ‘इकट्ठा करना’ है। प्रत्यय ‘उन्हें’ को सम्बन्धवाचक ‘जिन्हें’ के रूप में रखा गया है, क्योंकि पद 2 से जुड़ने पर यही हिन्दी में स्वाभाविक है; कर्ता परमेश्वर सन्दर्भ से प्राप्त होता है।
- source_word: מִמִּזְרָח וּמִמַּעֲרָב
  choice: पूर्व और पश्चिम से
  rationale: दोनों शब्द क्रमशः पूर्व और पश्चिम दिशाओं को बताते हैं। संक्षिप्त युग्म हिन्दी काव्यात्मक समानांतरता बनाए रखता है।
- source_word: מִצָּפוֹן
  choice: उत्तर से
  rationale: צָפוֹן का सामान्य दिशात्मक अर्थ ‘उत्तर’ है।
- source_word: וּמִיָּם
  choice: और समुद्र की ओर से
  rationale: יָם का मूल अर्थ ‘समुद्र’ है। यहाँ पश्चिम पहले ही अलग से आया है, इसलिए इसे सीधे ‘समुद्र’ रखना पाठ की असामान्य चार-भागीय सूची को बिना समतल किए सुरक्षित रखता है। ‘की ओर से’ इसके दिशात्मक प्रयोग को हिन्दी में स्पष्ट करता है।
theological_decisions:
- issue: चार दिशाओं की सममित सूची या शाब्दिक ‘समुद्र’
  choice: समुद्र की ओर से
  alternative: दक्षिण से
  rationale: इब्रानी पाठ में יָם (‘समुद्र’) है, जबकि कई अनुवाद चार मुख्य दिशाओं की अपेक्षित समरूपता के कारण ‘दक्षिण’ करते हैं। अनुवाद मूल शब्द और उसकी कठिनाई को मुख्य पाठ में सुरक्षित रखता है तथा विकल्प को पादटिप्पणी में देता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और काव्यात्मक रखी गई है। ‘अलग-अलग देशों’ सामान्य पाठक के लिए स्पष्ट है; डैश दिशाओं की श्रृंखला को मुख्य क्रिया से जोड़ता है। पद को पिछले पद से जुड़ा हुआ मानकर ‘जिन्हें’ प्रयुक्त किया गया है।
