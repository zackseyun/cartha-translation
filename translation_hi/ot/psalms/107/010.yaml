lexical_decisions:
- source_word: יֹשְׁבֵי
  choice: कुछ लोग ... बैठे थे
  rationale: इब्रानी कृदन्त बैठने या किसी दशा में पड़े रहनेवालों को दर्शाता है। भजन के प्रसंग में स्वाभाविक हिन्दी के लिए इसे सीमित क्रिया-वाक्य बनाया गया है।
- source_word: חֹשֶׁךְ
  choice: अन्धकार
  rationale: यह शब्द वास्तविक या रूपकात्मक अन्धकार का सामान्य और सीधा बोध देता है।
- source_word: צַלְמָוֶת
  choice: घोर छाया
  rationale: यह काव्यात्मक पद गहरे अन्धकार या घोर उदासी का संकेत कर सकता है; हिन्दी में 'घोर छाया' इसकी छवि और स्रोत की सम्भावित व्यापकता बनाए रखता है। पारम्परिक विकल्प पाद-टिप्पणी में दिया गया है।
- source_word: אֲסִירֵי
  choice: जकड़े हुए
  rationale: यह बहुवचन उन लोगों को दर्शाता है जो बँधे या बन्दी हैं। 'जकड़े हुए' दुःख और लोहे दोनों के साथ इब्रानी रचना का सम्बन्ध स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: עֳנִי
  choice: दुःख
  rationale: शब्द दुःख, विपत्ति या दीनता का बोध दे सकता है। इस बन्दीगृह-सन्दर्भ में 'दुःख' अर्थ को अनावश्यक रूप से केवल आर्थिक गरीबी तक सीमित नहीं करता।
- source_word: בַרְזֶל
  choice: लोहे की बेड़ियाँ
  rationale: इब्रानी में एकवचन 'लोहा' यहाँ लौह-बन्धनों के लिए लाक्षणिक है। स्पष्ट और स्वाभाविक हिन्दी में इसे 'लोहे की बेड़ियाँ' कहा गया है।
