  text: Then they cried out to Yahweh in their trouble[a], and he brought them out of their distresses.
translation:
  language: hi
  text: तब उन्होंने अपने संकट में याहवे को पुकारा, और उसने उन्हें उनकी विपत्तियों से बाहर निकाल दिया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּצְעֲקוּ
  choice: तब उन्होंने ... पुकारा
  rationale: वाव-क्रमिक कथा को आगे बढ़ाता है; ‘तब’ भजन 107 में दोहराए गए घटनाक्रम को स्वाभाविक ढंग से व्यक्त करता है। צעק संकट में सहायता के लिए ज़ोर से पुकारने का भाव रखता है।
- source_word: אֶל־יְהוָה
  choice: यहोवा को
  rationale: אֶל पुकार की दिशा बताता है। יְהוָה को हिन्दी में प्रचलित व्यक्तिगत नाम ‘यहोवा’ से व्यक्त किया गया है, किसी उपाधि से नहीं।
- source_word: בַּצַּר לָהֶם
  choice: अपने संकट में
  rationale: शाब्दिक संरचना ‘उनके लिए संकट में’ है, जिसका स्वाभाविक हिन्दी अर्थ ‘अपने संकट में’ है। צַר तंगी, क्लेश या संकट की दशा बताता है।
- source_word: וּמִמְּצוּקֹתֵיהֶם
  choice: उनकी विपत्तियों से
  rationale: מְצוּקוֹתֵיהֶם बहुवचन है और अनेक दबावपूर्ण संकटों या विपत्तियों का बोध कराता है; ‘विपत्तियों’ बहुवचन को बनाए रखता है। מן का अलगाव-सूचक अर्थ ‘से’ द्वारा व्यक्त हुआ है।
- source_word: יוֹצִיאֵם
  choice: वह उन्हें ... बाहर निकाल लाया
  rationale: יצא का हिफ़ील रूप ‘बाहर निकालना/ले आना’ है। यह अनुवाद केवल ‘छुड़ाया’ कहने के बजाय मूल की ठोस बाहर-निकालने वाली छवि बनाए रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ में परमेश्वर का व्यक्तिगत चतुरक्षरी नाम है। आधुनिक हिन्दी बाइबलीय प्रयोग में ‘यहोवा’ व्यापक रूप से पहचाना जाता है और नाम को ‘प्रभु’ जैसी उपाधि से प्रतिस्थापित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘संकट’ और ‘विपत्तियों’ मूल के एकवचन צַר तथा बहुवचन מְצוּקוֹת के भेद को स्पष्ट रखते हैं; वाक्य की समानांतर संरचना भी सुरक्षित है।
