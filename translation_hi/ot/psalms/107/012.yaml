review_pass:
  verdict: revise
  source_fidelity: The initial ‘इसलिए’ has no equivalent in the Hebrew of this verse; the opening waw is consecutive/narrative (‘and/so’ in context), not a causal ‘therefore.’ The remaining clauses accurately retain the implied singular divine subject, the collective singular ‘heart,’ the means expressed by בְּ, the stumbling image, and the absence of a helper.
  naturalness: ‘उनके हृदय को दीन कर दिया’ is understandable but somewhat less idiomatic in modern Hindi when the means is burdensome labor. ‘...हृदय को कठिन श्रम से झुका दिया’ is natural, dignified, and conveys the causative humbling without adding interpretation.
  terminology: ‘हृदय,’ ‘कठिन श्रम,’ and ‘सहायता करने वाला’ are suitable in register and meaning. The lexical notes preserve the possible broader sense of עָמָל and the possible result of כָּשְׁלוּ.
  issues:
  - severity: medium
    issue: The translation adds ‘इसलिए’ at the beginning.
    rationale: The Hebrew begins with a waw-consecutive verb and does not state a causal connective equivalent to ‘therefore.’ Adding it makes the verse’s logical relation more explicit than the source.
  - severity: low
    issue: ‘दीन कर दिया’ is slightly stiff with ‘हृदय’ in this construction.
    rationale: ‘झुका दिया’ more directly and naturally renders the causative sense of כנע in modern Hindi while retaining the poetic register.
