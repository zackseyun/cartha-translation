  yaml_path: translation/ot/psalms/107/012.yaml
  text: So he humbled their heart with hard labor[a]; they stumbled[c][b], and there was no one to help.
translation:
  language: hi
  text: उसने उनके हृदय को कठिन श्रम से झुका दिया[a][b]; वे लड़खड़ा गए[c], और सहायता करने वाला कोई न था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘कठिन परिश्रम से,’ ‘कष्ट के द्वारा’; इब्रानी शब्द עָמָל बोझिल श्रम, कठिन परिश्रम या दुःख-कष्ट का अर्थ दे सकता है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में शाब्दिक रूप से ‘उनका हृदय’ है; एकवचन ‘हृदय’ सामूहिक अर्थ में प्रयुक्त हुआ है।
    reason: lexical_alternative
  - marker: c
    text: या ‘वे ठोकर खाकर गिर पड़े’; इस क्रिया का अर्थ लड़खड़ाना, ठोकर खाना या गिर पड़ना हो सकता है।
    reason: lexical_alternative
lexical_decisions:
