  rationale: The unsupported causal connector has been removed. ‘झुका दिया’ replaces ‘दीन कर दिया’ for a more idiomatic rendering of the Hiphil verb while preserving God as the implied subject and the sense that oppressive toil brought their inner resolve low. Footnote anchors and all stated lexical alternatives are retained.
