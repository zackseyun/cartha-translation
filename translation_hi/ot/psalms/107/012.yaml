  choice: उसने ... दीन कर दिया
  rationale: हिफ़ील रूप का कारणवाचक अर्थ बनाए रखता है और प्रसंग से परमेश्वर को निहित कर्ता समझने देता है, बिना उसका नाम पद में जोड़ने के।
- source_word: בֶּעָמָל
  choice: कठिन श्रम के द्वारा
  rationale: עָמָל में श्रम, कठिन परिश्रम और दुःख-कष्ट के अर्थ संभव हैं। बंदीपन के प्रसंग में ‘कठिन श्रम’ ठोस और स्वाभाविक है, जबकि पादटिप्पणी व्यापक अर्थ-सीमा सुरक्षित रखती है।
- source_word: לִבָּם
  choice: उनके हृदय को
  rationale: ‘हृदय’ भीतरी मनुष्य, साहस और संकल्प को व्यक्त करता है। एकवचन रूप इब्रानी के सामूहिक एकवचन को बनाए रखता है।
- source_word: כָּשְׁלוּ
  choice: वे लड़खड़ा गए
  rationale: כשל का मूल बिंब ठोकर खाने या लड़खड़ाने का है; यह अनिवार्य रूप से पूर्णतः गिर पड़ने का परिणाम नहीं जोड़ता।
- source_word: וְאֵין עֹזֵר
  choice: और सहायता करने वाला कोई न था
  rationale: यह אֵין और कृदंत की अस्तित्ववाचक संरचना को सहज आधुनिक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: וַיַּכְנַע का निहित कर्ता
  choice: ‘उसने’—प्रसंगानुसार परमेश्वर कर्ता है
  alternative: 'भाववाच्य: ‘उनका हृदय दीन किया गया’'
  rationale: आस-पास के पद दण्ड और छुटकारे के कार्य परमेश्वर से जोड़ते हैं। सक्रिय एकवचन क्रिया भजन की इसी बात को बनाए रखती है, पर मूल में अनुपस्थित ‘यहोवा’ नाम को यहाँ स्पष्ट रूप से नहीं जोड़ती।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘दीन कर दिया’ कारणवाचक क्रिया और अपमानित/नीचा किए जाने की गंभीरता व्यक्त करता है; ‘हृदय’ भजन-साहित्य के अनुरूप है और सामान्य हिन्दी पाठक के लिए बोधगम्य है।
