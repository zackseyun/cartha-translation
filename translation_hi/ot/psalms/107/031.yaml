base_translation:
  language: en
  yaml_path: translation/ot/psalms/107/031.yaml
  text: Let them give thanks to Yahweh for his steadfast love and for his wondrous deeds to the children of man[a][b].
translation:
  language: hi
  text: वे यहोवा का धन्यवाद करें—उसके अटल प्रेम के लिए और मनुष्यों के लिए किए गए उसके अद्भुत कामों के लिए।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “मनुष्य के पुत्रों के लिए”; यह अभिव्यक्ति मानवजाति के लिए प्रयुक्त होती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: יוֹדוּ
  choice: वे ... धन्यवाद करें
  rationale: हिफ़ील अपूर्ण रूप यहाँ भजन के आवर्ती आह्वान के रूप में प्रयुक्त है; हिन्दी में यह स्वाभाविक रीति से सामूहिक आग्रह व्यक्त करता है।
- source_word: לַיהוָה
  choice: यहोवा का
  rationale: ל धन्यवाद के प्राप्तकर्ता को चिह्नित करता है; हिन्दी में मुहावरेदार रचना ‘यहोवा का धन्यवाद’ है। יְהוָה को व्यक्तिगत ईश्वरीय नाम के रूप में ‘यहोवा’ लिखा गया है।
- source_word: חַסְדּוֹ
  choice: उसकी अटल करुणा
  rationale: חֶסֶד में स्थायी निष्ठा, प्रेम और कृपा का संयुक्त भाव है। ‘अटल करुणा’ इसकी दृढ़ता और हितकारी प्रेम को सरल, गरिमापूर्ण हिन्दी में व्यक्त करती है।
- source_word: וְנִפְלְאוֹתָיו
  choice: और ... उसके अद्भुत कामों के लिए
  rationale: נִפְלָאוֹת विस्मय उत्पन्न करने वाले असाधारण कार्यों को दर्शाता है; ‘अद्भुत काम’ आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: לִבְנֵי אָדָם
  choice: मनुष्यों के लिए
  rationale: शाब्दिक अर्थ ‘आदम की सन्तानों/मनुष्य के पुत्रों के लिए’ है, पर यह सामूहिक रूप से मानवजाति को सूचित करता है। प्रसंग में ל लाभ या दिशा दर्शाता है, इसलिए ‘मनुष्यों के लिए’ स्वाभाविक है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का रूप
  choice: यहोवा
  alternative: याहवे / प्रभु
  rationale: मूल पाठ में चार अक्षरों वाला व्यक्तिगत ईश्वरीय नाम है। हिन्दी बाइबलीय प्रयोग में परिचित ‘यहोवा’ नाम को बनाए रखता है; इसे उपाधि ‘प्रभु’ से बदलकर मूल का नाम-सूचक स्वरूप नहीं मिटाया गया।
- issue: בני אדם का लिंग और व्यापक अर्थ
  choice: मनुष्यों
  alternative: मनुष्य के पुत्रों / आदम की सन्तानों
  rationale: हिब्रू अभिव्यक्ति व्याकरणतः पुल्लिंग होते हुए समस्त मानव समुदाय के लिए प्रतिनिधिक है। ‘मनुष्यों’ उसके व्यापक अर्थ को स्वाभाविक हिन्दी में देता है; शाब्दिक संरचना पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण भजनात्मक हिन्दी। डैश धन्यवाद के दो आधारों—अटल करुणा और अद्भुत कामों—को स्पष्ट करता है।
