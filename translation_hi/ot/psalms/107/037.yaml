lexical_decisions:
- source_word: וַיִּזְרְעוּ שָׂדוֹת
  choice: उन्होंने खेतों में बीज बोए
  rationale: זרע का सामान्य अर्थ बीज बोना है। हिन्दी में खेतों को बोने के बजाय ‘खेतों में बीज बोए’ अधिक स्वाभाविक है और मूल कृषि-क्रिया को स्पष्ट रखता है।
- source_word: וַיִּטְּעוּ כְרָמִים
  choice: दाख की बारियाँ लगाईं
  rationale: נטע रोपने या लगाने और כרמים अंगूर के बागों को दर्शाता है। ‘दाख की बारियाँ’ गरिमापूर्ण और प्रचलित बाइबलीय हिन्दी है, जबकि ‘लगाईं’ वास्तविक कृषि-क्रिया बनाए रखता है।
- source_word: וַיַּעֲשׂוּ פְּרִי תְבוּאָה
  choice: फसलें उपजाईं
  rationale: इस पदबंध का अत्यधिक शाब्दिक अनुवाद ‘उपज का फल उत्पन्न किया’ हिन्दी में अस्वाभाविक है। ‘फसलें उपजाईं’ कृषि-उत्पादन के परिणाम को सहज रूप में व्यक्त करता है; मूल पदबंध की बनावट पाद-टिप्पणी में दी गई है।
