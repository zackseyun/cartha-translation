lexical_decisions:
- source_word: יָקֵם
  choice: उसने … कर दिया
  rationale: हिफ़ील रूप यहाँ परिणाम उत्पन्न करने का अर्थ देता है—उसने तूफ़ान को शांत अवस्था में पहुँचा दिया। यह हिंदी प्रयोग कारक भाव को स्वाभाविक रूप से व्यक्त करता है।
- source_word: סְעָרָה
  choice: तूफ़ान
  rationale: समुद्री प्रसंग में यह शब्द आँधी या प्रचंड तूफ़ान का बोध कराता है; ‘तूफ़ान’ आधुनिक हिंदी में स्पष्ट और स्वाभाविक है।
- source_word: לִדְמָמָה
  choice: शांत
  rationale: לְ के साथ דְּמָמָה यहाँ परिणामस्वरूप शांति या निस्तब्धता की अवस्था बताता है। ‘शांत कर दिया’ अर्थ और हिंदी की स्वाभाविकता दोनों बनाए रखता है।
- source_word: וַיֶּחֱשׁוּ
  choice: थम गईं
  rationale: मूल क्रिया शांत या मौन हो जाने को व्यक्त करती है। लहरों के लिए ‘थम गईं’ सहज हिंदी है और उनकी हलचल समाप्त होने का भाव देता है।
- source_word: גַּלֵּיהֶם
  choice: उनकी लहरें
  rationale: इब्रानी प्रत्यय व्याकरणतः तीसरे पुरुष बहुवचन का है, अर्थात ‘उनकी’। इसे बनाए रखने से उसके संदर्भ को अनावश्यक रूप से निश्चित नहीं किया जाता।
