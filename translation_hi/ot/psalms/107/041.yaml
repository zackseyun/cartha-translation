id: PSA.107.41
reference: Psalms 107:41
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יְשַׂגֵּ֣ב אֶבְי֣וֹן מֵ/ע֑וֹנִי וַ/יָּ֥שֶׂם כַּ֝/צֹּ֗אן מִשְׁפָּחֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/107/041.yaml
  text: But he sets the needy on high[a], away from affliction, and makes their families like a flock.
translation:
  language: hi
  text: पर वह ज़रूरतमंद को दुःख से निकालकर ऊँचे और सुरक्षित स्थान पर रखता है[a], और परिवारों को झुंड के समान बढ़ाता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या, ‘ज़रूरतमंद को दुःख से ऊपर उठाता है।’ अगले खंड का अधिक शाब्दिक अनुवाद: ‘और परिवारों को झुंड के समान बनाता/रखता है।’'
    reason: שׂגב ऊँचा उठाने और सुरक्षित ऊँचाई पर रखने, दोनों का भाव दे सकता है। साथ ही וַיָּשֶׂם का मूल अर्थ व्यापक रूप से ‘रखना/बनाना’ है; ‘बढ़ाता है’ झुंड की उपमा में निहित बहुलता को व्यक्त करता है।
lexical_decisions:
- source_word: וַיְשַׂגֵּב
  choice: ऊँचे, सुरक्षित स्थान पर रखता है
  rationale: שׂגב में ऊँचा उठाने के साथ सुरक्षा देने का भाव भी हो सकता है। यह अभिव्यक्ति दोनों पहलुओं को स्वाभाविक हिन्दी में बनाए रखती है।
- source_word: אֶבְיוֹן
  choice: दरिद्र
  rationale: אֶבְיוֹן अभावग्रस्त या गरीब व्यक्ति को दर्शाता है। ‘दरिद्र’ गरिमापूर्ण और सामान्य आधुनिक हिन्दी में उपयुक्त है।
- source_word: מֵעֹנִי
  choice: दुःख से निकालकर
  rationale: עֹנִי दुःख, विपत्ति, दीनता या गरीबी का अर्थ दे सकता है। מִן के अलगाव-सूचक भाव को ‘से निकालकर’ स्पष्ट करता है, जबकि ‘दुःख’ अर्थ की व्यापकता बनाए रखता है।
- source_word: וַיָּשֶׂם
  choice: बढ़ाता है
  rationale: शाब्दिक अर्थ ‘रखता/बनाता है’ है; झुंड-समान परिवारों के संदर्भ में भाव समृद्धि और बहुगुणित होने का है। ‘बढ़ाता है’ हिन्दी में तुलना का आशय स्पष्ट करता है।
- source_word: כַּצֹּאן
  choice: झुंड के समान
  rationale: צֹאן भेड़-बकरियों के सामूहिक झुंड को सूचित करता है। ‘झुंड के समान’ सामूहिक और चरवाही बिंब दोनों सुरक्षित रखता है।
- source_word: מִשְׁפָּחוֹת
  choice: उसके परिवारों
  rationale: इब्रानी में केवल ‘परिवार’ बहुवचन है, पर प्रसंग में ये दरिद्र व्यक्ति से संबद्ध परिवार हैं। एकवचन אֶבְיוֹן के कारण हिन्दी में ‘उसके’ अधिक सटीक है।
theological_decisions:
- issue: ‘परिवारों’ के साथ निहित संबंधसूचक सर्वनाम
  choice: उसके परिवारों
  alternative: परिवारों
  rationale: मूल पाठ में संबंधसूचक प्रत्यय नहीं है, पर वाक्य का स्वाभाविक संबंध दरिद्र व्यक्ति और परिवारों के बीच है। ‘उसके’ अर्थ को स्पष्ट करता है, बिना कोई नया धर्मवैज्ञानिक दावा जोड़े।
- issue: झुंड की उपमा का आशय
  choice: परिवारों को झुंड के समान बढ़ाता है
  alternative: परिवारों को झुंड के समान बनाता है
  rationale: ‘बढ़ाता है’ बहुलता और फलने-फूलने का संभावित आशय स्पष्ट करता है; फिर भी मूल क्रिया व्यापक ‘रखना/बनाना’ है, इसलिए अधिक शाब्दिक विकल्प पादटिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी; काव्यात्मक गरिमा रखते हुए सहज वाक्य-विन्यास। ‘दरिद्र’ और ‘दुःख’ सामान्य पाठकों के लिए स्पष्ट हैं। ‘ऊँचे, सुरक्षित स्थान’ मूल क्रिया में निहित ऊँचाई और संरक्षण दोनों को व्यक्त करता है।
