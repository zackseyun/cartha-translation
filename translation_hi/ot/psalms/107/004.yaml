  text: वे निर्जन प्रदेश में, उजाड़ राह पर भटकते रहे[a]; बसने के लिए उन्हें कोई नगर नहीं मिला।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वे निर्जन प्रदेश में, बंजर इलाके में भटकते रहे; उन्हें कोई बसा हुआ नगर नहीं मिला।”
    reason: יְשִׁימוֹן और דֶּרֶךְ के संबंध को ‘उजाड़ राह’ के बजाय ‘बंजर इलाके’ के रूप में समझा जा सकता है; עִיר מוֹשָׁב का अर्थ ‘बसने के लिए नगर’ अथवा ‘बसा हुआ नगर’ हो सकता है।
lexical_decisions:
- source_word: תָּעוּ
  choice: भटकते रहे
  rationale: क्रिया תעה दिशा खोकर घूमने या भटकने का भाव देती है। यहाँ नैतिक रूप से पथभ्रष्ट होने का अर्थ आरोपित किए बिना निरंतर भटकाव व्यक्त किया गया है।
- source_word: בַמִּדְבָּר
  choice: जंगल में
  rationale: מִדְבָּר निर्जन वन्य या मरुस्थलीय क्षेत्र को दर्शाता है। हिंदी बाइबलीय और सामान्य प्रयोग में ‘जंगल’ केवल पेड़ों वाला वन नहीं, बल्कि निर्जन वन-प्रदेश भी दर्शा सकता है और पद के काव्यात्मक स्वर को बनाए रखता है।
- source_word: בִּישִׁימוֹן דָּרֶךְ
  choice: उजाड़ राह पर
  rationale: יְשִׁימוֹן उजाड़ या निर्जन स्थान और דֶּרֶךְ राह/मार्ग को दर्शाता है। दोनों को साथ पढ़कर यह संक्षिप्त और स्वाभाविक हिंदी अभिव्यक्ति बनती है; वैकल्पिक वाक्य-विभाजन पादटिप्पणी में सुरक्षित है।
- source_word: עִיר מוֹשָׁב
  choice: बसने के लिए कोई नगर
  rationale: यह पदबंध निवास या बसावट के योग्य नगर का अर्थ देता है। चुनी हुई अभिव्यक्ति आधुनिक हिंदी में सहज है और केवल ‘बसा हुआ नगर’ कहने की अपेक्षा खोजने वालों की आवश्यकता को स्पष्ट रखती है।
- source_word: לֹא מָצָאוּ
  choice: नहीं मिला
  rationale: नकारयुक्त पूर्ण क्रिया उनके खोजने पर भी नगर न मिलने का सीधा कथन करती है; हिंदी में एकवचन ‘नगर’ के साथ यह स्वाभाविक रूप है।
