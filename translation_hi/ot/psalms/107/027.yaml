  yaml_path: translation/ot/psalms/107/027.yaml
  text: They reel and stagger like a drunkard[a], and all their wisdom is swallowed up.
translation:
  language: hi
  text: 'वे मतवाले की तरह चक्कर खाते और लड़खड़ाते हैं,

    और उनकी सारी बुद्धि निगल ली जाती है[a]।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ “बुद्धि” से व्यावहारिक सूझ-बूझ या नाव चलाने का कौशल अभिप्रेत हो सकता है; अर्थात उनका सारा कौशल विफल हो जाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: יָחֹגּוּ
  choice: चक्कर खाते
  rationale: क्रिया यहाँ अस्थिर, घूमती हुई चाल को व्यक्त करती है; ‘चक्कर खाते’ समुद्र में डगमगाते लोगों का सजीव और स्वाभाविक वर्णन है।
- source_word: וְיָנוּעוּ
  choice: और लड़खड़ाते हैं
  rationale: यह हिलने, डोलने या अस्थिर कदम रखने का भाव देती है। ‘लड़खड़ाते’ पहली क्रिया के साथ काव्यात्मक समानांतरता बनाए रखता है।
- source_word: כַּשִּׁכּוֹר
  choice: मतवाले की तरह
  rationale: तुलना नशे में अस्थिर व्यक्ति से है। ‘मतवाला’ संक्षिप्त, प्रतिष्ठित और सामान्य हिन्दी में बोधगम्य है।
- source_word: וְכָל חָכְמָתָם
  choice: और उनकी सारी बुद्धि
  rationale: חָכְמָה का मूल अर्थ ‘बुद्धि’ है। प्रसंग में यह व्यावहारिक सूझ-बूझ या नाव चलाने के कौशल को भी समेटती है, इसलिए मूल की व्यापकता मुख्य पाठ में रखी गई है।
- source_word: תִּתְבַּלָּע
  choice: निगल ली जाती है
  rationale: यह मूल के ‘निगल लिए जाने’ वाले ठोस रूपक और कर्मवाच्य भाव को सुरक्षित रखता है; इससे संकट में उनकी बुद्धि के पूरी तरह निष्प्रभावी हो जाने का अर्थ उभरता है।
