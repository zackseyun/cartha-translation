id: PSA.121.6
reference: Psalms 121:6
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: יוֹמָ֗ם הַ/שֶּׁ֥מֶשׁ לֹֽא יַכֶּ֗/כָּה וְ/יָרֵ֥חַ בַּ/לָּֽיְלָה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/121/006.yaml
  text: By day the sun will not strike you[b][a], nor the moon by night.
translation:
  language: hi
  text: दिन में सूर्य तुझ पर प्रहार न करेगा[a][b], न रात में चन्द्रमा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तुझे हानि नहीं पहुँचाएगा।” इब्रानी क्रिया का मूल अर्थ “मारना” या “प्रहार करना” है, पर इस प्रसंग में उससे हानिकारक प्रभाव का भाव भी निकल सकता है।
    reason: lexical_alternative
  - marker: b
    text: “दिन में ... रात में” की जोड़ी हर समय मिलने वाली व्यापक रक्षा को व्यक्त करती है; सूर्य और चन्द्रमा को शाब्दिक, प्रतीकात्मक, या दोनों अर्थों में समझा जा सकता है।
    reason: cultural_note
lexical_decisions:
- source_word: יוֹמָם
  choice: दिन में
  rationale: यह कालवाचक क्रियाविशेषण है; ‘दिन में’ आधुनिक हिन्दी में स्वाभाविक है और ‘रात में’ के साथ काव्यात्मक समानांतरता बनाए रखता है।
- source_word: הַשֶּׁמֶשׁ
  choice: सूर्य
  rationale: निश्चित संज्ञा का सीधा और गरिमापूर्ण हिन्दी रूप; हिन्दी में यहाँ अलग निश्चित उपपद की आवश्यकता नहीं है।
- source_word: לֹא
  choice: न ... करेगा
  rationale: इब्रानी निषेध को भविष्यत्/अपूर्ण क्रिया के साथ स्वाभाविक हिन्दी निषेध में व्यक्त किया गया है।
- source_word: יַכֶּכָּה
  choice: तुझ पर प्रहार करेगा
  rationale: נכה के ठोस अर्थ ‘मारना/प्रहार करना’ को बनाए रखता है। ‘हानि पहुँचाना’ संदर्भतः सम्भव है, पर अधिक व्याख्यात्मक है। एकवचन द्वितीय पुरुष प्रत्यय के लिए ‘तुझ’ रखा गया है।
- source_word: וְיָרֵחַ
  choice: न ... चन्द्रमा
  rationale: संयोजक וְ दूसरी समानांतर पंक्ति को पहले निषेध के अधीन जोड़ता है; हिन्दी में दोहराया हुआ ‘न’ इस संरचना को स्पष्ट और काव्यात्मक बनाता है।
- source_word: בַּלָּיְלָה
  choice: रात में
  rationale: यह ‘दिन में’ के विपरीत कालवाचक पद है और मूल की समानांतर रचना सुरक्षित रखता है।
theological_decisions:
- issue: प्रतिज्ञात रक्षा का स्वरूप
  choice: सूर्य और चन्द्रमा की ठोस काव्यात्मक छवि को बिना यह तय किए बनाए रखना कि अर्थ शाब्दिक है, रूपकात्मक है, या दोनों।
  alternative: इसे केवल पर्यावरणीय हानि से रक्षा, केवल हर समय की सम्पूर्ण रक्षा, अथवा चन्द्रमा से जुड़ी प्राचीन आशंकाओं के संकेत के रूप में स्पष्ट करना।
  rationale: दिन/रात और सूर्य/चन्द्रमा की जोड़ी व्यापक रक्षा का संकेत दे सकती है, पर पद स्वयं व्याख्यात्मक विकल्पों को निर्णायक रूप से सीमित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। भजन की काव्यात्मक समानांतरता के लिए ‘दिन में ... रात में’ तथा ‘न ... न ...’ संरचना अपनाई गई है। परमेश्वर को सम्बोधित या विश्वासी को सम्बोधित पारम्परिक एकवचन शैली के अनुरूप ‘तुझ’ रखा गया है; ‘प्रहार’ मूल की ठोस छवि को सुरक्षित रखता है।
