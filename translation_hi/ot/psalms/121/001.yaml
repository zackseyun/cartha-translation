  text: A Song of Ascents[a]. I lift up my eyes to the mountains— from where will my help come?
translation:
  language: hi
  text: 'चढ़ाइयों का गीत।

    मैं अपनी आँखें पर्वतों की ओर उठाता हूँ—

    मुझे सहायता कहाँ से मिलेगी?'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שִׁיר
  choice: गीत
  rationale: यह संज्ञा सामान्य रूप से ‘गीत’ का अर्थ देती है; ‘भजन’ कहने से मूल में निहित अर्थ से अधिक विशिष्ट साहित्यिक श्रेणी जुड़ सकती है।
- source_word: לַמַּעֲלוֹת
  choice: चढ़ाइयों का
  rationale: עלה से बनी बहुवचन संज्ञा का मूल भाव ‘ऊपर चढ़ना/चढ़ाइयाँ’ है। यह संक्षिप्त शीर्षक तीर्थयात्रा, सीढ़ियों या रूपकात्मक आरोहण में से किसी एक अर्थ को निश्चित नहीं करता।
- source_word: אֶשָּׂא עֵינַי
  choice: मैं अपनी आँखें ... उठाता हूँ
  rationale: हिब्रू मुहावरे को स्वाभाविक वर्तमानकालीन हिन्दी में रखा गया है; इससे काव्यात्मक तत्क्षणता बनी रहती है।
- source_word: אֶל הֶהָרִים
  choice: पर्वतों की ओर
  rationale: אֶל की दिशात्मकता के लिए ‘की ओर’ स्वाभाविक है, और הָרִים के लिए ‘पर्वत’ उसके सामान्य अर्थ और काव्यात्मक भार को बनाए रखता है।
- source_word: מֵאַיִן יָבֹא עֶזְרִי
  choice: मुझे सहायता कहाँ से मिलेगी?
  rationale: शाब्दिक ‘मेरी सहायता कहाँ से आएगी?’ की अपेक्षा यह आधुनिक हिन्दी में अधिक स्वाभाविक है, जबकि सहायता के स्रोत और भावी अपेक्षा का प्रश्न सुरक्षित रहता है।
theological_decisions:
- issue: दूसरे चरण को कथन माना जाए या प्रश्न
  choice: 'प्रत्यक्ष प्रश्न: ‘मुझे सहायता कहाँ से मिलेगी?’'
  alternative: ‘जहाँ से मेरी सहायता आती है’ जैसा उत्तर-सूचक कथन
  rationale: מֵאַיִן और अपूर्ण क्रिया יָבֹא स्वाभाविक रूप से प्रश्न बनाते हैं। प्रश्नवाचक रूप पद 2 में आने वाले उत्तर से पहले की काव्यात्मक और धर्मवैचारिक उत्कंठा को बनाए रखता है।
- issue: ‘पर्वतों’ का प्रतीकात्मक अर्थ
  choice: ‘पर्वतों’ को बिना व्याख्यात्मक विशेषण के तटस्थ रखा गया
  alternative: उन्हें सिय्योन/मन्दिर, संकट, अथवा झूठी उपासना के स्थानों के रूप में स्पष्ट करना
  rationale: इस पद का हिब्रू पाठ पर्वतों का प्रतीकात्मक मूल्य निर्धारित नहीं करता; अनुवाद में किसी एक व्याख्या को आरोपित नहीं किया गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सहज हिन्दी है। शीर्षक को संक्षिप्त रखा गया है। ‘चढ़ाइयों का गीत’ स्थापित अर्थ-संभावना को बनाए रखते हुए उसके ऐतिहासिक उपयोग की कोई अनिश्चित व्याख्या पाठ में नहीं जोड़ता। अंग्रेज़ी परत में दिया गया ‘hills’ वाला पादलेख मूलतः अंग्रेज़ी शब्द-चयन की वैकल्पिकता है; हिन्दी ‘पर्वत’ पर्याप्त व्यापक और स्वाभाविक होने के कारण अलग पादलेख आवश्यक नहीं समझा गया।
