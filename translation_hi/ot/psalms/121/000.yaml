  language: hi
  text: चढ़ाइयों का गीत। मैं अपनी आँखें पहाड़ों[a] की ओर उठाता हूँ; मेरी सहायता कहाँ से आएगी?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘पहाड़ियों।’
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁיר לַמַּעֲלוֹת
  choice: चढ़ाइयों का गीत
  rationale: इब्रानी पदबंध के बहुवचन और ऊपर चढ़ने के भाव को बनाए रखते हुए स्वाभाविक हिन्दी शीर्षक दिया गया है; इसका सटीक ऐतिहासिक आशय अनिश्चित है।
- source_word: הֶהָרִים
  choice: पहाड़ों
  rationale: यह सामान्य और सीधा अर्थ है; संदर्भ में ‘पहाड़ियों’ की संभावना पादटिप्पणी में रखी गई है।
- source_word: מֵאַיִן
  choice: कहाँ से
  rationale: प्रश्नवाचक अर्थ को बिना यह मान लिए सुरक्षित रखा गया है कि वक्ता पहाड़ों को सहायता का स्रोत मानता है।
- source_word: עֶזְרִי
  choice: मेरी सहायता
  rationale: संज्ञात्मक इब्रानी अभिव्यक्ति को सीधे और स्वाभाविक हिन्दी में प्रस्तुत करता है।
theological_decisions:
- issue: क्या पहाड़ सहायता के स्रोत हैं?
  choice: 'वाक्य को प्रश्न के रूप में रखा गया: ‘मेरी सहायता कहाँ से आएगी?’'
  alternative: ‘क्या मेरी सहायता पहाड़ों से आएगी?’ या पहाड़ों को सहायता का निश्चित स्रोत बताना
  rationale: इब्रानी पाठ केवल स्रोत के विषय में प्रश्न करता है; वह इसी पंक्ति में उत्तर या नकार स्पष्ट नहीं करता।
translation_notes:
  register: भाषा आधुनिक, सरल और गरिमापूर्ण रखी गई है। शीर्षक में ‘चढ़ाइयों’ बहुवचन को सुरक्षित रखता है, जबकि मुख्य पंक्ति में ‘आँखें उठाना’ मूल बिंब को स्वाभाविक हिन्दी में बनाए रखता है।
