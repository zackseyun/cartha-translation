id: PSA.121.7
reference: Psalms 121:7
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: יְֽהוָ֗ה יִשְׁמָרְ/ךָ֥ מִ/כָּל רָ֑ע יִ֝שְׁמֹ֗ר אֶת נַפְשֶֽׁ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/121/007.yaml
  text: Yahweh will keep you from all evil[a]; he will keep your soul.
translation:
  language: hi
  text: याहवे हर बुराई से तुम्हारी रक्षा करेगा; वह तुम्हारे जीवन[a] की रक्षा करेगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “तुम्हारे प्राण” अथवा “तुम स्वयं।” इब्रानी शब्द नेफ़ेश का अर्थ प्रसंग के अनुसार जीवन, स्वयं व्यक्ति, या प्राण/आत्मा हो सकता है।
    reason: नֶפֶשׁ की संदर्भगत और मानव-स्वरूप संबंधी अर्थ-व्याप्ति को सुरक्षित रखना।
lexical_decisions:
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के विशिष्ट वाचा-नाम को सामान्य उपाधि से बदलने के बजाय उसका प्रचलित हिन्दी लिप्यंतरण रखा गया है।
- source_word: יִשְׁמָרְךָ / יִשְׁמֹר
  choice: तुम्हारी रक्षा करेगा / रक्षा करेगा
  rationale: שׁמר में रक्षा करने, संभालने और निगरानी रखने का भाव है। दोनों बार ‘रक्षा करेगा’ कहने से इब्रानी की विषयगत पुनरावृत्ति बनी रहती है और हिन्दी स्वाभाविक रहती है।
- source_word: מִכָּל רָע
  choice: हर बुराई से
  rationale: רָע नैतिक बुराई के साथ हानि, विपत्ति या अनिष्ट को भी सूचित कर सकता है। ‘बुराई’ मूल की व्यापकता को बिना अनावश्यक रूप से सीमित किए बनाए रखता है।
- source_word: נַפְשֶׁךָ
  choice: तुम्हारे जीवन
  rationale: यहाँ נֶפֶשׁ पूरे जीवित व्यक्ति या उसके जीवन को सूचित कर सकता है। ‘जीवन’ आधुनिक हिन्दी में स्पष्ट है और शरीर तथा अमूर्त आत्मा के बीच ऐसा विभाजन नहीं थोपता जिसकी इस पद में आवश्यकता नहीं है।
theological_decisions:
- issue: परमेश्वर के नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में चार अक्षरों वाला विशिष्ट ईश्वरीय नाम सीधे आया है; इसलिए उसे किसी सामान्य उपाधि से बदलने के बजाय लिप्यंतरित किया गया है।
- issue: נַפְשֶׁךָ का संदर्भगत अर्थ
  choice: तुम्हारे जीवन
  alternative: तुम्हारे प्राण; तुम्हारी आत्मा; स्वयं तुम्हारी
  rationale: भजन के इस सुरक्षा-संबंधी संदर्भ में यह शब्द व्यक्ति के जीवन अथवा समूचे व्यक्ति को सूचित करता है। ‘जीवन’ संकीर्ण शरीर–आत्मा द्वैत को थोपे बिना अर्थ व्यक्त करता है; अन्य संभावनाएँ पादटिप्पणी में सुरक्षित हैं।
- issue: רָע का अर्थ-क्षेत्र
  choice: बुराई
  alternative: हानि; अनिष्ट; विपत्ति
  rationale: मूल शब्द नैतिक बुराई और हानिकारक विपत्ति—दोनों का संकेत दे सकता है। व्यापक हिन्दी शब्द चुनकर इस तनाव को खुला रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। समान इब्रानी क्रिया की पुनरावृत्ति को दोनों खंडों में ‘रक्षा करेगा’ दोहराकर दर्शाया गया है।
