  yaml_path: translation/ot/psalms/121/002.yaml
  text: My help comes from Yahweh[b][a], the Maker of heaven and earth.
translation:
  language: hi
  text: 'मेरी सहायता याहवे से आती है[a],

    जो आकाश और पृथ्वी का रचयिता है।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से पहला खंड है, ‘मेरी सहायता याहवे से।’ इब्रानी में यहाँ कोई स्पष्ट सीमित क्रिया नहीं है; स्वाभाविक हिन्दी के लिए ‘आती है’ जोड़ा गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: עֶזְרִי
  choice: मेरी सहायता
  rationale: עֵזֶר का अर्थ ‘सहायता’ है। ‘मेरी सहायता’ संक्षिप्त, स्वाभाविक और भजनकार की व्यक्तिगत निर्भरता को स्पष्ट रूप से व्यक्त करता है।
- source_word: מֵעִם
  choice: से आती है
  rationale: מֵעִם सहायता के स्रोत को दर्शाता है। इब्रानी खंड में स्पष्ट सीमित क्रिया नहीं है; स्वाभाविक हिन्दी में ‘से आती है’ निहित संबंध को व्यक्त करता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: यह चतुरक्षरीय व्यक्तिगत दिव्य नाम का हिन्दी में प्रचलित लिप्यंतरण है; इसे किसी उपाधि से नहीं बदला गया है।
- source_word: עֹשֵׂה
  choice: रचयिता
  rationale: कर्तृवाचक कृदन्त परमेश्वर को सृष्टि करने वाले के रूप में चरित्रित करता है। ‘रचयिता’ इसके पदवी-सदृश और निरंतर पहचान बताने वाले बल को सहज हिन्दी में बनाए रखता है।
- source_word: שָׁמַיִם וָאָרֶץ
  choice: आकाश और पृथ्वी
  rationale: यह समग्र सृष्टि को सूचित करने वाला युग्म है। ‘आकाश और पृथ्वी’ आधुनिक हिन्दी में स्वाभाविक और स्रोत के दोनों पदों के निकट है।
theological_decisions:
- issue: दिव्य नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: मूल पाठ व्यक्तिगत दिव्य नाम का प्रयोग करता है। ‘यहोवा’ हिन्दी पाठकों में सुस्थापित लिप्यंतरण है और नाम को उपाधि ‘प्रभु’ से प्रतिस्थापित नहीं करता।
- issue: עֹשֵׂה का कालगत और पदवी-सदृश बल
  choice: रचयिता
  alternative: जिसने बनाया; जो बनाता है
  rationale: इब्रानी कृदन्त केवल किसी बीती क्रिया पर बल देने के बजाय कर्ता की विशिष्ट पहचान भी बता सकता है। ‘रचयिता’ इस अस्पष्टता को अनावश्यक रूप से भूत या वर्तमान काल में सीमित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। पद की संक्षिप्त स्वीकारोक्ति और समानांतर काव्यात्मक प्रवाह बनाए रखने के लिए दो पंक्तियाँ प्रयोग की गई हैं।
