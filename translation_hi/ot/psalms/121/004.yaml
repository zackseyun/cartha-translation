source:
  edition: WLC
  text: הִנֵּ֣ה לֹֽא יָ֭נוּם וְ/לֹ֣א יִישָׁ֑ן שׁ֝וֹמֵ֗ר יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/121/004.yaml
  text: Look[a], the keeper of Israel neither slumbers nor sleeps.
translation:
  language: hi
  text: देखो[a], इस्राएल का रखवाला न तो ऊँघता है, न सोता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘निश्चय ही, इस्राएल का रखवाला न तो ऊँघेगा, न सोएगा।’
    reason: הִנֵּה के बलसूचक अर्थ और अपूर्ण क्रियाओं के भावी अर्थ की सम्भावना को सुरक्षित रखना।
lexical_decisions:
- source_word: הִנֵּה
  choice: देखो
  rationale: यह कथन की ओर जोर देकर ध्यान खींचता है। आधुनिक हिन्दी में ‘देखो’ स्वाभाविक है और मूल के संकेतात्मक बल को बनाए रखता है।
- source_word: לֹא ... וְלֹא
  choice: न तो ... न
  rationale: दोनों इब्रानी निषेधों को हिन्दी की स्वाभाविक सहसंबंधी रचना में व्यक्त करता है।
- source_word: יָנוּם
  choice: ऊँघता है
  rationale: यह क्रिया उनींदेपन या झपकी लेने को बताती है और अगली क्रिया ‘सोता है’ से उसका अर्थगत भेद बनाए रखती है।
- source_word: יִישָׁן
  choice: सोता है
  rationale: यह सोने की सामान्य क्रिया है; ‘ऊँघता’ के साथ काव्यात्मक क्रम और भेद दोनों स्पष्ट रहते हैं।
- source_word: שֹׁמֵר
  choice: रखवाला
  rationale: कर्ता के रूप में प्रयुक्त कृदंत का अर्थ ‘रक्षा करने वाला’ है। ‘रखवाला’ संक्षिप्त, सहज और भजन में बार-बार आने वाले रक्षा-संबंधी शब्द को व्यक्त करता है।
- source_word: יִשְׂרָאֵל
  choice: इस्राएल
  rationale: इस व्यक्तिवाचक नाम का हिन्दी में प्रचलित बाइबलीय रूप।
theological_decisions:
- issue: परमेश्वर की सतर्कता का मानवीय चित्रण
  choice: इस्राएल के दिव्य रखवाले की निरंतर सतर्कता को ‘न ऊँघता है, न सोता है’ के मूल काव्यात्मक चित्र द्वारा व्यक्त किया गया है।
  alternative: इसे परमेश्वर के सोने में असमर्थ होने के बारे में शाब्दिक दार्शनिक कथन मानना।
  rationale: अनुवाद मानवीय रूपक को अमूर्त व्याख्या में बदलने या मूल से आगे कोई दार्शनिक निष्कर्ष निकालने के बजाय ज्यों का त्यों सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण और काव्यात्मक भाषा। ‘ऊँघता’ तथा ‘सोता’ मूल की दो अलग क्रियाओं का अंतर बनाए रखते हैं।
