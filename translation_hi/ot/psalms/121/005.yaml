lexical_decisions:
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत नाम को उपाधि से बदलने के बजाय देवनागरी में लिप्यंतरित किया गया है।
- source_word: שֹׁמְרֶךָ
  choice: तुम्हारा रखवाला
  rationale: שׁמר के कृदन्त रूप में लगातार रक्षा और देखभाल करने का भाव है। ‘रखवाला’ संज्ञात्मक रूप तथा पूरे भजन में बार-बार आने वाले रक्षा के विषय को बनाए रखता है।
- source_word: צִלְּךָ
  choice: तुम्हारी छाया
  rationale: צל का ठोस अर्थ ‘छाया’ है। यह निकट रहकर धूप से बचाने वाली सुरक्षा का चित्र बनाए रखता है और रूपक को केवल अमूर्त ‘सुरक्षा’ में नहीं बदलता।
- source_word: עַל
  choice: के पास
  rationale: दाहिने हाथ के साथ यह निकट स्थिति को व्यक्त करता है। ‘के पास’ आधुनिक हिन्दी में स्वाभाविक है और निकट रहकर रक्षा करने का भाव देता है।
- source_word: יַד יְמִינֶךָ
  choice: तुम्हारे दाहिने हाथ
  rationale: मूल पाठ के ठोस शारीरिक चित्र को बनाए रखा गया है; इसे केवल ‘दाहिनी ओर’ नहीं किया गया।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: इब्रानी पाठ में वाचा का व्यक्तिगत नाम सीधे प्रयुक्त हुआ है। ‘याहवे’ उसका प्रचलित विद्वत्तापूर्ण लिप्यंतरण है और उसे किसी उपाधि से नहीं बदलता।
- issue: याहवे को ‘छाया’ कहना
  choice: रूपक को ज्यों का त्यों रखा गया
  alternative: याहवे तुम्हारी रक्षा करता है
  rationale: मूल पाठ याहवे को निकट और रक्षक छाया के रूप में चित्रित करता है। अमूर्त व्याख्या करने के बजाय इस काव्यात्मक और धर्मवैचारिक चित्र को सुरक्षित रखा गया है।
