  yaml_path: translation/ot/psalms/121/008.yaml
  text: Yahweh will keep your going out and your coming in from now on and forever[a][b].
translation:
  language: hi
  text: याहवे अब से लेकर सदा तक तेरे बाहर जाने और भीतर आने की रक्षा करेगा[a][b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘याहवे तेरे प्रस्थान और आगमन की रखवाली करेगा।’ ‘बाहर जाना और भीतर आना’ इब्रानी अभिव्यक्ति है, जो व्यापक रूप से मनुष्य के सारे आवागमन या उसके जीवन के पूरे क्रम को दर्शा सकती है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, ‘अब से और सदा तक।’
    reason: literal_rendering
lexical_decisions:
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी परमेश्वर-नाम को उपाधि से बदलने के बजाय उसका प्रचलित हिन्दी लिप्यंतरण रखा गया है।
- source_word: יִשְׁמָר
  choice: रक्षा करेगा
  rationale: שׁמר का अर्थ रक्षा करना, पहरा देना या संभालना है। यहाँ ‘रक्षा करेगा’ स्वाभाविक हिन्दी में भविष्यकालीन संरक्षण व्यक्त करता है और भजन में दोहराए गए मूल भाव को बनाए रखता है।
- source_word: צֵאתְךָ וּבוֹאֶךָ
  choice: तेरे बाहर जाने और भीतर आने
  rationale: दोनों क्रियाओं का ठोस चित्र और मूल क्रम सुरक्षित रखा गया है। यह युग्म व्यापक रूप से व्यक्ति की सारी गतिविधियों या जीवन-यात्रा को भी समेट सकता है।
- source_word: מֵעַתָּה וְעַד עוֹלָם
  choice: अब से लेकर सदा तक
  rationale: यह वर्तमान समय से आरम्भ होकर अनिश्चित भविष्य तक निरन्तर रहने की अवधि को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: परमेश्वर-नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में व्यक्तिगत परमेश्वर-नाम है। ‘याहवे’ उसे उपाधि ‘प्रभु’ से प्रतिस्थापित नहीं करता और आधुनिक विद्वतापूर्ण उच्चारण के निकट है।
- issue: ‘बाहर जाने और भीतर आने’ का व्यापक आशय
  choice: ठोस इब्रानी अभिव्यक्ति को मुख्य पाठ में बनाए रखना
  alternative: तेरे सभी कामों अथवा तेरे पूरे जीवन की रक्षा करेगा
  rationale: यह युग्म समस्त आवागमन या जीवन के पूरे क्रम का द्योतक हो सकता है, पर मुख्य पाठ में केवल व्याख्यात्मक अर्थ रख देने से मूल बिंब और उसकी व्यापकता सीमित हो जाती।
translation_notes:
  register: भाषा आधुनिक, काव्यात्मक और गरिमापूर्ण रखी गई है। एकवचन पुल्लिंग सम्बोधन को ‘तेरे’ से व्यक्त किया गया है; वाक्य-विन्यास हिन्दी में सहज बनाने के लिए काल-सूचक पद को आरम्भ में रखा गया है।
