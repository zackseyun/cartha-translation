source:
  edition: WLC
  text: אַל יִתֵּ֣ן לַ/מּ֣וֹט רַגְלֶ֑/ךָ אַל יָ֝נ֗וּם שֹֽׁמְרֶֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/121/003.yaml
  text: He will not let your foot slip[b][a]; your keeper will not slumber.
translation:
  language: hi
  text: वह तेरे पाँव को फिसलने न देगा[a][b]; तेरा रखवाला ऊँघेगा नहीं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वह तेरे पाँव को फिसलने न दे; तेरा रखवाला न ऊँघे।” इब्रानी क्रियारूपों को शुभकामना या प्रार्थना के साथ-साथ आश्वासन के रूप में भी समझा जा सकता है।
    reason: alternative_reading
  - marker: b
    text: “फिसलने” के स्थान पर “डगमगाने,” “लड़खड़ाने” या “अपनी जगह से हटने” का भाव भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל
  choice: न देगा / नहीं
  rationale: अपूर्ण क्रियाओं के साथ אַל निषेधात्मक इच्छा (‘न होने दे’) भी व्यक्त कर सकता है; भजन के आश्वासनपूर्ण संदर्भ में मुख्य पाठ इसे विश्वासपूर्ण कथन के रूप में प्रस्तुत करता है, जबकि संभावित प्रार्थनात्मक अर्थ पादटिप्पणी में रखा गया है।
- source_word: יִתֵּן
  choice: देगा
  rationale: נתן का मूल अर्थ ‘देना’ है, पर इस रचना में इसका भाव किसी घटना को होने देना है; ‘फिसलने न देगा’ स्वाभाविक हिन्दी मुहावरा है।
- source_word: לַמּוֹט
  choice: फिसलने
  rationale: מוֹט अस्थिर होने, डगमगाने या खिसकने का बोध देता है। ‘पाँव’ के साथ ‘फिसलने’ से ठोस बिंब और अस्थिरता का रूपक दोनों बने रहते हैं।
- source_word: רַגְלֶךָ
  choice: तेरे पाँव
  rationale: इब्रानी में संज्ञा एकवचन और संबोधन पुल्लिंग एकवचन है; हिन्दी में ‘तेरे पाँव’ ठोस बिंब और निकट, काव्यात्मक संबोधन को बनाए रखता है।
- source_word: יָנוּם
  choice: ऊँघेगा
  rationale: נוּם गहरी नींद के बजाय झपकी या तंद्रा को दर्शाता है; ‘ऊँघना’ आधुनिक हिन्दी में इसका सटीक और स्वाभाविक पर्याय है।
- source_word: שֹׁמְרֶךָ
  choice: तेरा रखवाला
  rationale: שׁמר का अर्थ रक्षा करना, निगरानी रखना और संभालना है। ‘रखवाला’ संक्षिप्त है और पूरे भजन में दोहराए गए ‘रक्षा/रखवाली’ के केंद्रीय भाव को बनाए रखता है।
theological_decisions:
- issue: אַל के साथ अपूर्ण क्रियाओं का कथनात्मक अथवा इच्छार्थक बल
  choice: 'मुख्य पाठ में आश्वासन: ‘वह ... न देगा; ... नहीं ऊँघेगा।’'
  alternative: 'प्रार्थना या शुभकामना: ‘वह ... न होने दे; ... न ऊँघे।’'
  rationale: इब्रानी रूप दोनों तरह सुने जा सकते हैं। भजन का व्यापक संदर्भ यहोवा की रक्षा का दृढ़ आश्वासन देता है, इसलिए कथनात्मक अर्थ मुख्य पाठ में है; फिर भी वास्तविक व्याकरणिक अस्पष्टता पादटिप्पणी में सुरक्षित रखी गई है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी। ‘तेरे/तेरा’ भजन के एकवचन संबोधन और काव्यात्मक निकटता को रखता है। ‘ऊँघेगा’ काव्यात्मक होते हुए भी सामान्य पाठक के लिए स्पष्ट है।
