  edition: WLC
  text: שִׁ֥יר הַֽ/מַּֽעֲל֗וֹת לִ/שְׁלֹ֫מֹ֥ה אִם יְהוָ֤ה לֹא יִבְנֶ֬ה בַ֗יִת שָׁ֤וְא עָמְל֣וּ בוֹנָ֣י/ו בּ֑/וֹ אִם יְהוָ֥ה לֹֽא יִשְׁמָר עִ֝֗יר שָׁ֤וְא שָׁקַ֬ד שׁוֹמֵֽר־׀־׀־־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/127/001.yaml
  text: A Song of Ascents[a]. Of Solomon. Unless Yahweh builds the house, its builders labor in vain; unless Yahweh guards the city[c][b], the watchman stays awake in vain.
translation:
  language: hi
  text: 'चढ़ाइयों का गीत। सुलैमान का।[a]


    यदि याहवे घर[b] न बनाए,

    तो उसके बनानेवाले व्यर्थ परिश्रम करते हैं;[c]


    यदि याहवे नगर की रक्षा न करे,

    तो पहरेदार का जागते रहना व्यर्थ है।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “सुलैमान के लिए” अथवा “सुलैमान से संबंधित।” इब्रानी शीर्षक लेखकत्व, समर्पण या संबंध का संकेत दे सकता है।
    reason: alternative_reading
  - marker: b
    text: इब्रानी में “घर” का अर्थ व्यापक रूप से “घराना” या “राजवंश” भी हो सकता है।
    reason: lexical_alternative
  - marker: c
    text: 'इब्रानी में अधिक शाब्दिक रूप से: “उसके बनानेवाले उसमें व्यर्थ परिश्रम करते हैं।”'
    reason: literal_rendering
lexical_decisions:
- source_word: שִׁיר הַמַּעֲלוֹת
  choice: चढ़ाइयों का गीत
  rationale: यह संग्रह-शीर्षक מַעֲלוֹת के बहुवचन और ऊपर चढ़ने के मूल बिंब को बनाए रखता है; केवल तीर्थयात्रा अर्थ मानकर उसे सीमित नहीं करता।
- source_word: לִשְׁלֹמֹה
  choice: सुलैमान का
  rationale: इब्रानी לְ रचना, समर्पण या संबंध का संकेत दे सकता है। संक्षिप्त हिन्दी शीर्षक इस संबंध को खुला रखता है, और वैकल्पिक अर्थ पादटिप्पणी में दिए गए हैं।
- source_word: אִם ... לֹא
  choice: यदि ... न
  rationale: दोनों शर्तवाचक उपवाक्यों का स्वाभाविक हिन्दी रूप है और इब्रानी की समानांतर संरचना को सुरक्षित रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: यह परमेश्वर के व्यक्तिगत नाम יהוה का हिन्दी लिप्यंतरण है, किसी उपाधि से उसका स्थानापन्न नहीं।
- source_word: יִבְנֶה בַיִת
  choice: घर न बनाए
  rationale: ठोस निर्माण-बिंब को नगर और पहरेदार वाले समानांतर पद के साथ बनाए रखता है; घराना या राजवंश जैसे व्यापक अर्थ को मुख्य पाठ में आरोपित नहीं करता।
- source_word: שָׁוְא עָמְלוּ בֹנָיו בוֹ
  choice: उसे बनानेवाले व्यर्थ परिश्रम करते हैं
  rationale: שָׁוְא की निष्फलता और עמל के कठिन श्रम को स्वाभाविक हिन्दी में व्यक्त करता है। בוֹ का संबंध हिन्दी सर्वनाम ‘उसे’ से संदर्भतः स्पष्ट है; उसका अधिक शाब्दिक रूप पादटिप्पणी में सुरक्षित है।
- source_word: יִשְׁמָר עִיר
  choice: नगर की रक्षा न करे
  rationale: שׁמר यहाँ चौकसी द्वारा सुरक्षा करने का अर्थ देता है और अगले पद के पहरेदार-बिंब से मेल खाता है।
- source_word: שָׁקַד שׁוֹמֵר
  choice: पहरेदार का जागते रहना
  rationale: שׁקד की जागरूक और जागते रहने की क्रिया तथा שׁוֹמֵר के नगर-रक्षक अर्थ, दोनों को स्पष्ट रूप से व्यक्त करता है।
theological_decisions:
- issue: יהוה परमेश्वर के नाम का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में चार-अक्षरी व्यक्तिगत नाम सीधे आया है। ‘याहवे’ उसे उपाधि ‘प्रभु’ से नहीं बदलता और ‘यहोवा’ के अपेक्षाकृत बाद के मिश्रित उच्चारण के बजाय प्रचलित विद्वत्तापूर्ण स्वरूप को दर्शाता है।
- issue: בַיִת का अर्थ-क्षेत्र
  choice: घर
  alternative: घराना; राजवंश
  rationale: शब्द के व्यापक पारिवारिक या वंशगत अर्थ संभव हैं, पर नगर और पहरेदार के साथ काव्यात्मक समानता यहाँ ठोस ‘घर’ को मुख्य पाठ के लिए उपयुक्त बनाती है। व्यापक अर्थ पादटिप्पणी में खुला रखा गया है।
- issue: לִשְׁלֹמֹה में संबंध का प्रकार
  choice: सुलैमान का
  alternative: सुलैमान के लिए; सुलैमान से संबंधित
  rationale: शीर्षक का לְ लेखकत्व, समर्पण या संबंध बता सकता है। मुख्य पाठ किसी एक संभावना को निर्णायक रूप से नहीं थोपता; पादटिप्पणी वास्तविक अस्पष्टता बताती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। काव्यात्मक समानांतरता के लिए दोनों अर्ध-पंक्तियों में ‘यदि ... न’ और ‘व्यर्थ’ की पुनरावृत्ति सुरक्षित है। ‘परिश्रम’ और ‘पहरेदार’ ज्ञान-साहित्य की गंभीर शैली के अनुरूप हैं, पर अत्यधिक संस्कृतनिष्ठ नहीं।
