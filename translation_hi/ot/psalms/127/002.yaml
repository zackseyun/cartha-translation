  text: שָׁ֤וְא לָ/כֶ֨ם מַשְׁכִּ֪ימֵי ק֡וּם מְאַֽחֲרֵי שֶׁ֗בֶת אֹ֭כְלֵי לֶ֣חֶם הָ/עֲצָבִ֑ים כֵּ֤ן יִתֵּ֖ן לִֽ/ידִיד֣/וֹ שֵׁנָֽא׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/127/002.yaml
  text: It is in vain for you to rise early[a], to sit up late, eating the bread of toil; for he gives sleep to his beloved.
translation:
  language: hi
  text: तुम्हारे लिए व्यर्थ है कि तुम सुबह जल्दी उठो, देर तक बैठे रहो और कठिन परिश्रम की रोटी खाओ; क्योंकि वह अपने प्रिय को नींद देता है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “क्योंकि वह अपने प्रिय को नींद में भी अपनी देन देता है,” अथवा, “क्योंकि वह अपने प्रिय को उसके सोते समय भी अपनी देन देता है।” इब्रानी वाक्य बहुत संक्षिप्त है। इसका अर्थ यह हो सकता है कि परमेश्वर नींद देता है, या यह कि वह मनुष्य के सोते समय भी उसे अपनी देन देता है।
    reason: alternative_reading
lexical_decisions:
- source_word: שָׁוְא
  choice: व्यर्थ
  rationale: यह प्रसंग में मनुष्य के चिंताग्रस्त और अतिशय श्रम की निष्फलता व्यक्त करता है।
- source_word: מַשְׁכִּימֵי קוּם
  choice: सवेरे जल्दी उठो
  rationale: इब्रानी के जल्दी उठने के भाव को सहज आधुनिक हिन्दी में रखता है।
- source_word: מְאַחֲרֵי שֶׁבֶת
  choice: देर तक बैठे रहो
  rationale: जल्दी उठने के समानांतर देर तक जागकर काम करते रहने का भाव है; ‘बैठे रहो’ मूल बिंब भी बनाए रखता है।
- source_word: אֹכְלֵי לֶחֶם הָעֲצָבִים
  choice: कठिन परिश्रम की रोटी खाओ
  rationale: यह जीविका के लिए कष्टपूर्ण और बोझिल श्रम का मुहावरेदार भाव संप्रेषित करता है, बिना इसे केवल मानसिक दुःख तक सीमित किए।
- source_word: כֵּן
  choice: क्योंकि
  rationale: यहाँ पिछली बात के आधार अथवा उसके विपरीत परमेश्वर के देने को स्वाभाविक हिन्दी में जोड़ता है।
- source_word: יִתֵּן
  choice: देता है
  rationale: सामान्य और सतत सत्य के रूप में वर्तमान काल उपयुक्त है; कर्ता भजन के प्रसंग में परमेश्वर है।
- source_word: לִידִידוֹ
  choice: अपने प्रिय को
  rationale: एकवचन और स्नेहपूर्ण अर्थ दोनों सुरक्षित रहते हैं।
- source_word: שֵׁנָא
  choice: नींद
  rationale: मुख्य पाठ में इसे ‘देता है’ का सीधा कर्म माना गया है; संक्षिप्त इब्रानी वाक्यरचना की दूसरी सम्भावनाएँ पादटिप्पणी में रखी गई हैं।
theological_decisions:
- issue: כֵּן יִתֵּן לִידִידוֹ שֵׁנָא की संक्षिप्त और बहुअर्थी वाक्यरचना
  choice: क्योंकि वह अपने प्रिय को नींद देता है
  alternative: इसी प्रकार वह अपने प्रिय को नींद में देता है; अथवा वह अपने प्रिय को उसके सोते समय देता है
  rationale: שֵׁנָא को ‘देता है’ का सीधा कर्म मानना स्वाभाविक है और चिंतित श्रम के विपरीत परमेश्वर द्वारा विश्राम देने का भाव व्यक्त करता है। फिर भी इसे क्रियाविशेषण की तरह ‘नींद में/सोते समय’ समझना भी व्याकरणतः सम्भव है, इसलिए उस तनाव को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘देर तक बैठे रहो’ मूल इब्रानी बिंब को बनाए रखता है, जबकि ‘कठिन परिश्रम की रोटी’ सामान्य पाठक के लिए मुहावरे का अर्थ स्पष्ट करती है।
