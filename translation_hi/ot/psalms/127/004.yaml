  text: כְּ/חִצִּ֥ים בְּ/יַד גִּבּ֑וֹר כֵּ֝֗ן בְּנֵ֣י הַ/נְּעוּרִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/127/004.yaml
  text: Like arrows in the hand of a warrior[a], so are the sons of one's youth.
translation:
  language: hi
  text: जैसे योद्धा के हाथ में तीर होते हैं, वैसे ही जवानी में जन्मे पुत्र होते हैं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כְּ/חִצִּים
  choice: जैसे ... तीर
  rationale: חִצִּים, חֵץ का बहुवचन है और सामान्यतः ‘तीर’ का अर्थ देता है; כְּ तुलना को व्यक्त करता है।
- source_word: בְּ/יַד
  choice: के हाथ में
  rationale: בְּיַד यहाँ किसी के अधिकार या उपयोग में होने का स्वाभाविक बिंब देता है; हिन्दी में ‘के हाथ में’ इसे स्पष्ट रूप से व्यक्त करता है।
- source_word: גִּבּוֹר
  choice: वीर
  rationale: גִּבּוֹר किसी बलवान अथवा युद्ध-कुशल पुरुष को दर्शाता है। तीरों के प्रसंग में ‘वीर’ संक्षिप्त, गरिमापूर्ण और स्वाभाविक है।
- source_word: כֵּן
  choice: वैसे ही
  rationale: כֵּן पहले उपमान के अनुरूप तुलना का निष्कर्ष प्रस्तुत करता है; ‘वैसे ही’ हिन्दी में इस संरचना को स्वाभाविक रूप से बनाए रखता है।
- source_word: בְּנֵי
  choice: पुत्र
  rationale: בְּנֵי स्पष्ट रूप से पुल्लिंग बहुवचन ‘पुत्र’ है; इसे लिंग-तटस्थ ‘सन्तान’ बनाकर व्यापक नहीं किया गया।
- source_word: הַ/נְּעוּרִים
  choice: जवानी में उत्पन्न हुए
  rationale: शाब्दिक ‘जवानी के पुत्र’ हिन्दी में अस्पष्ट है। इस सन्दर्भ में वाक्यांश का स्वाभाविक आशय व्यक्ति की जवानी में जन्मे पुत्र हैं; ‘उत्पन्न हुए’ इस संबंध को बिना अनावश्यक विस्तार के स्पष्ट करता है।
theological_decisions:
- issue: בְּנֵי הַנְּעוּרִים में लिंग और संबंध
  choice: जवानी में उत्पन्न हुए पुत्र
  alternative: जवानी की सन्तान / जवानी के पुत्र
  rationale: इब्रानी का पुल्लिंग ‘पुत्र’ सुरक्षित रखा गया है। साथ ही, हिन्दी में अस्वाभाविक और संदिग्ध ‘जवानी के पुत्र’ के बजाय उस वाक्यांश का प्रसंगगत संबंध—जवानी में प्राप्त या जन्मे पुत्र—स्पष्ट किया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सूक्तिपरक समानांतर संरचना ‘जैसे... वैसे ही’ सुरक्षित रखी गई है। भाषा सरल और गरिमापूर्ण है।
