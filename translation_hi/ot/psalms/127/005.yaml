base_translation:
  language: en
  yaml_path: translation/ot/psalms/127/005.yaml
  text: Blessed is the man who fills his quiver with them[c][b][a]; they will not be put to shame when they speak with enemies in the gate.
translation:
  language: hi
  text: धन्य है वह पुरुष जिसने अपना तरकश उनसे भर लिया है; वे लज्जित न होंगे[a], जब वे फाटक[c] पर शत्रुओं से बात करेंगे[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “वे शर्मिंदा न होंगे।” कुछ व्याख्याकार कर्ता को केवल पिता मानकर अनुवाद करते हैं, “वह लज्जित न होगा”; इब्रानी क्रियाएँ बहुवचन हैं।
    reason: alternative_reading
  - marker: b
    text: या “जब वे फाटक पर शत्रुओं से वाद-विवाद करेंगे” अथवा “जब वे शत्रुओं के विरुद्ध अपना पक्ष रखेंगे।” इस प्रसंग में क्रिया का न्यायिक या विरोधात्मक भाव हो सकता है।
    reason: lexical_alternative
  - marker: c
    text: प्राचीन नगर में फाटक सार्वजनिक न्याय, कानूनी सुनवाई और नागरिक कामकाज का स्थान होता था।
    reason: cultural_note
lexical_decisions:
- source_word: אַשְׁרֵי
  choice: धन्य है
  rationale: यह बहुवचन रूप मुहावरे के रूप में आशीर्वचन प्रस्तुत करता है; ‘धन्य है’ ज्ञान-साहित्य की गरिमामय शैली को बनाए रखता है।
- source_word: הַגֶּבֶר
  choice: वह पुरुष
  rationale: संज्ञा व्याकरणतः पुल्लिंग है और यहाँ पूर्वपद के अनुसार पिता को संदर्भित करती है; ‘पुरुष’ मूल के लिंग-सटीक अर्थ को सुरक्षित रखता है।
- source_word: מִלֵּא
  choice: भर लिया है
  rationale: इब्रानी पूर्ण क्रिया उस पुरुष की वर्तमान विशेषता को उसके किए हुए कार्य के परिणाम के रूप में दिखाती है; हिंदी में यह प्रयोग स्वाभाविक और अर्थ-सटीक है।
- source_word: אַשְׁפָּתוֹ
  choice: अपना तरकश
  rationale: यह शब्द तीर रखने के पात्र को दर्शाता है; ‘तरकश’ हिंदी में मानक और संक्षिप्त समतुल्य है तथा पिछले पद के तीर-रूपक से जुड़ता है।
- source_word: מֵהֶם
  choice: उनसे
  rationale: यहाँ पूर्वसर्ग भरने की सामग्री बताता है और पिछले पदों के पुत्रों/बालकों की ओर संकेत करता है; ‘उनसे’ मूल संरचना और संदर्भ दोनों को बनाए रखता है।
- source_word: לֹא יֵבֹשׁוּ
  choice: वे लज्जित न होंगे
  rationale: मूल में क्रिया बहुवचन है। ‘लज्जित न होंगे’ सार्वजनिक अपमान और निराशा दोनों की अर्थ-छाया को समेटता है।
- source_word: כִּי
  choice: जब
  rationale: यह उस परिस्थिति का परिचय देता है जिसमें वे लज्जित न होंगे; संदर्भ में कालवाचक ‘जब’ स्वाभाविक है।
- source_word: יְדַבְּרוּ
  choice: बात करेंगे
  rationale: पिएल क्रिया का मूल अर्थ ‘बोलना/बात करना’ है, जबकि इस न्यायिक या विरोधात्मक प्रसंग में वाद-विवाद अथवा मुकदमा लड़ने की संभावना पादटिप्पणी में सुरक्षित रखी गई है।
- source_word: אֶת אוֹיְבִים
  choice: शत्रुओं से
  rationale: דבר के साथ यह रचना उस पक्ष को बताती है जिससे संवाद या सामना हो रहा है; ‘शत्रुओं से’ बिना अनावश्यक विशिष्टीकरण के संबंध व्यक्त करता है।
- source_word: בַּשָּׁעַר
  choice: फाटक पर
  rationale: नगर का फाटक सार्वजनिक न्याय और नागरिक कार्यों का स्थान था; हिंदी में स्थान-सूचक ‘फाटक पर’ स्वाभाविक है।
theological_decisions:
- issue: लिंग-सूचक प्रतिनिधिक भाषा
  choice: वह पुरुष
  alternative: वह व्यक्ति / वह जन
  rationale: मूल शब्द व्याकरणतः पुल्लिंग है और प्रसंग में पिता को दर्शाता है; इसलिए लिंग-निरपेक्ष बनाकर मूल सूचना हटाई नहीं गई।
- issue: לֹא יֵבֹשׁוּ और יְדַבְּרוּ का बहुवचन कर्ता
  choice: वे लज्जित न होंगे ... वे ... बात करेंगे
  alternative: वह लज्जित न होगा ... वह ... बात करेगा
  rationale: मसोरेटिक पाठ में दोनों क्रियाएँ बहुवचन हैं, जो पुरुष और उसके पुत्रों अथवा परिवार को सामूहिक रूप से सूचित कर सकती हैं। मुख्य पाठ इस वास्तविक व्याकरणिक तनाव को एकवचन पिता तक सीमित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिंदी की सहज, गरिमामय और काव्यात्मक शैली रखी गई है। ‘तरकश’ रूपक को अक्षुण्ण रखता है। बहुवचन क्रियाओं की मूल अस्पष्टता मुख्य पाठ और पादटिप्पणी दोनों में सुरक्षित है।
