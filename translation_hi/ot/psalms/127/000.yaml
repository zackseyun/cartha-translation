  text: שִׁ֥יר הַֽ/מַּֽעֲל֗וֹת לִ/שְׁלֹ֫מֹ֥ה אִם יְהוָ֤ה לֹא יִבְנֶ֬ה בַ֗יִת שָׁ֤וְא עָמְל֣וּ בוֹנָ֣י/ו בּ֑/וֹ אִם יְהוָ֥ה לֹֽא יִשְׁמָר עִ֝֗יר שָׁ֤וְא שָׁקַ֬ד שׁוֹמֵֽר־׀־׀־־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/127/000.yaml
  text: A Song of Ascents[a]. Of Solomon. Unless Yahweh builds the house, its builders labor over it in vain. Unless Yahweh guards the city[c][b], the watchman stays awake in vain.
translation:
  language: hi
  text: 'चढ़ाई के गीतों में से एक। सुलैमान का[a]।


    यदि याहवे घर[b] न बनाए,

    तो उसे बनाने वाले व्यर्थ परिश्रम करते हैं[c]।


    यदि याहवे नगर की रक्षा न करे,

    तो पहरेदार व्यर्थ ही जागता रहता है।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “सुलैमान के लिए” अथवा “सुलैमान से संबंधित”; इब्रानी शीर्षक लेखकत्व, समर्पण या संबंध का संकेत दे सकता है।
    reason: alternative_reading
  - marker: b
    text: इब्रानी में “घर” का व्यापक अर्थ “परिवार” या “राजवंश” भी हो सकता है।
    reason: lexical_alternative
  - marker: c
    text: शाब्दिक रूप से, “उसमें व्यर्थ परिश्रम करते हैं।”
    reason: literal_rendering
lexical_decisions:
- source_word: שִׁיר הַמַּעֲלוֹת
  choice: चढ़ाई के गीतों में से एक
  rationale: यह पदबंध तीर्थयात्रा अथवा ऊपर चढ़ने से जुड़े गीतों के संग्रह का शीर्षक है। सहज हिंदी में संग्रहगत अर्थ रखते हुए इसका अनुवाद किया गया है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी परमेश्वर-नाम का लिप्यंतरण किया गया है; इसे सामान्य उपाधि से प्रतिस्थापित नहीं किया गया।
- source_word: בַיִת
  choice: घर
  rationale: मूल अर्थ ‘घर’ है, किंतु इब्रानी प्रयोग में परिवार या राजवंश का व्यापक संकेत भी संभव है; इसे पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: שָׁוְא
  choice: व्यर्थ
  rationale: दोनों समानांतर पंक्तियों में निष्फलता और निरर्थकता का भाव व्यक्त करता है।
- source_word: שָׁקַד
  choice: जागता रहता है
  rationale: क्रिया में जागते और सतर्क बने रहने का भाव है; पहरेदार के संदर्भ में यह स्वाभाविक हिंदी है।
theological_decisions:
- issue: לִשְׁלֹמֹה में संबंध का प्रकार
  choice: सुलैमान का
  alternative: सुलैमान के लिए / सुलैमान से संबंधित
  rationale: उपसर्ग לְ लेखकत्व, समर्पण या संबंध का संकेत दे सकता है। मुख्य पाठ में संक्षिप्त पारंपरिक रूप रखा गया और वास्तविक अस्पष्टता पादटिप्पणी में दी गई।
- issue: घर बनाने और नगर की रक्षा में मानवीय तथा दैवी कार्य का संबंध
  choice: दोनों ‘यदि याहवे…न’ शर्तों और समानांतर मानवीय कार्यों को ज्यों का त्यों रखा
  alternative: मानवीय प्रयास को पूर्णतः निषिद्ध या अनावश्यक बताने वाली व्याख्या
  rationale: पद मनुष्य के परिश्रम और पहरे को मिटाता नहीं, बल्कि याहवे के बिना उनकी निष्फलता बताता है; अनुवाद इस तनाव को बिना विस्तार के सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। काव्यात्मक समानांतरता, शर्तसूचक संरचना और ‘व्यर्थ’ की पुनरावृत्ति सुरक्षित रखी गई है। शीर्षक को मुख्य पद से अलग पंक्ति में रखा गया है।
