id: PSA.127.3
reference: Psalms 127:3
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: הִנֵּ֤ה נַחֲלַ֣ת יְהוָ֣ה בָּנִ֑ים שָׂ֝כָ֗ר פְּרִ֣י הַ/בָּֽטֶן׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/127/003.yaml
  text: Behold[a], children are a heritage from Yahweh, the fruit of the womb a reward.
translation:
  language: hi
  text: देखो[a], संतान यहोवा से मिली विरासत है; गर्भ का फल एक प्रतिफल है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “संतान यहोवा की विरासत है।”
    reason: इब्रानी संबंध-वाचक पदबंध स्वामित्व (‘यहोवा की’) या स्रोत (‘यहोवा से मिली’)—दोनों अर्थ दे सकता है।
lexical_decisions:
- source_word: הִנֵּה
  choice: देखो
  rationale: यह कथन की ओर ध्यान खींचने वाला उद्गार है। आधुनिक हिन्दी में ‘देखो’ काव्यात्मक बल बनाए रखते हुए स्वाभाविक और स्पष्ट है।
- source_word: נַחֲלַת יְהוָה
  choice: यहोवा से मिली विरासत
  rationale: इस संबंध-वाचक रचना का अर्थ ‘यहोवा की विरासत’ अथवा ‘यहोवा से मिली विरासत’ हो सकता है। समानांतर पद ‘प्रतिफल’ के कारण मुख्य पाठ में स्रोत या दान का भाव उपयुक्त है; वैकल्पिक अर्थ पादटिप्पणी में रखा गया है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: इब्रानी चतुरक्षरीय दिव्य नाम को उपाधि में बदलने के बजाय हिन्दी में प्रचलित नामरूप ‘यहोवा’ से व्यक्त किया गया है।
- source_word: בָּנִים
  choice: बच्चे
  rationale: यद्यपि रूप पुल्लिंग बहुवचन है, यहाँ आशय सामान्यतः संतान से है, केवल पुत्रों से नहीं। ‘बच्चे’ साधारण आधुनिक हिन्दी में यही व्यापक अर्थ देता है।
- source_word: שָׂכָר
  choice: प्रतिफल
  rationale: यह शब्द मजदूरी या पुरस्कार का अर्थ दे सकता है। यहाँ सकारात्मक काव्यात्मक समानांतरता में ‘प्रतिफल’ लेन-देन का अनावश्यक भाव घटाते हुए मूल अर्थ बनाए रखता है।
- source_word: פְּרִי הַבָּטֶן
  choice: गर्भ का फल
  rationale: मूल की संतान-संबंधी काव्यात्मक छवि को अक्षुण्ण रखा गया है; यह अभिव्यक्ति हिन्दी में भी बोधगम्य है।
theological_decisions:
- issue: נַחֲלַת יְהוָה में संबंध का प्रकार
  choice: बच्चे यहोवा से मिली विरासत हैं
  alternative: बच्चे यहोवा की विरासत हैं
  rationale: इब्रानी संबंध-वाचक रचना स्रोत और स्वामित्व दोनों अर्थों की अनुमति देती है। ‘प्रतिफल’ के समानांतर होने से मुख्य पाठ में परमेश्वर से मिले दान का अर्थ चुना गया, पर वास्तविक अस्पष्टता पादटिप्पणी में सुरक्षित है।
- issue: दिव्य नाम יְהוָה का रूप
  choice: यहोवा
  alternative: याहवे / प्रभु
  rationale: मूल पाठ में व्यक्तिगत दिव्य नाम है। आधुनिक हिन्दी बाइबलीय प्रयोग में पहचाने जाने योग्य ‘यहोवा’ नाम को रखा गया है, न कि उसे केवल उपाधि ‘प्रभु’ से बदला गया है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण है। ‘देखो’, ‘विरासत’, ‘गर्भ का फल’ और ‘प्रतिफल’ मूल की संक्षिप्त समानांतर काव्य-रचना को बनाए रखते हैं।
