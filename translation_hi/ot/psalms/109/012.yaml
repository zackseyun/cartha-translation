source:
  edition: WLC
  text: אַל יְהִי ל֭/וֹ מֹשֵׁ֣ךְ חָ֑סֶד וְֽ/אַל יְהִ֥י ח֝וֹנֵ֗ן לִ/יתוֹמָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/109/012.yaml
  text: Let there be no one to extend kindness to him[b][a], and let there be no one to show favor to his fatherless children.
translation:
  language: hi
  text: उसके प्रति दया बनाए रखनेवाला कोई न हो,[a] और उसके पिता-विहीन बच्चों पर अनुग्रह दिखानेवाला कोई न हो।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसके प्रति दया बढ़ाते रहनेवाला कोई न हो”; इब्रानी मुहावरे में दया को शाब्दिक रूप से “खींचने” की बात है।
    reason: lexical_alternative
  - marker: b
    text: “पिता-विहीन बच्चों” का अनुवाद “उसके अनाथ बच्चों” भी किया जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: מֹשֵׁךְ
  choice: बनाए रखनेवाला
  rationale: क्रिया का मूल अर्थ ‘खींचना’ है, पर חֶסֶד के साथ यह कृपा को आगे जारी रखने या बनाए रखने का भाव देती है। यह हिंदी में स्वाभाविक रहते हुए इब्रानी मुहावरे का आशय व्यक्त करता है।
- source_word: חָסֶד
  choice: कृपा
  rationale: यहाँ शब्द किसी व्यक्ति को दी जानेवाली दयालु और निष्ठापूर्ण सहायता का संकेत करता है। ‘कृपा’ संक्षिप्त और गरिमापूर्ण है; ‘करुणा’ भी संभव है।
- source_word: חוֹנֵן
  choice: दया करनेवाला
  rationale: חנן अनुग्रह या दयापूर्ण कृपा दिखाने को व्यक्त करता है। संकट में पड़े बच्चों के संदर्भ में ‘दया करना’ आधुनिक हिंदी में सहज है।
- source_word: יְתוֹמָיו
  choice: उसके अनाथ बच्चों
  rationale: יָתוֹם माता-पिता-विहीन, और प्रायः विशेष रूप से पिता-विहीन बच्चे को दर्शाता है। ‘अनाथ बच्चे’ सहज हिंदी है, जबकि वैकल्पिक अनुवाद में अधिक विशिष्ट ‘पितृहीन बच्चे’ दिया गया है।
- source_word: אַל יְהִי
  choice: कोई न हो
  rationale: निषेधात्मक इच्छार्थक रचना ऐसी प्रार्थना या कामना व्यक्त करती है कि ऐसा व्यक्ति उपस्थित न हो। ‘कोई न हो’ उसके सीधे और कठोर स्वर को बनाए रखता है।
theological_decisions:
- issue: अभिशापात्मक प्रार्थना की कठोरता
  choice: इच्छार्थक वाक्य ‘कोई न हो’ को सीधे बनाए रखा गया
  alternative: इसे भविष्यवाणी बनाकर ‘कोई नहीं होगा’ कहना
  rationale: इब्रानी में युस्सिव रूप इच्छा या प्रार्थना व्यक्त करता है। इसे साधारण भविष्यवाणी बनाने से भजन की अभिशापात्मक वाक्शक्ति कम हो जाती।
translation_notes:
  register: आधुनिक मानक हिंदी; स्वर गरिमापूर्ण और सीधा है। अभिशापात्मक प्रार्थना को नरम नहीं किया गया। मुख्य वाक्य में ‘अनाथ’ सहजता के लिए और पादटिप्पणी में ‘पितृहीन’ इब्रानी सामाजिक संदर्भ की विशिष्टता दिखाने के लिए रखा गया है।
