id: PSA.109.20
reference: Psalms 109:20
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: זֹ֤את פְּעֻלַּ֣ת שֹׂ֭טְנַ/י מֵ/אֵ֣ת יְהוָ֑ה וְ/הַ/דֹּבְרִ֥ים רָ֝֗ע עַל נַפְשִֽׁ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/109/020.yaml
  text: This is the reward of my accusers from Yahweh[b][a], and of those who speak evil against my life.
translation:
  language: hi
  text: यह मेरे आरोप लगानेवालों को याहवे की ओर से मिलनेवाला प्रतिफल[a] है, और उनका भी जो मेरे प्राण[b] के विरुद्ध बुरी बातें कहते हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “प्रतिफल” के लिए प्रयुक्त इब्रानी शब्द का मूल अर्थ “काम” या “कर्म” भी हो सकता है; यहाँ संदर्भ में इसका अर्थ प्रतिदान या बदला है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “मेरे प्राण के विरुद्ध।” यहाँ “प्राण” का अर्थ “मेरा जीवन” या “मैं स्वयं” भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: זֹאת פְּעֻלַּת
  choice: यह ... मिलनेवाला प्रतिफल है
  rationale: פְּעֻלָּה का मूल अर्थ ‘काम/कर्म’ है, पर इस दंड-विनती के संदर्भ में यह विरोधियों को यहोवा की ओर से मिलनेवाले प्रतिदान को सूचित करता है। ‘प्रतिफल’ उस अर्थ को स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: שֹׂטְנַי
  choice: मेरे दोष लगानेवालों
  rationale: שׂטן विरोध करने या दोष लगानेवाले व्यक्ति को सूचित कर सकता है। भजन 109 में आरोपपूर्ण वाणी प्रमुख होने के कारण ‘दोष लगानेवाले’ उपयुक्त है।
- source_word: מֵאֵת יְהוָה
  choice: यहोवा की ओर से
  rationale: מֵאֵת स्रोत अथवा कर्ता को दर्शाता है; ‘की ओर से’ हिंदी में इसे सहज रूप से व्यक्त करता है। יְהוָה को उसके व्यक्तिगत नाम ‘यहोवा’ से प्रस्तुत किया गया है।
- source_word: וְהַדֹּבְרִים רָע
  choice: और उनका भी, जो ... बुरा बोलते हैं
  rationale: वाव को स्पष्ट संयोजक अर्थ में रखा गया है। דֹּבְרִים רָע का सीधा और स्वाभाविक अर्थ ‘बुरा बोलते हैं’ है।
- source_word: עַל נַפְשִׁי
  choice: मेरे प्राण के विरुद्ध
  rationale: נֶפֶשׁ यहाँ व्यक्ति, जीवन या प्राण को सूचित कर सकता है। ‘मेरे प्राण’ मूल रूपक और उसकी अर्थगत व्यापकता को बनाए रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल में चार-अक्षरी व्यक्तिगत ईश्वरीय नाम है, कोई उपाधि नहीं। आधुनिक हिंदी बाइबल-पाठकों में परिचित रूप ‘यहोवा’ अपनाया गया है।
- issue: פְּעֻלָּה का दंडात्मक अर्थ
  choice: प्रतिफल
  alternative: काम / कर्म
  rationale: आसपास की शाप-विनती इसे विरोधियों को मिलनेवाले प्रतिदान के रूप में समझने का आधार देती है, फिर भी यह नहीं बताया गया कि प्रतिफल की ठीक प्रकृति क्या है।
- issue: וְהַדֹּבְרִים का संबंध
  choice: दूसरे समन्वित समूह के रूप में—‘और उनका भी’
  alternative: पहले समूह की व्याख्या के रूप में—‘अर्थात उनका, जो’
  rationale: संयोजक וְ का सामान्य अर्थ सुरक्षित रखा गया है; मूल में यह संभव है कि वही लोग आगे वर्णित हों, इसलिए इस संबंध को अत्यधिक निश्चित नहीं बनाया गया।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य हिंदी। मूल के ‘प्राण’ को बनाए रखकर उसकी अर्थगत व्यापकता सुरक्षित की गई है; फुटनोट उसी स्थान पर [a] से चिह्नित है।
