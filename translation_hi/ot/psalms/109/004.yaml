  yaml_path: translation/ot/psalms/109/004.yaml
  text: In return for my love[a], they accuse me, but I am prayer.
translation:
  language: hi
  text: मेरे प्रेम के बदले वे मुझ पर आरोप लगाते हैं, पर मैं तो प्रार्थना हूँ।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अधिक स्पष्ट रूप से इसका अर्थ ‘पर मैं प्रार्थना करता हूँ’ या ‘पर मैं प्रार्थना करने वाला मनुष्य हूँ’ हो सकता है। इब्रानी में शाब्दिक रूप से है, ‘पर मैं प्रार्थना हूँ।’
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּחַת
  choice: के बदले
  rationale: यहाँ शब्द स्थानसूचक ‘नीचे’ नहीं, बल्कि प्रतिदान या विनिमय का भाव व्यक्त करता है; ‘के बदले’ विरोधपूर्ण प्रत्युत्तर को स्वाभाविक हिन्दी में रखता है।
- source_word: אַהֲבָתִי
  choice: मेरे प्रेम
  rationale: यह मूल संज्ञा का सीधा और सहज अनुवाद है तथा प्रेम के सामान्य बाइबलीय अर्थ को सुरक्षित रखता है।
- source_word: יִשְׂטְנוּנִי
  choice: वे मुझ पर आरोप लगाते हैं
  rationale: שׂטן के क्रियात्मक रूप में विरोधी बनकर खड़े होने अथवा अभियोग लगाने का भाव है। इस प्रसंग में ‘आरोप लगाते हैं’ उसके न्यायिक-विरोधी संकेत को स्पष्ट रूप से व्यक्त करता है।
- source_word: וַאֲנִי
  choice: पर मैं तो
  rationale: यद्यपि וְ का मूल अर्थ ‘और’ है, यहाँ शत्रुओं के व्यवहार और वक्ता की प्रतिक्रिया के बीच स्पष्ट विरोध है। ‘पर मैं तो’ इस बल को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: תְפִלָּה
  choice: प्रार्थना हूँ
  rationale: इब्रानी में क्रियारहित, अत्यंत संक्षिप्त कथन ‘मैं प्रार्थना [हूँ]’ है। संज्ञात्मक रूप बनाए रखने से मूल की असाधारण तीव्रता सुरक्षित रहती है।
theological_decisions:
- issue: וַאֲנִי תְפִלָּה की संक्षिप्त संज्ञात्मक अभिव्यक्ति
  choice: पर मैं तो प्रार्थना हूँ
  alternative: पर मैं प्रार्थना करता हूँ; पर मैं प्रार्थना करने वाला मनुष्य हूँ
  rationale: मुख्य पाठ में इब्रानी की शाब्दिक और प्रभावशाली संज्ञात्मक रचना रखी गई है, ताकि उसके अर्थ को अनावश्यक रूप से किसी एक व्याख्यात्मक विस्तार तक सीमित न किया जाए। अधिक स्पष्ट सम्भावनाएँ पाद-टिप्पणी में दी गई हैं।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘मैं तो प्रार्थना हूँ’ जानबूझकर असामान्य है, क्योंकि यह मूल इब्रानी की संक्षिप्त और तीव्र अभिव्यक्ति को सुरक्षित रखता है।
