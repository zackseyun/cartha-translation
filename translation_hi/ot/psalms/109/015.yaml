  yaml_path: translation/ot/psalms/109/015.yaml
  text: May they be before Yahweh continually[a], and may he cut off their memory from the earth.
translation:
  language: hi
  text: वे निरन्तर याहवे के सामने रहें, और वह पृथ्वी से उनका स्मरण मिटा दे।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “देश से”; इब्रानी אֶרֶץ का अर्थ प्रसंग के अनुसार “पृथ्वी,” “भूमि” या “देश” हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: יִהְיוּ
  choice: वे … रहें
  rationale: यहाँ क़ाल अपूर्ण बहुवचन को शाप-प्रार्थना के संदर्भ में इच्छासूचक रूप में लिया गया है; हिंदी में “रहें” इस भाव को स्वाभाविक रूप से व्यक्त करता है।
- source_word: נֶגֶד
  choice: के सामने
  rationale: यह किसी की उपस्थिति में या उसके सम्मुख होने का बोध देता है और प्रसंग के न्यायिक-संबंधपरक भाव को बनाए रखता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: इब्रानी चतुरक्षरीय दिव्य नाम को उपाधि से बदलने के बजाय हिंदी में प्रचलित लिप्यंतरण द्वारा प्रस्तुत किया गया है।
- source_word: תָּמִיד
  choice: निरन्तर
  rationale: यह जारी रहने की अवधि व्यक्त करता है; “निरन्तर” पद की गंभीर शैली के अनुकूल है।
- source_word: וְיַכְרֵת
  choice: और वह … मिटा दे
  rationale: हिफ़ील अपूर्ण को पहली इच्छासूचक क्रिया के समान प्रार्थनात्मक भाव में लिया गया है। स्मृति के संबंध में शाब्दिक “काट डाले” की अपेक्षा “मिटा दे” हिंदी में वही उन्मूलनकारी मुहावरा स्वाभाविक ढंग से देता है।
- source_word: מֵאֶרֶץ
  choice: पृथ्वी से
  rationale: אֶרֶץ का अर्थ “पृथ्वी” या “देश/भूमि” हो सकता है। स्मृति मिटाए जाने के इस मुहावरे में “पृथ्वी” व्यापक निष्कासन का उपयुक्त अर्थ देता है, जबकि वैकल्पिक अर्थ पादटिप्पणी में रखा गया है।
- source_word: זִכְרָם
  choice: उनकी स्मृति
  rationale: यह उनके स्मरण, नाम या स्मारकीय याद के मिट जाने को व्यक्त करता है; “उनकी स्मृति” संक्षिप्त और स्वाभाविक हिंदी है।
theological_decisions:
- issue: पद की शाप-प्रार्थनात्मक/इच्छासूचक शक्ति
  choice: 'दोनों क्रियाओं को इच्छा या प्रार्थना के रूप में प्रस्तुत किया गया है: “रहें … मिटा दे।”'
  alternative: “वे निरन्तर यहोवा के सामने रहेंगे, और वह पृथ्वी से उनकी स्मृति मिटा देगा।”
  rationale: शाप-प्रार्थना के संदर्भ में इब्रानी अपूर्ण क्रियाएँ स्वाभाविक रूप से इच्छासूचक अर्थ रखती हैं। यह अनुवाद कथनात्मक भविष्य बनाकर तनाव को समाप्त नहीं करता।
translation_notes:
  register: आधुनिक मानक हिंदी में संक्षिप्त, गंभीर और प्रार्थनात्मक शैली रखी गई है। “मिटा दे” लक्ष्य भाषा में स्वाभाविक है और स्मृति के पूर्ण उन्मूलन का भाव देता है।
