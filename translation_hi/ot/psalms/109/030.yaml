  text: I will give great thanks to Yahweh with my mouth[b][a]; in the midst of many I will praise him.
translation:
  language: hi
  text: मैं अपने मुँह से याहवे का बहुत धन्यवाद करूँगा; बहुतों के बीच मैं उसकी स्तुति करूँगा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: א֘וֹדֶ֤ה
  choice: धन्यवाद करूँगा
  rationale: हिफ़िल रूप यहाँ भजन-संबंधी उपासना के संदर्भ में धन्यवाद देने का भाव व्यक्त करता है और समानांतर पदबंध ‘स्तुति करूँगा’ के अनुकूल है।
- source_word: יְהוָ֣ה
  choice: यहोवा
  rationale: मूल पाठ में परमेश्वर का विशिष्ट वाचा-नाम है; हिन्दी में प्रचलित और पहचाना जाने वाला लिप्यंतरण ‘यहोवा’ चुना गया है।
- source_word: מְאֹ֣ד
  choice: बहुत
  rationale: यह क्रियाविशेषण धन्यवाद की तीव्रता को सीधे और स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: בְּ/פִ֑/י
  choice: अपने मुँह से
  rationale: בְ यहाँ साधन का बोध कराता है; यह अनुवाद मूल की शारीरिक ठोसता बनाए रखता है।
- source_word: וּ/בְ/ת֖וֹךְ רַבִּ֣ים
  choice: बहुतों के बीच
  rationale: यह मूल के स्थानिक और सामुदायिक भाव को सुरक्षित रखता है, बिना ‘सभा’ जैसे किसी अनकहे विवरण को जोड़ने के।
- source_word: אֲהַֽלְלֶֽ/נּוּ
  choice: मैं उसकी स्तुति करूँगा
  rationale: पिएल रूप का अर्थ यहाँ स्तुति करना है; एकवचन पुल्लिंग प्रत्यय यहोवा की ओर संकेत करता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: विशिष्ट ईश्वरीय नाम को उपाधि से बदलने के बजाय नाम के रूप में रखा गया है। ‘यहोवा’ हिन्दी बाइबलीय परंपरा में अधिक व्यापक रूप से पहचाना जाता है, यद्यपि ‘याहवे’ मूल उच्चारण का संभावित आधुनिक पुनर्निर्माण है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और काव्यात्मक वाक्य-विन्यास। दोनों समानांतर खंडों को स्पष्ट रखा गया है और मूल की सार्वजनिक स्तुति की छवि को ‘बहुतों के बीच’ द्वारा सुरक्षित किया गया है।
