  yaml_path: translation/ot/psalms/109/027.yaml
  text: Let them know that this is your hand; you[a], O Yahweh, have done it.
translation:
  language: hi
  text: वे जान लें[a] कि यह आपके हाथ का काम है; हे याहवे, आपने ही इसे किया है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “और वे जान लें” या “वे जानें”; यहाँ इब्रानी क्रिया संदर्भ में इच्छा या प्रार्थना का भाव व्यक्त कर सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֵדְעוּ
  choice: वे जान लें
  rationale: संदर्भ में संयोजक वाव सहित अपूर्ण क्रिया प्रार्थनात्मक/इच्छासूचक बल रखती है; ‘वे जान लें’ इसे स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: כִּי
  choice: कि
  rationale: यह उस बात की विषय-वस्तु प्रस्तुत करता है जिसे उन्हें जानना है, न कि कारण।
- source_word: יָדְךָ
  choice: आपका हाथ
  rationale: मूल रूपक को बनाए रखता है, जिसमें परमेश्वर की सामर्थ्य और सक्रिय हस्तक्षेप निहित हैं।
- source_word: זֹּאת
  choice: यह
  rationale: स्त्रीलिंग संकेतवाचक सर्वनाम पूर्वोक्त कार्य या हस्तक्षेप की ओर संकेत करता है; ‘यह’ जानबूझकर उसकी व्यापकता बनाए रखता है।
- source_word: אַתָּה
  choice: आपने ही
  rationale: स्वतंत्र सर्वनाम का जोर हिन्दी में ‘ही’ द्वारा स्वाभाविक रूप से व्यक्त होता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: चतुरक्षरीय व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय हिन्दी में प्रचलित लिप्यंतरण ‘यहोवा’ से प्रस्तुत किया गया है।
- source_word: עֲשִׂיתָהּ
  choice: यह किया है
  rationale: क्रिया के स्त्रीलिंग कर्म-प्रत्यय को पूर्वोक्त कार्य की ओर संकेत करने वाले ‘यह’ से व्यक्त किया गया है; पूर्ण कार्य का वर्तमान परिणाम हिन्दी पूर्णकाल से स्पष्ट है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल में व्यक्तिगत ईश्वरीय नाम प्रत्यक्ष है। उसे ‘प्रभु’ जैसी उपाधि से नहीं बदला गया; आधुनिक हिन्दी बाइबलीय प्रयोग में अधिक पहचाने जाने वाले ‘यहोवा’ को चुना गया, जबकि ‘याहवे’ निकटतर वैकल्पिक लिप्यंतरण है।
- issue: אַתָּה का जोर
  choice: आपने ही
  alternative: आपने
  rationale: स्वतंत्र कर्तृवाचक सर्वनाम द्वारा दिए गए जोर को ‘ही’ से सुरक्षित रखा गया, बिना इससे कोई अतिरिक्त धर्मवैज्ञानिक दावा निकाले।
translation_notes:
  register: आधुनिक मानक हिन्दी में आदरसूचक ‘आप’ का प्रयोग किया गया है। भाषा सरल और गरिमापूर्ण है; ‘हाथ’ का मूल रूपक तथा ‘आपने ही’ का जोर सुरक्षित रखा गया है।
