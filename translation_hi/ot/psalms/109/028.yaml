  yaml_path: translation/ot/psalms/109/028.yaml
  text: They may curse[a], but you will bless. They rise up and are put to shame[b], but your servant will rejoice.
translation:
  language: hi
  text: वे भले ही शाप दें[a], पर तू आशीष देगा। वे उठ खड़े हों और लज्जित हों[b], पर तेरा सेवक आनन्दित होगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वे शाप दें, पर तू आशीष दे,” यदि आरम्भिक अपूर्ण क्रियाओं को अधिक विध्यर्थक या अनुमतिसूचक माना जाए।
    reason: alternative_reading
  - marker: b
    text: इब्रानी में, “वे उठ खड़े हों और लज्जित हों।” उठने की क्रिया से विरोधी कार्रवाई का संकेत मिल सकता है, पर पाठ केवल उनके “उठ खड़े होने” की बात कहता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: יְקַֽלְלוּ
  choice: वे भले ही शाप दें
  rationale: पिएल अपूर्ण 3 बहुवचन यहाँ भविष्य, अनुमति अथवा रियायती भाव दे सकता है। ‘भले ही’ विरोधी समानांतरता में रियायती अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है, जबकि वैकल्पिक विध्यर्थक अर्थ पादटिप्पणी में रखा गया है।
- source_word: הֵמָּה
  choice: वे
  rationale: स्वतंत्र सर्वनाम कर्ता और परमेश्वर के बीच विरोध पर बल देता है। हिन्दी में स्पष्ट ‘वे’ इस बल को पर्याप्त रूप से बनाए रखता है।
- source_word: וְ/אַתָּה
  choice: पर तू
  rationale: וְ का मूल अर्थ ‘और’ है, पर यहाँ शाप देनेवालों और परमेश्वर के कार्य का स्पष्ट विरोध है; इसलिए ‘पर’ उपयुक्त है। प्रार्थना में एकवचन सम्बोधन के कारण ‘तू’ रखा गया है।
- source_word: תְבָ֫רֵךְ
  choice: आशीष देगा
  rationale: पिएल अपूर्ण 2 एकवचन शाप के विपरीत परमेश्वर के भावी कार्य को व्यक्त करता है। ‘आशीष देगा’ इस विरोध और भविष्याभिमुखता को सुरक्षित रखता है।
- source_word: קָ֤מוּ
  choice: वे उठ खड़े हुए
  rationale: קום का मूल अर्थ उठना या खड़ा होना है। प्रसंग में विरोधी कार्रवाई निहित हो सकती है, पर मूल पाठ आक्रमण स्पष्ट नहीं करता; अतः उसे अनुवाद में नहीं जोड़ा गया।
- source_word: וַ/יֵּבֹ֗שׁוּ
  choice: और लज्जित किए गए
  rationale: בוש लज्जित अथवा अपमानित होने को दर्शाता है। ‘लज्जित किए गए’ इस शापात्मक प्रसंग में परिणामी सार्वजनिक अपमान को व्यक्त करता है, साथ ही हिब्रू के घटनाक्रम को बनाए रखता है।
- source_word: וְֽ/עַבְדְּ/ךָ֥
  choice: पर तेरा सेवक
  rationale: शाब्दिक अर्थ ‘तेरा सेवक’ है। संयोजक को शत्रुओं की लज्जा और वक्ता के आनन्द के विरोध के कारण ‘पर’ किया गया है।
- source_word: יִשְׂמָֽח
  choice: आनन्दित होगा
  rationale: שמח आनन्दित या प्रसन्न होने को दर्शाता है। अपूर्ण रूप को पद के भविष्याभिमुख प्रवाह के अनुरूप ‘आनन्दित होगा’ किया गया है।
theological_decisions:
- issue: ‘तेरा सेवक’ का सन्दर्भ
  choice: प्रार्थना करनेवाला भजनकार स्वयं को नम्रतापूर्वक परमेश्वर का सेवक कहता है।
  alternative: इसे किसी सामान्य धर्मी सेवक या विशिष्ट मसीही उपाधि के रूप में पढ़ना।
  rationale: तात्कालिक प्रसंग में यह प्रार्थना करनेवाले का आत्म-निर्देश है। अनुवाद किसी ऐसे विशिष्ट मसीही अर्थ को नहीं जोड़ता जिसकी इस पद में अनिवार्य माँग नहीं है।
translation_notes:
  register: आधुनिक मानक हिन्दी में प्रार्थनात्मक और काव्यात्मक गरिमा रखी गई है। परमेश्वर के लिए एकवचन ‘तू’ मूल के निकट और भजन की सीधी प्रार्थना के अनुरूप है। ‘आनन्दित’ सामान्य पाठक के लिए बोधगम्य रहते हुए गरिमापूर्ण है।
