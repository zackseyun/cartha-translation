  yaml_path: translation/ot/psalms/109/010.yaml
  text: May his children wander about and beg[a]; may they seek from their ruins.
translation:
  language: hi
  text: उसके बच्चे मारे-मारे फिरें और भीख माँगें; वे अपने उजड़े ठिकानों से तलाश करें।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अपने उजड़े ठिकानों से दूर तलाश करें।” इब्रानी पूर्वसर्ग का अर्थ स्रोत अथवा पृथक्करण, दोनों हो सकता है।
    reason: מִן के स्रोतवाचक और पृथक्करणवाचक, दोनों सम्भव अर्थों को सुरक्षित रखता है।
lexical_decisions:
- source_word: וְנוֹעַ יָנוּעוּ
  choice: मारे-मारे फिरें
  rationale: क्रिया के साथ प्रयुक्त धातु का निरपेक्ष रूप भटकने की तीव्रता अथवा निरंतरता व्यक्त करता है। हिंदी का यह मुहावरा असहाय होकर लगातार भटकने का भाव स्वाभाविक रूप से देता है।
- source_word: בָנָיו
  choice: उसके बच्चे
  rationale: בנים का अर्थ प्रसंगानुसार ‘बेटे’ या व्यापक रूप से ‘बच्चे’ हो सकता है; यहाँ पारिवारिक वंशजों के लिए स्वाभाविक व्यापक पद चुना गया है।
- source_word: וְשִׁאֵלוּ
  choice: और भीख माँगें
  rationale: שאל का सामान्य अर्थ ‘माँगना’ है, पर भटकने और उजड़े ठिकानों के इस संदर्भ में जीविका के लिए भीख माँगना अभिप्रेत है।
- source_word: וְדָרְשׁוּ
  choice: तलाश करते फिरें
  rationale: דרש का मूल अर्थ ‘ढूँढ़ना/तलाश करना’ है। स्रोत में तलाश की वस्तु व्यक्त नहीं है, इसलिए हिंदी में भी ‘भोजन’ जैसे किसी कर्म को पाठ में नहीं जोड़ा गया।
- source_word: מֵחָרְבוֹתֵיהֶם
  choice: अपने उजड़े ठिकानों में
  rationale: חרבות उजड़े या ध्वस्त स्थानों को दर्शाता है। מן यहाँ उस उजड़े परिवेश को स्रोत-क्षेत्र के रूप में सूचित कर सकता है; सहज हिंदी के लिए ‘में’ रखा गया है, जबकि ‘से दूर’ की पृथक्करण-संबंधी सम्भावना पादटिप्पणी में सुरक्षित है।
