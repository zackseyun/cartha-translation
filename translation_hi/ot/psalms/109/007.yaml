source:
  edition: WLC
  text: בְּ֭/הִשָּׁ֣פְט/וֹ יֵצֵ֣א רָשָׁ֑ע וּ֝/תְפִלָּת֗/וֹ תִּהְיֶ֥ה לַֽ/חֲטָאָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/109/007.yaml
  text: When he is judged[a], let him come out guilty[b], and let his prayer become sin.
translation:
  language: hi
  text: जब उसका न्याय किया जाए, तब वह दोषी ठहरे[a], और उसकी प्रार्थना पाप मानी जाए[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “दोषी निकल आए”; या “दुष्ट ठहरे।”
    reason: lexical_alternative
  - marker: b
    text: या “उसकी प्रार्थना पाप बन जाए।”
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּהִשָּׁפְטוֹ
  choice: जब उसका न्याय किया जाए
  rationale: 'בְּ के साथ שׁפט का निफ़अल infinitive construct और 3ms प्रत्यय यहाँ कालवाचक तथा न्यायिक अर्थ देता है: ‘जब उसका न्याय किया जाए।’'
- source_word: יֵצֵא רָשָׁע
  choice: वह दोषी ठहरे
  rationale: शाब्दिक रूप से ‘वह दोषी निकल आए’; न्यायालयीन संदर्भ में स्वाभाविक हिन्दी ‘दोषी ठहरे’ निर्णय के प्रतिकूल परिणाम को स्पष्ट करती है, जबकि इच्छासूचक बल ‘तब’ वाले विधान में बना रहता है।
- source_word: וּתְפִלָּתוֹ
  choice: और उसकी प्रार्थना
  rationale: תְּפִלָּה का सीधा अर्थ ‘प्रार्थना’ है; संयोजक וּ इसे पहले अभिशापात्मक निवेदन से जोड़ता है।
- source_word: תִּהְיֶה לַחֲטָאָה
  choice: पाप मानी जाए
  rationale: היה + ל यहाँ किसी वस्तु के पाप ठहरने या पाप के रूप में गिने जाने का परिणामसूचक भाव दे सकता है। ‘पाप मानी जाए’ सहज हिन्दी में इसे व्यक्त करता है; ‘पाप बन जाए’ विकल्प के रूप में टिप्पणी में सुरक्षित है।
theological_decisions:
- issue: अभिशापात्मक संदर्भ में क्रियाओं का बल
  choice: 'इच्छा/निवेदन के रूप में: ‘दोषी ठहरे… मानी जाए’'
  alternative: 'भविष्यवाणी के रूप में: ‘दोषी ठहरेगा… पाप मानी जाएगी’'
  rationale: भजन 109 के संदर्भ और समानांतर क्रियारूपों में भजनकार की याचना या इच्छा प्रमुख है; हिन्दी के संभाव्य रूप इस बल को बिना भविष्यवाणी में बदल दिए बनाए रखते हैं।
- issue: רָשָׁע का न्यायिक या नैतिक अर्थ
  choice: दोषी
  alternative: दुष्ट
  rationale: रूप सामान्यतः ‘दुष्ट’ भी हो सकता है, पर ‘न्याय किए जाने’ के स्पष्ट न्यायालयीन संदर्भ में ‘दोषी’ प्रतिकूल निर्णय का अर्थ अधिक स्वाभाविक ढंग से देता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट शैली। ‘न्याय किया जाए’ न्यायिक निष्क्रियता को, और ‘दोषी ठहरे’ अदालती परिणाम को स्वाभाविक हिन्दी में व्यक्त करता है।
