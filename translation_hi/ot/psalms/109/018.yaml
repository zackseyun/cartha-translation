  yaml_path: translation/ot/psalms/109/018.yaml
  text: He clothed himself with cursing as his garment[a]; it came into his inward parts like water[c][b], and like oil into his bones.
translation:
  language: hi
  text: उसने शाप को अपने वस्त्र की तरह पहन लिया[a]; वह पानी की तरह उसके भीतर, और तेल की तरह उसकी हड्डियों में समा गया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसने शाप को अपने चोगे की तरह ओढ़ लिया।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּלְבַּשׁ
  choice: उसने ... पहन लिया
  rationale: लָבַשׁ का मूल अर्थ वस्त्र पहनना है; यह रूपक को स्वाभाविक आधुनिक हिन्दी में बनाए रखता है।
- source_word: קְלָלָה
  choice: शाप
  rationale: यह संज्ञा ‘शाप’ या ‘शाप देना’ सूचित कर सकती है। यहाँ वस्त्र की तरह पहनने और फिर भीतर समाने वाला एकवचन कर्ता होने के कारण ‘शाप’ हिन्दी में अधिक स्वाभाविक है, जबकि उसके अपनाए हुए शापमय व्यवहार का भाव संदर्भ में बना रहता है।
- source_word: כְּמַדּוֹ
  choice: अपने वस्त्र के समान
  rationale: מַד वस्त्र या चोगे को सूचित करता है। ‘वस्त्र’ व्यापक और गरिमापूर्ण है तथा बिना अनावश्यक विशिष्टता के उपमा को सुरक्षित रखता है।
- source_word: וַתָּבֹא
  choice: वह ... समा गया
  rationale: स्त्रीलिंग एकवचन क्रिया पहले आए ‘शाप’ की ओर संकेत करती है। जल और तेल की गहरी पैठ की संयुक्त छवि के लिए ‘समा गया’ प्राकृतिक हिन्दी है।
- source_word: כַמַּיִם
  choice: पानी की तरह
  rationale: मूल उपमा को सीधे और स्पष्ट रूप में रखा गया है।
- source_word: בְּקִרְבּוֹ
  choice: उसके भीतर
  rationale: קֶרֶב का अर्थ भीतरी भाग, अंतर्मन या भीतर हो सकता है। ‘उसके भीतर’ देहगत और व्यापक दोनों संभावनाएँ खुली रखता है।
- source_word: וְכַשֶּׁמֶן
  choice: और तेल की तरह
  rationale: संयोजक और उपमा दोनों सीधे सुरक्षित हैं; यहाँ तेल गहराई तक पैठने की छवि देता है।
- source_word: בְּעַצְמוֹתָיו
  choice: उसकी हड्डियों में
  rationale: בְּ का स्वाभाविक हिन्दी रूप ‘में’ है; गति-सूचक ‘समा गया’ के साथ यह भीतर तक पहुँचने का भाव स्पष्ट करता है।
theological_decisions:
- issue: शापसूचक काव्य और कर्तृत्व
  choice: पद उस व्यक्ति द्वारा अपनाए गए शाप के उसी के भीतर समा जाने का वर्णन करता है; अनुवाद प्रत्यक्ष ईश्वरीय कर्तृत्व नहीं जोड़ता।
  alternative: इसे परमेश्वर द्वारा सीधे आरोपित शाप या केवल मनोवैज्ञानिक परिणाम के रूप में स्पष्ट करना।
  rationale: इब्रानी पाठ यहाँ शाप पहनने वाले व्यक्ति और उसके भीतर प्रवेश करते शाप पर केंद्रित है, पर प्रक्रिया का कारण स्पष्ट नहीं करता; इसलिए धर्मवैचारिक तनाव सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी; काव्यात्मक पर सहज और गरिमापूर्ण। ‘पहन लिया’ तथा ‘समा गया’ मूल की देहगत रूपक-श्रृंखला को स्वाभाविक हिन्दी में रखते हैं।
