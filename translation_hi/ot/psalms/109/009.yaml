lexical_decisions:
- source_word: יִהְיוּ
  choice: हो जाएँ
  rationale: यह रूप यहाँ साधारण भविष्यवाणी नहीं, बल्कि कामना/शापसूचक भाव व्यक्त करता है; हिंदी में ‘हो जाएँ’ इस भाव को स्वाभाविक रूप से रखता है।
- source_word: בָנָיו
  choice: उसके बेटे
  rationale: בֵּן का पुल्लिंग बहुवचन यहाँ विशेष रूप से ‘बेटे’ है, केवल सामान्य ‘बच्चे’ नहीं।
- source_word: יְתוֹמִים
  choice: अनाथ
  rationale: हिब्रू शब्द विशेषतः पिता से वंचित बच्चों को सूचित कर सकता है। ‘अनाथ’ आधुनिक हिंदी में स्वाभाविक है, जबकि पादटिप्पणी यहाँ आशय को स्पष्ट करती है और पत्नी के ‘विधवा’ होने के समानांतर को बनाए रखती है।
- source_word: וְאִשְׁתּוֹ
  choice: और उसकी पत्नी
  rationale: इस संदर्भ में אִשָּׁה प्रत्यय सहित स्पष्टतः ‘उसकी पत्नी’ का अर्थ देता है; संयोजक भी रखा गया है।
- source_word: אַלְמָנָה
  choice: विधवा
  rationale: यह संज्ञा सीधे ‘विधवा’ को दर्शाती है; हिंदी की संक्षिप्त विधेयात्मक रचना में ‘हो जाए’ को दोहराना आवश्यक नहीं है।
theological_decisions:
- issue: भजन का शापसूचक/कामनासूचक भाव
  choice: 'इसे कामना के रूप में प्रस्तुत किया गया है: ‘उसके बेटे ... हो जाएँ।’'
  alternative: 'भविष्यवाणी के रूप में: ‘उसके बेटे अनाथ होंगे, और उसकी पत्नी विधवा होगी।’'
  rationale: क्रिया-रूप और भजन 109 का साहित्यिक संदर्भ साधारण भविष्यवाणी के बजाय प्रार्थना/शापसूचक कामना का समर्थन करते हैं। अनुवाद इस कठोर तनाव को न तो नरम करता है, न विवरण मात्र में बदलता है।
translation_notes:
  register: आधुनिक मानक हिंदी, संक्षिप्त और गरिमापूर्ण। ‘अनाथ’ सामान्य पाठक के लिए ‘पितृहीन’ से अधिक स्वाभाविक है; पादटिप्पणी हिब्रू की विशिष्ट अर्थ-छाया स्पष्ट करती है।
