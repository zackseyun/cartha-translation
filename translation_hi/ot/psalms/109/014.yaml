base_translation:
  language: en
  yaml_path: translation/ot/psalms/109/014.yaml
  text: May the guilt of his fathers be remembered before Yahweh[c][b][a], and may the sin of his mother not be blotted out.
translation:
  language: hi
  text: उसके पुरखाओं का दोष[a][b] याहवे के सामने स्मरण किया जाए, और उसकी माता का पाप मिटाया न जाए।[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘उसके पुरखाओं का अधर्म।’ इब्रानी עָוֹן का अर्थ अधर्म, दोष, अथवा पाप से उत्पन्न दंड-दायित्व हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से ‘उसके पिताओं’; आशय उसके पुरुष पूर्वजों या पुरखाओं से भी हो सकता है।
    reason: lexical_alternative
  - marker: c
    text: या ‘उसकी माता का पाप लेखे से न मिटाया जाए।’
    reason: lexical_alternative
lexical_decisions:
- source_word: יִזָּכֵר
  choice: स्मरण किया जाए
  rationale: זכר का निफ़अल अपूर्ण रूप यहाँ शापात्मक कामना व्यक्त करता है। कर्मवाच्य ‘स्मरण किया जाए’ इब्रानी रूप और प्रसंग, दोनों को बनाए रखता है।
- source_word: עֲוֺן
  choice: दोष
  rationale: עָוֹן पापपूर्णता, दोष अथवा उससे उत्पन्न दंड-दायित्व का बोध करा सकता है। यहाँ ‘दोष’ नैतिक उत्तरदायित्व को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है और मूल की अर्थगत व्यापकता को पूरी तरह संकुचित नहीं करता।
- source_word: אֲבֹתָיו
  choice: उसके पुरखाओं
  rationale: शाब्दिक अर्थ ‘उसके पिताओं’ है, पर बहुवचन में यह पुरुष पूर्वजों को सूचित करता है। ‘पुरखाओं’ से यह भाव सामान्य हिन्दी में अधिक स्वाभाविक ढंग से आता है।
- source_word: אֶל יְהוָה
  choice: याहवे के सामने
  rationale: इस प्रसंग में אֶל, स्मरण किए जाने को परमेश्वर की उपस्थिति और विचार के सामने रखता है। ‘के सामने’ इस न्यायिक भाव को स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
- source_word: וְחַטַּאת
  choice: और ... पाप
  rationale: חַטָּאת यहाँ पापबलि नहीं, बल्कि पाप को सूचित करता है और עָוֹן के समानांतर है।
- source_word: אִמּוֹ
  choice: उसकी माता
  rationale: स्वत्वसूचक संज्ञा का सीधा और गरिमापूर्ण हिन्दी रूप।
- source_word: אַל תִּמָּח
  choice: मिटाया न जाए
  rationale: מחה मिटाने अथवा लेख से पूरी तरह हटा देने की छवि देता है। निषेधात्मक कामना को कर्मवाच्य ‘मिटाया न जाए’ से संक्षिप्त और स्वाभाविक रूप में रखा गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में चार अक्षरों वाला वाचा-नाम सीधे आया है। ‘याहवे’ उसका प्रचलित विद्वत्तापूर्ण लिप्यंतरण है और नाम को उपाधि में बदलने से बचाता है।
- issue: पूर्वजों के दोष के स्मरण की शापात्मक कामना
  choice: कामना को मूल पाठ के अनुसार प्रत्यक्ष रखा गया है
  alternative: इसे कथन, भविष्यवाणी या अनुवादक की स्वीकृति के रूप में नरम करना
  rationale: यह भजन-वक्ता की शापात्मक प्रार्थना है। अनुवाद उसका नैतिक या धर्मवैज्ञानिक तनाव घटाए बिना वाक्य की कामनार्थकता बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सरल और प्रार्थनात्मक रूप अपनाया गया है। ‘माता’ औपचारिक काव्यात्मक स्तर बनाए रखता है, जबकि वाक्य-रचना सामान्य पाठक के लिए स्पष्ट है।
