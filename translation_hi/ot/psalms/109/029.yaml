  text: יִלְבְּשׁ֣וּ שׂוֹטְנַ֣/י כְּלִמָּ֑ה וְ/יַעֲט֖וּ כַ/מְעִ֣יל בָּשְׁתָּֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/109/029.yaml
  text: May my accusers be clothed with disgrace[a], and wrap themselves in their shame like a robe.
translation:
  language: hi
  text: मेरे आरोप लगानेवाले अपमान से ढक जाएँ, और अपनी लज्जा को चोगे की तरह ओढ़ लें।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יִלְבְּשׁוּ
  choice: वस्त्र के समान पहनें
  rationale: לבשׁ के अपूर्ण रूप को इस शाप-प्रार्थना के संदर्भ में इच्छार्थक रूप में प्रस्तुत किया गया है। हिंदी में ‘पहनें’ वस्त्र-रूपक को स्वाभाविक और स्पष्ट रखता है।
- source_word: שׂוֹטְנַי
  choice: मेरे दोष लगानेवाले
  rationale: यह शब्द सामान्य विरोधियों अथवा कानूनी अर्थ में दोष लगानेवालों को सूचित कर सकता है। निकटवर्ती आरोपात्मक संदर्भ के कारण ‘दोष लगानेवाले’ चुना गया, जबकि व्यापक अर्थ पाद-टिप्पणी में सुरक्षित है।
- source_word: כְּלִמָּה
  choice: अपमान
  rationale: यह संज्ञा सार्वजनिक लज्जा, निरादर या अपमान का बोध कराती है। ‘अपमान’ अगली संज्ञा ‘लज्जा’ से अनावश्यक पुनरावृत्ति बचाते हुए अर्थ-क्षेत्र बनाए रखता है।
- source_word: וְיַעֲטוּ
  choice: ओढ़ लें
  rationale: עטה का अर्थ स्वयं को किसी वस्त्र से ढकना या लपेटना है। हिंदी में बाहरी वस्त्र के साथ ‘ओढ़ लें’ स्वाभाविक रूप से इस आत्मवाचक भाव को व्यक्त करता है।
- source_word: כַמְעִיל
  choice: चोगे के समान
  rationale: מְעִיל एक बाहरी लंबा वस्त्र या चोगा है। ‘चोगा’ पूरे शरीर को ढक लेने वाले वस्त्र की छवि स्पष्ट करता है।
- source_word: בָּשְׁתָּם
  choice: अपनी लज्जा
  rationale: संज्ञा लज्जा या अपमान को व्यक्त करती है और इसमें तृतीय पुरुष बहुवचन संबंधसूचक प्रत्यय है। हिंदी की आत्मवाचक रचना में ‘अपनी लज्जा’ वही संबंध स्वाभाविक ढंग से व्यक्त करती है।
theological_decisions:
- issue: शाप-प्रार्थना में क्रियाओं का भाव
  choice: अपूर्ण क्रियाओं को इच्छा/प्रार्थना के रूप में ‘पहनें ... ओढ़ लें’ प्रस्तुत किया गया।
  alternative: भविष्यवाणी के रूप में ‘पहनेंगे ... ओढ़ लेंगे।’
  rationale: भजन 109 की विनतीपूर्ण पृष्ठभूमि में ये रूप इच्छार्थक या शाप-प्रार्थनात्मक अर्थ देते हैं। हिंदी का इच्छार्थक प्रयोग इसे निश्चित भविष्यवाणी बनाए बिना मूल तनाव को बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमामय, सहज और काव्यात्मक भाषा रखी गई है। ‘वस्त्र के समान पहनें’ और ‘चोगे के समान ओढ़ लें’ मूल की समानांतर वस्त्र-छवि को बनाए रखते हैं।
