source:
  edition: WLC
  text: יַ֗עַן אֲשֶׁ֤ר לֹ֥א זָכַר֮ עֲשׂ֪וֹת חָ֥סֶד וַ/יִּרְדֹּ֡ף אִישׁ עָנִ֣י וְ֭/אֶבְיוֹן וְ/נִכְאֵ֨ה לֵבָ֬ב לְ/מוֹתֵֽת׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/109/016.yaml
  text: because he did not remember to show kindness[a], but pursued the poor and needy man, and the brokenhearted[b], to put them to death.
translation:
  language: hi
  text: क्योंकि उसने दया दिखाना याद नहीं रखा[a], बल्कि दीन-दरिद्र मनुष्य और टूटे मनवाले व्यक्ति[b] का पीछा किया, ताकि उन्हें मार डाले।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “करुणा दिखाना याद नहीं रखा।” इब्रानी חֶסֶד का अर्थ निष्ठावान प्रेम या वाचा के प्रति निष्ठा भी हो सकता है, पर यहाँ यह असहाय लोगों के प्रति व्यवहार में दिखाई जानेवाली दया को दर्शाता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “दीन और दरिद्र मनुष्य, और टूटे मनवाला।” इब्रानी में ये शब्द एकवचन हैं और सम्भवतः उस प्रकार के लोगों का प्रतिनिधित्व करते हैं जिन्हें उसने निशाना बनाया।
    reason: lexical_alternative
lexical_decisions:
- source_word: יַעַן אֲשֶׁר
  choice: क्योंकि
  rationale: यह पद आसपास के संदर्भ में दण्ड का कारण बताता है; ‘क्योंकि’ इसके कारणात्मक बल को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: לֹא זָכַר עֲשׂוֹת חָסֶד
  choice: उसने दया करना याद नहीं रखा
  rationale: זָכַר के साथ क्रियार्थक रूप का अर्थ किसी बात को ध्यान में रखकर करने से चूकना है। חֶסֶד में करुणा, कृपा, निष्ठावान प्रेम और वाचा-निष्ठा के अर्थ हो सकते हैं; यहाँ असहाय व्यक्ति के प्रति ठोस व्यवहार के संदर्भ में ‘दया करना’ उपयुक्त है।
- source_word: וַיִּרְדֹּף
  choice: बल्कि ... पीछा किया
  rationale: यह पिछले कथन के विपरीत सक्रिय उत्पीड़न दिखाता है। ‘पीछा किया’ क्रिया की शिकार करने जैसी मूल छवि बनाए रखता है।
- source_word: אִישׁ עָנִי וְאֶבְיוֹן
  choice: दीन-दरिद्र ... मनुष्य
  rationale: ‘दीन-दरिद्र’ दोनों निकटार्थक असुरक्षा-सूचक शब्दों को संक्षिप्त और स्वाभाविक हिन्दी में रखता है, जबकि ‘मनुष्य’ स्रोत के प्रतिनिधिक एकवचन को बनाए रखता है।
- source_word: וְנִכְאֵה לֵבָב
  choice: टूटे मनवाले
  rationale: यह अभिव्यक्ति भीतर से कुचले या आहत व्यक्ति को दर्शाती है; ‘टूटे मनवाले’ भावात्मक बल और एकवचन दोनों को सुरक्षित रखता है।
- source_word: לְמוֹתֵת
  choice: ताकि उसे मार डाले
  rationale: यह पीछा करने के उद्देश्य या परिणाम को व्यक्त करता है। प्रतिनिधिक एकवचन के अनुरूप ‘उसे’ रखा गया है और ‘मार डाले’ घातक आशय को स्पष्ट करता है।
