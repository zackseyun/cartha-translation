translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण और सहज शैली रखी गई है। ‘दीन-दरिद्र’ भजन-साहित्य के अनुकूल है, पर सामान्य पाठक के लिए भी बोधगम्य है। स्रोत का प्रतिनिधिक एकवचन मुख्य पाठ में सुरक्षित रखा गया है और उसकी सामूहिक सम्भावना पादटिप्पणी में स्पष्ट की गई है।
