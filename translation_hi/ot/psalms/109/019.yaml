  text: May it be like a garment that he wraps around himself[a], and like a belt that he always girds on.
translation:
  language: hi
  text: वह उसके लिए ऐसे वस्त्र के समान हो जिसे वह ओढ़ता है,[a] और ऐसे कमरबंद के समान जिसे वह सदा अपनी कमर पर बाँधता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वह उसके लिए ऐसे पहनावे के समान हो जिसे वह पहनता है, और ऐसे पटके के समान जिसे वह निरंतर अपने चारों ओर बाँधता है।”
    reason: עטה और מֵזַח के वैकल्पिक, किंतु संदर्भानुकूल अर्थों को दर्शाने के लिए।
lexical_decisions:
- source_word: תְּהִי
  choice: हो
  rationale: यह היה का स्त्रीलिंग एकवचन इच्छार्थक रूप है; हिंदी में ‘हो’ अभिशाप अथवा कामना का भाव स्वाभाविक रूप से व्यक्त करता है।
- source_word: ל֭וֹ
  choice: उसके लिए
  rationale: पूर्वसर्ग לְ और सर्वनाम-प्रत्यय उस व्यक्ति से संबंध दिखाते हैं जिस पर यह अभिशाप लक्षित है।
- source_word: כְּבֶגֶד
  choice: उस वस्त्र के समान
  rationale: בגד वस्त्र के लिए सामान्य शब्द है; इससे किसी विशेष प्रकार के परिधान का अनावश्यक निर्धारण नहीं होता।
- source_word: יַעְטֶה
  choice: जिसे वह ओढ़ता है
  rationale: עטה का अर्थ स्वयं को किसी वस्त्र से ढकना या लपेटना है। ‘ओढ़ता है’ आवरण की छवि को सहज आधुनिक हिंदी में बनाए रखता है।
- source_word: וּלְמֵזַח
  choice: और उस कमरबंद के समान
  rationale: מֵזַח कमर पर बाँधे जाने वाले पट्टे या कमरबंद को दर्शाता है। ‘कमरबंद’ स्पष्ट और गरिमापूर्ण हिंदी है।
- source_word: תָּמִיד
  choice: सदा
  rationale: यह क्रिया की निरंतरता बताता है; ‘सदा’ संक्षिप्त और स्वाभाविक समतुल्य है।
- source_word: יַחְגְּרֶהָ
  choice: जिसे वह कमर पर बाँधे रहता है
  rationale: חגר कमर पर बाँधने की विशिष्ट क्रिया बताता है, और स्त्रीलिंग कर्म-प्रत्यय पहले उल्लिखित वस्तु की ओर संकेत करता है। यह अनुवाद उस ठोस बिंब को सुरक्षित रखता है।
theological_decisions:
- issue: अभिशाप के संदर्भ में इच्छार्थक क्रिया
  choice: ‘वह ... हो’ के रूप में कामना/प्रार्थना व्यक्त की गई है।
  alternative: ‘वह ... होगा’ के रूप में भविष्यवाणी।
  rationale: इब्रानी इच्छार्थक रूप और भजन 109 का अभिशापात्मक संदर्भ इच्छित न्याय को व्यक्त करते हैं, केवल भविष्य की सूचना को नहीं।
- issue: स्त्रीलिंग ‘वह’ का संदर्भ
  choice: सर्वनाम को स्पष्ट संज्ञा से प्रतिस्थापित किए बिना ‘वह’ रखा गया है।
  alternative: पिछले पद के आधार पर ‘अभिशाप’ या किसी अन्य संज्ञा को स्पष्ट रूप से जोड़ना।
  rationale: इस पद में संदर्भित वस्तु अंतर्निहित है; उसे नाम देने से मूल पाठ की संदर्भगत अस्पष्टता अनावश्यक रूप से सुलझ जाती।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण और सहज शैली रखी गई है। ‘ओढ़ता है’ और ‘कमर पर बाँधे रहता है’ वस्त्र तथा कसकर बाँधने के मूल इब्रानी बिंब को स्पष्ट रखते हैं; इच्छार्थक ‘हो’ अभिशाप की वाक्य-शक्ति को सुरक्षित रखता है।
