lexical_decisions:
- source_word: וַיֶּאֱהַב
  choice: उसने … प्रिय जाना
  rationale: אהב के प्रेम, लगाव और इच्छा के भाव को काव्यात्मक किंतु सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: קְלָלָה
  choice: शाप देना
  rationale: संज्ञा यहाँ शाप देने की प्रवृत्ति या क्रिया को सूचित कर सकती है और विपरीत समानांतर में ‘आशीष’ के सामने आती है; ठोस अर्थ ‘शाप’ भी संभव है, इसलिए उसे पादटिप्पणी में रखा गया है।
- source_word: וַתְּבוֹאֵהוּ
  choice: शाप उसी पर आ पड़ा
  rationale: בוא और पुरुषवाचक कर्म-प्रत्यय का परिणामात्मक अर्थ स्पष्ट करता है। हिन्दी में संज्ञा दोहराने से ‘वह’ के अस्पष्ट संदर्भ से बचते हुए शाप के उसी व्यक्ति पर लौटने का भाव आता है।
- source_word: וְלֹא חָפֵץ
  choice: उसने … से प्रसन्नता नहीं पाई
  rationale: חפץ में इच्छा और आनंद दोनों का भाव है; यह अनुवाद ‘प्रिय जाना’ के भावात्मक विरोध को बनाए रखता है।
- source_word: בִּבְרָכָה
  choice: आशीष
  rationale: קְלָלָה के विपरीत समानांतर में सामान्य श्रेणी के रूप में प्रयुक्त एकवचन संज्ञा का स्वाभाविक हिन्दी समतुल्य है।
- source_word: וַתִּרְחַק מִמֶּנּוּ
  choice: वह उससे दूर रही
  rationale: रחק का मूल भाव दूर होना है। स्त्रीलिंग क्रिया का कर्ता ‘आशीष’ है; ‘दूर रही’ बिना अतिरिक्त कारण जोड़े दूरी के परिणाम को स्वाभाविक हिन्दी में व्यक्त करता है।
