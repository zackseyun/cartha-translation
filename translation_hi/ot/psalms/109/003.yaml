  text: Words of hatred surround me[a], and they fight against me without cause.
translation:
  language: hi
  text: बैर से भरी बातों ने मुझे घेर लिया है, और वे अकारण मुझसे लड़ते हैं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: דִבְרֵי שִׂנְאָה
  choice: बैर से भरी बातों
  rationale: यह पदबंध शाब्दिक रूप से ‘घृणा/बैर की बातें’ है। ‘बैर से भरी बातें’ आधुनिक हिन्दी में स्वाभाविक रहते हुए शत्रुतापूर्ण वाणी का भाव स्पष्ट करता है।
- source_word: סְבָבוּנִי
  choice: मुझे घेर लिया है
  rationale: סבב का अर्थ ‘चारों ओर घेरना’ है। पूर्ण क्रिया को हिन्दी में वर्तमान तक बनी हुई परिणामी दशा के रूप में व्यक्त किया गया है।
- source_word: וַיִּלָּחֲמוּנִי
  choice: वे ... मुझसे लड़ते हैं
  rationale: לחם के निफ़अल रूप में युद्ध या संघर्ष करने का प्रबल भाव है। ‘मुझसे लड़ते हैं’ सहज और स्पष्ट है तथा अनिवार्य रूप से औपचारिक सैन्य युद्ध मान लेने से बचता है।
- source_word: חִנָּם
  choice: अकारण
  rationale: यह क्रियाविशेषण किसी उचित कारण के बिना किए गए अन्यायपूर्ण विरोध को व्यक्त करता है; ‘अकारण’ संक्षिप्त, वर्तमान और गरिमापूर्ण हिन्दी है।
