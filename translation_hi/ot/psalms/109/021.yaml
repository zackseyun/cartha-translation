  text: וְ/אַתָּ֤ה יְה֘וִ֤ה אֲדֹנָ֗/י עֲֽשֵׂה אִ֭תִּ/י לְמַ֣עַן שְׁמֶ֑/ךָ כִּי ט֥וֹב חַ֝סְדְּ/ךָ֗ הַצִּילֵֽ/נִי׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/109/021.yaml
  text: But you[a], O Lord Yahweh, deal with me for your name’s sake; because your steadfast love is good[d][c][b], deliver me.
translation:
  language: hi
  text: परन्तु हे यहोवा, मेरे प्रभु, अपने नाम की खातिर मेरे लिए कार्य कीजिए; क्योंकि आपका अटल प्रेम भला है, मुझे छुड़ाइए।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאַתָּה
  choice: परन्तु...आप
  rationale: पूर्ववर्ती शत्रुतापूर्ण प्रसंग के विपरीत परमेश्वर की ओर मुड़ने का भाव व्यक्त करता है।
- source_word: יְהוָה אֲדֹנָי
  choice: हे प्रभु यहोवा
  rationale: दोनों ईश्वरीय संबोधनों को अलग रखते हुए हिन्दी में स्वाभाविक क्रम अपनाया गया है; अֲדֹנָי को ‘प्रभु’ और יהוה को ‘यहोवा’ कहा गया है।
- source_word: עֲשֵׂה אִתִּי
  choice: मेरी ओर से कार्य कीजिए
  rationale: शाब्दिक ‘मेरे साथ कीजिए’ हिन्दी में अस्पष्ट है; प्रार्थना के संदर्भ में यह वाक्यांश याचक के पक्ष में हस्तक्षेप करने की विनती है।
- source_word: לְמַעַן שְׁמֶךָ
  choice: अपने नाम के कारण
  rationale: यह परमेश्वर के नाम, अर्थात् उनके चरित्र और प्रतिष्ठा, के आधार पर की गई अपील को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: חַסְדְּךָ
  choice: आपकी अटल करुणा
  rationale: חֶסֶד में प्रेम, दया और निष्ठा का समृद्ध भाव है; ‘अटल करुणा’ उसके स्थायी और कृपालु पक्षों को संक्षेप में रखती है।
- source_word: טוֹב
  choice: भली
  rationale: मूल विशेषण का सीधा विधेयात्मक अर्थ बनाए रखता है और ‘करुणा’ के लिंग से मेल खाता है।
- source_word: הַצִּילֵנִי
  choice: मुझे छुड़ाइए
  rationale: संकट से बचाकर निकालने की प्रार्थना को उपयुक्त भजन-संबंधी गरिमा के साथ व्यक्त करता है।
theological_decisions:
- issue: יְהוָה אֲדֹנָי के दोहरे ईश्वरीय संबोधन का अनुवाद
  choice: हे प्रभु यहोवा
  alternative: हे यहोवा, मेरे प्रभु; हे प्रभु परमेश्वर
  rationale: मसोराई पाठ में आए दोनों अलग संबोधनों को एक उपाधि में मिलाया नहीं गया। हिन्दी में ‘प्रभु यहोवा’ स्पष्ट और स्वाभाविक है, यद्यपि ‘मेरे प्रभु’ प्रत्यय-भाव को अधिक प्रत्यक्ष कर सकता है।
- issue: עֲשֵׂה אִתִּי की दिशा
  choice: मेरी ओर से कार्य कीजिए
  alternative: मेरे साथ व्यवहार कीजिए; मेरे लिए कीजिए
  rationale: संदर्भ अनुकूल हस्तक्षेप की याचना सुझाता है, पर क्रिया की व्यापकता को किसी विशेष कार्य तक सीमित नहीं किया गया।
- issue: חֶסֶד का अर्थक्षेत्र
  choice: अटल करुणा
  alternative: अटल प्रेम; करुणा; वाचा की निष्ठा
  rationale: अनुवाद प्रेमपूर्ण दया और स्थिर निष्ठा दोनों की ओर संकेत करता है, बिना ‘वाचा’ को वहाँ स्पष्ट रूप से जोड़ने के जहाँ मूल पद स्वयं उसे नहीं कहता।
translation_notes:
  register: आधुनिक मानक हिन्दी में आदरसूचक ‘आप’ और विनम्र आज्ञार्थक रूप रखे गए हैं। भाषा प्रार्थनात्मक और गरिमामय है, पर अनावश्यक रूप से पुरातन नहीं।
