  yaml_path: translation/ot/psalms/109/000.yaml
  text: For the choirmaster[a]. Of David. A psalm. O God of my praise[b], do not be silent.
translation:
  language: hi
  text: संगीत-निर्देशक के लिए[a]। दाऊद का[b] भजन। हे मेरी स्तुति के परमेश्वर, मौन न रह।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “संगीत के अगुए के लिए”; इब्रानी पद का ठीक आशय निश्चित नहीं है।
    reason: lexical_alternative
  - marker: b
    text: या “दाऊद द्वारा,” “दाऊद के लिए,” अथवा “दाऊद से संबंधित”; इब्रानी शीर्षक अस्पष्ट है।
    reason: alternative_reading
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: संगीत-निर्देशक के लिए
  rationale: भजनों के शीर्षकों में यह पद संगीत के संचालन से जुड़े प्रमुख व्यक्ति के लिए प्रयुक्त पारंपरिक तकनीकी अभिव्यक्ति है; अर्थ की अनिश्चितता को पादटिप्पणी में रखा गया है।
- source_word: מִזְמוֹר
  choice: भजन
  rationale: तार वाले संगीत से संबद्ध गीत के लिए प्रचलित और स्वाभाविक हिन्दी पद।
- source_word: אֱלֹהֵי תְהִלָּתִי
  choice: हे मेरी स्तुति के परमेश्वर
  rationale: 'इब्रानी संबंधवाचक रचना को खुला रखता है: परमेश्वर वह हैं जिनकी भजनकार स्तुति करता है, और वाक्यांश को अधिक व्याख्यात्मक बनाकर किसी एक सूक्ष्म अर्थ तक सीमित नहीं करता।'
- source_word: אַל־תֶּחֱרַשׁ
  choice: मौन न रह
  rationale: इब्रानी निषेधात्मक निवेदन का सीधा और गरिमापूर्ण रूप; संकट में परमेश्वर से हस्तक्षेप की पुकार को बनाए रखता है।
theological_decisions:
- issue: לְדָוִד में दाऊद से संबंध का स्वरूप
  choice: दाऊद का
  alternative: दाऊद द्वारा; दाऊद के लिए; दाऊद से संबंधित
  rationale: इब्रानी לְ संबंध, रचनाकारिता, समर्पण या संबद्धता दर्शा सकता है। मुख्य पाठ में पारंपरिक संक्षिप्त रूप रखा गया है और वास्तविक अस्पष्टता पादटिप्पणी में बताई गई है।
- issue: אֱלֹהֵי תְהִלָּתִי का संबंध
  choice: मेरी स्तुति के परमेश्वर
  alternative: हे परमेश्वर, जिसकी मैं स्तुति करता हूँ; हे परमेश्वर, जो मेरी स्तुति के योग्य हैं
  rationale: मूल की संक्षिप्त संबंधवाचक अभिव्यक्ति को बनाए रखा गया है ताकि इसे केवल स्तुति के विषय, प्राप्तकर्ता या आधार के अर्थ में सीमित न किया जाए।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण भजन-शैली अपनाई गई है। शीर्षक के खंडित रूप को मूल के अनुरूप रखा गया है। परमेश्वर को संबोधित करते हुए मूल के सीधे एकवचन आग्रह के अनुरूप “मौन न रह” चुना गया है, न कि अधिक व्याख्यात्मक या सम्मानसूचक विस्तार।
