  text: My knees give way from fasting[a], and my flesh grows lean from lack of fat.
translation:
  language: hi
  text: उपवास के कारण[a] मेरे घुटने लड़खड़ा रहे हैं, और मेरी देह चर्बी के अभाव में दुबली हो गई है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मेरी देह चर्बी न रहने से क्षीण हो गई है।” इब्रानी अभिव्यक्ति शरीर की चर्बी घट जाने, अर्थात अत्यधिक दुबलेपन, की ओर संकेत करती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּרְכַּי
  choice: मेरे घुटने
  rationale: बहुवचन रूप और प्रथम पुरुष एकवचन प्रत्यय का सीधा तथा स्वाभाविक हिन्दी अनुवाद।
- source_word: כָּשְׁלוּ
  choice: लड़खड़ा रहे हैं
  rationale: क्रिया लड़खड़ाने, डगमगाने या निर्बल होकर चूकने का भाव देती है; यहाँ शारीरिक कमजोरी के संदर्भ में यह स्वाभाविक है।
- source_word: מִצּוֹם
  choice: उपवास के कारण
  rationale: מִן यहाँ कारण बताता है; उपवास से उत्पन्न कमजोरी स्पष्ट की गई है, बिना इसे सामान्यतः भोजन की कमी में बदलने के।
- source_word: וּבְשָׂרִי
  choice: और मेरी देह
  rationale: בשר का मूल अर्थ मांस/देह है; इस शारीरिक वर्णन में 'देह' आधुनिक हिन्दी में अधिक सहज है और ठोस शारीरिक अर्थ बनाए रखता है।
- source_word: כָּחַשׁ
  choice: दुबली हो गई है
  rationale: क्रिया का अर्थ दुबला या क्षीण हो जाना है; पूर्णतासूचक हिन्दी रूप इब्रानी के पूर्ण क्रियारूप को दर्शाता है।
- source_word: מִשָּׁמֶן
  choice: चर्बी के अभाव में
  rationale: वाक्यांश शरीर की चर्बी घटने या न रहने से हुई कृशता बताता है; यह अनुवाद इब्रानी बिंब को समझने योग्य रूप में बनाए रखता है।
