  choice: दरिद्र
  rationale: यह शब्द आर्थिक अभाव के साथ असहायता और आवश्यकता का भाव रखता है; ‘दरिद्र’ आधुनिक हिन्दी में संक्षिप्त, गरिमापूर्ण और प्रसंगानुकूल है।
- source_word: לְהוֹשִׁיעַ
  choice: बचाए
