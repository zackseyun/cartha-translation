- source_word: מִשֹּׁפְטֵי
  choice: न्याय करनेवालों से
  rationale: यह कृदन्त न्यायाधीशों अथवा उसके विरुद्ध निर्णय सुनानेवालों को सूचित कर सकता है; मुख्य पाठ में ‘न्याय’ मूल की न्यायिक अस्पष्टता को बनाए रखता है और ‘दोषी ठहराना’ अनावश्यक रूप से नहीं जोड़ता।
- source_word: נַפְשׁוֹ
  choice: उसके प्राण का
  rationale: נֶפֶשׁ यहाँ व्यक्ति के प्राण, जीवन या स्वयं व्यक्ति को सूचित कर सकता है। ‘प्राण’ जीवन पर आए संकट की गंभीरता को बनाए रखते हुए इसे केवल देह से अलग अमूर्त आत्मा के अर्थ में सीमित नहीं करता।
theological_decisions:
- issue: נֶפֶשׁ का मानवशास्त्रीय अर्थ
  choice: ‘प्राण’ रखा गया
  alternative: ‘जीवन’, ‘स्वयं उसका’ या ‘आत्मा’
  rationale: प्रसंग शत्रुतापूर्ण न्याय और बचाव का है। मूल शब्द जीवन अथवा पूरे व्यक्ति को दर्शा सकता है; ‘प्राण’ इस व्यापकता और धार्मिक-काव्यात्मक गरिमा को पर्याप्त रूप से बनाए रखता है, जबकि पादटिप्पणी अन्य संभव अर्थ स्पष्ट करती है।
- issue: מִשֹּׁפְטֵי की न्यायिक भूमिका
  choice: ‘न्याय करनेवाले’
  alternative: ‘उसके न्यायी’ या ‘उसे दोषी ठहरानेवाले’
  rationale: मूल रूप उन व्यक्तियों को दर्शा सकता है जो औपचारिक न्यायी हैं या जो उसके विरुद्ध निर्णय देते हैं। मुख्य पाठ किसी एक अर्थ को अंतिम नहीं बनाता।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण काव्यात्मक गद्य रखा गया है। ‘दाहिने हाथ खड़ा रहता है’ मूल चित्र को सुरक्षित रखता है, और कठिन पर अर्थपूर्ण न्यायिक वाक्यांश के साथ पादटिप्पणियाँ वास्तविक इब्रानी अस्पष्टता स्पष्ट करती हैं।
