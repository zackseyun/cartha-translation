base_translation:
  language: en
  yaml_path: translation/ot/psalms/109/031.yaml
  text: For he stands at the right hand of the poor[b][a], to save him from those who judge his soul.
translation:
  language: hi
  text: क्योंकि वह दरिद्र के दाहिने हाथ पर खड़ा रहता है, ताकि उसे उसके प्राण का न्याय करने वालों[a][b] से बचाए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उसके न्यायियों”; इब्रानी उन लोगों को सूचित कर सकता है जो उसके न्यायी बने हैं या, अधिक व्यापक अर्थ में, जो उसके विरुद्ध निर्णय सुनाते हैं।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी शब्द का अर्थ प्रसंग के अनुसार “प्राण”, “जीवन” या स्वयं व्यक्ति हो सकता है।
    reason: lexical_alternative
