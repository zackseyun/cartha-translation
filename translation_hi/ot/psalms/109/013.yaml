lexical_decisions:
- source_word: יְהִי
  choice: '... जाए'
  rationale: היה के क़ाल आज्ञार्थक रूप का इच्छासूचक/अभिशापात्मक बल आधुनिक हिन्दी में कर्मवाच्य विधिलिंग से स्वाभाविक रूप में व्यक्त होता है।
- source_word: אַחֲרִיתוֹ
  choice: उसकी संतान
  rationale: शब्द का अर्थ ‘अंत’, ‘भविष्य’ या आगे बनी रहने वाली वंश-परंपरा हो सकता है। अगले खंड में अगली पीढ़ी और ‘उनका नाम’ आने के कारण यहाँ ‘संतान’ संदर्भानुकूल है।
- source_word: לְהַכְרִית
  choice: मिटा दी जाए
  rationale: כרת के हिफ़ील क्रियार्थक संज्ञा-रूप में काट डालने अथवा समाप्त कर देने का परिणाम निहित है; ‘मिटा दी जाए’ वंश के संदर्भ में स्पष्ट और स्वाभाविक हिन्दी है।
- source_word: בְּדוֹר אַחֵר
  choice: अगली पीढ़ी में
  rationale: शाब्दिक रूप से ‘दूसरी/अन्य पीढ़ी में’; संदर्भ में इसके बाद आने वाली पीढ़ी अभिप्रेत है।
- source_word: יִמַּח
  choice: मिटा दिया जाए
  rationale: מחה के निफ़ाल रूप का अर्थ मिटा दिया जाना है; ‘नाम’ के साथ यह हिन्दी में स्वाभाविक है और मूल बिंब को बनाए रखता है।
- source_word: שְׁמָם
  choice: उनका नाम
  rationale: बहुवचन प्रत्यय संतति के अनेक सदस्यों की ओर संकेत करता है, जबकि ‘नाम’ एकवचन सामूहिक पहचान या स्मृति को दर्शाता है।
theological_decisions:
- issue: पद का अभिशापात्मक प्रार्थना-बल
  choice: दुष्ट व्यक्ति की वंश-परंपरा के विरुद्ध प्रार्थना/कामना के रूप को बनाए रखा गया
  alternative: इसे उसके भविष्य के बारे में केवल एक भविष्यवाणी के रूप में प्रस्तुत करना
  rationale: इच्छासूचक क्रियारूप और भजन 109 का संदर्भ न्याय की प्रार्थना व्यक्त करते हैं। अनुवाद इसकी कठोरता को नरम किए बिना, इसे निर्वैयक्तिक भविष्यवाणी भी नहीं बनाता।
- issue: אַחֲרִיתוֹ की संदिग्धता
  choice: मुख्य पाठ में ‘उसकी संतान’
  alternative: ‘उसका अंत’ अथवा ‘उसका भविष्य’
  rationale: ‘अगली पीढ़ी’ और ‘उनका नाम’ वंशगत अर्थ का समर्थन करते हैं, पर वास्तविक शाब्दिक विकल्प को पादटिप्पणी में सुरक्षित रखा गया है।
