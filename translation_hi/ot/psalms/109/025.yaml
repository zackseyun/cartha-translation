  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חֶרְפָּה
  choice: निन्दा का पात्र
  rationale: यह संज्ञा अपमान, तिरस्कार या निन्दा की वस्तु होने का भाव रखती है; ‘निन्दा का पात्र’ हिन्दी में स्वाभाविक ढंग से उस अर्थ को व्यक्त करता है।
- source_word: יְנִיעוּן רֹאשָׁם
  choice: सिर हिलाते हैं
  rationale: इब्रानी मुहावरे का सीधा और स्वाभाविक हिन्दी रूप; सन्दर्भ में यह उपहास या तिरस्कार का संकेत है, पर उस भाव को मुख्य पाठ में स्पष्ट करके मूल की अभिव्यक्ति से आगे नहीं बढ़ाया गया।
- source_word: הָיִיתִי
  choice: बन गया
  rationale: पूर्ण क्रिया यहाँ उस स्थिति में पहुँचने को व्यक्त कर सकती है; इसलिए अंग्रेज़ी परामर्श-पाठ के ‘became’ के अनुरूप और इब्रानी से संगत रूप चुना गया।
