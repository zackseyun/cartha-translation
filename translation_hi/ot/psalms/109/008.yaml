  choice: पद
  alternative: देखरेख का दायित्व; जिम्मेदारी; नियुक्त भूमिका
  rationale: मूल इब्रानी किसी सौंपी हुई जिम्मेदारी या नियुक्त भूमिका को दर्शाता है। ‘पद’ इस अर्थ को समेटता है और बाद के उद्धरण से स्वाभाविक संबंध बनाए रखता है, पर भजन में किसी विशिष्ट कलीसियाई पद का तकनीकी अर्थ नहीं जोड़ता।
