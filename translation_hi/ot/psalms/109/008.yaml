lexical_decisions:
- source_word: יִהְיוּ
  choice: हों
  rationale: संदर्भ में यह रूप साधारण भविष्य नहीं, बल्कि कामना अथवा शापसूचक इच्छा व्यक्त करता है; हिंदी का संभावनार्थक रूप ‘हों’ इसे स्वाभाविक ढंग से व्यक्त करता है।
- source_word: יָמָיו
  choice: उसके दिन
  rationale: बहुवचन संज्ञा और तृतीय पुरुष एकवचन प्रत्यय का सीधा अनुवाद; यहाँ जीवनकाल के दिनों का संकेत है।
- source_word: מְעַטִּים
  choice: थोड़े
  rationale: यह दिनों की कम संख्या को सीधे व्यक्त करता है और प्रसंग में छोटे जीवनकाल का भाव देता है।
- source_word: פְּקֻדָּתוֹ
  choice: उसका पद
  rationale: इब्रानी शब्द सौंपी गई जिम्मेदारी, देखरेख या नियुक्त भूमिका को दर्शा सकता है। ‘पद’ संक्षिप्त और स्वाभाविक है तथा किसी विशिष्ट धार्मिक पद को अनावश्यक रूप से आरोपित नहीं करता।
- source_word: יִקַּח
  choice: ले ले
  rationale: समानांतर शापसूचक वाक्य में यह इच्छा या आदेश-जैसा भाव रखता है; ‘ले ले’ हिंदी में उसी कामनार्थक बल को स्वाभाविक रूप से व्यक्त करता है।
- source_word: אַחֵר
  choice: कोई दूसरा
  rationale: यह अनिश्चित अन्य व्यक्ति के अर्थ को स्पष्ट और सहज हिंदी में व्यक्त करता है।
