  text: May a creditor seize all that belongs to him[a], and may strangers plunder the fruit of his labor.
translation:
  language: hi
  text: लेनदार उसकी सारी संपत्ति पर कब्ज़ा कर ले[a], और पराए लोग उसकी मेहनत की कमाई लूट लें।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “फँसा ले”; इब्रानी क्रिया का अर्थ फंदा लगाना या पकड़ना हो सकता है। यहाँ संभवतः आशय है कि लेनदार उसकी संपत्ति पर दावा करके उसे अपने कब्ज़े में कर ले।
    reason: lexical_alternative
lexical_decisions:
- source_word: יְנַקֵּשׁ
  choice: कब्ज़ा कर ले
  rationale: क्रिया का मूल भाव फँसाने या पकड़ने का है; किन्तु נוֹשֶׁה (‘साहूकार’) और सारी सम्पत्ति के संदर्भ में यह ऋणदाता द्वारा उसकी सम्पत्ति पर आक्रामक ढंग से अधिकार करने को दर्शाता है।
- source_word: נ֭וֹשֶׁה
  choice: साहूकार
  rationale: यह शब्द उधार देने और वसूली का दावा रखने वाले व्यक्ति को दर्शाता है। ‘साहूकार’ आधुनिक हिन्दी में इस आर्थिक और कठोर वसूली वाले संदर्भ को स्वाभाविक रूप से व्यक्त करता है।
- source_word: לְכָל אֲשֶׁר לוֹ
  choice: उसकी सारी सम्पत्ति
  rationale: यह पद उसकी सभी वस्तुओं और अधिकार की चीज़ों को समग्र रूप से दर्शाता है।
- source_word: וְיָבֹזּוּ
  choice: लूट लें
  rationale: בזז बलपूर्वक लूट लेने को दर्शाता है; ‘लूट लें’ हिंसक और शोषक भाव को स्पष्ट रखता है।
- source_word: זָרִים
  choice: पराए लोग
  rationale: यह अपने परिवार या समुदाय से बाहर के लोगों को दर्शाता है; ‘पराए लोग’ जातीयता या राष्ट्रीयता को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: יְגִיעוֹ
  choice: उसकी मेहनत की कमाई
  rationale: यह केवल श्रम करने की क्रिया नहीं, बल्कि परिश्रम से प्राप्त उपज या लाभ को दर्शाता है; ‘मेहनत की कमाई’ आधुनिक हिन्दी में यही अर्थ स्वाभाविक रूप से देती है।
theological_decisions:
- issue: शापसूचक कामनार्थक बल
  choice: क्रियाओं को कामना/शाप के रूप में ‘कर ले’ और ‘लूट लें’ प्रस्तुत किया गया है।
  alternative: 'साधारण भविष्यवाणी: ‘कब्ज़ा कर लेगा’ और ‘लूट लेंगे’।'
  rationale: भजन 109 के शापसूचक संदर्भ में अपूर्ण क्रियारूप साधारण भविष्यवाणी से अधिक कामना या प्रार्थना व्यक्त करते हैं। हिन्दी के आज्ञार्थक-कामनार्थक रूप इस बल को स्वाभाविक रूप से बनाए रखते हैं।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और काव्यात्मक गरिमा वाली रखी गई है। ‘पराए लोग’ मूल की सामाजिक दूरी को बनाए रखता है, और ‘मेहनत की कमाई’ יְגִיעַ के परिणामसूचक अर्थ को सहज हिन्दी में व्यक्त करता है।
