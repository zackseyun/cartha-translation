base_translation:
  language: en
  yaml_path: translation/ot/psalms/109/002.yaml
  text: For the mouth of the wicked and the mouth of deceit have opened against me[b][a]; they have spoken to me with a lying tongue.
translation:
  language: hi
  text: क्योंकि दुष्ट का मुँह और छलपूर्ण मुँह मेरे विरुद्ध खुल गए हैं; उन्होंने मुझसे झूठ बोलनेवाली जीभ से बात की है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले पद में की गई पुकार का कारण बताता है और हिब्रू के कारणसूचक बल को स्वाभाविक हिन्दी में रखता है।
- source_word: פִי רָשָׁע
  choice: दुष्ट का मुँह
  rationale: रचना का शाब्दिक अर्थ ‘दुष्ट [व्यक्ति] का मुँह’ है। यह हिन्दी में संक्षिप्त और स्वाभाविक है तथा अनावश्यक रूप से लिंग को उभारता नहीं।
- source_word: וּפִי מִרְמָה
  choice: और छल का मुँह
  rationale: हिब्रू में ‘मुँह’ की पुनरावृत्ति समानांतरता और जोर देती है; इसलिए उसे बनाए रखा गया है। מִרְמָה को यहाँ ‘छल’ कहना सीधा और प्रसंगानुकूल है।
- source_word: עָלַי פָּתָחוּ
  choice: मेरे विरुद्ध खुल गए हैं
  rationale: शत्रुतापूर्ण वाणी के प्रसंग में ‘मेरे विरुद्ध मुँह खोलना’ स्वाभाविक हिन्दी मुहावरा है। बहुवचन क्रिया दोनों समानांतर ‘मुँह’ पदों के अनुसार रखी गई है।
- source_word: דִּבְּרוּ אִתִּי
  choice: उन्होंने मुझसे बातें की हैं
  rationale: אִתִּי का मूल संबंधवाचक अर्थ ‘मेरे साथ/मुझसे’ है। ‘मुझसे बातें की हैं’ हिन्दी में संबोधित वाणी को स्वाभाविक रूप से व्यक्त करता है, बिना ‘मेरे विरुद्ध’ को दूसरी बार जोड़ने के।
- source_word: לְשׁוֹן שָׁקֶר
  choice: झूठ बोलनेवाली जीभ से
  rationale: यह ठोस हिब्रू बिंब ‘जीभ’ को बनाए रखता है और ‘झूठ की जीभ’ की अपेक्षा आधुनिक हिन्दी में अधिक स्वाभाविक है।
