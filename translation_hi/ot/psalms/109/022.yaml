  text: כִּֽי עָנִ֣י וְ/אֶבְי֣וֹן אָנֹ֑כִי וְ֝/לִבִּ֗/י חָלַ֥ל בְּ/קִרְבִּֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/109/022.yaml
  text: For I am poor and needy[a], and my heart is wounded within me.
translation:
  language: hi
  text: क्योंकि मैं दीन और ज़रूरतमंद हूँ, और मेरा हृदय मेरे भीतर घायल है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पद संदर्भ में विनती का कारण बताता है; ‘क्योंकि’ हिन्दी में इसके संयोजक और कारणसूचक बल को स्वाभाविक रूप से व्यक्त करता है।
- source_word: עָנִי
  choice: दीन
  rationale: यह शब्द निर्धनता के साथ दुःख, दबाव और असहाय दशा का भी बोध करा सकता है। ‘दीन’ अगले शब्द से भेद बनाए रखते हुए इस व्यापक संकट को व्यक्त करता है।
- source_word: אֶבְיוֹן
  choice: ज़रूरतमंद
  rationale: यह अभावग्रस्त और सहायता पर निर्भर व्यक्ति को दर्शाता है। ‘ज़रूरतमंद’ आधुनिक हिन्दी में स्वाभाविक है और עָנִי के साथ समानार्थक दोहराव से बचाता है।
- source_word: אָנֹכִי
  choice: मैं … हूँ
  rationale: स्वतंत्र सर्वनाम स्पष्ट और कुछ बलयुक्त है; हिन्दी में ‘मैं … हूँ’ वाक्य को स्वाभाविक रखते हुए इसे व्यक्त करता है।
- source_word: לִבִּי
  choice: मेरा हृदय
  rationale: ‘हृदय’ भीतरी व्यक्ति, भाव और मन का पारंपरिक तथा स्वाभाविक समतुल्य है।
- source_word: חָלַל
  choice: घायल है
  rationale: संदर्भ में यह क्रिया भीतर से घायल, बिंधा हुआ, अथवा प्राणघातक रूप से आहत होने का बोध दे सकती है। ‘घायल’ मूल की व्यापकता और रूपकात्मक पीड़ा को बिना अनावश्यक रूप से सीमित किए बनाए रखता है।
- source_word: בְּקִרְבִּי
  choice: मेरे भीतर
  rationale: यह भीतरी स्थान को दर्शाता है; ‘मेरे भीतर’ संक्षिप्त, स्वाभाविक और स्रोत के अनुरूप है।
theological_decisions:
- issue: חָלַל में चोट की तीव्रता और स्वरूप
  choice: घायल है
  alternative: बिंधा हुआ है / प्राणघातक रूप से आहत है
  rationale: मूल क्रिया गहरी या प्राणघातक चोट तक का संकेत दे सकती है, पर यहाँ उसकी सटीक तीव्रता निश्चित नहीं है। ‘घायल’ अर्थ को खुला रखता है और किसी विशिष्ट मसीही या सिद्धान्तगत संकेत को आयात नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण काव्यात्मक गद्य। ‘दीन और ज़रूरतमंद’ पारंपरिक बाइबलीय भाव तथा सामान्य पाठक की समझ के बीच संतुलन रखता है।
