  yaml_path: translation/ot/psalms/109/026.yaml
  text: Help me[a], O Yahweh my God; save me according to your steadfast love.
translation:
  language: hi
  text: हे याहवे, मेरे परमेश्वर, मेरी सहायता कर; अपने अटल प्रेम के अनुसार मुझे बचा।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अपनी वाचा की विश्वासयोग्यता के अनुरूप मुझे बचा।” इब्रानी חֶסֶד अटल और निष्ठावान प्रेम को दर्शाता है तथा उसमें वाचा-संबंधी भाव भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: עָזְרֵנִי
  choice: मेरी सहायता कर
  rationale: यह עזר का आज्ञार्थक रूप है, जिसके साथ प्रथम पुरुष एकवचन प्रत्यय जुड़ा है। ‘मेरी सहायता कर’ सीधी विनती और उसकी तात्कालिकता को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत नाम יהוה को किसी उपाधि से बदलने के बजाय हिन्दी में प्रचलित निकट लिप्यंतरण ‘याहवे’ से व्यक्त किया गया है।
- source_word: אֱלֹהָי
  choice: मेरे परमेश्वर
  rationale: प्रथम पुरुष एकवचन संबंधसूचक रूप है और יהוה को संबोधित करते हुए समानाधिकरण में प्रयुक्त हुआ है; इसलिए ‘मेरे परमेश्वर’ सीधा और प्रसंगानुकूल अनुवाद है।
- source_word: הוֹשִׁיעֵנִי
  choice: मुझे बचा
  rationale: यह ישׁע का हिफ़ईल आज्ञार्थक रूप है, जिसके साथ प्रथम पुरुष एकवचन प्रत्यय है। ‘मुझे बचा’ संकट से दैवी उद्धार की व्यापक धारणा और मूल क्रिया का सीधा बल बनाए रखता है।
- source_word: כְחַסְדֶּךָ
  choice: अपने अटल प्रेम के अनुसार
  rationale: כְ यहाँ मानक या आधार का संकेत देता है। חֶסֶד में प्रेम, निष्ठा और स्थिरता का संयुक्त भाव है; ‘अटल प्रेम’ इसे संक्षिप्त और स्वाभाविक हिन्दी में व्यक्त करता है, जबकि वाचा-संबंधी संभावित अर्थ को पादटिप्पणी में सुरक्षित रखा गया है।
theological_decisions:
- issue: יהוה परमेश्वर के नाम का अनुवाद
  choice: याहवे
  alternative: प्रभु / यहोवा
  rationale: मूल पाठ में व्यक्तिगत नाम יהוה है। ‘याहवे’ उसे उपाधि से प्रतिस्थापित किए बिना निकट लिप्यंतरण में प्रस्तुत करता है।
- issue: חֶסֶד में प्रेम और वाचा-निष्ठा का संबंध
  choice: अटल प्रेम
  alternative: वाचा की विश्वासयोग्यता
  rationale: חֶסֶד का अर्थ केवल दया तक सीमित नहीं है; इसमें निष्ठावान और स्थायी प्रेम का भाव है तथा वाचा-संबंधी संकेत भी हो सकता है। मुख्य पाठ में व्यापक अर्थ रखा गया है और अधिक स्पष्ट वाचा-संबंधी पाठ पादटिप्पणी में दिया गया है।
translation_notes:
  register: भाषा आधुनिक, सहज और प्रार्थनात्मक है। ‘हे’ संबोधन को गरिमा और काव्यात्मकता के लिए रखा गया है; वाक्य की संक्षिप्तता मूल इब्रानी विनती की तीव्रता को बनाए रखती है।
