  text: लंबी होती छाया की तरह मैं ओझल हो जाता हूँ[a]; मैं टिड्डी की तरह झटक दिया गया हूँ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “ढलती” अथवा “फैलती हुई छाया की तरह।” इब्रानी क्रिया छाया के फैलने, लंबी होने, झुकने या साँझ की ओर ढलने का संकेत दे सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּצֵל
  choice: छाया के समान
  rationale: उपसर्ग כ तुलना प्रकट करता है और צֵל का अर्थ ‘छाया’ है; यह पद के काव्यात्मक उपमान को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: כִּנְטוֹתוֹ
  choice: ढलती हुई
  rationale: נטה के अर्थों में फैलना, झुकना और मुड़ना शामिल हैं। छाया के प्रसंग में ‘ढलती हुई’ साँझ की ओर बढ़ती या लंबी होती छाया की स्वाभाविक हिन्दी अभिव्यक्ति है; अन्य संभव अर्थ पादटिप्पणी में दिए गए हैं।
- source_word: נֶהֱלָכְתִּי
  choice: मिटता जा रहा हूँ
  rationale: הלך के निफ़अल रूप का यहाँ भाव चले जाने या लुप्त होने का है। ‘मिटता जा रहा हूँ’ छाया के साथ जुड़ी क्रमिक विलुप्ति को स्पष्ट करता है, जबकि शाब्दिक क्रिया का विकल्प पादटिप्पणी में सुरक्षित है।
- source_word: נִנְעַרְתִּי
  choice: झटक दिया गया हूँ
  rationale: נער के निफ़अल का अर्थ झाड़ या झटक दिए जाने का है। कर्मवाच्य रूप मूल के इस भाव और असहायता के बिंब को बनाए रखता है।
- source_word: כָּאַרְבֶּה
  choice: टिड्डी के समान
  rationale: אַרְבֶּה का सामान्य अर्थ दल बनाकर चलने वाली टिड्डी (locust) है। हिन्दी में ‘टिड्डी’ इस बिंब का सर्वाधिक सहज और प्रचलित रूप है।
