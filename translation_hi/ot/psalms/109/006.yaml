  text: הַפְקֵ֣ד עָלָ֣י/ו רָשָׁ֑ע וְ֝/שָׂטָ֗ן יַעֲמֹ֥ד עַל יְמִינֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/109/006.yaml
  text: Appoint a wicked man over him[a], and let an accuser stand at his right hand.
translation:
  language: hi
  text: उसके ऊपर किसी दुष्ट को नियुक्त कर, और एक आरोप लगानेवाला[a] उसके दाहिने हाथ पर खड़ा हो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘एक विरोधी’; अथवा ‘शैतान’। इब्रानी शब्द का अर्थ ‘आरोप लगानेवाला’ या ‘विरोधी’ हो सकता है, और कुछ संदर्भों में यह व्यक्तिवाचक नाम ‘शैतान’ भी है।
    reason: इब्रानी שָׂטָן की सामान्य संज्ञा और व्यक्तिवाचक नाम—दोनों संभावनाओं को सुरक्षित रखना।
lexical_decisions:
- source_word: הַפְקֵד
  choice: नियुक्त कर
  rationale: यह פקד का हिफ़ील आज्ञार्थक रूप है और यहाँ किसी व्यक्ति को दूसरे के ऊपर ठहराने या अधिकार देने का भाव व्यक्त करता है। ‘नियुक्त कर’ आज्ञा के बल और प्रशासनिक अथवा न्यायिक संदर्भ, दोनों को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: עָלָיו
  choice: उसके ऊपर
  rationale: פקד के साथ על उस व्यक्ति को सूचित करता है जिसके ऊपर किसी को नियुक्त किया जाता है। ‘उसके ऊपर’ मूल संबंध को बनाए रखता है; ‘उसके विरुद्ध’ संदर्भगत रूप से संभव है, पर क्रिया के साथ कम सीधा है।
- source_word: רָשָׁע
  choice: किसी दुष्ट
  rationale: यह शब्द यहाँ एक दुष्ट व्यक्ति को दर्शाता है। ‘किसी दुष्ट’ स्वाभाविक हिन्दी है और अनिश्चित व्यक्तिगत संदर्भ को स्पष्ट रखता है।
- source_word: שָׂטָן
  choice: एक अभियोग लगानेवाला
  rationale: इस न्यायिक और शापसूचक संदर्भ में शब्द सामान्य संज्ञा के रूप में अभियोग लगानेवाले अथवा विरोधी को सूचित करता है। यह चयन न्यायालय-सदृश दृश्य को स्पष्ट करता है, जबकि ‘शैतान’ की संभावना पादटिप्पणी में सुरक्षित है।
- source_word: יַעֲמֹד
  choice: खड़ा हो
  rationale: आज्ञार्थक क्रिया के बाद यह अपूर्ण रूप इच्छासूचक बल रखता है। ‘खड़ा हो’ हिन्दी में उस कामना अथवा आह्वान को संक्षेप और स्वाभाविक रूप से व्यक्त करता है।
- source_word: עַל יְמִינוֹ
  choice: उसके दाहिने हाथ
  rationale: यह किसी के दाहिनी ओर स्थान लेने का पारंपरिक मुहावरा है, जिसका यहाँ न्यायिक अर्थ भी हो सकता है। ‘दाहिने हाथ’ मूल बिंब और बाइबलीय अनुगूँज को बनाए रखता है।
theological_decisions:
- issue: שָׂטָן को व्यक्तिवाचक नाम ‘शैतान’ माना जाए या सामान्य संज्ञा
  choice: 'सामान्य संज्ञा: ‘एक अभियोग लगानेवाला’'
  alternative: ‘शैतान’ अथवा ‘एक विरोधी’
  rationale: इब्रानी पाठ में ऐसा कोई निर्णायक चिह्न नहीं है जो यहाँ व्यक्तिवाचक नाम को अनिवार्य करे। निकट संदर्भ न्यायिक और शापसूचक है, इसलिए सामान्य संज्ञा मुख्य पाठ में अधिक सीधी है। फिर भी परंपरागत ‘शैतान’ पाठ की वास्तविक संभावना पादटिप्पणी में रखी गई है, ताकि धार्मिक तनाव को अनावश्यक रूप से हल न किया जाए।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और काव्यात्मक-न्यायिक शैली रखी गई है। ‘दाहिने हाथ’ मूल मुहावरे को बनाए रखता है; ‘अभियोग लगानेवाला’ सामान्य पाठक के लिए न्यायिक भूमिका स्पष्ट करता है।
