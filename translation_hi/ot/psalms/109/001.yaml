  rationale: यह संगीतबद्ध धार्मिक गीत की विधा का मानक हिन्दी नाम है।
- source_word: אֱלֹהֵי תְהִלָּתִי
  choice: हे मेरी स्तुति के परमेश्वर
  rationale: इब्रानी संबंधसूचक रचना को सीधे बनाए रखते हुए संबोधन को स्वाभाविक हिन्दी में व्यक्त करता है; इसे व्याख्यात्मक रूप से ‘हे परमेश्वर, जिसकी मैं स्तुति करता हूँ’ नहीं बनाया गया।
- source_word: אַל־תֶּחֱרַשׁ
  choice: मौन न रहो
  rationale: निषेधात्मक विनती और परमेश्वर से उत्तर पाने की पुकार को संक्षिप्त, सहज हिन्दी में व्यक्त करता है।
