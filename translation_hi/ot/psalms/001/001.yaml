id: PSA.1.1
reference: Psalms 1:1
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: אַ֥שְֽׁרֵי הָ/אִ֗ישׁ אֲשֶׁ֤ר לֹ֥א הָלַךְ֮ בַּ/עֲצַ֪ת רְשָׁ֫עִ֥ים וּ/בְ/דֶ֣רֶךְ חַ֭טָּאִים לֹ֥א עָמָ֑ד וּ/בְ/מוֹשַׁ֥ב לֵ֝צִ֗ים לֹ֣א יָשָֽׁב־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/001/001.yaml
  text: Blessed is the man who does not walk in the counsel of the wicked[a], nor stand in the way of sinners[c][b], nor sit in the seat of scoffers.
translation:
  language: hi
  text: 'क्या ही धन्य है वह मनुष्य[a][b],

    जो दुष्टों की सलाह पर नहीं चलता,

    न पापियों के मार्ग में खड़ा होता,

    और न उपहास करने वालों[c] की सभा में बैठता है।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: मूल इब्रानी में “मनुष्य” पुल्लिंग एकवचन है; यहाँ वह सामान्य रूप से आदर्श धर्मी व्यक्ति का प्रतिनिधित्व करता है, केवल पुरुषों का नहीं।
    reason: cultural_note
  - marker: b
    text: या, “क्या ही सुखी है वह मनुष्य”; इब्रानी पद केवल भावना नहीं, बल्कि गहरे सौभाग्य और धन्यता की दशा प्रकट करता है।
    reason: lexical_alternative
  - marker: c
    text: या, “ठट्ठा करने वालों।”
    reason: lexical_alternative
lexical_decisions:
- source_word: אַשְׁרֵי
  choice: क्या ही धन्य है
  rationale: यह इब्रानी धन्यता-वचन उस व्यक्ति की गहरी धन्य और सौभाग्यपूर्ण दशा घोषित करता है; यह केवल क्षणिक प्रसन्नता का वर्णन नहीं है।
- source_word: הָאִישׁ
  choice: वह मनुष्य
  rationale: मूल पाठ का पुल्लिंग एकवचन रखा गया है; ज्ञान-साहित्य के इस संदर्भ में यह एक आदर्श धर्मी व्यक्ति का प्रतिनिधि रूप है।
- source_word: הָלַךְ
  choice: चलता
  rationale: आचरण के रूपक को बनाए रखता है और चलने, खड़े होने तथा बैठने की काव्यात्मक क्रम-वृद्धि को सुरक्षित रखता है।
- source_word: בַּעֲצַת
  choice: सलाह पर
  rationale: यह चुनाव परामर्श और उससे मिलने वाले जीवन-निर्देशन, दोनों अर्थों को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: רְשָׁעִים
  choice: दुष्टों
  rationale: यह बहुवचन संज्ञार्थक विशेषण का सीधा अनुवाद है और मूल में अनिवार्य न होने वाला अतिरिक्त धार्मिक अर्थ नहीं जोड़ता।
- source_word: דֶרֶךְ
  choice: मार्ग में
  rationale: मार्ग का ठोस चित्र और जीवन-चाल का ज्ञान-साहित्यिक रूपक, दोनों बने रहते हैं।
- source_word: חַטָּאִים
  choice: पापियों
  rationale: मूल बहुवचन संज्ञा का संक्षिप्त और प्रचलित हिन्दी रूप है।
- source_word: עָמָד
  choice: खड़ा होता
  rationale: यह मूल क्रिया और चलने से खड़े होने की काव्यात्मक प्रगति को बनाए रखता है।
- source_word: מוֹשַׁב
  choice: सभा में
  rationale: इस संज्ञा का अर्थ बैठने का स्थान, बैठक या सभा हो सकता है; यहाँ 'सभा' सामूहिक संगति का स्वाभाविक हिन्दी बोध देती है और 'बैठता' के साथ चित्र भी स्पष्ट रहता है।
- source_word: לֵצִים
  choice: उपहास करने वालों
  rationale: यह उन लोगों को सूचित करता है जो तिरस्कारपूर्वक हँसी उड़ाते हैं; आधुनिक हिन्दी में स्पष्ट और गरिमापूर्ण है।
- source_word: יָשָׁב
  choice: बैठता
  rationale: ठोस चित्र को बनाए रखता है और चलने, खड़े होने तथा बैठने की क्रम-वृद्धि पूरी करता है।
theological_decisions:
- issue: ज्ञान-साहित्य में प्रतिनिधिक पुल्लिंग एकवचन
  choice: वह मनुष्य
  alternative: वह व्यक्ति
  rationale: मूल का व्याकरणिक पुल्लिंग एकवचन स्पष्ट रखा गया है, पर पादटिप्पणी बताती है कि कथन केवल पुरुषों तक सीमित नहीं, बल्कि आदर्श धर्मी व्यक्ति का प्रतिनिधिक वर्णन है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। पद की तीन समानांतर पंक्तियाँ तथा चलना—खड़ा होना—बैठना की क्रमिक काव्यात्मक गति सुरक्षित है। “सभा” को מוֹשָׁב के अर्थ-क्षेत्र में स्वाभाविक हिन्दी विकल्प के रूप में चुना गया है।
