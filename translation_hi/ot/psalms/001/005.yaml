review_pass:
  verdict: revise
  source_fidelity: ‘न्याय के समय’ temporal wording adds a nuance not explicitly present in בַּמִּשְׁפָּט (‘in the judgment/in judgment’) and weakens the Hebrew’s judicial-standing image. The revision retains the broad, unspecified judicial sense and renders יָקֻמוּ with ‘खड़े न रह सकेंगे.’
  naturalness: The original second clause lacks an expressed predicate in a way that is awkward in modern Hindi. ‘...सभा में भी नहीं’ naturally carries forward the predicate while preserving the Hebrew parallelism.
  terminology: ‘दुष्ट,’ ‘पापी,’ ‘धर्मी,’ ‘न्याय,’ and ‘सभा’ are appropriate, established biblical-Hindi terms and preserve the moral, judicial, and communal categories without doctrinal over-specification.
  issues:
  - severity: medium
    issue: ‘न्याय के समय’ adds a temporal formulation to בַּמִּשְׁפָּט.
    rationale: The Hebrew says ‘in the judgment’ or ‘in judgment,’ not specifically ‘at the time of judgment.’ ‘न्याय में’ more directly preserves both its wording and its intended ambiguity.
  - severity: medium
    issue: The judicial image of ‘stand’ is not retained in the first clause, and the second Hindi clause is syntactically incomplete.
    rationale: ‘टिक न सकेंगे’ is possible interpretively, but ‘खड़े न रह सकेंगे’ preserves the concrete Hebrew image. Adding ‘भी नहीं’ makes the ellipsis natural in Hindi without adding a separate outcome.
  revised_text: इसलिए दुष्ट न्याय में खड़े न रह सकेंगे, और पापी धर्मियों की सभा में भी नहीं।
  revised_footnotes:
