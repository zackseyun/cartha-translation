language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: עַל כֵּ֤ן לֹא יָקֻ֣מוּ רְ֭שָׁעִים בַּ/מִּשְׁפָּ֑ט וְ֝/חַטָּאִ֗ים בַּ/עֲדַ֥ת צַדִּיקִֽים־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/001/005.yaml
  text: Therefore the wicked will not stand in the judgment[b][a], nor sinners in the assembly of the righteous.
translation:
  language: hi
  text: इसलिए दुष्ट न्याय में खड़े न रह सकेंगे, और पापी धर्मियों की सभा में भी नहीं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עַל כֵּן
  choice: इसलिए
  rationale: यह पद पिछले वर्णन से निकलने वाला निष्कर्ष व्यक्त करता है; ‘इसलिए’ उसका स्वाभाविक और संक्षिप्त हिन्दी रूप है।
- source_word: יָקֻמוּ
  choice: टिक न सकेंगे
  rationale: קום का मूल बिंब खड़े होने का है, पर न्यायिक संदर्भ में आशय जाँच या निर्णय के सामने बने रह पाने का है। ‘टिक न सकेंगे’ आधुनिक हिन्दी में यह भाव स्वाभाविक ढंग से देता है।
- source_word: רְשָׁעִים
  choice: दुष्ट
  rationale: ज्ञान-साहित्य में यह नैतिक श्रेणी का मानक और संक्षिप्त हिन्दी रूप है।
- source_word: בַּמִּשְׁפָּט
  choice: न्याय के समय
  rationale: מִשְׁפָּט न्याय, न्यायिक निर्णय या न्याय-प्रक्रिया को सूचित कर सकता है। यह रूप न्यायिक प्रसंग स्पष्ट करता है, पर उसे केवल अंतिम न्याय तक सीमित नहीं करता।
- source_word: חַטָּאִים
  choice: पापी
  rationale: यह उन लोगों को दर्शाता है जिनकी पहचान पापमय आचरण से होती है और ‘दुष्ट’ के समानांतर बना रहता है।
- source_word: בַּעֲדַת
  choice: की सभा में
  rationale: עֵדָה एकत्र समुदाय को दर्शाता है; ‘सभा’ आधुनिक हिन्दी में स्पष्ट है और सामुदायिक अर्थ बनाए रखता है।
- source_word: צַדִּיקִים
  choice: धर्मियों
  rationale: यह צַדִּיקִים की नैतिक और वाचागत श्रेणी को संक्षिप्त, परिचित बाइबलीय हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: ‘न्याय’ का दायरा
  choice: ‘न्याय के समय’ रखा गया है और यह निर्दिष्ट नहीं किया गया कि वह वर्तमान न्यायिक लेखा है, अंतिम न्याय है, या दोनों।
  alternative: इसे केवल सांसारिक न्याय अथवा केवल अंतिम न्याय के रूप में स्पष्ट करना।
  rationale: इब्रानी प्रयोग व्यापक न्यायिक अर्थ की अनुमति देता है; अनुवाद उस वास्तविक अस्पष्टता और धर्मवैज्ञानिक तनाव को सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और सामान्य पाठक के लिए सहज शैली। ‘टिक न सकेंगे’ न्याय के सामने खड़े न रह पाने का इब्रानी बिंब अर्थगत रूप से व्यक्त करता है; ‘सभा’ सांप्रदायिक रंग के बिना सामुदायिक संदर्भ रखता है।
