id: PSA.1.3
reference: Psalms 1:3
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְֽ/הָיָ֗ה כְּ/עֵץ֮ שָׁת֪וּל עַֽל פַּלְגֵ֫י מָ֥יִם אֲשֶׁ֤ר פִּרְי֨/וֹ יִתֵּ֬ן בְּ/עִתּ֗/וֹ וְ/עָלֵ֥/הוּ לֹֽא יִבּ֑וֹל וְ/כֹ֖ל אֲשֶׁר יַעֲשֶׂ֣ה יַצְלִֽיחַ־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/001/003.yaml
  text: He will be like a tree planted by streams of water[a], which yields its fruit in its season, and its leaf does not wither; in all that he does, he prospers.
translation:
  language: hi
  text: वह जलधाराओं के पास लगाए गए पेड़ के समान होगा, जो अपने समय पर फल देता है; उसका पत्ता नहीं मुरझाता, और अपने हर काम में वह सफल होता है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसका हर किया हुआ काम सफल होता है।” इब्रानी में “जो कुछ वह करता है” को अंतिम क्रिया का कर्ता भी समझा जा सकता है।
    reason: अंतिम क्रिया के कर्ता से संबंधित वैकल्पिक व्याकरणिक पाठ।
lexical_decisions:
- source_word: וְהָיָה
  choice: वह ... होगा
  rationale: संयोजक उपसर्ग के साथ पूर्ण क्रिया यहाँ पिछले वर्णन के परिणाम को आगे बढ़ाती है; भविष्यकालीन ‘होगा’ इस प्रवाह और तुलना को स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: כְעֵץ שָׁתוּל
  choice: लगाए गए पेड़ के समान
  rationale: כְּ तुलना सूचित करता है और שָׁתוּל उस पेड़ को दर्शाता है जिसे किसी स्थान पर जानबूझकर लगाया गया है।
- source_word: עַל פַלְגֵי מָיִם
  choice: जलधाराओं के पास
  rationale: פַלְגֵי पानी की धाराओं, नहरों या जलमार्गों को दर्शा सकता है। ‘जलधाराओं के पास’ चित्रात्मक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट है।
- source_word: פִּרְיוֹ יִתֵּן
  choice: अपना फल देता है
  rationale: यह मूल अभिव्यक्ति ‘अपना फल देता है’ का सीधा और हिंदी में स्वाभाविक रूप है।
- source_word: בְּעִתּוֹ
  choice: अपने समय पर
  rationale: यह फल आने के उपयुक्त या निर्धारित समय को दर्शाता है और इब्रानी की व्यापकता बनाए रखता है।
- source_word: וְעָלֵהוּ לֹא יִבּוֹל
  choice: उसका पत्ता नहीं मुरझाता
  rationale: एकवचन ‘पत्ता’ इब्रानी के सामूहिक एकवचन को बनाए रखता है; ‘मुरझाता’ वनस्पति के लिए क्रिया का सीधा अर्थ है।
- source_word: וְכֹל אֲשֶׁר יַעֲשֶׂה יַצְלִיחַ
  choice: और अपने हर काम में वह सफल होता है
  rationale: यह पाठ अंतिम क्रिया के निहित कर्ता को भजन के पुरुष के रूप में समझता है और हिंदी में सहज ढंग से उसकी समस्त गतिविधि के सफल होने का भाव देता है। व्याकरण की दूसरी संभव समझ पादटिप्पणी में रखी गई है।
theological_decisions:
- issue: अंतिम क्रिया יַצְלִיחַ का कर्ता
  choice: 'सफलता उस पुरुष के विषय में कही गई है: ‘अपने हर काम में वह सफल होता है।’'
  alternative: 'उसके किए हुए काम को कर्ता माना जा सकता है: ‘वह जो कुछ करता है, सफल होता है।’'
  rationale: इब्रानी में अंतिम क्रिया का निहित कर्ता पहले वर्णित पुरुष हो सकता है, अथवा ‘जो कुछ वह करता है’ कर्ता हो सकता है। मुख्य पाठ पुरुष पर भजन का केंद्र बनाए रखता है, जबकि दूसरी प्रामाणिक व्याकरणिक संभावना पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: आधुनिक मानक हिंदी का सहज किंतु गरिमापूर्ण काव्यात्मक गद्य रखा गया है। ‘जलधाराओं’ से पानी की निरंतर और प्रचुर उपलब्धता का चित्र बना रहता है; अत्यधिक तकनीकी ‘जलमार्गों’ या बोलचाल के सीमित विकल्पों से बचा गया है।
