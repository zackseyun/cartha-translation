id: PSA.1.6
reference: Psalms 1:6
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: כִּֽי יוֹדֵ֣עַ יְ֭הוָה דֶּ֣רֶךְ צַדִּיקִ֑ים וְ/דֶ֖רֶךְ רְשָׁעִ֣ים תֹּאבֵֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/001/006.yaml
  text: For Yahweh knows the way of the righteous[a], but the way of the wicked will perish.
translation:
  language: hi
  text: क्योंकि यहोवा धर्मियों के मार्ग को जानता[a] है, परन्तु दुष्टों का मार्ग नष्ट हो जाएगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘की देखभाल करता है’; इब्रानी में ‘जानना’ केवल जानकारी रखने के बजाय संबंधपरक देखभाल या स्वीकृति का भाव भी दे सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पद पिछले कथन में धर्मियों और दुष्टों के बीच किए गए विरोध का कारण बताता है; ‘क्योंकि’ इस व्याख्यात्मक संबंध को स्वाभाविक हिन्दी में स्पष्ट रखता है।
- source_word: יֹדֵעַ
  choice: जानता है
  rationale: मूल क्रिया का सीधा अर्थ ‘जानना’ है। इस संदर्भ में इसमें संबंधपरक देखभाल या स्वीकृति का भाव भी हो सकता है, पर मुख्य पाठ में ‘जानता है’ मूल की अर्थगत व्यापकता और अस्पष्टता को सुरक्षित रखता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: इब्रानी परमेश्वर-नाम को हिन्दी में प्रचलित और पहचाने जाने योग्य रूप ‘यहोवा’ से व्यक्त किया गया है।
- source_word: דֶּרֶךְ
  choice: मार्ग
  rationale: ‘मार्ग’ जीवन-रीति और उसके परिणाम की दिशा, दोनों को व्यक्त कर सकता है तथा दोनों पंक्तियों में मूल शब्द की पुनरावृत्ति बनाए रखता है।
- source_word: צַדִּיקִים
  choice: धर्मियों
  rationale: बहुवचन विशेषण यहाँ संज्ञा के रूप में प्रयुक्त है; ‘धर्मी’ नैतिक रूप से सही ठहरने या सही जीवन जीने वाले लोगों के वर्ग को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וְ
  choice: परन्तु
  rationale: यद्यपि संयोजक का मूल रूप सामान्यतः ‘और’ है, काव्यात्मक समानांतरता यहाँ स्पष्ट विरोध दिखाती है; ‘परन्तु’ उस संबंध को सहज हिन्दी में व्यक्त करता है।
- source_word: רְשָׁעִים
  choice: दुष्टों
  rationale: यह बहुवचन विशेषण संज्ञा के रूप में उन लोगों को दर्शाता है जिनका आचरण नैतिक रूप से बुरा है; ‘दुष्ट’ ज्ञान-साहित्य के इस वर्ग के लिए स्पष्ट और प्रचलित शब्द है।
- source_word: תֹּאבֵד
  choice: नष्ट हो जाएगा
  rationale: क्रिया का अर्थ नाश होना या मिट जाना है। अकर्मक ‘नष्ट हो जाएगा’ मार्ग को कर्ता बनाए रखता है और दुष्टों की जीवन-दिशा के अंततः विफल हो जाने को व्यक्त करता है।
theological_decisions:
- issue: यहोवा के ‘जानने’ का आशय
  choice: मुख्य पाठ में शाब्दिक ‘जानता है’ रखा गया है, जबकि संबंधपरक देखभाल या स्वीकृति की सम्भावना पादटिप्पणी में दी गई है।
  alternative: ‘यहोवा धर्मियों के मार्ग की देखभाल करता है’ या ‘यहोवा धर्मियों के मार्ग को स्वीकार करता है।’
  rationale: संदर्भ में इब्रानी क्रिया केवल जानकारी रखने से अधिक, कृपापूर्ण ध्यान या अनुमोदन का संकेत दे सकती है। फिर भी उसे मुख्य पाठ में स्पष्ट रूप से ‘देखभाल करता है’ कहना मूल की वास्तविक अर्थगत व्यापकता को संकरा कर देगा।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण काव्यात्मक गद्य रखा गया है। ‘मार्ग’ की पुनरावृत्ति मूल समानांतरता को बनाए रखती है; ‘परन्तु’ विरोध को स्पष्ट करता है।
