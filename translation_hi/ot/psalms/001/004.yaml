translation:
  language: hi
  text: दुष्ट ऐसे नहीं हैं; बल्कि वे उस भूसी के समान हैं जिसे हवा उड़ा ले जाती है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לֹא כֵן
  choice: ऐसे नहीं हैं
  rationale: यह संक्षिप्त इब्रानी वाक्य पिछले पद में धर्मी के वर्णन से तीखा विरोध दिखाता है। हिंदी में ‘ऐसे नहीं हैं’ उस अपूर्ण कथन को अनावश्यक रूप से विस्तार दिए बिना स्वाभाविक बनाता है।
- source_word: הָרְשָׁעִים
  choice: दुष्ट
  rationale: ज्ञान-साहित्य के संदर्भ में यह नैतिक रूप से बुरे लोगों को दर्शाता है; ‘दुष्ट’ आधुनिक हिंदी में सटीक और प्रचलित है।
- source_word: כִּי אִם
  choice: बल्कि
  rationale: यह पहले कथन को नकारकर उसके स्थान पर विपरीत चित्र प्रस्तुत करता है; ‘बल्कि’ इस सुधारात्मक विरोध को स्पष्ट रखता है।
- source_word: כַּמֹּץ
  choice: उस भूसी के समान
  rationale: מֹץ अनाज से अलग हुआ हलका छिलका या फटकन है। ‘भूसी’ सामान्य पाठक के लिए बोधगम्य है और कृषि-रूपक को बनाए रखती है। ‘उस’ अगली संबंधवाचक उपवाक्य से इसे स्वाभाविक रूप से जोड़ता है।
- source_word: אֲשֶׁר
  choice: जिसे
  rationale: हिंदी में कर्मसूचक संबंधवाचक रूप ‘जिसे’ अगले क्रियापद के साथ स्वाभाविक और सटीक है।
- source_word: תִּדְּפֶנּוּ
  choice: उड़ा ले जाती है
  rationale: נדף का रूप हवा द्वारा दूर हाँके या उड़ाए जाने का भाव देता है। ‘उड़ा ले जाती है’ हिंदी में प्राकृतिक है और दूर हट जाने की दिशा को व्यक्त करता है।
- source_word: רוּחַ
  choice: हवा
  rationale: अनाज की भूसी के कृषि-रूपक में अर्थ स्पष्टतः ‘हवा’ है, न कि ‘श्वास’ या ‘आत्मा’।
