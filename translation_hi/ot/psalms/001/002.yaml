base_translation:
  language: en
  yaml_path: translation/ot/psalms/001/002.yaml
  text: But his delight is in the law of Yahweh[b][a], and on his law he meditates day and night.
translation:
  language: hi
  text: बल्कि उसका आनंद याहवे की व्यवस्था[a] में है, और उसकी व्यवस्था पर वह दिन-रात मनन करता है[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘याहवे की शिक्षा’।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी क्रिया में मनन करते हुए धीमे स्वर में बोलने, बुदबुदाने या दोहराने का भाव भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי אִם
  choice: बल्कि
  rationale: पद 1 की नकारात्मक बातों के बाद यह पद स्पष्ट विरोध और विकल्प प्रकट करता है; ‘बल्कि’ इस बल को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: בְּתוֹרַת
  choice: की व्यवस्था में
  rationale: תּוֹרָה का अर्थ शिक्षा या निर्देश भी हो सकता है, पर यहाँ यह याहवे की प्रकट, वाचा-संबंधी शिक्षा का भार रखता है; ‘व्यवस्था’ हिन्दी बाइबलीय प्रयोग में इस अर्थ को संक्षेप में व्यक्त करती है।
- source_word: יְהוָה
  choice: याहवे
  rationale: मूल पाठ में परमेश्वर का व्यक्तिगत वाचा-नाम है; ‘याहवे’ उसका लिप्यंतरण है, किसी उपाधि का प्रतिस्थापन नहीं।
- source_word: חֶפְצוֹ
  choice: उसका आनंद
  rationale: यह शब्द उस वस्तु को सूचित करता है जिसमें व्यक्ति प्रसन्नता और गहरी रुचि पाता है; ‘आनंद’ भावात्मक लगाव को सहज और गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: וּבְתוֹרָתוֹ
  choice: और उसकी व्यवस्था पर
  rationale: सर्वनामिक प्रत्यय स्वाभाविक रूप से याहवे की ओर संकेत करता है। ‘व्यवस्था’ की पुनरावृत्ति इब्रानी समानांतरता बनाए रखती है और ‘पर’ हिन्दी में ‘मनन करना’ के साथ स्वाभाविक है।
- source_word: יֶהְגֶּה
  choice: मनन करता है
  rationale: הגה विचारमग्न होने के साथ धीमे स्वर में बोलने या दोहराने का भाव भी रख सकता है। मुख्य पाठ में ‘मनन करता है’ प्रसंग के निरंतर, विचारपूर्ण लगाव को स्पष्ट करता है; मुखर-पाठ का संकेत पादटिप्पणी में रखा गया है।
- source_word: יוֹמָם וָלָיְלָה
  choice: दिन-रात
  rationale: यह इब्रानी युग्म निरंतर अभ्यास का द्योतक है। ‘दिन-रात’ सीधा, काव्यात्मक और स्वाभाविक हिन्दी रूप है।
theological_decisions:
- issue: ज्ञान-साहित्य के इस भजन में תּוֹרָה का अनुवाद
  choice: व्यवस्था
  alternative: शिक्षा / निर्देश
  rationale: ‘व्यवस्था’ याहवे की वाचा-संबंधी और प्रकट शिक्षा का पारंपरिक शास्त्रीय भार बनाए रखती है, जबकि व्यापक अर्थ ‘शिक्षा’ को पादटिप्पणी में स्वीकार किया गया है।
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा / प्रभु
  rationale: मूल में प्रयुक्त चार-अक्षरीय व्यक्तिगत नाम को उपाधि से बदलने के बजाय ‘याहवे’ रूप में लिप्यंतरित किया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, काव्यात्मक और गरिमापूर्ण शैली रखी गई है। ‘बल्कि’ पिछले पद के साथ विरोध को स्पष्ट करता है; ‘दिन-रात’ मूल की लय और निरंतरता दोनों बनाए रखता है।
