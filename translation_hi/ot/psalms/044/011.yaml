language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: תִּ֭תְּנֵ/נוּ כְּ/צֹ֣אן מַאֲכָ֑ל וּ֝/בַ/גּוֹיִ֗ם זֵרִיתָֽ/נוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/044/011.yaml
  text: You give us over like sheep for food[b][a], and among the nations you have scattered us.
translation:
  language: hi
  text: तू हमें भोजन के लिए भेड़ों के समान सौंप देता है, और राष्ट्रों में हमें तितर-बितर कर दिया है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תִּתְּנֵנוּ
  choice: तू हमें ... सौंप देता है
  rationale: נתן का मूल अर्थ ‘देना’ है, पर इस विलाप में किसी प्रतिकूल दशा के हवाले कर देने का भाव है। ‘सौंप देता है’ यह प्रसंगगत बल स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: כְּצֹאן
  choice: भेड़ों के समान
  rationale: כְּ तुलना सूचित करता है और צֹאן यहाँ झुंड की भेड़ों का बिंब देता है; ‘भेड़ों के समान’ उपमा को स्पष्ट और गरिमापूर्ण रखता है।
- source_word: מַאֲכָל
  choice: भोजन के लिए
  rationale: संज्ञा का अर्थ ‘भोजन/खाने की वस्तु’ है। ‘वध के लिए’ मूल से अधिक विशिष्ट होता, इसलिए भक्षण के कठोर बिंब को बिना बढ़ाए रखा गया है।
- source_word: וּבַגּוֹיִם
  choice: और जाति-जाति के लोगों में
  rationale: גּוֹיִם का आशय यहाँ इस्राएल के बाहर के राष्ट्रों अथवा लोगों से है। हिन्दी में यह पद विविध विदेशी जनसमुदायों के बीच बिखराव का भाव स्पष्ट करता है और ‘अन्यजातियों’ के संभावित पारिभाषिक भार से बचता है।
- source_word: זֵרִיתָנוּ
  choice: हमें तितर-बितर कर देता है
  rationale: זרה का अर्थ बिखेरना है और उसमें ओसाने का चित्र भी हो सकता है। इस संदर्भ में लोगों के विभिन्न जातीय समूहों के बीच फैलाए जाने के लिए ‘तितर-बितर कर देता है’ स्वाभाविक है। हिब्रू पूर्ण क्रिया को काव्यात्मक विलाप की वर्तमान वर्णन-श्रृंखला में हिन्दी के सामान्य वर्तमान से व्यक्त किया गया है।
theological_decisions:
- issue: परमेश्वर के लोगों का भोजन के लिए भेड़ों जैसा बिंब
  choice: ‘भोजन के लिए भेड़ों के समान’ बिंब को बिना नरम किए बनाए रखा गया है।
  alternative: ‘वध के लिए भेड़ों के समान’ अथवा ‘निगल जाने के लिए भेड़ों के समान’
  rationale: מַאֲכָל भोजन या खाने की वस्तु को सूचित करता है, विशेष रूप से वध को नहीं। इसलिए विलाप की कठोरता तो सुरक्षित रहती है, पर मूल से अधिक विशिष्ट अर्थ नहीं जोड़ा जाता।
- issue: क्रियाओं का काल और परमेश्वर की भूमिका
  choice: दोनों क्रियाओं को ‘सौंप देता है’ और ‘तितर-बितर कर देता है’ के रूप में प्रत्यक्षतः परमेश्वर की क्रिया रखा गया है।
  alternative: ‘तूने हमें सौंप दिया है ... और तितर-बितर कर दिया है’
  rationale: हिब्रू में पहली क्रिया अपूर्ण और दूसरी पूर्ण रूप में है; काव्यात्मक विलाप में यह कालगत तनाव संभव है। हिन्दी का सामान्य वर्तमान तत्काल और जारी अनुभव को स्वाभाविक रूप देता है, जबकि परमेश्वर को कर्ता मानने की मूल की तीखी धार्मिक तनावपूर्ण अभिव्यक्ति बनी रहती है।
translation_notes:
  register: आधुनिक मानक हिन्दी, प्रत्यक्ष एकवचन संबोधन ‘तू’, और भजन-साहित्य के अनुरूप गरिमापूर्ण किंतु सहज शब्दावली अपनाई गई है। ‘जाति-जाति के लोगों’ से גּוֹיִם की बहुवचन व्यापकता स्पष्ट होती है। कोई पाद-टिप्पणी आवश्यक नहीं मानी गई।
