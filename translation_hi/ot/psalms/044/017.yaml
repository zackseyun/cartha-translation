  yaml_path: translation/ot/psalms/044/017.yaml
  text: All this has come upon us[a], yet we have not forgotten you, and we have not been false to your covenant.
translation:
  language: hi
  text: यह सब हम पर आ पड़ा है, फिर भी हम तुझे नहीं भूले हैं और न ही तेरी वाचा के प्रति बेवफाई की है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כָּל זֹאת
  choice: यह सब
  rationale: यह सामूहिक संकेत-वाक्यांश पिछले पदों में वर्णित समस्त विपत्तियों की ओर लौटकर संकेत करता है और כָּל की व्यापकता बनाए रखता है।
- source_word: בָּאַתְנוּ
  choice: हम पर आ पड़ा है
  rationale: בוא के आने वाले रूपक और विपत्ति के किसी पर घटित होने का भाव—दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וְלֹא
  choice: फिर भी ... न तो ... न
  rationale: प्रसंग में दुःख और बनी हुई निष्ठा के बीच विरोध है; हिन्दी की यह रचना उस विरोध तथा दोनों निषेधों को स्पष्ट और सहज रखती है।
- source_word: שְׁכַחֲנוּךָ
  choice: हम ... तुझे भूले हैं
  rationale: द्वितीय पुरुष एकवचन कर्म-प्रत्यय को सीधे संबोधन ‘तुझे’ से सुरक्षित रखा गया है।
- source_word: שִׁקַּרְנוּ
  choice: झूठे निकले हैं
  rationale: שקר यहाँ केवल असत्य बोलने के बजाय विश्वासघाती या मिथ्या आचरण करने का अर्थ रखता है; ‘झूठे निकलना’ इस संबंधपरक बेवफाई को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: בִּבְרִיתֶךָ
  choice: तेरी वाचा के प्रति
  rationale: ב यहाँ झूठे व्यवहार के क्षेत्र या लक्ष्य को दर्शाता है; ‘के प्रति’ हिन्दी में वाचा के संदर्भ में निष्ठाहीन होने का स्वाभाविक संबंध व्यक्त करता है।
theological_decisions:
- issue: दुःख के बीच इस्राएल के निर्दोष होने के दावे का स्वरूप
  choice: पद को परमेश्वर को न भूलने और उसकी वाचा के प्रति झूठा न होने की सीमित, वाचागत निष्ठा की घोषणा के रूप में रखा गया है।
  alternative: इसे परमेश्वर के सामने पूर्ण निष्पापता का व्यापक दावा मानना।
  rationale: इब्रानी पाठ केवल परमेश्वर को भूलने और उसकी वाचा के प्रति मिथ्या व्यवहार करने से इनकार करता है; अनुवाद इससे अधिक व्यापक निष्पापता का दावा नहीं जोड़ता और पाठ का धार्मिक तनाव बनाए रखता है।
translation_notes:
  register: 'आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और काव्यात्मक वाक्य-विन्यास। परमेश्वर के लिए निकट, एकवचन संबोधन ‘तू/तेरा’ रखा गया है, जैसा भजन में प्रत्यक्ष संबोधन के अनुकूल है। अंग्रेज़ी परत में दिया [a] चिह्न संभवतः स्थानांतरित है: उसकी टिप्पणी שִׁקַּרְנוּ בִּבְרִיתֶךָ से संबंधित है, न कि בָּאַתְנוּ से। हिन्दी मुख्य पाठ ‘वाचा के प्रति झूठे निकले’ में उस अर्थ को पर्याप्त रूप से समेटता है, इसलिए अलग पादटिप्पणी आवश्यक नहीं मानी गई।'
