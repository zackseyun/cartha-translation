  yaml_path: translation/ot/psalms/044/020.yaml
  text: If we had forgotten the name of our God and spread out our hands to a foreign god—[a]
translation:
  language: hi
  text: यदि हम अपने परमेश्वर का नाम भूल गए होते, और किसी पराए देवता की ओर अपने हाथ फैलाए होते—[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “किसी विदेशी देवता की ओर।” इब्रानी विशेषण का अर्थ “पराया,” “विदेशी,” या “अजनबी” हो सकता है; यहाँ इसका आशय ऐसे देवता से है जो इस्राएल की वाचा-निष्ठ उपासना के बाहर है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: यदि
  rationale: यह शर्तसूचक अव्यय एक काल्पनिक प्रतिवाद आरम्भ करता है; ‘यदि’ हिन्दी में सरल और स्वाभाविक है।
- source_word: שָׁכַחְנוּ
  choice: हम ... भूल गए होते
  rationale: पूर्ण क्रिया यहाँ काल्पनिक शर्त में है; ‘भूल गए होते’ उस प्रतिकल्पित भाव को स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
- source_word: שֵׁם אֱלֹהֵינוּ
  choice: अपने परमेश्वर का नाम
  rationale: ‘नाम’ परमेश्वर की प्रकट पहचान और आह्वान का द्योतक है; मूल रूपक को बिना व्याख्यात्मक विस्तार के सुरक्षित रखा गया है।
- source_word: וַנִּפְרֹשׂ כַּפֵּינוּ
  choice: अपने हाथ फैलाए होते
  rationale: यह प्रार्थना या विनती की ठोस मुद्रा है। ‘हाथ फैलाना’ आधुनिक हिन्दी में स्वाभाविक है और इसे सीधे ‘उपासना करना’ कहकर अर्थ का अति-निर्धारण नहीं करता।
- source_word: לְאֵל זָר
  choice: किसी पराए देवता की ओर
  rationale: לְ दिशा या संबोधन दर्शाता है, और זָר वाचा-समुदाय की उपासना से बाहर के देवता को सूचित करता है। ‘पराया देवता’ हिन्दी में इस दूरी को स्पष्ट करता है।
theological_decisions:
- issue: मूर्तिपूजक प्रार्थना-मुद्रा
  choice: किसी पराए देवता की ओर अपने हाथ फैलाए होते
  alternative: किसी अपरिचित देवता के सामने अपनी हथेलियाँ फैलाई होतीं
  rationale: मूल पाठ प्रार्थना अथवा उपासना की मुद्रा का ठोस वर्णन करता है। अनुवाद उस संकेत को बनाए रखता है, पर क्रिया को सीधे ‘पूजा की’ में बदलकर निहितार्थ को स्पष्ट कथन नहीं बनाता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘परमेश्वर’ वाचा के सच्चे ईश्वर के लिए और ‘देवता’ विदेशी उपास्य के लिए प्रयुक्त है; इससे संदर्भ स्पष्ट होता है, बिना मूल के ठोस भाव को खोए।
