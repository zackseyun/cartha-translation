  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण काव्यात्मक शैली अपनाई गई है। परमेश्वर के लिए एकवचन आत्मीय संबोधन 'तू' रखा गया है, जो भजन की सीधी प्रार्थनात्मक वाणी और क्रियाओं के एकवचन रूप से मेल खाता है।
