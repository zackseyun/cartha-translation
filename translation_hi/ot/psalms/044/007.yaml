  text: כִּ֣י ה֭וֹשַׁעְתָּ/נוּ מִ/צָּרֵ֑י/נוּ וּ/מְשַׂנְאֵ֥י/נוּ הֱבִישֽׁוֹתָ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/044/007.yaml
  text: For you have saved us from our adversaries[a], and you have put those who hate us to shame.
translation:
  language: hi
  text: क्योंकि तूने हमें हमारे शत्रुओं से बचाया, और हमसे घृणा करने वालों को लज्जित किया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यहाँ यह शब्द पिछले कथन का आधार बताता है; इसलिए कारणसूचक अर्थ रखा गया है।
- source_word: הוֹשַׁעְתָּנוּ
  choice: तूने हमें ... बचाया
  rationale: यָשַׁע के हिफ़ील रूप का मूल अर्थ बचाना या छुड़ाना है; यह अनुवाद परमेश्वर की सीधी और पूर्ण की गई कार्रवाई को बनाए रखता है।
- source_word: מִצָּרֵינוּ
  choice: हमारे शत्रुओं से
  rationale: צַר विरोध करने वाले शत्रु को दर्शाता है। आधुनिक हिन्दी में 'शत्रुओं' स्वाभाविक, स्पष्ट और भजन की गरिमा के अनुकूल है।
- source_word: וּמְשַׂנְאֵינוּ
  choice: हमसे घृणा करने वालों को
  rationale: इब्रानी में शׂנא का कृदन्त रूप है, जिसका शाब्दिक भाव 'हमसे घृणा करने वाले' है; हिन्दी में यही पदबंध स्वाभाविक रूप से उस जारी वैरभाव को व्यक्त करता है।
- source_word: הֱבִישׁוֹתָ
  choice: लज्जित किया
  rationale: בוש के हिफ़ील रूप का अर्थ किसी को लज्जा में डालना है। 'लज्जित किया' कारक भाव को संक्षेप और स्वाभाविक ढंग से व्यक्त करता है।
theological_decisions: []
