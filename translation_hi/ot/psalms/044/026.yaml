  yaml_path: translation/ot/psalms/044/026.yaml
  text: Rise up as our help[c][b][a], and redeem us for the sake of your steadfast love.
translation:
  language: hi
  text: हमारी सहायता के लिए उठ[a], और अपने अटल प्रेम[c] के कारण हमें छुड़ा ले[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उठ, हमारी सहायता बन।” इब्रानी में शाब्दिक रूप से “उठ, हमारे लिए सहायता” है, जहाँ ‘सहायता’ क्रिया नहीं बल्कि संज्ञा है।
    reason: lexical_alternative
  - marker: b
    text: या, “हमें छुटकारा दे” अथवा “हमें बचा ले।” इब्रानी क्रिया मूल्य देकर छुड़ाने या निर्णायक हस्तक्षेप से बचाने का भाव दे सकती है।
    reason: lexical_alternative
  - marker: c
    text: “अटल प्रेम” के लिए इब्रानी शब्द ‘हेसेद’ है, जो प्रायः परमेश्वर के संबंध में प्रेम, निष्ठा और दृढ़ प्रतिबद्धता के भावों को एक साथ व्यक्त करता है।
    reason: cultural_note
lexical_decisions:
- source_word: קוּמָה
  choice: उठ
  rationale: क़ाल आज्ञार्थक एकवचन पुल्लिंग का सीधा और तात्कालिक आह्वान; आधुनिक हिन्दी में संक्षिप्त, स्वाभाविक और सशक्त।
- source_word: עֶזְרָתָה לָנוּ
  choice: हमारी सहायता बन
  rationale: עֶזְרָה के संज्ञात्मक रूप ‘सहायता’ को बनाए रखता है और לָנוּ का हमारे पक्ष में होने का भाव व्यक्त करता है; ‘हमारी सहायता कर’ अधिक स्वाभाविक होता, पर मूल की संज्ञात्मक बनावट मिटा देता।
- source_word: וּפְדֵנוּ
  choice: और हमें छुड़ा ले
  rationale: פדה यहाँ संकट से निर्णायक मुक्ति का आग्रह करता है। ‘छुड़ा ले’ सामान्य आधुनिक हिन्दी में स्वाभाविक है और बिना किसी अनकहे भुगतान को मान लेने के छुटकारे का भाव रखता है।
- source_word: לְמַעַן
  choice: के कारण
  rationale: यहाँ विनती का आधार या प्रेरक कारण बताता है; हिन्दी में ‘के कारण’ स्पष्ट और सहज है।
- source_word: חַסְדֶּךָ
  choice: अपने अटल प्रेम
  rationale: חסד में प्रेम, निष्ठा और स्थिर प्रतिबद्धता के जुड़े हुए भाव हैं। ‘अटल प्रेम’ साधारण पाठक के लिए सुबोध रहते हुए उसकी स्थिरता को सामने लाता है।
theological_decisions:
- issue: פדה को विशिष्ट धार्मिक शब्दावली में प्रस्तुत करना
  choice: हमें छुड़ा ले
  alternative: हमारा छुटकारा कर / हमें मोल लेकर छुड़ा ले
  rationale: मूल क्रिया छुटकारे को व्यक्त कर सकती है, कभी मूल्य देकर और कभी निर्णायक हस्तक्षेप द्वारा। ‘छुड़ा ले’ इस विस्तार को खुला रखता है और बाद की किसी विशिष्ट प्रायश्चित्त-व्याख्या को पद में नहीं डालता।
- issue: חסד में प्रेम और वाचा-संबंधी निष्ठा का संतुलन
  choice: अटल प्रेम
  alternative: करुणा / निष्ठावान प्रेम / वाचा का प्रेम
  rationale: ‘अटल प्रेम’ प्रेमपूर्णता और स्थिर निष्ठा दोनों को संक्षेप में व्यक्त करता है। ‘करुणा’ निष्ठा के पहलू को कम कर सकती है, जबकि ‘वाचा का प्रेम’ मूल में निहित संबंधपरक संकेत को अत्यधिक स्पष्ट कर देता है।
