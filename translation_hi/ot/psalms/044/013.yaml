source:
  edition: WLC
  text: תְּשִׂימֵ֣/נוּ חֶ֭רְפָּה לִ/שְׁכֵנֵ֑י/נוּ לַ֥עַג וָ֝/קֶ֗לֶס לִ/סְבִיבוֹתֵֽי/נוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/044/013.yaml
  text: You have made us a reproach to our neighbors[a], a mockery and derision to those around us.
translation:
  language: hi
  text: तूने हमें हमारे पड़ोसियों के लिए निंदा का पात्र, और हमारे आसपास के लोगों के लिए उपहास और ठट्ठे का विषय बना दिया है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תְּשִׂימֵנוּ
  choice: तूने हमें ... बना दिया है
  rationale: שׂים का मूल अर्थ ‘रखना/बनाना’ है। विलाप के संदर्भ में पूर्ण क्रिया का परिणामसूचक भाव आधुनिक हिन्दी में ‘बना दिया है’ से स्वाभाविक रूप से व्यक्त होता है; एकवचन सम्बोधन ‘तूने’ परमेश्वर से सीधी प्रार्थना को सुरक्षित रखता है।
- source_word: חֶרְפָּה
  choice: निन्दा का पात्र
  rationale: यह शब्द अपमान, बदनामी और दूसरों की तिरस्कारपूर्ण निन्दा का बोध देता है। केवल ‘निन्दा’ की अपेक्षा ‘निन्दा का पात्र’ हिन्दी में किसी समुदाय के सार्वजनिक तिरस्कार का लक्ष्य बन जाने का अर्थ स्पष्ट करता है।
- source_word: לִשְׁכֵנֵינוּ
  choice: हमारे पड़ोसियों के लिए
  rationale: ל संबंध अथवा दृष्टि-संदर्भ बताता है; ‘के लिए’ इब्रानी संरचना को रखते हुए दर्शाता है कि पड़ोसी लोग इस्राएल को निन्दा का पात्र मानते हैं।
- source_word: לַעַג
  choice: उपहास
  rationale: לַעַג हँसी उड़ाने और तिरस्कारपूर्ण मज़ाक का द्योतक है। ‘उपहास’ dignified और वर्तमान मानक हिन्दी में स्पष्ट है।
- source_word: קֶלֶס
  choice: ठट्ठा
  rationale: קֶלֶס तिरस्कारपूर्ण खिल्ली या कटु मज़ाक को व्यक्त करता है। ‘ठट्ठा’ पहले पद ‘उपहास’ से निकट समानांतरता रखते हुए उसकी तीव्रता बढ़ाता है।
- source_word: לִסְבִיבוֹתֵינוּ
  choice: हमारे चारों ओर रहनेवालों के लिए
  rationale: शाब्दिक भाव ‘हमारे चारों ओर वालों के लिए’ है और संदर्भ आसपास के लोगों या जातियों का है। ‘रहनेवालों’ जोड़ने से हिन्दी स्वाभाविक होती है, पर पहचान को अनावश्यक रूप से केवल राष्ट्रों तक सीमित नहीं किया जाता।
theological_decisions:
- issue: क्रिया के कर्ता के रूप में परमेश्वर की प्रत्यक्ष जिम्मेदारी
  choice: ‘तूने ... बना दिया है’ में प्रत्यक्ष सम्बोधन और causative/resultative force बनाए रखा गया।
  alternative: 'निष्क्रिय या अप्रत्यक्ष रूप: ‘हम ... बन गए हैं।’'
  rationale: इब्रानी पाठ स्पष्ट रूप से दूसरे पुरुष एकवचन में परमेश्वर को सम्बोधित करता है। विलाप के धर्मवैज्ञानिक तनाव को नरम करके छिपाना उचित नहीं होगा।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण काव्यात्मक गद्य। ‘तू’ भजन-साहित्य में परमेश्वर के प्रति निकट, प्रत्यक्ष एकवचन सम्बोधन है, अनादर नहीं। समानांतर पदों और सार्वजनिक अपमान की क्रमिक तीव्रता को सुरक्षित रखा गया है।
