id: PSA.44.22
reference: Psalms 44:22
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: כִּֽי עָ֭לֶי/ךָ הֹרַ֣גְנוּ כָל הַ/יּ֑וֹם נֶ֝חְשַׁ֗בְנוּ כְּ/צֹ֣אן טִבְחָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/044/022.yaml
  text: For your sake we are killed all day long[b][a]; we are regarded as sheep for slaughter.
translation:
  language: hi
  text: क्योंकि तेरी खातिर हम दिन भर मारे जाते हैं[a]; हमें वध के लिए भेड़ों के समान समझा जाता है[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘तेरे कारण’ अथवा ‘तेरे निमित्त।’ इब्रानी में परमेश्वर से संबंध के कारण सहा गया दुःख व्यक्त हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या ‘हमें वध के लिए भेड़ों के समान गिना जाता है।’
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले कथन के कारण को प्रस्तुत करता है; आधुनिक हिन्दी में ‘क्योंकि’ इस संबंध को स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
- source_word: עָלֶיךָ
  choice: तेरी खातिर
  rationale: यह दुःख को परमेश्वर से संबंध और उसके प्रति निष्ठा के कारण सहने का भाव देता है, पर परमेश्वर को सीधे हत्या का कर्ता नहीं ठहराता।
- source_word: הֹרַגְנוּ
  choice: हम मारे जाते हैं
  rationale: रूप पूर्ण क्रिया है, पर काव्यात्मक विलाप और ‘दिन भर’ के साथ यह लगातार या बार-बार घटने वाली निष्क्रिय दशा व्यक्त करता है।
- source_word: כָל־הַיּוֹם
  choice: दिन भर
  rationale: निरंतर अवधि के लिए यह सहज आधुनिक हिन्दी अभिव्यक्ति है।
- source_word: נֶחְשַׁבְנוּ
  choice: हमें … समझा जाता है
  rationale: यह חׁשב के निष्क्रिय मूल्यांकनात्मक अर्थ को स्पष्ट करता है; ‘गिना जाता है’ भी संभव है, पर आधुनिक हिन्दी में संख्यात्मक अर्थ का आभास दे सकता है।
- source_word: כְּצֹאן טִבְחָה
  choice: वध के लिए भेड़ों के समान
  rationale: यह उपमा और वध हेतु नियत पशुओं का भाव बनाए रखते हुए स्वाभाविक तथा गरिमापूर्ण हिन्दी देता है।
theological_decisions:
- issue: क्या यह पद दुःख को परमेश्वर द्वारा कराया गया बताता है या परमेश्वर से संबंध और उसके प्रति निष्ठा के कारण सहा गया
  choice: ‘तेरी खातिर’
  alternative: ‘तेरे कारण’ या ‘तेरे निमित्त’
  rationale: इब्रानी पूर्वसर्ग कई निकट अर्थ व्यक्त कर सकता है। मुख्य पाठ दुःख का परमेश्वर से संबंध बनाए रखता है, पर कारण, दोष या प्रत्यक्ष कर्तृत्व को आवश्यकता से अधिक निश्चित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, सरल और गरिमापूर्ण है। परमेश्वर को संबोधित करने के लिए एकवचन ‘तेरी’ रखा गया है, जो भजन की सीधी संबोधन-शैली से मेल खाता है।
