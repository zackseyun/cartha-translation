  yaml_path: translation/ot/psalms/044/016.yaml
  text: because of the voice of one who reproaches and blasphemes[b][a], because of the enemy and the avenger.
translation:
  language: hi
  text: 'निंदा करने और अपशब्द कहनेवाले की आवाज़ के कारण,

    शत्रु और बदला लेनेवाले के कारण।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִקּוֹל
  choice: आवाज़ के कारण
  rationale: מִן यहाँ कारण या अवसर बताता है; यह अनुवाद קוֹל की ठोस छवि और वाक्य का कारणात्मक भाव दोनों बनाए रखता है।
- source_word: מְחָרֵף
  choice: निन्दा ... करनेवाले
  rationale: חרף का कृदन्त रूप तिरस्कार या निन्दा करनेवाले व्यक्ति को दर्शाता है; यह सहज हिन्दी में उस निरन्तर कर्तृभाव को बनाए रखता है।
- source_word: וּמְגַדֵּף
  choice: और परमेश्वर का अपमान करनेवाले
  rationale: גדף में अपमानजनक वाणी के साथ ईश्वर-विरोधी या निन्दात्मक अर्थ भी हो सकता है। हिन्दी में केवल 'अपमान' लक्ष्य को अस्पष्ट छोड़ देता, इसलिए 'परमेश्वर का अपमान' धार्मिक भार को स्पष्ट करता है, जबकि अत्यधिक पारिभाषिक भाषा से बचता है।
- source_word: מִפְּנֵי
  choice: के कारण
  rationale: शाब्दिक रूप से 'मुख/उपस्थिति से' होने पर भी यहाँ यह मुहावरा कारण या अवसर प्रकट करता है और पहली पंक्ति के समानान्तर है।
- source_word: אֹיֵב
  choice: शत्रु
  rationale: यह स्वाभाविक और गरिमापूर्ण हिन्दी है तथा इब्रानी के एकवचन को बनाए रखता है।
- source_word: וּמִתְנַקֵּם
  choice: और बदला लेनेवाले
  rationale: נקם का हित्पएल कृदन्त स्वयं बदला लेनेवाले व्यक्ति को दर्शाता है; यह रूप व्यक्तिगत और सक्रिय भाव को सुरक्षित रखता है।
theological_decisions:
- issue: גדף में सामान्य गाली-गलौज और परमेश्वर-विरोधी निन्दा के बीच अर्थ-व्याप्ति
  choice: परमेश्वर का अपमान करनेवाले
  alternative: बुरा-भला कहनेवाले / निन्दा करनेवाले
  rationale: बाइबिलीय प्रयोग में גדף प्रायः ऐसी उद्दण्ड निन्दा को व्यक्त करता है जिसका लक्ष्य परमेश्वर या उसकी प्रतिष्ठा होती है। चुना हुआ रूप यह धार्मिक भार बनाए रखता है, पर किसी विशिष्ट सम्प्रदायगत व्याख्या को नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, काव्यात्मक और गरिमापूर्ण शैली रखी गई है। दोनों अर्धपंक्तियों में 'के कारण' की पुनरावृत्ति इब्रानी समानान्तरता को स्पष्ट करती है।
