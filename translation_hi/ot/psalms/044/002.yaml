id: PSA.44.2
reference: Psalms 44:2
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: אַתָּ֤ה יָדְ/ךָ֡ גּוֹיִ֣ם ה֭וֹרַשְׁתָּ וַ/תִּטָּעֵ֑/ם תָּרַ֥ע לְ֝אֻמִּ֗ים וַֽ/תְּשַׁלְּחֵֽ/ם׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/044/002.yaml
  text: You[a], by your hand, drove out nations and planted them; you afflicted peoples and sent them out.
translation:
  language: hi
  text: तूने अपने हाथ से राष्ट्रों को निकाल दिया और उन्हें रोप दिया; तूने जनसमूहों को पीड़ित किया और उन्हें भेज दिया।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तूने जनसमूहों को पीड़ित किया और उन्हें फैलाया,” यदि अंतिम “उन्हें” से इस्राएल के पुरखों का संकेत माना जाए, न कि उन जनसमूहों का।
    reason: अंतिम सर्वनाम का संकेत इब्रानी में स्पष्ट नहीं है; वह जनसमूहों अथवा इस्राएल के पुरखों से सम्बद्ध समझा जा सकता है।
lexical_decisions:
- source_word: יָדְךָ
  choice: अपने ही हाथ से
  rationale: यहाँ ‘हाथ’ परमेश्वर की सामर्थ्य और प्रत्यक्ष कार्य का साधनात्मक चित्र है; ‘अपने ही हाथ से’ इस बल को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: גּוֹיִם
  choice: राष्ट्रों
  rationale: सन्दर्भ में यह देश में बसे विदेशी राष्ट्रीय समुदायों को सूचित करता है; ‘राष्ट्रों’ से बाद के धार्मिक अर्थ वाला ‘अन्यजातियों’ शब्द टलता है।
- source_word: הוֹרַשְׁתָּ
  choice: निकाल दिया
  rationale: हिफ़ील रूप का अर्थ अधिकार और स्थान से वंचित करके निकालना है; यह हिन्दी में स्पष्ट और सहज है।
- source_word: וַתִּטָּעֵם
  choice: और उन्हें रोप दिया
  rationale: ‘रोपना’ मूल कृषि-रूपक को सुरक्षित रखता है। सर्वनाम का संकेत मूल पाठ की तरह खुला रखा गया है, यद्यपि सन्दर्भ में इसे इस्राएल के पुरखों से जोड़ना स्वाभाविक है।
- source_word: תָּרַע
  choice: दुःख पहुँचाया
  rationale: क्रिया हानि पहुँचाने या पीड़ित करने का भाव देती है; यह अनावश्यक रूप से हानि के ढंग को निश्चित किए बिना अर्थ व्यक्त करती है।
- source_word: לְאֻמִּים
  choice: जनसमूहों
  rationale: यह पहले प्रयुक्त ‘राष्ट्रों’ के समानार्थी काव्यात्मक शब्द है; ‘जनसमूहों’ से इब्रानी समानांतरता की शब्द-विविधता बनी रहती है।
- source_word: וַתְּשַׁלְּחֵם
  choice: और उन्हें बाहर भेज दिया
  rationale: यह שלח के मूल ‘भेजना’ भाव को सीधे व्यक्त करता है और सन्दर्भगत निष्कासन को ‘बाहर’ से स्पष्ट करता है, बिना ‘तितर-बितर’ जैसे अतिरिक्त अर्थ को अनिवार्य बनाए।
theological_decisions:
- issue: ‘उन्हें रोप दिया’ और ‘उन्हें बाहर भेज दिया’ में सर्वनामों के संकेत
  choice: सन्दर्भगत मुख्य समझ में पहला सर्वनाम इस्राएल के पुरखों और अंतिम सर्वनाम राष्ट्रों/जनसमूहों की ओर संकेत करता है; मुख्य पाठ में इब्रानी की सर्वनामगत संक्षिप्तता रखी गई है।
  alternative: 'अंतिम सर्वनाम भी इस्राएल के पुरखों की ओर संकेत कर सकता है: परमेश्वर ने जनसमूहों को दुःख पहुँचाया और पुरखों को फैलाया।'
  rationale: पद विजय और इस्राएल की स्थापना का वर्णन करता है, इसलिए ‘रोपना’ पुरखों पर और अंतिम निष्कासन जनसमूहों पर लागू करना काव्यगत क्रम के अनुकूल है। फिर भी इब्रानी प्रत्यय स्वयं अपने संकेत को स्पष्ट नहीं करते, इसलिए वैकल्पिक समझ पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और काव्यात्मक हिन्दी। परमेश्वर के लिए निकट प्रत्यक्ष सम्बोधन ‘तू’ रखा गया है। ‘अन्यजाति’ से जुड़ी बाद की धार्मिक छाया से बचने के लिए ‘राष्ट्र’ और काव्यात्मक समानांतरता के लिए ‘जनसमूह’ चुना गया है।
