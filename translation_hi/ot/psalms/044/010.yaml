- source_word: שָׁסוּ
  choice: लूट ले जाते हैं
  rationale: क्रिया युद्ध की लूट बटोरने या छीन लेने को व्यक्त करती है। हिन्दी का वर्तमानकाल विलाप की सजीवता बनाए रखता है।
- source_word: לָמוֹ
  choice: अपने लिए
  rationale: 'यहाँ सर्वनामिक रूप को लाभार्थक अर्थ में लिया गया है: बैर रखनेवाले लूट अपने लाभ के लिए लेते हैं।'
