    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पद आसपास की विनती का कारण बताता है; ‘क्योंकि’ कारणसूचक बल को स्वाभाविक हिन्दी में रखता है।
- source_word: שָׁחָה
  choice: झुक गया है
  rationale: क्रिया नीचे झुकने या दब जाने का बोध देती है। ‘धूल तक झुक गया’ शारीरिक दीनता और अत्यन्त अपमान की काव्यात्मक छवि बनाए रखता है।
- source_word: לֶעָפָר
  choice: धूल तक
  rationale: עָפָר का सामान्य अर्थ ‘धूल’ है और לְ यहाँ नीचे की ओर दिशा या चरम दशा का संकेत देता है।
- source_word: נַפְשֵׁנוּ
  choice: हमारा प्राण
  rationale: נֶפֶשׁ का अर्थ प्राण, जीवन या स्वयं व्यक्ति हो सकता है। ‘प्राण’ आधुनिक हिन्दी में काव्यात्मक और व्यापक है तथा इसे केवल अमूर्त आत्मा तक सीमित नहीं करता।
- source_word: דָּבְקָה
  choice: चिपक गया है
  rationale: यह क्रिया दृढ़ता से लगे या सटे रहने को दर्शाती है; भूमि पर औंधे पड़े होने की सजीव छवि के लिए ‘चिपक गया’ सहज है।
- source_word: לָאָרֶץ
  choice: धरती से
  rationale: אֶרֶץ यहाँ धूल के समानांतर भूमि या धरती को दर्शाता है। हिन्दी में ‘चिपकना’ के साथ ‘से’ स्वाभाविक संबंधसूचक रूप है।
- source_word: בִּטְנֵנוּ
  choice: हमारा पेट
  rationale: בֶּטֶן का सीधा अर्थ पेट या उदर है। ‘पेट’ साधारण आधुनिक हिन्दी में स्पष्ट है और भूमि पर पड़े शरीर की ठोस छवि को सुरक्षित रखता है।
theological_decisions:
- issue: נַפְשֵׁנוּ का मानवशास्त्रीय अर्थ
  choice: हमारा प्राण
  alternative: हमारा जीवन; हम स्वयं; हमारी आत्मा
  rationale: इब्रानी शब्द प्राण, जीवन और स्वयं व्यक्ति—इन अर्थों का विस्तार रखता है। ‘प्राण’ कविता की गहराई बचाता है और पाठ को किसी एक कठोर आत्मा-देह सिद्धान्त में नहीं बाँधता।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘प्राण’, ‘धूल’ और ‘धरती’ विलाप की काव्यात्मक समानता को बनाए रखते हैं, जबकि ‘पेट’ मूल की ठोस शारीरिक छवि को अनावश्यक रूप से मुलायम नहीं करता।
