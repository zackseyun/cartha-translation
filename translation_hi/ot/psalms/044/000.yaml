  text: For the choirmaster[a]. Of the sons of Korah[b]. A Maskil[c].
translation:
  language: hi
  text: संगीत-निर्देशक के लिए[a]। कोरह के वंशजों का[b]। एक मस्कील[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “संगीत-निर्देशक को।”
    reason: alternative_reading
  - marker: b
    text: या, “कोरह के वंशजों के लिए” अथवा “कोरह के वंशजों द्वारा”; भजन-शीर्षकों में इब्रानी संबंधसूचक उपसर्ग अलग-अलग प्रकार का संबंध व्यक्त कर सकता है।
    reason: alternative_reading
  - marker: c
    text: “मस्कील” कई भजनों के शीर्षकों में प्रयुक्त एक इब्रानी शब्द है। सम्भवतः यह किसी शिक्षाप्रद या मननपरक रचना का संकेत देता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: संगीत-निर्देशक के लिए
  rationale: भजन-शीर्षकों में यह पद संगीत-प्रस्तुति का नेतृत्व करने वाले व्यक्ति से संबंध दर्शाता है। ‘के लिए’ לַ की स्वाभाविक सम्भावना व्यक्त करता है; ‘को’ भी सम्भव है।
- source_word: לִבְנֵי קֹרַח
  choice: कोरह के वंशजों का
  rationale: בְּנֵי קֹרַח को स्वाभाविक आधुनिक हिन्दी में ‘कोरह के वंशज’ कहा गया है। संबंधसूचक לִ־ रचना, प्रस्तुति, समर्पण या अन्य संबंध का संकेत दे सकता है; मुख्य पाठ का ‘का’ इसे अनावश्यक रूप से निश्चित नहीं करता।
- source_word: מַשְׂכִּיל
  choice: मस्कील
  rationale: यह भजन-शीर्षकों में प्रयुक्त अनिश्चित विधागत, साहित्यिक या सांगीतिक शब्द है। अर्थ को अनुमान से ‘शिक्षाप्रद’ या ‘मनन-गीत’ तय करने के बजाय इसका लिप्यंतरण किया गया है।
