  yaml_path: translation/ot/psalms/044/006.yaml
  text: For I do not trust in my bow[b][a], and my sword does not save me.
translation:
  language: hi
  text: क्योंकि मैं अपने धनुष पर भरोसा नहीं रखता[a], और मेरी तलवार मुझे नहीं बचाती[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “क्योंकि मैं अपने धनुष पर भरोसा नहीं रखूँगा, और मेरी तलवार मुझे नहीं बचाएगी।” इब्रानी के अपूर्ण क्रिया-रूपों में भविष्य-जैसा भाव भी हो सकता है।
    reason: कालगत_वैकल्पिक_पाठ
  - marker: b
    text: “मुझे बचाती” का अनुवाद इस सैन्य संदर्भ में “मुझे विजय दिलाती” या “मुझे छुड़ाती” भी हो सकता है।
    reason: शाब्दिक_विकल्प
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पद आसपास के कथन का आधार बताता है; ‘क्योंकि’ उसके व्याख्यात्मक संबंध को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: בְקַשְׁתִּי
  choice: अपने धनुष पर
  rationale: קֶשֶׁת युद्ध का ‘धनुष’ है, और בְ यहाँ בטח के साथ उस वस्तु को दर्शाता है जिस पर भरोसा रखा जाता है।
- source_word: אֶבְטָח
  choice: मैं ... भरोसा नहीं रखता
  rationale: בטח का अर्थ ‘भरोसा रखना/निर्भर होना’ है। अपूर्ण क्रिया-रूप यहाँ सामान्य वर्तमान भाव दे सकता है, जबकि भविष्यसूचक अर्थ भी संभव है और पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: וְחַרְבִּי
  choice: और मेरी तलवार
  rationale: शाब्दिक अर्थ और धनुष–तलवार की काव्यात्मक समानांतरता दोनों बनाए रखे गए हैं।
- source_word: תוֹשִׁיעֵנִי
  choice: मुझे नहीं बचाती
  rationale: ישׁע के हिफ़ील रूप का व्यापक अर्थ ‘बचाना/छुड़ाना’ है। सैन्य संदर्भ में ‘विजय दिलाना’ संभव है, पर ‘बचाती’ मूल शब्द की व्यापक अर्थ-छाया को बनाए रखता है।
theological_decisions:
- issue: सैन्य संदर्भ में उद्धार-संबंधी भाषा
  choice: ‘मुझे नहीं बचाती’
  alternative: ‘मुझे विजय नहीं दिलाती’ अथवा ‘मुझे नहीं छुड़ाती’
  rationale: ‘बचाती’ युद्ध के संदर्भ में स्वाभाविक है और साथ ही इब्रानी मूल की व्यापक उद्धार-संबंधी अर्थ-छाया को संकुचित नहीं करता।
- issue: अपूर्ण क्रिया-रूपों का कालगत भाव
  choice: सामान्य वर्तमान—‘भरोसा नहीं रखता’ और ‘नहीं बचाती’
  alternative: भविष्य-जैसा भाव—‘भरोसा नहीं रखूँगा’ और ‘नहीं बचाएगी’
  rationale: काव्यात्मक संदर्भ में ये रूप सामान्य या निरंतर विश्वास की स्थिति व्यक्त कर सकते हैं; वास्तविक भविष्यसूचक संभावना पादटिप्पणी में दी गई है ताकि अस्पष्टता बनी रहे।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘भरोसा रखना’ सामान्य पाठक के लिए स्वाभाविक है; धनुष और तलवार की काव्यात्मक समानांतरता तथा मूल की कालगत अस्पष्टता सुरक्षित रखी गई है।
