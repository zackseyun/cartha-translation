  text: तू हमें राष्ट्रों के बीच एक कहावत, और लोगों के बीच सिर हिलाकर उपहास करने का विषय बना देता है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תְּשִׂימֵנוּ
  choice: तू हमें ... बना देता है
  rationale: שׂים का मूल अर्थ ‘रखना/ठहराना’ है; इस विलाप में परिणामसूचक भाव है। एकवचन संबोधन को ‘तू’ से स्पष्ट रखा गया है।
- source_word: מָשָׁל
  choice: उपहास की कहावत
  rationale: מָשָׁל का अर्थ कहावत या तिरस्कारसूचक लोकोक्ति/चर्चित उदाहरण हो सकता है। ‘उपहास की कहावत’ शब्द के कहावत-संबंधी अर्थ और प्रसंग के तिरस्कार—दोनों को स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: בַּגּוֹיִם
  choice: राष्ट्रों के बीच
  rationale: גּוֹיִם यहाँ सामान्यतः विदेशी राष्ट्रों को दर्शाता है; बाद के तकनीकी धार्मिक अर्थ से बचते हुए ‘राष्ट्रों’ चुना गया है।
- source_word: מְנוֹד רֹאשׁ
  choice: सिर हिलाने की वस्तु
  rationale: यह तिरस्कार या ठट्ठे में सिर हिलाने के संकेत का ठोस चित्र बनाए रखता है; ‘वस्तु’ से स्पष्ट होता है कि समुदाय दूसरों की अवमानना का लक्ष्य बना है।
- source_word: בַּל אֻמִּים
  choice: देश-देश के लोगों के बीच
  rationale: אֻמִּים समानांतर पंक्ति में जनसमूहों/लोगों को सूचित करता है। ‘देश-देश के लोग’ हिंदी काव्यात्मक समानांतरता रखते हुए ‘राष्ट्रों’ की अनावश्यक पुनरावृत्ति से बचाता है।
