review_pass:
  verdict: revise
  source_fidelity: The draft correctly represents the direct second-person singular address, the causative sense of תְּשִׂימֵנוּ, and the parallel references to nations/peoples. However, “सिर हिलाने की वस्तु” is an overly literal and unnatural Hindi noun phrase. The Hebrew idiom denotes becoming the object of derisive head-shaking, which can be expressed naturally without losing the image.
  naturalness: “उपहास की कहावत” is understandable, though the syntax is slightly compressed; the footnote adequately supplies the scornful-byword sense. “देश-देश के लोगों” is not necessary and is less idiomatic than “लोगों.” The revised wording makes the head-shaking idiom natural modern Hindi.
  terminology: “राष्ट्रों” and “लोगों” preserve the poetic parallelism of גּוֹיִם and אֻמִּים. “कहावत” retains the core sense of מָשָׁל, while the note preserves the possible ‘taunt/byword’ nuance. The cultural note explains the derisive sense of the head gesture.
  issues:
  - severity: medium
    issue: “सिर हिलाने की वस्तु” is unnatural Hindi.
    rationale: Although formally close to the Hebrew, it does not idiomatically communicate that others shake their heads in mockery at the psalmist/community. “सिर हिलाकर उपहास करने का विषय” retains the image and its function.
  - severity: low
    issue: “देश-देश के लोगों” adds an unnecessary distributive nuance.
    rationale: The Hebrew simply says “among the peoples.” “लोगों के बीच” is more natural and preserves the parallel without adding emphasis.
  revised_text: तू हमें राष्ट्रों के बीच एक कहावत, और लोगों के बीच सिर हिलाकर उपहास करने का विषय बना देता है।
  revised_footnotes:
