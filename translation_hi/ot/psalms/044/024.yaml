base_translation:
  language: en
  yaml_path: translation/ot/psalms/044/024.yaml
  text: Why do you hide your face and forget our affliction and our oppression?[a]
translation:
  language: hi
  text: तू अपना मुख[a] क्यों छिपाता है और हमारे दुःख और हमारे उत्पीड़न को क्यों भूल जाता है?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तेरी उपस्थिति।” इब्रानी में शाब्दिक रूप से “तेरा मुख” है; यह कृपापूर्ण ध्यान या निकटता के लिए प्रचलित अभिव्यक्ति है।
    reason: lexical_alternative
lexical_decisions:
- source_word: לָמָּה
  choice: क्यों
  rationale: कारण पूछने वाले इस प्रश्नवाचक शब्द का यह स्वाभाविक आधुनिक हिन्दी रूप है और विलाप की सीधी पुकार को बनाए रखता है।
- source_word: פָנֶיךָ
  choice: अपना मुख
  rationale: इब्रानी के शाब्दिक बिंब ‘तेरा मुख’ को हिन्दी के स्वाभाविक आत्मवाचक प्रयोग में रखा गया है; यह परमेश्वर की कृपापूर्ण उपस्थिति और ध्यान का संकेत भी देता है।
- source_word: תַסְתִּיר
  choice: छिपाता है
  rationale: हिफ़ील रूप यहाँ ‘छिपाना’ अर्थ देता है; ‘मुख छिपाना’ काव्यात्मक बिंब को स्पष्ट और संक्षिप्त रूप में सुरक्षित रखता है।
- source_word: תִּשְׁכַּח
  choice: भूल जाता है
  rationale: मूल क्रिया का सीधा अर्थ ‘भूलना’ है। संदर्भ में उपेक्षा का भाव होने पर भी शाब्दिक चयन विलाप की निर्भीक भाषा को बनाए रखता है।
- source_word: עָנְיֵנוּ
  choice: हमारे दुःख
  rationale: यह शब्द दुःख, दीन दशा या पीड़ा को व्यक्त करता है। ‘दुःख’ साधारण पाठक के लिए सहज है और पीड़ा के स्वरूप को अनावश्यक रूप से सीमित नहीं करता।
- source_word: וְלַחֲצֵנוּ
  choice: और हमारे उत्पीड़न
  rationale: לַחַץ शत्रुओं द्वारा डाले गए दबाव, संकट या उत्पीड़न को दर्शा सकता है। ‘उत्पीड़न’ सामुदायिक विलाप में बाहरी शत्रुतापूर्ण दबाव को अच्छी तरह व्यक्त करता है।
theological_decisions:
- issue: परमेश्वर के लिए ‘मुख’ का मानवरूपी बिंब
  choice: ‘अपना मुख’ को मूल बिंब के साथ बनाए रखा गया है।
  alternative: ‘अपनी उपस्थिति’
  rationale: मूल पाठ परमेश्वर की कृपापूर्ण निकटता और ध्यान के लिए सजीव संबंधपरक भाषा का प्रयोग करता है। उसे अमूर्त अभिव्यक्ति में बदलने के बजाय काव्यात्मक और धर्मवैचारिक तनाव सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी; सामूहिक विलाप की सीधी तथा निर्भीक पुकार को बनाए रखा गया है। एकवचन परमेश्वर-संबोधन के लिए ‘तू’ भजन की निकट और प्रत्यक्ष वाणी के अनुरूप है।
