source:
  edition: WLC
  text: אֱלֹהִ֤ים בְּ/אָזְנֵ֬י/נוּ שָׁמַ֗עְנוּ אֲבוֹתֵ֥י/נוּ סִפְּרוּ לָ֑/נוּ פֹּ֥עַל פָּעַ֥לְתָּ בִֽ֝/ימֵי/הֶ֗ם בִּ֣/ימֵי קֶֽדֶם׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/044/001.yaml
  text: God[a], we have heard with our ears; our fathers have told us the deed you did in their days[c][b], in days of old.
translation:
  language: hi
  text: हे परमेश्वर, हमने अपने कानों से सुना है; हमारे पुरखों ने हमें उस कार्य के बारे में बताया है जो तूने उनके दिनों में, बहुत पुराने दिनों में किया था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֱלֹהִים
  choice: हे परमेश्वर
  rationale: यह पद सीधे संबोधन से आरम्भ होता है। हिंदी में ‘हे’ स्वाभाविक रूप से संबोधन स्पष्ट करता है, और ‘परमेश्वर’ אֱלֹהִים का प्रतिष्ठित तथा सामान्य हिंदी रूप है।
- source_word: בְּאָזְנֵינוּ שָׁמַעְנוּ
  choice: हमने अपने कानों से सुना है
  rationale: हिब्रू की देहगत अभिव्यक्ति ‘अपने कानों से’ को बनाए रखते हुए पूर्ण क्रिया को ऐसी हिंदी में रखा गया है जो पीढ़ियों से मिली गवाही की वर्तमान प्रासंगिकता भी व्यक्त करती है।
- source_word: אֲבוֹתֵינוּ
  choice: हमारे पुरखाओं
  rationale: ‘पुरखा’ हिब्रू के पुरुषवाची पारिवारिक शब्द को बनाए रखता है और आधुनिक हिंदी में पूर्वज पीढ़ियों के लिए सहज है।
- source_word: סִפְּרוּ לָנוּ
  choice: हमें बताया है
  rationale: यह पीढ़ी-दर-पीढ़ी सुनाई गई बात का स्वाभाविक हिंदी रूप है और पहले खंड के ‘सुना है’ के साथ मेल खाता है।
- source_word: פֹּעַל פָּעַלְתָּ
  choice: तूने ... क्या काम किया था
  rationale: हिब्रू में संज्ञा और उसी मूल की क्रिया का अर्थ ईश्वर के किए हुए कार्य पर है। हिंदी का प्रश्नवाचक-संबंधवाचक ढाँचा कथनात्मक आशय में स्वाभाविक है और एकवचन सामूहिक ‘काम’ को सुरक्षित रखता है।
- source_word: בִּימֵיהֶם
  choice: उनके दिनों में
  rationale: मूल के काल-सूचक वाक्यांश का सीधा और स्पष्ट रूप।
- source_word: בִּימֵי קֶדֶם
  choice: प्राचीन काल में
  rationale: दूर अतीत का बोध गरिमापूर्ण और वर्तमान हिंदी में सहज ढंग से देता है।
theological_decisions:
- issue: आरम्भिक संबोधन में संबोधन-सूचक शब्द
  choice: हे परमेश्वर
  alternative: परमेश्वर, हमने अपने कानों से सुना है
  rationale: हिब्रू में अलग संबोधन-सूचक अव्यय नहीं है, पर हिंदी में ‘हे’ जोड़ना अर्थगत वृद्धि के बजाय व्याकरणिक और काव्यात्मक संबोधन को स्वाभाविक बनाता है।
- issue: अतीत में परमेश्वर के कार्य का वर्णन
  choice: तूने ... क्या काम किया था
  alternative: वह काम जो तूने ... किया था
  rationale: दोनों रूप मूल के פֹּעַל פָּעַלְתָּ को व्यक्त करते हैं। चुना हुआ रूप हिंदी में अधिक प्रवाहपूर्ण है और कार्य की प्रकृति को अगले पदों में खुलने देता है, बिना उसे पहले से विशिष्ट रूप देने के।
translation_notes:
  register: आधुनिक मानक हिंदी, काव्यात्मक पर सहज और गरिमापूर्ण। परमेश्वर के लिए निकट एकवचन ‘तू’ भजन-साहित्य की सीधी, श्रद्धापूर्ण प्रार्थना-भाषा को व्यक्त करता है। कोई पाद-टिप्पणी आवश्यक नहीं समझी गई।
