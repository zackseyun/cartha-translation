id: PSA.44.21
reference: Psalms 44:21
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: הֲ/לֹ֣א אֱ֭לֹהִים יַֽחֲקָר זֹ֑את כִּֽי ה֥וּא יֹ֝דֵ֗עַ תַּעֲלֻמ֥וֹת לֵֽב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/044/021.yaml
  text: Would not God search this out? For he knows the hidden things of the heart[a].
translation:
  language: hi
  text: क्या परमेश्वर इसकी छानबीन न करता? क्योंकि वह हृदय की छिपी बातों[a] को जानता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “हृदय के भेदों।”
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלֹא
  choice: क्या ... न करता?
  rationale: यह अलंकारिक प्रश्न है जिसका अपेक्षित उत्तर हाँ है। यह रूप प्रश्नात्मक बल और गरिमापूर्ण हिन्दी दोनों बनाए रखता है।
- source_word: אֱלֹהִים
  choice: परमेश्वर
  rationale: यहाँ व्याकरणिक रूप बहुवचन होते हुए भी इस्राएल के एकमात्र परमेश्वर के लिए एकवचन उपाधि है; ‘परमेश्वर’ मानक और स्वाभाविक हिन्दी समतुल्य है।
- source_word: יַחֲקָר
  choice: छानबीन करता
  rationale: क्रिया किसी बात को गहराई से खोजने या जाँचने का भाव देती है। ‘छानबीन’ जाँच के सूक्ष्म और संभावित न्यायिक भाव को स्वाभाविक हिन्दी में व्यक्त करती है।
- source_word: זֹאת
  choice: इसकी
  rationale: संकेतवाचक शब्द पहले कही गई बात की ओर लौटता है। ‘इसकी’ हिन्दी में संक्षिप्त और स्वाभाविक है तथा उसके संदर्भ को अनावश्यक रूप से स्पष्ट नहीं करता।
- source_word: כִּי
  choice: क्योंकि
  rationale: यह अलंकारिक प्रश्न के समर्थन में कारण प्रस्तुत करता है; ‘क्योंकि’ आधुनिक हिन्दी में इस व्याख्यात्मक संबंध को स्पष्ट रखता है।
- source_word: יֹדֵעַ
  choice: जानता है
  rationale: कृदन्त परमेश्वर के स्थायी और चरित्रगत ज्ञान को व्यक्त करता है; हिन्दी का सामान्य वर्तमान काल इसे स्वाभाविक ढंग से संप्रेषित करता है।
- source_word: תַּעֲלֻמוֹת
  choice: छिपी बातों
  rationale: बहुवचन संज्ञा छिपी हुई या गुप्त बातों को सूचित करती है। ‘छिपी बातें’ मूल अर्थ के निकट रहते हुए साधारण आधुनिक हिन्दी में सहज है; ‘भेद’ को पादटिप्पणी में रखा गया है।
- source_word: לֵב
  choice: हृदय
  rationale: इब्रानी प्रयोग में यह विचार, इच्छा और भावनाओं सहित भीतरी व्यक्ति को दर्शाता है। ‘हृदय’ स्रोत की बिंबात्मकता और व्यापक धार्मिक अर्थ को बनाए रखता है।
theological_decisions:
- issue: לֵב की मानवशास्त्रीय अभिव्यक्ति
  choice: हृदय
  alternative: मन; अंतर्मन
  rationale: मूल शब्द बुद्धि, इच्छा और भावनाओं को समेटता है। ‘हृदय’ इसके बाइबलीय बिंब और अर्थ-विस्तार को बिना संकीर्ण किए सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। अलंकारिक प्रश्न को कथन में बदलने के बजाय सुरक्षित रखा गया है।
