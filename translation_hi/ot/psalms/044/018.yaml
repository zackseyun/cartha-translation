  text: לֹא נָס֣וֹג אָח֣וֹר לִבֵּ֑/נוּ וַ/תֵּ֥ט אֲשֻׁרֵ֗י/נוּ מִנִּ֥י אָרְחֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/044/018.yaml
  text: Our heart has not turned back[a], nor have our steps turned aside from your path.
translation:
  language: hi
  text: 'न हमारा हृदय पीछे हटा है,

    न हमारे कदम तेरे मार्ग से भटके हैं।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נָסוֹג אָחוֹר
  choice: पीछे हटा है
  rationale: क्रिया और क्रियाविशेषण का यह संयोजन पीछे हटने या लौट जाने का बोध देता है। ‘पीछे हटा है’ स्वाभाविक हिन्दी में पीछे हटने की काव्यात्मक छवि बनाए रखता है।
- source_word: לִבֵּנוּ
  choice: हमारा हृदय
  rationale: इब्रानी में ‘हृदय’ सामूहिक रूप से भीतरी मनुष्य, इच्छा और निष्ठा को दर्शाता है। शाब्दिक रूप रखने से अर्थ को केवल मन या भावना तक सीमित नहीं किया जाता।
- source_word: וַתֵּט
  choice: भटके हैं
  rationale: נטה का अर्थ झुकना या एक ओर मुड़ना है। मार्ग के रूपक में ‘भटकना’ निर्धारित मार्ग से हटने का स्वाभाविक और स्पष्ट हिन्दी प्रयोग है।
- source_word: אֲשֻׁרֵינוּ
  choice: हमारे कदम
  rationale: यह संज्ञा पैरों के बजाय कदमों या चाल को सूचित करती है; ‘कदम’ मार्ग के काव्यात्मक रूपक को सुरक्षित रखता है।
- source_word: מִנִּי אָרְחֶךָ
  choice: तेरे मार्ग से
  rationale: מִנִּי अलग होने का संबंध बताता है और אֹרַח पथ या मार्ग है। ‘मार्ग से’ संक्षेप और स्वाभाविक रूप से दोनों अर्थ व्यक्त करता है।
theological_decisions:
- issue: ‘हृदय’ का मानव-स्वभाव संबंधी रूपक
  choice: ‘हमारा हृदय’ को बनाए रखा गया है।
  alternative: ‘हमारा मन’ या ‘हमारी निष्ठा’
  rationale: मूल का ‘हृदय’ इच्छा, विचार और निष्ठा सहित भीतरी व्यक्ति को व्यापक रूप से व्यक्त करता है। व्याख्यात्मक विकल्प अर्थ को अनावश्यक रूप से संकुचित कर देते।
- issue: मार्ग से हटने की छवि
  choice: ‘हमारे कदम तेरे मार्ग से भटके हैं’
  alternative: ‘हमारे कदम तेरे मार्ग से मुड़े हैं’
  rationale: यह नैतिक और जीवन-मार्ग की छवि को स्पष्ट रखता है, पर किसी विशिष्ट सिद्धान्तगत अर्थ को पाठ में नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और काव्यात्मक रूप। समानांतर पंक्तियों में निषेध और मार्ग-रूपक सुरक्षित रखे गए हैं; परमेश्वर के लिए निकट संबोधन ‘तेरे’ मूल के एकवचन संबोधन के अनुरूप है।
