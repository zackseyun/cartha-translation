base_translation:
  language: en
  yaml_path: translation/ot/psalms/044/012.yaml
  text: You sell your people for no gain[a], and you have not increased by their price.
translation:
  language: hi
  text: तू अपने लोगों को बिना किसी लाभ के बेच देता है[a], और उनके दाम से अपना धन नहीं बढ़ाता।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तूने अपने लोगों को बिना कुछ पाए बेच दिया, और उनके दाम से अपना धन नहीं बढ़ाया।”
    reason: इब्रानी अपूर्ण क्रिया को प्रसंग में भूतकाल में भी समझा जा सकता है; ‘बिना कुछ पाए’ और ‘अपना धन नहीं बढ़ाया’ मूल के आर्थिक बिंब का वैकल्पिक, अधिक निकट रूप देते हैं।
lexical_decisions:
- source_word: תִּמְכֹּר
  choice: बेच देता है
  rationale: यह מָכַר का क़ाल अपूर्ण, द्वितीय पुरुष एकवचन रूप है। वर्तमानकालीन अभिव्यक्ति विलाप की तात्कालिकता बनाए रखती है; प्रसंग के आधार पर भूतकाल भी संभव है।
- source_word: עַמְּךָ
  choice: अपने लोगों
  rationale: עַם यहाँ परमेश्वर से संबंध रखने वाले समुदाय को दर्शाता है। ‘अपने लोगों’ में राष्ट्रीय और संबंधपरक दोनों भाव स्वाभाविक रूप से बने रहते हैं।
- source_word: בְלֹא הוֹן
  choice: बिना किसी लाभ के
  rationale: הוֹן का मूल अर्थ धन-संपत्ति है, पर इस बिक्री-संदर्भ में वाक्यांश का आशय किसी मूल्यवान प्रतिफल या लाभ का न होना है। यह हिंदी में स्वाभाविक रहते हुए अर्थ को स्पष्ट करता है।
- source_word: רִבִּיתָ
  choice: नहीं बढ़ाता
  rationale: רבה का पिएल रूप ‘बढ़ाना’ या ‘अधिक करना’ व्यक्त करता है। हिंदी में ‘अपना धन नहीं बढ़ाता’ बिक्री से कोई आर्थिक वृद्धि न होने का भाव सुरक्षित रखता है।
- source_word: בִּמְחִירֵיהֶם
  choice: उनके दाम से
  rationale: מְחִיר बिक्री या खरीद का दाम है, और ב यहाँ साधन अथवा स्रोत का भाव दे सकता है। ‘उनके दाम से’ इस संरचना को संक्षेप और स्पष्ट रूप में रखता है।
theological_decisions:
- issue: परमेश्वर को लोगों को बेचने वाला बताने वाली विलापपूर्ण भाषा
  choice: कथन को सीधे आरोप/विलाप के रूप में बनाए रखा गया
  alternative: इसे केवल अनुमति देने या रूपकात्मक त्याग के रूप में समझाकर नरम करना
  rationale: इब्रानी पाठ परमेश्वर को सीधे संबोधित करके ‘तू बेचता है’ कहता है। अनुवाद इस कठिन धार्मिक तनाव को बिना व्याख्यात्मक नरमी के बनाए रखता है।
translation_notes:
  register: आधुनिक, सरल और गरिमापूर्ण हिंदी अपनाई गई है। परमेश्वर के लिए एकवचन ‘तू’ भजन की सीधी संबोधन-शैली और इब्रानी व्याकरण को बनाए रखता है।
