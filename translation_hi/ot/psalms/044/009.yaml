  yaml_path: translation/ot/psalms/044/009.yaml
  text: Yet you have rejected us and put us to shame[a], and you do not go out with our armies.
translation:
  language: hi
  text: फिर भी तूने हमें ठुकरा दिया और लज्जित किया, और तू हमारी सेनाओं के साथ नहीं निकलता[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या, अधिक शाब्दिक रूप से: “तू हमारी सेनाओं में नहीं निकलता।”'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַף
  choice: फिर भी
  rationale: यहाँ यह अव्यय पिछली बातों के विपरीत एक तीखा मोड़ लाता है; ‘फिर भी’ आधुनिक हिन्दी में इस विरोध को स्वाभाविक रूप से व्यक्त करता है।
- source_word: זָנַחְתָּ
  choice: तूने हमें ठुकरा दिया
  rationale: क्रिया का अर्थ अस्वीकार करना या त्याग देना है। ‘ठुकरा दिया’ संबंधपरक अस्वीकृति की तीव्रता को स्पष्ट और सहज हिन्दी में रखता है।
- source_word: וַתַּכְלִימֵנוּ
  choice: और हमें लज्जित किया है
  rationale: हिफ़ील रूप किसी को लज्जा या अपमान में डालने का भाव देता है। यह चयन कारणात्मक अर्थ और विलाप के स्वर को बनाए रखता है।
- source_word: וְלֹא
  choice: और ... नहीं
  rationale: संयोजक और निषेध पिछले आरोप के साथ एक और शिकायत जोड़ते हैं; हिन्दी में ‘और ... नहीं’ इस संचयी संरचना को बनाए रखता है।
- source_word: תֵצֵא
  choice: तू ... नहीं निकलता
  rationale: मूल क्रिया का सामान्य अर्थ ‘निकलना’ है। युद्ध-संदर्भ अगले पदबंध से स्पष्ट होता है, इसलिए मुख्य क्रिया में अनावश्यक रूप से ‘युद्ध करने’ नहीं जोड़ा गया।
- source_word: בְּצִבְאוֹתֵינוּ
  choice: हमारी सेनाओं के साथ
  rationale: צָבָא यहाँ सैन्य दलों को दर्शाता है। בְ को साहचर्य के अर्थ में ‘के साथ’ कहना स्वाभाविक हिन्दी है, जबकि अधिक अक्षरशः विकल्प पादटिप्पणी में सुरक्षित है।
theological_decisions:
- issue: युद्ध में परमेश्वर के पीछे हट जाने का चित्रण
  choice: पद को ऐसे विलाप के रूप में प्रस्तुत किया गया है जिसमें परमेश्वर अब इस्राएल की सेनाओं के साथ नहीं निकलता।
  alternative: 'अधिक अक्षरशः: ‘तू हमारी सेनाओं में नहीं निकलता।’'
  rationale: अनुवाद भजनकार द्वारा अनुभव की गई परमेश्वर की अनुपस्थिति और त्याग की धार्मिक तनावपूर्ण भाषा को बनाए रखता है, पर उससे आगे कोई व्यवस्थित धर्मसैद्धांतिक निष्कर्ष नहीं जोड़ता।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी। परमेश्वर को संबोधन में एकवचन निकटवर्ती ‘तू’ रखा गया है, जो भजन की सीधी प्रार्थनात्मक वाणी और इब्रानी एकवचन को दर्शाता है।
