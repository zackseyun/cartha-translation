source:
  edition: WLC
  text: אַתָּה ה֣וּא מַלְכִּ֣/י אֱלֹהִ֑ים צַ֝וֵּ֗ה יְשׁוּע֥וֹת יַעֲקֹֽב־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/044/004.yaml
  text: You are my King[a], O God; command victories for Jacob.
translation:
  language: hi
  text: हे परमेश्वर, आप ही मेरे राजा हैं; याकूब के लिए विजयों की आज्ञा दीजिए।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘याकूब के लिए छुटकारों की आज्ञा दीजिए’; या ‘याकूब के लिए उद्धार ठहराइए।’
    reason: יְשׁוּעוֹת के अर्थ-क्षेत्र और צַוֵּה के प्रसंगगत अनुवाद के विकल्प सुरक्षित रखने के लिए।
lexical_decisions:
- source_word: אַתָּה הוּא
  choice: आप ही हैं
  rationale: दोनों सर्वनामों से आए बल को स्वाभाविक हिन्दी में ‘आप ही’ व्यक्त करता है।
- source_word: מַלְכִּי
  choice: मेरे राजा
  rationale: संज्ञा पर प्रथम पुरुष एकवचन प्रत्यय का सीधा अर्थ ‘मेरे राजा’ है; सम्बोधन में आदरसूचक रूप स्वाभाविक है।
- source_word: אֱלֹהִים
  choice: हे परमेश्वर
  rationale: यहाँ शब्द प्रत्यक्ष सम्बोधन है। आधुनिक हिन्दी बाइबलीय प्रयोग में ‘परमेश्वर’ स्पष्ट, गरिमापूर्ण और सहज है।
- source_word: צַוֵּה
  choice: आज्ञा दीजिए
  rationale: पिएल आज्ञार्थक का मूल अर्थ ‘आज्ञा देना’ है; आदरसूचक आज्ञार्थक हिन्दी में उपयुक्त है।
- source_word: יְשׁוּעוֹת
  choice: विजयों
  rationale: बहुवचन संज्ञा उद्धार या छुटकारे के कार्यों को दर्शाती है; युद्ध-संदर्भ में ‘विजयों’ उसका ठोस प्रसंगगत अर्थ व्यक्त करता है।
- source_word: יַעֲקֹב
  choice: याकूब
  rationale: मूल पाठ का वाचिक नाम बनाए रखा गया है; यहाँ यह सामूहिक रूप से परमेश्वर की प्रजा की ओर संकेत करता है।
theological_decisions:
- issue: युद्ध-संदर्भ में יְשׁוּעוֹת का अर्थ
  choice: विजयों
  alternative: उद्धारों; छुटकारों
  rationale: आसपास का प्रसंग शत्रुओं और युद्ध से संबंधित है, इसलिए यहाँ बचाने के कार्य युद्ध में मिली विजयों के रूप में सामने आते हैं। पादटिप्पणी व्यापक उद्धार-संबंधी अर्थ सुरक्षित रखती है।
- issue: אֱלֹהִים की वाक्यगत भूमिका
  choice: 'प्रत्यक्ष सम्बोधन: ‘हे परमेश्वर’'
  alternative: 'समानाधिकरण: ‘मेरे राजा परमेश्वर’; विधेयात्मक: ‘मेरा राजा परमेश्वर है’'
  rationale: इब्रानी वाक्य-विन्यास प्रार्थना में प्रत्यक्ष सम्बोधन के रूप में सबसे स्वाभाविक है; यह काव्यात्मक बल को भी बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण प्रार्थना-शैली और आदरसूचक ‘आप’ का प्रयोग। ‘आप ही’ मूल की emphatic रचना को व्यक्त करता है। मुख्य पाठ में युद्ध-संदर्भ के कारण ‘विजयों’ रखा गया है, जबकि पादटिप्पणी मूल शब्द के व्यापक उद्धार/छुटकारा अर्थ को दर्शाती है।
