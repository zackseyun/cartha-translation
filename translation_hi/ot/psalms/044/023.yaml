source:
  edition: WLC
  text: ע֤וּרָ/ה לָ֖/מָּה תִישַׁ֥ן אֲדֹנָ֑/י הָ֝קִ֗יצָ/ה אַל תִּזְנַ֥ח לָ/נֶֽצַח׀׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/044/023.yaml
  text: Awake! Why do you sleep[a], Lord? Rouse yourself; do not reject us forever.
translation:
  language: hi
  text: जाग उठिए! हे प्रभु, आप क्यों सोते हैं? जागिए; हमें सदा के लिए न ठुकराइए।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “हमें सदा के लिए त्याग न दीजिए।”
    reason: lexical_alternative
lexical_decisions:
- source_word: ע֤וּרָה
  choice: जाग उठिए!
  rationale: עור के आज्ञार्थक रूप का सीधा और प्रबल आह्वान; यह परमेश्वर को संबोधित मूल विलाप की निर्भीकता बनाए रखता है और आधुनिक हिन्दी में स्वाभाविक है।
- source_word: לָמָּה
  choice: क्यों
  rationale: शिकायत के प्रश्न को आरम्भ करने वाला सामान्य प्रश्नवाचक क्रियाविशेषण।
- source_word: תִישַׁן
  choice: आप क्यों सोते हैं?
  rationale: ישׁן के अपूर्ण रूप को अलंकारिक प्रश्न के रूप में रखा गया है; सामान्य वर्तमान काल मूल के ‘सोने’ वाले सजीव रूपक को बनाए रखता है।
- source_word: אֲדֹנָי
  choice: हे प्रभु
  rationale: परमेश्वर के लिए प्रत्यक्ष संबोधन का सम्मानपूर्ण और प्रचलित हिन्दी रूप।
- source_word: הָקִיצָה
  choice: उठिए
  rationale: קיץ/יקץ के आज्ञार्थक रूप को पहले जागरण-आह्वान से थोड़ा अलग रखा गया है, जिससे समानांतरता और तीव्रता बनी रहती है तथा अनावश्यक शब्दाडंबर नहीं आता।
- source_word: אַל
  choice: न दीजिए
  rationale: अगली क्रिया के साथ निषेध व्यक्त करने वाला स्वाभाविक हिन्दी विनम्र-आज्ञार्थक रूप।
- source_word: תִּזְנַח
  choice: ठुकरा
  rationale: זנח का अर्थ अस्वीकार करना, तिरस्कारपूर्वक दूर करना या त्याग देना हो सकता है; ‘ठुकरा देना’ स्पष्ट आधुनिक हिन्दी है और भावात्मक बल को सुरक्षित रखता है।
- source_word: לָנֶצַח
  choice: सदा के लिए
  rationale: स्थायी या अनंत अवधि बताने वाले इस सामान्य मुहावरे का सहज आधुनिक हिन्दी रूप।
theological_decisions:
- issue: परमेश्वर के सोने और जागने का मानव-सदृश चित्रण
  choice: भजन के प्रत्यक्ष ‘सोने’ और ‘जागने’ के चित्रण को अनुवाद में बनाए रखना
  alternative: इसे नरम करके ‘आप निष्क्रिय क्यों दिखाई देते हैं?’ कहना या मुख्य पाठ में रूपक की व्याख्या कर देना
  rationale: इब्रानी प्रार्थना परमेश्वर को निर्भीकता से सोने और जागने की भाषा में संबोधित करती है। यह विलाप की अनुभूति है; अनुवाद को इस धर्मवैचारिक तनाव को मिटाकर यह निर्णय नहीं देना चाहिए कि परमेश्वर सचमुच सोते हैं।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, प्रार्थनात्मक और सामान्य पाठकों के लिए सहज रूप अपनाया गया है। परमेश्वर के लिए आदरसूचक ‘आप’ और बहुवचन आज्ञार्थक रूप प्रयुक्त हैं, पर मूल विलाप की निर्भीकता तथा संक्षिप्त समानांतर संरचना बनाए रखी गई है।
