  verdict: revise
  source_fidelity: The draft accurately retains the direct, rhetorical address to God, the sleep/awakening imagery, the prohibition, and the enduring sense of לָנֶצַח. However, the second imperative הָקִיצָה specifically calls for awakening; “उठिए” can naturally mean “stand up” in Hindi and is therefore slightly less precise.
  naturalness: The respectful plural forms and lament register are natural modern Hindi. Replacing the second “उठिए” with “जागिए” keeps the compact parallelism while making the intended awakening sense unambiguous.
  terminology: “हे प्रभु” is an appropriate rendering of אֲדֹנָי in direct address. “ठुकराइए” clearly conveys זנח; the footnote’s “त्याग” supplies a valid lexical alternative.
