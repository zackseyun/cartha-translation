  text: כִּ֤י לֹ֪א בְ/חַרְבָּ֡/ם יָ֥רְשׁוּ אָ֗רֶץ וּ/זְרוֹעָ/ם֮ לֹא הוֹשִׁ֪יעָ֫ה לָּ֥/מוֹ כִּֽי יְמִֽינְ/ךָ֣ וּ֭/זְרוֹעֲ/ךָ וְ/א֥וֹר פָּנֶ֗י/ךָ כִּ֣י רְצִיתָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/044/003.yaml
  text: For they did not possess the land by their sword[a], and their arm did not save them; but your right hand, your arm, and the light of your face did[b], because you delighted in them.
translation:
  language: hi
  text: क्योंकि उन्होंने अपनी तलवार से उस देश पर अधिकार नहीं किया, और न उनकी भुजा ने उनका उद्धार किया; बल्कि आपके दाहिने हाथ, आपकी भुजा और आपके मुख के प्रकाश[a] से ऐसा हुआ, क्योंकि आप उनसे प्रसन्न थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “आपकी उपस्थिति का प्रकाश”; इब्रानी में शाब्दिक रूप से “आपके मुख का प्रकाश” है, जो परमेश्वर के अनुग्रह की छवि है।
    reason: lexical_alternative
lexical_decisions:
- source_word: יָרְשׁוּ
  choice: अधिकार किया
  rationale: सैन्य और भूमि-संबंधी प्रसंग में यह देश को प्राप्त करके उस पर अधिकार करने का भाव व्यक्त करता है; केवल निष्क्रिय विरासत पाने का नहीं।
- source_word: אָרֶץ
  choice: उस देश
  rationale: यहाँ सामान्य पृथ्वी नहीं, पूर्ववर्ती प्रसंग में उल्लिखित विशिष्ट देश अभिप्रेत है।
- source_word: זְרוֹעָם
  choice: उनके अपने भुजबल
  rationale: हिन्दी में भुजा की मूल शारीरिक छवि और सामर्थ्य का भाव दोनों रखता है तथा परमेश्वर की ‘भुजा’ के साथ काव्यात्मक विरोध स्पष्ट करता है।
- source_word: הוֹשִׁיעָה לָּמוֹ
  choice: उनका उद्धार किया
  rationale: ישׁע के बचाने या छुड़ाने के मूल अर्थ को रखता है और सैन्य प्रसंग में भी स्वाभाविक है।
- source_word: יְמִינְךָ
  choice: आपके दाहिने हाथ
  rationale: परमेश्वर के सामर्थ्यपूर्ण कार्य की इब्रानी छवि और बाइबलीय अनुगूँज सुरक्षित रहती है।
- source_word: זְרוֹעֲךָ
  choice: आपकी भुजा
  rationale: मूल रूपक को बनाए रखता है और ‘उनके अपने भुजबल’ के साथ जानबूझकर किया गया विरोध सुरक्षित करता है।
- source_word: אוֹר פָּנֶיךָ
  choice: आपके मुख के प्रकाश
  rationale: ईश्वरीय अनुग्रह की समृद्ध इब्रानी छवि को व्याख्यात्मक शब्द से बदलने के बजाय यथासंभव प्रत्यक्ष रूप में रखता है।
- source_word: רְצִיתָם
  choice: आपने उन पर कृपा की
  rationale: इस संदर्भ में רצה ईश्वरीय प्रसन्नता या अनुग्रह बताता है; ‘कृपा की’ स्वाभाविक हिन्दी में कारणात्मक भाव स्पष्ट करता है, बिना किसी अतिरिक्त सिद्धान्त को जोड़े।
- source_word: כִּי ... כִּי
  choice: क्योंकि ... क्योंकि
  rationale: पहला संयोजक पिछले कथन का आधार और अंतिम संयोजक परमेश्वर के कार्य का कारण बताता है; हिन्दी में पुनरावृत्ति स्वाभाविक और तर्क स्पष्ट है।
theological_decisions:
- issue: ईश्वरीय कार्य बनाम मानवीय सैन्य शक्ति
  choice: देश पर अधिकार और उद्धार का निर्णायक कारण परमेश्वर का कार्य बताया गया है, न कि लोगों के हथियार या सामर्थ्य।
  alternative: परमेश्वर पर निर्भरता का एक सामान्य कथन
  rationale: इब्रानी पाठ स्पष्ट रूप से ‘उनकी तलवार/उनकी भुजा’ का विरोध ‘आपके दाहिने हाथ/आपकी भुजा/आपके मुख के प्रकाश’ से करता है; अनुवाद इसी विशिष्ट विरोध तक सीमित रहता है।
- issue: אוֹר פָּנֶיךָ में अनुग्रह और उपस्थिति की छवि
  choice: मुख्य पाठ में ‘आपके मुख के प्रकाश’ रखा गया है।
  alternative: आपकी उपस्थिति का प्रकाश; आपका अनुग्रह
  rationale: पदबंध ईश्वरीय अनुग्रह का संकेत देता है, किंतु मूल मुख और प्रकाश की छवि को किसी एक व्याख्या में सीमित नहीं करना चाहिए।
- issue: सकारात्मक खंड में क्रिया का लोप
  choice: ‘यह ... से हुआ’ जोड़कर पहले बताए गए अधिकार और उद्धार दोनों को परमेश्वर के कार्य से जोड़ा गया है।
  alternative: शब्दशः संज्ञा-श्रृंखला को बिना स्पष्ट क्रिया के रखना
  rationale: इब्रानी काव्य में क्रिया अध्याहृत है; हिन्दी में स्पष्ट क्रिया आवश्यक है। यह रचना किसी एक पूर्ववर्ती क्रिया को कृत्रिम रूप से दोहराए बिना दोनों परिणामों को समेटती है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सहज काव्यात्मक गद्य। परमेश्वर के लिए आदरसूचक ‘आप’ रखा गया है। ‘भुजबल’ और ‘भुजा’ द्वारा मानवीय और ईश्वरीय सामर्थ्य का समानांतर विरोध सुरक्षित है; सकारात्मक खंड की इब्रानी ellipsis को स्वाभाविक हिन्दी में ‘यह ... से हुआ’ से व्यक्त किया गया है।
