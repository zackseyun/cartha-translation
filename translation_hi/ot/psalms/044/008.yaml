  text: In God we boast all day long[a], and we will give thanks to your name forever[b]. Selah
translation:
  language: hi
  text: हम दिन भर परमेश्वर में गौरव करते हैं[a], और तेरे नाम का धन्यवाद सदा करते रहेंगे[b]। सेला
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इसका अनुवाद ‘हम दिन भर परमेश्वर की स्तुति करते हैं’ या ‘हम दिन भर परमेश्वर में गर्व करते हैं’ भी हो सकता है। इब्रानी क्रिया प्रसंग के अनुसार स्तुति अथवा उल्लासपूर्ण गर्व का भाव दे सकती है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक अर्थ ‘तेरे नाम का’ है। बाइबल में परमेश्वर का ‘नाम’ उसके प्रकट चरित्र और प्रतिष्ठा को दर्शाता है।
    reason: cultural_note
lexical_decisions:
- source_word: בֵּאלֹהִים
  choice: परमेश्वर पर
  rationale: यहाँ בְ परमेश्वर को गर्व का आधार और विषय बताता है। ‘परमेश्वर पर गर्व करना’ आधुनिक हिन्दी में इस भाव को स्वाभाविक रूप से व्यक्त करता है।
- source_word: הִלַּלְנוּ
  choice: हम ... गर्व करते हैं
  rationale: पिएल रूप सामान्यतः ‘स्तुति करना’ भी हो सकता है, पर בֵּאלֹהִים के साथ इसका अर्थ ‘परमेश्वर पर गर्व/गौरव करना’ अधिक उपयुक्त है।
- source_word: כָל הַיּוֹם
  choice: दिन भर
  rationale: यह वाक्यांश पूरे दिन जारी रहने की अवधि व्यक्त करता है; ‘दिन भर’ सहज और संक्षिप्त आधुनिक हिन्दी है।
- source_word: וְשִׁמְךָ
  choice: और तेरे नाम का
  rationale: ‘नाम’ परमेश्वर के प्रकट चरित्र और प्रतिष्ठा की ओर संकेत करता है। हिन्दी में ‘नाम का धन्यवाद करना’ मूल संरचना को निकटता से रखता है, यद्यपि यह बाइबलीय शैली है।
- source_word: לְעוֹלָם
  choice: सदा
  rationale: यह अनिश्चित अथवा अनंत काल की अवधि व्यक्त करता है; ‘सदा’ काव्यात्मक और सामान्य हिन्दी दोनों में स्वाभाविक है।
- source_word: נוֹדֶה
  choice: धन्यवाद करते रहेंगे
  rationale: ידה का हिफ़ील रूप कृतज्ञतापूर्वक धन्यवाद या स्तुति करने का भाव देता है। अपूर्ण क्रिया की भावी और निरंतर घोषणा को ‘करते रहेंगे’ व्यक्त करता है।
- source_word: סֶלָה
  choice: सेला
  rationale: इस उपासना-संबंधी संकेत का ठीक अर्थ अनिश्चित है, इसलिए इसका अनुवाद अनुमान से करने के बजाय लिप्यंतरण किया गया है।
