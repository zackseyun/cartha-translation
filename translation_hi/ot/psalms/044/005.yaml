  text: तेरे द्वारा हम अपने शत्रुओं को पीछे धकेलते हैं[a]; तेरे नाम से[b] हम अपने विरुद्ध उठने वालों को रौंदते हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी क्रिया का शाब्दिक अर्थ पशु की तरह ‘सींग मारना’ है; यहाँ यह शत्रुओं को बलपूर्वक पीछे धकेलने का रूपक है।
    reason: lexical_alternative
  - marker: b
    text: इसका अनुवाद ‘तेरे नाम में’ या ‘तेरे नाम के द्वारा’ भी हो सकता है। यहाँ ‘नाम’ परमेश्वर की प्रकट पहचान, अधिकार और सामर्थ्य को दर्शाता है।
    reason: lexical_alternative
