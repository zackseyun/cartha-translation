- source_word: בְּשִׁמְךָ
  choice: तेरे नाम के द्वारा
  rationale: यहाँ ב साधन अथवा कर्तृत्व बताता है, और ‘नाम’ परमेश्वर की प्रकट पहचान, अधिकार और सामर्थ्य का द्योतक है। यह पहले खंड के ‘तेरे द्वारा’ के समानांतर है।
- source_word: נָבוּס
  choice: हम ... रौंद डालेंगे
  rationale: בוס का अर्थ पैरों तले रौंदना है; ‘रौंद डालेंगे’ युद्ध-संबंधी तीव्रता और परिणामकारी क्रिया को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: קָמֵינוּ
  choice: अपने विरुद्ध उठनेवालों को
  rationale: קום के कृदंत का शाब्दिक गतिशील भाव सुरक्षित रहता है और विरोध करने के लिए उठ खड़े होनेवालों का अर्थ स्पष्ट होता है।
theological_decisions:
- issue: युद्ध में विजय का कर्तृत्व
  choice: वचन परमेश्वर को विजय का निर्णायक साधन और स्रोत बताता है, फिर भी युद्ध की क्रियाएँ समुदाय करता हुआ दिखाया गया है।
  alternative: या तो मानवीय सैन्य क्रिया को प्रधान बनाना, या ‘नाम’ को मात्र किसी सूत्रवत उच्चारण के रूप में लेना।
  rationale: दोनों समानांतर पूर्वसर्गीय वाक्यांश परमेश्वर के कर्तृत्व को सामने रखते हैं, जबकि बहुवचन क्रियाएँ मानवीय सहभागिता बनाए रखती हैं; अनुवाद इस तनाव को हल किए बिना सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में काव्यात्मक, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य रखी गई है। परमेश्वर को संबोधन में निकटता और भजन की प्रत्यक्षता बनाए रखने के लिए ‘तेरे’ का प्रयोग किया गया है।
