  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और काव्यात्मक। 'असंख्य' सामान्य पाठक के लिए सहज है, जबकि पाद-टिप्पणी मूल की सैन्य और विरोधात्मक छाया को बनाए रखती है।
