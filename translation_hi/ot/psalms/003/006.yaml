  text: मैं उन असंख्य लोगों से नहीं डरूँगा, जिन्होंने मुझे चारों ओर से घेर रखा है[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “जो चारों ओर मेरे विरुद्ध आ डटे हैं।”
    reason: मूल में שָׁתוּ עָלָי का अर्थ अपने को तैनात करना और ‘मेरे विरुद्ध’ होना भी लिया जा सकता है; यह विकल्प विरोधात्मक भाव को अधिक स्पष्ट करता है।
lexical_decisions:
- source_word: לֹא אִירָא
  choice: मैं ... नहीं डरूँगा
  rationale: निषेध के साथ प्रथम पुरुष अपूर्ण क्रिया इस काव्य-संदर्भ में भविष्यकालीन विश्वास या दृढ़ निश्चय व्यक्त कर सकती है; यह हिन्दी में स्वाभाविक और अर्थनिष्ठ है।
- source_word: מֵרִבְבוֹת עָם
  choice: उन असंख्य लोगों से
  rationale: רְבָבוֹת बहुत बड़ी संख्या, मूलतः 'दस-दस हज़ारों/असंख्य समूहों', का बिंब देता है। आधुनिक सामान्य हिन्दी में 'असंख्य' विशाल संख्या को स्वाभाविक ढंग से व्यक्त करता है; מִן को डरने के कारण/विषय के रूप में 'से' से दर्शाया गया है।
- source_word: אֲשֶׁר
  choice: जिन्होंने
  rationale: यह सम्बन्धवाचक अव्यय उन लोगों का परिचय देने वाला उपवाक्य आरम्भ करता है।
- source_word: סָבִיב שָׁתוּ עָלָי
  choice: मुझे चारों ओर से घेर रखा है
  rationale: शाब्दिक रूप से वे चारों ओर अपने को रख/तैनात कर चुके हैं। हिन्दी में 'घेर रखा है' स्थानिक घेराबंदी और पूर्ण क्रिया के वर्तमान परिणाम को स्वाभाविक ढंग से व्यक्त करता है; עָלָי की विरोधात्मक छाया पाद-टिप्पणी में सुरक्षित है।
theological_decisions: []
