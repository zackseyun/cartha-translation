  text: O Yahweh[a], how many are my adversaries! Many are rising up against me.
translation:
  language: hi
  text: 'हे याहवे[a], मेरे विरोधी कितने अधिक हैं!


    बहुत-से मेरे विरुद्ध उठ खड़े हो रहे हैं।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में परमेश्वर का विशिष्ट नाम יהוה (YHWH) है, जिसका यहाँ लिप्यंतरण ‘याहवे’ किया गया है।
    reason: मूल इब्रानी नाम और उसके हिन्दी रूप को स्पष्ट करना।
lexical_decisions:
- source_word: יְהוָה
  choice: हे याहवे
  rationale: चतुरक्षरीय इब्रानी नाम יהוה को उपाधि से बदलने के बजाय ‘याहवे’ के रूप में लिप्यंतरित किया गया है; सम्बोधन को व्यक्त करने के लिए ‘हे’ जोड़ा गया है।
- source_word: מָה רַבּוּ
  choice: कितने बढ़ गए हैं
  rationale: מָה यहाँ प्रश्नवाचक नहीं, विस्मयवाचक है; רבה का पूर्ण रूप विरोधियों की संख्या अत्यधिक बढ़ जाने का भाव देता है।
- source_word: צָרָי
  choice: मेरे विरोधी
  rationale: צר सक्रिय रूप से विरोध करने वालों को दर्शाता है; ‘विरोधी’ अर्थ को सुरक्षित रखता है और अनावश्यक रूप से केवल युद्ध-संबंधी शत्रुता तक सीमित नहीं करता।
- source_word: רַבִּים
  choice: बहुत-से लोग
  rationale: यह बहुवचन विशेषण संज्ञा के रूप में प्रयुक्त है; हिन्दी में स्पष्ट और स्वाभाविक अभिव्यक्ति के लिए ‘लोग’ जोड़ा गया है।
- source_word: קָמִים עָלָי
  choice: मेरे विरुद्ध उठ खड़े हो रहे हैं
  rationale: קום का कृदन्त जारी गतिविधि दिखाता है और עַל के साथ शत्रुतापूर्ण विरोध का भाव देता है; यह अनुवाद उसी प्रगतिशील और विरोधात्मक अर्थ को बनाए रखता है।
theological_decisions:
- issue: परमेश्वर के नाम יהוה का अनुवाद
  choice: याहवे
  alternative: प्रभु / यहोवा
  rationale: मूल पाठ में उपाधि नहीं बल्कि परमेश्वर का विशिष्ट नाम יהוה है। ‘याहवे’ उसका प्रचलित विद्वत्तापूर्ण लिप्यंतरण है और मूल की नामात्मकता को सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और विलाप-काव्य के अनुकूल रखी गई है। पहली पंक्ति का विस्मय और दूसरी पंक्ति की समानांतरता सुरक्षित हैं; ‘उठ खड़े हो रहे हैं’ कृदन्त की जारी कार्रवाई को व्यक्त करता है।
