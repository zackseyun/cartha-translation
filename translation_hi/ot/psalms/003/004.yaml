  edition: WLC
  text: ק֭וֹלִ/י אֶל יְהוָ֣ה אֶקְרָ֑א וַ/יַּֽעֲנֵ֨/נִי מֵ/הַ֖ר קָדְשׁ֣/וֹ סֶֽלָה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/003/004.yaml
  text: With my voice I cry to Yahweh[a], and he answers me from his holy mountain[b]. Selah
translation:
  language: hi
  text: 'मेरी आवाज़ से मैं याहवे को पुकारता हूँ,

    और वह अपने पवित्र पर्वत से मुझे उत्तर देता है।[a][b]

    सेलाह'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इसका अनुवाद यह भी हो सकता है: “और उसने अपने पवित्र पर्वत से मुझे उत्तर दिया।” संदर्भ में इब्रानी क्रिया को भूतकाल में समझना संभव है।'
    reason: alternative_reading
  - marker: b
    text: परंपरागत अनुवादों में प्रायः “पवित्र पहाड़ी” मिलता है। इब्रानी शब्द का अधिक मूल अर्थ “पर्वत” है और संभवतः यहाँ सिय्योन का संकेत है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ק֭וֹלִי
  choice: अपनी आवाज़ से
  rationale: शाब्दिक अर्थ ‘मेरी आवाज़’ है। ‘अपनी आवाज़ से’ हिंदी में करण का भाव स्पष्ट करता है और मूल पद के आरंभिक बल को बनाए रखता है।
- source_word: אֶל יְהוָה
  choice: यहोवा को
  rationale: אֶל प्रार्थना की दिशा बताता है; हिंदी में ‘को पुकारना’ स्वाभाविक है। יְהוָה को उपाधि से बदलने के बजाय प्रचलित हिंदी लिप्यंतरण ‘यहोवा’ रखा गया है।
- source_word: אֶקְרָא
  choice: मैं ... पुकारता हूँ
  rationale: प्रार्थना और संकट के संदर्भ में קרא का अर्थ पुकारना या सहायता के लिए पुकार उठना है। यह चयन स्वाभाविक और गरिमापूर्ण हिंदी है।
- source_word: וַיַּעֲנֵנִי
  choice: और वह ... मुझे उत्तर देता है
  rationale: रूप भूतकाल में भी अनूदित हो सकता है, पर काव्य में वर्तमान काल भजनकार के जीवंत और भरोसेपूर्ण कथन को व्यक्त करता है। वैध भूतकालीन विकल्प पादटिप्पणी में दिया गया है।
- source_word: מֵהַר קָדְשׁוֹ
  choice: अपने पवित्र पर्वत से
  rationale: הַר का मूल अर्थ ‘पर्वत’ है; ‘पहाड़ी’ की अपेक्षा यह अधिक सीधा समतुल्य है। प्रत्यय का स्वाभाविक हिंदी रूप ‘अपने’ है और संकेत संभवतः सिय्योन की ओर है।
- source_word: סֶלָה
  choice: सेलाह
  rationale: इस शब्द का ठीक अर्थ अनिश्चित है, इसलिए व्याख्यात्मक अनुवाद के बजाय लिप्यंतरण रखा गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल में परमेश्वर का व्यक्तिगत नाम है, इसलिए उसे ‘प्रभु’ जैसी उपाधि से नहीं बदला गया। आधुनिक हिंदी बाइबल-पाठकों के लिए व्यापक रूप से पहचाना जाने वाला रूप ‘यहोवा’ चुना गया; ‘याहवे’ अधिक ध्वन्यात्मक विकल्प है।
- issue: וַיַּעֲנֵנִי का काल और पक्ष
  choice: वर्तमान काल—‘उत्तर देता है’
  alternative: भूतकाल—‘उत्तर दिया’
  rationale: इब्रानी काव्य में यह रूप बीती हुई घटना अथवा जीवंत/विशिष्ट विश्वास-कथन के रूप में समझा जा सकता है। मुख्य पाठ में वर्तमान की तात्कालिकता रखी गई है और वास्तविक अस्पष्टता पादटिप्पणी में सुरक्षित है।
- issue: पवित्र पर्वत की पहचान
  choice: पाठ में केवल ‘पवित्र पर्वत’
  alternative: पाठ में ‘सिय्योन’
  rationale: संदर्भ संभवतः सिय्योन का है, पर मूल पद उसका नाम नहीं लेता। इसलिए पहचान को मुख्य पाठ में स्पष्ट करके अस्पष्टता नहीं मिटाई गई।
translation_notes:
  register: आधुनिक मानक हिंदी में सरल, काव्यात्मक और गरिमापूर्ण शैली रखी गई है। समानांतर पंक्ति-विन्यास मूल काव्य की गति दिखाता है। ‘सेलाह’ को अनिश्चित तकनीकी/संगीतात्मक पद मानकर बिना व्याख्यात्मक विस्तार के रखा गया है।
