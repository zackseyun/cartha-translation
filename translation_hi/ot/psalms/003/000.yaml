    reason: alternative_reading
lexical_decisions:
- source_word: מִזְמוֹר
  choice: भजन
  rationale: यह शीर्षक किसी संगीतात्मक-काव्य रचना की विधा बताता है; हिन्दी बाइबल परंपरा और आधुनिक सामान्य प्रयोग में ‘भजन’ इसका स्वाभाविक तथा सटीक समतुल्य है।
- source_word: לְדָוִד
  choice: दाऊद का
  rationale: सम्बन्धसूचक לְ रचनाकार, समर्पण या व्यापक सम्बन्ध का बोध करा सकता है। ‘दाऊद का’ हिन्दी में इस सम्भावित बहुअर्थता को अपेक्षाकृत सुरक्षित रखता है।
- source_word: בְּבָרְחוֹ
  choice: जब वह ... भागा था
  rationale: בְּ के साथ प्रत्यययुक्त क्रियार्थक रूप यहाँ समय बताता है; ‘जब वह ... भागा था’ इसका स्वाभाविक हिन्दी रूप है।
- source_word: מִפְּנֵי
  choice: से
  rationale: शाब्दिक अर्थ ‘के सामने/उपस्थिति से’ है, पर भागने के प्रसंग में हिन्दी का सामान्य और स्पष्ट प्रयोग ‘से भागना’ है।
- source_word: אַבְשָׁלוֹם
  choice: अबशालोम
  rationale: व्यक्तिवाचक नाम को प्रचलित हिन्दी बाइबलीय वर्तनी में लिप्यंतरित किया गया है।
- source_word: בְּנוֹ
  choice: अपने पुत्र
  rationale: मूल में ‘उसका पुत्र’ है; हिन्दी में कर्ता दाऊद की ओर लौटते सम्बन्ध को ‘अपने पुत्र’ स्वाभाविक रूप से व्यक्त करता है और पारिवारिक सम्बन्ध को बनाए रखता है।
theological_decisions:
- issue: दाऊद-सम्बन्धी शीर्षक का अर्थ
  choice: ‘दाऊद का’ रखकर सम्बन्ध को खुला छोड़ा गया है।
  alternative: ‘दाऊद द्वारा रचित’ या ‘दाऊद के लिए’
  rationale: भजनों के शीर्षकों में לְ रचनाकार, समर्पण, संग्रह या सम्बन्ध का संकेत दे सकता है। मूल किसी एक अर्थ को निर्णायक नहीं बनाता, इसलिए अनुवाद भी उससे अधिक विशिष्ट ऐतिहासिक दावा नहीं करता।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। शीर्षकीय संक्षिप्तता बनाए रखते हुए ‘दाऊद का’ के साथ मूल इब्रानी की वास्तविक अस्पष्टता को पादटिप्पणी में स्पष्ट किया गया है।
