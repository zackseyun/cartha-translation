source:
  edition: WLC
  text: ק֘וּמָ֤/ה יְהוָ֨ה הוֹשִׁ֘יעֵ֤/נִי אֱלֹהַ֗/י כִּֽי הִכִּ֣יתָ אֶת כָּל אֹיְבַ֣/י לֶ֑חִי שִׁנֵּ֖י רְשָׁעִ֣ים שִׁבַּֽרְתָּ׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/003/007.yaml
  text: Rise up[a], O Yahweh; save me, my God. For you have struck all my enemies on the cheek; you have broken the teeth of the wicked.
translation:
  language: hi
  text: उठ खड़े हो, हे याहवे! हे मेरे परमेश्वर, मुझे बचा ले! क्योंकि तूने मेरे सभी शत्रुओं के गाल[a] पर प्रहार किया है; तूने दुष्टों के दाँत तोड़ दिए हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “गाल” का अनुवाद “जबड़ा” भी हो सकता है। “प्रहार किया है” और “तोड़ दिए हैं” वाले हिब्रू पूर्ण क्रियारूप सम्पन्न कार्य बता सकते हैं; इस काव्यात्मक प्रार्थना में वे परमेश्वर के निश्चित या चरित्रगत कार्य को भी व्यक्त कर सकते हैं।
    reason: मूल के शब्दार्थ और क्रियापक्ष की वास्तविक अस्पष्टता सुरक्षित रखना।
lexical_decisions:
- source_word: קוּמָה
  choice: उठ खड़े हो
  rationale: קום के आग्रहसूचक रूप को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है और परमेश्वर से तत्काल हस्तक्षेप की सजीव पुकार बनाए रखता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: चार अक्षरों वाले व्यक्तिगत ईश्वरीय नाम को हिन्दी में प्रचलित लिप्यंतरण द्वारा रखा गया है, किसी उपाधि से प्रतिस्थापित नहीं किया गया।
- source_word: הוֹשִׁיעֵנִי
  choice: मुझे बचा ले
  rationale: ישׁע के हिफ़ील आग्रहसूचक रूप और प्रथम पुरुष एकवचन प्रत्यय का सीधा, व्यापक और सहज अनुवाद।
- source_word: אֱלֹהַי
  choice: हे मेरे परमेश्वर
  rationale: सम्बोधन और व्यक्तिगत सम्बन्ध, दोनों को स्पष्ट रूप से सुरक्षित रखता है।
- source_word: כִּי
  choice: क्योंकि
  rationale: याचना के आधार को प्रस्तुत करने वाला कारणसूचक सम्बन्ध स्वाभाविक हिन्दी में व्यक्त होता है।
- source_word: הִכִּיתָ
  choice: तूने ... प्रहार किया है
  rationale: हिब्रू पूर्ण पक्ष को सम्पन्न क्रिया के रूप में रखा गया है; प्रार्थना के प्रसंग में इसका आश्वस्त या निश्चित भाव भी बना रहता है।
- source_word: אֶת כָּל אֹיְבַי
  choice: मेरे सभी शत्रुओं
  rationale: प्रत्यक्ष और पारदर्शी अनुवाद, जिसमें כָּל का समावेश बना रहता है।
- source_word: לֶחִי
  choice: गाल पर
  rationale: לֶחִי का सामान्य अर्थ ‘गाल’ है और ‘प्रहार करना’ के साथ हिन्दी में सहज है; ‘जबड़ा’ सम्भव विकल्प के रूप में पादटिप्पणी में दिया गया है।
- source_word: שִׁנֵּי רְשָׁעִים
  choice: दुष्टों के दाँत
  rationale: मूल की ठोस शारीरिक छवि और רְשָׁעִים के सामूहिक बहुवचन को सुरक्षित रखता है।
- source_word: שִׁבַּרְתָּ
  choice: तूने ... तोड़ दिए हैं
  rationale: हिब्रू पूर्ण पक्ष और दाँतों के बहुवचन के अनुरूप सम्पन्न, निर्णायक क्रिया को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: प्रार्थना में הִכִּיתָ और שִׁבַּרְתָּ के पूर्ण क्रियारूप
  choice: 'पूर्ण क्रिया: “तूने ... प्रहार किया है; तूने ... तोड़ दिए हैं”'
  alternative: 'चरित्रगत या निश्चित वर्तमान: “तू ... प्रहार करता है; तू ... तोड़ देता है”'
  rationale: हिब्रू पूर्ण क्रियारूप सम्पन्न कार्य को स्वाभाविक रूप से व्यक्त करते हैं, यद्यपि काव्यात्मक प्रार्थना में वे निश्चित, आश्वस्त या चरित्रगत कार्य भी सूचित कर सकते हैं। मुख्य पाठ में पूर्ण क्रिया रखी गई है और व्यापक पक्षगत सम्भावना पादटिप्पणी में बताई गई है।
- issue: शत्रुओं के विरुद्ध हिंसक बिंब
  choice: गाल पर प्रहार करने और दाँत तोड़ने का मूर्त बिंब बनाए रखना
  alternative: इसे अमूर्त रूप से “तू दुष्टों को पराजित करता है” कहना
  rationale: मूल पाठ अपमान, पराजय और हानि को ठोस शारीरिक बिंब से व्यक्त करता है; उसे नरम या अमूर्त करना अर्थगत तीव्रता घटा देता।
translation_notes:
  register: आधुनिक मानक हिन्दी; परमेश्वर के लिए निकट और काव्यपरक एकवचन “तू” रखा गया है। भाषा सजीव, गरिमापूर्ण और सामान्य पाठक के लिए सहज है; मूल की समान्तरता और कठोर बिंब सुरक्षित हैं।
