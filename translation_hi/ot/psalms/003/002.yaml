  yaml_path: translation/ot/psalms/003/002.yaml
  text: Many are saying of me[c][b][a], “There is no salvation for him in God.” Selah
translation:
  language: hi
  text: 'बहुत-से लोग मेरे विषय में[a] कह रहे हैं,


    “परमेश्वर से उसके लिए कोई उद्धार[b] नहीं है।”


    सेला।[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से “मेरे प्राण से/को”; यहाँ यह मुहावरा “मेरे विषय में” या “मेरे बारे में” के अर्थ में है।
    reason: lexical_alternative
  - marker: b
    text: या “छुटकारा” अथवा “बचाव”।
    reason: lexical_alternative
  - marker: c
    text: “सेला” सम्भवतः संगीत या उपासना से जुड़ा पद है; इसका ठीक अर्थ अनिश्चित है।
    reason: cultural_note
lexical_decisions:
- source_word: רַבִּים
  choice: बहुत-से लोग
  rationale: यह विशेषण यहाँ संज्ञा के रूप में अनेक व्यक्तियों को दर्शाता है; हिंदी में “बहुत-से लोग” स्पष्ट और स्वाभाविक है।
- source_word: אֹמְרִים
  choice: कह रहे हैं
  rationale: इब्रानी कृदन्त जारी या बार-बार होने वाली क्रिया का भाव देता है; “कह रहे हैं” उस निरंतरता को व्यक्त करता है।
- source_word: לְנַפְשִׁי
  choice: मेरे विषय में
  rationale: शाब्दिक अर्थ “मेरे प्राण से/को” है, पर נֶפֶשׁ यहाँ स्वयं व्यक्ति का द्योतक है; “मेरे विषय में” आधुनिक हिंदी में प्रसंगगत मुहावरे का स्पष्ट अर्थ देता है।
- source_word: אֵין
  choice: कोई ... नहीं है
  rationale: यह अस्तित्व का निषेध है; हिंदी में “कोई उद्धार नहीं है” इसका स्वाभाविक रूप है।
- source_word: יְשׁוּעָתָה
  choice: उद्धार
  rationale: यह शब्द बचाव, छुटकारे या विजय को सूचित कर सकता है। “उद्धार” तत्काल संकट से बचाए जाने और व्यापक धार्मिक प्रतिध्वनि—दोनों को बनाए रखता है।
- source_word: לּוֹ
  choice: उसके लिए
  rationale: उद्धृत कथन में विरोधी भजनकार का उल्लेख तीसरे पुरुष में करते हैं; “उसके लिए” इसे सीधे व्यक्त करता है।
- source_word: בֵאלֹהִים
  choice: परमेश्वर में
  rationale: בְּ का निकट औपचारिक अर्थ “में” है। हिंदी में यह कुछ असामान्य होते हुए भी मूल की अभिव्यक्ति और इस अस्पष्टता को बनाए रखता है कि आशय परमेश्वर में उपलब्ध उद्धार से है; “परमेश्वर से” अधिक व्याख्यात्मक होता।
- source_word: סֶלָה
  choice: सेला
  rationale: इस संगीतात्मक या उपासना-संबंधी पद का ठीक अर्थ अनिश्चित है, इसलिए अनुमानित अर्थ देने के बजाय लिप्यंतरण किया गया है।
theological_decisions:
- issue: יְשׁוּעָה को तत्काल बचाव के अर्थ में या व्यापक धार्मिक अर्थ वाले शब्द से व्यक्त करना
  choice: उद्धार
  alternative: छुटकारा / बचाव
  rationale: प्रसंग में संकट से बचाया जाना प्रमुख है, पर “उद्धार” मूल शब्द की व्यापक भजन-साहित्यिक और धर्मवैचारिक प्रतिध्वनि को बिना अनावश्यक विस्तार के सुरक्षित रखता है।
- issue: בֵאלֹהִים में पूर्वसर्ग בְּ का अनुवाद
  choice: परमेश्वर में
  alternative: परमेश्वर से / परमेश्वर के द्वारा
  rationale: “परमेश्वर में” मूल पूर्वसर्ग के निकट रहता और उसकी संभावित अर्थ-व्याप्ति को खुला रखता है। “से” या “के द्वारा” प्रसंगगत अर्थ को अधिक स्पष्ट करता, पर संबंध को चुपचाप निश्चित कर देता।
- issue: לְנַפְשִׁי को शाब्दिक या मुहावरेदार ढंग से व्यक्त करना
  choice: मेरे विषय में
  alternative: मेरे प्राण से / मुझसे
  rationale: נֶפֶשׁ यहाँ पूरे व्यक्ति का प्रतिनिधित्व करता है। शाब्दिक हिंदी अनावश्यक रूप से आत्मा या आंतरिक मनोदशा का संकेत दे सकती है, जो इस प्रसंग में अपेक्षित नहीं है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सार्वजनिक पाठ के योग्य रखी गई है। काव्यात्मक पंक्ति-विन्यास अपनाया गया है। “परमेश्वर में” सामान्य बोलचाल की तुलना में अधिक औपचारिक है, पर मूल के पूर्वसर्ग और उसकी अस्पष्टता को सुरक्षित रखने के लिए जानबूझकर रखा गया है।
