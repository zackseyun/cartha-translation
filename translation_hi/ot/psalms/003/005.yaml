base_translation:
  language: en
  yaml_path: translation/ot/psalms/003/005.yaml
  text: I lay down and slept[a]; I awoke[b], because Yahweh sustains me.
translation:
  language: hi
  text: 'मैं लेट गया और सो गया;

    मैं जाग उठा, क्योंकि याहवे मुझे संभालता है।[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मुझे थामे रखता है।”
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁכַבְתִּי
  choice: मैं लेट गया
  rationale: שׁכב का सामान्य अर्थ ‘लेटना’ है। पूर्ण क्रिया-रूप को सरल भूतकाल में रखकर अगली क्रिया ‘सो गया’ के साथ स्वाभाविक क्रम सुरक्षित रखा गया है।
- source_word: וָאִישָׁנָה
  choice: और सो गया
  rationale: ישׁן का सीधा अर्थ ‘सोना’ है। हिन्दी में पहले आए ‘मैं’ को दोहराए बिना यह संक्षिप्त और काव्यात्मक लगता है।
- source_word: הֱקִיצוֹתִי
  choice: मैं जाग उठा
  rationale: קיץ यहाँ अकर्मक अर्थ में स्वयं जागने को व्यक्त करता है। ‘जाग उठा’ आधुनिक हिन्दी में स्वाभाविक है और जागरण की घटना को स्पष्ट करता है।
- source_word: כִּי
  choice: क्योंकि
  rationale: כִּי यहाँ सुरक्षित सोने और जागने का कारण बताता है; ‘क्योंकि’ इसके कारणवाचक संबंध को साफ़ रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: मूल पाठ में परमेश्वर का व्यक्तिगत नाम, चतुरक्षरीय יְהוָה, आया है। इसे किसी उपाधि से बदलने के बजाय हिन्दी में प्रचलित विद्वत् लिप्यंतरण ‘याहवे’ से व्यक्त किया गया है।
- source_word: יִסְמְכֵנִי
  choice: मुझे संभालता है
  rationale: סמך का अर्थ सहारा देना, थामे रखना या संभालना है। अपूर्ण क्रिया-रूप यहाँ याहवे के निरंतर सहारे को व्यक्त करता है; ‘संभालता है’ सामान्य आधुनिक हिन्दी में स्पष्ट है।
theological_decisions:
- issue: יְהוָה परमेश्वर के नाम का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल में व्यक्तिगत नाम सीधे प्रयुक्त हुआ है। ‘याहवे’ नाम को नाम के रूप में सुरक्षित रखता है और उसे ‘प्रभु’ जैसी उपाधि में नहीं बदलता।
- issue: יִסְמְכֵנִי में परमेश्वर के सहारे की प्रकृति
  choice: मुझे संभालता है
  alternative: मुझे थामे रखता है
  rationale: दोनों विकल्प मूल धातु के सहारा देने वाले भाव को रखते हैं। मुख्य पाठ में अधिक सहज ‘संभालता है’ चुना गया है, जबकि अधिक मूर्त ‘थामे रखता है’ पादटिप्पणी में दिया गया है; किसी विशेष धर्मसैद्धांतिक अर्थ को आरोपित नहीं किया गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सरल रखी गई है। दो पंक्तियों में क्रियाओं का संक्षिप्त क्रम और कारणवाचक निष्कर्ष मूल की काव्यात्मक गति को बनाए रखते हैं।
