  text: उद्धार याहवे का है; तेरी आशीष तेरे लोगों पर हो।[a] सेला।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तेरी आशीष तेरे लोगों पर है।” इब्रानी उपवाक्य में क्रिया नहीं है; इसलिए इसे घोषणा या प्रार्थना—दोनों रूपों में समझा जा सकता है।
    reason: alternative_reading
  - marker: b
    text: ‘सेला’ संभवतः उपासना या संगीत से जुड़ा कोई संकेत है; इसका ठीक अर्थ अनिश्चित है।
    reason: cultural_note
lexical_decisions:
- source_word: לַיהוָה
  choice: याहवे का
  rationale: उपसर्ग ל यहाँ संबंध अथवा स्वामित्व बताता है; इसलिए यह वाक्य उद्धार को याहवे का और उसी से संबंधित ठहराता है। परमेश्वर के निज नाम יהוה को ‘याहवे’ के रूप में लिप्यंतरित किया गया है।
- source_word: הַיְשׁוּעָה
  choice: उद्धार
  rationale: यह संज्ञा बचाव, छुटकारे या विजय का भाव रखती है। ‘उद्धार’ तत्काल संकट से बचाए जाने और इसके व्यापक धार्मिक अर्थ—दोनों को स्वाभाविक रूप से समेटता है।
- source_word: עַל
  choice: पर
  rationale: यहाँ यह आशीष के लोगों पर होने या ठहरने का संबंध व्यक्त करता है; आधुनिक हिन्दी में ‘पर’ सहज है।
- source_word: עַמְּךָ
  choice: तेरी प्रजा
  rationale: עם सामुदायिक और वाचा-संबंधी प्रसंग में परमेश्वर से संबंधित लोगों को दर्शाता है। ‘प्रजा’ हिन्दी में इस सामूहिक संबंध को संक्षेप और गरिमा से व्यक्त करती है।
- source_word: בִרְכָתֶךָ
  choice: तेरी आशीष
  rationale: ברכה का सीधा अर्थ ‘आशीष’ है; इसे ‘कृपा’ कहना अर्थ को अनावश्यक रूप से संकुचित करता।
- source_word: סֶלָה
  choice: सेला
  rationale: इस पद का ठीक अर्थ अनिश्चित है और यह संभवतः उपासना या संगीत का संकेत है; इसलिए अनुमान से अनुवाद करने के बजाय इसका लिप्यंतरण किया गया है।
theological_decisions:
- issue: יהוה परमेश्वर के नाम का अनुवाद
  choice: याहवे
  alternative: यहोवा / प्रभु
  rationale: मूल पाठ में चार अक्षरों वाला निज नाम יהוה सीधे आया है। ‘याहवे’ उस वाचा-संबंधी नाम को सामान्य उपाधि में बदलने के बजाय सुरक्षित रखता है।
- issue: दूसरे, क्रियारहित उपवाक्य का भाव
  choice: तेरी आशीष तेरी प्रजा पर हो
  alternative: तेरी आशीष तेरी प्रजा पर है
  rationale: इब्रानी में यहाँ क्रिया नहीं है, इसलिए वाक्य को प्रार्थना अथवा घोषणा—दोनों रूपों में समझा जा सकता है। मुख्य पाठ में प्रसंगानुकूल प्रार्थनात्मक भाव रखा गया है और घोषणात्मक संभावना पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। परमेश्वर को संबोधित करते समय ‘तेरी’ का प्रयोग भजन की सीधी, काव्यात्मक प्रार्थना-शैली के अनुरूप है। अर्धविराम दोनों संक्षिप्त उपवाक्यों का निकट संबंध दिखाता है, और पादटिप्पणी-चिह्न उन्हीं शब्दों के बाद रखे गए हैं जिनकी वे व्याख्या करते हैं।
