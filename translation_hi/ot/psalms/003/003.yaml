source:
  edition: WLC
  text: וְ/אַתָּ֣ה יְ֭הוָה מָגֵ֣ן בַּעֲדִ֑/י כְּ֝בוֹדִ֗/י וּ/מֵרִ֥ים רֹאשִֽׁ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/003/003.yaml
  text: But you[a], O Yahweh, are a shield around me, my glory[b], and the one who lifts up my head.
translation:
  language: hi
  text: परन्तु हे यहोवा, तू मेरे चारों ओर ढाल है[a], मेरी महिमा है, और मेरा सिर ऊँचा करनेवाला[b] है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘मेरे लिए ढाल’ अथवा ‘मेरी ओर से ढाल’; इब्रानी पूर्वसर्ग किसी के पक्ष में सुरक्षा का भाव भी व्यक्त कर सकता है, यद्यपि यहाँ चारों ओर से रक्षा का भाव सम्भवतः प्रमुख है।
    reason: lexical_alternative
  - marker: b
    text: ‘मेरा सिर ऊँचा करना’ गरिमा, साहस या प्रतिष्ठा की पुनःस्थापना का इब्रानी मुहावरा है।
    reason: cultural_note
lexical_decisions:
- source_word: וְ/אַתָּה
  choice: परन्तु...तू
  rationale: संयोजक और स्वतंत्र सर्वनाम पिछले संकट के विपरीत यहोवा पर जोर देते हैं; आधुनिक हिन्दी में ‘परन्तु...तू’ इस विरोध और बल को स्वाभाविक रूप से व्यक्त करता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: मूल पाठ में प्रयुक्त परमेश्वर के व्यक्तिगत नाम को हिन्दी में प्रचलित लिप्यंतरण ‘यहोवा’ से प्रस्तुत किया गया है, किसी उपाधि से प्रतिस्थापित नहीं किया गया।
- source_word: מָגֵן בַּעֲדִי
  choice: मेरे चारों ओर ढाल
  rationale: מָגֵן का अर्थ रक्षात्मक ढाल है और בַּעֲדִי यहाँ सुरक्षा के पक्षगत या चारों ओर होने का भाव दे सकता है। मुख्य पाठ में ‘चारों ओर’ संरक्षण की सजीव छवि को बनाए रखता है।
- source_word: כְּבוֹדִי
  choice: मेरी महिमा
  rationale: כבוד में महिमा, सम्मान और प्रतिष्ठा के अर्थ निहित हैं। ‘मेरी महिमा’ संक्षिप्त काव्यात्मक अभिव्यक्ति और यह भाव सुरक्षित रखता है कि यहोवा ही भजनकार का सच्चा गौरव है।
- source_word: וּ/מֵרִים רֹאשִׁי
  choice: और मेरा सिर ऊँचा करनेवाला
  rationale: कृदन्त מֵרִים यहोवा के निरंतर चरित्रगत कार्य को दर्शाता है। शाब्दिक देहात्मक बिंब रखते हुए यह हिन्दी में स्वाभाविक है।
theological_decisions:
- issue: परमेश्वर के नाम יְהוָה का अनुवाद
  choice: हे यहोवा
  alternative: हे याहवे
  rationale: मूल में निजी वाचा-नाम सीधे प्रयुक्त हुआ है। हिन्दी के सामान्य बाइबलीय प्रयोग में पहचाने जाने योग्य ‘यहोवा’ नाम को उपाधि ‘प्रभु’ से बदलने के बजाय रखा गया है।
- issue: ‘मेरा सिर ऊँचा करनेवाला’ मुहावरे की व्याख्या
  choice: मुख्य पाठ में ठोस बिंब बनाए रखना
  alternative: मेरा सम्मान लौटानेवाला / मुझे साहस देनेवाला
  rationale: इब्रानी मुहावरा गरिमा, साहस और दोषमुक्ति या प्रतिष्ठा-बहाली जैसे परस्पर जुड़े भाव रख सकता है। किसी एक अर्थ तक सीमित करने के बजाय बिंब मुख्य पाठ में और अर्थ-संकेत पादटिप्पणी में रखा गया है।
- issue: בַּעֲדִי में सुरक्षा का संबंध
  choice: मेरे चारों ओर
  alternative: मेरे लिए / मेरी ओर से
  rationale: पूर्वसर्ग पक्ष में सुरक्षा और घेरकर रक्षा—दोनों भाव दे सकता है। ढाल की छवि के साथ ‘चारों ओर’ प्रसंगानुकूल है, जबकि अन्य वास्तविक संभावनाएँ पादटिप्पणी में सुरक्षित हैं।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और काव्यात्मक रखी गई है। ‘तू’ भजनकार के सीधे, निकट संबोधन और इब्रानी एकवचन सर्वनाम को दर्शाता है। ‘करनेवाला’ को संयुक्त रूप में लिखा गया है।
