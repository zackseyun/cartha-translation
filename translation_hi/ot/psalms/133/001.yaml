id: PSA.133.1
reference: Psalms 133:1
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: שִׁ֥יר הַֽ/מַּעֲל֗וֹת לְ/דָ֫וִ֥ד הִנֵּ֣ה מַה טּ֭וֹב וּ/מַה נָּעִ֑ים שֶׁ֖בֶת אַחִ֣ים גַּם יָֽחַד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/133/001.yaml
  text: A Song of Ascents[a]. Of David. Behold[c][b], how good and how pleasant it is when brothers dwell together!
translation:
  language: hi
  text: 'चढ़ाइयों का गीत[a]। दाऊद का[b]।


    देखो, भाइयों[c] का एक साथ रहना कितना भला और कितना मनोहर है![d]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से ‘चढ़ाइयों का गीत’। यह भजन 120–134 के शीर्षकों में प्रयुक्त पद है; संभव है कि ये गीत यरूशलेम की ओर चढ़ते समय गाए जाते थे।
    reason: शीर्षक के शाब्दिक अर्थ और संभावित ऐतिहासिक प्रयोग में अंतर बताना।
  - marker: b
    text: ‘दाऊद का’ का अर्थ ‘दाऊद द्वारा’, ‘दाऊद से संबंधित’ या ‘दाऊद के लिए’ भी हो सकता है।
    reason: इब्रानी संबंधसूचक לְ की वास्तविक अस्पष्टता सुरक्षित रखना।
  - marker: c
    text: ‘भाइयों’ से सगे भाई या, व्यापक अर्थ में, एक ही समुदाय के सदस्य अभिप्रेत हो सकते हैं।
    reason: אַחִים के पारिवारिक और सामुदायिक दोनों संभावित अर्थ बताना।
  - marker: d
    text: इब्रानी पद גַּם יָחַד साथ रहने पर विशेष जोर देता है; इसका अनुवाद ‘मेल से’ या ‘एकता में’ भी किया जाता है।
    reason: जोरदार इब्रानी अभिव्यक्ति और व्याख्यात्मक विकल्प दर्ज करना।
lexical_decisions:
- source_word: שִׁיר הַמַּעֲלוֹת
  choice: चढ़ाइयों का गीत
  rationale: मַעֲלוֹת के बहुवचन और ऊपर चढ़ने के मूल बिंब को बनाए रखता है; ‘तीर्थयात्रा का गीत’ प्रसंग की व्याख्या कर देता।
- source_word: לְדָוִד
  choice: दाऊद का
  rationale: भजन-शीर्षकों में לְ लेखकत्व, संबंध या समर्पण सूचित कर सकता है। हिंदी में ‘दाऊद का’ इस संबंध को ‘दाऊद द्वारा’ की अपेक्षा अधिक खुला रखता है।
- source_word: הִנֵּה
  choice: देखो
  rationale: ध्यान आकर्षित करने और विस्मय व्यक्त करने वाला स्वाभाविक, गरिमापूर्ण आधुनिक हिंदी रूप।
- source_word: מַה טּוֹב וּמַה נָּעִים
  choice: कितना भला और कितना मनोहर
  rationale: दोनों विस्मयवाचक מַה और समानांतर विशेषणों को काव्यात्मक तथा स्पष्ट हिंदी में सुरक्षित रखता है।
- source_word: שֶׁבֶת
  choice: रहना
  rationale: ישׁב के क्रियात्मक भाव—बैठने, बसने या साथ निवास करने—को प्रसंगानुकूल सहज हिंदी में व्यक्त करता है।
- source_word: אַחִים
  choice: भाइयों
  rationale: इब्रानी पुल्लिंग बहुवचन का सीधा अनुवाद है; यह सगे भाइयों के साथ व्यापक बिरादरी या वाचा-समुदाय के सदस्यों को भी सूचित कर सकता है।
- source_word: גַּם יָחַד
  choice: एक साथ
  rationale: יָחַד का सीधा अर्थ देता है और גַּם से आए बल को हिंदी के संयुक्त पद ‘एक साथ’ में स्वाभाविक रूप से व्यक्त करता है, बिना ‘एकता में’ जैसी व्याख्यात्मक वृद्धि के।
theological_decisions:
- issue: אַחִים का दायरा
  choice: मुख्य पाठ में ‘भाइयों’ रखा गया और व्यापक सामुदायिक अर्थ पादटिप्पणी में बताया गया।
  alternative: ‘बंधुजनों’ या ‘समुदाय के लोगों’ के रूप में अनुवाद करना।
  rationale: मूल शब्द का व्याकरणिक रूप और पारिवारिक बिंब बनाए रखना चाहिए, पर उसके संभावित व्यापक वाचा-सामुदायिक अर्थ को दबाना भी नहीं चाहिए।
- issue: גַּם יָחַד का भाव
  choice: ‘एक साथ’
  alternative: ‘मेल-मिलाप से’ अथवा ‘एकता में’
  rationale: मूल में साथ रहने पर जोर है; सामंजस्य निहित हो सकता है, पर मुख्य पाठ में उसे स्वतंत्र धर्मवैचारिक धारणा के रूप में स्पष्ट करना मूल से अधिक व्याख्यात्मक होता।
- issue: לְדָוִד का संबंध
  choice: ‘दाऊद का’
  alternative: ‘दाऊद द्वारा’ या ‘दाऊद के लिए’
  rationale: शीर्षक का לְ लेखकत्व, संबंध अथवा समर्पण में से किसी एक को निश्चित नहीं करता; चुना हुआ हिंदी रूप इस तनाव को यथासंभव खुला रखता है।
translation_notes:
  register: आधुनिक मानक हिंदी में संक्षिप्त, गरिमापूर्ण काव्यात्मक शैली रखी गई है। ‘देखो’ मूल के ध्यानाकर्षक स्वर को बचाता है; ‘भला’ और ‘मनोहर’ सामान्य पाठक के लिए बोधगम्य रहते हुए भजन की ऊँची शैली के अनुकूल हैं।
