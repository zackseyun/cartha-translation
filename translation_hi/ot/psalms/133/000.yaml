  text: A Song of Ascents[a]. Of David. Behold[c][b], how good and how pleasant it is for brothers to dwell together.
translation:
  language: hi
  text: 'चढ़ाइयों का गीत।[a] दाऊद का।


    देखो, भाइयों का एक साथ रहना कितना अच्छा और कितना मनोहर है![b][c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से ‘चढ़ाइयों का गीत’। यह उन गीतों की श्रेणी का शीर्षक है जिन्हें संभवतः यरूशलेम की ओर चढ़ते समय गाया जाता था; इसका ठीक आशय निश्चित नहीं है।
    reason: lexical_alternative
  - marker: b
    text: ‘भाई’ का अर्थ सगे भाई हो सकता है, और अधिक व्यापक रूप से निकट संबंधी या परमेश्वर के लोगों के समुदाय के सदस्य भी।
    reason: lexical_alternative
  - marker: c
    text: इब्रानी में ‘भी/वास्तव में, एक साथ’; यह पदबंध मिल-जुलकर रहने पर विशेष बल देता है। इसका अनुवाद ‘एकता में रहना’ भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁיר הַמַּעֲלוֹת
  choice: आरोहणों का गीत
  rationale: शाब्दिक रूप से यह ‘चढ़ाइयों/आरोहणों का गीत’ है। यह पदबंध यात्रा, विशेषकर यरूशलेम की ओर चढ़ने, अथवा किसी गान-परंपरा से जुड़ा हो सकता है; इसलिए मूल की संक्षिप्तता और संभावित अर्थ-व्याप्ति रखी गई है।
- source_word: לְדָוִד
  choice: दाऊद का
  rationale: इब्रानी לְ संबंध, रचनाकारिता, समर्पण या संबद्धता व्यक्त कर सकता है। संक्षिप्त शीर्षकीय रूप ‘दाऊद का’ इस अस्पष्टता को अनावश्यक रूप से नहीं सुलझाता।
- source_word: הִנֵּה
  choice: देखो
  rationale: यह ध्यान आकर्षित करने वाला विस्मयात्मक संकेत है; ‘देखो’ उसका सीधा और स्वाभाविक हिन्दी समतुल्य है।
- source_word: אַחִים
  choice: भाई
  rationale: मूल शब्द का प्राथमिक अर्थ ‘भाई’ है, पर यहाँ इसका प्रयोग निकट संबंधियों या समुदाय के सदस्यों के लिए भी व्यापक हो सकता है।
- source_word: שֶׁבֶת ... גַּם יָחַד
  choice: एक साथ रहें
  rationale: שֶׁבֶת यहाँ साथ निवास करने या बने रहने का भाव देता है। גַּם יָחַד साझा रहने पर बल देता है; सहज हिन्दी में ‘एक साथ रहें’ उस भाव को व्यक्त करता है।
theological_decisions:
- issue: ‘भाइयों’ की पहचान
  choice: मुख्य पाठ में ‘भाई’ रखा गया
  alternative: ‘बंधुजन’ या ‘समुदाय के लोग’
  rationale: मूल का ठोस पारिवारिक शब्द बनाए रखने से उसके शाब्दिक और व्यापक सामुदायिक—दोनों संभावित अर्थ खुले रहते हैं।
- issue: לְדָוִד में रचनाकारिता
  choice: ‘दाऊद का’
  alternative: ‘दाऊद द्वारा रचित’
  rationale: इब्रानी संबंधसूचक पदबंध स्वयं रचनाकारिता को निर्णायक रूप से निर्दिष्ट नहीं करता; अतः अधिक स्पष्ट दावा नहीं जोड़ा गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सार्वजनिक पाठ के योग्य रखी गई है। शीर्षक की पारंपरिक संक्षिप्तता तथा पद की विस्मयात्मक, काव्यात्मक लय बनाए रखने के लिए छोटे वाक्य और ‘कितना अच्छा और कितना मनोहर’ संरचना अपनाई गई है।
