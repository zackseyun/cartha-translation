  text: כַּ/שֶּׁ֤מֶן הַ/טּ֨וֹב עַל הָ/רֹ֗אשׁ יֹרֵ֗ד עַֽל הַ/זָּקָ֥ן זְקַֽן אַהֲרֹ֑ן שֶׁ֝/יֹּרֵ֗ד עַל פִּ֥י מִדּוֹתָֽי/ו׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/133/002.yaml
  text: It is like the good oil on the head[a], running down on the beard, on Aaron’s beard[b], which runs down on the collar of his robes.
translation:
  language: hi
  text: वह सिर पर के उत्तम तेल के समान है, जो दाढ़ी पर—हारून की दाढ़ी पर—बहता है, और उसके वस्त्रों के गले तक उतरता है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसके वस्त्रों के खुले भाग” या “किनारे तक।” इब्रानी में शाब्दिक रूप से “उसके वस्त्रों के मुँह तक” है; इसका अर्थ वस्त्रों का गला, खुला भाग, या किनारा हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּשֶּׁמֶן הַטּוֹב
  choice: उत्तम तेल के समान
  rationale: כְּ तुलना सूचित करता है और טוֹב का मूल अर्थ ‘अच्छा’ है; तेल की गुणवत्ता के संदर्भ में ‘उत्तम तेल’ आधुनिक हिन्दी में अधिक स्वाभाविक और गरिमापूर्ण है।
- source_word: עַל הָרֹאשׁ
  choice: सिर पर डाले गए
  rationale: इब्रानी में शाब्दिक रूप से ‘सिर पर’ है। हिन्दी में तेल के सिर पर होने और फिर नीचे बहने की छवि स्पष्ट करने के लिए ‘डाले गए’ निहित क्रिया के रूप में जोड़ा गया है।
- source_word: יֹרֵד
  choice: बहता हुआ ... उतर आता है
  rationale: ירד का अर्थ नीचे उतरना है; तेल के संदर्भ में ‘बहता हुआ’ दृश्य की स्वाभाविक गति व्यक्त करता है, जबकि ‘उतर आता है’ मूल दिशा को बनाए रखता है।
- source_word: הַזָּקָן זְקַן אַהֲרֹן
  choice: दाढ़ी पर, हारून की दाढ़ी पर
  rationale: मूल की काव्यात्मक पुनरुक्ति को बनाए रखा गया है।
- source_word: פִּי מִדּוֹתָיו
  choice: उसके वस्त्रों के गले
  rationale: פִּי का शाब्दिक अर्थ ‘मुँह’ है, पर वस्त्रों के साथ यह उनके खुले भाग या गले को दर्शाता है; מִדּוֹתָיו यहाँ उसके वस्त्रों को सूचित करता है।
theological_decisions:
- issue: तेल की छवि का स्वरूप
  choice: हारून से जुड़ी प्रचुर अभिषेक-छवि को बिना व्याख्यात्मक सिद्धान्त जोड़े काव्यात्मक उपमा के रूप में रखा गया।
  alternative: मुख्य पाठ में इसे स्पष्ट रूप से ‘अभिषेक का तेल’ कहना।
  rationale: हारून का उल्लेख अभिषेक की पृष्ठभूमि जगाता है, पर इस पद में तेल के लिए स्वयं ‘अभिषेक का’ नहीं कहा गया है; इसलिए संकेत सुरक्षित रखा गया, पर उसे पाठ में स्पष्ट सिद्धान्त नहीं बनाया गया।
- issue: פִּי מִדּוֹתָיו का आशय
  choice: वस्त्रों का गला
  alternative: वस्त्रों का किनारा
  rationale: वाक्यांश वस्त्र के ‘मुँह’, अर्थात खुले भाग, को दर्शा सकता है। इस प्रसंग में सिर और दाढ़ी से नीचे बहते तेल के क्रम के कारण गले का खुला भाग अधिक संभावित है, फिर भी वैकल्पिक अर्थ पादटिप्पणी में रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में काव्यात्मक, गरिमापूर्ण और सहज शैली। ‘उत्तम तेल’ ने ‘अच्छा तेल’ की अपेक्षा प्राकृतिक हिन्दी में गुणवत्ता का भाव रखा है। मूल की ‘दाढ़ी पर, हारून की दाढ़ी पर’ पुनरुक्ति सुरक्षित रखी गई है।
