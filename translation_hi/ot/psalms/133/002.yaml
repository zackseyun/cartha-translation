    issue: “सिर पर डाले गए” adds an action not expressed in the Hebrew.
    rationale: The source has ‘the good oil on the head,’ not an explicit verb for applying or pouring the oil.
  - severity: medium
    issue: The two occurrences of the descending participle are compressed into “बहता हुआ ... उतर आता है.”
    rationale: The Hebrew first depicts oil descending upon the beard and then resumes the description with a relative clause as it descends to the garments’ opening. Rendering both motions explicitly preserves the poetic structure and referential clarity.
