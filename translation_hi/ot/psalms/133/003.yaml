  text: כְּ/טַל חֶרְמ֗וֹן שֶׁ/יֹּרֵד֮ עַל הַרְרֵ֪י צִ֫יּ֥וֹן כִּ֤י שָׁ֨ם צִוָּ֣ה יְ֭הוָה אֶת הַ/בְּרָכָ֑ה חַ֝יִּ֗ים עַד הָ/עוֹלָֽם־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/133/003.yaml
  text: like the dew of Hermon[a], which falls on the mountains of Zion. For there Yahweh commanded the blessing[b], life forever.
translation:
  language: hi
  text: हर्मोन की ओस के समान[a], जो सिय्योन के पहाड़ों पर उतरती है। क्योंकि वहीं याहवे ने आशीष का आदेश दिया—सदा का जीवन।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “सिय्योन के पहाड़ों पर उतरनेवाली हर्मोन की ओस के समान।”
    reason: काव्यात्मक वाक्यरचना को हिन्दी में दूसरे ढंग से जोड़ा जा सकता है।
  - marker: b
    text: या, “सदा-सर्वदा का जीवन।”
    reason: עַד הָעוֹלָם की स्थायी कालावधि का निकट वैकल्पिक अनुवाद।
lexical_decisions:
- source_word: כְּ/טַל חֶרְמוֹן
  choice: हर्मोन की ओस के समान
  rationale: כְּ तुलना प्रकट करता है और טַל का अर्थ ‘ओस’ है। यह रूपक को स्वाभाविक आधुनिक हिन्दी में बनाए रखता है।
- source_word: שֶׁ/יֹּרֵד
  choice: जो ... उतरती है
  rationale: ירד नीचे आने या उतरने को व्यक्त करता है। ओस के लिए ‘उतरती है’ हिन्दी में स्वाभाविक है और मूल की नीचे की दिशा को भी बनाए रखता है।
- source_word: עַל הַרְרֵי צִיּוֹן
  choice: सिय्योन के पहाड़ों पर
  rationale: הַרְרֵי बहुवचन संबंधसूचक रूप है; इसलिए मूल के बहुवचन को ‘पहाड़ों’ के रूप में रखा गया है।
- source_word: כִּי שָׁם
  choice: क्योंकि वहीं
  rationale: כִּי कारण बताता है और שָׁם स्थान की ओर संकेत करता है। ‘वहीं’ उसके संदर्भ को स्पष्ट किए बिना मूल की काव्यात्मक संक्षिप्तता बनाए रखता है।
- source_word: צִוָּה יְהוָה אֶת הַ/בְּרָכָה
  choice: याहवे ने आशीष देने का आदेश दिया
  rationale: צִוָּה का मूल अर्थ ‘आदेश देना’ है। शाब्दिक ‘आशीष को आदेश दिया’ हिन्दी में अस्वाभाविक होता; यह रूप परमेश्वर के अधिकारपूर्ण आदेश को सुरक्षित रखते हुए अर्थ को स्पष्ट करता है। याहवे व्यक्तिगत नाम יְהוָה का लिप्यंतरण है।
- source_word: חַיִּים עַד הָ/עוֹלָם
  choice: सदा का जीवन
  rationale: यह पदबंध आशीष का स्वरूप बताता है। ‘सदा का जीवन’ अवधि के भाव को बनाए रखता है और ‘अनन्त जीवन’ से जुड़ी बाद की पारिभाषिक ध्वनि को अनावश्यक रूप से नहीं थोपता।
theological_decisions:
- issue: अंतिम पदबंध का ‘आशीष’ से संबंध
  choice: ‘सदा का जीवन’ को पूर्ववर्ती आशीष का समानाधिकरणात्मक स्पष्टीकरण माना गया है।
  alternative: इसे अलग वाक्य या विस्मयात्मक कथन माना जा सकता है।
  rationale: इब्रानी क्रम ‘आशीष, सदा का जीवन’ स्वाभाविक रूप से आशीष की विषय-वस्तु बताता है। डैश हिन्दी में यह संबंध स्पष्ट करता है, बिना कोई विकसित धर्मवैज्ञानिक सूत्र जोड़ने के।
- issue: ‘वहीं’ का संदर्भ
  choice: मुख्य पाठ में इसके संकेत को खुला रखा गया है।
  alternative: इसे स्पष्ट रूप से ‘सिय्योन में’ या ‘भाइयों की एकता में’ कहा जा सकता है।
  rationale: मूल में केवल שָׁם, ‘वहाँ’, है। संदर्भ को खोलकर बताना कविता की वास्तविक संक्षिप्तता और संभावित बहुअर्थकता को सीमित कर देता।
- issue: हर्मोन की ओस और सिय्योन के पहाड़ों का संबंध
  choice: मुख्य पाठ में संबंधवाचक उपवाक्य को ‘हर्मोन की ओस’ से जोड़ा गया है।
  alternative: पूरे वाक्यांश को ‘सिय्योन के पहाड़ों पर उतरनेवाली हर्मोन की ओस’ के रूप में पुनर्गठित किया जा सकता है।
  rationale: इब्रानी वाक्यरचना संक्षिप्त काव्यात्मक रूप में दोनों स्थानों को जोड़ती है। अनुवाद इस असामान्य चित्र को हटाता या भौगोलिक व्याख्या से हल नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘याहवे’ को ईश्वरीय नाम के लिप्यंतरण के रूप में रखा गया है; ‘वहीं’ तथा हर्मोन-सिय्योन की काव्यात्मक छवि को व्याख्यात्मक विस्तार से नहीं बाँधा गया।
