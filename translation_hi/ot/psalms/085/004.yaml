  text: Restore us[a], God of our salvation, and put away your anger from us.
translation:
  language: hi
  text: हे हमारे उद्धार के परमेश्वर, हमें फिर से बहाल कर[a], और अपना क्रोध हम पर से दूर कर।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “हमें वापस लौटा।” इब्रानी क्रिया का अधिक शाब्दिक अर्थ “हमें लौटने के लिए प्रेरित कर” या “हमें वापस ले आ” हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: שׁוּבֵנוּ
  choice: हमें फिर से बहाल कर
  rationale: हिफ़ील आज्ञार्थक रूप का मूल भाव ‘हमें लौटा’ या ‘हमें वापस फेर’ है। भजन के संदर्भ में ‘फिर से बहाल कर’ परमेश्वर की कृपा और समुदाय की पूर्व दशा की पुनर्स्थापना की प्रार्थना को स्वाभाविक हिन्दी में व्यक्त करता है, जबकि पादटिप्पणी अधिक शाब्दिक संभावना सुरक्षित रखती है।
- source_word: אֱלֹהֵי יִשְׁעֵנוּ
  choice: हे हमारे उद्धारकर्ता परमेश्वर
  rationale: इब्रानी रचना का शाब्दिक अर्थ ‘हमारे उद्धार का परमेश्वर’ है। हिन्दी में संबोधन के रूप में ‘हमारे उद्धारकर्ता परमेश्वर’ स्वाभाविक और स्पष्ट है तथा उद्धार के लिए परमेश्वर पर निर्भरता बनाए रखता है।
- source_word: וְהָפֵר
  choice: हटा ले
  rationale: פרר का हिफ़ील आज्ञार्थक यहाँ क्रोध को निष्प्रभावी करने, समाप्त करने या दूर करने का भाव देता है। ‘हटा ले’ सहज हिन्दी में इस प्रार्थना और आज्ञार्थक बल को व्यक्त करता है।
- source_word: כַּעַסְךָ
  choice: अपना क्रोध
  rationale: כעס का सामान्य और प्रसंगानुकूल अर्थ ‘क्रोध’ है; ‘रोष’ भी संभव है, पर ‘क्रोध’ आधुनिक हिन्दी में अधिक सीधा और व्यापक रूप से समझा जाता है।
- source_word: עִמָּנוּ
  choice: हम पर से
  rationale: עם का मूल अर्थ ‘साथ’ है, किंतु क्रोध हटाने की इस पदबंधीय रचना में हिन्दी का स्वाभाविक अर्थ है कि परमेश्वर अपना क्रोध लोगों ‘पर से’ हटा ले। इससे ‘हमारे विरुद्ध’ जैसी अधिक व्याख्यात्मक अभिव्यक्ति से बचा गया है।
theological_decisions:
- issue: आरंभिक विनती को नैतिक मन-फिराव के रूप में प्रस्तुत किया जाए या सामुदायिक पुनर्बहाली के रूप में
  choice: हमें फिर से बहाल कर
  alternative: हमें वापस फेर
  rationale: संदर्भ परमेश्वर के क्रोध के बाद उसकी कृपा और प्रजा की दशा की पुनर्बहाली की विनती करता है। मुख्य पाठ में ‘बहाल कर’ इस व्यापक अर्थ को व्यक्त करता है; पादटिप्पणी ‘वापस फेर’ द्वारा इब्रानी में निहित परमेश्वर की पहल और लौटने के वास्तविक भाव को सुरक्षित रखती है।
translation_notes:
  register: भाषा आधुनिक, प्रार्थनापूर्ण और गरिमापूर्ण रखी गई है। ‘हे’ से संबोधन स्पष्ट होता है; ‘बहाल कर’ सामान्य पाठक के लिए बोधगम्य रहते हुए पुनर्स्थापना का व्यापक भाव देता है।
