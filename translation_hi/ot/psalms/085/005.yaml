  text: הַ/לְ/עוֹלָ֥ם תֶּֽאֱנַף בָּ֑/נוּ תִּמְשֹׁ֥ךְ אַ֝פְּ/ךָ֗ לְ/דֹ֣ר וָ/דֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/085/005.yaml
  text: Will you be angry with us forever? Will you prolong your anger from generation to generation?[a][b]
translation:
  language: hi
  text: क्या तू सदा हमसे क्रोधित रहेगा?[a] क्या तू अपना क्रोध पीढ़ी-दर-पीढ़ी जारी रखेगा?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “हम पर क्रोधित रहेगा?”
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक, “अपने क्रोध को खींचेगा।”
    reason: lexical_alternative
lexical_decisions:
- source_word: הַלְעוֹלָם
  choice: सदा
  rationale: प्रश्नवाचक הַ और לְעוֹלָם मिलकर ‘क्या सदा?’ का भाव देते हैं; आधुनिक हिन्दी में ‘सदा’ संक्षिप्त, स्वाभाविक और गरिमापूर्ण है।
- source_word: תֶּאֱנַף
  choice: क्रोधित रहेगा
  rationale: אנף का अर्थ क्रोधित होना है। अपूर्ण क्रिया और कालावधि के प्रश्न को हिन्दी में ‘रहेगा’ स्वाभाविक रूप से व्यक्त करता है।
- source_word: בָּנוּ
  choice: हमसे
  rationale: אנף के साथ ב क्रोध के लक्ष्य को सूचित करता है। हिन्दी मुहावरे में ‘हमसे क्रोधित’ स्वाभाविक है; ‘हम पर क्रोधित’ भी सम्भव है।
- source_word: תִּמְשֹׁךְ
  choice: खींचता रहेगा
  rationale: משך का मूल चित्र ‘खींचना/लम्बा करना’ है। ‘खींचता रहेगा’ क्रोध की अवधि बढ़ाने का अर्थ और इब्रानी रूपक दोनों बनाए रखता है।
- source_word: אַפְּךָ
  choice: अपने क्रोध को
  rationale: אַף का शाब्दिक अर्थ ‘नाक’ है, पर यहाँ इसका स्थापित भावार्थ ‘क्रोध’ है; हिन्दी में ‘क्रोध’ स्पष्ट और प्रसंगानुकूल है।
- source_word: לְדֹר וָדֹר
  choice: पीढ़ी-दर-पीढ़ी
  rationale: यह क्रमिक पीढ़ियों में निरन्तरता बताने वाला इब्रानी मुहावरा है; ‘पीढ़ी-दर-पीढ़ी’ उसका स्वाभाविक हिन्दी समतुल्य है।
theological_decisions:
- issue: परमेश्वर के क्रोध के लिए मानव-सदृश भावभाषा
  choice: ‘क्रोधित’ और ‘क्रोध’ को स्पष्ट रूप से बनाए रखा गया।
  alternative: ‘अप्रसन्न’ अथवा ‘विरोधी’ कहकर भाषा को नरम करना।
  rationale: इब्रानी पाठ सीधे परमेश्वर के क्रोध और उसके लम्बे चलने की बात करता है। इसे बनाए रखने से विलाप का धार्मिक तनाव सुरक्षित रहता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; एकवचन निकट संबोधन ‘तू’ भजन की सीधी प्रार्थना को बनाए रखता है। भाषा सरल और गरिमापूर्ण है। ‘खींचता रहेगा’ मूल रूपक को बचाता है, जबकि पादटिप्पणी अधिक अर्थप्रधान विकल्प देती है।
