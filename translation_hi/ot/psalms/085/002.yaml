  yaml_path: translation/ot/psalms/085/002.yaml
  text: You forgave the iniquity of your people[a]; you covered all their sin[b]. Selah
translation:
  language: hi
  text: तूने अपनी प्रजा का अधर्म क्षमा किया[a]; तूने उनका सारा पाप ढाँप दिया[b]। सेला।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अधिक शाब्दिक रूप से, “तूने अपनी प्रजा का अधर्म उठा लिया” या “दूर ले गया।” हिब्रू मुहावरा दोष को उठा लेने अथवा दूर ले जाने के बिंब से क्षमा व्यक्त करता है।
    reason: lexical_alternative
  - marker: b
    text: या “उनके सभी पाप।” हिब्रू में संज्ञा एकवचन है और उसके साथ बहुवचन संबंधसूचक प्रत्यय है; इसलिए इसका अनुवाद सामूहिक रूप में “पाप” या अलग-अलग कर्मों के रूप में “पापों” किया जा सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: נָשָׂאתָ
  choice: क्षमा किया
  rationale: נשׂא का मूल अर्थ उठाना, ढोना या दूर ले जाना है; עָוֹן के साथ यह अधर्म अथवा दोष को उठा लेने, अर्थात क्षमा करने का मुहावरा है। मुख्य पाठ में स्वाभाविक हिन्दी अर्थ रखा गया है और मूल बिंब पादटिप्पणी में दिया गया है।
- source_word: עֲוֺן
  choice: अधर्म
  rationale: यहाँ עָוֹן नैतिक कुटिलता या दोष को दर्शाता है। ‘अधर्म’ इसकी गंभीरता बनाए रखता है और अगली पंक्ति के ‘पाप’ से शब्दगत भेद भी सुरक्षित करता है।
- source_word: עַמֶּךָ
  choice: अपनी प्रजा
  rationale: वाचा और सामूहिक संबंध के संदर्भ में עַם के लिए ‘प्रजा’ स्वाभाविक और गरिमापूर्ण है; ‘अपनी’ परमेश्वर से उसके लोगों का संबंध स्पष्ट करती है।
- source_word: כִּסִּיתָ
  choice: ढाँप दिया
  rationale: כסה का सीधा अर्थ ढाँपना है। यह अनदेखा करने मात्र के बजाय पाप-क्षमा के काव्यात्मक बिंब को सुरक्षित रखता है।
- source_word: כָל
  choice: सारे
  rationale: כָל का समष्टिगत अर्थ ‘सारा’ है और एकवचन सामूहिक ‘पाप’ के साथ ‘सारे’ स्वाभाविक हिन्दी प्रयोग है।
- source_word: חַטָּאתָם
  choice: उनके सारे पाप
  rationale: हिब्रू संज्ञा एकवचन है और प्रत्यय बहुवचन है; यहाँ ‘पाप’ को सामूहिक एकवचन मानकर मूल रूप और समानांतरता सुरक्षित रखी गई है।
- source_word: סֶלָה
  choice: सेला
  rationale: इस शब्द का सटीक अर्थ अनिश्चित है, इसलिए व्याख्यात्मक अनुवाद करने के बजाय लिप्यंतरण किया गया है।
theological_decisions:
- issue: נשׂא עון के क्षमा-संबंधी मुहावरे का अनुवाद
  choice: तूने अपनी प्रजा का अधर्म क्षमा किया
  alternative: तूने अपनी प्रजा का अधर्म उठा लिया / दूर ले गया
  rationale: ‘क्षमा किया’ मुहावरे का प्रसंगानुकूल अर्थ साफ़ और स्वाभाविक हिन्दी में देता है; पादटिप्पणी मूल के उठाने या दूर ले जाने के बिंब को बनाए रखती है, बिना किसी विशेष प्रायश्चित्त-सिद्धांत को आरोपित किए।
- issue: חַטָּאתָם को एकवचन या बहुवचन में प्रस्तुत करना
  choice: उनके सारे पाप
  alternative: उनके सभी पापों
  rationale: मूल में संज्ञा एकवचन और संबंधसूचक प्रत्यय बहुवचन है। सामूहिक एकवचन ‘पाप’ उस संरचना को सुरक्षित रखता है, जबकि बहुवचन भी अर्थ की दृष्टि से संभव है।
translation_notes:
  register: आधुनिक मानक हिन्दी में काव्यात्मक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट शैली। परमेश्वर को संबोधन में भजन की सीधी निकटता बनाए रखने के लिए ‘तूने’ रखा गया है। ‘सेला’ को अर्थ की अनिश्चितता के कारण बिना व्याख्या के लिप्यंतरित किया गया है।
