source:
  edition: WLC
  text: צֶ֭דֶק לְ/פָנָ֣י/ו יְהַלֵּ֑ךְ וְ/יָשֵׂ֖ם לְ/דֶ֣רֶךְ פְּעָמָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/085/013.yaml
  text: Righteousness will go before him and will make a path for his steps.
translation:
  language: hi
  text: धार्मिकता उसके आगे-आगे चलेगी और उसके कदमों के लिए मार्ग बनाएगी।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: צֶדֶק
  choice: धार्मिकता
  rationale: यहाँ शब्द नैतिक और संबंधपरक सहीपन को व्यक्त करता है; ‘धार्मिकता’ भजन-साहित्य के गरिमापूर्ण धार्मिक संदर्भ में स्वाभाविक है।
- source_word: לְפָנָיו יְהַלֵּךְ
  choice: उसके आगे-आगे चलेगी
  rationale: इब्रानी मुहावरे का अर्थ उसके सामने अथवा अग्रदूत के रूप में चलना है; ‘आगे-आगे’ इसे सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: וְיָשֵׂם לְדֶרֶךְ פְּעָמָיו
  choice: और उसके कदमों के लिए मार्ग बनाएगी
  rationale: वाक्यांश कठिन है, पर मसोराई पाठ के स्वाभाविक अर्थ के अनुसार धार्मिकता उसके कदमों के लिए मार्ग तैयार करती है। यह अंग्रेज़ी परामर्श-पाठ के अर्थ से भी मेल खाता है, जबकि इब्रानी की काव्यात्मक छवि बनी रहती है।
theological_decisions:
- issue: ‘उसके’ का संदर्भ
  choice: सर्वनाम को अस्पष्ट ही रखा गया
  alternative: ‘परमेश्वर के’ कहकर संदर्भ स्पष्ट करना
  rationale: मूल पद में केवल तृतीय पुरुष सर्वनाम है। निकटवर्ती संदर्भ इसे परमेश्वर से जोड़ता है, पर अनुवाद में नाम जोड़ना मूल की व्याकरणिक अस्पष्टता को अनावश्यक रूप से समाप्त कर देता।
- issue: धार्मिकता की कर्ता-भूमिका
  choice: धार्मिकता को मार्ग बनाने वाली कर्ता के रूप में रखा गया
  alternative: ‘वह उसके कदमों को मार्ग पर रखेगी’
  rationale: צֶדֶק वाक्य का स्पष्ट कर्ता है और יָשֵׂם का स्त्रीलिंग रूप उसी से मेल खाता है; इस मानवीकरण को बनाए रखना काव्य और धर्मवैचारिक तनाव दोनों के प्रति निष्ठावान है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, काव्यात्मक और गरिमापूर्ण शैली। ‘आगे-आगे’ अग्रगामी छवि स्पष्ट करता है और ‘मार्ग बनाएगी’ सामान्य पाठक के लिए स्वाभाविक है।
