base_translation:
  language: en
  yaml_path: translation/ot/psalms/085/010.yaml
  text: Steadfast love and truth have met[b][a]; righteousness and peace have kissed.
translation:
  language: hi
  text: 'अटल प्रेम और सच्चाई[a] आपस में मिले हैं;

    न्याय[b] और शांति ने एक-दूसरे को चूमा है।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘निष्ठा’ (אֱמֶת)।
    reason: lexical_alternative
  - marker: b
    text: या ‘धार्मिकता’ (צֶדֶק)।
    reason: lexical_alternative
lexical_decisions:
- source_word: חֶסֶד
  choice: अटल प्रेम
  rationale: यह इब्रानी शब्द टिकाऊ, निष्ठावान और संबंधपरक प्रेम को व्यक्त करता है। ‘अटल प्रेम’ आधुनिक हिन्दी में स्वाभाविक है और केवल दया की अपेक्षा इसकी स्थिरता को अधिक स्पष्ट रखता है।
- source_word: אֱמֶת
  choice: सच्चाई
  rationale: इसका अर्थ सच्चाई, विश्वसनीयता या निष्ठा हो सकता है। ‘सच्चाई’ पद की काव्यात्मक समानान्तरता में सहज है; ‘निष्ठा’ को वास्तविक वैकल्पिक अर्थ के रूप में पादटिप्पणी में रखा गया है।
- source_word: נִפְגָּשׁוּ
  choice: आपस में मिले हैं
  rationale: निफ़अल पूर्ण बहुवचन मिलने या आमने-सामने आने का भाव देता है। ‘आपस में मिले हैं’ दोनों मानवीकृत गुणों के पारस्परिक मिलन को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: צֶדֶק
  choice: धार्मिकता
  rationale: यह शब्द धार्मिकता, न्याय या सही व्यवस्था को सूचित कर सकता है। मानवीकृत नैतिक गुण के रूप में ‘धार्मिकता’ उपयुक्त है, जबकि ‘न्याय’ को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: שָׁלוֹם
  choice: शान्ति
  rationale: इस शब्द में शान्ति, कुशलता और सम्पूर्णता का व्यापक भाव है। यहाँ ‘शान्ति’ सर्वाधिक सहज और पहचाना जाने वाला हिन्दी रूप है।
- source_word: נָשָׁקוּ
  choice: एक-दूसरे को चूमा है
  rationale: मूल क्रिया का सीधा अर्थ ‘चूमना’ है। ‘एक-दूसरे को’ हिन्दी में पारस्परिक काव्यात्मक चित्र को स्पष्ट और स्वाभाविक बनाता है, बिना उसे व्याख्यात्मक रूप से कमजोर किए।
theological_decisions:
- issue: वाचा-संबंधी और नैतिक गुणों का मानवीकरण
  choice: ‘मिले हैं’ और ‘एक-दूसरे को चूमा है’ के रूप में काव्यात्मक मानवीकरण को अक्षुण्ण रखना
  alternative: ‘मेल में आ गए हैं’ या ‘एक हो गए हैं’ जैसी व्याख्यात्मक पुनरुक्ति
  rationale: इब्रानी पाठ इन गुणों को मानवीकृत कर्ताओं के रूप में प्रस्तुत करता है। मूल चित्र को बनाए रखने से पुनर्स्थापना का काव्यात्मक और धर्मवैचारिक तनाव सुरक्षित रहता है तथा पाठ में कोई अतिरिक्त सैद्धान्तिक निष्कर्ष नहीं जोड़ा जाता।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण काव्यात्मक रजिस्टर अपनाया गया है। समानान्तर संरचना और मानवीकरण को बनाए रखा गया है; ‘शान्ति’ में मानक वर्तनी का प्रयोग किया गया है।
