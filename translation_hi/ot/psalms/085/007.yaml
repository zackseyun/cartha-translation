lexical_decisions:
- source_word: הַרְאֵנוּ
  choice: हमें…दिखा
  rationale: ראה के हिफ़ील आज्ञार्थक रूप और प्रथम पुरुष बहुवचन प्रत्यय का मूल भाव ‘हमें दिखा’ या ‘हमें देखने दे’ है। प्रार्थना में ‘हमें…दिखा’ स्वाभाविक रहते हुए क्रिया की प्रेरणार्थक शक्ति को सुरक्षित रखता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिन्दी में परमेश्वर के व्यक्तिगत नाम יהוה का प्रचलित और सहज पहचाना जाने वाला लिप्यंतरण ‘यहोवा’ है; इसे किसी उपाधि से नहीं बदला गया है।
- source_word: חַסְדֶּךָ
  choice: अपना अटल प्रेम
  rationale: חסד निष्ठावान, स्थायी प्रेम और कृपा का भाव रखता है। ‘अटल प्रेम’ इसकी दृढ़ता और संबंधपरक आत्मीयता दोनों को संक्षेप में व्यक्त करता है।
- source_word: וְיֶשְׁעֲךָ
  choice: और…अपना उद्धार
  rationale: ישע यहाँ परमेश्वर द्वारा दी जाने वाली मुक्ति या छुटकारे को दर्शाता है। ‘उद्धार’ भजन के प्रार्थनापूर्ण संदर्भ में व्यापक अर्थ बनाए रखता है।
- source_word: תִּתֶּן לָנוּ
  choice: हमें…दे
  rationale: נתן और לָנוּ का सीधा अर्थ ‘हमें दे’ है। यही रूप आधुनिक हिन्दी में सरल, स्वाभाविक और विनती के अनुरूप है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ में उपाधि नहीं, चार अक्षरों वाला व्यक्तिगत नाम है। हिन्दी पाठकों में व्यापक रूप से पहचाने जाने वाले ‘यहोवा’ को अपनाकर नाम को नाम के रूप में सुरक्षित रखा गया है; ‘याहवे’ निकटतर शैक्षिक लिप्यंतरण है।
translation_notes:
  register: भाषा आधुनिक, सरल और गरिमापूर्ण प्रार्थना-शैली में है। एकवचन संबोधन के अनुरूप ‘दिखा’ और ‘दे’ रखे गए हैं; ‘हे’ सम्बोधन को स्वाभाविक काव्यात्मक गरिमा देता है।
