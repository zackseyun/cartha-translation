source:
  edition: WLC
  text: אָסַ֥פְתָּ כָל עֶבְרָתֶ֑/ךָ הֱ֝שִׁיב֗וֹתָ מֵ/חֲר֥וֹן אַפֶּֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/085/003.yaml
  text: You withdrew all your wrath[a]; you turned back from the burning of your anger.
translation:
  language: hi
  text: तूने अपना सारा प्रकोप हटा लिया; तू अपने धधकते क्रोध से फिर गया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אָסַפְתָּ
  choice: हटा लिया
  rationale: אָסַף का मूल अर्थ इकट्ठा करना है, पर प्रकोप के साथ यहाँ इसका प्रसंगगत अर्थ उसे समेट लेना या हटा लेना है। ‘हटा लिया’ आधुनिक हिन्दी में स्वाभाविक है और क्रोध के वापस ले लिए जाने का भाव स्पष्ट करता है।
- source_word: כָל
  choice: सारा
  rationale: यह संपूर्णता पर बल देने वाला सामान्य परिमाणवाचक शब्द है; ‘सारा’ प्रकोप के पूरी तरह हटा लिए जाने को व्यक्त करता है।
- source_word: עֶבְרָתֶךָ
  choice: अपना ... प्रकोप
  rationale: עֶבְרָה तीव्र, उमड़ते हुए क्रोध या रोष को दर्शाता है। ‘प्रकोप’ भजन की गरिमामय शैली में स्वाभाविक है और अगले पदबंध के ‘क्रोध’ से आवश्यक शब्दगत भेद भी बनाए रखता है।
- source_word: הֱשִׁיבוֹתָ
  choice: फिर गया
  rationale: שׁוב के हिफ़ील रूप और מִן के साथ बना पदबंध किसी बात से पीछे फिरने या मुड़ जाने का अर्थ देता है। हिन्दी में ‘से फिर गया’ इस गति-बिंब को बचाता है और इसे केवल भावनात्मक पश्चात्ताप के रूप में नहीं समझाता।
- source_word: מֵחֲרוֹן
  choice: धधकते
  rationale: חָרוֹן क्रोध की जलती गर्मी या उग्रता का बिंब देता है। ‘धधकते’ उस ताप-संबंधी रूपक को स्वाभाविक और सजीव हिन्दी में बनाए रखता है।
- source_word: אַפֶּךָ
  choice: अपने ... क्रोध
  rationale: אַף का शाब्दिक अर्थ ‘नाक’ है और विस्तारित अर्थ ‘क्रोध’। इस मुहावरे में ‘क्रोध’ ही स्वाभाविक अर्थ है; उसका उष्णता-बिंब ‘धधकते’ में संरक्षित है।
theological_decisions:
- issue: परमेश्वर के क्रोध के लिए प्रयुक्त मानवरूपी और उष्णता-संबंधी भाषा
  choice: ‘धधकते क्रोध’ के रूप में मूल रूपक को बनाए रखना
  alternative: ‘भयंकर क्रोध’ या ‘उग्र क्रोध’
  rationale: इब्रानी पाठ क्रोध को जलती गर्मी के रूप में चित्रित करता है। ‘धधकते क्रोध’ उस सजीव बिंब को सुरक्षित रखता है, बिना उसे अमूर्त बनाने या परमेश्वर के न्याय की तीव्रता को नरम करने के।
- issue: הֱשִׁיבוֹתָ מֵ के कर्तृवाच्य भाव की व्याख्या
  choice: ‘तू ... से फिर गया’
  alternative: ‘तूने ... को लौटा दिया’
  rationale: व्याकरणिक रूप को कारणवाचक ढंग से समझना संभव है, पर इस संदर्भ में מן के साथ यह परमेश्वर के अपने प्रज्वलित क्रोध से पीछे फिरने को स्वाभाविक रूप से व्यक्त करता है। चुना हुआ पाठ इस संभावित गति-बिंब को बचाता है और अनावश्यक धर्मवैचारिक व्याख्या नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी, एकवचन आत्मीय ‘तू’ के साथ, जो भजनों में परमेश्वर को सीधे संबोधित करने की काव्यात्मक निकटता को दर्शाता है। भाषा गरिमामय किंतु सामान्य पाठक के लिए स्पष्ट है; समानांतरता ‘प्रकोप’ और ‘धधकते क्रोध’ से बनी रहती है।
