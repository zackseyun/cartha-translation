  text: אֱ֭מֶת מֵ/אֶ֣רֶץ תִּצְמָ֑ח וְ֝/צֶ֗דֶק מִ/שָּׁמַ֥יִם נִשְׁקָֽף׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/085/011.yaml
  text: Truth will spring up from the earth[b][a], and righteousness will look down from heaven.
translation:
  language: hi
  text: सच्चाई धरती से अंकुरित होगी,[a] और धार्मिकता स्वर्ग से नीचे निहारेगी।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘विश्वासयोग्यता धरती से अंकुरित होगी।’
    reason: lexical_alternative
  - marker: b
    text: या ‘न्याय स्वर्ग से नीचे निहारेगा।’
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱמֶת
  choice: सच्चाई
  rationale: यह शब्द सत्य, सच्चाई या विश्वासयोग्यता का भाव दे सकता है। यहाँ צֶדֶק के साथ अमूर्त सद्गुण के रूप में ‘सच्चाई’ स्वाभाविक है; ‘विश्वासयोग्यता’ को पादटिप्पणी में रखा गया है।
- source_word: מֵאֶרֶץ
  choice: धरती से
  rationale: स्वर्ग और धरती के ऊर्ध्वाधर काव्यात्मक समानांतर के कारण स्थानीय ‘देश’ या ‘भूमि’ की अपेक्षा ‘धरती’ उपयुक्त है।
- source_word: תִּצְמָח
  choice: अंकुरित होगी
  rationale: क्रिया वनस्पति के फूटने या उगने का चित्र प्रस्तुत करती है; ‘अंकुरित होगी’ उस रूपक को स्पष्ट और संक्षिप्त रखता है।
- source_word: צֶדֶק
  choice: धार्मिकता
  rationale: यह शब्द धार्मिकता या न्याय, दोनों का अर्थ दे सकता है। यहाँ सच्चाई के समानांतर एक नैतिक गुण के रूप में ‘धार्मिकता’ मुख्य पाठ में है, जबकि ‘न्याय’ पादटिप्पणी में सुरक्षित है।
- source_word: מִשָּׁמַיִם
  choice: स्वर्ग से
  rationale: ‘स्वर्ग से’ धरती के साथ काव्यात्मक विरोध को बनाए रखता है और ‘आकाश’ की तुलना में मूल की धार्मिक-काव्यात्मक गूँज बेहतर व्यक्त करता है।
- source_word: נִשְׁקָף
  choice: नीचे निहारेगी
  rationale: निफ़ाल रूप ऊपर से बाहर या नीचे देखने का भाव देता है। ‘नीचे निहारेगी’ दिशा और धार्मिकता के मानवीकरण, दोनों को सुरक्षित रखता है।
theological_decisions:
- issue: צֶדֶק का नैतिक-काव्यात्मक अर्थ
  choice: धार्मिकता
  alternative: न्याय
  rationale: इब्रानी शब्द दोनों अर्थों को समेट सकता है। सच्चाई के साथ अमूर्त सद्गुण के रूप में ‘धार्मिकता’ मुख्य पाठ में उपयुक्त है, पर अर्थगत तनाव को बिना मिटाए ‘न्याय’ को पादटिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण काव्यात्मक शैली। ‘अंकुरित होगी’ कृषि-रूपक और ‘नीचे निहारेगी’ मानवीकरण को बनाए रखते हैं। हर पादटिप्पणी-चिह्न संबंधित पदांश के तुरंत बाद रखा गया है।
