  language: hi
  text: क्या तू नहीं लौटेगा[a] और हमें फिर से जीवित नहीं करेगा[b], ताकि तेरे लोग तुझमें आनन्दित हों?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘वापस मुड़ेगा’ या ‘फिर मुड़ेगा।’ इब्रानी क्रिया का अर्थ ‘लौटना’ या ‘वापस मुड़ना’ हो सकता है; यहाँ सम्भवतः परमेश्वर का अपनी प्रजा की ओर फिर अनुग्रह के साथ मुड़ना अभिप्रेत है।
    reason: lexical_alternative
  - marker: b
    text: या ‘हमें फिर जीवन देगा’ अथवा ‘हमें जीवित करेगा।’
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלֹא
  choice: क्या ... नहीं
  rationale: यह रचना सकारात्मक उत्तर की आशा रखने वाला आलंकारिक प्रश्न है। ‘क्या ... नहीं’ प्रश्न और आशापूर्ण विनती—दोनों को बनाए रखता है।
- source_word: תָּשׁוּב
  choice: लौटकर
  rationale: שוב का मूल अर्थ ‘लौटना’ या ‘फिर मुड़ना’ है। ‘लौटकर’ रूपक को बनाए रखता है और यह स्पष्ट जोड़ने से बचता है कि परमेश्वर किस अर्थ में या किसकी ओर लौटता है।
- source_word: תְּחַיֵּנוּ
  choice: हमें फिर से जीवन ... देगा
  rationale: חיה का पिएल रूप यहाँ जीवन देने या जीवन बहाल करने का भाव रखता है। यह अभिव्यक्ति शारीरिक, आत्मिक या सामुदायिक पुनर्स्थापना में से किसी एक तक अर्थ को सीमित नहीं करती।
- source_word: וְעַמְּךָ
  choice: ताकि तेरे लोग
  rationale: वाव अगले कथन को विनती के अभिप्रेत परिणाम से जोड़ता है। स्वाभाविक हिन्दी में ‘ताकि’ यह सम्बन्ध स्पष्ट करता है, जबकि ‘तेरे लोग’ मूल की वाचा-संबंधी भाषा को सुरक्षित रखता है।
- source_word: יִשְׂמְחוּ
  choice: आनन्दित हों
  rationale: इस सन्दर्भ में अपूर्ण क्रिया विनती के अभिप्रेत परिणाम को व्यक्त करती है। ‘आनन्दित हों’ प्रार्थनापूर्ण और परिणामसूचक भाव बनाए रखता है।
- source_word: בָךְ
  choice: तुझमें
  rationale: आनन्द से जुड़ा ב परमेश्वर को आनन्द के केन्द्र या क्षेत्र के रूप में प्रस्तुत करता है। ‘तुझमें’ इस भाव को संक्षेप में बनाए रखता है।
theological_decisions:
- issue: परमेश्वर के ‘लौटने’ को स्पष्ट रूप से ‘हमारी ओर अनुग्रह में लौटना’ कहना या न कहना
  choice: मुख्य पाठ में केवल ‘लौटकर’ रखा गया
  alternative: हमारी ओर फिर मुड़कर; फिर से अनुग्रह करके
  rationale: सन्दर्भ में परमेश्वर का अपनी प्रजा की ओर फिर अनुग्रहपूर्वक होना सम्भावित है, पर इब्रानी पाठ ‘हमारी ओर’ या ‘अनुग्रह में’ स्पष्ट रूप से नहीं कहता। व्यापक रूपक को बनाए रखना अतिरिक्त व्याख्या थोपने से बचाता है।
- issue: ‘जीवन देना’ आत्मिक जागृति है या व्यापक पुनर्स्थापना
  choice: ‘हमें फिर से जीवन ... देगा’ द्वारा अर्थ को व्यापक रखा गया
  alternative: हमें आत्मिक रूप से नया करेगा; हमारे राष्ट्रीय जीवन को बहाल करेगा
  rationale: भजन का प्रसंग न्याय के बाद सामुदायिक पुनर्स्थापना से जुड़ा है, पर मूल अभिव्यक्ति केवल आत्मिक या केवल राष्ट्रीय अर्थ निर्धारित नहीं करती।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी अपनाई गई है। परमेश्वर के लिए एकवचन आत्मीय सम्बोधन ‘तू/तेरे/तुझमें’ रखा गया है, जो भजन की सीधी प्रार्थना के अनुरूप है। ‘लौटकर’ और ‘फिर से जीवन’ मूल के पुनर्स्थापना-भाव को व्यक्त करते हैं, पर उसके स्वरूप को अनावश्यक रूप से सीमित नहीं करते।
