  yaml_path: translation/ot/psalms/085/001.yaml
  text: You have shown favor to your land[a], O Yahweh; you restored the fortunes of Jacob.
translation:
  language: hi
  text: हे यहोवा, तूने अपनी भूमि पर अनुग्रह किया है; तूने याकूब की दशा बहाल कर दी है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तू याकूब को बंधुआई से लौटा लाया” अथवा “तू याकूब के बंदियों को वापस लाया।” इब्रानी मुहावरा निर्वासन से वापसी या अधिक व्यापक रूप से दशा के पलटने—दोनों को व्यक्त कर सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: רָצִיתָ
  choice: कृपा की है
  rationale: Qal रूप यहाँ प्रसन्न होने अथवा अनुग्रह दिखाने का भाव देता है। ‘कृपा की है’ आधुनिक हिन्दी में स्वाभाविक है और देश के प्रति परमेश्वर के अनुकूल व्यवहार को स्पष्ट करता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: चतुरक्षरीय दिव्य नाम को किसी उपाधि से बदलने के बजाय हिन्दी में प्रचलित नामरूप ‘यहोवा’ रखा गया है।
- source_word: אַרְצֶךָ
  choice: अपने देश
  rationale: אֶרֶץ यहाँ परमेश्वर से विशेष संबंध रखने वाली भूमि, सम्भवतः इस्राएल की भूमि, को दर्शाता है। ‘देश’ सहज हिन्दी है; अधिकारसूचक ‘अपने’ मूल के ‘तेरी/अपनी भूमि’ के भाव को बनाए रखता है।
- source_word: שַׁבְתָּ
  choice: फिर से सँवार दी है
  rationale: שוב और שבות का संयुक्त प्रयोग पुनर्स्थापना या विपरीत दशा को पलटने का मुहावरा है। यह चयन केवल भौतिक वापसी तक अर्थ को सीमित किए बिना बहाली का भाव देता है।
- source_word: שבות
  choice: दशा
  rationale: मुहावरे में यह शब्द व्यापक रूप से परिस्थितियों या भाग्य के पलटने को व्यक्त कर सकता है, यद्यपि बन्धुआई अथवा बन्दियों की वापसी का अर्थ भी सम्भव है। ‘दशा’ साधारण आधुनिक हिन्दी में व्यापक अर्थ बचाती है।
- source_word: יַעֲקֹב
  choice: याकूब
  rationale: मूल पाठ का नाम ज्यों का त्यों रखा गया है; काव्यात्मक रूप से यह इस्राएल की प्रजा को सामूहिक रूप में सूचित करता है।
theological_decisions:
- issue: שׁוּב שְׁבוּת יַעֲקֹב मुहावरे का अर्थ
  choice: याकूब की दशा फिर से सँवार दी
  alternative: याकूब को बन्धुआई से लौटा लाया / याकूब के बन्दियों को वापस लाया
  rationale: यह इब्रानी मुहावरा सामान्य परिस्थितियों की बहाली और निर्वासन अथवा बन्धुआई से वापसी—दोनों का संकेत दे सकता है। मुख्य पाठ व्यापक अर्थ रखता है और संकीर्णतर ऐतिहासिक सम्भावना पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और साधारण पाठकों के लिए सुबोध रखी गई है। सम्बोधन में ‘हे यहोवा’ और एकवचन ‘तूने’ भजन की सीधी प्रार्थनात्मक शैली को बनाए रखते हैं।
