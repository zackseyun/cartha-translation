  text: אַ֤ךְ קָר֣וֹב לִ/ירֵאָ֣י/ו יִשְׁע֑/וֹ לִ/שְׁכֹּ֖ן כָּב֣וֹד בְּ/אַרְצֵֽ/נוּ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/085/009.yaml
  text: Surely his salvation is near to those who fear him[b][a], so that glory may dwell in our land.
translation:
  language: hi
  text: निश्चय ही उसका उद्धार[a] उन लोगों के निकट है जो उसका भय मानते हैं, ताकि हमारी भूमि में महिमा[b] निवास करे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘उसका छुटकारा’।
    reason: lexical_alternative
  - marker: b
    text: ‘महिमा’ परमेश्वर की प्रकट उपस्थिति या भूमि को फिर से मिले सम्मान की ओर संकेत कर सकती है।
    reason: alternative_reading
lexical_decisions:
- source_word: אַךְ
  choice: निश्चय ही
  rationale: यहाँ यह शब्द सीमा बताने के बजाय बात पर दृढ़ बल देता है; ‘निश्चय ही’ इस भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: קָרוֹב
  choice: निकट है
  rationale: यह विशेषण निकटता व्यक्त करता है; ‘निकट है’ सीधा और काव्यात्मक अनुवाद है।
- source_word: לִירֵאָיו
  choice: जो उसका भय मानते हैं
  rationale: यह वाक्यांश परमेश्वर के प्रति भय और श्रद्धा से पहचाने जानेवाले लोगों को दर्शाता है; ‘भय मानते हैं’ मूल के धार्मिक और वाचागत भाव को बनाए रखता है।
- source_word: יִשְׁעוֹ
  choice: उसका उद्धार
  rationale: यह संज्ञा उद्धार या छुटकारे को दर्शाती है। ‘उसका उद्धार’ मूल के संबंधसूचक प्रत्यय और धर्मवैचारिक गूँज दोनों को सुरक्षित रखता है।
- source_word: לִשְׁכֹּן
  choice: ताकि ... निवास करे
  rationale: लामेद के साथ यह क्रिया-रूप यहाँ उद्देश्य या परिणाम व्यक्त कर सकता है; ‘ताकि’ इस संबंध को स्पष्ट रखते हुए दोनों निकट अर्थों के लिए स्थान देता है।
- source_word: כָּבוֹד
  choice: महिमा
  rationale: ‘महिमा’ मूल शब्द के गौरव, वैभव और परमेश्वर की प्रकट उपस्थिति से जुड़े संभावित अर्थों को बिना संकुचित किए बनाए रखती है।
- source_word: בְּאַרְצֵנוּ
  choice: हमारे देश में
  rationale: संदर्भ में אֶרֶץ लोगों की अपनी भूमि को सूचित करता है; ‘हमारे देश में’ आधुनिक हिन्दी में स्वाभाविक है।
theological_decisions:
- issue: כָּבוֹד (‘महिमा’) का अभिप्रेत संदर्भ
  choice: मुख्य पाठ में केवल ‘महिमा’ रखा गया है।
  alternative: इसे विशेष रूप से ‘परमेश्वर की प्रकट उपस्थिति’ या ‘देश का लौटा हुआ सम्मान’ समझा जा सकता है।
  rationale: इब्रानी पाठ जानबूझकर व्यापक और संकेतपूर्ण है; किसी एक अर्थ को निश्चित करने से मूल की धर्मवैचारिक और काव्यात्मक खुलावट मिट जाती।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और काव्यात्मक रखी गई है। ‘भय मानते हैं’ को केवल सम्मान तक नरम नहीं किया गया, और ‘महिमा’ की संदर्भगत अस्पष्टता सुरक्षित रखी गई है।
