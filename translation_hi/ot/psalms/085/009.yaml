    issue: ‘देश’ may suggest a modern political nation-state.
    rationale: בְּאַרְצֵנוּ denotes ‘in our land.’ ‘भूमि’ more directly represents the territorial/covenantal sense in the psalm's context while avoiding unnecessary political connotations.
