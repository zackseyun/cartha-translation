  text: אֶשְׁמְעָ֗ה מַה יְדַבֵּר֮ הָ/אֵ֪ל יְה֫וָ֥ה כִּ֤י יְדַבֵּ֬ר שָׁל֗וֹם אֶל עַמּ֥/וֹ וְ/אֶל חֲסִידָ֑י/ו וְֽ/אַל יָשׁ֥וּבוּ לְ/כִסְלָֽה־׀׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/085/008.yaml
  text: I will hear what God Yahweh will speak[a], for he will speak peace to his people and to his faithful ones[b]; but let them not turn back to folly.
translation:
  language: hi
  text: मैं सुनूँगा कि परमेश्वर याहवे क्या कहेगा, क्योंकि वह अपनी प्रजा और अपने निष्ठावान जनों[a] से शांति की बात कहेगा; पर वे फिर मूर्खता[b] की ओर न लौटें।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अपने पवित्र जनों” या “अपने भक्तों।”
    reason: lexical_alternative
  - marker: b
    text: 'या, “और वे फिर मूर्खता की ओर न लौटें”; कम संभावित अर्थ: “भरोसे की ओर।”'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶשְׁמְעָה
  choice: मैं सुनूँगा
  rationale: काल रूप संकल्प या इच्छा व्यक्त करता है; यह अनुवाद वक्ता के ध्यानपूर्वक सुनने के निश्चय को संक्षेप और स्वाभाविक हिन्दी में रखता है।
- source_word: הָאֵל יְהוָה
  choice: परमेश्वर यहवे
  rationale: मूल में אֵל और दिव्य नाम יְהוָה दोनों हैं; हिन्दी में यह क्रम दोनों को स्पष्ट रखते हुए स्वाभाविक है।
- source_word: יְדַבֵּר שָׁלוֹם
  choice: शान्ति की बात कहेगा
  rationale: शाब्दिक क्रिया और שָׁלוֹם के व्यापक अर्थ—शान्ति, कुशल और बहाली—को बिना विस्तार जोड़े सुरक्षित रखता है।
- source_word: חֲסִידָיו
  choice: अपने विश्वासयोग्य जनों
  rationale: यह शब्द वाचा-संबंधी निष्ठा और भक्ति का बोध देता है; 'विश्वासयोग्य जन' आधुनिक पाठक के लिए स्पष्ट है और किसी बाद की तकनीकी धार्मिक उपाधि को नहीं थोपता।
- source_word: וְאַל יָשׁוּבוּ
  choice: पर वे फिर ... न लौटें
  rationale: אַל के साथ अपूर्ण क्रिया निषेध या चेतावनी व्यक्त करती है; 'न लौटें' उसी विधिलिंगात्मक बल को बनाए रखता है।
- source_word: לְכִסְלָה
  choice: मूर्खता की ओर
  rationale: כִּסְלָה का सामान्य और प्रसंगानुकूल अर्थ मूर्खता है; यहाँ इसका आशय परमेश्वर की शान्ति के बाद पुराने अविवेकी आचरण में लौटने से है।
theological_decisions:
- issue: दिव्य नाम יְהוָה का अनुवाद
  choice: यहवे
  alternative: यहोवा
  rationale: मूल पाठ में परमेश्वर का निजी वाचा-नाम है; 'यहवे' उसे किसी उपाधि से बदलने के बजाय नाम के रूप में सुरक्षित रखता है।
- issue: חֲסִידָיו का आशय
  choice: अपने विश्वासयोग्य जनों
  alternative: अपने भक्तों / अपने पवित्र जनों
  rationale: चुना गया रूप निष्ठा और भक्तिपूर्ण संबंध दोनों की ओर संकेत करता है, पर बाद की किसी विशिष्ट धार्मिक श्रेणी को आयत में नहीं जोड़ता।
- issue: अन्तिम उपवाक्य का बल
  choice: 'चेतावनी: वे फिर मूर्खता की ओर न लौटें'
  alternative: 'वर्णन या प्रतिज्ञा: वे मूर्खता की ओर नहीं लौटेंगे'
  rationale: אַל के साथ क्रिया निषेधात्मक/आदेशात्मक अर्थ का दृढ़ समर्थन करती है। इससे परमेश्वर के शान्ति-वचन और लोगों पर रखी गई नैतिक चेतावनी, दोनों बने रहते हैं।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सहज शैली। 'शान्ति' व्यापक बाइबलीय अर्थ को बनाए रखता है और 'विश्वासयोग्य जन' साम्प्रदायिक तकनीकी भाषा से बचता है।
