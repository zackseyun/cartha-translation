  text: שִׁ֥יר הַֽ/מַּעֲל֗וֹת לְ/דָ֫וִ֥ד שָׂ֭מַחְתִּי בְּ/אֹמְרִ֣ים לִ֑/י בֵּ֖ית יְהוָ֣ה נֵלֵֽךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/122/001.yaml
  text: A Song of Ascents[a]. Of David. I rejoiced when they said to me[c][b], “Let us go to the house of Yahweh.”
translation:
  language: hi
  text: चढ़ाइयों का गीत।[a] दाऊद का। जब लोगों ने मुझसे कहा, “आओ, हम याहवे के भवन जाएँ,” तो मैं आनन्दित हुआ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इब्रानी शीर्षक: “चढ़ाइयों का गीत।” इसका अर्थ “ऊपर जाने का गीत” भी हो सकता है; सम्भवतः यह तीर्थयात्रा या उपासना में प्रयुक्त गीतों के संग्रह का संकेत है।'
    reason: cultural_note
lexical_decisions:
- source_word: שִׁיר הַמַּעֲלוֹת
  choice: चढ़ाई का गीत
  rationale: यह स्थिर शीर्षक का सीधा और स्वाभाविक हिन्दी रूप है। ‘चढ़ाई’ तीर्थयात्रा, ऊपर जाने अथवा इस भजन-संग्रह से जुड़े अर्थ की गुंजाइश बनाए रखता है।
- source_word: לְדָוִד
  choice: दाऊद का
  rationale: शीर्षक में לְ सम्बन्ध, रचना, समर्पण या संबद्धता बता सकता है; ‘दाऊद का’ किसी एक अर्थ को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: שָׂמַחְתִּי
  choice: मैं आनन्दित हुआ
  rationale: यह पूर्ण क्रिया वक्ता के आनन्द को व्यक्त करती है; चुना हुआ रूप आधुनिक, स्पष्ट और गरिमापूर्ण है।
- source_word: בְּאֹמְרִים לִי
  choice: जब लोगों ने मुझसे कहा
  rationale: בְּ के साथ यह रचना प्रसंगतः समयसूचक है। अनिर्दिष्ट बहुवचन कर्ता को स्वाभाविक हिन्दी में ‘लोगों’ से व्यक्त किया गया है।
- source_word: בֵּית יְהוָה
  choice: यहोवा के भवन
  rationale: यह इब्रानी संबंधसूचक रचना का सीधा रूप है; ‘भवन’ उपासना-स्थान के गरिमापूर्ण अर्थ को व्यक्त करता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: मूल पाठ में आए परमेश्वर के विशिष्ट नाम को हिन्दी में प्रचलित नामरूप ‘यहोवा’ से प्रत्यक्ष रूप में रखा गया है।
- source_word: נֵלֵךְ
  choice: आओ, हम ... चलें
  rationale: प्रथम पुरुष बहुवचन अपूर्ण क्रिया यहाँ आमंत्रण या सामूहिक आग्रह का भाव रखती है; यह हिन्दी रूप उस भाव को स्वाभाविक रूप से व्यक्त करता है।
theological_decisions:
- issue: परमेश्वर के नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे / प्रभु
  rationale: मूल में विशिष्ट दिव्य नाम है। ‘यहोवा’ साधारण हिन्दी बाइबिल-पाठकों में परिचित नामरूप है और इसे सामान्य उपाधि ‘प्रभु’ में बदलने के बजाय नाम के रूप में सुरक्षित रखता है।
- issue: לְדָוִד में दाऊद से संबंध
  choice: दाऊद का
  alternative: दाऊद द्वारा / दाऊद के लिए
  rationale: इब्रानी उपसर्ग लेखकीयता, समर्पण या संबद्धता में से किसी को सूचित कर सकता है। ‘दाऊद का’ इस वास्तविक अस्पष्टता को खुला रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और सार्वजनिक पाठ के योग्य शैली अपनाई गई है। शीर्षक की अस्पष्टता बनाए रखी गई है; प्रत्यक्ष कथन में ‘आओ’ जोड़कर נֵלֵךְ के आमंत्रणात्मक भाव को स्वाभाविक हिन्दी में व्यक्त किया गया है।
