  rationale: यह साधारण आसनों के बजाय राजकीय और न्यायिक अधिकार से जुड़े आसनों को सूचित करता है।
- source_word: לְמִשְׁפָּט
  choice: न्याय करने के लिए
  rationale: לְ उद्देश्य या कार्य बताता है और מִשְׁפָּט यहाँ न्यायिक निर्णय अथवा न्याय को सूचित करता है; यह पदबंध सिंहासनों के न्यायिक प्रयोजन को सहज हिन्दी में व्यक्त करता है।
- source_word: כִסְאוֹת לְבֵית דָּוִיד
  choice: दाऊद के घराने के सिंहासन
