theological_decisions:
- issue: दाऊद के घराने के उल्लेख का स्वरूप
  choice: यरूशलेम में दाऊद के राजवंश से जुड़े राजकीय और न्यायिक सिंहासन
  alternative: सामान्य नगर-न्यायालयों का उल्लेख, या अनुवाद में प्रत्यक्ष रूप से उभारा गया मसीही संकेत
  rationale: इब्रानी पाठ स्पष्ट रूप से ‘सिंहासनों’ और ‘दाऊद के घराने’ को जोड़ता है। अनुवाद ऐतिहासिक राजवंशीय और न्यायिक अर्थ को बनाए रखता है, पर व्यापक धर्मवैज्ञानिक या मसीही अर्थ को मुख्य पाठ में आरोपित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। पुनरुक्ति मूल पद की काव्यात्मक समानांतरता को बचाती है। ‘घराना’ राजवंशीय अर्थ को ‘परिवार’ की तुलना में अधिक स्वाभाविक ढंग से व्यक्त करता है।
