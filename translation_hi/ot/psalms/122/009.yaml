  yaml_path: translation/ot/psalms/122/009.yaml
  text: For the sake of the house of Yahweh our God[a], I will seek your good.
translation:
  language: hi
  text: हमारे परमेश्वर यहोवा के भवन की खातिर, मैं तेरी भलाई की खोज करूँगा।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इसका अनुवाद “मैं तेरे कल्याण की खोज करूँगा” या “मैं तेरी समृद्धि की खोज करूँगा” भी हो सकता है। यहाँ इब्रानी शब्द “भलाई” यरूशलेम के कल्याण और कुशलता को दर्शाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: לְמַעַן
  choice: के कारण
  rationale: यह पदबंध उद्देश्य या प्रेरक कारण बताता है; यहाँ भजनकार यरूशलेम की भलाई चाहने का आधार यहोवा का भवन बताता है।
- source_word: בֵּית
  choice: भवन
  rationale: मूल अर्थ ‘घर/भवन’ है। संदर्भ में यह मंदिर है, पर ‘भवन’ मूल रूपक को बनाए रखता है और हिंदी में ‘यहोवा का भवन’ स्वाभाविक है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिंदी बाइबलीय परंपरा में चतुरक्षरीय दिव्य नाम का प्रचलित और पहचानने योग्य लिप्यंतरण है।
- source_word: אֱלֹהֵינוּ
  choice: हमारे परमेश्वर
  rationale: प्रथम पुरुष बहुवचन प्रत्यय सहित पद का सीधा और स्वाभाविक हिंदी रूप।
- source_word: אֲבַקְשָׁה
  choice: मैं ... चाहूँगा
  rationale: कोहोर्टेटिव रूप वक्ता के संकल्प या दृढ़ अभिप्राय को व्यक्त करता है; ‘चाहूँगा’ यहाँ किसी की भलाई के लिए सक्रिय आकांक्षा का स्वाभाविक हिंदी रूप है।
- source_word: טוֹב
  choice: भलाई
  rationale: यहाँ ‘अच्छाई’ से अधिक यरूशलेम का कल्याण, हित और समृद्ध दशा अभिप्रेत है; ‘भलाई’ इस व्यापकता को बनाए रखती है।
- source_word: לָךְ
  choice: तेरी
  rationale: द्वितीय पुरुष स्त्रीलिंग एकवचन प्रत्यय यरूशलेम को संबोधित करता है; ‘तेरी भलाई’ हिंदी में इस प्रत्यक्ष संबोधन को सुरक्षित रखता है।
theological_decisions:
- issue: दिव्य नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल में व्यक्तिगत दिव्य नाम स्पष्ट रूप से उपस्थित है। उसका सामान्य उपाधि से प्रतिस्थापन न करके हिंदी पाठकों में व्यापक रूप से पहचाना जाने वाला रूप ‘यहोवा’ रखा गया है।
- issue: בֵּית को भवन या मंदिर कहना
  choice: भवन
  alternative: मंदिर
  rationale: संदर्भ निस्संदेह मंदिर की ओर संकेत करता है, फिर भी मूल का शाब्दिक ‘भवन’ वाचा-संबंधी अभिव्यक्ति और काव्यात्मक स्वर को बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिंदी का सरल, गरिमापूर्ण और काव्यात्मक रूप। यरूशलेम के लिए स्त्रीलिंग एकवचन ‘तेरी’ रखा गया है। ‘भवन’ मूल इब्रानी अभिव्यक्ति को सुरक्षित रखता है, जबकि पादटिप्पणी ‘भलाई’ के व्यापक अर्थ को स्पष्ट करती है।
