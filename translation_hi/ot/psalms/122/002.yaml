base_translation:
  language: en
  yaml_path: translation/ot/psalms/122/002.yaml
  text: Our feet are standing within your gates[a], O Jerusalem.
translation:
  language: hi
  text: हे यरूशलेम, हमारे पाँव तेरे फाटकों के भीतर खड़े हैं।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “हे यरूशलेम, हमारे पाँव तेरे फाटकों में खड़े थे।” इब्रानी में ‘थे’ के साथ कृदंत का प्रयोग हुआ है, इसलिए यह अधिक रूपात्मक अनुवाद भी सम्भव है।
    reason: lexical_alternative
lexical_decisions:
- source_word: עֹמְדוֹת
  choice: खड़े हैं
  rationale: यह עמד का स्त्रीलिंग बहुवचन कृदंत है, जो ‘हमारे पाँव’ से मेल खाता है। ‘खड़े हैं’ जारी अवस्था और वर्तमान आगमन-बोध को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: הָיוּ
  choice: हैं
  rationale: היה का पूर्ण रूप कृदंत के साथ मिलकर परिप्रयुक्त क्रिया बनाता है। प्रसंग में हिन्दी का वर्तमान ‘हैं’ आगमन के फलस्वरूप वर्तमान स्थिति को सहज रूप से व्यक्त करता है; अधिक रूपात्मक ‘खड़े थे’ भी सम्भव है।
- source_word: רַגְלֵינוּ
  choice: हमारे पाँव
  rationale: प्रथम पुरुष बहुवचन प्रत्यय सहित शब्द का सीधा अनुवाद, जो तीर्थयात्रियों के सशरीर पहुँचने की छवि बनाए रखता है।
- source_word: בִּשְׁעָרַיִךְ
  choice: तेरे फाटकों के भीतर
  rationale: בְּ को ‘के भीतर’ से व्यक्त करने पर नगर के प्रवेश-क्षेत्र में पहुँच जाने का भाव स्पष्ट होता है। ‘तेरे फाटकों में’ अधिक रूपात्मक विकल्प है।
- source_word: יְרוּשָׁלִָם
  choice: यरूशलेम
  rationale: स्थान-नाम का हिन्दी में प्रचलित लिप्यंतरण। सम्बोधन को स्वाभाविक बनाने के लिए ‘हे’ जोड़ा गया है।
