translation:
  language: hi
  text: वहाँ गोत्र चढ़े—याह के गोत्र—इस्राएल के लिए व्यवस्था के अनुसार, यहोवा के नाम का धन्यवाद करने के लिए।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עָלוּ
  choice: ऊपर गए
  rationale: पूर्ण रूप भूतकाल को व्यक्त करता है; यरूशलेम की ओर तीर्थयात्रा के लिए प्रयुक्त ‘ऊपर जाना’ भी सुरक्षित रहता है।
- source_word: שִׁבְטֵי יָהּ
  choice: याह के गोत्र
  rationale: काव्यात्मक संक्षिप्त ईश्वरीय नाम יָהּ को ‘याह’ के रूप में रखा गया है और इसे יהוה से अलग पहचाना गया है।
- source_word: עֵדוּת לְיִשְׂרָאֵל
  choice: इस्राएल के लिए ठहराई हुई विधि के अनुसार
  rationale: עֵדוּת का मूल अर्थ ‘साक्षी/गवाही’ है, पर इस प्रसंग में यह इस्राएल को दी गई विधि या आदेश की ओर संकेत करता है; ‘के अनुसार’ चढ़ने के कार्य से उसका स्वाभाविक संबंध स्पष्ट करता है।
- source_word: לְהֹדוֹת
  choice: धन्यवाद करने के लिए
  rationale: हिफ़ील क्रिया यहाँ सार्वजनिक धन्यवाद और स्तुति व्यक्त करती है; ‘धन्यवाद करना’ पद का सीधा उद्देश्य बनाए रखता है।
- source_word: שֵׁם יְהוָה
  choice: यहोवा के नाम
  rationale: व्यक्तिगत ईश्वरीय नाम יהוה को प्रचलित हिन्दी बाइबलीय रूप ‘यहोवा’ से व्यक्त किया गया है।
theological_decisions:
- issue: עֵדוּת לְיִשְׂרָאֵל का संबंध और अर्थ
  choice: ‘इस्राएल के लिए ठहराई हुई विधि के अनुसार’—इसे गोत्रों के ऊपर जाने को नियंत्रित करने वाली ईश्वरीय व्यवस्था माना गया है।
  alternative: ‘इस्राएल के लिए एक गवाही के रूप में’—इसे यात्रा अथवा गोत्रों का वर्णन करने वाला पदबंध माना जा सकता है।
  rationale: तीर्थ-पर्वों में उपस्थित होने की तोराही व्यवस्था इस प्रसंग के अनुकूल है, और עֵדוּת का अर्थ विधिस्वरूप प्रमाण/आदेश भी हो सकता है; फिर भी अनुवाद किसी विशिष्ट पर्व को नहीं जोड़ता।
- issue: יָהּ और יהוה की प्रस्तुति
  choice: יָהּ के लिए ‘याह’ और יהוה के लिए ‘यहोवा’
  alternative: दोनों स्थानों पर ‘प्रभु’ अथवा पहले में ‘याह’ और दूसरे में ‘प्रभु’
  rationale: हिब्रू पद में आए दो संबंधित किंतु भिन्न रूपों को दिखाने से काव्यात्मक शब्दावली और व्यक्तिगत नाम दोनों सुरक्षित रहते हैं।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामूहिक उपासना के संदर्भ के अनुकूल रखी गई है। ‘गोत्र’ स्थापित बाइबलीय शब्द है; डैश हिब्रू की पुनरुक्ति ‘गोत्र—याह के गोत्र’ को स्वाभाविक हिन्दी में बनाए रखते हैं।
