  yaml_path: translation/ot/psalms/122/007.yaml
  text: May there be peace within your ramparts[c][b][a], prosperity within your citadels.
translation:
  language: hi
  text: तेरी शहरपनाह के भीतर शान्ति हो, तेरे गढ़ों के भीतर सुख-चैन हो।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהִי
  choice: हो
  rationale: यह जुस्सिव रूप कामना या प्रार्थना व्यक्त करता है; हिन्दी में वाक्य के अंत का ‘हो’ इस भाव को स्वाभाविक और संक्षिप्त रूप से रखता है।
- source_word: שָׁלוֹם
  choice: शान्ति
  rationale: यह शब्द शान्ति, कुशल और समग्र भलाई का बोध करा सकता है; यरूशलेम के लिए की गई इस प्रार्थना में ‘शान्ति’ सीधा और स्वाभाविक है।
- source_word: בְּחֵילֵךְ
  choice: तेरी शहरपनाह के भीतर
  rationale: חֵיל यहाँ नगर के रक्षात्मक घेरे या प्राचीर को दर्शाता है। ‘शहरपनाह’ सामान्य ‘दीवार’ की अपेक्षा दुर्गबन्दी का आशय अधिक स्पष्ट करती है, और ‘के भीतर’ स्थानवाचक בְּ को व्यक्त करता है।
- source_word: שַׁלְוָה
  choice: सुख-चैन
  rationale: यह शब्द निश्चिन्तता, शान्त सुरक्षा और सुस्थिर भलाई का बोध कराता है। ‘सुख-चैन’ समृद्धि का दावा किए बिना उसके शांत, सुरक्षित कल्याण के भाव को सहज हिन्दी में व्यक्त करता है।
- source_word: בְּאַרְמְנוֹתָיִךְ
  choice: तेरे गढ़ों के भीतर
  rationale: אַרְמוֹן का अर्थ राजमहल या किलाबन्द दृढ़ स्थान हो सकता है। ‘गढ़’ प्रसंग के रक्षात्मक नगर-चित्र और शब्द की दृढ़ स्थान वाली सम्भावना को स्वाभाविक हिन्दी में रखता है।
theological_decisions: []
