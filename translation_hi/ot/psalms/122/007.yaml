  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, काव्यात्मक और जनसुलभ रूप। यरूशलेम को स्त्रीलिंग एकवचन सम्बोधन के अनुरूप ‘तेरी/तेरे’ रखा गया है। समानान्तर पंक्तियों में ‘के भीतर ... हो’ की संरचना बनाए रखी गई है।
