  choice: आरोहणों का गीत
  rationale: इब्रानी बहुवचन ‘मआलोत’ को बनाए रखते हुए संग्रह के पारंपरिक शीर्षक को संक्षिप्त और गरिमापूर्ण रूप में व्यक्त करता है; इसकी सांस्कृतिक अनिश्चितता पादटिप्पणी में रखी गई है।
- source_word: בְּאֹמְרִים לִי
  choice: जब लोगों ने मुझसे कहा
  rationale: इब्रानी कृदन्तीय वाक्यांश का स्वाभाविक हिन्दी कालवाची रूप; वक्ताओं की पहचान स्रोत में अनिर्दिष्ट है, इसलिए सामान्य ‘लोगों’ का प्रयोग किया गया है।
- source_word: בֵּית יְהוָה
  choice: याहवे के भवन
  rationale: ‘भवन’ उपासना-स्थान के औपचारिक अर्थ को रखता है और याहवे नाम को उपाधि में बदलने के बजाय नाम के रूप में प्रस्तुत करता है।
- source_word: שָׂמַחְתִּי
  choice: मैं आनन्दित हुआ
  rationale: पूर्ण क्रिया के भाव और भजन की गरिमापूर्ण शैली को सहज आधुनिक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: चार अक्षरों वाले ईश्वरीय नाम יהוה का निरूपण
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: स्रोत में उपस्थित व्यक्तिगत नाम को स्पष्ट रूप से बनाए रखा गया है। उच्चारण पूर्णतः निश्चित नहीं है और हिन्दी की अन्य प्रचलित परम्पराएँ पादटिप्पणी में बताई गई हैं।
- issue: पहले पुरुष के आनन्द और लोगों के कथन का कालगत सम्बन्ध
  choice: ‘जब ... कहा, तो मैं आनन्दित हुआ’
  alternative: ‘मैं उन लोगों के कारण आनन्दित हुआ जो मुझसे कहते थे’
  rationale: यह स्रोत की सर्वाधिक स्वाभाविक समझ है, पर इब्रानी कृदन्त के अधिक शाब्दिक, संभावित आवृत्तिमूलक अर्थ को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, काव्यात्मक और गरिमापूर्ण शैली रखी गई है। शीर्षक को मुख्य पद से अलग पंक्ति में रखा गया है। ‘आओ, हम ... चलें’ सामूहिक निमंत्रण को स्वाभाविक हिन्दी में व्यक्त करता है; किसी विशिष्ट सम्प्रदाय की शब्दावली नहीं जोड़ी गई।
