  yaml_path: translation/ot/psalms/122/000.yaml
  text: A Song of Ascents[a]. Of David. I rejoiced when they said to me[c][b], “Let us go to the house of Yahweh.”
translation:
  language: hi
  text: 'चढ़ाइयों का गीत[a]। दाऊद का।


    जब लोगों ने मुझसे कहा, “आओ, हम याहवे[b] के भवन चलें,” तो मैं आनन्दित हुआ[c]।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी शीर्षक का शाब्दिक अर्थ “चढ़ाइयों का गीत” है। सम्भवतः यह यरूशलेम की तीर्थयात्रा में गाए जाने वाले गीतों या किसी उपासना-संग्रह का नाम था; इसे “ऊपर चढ़ने का गीत” भी समझा जा सकता है।
    reason: cultural_note
  - marker: b
    text: इब्रानी ईश्वरीय नाम יהוה (YHWH) का उच्चारण निश्चित रूप से ज्ञात नहीं है। यहाँ “याहवे” लिखा गया है; हिन्दी में “यहोवा” भी प्रचलित है और अनेक अनुवाद इसे “प्रभु” लिखते हैं।
    reason: alternative_reading
  - marker: c
    text: या, “मैं प्रसन्न हुआ।” इब्रानी वाक्यांश को अधिक शाब्दिक रूप में “मुझसे कहने वालों में मैं आनन्दित हुआ” भी अनूदित किया जा सकता है।
    reason: lexical_alternative
lexical_decisions:
