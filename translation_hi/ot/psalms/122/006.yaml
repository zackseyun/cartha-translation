  yaml_path: translation/ot/psalms/122/006.yaml
  text: 'Pray for the peace of Jerusalem: may those who love you prosper[a][b].'
translation:
  language: hi
  text: 'यरूशलेम की शांति के लिए प्रार्थना करो:[a]

    जो तुझसे प्रेम करते हैं, वे सुख-चैन से रहें।[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “यरूशलेम की शांति माँगो।”
    reason: lexical_alternative
  - marker: b
    text: या, “जो तुझसे प्रेम करते हैं, वे समृद्ध हों”; अथवा, “जो तुझसे प्रेम करते हैं, वे सुख-चैन से रहेंगे।”
    reason: alternative_reading
lexical_decisions:
- source_word: שַׁאֲלוּ
  choice: प्रार्थना करो
  rationale: שׁאל का मूल अर्थ ‘माँगना’ है; यहाँ यरूशलेम की शान्ति के लिए परमेश्वर से विनती करने का काव्यात्मक-सामुदायिक सन्दर्भ है, इसलिए ‘प्रार्थना करो’ स्वाभाविक है। ‘माँगो’ को पाद-टिप्पणी में रखा गया है।
- source_word: שְׁלוֹם
  choice: शान्ति
  rationale: שָׁלוֹם शान्ति, कुशलता और समग्र कल्याण को समेटता है। हिन्दी में ‘शान्ति’ इस पद के सन्दर्भ और पारम्परिक अर्थ दोनों को स्पष्ट रूप से व्यक्त करती है।
- source_word: יְרוּשָׁלִָם
  choice: यरूशलेम
  rationale: स्थान-नाम का आधुनिक मानक हिन्दी रूप।
- source_word: יִשְׁלָיוּ
  choice: सुख-चैन से रहें
  rationale: שלה का अर्थ निश्चिन्त, सुरक्षित अथवा समृद्ध अवस्था में रहना हो सकता है। ‘सुख-चैन से रहें’ शान्ति और कुशलता के भाव को स्वाभाविक हिन्दी में रखता है और इसे केवल भौतिक समृद्धि तक सीमित नहीं करता।
- source_word: אֹהֲבָיִךְ
  choice: जो तुझसे प्रेम करते हैं
  rationale: स्त्रीलिंग एकवचन प्रत्यय सीधे यरूशलेम को सम्बोधित करता है; ‘तुझसे’ इस प्रत्यक्ष सम्बोधन को सुरक्षित रखता है।
theological_decisions:
- issue: दूसरे चरण में יִשְׁלָיוּ का भाव
  choice: 'कामना/प्रार्थना: ‘वे सुख-चैन से रहें’'
  alternative: 'वचनात्मक कथन: ‘वे सुख-चैन से रहेंगे’ अथवा ‘वे समृद्ध होंगे’'
  rationale: काव्य में अपूर्ण क्रिया का रूप कामना या कथन, दोनों रूपों में समझा जा सकता है। पहले चरण की आज्ञा के बाद कामनात्मक अनुवाद अधिक स्वाभाविक है; पाद-टिप्पणी वैकल्पिक कथनात्मक अर्थ को सुरक्षित रखती है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामुदायिक उपासना में सहज हिन्दी। काव्यात्मक प्रत्यक्ष सम्बोधन बनाए रखने के लिए ‘तुझसे’ रखा गया है। ‘सुख-चैन’ सामान्य पाठक के लिए सहज है और सुरक्षा, निश्चिन्तता तथा कल्याण की व्यापक अर्थ-छाया व्यक्त करता है।
