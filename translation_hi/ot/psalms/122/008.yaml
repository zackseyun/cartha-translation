lexical_decisions:
- source_word: לְמַעַן
  choice: के कारण
  rationale: यह पदबंध यहाँ बोलने की प्रेरणा या हित-संबंधी कारण बताता है। आधुनिक हिन्दी में ‘के कारण’ स्वाभाविक है और मूल आशय को सुरक्षित रखता है।
- source_word: אַחַי
  choice: अपने भाइयों
  rationale: मूल में ‘भाई’ का पुल्लिंग बहुवचन और प्रथम पुरुष एकवचन संबंधसूचक प्रत्यय है; इसलिए लिंग-विशिष्ट रूप बनाए रखा गया है।
- source_word: וְרֵעָי
  choice: और अपने साथियों
  rationale: רֵעַ मित्र, संगी, साथी या पड़ोसी हो सकता है। सामुदायिक और सम्भावित तीर्थयात्रा-संदर्भ में ‘साथी’ पर्याप्त व्यापक और स्वाभाविक है।
- source_word: אֲדַבְּרָה
  choice: मैं ... कहूँगा
  rationale: प्रथम पुरुष cohortative संकल्प या स्व-प्रेरणा व्यक्त करता है। उद्धृत वाक्य से पहले हिन्दी में ‘कहूँगा’ स्वाभाविक है और संकल्प का भाव रखता है।
- source_word: נָּא
  choice: अब
  rationale: कण यहाँ तात्कालिकता या विनय—दोनों में समझा जा सकता है। मुख्य पाठ में ‘अब’ प्रवाहपूर्ण है; ‘कृपया’ की सम्भावना पादटिप्पणी में रखी गई है।
- source_word: שָׁלוֹם
  choice: शान्ति
  rationale: यह पारम्परिक और संक्षिप्त अनुवाद है, जबकि मूल शब्द में कुशलता, सम्पूर्णता और समृद्धि का व्यापक भाव भी निहित हो सकता है।
- source_word: בָּךְ
  choice: तेरे भीतर
  rationale: स्त्रीलिंग एकवचन प्रत्यय यरूशलेम को सीधे सम्बोधित करता है। ‘तेरे भीतर’ नगर के अन्दर शान्ति होने का स्थानगत और काव्यात्मक भाव बनाए रखता है।
theological_decisions:
- issue: सम्बन्ध-सूचक शब्द का लिंग
  choice: अपने भाइयों
  alternative: अपने भाई-बंधुओं / अपने परिजनों
  rationale: मूल इब्रानी में पुल्लिंग बहुवचन ‘भाइयों’ है। सामुदायिक अर्थ सम्भव होने पर भी उसे मुख्य पाठ में लिंग-निरपेक्ष बनाना आवश्यक नहीं।
- issue: आशीष का सम्बोधन
  choice: 'यरूशलेम को स्त्रीलिंग एकवचन में सीधे सम्बोधन: ‘तेरे भीतर शान्ति हो’'
  alternative: उसमें शान्ति हो / तुझमें शान्ति रहे
  rationale: בָּךְ का स्त्रीलिंग एकवचन रूप पूर्वपद यरूशलेम को व्यक्तिवत् सीधे सम्बोधित करता है; इसे बनाए रखने से मूल की काव्यात्मक शक्ति सुरक्षित रहती है।
- issue: נָא का अर्थ
  choice: अब
  alternative: कृपया
  rationale: यह कण तात्कालिकता या विनय व्यक्त कर सकता है। संदर्भ में संकल्पात्मक ‘अब’ मुख्य पाठ में उचित है, पर दूसरी सम्भावना को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। यरूशलेम के सीधे स्त्रीलिंग सम्बोधन को ‘तेरे’ से सुरक्षित रखा गया है। ‘के कारण’ सहज हिन्दी है; अधिक औपचारिक विकल्प ‘की खातिर’ या ‘के निमित्त’ हो सकते थे।
