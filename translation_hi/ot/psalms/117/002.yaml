id: PSA.117.2
reference: Psalms 117:2
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: כִּ֥י גָ֘בַ֤ר עָלֵ֨י/נוּ חַסְדּ֗/וֹ וֶֽ/אֱמֶת יְהוָ֥ה לְ/עוֹלָ֗ם הַֽלְלוּ יָֽהּ׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/117/002.yaml
  text: For his steadfast love has prevailed over us[a], and the faithfulness of Yahweh is forever. Praise Yah!
translation:
  language: hi
  text: 'क्योंकि उसका अटल प्रेम हम पर प्रबल हुआ है,

    और याहवे की विश्वासयोग्यता[a] सदा बनी रहती है।

    याह की स्तुति करो!'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “सच्चाई।”
    reason: אֱמֶת का अर्थ संदर्भ के अनुसार ‘विश्वासयोग्यता’ या ‘सच्चाई’ हो सकता है।
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पद 1 में सब राष्ट्रों को स्तुति के लिए बुलाने का कारण बताता है; ‘क्योंकि’ इस कारण-संबंध को स्वाभाविक रूप से व्यक्त करता है।
- source_word: גָבַר עָלֵינוּ
  choice: हम पर प्रबल हुआ है
  rationale: גבר का मूल भाव शक्तिशाली होने या प्रबल होने का है, और עלֵינוּ के ‘हम पर’ रूप को बनाए रखने से इब्रानी की सशक्त काव्यात्मक छवि सुरक्षित रहती है।
- source_word: חַסְדּוֹ
  choice: उसका अटल प्रेम
  rationale: חסד में प्रेम, निष्ठा और स्थायी प्रतिबद्धता के संयुक्त भाव हैं। ‘अटल प्रेम’ आधुनिक हिन्दी में सहज है और केवल ‘दया’ की अपेक्षा इस व्यापक अर्थ को बेहतर व्यक्त करता है।
- source_word: וֶאֱמֶת
  choice: और विश्वासयोग्यता
  rationale: חסד के साथ युग्म में אֱמֶת यहाँ भरोसेमंद निष्ठा का भाव प्रबल रूप से व्यक्त करता है। ‘सच्चाई’ भी वास्तविक शाब्दिक संभावना है, इसलिए उसे पादटिप्पणी में रखा गया है।
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत वाचा-नाम को किसी उपाधि से बदलने के बजाय हिन्दी लिपि में लिप्यंतरित किया गया है।
- source_word: לְעוֹלָם
  choice: सदा बनी रहती है
  rationale: यह चिरस्थायित्व व्यक्त करता है; हिन्दी में स्त्रीलिंग संज्ञा ‘विश्वासयोग्यता’ के साथ यह स्वाभाविक और अर्थपूर्ण रूप है।
- source_word: הַלְלוּ יָהּ
  choice: याह की स्तुति करो!
  rationale: आज्ञार्थक क्रिया और संक्षिप्त दिव्य नाम יָהּ दोनों को अनूदित/लिप्यंतरित करके स्पष्ट रखा गया है।
theological_decisions:
- issue: दिव्य नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा / प्रभु
  rationale: मूल पाठ में व्यक्तिगत दिव्य नाम है; ‘याहवे’ उसका अधिक प्रत्यक्ष लिप्यंतरण है और उसे किसी उपाधि में नहीं बदलता।
- issue: חֶסֶד के साथ אֱמֶת का अर्थ
  choice: विश्वासयोग्यता
  alternative: सच्चाई
  rationale: इस पारंपरिक शब्द-युग्म में covenantal dependability अर्थात भरोसेमंद निष्ठा का भाव संदर्भानुकूल है, पर ‘सच्चाई’ की वास्तविक अर्थ-संभावना को पादटिप्पणी में सुरक्षित रखा गया है।
- issue: גָבַר עָלֵינוּ की सशक्त छवि
  choice: हम पर प्रबल हुआ है
  alternative: हमारे प्रति महान है
  rationale: मुख्य पाठ मूल क्रिया की गतिशीलता और ‘हम पर’ की छवि बनाए रखता है; अधिक सरल विकल्प उस छवि को कमजोर कर देता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। काव्य-पंक्तियों में मूल पद की समानांतर रचना और ‘हम पर प्रबल हुआ है’ की प्रभावशाली छवि बनाए रखी गई है।
