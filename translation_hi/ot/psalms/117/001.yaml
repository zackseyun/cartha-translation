  text: Praise Yahweh[a], all nations; extol him, all peoples.
translation:
  language: hi
  text: 'हे सब राष्ट्रों, यहोवा[a] की स्तुति करो;

    हे सब लोगों, उसका गुणगान करो।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी पाठ में परमेश्वर का विशिष्ट नाम YHWH है। इसका प्रचलित विद्वत्तापरक उच्चारण ‘याहवे’ है; अनेक अनुवादों में इसके स्थान पर ‘प्रभु’ लिखा जाता है।
    reason: alternative_reading
lexical_decisions:
- source_word: הַֽלְלוּ
  choice: स्तुति करो
  rationale: पिएल बहुवचन आज्ञार्थक क्रिया सीधे और सामूहिक रूप से प्रशंसा करने का आह्वान करती है; ‘स्तुति करो’ स्वाभाविक और गरिमापूर्ण हिन्दी है।
- source_word: אֶת יְהוָה
  choice: यहोवा
  rationale: यहाँ प्रत्यक्ष कर्म के रूप में परमेश्वर का विशिष्ट नाम YHWH है। हिन्दी बाइबल परंपरा में परिचित ‘यहोवा’ पाठकों के लिए स्पष्ट है; पादटिप्पणी मूल नाम और वैकल्पिक उच्चारण बताती है।
- source_word: כָּל גּוֹיִם
  choice: हे सभी राष्ट्रो
  rationale: גּוֹיִם राष्ट्रों अथवा जनसमूहों को सूचित करता है। संबोधन के रूप में ‘हे सभी राष्ट्रो’ सार्वभौमिक आह्वान और काव्यात्मक बल दोनों बनाए रखता है।
- source_word: שַׁבְּחוּהוּ
  choice: उसका गुणगान करो
  rationale: שבח का आज्ञार्थक रूप प्रशंसापूर्वक बड़ाई करने को कहता है। ‘गुणगान करो’ पहले चरण की ‘स्तुति करो’ से अर्थपूर्ण काव्यात्मक विविधता बनाए रखता है।
- source_word: כָּל הָאֻמִּים
  choice: हे सभी जाति-जाति के लोगो
  rationale: אֻמִּים विभिन्न जनसमुदायों को दर्शाता है। यह चयन पहले चरण के ‘राष्ट्रो’ से हल्का भेद रखते हुए समानांतरता और सर्वसमावेशी संबोधन को व्यक्त करता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का निरूपण
  choice: यहोवा
  alternative: याहवे / प्रभु
  rationale: मूल पाठ में सामान्य उपाधि नहीं, चार अक्षरों वाला विशिष्ट ईश्वरीय नाम YHWH है। मुख्य पाठ में हिन्दी पाठकों के बीच स्थापित रूप ‘यहोवा’ रखा गया है और पादटिप्पणी में ‘याहवे’ तथा ‘प्रभु’ की परंपरा स्पष्ट की गई है, बिना मूल नाम को छिपाए।
translation_notes:
  register: आधुनिक मानक हिन्दी में काव्यात्मक, गरिमापूर्ण और सार्वजनिक पाठ के अनुकूल शैली। दोनों समानांतर चरणों में संबोधन स्पष्ट किया गया है; ‘राष्ट्रो’ और ‘जाति-जाति के लोगो’ मूल के निकटार्थी किंतु भिन्न शब्दों का अंतर बनाए रखते हैं।
