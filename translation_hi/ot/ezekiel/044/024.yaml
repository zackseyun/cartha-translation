source:
  edition: WLC
  text: וְ/עַל רִ֗יב הֵ֚מָּה יַעַמְד֣וּ ל/שפט בְּ/מִשְׁפָּטַ֖/י ו/שפט/הו וְ/אֶת תּוֹרֹתַ֤/י וְ/אֶת חֻקֹּתַ/י֙ בְּ/כָל מוֹעֲדַ֣/י יִשְׁמֹ֔רוּ וְ/אֶת שַׁבְּתוֹתַ֖/י יְקַדֵּֽשׁוּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/044/024.yaml
  text: In a dispute[a], they shall stand to judge; they shall judge it according to my judgments. They shall keep my laws and my statutes at all my appointed times[b], and they shall keep my Sabbaths holy.
translation:
  language: hi
  text: किसी विवाद[a] में वे न्याय करने के लिए खड़े होंगे; वे मेरे न्याय-विधानों के अनुसार उसका न्याय करेंगे। वे मेरे सभी नियत समयों[b] पर मेरी व्यवस्थाओं और मेरी विधियों का पालन करेंगे, और मेरे सब्तों को पवित्र मानेंगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘मामले,’ ‘झगड़े’ अथवा ‘मुकदमे’ में।
    reason: lexical_alternative
  - marker: b
    text: ‘मेरे नियत समयों’ का अनुवाद ‘मेरे नियत पर्वों’ अथवा ‘मेरे ठहराए हुए समयों’ भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: רִיב
  choice: विवाद
  rationale: यह शब्द न्यायिक विवाद, मुकदमे या विचाराधीन मामले को सूचित करता है। ‘विवाद’ आधुनिक हिन्दी में स्वाभाविक है और न्यायिक प्रसंग के अनुकूल रहते हुए शब्द को केवल औपचारिक मुकदमे तक सीमित नहीं करता।
- source_word: יַעַמְדוּ ל/שפט
  choice: न्याय करने के लिए खड़े होंगे
  rationale: ‘खड़े होंगे’ से עמד का प्रत्यक्ष न्यायिक बिंब बना रहता है और ‘न्याय करने के लिए’ उद्देश्यसूचक infinitive को स्पष्ट रूप से व्यक्त करता है।
- source_word: בְּ/מִשְׁפָּטַי
  choice: मेरे न्याय-विधानों के अनुसार
  rationale: מִשְׁפָּטַי यहाँ परमेश्वर के न्यायिक निर्णयों अथवा मानकों को सूचित करता है। ‘न्याय-विधान’ न्याय के तत्काल प्रसंग को बनाए रखता है और תורות तथा חקות से शब्दगत भेद भी बचाता है।
- source_word: ו/שפט/הו
  choice: उसका न्याय करेंगे
  rationale: एकवचन कर्म-सर्वनाम का संबंध पहले आए विवाद या मामले से है। यह अनुवाद שפט की पुनरावृत्ति को भी बनाए रखता है।
- source_word: תּוֹרֹתַי
  choice: मेरी व्यवस्थाओं
  rationale: תּוֹרָה का अर्थ शिक्षा अथवा व्यवस्था हो सकता है। इस याजकीय-विधिक प्रसंग में बहुवचन ‘व्यवस्थाएँ’ उसके बाध्यकारी स्वरूप को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: חֻקֹּתַי
  choice: मेरी विधियों
  rationale: חֹק/חֻקָּה निर्धारित विधान या नियम को सूचित करता है। ‘विधियाँ’ निकटवर्ती תּוֹרֹתַי से अर्थगत संबंध रखते हुए भी अलग शब्दावली बनाए रखता है।
- source_word: בְּ/כָל מוֹעֲדַי
  choice: मेरे सभी नियत समयों पर
  rationale: מוֹעֵד नियत समय, पवित्र सभा या नियत पर्व का बोध करा सकता है। ‘नियत समय’ व्यापक मूल अर्थ को सुरक्षित रखता है; पर्व-संबंधी अर्थ पादटिप्पणी में दिया गया है।
- source_word: יִשְׁמֹרוּ
  choice: पालन करेंगे
  rationale: वाचा और विधि के प्रसंग में שמר का अर्थ किसी आज्ञा या विधान का पालन करना है। हिन्दी में ‘पालन करना’ स्पष्ट और स्वाभाविक है।
- source_word: שַׁבְּתוֹתַי
  choice: मेरे विश्राम-दिनों
  rationale: यह बहुवचन रूप है। ‘विश्राम-दिन’ शब्बत का अर्थ सामान्य पाठक के लिए स्पष्ट करता है और बहुवचन को बनाए रखता है।
- source_word: יְקַדֵּשׁוּ
  choice: पवित्र मानेंगे
  rationale: पिएल रूप का अर्थ पवित्र ठहराना या पवित्र समझकर व्यवहार करना है। ‘पवित्र मानेंगे’ उपासना-संबंधी आशय को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: याजकीय निर्देश में वाचा-संबंधी विधिक शब्दों का अनुवाद
  choice: מִשְׁפָּטַי, תּוֹרֹתַי और חֻקֹּתַי के लिए क्रमशः ‘न्याय-विधान,’ ‘व्यवस्थाएँ’ और ‘विधियाँ’ जैसे अलग शब्द रखना
  alternative: तीनों को सामान्य रूप से ‘नियम’ या ‘कानून’ कहना
  rationale: इब्रानी पाठ संबंधित किन्तु अलग विधिक शब्दों को साथ रखता है। हिन्दी में उनका भेद बनाए रखने से स्रोत की शब्दावली अनावश्यक रूप से एक ही श्रेणी में नहीं समेटी जाती।
- issue: מוֹעֵד का समय अथवा पर्व-संबंधी अर्थ
  choice: मुख्य पाठ में ‘नियत समय’ रखना और ‘नियत पर्व’ को पादटिप्पणी में देना
  alternative: मुख्य पाठ में केवल ‘नियत पर्व’ रखना
  rationale: इस शब्द में नियत समय और धार्मिक पर्व/सभा दोनों की अर्थ-सम्भावना है। व्यापक अनुवाद मूल की वास्तविक अस्पष्टता बचाता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य हिन्दी पाठक के लिए सुबोध रखी गई है। न्यायिक संदर्भ की औपचारिकता बनाए रखने के लिए ‘खड़े होंगे,’ ‘न्याय-विधान’ और ‘उसका न्याय करेंगे’ रखा गया है; अत्यधिक संस्कृतनिष्ठ कानूनी भाषा से बचा गया है।
