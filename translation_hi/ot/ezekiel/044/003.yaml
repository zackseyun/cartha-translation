id: EZK.44.3
reference: Ezekiel 44:3
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: אֶֽת הַ/נָּשִׂ֗יא נָ֥שִׂיא ה֛וּא יֵֽשֶׁב בּ֥/וֹ לֶ/אֱכָול לֶ֖חֶם לִ/פְנֵ֣י יְהוָ֑ה מִ/דֶּ֨רֶךְ אֻלָ֤ם הַ/שַּׁ֨עַר֙ יָב֔וֹא וּ/מִ/דַּרְכּ֖/וֹ יֵצֵֽא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/044/003.yaml
  text: As for the prince[a], because he is the prince, he may sit in it to eat bread before Yahweh. He shall enter by way of the porch of the gate, and shall go out by the same way.
translation:
  language: hi
  text: जहाँ तक प्रधान की बात है, प्रधान होने के कारण वह उसमें बैठकर यहोवा के सामने रोटी खा सकता है। वह फाटक के बरामदे के मार्ग से भीतर आए और उसी मार्ग से बाहर जाए।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जिस मार्ग से वह आया हो, उसी से बाहर जाए।” इब्रानी में शाब्दिक रूप से “अपने मार्ग से वह बाहर जाए” है; सम्भवतः आशय अभी बताए गए उसी मार्ग से है।
    reason: अन्तिम वाक्यांश के प्रत्यययुक्त ‘मार्ग’ में बनी शाब्दिक अस्पष्टता और सम्भावित अर्थ को सुरक्षित रखना।
lexical_decisions:
- source_word: אֶת הַנָּשִׂיא
  choice: जहाँ तक प्रधान की बात है
  rationale: वाक्य के आरम्भ में आए चिह्नित पद को विषय के रूप में प्रमुखता देता है और इब्रानी के बलाघात को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: נָשִׂיא
  choice: प्रधान
  rationale: यहेजकेल में यह किसी मान्य शासकीय पदाधिकारी की उपाधि है। ‘प्रधान’ पद की गरिमा बनाए रखता है और उसे अनिवार्य रूप से राजा के पुत्र या मसीहा के रूप में नहीं पहचानता।
- source_word: נָשִׂיא הוּא
  choice: प्रधान होने के कारण
  rationale: संज्ञा की पुनरावृत्ति और सर्वनाम यहाँ उसके विशेष अधिकार का कारण बताते हैं; हिन्दी में कारणसूचक रूप इस बल को स्पष्ट करता है।
- source_word: יֵשֶׁב בּוֹ
  choice: वह उसमें बैठकर ... खा सकता है
  rationale: इस विधिक प्रसंग में अपूर्ण क्रिया अनुमति व्यक्त करती है। ‘उसमें’ निकटवर्ती फाटक-स्थान की ओर संकेत को बनाए रखता है।
- source_word: לֶאֱכָל לֶחֶם
  choice: रोटी खा
  rationale: मूल अभिव्यक्ति का शाब्दिक रूप रखा गया है; हिन्दी में भी यह सहज है, यद्यपि प्रसंग में पूरे भोजन का भाव हो सकता है।
- source_word: לִפְנֵי יְהוָה
  choice: यहोवा के सामने
  rationale: व्यक्तिवाचक नाम और स्थानिक-उपासना संबंधी ‘सामने’ दोनों को सीधे व्यक्त करता है।
- source_word: מִדֶּרֶךְ אֻלָם הַשַּׁעַר
  choice: फाटक के बरामदे के मार्ग से
  rationale: אֻלָם फाटक के सामने या भीतर के बरामदे/प्रवेश-मण्डप को दर्शाता है; यह रूप स्थापत्य अर्थ को सामान्य आधुनिक हिन्दी में स्पष्ट रखता है।
- source_word: יָבוֹא
  choice: भीतर आए
  rationale: निर्देशात्मक प्रसंग में क्रिया निर्धारित प्रक्रिया व्यक्त करती है; ‘भीतर’ प्रवेश की दिशा को स्वाभाविक हिन्दी में स्पष्ट करता है।
- source_word: וּמִדַּרְכּוֹ יֵצֵא
  choice: उसी मार्ग से बाहर जाए
  rationale: प्रत्यययुक्त ‘उसका मार्ग’ का सबसे संभावित संकेत अभी बताए गए प्रवेश-मार्ग की ओर है। मुख्य पाठ में प्रक्रियात्मक समानता स्पष्ट की गई है, जबकि शाब्दिक अस्पष्टता पादटिप्पणी में दी गई है।
theological_decisions:
- issue: मन्दिर-दर्शन में נָשִׂיא की पहचान और पद
  choice: उसे तटस्थ उपाधि ‘प्रधान’ के रूप में प्रस्तुत करना
  alternative: उसे विशेष रूप से मसीही शासक, दाऊदी राजा, या केवल लौकिक अधिकारी के रूप में पहचानना
  rationale: यह पद प्रधान को विशेष सुविधा देता है, पर उसकी अंतिम पहचान तय नहीं करता। इसलिए अनुवाद किसी विशिष्ट धर्मवैज्ञानिक निष्कर्ष को पाठ में नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। विधिक निर्देश के लिए ‘आए/जाए’ और अनुमति के लिए ‘खा सकता है’ का भेद रखा गया है। स्थापत्य शब्द אֻלָם के लिए अत्यधिक तकनीकी ‘प्रवेश-मण्डप’ के बजाय स्पष्ट ‘बरामदा’ चुना गया है।
