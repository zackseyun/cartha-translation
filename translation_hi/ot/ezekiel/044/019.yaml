source:
  edition: WLC
  text: וּ֠/בְ/צֵאתָ/ם אֶל הֶ/חָצֵ֨ר הַ/חִיצוֹנָ֜ה אֶל הֶ/חָצֵ֣ר הַ/חִיצוֹנָה֮ אֶל הָ/עָם֒ יִפְשְׁט֣וּ אֶת בִּגְדֵי/הֶ֗ם אֲשֶׁר הֵ֨מָּה֙ מְשָׁרְתִ֣ם בָּ֔/ם וְ/הִנִּ֥יחוּ אוֹתָ֖/ם בְּ/לִֽשְׁכֹ֣ת הַ/קֹּ֑דֶשׁ וְ/לָֽבְשׁוּ֙ בְּגָדִ֣ים אֲחֵרִ֔ים וְ/לֹֽא יְקַדְּשׁ֥וּ אֶת הָ/עָ֖ם בְּ/בִגְדֵי/הֶֽם־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/044/019.yaml
  text: When they go out to the outer court[a], to the outer court where the people are, they shall take off their garments in which they minister and leave them in the holy chambers. Then they shall put on other garments[b], so that they may not make the people holy with their garments.
translation:
  language: hi
  text: जब वे बाहर के आँगन में—उस बाहरी आँगन में जहाँ लोग हैं[a]—जाएँ, तब वे उन वस्त्रों को उतार दें जिन्हें पहनकर वे सेवा करते हैं, और उन्हें पवित्र कोठरियों में रख दें। फिर वे दूसरे वस्त्र पहनें, ताकि वे अपने वस्त्रों के द्वारा लोगों को पवित्र न कर दें[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में ‘बाहरी आँगन’ दो बार आया है; यह याजकों के क्षेत्र से उस आँगन की ओर जाने पर बल देता है जहाँ लोगों का प्रवेश था।
    reason: cultural_note
  - marker: b
    text: इसका अनुवाद ‘लोगों को पवित्र ठहरा न दें’ या ‘लोगों को समर्पित न कर दें’ भी हो सकता है। यहाँ बात नैतिक शुद्धि की नहीं, पवित्र वस्त्रों से जुड़ी अनुष्ठानिक पवित्रता की है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְצֵאתָם
  choice: जब वे ... जाएँ
  rationale: वाव के साथ अनंत क्रिया और प्रत्यय यहाँ कालवाचक उपवाक्य बनाते हैं; हिंदी में ‘जब वे ... जाएँ’ स्वाभाविक रूप से वही अर्थ देता है।
- source_word: הֶחָצֵר הַחִיצוֹנָה
  choice: बाहर का आँगन / बाहरी आँगन
  rationale: חָצֵר मंदिर के आँगन को दर्शाता है और הַחִיצוֹנָה उसे बाहरी क्षेत्र ठहराता है। पुनरावृत्ति को हिंदी में बनाए रखा गया है।
- source_word: אֶל הֶחָצֵר הַחִיצוֹנָה אֶל הָעָם
  choice: उस बाहरी आँगन में जहाँ लोग हैं
  rationale: दूसरा אֶל הָעָם बाहरी आँगन को लोगों के क्षेत्र के रूप में स्पष्ट करता है; यह रूप हिंदी में स्थानिक संबंध को सहजता से व्यक्त करता है।
- source_word: יִפְשְׁטוּ אֶת בִּגְדֵיהֶם
  choice: वे उन वस्त्रों को उतार दें
  rationale: वस्त्रों के संदर्भ में פשט का अर्थ ‘उतारना’ है; तृतीय पुरुष बहुवचन संबंधवाचक प्रत्यय का भाव संदर्भ में ‘उन वस्त्रों’ और आगे ‘अपने वस्त्रों’ से सुरक्षित है।
- source_word: אֲשֶׁר הֵמָּה מְשָׁרְתִם בָּם
  choice: जिन्हें पहनकर वे सेवा करते हैं
  rationale: שרת यहाँ याजकीय अथवा मंदिर की सेवा को बताता है। ‘पहनकर’ वस्त्रों के साथ ב के स्वाभाविक हिंदी संबंध को स्पष्ट करता है।
- source_word: וְהִנִּיחוּ אוֹתָם
  choice: और उन्हें ... रख दें
  rationale: נוח के हिफ़ील रूप का यहाँ अर्थ निर्धारित स्थान पर वस्त्र रख देना है।
- source_word: בְּלִשְׁכֹת הַקֹּדֶשׁ
  choice: पवित्र कोठरियों में
  rationale: לשכה मंदिर-परिसर के कक्ष या कोठरी को दर्शाता है; ‘पवित्र कोठरियाँ’ समर्पित मंदिर-कक्षों के अर्थ को संक्षेप में रखता है।
- source_word: וְלָבְשׁוּ בְּגָדִים אֲחֵרִים
  choice: फिर वे दूसरे वस्त्र पहनें
  rationale: לבש का अर्थ वस्त्र पहनना है और אֲחֵרִים का सीधा अर्थ ‘दूसरे’ है; ‘फिर’ वस्त्र बदलने के क्रम को स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: וְלֹא יְקַדְּשׁוּ אֶת הָעָם
  choice: ताकि वे ... लोगों को पवित्र न कर दें
  rationale: קדש के पिएल रूप का अर्थ यहाँ किसी को पवित्र या समर्पित स्थिति में लाना है। ‘ताकि ... न’ रोकथाम अथवा उद्देश्य का भाव व्यक्त करता है और नैतिक शुद्धि का अनावश्यक अर्थ नहीं जोड़ता।
- source_word: בְּבִגְדֵיהֶם
  choice: अपने वस्त्रों के द्वारा
  rationale: यहाँ ב साधन का बोध कराता है; ‘के द्वारा’ वस्त्रों को पवित्रता पहुँचने के माध्यम के रूप में रखता है, बिना उसकी प्रक्रिया को अधिक स्पष्ट किए।
theological_decisions:
- issue: अंतिम उपवाक्य में पवित्रता के संचार का अर्थ
  choice: पवित्र सेवकीय वस्त्रों के माध्यम से लोगों को पवित्र कर देने से रोकना
  alternative: इसे केवल अनुष्ठानिक शिष्टाचार मानना, जिसमें पवित्रता के वास्तविक संचार का कोई संकेत न हो
  rationale: पिएल יְקַדְּשׁוּ का सीधा कर्म ‘लोगों को’ है और בְּבִגְדֵיהֶם साधन बताता है। यहेजकेल के दर्शन में पवित्रता स्थानों और वस्तुओं से संबद्ध होकर नियंत्रित की जाती है; फिर भी हिंदी पाठ प्रक्रिया के स्वरूप को सिद्धांतात्मक ढंग से परिभाषित नहीं करता।
- issue: קדש के लिए हिंदी धार्मिक शब्दावली
  choice: पवित्र कर दें
  alternative: अभिषिक्त कर दें / संस्कारित कर दें / समर्पित कर दें
  rationale: ‘पवित्र करना’ मूल क्रिया का व्यापक और सहज अर्थ सुरक्षित रखता है तथा किसी विशेष संप्रदाय की पारिभाषिक धारणा नहीं थोपता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। मंदिर-संबंधी ‘आँगन’, ‘कोठरियाँ’, ‘सेवा’ और ‘पवित्र’ जैसे परिचित शब्द चुने गए हैं। इब्रानी की असामान्य पुनरावृत्ति को डैश के सहारे स्पष्ट रूप में सुरक्षित रखा गया है।
