source:
  edition: WLC
  text: וְ/אַלְמָנָה֙ וּ/גְרוּשָׁ֔ה לֹֽא יִקְח֥וּ לָ/הֶ֖ם לְ/נָשִׁ֑ים כִּ֣י אִם בְּתוּלֹ֗ת מִ/זֶּ֨רַע֙ בֵּ֣ית יִשְׂרָאֵ֔ל וְ/הָֽ/אַלְמָנָה֙ אֲשֶׁ֣ר תִּֽהְיֶ֣ה אַלְמָנָ֔ה מִ/כֹּהֵ֖ן יִקָּֽחוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/044/022.yaml
  text: They shall not take for themselves as wives a widow or a divorced woman[a], but only virgins from the offspring of the house of Israel; however, they may take a widow who is the widow of a priest.
translation:
  language: hi
  text: वे अपने लिए किसी विधवा या तलाकशुदा स्त्री को पत्नी न बनाएँ; वे केवल इस्राएल के घराने के वंश में से कुँवारियों को ही पत्नी बनाएँ। पर वे ऐसी विधवा को पत्नी बना सकते हैं, जो किसी याजक की विधवा हो।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या, अधिक शाब्दिक: “ऐसी विधवा जो किसी याजक से विधवा हुई हो।”'
    reason: मִכֹּהֵן में निहित मूल ‘याजक से’ अभिव्यक्ति को दिखाता है, जबकि मुख्य पाठ संदर्भानुकूल संबंध को स्वाभाविक हिन्दी में व्यक्त करता है।
lexical_decisions:
- source_word: אַלְמָנָה
  choice: विधवा
  rationale: यह शब्द उस स्त्री को दर्शाता है जिसका पति मर चुका हो; दोनों स्थानों पर मानक और स्पष्ट हिन्दी शब्द रखा गया है।
- source_word: גְרוּשָׁה
  choice: तलाकशुदा स्त्री
  rationale: निष्क्रिय कृदन्त उस स्त्री की वैवाहिक-कानूनी स्थिति बताता है जिसे तलाक दिया गया है। आधुनिक हिन्दी में यह संक्षिप्त और सहज है।
- source_word: יִקְחוּ ... לְנָשִׁים
  choice: अपनी पत्नी बनाएँ
  rationale: इब्रानी मुहावरे का शाब्दिक ढाँचा ‘अपने लिए पत्नियों के रूप में लेना’ है। ‘अपनी पत्नी बनाएँ’ कानूनी विधान का भाव रखते हुए स्वाभाविक हिन्दी देता है।
- source_word: כִּי אִם
  choice: बल्कि केवल ... ही
  rationale: यह प्रतिबंध के बाद अनुमत सीमित वर्ग को प्रस्तुत करता है; ‘केवल ... ही’ उस सीमा पर स्पष्ट बल देता है।
- source_word: בְּתוּלוֹת
  choice: कुँवारियाँ
  rationale: शब्द केवल अविवाहित युवतियों के बजाय विशेष रूप से कुँवारी स्त्रियों को सूचित करता है।
- source_word: מִזֶּרַע בֵּית יִשְׂרָאֵל
  choice: इस्राएल के घराने के वंश की
  rationale: זֶרַע के वंश/संतति-संबंधी अर्थ को स्वाभाविक हिन्दी में रखा गया है और ‘इस्राएल का घराना’ राष्ट्रीय-वाचा संबंधी अभिव्यक्ति को बनाए रखता है।
- source_word: וְהָאַלְמָנָה אֲשֶׁר תִּהְיֶה אַלְמָנָה מִכֹּהֵן
  choice: फिर भी वे ऐसी विधवा को पत्नी बना सकते हैं, जिसका पति याजक था
  rationale: यह एक अतिरिक्त अनुमत वर्ग बताता है। वाक्यांश का सामान्य संदर्भगत अर्थ ऐसी विधवा है जिसका मृत पति याजक था; हिन्दी में संबंध को स्पष्ट किया गया है, जबकि अधिक शाब्दिक रूप पादटिप्पणी में सुरक्षित है।
- source_word: מִן in מִכֹּהֵן
  choice: जिसका पति याजक था
  rationale: מִן का मूल भाव ‘से’ है, पर यहाँ यह उस याजक के साथ संबंध/स्रोत दर्शाता है जिसके कारण स्त्री विधवा हुई। हिन्दी में ‘जिसका पति याजक था’ सर्वाधिक स्पष्ट और स्वाभाविक है।
theological_decisions:
- issue: मन्दिर-दर्शन में विवाह संबंधी नियम का दायरा
  choice: पद को याजकों के लिए दिए गए विधान के रूप में प्रस्तुत करना, उसके आगे कोई बाद का सार्वभौमिक नैतिक या सिद्धान्तगत निष्कर्ष न जोड़ना
  alternative: इसे हर व्यक्ति और हर काल पर लागू होने वाला सार्वभौमिक विवाह-नियम मानना, अथवा प्रतिबंध को केवल सामान्य प्राथमिकता बनाकर नरम कर देना
  rationale: यह पद यहेजकेल के मन्दिर-दर्शन में याजकीय नियमों का भाग है। अनुवाद को प्रतिबंध और अपवाद दोनों स्पष्ट रखने चाहिए, पर उनके दायरे को न बढ़ाना चाहिए और न घटाना।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘तलाकशुदा’ वर्तमान प्रयोग में स्पष्ट है; ‘कुँवारियाँ’, ‘वंश’ और ‘याजक’ बाइबलीय-कानूनी संदर्भ की औपचारिकता बनाए रखते हैं।
