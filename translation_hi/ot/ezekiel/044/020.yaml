  yaml_path: translation/ot/ezekiel/044/020.yaml
  text: They shall not shave their heads[a], nor let their hair grow long; they shall surely trim the hair of their heads.
translation:
  language: hi
  text: वे अपने सिर न मुँड़ाएँ और न अपने बाल लंबे बढ़ने दें; वे अपने सिर के बाल अवश्य कतरें।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अंतिम वाक्यांश का अनुवाद यह भी हो सकता है: “वे अपने सिर के बाल अच्छी तरह कटे हुए रखें।” इब्रानी अभिव्यक्ति संक्षिप्त है और इसके कई निकटवर्ती अनुवाद संभव हैं।'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְגַלֵּחוּ
  choice: मुँड़ाएँ
  rationale: पिएल रूप सिर के बाल साफ़ कर देने या सिर मुँड़ाने को दर्शाता है। ‘सिर मुँड़ाना’ आधुनिक हिन्दी में स्वाभाविक और स्पष्ट है।
- source_word: פֶרַע
  choice: बाल लंबे
  rationale: यह शब्द खुले छोड़े गए, अनियंत्रित या बिना कटे बढ़े बालों की ओर संकेत करता है। याजकीय साज-सँवार के इस प्रसंग में ‘बाल लंबे बढ़ने देना’ इसका स्वाभाविक अर्थ व्यक्त करता है।
- source_word: יְשַׁלֵּחוּ
  choice: बढ़ने दें
  rationale: שלח का मूल भाव ‘छोड़ देना’ है; פֶרַע के साथ यहाँ आशय बालों को बिना रोके बढ़ने देने से है।
- source_word: כָּסוֹם יִכְסְמוּ
  choice: अवश्य कतरते रहें
  rationale: धातु बाल काटने या कतरने का भाव देती है, और क्रिया के साथ उसी धातु का क्रियार्थक रूप आने से बल उत्पन्न होता है। ‘अवश्य’ उस बल को रखता है, जबकि ‘कतरते रहें’ नियमित रूप से बाल सँवारे रखने का प्रसंगगत भाव देता है।
- source_word: רֹאשָׁם / רָאשֵׁיהֶם
  choice: अपने सिर / अपने सिर के बाल
  rationale: पहले खंड में ‘सिर’ हिन्दी में मुँड़ाने का स्वाभाविक कर्म है। अंतिम खंड में केवल ‘सिर कतरें’ भ्रामक होता, इसलिए वहाँ निहित आशय ‘सिर के बाल’ स्पष्ट किया गया है।
