language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: כֹּה אָמַר֮ אֲדֹנָ֣/י יְהוִה֒ כָּל בֶּן נֵכָ֗ר עֶ֤רֶל לֵב֙ וְ/עֶ֣רֶל בָּשָׂ֔ר לֹ֥א יָב֖וֹא אֶל מִקְדָּשִׁ֑/י לְ/כָל בֶּן נֵכָ֔ר אֲשֶׁ֕ר בְּ/ת֖וֹךְ בְּנֵ֥י יִשְׂרָאֵֽל־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/044/009.yaml
  text: 'Thus says the Lord GOD: No foreigner[a], uncircumcised in heart and uncircumcised in flesh, shall enter my sanctuary[b], of any foreigner who is among the sons of Israel.'
translation:
  language: hi
  text: 'प्रभु यहोवा यों कहते हैं: कोई भी परदेशी—जिसका हृदय खतनारहित और शरीर भी खतनारहित है—मेरे पवित्रस्थान में प्रवेश न करे—इस्राएलियों के बीच रहने वाले किसी भी परदेशी को नहीं।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כֹּה אָמַר
  choice: यों कहते हैं
  rationale: यह भविष्यद्वाणी का प्रामाणिक संदेश-सूत्र है; हिंदी में स्वाभाविक और गरिमापूर्ण रूप से मूल की औपचारिकता बनाए रखता है।
- source_word: אֲדֹנָי יְהוִה
  choice: प्रभु यहोवा
  rationale: उपाधि और परमेश्वर के व्यक्तिगत नाम, दोनों को अलग-अलग बनाए रखता है और अस्वाभाविक दोहराव से बचता है।
- source_word: כָּל בֶּן נֵכָר
  choice: कोई भी परदेशी
  rationale: शाब्दिक रूप ‘पराए देश का पुत्र’ एक इब्रानी मुहावरा है, जिसका स्वाभाविक हिंदी अर्थ ‘परदेशी’ है; नकार के साथ כָּל का व्यापक बल ‘कोई भी’ से व्यक्त होता है।
- source_word: עֶרֶל לֵב
  choice: जिसका हृदय खतनारहित
  rationale: भीतरी दशा के लिए प्रयुक्त मूल रूपक को बिना उसकी व्याख्या किए सुरक्षित रखता है।
- source_word: וְעֶרֶל בָּשָׂר
  choice: और शरीर भी खतनारहित
  rationale: हृदय के साथ समानांतरता और ठोस शारीरिक आशय दोनों बनाए रखता है; ‘भी’ दोनों शर्तों के संयुक्त होने को स्पष्ट करता है।
- source_word: לֹא יָבוֹא אֶל מִקְדָּשִׁי
  choice: मेरे पवित्रस्थान में प्रवेश न करे
  rationale: निषेधात्मक/विधिक बल और पवित्र परिसर का अर्थ स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: לְכָל בֶּן נֵכָר אֲשֶׁר בְּתוֹךְ בְּנֵי יִשְׂרָאֵל
  choice: अर्थात इस्राएलियों के बीच रहने वाला ऐसा कोई भी परदेशी नहीं
  rationale: अंतिम पदबंध को पहले निषेध की पुनरुक्ति और विशिष्टीकरण के रूप में प्रस्तुत करता है तथा בְּתוֹךְ का ‘बीच’ वाला भाव बनाए रखता है।
theological_decisions:
- issue: אֲדֹנָי יְהוִה में ईश्वरीय नाम का अनुवाद
  choice: प्रभु यहोवा
  alternative: परमेश्वर यहोवा; प्रभु परमेश्वर
  rationale: मूल में उपाधि אֲדֹנָי और नाम יהוה दोनों उपस्थित हैं। ‘प्रभु यहोवा’ इस भेद को सुरक्षित रखता है।
- issue: परदेशियों पर निषेध का दायरा
  choice: निषेध उस परदेशी को वर्णित करता है जिसका हृदय और शरीर दोनों खतनारहित हैं
  alternative: बिना किसी योग्यता के हर परदेशी पूर्णतः निषिद्ध है
  rationale: दोनों खतनारहित विशेषताएँ ‘परदेशी’ के साथ व्याकरणिक रूप से जुड़ी हैं। अनुवाद उन्हें हटाकर निषेध को व्यापक नहीं करता और न ही उनके धर्मवैज्ञानिक अर्थ को सीमित करता है।
- issue: ‘हृदय का खतनारहित’ रूपक
  choice: रूपक को ज्यों का त्यों बनाए रखना
  alternative: अवज्ञाकारी; अशुद्ध मन वाला
  rationale: व्याख्यात्मक विकल्प संभावित अर्थों में से एक को निश्चित कर देंगे; मूल की धर्मवैज्ञानिक गहनता और तनाव बनाए रखना उचित है।
translation_notes:
  register: आधुनिक मानक हिंदी, गरिमापूर्ण भविष्यद्वाणी शैली। ‘पवित्रस्थान’, ‘खतनारहित’ और ‘यहोवा’ जैसे बाइबलीय शब्द सामान्य पाठक के लिए पर्याप्त स्पष्ट हैं। अंतिम इब्रानी खंड की कुछ असहज पुनरुक्ति को अर्थ खोए बिना ‘अर्थात’ और ‘ऐसा’ से स्वाभाविक बनाया गया है।
