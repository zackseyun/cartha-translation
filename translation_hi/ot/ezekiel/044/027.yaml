  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וּ/בְ/יוֹם֩ בֹּא֨/וֹ אֶל הַ/קֹּ֜דֶשׁ אֶל הֶ/חָצֵ֤ר הַ/פְּנִימִית֙ לְ/שָׁרֵ֣ת בַּ/קֹּ֔דֶשׁ יַקְרִ֖יב חַטָּאת֑/וֹ נְאֻ֖ם אֲדֹנָ֥/י יְהוִֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/044/027.yaml
  text: And on the day he enters the sanctuary[a], into the inner court, to minister in the sanctuary, he shall present his sin offering, declares the Lord GOD.
translation:
  language: hi
  text: और जिस दिन वह पवित्रस्थान में, अर्थात् भीतरी आँगन में, पवित्रस्थान में सेवा करने के लिए प्रवेश करे, उस दिन वह अपनी पापबलि[a] चढ़ाएगा—प्रभु याहवे की यह वाणी है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अथवा, “अपनी शुद्धिकरण-बलि।” बलिदानी संदर्भों में इब्रानी חַטָּאת पाप से संबंधित अथवा शुद्धिकरण के लिए चढ़ाई जाने वाली बलि को सूचित कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְיוֹם בֹּאוֹ
  choice: और जिस दिन वह ... प्रवेश करे, उस दिन
  rationale: इन्फिनिटिव कंस्ट्रक्ट और सर्वनाम-प्रत्यय वाले इस कालवाचक वाक्यांश को स्वाभाविक हिन्दी के ‘जिस दिन...उस दिन’ ढाँचे में व्यक्त किया गया है; आरम्भिक ‘और’ पिछले नियमों से संबंध बनाए रखता है।
- source_word: אֶל־הַקֹּדֶשׁ
  choice: पवित्रस्थान में
  rationale: यहाँ קֹדֶשׁ अमूर्त पवित्रता नहीं, उपासना के पवित्र परिसर को सूचित करता है। ‘पवित्रस्थान’ इस अर्थ को बिना किसी विशिष्ट कक्ष को अनावश्यक रूप से निश्चित किए व्यक्त करता है।
- source_word: אֶל־הֶחָצֵר הַפְּנִימִית
  choice: अर्थात् भीतरी आँगन में
  rationale: दूसरा אֶל पहले गंतव्य को अधिक स्पष्ट करता है। ‘अर्थात्’ इस समानाधिकरण संबंध को हिन्दी में साफ करता है, जबकि ‘भीतरी आँगन’ स्थानगत अर्थ को बनाए रखता है।
- source_word: לְשָׁרֵת בַּקֹּדֶשׁ
  choice: पवित्रस्थान में सेवा करने के लिए
  rationale: שׁרת यहाँ याजकीय और उपासनात्मक सेवा का बोध देता है। ‘सेवा करना’ आधुनिक हिन्दी में सहज है और संदर्भ से उसका पवित्र कार्य वाला अर्थ स्पष्ट रहता है।
- source_word: יַקְרִיב
  choice: चढ़ाएगा
  rationale: קרב का हिफ़ील रूप बलिदानी संदर्भ में भेंट प्रस्तुत करने या चढ़ाने का अर्थ देता है। ‘चढ़ाएगा’ हिन्दी बाइबलीय और सामान्य धार्मिक प्रयोग में स्वाभाविक है।
- source_word: חַטָּאתוֹ
  choice: अपनी पापबलि
  rationale: יקריב के साथ חַטָּאת यहाँ पाप स्वयं नहीं, उससे संबंधित बलि को दर्शाता है। ‘पापबलि’ परिचित और संक्षिप्त पद है; शुद्धिकरण पर बल देने वाला वैकल्पिक अनुवाद पादटिप्पणी में रखा गया है।
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: प्रभु याहवे की यह वाणी है
  rationale: נְאֻם एक गंभीर ईश्वरीय घोषणा का सूत्र है। ‘की यह वाणी है’ उसकी औपचारिकता बनाए रखता है, और יְהוִה को व्यक्तिगत वाचा-नाम ‘याहवे’ के रूप में लिप्यंतरित किया गया है।
theological_decisions:
- issue: बलिदानी संदर्भ में חַטָּאת का अर्थ
  choice: पापबलि
  alternative: शुद्धिकरण-बलि
  rationale: शब्द पाप से संबंधित बलि को सूचित कर सकता है, जबकि अनुष्ठान के शुद्धिकरणकारी कार्य पर बल देने पर ‘शुद्धिकरण-बलि’ भी संभव है। मुख्य पाठ परिचित पद रखता है और वास्तविक अर्थगत विकल्प पादटिप्पणी में सुरक्षित है।
- issue: संयुक्त पद אֲדֹנָי יְהוִה में ईश्वरीय नाम
  choice: प्रभु याहवे
  alternative: प्रभु परमेश्वर
  rationale: मूल पाठ में אֲדֹנָי उपाधि और יְהוִה व्यक्तिगत ईश्वरीय नाम दोनों हैं। ‘प्रभु याहवे’ दोनों को अलग-अलग बनाए रखता है और नाम को सामान्य उपाधि में विलीन नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘पवित्रस्थान’ और ‘पापबलि’ जैसे स्थापित धार्मिक पदों का प्रयोग किया गया है, पर वाक्य-विन्यास को अत्यधिक पुरातन नहीं बनाया गया।
