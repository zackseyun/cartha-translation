source:
  edition: WLC
  text: וְ/הָיָ֗ה בְּ/בוֹאָ/ם֙ אֶֽל שַׁעֲרֵי֙ הֶ/חָצֵ֣ר הַ/פְּנִימִ֔ית בִּגְדֵ֥י פִשְׁתִּ֖ים יִלְבָּ֑שׁוּ וְ/לֹֽא יַעֲלֶ֤ה עֲלֵי/הֶם֙ צֶ֔מֶר בְּ/שָֽׁרְתָ֗/ם בְּ/שַׁעֲרֵ֛י הֶ/חָצֵ֥ר הַ/פְּנִימִ֖ית וָ/בָֽיְתָ/ה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/044/017.yaml
  text: And when they enter the gates of the inner court[a], they shall wear linen garments[b]; no wool shall come upon them while they minister in the gates of the inner court and in the house.
translation:
  language: hi
  text: जब वे भीतरी आँगन के फाटकों में प्रवेश करें, तब वे सन के वस्त्र पहनें; और जब वे भीतरी आँगन के फाटकों में और भवन[b] के भीतर सेवा करें, तब उनके ऊपर ऊन न हो[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अथवा, “वे ऊनी वस्त्र न पहनें।” इब्रानी में अधिक शाब्दिक रूप से है, “उनके ऊपर ऊन न चढ़े।”
    reason: lexical_alternative
  - marker: b
    text: यहाँ “भवन” से आशय मंदिर के मुख्य भवन से है।
    reason: cultural_note
lexical_decisions:
- source_word: וְהָיָה בְּבוֹאָם
  choice: जब वे…प्रवेश करें, तब
  rationale: वाव + पूर्ण क्रिया के बाद בְּ और धात्विक संज्ञा समय-सूचक परिस्थिति प्रस्तुत करते हैं। यह हिन्दी में स्वाभाविक ढंग से नियम की समय-सीमा व्यक्त करता है।
- source_word: שַׁעֲרֵי הֶחָצֵר הַפְּנִימִית
  choice: भीतरी आँगन के फाटक
  rationale: यह संबंधवाचक पदबंध भीतरी प्रांगण के प्रवेश-द्वारों को दर्शाता है; ‘आँगन’ और ‘फाटक’ सामान्य पाठक के लिए स्पष्ट तथा मंदिर-संदर्भ में उपयुक्त हैं।
- source_word: בִּגְדֵי פִשְׁתִּים
  choice: सन के वस्त्र
  rationale: פִשְׁתִּים सन से बने लिनन को दर्शाता है। ‘सन के वस्त्र’ सामग्री की शर्त को स्पष्ट रखते हुए प्रचलित हिन्दी प्रयोग है।
- source_word: יִלְבָּשׁוּ
  choice: पहनें
  rationale: לבשׁ का अर्थ पहनना या धारण करना है। यहाँ यह सेवा के समय निर्धारित वेशभूषा का नियम है।
- source_word: וְלֹא יַעֲלֶה עֲלֵיהֶם צֶמֶר
  choice: उनके ऊपर ऊन न हो
  rationale: इब्रानी में शाब्दिक चित्र ‘ऊन उनके ऊपर न चढ़े’ है। चुना हुआ रूप उस असामान्य चित्र को समझने योग्य बनाता है और स्रोत में निहित न होने वाले ‘वस्त्र’ जैसे कर्म को नहीं जोड़ता।
- source_word: בְּשָׁרְתָם
  choice: जब वे…सेवा करें
  rationale: यह रूप याजकीय सेवा के समय को बताता है। ‘सेवा करें’ आधुनिक हिन्दी में स्वाभाविक है और मंदिर-संबंधी संदर्भ से इसका पवित्र सेवाकार्य स्पष्ट रहता है।
- source_word: וָבָיְתָה
  choice: भवन के भीतर
  rationale: दिशा/स्थान-सूचक रूप मंदिर-भवन के अंदर की ओर या उसके भीतर सेवा का संकेत देता है। ‘भीतर’ भीतरी आँगन के फाटकों से स्थानिक भेद स्पष्ट करता है।
theological_decisions:
- issue: याजकीय सेवाकार्य के लिए शब्दावली
  choice: सेवा करें
  alternative: परिचर्या करें
  rationale: ‘सेवा करें’ सामान्य आधुनिक हिन्दी में स्पष्ट है और प्रसंग से इसका याजकीय स्वरूप बना रहता है; ‘परिचर्या’ अपेक्षाकृत कृत्रिम या विशिष्ट अर्थ वाला लग सकता है।
- issue: ‘भवन’ का संदर्भ
  choice: भवन के भीतर
  alternative: मंदिर के भीतर
  rationale: इब्रानी בַּיִת का सामान्य रूप ‘घर/भवन’ है, पर यहाँ वह मंदिर-भवन को सूचित करता है। मुख्य पाठ में ‘भवन’ स्रोत की अभिव्यक्ति बचाता है और पादटिप्पणी संदर्भ स्पष्ट करती है।
- issue: ऊन-संबंधी निषेध की अभिव्यक्ति
  choice: उनके ऊपर ऊन न हो
  alternative: वे ऊनी वस्त्र न पहनें
  rationale: चुना हुआ पाठ इब्रानी की अस्पष्ट और चित्रात्मक अभिव्यक्ति को अधिक निकटता से सुरक्षित रखता है; विकल्प उसका व्यावहारिक आशय स्पष्ट करता है, पर ‘वस्त्र’ शब्द स्रोत में प्रत्यक्ष नहीं है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘सन के वस्त्र’, ‘भीतरी आँगन’ और ‘भवन’ मंदिर-दर्शन की ठोस स्थानिक तथा सामग्री-संबंधी शब्दावली को सुरक्षित रखते हैं। पादटिप्पणी-चिह्न अर्थ से संबंधित पदों पर रखे गए हैं।
