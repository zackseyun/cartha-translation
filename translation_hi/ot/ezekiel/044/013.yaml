base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/044/013.yaml
  text: They shall not come near to me to serve as priests for me[a], nor to come near any of my holy things, the most holy things; but they shall bear their shame and the abominations that they have done.
translation:
  language: hi
  text: वे मेरे निकट मेरे लिए याजक की सेवा करने न आएँगे, और मेरी किसी भी पवित्र वस्तु, अर्थात् परमपवित्र वस्तुओं, के निकट न आएँगे।[a] परन्तु वे अपनी लज्जा और अपने किए हुए घृणित कामों का भार उठाएँगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “परमपवित्र स्थान के निकट।” इब्रानी पदबंध का अर्थ ‘परमपवित्र वस्तुएँ’ अथवा मन्दिर का भीतरी परमपवित्र स्थान—दोनों हो सकता है; यहाँ प्रसंग पहले अर्थ के अधिक अनुकूल है।
    reason: alternative_reading
lexical_decisions:
- source_word: יִגְּשׁוּ אֵלַי
  choice: मेरे निकट आकर
  rationale: नגשׁ यहाँ पवित्र सेवा के संदर्भ में परमेश्वर की पवित्र उपस्थिति के निकट आने को व्यक्त करता है; यह अनुवाद उस उपासना-संबंधी अर्थ को बनाए रखता है।
- source_word: לְכַהֵן לִי
  choice: मेरे लिए याजक का काम न करेंगे
  rationale: כהן का क्रियात्मक रूप याजक के पद में कार्य या सेवा करने को दर्शाता है; यह आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: וְלָגֶשֶׁת
  choice: न ... निकट आएँगे
  rationale: मूल पाठ में नגשׁ की पुनरावृत्ति है; ‘निकट’ को दोहराकर निषेध के पवित्र-सेवा संबंधी बल को सुरक्षित रखा गया है।
- source_word: עַל כָּל קָדָשַׁי
  choice: मेरी किसी पवित्र वस्तु के
  rationale: बहुवचन संज्ञा קָדָשַׁי समर्पित पवित्र वस्तुओं अथवा अर्पणों की ओर संकेत करती है; כָּל के साथ ‘किसी’ उपयुक्त वितरणात्मक अर्थ देता है।
- source_word: אֶל קָדְשֵׁי הַקְּדָשִׁים
  choice: अर्थात परमपवित्र वस्तुओं के
  rationale: यह पदबंध श्रेष्ठतम पवित्रता वाली वस्तुओं को सूचित कर सकता है। पूर्ववर्ती ‘पवित्र वस्तु’ के संदर्भ में वस्तुगत अर्थ अधिक संभावित है; ‘अर्थात’ इसे उसी श्रेणी की विशेष व्याख्या के रूप में स्पष्ट करता है।
- source_word: וְנָשְׂאוּ כְּלִמָּתָם
  choice: वे अपनी लज्जा ... का भार उठाएँगे
  rationale: נשא के साथ लज्जा दुष्कर्म के बोझ या परिणाम को सहने का भाव रखती है; ‘भार उठाएँगे’ मूल रूपक को बनाए रखता है।
- source_word: וְתוֹעֲבוֹתָם אֲשֶׁר עָשׂוּ
  choice: अपने किए हुए घृणित कामों का
  rationale: תועבות अत्यंत निंदनीय और परमेश्वर को घृणित कार्यों का प्रबल भविष्यद्वक्ताई शब्द है; ‘घृणित काम’ आधुनिक हिन्दी में इसका नैतिक बल स्पष्ट करता है, जबकि עָשׂוּ का तटस्थ ‘किए हुए’ सुरक्षित रहता है।
theological_decisions:
- issue: קָדְשֵׁי הַקְּדָשִׁים का संदर्भ
  choice: 'वस्तुगत अर्थ: ‘परमपवित्र वस्तुएँ’'
  alternative: 'स्थानगत अर्थ: ‘परमपवित्र स्थान’'
  rationale: तत्काल पूर्ववर्ती वाक्यांश ‘मेरी किसी पवित्र वस्तु’ होने के कारण यहाँ पवित्र वस्तुओं या अर्पणों तक पहुँच का निषेध अधिक संभावित है। फिर भी इब्रानी पदबंध स्थान का अर्थ भी दे सकता है, इसलिए वैकल्पिक अर्थ पादटिप्पणी में रखा गया है।
- issue: लज्जा और घृणित कामों को ‘उठाना’
  choice: मूल भार-वहन रूपक को बनाए रखना
  alternative: ‘उनके परिणाम भोगना’ कहकर अर्थ स्पष्ट करना
  rationale: शाब्दिक रूपक लज्जा, दोष और परिणाम के बीच जानबूझकर छोड़े गए संबंध को सुरक्षित रखता है और अर्थ को केवल दंड तक सीमित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, स्पष्ट और सामान्य पाठकों के लिए बोधगम्य रूप अपनाया गया है। ‘याजक’, ‘पवित्र’ और ‘परमपवित्र’ जैसे स्थापित बाइबलीय शब्द बनाए गए हैं; वाक्य-विन्यास को हिन्दी में स्वाभाविक करते हुए मूल निषेध, पुनरावृत्ति और भार-वहन के रूपक को सुरक्षित रखा गया है।
