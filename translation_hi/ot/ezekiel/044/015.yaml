source:
  edition: WLC
  text: וְ/הַ/כֹּהֲנִ֨ים הַ/לְוִיִּ֜ם בְּנֵ֣י צָד֗וֹק אֲשֶׁ֨ר שָׁמְר֜וּ אֶת מִשְׁמֶ֤רֶת מִקְדָּשִׁ/י֙ בִּ/תְע֤וֹת בְּנֵֽי יִשְׂרָאֵל֙ מֵֽ/עָלַ֔/י הֵ֛מָּה יִקְרְב֥וּ אֵלַ֖/י לְ/שָֽׁרְתֵ֑/נִי וְ/עָמְד֣וּ לְ/פָנַ֗/י לְ/הַקְרִ֥יב לִ/י֙ חֵ֣לֶב וָ/דָ֔ם נְאֻ֖ם אֲדֹנָ֥/י יְהוִֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/044/015.yaml
  text: But the Levitical priests[a], the sons of Zadok, who kept the charge of my sanctuary when the sons of Israel went astray from me—they shall come near to me to minister to me, and they shall stand before me to offer to me fat and blood[c][b], declares the Lord GOD.
translation:
  language: hi
  text: परन्तु लेवीय याजक[a], अर्थात् सादोक के वंशज, जिन्होंने मेरे पवित्रस्थान की सेवा-संबंधी जिम्मेदारी निभाई, जब इस्राएल के लोग मुझसे भटक गए थे—वे ही मेरी सेवा करने के लिए मेरे निकट आएँगे। वे मेरे सामने खड़े होकर मुझे चर्बी और रक्त अर्पित करेंगे—प्रभु याहवे की यह घोषणा है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “याजक, लेवी।” इब्रानी पदबंध को समानाधिकरण में भी समझा जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַכֹּהֲנִים הַלְוִיִּם
  choice: परन्तु लेवीय याजक
  rationale: पूर्ववर्ती प्रसंग से विरोध दिखाने के लिए וְ का अनुवाद ‘परन्तु’ किया गया है। ‘लेवीय याजक’ सहज हिन्दी है; इब्रानी की समानाधिकरण वाली सम्भावना पादटिप्पणी में सुरक्षित है।
- source_word: בְּנֵי צָדוֹק
  choice: सादोक के वंशज
  rationale: यहाँ בְּנֵי वंशगत याजकीय कुल को सूचित करता है; आधुनिक हिन्दी में ‘वंशज’ अधिक स्वाभाविक और आशय की दृष्टि से सटीक है।
- source_word: שָׁמְרוּ אֶת מִשְׁמֶרֶת מִקְדָּשִׁי
  choice: मेरे पवित्रस्थान की सेवा का दायित्व निभाया
  rationale: מִשְׁמֶרֶת केवल पहरा नहीं, सौंपे गए धार्मिक कर्तव्य को दर्शाता है। यह वाक्यांश उस याजकीय दायित्व को स्पष्ट रखता है।
- source_word: בִּתְעוֹת בְּנֵי יִשְׂרָאֵל מֵעָלַי
  choice: जब इस्राएल के लोग मुझसे भटक गए थे
  rationale: בְּ + infinitive परिस्थिति अथवा समय बताता है। ‘भटक गए’ नैतिक और धार्मिक विमुखता को स्वाभाविक हिन्दी में व्यक्त करता है; בְּנֵי יִשְׂרָאֵל यहाँ सामूहिक अर्थ में है।
- source_word: הֵמָּה יִקְרְבוּ אֵלַי
  choice: वे ही ... मेरे निकट आएँगे
  rationale: स्वतंत्र सर्वनाम הֵמָּה का बल ‘वे ही’ से व्यक्त किया गया है, और יִקְרְבוּ की याजकीय निकटता ‘मेरे निकट आएँगे’ में सुरक्षित है।
- source_word: לְשָׁרְתֵנִי
  choice: मेरी सेवा करने के लिए
  rationale: שׁרת यहाँ पवित्र याजकीय सेवा को सूचित करता है। हिन्दी में ‘सेवा करना’ गरिमापूर्ण, स्पष्ट और स्वाभाविक है।
- source_word: וְעָמְדוּ לְפָנַי
  choice: वे मेरे सामने खड़े होकर
  rationale: यह अनुवाद परमेश्वर की उपस्थिति में याजकीय परिचर्या की मुद्रा को निकटता से व्यक्त करता है।
- source_word: לְהַקְרִיב לִי חֵלֶב וָדָם
  choice: मुझे चर्बी और रक्त अर्पित करेंगे
  rationale: הקריב बलिदान-सन्दर्भ में अर्पण करना है। ‘चर्बी और रक्त’ बलिदान के विशिष्ट अंशों को बिना व्याख्यात्मक विस्तार के बनाए रखता है।
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: प्रभु याहवे की यह घोषणा है
  rationale: נְאֻם को भविष्यद्वाणी की घोषणात्मक रीति के रूप में व्यक्त किया गया है। אֲדֹנָי को ‘प्रभु’ और יהוה को व्यक्तिगत वाचा-नाम ‘याहवे’ रखा गया है, जिससे दोनों पद अलग बने रहते हैं।
theological_decisions:
- issue: अयोग्य लेवियों के विपरीत सादोकवंशी याजकों का विशेषाधिकार
  choice: ‘वे ही’ मेरी सेवा के लिए निकट आएँगे
  alternative: सामान्य ‘वे’ मेरी सेवा के लिए निकट आएँगे
  rationale: इब्रानी הֵמָּה बलयुक्त है और प्रसंग में इस समूह को पहले उल्लिखित अविश्वासी लेवियों से अलग करता है; अनुवाद इस बल को बनाए रखता है, पर उससे आगे कोई सांप्रदायिक निष्कर्ष नहीं निकालता।
- issue: אֲדֹנָי יְהוִה में परमेश्वर के नाम का निरूपण
  choice: प्रभु याहवे
  alternative: प्रभु परमेश्वर
  rationale: मूल में उपाधि אֲדֹנָי और वाचा-नाम יהוה दोनों उपस्थित हैं। ‘प्रभु याहवे’ इस भेद को सुरक्षित रखता है और दो समानार्थी ‘प्रभु’ रूपों से बचता है।
- issue: חֵלֶב וָדָם का बलिदानी अर्थ
  choice: चर्बी और रक्त
  alternative: उत्तम भाग और रक्त
  rationale: מֵלֶב नहीं बल्कि חֵלֶב पशु की बलिदानी चर्बी को दर्शाता है। इसे रूपक या सामान्यीकृत ‘उत्तम भाग’ में बदलना मूल की उपासना-संबंधी ठोस भाषा को कम कर देता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सार्वजनिक पाठ के योग्य शैली अपनाई गई है। ‘पवित्रस्थान’, ‘याजक’, ‘अर्पित’ और ‘घोषणा’ जैसे स्थापित बाइबलीय शब्द रखे गए हैं, जबकि कठिन शाब्दिक मुहावरों को स्वाभाविक हिन्दी में व्यक्त किया गया है।
