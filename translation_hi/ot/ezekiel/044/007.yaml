source:
  edition: WLC
  text: בַּ/הֲבִיאֲ/כֶ֣ם בְּנֵֽי נֵכָ֗ר עַרְלֵי לֵב֙ וְ/עַרְלֵ֣י בָשָׂ֔ר לִ/הְי֥וֹת בְּ/מִקְדָּשִׁ֖/י לְ/חַלְּל֣/וֹ אֶת בֵּיתִ֑/י בְּ/הַקְרִֽיבְ/כֶ֤ם אֶת לַחְמִ/י֙ חֵ֣לֶב וָ/דָ֔ם וַ/יָּפֵ֨רוּ֙ אֶת בְּרִיתִ֔/י אֶ֖ל כָּל תּוֹעֲבוֹתֵי/כֶֽם־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/044/007.yaml
  text: when you brought in foreigners[a], uncircumcised in heart and uncircumcised in flesh, to be in my sanctuary, to profane it—my house—when you presented my food, the fat and the blood, and they broke my covenant[c][b], along with all your abominations.
translation:
  language: hi
  text: जब तुम परदेशियों[a] को—जो हृदय से खतनारहित और शरीर से खतनारहित थे—मेरे पवित्रस्थान में रहने और उसे—मेरे भवन को—अपवित्र करने के लिए ले आए, और जब तुमने मेरा भोजन[b], चरबी और लहू, चढ़ाया, तब उन्होंने मेरी वाचा तोड़ दी[c], तुम्हारे सब घिनौने कामों के साथ-साथ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, ‘परदेश के पुत्र’ या ‘परदेशी पुत्र’।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में, ‘मेरी रोटी’; बलिदान के संदर्भ में इसका अर्थ परमेश्वर को चढ़ाया जाने वाला भोजन है।
    reason: lexical_alternative
  - marker: c
    text: 'इब्रानी में यहाँ तीसरे पुरुष बहुवचन है: ‘उन्होंने मेरी वाचा तोड़ दी।’ इसका संकेत संभवतः अभी उल्लिखित परदेशियों की ओर है; कुछ लोग इसे व्यापक रूप से ‘तुम’ के विरुद्ध चल रहे आरोप का भाग समझते हैं।'
    reason: alternative_reading
lexical_decisions:
- source_word: בַּהֲבִיאֲכֶם
  choice: जब तुम ... ले आए
  rationale: ב + infinitive construct और 2mp प्रत्यय का प्रयोग कालवाचक है; हिफ़ील रूप का कारक भाव ‘ले आए’ से व्यक्त होता है।
- source_word: בְּנֵי נֵכָר
  choice: परदेशियों
  rationale: शाब्दिक अर्थ ‘परदेश के पुत्र’ है, पर आधुनिक हिन्दी में ‘परदेशी’ स्वाभाविक रूप से बाहरी लोगों का अर्थ देता है; शाब्दिक विकल्प पादटिप्पणी में रखा गया है।
- source_word: עַרְלֵי לֵב
  choice: मन से खतनारहित
  rationale: हृदय की भीतरी अविश्वासयोग्यता अथवा अशुद्धता का वाचक वाचा-संबंधी रूपक बनाए रखा गया है; ‘मन’ आधुनिक हिन्दी में यहाँ अधिक सहज है।
- source_word: וְעַרְלֵי בָשָׂר
  choice: शरीर से खतनारहित
  rationale: यह वास्तविक शारीरिक खतनारहित अवस्था बताता है और पहले पदबंध के समानांतर रूप को सुरक्षित रखता है।
- source_word: לִהְיוֹת בְּמִקְדָּשִׁי
  choice: मेरे पवित्रस्थान में रहने के लिए
  rationale: इब्रानी में ‘होने/रहने’ पर बल है, केवल प्रवेश करने पर नहीं; इसलिए उनकी पवित्रस्थान में उपस्थिति को स्पष्ट रखा गया है।
- source_word: לְחַלְּלוֹ אֶת בֵּיתִי
  choice: उसे, मेरे भवन को, अपवित्र किया
  rationale: सर्वनाम प्रत्यय और उसके बाद आने वाले ‘मेरे भवन’ को समानाधिकरण के रूप में सुरक्षित रखा गया है। חלל का पिएल यहाँ पवित्र वस्तु को अपवित्र करने का अर्थ देता है।
- source_word: בְּהַקְרִיבְכֶם
  choice: जब तुमने ... चढ़ाया
  rationale: बलिदान-संबंधी संदर्भ में קרב हिफ़ील का स्वाभाविक हिन्दी अर्थ ‘चढ़ाना’ है।
- source_word: לַחְמִי
  choice: मेरा भोजन
  rationale: शाब्दिक अर्थ ‘मेरी रोटी’ है, किंतु बलिदानी संदर्भ में यह परमेश्वर को अर्पित भोजन का व्यापक संकेत है; शाब्दिक रूप पादटिप्पणी में दिया गया है।
- source_word: חֵלֶב וָדָם
  choice: चरबी और लहू
  rationale: बलिदान के विशिष्ट अंशों के पारंपरिक और स्पष्ट हिन्दी नाम रखे गए हैं।
- source_word: וַיָּפֵרוּ אֶת בְּרִיתִי
  choice: तब उन्होंने मेरी वाचा तोड़ दी
  rationale: क्रिया तीसरे पुरुष बहुवचन में है; निकटतम संभावित कर्ता अभी उल्लिखित परदेशी हैं। הפר ברית का स्वाभाविक अर्थ ‘वाचा तोड़ना’ है।
- source_word: אֶל כָּל תּוֹעֲבוֹתֵיכֶם
  choice: और यह तुम्हारे सब घिनौने कामों के साथ हुआ
  rationale: אֶל का यहाँ संलग्नता/अतिरिक्तता का भाव है। हिन्दी वाक्य में इसे स्वाभाविक बनाते हुए आरोपों के संबंध को बनाए रखा गया है।
theological_decisions:
- issue: לְחַלְּלוֹ के प्रत्यय और אֶת בֵּיתִי का संबंध
  choice: ‘उसे, मेरे भवन को’—‘मेरे भवन’ को उसी पवित्रस्थान का समानाधिकरण माना गया है।
  alternative: सीधे ‘मेरे भवन को अपवित्र किया’ कहना, अथवा प्रत्यय को आगे आने वाले ‘मेरे भवन’ की ओर संकेत मानना।
  rationale: निकटतम पूर्वपद ‘मेरे पवित्रस्थान’ है, जबकि ‘मेरे भवन’ उसी पवित्र स्थल को बलपूर्वक फिर से नाम देता है। अनुवाद इब्रानी की प्रत्यय-सहित संरचना को मिटाता नहीं।
- issue: וַיָּפֵרוּ का कर्ता
  choice: ‘उन्होंने’ का निकटतम संदर्भ परदेशी हैं।
  alternative: आरोप को सामान्य रूप से ‘तुम’ के विरुद्ध जारी मानना।
  rationale: इब्रानी क्रिया तीसरे पुरुष बहुवचन में बदलती है, इसलिए परदेशी सबसे निकट और व्याकरणतः स्वाभाविक कर्ता हैं; फिर भी पादटिप्पणी दूसरे संभावित संबंध को दर्ज करती है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सार्वजनिक पाठ के अनुकूल रूप अपनाया गया है। ‘पवित्रस्थान’, ‘वाचा’, ‘चरबी’ और ‘लहू’ जैसे बाइबिलीय शब्द संदर्भ की धार्मिक-सांस्कृतिक विशिष्टता बनाए रखते हैं। वाक्य की जटिल इब्रानी संरचना को अर्धविराम, समानाधिकरण और ‘तब’ से पठनीय बनाया गया है, बिना कर्ता-परिवर्तन या प्रत्यय-संबंध मिटाए।
