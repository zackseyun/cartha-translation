  text: וְ/יַ֥יִן לֹֽא יִשְׁתּ֖וּ כָּל כֹּהֵ֑ן בְּ/בוֹאָ֖/ם אֶל הֶ/חָצֵ֥ר הַ/פְּנִימִֽית־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/044/021.yaml
  text: No priest shall drink wine when entering the inner court[a].
translation:
  language: hi
  text: भीतरी आँगन में प्रवेश करते समय कोई भी याजक दाखमधु न पिए।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/יַיִן
  choice: दाखमधु
  rationale: יַיִן सामान्यतः अंगूर से बने मदिरा-पेय को दर्शाता है। मंदिर-विधि के गरिमापूर्ण संदर्भ में ‘दाखमधु’ सटीक और स्वाभाविक है; आरंभिक וְ को हिन्दी में अलग से व्यक्त करना आवश्यक नहीं।
- source_word: לֹא יִשְׁתּוּ
  choice: न पिए
  rationale: निषेध के साथ अपूर्ण क्रिया इस विधिक संदर्भ में स्पष्ट मनाही व्यक्त करती है; हिन्दी में ‘न पिए’ इसका स्वाभाविक विधानात्मक रूप है।
- source_word: כָּל כֹּהֵן
  choice: कोई भी याजक
  rationale: शाब्दिक संरचना ‘हर याजक ... नहीं’ है, पर निषेध के सार्वभौमिक विस्तार को हिन्दी में ‘कोई भी याजक ... न’ अधिक स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: בְּ/בוֹאָם אֶל
  choice: प्रवेश करते समय
  rationale: בְּ के साथ क्रियार्थक संज्ञा और बहुवचन प्रत्यय का अर्थ ‘उनके प्रवेश करने पर/जब वे प्रवेश करें’ है। सामूहिक ‘याजक’ को हिन्दी में एकवचन निषेध के रूप में रखते हुए ‘प्रवेश करते समय’ संख्या-सामंजस्य की कठिनाई से बचाता है।
- source_word: הֶ/חָצֵר הַ/פְּנִימִית
  choice: भीतरी आँगन
  rationale: חָצֵר मंदिर-परिसर के आँगन को दर्शाता है और הַפְּנִימִית उसे भीतरी आँगन के रूप में निर्दिष्ट करता है।
