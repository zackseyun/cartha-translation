source:
  edition: WLC
  text: וְ/נָתַתִּ֣י אוֹתָ֔/ם שֹׁמְרֵ֖י מִשְׁמֶ֣רֶת הַ/בָּ֑יִת לְ/כֹל֙ עֲבֹ֣דָת֔/וֹ וּ/לְ/כֹ֛ל אֲשֶׁ֥ר יֵעָשֶׂ֖ה בּֽ/וֹ׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/044/014.yaml
  text: Yet I will appoint them to keep charge of the house[a], for all its service and for all that is done in it.
translation:
  language: hi
  text: फिर भी मैं उन्हें भवन[a] की देखरेख का दायित्व सौंपूँगा—उसकी सारी सेवा के लिए और उसमें किए जाने वाले हर काम के लिए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘मंदिर’। हिब्रू में ‘घर’, जो मंदिर के लिए प्रचलित पद है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתִּי
  choice: फिर भी मैं ... दायित्व सौंपूँगा
  rationale: נתן का मूल अर्थ ‘देना/ठहराना’ है, पर भूमिका सौंपने के इस प्रशासनिक संदर्भ में ‘दायित्व सौंपना’ स्वाभाविक है। וְ को पिछले पद के दंड के बाद संदर्भगत विरोध के कारण ‘फिर भी’ कहा गया है।
- source_word: אוֹתָם
  choice: उन्हें
  rationale: यह सीधा कर्मवाचक सर्वनाम निकटवर्ती संदर्भ में वर्णित लेवियों की ओर संकेत करता है।
- source_word: שֹׁמְרֵי מִשְׁמֶרֶת
  choice: देखरेख का दायित्व
  rationale: कृदंत और उसी धातु से बने संज्ञा-पद का यह मेल सौंपी गई सुरक्षा, निगरानी और जिम्मेदारी व्यक्त करता है। यह हिन्दी में अर्थ को स्वाभाविक रूप से रखता है।
- source_word: הַבָּיִת
  choice: भवन
  rationale: בַּיִת का शाब्दिक अर्थ ‘घर/भवन’ है और यहाँ यह दर्शन में दिखाए गए मंदिर को सूचित करता है। ‘भवन’ मूल रूपक को बचाते हुए गरिमापूर्ण और सहज है; पादटिप्पणी मंदिर-संदर्भ स्पष्ट करती है।
- source_word: לְכֹל עֲבֹדָתוֹ
  choice: उसकी सारी सेवा के लिए
  rationale: עֲבֹדָה काम, सेवा अथवा उपासना-संबंधी सेवा को सूचित कर सकता है। ‘सेवा’ व्यावहारिक और धार्मिक दोनों पहलुओं को बिना अनावश्यक संकीर्णता के समेटती है।
- source_word: וּלְכֹל אֲשֶׁר יֵעָשֶׂה בוֹ
  choice: और उसमें किए जाने वाले हर काम के लिए
  rationale: निष्क्रिय अपूर्ण क्रिया उस भवन में किए जाने वाले समस्त कार्य को व्यापक रूप से व्यक्त करती है। यह हिन्दी रूप उस व्यापकता और निष्क्रिय भाव को बनाए रखता है।
theological_decisions:
- issue: ‘भवन’ का संदर्भ
  choice: परमेश्वर का मंदिर, पर मुख्य पाठ में स्रोत के ‘घर/भवन’ रूपक को बनाए रखा गया
  alternative: मुख्य पाठ में सीधे ‘मंदिर’
  rationale: संदर्भ यहेजकेल के दर्शन वाले मंदिर और उसमें लेवियों के कर्तव्यों का है। ‘भवन’ हिब्रू अभिव्यक्ति को सुरक्षित रखता है, जबकि पादटिप्पणी उसके आशय को स्पष्ट करती है और किसी अतिरिक्त धर्मवैज्ञानिक निष्कर्ष को आरोपित नहीं करती।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण और सहज शैली। ‘देखरेख का दायित्व सौंपूँगा’ हिब्रू पदबंध के प्रशासनिक और संरक्षक भाव को स्वाभाविक हिन्दी में व्यक्त करता है; ‘भवन’ के साथ पादटिप्पणी मूल शब्द और मंदिर-संदर्भ दोनों को सुरक्षित रखती है।
