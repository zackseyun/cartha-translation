  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יָּ֣שֶׁב אֹתִ֗/י דֶּ֣רֶךְ שַׁ֤עַר הַ/מִּקְדָּשׁ֙ הַֽ/חִיצ֔וֹן הַ/פֹּנֶ֖ה קָדִ֑ים וְ/ה֖וּא סָגֽוּר׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/044/001.yaml
  text: Then he brought me back by way of the outer gate of the sanctuary[a], the one facing east, and it was shut.
translation:
  language: hi
  text: फिर वह मुझे पवित्रस्थान के उस बाहरी फाटक के मार्ग से वापस ले आया, जिसका मुख पूर्व की ओर था; और वह बंद था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּשֶׁב אֹתִי
  choice: वह मुझे ... वापस ले आया
  rationale: שׁוב का हिफ़ील रूप किसी को लौटाने या वापस ले आने का कारक भाव देता है। यह हिन्दी में स्वाभाविक है और केवल स्वयं लौटने का अर्थ नहीं देता।
- source_word: דֶּרֶךְ
  choice: के मार्ग से
  rationale: यहाँ דֶּרֶךְ उस रास्ते को बताता है जिससे यहेजकेल को वापस लाया गया; इससे यह अनावश्यक दावा नहीं होता कि वह बंद फाटक के भीतर से गुज़रा।
- source_word: שַׁעַר
  choice: फाटक
  rationale: मंदिर-परिसर की वास्तुकला के संदर्भ में 'फाटक' सामान्य और स्पष्ट हिन्दी पर्याय है।
- source_word: הַמִּקְדָּשׁ
  choice: पवित्रस्थान
  rationale: מִקְדָּשׁ पवित्र मंदिर-परिसर को सूचित करता है। 'पवित्रस्थान' उसके पवित्र स्वरूप को बनाए रखता है और इसे केवल भीतरी कक्ष तक सीमित नहीं करता।
- source_word: הַחִיצוֹן
  choice: बाहरी
  rationale: यह विशेषण इस फाटक को दर्शन में वर्णित भीतरी फाटकों से अलग करता है।
- source_word: הַפֹּנֶה קָדִים
  choice: जिसका मुख पूर्व की ओर था
  rationale: कृदंत और दिशा-संज्ञा फाटक की पूर्वाभिमुख स्थिति बताते हैं; यह हिन्दी में स्वाभाविक वास्तु-वर्णन है।
- source_word: וְהוּא סָגוּר
  choice: और वह बंद था
  rationale: סָגוּר फाटक की बंद अवस्था बताता है। וְ को बिना अनावश्यक विरोधात्मक अर्थ जोड़े 'और' कहा गया है।
theological_decisions: []
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण और सहज शैली रखी गई है। वाक्य ने इब्रानी की क्रमिक कथन-शैली, कारक क्रिया और फाटक की दिशा तथा बंद अवस्था को स्पष्ट रूप से सुरक्षित रखा है।
