review_pass:
  verdict: revise
  source_fidelity: Draft reverses the Hebrew construction by making ‘bird or animal’ possess the two food categories (‘की लोथ या...’), whereas the source prohibits the priests from eating either category of animal, whether from birds or livestock. ‘लोथ’ is also not idiomatic for this dietary/legal context.
  naturalness: The proposed revision is clear, modern Hindi and maintains an appropriately formal legislative register. It avoids the awkward expression ‘पक्षी या पशु की लोथ’ and the overly flesh-specific ‘फाड़ा गया मांस.’
  terminology: ‘याजक’ suitably renders ‘the priests.’ ‘पालतू पशु’ communicates the livestock sense of בְּהֵמָה in contrast with birds. ‘मरा हुआ’ and ‘जंगली पशु द्वारा फाड़ा गया’ preserve the two prohibited categories without treating the latter as merely meat.
  issues:
  - severity: medium
    issue: The scope of ‘पक्षी या पशु’ is syntactically misplaced.
    rationale: 'מִן־הָעוֹף וּמִן־הַבְּהֵמָה qualifies both נְבֵלָה and טְרֵפָה: the prohibited animal may be from birds or livestock. The draft’s genitive wording instead reads as ‘the carcass or torn flesh of a bird or animal.’'
  - severity: medium
    issue: ‘फाड़ा गया मांस’ narrows the second noun to flesh.
    rationale: טְרֵפָה denotes an animal torn by a predator, not specifically a portion of meat. Rendering it as a torn animal better retains the source category.
  - severity: low
    issue: ‘लोथ’ is marked and less natural in modern dietary/legal Hindi.
    rationale: ‘मरा हुआ प्राणी’ is clearer while preserving the basic carcass/dead-animal sense; the footnote can state the more specific lexical alternative.
  revised_text: याजक पक्षियों या पालतू पशुओं में से किसी ऐसे प्राणी को न खाएँ जो मरा हुआ हो या जंगली पशु द्वारा फाड़ा गया हो।[a]
