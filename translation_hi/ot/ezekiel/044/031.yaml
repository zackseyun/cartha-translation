  yaml_path: translation/ot/ezekiel/044/031.yaml
  text: The priests shall not eat any carcass or animal torn by beasts[a], whether from birds or from livestock.
translation:
  language: hi
  text: याजक पक्षियों या पालतू पशुओं में से किसी ऐसे प्राणी को न खाएँ जो मरा हुआ हो या जंगली पशु द्वारा फाड़ा गया हो।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘किसी ऐसे प्राणी को जो अपने-आप मर गया हो या फाड़ा गया हो।’
    reason: नְבֵלָה के लिए ‘अपने-आप मर गया’ और טְרֵפָה के लिए ‘फाड़ा गया’ शाब्दिक विकल्प हैं; मुख्य पाठ टְרֵפָה में निहित जंगली पशु के कारण को स्पष्ट करता है।
lexical_decisions:
- source_word: כָּל
  choice: किसी
  rationale: निषेधवाचक वाक्य में ‘किसी’ मूल शब्द की व्यापकता को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: נְבֵלָה
  choice: लोथ
  rationale: यह ऐसे मरे हुए जीव का शरीर है जिसे विधिपूर्वक वध नहीं किया गया; ‘लोथ’ आहार-विधि के संदर्भ में संक्षिप्त और सटीक है।
- source_word: טְרֵפָה
  choice: फाड़ा गया मांस
  rationale: यह शब्द फाड़े गए जीव या उसके मांस को सूचित करता है, सामान्यतः जंगली जानवर द्वारा; मुख्य पाठ में कर्ता को अनावश्यक रूप से स्पष्ट नहीं किया गया।
- source_word: מִן הָעוֹף
  choice: पक्षी
  rationale: यह उड़ने वाले प्राणियों की व्यापक श्रेणी के लिए सहज आधुनिक हिन्दी शब्द है।
- source_word: וּמִן הַבְּהֵמָה
  choice: पशु
  rationale: पक्षियों के विपरीत यहाँ स्थल-जीवों, विशेषकर घरेलू पशुओं, की श्रेणी अभिप्रेत है; ‘पशु’ हिन्दी में स्वाभाविक और पर्याप्त व्यापक है।
- source_word: לֹא יֹאכְלוּ
  choice: न खाएँ
  rationale: यह कानूनी निषेध को स्पष्ट, वर्तमान और गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: הַכֹּהֲנִים
  choice: याजक
  rationale: मंदिर और उपासना के संदर्भ में यह पुरोहित वर्ग के लिए स्थापित और सटीक हिन्दी पद है।
