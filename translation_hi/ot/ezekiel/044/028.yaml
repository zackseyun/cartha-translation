source:
  edition: WLC
  text: וְ/הָיְתָ֤ה לָ/הֶם֙ לְֽ/נַחֲלָ֔ה אֲנִ֖י נַֽחֲלָתָ֑/ם וַ/אֲחֻזָּ֗ה לֹֽא תִתְּנ֤וּ לָ/הֶם֙ בְּ/יִשְׂרָאֵ֔ל אֲנִ֖י אֲחֻזָּתָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/044/028.yaml
  text: 'And this shall be their inheritance: I am their inheritance[a]. And you shall give them no possession in Israel[b]; I am their possession.'
translation:
  language: hi
  text: 'और यह उनके लिए विरासत होगी: मैं उनकी विरासत हूँ।[a] तुम उन्हें इस्राएल में कोई भू-संपत्ति[b] न देना; मैं उनकी संपत्ति हूँ।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या, “और वह उनके लिए विरासत के रूप में होगी: मैं उनकी विरासत हूँ।” इब्रानी आरंभिक अभिव्यक्ति में कर्ता अध्याहृत है।'
    reason: lexical_alternative
  - marker: b
    text: “भू-संपत्ति” का अर्थ स्थायी भूमि-अधिकार या मिल्कियत भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיְתָה לָהֶם לְנַחֲלָה
  choice: और यह उनके लिए विरासत होगी
  rationale: इब्रानी आरंभ में स्त्रीलिंग एकवचन क्रिया का कर्ता स्पष्ट नहीं है और वाक्य कुछ अध्याहृत है। ‘यह’ संदर्भ से निहित विषय को व्यक्त करता है, जबकि मूल की कानूनी घोषणा और कुछ अस्पष्टता बनाए रखता है।
- source_word: נַחֲלָה / נַחֲלָתָם
  choice: विरासत / उनकी विरासत
  rationale: यह शब्द प्रायः विरासत में मिले या आवंटित भाग, विशेषकर भूमि अथवा वाचा के हिस्से, को दर्शाता है। ‘विरासत’ दोनों प्रयोगों का शब्द-संबंध सुरक्षित रखती है।
- source_word: אֲנִי נַחֲלָתָם
  choice: मैं ही उनकी विरासत हूँ
  rationale: मूल का क्रियारहित वाक्य सीधा और बलयुक्त है। ‘ही’ स्वाभाविक हिन्दी में ‘मैं’ पर पड़े बल को प्रकट करता है।
- source_word: אֲחֻזָּה
  choice: भू-संपत्ति / संपत्ति
  rationale: यह स्थायी रूप से धारित भूमि या मिल्कियत का सूचक हो सकता है। निषेध में ‘भू-संपत्ति’ भूमि-संदर्भ स्पष्ट करता है, जबकि परमेश्वर के विषय में समान शब्द को स्वाभाविक रूप से ‘संपत्ति’ कहा गया है।
- source_word: לֹא תִתְּנוּ לָהֶם בְּיִשְׂרָאֵל
  choice: तुम उन्हें इस्राएल में कोई भू-संपत्ति न देना
  rationale: द्वितीय पुरुष बहुवचन निर्देश की कानूनी शक्ति को ‘न देना’ सुरक्षित रखता है और संबोधित समूह को आवश्यकता से अधिक विशिष्ट नहीं बनाता।
- source_word: אֲנִי אֲחֻזָּתָם
  choice: मैं ही उनकी संपत्ति हूँ
  rationale: ‘संपत्ति’ נַחֲלָה के लिए प्रयुक्त ‘विरासत’ से भिन्नता बनाए रखती है और इस समानांतर कथन को स्वाभाविक हिन्दी में व्यक्त करती है।
theological_decisions:
- issue: याजकों के हिस्से के संबंध में ‘विरासत’ और ‘संपत्ति’ का पारस्परिक संबंध
  choice: נחלה को ‘विरासत’ और אחזה को ‘संपत्ति/भू-संपत्ति’ कहा गया है।
  alternative: दोनों इब्रानी शब्दों को केवल ‘विरासत’ या केवल ‘संपत्ति’ कहना।
  rationale: मूल में भूमि-अधिकार से जुड़े दो निकट, पर अलग शब्द हैं। यह भेद उस तनाव को बनाए रखता है कि उन्हें सामान्य भू-संपत्ति नहीं दी जानी है, क्योंकि स्वयं परमेश्वर उनकी विरासत और संपत्ति हैं।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। कानूनी-वाचाई भाव के लिए ‘विरासत’ और भूमि-अधिकार के लिए ‘भू-संपत्ति’ चुना गया; अंतिम समानांतर कथन में उसी इब्रानी मूल के लिए स्वाभाविक ‘संपत्ति’ रखा गया है।
