base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/044/005.yaml
  text: And Yahweh said to me[a], “Son of man, set your heart, and see with your eyes, and hear with your ears all that I am speaking to you concerning all the statutes of the house of Yahweh and all its laws[b]. Set your heart on the entrance of the temple and on all the exits of the sanctuary.”
translation:
  language: hi
  text: याहवे ने मुझसे कहा, “हे मनुष्य के पुत्र, मन लगाकर ध्यान दे[a]; अपनी आँखों से देख और अपने कानों से वह सब सुन जो मैं याहवे के भवन की सारी विधियों और उसके सारे निर्देशों[b] के विषय में तुझसे कह रहा हूँ। भवन के प्रवेश-मार्ग और पवित्रस्थान के सभी निकासों पर मन लगाकर ध्यान दे।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: मूल इब्रानी मुहावरे का शाब्दिक अर्थ ‘अपना हृदय लगा’ है; इसका आशय पूरे मन से सावधानीपूर्वक ध्यान देना है।
    reason: lexical_alternative
  - marker: b
    text: या “उसकी सारी व्यवस्थाओं।” इब्रानी बहुवचन शब्द निर्धारित शिक्षाओं, निर्देशों या नियमों को सूचित करता है; इसका अर्थ केवल संकीर्ण कानूनी विधान तक सीमित नहीं है।
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהֹוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय दिव्य नाम को नाम के रूप में प्रस्तुत किया गया है; इससे मूल पाठ में परमेश्वर के व्यक्तिगत नाम की उपस्थिति स्पष्ट रहती है।
- source_word: בֶּן אָדָם
  choice: हे मनुष्य के पुत्र
  rationale: यहेजकेल को बार-बार दिए जाने वाले इस संबोधन की साहित्यिक निरंतरता और मूल रूपक दोनों सुरक्षित रहते हैं; यहाँ यह नबी की मानवीय स्थिति को रेखांकित करता है।
- source_word: שִׂים לִבְּךָ / וְשַׂמְתָּ לִבְּךָ
  choice: मन लगाकर ध्यान दे
  rationale: शाब्दिक रूप से ‘अपना हृदय लगा’ का भाव एकाग्र ध्यान और गंभीर मनोयोग है। स्वाभाविक हिन्दी में अर्थ स्पष्ट रखते हुए दोनों occurrences में पुनरावृत्ति सुरक्षित रखी गई है।
- source_word: וּרְאֵה בְעֵינֶיךָ
  choice: अपनी आँखों से देख
  rationale: मूल की ठोस, इंद्रियपरक अभिव्यक्ति तथा अगले वाक्यांश के साथ उसका समानांतर रूप सुरक्षित रखा गया है।
- source_word: וּבְאָזְנֶיךָ שְׁמָע
  choice: अपने कानों से ... सुन
  rationale: ‘आँखों से देख’ के समानांतर मूल की बलयुक्त शारीरिक अभिव्यक्ति को बनाए रखा गया है।
- source_word: לְכָל חֻקּוֹת בֵּית יְהוָה
  choice: याहवे के भवन की सारी विधियों ... के विषय में
  rationale: לְ को यहाँ विषय-सूचक माना गया है। ‘याहवे का भवन’ मूल अभिव्यक्ति को बनाए रखता है, जबकि ‘विधियाँ’ उपासना-संबंधी निर्धारित नियमों के लिए उपयुक्त है।
- source_word: תורתו
  choice: उसकी सारी व्यवस्था
  rationale: मसोरेटिक रूप एकवचन है और सामूहिक अर्थ में भवन से संबंधित समूची निर्धारित शिक्षा या व्यवस्था को सूचित कर सकता है। हिन्दी ‘सारी व्यवस्था’ उस सामूहिकता को व्यक्त करती है।
- source_word: לִמְבוֹא הַבַּיִת
  choice: भवन के प्रवेश-मार्ग
  rationale: מָבוֹא प्रवेश या भीतर आने के स्थान/मार्ग को दर्शाता है। ‘प्रवेश-मार्ग’ अनावश्यक रूप से किसी विशेष द्वार की कल्पना जोड़े बिना पहुँच के स्थान को स्पष्ट करता है।
- source_word: בְּכָל מוֹצָאֵי הַמִּקְדָּשׁ
  choice: पवित्रस्थान के सभी निकासों पर
  rationale: מוֹצָאֵי बाहर जाने के स्थानों को और מִקְדָּשׁ पवित्र उपासना-स्थल को दर्शाता है; प्रवेश और निकास का विरोध भी सुरक्षित रहता है।
theological_decisions:
- issue: दिव्य नाम יְהֹוָה का अनुवाद
  choice: याहवे
  alternative: प्रभु
  rationale: मूल में उपस्थित व्यक्तिगत दिव्य नाम को छिपाने के बजाय हिन्दी लिप्यंतरण में रखा गया है; ‘प्रभु’ पाठ-परंपरा में प्रचलित विकल्प है, पर वह नाम को उपाधि में बदल देता है।
- issue: यहेजकेल में בֶּן אָדָם का अर्थ
  choice: मनुष्य का पुत्र
  alternative: हे नश्वर मनुष्य
  rationale: पारंपरिक और मूल-सन्निकट संबोधन नबी की मानवता को बनाए रखता है, पर इस प्रसंग में बाद की मसीही उपाधि का अर्थ आरोपित नहीं करता।
- issue: תורתו की संख्या और अर्थ-सीमा
  choice: उसकी सारी व्यवस्था
  alternative: उसके सारे निर्देश
  rationale: उपलब्ध मसोरेटिक पाठ में रूप एकवचन है, जिसे सामूहिक अर्थ में समझा गया है। ‘व्यवस्था’ विधिक-उपासना संदर्भ को व्यक्त करती है, जबकि ‘निर्देश’ इसकी व्यापक शिक्षात्मक अर्थ-सीमा का वैध विकल्प है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। नबी से एकवचन निकट संबोधन के कारण ‘तुझसे’ और एकवचन आज्ञाएँ प्रयुक्त हैं। इंद्रियपरक समानांतरता (‘आँखों से देख’, ‘कानों से सुन’) तथा ध्यान देने की आरंभिक और अंतिम पुनरावृत्ति को सुरक्षित रखा गया है।
