source:
  edition: WLC
  text: הֵ֜מָּה יָבֹ֣אוּ אֶל מִקְדָּשִׁ֗/י וְ/הֵ֛מָּה יִקְרְב֥וּ אֶל שֻׁלְחָנִ֖/י לְ/שָׁרְתֵ֑/נִי וְ/שָׁמְר֖וּ אֶת מִשְׁמַרְתִּֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/044/016.yaml
  text: They themselves shall enter my sanctuary[a], and they themselves shall come near to my table to minister to me, and they shall keep my charge.
translation:
  language: hi
  text: वे ही मेरे पवित्रस्थान में प्रवेश करेंगे, और वे ही मेरी मेज़[a] के निकट आकर मेरी सेवा करेंगे, और मेरे सौंपे हुए दायित्व का पालन करेंगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘मेरी वेदी’ अथवा ‘मेरी वेदी-मेज़’; यहाँ ‘मेज़’ मंदिर-सेवा के प्रसंग में प्रयुक्त हुआ है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵמָּה
  choice: वे ही
  rationale: स्वतंत्र सर्वनाम यहाँ बलसूचक है और पद में दो बार आया है। ‘वे ही’ उस बल और याजकीय प्रवेश के विशिष्ट अधिकार को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: יָבֹאוּ
  choice: प्रवेश करेंगे
  rationale: אֶל מִקְדָּשִׁי के साथ यह क्रिया पवित्रस्थान में भीतर जाने का भाव देती है; इसलिए केवल ‘आएँगे’ की अपेक्षा ‘प्रवेश करेंगे’ अधिक स्पष्ट है।
- source_word: מִקְדָּשִׁי
  choice: मेरे पवित्रस्थान
  rationale: यह शब्द पवित्र स्थान अथवा sanctuary को सूचित करता है। ‘पवित्रस्थान’ मन्दिर-सन्दर्भ के लिए संक्षिप्त, प्रतिष्ठित और प्रचलित हिन्दी पद है।
- source_word: יִקְרְבוּ
  choice: निकट आकर
  rationale: क्रिया में याजकीय सेवा के लिए समीप आने का धार्मिक भाव है। ‘निकट आकर’ उस भाव को सुरक्षित रखते हुए अगले प्रयोजनवाचक पद से सहज रूप से जुड़ता है।
- source_word: שֻׁלְחָנִי
  choice: मेरी मेज़
  rationale: इब्रानी शब्द का सीधा अर्थ ‘मेज़’ है। मन्दिर-सेवा के इस प्रसंग में यह वेदी या वेदी-सदृश मेज़ का संकेत दे सकता है, पर मुख्य पाठ में अधिक विशिष्ट अर्थ आरोपित नहीं किया गया है।
- source_word: לְשָׁרְתֵנִי
  choice: मेरी सेवा करेंगे
  rationale: שרת याजकीय प्रसंग में पवित्र सेवा करने को दर्शाता है। हिन्दी में ‘मेरी सेवा करेंगे’ उद्देश्य और परमेश्वर की ओर निर्देशित सेवा—दोनों को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: וְשָׁמְרוּ אֶת מִשְׁמַרְתִּי
  choice: और वे मेरे प्रति अपना दायित्व निभाएँगे
  rationale: शब्द-युग्म किसी को सौंपी गई सेवा अथवा उत्तरदायित्व को सावधानी से निभाने का भाव देता है। यह हिन्दी अभिव्यक्ति याजकीय दायित्व को बनाए रखती है और ‘मेरी आज्ञा’ जैसा अधिक संकीर्ण अर्थ नहीं जोड़ती।
theological_decisions:
- issue: मन्दिर-सेवा के प्रसंग में שֻׁלְחָנִי की पहचान
  choice: मेरी मेज़
  alternative: मेरी वेदी; मेरी वेदी-मेज़
  rationale: यह प्रसंग याजकों के पवित्रस्थान में प्रवेश और सेवा से सम्बन्धित है, इसलिए ‘मेज़’ वेदी या चढ़ावे से सम्बन्धित मेज़ के लिए प्रयुक्त हो सकता है। फिर भी मूल शब्द स्पष्ट रूप से ‘मेज़’ है; अतः मुख्य पाठ उसकी वास्तविक अस्पष्टता बनाए रखता है और अधिक व्याख्यात्मक विकल्प पादटिप्पणी में देता है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की है, पर मन्दिर और याजकीय सेवा के प्रसंग के अनुरूप गरिमापूर्ण रखी गई है। दो बार आए बलसूचक הֵמָּה को दोनों स्थानों पर ‘वे ही’ से व्यक्त किया गया है। ‘पवित्रस्थान’ और ‘दायित्व निभाएँगे’ सामान्य पाठकों के लिए बोधगम्य रहते हुए धार्मिक प्रसंग की गंभीरता बनाए रखते हैं।
