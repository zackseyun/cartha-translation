source:
  edition: WLC
  text: וְ/לֹ֥א שְׁמַרְתֶּ֖ם מִשְׁמֶ֣רֶת קָדָשָׁ֑/י וַ/תְּשִׂימ֗וּ/ן לְ/שֹׁמְרֵ֧י מִשְׁמַרְתִּ֛/י בְּ/מִקְדָּשִׁ֖/י לָ/כֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/044/008.yaml
  text: You have not kept charge of my holy things[a], but have appointed others to keep charge in my sanctuary for you.
translation:
  language: hi
  text: तुमने मेरी पवित्र वस्तुओं की जिम्मेदारी नहीं निभाई, बल्कि तुमने मेरे पवित्रस्थान में मेरी जिम्मेदारी निभाने के लिए दूसरों को अपने बदले[a] नियुक्त किया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “तुम्हारी ओर से” अथवा “तुम्हारे लिए।”
    reason: לָכֶם का मुख्य पाठ में संदर्भानुकूल ‘अपने बदले’ अर्थ लिया गया है; यह पद प्रतिनिधिक कार्य या लाभार्थी संबंध का अर्थ भी दे सकता है।
lexical_decisions:
- source_word: שְׁמַרְתֶּם מִשְׁמֶרֶת
  choice: देखरेख का दायित्व नहीं निभाया
  rationale: यह संयुक्त अभिव्यक्ति केवल पहरा देने नहीं, बल्कि सौंपे गए पवित्र कर्तव्य को निष्ठापूर्वक पूरा करने का भाव रखती है।
- source_word: קָדָשָׁי
  choice: मेरी पवित्र वस्तुओं
  rationale: बहुवचन अभिव्यक्ति को व्यापक रखा गया है; यह पवित्र वस्तुओं के साथ-साथ उनसे जुड़े पवित्र विषयों और सेवाओं को भी समेट सकती है।
- source_word: וַתְּשִׂימוּן
  choice: सौंप दिया
  rationale: मूल क्रिया का अर्थ रखना या नियुक्त करना है; यहाँ दूसरों को मंदिर का दायित्व दिए जाने के प्रसंग में 'सौंप दिया' स्वाभाविक है।
- source_word: לְשֹׁמְרֵי מִשְׁמַרְתִּי
  choice: देखरेख का दायित्व
  rationale: यह मंदिर में परमेश्वर द्वारा सौंपे गए उत्तरदायित्व को दर्शाता है और मूल में शׁמר/מִשְׁמֶרֶת की पुनरावृत्ति का भाव बनाए रखता है।
- source_word: בְּמִקְדָּשִׁי
  choice: मेरे पवित्रस्थान की
  rationale: '''पवित्रस्थान'' यहेजकेल के मंदिर-संबंधी प्रसंग में מִקְדָּשׁ का सटीक और परिचित हिन्दी रूप है।'
- source_word: לָכֶם
  choice: अपने बदले
  rationale: प्रसंग में दूसरों से वह सेवा कराए जाने का भाव प्रमुख है जिसे संबोधित लोगों को स्वयं करना था; पादटिप्पणी वैकल्पिक 'तुम्हारी ओर से' को सुरक्षित रखती है।
theological_decisions:
- issue: '''मेरी पवित्र वस्तुओं'' का दायरा'
  choice: पवित्रस्थान की वस्तुओं, विषयों और उनसे जुड़ी सेवाओं का व्यापक संकेत
  alternative: केवल पवित्र वस्तुएँ अथवा केवल पवित्र पद/सेवा
  rationale: קָדָשָׁי का दायरा मूल में व्यापक है; अनुवाद उसे केवल भौतिक वस्तुओं या केवल पदगत सेवा तक सीमित नहीं करता।
- issue: לָכֶם का संबंध
  choice: अपने बदले
  alternative: तुम्हारी ओर से / तुम्हारे लिए
  rationale: संदर्भ प्रतिस्थापन का भाव सुझाता है, पर संबंध पूरी तरह एकार्थी नहीं है; इसलिए वैकल्पिक अर्थ पादटिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण और सहज शैली अपनाई गई है। 'देखरेख का दायित्व निभाना' मंदिर-संबंधी सौंपे हुए कर्तव्य का भाव स्पष्ट करता है, जबकि 'पवित्रस्थान' धार्मिक प्रसंग की सटीकता बनाए रखता है।
