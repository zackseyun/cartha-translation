source:
  edition: WLC
  text: פַּאֲרֵ֤י פִשְׁתִּים֙ יִהְי֣וּ עַל רֹאשָׁ֔/ם וּ/מִכְנְסֵ֣י פִשְׁתִּ֔ים יִהְי֖וּ עַל מָתְנֵי/הֶ֑ם לֹ֥א יַחְגְּר֖וּ בַּ/יָּֽזַע־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/044/018.yaml
  text: Linen turbans shall be on their heads[a], and linen undergarments shall be on their loins; they shall not gird themselves with anything that causes sweat.
translation:
  language: hi
  text: उनके सिरों पर सन के साफ़े हों और उनकी कमर पर सन के अधोवस्त्र हों। वे ऐसी किसी चीज़ से कमर न कसें जिससे पसीना आए।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अधिक शाब्दिक रूप से, “वे पसीने में/से कमर न कसें।” इब्रानी वाक्यांश संक्षिप्त और कुछ अस्पष्ट है; सम्भवतः आशय यह है कि वे ऐसा वस्त्र न पहनें या न कसें जिससे पसीना आए।
    reason: lexical_alternative
lexical_decisions:
- source_word: פַּאֲרֵי
  choice: साफ़े
  rationale: यह शब्द यहाँ याजकीय सिर-पोशाक को दर्शाता है। ‘साफ़े’ प्रसंग के अनुकूल, स्वाभाविक और विशिष्ट है।
- source_word: פִשְׁתִּים
  choice: सन
  rationale: वस्त्र के प्रसंग में यह सन से बने कपड़े को दर्शाता है। दोनों बार ‘सन’ रखकर मूल की पुनरावृत्ति सुरक्षित रखी गई है।
- source_word: מִכְנְסֵי
  choice: अधोवस्त्र
  rationale: यह याजकों द्वारा शरीर के निचले भाग पर पहने जाने वाले भीतरी वस्त्र का संकेत करता है। ‘अधोवस्त्र’ उसके आकार को अनावश्यक रूप से निश्चित किए बिना अर्थ स्पष्ट करता है।
- source_word: מָתְנֵיהֶם
  choice: उनकी कमर पर
  rationale: आधुनिक हिन्दी में ‘कमर’ वस्त्र पहनने के इस निर्देश को सहज और स्पष्ट ढंग से व्यक्त करता है।
- source_word: יַחְגְּרוּ
  choice: कमर न कसें
  rationale: क्रिया का संबंध वस्त्र को शरीर के चारों ओर बाँधने या कसने से है; यह हिन्दी प्रयोग उस क्रिया को स्वाभाविक रूप से व्यक्त करता है।
- source_word: בַּיָּזַע
  choice: ऐसी किसी चीज़ से…जिससे पसीना आए
  rationale: इब्रानी पद संक्षिप्त और अध्याहृत है—शाब्दिक रूप से ‘पसीने में/से’। मुख्य पाठ संभावित व्यावहारिक आशय स्पष्ट करता है, जबकि पादटिप्पणी मूल की अस्पष्टता सुरक्षित रखती है।
theological_decisions:
- issue: याजकीय वस्त्र का नियम और अंतिम वाक्यांश का निहित आशय
  choice: निषेध को ऐसी वस्तु से कमर कसने के विरुद्ध व्यक्त किया गया है जिससे पसीना आए।
  alternative: अधिक शाब्दिक रूप से, ‘वे पसीने में/से कमर न कसें’; अथवा इसे विशेष रूप से ऊनी वस्त्र या पटके का निषेध मानना।
  rationale: इब्रानी वाक्यांश अत्यंत संक्षिप्त है। निकटवर्ती प्रसंग सन के वस्त्रों पर बल देता है, पर पाठ ऊन या किसी खास वस्तु का नाम नहीं लेता। इसलिए मुख्य पाठ संभावित आशय देता है, बिना निषेध को किसी अनुल्लिखित सामग्री तक सीमित किए; अधिक शाब्दिक रूप पादटिप्पणी में दिया गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। ‘साफ़े’, ‘अधोवस्त्र’ और ‘कमर कसें’ याजकीय वस्त्र-विन्यास को स्वाभाविक हिन्दी में व्यक्त करते हैं। पादटिप्पणी-चिह्न अंतिम अस्पष्ट पद के बाद रखा गया है, क्योंकि टिप्पणी उसी से संबंधित है।
