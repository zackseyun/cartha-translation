source:
  edition: WLC
  text: יַ֗עַן אֲשֶׁ֨ר יְשָׁרְת֤וּ אוֹתָ/ם֙ לִ/פְנֵ֣י גִלּֽוּלֵי/הֶ֔ם וְ/הָי֥וּ לְ/בֵֽית יִשְׂרָאֵ֖ל לְ/מִכְשׁ֣וֹל עָוֺ֑ן עַל כֵּן֩ נָשָׂ֨אתִי יָדִ֜/י עֲלֵי/הֶ֗ם נְאֻם֙ אֲדֹנָ֣/י יְהוִ֔ה וְ/נָשְׂא֖וּ עֲוֺנָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/044/012.yaml
  text: Because they ministered to them before their idols and became a stumbling block of iniquity for the house of Israel[a], therefore I have raised my hand against them, declares the Lord GOD[b], and they will bear their iniquity.
translation:
  language: hi
  text: क्योंकि उन्होंने उनकी मूर्तियों के सामने उनकी सेवा की[a] और इस्राएल के घराने के लिए अधर्म की ठोकर बने, इसलिए मैंने उनके विरुद्ध अपना हाथ उठाया है[b]—प्रभु याहवे की घोषणा है—और वे अपने अधर्म का भार उठाएँगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘उनकी’ का इब्रानी संदर्भ संक्षिप्त है; इसका संकेत मूर्तियों से जुड़े उपासकों की ओर, अथवा अर्थ की दृष्टि से स्वयं मूर्तियों की ओर हो सकता है।
    reason: alternative_reading
  - marker: b
    text: शाब्दिक मुहावरा है, ‘मैंने उनके विरुद्ध अपना हाथ उठाया है।’ हाथ उठाना गंभीर शपथ या न्यायिक कार्रवाई का संकेत हो सकता है; यहाँ प्रसंग उनके विरुद्ध न्याय की घोषणा को प्रमुख बनाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: יַעַן אֲשֶׁר
  choice: क्योंकि
  rationale: यह न्याय के स्पष्ट कारण का परिचय देता है और आधुनिक हिन्दी में स्वाभाविक है।
- source_word: יְשָׁרְתוּ
  choice: सेवा की
  rationale: क्रिया धार्मिक अथवा उपासना-संबंधी सेवा को सूचित करती है; निकट का मूर्तिपूजक संदर्भ इस विशेष अर्थ को स्पष्ट करता है।
- source_word: אוֹתָם
  choice: उनकी
  rationale: इब्रानी सर्वनाम का संदर्भ संक्षिप्त और कुछ अस्पष्ट है। हिन्दी में ‘उनकी सेवा की’ उस अस्पष्टता को बनाए रखता है; संभावित संदर्भ को पादटिप्पणी में बताया गया है।
- source_word: לִפְנֵי גִלּוּלֵיהֶם
  choice: उनकी मूर्तियों के सामने
  rationale: לִפְנֵי का स्थानवाचक अर्थ ‘के सामने’ है। גִלּוּלִים यहेजकेल का मूर्तियों के लिए तिरस्कारपूर्ण शब्द है; मुख्य पाठ में स्वाभाविक ‘मूर्तियाँ’ रखा गया है।
- source_word: לְמִכְשׁוֹל עָוֺן
  choice: अधर्म में गिराने वाली ठोकर
  rationale: यह अनुवाद ठोकर के मूल रूपक को बनाए रखते हुए उसका नैतिक और कारणात्मक आशय आधुनिक हिन्दी में स्पष्ट करता है।
- source_word: נָשָׂאתִי יָדִי עֲלֵיהֶם
  choice: मैंने उनके विरुद्ध अपना हाथ उठाया है
  rationale: देहगत इब्रानी मुहावरे और उसके प्रतिकूल न्यायिक बल को सुरक्षित रखा गया है; शपथ-संबंधी अर्थ पादटिप्पणी में दिया गया है।
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: प्रभु याहवे की घोषणा है
  rationale: נְאֻם को स्वाभाविक भविष्यद्वक्ताई घोषणा के रूप में और יהוה को व्यक्तिवाचक वाचा-नाम ‘याहवे’ के रूप में प्रस्तुत किया गया है।
- source_word: וְנָשְׂאוּ עֲוֺנָם
  choice: वे अपने अधर्म का भार उठाएँगे
  rationale: यह अपराध, उत्तरदायित्व और उसके परिणाम—तीनों को समेटने वाले इब्रानी मुहावरे को हिन्दी में बनाए रखता है।
theological_decisions:
- issue: अदोनाय के साथ आए परमेश्वर के नाम יהוה का अनुवाद
  choice: प्रभु याहवे
  alternative: प्रभु यहोवा / प्रभु परमेश्वर
  rationale: ‘याहवे’ मूल पाठ में उपस्थित वाचा-नाम को नाम के रूप में सुरक्षित रखता है, जबकि ‘प्रभु’ אֲדֹנָי को व्यक्त करता है और दो बार ‘प्रभु’ कहने से बचाता है।
- issue: וְנָשְׂאוּ עֲוֺנָם में अधर्म सहने का आशय
  choice: अपने अधर्म का भार उठाएँगे
  alternative: अपने अपराध का दण्ड भोगेंगे
  rationale: मुख्य पाठ अपराध और उसके फल के बीच मूल भाषा में विद्यमान व्यापकता को बनाए रखता है; केवल ‘दण्ड’ कहना अर्थ को अनावश्यक रूप से संकुचित कर देता।
- issue: לְמִכְשׁוֹל עָוֺן का नैतिक संबंध
  choice: अधर्म में गिराने वाली ठोकर
  alternative: अधर्म की ठोकर
  rationale: यह वाक्यांश ठोकर के रूपक को बचाते हुए संकेत करता है कि उनकी सेवा इस्राएल को अधर्म की ओर गिराने का कारण बनी, पर इसे किसी संप्रदायगत व्याख्या से नहीं बाँधता।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य हिन्दी रखी गई है। वाक्य की भविष्यद्वक्ताई गंभीरता, ठोकर और भार उठाने के मूल रूपक, सर्वनाम की वास्तविक अस्पष्टता तथा दिव्य नाम की विशिष्टता सुरक्षित रखी गई है।
