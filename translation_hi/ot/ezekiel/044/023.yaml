review_pass:
  verdict: revise
  source_fidelity: 'The draft accurately represents both Hiphil verbs: the priests instruct God''s people regarding the holy/common distinction and enable them to recognize the unclean/clean distinction. ‘पवित्र/साधारण’ and ‘अशुद्ध/शुद्ध’ appropriately preserve the distinct cultic pairs and do not introduce moralized meaning.'
  naturalness: The first clause is understandable, but ‘भेद सिखाएँगे’ is slightly less idiomatic than teaching people to distinguish. The second clause repeats ‘सिखाएँगे’ and places ‘उन्हें’ awkwardly after the infinitival phrase. A small recasting gives natural modern Hindi while retaining the two related, but distinct, Hebrew verbs.
  terminology: ‘पवित्र’ for קֹדֶשׁ, ‘साधारण’ for חֹל, and ‘अशुद्ध/शुद्ध’ for טָמֵא/טָהוֹר are suitable in this priestly context. The footnote’s proposed ‘अपवित्र’ is potentially misleading because Hindi commonly uses it for ritual or moral impurity, overlapping with the following ‘अशुद्ध’; ‘लौकिक’ is a clearer alternative for the non-holy category.
  issues:
  - severity: low
    issue: The second clause is stylistically cumbersome and unnecessarily repeats ‘सिखाएँगे’.
    rationale: יוֹדִעֻם is causative (‘make them know/discern’), which Hindi naturally expresses as ‘उन्हें ... का भेद समझाएँगे’; this distinguishes it from the preceding instructional verb without changing the meaning.
  - severity: low
    issue: Footnote alternative ‘अपवित्र’ can blur the verse’s deliberate distinction between common (חֹל) and unclean (טָמֵא).
    rationale: Although the explanatory note qualifies it, ‘अपवित्र’ is readily understood as impure/defiled in Hindi. ‘लौकिक’ offers a recognized contrast to ‘पवित्र’ without colliding with ‘अशुद्ध’ in the second pair.
  revised_text: वे मेरी प्रजा को पवित्र और साधारण[a] में अंतर करना सिखाएँगे, और उन्हें अशुद्ध और शुद्ध का भेद समझाएँगे।
  revised_footnotes:
