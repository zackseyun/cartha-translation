revisions:
- from: वे मेरी प्रजा को पवित्र और साधारण[a] के बीच का भेद सिखाएँगे, और अशुद्ध और शुद्ध के बीच भेद करना उन्हें सिखाएँगे।
  to: वे मेरी प्रजा को पवित्र और साधारण[a] में अंतर करना सिखाएँगे, और उन्हें अशुद्ध और शुद्ध का भेद समझाएँगे।
  rationale: The revision improves Hindi idiom and reflects the shift from ‘teach’ (יוֹרוּ) to the causative ‘make know/discern’ (יוֹדִעֻם). It retains the source’s two cultic distinctions and updates the alternative footnote to avoid conflating commonness with ritual uncleanness.
