  yaml_path: translation/ot/ezekiel/044/023.yaml
  text: They shall teach my people the difference between the holy and the common[b][a], and make them know the difference between the unclean and the clean.
translation:
  language: hi
  text: वे मेरी प्रजा को पवित्र और साधारण[a] में अंतर करना सिखाएँगे, और उन्हें अशुद्ध और शुद्ध का भेद समझाएँगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘पवित्र और लौकिक’। यहाँ ‘लौकिक’ का अर्थ गैर-पवित्र है, न कि अनिवार्य रूप से नैतिक रूप से दूषित।
    reason: lexical_alternative
lexical_decisions:
- source_word: יוֹרוּ
  choice: सिखाएँगे
  rationale: हिफ़इल रूप यहाँ याजकीय संदर्भ में शिक्षा देने का अर्थ रखता है; ‘सिखाएँगे’ स्वाभाविक हिन्दी में इस भूमिका को स्पष्ट करता है।
- source_word: בֵּין קֹדֶשׁ לְחֹל
  choice: पवित्र और साधारण के बीच का भेद
  rationale: ‘पवित्र’ קֹדֶשׁ का मानक धार्मिक अर्थ देता है, जबकि ‘साधारण’ חֹל को गैर-पवित्र स्थिति के रूप में व्यक्त करता है, बिना नैतिक अपवित्रता का अनावश्यक भाव जोड़े।
- source_word: טָמֵא
  choice: अशुद्ध
  rationale: याजकीय और अनुष्ठानिक संदर्भ में ‘अशुद्ध’ इस शब्द के धार्मिक शुद्धता-संबंधी अर्थ को सुरक्षित रखता है।
- source_word: טָהוֹר
  choice: शुद्ध
  rationale: טָמֵא के विलोम के रूप में ‘शुद्ध’ स्वाभाविक और स्थापित हिन्दी शब्द है।
- source_word: יוֹדִעֻם
  choice: भेद करना उन्हें सिखाएँगे
  rationale: हिफ़इल की कारणवाचक शक्ति—‘उन्हें जानने/पहचानने योग्य बनाना’—को सहज हिन्दी में व्यक्त करता है और कर्म-सर्वनाम को ‘मेरी प्रजा’ से जोड़ता है।
- source_word: וְאֶת עַמִּי
  choice: मेरी प्रजा को
  rationale: प्रत्यक्ष कर्म को स्वाभाविक हिन्दी क्रम में रखा गया है; आरंभिक संयोजक को अलग से व्यक्त करना आवश्यक नहीं है।
theological_decisions:
- issue: קֹדֶשׁ के विपरीत חֹל की उपासना-संबंधी शब्दावली
  choice: साधारण
  alternative: अपवित्र
  rationale: यहाँ अंतर पवित्र और गैर-पवित्र स्थिति के बीच है। ‘साधारण’ इस तकनीकी भेद को बनाए रखता है, जबकि ‘अपवित्र’ नैतिक बुराई या दूषण का अधिक प्रबल भाव दे सकता है।
- issue: יוֹדִעֻם की कारणवाचक शक्ति
  choice: भेद करना उन्हें सिखाएँगे
  alternative: उन्हें भेद का ज्ञान कराएँगे
  rationale: चुना हुआ अनुवाद कारणवाचक अर्थ को पठनीय हिन्दी में रखता है और यह स्पष्ट करता है कि याजक प्रजा को अशुद्ध और शुद्ध पहचानने योग्य बनाएँगे।
