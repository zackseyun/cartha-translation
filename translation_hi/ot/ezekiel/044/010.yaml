reference: Ezekiel 44:10
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: כִּ֣י אִם הַ/לְוִיִּ֗ם אֲשֶׁ֤ר רָֽחֲקוּ֙ מֵֽ/עָלַ֔/י בִּ/תְע֤וֹת יִשְׂרָאֵל֙ אֲשֶׁ֣ר תָּע֣וּ מֵֽ/עָלַ֔/י אַחֲרֵ֖י גִּלּֽוּלֵי/הֶ֑ם וְ/נָשְׂא֖וּ עֲוֺנָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/044/010.yaml
  text: But the Levites who went far from me when Israel went astray[a], who went astray from me after their idols, shall bear their iniquity.
translation:
  language: hi
  text: परन्तु वे लेवीवंशी, जो इस्राएल के भटक जाने के समय मुझसे दूर हो गए थे और अपनी मूर्तियों के पीछे चलकर मुझसे भटक गए थे, अपने अधर्म का भार उठाएँगे।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अपने अपराध का दण्ड भोगेंगे” अथवा “अपने दोष का भार उठाएँगे।” इब्रानी मुहावरे में दोष और उसके फलस्वरूप मिलने वाले दण्ड, दोनों का भाव हो सकता है।
    reason: עָוֺן और נָשָׂא עָוֺן के मुहावरे में दोष तथा उसके दण्ड—दोनों की अर्थ-संभावना को सुरक्षित रखना।
lexical_decisions:
- source_word: כִּי אִם
  choice: परन्तु
  rationale: यह पद पिछले कथन के साथ विरोध और अपवाद का संबंध जोड़ता है; आधुनिक हिन्दी में ‘परन्तु’ इसे स्वाभाविक रूप से व्यक्त करता है।
- source_word: הַלְוִיִּם
  choice: वे लेवीवंशी
  rationale: इब्रानी में विशेष रूप से लेवियों का उल्लेख है, सामान्य रूप से याजकों का नहीं; ‘लेवीवंशी’ आधुनिक हिन्दी में इस समुदाय को स्पष्ट रूप से दर्शाता है।
- source_word: רָחֲקוּ מֵעָלַי
  choice: मुझसे दूर हो गए थे
  rationale: यह दूरी के मूल बिंब और परमेश्वर से संबंध-विच्छेद, दोनों को बनाए रखता है।
- source_word: בִּתְעוֹת יִשְׂרָאֵל
  choice: इस्राएल के भटक जाने के समय
  rationale: בְּ के साथ क्रियार्थक रूप यहाँ परिस्थिति अथवा समय बताता है; यह अनुवाद उस ऐतिहासिक प्रसंग को स्पष्ट और स्वाभाविक हिन्दी में रखता है।
- source_word: תָּעוּ מֵעָלַי
  choice: मुझसे भटक गए थे
  rationale: ‘भटक गए’ उसी इब्रानी मूल की पुनरावृत्ति को बनाए रखता है जो इस्राएल के भटकने के लिए प्रयुक्त हुआ है, और नैतिक-धार्मिक विचलन भी व्यक्त करता है।
- source_word: אַחֲרֵי גִּלּוּלֵיהֶם
  choice: अपनी मूर्तियों के पीछे चलकर
  rationale: אַחֲרֵי यहाँ अनुसरण करने का भाव रखता है। ‘पीछे चलकर’ मूल बिंब को स्वाभाविक हिन्दी में व्यक्त करता है; ‘मूर्तियों’ से גִּלּוּלִים का संदर्भ स्पष्ट रहता है, बिना उसके तिरस्कारसूचक व्युत्पत्तिगत भाव को बढ़ाकर अनुवाद किए।
- source_word: וְנָשְׂאוּ עֲוֺנָם
  choice: अपने अधर्म का भार उठाएँगे
  rationale: यह इब्रानी मुहावरे के ‘उठाने/ढोने’ वाले बिंब को बनाए रखते हुए עָוֺן के अधर्म, दोष और उसके परिणाम की संयुक्त अर्थ-सीमा को खुला रखता है।
theological_decisions:
- issue: वाचा-संबंधी न्याय के मुहावरे וְנָשְׂאוּ עֲוֺנָם का अनुवाद
  choice: अपने अधर्म का भार उठाएँगे
  alternative: अपने अपराध का दण्ड भोगेंगे; अपने दोष का भार उठाएँगे
  rationale: इब्रानी मुहावरा अपराधपूर्ण दशा और उसके फलस्वरूप आने वाले दण्ड, दोनों को समेट सकता है। मुख्य पाठ में औपचारिक बिंब बनाए रखने से यह वास्तविक अर्थगत तनाव सुरक्षित रहता है; पाद-टिप्पणी आधुनिक हिन्दी में संभावित अर्थ स्पष्ट करती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘मुझसे दूर’ और ‘मुझसे भटक गए’ मूल की पुनरावृत्ति तथा संबंधगत दूरी को बनाए रखते हैं। ‘लेवीवंशी’ धार्मिक समुदाय की पहचान स्पष्ट करता है, जबकि ‘अधर्म का भार उठाएँगे’ न्याय के इब्रानी मुहावरे को अत्यधिक व्याख्यायित किए बिना प्रस्तुत करता है।
