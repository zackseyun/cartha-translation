source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר אֵלַ֜/י יְהוָ֗ה הַ/שַּׁ֣עַר הַ/זֶּה֩ סָג֨וּר יִהְיֶ֜ה לֹ֣א יִפָּתֵ֗חַ וְ/אִישׁ֙ לֹא יָ֣בֹא ב֔/וֹ כִּ֛י יְהוָ֥ה אֱלֹהֵֽי יִשְׂרָאֵ֖ל בָּ֣א ב֑/וֹ וְ/הָיָ֖ה סָגֽוּר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/044/002.yaml
  text: And Yahweh said to me[a], “This gate shall remain shut; it shall not be opened, and no one shall enter through it, because Yahweh, the God of Israel, has entered through it. Therefore it shall remain shut.”
translation:
  language: hi
  text: तब याहवे ने मुझसे कहा, “यह फाटक बंद रहेगा; इसे खोला नहीं जाएगा, और कोई मनुष्य[a] इससे होकर प्रवेश नहीं करेगा, क्योंकि याहवे, इस्राएल का परमेश्वर, इससे होकर प्रवेश कर चुका है। इसलिए यह बंद रहेगा।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “कोई भी।” इब्रानी में पुल्लिंग एकवचन शब्द ‘मनुष्य’ है, जिसका प्रयोग यहाँ सामान्य अर्थ में हुआ है।
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय प्रचलित हिन्दी लिप्यंतरण में रखा गया है।
- source_word: הַשַּׁעַר הַזֶּה
  choice: यह फाटक
  rationale: निकटवाची संकेतवाचक הַזֶּה का अर्थ ‘यह’ है; मन्दिर-दर्शन के प्रसंग में ‘फाटक’ स्वाभाविक है।
- source_word: סָגוּר יִהְיֶה
  choice: बंद रहेगा
  rationale: विशेषण के साथ היה यहाँ लगातार बनी रहने वाली अवस्था व्यक्त करता है।
- source_word: לֹא יִפָּתֵחַ
  choice: इसे खोला नहीं जाएगा
  rationale: פתח का निफ़अल रूप कर्मवाच्य है, जिसे हिन्दी कर्मवाच्य में स्पष्ट रखा गया है।
- source_word: וְאִישׁ לֹא יָבֹא בוֹ
  choice: और कोई मनुष्य इससे होकर प्रवेश नहीं करेगा
  rationale: אִישׁ पुल्लिंग एकवचन होते हुए यहाँ सामान्य मानवीय अर्थ रखता है; ‘कोई मनुष्य’ रूप और व्यापक अर्थ दोनों को बनाए रखता है। फाटक के संदर्भ में בּוֹ को ‘इससे होकर’ कहना स्वाभाविक है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यह संयोजक फाटक बंद रहने का कारण बताता है।
- source_word: יְהוָה אֱלֹהֵי יִשְׂרָאֵל
  choice: याहवे, इस्राएल का परमेश्वर
  rationale: मूल की समानाधिकरण संरचना को अल्पविरामों द्वारा स्पष्ट किया गया है।
- source_word: בָּא בוֹ
  choice: इससे होकर प्रवेश कर चुका है
  rationale: पूर्ण क्रिया पहले हो चुके प्रवेश को वर्तमान परिणाम सहित दर्शाती है; ‘कर चुका है’ उस पूर्णता को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וְהָיָה סָגוּר
  choice: इसलिए यह बंद रहेगा
  rationale: अंतिम וְ प्रसंग में परिणामसूचक है और आरम्भिक आदेश की स्थायी अवस्था को दोहराता है।
theological_decisions:
- issue: परमेश्वर के नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: व्यक्तिगत वाचा-नाम को उपाधि से प्रतिस्थापित नहीं किया गया; ‘याहवे’ मूल नाम का निकट और प्रचलित लिप्यंतरण है।
- issue: אִישׁ का सामान्य पुल्लिंग प्रयोग
  choice: कोई मनुष्य
  alternative: कोई भी; कोई व्यक्ति
  rationale: ‘कोई मनुष्य’ मूल के पुल्लिंग एकवचन रूप को दिखाते हुए यहाँ उसके सामान्य, सभी मनुष्यों पर लागू अर्थ को भी बनाए रखता है; पादटिप्पणी इस व्यापक अर्थ को स्पष्ट करती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सहज हिन्दी रखी गई है। ‘फाटक’, ‘बंद रहेगा’ और ‘इससे होकर प्रवेश’ मन्दिर-दर्शन के स्थानिक संदर्भ को स्पष्ट करते हैं; वाक्य की कारण-परिणाम संरचना भी सुरक्षित है।
