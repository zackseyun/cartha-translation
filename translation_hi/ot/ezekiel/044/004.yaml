id: EZK.44.4
reference: Ezekiel 44:4
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יְבִיאֵ֜/נִי דֶּֽרֶךְ שַׁ֣עַר הַ/צָּפוֹן֮ אֶל פְּנֵ֣י הַ/בַּיִת֒ וָ/אֵ֕רֶא וְ/הִנֵּ֛ה מָלֵ֥א כְבוֹד יְהוָ֖ה אֶת בֵּ֣ית יְהוָ֑ה וָ/אֶפֹּ֖ל אֶל פָּנָֽ/י־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/044/004.yaml
  text: Then he brought me by way of the north gate to the front of the house[a], and I looked, and behold, the glory of Yahweh filled the house of Yahweh[b]; and I fell on my face.
translation:
  language: hi
  text: तब वह मुझे उत्तरी फाटक के मार्ग से भवन के सामने ले आया[a]। मैंने देखा, और देखो, याहवे का तेज याहवे के भवन में भर गया था[b]; और मैं मुँह के बल गिर पड़ा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उत्तरी फाटक से होकर भवन के सामने।”
    reason: lexical_alternative
  - marker: b
    text: अर्थात मंदिर। मूल हिब्रू में “याहवे का भवन” है; यहेजकेल की शब्दावली बनाए रखने के लिए अनुवाद में “भवन” रखा गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְבִיאֵנִי
  choice: तब वह मुझे ... ले आया
  rationale: בוא के हिफ़ील रूप का अर्थ यहाँ ‘मुझे ले आया’ है; ‘तब’ कथात्मक क्रम को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: דֶּרֶךְ שַׁעַר הַצָּפוֹן
  choice: उत्तरी फाटक के मार्ग से
  rationale: דֶּרֶךְ यात्रा के मार्ग या रास्ते को सूचित करता है; यह रूप हिब्रू मुहावरे और ‘फाटक से होकर’ की सम्भावना दोनों के निकट है।
- source_word: אֶל פְּנֵי הַבַּיִת
  choice: भवन के सामने
  rationale: פְּנֵי का शाब्दिक अर्थ ‘मुख’ है, पर स्थान-सूचक प्रयोग में ‘सामने’ स्वाभाविक है। בַּיִת के लिए ‘भवन’ रखा गया है ताकि मंदिर का संकेत स्पष्ट रहे और मूल का house-वाला शब्द भी बना रहे।
- source_word: וָאֵרֶא וְהִנֵּה
  choice: मैंने देखा, और देखो
  rationale: ראה दृश्य को देखने का बोध देता है और הִנֵּה अचानक ध्यान खींचता है; ‘और देखो’ दर्शन-वर्णन की गंभीरता बनाए रखता है।
- source_word: מָלֵא
  choice: भर गया था
  rationale: रूप का मूल भाव ‘भरा हुआ’ है; प्रसंग में ‘तेज ... में भर गया था’ स्वाभाविक हिन्दी विधेय है और देखी गई अवस्था को व्यक्त करता है।
- source_word: כְבוֹד יְהוָה
  choice: यहोवा का तेज
  rationale: כָּבוֹד के लिए मंदिर-दर्शन के प्रसंग में ‘तेज’ परमेश्वर की प्रकट महिमा का प्रचलित और बोधगम्य हिन्दी रूप है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: व्यक्तिगत दिव्य नाम को किसी उपाधि से बदलने के बजाय हिन्दी में व्यापक रूप से पहचाने जाने वाले लिप्यंतरण ‘यहोवा’ से व्यक्त किया गया है।
- source_word: בֵּית יְהוָה
  choice: यहोवा का भवन
  rationale: ‘भवन’ בֵּית की house-वाली शब्दावली को सुरक्षित रखता है; संदर्भ में यह मंदिर है।
- source_word: וָאֶפֹּל אֶל פָּנָי
  choice: और मैं मुँह के बल गिर पड़ा
  rationale: यह दण्डवत गिरने का हिब्रू मुहावरा है; ‘मुँह के बल गिर पड़ा’ आधुनिक हिन्दी में सटीक और स्वाभाविक है।
theological_decisions:
- issue: दिव्य नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ में निजी दिव्य नाम है। उसे ‘प्रभु’ जैसी उपाधि से नहीं बदला गया; ‘यहोवा’ आधुनिक हिन्दी बाइबलीय प्रयोग में अधिक पहचाना जाने वाला लिप्यंतरण है, जबकि ‘याहवे’ अधिक संभावित विद्वत्तापूर्ण उच्चारण को दर्शाता है।
- issue: यहेजकेल के मंदिर-दर्शन में בַּיִת / בֵּית יְהוָה
  choice: भवन / यहोवा का भवन
  alternative: मंदिर / यहोवा का मंदिर
  rationale: मूल की ‘घर/भवन’ शब्दावली को बनाए रखा गया है, पर ‘भवन’ हिन्दी में पवित्र संरचना के लिए ‘घर’ से अधिक स्वाभाविक है। संदर्भगत अर्थ मंदिर ही है।
- issue: מָלֵא की कालगत अभिव्यक्ति
  choice: भर गया था
  alternative: भरा हुआ था
  rationale: हिब्रू रूप देखी गई पूर्ण अवस्था और ‘भरने’ के परिणाम दोनों को ग्रहण कर सकता है। मुख्य पाठ में गतिशील हिन्दी रखी गई है, जबकि वैकल्पिक रूप स्थितिगत बल को अधिक स्पष्ट करता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सरल कथात्मक रूप रखा गया है। ‘और देखो’ दर्शन की आकस्मिकता और गंभीरता बनाए रखता है; ‘मुँह के बल गिर पड़ा’ सामान्य पाठक के लिए स्पष्ट है।
