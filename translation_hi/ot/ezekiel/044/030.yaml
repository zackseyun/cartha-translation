source:
  edition: WLC
  text: וְ/רֵאשִׁית֩ כָּל בִּכּ֨וּרֵי כֹ֜ל וְ/כָל תְּר֣וּמַת כֹּ֗ל מִ/כֹּל֙ תְּרוּמ֣וֹתֵי/כֶ֔ם לַ/כֹּהֲנִ֖ים יִֽהְיֶ֑ה וְ/רֵאשִׁ֤ית עֲרִסֽוֹתֵי/כֶם֙ תִּתְּנ֣וּ לַ/כֹּהֵ֔ן לְ/הָנִ֥יחַ בְּרָכָ֖ה אֶל בֵּיתֶֽ/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/044/030.yaml
  text: And the first of all the firstfruits of everything[a], and every contribution from all your contributions, shall belong to the priests. You shall give the first of your dough to the priest[c][b], to cause a blessing to rest on your house.
translation:
  language: hi
  text: हर प्रकार की पहली उपज का पहला अंश और तुम्हारी सब पवित्र भेंटों में से हर पवित्र भेंट[a] याजकों की होगी। तुम अपने गूँधे हुए आटे का पहला अंश[b] याजक को दोगे, ताकि तुम्हारे घर पर आशीष ठहरे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘अलग रखी हुई भेंट’। इब्रानी शब्द पवित्र उपयोग के लिए अलग करके दिए गए अंश को दर्शाता है।
    reason: lexical_alternative
  - marker: b
    text: या ‘गूँधे हुए आटे की खेप का पहला अंश’। इब्रानी शब्द गूँधे हुए आटे या, विस्तार से, आटा गूँधने की खेप को सूचित कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: רֵאשִׁית כָּל בִּכּוּרֵי כֹל
  choice: हर प्रकार की पहली उपज के पहले अंश
  rationale: रֵאשִׁית और בִּכּוּרֵי की दोहरी अभिव्यक्ति को बनाए रखते हुए इसे स्वाभाविक हिन्दी में व्यक्त किया गया है; पहला शब्द आरम्भिक या प्रधान अंश और दूसरा पहली उपज को सूचित करता है।
- source_word: תְּרוּמַת / תְּרוּמוֹתֵיכֶם
  choice: पवित्र भेंट / तुम्हारी पवित्र भेंटों
  rationale: תְּרוּמָה सामान्य उपहार नहीं, बल्कि पवित्र उपयोग के लिए अलग किया गया अंश है। ‘पवित्र भेंट’ इस धार्मिक-कानूनी अर्थ को आधुनिक हिन्दी में स्पष्ट रखता है।
- source_word: לַכֹּהֲנִים יִהְיֶה
  choice: याजकों की होगी
  rationale: यह पदबंध याजकों के अधिकार में दिए जाने या उनके लिए नियत होने को व्यक्त करता है; संक्षिप्त हिन्दी में इसका कानूनी बल बना रहता है।
- source_word: עֲרִסוֹתֵיכֶם
  choice: तुम्हारे गूँधे हुए आटे
  rationale: संज्ञा गूँथे हुए आटे, आटे की खेप, या उसे गूँधने से जुड़ी वस्तु का संकेत दे सकती है। प्रसंग में चढ़ाए जाने योग्य पहली मात्रा अभिप्रेत है, इसलिए ‘गूँधा हुआ आटा’ चुना गया।
- source_word: לְהָנִיחַ בְּרָכָה אֶל בֵּיתֶךָ
  choice: ताकि तुम्हारे घराने पर आशीष बनी रहे
  rationale: हिफ़िल לְהָנִיחַ आशीष को ठहराने या टिकाए रखने का भाव देता है। ‘बनी रहे’ स्वाभाविक हिन्दी में स्थायी रूप से ठहरने का आशय देता है, और ‘घराना’ בית के पारिवारिक-सामुदायिक अर्थ को स्पष्ट करता है।
theological_decisions:
- issue: घर पर ठहरने वाली आशीष का स्वरूप
  choice: आशीष को व्यापक और अनिर्दिष्ट रखा गया है
  alternative: इसे विशेष रूप से भौतिक समृद्धि या केवल आत्मिक अनुग्रह कहना
  rationale: इब्रानी पाठ आशीष के रूप को निर्धारित नहीं करता। इसलिए अनुवाद उसे न केवल आर्थिक लाभ तक सीमित करता है, न केवल आत्मिक अर्थ देता है।
- issue: भेंट देने और आशीष के बीच संबंध
  choice: उद्देश्य या अपेक्षित परिणाम को ‘ताकि’ से व्यक्त किया गया है
  alternative: इसे यांत्रिक लेन-देन या बिना शर्त समृद्धि की गारंटी के रूप में प्रस्तुत करना
  rationale: לְהָנִיחַ उद्देश्य/परिणाम का भाव व्यक्त करता है, पर पाठ आशीष की कार्यविधि नहीं समझाता; इसलिए कारणात्मक संबंध रखा गया है, पर उसे समृद्धि-सूत्र नहीं बनाया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सहज कानूनी-धार्मिक रजिस्टर रखा गया है। ‘पहली उपज के पहले अंश’ द्वारा मूल इब्रानी की परतदार अभिव्यक्ति बचाई गई है। ‘घराने’ से בית का केवल भवन नहीं, बल्कि परिवार/गृहस्थी वाला आशय स्पष्ट होता है।
