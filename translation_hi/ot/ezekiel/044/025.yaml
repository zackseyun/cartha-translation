source:
  edition: WLC
  text: וְ/אֶל מֵ֣ת אָדָ֔ם לֹ֥א יָב֖וֹא לְ/טָמְאָ֑ה כִּ֣י אִם לְ/אָ֡ב וּ֠/לְ/אֵם וּ/לְ/בֵ֨ן וּ/לְ/בַ֜ת לְ/אָ֗ח וּ/לְ/אָח֛וֹת אֲשֶֽׁר לֹא הָיְתָ֥ה לְ/אִ֖ישׁ יִטַּמָּֽאוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/044/025.yaml
  text: And they shall not go near a dead person to make themselves unclean; but for father or mother[a], for son or daughter, for brother, or for a sister who has not belonged to a man, they may make themselves unclean.
translation:
  language: hi
  text: वे किसी मनुष्य के शव के पास जाकर अपने को अशुद्ध न करें; परन्तु अपने पिता या माता, पुत्र या पुत्री, भाई, अथवा ऐसी बहन के लिए जिसका किसी पुरुष से विवाह न हुआ हो[a], वे अपने को अशुद्ध कर सकते हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक: जो किसी पुरुष की नहीं हुई हो; अर्थात् जिसका विवाह न हुआ हो।'
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵת אָדָם
  choice: किसी मनुष्य के शव
  rationale: यह पदबंध शाब्दिक रूप से ‘मृत मनुष्य’ है और प्रसंग में शव को सूचित करता है। हिन्दी में ‘किसी मनुष्य के शव’ स्वाभाविक है तथा इसे केवल पुरुष तक सीमित नहीं करता।
- source_word: יָבוֹא אֶל
  choice: के पास जाकर
  rationale: याजकीय अशुद्धता के प्रसंग में यह शव के निकट जाने को व्यक्त करता है; ‘के पास जाकर’ उस व्यावहारिक अर्थ को स्पष्ट रखता है।
- source_word: לְטָמְאָה / יִטַּמָּאוּ
  choice: अपने को अशुद्ध न करें / अपने को अशुद्ध कर सकते हैं
  rationale: पहला प्रयोग निषिद्ध परिणाम को और अंतिम अपूर्ण क्रिया कानूनी प्रसंग में अनुमति को व्यक्त करती है। समान शब्दावली दोनों खंडों का संबंध बनाए रखती है।
- source_word: כִּי אִם
  choice: परन्तु
  rationale: यह सामान्य निषेध के बाद निकट संबंधियों के लिए अपवाद प्रस्तुत करता है।
- source_word: לְאָב וּלְאֵם וּלְבֵן וּלְבַת לְאָח וּלְאָחוֹת
  choice: अपने पिता या माता, पुत्र या पुत्री, भाई, अथवा ... बहन के लिए
  rationale: לְ यहाँ उन संबंधियों को चिह्नित करता है जिनके कारण अशुद्ध होना अनुमत है। हिन्दी में संबंध स्पष्ट करने के लिए ‘अपने’ स्वाभाविक रूप से जोड़ा गया है।
- source_word: אֲשֶׁר לֹא הָיְתָה לְאִישׁ
  choice: जो किसी पुरुष की नहीं हुई हो
  rationale: यह हिब्रू संबंधसूचक मुहावरे की अस्पष्टता को अपेक्षाकृत निकटता से बनाए रखता है; व्यावहारिक अर्थ विवाह न हुई बहन है, जिसे पादटिप्पणी में स्पष्ट किया गया है।
theological_decisions:
- issue: अंतिम יִטַּמָּאוּ का कानूनी बल
  choice: अनुमति—‘वे अपने को अशुद्ध कर सकते हैं’
  alternative: आज्ञा—‘वे अपने को अशुद्ध करें’ अथवा साधारण भविष्य
  rationale: यह निषेध के अपवादों की सूची है, इसलिए क्रिया अनुमति व्यक्त करती है, बाध्यता नहीं।
- issue: बहन संबंधी उपवाक्य אֲשֶׁר לֹא הָיְתָה לְאִישׁ
  choice: मुख्य पाठ में संबंधसूचक अभिव्यक्ति—‘किसी पुरुष की नहीं हुई हो’
  alternative: ‘जिसका विवाह न हुआ हो’ अथवा ‘कुँवारी बहन’
  rationale: मूल का सबसे स्वाभाविक संदर्भ विवाह से है, पर ‘कुँवारी’ मूल से अधिक विशिष्ट होगा। मुख्य पाठ मूल अभिव्यक्ति को बचाता है और पादटिप्पणी सहज अर्थ देती है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण मानक हिन्दी। ‘शव’ और ‘अशुद्ध’ धार्मिक-विधिक प्रसंग के लिए स्पष्ट हैं। मुख्य पाठ में मूल हिब्रू की संबंधसूचक अभिव्यक्ति सुरक्षित रखी गई है, जबकि पादटिप्पणी उसका सहज वैवाहिक अर्थ बताती है।
