source:
  edition: WLC
  text: וְ/אָמַרְתָּ֤ אֶל מֶ֨רִי֙ אֶל בֵּ֣ית יִשְׂרָאֵ֔ל כֹּ֥ה אָמַ֖ר אֲדֹנָ֣/י יְהוִ֑ה רַב לָ/כֶ֛ם מִֽ/כָּל תּוֹעֲבֽוֹתֵי/כֶ֖ם בֵּ֥ית יִשְׂרָאֵֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/044/006.yaml
  text: 'And say to the rebellious house[a], to the house of Israel, ‘Thus says the Lord GOD: Enough of all your abominations, O house of Israel.’'
translation:
  language: hi
  text: 'और विद्रोही जन से, अर्थात् इस्राएल के घराने से, कहो, ‘प्रभु याहवे यों कहते हैं: हे इस्राएल के घराने, तुम्हारे सब घिनौने काम बहुत हो चुके हैं!’'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מֶרִי
  choice: उस विद्रोही
  rationale: इब्रानी संज्ञा एकवचन रूप में ‘विद्रोह’ या लक्षणा से ‘विद्रोही जन/इकाई’ बता सकती है। ‘उस विद्रोही’ मूल के एकवचन और संबोधन को बनाए रखता है; अगला पदबंध स्पष्ट करता है कि संकेत इस्राएल के घराने की ओर है।
- source_word: בֵּית יִשְׂרָאֵל
  choice: इस्राएल का घराना
  rationale: यह वाचा-सम्बन्धी राष्ट्रीय पदवी है। हिन्दी में ‘घराना’ शाब्दिक चित्र और सामूहिक अर्थ दोनों को स्वाभाविक रूप से रखता है।
- source_word: אֲדֹנָי יְהוִה
  choice: प्रभु याहवे
  rationale: אֲדֹנָי को ‘प्रभु’ और परमेश्वर के विशिष्ट नाम יהוה को ‘याहवे’ किया गया है, जिससे दोनों घटक अलग और स्पष्ट रहते हैं।
- source_word: רַב לָכֶם
  choice: अब बहुत हो चुके
  rationale: यह मुहावरा सीमा पार कर चुकने और रोक देने की माँग व्यक्त करता है। हिन्दी में ‘अब बहुत हो चुके’ उसका स्वाभाविक और तीखा बल देता है।
- source_word: תּוֹעֲבוֹתֵיכֶם
  choice: तुम्हारे सब घिनौने काम
  rationale: ‘घिनौने काम’ नैतिक और उपासना-सम्बन्धी विकर्षण का प्रबल अर्थ देता है तथा साधारण पाठक के लिए ‘घृणित वस्तुएँ’ से अधिक स्वाभाविक है।
theological_decisions:
- issue: संयुक्त ईश्वरीय उपाधि אֲדֹנָי יְהוִה का अनुवाद
  choice: प्रभु याहवे
  alternative: प्रभु परमेश्वर
  rationale: यह रूप उपाधि אֲדֹנָי और वाचा-नाम יהוה दोनों को सुरक्षित रखता है और एक को दूसरे में विलीन नहीं करता।
- issue: מֶרִי का व्यक्तिवाचक या भाववाचक अर्थ
  choice: उस विद्रोही
  alternative: विद्रोह / विद्रोही लोग
  rationale: वाक्य में אֶל के बाद संबोधित इकाई और तत्पश्चात ‘इस्राएल के घराने’ का समानाधिकरण व्यक्तिवाचक-सामूहिक अर्थ का समर्थन करता है; फिर भी मूल की अर्थगत गुंजाइश पादटिप्पणी में रखी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, प्रत्यक्ष भविष्यद्वाणी-संबोधन रखा गया है। ‘अर्थात’ समानाधिकरण को स्पष्ट करता है, जबकि [a] मूल इब्रानी के एकवचन और उसकी वास्तविक अर्थगत गुंजाइश को सुरक्षित रखता है।
