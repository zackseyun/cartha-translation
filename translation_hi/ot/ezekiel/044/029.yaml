reference: Ezekiel 44:29
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: הַ/מִּנְחָה֙ וְ/הַ/חַטָּ֣את וְ/הָ/אָשָׁ֔ם הֵ֖מָּה יֹֽאכְל֑וּ/ם וְ/כָל חֵ֥רֶם בְּ/יִשְׂרָאֵ֖ל לָ/הֶ֥ם יִהְיֶֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/044/029.yaml
  text: They shall eat the grain offering[a], the sin offering, and the guilt offering[b], and every devoted thing in Israel shall be theirs.
translation:
  language: hi
  text: वे अन्नबलि, पापबलि[a] और दोषबलि खाएँगे; और इस्राएल में हर एक समर्पित वस्तु[b] उनकी होगी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘शुद्धिकरण-बलि’।
    reason: lexical_alternative
  - marker: b
    text: ‘समर्पित वस्तु’ उस वस्तु के लिए प्रयुक्त हिब्रानी शब्द का अनुवाद है जिसे परमेश्वर के लिए अपरिवर्तनीय रूप से अलग कर दिया गया हो; दूसरे संदर्भों में इसका अर्थ ‘विनाश के लिए समर्पित’ भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמִּנְחָה
  choice: अन्नबलि
  rationale: याजकीय बलिदान-संदर्भ में מִנְחָה अनाज से चढ़ाई जाने वाली विशिष्ट भेंट को दर्शाता है; ‘अन्नबलि’ इसे सामान्य भेंट से अलग और संक्षिप्त रूप में व्यक्त करता है।
- source_word: הַחַטָּאת
  choice: पापबलि
  rationale: यहाँ חַטָּאת पाप अथवा शुद्धिकरण से संबंधित बलिदान का नाम है। ‘पापबलि’ हिन्दी में स्थापित और सहज पद है; ‘शुद्धिकरण-बलि’ वैकल्पिक अर्थ को पादटिप्पणी में रखा गया है।
- source_word: הָאָשָׁם
  choice: दोषबलि
  rationale: אָשָׁם यहाँ दोष या दायित्व से संबंधित विशिष्ट बलिदान है। ‘दोषबलि’ पारंपरिक धार्मिक शब्दावली को बनाए रखते हुए अर्थ को स्पष्ट करता है।
- source_word: הֵמָּה יֹאכְלוּם
  choice: वे … खाएँगे
  rationale: हिब्रानी में कर्ता पर बल और क्रिया में बहुवचन कर्म-प्रत्यय है। हिन्दी में पहले दी गई बलियों की सूची ही स्वाभाविक कर्म बनती है, इसलिए अलग से ‘उन्हें’ जोड़ना आवश्यक नहीं है।
- source_word: חֵרֶם
  choice: हर एक समर्पित वस्तु
  rationale: इस याजकीय संपत्ति-संदर्भ में חֵרֶם परमेश्वर के लिए अपरिवर्तनीय रूप से अलग की गई वस्तु को दर्शाता है। ‘समर्पित वस्तु’ युद्ध-संदर्भ वाले ‘विनाश के लिए अर्पित’ अर्थ को अनुचित रूप से आरोपित नहीं करता।
- source_word: בְּיִשְׂרָאֵל
  choice: इस्राएल में
  rationale: यह वाक्यांश उस समुदाय या क्षेत्र को बताता है जिसमें ऐसी समर्पित वस्तुएँ होती हैं; ‘इस्राएल में’ स्वाभाविक और सटीक है।
- source_word: לָהֶם יִהְיֶה
  choice: उनकी होगी
  rationale: यह हिब्रानी प्रयोग स्वामित्व या अधिकार व्यक्त करता है; ‘उनकी होगी’ कानूनी आवंटन के भाव को सहज हिन्दी में रखता है।
theological_decisions:
- issue: याजकीय आवंटन के संदर्भ में बलिदानों के विशिष्ट नाम
  choice: ‘अन्नबलि,’ ‘पापबलि’ और ‘दोषबलि’ जैसे अलग-अलग पारिभाषिक पद रखना
  alternative: इन्हें सामान्य ‘भेंटों’ के रूप में समतल करना, अथवा ‘शुद्धिकरण-बलि’ और ‘क्षतिपूर्ति-बलि’ जैसे अधिक व्याख्यात्मक पद मुख्य पाठ में रखना
  rationale: पद याजकीय व्यवस्था की अलग-अलग बलि-श्रेणियाँ गिनाता है। उनके भेद को बनाए रखना पाठ की कानूनी और धर्मवैचारिक संरचना सुरक्षित रखता है, जबकि मान्य वैकल्पिक अर्थ पादटिप्पणी में दिया जा सकता है।
- issue: इस संदर्भ में חֵרֶם का अर्थ
  choice: मुख्य पाठ में ‘समर्पित वस्तु’
  alternative: ‘अर्पित वस्तु’ अथवा ‘विनाश के लिए समर्पित वस्तु’
  rationale: यहाँ प्रसंग याजकों को मिलने वाले भाग का है, विनाश का नहीं। चुना हुआ पद परमेश्वर के लिए स्थायी रूप से अलग किए जाने का तकनीकी भाव बनाए रखता है और युद्ध-संबंधी अर्थ को अनावश्यक रूप से नहीं लाता।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य शैली। ‘बलि’ से बने पारिभाषिक संयुक्त शब्द याजकीय सूची के भेदों को स्पष्ट रखते हैं। पादटिप्पणी-चिह्न उन्हीं शब्दों के बाद रखे गए हैं जिनसे वे संबंधित हैं।
