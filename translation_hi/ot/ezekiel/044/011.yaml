  text: וְ/הָי֤וּ בְ/מִקְדָּשִׁ/י֙ מְשָׁ֣רְתִ֔ים פְּקֻדּוֹת֙ אֶל שַׁעֲרֵ֣י הַ/בַּ֔יִת וּֽ/מְשָׁרְתִ֖ים אֶת הַ/בָּ֑יִת הֵ֠מָּה יִשְׁחֲט֨וּ אֶת הָ/עֹלָ֤ה וְ/אֶת הַ/זֶּ֨בַח֙ לָ/עָ֔ם וְ/הֵ֛מָּה יַעַמְד֥וּ לִ/פְנֵי/הֶ֖ם לְ/שָֽׁרְתָֽ/ם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/044/011.yaml
  text: Yet they shall be ministers in my sanctuary[a], having oversight at the gates of the temple and ministering in the temple. They shall slaughter the burnt offering and the sacrifice for the people[c][b], and they shall stand before them to minister to them.
translation:
  language: hi
  text: फिर भी वे मेरे पवित्रस्थान में सेवक होंगे। वे मंदिर के फाटकों की देखरेख का दायित्व सँभालेंगे[a] और मंदिर[b] में सेवा करेंगे। वे लोगों के लिए[c] होमबलि और बलि के पशुओं का वध करेंगे, और उनके सामने खड़े रहकर उनकी सेवा करेंगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “मंदिर के फाटकों पर सौंपे गए काम करेंगे।”
    reason: lexical_alternative
  - marker: b
    text: मूल इब्रानी में “भवन” या “घर”; इस मंदिर-दर्शन में इसका आशय मंदिर से है।
    reason: lexical_alternative
  - marker: c
    text: या “लोगों की ओर से।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיוּ
  choice: फिर भी वे ... होंगे
  rationale: पूर्ववर्ती प्रसंग में उनके याजकीय निकट आने पर रोक और यहाँ उन्हें दिए गए सीमित सेवा-कार्य के बीच निहित विरोध को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: מְשָׁרְתִים / וּמְשָׁרְתִים / לְשָׁרְתָם
  choice: सेवक / सेवा करेंगे / उनकी सेवा करने के लिए
  rationale: शׁרת मंदिर-संबंधी नियत सेवा को दर्शाता है। हिन्दी में ‘सेवा’ इस धार्मिक संदर्भ को बनाए रखते हुए सहज और सुसंगत है।
- source_word: פְּקֻדּוֹת
  choice: देखरेख का दायित्व सँभालेंगे
  rationale: यहाँ शब्द फाटकों पर सौंपी गई जिम्मेदारी, निगरानी या कार्यभार को दर्शाता है; यह अनुष्ठान-विधियों का उल्लेख नहीं है।
- source_word: שַׁעֲרֵי הַבַּיִת / הַבָּיִת
  choice: मंदिर के फाटक / मंदिर
  rationale: यहेजकेल के इस दर्शन में בַּיִת का संदर्भ मंदिर-भवन अथवा मंदिर-परिसर से है; ‘मंदिर’ आधुनिक हिन्दी में संदर्भ को स्पष्ट करता है।
- source_word: הָעֹלָה
  choice: होमबलि
  rationale: עֹלָה के लिए प्रचलित और सटीक हिन्दी धार्मिक पद, जिसमें पूरी तरह जलाकर चढ़ाई जाने वाली बलि का भाव है।
- source_word: הַזֶּבַח
  choice: बलि
  rationale: यह व्यापक बलिदान-संबंधी शब्द है; इसे किसी विशेष प्रकार, जैसे मेलबलि, तक सीमित नहीं किया गया।
- source_word: יִשְׁחֲטוּ אֶת הָעֹלָה וְאֶת הַזֶּבַח
  choice: होमबलि और बलि के पशुओं का वध करेंगे
  rationale: हिन्दी में बलि को ‘वध करना’ अस्वाभाविक है, इसलिए निहित बलि-पशुओं को स्पष्ट किया गया है, जबकि दोनों बलि-श्रेणियाँ सुरक्षित रखी गई हैं।
- source_word: לָעָם
  choice: लोगों के लिए
  rationale: ל लाभ अथवा प्रतिनिधित्व का संबंध दिखा सकता है। ‘लोगों के लिए’ संक्षिप्त और स्वाभाविक है तथा ‘लोगों की ओर से’ की संभावना को पादटिप्पणी में रखा गया है।
- source_word: יַעַמְדוּ לִפְנֵיהֶם
  choice: उनके सामने उपस्थित रहेंगे
  rationale: मूल ‘उनके सामने खड़े होंगे’ में तत्पर उपस्थिति और परिचर्या का भाव है। ‘उपस्थित रहेंगे’ हिन्दी में वही कार्यात्मक अर्थ स्वाभाविक रूप से देता है।
theological_decisions:
- issue: पवित्रस्थान में इन लेवियों की भूमिका
  choice: उन्हें अधीनस्थ मंदिर-सेवा सौंपी जाती है, न कि परमेश्वर के निकट आने वाली पूर्ण याजकीय सेवा।
  alternative: वे पूर्ण याजकीय सेवक बने रहते हैं।
  rationale: निकटवर्ती प्रसंग उन लेवियों को उन याजकों से अलग करता है जिन्हें यहोवा के निकट आने की अनुमति है। फाटकों की देखरेख, लोगों के बलि-पशुओं का वध और लोगों की परिचर्या यहाँ सीमित, अधीनस्थ कार्य हैं।
- issue: לָעָם में संबंध
  choice: लोगों के लिए
  alternative: लोगों की ओर से
  rationale: इब्रानी संबंध लाभ और प्रतिनिधित्व दोनों की छाया रख सकता है। मुख्य पाठ अधिक सामान्य रूप रखता है और वैकल्पिक अर्थ पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए स्पष्ट रखी गई है। ‘पवित्रस्थान’, ‘होमबलि’ और ‘बलि’ जैसे स्थापित धार्मिक पद बनाए गए हैं; प्रशासनिक भाव के लिए ‘देखरेख का दायित्व’ तथा परिचर्या के भाव के लिए ‘उपस्थित रहेंगे’ चुना गया है।
