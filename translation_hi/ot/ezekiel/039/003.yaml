translation:
  language: hi
  text: और मैं तेरे बाएँ हाथ से तेरा धनुष मार गिराऊँगा, और तेरे दाएँ हाथ से तेरे तीर गिरा दूँगा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהִכֵּיתִי
  choice: और मैं…ऐसा प्रहार करूँगा
  rationale: נכה के हिफ़ील रूप में यहाँ हथियार पर वार करके उसे हाथ से छुड़ा देने का भाव है। ‘प्रहार करूँगा’ मूल क्रिया की शक्ति बनाए रखता है, और ‘ऐसा…कि’ हिन्दी में उसके परिणाम को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: קַשְׁתְּךָ
  choice: तेरे धनुष
  rationale: קֶשֶׁת का सामान्य अर्थ युद्ध में प्रयुक्त ‘धनुष’ है; द्वितीय पुरुष एकवचन पुल्लिंग प्रत्यय को ‘तेरे’ से व्यक्त किया गया है।
- source_word: מִיַּד שְׂמֹאולֶךָ
  choice: तेरे बाएँ हाथ से
  rationale: शाब्दिक अर्थ ‘तेरे बाएँ [पक्ष] के हाथ से’ है। हिन्दी में ‘तेरे बाएँ हाथ से’ सहज है और ठोस शारीरिक बिंब बनाए रखता है।
- source_word: וְחִצֶּיךָ
  choice: और तेरे तीरों को
  rationale: חֵץ के बहुवचन तथा द्वितीय पुरुष एकवचन पुल्लिंग प्रत्यय को ‘तेरे तीरों’ से व्यक्त किया गया है; हिन्दी वाक्य-रचना के अनुसार ‘को’ जोड़ा गया है।
- source_word: מִיַּד יְמִינְךָ
  choice: तेरे दाएँ हाथ से
  rationale: यह पहले खंड के ‘बाएँ हाथ’ के समानांतर है। अनुवाद उस समानांतरता और मूल के ठोस बिंब दोनों को बनाए रखता है।
- source_word: אַפִּיל
  choice: गिरा दूँगा
  rationale: यह נפל का हिफ़ील रूप है और कारणवाचक अर्थ देता है—‘गिरने दूँगा/गिरा दूँगा।’ ‘गिरा दूँगा’ आधुनिक हिन्दी में संक्षिप्त, स्वाभाविक और स्पष्ट है तथा यह नहीं कहता कि तीर नष्ट कर दिए जाएँगे।
theological_decisions: []
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सीधे संबोधन वाली रखी गई है। ‘तेरे’ का प्रयोग निकटवर्ती भविष्यवाणी-संबंधी संबोधन और एकवचन पुल्लिंग रूप को स्पष्ट करता है। पहले खंड में मूल के ‘प्रहार’ तथा उससे धनुष के हाथ से छूटने—दोनों भावों को स्वाभाविक हिन्दी में जोड़ा गया है।
