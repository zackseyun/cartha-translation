source:
  edition: WLC
  text: וְ/שִׁלַּחְתִּי אֵ֣שׁ בְּ/מָג֔וֹג וּ/בְ/יֹשְׁבֵ֥י הָ/אִיִּ֖ים לָ/בֶ֑טַח וְ/יָדְע֖וּ כִּי אֲנִ֥י יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/039/006.yaml
  text: And I will send fire on Magog and on those who live securely in the coastlands[a], and they will know that I am Yahweh.
translation:
  language: hi
  text: और मैं मागोग पर और तटवर्ती प्रदेशों[a] में निश्चिंत रहने वालों पर आग भेजूँगा, और वे जानेंगे कि मैं याहवे हूँ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “द्वीपों में।” हिब्रू शब्द का अर्थ ‘द्वीप’ हो सकता है या भविष्यसूचक प्रयोग में अधिक व्यापक रूप से दूरस्थ तटवर्ती प्रदेश।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשִׁלַּחְתִּי
  choice: और मैं ... भेजूँगा
  rationale: भविष्यसूचक वाणी में संयोजक सहित हिफ़ील पूर्ण क्रिया को स्वाभाविक हिन्दी भविष्यकाल में रखा गया है; आग के साथ ‘भेजूँगा’ सीधा और सहज है।
- source_word: אֵשׁ
  choice: आग
  rationale: मूल शब्द और न्याय के भविष्यसूचक बिंब दोनों को बिना व्याख्यात्मक विस्तार के अक्षरशः बनाए रखता है।
- source_word: בְּמָגוֹג
  choice: मागोग पर
  rationale: विनाशकारी आग के लक्ष्य को व्यक्त करने के लिए ב का स्वाभाविक हिन्दी रूप ‘पर’ है; मागोग व्यक्तिवाचक नाम के रूप में लिप्यंतरित है।
- source_word: וּבְיֹשְׁבֵי הָאִיִּים לָבֶטַח
  choice: और समुद्री तटवर्ती देशों में निश्चिंत बसे लोगों पर
  rationale: יֹשְׁבֵי को ‘बसे लोगों’, הָאִיִּים को व्यापक भविष्यसूचक अर्थ में ‘समुद्री तटवर्ती देशों’, और לָבֶטַח को उन्हीं निवासियों की सुरक्षित अवस्था बताने वाले ‘निश्चिंत’ के रूप में प्रस्तुत किया गया है।
- source_word: הָאִיִּים
  choice: समुद्री तटवर्ती देश
  rationale: यह शब्द द्वीपों के साथ व्यापक समुद्रतटीय या दूरस्थ समुद्री भूभागों को भी सूचित कर सकता है; मुख्य पाठ में व्यापक अर्थ रखा गया और विकल्प पादटिप्पणी में दिया गया है।
- source_word: לָבֶטַח
  choice: निश्चिंत
  rationale: यह सुरक्षा और चिंता-रहित अवस्था व्यक्त करता है तथा हिन्दी में ‘बसे लोगों’ को स्वाभाविक रूप से विशेषित करता है।
- source_word: וְיָדְעוּ
  choice: तब वे जानेंगे
  rationale: हिब्रू क्रम का परिणामार्थक संबंध हिन्दी में ‘तब’ से स्वाभाविक रूप से स्पष्ट होता है, बिना आशय बदले।
- source_word: יְהוָה
  choice: यहोवा
  rationale: चतुरक्षरीय परमेश्वर-नाम को किसी उपाधि से बदलने के बजाय हिन्दी में प्रचलित व्यक्तिगत नाम ‘यहोवा’ के रूप में रखा गया है।
theological_decisions:
- issue: יְהוָה परमेश्वर-नाम का अनुवाद
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: मूल पाठ व्यक्तिगत परमेश्वर-नाम का प्रयोग करता है। हिन्दी पाठकों के लिए सुस्थापित लिप्यंतरण ‘यहोवा’ नाम को नाम ही रहने देता है, उपाधि में नहीं बदलता।
- issue: לָבֶטַח का संबंध
  choice: समुद्री तटवर्ती देशों में बसे लोगों से—‘निश्चिंत बसे लोग’
  alternative: पूरे उपवाक्य से ढीले रूप में—‘सुरक्षा में’
  rationale: वाक्य-विन्यास में यह पद सबसे स्वाभाविक रूप से निवासियों की अवस्था बताता है; इसलिए उसे मागोग या समूची क्रिया से नहीं जोड़ा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सामान्य पाठकों के लिए स्पष्ट रूप अपनाया गया है। ‘निश्चिंत बसे’ सुरक्षा की अवस्था को स्वाभाविक ढंग से व्यक्त करता है; ‘समुद्री तटवर्ती देश’ मूल की भौगोलिक व्यापकता बनाए रखता है।
