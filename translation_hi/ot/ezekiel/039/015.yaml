source:
  edition: WLC
  text: וְ/עָבְר֤וּ הָ/עֹֽבְרִים֙ בָּ/אָ֔רֶץ וְ/רָאָה֙ עֶ֣צֶם אָדָ֔ם וּ/בָנָ֥ה אֶצְל֖/וֹ צִיּ֑וּן עַ֣ד קָבְר֤וּ אֹת/וֹ֙ הַֽ/מְקַבְּרִ֔ים אֶל גֵּ֖יא הֲמ֥וֹן גּֽוֹג־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/039/015.yaml
  text: And those who pass through the land will pass through[a], and when one sees a human bone[b], he will set up a marker beside it until the buriers have buried it in the Valley of Hamon-gog.
translation:
  language: hi
  text: और देश में होकर गुजरनेवाले लोग वहाँ से गुजरेंगे। जब उनमें से कोई किसी मनुष्य की हड्डी[a] देखेगा, तो वह उसके पास एक निशान खड़ा करेगा, जब तक कि दफनानेवाले उसे हामोन-गोग की घाटी[b] में दफना न दें।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘आदमी की हड्डी।’ इब्रानी शब्द ‘आदम’ का अर्थ ‘मनुष्य’ हो सकता है और वह सामान्य रूप से किसी मानव को भी सूचित कर सकता है; यहाँ दफनाने की प्रक्रिया के प्रसंग में सामान्य अर्थ अधिक उपयुक्त है।
    reason: lexical_alternative
  - marker: b
    text: हामोन-गोग का सम्भावित अर्थ ‘गोग की भीड़’ या ‘गोग का जनसमूह’ है, लेकिन यहाँ इसे स्थान-नाम के रूप में रखा गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָבְרוּ הָעֹבְרִים בָּאָרֶץ
  choice: जो लोग देश में से होकर जाएँगे, वे उसमें से होकर जाएँगे
  rationale: क्रिया עבר और उसी मूल के कृदन्त की इब्रानी पुनरुक्ति को बनाए रखा गया है। ‘देश’ यहाँ प्रसंग में आनेवाले भूभाग को सूचित करता है, पूरी पृथ्वी को नहीं।
- source_word: וְרָאָה
  choice: जब उनमें से कोई … देखेगा
  rationale: रूप की दृष्टि से क्रिया पुल्लिंग एकवचन है, पर पिछले बहुवचन समूह के किसी भी व्यक्ति के लिए सामान्य रूप से प्रयुक्त हुई है। यह रूप विधि या प्रक्रिया का भाव स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: עֶצֶם אָדָם
  choice: मनुष्य की कोई हड्डी
  rationale: עֶצֶם का अर्थ ‘हड्डी’ है और אָדָם यहाँ किसी पुरुष-विशेष के बजाय सामान्य मानव-सन्दर्भ रखता है। ‘कोई’ मिली हुई अनिर्दिष्ट हड्डी का भाव स्पष्ट करता है।
- source_word: וּבָנָה אֶצְלוֹ צִיּוּן
  choice: वह उसके पास एक चिह्न खड़ा कर देगा
  rationale: בנה का मूल अर्थ ‘बनाना’ है, लेकिन दफनाने की इस प्रक्रिया में צִיּוּן किसी स्थान-सूचक निशान को बताता है; इसलिए ‘चिह्न खड़ा करना’ स्वाभाविक और प्रसंगानुकूल है। אֶצְלוֹ को ‘उसके पास’ के रूप में रखा गया है।
- source_word: עַד קָבְרוּ אֹתוֹ הַמְקַבְּרִים
  choice: जब तक कि गाड़नेवाले उसे … गाड़ न दें
  rationale: קבר और उससे बने कृदन्त के मूल-संबंध को ‘गाड़नेवाले … गाड़’ द्वारा बनाए रखा गया है। ‘जब तक कि … न दें’ हिन्दी में अपेक्षित भावी कार्य की सीमा स्वाभाविक ढंग से व्यक्त करता है।
- source_word: אֶל גֵּיא הֲמוֹן גּוֹג
  choice: हामोन-गोग की घाटी में
  rationale: हामोन-गोग को स्थापित स्थान-नाम मानकर लिप्यन्तरित किया गया है। אֶל दिशा बता सकता है, पर ‘गाड़ना’ के साथ हिन्दी में गन्तव्य स्थान के लिए ‘घाटी में’ अधिक स्वाभाविक है।
theological_decisions:
- issue: सामान्य मानव-सन्दर्भ में אָדָם का अनुवाद
  choice: मनुष्य
  alternative: आदमी / पुरुष
  rationale: यह पद किसी भी मानव के मिले हुए अवशेष की बात करता है, केवल पुरुष के अवशेष की नहीं। ‘मनुष्य’ सामान्य मानव-सन्दर्भ को गरिमापूर्ण और सही रूप से व्यक्त करता है।
- issue: हֲמוֹן גּוֹג को अर्थानुवाद करना या स्थान-नाम बनाए रखना
  choice: हामोन-गोग
  alternative: गोग की भीड़ / गोग का जनसमूह
  rationale: निकटवर्ती प्रसंग में यह घाटी के नाम के रूप में कार्य करता है। लिप्यन्तरण स्थान-नाम को सुरक्षित रखता है, जबकि सम्भावित अर्थ पादटिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण और प्रक्रियात्मक वर्णन रखा गया है। इब्रानी की ध्यान देने योग्य पुनरुक्ति को जानबूझकर सुरक्षित रखा गया है, जबकि अस्वाभाविक शाब्दिकता से बचा गया है।
