  text: וּ/קְבָרוּ/ם֙ בֵּ֣ית יִשְׂרָאֵ֔ל לְמַ֖עַן טַהֵ֣ר אֶת הָ/אָ֑רֶץ שִׁבְעָ֖ה חֳדָשִֽׁים־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/039/012.yaml
  text: The house of Israel will bury them for seven months[a], in order to cleanse the land.
translation:
  language: hi
  text: इस्राएल का घराना उन्हें सात महीने तक दफ़नाता रहेगा, ताकि देश शुद्ध हो जाए।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּקְבָרוּם
  choice: उन्हें ... दफ़नाता रहेगा
  rationale: קבר का अर्थ ‘दफ़नाना’ है और 3 पुं. बहु. प्रत्यय को ‘उन्हें’ से व्यक्त किया गया है। भविष्यसूचक क्रम तथा सात महीने की अवधि के कारण हिन्दी में निरंतर भविष्य ‘दफ़नाता रहेगा’ स्वाभाविक है; सामूहिक कर्ता ‘इस्राएल का घराना’ होने से क्रिया एकवचन रखी गई है।
- source_word: בֵּית יִשְׂרָאֵל
  choice: इस्राएल का घराना
  rationale: यह नबूवतों में प्रयुक्त सामूहिक और वाचा-संबंधी पद है। ‘घराना’ आधुनिक हिन्दी में बोधगम्य रहते हुए मूल रूपक और सामूहिक बल को बनाए रखता है।
- source_word: לְמַעַן
  choice: ताकि
  rationale: यह उद्देश्य प्रकट करता है; ‘ताकि’ आधुनिक हिन्दी में संक्षिप्त और स्वाभाविक है।
- source_word: טַהֵר
  choice: शुद्ध करे
  rationale: पिएल रूप यहाँ शवों से उत्पन्न अशुद्धता हटाने, अर्थात देश को शुद्ध करने, का भाव रखता है। ‘शुद्ध करे’ भौतिक और अनुष्ठानिक दोनों आयामों को खुला रखता है।
- source_word: אֶת־הָאָרֶץ
  choice: देश को
  rationale: संदर्भ इस्राएल के भूभाग का है, पूरी पृथ्वी का नहीं; हिन्दी में इस राजनीतिक-भौगोलिक और वाचा-संबंधी संदर्भ के लिए ‘देश’ स्वाभाविक है।
- source_word: שִׁבְעָה חֳדָשִׁים
  choice: सात महीने तक
  rationale: यह अवधि बताने वाला पद है; हिन्दी में ‘तक’ दफ़नाने की गतिविधि की पूरी समयावधि स्वाभाविक ढंग से व्यक्त करता है।
theological_decisions:
- issue: देश की शुद्धि का स्वरूप
  choice: ‘शुद्ध करे’ द्वारा शवों से हुई भौतिक तथा अनुष्ठानिक अशुद्धता—दोनों की संभावना बनाए रखना
  alternative: देश को साफ़ करे
  rationale: संदर्भ शवों के कारण देश की अशुद्धता और उसे दूर करने का है। ‘शुद्ध’ मूल क्रिया טהר के धार्मिक-अनुष्ठानिक संकेत को बनाए रखता है, पर किसी बाद की सिद्धान्तगत व्याख्या को आरोपित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। ‘इस्राएल का घराना’ नबूवती पदावली को सुरक्षित रखता है; ‘दफ़नाता रहेगा’ सात महीने तक चलने वाली सामूहिक प्रक्रिया को सहज हिन्दी में व्यक्त करता है।
