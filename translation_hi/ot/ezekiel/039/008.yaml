source:
  edition: WLC
  text: הִנֵּ֤ה בָאָה֙ וְ/נִֽהְיָ֔תָה נְאֻ֖ם אֲדֹנָ֣/י יְהוִ֑ה ה֥וּא הַ/יּ֖וֹם אֲשֶׁ֥ר דִּבַּֽרְתִּי׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/039/008.yaml
  text: Behold[a], it is coming, and it will happen, declares the Lord GOD. This is the day of which I have spoken.
translation:
  language: hi
  text: “देखो[a], वह आ रही है और वह घटित होगी”—प्रभु याहवे की घोषणा है। “यही वह दिन है जिसके विषय में मैंने कहा था।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक शाब्दिक रूप से: “देखो, वह आ चुकी है और वह घटित हो चुकी है।” इब्रानी में यहाँ ऐसे पूर्ण क्रिया-रूप हैं जो भावी घटना को इतना निश्चित दिखा सकते हैं कि उसे मानो पहले ही घट चुकी घटना के रूप में कहा गया है।'
    reason: कालगत और शाब्दिक वैकल्पिक अनुवाद को सुरक्षित रखना
lexical_decisions:
- source_word: הִנֵּה
  choice: देखो
  rationale: यह ध्यान आकर्षित करने वाला भविष्यसूचक उद्गार है। ‘देखो’ आधुनिक हिन्दी में स्वाभाविक रहते हुए घोषणा की तात्कालिकता और गंभीरता बनाए रखता है।
- source_word: בָאָה
  choice: वह आ रहा है
  rationale: रूप व्याकरण की दृष्टि से पूर्णकाल, स्त्रीलिंग एकवचन है, पर भविष्यसूचक संदर्भ में निश्चित भावी घटना को मानो घट चुकी हो ऐसे प्रस्तुत कर सकता है। हिन्दी में निहित घटना के लिए ‘वह आ रहा है’ आसन्नता को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: וְנִהְיָתָה
  choice: और अवश्य घटित होगा
  rationale: היה से बना यह रूप किसी बात के अस्तित्व में आने या घटित होने को बताता है। ‘अवश्य’ मूल के निश्चितता-भाव को व्यक्त करता है, जबकि ‘घटित होगा’ आधुनिक हिन्दी में स्पष्ट है।
- source_word: נְאֻם
  choice: की घोषणा है
  rationale: यह भविष्यद्वक्ताओं में प्रचलित ईश्वरीय वचन-सूत्र है। ‘की घोषणा है’ हिन्दी में गरिमापूर्ण और समझने योग्य है।
- source_word: אֲדֹנָי יְהוִה
  choice: प्रभु याहवे
  rationale: אֲדֹנָי को ‘प्रभु’ और परमेश्वर के व्यक्तिगत नाम יהוה को ‘याहवे’ रखा गया है, जिससे संयुक्त उपाधि और वाचा का नाम दोनों स्पष्ट रहते हैं।
- source_word: הוּא הַיּוֹם
  choice: यही वह दिन है
  rationale: הוּא का बलाघात पहचान पर है। ‘यही’ उस दिन को पहले कही गई घटना से स्पष्ट रूप से जोड़ता है।
- source_word: אֲשֶׁר דִּבַּרְתִּי
  choice: जिसके विषय में मैंने कहा था
  rationale: सापेक्ष वाक्यांश दिन को परमेश्वर की पूर्व घोषणा से जोड़ता है। ‘कहा था’ सहज आधुनिक हिन्दी है और पूर्व में बोले गए वचन का भाव बनाए रखता है।
theological_decisions:
- issue: संयुक्त ईश्वरीय उपाधि אֲדֹנָי יְהוִה का अनुवाद
  choice: प्रभु याहवे
  alternative: प्रभु परमेश्वर
  rationale: मूल पाठ में सामान्य उपाधि אֲדֹנָי के साथ विशिष्ट नाम יהוה है। ‘प्रभु याहवे’ दोनों के भेद को सुरक्षित रखता है और नाम को सामान्य संज्ञा में नहीं बदलता।
- issue: पूर्ण क्रिया-रूपों का कालगत अर्थ
  choice: 'निश्चित भावी घटना: ‘आ रहा है और अवश्य घटित होगा’'
  alternative: 'पूर्ण घटना: ‘आ चुका है और घटित हो चुका है’'
  rationale: निकटवर्ती संदर्भ भावी न्याय की घोषणा करता है। फिर भी इब्रानी पूर्ण रूप की वास्तविक अस्पष्टता और भविष्यसूचक निश्चितता को पाद-टिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण भविष्यसूचक शैली रखी गई है। ‘देखो’ और ‘घोषणा’ ऊँचे स्वर को बनाए रखते हैं, जबकि वाक्य-रचना सामान्य पाठक के लिए स्पष्ट है।
