  text: וְ/נָשׂוּ֙ אֶת כְּלִמָּתָ֔/ם וְ/אֶת כָּל מַעֲלָ֖/ם אֲשֶׁ֣ר מָעֲלוּ בִ֑/י בְּ/שִׁבְתָּ֧/ם עַל אַדְמָתָ֛/ם לָ/בֶ֖טַח וְ/אֵ֥ין מַחֲרִֽיד־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/039/026.yaml
  text: They will bear their shame and all their unfaithfulness by which they were unfaithful to me[a], when they dwell securely on their land with no one to make them afraid.
translation:
  language: hi
  text: वे अपनी लज्जा और अपनी सारी बेवफाई का भार उठाएँगे, जो उन्होंने मेरे प्रति की थी,[a] जब वे अपनी भूमि पर सुरक्षित रहेंगे और उन्हें डराने वाला कोई न होगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वे अपनी लज्जा और अपनी सारी बेवफाई भूल जाएँगे।” प्राचीन संस्करणों को ध्यान में रखने वाले कुछ अनुवाद यहाँ क्रिया का यह प्रासंगिक अर्थ लेते हैं, पर हिब्रू का सबसे सीधा अर्थ “उठाएँगे” है।
    reason: alternative_reading
lexical_decisions:
- source_word: וְנָשׂוּ
  choice: जिम्मेदारी उठाएँगे
  rationale: נשׂא का सीधा अर्थ ‘उठाना/ढोना/सहना’ है। ‘जिम्मेदारी उठाना’ हिन्दी में लज्जा और विश्वासघात के संबंध में स्वाभाविक है और ‘भूल जाना’ वाले प्रासंगिक वैकल्पिक अर्थ को मुख्य पाठ में नहीं अपनाता।
- source_word: כְּלִמָּתָם
  choice: अपनी लज्जा
  rationale: כְּלִמָּה लज्जा, अपमान या बदनामी को सूचित करता है; ‘लज्जा’ संक्षिप्त, गरिमापूर्ण और प्रसंगानुकूल है।
- source_word: מַעֲלָם / מָעֲלוּ
  choice: विश्वासघात ... किया था
  rationale: מעל संज्ञा और क्रिया विश्वास या वाचा तोड़ने का भाव रखते हैं। हिन्दी में अनावश्यक पुनरुक्ति से बचते हुए ‘सारी विश्वासघात ... किया था’ उसी संबंधपरक गंभीरता को व्यक्त करता है।
- source_word: בִי
  choice: मेरे प्रति
  rationale: מעל के साथ ב उस व्यक्ति को दर्शाता है जिसके प्रति विश्वासघात किया गया; ‘मेरे प्रति’ संबंधपरक दिशा को स्वाभाविक हिन्दी में रखता है।
- source_word: בְּשִׁבְתָּם
  choice: जब वे ... बसे होंगे
  rationale: ב के साथ infinitive construct काल या परिस्थिति बताता है। भावी पुनर्स्थापना के संदर्भ में ‘जब ... बसे होंगे’ स्वाभाविक है।
- source_word: עַל אַדְמָתָם
  choice: अपनी भूमि पर
  rationale: אֲדָמָה भूमि/धरती है; ‘अपनी भूमि पर’ यहेजकेल में देश में पुनर्स्थापना के विषय को सुरक्षित रखता है।
- source_word: לָבֶטַח
  choice: निडर
  rationale: यह क्रियाविशेषणात्मक प्रयोग सुरक्षा और भयमुक्त निवास का भाव देता है। अगले वाक्यांश के साथ ‘निडर बसे होंगे’ संक्षिप्त और स्वाभाविक है।
- source_word: וְאֵין מַחֲרִיד
  choice: उन्हें डराने वाला कोई न होगा
  rationale: यह किसी भय उत्पन्न करने वाले व्यक्ति या खतरे के अभाव को व्यक्त करता है और हिब्रू की कर्ता-सूचक बारीकी को बनाए रखता है।
theological_decisions:
- issue: पुनर्स्थापना के संदर्भ में וְנָשׂוּ का अर्थ
  choice: हिब्रू के प्रत्यक्ष अर्थ ‘उठाना/सहना’ को बनाए रखते हुए ‘जिम्मेदारी उठाएँगे’
  alternative: वे अपनी लज्जा और अपना सारा विश्वासघात भूल जाएँगे
  rationale: मूल हिब्रू सबसे सीधे तौर पर लज्जा को उठाने या सहने की बात करता है, न कि भूलने की। मुख्य पाठ में इसे बनाए रखने से यह धार्मिक तनाव भी बना रहता है कि पुनर्स्थापित लोग अपने पिछले विश्वासघात की लज्जा या जवाबदेही उठाते हैं। वैकल्पिक प्रासंगिक पाठ को पाद-टिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण और सामान्य पाठक के लिए सहज। ‘निडर बसे होंगे’ सुरक्षा के भाव को स्वाभाविक रूप से व्यक्त करता है। पाद-टिप्पणी का चिह्न [a] मुख्य पाठ में उसी कथन के बाद रखा गया है जिस पर वैकल्पिक पाठ लागू होता है।
