- source_word: חַיַּת הַשָּׂדֶה
  choice: मैदान के हर जंगली पशु
  rationale: यह खुले देश में रहने वाले जंगली भूचर पशुओं के लिए प्रयुक्त सामान्य इब्रानी पद है।
- source_word: הִקָּבְצוּ ... הֵאָסְפוּ
  choice: इकट्ठे हो ... जमा हो जाओ
