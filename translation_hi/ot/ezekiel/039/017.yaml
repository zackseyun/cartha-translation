base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/039/017.yaml
  text: 'And you[a], son of man, thus says the Lord GOD: Say to every bird of every wing and to every beast of the field, ‘Gather yourselves and come; assemble from all around to my sacrifice that I am sacrificing for you, a great sacrifice on the mountains of Israel[b], and you shall eat flesh and drink blood.’'
translation:
  language: hi
  text: 'और तू, हे मनुष्य-पुत्र, प्रभु याहवे यों कहते हैं: हर प्रकार के पक्षी और खुले मैदान के हर जंगली पशु से कह, ‘इकट्ठे हो और आओ; चारों ओर से मेरे उस बलिदान[a] के लिए जमा हो जाओ, जिसे मैं तुम्हारे लिए चढ़ा रहा हूँ—इस्राएल के पहाड़ों पर एक बड़ा बलिदान। तुम मांस खाओगे और खून पियोगे।’'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “बलिदान” का अर्थ यहाँ “बलिदानी भोज” भी हो सकता है। इब्रानी में “बलिदान” संज्ञा के साथ उसी मूल की क्रिया “बलिदान चढ़ाना” आई है, जिससे बलिदानी दृश्य पर जोर पड़ता है।
    reason: lexical_alternative
lexical_decisions:
