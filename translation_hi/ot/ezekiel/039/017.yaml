  choice: उस बलिदान के लिए ... जिसे मैं तुम्हारे लिए बलि कर रहा हूँ
  rationale: संज्ञा זֶבַח और उसी मूल की क्रिया זבח की जानबूझकर की गई पुनरावृत्ति को ‘बलिदान ... बलि कर रहा हूँ’ में सुरक्षित रखा गया है।
- source_word: זֶבַח גָּדוֹל
  choice: एक महान बलिदान
  rationale: ‘बलिदान’ धार्मिक-बलिदानी दृश्य को स्पष्ट रखता है, जबकि भोज का पहलू आगे मांस खाने और खून पीने से प्रकट होता है।
- source_word: הָרֵי יִשְׂרָאֵל
  choice: इस्राएल के पहाड़ों पर
  rationale: यहेजकेल में बार-बार आने वाले भौगोलिक पद का सीधा और स्वाभाविक अनुवाद है।
- source_word: וַאֲכַלְתֶּם בָּשָׂר וּשְׁתִיתֶם דָּם
  choice: तुम मांस खाओगे और खून पियोगे
  rationale: पक्षियों और पशुओं को संबोधित न्याय के इस वीभत्स चित्र को बिना नरम किए सीधा रखा गया है।
theological_decisions:
- issue: संयुक्त ईश्वरीय उपाधि אֲדֹנָי יְהוִה में יהוה का अनुवाद
  choice: प्रभु यहोवा
  alternative: प्रभु याहवे
  rationale: पाठ में उपाधि אֲדֹנָי और व्यक्तिगत वाचा-नाम יהוה दोनों हैं। हिन्दी बाइबल परंपरा में व्यापक रूप से पहचाने जाने वाले ‘यहोवा’ से नाम को सामान्य उपाधि में विलीन किए बिना सुरक्षित रखा गया है।
- issue: זֶבַח का बलिदान अथवा बलिदानी भोज के रूप में अर्थ
  choice: बलिदान
  alternative: बलिदानी भोज
  rationale: शब्द दोनों अर्थ-छायाएँ रख सकता है। मुख्य पाठ में ‘बलिदान’ से धार्मिक और न्याय-संबंधी तनाव बना रहता है; खाने-पीने का संदर्भ भोज की अर्थ-छाया स्वयं स्पष्ट करता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण भविष्यद्वाणी-संबंधी स्वर रखा गया है। ‘यों कहते हैं’, ‘मनुष्य के पुत्र’ और ‘बलिदान’ जैसे परिचित बाइबलीय पद बनाए गए हैं, पर अत्यधिक पुरातन रूपों से बचा गया है।
