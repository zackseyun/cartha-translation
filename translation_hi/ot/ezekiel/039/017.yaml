- source_word: אֲדֹנָי יְהוִה
  choice: प्रभु यहोवा
  rationale: दोनों पदों को अलग रखते हुए अֲדֹנָי को ‘प्रभु’ और वाचा-नाम יהוה को ‘यहोवा’ किया गया है।
