source:
  edition: WLC
  text: וְ/הָיָ֣ה בַ/יּ֣וֹם הַ/ה֡וּא אֶתֵּ֣ן לְ/גוֹג֩ מְקֽוֹם שָׁ֨ם קֶ֜בֶר בְּ/יִשְׂרָאֵ֗ל גֵּ֤י הָ/עֹֽבְרִים֙ קִדְמַ֣ת הַ/יָּ֔ם וְ/חֹסֶ֥מֶת הִ֖יא אֶת הָ/עֹֽבְרִ֑ים וְ/קָ֣בְרוּ שָׁ֗ם אֶת גּוֹג֙ וְ/אֶת כָּל הֲמוֹנֹ֔/ה וְ/קָ֣רְא֔וּ גֵּ֖יא הֲמ֥וֹן גּֽוֹג׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/039/011.yaml
  text: And it will be in that day that I will give Gog a burial place there in Israel[a], the Valley of the Travelers, east of the sea; and it will block the travelers. There they will bury Gog and all his multitude[c][b], and they will call it the Valley of Hamon-gog.
translation:
  language: hi
  text: उस दिन ऐसा होगा कि मैं गोग के लिए इस्राएल में वहीं एक दफ़न-स्थान दूँगा—समुद्र के पूर्व में यात्रियों की घाटी[a]। वह यात्रियों को रोक देगी। वहाँ वे गोग और उसके पूरे जनसमूह को दफ़नाएँगे, और उस घाटी का नाम ‘हामोन-गोग की घाटी’ रखेंगे[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “यात्रियों की घाटी” का अधिक शाब्दिक अनुवाद “गुज़रनेवालों की घाटी” भी हो सकता है। “समुद्र के पूर्व में” का अनुवाद “समुद्र के सामने” भी संभव है; इब्रानी पद दिशा अथवा सामने की स्थिति बता सकता है।
    reason: lexical_alternative
  - marker: b
    text: “हामोन-गोग” का संभावित अर्थ “गोग की भीड़” है।
    reason: lexical_alternative
lexical_decisions:
- source_word: מְקוֹם שָׁם קֶבֶר
  choice: दफ़नाने के लिए एक स्थान
  rationale: इब्रानी पदबंध में स्थान और कब्र/दफ़न का भाव है। हिंदी में यह प्रयोग स्वाभाविक है और मूल के अंत्येष्टि-संबंधी अर्थ को स्पष्ट रखता है। שָׁם का स्थानवाचक भाव अगले वाक्य के ‘वहाँ’ और घाटी के निर्देश से बना रहता है।
- source_word: גֵּי הָעֹבְרִים
  choice: यात्रियों की घाटी
  rationale: עֹבְרִים का शाब्दिक भाव ‘गुज़रनेवाले’ है। ‘यात्री’ आधुनिक हिंदी में स्वाभाविक है और यहाँ स्थान-नाम जैसे प्रयोग के अनुकूल भी है; अधिक शाब्दिक विकल्प पादटिप्पणी में दिया गया है।
- source_word: קִדְמַת הַיָּם
  choice: समुद्र के पूर्व में
  rationale: भौगोलिक संदर्भ में קִדְמַת का संभावित अर्थ ‘पूर्व में’ है, पर ‘समुद्र के सामने’ भी संभव है; इस वास्तविक अस्पष्टता को पादटिप्पणी में रखा गया है।
- source_word: וְחֹסֶמֶת הִיא אֶת הָעֹבְרִים
  choice: वह यात्रियों का मार्ग रोक देगी
  rationale: חסם का अर्थ रोकना या अवरुद्ध करना है। हिंदी में ‘यात्रियों को रोकेगी’ की अपेक्षा ‘यात्रियों का मार्ग रोक देगी’ अधिक स्वाभाविक है, यद्यपि ‘मार्ग’ मूल में अंतर्निहित वस्तु के रूप में समझा गया है।
- source_word: הֲמוֹנוֹ
  choice: उसकी सारी भीड़
  rationale: הָמוֹן भीड़, जनसमूह या बड़ी संख्या को सूचित करता है। ‘भीड़’ व्यापक अर्थ बनाए रखता है और ‘सेना’ या ‘दल’ जैसी संदर्भगत व्याख्या को अनावश्यक रूप से नहीं जोड़ता।
- source_word: גֵּיא הֲמוֹן גּוֹג
  choice: हामोन-गोग की घाटी
  rationale: यह नया स्थान-नाम है, इसलिए ‘हामोन-गोग’ का लिप्यंतरण किया गया है। उसके अर्थ ‘गोग की भीड़’ को पादटिप्पणी में बताया गया है।
- source_word: וְהָיָה בַיּוֹם הַהוּא
  choice: उस दिन ऐसा होगा कि
  rationale: यह भविष्यसूचक सूत्र का सहज, गरिमापूर्ण आधुनिक हिंदी रूप है और भविष्यकालीन बल बनाए रखता है।
- source_word: אֶתֵּן לְגוֹג
  choice: मैं ... गोग को ... स्थान दूँगा
  rationale: נתן + ל का मूल भाव किसी को कुछ देना या उसके लिए निर्धारित करना है। ‘दूँगा’ सीधा अर्थ रखता है; संदर्भ बताता है कि दिया गया स्थान दफ़नाने के लिए है।
theological_decisions:
- issue: अंतिम स्थान-नाम को अर्थानुवादित करना या लिप्यंतरित करना
  choice: मुख्य पाठ में ‘हामोन-गोग’ का लिप्यंतरण
  alternative: ‘गोग की भीड़ की घाटी’ के रूप में अर्थानुवाद
  rationale: यह वाक्य में दिए जा रहे स्थान-नाम की तरह कार्य करता है। लिप्यंतरण उसके नाम होने का स्वरूप बचाता है, जबकि पादटिप्पणी उसका संभावित अर्थ स्पष्ट करती है।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण और सहज शैली रखी गई है। ‘दफ़नाना’, ‘यात्री’ और ‘मार्ग रोकना’ सामान्य पाठक के लिए स्पष्ट हैं। स्थान-नामों को नाम के रूप में रखा गया है और मूल की भौगोलिक अस्पष्टता पादटिप्पणी में सुरक्षित की गई है।
