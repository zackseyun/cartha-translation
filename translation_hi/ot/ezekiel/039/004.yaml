  text: עַל הָרֵ֨י יִשְׂרָאֵ֜ל תִּפּ֗וֹל אַתָּה֙ וְ/כָל אֲגַפֶּ֔י/ךָ וְ/עַמִּ֖ים אֲשֶׁ֣ר אִתָּ֑/ךְ לְ/עֵ֨יט צִפּ֧וֹר כָּל כָּנָ֛ף וְ/חַיַּ֥ת הַ/שָּׂדֶ֖ה נְתַתִּ֥י/ךָ לְ/אָכְלָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/039/004.yaml
  text: On the mountains of Israel you will fall—you and all your troops and the peoples who are with you[b][a]. I have given you as food to every kind of bird of prey and to the wild animals of the field.
translation:
  language: hi
  text: इस्राएल के पहाड़ों पर तू गिर पड़ेगा—तू, तेरे सभी सैन्य-दल[a] और वे जातियाँ जो तेरे साथ हैं। मैंने तुझे हर प्रकार के शिकारी पक्षियों[b] और मैदान के जंगली जानवरों के लिए भोजन बना दिया है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक अर्थ ‘तेरे सभी पंख’ है; संभवतः यह गोग की सैन्य टुकड़ियों या उससे जुड़ी सेनाओं का रूपक है।
    reason: lexical_alternative
  - marker: b
    text: या, ‘हर किस्म के शिकारी पक्षियों के लिए’; इब्रानी अभिव्यक्ति हर प्रकार के मुर्दाखोर पक्षियों पर बल देती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּפּוֹל
  choice: तू गिर पड़ेगा
  rationale: נפל का ठोस अर्थ ‘गिरना’ है। न्याय के इस प्रसंग में इसमें पराजय और मृत्यु निहित हैं, पर अनुवाद मूल बिंब को बनाए रखता है।
- source_word: אֲגַפֶּיךָ
  choice: तेरे सभी सैन्य-दल
  rationale: शाब्दिक अर्थ ‘तेरे पंख’ है, पर सैन्य प्रसंग में यह गोग के अंगों, टुकड़ियों या उससे जुड़ी सेनाओं का रूपक जान पड़ता है। ‘सैन्य-दल’ आधुनिक हिन्दी में अर्थ स्पष्ट करता है।
- source_word: עַמִּים אֲשֶׁר אִתָּךְ
  choice: तेरे साथ के लोग
  rationale: עַמִּים बहुवचन में जनसमूहों या जातियों को सूचित करता है, केवल एक सैन्य इकाई को नहीं। यह अभिव्यक्ति अर्थ को स्वाभाविक हिन्दी में रखती है।
- source_word: לְעֵיט צִפּוֹר כָּל כָּנָף
  choice: हर प्रकार के शिकारी पक्षी
  rationale: इब्रानी पदबंध शिकार करने वाले अथवा मुर्दाखोर पक्षियों की समग्रता पर बल देता है। ‘हर प्रकार’ כָּל כָּנָף के व्यापक भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: חַיַּת הַשָּׂדֶה
  choice: मैदान के जंगली जानवरों
  rationale: यह खुले क्षेत्र में रहने वाले वन्य पशुओं के लिए प्रचलित इब्रानी अभिव्यक्ति है।
- source_word: נְתַתִּיךָ לְאָכְלָה
  choice: मैंने तुझे ... का आहार बना दिया है
  rationale: रचना किसी को खाए जाने के लिए सौंप देने का भाव रखती है। ‘आहार बना दिया है’ न्याय के कठोर बिंब और पूर्ण क्रिया दोनों को बनाए रखता है।
theological_decisions:
- issue: ईश्वरीय न्याय में परमेश्वर की सक्रिय भूमिका
  choice: मैंने तुझे ... का आहार बना दिया है
  alternative: मैं तुझे ... का आहार बना दूँगा
  rationale: נְתַתִּיךָ पूर्ण रूप, प्रथम पुरुष एकवचन है—शाब्दिक रूप से ‘मैंने तुझे दिया है।’ भविष्य के निश्चित न्याय के लिए प्रयुक्त भविष्यदर्शी पूर्ण की शक्ति को हिन्दी के पूर्णकाल से सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। गोग को एकवचन अनौपचारिक-गंभीर संबोधन ‘तू’ दिया गया है, जो इब्रानी के एकवचन और न्यायवाणी की सीधाई को सुरक्षित रखता है। सभी पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित हैं।
