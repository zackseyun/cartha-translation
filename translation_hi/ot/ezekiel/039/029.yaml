source:
  edition: WLC
  text: וְ/לֹֽא אַסְתִּ֥יר ע֛וֹד פָּנַ֖/י מֵ/הֶ֑ם אֲשֶׁ֨ר שָׁפַ֤כְתִּי אֶת רוּחִ/י֙ עַל בֵּ֣ית יִשְׂרָאֵ֔ל נְאֻ֖ם אֲדֹנָ֥/י יְהוִֽה־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/039/029.yaml
  text: And I will no longer hide my face from them, when I have poured out my Spirit on the house of Israel, declares the Lord GOD.
translation:
  language: hi
  text: और मैं फिर उनसे अपना मुख नहीं छिपाऊँगा, जब मैं इस्राएल के घराने पर अपना आत्मा उण्डेल चुका होऊँगा—प्रभु यहोवा की यह घोषणा है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְלֹא אַסְתִּיר עוֹד פָּנַי מֵהֶם
  choice: और मैं फिर उनसे अपना मुख नहीं छिपाऊँगा
  rationale: ‘मुख छिपाना’ मूल इब्रानी रूपक को बनाए रखता है; ‘फिर’ עוֹד के साथ निषेध का स्वाभाविक हिन्दी रूप है।
- source_word: אֲשֶׁר שָׁפַכְתִּי
  choice: जब मैं ... उण्डेल चुका होऊँगा
  rationale: אֲשֶׁר यहाँ प्रसंग में काल-संबंधी अर्थ दे सकता है। पूर्ण क्रिया שָׁפַכְתִּי को भावी प्रतिज्ञा के दृष्टिकोण से पूर्ण हो चुके कार्य के रूप में व्यक्त किया गया है, और कारणवाचक ‘क्योंकि’ थोपने से बचा गया है।
- source_word: רוּחִי
  choice: अपना आत्मा
  rationale: רוּחַ का अर्थ ‘आत्मा’, ‘वायु’ या ‘श्वास’ हो सकता है; अधिकारसूचक ‘मेरा’ और दिव्य उण्डेले जाने के प्रसंग में ‘अपना आत्मा’ सबसे उपयुक्त है।
- source_word: בֵּית יִשְׂרָאֵל
  choice: इस्राएल के घराने
  rationale: ‘घराना’ सामूहिक और वंशगत अर्थ वाले בֵּית को स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: प्रभु यहोवा की यह घोषणा है
  rationale: נְאֻם को औपचारिक भविष्यद्वाणी-सूत्र ‘घोषणा’ से और दोनों दिव्य पदों को ‘प्रभु यहोवा’ से स्पष्ट रूप में प्रस्तुत किया गया है।
theological_decisions:
- issue: आत्मा उण्डेलने और मुख न छिपाने के बीच संबंध
  choice: काल-संबंधी ‘जब’
  alternative: कारण-संबंधी ‘क्योंकि’ अथवा संबंधवाचक ‘जिसे/कि’
  rationale: אֲשֶׁר कई प्रकार का संबंध व्यक्त कर सकता है। निकट प्रसंग और उपलब्ध परामर्श-पाठ के अनुसार ‘जब’ चुना गया है, जिससे घटना का क्रम व्यक्त होता है और कारणवाचक व्याख्या अनावश्यक रूप से निश्चित नहीं की जाती।
- issue: רוּחִי में दिव्य आत्मा का उल्लेख
  choice: ‘अपना आत्मा’
  alternative: ‘अपनी आत्मा’ या ‘अपनी श्वास’
  rationale: आधुनिक मानक हिन्दी के प्रचलित बाइबलीय प्रयोग में परमेश्वर के Spirit के लिए पुल्लिंग ‘आत्मा’ स्पष्ट और स्वाभाविक है; पद में बाद की व्यवस्थित धर्मशास्त्रीय व्याख्या नहीं जोड़ी गई।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। इब्रानी का ‘मुख छिपाना’ रूपक तथा ‘आत्मा उण्डेलना’ की सजीव छवि सुरक्षित हैं। भविष्य के संदर्भ में पूर्ण हो चुके कार्य को सहज बनाने के लिए ‘उण्डेल चुका होऊँगा’ प्रयुक्त है।
