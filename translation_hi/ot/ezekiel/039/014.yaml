base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/039/014.yaml
  text: And they will set apart men continually[a], who will pass through the land burying those who pass through, those left on the surface of the land, to cleanse it[c][b]. At the end of seven months they will make a search.
translation:
  language: hi
  text: वे लगातार काम करने के लिए लोगों को अलग ठहराएँगे[a], जो देश में होकर गुजरेंगे और गुज़रने वालों को—अर्थात् देश की भूमि पर पड़े रह गए लोगों को—दफ़नाएँगे[b], ताकि देश को शुद्ध करें। सात महीने पूरे होने पर वे छानबीन करेंगे[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘स्थायी रूप से नियुक्त लोग।’ इब्रानी में शाब्दिक रूप से ‘निरंतरता के लोग’ है, जो लगातार चलने वाले दायित्व का संकेत देता है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में ‘गुज़रना’ क्रिया दोहराई गई है। शब्दांकन कठिन है। संदर्भ में संभवतः देश में पड़े मृत लोग अभिप्रेत हैं, पर यह दोहराव खोज करने वालों के देश में होकर गुज़रने की प्रतिध्वनि भी हो सकता है।
    reason: lexical_ambiguity
  - marker: c
    text: या ‘वे ध्यानपूर्वक तलाश करेंगे’ अथवा ‘वे पूरी खोजबीन करेंगे।’
    reason: lexical_alternative
lexical_decisions:
- source_word: אַנְשֵׁי תָמִיד
  choice: कुछ आदमियों को लगातार इस काम के लिए
  rationale: शाब्दिक रूप ‘निरंतरता के आदमी’ है और इससे स्थायी अथवा नियमित दायित्व का बोध होता है। हिंदी में यह वाक्यांश ongoing assignment को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: יַבְדִּילוּ
  choice: अलग ठहराएँगे
  rationale: हिफ़ील रूप का मूल अर्थ ‘अलग करना/ठहराना’ है। यह कार्य के लिए नियुक्ति का संकेत देता है, पर औपचारिक ‘नियुक्त करेंगे’ कहकर मूल रूपक को पूरी तरह नहीं मिटाता।
- source_word: עֹבְרִים בָּאָרֶץ
  choice: देश में घूमते हुए
  rationale: עבר का कृदंत देश में होकर जाने या घूमने को दर्शाता है। यहाँ नियुक्त दल की पूरे देश में आवाजाही अभिप्रेत है।
- source_word: מְקַבְּרִים
  choice: दफ़नाएँगे
  rationale: कृदंत मुख्य दल की साथ-साथ चलने वाली गतिविधि बताता है। हिंदी में भविष्यकालीन क्रिया अधिक स्वाभाविक है।
- source_word: הָעֹבְרִים
  choice: वहाँ से गुज़रने वालों को
  rationale: मूल में עבר की पुनरावृत्ति कठिन और संदिग्ध है। ‘गुज़रने वालों’ से उस पुनरावृत्ति को बचाया गया है; संदर्भगत कठिनाई पादटिप्पणी में स्पष्ट की गई है।
- source_word: הַנּוֹתָרִים עַל־פְּנֵי הָאָרֶץ
  choice: देश की भूमि पर पड़े रह गए लोगों को
  rationale: נותרים ‘बचे/रह गए’ लोगों को दर्शाता है और עַל־פְּנֵי הָאָרֶץ यहाँ खुली भूमि पर पड़े शवों की ओर संकेत करता है। ‘लोगों’ मूल की मानवीय अभिव्यक्ति बनाए रखता है, जबकि ‘पड़े’ संदर्भ को स्पष्ट करता है।
- source_word: לְטַהֲרָהּ
  choice: ताकि उसे शुद्ध करें
  rationale: טהר में धार्मिक अशुद्धि दूर करने और व्यावहारिक सफ़ाई—दोनों का बोध संभव है। ‘शुद्ध करें’ दोनों आयामों को खुला रखता है।
- source_word: מִקְצֵה שִׁבְעָה חֳדָשִׁים
  choice: सात महीने पूरे होने पर
  rationale: מן और קצה मिलकर उस समय-बिंदु को सूचित करते हैं जहाँ अगला कार्य आरंभ होगा। यह आधुनिक हिंदी में स्पष्ट और स्वाभाविक है।
- source_word: יַחְקֹרוּ
  choice: पूरी खोजबीन करेंगे
  rationale: חקר सामान्य खोज से बढ़कर ध्यानपूर्वक जाँचने या छानबीन करने का भाव रखता है। ‘पूरी खोजबीन’ संगठित और गहन तलाश का संकेत देती है।
theological_decisions:
- issue: देश को शुद्ध करने का स्वरूप
  choice: ‘शुद्ध करें’ द्वारा धार्मिक और व्यावहारिक दोनों आयाम सुरक्षित रखना
  alternative: केवल धार्मिक शुद्धीकरण या केवल भौतिक सफ़ाई
  rationale: युद्ध के बाद पड़े शव देश को अशुद्ध करते हैं, किंतु पद स्वयं इस शुद्धि को केवल अनुष्ठानिक या केवल स्वच्छता-संबंधी अर्थ तक सीमित नहीं करता।
- issue: הָעֹבְרִים की पहचान
  choice: मूल की कठिन अभिव्यक्ति ‘गुज़रने वालों’ को मुख्य पाठ में बनाए रखना
  alternative: सीधे ‘शवों’ या ‘मारे गए लोगों’ कहना
  rationale: संदर्भ मृत पड़े लोगों की ओर संकेत करता है, पर शब्द स्वयं עבר का कृदंत है। अधिक स्पष्ट अनुवाद संभावित अर्थ को निश्चित कर देता; इसलिए अस्पष्टता को पादटिप्पणी सहित सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिंदी का गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज रूप अपनाया गया है। ‘दफ़नाएँगे’, ‘खोजबीन’ और ‘भूमि पर पड़े रह गए’ जैसे प्रचलित शब्द चुने गए हैं। मूल की कठिन עבר-पुनरावृत्ति को मुख्य पाठ और पादटिप्पणी में सुरक्षित रखा गया है; विराम-चिह्न से appositional संबंध स्पष्ट किया गया है।
