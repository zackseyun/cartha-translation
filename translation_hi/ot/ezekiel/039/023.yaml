source:
  edition: WLC
  text: וְ/יָדְע֣וּ הַ֠/גּוֹיִם כִּ֣י בַ/עֲוֺנָ֞/ם גָּל֣וּ בֵֽית יִשְׂרָאֵ֗ל עַ֚ל אֲשֶׁ֣ר מָֽעֲלוּ בִ֔/י וָ/אַסְתִּ֥ר פָּנַ֖/י מֵ/הֶ֑ם וָֽ/אֶתְּנֵ/ם֙ בְּ/יַ֣ד צָרֵי/הֶ֔ם וַ/יִּפְּל֥וּ בַ/חֶ֖רֶב כֻּלָּֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/039/023.yaml
  text: And the nations will know that the house of Israel went into exile for their iniquity[a], because they acted unfaithfully against me; so I hid my face from them and gave them into the hand of their adversaries[b], and they all fell by the sword.
translation:
  language: hi
  text: और जातियाँ जान लेंगी कि इस्राएल का घर अपने अधर्म के कारण निर्वासन में गया, क्योंकि उन्होंने मेरे प्रति विश्वासघात किया[a]; इसलिए मैंने उनसे अपना मुख छिपा लिया और उन्हें उनके शत्रुओं के हाथ में[b] सौंप दिया, और वे सब तलवार से मारे गए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘वे मेरे प्रति अनिष्ठावान हुए’ अथवा ‘उन्होंने मेरे विरुद्ध विश्वासभंग किया।’ हिब्रू क्रिया में विशेषकर वाचा के संदर्भ में निष्ठा भंग करने का भाव है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक, ‘उनके शत्रुओं के हाथ में’; अर्थात उनके अधिकार या वश में।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָדְעוּ הַגּוֹיִם
  choice: और जातियाँ जान लेंगी
  rationale: भविष्यसूचक प्रसंग में क्रिया को परिणामसूचक भविष्य के रूप में लिया गया है। הַגּוֹיִם के लिए ‘जातियाँ’ विदेशी राष्ट्रों का स्वाभाविक और प्रचलित बाइबलीय पद है।
- source_word: בַעֲוֺנָם
  choice: अपने अधर्म के कारण
  rationale: עָוֹן नैतिक दोष और दंडयोग्य अपराध—दोनों का भार रखता है; ‘अधर्म’ इस गंभीरता को बनाए रखता है।
- source_word: גָּלוּ בֵית יִשְׂרָאֵל
  choice: इस्राएल का घर ... निर्वासन में गया
  rationale: ‘इस्राएल का घर’ वाचा-संबंधी सामूहिक पद को सुरक्षित रखता है, और ‘निर्वासन में गया’ हिब्रू क्रिया के सक्रिय रूप को अनावश्यक रूप से कर्मवाच्य नहीं बनाता।
- source_word: מָעֲלוּ בִי
  choice: उन्होंने मेरे प्रति विश्वासघात किया था
  rationale: מעל केवल सामान्य पाप नहीं, बल्कि निष्ठा भंग करने और छलपूर्ण अविश्वास का भाव रखता है; ‘मेरे प्रति विश्वासघात’ इसे स्पष्ट और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וָאַסְתִּר פָּנַי מֵהֶם
  choice: मैंने उनसे अपना मुख छिपा लिया
  rationale: ईश्वरीय अनुग्रह और संरक्षण हटाने वाले महत्वपूर्ण बाइबलीय मुहावरे ‘मुख छिपाना’ को ज्यों का त्यों रखा गया है।
- source_word: וָאֶתְּנֵם בְּיַד צָרֵיהֶם
  choice: उन्हें उनके शत्रुओं के हाथ में कर दिया
  rationale: ‘हाथ में करना’ किसी के अधिकार में सौंपने का समझ में आने वाला हिन्दी मुहावरा है और हिब्रू की चित्रात्मकता भी सुरक्षित रखता है।
- source_word: וַיִּפְּלוּ בַחֶרֶב כֻּלָּם
  choice: वे सब तलवार से मारे गए
  rationale: शाब्दिक ‘तलवार से गिर पड़े’ की अपेक्षा यह आधुनिक हिन्दी में युद्धजनित मृत्यु का अर्थ स्पष्ट करता है और כֻּלָּם की समग्रता बनाए रखता है।
theological_decisions:
- issue: इस्राएल के अधर्म, परमेश्वर के मुख छिपाने और पराजय के बीच कारणात्मक संबंध
  choice: 'पद में मानव दोष और परमेश्वर की न्यायकारी क्रिया दोनों स्पष्ट रखे गए हैं: विश्वासघात के कारण परमेश्वर ने अपना मुख छिपाया और उन्हें शत्रुओं के अधिकार में कर दिया।'
  alternative: निर्वासन और पराजय को केवल ऐतिहासिक घटना के रूप में प्रस्तुत करना, जिसमें परमेश्वर की सक्रिय न्यायकारी भूमिका मंद पड़ जाए।
  rationale: हिब्रू पाठ निर्वासन को अधर्म से जोड़ता है और परमेश्वर को मुख छिपाने तथा शत्रुओं के हाथ में सौंपने वाला स्पष्ट रूप से बताता है; अनुवाद इस तनाव को न नरम करता है, न उससे आगे व्याख्या जोड़ता है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘इस्राएल का घर,’ ‘मुख छिपाना,’ और ‘शत्रुओं के हाथ में’ जैसे प्रमुख बाइबलीय रूपकों को सुरक्षित रखा गया है। कोई पादटिप्पणी आवश्यक नहीं मानी गई, क्योंकि चुने हुए पद पाठ में अर्थ को पर्याप्त रूप से व्यक्त करते हैं।
