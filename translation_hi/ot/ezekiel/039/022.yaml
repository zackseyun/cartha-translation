source:
  edition: WLC
  text: וְ/יָֽדְעוּ֙ בֵּ֣ית יִשְׂרָאֵ֔ל כִּ֛י אֲנִ֥י יְהוָ֖ה אֱלֹֽהֵי/הֶ֑ם מִן הַ/יּ֥וֹם הַ/ה֖וּא וָ/הָֽלְאָה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/039/022.yaml
  text: And the house of Israel will know that I am Yahweh their God from that day onward[a].
translation:
  language: hi
  text: और उस दिन से आगे[a] इस्राएल का घराना जान लेगा कि मैं याहवे, उनका परमेश्वर हूँ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उस दिन से।”
    reason: ‘उस दिन से’ हिन्दी में ‘from that day on’ का स्वाभाविक संक्षिप्त विकल्प है; मुख्य पाठ का ‘आगे’ हिब्रू וָהָלְאָה की आगे चलने वाली समय-सीमा को स्पष्ट करता है।
lexical_decisions:
- source_word: וְיָדְעוּ
  choice: और ... जान लेगा
  rationale: भविष्यसूचक संदर्भ में यह रूप भावी परिणाम बताता है। ‘जान लेगा’ केवल सूचना पाने से बढ़कर पहचान लेने का भाव स्वाभाविक रूप से व्यक्त करता है, पर स्पष्ट अंगीकार का अर्थ नहीं जोड़ता।
- source_word: בֵּית יִשְׂרָאֵל
  choice: इस्राएल का घराना
  rationale: यह पूरे इस्राएली समुदाय का सामूहिक पद है। ‘घराना’ हिब्रू रूपक और सामूहिक बल को बनाए रखते हुए आधुनिक हिन्दी में बोधगम्य है।
- source_word: כִּי
  choice: कि
  rationale: यह उस बात का परिचय देता है जिसे इस्राएल जानेगा; हिन्दी में ‘कि’ स्वाभाविक कर्मवाचक उपवाक्य बनाता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: यह परमेश्वर का व्यक्तिवाचक वाचा-नाम है; शीर्षक से बदलने के बजाय इसका लिप्यंतरण रखा गया है।
- source_word: אֱלֹהֵיהֶם
  choice: उनका परमेश्वर
  rationale: बहुवचन समुदाय से संबद्ध एकवचन ईश्वरीय संदर्भ को हिन्दी में स्वाभाविक ढंग से व्यक्त करता है।
- source_word: מִן הַיּוֹם הַהוּא
  choice: उस दिन से
  rationale: यह एक स्थायी अवस्था के आरंभ-बिंदु को सूचित करता है।
- source_word: וָהָלְאָה
  choice: आगे
  rationale: यह समय की निरंतरता को भविष्य की ओर बढ़ाता है; ‘उस दिन से आगे’ संक्षिप्त और स्वाभाविक हिन्दी है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा अथवा ‘प्रभु’
  rationale: मूल पाठ में चार-अक्षरीय व्यक्तिगत नाम सीधे प्रयुक्त है। ‘याहवे’ उसका प्रचलित विद्वत्तापूर्ण लिप्यंतरण है और नाम को किसी उपाधि से नहीं बदलता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘इस्राएल का घराना’ सामूहिक हिब्रू पद को सुरक्षित रखता है; वाक्य-विन्यास स्वाभाविक हिन्दी के अनुसार समय-सूचक पद से आरंभ किया गया है।
