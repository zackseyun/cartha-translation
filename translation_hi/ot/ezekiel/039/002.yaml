  yaml_path: translation/ot/ezekiel/039/002.yaml
  text: I will turn you around[a], lead you on, bring you up from the far north[b], and bring you against the mountains of Israel.
translation:
  language: hi
  text: मैं तुझे फेर दूँगा, आगे हाँकूँगा[a], सुदूर उत्तर[b] से ऊपर ले आऊँगा और इस्राएल के पहाड़ों के विरुद्ध ले आऊँगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इस कठिन इब्रानी क्रिया का अनुवाद कुछ अनुवादों में ‘तुझ में से केवल छठा भाग छोड़ दूँगा’ किया गया है।
    reason: alternative_reading
  - marker: b
    text: 'अधिक शाब्दिक अर्थ: ‘उत्तर के सबसे दूरस्थ भागों से।’'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשֹׁבַבְתִּיךָ
  choice: मैं तुझे फेर दूँगा
  rationale: यह रूप गोग की दिशा को परमेश्वर द्वारा मोड़ने या फेरने का भाव व्यक्त करता है। ‘फेर दूँगा’ स्वाभाविक हिन्दी है और बिना आवश्यकता यह तय नहीं करता कि उसे किसी पहले स्थान पर ही लौटाया जा रहा है।
- source_word: וְשִׁשֵּׁאתִיךָ
  choice: आगे हाँकूँगा
  rationale: यह कठिन क्रिया यहाँ गति कराने वाली क्रिया के रूप में समझी गई है। आसपास की क्रियाओं की शृंखला में ‘आगे हाँकूँगा’ बाध्य करके आगे बढ़ाने और न्याय-सूचक वाणी—दोनों के भाव को बनाए रखता है।
- source_word: וְהַעֲלִיתִיךָ
  choice: चढ़ा लाऊँगा
  rationale: עלה का हिफ़ील रूप किसी को ऊपर लाने या चढ़ाकर लाने का अर्थ देता है। यह चयन मूल की दिशात्मकता को सहज हिन्दी में बनाए रखता है।
- source_word: מִיַּרְכְּתֵי צָפוֹן
  choice: सुदूर उत्तर से
  rationale: यह पद उत्तर के दूरस्थ छोरों या अति दूर उत्तर को सूचित करता है। ‘सुदूर उत्तर’ आधुनिक हिन्दी में संक्षिप्त और स्पष्ट है; अधिक शाब्दिक अर्थ पादटिप्पणी में दिया गया है।
- source_word: וַהֲבִיאוֹתִיךָ עַל
  choice: विरुद्ध ले आऊँगा
  rationale: सैनिक प्रसंग में על के साथ यह इस्राएल के पहाड़ों की ओर शत्रुतापूर्ण बढ़त को दर्शाता है। ‘विरुद्ध’ केवल तटस्थ गंतव्य बताने के बजाय उस संदर्भ को स्पष्ट रखता है।
- source_word: הָרֵי יִשְׂרָאֵל
  choice: इस्राएल के पहाड़ों
  rationale: यहेजकेल में प्रयुक्त मानक भौगोलिक और भविष्यद्वक्तापरक अभिव्यक्ति को सीधे रूप में रखा गया है।
theological_decisions:
- issue: कठिन इब्रानी क्रिया וְשִׁשֵּׁאתִיךָ की व्याख्या
  choice: 'गति कराने वाली क्रिया: ‘आगे हाँकूँगा’'
  alternative: 'अंश या बचे हुए लोगों से संबंधित पाठ: ‘तेरा केवल छठा भाग छोड़ूँगा’'
  rationale: तत्काल संदर्भ में दिशा मोड़ने, ऊपर लाने और किसी स्थान के विरुद्ध ले आने वाली क्रियाएँ लगातार आती हैं। इसलिए इसे आगे बढ़ाने वाली क्रिया मानना वाक्य-प्रवाह से सबसे अच्छी तरह मेल खाता है। फिर भी ‘केवल छठा भाग छोड़ना’ वाला अर्थ कुछ पुरानी अनुवाद-परंपराओं में मिलता है, इसलिए वास्तविक पाठगत-शाब्दिक कठिनाई को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘आगे हाँकूँगा’ दैवी नियंत्रण और बाध्य गति का प्रबल भाव देता है। पादटिप्पणी-चिह्न संबंधित पदों के तुरंत बाद लगाए गए हैं।
