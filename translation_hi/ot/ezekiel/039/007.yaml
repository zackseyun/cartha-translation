source:
  edition: WLC
  text: וְ/אֶת שֵׁ֨ם קָדְשִׁ֜/י אוֹדִ֗יעַ בְּ/תוֹךְ֙ עַמִּ֣/י יִשְׂרָאֵ֔ל וְ/לֹֽא אַחֵ֥ל אֶת שֵׁם קָדְשִׁ֖/י ע֑וֹד וְ/יָדְע֤וּ הַ/גּוֹיִם֙ כִּי אֲנִ֣י יְהוָ֔ה קָד֖וֹשׁ בְּ/יִשְׂרָאֵֽל־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/039/007.yaml
  text: And I will make my holy name known in the midst of my people Israel[a], and I will no longer let my holy name be profaned; and the nations will know that I am Yahweh[b], the Holy One in Israel.
translation:
  language: hi
  text: मैं अपनी प्रजा इस्राएल के बीच अपने पवित्र नाम को ज्ञात कराऊँगा, और अपने पवित्र नाम को फिर अपवित्र होने नहीं दूँगा[a]। और जातियाँ जान लेंगी कि मैं याहवे हूँ—इस्राएल में पवित्र परमेश्वर[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अधिक शाब्दिक रूप से, “मैं फिर अपने पवित्र नाम को अपवित्र नहीं करूँगा।” इब्रानी क्रिया का ऐसा अनुवाद संभव है, यद्यपि प्रसंग में अर्थ संभवतः यह है कि परमेश्वर अपने नाम को आगे अपवित्र होने नहीं देगा।
    reason: alternative_reading
  - marker: b
    text: या, “मैं याहवे हूँ, जो इस्राएल में पवित्र हूँ।”
    reason: lexical_alternative
lexical_decisions:
- source_word: שֵׁם קָדְשִׁי
  choice: अपने पवित्र नाम
  rationale: यह संबंधसूचक पदबंध स्वाभाविक हिन्दी में परमेश्वर के प्रकट चरित्र, प्रतिष्ठा और पवित्रता से जुड़े ‘मेरे पवित्र नाम’ को व्यक्त करता है।
- source_word: אוֹדִיעַ
  choice: प्रकट करूँगा
  rationale: ידע का हिफ़ील रूप कारणवाचक है। प्रत्यक्ष कर्म ‘अपने पवित्र नाम’ के साथ ‘प्रकट करूँगा’ आधुनिक हिन्दी में ‘ज्ञात कराऊँगा’ से अधिक सहज है और मूल अर्थ बनाए रखता है।
- source_word: בְּתוֹךְ עַמִּי יִשְׂרָאֵל
  choice: अपनी प्रजा इस्राएल के बीच
  rationale: בְּתוֹךְ समुदाय के भीतर उपस्थिति को सूचित करता है; ‘के बीच’ स्वाभाविक हिन्दी में इस अर्थ को बनाए रखता है।
- source_word: אַחֵל
  choice: अपवित्र नहीं होने दूँगा
  rationale: חלל के हिफ़ील रूप को सक्रिय ‘अपवित्र करूँगा’ अथवा अनुमतिमूलक ‘अपवित्र होने दूँगा’ समझा जा सकता है। प्रसंग में परमेश्वर द्वारा अपने नाम की प्रतिष्ठा पुनः स्थापित करना प्रमुख है, इसलिए अनुमतिमूलक अर्थ मुख्य पाठ में रखा गया है।
- source_word: הַגּוֹיִם
  choice: जातियाँ
  rationale: यहाँ शब्द इस्राएल से बाहर के राष्ट्रों या जनसमुदायों को सामूहिक रूप से दर्शाता है; ‘जातियाँ’ बाइबिलीय हिन्दी में संक्षिप्त और परिचित है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय हिन्दी में प्रचलित लिप्यंतरण ‘यहोवा’ से व्यक्त किया गया है।
- source_word: קָדוֹשׁ בְּיִשְׂרָאֵל
  choice: इस्राएल में पवित्र परमेश्वर
  rationale: पदबंध में ‘पवित्र’ को विधेय या उपाधिसदृश संज्ञा—दोनों रूपों में समझने की गुंजाइश है। मुख्य पाठ में उपाधिसदृश अर्थ स्वाभाविक हिन्दी में दिया गया है और अधिक शाब्दिक विधेय-पाठ पादटिप्पणी में रखा गया है।
theological_decisions:
- issue: וְלֹא אַחֵל में परमेश्वर की क्रिया का आशय
  choice: फिर अपने पवित्र नाम को अपवित्र नहीं होने दूँगा
  alternative: फिर अपने पवित्र नाम को अपवित्र नहीं करूँगा
  rationale: इब्रानी व्याकरण सक्रिय अनुवाद की अनुमति देता है, पर यहेजकेल के व्यापक प्रसंग में परमेश्वर अपने नाम का अपमान आगे न होने देने और उसकी पवित्रता प्रकट करने की बात करता है। वास्तविक भाषिक अस्पष्टता पादटिप्पणी में सुरक्षित है।
- issue: יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: व्यक्तिगत ईश्वरीय नाम को ‘प्रभु’ जैसी उपाधि से प्रतिस्थापित नहीं किया गया। आधुनिक हिन्दी पाठकों के बीच स्थापित देवनागरी रूप ‘यहोवा’ चुना गया है; यह उच्चारण के पुनर्निर्माण पर निर्भर किसी विशिष्ट व्याख्यात्मक दावे को मुख्य पाठ पर नहीं थोपता।
- issue: קָדוֹשׁ בְּיִשְׂרָאֵל की वाक्यगत भूमिका
  choice: इस्राएल में पवित्र परमेश्वर
  alternative: इस्राएल में पवित्र हूँ
  rationale: इब्रानी में קָדוֹשׁ को उपाधिसदृश ‘पवित्र जन’ या विधेय ‘पवित्र’ समझा जा सकता है। मुख्य पाठ पठनीय उपाधिसदृश रूप देता है, जबकि पादटिप्पणी अधिक शाब्दिक विधेय विकल्प को सुरक्षित रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सहज स्तर रखा गया है। ‘अपनी प्रजा इस्राएल’, ‘के बीच’ और ‘जान लेंगी’ जैसे रूप सामान्य पाठक के लिए स्पष्ट हैं। मूल की दो वास्तविक अस्पष्टताएँ—חלל का सक्रिय/अनुमतिमूलक अर्थ और קָדוֹשׁ का उपाधिसदृश/विधेय प्रयोग—पादटिप्पणियों में संरक्षित हैं।
