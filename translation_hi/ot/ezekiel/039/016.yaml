lexical_decisions:
- source_word: וְגַם
  choice: और ... भी
  rationale: संयोजक और क्रियाविशेषण का योग पिछले प्रसंग में एक और बात जोड़ता है; हिन्दी में ‘और ... भी’ इसका स्वाभाविक रूप है।
- source_word: שֵׁם עִיר
  choice: उस नगर का नाम
  rationale: रचना का अर्थ ‘नगर का नाम’ है। निकटवर्ती प्रसंग में एक विशिष्ट नगर होने के कारण ‘उस नगर’ स्वाभाविक और स्पष्ट है।
- source_word: הֲמוֹנָה
  choice: हमोना
  rationale: यह स्थान का नाम है, इसलिए अर्थानुवाद के बजाय देवनागरी में लिप्यंतरण किया गया है; शब्द-संबंध को पादटिप्पणी में रखा गया है।
- source_word: וְטִהֲרוּ
  choice: इस प्रकार वे ... शुद्ध करेंगे
  rationale: पिअेल रूप प्रसंग में भावी/परिणामसूचक है। ‘इस प्रकार’ पूर्ववर्ती दफनाने और नगर के नामकरण के परिणाम से संबंध दिखाता है, और ‘शुद्ध करेंगे’ भूमि से अशुद्धता दूर करने का भाव बनाए रखता है।
- source_word: הָאָרֶץ
  choice: देश
  rationale: यहाँ आशय समूची पृथ्वी से नहीं, इस्राएल के भूभाग से है; आधुनिक हिन्दी में इस प्रसंग में ‘देश’ सहज है।
