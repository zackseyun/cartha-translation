source:
  edition: WLC
  text: בְּ/שׁוֹבְבִ֤/י אוֹתָ/ם֙ מִן הָ֣/עַמִּ֔ים וְ/קִבַּצְתִּ֣י אֹתָ֔/ם מֵֽ/אַרְצ֖וֹת אֹֽיְבֵי/הֶ֑ם וְ/נִקְדַּ֣שְׁתִּי בָ֔/ם לְ/עֵינֵ֖י הַ/גּוֹיִ֥ם רַבִּֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/039/027.yaml
  text: when I bring them back from the peoples and gather them from the lands of their enemies[a], and I am shown holy through them before the eyes of many nations.
translation:
  language: hi
  text: जब मैं उन्हें लोगों के बीच से लौटा लाऊँगा और उनके शत्रुओं के देशों से इकट्ठा करूँगा, तब मैं उनके द्वारा अनेक राष्ट्रों की आँखों के सामने पवित्र ठहरूँगा।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अधिक शाब्दिक रूप से, “मैं उनमें पवित्र ठहरूँगा।” इसे “मैं उनके द्वारा अपनी पवित्रता प्रकट करूँगा” भी समझा जा सकता है। भाव यह है कि उनके साथ किए गए अपने कार्य के द्वारा यहोवा अपनी पवित्रता अनेक राष्ट्रों के सामने प्रकट करता है।
    reason: קדש के निफ़ाल और בָם के ‘उनमें/उनके द्वारा’ अर्थ-विकल्पों को सुरक्षित रखना।
lexical_decisions:
- source_word: בְּשׁוֹבְבִי
  choice: जब मैं उन्हें ... लौटा लाऊँगा
  rationale: हिफ़ील रूप का अर्थ ‘वापस ले आना’ है। בְּ के साथ क्रियार्थक संज्ञा और प्रथम पुरुष प्रत्यय यहाँ समयसूचक हैं, इसलिए ‘जब मैं ... लौटा लाऊँगा’ निर्वासन से वास्तविक वापसी को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: הָעַמִּים
  choice: लोगों के बीच से
  rationale: עַמִּים का मूल अर्थ ‘लोग/जनसमूह’ है। पद के अंत में आए גּוֹיִם के लिए ‘राष्ट्र’ रखकर दोनों इब्रानी शब्दों का भेद बनाए रखा गया है।
- source_word: וְקִבַּצְתִּי
  choice: और ... इकट्ठा करूँगा
  rationale: קבץ का अर्थ ‘इकट्ठा करना’ है। समयसूचक आरंभिक उपवाक्य के साथ हिन्दी में भविष्यकाल का समन्वित रूप स्वाभाविक और प्रसंगानुकूल है।
- source_word: מֵאַרְצוֹת אֹיְבֵיהֶם
  choice: उनके शत्रुओं के देशों से
  rationale: אַרְצוֹת बहुवचन है और अलग-अलग निर्वासन-स्थानों की भौगोलिक बहुलता व्यक्त करता है; ‘देशों’ इसे स्पष्ट रखता है।
- source_word: וְנִקְדַּשְׁתִּי בָם
  choice: उनके द्वारा पवित्र सिद्ध होऊँगा
  rationale: קדש का निफ़ाल रूप परमेश्वर की पवित्रता के सार्वजनिक रूप से प्रकट या प्रमाणित होने को दर्शाता है। ‘पवित्र सिद्ध होऊँगा’ निष्क्रिय/आत्मवाचक तनाव को बनाए रखता है और यह संकेत नहीं देता कि परमेश्वर पहले अपवित्र था; בָם को प्रसंगानुसार ‘उनके द्वारा’ कहा गया है।
- source_word: לְעֵינֵי
  choice: आँखों के सामने
  rationale: यह सार्वजनिक दृश्यता का इब्रानी मुहावरा है। हिन्दी में ‘आँखों के सामने’ मूल बिंब को बनाए रखता है।
- source_word: הַגּוֹיִם רַבִּים
  choice: अनेक राष्ट्रों
  rationale: גּוֹיִם यहाँ अंतरराष्ट्रीय अर्थ में राष्ट्रों को सूचित करता है, किसी विशेष धर्मशास्त्रीय वर्ग को नहीं; רַבִּים का सहज अनुवाद ‘अनेक’ है।
theological_decisions:
- issue: परमेश्वर के पवित्र ठहराए जाने की भाषा
  choice: मैं ... उनके द्वारा पवित्र सिद्ध होऊँगा
  alternative: मैं उनमें पवित्र ठहरूँगा / मैं उनके द्वारा अपनी पवित्रता प्रकट करूँगा
  rationale: मूल पाठ परमेश्वर की अंतर्निहित पवित्रता में परिवर्तन नहीं, बल्कि इस्राएल के साथ उसके कार्य के द्वारा राष्ट्रों के सामने उस पवित्रता के सार्वजनिक प्रकटीकरण को व्यक्त करता है। मुख्य पाठ निफ़ाल की निष्क्रिय/आत्मवाचक अभिव्यक्ति को बनाए रखता है, जबकि पादटिप्पणी अधिक शाब्दिक और अधिक व्याख्यात्मक विकल्प स्पष्ट करती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘लोगों’ और ‘राष्ट्रों’ से עמים तथा גוים का शब्दगत भेद बचाया गया है; ‘आँखों के सामने’ मूल इब्रानी बिंब को बनाए रखता है।
