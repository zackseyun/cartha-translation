language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: בְּשַׂ֤ר גִּבּוֹרִים֙ תֹּאכֵ֔לוּ וְ/דַם נְשִׂיאֵ֥י הָ/אָ֖רֶץ תִּשְׁתּ֑וּ אֵילִ֨ים כָּרִ֤ים וְ/עַתּוּדִים֙ פָּרִ֔ים מְרִיאֵ֥י בָשָׁ֖ן כֻּלָּֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/039/018.yaml
  text: You will eat the flesh of mighty men[a], and you will drink the blood of the princes of the earth—rams, lambs, male goats, and bulls[b], all of them fattened ones of Bashan.
translation:
  language: hi
  text: तुम वीरों का मांस खाओगे और पृथ्वी के प्रधानों का लहू पियोगे—मेढ़े, मेमने, नर बकरे और बैल—बाशान के सभी हृष्ट-पुष्ट पशु[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘मेढ़े, मेमने, नर बकरे और बैल’ मारे गए शासकों और योद्धाओं के लिए प्रयुक्त बलिदानी रूपक हैं। या, ‘बाशान के मोटे-ताज़े पशु।’ बाशान अपने उपजाऊ चरागाहों और अच्छी तरह पले पशुओं के लिए प्रसिद्ध था।
    reason: cultural_note; lexical_alternative
lexical_decisions:
- source_word: בְּשַׂר
  choice: मांस
  rationale: यहाँ वास्तविक देह के मांस का बिंब है। ‘मांस’ आधुनिक हिन्दी में स्वाभाविक है और बलिदान-भोज की कठोर छवि बनाए रखता है।
- source_word: גִּבּוֹרִים
  choice: वीरों
  rationale: संदर्भ में यह शक्तिशाली योद्धाओं को सूचित करता है। ‘वीरों’ संक्षिप्त, स्वाभाविक और गरिमापूर्ण है।
- source_word: תֹּאכֵלוּ
  choice: तुम ... खाओगे
  rationale: द्वितीय पुरुष बहुवचन अपूर्ण क्रिया को यहाँ भविष्यसूचक घोषणा के रूप में व्यक्त किया गया है।
- source_word: דַם
  choice: लहू
  rationale: मूल का प्रत्यक्ष और वीभत्स बलिदानी बिंब बिना नरम किए रखा गया है; ‘लहू’ इस काव्यात्मक-भविष्यसूचक प्रसंग में स्वाभाविक है।
- source_word: נְשִׂיאֵי הָאָרֶץ
  choice: पृथ्वी के प्रधानों
  rationale: ‘प्रधान’ शासकों या उच्च अगुओं का भाव रखता है और ‘पृथ्वी’ प्रसंग के व्यापक, अंतरराष्ट्रीय आशय को ‘देश’ की अपेक्षा बेहतर सुरक्षित रखती है।
- source_word: תִּשְׁתּוּ
  choice: तुम ... पियोगे
  rationale: अपूर्ण क्रिया को समानांतर भविष्यसूचक घोषणा के रूप में अनूदित किया गया है।
- source_word: אֵילִים
  choice: मेढ़े
  rationale: पशुओं की बलिदानी सूची में इसका प्रत्यक्ष पशुवाचक अर्थ उपयुक्त है।
- source_word: כָּרִים
  choice: मेमने
  rationale: यह भेड़ के छोटे या पाले-पोसे पशुओं को सूचित कर सकता है; ‘मेमने’ इसे पहले आए ‘मेढ़े’ से अलग रखता है।
- source_word: עַתּוּדִים
  choice: नर बकरे
  rationale: शब्द विशेष रूप से नर बकरों को सूचित करता है; आधुनिक हिन्दी में ‘नर बकरे’ स्पष्ट है।
- source_word: פָּרִים
  choice: बैल
  rationale: बलिदानी पशुओं की सूची में गोवंशीय नर पशुओं के लिए यह सीधा और परिचित हिन्दी शब्द है।
- source_word: מְרִיאֵי בָשָׁן
  choice: बाशान के हृष्ट-पुष्ट पशु
  rationale: यह बाशान के समृद्ध चरागाहों में अच्छी तरह पले पशुओं का बिंब देता है। ‘हृष्ट-पुष्ट’ मोटे और अच्छी तरह पाले होने का भाव गरिमापूर्ण आधुनिक हिन्दी में व्यक्त करता है।
- source_word: כֻּלָּם
  choice: जो सभी
  rationale: यह पूरी पशु-सूची को सामूहिक रूप से समेटता है और हिन्दी वाक्य में स्वाभाविक संबंध स्थापित करता है।
theological_decisions:
- issue: पशुओं की सूची को केवल वास्तविक पशुधन मानना या मारे गए शासकों और योद्धाओं का रूपक मानना
  choice: मुख्य पाठ में पशुओं के नाम ज्यों के त्यों रखे गए हैं और विराम-चिह्न तथा पादटिप्पणी से उनका मनुष्यों के लिए बलिदानी रूपक होना स्पष्ट किया गया है।
  alternative: सूची को सीधे मानवीय पदों में खोलकर अनूदित करना, जैसे ‘बलवान अगुए और शासक’।
  rationale: इब्रानी पाठ मनुष्य-पीड़ितों को बलिदानी पशुओं के रूप में चित्रित करता है। पशुओं के नाम हटाने से यह जानबूझकर रची गई तीखी छवि सपाट हो जाती।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में गरिमापूर्ण और सहज रखी गई है। ‘वीरों’, ‘प्रधानों’ और ‘लहू’ से भविष्यसूचक काव्य का ऊँचा स्वर बना रहता है, जबकि पशुओं की प्रत्यक्ष सूची मूल की कठोर बलिदानी छवि को सुरक्षित रखती है।
