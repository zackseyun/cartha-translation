language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: כְּ/טֻמְאָתָ֥/ם וּ/כְ/פִשְׁעֵי/הֶ֖ם עָשִׂ֣יתִי אֹתָ֑/ם וָ/אַסְתִּ֥ר פָּנַ֖/י מֵ/הֶֽם׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/039/024.yaml
  text: According to their uncleanness and according to their transgressions I dealt with them[a], and I hid my face from them.
translation:
  language: hi
  text: उनकी अशुद्धता और उनके अपराधों के अनुसार मैंने उनके साथ व्यवहार किया,[a] और मैंने उनसे अपना मुख छिपा लिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उनकी अपवित्रता और उनके विद्रोहों के अनुसार मैंने उनके साथ बर्ताव किया।”
    reason: טֻמְאָה के लिए ‘अपवित्रता’, פֶּשַׁע के लिए ‘विद्रोह’, और עָשִׂיתִי אֹתָם के लिए ‘बर्ताव किया’ सम्भव शाब्दिक विकल्प हैं।
lexical_decisions:
- source_word: כְּטֻמְאָתָם
  choice: उनकी अशुद्धता के अनुसार
  rationale: उपसर्ग כְּ अनुरूपता या माप (‘के अनुसार’) व्यक्त करता है। טֻמְאָה यहेजकेल में धार्मिक और नैतिक, दोनों प्रकार की अशुद्धता को समेट सकती है; ‘अशुद्धता’ आधुनिक हिन्दी में स्वाभाविक रहते हुए इस व्यापक अर्थ को बनाए रखती है।
- source_word: וּכְפִשְׁעֵיהֶם
  choice: और उनके अपराधों के अनुसार
  rationale: פֶּשַׁע परमेश्वर के विरुद्ध उल्लंघन अथवा विद्रोह का भाव रखता है। ‘अपराध’ सहज और गरिमापूर्ण हिन्दी है; पादटिप्पणी ‘विद्रोह’ वाले अधिक प्रबल अर्थ को सुरक्षित रखती है।
- source_word: עָשִׂיתִי אֹתָם
  choice: मैंने उनके साथ व्यवहार किया
  rationale: यहाँ עשה + कर्म का अर्थ उन्हें ‘बनाना’ नहीं, बल्कि उनके साथ किसी प्रकार का व्यवहार करना है। यह हिन्दी मुहावरा न्याय के संदर्भ में मूल भाव स्पष्ट करता है।
- source_word: וָאַסְתִּר פָּנַי מֵהֶם
  choice: और मैंने उनसे अपना मुख छिपा लिया
  rationale: मूल रूपक को बनाए रखा गया है। यह न्याय में अनुग्रह या उपस्थिति वापस लेने का संकेत देता है, पर मुख्य पाठ में उसका अर्थ केवल एक व्याख्या तक सीमित नहीं किया गया।
- source_word: פָּנַי
  choice: अपना मुख
  rationale: ‘मुख’ गरिमापूर्ण बाइबिलीय शैली में मूल चित्र को स्पष्टतः सुरक्षित रखता है; इसे केवल ‘कृपा’ या ‘उपस्थिति’ कहकर व्याख्यायित नहीं किया गया।
theological_decisions:
- issue: ‘मैंने अपना मुख छिपा लिया’ मुहावरे को व्याख्यात्मक रूप में प्रस्तुत करना
  choice: मुख छिपाने का मूल रूपक मुख्य पाठ में बनाए रखना
  alternative: मैं उनसे फिर गया / मैंने अपनी कृपा उनसे हटा ली
  rationale: यह रूपक वाचा-संबंधी न्याय, उपस्थिति और कृपा के हटने जैसे परस्पर जुड़े अर्थ रख सकता है। शाब्दिक चित्र बनाए रखने से धर्मवैज्ञानिक तनाव और अर्थ-व्याप्ति सुरक्षित रहती है।
- issue: טֻמְאָה का धार्मिक अथवा नैतिक आशय
  choice: अशुद्धता
  alternative: अपवित्रता
  rationale: यहेजकेल में यह शब्द धार्मिक और नैतिक दूषण दोनों को सूचित कर सकता है। ‘अशुद्धता’ किसी एक पहलू तक अर्थ को सीमित नहीं करती।
- issue: פֶּשַׁע में उल्लंघन और विद्रोह के बीच बलाघात
  choice: अपराध
  alternative: विद्रोह
  rationale: ‘अपराध’ पद्य में स्वाभाविक है और दोषपूर्ण उल्लंघन का भाव देता है, जबकि पादटिप्पणी ‘विद्रोह’ की अधिक स्पष्ट वाचा-विरोधी छाया सुरक्षित रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और भविष्यद्वक्ताई शैली। ‘मुख छिपाना’ मूल बाइबिलीय रूपक के रूप में रखा गया है। पादटिप्पणी-चिह्न [a] मुख्य पाठ में उपस्थित है।
