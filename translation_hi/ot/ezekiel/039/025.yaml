  text: לָ/כֵ֗ן כֹּ֤ה אָמַר֙ אֲדֹנָ֣/י יְהוִ֔ה עַתָּ֗ה אָשִׁיב֙ אֶת שבית יַֽעֲקֹ֔ב וְ/רִֽחַמְתִּ֖י כָּל בֵּ֣ית יִשְׂרָאֵ֑ל וְ/קִנֵּאתִ֖י לְ/שֵׁ֥ם קָדְשִֽׁ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/039/025.yaml
  text: 'Therefore thus says the Lord GOD: Now I will restore the fortunes of Jacob[a], and I will have compassion on the whole house of Israel[b], and I will be jealous for my holy name.'
translation:
  language: hi
  text: 'इसलिए प्रभु याहवे यों कहते हैं: “अब मैं याकूब की दशा बहाल करूँगा[a], पूरे इस्राएल के घराने पर दया करूँगा, और अपने पवित्र नाम के लिए ईर्ष्यालु होऊँगा[b]।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मैं याकूब के बंधुआ लोगों को वापस लाऊँगा।” हिब्रू मुहावरा विशेष रूप से बंधुआई से वापसी या अधिक व्यापक रूप से किसी जाति की दशा बहाल किए जाने—दोनों को व्यक्त कर सकता है।
    reason: alternative_reading
  - marker: b
    text: या, “मैं अपने पवित्र नाम के लिए जोश दिखाऊँगा।”
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: इसलिए
  rationale: यह पिछले कथन से निकलने वाले निष्कर्ष को स्वाभाविक और स्पष्ट हिन्दी में व्यक्त करता है।
- source_word: כֹּה אָמַר
  choice: यों कहते हैं
  rationale: यह नबूवत में प्रयुक्त संदेशवाहक सूत्र को गरिमापूर्ण और सहज हिन्दी में बनाए रखता है।
- source_word: אֲדֹנָי יְהוִה
  choice: प्रभु याहवे
  rationale: אֲדֹנָי को ‘प्रभु’ और परमेश्वर के व्यक्तिगत वाचा-नाम יהוה को ‘याहवे’ के रूप में अलग-अलग सुरक्षित रखता है।
- source_word: עַתָּה
  choice: अब
  rationale: यह परमेश्वर की आगामी निर्णायक कार्रवाई की ओर संक्रमण को संक्षेप में व्यक्त करता है।
- source_word: אָשִׁיב אֶת שבית יַעֲקֹב
  choice: मैं याकूब की दशा फिर सुधारूँगा
  rationale: यह हिब्रू पुनर्स्थापना-वाक्यांश का व्यापक अर्थ स्वाभाविक हिन्दी में देता है, जबकि बंधुआई से लौटाने का अधिक विशिष्ट अर्थ पादटिप्पणी में रखा गया है।
- source_word: יַעֲקֹב
  choice: याकूब
  rationale: मूल पाठ में आए पितृपुरुष के नाम को ‘इस्राएल’ से समरूप किए बिना सुरक्षित रखता है।
- source_word: וְרִחַמְתִּי
  choice: दया करूँगा
  rationale: यह गहरी करुणा और कृपा के भाव को साधारण आधुनिक हिन्दी में स्पष्ट रूप से व्यक्त करता है।
- source_word: כָּל בֵּית יִשְׂרָאֵל
  choice: इस्राएल के पूरे घराने
  rationale: ‘घराना’ सामूहिक और वाचागत अभिव्यक्ति को बनाए रखता है तथा ‘पूरे’ से כָּל का बल प्रकट होता है।
- source_word: וְקִנֵּאתִי
  choice: मैं ... जलन रखूँगा
  rationale: ‘जलन’ परमेश्वर के नाम के प्रति ईर्ष्यापूर्ण, प्रबल और अनन्य सरोकार को सुरक्षित रखती है; ‘जोश दिखाऊँगा’ विकल्प के रूप में दिया गया है।
- source_word: לְשֵׁם קָדְשִׁי
  choice: अपने पवित्र नाम के लिए
  rationale: यह परमेश्वर की जलन या उत्साह के लक्ष्य को संक्षिप्त और निष्ठापूर्वक व्यक्त करता है।
theological_decisions:
- issue: परमेश्वर के नाम יהוה का अनुवाद
  choice: प्रभु याहवे
  alternative: प्रभु यहोवा / प्रभु परमेश्वर
  rationale: लिप्यंतरण ‘याहवे’ मूल पाठ के व्यक्तिगत वाचा-नाम को सामान्य पदवी से अलग रखता है।
- issue: אֶת שבית יעקב पुनर्स्थापना-वाक्यांश का अर्थ
  choice: याकूब की दशा फिर सुधारूँगा
  alternative: याकूब के बंधुओं को लौटा लाऊँगा
  rationale: हिब्रू वाक्यांश व्यापक पुनर्स्थापना और विशेष रूप से बंधुआई से वापसी—दोनों का संकेत दे सकता है; मुख्य पाठ व्यापक अर्थ देता है और पादटिप्पणी विशिष्ट अर्थ को सुरक्षित रखती है।
- issue: परमेश्वर की קנאה का भाव
  choice: अपने पवित्र नाम के लिए जलन रखूँगा
  alternative: अपने पवित्र नाम के लिए जोश दिखाऊँगा
  rationale: ‘जलन’ अनन्य वाचागत सरोकार की तीव्रता को बनाए रखती है, जबकि पादटिप्पणी यह स्पष्ट करती है कि इसे पापपूर्ण डाह के अर्थ में समझना आवश्यक नहीं है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण और सार्वजनिक पाठ के योग्य रखी गई है। ‘यों कहते हैं’ नबूवत के औपचारिक स्वर को बनाए रखता है; ‘जलन रखूँगा’ कुछ बाइबलीय गंभीरता रखता है, इसलिए उसका अधिक सामान्य विकल्प पादटिप्पणी में दिया गया है।
