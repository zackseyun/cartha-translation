source:
  edition: WLC
  text: וְ/לֹֽא יִשְׂא֨וּ עֵצִ֜ים מִן הַ/שָּׂדֶ֗ה וְ/לֹ֤א יַחְטְבוּ֙ מִן הַ/יְּעָרִ֔ים כִּ֥י בַ/נֶּ֖שֶׁק יְבַֽעֲרוּ אֵ֑שׁ וְ/שָׁלְל֣וּ אֶת שֹׁלְלֵי/הֶ֗ם וּ/בָֽזְזוּ֙ אֶת בֹּ֣זְזֵי/הֶ֔ם נְאֻ֖ם אֲדֹנָ֥/י יְהוִֽה־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/039/010.yaml
  text: They will not carry wood from the field[a], nor cut it from the forests, because they will make fires with the weapons. They will plunder those who plundered them and loot those who looted them[b], declares the Lord Yahweh.
translation:
  language: hi
  text: वे मैदान से लकड़ी नहीं लाएँगे और न जंगलों से लकड़ी काटेंगे, क्योंकि वे हथियारों से आग जलाएँगे।[a] वे उन लोगों को लूटेंगे जिन्होंने उन्हें लूटा था, और उन लोगों का माल छीनेंगे जिन्होंने उनका माल छीना था।[b] प्रभु याहवे की यह घोषणा है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात, वे आक्रमणकारियों के हथियारों को ईंधन के रूप में इस्तेमाल करेंगे।
    reason: lexical_alternative
  - marker: b
    text: 'इब्रानी में दोनों खंडों में सजातीय शब्द दोहराए गए हैं: “वे अपने लूटने वालों को लूटेंगे और अपना माल छीनने वालों का माल छीनेंगे।” यह प्रतिफल और परिस्थिति के उलट जाने पर बल देता है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִשְׂאוּ עֵצִים מִן הַשָּׂדֶה
  choice: मैदान से लकड़ी नहीं लाएँगे
  rationale: נשא के मूल भाव ‘उठाकर लाना/ले जाना’ को ‘लाएँगे’ सहज हिन्दी में व्यक्त करता है। שׂדה का एकवचन यहाँ सामूहिक अर्थ में है, इसलिए ‘मैदान’ रखा गया है।
- source_word: יַחְטְבוּ מִן הַיְּעָרִים
  choice: जंगलों से लकड़ी काटेंगे
  rationale: חטב विशेषतः लकड़ी काटने के लिए प्रयुक्त है; हिन्दी में स्पष्टता के लिए ‘लकड़ी’ दोहराना स्वाभाविक है। יערים के बहुवचन को ‘जंगलों’ से व्यक्त किया गया है।
- source_word: כִּי בַנֶּשֶׁק יְבַעֲרוּ אֵשׁ
  choice: क्योंकि वे हथियारों से आग जलाएँगे
  rationale: כִּי का कारणसूचक अर्थ ‘क्योंकि’ से और ב का साधनसूचक अर्थ ‘से’ से व्यक्त किया गया है। वाक्य हथियारों को ईंधन के रूप में उपयोग करने का संकेत देता है, पर मुख्य पाठ में मूल बिंब बनाए रखा गया है।
- source_word: וְשָׁלְלוּ אֶת שֹׁלְלֵיהֶם
  choice: वे उन्हें लूटेंगे जिन्होंने उन्हें लूटा था
  rationale: क्रिया और कर्तृवाचक रूप की सजातीय पुनरावृत्ति को ‘लूटेंगे/लूटा’ से बनाए रखा गया है, जिससे प्रतिफल और उलटाव का बल प्रकट होता है।
- source_word: וּבָזְזוּ אֶת בֹּזְזֵיהֶם
  choice: उनका माल छीनेंगे जिन्होंने उनका माल छीना था
  rationale: दूसरे सजातीय पद-युग्म को भी पुनरावृत्ति के साथ प्रस्तुत किया गया है, जबकि शׁלל और בזז के बीच की शब्दगत भिन्नता दिखाने के लिए ‘माल छीनना’ चुना गया है।
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: यह प्रभु याहवे की घोषणा है
  rationale: נְאֻם को भविष्यद्वाणी की घोषणात्मक शैली में ‘घोषणा’ कहा गया है। אֲדֹנָי को ‘प्रभु’ और יהוה को व्यक्तिगत दिव्य नाम ‘याहवे’ के रूप में अलग-अलग सुरक्षित रखा गया है।
theological_decisions:
- issue: אֲדֹנָי יְהוִה में दिव्य नाम का अनुवाद
  choice: प्रभु याहवे
  alternative: प्रभु परमेश्वर / प्रभु यहोवा
  rationale: मूल में उपाधि אֲדֹנָי और दिव्य नाम יהוה दोनों उपस्थित हैं। ‘प्रभु याहवे’ दोनों को अलग रखता है और नाम को सामान्य उपाधि में विलीन नहीं करता।
- issue: लूटने वालों पर प्रतिफल का स्वर
  choice: समान क्रियाओं की पुनरावृत्ति द्वारा उलटाव को स्पष्ट रखना
  alternative: वे अपने शत्रुओं की सम्पत्ति ले लेंगे
  rationale: मूल पाठ में दो सजातीय क्रिया-कर्तृ संरचनाएँ न्यायपूर्ण उलटाव पर बल देती हैं। सामान्यीकृत अनुवाद इस अलंकारिक और धर्मवैचारिक तनाव को घटा देता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘लकड़ी काटेंगे’ में संज्ञा की पुनरावृत्ति हिन्दी की स्पष्टता के लिए है। मुख्य पाठ में हथियारों से आग जलाने का ठोस बिंब सुरक्षित है और उसका निहित अर्थ पादटिप्पणी में दिया गया है।
