  text: וְ/נָתַתִּ֥י אֶת כְּבוֹדִ֖/י בַּ/גּוֹיִ֑ם וְ/רָא֣וּ כָל הַ/גּוֹיִ֗ם אֶת מִשְׁפָּטִ/י֙ אֲשֶׁ֣ר עָשִׂ֔יתִי וְ/אֶת יָדִ֖/י אֲשֶׁר שַׂ֥מְתִּי בָ/הֶֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/039/021.yaml
  text: And I will set my glory among the nations[a], and all the nations will see my judgment that I have executed[b], and my hand that I have laid on them.
translation:
  language: hi
  text: “मैं अपनी महिमा राष्ट्रों के बीच स्थापित करूँगा, और सभी राष्ट्र मेरे न्याय को देखेंगे जो मैंने किया है, और मेरे हाथ को भी, जो मैंने उन पर रखा है।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְנָתַתִּי
  choice: मैं ... स्थापित करूँगा
  rationale: נָתַן का मूल अर्थ ‘देना/रखना/स्थापित करना’ है। महिमा के राष्ट्रों के बीच रखे जाने के संदर्भ में ‘स्थापित करूँगा’ ठोस भाव को बनाए रखते हुए स्वाभाविक हिन्दी देता है।
- source_word: כְּבוֹדִי
  choice: अपनी महिमा
  rationale: כָּבוֹד में महिमा, सम्मान और प्रताप के भाव हैं। यहाँ यह परमेश्वर की वह महिमा है जो उसके न्यायपूर्ण कार्य से राष्ट्रों के सामने प्रकट होती है।
- source_word: בַּגּוֹיִם
  choice: राष्ट्रों के बीच
  rationale: גּוֹיִם यहाँ सामूहिक रूप से अन्य राष्ट्रों को दर्शाता है। ‘राष्ट्रों के बीच’ आधुनिक हिन्दी में स्पष्ट है और अनावश्यक धार्मिक पारिभाषिक अर्थ नहीं जोड़ता।
- source_word: מִשְׁפָּטִי
  choice: मेरे उस न्याय
  rationale: מִשְׁפָּט न्याय, न्यायिक निर्णय या दण्डात्मक न्याय-कार्य का अर्थ दे सकता है। ‘न्याय’ इसकी मूल व्यापकता को बनाए रखता है; प्रसंग उसके लागू किए जाने से न्यायिक कार्य का भाव स्पष्ट करता है।
- source_word: אֲשֶׁר עָשִׂיתִי
  choice: जिसे मैंने लागू किया है
  rationale: עָשָׂה सामान्यतः ‘करना’ है, पर न्याय के साथ हिन्दी में ‘लागू करना’ न्यायिक निर्णय को कार्यरूप देने का स्वाभाविक भाव व्यक्त करता है।
- source_word: יָדִי
  choice: मेरे उस हाथ
  rationale: יָד का शाब्दिक अर्थ ‘हाथ’ है और यहाँ यह परमेश्वर की सक्रिय सामर्थ्य, विशेषकर न्याय में उसकी कार्रवाई, का रूपक है। मुख्य पाठ में मूल बिंब सुरक्षित रखा गया है।
- source_word: אֲשֶׁר שַׂמְתִּי בָהֶם
  choice: जिसे मैंने उन पर रखा है
  rationale: שִׂים ... בְּ के साथ हाथ को किसी पर रखने का ठोस इब्रानी बिंब देता है। हिन्दी में भी यह समझने योग्य है और न्यायपूर्ण कार्रवाई के प्रसंग में रूपक की तीव्रता बनाए रखता है।
theological_decisions:
- issue: राष्ट्रों के बीच परमेश्वर की ‘महिमा’ का अर्थ
  choice: न्याय के ऐतिहासिक कार्य द्वारा राष्ट्रों के सामने स्थापित और दिखाई गई परमेश्वर की महिमा
  alternative: केवल अमूर्त सम्मान या प्रतिष्ठा
  rationale: अगला उपवाक्य राष्ट्रों द्वारा परमेश्वर के न्याय और उसके हाथ को देखने की बात करता है; इसलिए यहाँ महिमा उसके कार्यों के द्वारा सार्वजनिक रूप से पहचानी जाती है।
- issue: ‘मेरे हाथ’ का आशय
  choice: परमेश्वर की न्यायकारी सक्रिय सामर्थ्य का रूपक, जिसे मुख्य पाठ में ‘हाथ’ ही रखा गया है
  alternative: मुख्य पाठ में सीधे ‘मेरी सामर्थ्य’ या ‘मेरी कार्रवाई’ कहना
  rationale: मूल इब्रानी का सजीव रूपक अर्थपूर्ण है और प्रसंग उसका न्यायिक आशय स्पष्ट करता है; उसे व्याख्यात्मक शब्द से बदलना आवश्यक नहीं है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘महिमा’, ‘न्याय’ और ‘हाथ’ जैसे प्रमुख धार्मिक तथा काव्यात्मक शब्द मूल इब्रानी की अर्थ-व्याप्ति और बिंब को बनाए रखते हैं।
