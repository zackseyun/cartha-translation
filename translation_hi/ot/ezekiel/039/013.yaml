  text: וְ/קָֽבְרוּ֙ כָּל עַ֣ם הָ/אָ֔רֶץ וְ/הָיָ֥ה לָ/הֶ֖ם לְ/שֵׁ֑ם י֚וֹם הִכָּ֣בְדִ֔/י נְאֻ֖ם אֲדֹנָ֥/י יְהוִֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/039/013.yaml
  text: All the people of the land will bury them[a], and it will be to their renown on the day I glorify myself[b], declares the Lord GOD.
translation:
  language: hi
  text: देश के सब लोग उन्हें दफनाएँगे, और जिस दिन मैं महिमान्वित ठहरूँगा[b], उस दिन यह उनके लिए यश का कारण होगा[a]—प्रभु याहवे की यह वाणी है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “यह उनके लिए एक नाम होगा”; यहाँ “नाम” का अर्थ सम्मान, प्रतिष्ठा या यश है।
    reason: lexical_alternative
  - marker: b
    text: इसे “जिस दिन मैं अपनी महिमा प्रकट करूँगा” या “जिस दिन मेरी महिमा प्रकट होगी” भी समझा जा सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: וְקָבְרוּ
  choice: गाड़ेंगे
  rationale: भविष्यसूचक प्रसंग में यह क्रिया भविष्य की घटना बताती है। ‘गाड़ेंगे’ शवों को भूमि में दफनाने की ठोस क्रिया को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: כָּל עַם הָאָרֶץ
  choice: देश के सब लोग
  rationale: यहाँ स्थानीय दफनाने के प्रसंग में הָאָרֶץ से पूरी पृथ्वी के बजाय उस देश का संकेत मिलता है। सामूहिक עַם के लिए ‘सब लोग’ सहज है।
- source_word: וְהָיָה לָהֶם לְשֵׁם
  choice: यह उनके लिए सम्मान का कारण होगा
  rationale: शाब्दिक अर्थ ‘उनके लिए एक नाम होगा’ है, पर ‘नाम’ यहाँ प्रतिष्ठा या यश का इब्रानी मुहावरा है। चुना हुआ रूप अर्थ स्पष्ट करता है और दफनाने के सामूहिक कार्य को सम्मान का कारण बताता है।
- source_word: יוֹם הִכָּבְדִי
  choice: जिस दिन मैं अपनी महिमा प्रकट करूँगा
  rationale: यह रूप परमेश्वर की महिमा के प्रत्यक्ष होने को व्यक्त करता है। हिन्दी में यह वाक्य स्वाभाविक है; कर्मवाच्य या आत्मवाचक अर्थ-संभावना को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: प्रभु यहोवा की यह घोषणा है
  rationale: נְאֻם मानक भविष्यद्वाणी-सूत्र ‘घोषणा’ को सूचित करता है। אֲדֹנָי יְהוִה में उपाधि और व्यक्तिगत दिव्य नाम दोनों को ‘प्रभु यहोवा’ के रूप में अलग-अलग बनाए रखा गया है।
theological_decisions:
- issue: יוֹם הִכָּבְדִי में परमेश्वर की महिमा के प्रकट होने का वाच्य
  choice: जिस दिन मैं अपनी महिमा प्रकट करूँगा
  alternative: जिस दिन मेरी महिमा की जाएगी; जिस दिन मैं महिमावान ठहरूँगा
  rationale: इब्रानी निफ़अल रूप को कर्मवाच्य, आत्मवाचक, अथवा परमेश्वर द्वारा अपनी महिमा प्रकट करने के अर्थ में समझा जा सकता है। मुख्य पाठ स्वाभाविक हिन्दी में आत्म-प्रकाशन का अर्थ देता है और पादटिप्पणी वास्तविक अस्पष्टता बनाए रखती है।
- issue: אֲדֹנָי יְהוִה में दिव्य नाम का अनुवाद
  choice: प्रभु यहोवा
  alternative: प्रभु याहवे; परमेश्वर प्रभु
  rationale: ‘यहोवा’ आधुनिक हिन्दी बाइबलीय प्रयोग में पहचाना जाने वाला व्यक्तिगत नाम है और אֲדֹנָי से अलग रहता है; इससे उपाधि और वाचा-संबंधी नाम दोनों सुरक्षित रहते हैं।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। वाक्य-क्रम को सहज हिन्दी के लिए थोड़ा बदला गया है, पर दफनाने का कार्य, उससे मिलने वाला सामूहिक सम्मान, परमेश्वर की महिमा का दिन और भविष्यद्वाणी-सूत्र सभी सुरक्षित हैं।
