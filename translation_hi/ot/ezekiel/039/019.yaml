base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/039/019.yaml
  text: You will eat fat until you are full[a], and you will drink blood to drunkenness, from my sacrifice that I have sacrificed for you.
translation:
  language: hi
  text: तुम मेरे उस बलिदान में से, जिसे मैंने तुम्हारे लिए बलि चढ़ाया है, चरबी खाकर तृप्त हो जाओगे[a] और लहू पीकर मतवाले हो जाओगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मेरे उस बलि-भोज में से, जिसे मैंने तुम्हारे लिए तैयार किया है।” इब्रानी में शाब्दिक रूप से बलिदान की भाषा है (“मेरा बलिदान ... मैंने बलि चढ़ाया”), जबकि व्यापक प्रसंग स्पष्ट करता है कि यह मारे गए लोगों पर होने वाला भोज है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲכַלְתֶּם
  choice: तुम ... खाकर ... हो जाओगे
  rationale: भविष्यसूचक संबोधन में 2 पुरुष बहुवचन क्रिया आगे होने वाली घटना बताती है; हिन्दी में परिणामसूचक संयुक्त रचना स्वाभाविक है।
- source_word: חֵלֶב
  choice: चरबी
  rationale: यह संज्ञा बलि-पशु की चरबी को सीधे व्यक्त करती है और बलिदान-संबंधी बिंब बनाए रखती है।
- source_word: לְשָׂבְעָה
  choice: तृप्त हो जाओगे
  rationale: यह तृप्ति अथवा भरपेट होने के परिणाम को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: וּשְׁתִיתֶם דָּם
  choice: और लहू पीकर
  rationale: समानांतर भविष्यसूचक क्रिया तथा जानबूझकर चौंकाने वाले रक्तपान के बिंब को स्पष्ट रखा गया है।
- source_word: לְשִׁכָּרוֹן
  choice: मतवाले हो जाओगे
  rationale: לְ के परिणाम/सीमा-बोध और שִׁכָּרוֹן के नशे अथवा मतवालेपन के अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: מִזִּבְחִי
  choice: मेरे उस बलिदान में से
  rationale: प्रथम पुरुष एकवचन प्रत्यय सहित זֶבַח का सीधा अर्थ रखा गया है; 'भोज' जोड़कर प्रसंग की व्याख्या को मुख्य पाठ में नहीं मिलाया गया।
- source_word: אֲשֶׁר זָבַחְתִּי לָכֶם
  choice: जिसे मैंने तुम्हारे लिए बलि किया है
  rationale: संज्ञा और उसी धातु से बनी क्रिया की जानबूझकर की गई पुनरुक्ति को 'बलिदान ... बलि किया' द्वारा यथासंभव सुरक्षित रखा गया है; לָכֶם को 'तुम्हारे लिए' कहा गया है।
theological_decisions:
- issue: परमेश्वर के न्याय पर लागू बलिदान का बिंब
  choice: मुख्य पाठ में स्पष्ट बलिदानी भाषा—'मेरे उस बलिदान ... बलि किया'—बनाए रखना
  alternative: मेरे उस बलि-भोज में से, जिसे मैंने तुम्हारे लिए तैयार किया है
  rationale: प्रसंग में गोग की सेना पर परमेश्वर का न्याय पक्षियों और वन-पशुओं के भोज हेतु बलि के रूप में चित्रित है। स्पष्ट बलिदानी पुनरुक्ति को बनाए रखने से न्याय की तीव्रता बनी रहती है और पाठ में अतिरिक्त सिद्धान्त नहीं जोड़ा जाता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। 'चरबी' और 'लहू' बलिदानी तथा न्याय-संबंधी कठोर बिंब को स्पष्ट रखते हैं। वाक्यक्रम को हिन्दी में प्रवाहपूर्ण बनाने के लिए स्रोत के अंतिम पदबंध को आरम्भ में रखा गया है, बिना अर्थगत संबंध बदले।
