  text: וְ/יָדְע֗וּ כִּ֣י אֲנִ֤י יְהוָה֙ אֱלֹ֣הֵי/הֶ֔ם בְּ/הַגְלוֹתִ֤/י אֹתָ/ם֙ אֶל הַ/גּוֹיִ֔ם וְ/כִנַּסְתִּ֖י/ם עַל אַדְמָתָ֑/ם וְ/לֹֽא אוֹתִ֥יר ע֛וֹד מֵ/הֶ֖ם שָֽׁם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/039/028.yaml
  text: Then they will know that I am Yahweh their God[a], when I exiled them among the nations and then gathered them onto their own land, and I will leave none of them there any longer.
translation:
  language: hi
  text: तब वे जानेंगे कि मैं याहवे, उनका परमेश्वर हूँ,[a] जब मैंने उन्हें राष्ट्रों के बीच निर्वासित किया और उनकी अपनी भूमि पर इकट्ठा किया; और मैं उनमें से किसी को भी वहाँ फिर नहीं छोड़ूँगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “और वे जानेंगे कि मैं याहवे, उनका परमेश्वर हूँ—इस बात से कि मैंने उन्हें राष्ट्रों के बीच निर्वासित किया और उनकी अपनी भूमि पर इकट्ठा किया।”
    reason: हिब्रू में בְּ + क्रियार्थक संज्ञा समय (‘जब’) अथवा साधन/प्रमाण (‘इस बात से कि/के द्वारा’) दोनों व्यक्त कर सकती है।
lexical_decisions:
- source_word: וְיָדְעוּ
  choice: तब वे जानेंगे
  rationale: क्रिया का अर्थ ‘जानना/पहचानना’ है। आरंभिक וְ को प्रसंग में परिणाम और क्रम दर्शाने वाले स्वाभाविक हिन्दी शब्द ‘तब’ से व्यक्त किया गया है।
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत नाम יהוה को उपाधि से बदलने के बजाय देवनागरी में ‘याहवे’ लिखा गया है।
- source_word: אֱלֹהֵיהֶם
  choice: उनका परमेश्वर
  rationale: सम्बन्धवाचक प्रत्यय का सीधा और स्वाभाविक हिन्दी रूप।
- source_word: בְּהַגְלוֹתִי אֹתָם אֶל־הַגּוֹיִם
  choice: जब मैं उन्हें जाति-जाति के बीच निर्वासित करने के बाद
  rationale: גלה का हिफ़ील रूप निर्वासन करवाने की परमेश्वर की क्रिया बताता है। हिन्दी में ‘निर्वासित करने के बाद’ निर्वासन और पुनः एकत्रीकरण का क्रम स्पष्ट करता है; בְּ की साधनवाचक सम्भावना पादटिप्पणी में सुरक्षित है। ‘जाति-जाति के बीच’ यहाँ विदेशी राष्ट्रों में बिखराव को व्यक्त करता है।
- source_word: וְכִנַּסְתִּים עַל אַדְמָתָם
  choice: उनकी अपनी भूमि पर इकट्ठा करूँगा
  rationale: כנס का अर्थ ‘इकट्ठा करना’ है और עַל אַדְמָתָם उनकी भूमि पर पुनर्स्थापन दर्शाता है। भविष्यकाल व्यापक भविष्यवाणी-संदर्भ के अनुरूप है, यद्यपि हिब्रू में पूर्ण क्रियारूप घटना की निश्चितता को उभारता है।
- source_word: וְלֹא אוֹתִיר עוֹד מֵהֶם שָׁם
  choice: और उनमें से किसी को भी वहाँ नहीं छोड़ूँगा
  rationale: הותיר का अर्थ ‘शेष छोड़ना’ है। हिन्दी का ‘किसी को भी ... नहीं’ पूर्ण निषेध व्यक्त करता है; प्रसंग में ‘वहाँ’ निर्वासन के स्थान, अर्थात् जाति-जाति के बीच, की ओर संकेत करता है।
theological_decisions:
- issue: בְּהַגְלוֹתִי से आरम्भ होने वाले खंड का सम्बन्ध
  choice: 'मुख्य पाठ में इसे समय और घटनाक्रम के रूप में व्यक्त किया गया है: निर्वासन के बाद पुनः एकत्र किए जाने पर वे याहवे को जानेंगे।'
  alternative: 'इसे साधन या प्रमाण के रूप में पढ़ा जा सकता है: निर्वासित करने और फिर इकट्ठा करने के द्वारा वे जानेंगे।'
  rationale: हिब्रू בְּ + infinitive construct समय (‘जब’) और साधन (‘के द्वारा’) दोनों अर्थ दे सकता है। किसी एक धार्मिक निष्कर्ष को अनावश्यक रूप से स्थिर न करने के लिए वैकल्पिक अर्थ पादटिप्पणी में रखा गया है।
- issue: שָׁם (‘वहाँ’) का संदर्भ
  choice: ‘वहाँ’ जाति-जाति के बीच निर्वासन के स्थान को सूचित करता है।
  alternative: इसे बिना स्पष्ट पूर्वपद वाला सामान्य स्थानवाचक संकेत माना जा सकता है।
  rationale: निकटतम प्रसंग निर्वासन की जातियों और अपनी भूमि पर पुनः एकत्रीकरण का विरोध रखता है; इसलिए वादा यह है कि कोई भी निर्वासन में शेष नहीं रहेगा।
- issue: וְכִנַּסְתִּים का काल
  choice: हिन्दी में भविष्यकाल ‘इकट्ठा करूँगा’
  alternative: पूर्णता और भविष्यवाणी की निश्चितता उभारने के लिए ‘इकट्ठा किया’
  rationale: हिब्रू पूर्ण रूप भविष्यवाणी के संदर्भ में निश्चित भावी कार्य को दर्शा सकता है। अगले खंड אוֹתִיר का स्पष्ट अपूर्ण/भावी रूप और अध्याय का संदर्भ हिन्दी भविष्यकाल का समर्थन करते हैं।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सामान्य-पाठक के लिए सुबोध रूप अपनाया गया है। ‘जाति-जाति के बीच’ बाइबलीय ‘राष्ट्रों’ का स्वाभाविक सामूहिक बोध देता है; ‘निर्वासित’ और ‘इकट्ठा’ क्रमशः न्याय और पुनर्स्थापन की शब्दावली बनाए रखते हैं।
