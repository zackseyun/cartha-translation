base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/039/009.yaml
  text: Then the inhabitants of the cities of Israel will go out and make fires with the weapons and burn them—the small shield and the large shield[a], the bow and the arrows[c][b], the hand-club and the spear—and they will make fires with them for seven years.
translation:
  language: hi
  text: तब इस्राएल के नगरों के निवासी बाहर निकलेंगे और हथियारों से आग जलाएँगे और उन्हें जलाएँगे[a]—छोटी ढाल और बड़ी ढाल[b], धनुष और तीर, हाथ का डंडा[c] और भाला—और वे सात वर्ष तक उनसे आग जलाते रहेंगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इस खंड की दूसरी इब्रानी क्रिया का अर्थ यहाँ निश्चित नहीं है। या, “हथियारों से आग सुलगाएँगे”; प्रसंग से स्पष्ट है कि हथियार आग के लिए इस्तेमाल होंगे।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी पाठ में ढाल के लिए दो भिन्न शब्द हैं; संभवतः पहला छोटी ढाल और दूसरा शरीर को अधिक ढकनेवाली बड़ी ढाल को दर्शाता है।
    reason: cultural_note
  - marker: c
    text: इब्रानी पदबंध का शाब्दिक अर्थ “हाथ का डंडा” है। हथियारों की इस सूची में शायद हाथ में लेकर प्रहार करनेवाला डंडा अभिप्रेत है।
    reason: lexical_alternative
