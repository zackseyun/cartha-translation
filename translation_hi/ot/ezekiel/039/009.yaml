  rationale: दोनों इब्रानी क्रियाएँ जलाने या सुलगाने से संबंधित हैं, पर दूसरी क्रिया यहाँ कठिन है। प्रसंग स्पष्ट करता है कि युद्ध के हथियार आग के ईंधन बनेंगे; हिन्दी रूप इसी आशय को स्वाभाविक ढंग से व्यक्त करता है।
