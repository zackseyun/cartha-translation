source:
  edition: WLC
  text: וְ/אַתָּ֤ה בֶן אָדָם֙ הִנָּבֵ֣א עַל גּ֔וֹג וְ/אָ֣מַרְתָּ֔ כֹּ֥ה אָמַ֖ר אֲדֹנָ֣/י יְהוִ֑ה הִנְ/נִ֤י אֵלֶ֨י/ךָ֙ גּ֔וֹג נְשִׂ֕יא רֹ֖אשׁ מֶ֥שֶׁךְ וְ/תֻבָֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/039/001.yaml
  text: 'And you[a], son of man, prophesy against Gog, and say: Thus says the Lord GOD: Behold, I am against you, Gog, prince of Rosh, Meshech, and Tubal.'
translation:
  language: hi
  text: 'और तू, हे मनुष्य-पुत्र, गोग के विरुद्ध भविष्यवाणी कर और कह, ‘प्रभु यहोवा यह कहते हैं: देख, हे गोग, मेशेक और तूबल के प्रधान शासक, मैं तेरे विरुद्ध हूँ।[a]’'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “हे गोग, रोश, मेशेक और तूबल के शासक।” इब्रानी शब्द रोश का अर्थ “प्रधान” हो सकता है, या इसे उचित नाम “रोश” के रूप में पढ़ा जा सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: בֶן אָדָם
  choice: मनुष्य के सन्तान
  rationale: यहेजकेल में यह परमेश्वर द्वारा नबी को किया जाने वाला विशिष्ट और बार-बार प्रयुक्त संबोधन है; हिन्दी में प्रचलित बाइबलीय मुहावरा साहित्यिक निरन्तरता बनाए रखता है।
- source_word: הִנָּבֵא עַל
  choice: के विरुद्ध भविष्यवाणी कर
  rationale: न्याय-वाणी के प्रसंग में עַל लक्ष्य के प्रति विरोधसूचक है; इसलिए ‘के विषय में’ की अपेक्षा ‘के विरुद्ध’ उपयुक्त है।
- source_word: אֲדֹנָי יְהוִה
  choice: प्रभु यहोवा
  rationale: दोनों दैवी पदों को अलग रखते हुए वाचा-सूचक नाम יהוה को हिन्दी में ‘यहोवा’ से व्यक्त किया गया है।
- source_word: הִנְנִי אֵלֶיךָ
  choice: देख, मैं तेरे विरुद्ध हूँ
  rationale: הִנְנִי की बलात्मक, गंभीर उद्घोषणा और न्याय-सूत्र में אֵלֶיךָ का विरोधसूचक भाव दोनों सुरक्षित हैं।
- source_word: נְשִׂיא
  choice: शासक
  rationale: यह पद किसी प्रमुख राजनीतिक या जनजातीय अगुवे को सूचित करता है; आधुनिक हिन्दी में ‘शासक’ स्वाभाविक है और राजवंशीय अर्थ को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: רֹאשׁ
  choice: प्रधान
  rationale: मुख्य पाठ में इसे सामान्य संज्ञा/विशेषण मानकर נְשִׂיא का विशेषक समझा गया है; उचित नाम ‘रोश’ की वास्तविक सम्भावना पादटिप्पणी में रखी गई है।
- source_word: מֶשֶׁךְ וְתֻבָל
  choice: मेशेक और तूबल
  rationale: इन उचित नामों को अनुवादित करने के बजाय हिन्दी ध्वन्यंतरण में रखा गया है।
theological_decisions:
- issue: אֲדֹנָי יְהוִה में दैवी नाम का अनुवाद
  choice: प्रभु यहोवा
  alternative: प्रभु परमेश्वर
  rationale: मूल में उपस्थित व्यक्तिगत वाचा-सूचक नाम को छिपाने के बजाय हिन्दी में प्रचलित ‘यहोवा’ रूप से सुरक्षित रखा गया है।
- issue: רֹאשׁ को उपाधि मानें या उचित नाम
  choice: मेशेक और तूबल का प्रधान शासक
  alternative: रोश, मेशेक और तूबल का शासक
  rationale: व्यंजनयुक्त पाठ और सामान्य शब्दार्थ ‘सिर/प्रधान’ शीर्षक-संबंधी पठन की अनुमति देते हैं, जबकि उचित नाम वाला पठन भी प्राचीन और सम्भव है; इसलिए मुख्य पाठ में पहला और पादटिप्पणी में दूसरा रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और भविष्यद्वाणी की गंभीर शैली के अनुरूप है। ‘हे’, ‘तू’ और ‘यों कहते हैं’ मूल संबोधन तथा दैवी घोषणा का औपचारिक बल बनाए रखते हैं; पादटिप्पणी-चिह्न [a] मुख्य पाठ में स्पष्ट रूप से दिया गया है।
