source:
  edition: WLC
  text: וּ/שְׂבַעְתֶּ֤ם עַל שֻׁלְחָנִ/י֙ ס֣וּס וָ/רֶ֔כֶב גִּבּ֖וֹר וְ/כָל אִ֣ישׁ מִלְחָמָ֑ה נְאֻ֖ם אֲדֹנָ֥/י יְהוִֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/039/020.yaml
  text: And you will be filled at my table with horse and chariot[a], mighty man and every man of war[b], declares the Lord GOD.
translation:
  language: hi
  text: और तुम मेरी मेज़ पर घोड़ों और रथों, वीरों और हर एक योद्धा से तृप्त हो जाओगे[a]—प्रभु याहवे की यह घोषणा है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: मूल में ‘घोड़ा और रथ’ एकवचन रूप में हैं, पर यहाँ वे संभवतः सामूहिक अर्थ में घोड़ों और रथों को सूचित करते हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: וּשְׂבַעְתֶּם
  choice: तृप्त हो जाओगे
  rationale: שׂבע यहाँ खाने से पेट भरने और तृप्त होने को दर्शाता है; यह अनुवाद भोज के प्रसंग को स्वाभाविक हिन्दी में स्पष्ट रखता है।
- source_word: עַל שֻׁלְחָנִי
  choice: मेरी मेज़ पर
  rationale: हिब्रू उपसर्ग עַל का निकट अर्थ ‘पर’ है; बलिदानी भोज की मेज़ का बिंब इससे बना रहता है।
- source_word: סוּס וָרֶכֶב
  choice: घोड़ों और रथों
  rationale: मूल में दोनों संज्ञाएँ एकवचन रूप में सामूहिक अर्थ रखती हैं। हिन्दी में बहुवचन उनके सामूहिक सैन्य संदर्भ को स्वाभाविक ढंग से व्यक्त करता है; इसे ‘सवार’ मानने का पाठीय आधार नहीं है।
- source_word: גִּבּוֹר
  choice: वीरों
  rationale: גִּבּוֹר शक्तिशाली वीर अथवा पराक्रमी योद्धा को सूचित करता है। ‘वीरों’ से अगली अभिव्यक्ति ‘हर एक योद्धा’ के साथ कुछ शब्दार्थिक भेद भी बना रहता है।
- source_word: וְכָל אִישׁ מִלְחָמָה
  choice: और हर एक योद्धा
  rationale: शाब्दिक अर्थ ‘युद्ध का हर पुरुष’ है; आधुनिक हिन्दी में ‘हर एक योद्धा’ उसी प्राचीन सैन्य संदर्भ को स्पष्ट और गरिमापूर्ण ढंग से व्यक्त करता है।
- source_word: נְאֻם
  choice: की यह घोषणा है
  rationale: यह भविष्यद्वाणी का गंभीर दैवी वचन-सूत्र है; ‘घोषणा’ उसका औपचारिक भाव सुरक्षित रखती है।
- source_word: אֲדֹנָי יְהוִה
  choice: प्रभु यहोवा
  rationale: अֲדֹנָי को ‘प्रभु’ और व्यक्तिगत दैवी नाम יהוה को प्रचलित हिन्दी बाइबलीय रूप ‘यहोवा’ से व्यक्त किया गया है, जिससे दोनों पद अलग बने रहते हैं।
theological_decisions:
- issue: אֲדֹנָי יְהוִה में परमेश्वर के व्यक्तिगत नाम का अनुवाद
  choice: प्रभु यहोवा
  alternative: प्रभु याहवे / प्रभु परमेश्वर
  rationale: मूल पाठ में उपाधि אֲדֹנָי और चतुरक्षरीय नाम יהוה दोनों हैं। ‘प्रभु यहोवा’ हिन्दी पाठकों के लिए परिचित रूप में इस भेद को सुरक्षित रखता है; इसे केवल ‘प्रभु परमेश्वर’ करने से व्यक्तिगत नाम ओझल हो सकता है।
- issue: भोज में सैन्य जनों और साधनों को खाए जाने की कठोर छवि
  choice: स्पष्ट रूप से ‘खाकर तृप्त’ रखना
  alternative: केवल ‘से तृप्त हो जाना’
  rationale: आसपास के प्रसंग में पक्षियों और वन-पशुओं को शवभोज के लिए बुलाया गया है। स्पष्ट क्रिया मूल के आशय को सामने रखती है और भविष्यद्वाणी की जानबूझकर कठोर न्याय-छवि को नरम नहीं करती।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण भविष्यद्वाणी-शैली रखी गई है। पद के संबोधित बहुवचन ‘तुम’ को बनाए रखा गया है। ‘खाकर’ प्रसंग से स्पष्ट की गई पूरक क्रिया है, क्योंकि तृप्ति यहाँ शवभोज से आती है।
