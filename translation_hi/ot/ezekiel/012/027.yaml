base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/012/027.yaml
  text: Son of man, look, the house of Israel is saying, ‘The vision that he sees is for many days from now, and he prophesies about distant times.’
translation:
  language: hi
  text: हे मनुष्य के पुत्र, देख, इस्राएल का घराना कहता है, ‘जो दर्शन वह देखता है, वह बहुत दिनों बाद का है, और वह दूर के समयों के बारे में भविष्यवाणी करता है।’
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֶּן־אָדָם
  choice: हे मनुष्य के पुत्र
  rationale: संबोधन और मूल हिब्रू मुहावरे को बनाए रखते हुए यह यहेजकेल के लिए प्रयुक्त विशिष्ट संबोधन को स्पष्ट करता है।
- source_word: בֵית יִשְׂרָאֵל
  choice: इस्राएल का घराना
  rationale: ‘घराना’ सामूहिक समुदाय/वंश के अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: לְיָמִים רַבִּים
  choice: अब से बहुत दिनों बाद के लिए
  rationale: संदर्भ में वक्ताओं का आशय दर्शन की पूर्ति को बहुत आगे के भविष्य में रखना है; ‘अब से’ इस समयगत दिशा को स्पष्ट करता है।
- source_word: לְעִתִּים רְחוֹקוֹת
  choice: दूर के समयों के विषय में
  rationale: बहुवचन ‘समयों’ और भविष्यवाणी के विषयगत संबंध को सुरक्षित रखता है।
- source_word: נִבָּא
  choice: भविष्यवाणी कर रहा है
  rationale: हिब्रू कृदंत की जारी क्रिया को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: दर्शन की पूर्ति का समय
  choice: वक्ताओं के कथन के रूप में भविष्य को बहुत दूर बताना
  alternative: इसे परमेश्वर द्वारा पुष्टि किए गए वास्तविक विलंब के रूप में प्रस्तुत करना
  rationale: पद केवल ‘इस्राएल के घराने’ की कही बात उद्धृत करता है; अनुवाद उनके दावे को परमेश्वर की स्वीकृति में नहीं बदलता।
translation_notes:
