reference: Ezekiel 12:28
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: לָ/כֵ֞ן אֱמֹ֣ר אֲלֵי/הֶ֗ם כֹּ֤ה אָמַר֙ אֲדֹנָ֣/י יְהוִ֔ה לֹא תִמָּשֵׁ֥ךְ ע֖וֹד כָּל דְּבָרָ֑/י אֲשֶׁ֨ר אֲדַבֵּ֤ר דָּבָר֙ וְ/יֵ֣עָשֶׂ֔ה נְאֻ֖ם אֲדֹנָ֥/י יְהוִֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/012/028.yaml
  text: 'Therefore say to them[a], ‘Thus says the Lord GOD: None of my words will be delayed any longer, but the word that I speak will be done,’ declares the Lord GOD.'
translation:
  language: hi
  text: 'इसलिए उनसे कहो, ‘प्रभु यहोवा यों कहते हैं: मेरी कोई भी बात अब और नहीं टलेगी[a]; जो बात मैं कहूँगा, वह पूरी होगी,’ प्रभु यहोवा की घोषणा है।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक अर्थ: “अब और लंबी नहीं खिंचेगी” या “अब और टाली नहीं जाएगी।”'
    reason: मूल क्रिया משׁך के ‘खींचने/लंबा करने’ वाले रूपक को दिखाना और ‘नहीं टलेगी’ अनुवाद के पीछे की शाब्दिक संभावना सुरक्षित रखना।
lexical_decisions:
- source_word: לָכֵן
  choice: इसलिए
  rationale: यह पिछले कथन से निकलने वाले निष्कर्ष को सहज और स्पष्ट रूप से व्यक्त करता है।
- source_word: אֱמֹר אֲלֵיהֶם
  choice: उनसे कहो
  rationale: आज्ञार्थक क्रिया और उसके बहुवचन संबोधन को सीधे रूप में सुरक्षित रखता है।
- source_word: כֹּה אָמַר
  choice: यों कहते हैं
  rationale: इब्रानी भविष्यद्वाणी-संदेश के प्रचलित सूत्र को स्वाभाविक, गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: אֲדֹנָי יְהוִה
  choice: प्रभु यहोवा
  rationale: אֲדֹנָי को ‘प्रभु’ और परमेश्वर के निज नाम יהוה को हिन्दी में प्रचलित रूप ‘यहोवा’ से अलग-अलग दर्शाता है।
- source_word: לֹא תִמָּשֵׁךְ עוֹד
  choice: अब ... देर न होगी
  rationale: निफ़अल रूप का मूल भाव ‘और आगे खिंचना/लंबा होना’ है; प्रसंग में यह कही हुई बात के पूरा होने में विलम्ब को सूचित करता है।
- source_word: כָּל דְּבָרָי
  choice: मेरी किसी भी बात
  rationale: निषेध के अधीन इब्रानी ‘मेरी सब बातें’ का वितरणात्मक अर्थ हिन्दी में ‘मेरी किसी भी बात ... न’ से स्वाभाविक रूप में आता है।
- source_word: אֲשֶׁר אֲדַבֵּר דָּבָר
  choice: मैं जो बात कहूँगा
  rationale: सजातीय पुनरुक्ति को अस्वाभाविक बनाए बिना भाव सुरक्षित रखता है; अपूर्ण क्रिया का भाव यहाँ आगामी या प्रत्येक उच्चरित वचन पर लागू है।
- source_word: וְיֵעָשֶׂה
  choice: वह पूरी होकर रहेगी
  rationale: कर्मवाच्य भाव में बोले गए वचन के निश्चित रूप से घटित या सिद्ध होने को दृढ़ हिन्दी में व्यक्त करता है।
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: प्रभु यहोवा की यही घोषणा है
  rationale: मानक भविष्यद्वाणी-समापन सूत्र की गंभीरता और अधिकार को स्पष्ट हिन्दी में बनाए रखता है।
theological_decisions:
- issue: संयुक्त उपाधि אֲדֹנָי יְהוִה में परमेश्वर के निज नाम का अनुवाद
  choice: प्रभु यहोवा
  alternative: प्रभु याहवे
  rationale: ‘यहोवा’ आधुनिक हिन्दी बाइबलीय प्रयोग में व्यापक रूप से पहचाना जाता है और इसे केवल ‘परमेश्वर’ से बदलने के बजाय मूल पाठ में उपस्थित निज नाम को दृश्यमान रखता है।
- issue: बोले गए वचन के सिद्ध होने की निश्चितता
  choice: पूरी होकर रहेगी
  alternative: पूरी की जाएगी
  rationale: यह अनुवाद वचन की निश्चित पूर्ति पर बल देता है, पर इस पद से पूर्ति की क्रियाविधि या समय के बारे में अतिरिक्त धर्मवैज्ञानिक निष्कर्ष नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की है। भविष्यद्वाणी-सूत्र के लिए गरिमापूर्ण ‘यों कहते हैं’ और ‘घोषणा’ रखा गया है, जबकि वाक्य-विन्यास सामान्य पाठक के लिए सीधा है। [a] को उसी पदांश पर रखा गया है जिससे उसका शाब्दिक विकल्प संबंधित है।
