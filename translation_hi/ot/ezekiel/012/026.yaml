lexical_decisions:
- source_word: וַיְהִי
  choice: फिर ... आया
  rationale: यहाँ वाव-क्रमिक के साथ היה भविष्यवाणी के अगले प्रसंग का सूत्रबद्ध आरंभ करता है। हिंदी में इसे मुख्य क्रिया के साथ मिलाकर ‘फिर ... आया’ कहना स्वाभाविक है।
- source_word: דְבַר
  choice: वचन
  rationale: דְבַר יְהוָה भविष्यवाणी का स्थापित सूत्र है। ‘वचन’ उसके शाब्दिक और धर्मवैचारिक बल को ‘संदेश’ की अपेक्षा अधिक सुरक्षित रखता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिंदी बाइबलीय प्रयोग में प्रचलित व्यक्तिगत नाम ‘यहोवा’ मूल चतुरक्षरीय ईश-नाम को किसी उपाधि से बदलने के बजाय नाम के रूप में प्रस्तुत करता है।
- source_word: אֵלַי
  choice: मेरे पास
  rationale: इस सूत्र में אֵלַי का स्वाभाविक आधुनिक हिंदी रूप ‘मेरे पास’ है; ‘मुझसे’ अर्थ को बदल देगा।
- source_word: לֵאמֹר
  choice: ':'
  rationale: यह रूप आगे आने वाली प्रत्यक्ष वाणी का परिचय देता है। आधुनिक हिंदी में द्विबिंदु वही कार्य स्वाभाविक ढंग से करता है और अलग से ‘यह कहते हुए’ लिखने की बोझिलता से बचाता है।
theological_decisions:
- issue: ईश-नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ में व्यक्तिगत ईश-नाम सीधे आया है। उसे ‘प्रभु’ जैसी उपाधि से प्रतिस्थापित न करके नाम के रूप में रखा गया है; आधुनिक मानक हिंदी के व्यापक बाइबलीय परिचय को देखते हुए ‘यहोवा’ चुना गया।
translation_notes:
  register: भाषा आधुनिक, संक्षिप्त और गरिमापूर्ण रखी गई है। सूत्रबद्ध भविष्यवाणी-शैली को बनाए रखते हुए लֵאמֹר को हिंदी विराम-चिह्न द्वारा व्यक्त किया गया है।
