  text: כִּ֠י לֹ֣א יִֽהְיֶ֥ה ע֛וֹד כָּל חֲז֥וֹן שָׁ֖וְא וּ/מִקְסַ֣ם חָלָ֑ק בְּ/ת֖וֹךְ בֵּ֥ית יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/012/024.yaml
  text: For there will no longer be any false vision or flattering divination within the house of Israel[a].
translation:
  language: hi
  text: क्योंकि इस्राएल के घराने में फिर न तो कोई झूठा दर्शन होगा, न कोई चिकनी-चुपड़ी शकुन-विद्या[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक अर्थ, “चिकनी शकुन-विद्या।” ‘चिकनी-चुपड़ी’ यहाँ ऐसी खुशामदी या भ्रामक रूप से तसल्ली देनेवाली बातों का संकेत है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले कथन का कारण या स्पष्टीकरण प्रस्तुत करता है; आधुनिक हिन्दी में ‘क्योंकि’ इस संबंध को स्वाभाविक रूप से व्यक्त करता है।
- source_word: לֹא ... עוֹד
  choice: फिर न ... होगा
  rationale: यह आगे से किसी बात के समाप्त हो जाने का भाव देता है; युग्मित निषेध के साथ ‘फिर न तो... न...’ स्वाभाविक हिन्दी है।
- source_word: יִהְיֶה
  choice: होगा
  rationale: यहाँ क्रिया अस्तित्वसूचक है; हिन्दी में ‘होगा’ पर्याप्त और स्वाभाविक है।
- source_word: כָּל
  choice: कोई
  rationale: निषेध के अंतर्गत כָּל का अर्थ ‘कोई भी’ है; हिन्दी में ‘कोई’ पूर्ण निषेध स्पष्ट करता है।
- source_word: חֲזוֹן שָׁוְא
  choice: झूठा दर्शन
  rationale: שָׁוְא में झूठ, खोखलेपन और व्यर्थता का अर्थ-क्षेत्र है; भविष्यद्वाणी के प्रसंग में ‘झूठा दर्शन’ स्पष्ट और सटीक है।
- source_word: מִקְסַם
  choice: भविष्य-कथन
  rationale: यह קסם से जुड़ी निषिद्ध शकुन-विधि या दैवज्ञ घोषणा को दर्शाता है। ‘भविष्य-कथन’ साधारण पाठक के लिए ‘दिव्यज्ञान’ की अपेक्षा अधिक स्पष्ट है।
- source_word: חָלָק
  choice: चिकनी-चुपड़ी
  rationale: शब्द का मूल अर्थ ‘चिकना’ है और यहाँ भ्रामक रूप से मनभावनी या खुशामदी वाणी का संकेत देता है। ‘चिकनी-चुपड़ी’ इस रूपक और उसके नकारात्मक भाव दोनों को बनाए रखता है।
- source_word: בְּתוֹךְ
  choice: के बीच
  rationale: यह किसी समुदाय के भीतर उपस्थित होने का भाव देता है; ‘के बीच’ हिन्दी में स्वाभाविक है।
- source_word: בֵּית יִשְׂרָאֵל
  choice: इस्राएल का घराना
  rationale: यह लोगों के लिए प्रयुक्त सामूहिक भविष्यद्वक्तीय पद है; ‘घराना’ मूल ‘घर’ की छवि को बनाए रखता है।
theological_decisions:
- issue: निन्दित प्रकाशन-संबंधी दावों का स्वरूप
  choice: पद इस्राएल के बीच झूठे दर्शनों और भ्रामक रूप से मनभावने भविष्य-कथनों—दोनों—की निन्दा करता है।
  alternative: दूसरे पदबंध को अधिक शाब्दिक रूप से ‘चिकना भविष्य-कथन’ कहा जा सकता है।
  rationale: חָלָק की ‘चिकनेपन’ वाली छवि को ‘चिकनी-चुपड़ी’ से बनाए रखते हुए उसका खुशामदी और छलपूर्ण व्यावहारिक अर्थ व्यक्त किया गया है; पादटिप्पणी मूल रूपक स्पष्ट करती है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य हिन्दी। ‘इस्राएल का घराना’ भविष्यद्वक्तीय शैली को बनाए रखता है, जबकि ‘चिकनी-चुपड़ी’ मूल इब्रानी रूपक को स्वाभाविक हिन्दी में व्यक्त करता है।
