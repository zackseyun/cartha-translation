source:
  edition: WLC
  text: וְ/יָדְע֖וּ כִּֽי אֲנִ֣י יְהוָ֑ה בַּ/הֲפִיצִ֤/י אוֹתָ/ם֙ בַּ/גּוֹיִ֔ם וְ/זֵרִיתִ֥י אוֹתָ֖/ם בָּ/אֲרָצֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/012/015.yaml
  text: And they will know that I am Yahweh when I scatter them among the nations and disperse them through the lands[a].
translation:
  language: hi
  text: जब मैं उन्हें राष्ट्रों में तितर-बितर करूँगा और देशों में बिखेर दूँगा, तब वे जानेंगे कि मैं याहवे हूँ।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְיָדְעוּ
  choice: तब वे जानेंगे
  rationale: भविष्यसूचक प्रसंग में यह क्रिया भावी परिणाम व्यक्त करती है। वाक्य के अंत में ‘तब’ रखने से बַּהֲפִיצִי के कालवाचक संबंध और पहचान-सूत्र दोनों स्वाभाविक हिन्दी में स्पष्ट रहते हैं।
- source_word: כִּי אֲנִי יְהוָה
  choice: कि मैं यहोवा हूँ
  rationale: כִּי यहाँ ज्ञात होने वाली बात का परिचय देता है। परमेश्वर के विशिष्ट नाम יהוה को हिन्दी में प्रचलित लिप्यंतरण ‘यहोवा’ से व्यक्त किया गया है।
- source_word: בַּהֲפִיצִי אוֹתָם
  choice: जब मैं उन्हें ... तितर-बितर कर दूँगा
  rationale: בְּ के साथ हिफ़ील infinitive construct और प्रथम पुरुष प्रत्यय यहाँ कालवाचक है—‘जब मैं’। हिफ़ील रूप किसी को बिखेर देने का कारक भाव रखता है।
- source_word: בַּגּוֹיִם
  choice: जाति-जाति के लोगों में
  rationale: גּוֹיִם से यहाँ वे विदेशी जातियाँ अभिप्रेत हैं जिनके बीच लोग निर्वासित होंगे। यह हिन्दी प्रयोग केवल आधुनिक राष्ट्र-राज्यों का अर्थ देने से बचता है।
- source_word: וְזֵרִיתִי אוֹתָם
  choice: और ... फैला दूँगा
  rationale: זרה का अर्थ बिखेरना या छितराना है और इसमें कभी-कभी ओसाने की छवि भी होती है। पहले प्रयुक्त क्रिया से भेद रखते हुए ‘फैला दूँगा’ समानांतर अर्थ को सहज बनाता है।
- source_word: בָּאֲרָצוֹת
  choice: अलग-अलग देशों में
  rationale: बहुवचन אֲרָצוֹת विभिन्न देशों या भूभागों को सूचित करता है। ‘अलग-अलग देशों में’ व्यापक भौगोलिक बिखराव को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: परमेश्वर के नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे / प्रभु
  rationale: मूल पाठ में चार अक्षरों वाला विशिष्ट ईश्वरीय नाम सीधे आया है। उसे सामान्य उपाधि ‘प्रभु’ से बदलने के बजाय नाम के रूप में रखा गया है; ‘यहोवा’ हिन्दी बाइबलीय भाषा में व्यापक रूप से पहचाना जाने वाला रूप है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। हिब्रू की दो समानार्थी बिखराव-क्रियाओं को ‘तितर-बितर’ और ‘फैला’ से अलग पहचाना गया है, और पहचान-सूत्र को हिन्दी की स्वाभाविक कालवाचक रचना में वाक्य के अंत में रखा गया है।
