base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/012/014.yaml
  text: And all who are around him—his helpers and all his troops—I will scatter to every wind[b][a], and I will draw out a sword after them.
translation:
  language: hi
  text: और उसके चारों ओर के सभी लोगों को—उसके सहायकों और उसकी सारी टुकड़ियों को—मैं हर दिशा में तितर-बितर कर दूँगा[a], और मैं उनके पीछे तलवार खींचूँगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक अर्थ: “हर हवा की ओर,” अर्थात् हर दिशा में।'
    reason: lexical_alternative
lexical_decisions:
- source_word: סְבִיבֹתָיו
  choice: जितने उसके चारों ओर हैं
  rationale: यह पदबंध उस पुरुष के आसपास उपस्थित लोगों को दर्शाता है; सम्बन्धवाचक वाक्यांश हिन्दी में स्वाभाविक रहते हुए मूल का सम्बन्धपरक अर्थ बनाए रखता है।
- source_word: עֶזְרָה
  choice: उसके सहायक
  rationale: सन्दर्भ में यह सामूहिक रूप से उसकी सहायता करने वाले व्यक्तियों की ओर संकेत करता है; अमूर्त ‘सहायता’ की अपेक्षा ‘सहायक’ आशय को अधिक स्पष्ट करता है।
- source_word: אֲגַפָּיו
  choice: उसकी सारी टुकड़ियाँ
  rationale: शब्द का मूल बिम्ब ‘पंख/किनारे’ से जुड़ा है, पर इस सैनिक-राजनीतिक सन्दर्भ में इससे संगठित दल या सैन्य टुकड़ियाँ अभिप्रेत हैं।
- source_word: אֱזָרֶה
  choice: तितर-बितर कर दूँगा
  rationale: זרה के पिएल रूप का अर्थ यहाँ लोगों को बिखेरना है; यह हिन्दी अभिव्यक्ति व्यापक और बलपूर्वक बिखराव को स्वाभाविक ढंग से बताती है।
- source_word: לְכָל רוּחַ
  choice: हर दिशा में
  rationale: शाब्दिक रूप ‘हर हवा की ओर’ है, जो सभी दिशाओं में बिखेरने का इब्रानी मुहावरा है। मुख्य पाठ में अर्थ स्पष्ट किया गया है और मूल बिम्ब पादटिप्पणी में रखा गया है।
- source_word: חֶרֶב אָרִיק אַחֲרֵיהֶם
  choice: उनके पीछे तलवार खींचूँगा
  rationale: ריק का हिफ़ील रूप ‘तलवार’ के साथ तलवार खींचने का मुहावरा है; ‘उनके पीछे’ אַחֲרֵיהֶם में निहित पीछा करने के भाव को सुरक्षित रखता है।
