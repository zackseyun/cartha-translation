  text: בֶּן אָדָ֕ם הֲ/לֹ֨א אָמְר֥וּ אֵלֶ֛י/ךָ בֵּ֥ית יִשְׂרָאֵ֖ל בֵּ֣ית הַ/מֶּ֑רִי מָ֖ה אַתָּ֥ה עֹשֶֽׂה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/012/009.yaml
  text: Son of man[a], has not the house of Israel, that rebellious house, said to you, ‘What are you doing?’
translation:
  language: hi
  text: हे मनुष्य के पुत्र, क्या इस्राएल के घराने ने, अर्थात् उस विद्रोही घराने ने, तुमसे नहीं कहा, “तुम क्या कर रहे हो?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֶּן אָדָם
  choice: हे मनुष्य के पुत्र
  rationale: यहेजकेल को परमेश्वर के विशिष्ट और बार-बार प्रयुक्त संबोधन का रूपक तथा पूरी पुस्तक में उसकी साहित्यिक निरंतरता बनाए रखता है। ‘हे’ हिन्दी में प्रत्यक्ष संबोधन को स्वाभाविक और स्पष्ट बनाता है।
- source_word: הֲלֹא
  choice: क्या ... नहीं
  rationale: यह ऐसी आलंकारिक प्रश्न-रचना है जिसमें सकारात्मक उत्तर अपेक्षित है; आधुनिक हिन्दी में ‘क्या ... नहीं’ उसी बल को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: אָמְרוּ אֵלֶיךָ
  choice: तुमसे नहीं कहा
  rationale: मूल क्रिया सामान्य अर्थ में ‘कहना’ है और אֵלֶיךָ संबोधित व्यक्ति को दर्शाता है। उद्धृत कथन प्रश्न होने पर भी ‘कहा’ मूल की संरचना सुरक्षित रखता है।
- source_word: בֵּית יִשְׂרָאֵל
  choice: इस्राएल के घराने
  rationale: भविष्यद्वाणी में प्रयुक्त सामूहिक और वाचागत अभिव्यक्ति ‘इस्राएल का घराना’ को बनाए रखता है; यहाँ कारक के अनुसार ‘घराने ने’ है।
- source_word: בֵּית הַמֶּרִי
  choice: उस विद्रोही घराने ने
  rationale: यह ‘इस्राएल के घराने’ का समानाधिकरण है और उसी समुदाय को विद्रोही ठहराता है। ‘विद्रोही’ מֶרִי का प्रसंगानुकूल स्वाभाविक विशेषणात्मक रूप है।
- source_word: מָה אַתָּה עֹשֶׂה
  choice: तुम क्या कर रहे हो?
  rationale: सर्वनाम के साथ कृदंत चल रही क्रिया को सूचित करता है; हिन्दी का वर्तमान अपूर्ण रूप इसे स्वाभाविक रूप से व्यक्त करता है।
theological_decisions:
- issue: ‘इस्राएल का घराना’ और ‘विद्रोही घराना’ का संबंध
  choice: दूसरे पदबंध को पहले का समानाधिकरण मानकर डैशों के बीच रखा गया है।
  alternative: इसे अलग संबोधन या अलग समूह के रूप में पढ़ना।
  rationale: इब्रानी पदक्रम में בֵּית הַמֶּרִי, בֵּית יִשְׂרָאֵל की व्याख्यात्मक समानाधिकरण संज्ञा है; अनुवाद दोनों को एक ही समुदाय बताता है, बिना दोषारोपण की तीक्ष्णता घटाए।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सीधे संबोधन वाली रखी गई है। ‘मनुष्य के पुत्र’ और ‘इस्राएल के घराने’ जैसे पुस्तक-व्यापी भविष्यद्वाणी संबंधी पदबंध सुरक्षित हैं; डैश समानाधिकरण को सामान्य पाठक के लिए स्पष्ट करते हैं।
