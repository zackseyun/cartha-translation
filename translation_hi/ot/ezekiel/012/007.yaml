base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/012/007.yaml
  text: 'So I did as I was commanded: by day I brought out my baggage like the baggage of exile[a], and in the evening I dug through the wall by hand. In the dark I brought it out[b]; I carried it on my shoulder before their eyes.'
translation:
  language: hi
  text: तब मैंने वैसा ही किया जैसा मुझे आज्ञा दी गई थी। दिन में मैंने अपना सामान, जैसे निर्वासन के लिए जाने वाले का सामान हो, बाहर निकाला[a], और शाम को मैंने दीवार में अपने हाथ से सेंध लगाई। अँधेरे में मैंने उसे बाहर निकाला[b] और उनकी आँखों के सामने उसे अपने कंधे पर उठाकर ले गया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “किसी निर्वासित व्यक्ति के सामान जैसा।” इब्रानी वाक्यांश निर्वासन पर जाते समय तैयार की गई वस्तुओं को सूचित करता है।
    reason: lexical_alternative
  - marker: b
    text: या, “धुँधलके में” अथवा “घोर अँधेरे में।” इब्रानी शब्द अँधकार बताता है और कम रोशनी के साथ छिपकर किए जाने का भाव भी दे सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאַעַשׂ כֵּן כַּאֲשֶׁר צֻוֵּיתִי
  choice: तब मैंने वैसा ही किया जैसा मुझे आज्ञा दी गई थी
  rationale: यह कथात्मक क्रम, כֵּן के प्रत्युत्तरात्मक भाव और इब्रानी कर्मवाच्य—तीनों को स्वाभाविक आधुनिक हिन्दी में रखता है।
- source_word: כֵּלַי ... כִּכְלֵי גוֹלָה
  choice: निर्वासन के सामान जैसा अपना सामान
  rationale: כְּלִי यहाँ पोर्टेबल वस्तुओं या गठरी-सामान का सामूहिक अर्थ देता है; גוֹלָה निर्वासन अथवा निर्वासित व्यक्ति की स्थिति सूचित कर सकता है। मुख्य पाठ इब्रानी की संक्षिप्त छवि बचाता है और पादटिप्पणी दूसरा सम्भव अर्थ देती है।
- source_word: יוֹמָם וּבָעֶרֶב
  choice: दिन में ... और शाम को
  rationale: दोनों काल-सूचकों का क्रम और विरोध स्वाभाविक हिन्दी में सुरक्षित है।
- source_word: חָתַרְתִּי לִי בַקִּיר בְּיָד
  choice: मैंने अपने हाथों से दीवार में छेद किया
  rationale: חָתַר का आशय दीवार खोदकर या तोड़कर रास्ता बनाना है। हिन्दी में 'छेद किया' परिणाम को स्पष्ट करता है; לִי को अलग से अनावश्यक आत्मवाचक पद बनाकर बोझिल नहीं किया गया, जबकि בְּיָד का बल 'अपने हाथों से' में बना है।
- source_word: בָּעֲלָטָה
  choice: अँधेरे में
  rationale: यह עֲלָטָה के अँधकार/धुँधलके के मूल अर्थ का स्पष्ट और सहज अनुवाद है; समय या छिपाव का अधिक विशिष्ट अर्थ पादटिप्पणी में रखा गया है।
- source_word: הוֹצֵאתִי עַל כָּתֵף נָשָׂאתִי
  choice: मैंने उसे बाहर निकाला और ... उसे अपने कंधे पर उठाकर ले गया
  rationale: हिन्दी में 'उसे' सामूहिक 'सामान' को दर्शाता है। दो अलग इब्रानी क्रियाओं—बाहर निकालना और कंधे पर ढोना—को अलग रखा गया है।
- source_word: לְעֵינֵיהֶם
  choice: उनकी आँखों के सामने
  rationale: इब्रानी मुहावरे का पारदर्शी अनुवाद है और भविष्यद्वक्ता के सार्वजनिक प्रतीकात्मक कार्य पर बल बनाए रखता है।
theological_decisions:
- issue: यहेजकेल के प्रतीकात्मक कार्य का स्वरूप
  choice: इस पद में कार्यों को ठोस और सार्वजनिक घटनाओं के रूप में प्रस्तुत करना
  alternative: अनुवाद में ही इन कार्यों को निर्वासन की भविष्यवाणी के रूप में विस्तार से समझा देना
  rationale: आसपास का प्रसंग इस प्रतीकात्मक कार्य का अर्थ बताता है। इस पद में 'बाहर निकाला,' 'छेद किया' और 'कंधे पर ... ले गया' जैसी ठोस क्रियाओं को बिना अतिरिक्त धार्मिक व्याख्या के रहने देना मूल पाठ की पद्धति और तनाव को सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज रखी गई है। 'निर्वासन' प्रसंग का औपचारिक शब्द है, जबकि 'सामान,' 'छेद किया' और 'कंधे पर उठाकर ले गया' दृश्य को ठोस और समझने योग्य रखते हैं। सभी पादटिप्पणी चिह्न मुख्य पाठ में उपस्थित हैं।
