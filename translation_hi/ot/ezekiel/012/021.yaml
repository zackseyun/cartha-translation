- source_word: וַיְהִי
  choice: फिर ... पहुँचा
  rationale: यह रूप कथानक में अगले प्रसंग का परिचय देता है। हिंदी में ‘फिर’ क्रम को स्वाभाविक ढंग से व्यक्त करता है, और क्रिया को पूरे वाक्यांश ‘वचन ... पहुँचा’ में समाहित किया गया है।
- source_word: דְבַר
  choice: वचन
  rationale: भविष्यवाणी के इस प्रचलित सूत्र में דָּבָר परमेश्वर से प्राप्त कथन या संदेश को दर्शाता है। ‘वचन’ इसके ठोस कथनात्मक अर्थ और परिचित बाइबिलीय सूत्र दोनों को बनाए रखता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिंदी में परमेश्वर के व्यक्तिगत नाम के प्रचलित लिप्यंतरण ‘यहोवा’ का प्रयोग किया गया है; इसे किसी उपाधि से नहीं बदला गया।
- source_word: אֵלַי
  choice: मेरे पास
  rationale: इस आगमन-सूत्र में ‘मेरे पास पहुँचा’ स्वाभाविक आधुनिक हिंदी है और אֵלַי का आशय स्पष्ट रूप से व्यक्त करता है।
- source_word: לֵאמֹר
  choice: ':'
  rationale: यह infinitive अगले पद में आने वाले प्रत्यक्ष कथन का परिचय देता है। हिंदी में वाक्य के अंत का द्विबिंदु उसी कार्य को अधिक स्वाभाविक ढंग से निभाता है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ में व्यक्तिगत ईश्वरीय नाम है, इसलिए उसे ‘प्रभु’ जैसी उपाधि से प्रतिस्थापित नहीं किया गया। ‘यहोवा’ आधुनिक हिंदी बाइबिलीय प्रयोग में व्यापक रूप से पहचाना जाने वाला रूप है।
translation_notes:
  register: भाषा आधुनिक, संक्षिप्त और गरिमापूर्ण रखी गई है। भविष्यवाणी-सूत्र की परिचित शैली के लिए ‘वचन’ रखा गया है, जबकि לֵאמֹר को अस्वाभाविक ‘यह कहते हुए’ के बजाय द्विबिंदु से व्यक्त किया गया है।
