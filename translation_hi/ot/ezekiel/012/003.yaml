reference: Ezekiel 12:3
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/אַתָּ֣ה בֶן אָדָ֗ם עֲשֵׂ֤ה לְ/ךָ֙ כְּלֵ֣י גוֹלָ֔ה וּ/גְלֵ֥ה יוֹמָ֖ם לְ/עֵֽינֵי/הֶ֑ם וְ/גָלִ֨יתָ מִ/מְּקוֹמְ/ךָ֜ אֶל מָק֤וֹם אַחֵר֙ לְ/עֵ֣ינֵי/הֶ֔ם אוּלַ֣י יִרְא֔וּ כִּ֛י בֵּ֥ית מְרִ֖י הֵֽמָּה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/012/003.yaml
  text: And you, son of man, prepare for yourself baggage for exile, and go into exile by day before their eyes. You shall go into exile from your place to another place before their eyes. Perhaps they will see, though they are a rebellious house.
translation:
  language: hi
  text: और हे मनुष्य के पुत्र, अपने लिए निर्वासन के लिए सामान तैयार कर, और दिन के समय उनकी आँखों के सामने निर्वासन में जा। उनकी आँखों के सामने अपने स्थान से दूसरे स्थान पर चले जा। शायद वे देखें, यद्यपि वे विद्रोही घराने के लोग हैं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כְּלֵי גוֹלָה
  choice: निर्वासन का सामान
  rationale: यह पदबंध निर्वासन में ले जाए जाने वाले व्यक्ति के आवश्यक सामान को दर्शाता है; ‘सामान’ स्वाभाविक हिन्दी है और प्रतीकात्मक क्रिया का आशय बनाए रखता है।
- source_word: וּגְלֵה / וְגָלִיתָ
  choice: निर्वासन में जा / ... जा
  rationale: एक ही हिब्रू धातु के दो रूपों को यथासंभव समान भाषा में रखा गया है; प्रसंग में यह निर्वासन का अभिनय करने का आदेश है।
- source_word: יוֹמָם
  choice: दिन के समय
  rationale: मूल के काल-सूचक अर्थ को सीधे और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: לְעֵינֵיהֶם
  choice: उनकी आँखों के सामने
  rationale: मूल की दृश्य और सार्वजनिक प्रकृति को बनाए रखने वाला निकट औपचारिक अनुवाद।
- source_word: יִרְאוּ
  choice: समझें
  rationale: मूल अर्थ ‘देखें’ है, पर यहाँ देखने से पहचानने या समझने का भाव संभावित है; हिन्दी में ‘समझें’ प्रसंगगत आशय को स्वाभाविक रूप से व्यक्त करता है।
- source_word: בֵּית מְרִי
  choice: विद्रोही घराने के लोग
  rationale: शाब्दिक ‘विद्रोह का घराना’ हिन्दी में अस्वाभाविक है; यह चयन सामूहिक पहचान और विद्रोही चरित्र दोनों रखता है।
theological_decisions:
- issue: אוּלַי יִרְאוּ כִּי में संबंधसूचक כִּי का अर्थ
  choice: शायद वे समझें, यद्यपि वे विद्रोही घराने के लोग हैं
  alternative: शायद वे देखें, क्योंकि वे विद्रोही घराना हैं
  rationale: כִּי सामान्यतः ‘क्योंकि’ हो सकता है, किंतु यहाँ विद्रोही होने के बावजूद संभव प्रतिक्रिया की तनावपूर्ण संभावना प्रसंग में अधिक संगत है। ‘यद्यपि’ इसी तनाव को सुरक्षित रखता है और निश्चित पश्चात्ताप नहीं बताता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सरल शैली। नबी को संबोधन में ‘हे मनुष्य के पुत्र’ रखा गया है; आज्ञार्थक एकवचन रूप मूल के प्रत्यक्ष दिव्य संबोधन को बनाए रखते हैं।
