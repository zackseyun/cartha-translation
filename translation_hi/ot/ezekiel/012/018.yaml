  yaml_path: translation/ot/ezekiel/012/018.yaml
  text: Son of man[a], eat your bread with trembling[b], and drink your water with quaking and anxiety.
translation:
  language: hi
  text: हे मनुष्य के पुत्र, अपनी रोटी काँपते हुए खा, और अपना पानी थरथराहट और चिंता के साथ पी।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֶּן אָדָם
  choice: हे मनुष्य के पुत्र
  rationale: यहेजकेल के लिए प्रयुक्त इस बार-बार आने वाले ईश्वरीय संबोधन का शाब्दिक रूप बनाए रखा गया है; सम्बोधन सूचित करने के लिए हिन्दी में ‘हे’ स्वाभाविक है।
- source_word: לַחְמְךָ
  choice: अपनी रोटी
  rationale: לֶחֶם का ठोस अर्थ ‘रोटी’ है और यहाँ भविष्यद्वक्ता के प्रतीकात्मक कार्य की दृश्यता बनाए रखता है।
- source_word: בְּרַעַשׁ
  choice: काँपते हुए
  rationale: רַעַשׁ शारीरिक हिलने या काँपने को व्यक्त करता है; यह हिन्दी में भययुक्त ढंग से खाने का स्वाभाविक वर्णन है।
- source_word: וּמֵימֶיךָ
  choice: और अपना पानी
  rationale: इब्रानी बहुवचन रूप का आशय यहाँ पीने का पानी है; हिन्दी में एकवचन ‘पानी’ स्वाभाविक है।
- source_word: בְּרָגְזָה
  choice: थरथराते हुए
  rationale: רָגְזָה व्याकुल कंपन या थरथराहट बताता है। ‘थरथराते’ पहले पद के ‘काँपते’ से अर्थगत निकटता रखते हुए शब्दगत भेद भी बचाता है।
- source_word: וּבִדְאָגָה
  choice: और चिंतित होते हुए
  rationale: דְאָגָה चिंता, व्याकुलता या आशंका को दर्शाता है; यह बाहरी थरथराहट के साथ भीतरी बेचैनी को व्यक्त करता है।
- source_word: תֹּאכֵל … תִּשְׁתֶּה
  choice: खा … पी
  rationale: संदर्भ में दोनों अपूर्ण क्रियाओं का आदेशात्मक बल है, जिसे हिन्दी के सीधे आज्ञार्थक रूप स्वाभाविक ढंग से व्यक्त करते हैं।
theological_decisions: []
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, प्रत्यक्ष और सहज रूप अपनाया गया है। ‘काँपते’ और ‘थरथराते’ से दोनों निकटार्थक इब्रानी संज्ञाओं का आंशिक भेद सुरक्षित रखा गया है, जबकि ‘चिंतित’ भीतरी व्याकुलता व्यक्त करता है।
