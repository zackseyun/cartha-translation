source:
  edition: WLC
  text: אֱמֹ֖ר אֲנִ֣י מֽוֹפֶתְ/כֶ֑ם כַּ/אֲשֶׁ֣ר עָשִׂ֗יתִי כֵּ֚ן יֵעָשֶׂ֣ה לָ/הֶ֔ם בַּ/גּוֹלָ֥ה בַ/שְּׁבִ֖י יֵלֵֽכוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/012/011.yaml
  text: 'Say[a], ‘I am a sign to you: just as I have done, so it shall be done to them; into exile[b], into captivity they shall go.’'
translation:
  language: hi
  text: कहो[a], ‘मैं तुम्हारे लिए एक चिन्ह हूँ। जैसा मैंने किया है, वैसा ही उनके साथ किया जाएगा; वे निर्वासन में, बंदी होकर[b] चले जाएँगे।’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘बोलो।’ इब्रानी आज्ञा एक व्यक्ति को संबोधित है।
    reason: lexical_alternative
  - marker: b
    text: मूल इब्रानी में ‘निर्वासन’ और ‘बंदी अवस्था’ के दो निकटार्थक पद साथ रखे गए हैं; यहाँ दोनों को बनाए रखा गया है ताकि उसका बलाघात प्रकट हो।
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱמֹר
  choice: कहो
  rationale: यह אמר का एकवचन आज्ञार्थक रूप है, जो भविष्यद्वक्ता की उद्धृत घोषणा का परिचय देता है; आधुनिक हिन्दी में ‘कहो’ स्वाभाविक और सीधा है।
- source_word: מוֹפֶתְכֶם
  choice: तुम्हारे लिए एक चिन्ह
  rationale: מוֹפֵת चिन्ह, शकुन अथवा प्रतीकात्मक अद्भुत कार्य का अर्थ दे सकता है। यहाँ यहेजकेल का किया हुआ कार्य श्रोताओं के लिए भविष्यसूचक प्रतीक है; ‘तुम्हारे लिए एक चिन्ह’ उस भूमिका को स्पष्ट रखते हुए अंधविश्वास से जुड़ी ध्वनि से बचता है।
- source_word: כַּאֲשֶׁר עָשִׂיתִי
  choice: जैसा मैंने किया है
  rationale: तुलनात्मक वाक्यांश यहेजकेल के पूरे किए हुए प्रतीकात्मक कार्य को आने वाली घटना से जोड़ता है। हिन्दी का पूर्ण पक्ष उसके वर्तमान भविष्यसूचक महत्त्व को बनाए रखता है।
- source_word: כֵּן יֵעָשֶׂה לָהֶם
  choice: वैसा ही उनके साथ किया जाएगा
  rationale: עשה का निफ़अल अपूर्ण रूप यहाँ कर्मवाच्य है। कर्मवाच्य अनकहे कर्ता को स्पष्ट किए बिना ध्यान इस बात पर रखता है कि उनके साथ क्या होगा।
- source_word: בַּגּוֹלָה
  choice: निर्वासन में
  rationale: גּוֹלָה निर्वासन अथवा निर्वासित दशा को सूचित करता है। יֵלֵכוּ के साथ ‘निर्वासन में … चले जाएँगे’ हिन्दी में दिशा और परिणति दोनों व्यक्त करता है।
- source_word: בַשְּׁבִי
  choice: बंदी होकर
  rationale: שְׁבִי बंदी अवस्था या बंधुआई को सूचित करता है। ‘बंदी होकर’ इसे גּוֹלָה से अलग रखते हुए हिन्दी में स्वाभाविक ढंग से इब्रानी की बलाघाती युगलबंदी को सुरक्षित रखता है।
- source_word: יֵלֵכוּ
  choice: चले जाएँगे
  rationale: הלך का अपूर्ण रूप भावी परिणाम बताता है। ‘चले जाएँगे’ आधुनिक हिन्दी में स्वाभाविक भविष्यकाल है और निर्वासन की ओर ले जाए जाने की परिणति व्यक्त करता है।
theological_decisions:
- issue: यहेजकेल की प्रतीकात्मक भूमिका का स्वरूप
  choice: मैं तुम्हारे लिए एक चिन्ह हूँ
  alternative: मैं तुम्हारा शकुन हूँ / मैं तुम्हारे लिए एक अद्भुत संकेत हूँ
  rationale: वचन यहेजकेल और उसके कार्य को भविष्यसूचक प्रतीक के रूप में प्रस्तुत करता है, केवल मौखिक भविष्यवाणी के रूप में नहीं। ‘चिन्ह’ מוֹפֵת की प्रकाशनात्मक और प्रतीकात्मक शक्ति को रखता है, पर ‘शकुन’ से जुड़ी संभावित अंधविश्वासी ध्वनि नहीं लाता।
- issue: निर्वासन और बंदी अवस्था की दोहरी अभिव्यक्ति
  choice: वे निर्वासन में, बंदी होकर चले जाएँगे
  alternative: वे बंदी बनाकर निर्वासन में ले जाए जाएँगे
  rationale: मूल पाठ בַּגּוֹלָה और בַשְּׁבִי दोनों को साथ रखकर न्याय पर बल देता है। चुना हुआ रूप दोनों विचारों को अलग-अलग बनाए रखता है और किसी व्यक्त कर्ता को जोड़ता नहीं है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण भविष्यसूचक गद्य। ‘तुम्हारे’ और ‘उनके’ से मूल पाठ का संबोधन-भेद रखा गया है। कर्मवाच्य में अनकहे कर्ता को अनावश्यक रूप से स्पष्ट नहीं किया गया।
