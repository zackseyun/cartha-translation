- source_word: דְבַר
  choice: वचन
  rationale: नबी-संबंधी स्थायी सूत्र דְבַר יְהוָה में ‘वचन’ किसी विशेष ईश्वरीय संदेश को दर्शाता है और हिंदी बाइबलीय भाषा में परिचित, गरिमापूर्ण शब्द है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: यह इब्रानी चतुरक्षरीय परमेश्वर-नाम का हिंदी में प्रचलित लिप्यंतरण है; इसे किसी उपाधि से बदलने के बजाय व्यक्तिगत नाम के रूप में रखा गया है।
- source_word: אֵלַי
  choice: मेरे पास
  rationale: यह प्रथम पुरुष एकवचन वक्ता, अर्थात यहेजकेल, की ओर वचन के आने को स्वाभाविक आधुनिक हिंदी में व्यक्त करता है।
- source_word: לֵאמֹר
  choice: ':'
  rationale: यह infinitive construct अगले पद में आने वाले प्रत्यक्ष कथन का परिचय देता है। हिंदी में यहाँ विसर्ग-चिह्न उसी कार्य को संक्षिप्त और स्वाभाविक रूप से निभाता है; ‘यह कहते हुए’ अपेक्षाकृत कृत्रिम लगेगा।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ व्यक्तिगत ईश्वरीय नाम का प्रयोग करता है। हिंदी पाठ में परिचित ‘यहोवा’ रखा गया है, जबकि पादटिप्पणी में मूल YHWH और वैकल्पिक ‘याहवे’ स्पष्ट किया गया है; इस प्रकार नाम को ‘प्रभु’ जैसी उपाधि से प्रतिस्थापित नहीं किया गया।
translation_notes:
