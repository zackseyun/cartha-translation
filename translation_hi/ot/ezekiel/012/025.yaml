id: EZK.12.25
reference: Ezekiel 12:25
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: כִּ֣י אֲנִ֣י יְהוָ֗ה אֲדַבֵּר֙ אֵת֩ אֲשֶׁ֨ר אֲדַבֵּ֤ר דָּבָר֙ וְ/יֵ֣עָשֶׂ֔ה לֹ֥א תִמָּשֵׁ֖ךְ ע֑וֹד כִּ֣י בִֽ/ימֵי/כֶ֞ם בֵּ֣ית הַ/מֶּ֗רִי אֲדַבֵּ֤ר דָּבָר֙ וַ/עֲשִׂיתִ֔י/ו נְאֻ֖ם אֲדֹנָ֥/י יְהוִֽה׀׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/012/025.yaml
  text: For I am Yahweh[a]; the word that I speak will be done. It will no longer be delayed, for in your days, O rebellious house, I will speak a word and do it[b], declares the Lord GOD.
translation:
  language: hi
  text: क्योंकि मैं यहोवा हूँ; मैं जो वचन कहूँगा, वह पूरा होगा। अब उसमें और देर नहीं होगी। क्योंकि हे विद्रोही घराने, तुम्हारे ही दिनों में मैं वचन कहूँगा और उसे पूरा करूँगा—प्रभु यहोवा की घोषणा है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: यहोवा
  rationale: परमेश्वर के व्यक्तिगत नाम को हिन्दी में प्रचलित लिप्यंतरण ‘यहोवा’ से व्यक्त किया गया है, किसी उपाधि से प्रतिस्थापित नहीं किया गया।
- source_word: אֲדַבֵּר אֵת אֲשֶׁר אֲדַבֵּר דָּבָר
  choice: मैं जो वचन कहूँगा
  rationale: इब्रानी की बलाघाती पुनरुक्ति का आशय स्वाभाविक हिन्दी में रखा गया है; ‘वचन’ आगे उसके पूरा होने से संबंध बनाए रखता है।
- source_word: וְיֵעָשֶׂה
  choice: वह पूरा होगा
  rationale: निफ़अल का निष्पादित होने का भाव सुरक्षित है। हिन्दी में ‘पूरा होगा’ भविष्यवाणी के वचन के प्रभावी सिद्ध होने को स्वाभाविक रूप से व्यक्त करता है।
- source_word: לֹא תִמָּשֵׁךְ עוֹד
  choice: अब उसमें और देर नहीं होगी
  rationale: मूल में किसी बात के और लंबा खिंचने या टलने का भाव है। सर्वनाम का संदर्भ वचन अथवा उसकी पूर्ति, दोनों से समझा जा सकता है।
- source_word: בֵּית הַמֶּרִי
  choice: हे विद्रोही घराने
  rationale: प्रत्यक्ष संबोधन तथा इस्राएल के सामूहिक और वाचा-संबंधी ‘घराने’ के रूपक को बनाए रखा गया है।
- source_word: וַעֲשִׂיתִיו
  choice: उसे पूरा करूँगा
  rationale: वाव-युक्त पूर्ण रूप यहाँ भविष्य की निश्चितता व्यक्त करता है। ‘पूरा करूँगा’ पहले आए ‘पूरा होगा’ के साथ अर्थगत समानांतरता रखता है।
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: प्रभु यहोवा की घोषणा है
  rationale: प्रामाणिक भविष्यद्वाणी-सूत्र को संज्ञात्मक हिन्दी अभिव्यक्ति में रखा गया है और אֲדֹנָי तथा יהוה दोनों की विशिष्टता सुरक्षित है।
theological_decisions:
- issue: ईश्वरीय नाम और उपाधि का अनुवाद
  choice: आरंभ में ‘यहोवा’ और अंत में ‘प्रभु यहोवा’
  alternative: ‘यहोवा ... प्रभु परमेश्वर’ अथवा ‘प्रभु ... प्रभु यहोवा’
  rationale: पहले יהוה व्यक्तिगत नाम है, जबकि समापन में אֲדֹנָי יהוה संयुक्त पद है। दोनों को अलग ढंग से दिखाना मूल की भिन्नता बनाए रखता है और किसी संप्रदायगत व्याख्या को नहीं जोड़ता।
- issue: ईश्वरीय वचन और उसकी पूर्ति का संबंध
  choice: ‘वचन कहूँगा’ और ‘उसे पूरा करूँगा’
  alternative: ‘बात कहूँगा और उसे करूँगा’
  rationale: ‘वचन’ भविष्यद्वाणी की घोषणा को स्पष्ट करता है, जबकि ‘पूरा करना’ इस बात को सुरक्षित रखता है कि परमेश्वर का कथन केवल सूचना नहीं बल्कि निश्चित रूप से सिद्ध होने वाला कथन है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सुबोध भविष्यद्वाणीपरक रजिस्टर अपनाया गया है। ‘हे विद्रोही घराने’ में मूल का प्रत्यक्ष संबोधन और सामूहिक रूपक रखा गया है। कोई पाद-टिप्पणी आवश्यक नहीं समझी गई।
