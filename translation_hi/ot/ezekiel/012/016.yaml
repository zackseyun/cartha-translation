id: EZK.12.16
reference: Ezekiel 12:16
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/הוֹתַרְתִּ֤י מֵ/הֶם֙ אַנְשֵׁ֣י מִסְפָּ֔ר מֵ/חֶ֖רֶב מֵ/רָעָ֣ב וּ/מִ/דָּ֑בֶר לְמַ֨עַן יְסַפְּר֜וּ אֶת כָּל תּוֹעֲבֽוֹתֵי/הֶ֗ם בַּ/גּוֹיִם֙ אֲשֶׁר בָּ֣אוּ שָׁ֔ם וְ/יָדְע֖וּ כִּֽי אֲנִ֥י יְהוָֽה־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/012/016.yaml
  text: But I will spare from among them a few men from the sword[a], from famine, and from pestilence, so that they may recount all their abominations among the nations where they go; and they will know that I am Yahweh.
translation:
  language: hi
  text: परन्तु मैं उनमें से गिने-चुने पुरुषों को तलवार, अकाल और महामारी से बचा रखूँगा, ताकि वे उन जातियों के बीच, जहाँ वे पहुँचेंगे,[a] अपने सब घिनौने कामों का वर्णन करें; तब वे जानेंगे कि मैं यहोवा हूँ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जहाँ वे पहुँच चुके हैं।” इब्रानी क्रिया रूपतः पूर्णकाल में है, किन्तु इस भावी निर्वासन के प्रसंग में इसे गन्तव्य की ओर भावी अर्थ में भी समझा जा सकता है।
    reason: मूल क्रिया के रूपगत पूर्णकाल और प्रसंगगत भावी अभिमुखता—दोनों को सुरक्षित रखना।
lexical_decisions:
- source_word: וְהוֹתַרְתִּי
  choice: मैं ... बचा रखूँगा
  rationale: हिफ़ील रूप का अर्थ कुछ लोगों को शेष छोड़ना अथवा जीवित बचाए रखना है। यह चयन परमेश्वर द्वारा जानबूझकर सुरक्षित रखे गए बचे हुओं का भाव स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: מֵהֶם אַנְשֵׁי מִסְפָּר
  choice: उनमें से गिने-चुने पुरुषों को
  rationale: מֵהֶם का अंशवाचक भाव ‘उनमें से’ से और मुहावरे אַנְשֵׁי מִסְפָּר का बहुत थोड़े, गिनती के पुरुषों वाला भाव ‘गिने-चुने पुरुषों’ से व्यक्त होता है; मूल का पुरुषवाचक संकेत भी बना रहता है।
- source_word: מֵחֶרֶב מֵרָעָב וּמִדָּבֶר
  choice: तलवार, अकाल और महामारी से
  rationale: यहेजकेल में न्याय के इस स्थापित त्रिक को ठोस और गंभीर रूप में रखा गया है। ‘तलवार’ युद्धजनित मृत्यु का लाक्षणिक संकेत है, רָעָב अकाल है, और דֶּבֶר व्यापक घातक महामारी।
- source_word: לְמַעַן יְסַפְּרוּ
  choice: ताकि वे ... वर्णन करें
  rationale: לְמַעַן स्पष्ट प्रयोजन बताता है और ספר का पिएल रूप विस्तार से बताने या बयान करने का अर्थ देता है।
- source_word: אֵת כָּל תּוֹעֲבוֹתֵיהֶם
  choice: अपने सब घिनौने कामों का
  rationale: תּוֹעֵבָה यहेजकेल में नैतिक और धार्मिक रूप से घृणित, प्रायः मूर्तिपूजक कृत्यों के लिए प्रबल शब्द है। ‘घिनौने काम’ आधुनिक पाठकों के लिए स्वाभाविक रहते हुए उसका नैतिक भार बनाए रखता है।
- source_word: בַּגּוֹיִם
  choice: उन जातियों के बीच
  rationale: גּוֹיִם यहाँ निर्वासन की विदेशी जातियों या राष्ट्रों को सूचित करता है; ‘जातियों’ बाइबिलीय हिन्दी में परिचित और सन्दर्भानुकूल है।
- source_word: אֲשֶׁר בָּאוּ שָׁם
  choice: जहाँ वे पहुँचेंगे
  rationale: בָּאוּ रूपतः पूर्णकालिक है, पर भावी निर्वासन के प्रसंग में गन्तव्य पर पहुँचने को दर्शाता है। मुख्य पाठ में भावी अभिमुखता रखी गई है और रूपगत विकल्प पादटिप्पणी में दिया गया है।
- source_word: וְיָדְעוּ כִּי אֲנִי יְהוָה
  choice: तब वे जानेंगे कि मैं यहोवा हूँ
  rationale: यह यहेजकेल का आवर्ती पहचान-सूत्र है। संयोजक וְ को निष्कर्षात्मक प्रवाह में ‘तब’ कहना स्वाभाविक हिन्दी है, और יְהוָה को उसके वाचा-संबंधी व्यक्तिगत नाम ‘यहोवा’ से प्रस्तुत किया गया है।
theological_decisions:
- issue: אַנְשֵׁי מִסְפָּר में पुरुषवाचक अभिव्यक्ति
  choice: गिने-चुने पुरुष
  alternative: कुछ लोग
  rationale: मूल संज्ञा אַנְשֵׁי व्याकरणतः और अर्थतः पुरुषों को सूचित करती है; इसलिए इसे लिंग-निरपेक्ष बनाकर मूल की विशिष्टता नहीं मिटाई गई।
- issue: תּוֹעֲבוֹתֵיהֶם का नैतिक-धार्मिक बल
  choice: अपने सब घिनौने काम
  alternative: अपने सब बुरे काम
  rationale: ‘बुरे काम’ मूल की तीव्र घृणा और यहेजकेल में उसके मूर्तिपूजा-संबंधी भार को हल्का कर देता; ‘घिनौने काम’ उस बल को स्वाभाविक हिन्दी में सुरक्षित रखता है।
- issue: ईश्वरीय नाम יְהוָה
  choice: यहोवा
  alternative: प्रभु
  rationale: मूल में सामान्य उपाधि नहीं, चार अक्षरों वाला व्यक्तिगत वाचा-नाम है। हिन्दी की व्यापक रूप से पहचानी जाने वाली पारंपरिक लिप्यन्तरण-प्रथा के अनुसार ‘यहोवा’ उसका नाम होने का भेद बनाए रखता है।
- issue: बचे हुए लोगों के वर्णन का आशय
  choice: अपने सब घिनौने कामों का वर्णन करें
  alternative: दूसरों के सामने केवल स्वीकार करें
  rationale: पाठ बताने का प्रयोजन देता है, पर पश्चात्ताप या स्वीकारोक्ति को स्पष्ट रूप से नहीं कहता। अनुवाद उस सम्भावित धार्मिक अर्थ को आरोपित किए बिना कथन की खुली प्रकृति बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, स्पष्ट भविष्यद्वाणी-संबंधी शैली अपनाई गई है। ‘परन्तु’, ‘गिने-चुने’, ‘अकाल’ और ‘महामारी’ सामान्य पाठक के लिए बोधगम्य हैं। अर्धविराम उद्देश्य-वाक्य और यहेजकेल के पहचान-सूत्र के बीच सम्बन्ध स्पष्ट करता है। पादटिप्पणी-चिह्न [a] मुख्य पाठ में सम्बन्धित गन्तव्य-वाक्यांश के तुरन्त बाद रखा गया है।
