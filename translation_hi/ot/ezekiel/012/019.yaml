source:
  edition: WLC
  text: וְ/אָמַרְתָּ֣ אֶל עַ֣ם הָ/אָ֡רֶץ כֹּֽה אָמַר֩ אֲדֹנָ֨/י יְהוִ֜ה לְ/יוֹשְׁבֵ֤י יְרוּשָׁלִַ֨ם֙ אֶל אַדְמַ֣ת יִשְׂרָאֵ֔ל לַחְמָ/ם֙ בִּ/דְאָגָ֣ה יֹאכֵ֔לוּ וּ/מֵֽימֵי/הֶ֖ם בְּ/שִׁמָּמ֣וֹן יִשְׁתּ֑וּ לְמַ֜עַן תֵּשַׁ֤ם אַרְצָ/הּ֙ מִ/מְּלֹאָ֔/הּ מֵ/חֲמַ֖ס כָּֽל הַ/יֹּשְׁבִ֥ים בָּֽ/הּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/012/019.yaml
  text: 'And say to the people of the land[a], ‘Thus says the Lord GOD concerning the inhabitants of Jerusalem in the land of Israel: They will eat their bread with anxiety and drink their water with horror[b], so that her land may be made desolate of its fullness because of the violence of all who dwell in it.’'
translation:
  language: hi
  text: 'और देश के लोगों से कहना, ‘प्रभु यहोवा यरूशलेम के निवासियों के विषय में, जो इस्राएल की भूमि में हैं, यह कहता है: वे चिंता में अपनी रोटी खाएँगे और दहशत में अपना पानी पिएँगे[a], ताकि उसकी भूमि अपनी भरपूरी से रहित होकर उजाड़ हो जाए[b], उसमें रहनेवाले सभी लोगों की हिंसा के कारण।’'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “स्तब्ध भय में अपना पानी पिएँगे”; इब्रानी शब्द उजाड़पन से उपजी दहशत या विस्मय का भी बोध करा सकता है।
    reason: lexical_alternative
  - marker: b
    text: या “ताकि उसकी भूमि उसमें भरी हुई हर वस्तु से खाली होकर उजाड़ हो जाए।”
    reason: lexical_alternative
lexical_decisions:
- source_word: עַם הָאָרֶץ
  choice: देश के लोग
  rationale: यह पद सम्भवतः देश में बचे हुए लोगों को संबोधित करता है; यह स्वाभाविक हिन्दी है और किसी तकनीकी सामाजिक वर्ग का अर्थ नहीं थोपता।
- source_word: אֲדֹנָי יְהוִה
  choice: प्रभु यहोवा
  rationale: दोहरी ईश्वरीय उपाधि को बनाए रखते हुए יהוה को उसके व्यक्तिगत वाचा-नाम ‘यहोवा’ से व्यक्त किया गया है।
- source_word: לְיוֹשְׁבֵי יְרוּשָׁלַם אֶל אַדְמַת יִשְׂרָאֵל
  choice: यरूशलेम के निवासियों के विषय में, जो इस्राएल की भूमि में हैं
  rationale: אֶל को प्रसंगानुसार ‘के विषय में’ समझने से स्पष्ट होता है कि वचन देश के लोगों से यरूशलेम के निवासियों के बारे में कहा जा रहा है; स्थानसूचक वाक्यांश भी सुरक्षित रहता है।
- source_word: לַחְמָם בִּדְאָגָה
  choice: चिंता में अपनी रोटी
  rationale: ‘रोटी’ ठोस संकेत-क्रिया की छवि बनाए रखती है और ‘चिंता में’ भयपूर्ण व्याकुलता व्यक्त करता है।
- source_word: וּמֵימֵיהֶם בְּשִׁמָּמוֹן
  choice: भय से अपना पानी
  rationale: שִׁמָּמוֹן भय, स्तब्धता अथवा उजाड़ से उपजी दहशत का बोध करा सकता है; भोजन के साथ भावात्मक समानांतरता के लिए ‘भय से’ स्वाभाविक है, जबकि पादटिप्पणी व्यापक अर्थ बताती है।
- source_word: תֵּשַׁם אַרְצָהּ מִמְּלֹאָהּ
  choice: उसकी भूमि अपने पूरे वैभव से खाली होकर उजाड़ हो जाए
  rationale: स्त्रीलिंग प्रत्यय को ‘उसकी’ से रखा गया है। מְלֹא का आशय भूमि को भरनेवाली समृद्धि या सारी वस्तुओं से है; ‘खाली होकर’ विभाजनार्थक מִן को स्पष्ट करता है।
- source_word: מֵחֲמַס כָּל הַיֹּשְׁבִים בָּהּ
  choice: क्योंकि उसमें रहनेवाले सभी लोगों ने हिंसा की है
  rationale: מִן का कारणार्थक बल और חָמָס का हिंसा/निर्दयी अन्याय संबंधी अर्थ स्पष्ट हिन्दी में व्यक्त किया गया है।
theological_decisions:
- issue: אֲדֹנָי יְהוִה में ईश्वरीय नाम
  choice: प्रभु यहोवा
  alternative: प्रभु परमेश्वर
  rationale: मूल में व्यक्तिगत नाम יהוה उपस्थित है; ‘यहोवा’ उसे उपाधि में बदलने के बजाय सुरक्षित रखता है और אֲדֹנָי को ‘प्रभु’ से अलग व्यक्त करता है।
- issue: भूमि के उजड़ने में उद्देश्य और परिणाम का संबंध
  choice: ताकि ... उजाड़ हो जाए
  alternative: जिससे ... उजाड़ हो जाएगी
  rationale: לְמַעַן उद्देश्य अथवा परिणाम दोनों की छाया रख सकता है। ‘ताकि’ मूल की औपचारिक संरचना और न्याय-वाणी के तनाव को बनाए रखता है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सहज मानक हिन्दी अपनाई गई है। भविष्यवाणी की न्याय-वाणी और ‘चिंता/भय’ की समानांतर रचना बनाए रखी गई है; अस्पष्ट शब्दों के वैकल्पिक अर्थ पादटिप्पणियों में दिए गए हैं।
