  text: לְ/עֵ֨ינֵי/הֶ֜ם עַל כָּתֵ֤ף תִּשָּׂא֙ בָּ/עֲלָטָ֣ה תוֹצִ֔יא פָּנֶ֣י/ךָ תְכַסֶּ֔ה וְ/לֹ֥א תִרְאֶ֖ה אֶת הָ/אָ֑רֶץ כִּֽי מוֹפֵ֥ת נְתַתִּ֖י/ךָ לְ/בֵ֥ית יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/012/006.yaml
  text: Before their eyes you shall carry it on your shoulder[a]; in the dark you shall bring it out. You shall cover your face so that you do not see the land[b], for I have made you a sign for the house of Israel.
translation:
  language: hi
  text: उनकी आँखों के सामने तुम उसे अपने कंधे पर उठाकर ले जाना; अँधेरे में[a] उसे बाहर ले जाना। अपना चेहरा ढक लेना, ताकि तुम उस भूमि को न देखो, क्योंकि मैंने तुम्हें इस्राएल के घराने के लिए एक चिन्ह[b] ठहराया है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘धुँधलके में।’ इब्रानी शब्द अँधेरे, गहन धुँधलेपन या मंद प्रकाश का बोध करा सकता है; यहाँ संभवतः अँधेरे की आड़ में बाहर जाने की बात है।
    reason: lexical_alternative
  - marker: b
    text: या ‘अनिष्टसूचक चिन्ह।’ यह शब्द ऐसे प्रतीकात्मक चिन्ह के लिए भी आ सकता है जो आने वाली विपत्ति की सूचना देता हो।
    reason: lexical_alternative
lexical_decisions:
- source_word: לְעֵינֵיהֶם
  choice: उनकी आँखों के सामने
  rationale: यह इब्रानी मुहावरा उनके प्रत्यक्ष देखते हुए किए गए प्रतीकात्मक कार्य को व्यक्त करता है और मूल की दृश्यात्मकता बनाए रखता है।
- source_word: עַל כָּתֵף תִּשָּׂא
  choice: तुम उसे अपने कंधे पर उठाकर ले जाना
  rationale: נשׂא और ‘कंधे’ का मेल बोझ उठाकर ले जाने का भाव देता है। कर्म पिछले संदर्भ से निहित है, इसलिए स्वाभाविक हिन्दी में ‘उसे’ जोड़ा गया है।
- source_word: בָּעֲלָטָה
  choice: अँधेरे में
  rationale: עלטה मुख्यतः अँधेरा या गहन धुँधलापन दर्शाता है। संदर्भ में यह सामान को अँधेरे की आड़ में बाहर ले जाने के अनुकूल है, जबकि ‘धुँधलके में’ भी संभव है।
- source_word: תוֹצִיא
  choice: उसे बाहर ले जाना
  rationale: יצא के हिफ़ील रूप का कारणवाचक अर्थ ‘बाहर ले जाना/निकालना’ है; यहाँ निहित कर्म निर्वासन का सामान है।
- source_word: פָּנֶיךָ תְכַסֶּה
  choice: अपना चेहरा ढक लेना
  rationale: यह प्रतीकात्मक कार्य को सीधे व्यक्त करता है और चेहरा किस साधन से ढका गया, इस बारे में अनावश्यक व्याख्या नहीं जोड़ता।
- source_word: וְלֹא תִרְאֶה אֶת הָאָרֶץ
  choice: ताकि तुम उस देश को न देखो
  rationale: मूल में समन्वयकारी वाक्यांश है, पर यहाँ चेहरा ढकने का उद्देश्य या परिणाम व्यक्त होता है। ‘ताकि’ हिन्दी में यह संबंध स्पष्ट करता है।
- source_word: הָאָרֶץ
  choice: उस देश
  rationale: निर्वासन के संदर्भ में הארץ का संकेत स्वदेश की ओर है। ‘उस देश’ निश्चितता बनाए रखता है, पर मुख्य पाठ में ‘इस्राएल का देश’ जोड़कर अर्थ को आवश्यकता से अधिक निश्चित नहीं करता।
- source_word: מוֹפֵת
  choice: एक चिन्ह
  rationale: מוֹפֵת ऐसा प्रतीकात्मक चिन्ह हो सकता है जिसमें आने वाली विपत्ति का संकेत भी हो। ‘चिन्ह’ मुख्य अर्थ को सरल और स्पष्ट रखता है; ‘अपशकुनी संकेत’ अधिक व्याख्यात्मक होगा।
- source_word: נְתַתִּיךָ
  choice: मैंने तुम्हें … ठहराया है
  rationale: शाब्दिक अर्थ ‘मैंने तुम्हें दिया है’ है, लेकिन विधेय संज्ञा ‘चिन्ह’ के साथ हिन्दी में ‘ठहराया है’ इस नियुक्ति को स्वाभाविक रूप से व्यक्त करता है।
- source_word: לְבֵית יִשְׂרָאֵל
  choice: इस्राएल के घराने के लिए
  rationale: ‘इस्राएल का घराना’ भविष्यद्वाणी साहित्य की सामूहिक पदवी को सुरक्षित रखता है, और לְ को यहाँ लक्ष्य या संबद्ध समुदाय के अर्थ में ‘के लिए’ कहा गया है।
theological_decisions:
- issue: प्रतीकात्मक कार्य में הָאָרֶץ का संदर्भ
  choice: मुख्य पाठ में ‘उस देश’
  alternative: ‘इस्राएल का देश’, ‘भूमि’ या ‘धरती’
  rationale: संदर्भ स्वदेश की ओर प्रबल संकेत करता है, पर इब्रानी पाठ केवल הארץ कहता है। इसलिए संभावित संदर्भ को खुला रखते हुए स्पष्ट व्याख्यात्मक विस्तार नहीं जोड़ा गया।
- issue: מוֹפֵת में निहित शुभ-अशुभ भाव
  choice: मुख्य पाठ में ‘चिन्ह’
  alternative: ‘अपशकुनी संकेत’ या ‘अशुभसूचक चिन्ह’
  rationale: यह शब्द चमत्कारिक या प्रतीकात्मक चिन्ह के साथ अनिष्टसूचक अर्थ भी ले सकता है। यहाँ यहेजकेल स्वयं आने वाली घटना का सजीव प्रतीक है; ‘चिन्ह’ मूल की व्यापकता बनाए रखता है और पादटिप्पणी संभावित अनिष्टसूचक भाव बताती है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, निर्देशात्मक और गरिमापूर्ण रखी गई है। आज्ञाओं के लिए ‘ले जाना’ और ‘ढक लेना’ जैसे स्वाभाविक रूप प्रयुक्त हैं। ‘घराना’ भविष्यद्वाणी-साहित्य की सामूहिक अभिव्यक्ति को बनाए रखता है। सभी पादटिप्पणी-चिह्न संबंधित शब्दों के ठीक बाद रखे गए हैं।
