  edition: WLC
  text: בֶּן אָדָ֗ם מָֽה הַ/מָּשָׁ֤ל הַ/זֶּה֙ לָ/כֶ֔ם עַל אַדְמַ֥ת יִשְׂרָאֵ֖ל לֵ/אמֹ֑ר יַֽאַרְכוּ֙ הַ/יָּמִ֔ים וְ/אָבַ֖ד כָּל חָזֽוֹן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/012/022.yaml
  text: Son of man[a], what is this proverb that you have in the land of Israel, saying, ‘The days drag on, and every vision comes to nothing’?”
translation:
  language: hi
  text: “हे मनुष्य के पुत्र, इस्राएल की भूमि में तुम लोगों में यह कैसी कहावत है, जो कहती है, ‘दिन खिंचते जाते हैं और हर दर्शन व्यर्थ ठहरता है’?[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “दिन लम्बे होते जाते हैं और हर दर्शन नष्ट हो जाता है।”
    reason: יַאַרְכוּ (‘लम्बे होते जाते हैं’) और אָבַד (‘नष्ट हो जाता है’) के अधिक शाब्दिक वैकल्पिक अनुवाद को सुरक्षित रखने के लिए।
lexical_decisions:
- source_word: בֶּן אָדָם
  choice: हे मनुष्य के पुत्र
  rationale: यहेजकेल को बार-बार संबोधित करने वाले इस विशिष्ट इब्रानी सूत्र का साहित्यिक रूप बनाए रखता है; सम्बोधन के कारण हिन्दी में ‘हे’ स्वाभाविक है।
- source_word: מָה הַמָּשָׁל הַזֶּה
  choice: यह कैसी कहावत
  rationale: מָשָׁל यहाँ कथा-दृष्टान्त नहीं, लोगों में प्रचलित व्यंग्यपूर्ण लोकोक्ति या उक्ति है; ‘कहावत’ सामान्य आधुनिक हिन्दी में सटीक है।
- source_word: לָכֶם
  choice: तुम लोगों के बीच
  rationale: प्रसंग में यह कहावत के समुदाय में प्रचलित होने का भाव देता है, जिसे हिन्दी में ‘तुम लोगों के बीच’ स्वाभाविक ढंग से व्यक्त करता है।
- source_word: עַל אַדְמַת יִשְׂרָאֵל
  choice: इस्राएल की भूमि में
  rationale: אַדְמָה का मूल अर्थ भूमि या मिट्टी है, पर इस प्रयोग में इस्राएल के भूभाग का संकेत है।
- source_word: יַאַרְכוּ הַיָּמִים
  choice: दिन बढ़ते जाते हैं
  rationale: यह दिनों के लम्बे होते जाने और भविष्यवाणी के पूरा होने में विलम्ब के प्रति लोगों की संशयपूर्ण शिकायत, दोनों को व्यक्त करता है।
- source_word: וְאָבַד כָּל חָזוֹן
  choice: और हर दर्शन निष्फल हो जाता है
  rationale: אָבַד के नष्ट, विफल या बेअसर हो जाने के अर्थ को भविष्यदर्शी दर्शनों की कथित अपूर्णता के प्रसंग में स्पष्ट करता है।
theological_decisions:
- issue: भविष्यदर्शी सम्बोधन בֶּן אָדָם का अनुवाद
  choice: मनुष्य के पुत्र
  alternative: मरणशील मनुष्य
  rationale: यहाँ यह यहेजकेल के लिए परमेश्वर का आवर्ती सम्बोधन है। पारम्परिक साहित्यिक रूप बनाए रखने से पाठ की अन्तर्पाठीय प्रतिध्वनि सुरक्षित रहती है, पर इसे बाद के मसीही पदनाम के रूप में व्याख्यायित नहीं किया गया।
- issue: कहावत में दर्शनों के विषय में संशय
  choice: हर दर्शन निष्फल हो जाता है
  alternative: हर दर्शन मिट जाता है
  rationale: कथन को लोगों की उद्धृत कहावत के रूप में रखा गया है, न कि कथावाचक की धर्मवैज्ञानिक स्वीकृति के रूप में; इस प्रकार मूल पाठ का तनाव बना रहता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘चल पड़ी है’ से לָכֶם का आशय—समुदाय में प्रचलित कहावत—स्पष्ट होता है, जबकि उद्धरण की संशयपूर्ण धार बनी रहती है।
