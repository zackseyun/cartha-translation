lexical_decisions:
- source_word: וַיְהִי
  choice: फिर … पहुँचा
  rationale: यह रूप कथा या प्रकाशन के अगले क्रम को आरम्भ करता है। आधुनिक हिन्दी में ‘फिर’ क्रम को स्वाभाविक ढंग से व्यक्त करता है, और क्रिया का भाव ‘वचन … पहुँचा’ में आता है।
- source_word: דְבַר
  choice: वचन
  rationale: भविष्यवाणी के इस प्रचलित सूत्र में ‘वचन’ मौखिक प्रकाशन और परमेश्वर से आए संदेश—दोनों भावों को बनाए रखता है।
- source_word: יְהוָה
  choice: याहवे[a]
  rationale: मूल पाठ में उपाधि नहीं, बल्कि चार अक्षरों वाला परमेश्वर का नाम YHWH है। ‘याहवे’ उसका प्रचलित आधुनिक लिप्यंतरण है; पाठक के लिए परंपरागत विकल्प पादटिप्पणी में दिया गया है।
- source_word: אֵלַי
  choice: मेरे पास
  rationale: हिन्दी में किसी के पास वचन या संदेश पहुँचने के लिए यह स्वाभाविक दिशासूचक अभिव्यक्ति है।
- source_word: לֵאמֹר
  choice: ':'
  rationale: यह रूप आगे आने वाले प्रत्यक्ष कथन का परिचय देता है। हिन्दी में वाक्य के अंत का द्विबिंदु उसी कार्य को संक्षिप्त और स्वाभाविक रूप से करता है।
theological_decisions:
- issue: परमेश्वर के नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल इब्रानी में व्यक्तिगत नाम YHWH है। ‘याहवे’ स्रोत के रूप को उपाधि से बदले बिना प्रस्तुत करता है; वास्तविक उच्चारण की अनिश्चितता और परंपरागत रूप को पादटिप्पणी स्पष्ट करती है।
