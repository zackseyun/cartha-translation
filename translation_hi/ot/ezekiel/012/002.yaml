  text: בֶּן אָדָ֕ם בְּ/ת֥וֹךְ בֵּית הַ/מֶּ֖רִי אַתָּ֣ה יֹשֵׁ֑ב אֲשֶׁ֣ר עֵינַיִם֩ לָ/הֶ֨ם לִ/רְא֜וֹת וְ/לֹ֣א רָא֗וּ אָזְנַ֨יִם לָ/הֶ֤ם לִ/שְׁמֹ֨עַ֙ וְ/לֹ֣א שָׁמֵ֔עוּ כִּ֛י בֵּ֥ית מְרִ֖י הֵֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/012/002.yaml
  text: Son of man[a], you dwell in the midst of a rebellious house, who have eyes to see but do not see, ears to hear but do not hear[b], for they are a rebellious house.
translation:
  language: hi
  text: हे मनुष्य के पुत्र, तू उस विद्रोही घराने[a] के बीच रहता है। उनके पास देखने के लिए आँखें हैं, फिर भी वे नहीं देखते; उनके पास सुनने के लिए कान हैं, फिर भी वे नहीं सुनते[b], क्योंकि वे विद्रोही घराना हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘विद्रोही घराना’ का अनुवाद ‘विद्रोह का घर’ या ‘विद्रोही लोग’ भी हो सकता है। इब्रानी में ‘घर’ पूरे समुदाय के लिए प्रयुक्त सामूहिक शब्द है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, ‘उनके पास देखने के लिए आँखें हैं, पर उन्होंने नहीं देखा; उनके पास सुनने के लिए कान हैं, पर उन्होंने नहीं सुना।’
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן אָדָם
  choice: हे मनुष्य के पुत्र
  rationale: यहेजकेल में नबी को संबोधित करने वाला विशिष्ट सूत्र है। स्रोत की शब्द-छवि और अंतरपाठीय संबंध बनाए रखने के लिए इसे शाब्दिक किंतु स्वाभाविक संबोधन के रूप में रखा गया है।
- source_word: בְּתוֹךְ
  choice: के बीच
  rationale: यह किसी समुदाय के भीतर रहने का भाव स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: בֵּית הַמֶּרִי / בֵּית מְרִי
  choice: विद्रोही घराना
  rationale: ‘घराना’ इब्रानी सामूहिक रूपक को बनाए रखते हुए स्पष्ट करता है कि आशय पूरे समुदाय से है; दोनों occurrences में पुनरावृत्ति सुरक्षित रखी गई है।
- source_word: יֹשֵׁב
  choice: रहता है
  rationale: संदर्भ में क्रिया का अर्थ किसी समुदाय के बीच निवास करना है; ‘बैठता है’ यहाँ अनावश्यक रूप से शाब्दिक होता।
- source_word: עֵינַיִם לָהֶם לִרְאוֹת וְלֹא רָאוּ
  choice: उनके पास देखने के लिए आँखें हैं, फिर भी वे नहीं देखते
  rationale: इब्रानी समानांतर संरचना और जान-बूझकर न देखने की तनावपूर्ण अभिव्यक्ति दोनों को स्पष्ट, स्वाभाविक हिन्दी में रखा गया है।
- source_word: אָזְנַיִם לָהֶם לִשְׁמֹעַ וְלֹא שָׁמֵעוּ
  choice: उनके पास सुनने के लिए कान हैं, फिर भी वे नहीं सुनते
  rationale: आँखों वाले खंड के समानांतर रूप को बनाए रखता है और ‘सुनना’ को व्याख्यात्मक रूप से ‘आज्ञा मानना’ नहीं बनाता।
- source_word: כִּי
  choice: क्योंकि
  rationale: यहाँ लोगों के न देखने और न सुनने का कारण बताया गया है; आधुनिक हिन्दी में ‘क्योंकि’ इसका सीधा और स्पष्ट रूप है।
theological_decisions:
- issue: इस्राएल के लिए ‘घर’ का सामूहिक रूपक
  choice: मुख्य पाठ में ‘विद्रोही घराना’
  alternative: विद्रोही लोग / विद्रोह का घर
  rationale: इब्रानी ‘घर’ पूरे समुदाय के लिए प्रयुक्त सामूहिक शब्द है। ‘घराना’ रूपक और पद की पुनरावृत्ति बचाता है, जबकि आधुनिक हिन्दी में ‘विद्रोही घर’ से अधिक स्वाभाविक है।
- issue: देखने और सुनने का नैतिक-आत्मिक आशय
  choice: मूल संवेदनात्मक क्रियाएँ ‘देखना’ और ‘सुनना’ बनाए रखना
  alternative: समझना / ध्यान देना / आज्ञा मानना
  rationale: संदर्भ में प्रत्युत्तर न देने का गहरा आशय संभव है, पर अनुवाद में उसे स्पष्ट व्याख्या बनाकर मूल की अर्थ-तनाव को सीमित नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण नबूवत-संबंधी शैली। संबोधन में पारंपरिक ‘हे मनुष्य के पुत्र’ रखा गया है; शेष वाक्य सरल और मौखिक रूप से समझने योग्य हैं।
