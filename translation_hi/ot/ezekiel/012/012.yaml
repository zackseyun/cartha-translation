  text: וְ/הַ/נָּשִׂ֨יא אֲשֶׁר בְּ/תוֹכָ֜/ם אֶל כָּתֵ֤ף יִשָּׂא֙ בָּ/עֲלָטָ֣ה וְ/יֵצֵ֔א בַּ/קִּ֥יר יַחְתְּר֖וּ לְ/ה֣וֹצִיא ב֑/וֹ פָּנָ֣י/ו יְכַסֶּ֔ה יַ֗עַן אֲשֶׁ֨ר לֹא יִרְאֶ֥ה לַ/עַ֛יִן ה֖וּא אֶת הָ/אָֽרֶץ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/012/012.yaml
  text: And the prince who is among them will lift his baggage onto his shoulder in the dark and go out[a]. They will dig through the wall to bring him out through it[c][b]. He will cover his face so that he may not see the land with his eyes.
translation:
  language: hi
  text: और जो प्रधान उनके बीच है, वह अपना सामान कंधे पर उठाकर अँधेरे में बाहर निकलेगा।[a][b] उसे बाहर निकालने के लिए वे दीवार में सेंध लगाएंगे; वे उसे उस सेंध में से बाहर निकालेंगे। वह अपना चेहरा ढक लेगा, ताकि वह अपनी आँखों से देश को न देखे।[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘अँधेरे में’ का अनुवाद ‘धुँधलके में’ भी हो सकता है; इब्रानी शब्द अंधकार या मंद प्रकाश के साथ छिपाव का भाव भी दे सकता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, ‘कंधे पर उठाएगा।’ ‘अपना सामान’ आसपास के पदों में वर्णित निर्वासन के सामान के आधार पर जोड़ा गया है।
    reason: contextual_supply
  - marker: c
    text: या, ‘क्योंकि वह अपनी आँखों से देश को नहीं देखेगा।’ इब्रानी संयोजक पदबंध उद्देश्य/परिणाम के साथ-साथ कारण भी व्यक्त कर सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: הַנָּשִׂיא
  choice: प्रधान
  rationale: यह पद किसी प्रमुख शासक या राजपुरुष को दर्शाता है। यहाँ 'प्रधान' राजनीतिक पद को बनाए रखता है, पर इब्रानी से अधिक स्पष्ट 'राजा' नहीं कहता।
- source_word: בְּתוֹכָם
  choice: उनके बीच
  rationale: यह इब्रानी के 'उनके मध्य/बीच' का स्वाभाविक आधुनिक हिन्दी रूप है।
- source_word: אֶל כָּתֵף יִשָּׂא
  choice: अपना सामान कंधे पर उठाकर
  rationale: शाब्दिक अर्थ 'कंधे पर उठाएगा' है; वस्तु इस पद में व्यक्त नहीं है, पर निकटवर्ती पदों में निर्वासन का सामान स्पष्ट है। इसलिए 'अपना सामान' संदर्भ के आधार पर जोड़ा गया है।
- source_word: בָּעֲלָטָה
  choice: अँधेरे में
  rationale: शब्द अंधकार, धुँधलेपन या छिपाव का भाव देता है। गुप्त पलायन के संदर्भ में 'अँधेरे में' स्वाभाविक है; 'धुँधलके में' भी संभव है।
- source_word: בַּקִּיר יַחְתְּרוּ
  choice: दीवार में सेंध लगाएंगे
  rationale: क्रिया दीवार को खोदकर या तोड़कर मार्ग बनाने को व्यक्त करती है। हिन्दी में 'सेंध लगाना' इस ठोस क्रिया को सहज रूप से बताता है।
- source_word: לְהוֹצִיא בוֹ
  choice: उसी में से उसे निकालेंगे
  rationale: हिफ़ील रूप का अर्थ 'बाहर निकालना' है और בוֹ दीवार में बनाए गए मार्ग से निकलने को दर्शाता है। 'उसे' संदर्भ में प्रधान को सूचित करता है।
- source_word: פָּנָיו יְכַסֶּה
  choice: वह अपना चेहरा ढक लेगा
  rationale: यह मूल वाक्य की शारीरिक क्रिया का सीधा और स्वाभाविक हिन्दी अनुवाद है।
- source_word: יַעַן אֲשֶׁר לֹא יִרְאֶה
  choice: ताकि ... न देखे
  rationale: चेहरा ढकने के बाद आने वाला उपवाक्य यहाँ उद्देश्य या परिणाम के रूप में स्वाभाविक पढ़ता है; कारणवाचक अर्थ भी व्याकरणतः संभव है।
- source_word: לַעַיִן
  choice: अपनी आँखों से
  rationale: शाब्दिक एकवचन 'आँख से' का स्वाभाविक हिन्दी रूप 'अपनी आँखों से' है, जो प्रत्यक्ष देखने के शारीरिक भाव को बनाए रखता है।
- source_word: הָאָרֶץ
  choice: इस देश को
  rationale: यहाँ אֶרֶץ उस देश/भूमि को दर्शाता है जिसे शासक छोड़ रहा है। हिन्दी में 'इस देश' संदर्भगत संकेत को सहज बनाता है।
theological_decisions:
- issue: कंधे पर उठाई जाने वाली वस्तु मूल पद में अव्यक्त है
  choice: मुख्य पाठ में 'अपना सामान' संदर्भ से जोड़ा गया
  alternative: '''कंधे पर उठाएगा'' कहकर वस्तु को अव्यक्त रखना'
  rationale: आसपास के निर्वासन-संबंधी प्रतीकात्मक कार्य में सामान का बार-बार उल्लेख है। जोड़ को पारदर्शी रखने के लिए पादटिप्पणी दी गई है।
- issue: יַעַן אֲשֶׁר का अर्थ
  choice: 'उद्देश्य/परिणाम: ''ताकि ... न देखे'''
  alternative: 'कारण: ''क्योंकि वह ... नहीं देखेगा'''
  rationale: चेहरा ढकने की क्रिया के तुरंत बाद उद्देश्य या परिणाम का अर्थ अधिक स्वाभाविक है, फिर भी वास्तविक इब्रानी अस्पष्टता पादटिप्पणी में सुरक्षित रखी गई है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी अपनाई गई है। 'प्रधान' ने शासकीय पद को 'राजा' बनाकर अधिक विशिष्ट करने से बचाया है। 'दीवार में सेंध लगाना' ठोस क्रिया को स्वाभाविक हिन्दी में व्यक्त करता है। सभी संदर्भगत पूर्तियाँ और महत्वपूर्ण व्याकरणिक विकल्प पादटिप्पणियों में स्पष्ट किए गए हैं।
