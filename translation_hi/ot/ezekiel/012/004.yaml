id: EZK.12.4
reference: Ezekiel 12:4
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/הוֹצֵאתָ֨ כֵלֶ֜י/ךָ כִּ/כְלֵ֥י גוֹלָ֛ה יוֹמָ֖ם לְ/עֵֽינֵי/הֶ֑ם וְ/אַתָּ֗ה תֵּצֵ֤א בָ/עֶ֨רֶב֙ לְ/עֵ֣ינֵי/הֶ֔ם כְּ/מוֹצָאֵ֖י גּוֹלָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/012/004.yaml
  text: And you shall bring out your baggage like the baggage of exile by day before their eyes[b][a], and you yourself shall go out in the evening before their eyes like those going out into exile.
translation:
  language: hi
  text: तू दिन के समय, उनकी आँखों के सामने, अपना सामान ऐसे बाहर निकाल जैसे निर्वासन में जाने का सामान[a]; और तू स्वयं शाम को, उनकी आँखों के सामने, ऐसे निकल जैसे निर्वासन में जानेवाले निकलते हैं।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जैसे किसी निर्वासित का सामान।” इब्रानी अभिव्यक्ति का अर्थ सामूहिक रूप से “निर्वासन का सामान” अथवा व्यक्तिगत रूप से “किसी निर्वासित का सामान” हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या, “जैसे लोग निर्वासन में जाते समय निकलते हैं,” अथवा “जैसे निर्वासित निकलते हैं।” इब्रानी में शाब्दिक रूप से “निर्वासन/निर्वासितों के निकलने के समान” है, जो देश-निकाले के लिए प्रस्थान करने की रीति को दर्शाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוֹצֵאתָ
  choice: बाहर निकाल
  rationale: हिफ़इल रूप का कारणवाचक अर्थ है—किसी वस्तु को बाहर ले जाना या निकालना। यहाँ सामान के साथ ‘बाहर निकाल’ स्वाभाविक और सटीक है।
- source_word: כֵלֶיךָ
  choice: अपना सामान
  rationale: כְּלִי का अर्थ पात्र, उपकरण या वस्तुएँ हो सकता है; निर्वासन के अभिनय-संदर्भ में यह साथ ले जाने योग्य निजी सामान को दर्शाता है।
- source_word: כִּכְלֵי גוֹלָה
  choice: जैसे निर्वासन में जाने का सामान
  rationale: यह सामान और निर्वासन के संबंध को स्पष्ट करता है, पर इब्रानी के सामूहिक अथवा व्यक्तिगत दोनों संभावित भावों को किसी एक निर्वासित व्यक्ति तक सीमित नहीं करता।
- source_word: גּוֹלָה
  choice: निर्वासन
  rationale: इस शब्द में निर्वासन की दशा, निर्वासित समुदाय या देश-निकाले की प्रक्रिया का भाव हो सकता है। ‘निर्वासन’ पद के विषयगत बल को बनाए रखता है।
- source_word: יוֹמָם
  choice: दिन के समय
  rationale: यह आगे के ‘शाम को’ के साथ स्पष्ट कालगत विरोध व्यक्त करता है और आधुनिक हिन्दी में स्वाभाविक है।
- source_word: לְעֵינֵיהֶם
  choice: उनकी आँखों के सामने
  rationale: यह इब्रानी मुहावरे का सजीव रूप बनाए रखता है और इस बात पर बल देता है कि कार्य सार्वजनिक रूप से दिखाई दे।
- source_word: וְאַתָּה
  choice: और तू स्वयं
  rationale: स्वतंत्र सर्वनाम אַתָּה पर बल है; ‘तू स्वयं’ सामान निकालने और नबी के अपने निकलने के बीच अंतर को उभारता है।
- source_word: תֵּצֵא
  choice: निकल
  rationale: יצא का सामान्य अर्थ ‘बाहर जाना/निकलना’ है। आज्ञात्मक संदर्भ में हिन्दी का ‘निकल’ सीधा और स्वाभाविक है।
- source_word: בָּעֶרֶב
  choice: शाम को
  rationale: यह יוֹמָם के साथ दिन और शाम का विरोध स्पष्ट एवं सहज हिन्दी में व्यक्त करता है।
- source_word: כְּמוֹצָאֵי גּוֹלָה
  choice: जैसे निर्वासन में जानेवाले निकलते हैं
  rationale: מוֹצָאֵי बहुवचन रचना है और यहाँ निर्वासन के लिए निकलनेवाले लोगों अथवा उनके निकलने की रीति की ओर संकेत करती है। अनुवाद मानवीय संदर्भ स्पष्ट करता है, जबकि पादटिप्पणी शाब्दिक अस्पष्टता सुरक्षित रखती है।
