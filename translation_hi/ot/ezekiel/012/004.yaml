  register: आधुनिक मानक हिन्दी में गरिमापूर्ण और सहज शैली रखी गई है। परमेश्वर द्वारा नबी को सीधे संबोधन के अनुरूप ‘तू’ का प्रयोग किया गया है। ‘उनकी आँखों के सामने’ की पुनरावृत्ति मूल पाठ के सार्वजनिक, दृश्य अभिनय पर दिए गए बल को सुरक्षित रखती है।
