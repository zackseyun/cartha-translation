source:
  edition: WLC
  text: אֱמֹ֣ר אֲלֵי/הֶ֔ם כֹּ֥ה אָמַ֖ר אֲדֹנָ֣/י יְהֹוִ֑ה הַ/נָּשִׂ֞יא הַ/מַּשָּׂ֤א הַ/זֶּה֙ בִּ/יר֣וּשָׁלִַ֔ם וְ/כָל בֵּ֥ית יִשְׂרָאֵ֖ל אֲשֶׁר הֵ֥מָּה בְ/תוֹכָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/012/010.yaml
  text: 'Say to them[a], ‘Thus says the Lord GOD: This burden concerns the prince in Jerusalem and all the house of Israel who are in their midst.’'
translation:
  language: hi
  text: 'उनसे कह[a], ‘प्रभु यहोवा यों कहता है: यह भविष्यसूचक भार यरूशलेम में रहनेवाले प्रधान और इस्राएल के सारे घराने के विषय में है, जो उनके बीच में हैं।’'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इस संक्षिप्त हिब्रू वाक्य का अनुवाद यह भी हो सकता है: “उनसे कह, ‘प्रभु यहोवा यों कहता है: यह भविष्यवाणी यरूशलेम में रहनेवाले प्रधान और उनके बीच रहनेवाले इस्राएल के सारे घराने के विषय में है।’”'
    reason: מַשָּׂא के ‘भार/भविष्यवाणी’ अर्थ और अन्तिम बहुवचन सर्वनाम के कठिन, अस्पष्ट सम्बन्ध को दर्शाने वाला वैकल्पिक अनुवाद।
lexical_decisions:
- source_word: אֱמֹר אֲלֵיהֶם
  choice: उनसे कह
  rationale: אמר का पुल्लिंग एकवचन आज्ञार्थ और אֶל के साथ सम्बोधन को संक्षिप्त, स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: כֹּה אָמַר אֲדֹנָי יְהוִה
  choice: प्रभु यहोवा यों कहता है
  rationale: यह नबी का पारम्परिक सन्देशवाहक-सूत्र है। ‘यों कहता है’ उसकी औपचारिक गरिमा रखता है, और ‘प्रभु यहोवा’ אֲדֹנָי तथा परमेश्वर के निजी नाम יְהוִה दोनों को अलग-अलग दर्शाता है।
- source_word: הַנָּשִׂיא
  choice: प्रधान
  rationale: נָשִׂיא यहाँ राजनीतिक पद वाले अगुए के लिए है। ‘प्रधान’ पद-सूचक अर्थ रखता है और आधुनिक हिन्दी में ‘राजकुमार’ से उत्पन्न वंशगत अर्थ को अनावश्यक रूप से नहीं जोड़ता।
- source_word: הַמַּשָּׂא הַזֶּה
  choice: यह बोझ
  rationale: מַשָּׂא का मूल अर्थ ‘बोझ’ है और यह भविष्यसूचक घोषणा भी सूचित कर सकता है। प्रसंग में उठाए गए निर्वासन के सामान के साथ सम्भावित शब्द-संबंध को बचाने के लिए ‘बोझ’ रखा गया है; संक्षिप्त नामवाचक वाक्य को स्पष्ट करने हेतु ‘से सम्बन्ध रखता है’ जोड़ा गया है।
- source_word: בִּירוּשָׁלִַם
  choice: यरूशलेम के प्रधान
  rationale: בְּ का स्थानवाचक अर्थ प्रधान के यरूशलेम में होने को बताता है। स्वाभाविक हिन्दी में सम्बन्धवाचक रचना प्रयुक्त हुई; ‘यरूशलेम के विरुद्ध’ जैसा अर्थ नहीं जोड़ा गया।
- source_word: וְכָל בֵּית יִשְׂרָאֵל
  choice: और इस्राएल के सारे घराने
  rationale: ‘इस्राएल का घराना’ बाइबिल का सामुदायिक-वाचा सम्बन्धी मुहावरा है; इसे केवल ‘सारे इस्राएल’ बनाकर सपाट नहीं किया गया।
- source_word: אֲשֶׁר הֵמָּה בְתוֹכָם
  choice: जो उनके बीच हैं
  rationale: हिब्रू में הֵמָּה और प्रत्यय दोनों बहुवचन हैं। हिन्दी अनुवाद उस बहुवचन और उसके अस्पष्ट सन्दर्भ को बनाए रखता है, उसे एकवचन यरूशलेम से जोड़कर चुपचाप निश्चित नहीं करता।
theological_decisions:
- issue: אֲדֹנָי יְהוִה में परमेश्वर के नाम का अनुवाद
  choice: प्रभु यहोवा
  alternative: प्रभु परमेश्वर
  rationale: हिब्रू में उपाधि אֲדֹנָי और वाचा का निजी नाम יְהוִה दोनों हैं। ‘प्रभु यहोवा’ इस भेद को बनाए रखता है और दूसरे पद को सामान्य संज्ञा में नहीं बदलता।
- issue: מַשָּׂא का अर्थ
  choice: बोझ
  alternative: भविष्यवाणी / घोषणा
  rationale: शब्द भविष्यसूचक वचन को सूचित कर सकता है, पर उसका ठोस अर्थ ‘बोझ’ इस प्रसंग के प्रतीकात्मक सामान से अर्थपूर्ण तनाव रखता है। मुख्य पाठ में वही रखा गया और वैकल्पिक अर्थ पादटिप्पणी में दिया गया।
- issue: בְתוֹכָם के सर्वनाम का सन्दर्भ
  choice: बहुवचन ‘उनके बीच’ को बनाए रखा
  alternative: ‘उसके बीच’, अर्थात यरूशलेम के बीच
  rationale: हिब्रू प्रत्यय पुल्लिंग बहुवचन है, जबकि ‘यरूशलेम’ व्याकरणतः एकवचन है। इसलिए पाठ को एकवचन बनाकर सन्दर्भ निश्चित नहीं किया गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य रखी गई है। नबी के औपचारिक सूत्र के लिए ‘यों कहता है’ और सामुदायिक बाइबिलीय पदबंध के लिए ‘इस्राएल का घराना’ रखा गया है। हिब्रू की संक्षिप्तता से उत्पन्न अस्वाभाविकता को सीमित रूप से स्पष्ट किया गया है, पर सर्वनाम का वास्तविक अस्पष्टपन नहीं मिटाया गया।
