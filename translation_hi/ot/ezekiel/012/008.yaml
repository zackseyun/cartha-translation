lexical_decisions:
- source_word: וַיְהִי
  choice: आया
  rationale: यहाँ היה का कथात्मक रूप नबी के पास वचन आने के प्रचलित सूत्र का परिचय देता है। हिंदी में इसे अलग से ‘और ऐसा हुआ’ कहने के बजाय ‘वचन ... आया’ में समाहित करना स्वाभाविक है।
- source_word: דְבַר יְהוָה
  choice: यहोवा का वचन
  rationale: ‘वचन’ דבר के मूल अर्थ और नबूवत-संबंधी सूत्र दोनों को बनाए रखता है; ‘संदेश’ अपेक्षाकृत अधिक व्याख्यात्मक होता।
- source_word: יְהוָה
  choice: यहोवा
  rationale: इब्रानी चतुरक्षरीय दिव्य नाम को पदवी से बदलने के बजाय प्रचलित हिंदी रूप ‘यहोवा’ में रखा गया है।
- source_word: אֵלַי
  choice: मेरे पास
  rationale: दिव्य वचन के आने के संदर्भ में אֵלַי का स्वाभाविक आधुनिक हिंदी रूप ‘मेरे पास’ है।
- source_word: בַּבֹּקֶר
  choice: सुबह
  rationale: यह वचन आने का समय बताता है; ‘सुबह’ संक्षिप्त, स्पष्ट और स्वाभाविक है।
- source_word: לֵאמֹר
  choice: ':'
  rationale: यह रूप अगले पद में आने वाले प्रत्यक्ष कथन का परिचय देता है। आधुनिक हिंदी में उद्धरणसूचक द्विबिंदु वही कार्य अधिक स्वाभाविक ढंग से करता है।
theological_decisions:
- issue: दिव्य नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: प्रभु
  rationale: मूल पाठ में उपाधि नहीं, परमेश्वर का विशिष्ट नाम है। ‘यहोवा’ हिंदी बाइबलीय परंपरा में उसका पहचाना हुआ रूप है और नाम को नाम के रूप में सुरक्षित रखता है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिंदी। नबूवत के सूत्र ‘यहोवा का वचन मेरे पास आया’ को सुरक्षित रखा गया है; लֵאמֹר को हिंदी विराम-चिह्न द्वारा व्यक्त किया गया है।
