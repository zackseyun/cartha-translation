source:
  edition: WLC
  text: לָ/כֵ֞ן אֱמֹ֣ר אֲלֵי/הֶ֗ם כֹּֽה אָמַר֮ אֲדֹנָ֣/י יְהוִה֒ הִשְׁבַּ֨תִּי֙ אֶת הַ/מָּשָׁ֣ל הַ/זֶּ֔ה וְ/לֹֽא יִמְשְׁל֥וּ אֹת֛/וֹ ע֖וֹד בְּ/יִשְׂרָאֵ֑ל כִּ֚י אִם דַּבֵּ֣ר אֲלֵי/הֶ֔ם קָֽרְבוּ֙ הַ/יָּמִ֔ים וּ/דְבַ֖ר כָּל חָזֽוֹן־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/012/023.yaml
  text: 'Therefore say to them[a], ‘Thus says the Lord GOD: I will put an end to this proverb, and they will no longer use it as a proverb in Israel. But say to them, “The days have drawn near, and the word of every vision.”’'
translation:
  language: hi
  text: 'इसलिए उनसे कह, ‘प्रभु याहवे यों कहते हैं: मैं इस कहावत का अंत कर दूँगा, और इस्राएल में लोग फिर इसे कहावत के रूप में नहीं कहेंगे। बल्कि उनसे कह, “वे दिन निकट आ गए हैं, और हर दर्शन की बात[a] भी निकट आ गई है।”’'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, ‘हर दर्शन का वचन’। यहाँ ‘वचन/बात’ का आशय हर भविष्यदर्शी दर्शन के शीघ्र पूरा होने से भी हो सकता है।
    reason: दָּבָר के शाब्दिक ‘वचन’ तथा संदर्भगत ‘पूर्ति’—दोनों संभावित भावों को सुरक्षित रखना।
lexical_decisions:
- source_word: לָכֵן
  choice: इसलिए
  rationale: यह पिछले कथन से निकलने वाले परिणाम को स्वाभाविक और स्पष्ट रूप से व्यक्त करता है।
- source_word: כֹּה אָמַר אֲדֹנָי יְהוִה
  choice: प्रभु याहवे यों कहते हैं
  rationale: यह नबूवत के पारंपरिक संदेशवाहक-सूत्र को बनाए रखता है और יְהוִה को उसके व्यक्तिगत नाम के रूप में दर्शाता है।
- source_word: הִשְׁבַּתִּי
  choice: मैं ... का अंत कर दूँगा
  rationale: हिफ़ईल रूप का अर्थ किसी वस्तु को समाप्त करना है; संदर्भ में पूर्ण क्रिया परमेश्वर की निकट भविष्य में प्रभावी होने वाली घोषणा व्यक्त करती है।
- source_word: הַמָּשָׁל הַזֶּה
  choice: इस कहावत
  rationale: מָשָׁל यहाँ पिछले पद में उद्धृत प्रचलित लोकोक्ति है, साहित्यिक दृष्टांत नहीं।
- source_word: וְלֹא יִמְשְׁלוּ אֹתוֹ עוֹד בְּיִשְׂרָאֵל
  choice: इस्राएल में लोग फिर इसे कहावत के रूप में नहीं कहेंगे
  rationale: क्रिया का अर्थ यहाँ शासन करना नहीं, बल्कि कहावत बोलना या उसका प्रयोग करना है। अनिर्दिष्ट बहुवचन कर्ता को हिन्दी में स्वाभाविक रूप से ‘लोग’ कहा गया है।
- source_word: כִּי אִם
  choice: बल्कि
  rationale: यह समाप्त की जा रही पुरानी कहावत और उसके स्थान पर दिए जाने वाले संदेश के बीच प्रबल विरोध दिखाता है।
- source_word: קָרְבוּ הַיָּמִים
  choice: वे दिन निकट आ गए हैं
  rationale: पूर्ण क्रिया उस समय के अब निकट पहुँच जाने की भावना व्यक्त करती है।
- source_word: וּדְבַר כָּל חָזוֹן
  choice: और हर दर्शन का वचन भी
  rationale: यह דָּבָר के मूल अर्थ ‘वचन/बात’ को बनाए रखता है और पूर्ति का भाव मुख्य पाठ में जोड़कर अस्पष्टता को समय से पहले हल नहीं करता। ‘भी’ हिन्दी में मूल इब्रानी के क्रियारहित समांतर खंड को सुबोध बनाता है।
theological_decisions:
- issue: אֲדֹנָי יְהוִה में दिव्य नाम का अनुवाद
  choice: प्रभु याहवे
  alternative: प्रभु परमेश्वर
  rationale: ‘याहवे’ मूल पाठ में उपस्थित विशिष्ट दिव्य नाम को स्पष्ट रखता है, जबकि ‘प्रभु’ אֲדֹנָי का अनुवाद करता है।
- issue: וּדְבַר כָּל חָזוֹן का अर्थ
  choice: हर दर्शन का वचन
  alternative: हर दर्शन की पूर्ति
  rationale: संदर्भ निश्चय ही दर्शनों के शीघ्र पूरा होने की ओर संकेत करता है, फिर भी דָּבָר का सीधा अर्थ ‘वचन/बात’ है। मुख्य पाठ उस शब्दगत अस्पष्टता को रखता है और संदर्भगत अर्थ को पाद-टिप्पणी में बताता है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध हिन्दी। प्रत्यक्ष वचन की परतें सुरक्षित रखी गई हैं; ‘यों कहते हैं’ नबूवत की औपचारिक शैली बनाए रखता है।
