  text: וּ/פָרַשְׂתִּ֤י אֶת רִשְׁתִּ/י֙ עָלָ֔י/ו וְ/נִתְפַּ֖שׂ בִּ/מְצֽוּדָתִ֑/י וְ/הֵבֵאתִ֨י אֹת֤/וֹ בָבֶ֨לָ/ה֙ אֶ֣רֶץ כַּשְׂדִּ֔ים וְ/אוֹתָ֥/הּ לֹֽא יִרְאֶ֖ה וְ/שָׁ֥ם יָמֽוּת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/012/013.yaml
  text: I will spread my net over him[a], and he will be caught in my snare. Then I will bring him to Babylon, the land of the Chaldeans; yet he will not see it[b], and there he will die.
translation:
  language: hi
  text: मैं उस पर अपना जाल फैलाऊँगा[a], और वह मेरे फंदे में पकड़ा जाएगा। तब मैं उसे कसदियों के देश बाबेल में ले आऊँगा; फिर भी वह उस देश को देख नहीं पाएगा[b], और वहीं मर जाएगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या “अपना फंदा।” यहाँ इब्रानी में शिकार पकड़ने से जुड़े दो निकटार्थक शब्द आए हैं: “अपना जाल” और “मेरा फंदा।”'
    reason: lexical_alternative
  - marker: b
    text: उसे बाबेल ले जाए जाने पर भी उस देश को न देखने की बात को प्रायः 2 राजा 25:7; यिर्मयाह 39:7; 52:11 के प्रकाश में समझा जाता है।
    reason: cross_reference
lexical_decisions:
- source_word: וּפָרַשְׂתִּי
  choice: मैं...फैलाऊँगा
  rationale: פָּרַשׂ का मूल अर्थ ‘फैलाना’ है; यह जाल बिछाने की छवि को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: רִשְׁתִּי
  choice: अपना जाल
  rationale: רֶשֶׁת शिकार पकड़ने के जाल के लिए सामान्य शब्द है।
- source_word: עָלָיו
  choice: उस पर
  rationale: स्थानवाचक अर्थ और जाल द्वारा ढककर पकड़ने की छवि दोनों सुरक्षित रहते हैं।
- source_word: וְנִתְפַּשׂ
  choice: वह...पकड़ा जाएगा
  rationale: निफ़अल रूप का कर्मवाच्य अर्थ और पकड़ने की रूपक-श्रृंखला स्पष्ट रहती है।
- source_word: בִּמְצוּדָתִי
  choice: मेरे फंदे में
  rationale: מְצוּדָה जाल, फंदा या पाश हो सकता है; ‘फंदा’ पहले आए ‘जाल’ से संबंधित किंतु अलग शिकार-शब्द रखता है।
- source_word: וְהֵבֵאתִי אֹתוֹ
  choice: तब मैं उसे...ले आऊँगा
  rationale: בוא का हिफ़ील ‘ले आना’ है; ‘तब’ घटनाक्रम को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: בָבֶלָה
  choice: बाबेल में
  rationale: दिशासूचक प्रत्यय बाबेल की ओर गति बताता है; ‘ले आऊँगा...में’ हिन्दी में गंतव्य को सहज रूप से व्यक्त करता है।
- source_word: אֶרֶץ כַּשְׂדִּים
  choice: कसदियों के देश
  rationale: यह ऐतिहासिक-जातीय पद का सीधा रूपांतरण है और बाबेल की पहचान बताता है।
- source_word: וְאוֹתָהּ לֹא יִרְאֶה
  choice: फिर भी वह उसे देख नहीं पाएगा
  rationale: स्त्रीलिंग सर्वनाम का संकेत ‘देश’ की ओर है; ‘फिर भी’ वहाँ पहुँचने और उसे न देखने के बीच की विडंबना बनाए रखता है।
- source_word: וְשָׁם יָמוּת
  choice: और वहीं मर जाएगा
  rationale: स्थान पर दिए गए बल तथा इब्रानी वाक्य-क्रम को सहज हिन्दी में सुरक्षित रखता है।
theological_decisions:
- issue: उसे बाबेल लाया जाएगा, फिर भी वह उसे नहीं देखेगा
  choice: मुख्य पाठ में कारण बताए बिना कथन की विडंबना और तनाव बनाए रखा गया है।
  alternative: ‘वह अंधा कर दिया जाएगा, इसलिए उसे नहीं देखेगा’ जैसा व्याख्यात्मक विस्तार।
  rationale: इस पद में अंधा किए जाने का कारण स्पष्ट नहीं किया गया है। अन्य ऐतिहासिक पद इस बात को समझाते हैं, पर उसे मुख्य अनुवाद में जोड़ना मूल पाठ से आगे जाना होगा।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण और सहज शैली अपनाई गई है। ‘बाबेल’ और ‘कसदी’ जैसे पारंपरिक बाइबलीय ऐतिहासिक नाम रखे गए हैं। मूल की शिकार-संबंधी रूपक-श्रृंखला और बाबेल को न देख पाने की अनसुलझी विडंबना सुरक्षित है।
