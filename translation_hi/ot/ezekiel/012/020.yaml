reference: Ezekiel 12:20
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/הֶ/עָרִ֤ים הַ/נּֽוֹשָׁבוֹת֙ תֶּחֱרַ֔בְנָה וְ/הָ/אָ֖רֶץ שְׁמָמָ֣ה תִֽהְיֶ֑ה וִֽ/ידַעְתֶּ֖ם כִּֽי אֲנִ֥י יְהוָֽה־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/012/020.yaml
  text: And the inhabited cities will be laid waste[a], and the land will become a desolation; then you will know that I am Yahweh.
translation:
  language: hi
  text: और बसे हुए नगर उजड़ जाएँगे, और देश वीरान हो जाएगा। तब तुम जानोगे कि मैं याहवे[a] हूँ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में परमेश्वर का नाम YHWH (יהוה) है; इसे परंपरागत रूप से ‘यहोवा’ या ‘प्रभु’ भी लिखा गया है।
    reason: ईश्वरीय नाम के मूल इब्रानी रूप और प्रचलित वैकल्पिक निरूपण को स्पष्ट करना।
lexical_decisions:
- source_word: הֶעָרִים הַנּוֹשָׁבוֹת
  choice: बसे हुए नगर
  rationale: עִיר नगर या शहर को दर्शाता है, और ישׁב का कृदंत यहाँ उनमें लोगों के बसे होने को व्यक्त करता है। ‘बसे हुए नगर’ सहज हिन्दी में दोनों तत्वों को बनाए रखता है।
- source_word: תֶּחֱרַבְנָה
  choice: उजड़ जाएँगे
  rationale: חרב का यह रूप नगरों के उजड़ने या खंडहर हो जाने की परिणामी दशा व्यक्त करता है। ‘उजड़ जाएँगे’ अनावश्यक रूप से किसी कर्ता को जोड़े बिना इस भाव को स्वाभाविक हिन्दी में देता है।
- source_word: הָאָרֶץ
  choice: देश
  rationale: नगरों और क्षेत्रीय विनाश के संदर्भ में אֶרֶץ का अर्थ समूची पृथ्वी नहीं, संबंधित देश या भूभाग है। हिन्दी में ‘देश’ यहाँ सबसे सहज है।
- source_word: שְׁמָמָה תִהְיֶה
  choice: वीरान हो जाएगा
  rationale: शब्दसमूह किसी भूभाग के उजाड़ और निर्जन दशा में आ जाने को व्यक्त करता है। ‘वीरान हो जाएगा’ संक्रमण और परिणामी दशा दोनों स्पष्ट करता है।
- source_word: וִידַעְתֶּם
  choice: तब तुम जानोगे
  rationale: बहुवचन संबोधन को ‘तुम’ से सुरक्षित रखा गया है। कथन-क्रम में वाव परिणामसूचक है, इसलिए ‘तब’ विनाश के बाद होने वाली पहचान को स्पष्ट करता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: चार अक्षरों वाले परमेश्वर के निजी नाम को किसी उपाधि से बदलने के बजाय हिन्दी में निकट ध्वन्यात्मक रूप ‘याहवे’ दिया गया है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में निजी नाम יהוה है। ‘याहवे’ उसका व्यापक रूप से स्वीकृत विद्वत पुनर्निर्मित उच्चारण है और निजी नाम तथा ‘प्रभु’ जैसी उपाधि के बीच भेद बनाए रखता है; पादटिप्पणी पाठक को इब्रानी रूप और पारंपरिक विकल्प बताती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। दो समानांतर विनाश-वाक्यों को ‘और’ से जोड़ा गया है, जबकि परिणामसूचक अंतिम वाक्य को पूर्ण विराम के बाद रखा गया है।
