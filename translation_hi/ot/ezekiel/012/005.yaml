  text: Before their eyes[a], dig through the wall, and bring out through it.
translation:
  language: hi
  text: उनकी आँखों के सामने[a] दीवार में अपने लिए सेंध लगा, और उसी में से सामान बाहर निकाल।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उनके देखते-देखते।”
    reason: इब्रानी मुहावरे का अधिक स्वाभाविक वैकल्पिक अनुवाद।
  - marker: b
    text: इब्रानी में यहाँ “सामान” शब्द नहीं है; वह पिछले पद के संदर्भ से समझा जाता है।
    reason: मूल भाषा में कर्म के लोप और हिन्दी में संदर्भानुसार उसकी पूर्ति को स्पष्ट करना।
lexical_decisions:
- source_word: לְעֵינֵיהֶם
  choice: उनकी आँखों के सामने
  rationale: यह इब्रानी मुहावरा उनके प्रत्यक्ष देखते हुए किए जाने वाले सार्वजनिक प्रतीकात्मक कार्य को व्यक्त करता है; ठोस ‘आँखों’ की छवि भी बनी रहती है।
- source_word: חֲתָר
  choice: सेंध लगा
  rationale: दीवार को खोदकर या तोड़कर उसमें से निकलने योग्य छेद बनाने की क्रिया के लिए आधुनिक हिन्दी में ‘सेंध लगाना’ स्वाभाविक और सटीक है।
- source_word: לְךָ
  choice: अपने लिए
  rationale: हितवाचक दत्तिव को छोड़ा नहीं गया है; यह बताता है कि नबी अपने उपयोग के लिए दीवार में रास्ता बनाए।
- source_word: בַקִּיר
  choice: दीवार में
  rationale: पूर्वसर्ग और निश्चित पद का सीधा, स्वाभाविक हिन्दी रूप है; क्रिया के साथ ‘दीवार में सेंध लगाना’ मुहावरेदार है।
- source_word: וְהוֹצֵאתָ
  choice: सामान बाहर निकाल
  rationale: हिफ़ील रूप का अर्थ ‘बाहर निकालना’ है। मूल पद में कर्म व्यक्त नहीं है, पर पिछले पद के ‘निर्वासन के सामान’ से हिन्दी में संदर्भानुसार ‘सामान’ ग्रहण किया गया है।
- source_word: בּוֹ
  choice: उसी में से
  rationale: सर्वनाम दीवार में बनाई गई सेंध के रास्ते की ओर लौटता है; ‘उसी में से’ माध्यम और पूर्वसंदर्भ दोनों स्पष्ट करता है।
