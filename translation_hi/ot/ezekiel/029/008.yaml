  text: לָ/כֵ֗ן כֹּ֤ה אָמַר֙ אֲדֹנָ֣/י יְהוִ֔ה הִנְ/נִ֛י מֵבִ֥יא עָלַ֖יִ/ךְ חָ֑רֶב וְ/הִכְרַתִּ֥י מִמֵּ֖/ךְ אָדָ֥ם וּ/בְהֵמָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/029/008.yaml
  text: 'Therefore thus says the Lord GOD: Behold[a], I am bringing a sword against you[b], and I will cut off from you man and beast.'
translation:
  language: hi
  text: 'इसलिए प्रभु याहवे यों कहते हैं: देखो, मैं तेरे विरुद्ध तलवार ला रहा हूँ[a], और मैं तेरे बीच से मनुष्य और पशु को काट डालूँगा[b]।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “मैं तेरे विरुद्ध तलवार लाऊँगा।” यहाँ “तलवार” युद्ध और दंड का सामूहिक बिंब भी हो सकती है।
    reason: lexical_alternative
  - marker: b
    text: “मनुष्य और पशु” न्याय का एक प्रचलित सूत्र है, जो मनुष्यों और पशुओं—दोनों को सम्मिलित करता है।
    reason: cultural_note
lexical_decisions:
- source_word: לָכֵן
  choice: इसलिए
  rationale: यह पिछले आरोप से आगामी न्याय का निष्कर्ष जोड़ने वाला स्वाभाविक और स्पष्ट शब्द है।
- source_word: כֹּה אָמַר
  choice: यों कहते हैं
  rationale: यह भविष्यद्वक्ताओं की प्रचलित संदेश-सूचना शैली को गरिमापूर्ण और सहज हिन्दी में व्यक्त करता है।
- source_word: אֲדֹנָי יְהוִה
  choice: प्रभु यहोवा
  rationale: दोनों तत्वों को अलग रखते हुए אֲדֹנָי को ‘प्रभु’ और परमेश्वर के निजी नाम יהוה को ‘यहोवा’ के रूप में प्रस्तुत किया गया है।
- source_word: הִנְנִי מֵבִיא
  choice: देख, मैं ... ला रहा हूँ
  rationale: הִנְנִי की ध्यान आकर्षित करने वाली गंभीरता और कृदंत की आसन्न, सजीव क्रिया—दोनों सुरक्षित रहते हैं।
- source_word: עָלַיִךְ חָרֶב
  choice: तेरे विरुद्ध तलवार
  rationale: ‘विरुद्ध’ न्याय के शत्रुतापूर्ण भाव को स्पष्ट करता है; अनिश्चित एकवचन ‘तलवार’ युद्ध और न्याय का सामूहिक बिंब भी हो सकता है।
- source_word: וְהִכְרַתִּי מִמֵּךְ
  choice: और मैं तुझमें से ... मिटा दूँगा
  rationale: हिफ़ील रूप का आशय किसी स्थान या समुदाय से पूर्णतः हटा देने अथवा नष्ट करने का है; शाब्दिक ‘काट डालूँगा’ की अपेक्षा यहाँ ‘मिटा दूँगा’ आधुनिक हिन्दी में अधिक स्वाभाविक है।
- source_word: אָדָם וּבְהֵמָה
  choice: मनुष्य और पशु दोनों
  rationale: यह मनुष्यों और पशुओं को समग्र रूप से घेरे हुए न्याय का रूढ़ सूत्र है; ‘दोनों’ युग्म की व्यापकता को हिन्दी में स्पष्ट करता है।
theological_decisions:
- issue: संयुक्त ईश्वरीय उपाधि אֲדֹנָי יְהוִה का अनुवाद
  choice: प्रभु यहोवा
  alternative: प्रभु परमेश्वर
  rationale: मूल पाठ में उपाधि और निजी नाम दोनों हैं। ‘प्रभु यहोवा’ इस भेद को बनाए रखता है और ‘प्रभु प्रभु’ जैसी अस्वाभाविक पुनरुक्ति से बचता है।
- issue: तलवार के बिंब की व्याख्या
  choice: मुख्य पाठ में ‘तलवार’
  alternative: युद्ध अथवा सैन्य विनाश
  rationale: मूल बिंब को पाठ में बनाए रखा गया है; उसके सामूहिक रूप से युद्ध और न्याय सूचित करने की संभावना पादटिप्पणी में दी गई है, ताकि अर्थ को अनावश्यक रूप से सीमित न किया जाए।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण भविष्यद्वक्तापरक स्वर रखा गया है। मिस्र को स्त्रीलिंग एकवचन में संबोधित करने वाले मूल रूप के अनुरूप ‘तेरे/तुझमें’ प्रयुक्त हैं। ‘देख’ ने הִנְנִי की उद्घोषणात्मक शक्ति रखी है, जबकि ‘ला रहा हूँ’ आसन्न क्रिया का भाव देता है।
