base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/029/001.yaml
  text: In the tenth year[a], in the tenth month, on the twelfth day of the month, the word of Yahweh came to me, saying,
translation:
  language: hi
  text: 'दसवें वर्ष के दसवें महीने के बारहवें दिन याहवे का वचन मेरे पास आया:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בַּשָּׁנָה הָעֲשִׂירִית
  choice: दसवें वर्ष
  rationale: इब्रानी पाठ में गणना का आरंभ-बिंदु स्पष्ट नहीं किया गया है, इसलिए निर्वासन या किसी राजा के शासन का उल्लेख नहीं जोड़ा गया।
- source_word: בָּעֲשִׂרִי
  choice: दसवें महीने
  rationale: ‘महीना’ यहाँ निहित है और आगे לַחֹדֶשׁ से स्पष्ट होता है; स्वाभाविक हिन्दी के लिए इसे व्यक्त किया गया है।
- source_word: בִּשְׁנֵים עָשָׂר לַחֹדֶשׁ
  choice: महीने के बारहवें दिन
  rationale: यह महीने के भीतर दिन बताने की मानक इब्रानी तिथि-अभिव्यक्ति है; हिन्दी में ‘दिन’ आवश्यक रूप से व्यक्त किया गया है।
- source_word: הָיָה דְבַר יְהוָה אֵלַי
  choice: यहोवा का वचन मेरे पास आया
  rationale: शाब्दिक ‘हुआ/था’ की अपेक्षा यह प्रचलित भविष्यवाणी-सूत्र का स्वाभाविक और अर्थनिष्ठ हिन्दी रूप है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: चतुराक्षरीय ईश-नाम को किसी उपाधि से बदलने के बजाय हिन्दी में प्रचलित व्यक्तिगत नाम ‘यहोवा’ से व्यक्त किया गया है।
- source_word: לֵאמֹר
  choice: 'आया:'
  rationale: यह पद अगले कथन का परिचय देता है। हिन्दी में ‘यह कहते हुए’ की अपेक्षा विसर्ग अधिक स्वाभाविक ढंग से आगामी प्रत्यक्ष वचन की सूचना देता है।
theological_decisions:
- issue: ईश-नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ में व्यक्तिगत ईश-नाम है। हिन्दी बाइबलीय प्रयोग में सुबोध और प्रतिष्ठित रूप ‘यहोवा’ रखा गया; इसे ‘प्रभु’ जैसी उपाधि से प्रतिस्थापित नहीं किया गया।
- issue: तिथि के वर्ष का संदर्भ-बिंदु
  choice: अस्पष्टता को बनाए रखते हुए केवल ‘दसवें वर्ष’
  alternative: ‘निर्वासन के दसवें वर्ष’
  rationale: इस पद में निर्वासन या शासनकाल स्पष्ट रूप से उल्लिखित नहीं है, इसलिए व्याख्यात्मक आधार नहीं जोड़ा गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। तिथि-सूत्र को हिन्दी के स्वाभाविक क्रम में संक्षिप्त रूप से व्यक्त किया गया है और आगामी वचन के परिचय के लिए विसर्ग का प्रयोग किया गया है।
