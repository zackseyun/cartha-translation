source:
  edition: WLC
  text: וְ/הָיְתָ֤ה אֶֽרֶץ מִצְרַ֨יִם֙ לִ/שְׁמָמָ֣ה וְ/חָרְבָּ֔ה וְ/יָדְע֖וּ כִּֽי אֲנִ֣י יְהוָ֑ה יַ֧עַן אָמַ֛ר יְאֹ֥ר לִ֖/י וַ/אֲנִ֥י עָשִֽׂיתִי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/029/009.yaml
  text: And the land of Egypt will become a desolation and a waste[a], and they will know that I am Yahweh, because he said, ‘The Nile is mine, and I made it.’
translation:
  language: hi
  text: और मिस्र की भूमि उजाड़ और वीरान हो जाएगी, और वे जान लेंगे कि मैं याहवे हूँ, क्योंकि उसने कहा, “नील नदी[a] मेरी है, और मैंने ही इसे बनाया है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इब्रानी में: “नदी”; मिस्र के प्रसंग में यह विशेष रूप से नील नदी को सूचित करती है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיְתָה
  choice: हो जाएगा
  rationale: भविष्यसूचक प्रसंग में यह रूप आने वाले परिणाम को व्यक्त करता है; ‘हो जाएगा’ वर्तमान दशा से उजाड़ दशा में परिवर्तन को स्वाभाविक हिन्दी में स्पष्ट करता है।
- source_word: אֶרֶץ מִצְרַיִם
  choice: मिस्र देश
  rationale: אֶרֶץ के ठोस भौगोलिक अर्थ को बनाए रखते हुए आधुनिक हिन्दी में सहज अभिव्यक्ति।
- source_word: לִשְׁמָמָה וְחָרְבָּה
  choice: उजाड़ और वीरान
  rationale: दोनों निकटार्थक शब्द विनाश और निर्जनता की तीव्रता को व्यक्त करते हैं; हिन्दी में संज्ञात्मक अनुवाद की अपेक्षा यह जोड़ी अधिक स्वाभाविक है।
- source_word: וְיָדְעוּ
  choice: और वे जान लेंगे
  rationale: यहेजकेल की पहचान-सूत्र शैली को बनाए रखा गया है; इब्रानी में बहुवचन कर्ता अनिर्दिष्ट है, इसलिए उसे अधिक स्पष्ट करके किसी विशेष समूह तक सीमित नहीं किया गया।
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत वाचा-नाम का लिप्यंतरण किया गया है, उसे किसी उपाधि से नहीं बदला गया।
- source_word: יַעַן אָמַר
  choice: क्योंकि उसने कहा था
  rationale: יַעַן न्याय का कारण प्रस्तुत करता है। इब्रानी का एकवचन कर्ता अनिर्दिष्ट रहने दिया गया है; प्रसंग के आधार पर नाम जोड़कर अर्थ को सीमित नहीं किया गया।
- source_word: יְאֹר
  choice: नील नदी
  rationale: मिस्र के प्रसंग में יְאֹר विशेष रूप से नील नदी को सूचित करता है; शाब्दिक ‘नदी’ को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: לִי
  choice: मेरी है
  rationale: यह संक्षिप्त स्वामित्व-वाचक कथन वक्ता के घमंडी दावे को सीधे व्यक्त करता है।
- source_word: וַאֲנִי עָשִׂיתִי
  choice: और मैंने ही उसे बनाया है
  rationale: स्पष्ट सर्वनाम אֲנִי के बल को ‘ही’ से व्यक्त किया गया है; עשה के सामान्य अर्थ के अनुसार ‘बनाया’ चुना गया, न कि अधिक विशिष्ट ‘सृष्टि की’।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा अथवा प्रभु
  rationale: मूल पाठ में चतुरक्षरीय व्यक्तिगत नाम सीधे आया है। ‘याहवे’ उसका प्रचलित विद्वत्तापूर्ण लिप्यंतरण है और उसे सामान्य उपाधि में बदलने से बचाता है।
- issue: ‘उसने कहा था’ के कर्ता की पहचान
  choice: कर्ता को अनिर्दिष्ट रखा गया
  alternative: ‘फ़िरौन ने कहा था’
  rationale: व्यापक प्रसंग में वक्ता फ़िरौन है, पर इस पद के इब्रानी पाठ में उसका नाम नहीं है। ‘उसने’ मूल की अंतर्निहित संदर्भ-निर्भरता को बनाए रखता है।
- issue: ‘मैंने ही’ में वक्ता के आत्म-दावे का बल
  choice: ‘ही’ के द्वारा बल व्यक्त किया
  alternative: ‘मैंने उसे बनाया है’
  rationale: इब्रानी में क्रिया के साथ स्वतंत्र सर्वनाम אֲנִי आया है, जो आत्म-दावे को बल देता है। हिन्दी का ‘ही’ इस घमंडी दावे को बिना अतिरिक्त व्याख्या के स्वाभाविक रूप से सामने लाता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘उजाड़ और वीरान’ मूल की समानार्थी तीव्रता को स्वाभाविक हिन्दी में व्यक्त करता है। प्रत्यक्ष कथन के अहंकारी स्वर को ‘मेरी है’ और ‘मैंने ही’ द्वारा सुरक्षित रखा गया है।
