  edition: WLC
  text: מִן הַ/מַּמְלָכוֹת֙ תִּהְיֶ֣ה שְׁפָלָ֔ה וְ/לֹֽא תִתְנַשֵּׂ֥א ע֖וֹד עַל הַ/גּוֹיִ֑ם וְ/הִ֨מְעַטְתִּ֔י/ם לְ/בִלְתִּ֖י רְד֥וֹת בַּ/גּוֹיִֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/029/015.yaml
  text: It will be the lowliest of the kingdoms[a], and it will no longer exalt itself above the nations; and I will diminish them[d][c][b], so that they will not rule over the nations.
translation:
  language: hi
  text: वह राज्यों में सबसे नीचा होगा[a] और फिर कभी अपने आपको जातियों से ऊँचा नहीं उठाएगा[b]। मैं उन्हें घटा दूँगा[c], ताकि वे जातियों पर शासन न करें[d]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “वह राज्यों में सबसे दीन होगा।” इब्रानी पदबंध अन्य राज्यों की तुलना में मिस्र की अत्यन्त नीची और अपमानित स्थिति बताता है।
    reason: lexical_alternative
  - marker: b
    text: या “वह फिर कभी जातियों से ऊँचा नहीं किया जाएगा।” इब्रानी क्रिया का अर्थ निष्क्रिय रूप से ऊँचा किया जाना या अपने आपको ऊँचा उठाना—दोनों हो सकता है।
    reason: lexical_alternative
  - marker: c
    text: शाब्दिक रूप से, “मैं उनकी संख्या कम कर दूँगा।” बहुवचन सर्वनाम मिस्र के लोगों या उसकी सामूहिक शक्ति की ओर संकेत करता है।
    reason: lexical_alternative
  - marker: d
    text: शाब्दिक रूप से, “जातियों में/के बीच”; शासन के प्रसंग में अर्थ है “जातियों पर।”
    reason: lexical_alternative
lexical_decisions:
- source_word: מִן הַמַּמְלָכוֹת תִּהְיֶה שְׁפָלָה
  choice: वह राज्यों में सबसे नीचा राज्य होगा
  rationale: מן का प्रयोग यहाँ तुलना/परमावस्था के अर्थ में है और שְׁפָלָה दीन या निम्न स्थिति बताता है। यह अनुवाद मिस्र की अन्य राज्यों की तुलना में सबसे नीची स्थिति को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וְלֹא תִתְנַשֵּׂא עוֹד
  choice: फिर कभी अपने आपको ... ऊँचा नहीं उठाएगा
  rationale: क्रिया आत्म-उत्थान और निष्क्रिय रूप से ऊँचा किए जाने—दोनों की संभावना रखती है; राष्ट्रीय अभिमान के प्रसंग में आत्म-उत्थान मुख्य पाठ में उपयुक्त है, जबकि दूसरा अर्थ पादटिप्पणी में सुरक्षित है।
- source_word: עַל הַגּוֹיִם
  choice: जातियों से ऊँचा
  rationale: ऊँचा उठने की क्रिया के साथ עַל तुलनात्मक श्रेष्ठता दर्शाता है। हिन्दी में 'जातियों से ऊँचा' इस अर्थ को स्पष्ट करता है और आगे आने वाले शासन से अलग रखता है।
- source_word: וְהִמְעַטְתִּים
  choice: मैं उन्हें घटा दूँगा
  rationale: מעט के हिफ़ील रूप का अर्थ छोटा या कम करना है। बहुवचन प्रत्यय मिस्र के लोगों अथवा उसकी सामूहिक शक्ति की ओर संकेत करता है; 'उन्हें घटा दूँगा' इस व्यापकता को बनाए रखता है।
- source_word: לְבִלְתִּי רְדוֹת
  choice: ताकि वे ... शासन न करें
  rationale: לְבִלְתִּי उद्देश्य अथवा रोके गए परिणाम को और רדה प्रभुत्व/शासन को व्यक्त करता है।
- source_word: בַּגּוֹיִם
  choice: जातियों पर
  rationale: ב का शाब्दिक अर्थ 'में/के बीच' हो सकता है, पर רדה के साथ यहाँ प्रभुत्व का संबंध है; स्वाभाविक हिन्दी में 'शासन करना' के साथ 'पर' प्रयुक्त होता है।
theological_decisions:
- issue: मिस्र के लिए एकवचन से बहुवचन की ओर परिवर्तन
  choice: एकवचन 'वह' के बाद बहुवचन 'उन्हें/वे' रखा गया
  alternative: पूरे पद में एकवचन रखकर मिस्र को ही कर्ता बनाना
  rationale: इब्रानी पाठ स्वयं מִצְרַיִם/राज्य को एकवचन रूप में प्रस्तुत करने के बाद बहुवचन प्रत्यय और क्रिया का प्रयोग करता है। यह मिस्र के लोगों या उसकी सामूहिक शक्ति की ओर संकेत कर सकता है; व्याकरणिक तनाव को समतल नहीं किया गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सहज रखी गई है। 'जातियाँ' नबी-साहित्य में הַגּוֹיִם के लिए परिचित शब्द है। मुख्य पाठ में आत्म-अभिमान का भाव स्पष्ट किया गया है, जबकि क्रिया की वास्तविक निष्क्रिय संभावना पादटिप्पणी में सुरक्षित है। सभी पादटिप्पणी-चिह्न संबद्ध पदांशों के तुरंत बाद रखे गए हैं।
