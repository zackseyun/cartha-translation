  text: וַ/יְהִ֗י בְּ/עֶשְׂרִ֤ים וָ/שֶׁ֨בַע֙ שָׁנָ֔ה בָּֽ/רִאשׁ֖וֹן בְּ/אֶחָ֣ד לַ/חֹ֑דֶשׁ הָיָ֥ה דְבַר יְהוָ֖ה אֵלַ֥/י לֵ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/029/017.yaml
  text: And it happened in the twenty-seventh year[a], in the first month, on the first day of the month, that the word of Yahweh came to me, saying,
translation:
  language: hi
  text: 'सत्ताईसवें वर्ष के पहले महीने के पहले दिन ऐसा हुआ कि याहवे का वचन मेरे पास आया:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: आया
  rationale: दिनांकित भविष्यवाणी की सूचना आरम्भ करने वाला कथात्मक रूप है। हिन्दी में अलग से ‘और ऐसा हुआ’ जोड़ने के बजाय मुख्य कथन ‘वचन मेरे पास आया’ में इसकी कथात्मक शक्ति स्वाभाविक रूप से समाहित होती है।
- source_word: בְּעֶשְׂרִים וָשֶׁבַע שָׁנָה
  choice: सत्ताईसवें वर्ष में
  rationale: इब्रानी कालगणना-सूत्र को आधुनिक हिन्दी में स्वाभाविक क्रमसूचक रूप में व्यक्त किया गया है।
- source_word: בָּרִאשׁוֹן
  choice: पहले महीने
  rationale: मूल में यहाँ ‘महीना’ दोहराया नहीं गया, पर दिनांक-सूत्र में इसका अर्थ स्पष्ट है; हिन्दी में स्पष्टता के लिए इसे व्यक्त करना आवश्यक है।
- source_word: בְּאֶחָד לַחֹדֶשׁ
  choice: महीने के पहले दिन
  rationale: शाब्दिक रूप ‘महीने के एक में’ इब्रानी मुहावरा है, जिसका अर्थ महीने का पहला दिन है।
- source_word: הָיָה דְבַר יְהוָה אֵלַי
  choice: यहोवा का वचन मेरे पास आया
  rationale: यह मानक भविष्यसूचक सूत्र है; ‘मेरे पास आया’ हिन्दी में प्रकाशना की घटना को स्वाभाविक और स्पष्ट रूप से व्यक्त करता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: इब्रानी व्यक्तिवाचक नाम को हिन्दी में प्रचलित लिप्यंतरण ‘यहोवा’ से दिया गया है, किसी उपाधि से प्रतिस्थापित नहीं किया गया।
- source_word: לֵאמֹר
  choice: ':'
  rationale: यह रूप आगे आने वाले सीधे कथन का परिचय देता है। आधुनिक हिन्दी में पद के अंत का द्विबिंदु उसी कार्य को अधिक स्वाभाविक ढंग से करता है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल का व्यक्तिगत ईश्वरीय नाम सुरक्षित रखा गया है। आधुनिक हिन्दी बाइबलीय प्रयोग में ‘यहोवा’ अधिक परिचित रूप है; ‘याहवे’ मूल उच्चारण के निकट माना जाने वाला वैकल्पिक लिप्यंतरण है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सहज हिन्दी। दिनांक-सूत्र को हिन्दी के स्वाभाविक क्रम में रखा गया है और अगले पद में आने वाली वाणी के लिए द्विबिंदु लगाया गया है।
