  text: וְ/נָתַתִּ֣י אֶת אֶרֶץ֩ מִצְרַ֨יִם שְׁמָמָ֜ה בְּ/ת֣וֹךְ אֲרָצ֣וֹת נְשַׁמּ֗וֹת וְ/עָרֶ֨י/הָ֙ בְּ/ת֨וֹךְ עָרִ֤ים מָֽחֳרָבוֹת֙ תִּֽהְיֶ֣יןָ שְׁמָמָ֔ה אַרְבָּעִ֖ים שָׁנָ֑ה וַ/הֲפִצֹתִ֤י אֶת מִצְרַ֨יִם֙ בַּ/גּוֹיִ֔ם וְֽ/זֵרִיתִ֖י/ם בָּ/אֲרָצֽוֹת־׀־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/029/012.yaml
  text: And I will make the land of Egypt a desolation among desolated lands[a], and her cities will be a desolation among ruined cities for forty years[b]; and I will scatter Egypt among the nations and disperse them through the lands.
translation:
  language: hi
  text: मैं मिस्र देश को उजड़े हुए देशों के बीच उजाड़ बना दूँगा[a], और उसके नगर ध्वस्त नगरों के बीच चालीस वर्ष तक उजाड़ पड़े रहेंगे। मैं मिस्र को राष्ट्रों के बीच तितर-बितर कर दूँगा और उन्हें[b] देशों में बिखेर दूँगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'हिब्रू में यहाँ “उजाड़” और “ध्वस्त” के लिए निकट अर्थ वाले शब्द समानांतर वाक्यांशों में आए हैं। वैकल्पिक अनुवाद: “उजड़े हुए देशों के बीच” और “ध्वस्त नगरों के बीच।”'
    reason: lexical_alternative
  - marker: b
    text: अर्थात मिस्र के लोग। हिब्रू में पहले स्थान-नाम “मिस्र” है और फिर उसके लिए बहुवचन “उन्हें” आता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתִּי אֶת אֶרֶץ מִצְרַיִם שְׁמָמָה
  choice: मैं मिस्र देश को ... उजाड़ बना दूँगा
  rationale: נתן के साथ שְׁמָמָה यहाँ किसी वस्तु को एक दशा में कर देने का अर्थ देता है। “उजाड़ बना दूँगा” इस कारक भाव को स्वाभाविक हिन्दी में व्यक्त करता है और “मिस्र देश” क्षेत्रीय बल को बनाए रखता है।
- source_word: בְּתוֹךְ אֲרָצוֹת נְשַׁמּוֹת
  choice: उजड़े हुए देशों के बीच
  rationale: בְּתוֹךְ का स्थानवाचक भाव “के बीच” से स्पष्ट होता है; נְשַׁמּוֹת का परिणामगत भाव “उजड़े हुए” में बना रहता है।
- source_word: וְעָרֶיהָ ... תִּהְיֶיןָ שְׁמָמָה
  choice: उसके नगर ... उजाड़ पड़े रहेंगे
  rationale: हिब्रू में देश के लिए स्त्रीलिंग प्रत्यय है, पर आधुनिक हिन्दी में “उसके” स्वाभाविक है। “उजाड़ पड़े रहेंगे” היה और अवस्था-संज्ञा שְׁמָמָה के दीर्घकालीन परिणाम को सहज रूप से व्यक्त करता है।
- source_word: עָרִים מָחֳרָבוֹת
  choice: खंडहर हुए नगर
  rationale: מָחֳרָבוֹת ध्वस्त या बरबाद नगरों को सूचित करता है। “खंडहर हुए” विनाश की ठोस छवि देता है और निकटवर्ती שְׁמָמָה से शब्दगत अंतर भी बनाए रखता है।
- source_word: אַרְבָּעִים שָׁנָה
  choice: चालीस वर्ष तक
  rationale: अवधि को आधुनिक हिन्दी में स्पष्ट और सीधा रखा गया है।
- source_word: וַהֲפִצֹתִי אֶת מִצְרַיִם בַּגּוֹיִם
  choice: मैं मिस्र को राष्ट्रों में तितर-बितर कर दूँगा
  rationale: מִצְרַיִם को स्थान/राष्ट्र-नाम के रूप में बनाए रखा गया है, जबकि פוץ के कारक रूप को “तितर-बितर कर दूँगा” व्यक्त करता है।
- source_word: וְזֵרִיתִים בָּאֲרָצוֹת
  choice: और उन्हें विभिन्न देशों में बिखेर दूँगा
  rationale: זרה का बिखेरने का भाव समानांतर क्रिया से मेल खाता है। “विभिन्न” हिन्दी में बहुवचन देशों में फैलाव को स्वाभाविक बनाता है, यद्यपि उसका पृथक शब्द हिब्रू में नहीं है।
theological_decisions:
- issue: बिखेरे जाने वाले “मिस्र” का आशय
  choice: मुख्य पाठ में “मिस्र” रखा गया है और अगली क्रिया में “उन्हें” आया है।
  alternative: दोनों स्थानों पर स्पष्ट रूप से “मिस्रियों” कहना।
  rationale: हिब्रू पहले स्थान-नाम מִצְרַיִם प्रयोग करता है और फिर बहुवचन कर्म-प्रत्यय से वहाँ के लोगों की ओर संकेत करता है। अनुवाद इसी व्याकरणिक और अर्थगत बदलाव को बिना चुपचाप स्पष्ट किए सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। भविष्यकाल भविष्यवाणी-संबंधी दैवी घोषणा को व्यक्त करता है। “उजाड़,” “खंडहर,” “तितर-बितर” और “बिखेर” मूल के समानांतर लेकिन अलग शब्दों के प्रभाव को हिन्दी में बनाए रखते हैं।
