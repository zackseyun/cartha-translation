base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/029/004.yaml
  text: I will put hooks in your jaws[a], and I will make the fish of your Nile channels cling to your scales; and I will bring you up from the midst of your Nile channels[b], and all the fish of your Nile channels will cling to your scales.
translation:
  language: hi
  text: मैं तेरे जबड़ों[a] में काँटे डालूँगा और तेरी नील नदी की धाराओं[b] की मछलियों को तेरे शल्कों से चिपका दूँगा। फिर मैं तुझे तेरी नील नदी की धाराओं के बीच से ऊपर निकाल लाऊँगा, और तेरी नील नदी की धाराओं की सभी मछलियाँ तेरे शल्कों से चिपकी रहेंगी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘तेरे गालों में।’ इब्रानी शब्द का अर्थ ‘जबड़ा’ या ‘गाल’ हो सकता है; यहाँ नदी के विशाल जीव का चित्र होने के कारण ‘जबड़ों’ रखा गया है।
    reason: lexical_alternative
  - marker: b
    text: या ‘तेरी नदियों’ अथवा ‘तेरी नहरों।’ मिस्र से जुड़े प्रसंगों में इब्रानी शब्द नील नदी और उसकी जलधाराओं को सूचित करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: חחיים
  choice: काँटे
  rationale: यह शब्द किसी जीव को पकड़ने और खींचने के लिए उसके जबड़ों में लगाए जाने वाले काँटों को दर्शाता है। फिरौन को विशाल नदी-जीव के रूप में चित्रित किए जाने के कारण ‘काँटे’ स्वाभाविक और चित्रानुकूल है।
- source_word: בִּלְחָיֶיךָ
  choice: तेरे जबड़ों में
  rationale: לְחִי का अर्थ ‘जबड़ा’ या ‘गाल’ हो सकता है। विशाल नदी-जीव के मुँह में काँटे डालकर उसे पकड़ने के इस चित्र में ‘जबड़े’ अधिक उपयुक्त है।
- source_word: וְהִדְבַּקְתִּי
  choice: चिपका दूँगा
  rationale: 'דבק के हिफ़ील रूप का कारणवाचक भाव सुरक्षित रहता है: परमेश्वर मछलियों को उस जीव के शल्कों से चिपकाता है।'
- source_word: דְגַת
  choice: मछलियों
  rationale: इब्रानी में यह समूहवाचक एकवचन है और अगले पद के साथ संबंध रूप में आता है; हिन्दी में बहुवचन अधिक स्वाभाविक है।
- source_word: יְאֹרֶיךָ
  choice: तेरी नील नदी की धाराओं
  rationale: मिस्र-संबंधी प्रसंगों में יְאֹר नील नदी और उससे जुड़ी जलधाराओं या नहरों को सूचित करता है। यह अनुवाद मिस्री संदर्भ और इब्रानी बहुवचन दोनों को व्यक्त करता है।
- source_word: בְּקַשְׂקְשֹׂתֶיךָ
  choice: तेरे शल्कों से
  rationale: דבק के साथ लगा संबंधसूचक उपसर्ग लगाव को व्यक्त करता है; ‘शल्कों से चिपकना’ हिन्दी में स्वाभाविक है।
- source_word: וְהַעֲלִיתִיךָ
  choice: मैं तुझे ... ऊपर निकाल लाऊँगा
  rationale: עלה का हिफ़ील रूप ऊपर लाने या निकालने का कारणवाचक अर्थ देता है। यह अभिव्यक्ति जल के भीतर से जीव को बाहर लाने का चित्र स्पष्ट करती है, पर प्रक्रिया को अनावश्यक रूप से सीमित नहीं करती।
- source_word: מִתּוֹךְ
  choice: के बीच से
  rationale: यह नील की धाराओं के भीतर से निकाले जाने पर बल देता है और हिन्दी में सहज है।
- source_word: תִּדְבָּק
  choice: चिपकी रहेंगी
  rationale: यहाँ क़ाल रूप समूहवाचक ‘मछली’ से मेल खाता है। हिन्दी में बहुवचन ‘सभी मछलियाँ ... चिपकी रहेंगी’ अर्थ को स्वाभाविक रूप से व्यक्त करता है।
