source:
  edition: WLC
  text: וְ/יָֽדְעוּ֙ כָּל יֹשְׁבֵ֣י מִצְרַ֔יִם כִּ֖י אֲנִ֣י יְהוָ֑ה יַ֧עַן הֱיוֹתָ֛/ם מִשְׁעֶ֥נֶת קָנֶ֖ה לְ/בֵ֥ית יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/029/006.yaml
  text: Then all the inhabitants of Egypt will know that I am Yahweh[a], because they were a staff of reed to the house of Israel.
translation:
  language: hi
  text: तब मिस्र के सभी निवासी जान लेंगे कि मैं यहोवा हूँ, क्योंकि वे इस्राएल के घराने के लिए सरकंडे की लाठी थे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְיָדְעוּ
  choice: तब ... जान लेंगे
  rationale: भविष्यद्वाणी के इस संदर्भ में वाव परिणाम अथवा आगे की घटना को व्यक्त करता है; ‘तब’ उस क्रम को स्वाभाविक हिन्दी में स्पष्ट करता है।
- source_word: כָּל יֹשְׁבֵי מִצְרַיִם
  choice: मिस्र के सभी निवासी
  rationale: यह मूल के ‘मिस्र में रहने वाले सभी लोगों’ के सामूहिक अर्थ को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: כִּי אֲנִי יְהוָה
  choice: कि मैं यहोवा हूँ
  rationale: यहेजकेल में बार-बार आने वाले पहचान-सूत्र को सुरक्षित रखा गया है और परमेश्वर के व्यक्तिगत वाचा-नाम को ‘यहोवा’ रूप में लिखा गया है।
- source_word: יַעַן הֱיוֹתָם
  choice: क्योंकि वे ... थे
  rationale: יַעַן कारण बताता है, और प्रत्यययुक्त क्रियार्थक संज्ञा को हिन्दी में स्वाभाविक सीमित उपवाक्य के रूप में प्रस्तुत किया गया है।
- source_word: מִשְׁעֶנֶת קָנֶה
  choice: सरकंडे की टेक
  rationale: מִשְׁעֶנֶת ऐसी वस्तु है जिस पर सहारे के लिए टिका जाता है, जबकि קָנֶה सरकंडा है। यह चयन मूल रूपक और अगले पद में उसके टूटने की छवि दोनों को बनाए रखता है।
- source_word: לְבֵית יִשְׂרָאֵל
  choice: इस्राएल के घराने के लिए
  rationale: לְ संबंध अथवा लाभार्थी को सूचित करता है; ‘के लिए’ सहज हिन्दी है और ‘इस्राएल का घराना’ मूल सामुदायिक-वाचागत पदबंध को सुरक्षित रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का रूप
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ में चतुरक्षरीय व्यक्तिगत नाम सीधे आया है। हिन्दी में व्यापक रूप से पहचाने जाने वाले ‘यहोवा’ रूप से नाम को सामान्य उपाधि में बदले बिना सुरक्षित रखा गया है।
- issue: मिस्र के सहारे का रूपक
  choice: सरकंडे की टेक
  alternative: सरकंडे की लाठी
  rationale: ‘टेक’ सहारे के कार्य को प्रमुख रखती है और मिस्र को निर्जीव वस्तु के रूप में प्रस्तुत करने वाले मूल रूपक को बिना व्याख्यात्मक विस्तार के बनाए रखती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘घराना’ बाइबलीय सामुदायिक अभिव्यक्ति को बनाए रखता है, जबकि ‘सरकंडे की टेक’ मूल चित्रात्मकता को संक्षिप्त और स्वाभाविक हिन्दी में व्यक्त करती है।
