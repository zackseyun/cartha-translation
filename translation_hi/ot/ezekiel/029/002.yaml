  text: “हे मनुष्य-पुत्र[a], अपना मुख मिस्र के राजा फ़िरौन के विरुद्ध कर और उसके तथा सारे मिस्र के विरुद्ध भविष्यवाणी कर।”
  philosophy: optimal-equivalence
  footnotes:
