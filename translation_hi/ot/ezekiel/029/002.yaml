  rationale: सम्बन्धवाचक रचना का स्वाभाविक हिन्दी रूप, जो फ़िरौन की पहचान बताता है।
- source_word: וְהִנָּבֵא
  choice: और ... भविष्यवाणी कर
  rationale: נבא के निफ़अल आज्ञार्थक का मानक और सटीक हिन्दी अनुवाद, जो भविष्यद्वक्ताई आदेश की भाषा बनाए रखता है।
- source_word: עָלָיו
  choice: उसके ... विरुद्ध
  rationale: न्याय-वचन के संदर्भ में यह फ़िरौन के विरोध में कही जाने वाली भविष्यवाणी को दर्शाता है।
- source_word: מִצְרַיִם כֻּלָּהּ
  choice: सारे मिस्र
  rationale: यह पूरे देश/राष्ट्र को समेटने वाली כֻּלָּהּ की व्यापकता को संक्षेप और स्वाभाविक ढंग से व्यक्त करता है।
theological_decisions:
- issue: בֶּן אָדָם संबोधन का अर्थ
  choice: मनुष्य के पुत्र
  alternative: हे नश्वर मनुष्य / हे मानव
  rationale: मुख्य पाठ में पारंपरिक, रूप-संगत संबोधन रखा गया है, जबकि पाद-टिप्पणी उसके नश्वर मानव होने पर बल देने वाले वैकल्पिक अर्थ को सुरक्षित रखती है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। एकवचन पुल्लिंग आज्ञार्थक रूप मूल संबोधन के अनुरूप हैं; भविष्यद्वक्ताई मुहावरे का दृश्यात्मक बिंब यथासंभव सुरक्षित रखा गया है।
