    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן אָדָם
  choice: मनुष्य के पुत्र
  rationale: यहेजकेल के लिए बार-बार प्रयुक्त इब्रानी संबोधन का पारंपरिक और रूप-संगत अनुवाद; यह पुल्लिंग एकवचन और भविष्यद्वक्ताई मुहावरे को बनाए रखता है।
- source_word: שִׂים פָּנֶיךָ
  choice: अपना मुँह ... के विरुद्ध कर
