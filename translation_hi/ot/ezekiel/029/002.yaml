- source_word: עַל
  choice: के विरुद्ध
  rationale: न्याय की इस भविष्यवाणी के संदर्भ में पूर्वसर्ग का अर्थ केवल विषय-संबंधी नहीं, बल्कि विरोधात्मक है।
