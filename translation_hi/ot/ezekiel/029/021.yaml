source:
  edition: WLC
  text: בַּ/יּ֣וֹם הַ/ה֗וּא אַצְמִ֤יחַ קֶ֨רֶן֙ לְ/בֵ֣ית יִשְׂרָאֵ֔ל וּ/לְ/ךָ֛ אֶתֵּ֥ן פִּתְחֽוֹן פֶּ֖ה בְּ/תוֹכָ֑/ם וְ/יָדְע֖וּ כִּי אֲנִ֥י יְהוָֽה־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/029/021.yaml
  text: On that day I will cause a horn to sprout for the house of Israel[a], and I will give you an opening of the mouth among them[b], and they will know that I am Yahweh.
translation:
  language: hi
  text: उस दिन मैं इस्राएल के घराने के लिए एक सींग उगा दूँगा[a], और मैं तुम्हें उनके बीच बोलने का अवसर दूँगा[b]। और वे जानेंगे कि मैं याहवे हूँ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “एक सींग बढ़ाऊँगा”—अर्थात इस्राएल के घराने के लिए सामर्थ्य या सम्मान खड़ा करूँगा।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से “मुँह का खुलना दूँगा।” यह इब्रानी मुहावरा बोलने की क्षमता या अनुमति दिए जाने का संकेत करता है और सम्भवतः यहेजकेल की पहले सीमित की गई वाणी की ओर फिर संकेत करता है।
    reason: cultural_note
lexical_decisions:
- source_word: בַּיּוֹם הַהוּא
  choice: उस दिन
  rationale: यह भविष्यसूचक समय-सूचक वाक्यांश का स्वाभाविक और सीधा हिन्दी रूप है।
- source_word: אַצְמִיחַ
  choice: उगा दूँगा
  rationale: हिफ़ील रूप की कारणवाचकता को व्यक्त करता है और अंकुरित होने अथवा बढ़ने के मूल रूपक को बनाए रखता है।
- source_word: קֶרֶן
  choice: सींग
  rationale: मूल ठोस रूपक को सुरक्षित रखता है; यहाँ सींग सामर्थ्य, प्रतिष्ठा या उत्कर्ष का संकेत हो सकता है, पर मुख्य पाठ में उसका अर्थ सीमित नहीं किया गया।
- source_word: לְבֵית יִשְׂרָאֵל
  choice: इस्राएल के घराने के लिए
  rationale: ‘इस्राएल के घराने’ की सामुदायिक और वाचागत अभिव्यक्ति को केवल ‘इस्राएल’ में संक्षिप्त नहीं करता।
- source_word: פִּתְחוֹן פֶּה
  choice: बोलने का अवसर
  rationale: शाब्दिक ‘मुँह का खुलना’ हिन्दी में अस्वाभाविक है; यह रूप बोलने की दी गई अनुमति या क्षमता को स्पष्ट करता है, जबकि मूल मुहावरा पादटिप्पणी में सुरक्षित है।
- source_word: בְּתוֹכָם
  choice: उनके बीच
  rationale: सामुदायिक परिवेश को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: וְיָדְעוּ
  choice: तब वे जानेंगे
  rationale: वाक्य में परिणाम का स्वाभाविक सम्बन्ध स्पष्ट करता है; ‘वे’ का संकेत सन्दर्भ में इस्राएल के लोगों की ओर है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी परमेश्वर-नाम का हिन्दी लिप्यंतरण है; इसे किसी उपाधि से प्रतिस्थापित नहीं किया गया।
theological_decisions:
- issue: ‘सींग’ के रूपक का आशय
  choice: मुख्य पाठ में ‘सींग’ का रूपक बनाए रखा गया है।
  alternative: इसे ‘सामर्थ्य’, ‘शक्ति’ या किसी निश्चित मसीही व्यक्ति के रूप में स्पष्ट करना।
  rationale: यह रूपक सामर्थ्य, सम्मान या पुनर्स्थापित उत्कर्ष का बोध करा सकता है, लेकिन यह पद स्वयं किसी एक विशिष्ट पहचान को अनिवार्य नहीं करता।
- issue: यहेजकेल को פִּתְחוֹן פֶּה दिया जाना
  choice: इसे ‘बोलने का अवसर’ कहा गया है, बिना यह निश्चित किए कि यह स्थायी रूप से गूँगापन दूर होना था या किसी विशेष भविष्यसूचक अवसर का मिलना।
  alternative: ‘वाणी की स्वतंत्रता’, ‘निर्भीक वाणी’ या शाब्दिक ‘मुँह का खुलना’।
  rationale: यह वाक्यांश यहेजकेल की पहले सीमित की गई वाणी की ओर संकेत कर सकता है, पर पद उसकी ठीक अवधि या रीति स्पष्ट नहीं करता।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘सींग’ जैसे मूल भविष्यसूचक रूपक को मुख्य पाठ में सुरक्षित रखा गया है, जबकि कठिन इब्रानी मुहावरे को स्वाभाविक हिन्दी में अर्थानुसार व्यक्त करके उसका शाब्दिक रूप पादटिप्पणी में दिया गया है।
