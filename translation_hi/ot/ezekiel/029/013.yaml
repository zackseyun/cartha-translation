language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: כִּ֛י כֹּ֥ה אָמַ֖ר אֲדֹנָ֣/י יְהוִ֑ה מִ/קֵּ֞ץ אַרְבָּעִ֤ים שָׁנָה֙ אֲקַבֵּ֣ץ אֶת מִצְרַ֔יִם מִן הָ/עַמִּ֖ים אֲשֶׁר נָפֹ֥צוּ שָֽׁמָּ/ה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/029/013.yaml
  text: 'For thus says the Lord GOD: At the end of forty years I will gather Egypt from the peoples among whom they were scattered[a].'
translation:
  language: hi
  text: 'क्योंकि प्रभु याहवे यों कहते हैं: चालीस वर्ष पूरे होने पर मैं मिस्र को उन लोगों में से इकट्ठा करूँगा, जिनके बीच उसके लोग तितर-बितर किए गए थे।[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “उन लोगों/जनसमुदायों में से”; “उन राष्ट्रों में से” भी संभव है।
    reason: עַמִּים का मूल अर्थ ‘लोग/जनसमुदाय’ है; ‘राष्ट्र’ एक संभावित संदर्भानुकूल विकल्प है।
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले कथन का कारण या आधार प्रस्तुत करता है और इब्रानी संयोजक का स्वाभाविक हिन्दी रूप है।
- source_word: כֹּה אָמַר
  choice: यों कहते हैं
  rationale: यह भविष्यद्वक्ताओं का मानक संदेशवाहक सूत्र है; वर्तमानकालीन रूप इब्रानी पूर्ण क्रिया के घोषणात्मक बल को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: אֲדֹנָי יְהוִה
  choice: प्रभु यहोवा
  rationale: दोनों पदों को अलग-अलग बनाए रखता है और वाचा के व्यक्तिगत नाम יהוה को प्रचलित हिन्दी रूप ‘यहोवा’ से व्यक्त करता है।
- source_word: מִקֵּץ אַרְבָּעִים שָׁנָה
  choice: चालीस वर्ष पूरे होने पर
  rationale: अवधि की समाप्ति का अर्थ ठीक और सहज हिन्दी में व्यक्त होता है।
- source_word: אֲקַבֵּץ
  choice: मैं ... इकट्ठा करूँगा
  rationale: קבץ बिखरे हुए लोगों को फिर एकत्र करने को दर्शाता है; यह सीधा और बोधगम्य अनुवाद है।
- source_word: אֶת מִצְרַיִם
  choice: मिस्र को
  rationale: इब्रानी में देश का नाम सामूहिक रूप से उसके लोगों के लिए प्रयुक्त है; ‘मिस्र’ इस रूपक को बनाए रखता है।
- source_word: מִן הָעַמִּים
  choice: उन जातियों के बीच से
  rationale: עַמִּים का बहुवचन ‘जातियाँ’ आधुनिक हिन्दी में जनसमुदायों के अर्थ को स्वाभाविक रूप से व्यक्त करता है; ‘बीच से’ מן और अगले संबंधवाचक उपवाक्य के स्थानगत संबंध को स्पष्ट करता है।
- source_word: אֲשֶׁר נָפֹצוּ שָׁמָּה
  choice: जिनके बीच वे तितर-बितर किए गए थे
  rationale: बहुवचन क्रिया मिस्र के लोगों की ओर अर्थानुसार संकेत करती है; निफ़अल का कर्मवाच्य बल और שָׁמָּה का स्थानगत अर्थ सुरक्षित रखा गया है।
theological_decisions:
- issue: संयुक्त उपाधि אֲדֹנָי יְהוִה में परमेश्वर के नाम का अनुवाद
  choice: प्रभु यहोवा
  alternative: प्रभु याहवे
  rationale: יהוה को केवल पदवी में बदलने के बजाय व्यक्तिगत वाचा-नाम के रूप में रखा गया है। ‘यहोवा’ हिन्दी बाइबल-पाठकों में व्यापक और गरिमापूर्ण रूप है, जबकि ‘याहवे’ उच्चारण की एक अन्य विद्वतापूर्ण पुनर्रचना है।
- issue: ‘मिस्र’ के लिए बहुवचन सर्वनाम
  choice: वे
  alternative: वह
  rationale: מִצְרַיִם व्याकरणतः देश का नाम है, पर נָפֹצוּ बहुवचन है और बिखेरे गए मिस्रियों को सामूहिक रूप से इंगित करता है। हिन्दी में ‘वे’ इस वास्तविक बहुवचन संकेत और देश-से-लोग लक्षणा दोनों को बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण भविष्यद्वक्तीय शैली रखी गई है। ‘यों कहते हैं’ सूत्रात्मक भाषा को सुरक्षित रखता है, जबकि शेष वाक्य साधारण पाठक के लिए स्पष्ट और सहज है।
