source:
  edition: WLC
  text: דַּבֵּ֨ר וְ/אָמַרְתָּ֜ כֹּֽה אָמַ֣ר אֲדֹנָ֣/י יְהוִ֗ה הִנְ/נִ֤י עָלֶ֨י/ךָ֙ פַּרְעֹ֣ה מֶֽלֶךְ מִצְרַ֔יִם הַ/תַּנִּים֙ הַ/גָּד֔וֹל הָ/רֹבֵ֖ץ בְּ/ת֣וֹךְ יְאֹרָ֑י/ו אֲשֶׁ֥ר אָמַ֛ר לִ֥/י יְאֹרִ֖/י וַ/אֲנִ֥י עֲשִׂיתִֽ/נִי־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/029/003.yaml
  text: 'Speak and say[a], ‘Thus says the Lord GOD: Behold, I am against you, Pharaoh king of Egypt, the great sea monster lying in the midst of his Nile channels, who says, “My Nile is mine[b], and I made myself.”’'
translation:
  language: hi
  text: 'बोल और कह, ‘प्रभु याहवे यह कहते हैं: देख, हे मिस्र के राजा फ़िरौन, मैं तेरे विरुद्ध हूँ—तू विशाल जल-दैत्य[a] है, जो अपनी नील की धाराओं के बीच पसरा हुआ है और कहता है, “मेरी नील नदी मेरी ही है[b], और मैंने अपने आप को बनाया है।”’'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “विशाल अजगर”; इस प्रसंग में यह बिंब नील के मगरमच्छ-जैसे किसी विशाल प्राणी की ओर भी संकेत कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: 'इस कथन का अनुवाद यह भी हो सकता है: “नील नदी मेरी है, और मैंने उसे अपने लिए बनाया है।” इब्रानी में फ़िरौन का घमंड या तो नील पर अपने अधिकार और उसके निर्माण का दावा हो सकता है, या अपने आपको बनाने का दावा।'
    reason: alternative_reading
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  choice: प्रभु याहवे
  rationale: संयुक्त ईश्वरीय उपाधि में אֲדֹנָי को ‘प्रभु’ और वाचा के नाम יהוה को ‘याहवे’ रखा गया है; इससे दोनों पदों का भेद बना रहता है।
- source_word: הִנְנִי עָלֶיךָ
  choice: देख, ... मैं तेरे विरुद्ध हूँ
  rationale: הִנְנִי की जोरदार भविष्यद्वक्ताई घोषणा को ‘देख’ और עַל के विरोधात्मक अर्थ को ‘विरुद्ध’ से व्यक्त किया गया है।
- source_word: הַתַּנִּים הַגָּדוֹל
  choice: विशाल जल-दैत्य
  rationale: תַּנִּים एक विशाल सरीसृप अथवा पौराणिक जल-प्राणी का बिंब दे सकता है। ‘जल-दैत्य’ नील के प्रसंग को बनाए रखते हुए इसे केवल मगरमच्छ मान लेने से बचता है।
- source_word: הָרֹבֵץ
  choice: पड़ा रहता है
  rationale: רבץ का मूल भाव लेटे या पसरे रहने का है; वर्तमान कृदंत की निरंतरता को ‘रहता है’ से दिखाया गया है।
- source_word: בְּתוֹךְ יְאֹרָיו
  choice: अपनी नील-धाराओं के बीच
  rationale: मिस्री संदर्भ में יְאֹרָיו नील नदी की अनेक धाराओं या नहरों को सूचित करता है; संबंधवाचक प्रत्यय को ‘अपनी’ से व्यक्त किया गया है।
- source_word: לִי יְאֹרִי
  choice: मेरी नील नदी मेरी ही है
  rationale: दोहरी स्वामित्व-अभिव्यक्ति को जानबूझकर बनाए रखा गया है, क्योंकि यह फ़िरौन के अहंकारी दावे पर बल देती है।
- source_word: וַאֲנִי עֲשִׂיתִנִי
  choice: और मैंने अपने आप को बनाया है
  rationale: क्रिया पर प्रथम पुरुष एकवचन कर्म-प्रत्यय का सीधा अर्थ आत्म-निर्माण का दावा है। असामान्य किंतु महत्वपूर्ण कथन को मुख्य पाठ में सुरक्षित रखा गया है।
theological_decisions:
- issue: संयुक्त उपाधि אֲדֹנָי יְהוִה में ईश्वरीय नाम का रूप
  choice: प्रभु याहवे
  alternative: प्रभु परमेश्वर
  rationale: मूल में वाचा का व्यक्तिगत नाम स्पष्ट रूप से आया है; लिप्यंतरण उसे सामान्य उपाधि में बदलने से बचाता है।
- issue: फ़िरौन के कथन וַאֲנִי עֲשִׂיתִנִי का आशय
  choice: 'फ़िरौन का दावा: ‘मैंने अपने आप को बनाया है’'
  alternative: 'फ़िरौन का दावा: ‘मैंने नील को अपने लिए बनाया है’'
  rationale: मसोरेटी पाठ का प्रथम पुरुष कर्म-प्रत्यय मुख्यतः आत्म-निर्माण के अर्थ का समर्थन करता है, पर नदी को अपने लिए बनाने वाला पाठार्थ भी संभव माना गया है और पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और भविष्यद्वक्ताई घोषणा के अनुकूल रखी गई है। फ़िरौन को सीधे संबोधन में ‘तेरे/तू’ मूल के एकवचन संबोधन और टकराव की तीव्रता को बनाए रखते हैं। ‘नील-धाराएँ’ मिस्री नदी-तंत्र को स्वाभाविक हिंदी में स्पष्ट करती हैं।
