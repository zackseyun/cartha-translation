source:
  edition: WLC
  text: לֹ֤א תַעֲבָר בָּ/הּ֙ רֶ֣גֶל אָדָ֔ם וְ/רֶ֥גֶל בְּהֵמָ֖ה לֹ֣א תַעֲבָר בָּ֑/הּ וְ/לֹ֥א תֵשֵׁ֖ב אַרְבָּעִ֥ים שָׁנָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/029/011.yaml
  text: No human foot will pass through it[a], and no animal foot will pass through it; and it will not be inhabited for forty years.
translation:
  language: hi
  text: न किसी मनुष्य का पाँव उसमें से गुज़रेगा, न किसी पशु का पाँव उसमें से गुज़रेगा; और वह चालीस वर्ष तक आबाद नहीं होगी।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תַעֲבָר בָּהּ
  choice: उसमें से ... गुज़रेगा
  rationale: עבר के साथ ב यहाँ किसी भूभाग में से होकर जाने का भाव देता है। यह चयन देश से होकर आवागमन की छवि को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: רֶגֶל אָדָם
  choice: किसी मनुष्य का पाँव
  rationale: शाब्दिक चित्र ‘मनुष्य का पाँव’ है और आशय किसी भी मनुष्य के आवागमन से है। ‘किसी’ जोड़ने से सामान्य निषेध आधुनिक हिन्दी में स्पष्ट होता है, जबकि एकवचन सामूहिक चित्र बना रहता है।
- source_word: רֶגֶל בְּהֵמָה
  choice: किसी पशु का पाँव
  rationale: यह पहले पद के समानांतर है। ‘पशु’ आधुनिक मानक हिन्दी में בְּהֵמָה के सामान्य अर्थ को स्पष्ट और गरिमापूर्ण ढंग से व्यक्त करता है।
- source_word: לֹא תֵשֵׁב
  choice: वह ... आबाद नहीं होगा
  rationale: भूमि या देश के विषय में ישב का अर्थ बसना अथवा आबाद होना है। सन्दर्भ में मिस्र देश पुल्लिंग है, इसलिए ‘वह आबाद नहीं होगा’ स्वाभाविक है।
- source_word: אַרְבָּעִים שָׁנָה
  choice: चालीस वर्ष तक
  rationale: यह अवधि बताने वाली सीधी अभिव्यक्ति है; ‘तक’ पूरे चालीस वर्षों की अवधि को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: सामान्य कथन में אָדָם का अनुवाद
  choice: मनुष्य, अर्थात किसी भी मानव के अर्थ में
  alternative: आदमी
  rationale: यहाँ कथन किसी पुरुष-विशेष तक सीमित नहीं, बल्कि हर मानव यात्री के विषय में है। ‘मनुष्य’ इस सामान्य और समावेशी आशय को ठीक रूप से रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; वाक्य गरिमापूर्ण और सामान्य पाठक के लिए सहज है। मूल की दो समानांतर ‘पाँव’ वाली अभिव्यक्तियाँ जानबूझकर सुरक्षित रखी गई हैं। कोई पादटिप्पणी आवश्यक नहीं, क्योंकि मुख्य पाठ स्वयं मूल चित्र को स्पष्ट रूप से प्रस्तुत करता है।
