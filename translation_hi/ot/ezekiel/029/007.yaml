source:
  edition: WLC
  text: בְּ/תָפְשָׂ֨/ם בְּ/ךָ֤ ב/כפ/ך תֵּר֔וֹץ וּ/בָקַעְתָּ֥ לָ/הֶ֖ם כָּל כָּתֵ֑ף וּ/בְ/הִֽשָּׁעֲנָ֤/ם עָלֶ֨י/ךָ֙ תִּשָּׁבֵ֔ר וְ/הַעֲמַדְתָּ֥ לָ/הֶ֖ם כָּל מָתְנָֽיִם־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/029/007.yaml
  text: When they took hold of you with their hand[a], you were crushed, and you split open every shoulder for them; and when they leaned on you, you were broken[b], and you made all their hips stand unsteadily.
translation:
  language: hi
  text: जब उन्होंने तुम्हें हाथ में पकड़ा,[a] तब तुम कुचल गए और तुमने उनका हर कंधा चीर दिया। जब वे तुम पर टिके, तब तुम टूट गए और तुमने उनकी हर कमर डगमगा दी।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी व्यंजनात्मक पाठ का शाब्दिक रूप ‘तुम्हारी हथेली में’ है; प्रसंग में आशय हाथ से सरकंडे को पकड़ने का है।
    reason: textual_difficulty
  - marker: b
    text: शाब्दिक रूप से ‘तुमने उनकी सारी कमरें खड़ी कर दीं।’ इस असामान्य इब्रानी अभिव्यक्ति का आशय संभवतः उन्हें डगमगा देना या अस्थिर कर देना है।
    reason: lexical_ambiguity
lexical_decisions:
- source_word: בְּתָפְשָׂם בְּךָ
  choice: जब उन्होंने तुम्हें ... पकड़ा
  rationale: ב के साथ infinitive construct समयसूचक उपवाक्य बनाता है। ‘पकड़ा’ सरकंडे को थामने का ठोस बिंब बनाए रखता है।
- source_word: בכפך
  choice: हाथ में
  rationale: व्यंजनात्मक पाठ में द्वितीय पुरुष एकवचन प्रत्यय के कारण शाब्दिक रूप ‘तुम्हारी हथेली में’ है, पर प्रसंग में लोग सरकंडे-समान मिस्र को हाथ में पकड़ते हैं। मुख्य पाठ में स्वाभाविक प्रासंगिक अर्थ रखा गया और पाठगत कठिनाई पाद-टिप्पणी में बताई गई है।
- source_word: תֵּרוֹץ
  choice: तुम कुचल गए
  rationale: רצץ का भाव कुचले या चूर किए जाने का है। ‘कुचल गए’ आगे आने वाले שׁבר से भेद भी बनाए रखता है।
- source_word: וּבָקַעְתָּ
  choice: तुमने ... चीर दिया
  rationale: בקע का मूल अर्थ फाड़ना, चीरना या खोलकर अलग करना है। टूटते सरकंडे से कंधा चिरने के हिंसक बिंब को यह स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: כָּל כָּתֵף
  choice: हर कंधा
  rationale: כָּתֵף का सीधा शारीरिक अर्थ ‘कंधा’ है; रूपक को अमूर्त राजनीतिक भाषा में नहीं बदला गया।
- source_word: וּבְהִשָּׁעֲנָם עָלֶיךָ
  choice: जब वे तुम पर टिके
  rationale: שׁען यहाँ शारीरिक रूप से सहारे पर टिकने का बिंब देता है। ‘भरोसा किया’ निहित अर्थ है, पर मुख्य पाठ में सरकंडे का रूपक सुरक्षित रखा गया है।
- source_word: תִּשָּׁבֵר
  choice: तुम टूट गए
  rationale: שׁבר का निफ़अल रूप टूट जाने को व्यक्त करता है और पहले ‘कुचल गए’ के समानांतर है।
- source_word: וְהַעֲמַדְתָּ לָהֶם כָּל מָתְנַיִם
  choice: तुमने उनकी हर कमर डगमगा दी
  rationale: מָתְנַיִם कमर/कटि-प्रदेश को दर्शाता है। עמד का हिफ़ील शाब्दिक रूप ‘खड़ा कर दिया’ है, किंतु सहारा टूटने के इस प्रसंग में अस्थिर कर देने का परिणाम अभिप्रेत है। ‘डगमगा दी’ स्पष्ट हिन्दी देते हुए कठिन इब्रानी मुहावरे को पाद-टिप्पणी में सुरक्षित रखता है।
theological_decisions:
- issue: मिस्र पर निर्भरता को रूपक या व्याख्या के रूप में प्रस्तुत करना
  choice: मुख्य पाठ में पकड़ने, टिकने, कंधे और कमर का शारीरिक सरकंडा-बिंब बनाए रखा गया।
  alternative: ‘तुम पर भरोसा किया’ या ‘तुम्हारा राजनीतिक सहारा लिया’ कहना।
  rationale: यह पद पिछले पद के सरकंडे वाले रूपक को आगे बढ़ाता है। ठोस बिंब रखने से झूठे मानवीय सहारे का धार्मिक आशय पाठ से स्वयं उभरता है, अनुवाद में आरोपित नहीं होता।
- issue: וְהַעֲמַדְתָּ ... כָּל מָתְנַיִם के कठिन मुहावरे का अर्थ
  choice: मुख्य पाठ में सहारा टूटने के फल को ‘हर कमर डगमगा दी’ कहा गया।
  alternative: अधिक शाब्दिक ‘उनकी सारी कमरें खड़ी कर दीं’ या पारंपरिक ‘उनकी सारी कटियाँ हिला दीं’।
  rationale: इब्रानी वाक्यांश असामान्य है। मुख्य पाठ अर्थपूर्ण आधुनिक हिन्दी देता है, जबकि पाद-टिप्पणी शाब्दिक रूप और उसकी अनिश्चितता को प्रकट करती है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सहज मानक हिन्दी। मिस्र को संबोधित करने के लिए पूरे पद में ‘तुम’ रखा गया है। ‘कमर’ आधुनिक पाठक के लिए ‘कटि’ की अपेक्षा अधिक सहज है; ‘हर’ सामूहिक כָּל को वितरणात्मक और स्वाभाविक हिन्दी में व्यक्त करता है।
