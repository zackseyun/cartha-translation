source:
  edition: WLC
  text: בֶּן אָדָ֗ם נְבוּכַדְרֶאצַּ֣ר מֶֽלֶךְ בָּ֠בֶל הֶעֱבִ֨יד אֶת חֵיל֜/וֹ עֲבֹדָ֤ה גְדֹלָה֙ אֶל צֹ֔ר כָּל רֹ֣אשׁ מֻקְרָ֔ח וְ/כָל כָּתֵ֖ף מְרוּטָ֑ה וְ֠/שָׂכָר לֹא הָ֨יָה ל֤/וֹ וּ/לְ/חֵיל/וֹ֙ מִ/צֹּ֔ר עַל הָ/עֲבֹדָ֖ה אֲשֶׁר עָבַ֥ד עָלֶֽי/הָ־־־־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/029/018.yaml
  text: Son of man[a], Nebuchadnezzar king of Babylon made his army labor greatly against Tyre; every head was made bald and every shoulder was rubbed bare[c][b], yet there was no pay for him or for his army from Tyre for the labor that he had performed against it.
translation:
  language: hi
  text: हे मनुष्य के पुत्र,[a] बाबेल के राजा नबूकदनेस्सर ने अपनी सेना से सोर के विरुद्ध बहुत कठिन परिश्रम करवाया। हर सिर गंजा हो गया और हर कंधा छिल गया;[b] फिर भी सोर से न तो उसे और न उसकी सेना को उस परिश्रम का कोई प्रतिफल मिला, जो उसने उसके विरुद्ध किया था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “हे नश्वर मनुष्य।” हिब्रू में शाब्दिक रूप से “मनुष्य के पुत्र”; यह यहेजकेल के लिए बार-बार प्रयुक्त संबोधन है।
    reason: lexical_alternative
  - marker: b
    text: सिर के गंजे होने और कंधों के छिलने की छवि संभवतः घेराबंदी के कठिन शारीरिक श्रम को दर्शाती है।
    reason: cultural_note
lexical_decisions:
- source_word: בֶּן אָדָם
  choice: हे मनुष्य के पुत्र
  rationale: यहेजकेल के लिए बार-बार प्रयुक्त संबोधन के हिब्रू रूप और साहित्यिक भूमिका को सुरक्षित रखता है; हिंदी में संबोधन स्पष्ट करने के लिए ‘हे’ जोड़ा गया है।
- source_word: הֶעֱבִיד אֶת חֵילוֹ
  choice: अपनी सेना से ... परिश्रम करवाया
  rationale: हिफ़ील क्रिया की causative शक्ति को स्वाभाविक हिंदी में व्यक्त करता है; חֵיל सैन्य संदर्भ में ‘सेना’ है।
- source_word: עֲבֹדָה גְדֹלָה
  choice: बहुत कठिन परिश्रम
  rationale: काम की तीव्रता और विशालता दोनों को सहज आधुनिक हिंदी में व्यक्त करता है।
- source_word: אֶל צֹר
  choice: सोर के विरुद्ध
  rationale: सैन्य और घेराबंदी के संदर्भ में אֶל शत्रुतापूर्ण दिशा सूचित करता है।
- source_word: כָּל רֹאשׁ מֻקְרָח
  choice: हर सिर गंजा हो गया
  rationale: परिश्रम से उत्पन्न परिणाम को व्यक्त करता है और अनावश्यक रूप से उसके भौतिक कारण को निश्चित नहीं करता।
- source_word: וְכָל כָּתֵף מְרוּטָה
  choice: हर कंधा छिल गया
  rationale: מְרוּטָה की घिसकर या रगड़कर त्वचा उतरने की छवि को संक्षिप्त और स्वाभाविक हिंदी में रखता है।
- source_word: שָׂכָר
  choice: प्रतिफल
  rationale: श्रम के बदले मिलने वाले भुगतान या पुरस्कार की व्यापकता बनाए रखता है; केवल नियमित ‘मज़दूरी’ तक अर्थ सीमित नहीं करता।
- source_word: מִצֹּר
  choice: सोर से
  rationale: 'हिब्रू पूर्वसर्ग का सीधा अर्थ रखता है: अभियान से अपेक्षित प्रतिफल सोर से नहीं मिला।'
- source_word: עַל הָעֲבֹדָה אֲשֶׁר עָבַד עָלֶיהָ
  choice: उस परिश्रम का ... जो उसने उसके विरुद्ध किया था
  rationale: हिब्रू के कार्य-शब्दों की पुनरावृत्ति को यथासंभव बनाए रखते हुए עָלֶיהָ को सैन्य संदर्भ में ‘उसके विरुद्ध’ प्रस्तुत करता है।
