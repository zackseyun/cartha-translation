  text: פְּעֻלָּת/וֹ֙ אֲשֶׁר עָ֣בַד בָּ֔/הּ נָתַ֥תִּי ל֖/וֹ אֶת אֶ֣רֶץ מִצְרָ֑יִם אֲשֶׁר֙ עָ֣שׂוּ לִ֔/י נְאֻ֖ם אֲדֹנָ֥/י יְהוִֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/029/020.yaml
  text: As his wages for which he labored against it[a], I have given him the land of Egypt, because they worked for me[c][b], declares the Lord GOD.
translation:
  language: hi
  text: उसके उस काम के बदले, जो उसने उसके विरुद्ध किया था,[a][b] मैंने उसे मिस्र की भूमि दे दी है, क्योंकि उन्होंने मेरे लिए काम किया था,[c] प्रभु यहोवा की यह घोषणा है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसके उस काम के प्रतिफल के रूप में, जो उसने उसके विरुद्ध किया था।” इब्रानी शब्द का अर्थ “काम,” “कार्य,” “मज़दूरी” या “प्रतिफल” हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: “उसके” से संभवतः पिछले प्रसंग का सोर अभिप्रेत है (यहेजकेल 29:18)।
    reason: cross_reference
  - marker: c
    text: या, “क्योंकि उन्होंने मेरे लिए यह किया था,” अथवा “क्योंकि उन्होंने मेरी ओर से कार्य किया था।”
    reason: lexical_alternative
lexical_decisions:
- source_word: פְּעֻלָּתוֹ
  choice: उसके उस परिश्रम की मज़दूरी
  rationale: संज्ञा का अर्थ काम, परिश्रम अथवा उसके प्रतिफल/मज़दूरी से हो सकता है। यहाँ मिस्र को सैन्य परिश्रम के बदले दिए जाने के कारण ‘मज़दूरी’ प्रतिपूरक भाव स्पष्ट करती है, जबकि ‘परिश्रम’ उसी पदबंध में कार्य का पहलू बनाए रखता है।
- source_word: אֲשֶׁר עָבַד בָּהּ
  choice: जो उसने उसके विरुद्ध किया था
  rationale: עבד का मूल भाव काम या सेवा करना है। स्त्रीलिंग प्रत्यय पिछले संदर्भ के सोर की ओर संकेत करता जान पड़ता है; युद्ध-संदर्भ में ‘उसके विरुद्ध’ स्वाभाविक है, पर संदर्भगत पहचान पादटिप्पणी में रखी गई है।
- source_word: נָתַתִּי לוֹ
  choice: मैंने उसे ... दे दिया है
  rationale: इब्रानी पूर्ण क्रिया को यहाँ निश्चित और वर्तमानतः प्रासंगिक दैवी निर्णय के रूप में हिंदी के पूर्ण पक्ष से व्यक्त किया गया है।
- source_word: אֶת אֶרֶץ מִצְרָיִם
  choice: मिस्र देश
  rationale: यह ‘मिस्र की भूमि’ का स्वाभाविक और संक्षिप्त हिंदी रूप है तथा भूभाग दिए जाने का भाव बनाए रखता है।
- source_word: אֲשֶׁר עָשׂוּ לִי
  choice: क्योंकि उन्होंने मेरे लिए काम किया था
  rationale: עשה सामान्यतः ‘करना’ है, पर निकट प्रसंग में सेना द्वारा किए गए कार्य और उसके प्रतिफल की बात है। ‘काम किया’ इस संबंध को स्पष्ट रखता है और यह नहीं बताता कि उनके सभी उद्देश्य परमेश्वर के प्रति समर्पित थे।
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: प्रभु यहोवा की यह घोषणा है
  rationale: נְאֻם की नबी-संबंधी घोषणा-विधि को स्वाभाविक हिंदी में व्यक्त किया गया है; אֲדֹנָי और יהוה दोनों को क्रमशः ‘प्रभु’ और ‘यहोवा’ से अलग-अलग सुरक्षित रखा गया है।
theological_decisions:
- issue: בָּהּ में स्त्रीलिंग प्रत्यय का संदर्भ
  choice: मुख्य पाठ में ‘उसके विरुद्ध’ रखा गया है और पादटिप्पणी में उसका संभावित संदर्भ सोर बताया गया है।
  alternative: प्रत्यय को सामान्यतः उस काम या सैन्य सेवा से संबद्ध समझना।
  rationale: 29:18–19 में नबूकदनेस्सर की सोर के विरुद्ध कठिन सेवा और उसके बदले मिस्र दिए जाने की चर्चा है। फिर भी पद में सोर का नाम दोहराया नहीं गया, इसलिए पहचान को मुख्य पाठ में जोड़ने के बजाय पादटिप्पणी में रखा गया है।
- issue: ‘उन्होंने मेरे लिए काम किया’ में दैवी और मानवीय अभिकरण
  choice: बहुवचन को नबूकदनेस्सर और उसकी सेना के लिए रखते हुए उन्हें दैवी न्याय का कार्य करने वाले साधन के रूप में प्रस्तुत किया गया है।
  alternative: उन्होंने केवल अपने साम्राज्यवादी उद्देश्यों के लिए काम किया, और कथन में दैवी सेवा का कोई भाव नहीं है।
  rationale: मूल पाठ साफ़ तौर पर कहता है कि उन्होंने ‘मेरे लिए’ किया। अनुवाद इस तनाव को बनाए रखता है, पर इसे उनकी हर मंशा अथवा पूरी निष्ठा पर दैवी स्वीकृति नहीं बनाता।
translation_notes:
  register: आधुनिक मानक हिंदी का गरिमापूर्ण किंतु सहज स्तर रखा गया है। ‘मज़दूरी’ साधारण पाठक के लिए स्पष्ट है और प्रतिपूरक संदर्भ को व्यक्त करती है। ‘प्रभु यहोवा’ मूल के दोनों दैवी संबोधनों को सुरक्षित रखता है। सभी पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित हैं।
