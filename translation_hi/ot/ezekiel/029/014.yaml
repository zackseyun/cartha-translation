source:
  edition: WLC
  text: וְ/שַׁבְתִּי֙ אֶת שְׁב֣וּת מִצְרַ֔יִם וַ/הֲשִׁבֹתִ֤י אֹתָ/ם֙ אֶ֣רֶץ פַּתְר֔וֹס עַל אֶ֖רֶץ מְכֽוּרָתָ֑/ם וְ/הָ֥יוּ שָׁ֖ם מַמְלָכָ֥ה שְׁפָלָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/029/014.yaml
  text: And I will restore the fortunes of Egypt and bring them back to the land of Pathros[a], to the land of their origin[b], and there they will be a lowly kingdom.
translation:
  language: hi
  text: और मैं मिस्र की दशा को फिर से बहाल करूँगा[a], और उन्हें पत्रोस[b] की भूमि, उनके मूल देश, में वापस ले आऊँगा; और वहाँ वे एक निम्न दर्जे का राज्य होंगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इस इब्रानी मुहावरे का अधिक शाब्दिक अनुवाद ‘मैं मिस्र के बंदियों को वापस लाऊँगा’ या ‘मैं मिस्र की बंधुआई को लौटा दूँगा’ भी हो सकता है; यहाँ यह संभवतः मिस्र की दशा की व्यापक पुनर्बहाली बताता है।
    reason: lexical_alternative
  - marker: b
    text: पत्रोस ऊपरी मिस्र का एक क्षेत्र था, जिसे यहाँ मिस्रियों का मूल देश कहा गया है।
    reason: cultural_note
lexical_decisions:
- source_word: וְשַׁבְתִּי אֶת שְׁבוּת מִצְרַיִם
  choice: मैं मिस्र के भाग्य को फिर से सँवारूँगा
  rationale: शׁוּב שְׁבוּת मुहावरा परिस्थिति या समृद्धि की पुनर्बहाली का संकेत दे सकता है। अगले खंड में लोगों की वास्तविक वापसी अलग से कही गई है, इसलिए यह चयन अनावश्यक पुनरुक्ति से बचते हुए व्यापक पुनर्बहाली व्यक्त करता है।
- source_word: וַהֲשִׁבֹתִי אֹתָם
  choice: उन्हें ... लौटा लाऊँगा
  rationale: हिफ़ील रूप परमेश्वर द्वारा उन्हें वापस लाए जाने का कारणात्मक भाव रखता है; ‘लौटा लाऊँगा’ आधुनिक हिन्दी में स्वाभाविक है।
- source_word: אֶרֶץ פַּתְרוֹס
  choice: पत्रोस देश
  rationale: स्थान-नाम को लिप्यंतरित किया गया है और אֶרֶץ को ‘देश’ के रूप में बनाए रखा गया है।
- source_word: עַל אֶרֶץ מְכוּרָתָם
  choice: उनके मूल देश में
  rationale: מְכוּרָה जन्म या उद्गम-स्थान को दर्शाता है। वापसी के प्रसंग में עַל को गंतव्यसूचक रूप में स्वाभाविक हिन्दी ‘में’ से व्यक्त किया गया है।
- source_word: מַמְלָכָה שְׁפָלָה
  choice: एक छोटा राज्य
  rationale: שָׁפָל यहाँ राज्य की नीची अथवा घट चुकी हैसियत बताता है। ‘छोटा राज्य’ साधारण हिन्दी में उसकी सीमित शक्ति और दर्जे को स्पष्ट करता है, न कि नैतिक दीनता को।
theological_decisions:
- issue: שׁוּב שְׁבוּת पुनर्बहाली-मुहावरे का अर्थ
  choice: मिस्र के भाग्य को फिर से सँवारना
  alternative: मिस्र के बंदियों को वापस लाना / मिस्र की बँधुआई को फेर देना
  rationale: इब्रानी पदबंध निर्वासन से लौटने को शाब्दिक रूप में अथवा दशा के व्यापक पलटाव को मुहावरे के रूप में व्यक्त कर सकता है। अगला वाक्यांश वास्तविक वापसी स्पष्ट करता है; मुख्य पाठ में व्यापक अर्थ रखा और शाब्दिक संभावना पाद-टिप्पणी में सुरक्षित की गई है।
- issue: עַל אֶרֶץ מְכוּרָתָם में עַל का बल
  choice: उनके मूल देश में
  alternative: उनके मूल देश पर
  rationale: ‘पर’ अधिक शाब्दिक है, पर गति और वापसी के संदर्भ में हिन्दी का गंतव्यसूचक ‘में’ अधिक स्वाभाविक है।
- issue: מַמְלָכָה שְׁפָלָה का आशय
  choice: एक छोटा राज्य
  alternative: एक नीचा / दीन राज्य
  rationale: संदर्भ राजनीतिक महत्त्व और सामर्थ्य के घटने का है। चयन किसी नैतिक गुण या आध्यात्मिक नम्रता का अर्थ आरोपित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण स्तर रखा गया है। ‘भाग्य को फिर से सँवारना’ मुहावरे की व्यापक पुनर्बहाली व्यक्त करता है; ‘लौटा लाऊँगा’ कारणात्मक क्रिया को स्वाभाविक बनाता है। सभी पाद-टिप्पणी चिह्न मुख्य पाठ में दिए गए हैं।
