source:
  edition: WLC
  text: לָ/כֵ֗ן כֹּ֤ה אָמַר֙ אֲדֹנָ֣/י יְהוִ֔ה הִנְ/נִ֥י נֹתֵ֛ן לִ/נְבוּכַדְרֶאצַּ֥ר מֶֽלֶךְ בָּבֶ֖ל אֶת אֶ֣רֶץ מִצְרָ֑יִם וְ/נָשָׂ֨א הֲמֹנָ֜/הּ וְ/שָׁלַ֤ל שְׁלָלָ/הּ֙ וּ/בָזַ֣ז בִּזָּ֔/הּ וְ/הָיְתָ֥ה שָׂכָ֖ר לְ/חֵילֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/029/019.yaml
  text: 'Therefore thus says the Lord GOD: Behold[a], I am giving the land of Egypt to Nebuchadnezzar king of Babylon, and he will carry off its multitude, plunder its spoil, and seize its booty; and it will be wages for his army.'
translation:
  language: hi
  text: 'इसलिए प्रभु यहोवा यों कहता है: देखो, मैं मिस्र देश को बाबेल के राजा नबूकदरेस्सर के हाथ में दे रहा हूँ। वह उसकी विपुल संपदा[a] उठा ले जाएगा, उसकी लूट लूटेगा और उसका माल छीन लेगा; और वह उसकी सेना का मेहनताना होगा।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी शब्द का अर्थ ‘उसकी बहुलता’ या ‘उसका जनसमूह’ भी हो सकता है; यहाँ लूट के संदर्भ में सम्भवतः मिस्र की प्रचुर संपत्ति और संसाधन अभिप्रेत हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: इसलिए
  rationale: यह पद पिछले कथन के परिणाम को बताता है; ‘इसलिए’ उसके निष्कर्षसूचक बल को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: כֹּה אָמַר אֲדֹנָי יְהוִה
  choice: प्रभु यहोवा यों कहता है
  rationale: यह भविष्यद्वक्ताओं का प्रचलित संदेश-सूत्र है। ‘यहोवा’ परमेश्वर के व्यक्तिगत नाम को व्यक्त करता है और ‘प्रभु’ אֲדֹנָי का सम्मानसूचक अर्थ रखता है।
- source_word: הִנְנִי נֹתֵן
  choice: देखो, मैं ... दे रहा हूँ
  rationale: הִנְנִי के गंभीर ध्यानाकर्षण और participle से व्यक्त निश्चित तथा आसन्न कार्य, दोनों को सहज हिन्दी में रखा गया है।
- source_word: לִנְבוּכַדְרֶאצַּר מֶלֶךְ בָּבֶל
  choice: बाबेल के राजा नबूकदरेस्सर के हाथ में
  rationale: לְ प्राप्तकर्ता को सूचित करता है; ‘के हाथ में देना’ यहाँ शासन और अधिकार सौंपने का स्वाभाविक हिन्दी मुहावरा है। नाम की वर्तनी इस पद के इब्रानी रूप נְבוּכַדְרֶאצַּר को दर्शाती है।
- source_word: אֶרֶץ מִצְרָיִם
  choice: मिस्र देश
  rationale: אֶרֶץ का भौगोलिक और प्रादेशिक अर्थ केवल ‘मिस्र’ कहने के बजाय स्पष्ट रखा गया है।
- source_word: וְנָשָׂא הֲמֹנָהּ
  choice: वह उसकी विपुल संपदा उठा ले जाएगा
  rationale: הָמוֹן के ‘बहुलता/जनसमूह/प्रचुर संपत्ति’ अर्थों में से लूट और सैन्य मेहनताने के संदर्भ में आर्थिक अर्थ मुख्य पाठ में स्वाभाविक है; अन्य सम्भावना पादटिप्पणी में सुरक्षित है।
- source_word: וְשָׁלַל שְׁלָלָהּ
  choice: उसकी लूट लूटेगा
  rationale: सजातीय क्रिया और संज्ञा की इब्रानी पुनरुक्ति को हिन्दी में भी बनाए रखता है।
- source_word: וּבָזַז בִּזָּהּ
  choice: उसका माल छीन लेगा
  rationale: बलपूर्वक युद्ध-सामग्री अथवा माल ले जाने का अर्थ स्वाभाविक हिन्दी में व्यक्त होता है और पिछले समानांतर खंड से शब्दगत भिन्नता भी बनी रहती है।
- source_word: וְהָיְתָה שָׂכָר לְחֵילוֹ
  choice: और वह उसकी सेना का मेहनताना होगा
  rationale: שָׂכָר का वास्तविक पारिश्रमिक/मजदूरी का भाव ‘मेहनताना’ से और חַיִל का सैन्य अर्थ ‘सेना’ से स्पष्ट होता है।
theological_decisions:
- issue: संयुक्त उपाधि אֲדֹנָי יְהוִה में परमेश्वर के नाम का अनुवाद
  choice: प्रभु यहोवा
  alternative: प्रभु परमेश्वर
  rationale: मूल पाठ में व्यक्तिगत दिव्य नाम יהוה उपस्थित है; ‘यहोवा’ उसे सामान्य उपाधि में विलीन किए बिना रखता है, जबकि אֲדֹנָי का अर्थ ‘प्रभु’ है।
- issue: हָמוֹן के संदर्भगत अर्थ की अनिश्चितता
  choice: विपुल संपदा
  alternative: जनसमूह / बहुलता
  rationale: आसपास के ‘लूट’, ‘माल’ और सेना के ‘मेहनताने’ वाले शब्द आर्थिक अर्थ को बल देते हैं, पर शब्द जनसमूह भी दर्शा सकता है; इसलिए वैकल्पिक अर्थ पादटिप्पणी में दिया गया है।
- issue: וְהָיְתָה में मेहनताना बनने वाली वस्तु का संदर्भ
  choice: वह
  alternative: यह सब
  rationale: इब्रानी स्त्रीलिंग सर्वनाम का संदर्भ मिस्र देश अथवा उससे उठाई गई संपदा/लूट हो सकता है। ‘वह’ मूल की संदर्भगत खुली स्थिति को अनावश्यक रूप से सीमित नहीं करता।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध हिन्दी अपनाई गई है। भविष्यद्वाणी की गंभीरता बनाए रखते हुए अत्यधिक संस्कृतनिष्ठ शब्दावली से बचा गया है; ‘मेहनताना’ सैन्य सेवा के प्रतिफल को सामान्य और सटीक ढंग से व्यक्त करता है।
