  to: इसलिए देख, मैं तेरे और तेरी नील-धाराओं[a] के विरुद्ध हूँ। मैं मिस्र देश को खंडहर और उजाड़, एक सुनसान प्रदेश कर दूँगा—मिग्दोल से सवेने तक, कूश की सीमा तक।
