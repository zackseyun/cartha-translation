source:
  edition: WLC
  text: לָ/כֵ֛ן הִנְ/נִ֥י אֵלֶ֖י/ךָ וְ/אֶל יְאֹרֶ֑י/ךָ וְ/נָתַתִּ֞י אֶת אֶ֣רֶץ מִצְרַ֗יִם לְ/חָרְבוֹת֙ חֹ֣רֶב שְׁמָמָ֔ה מִ/מִּגְדֹּ֥ל סְוֵנֵ֖ה וְ/עַד גְּב֥וּל כּֽוּשׁ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/029/010.yaml
  text: Therefore[a], behold, I am against you and against your Nile channels, and I will make the land of Egypt ruins, a desolation laid waste, from Migdol to Syene[c][b], as far as the border of Cush.
translation:
  language: hi
  text: इसलिए देख, मैं तेरे और तेरी नील-धाराओं[a] के विरुद्ध हूँ। मैं मिस्र देश को खंडहर और उजाड़, एक सुनसान प्रदेश कर दूँगा—मिग्दोल से सवेने तक, कूश की सीमा तक।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘तेरी नदियों’। मिस्र के संदर्भों में यह इब्रानी शब्द प्रायः नील और उसकी शाखाओं या नहरों के लिए प्रयुक्त होता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: יְאֹרֶיךָ
  choice: तेरी नील-धाराओं
  rationale: मिस्र के संदर्भ में יְאֹר सामान्य नदियों के बजाय विशेष रूप से नील और उसकी शाखाओं अथवा नहरों का संकेत करता है। ‘नील-धाराओं’ से यह स्थानीय अर्थ और बहुवचन दोनों बने रहते हैं।
- source_word: לְחָרְבוֹת חֹרֶב שְׁמָמָה
  choice: खंडहर-ही-खंडहर, उजड़ा और सुनसान
  rationale: मूल इब्रानी में विनाश और उजाड़ के निकटार्थी शब्दों का संचय है। यह हिंदी अभिव्यक्ति उस प्रबल, संचयी प्रभाव को बनाए रखती है और स्वाभाविक भी है।
- source_word: מִמִּגְדֹּל סְוֵנֵה
  choice: मिग्दोल से सवेने तक
  rationale: दोनों स्थान-नामों को इब्रानी रूप के निकट देवनागरी लिप्यंतरण में रखा गया है; वे मिस्र की भौगोलिक सीमा को सूचित करते हैं।
- source_word: וְעַד גְּבוּל כּוּשׁ
  choice: और कूश की सीमा तक
  rationale: כּוּשׁ को आधुनिक ‘इथियोपिया’ कहने से वर्तमान राष्ट्र-सीमाओं का भ्रामक अर्थ आ सकता है; इसलिए ऐतिहासिक नाम ‘कूश’ रखा गया है।
- source_word: הִנְנִי אֵלֶיךָ
  choice: देख, मैं तेरे ... विरुद्ध हूँ
  rationale: הִנְנִי का ध्यान आकर्षित करने वाला गंभीर भविष्यद्वाणी-संबंधी बल ‘देख’ से आता है, जबकि אֵלֶיךָ यहाँ ईश्वरीय विरोध व्यक्त करता है।
- source_word: וְנָתַתִּי אֶת אֶרֶץ מִצְרַיִם
  choice: मैं मिस्र देश को ... कर दूँगा
  rationale: यहाँ נתן परिणामसूचक पूरक के साथ किसी अवस्था में पहुँचा देने का अर्थ देता है; ‘कर दूँगा’ आधुनिक हिंदी में इस भाव को स्पष्ट करता है।
theological_decisions: []
translation_notes:
  register: भाषा आधुनिक, गंभीर और भविष्यद्वाणी की सीधी वाणी के अनुरूप रखी गई है। एकवचन संबोधन के लिए ‘तेरे’ मूल पाठ के पुल्लिंग एकवचन रूप को दर्शाता है। विनाश-सूचक इब्रानी शब्द-संचय को सपाट किए बिना स्वाभाविक हिंदी में व्यक्त किया गया है।
