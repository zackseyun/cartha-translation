base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/029/005.yaml
  text: I will cast you into the wilderness[a], you and all the fish of your streams. You will fall on the open field; you will not be gathered or collected[c][b]. I have given you as food to the beasts of the earth and to the birds of the heavens.
translation:
  language: hi
  text: मैं तुझे निर्जन प्रदेश में फेंक दूँगा—तुझे और तेरी सभी जलधाराओं की मछलियों को[a]। तू खुले मैदान में गिरेगा; न तो तुझे उठाया जाएगा और न एकत्र किया जाएगा[b]। मैंने तुझे धरती के वन-पशुओं और आकाश के पक्षियों के भोजन के लिए दे दिया है[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तेरी नील की नहरों/धाराओं की सारी मछलियों को।” इब्रानी शब्द יְאֹר मिस्र के संदर्भों में प्रायः नील नदी और उसके जलमार्गों के लिए प्रयुक्त होता है।
    reason: cultural_note
  - marker: b
    text: इब्रानी में दो निकटार्थक क्रियाएँ हैं, जिनका शाब्दिक भाव है, “तुझे न इकट्ठा किया जाएगा, न एकत्र किया जाएगा।” यह इस बात पर जोर देता है कि तुझे उठाया या दफनाने के लिए एकत्र नहीं किया जाएगा।
    reason: lexical_alternative
  - marker: c
    text: शाब्दिक रूप से, “मैंने तुझे भोजन के लिए दे दिया है।” यहाँ पूर्ण काल आने वाले न्याय को निश्चित, मानो पहले ही पूरा हो चुका, दिखाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וּנְטַשְׁתִּיךָ
  choice: मैं तुझे ... फेंक दूँगा
  rationale: נטשׁ का अर्थ छोड़ देना, त्याग देना या फेंक देना हो सकता है। न्याय के इस प्रसंग में “फेंक दूँगा” बलपूर्वक बाहर डाल दिए जाने और असुरक्षित छोड़ दिए जाने—दोनों भावों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: הַמִּדְבָּרָה
  choice: निर्जन प्रदेश में
  rationale: दिशासूचक प्रत्यय गति को उस ओर दिखाता है। “निर्जन प्रदेश” केवल रेतीले मरुस्थल तक अर्थ सीमित किए बिना उजाड़ स्थान का भाव देता है।
- source_word: דְּגַת יְאֹרֶיךָ
  choice: तेरी नील-नदी की सभी धाराओं की मछलियों
  rationale: דגת सामूहिक रूप से मछलियों को और יְאֹרֶיךָ बहुवचन जलधाराओं/नहरों को दर्शाता है। मिस्री प्रसंग में יְאֹר प्रायः नील और उसकी जलधाराओं के लिए आता है, इसलिए नील-संबंध स्पष्ट किया गया है और व्यापक विकल्प पादटिप्पणी में रखा गया है।
- source_word: עַל פְּנֵי הַשָּׂדֶה
  choice: खुले मैदान में
  rationale: इब्रानी मुहावरा मैदान की खुली सतह पर पड़े रहने और पूरी तरह उजागर होने का भाव देता है। “खुले मैदान में” आधुनिक हिन्दी में इसे स्वाभाविक रूप से व्यक्त करता है।
- source_word: לֹא תֵאָסֵף וְלֹא תִקָּבֵץ
  choice: न तो तुझे उठाया जाएगा और न इकट्ठा किया जाएगा
  rationale: दो निकटार्थक कर्मवाच्य क्रियाओं को अलग रखते हुए उस जोर को सुरक्षित किया गया है कि शव को न हटाया जाएगा, न अंतिम संस्कार के लिए एकत्र किया जाएगा; अंतिम निहितार्थ को मुख्य पाठ में स्पष्ट जोड़कर सीमित नहीं किया गया।
- source_word: לְחַיַּת הָאָרֶץ
  choice: धरती के वन-पशुओं
  rationale: חיה इस शवभक्षण के दृश्य में जंगली पशुओं की ओर संकेत करता है। “वन-पशु” गंभीर और सुबोध हिन्दी है।
- source_word: וּלְעוֹף הַשָּׁמַיִם
  choice: आकाश के पक्षियों
  rationale: यह सामान्य बाइबलीय अभिव्यक्ति इब्रानी चित्रात्मकता और गरिमापूर्ण शैली दोनों को सुरक्षित रखती है।
- source_word: נְתַתִּיךָ לְאָכְלָה
  choice: मैंने तुझे ... भोजन के लिए दे दिया है
  rationale: पूर्ण क्रिया को भूत/पूर्ण रूप में रखा गया है, जिससे आने वाले न्याय की भविष्यद्वाणी में उसकी निश्चितता व्यक्त होती है। “भोजन के लिए दे दिया है” मूल वाक्य-संरचना और सौंप दिए जाने के न्यायिक भाव के निकट है।
theological_decisions:
- issue: अंतिम उपवाक्य में भविष्यद्वाणी-सूचक पूर्ण काल
  choice: मैंने तुझे ... भोजन के लिए दे दिया है
  alternative: मैं तुझे ... भोजन के लिए दे दूँगा
  rationale: इब्रानी נְתַתִּיךָ पूर्ण रूप में है। उसे पूर्ण काल में रखना आने वाले न्याय को इतना निश्चित बताता है मानो वह हो चुका हो; साधारण भविष्य काल इस तनाव को समतल कर देता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध रखी गई है। एकवचन “तू/तुझे” फिरौन को संबोधित मूल इब्रानी के सीधे, न्यायसूचक लहजे को बनाए रखता है। निकटार्थक क्रियाओं की पुनरुक्ति को हटाने के बजाय स्वाभाविक हिन्दी में अलग-अलग क्रियाओं से सुरक्षित किया गया है।
