source:
  edition: WLC
  text: וְ/לֹ֣א יִֽהְיֶה עוֹד֩ לְ/בֵ֨ית יִשְׂרָאֵ֤ל לְ/מִבְטָח֙ מַזְכִּ֣יר עָוֺ֔ן בִּ/פְנוֹתָ֖/ם אַחֲרֵי/הֶ֑ם וְ/יָ֣דְע֔וּ כִּ֥י אֲנִ֖י אֲדֹנָ֥/י יְהוִֽה־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/029/016.yaml
  text: And it will no longer be for the house of Israel a source of confidence[a], bringing iniquity to remembrance when they turn after them[c][b]; then they will know that I am the Lord GOD.
translation:
  language: hi
  text: और वह इस्राएल के घराने के लिए फिर कभी भरोसे का ऐसा आधार[a] नहीं होगा, जो उनके पीछे जाने पर उनके अधर्म का स्मरण दिलाए[b]। तब वे जानेंगे कि मैं प्रभु याहवे हूँ[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “भरोसा” अथवा “सुरक्षा।” इब्रानी शब्द उस वस्तु या व्यक्ति को सूचित करता है जिस पर सुरक्षा के लिए निर्भर रहा जाए।
    reason: lexical_alternative
  - marker: b
    text: या “उनके दोष का स्मरण कराएगा।” इब्रानी עָוֺן का अर्थ “अधर्म,” “दोष” या दोष का दंड हो सकता है।
    reason: lexical_alternative
  - marker: c
    text: इब्रानी में “अदोनाय याहवे,” अर्थात् “प्रभु याहवे।”
    reason: alternative_reading
lexical_decisions:
- source_word: לֹא יִהְיֶה עוֹד
  choice: फिर कभी ... न होगा
  rationale: निषेध, היה के अपूर्ण रूप और עוֹד का मेल भविष्य में समाप्त हो जाने का भाव देता है; यह हिन्दी में स्वाभाविक रूप से वही अर्थ व्यक्त करता है।
- source_word: לְבֵית יִשְׂרָאֵל
  choice: इस्राएल के घराने के लिए
  rationale: ‘घराना’ मूल के सामुदायिक और वाचा-संबंधी भाव को बनाए रखता है और इसे केवल ‘इस्राएली’ कहकर सपाट नहीं करता।
- source_word: לְמִבְטָח
  choice: भरोसे का आधार
  rationale: מִבְטָח उस व्यक्ति या वस्तु को सूचित कर सकता है जिस पर सुरक्षा के लिए निर्भर रहा जाए; ‘भरोसे का आधार’ मिस्र पर इस्राएल की राजनीतिक निर्भरता को स्पष्ट करता है।
- source_word: מַזְכִּיר עָוֺן
  choice: उन्हें उनका अधर्म याद दिलाएगा
  rationale: זכר का हिफ़ील रूप ‘याद दिलाना’ या ‘स्मरण कराना’ है। עָוֺן के नैतिक अपराध के भाव को ‘अधर्म’ बनाए रखता है, जबकि कर्ता और कर्म हिन्दी में स्पष्ट किए गए हैं।
- source_word: בִּפְנוֹתָם אַחֲרֵיהֶם
  choice: जब वे उनके पीछे चलेंगे
  rationale: ב prefixed infinitive temporal circumstance व्यक्त करता है और אַחֲרֵי का अर्थ पीछे चलना या अनुसरण करना है। बहुवचन सर्वनाम मूल की वास्तविक संदर्भगत अस्पष्टता को बनाए रखता है।
- source_word: וְיָדְעוּ
  choice: तब वे जानेंगे
  rationale: यहाँ संयोजक प्रसंग में परिणाम का भाव रखता है; ‘तब’ आधुनिक हिन्दी में संबंध को सहज रूप से व्यक्त करता है।
- source_word: אֲדֹנָי יְהוִה
  choice: प्रभु याहवे
  rationale: ‘प्रभु’ אֲדֹנָי को और ‘याहवे’ चार अक्षरों वाले व्यक्तिगत ईश्वरीय नाम יהוה को अलग-अलग सुरक्षित रखता है।
theological_decisions:
- issue: אֲדֹנָי יְהוִה में ईश्वरीय नाम का अनुवाद
  choice: प्रभु याहवे
  alternative: प्रभु यहोवा / प्रभु परमेश्वर
  rationale: यह पद उपाधि אֲדֹנָי और व्यक्तिगत नाम יהוה दोनों रखता है। ‘प्रभु याहवे’ दोनों को दृश्यमान रखता है और ‘प्रभु प्रभु’ जैसे दोहराव से बचता है।
- issue: मिस्र पर भरोसा और अधर्म के स्मरण का संबंध
  choice: मिस्र भरोसे का आधार नहीं रहेगा और उसके पीछे चलना इस्राएल को उसका अधर्म याद दिलाएगा
  alternative: मिस्र स्वयं इस्राएल का दोष परमेश्वर को स्मरण कराएगा
  rationale: हिब्रू व्याकरण में מַזְכִּיר का सटीक कर्म अंतर्निहित है और עָוֺן ‘अधर्म’ या ‘दोष’ दोनों हो सकता है। मुख्य पाठ निकटतम प्रसंगानुकूल अर्थ देता है, जबकि पादटिप्पणी अर्थगत विकल्प को खुला रखती है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, सहज किंतु गरिमापूर्ण रखी गई है। ‘इस्राएल का घराना,’ ‘अधर्म’ और ‘प्रभु याहवे’ जैसे पद मूल की वाचा-संबंधी और धर्मवैचारिक गंभीरता बनाए रखते हैं। बहुवचन ‘उनके’ को जानबूझकर स्पष्ट संज्ञा से नहीं बदला गया, ताकि मूल का संदर्भगत तनाव सुरक्षित रहे।
