id: EZK.2.8
reference: Ezekiel 2:8
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/אַתָּ֣ה בֶן אָדָ֗ם שְׁמַע֙ אֵ֤ת אֲשֶׁר אֲנִי֙ מְדַבֵּ֣ר אֵלֶ֔י/ךָ אַל תְּהִי מֶ֖רִי כְּ/בֵ֣ית הַ/מֶּ֑רִי פְּצֵ֣ה פִ֔י/ךָ וֶ/אֱכֹ֕ל אֵ֥ת אֲשֶׁר אֲנִ֖י נֹתֵ֥ן אֵלֶֽי/ךָ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/002/008.yaml
  text: But you[a], son of man, hear what I am speaking to you. Do not be rebellious like the rebellious house. Open your mouth and eat what I am giving you.
translation:
  language: hi
  text: परन्तु हे मनुष्यपुत्र[a], जो बात मैं तुझसे कह रहा हूँ, उसे सुन। उस विद्रोही घराने के समान विद्रोही मत बन। अपना मुँह खोल और जो मैं तुझे दे रहा हूँ, उसे खा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “हे मनुष्य”; अथवा, “हे मरणशील मनुष्य।”
    reason: बֶן אָדָם के निश्चित संबोधन को मुख्य पाठ में बनाए रखते हुए उसके सामान्य मानवीय अथवा मरणशीलता-संबंधी अर्थों को दर्शाता है।
lexical_decisions:
- source_word: בֶן אָדָם
  choice: मनुष्य के पुत्र
  rationale: यहेजकेल में बार-बार प्रयुक्त इस निश्चित संबोधन का शाब्दिक और साहित्यिक रूप बनाए रखता है; पादटिप्पणी इसके अर्थ ‘मनुष्य’ या ‘मरणशील मनुष्य’ को स्पष्ट करती है।
- source_word: שְׁמַע
  choice: सुन
  rationale: मूल आज्ञार्थक क्रिया सुनने को कहती है और प्रसंग में ध्यानपूर्वक ग्रहण करने का भाव रखती है; ‘सुन’ आज्ञापालन का अर्थ अनावश्यक रूप से आरोपित नहीं करता।
- source_word: מְדַבֵּר אֵלֶיךָ
  choice: मैं तुझसे कह रहा हूँ
  rationale: कृदन्त वर्तमान और तत्काल चल रही वाणी का संकेत देता है; यह हिन्दी में स्वाभाविक अभिव्यक्ति है।
- source_word: אַל תְּהִי מֶרִי
  choice: विद्रोही मत बन
  rationale: מֶרִי संज्ञा होते हुए विद्रोही स्वभाव को व्यक्त करती है; हिन्दी में यह आज्ञार्थक निषेध स्वाभाविक है और ‘न हो’ की अपेक्षा प्रसंग में अधिक सुबोध है।
- source_word: כְּבֵית הַמֶּרִי
  choice: उस विद्रोही घराने के समान
  rationale: בַּיִת यहाँ इस्राएल को एक सामूहिक वंश-समुदाय के रूप में दर्शाता है; ‘घराना’ रूपक और सामूहिक अर्थ दोनों को सहज हिन्दी में रखता है।
- source_word: פְּצֵה פִיךָ
  choice: अपना मुँह खोल
  rationale: मूल क्रिया मुँह खोलने, सम्भवतः पूरा खोलने, की ठोस आज्ञा देती है; हिन्दी में यही स्वाभाविक समतुल्य है।
- source_word: וֶאֱכֹל
  choice: और ... खा
  rationale: दूसरी आज्ञा पहली के बाद प्रतीकात्मक क्रिया का क्रम बनाए रखती है।
- source_word: אֵת אֲשֶׁר אֲנִי נֹתֵן אֵלֶיךָ
  choice: जो मैं तुझे दे रहा हूँ
  rationale: נֹתֵן का कृदन्त रूप वर्तमान और तत्काल दिए जाने का भाव व्यक्त करता है।
theological_decisions:
- issue: भविष्यद्वक्ता के संबोधन में אָדָם का अनुवाद
  choice: मनुष्य के पुत्र
  alternative: हे मनुष्य; हे मरणशील मनुष्य
  rationale: यह यहेजकेल में भविष्यद्वक्ता के लिए बार-बार आने वाला निश्चित संबोधन है। मुख्य पाठ में इसका पारम्परिक शाब्दिक रूप साहित्यिक और अन्तर्पाठीय निरन्तरता बचाता है, जबकि पादटिप्पणी सामान्य मानवीय और मरणशीलता-संबंधी अर्थ की सम्भावना दर्शाती है।
- issue: מֶרִי की पुनरावृत्ति
  choice: विद्रोही ... विद्रोही
  alternative: अवज्ञाकारी ... विद्रोही
  rationale: एक ही इब्रानी शब्द की निकट पुनरावृत्ति भविष्यद्वक्ता और इस्राएल के घराने के बीच स्पष्ट विरोध बनाती है; हिन्दी में उसी शब्द-मूल को दोहराने से यह बल सुरक्षित रहता है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सरल हिन्दी। ईश्वर से भविष्यद्वक्ता के एकवचन संबोधन के लिए ‘तू/तुझसे/तुझे’ रखा गया है, जिससे निकट और प्रत्यक्ष इब्रानी संबोधन प्रतिबिम्बित हो। ‘परन्तु’ आरम्भिक וְאַתָּה के विरोधात्मक बल को व्यक्त करता है।
