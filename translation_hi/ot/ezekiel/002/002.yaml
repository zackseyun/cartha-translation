source:
  edition: WLC
  text: וַ/תָּ֧בֹא בִ֣/י ר֗וּחַ כַּֽ/אֲשֶׁר֙ דִּבֶּ֣ר אֵלַ֔/י וַ/תַּעֲמִדֵ֖/נִי עַל רַגְלָ֑/י וָ/אֶשְׁמַ֕ע אֵ֖ת מִדַּבֵּ֥ר אֵלָֽ/י־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/002/002.yaml
  text: And the Spirit entered into me when he spoke to me[a], and set me on my feet[b]; and I heard the one speaking to me.
translation:
  language: hi
  text: जब वह मुझसे बोल रहा था, तब आत्मा ने मुझमें प्रवेश किया[a] और मुझे अपने पैरों पर खड़ा किया। तब मैंने उसे सुना जो मुझसे बोल रहा था[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “एक आत्मा ने मुझमें प्रवेश किया।” इब्रानी רוּחַ का अर्थ “आत्मा,” “वायु,” या “श्वास” हो सकता है; यहाँ प्रसंग परमेश्वर की उस आत्मा की ओर संकेत करता है जो यहेजकेल को समर्थ बनाती है।
    reason: alternative_reading
  - marker: b
    text: शाब्दिक रूप से, “मैंने मुझसे बोलनेवाले को सुना।”
    reason: lexical_alternative
lexical_decisions:
- source_word: ר֗וּחַ
  choice: आत्मा
  rationale: संज्ञा רוּחַ बिना निश्चित उपपद के है और इसका अर्थ ‘आत्मा’, ‘वायु’ या ‘श्वास’ हो सकता है। इस भविष्यद्वाणी-संबंधी बुलाहट के प्रसंग में यह उस दिव्य आत्मा की ओर संकेत करती है जो यहेजकेल को समर्थ बनाता है; फिर भी हिन्दी मुख्य पाठ में केवल ‘आत्मा’ रखकर मूल की संक्षिप्तता बनाए रखी गई है।
- source_word: וַ/תָּ֧בֹא בִ֣/י
  choice: ने मुझमें प्रवेश किया
  rationale: בוא के साथ ב और प्रथम पुरुष प्रत्यय भीतर आने का भाव देते हैं। ‘मुझमें प्रवेश किया’ इस आंतरिक, समर्थकारी क्रिया को स्पष्ट और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: כַּֽ/אֲשֶׁר֙ דִּבֶּ֣ר אֵלַ֔/י
  choice: जब वह मुझसे बोल रहा था
  rationale: כַּאֲשֶׁר यहाँ साथ-साथ घट रही क्रिया का समय बताता है। हिन्दी का अपूर्ण वर्तमान-भूत रूप बोलने के दौरान आत्मा के प्रवेश करने का भाव स्वाभाविक रूप से प्रकट करता है।
- source_word: וַ/תַּעֲמִדֵ֖/נִי עַל רַגְלָ֑/י
  choice: मुझे पैरों के बल खड़ा कर दिया
  rationale: עמד का हिफ़ील रूप कारक है। ‘पैरों के बल खड़ा कर दिया’ कारणवाचक अर्थ और शारीरिक रूप से खड़ा किए जाने, दोनों को सहज आधुनिक हिन्दी में बनाए रखता है।
- source_word: וָ/אֶשְׁמַ֕ע
  choice: तब मैंने सुना
  rationale: वय्यिक्तोल क्रम कथा की अगली घटना दिखाता है। ‘तब’ हिन्दी में उस क्रम को स्पष्ट करता है, बिना नया अर्थ जोड़े।
- source_word: אֵ֖ת מִדַּבֵּ֥ר אֵלָֽ/י
  choice: उसे सुना जो मुझसे बोल रहा था
  rationale: אֵת कर्म को चिह्नित करता है और מִדַּבֵּר संज्ञा-सदृश कृदन्त है। यह रूप मूल के ‘बोलनेवाले को सुनने’ की संरचना को पठनीय हिन्दी में सुरक्षित रखता है।
theological_decisions:
- issue: רוּחַ का अभिप्रेत संदर्भ
  choice: प्रसंगानुसार परमेश्वर का समर्थकारी आत्मा
  alternative: एक आत्मा; वायु; श्वास
  rationale: दर्शन और भविष्यद्वक्ता की बुलाहट के निकट प्रसंग में यही आत्मा यहेजकेल को खड़ा करके सुनने योग्य बनाता है। इसलिए दिव्य आत्मा का अर्थ सबसे संगत है, पर मुख्य पाठ में ‘परमेश्वर का’ जोड़कर मूल से अधिक स्पष्टता आरोपित नहीं की गई।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘पैरों के बल खड़ा कर दिया’ स्वाभाविक हिन्दी में इब्रानी कारणवाचक रूप व्यक्त करता है। ‘आत्मा’ की पहचान को मुख्य पाठ में अत्यधिक स्पष्ट न करके मूल की व्याकरणिक अस्पष्टता पादटिप्पणी में सुरक्षित रखी गई है।
