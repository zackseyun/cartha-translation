  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יִּפְרֹ֤שׂ אוֹתָ/הּ֙ לְ/פָנַ֔/י וְ/הִ֥יא כְתוּבָ֖ה פָּנִ֣ים וְ/אָח֑וֹר וְ/כָת֣וּב אֵלֶ֔י/הָ קִנִ֥ים וָ/הֶ֖גֶה וָ/הִֽי׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/002/010.yaml
  text: And he spread it out before me[a], and it was written on the front and on the back[b]; and written on it were lamentations and mourning and woe.
translation:
  language: hi
  text: और उसने उस पुस्तक को मेरे सामने खोलकर फैला दिया, और वह आगे और पीछे[a] लिखी हुई थी; उस पर विलाप, कराह और हाय लिखे थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “भीतर और बाहर।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפְרֹשׂ
  choice: खोलकर फैला दिया
  rationale: פרשׂ का मूल अर्थ फैलाना या खोलना है। पुस्तक/लपेटे हुए पत्र के प्रसंग में यह भौतिक क्रिया को स्वाभाविक हिन्दी में व्यक्त करता है, बिना केवल ‘खोल दिया’ तक सीमित किए।
- source_word: לְפָנַי
  choice: मेरे सामने
  rationale: स्थानसूचक अर्थ का सीधा और स्वाभाविक आधुनिक हिन्दी रूप।
- source_word: כְתוּבָה פָּנִים וְאָחוֹר
  choice: उस पर आगे और पीछे दोनों ओर लिखा हुआ था
  rationale: शाब्दिक ‘आगे और पीछे’ को बनाए रखते हुए स्पष्ट किया गया है कि लेख दोनों सतहों पर था; ‘भीतर और बाहर’ पारंपरिक किंतु अधिक व्याख्यात्मक विकल्प है।
- source_word: קִנִים
  choice: विलाप
  rationale: यह शब्द शोकगीतों या विलापों को सूचित करता है; ‘विलाप’ गंभीरता और व्यापक अर्थ दोनों बनाए रखता है।
- source_word: הֶגֶה
  choice: कराह
  rationale: यहाँ संज्ञा कराहने, आह भरने या धीमे शोकपूर्ण स्वर को व्यक्त करती है। ‘कराह’ मूल ध्वन्यात्मक और दुःखपूर्ण भाव को ‘शोक’ की तुलना में अधिक निकटता से रखता है।
- source_word: הִי
  choice: हाय
  rationale: विपत्ति और विलाप की पुकार के लिए भविष्यद्वक्ताओं की भाषा में स्वाभाविक हिन्दी समतुल्य।
theological_decisions:
- issue: पुस्तक पर लिखी तीन शोकसूचक अभिव्यक्तियों का रूप
  choice: विलाप, कराह और हाय
  alternative: शोकगीत, मातम और विपत्ति
  rationale: तीनों अलग लेकिन संबंधित शब्दों की संचयी, अशुभ शक्ति को सुरक्षित रखा गया है और किसी अतिरिक्त धर्मवैज्ञानिक अर्थ को नहीं जोड़ा गया।
- issue: पुस्तक के दोनों पृष्ठों का वर्णन
  choice: आगे और पीछे दोनों ओर
  alternative: भीतर और बाहर
  rationale: इब्रानी अभिव्यक्ति के स्थानगत रूप को निकटता से रखा गया है। पारंपरिक विकल्प संभव है, पर वह पुस्तक की संरचना के बारे में अधिक विशिष्ट व्याख्या कर सकता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘पुस्तक’ तत्कालीन लपेटे हुए लेख-पत्र के लिए प्रसंगानुकूल बाइबलीय शब्द है; ‘कराह’ הֶגֶה की ध्वन्यात्मक पीड़ा को स्पष्ट रखता है।
