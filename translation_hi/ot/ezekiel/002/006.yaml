base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/002/006.yaml
  text: But you[a], son of man, do not fear them, and do not fear their words, though briers and thorns are with you and you sit among scorpions. Do not fear their words, and do not be dismayed by their faces[b], for they are a rebellious house.
translation:
  language: hi
  text: परन्तु हे मनुष्य-पुत्र, तू उनसे मत डरना और न उनकी बातों से डरना। चाहे कँटीली झाड़ियाँ[a] और काँटे तेरे साथ हों और तू बिच्छुओं के बीच बैठा हो, फिर भी उनकी बातों से मत डरना और उनके चेहरों से न घबराना[b], क्योंकि वे एक विद्रोही घराना हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या सम्भवतः, “विद्रोही और काँटे तेरे साथ हों।” जिस इब्रानी शब्द का अनुवाद “कँटीली झाड़ियाँ” किया गया है, वह कठिन है और उसके एक से अधिक अर्थ समझे गए हैं; पर आसपास के बिंब कँटीले संकट के रूपक का समर्थन करते हैं।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “उनके चेहरों से”; अर्थात उनकी भय दिखाने वाली मुख-मुद्रा या उपस्थिति से।
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶן אָדָם
  choice: हे मनुष्य के पुत्र
  rationale: यहेजकेल में बार-बार प्रयुक्त इस प्रत्यक्ष सम्बोधन की पुरुषवाचक एकवचन संरचना और आलंकारिक प्रभाव को बनाए रखता है।
- source_word: תִּירָא
  choice: मत डरना
  rationale: निषेधात्मक आज्ञा और पद में इसकी पुनरावृत्ति को सरल, स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: דִּבְרֵיהֶם
  choice: उनकी बातें
  rationale: शब्दशः बहुवचन भाव और विरोधियों के कहे हुए वचनों पर बल बनाए रखता है; हिन्दी में ‘उनके शब्दों’ की अपेक्षा अधिक स्वाभाविक है।
- source_word: סָרָבִים
  choice: कँटीली झाड़ियाँ
  rationale: यह दुर्लभ और कठिन शब्द है। साथ आए ‘काँटे’ और ‘बिच्छू’ खतरनाक, चुभनेवाली वनस्पति के रूपक का समर्थन करते हैं; वैकल्पिक अर्थ को पादटिप्पणी में रखा गया है।
- source_word: סַלּוֹנִים
  choice: काँटे
  rationale: निकटवर्ती कँटीली वनस्पति के बिंब को स्पष्ट और सहज हिन्दी में व्यक्त करता है।
- source_word: אוֹתָךְ
  choice: तेरे साथ हों
  rationale: संक्षिप्त इब्रानी रचना को बिना ‘तेरे विरुद्ध’ या ‘तुझे घेरे हुए’ जैसा अतिरिक्त अर्थ जोड़े प्रस्तुत करता है।
- source_word: עַקְרַבִּים
  choice: बिच्छू
  rationale: खतरे और शत्रुता के स्पष्ट रूपक का सीधा शाब्दिक समतुल्य है।
- source_word: יוֹשֵׁב
  choice: तू ... बीच बैठा हो
  rationale: मूल क्रिया ‘बैठना’ को बनाए रखते हुए אֶל के प्रसंगगत स्थान-संबंध को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: מִפְּנֵיהֶם
  choice: उनके चेहरों से
  rationale: मूल के ठोस ‘चेहरों’ वाले बिंब को सुरक्षित रखता है; इससे आशय उनकी भयप्रद मुख-मुद्रा या उपस्थिति है।
- source_word: תֵּחָת
  choice: न घबराना
  rationale: निपाल रूप में टूट जाने, आतंकित या निरुत्साहित हो जाने का भाव है; ‘घबराना’ साधारण पाठक के लिए स्वाभाविक है और पहले आए ‘डरना’ से हल्का भेद भी बनाए रखता है।
- source_word: בֵּית מְרִי
  choice: एक विद्रोही घराना
  rationale: यहेजकेल की विशिष्ट सामूहिक उपमा ‘घराना’ को बनाए रखता है और מְרִי की उद्दंड अवज्ञा को ‘विद्रोही’ से व्यक्त करता है।
theological_decisions:
- issue: בֶן אָדָם में אָדָם का अनुवाद
  choice: हे मनुष्य के पुत्र
  alternative: हे नश्वर मनुष्य
  rationale: यह यहेजकेल के लिए बार-बार आने वाला ईश्वरीय सम्बोधन है। मूल की पुत्र-संरचना और पुरुषवाचक एकवचन को बनाए रखना किसी बाद की धर्मवैज्ञानिक पहचान को पद में आरोपित किए बिना उसके साहित्यिक प्रभाव को सुरक्षित रखता है।
- issue: विरोधियों के लिए प्रयुक्त संकटकारी रूपक
  choice: कँटीली झाड़ियों, काँटों और बिच्छुओं के बिंब को बनाए रखना
  alternative: वे विद्रोही और हानिकारक लोग हैं
  rationale: भविष्यद्वाणी की तीव्रता इन ठोस बिंबों में निहित है। उन्हें अमूर्त कथन में बदलना मूल की अलंकारिक शक्ति और बनी हुई अस्पष्टता को घटा देता।
- issue: כִּי का प्रसंगगत संबंध
  choice: पहले प्रयोग को ‘चाहे ... फिर भी’ और अंतिम प्रयोग को ‘क्योंकि’ से व्यक्त करना
  alternative: दोनों स्थानों पर ‘क्योंकि’
  rationale: पहला כִּי उस भयावह परिस्थिति को स्वीकार करते हुए निषेध को बल देता है, जबकि अंतिम כִּי आज्ञा का कारण बताता है। यह भेद हिन्दी में तर्क-संबंध को स्वाभाविक बनाता है।
