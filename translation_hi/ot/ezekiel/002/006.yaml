  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किन्तु सहज शैली अपनाई गई है। परमेश्वर द्वारा भविष्यद्वक्ता से एकवचन निकट सम्बोधन होने के कारण ‘तू/तेरे’ रखा गया है। मूल की तीन बार दोहराई गई भय-निषेधात्मक भाषा, ठोस रूपक और ‘विद्रोही घराना’ पदबंध सुरक्षित रखे गए हैं।
