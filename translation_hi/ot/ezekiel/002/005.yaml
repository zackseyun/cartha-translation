source:
  edition: WLC
  text: וְ/הֵ֨מָּה֙ אִם יִשְׁמְע֣וּ וְ/אִם יֶחְדָּ֔לוּ כִּ֛י בֵּ֥ית מְרִ֖י הֵ֑מָּה וְ/יָ֣דְע֔וּ כִּ֥י נָבִ֖יא הָיָ֥ה בְ/תוֹכָֽ/ם־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/002/005.yaml
  text: And whether they listen or refuse—for they are a rebellious house—they will know that a prophet has been among them[a][b].
translation:
  language: hi
  text: और चाहे वे सुनें या सुनने से इनकार करें—क्योंकि वे विद्रोही घराने के लोग हैं—वे जान लेंगे कि उनके बीच एक भविष्यद्वक्ता रहा है[a][b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “चाहे वे सुनें या विरत रहें”; इब्रानी में शाब्दिक विरोध “सुनने” और “विरत रहने” के बीच है, जिसका यहाँ आशय संदेश पर ध्यान देने से इनकार करना है।
    reason: lexical_alternative
  - marker: b
    text: या, “उनके मध्य रहा है।”
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם יִשְׁמְעוּ ... וְאִם יֶחְדָּלוּ
  choice: चाहे वे सुनें या सुनने से इनकार करें
  rationale: दोनों אִם-वाक्यांश दो संभावित प्रतिक्रियाएँ रखते हैं, पर परिणाम एक ही है। יִשְׁמְעוּ यहाँ केवल ध्वनि सुनने से अधिक संदेश पर ध्यान देने का भाव रखता है; יֶחְדָּלוּ का शाब्दिक अर्थ ‘रुकना/बाज़ आना’ है, पर इस संदर्भ में संदेश सुनने से इनकार करना अभिप्रेत है।
- source_word: בֵּית מְרִי
  choice: विद्रोही घराने के लोग
  rationale: ‘घराना’ इब्रानी के सामूहिक और वाचा-संबंधी रूपक को बनाए रखता है; ‘के लोग’ जोड़ने से आधुनिक हिन्दी में यह स्वाभाविक और स्पष्ट रहता है।
- source_word: וְיָדְעוּ
  choice: वे जान लेंगे
  rationale: शर्तसूचक वाक्यांशों के बाद यह रूप भावी परिणाम व्यक्त करता है। ‘जान लेंगे’ आधुनिक हिन्दी में उस परिणाम और होने वाली पहचान को सहज ढंग से बताता है।
- source_word: נָבִיא
  choice: एक भविष्यद्वक्ता
  rationale: संज्ञा का अनिश्चित अर्थ है; ‘एक भविष्यद्वक्ता’ इसका सीधा और प्रचलित हिन्दी अनुवाद है।
- source_word: הָיָה בְתוֹכָם
  choice: उनके बीच ... रहा है
  rationale: शाब्दिक भाव ‘उनके बीच था’ है। ‘रहा है’ अतीत में उसकी उपस्थिति और बाद में पहचाने जाने वाली उसकी वर्तमान प्रासंगिकता, दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וְהֵמָּה
  choice: और
  rationale: आरंभिक सर्वनाम बलाघात देता है, किंतु हिन्दी में ‘वे’ को अगली उपवाक्य-रचना में रखने से अनावश्यक पुनरुक्ति के बिना उसका संकेत बना रहता है।
theological_decisions:
- issue: लोगों की प्रतिक्रिया का स्वरूप
  choice: लोग संदेश पर ध्यान दें या उसे सुनने से इनकार करें, दोनों दशाओं में वे भविष्यद्वक्ता की उपस्थिति पहचान लेंगे।
  alternative: ‘सुनें’ को केवल कानों से सुनने और ‘रुकें’ को शाब्दिक रूप में लिया जा सकता है।
  rationale: संदर्भ में विरोध केवल श्रवण और अश्रवण का नहीं, बल्कि संदेश ग्रहण करने और उसे ठुकराने का है। फिर भी पादटिप्पणी में शाब्दिक विकल्प देकर मूल की शब्दगत व्यापकता सुरक्षित रखी गई है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। ‘विद्रोही घराने के लोग’ मूल रूपक को बनाए रखते हुए हिन्दी की स्वाभाविकता देता है। दोनों पादटिप्पणी-चिह्न मुख्य पाठ में सम्मिलित हैं।
