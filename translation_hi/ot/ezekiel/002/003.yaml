  text: וַ/יֹּ֣אמֶר אֵלַ֗/י בֶּן אָדָם֙ שׁוֹלֵ֨חַ אֲנִ֤י אֽוֹתְ/ךָ֙ אֶל בְּנֵ֣י יִשְׂרָאֵ֔ל אֶל גּוֹיִ֥ם הַ/מּוֹרְדִ֖ים אֲשֶׁ֣ר מָרְדוּ בִ֑/י הֵ֤מָּה וַ/אֲבוֹתָ/ם֙ פָּ֣שְׁעוּ בִ֔/י עַד עֶ֖צֶם הַ/יּ֥וֹם הַ/זֶּֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/002/003.yaml
  text: And he said to me[a], “Son of man, I am sending you to the sons of Israel, to the rebellious nations that have rebelled against me; they and their fathers have transgressed against me to this very day.”
translation:
  language: hi
  text: उसने मुझसे कहा, “हे मनुष्य के पुत्र[a], मैं तुझे इस्राएल के पुत्रों के पास—उन विद्रोही जातियों के पास—भेज रहा हूँ, जिन्होंने मेरे विरुद्ध विद्रोह किया है। उन्होंने और उनके पुरखों ने आज के इस दिन तक मेरे विरुद्ध अपराध किया है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “हे मानव,” अथवा “हे नश्वर मनुष्य।”
    reason: בֶּן אָדָם के अर्थ-समीपी वैकल्पिक अनुवाद।
lexical_decisions:
- source_word: בֶּן אָדָם
  choice: हे मनुष्य के पुत्र
  rationale: यहेजकेल को बार-बार दिए जाने वाले संबोधन का रूप और उसका अंतरपाठीय प्रभाव सुरक्षित रहता है। यह यहाँ मसीह-संबंधी उपाधि नहीं, बल्कि नबी को उसकी मानवीय स्थिति में संबोधन है; अधिक व्याख्यात्मक विकल्प पादटिप्पणी में दिए गए हैं।
- source_word: שׁוֹלֵחַ אֲנִי אֽוֹתְךָ
  choice: मैं तुझे ... भेज रहा हूँ
  rationale: सर्वनाम सहित कृदंत भाव तत्काल और जारी किए जा रहे आदेश का बोध देता है; हिंदी में यह स्वाभाविक और सजीव है।
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: इस्राएल के पुत्रों
  rationale: हिब्रू पदबंध की वंशगत और औपचारिक अभिव्यक्ति को बनाए रखता है। संदर्भ संपूर्ण इस्राएली समुदाय का है।
- source_word: גּוֹיִם הַמּוֹרְדִים
  choice: उन विद्रोही जातियों
  rationale: גּוֹיִם का बहुवचन और इस्राएल पर उसका चौंकाने वाला प्रयोग सुरक्षित रखा गया है। 'उन' हिब्रू निश्चितता को स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: מָרְדוּ בִי
  choice: मेरे विरुद्ध विद्रोह किया है
  rationale: मूल में הַמּוֹרְדִים और מָרְדוּ की धातुगत पुनरावृत्ति को 'विद्रोही/विद्रोह' द्वारा बनाए रखा गया है।
- source_word: פָּשְׁעוּ בִי
  choice: मेरे विरुद्ध अपराध करते आए हैं
  rationale: פשע को מרד से अलग रखा गया है। 'अपराध' जानबूझकर सीमा या निष्ठा भंग करने का भाव देता है, जबकि 'करते आए हैं' पूर्वजों से वर्तमान दिन तक निरंतरता व्यक्त करता है।
- source_word: עַד עֶצֶם הַיּוֹם הַזֶּה
  choice: आज के इसी दिन तक
  rationale: עֶצֶם की तीव्रता को 'इसी' द्वारा व्यक्त किया गया है और वाक्यांश वर्तमान दिन तक जारी स्थिति पर बल देता है।
theological_decisions:
- issue: इस्राएल के लिए גּוֹיִם का असामान्य प्रयोग
  choice: जातियों
  alternative: लोगों / इस्राएलियों
  rationale: मूल पाठ इस्राएल को बहुवचन 'जातियाँ' कहकर अभियोग की तीक्ष्णता बढ़ाता है। इसे सामान्य 'लोग' बनाना उस अलंकारिक झटके और वास्तविक बहुवचन को कम कर देता।
- issue: בֶּן אָדָם संबोधन का अर्थ
  choice: मनुष्य के पुत्र
  alternative: मानव / नश्वर मनुष्य
  rationale: यहाँ यह यहेजकेल के लिए बारंबार प्रयुक्त भविष्यद्वक्तीय संबोधन है, न कि स्वतः कोई मसीह-संबंधी दावा। मुख्य पाठ में रूपात्मक और धर्मग्रंथीय प्रतिध्वनि रखी गई है, जबकि अर्थ-समीपी विकल्प पादटिप्पणी में हैं।
- issue: פשע और מרד के भेद को बनाए रखना
  choice: विद्रोह ... अपराध
  alternative: दोनों के लिए 'विद्रोह'
  rationale: दो अलग हिब्रू धातुओं को एक शब्द में मिलाने के बजाय, राजनीतिक/व्यक्तिगत विद्रोह और दोषपूर्ण निष्ठाभंग के बीच मूल का शब्दगत तनाव बनाए रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य रखी गई है। परमेश्वर द्वारा नबी को संबोधन में एकवचन ‘तू’ का रूप निकटता और अधिकार दोनों व्यक्त करता है। डैश द्वारा ‘इस्राएल के पुत्रों’ और चौंकाने वाले समानाधिकरण ‘उन विद्रोही जातियों’ का संबंध स्पष्ट किया गया है, बिना मूल की असामान्यता मिटाए।
