    reason: מְגִלַּת סֵפֶר के मुहावरेदार मुख्य अनुवाद और उसके शाब्दिक रूप, दोनों को स्पष्ट करना।
lexical_decisions:
- source_word: וָאֶרְאֶה
  choice: तब मैंने देखा
  rationale: वाव-क्रम कथा को आगे बढ़ाता है और ראה नए दृश्य का परिचय देता है; यह अनुवाद प्रथम पुरुष और कथात्मक प्रगति दोनों बनाए रखता है।
- source_word: וְהִנֵּה
  choice: और देखो
  rationale: הִנֵּה अचानक सामने आए दृश्य की ओर सजीव और गंभीर ढंग से ध्यान खींचता है; दोनों occurrences को बनाए रखा गया है।
- source_word: יָד
  choice: एक हाथ
  rationale: मूल पाठ केवल ‘हाथ’ कहता है और उसके स्वामी की पहचान नहीं बताता; इसलिए किसी परमेश्वर या स्वर्गदूत को नहीं जोड़ा गया।
- source_word: שְׁלוּחָה אֵלָי
  choice: मेरी ओर बढ़ा हुआ था
  rationale: निष्क्रिय कृदंत और दिशासूचक אֵלַי मिलकर यह दृश्य देते हैं कि हाथ यहेजकेल की ओर बढ़ाया गया है।
- source_word: בּוֹ
  choice: उसमें
  rationale: सर्वनाम को यथासंभव अनिर्दिष्ट रखा गया है; हिन्दी में यह सामने दिखाई दे रहे हाथ की ओर स्वाभाविक रूप से संकेत करता है, बिना उसके स्वामी को निर्दिष्ट किए।
- source_word: מְגִלַּת סֵפֶר
  choice: एक पुस्तक की लपेटी हुई पांडुलिपि
  rationale: यह चयन מְגִלָּה की लपेटी हुई पांडुलिपि और סֵפֶר के पुस्तक/लिखित दस्तावेज—दोनों घटकों को आधुनिक हिन्दी में समझने योग्य रूप में व्यक्त करता है; संक्षिप्त विकल्प पादटिप्पणी में दिया गया है।
theological_decisions:
- issue: हाथ किसका था
  choice: हाथ के स्वामी को अनिर्दिष्ट रखना
  alternative: ‘परमेश्वर का हाथ’ या ‘किसी स्वर्गदूत का हाथ’ कहना
  rationale: इब्रानी पद केवल ‘एक हाथ’ प्रस्तुत करता है। स्वामी की पहचान जोड़ना मूल पाठ से आगे जाकर धार्मिक व्याख्या को अनुवाद में मिला देता।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज किन्तु गरिमापूर्ण भविष्यद्वक्तीय वर्णन। ‘और देखो’ की पुनरावृत्ति मूल पाठ की दृश्यात्मक तात्कालिकता बनाए रखती है; हाथ के स्वामी की पहचान जानबूझकर नहीं जोड़ी गई।
