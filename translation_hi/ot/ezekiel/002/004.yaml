  choice: यों कहते हैं
  rationale: यह मानक भविष्यद्वक्तीय संदेश-सूत्र है। ‘यों कहते हैं’ उसकी गरिमा और प्रचलित हिन्दी शैली को बनाए रखता है।
- source_word: אֲדֹנָי יְהוִה
