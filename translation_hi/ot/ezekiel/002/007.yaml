  text: וְ/דִבַּרְתָּ֤ אֶת דְּבָרַ/י֙ אֲלֵי/הֶ֔ם אִֽם יִשְׁמְע֖וּ וְ/אִם יֶחְדָּ֑לוּ כִּ֥י מְרִ֖י הֵֽמָּה־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/002/007.yaml
  text: You shall speak my words to them[a], whether they listen or whether they refuse, for they are rebellious.
translation:
  language: hi
  text: तुम उनसे मेरे वचन कहना, चाहे वे सुनें या सुनने से इनकार करें, क्योंकि वे विद्रोही हैं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְדִבַּרְתָּ
  choice: तुम ... कहना
  rationale: संयोजक वाव के साथ क़ाल पूर्ण रूप यहाँ आदेशात्मक संदर्भ में यहेजकेल को दिए गए निर्देश का बल रखता है। आधुनिक हिन्दी में ‘कहना’ इस आज्ञा को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: אֶת דְּבָרַי
  choice: मेरे वचन
  rationale: דָּבָר के बहुवचन और प्रथम पुरुष एकवचन प्रत्यय को ठोस रूप में रखा गया है; ‘संदेश’ की अपेक्षा ‘वचन’ परमेश्वर के बोले हुए शब्दों से संबंध बनाए रखता है।
- source_word: אֲלֵיהֶם
  choice: उनसे
  rationale: हिन्दी में किसी व्यक्ति को वचन कहने के लिए ‘उनसे कहना’ स्वाभाविक प्रयोग है और इब्रानी दिशा-संबंधी अर्थ को स्पष्ट करता है।
- source_word: אִם יִשְׁמְעוּ וְאִם יֶחְדָּלוּ
  choice: चाहे वे सुनें या सुनने से इनकार करें
  rationale: यह यहेजकेल में बार-बार आने वाला सूत्र सकारात्मक प्रतिक्रिया और ध्यान न देने की प्रतिक्रिया का विरोध करता है। ‘सुनें’ श्रवण और ध्यान देने, दोनों की संभावना खुली रखता है; ‘सुनने से इनकार करें’ יֶחְדָּלוּ के मुहावरेगत आशय को स्पष्ट करता है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यह उनकी प्रतिक्रिया की परवाह किए बिना नबी के बोलने का कारण बताता है।
- source_word: מְרִי הֵמָּה
  choice: वे विद्रोही हैं
  rationale: מְרִי विद्रोह या विद्रोहीपन को दर्शाता है। इस पद में ‘घराना’ नहीं है, इसलिए उसे निकटवर्ती संदर्भ से नहीं जोड़ा गया; विधेयात्मक हिन्दी मूल भाव को स्वाभाविक रूप से व्यक्त करती है।
theological_decisions:
- issue: יִשְׁמְעוּ का अर्थ ‘सुनना’ रखा जाए या ‘आज्ञा मानना’
  choice: सुनें
  alternative: आज्ञा मानें
  rationale: שׁמע में आज्ञापालन का भाव समाया हो सकता है, पर यहाँ विरोध सुनने और ध्यान देने से इनकार करने के बीच है। ‘सुनें’ मूल शब्द की अर्थगत व्यापकता और पाठ के तनाव को सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘वचन’ बाइबलीय संदर्भ में परिचित है, जबकि वाक्य-विन्यास वर्तमान मानक हिन्दी के अनुरूप है।
