lexical_decisions:
- source_word: וַיֹּאמֶר אֵלַי
  choice: और उसने मुझसे कहा
  rationale: कथात्मक וַיֹּאמֶר को सरल भूतकाल में रखा गया है। ‘कहा’ यहाँ אמר का स्वाभाविक हिन्दी अर्थ है, और ‘उसने’ मूल के कर्ता-सर्वनाम को बनाए रखता है।
- source_word: בֶּן אָדָם
  choice: हे मनुष्य के पुत्र
  rationale: यह मूल इब्रानी पदबंध का निकट और गरिमापूर्ण रूप है तथा यहेजकेल को बार-बार दिए जाने वाले विशिष्ट संबोधन को सुरक्षित रखता है। ‘हे’ हिन्दी में संबोधन को स्पष्ट करता है।
- source_word: עֲמֹד עַל רַגְלֶיךָ
  choice: अपने पैरों पर खड़ा हो जा
  rationale: आज्ञार्थक क्रिया और ठोस शारीरिक बिंब दोनों सुरक्षित हैं। ‘अपने पैरों पर खड़ा हो जा’ आधुनिक हिन्दी में सीधा और स्वाभाविक आदेश है।
- source_word: וַאֲדַבֵּר אֹתָךְ
  choice: और मैं तुझसे बात करूँगा
  rationale: आज्ञा के बाद होने वाली क्रिया को भविष्यकाल में व्यक्त किया गया है। ‘तुझसे बात करूँगा’ हिन्दी में स्वाभाविक है और इब्रानी रचना में निहित ‘तुझसे/तेरे साथ बोलना’ तथा ‘तुझे संबोधित करना’ के बीच की हल्की अस्पष्टता को काफी हद तक बनाए रखता है।
theological_decisions:
- issue: यहेजकेल में בֶּן אָדָם का अनुवाद
  choice: हे मनुष्य के पुत्र
  alternative: हे मनुष्य / हे नश्वर मनुष्य
  rationale: शाब्दिक और साहित्यिक रूप से चिह्नित संबोधन को बनाए रखने से पाठ की अपनी शब्दावली सुरक्षित रहती है। यह अनुवाद इस पद में बाद की मसीही व्याख्या आरोपित नहीं करता, न ही ‘नश्वर’ जोड़कर अर्थ को अनावश्यक रूप से सीमित करता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। एकवचन ‘तू’ के रूप (‘अपने’, ‘हो जा’, ‘तुझसे’) मूल इब्रानी के सीधे एकवचन संबोधन को दर्शाते हैं; इन्हें अनादर व्यक्त करने के लिए नहीं चुना गया है।
