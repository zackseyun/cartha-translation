  text: חֹֽבְרֹ֛ת אִשָּׁ֥ה אֶל אֲחוֹתָ֖/הּ כַּנְפֵי/הֶ֑ם לֹא יִסַּ֣בּוּ בְ/לֶכְתָּ֔/ן אִ֛ישׁ אֶל עֵ֥בֶר פָּנָ֖י/ו יֵלֵֽכוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/001/009.yaml
  text: Their wings were joined[a], each to her sister. As they moved, they did not turn[b]; each one went straight ahead.
translation:
  language: hi
  text: उनके पंख एक-दूसरे से जुड़े हुए थे। चलते समय वे मुड़ते नहीं थे; हर एक अपने मुख की दिशा में जाता था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חֹבְרֹת
  choice: जुड़े हुए थे
  rationale: यह חבר का निष्क्रिय कृदन्त है और पंखों के परस्पर जुड़े होने की अवस्था व्यक्त करता है।
- source_word: אִשָּׁה אֶל אֲחוֹתָהּ
  choice: एक-दूसरे से
  rationale: शाब्दिक रूप से ‘एक स्त्री अपनी बहन से’ समान अंगों के परस्पर संबंध की हिब्रू अभिव्यक्ति है; हिन्दी में ‘एक-दूसरे से’ इसका स्वाभाविक अर्थ देता है।
- source_word: כַּנְפֵיהֶם
  choice: उनके पंख
  rationale: बहुवचन स्वामित्व सहित संज्ञा का सीधा और स्वाभाविक हिन्दी रूप।
- source_word: לֹא יִסַּבּוּ
  choice: वे मुड़ते नहीं थे
  rationale: סבב यहाँ चलते हुए दिशा बदलने या मुड़ने को दर्शाता है; अपूर्ण क्रिया का यह रूप दर्शन में उनके नियमित ढंग को भी व्यक्त करता है।
- source_word: בְּלֶכְתָּן
  choice: चलते समय
  rationale: ב के साथ infinitive construct समकालिक क्रिया बताता है; स्त्रीलिंग बहुवचन प्रत्यय निकटवर्ती जीवित प्राणियों की ओर संकेत करता है।
- source_word: אִישׁ
  choice: हर एक
  rationale: यहाँ शब्द वितरणात्मक अर्थ में प्रत्येक जीवित प्राणी के लिए है, न कि पुरुष लिंग पर बल देने के लिए।
- source_word: אֶל עֵבֶר פָּנָיו
  choice: अपने मुख की दिशा में
  rationale: शाब्दिक स्थानिक अभिव्यक्ति को बनाए रखते हुए उस दिशा को स्पष्ट करता है जिस ओर प्रत्येक का मुख था; केवल ‘सीधे आगे’ कहने से संभावित सूक्ष्मता घट सकती थी।
- source_word: יֵלֵכוּ
  choice: आगे बढ़ता था
  rationale: הלך गति या जाने को व्यक्त करता है; एकवचन वितरणात्मक कर्ता ‘हर एक’ के साथ हिन्दी में एकवचन रूप स्वाभाविक है।
theological_decisions: []
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और दृश्यात्मक शैली रखी गई है। हिब्रू के स्त्रीलिंग मुहावरे का शाब्दिक अनुवाद हिन्दी में भ्रामक होता, इसलिए उसके संबंधसूचक अर्थ को मुख्य पाठ में स्वाभाविक रूप दिया गया है। अंतिम वाक्यांश को ‘सीधे आगे’ के बजाय ‘अपने मुख की दिशा में’ रखा गया है ताकि मूल की स्थानिक अभिव्यक्ति और बहुमुखी प्राणियों के संदर्भ की संभावित अर्थ-छाया बनी रहे।
