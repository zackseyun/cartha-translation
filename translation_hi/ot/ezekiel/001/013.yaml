  text: וּ/דְמ֨וּת הַ/חַיּ֜וֹת מַרְאֵי/הֶ֣ם כְּ/גַחֲלֵי אֵ֗שׁ בֹּֽעֲרוֹת֙ כְּ/מַרְאֵ֣ה הַ/לַּפִּדִ֔ים הִ֕יא מִתְהַלֶּ֖כֶת בֵּ֣ין הַ/חַיּ֑וֹת וְ/נֹ֣גַהּ לָ/אֵ֔שׁ וּ/מִן הָ/אֵ֖שׁ יוֹצֵ֥א בָרָֽק־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/001/013.yaml
  text: And as for the likeness of the living creatures[a], their appearance was like burning coals of fire, like the appearance of torches; it was moving about among the living creatures, and the fire had brightness[c][b], and from the fire lightning was coming forth.
translation:
  language: hi
  text: और जीवित प्राणियों की आकृति के विषय में, उनका रूप जलते हुए आग के अंगारों जैसा, और मशालों के दिखाई देने के ढंग जैसा था। वह[a] जीवित प्राणियों के बीच इधर-उधर चल रही थी; आग दीप्तिमान थी, और आग में से बिजली निकल रही थी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘वह’ का संकेत संभवतः आग-जैसे रूप की ओर है; इब्रानी में इसका सटीक पूर्वपद स्पष्ट नहीं है।
    reason: referential_ambiguity
lexical_decisions:
- source_word: וּדְמוּת הַחַיּוֹת
  choice: जीवित प्राणियों की समानता के विषय में
  rationale: דְמוּת का मूल अर्थ ‘समानता/प्रतिरूप’ बनाए रखते हुए आरंभिक वाक्यांश को विषय-प्रस्तावना के रूप में व्यक्त किया गया है।
- source_word: מַרְאֵיהֶם
  choice: उनका रूप
  rationale: מַרְאֶה यहाँ दृश्य रूप या दिखाई देने वाली दशा बताता है; ‘रूप’ सहज और संक्षिप्त है।
- source_word: כְּגַחֲלֵי אֵשׁ בֹּעֲרוֹת
  choice: आग के जलते हुए अंगारों जैसा
  rationale: यह अनुवाद आग के अंगारों और उनके सक्रिय रूप से जलने—दोनों तत्वों को सुरक्षित रखता है।
- source_word: כְּמַרְאֵה הַלַּפִּדִים
  choice: मशालों के रूप जैसा
  rationale: तुलना में उपस्थित מַרְאֵה को छोड़े बिना לַפִּדִים का सीधा अर्थ ‘मशालें’ लिया गया है।
- source_word: הִיא מִתְהַלֶּכֶת
  choice: वह इधर-उधर चलती थी
  rationale: स्त्रीलिंग एकवचन सर्वनाम को ‘वह’ से रखा गया है और התהלך की घूमने अथवा बार-बार आने-जाने की क्रिया ‘इधर-उधर चलती थी’ से व्यक्त हुई है।
- source_word: בֵּין הַחַיּוֹת
  choice: जीवित प्राणियों के बीच
  rationale: בֵּין का सीधा संबंधपरक अर्थ ‘के बीच’ बहुवचन समूह के संदर्भ में स्वाभाविक है।
- source_word: וְנֹגַהּ לָאֵשׁ
  choice: आग में चमक थी
  rationale: शाब्दिक संबंध ‘आग के लिए/आग में चमक’ को सहज हिन्दी में व्यक्त किया गया है, बिना चमक के स्वरूप को अधिक परिभाषित किए।
- source_word: וּמִן הָאֵשׁ יוֹצֵא בָרָק
  choice: आग में से बिजली निकलती थी
  rationale: सहभागी रूप יוֹצֵא की जारी अथवा बार-बार घटती क्रिया को ‘निकलती थी’ से बनाए रखा गया है।
theological_decisions:
- issue: स्त्रीलिंग एकवचन הִיא का सटीक पूर्वपद
  choice: ‘वह’ रखकर आग-जैसी दृश्य सत्ता की ओर संकेत, पर सटीक पूर्वपद खुला रखा गया
  alternative: इसे स्पष्ट रूप से ‘आग’ या संपूर्ण ‘रूप’ कहना
  rationale: इब्रानी व्याकरण स्त्रीलिंग एकवचन संकेत देता है, पर निकटवर्ती चित्रण में इसका सटीक संदर्भ पूर्णतः निश्चित नहीं है। ‘वह’ मूल अस्पष्टता को सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, दृश्यात्मक और सामान्य पाठक के लिए सुबोध रूप। ‘जीवित प्राणी’, ‘अंगारे’, ‘मशालें’ और ‘बिजली’ जैसे ठोस शब्द दर्शन की तीव्रता बनाए रखते हैं; सर्वनाम की वास्तविक अस्पष्टता पादटिप्पणी में सुरक्षित है।
