source:
  edition: WLC
  text: וְ/אִ֛ישׁ אֶל עֵ֥בֶר פָּנָ֖י/ו יֵלֵ֑כוּ אֶ֣ל אֲשֶׁר֩ יִֽהְיֶה שָׁ֨מָּ/ה הָ/ר֤וּחַ לָ/לֶ֨כֶת֙ יֵלֵ֔כוּ לֹ֥א יִסַּ֖בּוּ בְּ/לֶכְתָּֽ/ן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/001/012.yaml
  text: And each one went straight ahead[a]. Wherever the spirit was to go, they went[b]; they did not turn as they went.
translation:
  language: hi
  text: और हर एक अपने मुख की दिशा में आगे बढ़ता था[b]। आत्मा[a] जिस ओर जाने को होती थी, वे उसी ओर जाते थे; चलते समय वे मुड़ते नहीं थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “वायु”; संभवतः “पवित्र आत्मा।” इब्रानी शब्द רוּחַ का अर्थ “आत्मा,” “वायु” या “श्वास” हो सकता है, और यह पद उसके अभिप्रेत संदर्भ को स्पष्ट रूप से नहीं बताता।
    reason: alternative_reading
  - marker: b
    text: शाब्दिक रूप से, “अपने मुख की दिशा की ओर।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִישׁ
  choice: और हर एक
  rationale: यहाँ אִישׁ चारों जीवित प्राणियों में से प्रत्येक को अलग-अलग सूचित करता है। ‘हर एक’ इस वितरणात्मक अर्थ को बनाए रखता है और उन्हें मनुष्य नहीं ठहराता।
- source_word: אֶל עֵבֶר פָּנָיו
  choice: अपने मुख की दिशा में आगे
  rationale: इस पदबंध का शाब्दिक अर्थ ‘उसके मुख की दिशा की ओर’ है। हिन्दी में चुना गया रूप उनकी बिना मुड़े सामने की ओर गति को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: יֵלֵכוּ
  choice: आगे बढ़ता था / जाते थे
  rationale: दर्शन के वर्णन में अपूर्ण क्रिया रूप नियमित या जारी अतीत की गति बताता है; हिन्दी का अपूर्ण भूतकाल इस प्रवाह को स्पष्ट करता है।
- source_word: אֶל אֲשֶׁר יִהְיֶה שָׁמָּה הָרוּחַ לָלֶכֶת
  choice: आत्मा को जहाँ कहीं जाना होता था
  rationale: यह रचना आत्मा द्वारा निर्धारित दिशा या गंतव्य को बताती है। यह हिन्दी रूप भाव को सहज रखता है, पर आत्मा की पहचान को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: הָרוּחַ
  choice: आत्मा
  rationale: רוּחַ का अर्थ ‘आत्मा’, ‘वायु’ या ‘श्वास’ हो सकता है। इस दर्शन में ‘आत्मा’ जीवित प्राणियों को दिशा देने वाली शक्ति के अनुकूल है, जबकि पादटिप्पणी वास्तविक शाब्दिक अस्पष्टता सुरक्षित रखती है।
- source_word: לֹא יִסַּבּוּ
  choice: वे मुड़ते नहीं थे
  rationale: סבב का निफ़अल रूप यहाँ दिशा बदलने या मुड़ने को दर्शाता है। चुना गया रूप सरल और सीधा है।
- source_word: בְּלֶכְתָּן
  choice: चलते समय
  rationale: בְּ के साथ infinitive construct साथ-साथ हो रही क्रिया बताता है; ‘चलते समय’ इसका स्वाभाविक आधुनिक हिन्दी रूप है।
theological_decisions:
- issue: क्या הָרוּחַ सीधे पवित्र आत्मा को सूचित करता है
  choice: आत्मा
  alternative: वायु; अथवा पवित्र आत्मा
  rationale: इब्रानी पाठ इस संदर्भ में הָרוּחַ की पहचान स्पष्ट रूप से पवित्र आत्मा के रूप में नहीं करता। इसलिए मुख्य पाठ में ‘आत्मा’ रखा गया है और अन्य संभावनाएँ पादटिप्पणी में दी गई हैं, ताकि धार्मिक तनाव और अस्पष्टता बनी रहे।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और कथात्मक रखी गई है। ‘हर एक’ से चार जीवित प्राणियों में से प्रत्येक का बोध होता है; ‘आत्मा’ को बिना धार्मिक अति-निर्धारण के रखा गया है।
