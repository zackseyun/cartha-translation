- source_word: לְאֶחָת / לְאַחַת לָהֶם
  choice: हर एक के / उनमें से हर एक के
  rationale: इब्रानी के वितरणात्मक भाव को बनाए रखता है और दूसरे खंड के לָהֶם (‘उनके/उनमें से’) को स्पष्ट रूप से दर्शाता है।
