lexical_decisions:
- source_word: וְיָדוֹת אָדָם
  choice: मनुष्य के हाथ
  rationale: יָדוֹת का अर्थ ‘हाथ’ है और אָדָם यहाँ हाथों के मानवीय स्वरूप को बताता है। हिन्दी में ‘मनुष्य के हाथ’ स्वाभाविक है और ‘मानवीय हाथ’ की अपेक्षा दृश्य को अधिक स्पष्ट रखता है।
- source_word: מִתַּחַת כַּנְפֵיהֶם
  choice: उनके पंखों के नीचे
  rationale: מִתַּחַת स्थानगत अर्थ में ‘नीचे’ या ‘तले’ है; आधुनिक हिन्दी में ‘पंखों के नीचे’ सीधा और सहज है।
- source_word: עַל אַרְבַּעַת רִבְעֵיהֶם
  choice: उनके चारों ओर
  rationale: רִבְעֵיהֶם चार दिशाओं या पार्श्वों को सूचित करता है। ‘चारों ओर’ वितरण और स्थान दोनों को स्वाभाविक हिन्दी में व्यक्त करता है, यद्यपि अधिक अक्षरशः रूप ‘उनके चारों पार्श्वों पर’ है।
- source_word: וּפְנֵיהֶם וְכַנְפֵיהֶם
  choice: उनके मुख और पंख
  rationale: פָּנִים को इस गरिमापूर्ण वर्णन में ‘मुख’ और כְּנָפַיִם को ‘पंख’ अनूदित किया गया है।
- source_word: לְאַרְבַּעְתָּם
  choice: उन चारों के ... थे
  rationale: यह पद चारों जीवित प्राणियों पर सामूहिक रूप से कथन लागू करता है। हिन्दी में निहित संबंध को ‘उन चारों के’ से स्पष्ट किया गया है।
