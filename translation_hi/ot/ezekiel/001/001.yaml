reference: Ezekiel 1:1
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יְהִ֣י בִּ/שְׁלֹשִׁ֣ים שָׁנָ֗ה בָּֽ/רְבִיעִי֙ בַּ/חֲמִשָּׁ֣ה לַ/חֹ֔דֶשׁ וַ/אֲנִ֥י בְ/תֽוֹךְ הַ/גּוֹלָ֖ה עַל נְהַר כְּבָ֑ר נִפְתְּחוּ֙ הַ/שָּׁמַ֔יִם וָ/אֶרְאֶ֖ה מַרְא֥וֹת אֱלֹהִֽים׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/001/001.yaml
  text: It happened in the thirtieth year[a], in the fourth month, on the fifth day of the month, while I was among the exiles by the Kebar River, the heavens were opened[b], and I saw visions of God.
translation:
  language: hi
  text: तीसवें वर्ष[a] के चौथे महीने के पाँचवें दिन, जब मैं निर्वासितों के बीच कबार नदी[b] के किनारे था, तब ऐसा हुआ कि आकाश खुल गया और मैंने परमेश्वर के दर्शन[c] देखे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यह ‘तीसवाँ वर्ष’ किस आरंभ-बिंदु से गिना गया है, इस पद में नहीं बताया गया।
    reason: chronological_ambiguity
  - marker: b
    text: संभवतः ‘कबार नहर’; इब्रानी में ‘कबार नदी’ है, पर यह बाबुल की कोई बड़ी नहर हो सकती है।
    reason: cultural_note
  - marker: c
    text: या ‘दिव्य दर्शन’ अथवा ‘परमेश्वर की ओर से दर्शन’।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: तब ऐसा हुआ
  rationale: यह कथा का आरंभ करने वाला रूप है। ‘तब ऐसा हुआ’ आधुनिक हिन्दी में स्वाभाविक है और अनावश्यक प्राचीन शैली से बचता है।
- source_word: בִּשְׁלֹשִׁים שָׁנָה
  choice: तीसवें वर्ष
  rationale: यह पदबंध किसी काल-गणना के तीसवें वर्ष को सूचित करता है, यद्यपि उस गणना का आरंभ इस पद में नहीं बताया गया।
- source_word: בָּרְבִיעִי בַּחֲמִשָּׁה לַחֹדֶשׁ
  choice: चौथे महीने के पाँचवें दिन
  rationale: इब्रानी तिथि-विधान को स्पष्ट और स्वाभाविक हिन्दी क्रम में व्यक्त किया गया है; पहले पदबंध में निहित ‘महीना’ अर्थ के अनुसार जोड़ा गया है।
- source_word: וַאֲנִי בְתוֹךְ הַגּוֹלָה
  choice: जब मैं निर्वासितों के बीच था
  rationale: וַאֲנִי यहाँ परिस्थितिसूचक उपवाक्य का काम करता है। הַגּוֹלָה सामूहिक रूप से निर्वासन में ले जाए गए लोगों को दर्शाता है।
- source_word: עַל נְהַר כְּבָר
  choice: कबार नदी के किनारे
  rationale: עַל स्थान के अर्थ में ‘किनारे’ है और כְּבָר को ‘कबार’ के रूप में लिप्यंतरित किया गया है। נְהַר का सीधा अर्थ ‘नदी’ है, यद्यपि ऐतिहासिक भूगोल में यह बड़ी नहर भी हो सकती है।
- source_word: נִפְתְּחוּ הַשָּׁמַיִם
  choice: आकाश खुल गए
  rationale: बहुवचन और कर्मवाच्य को यथासंभव बनाए रखते हुए दर्शनात्मक, गरिमामय स्वर रखा गया है।
- source_word: וָאֶרְאֶה מַרְאוֹת אֱלֹהִים
  choice: और मैंने परमेश्वर के दर्शन देखे
  rationale: ‘परमेश्वर के दर्शन’ इब्रानी संबंधसूचक रचना की अस्पष्टता को बनाए रखता है—ये परमेश्वर के दर्शन, परमेश्वर से आए दर्शन, अथवा दिव्य दर्शन हो सकते हैं।
theological_decisions:
- issue: מַרְאוֹת אֱלֹהִים में संबंधसूचक अर्थ
  choice: परमेश्वर के दर्शन
  alternative: परमेश्वर की ओर से मिले दर्शन; दिव्य दर्शन
  rationale: मूल इब्रानी यह निश्चित नहीं करता कि परमेश्वर दर्शनों का विषय हैं, उनका स्रोत हैं, या यह पदबंध उनकी दिव्य प्रकृति बताता है। मुख्य पाठ इस तनाव को खुला रखता है।
- issue: ‘तीसवें वर्ष’ की काल-गणना
  choice: मुख्य पाठ में केवल ‘तीसवें वर्ष’
  alternative: यहेजकेल की आयु का तीसवाँ वर्ष; किसी अन्य युग या घटना से गिना गया तीसवाँ वर्ष
  rationale: इस पद में काल-गणना का आरंभ स्पष्ट नहीं है, इसलिए मुख्य पाठ में कोई अनुमान नहीं जोड़ा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज किंतु गरिमामय कथात्मक शैली रखी गई है। ‘निर्वासित’, ‘आकाश’ और ‘दर्शन’ सामान्य पाठक के लिए बोधगम्य हैं तथा मूल के दर्शनात्मक स्वर को बनाए रखते हैं।
