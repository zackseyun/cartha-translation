  text: As for their rims[a], they were high and fearsome, and the rims of all four were full of eyes all around.
translation:
  language: hi
  text: उनके पहियों के बाहरी घेरे ऊँचे और भयावह[a] थे, और चारों पहियों के बाहरी घेरे चारों ओर आँखों से भरे हुए थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “विस्मयकारी”; इब्रानी शब्द भय या दहशत उत्पन्न करने वाले भाव को सूचित करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: גַבֵּיהֶן / גַבֹּתָם
  choice: उनके पहियों के घेरे / उन चारों के घेरे
  rationale: इस प्रसंग में גַּבּ wheel की बाहरी गोल संरचना को सूचित करता है। ‘घेरे’ सहज आधुनिक हिन्दी है; पहली बार ‘पहियों के’ जोड़ने से संदर्भ स्पष्ट होता है, जबकि दूसरी बार अनावश्यक पुनरुक्ति से बचा गया है।
- source_word: גֹבַהּ
  choice: ऊँचे
  rationale: इब्रानी भाववाचक संज्ञा ‘ऊँचाई’ को हिन्दी में स्वाभाविक विधेय विशेषण के रूप में व्यक्त किया गया है।
- source_word: יִרְאָה
  choice: भयावह
  rationale: शब्द का मूल भाव भय या दहशत उत्पन्न करना है। ‘भयावह’ इस प्रभाव को बनाए रखता है और इसे केवल श्रद्धामिश्रित विस्मय तक सीमित नहीं करता।
- source_word: לָהֶם
  choice: थे
  rationale: इब्रानी संबंधसूचक रचना को स्वाभाविक हिन्दी विधेय-वाक्य ‘ऊँचे और भयावह थे’ में व्यक्त किया गया है।
- source_word: מְלֵאֹת עֵינַיִם
  choice: आँखों से भरे हुए थे
  rationale: यह निकट और चित्रात्मक अनुवाद दर्शन की असामान्य छवि को बिना नरम किए सुरक्षित रखता है।
- source_word: סָבִיב
  choice: चारों ओर
  rationale: यह आधुनिक हिन्दी में समग्र परिधि का स्वाभाविक संकेत देता है।
- source_word: לְאַרְבַּעְתָּן
  choice: उन चारों के
  rationale: यह चारों पहियों के घेरों को सामूहिक और वितरणात्मक रूप से स्पष्ट करता है।
theological_decisions:
- issue: יִרְאָה के भय और विस्मय के बीच अर्थ-क्षेत्र
  choice: मुख्य पाठ में ‘भयावह’
  alternative: ‘विस्मयकारी’
  rationale: मूल संज्ञा भय/दहशत का स्पष्ट भाव रखती है। वैकल्पिक अर्थ को पादटिप्पणी में रखा गया है ताकि दर्शन से उत्पन्न विस्मय की संभावना भी छिपे नहीं।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और दृश्यात्मक रखी गई है। ‘पहियों के घेरे’ सामान्य पाठक के लिए स्पष्ट है, और समान इब्रानी शब्द की पुनरावृत्ति को दोनों खंडों में ‘घेरे’ द्वारा बनाए रखा गया है।
