id: EZK.1.21
reference: Ezekiel 1:21
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: בְּ/לֶכְתָּ֣/ם יֵלֵ֔כוּ וּ/בְ/עָמְדָ֖/ם יַֽעֲמֹ֑דוּ וּֽ/בְ/הִנָּשְׂאָ֞/ם מֵ/עַ֣ל הָ/אָ֗רֶץ יִנָּשְׂא֤וּ הָ/אֽוֹפַנִּים֙ לְ/עֻמָּתָ֔/ם כִּ֛י ר֥וּחַ הַ/חַיָּ֖ה בָּ/אוֹפַנִּֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/001/021.yaml
  text: When they went[a], these went; and when they stood, these stood; and when they were lifted up from above the earth, the wheels were lifted up alongside them[c][b], for the spirit of the living creatures was in the wheels.
translation:
  language: hi
  text: जब वे चलते थे, तब पहिए भी चलते थे; और जब वे ठहरते थे, तब पहिए भी ठहरते थे; और जब वे धरती के ऊपर से उठाए जाते थे, तब पहिए भी उनके साथ-साथ[a] उठाए जाते थे, क्योंकि जीवधारी की आत्मा[b] पहियों में थी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उनके अनुरूप” अथवा “उनके सामने।”
    reason: lexical_alternative
  - marker: b
    text: “आत्मा” के लिए प्रयुक्त इब्रानी शब्द का अर्थ “श्वास” या “वायु” भी हो सकता है। “जीवधारी” इब्रानी में एकवचन है, पर यहाँ संभवतः सभी जीवधारियों को सामूहिक रूप से दर्शाता है।
    reason: lexical_and_number_ambiguity
lexical_decisions:
- source_word: בְּלֶכְתָּם ... יֵלֵכוּ
  choice: जब वे चलते थे, तब पहिए भी चलते थे
  rationale: בְּ के साथ infinitive construct समयसूचक है। दूसरे बहुवचन कर्ता को संदर्भ से स्पष्ट करते हुए ‘पहिए’ रखा गया, ताकि हिन्दी में अस्पष्ट ‘ये’ से बचा जा सके और समन्वित गति स्पष्ट रहे।
- source_word: וּבְעָמְדָם יַעֲמֹדוּ
  choice: और जब वे ठहरते थे, तब पहिए भी ठहरते थे
  rationale: עמד का मूल भाव खड़े रहने या ठहरने का है। ‘ठहरते थे’ दृश्य में गति रुकने का स्वाभाविक हिन्दी रूप है और हिब्रू की पुनरुक्त समानांतरता बनाए रखता है।
- source_word: וּבְהִנָּשְׂאָם מֵעַל הָאָרֶץ
  choice: और जब वे धरती के ऊपर से उठाए जाते थे
  rationale: נשׂא के निफ़अल रूप की कर्मवाच्य छाया ‘उठाए जाते थे’ में सुरक्षित है। מֵעַל को ‘धरती के ऊपर से’ कहा गया है, जो केवल ‘धरती से’ की अपेक्षा स्थानगत सूक्ष्मता अधिक ठीक रखता है।
- source_word: יִנָּשְׂאוּ הָאוֹפַנִּים לְעֻמָּתָם
  choice: तब पहिए भी उनके साथ उठाए जाते थे
  rationale: पहियों के लिए भी वही कर्मवाच्य क्रिया रखी गई है। לְעֻמָּתָם आमने-सामने, अनुरूप स्थिति या साथ-साथ होने का बोध दे सकता है; समन्वित गति के प्रसंग में ‘उनके साथ’ सहज है, जबकि अन्य स्थानगत संभावनाएँ पादटिप्पणी में दी गई हैं।
- source_word: רוּחַ הַחַיָּה
  choice: जीवधारी की आत्मा
  rationale: רוּחַ बहुअर्थी है—आत्मा, श्वास या वायु। यहाँ गति को सजीव करने वाले तत्व के अर्थ में ‘आत्मा’ उपयुक्त है, पर अन्य अर्थ पादटिप्पणी में सुरक्षित हैं। הַחַיָּה व्याकरणतः एकवचन है, इसलिए ‘जीवधारी’ एकवचन रखा गया है, यद्यपि संदर्भ में इसका सामूहिक आशय संभव है।
- source_word: בָּאוֹפַנִּים
  choice: पहियों में थी
  rationale: בְּ का सीधा स्थानगत अर्थ ‘में’ है; स्त्रीलिंग ‘थी’ का सामंजस्य ‘आत्मा’ से है।
theological_decisions:
- issue: दर्शन में רוּחַ का अर्थ
  choice: आत्मा
  alternative: श्वास या वायु
  rationale: यह शब्द पहियों और जीवधारी की समन्वित, सजीव गति का कारण बताता है। ‘आत्मा’ संभावित आशय को व्यक्त करता है, पर इसे स्पष्टतः पवित्र आत्मा बताकर मूल से अधिक सिद्धान्तगत दावा नहीं किया गया; शब्द की बहुअर्थकता पादटिप्पणी में रखी गई है।
- issue: הַחַיָּה की वचन-संबंधी सूक्ष्मता
  choice: जीवधारी (एकवचन)
  alternative: जीवधारी प्राणी (सामूहिक/बहुवचन आशय)
  rationale: मसोरेटी पाठ में संज्ञा निश्चित एकवचन है। आसपास अनेक जीवधारी हैं, इसलिए सामूहिक संकेत संभव है, पर मुख्य पाठ मूल का एकवचन सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण और सहज शैली अपनाई गई है। समानांतर वाक्य-रचना और कर्मवाच्य को यथासंभव सुरक्षित रखा गया है; संदर्भगत स्पष्टता के लिए दूसरे कर्ता को ‘पहिए’ के रूप में व्यक्त किया गया है।
