  text: 'As for the likeness of their faces: each had a human face; the four had a lion’s face on the right side[a], the four had an ox’s face on the left side, and the four had an eagle’s face.'
translation:
  language: hi
  text: 'उनके चेहरों का स्वरूप यह था: चारों में से हर एक का चेहरा मनुष्य का था; चारों में से हर एक के दाहिनी ओर सिंह का चेहरा था, चारों में से हर एक के बाईं ओर बैल का चेहरा था, और चारों में से हर एक के पास उकाब का चेहरा था।[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “गिद्ध”; इब्रानी נֶשֶׁר (नेशेर) बड़े शिकारी पक्षी या शवभक्षी पक्षी के लिए अधिक व्यापक रूप से प्रयुक्त हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וּדְמוּת
  choice: उनके चेहरों का रूप ऐसा था
  rationale: דְּמוּת का अर्थ रूप, समानता या आकृति है। यहाँ यह चेहरों के दिखाई देने वाले रूप का वर्णन आरम्भ करता है; यह हिन्दी अभिव्यक्ति उस वर्णनात्मक बल को स्वाभाविक ढंग से रखती है।
- source_word: פְּנֵיהֶם
  choice: उनके चेहरों
  rationale: פָּנִים का सामान्य अर्थ चेहरा/चेहरे है; बहुवचन संबंधसूचक रूप को सीधे और स्पष्ट ढंग से व्यक्त किया गया है।
- source_word: פְּנֵי אָדָם
  choice: एक मनुष्य का चेहरा
  rationale: אָדָם यहाँ पशु-पक्षियों के चेहरों के विपरीत मानव-जाति का संकेत करता है। 'मनुष्य का चेहरा' आधुनिक हिन्दी में स्वाभाविक है और अनावश्यक रूप से पुरुष-लिंग की विशिष्टता नहीं जोड़ता।
- source_word: אַרְיֵה
  choice: सिंह
  rationale: इस शब्द का सामान्य अर्थ सिंह है; 'सिंह का चेहरा' गरिमापूर्ण और प्रचलित हिन्दी है।
- source_word: אֶל הַיָּמִין
  choice: दाईं ओर
  rationale: यह वाक्यांश सिंह के चेहरे की दाहिनी दिशा में स्थिति बताता है।
- source_word: לְאַרְבַּעְתָּם / לְאַרְבַּעְתָּן
  choice: चारों के / चारों का
  rationale: यह पदबंध बताता है कि वर्णित चेहरा चारों जीवित प्राणियों में से प्रत्येक पर लागू था। हिन्दी में 'चारों के' इस वितरणात्मक अर्थ को स्पष्ट रखता है।
- source_word: שׁוֹר
  choice: बैल
  rationale: שׁוֹר गोवंशीय नर पशु को दर्शाता है। सामान्य आधुनिक हिन्दी में 'बैल' सर्वाधिक सहज और पर्याप्त रूप से सटीक है।
- source_word: מֵהַשְּׂמֹאול
  choice: बाईं ओर
  rationale: यद्यपि उपसर्ग का मूल अर्थ 'से' है, इस स्थान-सूचक वर्णन में आशय बाईं ओर होने से है।
- source_word: נֶשֶׁר
  choice: उकाब
  rationale: נֶשֶׁר किसी बड़े शिकारी या शवभक्षी पक्षी का नाम हो सकता है। 'उकाब' बाइबलीय हिन्दी में eagle के लिए समझ में आने वाला शब्द है, जबकि व्यापक शाब्दिक संभावना पादटिप्पणी में सुरक्षित है।
