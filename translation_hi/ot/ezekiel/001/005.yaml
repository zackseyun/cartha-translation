source:
  edition: WLC
  text: וּ/מִ֨/תּוֹכָ֔/הּ דְּמ֖וּת אַרְבַּ֣ע חַיּ֑וֹת וְ/זֶה֙ מַרְאֵֽי/הֶ֔ן דְּמ֥וּת אָדָ֖ם לָ/הֵֽנָּה׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/001/005.yaml
  text: 'And from within it came the likeness of four living creatures[b][a]. And this was their appearance: they had the likeness of a man.'
translation:
  language: hi
  text: 'और उसके भीतर से मुझे चार जीवित प्राणियों[a] की-सी आकृति दिखाई दी। उनका रूप यह था: उनकी आकृति मनुष्य की-सी थी[b]।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “चार जीवधारी।”
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में, “मनुष्य की समानता”; अर्थात वे मानव-रूप में दिखाई देते थे।
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִתּוֹכָהּ
  choice: और उसके भीतर से
  rationale: यह पदबंध किसी वस्तु के मध्य या भीतर से आने का स्थानिक भाव व्यक्त करता है। स्त्रीलिंग प्रत्यय पिछले संदर्भ में वर्णित अग्निमय दृश्य की ओर संकेत करता है।
- source_word: דְּמוּת
  choice: जैसी आकृतियाँ / आकृति ... जैसी
  rationale: दְּמוּת समानता और सादृश्य बताता है, प्रत्यक्ष पहचान नहीं। हिन्दी में ‘जैसी आकृति’ इस दर्शनीय और सादृश्यात्मक भाषा को स्वाभाविक ढंग से बनाए रखता है। पहले प्रयोग को चार प्राणियों के अनुरूप बहुवचन में रखा गया है ताकि हिन्दी वाक्य सहज रहे।
- source_word: אַרְבַּע חַיּוֹת
  choice: चार जीवित प्राणी
  rationale: חַיּוֹת यहाँ दर्शन में दिखाई देने वाले सजीव प्राणियों को दर्शाता है। ‘जीवित प्राणी’ उन्हें पशु या किसी विशिष्ट स्वर्गदूतीय वर्ग के रूप में अनावश्यक रूप से परिभाषित नहीं करता।
- source_word: וְזֶה מַרְאֵיהֶן
  choice: उनका रूप ऐसा था
  rationale: מַרְאֶה दृश्य रूप या बाहरी दिखाई देने वाली बनावट को सूचित करता है। यह हिन्दी में संक्षिप्त और स्वाभाविक अभिव्यक्ति है।
- source_word: דְּמוּת אָדָם
  choice: उनकी आकृति मनुष्य जैसी थी
  rationale: אָדָם यहाँ मानव रूप का संकेत देता है। ‘मनुष्य जैसी’ मूल के सादृश्य को सुरक्षित रखता है और अनावश्यक रूप से पुरुष-लिंग तक अर्थ को सीमित नहीं करता।
- source_word: לָהֵנָּה
  choice: उनकी ... थी
  rationale: शाब्दिक रूप से ‘उनके लिए/उनकी’ का भाव रखने वाले इस पद को हिन्दी में स्वाभाविक अधिकारसूचक विधान के रूप में व्यक्त किया गया है।
theological_decisions:
- issue: दर्शन में दिखाई देने वाले प्राणियों की सत्ता को आवश्यकता से अधिक परिभाषित करना
  choice: ‘जैसी आकृतियाँ’ और ‘मनुष्य जैसी’ कहकर सादृश्य की भाषा बनाए रखी गई है
  alternative: मुख्य पाठ में उन्हें सीधे स्वर्गदूत या किसी निश्चित प्रकार के अलौकिक प्राणी कहना
  rationale: यहेजकेल का मूल पाठ बार-बार दְּמוּת का प्रयोग करके प्रत्यक्ष पहचान के बजाय समानता बताता है। अनुवाद इसी संयम और रहस्य को सुरक्षित रखता है।
- issue: אָדָם को पुरुष-विशेष या सामान्य मानव रूप मानना
  choice: मनुष्य
  alternative: आदमी / पुरुष
  rationale: इस संदर्भ में אָדָם प्राणियों के मानव-सदृश रूप को बताता है, उनके पुरुष होने का स्पष्ट दावा नहीं करता। ‘मनुष्य’ इस वास्तविक अस्पष्टता को बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, सहज किंतु गरिमापूर्ण रखी गई है। ‘जीवित प्राणी’, ‘आकृति’ और ‘रूप’ सामान्य पाठक के लिए स्पष्ट हैं, जबकि दर्शन की सादृश्यात्मक और अनिश्चित प्रकृति भी बनी रहती है।
