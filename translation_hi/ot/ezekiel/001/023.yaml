  register: भाषा आधुनिक, गरिमापूर्ण और दृश्यात्मक रखी गई है। ‘विस्तृत मंडल’ רָקִיעַ की फैली हुई, मंडल-जैसी संरचना को व्यक्त करता है। दोहराई गई वितरणात्मक रचना को बनाए रखा गया है, ताकि प्रत्येक प्राणी के दो-दो पंखों के दोनों कार्य स्पष्ट रहें।
