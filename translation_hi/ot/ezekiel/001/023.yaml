  text: וְ/תַ֨חַת֙ הָ/רָקִ֔יעַ כַּנְפֵי/הֶ֣ם יְשָׁר֔וֹת אִשָּׁ֖ה אֶל אֲחוֹתָ֑/הּ לְ/אִ֗ישׁ שְׁתַּ֤יִם מְכַסּוֹת֙ לָ/הֵ֔נָּה וּ/לְ/אִ֗ישׁ שְׁתַּ֤יִם מְכַסּוֹת֙ לָ/הֵ֔נָּה אֵ֖ת גְּוִיֹּתֵי/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/001/023.yaml
  text: And under the expanse their wings were straight[a], each one toward her sister. Each had two covering them[b], and each had two covering their bodies.
translation:
  language: hi
  text: और उस विस्तार के नीचे उनके पंख सीधे थे; हर पंख दूसरे पंख की ओर था[a]। हर प्राणी के दो पंख उसे ढाँपे हुए थे, और दो पंख उसके शरीर को ढाँपे हुए थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: हिब्रू में शाब्दिक रूप से, ‘एक स्त्री अपनी बहन की ओर।’ ‘पंख’ हिब्रू में व्याकरणिक रूप से स्त्रीलिंग है; आशय है कि पंख एक-दूसरे की ओर, परस्पर अनुरूप थे।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְתַחַת הָרָקִיעַ
  choice: और उस विस्तृत मंडल के नीचे
  rationale: וְתַחַת स्थान-संबंध को सीधे व्यक्त करता है। רָקִיעַ के लिए ‘विस्तृत मंडल’ दृश्य में ऊपर फैली हुई ठोस-जैसी संरचना की छवि रखता है और आधुनिक हिन्दी में समझने योग्य है।
- source_word: כַּנְפֵיהֶם יְשָׁרוֹת
  choice: उनके पंख सीधे थे
  rationale: יְשָׁרוֹת पंखों की सीधी स्थिति या परस्पर अनुरूप दिशा बताता है; संक्षिप्त विशेषणात्मक रूप मूल की अभिव्यक्ति बनाए रखता है।
- source_word: אִשָּׁה אֶל אֲחוֹתָהּ
  choice: हर पंख अपने साथी पंख की ओर
  rationale: शाब्दिक रूप ‘एक स्त्री अपनी बहन की ओर’ है, क्योंकि ‘पंख’ हिब्रू में स्त्रीलिंग है। हिन्दी में शाब्दिक स्त्री-संबोधन भ्रामक होता, इसलिए पंखों के एक-दूसरे की ओर होने का आशय स्पष्ट किया गया है।
- source_word: לְאִישׁ שְׁתַּיִם מְכַסּוֹת לָהֵנָּה
  choice: हर एक के दो पंख उसे ढके हुए थे
  rationale: לְאִישׁ का प्रयोग वितरणात्मक है, अर्थात प्रत्येक प्राणी। क्रियारहित हिब्रू वाक्य को स्वाभाविक हिन्दी में ‘के ... थे’ से व्यक्त किया गया है; לָהֵנָּה का संकेत संदर्भानुसार प्राणियों की ओर माना गया है।
- source_word: אֵת גְּוִיֹּתֵיהֶם
  choice: उसके शरीर को
  rationale: גְּוִיָּה कुछ संदर्भों में शव भी हो सकता है, पर जीवित प्राणियों के इस दर्शन में ‘शरीर’ ही संदर्भानुकूल अर्थ है। एकवचन वितरणात्मक शैली हिन्दी में प्रत्येक प्राणी को स्पष्ट करती है।
