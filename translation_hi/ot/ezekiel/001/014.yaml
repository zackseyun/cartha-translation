  rationale: חַיּוֹת का मूल अर्थ जीवित प्राणी है। यह दर्शन में दिखाई देने वाले सजीव प्राणियों का वर्णन करता है और यहेजकेल 10:20 की बाद की पहचान को समय से पहले यहाँ नहीं लाता।
- source_word: רָצוֹא וָשׁוֹב
  choice: तेज़ी से इधर-उधर दौड़ते थे
  rationale: रוץ और שוב के युग्म का शाब्दिक भाव ‘दौड़ना और लौटना’ है; इस प्रसंग में यह बार-बार होने वाली तीव्र आगे-पीछे की गति व्यक्त करता है। स्वाभाविक हिन्दी में ‘तेज़ी से इधर-उधर दौड़ते थे’ उस गति को स्पष्ट रखता है।
- source_word: כְּמַרְאֵה
  choice: के समान
  rationale: מַרְאֶה दृश्य रूप या दिखाई देने वाली छवि को सूचित करता है। हिन्दी में ‘बिजली की चमक के समान’ इस दृश्य तुलना को स्वाभाविक रूप से व्यक्त करता है; ‘दिखाई देने में’ जोड़ना यहाँ अनावश्यक रूप से बोझिल होता।
- source_word: הַבָּזָק
  choice: बिजली की चमक
  rationale: בָּזָק बिजली अथवा बिजली की कौंध को दर्शाता है। ‘बिजली की चमक’ हिन्दी में दृश्य की अचानक और तीव्र चमक को स्पष्ट तथा सहज रूप से व्यक्त करता है।
