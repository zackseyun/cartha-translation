base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/001/016.yaml
  text: The appearance of the wheels and their workmanship was like the gleam of beryl[a], and the four of them had the same likeness; and their appearance and their workmanship were as if a wheel were within a wheel.
translation:
  language: hi
  text: पहियों का रूप और उनकी बनावट तर्शीश रत्न[a] की चमक जैसी थी। उन चारों का रूप एक ही था, और उनका रूप और उनकी बनावट ऐसी थी, मानो एक पहिया दूसरे पहिए के भीतर हो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इब्रानी: तर्शीश। यह अनिश्चित पहचान वाला बहुमूल्य रत्न है; परंपरागत रूप से इसका अनुवाद ‘बेरिल’ या ‘क्रिसोलाइट’ किया गया है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַרְאֵה הָאוֹפַנִּים
  choice: पहियों का रूप
  rationale: מַרְאֶה दृश्य रूप या दिखाई देने वाली आकृति को दर्शाता है; आधुनिक हिन्दी में ‘रूप’ सहज और संक्षिप्त है।
- source_word: וּמַעֲשֵׂיהֶם
  choice: और उनकी बनावट
  rationale: מַעֲשֶׂה यहाँ पहियों की संरचना या कारीगरी को सूचित करता है। ‘बनावट’ सामान्य पाठक के लिए स्वाभाविक है और दोनों आवृत्तियों में एकरूपता बनाए रखता है।
- source_word: כְּעֵין תַּרְשִׁישׁ
  choice: तर्शीश रत्न की चमक जैसी
  rationale: כְּעֵין रत्न के दृश्य गुण या चमक की ओर संकेत करता है। תַּרְשִׁישׁ की पहचान अनिश्चित होने के कारण उसका लिप्यंतरण मुख्य पाठ में रखकर फुटनोट में परंपरागत विकल्प दिए गए हैं।
- source_word: וּדְמוּת אֶחָד לְאַרְבַּעְתָּן
  choice: उन चारों का रूप एक ही था
  rationale: इब्रानी का शाब्दिक ढाँचा ‘चारों के लिए एक समानता’ है। यह हिन्दी रूप समानता पर दिए गए बल को स्पष्ट और सहज ढंग से सुरक्षित रखता है।
- source_word: כַּאֲשֶׁר יִהְיֶה הָאוֹפַן בְּתוֹךְ הָאוֹפָן
  choice: ऐसी थी, मानो एक पहिया दूसरे पहिए के भीतर हो
  rationale: यह अनोखी संरचना का तुलनात्मक वर्णन है। ‘मानो’ तुलना को बनाए रखता है और ‘दूसरे पहिए’ हिन्दी में संबंध को स्वाभाविक बनाता है, बिना उसकी यांत्रिक रचना को अतिरिक्त रूप से परिभाषित किए।
