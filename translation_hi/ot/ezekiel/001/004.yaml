  text: וָ/אֵ֡רֶא וְ/הִנֵּה֩ ר֨וּחַ סְעָרָ֜ה בָּאָ֣ה מִן הַ/צָּפ֗וֹן עָנָ֤ן גָּדוֹל֙ וְ/אֵ֣שׁ מִתְלַקַּ֔חַת וְ/נֹ֥גַֽהּ ל֖/וֹ סָבִ֑יב וּ/מִ֨/תּוֹכָ֔/הּ כְּ/עֵ֥ין הַ/חַשְׁמַ֖ל מִ/תּ֥וֹךְ הָ/אֵֽשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/001/004.yaml
  text: And I looked[a], and behold, a storm wind was coming from the north, a great cloud with fire flashing continually, and brightness all around it; and from its midst was something like the appearance of glowing metal[c][b], from the midst of the fire.
translation:
  language: hi
  text: मैंने देखा, और देखो, उत्तर से एक प्रचण्ड आँधी चली आ रही थी—एक विशाल बादल, जिसमें आग लगातार लपक रही थी[b], और उसके चारों ओर चमक थी। उसके भीतर से, आग के भीतर से, दमकती धातु के समान कुछ दिखाई दे रहा था।[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: इब्रानी अभिव्यक्ति कठिन है। इसका पारंपरिक अनुवाद ‘आग अपने आप में सिमटती हुई’ भी किया गया है; यह लगातार, अपने आप तीव्र होती या गतिशील आग का वर्णन कर सकती है।
    reason: lexical_alternative
  - marker: c
    text: ‘दमकती धातु’ के लिए इब्रानी शब्द हशमल दुर्लभ है और उसका ठीक अर्थ अनिश्चित है; संभवतः यह इलेक्ट्रम जैसी चमकीली मिश्रधातु या अम्बर जैसी दमक को दर्शाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֵרֶא וְהִנֵּה
  choice: मैंने देखा, और देखो
  rationale: ראה का सामान्य अर्थ ‘देखना’ है और הִנֵּה अचानक ध्यान खींचता है। यह संयोजन दर्शन-वृत्तांत की जीवंतता और मूल की हल्की पुनरुक्ति बनाए रखता है।
- source_word: רוּחַ סְעָרָה
  choice: आँधी का एक प्रचण्ड झोंका
  rationale: यह पदबंध हिंसक तूफ़ानी हवा को दर्शाता है; यह अनुवाद किसी निश्चित चक्रवाती आकार का दावा किए बिना उसकी तीव्रता व्यक्त करता है।
- source_word: בָּאָה מִן הַצָּפוֹן
  choice: उत्तर दिशा से ... चला आ रहा था
  rationale: दृश्य को नबी के सामने घटित होते हुए प्रस्तुत करता है और स्त्रीलिंग ‘आँधी’ के साथ स्वाभाविक हिंदी बनाता है।
- source_word: עָנָן גָּדוֹל
  choice: एक विशाल बादल
  rationale: बादल के असाधारण आकार और भव्यता को सहज, गरिमापूर्ण हिंदी में व्यक्त करता है।
- source_word: אֵשׁ מִתְלַקַּחַת
  choice: आग लगातार लपक रही थी
  rationale: दुर्बोध आत्मवाचक रूप को आग की निरंतर सक्रिय, भड़कती गति के रूप में प्रस्तुत करता है, पर उसकी यांत्रिकी को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: וְנֹגַהּ לוֹ סָבִיב
  choice: उसके चारों ओर तेज था
  rationale: נֹגַהּ की चमक/दीप्ति और סָבִיב के चारों ओर होने का भाव सुरक्षित है; ‘तेज’ सामान्य पाठक के लिए स्वाभाविक तथा गरिमापूर्ण है।
- source_word: וּמִתּוֹכָהּ ... מִתּוֹךְ הָאֵשׁ
  choice: उसके बीच से, आग के भीतर से
  rationale: मूल में ‘बीच/भीतर’ की परतदार पुनरावृत्ति को यथासंभव बनाए रखते हुए हिंदी की पठनीयता रखता है।
- source_word: כְּעֵין הַחַשְׁמַל
  choice: दमकती हुई धातु जैसी कोई चीज़ दिखाई दे रही थी
  rationale: כְּעֵין की तुलनात्मक और सावधान भाषा को बनाए रखता है। दुर्लभ חַשְׁמַל को किसी निश्चित पदार्थ के रूप में पहचानने के बजाय उसका दृश्य प्रभाव देता है।
theological_decisions:
- issue: ईश-दर्शन की उपमात्मक छवि को कितना निश्चित किया जाए
  choice: ‘दमकती हुई धातु जैसी कोई चीज़’ के रूप में वर्णनात्मक और अनिश्चित भाषा
  alternative: ‘अम्बर’ अथवा ‘इलेक्ट्रम’ जैसी किसी निश्चित वस्तु का नाम
  rationale: इब्रानी पाठ स्वयं उपमा का प्रयोग करता है और חַשְׁמַל का अर्थ अनिश्चित है; इसलिए दर्शन की रहस्यमयता और पाठ की वास्तविक अनिश्चितता सुरक्षित रखी गई है।
- issue: אֵשׁ מִתְלַקַּחַת की कठिन छवि
  choice: ‘आग लगातार लपक रही थी’
  alternative: ‘आग अपने आप में सिमट रही थी’ या ‘आग अपने आप को पकड़ रही थी’
  rationale: रूप की कठिनता को स्वीकारते हुए निरंतर गतिशील आग का बोध दिया गया है; किसी विशिष्ट अलौकिक प्रक्रिया को सिद्धांततः आरोपित नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिंदी, गरिमापूर्ण किंतु सहज। दर्शन की जीवंतता के लिए ‘और देखो’ रखा गया है। कठिन और दुर्लभ शब्दों की अनिश्चितता मुख्य पाठ तथा पादटिप्पणी में सुरक्षित है; किसी संप्रदायगत व्याख्या को शामिल नहीं किया गया।
