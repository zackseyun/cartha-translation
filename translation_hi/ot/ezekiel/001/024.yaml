  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किन्तु सहज रूप अपनाया गया है। वाक्य-विन्यास में चलने और ठहरने का विरोध स्पष्ट किया गया है, और बार-बार आने वाली ध्वनि-संबंधी भाषा को हिन्दी में कृत्रिम पुनरावृत्ति बनाए बिना सुरक्षित रखा गया है। पादटिप्पणी-चिह्न सम्बद्ध शब्दों—‘सर्वशक्तिमान’ और ‘छावनी’—पर लगाए गए हैं।
