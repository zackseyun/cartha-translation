base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/001/024.yaml
  text: And I heard the sound of their wings[a], like the sound of many waters, like the sound of the Almighty when they went, a sound of tumult like the sound of an army camp. When they stood still[b], they lowered their wings.
translation:
  language: hi
  text: 'और मैंने उनके पंखों की ध्वनि सुनी: जब वे चलते थे, तो वह बहुत जल की ध्वनि के समान, सर्वशक्तिमान[a] की ध्वनि के समान, और सेना की छावनी[b] के शोर के समान कोलाहल की ध्वनि थी। जब वे खड़े होते थे, तो वे अपने पंख नीचे कर लेते थे।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “शद्दाय।” इब्रानी में ईश्वरीय उपाधि שַׁדַּי है, जिसका परम्परागत अनुवाद “सर्वशक्तिमान” है।
    reason: lexical_alternative
  - marker: b
    text: या, “छावनी।” इब्रानी מַחֲנֶה प्रायः किसी सैनिक पड़ाव को दर्शाता है; इसलिए मुख्य पाठ में “सेना की छावनी” रखा गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶשְׁמַע
  choice: तब मैंने ... सुनी
  rationale: यह क्रियारूप दर्शन-वृत्तांत में अगली घटना को आगे बढ़ाता है। ‘तब’ स्वाभाविक हिन्दी में कथात्मक क्रम व्यक्त करता है।
- source_word: קוֹל
  choice: आवाज़ / शोर
  rationale: सन्दर्भ में यह पंखों और तुलना की गई घटनाओं से उत्पन्न सुनाई देने वाली ध्वनि को दर्शाता है। हिन्दी में प्रसंग के अनुसार ‘आवाज़’ और कोलाहलपूर्ण छावनी के लिए ‘शोर’ स्वाभाविक हैं।
- source_word: כַּנְפֵיהֶם
  choice: उनके पंखों
  rationale: बहुवचन संज्ञा और प्रत्यय का सीधा, स्वाभाविक हिन्दी रूप; इसका संकेत जीवित प्राणियों की ओर है।
- source_word: כְּקוֹל מַיִם רַבִּים
  choice: बहुत-से जल की गर्जना के समान
  rationale: ‘बहुत-से जल’ मूल बिम्ब को बनाए रखता है, जबकि ‘गर्जना’ उस प्रबल ध्वनि को हिन्दी में स्वाभाविक ढंग से व्यक्त करती है; इसमें ‘बहते’ या ‘उमड़ते’ जैसी अतिरिक्त धारणा नहीं जोड़ी गई।
- source_word: שַׁדַּי
  choice: सर्वशक्तिमान
  rationale: यहाँ प्रयुक्त ईश्वरीय उपाधि का अर्थानुसार अनुवाद किया गया है; पादटिप्पणी पारम्परिक लिप्यन्तरण भी देती है।
- source_word: בְּלֶכְתָּם
  choice: जब वे चलते थे
  rationale: पूर्वसर्ग सहित infinitive construct समयगत परिस्थिति बताता है; यह रूप हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: הֲמֻלָּה
  choice: कोलाहल
  rationale: यह शब्द ऊँची, अशान्त सामूहिक ध्वनि दर्शाता है। ‘कोलाहल’ दर्शन के गरिमापूर्ण स्वर और ध्वनि की तीव्रता दोनों को बनाए रखता है।
- source_word: כְּקוֹל מַחֲנֶה
  choice: मानो सेना की छावनी का शोर हो
  rationale: מַחֲנֶה सामान्यतः छावनी, विशेषकर सैनिक पड़ाव, को दर्शाता है। ‘सेना की छावनी’ सम्भावित सैनिक अर्थ स्पष्ट करती है, जबकि पादटिप्पणी अधिक शाब्दिक विकल्प सुरक्षित रखती है।
- source_word: בְּעָמְדָם
  choice: जब वे ठहर जाते थे
  rationale: यह चलने के विपरीत गति रुकने को व्यक्त करता है। ‘ठहर जाते थे’ आधुनिक हिन्दी में इस विरोध को स्पष्ट करता है।
- source_word: תְּרַפֶּינָה כַנְפֵיהֶן
  choice: वे अपने पंख नीचे कर लेते थे
  rationale: रפה का causative रूप यहाँ पंखों को ढीला छोड़कर नीचे करने का भाव देता है। यह हिन्दी में स्पष्ट और दृश्य के अनुकूल है।
theological_decisions:
- issue: שַׁדַּי का अनुवाद
  choice: सर्वशक्तिमान
  alternative: शद्दाय
  rationale: मुख्य पाठ में ईश्वरीय उपाधि का अर्थ दिया गया है, उसे अनावश्यक रूप से केवल व्यक्तिवाचक नाम नहीं माना गया। साथ ही ‘शद्दाय’ को पादटिप्पणी में रखकर मूल शब्द की सम्भावित नाम-सदृश समझ सुरक्षित रखी गई है।
