base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/001/015.yaml
  text: As I looked at the living creatures[a], behold, one wheel was on the earth beside the living creatures, for each of their four faces.
translation:
  language: hi
  text: जब मैंने उन जीवित प्राणियों को देखा, तो देखो, धरती पर उनके पास एक पहिया था—उनमें से प्रत्येक के चारों मुखों के लिए।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसके चारों मुखों के अनुरूप।” हिब्रू वाक्यांश संक्षिप्त है और यह बता सकता है कि पहिया प्रत्येक प्राणी की चार-मुखी आकृति के संबंध में स्थित था।
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֵרֶא
  choice: जब मैंने ... देखा
  rationale: यह प्रथम पुरुष में दर्शन के आगे बढ़ने को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: הַחַיּוֹת
  choice: जीवित प्राणी
  rationale: यह दर्शन में दिखाई देने वाले सजीव सिंहासन-प्राणियों के लिए प्रयुक्त शब्द को उनकी पहचान का अतिरिक्त निर्धारण किए बिना व्यक्त करता है।
- source_word: וְהִנֵּה
  choice: तो देखो
  rationale: यह दर्शन में अचानक एक नई वस्तु की ओर ध्यान खींचने वाले हिब्रू उद्गार की सजीवता बनाए रखता है।
- source_word: אוֹפַן אֶחָד
  choice: एक पहिया
  rationale: संज्ञा और संख्या दोनों को स्पष्ट रूप से रखते हुए हिब्रू के एकवचन को सुरक्षित रखा गया है।
- source_word: בָּאָרֶץ
  choice: धरती पर
  rationale: दर्शन में पहिए की भूमि-स्तरीय स्थिति को सीधी और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: אֵצֶל
  choice: पास
  rationale: यह निकटता बताने वाले पूर्वसर्ग का संक्षिप्त और सहज अनुवाद है।
- source_word: לְאַרְבַּעַת פָּנָיו
  choice: उनमें से हर एक के चारों मुखों के पास
  rationale: एकवचन प्रत्यय को बहुवचन जीवित प्राणियों के संदर्भ में वितरणात्मक रूप से समझता है और पद 6 के अनुसार प्रत्येक प्राणी के चार मुख होने का संबंध बनाए रखता है; टिप्पणी वैकल्पिक संबंध को दर्ज करती है।
theological_decisions:
- issue: לְאַרְבַּעַת פָּנָיו में सर्वनाम का संदर्भ और वचन
  choice: 'वितरणात्मक अर्थ: “उनमें से हर एक के चारों मुखों के पास”'
  alternative: “उसके चारों मुखों के अनुरूप”
  rationale: बहुवचन ‘जीवित प्राणियों’ के बाद एकवचन प्रत्यय हिब्रू में प्रत्येक प्राणी पर अलग-अलग लागू हो सकता है। निकट संदर्भ में हर प्राणी के चार मुख हैं; फिर भी संक्षिप्त हिब्रू वाक्यांश पहिए की स्थिति या अनुरूपता भी बता सकता है, इसलिए इस संभावना को टिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। “तो देखो” भविष्यदर्शी वर्णन की सजीवता बनाए रखता है, जबकि पादटिप्पणी हिब्रू की वास्तविक संदिग्धता को बिना निर्णायक रूप से सुलझाए दर्ज करती है।
