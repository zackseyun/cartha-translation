  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/רַגְלֵי/הֶ֖ם רֶ֣גֶל יְשָׁרָ֑ה וְ/כַ֣ף רַגְלֵי/הֶ֗ם כְּ/כַף֙ רֶ֣גֶל עֵ֔גֶל וְ/נֹ֣צְצִ֔ים כְּ/עֵ֖ין נְחֹ֥שֶׁת קָלָֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/001/007.yaml
  text: Their legs were straight[a], and the soles of their feet were like the sole of a calf’s foot[b], and they gleamed like the appearance of polished bronze.
translation:
  language: hi
  text: उनकी टाँगें सीधी थीं, और उनके पैरों के तलवे बछड़े के पैर के तलवे जैसे[a] थे। वे माँजे हुए काँसे के समान चमक रहे थे[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या अधिक मुहावरेदार रूप में, “बछड़े के खुर जैसे।” इब्रानी में अधिक शाब्दिक रूप से “बछड़े के पैर के तलवे जैसे” है।
    reason: lexical_alternative
  - marker: b
    text: या “दमकते हुए काँसे के समान।”
    reason: lexical_alternative
lexical_decisions:
- source_word: רַגְלֵיהֶם
  choice: उनकी टाँगें
  rationale: רֶגֶל का अर्थ संदर्भ के अनुसार ‘पैर’ या ‘टाँग’ हो सकता है। अगले वाक्यांश में पैरों के तलवों का अलग उल्लेख है, इसलिए यहाँ ‘टाँगें’ मूल पाठ का भेद बनाए रखता है।
- source_word: רֶגֶל יְשָׁרָה
  choice: सीधी थीं
  rationale: एकवचन संज्ञा और विशेषण यहाँ वितरणात्मक अर्थ रखते हैं—उनमें से प्रत्येक की टाँग सीधी थी। हिन्दी में बहुवचन ‘टाँगें सीधी थीं’ स्वाभाविक और अर्थनिष्ठ है।
- source_word: כַּף רַגְלֵיהֶם
  choice: उनके पैरों के तलवे
  rationale: शरीर के अंग के संदर्भ में כַּף हथेली या तलवे को दर्शाता है; यहाँ ‘तलवे’ उपयुक्त है।
- source_word: כְּכַף רֶגֶל עֵגֶל
  choice: बछड़े के पैर के तलवे जैसे
  rationale: यह मूल इब्रानी की शारीरिक तुलना को बनाए रखता है। अधिक मुहावरेदार ‘बछड़े के खुर जैसे’ को पाद-टिप्पणी में दिया गया है।
- source_word: וְנֹצְצִים
  choice: वे ... चमक रहे थे
  rationale: कृदंत तेज या झिलमिलाती चमक का वर्णन करता है। ‘चमक रहे थे’ आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: כְּעֵין
  choice: के समान
  rationale: इस रचना में עַיִן का अर्थ ‘रूप/दिखावट’ है। हिन्दी में धातु की चमक की तुलना करते समय ‘के समान’ इस अर्थ को स्वाभाविक रूप से व्यक्त करता है।
- source_word: נְחֹשֶׁת קָלָל
  choice: माँजा हुआ काँसा
  rationale: נְחֹשֶׁת ताँबे या काँसे को सूचित कर सकता है, जबकि קָלָל यहाँ माँजे या चमकाए हुए होने का भाव देता है। ‘माँजा हुआ काँसा’ स्पष्ट, वर्तमान और दृश्यात्मक है।
