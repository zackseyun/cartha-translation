  rationale: शाब्दिक अर्थ ‘उनके चार भागों/पहलुओं पर’ है। गति के संदर्भ में ‘चारों दिशाओं में से किसी भी दिशा में’ स्वाभाविक हिन्दी है, जबकि ‘पहलुओं’ वाला स्थानिक अर्थ पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: בְּלֶכְתָּם
  choice: चलते समय
  rationale: בְּ के साथ क्रियार्थक संज्ञा समकालिक क्रिया बताती है; यह हिन्दी में उसका सहज और स्पष्ट रूप है।
- source_word: יֵלֵכוּ
  choice: जाते थे
  rationale: अपूर्ण क्रिया यहाँ दर्शन में उनके सामान्य या बार-बार होने वाले ढंग का वर्णन करती है; ‘जाते थे’ इस वर्णनात्मक भाव को व्यक्त करता है।
- source_word: לֹא יִסַּבּוּ
  choice: वे मुड़ते नहीं थे
  rationale: סבב का निफ़अल रूप यहाँ चलते हुए मुड़ने या दिशा बदलने को दर्शाता है। ‘मुड़ते नहीं थे’ संक्षिप्त है और अनावश्यक व्याख्या नहीं जोड़ता।
- source_word: בְּלֶכְתָּן
  choice: चलते हुए
  rationale: यह भी समकालिक क्रिया व्यक्त करता है। स्त्रीलिंग बहुवचन प्रत्यय का हिन्दी में अलग संकेत देना आवश्यक नहीं है।
