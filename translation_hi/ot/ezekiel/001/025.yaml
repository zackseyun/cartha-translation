translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण, सहज शैली रखी गई है। ‘विस्तार’ को पारंपरिक किंतु कम सहज ‘आकाशमण्डल’ के स्थान पर चुना गया है। अंग्रेज़ी परत की दूसरी पादटिप्पणी का चिह्न मुख्य पाठ में गलत स्थान पर था और उसकी सामग्री ‘expanse/firmament’ से संबंधित थी; हिंदी पाठ में अनावश्यक पादटिप्पणी न जोड़ते हुए केवल मूल इब्रानी की वास्तविक קוֹל-संबंधी अस्पष्टता को चिह्नित किया गया है।
