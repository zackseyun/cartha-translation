  yaml_path: translation/ot/ezekiel/001/025.yaml
  text: And there was a sound from above the expanse that was over their heads[a]; when they stood still[b], they let down their wings.
translation:
  language: hi
  text: और उस विस्तार के ऊपर से, जो उनके सिरों के ऊपर था, एक ध्वनि सुनाई दी[a]। जब वे खड़े हुए, तो उनके पंख ढीले पड़ गए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “एक वाणी सुनाई दी।” इब्रानी शब्द קוֹל का अर्थ “ध्वनि” या “वाणी” दोनों हो सकता है; इस वाक्य में अभी स्पष्ट शब्दों में बोलने का उल्लेख नहीं है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: और ... सुनाई दी
  rationale: यह कथानक में एक श्रव्य घटना के घटित होने को बताता है। हिंदी में ‘एक ध्वनि सुनाई दी’ स्वाभाविक है और अनावश्यक पुरातन शैली से बचता है।
- source_word: קוֹל
  choice: एक ध्वनि
  rationale: קוֹל का अर्थ ‘ध्वनि’ या ‘वाणी’ हो सकता है। इस वाक्य में अभी स्पष्ट रूप से बोले गए शब्दों का उल्लेख नहीं है, इसलिए मुख्य पाठ में ‘ध्वनि’ मूल की अस्पष्टता को बेहतर बनाए रखता है।
- source_word: מֵעַל לָרָקִיעַ
  choice: उस विस्तार के ऊपर से
  rationale: מֵעַל स्रोत और ऊर्ध्व स्थान दोनों का बोध कराता है। ‘ऊपर से’ ध्वनि के स्रोत को व्यक्त करता है, और רָקִיעַ के लिए ‘विस्तार’ आधुनिक तथा दृश्यात्मक हिंदी है।
- source_word: אֲשֶׁר עַל רֹאשָׁם
  choice: जो उनके सिरों के ऊपर था
  rationale: यह संबंधवाचक उपवाक्य ‘विस्तार’ को विशेषित करता है और उसके स्थान को यथार्थ रूप से बनाए रखता है।
- source_word: בְּעָמְדָם
  choice: जब वे स्थिर खड़े होते थे
  rationale: कालवाचक בְּ के साथ यह प्राणियों के चलना रोककर खड़े होने की परिस्थिति बताता है; ‘स्थिर’ प्रसंगगत अर्थ को स्पष्ट करता है।
- source_word: תְּרַפֶּינָה
  choice: नीचे कर लेते थे
  rationale: रפה के हिफ़ील रूप में ढीला छोड़ने या गिरा देने का भाव है। पंखों के संदर्भ में ‘नीचे कर लेते थे’ सहज हिंदी में उनकी उठी हुई अवस्था समाप्त होने को व्यक्त करता है।
- source_word: כַנְפֵיהֶן
  choice: अपने पंख
  rationale: स्त्रीलिंग बहुवचन प्रत्यय उन्हीं जीवित प्राणियों की ओर संकेत करता है; हिंदी में कर्ता-संबंध स्पष्ट करने के लिए ‘अपने पंख’ स्वाभाविक है।
