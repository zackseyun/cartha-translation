  text: And their faces and their wings were separated above[a]; each had two joined to one another[b], and two covering their bodies.
translation:
  language: hi
  text: और उनके चेहरे और उनके पंख ऊपर की ओर अलग-अलग थे[a]। हर एक के दो पंख एक-दूसरे से जुड़े थे[b], और दो पंख उनके शरीरों को ढके हुए थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “ऊपर फैले हुए थे।” इब्रानी क्रिया का मुख्य अर्थ “अलग किए हुए/विभक्त” है, पर इस संदर्भ में वह पंखों के ऊपर की ओर फैले होने का संकेत भी दे सकती है।
    reason: lexical_alternative
  - marker: b
    text: 'शाब्दिक रूप से इब्रानी वाक्य-विन्यास कठिन है: “हर एक के लिए, दो जुड़ी हुईं—हर एक—और दो उनके शरीरों को ढकती हुईं।”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּפְנֵיהֶם
  choice: उनके चेहरे
  rationale: פָּנִים का रूप बहुवचन है; दर्शन में वर्णित चारों जीवित प्राणियों के संदर्भ में ‘चेहरे’ स्वाभाविक और रूपानुकूल है।
- source_word: וְכַנְפֵיהֶם
  choice: उनके पंख
  rationale: इस दर्शन-संबंधी संदर्भ में כָּנָף का सामान्य और स्पष्ट हिन्दी रूप ‘पंख’ है।
- source_word: פְּרֻדוֹת מִלְמָעְלָה
  choice: ऊपर की ओर अलग-अलग थे
  rationale: פרד का मूल अर्थ अलग या विभक्त होना है। ‘ऊपर की ओर’ מִלְמָעְלָה की स्थान अथवा दिशा-संबंधी शक्ति को व्यक्त करता है, जबकि वैकल्पिक भाव ‘ऊपर फैले हुए’ पादटिप्पणी में रखा गया है।
- source_word: לְאִישׁ
  choice: हर एक के
  rationale: इस रचना में אִישׁ वितरणात्मक अर्थ देता है; ‘हर एक के’ हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: שְׁתַּיִם חֹבְרוֹת אִישׁ
  choice: दो पंख एक-दूसरे से जुड़े थे
  rationale: חבר जुड़ने या संबंधित होने का भाव देता है। कठिन इब्रानी रचना का पारस्परिक भाव पठनीय हिन्दी में रखा गया है, पर उसकी शाब्दिक अस्पष्टता पादटिप्पणी में सुरक्षित है।
- source_word: וּשְׁתַּיִם מְכַסּוֹת
  choice: और दो पंख ... ढके हुए थे
  rationale: स्त्रीलिंग बहुवचन कृदंत מְכַסּוֹת जारी वर्णनात्मक अवस्था बताता है; हिन्दी में ‘ढके हुए थे’ इसे स्वाभाविक रूप से व्यक्त करता है।
- source_word: אֵת גְּוִיֹתֵיהֶנָה
  choice: उनके शरीरों को
  rationale: גְּוִיָּה यहाँ जीवित प्राणियों के शरीर का सूचक है; ‘पीठ’ मूल शब्द से अधिक विशिष्ट होगा। बहुवचन प्रत्यय के अनुरूप ‘शरीरों’ रखा गया है।
