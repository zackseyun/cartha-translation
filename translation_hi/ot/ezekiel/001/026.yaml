source:
  edition: WLC
  text: וּ/מִ/מַּ֗עַל לָ/רָקִ֨יעַ֙ אֲשֶׁ֣ר עַל רֹאשָׁ֔/ם כְּ/מַרְאֵ֥ה אֶֽבֶן סַפִּ֖יר דְּמ֣וּת כִּסֵּ֑א וְ/עַל֙ דְּמ֣וּת הַ/כִּסֵּ֔א דְּמ֞וּת כְּ/מַרְאֵ֥ה אָדָ֛ם עָלָ֖י/ו מִ/לְ/מָֽעְלָ/ה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/001/026.yaml
  text: And above the expanse that was over their heads was the likeness of a throne[a], in appearance like sapphire stone; and above the likeness of the throne was a likeness with the appearance of a man above it.
translation:
  language: hi
  text: और उनके सिरों के ऊपर जो विस्तार था, उसके ऊपर सिंहासन की-सी आकृति थी, जो देखने में नीलमणि[a] के समान थी; और सिंहासन की उस आकृति के ऊपर मनुष्य के समान दिखाई देनेवाली एक आकृति थी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या संभवतः “लाजवर्द”; इब्रानी सपीर से अभिप्रेत प्राचीन रत्न की ठीक पहचान अनिश्चित है।
    reason: lexical_alternative
lexical_decisions:
- source_word: רָקִיעַ
  choice: विस्तार
  rationale: यह फैली हुई सतह का बोध कराता है और दर्शन में जीवित प्राणियों के ऊपर स्थित मंच-सदृश विस्तार के लिए स्वाभाविक आधुनिक हिन्दी है।
- source_word: כְּמַרְאֵה
  choice: देखने में … के समान / … के समान दिखाई देनेवाली
  rationale: यह प्रत्यक्ष पहचान के बजाय दृश्य समानता बतानेवाली बार-बार आने वाली दर्शनीय अभिव्यक्ति को बनाए रखता है।
- source_word: אֶבֶן סַפִּיר
  choice: नीलमणि
  rationale: यह पारंपरिक रत्न-संबंधी अर्थ को संक्षिप्त और स्वाभाविक हिन्दी में देता है; प्राचीन रत्न की ठीक पहचान अनिश्चित होने के कारण पादटिप्पणी जोड़ी गई है।
- source_word: דְּמוּת
  choice: आकृति
  rationale: ‘आकृति’ दृश्य रूप या समानता व्यक्त करती है और वर्णित वस्तु को उसी से पूर्णतः अभिन्न ठहराने से बचती है; पद में इसकी पुनरावृत्ति सुरक्षित रखी गई है।
- source_word: כִּסֵּא
  choice: सिंहासन
  rationale: राजकीय और दर्शनीय प्रसंग में यही स्वाभाविक अर्थ है।
- source_word: אָדָם
  choice: मनुष्य
  rationale: यहाँ एक मानव-सदृश रूप का उल्लेख है; आधुनिक मानक हिन्दी में ‘मनुष्य’ स्वाभाविक है और सामूहिक मानवजाति का अर्थ नहीं देता।
- source_word: עָלָיו מִלְמָעְלָה
  choice: उसके ऊपर
  rationale: यह स्थान-संबंधी अर्थ को स्पष्ट रखता है और स्रोत में निहित न होने वाले ‘बैठा हुआ’ जैसे विवरण नहीं जोड़ता।
theological_decisions:
- issue: सिंहासन के ऊपर की आकृति का मानव-सदृश वर्णन
  choice: “मनुष्य के समान दिखाई देनेवाली एक आकृति”
  alternative: “मनुष्य जैसा कोई” या “मानवीय रूप”
  rationale: इब्रानी में דמות और כמראה की परतदार भाषा प्रत्यक्ष पहचान के बजाय समानता व्यक्त करती है। यह अनुवाद मानव-सदृश प्रकट रूप को स्पष्ट करता है, पर परमेश्वर को सपाट रूप से मानव शरीर वाला नहीं ठहराता।
- issue: आकृति की मुद्रा
  choice: केवल “ऊपर” कहना
  alternative: “बैठी हुई” कहना
  rationale: मूल पाठ स्थान बताता है, बैठने की क्रिया स्पष्ट नहीं करता; इसलिए ऐसी मुद्रा जोड़ना उचित नहीं है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध हिन्दी। ‘आकृति’ और समानता-सूचक वाक्य-विन्यास द्वारा दर्शन की सावधान, अप्रत्यक्ष भाषा बनाए रखी गई है।
