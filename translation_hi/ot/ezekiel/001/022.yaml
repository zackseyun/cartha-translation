language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וּ/דְמ֞וּת עַל רָאשֵׁ֤י הַ/חַיָּה֙ רָקִ֔יעַ כְּ/עֵ֖ין הַ/קֶּ֣רַח הַ/נּוֹרָ֑א נָט֥וּי עַל רָאשֵׁי/הֶ֖ם מִ/לְ/מָֽעְלָ/ה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/001/022.yaml
  text: And above the heads of the living creatures there was the likeness of an expanse[a], like the appearance of awe-inspiring ice[b], stretched out above their heads from above.
translation:
  language: hi
  text: और जीवित प्राणियों[a] के सिरों के ऊपर एक विस्तार का-सा स्वरूप था, जो भय-विस्मय जगाने वाली बर्फ़[b] के दृश्य के समान था; वह ऊपर से उनके सिरों के ऊपर फैला हुआ था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में यहाँ ‘जीवित प्राणी’ एकवचन रूप में है, पर उसका अर्थ सामूहिक है; आगे इसी पद में ‘उनके सिरों’ कहा गया है।
    reason: lexical_alternative
  - marker: b
    text: 'परंपरागत अनुवाद: ‘स्फटिक’। इब्रानी शब्द का अधिक सामान्य अर्थ ‘बर्फ़’ है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּדְמוּת
  choice: और ... एक ... का-सा स्वरूप था
  rationale: דְּמוּת समानता, स्वरूप या सदृश्यता को व्यक्त करता है। ‘का-सा स्वरूप’ दर्शन के उपमात्मक और सावधान वर्णन को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: הַחַיָּה
  choice: जीवित प्राणियों
  rationale: इब्रानी में रूप एकवचन है, पर यह सामूहिक अर्थ में प्रयुक्त हुआ है और आगे बहुवचन प्रत्यय ‘उनके सिरों’ से इसकी पुष्टि होती है। इसलिए मुख्य पाठ में स्वाभाविक बहुवचन रखा गया है और मूल की विशेषता पाद-टिप्पणी में बताई गई है।
- source_word: רָקִיעַ
  choice: विस्तार
  rationale: यह शब्द ऊपर फैली या तनी हुई वस्तु को दर्शाता है। ‘विस्तार’ आधुनिक और बोधगम्य है तथा ‘आकाशमंडल’ जैसे अधिक व्याख्यात्मक विकल्प से बचता है।
- source_word: כְּעֵין
  choice: जिसका रूप ... जैसा था
  rationale: यह पद दृश्य समानता बताता है, सीधी पहचान नहीं। यह अनुवाद यहेजकेल की बार-बार आने वाली उपमात्मक भाषा को सुरक्षित रखता है।
- source_word: הַקֶּרַח
  choice: बर्फ़
  rationale: इस संज्ञा का सामान्य अर्थ ‘बर्फ़’ है। परंपरागत ‘स्फटिक’ को पाद-टिप्पणी में रखा गया है।
- source_word: הַנּוֹרָא
  choice: भय-विस्मय जगाने वाली
  rationale: मूल शब्द भय, श्रद्धामिश्रित विस्मय और आतंक उत्पन्न करने वाली वस्तु का बोध करा सकता है। संयुक्त अभिव्यक्ति इसके अर्थ-क्षेत्र को केवल ‘भयानक’ या केवल ‘अद्भुत’ तक सीमित नहीं करती।
- source_word: נָטוּי
  choice: फैला हुआ था
  rationale: निष्क्रिय कृदंत ऊपर तनी या विस्तारित वस्तु का चित्र देता है। ‘फैला हुआ’ स्वाभाविक हिन्दी में उस दृश्य को व्यक्त करता है।
- source_word: מִלְמָעְלָה
  choice: ऊपर से
  rationale: यह पद ऊपर की स्थिति या दिशा पर बल देता है। निकटवर्ती ‘सिरों के ऊपर’ के साथ कुछ पुनरुक्ति मूल इब्रानी में भी है, इसलिए उसे हटाया नहीं गया।
theological_decisions:
- issue: दर्शन की उपमात्मक भाषा
  choice: ‘का-सा स्वरूप’ और ‘रूप ... जैसा’ द्वारा समानता के दोनों संकेत सुरक्षित रखे गए हैं।
  alternative: वाक्य को सीधे इस प्रकार कहना कि उनके ऊपर भय-विस्मयकारी बर्फ़ का एक विस्तार था।
  rationale: मूल पाठ दर्शन में दिखाई दी वस्तु को सीधे पहचानने के बजाय स्वरूप और दृश्य समानता की भाषा में प्रस्तुत करता है। इसे बनाए रखना नबी के दावे को अनावश्यक रूप से अधिक निश्चित बनाने से बचाता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य रखी गई है। ‘भय-विस्मय’ दर्शन के श्रद्धामिश्रित आतंक को व्यक्त करता है, जबकि ‘विस्तार’ अनावश्यक रूप से किसी विशेष ब्रह्मांड-विज्ञान की व्याख्या आरोपित नहीं करता।
