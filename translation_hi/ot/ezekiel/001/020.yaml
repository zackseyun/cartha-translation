  text: עַ֣ל אֲשֶׁר֩ יִֽהְיֶה שָּׁ֨ם הָ/ר֤וּחַ לָ/לֶ֨כֶת֙ יֵלֵ֔כוּ שָׁ֥מָּ/ה הָ/ר֖וּחַ לָ/לֶ֑כֶת וְ/הָ/אוֹפַנִּ֗ים יִנָּשְׂאוּ֙ לְ/עֻמָּתָ֔/ם כִּ֛י ר֥וּחַ הַ/חַיָּ֖ה בָּ/אוֹפַנִּֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/001/020.yaml
  text: Wherever the spirit wanted to go[a], they went there; and the wheels were lifted up alongside them[c][b], because the spirit of the living creature was in the wheels.
translation:
  language: hi
  text: जहाँ कहीं आत्मा जाना चाहती थी[a], वे वहीं जाते थे; और पहिए उनके साथ-साथ[b] ऊपर उठाए जाते थे, क्योंकि जीवधारी की आत्मा[c] पहियों में थी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “हवा” अथवा “साँस”; इब्रानी शब्द רוּחַ के ये सभी अर्थ हो सकते हैं। यहाँ यह दर्शन में जीवन देने वाली या दिशा देने वाली आत्मा को सूचित करता है।
    reason: lexical_alternative
  - marker: b
    text: '“उनके साथ-साथ” के लिए अन्य संभव अर्थ हैं: “उनके सामने” या “उनके अनुरूप।”'
    reason: lexical_alternative
  - marker: c
    text: कुछ पाठक यहाँ “आत्मा” को परमेश्वर की आत्मा का उल्लेख समझते हैं, पर इब्रानी पाठ यह पहचान स्पष्ट नहीं करता।
    reason: alternative_reading
lexical_decisions:
- source_word: הָרוּחַ / רוּחַ
  choice: आत्मा
  rationale: रूअख का अर्थ हवा, साँस या आत्मा हो सकता है। दर्शन में यह जीवधारियों और पहियों को चेतन तथा निर्देशित करने वाली शक्ति को सूचित करती है; ‘आत्मा’ अर्थ की व्यापकता बनाए रखता है।
- source_word: עַל אֲשֶׁר יִהְיֶה שָּׁם
  choice: जहाँ कहीं
  rationale: यह अनिश्चित स्थानवाचक संबंधसूचक वाक्यांश है; ‘जहाँ कहीं’ उसके वितरणात्मक भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: לָלֶכֶת ... יֵלֵכוּ
  choice: जाना चाहती थी ... जाते थे
  rationale: यह रचना निर्देशित अथवा इच्छित गति बताती है। हिन्दी में ‘जाना चाहती थी’ उस भाव को स्वाभाविक रूप से व्यक्त करता है, जबकि ‘जाते थे’ वर्णित बार-बार होने वाली गति के अनुकूल है।
- source_word: שָׁמָּה
  choice: वहीं
  rationale: स्थान की ओर गति का भाव हिन्दी के ‘वहीं जाते थे’ में स्पष्ट और सहज है।
- source_word: הָאוֹפַנִּים
  choice: पहिए
  rationale: दर्शन में दिखाई देने वाले पहियों के लिए यह सीधा और प्रचलित हिन्दी शब्द है।
- source_word: יִנָּשְׂאוּ
  choice: ऊपर उठ जाते थे
  rationale: निफ़अल रूप उठाए जाने अथवा ऊपर उठने का भाव देता है। यह हिन्दी प्रयोग दृश्य की गति को सहज रखता है, यद्यपि कठोर रूप से ‘उठाए जाते थे’ भी संभव है।
- source_word: לְעֻמָּתָם
  choice: उनके साथ-साथ
  rationale: शब्द जीवधारियों के अनुरूप, सामने अथवा पास की स्थिति सूचित कर सकता है। गति के इस प्रसंग में ‘साथ-साथ’ सबसे स्पष्ट है, जबकि विकल्प पादटिप्पणी में सुरक्षित हैं।
- source_word: הַחַיָּה
  choice: जीवधारी
  rationale: इब्रानी में पद एकवचन है, यद्यपि व्यापक संदर्भ में अनेक जीवधारी हैं। हिन्दी का एकवचन ‘जीवधारी’ व्याकरणिक रूप को बनाए रखता है।
theological_decisions:
- issue: क्या רוּחַ को परमेश्वर के पवित्र आत्मा के स्पष्ट उल्लेख के रूप में समझा जाए
  choice: आत्मा
  alternative: पवित्र आत्मा / परमेश्वर का आत्मा
  rationale: इब्रानी पाठ इसे स्पष्ट रूप से परमेश्वर के आत्मा के रूप में नहीं पहचानता। इसलिए सामान्य ‘आत्मा’ रखा गया है और संभावित धार्मिक पहचान को पाठ में आरोपित नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में स्वाभाविक, गरिमापूर्ण और साधारण पाठकों के लिए स्पष्ट शैली। ‘रूह’ के बजाय ‘आत्मा’ चुना गया है; वाक्य की आवर्ती गति दिखाने के लिए ‘जाते थे’ और ‘उठ जाते थे’ रखा गया है। सभी पादटिप्पणी चिह्न मुख्य पाठ में उपस्थित हैं।
