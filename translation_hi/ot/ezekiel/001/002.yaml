lexical_decisions:
- source_word: בַּ/חֲמִשָּׁה
  choice: पाँचवें दिन
  rationale: तिथि बताने के इस इब्रानी प्रयोग में ‘पाँच’ के साथ ‘दिन’ निहित है; स्वाभाविक और स्पष्ट हिन्दी के लिए ‘दिन’ व्यक्त किया गया है।
- source_word: לַ/חֹדֶשׁ
  choice: महीने के
  rationale: इब्रानी तिथि-सूत्र में यह पद ‘महीने के पाँचवें दिन’ का अर्थ पूरा करता है; यही आधुनिक हिन्दी का स्वाभाविक क्रम है।
- source_word: הִיא
  choice: यह ... था
  rationale: स्वतंत्र सर्वनाम पहले बताए गए समय का स्पष्टीकरण देते हुए उसे अगले काल-निर्देश से जोड़ता है; ‘यह ... था’ उसके पुनरुक्तिपरक और व्याख्यात्मक बल को बनाए रखता है।
- source_word: הַ/שָּׁנָה הַ/חֲמִישִׁית
  choice: पाँचवाँ वर्ष
  rationale: क्रमसूचक काल-निर्देश का सीधा और स्पष्ट अनुवाद।
- source_word: לְ/גָלוּת
  choice: निर्वासन का
  rationale: גָלוּת निर्वासन की अवस्था अथवा निर्वासित किए जाने की घटना, दोनों को सूचित कर सकता है। मुख्य पाठ में ‘निर्वासन’ व्यापक और कालगणना के लिए स्वाभाविक है; वैकल्पिक अर्थ पादटिप्पणी में रखा गया है।
- source_word: הַ/מֶּלֶךְ
  choice: राजा
  rationale: व्यक्तिनाम से पहले राजकीय उपाधि के रूप में हिन्दी में ‘राजा यहोयाकीन’ स्वाभाविक है।
- source_word: יוֹיָכִין
  choice: यहोयाकीन
  rationale: इब्रानी व्यक्तिनाम का हिन्दी बाइबलीय परंपरा में प्रचलित लिप्यंतरण अपनाया गया है।
