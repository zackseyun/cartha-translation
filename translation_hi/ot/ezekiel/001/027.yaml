base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/001/027.yaml
  text: And I saw something like the appearance of glowing metal[a], like the appearance of fire all around within it, from the appearance of his waist and upward; and from the appearance of his waist and downward I saw something like the appearance of fire[b], and brightness all around him.
translation:
  language: hi
  text: और मैंने उसकी कमर के स्तर से ऊपर चमकती हुई धातु[a] के रूप-सा कुछ देखा, जो उसके भीतर चारों ओर आग के रूप-सा दिखाई देता था[b]। और उसकी कमर के स्तर से नीचे मैंने आग के रूप-सा कुछ देखा, और उसके चारों ओर उजाला था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी शब्द חַשְׁמַל (हशमल) का अर्थ अनिश्चित है; इसके संभावित अर्थों में “कहरुवा” या “इलेक्ट्रम,” अर्थात सोने-चाँदी की चमकीली मिश्रधातु, शामिल हैं।
    reason: lexical_alternative
  - marker: b
    text: “उसके भीतर चारों ओर” के रूप में अनूदित इब्रानी वाक्यांश कठिन है। इसका अर्थ यह भी हो सकता है कि आग उसे चारों ओर से घेरे हुए, या किसी उज्ज्वल आवरण के भीतर दिखाई दे रही थी।
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּעֵין
  choice: कुछ ऐसा ... जैसा
  rationale: यह तुलना को प्रत्यक्ष पहचान के रूप में नहीं, बल्कि दर्शन में दिखाई पड़ी समानता के रूप में व्यक्त करता है और यहेजकेल की सावधान, अनिश्चित वर्णन-शैली बनाए रखता है।
- source_word: חַשְׁמַל
  choice: चमकती हुई धातु
  rationale: दुर्लभ इब्रानी शब्द का सटीक अर्थ अनिश्चित है। यह चयन उसके उज्ज्वल, धातु-सदृश भाव को सामान्य पाठक के लिए स्वाभाविक भाषा में व्यक्त करता है; विकल्प पादटिप्पणी में दिए गए हैं।
- source_word: כְּמַרְאֵה
  choice: जैसा / का-सा रूप
  rationale: प्रसंगानुसार स्वाभाविक हिन्दी प्रयोग करते हुए दृश्य समानता और प्रत्यक्ष अनुभूति का भाव सुरक्षित रखा गया है, बिना यह कहे कि वह वस्तु वास्तव में धातु या आग ही थी।
- source_word: בֵּית לָהּ סָבִיב
  choice: उसके भीतर चारों ओर
  rationale: कठिन वाक्यांश में भीतर होने और चारों ओर फैले होने, दोनों संकेत हैं। हिन्दी रूप अर्थ को अनावश्यक रूप से किसी आवरण या खोल के रूप में निश्चित नहीं करता।
- source_word: מָתְנָיו
  choice: उसकी कमर
  rationale: यह आधुनिक हिन्दी में स्वाभाविक है और दर्शन में वर्णित पुरुष-सदृश आकृति के लिए इब्रानी के पुल्लिंग एकवचन प्रत्यय को बनाए रखता है।
- source_word: אֵשׁ
  choice: आग
  rationale: यह शब्द का सीधा, सामान्य और प्रसंगानुकूल हिन्दी अनुवाद है।
- source_word: וְנֹגַהּ לוֹ סָבִיב
  choice: उसके चारों ओर उजाला था
  rationale: נֹגַהּ की चमक या दीप्ति को सहज हिन्दी में व्यक्त करता है और पुल्लिंग सर्वनाम को सुरक्षित रखता है।
theological_decisions:
- issue: दर्शन में मानव-सदृश वर्णन का संदर्भ
  choice: “उसकी कमर” और “उसके चारों ओर”
  alternative: “उसकी आकृति का मध्य भाग” अथवा निर्जीव संदर्भ वाला “उसके चारों ओर”
  rationale: इब्रानी में पुल्लिंग एकवचन प्रत्यय हैं और निकटवर्ती संदर्भ मानव-सदृश रूप का वर्णन करता है। पुल्लिंग सर्वनाम स्रोत की व्याकरणिक और मानवाकार कल्पना को सुरक्षित रखता है, पर उस आकृति की पहचान पाठ से आगे जाकर निश्चित नहीं करता।
- issue: आग और चमकती धातु के संबंध की अनिश्चितता
  choice: “मानो उसके भीतर चारों ओर आग हो”
  alternative: “मानो आग ने उसे चारों ओर से घेर रखा हो”
  rationale: मूल वाक्यांश कठिन है और आग के भीतर होने, चारों ओर होने अथवा किसी घेरे में होने की व्याख्या संभव है। चुना गया पाठ भीतर और चारों ओर के संकेतों को रखता है, जबकि पादटिप्पणी वास्तविक अस्पष्टता बताती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य हिन्दी पाठक के लिए बोधगम्य रखी गई है। “कुछ ऐसा,” “जैसा,” “मानो,” और “का-सा रूप” दर्शन की तुलना-प्रधान, अनिश्चित अभिव्यक्ति को बनाए रखते हैं। वाक्य-विन्यास को हिन्दी में स्वाभाविक बनाने के लिए कमर से ऊपर और नीचे के स्थान-सूचकों को उनके संबंधित दृश्य-वर्णनों के साथ रखा गया है।
