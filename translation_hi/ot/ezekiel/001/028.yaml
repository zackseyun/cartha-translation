base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/001/028.yaml
  text: Like the appearance of the rainbow that is in the cloud on a day of rain[a], so was the appearance of the brightness all around. This was the appearance of the likeness of the glory of Yahweh. When I saw it, I fell on my face[d][c][b], and I heard the voice of one speaking.
translation:
  language: hi
  text: जैसा वर्षा के दिन बादल में दिखाई देनेवाले इंद्रधनुष[a] का रूप होता है, वैसा ही चारों ओर की चमक[b] का रूप था। यह यहोवा की महिमा की समानता का रूप था[c]। उसे देखकर मैं मुँह के बल गिर पड़ा और मैंने किसी के बोलने की आवाज़ सुनी[d]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: मूल इब्रानी में ‘धनुष’; बादल और वर्षा के इस प्रसंग में इसका अर्थ इंद्रधनुष है।
    reason: lexical_alternative
  - marker: b
    text: या ‘दीप्ति’।
    reason: lexical_alternative
  - marker: c
    text: मूल इब्रानी में शाब्दिक रूप से ‘यहोवा की महिमा की समानता का रूप’ है। यहेजकेल के दर्शन-वर्णन में रूप, समानता और महिमा—तीनों स्तर सुरक्षित हैं।
    reason: cultural_note
  - marker: d
    text: या ‘मैंने एक आवाज़ को बोलते हुए सुना।’ इब्रानी इस खंड में बोलनेवाले की पहचान स्पष्ट नहीं करता।
    reason: alternative_reading
lexical_decisions:
- source_word: כְּמַרְאֵה הַקֶּשֶׁת
  choice: इंद्रधनुष का रूप
  rationale: מַרְאֶה के लिए ‘रूप’ यहेजकेल की बार-बार प्रयुक्त दृश्य भाषा को बनाए रखता है। קֶשֶׁת का मूल अर्थ ‘धनुष’ है, पर बादल और वर्षा के इस प्रसंग में ‘इंद्रधनुष’ अभिप्रेत है।
- source_word: אֲשֶׁר יִהְיֶה בֶעָנָן בְּיוֹם הַגֶּשֶׁם
  choice: वर्षा के दिन बादल में दिखाई देनेवाले
  rationale: इब्रानी का आशय स्वाभाविक आधुनिक हिन्दी में व्यक्त किया गया है; ‘दिखाई देनेवाले’ दृश्य के वर्णन को स्पष्ट करता है, बिना अर्थ बदले।
- source_word: כֵּן מַרְאֵה הַנֹּגַהּ סָבִיב
  choice: वैसा ही चारों ओर के तेज का रूप
  rationale: נֹגַהּ चमक, तेज या दीप्ति को सूचित करता है। ‘तेज’ सरल, गरिमामय और इस दिव्य दर्शन के अनुकूल है; סָבִיב को ‘चारों ओर’ कहा गया है।
- source_word: מַרְאֵה דְּמוּת כְּבוֹד יְהוָה
  choice: यहोवा की महिमा की समानता का रूप
  rationale: ‘रूप—समानता—महिमा’ की क्रमिक योग्यताओं को बनाए रखा गया है, ताकि दर्शन को सीधे परमेश्वर के सार से समान न ठहराया जाए।
- source_word: יְהוָה
  choice: यहोवा
  rationale: व्यक्तिगत ईश्वरीय नाम को हिन्दी में प्रचलित लिप्यंतरण ‘यहोवा’ द्वारा व्यक्त किया गया है, न कि उपाधि से प्रतिस्थापित किया गया है।
- source_word: וָאֶפֹּל עַל־פָּנַי
  choice: मैं मुँह के बल गिर पड़ा
  rationale: यह स्वाभाविक हिन्दी में दण्डवत् गिरने, विस्मय और अधीनता का शारीरिक भाव सुरक्षित रखता है।
- source_word: וָאֶשְׁמַע קוֹל מְדַבֵּר
  choice: मैंने किसी के बोलने की आवाज़ सुनी
  rationale: מְדַבֵּר बोलनेवाले की पहचान स्पष्ट नहीं करता। ‘किसी के’ इस अनिश्चितता को बनाए रखता है; קוֹל के लिए यहाँ ‘आवाज़’ स्वाभाविक है।
theological_decisions:
- issue: दिव्य प्रकटता के लिए प्रयुक्त स्तरित अभिव्यक्ति
  choice: यहोवा की महिमा की समानता का रूप
  alternative: यहोवा की महिमा की समानता; यहोवा की महिमा का रूप
  rationale: इब्रानी में מַרְאֵה, דְּמוּת और כָּבוֹד तीनों स्तर बने हुए हैं। उन्हें संक्षिप्त करने से मूल पाठ का धर्मवैचारिक संयम और दर्शनात्मक दूरी घट जाती।
- issue: अंतिम खंड में बोलनेवाले की पहचान
  choice: किसी के बोलने की आवाज़
  alternative: उसके बोलने की आवाज़; एक बोलती हुई आवाज़
  rationale: इस खंड में इब्रानी कृदंत का स्पष्ट कर्ता नहीं है। इसलिए वक्ता को यहोवा या किसी अन्य सत्ता के रूप में निश्चित नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी, सरल किंतु गरिमामय शैली। दर्शन-वर्णन की पुनरावृत्त दृश्य शब्दावली और मूल की धर्मवैचारिक सावधानी सुरक्षित रखी गई है। सभी पादटिप्पणी-चिह्न मुख्य पाठ में क्रम से दिए गए हैं।
