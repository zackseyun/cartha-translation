  text: הָיֹ֣ה הָיָ֣ה דְבַר יְ֠הוָה אֶל יְחֶזְקֵ֨אל בֶּן בּוּזִ֧י הַ/כֹּהֵ֛ן בְּ/אֶ֥רֶץ כַּשְׂדִּ֖ים עַל נְהַר כְּבָ֑ר וַ/תְּהִ֥י עָלָ֛י/ו שָׁ֖ם יַד יְהוָֽה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/001/003.yaml
  text: the word of Yahweh came indeed to Ezekiel son of Buzi[a], the priest, in the land of the Chaldeans by the Kebar River[c][b], and there the hand of Yahweh came upon him.
translation:
  language: hi
  text: यहोवा का वचन निश्चय ही[a] याजक बूजी के पुत्र यहेजकेल के पास कसदियों[b] के देश में, कबार नदी[c] के किनारे आया; और वहाँ यहोवा का हाथ उस पर आ गया।[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में क्रिया दोहराकर बल दिया गया है; अनुवाद हो सकता है, “यहोवा का वचन सचमुच याजक बूजी के पुत्र यहेजकेल के पास आया।”
    reason: lexical_alternative
  - marker: b
    text: “कसदियों” का अर्थ इस संदर्भ में “बाबुलियों” भी समझा जा सकता है।
    reason: lexical_alternative
  - marker: c
    text: कबार संभवतः एक नहर थी।
    reason: lexical_alternative
  - marker: d
    text: या, “वहाँ यहोवा का हाथ उस पर था।”
    reason: alternative_reading
lexical_decisions:
- source_word: הָיֹה הָיָה
  choice: निश्चय ही ... आया
  rationale: क्रिया के अनंत निरपेक्ष और सीमित रूप की पुनरुक्ति कथन पर बल देती है; हिंदी में ‘निश्चय ही’ इस बल को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: דְבַר יְהוָה
  choice: यहोवा का वचन
  rationale: यह मानक भविष्यद्वाणी-सूत्र है। ‘वचन’ ईश्वरीय प्रकाशन की औपचारिक और धर्मवैज्ञानिक गूँज बनाए रखता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: चतुरक्षरीय व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय हिंदी में प्रचलित नामरूप ‘यहोवा’ द्वारा प्रस्तुत किया गया है।
- source_word: יְחֶזְקֵאל בֶּן בּוּזִי הַכֹּהֵן
  choice: बूजी के पुत्र यहेजकेल याजक
  rationale: नाम और पितृपरिचय को सीधे रखा गया है; ‘याजक’ मूल के समान यहेजकेल की पहचान बताता है।
- source_word: בְּאֶרֶץ כַּשְׂדִּים
  choice: कसदियों के देश में
  rationale: כַּשְׂדִּים का अधिक प्रत्यक्ष जातिनाम ‘कसदी’ है; ‘बाबुलियों’ को टिप्पणी में अर्थगत विकल्प के रूप में रखा गया है।
- source_word: עַל נְהַר כְּבָר
  choice: कबार नदी के किनारे
  rationale: עַל यहाँ स्थानसूचक है। ‘किनारे’ सहज हिंदी है; कबार जलमार्ग को परंपरागत रूप से नदी कहा जाता है, यद्यपि संभवतः वह नहर थी।
- source_word: וַתְּהִי עָלָיו שָׁם יַד יְהוָה
  choice: वहाँ यहोवा का हाथ उस पर आ पड़ा
  rationale: ‘हाथ’ का मूल रूपक सुरक्षित रखा गया है और וַתְּהִי की घटनात्मक शक्ति को ‘आ पड़ा’ व्यक्त करता है; इसे केवल ‘सामर्थ्य’ कहकर संकीर्ण नहीं किया गया।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: प्रभु
  rationale: मूल पाठ में व्यक्तिगत वाचा-नाम है; उसे उपाधि से प्रतिस्थापित न कर नाम के रूप में सुरक्षित रखा गया है।
- issue: ‘यहोवा का हाथ’ भविष्यद्वाणी-संबंधी मुहावरा
  choice: यहोवा का हाथ उस पर आ पड़ा
  alternative: यहोवा की सामर्थ्य उस पर आई / यहोवा का हाथ उस पर था
  rationale: मूल बिंब ईश्वरीय क्रिया, सामर्थ्य और भविष्यद्वाणी की प्रेरणा के बीच निहित व्यापकता और तनाव बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और साधारण हिंदी पाठक के लिए सुबोध रखी गई है। वाक्य में मूल का बल, भविष्यद्वाणी-सूत्र और ‘यहोवा का हाथ’ रूपक सुरक्षित हैं; ‘कसदी’ तथा ‘कबार नदी’ जैसे पारंपरिक बाइबलीय रूपों के संभावित अर्थ टिप्पणियों में स्पष्ट किए गए हैं।
