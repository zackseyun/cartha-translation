  text: וּ/בְ/לֶ֨כֶת֙ הַֽ/חַיּ֔וֹת יֵלְכ֥וּ הָ/אוֹפַנִּ֖ים אֶצְלָ֑/ם וּ/בְ/הִנָּשֵׂ֤א הַֽ/חַיּוֹת֙ מֵ/עַ֣ל הָ/אָ֔רֶץ יִנָּשְׂא֖וּ הָ/אוֹפַנִּֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/001/019.yaml
  text: When the living creatures moved[a], the wheels moved beside them; and when the living creatures were lifted up from the earth[b], the wheels were lifted up.
translation:
  language: hi
  text: जब जीवित प्राणी चलते थे[a], तब पहिए उनके पास चलते थे; और जब जीवित प्राणी धरती के ऊपर से उठाए जाते थे[b], तब पहिए भी उठाए जाते थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “जाते थे”; जीवित प्राणियों और पहियों की समन्वित गति को व्यक्त करने के लिए इब्रानी में एक ही क्रिया प्रयुक्त हुई है।
    reason: lexical_alternative
  - marker: b
    text: यहेजकेल आगे इन “जीवित प्राणियों” की पहचान करूबों के रूप में करता है (देखें यहेजकेल 10:20)।
    reason: cross_reference
lexical_decisions:
- source_word: וּבְלֶכֶת / יֵלְכוּ
  choice: जब ... चलते थे / चलते थे
  rationale: ב के साथ הלך का infinitive construct समयसूचक परिस्थिति बताता है। हिंदी में ‘जब ... चलते थे’ स्वाभाविक है और जीवित प्राणियों तथा पहियों के लिए प्रयुक्त एक ही इब्रानी धातु को समान क्रिया से बनाए रखता है।
- source_word: הַחַיּוֹת
  choice: जीवित प्राणी
  rationale: यह दर्शन के सजीव सिंहासन-प्राणियों को सूचित करता है, साधारण पशुओं को नहीं। ‘जीवित प्राणी’ मूल की सामान्य संज्ञा को बनाए रखता है और इसी पद में उनकी बाद की पहचान को पहले से आरोपित नहीं करता।
- source_word: הָאוֹפַנִּים
  choice: पहिए
  rationale: אופן का सीधा अर्थ ‘पहिया’ है; बहुवचन दर्शन में प्राणियों से जुड़े पहियों को दर्शाता है।
- source_word: אֶצְלָם
  choice: उनके पास-पास
  rationale: אצל निकटता और साथ की स्थिति बताता है। ‘पास-पास’ समन्वित गति को स्वाभाविक हिंदी में व्यक्त करता है, बिना यह जोड़े कि पहिए किस विशेष दिशा में थे।
- source_word: וּבְהִנָּשֵׂא / יִנָּשְׂאוּ
  choice: जब ... ऊपर उठाए जाते थे / ऊपर उठाए जाते थे
  rationale: נשׂא के निफ़अल रूपों का निष्क्रिय भाव रखा गया है। दोनों स्थानों पर समान हिंदी अभिव्यक्ति मूल की पुनरावृत्ति और प्राणियों व पहियों की समन्वित गति को सुरक्षित रखती है।
- source_word: מֵעַל הָאָרֶץ
  choice: धरती से ऊपर
  rationale: शाब्दिक भाव ‘धरती के ऊपर से’ है। ‘धरती से ऊपर’ जमीन छोड़कर ऊपर उठने का अर्थ स्पष्ट और सहज हिंदी में देता है।
theological_decisions:
- issue: दर्शन में הַחַיּוֹת की पहचान
  choice: मुख्य पाठ में सामान्य पद ‘जीवित प्राणी’
  alternative: ‘करूब’
  rationale: यद्यपि यहेजकेल 10:20 में इनकी पहचान करूबों के रूप में होती है, इस पद में मूल पाठ सामान्य शब्द חַיּוֹת ही रखता है। इसलिए बाद की पहचान को मुख्य पाठ में पहले से नहीं जोड़ा गया।
- issue: ऊपर उठने में कर्तृत्व
  choice: निष्क्रिय अभिव्यक्ति ‘ऊपर उठाए जाते थे’
  alternative: ‘ऊपर उठते थे’
  rationale: निफ़अल रूप का निष्क्रिय भाव बनाए रखने से पाठ यह तय नहीं करता कि उठाने वाला कौन है; इससे मूल की संभावित धार्मिक और व्याकरणिक अस्पष्टता सुरक्षित रहती है।
translation_notes:
  register: आधुनिक मानक हिंदी का सहज, गरिमापूर्ण रूप अपनाया गया है। ‘जीवित प्राणी’, ‘पहिए’ और समानांतर क्रियाओं की पुनरावृत्ति दृश्य की शब्दावली तथा लय को बनाए रखती है।
