source:
  edition: WLC
  text: עָרֶ֨י/ךָ֙ חָרְבָּ֣ה אָשִׂ֔ים וְ/אַתָּ֖ה שְׁמָמָ֣ה תִֽהְיֶ֑ה וְ/יָדַעְתָּ֖ כִּֽי אֲנִ֥י יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/035/004.yaml
  text: I will make your cities ruins[a], and you will become a desolation; then you will know that I am Yahweh.
translation:
  language: hi
  text: मैं तेरे नगरों को खंडहर बना दूँगा, और तू उजाड़ हो जाएगा; तब तू जान लेगा कि मैं याहवे हूँ।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עָרֶיךָ
  choice: तेरे नगरों
  rationale: עִיר के बहुवचन रूप पर द्वितीय पुरुष एकवचन पुल्लिंग प्रत्यय है; संबोधित सेईर पर्वत के अधीन बसे नगर अभिप्रेत हैं।
- source_word: חָרְבָּה אָשִׂים
  choice: खंडहर बना दूँगा
  rationale: חָרְבָּה विनाश और ध्वस्त दशा को दर्शाता है, और שׂוּם के साथ यह परिणामसूचक रचना है; आधुनिक हिन्दी में यह स्वाभाविक और सशक्त है।
- source_word: וְאַתָּה שְׁמָמָה תִהְיֶה
  choice: और तू उजाड़ हो जाएगा
  rationale: स्पष्ट וְאַתָּה संबोधित सत्ता पर बल देता है। שְׁמָמָה संज्ञात्मक रूप से पूर्ण उजाड़ दशा बताता है; हिन्दी में विशेषणात्मक मुहावरा अर्थ को स्वाभाविक रूप से पहुँचाता है।
- source_word: וְיָדַעְתָּ
  choice: तब तू जान लेगा
  rationale: वाव यहाँ न्याय के फलस्वरूप होने वाली पहचान को जोड़ता है; ‘तब’ उस परिणाम-संबंध को स्पष्ट करता है और ‘जान लेगा’ भविष्य की निर्णायक पहचान व्यक्त करता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: मूल में परमेश्वर का व्यक्तिगत वाचा-नाम YHWH है। हिन्दी बाइबलीय परंपरा में प्रचलित लिप्यंतरण ‘यहोवा’ नाम को उपाधि में बदले बिना सुरक्षित रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे / प्रभु
  rationale: पाठ स्वयं चार-अक्षरी व्यक्तिगत नाम देता है। ‘यहोवा’ आधुनिक हिन्दी पाठकों के बीच व्यापक रूप से पहचाना जाने वाला नाम-रूप है; ‘प्रभु’ नाम को उपाधि में बदल देता, जबकि ‘याहवे’ अधिक संभावित विद्वत्तापरक उच्चारण है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और प्रत्यक्ष भविष्यद्वाणी की शैली में है। एकवचन पुल्लिंग संबोधन बनाए रखने के लिए ‘तेरे/तू’ रखा गया है। ‘खंडहर’ नगरों के विनाश को और ‘उजाड़’ पूरे संबोधित सेईर की निर्जन दशा को अलग-अलग व्यक्त करते हैं।
