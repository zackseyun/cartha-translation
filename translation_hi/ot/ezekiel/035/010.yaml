id: EZK.35.10
reference: Ezekiel 35:10
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: יַ֣עַן אֲ֠מָרְ/ךָ אֶת שְׁנֵ֨י הַ/גּוֹיִ֜ם וְ/אֶת שְׁתֵּ֧י הָ/אֲרָצ֛וֹת לִ֥/י תִהְיֶ֖ינָה וִֽ/ירַשְׁנ֑וּ/הָ וַֽ/יהוָ֖ה שָׁ֥ם הָיָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/035/010.yaml
  text: Because you said[a], ‘These two nations and these two lands will be mine[b], and we will possess them’—though Yahweh was there—
translation:
  language: hi
  text: क्योंकि तूने कहा[a], ‘ये दोनों जातियाँ और ये दोनों देश मेरे हो जाएँगे, और हम उन पर अधिकार कर लेंगे’—यद्यपि यहोवा वहाँ था[b]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उन दोनों जातियों और उन दोनों देशों।” हिब्रू में निश्चित उपपद है; संदर्भ में विशिष्ट जातियों और देशों की ओर संकेत करने के लिए मुख्य पाठ में “ये” रखा गया है।
    reason: lexical_alternative
  - marker: b
    text: या “और यहोवा वहाँ था” अथवा “जबकि यहोवा वहाँ था।” हिब्रू संयोजक के संबंध को एक से अधिक प्रकार से समझा जा सकता है; मुख्य पाठ एदोम के दंभपूर्ण दावे के संदर्भ में इसे रियायती अर्थ में लेता है।
    reason: alternative_reading
lexical_decisions:
- source_word: יַעַן אֲמָרְךָ
  choice: क्योंकि तूने कहा
  rationale: יַעַן न्याय के कारण का परिचय देता है। संबोधन एदोम/सेईर से एकवचन में है, इसलिए ‘तूने’ मूल व्याकरण और भविष्यद्वक्ताई संबोधन को बनाए रखता है।
- source_word: שְׁנֵי הַגּוֹיִם
  choice: ये दोनों जातियाँ
  rationale: निश्चित उपपद संदर्भ में पहचानी हुई दो जातियों की ओर संकेत करता है। ‘ये’ उस संदर्भगत विशिष्टता को स्वाभाविक हिन्दी में व्यक्त करता है, बिना उनकी पहचान मुख्य पाठ में जोड़ने के।
- source_word: שְׁתֵּי הָאֲרָצוֹת
  choice: ये दोनों देश
  rationale: אֲרָצוֹת यहाँ दो भू-प्रदेशों/देशों को सूचित करता है। ‘देश’ आधुनिक हिन्दी में राजनीतिक और भौगोलिक दोनों अर्थों को सहज रूप से वहन करता है।
- source_word: לִי תִהְיֶינָה
  choice: मेरे हो जाएँगे
  rationale: यह एदोम के भावी स्वामित्व-दावे को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וִירַשְׁנוּהָ
  choice: और हम उन पर अधिकार कर लेंगे
  rationale: ירשׁ भूमि को अपने अधिकार में लेने का सक्रिय भाव रखता है। स्त्रीलिंग एकवचन प्रत्यय संभवतः समष्टिगत भूभाग की ओर संकेत करता है; हिन्दी में पूर्ववर्ती बहुवचन ‘देश’ के अनुसार ‘उन पर’ स्पष्ट और स्वाभाविक है।
- source_word: וַיהוָה שָׁם הָיָה
  choice: यद्यपि यहोवा वहाँ था
  rationale: संदर्भ में यह खंड एदोम के दावे के विपरीत यहोवा की उपस्थिति को रखता है। ‘यद्यपि’ संभावित रियायती/विरोधात्मक बल व्यक्त करता है; सरल संयोजक पाठ को पादटिप्पणी में सुरक्षित रखा गया है।
theological_decisions:
- issue: וַיהוָה שָׁם הָיָה में ו की शक्ति
  choice: यद्यपि यहोवा वहाँ था
  alternative: और यहोवा वहाँ था; जब/जबकि यहोवा वहाँ था
  rationale: 'संदर्भ रियायती अर्थ का समर्थन करता है: एदोम ने उस भूमि पर दावा किया जहाँ यहोवा उपस्थित था। फिर भी हिब्रू संयोजक अपने आप में केवल समन्वय भी व्यक्त कर सकता है, इसलिए अस्पष्टता पादटिप्पणी में रखी गई है।'
- issue: ‘दोनों जातियों’ और ‘दोनों देशों’ की पहचान
  choice: मुख्य पाठ में अनाम रखी गई
  alternative: इस्राएल और यहूदा तथा उनके भूभाग
  rationale: निकट संदर्भ से पहचान समझी जा सकती है, पर इस पद का हिब्रू पाठ नाम नहीं बताता; इसलिए अनुवाद मूल पाठ की स्पष्टता-सीमा को नहीं लाँघता।
- issue: ईश्वरीय नाम יְהוָה का रूप
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: यह व्यक्तिगत ईश्वरीय नाम को नाम के रूप में स्पष्ट रखता है और हिन्दी बाइबिल-पाठकों के लिए परिचित है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। भविष्यद्वक्ताई प्रत्यक्ष संबोधन के कारण एकवचन ‘तू’ का प्रयोग किया गया है। पद अगले वाक्य में जारी रहता है, इसलिए अंत में दीर्घ विराम-चिह्न रखा गया है।
