lexical_decisions:
- source_word: וַיְהִי
  choice: फिर … आया
  rationale: यहाँ वाव-क्रम कथा अथवा भविष्यवाणी के अगले प्रसंग को आगे बढ़ाता है। आधुनिक हिन्दी में “फिर” इस प्रवाह को स्वाभाविक रूप से व्यक्त करता है; अलग से “ऐसा हुआ” कहना अनावश्यक रूप से शब्दशः होता।
- source_word: דְבַר
  choice: वचन
  rationale: भविष्यवाणी के स्थिर पदबंध דְבַר יְהוָה में “वचन” किसी विशिष्ट ईश्वरीय संदेश को व्यक्त करता है और हिन्दी बाइबलीय भाषा में परिचित होने के साथ स्पष्ट भी है।
- source_word: יְהוָה
  choice: याहवे
  rationale: मूल पाठ में परमेश्वर का व्यक्तिगत नाम יהוה है। “याहवे” उसे किसी उपाधि से बदलने के बजाय नाम के रूप में प्रस्तुत करता है।
- source_word: אֵלַי
  choice: मेरे पास
  rationale: इस भविष्यवाणी-सूत्र में “वचन मेरे पास आया” स्वाभाविक आधुनिक हिन्दी है और אֵלַי का आशय ठीक से व्यक्त करता है।
- source_word: לֵאמֹר
  choice: उसने कहा,
  rationale: यह रूप आगे आने वाले प्रत्यक्ष कथन का परिचय देता है। हिन्दी में अलग वाक्य “उसने कहा,” मूल सूत्र का अर्थ स्पष्ट और सहज ढंग से पहुँचाता है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: याहवे
  alternative: प्रभु; यहोवा
  rationale: पद में चतुरक्षरीय व्यक्तिगत नाम יהוה प्रत्यक्ष रूप से आया है। “याहवे” नाम को सुरक्षित रखता है, जबकि “प्रभु” उसे एक उपाधि से बदल देता है; “यहोवा” बाद की मिश्रित उच्चारण-परंपरा को दर्शाता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। “वचन मेरे पास आया” से परिचित भविष्यवाणी-सूत्र सुरक्षित रहता है, और “फिर” पूर्ववर्ती प्रसंग से कथा-संबंध दिखाता है।
