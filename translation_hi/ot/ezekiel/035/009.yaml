  text: שִֽׁמְמ֤וֹת עוֹלָם֙ אֶתֶּנְ/ךָ֔ וְ/עָרֶ֖י/ךָ לֹ֣א תישבנה וִֽ/ידַעְתֶּ֖ם כִּֽי אֲנִ֥י יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/035/009.yaml
  text: I will make you an everlasting desolation[a], and your cities will not be inhabited; then you will know that I am Yahweh.
translation:
  language: hi
  text: मैं तुझे सदा के लिए उजाड़ दूँगा[a], और तेरे नगर आबाद न होंगे; तब तुम लोग जानोगे कि मैं याहवे हूँ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘सदा के लिए उजाड़े हुए स्थान।’ इब्रानी में ‘उजाड़’ के लिए बहुवचन संज्ञा है, जो सम्भवतः न्याय की तीव्रता पर बल देती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁמְמוֹת עוֹלָם
  choice: सदा के लिए उजाड़
  rationale: शִׁמְמוֹת बहुवचन संज्ञा है, जो विनाश की तीव्र और व्यापक दशा पर बल देती है; स्वाभाविक हिन्दी में ‘उजाड़’ इस दशा को स्पष्ट रखता है। עוֹלָם यहाँ भविष्य में लगातार बने रहने वाली अवधि को दर्शाता है, इसलिए ‘सदा के लिए’ चुना गया।
- source_word: אֶתֶּנְךָ
  choice: मैं तुझे ... कर दूँगा
  rationale: क्रिया का मूल अर्थ ‘देना/ठहराना’ है, पर इस विधेय-संज्ञा वाले प्रयोग में किसी को एक दशा में कर देने का भाव है।
- source_word: וְעָרֶיךָ
  choice: और तेरे नगर
  rationale: עִיר का सामान्य अर्थ ‘नगर’ है; एकवचन प्रत्यय के कारण ‘तेरे’ रखा गया है।
- source_word: לֹא תישבנה
  choice: आबाद न होंगे
  rationale: नगरों के विषय में यह क्रिया बसाए जाने या बसे रहने का भाव देती है; ‘आबाद न होंगे’ आधुनिक हिन्दी में सहज और सटीक है।
- source_word: וִידַעְתֶּם
  choice: तब तुम लोग जानोगे
  rationale: वाव को प्रसंगानुसार परिणामसूचक ‘तब’ से व्यक्त किया गया है। बहुवचन क्रियारूप को स्पष्ट रखने के लिए ‘तुम लोग’ चुना गया।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी परमेश्वर-नाम יהוה को उपाधि से बदलने के बजाय उसके प्रचलित विद्वत्तापूर्ण उच्चारण ‘याहवे’ के रूप में लिप्यंतरित किया गया है।
theological_decisions:
- issue: परमेश्वर के नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में निजी वाचा-नाम सीधे प्रयुक्त है; ‘याहवे’ उसे उपाधि से प्रतिस्थापित किए बिना सुरक्षित रखता है।
- issue: एकवचन संबोधन से बहुवचन जानने वालों की ओर परिवर्तन
  choice: ‘तुझे/तेरे’ के बाद ‘तुम लोग जानोगे’
  alternative: पूरे वाक्य में केवल एकवचन संबोधन
  rationale: इब्रानी पाठ पहले एकवचन में संबोधित करता है, पर וִידַעְתֶּם बहुवचन है। हिन्दी में इस परिवर्तन को बनाए रखा गया है, ताकि मूल की वास्तविक व्याकरणिक खिंचाव को चुपचाप समतल न किया जाए।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘उजाड़ दूँगा’ ठोस और प्रभावशाली है, जबकि पादटिप्पणी इब्रानी बहुवचन की विशेषता सुरक्षित रखती है।
