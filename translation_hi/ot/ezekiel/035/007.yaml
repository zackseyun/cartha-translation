  choice: दो अलग शब्दों—‘उजाड़ और वीरान’—से प्रस्तुत करना
  alternative: एक संयुक्त अभिव्यक्ति, जैसे ‘पूरी तरह उजाड़’
  rationale: इब्रानी पाठ की दोहरी अभिव्यक्ति को बनाए रखने से दैवी न्याय की आलंकारिक तीव्रता सुरक्षित रहती है और कोई अतिरिक्त धर्मवैज्ञानिक निष्कर्ष नहीं जोड़ा जाता।
- issue: עֹבֵר וָשָׁב का दायरा
  choice: ‘आने-जानेवाले हर व्यक्ति’ के रूप में समस्त आवागमन का संकेत
