  text: मैं सेईर पर्वत को उजाड़ और वीरान कर दूँगा[a], और उसमें से होकर आने-जाने वालों को मिटा दूँगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘मैं सेईर पर्वत को उजाड़ और सुनसान कर दूँगा’; ‘उसमें से होकर आने-जाने वालों’ का शाब्दिक अर्थ ‘जो पार होता है और लौटता है’ भी हो सकता है। ये दोनों कृदन्त पूरे भूभाग के आवागमन का संकेत भी दे सकते हैं।
    reason: हिब्रानी के निकटार्थक विनाश-शब्दों और עֹבֵר וָשָׁב के क्रमिक अथवा व्यापक-आवागमन संबंधी संभावित अर्थ को सुरक्षित रखना।
