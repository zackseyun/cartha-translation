  rationale: युग्मित कृदन्त सम्भवतः आने-जाने की समग्रता बताने वाली युग्मोक्ति हैं; अनुवाद उस व्यापक अर्थ को व्यक्त करता है, पर किसी विशिष्ट जनसमूह या प्रकार के यात्री की व्याख्या नहीं जोड़ता।
