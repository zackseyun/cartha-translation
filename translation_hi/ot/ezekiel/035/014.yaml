  yaml_path: translation/ot/ezekiel/035/014.yaml
  text: 'Thus says the Lord GOD: As the whole earth rejoiced[b][a], I will make you desolate.'
translation:
  language: hi
  text: 'प्रभु याहवे यों कहता है: “जब[a] सारी पृथ्वी[b] आनन्द मनाएगी, तब मैं तुझे उजाड़ कर दूँगा।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जैसे सारी पृथ्वी आनन्द मनाती है, वैसे ही मैं तुझे उजाड़ कर दूँगा।” इब्रानी उपसर्ग को कालवाचक या तुलनात्मक अर्थ में समझा जा सकता है।
    reason: alternative_reading
  - marker: b
    text: इब्रानी में “सारी पृथ्वी”; यहाँ इसका अर्थ “सारा देश” भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה אָמַר
  choice: यों कहता है
  rationale: यह भविष्यद्वक्ताओं के सन्देश का प्रचलित आरम्भिक सूत्र है; हिन्दी में वर्तमान काल इसका स्थायी घोषणात्मक बल स्वाभाविक रूप से व्यक्त करता है।
- source_word: אֲדֹנָי יְהוִה
  choice: प्रभु यहोवा
  rationale: अֲדֹנָי को ‘प्रभु’ और परमेश्वर के व्यक्तिगत नाम יְהוִה को ‘यहोवा’ के रूप में रखते हुए संयुक्त उपाधि को स्पष्ट और स्वाभाविक हिन्दी में प्रस्तुत किया गया है।
- source_word: כִּשְׂמֹחַ
  choice: जब ... आनन्द मनाएगी
  rationale: כְּ के साथ क्रियार्थक संज्ञा यहाँ मुख्य भविष्यकालीन कथन की समय-परिस्थिति बता सकती है। ‘जब’ हिन्दी में यह अर्थ स्वाभाविक ढंग से व्यक्त करता है; तुलनात्मक ‘जैसे/जिस समय’ की सम्भावना पाद-टिप्पणी में रखी गई है।
- source_word: כָּל הָאָרֶץ
  choice: सारी पृथ्वी
  rationale: אֶרֶץ का व्यापक अर्थ ‘पृथ्वी’ इस न्याय-वचन में उपयुक्त है, जबकि स्थानीय ‘सारा देश’ भी सम्भव है और पाद-टिप्पणी में दिया गया है।
- source_word: שׂמח
  choice: आनन्द मनाएगी
  rationale: यह मूल क्रिया के हर्षित होने या आनन्द करने के अर्थ को गरिमापूर्ण, सामान्य आधुनिक हिन्दी में व्यक्त करता है।
- source_word: שְׁמָמָה אֶעֱשֶׂה לָּךְ
  choice: मैं तुझे उजाड़ दूँगा
  rationale: शाब्दिक रूप से ‘मैं तेरे लिए उजाड़पन करूँगा’ का आशय सम्बोधित क्षेत्र को निर्जन और विनष्ट कर देना है; चुना हुआ रूप हिन्दी में स्वाभाविक और अर्थ-संगत है।
theological_decisions:
- issue: संयुक्त ईश्वरीय उपाधि אֲדֹנָי יְהוִה का अनुवाद
  choice: प्रभु यहोवा
  alternative: प्रभु परमेश्वर
  rationale: मूल पाठ में सामान्य उपाधि के साथ विशिष्ट ईश्वरीय नाम भी है। ‘प्रभु यहोवा’ दोनों तत्वों को अलग-अलग बनाए रखता है और नाम को सामान्य पदवी में विलीन नहीं करता।
- issue: आनन्द और एदोम के उजाड़े जाने के बीच सम्बन्ध
  choice: कालवाचक—‘जब ... तब’
  alternative: तुलनात्मक/समकालिक—‘जैसे/जिस समय ... वैसे’
  rationale: כְּ कारण को स्पष्ट रूप से व्यक्त नहीं करता; इसलिए ‘क्योंकि’ से न्याय का कारण निश्चित नहीं किया गया। कालवाचक पाठ मुख्य रखा गया है और वास्तविक व्याकरणिक अस्पष्टता पाद-टिप्पणी में सुरक्षित है।
translation_notes:
  register: आधुनिक मानक हिन्दी, देवनागरी और गरिमापूर्ण भविष्यद्वाणी-शैली का प्रयोग किया गया है। एकवचन स्त्रीलिंग सम्बोधन ‘तुझे’ एदोम/सेईर देश की ओर संकेत करता है और मूल के एकवचन प्रत्यय को बनाए रखता है।
