  text: כְּ/שִׂמְחָ֨תְ/ךָ֜ לְ/נַחְלַ֧ת בֵּֽית יִשְׂרָאֵ֛ל עַ֥ל אֲשֶׁר שָׁמֵ֖מָה כֵּ֣ן אֶעֱשֶׂה לָּ֑/ךְ שְׁמָמָ֨ה תִֽהְיֶ֤ה הַר שֵׂעִיר֙ וְ/כָל אֱד֣וֹם כֻּלָּ֔/הּ וְ/יָדְע֖וּ כִּֽי אֲנִ֥י יְהוָֽה־־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/035/015.yaml
  text: 'As you rejoiced over the inheritance of the house of Israel because it was desolate[a], so I will do to you: desolate you will be, Mount Seir, and all Edom, all of it[b]. Then they will know that I am Yahweh.'
translation:
  language: hi
  text: '“जिस प्रकार तू इस्राएल के घराने की विरासत पर इसलिए आनन्दित हुआ कि वह उजाड़ पड़ी थी[a], उसी प्रकार मैं तेरे साथ वैसा ही करूँगा: हे सेईर पर्वत, तू उजाड़ बन जाएगा, और समूचा एदोम, पूरा का पूरा[b]। तब वे जानेंगे कि मैं याहवे हूँ।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इब्रानी में यह वाक्यांश एदोम के आनन्द का कारण बताता है: विरासत ‘उजाड़ पड़ी थी।’'
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में “समूचा एदोम, पूरा का पूरा” कहा गया है; यह पूरे एदोम को समेटने वाला जोरदार कथन है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּשִׂמְחָתְךָ
  choice: जिस प्रकार तू ... आनन्दित हुआ
  rationale: כְּ तुलना व्यक्त करता है और प्रत्यय एकवचन पुल्लिंग संबोधन को सूचित करता है। हिन्दी में क्रियात्मक वाक्यांश स्वाभाविक है और तुलना का बल बनाए रखता है।
- source_word: לְנַחְלַת בֵּית יִשְׂרָאֵל
  choice: इस्राएल के घराने की विरासत ... पर
  rationale: נַחֲלָה का मूल अर्थ ‘विरासत/अधिकार में मिली संपत्ति’ है। यहाँ לְ आनन्द का विषय बताता है, जिसे हिन्दी में ‘पर’ स्वाभाविक रूप से व्यक्त करता है।
- source_word: עַל אֲשֶׁר שָׁמֵמָה
  choice: के उजड़ जाने पर
  rationale: यह वाक्यांश एदोम के आनन्दित होने का कारण बताता है। स्त्रीलिंग रूप विरासत अथवा निहित भूमि की ओर लौटता है; ‘उजड़ जाने’ से उसकी उजाड़ दशा और कारण-संबंध दोनों स्पष्ट होते हैं।
- source_word: כֵּן אֶעֱשֶׂה לָּךְ
  choice: उसी प्रकार मैं भी तेरे साथ करूँगा
  rationale: כֵּן अनुरूप प्रतिफल को व्यक्त करता है। ‘तेरे साथ करूँगा’ हिन्दी में न्यायात्मक प्रत्युत्तर का संक्षिप्त बल बनाए रखता है।
- source_word: שְׁמָמָה תִהְיֶה
  choice: तू उजाड़ बन जाएगा
  rationale: שְׁמָמָה संज्ञा है, केवल विशेषण नहीं। ‘उजाड़ बन जाएगा’ उसके संज्ञात्मक और न्याय-संबंधी बल को सहज हिन्दी में सुरक्षित रखता है।
- source_word: וְכָל אֱדוֹם כֻּלָּהּ
  choice: और समूचा एदोम भी—हाँ, वह सब का सब
  rationale: כָּל के बाद पुनः כֻּלָּהּ आने से पूर्णता पर विशेष बल पड़ता है। ‘समूचा ... सब का सब’ उस दोहरे जोर को बनाए रखता है।
- source_word: וְיָדְעוּ
  choice: तब वे जानेंगे
  rationale: वाव यहाँ न्याय के परिणाम की ओर ले जाता है। ‘तब’ उस परिणामी क्रम को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: ईश्वरीय व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय हिन्दी लिप्यंतरण ‘याहवे’ के रूप में रखा गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: प्रभु
  rationale: मूल पाठ में परमेश्वर का व्यक्तिगत नाम सीधे प्रयुक्त है; इसलिए उसे उपाधि ‘प्रभु’ से बदलने के बजाय नाम के रूप में प्रस्तुत किया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध शैली रखी गई है। मूल के एकवचन संबोधन ‘तू/तेरे’ और अंत में आए बहुवचन ‘वे’ को बिना समतल किए सुरक्षित रखा गया है। स्थान-नामों के लिए प्रचलित हिन्दी रूप ‘सेईर’ और ‘एदोम’ प्रयुक्त हुए हैं।
