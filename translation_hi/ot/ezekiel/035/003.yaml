  text: וְ/אָמַ֣רְתָּ לּ֗/וֹ כֹּ֤ה אָמַר֙ אֲדֹנָ֣/י יְהוִ֔ה הִנְ/נִ֥י אֵלֶ֖י/ךָ הַר שֵׂעִ֑יר וְ/נָטִ֤יתִי יָדִ/י֙ עָלֶ֔י/ךָ וּ/נְתַתִּ֖י/ךָ שְׁמָמָ֥ה וּ/מְשַׁמָּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/035/003.yaml
  text: 'and say to it[a], ‘Thus says the Lord GOD: Behold, I am against you, Mount Seir, and I will stretch out my hand against you and make you a desolation and a waste.’'
translation:
  language: hi
  text: 'और उससे कह, ‘प्रभु याहवे यों कहते हैं: हे सेईर पर्वत, देख, मैं तेरे विरुद्ध हूँ। मैं अपना हाथ तेरे विरुद्ध बढ़ाऊँगा और तुझे उजाड़ और वीरान कर दूँगा[a]।’'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तुझे उजाड़ और भय या विस्मय का विषय बना दूँगा।” दूसरे शब्द में ऐसी तबाही का भाव हो सकता है जो भय या विस्मय उत्पन्न करे।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָמַרְתָּ לּוֹ
  choice: और उससे कह
  rationale: पुल्लिंग एकवचन प्रत्यय का संबंध मानवीकृत सेईर पर्वत से है; हिन्दी में ‘उससे’ स्वाभाविक है और प्रत्यक्ष संबोधन की मानवीकरण-शैली बनाए रखता है।
- source_word: אֲדֹנָי יְהוִה
  choice: प्रभु यहोवा
  rationale: दोनों पदों को अलग रखते हुए אֲדֹנָי को ‘प्रभु’ और चतुरक्षरीय दिव्य नाम יהוה को प्रचलित हिन्दी रूप ‘यहोवा’ से व्यक्त किया गया है।
- source_word: הִנְנִי אֵלֶיךָ
  choice: देख, मैं तेरे विरुद्ध हूँ
  rationale: הִנְנִי की गंभीर भविष्यवाणी-सूचक शक्ति को ‘देख’ से और न्याय-संदर्भ में אֵלֶיךָ की विरोधात्मक शक्ति को ‘तेरे विरुद्ध’ से व्यक्त किया गया है।
- source_word: הַר שֵׂעִיר
  choice: हे सेईर पर्वत
  rationale: भौगोलिक नाम को ‘सेईर’ और הַר को ‘पर्वत’ कहा गया है; ‘हे’ प्रत्यक्ष संबोधन को स्वाभाविक बनाता है।
- source_word: וְנָטִיתִי יָדִי עָלֶיךָ
  choice: मैं अपना हाथ तेरे विरुद्ध बढ़ाऊँगा
  rationale: दंडात्मक कार्यवाही के मूल रूपक ‘हाथ बढ़ाना’ को अक्षुण्ण रखा गया है।
- source_word: וּנְתַתִּיךָ
  choice: तुझे ... कर दूँगा
  rationale: यहाँ क्रिया किसी को एक परिणामी दशा में पहुँचाने का भाव देती है; हिन्दी में ‘कर दूँगा’ स्वाभाविक और स्पष्ट है।
- source_word: שְׁמָמָה וּמְשַׁמָּה
  choice: उजाड़ और वीरान
  rationale: समानार्थी किंतु तीव्रता बढ़ाने वाली संज्ञा-जोड़ी को दो स्वाभाविक हिन्दी विनाश-सूचक शब्दों से रखा गया है; दूसरे पद की भय/विस्मय उत्पन्न करने वाली संभावित छाया पादटिप्पणी में सुरक्षित है।
theological_decisions:
- issue: אֲדֹנָי יְהוִה में दिव्य नाम का अनुवाद
  choice: प्रभु यहोवा
  alternative: प्रभु याहवे; परमेश्वर यहोवा
  rationale: मूल में उपाधि और व्यक्तिगत दिव्य नाम दोनों उपस्थित हैं। ‘प्रभु यहोवा’ हिन्दी बाइबलीय पाठकों के लिए परिचित है और दोनों को अलग-अलग बनाए रखता है, बिना ‘प्रभु प्रभु’ जैसी पुनरावृत्ति के।
- issue: सेईर पर्वत के प्रति ईश्वरीय विरोध
  choice: मैं तेरे विरुद्ध हूँ
  alternative: मैं तुझ पर चढ़ाई करने आ रहा हूँ
  rationale: वाक्य ईश्वर की शत्रुतापूर्ण न्यायिक मुद्रा घोषित करता है, पर स्वयं क्रिया आने या चढ़ाई करने को स्पष्ट नहीं करती; इसलिए अधिक विशिष्ट अर्थ आरोपित नहीं किया गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और भविष्यवाणी-संबंधी गंभीरता के अनुरूप रखी गई है। प्रत्यक्ष संबोधन में ‘तेरे/तुझे’ का प्रयोग पर्वत के मानवीकरण और एकवचन मूल रूप को सुरक्षित रखता है।
