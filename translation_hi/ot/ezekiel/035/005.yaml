source:
  edition: WLC
  text: יַ֗עַן הֱי֤וֹת לְ/ךָ֙ אֵיבַ֣ת עוֹלָ֔ם וַ/תַּגֵּ֥ר אֶת בְּנֵֽי יִשְׂרָאֵ֖ל עַל יְדֵי חָ֑רֶב בְּ/עֵ֣ת אֵידָ֔/ם בְּ/עֵ֖ת עֲוֺ֥ן קֵֽץ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/035/005.yaml
  text: Because you had an everlasting enmity and delivered the sons of Israel over to the power of the sword at the time of their disaster[a], at the time of the punishment of the end[b],
translation:
  language: hi
  text: इसलिए कि तुमने सदा का बैर रखा और इस्राएल के पुत्रों[a] को उनकी विपत्ति के समय तलवार के हवाले कर दिया, अन्त के दण्ड के समय[b]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात् ‘इस्राएली’ या ‘इस्राएल के लोग।’ इब्रानी में शाब्दिक रूप से ‘इस्राएल के पुत्र।’
    reason: lexical_alternative
  - marker: b
    text: या ‘अन्तिम अधर्म के समय,’ अथवा ‘उस समय, जब दोष अपनी सीमा तक पहुँच गया।’ इब्रानी पद कठिन है और दोष/अधर्म अथवा उसके दण्ड की ओर संकेत कर सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: יַעַן
  choice: इसलिए कि
  rationale: यह आसपास के प्रसंग में आनेवाले न्याय का कारण बताता है और हिन्दी में कारणसूचक बल को स्वाभाविक रूप से व्यक्त करता है।
- source_word: הֱיוֹת לְךָ אֵיבַת עוֹלָם
  choice: तुमने सदा का बैर रखा
  rationale: लְךָ के साथ यह रचना एदोम/सेईर के स्थायी वैरभाव को व्यक्त करती है; ‘सदा का बैर’ עוֹלָם और אֵיבָה दोनों का स्पष्ट, गरिमापूर्ण रूप है।
- source_word: וַתַּגֵּר
  choice: वश में कर दिया
  rationale: हिफ़ील रूप यहाँ सौंप देने या अधिकार में कर देने का भाव रखता है। तलवार के साथ ‘वश में कर दिया’ हिन्दी में हिंसक शक्ति के हवाले करने का अर्थ स्पष्ट करता है।
- source_word: אֶת בְּנֵי יִשְׂרָאֵל
  choice: इस्राएल के पुत्रों
  rationale: मूल इब्रानी के पारिवारिक-सामूहिक रूप को मुख्य पाठ में बनाए रखता है; अर्थतः यह इस्राएल के लोगों को सूचित करता है।
- source_word: עַל יְדֵי חָרֶב
  choice: तलवार के वश में
  rationale: शाब्दिक ‘तलवार के हाथों में’ एक मुहावरा है। ‘तलवार के वश में’ रूपक और घातक शक्ति के हवाले किए जाने, दोनों को सहज हिन्दी में व्यक्त करता है।
- source_word: בְּעֵת אֵידָם
  choice: उनकी विपत्ति के समय
  rationale: אֵיד का अर्थ विपत्ति या महाविपत्ति है; ‘विपत्ति’ आधुनिक हिन्दी में स्पष्ट और भविष्यद्वक्ताई प्रसंग के अनुकूल है।
- source_word: בְּעֵת עֲוֺן קֵץ
  choice: उस समय, जब अन्त का दण्ड आया था
  rationale: संक्षिप्त इब्रानी पद कठिन है। עָוֹן दोष/अधर्म अथवा उसके दण्ड को और קֵץ अन्त को सूचित कर सकता है। मुख्य पाठ न्याय-संदर्भ में दण्ड का अर्थ रखता है, जबकि पादटिप्पणी वास्तविक अस्पष्टता बचाती है।
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל का अनुवाद
  choice: इस्राएल के पुत्रों
  alternative: इस्राएली; इस्राएल के लोग
  rationale: मुख्य पाठ इब्रानी के पुत्रत्व-संबंधी सामूहिक रूप को सुरक्षित रखता है, जबकि पादटिप्पणी उसका स्वाभाविक सामूहिक अर्थ स्पष्ट करती है।
- issue: בְּעֵת עֲוֺן קֵץ में עֲוֺן का अर्थ
  choice: अन्त का दण्ड
  alternative: अन्त का अधर्म; वह समय जब दोष अपनी सीमा तक पहुँच गया
  rationale: न्याय और विपत्ति के प्रसंग में ‘दण्ड’ संगत है, पर עָוֹן दोष, अधर्म या उसके फलस्वरूप दण्ड—इनमें से किसी को सूचित कर सकता है; इसलिए विकल्प पादटिप्पणी में सुरक्षित हैं।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण भविष्यद्वक्ताई शैली रखी गई है। ‘सदा का बैर,’ ‘विपत्ति,’ और ‘तलवार के वश में’ सामान्य पाठक के लिए स्पष्ट हैं। पद अगले वाक्य में जारी रहने के कारण अन्त में पूर्णविराम के बजाय डैश रखा गया है।
