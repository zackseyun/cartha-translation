base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/035/011.yaml
  text: Therefore[a], as I live, declares the Lord GOD, I will deal with you according to your anger and according to your jealousy, which you acted out because of your hatred against them; and I will make myself known through them when I judge you.
translation:
  language: hi
  text: 'इसलिए, मेरे जीवन की शपथ, प्रभु यहोवा की यह वाणी है: मैं तुम्हारे साथ तुम्हारे क्रोध और तुम्हारी ईर्ष्या के अनुसार व्यवहार करूँगा, जिन्हें तुमने उनके प्रति अपनी घृणा के कारण दिखाया था; और जब मैं तुम्हारा न्याय करूँगा, तब मैं उनके बीच अपने आपको प्रकट करूँगा।[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मैं उनके बीच जाना जाऊँगा”; अथवा, “मैं उनके द्वारा अपने आपको प्रकट करूँगा।”
    reason: וְנוֹדַעְתִּי का निफ़अल रूप “जाना जाना” अथवा आत्म-प्रकटीकरण का भाव दे सकता है, और בָם का अर्थ “उनके बीच” अथवा “उनके द्वारा” हो सकता है।
lexical_decisions:
- source_word: לָכֵן
  choice: इसलिए
  rationale: यह पिछले अभियोग से निकलने वाले परिणाम को स्वाभाविक और स्पष्ट ढंग से प्रस्तुत करता है।
- source_word: חַי אָנִי
  choice: मेरे जीवन की शपथ
  rationale: यह परमेश्वर की गंभीर प्रथम-पुरुष शपथ का स्वाभाविक हिन्दी रूप है।
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: प्रभु यहोवा की यह घोषणा है
  rationale: נְאֻם को भविष्यद्वाणी की घोषणा के रूप में और יהוה को उसके व्यक्तिगत वाचा-नाम ‘यहोवा’ के रूप में रखा गया है।
- source_word: וְעָשִׂיתִי
  choice: मैं तुम्हारे साथ ... व्यवहार करूँगा
  rationale: न्याय के प्रसंग में निहित कर्म को स्पष्ट करते हुए यह हिन्दी में केवल ‘करूँगा’ से अधिक स्वाभाविक है।
- source_word: כְּאַפְּךָ וּכְקִנְאָתְךָ
  choice: तुम्हारे क्रोध और तुम्हारी जलन के अनुसार
  rationale: כְ का अनुरूपता या माप का भाव सुरक्षित है; शत्रुतापूर्ण संदर्भ में קִנְאָה के लिए ‘जलन’ उपयुक्त है।
- source_word: אֲשֶׁר עָשִׂיתָה
  choice: जिन्हें तुमने ... प्रकट किया था
  rationale: क्रोध और जलन को कर्मों में दिखाने का भाव सहज हिन्दी में व्यक्त होता है।
- source_word: מִשִּׂנְאָתֶיךָ בָּם
  choice: उनसे अपनी घृणा के कारण
  rationale: מִן का कारण/स्रोत का भाव तथा בָּם का विरोधी संबंध दोनों स्वाभाविक रूप में व्यक्त होते हैं।
- source_word: וְנוֹדַעְתִּי בָם
  choice: मैं उनके बीच अपने आपको प्रकट करूँगा
  rationale: ידע के निफ़अल में दिव्य आत्म-प्रकटीकरण का भाव है; בָם को स्थानीय/सामुदायिक अर्थ ‘उनके बीच’ दिया गया है, जबकि अन्य संभावनाएँ पादटिप्पणी में रखी गई हैं।
- source_word: כַּאֲשֶׁר אֶשְׁפְּטֶךָ
  choice: जब मैं तुम्हारा न्याय करूँगा
  rationale: 'כַּאֲשֶׁר को यहाँ समयसूचक मानना प्रसंगानुकूल है: आत्म-प्रकटीकरण एदोम के न्याय के समय होगा।'
theological_decisions:
- issue: संयुक्त उपाधि אֲדֹנָי יְהוִה में परमेश्वर के नाम का अनुवाद
  choice: प्रभु यहोवा
  alternative: प्रभु याहवे
  rationale: मूल पाठ में वाचा-नाम יהוה स्पष्ट रूप से है। हिन्दी पाठकों के लिए प्रचलित व्यक्तिगत नाम ‘यहोवा’ उसे सामान्य उपाधि में बदलने के बजाय सुरक्षित रखता है।
- issue: וְנוֹדַעְתִּי בָם का अर्थ
  choice: मैं उनके बीच अपने आपको प्रकट करूँगा
  alternative: मैं उनके बीच जाना जाऊँगा; मैं उनके द्वारा अपने आपको प्रकट करूँगा
  rationale: निफ़अल आत्म-प्रकटीकरण अथवा ‘जाना जाना’ दोनों की छाया दे सकता है, और בָם ‘बीच’ या ‘द्वारा’ हो सकता है। मुख्य पाठ स्वाभाविक अर्थ देता है और वास्तविक अस्पष्टता पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सार्वजनिक पाठ के योग्य स्तर रखा गया है। ‘मेरे जीवन की शपथ’ गंभीर दैवी शपथ को सहज बनाता है; वाक्य की न्यायिक और प्रतिशोधात्मक धार को नरम नहीं किया गया।
