  yaml_path: translation/ot/ezekiel/035/013.yaml
  text: And with your mouth you magnified yourselves against me[a], and multiplied your words against me[b]; I myself have heard.
translation:
  language: hi
  text: तुमने अपने मुँह से मेरे विरुद्ध अपने आपको बड़ा जताया[a] और मेरे विरुद्ध अपनी बातें बढ़ा दीं[b]; मैंने स्वयं सुना है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मेरे विरुद्ध डींगें मारीं”; इब्रानी में शाब्दिक भाव है, अपने आपको मेरे विरुद्ध बड़ा करना।
    reason: lexical_alternative
  - marker: b
    text: या, “मेरे विरुद्ध अपनी बातों का ढेर लगा दिया।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּגְדִּילוּ
  choice: अपने आपको बड़ा ठहराया
  rationale: हिफ़ील रूप की ‘बड़ा करने/ठहराने’ वाली मूल छवि को बनाए रखता है और प्रसंग में आत्म-बड़ाई का भाव देता है; ‘डींग मारी’ अधिक मुहावरेदार विकल्प है।
- source_word: עָלַי
  choice: मेरे विरुद्ध
  rationale: विरोधपूर्ण वाणी के इस प्रसंग में עַל का अर्थ केवल ‘मेरे विषय में’ नहीं, बल्कि परमेश्वर के विरुद्ध बोलना है।
- source_word: בְּפִיכֶם
  choice: अपने मुँह से
  rationale: साधनवाचक בְּ और ‘मुँह’ की ठोस इब्रानी अभिव्यक्ति को स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: וְהַעְתַּרְתֶּם
  choice: भरमार कर दी
  rationale: यहाँ हिफ़ील क्रिया बातों को बहुतायत में बढ़ाने या ढेर लगाने का भाव व्यक्त करती है; हिन्दी में ‘भरमार कर दी’ उसी तीव्रता को सहज रूप से दर्शाता है।
- source_word: דִּבְרֵיכֶם
  choice: अपनी बातों
  rationale: דָּבָר के सामान्य अर्थ को बोलचाल की स्वाभाविक हिन्दी में रखता है और शत्रुतापूर्ण कथनों की ओर संकेत करता है।
- source_word: אֲנִי
  choice: मैंने स्वयं
  rationale: क्रिया के साथ अलग से आए सर्वनाम אֲנִי के बलाघात को ‘स्वयं’ से व्यक्त किया गया है।
- source_word: שָׁמָעְתִּי
  choice: सुना है
  rationale: 'पूर्ण क्रिया को वर्तमान परिणाम वाले पूर्ण पक्ष में प्रस्तुत करता है: परमेश्वर ने उनकी बातें सुन ली हैं और उनसे अवगत हैं।'
theological_decisions:
- issue: परमेश्वर के विरुद्ध घमण्डपूर्ण वाणी का चित्रण
  choice: पद को परमेश्वर के विरुद्ध आत्म-बड़ाई और बहुत-सी बातें कहने के सीधे ईश्वरीय आरोप के रूप में प्रस्तुत किया गया है।
  alternative: इसे अधिक सामान्य रूप में ‘मेरे विषय में घमण्ड से बातें कीं’ कहा जा सकता है।
  rationale: दो बार आया עָלַי, आत्म-बड़ाई की क्रिया और बातों को बढ़ाने की क्रिया मिलकर विरोधपूर्ण वाणी दिखाते हैं; अनुवाद इस तनाव को नरम नहीं करता और अतिरिक्त धर्मसैद्धान्तिक अर्थ भी नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सामान्य पाठकों के लिए स्पष्ट रूप। ‘अपने आपको बड़ा ठहराया’ मूल क्रिया-चित्र को बचाता है, जबकि पादटिप्पणी अधिक मुहावरेदार विकल्प देती है। एकवचन ‘मुँह’ इब्रानी सामूहिक अभिव्यक्ति के अनुरूप रखा गया है।
