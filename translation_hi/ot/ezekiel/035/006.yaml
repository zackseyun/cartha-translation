source:
  edition: WLC
  text: לָ/כֵ֣ן חַי אָ֗נִי נְאֻם֙ אֲדֹנָ֣/י יְהוִ֔ה כִּֽי לְ/דָ֥ם אֶעֶשְׂ/ךָ֖ וְ/דָ֣ם יִרְדֲּפֶ֑/ךָ אִם לֹ֥א דָ֛ם שָׂנֵ֖אתָ וְ/דָ֥ם יִרְדֲּפֶֽ/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/035/006.yaml
  text: Therefore[a], as I live, declares the Lord GOD, I will make you blood, and blood will pursue you. Surely you have not hated blood[b], so blood will pursue you.
translation:
  language: hi
  text: 'इसलिए, प्रभु यहोवा की यह घोषणा है: “मेरे जीवन की शपथ, मैं तुझे रक्त बना दूँगा[a], और रक्त तेरा पीछा करेगा। निश्चय ही तूने रक्त से घृणा नहीं की[b]; इसलिए रक्त तेरा पीछा करेगा।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अधिक शाब्दिक रूप में, “मैं तुझे रक्त बना दूँगा।” हिब्रू में “रक्त” की पुनरावृत्ति संभवतः रक्त, रक्तपात और रक्तदोष—इन सभी की ओर संकेत करती है।
    reason: lexical_alternative
  - marker: b
    text: यहाँ “रक्त” का आशय “रक्तपात” या हिंसा से उत्पन्न रक्तदोष भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: इसलिए
  rationale: यह पिछले आरोप के परिणामस्वरूप आने वाले दैवी न्याय का स्वाभाविक और स्पष्ट निष्कर्षसूचक शब्द है।
- source_word: חַי אָנִי
  choice: मेरे जीवन की शपथ
  rationale: हिब्रू का यह भविष्यद्वक्तीय शपथ-सूत्र है। हिंदी में यह रूप उसकी गंभीर आत्म-शपथ की शक्ति को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: प्रभु यहोवा की यह घोषणा है
  rationale: נְאֻם को भविष्यद्वक्तीय घोषणा के रूप में और אֲדֹנָי יְהוִה को पदवी तथा व्यक्तिवाचक दैवी नाम के संयोजन के रूप में प्रस्तुत किया गया है।
- source_word: לְדָם אֶעֶשְׂךָ
  choice: मैं तुझे रक्त ही बना दूँगा
  rationale: मूल की जानबूझकर तीखी और संक्षिप्त अभिव्यक्ति को बनाए रखता है तथा पूरे पद में דָם की पुनरावृत्ति और रक्तपात/रक्तदोष की शब्द-क्रीड़ा को सुरक्षित रखता है। ‘ही’ लक्ष्य या परिणाम पर बल देता है, पर अर्थ को रक्तपात तक सीमित नहीं करता।
- source_word: דָם
  choice: रक्त
  rationale: एक ही हिब्रू शब्द की बार-बार पुनरावृत्ति सुरक्षित रखी गई है। संदर्भ में इसका अर्थ वास्तविक रक्त के साथ रक्तपात और रक्तदोष तक भी फैल सकता है।
- source_word: יִרְדֲּפֶךָ
  choice: तेरा पीछा करेगा
  rationale: רדף का सामान्य अर्थ पीछा करना है; यह न्याय के सजीव चित्र और दोहराए गए कथन दोनों को स्पष्ट रखता है।
- source_word: אִם לֹא
  choice: निश्चय ही ... नहीं
  rationale: यहाँ इसे साधारण शर्त के बजाय बलपूर्ण प्रतिज्ञात्मक कथन के रूप में लिया गया है। यह हिब्रू की संरचना को कारणवाचक अनुवाद में पूरी तरह बदलने से बचाता है।
- source_word: דָם שָׂנֵאתָ
  choice: तूने रक्त से घृणा नहीं की
  rationale: शाब्दिक ‘रक्त’ को बनाए रखने से पद की पुनरावृत्ति सुरक्षित रहती है; पादटिप्पणी बताती है कि यहाँ रक्तपात या हिंसक रक्तदोष अभिप्रेत हो सकता है।
theological_decisions:
- issue: אֲדֹנָי יְהוִה में दैवी नाम का अनुवाद
  choice: प्रभु यहोवा
  alternative: प्रभु परमेश्वर
  rationale: יְהוִה मूल पाठ में व्यक्तिवाचक दैवी नाम है। ‘यहोवा’ हिंदी पाठकों के लिए स्थापित रूप है और इसे सामान्य पदवी ‘परमेश्वर’ में विलीन नहीं करता।
- issue: दैवी न्याय में ‘रक्त’ का आशय
  choice: मुख्य पाठ में ‘रक्त’ की अस्पष्टता और पुनरावृत्ति बनाए रखना
  alternative: हर स्थान पर ‘रक्तपात’ या ‘रक्तदोष’ करना
  rationale: मूल में דָם की चार बार पुनरावृत्ति वास्तविक रक्त, रक्तपात और रक्तदोष के बीच अर्थगत तनाव पैदा करती है। किसी एक व्याख्या को मुख्य पाठ में अनिवार्य नहीं किया गया।
- issue: אִם לֹא का वाक्यगत बल
  choice: निश्चय ही तूने ... नहीं
  alternative: क्योंकि तूने ... नहीं
  rationale: बलपूर्ण/प्रतिज्ञात्मक अर्थ को स्वीकार करते हुए कारणात्मक संबंध को अगले ‘इसलिए’ से स्पष्ट किया गया है; इससे मूल की संभावित व्याकरणिक कठोरता बनी रहती है।
translation_notes:
  register: आधुनिक मानक हिंदी का गंभीर, भविष्यद्वक्तीय और सार्वजनिक-पाठ योग्य स्तर रखा गया है। दैवी संबोधन और एदोम के लिए एकवचन ‘तू/तुझे/तेरा’ मूल के एकवचन रूप तथा न्याय-वाणी की सीधाई को सुरक्षित रखते हैं। उद्धरण-चिह्न से दैवी वाणी की सीमा स्पष्ट की गई है।
