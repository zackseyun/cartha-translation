  text: וּ/מִלֵּאתִ֥י אֶת הָרָ֖י/ו חֲלָלָ֑י/ו גִּבְעוֹתֶ֤י/ךָ וְ/גֵאוֹתֶ֨י/ךָ֙ וְ/כָל אֲפִיקֶ֔י/ךָ חַלְלֵי חֶ֖רֶב יִפְּל֥וּ בָ/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/035/008.yaml
  text: And I will fill its mountains with its slain; on your hills[a], in your valleys, and in all your ravines, those slain by the sword will fall.
translation:
  language: hi
  text: और मैं उसके पहाड़ों को उसके मारे हुओं से भर दूँगा; तुम्हारी पहाड़ियों, तुम्हारी घाटियों और तुम्हारे सभी नालों[a] में तलवार से मारे हुए लोग गिरेंगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात, अभी उल्लिखित पहाड़ियों, घाटियों और नालों में।
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִלֵּאתִי
  choice: और मैं...भर दूँगा
  rationale: आरंभिक וּ को ‘और’ से व्यक्त किया गया है। भविष्यसूचक घोषणा के संदर्भ में पूर्ण क्रिया को हिन्दी में भविष्यकाल से स्वाभाविक रूप से प्रस्तुत किया गया है।
- source_word: הָרָיו
  choice: उसके पहाड़ों
  rationale: पुल्लिंग एकवचन प्रत्यय का संकेत सेईर पर्वत अथवा उस भूभाग की ओर है; इसलिए तीसरे पुरुष को बनाए रखा गया है, भले ही आगे उसी को सीधे ‘तुम्हारी’ कहकर संबोधित किया गया है।
- source_word: חֲלָלָיו
  choice: उसी के मारे हुओं
  rationale: חָלָל युद्ध या हिंसा में मारे गए लोगों को दर्शाता है। ‘मृतकों’ की अपेक्षा ‘मारे हुओं’ में हिंसक मृत्यु का भाव सुरक्षित रहता है; ‘उसी के’ से मूल के संबंधसूचक प्रत्यय पर बल स्पष्ट होता है।
- source_word: גִּבְעוֹתֶיךָ
  choice: तुम्हारी पहाड़ियों
  rationale: सामान्य भौगोलिक अर्थ ‘पहाड़ियाँ’ है; ‘ऊँचे पूजा-स्थल’ कहना यहाँ अनावश्यक धार्मिक अर्थ जोड़ देता।
- source_word: גֵאוֹתֶיךָ
  choice: तुम्हारी घाटियों
  rationale: पहाड़ियों और नालों के साथ आई भौगोलिक सूची में ‘घाटियाँ’ प्रसंगानुकूल है। शब्द का अर्थ यहाँ पूरी तरह निश्चित नहीं है, इसलिए वैकल्पिक अर्थ पाद-टिप्पणी में दिया गया है।
- source_word: אֲפִיקֶיךָ
  choice: तुम्हारे सभी नालों
  rationale: यह शब्द जलधारा के पाट, सँकरे प्राकृतिक नाले या खड्ड को सूचित कर सकता है। आधुनिक हिन्दी में ‘नाले’ भू-आकृति को सहज ढंग से व्यक्त करता है और अनिवार्य रूप से बहते पानी का संकेत नहीं देता।
- source_word: חַלְלֵי חֶרֶב
  choice: तलवार से मारे हुए लोग
  rationale: इससे मूल में व्यक्त हिंसक मृत्यु और उसके साधन, दोनों स्पष्ट रहते हैं।
- source_word: יִפְּלוּ בָהֶם
  choice: में...गिर पड़ेंगे
  rationale: בָהֶם का स्थानवाचक अर्थ पहले उल्लिखित पहाड़ियों, घाटियों और नालों के साथ हिन्दी के ‘में’ द्वारा स्पष्ट रूप से व्यक्त किया गया है। ‘गिर पड़ेंगे’ युद्ध में मारे जाकर गिरने के प्रसंग को स्वाभाविक हिन्दी में रखता है।
theological_decisions:
- issue: तीसरे पुरुष से दूसरे पुरुष में संबोधन का परिवर्तन
  choice: ‘उसके पहाड़ों’ के बाद ‘तुम्हारी...’
  alternative: पूरे पद में केवल ‘तुम्हारे’ का प्रयोग
  rationale: मूल पाठ पहले सेईर/उस भूभाग का उल्लेख तीसरे पुरुष में करता है और फिर सीधे उसी को दूसरे पुरुष में संबोधित करता है। इस परिवर्तन को समतल नहीं किया गया।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। स्थलाकृतिक सूची में संबंधसूचक शब्दों को दोहराकर हिन्दी में स्पष्टता दी गई है, और मूल पाठ में तीसरे पुरुष से सीधे संबोधन की ओर होने वाला परिवर्तन सुरक्षित रखा गया है।
