id: EZK.35.12
reference: Ezekiel 35:12
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְֽ/יָדַעְתָּ֮ כִּֽי אֲנִ֣י יְהוָה֒ שָׁמַ֣עְתִּי אֶת כָּל נָאָֽצוֹתֶ֗י/ךָ אֲשֶׁ֥ר אָמַ֛רְתָּ עַל הָרֵ֥י יִשְׂרָאֵ֖ל לֵ/אמֹ֣ר שממה לָ֥/נוּ נִתְּנ֖וּ לְ/אָכְלָֽה־׀־־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/035/012.yaml
  text: Then you will know that I am Yahweh. I have heard all your revilings that you spoke against the mountains of Israel[a], saying, ‘They are desolate; they have been given to us for food.’
translation:
  language: hi
  text: 'तब तू जान लेगा कि मैं याहवे हूँ। मैंने तेरी तिरस्कार भरी सारी बातें[a] सुनी हैं, जो तूने इस्राएल के पहाड़ों के विरुद्ध कहीं: ‘वे उजाड़ पड़े हैं; वे हमें खाने के लिए दे दिए गए हैं।’'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तेरी सारी निन्दाएँ” अथवा “तेरे सारे अपमानजनक वचन।”
    reason: नָאָצוֹתֶיךָ घोर तिरस्कार से भरी शत्रुतापूर्ण वाणी को दर्शाता है; हिन्दी में इसके कई निकट अर्थ संभव हैं।
lexical_decisions:
- source_word: וְיָדַעְתָּ
  choice: तब तू जान लेगा
  rationale: वाव सहित क़ाल पूर्ण रूप भविष्यसूचक प्रसंग में परिणामस्वरूप होने वाली पहचान व्यक्त करता है; ‘तब’ इस संबंध को स्वाभाविक हिन्दी में स्पष्ट करता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: मूल पाठ में आए परमेश्वर के व्यक्तिगत नाम का लिप्यंतरण किया गया है, उसे किसी उपाधि से नहीं बदला गया।
- source_word: שָׁמַעְתִּי
  choice: मैंने ... सुनी हैं
  rationale: इब्रानी पूर्ण क्रिया ऐसी सुनवाई बताती है जिसका वर्तमान और आगामी न्याय से संबंध है; हिन्दी का पूर्ण वर्तमान इसे स्वाभाविक रूप से व्यक्त करता है।
- source_word: נָאָצוֹתֶיךָ
  choice: तेरी तिरस्कार भरी सारी बातें
  rationale: נאץ से बना यह शब्द घोर तिरस्कार और निन्दा से भरे कथनों को दर्शाता है। यह अभिव्यक्ति केवल तकनीकी अर्थ में परमेश्वर की निन्दा ठहराए बिना उस शत्रुतापूर्ण अवमानना को सुरक्षित रखती है।
- source_word: עַל הָרֵי יִשְׂרָאֵל
  choice: इस्राएल के पहाड़ों के विरुद्ध
  rationale: शत्रुतापूर्ण वाणी के साथ עַל का अर्थ मात्र विषय-सूचक नहीं, बल्कि विरोध-सूचक है।
- source_word: שׁממה
  choice: वे उजाड़ पड़े हैं
  rationale: रूप औपचारिक रूप से स्त्रीलिंग एकवचन है, पर संदर्भ में इस्राएल के पहाड़ों अथवा देश को सामूहिक रूप से इंगित करता है; अगली बहुवचन क्रिया भी बहुवचन संदर्भ की पुष्टि करती है।
- source_word: נִתְּנוּ לָנוּ לְאָכְלָה
  choice: वे हमें खाने के लिए दे दिए गए हैं
  rationale: נתן के निफ़अल और לְאָכְלָה को निकटता से रखते हुए अधिकार में सौंपे जाने और भक्षण की विजयोन्मत्त उपमा दोनों को सुरक्षित रखा गया है।
theological_decisions:
- issue: יהוה परमेश्वर के नाम का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: यहाँ मूल पाठ में चतुरक्षरीय व्यक्तिगत नाम सीधे आया है। ‘याहवे’ उसका प्रचलित विद्वत्तापूर्ण लिप्यंतरण है और नाम को उपाधि से प्रतिस्थापित नहीं करता।
- issue: נָאָצוֹתֶיךָ की धार्मिक तीव्रता
  choice: तिरस्कार भरी सारी बातें
  alternative: तेरी सारी निन्दाएँ; तेरे सारे अपमानजनक वचन
  rationale: वचन इस्राएल के पहाड़ों के विरुद्ध कहे गए हैं, यद्यपि प्रसंग में वे याहवे का भी अपमान करते हैं। इसलिए मुख्य पाठ घोर अवमानना को व्यक्त करता है, पर ‘परमेश्वर की निन्दा’ का अधिक विशिष्ट अर्थ आरोपित नहीं करता।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सहज हिन्दी अपनाई गई है। एकवचन पुरुष संबोधन के लिए ‘तू’ रखा गया है, क्योंकि भविष्यवाणी सेईर पर्वत/एदोम को सीधे संबोधित करती है; यह यहाँ अपमानसूचक नहीं, बाइबिलीय प्रत्यक्ष संबोधन है। उद्धरण और विजय-भक्षण की रूपकात्मक भाषा मूल के अनुरूप रखी गई है।
