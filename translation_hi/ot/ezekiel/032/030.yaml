reference: Ezekiel 32:30
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: שָׁ֣מָּ/ה נְסִיכֵ֥י צָפ֛וֹן כֻּלָּ֖/ם וְ/כָל צִֽדֹנִ֑י אֲשֶׁר יָרְד֣וּ אֶת חֲלָלִ֗ים בְּ/חִתִּיתָ֤/ם מִ/גְבֽוּרָתָ/ם֙ בּוֹשִׁ֔ים וַ/יִּשְׁכְּב֤וּ עֲרֵלִים֙ אֶת חַלְלֵי חֶ֔רֶב וַ/יִּשְׂא֥וּ כְלִמָּתָ֖/ם אֶת י֥וֹרְדֵי בֽוֹר־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/032/030.yaml
  text: There are all the princes of the north[a], all of them, and all the Sidonians, who went down with the slain in the terror they caused by their might, ashamed. They lie uncircumcised with those slain by the sword[c][b], and they bear their disgrace with those who go down to the pit.
translation:
  language: hi
  text: वहाँ उत्तर के सभी प्रधान—सभी के सभी—और सभी सीदोनी लोग हैं। वे मारे गए लोगों के साथ उतर गए हैं, अपने पराक्रम से फैलाए आतंक के कारण लज्जित हैं। वे तलवार से मारे गए लोगों के साथ खतनारहित पड़े हैं, और गड्ढे में उतरनेवालों के साथ अपना अपमान सहते हैं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שָׁמָּה
  choice: वहाँ ... हैं
  rationale: अधोलोक में उपस्थित मृत समुदाय की ओर संकेत करता है; हिंदी में अस्तित्वसूचक वाक्य स्वाभाविक है।
- source_word: נְסִיכֵי צָפוֹן
  choice: उत्तर के सभी प्रधान
  rationale: נְסִיךְ शासकीय पद या अगुवाई बताता है। ‘प्रधान’ गरिमापूर्ण है और राजवंशीय ‘राजकुमार’ का अनावश्यक अर्थ नहीं जोड़ता।
- source_word: וְכָל צִדֹנִי
  choice: और सभी सीदोनी
  rationale: एकवचन जातिवाचक रूप सामूहिक अर्थ में है; ‘सीदोनी’ उस जनसमूह का संदर्भ बनाए रखता है।
- source_word: אֶת חֲלָלִים
  choice: मारे गए लोगों के साथ
  rationale: इस प्रसंग में אֶת संगति का भाव देता है और अध्याय में मृतकों के साथ अधोलोक में उतरने के आवर्ती चित्र के अनुकूल है।
- source_word: בְּחִתִּיתָם מִגְבוּרָתָם
  choice: अपने पराक्रम से जो आतंक उन्होंने फैलाया था, उसके बीच
  rationale: शाब्दिक संरचना ‘उनका आतंक उनके पराक्रम से’ है। हिंदी रूप आतंक के स्रोत और उसके दूसरों पर पड़ने वाले प्रभाव को स्पष्ट करता है, पर בְּ की कुछ कठिनता को टिप्पणी में सुरक्षित रखता है।
- source_word: בּוֹשִׁים
  choice: वे लज्जित हुए
  rationale: उनकी अपमानित दशा व्यक्त करता है और आगे आने वाले כְלִמָּתָם ‘अपमान’ से अर्थगत संबंध बनाए रखता है।
- source_word: וַיִּשְׁכְּבוּ
  choice: पड़े हैं
  rationale: रूप कथात्मक भूतकालीन है, किंतु दर्शन में मृतकों की वर्तमान व्यवस्थित दशा का वर्णन करता है; हिंदी का परिणामसूचक वर्तमान स्वाभाविक है।
- source_word: עֲרֵלִים
  choice: खतनारहित
  rationale: यहेजकेल की न्याय-वाणी में ठोस वाचा-संबंधी लज्जा का पद है; व्याख्यात्मक अमूर्तीकरण के बजाय मूल बिंब रखा गया है।
- source_word: אֶת חַלְלֵי חֶרֶב
  choice: तलवार से मारे गए लोगों के साथ
  rationale: संगति का अर्थ और मृत्यु का साधन दोनों स्पष्ट रखे गए हैं।
- source_word: וַיִּשְׂאוּ כְלִמָּתָם
  choice: अपना अपमान सहते हैं
  rationale: נשא का ‘उठाना/ढोना’ यहाँ अपमान को भोगने या सहने का अर्थ देता है; हिंदी में ‘सहते हैं’ प्राकृतिक और गंभीर है।
- source_word: יוֹרְדֵי בוֹר
  choice: गड्ढे में उतरनेवाले
  rationale: अधोलोक या कब्र के क्षेत्र का ठोस ‘गड्ढा’ बिंब सुरक्षित रखा गया है।
theological_decisions:
- issue: עֲרֵלִים का न्याय-संदर्भ में अनुवाद
  choice: खतनारहित
  alternative: वाचा से बाहर / अशुद्ध
  rationale: मूल का शारीरिक और वाचा-संबंधी पद सुरक्षित रखा गया है; व्याख्यात्मक धार्मिक निष्कर्ष मुख्य पाठ में नहीं जोड़ा गया।
- issue: וַיִּשְׁכְּבוּ का काल और पक्ष
  choice: पड़े हैं
  alternative: लेट गए / पड़े थे
  rationale: दर्शन मृतकों की बनी हुई दशा दिखाता है। वर्तमान परिणामसूचक हिंदी इस वर्णनात्मक प्रभाव को व्यक्त करती है, यद्यपि हिब्रू रूप कथात्मक क्रम में है।
- issue: בְּחִתִּיתָם का संबंध
  choice: फैलाए गए आतंक के बीच
  alternative: अपने आतंक के कारण / अपने आतंक सहित
  rationale: वाक्यांश व्याकरणतः संक्षिप्त और अर्थतः कठिन है। चुना गया रूप आतंक को उनके पराक्रम से उत्पन्न प्रभाव मानता है, लेकिन उसे ‘इसके बावजूद’ कहकर विरोधार्थक नहीं बनाता।
translation_notes:
  register: आधुनिक मानक हिंदी, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध। मूल के अधोलोक-संबंधी ठोस बिंब—मारे गए लोग, तलवार, खतनारहित दशा और गड्ढा—बनाए रखे गए हैं। कठिन आतंक-वाक्यांश को सहज किया गया है, पर विरोधार्थक ‘इसके बावजूद’ नहीं जोड़ा गया।
