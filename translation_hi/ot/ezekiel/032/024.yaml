source:
  edition: WLC
  text: שָׁ֤ם עֵילָם֙ וְ/כָל הֲמוֹנָ֔/הּ סְבִיב֖וֹת קְבֻרָתָ֑/הּ כֻּלָּ֣/ם חֲלָלִים֩ הַ/נֹּפְלִ֨ים בַּ/חֶ֜רֶב אֲֽשֶׁר יָרְד֥וּ עֲרֵלִ֣ים אֶל אֶ֣רֶץ תַּחְתִּיּ֗וֹת אֲשֶׁ֨ר נָתְנ֤וּ חִתִּיתָ/ם֙ בְּ/אֶ֣רֶץ חַיִּ֔ים וַ/יִּשְׂא֥וּ כְלִמָּתָ֖/ם אֶת י֥וֹרְדֵי בֽוֹר־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/032/024.yaml
  text: There is Elam and all her multitude[a], all around her grave, all of them slain, fallen by the sword, who went down uncircumcised to the land below, who spread their terror in the land of the living; and they bore their shame with those who go down to the pit.
translation:
  language: hi
  text: वहाँ एलाम और उसकी सारी भीड़ है; वे उसकी कब्र के चारों ओर हैं। वे सब तलवार से मारे गए हैं, खतनारहित होकर धरती के निचले भागों में उतर गए हैं[a]। उन्होंने जीवितों की धरती पर अपना आतंक फैलाया था, और वे गड्ढे में उतरनेवालों के साथ अपना अपमान सहते हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “नीचे की धरती में” अथवा “अधोलोक में।” इब्रानी में शाब्दिक रूप से “निचले भागों की धरती” कहा गया है, जो मृतकों के लोक की छवि है।
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁם עֵילָם
  choice: वहाँ एलाम ... है
  rationale: यह अधोलोक के दृश्य में एलाम का परिचय कराता है और שָׁם के स्थान-सूचक बल को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: וְכָל הֲמוֹנָהּ
  choice: और उसकी सारी भीड़
  rationale: הָמוֹן एलाम से जुड़े विशाल जनसमूह या सैन्य दल को सूचित करता है; ‘भीड़’ अर्थ को व्यापक रखते हुए सामान्य हिन्दी में सहज है।
- source_word: סְבִיבוֹת קְבֻרָתָהּ
  choice: जो उसकी कब्र के चारों ओर है
  rationale: एलाम की कब्र के चारों ओर उसके लोगों की स्थानिक व्यवस्था को स्पष्ट और निकट रूप में व्यक्त करता है।
- source_word: כֻּלָּם חֲלָלִים הַנֹּפְלִים בַּחֶרֶב
  choice: वे सभी तलवार से मारे गए हैं
  rationale: חֲלָלִים और הַנֹּפְלִים בַּחֶרֶב हिंसक, विशेषकर युद्ध में हुई मृत्यु बताते हैं; हिन्दी में संयुक्त अभिव्यक्ति अनावश्यक पुनरुक्ति से बचते हुए यही भाव देती है।
- source_word: יָרְדוּ עֲרֵלִים
  choice: वे खतनारहित होकर ... उतर गए
  rationale: עֲרֵלִים को शाब्दिक रखा गया है, क्योंकि यह यहेजकेल में राष्ट्रों के लिए लज्जा और वाचा से बाहर होने का अर्थभार रखता है।
- source_word: אֶל אֶרֶץ תַּחְתִּיּוֹת
  choice: धरती के निचले भागों में
  rationale: यह मृतकों के नीचे स्थित लोक की स्थानिक छवि को बनाए रखता है, बिना उसे किसी विस्तृत परलोक-सिद्धांत में बदलने के।
- source_word: נָתְנוּ חִתִּיתָם
  choice: अपना आतंक फैलाया था
  rationale: शाब्दिक ‘अपना आतंक रखा/दिया’ का स्वाभाविक हिन्दी अर्थ है कि उन्होंने लोगों में भय व्याप्त किया।
- source_word: בְּאֶרֶץ חַיִּים
  choice: जीवितों की धरती पर
  rationale: जीवित मनुष्यों के संसार के लिए प्रयुक्त इब्रानी छवि को पारदर्शी ढंग से सुरक्षित रखता है।
- source_word: וַיִּשְׂאוּ כְלִמָּתָם
  choice: पर अब वे ... अपना अपमान सहते हैं
  rationale: נשא के ‘उठाने/वहन करने’ और כְלִמָּה के अपमानजनक परिणाम को स्वाभाविक हिन्दी में व्यक्त करता है; ‘अब’ पूर्व आतंक और वर्तमान दुर्दशा के निहित विरोध को स्पष्ट करता है।
- source_word: אֶת יֹרְדֵי בוֹר
  choice: गड्ढे में उतरनेवालों के साथ
  rationale: אֶת को यहाँ सहचर्य के अर्थ में समझा गया है; ‘गड्ढा’ कब्र अथवा मृतलोक की मूल रूपक-छवि बनाए रखता है।
theological_decisions:
- issue: न्याय के प्रसंग में עֲרֵלִים का अनुवाद
  choice: खतनारहित
  alternative: अपवित्र
  rationale: शाब्दिक अभिव्यक्ति भविष्यवाणी की वाचा-संबंधी और लज्जासूचक तीक्ष्णता को बनाए रखती है; रूपकात्मक विकल्प पाठ को अनावश्यक रूप से नरम कर देगा।
- issue: אֶרֶץ תַּחְתִּיּוֹת द्वारा सूचित मृतलोक
  choice: धरती के निचले भाग
  alternative: अधोलोक
  rationale: चुना हुआ रूप मूल की नीचे स्थित प्रदेश वाली स्थानिक छवि को सुरक्षित रखता है और पाठ से अधिक विकसित परलोक-विज्ञान आरोपित नहीं करता।
- issue: एलाम के लिए स्त्रीलिंग सर्वनाम
  choice: उसकी
  alternative: उसके
  rationale: इब्रानी पाठ एलाम को स्त्रीलिंग रूप में प्रस्तुत करता है; हिन्दी में ‘उसकी’ इस राष्ट्र-व्यक्तिकरण और ‘भीड़/कब्र’ के संबंध को बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य रखी गई है। युद्ध, लज्जा और मृतलोक की मूल छवियाँ सुरक्षित हैं। छोटे वाक्य हिन्दी में दृश्य की संरचना स्पष्ट करते हैं, जबकि मूल अर्थगत संबंध बनाए रखते हैं।
