reference: Ezekiel 32:12
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: בְּ/חַרְב֤וֹת גִּבּוֹרִים֙ אַפִּ֣יל הֲמוֹנֶ֔/ךָ עָרִיצֵ֥י גוֹיִ֖ם כֻּלָּ֑/ם וְ/שָֽׁדְדוּ֙ אֶת גְּא֣וֹן מִצְרַ֔יִם וְ/נִשְׁמַ֖ד כָּל הֲמוֹנָֽ/הּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/032/012.yaml
  text: By the swords of mighty men I will make your multitude fall— all of them the ruthless ones of the nations[a]. They will plunder the pride of Egypt[b], and all her multitude will be destroyed.
translation:
  language: hi
  text: पराक्रमी योद्धाओं—जो सब राष्ट्रों के निर्दयी लोग हैं[a]—की तलवारों से मैं तेरे जनसमूह को गिरा दूँगा। वे मिस्र के गौरव को लूट लेंगे,[b] और उसका सारा जनसमूह नष्ट हो जाएगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘राष्ट्रों के निर्दयी लोग’ का अनुवाद ‘राष्ट्रों के अत्याचारी’ भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: ‘गौरव’ के लिए प्रयुक्त इब्रानी शब्द का अर्थ ‘घमंड’ या ‘वैभव’ भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּחַרְבוֹת גִּבּוֹרִים
  choice: वीरों की तलवारों से
  rationale: בְּ यहाँ साधन सूचित करता है। ‘वीरों’ से योद्धाओं की सामर्थ्य और युद्ध-संदर्भ दोनों व्यक्त होते हैं, जबकि तलवारों की मूल उपमा बनी रहती है।
- source_word: אַפִּיל
  choice: मैं ... को गिरा दूँगा
  rationale: नפל के हिफ़ील रूप का कारणवाचक अर्थ है। यह हिन्दी में स्वाभाविक ढंग से ‘गिरा दूँगा’ द्वारा व्यक्त होता है।
- source_word: הֲמוֹנֶךָ / כָּל הֲמוֹנָהּ
  choice: तुम्हारी भीड़ / उसकी सारी भीड़
  rationale: הָמוֹן लोगों के विशाल जनसमूह या दल को दर्शाता है। दोनों स्थानों पर ‘भीड़’ दोहराने से इब्रानी की पुनरुक्ति और समानांतरता सुरक्षित रहती है।
- source_word: עָרִיצֵי גוֹיִם כֻּלָּם
  choice: वे सब राष्ट्रों के निर्दयी लोग हैं
  rationale: עָרִיץ हिंसक, निर्मम या अत्याचारी व्यक्ति को सूचित कर सकता है। ‘निर्दयी लोग’ राजनीतिक पद का अनावश्यक संकेत दिए बिना इसका नैतिक बल बनाए रखता है।
- source_word: וְשָׁדְדוּ
  choice: वे ... को लूट लेंगे
  rationale: שׁדד का सामान्य युद्ध-संदर्भित अर्थ लूटना या लूटकर उजाड़ना है। ‘लूट लेंगे’ उसके प्रत्यक्ष और ठोस बल को बनाए रखता है।
- source_word: גְּאוֹן מִצְרַיִם
  choice: मिस्र की शान
  rationale: גָּאוֹן घमंड, गौरव, शान या वैभव का बोध करा सकता है। ‘शान’ हिन्दी में इस सकारात्मक और नकारात्मक अर्थ-तनाव को अपेक्षाकृत खुला रखती है।
- source_word: וְנִשְׁמַד
  choice: नष्ट हो जाएगी
  rationale: שׁמד के निफ़ाल रूप में नष्ट किए जाने या मिट जाने का भाव है। ‘नष्ट हो जाएगी’ स्पष्ट और प्रबल है, पर अर्थ को अनावश्यक रूप से ‘समूल विनाश’ तक नहीं बढ़ाता।
theological_decisions:
- issue: न्याय-वाणी में גְּאוֹן का अर्थ
  choice: मिस्र की शान
  alternative: मिस्र का घमंड; मिस्र का वैभव
  rationale: यह शब्द मिस्र के अहंकार और उस गौरव या वैभव—दोनों—को दर्शा सकता है जिस पर वह गर्व करता है। ‘शान’ मुख्य पाठ में इस द्विअर्थी तनाव को बनाए रखती है और पादटिप्पणी संभावित अर्थों को स्पष्ट करती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। युद्ध और न्याय की कठोरता को नरम नहीं किया गया; साथ ही גְּאוֹן की वास्तविक अर्थगत बहुलता पादटिप्पणी सहित सुरक्षित रखी गई है।
