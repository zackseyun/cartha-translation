base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/032/005.yaml
  text: And I will put your flesh on the mountains[a], and I will fill the valleys with your carcass.
translation:
  language: hi
  text: मैं तेरा मांस पहाड़ों पर डाल दूँगा और घाटियों को तेरे शव[a] से भर दूँगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “तेरी लाश”; अधिक शाब्दिक रूप से, संभवतः “तेरी ऊँचाई” या “तेरा ऊँचा कद।” यहाँ का इब्रानी शब्द कठिन है, पर संदर्भ फिरौन के गिरे हुए शरीर के पूरे देश में फैले होने की ओर संकेत करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתִּי
  choice: मैं ... डाल दूँगा
  rationale: נתן का मूल अर्थ देना/रखना/डालना हो सकता है। यहाँ न्याय के दृश्य में मांस को पहाड़ों पर डालने की क्रिया के लिए यह स्वाभाविक और सशक्त हिन्दी है।
- source_word: בְּשָׂרְךָ
  choice: तेरा मांस
  rationale: בשר का ठोस अर्थ ‘मांस’ है। ‘शरीर’ कहने से मूल की जानबूझकर रखी गई वीभत्स और अपमानजनक छवि कुछ नरम पड़ जाती।
- source_word: הֶהָרִים
  choice: पहाड़ों
  rationale: הרים का सामान्य अर्थ ‘पहाड़’ है और यह अगली पंक्ति की ‘घाटियों’ के साथ स्पष्ट स्थलाकृतिक समानांतर बनाता है।
- source_word: וּמִלֵּאתִי
  choice: भर दूँगा
  rationale: מלא के पिएल रूप का सीधा अर्थ ‘भर देना’ है; हिन्दी में यह भावी दैवी क्रिया को सहज ढंग से व्यक्त करता है।
- source_word: הַגֵּאָיוֹת
  choice: घाटियों
  rationale: גיא घाटी या खड्ड को सूचित कर सकता है। बहुवचन ‘घाटियाँ’ यहाँ पहाड़ों के समानांतर व्यापक और स्वाभाविक चयन है।
- source_word: רָמוּתֶךָ
  choice: तेरे शव
  rationale: यह कठिन और असामान्य रूप ऊँचाई/विशालता से संबंधित जान पड़ता है, पर संदर्भ फिरौन के गिरे हुए विशाल शरीर की ओर संकेत करता है। मुख्य पाठ में ‘शव’ दृश्य को स्पष्ट रखता है, जबकि पादटिप्पणी शाब्दिक अनिश्चितता को सुरक्षित रखती है।
theological_decisions:
- issue: दैवी न्याय की हिंसक और अपमानजनक छवि
  choice: मांस और शव की ठोस, वीभत्स छवि को बनाए रखा गया है।
  alternative: ‘शरीर’ और ‘अवशेष’ जैसे नरम शब्दों से चित्र को कम तीखा करना।
  rationale: यह भविष्यवाणी फिरौन की पराजय और सार्वजनिक अपमान को जानबूझकर अत्यंत ठोस भाषा में दिखाती है; भाषा को नरम करना मूल के प्रभाव को घटा देता।
- issue: רָמוּתֶךָ की संदिग्ध व्याख्या
  choice: संदर्भानुसार मुख्य पाठ में ‘शव’, साथ में शाब्दिक कठिनाई बताने वाली पादटिप्पणी।
  alternative: मुख्य पाठ में ‘तेरी ऊँचाई’ या ‘तेरा विशाल डील-डौल’।
  rationale: ‘ऊँचाई’ रूप-संबंध को अधिक सीधे रखती है, पर हिन्दी में इस प्रसंग में अस्पष्ट है। ‘शव’ संदर्भगत आशय देता है, और पादटिप्पणी वास्तविक भाषिक अनिश्चितता को छिपने नहीं देती।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की है, पर भविष्यवाणी के गंभीर और गरिमापूर्ण स्वर को बनाए रखती है। ‘मांस’ और ‘शव’ मूल की कठोर न्याय-छवि को बिना अनावश्यक अलंकरण के व्यक्त करते हैं।
