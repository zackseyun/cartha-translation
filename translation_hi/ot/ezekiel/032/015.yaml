id: EZK.32.15
reference: Ezekiel 32:15
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: בְּ/תִתִּ/י֩ אֶת אֶ֨רֶץ מִצְרַ֜יִם שְׁמָמָ֣ה וּ/נְשַׁמָּ֗ה אֶ֚רֶץ מִ/מְּלֹאָ֔/הּ בְּ/הַכּוֹתִ֖/י אֶת כָּל י֣וֹשְׁבֵי בָ֑/הּ וְ/יָדְע֖וּ כִּֽי אֲנִ֥י יְהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/032/015.yaml
  text: When I make the land of Egypt a desolation[a], and the land is stripped of all that fills it, when I strike down all who dwell in it, then they will know that I am Yahweh.
translation:
  language: hi
  text: जब मैं मिस्र देश को उजाड़ बना दूँगा, और देश अपनी सारी भरपूरी से रहित होकर उजाड़ हो जाएगा, जब मैं उसमें रहनेवाले सभी लोगों को मार गिराऊँगा, तब वे जानेंगे कि मैं यहोवा हूँ।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּתִתִּי
  choice: जब मैं ... उजाड़ दूँगा
  rationale: ב + infinitive construct यहाँ समयसूचक उपवाक्य बनाता है। נתן का शाब्दिक अर्थ ‘देना’ है, पर परिणाम-सूचक पूरक שְׁמָמָה के साथ इसका स्वाभाविक अर्थ ‘उजाड़ बना देना’ है।
- source_word: אֶרֶץ מִצְרַיִם
  choice: मिस्र देश
  rationale: यह हिन्दी में स्थान-नाम और ‘देश’ का स्वाभाविक, संक्षिप्त संयोजन है।
- source_word: שְׁמָמָה
  choice: उजाड़
  rationale: संज्ञा विनाश और निर्जनता की दशा बताती है; ‘उजाड़’ हिन्दी में उसकी संज्ञात्मक शक्ति बनाए रखता है।
- source_word: וּנְשַׁמָּה אֶרֶץ מִמְּלֹאָהּ
  choice: और देश में जो कुछ भरा है उससे वह खाली हो जाएगा
  rationale: निफ़ाल रूप उजाड़े या सूने किए जाने को तीव्र करता है, और מִמְּלֹאָהּ देश को उसकी समस्त सामग्री या भरपूरी से वंचित किए जाने का भाव देता है। यह अनुवाद दोनों तत्वों को स्पष्ट रखता है।
- source_word: בְּהַכּוֹתִי
  choice: जब मैं ... मार गिराऊँगा
  rationale: ב + infinitive construct फिर समयसूचक है; न्याय के प्रसंग में נכה का प्रहार घातक है, इसलिए ‘मार गिराऊँगा’ उपयुक्त है।
- source_word: כָּל יֹשְׁבֵי בָהּ
  choice: उसमें रहनेवाले सभी लोगों को
  rationale: प्रतिभागी रूप का सीधा और स्वाभाविक हिन्दी रूप, जो निवासियों की समग्रता बनाए रखता है।
- source_word: וְיָדְעוּ
  choice: तब वे जानेंगे
  rationale: वाव यहाँ पहले बताए न्याय के परिणाम को प्रकट करता है; ‘तब’ उस परिणामी संबंध को सहज हिन्दी में व्यक्त करता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिन्दी बाइबलीय प्रयोग में प्रचलित रूप ‘यहोवा’ परमेश्वर के व्यक्तिगत नाम को किसी उपाधि से प्रतिस्थापित किए बिना प्रस्तुत करता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल में चतुरक्षरीय व्यक्तिगत नाम सीधे आया है। हिन्दी पाठकों के लिए स्थापित रूप ‘यहोवा’ नाम की विशिष्टता बनाए रखता है; ‘याहवे’ अधिक प्रत्यक्ष विद्वत्तापरक लिप्यंतरण है।
- issue: ‘वे जानेंगे’ में कर्ता की पहचान
  choice: सर्वनाम ‘वे’ को अनिर्दिष्ट रखा गया
  alternative: ‘मिस्रवासी जानेंगे’
  rationale: इब्रानी क्रिया बहुवचन कर्ता को व्यक्त करती है, पर इस पद में उसका नाम स्पष्ट नहीं करती। अनुवाद मूल की इस अस्पष्टता को सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण पर सामान्य पाठकों के लिए सहज। समानार्थी विनाश-भाषा की अनावश्यक पुनरावृत्ति से बचते हुए ‘उजाड़’ और ‘खाली’ द्वारा मूल के विनाश तथा भरपूरी से वंचित होने—दोनों भाव रखे गए हैं।
