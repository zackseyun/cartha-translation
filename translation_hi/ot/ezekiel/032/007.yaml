base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/032/007.yaml
  text: When I extinguish you[a], I will cover the heavens and darken their stars; I will cover the sun with a cloud, and the moon will not give its light.
translation:
  language: hi
  text: जब मैं तुझे बुझा दूँगा[a], तब मैं आकाश को ढक दूँगा और उसके तारों को अँधेरा कर दूँगा; मैं सूर्य को बादल से ढक दूँगा, और चन्द्रमा अपना प्रकाश नहीं देगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जब तू बुझ जाएगा।” इब्रानी में किसी दीपक या ज्योति के बुझने की छवि है; इस रचना को सकर्मक अर्थ (“जब मैं तुझे बुझा दूँगा”) या अकर्मक अर्थ (“जब तू बुझ जाएगा”) में समझा जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִסֵּיתִי
  choice: मैं ... ढक दूँगा
  rationale: כסה का मूल अर्थ ‘ढकना/छिपाना’ है। यहाँ आने वाले न्याय के क्रम में भविष्यकाल स्वाभाविक है और ‘ढक दूँगा’ आकाशीय अन्धकार की छवि को स्पष्ट रखता है।
- source_word: בְכַבּוֹתְךָ
  choice: जब मैं तुझे बुझा दूँगा
  rationale: כבה बुझने या बुझाने की छवि व्यक्त करता है। प्रसंग में परमेश्वर का न्याय प्रमुख है, इसलिए मुख्य पाठ में सकर्मक रूप लिया गया है; फिर भी इब्रानी रचना ‘जब तू बुझ जाएगा’ भी समझी जा सकती है, जिसे पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: שָׁמַיִם
  choice: आकाश
  rationale: इब्रानी शब्द रूप में बहुवचन है, पर आधुनिक हिन्दी में इस ब्रह्माण्डीय दृश्य के लिए ‘आकाश’ अधिक स्वाभाविक और गरिमापूर्ण है।
- source_word: וְהִקְדַּרְתִּי
  choice: अँधेरा कर दूँगा
  rationale: קדר के कारक रूप का अर्थ ‘अँधेरा करना’ है; यह हिन्दी में सीधा और सहज है।
- source_word: כֹּכְבֵיהֶם
  choice: उसके तारे
  rationale: प्रत्यय का सम्बन्ध שָׁמַיִם से है। हिन्दी में ‘आकाश’ के अनुसार एकवचन सम्बन्धवाचक ‘उसके’ स्वाभाविक है।
- source_word: שֶׁמֶשׁ בֶּעָנָן אֲכַסֶּנּוּ
  choice: मैं सूर्य को बादल से ढक दूँगा
  rationale: בְּ को साधनवाचक ‘से’ और כסה को पहले खण्ड के अनुरूप ‘ढकना’ अनूदित किया गया है।
- source_word: וְיָרֵחַ לֹא יָאִיר אוֹרוֹ
  choice: और चन्द्रमा अपना प्रकाश नहीं देगा
  rationale: אור के हिफ़ील रूप में प्रकाश देने का भाव है। ‘अपना प्रकाश नहीं देगा’ हिन्दी में स्वाभाविक रहते हुए उस अर्थ को बनाए रखता है।
theological_decisions:
- issue: ब्रह्माण्डीय अन्धकार की प्रकृति
  choice: न्याय के समय आकाश, तारों, सूर्य और चन्द्रमा के अन्धकारमय होने की छवि को ज्यों का त्यों रखा गया है।
  alternative: इसे केवल वास्तविक खगोलीय विपत्ति या केवल मिस्र के राजनीतिक पतन का रूपक मानकर स्पष्ट करना।
  rationale: इब्रानी पाठ भविष्यद्वाणी के न्याय की सशक्त ब्रह्माण्डीय भाषा प्रयोग करता है, पर यह स्वयं तय नहीं करता कि उसे केवल शाब्दिक या केवल रूपकात्मक माना जाए। अनुवाद उस तनाव को खुला रखता है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, सरल किन्तु गरिमापूर्ण रखी गई है। सम्बोधित व्यक्ति के लिए ‘तू’ भविष्यद्वाणी की सीधी, एकवचन सम्बोधन-शैली को सुरक्षित रखता है। ‘चन्द्रमा’ औपचारिक काव्यात्मक प्रसंग के अनुकूल है।
