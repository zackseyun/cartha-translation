    reason: lexical_alternative
lexical_decisions:
- source_word: מִמִּי נָעָמְתָּ
  choice: तू किससे अधिक सुन्दर है?
  rationale: מִן के साथ מִי तुलनात्मक प्रश्न बनाता है। נעם यहाँ आकर्षकता या शोभा का भाव देता है; इसलिए यह स्वाभाविक हिन्दी मूल की अलंकारिक तुलना को बनाए रखती है।
- source_word: רְדָה
  choice: नीचे उतर
  rationale: यह ירד का स्त्रीलिंग एकवचन आज्ञार्थक रूप है और मृतकों के लोक की ओर उतरने के प्रसंग में सीधा तथा सजीव है।
- source_word: וְהָשְׁכְּבָה
  choice: और ... लेट जा
  rationale: שכב का यह आज्ञार्थक रूप मृत्यु और कब्र के प्रसंग में लेटने को व्यक्त करता है। सक्रिय रूप मूल की व्याकरणिक आकृति को अनावश्यक रूप से कर्मवाच्य बनाए बिना सुरक्षित रखता है।
- source_word: אֶת עֲרֵלִים
  choice: खतनारहित लोगों के साथ
  rationale: שכב के बाद אֶת संगति का संबंध व्यक्त करता है। עֲרֵלִים को ठोस शारीरिक और वाचा-संबंधी संकेत के रूप में रखा गया है, न कि सामान्यीकृत 'अन्यजाति' या 'अशुद्ध' के रूप में।
theological_decisions:
- issue: न्याय-वाणी में עֲרֵלִים का आशय
  choice: खतनारहित लोग
  alternative: अन्यजाति लोग / अशुद्ध लोग
  rationale: इब्रानी शब्द विशेष रूप से खतना न होने की दशा बताता है और इस प्रसंग में अपमान तथा मृत्यु की छवि रखता है। सामान्यीकृत विकल्प मूल की ठोस वाचा-संबंधी भाषा को मिटा देंगे।
- issue: נָעָמְתָּ में तुलना और सौन्दर्य का भाव
  choice: तू किससे अधिक सुन्दर है?
  alternative: तू किससे बढ़कर मनोहर है? / तू किसे सुन्दरता में पीछे छोड़ता है?
  rationale: प्रश्न की अलंकारिक तुलना को स्पष्ट रखते हुए किसी विशेष उत्तर या अतिरिक्त धार्मिक अर्थ को आरोपित नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गंभीर और काव्यात्मक न्याय-वाणी। एकवचन ‘तू’ मूल के स्त्रीलिंग एकवचन संबोधन को स्वाभाविक हिन्दी में व्यक्त करता है। ‘खतनारहित’ ने अधिक संस्कृतनिष्ठ ‘अखतनाकृत’ या अर्थ-विस्तार करने वाले ‘अन्यजाति’ से बचते हुए सामान्य बोधगम्यता बनाए रखी है।
