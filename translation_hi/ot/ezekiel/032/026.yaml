source:
  edition: WLC
  text: שָׁ֣ם מֶ֤שֶׁךְ תֻּבַל֙ וְ/כָל הֲמוֹנָ֔/הּ סְבִֽיבוֹתָ֖י/ו קִבְרוֹתֶ֑י/הָ כֻּלָּ֤/ם עֲרֵלִים֙ מְחֻ֣לְלֵי חֶ֔רֶב כִּֽי נָתְנ֥וּ חִתִּיתָ֖/ם בְּ/אֶ֥רֶץ חַיִּֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/032/026.yaml
  text: There are Meshech and Tubal[a], and all her multitude; their graves are all around him. All of them are uncircumcised, slain by the sword, because they spread their terror in the land of the living.
translation:
  language: hi
  text: वहाँ मेशेक और तूबल[a] हैं, और उसकी सारी भीड़ भी है; उसकी कब्रें उसके चारों ओर हैं। वे सब खतनारहित हैं, तलवार से मारे गए हैं, क्योंकि उन्होंने जीवितों के देश में अपना आतंक फैला दिया था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इब्रानी में शाब्दिक क्रम है: “और उसकी सारी भीड़; उसके चारों ओर उसकी कब्रें हैं।” इस काव्य-पंक्ति में एकवचन तथा पुल्लिंग और स्त्रीलिंग सर्वनाम-प्रत्यय बदलते हैं।'
    reason: मूल इब्रानी के काव्यात्मक सर्वनाम-परिवर्तन और उससे उत्पन्न वास्तविक अस्पष्टता को बताना।
lexical_decisions:
- source_word: שָׁם
  choice: वहाँ ... है
  rationale: यह अधोलोक में राष्ट्रों की सूची के भीतर स्थानसूचक प्रयोग है; हिन्दी में क्रियाहीन इब्रानी वाक्य को स्वाभाविक बनाने के लिए ‘है’ जोड़ा गया है।
- source_word: מֶשֶׁךְ תֻּבַל
  choice: मेशेक और तूबल
  rationale: ये जातियों अथवा क्षेत्रों के व्यक्तिवाचक नाम हैं, इसलिए इनका अनुवाद करने के बजाय लिप्यंतरण किया गया है।
- source_word: וְכָל הֲמוֹנָהּ
  choice: और उसकी सारी भीड़
  rationale: הָמוֹן संबद्ध जनसमूह को दर्शाता है; ‘भीड़’ सामूहिक अर्थ रखता है और इसे केवल सैनिक दल नहीं मानता।
- source_word: סְבִיבוֹתָיו קִבְרוֹתֶיהָ
  choice: उसकी कब्रें उसके चारों ओर हैं
  rationale: मूल में स्त्रीलिंग ‘उसकी कब्रें’ और पुल्लिंग एकवचन ‘उसके चारों ओर’ का काव्यात्मक सर्वनाम-परिवर्तन है। मुख्य पाठ में इसे यथासंभव सुरक्षित रखा गया है और पादटिप्पणी में स्पष्ट किया गया है।
- source_word: כֻּלָּם
  choice: वे सब
  rationale: यह पूरे जनसमूह को फिर से ग्रहण करके आगे के वर्णन से जोड़ता है।
- source_word: עֲרֵלִים
  choice: खतनारहित
  rationale: शाब्दिक चयन यहेजकेल के वाचा-संबंधी और अपमानसूचक भाव को बनाए रखता है।
- source_word: מְחֻלְלֵי חֶרֶב
  choice: तलवार से मारे गए
  rationale: इस प्रसंग में पदबंध युद्ध में तलवार से घातक रूप से मारे गए लोगों को सूचित करता है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यह उनकी मृत्यु और अपमान की दशा का कारण प्रस्तुत करता है।
- source_word: נָתְנוּ חִתִּיתָם
  choice: उन्होंने ... अपना आतंक फैला दिया था
  rationale: ‘अपना आतंक रखना/देना’ का मुहावरा भय उत्पन्न या व्यापक करने का भाव देता है; यह हिन्दी में स्वाभाविक कारणात्मक अभिव्यक्ति है।
- source_word: בְּאֶרֶץ חַיִּים
  choice: जीवितों के देश में
  rationale: यह अधोलोक के विपरीत सांसारिक जीवन के क्षेत्र के लिए स्थापित इब्रानी मुहावरा है।
theological_decisions:
- issue: दफ़न के न्याय में वाचा-संबंधी अपमान की भाषा
  choice: खतनारहित
  alternative: अपवित्र
  rationale: עֲרֵלִים को सीधे प्रस्तुत करने से जातियों की मृत्यु में लज्जा और वाचा-चिह्न से उनके बाहर होने की अलंकारिक शक्ति बचती है; व्याख्यात्मक विकल्प मूल की विशिष्टता मिटा देगा।
- issue: काव्य-पंक्ति में सर्वनामों के लिंग और वचन का परिवर्तन
  choice: मुख्य पाठ में ‘उसकी ... उसके’ रखकर अस्पष्टता सुरक्षित करना
  alternative: सभी सर्वनामों को बहुवचन ‘उनकी ... उनके’ बनाकर नियमित करना
  rationale: मूल में ‘उसकी सारी भीड़’, ‘उसके चारों ओर’ और ‘उसकी कब्रें’ जैसे बदलते प्रत्यय हैं। उन्हें पूरी तरह नियमित करना मूल की वास्तविक काव्यात्मक अनिश्चितता को चुपचाप सुलझा देता; पादटिप्पणी पाठक को इस विशेषता से अवगत कराती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज और स्रोत-सन्निकट शैली अपनाई गई है। ‘खतनारहित’ और ‘जीवितों का देश’ जैसे धर्मवैचारिक रूप से महत्त्वपूर्ण पद शाब्दिक रखे गए हैं; सर्वनामों की मूल अस्पष्टता को मिटाने के बजाय पादटिप्पणी से स्पष्ट किया गया है।
