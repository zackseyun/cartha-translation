lexical_decisions:
- source_word: אָז
  choice: तब
  rationale: यह कालवाचक क्रियाविशेषण भविष्यवाणी में इसके फलस्वरूप आने वाले समय को दिखाता है; ‘तब’ संक्षिप्त और स्वाभाविक है।
- source_word: אַשְׁקִיעַ
  choice: मैं ... बैठ जाने दूँगा
  rationale: שׁקע के हिफ़ील रूप का अर्थ किसी वस्तु को धँसाना, नीचे बैठाना या थमने देना हो सकता है। जल के संदर्भ में यह उसके विक्षोभ के बाद बैठ जाने का चित्र प्रस्तुत करता है।
- source_word: מֵימֵיהֶם
  choice: उनके जल
  rationale: मूल में बहुवचन रूप है। हिन्दी में ‘जल’ सामूहिक अर्थ में स्वाभाविक है और काव्यात्मक गरिमा बनाए रखता है।
- source_word: וְנַהֲרוֹתָם
  choice: और उनकी नदियों को
  rationale: נְהָרוֹת सामान्यतः नदियों या धाराओं के लिए आता है; आस-पास के मिस्र और नील-संबंधी चित्र में ‘नदियाँ’ उपयुक्त है।
- source_word: כַּשֶּׁמֶן
  choice: तेल के समान
  rationale: मूल उपमा को बिना ‘जैतून’ जैसा अनुल्लिखित विवरण जोड़े संक्षिप्त रूप में सुरक्षित रखा गया है।
- source_word: אוֹלִיךְ
  choice: बहाऊँगा
  rationale: הלך का हिफ़ील रूप ‘चलाना’ या ‘ले जाना’ है। नदियों के संदर्भ में ‘बहाऊँगा’ स्वाभाविक हिन्दी है और दैवी कारकता को व्यक्त करता है।
- source_word: נְאֻם
  choice: यह घोषणा है
  rationale: यह गंभीर भविष्यवाणी-सूत्र है; ‘यह घोषणा है’ आधुनिक, स्पष्ट और प्रतिष्ठित हिन्दी है।
- source_word: אֲדֹנָי יְהוִה
  choice: प्रभु यहोवा
  rationale: אֲדֹנָי को ‘प्रभु’ और चार-अक्षरीय दिव्य नाम יהוה को हिन्दी में प्रचलित नामरूप ‘यहोवा’ से व्यक्त किया गया है, जिससे दोनों पद अलग बने रहते हैं।
theological_decisions:
- issue: אֲדֹנָי יְהוִה में दिव्य नाम का अनुवाद
  choice: प्रभु यहोवा
  alternative: प्रभु याहवे; परमेश्वर यहोवा
  rationale: मूल में उपाधि אֲדֹנָי और व्यक्तिगत दिव्य नाम יהוה दोनों हैं। ‘प्रभु यहोवा’ इस भेद को बनाए रखता है और ‘प्रभु प्रभु’ जैसी पुनरुक्ति से बचता है; नाम के उच्चारण को लेकर किसी एक पुनर्निर्माण को पाठ में अनिवार्य नहीं करता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की है, पर भविष्यवाणी की गंभीर और काव्यात्मक शैली बनाए रखी गई है। ‘जल’ और ‘तेल के समान’ मूल बिंब की संक्षिप्तता रखते हैं; दोनों विवाद्य क्रियाओं के वैकल्पिक अर्थ पादटिप्पणियों में सुरक्षित हैं।
