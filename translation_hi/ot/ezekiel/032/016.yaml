id: EZK.32.16
reference: Ezekiel 32:16
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: קִינָ֥ה הִיא֙ וְ/ק֣וֹנְנ֔וּ/הָ בְּנ֥וֹת הַ/גּוֹיִ֖ם תְּקוֹנֵ֣נָּה אוֹתָ֑/הּ עַל מִצְרַ֤יִם וְ/עַל כָּל הֲמוֹנָ/הּ֙ תְּקוֹנֵ֣נָּה אוֹתָ֔/הּ נְאֻ֖ם אֲדֹנָ֥/י יְהוִֽה־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/032/016.yaml
  text: This is a lamentation[a], and the daughters of the nations will lament over her. They will lament over Egypt and over all her multitude[b], declares the Lord GOD.
translation:
  language: hi
  text: यह एक विलापगीत[a] है; राष्ट्रों की बेटियाँ[b] इसे गाएँगी। वे मिस्र और उसके सारे जनसमूह[c] के लिए इसे गाएँगी—प्रभु यहोवा की यह घोषणा है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘शोकगीत’; इब्रानी शब्द मृत्यु या विनाश पर गाए जाने वाले विलाप को दर्शा सकता है।
    reason: lexical_alternative
  - marker: b
    text: अर्थात राष्ट्रों की स्त्रियाँ; मूल में शाब्दिक रूप से ‘राष्ट्रों की बेटियाँ’ है।
    reason: idiom_clarification
  - marker: c
    text: या ‘उसकी सारी भीड़’; इब्रानी शब्द बड़ी जनसंख्या, भीड़ या कोलाहलपूर्ण समुदाय को सूचित कर सकता है।
    reason: lexical_ambiguity
lexical_decisions:
- source_word: קִינָה
  choice: विलापगीत
  rationale: यह शब्द मृत्यु या विनाश के अवसर पर गाए जाने वाले शोकगीत को दर्शाता है। ‘विलापगीत’ सामान्य पाठक के लिए स्पष्ट है और गीत तथा शोक—दोनों भाव बनाए रखता है।
- source_word: וְקוֹנְנוּהָ / תְּקוֹנֵנָּה אוֹתָהּ
  choice: इसे गाएँगी
  rationale: क्रिया קונן का अर्थ विलाप करना या विलापगीत गाना है, और स्त्रीलिंग प्रत्यय का सीधा संदर्भ קִינָה, अर्थात ‘विलापगीत’, से है। इसलिए ‘इसे गाएँगी’ मूल वाक्य-संबंध को सुरक्षित रखता है।
- source_word: בְּנוֹת הַגּוֹיִם
  choice: राष्ट्रों की बेटियाँ
  rationale: यह मूल अभिव्यक्ति का निकट और स्वाभाविक रूप है। संदर्भ में इससे राष्ट्रों की स्त्रियाँ, संभवतः विलाप करने वाली स्त्रियाँ, अभिप्रेत हैं।
- source_word: עַל מִצְרַיִם
  choice: मिस्र के लिए
  rationale: विलाप के संदर्भ में עַל उस व्यक्ति या समुदाय को सूचित करता है जिसके लिए शोकगीत गाया जाता है। हिंदी में ‘के लिए’ स्वाभाविक है।
- source_word: כָּל הֲמוֹנָהּ
  choice: उसके सारे जनसमूह
  rationale: הָמוֹן किसी राष्ट्र से जुड़ी विशाल भीड़, जनसमुदाय या कोलाहलपूर्ण समूह को दर्शा सकता है। ‘जनसमूह’ सैन्य अर्थ को अनावश्यक रूप से निश्चित किए बिना व्यापक भाव रखता है।
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: प्रभु यहोवा की यह घोषणा है
  rationale: यह भविष्यद्वक्ताओं में प्रयुक्त अधिकारपूर्ण दैवी घोषणा का सूत्र है। ‘प्रभु यहोवा’ אֲדֹנָי और परमेश्वर के व्यक्तिगत नाम יְהוִה—दोनों को अलग-अलग व्यक्त करता है।
theological_decisions:
- issue: नְאֻם אֲדֹנָי יְהוִה में परमेश्वर के नाम का अनुवाद
  choice: प्रभु यहोवा की यह घोषणा है
  alternative: प्रभु परमेश्वर की यह घोषणा है
  rationale: ‘यहोवा’ चतुरक्षरीय व्यक्तिगत नाम को व्यक्त करता है और उसे केवल उपाधि ‘परमेश्वर’ में विलीन नहीं करता; ‘प्रभु’ אֲדֹנָי का प्रतिनिधित्व करता है।
- issue: स्त्रीलिंग कर्म-प्रत्यय का संदर्भ
  choice: विलापगीत को ‘इसे’ का संदर्भ माना गया है
  alternative: मिस्र को स्त्रीलिंग मानकर ‘उसके लिए विलाप करेंगी’
  rationale: व्याकरण में וְקוֹנְנוּהָ और אוֹתָהּ का निकटतम तथा स्पष्ट स्त्रीलिंग पूर्वपद קִינָה है। मिस्र बाद में עַל के साथ विलाप का विषय बनता है; अतः मूल की संरचना को अस्पष्ट रूप से बदलना उचित नहीं है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सार्वजनिक पाठ के अनुकूल रखी गई है। ‘विलापगीत’ तथा ‘इसे गाएँगी’ की पुनरावृत्ति मूल पद की गीतात्मक संरचना और क़ीना/क़ोनन शब्द-संबंध को बनाए रखती है।
