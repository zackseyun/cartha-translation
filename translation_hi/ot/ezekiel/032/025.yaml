  text: בְּ/ת֣וֹךְ חֲ֠לָלִים נָתְנ֨וּ מִשְׁכָּ֥ב לָ/הּ֙ בְּ/כָל הֲמוֹנָ֔/הּ סְבִֽיבוֹתָ֖י/ו קִבְרֹתֶ֑/הָ כֻּלָּ֣/ם עֲרֵלִ֣ים חַלְלֵי חֶ֡רֶב כִּֽי נִתַּ֨ן חִתִּיתָ֜/ם בְּ/אֶ֣רֶץ חַיִּ֗ים וַ/יִּשְׂא֤וּ כְלִמָּתָ/ם֙ אֶת י֣וֹרְדֵי ב֔וֹר בְּ/ת֥וֹךְ חֲלָלִ֖ים נִתָּֽן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/032/025.yaml
  text: Among the slain they made a bed for her with all her multitude[a]; her graves are all around her. All of them are uncircumcised, slain by the sword, because their terror was set in the land of the living. So they bore their disgrace with those who go down to the pit[c][b]; she was placed among the slain.
translation:
  language: hi
  text: मारे हुओं के बीच उन्होंने उसके लिए, उसके सारे जनसमूह समेत, एक बिछौना रखा; उसकी कब्रें उसके चारों ओर हैं।[a] वे सब खतना-रहित हैं, तलवार से मारे गए हैं, क्योंकि जीवितों के देश में उनका आतंक स्थापित किया गया था।[b] इस प्रकार उन्होंने गड्ढे में उतरनेवालों के साथ अपना अपमान सहा; मारे हुओं के बीच उसे रखा गया।[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में ‘उसकी कब्रें’ का प्रत्यय स्त्रीलिंग है, पर ‘उसके चारों ओर’ का प्रत्यय पुल्लिंग है। सम्भवतः कथन व्यक्तिरूप राष्ट्र या जनसमूह और उसके प्रतिनिधि के बीच बदलता है। हिन्दी के ‘उसकी/उसके’ में स्वामी का लिंग प्रकट नहीं होता।
    reason: alternative_reading
  - marker: b
    text: या, “क्योंकि उन्होंने जीवितों के देश में अपना आतंक फैला दिया था।” इब्रानी का शाब्दिक भाव है, “क्योंकि उनका आतंक जीवितों के देश में स्थापित किया गया था।”
    reason: lexical_alternative
  - marker: c
    text: अंतिम इब्रानी क्रिया पुल्लिंग एकवचन है। इसलिए यह किसी पुल्लिंग प्रतिनिधि की ओर संकेत कर सकती है; हिन्दी का “उसे रखा गया” भी संदर्भ को खुला रखता है।
    reason: alternative_reading
lexical_decisions:
- source_word: בְּתוֹךְ חֲלָלִים
  choice: मारे हुओं के बीच
  rationale: यह युद्ध में मारे गए लोगों के बीच होने का बोध देता है और अध्याय में दोहराए गए मृत्यु-विषयक चित्र को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: נָתְנוּ מִשְׁכָּב לָהּ
  choice: उसके लिए ... एक बिछौना लगाया गया
  rationale: मूल का ‘बिछौना देना/लगाना’ वाला अधोलोक और कब्र का रूपक सुरक्षित रखा गया है; इसे केवल ‘दफनाया’ कहकर सपाट नहीं किया गया।
- source_word: בְּכָל הֲמוֹנָהּ
  choice: उसकी सारी भीड़ समेत
  rationale: הָמוֹן संबद्ध जनसमूह को सूचित करता है; ‘भीड़’ सामान्य पाठक के लिए स्पष्ट है और अनावश्यक सैन्य अर्थ नहीं जोड़ता।
- source_word: סְבִיבוֹתָיו קִבְרֹתֶהָ
  choice: उसकी कब्रें उसके चारों ओर हैं
  rationale: हिन्दी के ‘उसकी/उसके’ सर्वनाम स्वामी का लिंग प्रकट नहीं करते; इसलिए इब्रानी के स्त्रीलिंग से पुल्लिंग में परिवर्तन को पादटिप्पणी में स्पष्ट किया गया है, बिना पाठ में कोई अतिरिक्त ‘पुरुष’ या ‘शासक’ जोड़ने के।
- source_word: כֻּלָּם עֲרֵלִים
  choice: वे सब खतनारहित हैं
  rationale: ठोस वाचा-संबंधी और अपमानसूचक शब्द को किसी व्याख्यात्मक अमूर्त पद से नहीं बदला गया।
- source_word: חַלְלֵי חֶרֶב
  choice: तलवार से मारे गए
  rationale: यह प्रचलित युद्ध-मृत्यु अभिव्यक्ति का स्पष्ट और स्वाभाविक हिन्दी रूप है।
- source_word: כִּי נִתַּן חִתִּיתָם
  choice: क्योंकि ... उनका आतंक स्थापित किया गया था
  rationale: निष्क्रिय נִתַּן को निष्क्रिय रूप में रखा गया है और मूल में अनुपस्थित कर्ता नहीं जोड़ा गया।
- source_word: בְּאֶרֶץ חַיִּים
  choice: जीवितों के देश में
  rationale: यह जीवित संसार और गड्ढे/मृतलोक के बीच मूल विरोध को बनाए रखने वाली परिचित बाइबिलीय अभिव्यक्ति है।
- source_word: וַיִּשְׂאוּ כְלִמָּתָם
  choice: उन्होंने ... अपना अपमान सहा
  rationale: ‘अपमान उठाने/ढोने’ का भाव वर्तमान हिन्दी में स्वाभाविक ढंग से ‘अपमान सहना’ व्यक्त करता है।
- source_word: אֶת יֹרְדֵי בוֹר
  choice: गड्ढे में उतरनेवालों के साथ
  rationale: संदर्भ में אֶת को साहचर्य के अर्थ में समझा गया है और ‘गड्ढा’ मृतलोक की मूल छवि को सुरक्षित रखता है।
- source_word: בְּתוֹךְ חֲלָלִים נִתָּן
  choice: मारे हुओं के बीच उसे रखा गया
  rationale: अंतिम पुल्लिंग एकवचन निष्क्रिय रूप को हिन्दी के ‘रखा गया’ में बनाए रखा गया है; उसका सटीक संदर्भ अस्पष्ट रहने दिया गया है।
theological_decisions:
- issue: न्याय-वाणी में ‘खतनारहित’ पद
  choice: वे सब खतनारहित हैं
  alternative: वे सब अशुद्ध बाहरी लोग हैं
  rationale: मूल शब्द स्पष्ट और मूर्त है तथा यहेजकेल में वाचा, बाहरीपन और अपमान की अर्थछाया रखता है; व्याख्यात्मक विकल्प उस तनाव को घटा देता।
- issue: कब्र के चित्र में स्त्रीलिंग और पुल्लिंग का परिवर्तन
  choice: मुख्य पाठ में हिन्दी की स्वाभाविक सर्वनाम-रचना, तथा पादटिप्पणी में इब्रानी लिंग-परिवर्तन की स्पष्ट सूचना
  alternative: सभी संदर्भों को केवल स्त्रीलिंग राष्ट्र या केवल पुल्लिंग प्रतिनिधि के अनुसार एकरूप करना
  rationale: इब्रानी संभवतः व्यक्तिरूप राष्ट्र/जनसमूह और उसके प्रतिनिधि के बीच चलता है। हिन्दी सर्वनाम स्वामी का लिंग नहीं दिखाते, इसलिए कृत्रिम संज्ञा जोड़ने के बजाय वास्तविक अस्पष्टता को टिप्पणी में सुरक्षित रखा गया है।
- issue: धरती पर आतंक का कारणात्मक कथन
  choice: उनका आतंक स्थापित किया गया था
  alternative: उन्होंने अपना आतंक फैला दिया था
  rationale: चुना हुआ रूप इब्रानी के निष्क्रिय कथन को बचाता है और किसी स्पष्ट कर्ता को नहीं जोड़ता; सक्रिय अर्थ सम्भव होने के कारण उसे पादटिप्पणी में दिया गया है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य रखी गई है। ‘बिछौना’, ‘गड्ढा’, ‘खतनारहित’ और ‘जीवितों का देश’ जैसे ठोस बाइबिलीय चित्र सुरक्षित हैं। इब्रानी के लिंग-परिवर्तन और निष्क्रिय आतंक-वाक्य को सम्प्रदायगत या अत्यधिक व्याख्यात्मक समाधान देकर समतल नहीं किया गया।
