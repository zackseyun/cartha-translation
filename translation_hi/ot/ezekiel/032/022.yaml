reference: Ezekiel 32:22
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: שָׁ֤ם אַשּׁוּר֙ וְ/כָל קְהָלָ֔/הּ סְבִֽיבוֹתָ֖י/ו קִבְרֹתָ֑י/ו כֻּלָּ֣/ם חֲלָלִ֔ים הַ/נֹּפְלִ֖ים בֶּ/חָֽרֶב־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/032/022.yaml
  text: There is Assyria and all her assembly[a], with his graves all around him; all of them are slain, fallen by the sword.
translation:
  language: hi
  text: वहाँ अश्शूर और उसकी सारी सभा है[a]। उसकी कब्रें उसके चारों ओर हैं; वे सब मारे गए हैं, तलवार से गिरे हुए हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इब्रानी में मानवीकरण का व्याकरणिक लिंग बदलता है: ‘अश्शूर’ के साथ ‘उसकी सभा’ में स्त्रीलिंग प्रत्यय है, पर ‘उसकी कब्रें’ और ‘उसके चारों ओर’ में पुल्लिंग प्रत्यय हैं। हिन्दी में यह भेद सर्वनामों से स्पष्ट नहीं होता।'
    reason: मूल इब्रानी में लिंग-परिवर्तन को सुरक्षित रूप से दर्ज करना
lexical_decisions:
- source_word: שָׁם
  choice: वहाँ
  rationale: यह अधोलोक के दृश्य में अगली सत्ता की ओर संकेत करने वाला स्थानवाचक क्रियाविशेषण है।
- source_word: אַשּׁוּר
  choice: अश्शूर
  rationale: मूल नाम को हिन्दी बाइबलीय रूप में रखा गया है; यहाँ यह राष्ट्र या साम्राज्य का मानवीकरण है।
- source_word: וְכָל־קְהָלָהּ
  choice: और उसकी सारी सभा
  rationale: קהל किसी एकत्रित समुदाय को दर्शाता है; ‘सभा’ सामूहिक अर्थ को बनाए रखता है और इसे केवल सेना तक सीमित नहीं करता।
- source_word: קִבְרֹתָיו סְבִיבוֹתָיו
  choice: उसकी कब्रें उसके चारों ओर हैं
  rationale: ‘कब्रें’ קברות का सीधा और स्वाभाविक रूप है, और ‘चारों ओर’ बहुवचन स्थानवाचक रूप סביבותיו का स्थानिक बल व्यक्त करता है। हिन्दी के ‘उसकी/उसके’ सम्बद्ध वस्तु या परसर्ग के अनुसार बदलते हैं, इसलिए मूल का लिंग-परिवर्तन मुख्य पाठ में स्पष्ट नहीं हो सकता।
- source_word: כֻּלָּם חֲלָלִים
  choice: वे सब मारे गए हैं
  rationale: यह पूरी सभा को समेटते हुए युद्ध में हिंसक मृत्यु का अर्थ देता है।
- source_word: הַנֹּפְלִים בֶּחָרֶב
  choice: तलवार से गिरे हुए हैं
  rationale: ‘गिरे हुए’ युद्ध-संबंधी भविष्यद्वाणी की छवि को बनाए रखता है और ‘तलवार से’ मृत्यु के साधन को स्पष्ट करता है।
theological_decisions:
- issue: अश्शूर के मानवीकरण में व्याकरणिक लिंग का परिवर्तन
  choice: मुख्य पाठ में स्वाभाविक हिन्दी रखकर परिवर्तन को पादटिप्पणी में बताया गया है।
  alternative: सभी सर्वनामों को एक ही लिंग के अनुसार समतल करना, अथवा अस्वाभाविक रूप से ‘उस पुरुष की’ जैसे शब्द जोड़ना।
  rationale: इब्रानी में पहले स्त्रीलिंग प्रत्यय (‘उसकी सभा’) और फिर पुल्लिंग प्रत्यय (‘उसकी कब्रें’, ‘उसके चारों ओर’) आते हैं। आधुनिक हिन्दी के सम्बन्धकारक रूप सम्बद्ध संज्ञा या परसर्ग के अनुसार बदलते हैं, सम्बंधी के लिंग के अनुसार नहीं; इसलिए कृत्रिम विस्तार किए बिना यह तनाव केवल पादटिप्पणी में सुरक्षित रह सकता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘अश्शूर’, ‘सभा’, ‘कब्रें’ और ‘तलवार से गिरे हुए’ भविष्यद्वाणी के गंभीर तथा युद्ध-संबंधी स्वर को बनाए रखते हैं।
