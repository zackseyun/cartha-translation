source:
  edition: WLC
  text: בֶּן אָדָ֕ם נְהֵ֛ה עַל הֲמ֥וֹן מִצְרַ֖יִם וְ/הוֹרִדֵ֑/הוּ א֠וֹתָ/הּ וּ/בְנ֨וֹת גּוֹיִ֧ם אַדִּרִ֛ם אֶל אֶ֥רֶץ תַּחְתִּיּ֖וֹת אֶת י֥וֹרְדֵי בֽוֹר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/032/018.yaml
  text: Son of man[a], wail over the multitude of Egypt, and bring her down, her and the daughters of mighty nations, to the land beneath[c][b], with those who go down to the pit.
translation:
  language: hi
  text: हे मनुष्य के पुत्र, मिस्र के जनसमूह[a] पर विलाप कर और उसे तथा शक्तिशाली जातियों की बेटियों[b] को नीचे की भूमि[c] में, गड्ढे में उतरने वालों के साथ, उतार दे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘जनसमूह’ का अर्थ ‘विशाल भीड़’ या ‘लोगों का हुजूम’ भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से ‘शक्तिशाली जातियों की बेटियाँ’; यह मिस्र से संबद्ध जातियों या लोगों के लिए प्रयुक्त रूपक हो सकता है।
    reason: cultural_note
  - marker: c
    text: या ‘निचली भूमि’ अथवा ‘अधोलोक’। इब्रानी पद मृतकों से जुड़े नीचे के क्षेत्र की ओर संकेत करता है।
    reason: alternative_reading
lexical_decisions:
- source_word: בֶּן אָדָם
  choice: हे मनुष्य के पुत्र
  rationale: यहेजकेल में नबी के लिए प्रयुक्त इस विशिष्ट संबोधन की इब्रानी संरचना और भविष्यद्वाणी-संबंधी शैली को बनाए रखता है; अधिक व्याख्यात्मक ‘हे नश्वर मनुष्य’ नहीं अपनाया गया।
- source_word: נְהֵה
  choice: विलाप कर
  rationale: यह क्रिया शोकगीत या मृत्यु-संबंधी मातम को व्यक्त करती है। ‘विलाप कर’ आधुनिक हिन्दी में स्वाभाविक और गरिमापूर्ण है।
- source_word: הֲמוֹן מִצְרַיִם
  choice: मिस्र का जनसमूह
  rationale: הָמוֹן यहाँ लोगों की विशाल संख्या या भीड़ को सूचित करता है। ‘जनसमूह’ संदर्भ के अनुकूल है और ‘धन-संपत्ति’ जैसी कम संभावित व्याख्या नहीं थोपता।
- source_word: וְהוֹרִדֵהוּ / אוֹתָהּ
  choice: उसे नीचे उतार दे
  rationale: हिफ़ील आज्ञार्थक का कारणवाचक अर्थ स्पष्ट रखा गया है। लिखित पुरुषवाची प्रत्यय और अगले स्त्रीवाची कर्म-सर्वनाम के व्याकरणिक तनाव को हिन्दी के लिंग-निरपेक्ष कर्मरूप ‘उसे’ से स्वाभाविक रूप में व्यक्त किया गया है।
- source_word: וּבְנוֹת גּוֹיִם אַדִּרִם
  choice: शक्तिशाली जातियों की बेटियाँ
  rationale: ‘बेटियाँ’ के मूल रूपक को सुरक्षित रखा गया है, जबकि ‘शक्तिशाली जातियाँ’ אַדִּירִם की सामर्थ्य-सूचक भावना को स्पष्ट हिन्दी में देता है।
- source_word: אֶרֶץ תַּחְתִּיּוֹת
  choice: नीचे की भूमि
  rationale: शाब्दिक रूप से यह ‘निचले स्थानों की भूमि’ है। चुना हुआ रूप नीचे स्थित मृतकों के क्षेत्र की छवि बनाए रखता है, पर उसे किसी बाद की व्यवस्थित पारलौकिक संज्ञा से नहीं पहचानता।
- source_word: אֶת יֹרְדֵי בוֹר
  choice: गड्ढे में उतरनेवालों के साथ
  rationale: 'אֶת को यहाँ साहचर्यसूचक ‘के साथ’ समझना संदर्भ के अनुकूल है: मिस्र को उन मृतकों की संगति में उतारा जाता है जो गड्ढे में जाते हैं।'
- source_word: בּוֹר
  choice: गड्ढा
  rationale: यह मूल की ठोस, मृत्यु-संबंधी छवि को बनाए रखता है और ‘नरक’ या केवल ‘कब्र’ जैसी अधिक विशिष्ट व्याख्या से बचता है।
theological_decisions:
- issue: אֶרֶץ תַּחְתִּיּוֹת और בּוֹר में अधोलोक की छवि
  choice: ‘नीचे की भूमि’ और ‘गड्ढा’ के रूप में ठोस काव्यात्मक छवि को बनाए रखना
  alternative: ‘अधोलोक’, ‘शीओल’ या ‘नरक’
  rationale: इब्रानी पाठ मृतकों के नीचे स्थित क्षेत्र का न्यायपरक काव्यचित्र देता है, पर उसे बाद की किसी व्यवस्थित पारलौकिक धारणा के रूप में स्पष्टतः परिभाषित नहीं करता।
- issue: וְהוֹרִדֵהוּ और אוֹתָהּ के सर्वनामों में लिंग-असंगति
  choice: हिन्दी के लिंग-निरपेक्ष कर्मरूप ‘उसे’ का प्रयोग
  alternative: मिस्र को स्पष्टतः स्त्रीवाची या पुरुषवाची बनाना
  rationale: इससे व्याकरणिक कठिनाई को किसी अनुमानित पाठ-संशोधन से हल किए बिना वाक्य का आशय स्वाभाविक हिन्दी में सुरक्षित रहता है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में गरिमापूर्ण और श्रव्य रखी गई है। ‘मनुष्य के पुत्र’, ‘विलाप’, ‘नीचे की भूमि’ और ‘गड्ढा’ मूल की भविष्यद्वाणी-संबंधी तथा मृत्यु-संबंधी छवियों को बनाए रखते हैं। रूपकात्मक ‘बेटियाँ’ को मुख्य पाठ में सुरक्षित रखकर उसका आशय पादटिप्पणी में स्पष्ट किया गया है।
