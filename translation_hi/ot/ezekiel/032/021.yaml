  text: יְדַבְּרוּ ל֞/וֹ אֵלֵ֧י גִבּוֹרִ֛ים מִ/תּ֥וֹךְ שְׁא֖וֹל אֶת עֹֽזְרָ֑י/ו יָֽרְד֛וּ שָׁכְב֥וּ הָ/עֲרֵלִ֖ים חַלְלֵי חָֽרֶב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/032/021.yaml
  text: 'The mighty among the chiefs will speak to him from the midst of Sheol[a], with his helpers: ‘They have gone down; they lie still, the uncircumcised[c][b], slain by the sword.’'
translation:
  language: hi
  text: वीरों में से पराक्रमी जन[a] शिओल[b] के भीतर से उसके सहयोगियों के साथ[c] उससे कहेंगे, “वे नीचे उतर चुके हैं; वे पड़े हैं—वे खतनारहित लोग, जो तलवार से मारे गए।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी पदबंध कठिन है; इसका अधिक शाब्दिक अर्थ “वीरों के पराक्रमी जन” हो सकता है। कुछ इसे “वीरों के देवता” भी समझते हैं।
    reason: lexical_alternative
  - marker: b
    text: शिओल मृतकों के लोक के लिए इब्रानी शब्द है; इसका अर्थ ठीक वही नहीं है जो सामान्यतः “नरक” से समझा जाता है।
    reason: cultural_note
  - marker: c
    text: या “उसके सहायकों के साथ।” इब्रानी से यह भी संकेत मिल सकता है कि उसके सहयोगी मृत्यु में उसके साथ हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: יְדַבְּרוּ לוֹ
  choice: उससे … कहेंगे
  rationale: पिएल अपूर्ण क्रिया को भविष्यकालीन भविष्यवाणी-दृश्य के रूप में लिया गया है; לּוֹ उस व्यक्ति को दर्शाता है जिससे मृत योद्धा बोलते हैं।
- source_word: אֵלֵי גִבּוֹרִים
  choice: वीरों के बलवान अगुए
  rationale: कठिन इब्रानी पदबंध को शिओल में पड़े प्रमुख और शक्तिशाली मानव योद्धाओं के लिए समझा गया है। ‘अगुए’ प्रसंगगत प्रधानता व्यक्त करता है, जबकि ‘बलवान’ मूल की सामर्थ्य-संबंधी छाया बनाए रखता है।
- source_word: מִתּוֹךְ שְׁאוֹל
  choice: शिओल के बीच से
  rationale: ‘बीच से’ स्थानिक चित्र को बनाए रखता है। शिओल का लिप्यंतरण किया गया है ताकि इसे केवल कब्र या बाद की विशिष्ट ‘नरक’ की धारणा के समान न ठहराया जाए।
- source_word: אֶת עֹזְרָיו
  choice: उसके सहायकों के साथ
  rationale: यहाँ אֶת को साहचर्य के अर्थ में लिया गया है। पदबंध किसके साथ संबद्ध है, इसमें कुछ वाक्यगत अस्पष्टता है, इसलिए वैकल्पिक समझ पादटिप्पणी में दी गई है।
- source_word: יָרְדוּ שָׁכְבוּ
  choice: वे नीचे उतर चुके हैं; वे पड़े हैं
  rationale: पूर्ण क्रियाएँ मृतकों के शिओल में उतर जाने और मृत्यु में पड़े होने की पूरी हो चुकी दशा व्यक्त करती हैं।
- source_word: הָעֲרֵלִים
  choice: खतनारहित लोग
  rationale: यह यहेजकेल में अन्यजातियों के लिए प्रयुक्त शारीरिक पहचान और उससे जुड़ी अपमानसूचक छाया को स्पष्ट, आधुनिक हिन्दी में बनाए रखता है।
- source_word: חַלְלֵי חָרֶב
  choice: जो तलवार से मारे गए
  rationale: यह युद्ध में तलवार से मारे जाने की प्रचलित इब्रानी अभिव्यक्ति का स्वाभाविक हिन्दी रूप है।
theological_decisions:
- issue: שְׁאוֹל का अनुवाद
  choice: शिओल
  alternative: अधोलोक; मृतकों का लोक; कब्र; नरक
  rationale: मूल शब्द की अर्थ-सीमा न तो केवल भौतिक कब्र है और न बाद की धर्मवैज्ञानिक धारणा वाला ‘नरक’। लिप्यंतरण पुराने नियम की अवधारणात्मक विशिष्टता और तनाव को सुरक्षित रखता है।
- issue: אֵלֵי גִבּוֹרִים की पहचान
  choice: शिओल में पड़े प्रमुख मानव योद्धा
  alternative: वीरों के देवता; केवल बलवान योद्धा
  rationale: אֵלֵי का रूप ‘देवताओं’ के रूप में भी समझा जा सकता है, पर अध्याय का निकट प्रसंग गिरे हुए राष्ट्रों और योद्धाओं का वर्णन करता है। इसलिए मानव अगुओं का अर्थ अधिक प्रसंगानुकूल है, और दूसरी संभावना पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य रखी गई है। अपरिचित किंतु धर्मवैज्ञानिक रूप से विशिष्ट ‘शिओल’ को पादटिप्पणी से समझाया गया है। काव्यात्मक मृत्यु-दृश्य के लिए ‘नीचे उतर चुके हैं’ और ‘पड़े हैं’ जैसे सीधे, गंभीर पद चुने गए हैं।
