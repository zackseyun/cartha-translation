  text: שָׁ֣מָּ/ה אֱד֗וֹם מְלָכֶ֨י/הָ֙ וְ/כָל נְשִׂיאֶ֔י/הָ אֲשֶׁר נִתְּנ֥וּ בִ/גְבוּרָתָ֖/ם אֶת חַלְלֵי חָ֑רֶב הֵ֛מָּה אֶת עֲרֵלִ֥ים יִשְׁכָּ֖בוּ וְ/אֶת יֹ֥רְדֵי בֽוֹר־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/032/029.yaml
  text: There is Edom[a], her kings and all her princes, who were laid among those slain by the sword despite their might[b]. They lie with the uncircumcised and with those who go down to the pit.
translation:
  language: hi
  text: वहाँ एदोम है—उसके राजा और उसके सभी प्रधान, जो अपने पराक्रम सहित[a] तलवार से मारे गए लोगों के बीच रखे गए हैं। वे खतनारहित लोगों के साथ और गड्ढे[b] में उतरने वालों के साथ पड़े हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में ‘अपने पराक्रम सहित’ या ‘अपने पराक्रम में’; प्रसंग यह विडंबना सुझाता है कि उनका पराक्रम उन्हें पतन से नहीं बचा सका।
    reason: lexical_alternative
  - marker: b
    text: यहाँ ‘गड्ढा’ मृतकों के लोक या कब्र का एक सामान्य इब्रानी चित्र है।
    reason: cultural_note
lexical_decisions:
- source_word: שָׁמָּה
  choice: वहाँ ... है
  rationale: यह क्रियाविशेषण अधोलोक के दृश्य में एदोम की उपस्थिति की ओर संकेत करता है; यह रूप हिन्दी में स्वाभाविक रहते हुए उसके संकेतात्मक बल को बनाए रखता है।
- source_word: אֱדוֹם
  choice: एदोम
  rationale: इस राष्ट्र के नाम का हिन्दी में प्रचलित लिप्यंतरण।
- source_word: מְלָכֶיהָ וְכָל נְשִׂיאֶיהָ
  choice: उसके राजा और उसके सभी प्रधान
  rationale: स्त्रीलिंग प्रत्यय एदोम राष्ट्र को सूचित करता है। נְשִׂיאֶיהָ के लिए ‘प्रधान’ राजनीतिक नेतृत्व और ऊँचे शोकगीतात्मक स्तर को सहज हिन्दी में व्यक्त करता है।
- source_word: אֲשֶׁר נִתְּנוּ
  choice: जो ... रखे गए
  rationale: נתן का निफ़अल रूप कर्मवाच्य है; मृतकों के बीच रखे जाने के प्रसंग में यह उसके मूल अर्थ को स्पष्ट रूप से व्यक्त करता है।
- source_word: בִגְבוּרָתָם
  choice: अपने पराक्रम के बावजूद
  rationale: प्रसंग की विडंबना यह है कि उनका पराक्रम भी उन्हें तलवार से मृत्यु से न बचा सका। चूँकि בְּ का अधिक शाब्दिक अर्थ ‘अपने पराक्रम के साथ/में’ भी हो सकता है, विकल्प को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: אֶת חַלְלֵי חָרֶב
  choice: तलवार से मारे गए लोगों के बीच
  rationale: यह युद्ध अथवा हिंसक मृत्यु में तलवार से मारे गए लोगों के लिए प्रचलित इब्रानी अभिव्यक्ति है; ‘के बीच’ यहाँ मृतकों के साथ रखे जाने का संबंध स्वाभाविक हिन्दी में बताता है।
- source_word: עֲרֵלִים
  choice: खतनारहित लोग
  rationale: यह सीधा अनुवाद वाचा-संबंधी अर्थ और अपमान की भविष्यद्वक्तापूर्ण छाया—दोनों को बनाए रखता है।
- source_word: יִשְׁכָּבוּ
  choice: पड़े हैं
  rationale: अपूर्ण क्रिया यहाँ दर्शनीय वर्णन में उनकी वर्तमान मृत अवस्था बताती है; हिन्दी का पूर्ण वर्तमान दृश्य को स्वाभाविक रूप से व्यक्त करता है।
- source_word: וְאֶת יֹרְדֵי בוֹר
  choice: और गड्ढे में उतरने वालों के साथ
  rationale: ‘गड्ढा’ मृत्यु के लोक अथवा कब्र का चित्र है। रूपक को सीधे ‘कब्र’ कर देने के बजाय सुरक्षित रखा गया है।
theological_decisions:
- issue: न्याय की भविष्यवाणी में עֲרֵלִים का अर्थ
  choice: खतनारहित लोग
  alternative: अपमानित मृतक; अन्यजातियाँ
  rationale: मूल शब्द एदोम जैसे राष्ट्रों के विषय में वाचा से बाहर होने और मृत्यु में अपमान—दोनों की अर्थछाया रखता है। शाब्दिक पद इन तनावों को किसी एक व्याख्या में सीमित नहीं करता।
- issue: בִגְבוּרָתָם में पराक्रम और पतन का संबंध
  choice: अपने पराक्रम के बावजूद
  alternative: अपने पराक्रम के साथ; अपने पराक्रम में
  rationale: प्रसंग उनके सामर्थ्य के निष्फल होने की विडंबना उभारता है, पर इब्रानी संबंधबोधक उपसर्ग स्वयं concessive अर्थ को पूरी तरह निश्चित नहीं करता; इसलिए शाब्दिक संभावनाएँ पादटिप्पणी में दी गई हैं।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज शैली रखी गई है। ‘प्रधान’, ‘पराक्रम’, ‘खतनारहित’ और ‘गड्ढा’ मूल पाठ की राजनीतिक, वाचा-संबंधी और काव्यात्मक शब्दावली को बनाए रखते हैं; डैश शोकगीत में एदोम की ओर संकेत को स्पष्ट करता है।
