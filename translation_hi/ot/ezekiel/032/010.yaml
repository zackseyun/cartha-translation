reference: Ezekiel 32:10
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/הֲשִׁמּוֹתִ֨י עָלֶ֜י/ךָ עַמִּ֣ים רַבִּ֗ים וּ/מַלְכֵי/הֶם֙ יִשְׂעֲר֤וּ עָלֶ֨י/ךָ֙ שַׂ֔עַר בְּ/עוֹפְפִ֥/י חַרְבִּ֖/י עַל פְּנֵי/הֶ֑ם וְ/חָרְד֤וּ לִ/רְגָעִים֙ אִ֣ישׁ לְ/נַפְשׁ֔/וֹ בְּ/י֖וֹם מַפַּלְתֶּֽ/ךָ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/032/010.yaml
  text: I will make many peoples appalled at you[a], and their kings will shudder over you when I brandish my sword before them; and they will tremble every moment, each man for his own life[c][b], on the day of your downfall.
translation:
  language: hi
  text: मैं बहुत-सी जातियों को तेरे कारण स्तब्ध कर दूँगा[a], और उनके राजा तेरे कारण भय से काँप उठेंगे, जब मैं अपनी तलवार उनके सामने लहराऊँगा[b]। तेरे पतन के दिन वे पल-पल[c], हर एक अपने प्राण के लिए, थरथराएँगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “भयचकित कर दूँगा।”
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “जब मैं अपनी तलवार को उनके सामने उड़ाऊँगा।”
    reason: lexical_alternative
  - marker: c
    text: या “हर क्षण।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַהֲשִׁמּוֹתִי
  choice: स्तब्ध कर दूँगा
  rationale: हिफ़ील रूप यहाँ बहुत-सी जातियों को मिस्र की दशा पर भय और विस्मय से जड़ कर देने का भाव देता है। ‘स्तब्ध कर दूँगा’ विनाश और भय से उपजे आघात को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: עַמִּים רַבִּים
  choice: बहुत-सी जातियाँ
  rationale: עַמִּים सामूहिक जनसमुदायों को सूचित करता है; ‘जातियाँ’ आधुनिक राष्ट्र-राज्यों तक अर्थ को सीमित किए बिना इस सामूहिक भाव को बनाए रखता है।
- source_word: יִשְׂעֲרוּ ... שַׂעַר
  choice: भय से काँप उठेंगे
  rationale: धातु और उसी मूल की संज्ञा का मेल तीव्र आतंक व्यक्त करता है। हिन्दी में ‘भय से काँप उठेंगे’ उस तीव्र शारीरिक और भावात्मक प्रतिक्रिया को सहज रूप से रखता है।
- source_word: בְּעוֹפְפִי חַרְבִּי
  choice: जब मैं अपनी तलवार ... लहराऊँगा
  rationale: शाब्दिक चित्र तलवार को ‘उड़ाने’ का है, पर प्रसंग में तलवार चलाने या भाँजने का भाव है। ‘लहराऊँगा’ चित्रात्मकता और सहजता दोनों रखता है।
- source_word: עַל־פְּנֵיהֶם
  choice: उनके सामने
  rationale: यह स्थान-सूचक पद यहाँ लोगों की आँखों के सामने न्याय की तलवार प्रदर्शित होने का भाव देता है।
- source_word: לִרְגָעִים
  choice: पल-पल
  rationale: बहुवचन के साथ ל भय की बार-बार या हर क्षण होने वाली प्रतिक्रिया बताता है। ‘पल-पल’ संक्षिप्त और स्वाभाविक हिन्दी है।
- source_word: אִישׁ לְנַפְשׁוֹ
  choice: हर एक अपने प्राण के लिए
  rationale: वितरणात्मक एकवचन का अर्थ प्रत्येक व्यक्ति है, और נֶפֶשׁ इस जानलेवा प्रसंग में ‘प्राण/जीवन’ है। ‘हर एक’ मूल का व्यक्तिगत बल बनाए रखता है।
- source_word: בְּיוֹם מַפַּלְתֶּךָ
  choice: तेरे पतन के दिन
  rationale: מַפָּלָה न्याय के अधीन गिरावट या विनाशकारी पतन को दर्शाता है। ‘पतन’ इस अर्थ को गरिमापूर्ण और स्पष्ट हिन्दी में रखता है।
theological_decisions:
- issue: न्याय में परमेश्वर की प्रत्यक्ष भूमिका
  choice: वक्ता स्वयं जातियों को स्तब्ध करता और ‘अपनी तलवार’ उनके सामने लहराता है।
  alternative: तलवार को बाबेल जैसे किसी ऐतिहासिक माध्यम के द्वारा चलती हुई समझा जा सकता है।
  rationale: प्रथम पुरुष के क्रियारूप और ‘मेरी तलवार’ का प्रत्यय प्रत्यक्ष दैवी कर्तृत्व पर बल देते हैं। अनुवाद इसे बनाए रखता है, पर किसी ऐतिहासिक माध्यम की संभावना को न तो जोड़ता है, न नकारता है।
- issue: עָלֶיךָ का संबंध
  choice: दोनों स्थानों पर ‘तेरे कारण’
  alternative: ‘तुझे देखकर’ या ‘तेरी दशा पर’
  rationale: पूर्वसर्ग मिस्र के पतन को जातियों और राजाओं की प्रतिक्रिया का कारण या विषय बनाता है। ‘तेरे कारण’ मूल की व्यापकता को रखता है और दृश्य प्रतिक्रिया तक अर्थ को सीमित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। मिस्र को संबोधित इब्रानी पुल्लिंग एकवचन के अनुरूप ‘तेरे’ का प्रयोग किया गया है। ‘हर एक अपने प्राण के लिए’ मूल के वितरणात्मक बल को बनाए रखता है, जबकि वाक्य-विन्यास हिन्दी में स्वाभाविक है।
