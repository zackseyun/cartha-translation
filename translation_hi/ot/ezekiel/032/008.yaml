    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל מְאוֹרֵי אוֹר
  choice: सभी प्रकाशमान पिंडों
  rationale: शाब्दिक वाक्यांश ‘प्रकाश के प्रकाशकों’ का आशय आकाशीय प्रकाश-स्रोतों से है। ‘प्रकाशमान पिंड’ आधुनिक हिन्दी में स्वाभाविक है और सूर्य, चन्द्रमा तथा तारों जैसे आकाशीय प्रकाशकों को समेटता है।
- source_word: בַּשָּׁמַיִם
  choice: आकाश के
  rationale: यहाँ सृष्टिगत आकाशीय पिंडों का संदर्भ है; हिन्दी में ‘आकाश’ बहुवचन हिब्रू रूप का स्वाभाविक अर्थ देता है और ‘स्वर्ग’ से उत्पन्न धार्मिक स्थान-संबंधी भ्रम से बचाता है।
- source_word: אַקְדִּירֵם
  choice: अंधकारमय कर दूँगा
  rationale: 'क़दर धातु का हिफ़ील रूप कारणवाचक है: वक्ता उन प्रकाशकों को अंधकारमय करेगा।'
- source_word: עָלֶיךָ
  choice: तेरे ऊपर
  rationale: दूसरे पुरुष एकवचन संबोधन और ऊपर छा जाने वाले ब्रह्मांडीय अंधकार की छवि को बनाए रखता है।
- source_word: וְנָתַתִּי חֹשֶׁךְ עַל אַרְצְךָ
  choice: और तेरे देश पर अंधकार छा दूँगा
  rationale: शाब्दिक ‘अंधकार रख दूँगा’ हिन्दी में अस्वाभाविक है। ‘छा दूँगा’ נתן की कारक क्रिया और देश पर फैलते अंधकार की छवि दोनों को सहज रूप में व्यक्त करता है। אֶרֶץ यहाँ संबोधित शासक के भूभाग के अर्थ में ‘देश’ है।
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: प्रभु यहोवा की यह घोषणा है
  rationale: नְאֻם की गंभीर भविष्यद्वाणी-सूत्र शैली ‘घोषणा’ से व्यक्त होती है। अֲדֹנָי को ‘प्रभु’ और व्यक्तिनाम יהוה को प्रचलित हिन्दी रूप ‘यहोवा’ से अलग-अलग सुरक्षित रखा गया है।
theological_decisions:
- issue: अֲדֹנָי יְהוִה में परमेश्वर के नाम का अनुवाद
  choice: प्रभु यहोवा
  alternative: प्रभु याहवे / प्रभु परमेश्वर
  rationale: हिब्रू में उपाधि אֲדֹנָי और व्यक्तिगत नाम יהוה दोनों उपस्थित हैं। ‘प्रभु यहोवा’ दोनों को सुरक्षित रखता है और हिन्दी बाइबलीय पाठकों के लिए परिचित है; ‘प्रभु परमेश्वर’ नाम को उपाधि में बदल देता, जबकि ‘याहवे’ मूल उच्चारण की आधुनिक विद्वत्तापरक पुनर्रचना के निकट है।
