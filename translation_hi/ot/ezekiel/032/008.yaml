  text: All the lights of light in the heavens I will darken over you[a], and I will put darkness over your land, declares the Lord GOD.
translation:
  language: hi
  text: आकाश के सभी प्रकाशमान पिंडों[a] को मैं तेरे ऊपर अंधकारमय कर दूँगा, और तेरे देश पर अंधकार छा दूँगा—प्रभु यहोवा की यह घोषणा है।
  philosophy: optimal-equivalence
  footnotes:
