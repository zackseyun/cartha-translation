source:
  edition: WLC
  text: וַֽ/יְהִי֙ בִּ/שְׁתֵּ֣י עֶשְׂרֵ֣ה שָׁנָ֔ה בַּ/חֲמִשָּׁ֥ה עָשָׂ֖ר לַ/חֹ֑דֶשׁ הָיָ֥ה דְבַר יְהוָ֖ה אֵלַ֥/י לֵ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/032/017.yaml
  text: And it happened in the twelfth year[a], on the fifteenth day of the month, that the word of Yahweh came to me, saying,
translation:
  language: hi
  text: 'बारहवें वर्ष में, महीने के पंद्रहवें दिन, याहवे[a] का वचन मेरे पास पहुँचा:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में परमेश्वर का विशिष्ट नाम יהוה (YHWH) है; यहाँ उसका लिप्यंतरण ‘याहवे’ किया गया है।
    reason: divine_name
lexical_decisions:
- source_word: וַיְהִי
  choice: बारहवें वर्ष में…
  rationale: यह कथात्मक रूप दिनांकित भविष्यवाणी का परिचय देता है। हिन्दी में अलग से ‘और ऐसा हुआ’ कहना अनावश्यक और भारी लगता; दिनांक से सीधे आरम्भ करना उसी कथात्मक कार्य को स्वाभाविक रूप से व्यक्त करता है।
- source_word: בִּשְׁתֵּי עֶשְׂרֵה שָׁנָה
  choice: बारहवें वर्ष में
  rationale: यह सामान्य काल-निर्देशक पदबंध है; क्रमवाचक रूप आधुनिक हिन्दी में स्वाभाविक है।
- source_word: בַּחֲמִשָּׁה עָשָׂר לַחֹדֶשׁ
  choice: महीने के पंद्रहवें दिन
  rationale: मूल पाठ महीने का नाम या क्रमांक नहीं बताता। अनुवाद भी इस अनिर्दिष्टता को बनाए रखता है और निहित ‘दिन’ को स्पष्ट हिन्दी के लिए व्यक्त करता है।
- source_word: דְבַר יְהוָה
  choice: याहवे का वचन
  rationale: यह मानक भविष्यवाणी-सूत्र है। ‘वचन’ परमेश्वर से प्राप्त संदेश को गरिमापूर्ण और परिचित हिन्दी में व्यक्त करता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: मूल पाठ में आया परमेश्वर का विशिष्ट नाम लिप्यंतरित किया गया है, उसे किसी उपाधि से प्रतिस्थापित नहीं किया गया।
- source_word: אֵלַי
  choice: मेरे पास
  rationale: भविष्यवाणी-सूत्र में ‘वचन मेरे पास पहुँचा’ आधुनिक हिन्दी का स्वाभाविक प्रयोग है।
- source_word: לֵאמֹר
  choice: ':'
  rationale: इब्रानी ‘यह कहते हुए’ अगले प्रत्यक्ष संदेश का परिचय देता है। हिन्दी में द्विबिंदु वही कार्य संक्षिप्त और स्वाभाविक ढंग से करता है।
theological_decisions:
- issue: परमेश्वर के नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: विशिष्ट वाचा-नाम को नाम के रूप में बनाए रखने के लिए ‘याहवे’ चुना गया है। ‘प्रभु’ नाम को उपाधि में बदल देता, जबकि ‘यहोवा’ एक भिन्न पारंपरिक स्वरांकन को दर्शाता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। मूल पाठ में महीना निर्दिष्ट नहीं है, इसलिए अनुवाद ने कोई महीना नहीं जोड़ा। अगले वचन में आने वाले संदेश की भूमिका दिखाने के लिए अंत में द्विबिंदु रखा गया है।
