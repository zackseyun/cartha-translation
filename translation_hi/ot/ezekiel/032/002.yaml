source:
  edition: WLC
  text: בֶּן אָדָ֗ם שָׂ֤א קִינָה֙ עַל פַּרְעֹ֣ה מֶֽלֶךְ מִצְרַ֔יִם וְ/אָמַרְתָּ֣ אֵלָ֔י/ו כְּפִ֥יר גּוֹיִ֖ם נִדְמֵ֑יתָ וְ/אַתָּה֙ כַּ/תַּנִּ֣ים בַּ/יַּמִּ֔ים וַ/תָּ֣גַח בְּ/נַהֲרוֹתֶ֗י/ךָ וַ/תִּדְלַח מַ֨יִם֙ בְּ/רַגְלֶ֔י/ךָ וַ/תִּרְפֹּ֖ס נַהֲרוֹתָֽ/ם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/032/002.yaml
  text: 'Son of man[a], raise a lament over Pharaoh king of Egypt, and say to him: You compared yourself to a young lion among the nations, but you were like the monster in the seas; you burst forth in your rivers, and muddied the waters with your feet[c][b], and fouled their rivers.'
translation:
  language: hi
  text: हे मनुष्य के पुत्र, मिस्र के राजा फ़िरौन के लिए विलाप-गीत गा और उससे कह, ‘तू राष्ट्रों के बीच जवान सिंह के समान समझा गया था[a], पर तू समुद्रों के दैत्याकार जल-जीव के समान था। तू अपनी नदियों में उमड़ता था, अपने पैरों से पानी को मटमैला करता था और उनकी नदियों को रौंदता था[c]।’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तू अपने आपको राष्ट्रों के बीच जवान सिंह के समान समझता था।” हिब्रू क्रिया को निष्क्रिय अथवा आत्मवाचक अर्थ में समझा जा सकता है।
    reason: alternative_reading
  - marker: c
    text: हिब्रू क्रिया का मूल अर्थ “रौंदना” है। जल के इस बिंब में उसका परिणाम गंदा या दूषित करना भी हो सकता है; इसलिए इसका अनुवाद “उनकी नदियों को दूषित करता था” भी किया जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן אָדָם
  choice: हे मनुष्य के पुत्र
  rationale: यहेजकेल के लिए प्रयुक्त पारंपरिक हिब्रू संबोधन को बनाए रखता है और आधुनिक हिन्दी में स्पष्ट है।
- source_word: שָׂא קִינָה
  choice: विलाप-गीत छेड़
  rationale: किसी मृत्यु-विलाप को आरम्भ करने वाले भविष्यद्वाणी-संबंधी मुहावरे का स्वाभाविक और गरिमापूर्ण हिन्दी रूप।
- source_word: פַּרְעֹה מֶלֶךְ מִצְרַיִם
  choice: मिस्र के राजा फ़िरौन
  rationale: हिन्दी की स्वाभाविक पद-व्यवस्था में राजकीय उपाधि और देश-संबंध दोनों स्पष्ट करता है।
- source_word: כְּפִיר גּוֹיִם
  choice: राष्ट्रों के बीच जवान सिंह
  rationale: כְּפִיר की युवावस्था, शक्ति और हिंस्रता को व्यक्त करता है; संबंधवाचक हिब्रू को प्रसंगानुसार ‘के बीच’ से प्रस्तुत किया गया है।
- source_word: נִדְמֵיתָ
  choice: समझा गया था
  rationale: निफ़अल रूप का निष्क्रिय अर्थ मुख्य पाठ में सुरक्षित है; संभावित आत्मवाचक अर्थ को पादटिप्पणी में दिया गया है।
- source_word: כַּתַּנִּים בַּיַּמִּים
  choice: समुद्रों के विकराल जल-जीव के समान
  rationale: जलीय प्रसंग में תַּנִּים किसी बड़े, भयावह जलचर को दर्शाता है। ‘जल-जीव’ अनावश्यक पौराणिक निश्चितता से बचता है, जबकि ‘विकराल’ उसकी भयंकरता व्यक्त करता है।
- source_word: וַתָּגַח בְּנַהֲרוֹתֶיךָ
  choice: तू अपनी नदियों में उमड़ता था
  rationale: जल में हिंसक ढंग से आगे बढ़ने या फूट निकलने की गतिशील छवि को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וַתִּדְלַח מַיִם בְּרַגְלֶיךָ
  choice: अपने पैरों से पानी को मटमैला करता था
  rationale: דלח का पानी को गंदला या मटमैला करने का ठोस अर्थ सीधे और चित्रात्मक ढंग से देता है।
- source_word: וַתִּרְפֹּס נַהֲרוֹתָם
  choice: उनकी नदियों को रौंदता था
  rationale: רפס की रौंदने की मूल छवि और तीसरे पुरुष बहुवचन संबंधसूचक प्रत्यय ‘उनकी’ दोनों को सुरक्षित रखता है।
theological_decisions:
- issue: फ़िरौन के सिंह-सदृश होने के कथन में निष्क्रिय या आत्मवाचक अर्थ
  choice: तू ... समझा गया था
  alternative: तू अपने आपको ... समझता था
  rationale: हिब्रू निफ़अल दोनों अर्थों की अनुमति दे सकता है। मुख्य पाठ में व्याकरणतः सीधा निष्क्रिय अर्थ रखा गया है और ताने के प्रसंग में संभव आत्म-महिमामंडन को पादटिप्पणी में सुरक्षित किया गया है।
- issue: תַּנִּים की पहचान
  choice: विकराल जल-जीव
  alternative: अजगर / समुद्री दैत्य
  rationale: पाठ एक बड़े और भयावह जलीय प्राणी की छवि देता है, पर उसकी सटीक प्राणीवैज्ञानिक या पौराणिक पहचान निश्चित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण भविष्यद्वाणी-संबंधी रजिस्टर अपनाया गया है। वाक्य चित्रात्मक और मौखिक पठन के योग्य रखा गया है; कठिन हिब्रू बिंबों को सरल बनाने के बजाय आवश्यक अस्पष्टताएँ पादटिप्पणियों में सुरक्षित हैं।
