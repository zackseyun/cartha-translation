source:
  edition: WLC
  text: וְ/הִ֨כְעַסְתִּ֔י לֵ֖ב עַמִּ֣ים רַבִּ֑ים בַּ/הֲבִיאִ֤/י שִׁבְרְ/ךָ֙ בַּ/גּוֹיִ֔ם עַל אֲרָצ֖וֹת אֲשֶׁ֥ר לֹֽא יְדַעְתָּֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/032/009.yaml
  text: And I will trouble the hearts of many peoples when I bring your ruin among the nations[c][b][a], into lands that you have not known.
translation:
  language: hi
  text: और जब मैं तुम्हारा विनाश[b] राष्ट्रों के बीच और उन देशों में पहुँचा दूँगा[c] जिन्हें तुम नहीं जानते, तब मैं अनेक लोगों के मन व्याकुल कर दूँगा[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘अनेक लोगों के मन क्रोधित कर दूँगा,’ अथवा ‘अनेक लोगों के मन दुःखी कर दूँगा।’
    reason: lexical_alternative
  - marker: b
    text: या ‘तुम्हारी बरबादी।’ इब्रानी शब्द टूटने, ध्वंस या विनाश का अर्थ दे सकता है।
    reason: lexical_alternative
  - marker: c
    text: या ‘उन देशों तक पहुँचा दूँगा जिन्हें तुम नहीं जानते।’ यह वाक्यांश तुम्हारे लिए अपरिचित विदेशी देशों की ओर संकेत करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִכְעַסְתִּי
  choice: मैं ... मन व्याकुल कर दूँगा
  rationale: כעס के हिफ़इल रूप में क्रोधित करने, दुःखी करने या भीतर से अशांत करने का भाव हो सकता है। यहाँ לֵב (‘मन/हृदय’) कर्म होने के कारण ‘व्याकुल कर दूँगा’ इस व्यापक भाव को स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: לֵב
  choice: मन
  rationale: इब्रानी में शब्द एकवचन है, पर ‘बहुत-से जनसमूहों’ के साथ इसका सामूहिक अर्थ है। आधुनिक हिन्दी में ‘के मन’ इस सामूहिक प्रयोग को सहज ढंग से व्यक्त करता है।
- source_word: עַמִּים רַבִּים
  choice: बहुत-से जनसमूहों
  rationale: ‘जनसमूहों’ से עַמִּים का जातीय-सामुदायिक अर्थ व्यक्त होता है और आगे आए גּוֹיִם (‘जाति-जाति’) से कुछ lexical भेद भी बना रहता है।
- source_word: בַּהֲבִיאִי
  choice: जब मैं ... पहुँचा दूँगा
  rationale: בְּ के साथ infinitive construct यहाँ समय-सूचक परिस्थिति बताता है। ‘जब’ स्वाभाविक हिन्दी में वही संबंध स्पष्ट करता है।
- source_word: שִׁבְרְךָ
  choice: तुम्हारा विनाश
  rationale: שֶׁבֶר टूटने, ध्वंस, विपत्ति या बरबादी का बोध करा सकता है। न्याय-संदर्भ में ‘विनाश’ स्पष्ट है, जबकि वैकल्पिक अर्थ पादटिप्पणी में सुरक्षित है।
- source_word: בַּגּוֹיִם
  choice: जाति-जाति के बीच
  rationale: यह पद अन्य जातियों के बीच मिस्र के विनाश के प्रकट या प्रसिद्ध किए जाने को दर्शाता है। ‘जाति-जाति के बीच’ हिन्दी बाइबलीय गरिमा रखते हुए सामान्य पाठक के लिए बोधगम्य है।
- source_word: עַל אֲרָצוֹת
  choice: उन देशों में
  rationale: עַל का मूल स्थानिक भाव ‘पर/ऊपर’ हो सकता है, पर यहाँ पहुँचाने की गति के साथ विदेशी भूभागों तक विस्तार का अर्थ बनता है; इसलिए ‘देशों में’ स्वाभाविक है।
- source_word: אֲשֶׁר לֹא יְדַעְתָּם
  choice: जिन्हें तुम नहीं जानते
  rationale: יָדַע यहाँ परिचय या अनुभवगत जानकारी को सूचित करता है। हिन्दी वर्तमान रूप मूल के स्थायी-अपरिचय के भाव को संक्षेप में रखता है।
theological_decisions:
- issue: अन्य जनसमूहों पर परमेश्वर के न्याय का भावनात्मक प्रभाव
  choice: परमेश्वर बहुत-से जनसमूहों के मनों में व्यापक व्याकुलता उत्पन्न करेगा।
  alternative: वह उन्हें क्रोधित करेगा या शोक से भर देगा।
  rationale: כעס क्रोध, दुःख और बेचैनी के परस्पर जुड़े अर्थ दे सकता है। ‘मन व्याकुल कर दूँगा’ किसी एक भाव को अनावश्यक रूप से निर्णायक बनाए बिना भीतरी अशांति को व्यक्त करता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘जनसमूहों’ और ‘जाति-जाति’ द्वारा עַמִּים तथा גּוֹיִם के बीच उपलब्ध अर्थगत भेद बनाए रखने का प्रयास किया गया है। वाक्य-क्रम हिन्दी की स्वाभाविकता के अनुसार रखा गया है, जबकि मूल का समय-संबंध और भावनात्मक अस्पष्टता सुरक्षित है।
