  text: אוֹתָ/ם֙ יִרְאֶ֣ה פַרְעֹ֔ה וְ/נִחַ֖ם עַל כָּל המונ/ה חַלְלֵי חֶ֨רֶב֙ פַּרְעֹ֣ה וְ/כָל חֵיל֔/וֹ נְאֻ֖ם אֲדֹנָ֥/י יְהוִֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/032/031.yaml
  text: Pharaoh will see them and be comforted over all his multitude[a], Pharaoh and all his army, slain by the sword, declares the Lord GOD.
translation:
  language: hi
  text: फ़िरौन उन्हें देखेगा और तलवार से मारे गए अपने सारे जनसमूह को लेकर सांत्वना पाएगा[a]—फ़िरौन और उसकी सारी सेना। यह प्रभु यहोवा की घोषणा है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “दिलासा पाएगा” अथवा “सांत्वना लेगा।” इब्रानी क्रिया का दूसरे प्रसंगों में अर्थ “खेद करना” या “मन बदलना” भी हो सकता है; यहाँ संभवतः आशय यह है कि फ़िरौन दूसरों को भी अपने जैसा पतन भोगते देखकर एक भयावह सांत्वना पाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אוֹתָם
  choice: उन्हें
  rationale: यह बहुवचन कर्मवाचक सर्वनाम पिछले प्रसंग में अधोलोक में वर्णित जातियों और उनके शासकों की ओर संकेत करता है।
- source_word: יִרְאֶה
  choice: देखेगा
  rationale: अपूर्ण क्रिया यहाँ भविष्यसूचक प्रसंग में भावी अर्थ रखती है।
- source_word: וְנִחַם
  choice: और ... सांत्वना पाएगा
  rationale: इस प्रसंग में क्रिया का अर्थ दूसरों को भी वही विनाश भोगते देखकर मिलने वाली भयावह या विडंबनापूर्ण सांत्वना है; फिर भी इसके व्यापक अर्थ-क्षेत्र को पादटिप्पणी में बताया गया है।
- source_word: עַל כָּל הֲמוֹנוֹ
  choice: अपनी सारी भीड़ के विषय में
  rationale: עַל को נחם के साथ विषय या प्रसंग के अर्थ में लिया गया है। הָמוֹן फ़िरौन के लोगों या विशाल जनसमूह के लिए व्यापक शब्द है, इसलिए 'भीड़' उपयुक्त है।
- source_word: חַלְלֵי חֶרֶב
  choice: जो तलवार से मारे गए हैं
  rationale: यह युद्ध में हिंसक मृत्यु का मानक इब्रानी पदबंध है; हिन्दी में स्वाभाविक और स्पष्ट रूप रखा गया है।
- source_word: פַּרְעֹה וְכָל חֵילוֹ
  choice: फ़िरौन और उसकी सारी सेना
  rationale: חַיִל यहाँ सैन्य बल को सूचित करता है, जिसके लिए आधुनिक हिन्दी में 'सेना' स्पष्ट है।
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: यह प्रभु यहोवा की घोषणा है
  rationale: נְאֻם को भविष्यवाणी की औपचारिक घोषणा के रूप में और יהוה को उसके व्यक्तिगत वाचा-नाम 'यहोवा' से प्रस्तुत किया गया है।
theological_decisions:
- issue: וְנִחַם में सांत्वना और खेद/पछतावे के बीच अर्थ-संभावना
  choice: सांत्वना पाएगा
  alternative: खेद करेगा / पछताएगा
  rationale: अधोलोक में अन्य गिरे हुए समुदायों को देखने का निकट संदर्भ विडंबनापूर्ण सांत्वना के अर्थ को अधिक अनुकूल बनाता है, पर वैकल्पिक अर्थ-क्षेत्र पादटिप्पणी में सुरक्षित रखा गया है।
- issue: אֲדֹנָי יְהוִה में परमेश्वर के नाम का रूप
  choice: प्रभु यहोवा
  alternative: प्रभु परमेश्वर
  rationale: मूल में יהוה नाम प्रत्यक्ष है; 'यहोवा' उसे सामान्य पदवी में विलीन किए बिना हिन्दी पाठक के लिए परिचित रूप में सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, स्पष्ट शैली रखी गई है। 'सांत्वना पाएगा' मूल की गंभीर विडंबना को बनाए रखता है; डैश से यह स्पष्ट किया गया है कि तलवार से मारे गए लोगों में फ़िरौन और उसकी सेना सम्मिलित हैं।
