reference: Ezekiel 32:28
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/אַתָּ֗ה בְּ/ת֧וֹךְ עֲרֵלִ֛ים תִּשָּׁבַ֥ר וְ/תִשְׁכַּ֖ב אֶת חַלְלֵי חָֽרֶב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/032/028.yaml
  text: But you[a], in the midst of the uncircumcised, will be broken and will lie with those slain by the sword.
translation:
  language: hi
  text: पर तू खतनारहित लोगों के बीच चूर-चूर किया जाएगा और तलवार से मारे गए लोगों[a] के साथ लेटेगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अधिक शाब्दिक रूप से, “तलवार के मारे हुओं के साथ।”
    reason: इब्रानी ‘तलवार के मारे हुए’ का संक्षिप्त पद प्रयोग करता है; मुख्य पाठ उसी अर्थ को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
lexical_decisions:
- source_word: וְאַתָּה
  choice: पर तू
  rationale: संयोजक के साथ स्वतंत्र सर्वनाम सीधे और जोरदार संबोधन को दिखाता है तथा पिछले राष्ट्रों से फिरौन/मिस्र की ओर लौटता है। प्रसंग में ‘पर तू’ इस विरोधात्मक परिवर्तन को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: בְּתוֹךְ
  choice: के बीच
  rationale: यह किसी समूह के मध्य या उनमें सम्मिलित होने का भाव देता है। ‘के बीच’ आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: עֲרֵלִים
  choice: खतनारहित लोगों
  rationale: मूल शब्द का सीधा अर्थ ‘जिनका खतना नहीं हुआ’ है। यहेजकेल 32 में यह मृत्यु में अपमान का सूचक है; इसे ‘अशुद्ध’ या ‘भक्तिहीन’ कहना मूल की सांस्कृतिक-वाचाई छवि का अर्थ-विस्तार कर देता।
- source_word: תִּשָּׁבַר
  choice: चकनाचूर किया जाएगा
  rationale: शबर का निफ़अल रूप यहाँ पराजय और विनाश का निष्क्रिय भाव रखता है। ‘चकनाचूर किया जाएगा’ तीव्रता और न्याय की काव्यात्मक छवि को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וְתִשְׁכַּב
  choice: और ... पड़ा रहेगा
  rationale: शכב मृत्यु या कब्र में पड़े होने के लिए प्रयुक्त हो सकता है। ‘पड़ा रहेगा’ आगे आने वाले मृतकों के साथ स्थायी संगति का भाव स्पष्ट करता है, बिना मृत्यु की छवि को समझाकर बदलने के।
- source_word: אֶת חַלְלֵי חָרֶב
  choice: तलवार से मारे गए लोगों के साथ
  rationale: इस प्रसंग में אֶת सहवर्ती अर्थ देता है—उन मृतकों के साथ लेटना। हिन्दी वाक्यांश मूल की हिंसक मृत्यु की छवि बनाए रखते हुए सामान्य पाठक के लिए सहज है।
theological_decisions:
- issue: राष्ट्रों के विरुद्ध विलाप में עֲרֵלִים का आशय
  choice: शारीरिक और वाचाई-सांस्कृतिक पद ‘खतनारहित’ को बनाए रखना
  alternative: ‘अशुद्ध’, ‘भक्तिहीन’ या ‘अन्यजाति’
  rationale: इब्रानी पाठ स्पष्ट रूप से खतना न होने का पद इस्तेमाल करता है। यहाँ यह राष्ट्रों के बीच मृत्यु और अपमान की छवि बनाता है; सामान्यीकृत धार्मिक लेबल मूल पाठ से अधिक व्याख्या जोड़ेंगे।
- issue: תִּשָּׁבַר में विनाश की तीव्रता
  choice: ‘चकनाचूर किया जाएगा’
  alternative: ‘तोड़ा जाएगा’
  rationale: दोनों अर्थ सम्भव हैं, पर व्यक्ति/राष्ट्र की पराजय के इस काव्यात्मक प्रसंग में ‘चकनाचूर’ हिन्दी में अधिक स्वाभाविक और शबर के विध्वंसकारी बल के अनुरूप है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में है, पर भविष्यद्वाणी के गंभीर और काव्यात्मक स्वर को बनाए रखती है। एकवचन ‘तू’ मूल के सीधे, द्वितीय पुरुष पुल्लिंग संबोधन को सुरक्षित रखता है; यहाँ यह फिरौन/मिस्र को संबोधित करता है और अनादर जोड़ने के लिए नहीं चुना गया।
