source:
  edition: WLC
  text: אֲשֶׁ֨ר נִתְּנ֤וּ קִבְרֹתֶ֨י/הָ֙ בְּ/יַרְכְּתֵי ב֔וֹר וַ/יְהִ֣י קְהָלָ֔/הּ סְבִיב֖וֹת קְבֻרָתָ֑/הּ כֻּלָּ֤/ם חֲלָלִים֙ נֹפְלִ֣ים בַּ/חֶ֔רֶב אֲשֶׁר נָתְנ֥וּ חִתִּ֖ית בְּ/אֶ֥רֶץ חַיִּֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/032/023.yaml
  text: whose graves were set in the remotest parts of the pit[a], and her assembly was around her grave—all of them slain, fallen by the sword[b], who spread terror in the land of the living.
translation:
  language: hi
  text: जिसकी कब्रें गड्ढे के सुदूर भागों में रखी गई थीं[a], और उसका समुदाय उसकी कब्र के चारों ओर था—वे सब तलवार से मारे गए थे, जिन्होंने जीवितों के देश में आतंक फैलाया था[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “गड्ढे के भीतरी कोनों में।”
    reason: lexical_alternative
  - marker: b
    text: या, “जिन्होंने जीवितों के देश में आतंक उत्पन्न किया था।”
    reason: lexical_alternative
lexical_decisions:
- source_word: נִתְּנוּ
  choice: बनाई गईं
  rationale: निफ़अल रूप यहाँ कब्रों के रखे या निर्धारित किए जाने को दर्शाता है; हिन्दी में कब्रों के लिए ‘बनाई गईं’ स्वाभाविक निष्क्रिय अभिव्यक्ति है।
- source_word: קִבְרֹתֶיהָ
  choice: उसकी कब्रें
  rationale: स्त्रीलिंग एकवचन प्रत्यय संदर्भित राष्ट्र या समुदाय के मानवीकरण को बनाए रखता है।
- source_word: בְּיַרְכְּתֵי בוֹר
  choice: गड्ढे के सबसे दूर के हिस्सों में
  rationale: יַרְכְּתֵי दूरस्थ छोरों या भीतरी हिस्सों को सूचित करता है; בוֹר को ‘गड्ढा’ रखने से मूल अधोलोक/दफ़न-चित्र सुरक्षित रहता है।
- source_word: קְהָלָהּ
  choice: उसका सारा समुदाय
  rationale: קהל एक एकत्र समूह या समुदाय है; ‘समुदाय’ आधुनिक हिन्दी में स्वाभाविक है, और प्रसंगानुसार ‘सारा’ सामूहिक अर्थ स्पष्ट करता है।
- source_word: סְבִיבוֹת קְבֻרָתָהּ
  choice: उसकी कब्र के चारों ओर
  rationale: यह स्थान-सूचक वाक्यांश का सीधा और सहज हिन्दी रूप है।
- source_word: כֻּלָּם חֲלָלִים
  choice: वे सब मारे गए थे
  rationale: חֲלָלִים हिंसक मृत्यु, विशेषकर युद्ध में मारे गए लोगों, को दर्शाता है; ‘मारे गए’ इस भाव को स्पष्ट रखता है।
- source_word: נֹפְלִים בַּחֶרֶב
  choice: तलवार से गिरे हुए
  rationale: प्रतिभागी रूप यहाँ मारे गए लोगों का विशेषणवत वर्णन करता है; यह रूप युद्ध-संबंधी बिंब को बनाए रखता है।
- source_word: נָתְנוּ חִתִּית
  choice: आतंक फैलाया था
  rationale: נתן + חִתִּית मुहावरे का अर्थ आतंक उत्पन्न या फैलाना है; यह हिन्दी में स्वाभाविक और प्रभाव-केंद्रित अभिव्यक्ति है।
- source_word: בְּאֶרֶץ חַיִּים
  choice: जीवितों के देश में
  rationale: यह जीवित संसार और मृतकों के गड्ढे के बीच विरोध दिखाने वाला पारंपरिक इब्रानी वाक्यांश है।
theological_decisions:
- issue: राष्ट्र या सत्ता का स्त्रीलिंग मानवीकरण
  choice: स्त्रीलिंग प्रत्ययों को ‘उसकी’ से व्यक्त किया गया
  alternative: राजनीतिक इकाई पर बल देने के लिए नपुंसक या निर्जीव ढंग से अनुवाद करना
  rationale: इब्रानी स्त्रीलिंग एकवचन प्रत्यय भविष्यद्वाणी के मानवीकरण को बनाए रखते हैं; हिन्दी में ‘उसकी’ लिंग को अलग से निर्धारित किए बिना इसी संबंध को स्वाभाविक रूप से व्यक्त करता है।
- issue: בוֹר का अधोलोक-संबंधी चित्र
  choice: ‘गड्ढा’
  alternative: ‘अधोलोक’ या ‘कब्र’
  rationale: मूल शब्द בוֹר है, שְׁאוֹל नहीं; इसलिए ‘गड्ढा’ मूल चित्र को बचाता है और उससे अधिक विशिष्ट धर्मवैज्ञानिक अर्थ नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। युद्ध और दफ़न के मूल बिंबों को बनाए रखते हुए अत्यधिक पुरातन शब्दावली से बचा गया है।
