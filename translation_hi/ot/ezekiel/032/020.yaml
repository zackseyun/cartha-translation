base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/032/020.yaml
  text: They will fall among those slain by the sword[a]. The sword is given; drag her away[b], and all her multitude.
translation:
  language: hi
  text: वे तलवार से मारे गए लोगों के बीच गिरेंगे। तलवार दे दी गई है[a]; उसे[b] और उसकी सारी भीड़ को घसीट ले जाओ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तलवार ठहरा दी गई है।” इब्रानी खंड बहुत संक्षिप्त है और इसका भाव यह हो सकता है कि न्याय के लिए तलवार नियुक्त कर दी गई है।
    reason: alternative_reading
  - marker: b
    text: अर्थात मिस्र को स्त्री के रूप में चित्रित किया गया है; उसे उसके सभी लोगों समेत ले जाया जाएगा।
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּתוֹךְ
  choice: के बीच
  rationale: यह मुहावरेदार हिन्दी में किसी समूह के मध्य और उसी में गिने जाने का भाव व्यक्त करता है।
- source_word: חַלְלֵי חֶרֶב
  choice: तलवार से मारे गए लोग
  rationale: यह युद्ध में तलवार से घायल होकर मारे गए लोगों को स्वाभाविक और स्पष्ट हिन्दी में व्यक्त करता है।
- source_word: יִפֹּלוּ
  choice: गिरेंगे
  rationale: संदर्भ में अपूर्ण क्रिया भविष्यसूचक है; ‘गिरेंगे’ भविष्यवाणी की शक्ति बनाए रखता है।
- source_word: חֶרֶב נִתָּנָה
  choice: तलवार दे दी गई है
  rationale: इब्रानी वाक्यांश संक्षिप्त और कुछ अस्पष्ट है। अपेक्षाकृत शाब्दिक अनुवाद उसकी अचानक आने वाली न्याय-वाणी और वास्तविक व्याख्यात्मक तनाव को बनाए रखता है।
- source_word: מָשְׁכוּ
  choice: घसीट ले जाओ
  rationale: बहुवचन आज्ञार्थक क्रिया बलपूर्वक खींचकर ले जाने का संकेत देती है; अधोलोक की ओर ले जाए जाने के संदर्भ में ‘घसीट’ उपयुक्त है।
- source_word: אוֹתָהּ
  choice: उसे
  rationale: स्त्रीलिंग एकवचन सर्वनाम का सबसे स्वाभाविक संदर्भ स्त्री के रूप में चित्रित मिस्र है; हिन्दी ‘उसे’ अनावश्यक व्याख्या जोड़े बिना इसे व्यक्त करता है।
- source_word: וְכָל הֲמוֹנֶיהָ
  choice: और उसकी सारी भीड़
  rationale: वाव को ‘और’ से स्पष्ट रूप से रखा गया है। ‘भीड़’ हामोन के विशाल जनसमूह के भाव को बनाए रखती है और उसे केवल सेना तक सीमित नहीं करती।
theological_decisions:
- issue: आज्ञार्थक खंड में स्त्रीलिंग सर्वनाम का संदर्भ
  choice: ‘उसे’ से स्त्री के रूप में चित्रित मिस्र समझा गया है।
  alternative: इसे किसी अमूर्त वस्तु अथवा कठिन वाक्य-विन्यास में तलवार से संबंधित माना जा सकता है।
  rationale: आस-पास का संदर्भ फ़िरौन और मिस्र पर केंद्रित है तथा राष्ट्र का मानवीकरण करता है। फिर भी मुख्य पाठ में ‘मिस्र’ जोड़कर अर्थ को आवश्यकता से अधिक निश्चित नहीं किया गया।
- issue: संक्षिप्त खंड חֶרֶב נִתָּנָה का अर्थ
  choice: ‘तलवार दे दी गई है’
  alternative: ‘तलवार ठहरा दी गई है’ अथवा ‘तलवार सौंप दी गई है’
  rationale: इब्रानी अत्यंत संक्षिप्त और अर्थ की दृष्टि से तनावपूर्ण है। शाब्दिक रूप उस अस्पष्टता को सुरक्षित रखता है और न्याय के लिए नियुक्त किए जाने की व्याख्या को पादटिप्पणी में देता है।
translation_notes:
