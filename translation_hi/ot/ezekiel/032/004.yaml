id: EZK.32.4
reference: Ezekiel 32:4
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וּ/נְטַשְׁתִּ֣י/ךָ בָ/אָ֔רֶץ עַל פְּנֵ֥י הַ/שָּׂדֶ֖ה אֲטִילֶ֑/ךָ וְ/הִשְׁכַּנְתִּ֤י עָלֶ֨י/ךָ֙ כָּל ע֣וֹף הַ/שָּׁמַ֔יִם וְ/הִשְׂבַּעְתִּ֥י מִמְּ/ךָ֖ חַיַּ֥ת כָּל הָ/אָֽרֶץ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/032/004.yaml
  text: I will cast you onto the land[a]; I will throw you down on the open field, and I will cause every bird of the heavens to settle on you[b], and I will satisfy the beasts of all the earth with you.
translation:
  language: hi
  text: मैं तुझे भूमि पर फेंक दूँगा[a]; खुले मैदान में तुझे पटक दूँगा। मैं आकाश के सब पक्षियों को तुझ पर आ बैठाऊँगा, और सारी धरती के जंगली पशुओं को तुझसे तृप्त करूँगा[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मैं तुझे भूमि पर छोड़ दूँगा।” इब्रानी क्रिया का अर्थ छोड़ देना, त्याग देना या फेंक देना हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “मैं तुझसे सारी धरती के जंगली पशुओं को तृप्त करूँगा”; अर्थात वे तुझे खाकर भरपेट होंगे।
    reason: lexical_alternative
lexical_decisions:
- source_word: וּנְטַשְׁתִּיךָ
  choice: मैं तुझे भूमि पर फेंक दूँगा
  rationale: נטשׁ छोड़ देने, त्यागने या फेंक देने का अर्थ दे सकता है। अगले खंड में खुले मैदान में पटकने और शवभक्षियों के लिए छोड़ने के चित्र के कारण यहाँ हिंसक परित्याग व्यक्त करने वाला ‘फेंक दूँगा’ उपयुक्त है; वैकल्पिक अर्थ पादटिप्पणी में रखा गया है।
- source_word: בָאָרֶץ
  choice: भूमि पर
  rationale: यहाँ אֶרֶץ को अगले समानांतर वाक्यांश ‘खुले मैदान में’ से स्थानीय स्थल का अर्थ मिलता है, इसलिए ‘भूमि’ स्वाभाविक है।
- source_word: עַל־פְּנֵי הַשָּׂדֶה
  choice: खुले मैदान में
  rationale: शाब्दिक ‘मैदान की सतह पर’ के बजाय यह अभिव्यक्ति खुले में पड़े और सबके सामने उजागर शरीर का चित्र स्वाभाविक हिन्दी में देती है।
- source_word: אֲטִילֶךָ
  choice: तुझे पटक दूँगा
  rationale: טול का हिफ़ील रूप फेंकने या पटकने का भाव रखता है। ‘पटक दूँगा’ बलपूर्वक नीचे गिराने की छवि बनाए रखता है और पहले खंड के ‘फेंक दूँगा’ की अनावश्यक पुनरावृत्ति से बचाता है।
- source_word: וְהִשְׁכַּנְתִּי עָלֶיךָ
  choice: तुझ पर आ बैठाऊँगा
  rationale: שׁכן का कारक रूप बसाने या ठहराने का अर्थ देता है। शव पर उतरते पक्षियों के प्रसंग में ‘आ बैठाऊँगा’ स्पष्ट और स्वाभाविक है।
- source_word: כָּל עוֹף הַשָּׁמַיִם
  choice: आकाश के सब पक्षियों
  rationale: עוֹף सामूहिक रूप से उड़ने वाले जीवों, सामान्यतः पक्षियों, को सूचित करता है। ‘आकाश के सब पक्षी’ वर्तमान हिन्दी में सहज है और इब्रानी संबंध-विन्यास को बनाए रखता है।
- source_word: וְהִשְׂבַּעְתִּי
  choice: तृप्त करूँगा
  rationale: שׂבע का हिफ़ील रूप भरपूर करके संतुष्ट करने का अर्थ देता है। ‘तृप्त करूँगा’ खाने से पेट भरने का भाव और भविष्यद्वाणी की गरिमा दोनों रखता है।
- source_word: מִמְּךָ
  choice: तुझसे
  rationale: इब्रानी में शाब्दिक अर्थ ‘तुझसे’ है, अर्थात पशु उसे खाकर तृप्त होंगे। हिन्दी में यही रूप स्वाभाविक रहते हुए स्रोत की संरचना और भयानक संकेत दोनों को सुरक्षित रखता है।
- source_word: חַיַּת כָּל הָאָרֶץ
  choice: सारी धरती के जंगली पशुओं
  rationale: חַיָּה इस शवभक्षी प्रसंग में जंगली पशुओं को सूचित करता है। ‘सारी धरती के’ व्यापक इब्रानी अभिव्यक्ति को बनाए रखता है।
theological_decisions:
- issue: न्याय-वाणी में אֶרֶץ और הָאָרֶץ का क्षेत्र
  choice: पहले प्रयोग को ‘भूमि’ और अंतिम व्यापक पद को ‘सारी धरती’
  alternative: दोनों स्थानों पर ‘भूमि’ अथवा दोनों पर ‘धरती’
  rationale: पहला प्रयोग ‘खुले मैदान’ के समानांतर होने से स्थानीय स्थल बताता है, जबकि अंतिम पद व्यापक, सर्वसमावेशी चित्र प्रस्तुत करता है। यह प्रसंगगत-शाब्दिक निर्णय है और पाठ के व्यापक प्रभाव को बिना सिद्धान्तगत विस्तार के सुरक्षित रखता है।
- issue: मृत शरीर को पशु-पक्षियों का आहार बनाए जाने का संकेत
  choice: मुख्य पाठ में ‘तुझसे तृप्त करूँगा’ रखकर भोजन करने का आशय पादटिप्पणी में स्पष्ट करना
  alternative: मुख्य पाठ में सीधे ‘तुझे खिलाकर उनका पेट भरूँगा’ कहना
  rationale: इब्रानी की संक्षिप्त और कठोर रूपकात्मक अभिव्यक्ति को मुख्य पाठ में बनाए रखना बेहतर है; पादटिप्पणी उसके निहित अर्थ को स्पष्ट करती है, बिना मूल से अधिक व्याख्यात्मक हुए।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण भविष्यद्वाणी-शैली रखी गई है। ‘तू’ के रूप उस एकवचन संबोधित पात्र के प्रति दैवी न्याय की सीधी और तीखी वाणी को बनाए रखते हैं। शब्दावली सामान्य पाठक के लिए स्पष्ट है, जबकि ‘तृप्त’ जैसे पद काव्यात्मक गंभीरता सुरक्षित रखते हैं।
