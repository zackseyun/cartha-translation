source:
  edition: WLC
  text: כִּֽי נָתַ֥תִּי אֶת חתית/ו בְּ/אֶ֣רֶץ חַיִּ֑ים וְ/הֻשְׁכַּב֩ בְּ/ת֨וֹךְ עֲרֵלִ֜ים אֶת חַלְלֵי חֶ֗רֶב פַּרְעֹה֙ וְ/כָל הֲמוֹנֹ֔/ה נְאֻ֖ם אֲדֹנָ֥/י יְהוִֽה־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/032/032.yaml
  text: For I put his terror in the land of the living[a], and he will be laid among the uncircumcised, with those slain by the sword—Pharaoh and all his multitude, declares the Lord GOD.
translation:
  language: hi
  text: क्योंकि मैंने जीवितों के देश में उसका आतंक रखा है[a]; और वह खतनारहित लोगों के बीच, तलवार से मारे गए लोगों के साथ लिटाया जाएगा—फ़िरौन और उसका सारा जनसमूह। प्रभु यहोवा की घोषणा है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'कुछ प्राचीन पाठ-साक्षियों के अनुसार: “जीवितों के देश में मेरा आतंक।” यहाँ इब्रानी पाठ में “उसका आतंक” है।'
    reason: textual_variant
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले कथन का कारण या स्पष्टीकरण प्रस्तुत करता है; आधुनिक हिन्दी में ‘क्योंकि’ इसका स्वाभाविक संयोजक है।
- source_word: נָתַתִּי
  choice: मैंने ... फैला दिया था
  rationale: נתן का मूल अर्थ ‘देना/रखना’ है, पर आतंक को किसी क्षेत्र में रखने का आशय वहाँ आतंक उत्पन्न या व्याप्त करना है; ‘फैला दिया था’ हिन्दी में स्वाभाविक रहते हुए उस प्रभाव को व्यक्त करता है।
- source_word: חֲתִיתוֹ
  choice: उसका आतंक
  rationale: मसोरेटी पाठ का तृतीय पुरुष एकवचन प्रत्यय ‘उसका’ बताता है, जो फ़िरौन से संबंधित है। संज्ञा भय या आतंक को सूचित करती है।
- source_word: בְּאֶרֶץ חַיִּים
  choice: जीवितों के देश में
  rationale: यह मृतकों के लोक के विपरीत जीवित मनुष्यों के क्षेत्र के लिए प्रयुक्त इब्रानी अभिव्यक्ति है; शाब्दिक रूप और विरोध दोनों सुरक्षित रहते हैं।
- source_word: וְהֻשְׁכַּב
  choice: और वह ... लिटाया जाएगा
  rationale: שׁכב का होफ़ाल रूप कर्मवाच्य है—‘लिटाया जाएगा’; यह मृत्यु में अन्य मारे गए लोगों के बीच रखे जाने का चित्र बनाए रखता है।
- source_word: בְּתוֹךְ עֲרֵלִים
  choice: खतनारहित लोगों के बीच
  rationale: עֲרֵלִים का शाब्दिक अर्थ ‘खतनारहित लोग’ है। यह यहेजकेल में वाचा से बाहर होने और मृत्यु में अपमान का भार रखता है, जिसे सामान्यीकृत नहीं किया गया।
- source_word: אֶת חַלְלֵי חֶרֶב
  choice: तलवार से मारे गए लोगों के साथ
  rationale: यहाँ אֶת साहचर्य दर्शाता है और חַלְלֵי חֶרֶב तलवार से घात किए गए लोगों को सूचित करता है; हिन्दी रूप स्पष्ट और चित्रात्मक है।
- source_word: פַּרְעֹה וְכָל־הֲמוֹנוֹ
  choice: फ़िरौन और उसकी सारी भीड़
  rationale: הָמוֹן बड़ी जनराशि या समूह को दर्शाता है; ‘भीड़’ व्यापक अर्थ बचाती है और अनावश्यक रूप से इसे केवल सेना नहीं बनाती।
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: प्रभु यहोवा की यह घोषणा है
  rationale: נְאֻם भविष्यद्वाणी की प्रामाणिक घोषणा का सूत्र है। אֲדֹנָי को ‘प्रभु’ और व्यक्तिगत नाम יהוה को हिन्दी के परिचित रूप ‘यहोवा’ से व्यक्त किया गया है।
theological_decisions:
- issue: חֲתִיתוֹ में सर्वनाम का पाठ
  choice: उसका आतंक
  alternative: मेरा आतंक
  rationale: प्रदत्त WLC पाठ में तृतीय पुरुष पुल्लिंग एकवचन प्रत्यय है, इसलिए मुख्य पाठ ‘उसका’ रखता है। कुछ प्राचीन साक्षी प्रथम पुरुष ‘मेरा’ का समर्थन करते हैं; महत्वपूर्ण पाठांतर होने के कारण उसे पादटिप्पणी में सुरक्षित रखा गया है।
- issue: אֲדֹנָי יְהוִה में परमेश्वर के नाम का अनुवाद
  choice: प्रभु यहोवा
  alternative: प्रभु याहवे / प्रभु परमेश्वर
  rationale: दोनों इब्रानी पदों का भेद बनाए रखने के लिए אֲדֹנָי को ‘प्रभु’ और יהוה को व्यक्तिगत नाम ‘यहोवा’ के रूप में प्रस्तुत किया गया है; इससे ‘प्रभु प्रभु’ जैसी अस्वाभाविक पुनरावृत्ति नहीं होती।
- issue: खतनारहित लोगों के बीच लिटाए जाने का आशय
  choice: वाचा-संबंधी और अपमानसूचक भाषा को यथावत रखा
  alternative: अन्यजातियों के बीच / अधर्मियों के बीच
  rationale: עֲרֵלִים को किसी व्याख्यात्मक धार्मिक श्रेणी से बदलना मूल पाठ की शारीरिक, वाचागत और अपमानसूचक बहुअर्थता को सीमित कर देता; इसलिए अधिक औपचारिक रूप रखा गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। ‘जीवितों का देश’, ‘खतनारहित’ और ‘लिटाया जाएगा’ जैसे मूल चित्रों को व्याख्यात्मक रूप से सरल बनाकर हटाया नहीं गया। विरामचिह्न फ़िरौन और उसकी भीड़ को उस व्यक्ति तथा समूह की पहचान के रूप में स्पष्ट करते हैं जो मृत्यु में लिटाए जाएंगे।
