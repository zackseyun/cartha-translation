  text: וַֽ/יְהִי֙ בִּ/שְׁתֵּ֣י עֶשְׂרֵ֣ה שָׁנָ֔ה בִּ/שְׁנֵי עָשָׂ֥ר חֹ֖דֶשׁ בְּ/אֶחָ֣ד לַ/חֹ֑דֶשׁ הָיָ֥ה דְבַר יְהוָ֖ה אֵלַ֥/י לֵ/אמֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/032/001.yaml
  text: And it happened in the twelfth year[a], in the twelfth month, on the first day of the month, that the word of Yahweh came to me, saying,
translation:
  language: hi
  text: 'बारहवें वर्ष के बारहवें महीने के पहले दिन ऐसा हुआ कि याहवे[a] का वचन मेरे पास आया:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में परमेश्वर का नाम יהוה (YHWH) है, जिसे यहाँ “याहवे” लिखा गया है; अंग्रेज़ी अनुवादों में इसे परंपरागत रूप से “the LORD” भी लिखा जाता है।
    reason: दिव्य नाम के इब्रानी पाठरूप और पारंपरिक अंग्रेज़ी शीर्षकीय विकल्प को स्पष्ट करना।
lexical_decisions:
- source_word: וַיְהִי
  choice: आया
  rationale: इब्रानी कथात्मक सूत्र यहाँ दिनांकित प्रकाशना का परिचय देता है। हिन्दी में अलग से “और ऐसा हुआ” जोड़ने के बजाय मुख्य वाक्य “वचन मेरे पास आया” में इसकी कथात्मक भूमिका स्वाभाविक रूप से समाहित होती है।
- source_word: בִּשְׁתֵּי עֶשְׂרֵה שָׁנָה
  choice: बारहवें वर्ष में
  rationale: यह मानक काल-निर्देश है। इब्रानी पाठ यह स्पष्ट नहीं करता कि यह वर्ष किस घटना से गिना गया है, इसलिए “निर्वासन का” नहीं जोड़ा गया।
- source_word: בִּשְׁנֵי עָשָׂר חֹדֶשׁ
  choice: बारहवें महीने के
  rationale: दिनांक के अगले घटक के साथ जोड़कर यह आधुनिक हिन्दी में स्वाभाविक और स्पष्ट कैलेंडरी अभिव्यक्ति बनती है।
- source_word: בְּאֶחָד לַחֹדֶשׁ
  choice: पहले दिन
  rationale: शाब्दिक रूप “महीने के एक में” इब्रानी दिनांक-सूत्र है, जिसका अर्थ महीने का पहला दिन है।
- source_word: הָיָה דְבַר יְהוָה אֵלַי
  choice: यहोवा का वचन मेरे पास आया
  rationale: भविष्यद्वाणी की इस प्रचलित इब्रानी अभिव्यक्ति का यह स्पष्ट और स्वाभाविक हिन्दी समतुल्य है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिन्दी बाइबल-परंपरा में प्रचलित रूप “यहोवा” व्यक्तिगत दिव्य नाम को शीर्षक से बदलने के बजाय नाम के रूप में प्रस्तुत करता है।
- source_word: לֵאמֹר
  choice: ':'
  rationale: यह पद अगले प्रत्यक्ष कथन का परिचय देता है। हिन्दी में वाक्यांत का द्विबिंदु “यह कहते हुए” की अपेक्षा अधिक स्वाभाविक ढंग से उसी कार्य को व्यक्त करता है।
theological_decisions:
- issue: दिव्य नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: मूल पाठ में व्यक्तिगत दिव्य नाम है। “यहोवा” आधुनिक हिन्दी के सामान्य बाइबलीय प्रयोग में पहचाना जाने वाला नामरूप है; फुटनोट अधिक संभावित उच्चारण “याहवे” और पारंपरिक शीर्षकीय अनुवाद की जानकारी देता है।
- issue: बारहवें वर्ष का संदर्भ
  choice: संदर्भ को अनिर्दिष्ट रखा गया
  alternative: निर्वासन के बारहवें वर्ष में
  rationale: इस पद का इब्रानी पाठ गणना का आरंभ-बिंदु स्पष्ट रूप से नहीं बताता; इसलिए संदर्भ से संभावित विवरण को मुख्य पाठ में नहीं जोड़ा गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सहज हिन्दी में रखी गई है। दिनांक-सूत्र को हिन्दी वाक्यक्रम के अनुसार संक्षिप्त किया गया है, और अगले पद में आने वाले प्रत्यक्ष कथन के लिए द्विबिंदु लगाया गया है।
