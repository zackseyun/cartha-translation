source:
  edition: WLC
  text: וְ/לֹ֤א יִשְׁכְּבוּ֙ אֶת גִּבּוֹרִ֔ים נֹפְלִ֖ים מֵ/עֲרֵלִ֑ים אֲשֶׁ֣ר יָרְדֽוּ שְׁא֣וֹל בִּ/כְלֵֽי מִלְחַמְתָּ/ם֩ וַ/יִּתְּנ֨וּ אֶת חַרְבוֹתָ֜/ם תַּ֣חַת רָאשֵׁי/הֶ֗ם וַ/תְּהִ֤י עֲוֺֽנֹתָ/ם֙ עַל עַצְמוֹתָ֔/ם כִּֽי חִתִּ֥ית גִּבּוֹרִ֖ים בְּ/אֶ֥רֶץ חַיִּֽים־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/032/027.yaml
  text: And they do not lie with the mighty, the fallen from among the uncircumcised[a], who went down to Sheol with their weapons of war, whose swords were placed under their heads, and whose iniquities were upon their bones[e][d][c][b]; for the terror of the mighty was in the land of the living.
translation:
  language: hi
  text: और वे उन वीरों के साथ नहीं लेटते[a], जो खतनारहितों में से गिरे हुए हैं[b] और अपने युद्ध के हथियारों के साथ शिओल[c] में उतर गए; उन्होंने अपनी तलवारें अपने सिरों के नीचे रखीं, और उनके अधर्म उनकी हड्डियों पर थे[d]; क्योंकि जीवितों की धरती में वीरों का आतंक था[e]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “और वे ... नहीं लेटेंगे।” इस विलाप में इब्रानी क्रिया का भविष्यकालीन भाव भी समझा जा सकता है।
    reason: lexical_alternative
  - marker: b
    text: या, “खतनारहितों में से गिरे हुए वीरों के साथ।” इब्रानी रचना कठिन है और ‘वीरों’ तथा ‘गिरे हुओं’ को अधिक निकटता से जोड़ा जा सकता है।
    reason: alternative_reading
  - marker: c
    text: शिओल मृतकों का लोक है; इसके लिए “कब्र” या “अधोलोक” भी अनुवाद सम्भव हैं।
    reason: lexical_alternative
  - marker: d
    text: “अधर्म” का अर्थ यहाँ “दोष” या “उनके अधर्म का दण्ड” भी हो सकता है।
    reason: lexical_alternative
  - marker: e
    text: अन्तिम इब्रानी उपवाक्य कठिन है; एक अन्य सम्भव अर्थ है, “क्योंकि उन्होंने जीवितों की धरती में वीरों के रूप में आतंक फैलाया था।”
    reason: alternative_reading
lexical_decisions:
- source_word: וְלֹא יִשְׁכְּבוּ
  choice: और वे ... नहीं लेटते
  rationale: अंत्येष्टि के प्रसंग में שׁכב का अर्थ मृत अवस्था में लेटना है। वर्तमानकालीन रूप विलाप के सजीव वर्णन के अनुकूल है, जबकि सम्भावित भविष्यकालीन अर्थ पादटिप्पणी में रखा गया है।
- source_word: אֶת גִּבּוֹרִים נֹפְלִים מֵעֲרֵלִים
  choice: उन वीरों के साथ ... जो खतनारहितों में से गिरे हुए हैं
  rationale: अर्थ की दृष्टि से אֶת को यहाँ संगति के अर्थ में लिया गया है। נֹפְלִים को संज्ञात्मक विशेषण और מֵעֲרֵלִים को समूह में से होने का बोधक मानकर कठिन इब्रानी संरचना को यथासम्भव सुरक्षित रखा गया है।
- source_word: שְׁאוֹל
  choice: शिओल
  rationale: इब्रानी धारणा को केवल ‘कब्र’ या बाद की विकसित ‘नरक’ की धारणा में सीमित न करने के लिए नाम का लिप्यंतरण किया गया है; अर्थ पादटिप्पणी में स्पष्ट है।
- source_word: בִּכְלֵי מִלְחַמְתָּם
  choice: अपने युद्ध के हथियारों के साथ
  rationale: यह पद सैनिक उपकरणों को सूचित करता है; यह हिंदी प्रयोग स्वाभाविक रहते हुए युद्ध-संबंधी दफ़न-चित्र को बनाए रखता है।
- source_word: וַיִּתְּנוּ אֶת חַרְבוֹתָם תַּחַת רָאשֵׁיהֶם
  choice: उनकी तलवारें उनके सिरों के नीचे रखी गई थीं
  rationale: इब्रानी क्रिया सक्रिय है, पर निष्क्रिय हिंदी रचना दफ़न किए गए मृतकों पर केंद्रित चित्र को स्वाभाविक बनाती है और तलवारें वास्तव में किसने रखीं, इस विषय में अनावश्यक निर्णय नहीं करती।
- source_word: וַתְּהִי עֲוֺנֹתָם עַל עַצְמוֹתָם
  choice: उनके अधर्म उनकी हड्डियों पर थे
  rationale: עָוֹן में अधर्म, दोष और दण्ड—तीनों की अर्थ-छायाएँ सम्भव हैं। शाब्दिक और संक्षिप्त हिंदी मूल की गंभीर अस्पष्टता को बनाए रखती है।
- source_word: כִּי חִתִּית גִּבּוֹרִים בְּאֶרֶץ חַיִּים
  choice: क्योंकि जीवितों की धरती में वीरों का आतंक था
  rationale: अपूर्ण और कठिन इब्रानी वाक्यांश को विस्तार से समझाए बिना उसके संबंधवाचक अर्थ की अस्पष्टता सुरक्षित रखी गई है।
theological_decisions:
- issue: न्याय के प्रसंग में עָוֹן का अर्थ
  choice: मुख्य पाठ में ‘अधर्म’ रखा गया है, और यह तय नहीं किया गया कि बल पाप, दोष या उसके दण्ड पर है।
  alternative: ‘दोष’ अथवा ‘उनके अधर्म का दण्ड’
  rationale: इब्रानी शब्द नैतिक अपराध और उसके परिणाम को एक साथ समेट सकता है; किसी एक अर्थ को चुनना मूल की धर्मवैचारिक तन्यता को अनावश्यक रूप से समाप्त कर देता।
- issue: שְׁאוֹל की पहचान
  choice: ‘शिओल’ का लिप्यंतरण
  alternative: ‘कब्र’ अथवा ‘अधोलोक’
  rationale: यहाँ मृतकों के लोक का उल्लेख है। लिप्यंतरण पाठ को न तो केवल भौतिक कब्र तक सीमित करता है और न उसे बाद की किसी विशिष्ट नरक-धारणा के समान ठहराता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य हिंदी पाठक के लिए सुबोध रखी गई है। ‘खतनारहित’ और ‘शिओल’ जैसे स्रोत-संवेदी शब्द इसलिए बनाए रखे गए हैं कि अध्याय की पुनरावृत्त धार्मिक शब्दावली और मृतकों के लोक की इब्रानी धारणा समतल न हो जाए।
