  text: וְ/הִשְׁקֵיתִ֨י אֶ֧רֶץ צָפָתְ/ךָ֛ מִ/דָּמְ/ךָ֖ אֶל הֶֽ/הָרִ֑ים וַ/אֲפִקִ֖ים יִמָּלְא֥וּ/ן מִמֶּֽ/ךָּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/032/006.yaml
  text: I will drench the land with your flowing blood up to the mountains[c][b][a], and the ravines will be filled with you.
translation:
  language: hi
  text: मैं तेरे बहते हुए लहू से भूमि को पहाड़ों तक भिगो दूँगा[a], और घाटियाँ[b] तुझसे भर जाएँगी[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मैं तेरे बहाव की भूमि को तेरे लहू से सींच दूँगा।” इब्रानी अभिव्यक्ति कठिन है; मुख्य पाठ प्रसंग में उसका संभावित अर्थ देता है।
    reason: lexical_alternative
  - marker: b
    text: या, “जलमार्ग” अथवा “नदी-तल।”
    reason: lexical_alternative
  - marker: c
    text: शाब्दिक रूप से, “तुझसे भर जाएँगी”; आशय संभवतः तेरे लहू या अवशेषों से भर जाना है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִשְׁקֵיתִי
  choice: भिगो दूँगा
  rationale: हिफ़ील रूप का मूल अर्थ ‘पिलाना’ या ‘सींचना’ है। रक्त से भूमि भर जाने के हिंसक प्रसंग में ‘भिगो दूँगा’ स्वाभाविक और चित्रात्मक है।
- source_word: אֶרֶץ
  choice: भूमि
  rationale: यहाँ शब्द मिस्र के भौगोलिक भूभाग को सूचित करता है; ‘भूमि’ सामान्य और प्रसंगानुकूल है।
- source_word: צָפָתְךָ מִדָּמְךָ
  choice: तेरे बहते हुए लहू से
  rationale: צָפָתְךָ एक कठिन और दुर्लभ अभिव्यक्ति है, जो संभवतः मारे गए प्राणी से बहने या उमड़ने वाली वस्तु को दर्शाती है; מִדָּמְךָ उसे रक्त से जोड़ता है। अनुवाद संभावित दृश्य को स्पष्ट करता है, जबकि पादटिप्पणी अनिश्चितता बनाए रखती है।
- source_word: אֶל הֶהָרִים
  choice: पहाड़ों तक
  rationale: אֶל यहाँ फैलाव की सीमा दर्शाता है; ‘पहाड़ों तक’ उस विस्तार को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וַאֲפִקִים
  choice: घाटियाँ
  rationale: אֲפִיקִים जलमार्गों, नदी-तलों या खड्डों के लिए प्रयुक्त हो सकता है। पहाड़ों के समानांतर भू-दृश्य में ‘घाटियाँ’ सहज और सजीव है।
- source_word: יִמָּלְאוּן
  choice: भर जाएँगी
  rationale: מלא के निफ़अल रूप का सीधा भाव ‘भर जाना’ है।
- source_word: מִמֶּךָּ
  choice: तुझसे
  rationale: शाब्दिक रूप से ‘तुझसे’ है। यह संबोधित विशाल प्राणी के रक्त या अवशेषों की ओर संकेत कर सकता है; मुख्य पाठ में ‘तुझसे’ मूल की सीधी और भयानक व्यक्तिपरकता बचाता है।
