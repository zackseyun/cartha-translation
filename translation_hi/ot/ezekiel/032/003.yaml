source:
  edition: WLC
  text: כֹּ֤ה אָמַר֙ אֲדֹנָ֣/י יְהוִ֔ה וּ/פָרַשְׂתִּ֤י עָלֶ֨י/ךָ֙ אֶת רִשְׁתִּ֔/י בִּ/קְהַ֖ל עַמִּ֣ים רַבִּ֑ים וְ/הֶעֱל֖וּ/ךָ בְּ/חֶרְמִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/032/003.yaml
  text: 'Thus says the Lord GOD: I will spread my net over you with an assembly of many peoples[b][a], and they will haul you up in my dragnet.'
translation:
  language: hi
  text: 'प्रभु याहवे यों कहते हैं: मैं अनेक जातियों की सभा के द्वारा[a] तुम्हारे ऊपर अपना जाल फैलाऊँगा, और वे तुम्हें मेरे महाजाल में खींचकर ऊपर निकालेंगे[b]।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, ‘अनेक जातियों की सभा में/के साथ।’ इस वाक्यांश का अर्थ यह भी हो सकता है कि परमेश्वर अनेक जातियों को साधन बनाकर अपना जाल फैलाएगा।
    reason: lexical_alternative
  - marker: b
    text: या, ‘वे तुम्हें मेरे महाजाल में ऊपर खींच निकालेंगे।’ यहाँ इब्रानी में जाल के लिए पहले शब्द से भिन्न दूसरा शब्द आया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  choice: याहवे प्रभु
  rationale: संयुक्त उपाधि में אֲדֹנָי का अर्थ ‘प्रभु’ है और יהוה परमेश्वर का व्यक्तिगत नाम है। हिन्दी में स्वाभाविक पदक्रम रखते हुए दोनों तत्व सुरक्षित रखे गए हैं।
- source_word: וּפָרַשְׂתִּי
  choice: मैं ... फैलाऊँगा
  rationale: פרשׂ का मूल भाव फैलाना या तानना है; जाल के संदर्भ में ‘फैलाऊँगा’ स्वाभाविक और चित्रात्मक है।
- source_word: רִשְׁתִּי
  choice: अपना जाल
  rationale: רֶשֶׁת के सामान्य अर्थ ‘जाल’ और प्रथम पुरुष संबंधसूचक प्रत्यय, दोनों को स्पष्ट रूप से रखा गया है।
- source_word: בִּקְהַל עַמִּים רַבִּים
  choice: अनेक जातियों की सभा के द्वारा
  rationale: קהל एक एकत्रित सभा या समुदाय को दर्शाता है और עמים बहुवचन में जनसमूहों/जातियों को। प्रसंग में ב को साधनवाचक समझना सबसे संगत है, पर इसकी परिस्थितिवाचक संभावना पादटिप्पणी में सुरक्षित है।
- source_word: וְהֶעֱלוּךָ
  choice: और वे तुम्हें ... खींचकर ऊपर निकालेंगे
  rationale: עלה का हिफ़ील रूप ‘ऊपर ले जाना/निकालना’ बताता है। मछली पकड़ने के रूपक में ‘खींचकर ऊपर निकालेंगे’ क्रिया और दृश्य दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: בְּחֶרְמִי
  choice: मेरे महाजाल में
  rationale: חֶרֶם यहाँ पहले आए רֶשֶׁת से भिन्न प्रकार का मछली पकड़ने का जाल है, संभवतः घेरकर खींचा जाने वाला बड़ा जाल। ‘महाजाल’ इस शब्दभेद और व्यापक पकड़ के भाव को बनाए रखता है।
theological_decisions:
- issue: संयुक्त ईश्वरीय उपाधि אֲדֹנָי יְהוִה में יהוה का अनुवाद
  choice: याहवे प्रभु
  alternative: प्रभु परमेश्वर; प्रभु यहोवा
  rationale: मूल पाठ में वाचा का व्यक्तिगत नाम יהוה सीधे उपस्थित है। ‘याहवे’ उसे सामान्य उपाधि में बदलने के बजाय नाम के रूप में रखता है; אֲדֹנָי को अलग से ‘प्रभु’ अनूदित किया गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। मछली पकड़ने के रूपक को स्पष्ट करने के लिए ‘खींचकर ऊपर निकालेंगे’ कहा गया है। ‘जातियों’ बहुवचन עמים को और ‘सभा’ קהל को सुरक्षित रखता है।
