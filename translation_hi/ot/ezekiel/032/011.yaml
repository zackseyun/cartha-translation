  text: 'For thus says the Lord GOD: The sword of the king of Babylon will come upon you[a].'
translation:
  language: hi
  text: 'क्योंकि प्रभु याहवे यों कहते हैं: बाबेल के राजा की तलवार तुझ पर आएगी[a]।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से ‘तेरे पास आएगी’; इस न्याय-संदर्भ में इसका अर्थ ‘तेरे विरुद्ध आएगी’ भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पद पिछले कथन का आधार बताता है; ‘क्योंकि’ उस संवाद-संबंध को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: כֹּה אָמַר
  choice: यों कहते हैं
  rationale: यह नबूवत की प्रामाणिक संदेश-सूचना है। हिन्दी में वर्तमानकालीन ‘यों कहते हैं’ इसके स्थायी घोषणात्मक बल को व्यक्त करता है।
- source_word: אֲדֹנָי יְהוִה
  choice: प्रभु यहोवा
  rationale: 'संयुक्त उपाधि के दोनों तत्वों को अलग और स्पष्ट रखा गया है: אֲדֹנָי के लिए ‘प्रभु’ तथा व्यक्तिगत दिव्य नाम יהוה के लिए ‘यहोवा’।'
- source_word: חֶרֶב מֶלֶךְ בָּבֶל
  choice: बाबेल के राजा की तलवार
  rationale: इब्रानी संबंध-रचना का सीधा और स्वाभाविक हिन्दी रूप; प्रसंग में यह आक्रमण और न्याय के निश्चित साधन को दर्शाती है।
- source_word: תְּבוֹאֶךָ
  choice: तुझ पर आएगी
  rationale: शाब्दिक गति-भाव को बनाए रखते हुए ‘पर’ न्याय के प्रसंग में शत्रुतापूर्ण आगमन का संकेत देता है; ‘विरुद्ध आएगी’ भी अर्थगत संभावना है।
theological_decisions:
- issue: संयुक्त दिव्य उपाधि אֲדֹנָי יְהוִה का अनुवाद
  choice: प्रभु यहोवा
  alternative: प्रभु याहवे
  rationale: मूल पाठ में सामान्य उपाधि और परमेश्वर का व्यक्तिगत नाम दोनों हैं। ‘प्रभु यहोवा’ हिन्दी बाइबलीय प्रयोग में परिचित है और दोनों तत्वों को सुरक्षित रखता है, बिना उन्हें एक ही उपाधि में मिला देने के।
- issue: तलवार के आने की दिशा में निहित शत्रुतापूर्ण भाव
  choice: तुझ पर आएगी
  alternative: तेरे विरुद्ध आएगी
  rationale: ‘तुझ पर’ मूल के ‘तेरे पास/तेरी ओर’ वाले रूप के निकट रहते हुए न्याय के प्रसंग में आक्रमण का भाव देता है; पादटिप्पणी अधिक स्पष्ट वैकल्पिक अर्थ दर्ज करती है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सहज हिन्दी। एकवचन संबोधन के लिए ‘तुझ/तेरे’ रखा गया है, क्योंकि यह मिस्र के फ़िरौन को सीधे संबोधित नबूवत की शैली है। ‘बाबेल’ मूल स्थान-नाम के पारंपरिक हिन्दी बाइबलीय रूप को बनाए रखता है।
