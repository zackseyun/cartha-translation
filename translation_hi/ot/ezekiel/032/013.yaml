base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/032/013.yaml
  text: And I will destroy all its beasts from beside its abundant waters[a], and no human foot will muddy them anymore[b], nor will the hooves of beasts muddy them.
translation:
  language: hi
  text: और मैं उसके सब पशुओं को बहुत जल के पास से नष्ट कर दूँगा[a]। फिर कभी किसी मनुष्य का पाँव उन्हें गंदला नहीं करेगा[b], और न पशुओं के खुर उन्हें गंदला करेंगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “बहुत-से जल के पास से”; शाब्दिक रूप से, “बहुत जल के ऊपर से।”
    reason: lexical_alternative
  - marker: b
    text: यहाँ क्रिया का अर्थ पैरों या खुरों से जल को हिलाकर मटमैला या गंदला करना है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַאֲבַדְתִּי
  choice: और मैं ... नष्ट कर दूँगा
  rationale: אבד के हिफ़ील रूप में प्रथम पुरुष कर्ता विनाश या मिटा देने की क्रिया व्यक्त करता है; ‘नष्ट कर दूँगा’ न्याय के प्रसंग में स्वाभाविक और स्पष्ट है।
- source_word: בְּהֶמְתָּהּ
  choice: उसके सब पशुओं
  rationale: בְּהֵמָה पशुओं की व्यापक श्रेणी को सूचित कर सकता है, जिसमें पालतू पशु भी सम्मिलित हैं; स्त्रीलिंग प्रत्यय मिस्र की ओर संकेत करता है।
- source_word: מֵעַל מַיִם רַבִּים
  choice: उसके बहुत से जल-स्रोतों के पास से
  rationale: מֵעַל यहाँ जल के निकट या उसके किनारे के स्थान से हटाए जाने का भाव देता है। מַיִם רַבִּים का मूल भाव ‘बहुत जल’ है; हिन्दी में प्रसंगानुकूल स्पष्टता के लिए ‘बहुत से जल-स्रोतों’ चुना गया है, जबकि अधिक शाब्दिक विकल्प पादटिप्पणी में रखा गया है।
- source_word: תִדְלָחֵם
  choice: उनके जल को गंदला करेगा
  rationale: דלח यहाँ पैरों या खुरों से जल को हिलाकर मटमैला या गंदला करने को दर्शाता है। बहुवचन प्रत्यय का पूर्वपद जल है; हिन्दी में संदर्भ स्पष्ट करने के लिए ‘उनके जल को’ कहा गया है।
- source_word: רֶגֶל אָדָם
  choice: किसी मनुष्य का पाँव
  rationale: אָדָם यहाँ व्यक्तिवाचक नाम नहीं, बल्कि सामान्य रूप से मनुष्य का बोध कराता है। नकारात्मक वाक्य में ‘किसी मनुष्य का पाँव’ स्वाभाविक हिन्दी है।
- source_word: עוֹד
  choice: फिर न
  rationale: नकारात्मक भविष्य कथन में עוֹד अब आगे ऐसा न होने या दोबारा न होने का भाव देता है; ‘फिर न’ इसे संक्षेप और स्वाभाविक रूप में व्यक्त करता है।
- source_word: וּפַרְסוֹת בְּהֵמָה
  choice: न पशुओं के खुर
  rationale: פַּרְסוֹת पशुओं के खुरों को दर्शाता है और यह मनुष्य के पाँव वाले पिछले पद के साथ समानांतर है।
theological_decisions:
- issue: אָדָם का सामान्य मानवीय अर्थ
  choice: किसी मनुष्य का पाँव
  alternative: आदमी का पाँव
  rationale: यह पद किसी विशेष पुरुष या आदम नामक व्यक्ति को नहीं, बल्कि किसी भी मनुष्य को सूचित करता है; इसलिए ‘किसी मनुष्य’ अर्थ को ठीक और समावेशी ढंग से व्यक्त करता है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, गंभीर भविष्यद्वाणी-संबंधी शैली रखते हुए सामान्य पाठक के लिए सहज रखी गई है। ‘जल-स्रोत’ प्रसंग को स्पष्ट करता है, जबकि हिब्रू की अधिक शाब्दिक अभिव्यक्ति पादटिप्पणी में सुरक्षित है।
