  text: וְ/כָל בְּשָׂרָ/ם֙ וְ/גַבֵּ/הֶ֔ם וִֽ/ידֵי/הֶ֖ם וְ/כַנְפֵי/הֶ֑ם וְ/הָ/אֽוֹפַנִּ֗ים מְלֵאִ֤ים עֵינַ֨יִם֙ סָבִ֔יב לְ/אַרְבַּעְתָּ֖/ם אוֹפַנֵּי/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/010/012.yaml
  text: And all their bodies[a], their backs, their hands, their wings[b], and the wheels were full of eyes all around—the wheels belonging to the four of them.
translation:
  language: hi
  text: और उनके सारे शरीर[a], उनकी पीठें, उनके हाथ, उनके पंख और पहिए चारों ओर आँखों से भरे थे—वे पहिए जो उन चारों के थे।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अधिक शाब्दिक रूप में, “उनका सारा मांस।”
    reason: lexical_alternative
  - marker: b
    text: अंतिम वाक्यांश का अधिक संक्षिप्त अनुवाद “उन चारों के पहिए” भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּשָׂרָם
  choice: उनके सारे शरीर
  rationale: בָּשָׂר का मूल अर्थ ‘मांस’ है, पर यहाँ प्राणियों के अंगों की सूची में यह उनकी पूरी शारीरिक देह को सूचित करता है; ‘शरीर’ आधुनिक हिन्दी में स्वाभाविक और ठोस है।
- source_word: גַבֵּיהֶם
  choice: उनकी पीठें
  rationale: आस-पास के शब्द सभी शारीरिक अंगों के हैं, इसलिए यहाँ शारीरिक अर्थ ‘पीठें’ सबसे उपयुक्त है; ‘किनारे’ या ‘ऊँचाइयाँ’ इस संदर्भ में कम संभावित हैं।
- source_word: וִידֵיהֶם
  choice: उनके हाथ
  rationale: יָד का सामान्य अर्थ ‘हाथ’ है, और संदर्भ इसे ‘बाँह’ के रूप में विस्तृत करने की माँग नहीं करता।
- source_word: וְכַנְפֵיהֶם
  choice: उनके पंख
  rationale: यहेजकेल के दर्शनीय प्राणियों के संदर्भ में כָּנָף का सीधा और स्थापित अर्थ ‘पंख’ है।
- source_word: וְהָאוֹפַנִּים
  choice: और पहिए
  rationale: אוֹפַן का ठोस अर्थ ‘पहिया’ है; दर्शन की छवि को व्याख्यात्मक परिभाषा में बदले बिना रखा गया है।
- source_word: מְלֵאִים עֵינַיִם
  choice: आँखों से भरे थे
  rationale: यह इब्रानी विशेषण-संज्ञा संरचना का निकट और स्वाभाविक हिन्दी रूप है; ‘आँखों से ढके थे’ अधिक व्याख्यात्मक होता।
- source_word: סָבִיב
  choice: चारों ओर
  rationale: यह आधुनिक हिन्दी में ‘हर तरफ़/चारों तरफ़’ के अर्थ का सहज, गरिमापूर्ण रूप है।
- source_word: לְאַרְבַּעְתָּם ... אוֹפַנֵּיהֶם
  choice: वे पहिए जो उन चारों के थे
  rationale: अंतिम पद पहियों को फिर से उठाकर चारों प्राणियों के साथ उनका संबंध स्पष्ट करता है। हिन्दी में यह पुनरुक्ति बनाए रखी गई है ताकि इब्रानी की संबंधसूचक और स्पष्टीकरणात्मक संरचना मिट न जाए।
