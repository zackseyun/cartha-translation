id: EZK.10.21
reference: Ezekiel 10:21
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: אַרְבָּעָ֨ה אַרְבָּעָ֤ה פָנִים֙ לְ/אֶחָ֔ד וְ/אַרְבַּ֥ע כְּנָפַ֖יִם לְ/אֶחָ֑ד וּ/דְמוּת֙ יְדֵ֣י אָדָ֔ם תַּ֖חַת כַּנְפֵי/הֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/010/021.yaml
  text: Each one had four faces[a], and each one had four wings, and the likeness of human hands was under their wings.
translation:
  language: hi
  text: हर एक के चार-चार मुख और चार-चार पंख थे, और उनके पंखों के नीचे मनुष्य के हाथों जैसी आकृति[a] थी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मनुष्य के हाथ।”
    reason: शाब्दिक विकल्प; इब्रानी वाक्यांश को ‘मनुष्य के हाथ’ भी अनूदित किया जा सकता है, जबकि मुख्य पाठ דְּמוּת के सदृशता-सूचक भाव को स्पष्ट करता है।
lexical_decisions:
- source_word: אַרְבָּעָה אַרְבָּעָה ... לְאֶחָד
  choice: हर एक के चार-चार
  rationale: संख्या की पुनरावृत्ति और לְאֶחָד का प्रयोग वितरणात्मक अर्थ देता है; ‘हर एक के चार-चार’ इसे स्वाभाविक हिन्दी में स्पष्ट करता है।
- source_word: פָנִים
  choice: मुख
  rationale: दर्शन के प्रसंग में यह प्रत्येक जीवधारी के अनेक चेहरों को दर्शाता है; ‘मुख’ गरिमापूर्ण और सहज है।
- source_word: וְאַרְבַּע כְּנָפַיִם לְאֶחָד
  choice: और चार-चार पंख
  rationale: पहले उपवाक्य की वितरणात्मक समानांतरता को बनाए रखता है।
- source_word: וּדְמוּת
  choice: और ... जैसी आकृति
  rationale: דְּמוּת समानता या सदृशता बताता है, पूर्ण तादात्म्य नहीं; ‘जैसी आकृति’ दर्शन की अनुरूपात्मक भाषा सुरक्षित रखती है।
- source_word: יְדֵי אָדָם
  choice: मनुष्य के हाथों
  rationale: यहाँ אָדָם किसी विशेष पुरुष के बजाय मानव स्वरूप को दर्शाता है; ‘मनुष्य के हाथों’ उस भेद को ठीक व्यक्त करता है।
- source_word: תַּחַת כַּנְפֵיהֶם
  choice: उनके पंखों के नीचे
  rationale: यह सीधा स्थान-सूचक वाक्यांश है और बहुवचन सर्वनाम जीवधारियों की ओर संकेत करता है।
theological_decisions:
- issue: אָדָם का अर्थ
  choice: मनुष्य
  alternative: आदमी
  rationale: यह पद हाथों के मानव-सदृश रूप का वर्णन करता है, न कि पुरुष लिंग का; इसलिए ‘मनुष्य’ प्रसंगानुकूल और लिंग की दृष्टि से सटीक है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण शैली अपनाई गई है। ‘चार-चार’ से इब्रानी की वितरणात्मक पुनरावृत्ति और ‘जैसी आकृति’ से दर्शनीय भाषा की वास्तविक अनिश्चितता सुरक्षित रहती है।
