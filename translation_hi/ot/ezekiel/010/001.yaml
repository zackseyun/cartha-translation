  to: तब मैंने देखा, और देखो, करूबों के सिरों के ऊपर के आकाशमंडल पर नीलमणि[a] जैसे पत्थर के समान कुछ दिखाई दिया, जो देखने में सिंहासन की आकृति जैसा था; वह उनके ऊपर दिखाई दिया।
  rationale: The revision restores the Hebrew's final plural spatial reference ('उनके ऊपर') to the cherubim, while retaining the preceding statement that the vision is associated with the expanse above their heads. It also expresses the Hebrew's cumulative visionary approximation—stone-like, seen as/form-like, throne-like—without asserting a direct identification.
