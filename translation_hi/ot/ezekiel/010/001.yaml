source:
  edition: WLC
  text: וָ/אֶרְאֶ֗ה וְ/הִנֵּ֤ה אֶל הָ/רָקִ֨יעַ֙ אֲשֶׁר֙ עַל רֹ֣אשׁ הַ/כְּרֻבִ֔ים כְּ/אֶ֣בֶן סַפִּ֔יר כְּ/מַרְאֵ֖ה דְּמ֣וּת כִּסֵּ֑א נִרְאָ֖ה עֲלֵי/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/010/001.yaml
  text: Then I looked[a], and behold, on the expanse that was above the heads of the cherubim there appeared over them something like a sapphire stone, in appearance like the likeness of a throne.
translation:
  language: hi
  text: तब मैंने देखा, और देखो, करूबों के सिरों के ऊपर के आकाशमंडल पर नीलमणि[a] जैसे पत्थर के समान कुछ दिखाई दिया, जो देखने में सिंहासन की आकृति जैसा था; वह उनके ऊपर दिखाई दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या अधिक विशिष्ट रूप से, “लाजवर्द जैसे पत्थर”; जिस इब्रानी शब्द का परंपरागत अनुवाद “नीलमणि” है, वह संभवतः गहरे नीले रंग के ऐसे बहुमूल्य पत्थर को बताता है जिसकी आधुनिक खनिज-पहचान निश्चित नहीं है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶרְאֶה
  choice: तब मैंने देखा
  rationale: वाव-क्रमसूचक कथा को आगे बढ़ाता है; यह अनुवाद प्रथम-पुरुष के दर्शन-वर्णन और घटनाक्रम दोनों को स्वाभाविक हिन्दी में रखता है।
- source_word: וְהִנֵּה
  choice: और देखो
  rationale: यह ध्यान आकृष्ट करने वाला कथन दर्शन की आकस्मिकता और जीवंत भविष्यद्वक्ताई शैली को बनाए रखता है।
- source_word: הָרָקִיעַ
  choice: आकाशमंडल
  rationale: यहाँ यह करूबों के सिरों के ऊपर फैली हुई संरचना को दर्शाता है; ‘आकाशमंडल’ बाइबिलीय गरिमा और स्थानिक बिंब दोनों को व्यक्त करता है।
- source_word: הַכְּרֻבִים
  choice: करूबों
  rationale: ‘करूब’ इस वर्ग के स्वर्गीय प्राणियों के लिए हिन्दी में प्रचलित बाइबिलीय लिप्यंतरण है।
- source_word: כְּאֶבֶן סַפִּיר
  choice: नीलमणि जैसे पत्थर के समान कुछ
  rationale: मूल में उपमा है और सַפִּיר गहरे नीले बहुमूल्य पत्थर का संकेत देता है; ‘कुछ’ दर्शनीय वस्तु की अप्रत्यक्ष पहचान को बनाए रखता है।
- source_word: כְּמַרְאֵה דְּמוּת כִּסֵּא
  choice: जिसका रूप सिंहासन की आकृति जैसा था
  rationale: ‘रूप’, ‘आकृति’ और ‘जैसा’ मूल के क्रमिक तुलनात्मक संकेतों को पठनीय आधुनिक हिन्दी में बनाए रखते हैं, बिना उसे सीधे सिंहासन घोषित किए।
- source_word: נִרְאָה
  choice: दिखाई दिया
  rationale: निफ़अल रूप को स्वाभाविक हिन्दी में दृश्य प्रकट होने के रूप में व्यक्त करता है।
- source_word: עֲלֵיהֶם
  choice: उस पर
  rationale: सर्वनाम का व्याकरणिक संदर्भ बहुवचन करूब हैं, पर स्थानिक अर्थ में वस्तु उनके ऊपर स्थित आकाशमंडल पर दिखाई देती है; हिन्दी वाक्य में ‘उस पर’ निकटवर्ती ‘आकाशमंडल’ से संबंध स्पष्ट करता है।
theological_decisions:
- issue: दर्शन की भाषा और पहचान की निश्चितता
  choice: वस्तु को सीधे सिंहासन न कहकर ‘नीलमणि जैसे पत्थर के समान कुछ’ और ‘सिंहासन की आकृति जैसा’ कहा गया है।
  alternative: ‘उनके ऊपर नीलमणि का सिंहासन था।’
  rationale: यहेजकेल की क्रमिक उपमाएँ दर्शन की परोक्षता और दिव्य महिमा की अगम्यता बनाए रखती हैं; उन्हें समतल करना मूल से अधिक निश्चित दावा करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमामय भविष्यद्वक्ताई शैली रखी गई है। ‘और देखो’ मूल के ध्यानाकर्षक पद को सुरक्षित रखता है, जबकि तुलना-सूचक शब्द दर्शन की जानबूझकर रखी गई अनिश्चितता बनाए रखते हैं।
