base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/010/016.yaml
  text: When the cherubim moved[a], the wheels moved beside them; and when the cherubim lifted up their wings to rise from the earth, the wheels also did not turn away from beside them.
translation:
  language: hi
  text: जब करूब चलते थे, तब पहिए उनके साथ-साथ चलते थे; और जब करूब पृथ्वी से ऊपर उठने के लिए अपने पंख उठाते थे, तब पहिए भी उनके पास से नहीं हटते थे।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “पहिए भी उनसे दूर नहीं मुड़ते थे।” हिब्रू में “मुड़ना” प्रयुक्त है; प्रसंग में इसका भाव करूबों के पास से अलग न होना है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְלֶכֶת הַכְּרוּבִים
  choice: जब करूब चलते थे
  rationale: ב + infinitive construct को स्वाभाविक कालवाचक उपवाक्य से व्यक्त किया गया है। הלך के सामान्य गतिसूचक अर्थ को ‘चलते थे’ स्पष्ट और सहज रूप में रखता है।
- source_word: הַכְּרוּבִים
  choice: करूब
  rationale: यह हिब्रू संज्ञा का हिन्दी में प्रचलित बाइबलीय लिप्यंतरण है; हिन्दी में बहुवचन का बोध क्रिया और प्रसंग से होता है।
- source_word: הָאוֹפַנִּים
  choice: पहिए
  rationale: אופן का सीधा अर्थ ‘पहिया’ है और दर्शन के पूरे वर्णन में यही संगति उपयुक्त है।
- source_word: אֶצְלָם
  choice: उनके साथ-साथ
  rationale: אצל निकटता और बगल में होने का भाव देता है। यहाँ गतिशील पहियों और करूबों की निकट, समन्वित चाल को स्वाभाविक हिन्दी में व्यक्त किया गया है।
- source_word: וּבִשְׂאֵת הַכְּרוּבִים אֶת כַּנְפֵיהֶם
  choice: जब करूब ... अपने पंख उठाते थे
  rationale: दूसरे ב + infinitive construct को भी कालवाचक उपवाक्य बनाया गया है; נשׂא का यहाँ सीधा अर्थ पंख उठाना है।
- source_word: לָרוּם מֵעַל הָאָרֶץ
  choice: पृथ्वी के ऊपर उठने के लिए
  rationale: רום के आरोहण और מֵעַל הָאָרֶץ के ‘पृथ्वी के ऊपर से/ऊपर’ वाले स्थानिक भाव को साथ रखते हुए उद्देश्य का स्वाभाविक हिन्दी रूप दिया गया है।
- source_word: לֹא יִסַּבּוּ ... מֵאֶצְלָם
  choice: उनके पास से नहीं हटते थे
  rationale: סבב का मूल भाव मुड़ना है, पर מן + אצל के साथ यहाँ आशय करूबों की बगल से अलग न होने का है। मुख्य पाठ में यह संदर्भगत अर्थ स्पष्ट किया गया और अधिक शाब्दिक विकल्प पाद-टिप्पणी में रखा गया है।
- source_word: גַּם הֵם
  choice: पहिए भी
  rationale: גם הם के जोर को हिन्दी में कर्ता के साथ ‘भी’ लगाकर स्वाभाविक ढंग से व्यक्त किया गया है।
