  text: בְּ/עָמְדָ֣/ם יַעֲמֹ֔דוּ וּ/בְ/רוֹמָ֖/ם יֵר֣וֹמּוּ אוֹתָ֑/ם כִּ֛י ר֥וּחַ הַ/חַיָּ֖ה בָּ/הֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/010/017.yaml
  text: When they stood still[a], these stood still; and when they were lifted up, these were lifted up with them, for the spirit of the living creature was in them.
translation:
  language: hi
  text: जब वे ठहरे, तब ये भी ठहरे रहे; और जब वे ऊपर उठे, तब ये भी उनके साथ ऊपर उठे, क्योंकि जीवित प्राणी की आत्मा[a] उनमें थी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘जीवन की आत्मा उनमें थी।’ यहाँ ‘आत्मा’ के लिए प्रयुक्त इब्रानी शब्द का अर्थ ‘श्वास’ या ‘वायु’ भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּעָמְדָם
  choice: जब वे ठहरे
  rationale: בְּ के साथ infinitive construct और 3 पुरुष बहुवचन प्रत्यय यहाँ कालवाचक परिस्थिति व्यक्त करता है। ‘ठहरे’ संदर्भ में गति रुकने का स्वाभाविक हिन्दी रूप है।
- source_word: יַעֲמֹדוּ
  choice: तब ये भी ठहरे रहे
  rationale: अलग निहित कर्ता, अर्थात पहियों, को ‘ये भी’ से स्पष्ट किया गया है; ‘ठहरे रहे’ समन्वित स्थिरता को व्यक्त करता है।
- source_word: וּבְרוֹמָם
  choice: और जब वे ऊपर उठे
  rationale: रूम का अर्थ इस दर्शन में शारीरिक रूप से ऊपर उठना है, न कि महिमा या पद में ऊँचा किया जाना।
- source_word: יֵרוֹמּוּ אוֹתָם
  choice: तब ये भी उनके साथ ऊपर उठे
  rationale: इब्रानी की कठिन रचना को संदर्भानुसार साथ-साथ ऊपर उठने के रूप में व्यक्त किया गया है; ‘उनके साथ’ पहियों और प्राणियों की संयुक्त गति स्पष्ट करता है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यह उनकी एक-जैसी गति का कारण बताने वाला व्याख्यात्मक संबंध है।
- source_word: רוּחַ
  choice: आत्मा
  rationale: यहाँ शब्द उस चेतन या प्रेरक शक्ति को सूचित करता है जिसके कारण पहिए प्राणी के साथ चलते हैं; फिर भी ‘श्वास’ और ‘वायु’ की अर्थ-छायाएँ पादटिप्पणी में सुरक्षित हैं।
- source_word: הַחַיָּה
  choice: जीवित प्राणी
  rationale: दर्शन में दिखाई देने वाले सजीव प्राणी के लिए यह सहज और गरिमापूर्ण पद है; इब्रानी के एकवचन को बनाए रखा गया है।
- source_word: בָּהֶם
  choice: उनमें थी
  rationale: सरल स्थानवाचक अभिव्यक्ति है, जो संदर्भ में पहियों की ओर संकेत करती है।
theological_decisions:
- issue: दर्शन में רוּחַ का अर्थ
  choice: जीवित प्राणी की आत्मा
  alternative: जीवन की आत्मा; जीवित प्राणी की श्वास या वायु
  rationale: मुख्य पाठ में सबसे स्वाभाविक अर्थ वह प्रेरक आत्मा है जो प्राणी और पहियों की समन्वित गति को समझाती है। वैकल्पिक अर्थों को पादटिप्पणी में रखकर इब्रानी की वास्तविक अर्थ-विस्तार और दर्शन का रहस्य सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट शैली रखी गई है। ‘वे’ और ‘ये’ से जीवित प्राणियों तथा पहियों के बीच का संदर्भगत भेद व्यक्त होता है।
