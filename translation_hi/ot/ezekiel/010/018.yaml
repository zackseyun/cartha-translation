source:
  edition: WLC
  text: וַ/יֵּצֵא֙ כְּב֣וֹד יְהוָ֔ה מֵ/עַ֖ל מִפְתַּ֣ן הַ/בָּ֑יִת וַֽ/יַּעֲמֹ֖ד עַל הַ/כְּרוּבִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/010/018.yaml
  text: Then the glory of Yahweh went out from above the threshold of the house and stood over the cherubim[a].
translation:
  language: hi
  text: तब याहवे की महिमा घर[a] की दहलीज़ के ऊपर से निकल गई और करूबों के ऊपर ठहर गई।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “मंदिर।” इब्रानी में “घर।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: निकलकर
  rationale: यह क्रिया बाहर की ओर गति दर्शाती है। ‘निकलकर’ अगली क्रिया से स्वाभाविक रूप से जुड़ती है और ‘प्रस्थान किया’ जैसे अधिक व्याख्यात्मक भाव से बचती है।
- source_word: כְּבוֹד יְהוָה
  choice: याहवे की महिमा
  rationale: यह पदबंध याहवे की प्रकट महिमा और उपस्थिति को दर्शाता है तथा इब्रानी संबंध को स्पष्ट रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत नाम को उपाधि से बदलने के बजाय देवनागरी में लिप्यंतरित किया गया है।
- source_word: מֵעַל מִפְתַּן
  choice: दहलीज़ के ऊपर से
  rationale: यह उस स्थान से गति को व्यक्त करता है जो दहलीज़ के ऊपर था; हिन्दी में यह स्थानिक चित्र स्वाभाविक और स्पष्ट है।
- source_word: הַבָּיִת
  choice: भवन
  rationale: इब्रानी शब्द का मूल अर्थ ‘घर/भवन’ है। यहाँ संदर्भ मंदिर का है, पर मुख्य पाठ में स्रोत की शब्द-छवि बनाए रखने के लिए ‘भवन’ रखा गया है।
- source_word: וַיַּעֲמֹד
  choice: ठहर गई
  rationale: महिमा के एक स्थान पर आकर स्थित होने का दृश्य हिन्दी में ‘ठहर गई’ से स्वाभाविक रूप में व्यक्त होता है।
- source_word: עַל
  choice: के ऊपर
  rationale: करूबों के सापेक्ष ऊर्ध्व स्थान को बिना अनावश्यक रूप से भौतिक स्पर्श का संकेत दिए व्यक्त करता है।
- source_word: הַכְּרוּבִים
  choice: करूबों
  rationale: ‘करूब’ इब्रानी संज्ञा का हिन्दी में प्रचलित धार्मिक लिप्यंतरण है; हिन्दी बहुवचन ‘करूबों’ वाक्य में स्वाभाविक है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: प्रभु / यहोवा
  rationale: मूल पाठ में व्यक्तिगत ईश्वरीय नाम है। ‘याहवे’ उसका निकट लिप्यंतरण है और उसे किसी उपाधि से प्रतिस्थापित नहीं करता।
- issue: הַבָּיִת को शाब्दिक ‘भवन’ रखना या संदर्भानुसार ‘मंदिर’ कहना
  choice: भवन
  alternative: मंदिर
  rationale: संदर्भ निस्संदेह मंदिर का है, फिर भी इब्रानी में सामान्य शब्द ‘घर/भवन’ प्रयुक्त हुआ है। मुख्य पाठ इस शब्द-छवि को रखता है और पादटिप्पणी संदर्भगत विकल्प बताती है।
- issue: וַיַּעֲמֹד में मानवीकृत ‘खड़ी हो गई’ या स्थितिगत ‘ठहर गई’
  choice: ठहर गई
  alternative: खड़ी हो गई
  rationale: कर्ता ‘महिमा’ है; ‘ठहर गई’ मूल के स्थित होने के भाव को रखती है, पर महिमा को अनावश्यक रूप से मानवाकार नहीं बनाती।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और दृश्यात्मक रखी गई है। ‘भवन’ स्रोत के ‘घर’ रूपक और मंदिर-संदर्भ के बीच संतुलन बनाता है; पादटिप्पणी संभावित स्पष्टार्थ देती है।
