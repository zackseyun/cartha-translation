source:
  edition: WLC
  text: וַ/יֵּרֹ֖מּוּ הַ/כְּרוּבִ֑ים הִ֣יא הַ/חַיָּ֔ה אֲשֶׁ֥ר רָאִ֖יתִי בִּֽ/נְהַר כְּבָֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/010/015.yaml
  text: And the cherubim rose up[a]. They were the living creature that I had seen by the Kebar Canal.
translation:
  language: hi
  text: और करूब ऊपर उठे। ये वही जीवित प्राणी थे[a], जिन्हें मैंने कबार नहर के पास देखा था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से ‘वह जीवित प्राणी’ है, यद्यपि ‘करूब’ बहुवचन है। इसका आशय सम्भवतः इन करूबों की पहचान पहले देखे गए जीवित प्राणियों से कराना है। ‘कबार नहर’ का अनुवाद ‘कबार नदी’ भी किया जा सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֵּרֹמּוּ
  choice: ऊपर उठे
  rationale: रूम धातु यहाँ ऊपर की ओर गति बताती है। यह सक्रिय रूप के अनुरूप है और किसी बाहरी कर्ता द्वारा उठाए जाने का अनावश्यक संकेत नहीं देता।
- source_word: הַכְּרוּבִים
  choice: करूब
  rationale: ‘करूब’ हिन्दी बाइबलीय प्रयोग में प्रचलित रूप है; इब्रानी बहुवचन का अर्थ क्रिया ‘उठे’ से स्पष्ट है।
- source_word: הִיא הַחַיָּה
  choice: ये वही जीवित प्राणी थे
  rationale: इब्रानी में बहुवचन ‘करूबों’ के बाद स्त्रीलिंग एकवचन सर्वनाम और संज्ञा हैं। हिन्दी में बहुवचन संदर्भ के लिए ‘ये...थे’ स्वाभाविक है, जबकि ‘जीवित प्राणी’ को एकवचन रखकर मूल की व्याकरणिक और सामूहिक पहचान का तनाव बचाया गया है।
- source_word: אֲשֶׁר רָאִיתִי
  choice: जिन्हें मैंने ... देखा था
  rationale: ‘देखा था’ वर्तमान दर्शन से पहले हुए दर्शन को स्वाभाविक हिन्दी में व्यक्त करता है; ‘जिन्हें’ करूबों की ओर अर्थानुसार संकेत करता है।
- source_word: בִּנְהַר כְּבָר
  choice: कबार नहर के पास
  rationale: बाबुली परिवेश में נְהַר के लिए ‘नहर’ सम्भावित रूप से अधिक सटीक है। ‘कबार’ इब्रानी नाम का आधुनिक देवनागरी लिप्यंतरण है और בְּ का स्थानवाचक अर्थ ‘के पास’ से व्यक्त हुआ है।
theological_decisions:
- issue: करूबों की यहेजकेल 1 में देखे गए जीवित प्राणी से पहचान
  choice: बहुवचन संकेत ‘ये...थे’ के साथ एकवचन पद ‘वही जीवित प्राणी’ रखा गया।
  alternative: ‘ये वही जीवित प्राणी थे’ को पूर्णतः बहुवचन बनाकर ‘ये वही जीवित प्राणी थे’ पढ़ा जा सकता है, जहाँ हिन्दी में ‘प्राणी’ का रूप संख्या में अस्पष्ट है; अधिक स्पष्ट विकल्प ‘ये वही जीवित प्राणीगण थे’ होगा, पर वह अस्वाभाविक है।
  rationale: मूल पाठ में बहुवचन הַכְּרוּבִים के बाद एकवचन הִיא הַחַיָּה है। अनुवाद इसे किसी विशेष सिद्धान्त से हल करने के बजाय, स्वाभाविक हिन्दी की सीमा में सामूहिक/वर्गगत पहचान की सम्भावना बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘करूब’ और ‘जीवित प्राणी’ यहेजकेल के दर्शन की पारिभाषिक निरंतरता बनाए रखते हैं; मूल के असामान्य बहुवचन–एकवचन मेल को पादटिप्पणी में स्पष्ट किया गया है।
