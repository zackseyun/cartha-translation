reference: Ezekiel 10:4
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יָּ֤רָם כְּבוֹד יְהוָה֙ מֵ/עַ֣ל הַ/כְּר֔וּב עַ֖ל מִפְתַּ֣ן הַ/בָּ֑יִת וַ/יִּמָּלֵ֤א הַ/בַּ֨יִת֙ אֶת הֶ֣/עָנָ֔ן וְ/הֶֽ/חָצֵר֙ מָֽלְאָ֔ה אֶת נֹ֖גַהּ כְּב֥וֹד יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/010/004.yaml
  text: And the glory of Yahweh rose up from above the cherub to the threshold of the house[a], and the house was filled with the cloud[b], and the court was filled with the brightness of the glory of Yahweh.
translation:
  language: hi
  text: तब याहवे की महिमा करूब के ऊपर से[a] उठकर भवन[b] की दहलीज़ पर आ गई। भवन बादल से भर गया, और आँगन याहवे की महिमा की चमक से भर गया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: हिब्रू में यहाँ ‘करूब’ एकवचन में है। ‘करूब के ऊपर से’ का अनुवाद ‘करूब के ऊपर स्थित स्थान से’ भी किया जा सकता है।
    reason: lexical_alternative
  - marker: b
    text: यहाँ ‘भवन’ से आशय मंदिर के पवित्र भवन से है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּרָם
  choice: उठकर … आ गई
  rationale: रूם के ऊपर उठने अथवा ऊँचे स्थान से चलने के भाव को स्वाभाविक हिन्दी में व्यक्त करता है; गंतव्य को अगले पदबंध के साथ जोड़ा गया है।
- source_word: כְּבוֹד יְהוָה
  choice: याहवे की महिमा
  rationale: כָּבוֹד प्रकट दिव्य महिमा या उपस्थिति को दर्शाता है; יהוה को उसके व्यक्तिवाचक वाचा-नाम के रूप में ‘याहवे’ लिखा गया है।
- source_word: מֵעַל הַכְּרוּב
  choice: करूब के ऊपर से
  rationale: מֵעַל किसी वस्तु के ऊपर स्थित स्थान से गति को बताता है। हिब्रू का एकवचन כְּרוּב बनाए रखा गया है।
- source_word: עַל מִפְתַּן הַבָּיִת
  choice: भवन की दहलीज़ पर
  rationale: गति-सूचक क्रिया के साथ עַל गंतव्य ‘पर’ को दर्शाता है; מִפְתָּן ‘दहलीज़’ है और הַבַּיִת को निकट रूप से ‘भवन’ कहा गया है।
- source_word: וַיִּמָּלֵא הַבַּיִת אֶת הֶעָנָן
  choice: भवन बादल से भर गया
  rationale: हिब्रू में भवन के बादल से भर जाने का भाव है। निश्चित लेख के कारण ज्ञात दिव्य-उपस्थिति वाले बादल के लिए ‘बादल’ पर्याप्त और स्वाभाविक है।
- source_word: וְהֶחָצֵר מָלְאָה
  choice: और आँगन … भर गया
  rationale: חָצֵר मंदिर-परिसर के आँगन को दर्शाता है; हिन्दी में ‘आँगन’ सहज वास्तुशिल्पीय शब्द है।
- source_word: נֹגַהּ
  choice: चमक
  rationale: נֹגַהּ प्रकाशमान चमक या दीप्ति को दर्शाता है; ‘चमक’ स्पष्ट और सामान्य आधुनिक हिन्दी है।
theological_decisions:
- issue: יהוה का अनुवाद
  choice: याहवे
  alternative: प्रभु / यहोवा
  rationale: मूल पाठ में परमेश्वर का विशिष्ट वाचा-नाम है; ‘याहवे’ उसे उपाधि में बदले बिना व्यक्त करता है।
- issue: महिमा की गति में कर्तृत्व
  choice: महिमा उठकर दहलीज़ पर आ गई
  alternative: महिमा उठा ली गई
  rationale: וַיָּרָם को अकर्मक गति के रूप में रखा गया है, ताकि किसी अनकहे बाहरी कर्ता को पाठ में न जोड़ा जाए।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सहज रखी गई है। ‘करूब’ जैसे दर्शन-संबंधी पारिभाषिक शब्द को बनाए रखा गया है। दूसरे वाक्य के अंत में [b] का स्थान मुख्य पाठ में ‘भवन’ संबंधी टिप्पणी से दूर पड़ता था, इसलिए प्रकाशन-पाठ में इसे संबंधित शब्द के तुरंत बाद रखना अधिक उचित होगा; फिर भी दिए गए पाठ में सभी चिह्न उपस्थित हैं।
