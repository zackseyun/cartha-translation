lexical_decisions:
- source_word: הִיא הַחַיָּה
  choice: यह वही जीवित प्राणी था
  rationale: स्त्रीलिंग एकवचन सर्वनाम पहले वर्णित दर्शनात्मक प्राणी की पहचान कराता है। ‘यह वही ... था’ हिन्दी में पूर्व में देखे गए प्राणी की पहचान को स्वाभाविक रूप से व्यक्त करता है।
- source_word: אֲשֶׁר רָאִיתִי
  choice: जिसे मैंने ... देखा था
  rationale: सम्बन्धवाचक उपवाक्य को सहज आधुनिक हिन्दी में रखा गया है; पूर्ण भूतकाल स्मरणात्मक वर्णन के अनुकूल है।
- source_word: תַּחַת אֱלֹהֵי יִשְׂרָאֵל
  choice: इस्राएल के परमेश्वर के नीचे
  rationale: תַּחַת की स्थानवाचक छवि को सीधे सुरक्षित रखा गया है और ईश्वरीय उपाधि का अर्थ यथावत है।
- source_word: בִּנְהַר כְּבָר
  choice: कबार नहर के पास
  rationale: बाबुल की भौगोलिक पृष्ठभूमि में נְהַר के लिए ‘नहर’ सम्भावित और स्वाभाविक है; ‘के पास’ स्थानवाचक בְּ को स्पष्ट करता है। वैकल्पिक ‘नदी’ पादटिप्पणी में दिया गया है।
- source_word: וָאֵדַע
  choice: और मैंने जान लिया
  rationale: यह रूप यहेजकेल की पहचान या बोध के क्षण को व्यक्त करता है और केवल स्थिर ज्ञान की अपेक्षा कथानक की प्रगति को बेहतर दिखाता है।
- source_word: כִּי כְרוּבִים הֵמָּה
  choice: कि वे करूब थे
  rationale: כִּי को ज्ञान की विषय-वस्तु बताने वाले ‘कि’ से और הֵמָּה के बहुवचन को ‘वे’ से व्यक्त किया गया है। ‘करूब’ हिन्दी बाइबलीय प्रयोग में इस इब्रानी पद का स्वीकृत रूप है।
theological_decisions:
- issue: सिंहासन-दर्शन के प्राणियों की पहचान
  choice: ‘जीवित प्राणी’ और ‘करूब’ दोनों पद रखकर यहेजकेल की स्पष्ट पहचान को सुरक्षित रखा गया है।
  alternative: ‘जीवित प्राणी’ को सामान्य ‘जीव’ या ‘जीवित प्राणीगण’ कहना, अथवा करूब की पहचान को व्याख्यात्मक रूप से बदलना।
  rationale: पद स्वयं पहले देखे गए दर्शनात्मक प्राणी को करूबों के रूप में पहचानता है। एकवचन הַחַיָּה और बाद के बहुवचन הֵמָּה के बीच का वास्तविक व्याकरणिक तनाव भी अनावश्यक रूप से समतल नहीं किया गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘यह वही’ पहचान के बल को व्यक्त करता है; ‘जीवित प्राणी’ से अलौकिक दर्शनात्मक सन्दर्भ बना रहता है।
