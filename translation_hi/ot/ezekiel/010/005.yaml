source:
  edition: WLC
  text: וְ/קוֹל֙ כַּנְפֵ֣י הַ/כְּרוּבִ֔ים נִשְׁמַ֕ע עַד הֶ/חָצֵ֖ר הַ/חִיצֹנָ֑ה כְּ/ק֥וֹל אֵל שַׁדַּ֖י בְּ/דַבְּרֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/010/005.yaml
  text: And the sound of the wings of the cherubim was heard as far as the outer court[a], like the sound of God Almighty when he speaks.
translation:
  language: hi
  text: और करूबों के पंखों की आवाज़ बाहरी आँगन तक सुनाई दी; वह सर्वशक्तिमान परमेश्वर के बोलने पर सुनाई देनेवाली आवाज़ के समान थी।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इब्रानी: “एल शद्दाई के बोलने पर होनेवाली आवाज़ के समान।” यहाँ “एल शद्दाई” का अनुवाद “सर्वशक्तिमान परमेश्वर” किया गया है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְקוֹל
  choice: और ... आवाज़
  rationale: קוֹל के लिए यहाँ ‘आवाज़’ स्वाभाविक है, क्योंकि आगे उसी शब्द का प्रयोग परमेश्वर के बोलने की आवाज़ के लिए भी हुआ है; וְ कथा का क्रम जोड़ता है।
- source_word: כַּנְפֵי הַכְּרוּבִים
  choice: करूबों के पंखों की
  rationale: כָּנָף का ठोस अर्थ ‘पंख’ रखा गया है और כְּרוּבִים को प्रचलित बाइबलीय रूप ‘करूब’ के बहुवचन में दिया गया है।
- source_word: נִשְׁמַע עַד הֶחָצֵר הַחִיצֹנָה
  choice: बाहरी आँगन तक सुनाई देती थी
  rationale: निफ़अल रूप का निष्क्रिय अर्थ और עַד का विस्तार-सूचक भाव सुरक्षित है; मन्दिर-परिसर के חָצֵר के लिए ‘आँगन’ सामान्य पाठक के लिए सहज है।
- source_word: כְּקוֹל
  choice: उसकी आवाज़ जैसी होती है
  rationale: כְּ की स्पष्ट उपमा और קוֹל का श्रव्य अर्थ बनाए रखा गया है; हिंदी वाक्य-क्रम में संबंध स्पष्ट करने के लिए ‘उसकी’ प्रयुक्त है।
- source_word: אֵל שַׁדַּי
  choice: सर्वशक्तिमान परमेश्वर
  rationale: दैवी उपाधि का अर्थानुवाद किया गया है। यह आधुनिक हिंदी में स्पष्ट और प्रतिष्ठित रूप है।
- source_word: בְּדַבְּרוֹ
  choice: जब ... बोलता है
  rationale: בְּ के साथ infinitive construct और प्रत्यय को कालगत परिस्थिति ‘जब वह बोलता है’ के रूप में प्रस्तुत किया गया है; सामान्य/विशेषतामूलक वर्तमान भाव सुरक्षित है।
theological_decisions:
- issue: दैवी उपाधि אֵל שַׁדַּי का अनुवाद
  choice: सर्वशक्तिमान परमेश्वर
  alternative: एल शद्दाई
  rationale: शीर्षक का अर्थ पाठ में स्पष्ट किया गया है, जबकि मूल इब्रानी रूप को पादटिप्पणी में सुरक्षित रखा गया है; इससे किसी अतिरिक्त साम्प्रदायिक अर्थ को आरोपित किए बिना उपाधि का पारंपरिक आशय व्यक्त होता है।
translation_notes:
  register: आधुनिक मानक हिंदी; गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। ‘आँगन’ को मन्दिर के बाहरी प्रांगण के अर्थ में रखा गया है। उपमा को स्वाभाविक हिंदी के लिए पुनर्व्यवस्थित किया गया है, बिना उसके अर्थ को निर्णायक रूप से बदलने के।
