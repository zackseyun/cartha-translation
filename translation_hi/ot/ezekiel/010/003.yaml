source:
  edition: WLC
  text: וְ/הַ/כְּרֻבִ֗ים עֹֽמְדִ֛ים מִ/ימִ֥ין לַ/בַּ֖יִת בְּ/בֹא֣/וֹ הָ/אִ֑ישׁ וְ/הֶ/עָנָ֣ן מָלֵ֔א אֶת הֶ/חָצֵ֖ר הַ/פְּנִימִֽית־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/010/003.yaml
  text: The cherubim were standing on the right side of the house when the man went in[a], and the cloud filled the inner court.
translation:
  language: hi
  text: जब वह पुरुष भीतर गया, तब करूब भवन की दाहिनी ओर[a] खड़े थे, और बादल ने भीतरी आँगन को भर दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक अर्थ: “भवन की दाहिनी ओर।” मन्दिर के अभिमुखीकरण में यह दक्षिण की ओर संकेत करता है।'
    reason: स्थानगत अभिव्यक्ति के शाब्दिक रूप और उसके सम्भावित दिशासूचक आशय को स्पष्ट करना।
lexical_decisions:
- source_word: הַכְּרֻבִים
  choice: करूब
  rationale: इन स्वर्गीय प्राणियों के लिए प्रचलित बाइबलीय लिप्यंतरण रखा गया है; हिन्दी में ‘करूब’ का यही रूप बहुवचन सन्दर्भ में भी स्वाभाविक है।
- source_word: עֹמְדִים
  choice: खड़े थे
  rationale: कृदन्त दृश्य में जारी अवस्था बताता है, इसलिए ‘खड़े थे’ उपयुक्त है।
- source_word: מִימִין לַבַּיִת
  choice: भवन की दाहिनी ओर
  rationale: मूल का दिशासूचक शब्द शाब्दिक रूप से ‘दाहिनी ओर’ है; मन्दिर के अभिमुखीकरण में इसका संकेत दक्षिण दिशा की ओर हो सकता है, जिसे पादटिप्पणी में स्पष्ट किया गया है।
- source_word: בְּבֹאוֹ הָאִישׁ
  choice: जब वह पुरुष भीतर गया
  rationale: בְּ सहित infinitive construct का कालगत अर्थ ‘जब ... गया’ है। निश्चित पुरुष का पूर्वसन्दर्भ हिन्दी में ‘वह पुरुष’ से स्वाभाविक रूप से व्यक्त होता है।
- source_word: הֶעָנָן
  choice: बादल
  rationale: निश्चित संज्ञा का सीधा और सहज हिन्दी रूप; यहाँ मुख्य पाठ में उसके धार्मिक आशय का विस्तार नहीं किया गया।
- source_word: מָלֵא
  choice: भर गया
  rationale: पूर्ण घटना को व्यक्त करने वाले qatal का स्वाभाविक हिन्दी आख्यानात्मक रूप।
- source_word: הֶחָצֵר הַפְּנִימִית
  choice: भीतरी आँगन
  rationale: मन्दिर-परिसर के inner court के लिए सामान्य पाठक को समझ आने वाला स्वाभाविक स्थापत्य पद।
theological_decisions:
- issue: מִימִין का दिशासूचक अर्थ
  choice: मुख्य पाठ में ‘दाहिनी ओर’ रखा गया
  alternative: ‘दक्षिण की ओर’
  rationale: इब्रानी पाठ सीधे ‘दाहिनी ओर’ कहता है। मन्दिर के अभिमुखीकरण से सम्भावित ‘दक्षिण’ अर्थ को पादटिप्पणी में देकर मूल अभिव्यक्ति और स्थानगत संकेत दोनों सुरक्षित रखे गए हैं।
- issue: הָאִישׁ की पहचान
  choice: ‘वह पुरुष’
  alternative: ‘सन के वस्त्र पहने हुए पुरुष’
  rationale: इस पद में केवल ‘पुरुष’ कहा गया है; पिछली पहचान को मुख्य पाठ में दोहराकर स्रोत से अधिक नहीं जोड़ा गया।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सहज मानक हिन्दी। ‘भवन’ मन्दिर के भवन के लिए रखा गया है और ‘भीतरी आँगन’ सामान्य पाठक के लिए स्पष्ट स्थापत्य भाषा है।
