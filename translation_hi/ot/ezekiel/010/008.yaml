    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּרָא
  choice: दिखाई दी
  rationale: निफ़अल रूप दृश्य होने या दिखाई देने का भाव व्यक्त करता है। हिन्दी में यह निष्क्रिय और प्रेक्षणात्मक अर्थ स्वाभाविक रूप से बनाए रखता है।
- source_word: לַכְּרֻבִים
  choice: करूबों के
  rationale: ל उपसर्ग वाले इस वाक्य को हिन्दी की स्वाभाविक रचना में करूबों के पंखों से जोड़कर व्यक्त किया गया है; इससे दृश्य का स्थान स्पष्ट रहता है और अर्थ नहीं बदलता।
- source_word: תַּבְנִית
  choice: जैसी आकृति
  rationale: यह शब्द रूप, प्रतिरूप या आकृति का बोध कराता है। दर्शन के संदर्भ में ‘आकृति’ दृश्य समानता को स्पष्ट और सहज ढंग से व्यक्त करता है।
- source_word: יַד אָדָם
  choice: मनुष्य के हाथ
  rationale: यह एकवचन पदबंध है जिसका शाब्दिक अर्थ ‘मनुष्य का हाथ’ है। आधुनिक हिन्दी में ‘मनुष्य के हाथ जैसी’ प्राकृतिक है और इसे किसी विशेष पुरुष व्यक्ति तक अनावश्यक रूप से सीमित नहीं करती।
- source_word: תַּחַת כַּנְפֵיהֶם
  choice: उनके पंखों के नीचे
  rationale: यह सीधा स्थानसूचक पदबंध है और मूल के बहुवचन संबंध को सुरक्षित रखता है।
theological_decisions:
- issue: दर्शनात्मक शारीरिक वर्णन में אָדָם का अनुवाद
  choice: मनुष्य के हाथ
  alternative: आदमी के हाथ
  rationale: यहाँ אָדָם मानव-हाथ की आकृति बताता है, किसी पहचाने हुए पुरुष का हाथ नहीं। ‘मनुष्य’ मूल की एकवचन अभिव्यक्ति और मानव-संदर्भ दोनों को गरिमापूर्ण आधुनिक हिन्दी में बनाए रखता है।
