  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘दिखाई दी’ मूल की दृश्यात्मक निष्क्रियता को और ‘जैसी आकृति’ दर्शन में देखी गई समानता को स्वाभाविक हिन्दी में व्यक्त करता है।
