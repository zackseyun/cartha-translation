base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/010/009.yaml
  text: And I looked[a], and behold, four wheels beside the cherubim, one wheel beside each cherub; and the appearance of the wheels was like beryl stone.
translation:
  language: hi
  text: मैंने देखा, और देखो, करूबों के पास चार पहिए थे—हर करूब के पास एक पहिया। पहियों का रूप तर्शीश के रत्न[a] के समान था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में “तर्शीश का पत्थर”; इस रत्न की ठीक-ठीक पहचान निश्चित नहीं है। यह बेरिल, क्राइसोलाइट या कोई अन्य बहुमूल्य पत्थर हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶרְאֶה
  choice: मैंने देखा
  rationale: दर्शन-वर्णन में ראה का सीधा और स्वाभाविक हिन्दी रूप; इसके बाद וְהִנֵּה दृश्य की ओर ध्यान खींचता है।
- source_word: וְהִנֵּה
  choice: और देखो
  rationale: भविष्यद्वाणी के दर्शन में इस संकेतक की सजीव, ध्यानाकर्षक शक्ति बनाए रखता है।
- source_word: אַרְבָּעָה אוֹפַנִּים
  choice: चार पहिए
  rationale: यहेजकेल के दर्शन के संदर्भ में אוֹפַן का सामान्य और स्पष्ट अर्थ 'पहिया' है।
- source_word: אֵצֶל הַכְּרוּבִים
  choice: करूबों के पास
  rationale: אֵצֶל निकटता व्यक्त करता है; 'के पास' आधुनिक हिन्दी में स्वाभाविक है और स्थान को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: אוֹפַן אֶחָד אֵצֶל הַכְּרוּב אֶחָד
  choice: हर करूब के पास एक पहिया
  rationale: इब्रानी के दोहराए गए 'एक...एक' का वितरणात्मक अर्थ सहज हिन्दी में व्यक्त करता है।
- source_word: וּמַרְאֵה הָאוֹפַנִּים
  choice: पहियों का रूप
  rationale: מַרְאֶה यहाँ दिखाई देने वाले स्वरूप या आभा को सूचित करता है; 'रूप' संक्षिप्त और स्वाभाविक है।
- source_word: כְּעֵין אֶבֶן תַּרְשִׁישׁ
  choice: तर्शीश के रत्न के समान
  rationale: रत्न की अनिश्चित पहचान को किसी विशेष आधुनिक खनिज-नाम से तय किए बिना मूल पद תַּרְשִׁישׁ सुरक्षित रखता है; אֶבֶן को संदर्भानुसार 'रत्न' कहा गया है।
