  text: וַ/יִּשְׂא֣וּ הַ/כְּרוּבִ֣ים אֶת כַּ֠נְפֵי/הֶם וַ/יֵּר֨וֹמּוּ מִן הָ/אָ֤רֶץ לְ/עֵינַ/י֙ בְּ/צֵאתָ֔/ם וְ/הָ/אֽוֹפַנִּ֖ים לְ/עֻמָּתָ֑/ם וַֽ/יַּעֲמֹ֗ד פֶּ֣תַח שַׁ֤עַר בֵּית יְהוָה֙ הַ/קַּדְמוֹנִ֔י וּ/כְב֧וֹד אֱלֹהֵֽי יִשְׂרָאֵ֛ל עֲלֵי/הֶ֖ם מִ/לְ/מָֽעְלָ/ה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/010/019.yaml
  text: Then the cherubim lifted up their wings and rose from the earth before my eyes as they went out[a], with the wheels beside them; and it stood at the entrance of the eastern gate of the house of Yahweh[c][b], and the glory of the God of Israel was above them, from above.
translation:
  language: hi
  text: तब करूबों ने अपने पंख उठाए और मेरे देखते-देखते, जब वे बाहर निकले, धरती से ऊपर उठ गए; और पहिए उनके साथ-साथ थे[a]। वह याहवे[c] के भवन के पूर्वी फाटक के प्रवेश-द्वार पर ठहर गया[b], और इस्राएल के परमेश्वर की महिमा ऊपर से उनके ऊपर थी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी पदबंध का अर्थ ‘उनके सामने/उनके अनुरूप’ या ‘उनके साथ-साथ’ भी हो सकता है; यह उनकी परस्पर मेल खाती स्थिति बताता है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में ‘ठहर गया’ एकवचन है। इसका कर्ता संभवतः करूबों और पहियों से बनी समूची सिंहासन-रथ संरचना है; कुछ अनुवाद प्रसंग के अनुसार ‘वे ठहर गए’ करते हैं।
    reason: alternative_reading
  - marker: c
    text: ‘याहवे’ इब्रानी ईश्वरीय नाम יהוה (YHWH) का लिप्यंतरण है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׂאוּ הַכְּרוּבִים אֶת־כַּנְפֵיהֶם
  choice: करूबों ने अपने पंख उठाए
  rationale: נשׂא का पंखों के साथ स्वाभाविक अर्थ ‘उठाना’ है; ‘करूब’ विशिष्ट बाइबलीय प्राणियों के नाम का प्रचलित लिप्यंतरण है।
- source_word: וַיֵּרוֹמּוּ מִן־הָאָרֶץ
  choice: धरती से ऊपर उठ गए
  rationale: यह दृश्यगत ऊर्ध्वगमन व्यक्त करता है; हिन्दी में यह रूप स्वाभाविक रहते हुए मूल गति को बनाए रखता है।
- source_word: לְעֵינַי בְּצֵאתָם
  choice: मेरे देखते-देखते, जब वे बाहर निकले
  rationale: לְעֵינַי प्रत्यक्षदर्शी दृष्टिकोण और בְּצֵאתָם साथ-साथ घट रही क्रिया को व्यक्त करता है।
- source_word: וְהָאוֹפַנִּים לְעֻמָּתָם
  choice: पहिए उनके साथ उसी स्थिति में थे
  rationale: לְעֻמָּתָם अनुरूप, आमने-सामने या साथ की स्थानिक स्थिति दर्शाता है; मुख्य पाठ सामान्य संबंध रखता है और पादटिप्पणी विकल्प स्पष्ट करती है।
- source_word: פֶּתַח שַׁעַר בֵּית יְהוָה הַקַּדְמוֹנִי
  choice: याहवे के भवन के पूर्वी फाटक के प्रवेश पर
  rationale: ‘भवन’ בֵּית का औपचारिक अनुरूप है और मंदिर-भवन की छवि बनाए रखता है; הַקַּדְמוֹנִי यहाँ पूर्व दिशा का सूचक है।
- source_word: וּכְבוֹד אֱלֹהֵי יִשְׂרָאֵל עֲלֵיהֶם מִלְמָעְלָה
  choice: इस्राएल के परमेश्वर की महिमा उनके ऊपर, ऊँचाई में थी
  rationale: ‘उनके ऊपर’ और ‘ऊँचाई में’ दोनों रखकर עֲלֵיהֶם और מִלְמָעְלָה के संयुक्त स्थानिक बल को बिना लोप किए व्यक्त किया गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल में चतुरक्षरीय व्यक्तिगत नाम है; लिप्यंतरण नाम को सामान्य उपाधि में बदलने से बचाता है।
- issue: וַיַּעֲמֹד का कर्ता
  choice: एकवचन ‘वह ... ठहर गया’
  alternative: बहुवचन ‘वे ठहर गए’
  rationale: इब्रानी क्रिया पुल्लिंग एकवचन है, यद्यपि पहले करूब और पहिए बहुवचन हैं। एकवचन को बनाए रखने से संभावित सामूहिक रथ-सिंहासन संरचना अथवा अन्य अस्पष्ट एकवचन कर्ता के बीच तनाव सुरक्षित रहता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और कथात्मक है। ‘मेरे देखते-देखते’ प्रत्यक्ष दर्शन की जीवंतता देता है। असामान्य एकवचन क्रिया और अंतिम स्थानिक अभिव्यक्ति को सहजता के नाम पर हटाया या बहुवचन में नहीं बदला गया।
