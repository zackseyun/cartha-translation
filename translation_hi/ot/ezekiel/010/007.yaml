  edition: WLC
  text: וַ/יִּשְׁלַח֩ הַ/כְּר֨וּב אֶת יָד֜/וֹ מִ/בֵּינ֣וֹת לַ/כְּרוּבִ֗ים אֶל הָ/אֵשׁ֙ אֲשֶׁר֙ בֵּינ֣וֹת הַ/כְּרֻבִ֔ים וַ/יִּשָּׂא֙ וַ/יִּתֵּ֔ן אֶל חָפְנֵ֖י לְבֻ֣שׁ הַ/בַּדִּ֑ים וַ/יִּקַּ֖ח וַ/יֵּצֵֽא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/010/007.yaml
  text: Then the cherub stretched out his hand from among the cherubim to the fire that was among the cherubim[a], and he lifted it up and put it into the palms of the one clothed in linen[b], who took it and went out.
translation:
  language: hi
  text: तब उस करूब ने करूबों के बीच से अपना हाथ उस आग की ओर बढ़ाया जो करूबों के बीच थी[a]। उसने उसमें से उठाकर सन के वस्त्र पहने हुए व्यक्ति की हथेलियों में रख दिया[b]; उसने उसे लिया और बाहर चला गया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक शब्दशः: “करूबों के बीच में से” ... “वह आग जो करूबों के बीच में थी।”'
    reason: lexical_alternative
  - marker: b
    text: शब्दशः, “सन के वस्त्र पहने हुए की हथेलियों में”; संदर्भ में यह वही व्यक्ति है जिसे 10:2 और 10:6 में “सन के वस्त्र पहना हुआ मनुष्य” कहा गया है।
    reason: cross_reference
lexical_decisions:
- source_word: הַכְּרוּב
  choice: उस करूब
  rationale: निश्चित उपपद सहित एकवचन है; दृश्य में करूबों में से एक विशेष करूब कार्य करता है।
- source_word: וַיִּשְׁלַח ... אֶת־יָדוֹ
  choice: अपना हाथ ... बढ़ाया
  rationale: हाथ के साथ यह प्रयोग हाथ आगे बढ़ाने का स्वाभाविक अर्थ देता है और शारीरिक क्रिया को स्पष्ट रखता है।
- source_word: מִבֵּינוֹת לַכְּרוּבִים
  choice: करूबों के बीच से
  rationale: בינות का स्थानवाचक अर्थ ‘बीच/मध्य में’ है; ‘के बीच से’ स्रोत की औपचारिक स्थानिक संरचना को स्वाभाविक हिन्दी में रखता है।
- source_word: הָאֵשׁ אֲשֶׁר בֵּינוֹת הַכְּרֻבִים
  choice: उस आग ... जो करूबों के बीच थी
  rationale: निश्चित आग और पहले आए स्थानवाचक वर्णन की पुनरावृत्ति दोनों सुरक्षित रहती हैं।
- source_word: וַיִּשָּׂא
  choice: उसमें से उठाकर
  rationale: क्रिया का मूल भाव उठाना है। हिन्दी में ‘उसमें से’ आग में से ली गई सामग्री की ओर संकेत करता है, पर ‘अंगारे’ जैसा कोई संज्ञापद नहीं जोड़ता।
- source_word: וַיִּתֵּן
  choice: रख दिया
  rationale: सामग्री को प्राप्तकर्ता की हथेलियों पर देने की ठोस क्रिया के लिए यह स्वाभाविक हिन्दी है।
- source_word: חָפְנֵי
  choice: हथेलियों पर
  rationale: शब्द हाथों की खोखली अथवा अंजुलिनुमा हथेलियों को सूचित करता है; सामान्य ‘हाथों’ की अपेक्षा ‘हथेलियों’ अधिक सटीक है।
- source_word: לְבֻשׁ הַבַּדִּים
  choice: मलमल के वस्त्र पहने हुए व्यक्ति
  rationale: בַּד यहाँ सन के महीन कपड़े/linen के वस्त्रों को सूचित करता है। पद में ‘मनुष्य’ स्पष्टतः दोहराया नहीं गया, इसलिए सामान्य ‘व्यक्ति’ से संदर्भ स्पष्ट किया गया है और संदर्भगत पहचान पादटिप्पणी में दी गई है।
- source_word: וַיִּקַּח וַיֵּצֵא
  choice: उसने उसे लिया और बाहर चला गया
  rationale: कर्ता अब वस्त्र पहना हुआ व्यक्ति है; हिन्दी में नया वाक्य कर्ता-परिवर्तन को स्पष्ट करते हुए क्रियाओं का क्रम बनाए रखता है।
theological_decisions:
- issue: प्राप्तकर्ता की पहचान
  choice: मलमल के वस्त्र पहने हुए व्यक्ति
  alternative: मलमल के वस्त्र पहना हुआ मनुष्य
  rationale: इस पद में केवल ‘मलमल के वस्त्र पहने हुए’ कहा गया है, यद्यपि 10:2 और 10:6 उसी पात्र को मनुष्य कहते हैं। मुख्य पाठ पद की न्यूनतम अभिव्यक्ति रखता है और संदर्भगत पहचान पादटिप्पणी में बताता है।
- issue: उठाई गई वस्तु की प्रकृति
  choice: उसमें से उठाकर ... उसे
  alternative: आग/अंगारों में से कुछ उठाकर
  rationale: हिब्रू में प्रत्यक्ष कर्म व्यक्त नहीं है। संदर्भ आग अथवा उसके अंगारों की ओर संकेत करता है, पर मुख्य पाठ उसे ‘अंगारे’ कहकर अस्पष्टता को समाप्त नहीं करता।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सहज मानक हिन्दी। ‘करूब’ तकनीकी बाइबलीय पद के रूप में रखा गया है। ‘बीच’ की पुनरावृत्ति स्रोत की दृश्यात्मक संरचना को सुरक्षित रखती है; कर्ता बदलने पर वाक्य-विभाजन अस्पष्टता घटाता है।
