source:
  edition: WLC
  text: וַ/יְהִ֗י בְּ/צַוֺּת/וֹ֙ אֶת הָ/אִ֤ישׁ לְבֻֽשׁ הַ/בַּדִּים֙ לֵ/אמֹ֔ר קַ֥ח אֵשׁ֙ מִ/בֵּינ֣וֹת לַ/גַּלְגַּ֔ל מִ/בֵּינ֖וֹת לַ/כְּרוּבִ֑ים וַ/יָּבֹא֙ וַֽ/יַּעֲמֹ֔ד אֵ֖צֶל הָ/אוֹפָֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/010/006.yaml
  text: And it happened[a], when he commanded the man clothed in linen, saying, “Take fire from between the wheelwork, from between the cherubim,” that he went in and stood beside the wheel.
translation:
  language: hi
  text: और ऐसा हुआ कि जब उसने सन के वस्त्र पहने हुए उस पुरुष को आज्ञा दी, “पहिया-तंत्र[a] के बीच से, करूबों के बीच से आग ले,” तब वह भीतर गया और पहिए के पास खड़ा हो गया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “पहिए के बीच से” अथवा “घूमती पहिया-संरचना के बीच से”; यहाँ इब्रानी גַּלְגַּל पहिए या दर्शन में दिखाई देने वाले घूमते पहिया-तंत्र को सूचित कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: और ऐसा हुआ कि
  rationale: यह इब्रानी कथात्मक सूत्र अगले घटनाक्रम को आरम्भ करता है। यह रूप उसके प्रवचनात्मक कार्य को बनाए रखते हुए आधुनिक हिन्दी में स्वाभाविक है।
- source_word: בְּצַוֺּתוֹ
  choice: जब उसने ... आज्ञा दी
  rationale: בְּ के साथ infinitive construct और तृतीय पुरुष एकवचन प्रत्यय समय का अर्थ देते हैं। कर्ता को केवल ‘उसने’ रखा गया है, क्योंकि इस पद में इब्रानी उसका नाम दोबारा नहीं बताती।
- source_word: הָאִישׁ לְבֻשׁ הַבַּדִּים
  choice: सन के वस्त्र पहने हुए उस पुरुष
  rationale: यह दर्शन में पहले से परिचित निश्चित पुरुष है। ‘सन के वस्त्र’ בַּדִּים का स्पष्ट और गरिमापूर्ण हिन्दी रूप है।
- source_word: קַח אֵשׁ
  choice: आग ले
  rationale: आज्ञार्थक क्रिया और उसके कर्म का सीधा, संक्षिप्त अनुवाद।
- source_word: מִבֵּינוֹת לַגַּלְגַּל
  choice: पहिया-तंत्र के बीच से
  rationale: दर्शन के संदर्भ में גַּלְגַּל किसी पहिए अथवा घूमती पहिया-संरचना को सूचित कर सकता है। ‘पहिया-तंत्र’ सामूहिक/संरचनात्मक भाव रखता है और आगे आए אוֹפָן से शब्दगत अंतर भी बनाए रखता है।
- source_word: מִבֵּינוֹת לַכְּרוּבִים
  choice: करूबों के बीच से
  rationale: मूल इब्रानी की स्थानवाचक पुनरावृत्ति को बल और दृश्य की स्पष्टता के लिए बनाए रखा गया है।
- source_word: וַיָּבֹא
  choice: वह भीतर गया
  rationale: संदर्भ में पुरुष दर्शन के उस भीतरी स्थान की ओर बढ़ता है जहाँ करूब और पहिए हैं; इसलिए केवल ‘आया’ की अपेक्षा यह दिशा को अधिक स्पष्ट करता है।
- source_word: וַיַּעֲמֹד אֵצֶל הָאוֹפָן
  choice: पहिए के पास खड़ा हो गया
  rationale: אוֹפָן का सामान्य अर्थ ‘पहिया’ है और मूल के अनुसार एकवचन रखा गया है; אֵצֶל के लिए ‘के पास’ स्वाभाविक हिन्दी है।
theological_decisions:
- issue: आज्ञा देने वाले अनाम कर्ता की पहचान
  choice: कर्ता को केवल ‘उसने’ कहा गया है।
  alternative: ‘यहोवा ने’, ‘सिंहासन पर बैठे हुए ने’ अथवा किसी अन्य स्पष्ट पहचान का प्रयोग।
  rationale: इस उपवाक्य में इब्रानी केवल तृतीय पुरुष प्रत्यय देती है और कर्ता की पहचान फिर से स्पष्ट नहीं करती। किसी धर्मवैचारिक पहचान को अनुवाद में जोड़ने के बजाय मूल की संदर्भगत अस्पष्टता बनाए रखी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज किंतु गरिमापूर्ण कथात्मक रूप अपनाया गया है। ‘करूब’ दर्शन के विशिष्ट स्वर्गीय प्राणियों के लिए पारंपरिक पारिभाषिक शब्द है। वाक्य में मूल की दोहरी ‘के बीच से’ संरचना जानबूझकर सुरक्षित रखी गई है।
