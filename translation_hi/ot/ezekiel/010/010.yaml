translation:
  language: hi
  text: और उन चारों का रूप एक-सा था—मानो एक पहिया दूसरे पहिए के भीतर हो।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּמַרְאֵיהֶם
  choice: उन चारों का रूप
  rationale: מַרְאֶה दृश्य रूप या बनावट को दर्शाता है। हिन्दी में वाक्य के विषय और अगले पदबंध के सम्बन्ध को स्पष्ट तथा स्वाभाविक बनाने के लिए सर्वनाम के साथ ‘रूप’ चुना गया है।
- source_word: דְּמוּת אֶחָד לְאַרְבַּעְתָּם
  choice: एक ही जैसा था
  rationale: דְּמוּת אֶחָד चारों की समान आकृति पर बल देता है। ‘एक ही जैसा’ आधुनिक हिन्दी में इस एकरूपता को सहज रूप से व्यक्त करता है, बिना उनके स्वरूप की अधिक व्याख्या किए।
- source_word: כַּאֲשֶׁר יִהְיֶה
  choice: मानो ... हो
  rationale: यह तुलना प्रस्तुत करने वाला पदबंध है। ‘मानो’ दर्शनीय उपमा को स्वाभाविक और गरिमापूर्ण हिन्दी में रखता है।
- source_word: הָאוֹפַן בְּתוֹךְ הָאוֹפָן
  choice: एक पहिया दूसरे पहिए के भीतर
  rationale: इब्रानी में दोनों संज्ञाएँ निश्चित उपपद के साथ हैं, पर हिन्दी उपमा में ‘एक ... दूसरे ...’ पहियों के पारस्परिक विन्यास को स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है। ‘भीतर’ בְּתוֹךְ के स्थानिक अर्थ को सुरक्षित रखता है।
