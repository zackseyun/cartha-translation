  text: וּ/דְמ֣וּת פְּנֵי/הֶ֔ם הֵ֣מָּה הַ/פָּנִ֗ים אֲשֶׁ֤ר רָאִ֨יתִי֙ עַל נְהַר כְּבָ֔ר מַרְאֵי/הֶ֖ם וְ/אוֹתָ֑/ם אִ֛ישׁ אֶל עֵ֥בֶר פָּנָ֖י/ו יֵלֵֽכוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/010/022.yaml
  text: And the likeness of their faces was the same as the faces that I had seen by the Kebar River—their appearances and themselves[b][a]. Each one went straight ahead.
translation:
  language: hi
  text: उनके चेहरों की आकृति उन चेहरों जैसी थी जिन्हें मैंने कबार नदी के पास देखा था—उनके रूप और वे स्वयं भी वही थे[a]। हर एक सीधे सामने की ओर बढ़ता था[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “उनके रूप और वे स्वयं।” यह इस बात पर बल देता है कि ये वही प्राणी थे जिन्हें यहेजकेल ने पहले कबार नदी के पास देखा था।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “हर एक अपने चेहरे की दिशा में चलता था”; अर्थात वे बिना मुड़े सीधे आगे बढ़ते थे।
    reason: lexical_alternative
lexical_decisions:
- source_word: וּדְמוּת פְּנֵיהֶם
  choice: उनके चेहरों का रूप
  rationale: דְּמוּת समानता, आकृति या रूप को दर्शाता है। ‘रूप’ सहज हिन्दी में है और यहेजकेल के दर्शन की ठोस दृश्यात्मक भाषा को बनाए रखता है।
- source_word: הֵמָּה הַפָּנִים אֲשֶׁר רָאִיתִי
  choice: उन चेहरों के समान था जिन्हें मैंने ... देखा था
  rationale: हिब्रू का बल वर्तमान दर्शन के चेहरों और पहले देखे गए चेहरों की समानता पर है। हिन्दी में यह रचना उस संबंध को स्पष्ट और स्वाभाविक ढंग से व्यक्त करती है।
- source_word: עַל נְהַר כְּבָר
  choice: कबार नदी के पास
  rationale: नदी के साथ עַל यहाँ स्थान-सूचक है; ‘के पास’ आधुनिक हिन्दी में स्वाभाविक है। כְּבָר नाम का लिप्यंतरण ‘कबार’ किया गया है।
- source_word: מַרְאֵיהֶם וְאוֹתָם
  choice: उनका रूप भी और वे स्वयं भी
  rationale: यह संक्षिप्त हिब्रू पदबंध उनके दृश्य रूप के साथ उन्हीं प्राणियों की पहचान पर भी बल देता है। दोनों तत्व रखे गए हैं, यद्यपि हिन्दी में वाक्य जानबूझकर कुछ बलाघाती रहता है।
- source_word: אִישׁ אֶל עֵבֶר פָּנָיו יֵלֵכוּ
  choice: हर एक सीधे सामने की ओर बढ़ता था
  rationale: शाब्दिक चित्र में हर प्राणी अपने चेहरे की दिशा में जाता है। ‘सीधे सामने की ओर’ बिना मुड़े आगे बढ़ने के आशय को सहज हिन्दी में व्यक्त करता है।
