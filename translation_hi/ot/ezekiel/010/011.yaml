base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/010/011.yaml
  text: When they went, they would go in any of their four directions; they did not turn as they went, for to the place where the head faced, they followed after it; they did not turn as they went.
translation:
  language: hi
  text: जब वे चलते थे, तो अपनी चारों दिशाओं में से किसी भी दिशा में चलते थे। चलते समय वे मुड़ते नहीं थे, क्योंकि सिर जिस ओर मुड़ता था, वे उसके पीछे चलते थे। चलते समय वे मुड़ते नहीं थे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֶל אַרְבַּעַת רִבְעֵיהֶם
  choice: अपनी चारों दिशाओं में से किसी भी दिशा में
  rationale: चार संभावित दिशाओं में गति का भाव स्पष्ट करता है और पहियों के चारों ओर उन्मुख होने के संदर्भ को बनाए रखता है।
- source_word: הָרֹאשׁ
  choice: सिर
  rationale: मसोराई पाठ के सामान्य अर्थ को सीधे रखा गया है; अस्पष्ट संदर्भ को 'आगे वाला पहिया' आदि कहकर नहीं सुलझाया गया।
- source_word: אַחֲרָיו יֵלֵכוּ
  choice: वे उसी के पीछे चलते थे
  rationale: אַחֲרָיו के 'उसके पीछे' संबंध को सुरक्षित रखता है और यह तय नहीं करता कि सिर किस प्राणी या संरचना का है।
- source_word: לֹא יִסַּבּוּ בְּלֶכְתָּם
  choice: चलते समय वे मुड़ते नहीं थे
  rationale: दोहराए गए इब्रानी वाक्यांश का समान और स्वाभाविक हिन्दी रूप रखा गया है।
theological_decisions:
- issue: ‘सिर’ का अभिप्राय
  choice: शाब्दिक ‘सिर’ और उसका अस्पष्ट संदर्भ बनाए रखा गया
  alternative: ‘मुख्य पहिया’ या ‘आगे का भाग’
  rationale: मूल पाठ स्वयं संदर्भ को पूरी तरह स्पष्ट नहीं करता; किसी विशिष्ट यांत्रिक या प्रतीकात्मक व्याख्या को अनुवाद में आरोपित नहीं किया गया।
