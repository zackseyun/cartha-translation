base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/010/002.yaml
  text: And he said to the man clothed in linen[a], “Go in among the wheelwork, under the cherub, and fill your hands with coals of fire from among the cherubim, and scatter them over the city.” And he went in before my eyes.
translation:
  language: hi
  text: और उसने सन के वस्त्र पहने हुए पुरुष से कहा, “पहियों के बीच[a], करूब के नीचे जा, और करूबों के बीच से अपनी अंजलियाँ आग के अंगारों से भर ले और उन्हें नगर पर बिखेर दे।” तब वह मेरी आँखों के सामने भीतर चला गया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “पहियेदार ढाँचे के भीतर।” हिब्रू शब्द किसी एक पहिए के बजाय पहियों वाली पूरी संरचना को सामूहिक रूप से सूचित कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: לְבֻשׁ הַבַּדִּים
  choice: मलमल के वस्त्र पहने हुए
  rationale: בַּדִּים यहाँ याजकीय संदर्भ वाले महीन सन के वस्त्रों को सूचित करता है। ‘मलमल के वस्त्र’ आधुनिक हिन्दी में स्वाभाविक और विशिष्ट है, जबकि केवल ‘सन’ कपड़े के बजाय पौधे का बोध करा सकता है।
- source_word: בֵּינוֹת לַגַּלְגַּל
  choice: पहियों के बीच
  rationale: גַּלְגַּל एकवचन रूप में होते हुए भी यहाँ दर्शन के पहियेदार ढाँचे या पहियों के समूह का सामूहिक बोध दे सकता है। मुख्य पाठ में स्वाभाविक दृश्यात्मक हिन्दी रखी गई है और सामूहिक संरचना की सम्भावना पादटिप्पणी में सुरक्षित है।
- source_word: אֶל תַּחַת לַכְּרוּב
  choice: करूब के नीचे
  rationale: हिब्रू में करूब एकवचन है; इसलिए उसे बहुवचन में बदलने के बजाय स्थान-सूचक वाक्यांश को सीधे सुरक्षित रखा गया है।
- source_word: וּמַלֵּא חָפְנֶיךָ
  choice: अपनी दोनों मुट्ठियाँ ... भर ले
  rationale: חָפְנַיִם दोनों हथेलियों से बने खोखले भाग या अंजलि को दर्शाता है। ‘दोनों मुट्ठियाँ भर ले’ सामान्य आधुनिक हिन्दी में क्रिया को स्पष्ट और ठोस बनाता है।
- source_word: גַחֲלֵי אֵשׁ
  choice: आग के अंगारे
  rationale: यह पदबंध अंगारों और उनकी अग्निमय अवस्था दोनों को उभारता है। ‘आग के अंगारे’ स्रोत की संज्ञात्मक छवि को बनाए रखता है।
- source_word: מִבֵּינוֹת לַכְּרֻבִים
  choice: करूबों के बीच से
  rationale: מִן और בֵּינוֹת मिलकर उस स्थान से उद्गम बताते हैं जो करूबों के बीच है; हिन्दी में ‘के बीच से’ इसका स्वाभाविक समतुल्य है।
- source_word: וּזְרֹק עַל הָעִיר
  choice: उन्हें नगर पर बिखेर दे
  rationale: निहित कर्म ‘अंगारों’ को ‘उन्हें’ से स्पष्ट किया गया है। ‘बिखेर दे’ अनेक अंगारों को नगर पर फैलाने की क्रिया व्यक्त करता है, पर उसके प्रतीक का अर्थ पाठ में नहीं जोड़ता।
- source_word: לְעֵינָי
  choice: मेरी आँखों के सामने
  rationale: यह यहेजकेल की प्रत्यक्षदर्शी भूमिका को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: וַיֹּאמֶר ... וַיֹּאמֶר
  choice: उसने ... से कहा
  rationale: हिब्रू की निकटवर्ती पुनरुक्ति को हिन्दी में दोहराने पर वाक्य अस्वाभाविक होता। एक ही ‘कहा’ दोनों का स्वाभाविक कार्य निभाता है और कथन की सामग्री अक्षुण्ण रखता है।
theological_decisions:
- issue: नगर पर अंगारे बिखेरने का अर्थ
  choice: आज्ञा को न्याय की प्रबल छवि के रूप में बिना व्याख्यात्मक विस्तार के प्रस्तुत किया गया है।
  alternative: इसे शुद्धिकरण अथवा न्याय और शुद्धिकरण दोनों का स्पष्ट प्रतीक बताना।
  rationale: निकट संदर्भ यरूशलेम पर न्याय की ओर संकेत करता है, पर यह पद स्वयं प्रतीक का अर्थ नहीं खोलता। इसलिए अनुवाद छवि और उसकी सम्भावित धार्मिक तनावशीलता को बनाए रखता है।
- issue: एकवचन ‘करूब’ और बहुवचन ‘करूबों’
  choice: दोनों व्याकरणिक संख्याओं को ज्यों का त्यों रखा गया है।
  alternative: दृश्य को सरल बनाने के लिए दोनों स्थानों पर ‘करूबों’ कहना।
  rationale: एकवचन सम्भवतः निकटतम करूब को इंगित करता है, जबकि अंगारे करूबों के समूह के बीच से लिए जाते हैं। इस भेद को मिटाना स्रोत के दृश्य-विन्यास को अनावश्यक रूप से स्पष्ट करना होता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण पर सहज शैली अपनाई गई है। दिव्य आज्ञा में निकट संबोधन के अनुरूप एकवचन ‘जा’, ‘भर ले’ और ‘बिखेर दे’ रखा गया है। ‘करूब’ पारंपरिक बाइबलीय तकनीकी पद के रूप में सुरक्षित है।
