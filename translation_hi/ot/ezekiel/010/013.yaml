lexical_decisions:
- source_word: לָאֹופַנִּים
  choice: जहाँ तक उन पहियों की बात है
  rationale: पहले לְ को यहाँ दिशा के बजाय विषय-सूचक मानना प्रसंग और वाक्य की संरचना के अनुकूल है।
- source_word: לָהֶם קוֹרָא
  choice: उन्हें … कहा गया
  rationale: शाब्दिक संरचना अस्पष्ट है, पर यहाँ קרא नाम दिए जाने को व्यक्त करता है और לָהֶם पहियों की ओर संकेत करता है; हिन्दी में कर्मवाच्य स्वाभाविक है।
- source_word: הַגַּלְגַּל
  choice: घूमता चक्र
  rationale: גַּלְגַּל में चक्र और घूमने, दोनों का भाव संभव है। “चक्र” पहले आए אֹופַנִּים (“पहियों”) से शब्दगत भेद बनाए रखता है, और “घूमता” इस दर्शनीय संदर्भ में शब्द के गतिशील भाव को व्यक्त करता है।
- source_word: בְּאָזְנָי
  choice: मेरे सुनते हुए
  rationale: यह नबी की प्रत्यक्ष श्रवण-साक्षी को बनाए रखता है और आधुनिक हिन्दी में सहज है।
