language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/אַרְבָּעָ֥ה פָנִ֖ים לְ/אֶחָ֑ד פְּנֵ֨י הָ/אֶחָ֜ד פְּנֵ֣י הַ/כְּר֗וּב וּ/פְנֵ֤י הַ/שֵּׁנִי֙ פְּנֵ֣י אָדָ֔ם וְ/הַ/שְּׁלִישִׁי֙ פְּנֵ֣י אַרְיֵ֔ה וְ/הָ/רְבִיעִ֖י פְּנֵי נָֽשֶׁר־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/010/014.yaml
  text: 'And each one had four faces: the face of the first was the face of the cherub[a], and the face of the second was the face of a man, and the third the face of a lion[b], and the fourth the face of an eagle.'
translation:
  language: hi
  text: 'और हर एक के चार मुख थे: पहले का मुख करूब का था[a], दूसरे का मनुष्य का, तीसरे का सिंह का, और चौथे का उकाब का था[b]।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहेजकेल 1:10 में संबंधित मुख को बैल का मुख बताया गया है; यहाँ इब्रानी पाठ में “करूब” है।
    reason: cross_reference
  - marker: b
    text: “उकाब” के स्थान पर “गिद्ध” भी सम्भव है; इब्रानी शब्द व्यापक अर्थ में किसी बड़े शिकारी पक्षी को सूचित कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַרְבָּעָה פָנִים לְאֶחָד
  choice: और हर एक के चार मुख थे
  rationale: इब्रानी वाक्य क्रियारहित है और शाब्दिक रूप से ‘और हर एक के लिए चार मुख’ कहता है। हिन्दी में ‘हर एक के चार मुख थे’ इसके वितरणात्मक भाव को स्वाभाविक और स्पष्ट ढंग से व्यक्त करता है।
- source_word: פְּנֵי הָאֶחָד
  choice: पहले का मुख
  rationale: הָאֶחָד यहाँ ‘दूसरे… तीसरे… चौथे’ के क्रम में क्रमवाचक अर्थ रखता है; इसलिए ‘पहले’ उपयुक्त है।
- source_word: הַכְּרוּב
  choice: करूब
  rationale: मूल पाठ में निश्चित उपपद है और शब्द स्पष्ट रूप से ‘करूब’ है। इसे यहेजकेल 1:10 के ‘बैल’ से मिलाने के लिए बदला नहीं गया।
- source_word: אָדָם
  choice: मनुष्य
  rationale: यहाँ शब्द मानव-मुख को दर्शाता है। आधुनिक मानक हिन्दी में ‘मनुष्य का मुख’ स्वाभाविक, सटीक और गरिमापूर्ण है।
- source_word: אַרְיֵה
  choice: सिंह
  rationale: यह सामान्य पशु-संज्ञा है; ‘सिंह का मुख’ मूल अर्थ का सीधा और स्वाभाविक अनुवाद है।
- source_word: נָשֶׁר
  choice: उकाब
  rationale: נָשֶׁר किसी बड़े शिकारी पक्षी को सूचित कर सकता है। ‘उकाब’ पारंपरिक गरुड़ाकार शिकारी पक्षी की छवि को रखता है, जबकि ‘गिद्ध’ की सम्भावना पादटिप्पणी में दी गई है।
theological_decisions:
- issue: यहाँ ‘करूब’ और यहेजकेल 1:10 में ‘बैल’ के मुख का संबंध
  choice: मूल इब्रानी के अनुसार ‘करूब’ का अनुवाद किया गया है।
  alternative: इसे यहेजकेल 1:10 से मिलाने के लिए ‘बैल’ या ‘बैल-जैसा करूब’ कहना।
  rationale: इस पद के प्राप्त इब्रानी पाठ में स्पष्ट रूप से ‘करूब’ है। अनुवाद इस भिन्नता और उससे उत्पन्न व्याख्यात्मक तनाव को बनाए रखता है; समानांतर पद की जानकारी पादटिप्पणी में दी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और दृश्यात्मक गद्य। सूची की समानांतर संरचना को रखा गया है और मूल पाठ की ‘करूब/बैल’ भिन्नता को बिना सामंजस्य बैठाए सुरक्षित रखा गया है।
