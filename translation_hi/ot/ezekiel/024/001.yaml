base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/024/001.yaml
  text: And the word of Yahweh came to me in the ninth year[a], in the tenth month, on the tenth day of the month, saying,
translation:
  language: hi
  text: 'और नौवें वर्ष में, दसवें महीने के दसवें दिन, याहवे का वचन मेरे पास आया:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי דְבַר יְהוָה אֵלַי
  choice: यहोवा का वचन ... मेरे पास पहुँचा
  rationale: हिब्रू का प्रचलित भविष्यद्वाणी-सूत्र स्वाभाविक आधुनिक हिन्दी में इस प्रकार व्यक्त होता है। ‘वचन’ दैवी वाणी का औपचारिक और धर्मवैचारिक भार बनाए रखता है, जबकि ‘पहुँचा’ וַיְהִי और אֵלַי के संयुक्त भाव को सहज ढंग से व्यक्त करता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: मूल पाठ में प्रयुक्त परमेश्वर के व्यक्तिगत नाम יהוה को किसी उपाधि से बदलने के बजाय हिन्दी में प्रचलित लिप्यंतरण ‘यहोवा’ से प्रस्तुत किया गया है।
- source_word: בַּשָּׁנָה הַתְּשִׁיעִית
  choice: नौवें वर्ष
  rationale: हिब्रू केवल ‘नौवें वर्ष’ कहता है; निर्वासन का संदर्भ मुख्य पाठ में जोड़ना मूल की संक्षिप्तता से आगे जाना होता।
- source_word: בַּחֹדֶשׁ הָעֲשִׂירִי
  choice: दसवें महीने
  rationale: तिथि-सूत्र में חֹדֶשׁ का स्वाभाविक अर्थ ‘महीना’ है।
- source_word: בֶּעָשׂוֹר לַחֹדֶשׁ
  choice: दसवें दिन
  rationale: यह मुहावरा महीने के भीतर दिन बताता है। हिन्दी वाक्य में ‘दसवें महीने के दसवें दिन’ स्पष्ट और स्वाभाविक है।
- source_word: לֵאמֹר
  choice: ':'
  rationale: यह शब्द अगले पद में आने वाली प्रत्यक्ष वाणी का परिचय देता है। हिन्दी में वाक्य के अंत का द्विबिंदु वही कार्य अधिक स्वाभाविक रूप से करता है; शाब्दिक ‘यह कहते हुए’ यहाँ कृत्रिम लगता।
theological_decisions:
- issue: יהוה का अनुवाद
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: व्यक्तिगत दिव्य नाम को उपाधि ‘प्रभु’ से प्रतिस्थापित नहीं किया गया। ‘यहोवा’ आधुनिक हिन्दी बाइबलीय प्रयोग में पहचाना जाने वाला रूप है, यद्यपि ‘याहवे’ मूल उच्चारण का एक अन्य सम्भावित लिप्यंतरण है।
- issue: ‘नौवें वर्ष’ का संदर्भ-बिंदु
  choice: मुख्य पाठ में अनिर्दिष्ट रखा गया
  alternative: यहोयाकीन के निर्वासन का नौवाँ वर्ष
  rationale: पुस्तक की तिथि-प्रणाली सम्भवतः राजा यहोयाकीन के निर्वासन से वर्षों की गणना करती है, पर इस पद का हिब्रू पाठ उस संदर्भ को स्पष्ट रूप से नहीं दोहराता। इसलिए उसे पादटिप्पणी में बताया गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। हिब्रू की भविष्यद्वाणी-सूत्र शैली को स्वाभाविक हिन्दी में ढाला गया है और अगले पद की वाणी का संकेत द्विबिंदु से दिया गया है।
