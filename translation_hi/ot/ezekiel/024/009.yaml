  edition: WLC
  text: לָ/כֵ֗ן כֹּ֤ה אָמַר֙ אֲדֹנָ֣/י יְהוִ֔ה א֖וֹי עִ֣יר הַ/דָּמִ֑ים גַּם אֲנִ֖י אַגְדִּ֥יל הַ/מְּדוּרָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/024/009.yaml
  text: 'Therefore thus says the Lord Yahweh: Woe to the city of bloodshed! I also will make the firewood pile great[a][b].'
translation:
  language: hi
  text: 'इसलिए प्रभु यहोवा यों कहता है: “हे रक्तपात के नगर, तुझ पर हाय! मैं भी ईंधन की ढेरी बढ़ाऊँगा[a][b]।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से ‘रक्तों का नगर’; यह रक्तपात या रक्तदोष से चिह्नित नगर के लिए प्रयुक्त मुहावरा है।
    reason: lexical_alternative
  - marker: b
    text: या, ‘मैं भी चिता को बड़ा करूँगा।’
    reason: alternative_reading
lexical_decisions:
- source_word: לָכֵן
  choice: इसलिए
  rationale: यह निष्कर्षसूचक संयोजक पिछले प्रसंग से न्याय की इस घोषणा का स्पष्ट संबंध बनाए रखता है।
- source_word: כֹּה אָמַר
  choice: यों कहता है
  rationale: यह नबी-संदेश की पारंपरिक उद्घोषणा है और आधुनिक हिन्दी में स्वाभाविक तथा गरिमापूर्ण है।
- source_word: אֲדֹנָי יְהוִה
  choice: प्रभु यहोवा
  rationale: אֲדֹנָי को ‘प्रभु’ और परमेश्वर के व्यक्तिगत नाम יהוה को ‘यहोवा’ के रूप में व्यक्त करता है।
- source_word: אוֹי
  choice: हाय
  rationale: यह विलाप और न्याय की चेतावनी, दोनों का तीखा भाव बनाए रखता है।
- source_word: עִיר הַדָּמִים
  choice: रक्तपात के नगर
  rationale: इब्रानी बहुवचन ‘रक्तों’ का आशय यहाँ हिंसक रक्तपात और उससे जुड़े दोष से है; यह चयन उस नैतिक आरोप को स्पष्ट रखता है।
- source_word: גַּם אֲנִי
  choice: मैं भी
  rationale: दिव्य कर्ता की जोरदार सहभागिता को सीधे व्यक्त करता है।
- source_word: אַגְדִּיל
  choice: बढ़ाऊँगा
  rationale: גדל के हिफ़ील रूप का अर्थ ‘बड़ा करना’ या ‘बढ़ाना’ है; ढेरी के साथ ‘बढ़ाऊँगा’ स्वाभाविक हिन्दी है।
- source_word: הַמְּדוּרָה
  choice: ईंधन की ढेरी
  rationale: संदर्भ में यह हांडी के नीचे आग तेज करने के लिए लकड़ी या ईंधन के ढेर को सूचित करता है; चयन ठोस और सामान्य पाठक के लिए स्पष्ट है।
theological_decisions:
- issue: संयुक्त उपाधि אֲדֹנָי יְהוִה में परमेश्वर के नाम का अनुवाद
  choice: प्रभु यहोवा
  alternative: प्रभु परमेश्वर
  rationale: मूल पाठ में उपाधि אֲדֹנָי के साथ चार-अक्षरीय व्यक्तिगत नाम יהוה स्पष्ट रूप से उपस्थित है; ‘प्रभु यहोवा’ दोनों को अलग-अलग बनाए रखता है और नाम को सामान्य उपाधि में नहीं बदलता।
- issue: ‘मैं भी’ में व्यक्त दिव्य प्रत्युत्तर
  choice: मैं भी ईंधन की ढेरी बढ़ाऊँगा
  alternative: मैं स्वयं ईंधन की ढेरी बढ़ाऊँगा
  rationale: גם का सामान्य योगात्मक और बलात्मक अर्थ ‘भी’ से सुरक्षित रहता है; ‘स्वयं’ चुनने पर योगात्मक संबंध कम स्पष्ट हो सकता था।
translation_notes:
  register: आधुनिक मानक हिन्दी में नबी-वाणी की गरिमा और तीव्रता रखी गई है। ‘यों कहता है’ पारंपरिक होते हुए भी सहज है; ‘ईंधन की ढेरी बढ़ाऊँगा’ हांडी और आग के निकटवर्ती प्रसंग को स्पष्ट रखता है, जबकि अधिक विशिष्ट ‘चिता’ को पादटिप्पणी में दिया गया है।
