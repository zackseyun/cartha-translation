language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: בַּ/יּ֣וֹם הַ/ה֗וּא יִפָּ֤תַח פִּ֨י/ךָ֙ אֶת הַ/פָּלִ֔יט וּ/תְדַבֵּ֕ר וְ/לֹ֥א תֵֽאָלֵ֖ם ע֑וֹד וְ/הָיִ֤יתָ לָ/הֶם֙ לְ/מוֹפֵ֔ת וְ/יָדְע֖וּ כִּֽי אֲנִ֥י יְהוָֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/024/027.yaml
  text: On that day your mouth will be opened when the fugitive comes to you[a], and you will speak and no longer be mute. So you will be a sign to them, and they will know that I am Yahweh.
translation:
  language: hi
  text: उस दिन, जब वह बच निकला हुआ व्यक्ति तुम्हारे पास आएगा[a], तब तुम्हारा मुँह खुल जाएगा; तुम बोलोगे और फिर गूँगे न रहोगे। इस प्रकार तुम उनके लिए एक चिह्न ठहरोगे, और वे जान लेंगे कि मैं याहवे हूँ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “बच निकले हुए व्यक्ति के साथ।” इब्रानी वाक्यांश कठिन है; संभवतः आशय उस समय से है जब वह व्यक्ति समाचार लेकर पहुँचेगा।
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיּוֹם הַהוּא
  choice: उस दिन
  rationale: यह मानक भविष्यसूचक काल-सूचक अभिव्यक्ति है; आधुनिक हिन्दी में स्वाभाविक और स्पष्ट है।
- source_word: יִפָּתַח פִּיךָ
  choice: तुम्हारा मुँह खुल जाएगा
  rationale: निफ़अल रूप के निष्क्रिय भाव और यहेजकेल की गूँगेपन की दशा के उलटने वाले मूल मुहावरे, दोनों को सुरक्षित रखता है।
- source_word: אֶת הַפָּלִיט
  choice: जब वह बच निकला हुआ व्यक्ति तुम्हारे पास आएगा
  rationale: אֶת के साथ यह पद वाक्य-विन्यास की दृष्टि से कठिन है। निकटवर्ती संदर्भ में פליט यरूशलेम के पतन का समाचार लाने वाले बच निकले व्यक्ति को सूचित करता है; काल-सूचक रूप हिन्दी में अर्थ को स्वाभाविक बनाता है, जबकि कठिनाई को पादटिप्पणी में दर्ज किया गया है।
- source_word: וּתְדַבֵּר וְלֹא תֵאָלֵם עוֹד
  choice: तुम बोलोगे और फिर गूँगे न रहोगे
  rationale: אלם केवल स्वेच्छा से चुप रहने के बजाय बोल न सकने की दशा बताता है; इसलिए ‘गूँगे’ विशिष्ट अर्थ को सुरक्षित रखता है।
- source_word: וְהָיִיתָ לָהֶם לְמוֹפֵת
  choice: इस प्रकार तुम उनके लिए एक चिह्न ठहरोगे
  rationale: מוֹפֵת यहाँ भविष्यसूचक प्रतीक या प्रमाण के अर्थ में है। ‘चिह्न’ आधुनिक हिन्दी में स्पष्ट है और ‘अद्भुत काम’ जैसा अनावश्यक अर्थ आरोपित नहीं करता।
- source_word: וְיָדְעוּ כִּי אֲנִי יְהוָה
  choice: और वे जान लेंगे कि मैं याहवे हूँ
  rationale: यहेजकेल में बार-बार आने वाले पहचान-सूत्र को बनाए रखता है और יהוה को उसके व्यक्तिगत नाम ‘याहवे’ के रूप में प्रस्तुत करता है।
theological_decisions:
- issue: יהוה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में परमेश्वर का चतुरक्षरीय व्यक्तिगत नाम है। उसका लिप्यंतरण नाम और उपाधि के बीच का भेद बनाए रखता है।
- issue: यहेजकेल के बोलने की पुनर्बहाली
  choice: बच निकले व्यक्ति के आगमन से जुड़ी वास्तविक गूँगेपन की समाप्ति
  alternative: केवल रूपकात्मक रीति से बोलने का सामर्थ्य मिलना; सामान्य मौन का अंत
  rationale: पद पहले बताए गए भविष्यसूचक गूँगेपन के चिह्न को पूरा करता है और उसके अंत को यरूशलेम से समाचार लाने वाले व्यक्ति के आगमन से जोड़ता है।
- issue: אֶת הַפָּלִיט का कठिन संबंध
  choice: आगमन के समय को व्यक्त करने वाला वाक्यांश
  alternative: ‘बच निकले व्यक्ति के साथ’
  rationale: संदर्भ काल-सूचक अर्थ का समर्थन करता है, पर इब्रानी रचना असामान्य है; इसलिए वैकल्पिक अधिक शाब्दिक समझ पादटिप्पणी में सुरक्षित रखी गई है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘बच निकला हुआ व्यक्ति’ פליט के अर्थ को ‘भगोड़ा’ के संभावित अपराध-बोध के बिना व्यक्त करता है। अर्धविराम पद की दो निकटता से जुड़ी प्रतिज्ञाओं को स्पष्ट करता है।
