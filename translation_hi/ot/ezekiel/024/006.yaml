source:
  edition: WLC
  text: לָ/כֵ֞ן כֹּה אָמַ֣ר אֲדֹנָ֣/י יְהֹוִ֗ה אוֹי֮ עִ֣יר הַ/דָּמִים֒ סִ֚יר אֲשֶׁ֣ר חֶלְאָתָ֣/ה בָ֔/הּ וְ/חֶ֨לְאָתָ֔/הּ לֹ֥א יָצְאָ֖ה מִמֶּ֑/נָּה לִ/נְתָחֶ֤י/הָ לִ/נְתָחֶ֨י/הָ֙ הוֹצִיאָ֔/הּ לֹא נָפַ֥ל עָלֶ֖י/הָ גּוֹרָֽל־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/024/006.yaml
  text: 'Therefore thus says the Lord GOD: Woe to the city of bloodshed[a], the pot whose rust is in it, and whose rust has not gone out from it! Bring it out piece by piece[b]; no lot has fallen on it.'
translation:
  language: hi
  text: 'इसलिए प्रभु यहोवा यों कहता है: “हाय उस रक्तपात की नगरी पर—उस हाँडी पर, जिसमें मैल[a] जमा है और जिसका मैल उसमें से निकला नहीं है! उसके टुकड़े एक-एक करके निकालो[b]; उस पर कोई चिट्ठी नहीं पड़ी।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी शब्द हाँडी से चिपकी हुई मैली परत को दर्शाता है; इसका अनुवाद “जंग” या “झागदार मैल” भी किया जा सकता है।
    reason: lexical_alternative
  - marker: b
    text: अर्थात हाँडी के भीतर के मांस के टुकड़ों को एक-एक करके निकालना है; उनके चुनाव या बँटवारे के लिए चिट्ठी नहीं डाली गई।
    reason: cultural_note
lexical_decisions:
- source_word: לָכֵן
  choice: इसलिए
  rationale: पूर्ववर्ती चिन्ह-कर्म से निकलने वाले न्याय के निष्कर्ष को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: כֹּה אָמַר
  choice: यों कहता है
  rationale: भविष्यद्वक्ताओं के परंपरागत संदेश-सूत्र को संक्षिप्त और गरिमापूर्ण हिन्दी में बनाए रखता है।
- source_word: אֲדֹנָי יְהוִה
  choice: प्रभु यहोवा
  rationale: दोनों इब्रानी पदों को अलग-अलग सुरक्षित रखता है और वाचा के नाम को ‘यहोवा’ के रूप में व्यक्त करता है।
- source_word: אוֹי עִיר הַדָּמִים
  choice: हाय उस रक्तपात की नगरी पर
  rationale: אוֹי की विलाप और न्याय-घोषणा, तथा דָּמִים में निहित रक्तपात/रक्तदोष की नैतिक तीव्रता को बनाए रखता है।
- source_word: סִיר
  choice: हाँडी
  rationale: पकाने के पात्र के रूपक के लिए सामान्य, ठोस और प्रसंगानुकूल हिन्दी शब्द है।
- source_word: חֶלְאָה
  choice: मैल
  rationale: शब्द हाँडी से चिपकी अशुद्ध परत, जंग या झागदार मैल का संकेत दे सकता है; ‘मैल’ किसी एक भौतिक व्याख्या को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: לִנְתָחֶיהָ לִנְתָחֶיהָ הוֹצִיאָהּ
  choice: उसके टुकड़े एक-एक करके निकालो
  rationale: दोहराव के वितरणात्मक बल को ‘एक-एक करके’ से स्वाभाविक हिन्दी में व्यक्त करता है; प्रसंग में ये हाँडी के भीतर रखे मांस के टुकड़े हैं।
- source_word: לֹא נָפַל עָלֶיהָ גּוֹרָל
  choice: उस पर चिट्ठी न डाली जाए
  rationale: चिट्ठी द्वारा चुनाव या बँटवारे की सांस्कृतिक छवि को रखता है और प्रसंगानुसार बिना चयन के निकाले जाने का भाव देता है।
theological_decisions:
- issue: אֲדֹנָי יְהוִה में परमेश्वर के नाम का अनुवाद
  choice: प्रभु यहोवा
  alternative: प्रभु परमेश्वर
  rationale: मूल में प्रयुक्त व्यक्तिगत वाचा-नाम को सामान्य उपाधि में विलीन किए बिना दोनों तत्वों को सुरक्षित रखा गया है।
- issue: रक्त की नगरी का नैतिक आशय
  choice: रक्तपात की नगरी
  alternative: खून की नगरी
  rationale: बहुवचन דָּמִים यहाँ केवल भौतिक रक्त नहीं, हिंसक रक्तपात और रक्तदोष को सूचित करता है; अनुवाद इसी न्याय-संबंधी आरोप को स्पष्ट रखता है।
- issue: चिट्ठी पड़ने की पंक्ति का काल और भाव
  choice: उस पर चिट्ठी न डाली जाए
  alternative: उस पर कोई चिट्ठी नहीं पड़ी
  rationale: निकालने की आज्ञा के साथ यह निषेध स्वाभाविक रूप से जुड़ता है, यद्यपि इब्रानी रूप को कथन की तरह भी समझा जा सकता है; विकल्प को टिप्पणी में दर्ज रखा गया है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की है, पर भविष्यद्वाणी की न्याय-घोषणा के अनुरूप गरिमापूर्ण और तीखी रखी गई है। ‘हाँडी’, ‘मैल’ और ‘चिट्ठी’ जैसे सामान्य शब्द रूपक को साधारण पाठक के लिए ठोस रखते हैं।
