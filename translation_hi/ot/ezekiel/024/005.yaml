  yaml_path: translation/ot/ezekiel/024/005.yaml
  text: Take the choicest of the flock[a], and also pile the bones under it; bring it to a boil, boil it well[b], and let its bones be cooked in it.
translation:
  language: hi
  text: रेवड़ में से सबसे अच्छा जानवर ले और हड्डियों का ढेर भी हाँडी के नीचे लगा दे[a]। उसे उबाल आने दे, और अच्छी तरह उबाल[b]; उसकी हड्डियाँ भी उसी में पकने दे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ढेर लगा दे’ के लिए प्रयुक्त इब्रानी शब्द दुर्लभ है और उसका ठीक अर्थ अनिश्चित है। इसका एक सम्भव अर्थ है, ‘हड्डियों को उसके नीचे जमा दे।’
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में शाब्दिक रूप से, ‘उसके उबाल को उबाल’; यह पूरी तरह या ज़ोर से उबालने पर बल देने वाली अभिव्यक्ति है।
    reason: lexical_alternative
