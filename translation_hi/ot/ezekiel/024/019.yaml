base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/024/019.yaml
  text: And the people said to me, “Will you not tell us what these things mean for us, that you are doing them?”
translation:
  language: hi
  text: तब लोगों ने मुझसे कहा, “क्या तू हमें नहीं बताएगा कि तू जो ये काम कर रहा है, उनका हमारे लिए क्या अर्थ है?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָעָם
  choice: लोगों
  rationale: यहाँ सामूहिक ‘लोग/जनता’ के अर्थ में है; सहज आधुनिक हिन्दी में ‘लोगों ने’ स्वाभाविक है।
- source_word: הֲלֹא תַגִּיד לָנוּ
  choice: क्या तू हमें नहीं बताएगा
  rationale: नकारात्मक प्रश्न के आग्रहपूर्ण स्वर को सुरक्षित रखता है।
- source_word: מָה אֵלֶּה לָּנוּ
  choice: उसका हमारे लिए क्या अर्थ है
  rationale: शाब्दिक रूप ‘ये हमारे लिए क्या हैं’ संकेतात्मक कार्यों के अभिप्राय के विषय में पूछता है; हिन्दी में यह अर्थपूर्ण और स्वाभाविक रूप है।
- source_word: כִּי אַתָּה עֹשֶׂה
  choice: जो कुछ तू कर रहा है
  rationale: כִּי का यहाँ संबंधवाचक/व्याख्यात्मक बल है; यह वाक्यांश ‘इन बातों’ को यहेजकेल के किए जा रहे कार्यों के रूप में स्पष्ट करता है।
theological_decisions:
- issue: भविष्यसूचक प्रतीकात्मक कार्यों का अर्थ
  choice: ‘हमारे लिए क्या अर्थ है’
  alternative: ‘हमारे लिए ये क्या हैं’
  rationale: लोग इन कार्यों के अपने लिए निहित संकेत के बारे में पूछ रहे हैं; अनुवाद अर्थ स्पष्ट करता है, पर उस संकेत की व्याख्या इस पद में पहले से तय नहीं करता।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी; प्रत्यक्ष संबोधन में एकवचन ‘तू’ मूल के אַתָּה और निकटवर्ती संवाद की शैली को दर्शाता है।
