lexical_decisions:
- source_word: אֱסֹף
  choice: इकट्ठे कर
  rationale: यह אסף का आज्ञार्थक रूप है। ‘इकट्ठे कर’ पकाने के बर्तन में टुकड़ों को एक साथ डालने की आज्ञा को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: נְתָחֶיהָ
  choice: उसके मांस के टुकड़े
  rationale: נתח यहाँ काटे गए पशु के हिस्सों का बोध कराता है। केवल ‘टुकड़े’ की अपेक्षा ‘मांस के टुकड़े’ पाक-संदर्भ को स्पष्ट करता है, जबकि पादटिप्पणी में अधिक तकनीकी विकल्प रखा गया है।
- source_word: אֵלֶיהָ
  choice: उसमें
  rationale: स्त्रीलिंगी सर्वनाम उस हाँडी की ओर संकेत करता है जिसका उल्लेख पिछले पद में है। हिन्दी में निर्जीव पात्र के लिए ‘उसमें’ स्वाभाविक है और भीतर की दिशा भी स्पष्ट करता है।
- source_word: כָּל נֵתַח טוֹב
  choice: हर अच्छा टुकड़ा
  rationale: यह अनुवाद כָּל की वितरणात्मकता और טוֹב के मूल अर्थ ‘अच्छा’ को बनाए रखता है। प्रसंग में इसका आशय बढ़िया या चुनिंदा हिस्से से भी हो सकता है, जिसे पादटिप्पणी में दिया गया है।
- source_word: יָרֵךְ וְכָתֵף
  choice: जाँघ और कंधा
  rationale: दोनों विशिष्ट शारीरिक हिस्सों को सीधी और प्रचलित हिन्दी में व्यक्त किया गया है।
- source_word: מִבְחַר עֲצָמִים
  choice: चुनी हुई हड्डियाँ
  rationale: इब्रानी रचना का अर्थ श्रेष्ठ या चुनकर ली गई हड्डियाँ है। ‘चुनी हुई’ चयन की धारणा को रखता है और अनावश्यक स्पष्ट सुपरलेटिव नहीं जोड़ता।
- source_word: מַלֵּא
  choice: भर दे
  rationale: מלא के आज्ञार्थक बल को स्वाभाविक हिन्दी में रखा गया है; ‘उसे’ प्रसंग से हाँडी की ओर संकेत करता है।
