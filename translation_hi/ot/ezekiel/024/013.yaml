source:
  edition: WLC
  text: בְּ/טֻמְאָתֵ֖/ךְ זִמָּ֑ה יַ֤עַן טִֽהַרְתִּי/ךְ֙ וְ/לֹ֣א טָהַ֔רְתְּ מִ/טֻּמְאָתֵ/ךְ֙ לֹ֣א תִטְהֲרִי ע֔וֹד עַד הֲנִיחִ֥/י אֶת חֲמָתִ֖/י בָּֽ/ךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/024/013.yaml
  text: In your uncleanness is lewdness[a]. Because I cleansed you, but you were not cleansed from your uncleanness[b], you will not be cleansed anymore until I have satisfied my wrath against you.
translation:
  language: hi
  text: तेरी अशुद्धता में निर्लज्ज दुराचार है। क्योंकि मैंने तुझे शुद्ध किया, पर तू अपनी अशुद्धता से शुद्ध नहीं हुई। अब तू फिर शुद्ध नहीं होगी, जब तक मैं अपना क्रोध तुझ पर पूरी तरह उतार न दूँ।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּטֻמְאָתֵךְ
  choice: तेरी अशुद्धता में
  rationale: בְּ को स्थान/अवस्था के अर्थ में रखते हुए טֻמְאָה के नैतिक और विधिक दोनों आयामों के लिए ‘अशुद्धता’ स्वाभाविक है। स्त्रीलिंग एकवचन संबोधन यरूशलेम से है, इसलिए ‘तेरी’ रखा गया है।
- source_word: זִמָּה
  choice: घोर अनैतिकता
  rationale: यहेजकेल में यह शब्द प्रायः निर्लज्ज, विशेषकर यौन, दुराचार का बोध देता है। ‘घोर अनैतिकता’ आरोप की तीव्रता बनाए रखती है और आधुनिक हिन्दी में सहज है।
- source_word: יַעַן טִהַרְתִּיךְ וְלֹא טָהַרְתְּ
  choice: मैंने तुझे शुद्ध करना चाहा, फिर भी तू ... शुद्ध नहीं हुई
  rationale: טִהַרְתִּיךְ का रूप औपचारिकतः ‘मैंने तुझे शुद्ध किया’ है, पर अगला खंड असफल परिणाम बताता है। हिन्दी में प्रयत्न/अभिप्रायसूचक अनुवाद उस तनाव को स्वाभाविक रूप से व्यक्त करता है, बिना यह कहे कि परमेश्वर में सामर्थ्य की कमी थी। יַעַן का कारणार्थ प्रसंग में निहित है, पर अलग ‘क्योंकि’ रखने से हिन्दी वाक्य बोझिल होता।
- source_word: מִטֻּמְאָתֵךְ
  choice: अपनी अशुद्धता से
  rationale: מִן अलग होने का भाव देता है; ‘से’ उसे स्पष्ट करता है और पहले प्रयुक्त ‘अशुद्धता’ से शब्दगत संगति बनाए रखता है।
- source_word: לֹא תִטְהֲרִי עוֹד
  choice: अब तू ... शुद्ध नहीं होगी
  rationale: עוֹד को ‘अब ... नहीं’ के रूप में स्वाभाविक हिन्दी में व्यक्त किया गया है; स्त्रीलिंग क्रिया यरूशलेम के संबोधन को बनाए रखती है।
- source_word: עַד הֲנִיחִי אֶת חֲמָתִי בָּךְ
  choice: जब तक मैं अपना क्रोध तुझ पर पूरी तरह उतार न दूँ
  rationale: नוח के हिफ़ील रूप और क्रोध के साथ प्रयोग का आशय क्रोध को पूर्णतः कार्यान्वित करके शांत होने देना है। ‘पूरी तरह उतार दूँ’ इस न्याय-संबंधी मुहावरे को आधुनिक हिन्दी में स्पष्ट करता है; בָּךְ की प्रतिकूल दिशा ‘तुझ पर’ से आती है।
theological_decisions:
- issue: पहले शुद्धीकरण-वाक्य को पूर्ण हुई क्रिया मानना या शुद्ध करने का प्रयत्न/अभिप्राय
  choice: मैंने तुझे शुद्ध करना चाहा
  alternative: मैंने तुझे शुद्ध किया
  rationale: हिब्रू का सीधा रूप वैकल्पिक अनुवाद का समर्थन करता है, किंतु तुरंत बाद ‘तू शुद्ध नहीं हुई’ आता है। मुख्य पाठ में अभिप्रायसूचक हिन्दी इस वास्तविक तनाव को समझने योग्य बनाती है और परमेश्वर की ओर से शुद्धि हेतु की गई पहल तथा यरूशलेम की बनी रही अशुद्धता दोनों को सुरक्षित रखती है।
- issue: परमेश्वर के क्रोध के ‘विश्राम’ का अर्थ
  choice: अपना क्रोध तुझ पर पूरी तरह उतार न दूँ
  alternative: अपने क्रोध को तुझ पर विश्राम न दूँ
  rationale: यहाँ मुहावरा क्रोध के न्याय में पूर्णतः प्रकट होकर शांत होने को दर्शाता है। चुनी हुई हिन्दी इसे स्पष्ट करती है और किसी बलिदान-संबंधी तकनीकी अर्थ को नहीं जोड़ती।
translation_notes:
  register: भाषा आधुनिक, गंभीर और भविष्यद्वक्ताई न्याय के अनुरूप रखी गई है। यरूशलेम को स्त्रीलिंग एकवचन में संबोधित करने के कारण ‘तेरी’, ‘तुझे’ और ‘हुई/होगी’ प्रयुक्त हैं। ‘तुम’ की अपेक्षा ‘तू’ मूल के एकवचन प्रत्यक्ष और कठोर संबोधन को अधिक स्पष्ट रखता है।
