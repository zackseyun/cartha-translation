source:
  edition: WLC
  text: לְ/הַעֲל֤וֹת חֵמָה֙ לִ/נְקֹ֣ם נָקָ֔ם נָתַ֥תִּי אֶת דָּמָ֖/הּ עַל צְחִ֣יחַ סָ֑לַע לְ/בִלְתִּ֖י הִכָּסֽוֹת־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/024/008.yaml
  text: To stir up wrath[a], to take vengeance, I have set her blood on a bare rock[b], so that it would not be covered.
translation:
  language: hi
  text: क्रोध भड़काने और बदला लेने के लिए[a], मैंने उसका खून[b] नंगी चट्टान पर रख दिया है, ताकि वह ढका न जाए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: हिब्रू में “प्रतिशोध करना” की क्रिया के साथ उसी मूल का शब्द “प्रतिशोध” आया है, जिससे बात पर बल पड़ता है।
    reason: lexical_alternative
  - marker: b
    text: “उसका खून” प्रसंग में उसके द्वारा किए गए रक्तपात या उसके रक्त-दोष का भाव भी दे सकता है; मूल हिब्रू में ठोस रूप से “उसका खून” ही है।
    reason: lexical_alternative
lexical_decisions:
- source_word: לְהַעֲלוֹת חֵמָה
  choice: क्रोध भड़काने के लिए
  rationale: हिफ़ील क्रिया के साथ यह वाक्यांश क्रोध को उठाने या भड़काने का भाव देता है। ‘क्रोध भड़काने’ से कारणवाचक अर्थ स्वाभाविक आधुनिक हिन्दी में बना रहता है।
- source_word: לִנְקֹם נָקָם
  choice: बदला लेने के लिए
  rationale: क्रिया और उसी मूल की संज्ञा का मेल बदला लेने की क्रिया पर बल देता है। मुख्य पाठ में स्वाभाविक हिन्दी रखी गई है और हिब्रू का बल पादटिप्पणी में बताया गया है।
- source_word: נָתַתִּי
  choice: मैंने ... रख दिया है
  rationale: स्थानसूचक पूरक के साथ נתן का अर्थ यहाँ किसी वस्तु को रखना है। पूर्ण क्रिया और उसके वर्तमान परिणाम को हिन्दी में ‘रख दिया है’ स्पष्ट करता है।
- source_word: דָּמָהּ
  choice: उसका खून
  rationale: मूल पाठ की ठोस रक्त-छवि को बनाए रखा गया है; प्रसंग में यह उसके द्वारा किए गए रक्तपात या उसके रक्त-दोष की ओर भी संकेत कर सकता है।
- source_word: צְחִיחַ סָלַע
  choice: नंगी चट्टान
  rationale: यह पद ऐसी खुली, अनावृत चट्टानी सतह दर्शाता है जहाँ खून छिप या सोख नहीं जाता। ‘नंगी चट्टान’ इस दृश्य को संक्षेप और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: לְבִלְתִּי הִכָּסוֹת
  choice: ताकि वह ढका न जाए
  rationale: 'यह रचना उद्देश्य या अभिप्रेत परिणाम बताती है: खून जानबूझकर खुला रखा गया है।'
theological_decisions:
- issue: खून को खुला रखने में कर्ता और न्यायिक उद्देश्य
  choice: वक्ता जानबूझकर उसका खून खुली चट्टान पर रखता है, जिससे क्रोध और बदला लेने का न्यायिक उद्देश्य सामने आता है।
  alternative: पंक्ति को केवल खून की खुली अवस्था का वर्णन माना जा सकता है, बिना वक्ता की सोची-समझी न्यायिक मंशा पर विशेष बल दिए।
  rationale: प्रथम पुरुष נָתַתִּי (‘मैंने रखा’) और उद्देश्यसूचक क्रियारूप जानबूझकर की गई कार्रवाई दिखाते हैं। अनुवाद इसे सुरक्षित रखता है, पर वक्ता या न्याय के स्वरूप के बारे में पद से आगे कुछ नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की, सहज किंतु गरिमापूर्ण रखी गई है। ‘खून’ ठोस भविष्यद्वक्तीय छवि को ‘रक्त’ की अपेक्षा अधिक स्वाभाविक ढंग से सामने लाता है; वाक्य की न्यायिक गंभीरता ‘क्रोध’ और ‘बदला’ से बनी रहती है।
