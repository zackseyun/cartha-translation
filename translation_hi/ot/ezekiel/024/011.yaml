  text: וְ/הַעֲמִידֶ֥/הָ עַל גֶּחָלֶ֖י/הָ רֵקָ֑ה לְמַ֨עַן תֵּחַ֜ם וְ/חָ֣רָה נְחֻשְׁתָּ֗/הּ וְ/נִתְּכָ֤ה בְ/תוֹכָ/הּ֙ טֻמְאָתָ֔/הּ תִּתֻּ֖ם חֶלְאָתָֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/024/011.yaml
  text: Then set it empty on its coals[a], so that it may become hot and its bronze may glow, and its uncleanness within it may be melted, and its corrosion consumed.
translation:
  language: hi
  text: फिर उसे खाली ही उसके अंगारों पर रख दे, ताकि वह तप जाए और उसका काँसा दहक उठे; उसके भीतर की अशुद्धता पिघल जाए और उसका जमा हुआ मैल[a] जलकर मिट जाए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उसकी जंग” अथवा “उसका मैल।” इब्रानी शब्द धातु पर जमे क्षरण या मैल को दर्शा सकता है और इस प्रसंग में यरूशलेम की नैतिक अशुद्धता का प्रतीक भी है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַעֲמִידֶהָ
  choice: फिर उसे ... रख दे
  rationale: עמד के हिफ़ील रूप में पात्र को किसी स्थान पर रखने का आदेश है। आरंभिक וְ क्रम को आगे बढ़ाता है, इसलिए आधुनिक हिन्दी में ‘फिर’ स्वाभाविक है।
- source_word: עַל גֶּחָלֶיהָ רֵקָה
  choice: उसे खाली करके उसके अंगारों पर
  rationale: רֵקָה पात्र की खाली अवस्था बताता है और גֶּחָלֶיהָ में स्त्रीलिंग प्रत्यय को ‘उसके’ से बनाए रखा गया है। ‘अंगारे’ जलते कोयलों के लिए सहज हिन्दी शब्द है।
- source_word: לְמַעַן תֵּחַם
  choice: ताकि वह तप जाए
  rationale: उद्देश्यवाचक खंड और पात्र के अत्यधिक गरम होने की प्रक्रिया को संक्षिप्त, स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וְחָרָה נְחֻשְׁתָּהּ
  choice: और उसका काँसा दहक उठे
  rationale: נְחֹשֶׁת यहाँ काँसे/ताँबे की धातु को सूचित करता है; पात्र के संदर्भ में ‘काँसा’ उपयुक्त है। חרה को ‘दहक उठे’ कहना गरम धातु की तीव्रता दिखाता है, बिना यह संकेत दिए कि धातु स्वयं ईंधन की तरह जल रही है।
- source_word: וְנִתְּכָה בְתוֹכָהּ טֻמְאָתָהּ
  choice: उसके भीतर की अशुद्धता पिघल जाए
  rationale: נתך के पिघलने/ढलने के भाव और טֻמְאָה के नैतिक-अनुष्ठानिक ‘अशुद्धता’ भाव, दोनों को सुरक्षित रखा गया है।
- source_word: תִּתֻּם חֶלְאָתָהּ
  choice: उसका जमा हुआ मैल जलकर मिट जाए
  rationale: חֶלְאָה धातु पर जमे मैल, खुरचन या जंग जैसे क्षरण को सूचित कर सकता है। ‘जमा हुआ मैल’ पात्र की ठोस छवि और यरूशलेम की प्रतीकात्मक अशुद्धता दोनों के लिए स्वाभाविक है; תִּתֻּם के समाप्त हो जाने के भाव को ‘जलकर मिट जाए’ व्यक्त करता है।
theological_decisions:
- issue: पात्र की वास्तविक धात्विक सफाई और यरूशलेम की नैतिक अशुद्धता के प्रतीकात्मक अर्थ के बीच तनाव
  choice: ‘काँसा’, ‘दहक’, ‘पिघल’ और ‘जमा हुआ मैल’ जैसी ठोस भाषा के साथ ‘अशुद्धता’ बनाए रखना
  alternative: पूरे चित्र को केवल ‘पाप’ या ‘दोष’ जैसी अमूर्त धार्मिक भाषा में बदल देना
  rationale: इब्रानी पाठ पहले पात्र और उस पर जमे पदार्थ का दृश्य प्रस्तुत करता है, जो संदर्भ में यरूशलेम की अशुद्धता और न्याय का प्रतीक है। अनुवाद प्रतीक को उसकी व्याख्या से प्रतिस्थापित नहीं करता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, आदेशात्मक और भविष्यसूचक गरिमा के साथ रखी गई है। वाक्य प्रवाह साधारण पाठक के लिए सहज है, जबकि धातु, ताप और अशुद्धता की मूल छवियाँ सुरक्षित हैं।
