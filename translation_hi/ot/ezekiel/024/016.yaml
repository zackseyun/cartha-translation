source:
  edition: WLC
  text: בֶּן אָדָ֕ם הִנְ/נִ֨י לֹקֵ֧חַ מִמְּ/ךָ֛ אֶת מַחְמַ֥ד עֵינֶ֖י/ךָ בְּ/מַגֵּפָ֑ה וְ/לֹ֤א תִסְפֹּד֙ וְ/לֹ֣א תִבְכֶּ֔ה וְ/ל֥וֹא תָב֖וֹא דִּמְעָתֶֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/024/016.yaml
  text: Son of man[a], behold, I am taking from you the delight of your eyes with a blow, yet you shall not mourn or weep[c][b], nor shall your tears come.
translation:
  language: hi
  text: “हे मनुष्य के पुत्र, देख, मैं तेरी आँखों की प्रिय वस्तु[a] को एक आघात[b] से तुझसे लेने वाला हूँ; फिर भी तू न शोक मनाना, न रोना, और तेरी आँखों से आँसू न निकलें[c]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “तेरी आँखों की अभिलाषा।” इस मुहावरे का अर्थ है वह जो यहेजकेल को सबसे अधिक प्रिय था; प्रसंग में इससे उसकी पत्नी का संकेत है।
    reason: lexical_alternative
  - marker: b
    text: या “महामारी से” अथवा “प्रहार से।” इब्रानी शब्द किसी मारक प्रहार या महामारी-सदृश विपत्ति को सूचित कर सकता है।
    reason: lexical_alternative
  - marker: c
    text: शाब्दिक रूप से, “तेरा आँसू न आएगा।”
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן אָדָם
  choice: हे मनुष्य के पुत्र
  rationale: यहेजकेल के लिए प्रयुक्त स्थिर संबोधन और इब्रानी मुहावरे को सुरक्षित रखता है; संबोधन का भाव स्पष्ट करने के लिए ‘हे’ जोड़ा गया है।
- source_word: הִנְנִי
  choice: देख
  rationale: आगामी गंभीर घोषणा की ओर ध्यान खींचने वाले सूचक का स्वाभाविक आधुनिक हिन्दी रूप।
- source_word: לֹקֵחַ
  choice: मैं ... छीनने वाला हूँ
  rationale: הִנְנִי के साथ कृदंत निकट भविष्य की निश्चित और आसन्न कार्रवाई व्यक्त करता है। प्रसंग में किसी बहुमूल्य व्यक्ति को मृत्यु द्वारा ले लिए जाने के कारण ‘छीनना’ हिन्दी में भाव और क्रिया दोनों को स्वाभाविक रूप से व्यक्त करता है।
- source_word: מַחְמַד עֵינֶיךָ
  choice: तेरी आँखों की अभिलाषा
  rationale: जो अत्यंत प्रिय और मनोहर है, उसके लिए मूल रूपक को बनाए रखता है; पत्नी का उल्लेख मुख्य पाठ में जोड़कर निहितार्थ को स्पष्ट नहीं किया गया।
- source_word: בְּמַגֵּפָה
  choice: एक आघात से
  rationale: מַגֵּפָה के प्रहार, मार अथवा महामारी-सदृश विपत्ति के अर्थक्षेत्र में ‘आघात’ जानबूझकर व्यापक है और किसी विशेष रोग का अनावश्यक निर्धारण नहीं करता।
- source_word: תִסְפֹּד
  choice: शोक मनाना
  rationale: औपचारिक या सामाजिक शोक-व्यवहार को सामान्य आधुनिक हिन्दी में व्यक्त करता है।
- source_word: תִבְכֶּה
  choice: रोना
  rationale: शोक मनाने से अलग प्रत्यक्ष भावात्मक प्रतिक्रिया को स्पष्ट रखता है।
- source_word: וְלֹא תָבוֹא דִּמְעָתֶךָ
  choice: और न तेरी आँख से आँसू निकलेगा
  rationale: मूल में एकवचन ‘तेरा आँसू नहीं आएगा’ है। हिन्दी में एकवचन रखते हुए ‘आँख से ... निकलना’ अर्थ को स्वाभाविक बनाता है; यह सामान्यीकृत बहुवचन ‘आँसू न बहाना’ से अधिक रूप-सन्निकट है।
theological_decisions:
- issue: ‘तेरी आँखों की अभिलाषा’ के संदर्भ को स्पष्ट करना
  choice: मुख्य पाठ में मूल मुहावरा रखा गया और पत्नी का नाम नहीं जोड़ा गया
  alternative: ‘तेरी प्रिय पत्नी’ अथवा ‘तेरी आँखों की अभिलाषा—तेरी पत्नी’
  rationale: आस-पास का प्रसंग संकेत करता है कि आशय यहेजकेल की पत्नी से है, पर इस पद में मूल पाठ रूपक ही प्रयोग करता है। उसे बनाए रखना पाठ की संक्षिप्तता और निहित तनाव को सुरक्षित रखता है।
- issue: בְּמַגֵּפָה में मृत्यु के साधन की विशिष्टता
  choice: ‘एक आघात से’
  alternative: ‘महामारी से’, ‘विपत्ति से’ अथवा ‘एक ही प्रहार में’
  rationale: इब्रानी शब्द प्रहार और महामारी दोनों का बोध करा सकता है। मुख्य पाठ में व्यापक विकल्प रखा गया है और संभावित अर्थ पादटिप्पणी में दिए गए हैं, ताकि रोग या आकस्मिकता को निश्चित न किया जाए।
translation_notes:
  register: आधुनिक मानक हिन्दी में गंभीर भविष्यद्वाणी-संबंधी शैली रखी गई है। ‘तू/तेरी’ का प्रयोग एकवचन संबोधन और निकट, प्रत्यक्ष वाणी के अनुरूप है। मूल मुहावरों को यथासंभव सुरक्षित रखते हुए अस्पष्ट शब्दों की वैकल्पिक संभावनाएँ पादटिप्पणियों में दी गई हैं।
