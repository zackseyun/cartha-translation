lexical_decisions:
- source_word: הַרְבֵה הָעֵצִים
  choice: लकड़ियाँ खूब डालो
  rationale: हिफ़ील आज्ञार्थक הַרְבֵה मात्रा बढ़ाने का भाव देता है। देग के प्रसंग में यह स्वाभाविक हिन्दी है और लकड़ी के अलग-अलग टुकड़ों के बहुवचन को भी बनाए रखती है।
- source_word: הַדְלֵק הָאֵשׁ
  choice: आग सुलगाओ
  rationale: हिफ़ील आज्ञार्थक הַדְלֵק आग प्रज्वलित करने की आज्ञा देता है; ‘सुलगाओ’ वर्तमान हिन्दी में स्वाभाविक और चित्रात्मक है।
- source_word: הָתֵם הַבָּשָׂר
  choice: मांस को पूरी तरह पकाओ
  rationale: תמם का मूल भाव पूरा करने का है; पकाने के प्रसंग में यह मांस को पूर्णतः पका देने की आज्ञा है। ‘मांस’ בָּשָׂר के कठोर शारीरिक बिंब को बनाए रखता है।
- source_word: וְהַרְקַח הַמֶּרְקָחָה
  choice: और मिश्रण को खौलाओ
  rationale: רקח और מֶרְקָחָה में मिलाने या तैयार किए हुए मिश्रण की अर्थ-सीमा है। देग के प्रसंग में ‘खौलाओ’ क्रिया को स्पष्ट करता है, जबकि ‘मिश्रण’ मूल की व्यापकता को ‘शोरबा’ या ‘तरकारी’ से अधिक सुरक्षित रखता है।
- source_word: וְהָעֲצָמוֹת יֵחָרוּ
  choice: और हड्डियाँ झुलस जाएँ
  rationale: निफ़अल יֵחָרוּ तीव्र ताप से जलने या झुलसने का परिणाम व्यक्त करता है। हिन्दी में ‘झुलस जाएँ’ हड्डियों पर आग के प्रभाव को स्वाभाविक ढंग से व्यक्त करता है।
