base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/024/015.yaml
  text: And the word of Yahweh came to me[a], saying,
translation:
  language: hi
  text: 'फिर यहोवा का वचन मेरे पास आया:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: आया
  rationale: यहाँ यह क्रिया भविष्यद्वाणी के प्रचलित प्रकाशन-सूत्र में है; हिन्दी में ‘वचन ... आया’ स्वाभाविक और मूल के अनुरूप है।
- source_word: דְבַר
  choice: वचन
  rationale: इस सूत्र में यह परमेश्वर से प्राप्त कथन या संदेश को दर्शाता है। ‘वचन’ भविष्यद्वाणी की गरिमा और मूल शब्द से निकटता बनाए रखता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: मूल में परमेश्वर का व्यक्तिगत नाम टेट्राग्रामटन है; हिन्दी बाइबलीय प्रयोग में प्रचलित रूप ‘यहोवा’ इसे उपाधि से बदलने के बजाय नाम के रूप में प्रस्तुत करता है।
- source_word: אֵלַי
  choice: मेरे पास
  rationale: यह दिशा और प्राप्तकर्ता—यहेजकेल—को व्यक्त करता है; ‘मेरे पास आया’ स्वाभाविक आधुनिक हिन्दी है।
- source_word: לֵאמֹר
  choice: ':'
  rationale: यह रूप आगे आने वाले सीधे कथन का परिचय देता है। हिन्दी में कोलन यही कार्य अधिक स्वाभाविक ढंग से करता है और अनावश्यक ‘यह कहते हुए’ से बचाता है।
theological_decisions:
- issue: दिव्य नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल में दिव्य नाम सीधे प्रयुक्त है। हिन्दी पाठकों के लिए परिचित ‘यहोवा’ नाम को उपाधि ‘प्रभु’ से प्रतिस्थापित किए बिना उसका नामात्मक स्वरूप सुरक्षित रखता है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण भविष्यद्वाणी-वृत्तांत। आरम्भिक וַ को ‘फिर’ से व्यक्त किया गया है, जिससे पिछले प्रसंग से क्रमिक संबंध बना रहता है; לֵאמֹר को आगामी प्रत्यक्ष वचन के संकेतक कोलन से व्यक्त किया गया है।
