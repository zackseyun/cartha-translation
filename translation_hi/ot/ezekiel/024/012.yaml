source:
  edition: WLC
  text: תְּאֻנִ֖ים הֶלְאָ֑ת וְ/לֹֽא תֵצֵ֤א מִמֶּ֨/נָּה֙ רַבַּ֣ת חֶלְאָתָ֔/הּ בְּ/אֵ֖שׁ חֶלְאָתָֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/024/012.yaml
  text: With toil she has wearied herself[a], yet her abundant corrosion does not go out from her[b]; her corrosion remains in the fire.
translation:
  language: hi
  text: कठिन परिश्रम करते-करते वह थक गई,[a] फिर भी उसका बहुत-सा जमा हुआ मैल उसमें से नहीं निकला; उसका मैल आग में रहा।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: हिब्रू क्रिया का अर्थ यह भी हो सकता है, “उसने [किसी को] थका दिया”; कर्म नहीं बताया गया है।
    reason: lexical_alternative
  - marker: b
    text: हिब्रू में अंत बहुत संक्षिप्त है—शाब्दिक रूप से, “आग में उसका मैल।” स्पष्ट अर्थ के लिए “रहा” जोड़ा गया है।
    reason: ellipsis
lexical_decisions:
- source_word: תְּאֻנִים
  choice: बहुत मेहनत करते-करते
  rationale: यह बहुवचन संज्ञा कठिन प्रयास या परिश्रम का भाव व्यक्त करती है। हिन्दी में क्रियाविशेषणीय रूप स्वाभाविक है और हाँडी को साफ करने के अथक प्रयास का चित्र बनाए रखता है।
- source_word: הֶלְאָת
  choice: वह थक गई
  rationale: मूल क्रिया थकने या थका देने का अर्थ रखती है और रूप स्त्रीलिंग एकवचन है, जो प्रसंग में हाँडी अथवा उसके द्वारा चित्रित नगरी से मेल खाता है। कर्तृवाच्य हिन्दी मूल के व्यक्तिकरण को बनाए रखती है।
- source_word: וְלֹא תֵצֵא מִמֶּנָּה
  choice: फिर भी ... उसमें से नहीं निकला
  rationale: יצא के मूल अर्थ ‘निकलना’ को रखा गया है; प्रसंग में आशय मैल के दूर न हो पाने से है, पर अनुवाद उस निहितार्थ को खुली व्याख्या में नहीं बदलता।
- source_word: רַבַּת חֶלְאָתָהּ
  choice: उसका बहुत-सा जमा हुआ मैल
  rationale: רַבַּת मात्रा या व्यापकता बताता है। חֶלְאָה धातु की हाँडी पर जमी अशुद्ध परत को सूचित करता है; ‘जमा हुआ मैल’ हिन्दी में जंग, खुरंड या मैली परत की व्यापक छवि को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: בְּאֵשׁ חֶלְאָתָהּ
  choice: उसका मैल आग में ही रहा
  rationale: मूल वाक्यांश क्रियारहित और संक्षिप्त है—शाब्दिक रूप से ‘आग में उसका मैल।’ स्पष्ट हिन्दी के लिए ‘रहा’ जोड़ा गया है, जबकि ‘ही’ इस बात पर बल देता है कि आग भी मैल को दूर नहीं कर सकी।
theological_decisions:
- issue: הֶלְאָת में कर्म का लोप
  choice: वह थक गई
  alternative: उसने थका दिया
  rationale: हिब्रू रूप को ‘थका दिया’ भी समझा जा सकता है, पर कर्म व्यक्त नहीं है। प्रसंग और प्राचीन से चली आ रही आत्मवाचक समझ के अनुरूप ‘वह थक गई’ चुना गया है; पादटिप्पणी वैकल्पिक व्याकरणिक संभावना को खुला रखती है।
- issue: अंतिम क्रियारहित वाक्यांश का अर्थ
  choice: उसका मैल आग में ही रहा
  alternative: उसका मैल आग के हवाले हो
  rationale: मूल पाठ आज्ञा स्पष्ट रूप से व्यक्त नहीं करता। इसलिए उसे दंडादेश के रूप में निर्णायक बनाने के बजाय निरंतर अवस्था के रूप में प्रस्तुत किया गया है और मूल की संक्षिप्तता पादटिप्पणी में बताई गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल लेकिन गरिमापूर्ण शैली रखी गई है। स्त्रीलिंग ‘वह’ प्रसंग की हाँडी और उसके द्वारा व्यक्त नगरी, दोनों के व्यक्तिकरण को बनाए रखता है। ‘जमा हुआ मैल’ सामान्य पाठक के लिए बोधगम्य है और धातु पर जमी जंग, खुरंड या अशुद्ध परत में से किसी एक अर्थ को अनावश्यक रूप से निश्चित नहीं करता।
