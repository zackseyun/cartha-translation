  verdict: revise
  source_fidelity: Draft correctly conveys the sequence of commands and preserves the ambiguity of 'bread of men' with a footnote. However, “अपनी मूँछों के ऊपर का भाग न ढको” means ‘do not cover the area above your mustache,’ whereas the Hebrew idiom concerns covering the mustache/upper-lip area itself. The continuous senses in “बाँधे रखो” and “पहने रहो” are also stronger than the simple imperative forms.
  naturalness: The Hindi is generally clear and suitably dignified. “अपनी मूँछों के ऊपर का भाग” is unnatural and misleading. Direct imperatives such as “बाँध लो” and “पहन लो” are more idiomatic here.
  terminology: “पगड़ी” is an acceptable rendering of פְאֵר, and “लोगों की रोटी” appropriately retains the compact, somewhat opaque Hebrew expression. “शोक की रस्में” communicates the idiomatic ritual dimension of עשה אבל, though “शोक न करो” is more concise and natural while still fitting the context.
  issues:
  - severity: medium
    issue: The phrase “अपनी मूँछों के ऊपर का भाग न ढको” mistranslates the object/location of the Hebrew mourning gesture.
    rationale: שָׂפָם can denote the mustache or upper-lip area; it does not mean the area above the mustache. Render the conventional sense directly and retain the lexical alternative in the footnote.
  - severity: low
    issue: “बाँधे रखो” and “पहने रहो” introduce an explicit continuing-state nuance.
    rationale: 'The Hebrew uses direct imperatives: bind/wrap the head covering and put sandals on the feet. Hindi direct imperatives preserve this more closely.'
