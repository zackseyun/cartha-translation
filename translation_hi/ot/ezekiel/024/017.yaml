id: EZK.24.17
reference: Ezekiel 24:17
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: הֵאָנֵ֣ק דֹּ֗ם מֵתִים֙ אֵ֣בֶל לֹֽא תַֽעֲשֶׂ֔ה פְאֵֽרְ/ךָ֙ חֲב֣וֹשׁ עָלֶ֔י/ךָ וּ/נְעָלֶ֖י/ךָ תָּשִׂ֣ים בְּ/רַגְלֶ֑י/ךָ וְ/לֹ֤א תַעְטֶה֙ עַל שָׂפָ֔ם וְ/לֶ֥חֶם אֲנָשִׁ֖ים לֹ֥א תֹאכֵֽל׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/024/017.yaml
  text: Groan silently[a]; do not make mourning for the dead. Bind your turban on yourself, and put your sandals on your feet. Do not cover over your mustache[b], and do not eat the bread of men.
translation:
  language: hi
  text: चुपचाप कराहो; मृतकों के लिए शोक न करो। अपनी पगड़ी सिर पर बाँध लो और अपने पैरों में अपनी जूतियाँ पहन लो। अपनी मूँछ न ढको[a], और लोगों की रोटी न खाओ[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अपने ऊपरी होंठ को न ढको।” इब्रानी शब्द मूँछ के बालों के बजाय विशेष रूप से ऊपरी होंठ के क्षेत्र को भी सूचित कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: “लोगों की रोटी” से सम्भवतः वह भोजन अभिप्रेत है जो दूसरे लोग शोक मनाने वालों के लिए लाते थे, अर्थात शोक का भोजन।
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵאָנֵק דֹּם
  choice: चुपचाप कराहो
  rationale: הֵאָנֵק शोक या पीड़ा की कराह व्यक्त करता है, जबकि דֹּם उसे मौन अथवा दबे हुए ढंग से करने का निर्देश देता है। यह संक्षिप्त अभिव्यक्ति मूल की तनावपूर्ण भाषा को बनाए रखती है।
- source_word: מֵתִים אֵבֶל לֹא תַעֲשֶׂה
  choice: मृतकों के लिए शोक की रस्में न करो
  rationale: עָשָׂה אֵבֶל केवल मन में दुःखी होने के बजाय प्रचलित शोक-क्रियाएँ करने की ओर संकेत करता है; इसलिए ‘शोक की रस्में’ प्रसंग को स्वाभाविक हिन्दी में स्पष्ट करता है।
- source_word: פְאֵרְךָ חֲבוֹשׁ עָלֶיךָ
  choice: अपनी पगड़ी सिर पर बाँधे रखो
  rationale: פְאֵר गरिमापूर्ण सिर-वस्त्र को दर्शाता है और חבש बाँधने या लपेटने की क्रिया है। ‘बाँधे रखो’ यहाँ सामान्य शोक-वेश न अपनाने की निरंतर अवस्था को व्यक्त करता है।
- source_word: וּנְעָלֶיךָ תָּשִׂים בְּרַגְלֶיךָ
  choice: अपने पैरों में चप्पलें पहने रहो
  rationale: शाब्दिक क्रिया ‘पैरों में रखना’ हिन्दी में स्वाभाविक रूप से ‘पहने रहना’ है और नंगे पैर शोक मनाने के विपरीत निर्देश को व्यक्त करती है।
- source_word: וְלֹא תַעְטֶה עַל שָׂפָם
  choice: अपनी मूँछों के ऊपर का भाग न ढको
  rationale: שָׂפָם मूँछ अथवा ऊपरी होंठ के क्षेत्र को सूचित कर सकता है। मुख्य पाठ प्रचलित ‘मूँछ’ अर्थ रखता है, पर ‘के ऊपर का भाग’ मूल के स्थानवाचक עַל को भी व्यक्त करता है; वैकल्पिक अर्थ पादटिप्पणी में दिया गया है।
- source_word: וְלֶחֶם אֲנָשִׁים לֹא תֹאכֵל
  choice: लोगों की रोटी न खाओ
  rationale: मूल का संक्षिप्त और कुछ अस्पष्ट ‘मनुष्यों/लोगों की रोटी’ वाक्यांश बनाए रखा गया है। प्रसंग में दूसरों द्वारा शोक मनाने वालों को दिया जाने वाला भोजन सम्भावित अर्थ है, जिसे पादटिप्पणी स्पष्ट करती है।
theological_decisions:
- issue: शोक-रीतियों के निषेध का अर्थ
  choice: आज्ञाओं को प्रचलित शोक-क्रियाओं के निषेध के रूप में प्रस्तुत करना, बिना प्रत्येक क्रिया को कोई अतिरिक्त धार्मिक अर्थ दिए
  alternative: इन्हें विशेष रूप से याजकीय नियम या केवल अशुद्धता के चिह्न मानना
  rationale: पद में यहेजकेल को कई ठोस शोक-रीतियाँ न करने की आज्ञा दी गई है। प्रत्येक रीति के लिए कोई अलग धर्मवैज्ञानिक व्याख्या पाठ में नहीं दी गई, इसलिए अनुवाद वर्णनात्मक रहता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सहज आदेशात्मक रूप अपनाया गया है। ‘चुपचाप कराहो’ मूल की जानबूझकर तनावपूर्ण अभिव्यक्ति को बनाए रखता है। शोक-संबंधी सांस्कृतिक संकेतों को मुख्य पाठ में अत्यधिक व्याख्यायित नहीं किया गया; आवश्यक स्पष्टीकरण पादटिप्पणियों में है।
