  text: וְ/הָיָ֨ה יְחֶזְקֵ֤אל לָ/כֶם֙ לְ/מוֹפֵ֔ת כְּ/כֹ֥ל אֲשֶׁר עָשָׂ֖ה תַּעֲשׂ֑וּ בְּ/בֹאָ֕/הּ וִֽ/ידַעְתֶּ֕ם כִּ֥י אֲנִ֖י אֲדֹנָ֥/י יְהוִֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/024/024.yaml
  text: And Ezekiel will be a sign for you; according to all that he has done, you will do. When it comes, then you will know that I am the Lord GOD.
translation:
  language: hi
  text: यहेजकेल तुम्हारे लिए एक चिह्न ठहरेगा। जैसा उसने किया है, वैसा ही तुम भी करोगे। जब यह घटित होगा, तब तुम जानोगे कि मैं प्रभु यहोवा हूँ।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מוֹפֵת
  choice: चिह्न
  rationale: यह शब्द यहाँ यहेजकेल के प्रतीकात्मक आचरण को लोगों के लिए एक संकेत या चिह्न बताता है; सरल और प्रसंगानुकूल हिन्दी में ‘चिह्न’ उपयुक्त है।
- source_word: כְּכֹל אֲשֶׁר עָשָׂה תַּעֲשׂוּ
  choice: जैसा उसने किया है, वैसा ही तुम भी करोगे
  rationale: इब्रानी तुलना और भावी क्रिया को स्वाभाविक हिन्दी में रखते हुए यहेजकेल के आचरण और लोगों की आगामी प्रतिक्रिया के बीच समानता सुरक्षित रखी गई है।
- source_word: בְּבֹאָהּ
  choice: जब यह घटित होगा
  rationale: स्त्रीलिंग प्रत्यय का संदर्भ निकटवर्ती व्यापक घटना या विपत्ति से है, पर पद में उसका नाम स्पष्ट नहीं है; ‘यह’ मूल की संदर्भगत अस्पष्टता को बनाए रखता है।
- source_word: אֲדֹנָי יְהוִה
  choice: प्रभु यहोवा
  rationale: संयुक्त दिव्य उपाधि में אֲדֹנָי को ‘प्रभु’ और परमेश्वर के विशिष्ट नाम יהוה को ‘यहोवा’ रूप में अलग-अलग व्यक्त किया गया है।
theological_decisions:
- issue: लोग किस अर्थ में यहेजकेल के समान करेंगे
  choice: कथन को बिना व्याख्यात्मक विस्तार के रखा गया है
  alternative: इसे केवल शोक-विधि न करने या मौन रहने के रूप में स्पष्ट करना
  rationale: आसपास का प्रसंग अर्थ को सूचित करता है, किंतु इस पद की व्यापक अभिव्यक्ति ‘जैसा उसने किया’ को अनावश्यक रूप से संकुचित नहीं किया गया।
- issue: ‘यह’ का संदर्भ
  choice: ‘जब यह घटित होगा’
  alternative: ‘जब यरूशलेम का विनाश होगा’ या ‘जब वह आएगी’
  rationale: मूल पाठ में संदर्भ निहित है, स्पष्ट नामित नहीं; इसलिए वास्तविक अस्पष्टता को बनाए रखना उचित है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गंभीर और सार्वजनिक पाठ के योग्य शैली। ‘ठहरेगा’ यहाँ किसी के लिए चिह्न बन जाने का स्वाभाविक और गरिमापूर्ण रूप है; वाक्य-संरचना मूल के क्रम और बल के निकट रखी गई है।
