- source_word: אֵלֶיךָ
  choice: तुम्हारे पास
  rationale: नबी यहेजकेल को संबोधित एकवचन दिशावाचक पद का स्वाभाविक हिन्दी रूप।
- source_word: לְהַשְׁמָעוּת אָזְנָיִם
  choice: तुम्हें यह समाचार सुनाएगा
  rationale: शाब्दिक अर्थ ‘कानों को सुनाने/कानों के सुनने के लिए’ जैसा है। हिन्दी में ‘समाचार सुनाएगा’ श्रवण-बिंब और प्रत्यक्ष सूचना पहुँचने का भाव रखते हुए मुहावरे को सहज बनाता है।
