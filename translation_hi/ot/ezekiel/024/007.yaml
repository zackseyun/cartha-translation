  text: כִּ֤י דָמָ/הּ֙ בְּ/תוֹכָ֣/הּ הָיָ֔ה עַל צְחִ֥יחַ סֶ֖לַע שָׂמָ֑תְ/הוּ לֹ֤א שְׁפָכַ֨תְ/הוּ֙ עַל הָ/אָ֔רֶץ לְ/כַסּ֥וֹת עָלָ֖י/ו עָפָֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/024/007.yaml
  text: For her blood is in her midst[a]; she set it on a bare rock[b]. She did not pour it out on the ground to cover it with dust.
translation:
  language: hi
  text: क्योंकि उसका खून उसके भीतर है[a]; उसने उसे नंगी चट्टान पर रख दिया[b]। उसने उसे भूमि पर नहीं उँडेला, ताकि उसे मिट्टी से ढक सके।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उसके रक्तपात का दोष”; इब्रानी में शाब्दिक रूप से “उसका खून” है, जो हिंसा से उत्पन्न दोष को ठोस बिंब में व्यक्त करता है।
    reason: lexical_alternative
  - marker: b
    text: खून को मिट्टी से ढकना इस कर्तव्य की ओर संकेत करता है कि बहाया गया खून खुला न छोड़ा जाए; यहाँ वह नंगी चट्टान पर सबके सामने पड़ा है।
    reason: cultural_note
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले न्याय-वर्णन का कारण या स्पष्टीकरण प्रस्तुत करता है; आधुनिक हिन्दी में ‘क्योंकि’ इस संबंध को स्वाभाविक रूप से व्यक्त करता है।
- source_word: דָמָהּ
  choice: उसका खून
  rationale: इब्रानी में ठोस संज्ञा ‘खून’ है। प्रसंग में यह रक्तपात और उससे जुड़े दोष की ओर संकेत करता है, पर खुले पड़े खून का बिंब केंद्रीय होने के कारण शाब्दिक रूप रखा गया है।
- source_word: בְּתוֹכָהּ הָיָה
  choice: उसके बीच में है
  rationale: स्त्रीलिंग प्रत्यय नगर यरूशलेम की ओर संकेत करता है। पूर्ण क्रिया यहाँ स्थितिवाचक है, इसलिए वर्तमान काल बिंब की सजीवता बनाए रखता है।
- source_word: עַל צְחִיחַ סֶלַע
  choice: नंगी चट्टान पर
  rationale: צְחִיחַ खुली, मिट्टी से रहित सतह को दर्शाता है और סֶלַע चट्टान को; ‘नंगी चट्टान’ खून के सोखे या ढके न जाने का दृश्य स्पष्ट रखता है।
- source_word: שָׂמָתְהוּ
  choice: उसने उसे ... रख दिया
  rationale: שׂים का सीधा और स्वाभाविक हिन्दी रूप; कर्ता नगर का स्त्रीलिंग व्यक्तिकरण है और कर्म खून है।
- source_word: לֹא שְׁפָכַתְהוּ
  choice: उसने उसे ... नहीं उँडेला
  rationale: שׁפך का मूल अर्थ ‘उँडेलना’ है। यहाँ ध्यान हत्या की क्रिया से अधिक खून को भूमि पर डालने और ढकने पर है।
- source_word: עַל הָאָרֶץ
  choice: भूमि पर
  rationale: भौतिक धरातल का अर्थ देता है और अगले पदबंध में मिट्टी से ढकने के साथ स्वाभाविक बैठता है।
- source_word: לְכַסּוֹת עָלָיו עָפָר
  choice: कि उसे मिट्टी से ढक दे
  rationale: प्रयोजनसूचक infinitive को स्वाभाविक हिन्दी में ‘कि ... ढक दे’ से व्यक्त किया गया है। עָפָר के लिए ‘मिट्टी’ इस प्रसंग में स्पष्ट और सहज है।
theological_decisions:
- issue: खुले पड़े खून के बिंब की व्याख्या
  choice: मुख्य पाठ में ‘खून’ और उसके खुला छोड़े जाने का ठोस बिंब बनाए रखा गया है।
  alternative: मुख्य पाठ में ‘रक्तपात का दोष’ या ‘खून का दोष’ जैसे व्याख्यात्मक शब्द रखना।
  rationale: इब्रानी पाठ सार्वजनिक हिंसा और दोष को ठोस, खुले पड़े खून के चित्र द्वारा व्यक्त करता है। उसी तनाव और बिंब को बनाए रखना अर्थ को स्पष्ट करने के नाम पर रूपक को समय से पहले खोलने से बचाता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज शैली रखी गई है। यरूशलेम के स्त्रीलिंग व्यक्तिकरण को ‘उसका/उसने’ से सुरक्षित रखा गया है; ‘खून’ सामान्य पाठक के लिए ‘रक्त’ से अधिक स्वाभाविक है, जबकि पद का गंभीर स्वर बना रहता है।
