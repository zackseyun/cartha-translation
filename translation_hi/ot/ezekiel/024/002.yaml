  text: בֶּן אָדָ֗ם כתוב לְ/ךָ֙ אֶת שֵׁ֣ם הַ/יּ֔וֹם אֶת עֶ֖צֶם הַ/יּ֣וֹם הַ/זֶּ֑ה סָמַ֤ךְ מֶֽלֶךְ בָּבֶל֙ אֶל יְר֣וּשָׁלִַ֔ם בְּ/עֶ֖צֶם הַ/יּ֥וֹם הַ/זֶּֽה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/024/002.yaml
  text: 'Son of man[a], write down for yourself the name of the day[c][b], this very day: the king of Babylon has laid siege against Jerusalem on this very day.'
translation:
  language: hi
  text: “हे मनुष्य,[a] अपने लिए इस दिन की तारीख—ठीक आज की तारीख—लिख ले। बाबेल के राजा ने आज ही के दिन यरूशलेम को घेर लिया है।”[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से “मनुष्य का पुत्र” है। यह यहेजकेल के लिए प्रयुक्त संबोधन है; इसका अनुवाद “हे नश्वर मनुष्य” भी किया जा सकता है।
    reason: lexical_alternative
  - marker: c
    text: “यरूशलेम को घेर लिया है” का अनुवाद “यरूशलेम के विरुद्ध आ डटा है” भी किया जा सकता है। सैन्य प्रसंग में इब्रानी क्रिया घेराबंदी आरम्भ करने का संकेत देती है।
    reason: alternative_reading
lexical_decisions:
- source_word: בֶּן אָדָם
  choice: हे मनुष्य के पुत्र
  rationale: यहेजकेल के लिए प्रयुक्त इब्रानी संबोधन को उसके पारंपरिक और प्रतिनिधि-मानवीय बल सहित रखा गया है; ‘हे’ हिन्दी में सीधे संबोधन को स्वाभाविक बनाता है।
- source_word: כתוב לְךָ
  choice: अपने लिए ... लिख ले
  rationale: כתוב की आज्ञा ‘लिख’ और לְךָ के व्यक्तिगत/हितार्थक बल को आधुनिक हिन्दी में स्वाभाविक ढंग से व्यक्त करता है।
- source_word: אֶת שֵׁם הַיּוֹם
  choice: इस दिन की तारीख
  rationale: शाब्दिक अर्थ ‘दिन का नाम’ है, पर प्रसंग में आशय उस दिन की पहचान, अर्थात तारीख दर्ज करना है। शाब्दिक रूप को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: אֶת עֶצֶם הַיּוֹם הַזֶּה
  choice: आज ही की तारीख
  rationale: עֶצֶם वाला मुहावरा इसी निश्चित दिन पर जोर देता है। ‘आज ही’ हिन्दी में उस बल को स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
- source_word: סָמַךְ ... אֶל יְרוּשָׁלִַם
  choice: यरूशलेम को घेर लिया है
  rationale: सैन्य प्रसंग में क्रिया और संबंधसूचक पद का संयुक्त अर्थ यरूशलेम के विरुद्ध घेरा डालना है। पूर्ण क्रिया का हिन्दी रूप घटना के घटित होने को व्यक्त करता है, जबकि वैकल्पिक अधिक शाब्दिक अर्थ पादटिप्पणी में दिया गया है।
- source_word: מֶלֶךְ בָּבֶל
  choice: बाबेल के राजा
  rationale: इब्रानी संबंधवाची पदबंध का सीधा और प्रचलित हिन्दी रूप।
- source_word: בְּעֶצֶם הַיּוֹם הַזֶּה
  choice: आज ही के दिन
  rationale: पहले आए बलात्मक पदबंध की पुनरावृत्ति को बनाए रखते हुए ठीक उसी दिन घटना घटने पर जोर दिया गया है।
