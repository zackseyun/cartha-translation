language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וּ/מְשֹׁ֤ל אֶל בֵּית הַ/מֶּ֨רִי֙ מָשָׁ֔ל וְ/אָמַרְתָּ֣ אֲלֵי/הֶ֔ם כֹּ֥ה אָמַ֖ר אֲדֹנָ֣/י יְהוִ֑ה שְׁפֹ֤ת הַ/סִּיר֙ שְׁפֹ֔ת וְ/גַם יְצֹ֥ק בּ֖/וֹ מָֽיִם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/024/003.yaml
  text: 'And speak a proverb to the rebellious house[a], and say to them, ‘Thus says the Lord GOD: Set on the pot; set it on, and also pour water into it.’'
translation:
  language: hi
  text: 'और उस विद्रोही घराने को एक दृष्टान्त[a] सुनाओ और उनसे कहो, ‘प्रभु याहवे यों कहता है: हाँड़ी चढ़ाओ, उसे चढ़ाओ, और उसमें पानी भी डालो।’'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “कहावत” अथवा “लाक्षणिक कथन।” इब्रानी शब्द מָשָׁל के ये सभी अर्थ हो सकते हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמְשֹׁל ... מָשָׁל
  choice: एक दृष्टान्त सुनाओ
  rationale: क्रिया और संज्ञा दोनों एक ही मूल से हैं और किसी कहावत, दृष्टान्त या लाक्षणिक कथन को प्रस्तुत करने का भाव देते हैं। यहाँ आगे आने वाला हाँड़ी का विस्तृत चित्र ‘दृष्टान्त’ को प्रसंगानुकूल बनाता है; शब्द की व्यापकता पादटिप्पणी में सुरक्षित है।
- source_word: בֵּית הַמֶּרִי
  choice: विद्रोही घराने
  rationale: यहेजकेल में यह इस्राएल/यहूदा के हठी और विद्रोही स्वभाव के लिए बार-बार आने वाला भविष्यद्वक्ताई पदबंध है। ‘घराना’ सामूहिक पहचान को बनाए रखते हुए आधुनिक हिन्दी में स्वाभाविक है।
- source_word: אֲדֹנָי יְהוִה
  choice: प्रभु यहोवा
  rationale: אֲדֹנָי को ‘प्रभु’ और परमेश्वर के निज नाम יהוה को ‘यहोवा’ कहा गया है, जिससे संयुक्त उपाधि के दोनों अंग स्पष्ट रहते हैं।
- source_word: שְׁפֹת הַסִּיר שְׁפֹת
  choice: हाँड़ी चढ़ाओ, उसे चढ़ाओ
  rationale: यहाँ שׁפת का आशय पकाने की हाँड़ी को आग या चूल्हे पर रखने से है। ‘चढ़ाओ’ हिन्दी का स्वाभाविक पाक-संदर्भीय शब्द है, और इब्रानी की जोरदार पुनरुक्ति भी रखी गई है।
- source_word: וְגַם יְצֹק בּוֹ מָיִם
  choice: और उसमें पानी भी डालो
  rationale: יצק का मूल भाव उँडेलना/डालना है और גם की योगात्मक शक्ति ‘भी’ से व्यक्त होती है। ‘भर दो’ नहीं कहा गया, क्योंकि भरने की मात्रा मूल में नहीं है।
theological_decisions:
- issue: संयुक्त ईश्वरीय उपाधि אֲדֹנָי יְהוִה का अनुवाद
  choice: प्रभु यहोवा
  alternative: प्रभु याहवे
  rationale: पाठ में सामान्य उपाधि और वाचा-संबंधी निज नाम दोनों उपस्थित हैं। हिन्दी बाइबलीय प्रयोग में पहचाने जाने वाले ‘यहोवा’ को रखते हुए दोनों को अलग-अलग व्यक्त किया गया है; नाम को केवल ‘प्रभु’ में विलीन नहीं किया गया।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। ‘विद्रोही घराना’ भविष्यद्वक्ताई मुहावरे को सुरक्षित रखता है, जबकि ‘हाँड़ी चढ़ाओ’ साधारण हिन्दी में चूल्हे पर पात्र रखने की क्रिया को स्वाभाविक रूप से व्यक्त करता है।
