base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/024/021.yaml
  text: 'Say to the house of Israel[a], ‘Thus says the Lord GOD: Behold, I am about to profane my sanctuary, the pride of your strength, the delight of your eyes, and the desire of your soul[c][b]; and your sons and your daughters whom you left behind will fall by the sword.’'
translation:
  language: hi
  text: 'इस्राएल के घराने से कहो, ‘प्रभु यहोवा यों कहता है: देखो, मैं अपने पवित्रस्थान को अपवित्र करने वाला हूँ[a], जो तुम्हारे सामर्थ्य का गर्व, तुम्हारी आँखों का आनन्द[b] और तुम्हारे प्राणों की प्रिय वस्तु है[c]। तुम्हारे बेटे और बेटियाँ, जिन्हें तुम पीछे छोड़ आए हो, तलवार से मारे जाएँगे।’'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘अपवित्र ठहराना,’ ‘अपमानित करना’ या ‘पवित्रता भंग करना’ भी सम्भव है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, ‘तुम्हारी आँखों की चाहत’; अर्थात वह जो उन्हें अत्यन्त प्रिय और मनोहर था।
    reason: lexical_alternative
  - marker: c
    text: इब्रानी अभिव्यक्ति दुर्लभ है। इसका अर्थ ‘जिसे तुम्हारे प्राण सँजोते हैं’ या ‘जिस पर तुम्हारे प्राण को तरस आता है’ भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱמֹר לְבֵית יִשְׂרָאֵל
  choice: इस्राएल के घराने से कह
  rationale: एकवचन आज्ञा को बनाए रखता है और सामूहिक वाचा-सूचक अभिव्यक्ति ‘इस्राएल का घराना’ को सामान्य ‘इस्राएल’ में नहीं बदलता।
- source_word: כֹּה אָמַר אֲדֹנָי יְהוִה
  choice: प्रभु यहोवा यों कहता है
  rationale: प्रचलित भविष्यद्वाणी-सूत्र को स्वाभाविक हिन्दी में रखता है और יהוה को व्यक्तिगत वाचा-नाम ‘यहोवा’ के रूप में स्पष्ट करता है।
- source_word: הִנְנִי מְחַלֵּל
  choice: देखो, मैं ... अपवित्र करने पर हूँ
  rationale: הִנְנִי की गंभीर आत्म-घोषणा और कृदन्त से व्यक्त आसन्न कार्य—दोनों को संप्रेषित करता है।
- source_word: מִקְדָּשִׁי
  choice: अपने पवित्रस्थान
  rationale: मूल के ‘मेरे पवित्रस्थान’ का निकट अर्थ है; सन्दर्भ में यरूशलेम का मन्दिर अभिप्रेत है, पर अनुवाद मूल शब्द से अधिक संकीर्ण नहीं होता।
- source_word: גְּאוֹן עֻזְּכֶם
  choice: तुम्हारे बल का गौरव
  rationale: रचना-सम्बन्ध को सुरक्षित रखते हुए उस पवित्रस्थान को उनके सामर्थ्य और गर्व की प्रतिष्ठा के रूप में दिखाता है।
- source_word: מַחְמַד עֵינֵיכֶם
  choice: तुम्हारी आँखों का आनन्द
  rationale: बहुमूल्य और मनोहर वस्तु का भाव स्वाभाविक हिन्दी में व्यक्त करता है तथा यहेजकेल 24:16 की भावात्मक भाषा से मेल रखता है।
- source_word: וּמַחְמַל נַפְשְׁכֶם
  choice: तुम्हारे प्राण का दुलारा
  rationale: दुर्लभ शब्द में निहित स्नेहपूर्वक बचाने, सँजोने या दुलारने के भाव को बनाए रखता है; ‘प्राण’ נֶפֶשׁ की व्यक्तित्वगत गहराई को दर्शाता है।
- source_word: וּבְנֵיכֶם וּבְנוֹתֵיכֶם אֲשֶׁר עֲזַבְתֶּם
  choice: तुम्हारे बेटे-बेटियाँ, जिन्हें तुम पीछे छोड़ आए हो
  rationale: पुत्र और पुत्रियों की स्पष्ट जोड़ी को बनाए रखता है और युद्ध/निर्वासन की स्थिति में पीछे रह जाने का आशय स्पष्ट करता है।
- source_word: בַּחֶרֶב יִפֹּלוּ
  choice: तलवार से मारे जाएँगे
  rationale: हिन्दी में हिंसक मृत्यु का अर्थ स्पष्ट करता है; शाब्दिक ‘तलवार से गिरेंगे’ सम्भव है, पर कम स्वाभाविक।
theological_decisions:
- issue: יהוה के दिव्य नाम का अनुवाद
  choice: यहोवा
  alternative: याहवे; बड़े अक्षरों में ‘प्रभु’
  rationale: मूल में वाचा का व्यक्तिगत नाम उपस्थित है। हिन्दी बाइबलीय प्रयोग में ‘यहोवा’ व्यापक रूप से पहचाना जाता है और אֲדֹנָי के ‘प्रभु’ से उसका भेद बनाए रखता है।
- issue: परमेश्वर द्वारा अपने ही पवित्रस्थान को अपवित्र करने का कथन
  choice: 'प्रत्यक्ष कर्तृत्व बनाए रखा: ‘मैं ... अपवित्र करने पर हूँ’'
  alternative: ‘मैं उसे अपवित्र होने दूँगा’
  rationale: मूल प्रथम पुरुष में प्रत्यक्ष दैवी कर्तृत्व व्यक्त करता है। इसे केवल अनुमति के रूप में बदलना मूल की धर्मवैचारिक तीक्ष्णता को अनावश्यक रूप से हल्का कर देता।
- issue: מַחְמַל נַפְשְׁכֶם का दुर्लभ और संदिग्ध अर्थ
  choice: तुम्हारे प्राण का दुलारा
  alternative: जिस पर तुम्हारे प्राण को तरस आता है; तुम्हारे प्राण की अभिलाषा
  rationale: समानान्तर पदों में प्रिय और सँजोई हुई वस्तु का भाव उपयुक्त है, लेकिन दया/बख्शने से जुड़ी शब्दगत सम्भावना को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और मौखिक पठन के योग्य रखी गई है। ‘इस्राएल का घराना’, ‘प्रभु यहोवा’, ‘पवित्रस्थान’ और ‘तलवार’ भविष्यद्वाणी के औपचारिक स्वर को बनाए रखते हैं; दुर्लभ अभिव्यक्ति की वास्तविक अस्पष्टता को मुख्य पाठ और पादटिप्पणी में सुरक्षित रखा गया है।
