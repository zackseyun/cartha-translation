id: EZK.24.22
reference: Ezekiel 24:22
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/עֲשִׂיתֶ֖ם כַּ/אֲשֶׁ֣ר עָשִׂ֑יתִי עַל שָׂפָם֙ לֹ֣א תַעְט֔וּ וְ/לֶ֥חֶם אֲנָשִׁ֖ים לֹ֥א תֹאכֵֽלוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/024/022.yaml
  text: 'And you will do as I have done: you will not cover your mustache[b][a], and you will not eat the bread of men.'
translation:
  language: hi
  text: 'और तुम वही करोगे जो मैंने किया है: तुम अपनी मूँछ नहीं ढकोगे[a], और लोगों की रोटी नहीं खाओगे[b]।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: मूँछ या ऊपरी होंठ को ढकना शोक अथवा अशुद्धता का प्रचलित चिह्न था।
    reason: cultural_note
  - marker: b
    text: सम्भवतः “शोक मनानेवालों की रोटी,” अर्थात शोक में सांत्वना देने के लिए दूसरे लोगों द्वारा लाया गया भोजन।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַעֲשִׂיתֶם
  choice: और तुम…करोगे
  rationale: वाव के संबंध को रखते हुए रूप के भविष्यसूचक बल को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: כַּאֲשֶׁר עָשִׂיתִי
  choice: वही…जो मैंने किया है
  rationale: लोगों के भावी व्यवहार की तुलना यहेजकेल के पहले किए हुए संकेतात्मक कार्य से करता है।
- source_word: עַל שָׂפָם לֹא תַעְטוּ
  choice: तुम अपनी मूँछ नहीं ढकोगे
  rationale: שָׂפָם ऊपरी होंठ अथवा मूँछ के भाग को सूचित करता है; हिन्दी में ‘मूँछ ढकना’ शोक-प्रथा के इस कार्य का संक्षिप्त और स्वाभाविक वर्णन है।
- source_word: לֶחֶם אֲנָשִׁים
  choice: लोगों की रोटी
  rationale: इब्रानी के शाब्दिक ‘मनुष्यों/लोगों की रोटी’ को बनाए रखता है और सम्भावित शोक-संदर्भित अर्थ को पाद-टिप्पणी में देता है।
- source_word: לֹא תֹאכֵלוּ
  choice: नहीं खाओगे
  rationale: संदर्भ में भविष्यसूचक अर्थ और पहले खंड के समानांतर रूप को सुरक्षित रखता है।
