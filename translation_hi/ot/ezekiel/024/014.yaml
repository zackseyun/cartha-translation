  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट हिन्दी अपनाई गई है। सम्बोधन एकवचन और अनौपचारिक-प्राचीन ‘तेरे/तुझे’ में रखा गया है, क्योंकि वचन यरूशलेम को स्त्रीलिंग एकवचन में सम्बोधित करता है और यह भविष्यद्वाणी की गम्भीर शैली के अनुकूल है।
