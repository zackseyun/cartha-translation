base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/024/014.yaml
  text: I[a], Yahweh, have spoken; it is coming[b], and I will do it. I will not hold back, nor will I spare, nor will I relent. According to your ways and according to your deeds they will judge you[c], declares the Lord GOD.
translation:
  language: hi
  text: “मैं यहोवा बोल चुका हूँ। वह विपत्ति आ रही है[a], और मैं उसे घटित करूँगा। मैं पीछे नहीं हटूँगा[b], न तुझे बख्शूँगा, न अपना मन बदलूँगा[c]। तेरे चालचलन और तेरे कामों के अनुसार वे तेरा न्याय करेंगे[d],” प्रभु यहोवा की यह घोषणा है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: मूल में केवल स्त्रीलिंग रूप में ‘वह आ रही है’ है; निहित विषय सम्भवतः पहले घोषित विपत्ति या न्याय है।
    reason: implicit_subject
  - marker: b
    text: या ‘मैं न रुकूँगा’ अथवा ‘मैं ढील न दूँगा’।
    reason: lexical_alternative
  - marker: c
    text: या ‘न पछताऊँगा’ अथवा ‘दण्ड देने से न फिरूँगा’।
    reason: lexical_alternative
  - marker: d
    text: मूल में ‘वे तेरा न्याय करेंगे’ है। यह अनिर्दिष्ट बहुवचन उन लोगों की ओर संकेत कर सकता है जो यहोवा के न्याय को कार्यान्वित करेंगे।
    reason: grammatical_ambiguity
lexical_decisions:
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिन्दी में प्रचलित रूप ‘यहोवा’ परमेश्वर के व्यक्तिगत नाम को शीर्षक से बदलने के बजाय नाम के रूप में बनाए रखता है।
- source_word: דִּבַּרְתִּי
  choice: बोल चुका हूँ
  rationale: पूर्ण हुई ईश्वरीय घोषणा और उसके वर्तमान प्रभाव—दोनों को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: בָּאָה
  choice: वह विपत्ति आ रही है
  rationale: स्त्रीलिंग एकवचन क्रिया का निहित विषय प्रसंग में घोषित विपत्ति या न्याय है; उसे स्पष्ट करने से हिन्दी में वाक्य स्वाभाविक रहता है, जबकि पादटिप्पणी मूल की अनिर्दिष्टता बताती है।
- source_word: וְעָשִׂיתִי
  choice: और मैं उसे घटित करूँगा
  rationale: संयुक्त पूर्ण क्रिया इस भविष्यसूचक क्रम में आगामी निश्चित कार्य को सूचित करती है; यह अनुवाद उसकी निश्चितता और कारकता दोनों रखता है।
- source_word: אֶפְרַע
  choice: पीछे नहीं हटूँगा
  rationale: यह न्याय को कार्यान्वित करने से न रुकने या न हटने का भाव देता है और आधुनिक हिन्दी में स्पष्ट है।
- source_word: אָחוּס
  choice: न तुझे छोड़ूँगा
  rationale: न्याय के प्रसंग में חוס का अर्थ दया के कारण किसी को दण्ड से बख्श देना है; ‘छोड़ूँगा’ सामान्य हिन्दी में वही न्यायिक अर्थ देता है।
- source_word: אֶנָּחֵם
  choice: न अपना मन बदलूँगा
  rationale: घोषित दण्ड से न फिरने का भाव व्यक्त करता है; पादटिप्पणी ‘न पछताऊँगा’ की अधिक शाब्दिक सम्भावना सुरक्षित रखती है।
- source_word: כִּדְרָכַיִךְ
  choice: तेरे चालचलन के अनुसार
  rationale: नैतिक अर्थ में ‘मार्गों’ के रूपक को सहज हिन्दी ‘चालचलन’ द्वारा व्यक्त किया गया है।
- source_word: וְכַעֲלִילוֹתַיִךְ
  choice: तेरे कामों के अनुसार
  rationale: नैतिक भार वाले कार्यों या कर्मों के लिए सरल, स्वाभाविक और व्यापक रूप से समझा जाने वाला विकल्प है।
- source_word: שְׁפָטוּךְ
  choice: वे तेरा न्याय करेंगे
  rationale: मूल के अनिर्दिष्ट तृतीय पुरुष बहुवचन को कर्मवाच्य में बदलने के बजाय ज्यों का त्यों सक्रिय रखा गया है।
- source_word: אֲדֹנָי יְהֹוִה
  choice: प्रभु यहोवा
  rationale: पहले पद को उपाधि और दूसरे को व्यक्तिगत नाम के रूप में अलग-अलग सुरक्षित रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: प्रभु / याहवे
  rationale: मूल में उपस्थित व्यक्तिगत ईश्वरीय नाम को केवल उपाधि से नहीं बदला गया; ‘यहोवा’ हिन्दी पाठकों में स्थापित नाम-रूप है।
- issue: ईश्वरीय נָחַם का अर्थ
  choice: न अपना मन बदलूँगा
  alternative: न पछताऊँगा / दण्ड देने से न फिरूँगा
  rationale: मुख्य पाठ घोषित न्याय को वापस न लेने का प्रसंगगत भाव देता है, जबकि पादटिप्पणी मूल शब्द की ‘पछताने’ अथवा ‘फिरने’ संबंधी अर्थ-व्याप्ति और धर्मवैज्ञानिक तनाव को बनाए रखती है।
- issue: न्याय करने वाले अनिर्दिष्ट बहुवचन का संरक्षण
  choice: वे तेरा न्याय करेंगे
  alternative: तेरा न्याय किया जाएगा
  rationale: मूल उन कर्ताओं की पहचान नहीं करता; सक्रिय बहुवचन को सुरक्षित रखकर उन्हें परमेश्वर, आक्रमणकारियों या अन्य निष्पादकों के रूप में निश्चित नहीं किया गया।
