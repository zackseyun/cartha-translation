base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/024/018.yaml
  text: So I spoke to the people in the morning[a], and my wife died in the evening. Then in the morning I did as I had been commanded.
translation:
  language: hi
  text: मैंने सुबह लोगों से बात की[a], और शाम को मेरी पत्नी मर गई। फिर सुबह मैंने वैसा ही किया जैसा मुझे आज्ञा दी गई थी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “और मैंने सुबह लोगों से बात की ... और सुबह मैंने वैसा ही किया जैसा मुझे आज्ञा दी गई थी।” इब्रानी कथा में ‘और’ से जुड़ी क्रियाएँ बार-बार आती हैं; मुख्य पाठ स्वाभाविक हिन्दी में उनके क्रम को व्यक्त करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֲדַבֵּר
  choice: इसलिए मैंने ... बात की
  rationale: वाव से जुड़ा यह क्रियारूप कथा को आगे बढ़ाता है और पिछले प्रसंग के परिणामस्वरूप यह कार्य दिखाता है। ‘इसलिए’ स्वाभाविक हिन्दी में उस क्रम/परिणाम को व्यक्त करता है।
- source_word: אֶל הָעָם
  choice: लोगों से
  rationale: עָם यहाँ सामूहिक रूप से ‘लोग’ है। דּבר אל का स्वाभाविक हिन्दी प्रयोग ‘लोगों से बात की’ है।
- source_word: בַּבֹּקֶר
  choice: सुबह
  rationale: यह समय बताने वाला पद है। हिन्दी में ‘सुबह’ संक्षिप्त और स्वाभाविक है। दूसरी आवृत्ति में क्रम स्पष्ट करने के लिए ‘अगली सुबह’ रखा गया है।
- source_word: וַתָּמָת
  choice: मर गई
  rationale: מות मृत्यु के लिए सीधी और सामान्य क्रिया है; ‘मर गई’ मूल की स्पष्टता को नरम नहीं करती।
- source_word: אִשְׁתִּי
  choice: मेरी पत्नी
  rationale: प्रथम पुरुष एकवचन प्रत्यय सहित אִשָּׁה का वैवाहिक संदर्भ में स्पष्ट अर्थ ‘मेरी पत्नी’ है।
- source_word: בָּעָרֶב
  choice: शाम को
  rationale: यह समयसूचक पद सुबह के समानांतर है; ‘शाम को’ आधुनिक हिन्दी में सहज है।
- source_word: וָאַעַשׂ
  choice: फिर ... मैंने ... किया
  rationale: עשה यहाँ आज्ञा के अनुसार कार्य करने को व्यापक रूप से व्यक्त करता है। ‘फिर’ कथा का क्रम दिखाता है और कर्म को अनावश्यक रूप से विशिष्ट नहीं बनाता।
- source_word: כַּאֲשֶׁר
  choice: वैसा ही ... जैसा
  rationale: यह आज्ञा और किए गए कार्य के अनुरूप होने का भाव देता है; ‘वैसा ही ... जैसा’ हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: צֻוֵּיתִי
  choice: मुझे आज्ञा दी गई थी
  rationale: पुअल रूप यह दिखाता है कि यहेजकेल आज्ञा पाने वाला था। ‘दी गई थी’ बताता है कि आज्ञा कार्य से पहले मिल चुकी थी।
