  yaml_path: translation/ot/ezekiel/024/020.yaml
  text: So I said to them[a], “The word of Yahweh came to me, saying,”
translation:
  language: hi
  text: तब मैंने उनसे कहा, “याहवे का वचन मेरे पास आया, इस प्रकार:”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וָאֹמַר
  choice: तब मैंने कहा
  rationale: वाव-क्रमिक रूप कथा को अगले कथन की ओर बढ़ाता है; आधुनिक हिन्दी में ‘तब’ इस क्रम को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: אֲלֵיהֶם
  choice: उनसे
  rationale: אֶל के साथ बहुवचन प्रत्यय उन लोगों को संबोधित किए जाने को दर्शाता है; हिन्दी में ‘उनसे कहा’ स्वाभाविक है।
- source_word: דְּבַר יְהוָה
  choice: याहवे का वचन
  rationale: मानक नबीय सूत्र को बनाए रखने के लिए דָּבָר का अनुवाद ‘वचन’ किया गया है, न कि अधिक व्याख्यात्मक ‘संदेश’।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को उपाधि से बदलने के बजाय लिप्यंतरित किया गया है।
- source_word: הָיָה אֵלַי
  choice: मेरे पास आया
  rationale: शाब्दिक रूप ‘मेरे लिए/पास हुआ’ है, पर नबीय सूत्र में आधुनिक हिन्दी का स्वाभाविक समतुल्य ‘मेरे पास आया’ है।
- source_word: לֵאמֹר
  choice: उन्होंने कहा
  rationale: यह आगामी प्रत्यक्ष कथन का परिचय देता है। हिन्दी में कर्ता-सम्मान के अनुरूप ‘उन्होंने कहा’ स्वाभाविक है और अगले पद में आने वाले वचन की भूमिका बनाता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा / प्रभु
  rationale: मूल पाठ व्यक्तिगत वाचा-नाम का प्रयोग करता है। ‘याहवे’ उसे उपाधि में बदले बिना सुरक्षित रखता है।
- issue: לֵאמֹר में निहित वक्ता
  choice: उन्होंने कहा
  alternative: यह कहते हुए / कि
  rationale: व्याकरणिक रूप केवल उद्धरण का परिचय देता है और अलग से सर्वनाम नहीं लिखता; हिन्दी में आदरसूचक कर्ता प्रसंग से स्पष्ट होता है। यह अगले पद में परमेश्वर के कथन की ओर संकेत करता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; भाषा सरल, गरिमापूर्ण और नबी-वचन के औपचारिक स्वर के अनुकूल रखी गई है।
