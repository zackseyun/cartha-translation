source:
  edition: WLC
  text: וְ/אַתָּ֣ה בֶן אָדָ֔ם הֲ/ל֗וֹא בְּ/י֨וֹם קַחְתִּ֤/י מֵ/הֶם֙ אֶת מָ֣עוּזָּ֔/ם מְשׂ֖וֹשׂ תִּפְאַרְתָּ֑/ם אֶת מַחְמַ֤ד עֵֽינֵי/הֶם֙ וְ/אֶת מַשָּׂ֣א נַפְשָׁ֔/ם בְּנֵי/הֶ֖ם וּ/בְנוֹתֵי/הֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/024/025.yaml
  text: And you[a], son of man, will it not be that on the day when I take from them their stronghold, the joy of their glory, the delight of their eyes[b], and the desire of their soul—their sons and their daughters—
translation:
  language: hi
  text: और हे मनुष्य के पुत्र, क्या ऐसा न होगा कि जिस दिन मैं उनसे उनका गढ़, उनके गौरव का आनंद, उनकी आँखों की प्रिय वस्तु और उनके प्राणों की अभिलाषा—अर्थात् उनके बेटे और बेटियाँ—ले लूँगा—
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֶן אָדָם
  choice: मनुष्य के पुत्र
  rationale: यहेजकेल में बार-बार आने वाले ईश्वरीय संबोधन का प्रचलित और औपचारिक रूप सुरक्षित रखता है।
- source_word: הֲלוֹא
  choice: क्या ऐसा न होगा कि
  rationale: यह अपेक्षित सकारात्मक उत्तर वाले आलंकारिक प्रश्न को स्वाभाविक हिन्दी में बनाए रखता है; वाक्य अगले पद में पूरा होता है।
- source_word: קַחְתִּי מֵהֶם
  choice: मैं उनसे … छीन लूँगा
  rationale: यहाँ לקח מן का अर्थ उनसे कुछ ले लेना या दूर कर देना है। ‘छीन लूँगा’ न्याय के प्रसंग में उस वियोग की तीव्रता व्यक्त करता है।
- source_word: מָעוּזָּם
  choice: उनका दृढ़ आश्रय
  rationale: מָעוֹז में सामर्थ्य के स्थान और शरण, दोनों का भाव है; यह अनावश्यक रूप से केवल किसी भौतिक किले तक अर्थ को सीमित नहीं करता।
- source_word: מְשׂוֹשׂ תִּפְאַרְתָּם
  choice: उनके गौरव का आनंद
  rationale: इब्रानी की संक्षिप्त संबंधवाचक पदावली और गौरव तथा हर्ष के संयुक्त भाव को सुरक्षित रखता है।
- source_word: מַחְמַד עֵינֵיהֶם
  choice: उनकी आँखों का दुलारा
  rationale: जो वस्तु अत्यंत प्रिय और मनोहर हो, उसके लिए यह स्वाभाविक हिन्दी मुहावरा है और मूल के भावात्मक स्वर को बनाए रखता है।
- source_word: מַשָּׂא נַפְשָׁם
  choice: उनके मन की लालसा
  rationale: इस कठिन पदबंध को प्रसंगानुसार उस प्रिय वस्तु या व्यक्ति के रूप में व्यक्त करता है जिसकी ओर उनका आंतरिक अस्तित्व लगा है; ‘मन’ आधुनिक हिन्दी में נֶפֶשׁ के इस भाव को सहजता से संप्रेषित करता है।
- source_word: בְּנֵיהֶם וּבְנוֹתֵיהֶם
  choice: उनके बेटे और उनकी बेटियाँ
  rationale: मूल में अलग-अलग उल्लिखित दोनों समूहों को ‘बच्चे’ कहकर समतल करने के बजाय स्पष्ट रूप से बनाए रखता है।
theological_decisions:
- issue: पद के अंत में वाक्य का अधूरा रहना
  choice: अंत में दीर्घ विराम-चिह्न रखकर वाक्य को अगले पद की ओर खुला रखा गया है
  alternative: इसे पूर्ण वाक्य बनाकर समाप्त करना
  rationale: इब्रानी प्रश्न पद 26 में आगे बढ़ता है; पद 25 में उसे पूरा करना स्रोत की वाक्य-संरचना और अपेक्षा को बदल देता।
- issue: बेटे-बेटियों का ‘मन की लालसा’ से संबंध
  choice: उन्हें दीर्घ विराम-चिह्नों के बीच व्याख्यात्मक-समानाधिकरण के रूप में रखा गया है
  alternative: उन्हें सूची की एक पूर्णतः स्वतंत्र वस्तु मानना
  rationale: इब्रानी विन्यास उनके बेटे-बेटियों को preceding מַשָּׂא נַפְשָׁם की व्याख्या के रूप में पढ़ने देता है, जबकि वाक्य में उनके अलग उल्लेख को भी सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘दृढ़ आश्रय’ और ‘आँखों का दुलारा’ मूल के काव्यात्मक समानांतर भाव को बनाए रखते हैं। पद का अधूरा प्रश्न जानबूझकर सुरक्षित है, क्योंकि उसका उत्तरात्मक क्रम अगले पद में जारी रहता है।
