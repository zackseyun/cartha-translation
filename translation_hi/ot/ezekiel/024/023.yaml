  text: וּ/פְאֵרֵ/כֶ֣ם עַל רָאשֵׁי/כֶ֗ם וְ/נַֽעֲלֵי/כֶם֙ בְּ/רַגְלֵי/כֶ֔ם לֹ֥א תִסְפְּד֖וּ וְ/לֹ֣א תִבְכּ֑וּ וּ/נְמַקֹּתֶם֙ בַּ/עֲוֺנֹ֣תֵי/כֶ֔ם וּ/נְהַמְתֶּ֖ם אִ֥ישׁ אֶל אָחִֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/024/023.yaml
  text: Your turbans will be on your heads and your sandals on your feet[a]; you will not mourn and you will not weep[c][b], but you will waste away in your iniquities and groan to one another.
translation:
  language: hi
  text: तुम्हारी पगड़ियाँ तुम्हारे सिरों पर और तुम्हारी जूतियाँ तुम्हारे पैरों में रहेंगी[a]। तुम न शोक मनाओगे, न रोओगे; बल्कि अपने अधर्मों में गलते जाओगे[b] और अपने-अपने भाई की ओर कराहोगे[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘पगड़ियाँ’ के लिए इब्रानी शब्द का अर्थ ‘सिर के शोभायुक्त आवरण’ या ‘श्रृंगार’ भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: ‘अपने अधर्मों में’ का अर्थ ‘अपने अधर्मों के कारण’ या ‘अपने दोषों में’ भी समझा जा सकता है।
    reason: lexical_alternative
  - marker: c
    text: 'शाब्दिक रूप से: ‘हर पुरुष अपने भाई की ओर।’'
    reason: literal_rendering
lexical_decisions:
- source_word: פְאֵרֵיכֶם
  choice: तुम्हारी पगड़ियाँ
  rationale: פְאֵר यहाँ सिर पर पहने जाने वाले शोभायुक्त आवरण को सूचित करता है। शोक-रीतियों के संदर्भ में ‘पगड़ियाँ’ स्वाभाविक और सांस्कृतिक रूप से उपयुक्त है।
- source_word: נַעֲלֵיכֶם
  choice: तुम्हारी जूतियाँ
  rationale: נַעַל प्राचीन निकट-पूर्वी पादत्राण को दर्शाता है; आधुनिक हिन्दी में ‘जूतियाँ’ ‘चप्पलों’ की अपेक्षा इस प्रसंग में अधिक गरिमापूर्ण और सहज है।
- source_word: תִסְפְּדוּ
  choice: शोक मनाओगे
  rationale: ספד मृतक के लिए औपचारिक विलाप अथवा शोक करने को दर्शाता है; ‘शोक मनाना’ प्रचलित हिन्दी अभिव्यक्ति है।
- source_word: תִבְכּוּ
  choice: रोओगे
  rationale: בכה का सीधा और स्वाभाविक हिन्दी अनुवाद ‘रोना’ है।
- source_word: נְמַקֹּתֶם
  choice: गलते जाओगे
  rationale: מקק क्षीण होने, गलने या नष्ट होते जाने का भाव देता है। ‘गलते जाओगे’ मूल की तीव्रता और निरंतर प्रक्रिया दोनों बनाए रखता है।
- source_word: בַּעֲוֺנֹתֵיכֶם
  choice: अपने अधर्मों में
  rationale: בְּ उपसर्ग को ‘में’ और עָוֹן को ‘अधर्म’ देकर मूल की संक्षिप्त तथा जानबूझकर खुली अभिव्यक्ति सुरक्षित रखी गई है; यह पाप, दोष और उसके परिणाम के परस्पर संबंध को अति-व्याख्यायित नहीं करता।
- source_word: נְהַמְתֶּם
  choice: कराहेगा
  rationale: נהם पीड़ा में निकली नीची, भारी ध्वनि को व्यक्त करता है; ‘कराहना’ आधुनिक हिन्दी में इसका स्वाभाविक समतुल्य है।
- source_word: אִישׁ אֶל אָחִיו
  choice: हर एक अपने भाई के सामने
  rationale: इब्रानी में पुरुषवाची אִישׁ और संबंधवाची אָחִיו स्पष्ट हैं। ‘हर एक अपने भाई के सामने’ इस रूप को बनाए रखते हुए אֶל के पारस्परिक दिशा-भाव को व्यक्त करता है।
theological_decisions:
- issue: עָוֹן का अर्थ न्याय के संदर्भ में
  choice: अधर्मों
  alternative: दोषों; अधर्मों के कारण; अधर्मों का दंड
  rationale: शब्द पाप, उससे उत्पन्न दोष और कभी उसके दंड को समेट सकता है। मुख्य पाठ में ‘अधर्मों’ तथा ‘में’ रखकर इस अर्थगत तनाव को अनिर्णीत छोड़ा गया है; पादटिप्पणी विकल्प बताती है।
- issue: लिंग-सूचक संबंधपरक भाषा
  choice: हर एक अपने भाई के सामने
  alternative: एक-दूसरे के सामने
  rationale: मूल में ‘पुरुष/हर एक’ और ‘उसका भाई’ जैसे पुरुषवाची पद हैं। उन्हें लिंग-निरपेक्ष बनाकर मिटाने के बजाय हिन्दी में स्पष्ट रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सहज शैली। दूसरे पुरुष बहुवचन और भविष्यकाल को बनाए रखा गया है। शोक-संबंधी रीतियों तथा न्याय की गंभीरता को बिना सांप्रदायिक व्याख्या जोड़े व्यक्त किया गया है।
