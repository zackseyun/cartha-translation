source:
  edition: WLC
  text: עַ֤ם הָ/אָ֨רֶץ֙ עָ֣שְׁקוּ עֹ֔שֶׁק וְ/גָזְל֖וּ גָּזֵ֑ל וְ/עָנִ֤י וְ/אֶבְיוֹן֙ הוֹנ֔וּ וְ/אֶת הַ/גֵּ֥ר עָשְׁק֖וּ בְּ/לֹ֥א מִשְׁפָּֽט־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/022/029.yaml
  text: The people of the land have practiced oppression and committed robbery; they have mistreated the poor and needy[a], and they have oppressed the foreigner without justice.
translation:
  language: hi
  text: देश के लोगों ने अत्याचार पर अत्याचार किए हैं और लूटपाट की है। उन्होंने गरीबों और ज़रूरतमंदों के साथ दुर्व्यवहार किया है और परदेशी पर न्याय के बिना अत्याचार किया है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עַם הָאָרֶץ
  choice: देश के लोग
  rationale: यह पदबंध देश की व्यापक जनता को सूचित करता है। ‘देश के लोग’ मूल अभिव्यक्ति को स्वाभाविक आधुनिक हिन्दी में बनाए रखता है और इसे किसी तकनीकी सामाजिक वर्ग तक सीमित नहीं करता।
- source_word: עָשְׁקוּ עֹשֶׁק
  choice: अत्याचार पर अत्याचार करते रहे हैं
  rationale: क्रिया और उसी मूल की संज्ञा का प्रयोग कार्य की तीव्रता और निरंतर चरित्र पर बल देता है। हिन्दी की पुनरुक्तिपरक अभिव्यक्ति इस बल को स्वाभाविक रूप से व्यक्त करती है।
- source_word: וְגָזְלוּ גָּזֵל
  choice: और लूटपाट करते रहे हैं
  rationale: यह समान-मूल क्रिया-संज्ञा रचना जबरन छीनने और खुले रूप से लूटने के बारंबार आचरण को दर्शाती है। ‘लूटपाट’ हिन्दी में संक्षिप्त और स्वाभाविक है।
- source_word: וְעָנִי וְאֶבְיוֹן
  choice: दीन-दरिद्र लोगों
  rationale: यह युग्म सामाजिक और आर्थिक रूप से असहाय लोगों को सूचित करता है। ‘दीन-दरिद्र’ दोनों पदों के संयुक्त बल को गरिमापूर्ण और सुबोध हिन्दी में व्यक्त करता है।
- source_word: הוֹנוּ
  choice: के साथ दुर्व्यवहार किया है
  rationale: हिफ़ईल रूप शोषणपूर्ण, अन्यायकारी या अपमानजनक व्यवहार का व्यापक अर्थ रखता है। ‘दुर्व्यवहार’ इस व्यापकता को बनाए रखता है और עשק के लिए प्रयुक्त ‘अत्याचार’ से शब्दगत भेद भी सुरक्षित करता है।
- source_word: הַגֵּר
  choice: परदेशी
  rationale: यह शब्द उस गैर-मूल निवासी को सूचित करता है जो समुदाय के बीच रहता है। ‘परदेशी’ आधुनिक हिन्दी में पठनीय है; निवास-संबंधी विशिष्टता पादटिप्पणी में स्पष्ट की गई है।
- source_word: עָשְׁקוּ
  choice: अत्याचार किया है
  rationale: सरल क्रिया का अर्थ दबाना, शोषण करना या अत्याचार करना है। ‘अत्याचार’ आरंभिक समान-मूल पदबंध से उसका शब्दगत संबंध बनाए रखता है।
- source_word: בְּלֹא מִשְׁפָּט
  choice: अन्यायपूर्वक
  rationale: मूलतः ‘न्याय के बिना’ का भाव है। ‘अन्यायपूर्वक’ हिन्दी में सहज रहते हुए वैधानिक और नैतिक न्याय दोनों की अनुपस्थिति व्यक्त करता है।
theological_decisions:
- issue: भविष्यद्वक्ता के आरोप में सामाजिक अन्याय की ठोस श्रेणियाँ
  choice: अत्याचार, लूटपाट, दीन-दरिद्रों से दुर्व्यवहार और परदेशी पर अन्याय को स्पष्ट रूप से बनाए रखा गया है।
  alternative: इन्हें सामान्य भाषा में ‘बुराई करना’ या ‘गलत व्यवहार करना’ कहा जा सकता था।
  rationale: मूल पाठ सामान्य दुष्टता नहीं, बल्कि विशिष्ट सामाजिक और नैतिक अपराधों का आरोप लगाता है; इसलिए इन ठोस श्रेणियों को नरम या सामान्यीकृत नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण भविष्यद्वक्ताई लहजा और सामान्य पाठक के लिए स्पष्ट शब्दावली। समान-मूल इब्रानी रचनाओं का बल हिन्दी की स्वाभाविक पुनरुक्ति और क्रियात्मक अभिव्यक्ति से व्यक्त किया गया है।
