base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/022/027.yaml
  text: Her princes within her are like wolves tearing prey[a], to shed blood, to destroy lives[b], in order to gain dishonest profit.
translation:
  language: hi
  text: उसके भीतर के शासक उन भेड़ियों जैसे हैं जो शिकार को फाड़ डालते हैं—खून बहाने और लोगों की जान लेने[a] के लिए, ताकि वे बेईमानी से लाभ कमाएँ[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “प्राणों को नष्ट करने”; इसका अनुवाद “व्यक्तियों का नाश करने” भी हो सकता है। इब्रानी נְפָשׁוֹת संदर्भ के अनुसार व्यक्तियों, जीवनों या प्राणों को सूचित कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: इसका अनुवाद “अन्यायी लाभ कमाएँ” या “जबरन वसूली से लाभ पाएँ” भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׂרֶיהָ
  choice: उसके हाकिम
  rationale: שַׂר यहाँ नगर के सत्ताधारी शासकों या उच्च अधिकारियों को सूचित करता है। ‘हाकिम’ राजनीतिक अधिकार और दोषारोपण के भाव को स्वाभाविक आधुनिक हिन्दी में बनाए रखता है।
- source_word: בְּקִרְבָּהּ
  choice: उसके भीतर
  rationale: यह नगर या समुदाय के बीच विद्यमान भ्रष्टाचार को दर्शाता है और मूल स्त्रीलिंग प्रत्यय का संदर्भ बनाए रखता है।
- source_word: כִּזְאֵבִים טֹרְפֵי טָרֶף
  choice: उन भेड़ियों जैसे हैं जो शिकार को फाड़ डालते हैं
  rationale: तुलना और हिंसक शिकारी बिंब दोनों सुरक्षित रहते हैं। कृदंत और सजातीय कर्म की तीव्रता को ‘फाड़ डालते हैं’ सहज हिन्दी में व्यक्त करता है।
- source_word: לִשְׁפָּךְ דָּם
  choice: खून बहाने के लिए
  rationale: यह हिंसक हत्या का प्रचलित इब्रानी मुहावरा है; हिन्दी में ‘खून बहाना’ उसका स्पष्ट और स्वाभाविक समतुल्य है।
- source_word: לְאַבֵּד נְפָשׁוֹת
  choice: लोगों की जान लेने के लिए
  rationale: इस सामाजिक हिंसा के संदर्भ में נְפָשׁוֹת जीवित व्यक्तियों या उनके जीवन को सूचित करता है। यह अनुवाद अमूर्त आत्मा-संबंधी दावा किए बिना वास्तविक हत्या का अर्थ स्पष्ट करता है।
- source_word: לְמַעַן בְּצֹעַ בָּצַע
  choice: ताकि बेईमानी से लाभ कमाएँ
  rationale: לְמַעַן उद्देश्य बताता है, जबकि בצע की पुनरुक्ति लोभ से प्राप्त अन्यायी या हिंसक लाभ पर बल देती है। ‘बेईमानी से लाभ’ उसके आर्थिक और नैतिक दोनों पक्षों को व्यक्त करता है।
theological_decisions:
- issue: न्याय और हिंसा के संदर्भ में נְפָשׁוֹת का अर्थ
  choice: ‘लोगों की जान’, अर्थात नष्ट किए जा रहे मनुष्य
  alternative: ‘प्राणों’ या ‘व्यक्तियों’ का नाश
  rationale: संदर्भ शासकों द्वारा किए गए रक्तपात और सामाजिक हिंसा का है। इसलिए पद मनुष्यों के जीवन की बात करता है, न कि शरीर से पृथक आत्मा के विषय में कोई विशिष्ट सैद्धांतिक दावा करता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘हाकिम’ सत्ताधारी वर्ग का भाव देता है, और भेड़ियों द्वारा शिकार फाड़ने का मूल तीखा बिंब सुरक्षित है। उद्देश्यसूचक इब्रानी रचनाओं को ‘के लिए’ और ‘ताकि’ से व्यक्त किया गया है।
