base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/022/022.yaml
  text: As silver is melted in the midst of a furnace[a], so you will be melted in the midst of it; and you will know that I, Yahweh, have poured out my wrath on you.
translation:
  language: hi
  text: जैसे भट्ठी के भीतर चाँदी पिघलाई जाती है, वैसे ही तुम उसके भीतर[क] पिघलाए जाओगे; और तुम जानोगे कि मैं, याहवे, अपना कोप तुम पर उँडेल चुका हूँ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: क
    text: या, “उसके अंदर।” सर्वनाम तत्काल संदर्भ में नगर, अर्थात् यरूशलेम, की ओर संकेत करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּהִתּוּךְ
  choice: जैसे ... पिघलाई जाती है
  rationale: तुलनासूचक כְּ और गलाने के भाव को स्वाभाविक हिन्दी उपवाक्य में व्यक्त करता है तथा कर्मवाच्य बनाए रखता है।
- source_word: כֶּסֶף
  choice: चाँदी
  rationale: धातु का सामान्य और सटीक हिन्दी नाम; गलाने की उपमा को अक्षुण्ण रखता है।
- source_word: בְּתוֹךְ כּוּר
  choice: भट्ठी के बीच
  rationale: כּוּר के धातु गलाने वाले भट्ठे के अर्थ और בְּתוֹךְ की भीतर/बीच की छवि को संक्षेप में सुरक्षित रखता है।
- source_word: תֻּתְּכוּ
  choice: तुम ... पिघलाए जाओगे
  rationale: बहुवचन कर्मवाच्य रूप और न्याय की गलाने वाली उपमा, दोनों को स्पष्ट रूप से व्यक्त करता है।
- source_word: בְתוֹכָהּ
  choice: उसके भीतर
  rationale: स्त्रीलिंग एकवचन सर्वनाम के निहित पूर्वपद—निकटवर्ती संदर्भ में यरूशलेम नगरी—को स्रोत की तरह अप्रकट रहने देता है।
- source_word: וִידַעְתֶּם
  choice: और तुम जानोगे
  rationale: यहेजकेल में बार-बार आने वाले पहचान-सूत्र का सीधा भविष्यकालीन अनुवाद है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिन्दी बाइबलीय प्रयोग में प्रचलित रूप से परमेश्वर के व्यक्तिगत नाम को शीर्षक से प्रतिस्थापित किए बिना व्यक्त करता है।
- source_word: שָׁפַכְתִּי
  choice: उँडेल दिया है
  rationale: पूर्ण क्रिया और उसके वर्तमान परिणाम को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: חֲמָתִי
  choice: अपना कोप
  rationale: दहकते दैवी क्रोध के अर्थ के लिए गरिमापूर्ण और सहज भविष्यवाणी-संबंधी शब्द है।
- source_word: עֲלֵיכֶם
  choice: तुम पर
  rationale: न्याय के संदर्भ में עַל का सीधा और स्वाभाविक हिन्दी रूप है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल में व्यक्तिगत ईश्वरीय नाम है। हिन्दी पाठकों के लिए स्थापित और पहचानने योग्य लिप्यंतरण ‘यहोवा’ नाम को किसी उपाधि से बदले बिना सुरक्षित रखता है।
- issue: בְתוֹכָהּ के स्त्रीलिंग सर्वनाम का संदर्भ
  choice: उसके भीतर
  alternative: यरूशलेम के भीतर
  rationale: निकटवर्ती संदर्भ में संकेत नगरी यरूशलेम की ओर है, पर मूल पद उसे स्पष्ट नाम से दोहराता नहीं; इसलिए अनुवाद उसी अंतर्निहित संदर्भ और हल्की अस्पष्टता को बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सामान्य पाठकों के लिए सुबोध भविष्यवाणी-शैली। ‘भट्ठी’, ‘पिघलाए जाओगे’ और ‘कोप’ धातु-गलाने तथा न्याय की मूल छवि को बनाए रखते हैं।
