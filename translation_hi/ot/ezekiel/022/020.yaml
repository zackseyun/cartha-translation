source:
  edition: WLC
  text: קְבֻ֣צַת כֶּ֡סֶף וּ֠/נְחֹשֶׁת וּ/בַרְזֶ֨ל וְ/עוֹפֶ֤רֶת וּ/בְדִיל֙ אֶל תּ֣וֹךְ כּ֔וּר לָ/פַֽחַת עָלָ֥י/ו אֵ֖שׁ לְ/הַנְתִּ֑יךְ כֵּ֤ן אֶקְבֹּץ֙ בְּ/אַפִּ֣/י וּ/בַ/חֲמָתִ֔/י וְ/הִנַּחְתִּ֥י וְ/הִתַּכְתִּ֖י אֶתְ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/022/020.yaml
  text: As silver and bronze and iron and lead and tin are gathered into the midst of a furnace[a], to blow fire on it in order to melt it, so I will gather you in my anger and in my wrath[b], and I will place you there and melt you.
translation:
  language: hi
  text: जैसे चाँदी, काँसा, लोहा, सीसा और राँगा भट्ठी के भीतर इकट्ठे किए जाते हैं[a], ताकि आग फूँकी जाए और उन्हें गलाया जाए, वैसे ही मैं अपने क्रोध और प्रकोप में तुम्हें इकट्ठा करूँगा; मैं तुम्हें वहाँ रखूँगा और पिघला दूँगा[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘काँसा’ के स्थान पर ‘ताँबा’ भी अनुवाद किया जा सकता है।
    reason: lexical_alternative
  - marker: b
    text: ‘पिघला दूँगा’ का अनुवाद ‘तुम्हें गला दूँगा’ या ‘तुम्हें भट्ठी में गलाऊँगा’ भी किया जा सकता है; यह भट्ठी में धातु गलाने के रूपक को जारी रखता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: קְבֻצַת ... כֵּן אֶקְבֹּץ
  choice: जैसे ... इकट्ठे किए जाते हैं ... वैसे ही मैं ... इकट्ठा करूँगा
  rationale: आरंभिक संज्ञात्मक रूप और बाद के כֵּן के तुलनात्मक संबंध को स्वाभाविक हिन्दी में व्यक्त करता है तथा קבץ धातु की पुनरावृत्ति बनाए रखता है।
- source_word: נְחֹשֶׁת
  choice: काँसा
  rationale: धातुओं की इस सूची में यह प्रायः कांस्य-मिश्रधातु को सूचित करता है; ‘ताँबा’ भी संभव है, इसलिए विकल्प को पादटिप्पणी में रखा गया है।
- source_word: בְדִיל
  choice: राँगा
  rationale: आधुनिक हिन्दी में टिन धातु का पारंपरिक और सुबोध नाम; धातुओं की सूची में यही सर्वाधिक संभावित अर्थ है।
- source_word: אֶל תּוֹךְ כּוּר
  choice: भट्ठी के भीतर
  rationale: תּוֹךְ के आंतरिक स्थान और כּוּר की धातु गलाने वाली भट्ठी—दोनों को संक्षिप्त, स्वाभाविक हिन्दी में रखता है।
- source_word: לָפַחַת עָלָיו אֵשׁ
  choice: उन पर आग फूँककर
  rationale: भट्ठी में धातुओं पर आग की तेज़ धौंकनी देने की क्रिया को चित्रात्मक रूप से बनाए रखता है।
- source_word: לְהַנְתִּיךְ / וְהִתַּכְתִּי
  choice: गलाया जाए / गला दूँगा
  rationale: נתך के गलाने या धातु पिघलाने के अर्थ को बनाए रखते हुए दोनों स्थानों की शब्दगत संगति सुरक्षित रखता है।
- source_word: בְּאַפִּי וּבַחֲמָתִי
  choice: अपने क्रोध और प्रकोप में
  rationale: दो निकटार्थी शब्दों की तीव्रता और संचय को अलग-अलग हिन्दी शब्दों से बनाए रखता है।
- source_word: וְהִנַּחְתִּי
  choice: मैं तुम्हें वहीं रखूँगा
  rationale: संदर्भ में भट्ठी-सदृश स्थान में रख देने का अर्थ उपयुक्त है; ‘छोड़ दूँगा’ संभव होने पर भी क्रम में कम स्पष्ट है।
theological_decisions:
- issue: न्याय के भट्ठी-रूपक की तीव्रता
  choice: ‘तुम्हें गला दूँगा’ के रूप में दंडात्मक रूपक को अक्षुण्ण रखा गया है।
  alternative: ‘तुम्हें शुद्ध करूँगा’ या ‘तुम्हारी परीक्षा लूँगा’
  rationale: निकटवर्ती संदर्भ यरूशलेम पर कठोर दैवी न्याय का है; ‘शुद्ध करना’ कहने से मूल पाठ में स्पष्ट न किया गया सकारात्मक परिणाम आरोपित हो जाएगा।
translation_notes:
  register: आधुनिक मानक हिन्दी का गंभीर, स्पष्ट और चित्रात्मक स्तर अपनाया गया है। ‘काँसा’, ‘राँगा’, ‘भट्ठी’ और ‘गलाना’ धातुकर्म के रूपक को साधारण पाठक के लिए समझने योग्य रखते हैं; वाक्य में दैवी न्याय की कठोरता को नरम नहीं किया गया।
