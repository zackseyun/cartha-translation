lexical_decisions:
- source_word: וַיְהִי
  choice: फिर ... पहुँचा
  rationale: वाव-क्रमिक रूप यहाँ भविष्यद्वाणी के अगले कथन का सामान्य आख्यानात्मक परिचय देता है। हिन्दी में ‘फिर ... पहुँचा’ इस सूत्र को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: דְבַר
  choice: वचन
  rationale: संयुक्त पद דְבַר יְהוָה में ‘वचन’ भविष्यद्वाणी द्वारा मिले प्रकाशन के लिए प्रचलित, सटीक और गरिमापूर्ण हिन्दी शब्द है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: मूल पाठ में परमेश्वर का व्यक्तिगत नाम YHWH है। आधुनिक हिन्दी बाइबल-पाठकों में पहचाने जाने वाले रूप ‘यहोवा’ द्वारा इसे किसी उपाधि से बदलने के बजाय नाम के रूप में रखा गया है।
- source_word: אֵלַי
  choice: मेरे पास
  rationale: इस भविष्यद्वाणी-सूत्र में दिशा सूचित करने वाले पूर्वसर्ग और प्रथम पुरुष प्रत्यय का स्वाभाविक हिन्दी रूप ‘मेरे पास’ है।
- source_word: לֵאמֹר
  choice: ':'
  rationale: यह क्रियारूप आगे आने वाले प्रत्यक्ष कथन का परिचय देता है। हिन्दी में पद के अंत का द्विबिंदु वही कार्य स्वाभाविक रूप से करता है और अनावश्यक ‘कहते हुए’ से बचाता है।
theological_decisions:
- issue: परमेश्वर के नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: मूल में चार अक्षरों वाला व्यक्तिगत नाम है। ‘यहोवा’ हिन्दी में स्थापित नामरूप है; ‘प्रभु’ नाम को उपाधि में बदल देता, जबकि ‘याहवे’ संभावित वैकल्पिक लिप्यंतरण है। पाठकीय पारदर्शिता के लिए टिप्पणी दी गई है।
translation_notes:
