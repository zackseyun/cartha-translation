source:
  edition: WLC
  text: וְ/כִנַּסְתִּ֣י אֶתְ/כֶ֔ם וְ/נָפַחְתִּ֥י עֲלֵי/כֶ֖ם בְּ/אֵ֣שׁ עֶבְרָתִ֑/י וְ/נִתַּכְתֶּ֖ם בְּ/תוֹכָֽ/הּ׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/022/021.yaml
  text: I will gather you[a], and I will blow on you with the fire of my wrath, and you will be melted within it.
translation:
  language: hi
  text: मैं तुम्हें इकट्ठा करूँगा और अपने प्रकोप की आग से तुम पर फूँक मारूँगा; और तुम उसी में[a] पिघल जाओगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘उसी में’ का संकेत व्यापक प्रसंग में नगर की ओर, या धातु गलाने के रूपक में भट्ठी/गलाने के स्थान की ओर हो सकता है।
    reason: सर्वनाम के संभावित पूर्वपद की वास्तविक अस्पष्टता को बनाए रखना।
lexical_decisions:
- source_word: כִנַּסְתִּי
  choice: इकट्ठा करूँगा
  rationale: यह क्रिया न्याय के लिए लोगों को एक स्थान पर जमा करने को दर्शाती है और आसपास के धातु गलाने के रूपक के अनुकूल है। ‘इकट्ठा करना’ आधुनिक हिन्दी में स्वाभाविक और ठोस है।
- source_word: נָפַחְתִּי עֲלֵיכֶם
  choice: तुम पर फूँक मारूँगा
  rationale: נפח का मूल अर्थ फूँकना है। यहाँ धौंकनी से आग भड़काने का बिंब है; ‘तुम पर’ עַל को स्पष्ट रूप से बनाए रखता है।
- source_word: בְּאֵשׁ עֶבְרָתִי
  choice: अपने प्रकोप की आग से
  rationale: בְּ को यहाँ साधनसूचक ‘से’ माना गया है। עֶבְרָה तीव्र, उमड़ते क्रोध को व्यक्त करता है; ‘प्रकोप’ गरिमापूर्ण और सामान्य आधुनिक हिन्दी में उपयुक्त है।
- source_word: נִתַּכְתֶּם
  choice: पिघल जाओगे
  rationale: धातु गलाने के प्रसंग में נתך का अर्थ पिघलना या गलना है। ‘पिघल जाओगे’ परिणाम और कर्मवाच्य भाव को स्वाभाविक हिन्दी में व्यक्त करता है, बिना अनावश्यक तकनीकी शब्दावली के।
- source_word: בְּתוֹכָהּ
  choice: उसी में
  rationale: स्त्रीलिंग एकवचन प्रत्यय का संकेत स्पष्ट करके किसी एक संज्ञा तक सीमित नहीं किया गया। ‘उसी में’ निकटवर्ती आग और व्यापक नगर/गलाने के स्थल—दोनों से जुड़ी रूपकात्मक अस्पष्टता बनाए रखता है।
theological_decisions:
- issue: בְּתוֹכָהּ के स्त्रीलिंग सर्वनाम का पूर्वपद
  choice: मुख्य पाठ में ‘उसी में’ रखकर पूर्वपद अनिर्दिष्ट रखा गया।
  alternative: ‘उस आग में’ या ‘नगर के भीतर’
  rationale: सबसे निकट स्त्रीलिंग संज्ञा ‘आग’ है, जबकि व्यापक प्रसंग में यरूशलेम वह स्थान है जहाँ लोगों को गलाने के लिए इकट्ठा किया जाता है। किसी एक अर्थ को अनिवार्य करने के बजाय भविष्यवाणी के मिश्रित रूपक और उसके तनाव को सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘फूँक मारूँगा’ जानबूझकर ठोस रखा गया है ताकि धौंकनी और धातु गलाने का बिंब बना रहे। अर्धविराम कारणात्मक क्रम—आग भड़काना और उसके फलस्वरूप पिघलना—को स्पष्ट करता है।
