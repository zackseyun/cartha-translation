reference: Ezekiel 22:14
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: הֲ/יַעֲמֹ֤ד לִבֵּ/ךְ֙ אִם תֶּחֱזַ֣קְנָה יָדַ֔יִ/ךְ לַ/יָּמִ֕ים אֲשֶׁ֥ר אֲנִ֖י עֹשֶׂ֣ה אוֹתָ֑/ךְ אֲנִ֥י יְהוָ֖ה דִּבַּ֥רְתִּי וְ/עָשִֽׂיתִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/022/014.yaml
  text: Will your heart endure[a], or will your hands remain strong, in the days when I deal with you? I, Yahweh, have spoken, and I will do it.
translation:
  language: hi
  text: क्या तेरा हृदय टिका रह सकेगा[a], या तेरे हाथ उन दिनों बलवान बने रहेंगे, जब मैं तुझसे निपटूँगा? मैं, याहवे, यह कह चुका हूँ और ऐसा करूँगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “क्या तेरा हृदय स्थिर रह पाएगा, या तेरे हाथ उन दिनों बलवान रहेंगे, जब मैं तेरे विरुद्ध कार्य करूँगा?”
    reason: עמד के ‘स्थिर खड़े रहने’ और עשה ... את के प्रसंगगत ‘विरुद्ध कार्य करने’ वाले अधिक शाब्दिक विकल्पों को सुरक्षित रखने के लिए।
lexical_decisions:
- source_word: הֲיַעֲמֹד
  choice: टिका रह सकेगा
  rationale: עמד का मूल अर्थ ‘खड़ा रहना’ है; न्याय के संदर्भ में यह दबाव के सामने टिके रहने का भाव देता है। यह चयन मूल बिंब और प्रसंगगत अर्थ दोनों को बनाए रखता है।
- source_word: לִבֵּךְ
  choice: तेरा हृदय
  rationale: לֵב भीतरी मनुष्य, साहस या संकल्प का सूचक हो सकता है। ‘हृदय’ इब्रानी मानवीय बिंब को और ‘हाथों’ के साथ समानांतरता को सुरक्षित रखता है।
- source_word: תֶּחֱזַקְנָה יָדַיִךְ
  choice: तेरे हाथ बलवान बने रहेंगे
  rationale: यह अभिव्यक्ति कार्य करने की शक्ति या सामर्थ्य को दर्शाती है। ‘बलवान बने रहेंगे’ शारीरिक बिंब को बनाए रखते हुए आने वाले न्याय में निरंतर सामर्थ्य का प्रश्न व्यक्त करता है।
- source_word: לַיָּמִים
  choice: उन दिनों
  rationale: पूर्वसर्ग सहित ‘दिन’ यहाँ समय-सूचक है; ‘उन दिनों’ स्वाभाविक आधुनिक हिन्दी है और आने वाले न्याय के काल की ओर संकेत करता है।
- source_word: אֲשֶׁר אֲנִי עֹשֶׂה אוֹתָךְ
  choice: जब मैं तुझसे निपटूँगा
  rationale: शाब्दिक रचना हिन्दी में अस्वाभाविक होगी। न्याय के प्रसंग में परमेश्वर संबोधित नगर के साथ दंडात्मक व्यवहार करता है; ‘निपटूँगा’ इस गंभीरता को व्यक्त करता है, पर क्रिया को केवल न्यायिक निर्णय तक सीमित नहीं करता।
- source_word: יְהוָה
  choice: यहोवा
  rationale: परमेश्वर के व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय हिन्दी में प्रचलित लिप्यंतरण ‘यहोवा’ द्वारा प्रस्तुत किया गया है।
- source_word: דִּבַּרְתִּי
  choice: कह चुका हूँ
  rationale: पूर्ण क्रिया पहले से दी गई और निश्चित ईश्वरीय घोषणा पर बल देती है; ‘कह चुका हूँ’ आधुनिक हिन्दी में इस पूर्णता को स्पष्ट करता है।
- source_word: וְעָשִׂיתִי
  choice: इसे करूँगा
  rationale: रूपतः पूर्ण क्रिया होने पर भी भविष्यसूचक घोषणा में यह कथन के निश्चित क्रियान्वयन को व्यक्त करती है। भविष्यकाल हिन्दी में प्रसंगगत अर्थ को स्पष्ट रखता है।
theological_decisions:
- issue: אֲנִי עֹשֶׂה אוֹתָךְ में ईश्वरीय कार्रवाई का स्वरूप
  choice: जब मैं तुझसे निपटूँगा
  alternative: जब मैं तेरे विरुद्ध कार्य करूँगा
  rationale: संदर्भ दंडात्मक कार्रवाई का है, लेकिन अकेली क्रिया किसी विशेष न्यायिक शब्दावली को अनिवार्य नहीं करती। मुख्य पाठ व्यापक अभिव्यक्ति रखता है और अधिक स्पष्ट दंडात्मक विकल्प पादटिप्पणी में देता है।
- issue: וְעָשִׂיתִי का काल और भविष्यसूचक बल
  choice: इसे करूँगा
  alternative: मैंने इसे कर दिया है
  rationale: प्रसंग में यह यहोवा की गंभीर प्रतिज्ञा है कि उसकी कही हुई बात अवश्य पूरी होगी। हिन्दी भविष्यकाल इस भाव को स्वाभाविक ढंग से संप्रेषित करता है, जबकि पूर्ण रूप की निश्चितता कथन की दृढ़ता में बनी रहती है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध हिन्दी। एकवचन अनौपचारिक ‘तेरा/तुझसे’ मूल के स्त्रीलिंग एकवचन संबोधन—यरूशलेम—को दर्शाता है। ‘हृदय’ और ‘हाथ’ के मूल शारीरिक बिंब सुरक्षित रखे गए हैं।
