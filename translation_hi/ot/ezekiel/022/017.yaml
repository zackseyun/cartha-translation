lexical_decisions:
- source_word: וַיְהִי
  choice: तब ... आया
  rationale: यहाँ कथात्मक क्रम को आगे बढ़ाने वाला रूप है। भविष्यद्वाणी के प्रचलित सूत्र में हिन्दी का स्वाभाविक प्रयोग ‘वचन ... आया’ है; ‘और ऐसा हुआ’ अनावश्यक रूप से शब्दशः होगा।
- source_word: דְבַר
  choice: वचन
  rationale: दिव्य प्रकाशन के इस स्थिर भविष्यद्वाणी-सूत्र में ‘वचन’ अर्थ और पारंपरिक सूत्रात्मक गरिमा दोनों को सुरक्षित रखता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: इब्रानी चतुरक्षरीय दिव्य नाम YHWH को हिन्दी में प्रचलित नामरूप ‘यहोवा’ से व्यक्त किया गया है, किसी उपाधि से नहीं।
- source_word: אֵלַי
  choice: मेरे पास
  rationale: ‘वचन किसी के पास आना’ आधुनिक हिन्दी में इस इब्रानी संरचना का सहज और स्पष्ट समतुल्य है।
- source_word: לֵאמֹר
  choice: इसके बाद आने वाले प्रत्यक्ष कथन को द्विबिंदु से प्रस्तुत किया
  rationale: यह infinitive construct आगे के प्रत्यक्ष कथन का परिचय देता है। हिन्दी में ‘यह कहते हुए’ की अपेक्षा द्विबिंदु अधिक स्वाभाविक है और उसी परिचयात्मक कार्य को निभाता है।
theological_decisions:
- issue: दिव्य नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: मूल पाठ में व्यक्तिगत दिव्य नाम है। उसे उपाधि ‘प्रभु’ से बदलने के बजाय हिन्दी में व्यापक रूप से पहचाने जाने वाले नामरूप ‘यहोवा’ से रखा गया; पादटिप्पणी मूल अक्षरों और पारंपरिक प्रतिस्थापन को स्पष्ट करती है।
translation_notes:
  register: भाषा आधुनिक, संक्षिप्त और गरिमापूर्ण रखी गई है। भविष्यद्वाणी के सूत्रात्मक स्वर को ‘यहोवा का वचन मेरे पास आया’ से सुरक्षित रखा गया है; अगली उक्ति के परिचय हेतु स्वाभाविक हिन्दी विराम-चिह्न का प्रयोग हुआ है।
