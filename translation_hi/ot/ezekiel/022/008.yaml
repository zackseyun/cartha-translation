  yaml_path: translation/ot/ezekiel/022/008.yaml
  text: You have despised my holy things[a], and you have profaned my Sabbaths.
translation:
  language: hi
  text: तुमने मेरी पवित्र वस्तुओं[a] को तुच्छ जाना है और मेरे सब्तों को अपवित्र किया है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘मेरे पवित्रस्थान’ अथवा ‘मेरे पवित्र स्थान।’ इब्रानी शब्द अधिक विशेष रूप से पवित्र स्थानों का संकेत कर सकता है, पर यहाँ उसका व्यापक अनुवाद ‘मेरी पवित्र वस्तुएँ’ किया गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: קָדָשַׁי
  choice: मेरी पवित्र वस्तुओं
  rationale: संज्ञा का बहुवचन रूप प्रथम पुरुष एकवचन प्रत्यय के साथ शाब्दिक रूप से ‘मेरी पवित्र वस्तुएँ’ है। यह अनुवाद पवित्रस्थान तक अर्थ को सीमित किए बिना परमेश्वर से संबंधित पवित्र बातों की व्यापकता बनाए रखता है।
- source_word: בָּזִית
  choice: तुमने ... तुच्छ जाना
  rationale: क्रिया בזה किसी को या किसी वस्तु को हेय समझने अथवा उसका तिरस्कार करने का भाव देती है। ‘तुच्छ जाना’ वर्तमान मानक हिन्दी में स्वाभाविक और आरोप की नैतिक गंभीरता के अनुरूप है।
- source_word: שַׁבְּתֹתַי
  choice: मेरे विश्राम-दिनों
  rationale: यह बहुवचन रूप प्रथम पुरुष एकवचन प्रत्यय सहित ‘मेरे सब्तों’ को दर्शाता है। ‘विश्राम-दिन’ सामान्य हिन्दी पाठक के लिए बोधगम्य है और वाचा-संबंधी पवित्र दिनों का आशय बनाए रखता है।
- source_word: חִלָּלְתְּ
  choice: अपवित्र किया है
  rationale: पिएल रूप यहाँ पवित्र को साधारण मानने, उसकी पवित्रता भंग करने या उसे दूषित करने का अर्थ देता है। ‘अपवित्र किया’ हिन्दी में सटीक, स्वाभाविक और धार्मिक संदर्भ के अनुकूल है।
theological_decisions:
- issue: קָדָשַׁי का दायरा
  choice: परमेश्वर की पवित्र वस्तुओं के लिए व्यापक संदर्भ
  alternative: विशेष रूप से परमेश्वर के पवित्रस्थान अथवा पवित्र स्थानों का संदर्भ
  rationale: इब्रानी बहुवचन व्यापक सामूहिक अर्थ की अनुमति देता है। ‘मेरी पवित्र वस्तुओं’ से पाठ को केवल मन्दिर या पवित्रस्थान तक सीमित किए बिना मूल की वास्तविक अर्थगत व्यापकता सुरक्षित रहती है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, गरिमापूर्ण और सामान्य पाठकों के लिए सुबोध रखी गई है। ‘विश्राम-दिन’ प्रचलित ‘सब्त’ की तुलना में अर्थ को सीधे व्यक्त करता है, जबकि ‘पवित्र वस्तुओं’ के साथ पाद-टिप्पणी मूल इब्रानी की अर्थगत अस्पष्टता सुरक्षित रखती है।
