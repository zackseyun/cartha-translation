source:
  edition: WLC
  text: וְ/אָמַרְתָּ֗ כֹּ֤ה אָמַר֙ אֲדֹנָ֣/י יְהוִ֔ה עִ֣יר שֹׁפֶ֥כֶת דָּ֛ם בְּ/תוֹכָ֖/הּ לָ/ב֣וֹא עִתָּ֑/הּ וְ/עָשְׂתָ֧ה גִלּוּלִ֛ים עָלֶ֖י/הָ לְ/טָמְאָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/022/003.yaml
  text: 'And say, ‘Thus says the Lord GOD: O city that sheds blood in her midst, so that her time may come, and that makes idols against herself to defile herself!’'
translation:
  language: hi
  text: 'और कहना, ‘प्रभु यहोवा इस प्रकार कहता है: हे नगर, जो अपने भीतर खून बहाता है, ताकि उसका समय आ जाए, और जो अपने ही विरुद्ध घिनौनी मूर्तियाँ बनाता है, अपने आप को अशुद्ध करने के लिए!’'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שֹׁפֶכֶת דָּם
  choice: खून बहाता है
  rationale: इब्रानी अभिव्यक्ति का स्वाभाविक और प्रत्यक्ष हिन्दी रूप; नगर को स्त्रीलिंग कृदन्त से संबोधित किया गया है, पर आधुनिक हिन्दी में ‘नगर’ के व्याकरणिक लिंग के अनुसार पुल्लिंग क्रिया रखी गई है।
- source_word: גִלּוּלִים
  choice: घिनौनी मूर्तियाँ
  rationale: यह तिरस्कारसूचक शब्द मूर्तियों की धार्मिक और नैतिक घृणितता व्यक्त करता है; केवल ‘मूर्तियाँ’ कहने से उसका अपमानसूचक बल खो जाता।
- source_word: עָלֶיהָ
  choice: अपने ही विरुद्ध
  rationale: शाब्दिक अर्थ ‘अपने ऊपर/अपने विरुद्ध’ है; प्रसंग में मूर्तियाँ नगर पर दोष और विनाश लाती हैं, इसलिए इस आत्म-विनाशकारी अर्थ को सुरक्षित रखा गया है।
- source_word: לְטָמְאָה
  choice: जिससे वह अशुद्ध हो जाए
  rationale: उद्देश्य अथवा परिणाम की अस्पष्टता को ‘जिससे’ द्वारा खुला रखा गया है; धार्मिक अशुद्धता का भाव संरक्षित है।
theological_decisions:
- issue: לָבוֹא עִתָּהּ में रक्तपात और नगर के समय के आने का संबंध
  choice: ताकि उसका समय आ जाए
  alternative: जिसके कारण उसका समय आ गया है
  rationale: לְ उपसर्ग उद्देश्य या परिणाम व्यक्त कर सकता है। स्रोत की तनावपूर्ण उद्देश्यात्मक भाषा को बनाए रखते हुए निश्चित कारणात्मक व्याख्या नहीं थोपी गई।
- issue: नगर का मानवीकरण
  choice: हे नगर … वह
  alternative: वह नगर जो …
  rationale: इब्रानी में नगर को प्रत्यक्ष संबोधन और स्त्रीरूप भाषा से मानवीकृत किया गया है। हिन्दी में संबोधन सुरक्षित है, जबकि सर्वनाम और क्रिया ‘नगर’ के व्याकरणिक लिंग के अनुरूप रखे गए हैं।
- issue: दैवी नाम אֲדֹנָי יְהוִה
  choice: प्रभु यहोवा
  alternative: परमेश्वर यहोवा / प्रभु सेनापति
  rationale: 'दोनों पदों का भेद बनाए रखा गया है: אֲדֹנָי को ‘प्रभु’ और चतुरक्षरीय नाम को ‘यहोवा’; कोई अतिरिक्त उपाधि नहीं जोड़ी गई।'
translation_notes:
  register: भाषा आधुनिक, गंभीर और भविष्यद्वाणी के न्याय-संबंधी स्वर के अनुरूप है। संबोधन की तीव्रता, रक्तपात, मूर्तिपूजा और अशुद्धता के बीच स्रोत-पाठ के संबंधों को बिना अतिरिक्त व्याख्या के रखा गया है।
