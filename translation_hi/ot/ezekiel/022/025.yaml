base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/022/025.yaml
  text: 'A conspiracy of her prophets is in her midst[a], like a roaring lion tearing prey: they have devoured lives, they take wealth and precious things, they have multiplied her widows in her midst.'
translation:
  language: hi
  text: 'उसके भीतर उसके भविष्यद्वक्ताओं का षड्यंत्र है। वे गरजते और शिकार को फाड़ते सिंह के समान हैं: उन्होंने लोगों के प्राण निगल गए हैं[a], वे धन और बहुमूल्य वस्तुएँ ले लेते हैं, और उन्होंने उसके भीतर उसकी विधवाओं की संख्या बढ़ा दी है।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “लोगों को”; अधिक शाब्दिक रूप से, “प्राण को।” इब्रानी शब्द नेफ़ेश प्रायः किसी जीवित व्यक्ति या उसके जीवन को सूचित करता है, केवल देह से पृथक आत्मा को नहीं।
    reason: lexical_alternative
