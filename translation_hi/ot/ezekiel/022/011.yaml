source:
  edition: WLC
  text: וְ/אִ֣ישׁ אֶת אֵ֣שֶׁת רֵעֵ֗/הוּ עָשָׂה֙ תּֽוֹעֵבָ֔ה וְ/אִ֥ישׁ אֶת כַּלָּת֖/וֹ טִמֵּ֣א בְ/זִמָּ֑ה וְ/אִ֛ישׁ אֶת אֲחֹת֥/וֹ בַת אָבִ֖י/ו עִנָּה בָֽ/ךְ׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/022/011.yaml
  text: One man commits an abomination with his neighbor’s wife[a], another defiles his daughter-in-law with lewdness, and another violates his sister, his father’s daughter[c][b], within you.
translation:
  language: hi
  text: तेरे भीतर कोई अपने पड़ोसी की पत्नी के साथ घृणित काम करता है[a], कोई दुराचार करके अपनी बहू को अपवित्र करता है[b], और कोई अपनी बहन—अपने पिता की बेटी—का यौन उल्लंघन करता है[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसके साथ घृणित कर्म करता है।” हिब्रानी मुहावरा शाब्दिक रूप से “घृणित काम करता है” है; प्रसंग में यह व्यभिचारी यौन कर्म को सूचित करता है।
    reason: lexical_alternative
  - marker: b
    text: या, “यौन दुष्टता से।” इस शब्द में निर्लज्ज और दूषित यौन आचरण का भाव है।
    reason: lexical_alternative
  - marker: c
    text: या, “उसका अपमान करता है।” हिब्रानी क्रिया यौन उल्लंघन के साथ अपमान या दुर्व्यवहार का भाव भी रख सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִישׁ
  choice: कोई ... कोई ... और कोई
  rationale: तीन बार आए एकवचन אִישׁ से अलग-अलग अपराधियों की सूची बनती है। यह हिन्दी संरचना उस पुनरावृत्ति को स्पष्ट और स्वाभाविक रूप में रखती है।
- source_word: אֵשֶׁת רֵעֵהוּ
  choice: अपने पड़ोसी की पत्नी
  rationale: רֵעַ पड़ोसी, साथी या सहचर को सूचित कर सकता है; इस प्रसंग में ‘पड़ोसी’ सहज है और संबंधगत अर्थ बनाए रखता है।
- source_word: עָשָׂה תּוֹעֵבָה
  choice: घृणित कर्म करता है
  rationale: यह हिब्रानी मुहावरा शाब्दिक रूप से ‘घृणित काम करता है’ है। चुना हुआ रूप उसके प्रबल नैतिक भाव को बनाए रखते हुए आधुनिक हिन्दी में स्वाभाविक है।
- source_word: כַּלָּתוֹ
  choice: अपनी बहू
  rationale: यह पुत्र की पत्नी के लिए सटीक और प्रचलित हिन्दी संबंध-सूचक शब्द है।
- source_word: טִמֵּא
  choice: अशुद्ध करता है
  rationale: यौन प्रसंग में इस क्रिया में नैतिक और धार्मिक अशुद्धि दोनों की प्रतिध्वनि है; ‘अशुद्ध करता है’ इस दायरे को बनाए रखता है।
- source_word: בְּזִמָּה
  choice: कामुक दुराचार से
  rationale: זִמָּה यहाँ निर्लज्ज और दुष्ट यौन आचरण को सूचित करता है। ‘कामुक दुराचार’ उसके यौन और नैतिक दोनों पक्ष स्पष्ट करता है।
- source_word: אֲחֹתוֹ בַת־אָבִיו
  choice: अपनी बहन—अपने पिता की बेटी—
  rationale: हिब्रानी का संबंध-सूचक समानाधिकरण ज्यों का त्यों रखा गया है; इसे सीधे ‘सौतेली बहन’ कहना पारिवारिक स्थिति को आवश्यकता से अधिक निश्चित कर देता।
- source_word: עִנָּה
  choice: यौन शोषण करता है
  rationale: यौन प्रसंग में ענה केवल संबंध बनाने के बजाय अपमान, दबाव या दुर्व्यवहार का भाव रख सकता है। ‘यौन शोषण’ उस गंभीरता को व्यक्त करता है, पर बलात्कार की विशिष्ट परिस्थिति को अनिवार्य नहीं ठहराता।
- source_word: בָּךְ
  choice: तेरे भीतर
  rationale: स्त्रीलिंग एकवचन सर्वनाम मानवीकृत यरूशलेम को संबोधित करता है। ‘तेरे भीतर’ नगर के बीच घटते अपराधों और सीधे संबोधन दोनों को बनाए रखता है।
theological_decisions:
- issue: यौन अपराधों की नैतिक गंभीरता
  choice: ‘घृणित कर्म’, ‘अशुद्ध’ और ‘यौन शोषण’ जैसे प्रबल शब्द बनाए रखे गए हैं।
  alternative: अधिक नरम या तटस्थ भाषा, जैसे ‘अनुचित संबंध रखता है’ या ‘अनैतिक व्यवहार करता है’।
  rationale: पद वाचा, परिवार और समाज के गंभीर भ्रष्टाचार का अभियोग है। मूल शब्दों की नैतिक तीव्रता को नरम करना पाठ के निंदा-भाव को घटा देता।
- issue: עִנָּה में निहित बल या अपमान
  choice: ‘यौन शोषण करता है’
  alternative: ‘अपमानित करता है’, ‘बलात्कार करता है’, या तटस्थ ‘यौन संबंध रखता है’।
  rationale: मूल क्रिया यौन उल्लंघन के साथ अपमान या दुर्व्यवहार का भाव दे सकती है, पर अकेले इस रूप से हर प्रसंग में बलात्कार की विशिष्टता निश्चित नहीं होती। चुना हुआ रूप इस अर्थगत तनाव को यथासंभव बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सीधे अभियोग की शैली में है। ‘तेरे’ का प्रयोग मानवीकृत यरूशलेम के प्रति मूल एकवचन संबोधन को सुरक्षित रखता है। डैश संबंध-सूचक स्पष्टीकरण ‘अपने पिता की बेटी’ को स्पष्ट करता है, बिना पारिवारिक संरचना की अतिरिक्त व्याख्या किए।
