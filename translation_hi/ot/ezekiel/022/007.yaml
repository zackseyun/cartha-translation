source:
  edition: WLC
  text: אָ֤ב וָ/אֵם֙ הֵקַ֣לּוּ בָ֔/ךְ לַ/גֵּ֛ר עָשׂ֥וּ בַ/עֹ֖שֶׁק בְּ/תוֹכֵ֑/ךְ יָת֥וֹם וְ/אַלְמָנָ֖ה ה֥וֹנוּ בָֽ/ךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/022/007.yaml
  text: In you they have treated father and mother with contempt[a]; in your midst they have oppressed the sojourner[c][b]; in you they have defrauded the fatherless and the widow.
translation:
  language: hi
  text: तेरे भीतर उन्होंने पिता और माता का अपमान किया है; तेरे बीच उन्होंने परदेशी[a][c] पर अत्याचार किया है; और तेरे भीतर उन्होंने अनाथ[b] और विधवा का शोषण किया है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘परदेशी’ से आशय ऐसे गैर-स्थानीय व्यक्ति से है जो समुदाय के बीच रह रहा हो; अनुवाद ‘प्रवासी निवासी’ भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: ‘अनाथ’ के लिए प्रयुक्त इब्रानी शब्द विशेष रूप से पिता से वंचित व्यक्ति को दर्शा सकता है।
    reason: lexical_alternative
  - marker: c
    text: ‘तेरे भीतर’ और ‘तेरे बीच’ कहकर यरूशलेम नगर को एक स्त्री के रूप में सीधे संबोधित किया गया है।
    reason: cultural_note
lexical_decisions:
- source_word: הֵקַלּוּ
  choice: अपमान किया है
  rationale: हिफ़ील रूप यहाँ किसी को तुच्छ समझने, उसका अनादर करने या उसके प्रति अवमानना दिखाने का भाव देता है। ‘अपमान किया है’ आधुनिक हिन्दी में स्वाभाविक है और आरोप की नैतिक गंभीरता बनाए रखता है।
- source_word: אָב וָאֵם
  choice: पिता और माता
  rationale: इब्रानी में दोनों का अलग-अलग उल्लेख है। इसे बनाए रखने से आज्ञा-संबंधी प्रतिध्वनि बनी रहती है और अर्थ को सामान्य ‘माता-पिता’ में समेटा नहीं जाता।
- source_word: בָךְ / בְּתוֹכֵךְ
  choice: तेरे भीतर / तेरे बीच
  rationale: स्त्रीलिंग एकवचन में नगर को सीधे संबोधित किया गया है। इन अभिव्यक्तियों को दोहराने से मूल का आरोपात्मक आलंकारिक ढाँचा बना रहता है।
- source_word: לַגֵּר
  choice: परदेशी
  rationale: גֵּר उस गैर-स्थानीय व्यक्ति को दर्शाता है जो समुदाय के बीच रह रहा हो। ‘परदेशी’ सामान्य आधुनिक हिन्दी में सुबोध है; टिप्पणी में इसके निवासी-प्रवासी अर्थ को स्पष्ट किया गया है।
- source_word: עָשׂוּ בָעֹשֶׁק
  choice: अत्याचार किया है
  rationale: शाब्दिक संरचना ‘उत्पीड़न/जबरदस्ती के साथ व्यवहार किया’ है। ‘अत्याचार किया है’ शोषक और अन्यायपूर्ण व्यवहार को संक्षेप तथा स्वाभाविक ढंग से व्यक्त करता है।
- source_word: יָתוֹם וְאַלְמָנָה
  choice: अनाथ और विधवा
  rationale: ये व्यवस्था में विशेष संरक्षण पाने वाले दो स्पष्ट सामाजिक वर्ग हैं। ‘अनाथ’ आधुनिक हिन्दी में सहज है, जबकि पादटिप्पणी मूल शब्द की अधिक विशिष्ट पितृहीनता बताती है।
- source_word: הוֹנוּ
  choice: शोषण किया है
  rationale: ינה का हिफ़ील रूप अन्याय करने, दबाने या अनुचित लाभ उठाने का भाव रखता है। ‘शोषण’ आर्थिक और सामाजिक दुर्व्यवहार की व्यापकता को सुरक्षित रखता है।
theological_decisions:
- issue: निर्बल लोगों के लिए वाचा-संबंधी सामाजिक शब्दावली
  choice: परदेशी, अनाथ और विधवा जैसी विशिष्ट श्रेणियाँ बनाए रखी गई हैं।
  alternative: इन सबको सामान्य रूप से ‘निर्बल लोग’ कहना।
  rationale: पद इस्राएल की व्यवस्था में संरक्षित विशेष समूहों के विरुद्ध किए गए अपराधों को नाम लेकर बताता है। विशिष्ट श्रेणियाँ रखने से अंतर्पाठीय और सामाजिक-नैतिक बल सुरक्षित रहता है।
- issue: यरूशलेम को स्त्री के रूप में प्रत्यक्ष संबोधन
  choice: स्त्रीलिंग एकवचन ‘तेरे’ के साथ नगर को सीधे संबोधित किया गया है।
  alternative: ‘यरूशलेम में’ कहकर व्यक्तिकरण और प्रत्यक्ष संबोधन हटा देना।
  rationale: בָךְ और בְּתוֹכֵךְ के स्त्रीलिंग रूप नगर के व्यक्तिकरण को प्रकट करते हैं; इसे बनाए रखना पाठ की काव्यात्मक और आरोपात्मक तीव्रता के लिए आवश्यक है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘तेरे’ का प्रयोग अनादर के लिए नहीं, बल्कि इब्रानी के प्रत्यक्ष एकवचन संबोधन और यरूशलेम के व्यक्तिकरण को बनाए रखने के लिए है। समानांतर वाक्यखंडों और ‘तेरे भीतर/बीच’ की पुनरावृत्ति से मूल की न्यायिक-अभियोगात्मक लय सुरक्षित रखी गई है।
