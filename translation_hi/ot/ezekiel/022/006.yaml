lexical_decisions:
- source_word: הִנֵּה
  choice: देखो
  rationale: यह शब्द जोर देकर ध्यान खींचता है; ‘देखो’ आधुनिक हिन्दी में उसके संकेतात्मक और विस्मयकारी बल को स्वाभाविक रूप से व्यक्त करता है।
- source_word: נְשִׂיאֵי יִשְׂרָאֵל
  choice: इस्राएल के प्रधान
  rationale: נָשִׂיא यहाँ शासकीय पद और प्रतिष्ठा रखने वाले प्रमुख व्यक्तियों को दर्शाता है; ‘प्रधान’ राजनीतिक नेतृत्व का भाव रखते हुए आधुनिक हिन्दी में सहज है।
- source_word: אִישׁ לִזְרֹעוֹ
  choice: हर एक अपने बाहुबल के अनुसार
  rationale: אִישׁ का प्रयोग वितरणार्थक है, और ‘बाँह’ सामर्थ्य या सत्ता का रूपक है। ‘बाहुबल’ मूल चित्र को बनाए रखते हुए अभिप्रेत शक्ति स्पष्ट करता है।
- source_word: הָיוּ בָךְ
  choice: तेरे भीतर हैं
  rationale: स्त्रीलिंग एकवचन संबोधन यरूशलेम से है। हिन्दी में वर्तमान ‘हैं’ आरोप को जीवंत और प्रत्यक्ष रखता है, यद्यपि हिब्रू में पूर्ण क्रिया है।
- source_word: לְמַעַן שְׁפָךְ דָּם
  choice: खून बहाने पर तुला है
  rationale: उद्देश्यसूचक पदबंध हिंसक मंशा और दोष को व्यक्त करता है। एकवचन ‘तुला है’ निकटवर्ती वितरणार्थक ‘हर एक’ से मेल खाता है।
- source_word: דָּם
  choice: खून
  rationale: ‘खून बहाना’ साधारण आधुनिक हिन्दी में हत्या और हिंसक रक्तपात का स्वाभाविक मुहावरा है तथा मूल की ठोस छवि बनाए रखता है।
