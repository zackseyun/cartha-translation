source:
  edition: WLC
  text: כֹּהֲנֶ֜י/הָ חָמְס֣וּ תוֹרָתִ/י֮ וַ/יְחַלְּל֣וּ קָדָשַׁ/י֒ בֵּֽין קֹ֤דֶשׁ לְ/חֹל֙ לֹ֣א הִבְדִּ֔ילוּ וּ/בֵין הַ/טָּמֵ֥א לְ/טָה֖וֹר לֹ֣א הוֹדִ֑יעוּ וּ/מִ/שַׁבְּתוֹתַ/י֙ הֶעְלִ֣ימוּ עֵֽינֵי/הֶ֔ם וָ/אֵחַ֖ל בְּ/תוֹכָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/022/026.yaml
  text: Her priests have done violence to my law and have profaned my holy things[a]. They have not distinguished between the holy and the common, and they have not made known the difference between the unclean and the clean. They have hidden their eyes from my Sabbaths[b], and I have been profaned among them.
translation:
  language: hi
  text: उसके याजकों ने मेरी व्यवस्था के साथ हिंसा की है और मेरी पवित्र वस्तुओं को अपवित्र किया है। उन्होंने पवित्र और साधारण के बीच भेद नहीं किया, और अशुद्ध और शुद्ध के बीच का अंतर नहीं बताया। उन्होंने मेरे विश्राम-दिनों से अपनी आँखें फेर ली हैं, और उनके बीच मुझे अपवित्र किया गया है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חָמְסוּ
  choice: के साथ हिंसा की है
  rationale: यह क्रिया केवल व्यवस्था तोड़ने से अधिक प्रबल, हिंसक अन्याय और उल्लंघन का भाव रखती है; हिंदी में मूल रूपक को बनाए रखा गया है।
- source_word: תוֹרָתִי
  choice: मेरी व्यवस्था
  rationale: याजकीय और वाचागत संदर्भ में 'व्यवस्था' स्वाभाविक बाइबलीय हिंदी है और विधि तथा शिक्षा दोनों की पृष्ठभूमि को वहन करती है।
- source_word: וַיְחַלְּלוּ
  choice: अपवित्र किया है
  rationale: पवित्र ठहराई गई वस्तु को सामान्य अथवा अपमानित मानने का अर्थ स्पष्ट करता है और पद के अंतिम खंड की समान शब्दावली से मेल रखता है।
- source_word: קָדָשַׁי
  choice: मेरी पवित्र वस्तुओं
  rationale: बहुवचन को बनाए रखते हुए चढ़ावे, स्थान या अन्य पवित्र विषयों में से किसी एक तक अर्थ को अनावश्यक रूप से सीमित नहीं करता।
- source_word: בֵּין קֹדֶשׁ לְחֹל
  choice: पवित्र और साधारण के बीच
  rationale: חֹל यहाँ अनिवार्यतः नैतिक बुराई नहीं, बल्कि पवित्र क्षेत्र से बाहर की सामान्य अवस्था है; 'साधारण' इस याजकीय भेद को स्पष्ट रखता है।
- source_word: וּבֵין הַטָּמֵא לְטָהוֹר
  choice: अशुद्ध और शुद्ध के बीच
  rationale: ये याजकीय शुद्धता की मानक श्रेणियाँ हैं; हिंदी में परिचित और सटीक जोड़ी है।
- source_word: לֹא הוֹדִיעוּ
  choice: अंतर नहीं बताया
  rationale: हिफ़ील का मूल भाव 'ज्ञात कराना' है; 'बताया' स्वाभाविक हिंदी में उसे सुरक्षित रखता है, बिना स्पष्ट रूप से 'सिखाया' जोड़ने के।
- source_word: הֶעְלִימוּ עֵינֵיהֶם
  choice: अपनी आँखें फेर ली हैं
  rationale: जानबूझकर अनदेखा करने के हिब्रू मुहावरे को हिंदी के सहज दृश्यात्मक मुहावरे से व्यक्त करता है।
- source_word: וָאֵחַל
  choice: मुझे अपवित्र किया गया है
  rationale: 'मासोरेटिक स्वरांकन के अनुसार रूप को निष्क्रिय अर्थ में लिया गया है: याजकों के आचरण से समुदाय में परमेश्वर की पवित्रता का अनादर हुआ।'
theological_decisions:
- issue: חֹל का पवित्रता-संबंधी अर्थ
  choice: साधारण
  alternative: अपवित्र
  rationale: यह विरोध पवित्र और गैर-पवित्र/सामान्य श्रेणियों का है; 'अपवित्र' नैतिक दूषण या सक्रिय अनादर का अतिरिक्त अर्थ ला सकता है।
- issue: וָאֵחַל का वाच्य
  choice: निष्क्रिय—'मुझे अपवित्र किया गया है'
  alternative: प्रतिबिंबात्मक भाव—'मैं उनके बीच अपवित्र हुआ'
  rationale: प्रसंग और मासोरेटिक पाठ निष्क्रिय अर्थ का समर्थन करते हैं; हिंदी वाक्य यह स्पष्ट करता है कि याजकीय विफलता के कारण परमेश्वर का अनादर हुआ, न कि वह स्वभावतः अशुद्ध हुआ।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमामय, स्पष्ट और सामान्य पाठक के लिए सुबोध शैली। 'याजक', 'व्यवस्था', 'विश्राम-दिन', 'शुद्ध/अशुद्ध' जैसे स्थापित बाइबलीय पद रखे गए हैं। हिब्रू की समानांतर वाक्यरचना और आरोपात्मक तीव्रता को यथासंभव सुरक्षित रखा गया है।
