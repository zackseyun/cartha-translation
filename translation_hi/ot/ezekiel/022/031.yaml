language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וָ/אֶשְׁפֹּ֤ךְ עֲלֵי/הֶם֙ זַעְמִ֔/י בְּ/אֵ֥שׁ עֶבְרָתִ֖/י כִּלִּיתִ֑י/ם דַּרְכָּ/ם֙ בְּ/רֹאשָׁ֣/ם נָתַ֔תִּי נְאֻ֖ם אֲדֹנָ֥/י יְהֹוִֽה׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/022/031.yaml
  text: So I poured out my indignation on them[a]; with the fire of my wrath I consumed them. I have put their way on their own heads[c][b], declares the Lord GOD.
translation:
  language: hi
  text: इसलिए मैंने उन पर अपना रोष उँडेल दिया; अपने प्रकोप की आग से मैंने उन्हें भस्म कर दिया। उनके चालचलन का फल मैंने उन्हीं के सिर पर डाल दिया[a]—प्रभु यहोवा की यह घोषणा है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक रूप में: “उनका मार्ग मैंने उनके सिर पर रख दिया।” यह इब्रानी मुहावरा बताता है कि उनके अपने चालचलन का परिणाम उन्हीं पर लौट आया।'
    reason: मूल इब्रानी बिंब और उसके मुहावरेदार अर्थ को दर्ज करना।
lexical_decisions:
- source_word: וָאֶשְׁפֹּךְ
  choice: मैंने ... उँडेल दिया
  rationale: שׁפך के मूल 'उँडेलना' रूपक को स्वाभाविक हिन्दी में बनाए रखता है और दैवी रोष के पूर्ण रूप से प्रकट होने का भाव देता है।
- source_word: זַעְמִי
  choice: अपना रोष
  rationale: זַעַם नैतिक आक्रोश और न्यायकारी क्रोध व्यक्त करता है; 'रोष' गरिमापूर्ण और सामान्य आधुनिक हिन्दी में सशक्त है।
- source_word: בְּאֵשׁ עֶבְרָתִי
  choice: अपने प्रकोप की आग से
  rationale: עֶבְרָה के तीव्र क्रोध को 'प्रकोप' व्यक्त करता है और בְּ को साधनवाचक 'से' अनूदित करने से आग का रूपक बना रहता है।
- source_word: כִּלִּיתִים
  choice: मैंने उन्हें भस्म कर दिया
  rationale: Piel כלה का अर्थ यहाँ समाप्त या नष्ट करना है; निकटवर्ती आग के बिंब के कारण 'भस्म कर दिया' प्रसंगानुकूल है, यद्यपि इसे केवल शाब्दिक दहन तक सीमित नहीं समझना चाहिए।
- source_word: דַּרְכָּם
  choice: उनके चालचलन
  rationale: דֶּרֶךְ यहाँ जीवन-पद्धति या आचरण का रूपक है। 'चालचलन' साधारण पाठक के लिए स्पष्ट है और सामूहिक एकवचन का भाव रखता है।
- source_word: בְּרֹאשָׁם נָתַתִּי
  choice: का फल मैंने उन्हीं के सिर पर डाल दिया
  rationale: मूल 'उनका मार्ग उनके सिर पर रखना' प्रतिफल के लौटने का भविष्यद्वाणी-संबंधी मुहावरा है। 'फल' अर्थ स्पष्ट करता है, जबकि 'सिर पर डाल दिया' मूल बिंब को बचाता है।
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: प्रभु यहोवा की यह घोषणा है
  rationale: נְאֻם को संज्ञात्मक भविष्यद्वाणी-सूत्र 'यह घोषणा है' और אֲדֹנָי יְהוִה को स्पष्ट भेद के साथ 'प्रभु यहोवा' दिया गया है।
theological_decisions:
- issue: दैवी न्याय की तीव्र भाषा
  choice: रोष, प्रकोप, भस्म करने और कर्मफल सिर पर लौटाने की सशक्त भाषा बनाए रखी गई।
  alternative: क्रोध को केवल 'अप्रसन्नता' और विनाश को सामान्य 'दंड' कहकर नरम करना।
  rationale: इब्रानी पाठ न्यायकारी दैवी क्रोध और प्रतिफल को प्रत्यक्ष रूप से व्यक्त करता है; उसे हल्का करना मूल की गंभीरता घटाता।
- issue: אֲדֹנָי יְהוִה में परमेश्वर के नाम का अनुवाद
  choice: प्रभु यहोवा
  alternative: प्रभु परमेश्वर / प्रभु याहवे
  rationale: संयुक्त पद में אֲדֹנָי की उपाधि और יהוה के व्यक्तिगत नाम, दोनों को अलग-अलग सुनाई देने देता है। 'यहोवा' हिन्दी बाइबलीय प्रयोग में पहचाना हुआ रूप है; पाठ किसी व्याख्यात्मक सिद्धान्त से नाम को प्रतिस्थापित नहीं करता।
- issue: प्रतिफल का स्वरूप
  choice: उनके चालचलन का फल उन्हीं के सिर पर डाला गया।
  alternative: उन पर ऐसा दंड आया जिसका उनके अपने आचरण से सीधा संबंध व्यक्त न हो।
  rationale: דַּרְכָּם בְּרֹאשָׁם נָתַתִּי प्रत्युत्तरात्मक न्याय का बिंब है—उनके अपने आचरण के परिणाम उन्हीं पर लौटते हैं।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, भविष्यद्वाणी-संबंधी स्वर रखा गया है। 'उँडेल दिया', 'प्रकोप की आग' और 'सिर पर डाल दिया' मूल के सजीव बिंब बचाते हैं; 'चालचलन का फल' मुहावरे का अर्थ सामान्य पाठक के लिए स्पष्ट करता है।
