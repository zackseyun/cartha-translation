  yaml_path: translation/ot/ezekiel/022/016.yaml
  text: And you will be profaned through yourself before the eyes of the nations[a], and you will know that I am Yahweh.
translation:
  language: hi
  text: और तुम स्वयं जातियों की आँखों के सामने अपवित्र ठहरोगी[a], और तुम जानोगी कि मैं याहवे हूँ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “तुम अपने में अपवित्र ठहरोगी,” अथवा “तुम अपने ही द्वारा कलंकित हो जाओगी।” इब्रानी पदबंध में अपवित्र होने, कलंकित होने या सार्वजनिक रूप से अपमानित होने के भाव संभव हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: נִחַלְתְּ
  choice: अपवित्र ठहरोगी
  rationale: חלל का निफ़अल स्त्रीलिंग एकवचन रूप यहाँ यरूशलेम के सार्वजनिक रूप से अपवित्र या बेआबरू होने का भाव देता है। ‘अपवित्र ठहरोगी’ न्याय और पवित्रता—दोनों संदर्भों को बनाए रखता है।
- source_word: בָּךְ
  choice: अपने ही कारण
  rationale: בָּךְ संक्षिप्त और कुछ अस्पष्ट है; इसका अर्थ ‘अपने में’, ‘अपने द्वारा’ या कारणसूचक रूप में ‘अपने ही कारण’ हो सकता है। संदर्भ में यरूशलेम के अपने पाप से उत्पन्न अपवित्रीकरण को सहज हिन्दी में व्यक्त करने के लिए यह चुनाव किया गया है, जबकि पादटिप्पणी अन्य संभावनाएँ सुरक्षित रखती है।
- source_word: לְעֵינֵי גוֹיִם
  choice: जातियों की आँखों के सामने
  rationale: यह इब्रानी मुहावरे की दृश्यात्मकता और सार्वजनिक अपमान के भाव को सुरक्षित रखता है। גוֹיִם के लिए ‘जातियाँ’ भविष्यद्वाणी-साहित्य में विदेशी राष्ट्रों का स्वाभाविक हिन्दी रूप है।
- source_word: וְיָדַעַתְּ
  choice: तब तुम जानोगी
  rationale: संयोजक सहित पूर्ण क्रिया भविष्यसूचक और परिणामसूचक अर्थ देती है। हिन्दी में ‘तब’ न्याय के परिणाम को स्वाभाविक रूप से व्यक्त करता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: चार-अक्षरीय दिव्य नाम को उपाधि से बदलने के बजाय उसके व्यक्तिगत नाम के लिप्यंतरण के रूप में रखा गया है।
theological_decisions:
- issue: इस पद में חלל का अर्थ
  choice: यरूशलेम का जातियों के सामने न्यायिक और पवित्रता-संबंधी अपवित्रीकरण
  alternative: विरासत या अधिकार खोना; अथवा केवल सामान्य सार्वजनिक अपमान
  rationale: निकटवर्ती प्रसंग अशुद्धता, अपराध और परमेश्वर के न्याय पर केंद्रित है; इसलिए अपवित्रीकरण का अर्थ यहेजकेल की पवित्रता-संबंधी शब्दावली से अधिक मेल खाता है। फिर भी उससे जुड़े ‘कलंकित’ और ‘अपमानित’ अर्थ पादटिप्पणी में रखे गए हैं।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सीधा भविष्यद्वाणी-संबंधी स्वर। स्त्रीलिंग क्रियाएँ संबोधित यरूशलेम के व्याकरणिक लिंग को दर्शाती हैं; ‘जातियों की आँखों के सामने’ मूल मुहावरे की सजीवता बनाए रखता है।
