review_pass:
  verdict: revise
  source_fidelity: The draft correctly preserves the two parallel dispersal actions and the removal of Jerusalem’s impurity. However, “जाति-जाति” can naturally evoke caste or ethnic group in modern Hindi rather than the foreign political nations denoted by גּוֹיִם. “इस तरह” adds an explicit inferential connection not stated by the Hebrew, though the contextual relationship remains clear without it.
  naturalness: “राष्ट्रों में” and “देशों में” are natural, clear modern standard Hindi in this exile context. Removing the reduplicated forms also avoids a somewhat literary/colloquial effect that is less precise here. “तुझमें से दूर कर दूँगा” is idiomatic while retaining the source’s removal-from-you sense.
  terminology: “अशुद्धता” appropriately retains the broad moral/cultic connotations of טֻמְאָה without narrowing them. The feminine singular address remains appropriate for personified Jerusalem. “राष्ट्रों” is preferable to “जाति-जाति” for גּוֹיִם in this context.
  issues:
  - severity: medium
    issue: “जाति-जाति में” for בַּגּוֹיִם
    rationale: In contemporary Hindi, जाति commonly suggests caste or ethnic community. The source refers to the nations among which Jerusalem will be scattered; “राष्ट्रों में” communicates this accurately and without avoidable ambiguity.
  - severity: low
    issue: Addition of “इस तरह”
    rationale: The Hebrew has a coordinate “and,” not an explicit “thus/by this means.” The added phrase mildly interprets the relation between scattering and purification; it should be omitted to preserve the source’s more direct coordination.
  revised_text: मैं तुझे राष्ट्रों में तितर-बितर कर दूँगा और देशों में बिखेर दूँगा, और तेरी अशुद्धता को तुझमें से दूर कर दूँगा।[a]
