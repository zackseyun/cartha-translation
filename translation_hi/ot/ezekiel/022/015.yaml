source:
  edition: WLC
  text: וַ/הֲפִיצוֹתִ֤י אוֹתָ/ךְ֙ בַּ/גּוֹיִ֔ם וְ/זֵרִיתִ֖י/ךְ בָּ/אֲרָצ֑וֹת וַ/הֲתִמֹּתִ֥י טֻמְאָתֵ֖/ךְ מִמֵּֽ/ךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/022/015.yaml
  text: I will scatter you among the nations and disperse you through the lands[a], and I will purge your uncleanness from you.
translation:
  language: hi
  text: मैं तुझे राष्ट्रों में तितर-बितर कर दूँगा और देशों में बिखेर दूँगा, और तेरी अशुद्धता को तुझमें से दूर कर दूँगा।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तेरी अशुद्धता को तुझमें से मिटा दूँगा” अथवा “तुझमें की अशुद्धता का अंत कर दूँगा।”
    reason: The causative verb can express removal, eradication, or bringing the impurity to an end; the note preserves these close lexical possibilities without deciding whether the impurity is moral, ritual, or metaphorical.
lexical_decisions:
- source_word: וַהֲפִיצוֹתִי
  choice: मैं तुझे ... तितर-बितर कर दूँगा
  rationale: यह क्रिया न्याय के रूप में व्यापक बिखराव को व्यक्त करती है; ‘तितर-बितर’ निर्वासन की छवि को स्वाभाविक हिन्दी में स्पष्ट रखता है।
- source_word: בַּגּוֹיִם
  choice: जाति-जाति में
  rationale: यहाँ גּוֹיִם उन विदेशी जातियों/राष्ट्रों को दर्शाता है जिनके बीच यरूशलेम के लोग निर्वासित होंगे। ‘जाति-जाति में’ बहुविध राष्ट्रों के बीच फैलाव को सहज हिन्दी में व्यक्त करता है।
- source_word: וְזֵרִיתִיךְ
  choice: और ... बिखेर दूँगा
  rationale: זרה का अर्थ बिखेरना या फटकना हो सकता है। पूर्ववर्ती समानांतर क्रिया के साथ ‘बिखेर दूँगा’ अर्थ को स्पष्ट रखता है, पर कृषि-रूपक को अनावश्यक रूप से प्रमुख नहीं बनाता।
- source_word: בָּאֲרָצוֹת
  choice: देश-देश में
  rationale: बहुवचन אֲרָצוֹת अनेक देशों/प्रदेशों को सूचित करता है। ‘देश-देश में’ व्यापक भौगोलिक बिखराव का स्वाभाविक हिन्दी रूप है।
- source_word: וַהֲתִמֹּתִי
  choice: इस तरह मैं ... मिटा दूँगा
  rationale: תמם के इस कारक रूप में समाप्त कर देने या पूरी तरह दूर करने का भाव है। ‘इस तरह’ निर्वासन-न्याय और अशुद्धता के अंत के बीच संबंध को व्यक्त करता है; ‘मिटा दूँगा’ परिणाम को स्पष्ट रखता है।
- source_word: טֻמְאָתֵךְ
  choice: तेरी अशुद्धता
  rationale: טֻמְאָה धार्मिक, नैतिक या अनुष्ठानिक अशुद्धता का व्यापक भाव रख सकता है। ‘अशुद्धता’ किसी एक श्रेणी तक अर्थ को सीमित नहीं करता।
- source_word: מִמֵּךְ
  choice: तुझमें से
  rationale: यह पूर्वसर्ग संबोधित समुदाय से अशुद्धता के हटाए जाने को दर्शाता है। ‘तुझमें से’ व्यक्तिरूप में संबोधित यरूशलेम के भीतर से निष्कासन का भाव बनाए रखता है।
theological_decisions:
- issue: न्याय में वर्णित शुद्धीकरण का स्वरूप
  choice: निर्वासन के न्याय के द्वारा यरूशलेम की अशुद्धता का अंत या निष्कासन
  alternative: ‘मैं तेरी अशुद्धता को समाप्त कर दूँगा’ अथवा ‘मैं तेरी अशुद्धता को तुझसे दूर कर दूँगा’
  rationale: इब्रानी वाक्य अशुद्धता को समाप्त करने की बात करता है, पर यह निश्चित नहीं करता कि वह मुख्यतः नैतिक, अनुष्ठानिक या रूपकात्मक है। अनुवाद इस तनाव को बनाए रखता है कि यही न्याय दंड भी है और अशुद्धता को मिटाने का साधन भी।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रूप। स्त्रीलिंग एकवचन ‘तुझे/तेरी’ व्यक्तिरूप में संबोधित यरूशलेम के कारण रखा गया है। समानांतर ‘जाति-जाति’ और ‘देश-देश’ मूल के दो बहुवचन क्षेत्रों तथा दो बिखराव-क्रियाओं को प्रवाहपूर्ण ढंग से उभारते हैं।
