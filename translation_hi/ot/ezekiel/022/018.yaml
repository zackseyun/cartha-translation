id: EZK.22.18
reference: Ezekiel 22:18
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: בֶּן אָדָ֕ם הָיוּ לִ֥/י בֵֽית יִשְׂרָאֵ֖ל ל/סוג כֻּלָּ֡/ם נְ֠חֹשֶׁת וּ/בְדִ֨יל וּ/בַרְזֶ֤ל וְ/עוֹפֶ֨רֶת֙ בְּ/ת֣וֹךְ כּ֔וּר סִגִ֥ים כֶּ֖סֶף הָיֽוּ־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/022/018.yaml
  text: Son of man[a], the house of Israel has become dross to me; all of them are bronze and tin and iron and lead in the midst of a furnace; they are the dross of silver.
translation:
  language: hi
  text: “हे मनुष्य के पुत्र, इस्राएल का घराना मेरे लिए मैल हो गया है। वे सब भट्ठी के भीतर काँसा[a], टीन, लोहा और सीसा हैं; वे चाँदी का मैल हैं।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “ताँबा।”
    reason: נְחֹשֶׁת ताँबे अथवा काँसे, दोनों को सूचित कर सकता है।
lexical_decisions:
- source_word: בֶּן אָדָם
  choice: हे मनुष्य के पुत्र
  rationale: यहेजकेल में प्रयुक्त संबोधन-सूत्र के हिब्रू मुहावरे को परिचित, गरिमापूर्ण हिन्दी में बनाए रखता है।
- source_word: הָיוּ לִי
  choice: मेरे लिए ... हो गया है
  rationale: लִי के संबंधपरक अर्थ और पूर्ण क्रिया से व्यक्त परिणामी अवस्था को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: בֵּית יִשְׂרָאֵל
  choice: इस्राएल का घराना
  rationale: वाचा-सम्बन्धी सामूहिक अभिव्यक्ति को केवल ‘इस्राएल’ कहकर सरल नहीं करता।
- source_word: לְסוּג / סִגִים
  choice: मैल
  rationale: धातु गलाने पर अलग होने वाले अनुपयोगी अशुद्ध अंश को दर्शाता है और पूरी धातुकर्म-संबंधी उपमा को बनाए रखता है।
- source_word: כֻּלָּם
  choice: वे सब
  rationale: सर्वनाम के वितरणात्मक बल को स्पष्ट और सहज हिन्दी में व्यक्त करता है।
- source_word: נְחֹשֶׁת
  choice: काँसा
  rationale: शब्द ताँबे या काँसे का बोध करा सकता है; धातुओं की इस सूची में ‘काँसा’ स्वाभाविक है, जबकि वैकल्पिक अर्थ पादटिप्पणी में दिया गया है।
- source_word: בְּדִיל
  choice: टीन
  rationale: धातु गलाने और मिश्रधातु के संदर्भ में इस धातु का मानक हिन्दी नाम।
- source_word: בַּרְזֶל
  choice: लोहा
  rationale: मूल धातु का सीधा और सामान्य हिन्दी पर्याय।
- source_word: עוֹפֶרֶת
  choice: सीसा
  rationale: मूल धातु का सीधा और सामान्य हिन्दी पर्याय।
- source_word: בְּתוֹךְ כּוּר
  choice: भट्ठी के भीतर
  rationale: כּוּר को धातु गलाने की भट्ठी और בְּתוֹךְ को ‘भीतर’ के रूप में संक्षिप्त, स्वाभाविक ढंग से प्रस्तुत करता है।
- source_word: סִגִים כֶּסֶף
  choice: चाँदी का मैल
  rationale: सम्बन्धवाचक पदबंध को निकटता से रखता है और यह भाव सुरक्षित करता है कि वे बहुमूल्य चाँदी नहीं, उससे निकाला जाने वाला मैल हैं।
theological_decisions:
- issue: लִי में प्रथम पुरुष द्वारा परमेश्वर का मूल्यांकन
  choice: ‘मेरे लिए’ को स्पष्ट विस्तार के बिना बनाए रखा गया है।
  alternative: ‘मेरी दृष्टि में’ या ‘मेरे सामने’
  rationale: हिब्रू केवल वक्ता के साथ मूल्यांकनात्मक संबंध व्यक्त करता है; अनुवाद उससे आगे जाकर ईश्वरीय अस्वीकृति की व्याख्या नहीं जोड़ता।
- issue: धातु गलाने की भविष्यसूचक उपमा
  choice: भट्ठी, धातुओं और चाँदी के मैल की छवि को शाब्दिक रूप में सुरक्षित रखा गया है।
  alternative: नैतिक भ्रष्टता या निकम्मेपन का व्याख्यात्मक भावानुवाद
  rationale: पद का धार्मिक और अलंकारिक प्रभाव इसी धातुकर्म-संबंधी चित्र से आता है; व्याख्यात्मक सरलीकरण उसके तनाव को कम कर देगा।
- issue: अंतिम הָיוּ का काल और संबंध
  choice: ‘वे चाँदी का मैल हैं’
  alternative: ‘वे चाँदी का मैल हो गए हैं’
  rationale: अंतिम उपवाक्य को पहचान या मूल्यांकन बताने वाला माना गया है, जिससे पूर्ववर्ती सूची से सहज संबंध रहता है और मूल की सम्भावित स्थितिवाचकता सुरक्षित रहती है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, भविष्यसूचक संबोधन के अनुरूप गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध रखी गई है। ‘मैल’ को पूरे पद में एकरूप रखकर धातु-शोधन की उपमा सुरक्षित की गई है।
