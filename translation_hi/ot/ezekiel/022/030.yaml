base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/022/030.yaml
  text: And I sought among them for a man who would build up a wall and stand in the breach before me on behalf of the land[a], so that I would not destroy it[b], but I found none.
translation:
  language: hi
  text: और मैंने उनमें से एक ऐसे पुरुष[a] को खोजा, जो दीवार बनाए और मेरे सामने भूमि के लिए दीवार के टूटे हुए स्थान में खड़ा हो, ताकि मैं उस भूमि को नष्ट न करूँ; पर मुझे कोई नहीं मिला।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: मूल इब्रानी में ‘एक पुरुष’ है। यह पुल्लिंग एकवचन रूप यहाँ प्रतिनिधिक अर्थ में भी प्रयुक्त हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֲבַקֵּשׁ מֵהֶם
  choice: और मैंने उनमें ... को खोजा
  rationale: בקש का अर्थ खोजने या तलाश करने से है, और מֵהֶם उस समूह के भीतर से किसी को खोजने का भाव देता है। यह रूप आधुनिक हिन्दी में स्वाभाविक है और आरम्भिक संयोजक को भी बनाए रखता है।
- source_word: אִישׁ
  choice: एक ऐसे पुरुष
  rationale: स्रोत में शब्द पुल्लिंग एकवचन है। ‘पुरुष’ उसके रूप को सुरक्षित रखता है, जबकि ‘ऐसे’ आगे आने वाले कृदन्तों के अपेक्षित कार्य को सहज हिन्दी में जोड़ता है।
- source_word: גֹּדֵר גָּדֵר
  choice: जो दीवार बनाए
  rationale: मूल में एक ही धातु से बने क्रिया और संज्ञा का संयोग है, जिसका आशय सुरक्षा देने वाली दीवार खड़ी करने या उसकी मरम्मत करने से है। ‘दीवार बनाए’ चित्र को स्पष्ट रखते हुए अस्वाभाविक पुनरुक्ति से बचता है।
- source_word: וְעֹמֵד בַּפֶּרֶץ
  choice: और ... दीवार की दरार में खड़ा हो
  rationale: פֶּרֶץ दीवार में टूटे हुए खुले स्थान को दर्शाता है। ‘दरार में खड़ा हो’ रक्षात्मक हस्तक्षेप के ठोस चित्र को बनाए रखता है; दीवार का पुनः उल्लेख हिन्दी पाठक के लिए सम्बन्ध स्पष्ट करता है।
- source_word: לְפָנַי בְּעַד הָאָרֶץ
  choice: देश की ओर से मेरे सामने
  rationale: לְפָנַי परमेश्वर के सम्मुख खड़े होने और בְּעַד प्रतिनिधि अथवा रक्षात्मक रूप से किसी के पक्ष में होने का भाव देता है। ‘देश की ओर से मेरे सामने’ दोनों आयामों को सुरक्षित रखता है।
- source_word: לְבִלְתִּי שַׁחֲתָהּ
  choice: ताकि मैं उसे नष्ट न करूँ
  rationale: यह उद्देश्य अथवा रोके जाने वाले परिणाम को व्यक्त करता है। स्त्रीलिंग प्रत्यय का पूर्वपद ‘देश’ है; हिन्दी में ‘उसे’ उसी की ओर संकेत करता है।
- source_word: וְלֹא מָצָאתִי
  choice: पर मुझे कोई नहीं मिला
  rationale: मूल संयोजक औपचारिक रूप से ‘और’ है, पर प्रसंग में खोज और निष्फलता का विरोध है। ‘पर’ उस दुखद विरोध को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: रक्षात्मक दीवार और मध्यस्थतापूर्ण हस्तक्षेप का संयुक्त रूपक
  choice: ‘दीवार बनाए’ और ‘देश की ओर से मेरे सामने दीवार की दरार में खड़ा हो’—दोनों चित्रों को साथ रखा गया।
  alternative: इसे केवल ‘देश के लिए विनती करे’ या ‘देश को बचाने के लिए हस्तक्षेप करे’ कहना।
  rationale: इब्रानी पाठ नागरिक सुरक्षा की ठोस छवि और परमेश्वर के सामने प्रतिनिधि रूप से खड़े होने का भाव एक साथ रखता है। केवल प्रार्थना या केवल निर्माण के रूप में अनुवाद करना इस तनाव को समतल कर देता।
- issue: אִישׁ का लिंग और वचन
  choice: एक ऐसे पुरुष
  alternative: कोई व्यक्ति; कोई
  rationale: स्रोत पुल्लिंग एकवचन है और सम्भवतः प्रतिनिधिक ढंग से प्रयुक्त है। मुख्य पाठ में उसका स्पष्ट रूप बनाए रखा गया है, जबकि पादटिप्पणी उसके सम्भावित व्यापक प्रयोग को बताती है।
- issue: विनाश को रोकने वाली शर्त
  choice: ‘ताकि मैं उसे नष्ट न करूँ’ में वक्ता को विनाश करने वाला स्पष्ट रखा गया।
  alternative: ‘ताकि देश नष्ट न हो’ जैसा कर्मवाच्य रूप।
  rationale: मूल प्रथम पुरुष कर्ता को स्पष्ट करता है। उसे कर्मवाच्य बनाना दैवी न्याय के कथन को अनावश्यक रूप से नरम कर देता।
