source:
  edition: WLC
  text: וּ/נְבִיאֶ֗י/הָ טָח֤וּ לָ/הֶם֙ תָּפֵ֔ל חֹזִ֣ים שָׁ֔וְא וְ/קֹסְמִ֥ים לָ/הֶ֖ם כָּזָ֑ב אֹמְרִ֗ים כֹּ֤ה אָמַר֙ אֲדֹנָ֣/י יְהוִ֔ה וַֽ/יהוָ֖ה לֹ֥א דִבֵּֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/022/028.yaml
  text: And her prophets have plastered for them with whitewash[a], seeing falsehood and divining lies for them, saying[b], ‘Thus says the Lord GOD,’ when Yahweh has not spoken.
translation:
  language: hi
  text: और उसके भविष्यद्वक्ताओं ने उनके लिए सफ़ेदी पोत दी है[a]; वे मिथ्या दर्शन देखते और उनके लिए झूठा शकुन बताते हैं। वे कहते हैं, “प्रभु याहवे[b] यों कहते हैं,” जबकि याहवे ने कहा ही नहीं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “कच्चे गारे से लीप दिया” अथवा “घटिया पलस्तर कर दिया।” इब्रानी चित्र ऐसी भ्रामक परत का है जो भीतर के दोषों को ढक देती है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में “अदोनाय याहवे,” अर्थात “प्रभु याहवे।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּנְבִיאֶיהָ
  choice: और उसके भविष्यद्वक्ताओं ने
  rationale: स्त्रीलिंग एकवचन प्रत्यय नगर की ओर संकेत करता है; हिन्दी में संदर्भानुसार “उसके” स्वाभाविक है।
- source_word: טָחוּ לָהֶם תָּפֵל
  choice: उनके लिए सफ़ेदी पोत दी है
  rationale: क्रिया लीपने-पोतने का चित्र रखती है, जबकि תָּפֵל ऐसी सतही और अविश्वसनीय परत को सूचित करता है जो दोषों को ढकती है। वैकल्पिक अर्थ पादटिप्पणी में सुरक्षित है।
- source_word: חֹזִים שָׁוְא
  choice: मिथ्या दर्शन देखते
  rationale: שָׁוְא यहाँ खोखले, धोखापूर्ण या असत्य दर्शन का बोध देता है; “मिथ्या दर्शन” भविष्यद्वाणी के संदर्भ और संक्षिप्तता दोनों को बनाए रखता है।
- source_word: וְקֹסְמִים לָהֶם כָּזָב
  choice: उनके लिए झूठा शकुन बताते हैं
  rationale: קסם को सामान्य भविष्यवाणी न बनाकर शकुन-विचार अथवा दिव्यज्ञान की विशिष्ट क्रिया के रूप में रखा गया है।
- source_word: כֹּה אָמַר אֲדֹנָי יְהוִה
  choice: प्रभु याहवे ऐसा कहते हैं
  rationale: यह मानक संदेशवाहक-सूत्र है; אֲדֹנָי को “प्रभु” और ईश्वरीय नाम יהוה को “याहवे” रूप में अलग-अलग सुरक्षित रखा गया है।
- source_word: וַיהוָה לֹא דִבֵּר
  choice: जबकि याहवे ने कहा ही नहीं
  rationale: “ही नहीं” झूठे दावे और वास्तविकता के तीखे विरोध को स्वाभाविक हिन्दी में व्यक्त करता है, बिना मूल कथन में नई बात जोड़े।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: प्रत्यक्ष नाम को उपाधि में बदलने के बजाय लिप्यंतरित किया गया है; इससे אֲדֹנָי और יהוה के बीच मूल भेद भी बना रहता है।
- issue: תָּפֵל के रूपक का अर्थ
  choice: सफ़ेदी
  alternative: कच्चा गारा; घटिया पलस्तर
  rationale: मुख्य पाठ में दोष छिपाने वाली सतही परत का सहज चित्र मिलता है, जबकि पदार्थ की सटीक प्रकृति से जुड़ी वास्तविक शाब्दिक अनिश्चितता पादटिप्पणी में रखी गई है।
- issue: קסם को भविष्यवाणी के समान मानना
  choice: शकुन बताना
  alternative: भविष्यवाणी करना; झूठी दिव्य-वाणी देना
  rationale: मूल क्रिया भविष्यसूचक वाणी की सामान्य क्रिया से अधिक विशिष्ट रूप से शकुन-विचार/दिव्यज्ञान को दर्शाती है; इस भेद को बनाए रखना धार्मिक तनाव को सपाट होने से बचाता है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य हिन्दी अपनाई गई है। वाक्य में नगर के लिए स्त्रीलिंग संकेत को हिन्दी के स्वाभाविक “उसके” से व्यक्त किया गया है। “मिथ्या दर्शन” और “झूठा शकुन” के द्वारा दर्शन और दिव्यज्ञान की दो अलग क्रियाएँ सुरक्षित रखी गई हैं।
