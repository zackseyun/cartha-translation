source:
  edition: WLC
  text: אַנְשֵׁ֥י רָכִ֛יל הָ֥יוּ בָ֖/ךְ לְמַ֣עַן שְׁפָךְ דָּ֑ם וְ/אֶל הֶֽ/הָרִים֙ אָ֣כְלוּ בָ֔/ךְ זִמָּ֖ה עָשׂ֥וּ בְ/תוֹכֵֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/022/009.yaml
  text: Men of slander were in you in order to shed blood[a]; and on the mountains they ate[c][b]; they committed lewdness in your midst.
translation:
  language: hi
  text: तेरे बीच खून बहाने के लिए बदनामी फैलानेवाले लोग थे[a]। तेरे यहाँ उन्होंने पहाड़ों पर भोजन किया[b] और तेरे बीच लज्जाहीनता की[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘बदनामी फैलानेवाले’ का अनुवाद ‘चुगली करनेवाले’ या ‘मुखबिरी करनेवाले’ भी हो सकता है। इब्रानी शब्द में आरोप अथवा निंदा फैलाने का भाव हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: अर्थात वे ऊँचे स्थानों पर होनेवाले निषिद्ध भोजों में सम्मिलित हुए, जो संभवतः मूर्तिपूजक आराधना से जुड़े थे।
    reason: cultural_note
  - marker: c
    text: इसका अनुवाद ‘दुष्टता’ या ‘यौन दुराचार’ भी हो सकता है। इब्रानी शब्द प्रायः लज्जाहीन और घोर अनैतिक आचरण, विशेषकर यौन आचरण, को दर्शाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אַנְשֵׁי רָכִיל
  choice: बदनामी फैलानेवाले लोग
  rationale: यह रचना उन लोगों को दर्शाती है जो चुगली, आरोप या निंदा फैलाते हैं। यह चयन आधुनिक हिन्दी में स्वाभाविक है और उस न्यायिक-सामाजिक हानि को भी व्यक्त करता है जो आगे रक्तपात तक पहुँचती है।
- source_word: לְמַעַן שְׁפָךְ דָּם
  choice: ताकि खून बहाया जाए
  rationale: לְמַעַן के प्रयोजन अथवा परिणामसूचक बल को बनाए रखता है और ‘खून बहाना’ की ठोस भविष्यद्वक्तापरक अभिव्यक्ति सुरक्षित रखता है। कर्मवाच्य हिन्दी वाक्यांश इस बात को अनावश्यक रूप से तय नहीं करता कि रक्तपात सीधे उन्हीं लोगों ने किया या उनके आरोपों के फलस्वरूप हुआ।
- source_word: וְאֶל הֶהָרִים אָכְלוּ בָךְ
  choice: तेरे यहाँ उन्होंने पहाड़ों पर भोजन किया
  rationale: ‘पहाड़ों पर भोजन’ की इब्रानी छवि को मुख्य पाठ में सुरक्षित रखा गया है; ऊँचे स्थानों पर मूर्तिपूजक भोज का सांस्कृतिक संकेत पादटिप्पणी में स्पष्ट किया गया है। ‘तेरे यहाँ’ בָךְ और यरूशलेम को स्त्रीलिंग एकवचन संबोधन को स्वाभाविक हिन्दी में दर्शाता है।
- source_word: זִמָּה
  choice: लज्जाहीन काम
  rationale: यह शब्द घोर नैतिक दुष्टता, और प्रायः यौन दुराचार, का बोध करा सकता है। ‘लज्जाहीन काम’ उसके आक्रोशपूर्ण नैतिक बल को बनाए रखते हुए अर्थ को केवल यौन क्षेत्र तक सीमित नहीं करता।
- source_word: עָשׂוּ בְתוֹכֵךְ
  choice: तेरे बीच ... किए
  rationale: अमूर्त कर्म के साथ עשה का स्वाभाविक अर्थ ‘करना’ है। ‘तेरे बीच’ नगर को सीधे स्त्रीलिंग एकवचन संबोधन की निरंतरता बनाए रखता है।
