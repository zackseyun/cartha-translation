    rationale: '''खून बहाने के लिए'' is concise, idiomatic, and retains the purposive relation without introducing an unnecessary passive.'
  - severity: low
    issue: '''लज्जाहीन काम किए'' is somewhat colloquial and diffuse for the abstract noun זִמָּה.'
