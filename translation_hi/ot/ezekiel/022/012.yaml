source:
  edition: WLC
  text: שֹׁ֥חַד לָֽקְחוּ בָ֖/ךְ לְמַ֣עַן שְׁפָךְ דָּ֑ם נֶ֧שֶׁךְ וְ/תַרְבִּ֣ית לָקַ֗חַתְּ וַ/תְּבַצְּעִ֤י רֵעַ֨יִ/ךְ֙ בַּ/עֹ֔שֶׁק וְ/אֹתִ֣/י שָׁכַ֔חַתְּ נְאֻ֖ם אֲדֹנָ֥/י יְהוִֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/022/012.yaml
  text: In you they have taken bribes to shed blood; you have taken interest and profit[a], and you have extorted your neighbors by oppression, and you have forgotten me, declares the Lord GOD.
translation:
  language: hi
  text: तेरे भीतर लोगों ने खून बहाने के लिए रिश्वत ली है; तूने ब्याज और अतिरिक्त लाभ[a] लिया है, और अत्याचार करके अपने पड़ोसियों को लूटा है। तू मुझे भूल गई है—प्रभु यहोवा की यह घोषणा है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या, “ब्याज और वृद्धि।” इब्रानी में ऋण से होने वाले लाभ के लिए दो निकट-संबंधित शब्द हैं: “ब्याज” (נֶשֶׁךְ) और “वृद्धि/अतिरिक्त लाभ” (תַרְבִּית)।'
    reason: lexical_alternative
lexical_decisions:
- source_word: שֹׁחַד לָקְחוּ בָךְ
  choice: तेरे भीतर ... रिश्वत ली जाती है
  rationale: इब्रानी में क्रिया बहुवचन है और यरूशलेम को स्त्रीलिंग एकवचन में संबोधित किया गया है। हिंदी का कर्मवाच्य सामूहिक कर्ताओं को अनिर्दिष्ट रखते हुए नगर के भीतर होने वाले आचरण को स्वाभाविक रूप से व्यक्त करता है।
- source_word: לְמַעַן שְׁפָךְ דָּם
  choice: खून बहाने के लिए
  rationale: यह उद्देश्य बताने वाली रचना है। 'खून बहाना' आधुनिक हिंदी में हिंसक हत्या अथवा न्यायिक रक्तपात की गंभीरता स्पष्ट रखता है।
- source_word: נֶשֶׁךְ וְתַרְבִּית
  choice: ब्याज और बढ़ोतरी
  rationale: दो निकट-संबंधित ऋण-लाभ शब्दों को अलग रखा गया है। 'ब्याज' נֶשֶׁךְ का स्पष्ट आधुनिक समतुल्य है और 'बढ़ोतरी' תַרְבִּית के मूल अर्थ 'वृद्धि/अधिक लाभ' को सुरक्षित रखती है।
- source_word: וַתְּבַצְּעִי רֵעַיִךְ בַּעֹשֶׁק
  choice: अत्याचार करके अपने पड़ोसियों से अनुचित लाभ कमाती है
  rationale: בצע यहाँ लालच से अन्यायपूर्ण लाभ लेने का भाव देता है; עֹשֶׁק उसका दमनकारी साधन बताता है। यह अनुवाद अस्पष्ट शाब्दिक रचना से बचते हुए दोनों तत्वों को बनाए रखता है।
- source_word: וְאֹתִי שָׁכַחַתְּ
  choice: तू मुझे भूल गई है
  rationale: यरूशलेम को स्त्रीलिंग एकवचन संबोधन और परमेश्वर को भूलने के चरम आरोप, दोनों को सीधे सुरक्षित रखा गया है।
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: यह प्रभु यहोवा की घोषणा है
  rationale: נְאֻם को औपचारिक भविष्यद्वाणी-सूत्र 'घोषणा' से व्यक्त किया गया है। אֲדֹנָי और दिव्य नाम יהוה दोनों को क्रमशः 'प्रभु' और 'यहोवा' के रूप में अलग रखा गया है।
theological_decisions:
- issue: अֲדֹנָי יְהוִה में दिव्य नाम का अनुवाद
  choice: प्रभु यहोवा
  alternative: प्रभु परमेश्वर
  rationale: मूल में उपाधि אֲדֹנָי के बाद व्यक्तिगत दिव्य नाम יהוה आता है। 'प्रभु यहोवा' दोनों को अलग-अलग सुरक्षित रखता है और दिव्य नाम को सामान्य उपाधि में विलीन नहीं करता।
- issue: यरूशलेम का व्यक्तिकृत संबोधन
  choice: स्त्रीलिंग एकवचन 'तू/तेरे/लेती/गई'
  alternative: बहुवचन समुदाय-संबोधन 'तुम/तुम्हारे'
  rationale: मूल पाठ लगातार 2 स्त्रीलिंग एकवचन रूपों से नगर को संबोधित करता है। हिंदी में स्त्रीलिंग एकवचन इस साहित्यिक और धर्मवैचारिक व्यक्तिकरण को स्पष्ट रखता है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट हिंदी। भविष्यद्वाणी की सीधी अभियोगात्मक शैली के लिए अनौपचारिक एकवचन 'तू' रखा गया है; यह यरूशलेम के मूल स्त्रीलिंग एकवचन संबोधन को सुरक्षित करता है।
