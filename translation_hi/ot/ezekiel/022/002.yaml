    reason: עִיר הַדָּמִים के हिब्रू बहुवचन और उसके रक्तपात/रक्तदोष संबंधी अर्थ-विस्तार को सुरक्षित रखना।
lexical_decisions:
- source_word: בֶן אָדָם
  choice: हे मनुष्य के पुत्र
  rationale: यह यहेजकेल के लिए बार-बार प्रयुक्त संबोधन है। यह हिन्दी में हिब्रू मुहावरे के रूप और पुस्तक के भीतर उसकी निरंतरता को बनाए रखता है।
- source_word: הֲתִשְׁפֹּט הֲתִשְׁפֹּט
  choice: क्या तू न्याय करेगा, क्या तू ... न्याय करेगा?
  rationale: प्रश्नवाचक क्रिया की पुनरावृत्ति जोर और आलंकारिक चुनौती व्यक्त करती है; इसलिए उसे समतल करके एक ही बार नहीं कहा गया।
- source_word: עִיר הַדָּמִים
  choice: रक्तपात की नगरी
  rationale: हिब्रू बहुवचन ‘रक्तों’ का अर्थ इस संदर्भ में हिंसक हत्या और उससे जुड़ा रक्तदोष हो सकता है। ‘रक्तपात की नगरी’ स्वाभाविक हिन्दी में मुख्य अर्थ को व्यक्त करती है, जबकि पादटिप्पणी शाब्दिक रूप और रक्तदोष की छाया सुरक्षित रखती है।
- source_word: וְהוֹדַעְתָּהּ
  choice: तब उसे ... बता दे
  rationale: ידע का हिफ़ील रूप ‘उसे जानने दे/उस पर प्रकट कर’ का कारणवाचक भाव रखता है। प्रश्न के बाद ‘तब’ हिन्दी में प्रवचन-क्रम को स्वाभाविक बनाता है।
- source_word: כָּל תּוֹעֲבוֹתֶיהָ
  choice: उसके सारे घिनौने काम
  rationale: ‘सारे’ כָּל की समग्रता को बनाए रखता है, और ‘घिनौने काम’ תּוֹעֵבָה की तीव्र नैतिक-धार्मिक निंदा को आधुनिक, समझने योग्य हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: בֶן אָדָם में אָדָם का अनुवाद
  choice: मनुष्य के पुत्र
  alternative: मरणशील मनुष्य
  rationale: यह किसी उपाधि का बाद का धर्मवैज्ञानिक अर्थ आरोपित करने के बजाय यहेजकेल को दिए गए स्थापित हिब्रू संबोधन का रूप बनाए रखता है।
- issue: עִיר הַדָּמִים में हिंसा और रक्तदोष की अर्थ-छाया
  choice: रक्तपात की नगरी
  alternative: रक्तदोषी नगरी
  rationale: मुख्य पाठ हिंसक रक्तपात को सामने रखता है, पर हिब्रू पद में रक्त बहाने से उत्पन्न दोष का भाव भी संभव है; उसे पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की, गंभीर और भविष्यद्वक्ताई स्वर वाली है। ‘तू’ मूल हिब्रू के एकवचन संबोधन और परमेश्वर द्वारा भविष्यद्वक्ता को सीधे आदेश देने की शैली को दर्शाता है। क्रिया की पुनरावृत्ति जानबूझकर रखी गई है।
