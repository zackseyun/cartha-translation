- source_word: לֵאמֹר
  choice: ':'
  rationale: यह infinitive अगले प्रत्यक्ष कथन का परिचय देता है। हिन्दी में पदांत का द्विबिंदु ‘यह कहते हुए’ की अपेक्षा अधिक स्वाभाविक ढंग से आगामी वाणी का संकेत देता है।
