base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/022/024.yaml
  text: Son of man[a], say to her[c][b], ‘You are a land not cleansed and not rained on in the day of indignation.’
translation:
  language: hi
  text: हे मनुष्य के पुत्र, उससे कह, ‘तू भूमि है जो शुद्ध नहीं की गई है[a] और जिस पर क्रोध के दिन वर्षा नहीं हुई[b]।’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “पवित्र नहीं की गई” अथवा “अशुद्ध है।” इब्रानी कृदंत अशुद्ध अवस्था या शुद्ध न किए जाने—दोनों का भाव दे सकता है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी रूप दुर्लभ है; इसका अनुवाद “जिस पर बौछार नहीं पड़ी” या “जो वर्षा-विहीन रही” भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן אָדָם
  choice: हे मनुष्य के पुत्र
  rationale: यहेजकेल में नबी के लिए प्रयुक्त इस विशिष्ट संबोधन का पारंपरिक रूप और एकवचन बनाए रखा गया है।
- source_word: אֱמָר לָהּ
  choice: उससे कह
  rationale: आज्ञार्थक क्रिया और स्त्रीलिंग एकवचन सर्वनाम को सीधे व्यक्त करता है; स्त्रीलिंग आगे संबोधित ‘भूमि’ के अनुरूप है।
- source_word: אַתְּ אֶרֶץ
  choice: तू ऐसी भूमि है
  rationale: स्वतंत्र स्त्रीलिंग सर्वनाम के बल और संबोधित व्यक्ति/समुदाय की भूमि के रूप में रूपकात्मक पहचान को स्वाभाविक हिन्दी में व्यक्त करता है। ‘ऐसी’ अगले दोनों विशेषणात्मक कथनों से वाक्य को सहजता से जोड़ता है।
- source_word: לֹא מְטֹהָרָה
  choice: शुद्ध नहीं की गई
  rationale: טהר के निष्क्रिय कृदंत का भाव सुरक्षित है और यह नैतिक तथा अनुष्ठानिक शुद्धता—दोनों संभावित अर्थों को खुला रखता है।
- source_word: לֹא גֻשְׁמָהּ
  choice: जिस पर … वर्षा नहीं हुई
  rationale: दुर्लभ निष्क्रिय रूप को वर्षा से संबंधित मानते हुए स्वाभाविक हिन्दी में प्रस्तुत किया गया है; इसकी दुर्लभता के कारण वैकल्पिक बोध पादटिप्पणी में रखा गया है।
- source_word: בְּיוֹם זָעַם
  choice: क्रोध के दिन
  rationale: זעם के न्यायसूचक प्रबल भाव को स्पष्ट रखता है, पर यह अनावश्यक रूप से नहीं बताता कि क्रोध किसका है।
theological_decisions:
- issue: भूमि की अशुद्धता और वर्षा के अभाव का संबंध
  choice: दोनों कथनों को समानांतर रूप में रखा गया है—भूमि शुद्ध नहीं की गई और उस पर क्रोध के दिन वर्षा नहीं हुई।
  alternative: वर्षा को केवल आत्मिक शुद्धिकरण का रूपक अथवा केवल शाब्दिक अकाल का संकेत मानना।
  rationale: इब्रानी कथन नैतिक-अनुष्ठानिक अशुद्धता और रोकी गई वर्षा के न्यायसूचक चित्र को साथ रख सकता है। अनुवाद इस तनाव को किसी एक व्याख्या में सीमित नहीं करता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, किंतु भविष्यद्वाणी के गरिमापूर्ण संबोधन के अनुरूप रखी गई है। ‘तू’ स्त्रीलिंग एकवचन भूमि को सीधे संबोधित करता है और मूल के निकट है।
