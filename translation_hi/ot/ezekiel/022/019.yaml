language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: לָ/כֵ֗ן כֹּ֤ה אָמַר֙ אֲדֹנָ֣/י יְהוִ֔ה יַ֛עַן הֱי֥וֹת כֻּלְּ/כֶ֖ם לְ/סִגִ֑ים לָ/כֵן֙ הִנְ/נִ֣י קֹבֵ֣ץ אֶתְ/כֶ֔ם אֶל תּ֖וֹךְ יְרוּשָׁלִָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/022/019.yaml
  text: 'Therefore thus says the Lord GOD: Because all of you have become dross[a], therefore behold, I am gathering you into the midst of Jerusalem.'
translation:
  language: hi
  text: 'इसलिए प्रभु याहवे यों कहते हैं: “क्योंकि तुम सब धातु का मैल[a] हो गए हो, इसलिए देखो, मैं तुम्हें यरूशलेम के बीचों-बीच इकट्ठा कर रहा हूँ।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “धातु का कचरा” अथवा “धातु की अशुद्धियाँ।” इब्रानी शब्द उस अनुपयोगी पदार्थ को दर्शाता है जो धातु गलाने पर उससे अलग होता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  choice: प्रभु याहवे
  rationale: दोनों इब्रानी तत्वों को सुरक्षित रखते हुए אֲדֹנָי को ‘प्रभु’ और परमेश्वर के व्यक्तिगत नाम יהוה को ‘याहवे’ के रूप में प्रस्तुत किया गया है।
- source_word: יַעַן הֱיוֹת
  choice: क्योंकि … हो गए हो
  rationale: יַעַן कारण बताता है, और היה का रूप उस परिणामी दशा को व्यक्त करता है जो न्याय का आधार है।
- source_word: כֻּלְּכֶם
  choice: तुम सब
  rationale: इब्रानी के स्पष्ट द्वितीय पुरुष बहुवचन और उसकी सामूहिक व्यापकता को बनाए रखता है।
- source_word: לְסִגִים
  choice: धातु का मैल
  rationale: סִיגִים धातु गलाने पर अलग होने वाले अनुपयोगी मैल या अशुद्ध पदार्थ को दर्शाता है। ‘धातु का मैल’ सामान्य हिन्दी पाठक के लिए स्पष्ट है और धातु-शोधन के रूपक को बनाए रखता है।
- source_word: הִנְנִי קֹבֵץ
  choice: देखो, मैं … इकट्ठा कर रहा हूँ
  rationale: הִנְנִי की ध्यान आकर्षित करने वाली प्रबलता और कृदंत की सन्निकट तथा निश्चित कार्रवाई—दोनों को वर्तमानकालीन, सजीव अभिव्यक्ति में रखा गया है।
- source_word: אֶל תּוֹךְ יְרוּשָׁלִָם
  choice: यरूशलेम के बीचों-बीच
  rationale: תּוֹךְ नगर के भीतर या मध्य में इकट्ठा किए जाने की छवि पर बल देता है; ‘बीचों-बीच’ इस बल को स्वाभाविक हिन्दी में सुरक्षित रखता है।
theological_decisions:
- issue: संयुक्त उपाधि אֲדֹנָי יְהוִה में परमेश्वर के नाम का अनुवाद
  choice: प्रभु याहवे
  alternative: प्रभु परमेश्वर / प्रभु यहोवा
  rationale: पाठ में आए व्यक्तिगत नाम יהוה को सामान्य उपाधि में बदलने के बजाय लिप्यंतरित किया गया है, और אֲדֹנָי को अलग से ‘प्रभु’ कहा गया है। इससे संयुक्त इब्रानी पद के दोनों तत्व बने रहते हैं।
- issue: लोगों का ‘धातु का मैल’ बनना
  choice: रूपक को सीधे बनाए रखा गया
  alternative: ‘निकम्मे’ या ‘अशुद्ध’ कहकर अर्थ खोलना
  rationale: आगे के प्रसंग में गलाने और धातु शुद्ध करने का न्याय-रूपक चलता है; इसलिए इसे नैतिक व्याख्या में बदलकर उसकी चित्रात्मकता या धार्मिक तनाव को समाप्त नहीं किया गया।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। ‘यों कहते हैं’ भविष्यद्वाणी की औपचारिक उद्घोषणा को स्वाभाविक हिन्दी में प्रस्तुत करता है; ‘देखो’ इब्रानी घोषणा की प्रबलता बनाए रखता है।
