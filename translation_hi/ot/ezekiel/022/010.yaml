source:
  edition: WLC
  text: עֶרְוַת אָ֖ב גִּלָּה בָ֑/ךְ טְמֵאַ֥ת הַ/נִּדָּ֖ה עִנּוּ בָֽ/ךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/022/010.yaml
  text: In you they uncover a father's nakedness[c][b][a]; in you they violate a woman in her menstrual impurity.
translation:
  language: hi
  text: तेरे बीच लोग पिता की नग्नता प्रकट करते हैं[a][b]; तेरे बीच वे मासिक धर्म की अशुद्धता वाली स्त्री को अपमानित करते हैं[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, ‘पिता की नग्नता प्रकट करते हैं।’ यह निषिद्ध यौन-संबंध के लिए लैव्यव्यवस्था की पारिभाषिक अभिव्यक्ति है; लैव्यव्यवस्था 18:7 देखें।
    reason: cross_reference
  - marker: b
    text: या, ‘तुझमें।’ यहाँ यरूशलेम को स्त्रीरूप में संबोधित किया गया है।
    reason: lexical_alternative
  - marker: c
    text: इब्रानी में, ‘मासिक धर्म की अशुद्धता।’
    reason: lexical_alternative
lexical_decisions:
- source_word: עֶרְוַת אָב
  choice: पिता का नंगापन
  rationale: यह रचना शाब्दिक अर्थ और लैव्यव्यवस्था की निषिद्ध यौन-संबंध संबंधी पारिभाषिक अभिव्यक्ति—‘नंगापन उघाड़ना’—दोनों को सुरक्षित रखती है। ‘अपने पिता’ कहना इब्रानी में निहित न होने वाली विशिष्टता जोड़ देता।
- source_word: גִּלָּה
  choice: लोग ... उघाड़ते हैं
  rationale: इब्रानी क्रिया एकवचन है, पर यरूशलेम के भीतर होने वाले सामूहिक अपराधों की सूची में इसका अनिर्दिष्ट/सामूहिक भाव है। स्वाभाविक हिन्दी में ‘लोग’ इसे स्पष्ट करता है, और वर्तमान काल भविष्यद्वक्ता के आरोप की जीवंतता रखता है।
- source_word: בָךְ
  choice: तेरे बीच
  rationale: द्वितीय पुरुष स्त्रीलिंग प्रत्यय यरूशलेम को स्त्रीरूप में संबोधित करता है। शाब्दिक ‘तुझमें’ सम्भव है, पर समुदाय के भीतर किए जाने वाले अपराधों के लिए ‘तेरे बीच’ अधिक स्वाभाविक हिन्दी है और वही स्थानीय-सामुदायिक अर्थ देता है।
- source_word: טְמֵאַת הַנִּדָּה
  choice: मासिक धर्म की अशुद्धता में पड़ी स्त्री
  rationale: इब्रानी पद मासिक धर्म से जुड़ी धार्मिक अशुद्धता की अवस्था बताता है। स्त्री का उल्लेख व्याकरण और प्रसंग से निहित है; उसे हिन्दी में व्यक्त करने से वाक्य स्पष्ट होता है, जबकि ‘अशुद्धता’ विधिक/अनुष्ठानिक अर्थ को बनाए रखता है।
- source_word: עִנּוּ
  choice: उसके साथ जबरदस्ती करते हैं
  rationale: यौन प्रसंग में ענה सामान्य ‘दुःख देना’ या ‘दीन करना’ से अधिक, अपमानजनक और सम्भवतः बलपूर्वक यौन व्यवहार सूचित करता है। ‘जबरदस्ती करते हैं’ इसकी गंभीरता रखता है, पर अधिक तकनीकी आधुनिक कानूनी शब्द आरोपित नहीं करता।
theological_decisions:
- issue: लैव्यव्यवस्था की यौन-वर्जना वाली पारिभाषिक अभिव्यक्ति का अनुवाद
  choice: मुख्य पाठ में ‘पिता का नंगापन उघाड़ते हैं’ बनाए रखना
  alternative: इसे स्पष्ट करके ‘पिता की पत्नी से यौन-संबंध रखते हैं’ या ‘कौटुम्बिक व्यभिचार करते हैं’ कहना
  rationale: इब्रानी स्वयं निश्चित स्त्री-संबंध को इस पद में स्पष्ट नहीं करता। पारिभाषिक अभिव्यक्ति बनाए रखने से लैव्यव्यवस्था 18:7 के साथ अंतर्पाठीय संबंध सुरक्षित रहता है और किसी एक व्याख्या को पाठ में नहीं डाला जाता।
- issue: עִנּוּ में बलप्रयोग की मात्रा
  choice: ‘उसके साथ जबरदस्ती करते हैं’
  alternative: ‘उसे अपमानित करते हैं’ या ‘उसके साथ यौन-संबंध रखते हैं’
  rationale: यौन संदर्भ क्रिया को गंभीर उल्लंघन का अर्थ देता है। फिर भी इब्रानी की शब्दार्थ-सीमा को देखते हुए ऐसा आधुनिक कानूनी वर्गीकरण नहीं चुना गया जो हर सम्भव अर्थ को बंद कर दे।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सीधे आरोपात्मक हिन्दी अपनाई गई है। ‘तेरे’ से यरूशलेम के प्रति इब्रानी का प्रत्यक्ष स्त्रीलिंग संबोधन बना रहता है। लैव्यव्यवस्था की पारिभाषिक भाषा को मुख्य पाठ में रखा गया है और उसका आशय पादटिप्पणी में समझाया गया है।
