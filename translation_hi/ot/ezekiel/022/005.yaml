  text: הַ/קְּרֹב֛וֹת וְ/הָ/רְחֹק֥וֹת מִמֵּ֖/ךְ יִתְקַלְּסוּ בָ֑/ךְ טְמֵאַ֣ת הַ/שֵּׁ֔ם רַבַּ֖ת הַ/מְּהוּמָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/022/005.yaml
  text: Those who are near and those who are far from you will mock you[a], defiled of name[b], full of turmoil.
translation:
  language: hi
  text: जो तुम्हारे निकट हैं और जो तुमसे दूर हैं, वे तुम्हारा उपहास करेंगे—हे कलंकित नामवाली[a], उपद्रव से भरी हुई[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक रूप के अधिक निकट: ‘नाम की अशुद्ध।’ इसका अर्थ ‘जिसका नाम कलंकित है’ या ‘जो अपनी प्रतिष्ठा में अपवित्र है’ भी हो सकता है। इब्रानी पदबंध संक्षिप्त है।'
    reason: lexical_alternative
  - marker: b
    text: या ‘कोलाहल से भरी हुई,’ ‘अव्यवस्था से भरी हुई,’ अथवा ‘उथल-पुथल से भरपूर।’
    reason: lexical_alternative
lexical_decisions:
- source_word: הַקְּרֹבוֹת
  choice: जो तुम्हारे निकट हैं
  rationale: यह निश्चित लेखयुक्त स्त्रीलिंग बहुवचन विशेषण संज्ञा के रूप में प्रयुक्त है। सन्दर्भगत निकटता स्पष्ट करने के लिए ‘तुम्हारे’ जोड़ा गया है, पर किसी विशिष्ट जाति या नगर का नाम नहीं जोड़ा गया।
- source_word: וְהָרְחֹקוֹת מִמֵּךְ
  choice: और जो तुमसे दूर हैं
  rationale: यह पहले पद के समानान्तर है; מִמֵּךְ का स्थानिक अर्थ ‘तुमसे’ स्वाभाविक हिन्दी में सुरक्षित रखा गया है।
- source_word: יִתְקַלְּסוּ בָךְ
  choice: वे तुम्हारा उपहास करेंगे
  rationale: קלס के हित्पाएल रूप में उपहास या ठट्ठा करने का भाव है। हिन्दी में ‘तुम्हारा उपहास करेंगे’ स्वाभाविक रूप से בָךְ के लक्ष्यभाव को व्यक्त करता है।
- source_word: טְמֵאַת הַשֵּׁם
  choice: हे कलंकित नामवाली
  rationale: इब्रानी पदबंध संक्षिप्त और कुछ अस्पष्ट है। ‘कलंकित नामवाली’ स्त्रीलिंग सम्बोधन, नाम/प्रतिष्ठा पर लगे कलंक और मूल की संक्षिप्तता—तीनों को यथासम्भव बनाए रखता है।
- source_word: רַבַּת הַמְּהוּמָה
  choice: उपद्रव से भरी हुई
  rationale: רַבַּת यहाँ किसी गुण की बहुतायत बताता है और מְהוּמָה कोलाहल, अव्यवस्था या उथल-पुथल का बोध करा सकता है। ‘उपद्रव से भरी हुई’ संक्षिप्त, स्पष्ट और स्त्रीलिंग सम्बोधन के अनुरूप है।
theological_decisions:
- issue: टְמֵאַת הַשֵּׁם की संक्षिप्त रचना का अर्थ
  choice: इसे स्त्रीलिंग सम्बोधन ‘हे कलंकित नामवाली’ के रूप में रखना
  alternative: ‘जिसका नाम अपवित्र है’ या ‘बदनाम’
  rationale: मूल पदबंध नाम अथवा प्रतिष्ठा के दूषित होने की ओर संकेत करता है, पर उसका व्याकरणिक सम्बन्ध संक्षिप्त है। चुना हुआ रूप अर्थ को समझने योग्य बनाता है, फिर भी उसे पूरे सम्बन्धवाचक वाक्य में बदलकर अस्पष्टता को अनावश्यक रूप से समाप्त नहीं करता।
- issue: सम्बोधित पात्र को स्पष्ट रूप से यरूशलेम या नगरी कहना
  choice: केवल दूसरे पुरुष और स्त्रीलिंग सम्बोधन को बनाए रखना
  alternative: ‘हे यरूशलेम’ या ‘हे नगरी’ जोड़ना
  rationale: सन्दर्भ सम्बोधित पात्र की पहचान करता है, लेकिन इस पद में उसका नाम नहीं है; इसलिए उसे मुख्य पाठ में जोड़ना उचित नहीं।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण भविष्यवाणी-संबंधी सम्बोधन रखा गया है। ‘हे’ स्त्रीलिंग वर्णन को स्पष्ट करता है; भाषा को अत्यधिक संस्कृतनिष्ठ बनाने से बचते हुए मूल की संक्षिप्तता और कटु व्यंग्य सुरक्षित रखे गए हैं।
