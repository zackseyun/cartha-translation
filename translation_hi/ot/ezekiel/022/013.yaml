source:
  edition: WLC
  text: וְ/הִנֵּה֙ הִכֵּ֣יתִי כַפִּ֔/י אֶל בִּצְעֵ֖/ךְ אֲשֶׁ֣ר עָשִׂ֑ית וְ/עַ֨ל דָּמֵ֔/ךְ אֲשֶׁ֥ר הָי֖וּ בְּ/תוֹכֵֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/022/013.yaml
  text: And behold[a], I strike my hand against your unjust gain that you have made[b], and against the bloodshed that has been in your midst.
translation:
  language: hi
  text: और देख, मैं तेरी उस बेईमानी की कमाई[a] के विरुद्ध, जो तूने पाई है, और उस खून-खराबे[b] के विरुद्ध, जो तेरे भीतर हुआ है, अपना हाथ पटकता हूँ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘तेरी अन्यायपूर्ण कमाई’ अथवा ‘तेरा लालच।’ इब्रानी शब्द अन्याय या हिंसा से प्राप्त लाभ को सूचित कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: या ‘तेरा रक्तदोष।’ इब्रानी में ‘खून’ सामूहिक रूप से रक्तपात की घटनाओं और उनसे जुड़े दोष को सूचित कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  choice: और देख
  rationale: भविष्यद्वाणी में ध्यान खींचने वाले इस कथन-सूचक को छोड़ा नहीं गया; ‘देख’ आधुनिक हिन्दी में स्वाभाविक और प्रभावशाली है।
- source_word: הִכֵּיתִי כַפִּי
  choice: मैं अपना हाथ पटकता हूँ
  rationale: यह परमेश्वर के रोष और न्याय का सजीव मानवरूपी संकेत बनाए रखता है। इब्रानी पूर्णकाल को यहाँ घोषणात्मक, सजीव वर्तमान के रूप में व्यक्त किया गया है; ‘ताली बजाता हूँ’ कहना संकेत को आवश्यकता से अधिक निश्चित कर देता।
- source_word: אֶל ... וְעַל
  choice: के विरुद्ध ... और ... के विरुद्ध
  rationale: समानांतर पदबंधों और न्यायिक विरोध—दोनों को स्पष्ट रखा गया है।
- source_word: בִּצְעֵךְ
  choice: तेरी ... बेईमानी की कमाई
  rationale: בצע केवल तटस्थ लाभ नहीं, बल्कि अन्याय या हिंसा से प्राप्त लाभ का बोध करा सकता है। यह चयन आर्थिक और नैतिक दोनों अर्थों को सहज हिन्दी में रखता है।
- source_word: אֲשֶׁר עָשִׂית
  choice: जो तूने कमाई है
  rationale: शाब्दिक ‘जो तूने बनाई/की है’ हिन्दी में अस्वाभाविक होता; संज्ञा ‘कमाई’ के साथ क्रिया दोहराना स्रोत का आशय स्वाभाविक रूप से व्यक्त करता है।
- source_word: דָּמֵךְ
  choice: तेरे ... हुए खून-खराबे
  rationale: इब्रानी ‘खून’ सामूहिक रूप से रक्तपात के कार्यों अथवा उनसे जुड़े दोष को सूचित कर सकता है। ‘खून-खराबा’ सामान्य पाठक के लिए स्पष्ट है और बहुविध हिंसा का भाव रखता है।
- source_word: אֲשֶׁר הָיוּ בְּתוֹכֵךְ
  choice: तेरे बीच हुए
  rationale: यरूशलेम को स्त्रीलिंग एकवचन में किए गए संबोधन और नगर के भीतर घटित सामूहिक हिंसा—दोनों को संक्षेप में सुरक्षित रखा गया है।
theological_decisions:
- issue: न्याय के समय परमेश्वर के हाथ के संकेत का स्वरूप
  choice: ‘मैं अपना हाथ पटकता हूँ’ के द्वारा रोष और न्याय का ठोस मानवरूपी संकेत बनाए रखा गया।
  alternative: ‘मैं ताली बजाता हूँ’ या अमूर्त रूप में ‘मैं दण्ड दूँगा।’
  rationale: मूल पाठ हाथ की क्रिया का चित्र देता है, पर यह निश्चित नहीं करता कि उसका आशय सामान्य अर्थ में ताली बजाना है। इसलिए चित्र को बनाए रखते हुए उसके स्वरूप को अनावश्यक रूप से निश्चित नहीं किया गया।
- issue: דָּמֵךְ में रक्तपात और रक्तदोष का संबंध
  choice: मुख्य पाठ में ‘खून-खराबा’ रखा गया।
  alternative: ‘रक्तदोष’ या ‘तेरे खून।’
  rationale: संदर्भ नगर में हुई हिंसा पर अभियोग लगाता है। मुख्य पाठ में हिंसक कृत्यों का स्पष्ट अर्थ दिया गया, जबकि उनसे जुड़े दोष की वास्तविक अर्थ-संभावना पाद-टिप्पणी में सुरक्षित है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की है। ‘बेईमानी की कमाई’ और ‘खून-खराबा’ साधारण पाठकों के लिए सहज हैं, जबकि भविष्यद्वाणी की गरिमा और न्यायिक तीव्रता बनाए रखते हैं। स्त्रीलिंग ‘तेरी/तूने’ से संबोधित नगर यरूशलेम का व्याकरणिक रूप सुरक्षित है।
