source:
  edition: WLC
  text: בְּ/דָמֵ֨/ךְ אֲשֶׁר שָׁפַ֜כְתְּ אָשַׁ֗מְתְּ וּ/בְ/גִלּוּלַ֤יִ/ךְ אֲשֶׁר עָשִׂית֙ טָמֵ֔את וַ/תַּקְרִ֣יבִי יָמַ֔יִ/ךְ וַ/תָּב֖וֹא עַד שְׁנוֹתָ֑יִ/ךְ עַל כֵּ֗ן נְתַתִּ֤י/ךְ חֶרְפָּה֙ לַ/גּוֹיִ֔ם וְ/קַלָּסָ֖ה לְ/כָל הָ/אֲרָצֽוֹת־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/022/004.yaml
  text: By your blood that you have shed[a], you have become guilty, and by your idols that you have made, you have become unclean. You have brought your days near and have come to your years[b]. Therefore I have made you a reproach to the nations and a mockery to all the lands.
translation:
  language: hi
  text: तू अपने बहाए हुए खून के कारण दोषी हो गई है, और अपनी बनाई हुई घिनौनी मूर्तियों[a] के कारण अशुद्ध हो गई है। तूने अपने दिन निकट ला दिए हैं और अपने वर्षों तक पहुँच गई है[b]। इसलिए मैंने तुझे राष्ट्रों के लिए निन्दा का पात्र और सब देशों के लिए उपहास का पात्र बना दिया है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ ‘मूर्तियों’ के लिए प्रयुक्त इब्रानी शब्द तिरस्कारसूचक है; उसमें साधारण ‘मूर्ति’ से अधिक घृणा और अवमानना का भाव है।
    reason: cultural_note
  - marker: b
    text: 'अर्थ सम्भवतः: ‘तूने अपने दिन शीघ्र निकट ला दिए और अपने वर्षों के अन्त तक पहुँच गई है।’ यह मुहावरा यरूशलेम के लिए ठहराए गए न्याय के समय के निकट आने की ओर संकेत करता है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּדָמֵךְ אֲשֶׁר שָׁפַכְתְּ
  choice: अपने बहाए हुए खून के कारण
  rationale: בְּ को प्रसंगानुसार कारणसूचक समझा गया है। ‘खून बहाना’ हिन्दी में रक्तपात का स्वाभाविक मुहावरा है और यरूशलेम पर लगाए गए आरोप को स्पष्ट रखता है।
- source_word: אָשַׁמְתְּ
  choice: दोषी ठहरी है
  rationale: क्रिया अर्जित दोष और उसके फलस्वरूप बनी अवस्था को व्यक्त करती है; ‘दोषी ठहरी’ न्यायिक स्वर को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: גִלּוּלַיִךְ
  choice: घिनौनी मूर्तियों
  rationale: यहेजकेल में यह मूर्तियों के लिए तिरस्कारसूचक शब्द है। ‘घिनौनी’ उसके निंदात्मक बल को व्यक्त करता है, जबकि पादटिप्पणी शब्द की विशेष प्रकृति स्पष्ट करती है।
- source_word: טָמֵאת
  choice: अशुद्ध हो गई है
  rationale: Qal रूप अशुद्ध हो जाने की परिणामी अवस्था बताता है; इससे अनावश्यक आत्मवाचक अर्थ नहीं जोड़ा गया।
- source_word: וַתַּקְרִיבִי יָמַיִךְ
  choice: तूने अपने दिन निकट ला दिए हैं
  rationale: Hiphil का मूल अर्थ ‘निकट लाना’ सुरक्षित रखा गया है। वाक्य न्याय के नियत समय की ओर संकेत करता है, पर मुख्य पाठ में उसे विस्तार देकर निश्चित नहीं किया गया।
- source_word: וַתָּבוֹא עַד שְׁנוֹתָיִךְ
  choice: अपने वर्षों तक आ पहुँची है
  rationale: हिब्रू की असामान्य और अर्थगर्भित अभिव्यक्ति को निकटता से रखा गया है; सम्भावित अर्थ पादटिप्पणी में दिया गया है।
- source_word: חֶרְפָּה
  choice: निन्दा का पात्र
  rationale: यह अपमान, धिक्कार या बदनामी का भाव रखता है। ‘निन्दा का पात्र’ भविष्यवाणी के न्यायिक-सामाजिक स्वर को स्पष्ट करता है।
- source_word: קַלָּסָה
  choice: उपहास का पात्र
  rationale: यह हँसी और तिरस्कार का निशाना बनने को व्यक्त करता है तथा חֶרְפָּה से अर्थगत भेद बनाए रखता है।
- source_word: הָאֲרָצוֹת
  choice: देशों
  rationale: ‘राष्ट्रों’ के समानांतर यहाँ विभिन्न भू-राजनीतिक प्रदेश अभिप्रेत हैं, न कि अमूर्त रूप से सारी पृथ्वी।
theological_decisions:
- issue: यरूशलेम का दोष और अशुद्धता
  choice: रक्तपात से उत्पन्न न्यायिक दोष और मूर्तिपूजा से उत्पन्न धार्मिक-नैतिक अशुद्धता, दोनों को अलग पर समानांतर आरोपों के रूप में रखा गया है।
  alternative: अशुद्धता को केवल अनुष्ठानिक या दोष को केवल रूपकात्मक मानना।
  rationale: हिब्रू पाठ दोनों आरोपों को ठोस वाचा-संबंधी और भविष्यवाणीय अभियोग के रूप में जोड़ता है; अनुवाद किसी एक आयाम में उनका विलय नहीं करता।
- issue: दिनों और वर्षों का निकट आना
  choice: मुख्य पाठ में हिब्रू मुहावरे की अस्पष्टता रखी गई है और न्याय के नियत समय का सम्भावित आशय पादटिप्पणी में बताया गया है।
  alternative: मुख्य पाठ में सीधे ‘तूने अपने अन्त को शीघ्र बुला लिया है’ कहना।
  rationale: अधिक व्याख्यात्मक विकल्प सम्भावित अर्थ स्पष्ट करता है, पर स्रोत में ‘अन्त’ या ‘न्याय’ प्रत्यक्ष रूप से नहीं लिखा; इसलिए उसे मुख्य पाठ में नहीं जोड़ा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में स्त्रीलिंग एकवचन ‘तू’ रखा गया है, क्योंकि सम्बोधन यरूशलेम नगर से है और हिब्रू रूप स्त्रीलिंग हैं। शैली गरिमापूर्ण और सीधी है। ‘खून’ सामान्य आधुनिक हिन्दी के लिए चुना गया; ‘रक्त’ की अपेक्षा यह ‘खून बहाना’ मुहावरे में अधिक स्वाभाविक है। दोनों पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित हैं।
