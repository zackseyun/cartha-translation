id: EZK.34.3
reference: Ezekiel 34:3
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: אֶת הַ/חֵ֤לֶב תֹּאכֵ֨לוּ֙ וְ/אֶת הַ/צֶּ֣מֶר תִּלְבָּ֔שׁוּ הַ/בְּרִיאָ֖ה תִּזְבָּ֑חוּ הַ/צֹּ֖אן לֹ֥א תִרְעֽוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/034/003.yaml
  text: You eat the fat[a], you clothe yourselves with the wool, you slaughter the fattened sheep[b], but you do not shepherd the flock.
translation:
  language: hi
  text: तुम चरबी खाते हो[a], ऊन के वस्त्र पहनते हो, हृष्ट-पुष्ट पशु को वध करते हो[b], पर झुंड की चरवाही नहीं करते।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘दूध’; कुछ अनुवाद व्याख्यात्मक परंपरा या प्राचीन अनुवादों के पाठ का अनुसरण करते हैं, पर इब्रानी शब्द का सामान्य अर्थ ‘चरबी’ है।
    reason: lexical_alternative
  - marker: b
    text: या ‘हृष्ट-पुष्ट पशु’ अथवा ‘चुना हुआ पशु’; इब्रानी संभवतः झुंड के भली-भाँति पाले हुए पशु को दर्शाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הַחֵלֶב
  choice: चरबी
  rationale: חֵלֶב का सामान्य अर्थ ‘चरबी’ या ‘चर्बीला भाग’ है। ‘चरबी’ शोषण के ठोस बिंब को बनाए रखता है; ‘दूध’ पाठ-परंपरा पर आधारित वैकल्पिक समझ है।
- source_word: הַצֶּמֶר
  choice: ऊन
  rationale: צֶמֶר का सीधा और स्वाभाविक हिन्दी अर्थ ‘ऊन’ है।
- source_word: תִּלְבָּשׁוּ
  choice: अपने लिए वस्त्र बनाते हो
  rationale: לבש पहनने या वस्त्र धारण करने को व्यक्त करता है। इस प्रसंग में ऊन से स्वयं लाभ उठाने का भाव प्राकृतिक हिन्दी में स्पष्ट किया गया है।
- source_word: הַבְּרִיאָה
  choice: हृष्ट-पुष्ट भेड़
  rationale: בריא यहाँ मोटे, भली-भाँति पाले हुए या चुने हुए पशु को सूचित करता है। ‘हृष्ट-पुष्ट भेड़’ संदर्भगत आशय रखता है और पशु के स्वस्थ/मोटे होने की वास्तविक अस्पष्टता को अनावश्यक रूप से नहीं मिटाता।
- source_word: תִּזְבָּחוּ
  choice: काटते हो
  rationale: זבח यहाँ उपासना-संबंधी बलिदान से अधिक वध करने के अर्थ में है। ‘काटते हो’ पशुपालन के संदर्भ में सहज हिन्दी है।
- source_word: הַצֹּאן
  choice: झुंड
  rationale: צֹאן छोटे पालतू पशुओं, विशेषकर भेड़-बकरियों, के सामूहिक झुंड को दर्शाता है। चरवाहे के रूपक में ‘झुंड’ स्वाभाविक है।
- source_word: תִרְעוּ
  choice: चरवाही नहीं करते
  rationale: רעה में चराने, देखभाल करने और चरवाहे का पूरा कार्य करने का अर्थ है। ‘चरवाही’ अध्याय के केंद्रीय चरवाहा-झुंड रूपक को बनाए रखता है और केवल खिलाने तक अर्थ को सीमित नहीं करता।
theological_decisions:
- issue: इस्राएल के अगुओं के लिए चरवाहे के रूपक का बल
  choice: ‘झुंड की चरवाही नहीं करते’ के द्वारा चरवाहा-झुंड रूपक को स्पष्ट बनाए रखना।
  alternative: ‘झुंड को नहीं चराते’ या ‘भेड़ों को भोजन नहीं देते।’
  rationale: पूरा अध्याय अगुओं को चरवाहों के रूप में दोषी ठहराता है। ‘चरवाही’ व्यापक देखभाल और उत्तरदायित्व को व्यक्त करता है, बिना किसी बाद की सांप्रदायिक व्याख्या को पाठ में जोड़ने के।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। समानांतर आरोपों की लय रखी गई है और अंतिम विरोध को ‘पर’ से उभारा गया है। सभी पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित हैं।
