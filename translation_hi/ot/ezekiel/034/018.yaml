  text: הַ/מְעַ֣ט מִ/כֶּ֗ם הַ/מִּרְעֶ֤ה הַ/טּוֹב֙ תִּרְע֔וּ וְ/יֶ֨תֶר֙ מִרְעֵי/כֶ֔ם תִּרְמְס֖וּ בְּ/רַגְלֵי/כֶ֑ם וּ/מִשְׁקַע מַ֣יִם תִּשְׁתּ֔וּ וְ/אֵת֙ הַ/נּ֣וֹתָרִ֔ים בְּ/רַגְלֵי/כֶ֖ם תִּרְפֹּשֽׂוּ/ן־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/034/018.yaml
  text: Is it too little for you to graze on the good pasture[a], that you must trample the rest of your pastures with your feet, and to drink clear water[b], that you must muddy what remains with your feet?
translation:
  language: hi
  text: क्या तुम्हारे लिए अच्छे चरागाह में चरना ही काफ़ी नहीं है, कि तुम अपने चरागाहों के बाकी हिस्से को अपने पैरों से रौंदते हो? और निर्मल पानी[a] पीना ही काफ़ी नहीं है, कि तुम बचे हुए पानी को अपने पैरों से गंदला[b] करते हो?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “ठहरा हुआ पानी,” अर्थात ऐसा पानी जिसे न छेड़ने के कारण वह साफ़ हो गया हो।
    reason: lexical_alternative
  - marker: b
    text: या “मटमैला करते”; इब्रानी क्रिया पैरों से पानी को मथकर गंदला करने को दर्शाती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמְעַט מִכֶּם
  choice: क्या तुम्हारे लिए ... ही काफ़ी नहीं है
  rationale: यह स्वाभाविक हिन्दी में उस धिक्कारपूर्ण आलंकारिक प्रश्न को व्यक्त करता है कि उन्हें जो उत्तम भाग मिला है, वह पर्याप्त होना चाहिए था।
- source_word: הַמִּרְעֶה הַטּוֹב
  choice: अच्छी चराई
  rationale: मִרְעֶה चरने की जगह अथवा चरागाह को दर्शाता है; यह चयन भेड़ों और चरवाहों का रूपक बनाए रखता है।
- source_word: תִּרְעוּ
  choice: चरना
  rationale: רעה यहाँ पशुओं के चरने के अर्थ में है; हिन्दी में यह सीधा और सहज है।
- source_word: וְיֶתֶר מִרְעֵיכֶם
  choice: अपनी बाकी चराइयों को
  rationale: יֶתֶר का अर्थ बचा हुआ भाग है, और מִרְעֵיכֶם के बहुवचन रूप को ‘चराइयों’ से सुरक्षित रखा गया है।
- source_word: תִּרְמְסוּ בְּרַגְלֵיכֶם
  choice: अपने पैरों से रौंदते हो
  rationale: ‘रौंदना’ רמס की तीव्रता को व्यक्त करता है; ‘अपने पैरों से’ मूल पाठ में स्पष्ट रूप से आए साधन और उसकी पुनरावृत्ति को बनाए रखता है।
- source_word: וּמִשְׁקַע מַיִם
  choice: निर्मल पानी
  rationale: מִשְׁקַע ऐसे पानी को सूचित कर सकता है जो बैठा या अविचल रहने से साफ़ हो गया हो; ‘निर्मल पानी’ प्रसंग का व्यावहारिक अर्थ सहज हिन्दी में देता है।
- source_word: הַנּוֹתָרִים
  choice: बचे हुए पानी को
  rationale: रूप व्याकरणतः बहुवचन है और संदर्भ में पहले बताए पानी के शेष भाग की ओर संकेत करता है; हिन्दी में संज्ञा दोहराने से आशय स्पष्ट रहता है।
- source_word: תִּרְפֹּשׂוּן
  choice: गंदला करते हो
  rationale: क्रिया पैरों से पानी को मथकर कीचड़युक्त या मटमैला करने का बिंब देती है; ‘गंदला करना’ इस क्रिया को सजीव और सटीक रखता है।
