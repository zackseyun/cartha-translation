source:
  edition: WLC
  text: וְ/נָתַן֩ עֵ֨ץ הַ/שָּׂדֶ֜ה אֶת פִּרְי֗/וֹ וְ/הָ/אָ֨רֶץ֙ תִּתֵּ֣ן יְבוּלָ֔/הּ וְ/הָי֥וּ עַל אַדְמָתָ֖/ם לָ/בֶ֑טַח וְֽ/יָדְע֞וּ כִּי אֲנִ֣י יְהוָ֗ה בְּ/שִׁבְרִ/י֙ אֶת מֹט֣וֹת עֻלָּ֔/ם וְ/הִ֨צַּלְתִּ֔י/ם מִ/יַּ֖ד הָ/עֹבְדִ֥ים בָּ/הֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/034/027.yaml
  text: The tree of the field will give its fruit[a], and the land will give its produce, and they will be secure on their land. Then they will know that I am Yahweh, when I break the bars of their yoke and deliver them from the hand of those who enslaved them.
translation:
  language: hi
  text: मैदान के वृक्ष अपना फल देंगे, और भूमि अपनी उपज देगी। वे अपनी भूमि पर सुरक्षित रहेंगे। जब मैं उनके जुए की छड़ों को तोड़ूँगा और उन्हें उनके हाथ से छुड़ाऊँगा, जो उनसे दासों की तरह काम लेते हैं[a], तब वे जानेंगे कि मैं याहवे हूँ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “जो उनसे काम लेते हैं” अथवा “जिन्होंने उन्हें दास बना रखा है।” हिब्रू कृदन्त का अर्थ अधिक शाब्दिक रूप से उनसे काम या सेवा लेना हो सकता है; जुए को तोड़ने का प्रसंग दासता-सदृश उत्पीड़न का संकेत देता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: עֵץ הַשָּׂדֶה
  choice: मैदान के वृक्ष
  rationale: हिब्रू में एकवचन सामूहिक अर्थ में है। स्वाभाविक हिन्दी में बहुवचन इस सामूहिक आशय को स्पष्ट करता है।
- source_word: יְבוּלָהּ
  choice: अपनी उपज
  rationale: יְבוּל कृषि की पैदावार या उपज को दर्शाता है; ‘उपज’ सरल और सटीक आधुनिक हिन्दी है।
- source_word: וְהָיוּ עַל אַדְמָתָם לָבֶטַח
  choice: वे अपनी भूमि पर सुरक्षित रहेंगे
  rationale: यह अनुवाद על और לָבֶטַח को निकटता से रखता है और मूल में स्पष्ट रूप से न आए ‘निवास करना’ जैसे शब्द को नहीं जोड़ता।
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत वाचा-नाम को उपाधि से बदलने के बजाय देवनागरी लिप्यंतरण में रखा गया है।
- source_word: מֹטוֹת עֻלָּם
  choice: उनके जुए की छड़ों
  rationale: मूल रूपक में जुए की लकड़ी की छड़ें हैं; यह दमन और उसके टूटने की सजीव छवि बनाए रखता है।
- source_word: וְהִצַּלְתִּים מִיַּד
  choice: उन्हें ... के हाथ से छुड़ाऊँगा
  rationale: ‘हाथ से’ शक्ति या नियंत्रण का हिब्रू मुहावरा है और हिन्दी में भी सहज तथा बोधगम्य है।
- source_word: הָעֹבְדִים בָּהֶם
  choice: जो उनसे दासों की तरह काम कराते थे
  rationale: עבד का कृदन्त यहाँ ב के साथ शोषणपूर्ण श्रम कराने का भाव रखता है। निकटवर्ती जुए का रूपक दासता-सदृश उत्पीड़न की ओर संकेत करता है, जबकि यह शब्दांकन ‘दास बनाना’ को एकमात्र सम्भव अर्थ घोषित नहीं करता।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में चार अक्षरों वाला व्यक्तिगत ईश्वरीय नाम है। उसका लिप्यंतरण नाम और उपाधि के बीच भेद बनाए रखता है।
- issue: הָעֹבְדִים בָּהֶם में उत्पीड़न की तीव्रता
  choice: जो उनसे दासों की तरह काम कराते थे
  alternative: जो उनसे काम कराते थे; जिन्होंने उन्हें दास बना रखा था
  rationale: जुए को तोड़ने और छुड़ाने का प्रसंग कठोर अधीनता का संकेत देता है। चुना हुआ पाठ इस बल को व्यक्त करता है और कृदन्त की सम्भव व्यापकता को पादटिप्पणी में सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सहज रखी गई है। कृषि और जुए के मूल रूपक सुरक्षित हैं। वाक्यक्रम को हिन्दी में स्वाभाविक बनाने के लिए ‘जब ... तब’ संरचना अपनाई गई है।
