- source_word: דְבַר
  choice: वचन
  rationale: दְבַר־יְהוָה की स्थापित भविष्यद्वाणी-संबंधी अभिव्यक्ति के लिए ‘वचन’ सटीक और गरिमापूर्ण है तथा किसी विशिष्ट ईश्वरीय संदेश को दर्शाता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय लिप्यंतरित किया गया है।
- source_word: אֵלַי
  choice: मेरे पास
  rationale: इस संदर्भ में ईश्वरीय वचन के किसी व्यक्ति तक आने के लिए आधुनिक हिंदी की स्वाभाविक अभिव्यक्ति ‘मेरे पास पहुँचा’ है।
- source_word: לֵאמֹר
  choice: उन्होंने कहा
  rationale: यह infinitive construct आगे आने वाले प्रत्यक्ष कथन का परिचय देता है। हिंदी में ‘उन्होंने कहा’ स्वाभाविक है और आदरसूचक बहुवचन केवल सम्मानसूचक व्याकरण है, बहुदेववाद का संकेत नहीं।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ व्यक्तिगत ईश्वरीय नाम का सीधे प्रयोग करता है। ‘याहवे’ उसे उपाधि से बदले बिना सुरक्षित रखता है; ‘यहोवा’ एक वैकल्पिक पारंपरिक स्वरूप है।
