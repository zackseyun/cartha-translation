source:
  edition: WLC
  text: וְ/אַתֵּ֥ן צֹאנִ֛/י צֹ֥אן מַרְעִיתִ֖/י אָדָ֣ם אַתֶּ֑ם אֲנִי֙ אֱלֹ֣הֵי/כֶ֔ם נְאֻ֖ם אֲדֹנָ֥/י יְהוִֽה׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/034/031.yaml
  text: And you[a], my flock, the flock of my pasture—you are men, and I am your God, declares the Lord GOD.
translation:
  language: hi
  text: और तुम, मेरी भेड़ें, मेरी चरागाह की भेड़ें—तुम मनुष्य[a] हो; और मैं तुम्हारा परमेश्वर हूँ—प्रभु यहोवा की यही वाणी है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “मनुष्यजाति” अथवा “मानव प्राणी।” इब्रानी शब्द ‘आदाम’ सामान्य रूप से मानवता को सूचित कर सकता है; यहाँ यह “भेड़ों” के रूपक के विपरीत उनकी वास्तविक मानवीय पहचान बताता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַתֵּן
  choice: और तुम
  rationale: संयोजक के साथ आगे रखा गया सर्वनाम सीधे संबोधन और बल को व्यक्त करता है। हिन्दी में “और तुम” इसे बिना अतिरिक्त व्याख्या जोड़े स्वाभाविक रूप से बनाए रखता है।
- source_word: צֹאנִי
  choice: मेरी भेड़ें
  rationale: צֹאן सामूहिक रूप से भेड़ों या झुंड को दर्शाता है। हिन्दी में “मेरी भेड़ें” चरवाहे के रूपक को स्पष्ट और स्वाभाविक रखता है।
- source_word: צֹאן מַרְעִיתִי
  choice: मेरी चरागाह की भेड़ें
  rationale: यह पहले पदबंध की समानाधिकरणात्मक पुनरुक्ति है। “चरागाह” मूल चरवाही-बिंब को स्पष्ट रूप से सुरक्षित रखता है।
- source_word: אָדָם
  choice: मनुष्य
  rationale: इब्रानी शब्द यहाँ भेड़ों के रूपक के विपरीत संबोधित लोगों की वास्तविक मानवीय पहचान बताता है। “मनुष्य” एकवचन सामूहिक अर्थ और वाक्य की संक्षिप्त, बलपूर्ण शैली दोनों को बनाए रखता है।
- source_word: אֲנִי אֱלֹהֵיכֶם
  choice: मैं तुम्हारा परमेश्वर हूँ
  rationale: यह सम्बन्धसूचक प्रत्यय और वाचाहीन इब्रानी वर्तमान-वाक्य को सहज हिन्दी में व्यक्त करता है।
- source_word: נְאֻם
  choice: यही वाणी है
  rationale: भविष्यद्वक्ताओं में प्रयुक्त प्रामाणिक उद्घोषणा-सूत्र को गरिमापूर्ण और प्रचलित हिन्दी में व्यक्त करता है।
- source_word: אֲדֹנָי יְהוִה
  choice: प्रभु यहोवा
  rationale: संयुक्त ईश्वरीय उपाधि में אֲדֹנָי को “प्रभु” और चार-अक्षरीय ईश्वरीय नाम को “यहोवा” के रूप में अलग-अलग सुरक्षित रखा गया है।
theological_decisions:
- issue: चरवाही के रूपक में אָדָם का अर्थ
  choice: मनुष्य
  alternative: मनुष्यजाति / मानव प्राणी
  rationale: यह पद रूपक को समाप्त करते हुए स्पष्ट करता है कि परमेश्वर की “भेड़ें” वास्तव में मनुष्य हैं। “मनुष्य” मूल के सामूहिक और लिंग-व्यापक प्रयोग की सम्भावना को खुला रखता है तथा अनावश्यक रूप से केवल पुरुषों तक अर्थ सीमित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। समानाधिकरणात्मक पुनरुक्ति और चरवाही-बिंब सुरक्षित हैं; अर्धविराम पद की दो समानांतर घोषणाओं को स्पष्ट करता है।
