  text: חַי אָ֜נִי נְאֻ֣ם אֲדֹנָ֣/י יְהוִ֗ה אִם לֹ֣א יַ֣עַן הֱיֽוֹת צֹאנִ֣/י לָ/בַ֡ז וַ/תִּֽהְיֶינָה֩ צֹאנִ֨/י לְ/אָכְלָ֜ה לְ/כָל חַיַּ֤ת הַ/שָּׂדֶה֙ מֵ/אֵ֣ין רֹעֶ֔ה וְ/לֹֽא דָרְשׁ֥וּ רֹעַ֖/י אֶת צֹאנִ֑/י וַ/יִּרְע֤וּ הָֽ/רֹעִים֙ אוֹתָ֔/ם וְ/אֶת צֹאנִ֖/י לֹ֥א רָעֽוּ־׀־־׀־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/034/008.yaml
  text: As I live[a], declares the Lord GOD, surely because my flock has become plunder and my flock has become food for every wild beast of the field, since there was no shepherd, and my shepherds did not seek my flock[b], but the shepherds fed themselves and did not feed my flock—
translation:
  language: hi
  text: “मेरे जीवन की शपथ[a]—प्रभु यहोवा की यह घोषणा है—निश्चय ही, क्योंकि मेरी भेड़ें लूट का माल बन गईं और मैदान के हर जंगली पशु का आहार हो गईं, क्योंकि कोई चरवाहा न था; और मेरे चरवाहों ने मेरी भेड़ों को ढूँढ़ा नहीं, बल्कि चरवाहों ने अपना ही पालन-पोषण किया[b] और मेरी भेड़ों को नहीं चराया—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक अर्थ: “मैं जीवित हूँ।” यह परमेश्वर की गंभीर आत्म-शपथ का सूत्र है।'
    reason: idiom_explanation
  - marker: b
    text: शाब्दिक रूप से, “चरवाहों ने अपने आपको चराया।” आशय है कि उन्होंने झुंड के बजाय अपने ही हित साधे।
    reason: lexical_alternative
lexical_decisions:
- source_word: חַי אָ֜נִי
  choice: मेरे जीवन की शपथ
  rationale: यह भविष्यवाणी में प्रयुक्त परमेश्वर की गंभीर आत्म-शपथ है; यह हिंदी में उसके शपथात्मक बल को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: प्रभु यहोवा की घोषणा है
  rationale: נְאֻם को औपचारिक भविष्यद्वाणी-सूत्र के रूप में 'घोषणा है' और संयुक्त उपाधि में दिव्य नाम को 'यहोवा' रखा गया है।
- source_word: אִם לֹא
  choice: निश्चय ही
  rationale: आत्म-शपथ के बाद यह शाब्दिक शर्त नहीं, बल्कि कथन को दृढ़ करने वाला शपथात्मक प्रयोग है।
- source_word: צֹאנִי
  choice: मेरी भेड़ें
  rationale: संदर्भ में यह छोटे पशुओं के झुंड और रूपकतः परमेश्वर की प्रजा को दर्शाता है; हिंदी में 'भेड़ें' आगे के चराने वाले रूपक को स्पष्ट रखता है।
- source_word: לָבַז
  choice: लूट का माल
  rationale: यह बलपूर्वक छीनी गई वस्तु को दर्शाता है; अगले खंड के खाने के बिंब से इसे अलग रखता है।
- source_word: לְאָכְלָה לְכָל חַיַּת הַשָּׂדֶה
  choice: मैदान के हर जंगली पशु का आहार
  rationale: वाक्यांश पशुओं द्वारा निगल लिए जाने की असुरक्षा व्यक्त करता है और मूल के ग्रामीण बिंब को बनाए रखता है।
- source_word: מֵאֵין רֹעֶה
  choice: क्योंकि कोई चरवाहा न था
  rationale: यह झुंड की दुर्दशा का कारण या परिस्थिति बताता है।
- source_word: וְלֹא דָרְשׁוּ רֹעַי אֶת צֹאנִי
  choice: मेरे चरवाहों ने मेरी भेड़ों की खोज नहीं की
  rationale: דרשׁ के मूल 'खोजना/ढूँढ़ना' अर्थ को रखा गया है, बिना उसे व्यापक 'देखभाल करना' में बदलने के।
- source_word: וַיִּרְעוּ הָרֹעִים אוֹתָם
  choice: चरवाहों ने अपना ही पेट भरा
  rationale: शाब्दिक रूप में चरवाहों द्वारा स्वयं को चराने/खिलाने का असामान्य मुहावरा है; हिंदी वाक्य उनके स्वार्थ को स्पष्ट करता है, जबकि पादटिप्पणी अधिक शाब्दिक विकल्प सुरक्षित रखती है।
- source_word: וְאֶת צֹאנִי לֹא רָעוּ
  choice: मेरी भेड़ों को नहीं चराया
  rationale: רעה की चरवाहे-संबंधी क्रिया को सीधे रखा गया है और स्वयं को खिलाने के साथ मूल विरोध बनाए रखा गया है।
theological_decisions:
- issue: संयुक्त उपाधि אֲדֹנָי יְהוִה में दिव्य नाम का अनुवाद
  choice: प्रभु यहोवा
  alternative: प्रभु याहवे / परमेश्वर यहोवा
  rationale: मूल में वाचा-संबंधी व्यक्तिगत नाम स्पष्ट है। आधुनिक हिंदी बाइबलीय प्रयोग में परिचित 'यहोवा' उसे सामान्य उपाधि में विलीन किए बिना सुरक्षित रखता है।
- issue: चरवाहों का आशय
  choice: पद में केवल 'मेरे चरवाहे'
  alternative: राजा, अगुए या धार्मिक अधिकारी जोड़ना
  rationale: व्यापक संदर्भ अगुवों पर अभियोग इंगित करता है, पर इस पद में उनकी सटीक संस्थागत पहचान नहीं बताई गई; इसलिए अनुवाद मूल रूपक को खुला रखता है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट हिंदी। पद मूल की लंबी शपथात्मक-वाक्य संरचना और अंत के अधूरे डैश को बनाए रखता है, क्योंकि वाक्य अगले पद में आगे बढ़ता है।
