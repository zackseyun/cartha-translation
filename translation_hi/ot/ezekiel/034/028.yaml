source:
  edition: WLC
  text: וְ/לֹא יִהְי֨וּ ע֥וֹד בַּז֙ לַ/גּוֹיִ֔ם וְ/חַיַּ֥ת הָ/אָ֖רֶץ לֹ֣א תֹאכְלֵ֑/ם וְ/יָשְׁב֥וּ לָ/בֶ֖טַח וְ/אֵ֥ין מַחֲרִֽיד־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/034/028.yaml
  text: They will no longer be plunder for the nations[a], and the wild animals of the land will not devour them. They will dwell securely[c][b], with no one to make them afraid.
translation:
  language: hi
  text: वे फिर कभी जातियों के लिए लूट न बनेंगे,[a] और देश के जंगली जानवर[b] उन्हें नहीं खाएँगे। वे निश्चिंत होकर बसे रहेंगे,[c] और कोई उन्हें भयभीत न करेगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जातियों का शिकार न बनेंगे।”
    reason: lexical_alternative
  - marker: b
    text: या, “धरती के जंगली पशु।”
    reason: lexical_alternative
  - marker: c
    text: या, “वे सुरक्षा में बसे रहेंगे, और कोई उन्हें भयभीत न करेगा।”
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּז
  choice: लूट
  rationale: यह संज्ञा बलपूर्वक छीनी गई वस्तु या लूट को दर्शाती है। यहाँ आसपास की जातियों द्वारा इस्राएल के शोषण का राजनीतिक भाव प्रमुख है; अगले खंड में पशुओं द्वारा खाए जाने की छवि अलग से आती है।
- source_word: לַגּוֹיִם
  choice: जातियों के लिए
  rationale: גּוֹיִם यहाँ आसपास के लोगों या राष्ट्रों को दर्शाता है, न कि किसी बाद के तकनीकी धार्मिक अर्थ को। בַּז के साथ यह हिंदी में स्वाभाविक है।
- source_word: חַיַּת הָאָרֶץ
  choice: देश के जंगली जानवर
  rationale: यह समास जंगली पशुओं को दर्शाता है। 'देश के जंगली जानवर' ठोस खतरे की छवि रखता है और आधुनिक हिंदी में सहज है।
- source_word: תֹאכְלֵם
  choice: उन्हें नहीं खाएँगे
  rationale: मूल क्रिया का सामान्य अर्थ 'खाना' है। संदर्भ में इसका आशय हिंसक पशुओं द्वारा भक्षण करना है; सीधा हिंदी रूप मूल की सादगी और तीव्रता दोनों रखता है।
- source_word: וְיָשְׁבוּ
  choice: वे ... बसे रहेंगे
  rationale: ישב बैठने, रहने या बसने को दर्शाता है। 'बसे रहेंगे' स्थिर और सुरक्षित निवास का भाव स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: לָבֶטַח
  choice: निडर होकर
  rationale: यह शब्द सुरक्षा और बेखटके रहने का भाव देता है। अगले वाक्य में भयभीत करने वाले के न होने से जुड़कर 'निडर होकर' हिंदी में प्रवाहपूर्ण है; 'सुरक्षित होकर' भी संभव है।
- source_word: וְאֵין מַחֲרִיד
  choice: और कोई उन्हें भयभीत न करेगा
  rationale: हिफ़ील कृदंत भय या आतंक उत्पन्न करने वाले कर्ता को दर्शाता है। यह रूप व्यक्तिगत कर्ता की संभावना बनाए रखता है और हिंदी में स्पष्ट है।
- source_word: עוֹד
  choice: फिर कभी ... न
  rationale: नकार के साथ עוֹד पहले की दशा के समाप्त हो जाने को दर्शाता है। 'फिर कभी ... न' इस आश्वासन को सहज आधुनिक हिंदी में व्यक्त करता है।
theological_decisions:
- issue: प्रतिज्ञात सुरक्षा का स्वरूप
  choice: पद को पुनर्स्थापना और वास्तविक सुरक्षा की ठोस प्रतिज्ञा के रूप में प्रस्तुत किया गया है, बिना यह तय किए कि खतरे केवल शाब्दिक, केवल प्रतीकात्मक या अंतिम युग से ही संबंधित हैं।
  alternative: जातियों और जंगली पशुओं को पूरी तरह राजनीतिक शत्रुओं के प्रतीक मानना, या पद को केवल किसी विशिष्ट सहस्राब्दी अथवा अंतकालीन योजना से जोड़ना।
  rationale: इब्रानी पाठ अंतरराष्ट्रीय लूट और जंगली पशुओं के खतरे दोनों को सीधे रखता है। अनुवाद दोनों छवियों को बनाए रखता है और पाठ से आगे कोई संकीर्ण धर्मवैज्ञानिक व्यवस्था आरोपित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण, सहज और सामान्य पाठक के लिए स्पष्ट शैली। 'बसे रहेंगे' स्थिर निवास का भाव रखता है; 'निडर होकर' और अंतिम खंड मिलकर सुरक्षा तथा भय के अंत को स्वाभाविक ढंग से व्यक्त करते हैं।
