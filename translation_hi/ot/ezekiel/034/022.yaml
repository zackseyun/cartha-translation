id: EZK.34.22
reference: Ezekiel 34:22
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/הוֹשַׁעְתִּ֣י לְ/צֹאנִ֔/י וְ/לֹֽא תִהְיֶ֥ינָה ע֖וֹד לָ/בַ֑ז וְ/שָׁ֣פַטְתִּ֔י בֵּ֥ין שֶׂ֖ה לָ/שֶֽׂה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/034/022.yaml
  text: I will save my flock[a], and they will no longer be prey[b], and I will judge between sheep and sheep.
translation:
  language: hi
  text: मैं अपने झुंड को बचाऊँगा, और वे फिर लूट का माल नहीं होंगे[a]। मैं एक भेड़ और दूसरी भेड़ के बीच न्याय करूँगा[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, ‘वे फिर लूट के लिए नहीं होंगी’; इसका अनुवाद ‘वे फिर लूट नहीं बनेंगी’ भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में, ‘भेड़ और भेड़ के बीच,’ अर्थात् झुंड के भीतर एक भेड़ और दूसरी भेड़ के बीच।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוֹשַׁעְתִּי
  choice: मैं ... बचाऊँगा
  rationale: ישׁע के हिफ़ील रूप में यहाँ खतरे और उत्पीड़न से छुड़ाने का भाव है। ‘बचाऊँगा’ आधुनिक हिन्दी में स्वाभाविक है और परमेश्वर द्वारा उद्धार किए जाने के अर्थ-भार को बनाए रखता है।
- source_word: לְצֹאנִי
  choice: अपने झुंड को
  rationale: צֹאן छोटे पालतू पशुओं, विशेषकर भेड़-बकरियों, के समूह को दर्शाता है। चरवाहे के इस प्रसंग में ‘झुंड’ स्वाभाविक सामूहिक संज्ञा है और प्रथम पुरुष संबंध ‘अपने’ से स्पष्ट होता है।
- source_word: וְלֹא תִהְיֶינָה עוֹד לָבַז
  choice: और वे फिर लूट का माल नहीं होंगे
  rationale: לָבַז का मूल भाव ‘लूट के लिए/लूट का माल’ है। यह अनुवाद झुंड की असुरक्षा और दूसरों द्वारा उसका शोषण किए जाने की छवि को बनाए रखता है। बहुवचन ‘वे’ झुंड के पशुओं को सामूहिक रूप से संदर्भित करता है।
- source_word: וְשָׁפַטְתִּי
  choice: मैं ... न्याय करूँगा
  rationale: שׁפט यहाँ झुंड के सदस्यों के बीच निर्णय करने की परमेश्वर की न्यायिक कार्रवाई बताता है। ‘न्याय करूँगा’ उसके नैतिक और न्यायिक बल को सुरक्षित रखता है।
- source_word: בֵּין שֶׂה לָשֶׂה
  choice: एक भेड़ और दूसरी भेड़ के बीच
  rationale: इब्रानी में एकवचन का वितरणात्मक प्रयोग, शाब्दिक रूप से ‘भेड़ और भेड़ के बीच’, झुंड के अलग-अलग सदस्यों के बीच न्याय को दर्शाता है। हिन्दी में ‘एक भेड़ और दूसरी भेड़’ वही अर्थ स्वाभाविक ढंग से व्यक्त करता है।
theological_decisions:
- issue: चरवाहे के रूपक में परमेश्वर द्वारा उद्धार
  choice: मैं अपने झुंड को बचाऊँगा
  alternative: मैं अपने झुंड को छुड़ाऊँगा
  rationale: वचन में परमेश्वर स्वयं अपने लोगों को बचाने वाला है। ‘बचाऊँगा’ तात्कालिक रक्षा और व्यापक उद्धार—दोनों की प्रतिध्वनि रखता है, पर इस पद से परे कोई विशिष्ट धर्मसैद्धांतिक अर्थ नहीं जोड़ता।
- issue: बचाए गए झुंड के भीतर परमेश्वर का न्याय
  choice: मैं एक भेड़ और दूसरी भेड़ के बीच न्याय करूँगा
  alternative: मैं भेड़ और भेड़ के बीच न्याय करूँगा
  rationale: परमेश्वर केवल बाहर के लुटेरों से झुंड को नहीं बचाता, बल्कि झुंड के सदस्यों के बीच भी न्याय करता है। यह अनुवाद उद्धार और समुदाय के भीतर न्याय—दोनों के तनाव को बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘लूट का माल’ मूल के ठोस अर्थ को बनाए रखता है, और ‘एक भेड़ और दूसरी भेड़’ इब्रानी वितरणात्मक वाक्यांश का स्वाभाविक हिन्दी रूप है।
