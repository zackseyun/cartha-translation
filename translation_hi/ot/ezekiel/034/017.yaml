reference: Ezekiel 34:17
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/אַתֵּ֣נָה צֹאנִ֔/י כֹּ֥ה אָמַ֖ר אֲדֹנָ֣/י יְהוִ֑ה הִנְ/נִ֤י שֹׁפֵט֙ בֵּֽין שֶׂ֣ה לָ/שֶׂ֔ה לָ/אֵילִ֖ים וְ/לָ/עַתּוּדִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/034/017.yaml
  text: 'And as for you[a], my flock, thus says the Lord GOD: Behold, I am judging between sheep and sheep, between the rams and the male goats.'
translation:
  language: hi
  text: 'और तुम, मेरी भेड़ो, प्रभु याहवे यों कहता है: देखो, मैं एक भेड़ और दूसरी भेड़ के बीच, और मेढ़ों और बकरों के बीच न्याय कर रहा हूँ।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאַתֵּנָה צֹאנִי
  choice: और तुम, मेरी भेड़ो
  rationale: स्त्रीलिंग बहुवचन स्वतंत्र सर्वनाम संबोधन में बल और विषय-परिवर्तन दिखाता है; सामूहिक צֹאן को हिन्दी में स्वाभाविक प्रत्यक्ष संबोधन ‘मेरी भेड़ो’ से व्यक्त किया गया है।
- source_word: כֹּה אָמַר
  choice: यों कहता है
  rationale: यह नबूवत का प्रचलित संदेशवाहक सूत्र है; ‘यों कहता है’ औपचारिक निकटता और गरिमापूर्ण स्वाभाविकता दोनों रखता है।
- source_word: אֲדֹנָי יְהוִה
  choice: प्रभु यहोवा
  rationale: אֲדֹנָי को ‘प्रभु’ और परमेश्वर के विशिष्ट नाम יהוה को प्रचलित हिन्दी रूप ‘यहोवा’ से अलग-अलग व्यक्त किया गया है।
- source_word: הִנְנִי
  choice: देखो, मैं
  rationale: यह वक्ता की बलपूर्ण आत्म-प्रस्तुति है; ‘देखो’ भविष्यद्वक्ताई घोषणा की गंभीरता बनाए रखता है।
- source_word: שֹׁפֵט
  choice: न्याय कर रहा हूँ
  rationale: हिब्रू कृदन्त जारी अथवा आसन्न क्रिया दिखा सकता है; वर्तमान प्रगतिशील रूप उस पहलू को सुरक्षित रखता है।
- source_word: בֵּין שֶׂה לָשֶׂה
  choice: एक भेड़ और दूसरी भेड़ के बीच
  rationale: शाब्दिक पुनरुक्ति का आशय झुंड के भीतर अलग-अलग पशुओं के बीच भेद करके न्याय करना है; हिन्दी में यह वितरणात्मक अर्थ स्पष्ट और स्वाभाविक है।
- source_word: לָאֵילִים וְלָעַתּוּדִים
  choice: मेढ़ों और बकरों के बीच
  rationale: दोनों शब्द नर पशुओं—मेढ़ों और नर बकरों—को सूचित करते हैं; हिन्दी में ‘बकरों’ स्वयं पुल्लिंग है, इसलिए अलग से ‘नर’ अनावश्यक है।
theological_decisions:
- issue: אֲדֹנָי יְהוִה में परमेश्वर के नाम का अनुवाद
  choice: प्रभु यहोवा
  alternative: प्रभु याहवे / प्रभु परमेश्वर
  rationale: मूल पाठ में उपाधि और विशिष्ट नाम दोनों हैं। ‘प्रभु यहोवा’ दोनों को अलग रखता है और हिन्दी बाइबलीय प्रयोग में पहचाना जाने वाला रूप है; सामान्य पद ‘परमेश्वर’ नाम की विशिष्टता को कम कर देता।
- issue: झुंड के भीतर न्याय का स्वरूप
  choice: एक भेड़ और दूसरी भेड़ के बीच
  alternative: भेड़ और भेड़ के बीच
  rationale: पाठ केवल चरवाहों के विरुद्ध न्याय नहीं, स्वयं झुंड के सदस्यों के बीच न्याय की घोषणा करता है। वितरणात्मक हिन्दी इस तनाव को बिना अतिरिक्त व्याख्या के बनाए रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण नबूवताई शैली रखी गई है। वाक्यरचना मूल के बलयुक्त संबोधन और ‘देखो’ वाली घोषणा को बनाए रखते हुए साधारण पाठकों के लिए सहज है।
