  alternative: इस्राएल के अगुवे
  rationale: इस पद की पूरी फटकार चरवाहे और झुंड के विस्तृत रूपक पर आधारित है। उसके आशय को समझाने के लिए रूपक हटाना साहित्यिक और धर्मवैचारिक तनाव को कम कर देता।
- issue: स्वयं की चरवाही करने का कथन
  choice: रूपक को स्पष्ट पर अक्षुण्ण रखते हुए ‘स्वयं अपनी ही चरवाही’
  alternative: अपने ही को खिलाते रहे / अपना ही पेट भरते रहे
  rationale: मूल वाक्य स्वार्थी नेतृत्व की निन्दा करता है, पर वही चरवाही-वाला क्रियापद दोहराता है। मुख्य पाठ में रूपक रखा गया है और अधिक व्याख्यात्मक अर्थ पादटिप्पणी में दिया गया है।
