  text: 'Son of man[a], prophesy against the shepherds of Israel; prophesy and say to them, to the shepherds[b], ‘Thus says the Lord GOD: Woe to the shepherds of Israel who have been shepherding themselves! Should not the shepherds shepherd the flock?’'
translation:
  language: hi
  text: '“हे मनुष्य के पुत्र, इस्राएल के चरवाहों के विरुद्ध भविष्यवाणी कर। भविष्यवाणी कर और उन चरवाहों से कह, ‘प्रभु याहवे यों कहता है: इस्राएल के उन चरवाहों पर हाय, जो अपने ही को चराते रहे हैं![a] क्या चरवाहों को झुंड[b] नहीं चराना चाहिए?’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात वे झुंड की देखभाल करने के बजाय अपना ही लाभ देखते रहे। इब्रानी में यहाँ भी वही ‘चराना/चरवाही करना’ क्रिया है जो इस पद में बार-बार आती है; इसका अनुवाद ‘जो अपना ही पेट भरते रहे हैं’ भी किया जा सकता है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी शब्द सामूहिक रूप से भेड़-बकरियों को दर्शाता है; इसका अनुवाद ‘भेड़-बकरियों के झुंड’ भी हो सकता है।
    reason: lexical_alternative
