- source_word: אֲשֶׁר הָיוּ רֹעִים אוֹתָם
  choice: जो स्वयं अपनी ही चरवाही करते रहे हैं
  rationale: बहुवचन कर्मवाचक सर्वनाम का संकेत उन्हीं चरवाहों की ओर लौटता है। ‘चरवाही’ दोहराने से मूल रעה की शब्द-क्रीड़ा और उनके स्वार्थी आचरण दोनों बने रहते हैं।
