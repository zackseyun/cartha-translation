- source_word: רוֹעֵי יִשְׂרָאֵל / לָרֹעִים / הָרֹעִים
  choice: इस्राएल के चरवाहे / उन चरवाहों / चरवाहों
  rationale: ‘अगुवे’ कहकर रूपक की व्याख्या कर देने के बजाय चरवाहे और झुंड की मूल छवि तथा पूरे वाक्य का शब्द-सामंजस्य सुरक्षित रखा गया है।
- source_word: כֹּה אָמַר אֲדֹנָי יְהוִה
  choice: प्रभु यहोवा यों कहता है
  rationale: אֲדֹנָי को ‘प्रभु’ और परमेश्वर के निजी नाम יהוה को ‘यहोवा’ के रूप में अलग-अलग व्यक्त किया गया है। ‘यों कहता है’ भविष्यद्वक्ताओं की उद्घोषणा का स्वाभाविक हिन्दी रूप है।
