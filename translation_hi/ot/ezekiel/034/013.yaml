  text: וְ/הוֹצֵאתִ֣י/ם מִן הָ/עַמִּ֗ים וְ/קִבַּצְתִּי/ם֙ מִן הָ֣/אֲרָצ֔וֹת וַ/הֲבִיאֹתִ֖י/ם אֶל אַדְמָתָ֑/ם וּ/רְעִיתִי/ם֙ אֶל הָרֵ֣י יִשְׂרָאֵ֔ל בָּ/אֲפִיקִ֕ים וּ/בְ/כֹ֖ל מוֹשְׁבֵ֥י הָ/אָֽרֶץ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/034/013.yaml
  text: And I will bring them out from the peoples[a], and gather them from the lands, and bring them into their own land; and I will pasture them on the mountains of Israel, by the streams, and in all the inhabited places of the land.
translation:
  language: hi
  text: मैं उन्हें जातियों में से निकाल लाऊँगा, उन्हें अलग-अलग देशों से इकट्ठा करूँगा और उनकी अपनी भूमि में ले आऊँगा। मैं उन्हें इस्राएल के पहाड़ों पर, जलधाराओं के पास[a] और देश के सभी बसे हुए स्थानों में चराऊँगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “नालों में,” “घाटियों में,” अथवा “धाराओं के पाटों में।” इब्रानी शब्द जलधाराओं के मार्गों, नालों या घाटियों को भी सूचित कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוֹצֵאתִים
  choice: मैं उन्हें ... निकाल लाऊँगा
  rationale: हिफ़िल रूप का कारणवाचक अर्थ व्यक्त करता है और निर्गमन-सदृश भाव को बिना विस्तार दिए बनाए रखता है।
- source_word: מִן הָעַמִּים
  choice: जाति-जाति के लोगों के बीच से
  rationale: बहुवचन עַמִּים विभिन्न जनसमूहों को सूचित करता है; यह स्वाभाविक हिन्दी है और अगले पदबंध 'अलग-अलग देशों' से भेद बनाए रखती है।
- source_word: וְקִבַּצְתִּים
  choice: उन्हें ... इकट्ठा करूँगा
  rationale: קבץ बिखरे हुए लोगों को फिर एकत्र करने के लिए प्रयुक्त सामान्य क्रिया है।
- source_word: מִן הָאֲרָצוֹת
  choice: अलग-अलग देशों से
  rationale: यहाँ אֲרָצוֹת उन अनेक भूभागों या देशों को दर्शाता है जहाँ लोग बिखरे हैं; 'अलग-अलग' बहुवचन को सहज हिन्दी में स्पष्ट करता है।
- source_word: וַהֲבִיאֹתִים אֶל אַדְמָתָם
  choice: उनकी अपनी भूमि में ले आऊँगा
  rationale: בוא का हिफ़िल रूप 'ले आना' है और possessive suffix सहित אַדְמָתָם को 'उनकी अपनी भूमि' कहना पुनर्स्थापना का स्पष्ट अर्थ सुरक्षित रखता है।
- source_word: וּרְעִיתִים
  choice: मैं उन्हें ... चराऊँगा
  rationale: רעה के चराने/चरागाह देने के अर्थ को प्रत्यक्ष रखता है और पूरे अध्याय की चरवाहे की छवि से मेल खाता है।
- source_word: אֶל הָרֵי יִשְׂרָאֵל
  choice: इस्राएल के पहाड़ों पर
  rationale: चराने की क्रिया के साथ אֶל यहाँ उस क्षेत्र को बताता है जहाँ झुंड चराया जाएगा; हिन्दी में 'पर' स्वाभाविक है।
- source_word: בָּאֲפִיקִים
  choice: जलधाराओं के पास
  rationale: אֲפִיקִים जलमार्गों, नालों, घाटियों या धारा-पात्रों को सूचित कर सकता है। pastoral प्रसंग में 'जलधाराओं के पास' सहज है, जबकि वैकल्पिक स्थलाकृतिक अर्थ पादटिप्पणी में सुरक्षित हैं।
- source_word: וּבְכֹל מוֹשְׁבֵי הָאָרֶץ
  choice: देश के सभी बसे हुए स्थानों में
  rationale: מוֹשְׁבֵי הָאָרֶץ भूमि के निवास-स्थानों को व्यापक रूप से दर्शाता है; यह अनुवाद अर्थ को किसी विशेष प्रकार की बस्ती तक सीमित नहीं करता।
theological_decisions:
- issue: אַדְמָתָם में पुनर्स्थापना और संबंधसूचक प्रत्यय
  choice: उनकी अपनी भूमि
  alternative: उनकी भूमि
  rationale: संबंधसूचक प्रत्यय उस भूमि को उन्हीं की भूमि के रूप में प्रस्तुत करता है। 'अपनी' इस वापसी के भाव को स्वाभाविक हिन्दी में स्पष्ट करती है, पर पाठ से परे कोई बाद की धर्मसैद्धांतिक धारणा नहीं जोड़ती।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। चरवाहे और झुंड की मूल रूपक-छवि के कारण 'चराऊँगा' चुना गया है। मुख्य पाठ में [a] उसी अस्पष्ट इब्रानी स्थलाकृतिक शब्द के बाद रखा गया है जिसकी व्याख्या पादटिप्पणी करती है।
