base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/034/020.yaml
  text: 'Therefore thus says the Lord GOD to them: Behold[a], I myself will judge between the fat sheep and the lean sheep.'
translation:
  language: hi
  text: 'इसलिए प्रभु याहवे उनसे यों कहते हैं: “देखो, मैं स्वयं मोटी भेड़ और दुबली भेड़ के बीच न्याय करूँगा।”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इब्रानी में दोनों संज्ञाएँ एकवचन हैं: “एक मोटी भेड़ और एक दुबली भेड़।” यहाँ वे संभवतः झुंड के दो वर्गों का प्रतिनिधित्व करती हैं।'
    reason: प्रतिनिधिक एकवचन की वास्तविक व्याकरणिक विशेषता और उसके संभावित सामूहिक अर्थ को स्पष्ट करना।
lexical_decisions:
- source_word: לָכֵן
  choice: इसलिए
  rationale: यह पिछले आरोप के परिणाम को प्रस्तुत करने वाला स्वाभाविक और स्पष्ट निष्कर्षसूचक शब्द है।
- source_word: כֹּה אָמַר
  choice: यों कहते हैं
  rationale: यह नबी-संदेश की पारंपरिक घोषणा-शैली को गरिमापूर्ण और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: אֲדֹנָי יְהוִה
  choice: प्रभु याहवे
  rationale: 'दोनों इब्रानी तत्वों को अलग-अलग बनाए रखता है: אֲדֹנָי के लिए ‘प्रभु’ और परमेश्वर के व्यक्तिगत नाम יְהוִה के लिए ‘याहवे’।'
- source_word: אֲלֵיהֶם
  choice: उनसे
  rationale: यहाँ पूर्वसर्ग उन लोगों को दर्शाता है जिन्हें यह वचन संबोधित है; हिन्दी में ‘उनसे ... कहते हैं’ स्वाभाविक है।
- source_word: הִנְנִי אָנִי
  choice: देखो, मैं स्वयं
  rationale: ‘देखो’ ध्यान आकर्षित करने वाली הִנְנִי की शक्ति को और ‘मैं स्वयं’ दोहरे प्रथम-पुरुष बलाघात को व्यक्त करता है।
- source_word: וְשָׁפַטְתִּי
  choice: न्याय करूँगा
  rationale: यहाँ क्रिया झुंड के दो वर्गों के बीच निर्णय और भेद करने के न्यायिक अर्थ में है।
- source_word: שֶׂה בִרְיָה ... שֶׂה רָזָה
  choice: मोटी भेड़ और दुबली भेड़
  rationale: एकवचन रूपों और मोटी-दुबली की प्रत्यक्ष चरवाही छवि को बनाए रखता है; ये एकवचन संभवतः झुंड के दो वर्गों के प्रतिनिधि हैं।
theological_decisions:
- issue: संयुक्त उपाधि אֲדֹנָי יְהוִה में परमेश्वर के नाम का अनुवाद
  choice: प्रभु याहवे
  alternative: प्रभु परमेश्वर
  rationale: मूल पाठ में उपाधि और व्यक्तिगत नाम दोनों उपस्थित हैं। ‘प्रभु याहवे’ इस भेद को बनाए रखता है और किसी विशेष व्याख्यात्मक धर्म-सिद्धांत को पाठ में नहीं जोड़ता।
- issue: न्याय का स्वरूप
  choice: दो प्रकार की भेड़ों के बीच न्याय
  alternative: दुबली भेड़ों को निर्दोष ठहराना
  rationale: שׁפט निर्णय, शासन या पक्ष-निर्णय का अर्थ दे सकता है; इस पद में केवल ‘न्याय’ कहना मूल की व्यापकता और अगले संदर्भ में खुलने वाले आशय को सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की है, पर नबी-संदेश की गरिमा बनाए रखने के लिए ‘यों कहते हैं’ और प्रत्यक्ष वचन का प्रयोग किया गया है। वाक्य सरल रखा गया है और मूल के ‘मैं स्वयं’ वाले बलाघात को सुरक्षित रखा गया है।
