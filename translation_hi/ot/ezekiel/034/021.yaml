  text: क्योंकि तुम अपनी बगल और कंधे से धक्का देते हो और अपने सींगों से सभी दुर्बलों को तब तक सींग मारते हो, जब तक तुम उन्हें बाहर तितर-बितर नहीं कर देते,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּצַד
  choice: पाँव से
  rationale: इस पशु-रूपक में शब्द संभवतः शरीर के पार्श्व या पाँव से धक्का देने का संकेत करता है; निकटवर्ती ‘कंधे’ के साथ स्वाभाविक हिन्दी में ‘पाँव’ चुना गया, जबकि मूल की शारीरिक छवि बनी रहती है।
- source_word: תֶּהְדֹּפוּ
  choice: धक्का देते हो
  rationale: क्रिया का अर्थ धकेलना या ठेलना है; वर्तमान आदतन व्यवहार को हिन्दी में सहज रूप से व्यक्त किया गया है।
- source_word: תְּנַגְּחוּ
  choice: मारते हो
  rationale: सींगों के स्पष्ट उल्लेख के कारण ‘मारते हो’ पशुओं के सींग मारने की क्रिया को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: הַנַּחְלוֹת
  choice: दुर्बलों
  rationale: यह रूप दुर्बल या रोगग्रस्त पशुओं को सूचित करता है; ‘दुर्बलों’ सामाजिक और झुंड-संबंधी दोनों संदर्भों में बोधगम्य है।
- source_word: הֲפִיצוֹתֶם ... אֶל־הַחוּצָה
  choice: तितर-बितर करके बाहर नहीं निकाल देते
  rationale: मूल में बिखेरने और बाहर की ओर भेज देने, दोनों भाव हैं; संयुक्त हिन्दी पद दोनों को सुरक्षित रखता है।
