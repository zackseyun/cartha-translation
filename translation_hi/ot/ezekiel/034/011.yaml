  yaml_path: translation/ot/ezekiel/034/011.yaml
  text: 'For thus says the Lord GOD: Behold[a], I myself will search for my sheep and seek them out.'
translation:
  language: hi
  text: 'क्योंकि प्रभु याहवे यों कहते हैं: “देखो, मैं स्वयं अपनी भेड़ों को ढूँढ़ूँगा और उनकी सुधि लूँगा[a]।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इसका अनुवाद “उन्हें खोज निकालूँगा,” “उनकी जाँच करूँगा” या “उनकी देखभाल करूँगा” भी हो सकता है। इब्रानी क्रिया में भेड़ों को खोजने के साथ-साथ व्यक्तिगत रूप से उनका हाल जानने और उनकी देखरेख करने का भाव भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  choice: प्रभु यहवे
  rationale: अֲדֹנָי और परमेश्वर के व्यक्तिगत नाम יְהוָה—दोनों को अलग रखते हुए संयुक्त उपाधि का स्वाभाविक हिन्दी रूप दिया गया है।
- source_word: הִנְנִי אָנִי
  choice: देखो, मैं स्वयं
  rationale: הִנְנִי का ध्यान खींचने वाला भाव ‘देखो’ से और אָנִי का विशेष बल ‘मैं स्वयं’ से व्यक्त होता है; इससे परमेश्वर की व्यक्तिगत पहल उभरती है।
- source_word: וְדָרַשְׁתִּי
  choice: ढूँढ़ूँगा
  rationale: चरवाही के प्रसंग में דרש बिखरी हुई भेड़ों को सक्रिय रूप से खोजने का अर्थ देता है।
- source_word: צֹאנִי
  choice: अपनी भेड़ों को
  rationale: צֹאן सामूहिक रूप से छोटे पशुओं या झुंड को दर्शा सकता है; यहाँ ‘भेड़ों’ से चरवाहे का चित्र ठोस और स्वाभाविक रहता है।
- source_word: וּבִקַּרְתִּים
  choice: उनकी सुधि लूँगा
  rationale: בקר यहाँ खोजने के साथ-साथ व्यक्तिगत रूप से ध्यान देने, जाँचने और देखभाल करने का व्यापक भाव रख सकता है। ‘सुधि लूँगा’ पहले क्रियापद की केवल पुनरावृत्ति किए बिना उस भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: परमेश्वर के नाम יְהוָה का अनुवाद
  choice: यहवे
  alternative: यहोवा; बड़े अक्षरों के संकेत सहित ‘प्रभु’
  rationale: मूल पाठ में वाचा का व्यक्तिगत नाम सीधे आया है। ‘यहवे’ उसका लिप्यंतरण है और אֲדֹנָי के लिए प्रयुक्त ‘प्रभु’ से उसे अलग बनाए रखता है।
- issue: परमेश्वर की व्यक्तिगत पहल पर बल
  choice: मैं स्वयं
  alternative: मैं
  rationale: הִנְנִי אָנִי की दोहरी बलाघातपूर्ण अभिव्यक्ति बताती है कि असफल चरवाहों के विपरीत परमेश्वर खुद अपनी भेड़ों की खोज और देखरेख करेगा; अनुवाद इस बल को बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘यह कहते हैं’ भविष्यद्वक्ताई घोषणा के औपचारिक स्वर को बनाए रखता है, जबकि ‘सुधि लूँगा’ सामान्य पाठक के लिए बोधगम्य रहते हुए इब्रानी क्रिया की अर्थ-व्याप्ति को खुला रखता है।
