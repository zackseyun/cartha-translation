source:
  edition: WLC
  text: יִשְׁגּ֤וּ צֹאנִ/י֙ בְּ/כָל הֶ֣/הָרִ֔ים וְ/עַ֖ל כָּל גִּבְעָ֣ה רָמָ֑ה וְ/עַ֨ל כָּל פְּנֵ֤י הָ/אָ֨רֶץ֙ נָפֹ֣צוּ צֹאנִ֔/י וְ/אֵ֥ין דּוֹרֵ֖שׁ וְ/אֵ֥ין מְבַקֵּֽשׁ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/034/006.yaml
  text: My sheep wandered on all the mountains and on every high hill[a]; my sheep were scattered over the whole face of the earth[b], with no one searching or seeking for them.
translation:
  language: hi
  text: मेरी भेड़ें सब पहाड़ों पर और हर ऊँची पहाड़ी पर भटकती रहीं[a]; मेरी भेड़ें सारी धरती पर तितर-बितर हो गईं[b], और न कोई उन्हें खोजता था, न ढूँढ़ता था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘मार्ग से भटक गईं’।
    reason: lexical_alternative
  - marker: b
    text: हिब्रू में शाब्दिक रूप से ‘धरती के समस्त पृष्ठ पर’; यहाँ ‘धरती’ का अनुवाद ‘देश’ भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: יִשְׁגּוּ
  choice: भटकती रहीं
  rationale: שׁגה उचित मार्ग से भटकने या राह भूलने का भाव देता है। यह चयन चरवाही के रूपक को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: צֹאנִי
  choice: मेरी भेड़ें
  rationale: शाब्दिक अर्थ ‘मेरी भेड़ें/मेरा झुंड’ है। ‘मेरी भेड़ें’ ठोस चरवाही-रूपक और परमेश्वर के स्वामित्व दोनों को सुरक्षित रखता है।
- source_word: בְּכָל הֶהָרִים
  choice: सब पहाड़ों पर
  rationale: पहाड़ी भूभाग में भेड़ों के भटकने के लिए ‘पर’ स्वाभाविक हिन्दी है और כָל का व्यापक भाव बनाए रखता है।
- source_word: וְעַל כָּל גִּבְעָה רָמָה
  choice: और हर ऊँची पहाड़ी पर
  rationale: גִּבְעָה का अर्थ ‘पहाड़ी’ और רָמָה का अर्थ ‘ऊँची’ है; यह सीधा और आधुनिक हिन्दी रूप है।
- source_word: וְעַל כָּל פְּנֵי הָאָרֶץ
  choice: सारी धरती पर
  rationale: हिब्रू मुहावरे का शाब्दिक रूप ‘धरती/देश के सारे मुख पर’ है। हिन्दी में ‘सारी धरती पर’ व्यापक फैलाव को सहज रूप से व्यक्त करता है, जबकि ‘देश’ की सम्भावना पादटिप्पणी में रखी गई है।
- source_word: נָפֹצוּ
  choice: तितर-बितर हो गईं
  rationale: פוץ के निफ़अल रूप में अलग-अलग दिशाओं में बिखेर दिए जाने या बिखर जाने का भाव है; ‘तितर-बितर हो गईं’ हिन्दी में स्पष्ट और चित्रात्मक है।
- source_word: וְאֵין דּוֹרֵשׁ
  choice: न कोई उनकी खोज करता था
  rationale: דרש यहाँ खोई भेड़ों की सक्रिय खोज का भाव देता है। अपूर्ण परिस्थिति के वर्णन हेतु ‘करता था’ स्वाभाविक है।
- source_word: וְאֵין מְבַקֵּשׁ
  choice: न उन्हें ढूँढ़ता था
  rationale: בקש भी खोजने का अर्थ देता है। ‘खोज करता’ और ‘ढूँढ़ता’ दोनों रखकर हिब्रू के निकटार्थी युग्म को मिलाए बिना सुरक्षित रखा गया है।
theological_decisions:
- issue: ‘मेरी भेड़ें’ का संकेत
  choice: वक्ता परमेश्वर है और भेड़ें उसके लोगों के लिए चरवाही-रूपक हैं।
  alternative: इसे केवल सामान्य चरवाही का दृश्य समझना।
  rationale: यहेजकेल 34 के प्रसंग में झुंड परमेश्वर के लोगों और असफल मानवीय चरवाहों के अधीन उनकी दशा को सूचित करता है। मुख्य पाठ रूपक को बिना व्याख्यात्मक विस्तार के बनाए रखता है।
- issue: הָאָרֶץ का भौगोलिक विस्तार
  choice: मुख्य पाठ में ‘धरती’, व्यापक अर्थ को खुला रखते हुए।
  alternative: ‘देश’, अर्थात इस्राएल की भूमि या कोई सीमित भूभाग।
  rationale: אֶרֶץ का अर्थ ‘धरती’ और ‘देश/भूमि’ दोनों हो सकता है। प्रसंग व्यापक बिखराव सुझाता है, पर सीमित अर्थ सम्भव है; इसलिए विकल्प पादटिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज और रूपक-संरक्षक शैली अपनाई गई है। निकटार्थी हिब्रू क्रियाओं דרש और בקש को क्रमशः ‘खोज करता’ और ‘ढूँढ़ता’ कहकर अलग रखा गया है।
