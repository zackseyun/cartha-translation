source:
  edition: WLC
  text: וְ/יָדְע֗וּ כִּ֣י אֲנִ֧י יְהוָ֛ה אֱלֹהֵי/הֶ֖ם אִתָּ֑/ם וְ/הֵ֗מָּה עַמִּ/י֙ בֵּ֣ית יִשְׂרָאֵ֔ל נְאֻ֖ם אֲדֹנָ֥/י יְהוִֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/034/030.yaml
  text: And they will know that I[a], Yahweh their God, am with them, and that they, the house of Israel, are my people, declares the Lord GOD.
translation:
  language: hi
  text: और वे जानेंगे कि मैं—यहोवा, उनका परमेश्वर—उनके साथ[a] हूँ, और वे—इस्राएल का घराना—मेरी प्रजा हैं। यह प्रभु यहोवा की घोषणा है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उनके बीच।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָדְעוּ
  choice: तब वे जानेंगे
  rationale: भविष्यसूचक प्रसंग में संयोजक वाव के साथ पूर्ण क्रिया परिणामसूचक भाव रखती है; ‘तब’ इस परिणाम को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: כִּי
  choice: कि
  rationale: यह उनके जानने की विषय-वस्तु प्रस्तुत करता है, कारण नहीं।
- source_word: יְהוָה
  choice: यहोवा
  rationale: परमेश्वर के व्यक्तिगत वाचा-नाम को हिन्दी में प्रचलित लिप्यंतरण ‘यहोवा’ से सुरक्षित रखा गया है।
- source_word: אֱלֹהֵיהֶם
  choice: उनका परमेश्वर
  rationale: सम्बन्धवाचक प्रत्यय सहित रचना का स्वाभाविक हिन्दी रूप।
- source_word: אִתָּם
  choice: उनके साथ
  rationale: इब्रानी पूर्वसर्ग का सीधा अर्थ उपस्थिति को ‘साथ’ के रूप में व्यक्त करता है; ‘उनके बीच’ भी प्रसंगानुकूल सम्भव है।
- source_word: וְהֵמָּה
  choice: और वे
  rationale: स्पष्ट सर्वनाम को बनाए रखने से इब्रानी का बलाघात सुरक्षित रहता है।
- source_word: עַמִּי
  choice: मेरी प्रजा
  rationale: वाचा-सूत्र की गरिमा और सामूहिक अर्थ के लिए ‘प्रजा’ उपयुक्त है।
- source_word: בֵּית יִשְׂרָאֵל
  choice: इस्राएल का घराना
  rationale: स्थिर भविष्यसूचक अभिव्यक्ति के पारिवारिक, सामूहिक और वाचागत भाव को बनाए रखता है।
- source_word: נְאֻם
  choice: यह घोषणा है
  rationale: भविष्यद्वाणी के औपचारिक कथन-सूत्र को स्पष्ट और गरिमापूर्ण आधुनिक हिन्दी में व्यक्त करता है।
- source_word: אֲדֹנָי יְהוִה
  choice: प्रभु यहोवा
  rationale: दोनों इब्रानी तत्वों—उपाधि ‘प्रभु’ और व्यक्तिगत नाम ‘यहोवा’—को बिना दोहराव या प्रतिस्थापन के सुरक्षित रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: नाम को ‘प्रभु’ जैसी उपाधि से बदलने के बजाय उसका प्रचलित हिन्दी लिप्यंतरण रखा गया है; अन्तिम पदबंध में אֲדֹנָי को अलग से ‘प्रभु’ कहा गया है।
- issue: אִתָּם में वाचा-संबंधी उपस्थिति
  choice: उनके साथ हूँ
  alternative: उनके बीच हूँ
  rationale: ‘साथ’ इब्रानी का अधिक सीधा और वाचा-संबंधी उपस्थिति का स्वाभाविक हिन्दी रूप है, जबकि वैकल्पिक स्थानिक अर्थ पादटिप्पणी में सुरक्षित है।
- issue: בֵּית יִשְׂרָאֵל की सामूहिक पहचान
  choice: इस्राएल का घराना
  alternative: इस्राएल के लोग
  rationale: ‘घराना’ मूल रूपक और सामूहिक वाचागत पहचान को सुरक्षित रखता है, बिना उसे केवल जातीय विवरण में समतल किए।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण भविष्यसूचक शैली रखी गई है। वाक्य की समानान्तर वाचा-रचना—परमेश्वर उनके साथ है और वे उसकी प्रजा हैं—को स्पष्ट रखा गया है।
