source:
  edition: WLC
  text: וְ/נָתַתִּ֥י אוֹתָ֛/ם וּ/סְבִיב֥וֹת גִּבְעָתִ֖/י בְּרָכָ֑ה וְ/הוֹרַדְתִּ֤י הַ/גֶּ֨שֶׁם֙ בְּ/עִתּ֔/וֹ גִּשְׁמֵ֥י בְרָכָ֖ה יִֽהְיֽוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/034/026.yaml
  text: And I will make them and the places around my hill a blessing[a], and I will send down the rain in its season; they will be showers of blessing.
translation:
  language: hi
  text: मैं उन्हें और अपनी पहाड़ी के आस-पास के स्थानों को आशीष बनाऊँगा[a]। मैं वर्षा को उसके नियत समय पर बरसाऊँगा; वे आशीष की बौछारें होंगी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उन्हें और अपनी पहाड़ी के आस-पास को आशीष बनाऊँगा।” यह वाक्यांश संभवतः परमेश्वर की पवित्र पहाड़ी के आस-पास के क्षेत्र को दर्शाता है, जिसे प्रायः सिय्योन समझा जाता है।
    reason: ‘आस-पास’ के लिए हिब्रू बहुवचन संज्ञा का हिंदी में ‘स्थान’ जोड़कर या उसके बिना अनुवाद किया जा सकता है; पहाड़ी की पहचान मूल पाठ में स्पष्ट नहीं की गई है।
lexical_decisions:
- source_word: וְנָתַתִּי
  choice: मैं ... बनाऊँगा
  rationale: 'נתן का मूल अर्थ ‘देना/रखना’ है, पर यहाँ कर्म और विधेय ‘आशीष’ के साथ इसका फलसूचक अर्थ है: परमेश्वर उन्हें आशीष के रूप में स्थापित करेगा।'
- source_word: אוֹתָם וּסְבִיבוֹת גִּבְעָתִי
  choice: उन्हें और अपनी पहाड़ी के आस-पास के स्थानों को
  rationale: סְבִיבוֹת बहुवचन में आस-पास के क्षेत्रों या स्थानों को सूचित करता है। हिंदी में ‘स्थान’ जोड़ने से स्थानवाचक अर्थ स्वाभाविक और स्पष्ट रहता है, जबकि ‘अपनी पहाड़ी’ मूल पाठ की अनिर्दिष्टता बनाए रखता है।
- source_word: בְּרָכָה
  choice: आशीष
  rationale: एकवचन संज्ञा विधेय के रूप में प्रयुक्त है; हिंदी में ‘आशीष बनाऊँगा’ स्वाभाविक रूप से इसी एकवचन भाव को व्यक्त करता है।
- source_word: וְהוֹרַדְתִּי
  choice: मैं ... बरसाऊँगा
  rationale: ירד के हिफ़ील रूप का अर्थ ‘नीचे उतारना’ है। वर्षा के संदर्भ में ‘बरसाऊँगा’ स्वाभाविक हिंदी है और परमेश्वर की कारक भूमिका को सुरक्षित रखता है।
- source_word: הַגֶּשֶׁם בְּעִתּוֹ
  choice: वर्षा को उसके समय पर
  rationale: בְּעִתּוֹ वर्षा के उचित या नियत समय को दर्शाता है। ‘उसके समय पर’ मूल के सर्वनाम और समय-संबंध को निकटता से बनाए रखता है।
- source_word: גִּשְׁמֵי בְרָכָה
  choice: आशीष की बौछारें
  rationale: बहुवचन construct रूप वर्षा की बौछारों को दर्शाता है। ‘आशीष की बौछारें’ बहुवचन और בְרָכָה के साथ शाब्दिक संबंध दोनों को बनाए रखता है।
- source_word: יִהְיוּ
  choice: वे ... होंगी
  rationale: स्त्रीलिंग बहुवचन ‘बौछारें’ के साथ ‘वे ... होंगी’ हिब्रू के स्पष्ट बहुवचन क्रिया-रूप को दर्शाता है।
theological_decisions:
- issue: ‘मेरी पहाड़ी’ का संदर्भ
  choice: मुख्य पाठ में ‘अपनी पहाड़ी’ रखा गया है और उसे किसी विशेष स्थान के नाम से नहीं बदला गया।
  alternative: इसे सिय्योन/यरूशलेम या पुनर्स्थापित पवित्रस्थान की पहाड़ी के रूप में स्पष्ट करना।
  rationale: हिब्रू केवल ‘मेरी पहाड़ी’ कहता है। संदर्भ संभवतः सिय्योन और परमेश्वर के पवित्र स्थान की ओर संकेत करता है, पर पद स्वयं उसकी स्पष्ट पहचान नहीं करता; इसलिए अनावश्यक धर्मवैज्ञानिक विशिष्टीकरण से बचा गया है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘आशीष’, ‘वर्षा’ और ‘बौछारें’ सामान्य पाठक के लिए समझने योग्य हैं तथा पद में दोहराए गए आशीष के भाव को बनाए रखते हैं।
