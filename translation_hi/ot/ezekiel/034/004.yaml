base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/034/004.yaml
  text: You have not strengthened the weak[a], and you have not healed the sick, and you have not bound up the broken, and you have not brought back the strayed, and you have not sought the lost[c][b]; but with force and with harshness you have ruled them.
translation:
  language: hi
  text: तुमने कमज़ोर को बल नहीं दिया[a], बीमार को चंगा नहीं किया, घायल की पट्टी नहीं बाँधी, भटकी हुई[b] को वापस नहीं लाए, और खोई हुई को ढूँढ़ा नहीं; बल्कि तुमने बलपूर्वक और कठोरता से[c] उन पर शासन किया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘बीमार को’। इब्रानी शब्द बीमारी या दुर्बलता, दोनों का बोध करा सकता है; यहाँ अगले पदबंध के ‘बीमार’ से भेद रखने के लिए ‘कमज़ोर’ रखा गया है।
    reason: lexical_alternative
  - marker: b
    text: या ‘जिसे दूर भगा दिया गया था’। इब्रानी शब्द स्वयं भटक जाने के साथ-साथ बलपूर्वक दूर कर दिए जाने पर भी ज़ोर दे सकता है।
    reason: lexical_alternative
  - marker: c
    text: या ‘निर्दयता से’। इब्रानी शब्द कठोर, कुचल देने वाली सख़्ती का बोध कराता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנַּחְלוֹת
  choice: कमज़ोर
  rationale: यह रूप बीमारी या दुर्बलता का बोध करा सकता है। अगले पदबंध में הַחוֹלָה स्पष्ट रूप से ‘बीमार’ है, इसलिए यहाँ ‘कमज़ोर’ दोनों पदों का भेद और חִזַּקְתֶּם के साथ अर्थ-संबंध बनाए रखता है।
- source_word: חִזַּקְתֶּם
  choice: बल नहीं दिया
  rationale: पिएल रूप का अर्थ ‘मज़बूत करना’ है। ‘कमज़ोर को बल देना’ आधुनिक हिन्दी में स्वाभाविक है और मूल के अर्थ को रखता है।
- source_word: הַחוֹלָה
  choice: बीमार
  rationale: חלה का यह रूप बीमारी को स्पष्ट रूप से व्यक्त करता है और पहले बताए गए सामान्य दुर्बलता के भाव से अलग रहता है।
- source_word: רִפֵּאתֶם
  choice: चंगा नहीं किया
  rationale: רפא का सामान्य अर्थ ‘चंगा करना’ है; यह चरवाही और उपचार, दोनों संदर्भों में उपयुक्त है।
- source_word: לַנִּשְׁבֶּרֶת
  choice: घायल
  rationale: शाब्दिक अर्थ ‘टूटी हुई’ है। भेड़ की देखभाल और पट्टी बाँधने के संदर्भ में ‘घायल’ स्वाभाविक हिन्दी है और शारीरिक चोट का आशय व्यक्त करता है, बिना किसी विशेष अंग के टूटने को जोड़ने के।
- source_word: חֲבַשְׁתֶּם
  choice: पट्टी नहीं बाँधी
  rationale: चिकित्सकीय और चरवाही संदर्भ में חבש घाव या टूटे अंग को बाँधने का अर्थ देता है; हिन्दी में ‘पट्टी बाँधना’ इसका स्वाभाविक रूप है।
- source_word: הַנִּדַּחַת
  choice: भटक गई
  rationale: נדח में दूर कर दिए जाने या भटक जाने, दोनों का भाव संभव है। मुख्य पाठ में ‘भटक गई’ भेड़ के रूपक में सहज है, जबकि पादटिप्पणी कर्मवाच्य संभावना को सुरक्षित रखती है।
- source_word: הֲשֵׁבֹתֶם
  choice: वापस नहीं लाए
  rationale: שוב का हिफ़ील रूप ‘वापस लाना’ है; यह भटकी भेड़ को लौटाने की क्रिया स्पष्ट करता है।
- source_word: הָאֹבֶדֶת
  choice: खो गई
  rationale: चरवाही संदर्भ में אבד का कृदन्त रूप ‘खोई हुई’ के अर्थ में सबसे उपयुक्त है; ‘नष्ट हो रही’ भी शब्दार्थतः संभव है, पर यहाँ कम स्वाभाविक है।
- source_word: בִקַּשְׁתֶּם
  choice: ढूँढ़ा नहीं
  rationale: בקש का अर्थ ‘खोजना/ढूँढ़ना’ है। ‘खो गई को ढूँढ़ना’ आधुनिक हिन्दी में सहज और स्पष्ट है।
- source_word: וּבְחָזְקָה
  choice: बलपूर्वक
  rationale: यह रीति-सूचक पदबंध दबावपूर्ण शक्ति से शासन करने का भाव देता है। ‘बलपूर्वक’ यह भाव रखता है, पर अनिवार्य रूप से शारीरिक हिंसा नहीं जोड़ता।
- source_word: רְדִיתֶם
  choice: शासन किया
  rationale: רדה का मूल अर्थ ‘शासन करना, अधिकार चलाना’ है। नकारात्मकता को उसके साथ आए ‘बलपूर्वक’ और ‘कठोरता से’ व्यक्त करने दिया गया है।
- source_word: בְפָרֶךְ
  choice: कठोरता से
  rationale: यह शब्द कठोर, कुचल देने वाले व्यवहार का बोध कराता है। ‘कठोरता से’ मुख्य पाठ में स्वाभाविक है, और अधिक तीव्र वैकल्पिक भाव पादटिप्पणी में दिया गया है।
theological_decisions:
- issue: चरवाहे और भेड़ों के रूपक का संरक्षण
  choice: कमज़ोर, बीमार, घायल, भटकी और खोई हुई भेड़ों से संबंधित देखभाल की भाषा को बनाए रखा गया है।
  alternative: पद को सीधे राजनीतिक भाषा में केवल लोगों और शासकों के विषय में प्रस्तुत करना।
  rationale: अध्याय इस्राएल के अगुओं की निंदा चरवाहों के विस्तृत रूपक के द्वारा करता है। रूपक को बनाए रखने से भविष्यवाणी की शक्ति और अन्य बाइबिलीय चरवाहा-पाठों से संबंध सुरक्षित रहता है।
- issue: अंतिम वाक्यांश में अत्याचार का स्वर
  choice: ‘शासन किया’ को तटस्थ क्रिया रखते हुए ‘बलपूर्वक और कठोरता से’ द्वारा अत्याचार का भाव व्यक्त किया गया है।
  alternative: क्रिया को ही व्याख्यात्मक रूप से ‘निर्दयता से दबाया’ या ‘क्रूरता से अधीन किया’ बनाना।
  rationale: इब्रानी में नकारात्मक बल मुख्यतः शासन की रीति बताने वाले दो पदबंधों में है। स्रोत की संरचना बनाए रखने से अर्थ स्पष्ट रहता है और अनावश्यक तीव्रता नहीं जोड़ी जाती।
translation_notes:
  register: भाषा आधुनिक, मानक और गरिमापूर्ण हिन्दी में रखी गई है। स्त्रीलिंग एकवचन रूप (‘भटक गई’, ‘खो गई’) संदर्भ में निहित भेड़ को सामने रखता है। समानांतर नकारात्मक उपवाक्यों और अंतिम विरोधसूचक ‘बल्कि’ को बनाए रखकर भविष्यवाणी की लय और आरोपात्मक स्वर सुरक्षित किया गया है।
