id: EZK.34.15
reference: Ezekiel 34:15
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: אֲנִ֨י אֶרְעֶ֤ה צֹאנִ/י֙ וַ/אֲנִ֣י אַרְבִּיצֵ֔/ם נְאֻ֖ם אֲדֹנָ֥/י יְהוִֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/034/015.yaml
  text: I myself will shepherd my flock[a], and I myself will make them lie down[c][b], declares the Lord Yahweh.
translation:
  language: hi
  text: “मैं स्वयं अपने झुंड[a] की चरवाही करूँगा, और मैं स्वयं उन्हें विश्राम के लिए लिटाऊँगा[b]”—प्रभु यहोवा की घोषणा है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी शब्द צֹאן भेड़-बकरियों को सामूहिक रूप से दर्शाता है; इसका अनुवाद ‘मेरी भेड़ें’ भी किया जा सकता है।
    reason: lexical_alternative
  - marker: b
    text: 'शाब्दिक अर्थ: ‘उन्हें लिटाऊँगा।’ भाव यह है कि चरवाहा झुंड को टिकने और विश्राम करने देता है।'
    reason: lexical_clarification
lexical_decisions:
- source_word: אֲנִי ... וַאֲנִי
  choice: मैं स्वयं ... और मैं स्वयं
  rationale: दोनों स्वतंत्र सर्वनामों की पुनरावृत्ति पर बल है; यह अनुवाद उस समानांतरता और परमेश्वर की व्यक्तिगत प्रतिज्ञा को बनाए रखता है।
- source_word: אֶרְעֶה
  choice: चरवाही करूँगा
  rationale: רעה यहाँ चरवाहे के पूरे कार्य—चराने, देखभाल करने और अगुवाई करने—को व्यक्त करता है; केवल ‘खिलाऊँगा’ इसका अर्थ सीमित कर देता।
- source_word: צֹאנִי
  choice: अपने झुंड
  rationale: צֹאן भेड़-बकरियों के सामूहिक समूह का सूचक है। ‘झुंड’ चरवाही के प्रसंग में स्वाभाविक हिन्दी है और सामूहिक भाव बनाए रखता है।
- source_word: אַרְבִּיצֵם
  choice: उन्हें विश्राम के लिए लिटाऊँगा
  rationale: רבץ के हिफ़ील रूप का मूल अर्थ लेटने या टिकने को प्रेरित करना है। यह चयन कारणवाचक अर्थ और चरवाहे द्वारा सुरक्षित विश्राम दिलाने की छवि दोनों को व्यक्त करता है।
- source_word: נְאֻם
  choice: घोषणा है
  rationale: यह भविष्यद्वाणी में अधिकारपूर्ण ईश्वरीय वचन का प्रचलित सूत्र है; ‘घोषणा है’ आधुनिक और गरिमापूर्ण हिन्दी है।
- source_word: אֲדֹנָי יְהוִה
  choice: प्रभु यहोवा
  rationale: אֲדֹנָי को ‘प्रभु’ और परमेश्वर के व्यक्तिगत नाम יְהוִה को ‘यहोवा’ के रूप में अलग-अलग व्यक्त किया गया है।
theological_decisions:
- issue: אֲדֹנָי יְהוִה में परमेश्वर के नाम का अनुवाद
  choice: प्रभु यहोवा
  alternative: प्रभु परमेश्वर
  rationale: मूल पाठ में उपाधि אֲדֹנָי और व्यक्तिगत नाम יְהוִה दोनों हैं। ‘प्रभु यहोवा’ इस भेद को बनाए रखता है और नाम को सामान्य उपाधि में नहीं बदलता।
- issue: चरवाहे के कार्य में खिलाने और व्यापक देखभाल के बीच अर्थ
  choice: चरवाही करूँगा
  alternative: चराऊँगा / खिलाऊँगा
  rationale: रूपक में परमेश्वर का कार्य केवल भोजन देना नहीं, बल्कि झुंड की समग्र देखभाल करना है। ‘चरवाही’ इस व्यापक अर्थ को बिना किसी अतिरिक्त सिद्धान्तगत निष्कर्ष के सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘मैं स्वयं’ की पुनरावृत्ति मूल इब्रानी के बल और समानांतर रचना को सुरक्षित रखती है; ‘विश्राम के लिए लिटाऊँगा’ चरवाही की ठोस छवि को स्वाभाविक हिन्दी में व्यक्त करता है।
