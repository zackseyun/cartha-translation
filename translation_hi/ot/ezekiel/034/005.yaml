source:
  edition: WLC
  text: וַ/תְּפוּצֶ֖ינָה מִ/בְּלִ֣י רֹעֶ֑ה וַ/תִּהְיֶ֧ינָה לְ/אָכְלָ֛ה לְ/כָל חַיַּ֥ת הַ/שָּׂדֶ֖ה וַ/תְּפוּצֶֽינָה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/034/005.yaml
  text: So they were scattered for lack of a shepherd[a], and they became food for every beast of the field, and they were scattered.
translation:
  language: hi
  text: चरवाहा न होने के कारण वे तितर-बितर हो गईं; वे मैदान के हर जंगली पशु का भोजन बन गईं, और तितर-बितर हो गईं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתְּפוּצֶינָה
  choice: वे तितर-बितर हो गईं
  rationale: פוץ का यह रूप झुंड के बिखर जाने की अवस्था व्यक्त करता है। स्त्रीलिंग क्रिया संदर्भ में निहित भेड़ों के अनुरूप है। इब्रानी में आरंभ और अंत में हुई पुनरावृत्ति हिन्दी में भी रखी गई है।
- source_word: מִבְּלִי רֹעֶה
  choice: चरवाहा न होने के कारण
  rationale: מִבְּלִי अभाव के साथ प्रसंग में कारण का भाव भी देता है। यह हिन्दी में स्वाभाविक है और רֹעֶה के चरवाहे वाले रूपक को बनाए रखता है।
- source_word: וַתִּהְיֶינָה לְאָכְלָה
  choice: आहार बन गईं
  rationale: היה यहाँ परिणामी अवस्था और אָכְלָה खाई जाने वाली वस्तु को व्यक्त करता है। 'आहार बन गईं' संक्रमण और परिणाम दोनों को सहज हिन्दी में रखता है।
- source_word: לְכָל חַיַּת הַשָּׂדֶה
  choice: मैदान के हर जंगली जानवर का
  rationale: חַיַּת הַשָּׂדֶה का अर्थ खुले क्षेत्र में रहने वाला जंगली पशु है। 'हर जंगली जानवर' כָל के साथ आए एकवचन सामूहिक भाव को स्पष्ट और आधुनिक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: इस्राएल के अगुओं के लिए चरवाहे का रूपक
  choice: '''चरवाहा'' रूपक को यथावत रखा गया'
  alternative: '''अगुआ'' या ''देखभाल करने वाला'''
  rationale: यहेजकेल 34 में चरवाहों और भेड़ों का रूपक पूरे प्रसंग को नियंत्रित करता है। उसे व्याख्यात्मक पद से बदलने पर भविष्यद्वाणी का चित्रात्मक और धर्मवैचारिक तनाव घट जाता।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। इब्रानी की दोहराई गई अंतिम क्रिया को शैलीगत अनावश्यकता मानकर हटाया नहीं गया। अंग्रेज़ी परामर्श-पाठ में दिया गया पादटिप्पणी-चिह्न और उसकी सामग्री आपस में असंगत थे, इसलिए मूल इब्रानी में आवश्यक न होने के कारण हिन्दी पाठ में कोई पादटिप्पणी नहीं जोड़ी गई।
