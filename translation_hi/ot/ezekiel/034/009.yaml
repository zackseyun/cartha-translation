  register: भाषा आधुनिक, संक्षिप्त और गरिमापूर्ण रखी गई है। सम्बोधन के लिए ‘हे’ स्वाभाविक हिन्दी स्पष्टता देता है। पद के अंत का द्विबिंदु अगले कथन की भूमिका को दर्शाता है।
