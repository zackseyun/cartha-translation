lexical_decisions:
- source_word: לָכֵן
  choice: इसलिए
  rationale: यह शब्द पिछले आरोप के आधार पर निकलने वाले परिणाम का परिचय देता है; ‘इसलिए’ आधुनिक हिन्दी में स्वाभाविक और सटीक है।
- source_word: הָרֹעִים
  choice: हे चरवाहो
  rationale: मूल शब्द का शाब्दिक अर्थ ‘चरवाहे’ है। यहाँ यह इस्राएल के अगुओं के लिए रूपक है; पूरे अध्याय की चरवाही-संबंधी छवि बनाए रखने के लिए रूपक को संरक्षित किया गया है। सम्बोधन स्पष्ट करने के लिए ‘हे’ जोड़ा गया है।
- source_word: שִׁמְעוּ
  choice: सुनो
  rationale: यह बहुवचन आज्ञार्थक रूप है। ‘सुनो’ भविष्यद्वक्ताओं की गंभीर आह्वान-शैली और आज्ञा के भाव दोनों को बनाए रखता है।
- source_word: דְּבַר
  choice: वचन
  rationale: भविष्यद्वाणी के सूत्र ‘यहोवा का वचन’ में ‘वचन’ प्रतिष्ठित, अर्थपूर्ण और मूल संज्ञा के निकट हिन्दी रूप है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिन्दी में परमेश्वर के व्यक्तिगत नाम के प्रचलित लिप्यंतरण ‘यहोवा’ का प्रयोग किया गया है, जिससे मूल पाठ में आए नाम को किसी उपाधि से नहीं बदला जाता।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल में चतुरक्षरीय व्यक्तिगत नाम सीधे आया है। हिन्दी पाठकों के लिए व्यापक रूप से पहचाने जाने वाले ‘यहोवा’ को रखते हुए नाम को ‘प्रभु’ जैसी उपाधि से प्रतिस्थापित नहीं किया गया।
- issue: הָרֹעִים को ‘अगुए’ कहकर समझाना या चरवाहे का रूपक बनाए रखना
  choice: चरवाहो
  alternative: अगुओ
  rationale: अध्याय में चरवाहे का सतत रूपक उसके धर्मवैचारिक और अलंकारिक बल का अंग है। मुख्य पाठ में ‘अगुए’ लिखना उस रूपक की व्याख्या कर देता और उसकी छवि को खो देता।
