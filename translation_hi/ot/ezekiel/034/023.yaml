base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/034/023.yaml
  text: And I will raise up over them one shepherd[a], my servant David, and he will shepherd them; he himself will shepherd them[c][b], and he himself will be their shepherd.
translation:
  language: hi
  text: मैं उनके ऊपर एक चरवाहा ठहराऊँगा[a], और वह उन्हें चराएगा—मेरा सेवक दाऊद[b]। वह उन्हें चराएगा[c], और वही उनका चरवाहा होगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मैं उनके ऊपर एक चरवाहा नियुक्त करूँगा।”
    reason: lexical_alternative
  - marker: b
    text: “दाऊद” का अर्थ शाब्दिक दाऊद—एक आदर्शीकृत राजकीय व्यक्तित्व—हो सकता है, या अधिक व्यापक रूप से किसी भावी दाऊदी शासक का।
    reason: alternative_reading
  - marker: c
    text: इब्रानी में चरवाहे के काम की क्रिया बार-बार आती है; इसका अर्थ “चराना,” “पालना” या “देखभाल करना” भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַהֲקִמֹתִי
  choice: मैं ... खड़ा करूँगा
  rationale: हिफ़ील रूप में क्रिया का अर्थ खड़ा करना, स्थापित करना या नियुक्त करना हो सकता है। ‘खड़ा करूँगा’ ईश्वरीय स्थापना का भाव रखते हुए अर्थ को अनावश्यक रूप से केवल औपचारिक नियुक्ति तक सीमित नहीं करता।
- source_word: עֲלֵיהֶם
  choice: उनके ऊपर
  rationale: עַל यहाँ लोगों पर नेतृत्व और देखरेख के पद को व्यक्त करता है; ‘उनके ऊपर’ चरवाहे और शासक, दोनों की छवि बनाए रखता है।
- source_word: רֹעֶה אֶחָד
  choice: एक चरवाहा
  rationale: यह सीधा अनुवाद एक ही चरवाहे और नेतृत्व की एकता पर दिए गए बल को सुरक्षित रखता है।
- source_word: וְרָעָה / יִרְעֶה
  choice: चरवाही करेगा
  rationale: רעה का अर्थ चराना, पालन-पोषण करना और देखभाल करना हो सकता है। ‘चरवाही करेगा’ चरवाहे का रूपक और मूल में क्रिया की पुनरावृत्ति दोनों बनाए रखता है।
- source_word: אֵת עַבְדִּי דָוִד
  choice: अपने सेवक दाऊद को
  rationale: यह पदबंध एक चरवाहे की पहचान बताता है। ‘सेवक’ की वाचाई उपाधि और ‘दाऊद’ नाम, दोनों बिना व्याख्यात्मक विस्तार के सुरक्षित हैं।
- source_word: הוּא
  choice: वही
  rationale: स्वतंत्र सर्वनाम बलसूचक है। ‘वही’ स्वाभाविक हिन्दी में इस बात पर बल देता है कि यही व्यक्ति स्वयं चरवाही करेगा और चरवाहा होगा।
- source_word: יִהְיֶה לָהֶן לְרֹעֶה
  choice: वही उनका चरवाहा होगा
  rationale: यह रचना भूमिका और संबंध व्यक्त करती है। ‘उनका चरवाहा’ हिन्दी में स्वाभाविक है और मूल की चरवाही-संबंधी छवि बनाए रखता है।
theological_decisions:
- issue: भविष्यवाणी में ‘दाऊद’ की पहचान
  choice: मुख्य पाठ में केवल ‘दाऊद’ रखा गया है, बिना किसी व्याख्यात्मक विस्तार के।
  alternative: इसे भावी दाऊदी शासक अथवा मसीह के रूप में स्पष्ट करना।
  rationale: इब्रानी पाठ ‘दाऊद’ कहता है। यह नाम स्वयं ऐतिहासिक दाऊद की आदर्श राजकीय छवि की ओर संकेत करता है या भावी दाऊदी शासक की ओर—इसे अनुवाद में निश्चित कर देना उचित नहीं होगा।
- issue: स्वतंत्र सर्वनाम הוּא का बल
  choice: ‘वही’ द्वारा बल को व्यक्त किया गया है।
  alternative: केवल ‘वह’ लिखकर बल को अप्रकट छोड़ना।
  rationale: मूल पाठ में स्वतंत्र सर्वनाम की पुनरावृत्ति विशेष बल देती है। ‘वही’ इस बल को हिन्दी में संक्षिप्त और स्वाभाविक ढंग से रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सहज रूप अपनाया गया है। ‘चरवाहा/चरवाही’ की पुनरावृत्ति जानबूझकर रखी गई है, क्योंकि वह मूल इब्रानी की संरचना और बल का महत्वपूर्ण अंग है। ‘वही’ स्वतंत्र इब्रानी सर्वनाम के बल को स्वाभाविक हिन्दी में व्यक्त करता है।
