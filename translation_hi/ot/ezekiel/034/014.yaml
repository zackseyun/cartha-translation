  text: בְּ/מִרְעֶה טּוֹב֙ אֶרְעֶ֣ה אֹתָ֔/ם וּ/בְ/הָרֵ֥י מְרֽוֹם יִשְׂרָאֵ֖ל יִהְיֶ֣ה נְוֵ/הֶ֑ם שָׁ֤ם תִּרְבַּ֨צְנָה֙ בְּ/נָ֣וֶה טּ֔וֹב וּ/מִרְעֶ֥ה שָׁמֵ֛ן תִּרְעֶ֖ינָה אֶל הָרֵ֥י יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/034/014.yaml
  text: In good pasture I will pasture them[a], and on the high mountains of Israel their grazing place will be. There they will lie down in a good grazing place[b], and they will feed in rich pasture on the mountains of Israel.
translation:
  language: hi
  text: अच्छे चरागाह में मैं उन्हें चराऊँगा, और इस्राएल के ऊँचे पहाड़ों पर उनके चरने का स्थान[a] होगा। वहाँ वे अच्छे चरने के स्थान में लेटेंगी, और इस्राएल के पहाड़ों पर भरपूर चरागाह[b] में चरेंगी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘उनका निवास-स्थान’; इब्रानी संज्ञा का अर्थ चरने का स्थान और निवास-स्थान दोनों हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, ‘मोटा चरागाह।’
    reason: lexical_alternative
lexical_decisions:
- source_word: מִרְעֶה טּוֹב
  choice: उत्तम चरागाह
  rationale: מִרְעֶה चरने की भूमि या चरागाह को और טוֹב उसकी अच्छी गुणवत्ता को व्यक्त करता है। ‘उत्तम चरागाह’ सहज और गरिमापूर्ण है।
- source_word: אֶרְעֶה אֹתָם
  choice: मैं उन्हें चराऊँगा
  rationale: रूपक में परमेश्वर चरवाहे के रूप में स्वयं झुंड को चराता है; ‘चराऊँगा’ इस ठोस चरवाही-बिंब को बनाए रखता है।
- source_word: הָרֵי מְרוֹם יִשְׂרָאֵל
  choice: इस्राएल के ऊँचे पहाड़
  rationale: מְרוֹם ऊँचाई को सूचित करता है; यह अनुवाद मूल के स्थलाकृतिक बल को स्वाभाविक हिन्दी में रखता है।
- source_word: נְוֵהֶם / בְּנָוֶה טּוֹב
  choice: उनके चरने का स्थान / चरने के अच्छे स्थान में
  rationale: נָוֶה का अर्थ चरने या रहने का स्थान हो सकता है। चरवाहे और झुंड के वर्तमान प्रसंग में ‘चरने का स्थान’ उपयुक्त है, जबकि वैकल्पिक अर्थ पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: תִּרְבַּצְנָה
  choice: वे ... लेटेंगी
  rationale: क्रिया झुंड के पशुओं के सुरक्षित होकर लेटने का ठोस चित्र देती है; ‘विश्राम करेंगी’ की अपेक्षा ‘लेटेंगी’ मूल बिंब को अधिक सीधे रखता है।
- source_word: מִרְעֶה שָׁמֵן
  choice: भरपूर चरागाह
  rationale: שָׁמֵן का शाब्दिक अर्थ ‘मोटा’ है, पर चरागाह के विषय में यह प्रचुरता और समृद्धि दर्शाता है। ‘भरपूर’ आधुनिक हिन्दी में उसी आशय को स्वाभाविक रूप से व्यक्त करता है।
- source_word: תִּרְעֶינָה
  choice: चरेंगी
  rationale: यहाँ झुंड कर्ता है, इसलिए ‘चरेंगी’ क्रिया को सटीक और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: אֶל הָרֵי יִשְׂרָאֵל
  choice: इस्राएल के पहाड़ों पर
  rationale: यद्यपि אֶל सामान्यतः ‘की ओर’ हो सकता है, यहाँ चरने के स्थान के संदर्भ में इसका स्थानवाचक अर्थ ‘पर’ स्वाभाविक है।
theological_decisions:
- issue: परमेश्वर की देखभाल का चरवाही-बिंब
  choice: चराना, चरागाह, लेटना और चरना जैसे ठोस चरवाही-शब्द बनाए रखे गए हैं।
  alternative: इन्हें सामान्य देखभाल, प्रबंध या सुरक्षित विश्राम की व्याख्यात्मक भाषा में प्रस्तुत करना।
  rationale: यह पद विस्तृत चरवाहा-वाणी का भाग है। ठोस रूपक को बनाए रखना मूल पाठ के अधिक निकट है और पाठ से आगे की धार्मिक व्याख्या आरोपित नहीं करता।
- issue: נָוֶה की अर्थगत अस्पष्टता
  choice: मुख्य पाठ में प्रसंगानुकूल ‘चरने का स्थान’ रखा गया है और ‘निवास-स्थान’ को पादटिप्पणी में दिया गया है।
  alternative: मुख्य पाठ में केवल ‘निवास-स्थान’ रखना।
  rationale: इब्रानी संज्ञा चरागाह अथवा निवास दोनों का बोध करा सकती है। मुख्य चरवाही-संदर्भ को स्पष्ट रखते हुए पादटिप्पणी वास्तविक शब्दार्थगत तनाव को सुरक्षित रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य शैली अपनाई गई है। स्त्रीलिंग बहुवचन ‘लेटेंगी’ और ‘चरेंगी’ से संदर्भित भेड़ों का संकेत बना रहता है।
