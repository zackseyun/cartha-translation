  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'हिब्रू: “YHWH” (याहवे), परमेश्वर का व्यक्तिगत नाम। अंग्रेज़ी अनुवादों में इसे परंपरागत रूप से “the LORD” लिखा जाता है।'
    reason: alternative_reading
lexical_decisions:
- source_word: לָכֵן
  choice: इसलिए
  rationale: यह पिछले आरोपों से निकलने वाले निष्कर्ष को स्वाभाविक और स्पष्ट ढंग से व्यक्त करता है।
- source_word: רֹעִים
  choice: चरवाहो
  rationale: मूल चरवाही-रूपक को बनाए रखता है; यहाँ इसका आशय इस्राएल के अगुओं से है, पर अनुवाद में रूपक को खोलकर नहीं लिखा गया।
- source_word: שִׁמְעוּ
  choice: सुनो
  rationale: बहुवचन आज्ञार्थक रूप को सीधे व्यक्त करता है और भविष्यद्वक्ताई आह्वान की गरिमा बनाए रखता है।
- source_word: דְּבַר
  choice: वचन
  rationale: रचनात्मक संबंध में प्रयुक्त דָּבָר के लिए प्रचलित और पाठ-पारदर्शी भविष्यद्वक्ताई पद है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिन्दी में परमेश्वर के व्यक्तिगत नाम के प्रचलित लिप्यंतरण का उपयोग किया गया है, न कि किसी उपाधि का।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ में चतुरक्षरीय व्यक्तिगत नाम सीधे आया है। हिन्दी बाइबलीय प्रयोग में परिचित ‘यहोवा’ उसे नाम के रूप में सुरक्षित रखता है; ‘याहवे’ अधिक अकादमिक पुनर्निर्मित उच्चारण है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और भविष्यद्वक्ताई संबोधन के अनुरूप है। संबोधन को स्पष्ट और स्वाभाविक बनाने के लिए ‘हे’ जोड़ा गया है।
