source:
  edition: WLC
  text: כֹּה אָמַ֞ר אֲדֹנָ֣/י יְהוִ֗ה הִנְ/נִ֨י אֶֽל הָ/רֹעִ֜ים וְֽ/דָרַשְׁתִּ֧י אֶת צֹאנִ֣/י מִ/יָּדָ֗/ם וְ/הִשְׁבַּתִּי/ם֙ מֵ/רְע֣וֹת צֹ֔אן וְ/לֹא יִרְע֥וּ ע֛וֹד הָ/רֹעִ֖ים אוֹתָ֑/ם וְ/הִצַּלְתִּ֤י צֹאנִ/י֙ מִ/פִּי/הֶ֔ם וְ/לֹֽא תִהְיֶ֥יןָ לָ/הֶ֖ם לְ/אָכְלָֽה־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/034/010.yaml
  text: 'Thus says the Lord GOD: Behold[a], I am against the shepherds, and I will require my flock from their hand, and I will stop them from shepherding the flock. The shepherds will no longer shepherd them, and I will rescue my flock from their mouth[c][b], and it will no longer be food for them.'
translation:
  language: hi
  text: 'प्रभु यहोवा यों कहता है: “देखो, मैं उन चरवाहों के विरुद्ध हूँ। मैं अपना झुंड उनके हाथ से वापस माँगूँगा[a] और उन्हें झुंड चराने से रोक दूँगा। वे चरवाहे फिर उन्हें नहीं चराएँगे। मैं अपना झुंड उनके मुँह से छुड़ाऊँगा[b], और वह फिर उनका भोजन नहीं होगा।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “उनके हाथ से वापस माँगूँगा” का अर्थ यह भी हो सकता है, “अपने झुंड के विषय में उनसे लेखा लूँगा।”
    reason: मूल इब्रानी मुहावरे में झुंड को वापस लेने और चरवाहों को उत्तरदायी ठहराने—दोनों का भाव है।
  - marker: b
    text: शाब्दिक रूप से “उनके मुँह से”; यह उन चरवाहों को रक्षक नहीं, बल्कि झुंड को निगलने वाले भक्षकों के रूप में दिखाता है।
    reason: मूल पाठ के तीखे भक्षण-रूपक को स्पष्ट करते हुए उसे मुख्य पाठ में भी सुरक्षित रखा गया है।
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  choice: प्रभु यहोवा
  rationale: संयुक्त ईश्वरीय उपाधि के दोनों तत्वों को बनाए रखते हुए आधुनिक हिन्दी बाइबलीय प्रयोग के अनुरूप अनुवाद किया गया है।
- source_word: הִנְנִי אֶל־הָרֹעִים
  choice: देखो, मैं उन चरवाहों के विरुद्ध हूँ
  rationale: הִנְנִי की ध्यान आकर्षित करने वाली भविष्यद्वक्तात्मक शक्ति और אֶל की विरोधात्मक भावना दोनों सुरक्षित रहती हैं।
- source_word: הָרֹעִים
  choice: चरवाहे
  rationale: यह पद शासकों की ओर संकेत करता है, फिर भी मूल पाठ की चरवाहे और झुंड की सजीव रूपक-शृंखला को व्याख्यात्मक रूप से 'अगुए' कहकर नहीं हटाया गया।
- source_word: וְדָרַשְׁתִּי אֶת־צֹאנִי מִיָּדָם
  choice: मैं अपना झुंड उनके हाथ से वापस माँगूँगा
  rationale: דָּרַשׁ और מִיָּדָם में जवाबदेही तथा सौंपे हुए झुंड को वापस लेने—दोनों का भाव है; 'वापस माँगूँगा' सहज हिन्दी में इस अर्थ को व्यक्त करता है, जबकि पादटिप्पणी न्यायिक आयाम बताती है।
- source_word: וְהִשְׁבַּתִּים מֵרְעוֹת צֹאן
  choice: उन्हें झुंड चराने से रोक दूँगा
  rationale: हिफ़ील क्रिया का 'बंद करा देना/रोक देना' अर्थ और רעה का चरवाही-संबंधी अर्थ सीधे व्यक्त होते हैं।
- source_word: וְלֹא יִרְעוּ עוֹד הָרֹעִים אוֹתָם
  choice: वे चरवाहे फिर उन्हें नहीं चराएँगे
  rationale: मूल में संज्ञा और क्रिया के रूप में आए רעה की पुनरावृत्ति को हिन्दी में 'चरवाहे/चराएँगे' द्वारा बनाए रखा गया है।
- source_word: וְהִצַּלְתִּי צֹאנִי מִפִּיהֶם
  choice: मैं अपना झुंड उनके मुँह से छुड़ाऊँगा
  rationale: चरवाहों को भक्षक के रूप में दिखाने वाली तीखी विडंबना को 'मुँह से' कहकर सुरक्षित रखा गया है।
- source_word: וְלֹא תִהְיֶיןָ לָהֶם לְאָכְלָה
  choice: वह फिर उनका भोजन नहीं होगा
  rationale: स्त्रीलिंग एकवचन क्रिया सामूहिक संज्ञा 'झुंड' की ओर लौटती है; एकवचन 'वह' उसी व्याकरणिक संबंध को दर्शाता है और भोजन/भक्षण का रूपक बनाए रखता है।
theological_decisions:
- issue: אֲדֹנָי יְהוִה में ईश्वरीय नाम का हिन्दी रूप
  choice: प्रभु यहोवा
  alternative: प्रभु याहवे
  rationale: व्यक्तिगत वाचा-नाम को सामान्य उपाधि 'परमेश्वर' में नहीं बदला गया। 'यहोवा' आधुनिक हिन्दी पाठकों में स्थापित बाइबलीय रूप है; 'याहवे' मूल उच्चारण का अधिक निकट लिप्यंतरण माना जाता है, इसलिए उसे वैकल्पिक रूप के रूप में स्वीकार किया गया है।
- issue: चरवाहों से झुंड माँगने का अर्थ
  choice: झुंड को उनसे वापस माँगना, जिसमें जवाबदेही का भाव निहित है
  alternative: अपने झुंड के विषय में उनसे लेखा लेना
  rationale: דָּרַשׁ ... מִיַּדָם में पुनः प्राप्ति और उत्तरदायित्व दोनों अर्थ संभव हैं। मुख्य पाठ सहज हिन्दी में पुनः प्राप्ति को सामने रखता है और पादटिप्पणी दूसरे आयाम को सुरक्षित रखती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। 'यों कहता है' भविष्यद्वक्तात्मक घोषणा की औपचारिकता बनाए रखता है। 'चरवाहे', 'झुंड', 'मुँह' और 'भोजन' की परस्पर जुड़ी रूपक-शृंखला को व्याख्यात्मक पदों से नहीं बदला गया।
