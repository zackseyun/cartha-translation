base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/034/012.yaml
  text: As a shepherd seeks out his flock on the day he is among his sheep when they have been scattered[a], so I will seek out my sheep[b], and I will rescue them from all the places where they were scattered on a day of clouds and thick darkness.
translation:
  language: hi
  text: जैसे चरवाहा जिस दिन अपनी तितर-बितर हुई भेड़ों के बीच होता है, उस दिन अपने झुंड की खोज-खबर लेता है[a], वैसे ही मैं अपनी भेड़ों की खोज-खबर लूँगा और उन्हें उन सभी स्थानों से छुड़ाऊँगा, जहाँ वे बादल और घोर अंधकार के दिन तितर-बितर हो गई थीं[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘खोज-खबर लेता है’ का अनुवाद ‘देखभाल करता है’ या ‘ध्यानपूर्वक निरीक्षण करता है’ भी हो सकता है; इब्रानी क्रिया में खोजने के साथ सावधान देखरेख का भाव भी है।
    reason: lexical_alternative
  - marker: b
    text: इस वाक्यांश का अनुवाद ‘बादल और घोर अंधकार के उस दिन’ भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּבַקָּרַת ... כֵּן אֲבַקֵּר
  choice: जैसे ... खोज-खबर लेता है ... वैसे ही ... खोज-खबर लूँगा
  rationale: בקר की संज्ञात्मक और क्रियात्मक दोनों आवृत्तियों को एक ही स्वाभाविक हिन्दी अभिव्यक्ति से जोड़ा गया है। ‘खोज-खबर लेना’ खोजने के साथ सावधान देखरेख का अर्थ भी बनाए रखता है।
- source_word: רֹעֶה עֶדְרוֹ
  choice: चरवाहा ... अपने झुंड
  rationale: चरवाही का रूपक स्पष्ट और आधुनिक हिन्दी में स्वाभाविक रहता है; עדר को प्रसंगानुसार ‘झुंड’ कहा गया है।
- source_word: בְּיוֹם הֱיוֹתוֹ בְתוֹךְ צֹאנוֹ נִפְרָשׁוֹת
  choice: उस दिन ... जब वह अपनी तितर-बितर हुई भेड़ों के बीच होता है
  rationale: इब्रानी की कालवाचक रचना तथा बिखरी भेड़ों के बीच चरवाहे की उपस्थिति, दोनों सुरक्षित हैं।
- source_word: צֹאנִי
  choice: अपनी भेड़ों
  rationale: ‘भेड़ें’ छोटे पालतू पशुओं की चरवाही वाली प्रतिमा को ‘झुंड’ की अपेक्षा अधिक प्रत्यक्ष रखता है।
- source_word: וְהִצַּלְתִּי אֶתְהֶם
  choice: और उन्हें ... छुड़ा लाऊँगा
  rationale: Hiphil נצל के बचाने/छुड़ाने के सक्रिय अर्थ के साथ, बिखरी भेड़ों को वापस लाने का प्रसंग हिन्दी में स्वाभाविक रूप से व्यक्त होता है।
- source_word: מִכָּל הַמְּקוֹמוֹת אֲשֶׁר נָפֹצוּ שָׁם
  choice: उन सभी स्थानों से ... जहाँ वे ... तितर-बितर हो गई थीं
  rationale: सभी स्थानों से उद्धार और पूर्व में घटित बिखराव दोनों स्पष्ट रखे गए हैं।
- source_word: בְּיוֹם עָנָן וַעֲרָפֶל
  choice: बादल और घोर अंधकार के दिन
  rationale: עֲרָפֶל की सघन अंधकार की शक्ति को ‘घोर अंधकार’ से रखा गया है; पदबंध की काव्यात्मक गंभीरता भी बनी रहती है।
theological_decisions:
- issue: परमेश्वर का चरवाहे के रूप में चित्रण
  choice: परमेश्वर स्वयं अपनी भेड़ों की खोज-खबर लेकर उन्हें छुड़ाता है
  alternative: अनुवाद में किसी बाद की मसीही या संप्रदायगत पहचान को स्पष्ट रूप से जोड़ना
  rationale: पद के अपने साहित्यिक संदर्भ में दिव्य चरवाहे का रूपक सीधे सुरक्षित रखा गया है; आगे के धर्मवैचारिक संबंधों को अनुवाद में आरोपित नहीं किया गया।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘खोज-खबर लेना’ बोलचाल में परिचित है, पर यहाँ चरवाहे की सक्रिय खोज और देखरेख दोनों को व्यक्त करने के कारण उपयुक्त है। मुख्य पाठ में दोनों पाद-टिप्पणी चिह्न [a] और [b] सम्मिलित हैं।
