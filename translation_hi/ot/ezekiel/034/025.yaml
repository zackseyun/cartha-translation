source:
  edition: WLC
  text: וְ/כָרַתִּ֤י לָ/הֶם֙ בְּרִ֣ית שָׁל֔וֹם וְ/הִשְׁבַּתִּ֥י חַיָּֽה רָעָ֖ה מִן הָ/אָ֑רֶץ וְ/יָשְׁב֤וּ בַ/מִּדְבָּר֙ לָ/בֶ֔טַח וְ/יָשְׁנ֖וּ בַּ/יְּעָרִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/034/025.yaml
  text: I will make with them a covenant of peace[a], and I will remove harmful wild animals from the land[b], so that they may dwell securely in the wilderness and sleep in the forests.
translation:
  language: hi
  text: मैं उनके साथ शांति की वाचा करूँगा[a] और भूमि में से हानिकारक जंगली पशुओं को दूर कर दूँगा[b]। और वे निर्जन प्रदेश में सुरक्षित रहेंगे और जंगलों में सोएँगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘शांति’ में केवल संघर्ष का अभाव ही नहीं, बल्कि कुशलता, कल्याण, पूर्णता और सुरक्षा का भाव भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या, “मैं भूमि में हानिकारक जंगली पशुओं का होना समाप्त कर दूँगा।”
    reason: lexical_alternative
lexical_decisions:
- source_word: כָרַתִּי ... בְּרִית
  choice: वाचा बाँधूँगा
  rationale: כרת ברית वाचा स्थापित करने का प्रचलित इब्रानी मुहावरा है। हिन्दी में ‘वाचा बाँधना’ उसके रूप और अर्थ दोनों को स्वाभाविक, गरिमापूर्ण ढंग से व्यक्त करता है।
- source_word: בְּרִית שָׁלוֹם
  choice: शान्ति की वाचा
  rationale: यह अनुवाद वाचा-संबंधी मूल पदबंध को बनाए रखता है और שָׁלוֹם को केवल युद्ध की अनुपस्थिति तक सीमित नहीं करता।
- source_word: הִשְׁבַּתִּי
  choice: दूर कर दूँगा
  rationale: हिफ़ील रूप का अर्थ ‘रुकवा देना/समाप्त कर देना’ है। पशुओं के साथ ‘देश में से दूर कर देना’ स्वाभाविक है और उनके विनाश का अनावश्यक दावा नहीं करता।
- source_word: חַיָּה רָעָה
  choice: हानिकारक जंगली पशुओं
  rationale: חַיָּה यहाँ जंगली पशुओं का सामूहिक बोध देता है और רָעָה उनके हानिकारक या खतरनाक होने को बताता है, नैतिक बुराई को नहीं।
- source_word: הָאָרֶץ
  choice: देश
  rationale: इस संदर्भ में הָאָרֶץ पूरी पृथ्वी के बजाय इस्राएल के भूभाग की ओर संकेत करता है; आधुनिक हिन्दी में ‘देश’ यह क्षेत्रीय भाव स्पष्ट करता है।
- source_word: בַמִּדְבָּר
  choice: निर्जन प्रदेश
  rationale: מִדְבָּר खुले, कम आबादी वाले वन्य या चरागाही क्षेत्र को भी दर्शा सकता है; ‘निर्जन प्रदेश’ इसे केवल रेतीले मरुस्थल तक सीमित नहीं करता।
- source_word: לָבֶטַח
  choice: सुरक्षित
  rationale: यह पद भय और संकट से मुक्त, भरोसेमंद सुरक्षा की दशा व्यक्त करता है।
- source_word: יָשְׁנוּ בַּיְּעָרִים
  choice: जंगलों में सोएँगे
  rationale: सीधा अनुवाद उस सजीव चित्र को बनाए रखता है जिसमें सामान्यतः खतरनाक स्थानों में भी पूर्ण सुरक्षा होगी।
theological_decisions:
- issue: ‘शान्ति की वाचा’ में प्रतिज्ञात शान्ति का विस्तार
  choice: मुख्य पाठ में वाचा-संबंधी पदबंध को यथावत रखते हुए उसके व्यापक अर्थ का संकेत पादटिप्पणी में देना
  alternative: इसे केवल राजनीतिक शान्ति मानना, या मुख्य पाठ में इसे किसी विकसित उद्धार-सिद्धान्त के रूप में विस्तार देना
  rationale: שָׁלוֹם में कुशलता, कल्याण, पूर्णता और सुरक्षा की व्यापकता है, पर पद स्वयं उस व्यापकता को किसी बाद की व्यवस्थित धर्मशास्त्रीय परिभाषा में नहीं बाँधता।
- issue: हानिकारक पशुओं को हटाने की प्रकृति
  choice: उनका खतरा देश से दूर किए जाने के रूप में व्यक्त करना
  alternative: उनके पूर्ण विनाश का दावा करना
  rationale: הִשְׁבַּתִּי का मूल बल उनका होना या उपद्रव रुकवा देने पर है; यह अनिवार्यतः संहार का अर्थ नहीं देता।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और सार्वजनिक पाठ के योग्य रूप अपनाया गया है। ‘वाचा’ बाइबलीय वाचा की विशिष्ट संकल्पना को बनाए रखता है; शेष शब्दावली सामान्य पाठक के लिए सहज रखी गई है।
