  text: וַ/הֲקִמֹתִ֥י לָ/הֶ֛ם מַטָּ֖ע לְ/שֵׁ֑ם וְ/לֹֽא יִהְי֨וּ ע֜וֹד אֲסֻפֵ֤י רָעָב֙ בָּ/אָ֔רֶץ וְ/לֹֽא יִשְׂא֥וּ ע֖וֹד כְּלִמַּ֥ת הַ/גּוֹיִֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/034/029.yaml
  text: And I will raise up for them a planting of renown[a], and they will no longer be consumed by famine in the land[b], nor will they bear the disgrace of the nations anymore.
translation:
  language: hi
  text: और मैं उनके लिए एक प्रसिद्ध रोपण[a] लगाऊँगा। फिर वे भूमि में अकाल के कारण नष्ट होनेवाले नहीं रहेंगे[b], और न वे फिर कभी राष्ट्रों का अपमान सहेंगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “नाम के लिए एक रोपण”; अर्थात् ऐसा रोपण जो प्रसिद्ध या ख्यातिप्राप्त हो।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी वाक्यांश कठिन है; अधिक शाब्दिक रूप में, “अकाल के इकट्ठे किए हुए।” इसके सम्भव अर्थ “अकाल के शिकार” या “अकाल से नष्ट किए गए” हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַהֲקִמֹתִי
  choice: मैं ... उगाऊँगा
  rationale: हिफ़ील रूप का मूल भाव ‘खड़ा करना/स्थापित करना’ है; रोपण के संदर्भ में ‘उगाऊँगा’ स्वाभाविक हिन्दी है और परमेश्वर की सक्रिय पहल को बनाए रखता है।
- source_word: מַטָּע לְשֵׁם
  choice: एक नामी पौधा-वाटिका
  rationale: מַטָּע किसी रोपण, लगाई हुई वनस्पति या रोपण-स्थल को सूचित कर सकता है और לְשֵׁם का शाब्दिक अर्थ ‘नाम के लिए’ है। यह चयन कृषि-बिंब और प्रसिद्धि के भाव को रखता है, पर उसकी ठीक पहचान तय नहीं करता।
- source_word: אֲסֻפֵי רָעָב
  choice: अकाल से नष्ट
  rationale: वाक्यांश शाब्दिक रूप से ‘अकाल के द्वारा इकट्ठे किए गए’ जैसा कठिन है; प्रसंग में आशय अकाल के शिकार होकर मिट जाने या उठा लिए जाने से है। सहज हिन्दी के लिए ‘नष्ट’ चुना गया और अनिश्चितता पादटिप्पणी में रखी गई है।
- source_word: בָּאָרֶץ
  choice: देश में
  rationale: इस वाचा-संबंधी प्रसंग में אֶרֶץ से आशय सम्भवतः इस्राएल का देश है; ‘देश’ उस अर्थ को अनावश्यक विस्तार के बिना व्यक्त करता है।
- source_word: יִשְׂאוּ ... כְּלִמַּת
  choice: अपमान सहेंगे
  rationale: נשא का अर्थ ‘उठाना/ढोना/सहना’ है और כְּלִמָּה सार्वजनिक लज्जा या अपमान है; हिन्दी में ‘अपमान सहना’ स्वाभाविक संयोजन है।
- source_word: הַגּוֹיִם
  choice: राष्ट्रों
  rationale: भविष्यद्वाणी के संदर्भ में גּוֹיִם आसपास के राष्ट्रों को दर्शाता है; ‘राष्ट्रों’ तटस्थ और निकट समतुल्य है।
theological_decisions:
- issue: प्रतिज्ञात מַטָּע की पहचान
  choice: कृषि-बिंब के रूप में ‘नामी पौधा-वाटिका’
  alternative: मसीही शाखा/व्यक्ति अथवा केवल पुनर्स्थापित कृषि-समृद्धि
  rationale: इब्रानी पद स्वयं स्पष्ट नहीं करता कि यह रोपण किसी व्यक्ति, पुनर्स्थापित प्रजा या भूमि की उर्वरता को दर्शाता है। अनुवाद बिंब को बनाए रखकर किसी एक धर्मवैज्ञानिक व्याख्या को पाठ में आरोपित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण और सामान्य पाठक के लिए सहज शैली। ‘पौधा-वाटिका’ कृषि-बिंब को बनाए रखती है, जबकि पादटिप्पणियाँ दोनों कठिन इब्रानी पदों की शाब्दिकता और अनिश्चितता बताती हैं।
