  text: וַ/אֲנִ֣י יְהוָ֗ה אֶהְיֶ֤ה לָ/הֶם֙ לֵֽ/אלֹהִ֔ים וְ/עַבְדִּ֥/י דָוִ֖ד נָשִׂ֣יא בְ/תוֹכָ֑/ם אֲנִ֥י יְהוָ֖ה דִּבַּֽרְתִּי׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/034/024.yaml
  text: And I[a], Yahweh, will be their God, and my servant David will be prince among them. I, Yahweh, have spoken.
translation:
  language: hi
  text: और मैं, याहवे, उनका परमेश्वर होऊँगा, और मेरा सेवक दाऊद[a] उनके बीच प्रधान होगा। मैं याहवे ने कहा है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “मेरा सेवक दाऊद” प्रतिरूपात्मक या भविष्यसूचक रूप में आने वाले दाऊदवंशी शासक, अर्थात् मसीह, की ओर संकेत कर सकता है; इब्रानी पाठ में स्वयं “दाऊद” ही लिखा है।
    reason: वैकल्पिक व्याख्या
lexical_decisions:
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत नाम को उपाधि से बदलने के बजाय मानक हिन्दी लिप्यंतरण में रखा गया है।
- source_word: אֶהְיֶה לָהֶם לֵאלֹהִים
  choice: उनका परमेश्वर ठहरूँगा
  rationale: यह वाचा-संबंधी इब्रानी मुहावरा है। ‘ठहरूँगा’ भावी संबंध और गंभीर प्रतिज्ञा—दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: עַבְדִּי
  choice: मेरा सेवक
  rationale: राजकीय और वाचा-संबंधी प्रसंग में यह निष्ठापूर्ण सेवा की सम्मानसूचक उपाधि है; ‘दास’ की अपेक्षा ‘सेवक’ यहाँ अधिक उपयुक्त है।
- source_word: דָוִד
  choice: दाऊद
  rationale: इब्रानी व्यक्तिवाचक नाम का प्रचलित हिन्दी बाइबलीय रूप रखा गया है; मुख्य पाठ में इसकी व्याख्या जोड़कर पहचान निश्चित नहीं की गई।
- source_word: נָשִׂיא
  choice: प्रधान
  rationale: यह शब्द प्रमुख, अगुआ या शासक को सूचित कर सकता है। ‘प्रधान’ राजा से अलग पद को बनाए रखता है और हिन्दी में ‘राजकुमार’ के केवल राजा के पुत्र होने वाले संभावित अर्थ से बचाता है।
- source_word: בְתוֹכָם
  choice: उनके बीच
  rationale: समुदाय के मध्य उपस्थित और कार्यरत होने का स्थानवाचक भाव सरल आधुनिक हिन्दी में सुरक्षित है।
- source_word: דִּבַּרְתִּי
  choice: यह कह चुका हूँ
  rationale: इब्रानी पूर्ण क्रिया यहाँ गंभीर और निश्चित ईश्वरीय घोषणा का सूत्र है; यह रूप उस पूर्णता और निश्चय को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: ‘मेरा सेवक दाऊद’ में दाऊद की पहचान
  choice: मुख्य पाठ में केवल ‘दाऊद’ रखा गया है।
  alternative: ऐतिहासिक दाऊद का पुनर्जीवित रूप; आने वाला दाऊदवंशी शासक; अथवा दाऊद का महान वंशज मसीह।
  rationale: इब्रानी पाठ स्पष्ट रूप से ‘दाऊद’ कहता है, पर इस भविष्यसूचक नाम के सटीक अभिप्राय को स्वयं इसी पद में निश्चित नहीं करता। इसलिए मुख्य पाठ अस्पष्टता बनाए रखता है और मान्य मसीही व्याख्या को पाद-टिप्पणी में बताता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘प्रधान’ यहेजकेल में राजा से अलग נָשִׂיא की पदवी को बिना अनावश्यक राजनीतिक विशिष्टता जोड़े व्यक्त करता है।
