  yaml_path: translation/ot/ezekiel/034/019.yaml
  text: And my flock must graze on what your feet have trampled[b][a], and drink what your feet have muddied.
translation:
  language: hi
  text: और मेरे झुंड को तुम्हारे पैरों से रौंदी हुई चीज़ चरनी पड़ती है, और वह पानी पीना पड़ता है जिसे तुम्हारे पैरों ने गंदला कर दिया है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְצֹאנִי
  choice: और मेरा झुंड
  rationale: צֹאן भेड़-बकरियों के सामूहिक झुंड को दर्शाता है। चरवाहे के इस रूपक में ‘मेरा झुंड’ स्वाभाविक है और इब्रानी के सामूहिक भाव को बनाए रखता है।
- source_word: מִרְמַס רַגְלֵיכֶם
  choice: तुम्हारे पैरों से रौंदी हुई घास
  rationale: מִרְמַס का संबंध रौंदने या रौंदी हुई वस्तु से है। चरने के संदर्भ में ‘घास’ को स्पष्ट करना हिन्दी में चित्र को स्वाभाविक और बोधगम्य बनाता है।
- source_word: תִּרְעֶינָה
  choice: चरता है
  rationale: רעה का मूल अर्थ यहाँ पशुओं का चरना है। इब्रानी अपूर्ण काल परिणामस्वरूप बनी स्थिति बताता है; हिन्दी का सामान्य वर्तमान इस निरंतर दुर्दशा को सहज रूप में व्यक्त करता है, बिना बाध्यता का भाव अनावश्यक रूप से जोड़ने के।
- source_word: וּמִרְפַּשׂ רַגְלֵיכֶם
  choice: तुम्हारे पैरों से गंदला किया हुआ पानी
  rationale: מִרְפַּשׂ पैरों से हिलाकर गंदला या दूषित की गई वस्तु को दर्शाता है। पीने के संदर्भ से निहित ‘पानी’ को हिन्दी में स्पष्ट किया गया है।
- source_word: תִּשְׁתֶּינָה
  choice: पीता है
  rationale: שׁתה का सीधा अर्थ ‘पीना’ है। ‘झुंड’ हिन्दी में एकवचन सामूहिक संज्ञा है, इसलिए क्रिया एकवचन में रखी गई है।
