  text: אֶת הָ/אֹבֶ֤דֶת אֲבַקֵּשׁ֙ וְ/אֶת הַ/נִּדַּ֣חַת אָשִׁ֔יב וְ/לַ/נִּשְׁבֶּ֣רֶת אֶחֱבֹ֔שׁ וְ/אֶת הַ/חוֹלָ֖ה אֲחַזֵּ֑ק וְ/אֶת הַ/שְּׁמֵנָ֧ה וְ/אֶת הַ/חֲזָקָ֛ה אַשְׁמִ֖יד אֶרְעֶ֥/נָּה בְ/מִשְׁפָּֽט־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/034/016.yaml
  text: I will seek the lost[a], and I will bring back the strayed, and I will bind up the injured, and I will strengthen the sick; but the fat and the strong I will destroy. I will shepherd them with justice.
translation:
  language: hi
  text: मैं खोई हुई भेड़ों को ढूँढ़ूँगा, भटकी हुई भेड़ों को वापस लाऊँगा, घायल भेड़ों पर पट्टी बाँधूँगा और बीमार भेड़ों को बल दूँगा; पर मोटी और बलवान भेड़ों को नष्ट कर दूँगा। मैं न्यायपूर्वक उनकी चरवाही करूँगा।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मैं न्यायपूर्वक उन्हें खिलाऊँगा” अथवा “मैं न्यायपूर्वक उन्हें चराऊँगा।” इब्रानी क्रिया का अर्थ खिलाना, चराना या चरवाही करना हो सकता है।
    reason: रעה के चराना, खिलाना और चरवाही करना—इन संभव अर्थों को सुरक्षित रखना।
lexical_decisions:
- source_word: הָאֹבֶדֶת
  choice: खोई हुई
  rationale: यह स्त्रीलिंग एकवचन कृदंत भेड़ के लिए सामूहिक रूप से प्रयुक्त है। ‘खोई हुई’ चरवाही के प्रसंग में स्वाभाविक है और אבד के ‘नाश होती हुई’ अर्थ की अपेक्षा यहाँ खोजे जाने की छवि से अधिक सीधे मेल खाता है।
- source_word: אֲבַקֵּשׁ
  choice: मैं ... ढूँढ़ूँगा
  rationale: בקש का अर्थ खोजना या तलाश करना है। ‘ढूँढ़ूँगा’ आधुनिक हिन्दी में सहज है और खोई भेड़ को खोजने की क्रिया स्पष्ट करता है।
- source_word: הַנִּדַּחַת
  choice: भटकी हुई
  rationale: נדח में दूर हटा दी गई, तितर-बितर हुई या भटकी हुई होने का भाव हो सकता है। भेड़ के रूपक में ‘भटकी हुई’ परिणाम को स्वाभाविक हिन्दी में व्यक्त करता है, यद्यपि कारण को निर्दिष्ट नहीं करता।
- source_word: אָשִׁיב
  choice: वापस लाऊँगा
  rationale: שוב का हिफ़ील रूप यहाँ किसी को लौटाकर लाने का कारणवाचक अर्थ देता है। यह चरवाहे द्वारा भेड़ को वापस लाने के लिए उपयुक्त है।
- source_word: לַנִּשְׁבֶּרֶת
  choice: घायल को
  rationale: शाब्दिक भाव ‘टूटी हुई’ है, पर शरीर की क्षति और पट्टी बाँधने के संदर्भ में ‘घायल’ स्वाभाविक और अर्थसंगत है।
- source_word: אֶחֱבֹשׁ
  choice: पट्टी बाँधूँगा
  rationale: חבש यहाँ घाव पर पट्टी बाँधने को दर्शाता है। यह हिन्दी में स्पष्ट और प्रचलित अभिव्यक्ति है।
- source_word: הַחוֹלָה
  choice: बीमार को
  rationale: חלה का सीधा अर्थ बीमार या रोगी होना है। ‘बीमार’ इसे अगले ‘बलवान’ से अलग बनाए रखता है।
- source_word: אֲחַזֵּק
  choice: बल दूँगा
  rationale: חזק के पिएल रूप का अर्थ बलवान करना या सहारा देना है। ‘बल दूँगा’ आधुनिक हिन्दी में संक्षिप्त और स्वाभाविक है।
- source_word: הַשְּׁמֵנָה
  choice: मोटी
  rationale: मूल शब्द का शाब्दिक अर्थ ‘मोटी’ है। यह अध्याय में अतिपोषित और विशेषाधिकार प्राप्त भेड़ों की तीखी छवि को बनाए रखता है।
- source_word: הַחֲזָקָה
  choice: बलवान
  rationale: विशेषण का अर्थ मजबूत या बलवान है। ‘बलवान’ दुर्बल भेड़ों के साथ निहित विरोध को बनाए रखता है।
- source_word: אַשְׁמִיד
  choice: नष्ट कर दूँगा
  rationale: שמד के हिफ़ील रूप का सामान्य अर्थ नष्ट करना है। यह मूल की कठोर न्यायात्मक भाषा को कम नहीं करता।
- source_word: אֶרְעֶנָּה
  choice: मैं ... उनकी चरवाही करूँगा
  rationale: רעה का अर्थ चराना, खिलाना या चरवाही करना हो सकता है। पूरे अध्याय के चरवाहे-विषय को देखते हुए ‘चरवाही करूँगा’ देखभाल और शासन दोनों के व्यापक भाव को बनाए रखता है।
- source_word: בְמִשְׁפָּט
  choice: न्याय के साथ
  rationale: משפט यहाँ न्यायपूर्ण व्यवस्था अथवा न्यायिक निर्णय का भाव रखता है। ‘न्याय के साथ’ इस व्यापकता को बनाए रखता है।
theological_decisions:
- issue: अंतिम वाक्य में चरवाही और न्याय के संयुक्त भाव को कैसे व्यक्त किया जाए
  choice: मैं न्याय के साथ उनकी चरवाही करूँगा
  alternative: मैं न्यायपूर्वक उन्हें चराऊँगा / मैं न्याय में उन्हें खिलाऊँगा
  rationale: पद दुर्बल भेड़ों की दयालु पुनर्स्थापना और मोटी तथा बलवान भेड़ों के विरुद्ध न्याय—दोनों को साथ रखता है। ‘चरवाही’ רעה के व्यापक शासकीय और पालन-पोषण संबंधी अर्थ को सुरक्षित रखती है, जबकि ‘न्याय’ משפט को केवल दंड तक सीमित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सहज रखी गई है। स्त्रीलिंग एकवचन रूप भेड़ को सामूहिक रूप से दर्शाते हैं; हिन्दी में ‘खोई हुई’, ‘भटकी हुई’, ‘मोटी’ और ‘बलवान’ से इस रूपक को बनाए रखा गया है। अंतिम क्रिया की वास्तविक शाब्दिक व्यापकता फुटनोट में दी गई है।
