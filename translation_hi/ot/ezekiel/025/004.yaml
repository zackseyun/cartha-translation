base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/025/004.yaml
  text: Therefore, look, I am giving you to the sons of the east as a possession, and they will set their encampments in you and place their dwellings in you. They will eat your fruit, and they will drink your milk.
translation:
  language: hi
  text: इसलिए देख, मैं तुझे पूरब के लोगों के अधिकार में दे रहा हूँ। वे तेरे यहाँ अपने डेरे डालेंगे और तेरे यहाँ अपने निवास स्थापित करेंगे। वे तेरा फल खाएँगे और तेरा दूध पिएँगे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְנֵי קֶדֶם
  choice: पूरब के लोग
  rationale: इब्रानी मुहावरे ‘पूरब के पुत्र’ का स्वाभाविक हिन्दी अर्थ; यहाँ पूर्व दिशा में रहने वाले जनसमूह अभिप्रेत हैं।
- source_word: לְמוֹרָשָׁה
  choice: अधिकार में
  rationale: यह किसी वस्तु या भूभाग को कब्ज़े और उपभोग के लिए सौंपे जाने का भाव व्यक्त करता है; ‘विरासत’ यहाँ हिन्दी में अनावश्यक रूप से उत्तराधिकार का अर्थ दे सकती है।
- source_word: טִירוֹתֵיהֶם
  choice: अपने डेरे
  rationale: इस संदर्भ में यह शब्द घुमंतू लोगों की छावनियों या डेरे-बस्तियों को सूचित करता है; ‘डेरे’ सहज और प्रसंगानुकूल है।
- source_word: מִשְׁכְּנֵיהֶם
  choice: अपने निवास
  rationale: डेरे डालने के समानांतर स्थायी या रहने के स्थान बनाने का सामान्य भाव बनाए रखता है।
- source_word: חֲלָבֵךְ
  choice: तेरा दूध
  rationale: मूल का प्रत्यक्ष कृषि-पशुपालक चित्र सुरक्षित रखा गया है।
theological_decisions:
- issue: न्याय की घोषणा में परमेश्वर की सक्रिय भूमिका
  choice: मैं तुझे ... अधिकार में दे रहा हूँ
  alternative: तू ... के अधिकार में चली जाएगी
  rationale: मूल पाठ प्रथम पुरुष में परमेश्वर की सक्रिय कार्रवाई को स्पष्ट रूप से व्यक्त करता है; उसे निष्क्रिय परिणाम में नहीं बदला गया।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी। अम्मोन को संबोधित स्त्रीलिंग एकवचन ‘तुझे/तेरा’ सुरक्षित रखा गया है। ‘देख’ ने הִנְנִי की ध्यान आकर्षित करने वाली शक्ति को संक्षेप में व्यक्त किया है।
