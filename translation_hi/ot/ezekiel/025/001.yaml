  text: And the word of Yahweh came to me[a], saying,
translation:
  language: hi
  text: 'और याहवे का वचन मेरे पास पहुँचा:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: और ... पहुँचा
  rationale: वाव-क्रमागत रूप अगले भविष्यवाणी-खंड को कथा-प्रवाह से जोड़ता है। हिन्दी में ‘और ... पहुँचा’ स्वाभाविक है और ‘ऐसा हुआ’ जैसी अनावश्यक शाब्दिकता से बचता है।
- source_word: דְבַר
  choice: का वचन
  rationale: भविष्यवाणी के सूत्र में דָּבָר परमेश्वर के बोले हुए वचन या संदेश को दर्शाता है। ‘वचन’ इस औपचारिक धार्मिक प्रयोग को स्पष्ट और संक्षिप्त रूप से बनाए रखता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: मूल पाठ में परमेश्वर का व्यक्तिगत नाम YHWH है। आधुनिक हिन्दी बाइबल-परंपरा में प्रचलित लिप्यंतरण ‘यहोवा’ नाम को किसी उपाधि से बदलने के बजाय नाम के रूप में प्रस्तुत करता है।
- source_word: אֵלַי
  choice: मेरे पास
  rationale: अֶל के प्रथम पुरुष एकवचन प्रत्यय का अर्थ ‘मेरी ओर/मेरे पास’ है। वचन के आने के हिन्दी मुहावरे में ‘मेरे पास’ स्वाभाविक है।
- source_word: לֵאמֹר
  choice: ':'
  rationale: यह infinitive construct अगले पद में आने वाली प्रत्यक्ष वाणी का परिचय देता है। हिन्दी में पूर्वसूचक द्विबिंदु वही कार्य अधिक स्वाभाविक रूप से करता है; ‘यह कहते हुए’ इस छोटे सूत्र में भारी लगता।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: मूल में चार-अक्षरीय व्यक्तिगत नाम सीधे प्रयुक्त है। ‘यहोवा’ हिन्दी में परिचित नामरूप है और ‘प्रभु’ उपाधि से मूल नाम को प्रतिस्थापित नहीं करता; स्वरांकन अनिश्चित होने के कारण पादटिप्पणी में YHWH भी दिया गया है।
- issue: לֵאמֹר को स्पष्ट क्रिया से या विराम-चिह्न से व्यक्त करना
  choice: द्विबिंदु
  alternative: यह कहते हुए
  rationale: अगले पद की प्रत्यक्ष वाणी का परिचय हिन्दी में द्विबिंदु से साफ़ और सहज रूप से होता है। इससे सूत्र का आशय सुरक्षित रहता है, जबकि ऐसी पृथक बोलने की क्रिया नहीं जोड़ी जाती जो हिन्दी में अस्वाभाविक लगे।
translation_notes:
  register: आधुनिक मानक हिन्दी; संक्षिप्त, गरिमापूर्ण भविष्यवाणी-सूत्र। ‘वचन मेरे पास पहुँचा’ सहज हिन्दी रखते हुए मूल के ‘वचन ... मेरी ओर आया’ भाव को सुरक्षित करता है।
