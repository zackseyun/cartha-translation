  text: וְ/נָתַתִּ֤י אֶת רַבָּה֙ לִ/נְוֵ֣ה גְמַלִּ֔ים וְ/אֶת בְּנֵ֥י עַמּ֖וֹן לְ/מִרְבַּץ צֹ֑אן וִֽ/ידַעְתֶּ֖ם כִּֽי אֲנִ֥י יְהוָֽה־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/025/005.yaml
  text: And I will make Rabbah a pasture for camels[a], and the Ammonites a resting place for flocks[c][b]; then you will know that I am Yahweh.
translation:
  language: hi
  text: मैं रब्बाह को ऊँटों का चरागाह[a] और अम्मोनियों को भेड़-बकरियों के झुंडों का विश्राम-स्थान[b][c] बना दूँगा। तब तुम जानोगे कि मैं याहवे हूँ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘ऊँटों का बसेरा’ अथवा ‘ऊँटों का निवास-स्थान।’
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में शाब्दिक रूप से, ‘अम्मोन के पुत्र।’
    reason: lexical_alternative
  - marker: c
    text: या, ‘भेड़-बकरियों के झुंडों के लेटने का स्थान।’
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתִּי
  choice: मैं ... बना दूँगा
  rationale: मूल क्रिया का शाब्दिक अर्थ ‘देना’ है, पर स्थान और परिणामी अवस्था वाले इस वाक्य-विन्यास में इसका स्वाभाविक अर्थ किसी स्थान को किसी उपयोग या दशा में बदल देना है।
- source_word: רַבָּה
  choice: रब्बाह
  rationale: यह अम्मोन की राजधानी का व्यक्तिवाचक नाम है, इसलिए इसका लिप्यंतरण किया गया है।
- source_word: לִנְוֵה גְמַלִּים
  choice: ऊँटों की चरागाह
  rationale: נָוֶה निवास, बसेरा या चरागाह का अर्थ दे सकता है। ऊँटों के पशुपालकीय संदर्भ में ‘चरागाह’ स्पष्ट और स्वाभाविक है, जबकि अन्य संभावनाएँ पादटिप्पणी में सुरक्षित हैं।
- source_word: בְּנֵי עַמּוֹן
  choice: अम्मोनियों के देश
  rationale: शाब्दिक रूप ‘अम्मोन के पुत्र’ है और सामान्य अर्थ अम्मोनी लोग है। क्योंकि उन्हें पशुओं के विश्राम-स्थान में बदलना स्थानवाचक रूपक है, हिन्दी में ‘अम्मोनियों के देश’ उस निहित भौगोलिक संदर्भ को स्पष्ट करता है; शाब्दिक रूप पादटिप्पणी में दिया गया है।
- source_word: לְמִרְבַּץ
  choice: विश्राम की जगह
  rationale: यह उस स्थान को सूचित करता है जहाँ पशु लेटते या विश्राम करते हैं। ‘बाड़ा’ अनावश्यक रूप से घिरे हुए स्थान का अर्थ जोड़ सकता है।
- source_word: צֹאן
  choice: भेड़-बकरियों के झुंडों
  rationale: यह सामूहिक संज्ञा छोटे पालतू पशुओं, विशेषकर भेड़ों और बकरियों, को सूचित करती है। यह हिन्दी रूप अर्थ को सामान्य पाठक के लिए स्पष्ट रखता है।
- source_word: וִידַעְתֶּם
  choice: तब तुम जानोगे
  rationale: भविष्यसूचक कथन में संयोजक के साथ यह पूर्ववर्ती न्याय के परिणाम को व्यक्त करता है; ‘तब’ उस संबंध को स्वाभाविक हिन्दी में दिखाता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: इब्रानी चतुरक्षरीय दिव्य नाम को किसी उपाधि से बदलने के बजाय हिन्दी में प्रचलित नामरूप ‘यहोवा’ से प्रस्तुत किया गया है।
theological_decisions:
- issue: दिव्य नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: मूल पाठ में निजी दिव्य नाम सीधे आया है। हिन्दी के सामान्य बाइबलीय प्रयोग में पहचाने जाने वाले ‘यहोवा’ को रखकर नाम और उपाधि का भेद सुरक्षित रखा गया है।
- issue: בְּנֵי עַמּוֹן में लोग और भूभाग का संबंध
  choice: अम्मोनियों के देश
  alternative: अम्मोनी; अम्मोन के पुत्र
  rationale: वाक्य में समानांतर पद दोनों भूभागों को पशुओं के उपयोग का स्थान बनाते हैं। इसलिए स्थानवाचक आशय स्पष्ट किया गया है, पर मूल का शाब्दिक जातिवाचक रूप पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल किंतु गरिमापूर्ण भविष्यसूचक शैली अपनाई गई है। पशुपालकीय चित्र को स्पष्ट रखने के लिए ‘भेड़-बकरियों के झुंड’ कहा गया है। पादटिप्पणी [b] को उस पूरे स्थानवाचक कथन के बाद रखा गया है जिसे वह स्पष्ट करती है।
