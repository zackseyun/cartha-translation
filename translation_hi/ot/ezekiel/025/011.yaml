  yaml_path: translation/ot/ezekiel/025/011.yaml
  text: And in Moab I will execute judgments[a], and they will know that I am Yahweh.
translation:
  language: hi
  text: और मोआब में मैं न्याय के कार्य करूँगा, और वे जान लेंगे कि मैं यहोवा हूँ।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/בְ/מוֹאָב
  choice: और मोआब में
  rationale: בְּ का सीधा अर्थ यहाँ उस क्षेत्र को दर्शाता है जहाँ न्याय किया जाएगा; ‘मोआब के विरुद्ध’ संदर्भानुकूल है, पर मूल पूर्वसर्ग से अधिक व्याख्यात्मक होता।
- source_word: אֶעֱשֶׂה שְׁפָטִים
  choice: मैं दण्ड के न्याय करूँगा
  rationale: עשה और שׁפטים का संयोग न्यायिक कार्रवाई और दण्ड लागू करने का भाव देता है। यह अनुवाद बहुवचन ‘न्यायों’ की धारणा को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וְ/יָדְעוּ
  choice: और वे जान लेंगे
  rationale: संदर्भ में पूर्ण क्रिया का भाव भावी परिणाम का है; ‘जान लेंगे’ इस परिणामात्मक अर्थ को स्वाभाविक हिन्दी में देता है।
- source_word: כִּי
  choice: कि
  rationale: यह शब्द यहाँ उस बात का विषय प्रस्तुत करता है जिसे वे जानेंगे।
- source_word: אֲנִי יְהוָה
  choice: मैं यहोवा हूँ
  rationale: स्पष्ट सर्वनाम אֲנִי का बल बनाए रखा गया है और יהוה को हिन्दी में प्रचलित नामरूप ‘यहोवा’ से व्यक्त किया गया है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: मूल पाठ में निजी वाचा-नाम सीधे प्रयुक्त है। ‘यहोवा’ आधुनिक हिन्दी बाइबलीय प्रयोग में व्यापक रूप से पहचाना जाता है और नाम को उपाधि ‘प्रभु’ में बदलने से बचाता है; ‘याहवे’ अधिक संभावित विद्वत्तापरक उच्चारण है, पर हिन्दी पाठकों में अपेक्षाकृत कम परिचित है।
- issue: שְׁפָטִים का न्यायिक-दण्डात्मक भाव
  choice: दण्ड के न्याय
  alternative: न्याय; दण्ड
  rationale: बहुवचन संज्ञा न्यायिक निर्णयों के साथ उनके दण्डात्मक क्रियान्वयन का संकेत देती है। केवल ‘न्याय’ दण्डात्मक संदर्भ को मंद कर सकता है, जबकि केवल ‘दण्ड’ न्यायिक शब्दावली को खो देता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। वाक्य-संरचना मूल की दो समन्वित धाराओं को बनाए रखती है।
