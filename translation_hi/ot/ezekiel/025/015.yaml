source:
  edition: WLC
  text: כֹּ֤ה אָמַר֙ אֲדֹנָ֣/י יְהוִ֔ה יַ֛עַן עֲשׂ֥וֹת פְּלִשְׁתִּ֖ים בִּ/נְקָמָ֑ה וַ/יִּנָּקְמ֤וּ נָקָם֙ בִּ/שְׁאָ֣ט בְּ/נֶ֔פֶשׁ לְ/מַשְׁחִ֖ית אֵיבַ֥ת עוֹלָֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/025/015.yaml
  text: 'Thus says the Lord GOD: Because the Philistines acted in vengeance and took revenge with contempt in the soul[a], to destroy with everlasting enmity[b],'
translation:
  language: hi
  text: 'प्रभु यहोवा[a] यों कहता है: क्योंकि पलिश्तियों ने बदला लेने की भावना से काम किया और मन में तिरस्कार रखकर प्रतिशोध लिया, ताकि अपनी पुरानी शत्रुता[b] के कारण विनाश करें,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “प्रभु परमेश्वर।” यहाँ इब्रानी में אֲדֹנָי יְהוִה है, जिसमें ‘प्रभु’ के साथ परमेश्वर का वाचा-नाम यहोवा आता है।
    reason: divine_name
  - marker: b
    text: या “सदा की शत्रुता” अथवा “चिरस्थायी बैर।” इब्रानी עוֹלָם का अर्थ प्रसंग के अनुसार बहुत पुराना या निरंतर बना रहने वाला हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  choice: प्रभु यहोवा
  rationale: यह संयुक्त ईश्वरीय उपाधि אֲדֹנָי और वाचा-नाम יהוה को अलग-अलग और स्वाभाविक हिन्दी में व्यक्त करती है।
- source_word: יַעַן עֲשׂוֹת פְּלִשְׁתִּים בִּנְקָמָה
  choice: क्योंकि पलिश्तियों ने बदला लेने की भावना से काम किया
  rationale: יַעַן का कारणसूचक बल और בִּנְקָמָה का प्रतिशोधात्मक भाव सहज आधुनिक हिन्दी में सुरक्षित रहता है।
- source_word: וַיִּנָּקְמוּ נָקָם
  choice: प्रतिशोध लिया
  rationale: एक ही धातु से बने क्रिया-संज्ञा संयोजन के प्रबल प्रतिकारात्मक अर्थ को संक्षिप्त, गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: בִּשְׁאָט בְּנֶפֶשׁ
  choice: मन में तिरस्कार रखकर
  rationale: שְׁאָט के तिरस्कार और נֶפֶשׁ द्वारा सूचित भीतरी, संपूर्ण व्यक्ति की मनोवृत्ति—दोनों को स्वाभाविक रूप से रखता है।
- source_word: לְמַשְׁחִית
  choice: ताकि ... विनाश करें
  rationale: लामेद के प्रयोजनसूचक अर्थ और משׁחית के विनाशकारी आशय को स्पष्ट करता है।
- source_word: אֵיבַת עוֹלָם
  choice: पुरानी शत्रुता
  rationale: इस प्रसंग में עוֹלָם को दूर अतीत से चली आ रही शत्रुता के रूप में पढ़ता है, जबकि इसकी चिरस्थायी अर्थ-संभावना पादटिप्पणी में सुरक्षित है।
theological_decisions:
- issue: אֲדֹנָי יְהוִה में ईश्वरीय नाम का अनुवाद
  choice: प्रभु यहोवा
  alternative: प्रभु परमेश्वर
  rationale: मूल में उपस्थित व्यक्तिगत वाचा-नाम יהוה को सामान्य उपाधि में विलीन न करके प्रचलित हिन्दी रूप ‘यहोवा’ से व्यक्त किया गया है।
- issue: אֵיבַת עוֹלָם की कालगत व्याख्या
  choice: पुरानी शत्रुता
  alternative: सदा की शत्रुता
  rationale: עוֹלָם प्राचीन काल से चली आ रही या निरंतर बनी रहने वाली अवधि, दोनों सूचित कर सकता है; मुख्य पाठ में ऐतिहासिक दीर्घता चुनी गई है और दूसरा अर्थ पादटिप्पणी में रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, स्पष्ट भविष्यद्वाणी-संबंधी गद्य। ‘यों कहता है’ बाइबलीय उद्घोषणा की परिचित शैली रखता है; ‘मन में तिरस्कार रखकर’ शाब्दिक कठोरता से बचते हुए मूल की भीतरी मनोवृत्ति को व्यक्त करता है।
