  text: לָ/כֵ֗ן כֹּ֤ה אָמַר֙ אֲדֹנָ֣/י יְהוִ֔ה וְ/נָטִ֤תִי יָדִ/י֙ עַל אֱד֔וֹם וְ/הִכְרַתִּ֥י מִמֶּ֖/נָּה אָדָ֣ם וּ/בְהֵמָ֑ה וּ/נְתַתִּ֤י/הָ חָרְבָּה֙ מִ/תֵּימָ֔ן וּ/דְדָ֖נֶ/ה בַּ/חֶ֥רֶב יִפֹּֽלוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/025/013.yaml
  text: 'Therefore thus says the Lord GOD: I will stretch out my hand against Edom[a], and I will cut off from it man and beast, and I will make it a desolation; from Teman even to Dedan they will fall by the sword.'
translation:
  language: hi
  text: 'इसलिए प्रभु याहवे यह कहते हैं: “मैं एदोम के विरुद्ध अपना हाथ बढ़ाऊँगा और उसमें से मनुष्य और पशु, दोनों को मिटा दूँगा। मैं उसे उजाड़ दूँगा; तेमान से लेकर ददान तक[a] वे तलवार से गिरेंगे।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “ददान की ओर।” इब्रानी पदबंध तेमान से ददान तक एदोम के उजाड़े जाने की सीमा बताता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  choice: प्रभु याहवे
  rationale: अֲדֹנָי को ‘प्रभु’ और परमेश्वर के व्यक्तिगत वाचा-नाम יְהוִה को ‘याहवे’ के रूप में रखा गया है; इससे संयुक्त उपाधि का भेद और स्रोत का स्वरूप बना रहता है।
- source_word: וְנָטִתִי יָדִי
  choice: मैं ... अपना हाथ बढ़ाऊँगा
  rationale: यह न्याय के लिए सक्रिय हस्तक्षेप का इब्रानी मुहावरा है। ‘हाथ बढ़ाना’ उसके मूल बिंब को स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: וְהִכְרַתִּי
  choice: मिटा दूँगा
  rationale: כרת यहाँ किसी प्रदेश से जीवित प्राणियों को पूर्णतः हटा देने के न्यायसूचक अर्थ में है। ‘मिटा दूँगा’ आधुनिक हिन्दी में स्पष्ट है और ‘नाश करूँगा’ की अपेक्षा ‘उसमें से’ के साथ अधिक स्वाभाविक बैठता है।
- source_word: אָדָם וּבְהֵמָה
  choice: मनुष्य और पशु, दोनों
  rationale: यह जोड़ी मानव निवासियों और पशुओं को समाविष्ट करती है। ‘दोनों’ विनाश की व्यापकता को स्पष्ट करता है, बिना अर्थ बढ़ाए।
- source_word: וּנְתַתִּיהָ חָרְבָּה
  choice: मैं उसे उजाड़ दूँगा
  rationale: इस कारक रचना का आशय एदोम को उजाड़ अवस्था में पहुँचा देना है। यह हिन्दी में स्वाभाविक रहते हुए חָרְבָּה का भाव रखती है।
- source_word: מִתֵּימָן
  choice: तेमान से
  rationale: तेमान एदोम का स्थान-नाम है; इसलिए इसे ‘दक्षिण’ के रूप में अनूदित करने के बजाय लिप्यंतरित किया गया है।
- source_word: וּדְדָנֶה
  choice: लेकर ददान तक
  rationale: दिशासूचक ה इस विनाश की भौगोलिक सीमा ददान की ओर या ददान तक बताता है। हिन्दी का ‘से लेकर ... तक’ इस विस्तार को स्पष्ट और सहज रूप में व्यक्त करता है।
- source_word: בַּחֶרֶב יִפֹּלוּ
  choice: वे तलवार से गिरेंगे
  rationale: ‘तलवार से गिरना’ युद्ध में मारे जाने का मूल न्यायसूचक मुहावरा और उसका गंभीर स्वर सुरक्षित रखता है।
theological_decisions:
- issue: संयुक्त ईश्वरीय उपाधि אֲדֹנָי יְהוִה का अनुवाद
  choice: प्रभु याहवे
  alternative: प्रभु परमेश्वर
  rationale: मूल पाठ में वाचा-नाम יְהוִה स्पष्ट रूप से उपस्थित है। ‘याहवे’ उसे सामान्य उपाधि में विलीन किए बिना सुरक्षित रखता है, जबकि אֲדֹנָי को ‘प्रभु’ कहा गया है।
- issue: בַּחֶרֶב יִפֹּלוּ में मृत्यु का संकेत
  choice: वे तलवार से गिरेंगे
  alternative: वे तलवार से मारे जाएँगे
  rationale: संदर्भ में मृत्यु अभिप्रेत है, पर मूल पाठ ‘गिरेंगे’ का मुहावरा प्रयोग करता है। चुना हुआ रूप इस बिंब को बनाए रखता है और उसका निहितार्थ पाठक के लिए समझने योग्य है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। न्याय से जुड़े इब्रानी बिंब—‘हाथ बढ़ाना’ और ‘तलवार से गिरना’—सुरक्षित रखे गए हैं। फुटनोट चिह्न संबंधित भौगोलिक पदबंध के बाद रखा गया है।
