source:
  edition: WLC
  text: וְ/נָתַתִּ֨י אֶת נִקְמָתִ֜/י בֶּ/אֱד֗וֹם בְּ/יַד֙ עַמִּ֣/י יִשְׂרָאֵ֔ל וְ/עָשׂ֣וּ בֶ/אֱד֔וֹם כְּ/אַפִּ֖/י וְ/כַ/חֲמָתִ֑/י וְ/יָֽדְעוּ֙ אֶת נִקְמָתִ֔/י נְאֻ֖ם אֲדֹנָ֥/י יְהוִֽה־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/025/014.yaml
  text: And I will set my vengeance on Edom by the hand of my people Israel[a], and they will deal with Edom according to my anger and according to my wrath; and they will know my vengeance[c][b], declares the Lord GOD.
translation:
  language: hi
  text: और मैं अपने लोगों इस्राएल के द्वारा एदोम से अपना प्रतिशोध लूँगा[a]। वे एदोम के विरुद्ध मेरे क्रोध और मेरे रोष के अनुसार कार्य करेंगे[b]; और वे मेरे प्रतिशोध को जानेंगे[c]—प्रभु यहोवा की यह घोषणा है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक अर्थ: “मैं अपने लोगों इस्राएल के हाथ से एदोम पर अपना प्रतिशोध रखूँगा।” “के हाथ से” यहाँ “के द्वारा” के अर्थ में साधनवाचक मुहावरा है।'
    reason: मूल इब्रानी बिंब और साधनवाचक मुहावरे को स्पष्ट करना।
  - marker: b
    text: 'या “वे एदोम के साथ व्यवहार करेंगे।” इब्रानी क्रिया का अर्थ व्यापक है: “करना, बनाना, कार्य करना।”'
    reason: क्रिया के अर्थ-विस्तार को सुरक्षित रखना और अनावश्यक रूप से दंड-विधान निर्दिष्ट न करना।
  - marker: c
    text: 'शाब्दिक अर्थ: “वे मेरे प्रतिशोध को जानेंगे”; अर्थात वे उसका अनुभव करके उसे पहचानेंगे।'
    reason: ידע के अनुभवजन्य भाव और मूल की प्रत्यक्ष कर्म-संरचना को स्पष्ट करना।
lexical_decisions:
- source_word: וְנָתַתִּי אֶת נִקְמָתִי בֶּאֱדוֹם
  choice: मैं ... एदोम से अपना बदला लूँगा
  rationale: शाब्दिक संरचना ‘अपना बदला एदोम पर रखूँगा/दूँगा’ हिन्दी में अस्वाभाविक है। ‘एदोम से अपना बदला लूँगा’ נתן और נקמה के संयुक्त न्याय-संदर्भ को स्वाभाविक रूप में व्यक्त करता है।
- source_word: בְּיַד עַמִּי יִשְׂרָאֵל
  choice: अपने लोगों, इस्राएल, के हाथ से
  rationale: यह साधन बताने वाला इब्रानी मुहावरा है। ‘के हाथ से’ मूल बिंब को रखते हुए दिखाता है कि परमेश्वर इस्राएल को अपने न्याय का माध्यम बनाएगा।
- source_word: וְעָשׂוּ בֶאֱדוֹם
  choice: वे ... एदोम के साथ व्यवहार करेंगे
  rationale: עשה व्यापक क्रिया है—‘करना/कार्य करना’। ‘व्यवहार करेंगे’ शत्रुतापूर्ण संदर्भ में स्वाभाविक है और मूल से अधिक विशिष्ट ‘दण्ड देंगे’ या ‘न्याय करेंगे’ नहीं जोड़ता।
- source_word: כְּאַפִּי וְכַחֲמָתִי
  choice: मेरे क्रोध और मेरी जलजलाहट के अनुसार
  rationale: ‘क्रोध’ और ‘जलजलाहट’ אף तथा חמה के निकटार्थी किंतु तीव्रता बढ़ाने वाले युग्म को अलग-अलग बनाए रखते हैं।
- source_word: וְיָדְעוּ אֶת נִקְמָתִי
  choice: तब वे जानेंगे कि मेरा बदला क्या होता है
  rationale: शाब्दिक ‘वे मेरे बदले को जानेंगे’ हिन्दी में कठिन है। यह रूप अनुभव द्वारा पहचानने के भाव को स्पष्ट करता है, बिना उसके परिणाम को अनावश्यक रूप से निर्दिष्ट किए।
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: प्रभु यहोवा की यह घोषणा है
  rationale: נְאֻם को भविष्यद्वाणी-सूत्र के रूप में ‘घोषणा’ और אֲדֹנָי יְהוִה को नाम सहित ‘प्रभु यहोवा’ किया गया है; इससे ‘प्रभु प्रभु’ जैसी पुनरुक्ति से बचते हुए दिव्य नाम सुरक्षित रहता है।
theological_decisions:
- issue: एदोम के न्याय में परमेश्वर और इस्राएल की भूमिका
  choice: बदला परमेश्वर का है और इस्राएल उसका मानवीय माध्यम है
  alternative: इस्राएल स्वतंत्र रूप से बदला लेता है, अथवा परमेश्वर बिना मानवीय माध्यम के अकेले कार्य करता है
  rationale: पहला खंड दिव्य कर्तृत्व (‘मैं ... अपना बदला लूँगा’) और साधन (‘अपने लोगों ... के हाथ से’) दोनों को स्पष्ट रखता है।
- issue: אֲדֹנָי יְהוִה में दिव्य नाम
  choice: प्रभु यहोवा
  alternative: प्रभु परमेश्वर; प्रभु याहवे
  rationale: ‘यहोवा’ हिन्दी बाइबलीय प्रयोग में पहचाना जाने वाला नाम-रूप है और मूल के व्यक्तिवाचक दिव्य नाम को सामान्य उपाधि में नहीं बदलता।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी। ‘बदला’, ‘क्रोध’ और ‘जलजलाहट’ न्याय-वाणी की कठोरता को नरम किए बिना रखते हैं। सभी पादटिप्पणी-चिह्न मुख्य पाठ में क्रम से उपस्थित हैं।
