  text: וְ/עָשִׂ֤יתִי בָ/ם֙ נְקָמ֣וֹת גְּדֹל֔וֹת בְּ/תוֹכְח֖וֹת חֵמָ֑ה וְ/יָֽדְעוּ֙ כִּֽי אֲנִ֣י יְהוָ֔ה בְּ/תִתִּ֥/י אֶת נִקְמָתִ֖/י בָּֽ/ם־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/025/017.yaml
  text: And I will execute great acts of vengeance on them with wrathful rebukes[a], and they will know that I am Yahweh when I lay my vengeance on them.
translation:
  language: hi
  text: और मैं उन पर क्रोधपूर्ण ताड़नाओं के साथ प्रतिशोध के बड़े-बड़े कार्य करूँगा[a]। जब मैं उन पर अपना प्रतिशोध लाऊँगा, तब वे जान लेंगे कि मैं याहवे हूँ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “क्रोधभरी डाँटों के साथ” अथवा “क्रोधपूर्ण दंडों के साथ।” इब्रानी पदबंध में डाँट या सुधार और दंडात्मक ताड़ना, दोनों की अर्थ-छाया हो सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשִׂיתִי בָם נְקָמוֹת גְּדֹלוֹת
  choice: मैं उन पर ... बदला लेने के बड़े-बड़े काम करूँगा
  rationale: עשה के व्यापक अर्थ को נקמות के साथ न्याय-संदर्भ में स्वाभाविक हिंदी मुहावरे द्वारा व्यक्त किया गया है। נקמות का बहुवचन ‘बड़े-बड़े काम’ में बना रहता है।
- source_word: בְּתוֹכְחוֹת חֵמָה
  choice: क्रोध से भरी कठोर ताड़नाओं के साथ
  rationale: תוכחות में डाँट, सुधार और दंडात्मक ताड़ना की अर्थ-छाया है; חמה तीव्र क्रोध दर्शाता है। यह चयन न्याय-संदर्भ की दंडात्मक शक्ति रखता है, जबकि पादटिप्पणी वास्तविक अर्थ-विस्तार सुरक्षित रखती है।
- source_word: וְיָדְעוּ כִּי אֲנִי יְהוָה
  choice: तो वे जान लेंगे कि मैं यहोवा हूँ
  rationale: यहेजकेल के परिचय-सूत्र को स्पष्ट और स्वाभाविक आधुनिक हिंदी में रखा गया है; וְ को परिणामसूचक ‘तो’ से व्यक्त किया गया है।
- source_word: בְּתִתִּי אֶת נִקְמָתִי בָּם
  choice: जब मैं उनसे अपना बदला लूँगा
  rationale: נתן के शाब्दिक ‘देना/रखना’ को נקמה के साथ हिंदी के स्वाभाविक मुहावरे ‘बदला लेना’ में व्यक्त किया गया है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिंदी पाठकों में प्रचलित देवनागरी रूप द्वारा परमेश्वर के व्यक्तिगत नाम को शीर्षक से प्रतिस्थापित किए बिना रखा गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का प्रतिपादन
  choice: यहोवा
  alternative: याहवे
  rationale: मुख्य पाठ में व्यक्तिगत नाम रखा गया है। ‘यहोवा’ आधुनिक हिंदी बाइबल-परंपरा में अधिक पहचाना जाने वाला रूप है; इसे ‘प्रभु’ जैसे शीर्षक से नहीं बदला गया।
- issue: נקמה का नैतिक-न्यायिक स्वर
  choice: बदला
  alternative: प्रतिशोध / दंड
  rationale: ‘बदला’ मूल शब्द की प्रत्यक्ष शक्ति रखता है और पाठ में ईश्वरीय न्याय की कठोरता को नरम नहीं करता; ‘दंड’ कहने से प्रतिशोध का तत्व घट सकता था।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘बड़े-बड़े काम’ मूल के बहुवचन को दर्शाता है, और ‘कठोर ताड़नाएँ’ भविष्यद्वाणी के न्याय-संदर्भ को बनाए रखती हैं।
