  text: לִ/בְנֵי קֶ֨דֶם֙ עַל בְּנֵ֣י עַמּ֔וֹן וּ/נְתַתִּ֖י/הָ לְ/מֽוֹרָשָׁ֑ה לְמַ֛עַן לֹֽא תִזָּכֵ֥ר בְּנֵֽי עַמּ֖וֹן בַּ/גּוֹיִֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/025/010.yaml
  text: to the people of the east[a], against the Ammonites; and I will give it as a possession[b], so that the Ammonites may no longer be remembered among the nations.
translation:
  language: hi
  text: मैं उसे अम्मोनियों के विरुद्ध[b] पूर्व के लोगों[a] के कब्जे[c] में कर दूँगा, ताकि राष्ट्रों के बीच अम्मोनियों को फिर याद न किया जाए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, ‘पूर्व के पुत्रों।’ यह इब्रानी अभिव्यक्ति पूर्व दिशा के लोगों या कबीलों के लिए प्रयुक्त होती है।
    reason: lexical_alternative
  - marker: b
    text: या, ‘अम्मोनियों पर।’
    reason: lexical_alternative
  - marker: c
    text: या, ‘विरासत के रूप में।’
    reason: lexical_alternative
lexical_decisions:
- source_word: לִבְנֵי קֶדֶם
  choice: पूर्व के लोगों
  rationale: यह मुहावरेदार जातीय-भौगोलिक पद पूर्व दिशा में रहने वाले लोगों या कबीलों को सूचित करता है। शाब्दिक ‘पूर्व के पुत्र’ आधुनिक हिन्दी में भ्रामक होगा।
- source_word: עַל בְּנֵי עַמּוֹן
  choice: अम्मोनियों के विरुद्ध
  rationale: עַל यहाँ न्याय और भूभाग सौंपे जाने के प्रसंग में विरोधी संबंध व्यक्त कर सकता है। निकटवर्ती वाक्य-संरचना के कारण ‘अम्मोनियों समेत’ भी संभव है; इस वास्तविक अस्पष्टता को पादटिप्पणी में रखा गया है।
- source_word: וּנְתַתִּיהָ
  choice: और मैं उसे ... दे दूँगा
  rationale: स्त्रीलिंग प्रत्यय पूर्व प्रसंग में निहित भूमि या क्षेत्र की ओर संकेत करता है। हिन्दी में ‘उसे’ इस संदर्भ-संबंध को बिना अनावश्यक व्याख्या के बनाए रखता है।
- source_word: לְמוֹרָשָׁה
  choice: अधिकार में
  rationale: מוֹרָשָׁה ऐसी संपत्ति या भूमि को सूचित करता है जिस पर स्थायी अधिकार हो। ‘अधिकार में’ भूभाग पर कब्जे के इस प्रसंग में स्वाभाविक है; ‘विरासत’ वैकल्पिक अर्थ है।
- source_word: לְמַעַן לֹא תִזָּכֵר
  choice: ताकि ... फिर याद न किया जाए
  rationale: यह उद्देश्य या परिणाम व्यक्त करता है। निष्क्रिय रूप ‘याद न किया जाए’ זכר के निफ़ाल रूप को बचाता है, और ‘फिर’ उनके राष्ट्रों के बीच स्मरण से मिट जाने का प्रसंगगत भाव देता है।
- source_word: בַּגּוֹיִם
  choice: राष्ट्रों के बीच
  rationale: גּוֹיִם यहाँ आसपास के लोगों या राष्ट्रों के लिए सामान्य पद है; बाद की धार्मिक धारणा वाला कोई विशिष्ट अर्थ इसमें नहीं जोड़ा गया।
theological_decisions:
- issue: अम्मोन के स्मरण से मिटने वाले न्याय-वचन का बल
  choice: राष्ट्रों के बीच अम्मोनियों के फिर याद न किए जाने के रूप में अनुवाद किया गया है।
  alternative: इसे पूर्ण अस्तित्व-विनाश अथवा केवल प्रसिद्धि खोने के रूप में प्रस्तुत करना।
  rationale: इब्रानी पाठ राष्ट्रीय स्मरण और मान्यता मिटने की बात कहता है। अनुवाद न्याय की गंभीरता बनाए रखता है, पर भौतिक या आध्यात्मिक पूर्ण विनाश की ऐसी धारणा नहीं जोड़ता जो पाठ में स्पष्ट नहीं है।
- issue: עַל का संबंध
  choice: मुख्य पाठ में ‘अम्मोनियों के विरुद्ध’, तथा पादटिप्पणी में ‘अम्मोनियों समेत’।
  alternative: केवल ‘अम्मोनियों समेत’ पढ़ना।
  rationale: पूर्वसर्ग עַל विरोध का अर्थ दे सकता है, जबकि पदक्रम और व्यापक संदर्भ संयुक्त भूभाग-सौंपे जाने का अर्थ संभव बनाते हैं। पादटिप्पणी वास्तविक व्याकरणिक-संदर्भगत तनाव को सुरक्षित रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सहज स्तर रखा गया है। पद पिछले वाक्य से व्याकरणिक रूप से जुड़ा हुआ अंश है, इसलिए आरंभिक खंड की अपूर्णता को मूल के अनुरूप बनाए रखा गया है। ‘अम्मोनी’ मानक जातीय नाम है और ‘राष्ट्रों के बीच’ सामान्य पाठक के लिए स्पष्ट है।
