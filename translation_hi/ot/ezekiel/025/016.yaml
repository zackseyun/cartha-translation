source:
  edition: WLC
  text: לָ/כֵ֗ן כֹּ֤ה אָמַר֙ אֲדֹנָ֣/י יְהוִ֔ה הִנְ/נִ֨י נוֹטֶ֤ה יָדִ/י֙ עַל פְּלִשְׁתִּ֔ים וְ/הִכְרַתִּ֖י אֶת כְּרֵתִ֑ים וְ/הַ֣אֲבַדְתִּ֔י אֶת שְׁאֵרִ֖ית ח֥וֹף הַ/יָּֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/025/016.yaml
  text: 'Therefore thus says the Lord GOD: Behold[a], I am stretching out my hand against the Philistines, and I will cut off the Cherethites, and I will destroy the remnant of the seacoast.'
translation:
  language: hi
  text: 'इसलिए प्रभु याहवे यों कहते हैं: देखो, मैं पलिश्तियों के विरुद्ध अपना हाथ बढ़ा रहा हूँ; मैं करेतियों[a] को काट डालूँगा और समुद्र-तट के बचे हुए लोगों का नाश करूँगा।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या सम्भवतः “क्रेती लोग”; इब्रानी नाम ऐसे लोगों को सूचित कर सकता है जिनका सम्बन्ध क्रेते से था।
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  choice: प्रभु यहोवा
  rationale: संयुक्त उपाधि में אֲדֹנָי को ‘प्रभु’ और परमेश्वर के निजी नाम יהוה को ‘यहोवा’ के रूप में रखा गया है; इससे दोहरे ‘प्रभु’ से बचते हुए मूल भेद बना रहता है।
- source_word: הִנְנִי
  choice: देखो
  rationale: यह आसन्न ईश्वरीय कार्य की ओर ध्यान खींचने वाला शब्द है; ‘देखो’ आधुनिक हिन्दी में स्वाभाविक रहते हुए भविष्यवाणी की गंभीरता बनाए रखता है।
- source_word: נוֹטֶה יָדִי
  choice: मैं ... अपना हाथ बढ़ा रहा हूँ
  rationale: הִנְנִי के साथ कृदंत आसन्न या आरम्भ हो रही कार्रवाई को सजीव वर्तमान रूप में व्यक्त करता है।
- source_word: פְּלִשְׁתִּים
  choice: पलिश्तियों
  rationale: इस प्राचीन जाति के लिए हिन्दी बाइबलीय प्रयोग में प्रचलित नाम रखा गया है।
- source_word: וְהִכְרַתִּי
  choice: मैं ... नष्ट कर दूँगा
  rationale: न्याय के प्रसंग में כרת का अर्थ किसी समूह को काटकर समाप्त कर देना है; यहाँ सहज हिन्दी में उसके परिणाम को व्यक्त किया गया है।
- source_word: כְּרֵתִים
  choice: करेती लोगों
  rationale: मूल पाठ के जातिनाम का लिप्यंतरण रखा गया है और क्रेते से उसकी सम्भावित पहचान को मुख्य पाठ में निश्चित नहीं बनाया गया।
- source_word: וְהַאֲבַדְתִּי
  choice: विनाश कर दूँगा
  rationale: हिफ़ील रूप किसी को नाश करने का सकर्मक अर्थ देता है; यह हिन्दी में स्पष्ट और प्रबल अभिव्यक्ति है।
- source_word: שְׁאֵרִית
  choice: बचे हुए लोगों
  rationale: इस न्याय-संदर्भ में यह शेष बचे व्यक्तियों को सूचित करता है; सहज हिन्दी में अर्थ स्पष्ट किया गया है, बिना किसी सकारात्मक धार्मिक अर्थ को आरोपित किए।
- source_word: חוֹף הַיָּם
  choice: समुद्र-तट
  rationale: शाब्दिक अर्थ ‘समुद्र का तट’ है; संयुक्त रूप आधुनिक हिन्दी में संक्षिप्त और स्वाभाविक है।
theological_decisions:
- issue: संयुक्त ईश्वरीय उपाधि אֲדֹנָי יְהוִה का अनुवाद
  choice: प्रभु यहोवा
  alternative: प्रभु याहवे
  rationale: मूल में सामान्य प्रभुत्व-सूचक उपाधि और परमेश्वर का विशिष्ट नाम दोनों हैं। ‘प्रभु यहोवा’ हिन्दी के परिचित बाइबलीय रूप में यह भेद सुरक्षित रखता है और ‘प्रभु प्रभु’ जैसी पुनरुक्ति से बचाता है।
- issue: כְּרֵתִים की जातीय पहचान
  choice: करेती लोगों
  alternative: क्रेती लोगों / क्रेतावासियों
  rationale: इस नाम का क्रेते से सम्बन्ध सम्भव है, पर निश्चित नहीं। इसलिए मुख्य पाठ में जातिनाम का लिप्यंतरण और पादटिप्पणी में वैकल्पिक पहचान दी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गंभीर, भविष्यवाणी-संगत और सामान्य पाठकों के लिए सुबोध रूप। ‘देखो’ ध्यानाकर्षक कण की शक्ति रखता है; समानार्थी विनाश-वाचक क्रियाओं में अनावश्यक कृत्रिमता से बचते हुए मूल के दो अलग क्रियारूपों का कुछ भेद बनाए रखा गया है।
