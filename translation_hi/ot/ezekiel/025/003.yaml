base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/025/003.yaml
  text: 'And say to the sons of Ammon[a], ‘Hear the word of the Lord GOD. Thus says the Lord GOD: Because you said, “Aha!” against my sanctuary when it was profaned, and against the land of Israel when it was made desolate[c][b], and against the house of Judah when they went into exile,’'
translation:
  language: hi
  text: 'अम्मोनियों से कहो, ‘प्रभु याहवे का वचन सुनो। प्रभु याहवे यों कहते हैं: क्योंकि तुमने मेरे पवित्र स्थान के अपवित्र होने पर, इस्राएल की भूमि के उजाड़ हो जाने पर[b], और यहूदा के घराने के निर्वासन में चले जाने पर[c], “अहा!”[a] कहा—’'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “अहा!” यहाँ दुर्भावनापूर्ण हर्ष या विजयी उपहास की ध्वनि है; इसे “हा!” भी कहा जा सकता है।
    reason: lexical_alternative
  - marker: b
    text: या “जब इस्राएल की भूमि उजाड़ कर दी गई।”
    reason: lexical_alternative
  - marker: c
    text: या “जब वे बँधुआई में चले गए।”
    reason: lexical_alternative
lexical_decisions:
- source_word: בְנֵי עַמּוֹן
  choice: अम्मोनी
  rationale: शाब्दिक रूप ‘अम्मोन के पुत्र’ है, पर यहाँ यह जाति का नाम है; आधुनिक हिन्दी में ‘अम्मोनी’ अधिक स्वाभाविक और स्पष्ट है।
- source_word: דְּבַר אֲדֹנָי יְהוִה
  choice: प्रभु याहवे का वचन
  rationale: אֲדֹנָי को ‘प्रभु’ और परमेश्वर के निज नाम יהוה को ‘याहवे’ रखा गया है, जिससे संयुक्त उपाधि और निज नाम दोनों बने रहें।
- source_word: כֹּה אָמַר אֲדֹנָי יְהוִה
  choice: प्रभु याहवे यों कहते हैं
  rationale: यह भविष्यद्वक्ताओं का मानक संदेश-सूत्र है; ‘यों कहते हैं’ औपचारिक गरिमा रखते हुए स्वाभाविक हिन्दी है।
- source_word: יַעַן אָמְרֵךְ
  choice: क्योंकि तुमने ... कहा
  rationale: יַעַן न्याय के कारण का परिचय देता है और אָמְרֵךְ को हिन्दी में सीमित क्रिया के रूप में व्यक्त करना सहज है।
- source_word: הֶאָח
  choice: अहा!
  rationale: यह दूसरे के विनाश पर दुर्भावनापूर्ण हर्ष या विजयी उपहास की विस्मयादिबोधक ध्वनि है।
- source_word: אֶל
  choice: '... पर'
  rationale: तीनों समानांतर पदों में यह अम्मोन के उपहास का विषय बताता है; हिन्दी में किसी घटना ‘पर’ ऐसा कहना स्वाभाविक है और विरोधी भाव प्रसंग से स्पष्ट रहता है।
- source_word: מִקְדָּשִׁי
  choice: मेरा पवित्रस्थान
  rationale: यह शब्द किसी पवित्र स्थान अथवा पवित्रधाम को सूचित करता है; ‘पवित्रस्थान’ मन्दिर को ध्यान में रखते हुए भी मूल शब्द को अनावश्यक रूप से संकीर्ण नहीं करता।
- source_word: נִחָל
  choice: अपवित्र किया गया
  rationale: חלל के निफ़अल रूप में पवित्रता भंग होने या अपवित्र किए जाने का भाव है; कर्मवाच्य मूल की वाच्यता को सुरक्षित रखता है।
- source_word: אַדְמַת יִשְׂרָאֵל
  choice: इस्राएल की भूमि
  rationale: भौगोलिक-राष्ट्रीय प्रसंग में ‘भूमि’ אַדְמָה का स्वाभाविक हिन्दी समतुल्य है।
- source_word: נָשַׁמָּה
  choice: उजाड़ हो गई
  rationale: क्रिया विनाश के फलस्वरूप निर्जन और उजाड़ दशा को बताती है; यह हिन्दी में संक्षिप्त और स्वाभाविक है।
- source_word: בֵּית יְהוּדָה
  choice: यहूदा का घराना
  rationale: यह राज्य और उसके लोगों के लिए सामूहिक वाचा-संबंधी अभिव्यक्ति है; ‘घराना’ उस रूपक को बनाए रखता है।
- source_word: הָלְכוּ בַגּוֹלָה
  choice: निर्वासन में चले गए
  rationale: यह लोगों के देश से निकालकर परदेश ले जाए जाने को व्यक्त करता है; ‘निर्वासन’ आधुनिक हिन्दी में स्पष्ट है।
theological_decisions:
- issue: संयुक्त ईश्वरीय संबोधन אֲדֹנָי יְהוִה
  choice: प्रभु याहवे
  alternative: प्रभु परमेश्वर / प्रभु यहोवा
  rationale: ‘प्रभु’ אֲדֹנָי की उपाधि को और ‘याहवे’ יהוה के निज वाचा-नाम को अलग-अलग पहचान देता है; सामान्य उपाधि से नाम को प्रतिस्थापित नहीं किया गया।
- issue: पवित्रस्थान के साथ נִחָל का अर्थ
  choice: अपवित्र किया गया
  alternative: भ्रष्ट किया गया / उसकी पवित्रता भंग हुई
  rationale: मूल का धार्मिक-पवित्रता संबंधी तनाव बनाए रखने के लिए इसे केवल भौतिक विनाश नहीं माना गया।
- issue: कारणसूचक वाक्य का अपूर्ण रहना
  choice: अंत में दीर्घ डैश के साथ कारणसूचक उपवाक्य खुला रखा गया
  alternative: अगले पद का परिणाम जोड़कर वाक्य पूरा करना
  rationale: हिब्रू पद 3 ‘क्योंकि’ से आरम्भ कारणों पर समाप्त होता है और परिणाम अगले पद में आता है; इस पद में अगली पंक्ति का पाठ आयात नहीं किया गया।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, सहज किंतु भविष्यद्वाणी की गरिमा के अनुरूप रखी गई है। जातिनाम के लिए ‘अम्मोनी’ और सामूहिक वाचा-रूपक के लिए ‘यहूदा का घराना’ चुना गया। समानांतर हिब्रू संरचना को हिन्दी में पठनीय बनाने के लिए ‘ऐसा ही कहा’ जोड़ा गया है; इससे कोई नया कृत्य नहीं जुड़ता, बल्कि तीनों אֶל-पदों पर एक ही אָמְרֵךְ का संबंध स्पष्ट होता है।
