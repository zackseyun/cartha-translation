  text: לָ/כֵ֡ן הִנְ/נִי֩ נָטִ֨יתִי אֶת יָדִ֜/י עָלֶ֗י/ךָ וּ/נְתַתִּ֤י/ךָֽ ל/בג לַ/גּוֹיִ֔ם וְ/הִכְרַתִּ֨י/ךָ֙ מִן הָ֣/עַמִּ֔ים וְ/הַאֲבַדְתִּ֖י/ךָ מִן הָ/אֲרָצ֑וֹת אַשְׁמִ֣ידְ/ךָ֔ וְ/יָדַעְתָּ֖ כִּֽי אֲנִ֥י יְהוָֽה־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/025/007.yaml
  text: Therefore[a], behold, I have stretched out my hand against you, and I will give you as plunder to the nations. I will cut you off from the peoples and destroy you from the lands; I will annihilate you, and you will know that I am Yahweh.
translation:
  language: hi
  text: इसलिए, देख, मैंने तेरे विरुद्ध अपना हाथ बढ़ाया है और तुझे राष्ट्रों के लिए लूट का माल[a] बना दूँगा। मैं तुझे लोगों में से काट डालूँगा और देशों में से नष्ट कर दूँगा। मैं तुझे पूरी तरह नष्ट कर दूँगा, और तू जान लेगा कि मैं याहवे हूँ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘लूट का माल’ के लिए प्रयुक्त इब्रानी शब्द दुर्लभ है; इसका अर्थ ‘लूट’ या ‘युद्ध में पाया गया माल’ समझा जाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: इसलिए
  rationale: यह निष्कर्षसूचक अव्यय पिछले आरोप के फलस्वरूप आने वाले न्याय का परिचय देता है।
- source_word: הִנְנִי
  choice: देख, मैं
  rationale: भविष्यद्वाणी की गंभीर उद्घोषणा और श्रोता का ध्यान खींचने वाली शक्ति को स्वाभाविक आधुनिक हिन्दी में बनाए रखता है।
- source_word: נָטִיתִי אֶת־יָדִי עָלֶיךָ
  choice: मैं तेरे विरुद्ध अपना हाथ बढ़ाता हूँ
  rationale: दण्ड देने के लिए परमेश्वर के सक्रिय हस्तक्षेप का रूपक सुरक्षित रहता है; सन्दर्भ में इब्रानी पूर्ण क्रिया आसन्न और निश्चित कार्य की घोषणा करती है।
- source_word: וּנְתַתִּיךָ לְבַג לַגּוֹיִם
  choice: तुझे राष्ट्रों के लिए लूट का माल बना दूँगा
  rationale: दुर्लभ בַג को युद्ध में विजेताओं द्वारा ली जाने वाली लूट के अर्थ में समझा गया है; ‘लूट का माल’ सामान्य हिन्दी में स्पष्ट है।
- source_word: גּוֹיִם
  choice: राष्ट्रों
  rationale: यहाँ विदेशी राजनीतिक समुदाय अभिप्रेत हैं; बाद के धार्मिक अर्थ वाला ‘अन्यजाति’ आवश्यक नहीं है।
- source_word: וְהִכְרַתִּיךָ מִן־הָעַמִּים
  choice: मैं तुझे जाति-जाति के लोगों में से काट डालूँगा
  rationale: כרת का हटाने और समाप्त कर देने का कठोर भाव बना रहता है, जबकि עַמִּים को גּוֹיִם से कुछ अलग रूप में व्यक्त किया गया है।
- source_word: וְהַאֲבַדְתִּיךָ מִן־הָאֲרָצוֹת
  choice: देशों में से मिटा दूँगा
  rationale: हिफ़ील रूप कारणात्मक विनाश व्यक्त करता है और ‘देशों में से’ भौगोलिक समुदायों से हटाए जाने का भाव रखता है।
- source_word: אַשְׁמִידְךָ
  choice: मैं तुझे पूरी तरह नष्ट कर दूँगा
  rationale: שמד की चरम और व्यापक विनाशसूचक शक्ति को पिछले विनाश-वाक्यों से बढ़ते हुए चरम के रूप में व्यक्त करता है।
- source_word: וְיָדַעְתָּ כִּי אֲנִי יְהוָה
  choice: और तू जान लेगा कि मैं याहवे हूँ
  rationale: यहेजकेल की विशिष्ट पहचान-सूत्रावली और प्रत्यक्ष वाचा-नाम दोनों सुरक्षित रखे गए हैं।
- source_word: יְהוָה
  choice: याहवे
  rationale: टेट्राग्राम को उपाधि से बदलने के बजाय उसके प्रचलित विद्वतापूर्ण उच्चारण का देवनागरी लिप्यंतरण किया गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: प्रभु / यहोवा
  rationale: मूल पाठ यहाँ वाचा-नाम का प्रत्यक्ष प्रयोग करता है। ‘याहवे’ नाम को नाम के रूप में सुरक्षित रखता है और उसे उपाधि में नहीं बदलता।
- issue: ‘तू जान लेगा’ में ज्ञान का स्वरूप
  choice: न्याय के अनुभव से याहवे की पहचान की स्वीकृति
  alternative: उद्धारकारी या स्वेच्छापूर्ण विश्वास
  rationale: पाठ केवल यह कहता है कि न्याय के फलस्वरूप संबोधित पक्ष याहवे को जानेगा; यह नहीं बताता कि यह ज्ञान उद्धारकारी विश्वास या पश्चात्ताप होगा।
translation_notes:
  register: भाषा आधुनिक, गंभीर और भविष्यद्वाणी के न्याय-वचन के अनुरूप रखी गई है। एकवचन सम्बोधन और मूल की तीखी पुनरुक्ति बनाए रखने के लिए ‘तू/तेरे/तुझे’ तथा क्रमिक विनाशसूचक क्रियाओं का प्रयोग किया गया है।
