  text: לָ/כֵן֩ הִנְ/נִ֨י פֹתֵ֜חַ אֶת כֶּ֤תֶף מוֹאָב֙ מֵ/הֶ֣/עָרִ֔ים מֵֽ/עָרָ֖י/ו מִ/קָּצֵ֑/הוּ צְבִ֗י אֶ֚רֶץ בֵּ֣ית הַיְשִׁימֹ֔ת בַּ֥עַל מְע֖וֹן ו/קריתמ/ה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/025/009.yaml
  text: 'Therefore behold[a], I am opening the flank of Moab from its cities, from its frontier cities, the glory of the land: Beth-jeshimoth, Baal-meon[c][b], and Kiriathaim.'
translation:
  language: hi
  text: 'इसलिए, देखो, मैं मोआब के पार्श्व[a] को उसके नगरों से—उसकी सीमा पर बसे नगरों से—खोल रहा हूँ; ये उस देश की शोभा[b] हैं: बेत-यशीमोत, बाल-मओन और किरयातैम[c]।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से ‘मोआब का कंधा’; यहाँ इसका अर्थ ‘मोआब का किनारा’ या ‘मोआब का बाजू’ भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या ‘उस देश का गौरव’ अथवा ‘उस देश का वैभव’।
    reason: lexical_alternative
  - marker: c
    text: इब्रानी पाठ में इस अंतिम स्थान-नाम की वर्तनी का एक विशेष रूप है, जो मोआब के प्रसिद्ध नगर किरयातैम से मेल खाता है।
    reason: textual_variant
lexical_decisions:
- source_word: הִנְנִי פֹתֵחַ
  choice: देखो, मैं ... खोल रहा हूँ
  rationale: הִנְנִי के साथ प्रयुक्त कृदंत आसन्न कार्य को सजीव वर्तमान के रूप में प्रस्तुत करता है। हिन्दी का ‘देखो, मैं ... खोल रहा हूँ’ इस भविष्यसूचक तात्कालिकता को बनाए रखता है।
- source_word: כֶּתֶף מוֹאָב
  choice: मोआब का पार्श्व
  rationale: כֶּתֶף का मूल अर्थ ‘कंधा’ है, पर यहाँ भौगोलिक रूपक में प्रदेश का किनारा या बाजू अभिप्रेत है। ‘पार्श्व’ गरिमापूर्ण हिन्दी में रूपक और भौगोलिक अर्थ दोनों को सुरक्षित रखता है।
- source_word: מֵהֶעָרִים מֵעָרָיו מִקָּצֵהוּ
  choice: नगरों की ओर से—उसके छोर पर बसे नगरों की ओर से
  rationale: अनुवाद मूल की दोहराई हुई מן-रचना और सामान्य ‘नगरों’ से अधिक स्पष्ट ‘उसके छोर पर बसे नगरों’ की प्रगति को बनाए रखता है। ‘की ओर से’ उस दिशा अथवा सीमा को व्यक्त करता है जहाँ से मोआब का पार्श्व खोला जाएगा।
- source_word: צְבִי אֶרֶץ
  choice: उस देश की शोभा
  rationale: צְבִי सौंदर्य, शोभा, वैभव या गौरव का बोध करा सकता है। नगरों के लिए ‘देश की शोभा’ स्वाभाविक है और पद की प्रशंसात्मक अस्पष्टता बनाए रखता है।
- source_word: בֵּית הַיְשִׁימֹת
  choice: बेत-यशीमोत
  rationale: स्थान-नाम का अर्थानुवाद न करके उसका हिन्दी लिप्यंतरण किया गया है।
- source_word: בַּעַל מְעוֹן
  choice: बाल-मओन
  rationale: स्थान-नाम को पहचान योग्य हिन्दी रूप में लिप्यंतरित किया गया है।
- source_word: וקריתמה
  choice: किरयातैम
  rationale: व्यंजनात्मक लेखन को ज्ञात मोआबी नगर किरयातैम के नाम के रूप में प्रस्तुत किया गया है; पाठगत वर्तनी की विशेषता पादटिप्पणी में बताई गई है।
