  text: כֹּ֤ה אָמַר֙ אֲדֹנָ֣/י יְהוִ֔ה יַ֣עַן עֲשׂ֥וֹת אֱד֛וֹם בִּ/נְקֹ֥ם נָקָ֖ם לְ/בֵ֣ית יְהוּדָ֑ה וַ/יֶּאְשְׁמ֥וּ אָשׁ֖וֹם וְ/נִקְּמ֥וּ בָ/הֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/025/012.yaml
  text: 'Thus says the Lord GOD: Because Edom acted in vengeance against the house of Judah[a], and became very guilty, and took vengeance on them[b],'
translation:
  language: hi
  text: 'प्रभु याहवे यों कहते हैं: “क्योंकि एदोम ने यहूदा के घराने के विरुद्ध बदले की भावना से काम किया[a], और बहुत दोषी ठहरा[b], और उन पर बदला लिया,”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से ‘बदला लेने में बदला’ जैसा बलात्मक प्रयोग है, जिसका अर्थ बदले की भावना से काम करना या पूरा बदला लेना है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में दोष को बल देकर व्यक्त किया गया है; इसका अनुवाद ‘अपने ऊपर भारी दोष लाया’ या ‘घोर दोषी पाया गया’ भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  choice: प्रभु याहवे
  rationale: אֲדֹנָי को ‘प्रभु’ और परमेश्वर के व्यक्तिगत नाम יהוה को ‘याहवे’ के रूप में अलग-अलग व्यक्त किया गया है; इससे संयुक्त उपाधि के दोनों तत्व सुरक्षित रहते हैं।
- source_word: יַעַן
  choice: क्योंकि
  rationale: यह आने वाले न्याय का कारण प्रस्तुत करता है; ‘क्योंकि’ आधुनिक हिन्दी में इसका स्वाभाविक कारणसूचक रूप है।
- source_word: עֲשׂוֹת ... בִּנְקֹם נָקָם
  choice: बदला लेने में बदले की भावना से काम किया
  rationale: मूल में ‘बदला’ धातु और उसी मूल की संज्ञा साथ आकर प्रतिशोध पर बल देती हैं। हिन्दी में पुनरुक्ति बनाए रखते हुए वाक्य को बोधगम्य रखा गया है।
- source_word: לְבֵית יְהוּדָה
  choice: यहूदा के घराने से
  rationale: शत्रुतापूर्ण प्रसंग में לְ का लक्ष्यसूचक अर्थ है। ‘घराना’ यहाँ यहूदा के लोगों अथवा जातीय समुदाय को दर्शाता है।
- source_word: וַיֶּאְשְׁמוּ אָשׁוֹם
  choice: बहुत दोषी ठहरा
  rationale: क्रिया אשם के साथ उसी मूल का बलात्मक रूप दोष की गंभीरता को उभारता है; ‘बहुत दोषी ठहरा’ उस जोर को सहज हिन्दी में व्यक्त करता है।
- source_word: וְנִקְּמוּ בָהֶם
  choice: और उनसे बदला लेकर
  rationale: निफ़अल रूप यहाँ प्रतिशोध लेने का भाव रखता है। यह अनुवाद पद में बार-बार आने वाले बदले के विषय को बनाए रखता है।
theological_decisions:
- issue: संयुक्त ईश्वरीय उपाधि אֲדֹנָי יְהוִה का अनुवाद
  choice: प्रभु याहवे
  alternative: प्रभु परमेश्वर / प्रभु यहोवा
  rationale: ‘प्रभु याहवे’ मूल के उपाधि और व्यक्तिगत नाम—दोनों को स्पष्ट रखता है। ‘परमेश्वर’ नाम को सामान्य पदवी बना देता, जबकि ‘यहोवा’ हिन्दी परंपरा में प्रचलित वैकल्पिक लिप्यंतरण है।
- issue: एदोम की सामूहिक व्याकरणिक संख्या
  choice: हिन्दी में एकवचन सामूहिक कर्ता—‘एदोम ... दोषी ठहरा’
  alternative: बहुवचन—‘एदोमी ... दोषी ठहरे’
  rationale: इब्रानी में एदोम के साथ बहुवचन क्रियाएँ उसके लोगों को सामूहिक रूप से देखती हैं; हिन्दी में राष्ट्रनाम ‘एदोम’ स्वाभाविक रूप से एकवचन सामूहिक कर्ता बनता है, बिना सामूहिक उत्तरदायित्व मिटाए।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य रखी गई है। मूल में ‘बदला’ की जानबूझकर की गई पुनरावृत्ति को हिन्दी में भी सुरक्षित रखा गया है। पद अगले न्याय-वचन की भूमिका है, इसलिए अंत में अल्पविराम रखा गया है।
