base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/025/008.yaml
  text: 'Thus says the Lord GOD: Because Moab and Seir say, ‘Look, the house of Judah is like all the nations,’'
translation:
  language: hi
  text: 'प्रभु यहोवा यों कहता है: क्योंकि मोआब और सेईर कहते हैं, ‘देखो, यहूदा का घराना सभी राष्ट्रों के समान है,’'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  choice: प्रभु यहोवा
  rationale: ईश्वरीय उपाधि और व्यक्तिगत नाम, दोनों को अलग रखते हुए प्रचलित तथा स्पष्ट हिन्दी रूप दिया गया है।
- source_word: יַעַן אֲמֹר
  choice: क्योंकि ... कहते हैं
  rationale: कारण बताने वाली इब्रानी संरचना को स्वाभाविक हिन्दी में रखा गया है; बहुवचन विषय ‘मोआब और सेईर’ के अनुसार ‘कहते हैं’ उपयुक्त है।
- source_word: הִנֵּה
  choice: देखो
  rationale: ध्यान आकर्षित करने वाले उद्गार का सीधा, वर्तमान हिन्दी रूप।
- source_word: בֵּית יְהוּדָה
  choice: यहूदा का घराना
  rationale: ‘घर’ के सामुदायिक/वंशगत अर्थ को स्पष्ट करने के लिए ‘घराना’ चुना गया है।
- source_word: כְּכָל הַגּוֹיִם
  choice: भी सब जातियों के समान
  rationale: כְּ का तुलनात्मक अर्थ सुरक्षित है; हिन्दी में कथन का निहित जोर व्यक्त करने हेतु ‘भी’ जोड़ा गया है, अर्थात यहूदा अन्य जातियों से भिन्न नहीं है।
theological_decisions:
- issue: यहूदा की अन्य जातियों के समानता का शत्रुतापूर्ण दावा
  choice: कथन को बिना व्याख्यात्मक विस्तार के सीधे उद्धृत किया गया है
  alternative: यहूदा का घराना अन्य सभी राष्ट्रों जैसा ही है
  rationale: मूल पाठ इस दावे के आशय को यहाँ नहीं खोलता; इसलिए उसकी धार्मिक या राजनीतिक व्याख्या अनुवाद में नहीं जोड़ी गई।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सहज भविष्यद्वाणी-संबंधी गद्य। ‘यों कहता है’ बाइबलीय उद्घोषणा की परिचित लय रखता है, जबकि शब्दावली साधारण पाठक के लिए समझने योग्य है।
