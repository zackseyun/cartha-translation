base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/025/006.yaml
  text: 'For thus says the Lord GOD: Because you clapped your hands and stamped your feet[a], and rejoiced with all the contempt in your soul against the land of Israel,'
translation:
  language: hi
  text: 'क्योंकि प्रभु यहोवा यों कहता है: तुमने तालियाँ बजाईं, पैर पटके और इस्राएल की भूमि के विरुद्ध अपने मन में भरे सारे तिरस्कार के साथ आनन्द मनाया[a],'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अपने मन की सारी घृणा” या “अपने मन की सारी दुर्भावना के साथ।”
    reason: שָׁאט का मुख्य अर्थ तिरस्कार/अवमानना है; सन्दर्भ के अनुसार घृणा या दुर्भावना भी सम्भव अर्थ हैं।
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  choice: प्रभु यहोवा
  rationale: संयुक्त ईश्वरीय उपाधि में אֲדֹנָי को ‘प्रभु’ और वाचा के नाम יהוה को हिन्दी में प्रचलित रूप ‘यहोवा’ से व्यक्त किया गया है।
- source_word: יַעַן
  choice: क्योंकि
  rationale: यह आगामी न्याय का कारण प्रस्तुत करता है; ‘क्योंकि’ इसके कारणवाचक बल को सहज हिन्दी में बनाए रखता है।
- source_word: מַחְאֲךָ יָד
  choice: तुमने ... तालियाँ बजाईं
  rationale: शाब्दिक रूप से हाथ मारने का संकेत है; सन्दर्भ में दुर्भावनापूर्ण उल्लास की भाव-भंगिमा होने के कारण यह स्वाभाविक हिन्दी अभिव्यक्ति उपयुक्त है।
- source_word: וְרַקְעֲךָ בְּרָגֶל
  choice: और पैर पटके
  rationale: मूल में एकवचन ‘पैर’ है और क्रिया जोर से भूमि पर पैर मारने की भाव-भंगिमा व्यक्त करती है; ‘पैर पटके’ हिन्दी में स्वाभाविक है।
- source_word: וַתִּשְׂמַח
  choice: आनन्द मनाते हुए
  rationale: वाक्य के हिन्दी प्रवाह में इसे पूर्वकालिक भाव से जोड़कर रखा गया है, जबकि इस्राएल के विनाश पर प्रसन्न होने का अर्थ स्पष्ट बना रहता है।
- source_word: בְּכָל שָׁאטְךָ
  choice: पूरे तिरस्कार के साथ
  rationale: שָׁאט में घृणापूर्ण अवमानना या तिरस्कार का भाव है; ‘तिरस्कार’ इसका मुख्य अर्थ सुरक्षित रखता है।
- source_word: בְּנֶפֶשׁ
  choice: अपने मन के
  rationale: נֶפֶשׁ यहाँ भीतरी व्यक्ति और गहरे भाव को सूचित करता है; आधुनिक हिन्दी में ‘मन’ सहज है, जबकि ‘प्राण’ इस सन्दर्भ में कृत्रिम लग सकता है।
- source_word: אֶל אַדְמַת יִשְׂרָאֵל
  choice: इस्राएल की भूमि के विरुद्ध
  rationale: אֶל सामान्यतः ‘की ओर’ है, पर शत्रुतापूर्ण सन्दर्भ में ‘के विरुद्ध’ भाव को स्पष्ट करता है; אַדְמָה का स्वाभाविक अनुवाद ‘भूमि’ है।
theological_decisions:
- issue: संयुक्त उपाधि אֲדֹנָי יְהוִה में परमेश्वर के नाम का अनुवाद
  choice: प्रभु यहोवा
  alternative: प्रभु याहवे
  rationale: मूल पाठ वाचा का नाम יהוה रखता है। हिन्दी बाइबलीय परम्परा में ‘यहोवा’ व्यापक रूप से पहचाना जाता है; इसे सामान्य उपाधि से बदलने के बजाय व्यक्तिगत नाम के रूप में सुरक्षित रखा गया है।
translation_notes:
