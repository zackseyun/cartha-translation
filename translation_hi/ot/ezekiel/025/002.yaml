  text: Son of man[a], set your face toward the sons of Ammon, and prophesy against them.
translation:
  language: hi
  text: “हे मनुष्य के पुत्र, अपना मुख अम्मोनियों[a] की ओर कर और उनके विरुद्ध भविष्यवाणी कर।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “अम्मोन के पुत्रों।”
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן אָדָם
  choice: हे मनुष्य के पुत्र
  rationale: यहेजकेल के लिए बार-बार प्रयुक्त इस दिव्य संबोधन में इब्रानी संबंधवाचक मुहावरे और पुस्तकगत संगति को बनाए रखा गया है।
- source_word: שִׂים פָּנֶיךָ
  choice: अपना मुख ... की ओर कर
  rationale: यह चयन चेहरे को किसी दिशा में करने की इब्रानी भविष्यसूचक छवि बनाए रखते हुए स्वाभाविक हिन्दी देता है।
- source_word: אֶל
  choice: की ओर
  rationale: मूल पूर्वसर्ग दिशा व्यक्त करता है; विरोध का भाव अगली उपवाक्य में स्पष्ट रूप से आता है।
- source_word: בְּנֵי עַמּוֹן
  choice: अम्मोनियों
  rationale: यह जातिनाम आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है; मूल का शाब्दिक रूप ‘अम्मोन के पुत्र’ पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: וְהִנָּבֵא
  choice: और ... भविष्यवाणी कर
  rationale: नबा धातु के निफ़अल आज्ञार्थक का मानक और प्रसंगानुकूल हिन्दी प्रतिरूप है।
- source_word: עֲלֵיהֶם
  choice: उनके विरुद्ध
  rationale: न्याय-संदेश के इस प्रसंग में עַל का विरोधात्मक अर्थ सबसे उपयुक्त है।
theological_decisions:
- issue: בְּנֵי עַמּוֹן में जातिनाम का रूप
  choice: अम्मोनियों
  alternative: अम्मोन के पुत्रों
  rationale: मुख्य पाठ में सामान्य हिन्दी जातिनाम अर्थ को तुरंत स्पष्ट करता है, जबकि पादटिप्पणी मूल इब्रानी की वंश-संबंधी अभिव्यक्ति को दिखाती है; इससे कोई अतिरिक्त धर्मवैज्ञानिक निष्कर्ष नहीं थोपा जाता।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट हिन्दी; ‘अपना मुख ... की ओर कर’ द्वारा भविष्यसूचक मुहावरे की छवि सुरक्षित रखी गई है।
