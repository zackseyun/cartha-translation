base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/048/009.yaml
  text: The contribution that you shall set apart for Yahweh shall be twenty-five thousand in length and ten thousand in width[a].
translation:
  language: hi
  text: जो अंश तुम यहोवा के लिए अलग करोगे, वह पच्चीस हज़ार लंबा और दस हज़ार चौड़ा होगा।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “भेंट” अथवा “अलग किया हुआ भाग।” इब्रानी शब्द का अर्थ किसी वस्तु को योगदान या भेंट के रूप में उठाकर अलग करना है; यहाँ यह भूमि में से अलग किए गए पवित्र भूभाग को दर्शाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הַתְּרוּמָה
  choice: अंश
  rationale: यहाँ תְּרוּמָה किसी बलिदान मात्र को नहीं, बल्कि भूमि में से यहोवा के लिए अलग किए गए पवित्र भूभाग को दर्शाता है। ‘अंश’ इस स्थानगत अर्थ को सहज रूप से व्यक्त करता है।
- source_word: אֲשֶׁר תָּרִימוּ
  choice: जो तुम ... अलग करोगे
  rationale: רוּם के हिफ़ईल रूप का यहाँ अर्थ किसी भाग को अर्पण के रूप में निर्धारित या अलग करना है; शाब्दिक ‘ऊपर उठाना’ इस प्रसंग में अस्वाभाविक होगा।
- source_word: לַיהוָה
  choice: यहोवा के लिए
  rationale: ל समर्पण या निर्धारित किए जाने का भाव देता है, और יהוה को उसके व्यक्तिगत वाचा-नाम ‘यहोवा’ से प्रस्तुत किया गया है।
- source_word: אֹרֶךְ חֲמִשָּׁה וְעֶשְׂרִים אֶלֶף
  choice: पच्चीस हज़ार लंबा
  rationale: मूल पाठ पहली माप को लंबाई के रूप में देता है। माप की इकाई इस पद में नहीं दी गई, इसलिए उसे मुख्य पाठ में नहीं जोड़ा गया।
- source_word: וְרֹחַב עֲשֶׂרֶת אֲלָפִים
  choice: और दस हज़ार चौड़ा
  rationale: यह दूसरी माप, चौड़ाई, को समानांतर और स्वाभाविक हिन्दी में व्यक्त करता है; मूल के अनुसार इकाई अनकही रखी गई है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ में टेट्राग्रामटन प्रत्यक्ष रूप से है। आधुनिक हिन्दी बाइबल-पाठकों के लिए परिचित व्यक्तिगत नाम ‘यहोवा’ रखा गया है, न कि उपाधि ‘प्रभु’; ‘याहवे’ अधिक ध्वन्यात्मक विकल्प है।
- issue: תְּרוּמָה का पवित्र भूमि-अंश वाला अर्थ
  choice: अंश
  alternative: भेंट
  rationale: यहेजकेल 45–48 में यह शब्द भूमि से अलग किए गए पवित्र भूभाग को सूचित करता है। ‘भेंट’ संभव है, पर अकेले प्रयोग करने पर अनुष्ठानिक चढ़ावे का संकरा अर्थ दे सकता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण गद्य। भूमि-विभाजन के प्रसंग को स्पष्ट रखने के लिए ‘अंश’ और ‘अलग करना’ चुने गए हैं। मूल पाठ में माप की इकाई न होने के कारण हिन्दी में भी कोई इकाई नहीं जोड़ी गई।
