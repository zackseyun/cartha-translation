  text: וְ/הַ/נּוֹתָ֣ר לַ/נָּשִׂ֣יא מִ/זֶּ֣ה וּ/מִ/זֶּ֣ה לִ/תְרֽוּמַת הַ/קֹּ֣דֶשׁ וְ/לַ/אֲחֻזַּ֪ת הָ/עִ֟יר אֶל פְּנֵ֣י חֲמִשָּׁה֩ וְ/עֶשְׂרִ֨ים אֶ֥לֶף תְּרוּמָה֮ עַד גְּב֣וּל קָדִימָ/ה֒ וְ/יָ֗מָּ/ה עַל פְּ֠נֵי חֲמִשָּׁ֨ה וְ/עֶשְׂרִ֥ים אֶ֨לֶף֙ עַל גְּב֣וּל יָ֔מָּ/ה לְ/עֻמַּ֥ת חֲלָקִ֖ים לַ/נָּשִׂ֑יא וְ/הָֽיְתָה֙ תְּרוּמַ֣ת הַ/קֹּ֔דֶשׁ וּ/מִקְדַּ֥שׁ הַ/בַּ֖יִת ב/תוכ/ה׀׀־־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/048/021.yaml
  text: And what remains shall belong to the prince[a], on both sides of the holy contribution and of the city's property, alongside the twenty-five thousand of the contribution as far as the eastern border, and westward alongside the twenty-five thousand toward the western border, parallel to the portions for the prince. And the holy contribution and the sanctuary of the temple shall be in its midst.
translation:
  language: hi
  text: और पवित्र भेंट और नगर की संपत्ति के इधर-उधर जो बचा हुआ भूभाग है, वह प्रधान के लिए होगा—पवित्र भेंट के पच्चीस हज़ार[a] के सामने पूर्वी सीमा तक, और पश्चिम की ओर पच्चीस हज़ार के सामने पश्चिमी सीमा तक, भागों के समानांतर। पवित्र भेंट और मन्दिर का पवित्रस्थान उसके बीच में होंगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में केवल “पच्चीस हज़ार” है; माप की इकाई यहेजकेल में आसपास दिए गए भूमि-मापों के संदर्भ से समझी जाती है।
    reason: cultural_note
lexical_decisions:
- source_word: וְהַנּוֹתָר
  choice: और जो भूमि बची रहेगी
  rationale: लेखयुक्त कृदंत यहाँ संज्ञा के रूप में शेष भूभाग को दर्शाता है; 'भूमि' संदर्भ से स्पष्ट करके हिन्दी वाक्य को स्वाभाविक बनाता है।
- source_word: לַנָּשִׂיא
  choice: प्रधान के लिए होगी
  rationale: यहेजकेल के इस दर्शन में נָשִׂיא नागरिक अगुए के पद का नाम है। 'प्रधान' आधुनिक हिन्दी में गरिमापूर्ण है और अनिवार्य वंशानुगत राजकुमार का अर्थ आरोपित नहीं करता।
- source_word: מִזֶּה וּמִזֶּה
  choice: दोनों ओर
  rationale: मुहावरा पवित्र भूभाग और नगर की संपत्ति के दोनों तरफ स्थित भूमि बताता है।
- source_word: תְּרוּמַת הַקֹּדֶשׁ
  choice: पवित्र भेंट का भूभाग
  rationale: תְּרוּמָה में अर्पित भेंट का धार्मिक भाव है, पर इस प्रसंग में वह अलग रखे गए भूमि-क्षेत्र को सूचित करती है; यह पद दोनों पहलुओं को बनाए रखता है।
- source_word: אֲחֻזַּת הָעִיר
  choice: नगर की संपत्ति
  rationale: אֲחֻזָּה अधिकार में रखे गए भू-स्वामित्व या संपत्ति को दर्शाता है।
- source_word: אֶל־פְּנֵי / עַל־פְּנֵי
  choice: के साथ-साथ
  rationale: इस सीमांकन में पद निकटता और समानांतर विस्तार व्यक्त करता है; सहज हिन्दी में 'के साथ-साथ' उपयुक्त है।
- source_word: לְעֻמַּת חֲלָקִים
  choice: अन्य भागों के समानांतर
  rationale: לְעֻמַּת स्थानिक अनुरूपता या आमने-सामने समानांतरता बताता है। 'अन्य' हिन्दी में संदर्भित जनजातीय भूभागों को स्पष्ट करता है।
- source_word: מִקְדַּשׁ הַבַּיִת
  choice: भवन का पवित्रस्थान
  rationale: शब्दशः संरचना 'भवन/मंदिर का पवित्रस्थान' है। 'भवन' मूल הַבַּיִת को बनाए रखता है और मִקְדָּשׁ को अलग से 'पवित्रस्थान' कहता है।
- source_word: בְתוֹכָהּ
  choice: उसके बीच में
  rationale: स्त्रीलिंग प्रत्यय का निकटतम व्याकरणिक पूर्वपद पवित्र भेंट का भूभाग है; हिन्दी में सर्वनाम रखकर मूल संबंध की संक्षिप्तता बचाई गई है।
theological_decisions:
- issue: נָשִׂיא की पदवी
  choice: प्रधान
  alternative: राजकुमार / शासक
  rationale: '''प्रधान'' नेतृत्व की पदवी को व्यक्त करता है, जबकि ''राजकुमार'' वंशानुगत राजपुत्र होने का अनावश्यक संकेत दे सकता है और ''शासक'' अधिक सामान्य है।'
- issue: תְּרוּמָה का धार्मिक और भूगोलिक अर्थ
  choice: पवित्र भेंट का भूभाग
  alternative: पवित्र अंश / पवित्र भूमि
  rationale: यह अनुवाद भूमि के अर्पण होने और वास्तविक भूभाग होने, दोनों को बनाए रखता है; केवल 'भूमि' कहने से भेंट का धार्मिक भाव मिट जाता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। लंबे इब्रानी सीमांकन-वाक्य को पठनीय हिन्दी वाक्यों में बाँटा गया है, पर पूर्व-पश्चिम समानांतरता और भूमि-विन्यास सुरक्षित रखा गया है।
