base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/048/010.yaml
  text: 'And for these[a], the holy contribution shall belong to the priests: on the north, twenty-five thousand in length; on the west, ten thousand in width; on the east, ten thousand in width; and on the south, twenty-five thousand in length[b]; and the sanctuary of Yahweh shall be in its midst.'
translation:
  language: hi
  text: 'और इनके लिए[a] याजकों के लिए पवित्र अर्पित भूभाग यह होगा: उत्तर की ओर उसकी लंबाई पच्चीस हज़ार, पश्चिम की ओर उसकी चौड़ाई दस हज़ार, पूर्व की ओर उसकी चौड़ाई दस हज़ार, और दक्षिण की ओर उसकी लंबाई पच्चीस हज़ार होगी[b]। याहवे का पवित्रस्थान उसके बीच में होगा।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “पवित्र अर्पित हिस्सा”; इब्रानी पद का शाब्दिक अर्थ “पवित्र अर्पण” है और यहाँ वह पवित्र उपयोग के लिए अलग किए गए भूभाग को दर्शाता है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में उत्तर की ओर केवल “पच्चीस हज़ार” है; “लंबाई” दक्षिणी माप के समानांतर अर्थ से स्पष्ट की गई है।
    reason: elliptical_clarification
lexical_decisions:
- source_word: וּלְאֵלֶּה
  choice: और इनके लिए
  rationale: לְ के साथ संकेतवाचक शब्द यहाँ आवंटन के प्राप्तकर्ताओं की ओर संकेत करता है; यह अनुवाद इब्रानी की संक्षिप्तता और संदर्भगत अर्थ दोनों बनाए रखता है।
- source_word: תְּרוּמַת הַקֹּדֶשׁ
  choice: पवित्र अर्पित भूभाग
  rationale: תְּרוּמָה का मूल भाव अर्पित या अलग किया हुआ हिस्सा है, जबकि यहाँ वह भूमि के एक समर्पित भाग को दर्शाता है; ‘भूभाग’ जोड़ने से संदर्भ स्पष्ट होता है।
- source_word: לַכֹּהֲנִים
  choice: याजकों के हिस्से का
  rationale: यह दत्तिव याजकों को इस पवित्र भूभाग के प्राप्तकर्ता बताता है; हिंदी में स्वाभाविक आवंटन-संबंध व्यक्त किया गया है।
- source_word: צָפוֹנָה / יָמָּה / קָדִימָה / נֶגְבָּה
  choice: उत्तर / पश्चिम / पूर्व / दक्षिण की ओर
  rationale: ये दिशासूचक रूप सीमा और माप के वर्णन में भूभाग की चारों दिशाओं को दर्शाते हैं।
- source_word: רֹחַב / אֹרֶךְ
  choice: चौड़ाई / लंबाई
  rationale: दोनों परस्पर विपरीत आयामों को आधुनिक, स्पष्ट हिंदी में व्यक्त करते हैं; उत्तर में लुप्त ‘लंबाई’ को दक्षिणी समानांतर वाक्यांश से स्पष्ट करके दिया गया है।
- source_word: מִקְדַּשׁ יְהוָה
  choice: याहवे का पवित्रस्थान
  rationale: מִקְדָּשׁ के लिए ‘पवित्रस्थान’ धार्मिक परिसर के केंद्रीय पवित्र स्थान का उपयुक्त, प्रतिष्ठित हिंदी रूप है; יְהוָה को व्यक्तिगत नाम ‘याहवे’ के रूप में रखा गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में चार अक्षरों वाला व्यक्तिगत ईश्वरीय नाम है। ‘याहवे’ उसका प्रचलित विद्वत्तापूर्ण लिप्यंतरण है और उसे उपाधि से प्रतिस्थापित नहीं करता।
- issue: תְּרוּמַת הַקֹּדֶשׁ का धार्मिक और भौगोलिक अर्थ
  choice: पवित्र अर्पित भूभाग
  alternative: पवित्र अर्पण; पवित्र क्षेत्र
  rationale: पद भूमि-विभाजन के संदर्भ में है, फिर भी תְּרוּמָה में निहित समर्पण/अर्पण का धार्मिक भाव बना रहना चाहिए; संयुक्त पद दोनों पहलुओं को सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमामय किंतु सहज शैली अपनाई गई है। भूमि-मापन की पुनरावृत्त संरचना सुरक्षित रखी गई है। मूल में माप की इकाई नहीं दी गई, इसलिए अनुवाद में भी कोई इकाई नहीं जोड़ी गई।
