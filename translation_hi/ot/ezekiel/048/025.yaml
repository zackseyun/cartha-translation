id: EZK.48.25
reference: Ezekiel 48:25
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/עַ֣ל גְּב֣וּל שִׁמְע֗וֹן מִ/פְּאַ֥ת קָדִ֛ימָ/ה עַד פְּאַת יָ֖מָּ/ה יִשָׂשכָ֥ר אֶחָֽד׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/048/025.yaml
  text: And along the border of Simeon[a], from the east side to the west side, Issachar, one portion.
translation:
  language: hi
  text: और शिमोन की सीमा के साथ, पूर्वी छोर से पश्चिमी छोर[a] तक, इस्साकार का एक भाग होगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक अर्थ ‘समुद्र की ओर का छोर’ है। यहाँ ‘समुद्र’ पश्चिम दिशा के लिए प्रयुक्त सामान्य इब्रानी शब्द है।
    reason: मूल दिशा-सूचक अभिव्यक्ति के शाब्दिक रूप और उसके भौगोलिक अर्थ, दोनों को सुरक्षित रखना।
lexical_decisions:
- source_word: וְ/עַל
  choice: और ... की सीमा के साथ
  rationale: इस भू-विभाजन सूत्र में यह अगले भू-भाग को पिछले भाग की सीमा से सटा हुआ बताता है; ‘के साथ’ आधुनिक हिन्दी में सीमा के समानांतर स्थिति को स्वाभाविक रूप से व्यक्त करता है।
- source_word: גְּבוּל
  choice: सीमा
  rationale: यह शब्द यहाँ गोत्रीय भू-भाग की सीमा-रेखा को दर्शाता है; ‘सीमा’ सटीक और सामान्य हिन्दी है।
- source_word: שִׁמְעוֹן
  choice: शिमोन
  rationale: गोत्र के नाम का प्रचलित हिन्दी लिप्यंतरण रखा गया है।
- source_word: מִ/פְּאַת קָדִימָ/ה
  choice: पूर्वी छोर से
  rationale: פְּאַת किसी ओर, किनारे या छोर को और קָדִימָה पूर्व दिशा को सूचित करता है; भूगोल के इस प्रसंग में ‘पूर्वी छोर से’ सहज और स्पष्ट है।
- source_word: עַד פְּאַת יָמָּ/ה
  choice: पश्चिमी छोर तक
  rationale: עַד विस्तार की अंतिम सीमा बताता है। יָם का मूल अर्थ ‘समुद्र’ है, पर हिब्रू भौगोलिक प्रयोग में यह प्रायः पश्चिम दिशा का सूचक है; शाब्दिक रूप को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: יִשָׂשכָר
  choice: इस्साकार
  rationale: गोत्र के नाम का प्रचलित हिन्दी लिप्यंतरण रखा गया है।
- source_word: אֶחָד
  choice: एक भाग
  rationale: हिब्रू में केवल ‘एक’ है, पर अध्याय के बार-बार आने वाले भू-विभाजन सूत्र में एक भू-भाग अभिप्रेत है; स्पष्ट हिन्दी के लिए ‘भाग’ जोड़ा गया है।
- source_word: '[verbless clause]'
  choice: होगा
  rationale: हिब्रू वाक्य में क्रिया व्यक्त नहीं है; हिन्दी में भावी भू-विभाजन के कथन को स्वाभाविक और पूर्ण बनाने के लिए ‘होगा’ दिया गया है।
theological_decisions: []
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और भू-विभाजन के प्रसंग के अनुरूप रखी गई है। ‘पूर्वी छोर’ और ‘पश्चिमी छोर’ की समानांतर रचना मूल के दिशात्मक संतुलन को बनाए रखती है।
