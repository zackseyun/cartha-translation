source:
  edition: WLC
  text: כָּל הַ/תְּרוּמָ֗ה חֲמִשָּׁ֤ה וְ/עֶשְׂרִים֙ אֶ֔לֶף בַּ/חֲמִשָּׁ֥ה וְ/עֶשְׂרִ֖ים אָ֑לֶף רְבִיעִ֗ית תָּרִ֨ימוּ֙ אֶת תְּרוּמַ֣ת הַ/קֹּ֔דֶשׁ אֶל אֲחֻזַּ֖ת הָ/עִֽיר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/048/020.yaml
  text: The whole contribution shall be twenty-five thousand by twenty-five thousand[a]; you shall set apart the holy contribution as a quarter of the city's property.
translation:
  language: hi
  text: अलग किया जाने वाला सारा भाग पच्चीस हज़ार गुणा पच्चीस हज़ार[a] होगा। पवित्र भाग को नगर की भू-संपत्ति सहित चौकोर[b] रूप में अलग रखो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “पच्चीस हज़ार हाथ गुणा पच्चीस हज़ार हाथ,” यदि आसपास के प्रसंग से माप की इकाई जोड़ी जाए।
    reason: lexical_alternative
  - marker: b
    text: या संभवतः, “पवित्र भाग को नगर की भू-संपत्ति के चौथाई भाग के रूप में अलग रखो।”
    reason: alternative_reading
lexical_decisions:
- source_word: תְּרוּמָה / תְּרוּמַת
  choice: अलग रखा गया भाग / भाग
  rationale: भूमि-विभाजन के इस प्रसंग में यह शब्द वेदी पर चढ़ाए जाने वाले बलिदान के बजाय किसी बड़े भूभाग में से विशेष उद्देश्य के लिए अलग किए गए हिस्से को दर्शाता है।
- source_word: חֲמִשָּׁה וְעֶשְׂרִים אֶלֶף ... בַּחֲמִשָּׁה וְעֶשְׂרִים אָלֶף
  choice: पच्चीस हज़ार गुणा पच्चीस हज़ार
  rationale: इब्रानी में यहाँ माप की इकाई नहीं दी गई है; ‘गुणा’ आधुनिक हिन्दी में दोनों आयामों को स्वाभाविक ढंग से व्यक्त करता है। प्रसंग से ‘हाथ’ समझना संभव है, इसलिए उसे पादटिप्पणी में रखा गया है।
- source_word: רְבִיעִית
  choice: चौकोर
  rationale: तत्कालीन भू-विन्यास में पूरा अलग किया गया क्षेत्र पच्चीस हज़ार गुणा पच्चीस हज़ार है; इसलिए यह रूप यहाँ चार बराबर भुजाओं वाले, अर्थात चौकोर, क्षेत्र का संकेत दे सकता है। ‘चौथाई’ भी भाषिक रूप से संभव है और पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: תָּרִימוּ
  choice: अलग रखना
  rationale: रום के हिफ़ील रूप का अर्थ इस प्रशासनिक और भौगोलिक प्रसंग में किसी हिस्से को विशेष उद्देश्य के लिए निर्धारित या अलग करना है, न कि उसे शारीरिक रूप से ऊपर उठाना।
- source_word: הַקֹּדֶשׁ
  choice: पवित्र
  rationale: यह शब्द उस भाग को पवित्र प्रयोजन के लिए निर्धारित बताता है; ‘पवित्र’ मानक और स्पष्ट हिन्दी है।
- source_word: אֶל
  choice: के साथ
  rationale: यह संबंधसूचक अव्यय यहाँ पवित्र भाग और नगर की संपत्ति को संयुक्त भू-विन्यास के अंगों के रूप में जोड़ता है। शाब्दिक ‘की ओर’ हिन्दी में अस्पष्ट होगा।
- source_word: אֲחֻזַּת הָעִיר
  choice: नगर की संपत्ति
  rationale: אֲחֻזָּה किसी अधिकार में दी गई भूमि या भू-संपत्ति को दर्शाता है; ‘नगर की संपत्ति’ आधुनिक हिन्दी में स्पष्ट है।
theological_decisions:
- issue: רְבִיעִית और אֶל אֲחֻזַּת הָעִיר का परस्पर संबंध
  choice: पवित्र भाग को नगर की संपत्ति के साथ मिलाकर चौकोर क्षेत्र के रूप में अलग रखना
  alternative: पवित्र भाग को नगर की संपत्ति का चौथाई भाग मानकर अलग रखना
  rationale: पच्चीस हज़ार गुणा पच्चीस हज़ार के समान आयाम और अध्याय के व्यापक भू-विन्यास के कारण ‘चौकोर’ तथा ‘के साथ’ अधिक संगत प्रतीत होते हैं; फिर भी व्याकरण ‘चौथाई’ अर्थ की संभावना को पूरी तरह समाप्त नहीं करता, इसलिए उसे पादटिप्पणी में दिया गया है। यह निर्णय भू-विन्यास संबंधी है, किसी सांप्रदायिक सिद्धांत पर आधारित नहीं।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल किंतु गरिमापूर्ण भू-विभाजन संबंधी भाषा अपनाई गई है। ‘अंशदान’ या ‘भेंट’ से संभावित बलिदानी अर्थ पैदा हो सकता था, इसलिए ‘अलग रखा गया भाग’ चुना गया। दोनों वास्तविक पाठगत अनिश्चितताओं को पादटिप्पणियों में स्पष्ट रखा गया है।
