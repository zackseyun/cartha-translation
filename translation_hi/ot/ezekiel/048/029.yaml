  text: זֹ֥את הָ/אָ֛רֶץ אֲשֶׁר תַּפִּ֥ילוּ מִֽ/נַּחֲלָ֖ה לְ/שִׁבְטֵ֣י יִשְׂרָאֵ֑ל וְ/אֵ֨לֶּה֙ מַחְלְקוֹתָ֔/ם נְאֻ֖ם אֲדֹנָ֥/י יְהוִֽה־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/048/029.yaml
  text: This is the land that you shall assign as an inheritance to the tribes of Israel[a], and these are their portions, declares the Lord GOD.
translation:
  language: hi
  text: यह वह देश है जिसे तुम इस्राएल के गोत्रों को विरासत के रूप में बाँटोगे, और ये उनके आवंटित भाग हैं—प्रभु याहवे की यह घोषणा है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: זֹאת הָאָרֶץ
  choice: यह वही देश है
  rationale: प्रदर्शक सर्वनाम और संज्ञा इस समापन-सार में पहले वर्णित देश की ओर संकेत करते हैं; हिंदी में ‘यह वही देश है’ संदर्भ को स्वाभाविक रूप से व्यक्त करता है।
- source_word: תַּפִּילוּ מִנַּחֲלָה
  choice: जिसे तुम ... विरासत के रूप में बाँटोगे
  rationale: हिफ़ील נפל भूमि-वितरण के प्रसंग में चिट्ठी अथवा निर्धारित भाग के अनुसार बाँटने का अर्थ देता है; נַחֲלָה वंशगत विरासत/अधिकार का भाव रखता है।
- source_word: לְשִׁבְטֵי יִשְׂרָאֵל
  choice: इस्राएल के गोत्रों को
  rationale: लामेद वितरण पाने वालों को चिह्नित करता है; ‘गोत्र’ שֵׁבֶט का स्थापित और स्पष्ट हिंदी प्रतिशब्द है।
- source_word: מַחְלְקוֹתָם
  choice: उनके हिस्से
  rationale: यह विभिन्न गोत्रों को बाँटकर दिए गए भू-भागों को दर्शाता है; ‘हिस्से’ सामान्य आधुनिक हिंदी में स्पष्ट है और ‘विभाजन’ की अपेक्षा परिणामी आवंटनों को बेहतर व्यक्त करता है।
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: प्रभु यहोवा की यह घोषणा है
  rationale: נְאֻם भविष्यद्वाणी की प्रामाणिक घोषणा का सूत्र है। संयुक्त उपाधि में אֲדֹנָי को ‘प्रभु’ और יהוה को व्यक्तिगत वाचा-नाम ‘यहोवा’ से व्यक्त किया गया है।
theological_decisions:
- issue: संयुक्त ईश्वरीय उपाधि אֲדֹנָי יְהוִה का अनुवाद
  choice: प्रभु यहोवा
  alternative: प्रभु परमेश्वर
  rationale: ‘प्रभु यहोवा’ इब्रानी के दोनों घटकों—उपाधि אֲדֹנָי और वाचा-नाम יהוה—को अलग-अलग बनाए रखता है और मूल पाठ में उपस्थित व्यक्तिगत नाम को सामान्य पदवी में विलीन नहीं करता।
translation_notes:
  register: आधुनिक मानक हिंदी का गरिमापूर्ण और सहज गद्य। ‘देश’ व्यापक भू-प्रदेश के लिए, ‘गोत्र’ जनजातीय इकाइयों के लिए और ‘हिस्से’ आवंटित भू-भागों के लिए चुना गया है।
