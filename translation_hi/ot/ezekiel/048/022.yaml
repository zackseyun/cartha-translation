base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/048/022.yaml
  text: And from the property of the Levites and from the property of the city[a], in the midst of what belongs to the prince, between the border of Judah and the border of Benjamin[b], it shall belong to the prince.
translation:
  language: hi
  text: लेवियों की भू-संपत्ति और नगर की भू-संपत्ति के सन्दर्भ में, जो प्रधान के लिए निर्धारित है उसके भीतर—यहूदा की सीमा और बिन्यामीन की सीमा के बीच—वह प्रधान का होगा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֲחֻזַּת
  choice: भू-संपत्ति
  rationale: यह शब्द स्थायी रूप से धारित भूमि या भू-भाग को दर्शाता है। यहाँ केवल सामान्य संपत्ति नहीं, बल्कि भूमि के आवंटित हिस्से की बात है; इसलिए ‘भू-संपत्ति’ स्पष्ट और प्रसंगानुकूल है।
- source_word: הַלְוִיִּם
  choice: लेवियों
  rationale: यह लेवीवंशियों का मानक हिन्दी नाम है; सम्बन्धसूचक रचना में निश्चितता स्वाभाविक रूप से व्यक्त होती है।
- source_word: הָעִיר
  choice: नगर
  rationale: आसपास के प्रसंग में यह नगर को आवंटित भूमि का निर्देश करता है। ‘नगर’ आधुनिक, गरिमापूर्ण और स्पष्ट है।
- source_word: בְּתוֹךְ
  choice: के बीच
  rationale: यह बड़े भू-भाग के भीतर स्थित होने का स्थानिक भाव रखता है। ‘के बीच’ हिन्दी में स्वाभाविक है और मूल की स्थानिकता बनाए रखता है।
- source_word: אֲשֶׁר לַנָּשִׂיא יִהְיֶה
  choice: प्रधान के हिस्से के ... जो क्षेत्र है
  rationale: सम्बन्धवाचक उपवाक्य उस बड़े क्षेत्र को प्रधान के लिए निर्धारित भाग के रूप में पहचानता है। हिन्दी वाक्य-रचना में ‘प्रधान के हिस्से’ इस आवंटन को सहज रूप से व्यक्त करता है।
- source_word: נָשִׂיא
  choice: प्रधान
  rationale: यहेजकेल में यह नागरिक शासक की उपाधि है। ‘प्रधान’ इसे ‘राजा’ से अलग रखते हुए नेतृत्व और पद का भाव देता है तथा किसी अधिक विशिष्ट राजकीय या मसीही अर्थ को आरोपित नहीं करता।
- source_word: גְּבוּל
  choice: सीमा
  rationale: यहाँ शब्द जनजातीय भू-भागों की सीमारेखाओं को सूचित करता है। ‘सीमा’ मूल की स्थानिक छवि को बनाए रखती है; ‘प्रदेश’ सम्भव वैकल्पिक अर्थ है।
- source_word: לַנָּשִׂיא יִהְיֶה
  choice: वह प्रधान का होगा
  rationale: अंत में दोहराया गया वाक्यांश इस बीच के भू-भाग को प्रधान के लिए आवंटित किए जाने पर बल देता है। यह हिन्दी में संक्षिप्त और स्पष्ट है।
theological_decisions:
- issue: पुनर्स्थापित देश के दर्शन में נָשִׂיא का अनुवाद
  choice: प्रधान
  alternative: राजकुमार; शासक; अगुवा
  rationale: मूल शब्द यहाँ एक नागरिक शासक की पदवी है और ‘राजा’ के लिए प्रयुक्त शब्द से भिन्न है। ‘प्रधान’ उस भेद को सुरक्षित रखता है और पदधारी की किसी विशिष्ट संवैधानिक या मसीही पहचान का निर्णय पाठ से आगे जाकर नहीं करता।
- issue: आरम्भिक מִן-युक्त पदबंध का स्थानिक सम्बन्ध
  choice: से आगे
  alternative: से; को छोड़कर; के दोनों ओर
  rationale: मूल वाक्य-रचना संक्षिप्त है और מִן यहाँ सीमा से आरम्भ, उससे बाहर का क्षेत्र, अथवा स्थानिक सम्बन्ध सूचित कर सकता है। मुख्य पाठ में ‘से आगे’ भू-विभाजन के प्रसंग में पठनीय है, जबकि पादटिप्पणी निकटतर औपचारिक विकल्प सुरक्षित रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध शैली अपनाई गई है। भूमि-विभाजन स्पष्ट करने के लिए ‘भू-संपत्ति’, ‘हिस्सा’ और ‘क्षेत्र’ का प्रयोग किया गया है। मूल की कठिन स्थानिक रचना को मुख्य पाठ में सहज बनाया गया है, पर उसके वास्तविक वैकल्पिक अर्थ पादटिप्पणियों में सुरक्षित हैं।
