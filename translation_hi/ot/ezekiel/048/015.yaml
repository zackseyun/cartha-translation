  text: And the remaining five thousand in width[a], along the face of the twenty-five thousand, shall be common land for the city, for dwelling, and for open land[c][b]; and the city shall be in its midst.
translation:
  language: hi
  text: और चौड़ाई में शेष पाँच हज़ार, पच्चीस हज़ार के सामने[a], नगर के लिए साधारण भूमि[b] होगा—निवास और खुली भूमि[c] के लिए; और नगर उसके बीच में होगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘पच्चीस हज़ार के साथ-साथ।’ इब्रानी में शाब्दिक अर्थ ‘के मुख के सामने’ है; यह स्थानवाचक अभिव्यक्ति किसी भूभाग के सामने अथवा उसके साथ-साथ विस्तार को बता सकती है।
    reason: lexical_alternative
  - marker: b
    text: ‘साधारण भूमि’ से आशय ऐसी भूमि से है जो पवित्र या समर्पित नहीं है; यहाँ यह आसपास के समर्पित भूभागों से अलग है।
    reason: cultural_note
  - marker: c
    text: ‘खुली भूमि’ का अर्थ नगर के आसपास सामुदायिक उपयोग की खुली भूमि हो सकता है, जिसमें चरागाह भी सम्मिलित हो सकता था।
    reason: lexical_alternative
