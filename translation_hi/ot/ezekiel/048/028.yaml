  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी रखी गई है। मूल की दक्षिण-संबंधी पुनरुक्ति को जानबूझकर बनाए रखा गया है। अनिश्चित भौगोलिक पहचान को मुख्य पाठ में निश्चित तथ्य बनाकर नहीं जोड़ा गया।
