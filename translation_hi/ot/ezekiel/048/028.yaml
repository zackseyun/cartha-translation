  text: וְ/עַל֙ גְּב֣וּל גָּ֔ד אֶל פְּאַ֖ת נֶ֣גֶב תֵּימָ֑נָ/ה וְ/הָיָ֨ה גְב֜וּל מִ/תָּמָ֗ר מֵ֚י מְרִיבַ֣ת קָדֵ֔שׁ נַחֲלָ֖ה עַל הַ/יָּ֥ם הַ/גָּדֽוֹל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/048/028.yaml
  text: And along the border of Gad[a], on the south side southward, the border shall run from Tamar to the waters of Meribath-kadesh, to the Wadi of Egypt[b], and on to the Great Sea.
translation:
  language: hi
  text: और गाद की सीमा के साथ, दक्षिण की ओर, दक्षिणी दिशा में, सीमा तामार से मरीबत-कादेश[a] के जल तक, फिर नाले[b] तक और बड़े समुद्र तक होगी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इस स्थान-नाम का रूप “मरीबा-कादेश” भी किया जा सकता है।
    reason: lexical_alternative
  - marker: b
    text: इसे “बरसाती नाला” या “नदी की सूखी घाटी” भी समझा जा सकता है। परंपरागत रूप से इसकी पहचान “मिस्र के नाले” से की जाती है, लेकिन इस पद के हिब्रू पाठ में “मिस्र” शब्द नहीं है।
    reason: textual_geographical_clarification
lexical_decisions:
- source_word: וְעַל גְּבוּל גָּד
  choice: और गाद की सीमा के साथ
  rationale: וְעַל को सीमा-वर्णन में स्वाभाविक हिन्दी ‘के साथ’ से व्यक्त किया गया है; इससे गाद के भूभाग से लगी सीमा का भाव स्पष्ट रहता है।
- source_word: אֶל פְּאַת נֶגֶב תֵּימָנָה
  choice: दक्षिण की ओर दक्षिणी भाग में
  rationale: मूल में दक्षिण के लिए आए दोनों संकेतों को बनाए रखा गया है, ताकि उसकी जानबूझकर की गई दिशात्मक पुनरुक्ति न मिटे।
- source_word: וְהָיָה גְבוּל
  choice: सीमा ... होगी
  rationale: हिब्रू सीमा-सूत्र का सीधा और स्वाभाविक हिन्दी रूप; सीमा के मार्ग का बोध आगे दिए गए स्थानों के क्रम से होता है।
- source_word: מִתָּמָר
  choice: तामार से
  rationale: स्थान-नाम का हिन्दी लिप्यंतरण किया गया है।
- source_word: מֵי מְרִיבַת קָדֵשׁ
  choice: मरीबत-कादेश के जल तक
  rationale: मूल के संयुक्त स्थान-नाम को लिप्यंतरित किया गया है; ‘जल’ बहुवचन/सामूहिक מֵי को व्यक्त करता है।
- source_word: נַחֲלָה
  choice: नाले तक
  rationale: נחל इस स्थल-सीमा के संदर्भ में नदी-घाटी, मौसमी जलधारा या उसके पाट को सूचित कर सकता है। मूल पाठ में ‘मिस्र’ नहीं है, इसलिए उसे मुख्य पाठ में नहीं जोड़ा गया।
- source_word: עַל הַיָּם הַגָּדוֹל
  choice: और महासागर तक
  rationale: ‘महासागर’ הַיָּם הַגָּדוֹל का अर्थपूर्ण हिन्दी रूप है और यहाँ भूमध्य सागर की ओर संकेत करता है; עַל को सीमा की अंतिम दिशा के संदर्भ में ‘तक’ से व्यक्त किया गया है।
