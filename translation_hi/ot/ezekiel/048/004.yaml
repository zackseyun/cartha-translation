  text: וְ/עַ֣ל גְּב֣וּל נַפְתָּלִ֗י מִ/פְּאַ֥ת קָדִ֛מָ/ה עַד פְּאַת יָ֖מָּ/ה מְנַשֶּׁ֥ה אֶחָֽד׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/048/004.yaml
  text: And along the border of Naphtali[a], from the east side to the west side, Manasseh, one portion.
translation:
  language: hi
  text: और नप्ताली की सीमा के साथ-साथ, पूर्व की ओर से पश्चिम की ओर तक, मनश्शे का एक भाग[a] होगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से केवल ‘मनश्शे—एक’ है। इस अध्याय में बार-बार आने वाले संक्षिप्त भू-विभाजन सूत्र के कारण ‘भाग’ शब्द जोड़ा गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל גְּבוּל
  choice: और ... की सीमा के साथ-साथ
  rationale: וְעַל इस क्रम में अगले भूभाग को पिछली जनजातीय सीमा के पास और उसके समानांतर रखता है। ‘सीमा के साथ-साथ’ इस स्थानिक संबंध को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: נַפְתָּלִי
  choice: नप्ताली
  rationale: इस्राएल के गोत्र का नाम मानक हिन्दी बाइबिलीय लिप्यंतरण में दिया गया है।
- source_word: מִפְּאַת קָדִימָה עַד פְּאַת יָמָּה
  choice: पूर्व की ओर से पश्चिम की ओर तक
  rationale: यह आवर्ती भौगोलिक सूत्र प्रत्येक गोत्रीय भूभाग के पूरे पूर्व-पश्चिम विस्तार को बताता है। ‘ओर’ פֵאָה के ‘पार्श्व/किनारे’ के भाव को सरल, वर्तमान हिन्दी में संप्रेषित करता है।
- source_word: מְנַשֶּׁה
  choice: मनश्शे
  rationale: इस्राएल के गोत्र का नाम प्रचलित हिन्दी बाइबिलीय लिप्यंतरण में दिया गया है।
- source_word: אֶחָד
  choice: एक भाग
  rationale: इब्रानी में केवल ‘एक’ है, पर अध्याय के भू-विभाजन सूत्र में ‘भाग’ निहित है। हिन्दी में अर्थ स्पष्ट और वाक्य स्वाभाविक करने के लिए ‘भाग’ जोड़ा गया है और इसे पाद-टिप्पणी में बताया गया है।
