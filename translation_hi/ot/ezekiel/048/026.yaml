source:
  edition: WLC
  text: וְ/עַ֣ל גְּב֣וּל יִשָׂשכָ֗ר מִ/פְּאַ֥ת קָדִ֛ימָ/ה עַד פְּאַת יָ֖מָּ/ה זְבוּלֻ֥ן אֶחָֽד׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/048/026.yaml
  text: And along the border of Issachar[a], from the east side to the west side, Zebulun[b], one portion.
translation:
  language: hi
  text: इस्साकार की सीमा के साथ-साथ, पूर्वी छोर से पश्चिमी छोर[a] तक, जबूलून का एक भाग[b] होगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से ‘समुद्र की ओर का छोर’ है; यहाँ यह पश्चिमी छोर के लिए प्रयुक्त भौगोलिक मुहावरा है।
    reason: cultural_note
  - marker: b
    text: इब्रानी में शाब्दिक रूप से ‘जबूलून—एक’ है; ‘भाग’ अध्याय में बार-बार आने वाले भूमि-विभाजन के सूत्र के आधार पर जोड़ा गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל
  choice: की सीमा के साथ-साथ
  rationale: संयोजक और संबंधसूचक अव्यय यहाँ अगली भू-सीमा को पिछली सीमा के समानांतर रखता है; ‘साथ-साथ’ इस स्थानिक अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: גְּבוּל
  choice: सीमा
  rationale: भूमि-विभाजन के प्रसंग में यह गोत्र के भूभाग की सीमारेखा को सूचित करता है।
- source_word: יִשָׂשכָר
  choice: इस्साकार
  rationale: गोत्र के नाम का प्रचलित हिन्दी लिप्यंतरण।
- source_word: מִפְּאַת קָדִימָה
  choice: पूर्वी छोर से
  rationale: פֵּאָה का अर्थ किनारा या छोर है और קָדִימָה पूर्व दिशा को दर्शाता है; संयुक्त रूप में ‘पूर्वी छोर से’ संक्षिप्त और स्वाभाविक है।
- source_word: עַד פְּאַת יָמָּה
  choice: पश्चिमी छोर तक
  rationale: यद्यपि יָם का मूल अर्थ ‘समुद्र’ है, इस भौगोलिक प्रयोग में वह पश्चिम दिशा का संकेत देता है; עַד विस्तार की अंतिम सीमा बताता है।
- source_word: זְבוּלֻן
  choice: जबूलून
  rationale: गोत्र के नाम का प्रचलित हिन्दी लिप्यंतरण।
- source_word: אֶחָד
  choice: एक भाग
  rationale: इब्रानी में केवल ‘एक’ है, पर अध्याय में बार-बार आने वाले भूमि-विभाजन के सूत्र से ‘भाग’ निहित है; इसे जोड़ने से हिन्दी स्पष्ट और स्वाभाविक रहती है।
theological_decisions: []
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण भू-विभाजन शैली रखी गई है। इब्रानी का क्रियारहित वाक्य हिन्दी में स्वाभाविक बनाने के लिए ‘होगा’ जोड़ा गया है। फुटनोट चिह्न उन शब्दों के ठीक बाद रखे गए हैं जिनकी वे व्याख्या करते हैं।
