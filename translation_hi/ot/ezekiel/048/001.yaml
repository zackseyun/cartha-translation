- source_word: לְבוֹא חֲמָת
  choice: लेबो-हमात की ओर
  rationale: भौगोलिक संदर्भ में इसे प्रचलित स्थान-नाम मानते हुए लिप्यंतरित किया गया है; शाब्दिक अर्थ पादटिप्पणी में दिया गया है।
- source_word: חֲצַר עֵינָן
  choice: हसर-एनान
  rationale: स्थान-नाम का हिन्दी लिप्यंतरण।
- source_word: גְּבוּל דַּמֶּשֶׂק צָפוֹנָה אֶל יַד חֲמָת
  choice: जो दमिश्क की उत्तरी सीमा पर, हमात के पास है
  rationale: संक्षिप्त इब्रानी भू-सीमा सूत्र को उसके शब्दक्रम का आशय बचाते हुए सुबोध हिन्दी में व्यक्त करता है।
- source_word: וְהָיוּ לוֹ פְאַת קָדִים הַיָּם
  choice: और पूर्वी छोर से समुद्र तक ... होगा
  rationale: संक्षिप्त और कुछ अस्पष्ट इब्रानी वाक्यांश को दान के भूभाग के पूर्व-पश्चिम विस्तार के रूप में प्रस्तुत करता है, जबकि वैकल्पिक अधिक शाब्दिक पाठ पादटिप्पणी में सुरक्षित है।
- source_word: דָּן אֶחָד
  choice: दान का एक भाग
  rationale: אֶחָד के साथ निहित भू-आवंटन को ‘एक भाग’ से स्पष्ट किया गया है।
