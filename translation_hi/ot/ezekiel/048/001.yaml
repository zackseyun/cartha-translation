  text: וְ/אֵ֖לֶּה שְׁמ֣וֹת הַ/שְּׁבָטִ֑ים מִ/קְצֵ֣ה צָפ֡וֹנָ/ה אֶל יַ֣ד דֶּֽרֶךְ חֶתְלֹ֣ן לְֽבוֹא חֲמָ֡ת חֲצַ֣ר עֵינָן֩ גְּב֨וּל דַּמֶּ֤שֶׂק צָפ֨וֹנָ/ה֙ אֶל יַ֣ד חֲמָ֔ת וְ/הָיוּ ל֧/וֹ פְאַת קָדִ֛ים הַ/יָּ֖ם דָּ֥ן אֶחָֽד־־׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/048/001.yaml
  text: 'These are the names of the tribes: from the northern extremity[a], beside the way of Hethlon to Lebo-hamath, Hazar-enan, at the border of Damascus northward beside Hamath, and extending from the east side to the sea, Dan[b], one portion.'
translation:
  language: hi
  text: 'गोत्रों के नाम ये हैं: उत्तरी छोर से—हेतलोन के मार्ग के पास लेबो-हमात तक[a], हसर-एनान, उत्तर की ओर दमिश्क की सीमा पर, हमात के पास—पूर्वी ओर से समुद्र तक दान का एक भाग[b] होगा।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “लेबो-हमात” को परंपरागत रूप से स्थान-नाम समझा जाता है; इसका शाब्दिक अर्थ “हमात का प्रवेश-स्थान” है।
    reason: lexical_alternative
  - marker: b
    text: या, “और उसका किनारा पूर्व से समुद्र तक होगा।” इब्रानी वाक्यांश संक्षिप्त है और दान के भाग के पूर्व से पश्चिम तक विस्तार का वर्णन करता है।
    reason: alternative_reading
