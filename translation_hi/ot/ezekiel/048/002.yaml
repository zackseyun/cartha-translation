    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/עַל
  choice: और ... की सीमा के साथ-साथ
  rationale: संयोजक और संबंधसूचक पद अगले भू-भाग को क्रम में दान की सीमा से सटा हुआ बताते हैं; ‘साथ-साथ’ स्थानिक संबंध को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: גְּבוּל
  choice: सीमा
  rationale: भूमि-विभाजन के संदर्भ में यह किसी गोत्र के भू-भाग की सीमारेखा को दर्शाता है।
- source_word: דָּן
  choice: दान
  rationale: गोत्र के नाम का प्रचलित हिन्दी लिप्यंतरण।
- source_word: מִ/פְּאַת קָדִים
  choice: पूर्वी छोर से
  rationale: פֵּאָה का अर्थ किनारा, ओर या छोर है और קָדִים यहाँ पूर्व दिशा बताता है; ‘पूर्वी छोर’ भौगोलिक विस्तार को स्पष्ट रखता है।
- source_word: עַד פְּאַת יָמָּה
  choice: पश्चिमी छोर तक
  rationale: יָם का शाब्दिक अर्थ ‘समुद्र’ है, पर यहाँ वह दिशा-सूचक रूप में पश्चिम को दर्शाता है; हिन्दी में ‘पश्चिमी छोर’ आशय को सहज और स्पष्ट बनाता है।
- source_word: אָשֵׁר
  choice: आशेर
  rationale: गोत्र के नाम का प्रचलित हिन्दी लिप्यंतरण।
- source_word: אֶחָד
  choice: एक भाग
  rationale: मूल में केवल ‘एक’ है, पर अध्याय के भूमि-विभाजन सूत्र में ‘भाग’ निहित है; इसे जोड़ने से हिन्दी वाक्य पूर्ण और अर्थ स्पष्ट होता है।
