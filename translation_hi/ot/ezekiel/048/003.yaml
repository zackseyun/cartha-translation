base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/048/003.yaml
  text: And alongside the border of Asher[a], from the eastern side to the western side, Naphtali, one portion.
translation:
  language: hi
  text: और आशेर की सीमा के साथ-साथ, पूर्वी छोर से पश्चिमी छोर तक, नप्ताली का एक भाग[a] होगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से, “नप्ताली, एक।” इस अध्याय के भूमि-विभाजन के प्रसंग से स्पष्टता के लिए “भाग” जोड़ा गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/עַל
  choice: और … की सीमा के साथ-साथ
  rationale: यह पद अगले भूभाग को आशेर की सीमा से सटे हुए स्थान पर रखता है। ‘के साथ-साथ’ स्थानिक निकटता को स्वाभाविक हिन्दी में स्पष्ट करता है।
- source_word: גְּבוּל
  choice: सीमा
  rationale: यह संज्ञा यहाँ किसी भूभाग की सीमा-रेखा को सूचित करती है; ‘सीमा’ आधुनिक हिन्दी में सटीक और सहज है।
- source_word: אָשֵׁר
  choice: आशेर
  rationale: गोत्र के नाम का प्रचलित हिन्दी लिप्यंतरण।
- source_word: מִ/פְּאַת קָדִימָ/ה
  choice: पूर्वी छोर से
  rationale: פֵּאָה किसी ओर, किनारे या छोर को और קָדִימָה पूर्व दिशा को दर्शाता है। ‘पूर्वी छोर से’ सीमा-वर्णन को संक्षेप और स्पष्ट रूप में रखता है।
- source_word: וְ/עַד פְּאַת יָמָּ/ה
  choice: पश्चिमी छोर तक
  rationale: עַד विस्तार की अंतिम सीमा बताता है; יָמָּה का शाब्दिक संबंध समुद्र से है, पर यहाँ दिशात्मक अर्थ ‘पश्चिम’ है।
- source_word: נַפְתָּלִי
  choice: नप्ताली
  rationale: गोत्र के नाम का प्रचलित हिन्दी लिप्यंतरण।
- source_word: אֶחָד
  choice: एक भाग
  rationale: इब्रानी में केवल ‘एक’ है, पर अध्याय के भूमि-विभाजन प्रसंग में इसका आशय नप्ताली को मिली एक भू-पट्टी या भाग से है। ‘भाग’ को स्पष्टता के लिए जोड़ा गया है और इसकी सूचना पादटिप्पणी में दी गई है।
