source:
  edition: WLC
  text: וְ/הָיְתָ֨ה לָ/הֶ֧ם תְּרוּמִיָּ֛ה מִ/תְּרוּמַ֥ת הָ/אָ֖רֶץ קֹ֣דֶשׁ קָדָשִׁ֑ים אֶל גְּב֖וּל הַ/לְוִיִּֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/048/012.yaml
  text: And it shall be for them a special allotment from the contribution of the land[a], most holy[c][b], beside the territory of the Levites.
translation:
  language: hi
  text: और भूमि के अलग रखे गए अंश में से उनके लिए एक विशेष अंश[a] होगा—परमपवित्र[b]—और लेवियों की सीमा के पास होगा[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अलग रखा हुआ भाग” या “चढ़ावे का भाग।” इब्रानी शब्द उस अंश को दर्शाता है जो पवित्र प्रयोजन के लिए अलग किया गया हो।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “पवित्रों का पवित्र”; यहाँ यह भूमि के इस भाग की सर्वोच्च पवित्रता बताता है।
    reason: lexical_alternative
  - marker: c
    text: या, “लेवियों के क्षेत्र के पास”; इब्रानी शब्द का अर्थ “सीमा” और उससे घिरा “क्षेत्र,” दोनों हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיְתָה לָהֶם
  choice: यह उनके लिए ... होगा
  rationale: वाव-संयुक्त पूर्ण क्रिया इस भावी भू-विभाजन के वर्णन में भविष्यसूचक अर्थ देती है; לָהֶם लाभ और अधिकार, दोनों का भाव रखता है।
- source_word: תְּרוּמִיָּה
  choice: अलग रखा हुआ भाग
  rationale: यह रूप किसी चढ़ाए या पवित्र उपयोग के लिए अलग किए गए अंश को दर्शाता है; यहाँ संदर्भ भूमि के निर्धारित भूभाग का है।
- source_word: מִתְּרוּמַת הָאָרֶץ
  choice: भूमि के पवित्र अंश में से
  rationale: यह छोटा भाग उस व्यापक भूखंड में से है जिसे पवित्र प्रयोजन के लिए अलग किया गया है। 'पवित्र अंश' धार्मिक समर्पण और भूमि-विभाजन दोनों भावों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: קֹדֶשׁ קָדָשִׁים
  choice: परमपवित्र
  rationale: यह इब्रानी की परमोत्कृष्टता-सूचक रचना है, जिसका शाब्दिक भाव 'पवित्रों का पवित्र' और अर्थ 'सबसे पवित्र' है। यहाँ यह भूभाग की पवित्रता का विधेय है, इसलिए 'स्थान' नहीं जोड़ा गया।
- source_word: אֶל גְּבוּל הַלְוִיִּם
  choice: लेवियों की सीमा के पास
  rationale: सीमा-वर्णन में אֶל निकटता या सटाव बताता है। גְּבוּל का मूल अर्थ सीमा है, यद्यपि प्रसंग में उससे सीमांकित क्षेत्र भी अभिप्रेत हो सकता है।
theological_decisions:
- issue: קֹדֶשׁ קָדָשִׁים को मंदिर के तकनीकी नाम के रूप में समझना
  choice: परमपवित्र
  alternative: परमपवित्र स्थान / परमपवित्र भाग
  rationale: इब्रानी पाठ स्पष्ट रूप से किसी 'स्थान' या भीतरी पवित्रस्थान को नहीं कहता, बल्कि भूमि के अंश को परमपवित्र बताता है; इसलिए तकनीकी मंदिर-संबंधी अर्थ आरोपित नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण और सहज भू-विभाजन संबंधी भाषा अपनाई गई है। 'परमपवित्र' मूल की संक्षिप्त विधेयात्मक रचना को बनाए रखता है, जबकि विराम-चिह्न वाक्य का संबंध स्पष्ट करते हैं।
