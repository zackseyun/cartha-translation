    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֶתֶר הַשְּׁבָטִים
  choice: और बाकी गोत्रों के लिए
  rationale: यह पद शेष गोत्रों के भूमि-विभाजन का नया खंड आरंभ करता है। यह रूप संयोजक וְ, ‘बाकी’, और प्रसंगगत संबंध को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: מִפְּאַת קָדִימָה
  choice: पूर्वी छोर से
  rationale: פֵּאָה यहाँ भूभाग के छोर या सीमा को दर्शाता है; ‘पूर्वी छोर’ प्रादेशिक सूत्र को स्पष्ट और सहज रूप से व्यक्त करता है।
- source_word: עַד פְּאַת יָמָּה
  choice: पश्चिमी छोर तक
  rationale: יָמָּה इस प्रसंग में पश्चिम दिशा को सूचित करता है; ‘पश्चिमी छोर तक’ समानांतर भौगोलिक अभिव्यक्ति बनाए रखता है।
- source_word: בִּנְיָמִן
  choice: बिन्यामीन
  rationale: हिब्रू जनजातीय नाम का हिन्दी में प्रचलित बाइबलीय लिप्यंतरण।
- source_word: אֶחָד
  choice: एक भाग
  rationale: मूल पाठ में केवल ‘एक’ है, पर अध्याय के बार-बार आने वाले भूमि-विभाजन सूत्र में इसका अर्थ एक प्रादेशिक भाग है। हिन्दी में अर्थ स्पष्ट करने के लिए ‘भाग’ जोड़ा गया है और इसे पादटिप्पणी में बताया गया है।
