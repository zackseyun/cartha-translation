  text: וְ/שַׁעֲרֵ֣י הָ/עִ֗יר עַל שְׁמוֹת֙ שִׁבְטֵ֣י יִשְׂרָאֵ֔ל שְׁעָרִ֥ים שְׁלוֹשָׁ֖ה צָפ֑וֹנָ/ה שַׁ֣עַר רְאוּבֵ֞ן אֶחָ֗ד שַׁ֤עַר יְהוּדָה֙ אֶחָ֔ד שַׁ֥עַר לֵוִ֖י אֶחָֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/048/031.yaml
  text: 'And the gates of the city shall be named after the tribes of Israel: three gates on the north side—one gate of Reuben[a], one gate of Judah, one gate of Levi.'
translation:
  language: hi
  text: 'और नगर के फाटकों के नाम इस्राएल के गोत्रों के नामों के अनुसार होंगे:[a] उत्तर की ओर तीन फाटक होंगे: रूबेन का एक फाटक, यहूदा का एक फाटक और लेवी का एक फाटक।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वे इस्राएल के गोत्रों के नाम धारण करेंगे।”
    reason: हिब्रू עַל שְׁמוֹत नामों के अनुसार नामकरण अथवा नाम धारण करने का भाव व्यक्त कर सकता है।
lexical_decisions:
