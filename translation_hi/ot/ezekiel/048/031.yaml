  choice: और नगर के फाटक
  rationale: संयोजक וְ को ‘और’ से रखते हुए रचनात्मक वर्णन की कड़ी बनाए रखी गई है; संबंधवाची पदबंध का सीधा और स्वाभाविक हिन्दी रूप है।
- source_word: עַל שְׁמוֹת שִׁבְטֵי יִשְׂרָאֵל
  choice: इस्राएल के गोत्रों के नामों पर होंगे
  rationale: עַל שְׁמוֹת यहाँ नामों के अनुसार नामकरण अथवा उनसे संबद्ध नाम धारण करने का भाव देता है। ‘नामों पर होंगे’ मूल की संरचना और उसकी हल्की अस्पष्टता को बनाए रखता है।
- source_word: שְׁעָרִים שְׁלוֹשָׁה צָפוֹנָה
  choice: उत्तर की ओर तीन फाटक
  rationale: צָפוֹנָה नगर की उत्तरी दिशा/ओर को सूचित करता है; यह हिन्दी में स्थापत्य-वर्णन के लिए सहज है।
- source_word: שַׁעַר רְאוּבֵן אֶחָד
  choice: एक रूबेन का फाटक
  rationale: गिनती और गोत्रीय नाम-संबंध दोनों को रखते हुए मूल के क्रम के निकट स्वाभाविक हिन्दी दी गई है।
- source_word: שַׁעַר יְהוּדָה אֶחָד
  choice: एक यहूदा का फाटक
  rationale: सूची में समानांतर रचना बनाए रखी गई है और ‘यहूदा’ को गोत्रीय नाम के रूप में रखा गया है।
- source_word: שַׁעַר לֵוִי אֶחָד
  choice: एक लेवी का फाटक
  rationale: मूल में आए गोत्रीय नाम ‘लेवी’ को ‘लेवियों’ में विस्तृत किए बिना समानांतर ढंग से प्रस्तुत किया गया है।
