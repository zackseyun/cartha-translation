base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/048/035.yaml
  text: All around shall be eighteen thousand[a], and the name of the city from that day on shall be, Yahweh Is There.
translation:
  language: hi
  text: नगर की चारों ओर की माप अठारह हज़ार होगी। उस दिन से नगर का नाम “याहवे वहाँ है”[क] होगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: क
    text: 'इब्रानी: “यहोवा शम्माह” (YHWH shammah), अर्थात् “याहवे वहाँ है।”'
    reason: दिव्य नाम और नगर के प्रतीकात्मक नाम के इब्रानी रूप को स्पष्ट करता है।
lexical_decisions:
- source_word: סָבִיב
  choice: चारों ओर की कुल माप
  rationale: यह नगर की चारों ओर की परिधि का सारात्मक माप बताता है। केवल ‘चारों ओर’ की अपेक्षा यह हिंदी में संख्यात्मक कथन को स्पष्ट और स्वाभाविक बनाता है।
- source_word: שְׁמֹנָה עָשָׂר אָלֶף
  choice: अठारह हज़ार
  rationale: इब्रानी में यहाँ इकाई दोहराई नहीं गई है; इसलिए संदर्भ से समझी जाने वाली माप-इकाई को मुख्य पाठ में जोड़े बिना मूल की संक्षिप्तता रखी गई है।
- source_word: וְשֵׁם הָעִיר
  choice: और ... नगर का नाम होगा
  rationale: यह नगर के औपचारिक नामकरण का सीधा और गरिमापूर्ण हिंदी रूप है।
- source_word: מִיּוֹם
  choice: उस दिन से
  rationale: מִן के आरंभ-बिंदु वाले अर्थ को सहज हिंदी में व्यक्त करता है; नाम उसी दिन से लागू होगा।
- source_word: יְהוָה
  choice: याहवे
  rationale: चतुरक्षरीय दिव्य नाम को किसी उपाधि से बदलने के बजाय आधुनिक हिंदी में प्रचलित निकट लिप्यंतरण दिया गया है।
- source_word: שָׁמָּה
  choice: वहाँ है
  rationale: नगर के प्रतीकात्मक नाम में स्थानवाचक क्रियाविशेषण विधेय की तरह प्रयुक्त है; हिंदी में ‘वहाँ है’ उसका स्वाभाविक अर्थ देता है।
theological_decisions:
- issue: नगर के नाम में יְהוָה का अनुवाद
  choice: याहवे वहाँ है
  alternative: प्रभु वहाँ है / यहोवा वहाँ है
  rationale: मूल पाठ में व्यक्तिगत दिव्य नाम सीधे आया है। ‘याहवे’ उसका लिप्यंतरण रखता है और उसे उपाधि में नहीं बदलता; पूरा पदबंध नाम के साथ-साथ ‘याहवे वहाँ है’ कथन का अर्थ भी सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक मानक हिंदी, संक्षिप्त और गरिमापूर्ण है। पहली पंक्ति में ‘कुल माप’ जोड़कर סָבִיב के परिधिगत आशय को स्वाभाविक बनाया गया है, पर मूल में अनुपस्थित माप-इकाई नहीं जोड़ी गई। नगर का प्रतीकात्मक नाम उद्धरण-चिह्नों में रखा गया है।
