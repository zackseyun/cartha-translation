  language: hi
  text: 'दक्षिण की ओर 4,500 हाथ[a] की माप थी, और तीन फाटक थे: शिमोन का एक फाटक, इस्साकार का एक फाटक, और जबूलून का एक फाटक।'
  philosophy: optimal-equivalence
  footnotes:
