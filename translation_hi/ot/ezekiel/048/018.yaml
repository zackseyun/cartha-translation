source:
  edition: WLC
  text: וְ/הַ/נּוֹתָ֨ר בָּ/אֹ֜רֶךְ לְ/עֻמַּ֣ת תְּרוּמַ֣ת הַ/קֹּ֗דֶשׁ עֲשֶׂ֨רֶת אֲלָפִ֤ים קָדִ֨ימָ/ה֙ וַ/עֲשֶׂ֤רֶת אֲלָפִים֙ יָ֔מָּ/ה וְ/הָיָ֕ה לְ/עֻמַּ֖ת תְּרוּמַ֣ת הַ/קֹּ֑דֶשׁ וְ/הָיְתָ֤ה תבואת/ה לְ/לֶ֔חֶם לְ/עֹבְדֵ֖י הָ/עִֽיר׀׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/048/018.yaml
  text: And the remainder along the length[a], corresponding to the holy contribution, shall be ten thousand to the east and ten thousand to the west; it shall correspond to the holy contribution[b], and its produce shall be for food for the workers of the city.
translation:
  language: hi
  text: और लंबाई के साथ बचा हुआ भाग, पवित्र अंश के अनुरूप, पूर्व की ओर दस हज़ार और पश्चिम की ओर दस हज़ार[a] होगा। वह पवित्र अंश के अनुरूप होगा, और उसकी उपज नगर में काम करने वालों के भोजन[b] के लिए होगी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से ‘समुद्र की ओर’; इब्रानी में यह पश्चिम दिशा बताने का सामान्य ढंग है।
    reason: lexical_alternative
  - marker: b
    text: या ‘रोटी’; यहाँ ‘रोटी’ से सामान्य रूप से भोजन-सामग्री का आशय हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַנּוֹתָר
  choice: बचा हुआ भाग
  rationale: यह उस भूभाग को दर्शाता है जो पहले बताए गए बँटवारे के बाद शेष रहता है।
- source_word: בָּאֹרֶךְ
  choice: लंबाई की दिशा में
  rationale: यह पवित्र भूभाग की लंबी भुजा के साथ मापे जाने वाले शेष क्षेत्र का स्थानिक अर्थ स्पष्ट करता है।
- source_word: לְעֻמַּת
  choice: के समानांतर
  rationale: भूमि-मापन के इस प्रसंग में यह पवित्र अंश के अनुरूप और उसके साथ-साथ फैले भूभाग को दर्शाता है; पद में इसकी पुनरावृत्ति भी बनाए रखी गई है।
- source_word: תְּרוּמַת הַקֹּדֶשׁ
  choice: पवित्र अंश
  rationale: यह यहेजकेल 45–48 में अलग ठहराए गए पवित्र भूभाग को सूचित करता है। ‘अंश’ भूमि के नियत हिस्से को स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: עֲשֶׂרֶת אֲלָפִים ... קָדִימָה
  choice: पूर्व की ओर दस हज़ार
  rationale: मूल पाठ संख्या और पूर्व दिशा का विस्तार बताता है; माप की इकाई इस पद में व्यक्त नहीं है, इसलिए उसे जोड़ा नहीं गया।
- source_word: וַעֲשֶׂרֶת אֲלָפִים יָמָּה
  choice: और पश्चिम की ओर दस हज़ार
  rationale: יָמָּה का शाब्दिक अर्थ समुद्र की ओर है और इस्राएली भौगोलिक प्रयोग में यह पश्चिम दिशा का सामान्य संकेत है।
- source_word: וְהָיְתָה תבואתה
  choice: और उसकी उपज ... होगी
  rationale: תבואה भूमि से मिलने वाली कृषि-उपज को व्यापक रूप से दर्शाता है।
- source_word: לְלֶחֶם
  choice: भोजन के लिए
  rationale: לֶחֶם का मूल अर्थ ‘रोटी’ है, पर यहाँ नगर के कामगारों के निर्वाह हेतु मिलने वाली खाद्य-सामग्री का व्यापक अर्थ अधिक उपयुक्त है।
- source_word: לְעֹבְדֵי הָעִיר
  choice: नगर के कामगारों के
  rationale: עבד का कृदंत नगर के लिए काम या सेवा करने वालों को दर्शाता है; ‘कामगार’ अनावश्यक रूप से धार्मिक सेवा का अर्थ आरोपित नहीं करता।
