source:
  edition: WLC
  text: וְ/לֹא יִמְכְּר֣וּ מִמֶּ֗/נּוּ וְ/לֹ֥א יָמֵ֛ר וְ/לֹ֥א יעבור רֵאשִׁ֣ית הָ/אָ֑רֶץ כִּי קֹ֖דֶשׁ לַ/יהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/048/014.yaml
  text: They must not sell any of it[a], nor exchange it, nor shall this choice portion of the land pass over to another, for it is holy to Yahweh.
translation:
  language: hi
  text: वे उसमें से कुछ भी न बेचें, न उसकी अदला-बदली करें, और भूमि का यह उत्तम भाग[a] किसी दूसरे के हाथ न जाए, क्योंकि यह याहवे के लिए पवित्र है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “भूमि की पहिली उपज” अथवा “भूमि का पहला भाग।” हिब्रू पद भूमि के पहले या प्रधान भाग पर, अथवा पहिली उपज के समान उसके समर्पित होने पर बल दे सकता है।
    reason: רֵאשִׁית הָאָרֶץ की वास्तविक शाब्दिक और प्रसंगगत अर्थ-संभावनाओं को सुरक्षित रखना।
lexical_decisions:
- source_word: יִמְכְּרוּ מִמֶּנּוּ
  choice: उसमें से कुछ भी न बेचें
  rationale: מכר का सामान्य कानूनी अर्थ ‘बेचना’ है; מִמֶּנּוּ उस पवित्र भू-भाग की ओर संकेत करता है जिसका वर्णन पहले हुआ है।
- source_word: יָמֵר
  choice: अदला-बदली करें
  rationale: מוּר का अर्थ किसी वस्तु के बदले दूसरी वस्तु रखना या विनिमय करना है; भूमि-संपत्ति के प्रसंग में ‘अदला-बदली’ स्वाभाविक और स्पष्ट है।
- source_word: יעבור
  choice: किसी दूसरे के हाथ न जाए
  rationale: עבר का मूल बिंब ‘पार जाना’ है, पर संपत्ति के प्रसंग में इसका आशय स्वामित्व के हस्तांतरण से है। यह हिंदी अभिव्यक्ति उस कानूनी अर्थ को स्वाभाविक ढंग से व्यक्त करती है।
- source_word: רֵאשִׁית הָאָרֶץ
  choice: भूमि का यह उत्तम भाग
  rationale: רֵאשִׁית का अर्थ पहला, प्रधान, आरंभिक अंश या पहिली उपज हो सकता है। यहाँ अलग किए गए पवित्र भू-भाग के प्रसंग में ‘उत्तम भाग’ कृषि-उपज का अर्थ अनावश्यक रूप से थोपे बिना प्रधान और समर्पित अंश का भाव देता है।
- source_word: קֹדֶשׁ לַיהוָה
  choice: याहवे के लिए पवित्र
  rationale: קֹדֶשׁ समर्पित पवित्र स्थिति बताता है और ל समर्पण अथवा संबंध व्यक्त करता है; יהוה को उसके व्यक्तिगत वाचा-नाम ‘याहवे’ से लिखा गया है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: याहवे
  alternative: प्रभु / यहोवा
  rationale: मूल पाठ में चार अक्षरों वाला व्यक्तिगत वाचा-नाम सीधे प्रयुक्त है। उसका लिप्यंतरण नाम को किसी उपाधि से बदलने के बजाय सुरक्षित रखता है।
- issue: רֵאשִׁית הָאָרֶץ में ‘पहिली उपज’ और ‘प्रधान भू-भाग’ के बीच अर्थ-संभावना
  choice: मुख्य पाठ में ‘भूमि का यह उत्तम भाग’, और पाद-टिप्पणी में अन्य संभावनाएँ
  alternative: भूमि की पहिली उपज / भूमि का पहला भाग
  rationale: निकटवर्ती प्रसंग भूमि के पवित्र आवंटन का है, इसलिए मुख्य पाठ में भू-भाग का अर्थ अधिक स्वाभाविक है; फिर भी हिब्रू पद की पहिली उपज-जैसी धार्मिक प्रतिध्वनि को पाद-टिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण, सहज कानूनी भाषा रखी गई है। ‘किसी दूसरे के हाथ न जाए’ संपत्ति के हस्तांतरण का अर्थ स्पष्ट करता है, जबकि ‘अदला-बदली’ सामान्य पाठक के लिए सहज है।
