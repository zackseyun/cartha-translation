lexical_decisions:
- source_word: וְעַל
  choice: के साथ-साथ
  rationale: यह पद पिछले भू-भाग के क्रम को आगे बढ़ाते हुए बिन्यामीन की सीमा से लगे अगले आवंटन का स्थान बताता है। हिन्दी में ‘सीमा के साथ-साथ’ इस स्थानिक संबंध को स्वाभाविक रूप से व्यक्त करता है; आरंभिक וְ को अलग से ‘और’ कहना आवश्यक नहीं है।
- source_word: גְּבוּל
  choice: सीमा
  rationale: भूमि-विभाजन के इस प्रसंग में यह शब्द किसी पूरे क्षेत्र के बजाय उसे निर्धारित करने वाली सीमा को दर्शाता है।
- source_word: בִּנְיָמִן
  choice: बिन्यामीन
  rationale: इस्राएल के गोत्र का पारंपरिक और प्रचलित हिन्दी नाम।
- source_word: מִפְּאַת קָדִימָה
  choice: पूर्वी छोर से
  rationale: यह पदबंध पूर्व दिशा के किनारे या छोर को दर्शाता है। ‘पूर्वी छोर से’ संक्षिप्त, स्वाभाविक और भौगोलिक रूप से स्पष्ट है।
- source_word: עַד פְּאַת יָמָּה
  choice: पश्चिमी छोर तक
  rationale: यह पूर्व से पश्चिम तक फैले भू-भाग की समानांतर संरचना को बनाए रखता है; यहाँ יָם संदर्भानुसार पश्चिम दिशा को सूचित करता है।
- source_word: שִׁמְעוֹן
  choice: शिमोन
  rationale: इस्राएल के गोत्र का पारंपरिक और प्रचलित हिन्दी नाम।
- source_word: אֶחָד
  choice: एक भाग
  rationale: मूल में केवल ‘एक’ है, पर यह अध्याय 48 में बार-बार आने वाले गोत्रीय भूमि-विभाजन के सूत्र का संक्षिप्त रूप है। अर्थ स्पष्ट करने के लिए ‘भाग’ जोड़ा गया है और इसकी सूचना पादटिप्पणी में दी गई है।
