  choice: पूर्वी छोर से पश्चिमी छोर तक
  rationale: פֵּאָה यहाँ भूभाग के छोर या किनारे को दर्शाता है; יָמָּה का भौगोलिक अर्थ पश्चिम दिशा है। यह अनुवाद पूरे पूर्व-पश्चिम विस्तार को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: אֶפְרַיִם
  choice: एप्रैम
  rationale: इस्राएली गोत्र के नाम का प्रचलित हिन्दी बाइबलीय रूप।
- source_word: אֶחָד
  choice: एक भाग
  rationale: इब्रानी में केवल ‘एक’ है, पर अध्याय के भू-आवंटन सूत्र से ‘एक भाग’ अभिप्रेत है। हिन्दी में आशय स्पष्ट करने के लिए ‘भाग’ जोड़ा गया है और शाब्दिक रूप पाद-टिप्पणी में दिया गया है।
