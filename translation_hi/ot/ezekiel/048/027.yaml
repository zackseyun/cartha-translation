    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/עַל גְּבוּל
  choice: और … की सीमा से लगा हुआ
  rationale: यह पदबंध क्रम में अगली गोत्रीय पट्टी का स्थान बताता है। ‘सीमा से लगा हुआ’ आधुनिक हिन्दी में इस भौगोलिक संबंध को स्वाभाविक और स्पष्ट रूप से व्यक्त करता है।
- source_word: זְבוּלֻן
  choice: जबूलून
  rationale: गोत्र के नाम का प्रचलित हिन्दी लिप्यंतरण।
- source_word: מִ/פְּאַת קָדִימָה
  choice: पूर्वी छोर से
  rationale: פֵּאָה सीमा के किनारे या छोर को और קָדִימָה पूर्व दिशा को सूचित करता है।
- source_word: עַד פְּאַת יָמָּה
  choice: पश्चिमी छोर तक
  rationale: यह पूर्व से पश्चिम तक भूभाग के विस्तार को बताता है; इस भौगोलिक प्रयोग में יָמָּה का अर्थ पश्चिम की ओर है।
- source_word: גָּד אֶחָד
  choice: गाद का एक भाग
  rationale: मूल इब्रानी में संक्षिप्त रूप से ‘गाद, एक’ है। पूरे अध्याय में भूमि के बँटवारे की दोहराई गई संरचना से ‘भाग’ निहित है, इसलिए उसे स्पष्टता के लिए जोड़ा गया है।
