base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/048/034.yaml
  text: 'On the west side[a], four thousand five hundred, with their three gates: the gate of Gad, one; the gate of Asher, one; the gate of Naphtali[b], one.'
translation:
  language: hi
  text: 'पश्चिम की ओर चार हज़ार पाँच सौ[a]; उसके तीन फाटक थे: गाद का एक फाटक, आशेर का एक फाटक, और नप्ताली का एक फाटक।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक क्रम है, “पाँच सौ और चार हज़ार।”
    reason: lexical_alternative
lexical_decisions:
- source_word: פְּאַת יָמָּה
  choice: पश्चिम की ओर
  rationale: פְּאַת किसी किनारे या दिशा की भुजा को और יָמָּה पश्चिम की दिशा को सूचित करता है; नगर की दिशाओं की सूची में यह स्वाभाविक आधुनिक हिन्दी है।
- source_word: חֲמֵשׁ מֵאוֹת וְאַרְבַּעַת אֲלָפִים
  choice: चार हज़ार पाँच सौ
  rationale: इब्रानी में संख्या का शाब्दिक क्रम ‘पाँच सौ और चार हज़ार’ है, जिसका मान 4,500 है; हिन्दी में बड़े अंक को पहले रखना स्वाभाविक है।
- source_word: שַׁעֲרֵיהֶם שְׁלֹשָׁה
  choice: उसके तीन फाटक थे
  rationale: यह क्रियारहित सूची-वाक्यांश है। एकवचन स्त्रीलिंग प्रत्यय नगर की इस पश्चिमी भुजा की ओर संकेत करता है; हिन्दी में अर्थ स्पष्ट करने के लिए ‘थे’ जोड़ा गया है।
- source_word: שַׁעַר גָּד אֶחָד
  choice: एक गाद का फाटक
  rationale: ‘फाटक + गोत्रनाम + एक’ की गणनात्मक संरचना को स्वाभाविक हिन्दी क्रम में रखा गया है।
- source_word: שַׁעַר אָשֵׁר אֶחָד
  choice: एक आशेर का फाटक
  rationale: पूर्ववर्ती फाटक के समान संरचना और सूची की संगति बनाए रखी गई है।
- source_word: שַׁעַר נַפְתָּלִי אֶחָד
  choice: एक नप्ताली का फाटक
  rationale: गोत्रनाम का प्रचलित हिन्दी लिप्यंतरण और समान गणनात्मक संरचना रखी गई है।
