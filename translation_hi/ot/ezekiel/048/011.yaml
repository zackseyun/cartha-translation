source:
  edition: WLC
  text: לַ/כֹּהֲנִ֤ים הַֽ/מְקֻדָּשׁ֙ מִ/בְּנֵ֣י צָד֔וֹק אֲשֶׁ֥ר שָׁמְר֖וּ מִשְׁמַרְתִּ֑/י אֲשֶׁ֣ר לֹֽא תָע֗וּ בִּ/תְעוֹת֙ בְּנֵ֣י יִשְׂרָאֵ֔ל כַּ/אֲשֶׁ֥ר תָּע֖וּ הַ/לְוִיִּֽם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/048/011.yaml
  text: It shall be for the priests who are consecrated from the sons of Zadok[a], who kept my charge, who did not go astray when the sons of Israel went astray[c][b], as the Levites went astray.
translation:
  language: hi
  text: यह भाग उन याजकों के लिए होगा जो सादोक के वंशजों में से पवित्र ठहराए गए हैं[a], जिन्होंने मेरा सौंपा हुआ दायित्व निभाया[b] और इस्राएलियों के भटक जाने पर[c] नहीं भटके, जैसे लेवी भटक गए थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “सादोक के पुत्रों में से।” यहाँ “पुत्र” का अर्थ वंशज है।
    reason: lexical_alternative
  - marker: b
    text: “मेरा सौंपा हुआ दायित्व” परमेश्वर द्वारा, विशेषकर याजकीय सेवा के लिए, सौंपी गई जिम्मेदारी को दर्शाता है।
    reason: cultural_note
  - marker: c
    text: या, “जब इस्राएल के लोग भटक गए।”
    reason: lexical_alternative
lexical_decisions:
- source_word: לַכֹּהֲנִים
  choice: उन याजकों के लिए होगा
  rationale: भूमि-विभाजन के व्यापक संदर्भ में ל गंतव्य अथवा आवंटन बताता है; हिन्दी में निहित विषय को ‘यह भाग’ के रूप में स्पष्ट करने से वाक्य स्वाभाविक रहता है।
- source_word: הַמְקֻדָּשׁ
  choice: पवित्र किए गए हैं
  rationale: קדשׁ का यह कर्मवाच्य कृदन्त याजकीय सेवा के लिए परमेश्वर द्वारा अलग और पवित्र किए जाने का भाव रखता है।
- source_word: מִבְּנֵי צָדוֹק
  choice: सादोक के वंशजों में से
  rationale: यहाँ ‘पुत्र’ वंशगत समूह का इब्रानी मुहावरा है; आधुनिक हिन्दी में ‘वंशजों में से’ उसका आशय स्वाभाविक और स्पष्ट रूप से देता है।
- source_word: שָׁמְרוּ מִשְׁמַרְתִּי
  choice: मेरी सौंपी हुई सेवा निष्ठा से निभाई
  rationale: यह पदबंध परमेश्वर द्वारा सौंपी गई याजकीय जिम्मेदारी को विश्वासयोग्यता से पूरा करने का संकेत देता है; केवल ‘आज्ञा मानी’ से इसका सेवागत पक्ष कम स्पष्ट होता।
- source_word: לֹא תָעוּ
  choice: नहीं भटके
  rationale: תעה यहाँ शारीरिक भटकाव नहीं बल्कि नैतिक और उपासना-संबंधी विचलन दर्शाता है।
- source_word: בִּתְעוֹת בְּנֵי יִשְׂרָאֵל
  choice: जब इस्राएल की संतान भटक गई
  rationale: ב के साथ infinitive construct परिस्थिति अथवा समय बताता है; ‘इस्राएल की संतान’ मूल के वंशगत पद को बनाए रखता है।
- source_word: כַּאֲשֶׁר תָּעוּ הַלְוִיִּם
  choice: वे लेवियों के समान नहीं भटके
  rationale: כַּאֲשֶׁר तुलना स्थापित करता है। हिन्दी में निषेध को तुलना के साथ रखने से स्पष्ट होता है कि सादोकवंशी याजकों का आचरण लेवियों के विपरीत था।
theological_decisions:
- issue: मन्दिर-दर्शन में याजकीय वंश और पवित्र स्थिति
  choice: पद आवंटन को सादोक के वंशजों में से पवित्र किए गए याजकों की निष्ठा और वंश—दोनों से जोड़ता है।
  alternative: इसे केवल निष्ठा के प्रतिफल पर बल देने के लिए अधिक भावानुवादी ढंग से कहा जा सकता था।
  rationale: इब्रानी पाठ सादोक से वंशगत संबंध और परमेश्वर की सौंपी सेवा निभाने की निष्ठा दोनों स्पष्ट करता है; अनुवाद किसी बाद की याजकत्व-संबंधी धर्मसैद्धान्तिक व्यवस्था को इसमें नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और उपासना-संदर्भ के अनुकूल रूप अपनाया गया है। ‘याजक’, ‘लेवी’ और ‘पवित्र किए गए’ जैसे परिचित बाइबलीय पद रखे गए हैं, जबकि इब्रानी वंशगत मुहावरों को मुख्य पाठ में स्वाभाविक हिन्दी और पादटिप्पणी में अधिक शाब्दिक रूप दिया गया है।
