  rationale: इब्रानी में संख्या का क्रम शाब्दिक रूप से ‘पचास और दो सौ’ है; ‘ढाई सौ’ मानक और सहज हिंदी है। माप की इकाई निकटवर्ती प्रसंग से समझी जाने वाली ‘हाथ’ है, यद्यपि इस पद में वह दोहराई नहीं गई।
