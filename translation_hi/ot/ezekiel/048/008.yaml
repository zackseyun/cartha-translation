base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/048/008.yaml
  text: 'Along the border of Judah[a], from the east side to the west side, shall be the contribution that you shall set apart: twenty-five thousand in width, and in length like one of the portions, from the east side to the west side[c][b]; and the sanctuary shall be in its midst.'
translation:
  language: hi
  text: यहूदा की सीमा के साथ-साथ, पूर्वी छोर से पश्चिमी छोर तक, वह अर्पित भूभाग[a] होगा जिसे तुम अलग करोगे। उसकी चौड़ाई पच्चीस हज़ार होगी और उसकी लंबाई किसी एक भाग[c] के समान, पूर्वी छोर से पश्चिमी छोर तक[b] होगी। पवित्रस्थान उसके बीच में होगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इसका अनुवाद “अर्पण” या “अलग किया हुआ क्षेत्र” भी हो सकता है। इब्रानी शब्द पवित्र उपयोग के लिए विशेष रूप से अलग किए गए भाग को दर्शाता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “पूर्वी किनारे से समुद्र की ओर वाले किनारे तक”; यहाँ “पश्चिमी छोर” उसी दिशासूचक भाव को व्यक्त करता है।
    reason: lexical_alternative
  - marker: c
    text: अर्थात लंबाई में वह गोत्रों को दिए गए भूभागों में से किसी एक के समान होगा।
    reason: cultural_note
lexical_decisions:
- source_word: גְּבוּל
  choice: सीमा
  rationale: भूमि-विभाजन के प्रसंग में यह किसी क्षेत्र की सीमा को दर्शाता है; ‘सीमा’ स्वाभाविक और सटीक हिन्दी है।
- source_word: מִפְּאַת קָדִים ... עַד פְּאַת יָמָּה
  choice: पूर्वी छोर से पश्चिमी छोर तक
  rationale: פֵּאָה यहाँ छोर या किनारे का बोध देता है, और दिशासूचक יָמָּה का अर्थ पश्चिम की ओर है; हिन्दी में भौगोलिक विस्तार स्पष्ट रखा गया है।
- source_word: הַתְּרוּמָה
  choice: अर्पित भूभाग
  rationale: शब्द का मूल अर्थ अर्पण या अलग रखी हुई भेंट है, परन्तु यह प्रसंग पवित्र उपयोग के लिए अलग किए गए भूभाग का है; इस चुनाव में मूल अर्पण-भाव और वास्तविक भू-संदर्भ दोनों बने रहते हैं।
- source_word: תָּרִימוּ
  choice: अलग करोगे
  rationale: रूप का आशय यहाँ भूमि को अर्पण के रूप में अलग निर्धारित करना है, न कि बलिदान चढ़ाना।
- source_word: חֲמִשָּׁה וְעֶשְׂרִים אֶלֶף
  choice: पच्चीस हज़ार
  rationale: मूल पाठ इस वाक्य में माप की इकाई नहीं दोहराता, इसलिए उसे बिना आधार जोड़े निहित रहने दिया गया है।
- source_word: רֹחַב
  choice: चौड़ाई
  rationale: भूमि के माप के वर्णन में यह सीधा और स्वाभाविक आयाम-सूचक शब्द है।
- source_word: אֹרֶךְ
  choice: लंबाई
  rationale: माप-वर्णन में मूल आयाम-सूचक संज्ञा को स्पष्ट हिन्दी में रखा गया है।
- source_word: כְּאַחַד הַחֲלָקִים
  choice: किसी एक भाग के समान
  rationale: חֵלֶק का अर्थ भाग, हिस्सा या आवंटित भूभाग हो सकता है। मुख्य पाठ में ‘गोत्रीय’ न जोड़कर मूल की संक्षिप्तता रखी गई है और प्रसंगगत अर्थ पादटिप्पणी में बताया गया है।
- source_word: הַמִּקְדָּשׁ
  choice: पवित्रस्थान
  rationale: यह पवित्र स्थल अथवा मंदिर के पवित्र परिसर को दर्शाता है; ‘पवित्रस्थान’ व्यापक और प्रचलित हिन्दी रूप है।
- source_word: בְּתוֹכוֹ
  choice: उसके बीच में
  rationale: यह अलग किए गए भूभाग के भीतर केंद्रीय स्थिति व्यक्त करता है और आधुनिक हिन्दी में सहज है।
