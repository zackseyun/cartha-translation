base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/048/013.yaml
  text: And alongside the territory of the priests[a], the Levites shall have twenty-five thousand cubits in length and ten thousand in width. The whole length shall be twenty-five thousand, and the width ten thousand.
translation:
  language: hi
  text: याजकों के क्षेत्र के साथ लगते हुए लेवियों का भाग पच्चीस हज़ार हाथ[a] लंबा और दस हज़ार हाथ चौड़ा होगा। उसकी कुल लंबाई पच्चीस हज़ार हाथ और चौड़ाई दस हज़ार हाथ होगी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में केवल ‘पच्चीस हज़ार’ और ‘दस हज़ार’ है; स्पष्टता के लिए यहेजकेल 48 के आसपास के संदर्भ के आधार पर माप की इकाई ‘हाथ’ जोड़ी गई है।
    reason: cross_reference
lexical_decisions:
- source_word: לְעֻמַּת
  choice: के साथ-साथ
  rationale: भूमि-विभाजन के इस संदर्भ में यह निकटता और समानांतर स्थिति दर्शाता है; आधुनिक हिन्दी में यह स्वाभाविक है और केवल आमने-सामने होने का अर्थ नहीं थोपता।
- source_word: גְּבוּל הַכֹּהֲנִים
  choice: याजकों के क्षेत्र
  rationale: यहाँ גְּבוּל केवल सीमा-रेखा नहीं, बल्कि सीमांकित भूभाग को सूचित करता है; इसलिए ‘क्षेत्र’ संदर्भानुकूल है।
- source_word: וְהַלְוִיִּם
  choice: लेवियों का भाग ... होगा
  rationale: इब्रानी वाक्य क्रियारहित और संदर्भ पर निर्भर है। भूमि के आवंटन को स्पष्ट करने के लिए हिन्दी में ‘भाग ... होगा’ जोड़ा गया है।
- source_word: חֲמִשָּׁה וְעֶשְׂרִים אֶלֶף
  choice: पच्चीस हज़ार हाथ
  rationale: मूल पद में केवल संख्या है; माप की इकाई आसपास के संदर्भ से स्पष्ट होती है। हिन्दी पाठक के लिए पारंपरिक और बोधगम्य इकाई ‘हाथ’ दी गई है तथा इसे पादटिप्पणी में बताया गया है।
- source_word: אֹרֶךְ
  choice: लंबा / कुल लंबाई
  rationale: पहले कथन में सहज विशेषणात्मक रूप और सारांश में संज्ञात्मक रूप मूल की आयामी पुनरुक्ति को स्वाभाविक हिन्दी में व्यक्त करते हैं।
- source_word: רֹחַב
  choice: चौड़ा / चौड़ाई
  rationale: यह चयन लंबाई के समानांतर आयाम को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: כָּל אֹרֶךְ
  choice: उसकी कुल लंबाई
  rationale: כָּל यहाँ पूरे भूभाग के आयाम का सारांश देता है; ‘कुल लंबाई’ इसी बल को स्पष्ट रखता है।
