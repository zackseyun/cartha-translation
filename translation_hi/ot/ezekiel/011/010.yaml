base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/011/010.yaml
  text: You will fall by the sword; I will judge you at the border of Israel[a], and you will know that I am Yahweh.
translation:
  language: hi
  text: तुम तलवार से गिरोगे; मैं इस्राएल की सीमा पर[a] तुम्हारा न्याय करूँगा, और तुम जान जाओगे कि मैं याहवे हूँ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “इस्राएल की सीमा-रेखा पर।” इब्रानी पदबंध का अर्थ इस्राएल की सीमा पर या सीमा-रेखा पर स्थित स्थान हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּחֶרֶב
  choice: तलवार से
  rationale: בְּ यहाँ साधन को व्यक्त करता है। ‘तलवार से’ इब्रानी की ठोस छवि और मृत्यु के साधन—दोनों को बनाए रखता है।
- source_word: תִּפֹּלוּ
  choice: तुम ... गिरोगे
  rationale: נפל का मूल अर्थ ‘गिरना’ है। न्याय के इस प्रसंग में इसका आशय तलवार से मारे जाने का है, पर ‘गिरोगे’ मूल रूपक को बिना विस्तार किए सुरक्षित रखता है।
- source_word: עַל גְּבוּל יִשְׂרָאֵל
  choice: इस्राएल की सीमा पर
  rationale: גְּבוּל का अर्थ सीमा, सरहद या भू-क्षेत्र हो सकता है; עַל के साथ यहाँ सीमा पर स्थित स्थान सबसे स्वाभाविक है। हिन्दी का ‘सीमा पर’ ‘at/on the border’ की स्थानीय अस्पष्टता को स्वाभाविक रूप से समेटता है।
- source_word: אֶשְׁפּוֹט אֶתְכֶם
  choice: मैं ... तुम्हारा न्याय करूँगा
  rationale: שׁפט का सीधा अर्थ न्याय करना है। दंडात्मक भाव प्रसंग और तलवार के उल्लेख से स्पष्ट है, इसलिए अतिरिक्त व्याख्या नहीं जोड़ी गई।
- source_word: וִידַעְתֶּם
  choice: और तुम जान जाओगे
  rationale: वाव-संयुक्त रूप यहाँ भावी परिणाम बताता है। ‘जान जाओगे’ आधुनिक हिन्दी में उस परिणामात्मक बोध को स्वाभाविक रूप से व्यक्त करता है, जबकि ‘और’ इब्रानी संयोजन को बनाए रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: चार-अक्षरीय दिव्य नाम को किसी उपाधि से बदलने के बजाय हिन्दी में उसके प्रचलित ध्वन्यात्मक रूप ‘याहवे’ से व्यक्त किया गया है।
theological_decisions:
- issue: दिव्य नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में व्यक्तिगत दिव्य नाम सीधे आया है। ‘याहवे’ उसका लिप्यंतरण है और उसे ‘प्रभु’ जैसी उपाधि से प्रतिस्थापित नहीं करता।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी रखी गई है। ‘तलवार से गिरोगे’ सामान्य बोलचाल से कुछ अधिक साहित्यिक है, पर मूल की ठोस छवि और न्याय-वाणी का गंभीर स्वर सुरक्षित रखता है।
