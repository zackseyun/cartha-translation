  yaml_path: translation/ot/ezekiel/011/015.yaml
  text: Son of man[a], your brothers, your brothers, the men of your redemption, and all the house of Israel, all of it—these are the ones to whom the inhabitants of Jerusalem have said, ‘Go far away from Yahweh[b]; this land has been given to us as a possession.’
translation:
  language: hi
  text: “हे मनुष्य के पुत्र, तेरे भाई—हाँ, तेरे भाई—तेरे छुड़ौती से जुड़े कुटुम्बी, और इस्राएल का सारा घराना, पूरा का पूरा—उन्हीं से यरूशलेम के निवासियों ने कहा है, ‘याहवे से दूर रहो! यह देश हमें विरासत के रूप में दिया गया है।’”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֶּן אָדָם
  choice: हे मनुष्य के पुत्र
  rationale: यहेजकेल के लिए प्रयुक्त नियमित संबोधन को उसके स्थापित भविष्यद्वक्तापरक रूप में रखा गया है।
- source_word: אַחֶיךָ אַחֶיךָ
  choice: तेरे भाई—हाँ, तेरे भाई
  rationale: इब्रानी की पुनरुक्ति को बलसूचक स्वाभाविक हिन्दी में सुरक्षित रखा गया है।
- source_word: אַנְשֵׁי גְאֻלָּתֶךָ
  choice: तेरे छुड़ाने के अधिकार वाले कुटुम्बी
  rationale: यह कठिन पदबंध निकट संबंधियों और उनके छुटकारे/पुनर्खरीद के अधिकार का संकेत देता है; यह चयन उस अर्थ-संबंध को बनाए रखते हुए हिन्दी में बोधगम्य है।
- source_word: וְכָל בֵּית יִשְׂרָאֵל כֻּלֹּה
  choice: और इस्राएल का समूचा घराना—वे सभी
  rationale: ‘इस्राएल का घराना’ वाचाई सामूहिक अभिव्यक्ति को रखता है और כֻּלֹּה के अतिरिक्त बल को ‘वे सभी’ से दर्शाता है।
- source_word: רַחֲקוּ מֵעַל יְהוָה
  choice: याहवे से दूर रहो
  rationale: बहुवचन आज्ञार्थक रूप और מֵעַל में निहित दूरी/वियोग को सीधी उद्धृत वाणी में रखा गया है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी व्यक्तिवाचक ईश्वरीय नाम को लिप्यंतरित किया गया है।
- source_word: לְמוֹרָשָׁה
  choice: निज भाग के रूप में
  rationale: यह भूमि पर स्थायी अधिकार अथवा विरासतगत स्वामित्व के दावे को स्वाभाविक हिन्दी में व्यक्त करता है; अन्य सम्भव अर्थ पादटिप्पणी में दिए गए हैं।
theological_decisions:
- issue: अनिश्चित पदबंध אַנְשֵׁי גְאֻלָּתֶךָ का अर्थ
  choice: तेरे छुड़ाने के अधिकार वाले कुटुम्बी
  alternative: तेरे साथी निर्वासित; तेरे निकट कुटुम्बी; तेरे छुटकारे से जुड़े लोग
  rationale: גְאֻלָּה की जड़ निकट संबंधी द्वारा छुटकारे या पुनर्खरीद के अधिकार से जुड़ी है। मुख्य पाठ इस संबंध को स्पष्ट करता है, पर पादटिप्पणी अन्य सम्भव व्याख्याएँ सुरक्षित रखती है।
- issue: רַחֲקוּ का वाक्यार्थ
  choice: याहवे से दूर रहो
  alternative: वे याहवे से दूर हैं
  rationale: रूप को बहुवचन आज्ञार्थक मानना प्रत्यक्ष कथन के अनुकूल है; इसे निर्वासितों के विषय में कथन मानने की सम्भावना कम स्वाभाविक है।
- issue: ईश्वरीय नाम יְהוָה
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में आए विशिष्ट वाचाई नाम को सामान्य उपाधि में बदलने के बजाय नाम के रूप में रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण भविष्यद्वक्तापरक शैली रखी गई है। परमेश्वर की सीधी वाणी में ‘तेरे’ और आज्ञा में ‘रहो’ का प्रयोग मूल के एकवचन संबोधन तथा उद्धृत बहुवचन आदेश को स्पष्ट करता है। कठिन छुड़ौती-संबंधी पदबंध को अत्यधिक शाब्दिक और अस्वाभाविक बनाने के बजाय अर्थपूर्ण ढंग से प्रस्तुत कर उसकी अनिश्चितता पादटिप्पणी में सुरक्षित रखी गई है।
