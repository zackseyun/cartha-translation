base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/011/006.yaml
  text: You have multiplied your slain in this city and filled its streets with the slain[a][b].
translation:
  language: hi
  text: तुमने इस नगर में बहुत-से लोगों को मार डाला है[a] और इसकी सड़कों[b] को मारे गए लोगों से भर दिया है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “तुमने इस नगर में अपने मारे हुओं की संख्या बढ़ा दी है।” यहाँ प्रयुक्त इब्रानी शब्द हिंसक रूप से मारे गए लोगों को दर्शाता है।
    reason: lexical_alternative
  - marker: b
    text: या “इसके चौकों” अथवा “इसके खुले स्थानों।”
    reason: lexical_alternative
lexical_decisions:
- source_word: הִרְבֵּיתֶם חַלְלֵיכֶם
  choice: तुमने बहुत-से लोगों को मार डाला है
  rationale: इब्रानी में क्रिया का अर्थ ‘बहुत करना/संख्या बढ़ाना’ है और חַלְלֵיכֶם हिंसक रूप से मारे गए लोगों को दर्शाता है। स्वाभाविक हिन्दी में यह वाक्यांश आरोप का भाव स्पष्ट रखता है कि इन लोगों की हत्या संबोधित व्यक्तियों के कारण हुई।
- source_word: בָּעִיר הַזֹּאת
  choice: इस नगर में
  rationale: स्थानवाचक संबंध और संकेतवाचक बल दोनों को सीधे तथा गरिमापूर्ण हिन्दी में सुरक्षित रखता है।
- source_word: וּמִלֵּאתֶם
  choice: और ... भर दिया है
  rationale: पिएल पूर्ण क्रिया के परिणामकारी भाव को वर्तमान पूर्ण काल की स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: חוּצֹתֶיהָ
  choice: इसकी सड़कों
  rationale: नगरीय संदर्भ में חוּצוֹת सार्वजनिक मार्गों, खुले स्थानों या चौकों को सूचित कर सकता है; मुख्य पाठ में ‘सड़कें’ सबसे सहज आधुनिक विकल्प है।
- source_word: חָלָל
  choice: मारे गए लोगों
  rationale: एकवचन रूप यहाँ सामूहिक अर्थ में प्रयुक्त है। यह चयन हिंसक मृत्यु का भाव और पहले आए समान इब्रानी शब्द के साथ शाब्दिक संबंध बनाए रखता है।
