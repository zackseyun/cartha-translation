base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/011/013.yaml
  text: And it happened[a], as I was prophesying, that Pelatiah son of Benaiah died. Then I fell on my face and cried out with a loud voice and said, “Ah, Lord GOD[b], will you make a complete end of the remnant of Israel?”
translation:
  language: hi
  text: जब मैं भविष्यवाणी कर रहा था, तब ऐसा हुआ कि बनायाह का पुत्र पलत्याह मर गया। तब मैं मुँह के बल गिर पड़ा और ऊँचे स्वर से पुकारकर कहा, “हाय, प्रभु यहोवा[b]! क्या आप इस्राएल के बचे हुए लोगों का पूरा अन्त कर देंगे[a]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “क्या आप इस्राएल के बचे हुए लोगों का पूरा अन्त कर रहे हैं?” हिब्रू में वर्तमान या आसन्न कार्य—दोनों का भाव हो सकता है।
    reason: alternative_reading
  - marker: b
    text: “प्रभु यहोवा” के लिए हिब्रू में אֲדֹנָי יְהוִה है, अर्थात् “प्रभु याहवे।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: तब ऐसा हुआ
  rationale: यह कथात्मक सूत्र एक नई घटना का परिचय देता है; यह अनुवाद आधुनिक हिन्दी में उसके प्रसंगगत कार्य को स्वाभाविक रूप से व्यक्त करता है।
- source_word: כְּהִנָּבְאִי
  choice: जब मैं भविष्यवाणी कर ही रहा था
  rationale: כְּ के साथ infinitive construct समकालिक चल रही क्रिया बताता है; ‘कर ही रहा था’ उसी दौरान अचानक हुई मृत्यु को उभारता है।
- source_word: וּפְלַטְיָהוּ בֶן־בְּנָיָה
  choice: बनायाह का पुत्र पलत्याह
  rationale: व्यक्तिनामों को हिन्दी ध्वन्यात्मक रूप में रखा गया है और हिब्रू संबंध-संरचना को स्वाभाविक हिन्दी में व्यक्त किया गया है।
- source_word: מֵת
  choice: मर गया
  rationale: מות का qal perfect यहाँ मृत्यु की घटित घटना की सीधी सूचना देता है।
- source_word: וָאֶפֹּל עַל־פָּנַי
  choice: मैं मुँह के बल गिर पड़ा
  rationale: यह आघात, शोक और विनती की शारीरिक मुद्रा को स्पष्ट रखते हुए हिब्रू मुहावरे का स्वाभाविक हिन्दी रूप है।
- source_word: וָאֶזְעַק קוֹל גָּדוֹל
  choice: ऊँचे स्वर से पुकारकर
  rationale: זעק संकट और व्याकुलता की प्रबल पुकार है; ‘ऊँचे स्वर से’ קול גדול की तीव्रता बनाए रखता है।
- source_word: אֲהָהּ
  choice: हाय
  rationale: यह शोक और भय की विस्मयादिबोधक पुकार है; ‘हाय’ आधुनिक हिन्दी में संक्षिप्त, गरिमापूर्ण और स्वाभाविक है।
- source_word: אֲדֹנָי יְהוִה
  choice: प्रभु यहोवा
  rationale: אֲדֹנָי को ‘प्रभु’ और चार-अक्षरीय दिव्य नाम को प्रचलित हिन्दी बाइबलीय रूप ‘यहोवा’ से व्यक्त किया गया है; इससे दोनों पदों का भेद बना रहता है।
- source_word: כָּלָה ... עֹשֶׂה
  choice: पूरी तरह अन्त कर देंगे
  rationale: यह पदबंध ‘पूर्ण अन्त करना’ व्यक्त करता है। हिन्दी भविष्यत् रूप आसन्न विनाश पर नबी की भयभीत विनती को स्वाभाविक ढंग से प्रकट करता है।
- source_word: שְׁאֵרִית יִשְׂרָאֵל
  choice: इस्राएल के बचे हुए लोग
  rationale: यह सामान्य पाठक के लिए שְׁאֵרִית का अर्थ स्पष्ट करता है और जीवित बचे समुदाय का सामूहिक भाव बनाए रखता है।
theological_decisions:
- issue: אֲדֹנָי יְהוִה में दिव्य नाम का अनुवाद
  choice: प्रभु यहोवा
  alternative: प्रभु याहवे
  rationale: मूल में उपाधि और व्यक्तिगत दिव्य नाम दोनों हैं। ‘प्रभु यहोवा’ हिन्दी बाइबलीय परंपरा में परिचित है और दोनों को अलग-अलग बनाए रखता है; वैकल्पिक निकटतर लिप्यंतरण फुटनोट में दिया गया है।
- issue: अन्तिम वाक्य का प्रश्नात्मक और कालगत बल
  choice: क्या आप ... अन्त कर देंगे?
  alternative: क्या आप ... अन्त कर रहे हैं?
  rationale: हिब्रू में स्पष्ट प्रश्नवाचक कण नहीं है, फिर भी विलापपूर्ण संबोधन और प्रसंग इसे भयभीत प्रश्न/विनती के रूप में पढ़ने का समर्थन करते हैं। participial עֹשֶׂה वर्तमान या आसन्न बल रख सकता है, इसलिए वैकल्पिक वर्तमान पाठ फुटनोट में सुरक्षित है।
- issue: שְׁאֵרִית का प्रस्तुतीकरण
  choice: बचे हुए लोग
  alternative: शेष जन
  rationale: ‘बचे हुए लोग’ आधुनिक पाठक के लिए स्पष्ट है, जबकि विनाश के बाद बचे समुदाय का धर्मवैचारिक आशय भी बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज कथात्मक शैली रखी गई है। ‘भविष्यवाणी कर ही रहा था’ घटना की आकस्मिकता उभारता है। ‘मुँह के बल’ और ‘ऊँचे स्वर से’ मूल की भावात्मक तीव्रता बनाए रखते हैं। सभी फुटनोट संकेत मुख्य पाठ में सम्मिलित हैं।
