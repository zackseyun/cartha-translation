id: EZK.11.12
reference: Ezekiel 11:12
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וִֽ/ידַעְתֶּם֙ כִּֽי אֲנִ֣י יְהוָ֔ה אֲשֶׁ֤ר בְּ/חֻקַּ/י֙ לֹ֣א הֲלַכְתֶּ֔ם וּ/מִשְׁפָּטַ֖/י לֹ֣א עֲשִׂיתֶ֑ם וּֽ/כְ/מִשְׁפְּטֵ֧י הַ/גּוֹיִ֛ם אֲשֶׁ֥ר סְבִיבוֹתֵי/כֶ֖ם עֲשִׂיתֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/011/012.yaml
  text: Then you will know that I am Yahweh[a], in whose statutes you have not walked, and whose judgments you have not carried out, but you have acted according to the judgments of the nations that are around you.
translation:
  language: hi
  text: तब तुम जानोगे कि मैं याहवे हूँ। तुम मेरी विधियों के अनुसार नहीं चले और तुमने मेरे न्याय-विधानों का पालन नहीं किया, बल्कि अपने चारों ओर की जातियों के न्याय-विधानों[a] के अनुसार आचरण किया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अपने चारों ओर की जातियों के रीति-रिवाजों के अनुसार आचरण किया।” यहाँ “न्याय-विधान” के लिए प्रयुक्त इब्रानी शब्द इस संदर्भ में उन जातियों की प्रथाओं या रीति-रिवाजों को भी सूचित कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וִידַעְתֶּם
  choice: तब तुम जानोगे
  rationale: संयोजक सहित पूर्ण क्रिया यहाँ पिछले और आसन्न दण्ड के परिणाम को व्यक्त करती है; ‘तब’ इस परिणामात्मक भाव को स्वाभाविक हिन्दी में स्पष्ट करता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के विशिष्ट वाचा-नाम को उपाधि से बदलने के बजाय हिन्दी लिप्यंतरण में रखा गया है।
- source_word: בְּחֻקַּי לֹא הֲלַכְתֶּם
  choice: तुम मेरी विधियों के अनुसार नहीं चले
  rationale: ‘चलना’ वाली इब्रानी वाचागत अभिव्यक्ति को बनाए रखते हुए ‘के अनुसार’ जोड़ने से आधुनिक हिन्दी में उसका जीवन-आचरण संबंधी अर्थ स्पष्ट होता है।
- source_word: חֻקַּי
  choice: मेरी विधियों
  rationale: ‘विधियाँ’ कानूनी-वाचागत חֻקִּים को दर्शाता है और अगले מִשְׁפָּטִים से कुछ भेद भी बनाए रखता है।
- source_word: וּמִשְׁפָּטַי לֹא עֲשִׂיתֶם
  choice: तुमने मेरे न्याय-विधानों का पालन नहीं किया
  rationale: עשה के शाब्दिक ‘नहीं किया’ को हिन्दी में स्वाभाविक ‘पालन नहीं किया’ से व्यक्त किया गया है; ‘न्याय-विधान’ दैवी कानूनी अपेक्षाओं का भाव रखता है।
- source_word: מִשְׁפָּטַי / כְמִשְׁפְּטֵי
  choice: न्याय-विधानों
  rationale: दोनों स्थानों पर एक ही इब्रानी मूल की पुनरावृत्ति को हिन्दी में भी बनाए रखा गया है; अंतिम प्रयोग में ‘रीति-रिवाज’ का संभावित अर्थ पाद-टिप्पणी में दिया गया है।
- source_word: וּכְמִשְׁפְּטֵי הַגּוֹיִם
  choice: बल्कि ... जातियों के न्याय-विधानों के अनुसार आचरण किया
  rationale: संदर्भ में וּ विरोधसूचक है। עשה + כ को स्वाभाविक हिन्दी में ‘के अनुसार आचरण किया’ कहा गया है।
- source_word: הַגּוֹיִם אֲשֶׁר סְבִיבוֹתֵיכֶם
  choice: अपने चारों ओर की जातियों
  rationale: यह पड़ोसी गैर-इस्राएली लोगों को सूचित करता है; संक्षिप्त हिन्दी रूप मूल संबंधवाचक वाक्यांश का पूरा आशय देता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में चतुरक्षरीय वाचा-नाम प्रत्यक्ष रूप से आया है। ‘याहवे’ उसे उपाधि में बदलने के बजाय नाम के रूप में सुरक्षित रखता है।
- issue: इस्राएल और आसपास की जातियों के आचरण के बीच विरोध
  choice: बल्कि
  alternative: और
  rationale: 'संयोजक का मूल रूप व्यापक है, पर प्रसंग स्पष्ट विरोध दिखाता है: उन्होंने याहवे की विधियों का पालन नहीं किया, पर आसपास की जातियों के मानकों के अनुसार आचरण किया।'
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘चलना’ जैसे महत्त्वपूर्ण वाचागत रूपक को सुरक्षित रखा गया है, जबकि ‘के अनुसार’ उसके अर्थ को स्पष्ट करता है। पाद-टिप्पणी का संकेत उसी अंतिम ‘न्याय-विधानों’ पर लगाया गया है जिससे वह संबंधित है।
