  yaml_path: translation/ot/ezekiel/011/018.yaml
  text: They will come there and remove from it all its detestable things and all its abominations[a].
translation:
  language: hi
  text: वे वहाँ आएँगे और वहाँ की सारी घिनौनी वस्तुएँ और सारी घृणित वस्तुएँ हटा देंगे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבָאוּ
  choice: वे वहाँ आएँगे
  rationale: भविष्यसूचक पुनर्स्थापना के संदर्भ में संयोजक सहित पूर्ण क्रिया भावी/परिणामसूचक अर्थ देती है; हिन्दी में ‘आएँगे’ स्वाभाविक है।
- source_word: שָׁמָּה
  choice: वहाँ
  rationale: यह दिशासूचक क्रियाविशेषण है; ‘आना’ के साथ आधुनिक हिन्दी में ‘वहाँ’ स्वाभाविक है और संदर्भित स्थान को अनावश्यक रूप से नहीं बाँधता।
- source_word: וְהֵסִירוּ
  choice: दूर कर देंगे
  rationale: हिफ़ील रूप यहाँ हटाने या निकाल देने का अर्थ देता है; यह प्रयोग कारणवाचक और पूर्ण निष्कासन का भाव सहज हिन्दी में व्यक्त करता है।
- source_word: אֶת כָּל שִׁקּוּצֶיהָ
  choice: उसकी सब घिनौनी वस्तुएँ
  rationale: שִׁקּוּץ किसी घिनौनी वस्तु को दर्शाता है और प्रायः मूर्ति अथवा मूर्तिपूजक वस्तु के लिए आता है। मुख्य पाठ में व्यापक अर्थ रखा गया है।
- source_word: וְאֶת כָּל תּוֹעֲבוֹתֶיהָ
  choice: और उसके सब घृणित काम
  rationale: תּוֹעֵבָה वाचा-संबंधी संदर्भ में ऐसी बात या आचरण के लिए प्रबल शब्द है जिससे घृणा की जाती है। ‘घृणित काम’ पहले पद की वस्तुओं से भेद रखते हुए स्वाभाविक हिन्दी देता है, यद्यपि मूल शब्द स्वयं वस्तु और आचरण दोनों को समेट सकता है।
- source_word: מִמֶּנָּה
  choice: उसमें से
  rationale: स्त्रीलिंग एकवचन प्रत्यय संदर्भित भूमि/नगरी/स्थान की ओर लौटता है; ‘उसमें से ... दूर कर देंगे’ हिन्दी में स्पष्ट और स्वाभाविक है।
theological_decisions:
- issue: שִׁקּוּצֶיהָ को स्पष्ट रूप से मूर्तियाँ कहना या व्यापक अर्थ बनाए रखना
  choice: मुख्य पाठ में ‘घिनौनी वस्तुएँ’
  alternative: ‘मूर्तियाँ’ अथवा ‘घिनौनी मूर्तियाँ’
  rationale: निकट संदर्भ मूर्तिपूजा से शुद्ध किए जाने की ओर संकेत करता है, पर इब्रानी शब्द केवल तकनीकी रूप से ‘मूर्ति’ तक सीमित नहीं है। इसलिए व्यापक अर्थ मुख्य पाठ में और मूर्तिपूजक आशय पादटिप्पणी में रखा गया है।
- issue: תּוֹעֲבוֹתֶיהָ को वस्तुओं या आचरण के रूप में व्यक्त करना
  choice: ‘घृणित काम’
  alternative: ‘घृणित वस्तुएँ’ अथवा ‘घृणित बातें’
  rationale: इब्रानी बहुवचन घृणित वस्तुओं, प्रथाओं या कर्मों को सूचित कर सकता है। यहाँ ‘काम’ मूर्तिपूजक और नैतिक आचरण की संभावित व्यापकता व्यक्त करता है, जबकि पहले पद की ‘वस्तुएँ’ से अनावश्यक पुनरुक्ति बचाता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रूप। ‘घिनौनी’ और ‘घृणित’ मूल के दो निकट, पर अलग प्रबल शब्दों के भेद को यथासंभव बनाए रखते हैं।
