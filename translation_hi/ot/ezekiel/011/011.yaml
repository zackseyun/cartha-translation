review_pass:
  verdict: revise
  source_fidelity: The draft correctly preserves the feminine pronoun's reference to the city, the cooking-pot/meat metaphor, and the future judicial declaration at Israel's border. However, 'नहीं बनेगी' and especially 'माँस नहीं बनोगे' introduce an unnecessary sense of becoming; the Hebrew predicates state what the city and people will not be in the metaphor.
  naturalness: The revision uses idiomatic modern Hindi while retaining the terse prophetic metaphor. 'मांस की तरह नहीं होगे' makes the comparative force explicit and avoids the awkward implication that the hearers would otherwise turn into meat.
  terminology: '''हाँड़ी'' suitably renders the cooking vessel, ''मांस'' communicates בָּשָׂר in this culinary image, and ''न्याय करूँगा'' accurately renders the judicial force of אֶשְׁפֹּט.'
  issues:
  - severity: medium
    issue: The verbs 'बनेगी' and 'बनोगे' add a becoming sense.
    rationale: The Hebrew uses forms of 'be' (will not be), not 'become.' In particular, people being 'meat' is a metaphorical predicate, not a transformation.
  - severity: medium
    issue: The comparison implicit in לְבָשָׂר is not expressed naturally in Hindi.
    rationale: '''तुम ... माँस नहीं बनोगे'' is both semantically over-specific and awkward. ''मांस की तरह नहीं होगे'' preserves the pot/meat comparison clearly.'
  revised_text: वह तुम्हारे लिए हाँड़ी नहीं होगी, और तुम उसके भीतर मांस की तरह नहीं होगे; इस्राएल की सीमा पर मैं तुम्हारा न्याय करूँगा।
  revised_footnotes: []
  revision_rationale: The wording changes only the Hindi copular expression and explicitly marks the metaphorical comparison. It retains the source's ambiguity in the feminine pronoun and the established rendering 'इस्राएल की सीमा पर.'
