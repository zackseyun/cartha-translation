id: EZK.11.11
reference: Ezekiel 11:11
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: הִ֗יא לֹֽא תִהְיֶ֤ה לָ/כֶם֙ לְ/סִ֔יר וְ/אַתֶּ֛ם תִּהְי֥וּ בְ/תוֹכָ֖/הּ לְ/בָשָׂ֑ר אֶל גְּב֥וּל יִשְׂרָאֵ֖ל אֶשְׁפֹּ֥ט אֶתְ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/011/011.yaml
  text: It will not be for you as a pot[a], and you will not be within it as meat; at the border of Israel I will judge you.
translation:
  language: hi
  text: वह तुम्हारे लिए हाँड़ी नहीं होगी, और तुम उसके भीतर मांस की तरह नहीं होगे; इस्राएल की सीमा पर मैं तुम्हारा न्याय करूँगा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִיא
  choice: वह
  rationale: स्त्रीलिंग सर्वनाम का संकेत पिछले प्रसंग की नगरी यरूशलेम की ओर है; हिन्दी में ‘वह’ इस संदर्भ को स्वाभाविक रूप से बनाए रखता है।
- source_word: לְסִיר
  choice: हाँड़ी
  rationale: סִיר भोजन पकाने का पात्र है। ‘हाँड़ी’ साधारण पाठक के लिए स्वाभाविक है और आस-पास के प्रसंग की पकाने वाली हाँड़ी की उपमा को सुरक्षित रखता है।
- source_word: בְתוֹכָהּ
  choice: उसके भीतर
  rationale: यह पदबंध नगरी रूपी हाँड़ी के अंदर होने की स्थान-संबंधी छवि को स्पष्ट और संक्षिप्त रूप से बनाए रखता है।
- source_word: לְבָשָׂר
  choice: माँस
  rationale: בָּשָׂר का मूल अर्थ ‘माँस’ है और यहाँ हाँड़ी में रखे माँस की उपमा है; हिन्दी में यही शब्द मूल अर्थ और पाक-छवि दोनों व्यक्त करता है।
- source_word: אֶל גְּבוּל יִשְׂרָאֵל
  choice: इस्राएल की सीमा पर
  rationale: אֶל यहाँ सीमा की ओर गति अथवा सीमा पर पहुँचने का भाव दे सकता है। न्याय के प्रसंग में ‘सीमा पर’ सबसे स्वाभाविक है, जबकि मूल की संभावित दिशात्मक छाया पूर्णतः नकारता नहीं।
- source_word: אֶשְׁפֹּט אֶתְכֶם
  choice: मैं तुम्हारा न्याय करूँगा
  rationale: שׁפט इस न्याय-दंड की भविष्यवाणी में स्पष्ट रूप से न्याय करने के अर्थ में प्रयुक्त है।
theological_decisions:
- issue: यरूशलेम को सुरक्षा देने वाली हाँड़ी मानने वाली कहावत का उलटना
  choice: हाँड़ी और माँस की उपमा को बिना व्याख्यात्मक विस्तार के बनाए रखना
  alternative: अर्थ खोलकर कहना कि यरूशलेम उनकी रक्षा नहीं करेगी
  rationale: मूल वचन अगुओं की पहले कही उपमा को उन्हीं के विरुद्ध पलटता है। प्रत्यक्ष रूपक को बनाए रखने से भविष्यवाणी की अलंकारिक शक्ति और उसका धर्मवैचारिक तनाव सुरक्षित रहता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और भविष्यवाणी-संगत स्वर। ‘हाँड़ी’ और ‘माँस’ सामान्य पाठक के लिए ठोस रूपक को सहज रखते हैं; किसी सांप्रदायिक व्याख्या को नहीं जोड़ा गया है।
