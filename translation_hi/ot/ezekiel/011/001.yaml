base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/011/001.yaml
  text: Then the Spirit lifted me up and brought me to the east gate of the house of Yahweh[a], which faces eastward. And behold, at the entrance of the gate were twenty-five men, and I saw among them Jaazaniah son of Azzur and Pelatiah son of Benaiah[c][b], leaders of the people.
translation:
  language: hi
  text: तब आत्मा[a] ने मुझे उठाया और यहोवा के भवन के उस पूर्वी फाटक पर ले आया, जिसका मुख पूर्व की ओर था। और देखो, फाटक के प्रवेश पर पच्चीस पुरुष थे। मैंने उनके बीच अज्जूर के पुत्र याजन्याह और बनायाह के पुत्र पलत्याह को देखा; वे लोगों के अगुवे[b] थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “एक आत्मा”; इब्रानी शब्द का अर्थ “वायु” भी हो सकता है, पर यहेजकेल के दर्शन के संदर्भ में यहाँ परमेश्वर की आत्मा का संकेत सबसे अधिक सम्भावित है।
    reason: lexical_alternative
  - marker: b
    text: या, “लोगों के प्रधान” अथवा “लोगों के अधिकारी।”
    reason: lexical_alternative
lexical_decisions:
- source_word: רוּחַ
  choice: आत्मा
  rationale: यहेजकेल के दर्शन-संदर्भ में यह उस विशिष्ट आत्मा को सूचित करता है जो नबी को उठाकर ले जाता है; फिर भी हिब्रू शब्द की संभावित अनिश्चितता को पादटिप्पणी में रखा गया है।
- source_word: וַתִּשָּׂא אֹתִי
  choice: ने मुझे उठाया
  rationale: यह नबी के दर्शनीय रूप से ऊपर उठाए और स्थानांतरित किए जाने की सजीव गति को बनाए रखता है।
- source_word: וַתָּבֵא אֹתִי
  choice: ले आया
  rationale: हिफ़िल क्रिया का मूल अर्थ ‘लाना’ है; हिंदी में गंतव्य के साथ ‘ले आया’ स्वाभाविक है।
- source_word: שַׁעַר בֵּית יְהוָה
  choice: यहोवा के भवन का ... फाटक
  rationale: ‘भवन’ मूल के ‘घर/भवन’ को पारदर्शी ढंग से रखता है; संदर्भ में यह मंदिर है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिब्रू व्यक्तिगत ईश्वरीय नाम को सामान्य हिंदी बाइबलीय रूप में प्रस्तुत किया गया है।
- source_word: הַקַּדְמוֹנִי הַפּוֹנֶה קָדִימָה
  choice: उस पूर्वी फाटक ... जिसका मुख पूर्व की ओर था
  rationale: पूर्व दिशा के दोहरे वर्णन और स्थानिक स्पष्टता को मूल के अनुरूप बनाए रखा गया है।
- source_word: וְהִנֵּה
  choice: और देखो
  rationale: यह दर्शनीय दृश्य की आकस्मिकता और नबी की ध्यानाकर्षक शैली को आधुनिक, गरिमामय हिंदी में व्यक्त करता है।
- source_word: בְּפֶתַח הַשַּׁעַר
  choice: फाटक के प्रवेश पर
  rationale: स्थान को स्पष्ट और स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: עֶשְׂרִים וַחֲמִשָּׁה אִישׁ
  choice: पच्चीस पुरुष
  rationale: इब्रानी איש यहाँ पुरुषों के समूह को सूचित करता है; ‘पुरुष’ स्रोत के लिंग-सूचक अर्थ को सुरक्षित रखता है।
- source_word: שָׂרֵי הָעָם
  choice: लोगों के अगुवे
  rationale: यह शासकीय या सार्वजनिक नेतृत्व का व्यापक अर्थ सहज हिंदी में देता है, बिना वंशानुगत राजकुमार होने का अनावश्यक संकेत दिए।
theological_decisions:
- issue: यहेजकेल के दर्शन में רוּחַ की पहचान
  choice: ‘आत्मा’ को संदर्भगत रूप से विशिष्ट, सम्भवतः परमेश्वर के आत्मा के रूप में प्रस्तुत करना
  alternative: ‘एक आत्मा’ या ‘वायु’
  rationale: दर्शन के निकटवर्ती साहित्यिक संदर्भ में רוּחַ नबी को उठाने और ले जाने वाला अभिकर्ता है, इसलिए ‘आत्मा’ सबसे स्वाभाविक है; पर मूल में निश्चित उपपद न होने और शब्द के व्यापक अर्थ को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिंदी, गरिमामय भविष्यद्वक्तात्मक शैली। ‘और देखो’ से मूल का ध्यानाकर्षक चिह्न रखा गया है। वाक्य-विन्यास को पठनीय बनाने के लिए अंतिम उपवाक्य अलग किया गया है, जबकि नामों और पद की पारस्परिकता सुरक्षित है।
