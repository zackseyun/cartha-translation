  yaml_path: translation/ot/ezekiel/011/020.yaml
  text: so that they may walk in my statutes and keep my judgments and do them[a], and they will be my people, and I will be their God.
translation:
  language: hi
  text: ताकि वे मेरी विधियों के अनुसार चलें, मेरे न्याय-विधानों[a] को मानें और उनका पालन करें; और वे मेरी प्रजा होंगे, और मैं उनका परमेश्वर होऊँगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘मेरे नियमों।’ इब्रानी מִשְׁפָּטִים वाचा के संदर्भ में न्यायिक निर्णयों या निर्धारित नियमों को सूचित कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: לְמַעַן
  choice: ताकि
  rationale: यह उद्देश्य या अपेक्षित परिणाम व्यक्त करता है; ‘ताकि’ आधुनिक हिन्दी में संक्षिप्त और स्वाभाविक है।
- source_word: בְּחֻקֹּתַי יֵלֵכוּ
  choice: मेरी विधियों पर चलें
  rationale: यह हिन्दी में समझ में आने योग्य रहते हुए ‘चलने’ के इब्रानी रूपक और जीवन-आचरण के वाचा-संबंधी भाव को बनाए रखता है।
- source_word: מִשְׁפָּטַי
  choice: मेरे न्याय-विधानों
  rationale: ‘न्याय-विधान’ कानूनी निर्णयों और निर्धारित वाचा-विधियों—दोनों संभावित अर्थों को साधारण ‘नियम’ की अपेक्षा अधिक स्पष्ट रूप से बनाए रखता है।
- source_word: יִשְׁמְרוּ
  choice: मानें
  rationale: आज्ञाओं या विधानों के साथ שׁמר का अर्थ उन्हें ध्यानपूर्वक मानना या उनका पालन करना है; यहाँ अगले क्रियापद से हिन्दी में कुछ भेद बनाए रखने के लिए ‘मानें’ चुना गया है।
- source_word: וְעָשׂוּ אֹתָם
  choice: और उनका पालन करें
  rationale: यह केवल विधानों को स्वीकार करने के बजाय उन्हें व्यवहार में पूरा करने पर दिए गए स्पष्ट इब्रानी बल को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וְהָיוּ לִי לְעָם
  choice: तब वे मेरी प्रजा होंगे
  rationale: यह मानक पारस्परिक वाचा-सूत्र को सुरक्षित रखता है; ‘तब’ उद्देश्य के फल की ओर स्वाभाविक संक्रमण देता है।
- source_word: וַאֲנִי אֶהְיֶה לָהֶם לֵאלֹהִים
  choice: और मैं उनका परमेश्वर होऊँगा
  rationale: यह पारंपरिक वाचा-सूत्र का सीधा और आधुनिक हिन्दी रूप है; यहाँ אֱלֹהִים एकवचन वाचा-संबंधी अर्थ में है।
theological_decisions:
- issue: पारस्परिक वाचा-सूत्र
  choice: ‘वे मेरी प्रजा होंगे और मैं उनका परमेश्वर होऊँगा’
  alternative: ‘वे मेरे लोग होंगे और मैं उनका ईश्वर होऊँगा’
  rationale: ‘प्रजा’ और ‘परमेश्वर’ हिन्दी बाइबलीय भाषा में प्रतिष्ठित और सुबोध हैं तथा पाठ में कोई अतिरिक्त धर्मवैज्ञानिक व्याख्या नहीं जोड़ते।
- issue: उद्देश्य और परिणाम का संबंध
  choice: पहले वाक्य में ‘ताकि’ और दूसरे में ‘तब’
  alternative: सभी खंडों को ‘और’ से जोड़ना
  rationale: इब्रानी לְמַעַן उद्देश्य प्रस्तुत करता है। वाचा-सूत्र को ‘तब’ से जोड़ना उसका परिणामात्मक संबंध स्पष्ट करता है, बिना यह तय किए कि क्रियाएँ केवल संभावना हैं या निश्चित भविष्यवाणी।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सुबोध रखी गई है। ‘चलें’ का मूल रूपक सुरक्षित है, जबकि ‘मानें और उनका पालन करें’ इब्रानी की दोहरी आज्ञापालन-अभिव्यक्ति को स्वाभाविक हिन्दी में दर्शाता है।
