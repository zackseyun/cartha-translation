source:
  edition: WLC
  text: וַ/יַּ֨עַל֙ כְּב֣וֹד יְהוָ֔ה מֵ/עַ֖ל תּ֣וֹךְ הָ/עִ֑יר וַֽ/יַּעֲמֹד֙ עַל הָ/הָ֔ר אֲשֶׁ֖ר מִ/קֶּ֥דֶם לָ/עִֽיר־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/011/023.yaml
  text: And the glory of Yahweh went up from the midst of the city and stood on the mountain that is east of the city[a][b].
translation:
  language: hi
  text: तब याहवे की महिमा नगर के बीच के ऊपर से ऊपर उठी[a] और उस पहाड़ पर जा खड़ी हुई, जो नगर के पूर्व में है[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “ऊपर चढ़ी।”
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में “जो नगर के पूर्व/सामने है।” מִקֶּדֶם दिशा के रूप में “पूर्व” और स्थानगत अभिमुखता के अनुसार “सामने” भी व्यक्त कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַל
  choice: ऊपर उठी
  rationale: עלה ऊपर की ओर जाने या चढ़ने को व्यक्त करता है। दर्शन में महिमा की गति के लिए ‘ऊपर उठी’ स्वाभाविक है और मूल की ठोस दिशात्मकता बनाए रखता है।
- source_word: כְּבוֹד יְהוָה
  choice: याहवे की महिमा
  rationale: यह रचना-संबंध को स्पष्ट रखता है और כבוד को परमेश्वर की प्रकट महिमा के अर्थ में गरिमापूर्ण ढंग से व्यक्त करता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुराक्षरीय व्यक्तिगत नाम को उपाधि से बदलने के बजाय आधुनिक हिन्दी में निकट लिप्यंतरण द्वारा प्रस्तुत किया गया है।
- source_word: מֵעַל תּוֹךְ הָעִיר
  choice: नगर के बीच से
  rationale: वाक्यांश नगर के मध्य भाग के ऊपर से प्रस्थान का संकेत दे सकता है; हिन्दी में ‘नगर के बीच से’ सुबोध है और स्थानगत चित्र को अनावश्यक रूप से कठोर नहीं बनाता।
- source_word: וַיַּעֲמֹד
  choice: जा ठहरी
  rationale: עמד का मूल अर्थ खड़ा होना या ठहरना है। निर्जीव व्याकरणिक संज्ञा ‘महिमा’ और गतिशील प्रसंग में ‘जा ठहरी’ स्वाभाविक हिन्दी है तथा गति के बाद रुकने का भाव सुरक्षित रखता है।
- source_word: עַל הָהָר
  choice: उस पहाड़ पर
  rationale: הַר के सामान्य अर्थ ‘पहाड़’ को रखा गया है; संकेतवाचक ‘उस’ इब्रानी के निश्चित पद को सहज हिन्दी में व्यक्त करता है।
- source_word: אֲשֶׁר מִקֶּדֶם לָעִיר
  choice: जो नगर के पूर्व में है
  rationale: भौगोलिक संदर्भ में קֶדֶם का सर्वाधिक संभावित अर्थ ‘पूर्व’ है, जबकि ‘सामने’ की वास्तविक शाब्दिक संभावना पादटिप्पणी में सुरक्षित रखी गई है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ व्यक्तिगत वाचा-नाम का प्रयोग करता है। ‘याहवे’ उसे किसी उपाधि से प्रतिस्थापित किए बिना निकट लिप्यंतरण में सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और कथात्मक शैली अपनाई गई है। ‘नगर’ और ‘महिमा’ जैसे परिचित बाइबलीय शब्द रखे गए हैं; वाक्यक्रम हिन्दी की स्वाभाविक गति के अनुसार है।
