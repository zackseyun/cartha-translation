- source_word: דְבַר
  choice: वचन
  rationale: דְבַר יְהוָה भविष्यद्वाणी के प्रकाशन का स्थापित सूत्र है। ‘वचन’ इसके औपचारिक और धार्मिक स्वर को ‘संदेश’ की अपेक्षा अधिक निकटता से बनाए रखता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: चतुर्वर्णीय ईश्वरीय नाम יהוה को हिन्दी में प्रचलित नामरूप ‘यहोवा’ से व्यक्त किया गया है; इसे केवल ‘प्रभु’ जैसे पदनाम से नहीं बदला गया।
- source_word: אֵלַי
  choice: मेरे पास
  rationale: पूर्वसर्ग אֶל और प्रथम पुरुष एकवचन प्रत्यय दिशा को सूचित करते हैं। हिन्दी के भविष्यद्वाणी-सूत्र में ‘मेरे पास आया’ स्वाभाविक और अर्थानुकूल है।
- source_word: לֵאמֹר
  choice: इसके बाद आने वाले प्रत्यक्ष कथन को द्विबिंदु से प्रस्तुत किया गया
  rationale: לֵאמֹר अगले प्रत्यक्ष कथन का परिचय देता है। आधुनिक हिन्दी में ‘यह कहते हुए’ की अपेक्षा द्विबिंदु अधिक स्वाभाविक है और वही संवादात्मक कार्य करता है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: मूल पाठ में व्यक्तिगत ईश्वरीय नाम है। हिन्दी पाठकों के लिए व्यापक रूप से पहचाना जाने वाला ‘यहोवा’ नाम को पदनाम में बदलने से बचाता है; पादटिप्पणी मूल इब्रानी रूप स्पष्ट करती है।
translation_notes:
