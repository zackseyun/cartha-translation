base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/011/003.yaml
  text: who say[a], ‘It is not near to build houses. This city is the pot[b], and we are the meat.’
translation:
  language: hi
  text: जो कहते हैं, “घर बनाने का समय निकट नहीं है[a]। यह नगर हाँडी[b] है, और हम मांस हैं।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी वाक्यांश संक्षिप्त है। इसका अनुवाद “अभी घर बनाने का समय नहीं है” या “घर बनाना जल्द नहीं होगा” भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी शब्द का अर्थ पकाने का पात्र है; “हाँडी” इस रूपक का स्वाभाविक हिन्दी रूप है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאֹמְרִים
  choice: जो कहते हैं
  rationale: संज्ञा के रूप में प्रयुक्त निश्चित कृदंत पिछले संदर्भ में आए पुरुषों की ओर संकेत करता है; हिन्दी में संबंधवाचक उपवाक्य स्वाभाविक है।
- source_word: לֹא בְקָרוֹב
  choice: समय निकट नहीं है
  rationale: इब्रानी वाक्यांश संक्षिप्त और अध्याहारयुक्त है। हिन्दी में अर्थ स्पष्ट करने के लिए ‘समय’ जोड़ा गया है, जबकि पादटिप्पणी मूल की संक्षिप्तता और वैकल्पिक अर्थ को सुरक्षित रखती है।
- source_word: בְּנוֹת בָּתִּים
  choice: घर बनाने
  rationale: यह क्रियार्थक संज्ञा और उसके कर्म का सीधा तथा स्वाभाविक हिन्दी रूप है; मूल में ‘अपने लिए’ जैसा कोई आत्मवाचक भाव स्पष्ट नहीं है।
- source_word: הִיא הַסִּיר
  choice: यह नगर हाँडी है
  rationale: स्त्रीलिंग सर्वनाम संदर्भ में यरूशलेम नगर की ओर संकेत करता है। ‘यह नगर’ संदर्भ स्पष्ट करता है और ‘हाँडी’ पकाने के रूपक को सामान्य हिन्दी में बनाए रखता है।
- source_word: וַאֲנַחְנוּ הַבָּשָׂר
  choice: और हम मांस हैं
  rationale: בָּשָׂר का मूल अर्थ ‘मांस/देह’ है; हाँडी के रूपक में ‘मांस’ सबसे स्वाभाविक और चित्रात्मक हिन्दी है।
theological_decisions:
- issue: हाँडी और मांस वाली कहावत का आशय
  choice: रूपक को बिना व्याख्यात्मक निष्कर्ष के ज्यों का त्यों रखा गया है।
  alternative: इसे या तो नगर की सुरक्षा पर घमंड, या आने वाले न्याय की तात्कालिकता को नकारने वाली व्यंग्यपूर्ण उक्ति के रूप में स्पष्ट किया जा सकता था।
  rationale: वचन स्वयं कहावत का आशय पूरी तरह नहीं खोलता; मुख्य पाठ में किसी एक व्याख्या को आरोपित करने के बजाय उसकी वास्तविक तनावपूर्ण अस्पष्टता सुरक्षित रखी गई है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की, सहज किंतु गरिमापूर्ण है। ‘हाँडी’ और ‘मांस’ सामान्य पाठक के लिए पकाने के रूपक को तुरंत स्पष्ट करते हैं; मूल की अध्याहारयुक्त अभिव्यक्ति को पादटिप्पणी में दर्शाया गया है।
