base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/011/024.yaml
  text: Then the Spirit lifted me up and brought me to the exiles in Chaldea[a], in the vision by the Spirit of God[d][c][b]; and the vision that I had seen went up from me.
translation:
  language: hi
  text: तब आत्मा ने मुझे उठाया[a] और दर्शन में परमेश्वर की आत्मा के द्वारा[c] मुझे कसदियों के देश में निर्वासित लोगों[b] के पास पहुँचा दिया। और वह दर्शन, जो मैंने देखा था, मेरे ऊपर से उठ गया[d]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘मुझे उठा ले गया।’ इब्रानी क्रिया में उठाने और ले जाने दोनों का भाव हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से ‘निर्वासन के पास’; यह पद सामूहिक अर्थ में निर्वासित समुदाय को सूचित कर सकता है।
    reason: lexical_alternative
  - marker: c
    text: या ‘परमेश्वर की आत्मा में।’ इब्रानी पूर्वसर्ग साधन (‘के द्वारा’) या क्षेत्र (‘में’) दोनों व्यक्त कर सकता है।
    reason: alternative_reading
  - marker: d
    text: या ‘मुझसे दूर हो गया।’ इब्रानी में शाब्दिक भाव है ‘मेरे ऊपर से ऊपर चला गया।’
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרוּחַ
  choice: तब आत्मा
  rationale: रूआख का अर्थ आत्मा, वायु या श्वास हो सकता है। यहाँ दर्शनीय स्थानांतरण और आगे आए ‘परमेश्वर के आत्मा’ के कारण ‘आत्मा’ संदर्भ के लिए सबसे उपयुक्त है; वाव को कथानक की प्रगति दिखाने के लिए ‘तब’ कहा गया है।
- source_word: נְשָׂאַתְנִי
  choice: मुझे उठाया
  rationale: नसा में उठाने और ले जाने दोनों का भाव हो सकता है। ‘उठाया’ मूल की ठोस ऊर्ध्वगामी छवि को बनाए रखता है।
- source_word: וַתְּבִיאֵנִי
  choice: मुझे … पहुँचा दिया
  rationale: हिफ़ील रूप का अर्थ ‘आने का कारण बनाना/ले आना’ है। हिंदी में गंतव्य के साथ ‘पहुँचा दिया’ स्वाभाविक और स्पष्ट है।
- source_word: כַשְׂדִּימָה
  choice: कसदियों के देश में
  rationale: दिशासूचक रूप कसदियों के भूभाग की ओर गति बताता है। यह जातिसूचक ‘कसदियों के पास’ की अपेक्षा भौगोलिक अर्थ को स्पष्ट करता है।
- source_word: אֶל הַגּוֹלָה
  choice: निर्वासित लोगों के पास
  rationale: निर्दिष्ट एकवचन संज्ञा निर्वासन की अवस्था अथवा सामूहिक रूप से निर्वासित समुदाय को सूचित कर सकती है। प्रसंग में लोगों का समुदाय अभिप्रेत है।
- source_word: בַּמַּרְאֶה
  choice: दर्शन में
  rationale: मारेह का अर्थ रूप-दिखाई या दर्शन हो सकता है; यहेजकेल के भविष्यदर्शी प्रसंग में ‘दर्शन’ उचित है।
- source_word: בְּרוּחַ אֱלֹהִים
  choice: परमेश्वर के आत्मा के द्वारा
  rationale: बेथ को यहाँ साधन या कर्तृत्व के अर्थ में लिया गया है, किंतु ‘में’ अर्थात अनुभव के क्षेत्र का अर्थ भी व्याकरणतः संभव है और पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: וַיַּעַל מֵעָלַי
  choice: वह मेरे ऊपर से उठ गया
  rationale: आला और मेआलाय मिलकर ऊपर उठकर हटने की स्थानिक छवि देते हैं। यह अधिक व्याख्यात्मक ‘मुझसे दूर हो गया’ के बदले मूल चित्र को बनाए रखता है।
theological_decisions:
- issue: רוּחַ को ‘वायु’ मानें या ‘आत्मा’
  choice: दोनों स्थानों पर ‘आत्मा’, और दूसरे स्थान पर स्पष्टतः ‘परमेश्वर का आत्मा’
  alternative: वायु या श्वास
  rationale: निकटवर्ती प्रसंग भविष्यदर्शी स्थानांतरण और प्रकाशन का है, मौसम का नहीं। फिर भी अनुवाद आत्मा के व्यक्तित्व या कार्य के बारे में मूल से अधिक तात्त्विक विवरण नहीं जोड़ता।
- issue: בְּרוּחַ אֱלֹהִים में पूर्वसर्ग का संबंध
  choice: परमेश्वर के आत्मा के द्वारा
  alternative: परमेश्वर के आत्मा में
  rationale: संदर्भ में साधन/कर्तृत्व का अर्थ स्वाभाविक है, पर अनुभव के क्षेत्र का अर्थ भी संभव होने के कारण उसे पादटिप्पणी में दिया गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘निर्वासित लोगों’ से सामूहिक संज्ञा स्वाभाविक हिंदी में व्यक्त होती है, जबकि ‘मेरे ऊपर से उठ गया’ मूल की असामान्य किंतु अर्थपूर्ण ऊर्ध्वगामी छवि को जानबूझकर सुरक्षित रखता है।
