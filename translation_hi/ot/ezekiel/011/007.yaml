  text: לָ/כֵ֗ן כֹּֽה אָמַר֮ אֲדֹנָ֣/י יְהוִה֒ חַלְלֵי/כֶם֙ אֲשֶׁ֣ר שַׂמְתֶּ֣ם בְּ/תוֹכָ֔/הּ הֵ֥מָּה הַ/בָּשָׂ֖ר וְ/הִ֣יא הַ/סִּ֑יר וְ/אֶתְ/כֶ֖ם הוֹצִ֥יא מִ/תּוֹכָֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/011/007.yaml
  text: 'Therefore thus says Lord Yahweh: Your slain whom you have placed in its midst—they are the meat[a], and it is the pot; but you I will bring out from its midst.'
translation:
  language: hi
  text: 'इसलिए प्रभु याहवे यों कहता है: तुम्हारे वे मारे हुए लोग, जिन्हें तुमने उसके बीच में रखा है—वे ही मांस[a] हैं और वह हाँड़ी है; पर वह तुम्हें उसके बीच से निकाल देगा।[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘शरीर का मांस’। इब्रानी בָּשָׂר का अर्थ ‘मांस’ या ‘देह’ हो सकता है; यहाँ हाँड़ी के रूपक में ‘मांस’ अधिक स्वाभाविक है।
    reason: lexical_alternative
  - marker: b
    text: 'मसोरेटिक इब्रानी पाठ में क्रिया तीसरे पुरुष एकवचन है: ‘वह तुम्हें निकाल देगा।’ प्रत्यक्ष ईश्वरीय वाणी के संदर्भ में कुछ अनुवाद इसे ‘मैं तुम्हें निकाल दूँगा’ समझते हैं।'
    reason: grammatical_discourse_ambiguity
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  choice: प्रभु यहोवा
  rationale: אֲדֹנָי को ‘प्रभु’ और परमेश्वर के व्यक्तिगत नाम יהוה को ‘यहोवा’ के रूप में रखा गया है; इससे संयुक्त उपाधि स्वाभाविक और विशिष्ट बनी रहती है।
- source_word: חַלְלֵיכֶם
  choice: तुम्हारे वे मारे हुए लोग
  rationale: חָלָל केवल सामान्य मृतकों को नहीं, बल्कि हिंसा में मारे गए लोगों को दर्शाता है। यह अभिव्यक्ति अर्थ को स्पष्ट रखते हुए आधुनिक हिन्दी में स्वाभाविक है।
- source_word: שַׂמְתֶּם
  choice: रख छोड़ा है
  rationale: क्रिया का मूल अर्थ ‘रखना/स्थापित करना’ है। ‘रख छोड़ा है’ वर्तमान स्थिति के परिणाम और नेताओं की जिम्मेदारी, दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: בְּתוֹכָהּ / מִתּוֹכָהּ
  choice: उसके बीच / उसके बीच से
  rationale: स्त्रीलिंग एकवचन प्रत्यय नगर की ओर संकेत करता है। हिन्दी में ‘उसके बीच’ स्थानिक अर्थ को बनाए रखता है और संदर्भ में यरूशलेम की ओर स्वाभाविक रूप से संकेत करता है।
- source_word: הֵמָּה הַבָּשָׂר
  choice: वे ही मांस हैं
  rationale: הֵמָּה का बल ‘वे ही’ से व्यक्त किया गया है। בָּשָׂר का ‘मांस’ हाँड़ी में पकाए जाने वाले पदार्थ और देह—दोनों अर्थों की गुंजाइश बनाए रखता है।
- source_word: הַסִּיר
  choice: हाँड़ी
  rationale: סִיר पकाने के बर्तन को दर्शाता है। ‘हाँड़ी’ आधुनिक हिन्दी में सहज है और पिछले पद के पकाने संबंधी रूपक को स्पष्ट रखता है।
- source_word: הוֹצִיא
  choice: वह ... निकाल देगा
  rationale: WLC का स्वरांकित रूप हिफ़ील पूर्ण, अन्य पुरुष एकवचन है। भविष्यसूचक संदर्भ में इसे ‘निकाल देगा’ कहा गया है और कर्ता के लिए पाठ का ‘वह’ सुरक्षित रखा गया है।
theological_decisions:
- issue: ईश्वरीय नाम אֲדֹנָי יְהוִה का अनुवाद
  choice: प्रभु यहोवा
  alternative: प्रभु परमेश्वर
  rationale: मूल पाठ में वाचा का व्यक्तिगत नाम יהוה स्पष्ट है; ‘यहोवा’ उसे सामान्य उपाधि में बदलने के बजाय नाम के रूप में सुरक्षित रखता है।
- issue: मांस और हाँड़ी का रूपक
  choice: 'रूपक को सीधे बनाए रखा गया: ‘वे ही मांस हैं और वह हाँड़ी है’'
  alternative: अर्थ खोलकर बताना कि मारे गए लोग नगर के भीतर सुरक्षित समझे गए लोग हैं
  rationale: यह वचन अगुओं के पहले कथन को उलटता है। उसकी कठोरता और व्यंग्य को व्याख्या द्वारा नरम किए बिना बनाए रखा गया है।
- issue: הוֹצִיא में कर्ता का पुरुष
  choice: मसोरेटिक पाठ के अनुसार ‘वह तुम्हें ... निकाल देगा’
  alternative: संदर्भानुसार ‘मैं तुम्हें ... निकाल दूँगा’
  rationale: प्रत्यक्ष ईश्वरीय वाणी में प्रथम पुरुष अपेक्षित लग सकता है, और प्राचीन अनुवादों तथा अनेक आधुनिक अनुवादों में वही अर्थ मिलता है; फिर भी दिए गए WLC रूप में क्रिया अन्य पुरुष एकवचन है। मुख्य पाठ उस वास्तविक व्याकरणिक तनाव को सुरक्षित रखता है और पादटिप्पणी वैकल्पिक समझ बताती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘यों कहता है’, ‘मारे हुए लोग’ और ‘हाँड़ी’ जैसे पद बाइबलीय गंभीरता तथा बोलचाल की स्पष्टता के बीच संतुलन रखते हैं।
