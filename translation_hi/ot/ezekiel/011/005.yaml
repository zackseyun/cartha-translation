source:
  edition: WLC
  text: וַ/תִּפֹּ֣ל עָלַ/י֮ ר֣וּחַ יְהוָה֒ וַ/יֹּ֣אמֶר אֵלַ֗/י אֱמֹר֙ כֹּה אָמַ֣ר יְהוָ֔ה כֵּ֥ן אֲמַרְתֶּ֖ם בֵּ֣ית יִשְׂרָאֵ֑ל וּ/מַעֲל֥וֹת רֽוּחֲ/כֶ֖ם אֲנִ֥י יְדַעְתִּֽי/הָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/011/005.yaml
  text: 'And the Spirit of Yahweh fell upon me[a], and he said to me, “Say, ‘Thus says Yahweh: So you have said, O house of Israel, and I know the things that come up in your spirit.’”'
translation:
  language: hi
  text: 'और यहोवा का आत्मा मुझ पर आ पड़ा, और उसने मुझसे कहा, “कह, ‘यहोवा यों कहता है: हे इस्राएल के घराने, तुमने ऐसा कहा है; और तुम्हारे मन[a] में जो बातें उठती हैं, उन्हें मैं जानता हूँ।’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तुम्हारी आत्मा में जो बातें उठती हैं।” इब्रानी में शाब्दिक रूप से, “तुम्हारी आत्मा की उठनेवाली बातें।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּפֹּל עָלַי
  choice: मुझ पर आ पड़ा
  rationale: नפל עַל की प्रबल और सजीव अभिव्यक्ति को बनाए रखता है; केवल ‘मुझ पर आया’ की तुलना में भविष्यद्वक्ता पर आत्मा के प्रभावशाली आगमन को अधिक स्पष्ट करता है।
- source_word: רוּחַ יְהוָה
  choice: यहोवा का आत्मा
  rationale: दर्शन और भविष्यद्वाणी के प्रसंग में רוּחַ प्राकृतिक वायु नहीं, बल्कि भविष्यद्वक्ता को प्रेरित करने वाला परमेश्वर का आत्मा है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: इब्रानी चतुरक्षरीय परमेश्वर-नाम को हिन्दी में प्रचलित व्यक्तिगत नाम ‘यहोवा’ से व्यक्त किया गया है।
- source_word: אֱמֹר
  choice: कह
  rationale: भविष्यद्वक्ता को दिया गया सीधा एकवचन आदेश है; आधुनिक हिन्दी में ‘कह’ स्वाभाविक है।
- source_word: כֹּה אָמַר יְהוָה
  choice: यहोवा यों कहता है
  rationale: प्रचलित भविष्यद्वाणीय संदेश-सूत्र का निकट और स्वाभाविक हिन्दी रूप।
- source_word: כֵּן אֲמַרְתֶּם
  choice: तुमने ऐसा ही कहा है
  rationale: כֵּן पूर्व कथन की ओर संकेत करता है; ‘ऐसा ही’ उसकी पुष्टि और प्रत्यक्षता को बनाए रखता है।
- source_word: בֵּית יִשְׂרָאֵל
  choice: हे इस्राएल के घराने
  rationale: वाचा-संबंधी सामूहिक संबोधन को केवल ‘इस्राएल’ बनाकर सपाट करने के बजाय उसकी आलंकारिक शक्ति सुरक्षित रखी गई है।
- source_word: וּמַעֲלוֹת רוּחֲכֶם
  choice: तुम्हारे मन में जो बातें उठती हैं
  rationale: מַעֲלוֹת के ‘ऊपर उठने’ के रूपक को ‘उठती हैं’ में रखा गया है, जबकि इस मानवीय प्रसंग में רוּחַ को स्वाभाविक हिन्दी के अनुसार ‘मन’ कहा गया है।
- source_word: אֲנִי יְדַעְתִּיהָ
  choice: उन्हें मैं जानता हूँ
  rationale: एकवचन प्रत्यय सामूहिक रूप से पिछली बहुवचन धारणा की ओर संकेत करता है; हिन्दी में बहुवचन सर्वनाम अर्थ को सहजता से व्यक्त करता है।
theological_decisions:
- issue: परमेश्वर के नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: प्रभु / याहवे
  rationale: मूल पाठ में व्यक्तिगत वाचा-नाम है; उसे सामान्य उपाधि में बदलने के बजाय हिन्दी में व्यापक रूप से पहचाने जाने वाले रूप ‘यहोवा’ से रखा गया है।
- issue: पहले उपवाक्य में רוּחַ का अर्थ
  choice: आत्मा
  alternative: वायु
  rationale: यहेजकेल के भविष्यद्वाणीय दर्शन के प्रसंग में यह परमेश्वर के आत्मा का आगमन है, प्राकृतिक हवा का नहीं।
- issue: רוּחֲכֶם का मानवीय अर्थ
  choice: मन
  alternative: आत्मा
  rationale: यहाँ शब्द लोगों के भीतर उठने वाले विचारों या योजनाओं को सूचित करता है। ‘मन’ आधुनिक हिन्दी में यही अर्थ स्वाभाविक रूप से देता है, जबकि ‘उठती हैं’ मूल रूपक को बचाए रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। भविष्यद्वाणीय सूत्र ‘यहोवा यों कहता है’ तथा संबोधन ‘हे इस्राएल के घराने’ औपचारिक बाइबलीय स्वर बनाए रखते हैं; शेष वाक्य अनावश्यक संस्कृतनिष्ठता से बचता है।
