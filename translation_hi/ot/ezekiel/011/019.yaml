id: EZK.11.19
reference: Ezekiel 11:19
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/נָתַתִּ֤י לָ/הֶם֙ לֵ֣ב אֶחָ֔ד וְ/ר֥וּחַ חֲדָשָׁ֖ה אֶתֵּ֣ן בְּ/קִרְבְּ/כֶ֑ם וַ/הֲסִ֨רֹתִ֜י לֵ֤ב הָ/אֶ֨בֶן֙ מִ/בְּשָׂרָ֔/ם וְ/נָתַתִּ֥י לָ/הֶ֖ם לֵ֥ב בָּשָֽׂר׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/011/019.yaml
  text: And I will give them one heart[a], and I will put a new spirit within them[b]. I will remove the heart of stone from their flesh and give them a heart of flesh.
translation:
  language: hi
  text: मैं उन्हें एक ही हृदय दूँगा[a] और उनके भीतर[b] एक नई आत्मा डालूँगा। मैं उनकी देह में से पत्थर का हृदय निकाल दूँगा और उन्हें मांस का हृदय दूँगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘एक ही हृदय’ का अर्थ ‘अविभाजित हृदय’ भी हो सकता है, अर्थात ऐसी भीतरी निष्ठा जो बँटी हुई न हो।
    reason: lexical_alternative
  - marker: b
    text: यहाँ दिए गए इब्रानी पाठ का रूप ‘तुम्हारे भीतर’ है; ‘उनके भीतर’ आसपास के सर्वनामों और यहेजकेल 36:26 के निकट समानांतर कथन के अनुसार है।
    reason: textual_variant
lexical_decisions:
- source_word: לֵב אֶחָד
  choice: एक ही हृदय
  rationale: यह सीधा रूपक हृदय को मनुष्य के भीतरी व्यक्तित्व—उसकी इच्छा, सोच और प्रवृत्ति—के रूप में बनाए रखता है। ‘एक ही’ एकता या अविभाजित निष्ठा की सम्भावना को सुरक्षित रखता है, पर उसे व्याख्या बनाकर थोपता नहीं।
- source_word: רוּחַ חֲדָשָׁה
  choice: एक नई आत्मा
  rationale: इस भीतरी नवीकरण के प्रसंग में רוּחַ का अर्थ ‘आत्मा’ सबसे उपयुक्त है; ‘हवा’ प्रसंगानुकूल नहीं और ‘नई प्रवृत्ति’ अधिक व्याख्यात्मक होता।
- source_word: בְּקִרְבְּכֶם
  choice: उनके भीतर
  rationale: प्रदत्त इब्रानी रूप औपचारिक रूप से ‘तुम्हारे भीतर’ पढ़ा जाता है, किंतु आसपास के तीसरे पुरुष बहुवचन सर्वनामों और यहेजकेल 36:26 के निकट समानांतर कथन के कारण मुख्य पाठ में ‘उनके भीतर’ लिया गया है; पाठगत विकल्प पादटिप्पणी में रखा गया है।
- source_word: וַהֲסִרֹתִי
  choice: निकाल दूँगा
  rationale: यह हिन्दी में किसी वस्तु को भीतर से हटाने की प्रेरणार्थक क्रिया को स्वाभाविक और स्पष्ट रूप से व्यक्त करता है।
- source_word: לֵב הָאֶבֶן
  choice: पत्थर का हृदय
  rationale: शाब्दिक रूपक की सजीवता बनाए रखी गई है; इसे ‘कठोर हृदय’ कहना एक निहितार्थ की व्याख्या कर देता।
- source_word: מִבְּשָׂרָם
  choice: उनकी देह में से
  rationale: यहाँ בָּשָׂר मनुष्य की देह को सूचित करता है। हिन्दी में ‘देह में से’ स्थान-संबंध को स्वाभाविक ढंग से व्यक्त करता है और अगले ‘मांस का हृदय’ वाले रूपक से अनावश्यक भ्रम घटाता है।
- source_word: לֵב בָּשָׂר
  choice: मांस का हृदय
  rationale: पत्थर और जीवित मांस के बीच मूल विरोध को ज्यों का त्यों रखा गया है; ‘कोमल हृदय’ या ‘संवेदनशील हृदय’ रूपक के अर्थ को पहले ही निर्धारित कर देते।
theological_decisions:
- issue: भीतरी नवीकरण में ‘हृदय’ और ‘आत्मा’ का संबंध
  choice: मुख्य पाठ में ‘हृदय’ और ‘आत्मा’ को अलग, पर परस्पर संबंधित पदों के रूप में रखा गया है।
  alternative: दोनों को ‘मन’ और ‘स्वभाव’ जैसे मनोवैज्ञानिक शब्दों में समेट देना।
  rationale: इब्रानी पाठ ईश्वरीय परिवर्तन को दो विशिष्ट मानवशास्त्रीय रूपकों द्वारा व्यक्त करता है। दोनों को बनाए रखने से उनके संबंध को जरूरत से अधिक व्यवस्थित या परिभाषित नहीं किया जाता।
- issue: ‘मांस का हृदय’ रूपक
  choice: रूपक को शाब्दिक रूप में बनाए रखा गया है।
  alternative: ‘कोमल हृदय’ या ‘आज्ञाकारी हृदय’।
  rationale: पाठ स्वयं पत्थर और मांस का स्पष्ट विरोध प्रस्तुत करता है। शाब्दिक अनुवाद कोमलता, प्रत्युत्तरशीलता और जीवंतता जैसे सम्भव निहितार्थों में से किसी एक को अकेला निर्णायक नहीं बनाता।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सहज रूप अपनाया गया है। ‘पत्थर का हृदय’ और ‘मांस का हृदय’ जैसे मूल रूपकों को व्याख्यात्मक नरमी दिए बिना सुरक्षित रखा गया है; वाक्य विन्यास सामान्य पाठक के लिए प्रवाहपूर्ण है।
