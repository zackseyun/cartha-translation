id: EZK.11.17
reference: Ezekiel 11:17
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: לָ/כֵ֣ן אֱמֹ֗ר כֹּֽה אָמַר֮ אֲדֹנָ֣/י יְהוִה֒ וְ/קִבַּצְתִּ֤י אֶתְ/כֶם֙ מִן הָ֣/עַמִּ֔ים וְ/אָסַפְתִּ֣י אֶתְ/כֶ֔ם מִן הָ֣/אֲרָצ֔וֹת אֲשֶׁ֥ר נְפֹצוֹתֶ֖ם בָּ/הֶ֑ם וְ/נָתַתִּ֥י לָ/כֶ֖ם אֶת אַדְמַ֥ת יִשְׂרָאֵֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/011/017.yaml
  text: 'Therefore say[a], ‘Thus says the Lord GOD: I will gather you from the peoples and assemble you from the lands where you have been scattered[b], and I will give you the land of Israel.’'
translation:
  language: hi
  text: 'इसलिए कहो, ‘प्रभु यहोवा यह कहते हैं: मैं तुम्हें उन जातियों में से इकट्ठा करूँगा और उन देशों से तुम्हें एकत्र करूँगा जहाँ तुम तितर-बितर किए गए हो; और मैं तुम्हें इस्राएल की भूमि दूँगा।’'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לָכֵן
  choice: इसलिए
  rationale: यह निष्कर्षसूचक अव्यय पिछले कथन के परिणाम को प्रस्तुत करता है; ‘इसलिए’ आधुनिक हिन्दी में स्वाभाविक और स्पष्ट है।
- source_word: כֹּה אָמַר
  choice: यह कहते हैं
  rationale: भविष्यद्वाणी के संदेशवाहक-सूत्र को स्वाभाविक, गरिमापूर्ण आधुनिक हिन्दी में व्यक्त करता है।
- source_word: אֲדֹנָי יְהוִה
  choice: प्रभु यहोवा
  rationale: אֲדֹנָי को ‘प्रभु’ और परमेश्वर के व्यक्तिगत नाम יהוה को ‘यहोवा’ देकर संयुक्त उपाधि के दोनों तत्व सुरक्षित रखे गए हैं।
- source_word: הָעַמִּים
  choice: जाति-जाति के लोग
  rationale: बहुवचन עַמִּים अलग-अलग जनसमुदायों को सूचित करता है; यह पद देशों के लिए प्रयुक्त अगले शब्द से भेद भी बनाए रखता है।
- source_word: וְקִבַּצְתִּי / וְאָסַפְתִּי
  choice: इकट्ठा करूँगा / एकत्र करूँगा
  rationale: दो निकटार्थी इब्रानी क्रियाओं की समानांतरता और हल्का शाब्दिक वैविध्य दोनों बनाए रखे गए हैं।
- source_word: הָאֲרָצוֹת
  choice: देशों
  rationale: निर्वासन के विभिन्न भौगोलिक प्रदेशों के संदर्भ में ‘देशों’ सहज और सटीक है।
- source_word: אֲשֶׁר נְפֹצוֹתֶם בָּהֶם
  choice: जहाँ तुम तितर-बितर किए गए हो
  rationale: निफ़अल रूप का कर्मवाच्य और बिखराव से उत्पन्न वर्तमान दशा दोनों हिन्दी में सुरक्षित हैं।
- source_word: אַדְמַת יִשְׂרָאֵל
  choice: इस्राएल की भूमि
  rationale: אַדְמָה का मूल अर्थ मिट्टी या भूमि हो सकता है, पर वापसी और पुनर्स्थापना के इस प्रसंग में क्षेत्रीय अर्थ ‘भूमि’ उपयुक्त है।
theological_decisions:
- issue: संयुक्त ईश्वरीय उपाधि אֲדֹנָי יְהוִה का अनुवाद
  choice: प्रभु यहोवा
  alternative: प्रभु याहवे
  rationale: संयुक्त पद के दोनों अंशों का स्पष्ट अनुवाद किया गया है। हिन्दी बाइबलीय प्रयोग में ‘यहोवा’ व्यापक रूप से पहचाना जाता है; ‘याहवे’ नाम के संभावित वैकल्पिक लिप्यंतरण के रूप में स्वीकार्य है।
- issue: बिखराव के कर्ता की पहचान
  choice: तितर-बितर किए गए हो
  alternative: तितर-बितर हो गए हो
  rationale: मूल में कर्मवाच्य है, पर कर्ता स्पष्ट नहीं बताया गया। अनुवाद उसी अस्पष्टता को बनाए रखता है और यह नहीं जोड़ता कि किसने उन्हें बिखेरा।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण भविष्यद्वाणी शैली रखी गई है। ‘जाति-जाति के लोगों’ और ‘देशों’ के माध्यम से עַמִּים तथा אֲרָצוֹת का अंतर सुरक्षित है। किसी पाद-टिप्पणी की आवश्यकता नहीं पड़ी।
