  text: וַ/יִּשְׂא֤וּ הַ/כְּרוּבִים֙ אֶת כַּנְפֵי/הֶ֔ם וְ/הָ/אֽוֹפַנִּ֖ים לְ/עֻמָּתָ֑/ם וּ/כְב֧וֹד אֱלֹהֵֽי יִשְׂרָאֵ֛ל עֲלֵי/הֶ֖ם מִ/לְ/מָֽעְלָ/ה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/011/022.yaml
  text: Then the cherubim lifted up their wings[a], with the wheels beside them[b], and the glory of the God of Israel was above them.
translation:
  language: hi
  text: तब करूबों ने अपने पंख उठाए और पहिए उनके साथ-साथ थे। इस्राएल के परमेश्वर की महिमा उनके ऊपर थी।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “उनके ऊपर, ऊपर से”; इब्रानी में महिमा के ऊपर होने पर दोहरा स्थानवाचक जोर है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׂאוּ
  choice: उठाए
  rationale: नשׂא के Qal रूप और प्रत्यक्ष कर्म ‘अपने पंख’ के संदर्भ में यह स्वाभाविक रूप से पंख ऊपर उठाने को व्यक्त करता है।
- source_word: הַכְּרוּבִים
  choice: करूबों
  rationale: इन स्वर्गीय प्राणियों के लिए प्रचलित बाइबलीय लिप्यंतरण ‘करूब’ रखा गया है; परसर्ग के कारण बहुवचन रूप ‘करूबों’ है।
- source_word: כַּנְפֵיהֶם
  choice: अपने पंख
  rationale: हिन्दी में कर्ता के अपने अंगों के लिए ‘अपने’ स्वाभाविक है और इब्रानी तृतीय पुरुष बहुवचन संबंध को ठीक व्यक्त करता है।
- source_word: וְהָאוֹפַנִּים לְעֻמָּתָם
  choice: और पहिए उनके साथ-साथ थे
  rationale: וְ को ‘और’ से तथा לְעֻמָּתָם की सापेक्ष स्थिति को ‘साथ-साथ’ से व्यक्त किया गया है; इससे पहियों की करूबों के अनुरूप निकट स्थिति स्पष्ट होती है, बिना गति को अनावश्यक रूप से मूल पाठ में जोड़ने के।
- source_word: וּכְבוֹד אֱלֹהֵי יִשְׂרָאֵל
  choice: इस्राएल के परमेश्वर की महिमा
  rationale: כבוד के मानक और अंतर्पाठीय रूप से महत्त्वपूर्ण अनुवाद ‘महिमा’ को रखा गया है; ‘महिमामय उपस्थिति’ जैसी व्याख्यात्मक वृद्धि नहीं की गई।
- source_word: עֲלֵיהֶם מִלְמָעְלָה
  choice: उनके ऊपर थी
  rationale: मुख्य पाठ में स्वाभाविक हिन्दी रखी गई है। इब्रानी की अतिरिक्त स्थानवाचक अभिव्यक्ति מִלְמָעְלָה को पादटिप्पणी में शाब्दिक विकल्प के रूप में सुरक्षित किया गया है।
theological_decisions:
- issue: यहेजकेल के सिंहासन-दर्शन में כבוד का अनुवाद
  choice: महिमा
  alternative: महिमामय उपस्थिति
  rationale: ‘महिमा’ दृश्य ईश्वरीय प्रकटता के साथ-साथ शब्द के व्यापक धर्मवैज्ञानिक और अंतर्पाठीय अर्थ को बनाए रखता है तथा व्याख्यात्मक विस्तार से बचता है।
- issue: ईश्वरीय महिमा की स्थानवाचक अभिव्यक्ति
  choice: मुख्य पाठ में ‘उनके ऊपर थी’, शाब्दिक जोर पादटिप्पणी में
  alternative: उनके ऊपर, ऊपर से थी
  rationale: इब्रानी עֲלֵיהֶם מִלְמָעְלָה में दोहरी ऊर्ध्व स्थान-सूचना है। उसे मुख्य हिन्दी में हूबहू दोहराना अस्वाभाविक होता, इसलिए अर्थ मुख्य पाठ में और संरचनात्मक जोर पादटिप्पणी में रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘करूब’, ‘महिमा’ और ‘इस्राएल के परमेश्वर’ जैसे स्थापित बाइबलीय पद सुरक्षित हैं। दो स्वतंत्र वर्णनात्मक उपवाक्यों को अलग वाक्यों में रखा गया है ताकि दृश्य स्पष्ट रहे और इब्रानी संबंधों में कोई अतिरिक्त व्याख्या न जुड़े।
