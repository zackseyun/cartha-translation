base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/011/002.yaml
  text: And he said to me[a], “Son of man[b], these are the men who devise iniquity and give evil counsel in this city.”
translation:
  language: hi
  text: तब उसने मुझसे कहा, “हे मनुष्य-पुत्र, ये वे पुरुष हैं जो इस नगर में अनर्थ की योजनाएँ बनाते हैं[a] और बुरी सलाह देते हैं[b]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “बुराई सोचते हैं” या “बुराई की योजनाएँ बनाते हैं।”
    reason: lexical_alternative
  - marker: b
    text: या “बुरी योजना की सलाह देते हैं।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אֵלַי
  choice: तब उसने मुझसे कहा
  rationale: कथात्मक וַיֹּאמֶר को स्वाभाविक हिन्दी क्रम में व्यक्त करता है; ‘तब’ प्रसंग की क्रमिकता दिखाता है।
- source_word: בֶּן אָדָם
  choice: हे मनुष्य के पुत्र
  rationale: यहेजकेल के लिए बार-बार प्रयुक्त संबोधन का स्रोत-सन्निकट और पहचाना जाने वाला रूप है।
- source_word: אֵלֶּה הָאֲנָשִׁים
  choice: ये वे पुरुष हैं
  rationale: विशिष्ट पुरुष अगुओं की ओर संकेत करने वाले पुल्लिंग बहुवचन को स्पष्ट रखता है।
- source_word: הַחֹשְׁבִים אָוֶן
  choice: जो दुष्टता की योजनाएँ बनाते हैं
  rationale: חָשַׁב यहाँ केवल मन में सोचने के बजाय जानबूझकर योजना बनाने का भाव देता है, और אָוֶן नैतिक बुराई अथवा अनर्थ को सूचित करता है।
- source_word: וְהַיֹּעֲצִים עֲצַת רָע
  choice: और बुरी सलाह देते हैं
  rationale: क्रिया और सजातीय संज्ञा की इब्रानी रचना का सलाह देने वाला सक्रिय भाव सहज हिन्दी में सुरक्षित रहता है।
- source_word: בָּעִיר הַזֹּאת
  choice: इस नगर में
  rationale: स्थानवाचक पद का सीधा और स्वाभाविक हिन्दी रूप; वाक्य में इसे दोनों सहभागी क्रियाओं से संबद्ध पढ़ा जा सकता है।
theological_decisions:
- issue: संबोधन בֶּן אָדָם में אָדָם का अनुवाद
  choice: हे मनुष्य के पुत्र
  alternative: हे नश्वर मनुष्य
  rationale: यह यहेजकेल के लिए आवर्ती भविष्यद्वक्ताई संबोधन है। चुना हुआ रूप इब्रानी संरचना और उसके साहित्यिक-धर्मवैचारिक प्रतिध्वनि को बनाए रखता है, जबकि विकल्प उसका अर्थ समझाता है पर संरचना को समतल कर देता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज शैली अपनाई गई है। ‘नगर’ औपचारिक बाइबलीय प्रसंग के अनुकूल है; ‘योजनाएँ बनाते’ और ‘सलाह देते’ सामान्य पाठक के लिए स्पष्ट हैं।
