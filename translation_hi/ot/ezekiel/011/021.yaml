source:
  edition: WLC
  text: וְ/אֶל לֵ֧ב שִׁקּוּצֵי/הֶ֛ם וְ/תוֹעֲבוֹתֵי/הֶ֖ם לִבָּ֣/ם הֹלֵ֑ךְ דַּרְכָּ/ם֙ בְּ/רֹאשָׁ֣/ם נָתַ֔תִּי נְאֻ֖ם אֲדֹנָ֥/י יְהוִֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/011/021.yaml
  text: But as for those whose heart goes after their detestable things and their abominations[a], I have brought their way upon their own heads[b], declares the Lord GOD.
translation:
  language: hi
  text: परन्तु जिनका मन अपनी घिनौनी वस्तुओं और अपनी घृणित बातों के पीछे लगा रहता है[a], उनका मार्ग मैं उन्हीं के सिर पर डाल दूँगा[b]—प्रभु याहवे की यह घोषणा है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से, “उनकी घिनौनी वस्तुओं और घृणित बातों के हृदय की ओर उनका हृदय जाता है”; यह उनके भीतरी लगाव को व्यक्त करने वाला मुहावरा है।
    reason: मूल के असामान्य दोहरे ‘हृदय’ वाले वाक्य-विन्यास और उसके मुहावरेदार अर्थ को दर्ज करना।
  - marker: b
    text: इब्रानी में शाब्दिक रूप से, “मैंने उनका मार्ग उनके सिर पर रख दिया है”; इसका भाव है कि उनके आचरण का प्रतिफल उन्हीं पर लौटेगा।
    reason: मूल मुहावरे और सिद्ध क्रियारूप को दिखाना; मुख्य पाठ में प्रसंगानुकूल निश्चित भावी न्याय व्यक्त किया गया है।
lexical_decisions:
- source_word: וְאֶל
  choice: परन्तु जिनका
  rationale: यह पद पिछले पदों की प्रतिज्ञा के विपरीत समूह का उल्लेख करता है। हिन्दी में ‘परन्तु जिनका’ इस विरोध और विषय-परिवर्तन को स्वाभाविक रूप से व्यक्त करता है।
- source_word: לֵב ... לִבָּם הֹלֵךְ
  choice: जिनका मन ... के पीछे लगा रहता है
  rationale: मूल में ‘हृदय’ और ‘जाने’ की भाषा आन्तरिक लगाव तथा निरन्तर अनुसरण का भाव देती है। ‘मन ... के पीछे लगा रहता है’ आधुनिक हिन्दी में इसी भाव को स्वाभाविक रूप से व्यक्त करता है।
- source_word: שִׁקּוּצֵיהֶם
  choice: अपनी घिनौनी वस्तुओं
  rationale: यह शब्द प्रायः घृणित उपासना-वस्तुओं या मूर्तियों के लिए आता है, पर इसका अर्थ केवल ‘मूर्तियाँ’ तक सीमित नहीं है। व्यापक अर्थ बनाए रखने के लिए ‘घिनौनी वस्तुओं’ चुना गया है।
- source_word: וְתוֹעֲבוֹתֵיהֶם
  choice: अपने घृणित कामों
  rationale: यह भविष्यद्वक्ताओं की भाषा में धार्मिक या नैतिक रूप से घृणित बातों और आचरणों को सूचित करता है। निकटवर्ती समानार्थी संज्ञा से भेद रखने और हिन्दी में स्वाभाविकता के लिए ‘घृणित कामों’ रखा गया है।
- source_word: דַּרְכָּם
  choice: उनका चालचलन
  rationale: ‘मार्ग’ यहाँ जीवन-व्यवहार का रूपक है। ‘चालचलन’ उस नैतिक अर्थ को स्पष्ट करता है और प्रतिफल के वाक्य में स्वाभाविक है।
- source_word: בְּרֹאשָׁם
  choice: उन्हीं के सिर पर
  rationale: यह मुहावरा व्यक्ति के अपने कर्मों का दण्ड उसी पर लौटने को व्यक्त करता है। ‘उन्हीं’ प्रतिफल के इस भाव को स्पष्ट करता है।
- source_word: נָתַתִּי
  choice: मैं ... डाल दूँगा
  rationale: इब्रानी सिद्ध क्रिया प्रसंग में निश्चित भावी न्याय को ऐसे प्रस्तुत कर सकती है मानो वह हो चुका हो। पिछले पदों के भावी प्रसंग के अनुरूप हिन्दी भविष्यकाल रखा गया है; ‘डालना’ सिर पर प्रतिफल आने के मुहावरे को बनाए रखता है।
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: प्रभु याहवे की यह घोषणा है
  rationale: נְאֻם भविष्यद्वाणी की प्रामाणिक घोषणा का सूत्र है। अֲדֹנָי को ‘प्रभु’ और परमेश्वर के व्यक्तिगत नाम יהוה को ‘याहवे’ रूप में रखा गया है।
theological_decisions:
- issue: אֲדֹנָי יְהוִה में परमेश्वर के नाम का अनुवाद
  choice: प्रभु याहवे
  alternative: प्रभु परमेश्वर / प्रभु यहोवा
  rationale: यह पद יהוה नाम को सीधे प्रस्तुत करता है। ‘याहवे’ उसके व्यक्तिगत वाचा-नाम को सामान्य उपाधि में बदले बिना दर्शाता है, जबकि אֲדֹנָי का अर्थ ‘प्रभु’ रखा गया है।
- issue: 'न्याय का काल: נָתַתִּי का सिद्ध रूप'
  choice: मैं ... डाल दूँगा
  alternative: मैंने ... डाल दिया है
  rationale: रूप व्याकरणतः सिद्ध है, पर यहेजकेल 11:19–21 के भावी प्रतिज्ञा और न्याय के प्रसंग में निश्चित भावी परिणाम को व्यक्त करता जान पड़ता है। हिन्दी भविष्यकाल प्रसंग को स्पष्ट करता है, जबकि पादटिप्पणी शाब्दिक रूप की जानकारी देती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘घिनौनी वस्तुएँ’ और ‘घृणित काम’ निकटवर्ती इब्रानी शब्दों का भेद बनाए रखते हैं। ‘चालचलन ... सिर पर डाल दूँगा’ न्याय के मूल रूपक को यथासम्भव सुरक्षित रखते हुए हिन्दी में अर्थगम्य है।
