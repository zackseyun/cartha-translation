source:
  edition: WLC
  text: וְ/הוֹצֵאתִ֤י אֶתְ/כֶם֙ מִ/תּוֹכָ֔/הּ וְ/נָתַתִּ֥י אֶתְ/כֶ֖ם בְּ/יַד זָרִ֑ים וְ/עָשִׂ֛יתִי בָ/כֶ֖ם שְׁפָטִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/011/009.yaml
  text: And I will bring you out from its midst[a], and I will give you into the hand of foreigners[b], and I will execute judgments on you.
translation:
  language: hi
  text: और मैं तुम्हें उसके बीच से निकालूँगा और तुम्हें परदेशियों के हाथ में सौंप दूँगा, और तुम पर न्याय करूँगा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהוֹצֵאתִי
  choice: और मैं तुम्हें निकालूँगा
  rationale: יצא के हिफ़ील रूप का अर्थ किसी को बाहर निकालना है; ‘निकालूँगा’ कारणवाचक भाव को स्वाभाविक हिन्दी में रखता है।
- source_word: מִתּוֹכָהּ
  choice: उसके बीच से
  rationale: תּוֹךְ भीतर या मध्य को दर्शाता है और स्त्रीलिंग प्रत्यय संदर्भ में यरूशलेम नगर की ओर संकेत करता है; सर्वनाम को बनाए रखने से मूल की अभिव्यक्ति सुरक्षित रहती है।
- source_word: וְנָתַתִּי אֶתְכֶם בְּיַד
  choice: और तुम्हें ... के हाथ में सौंप दूँगा
  rationale: נתן + בְּיַד किसी को दूसरे के अधिकार में सौंपने का मुहावरा है। हिन्दी में ‘हाथ में सौंप दूँगा’ मुहावरे के चित्र और आशय दोनों को स्पष्ट रखता है।
- source_word: זָרִים
  choice: परदेशियों
  rationale: זָרִים यहाँ विदेशी लोगों अथवा विजेताओं को सूचित करता है; ‘परदेशी’ आधुनिक हिन्दी में स्पष्ट और प्रसंगानुकूल है।
- source_word: וְעָשִׂיתִי בָכֶם שְׁפָטִים
  choice: और तुम पर दण्ड के न्याय करूँगा
  rationale: עשה + ב + שְׁפָטִים दण्डात्मक न्याय लागू करने को व्यक्त करता है। ‘दण्ड के न्याय करूँगा’ बहुवचन שְׁפָטִים और न्यायिक-दण्डात्मक अर्थ को बनाए रखता है।
theological_decisions:
- issue: מִתּוֹכָהּ के स्त्रीलिंग प्रत्यय का संकेत
  choice: ‘उसके’ के रूप में सर्वनाम बनाए रखा गया, जिसका प्रसंगगत संकेत यरूशलेम नगर की ओर है।
  alternative: ‘नगर के बीच से’ कहकर संकेत को स्पष्ट किया जा सकता है।
  rationale: निकटवर्ती प्रसंग यरूशलेम से निकाले जाने की बात करता है, पर इस पद में ‘नगर’ संज्ञा स्पष्टतः नहीं है; इसलिए मूल की सर्वनामिक अभिव्यक्ति को बनाए रखा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सीधी भविष्यवाणी-संबंधी भाषा। ‘हाथ में सौंपना’ परिचित हिन्दी मुहावरा है। किसी पादटिप्पणी की आवश्यकता नहीं पड़ी।
