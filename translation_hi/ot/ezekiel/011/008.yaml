  yaml_path: translation/ot/ezekiel/011/008.yaml
  text: You have feared the sword[a], and I will bring the sword upon you[b], declares the Lord GOD.
translation:
  language: hi
  text: तुम तलवार से डरे हो[a], और तलवार मैं तुम पर लाऊँगा[b]—प्रभु यहोवा की यह घोषणा है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: मूल इब्रानी में ‘तलवार’। यहाँ यह युद्ध या हिंसक दंड के व्यापक अर्थ का संकेत भी हो सकती है।
    reason: lexical_alternative
  - marker: b
    text: या, ‘तुम तलवार से डरे हो, और मैं तुम पर तलवार लाऊँगा।’
    reason: alternative_reading
lexical_decisions:
- source_word: חֶרֶב
  choice: तलवार
  rationale: इस संज्ञा का सीधा अर्थ ‘तलवार’ है। भविष्यद्वाणी के न्याय-संबंधी प्रसंग में यह युद्ध या हिंसक दंड का बिंब भी हो सकती है, पर ठोस बिंब और पद में इसकी पुनरावृत्ति को बनाए रखना उचित है।
- source_word: יְרֵאתֶם
  choice: तुम ... डरे हो
  rationale: यह ירא का काल पूर्ण, द्वितीय पुरुष बहुवचन रूप है। ‘डरे हो’ पूर्ण हुई क्रिया के वर्तमान प्रभाव को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है; ‘डरे थे’ या ‘डरे’ भी संभव हैं।
- source_word: וְחֶרֶב אָבִיא עֲלֵיכֶם
  choice: और तलवार ही मैं तुम पर लाऊँगा
  rationale: मूल में ‘तलवार’ क्रिया से पहले रखी गई है, जिससे दोहराव और बल उत्पन्न होता है। ‘ही’ उस बल को स्वाभाविक हिन्दी में व्यक्त करता है, और ‘तुम पर लाऊँगा’ עַל के न्याय-संबंधी प्रयोग को सीधे रखता है।
- source_word: נְאֻם
  choice: यह घोषणा है
  rationale: यह नबूवतीय कथन का गंभीर, प्रामाणिक समापन-सूत्र है। ‘घोषणा’ आधुनिक और गरिमापूर्ण हिन्दी में इसकी औपचारिकता बनाए रखती है।
- source_word: אֲדֹנָי יְהוִה
  choice: प्रभु यहोवा
  rationale: אֲדֹנָי को ‘प्रभु’ और परमेश्वर के व्यक्तिगत नाम יהוה को हिन्दी में प्रचलित रूप ‘यहोवा’ से प्रस्तुत किया गया है, जिससे संयुक्त उपाधि के दोनों अंग स्पष्ट रहते हैं।
theological_decisions:
- issue: संयुक्त ईश्वरीय संबोधन אֲדֹנָי יְהוִה का अनुवाद
  choice: प्रभु यहोवा
  alternative: प्रभु परमेश्वर
  rationale: ‘प्रभु यहोवा’ मूल पाठ में आए पद और व्यक्तिगत ईश्वरीय नाम दोनों को अलग-अलग बनाए रखता है। ‘प्रभु परमेश्वर’ हिन्दी बाइबलीय परंपरा में संभव है, पर उससे יהוה का नाम सामान्य उपाधि में बदल जाता है।
- issue: तलवार के बिंब का अर्थ
  choice: ठोस शब्द ‘तलवार’ को दोनों बार बनाए रखना
  alternative: युद्ध या हिंसक दंड
  rationale: यह बिंब व्यापक रूप से युद्ध अथवा हिंसक न्याय का संकेत दे सकता है, फिर भी पद स्वयं दो बार חֶרֶב कहता है। इसलिए व्यापक अर्थ को मुख्य पाठ में आरोपित करने के बजाय टिप्पणी में रखा गया है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘तलवार’ की पुनरावृत्ति तथा दूसरे खंड में उसका बल मूल इब्रानी की नबूवतीय तीव्रता को बनाए रखते हैं। बहुवचन ‘तुम’ संदर्भित समूह को संबोधित करता है।
