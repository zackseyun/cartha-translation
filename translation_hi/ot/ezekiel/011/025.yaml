  text: तब मैंने निर्वासित लोगों[a] को याहवे की वे सारी बातें सुनाईं जो उसने मुझे दिखाई थीं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से ‘निर्वासन’; यह निर्वासित लोगों के समुदाय के लिए प्रयुक्त सामूहिक शब्द है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֲדַבֵּר
  choice: तब मैंने … सुनाईं
  rationale: वय्यिक्तोल कथानक को आगे बढ़ाता है; ‘तब’ क्रमिकता व्यक्त करता है। हिंदी में ‘बातें सुनाईं’ बोलने और श्रोताओं तक संदेश पहुँचाने का स्वाभाविक रूप है।
- source_word: הַגּוֹלָה
  choice: निर्वासित लोगों
  rationale: इब्रानी एकवचन संज्ञा यहाँ निर्वासन में रह रहे समुदाय के लिए सामूहिक अर्थ में प्रयुक्त है। बहुवचन हिंदी में स्पष्ट और स्वाभाविक है।
- source_word: אֵת כָּל דִּבְרֵי
  choice: वे सारी बातें
  rationale: דְּבָרִים का अर्थ ‘वचन’, ‘बातें’ या ‘विषय’ हो सकता है। इस प्रसंग में ‘सारी बातें’ स्वाभाविक हिंदी है और संदेश की संपूर्णता बनाए रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: चार अक्षरों वाले व्यक्तिगत ईश्वरीय नाम को उपाधि से बदलने के बजाय हिंदी लिपि में लिप्यंतरित किया गया है।
- source_word: אֲשֶׁר הֶרְאַנִי
  choice: जो उसने मुझे दिखाई थीं
  rationale: ראה का हिफ़ईल रूप ‘दिखाना’ व्यक्त करता है। ‘दिखाई थीं’ पूर्व में प्राप्त दर्शन और उसके बाद किए गए वर्णन का क्रम स्पष्ट करता है तथा मूल के दृश्य-प्रकाशन वाले कथन को बनाए रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: प्रभु / यहोवा
  rationale: मूल पाठ व्यक्तिगत ईश्वरीय नाम का प्रयोग करता है। ‘याहवे’ उसे किसी उपाधि से प्रतिस्थापित किए बिना आधुनिक हिंदी में निकटतम प्रचलित लिप्यंतरण देता है।
- issue: ‘बातें’ जिन्हें नबी को ‘दिखाया’ गया
  choice: मूल का दृश्य-भाषिक तनाव बनाए रखा गया
  alternative: जो कुछ उसने मुझे दर्शन में बताया था
  rationale: पाठ असामान्य रूप से ‘याहवे की बातें’ कहता है जिन्हें नबी को ‘दिखाया’ गया। इसे अधिक व्याख्यात्मक बनाकर केवल मौखिक संदेश या केवल दर्शन नहीं बनाया गया।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘सुनाईं’ सामान्य हिंदी में संदेश कह सुनाने का भाव देता है, जबकि ‘दिखाई थीं’ मूल पाठ के दर्शन-संबंधी शब्द को स्पष्ट रूप से सुरक्षित रखता है।
