base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/011/016.yaml
  text: 'Therefore say[a], ‘Thus says the Lord GOD: Though I removed them far off among the nations, and though I scattered them among the lands, yet I became for them a little sanctuary in the lands where they had gone.’'
translation:
  language: hi
  text: 'इसलिए तू कह, ‘प्रभु यहोवा यों कहता है: भले ही मैंने उन्हें अन्य जातियों के बीच दूर भेज दिया और देशों में तितर-बितर कर दिया, फिर भी जिन देशों में वे गए, वहाँ मैं उनके लिए एक छोटा-सा पवित्रस्थान बन गया[a]।’'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मैं उनके लिए थोड़े समय के लिए पवित्रस्थान बन गया।” इब्रानी वाक्यांश का अर्थ छोटा अथवा सीमित पवित्रस्थान भी हो सकता है, और कुछ समय के लिए पवित्रस्थान भी।
    reason: alternative_reading
lexical_decisions:
- source_word: לָכֵן אֱמֹר
  choice: इसलिए तू कह
  rationale: निष्कर्षसूचक לָכֵן और नबी को दिए गए एकवचन आदेश אֱמֹר—दोनों को स्पष्ट और स्वाभाविक हिन्दी में रखा गया है।
- source_word: כֹּה אָמַר אֲדֹנָי יְהוִה
  choice: प्रभु यहोवा यों कहता है
  rationale: परंपरागत नबूवतीय संदेश-सूत्र को संक्षिप्त रूप में रखा गया है और אֲדֹנָי तथा व्यक्तिगत ईश्वरीय नाम יְהוִה—दोनों को सुरक्षित रखा गया है।
- source_word: כִּי ... וְכִי
  choice: भले ही ... और
  rationale: दोनों उपवाक्य अगले कथन के साथ रियायती विरोध व्यक्त करते हैं; हिन्दी में अनावश्यक पुनरुक्ति से बचते हुए यह संबंध स्वाभाविक रूप से व्यक्त होता है।
- source_word: הִרְחַקְתִּים בַּגּוֹיִם
  choice: मैंने उन्हें अन्य जातियों के बीच दूर भेज दिया
  rationale: हिफ़ील रूप में परमेश्वर की क्रियाशीलता और दूरी का भाव बना रहता है; בַּגּוֹיִם को निर्वासन के संदर्भ में ‘अन्य जातियों के बीच’ कहा गया है।
- source_word: הֲפִיצוֹתִים בָּאֲרָצוֹת
  choice: देशों में तितर-बितर कर दिया
  rationale: निर्वासन से जुड़े बिखराव और बहुवचन ‘देशों’ को स्पष्ट, प्रचलित हिन्दी में व्यक्त किया गया है।
- source_word: וָאֱהִי לָהֶם
  choice: फिर भी ... मैं उनके लिए ... बना
  rationale: वाव का प्रसंगगत विरोध ‘फिर भी’ से व्यक्त किया गया है और wayyiqtol का भूतकालीन ‘बना’ बनाए रखा गया है।
- source_word: לְמִקְדָּשׁ מְעַט
  choice: एक छोटा-सा पवित्रस्थान
  rationale: מְעַט का स्थानिक/परिमाणात्मक अर्थ मुख्य पाठ में रखा गया है; संभावित कालगत अर्थ पादटिप्पणी में सुरक्षित है।
- source_word: בָּאֲרָצוֹת אֲשֶׁר בָּאוּ שָׁם
  choice: जिन देशों में वे गए, वहाँ
  rationale: इब्रानी संबंधवाचक संरचना और स्थानसूचक שָׁם को सहज हिन्दी क्रम में व्यक्त किया गया है।
theological_decisions:
- issue: אֲדֹנָי יְהוִה में ईश्वरीय नाम का अनुवाद
  choice: प्रभु यहोवा
  alternative: प्रभु परमेश्वर
  rationale: ‘यहोवा’ वाचा-संबंधी व्यक्तिगत नाम को सामने रखता है, जबकि ‘प्रभु’ אֲדֹנָי की उपाधि को सुरक्षित रखता है।
- issue: לְמִקְדָּשׁ מְעַט में מְעַט का अर्थ
  choice: एक छोटा-सा पवित्रस्थान
  alternative: थोड़े समय के लिए पवित्रस्थान
  rationale: मुख्य पाठ में छोटा अथवा सीमित, पर वास्तविक, पवित्रस्थान होने का सामान्य अर्थ रखा गया है; इब्रानी की संभावित कालगत व्याख्या को पादटिप्पणी में देकर अस्पष्टता सुरक्षित रखी गई है।
- issue: निर्वासन में परमेश्वर के पवित्रस्थान बनने का कथन
  choice: मैं उनके लिए ... पवित्रस्थान बना
  alternative: मैं उनके लिए ... पवित्रस्थान था
  rationale: क्रिया וָאֱהִי के घटनात्मक भूतकालीन बल को बनाए रखा गया है और कथन को केवल सामान्य, कालातीत उपस्थिति में नहीं बदला गया।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘तू’ नबी को संबोधित एकवचन आदेश को दर्शाता है; ‘तितर-बितर’ निर्वासन के बिखराव का सहज हिन्दी मुहावरा है।
