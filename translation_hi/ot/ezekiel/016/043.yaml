reference: Ezekiel 16:43
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: יַ֗עַן אֲשֶׁ֤ר לֹֽא זכרתי אֶת יְמֵ֣י נְעוּרַ֔יִ/ךְ וַ/תִּרְגְּזִי לִ֖/י בְּ/כָל אֵ֑לֶּה וְ/גַם אֲנִ֨י הֵ֜א דַּרְכֵּ֣/ךְ בְּ/רֹ֣אשׁ נָתַ֗תִּי נְאֻם֙ אֲדֹנָ֣/י יְהוִ֔ה וְ/לֹ֤א עשיתי אֶת הַ/זִּמָּ֔ה עַ֖ל כָּל תּוֹעֲבֹתָֽיִ/ךְ־־־־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/016/043.yaml
  text: Because you did not remember the days of your youth[a], but enraged me with all these things, therefore I also have put your way on your own head, declares the Lord GOD, and you have not committed lewdness beyond all your abominations.
translation:
  language: hi
  text: क्योंकि तूने अपनी जवानी के दिनों को याद नहीं किया, बल्कि इन सब कामों से मुझे क्रोधित किया, इसलिए देख, मैंने भी तेरे चालचलन का फल तेरे ही सिर पर डाल दिया है—प्रभु यहोवा की घोषणा है। क्या तूने अपने सभी घिनौने कामों के साथ यह घोर अश्लीलता भी नहीं की?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इस पद के अंतिम शब्दों का इब्रानी पाठ कठिन है। उन्हें इस प्रकार भी समझा जा सकता है: “और तूने अपने सभी घिनौने कामों से बढ़कर यह घोर अश्लीलता की।” प्राप्त क्रिया-रूप अक्षरशः “मैंने किया” भी पढ़ा जा सकता है, जिससे वाक्य का अर्थ और अधिक अनिश्चित हो जाता है।'
    reason: कठिन इब्रानी पाठ, संभावित वैकल्पिक पठन और कर्ता की अस्पष्टता को सुरक्षित रखना।
lexical_decisions:
- source_word: יַעַן אֲשֶׁר
  choice: क्योंकि
  rationale: यह पद न्याय का कारण बताता है; आधुनिक हिन्दी में ‘क्योंकि’ कारणसूचक बल को स्वाभाविक रूप से व्यक्त करता है।
- source_word: לֹא זכרתי אֶת יְמֵי נְעוּרַיִךְ
  choice: तूने अपनी जवानी के दिनों को याद नहीं किया
  rationale: संदर्भ यरूशलेम को स्त्रीलिंग एकवचन में संबोधित करता है। ‘याद नहीं किया’ नैतिक और वाचागत विस्मरण का भाव खुला रखता है।
- source_word: וַתִּרְגְּזִי לִי
  choice: बल्कि ... मुझे क्रोधित किया
  rationale: רגז यहाँ उत्तेजित या कुपित करने का अर्थ देता है। ‘बल्कि’ पिछले विस्मरण और उसके विपरीत उकसाने वाले आचरण का संबंध स्पष्ट करता है।
- source_word: בְּכָל אֵלֶּה
  choice: इन सब कामों से
  rationale: करणवाचक בְ और पिछले वर्णित कृत्यों का संदर्भ सहज हिन्दी में व्यक्त होता है।
- source_word: וְגַם אֲנִי הֵא
  choice: इसलिए देख, मैंने भी
  rationale: ‘इसलिए’ प्रत्युत्तरस्वरूप परिणाम, ‘देख’ הֵא का ध्यानाकर्षक बल, और ‘भी’ प्रतिदान की समानता को बनाए रखते हैं।
- source_word: דַּרְכֵּךְ בְּרֹאשׁ נָתַתִּי
  choice: तेरे चालचलन का फल तेरे ही सिर पर डाल दिया है
  rationale: शाब्दिक रूपक और न्यायिक मुहावरे—अपने आचरण का परिणाम स्वयं भुगतना—दोनों को स्पष्ट करने के लिए ‘फल’ जोड़ा गया है; ‘तेरे ही सिर पर’ प्रतिफल के बल को सुरक्षित रखता है।
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: प्रभु यहोवा की घोषणा है
  rationale: नबी की घोषणात्मक शैली को रखा गया है और יהוה को उसके व्यक्तिगत वाचा-नाम ‘यहोवा’ से व्यक्त किया गया है।
- source_word: הַזִּמָּה
  choice: घोर अश्लीलता
  rationale: זִמָּה अध्याय के लैंगिक और नैतिक संदर्भ में निर्लज्ज, दुराचारी कृत्य को सूचित करता है; यह पद की तीव्रता को सामान्य ‘दुष्टता’ से अधिक ठीक रखता है।
- source_word: עַל כָּל תּוֹעֲבֹתָיִךְ
  choice: अपने सभी घिनौने कामों के साथ ... भी
  rationale: 'कठिन עַל को यहाँ योगात्मक अर्थ में लिया गया है: पहले से वर्णित घिनौने कामों के साथ एक और घोर कृत्य। अनिश्चितता पादटिप्पणी में बताई गई है।'
theological_decisions:
- issue: אֲדֹנָי יְהוִה में परमेश्वर के नाम का अनुवाद
  choice: प्रभु यहोवा
  alternative: प्रभु परमेश्वर
  rationale: ‘प्रभु’ אֲדֹנָי की उपाधि और ‘यहोवा’ יהוה के वाचा-नाम के भेद को बनाए रखता है।
- issue: अंतिम उपवाक्य का कर्ता और वाक्य-प्रकार
  choice: 'यरूशलेम को संबोधित आलंकारिक प्रश्न: ‘क्या तूने ... नहीं की?’'
  alternative: 'परमेश्वर के कथन के रूप में: ‘और मैंने ... नहीं किया’'
  rationale: व्यापक संदर्भ में यरूशलेम के अपराध का आरोप जारी है, और व्यंजन-पाठ को प्रायः द्वितीय स्त्रीलिंग संबोधन के अनुसार समझा या सुधारा जाता है। फिर भी प्राप्त इब्रानी रूप प्रथम पुरुष जैसा दिखता है, इसलिए वैकल्पिक संभावना को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सीधी हिन्दी अपनाई गई है। यरूशलेम के लिए निकट, आरोपात्मक एकवचन ‘तू/तेरे’ रखा गया है, क्योंकि मूल पाठ लगातार स्त्रीलिंग एकवचन संबोधन करता है। ‘घिनौने काम’ सामान्य पाठक के लिए स्वाभाविक है और תּוֹעֵבָה की धार्मिक-नैतिक तीव्रता बनाए रखता है।
