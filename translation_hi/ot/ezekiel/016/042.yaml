reference: Ezekiel 16:42
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/הֲנִחֹתִ֤י חֲמָתִ/י֙ בָּ֔/ךְ וְ/סָ֥רָה קִנְאָתִ֖/י מִמֵּ֑/ךְ וְ/שָׁ֣קַטְתִּ֔י וְ/לֹ֥א אֶכְעַ֖ס עֽוֹד׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/016/042.yaml
  text: So I will satisfy my wrath against you[a], and my jealousy will turn away from you[b]; then I will be quiet and no longer be angry.
translation:
  language: hi
  text: तब मैं अपना प्रकोप तुम पर पूरी तरह उतार दूँगा[a], और मेरी ईर्ष्या तुमसे दूर हो जाएगी[b]। तब मैं शांत हो जाऊँगा और फिर क्रोधित नहीं होऊँगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “मैं अपने प्रकोप को तुममें ठहराऊँगा।” भाव यह है कि प्रकोप तुम पर दंड के रूप में पूरी तरह उतरकर समाप्त हो जाएगा।
    reason: lexical_alternative
  - marker: b
    text: या “मेरा उत्साह तुमसे दूर हो जाएगा।” हिब्रू शब्द का अर्थ “ईर्ष्या” या “उत्साह” हो सकता है; इस अध्याय की वैवाहिक-वाचा की उपमा में “ईर्ष्या” अधिक उपयुक्त है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַהֲנִחֹתִי חֲמָתִי בָּךְ
  choice: मैं अपना प्रकोप तुम पर पूरी तरह उतार दूँगा
  rationale: נוח के हिफ़ील रूप का शाब्दिक भाव प्रकोप को टिकाने या विश्राम देने का है; इस न्याय-संदर्भ में आशय है कि प्रकोप दंड के रूप में पूरी तरह उंडेलकर समाप्त हो जाएगा। हिंदी में यह अभिव्यक्ति इस अर्थ को स्वाभाविक रूप से व्यक्त करती है और इसे केवल शांत हो जाने के अर्थ में नहीं ले जाती।
- source_word: חֲמָתִי
  choice: मेरा प्रकोप
  rationale: חֵמָה तीव्र, दहकते क्रोध को दर्शाता है। ‘प्रकोप’ आधुनिक, गरिमापूर्ण हिंदी में इसकी न्यायिक और वाचा-संबंधी गंभीरता बनाए रखता है।
- source_word: קִנְאָתִי
  choice: मेरी जलन
  rationale: קִנְאָה का अर्थ ‘जलन’ या ‘उत्साह’ हो सकता है। अध्याय की वैवाहिक-वाचा की उपमा में विश्वासघात पर पति की जलन का भाव प्रमुख है; ‘जलन’ आधुनिक हिंदी में इसे ‘ईर्ष्या’ की अपेक्षा अधिक स्वाभाविक ढंग से व्यक्त करती है।
- source_word: וְסָרָה ... מִמֵּךְ
  choice: तुमसे दूर हो जाएगी
  rationale: סור अलग हो जाने या हट जाने को दर्शाता है। यह अनुवाद स्रोत के अलगाव के भाव को सहज हिंदी में बनाए रखता है।
- source_word: וְשָׁקַטְתִּי
  choice: मैं शांत हो जाऊँगा
  rationale: שקט अशांति के बाद शांत या स्थिर हो जाने का भाव देता है। ‘शांत हो जाऊँगा’ वर्तमान हिंदी में स्वाभाविक है और अगले वाक्य में क्रोध के समाप्त होने से जुड़ता है।
- source_word: וְלֹא אֶכְעַס עוֹד
  choice: और फिर क्रोधित नहीं होऊँगा
  rationale: כעס क्रोधित होने या रोष में आने को दर्शाता है। यह रूप स्पष्ट और स्वाभाविक है तथा עוֹד के ‘फिर/आगे’ भाव को व्यक्त करता है।
theological_decisions:
- issue: वैवाहिक-वाचा और न्याय के संदर्भ में परमेश्वर के भावों का अनुवाद
  choice: ‘प्रकोप’ और ‘जलन’ को वास्तविक वाचा-संबंधी तथा न्यायिक शब्दों के रूप में बनाए रखा गया है।
  alternative: חֵמָה के लिए ‘कोप/क्रोध’ और קִנְאָה के लिए ‘उत्साह’ या ‘ईर्ष्या’ लिया जा सकता है।
  rationale: अध्याय परमेश्वर और यरूशलेम के संबंध को वैवाहिक विश्वासघात की उपमा में प्रस्तुत करता है। इसलिए קִנְאָה को सामान्य ‘उत्साह’ बनाकर भाव को नरम नहीं किया गया; साथ ही ‘जलन’ को मानवीय हीन ईर्ष्या के रूप में समझाना भी आवश्यक नहीं माना गया। ‘प्रकोप’ दंड और नैतिक न्याय की शक्ति को बनाए रखता है।
- issue: प्रकोप के ‘विश्राम’ का अर्थ
  choice: इसे दंड के रूप में प्रकोप के पूरी तरह उतर जाने और इस प्रकार समाप्त होने के रूप में व्यक्त किया गया है।
  alternative: अधिक शाब्दिक रूप से ‘मैं अपने प्रकोप को तुममें विश्राम दूँगा’ कहा जा सकता है।
  rationale: 'हिब्रू प्रयोग में वास्तविक तनाव बना रहता है: प्रकोप केवल अपने आप शांत नहीं होता, बल्कि संबोधित स्त्री पर आकर ठहरता/पूरा होता है। मुख्य पाठ इसे स्वाभाविक हिंदी में व्यक्त करता है और पादटिप्पणी शाब्दिक रूप को सुरक्षित रखती है।'
translation_notes:
  register: भाषा आधुनिक मानक हिंदी की, गरिमापूर्ण और सामान्य पाठकों के लिए सहज रखी गई है। ‘जलजलाहट’ जैसे अपेक्षाकृत पुराने धार्मिक शब्द से बचते हुए ‘जलन’ चुना गया है। दो छोटे वाक्यों से प्रकोप के उतरने और उसके बाद शांति आने का क्रम स्पष्ट होता है।
