  text: לָ֠/כֵן הִנְ/נִ֨י מְקַבֵּ֤ץ אֶת כָּל מְאַהֲבַ֨יִ/ךְ֙ אֲשֶׁ֣ר עָרַ֣בְתְּ עֲלֵי/הֶ֔ם וְ/אֵת֙ כָּל אֲשֶׁ֣ר אָהַ֔בְתְּ עַ֖ל כָּל אֲשֶׁ֣ר שָׂנֵ֑את וְ/קִבַּצְתִּי֩ אֹתָ֨/ם עָלַ֜יִ/ךְ מִ/סָּבִ֗יב וְ/גִלֵּיתִ֤י עֶרְוָתֵ/ךְ֙ אֲלֵ/הֶ֔ם וְ/רָא֖וּ אֶת כָּל עֶרְוָתֵֽ/ךְ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/016/037.yaml
  text: Therefore[a], behold, I am gathering all your lovers with whom you found pleasure, and all whom you loved, along with all whom you hated; and I will gather them against you from every side, and I will uncover your nakedness to them[c][b], and they will see all your nakedness.
translation:
  language: hi
  text: इसलिए देख, मैं तेरे उन सब प्रेमियों को इकट्ठा कर रहा हूँ जिनसे तूने सुख पाया, और उन सभी को जिनसे तूने प्रेम किया, साथ ही उन सभी को जिनसे तूने घृणा की। मैं उन्हें चारों ओर से तेरे विरुद्ध इकट्ठा करूँगा और उनके सामने तेरी नग्नता प्रकट करूँगा[a]; तब वे तेरी सारी नग्नता देखेंगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “नग्नता प्रकट करना” भविष्यद्वाणी में सार्वजनिक रूप से बेनकाब किए जाने और अपमानित होने की भाषा है।
    reason: cultural_note
lexical_decisions:
- source_word: לָכֵן
  choice: इसलिए
  rationale: यह निष्कर्षसूचक अव्यय पिछले अभियोग के फलस्वरूप आने वाले न्याय को प्रस्तुत करता है; ‘इसलिए’ आधुनिक हिन्दी में स्वाभाविक रहते हुए न्यायिक बल बनाए रखता है।
- source_word: הִנְנִי מְקַבֵּץ
  choice: देख, मैं ... इकट्ठा करने जा रहा हूँ
  rationale: הִנְנִי के ध्यानाकर्षक और गंभीर स्वर तथा कृदन्त से व्यक्त आसन्न और निश्चित कार्रवाई—दोनों को यह हिन्दी वाक्यांश स्वाभाविक रूप से संप्रेषित करता है।
- source_word: מְאַהֲבַיִךְ
  choice: तेरे ... प्रेमियों
  rationale: अध्याय के वैवाहिक और यौन रूपक को सुरक्षित रखने के लिए ठोस संबंधसूचक शब्द चुना गया है; इसे केवल ‘सहयोगी’ कहना रूपक को अनुचित रूप से राजनीतिक बना देता।
- source_word: אֲשֶׁר עָרַבְתְּ עֲלֵיהֶם
  choice: जिनसे तूने सुख पाया
  rationale: ערב यहाँ प्रसन्नता या सुख पाने का भाव देता है। यह चयन संबंधपरक और संकेतात्मक अर्थ रखता है, बिना अनावश्यक विस्तार के।
- source_word: עַל כָּל אֲשֶׁר שָׂנֵאת
  choice: साथ ही उन सबको जिनसे तूने घृणा की
  rationale: עַל यहाँ सूची को विस्तृत करके प्रेम किए और घृणा किए—दोनों वर्गों को सम्मिलित करता है।
- source_word: וְקִבַּצְתִּי אֹתָם עָלַיִךְ מִסָּבִיב
  choice: मैं उन्हें चारों ओर से तेरे विरुद्ध इकट्ठा करूँगा
  rationale: न्याय के प्रसंग में עָלַיִךְ विरोधात्मक ‘तेरे विरुद्ध’ है और מִסָּבִיב का स्वाभाविक अर्थ ‘चारों ओर से’ है।
- source_word: וְגִלֵּיתִי עֶרְוָתֵךְ אֲלֵהֶם
  choice: उनके सामने तेरा नंगापन खोल दूँगा
  rationale: ‘उनके सामने’ हिन्दी में सार्वजनिक अनावरण का आशय स्पष्ट करता है; ‘नंगापन खोलना’ मूल की ठोस लज्जा और न्याय संबंधी भाषा को बनाए रखता है।
- source_word: וְרָאוּ אֶת כָּל עֶרְוָתֵךְ
  choice: तब वे तेरा पूरा नंगापन देखेंगे
  rationale: עֶרְוָה की पुनरावृत्ति और כָּל के पूर्णता-बोध को बनाए रखने के लिए ‘पूरा नंगापन’ कहा गया है।
theological_decisions:
- issue: यरूशलेम के न्याय के लिए भविष्यद्वाणी में प्रयुक्त यौन-लज्जा रूपक
  choice: ‘प्रेमियों’ और ‘नंगापन’ की ठोस भाषा को बनाए रखा गया है।
  alternative: इसे अमूर्त रूप से ‘सहयोगियों’ और ‘अपमान’ के रूप में प्रस्तुत करना।
  rationale: अध्याय वैवाहिक और यौन बिंबों द्वारा वाचा के प्रति विश्वासघात तथा सार्वजनिक न्याय को चित्रित करता है। मूल रूपक को बनाए रखना पाठ के धार्मिक और आलंकारिक तनाव को सुरक्षित रखता है, जबकि अतिरिक्त सांप्रदायिक व्याख्या नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी का गंभीर, भविष्यद्वाणी-सुलभ स्वर रखा गया है। स्त्रीलिंग एकवचन के आत्मीय ‘तू/तेरा’ रूप मूल में यरूशलेम को संबोधित स्त्रीलिंग एकवचन को दर्शाते हैं। शब्दावली स्पष्ट है, पर मूल की कठोर और लज्जासूचक छवि को नरम नहीं किया गया।
