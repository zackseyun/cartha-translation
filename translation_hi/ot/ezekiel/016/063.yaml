language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: לְמַ֤עַן תִּזְכְּרִי֙ וָ/בֹ֔שְׁתְּ וְ/לֹ֨א יִֽהְיֶה לָּ֥/ךְ עוֹד֙ פִּתְח֣וֹן פֶּ֔ה מִ/פְּנֵ֖י כְּלִמָּתֵ֑/ךְ בְּ/כַפְּרִ/י לָ/ךְ֙ לְ/כָל אֲשֶׁ֣ר עָשִׂ֔ית נְאֻ֖ם אֲדֹנָ֥/י יְהוִֽה־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/016/063.yaml
  text: so that you may remember and be ashamed[a], and no longer have any opening of the mouth because of your disgrace, when I make atonement for you for all that you have done[b], declares the Lord GOD.
translation:
  language: hi
  text: ताकि तुम स्मरण करो और लज्जित हो, और अपने अपमान के कारण फिर कभी मुँह खोलने का कोई आधार न पाओ[a], जब मैं तुम्हारे लिए तुम्हारे किए हुए सब कामों का प्रायश्चित करूँगा[b]—प्रभु यहोवा की यह घोषणा है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप में, “मुँह का खुलना”; अर्थात बोलने का कोई आधार या साहस।
    reason: lexical_alternative
  - marker: b
    text: या, “जब मैं तुम्हारे लिए प्रायश्चित करूँ।” इब्रानी क्रिया में केवल सामान्य क्षमा नहीं, बल्कि प्रायश्चित और मेल-मिलाप की अर्थवत्ता भी है।
    reason: lexical_alternative
lexical_decisions:
- source_word: לְמַעַן תִּזְכְּרִי
  choice: ताकि तुम स्मरण करो
  rationale: לְמַעַן उद्देश्य अथवा परिणाम का बोध कराता है। स्त्रीलिंग एकवचन क्रिया उस यरूशलेम को संबोधित करती है जिसे स्त्री के रूप में व्यक्त किया गया है; हिन्दी में स्वाभाविक संबोधन के लिए ‘तुम’ रखा गया है।
- source_word: וָבֹשְׁתְּ
  choice: और लज्जित हो
  rationale: בוש यहाँ भीतर अनुभव की जाने वाली लज्जा को व्यक्त करता है; ‘लज्जित हो’ अनावश्यक रूप से बाहरी दंड या निष्क्रिय अपमान का अर्थ नहीं जोड़ता।
- source_word: פִּתְחוֹן פֶּה
  choice: मुँह खोलने का कोई आधार
  rationale: शाब्दिक चित्र ‘मुँह का खुलना’ है और मुहावरे का आशय बोलने का आधार, अवसर या साहस होना है। हिन्दी वाक्यांश चित्र और अर्थ दोनों को बनाए रखता है।
- source_word: מִפְּנֵי כְּלִמָּתֵךְ
  choice: अपने अपमान के कारण
  rationale: מִפְּנֵי को प्रसंग में कारणसूचक और כְּלִמָּה को सार्वजनिक लज्जा अथवा अपमान के रूप में लिया गया है।
- source_word: בְּכַפְּרִי לָךְ
  choice: जब मैं तुम्हारे लिए प्रायश्चित करूँ
  rationale: בְּ उपसर्ग को कालसूचक ‘जब’ माना गया है। כפר की प्रायश्चित और मेल-मिलाप से जुड़ी धार्मिक अर्थवत्ता को केवल ‘क्षमा करना’ कहकर हल्का नहीं किया गया।
- source_word: לְכָל אֲשֶׁר עָשִׂית
  choice: तुम्हारे किए हुए सब कामों के लिए
  rationale: यह यरूशलेम के समस्त पूर्व कर्मों और उनसे जुड़े दोष की व्यापकता को व्यक्त करता है।
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: प्रभु यहोवा की यह घोषणा है
  rationale: נְאֻם भविष्यद्वक्ताओं की घोषणा का सूत्र है। אֲדֹנָי को ‘प्रभु’ और יהוה को वाचा-नाम ‘यहोवा’ के रूप में रखा गया है।
theological_decisions:
- issue: ईश्वरीय क्षमा और पुनर्स्थापना के प्रसंग में כפר का अनुवाद
  choice: प्रायश्चित करूँ
  alternative: क्षमा करूँ
  rationale: मूल क्रिया प्रायश्चित, दोष-निवारण और मेल-मिलाप की अर्थवत्ता रखती है। पद यह स्पष्ट नहीं करता कि यह किस विधि से होगा, इसलिए उस अस्पष्टता को बनाए रखते हुए केवल सामान्य क्षमा कहना उचित नहीं है।
- issue: אֲדֹנָי יְהוִה में परमेश्वर के नाम का रूप
  choice: प्रभु यहोवा
  alternative: सर्वशक्तिमान प्रभु
  rationale: मूल पाठ में उपाधि אֲדֹנָי और वाचा-नाम יהוה दोनों हैं। ‘प्रभु यहोवा’ दोनों को अलग-अलग सुरक्षित रखता है और ‘सर्वशक्तिमान’ जैसा ऐसा अर्थ नहीं जोड़ता जो इस पद के शब्दों में नहीं है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। यरूशलेम को स्त्री के रूप में संबोधित करने वाले इब्रानी एकवचन के लिए हिन्दी में स्वाभाविक ‘तुम’ प्रयुक्त है। ‘मुँह खोलना’ मूल मुहावरे का चित्र बचाता है, जबकि ‘कोई आधार न पाओ’ उसका आशय स्पष्ट करता है।
