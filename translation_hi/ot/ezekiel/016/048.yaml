  text: חַי אָ֗נִי נְאֻם֙ אֲדֹנָ֣/י יְהוִ֔ה אִם עָֽשְׂתָה֙ סְדֹ֣ם אֲחוֹתֵ֔/ךְ הִ֖יא וּ/בְנוֹתֶ֑י/הָ כַּ/אֲשֶׁ֣ר עָשִׂ֔ית אַ֖תְּ וּ/בְנוֹתָֽיִ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/016/048.yaml
  text: As I live[a], declares the Lord GOD, your sister Sodom, she and her daughters[b], has not done as you and your daughters have done.
translation:
  language: hi
  text: 'प्रभु यहोवा की यह घोषणा है: “मेरे जीवन की शपथ, तेरी बहन सदोम—वह और उसकी बेटियाँ[a]—ने वैसा नहीं किया जैसा तूने और तेरी बेटियों ने किया है।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ “बेटियाँ” सदोम और यरूशलेम से जुड़ी बस्तियों या समुदायों को दर्शाती हैं।
    reason: cultural_note
lexical_decisions:
- source_word: חַי אָ֗נִי
  choice: मेरे जीवन की शपथ
  rationale: यह एक गंभीर ईश्वरीय शपथ-सूत्र है। यह हिन्दी में स्वाभाविक है और परमेश्वर के अपने जीवन की शपथ खाने का बल बनाए रखता है।
- source_word: נְאֻם
  choice: की यह घोषणा है
  rationale: भविष्यद्वाणी के प्रामाणिक कथन-सूत्र को स्पष्ट और गरिमापूर्ण आधुनिक हिन्दी में व्यक्त करता है।
- source_word: אֲדֹנָי יְהוִה
  choice: प्रभु यहोवा
  rationale: अदोनाय को ‘प्रभु’ और परमेश्वर के विशिष्ट नाम יהוה को ‘यहोवा’ के रूप में अलग-अलग पहचानते हुए संयुक्त उपाधि को सुरक्षित रखता है।
- source_word: אִם
  choice: नहीं किया
  rationale: शपथ-सूत्र के बाद אִם यहाँ साधारण शर्त नहीं, बल्कि प्रबल निषेध व्यक्त करता है; इसलिए निहित निषेध को हिन्दी में स्पष्ट किया गया है।
- source_word: סְדֹם אֲחוֹתֵךְ
  choice: तेरी बहन सदोम
  rationale: पूरे अध्याय में प्रयुक्त पारिवारिक रूपक को बनाए रखते हुए स्वाभाविक हिन्दी शब्द-क्रम देता है।
- source_word: הִיא וּבְנוֹתֶיהָ
  choice: उसने और उसकी बेटियों ने
  rationale: स्वतंत्र सर्वनाम הִיא के बल को ‘उसने’ से सुरक्षित रखा गया है; ‘बेटियाँ’ सदोम से जुड़ी बस्तियों या समुदायों का रूपक है।
- source_word: כַּאֲשֶׁר עָשִׂית אַתְּ וּבְנוֹתָיִךְ
  choice: वैसा ... जैसा तूने और तेरी बेटियों ने किया है
  rationale: यरूशलेम को किए गए स्त्रीलिंग एकवचन सीधे संबोधन और दोनों समूहों के बीच तुलना को बनाए रखता है।
theological_decisions:
- issue: संयुक्त उपाधि אֲדֹנָי יְהוִה में परमेश्वर के नाम का अनुवाद
  choice: प्रभु यहोवा
  alternative: प्रभु याहवे / परमेश्वर यहोवा
  rationale: मूल पाठ में विशिष्ट ईश्वरीय नाम सीधे उपस्थित है। ‘प्रभु यहोवा’ हिन्दी बाइबलीय प्रयोग में समझने योग्य है और אֲדֹנָי तथा יהוה के भेद को बनाए रखता है।
- issue: शपथ-रचना חַי־אני ... אִם का अर्थ
  choice: 'गंभीर शपथ के साथ प्रबल निषेध: ‘मेरे जीवन की शपथ ... नहीं किया’'
  alternative: 'शाब्दिक किंतु हिन्दी में अस्पष्ट: ‘मैं जीवित हूँ ... यदि सदोम ने किया’'
  rationale: इब्रानी शपथ-वाक्य में אִם निहित दंड-वाक्य के कारण जोरदार निषेध व्यक्त करता है। स्पष्ट निषेध अर्थ को सुरक्षित रखता है, जबकि पादटिप्पणी मूल रचना बताती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण भविष्यद्वाणी-शैली रखी गई है। यरूशलेम के लिए मूल का स्त्रीलिंग एकवचन निकट संबोधन ‘तू/तेरी’ बनाए रखा गया है। विराम-चिह्नों से बलसूचक ‘उसने और उसकी बेटियों ने’ को स्पष्ट किया गया है।
