source:
  edition: WLC
  text: וַ/תַּרְבִּ֧י אֶת תַּזְנוּתֵ֛/ךְ אֶל אֶ֥רֶץ כְּנַ֖עַן כַּשְׂדִּ֑ימָ/ה וְ/גַם בְּ/זֹ֖את לֹ֥א שָׂבָֽעַתְּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/016/029.yaml
  text: You multiplied your prostitution to the land of Canaan[a], to Chaldea; yet even with this you were not satisfied.
translation:
  language: hi
  text: तूने अपने वेश्याचार को कनान देश की ओर, कसदियों के देश तक[a] बढ़ाया; फिर भी इससे भी तू तृप्त न हुई।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘कनान देश की ओर, कसदियों की ओर’; या ‘कनान देश—अर्थात् कसदिया—की ओर।’ इब्रानी वाक्य-विन्यास संकुचित है। यह कनान को लाक्षणिक रूप से कसदिया/बेबीलोन से जोड़ सकता है, या कनान से कसदियों के देश तक विस्तार का वर्णन कर सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: וַתַּרְבִּי
  choice: तूने ... बढ़ाया
  rationale: हिफ़ील रूप यहाँ यरूशलेम के वेश्याचार को अधिक करने का भाव देता है। ‘बढ़ाया’ आधुनिक हिन्दी में स्वाभाविक और सीधा है।
- source_word: תַּזְנוּתֵךְ
  choice: अपने वेश्याचार को
  rationale: यह संज्ञा भविष्यद्वक्ता के रूपक में वेश्यावृत्ति-जैसी बेवफ़ाई को दर्शाती है। ‘वेश्याचार’ स्पष्ट यौन रूपक को बनाए रखता है और उसे केवल सामान्य ‘बेवफ़ाई’ नहीं बनाता।
- source_word: אֶל אֶרֶץ כְּנַעַן
  choice: कनान देश की ओर
  rationale: אֶל का दिशासूचक भाव ‘की ओर’ से और אֶרֶץ का अर्थ ‘देश’ से व्यक्त होता है।
- source_word: כַּשְׂדִּימָה
  choice: कसदियों के देश तक
  rationale: दिशासूचक प्रत्यय गति या विस्तार बताता है। ‘तक’ वेश्याचार के विस्तार का भाव स्वाभाविक हिन्दी में देता है, जबकि ‘कसदियों के देश’ भौगोलिक संकेत को स्पष्ट करता है।
- source_word: וְגַם בְּזֹאת
  choice: फिर भी इससे भी
  rationale: यह पद पिछले वर्णन के बावजूद असंतोष बने रहने पर बल देता है; ‘फिर भी इससे भी’ हिन्दी में विरोध और बल दोनों को व्यक्त करता है।
- source_word: לֹא שָׂבָעַתְּ
  choice: तू तृप्त न हुई
  rationale: שׂבע का अर्थ भर जाना या तृप्त होना है। स्त्रीलिंग संबोधन को ‘हुई’ बनाए रखता है और ‘तृप्त’ अतृप्त लालसा का उपयुक्त भाव देता है।
theological_decisions:
- issue: वाचा से बेवफ़ाई के लिए भविष्यद्वक्ता का यौन रूपक
  choice: स्पष्ट रूपक को ‘वेश्याचार’ के रूप में बनाए रखा गया है।
  alternative: ‘बेवफ़ाई’ या ‘यौन अनैतिकता’
  rationale: यहेजकेल जानबूझकर यरूशलेम की मूर्तिपूजा और राजनीतिक-धार्मिक बेवफ़ाई के लिए तीखा यौन रूपक इस्तेमाल करता है। सामान्य नैतिक शब्द मूल की प्रहारकता को कम कर देंगे।
- issue: कनान और कसदियों से संबंधित संकुचित वाक्य-विन्यास
  choice: मुख्य पाठ में इसे कनान की ओर से कसदियों के देश तक विस्तार के रूप में प्रस्तुत किया गया है।
  alternative: ‘कनान देश—अर्थात कसदियों के देश—की ओर’ अथवा ‘कनान देश की ओर, कसदियों के पास’
  rationale: इब्रानी पद-विन्यास संकुचित और बहुअर्थी है। चुना हुआ पाठ एक संभावित भौगोलिक विस्तार को पठनीय ढंग से व्यक्त करता है, पर अन्य वास्तविक संभावनाएँ पाद-टिप्पणी में सुरक्षित हैं।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु तीखा भविष्यद्वक्ताई स्वर रखा गया है। यरूशलेम के लिए मूल का स्त्रीलिंग एकवचन अनौपचारिक संबोधन ‘तू’ बनाए रखा गया है। ‘वेश्याचार’ मूल रूपक को बिना पुरातन शब्दावली के स्पष्ट रखता है।
