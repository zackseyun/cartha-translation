language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: לְ/כָל זֹנ֖וֹת יִתְּנוּ נֵ֑דֶה וְ/אַ֨תְּ נָתַ֤תְּ אֶת נְדָנַ֨יִ/ךְ֙ לְ/כָל מְאַֽהֲבַ֔יִ/ךְ וַ/תִּשְׁחֳדִ֣י אוֹתָ֗/ם לָ/ב֥וֹא אֵלַ֛יִ/ךְ מִ/סָּבִ֖יב בְּ/תַזְנוּתָֽיִ/ךְ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/016/033.yaml
  text: Men give a prostitute her payment, but you gave your gifts to all your lovers, and you bribed them to come to you from all around for your prostitutions.
translation:
  language: hi
  text: हर वेश्या को लोग उसका दाम देते हैं, पर तूने अपने सभी प्रेमियों को स्वयं उपहार दिए और उन्हें घूस दी कि वे चारों ओर से तेरे पास आएँ और तेरे साथ वेश्यागमन करें।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְכָל זֹנוֹת
  choice: हर वेश्या को
  rationale: बहुवचन के साथ כָל का सामान्य वितरणात्मक अर्थ स्वाभाविक हिन्दी में ‘हर वेश्या’ है।
- source_word: נֵדֶה
  choice: दाम
  rationale: यहाँ प्रसंग वेश्या को दिए जाने वाले भुगतान का है; ‘दाम’ सामान्य पाठक के लिए स्पष्ट और संक्षिप्त है।
- source_word: נְדָנַיִךְ
  choice: उपहार
  rationale: यह बहुवचन रूप स्त्री के अपने प्रेमियों को दिए गए उपहारों/भेंटों को दर्शाता है और पूर्ववर्ती भुगतान से जानबूझकर विपरीत स्थिति बनाता है।
- source_word: וַתִּשְׁחֳדִי
  choice: घूस दी
  rationale: मूल क्रिया में रिश्वत देकर किसी को प्रेरित करने का स्पष्ट भाव है; उसे नरम करके केवल ‘लुभाया’ नहीं किया गया।
- source_word: בְּתַזְנוּתָיִךְ
  choice: तेरे साथ वेश्यागमन करें
  rationale: शाब्दिक ‘तेरे वेश्यागमनों में’ हिन्दी में अस्वाभाविक है; यह रूप उसी यौन-वेश्यावृत्ति के रूपक को स्पष्ट रखते हुए वाक्य को स्वाभाविक बनाता है।
theological_decisions:
- issue: यहेजकेल के वैवाहिक-वेश्यावृत्ति रूपक की तीक्ष्णता
  choice: ‘वेश्या’, ‘घूस’ और ‘वेश्यागमन’ जैसे स्पष्ट शब्द बनाए रखे
  alternative: रूपक को ‘बेवफाई’, ‘लुभाना’ या ‘अनैतिकता’ जैसे नरम शब्दों में कहना
  rationale: मूल पद का आघात और उलटाव—सामान्य वेश्या भुगतान पाती है, पर यरूशलेम स्वयं प्रेमियों को भुगतान करती है—धार्मिक विश्वासघात की गंभीरता व्यक्त करते हैं; इसे संप्रदायगत व्याख्या जोड़े बिना सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी; संबोधित नगर के लिए मूल का स्त्रीलिंग एकवचन ‘तू/तेरे’ रखा गया है। भाषा स्पष्ट और गरिमापूर्ण है, पर मूल की कठोर रूपकात्मक शब्दावली को अनावश्यक रूप से शिष्ट नहीं बनाया गया।
