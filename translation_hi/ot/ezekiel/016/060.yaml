  edition: WLC
  text: וְ/זָכַרְתִּ֨י אֲנִ֧י אֶת בְּרִיתִ֛/י אוֹתָ֖/ךְ בִּ/ימֵ֣י נְעוּרָ֑יִ/ךְ וַ/הֲקִמוֹתִ֥י לָ֖/ךְ בְּרִ֥ית עוֹלָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/016/060.yaml
  text: But I myself will remember my covenant with you in the days of your youth[b][a], and I will establish for you an everlasting covenant.
translation:
  language: hi
  text: फिर भी मैं स्वयं तेरी जवानी के दिनों में तेरे साथ की अपनी वाचा को स्मरण करूँगा[b], और मैं तेरे लिए सदा की वाचा[a] स्थापित करूँगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘अनन्त वाचा।’
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में है, ‘तेरी जवानी के दिनों में तेरे साथ मेरी वाचा।’ यह पहले के वाचा-संबंध का स्मरण कराता है, पर यहाँ यह नहीं बताता कि कौन-सी विशिष्ट वाचा-व्यवस्था अभिप्रेत है।
    reason: cross_reference
lexical_decisions:
- source_word: וְזָכַרְתִּי
  choice: फिर भी ... स्मरण करूँगा
  rationale: संदर्भ में संयुक्त क्रिया का भाव भविष्यकालीन है। पूर्ववर्ती लज्जा और न्याय के बीच परमेश्वर के अनुग्रहपूर्ण कार्य की ओर मोड़ को दिखाने के लिए וְ को ‘फिर भी’ कहा गया है।
- source_word: אֲנִי
  choice: मैं स्वयं
  rationale: स्वतंत्र सर्वनाम क्रिया में निहित कर्ता पर अतिरिक्त बल देता है; ‘मैं स्वयं’ उस बल को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: בְּרִיתִי
  choice: अपनी वाचा
  rationale: בְּרִית का मानक धर्मग्रंथीय हिन्दी रूप ‘वाचा’ है और प्रथम पुरुष संबंधसूचक प्रत्यय को ‘अपनी’ से स्पष्ट रखा गया है।
- source_word: אֶת ... אוֹתָךְ
  choice: तेरे साथ बाँधी
  rationale: दोनों कर्मचिह्नों वाली इब्रानी रचना यहाँ वाचा के संबंध को व्यक्त करती है। हिन्दी में ‘तेरे साथ बाँधी’ इस संबंध को सहज बनाता है; ‘बाँधी’ वाचा करने के अर्थ को स्पष्ट करने वाला स्वाभाविक पूरक है।
- source_word: בִּימֵי נְעוּרַיִךְ
  choice: तेरी जवानी के दिनों में
  rationale: यह इब्रानी कालसूचक मुहावरे की छवि बनाए रखता है और अध्याय में पहले वर्णित यरूशलेम के आरम्भिक इतिहास की प्रतिध्वनि सुनाता है।
- source_word: וַהֲקִמוֹתִי
  choice: और ... स्थापित करूँगा
  rationale: הקים का हिफ़ील रूप वाचा के साथ उसे स्थापित या दृढ़ करने का भाव देता है। ‘स्थापित करूँगा’ स्पष्ट है और स्रोत की औपचारिकता बनाए रखता है।
- source_word: לָךְ
  choice: तेरे लिए
  rationale: पूर्वसर्ग का मूल भाव ‘तेरे लिए/तुझको’ है। ‘तेरे लिए’ उस संप्रदानात्मक अर्थ को बनाए रखता है और इसे सामान्य ‘तेरे साथ’ में नहीं मिला देता।
- source_word: בְּרִית עוֹלָם
  choice: सदा की वाचा
  rationale: यह वाचा की स्थायी और निरन्तर प्रकृति व्यक्त करने वाला प्रचलित पदबंध है। ‘अनन्त वाचा’ को वैकल्पिक अनुवाद के रूप में पादटिप्पणी में रखा गया है।
theological_decisions:
- issue: पुनर्स्थापना के संदर्भ में वाचा की पहचान
  choice: ‘उस वाचा’ और ‘सदा की वाचा’ को किसी विशिष्ट परवर्ती धर्मवैज्ञानिक व्यवस्था के रूप में पहचाने बिना रखा गया है।
  alternative: पहली को विशेष रूप से मूसा की वाचा अथवा दूसरी को विशेष रूप से नई वाचा कहना।
  rationale: यह पद यरूशलेम की जवानी के दिनों की वाचा को स्मरण करने और सदा की वाचा स्थापित करने की बात करता है, पर इस पद में स्वयं किसी विशिष्ट वाचा-व्यवस्था का नाम नहीं दिया गया। अनुवाद इस धर्मवैज्ञानिक तनाव को खुला रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज धर्मग्रंथीय शैली अपनाई गई है। स्त्रीलिंग यरूशलेम को सम्बोधित करने वाली इब्रानी द्वितीय पुरुष स्त्रीलिंग एकवचन रचना हिन्दी के ‘तेरी/तेरे’ रूपों में स्वाभाविक ढंग से व्यक्त है।
