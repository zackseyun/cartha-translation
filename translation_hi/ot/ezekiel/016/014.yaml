  text: וַ/יֵּ֨צֵא לָ֥/ךְ שֵׁ֛ם בַּ/גּוֹיִ֖ם בְּ/יָפְיֵ֑/ךְ כִּ֣י כָּלִ֣יל ה֗וּא בַּֽ/הֲדָרִ/י֙ אֲשֶׁר שַׂ֣מְתִּי עָלַ֔יִ/ךְ נְאֻ֖ם אֲדֹנָ֥/י יְהוִֽה׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/016/014.yaml
  text: And your fame went out among the nations because of your beauty[a], for it was perfect through my splendor that I had set upon you, declares the Lord GOD.
translation:
  language: hi
  text: तेरी सुंदरता के कारण राष्ट्रों में तेरी ख्याति फैल गई[a], क्योंकि तेरी सुंदरता मेरे वैभव से पूर्ण थी, जो मैंने तुझ पर रखा था—प्रभु यहोवा की यह घोषणा है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “राष्ट्रों में तेरा नाम निकल गया”; अर्थात तेरी ख्याति या प्रतिष्ठा दूर-दूर तक फैल गई।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא לָךְ שֵׁם
  choice: तेरी ख्याति फैल गई
  rationale: शाब्दिक रूप से ‘तेरा नाम निकल गया’; इस इब्रानी मुहावरे का आशय ख्याति या प्रतिष्ठा के दूर-दूर तक फैलने से है। हिंदी में ‘ख्याति फैल गई’ स्वाभाविक है।
- source_word: בַּגּוֹיִם
  choice: जाति-जाति में
  rationale: यह आसपास की अनेक जातियों या राष्ट्रों को सूचित करता है; ‘जाति-जाति में’ सहज और व्यापक हिंदी अभिव्यक्ति है।
- source_word: בְּיָפְיֵךְ
  choice: तेरी सुंदरता के कारण
  rationale: 'यहाँ בְּ कारण सूचित करता है: उसकी ख्याति उसकी सुंदरता के कारण फैली।'
- source_word: כָּלִיל
  choice: पूर्ण
  rationale: शब्द संपूर्णता या सिद्धता व्यक्त करता है। ‘पूर्ण’ मूल अर्थ बनाए रखता है और सुंदरता के संदर्भ में स्वाभाविक है।
- source_word: בַּהֲדָרִי
  choice: उस वैभव के कारण
  rationale: הָדָר वैभव, शोभा या महिमा का अर्थ देता है। संदर्भ में यरूशलेम की सुंदरता परमेश्वर द्वारा दिए गए वैभव से पूर्ण हुई थी।
- source_word: שַׂמְתִּי עָלַיִךְ
  choice: जिसे मैंने तुझ पर रखा था
  rationale: שׂים עַל के ठोस बिंब ‘ऊपर रखना’ को सुरक्षित रखा गया है; यह पिछले पदों के वस्त्र और आभूषण के रूपक से भी जुड़ता है।
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: प्रभु यहोवा की यह घोषणा है
  rationale: נְאֻם भविष्यद्वाणी की प्रामाणिक घोषणा का सूत्र है। אֲדֹנָי को ‘प्रभु’ और व्यक्तिगत दिव्य नाम יהוה को ‘यहोवा’ रूप में अलग-अलग सुरक्षित रखा गया है।
theological_decisions:
- issue: אֲדֹנָי יְהוִה में परमेश्वर के नाम का अनुवाद
  choice: प्रभु यहोवा
  alternative: प्रभु परमेश्वर
  rationale: मूल पाठ में उपाधि אֲדֹנָי के साथ वाचा का व्यक्तिगत नाम יהוה सीधे उपस्थित है। ‘प्रभु यहोवा’ दोनों को अलग रखता है और नाम को सामान्य उपाधि में नहीं बदलता।
- issue: सुंदरता की पूर्णता का स्रोत
  choice: वह उस वैभव के कारण पूर्ण थी जिसे मैंने तुझ पर रखा था
  alternative: तू मेरे दिए वैभव के कारण पूर्ण रूप से सुंदर थी
  rationale: स्त्रीलिंग ‘वह’ को निकटवर्ती ‘सुंदरता’ से जोड़ा गया है, पर मूल का कथन कि यह पूर्णता परमेश्वर के वैभव से आई, स्पष्ट रखा गया है; इसे यरूशलेम की अंतर्निहित उपलब्धि नहीं बनाया गया।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिंदी। यरूशलेम को संबोधन मूल में स्त्रीलिंग और एकवचन है, इसलिए ‘तेरी/तुझ’ रखा गया है। वाक्य में मूल के सौंदर्य, प्रदत्त वैभव और परमेश्वर की घोषणा के क्रम को सुरक्षित रखा गया है।
