source:
  edition: WLC
  text: וַ/תִּזְנִ֧י אֶל בְּנֵֽי מִצְרַ֛יִם שְׁכֵנַ֖יִ/ךְ גִּדְלֵ֣י בָשָׂ֑ר וַ/תַּרְבִּ֥י אֶת תַּזְנֻתֵ֖/ךְ לְ/הַכְעִיסֵֽ/נִי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/016/026.yaml
  text: You prostituted yourself with the sons of Egypt[a], your neighbors, great of flesh[b], and multiplied your prostitution to provoke me to anger.
translation:
  language: hi
  text: तूने मिस्र के पुत्रों के साथ, जो तेरे पड़ोसी थे, वेश्यावृत्ति की, जो बड़े अंगवाले थे[b]; और मुझे क्रोधित करने के लिए तूने अपनी वेश्यावृत्ति को और बढ़ाया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: इब्रानी में शाब्दिक रूप से, ‘मांस में बड़े’; यह एक भद्दा यौन वर्णन है। इसका अर्थ ‘बड़े जननांगवाले’ समझा जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּזְנִי
  choice: तूने ... वेश्यावृत्ति की
  rationale: यह क्रिया यरूशलेम की वाचा-विमुखता के लिए प्रयुक्त स्पष्ट यौन रूपक को बनाए रखती है। ‘बेवफ़ाई की’ कहने से मूल की तीखी भाषा दब जाती।
- source_word: אֶל
  choice: के साथ
  rationale: यद्यपि उपसर्ग का मूल अर्थ ‘की ओर’ है, זנה के यौन-संबंधी प्रयोग में स्वाभाविक हिन्दी ‘के साथ’ है।
- source_word: בְּנֵי מִצְרַיִם
  choice: मिस्र के पुत्रों
  rationale: यह इब्रानी अभिव्यक्ति की ठोस बनावट को सुरक्षित रखता है; सहज विकल्प ‘मिस्रियों’ को पादटिप्पणी में दिया गया है।
- source_word: שְׁכֵנַיִךְ
  choice: अपने पड़ोसी
  rationale: यह निकटता के भौगोलिक और राजनीतिक भाव को सरल आधुनिक हिन्दी में व्यक्त करता है।
- source_word: גִּדְלֵי בָשָׂר
  choice: बड़े अंगवाले
  rationale: यह मूल के अशिष्ट यौन संकेत को समझने योग्य हिन्दी में बनाए रखता है, पर उसे मूल से अधिक चिकित्सकीय या अत्यधिक स्पष्ट नहीं बनाता। शाब्दिक रूप पादटिप्पणी में सुरक्षित है।
- source_word: וַתַּרְבִּי אֶת תַּזְנֻתֵךְ
  choice: तूने अपनी वेश्यावृत्ति को और बढ़ाया
  rationale: रבה के कारक अर्थ ‘बढ़ाना’ को व्यक्त करता है और पहले प्रयुक्त זנה से शब्दगत संबंध बनाए रखता है। ‘और’ वृद्धि के भाव को स्वाभाविक बनाता है।
- source_word: לְהַכְעִיסֵנִי
  choice: मुझे क्रोध दिलाने के लिए
  rationale: यह क्रिया के कारक भाव और उत्पन्न क्रोध—दोनों को संक्षेप में व्यक्त करता है।
theological_decisions:
- issue: मूर्तिपूजा और विदेशी गठबंधनों के लिए भविष्यद्वक्ताई यौन रूपक
  choice: मुख्य पाठ में वेश्यावृत्ति का स्पष्ट रूपक बनाए रखा गया
  alternative: ‘बेवफ़ाई की’ या ‘विश्वासघात किया’
  rationale: अध्याय जानबूझकर झकझोरने वाली यौन भाषा द्वारा यरूशलेम की वाचा-विमुखता दिखाता है। इसे नरम करना मूल की अलंकारिक और नैतिक तीव्रता घटा देता।
- issue: בְּנֵי מִצְרַיִם का रूप
  choice: मिस्र के पुत्रों
  alternative: मिस्रियों
  rationale: मुख्य पाठ में स्रोत की ठोस अभिव्यक्ति रखी गई है, जबकि अधिक स्वाभाविक जातिवाचक रूप पादटिप्पणी में उपलब्ध है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गंभीर भविष्यद्वक्ताई लहजा रखा गया है। स्त्रीलिंग एकवचन में संबोधित यरूशलेम के लिए ‘तू’ का प्रयोग निकट, आरोपात्मक और प्रसंगानुकूल है। भाषा को अनावश्यक रूप से शिष्ट बनाकर मूल की कठोरता नहीं घटाई गई, फिर भी ‘बड़े अंगवाले’ द्वारा अशिष्ट संकेत को सामान्य पाठक के लिए समझने योग्य रखा गया है।
