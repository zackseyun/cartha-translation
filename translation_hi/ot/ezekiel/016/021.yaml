  text: You slaughtered my sons and gave them up to them by making them pass through the fire[a].
translation:
  language: hi
  text: तुमने मेरे पुत्रों को काट डाला और उन्हें आग में से गुज़ारकर उन मूर्तियों को सौंप दिया।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “उन्हें उनके लिए पार कराकर।” ‘आग’ इस पद में अलग से नहीं है; पर इस मुहावरे और प्रसंग में इसका अर्थ बच्चों को मूर्तियों के लिए आग में से गुज़ारने वाला बलिदानी कृत्य है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּשְׁחֲטִי
  choice: तुमने ... बलि के लिए काट डाला
  rationale: שׁחט वध करने, विशेषकर बलि के लिए पशु काटने, का बोध देता है। यह अभिव्यक्ति सामान्य ‘मार डाला’ की अपेक्षा हिंसक और अनुष्ठानिक अर्थ को अधिक स्पष्ट रखती है।
- source_word: בָּנָי
  choice: मेरे पुत्रों
  rationale: मूल इब्रानी में स्पष्ट रूप से ‘मेरे पुत्र’ है; इससे लिंगसूचक शब्दावली और परमेश्वर का अधिकार-दावा दोनों सुरक्षित रहते हैं।
- source_word: וַתִּתְּנִים
  choice: उन्हें ... अर्पित कर दिया
  rationale: נתן यहाँ वस्तु-प्रत्यय के साथ उन्हें दूसरे पक्ष को सौंपने का अर्थ देता है। मूर्तिपूजा और बलिदान के प्रसंग में ‘अर्पित कर दिया’ स्वाभाविक है और सौंपे जाने का भाव व्यक्त करता है।
- source_word: בְּהַעֲבִיר אֹתָם
  choice: उन्हें आग में से पार कराकर
  rationale: עבר का हिफ़ईल रूप बच्चों और मूर्तिपूजक अनुष्ठान के इस प्रसंग में आग से संबंधित बलिदानी क्रिया का पारिभाषिक संकेत है। ‘आग’ इस उपवाक्य में प्रत्यक्ष नहीं है, इसलिए इसकी व्याख्यात्मक पूर्ति को पादटिप्पणी में स्पष्ट किया गया है।
- source_word: לָהֶם
  choice: उन मूर्तियों को
  rationale: बहुवचन सर्वनाम का संदर्भ निकटवर्ती प्रसंग की मूर्तियों से है। संज्ञा को दोहराने से आधुनिक हिन्दी में संदर्भ स्पष्ट होता है, जबकि ‘उन्हें’ से उत्पन्न दोहरे सर्वनाम की अस्पष्टता टलती है।
theological_decisions:
- issue: ‘उन्हें पार कराने’ वाले मुहावरे में आग और बलिदान के अर्थ को कितना स्पष्ट किया जाए
  choice: मुख्य पाठ में ‘आग में से पार कराकर’ रखा और इसकी व्याख्यात्मक प्रकृति पादटिप्पणी में बताई।
  alternative: ‘उन्हें उनके लिए पार कराकर’ जैसा अत्यंत शाब्दिक अनुवाद।
  rationale: यहेजकेल और संबंधित भविष्यद्वाणी-साहित्य में यह मुहावरा बच्चों को आग से संबंधित मूर्तिपूजक बलि में चढ़ाने की ओर संकेत करता है। केवल ‘पार कराकर’ आधुनिक पाठक के लिए आरोप को अस्पष्ट कर देता, पर पादटिप्पणी यह ईमानदारी से बताती है कि ‘आग’ इस उपवाक्य में अलग से लिखी नहीं है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और आरोप की तीव्रता के अनुरूप रखी गई है। ‘बलि के लिए काट डाला’ शाब्दिक हिंसा तथा अनुष्ठानिक संदर्भ दोनों को सामने लाता है; ‘उन मूर्तियों’ से सर्वनाम का संदर्भ स्वाभाविक हिन्दी में स्पष्ट किया गया है।
