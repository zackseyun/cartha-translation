  text: וַ/תִּבְטְחִ֣י בְ/יָפְיֵ֔/ךְ וַ/תִּזְנִ֖י עַל שְׁמֵ֑/ךְ וַ/תִּשְׁפְּכִ֧י אֶת תַּזְנוּתַ֛יִ/ךְ עַל כָּל עוֹבֵ֖ר ל/וֹ יֶֽהִי־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/016/015.yaml
  text: But you trusted in your beauty[a], and you prostituted yourself because of your name, and you poured out your prostitutions on every passerby[b]; they became his.
translation:
  language: hi
  text: पर तूने अपनी सुंदरता पर भरोसा किया और अपनी ख्याति[a] के कारण वेश्यावृत्ति की। तूने हर राहगीर पर अपने वेश्याचार उँडेल दिए; वह उसका हो गया[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, ‘अपने नाम के कारण’; यहाँ ‘नाम’ से प्रसिद्धि या प्रतिष्ठा का भाव है।
    reason: lexical_alternative
  - marker: b
    text: 'अंतिम इब्रानी वाक्यांश अत्यंत संक्षिप्त और एकवचन है: ‘वह उसका हो’ या ‘वह उसका हो गया।’ भाव यह है कि उसने जो कुछ प्रस्तुत किया, वह प्रत्येक राहगीर को सौंप दिया गया।'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּבְטְחִי בְיָפְיֵךְ
  choice: तूने अपनी सुंदरता पर भरोसा किया
  rationale: בטח के साथ ב का स्वाभाविक अर्थ किसी वस्तु पर भरोसा रखना है; यह यरूशलेम के अपने सौंदर्य पर रखे गए अनुचित विश्वास को सीधे व्यक्त करता है।
- source_word: וַתִּזְנִי
  choice: वेश्यावृत्ति करने लगी
  rationale: זנה की जानबूझकर प्रयुक्त यौन छवि को बनाए रखा गया है; केवल ‘विश्वासघात किया’ कहना भविष्यद्वक्ता की तीखी उपमा को अनावश्यक रूप से नरम कर देता।
- source_word: עַל שְׁמֵךְ
  choice: अपनी ख्याति के कारण
  rationale: שֵׁם का मूल अर्थ ‘नाम’ है, पर इस प्रसंग में वह प्रसिद्धि अथवा ख्याति का बोध कराता है। मुख्य पाठ में स्वाभाविक हिन्दी अर्थ दिया गया और शाब्दिक विकल्प पादटिप्पणी में रखा गया है।
- source_word: וַתִּשְׁפְּכִי אֶת תַּזְנוּתַיִךְ
  choice: अपने वेश्याचार उँडेल दिए
  rationale: שׁפך की ठोस ‘उँडेलने’ की छवि और תזנות के बार-बार किए गए वेश्यावृत्ति-संबंधी कृत्यों—दोनों को संक्षिप्त, तीखी हिन्दी में सुरक्षित रखा गया है।
- source_word: עַל כָּל עוֹבֵר
  choice: हर राहगीर पर
  rationale: यह मूल पूर्वसर्ग और अंधाधुंध अपने को सौंप देने वाली चौंकाने वाली छवि को बनाए रखता है।
- source_word: לוֹ יֶהִי
  choice: वे उसी के हो गए
  rationale: अत्यंत संक्षिप्त इब्रानी उपवाक्य को पिछले बहुवचन भाव वाले ‘वेश्याचार’ से जोड़ते हुए अनूदित किया गया है; इसकी शाब्दिक अनिश्चितता पादटिप्पणी में स्पष्ट की गई है।
theological_decisions:
- issue: यरूशलेम की वाचा-विरोधी बेवफाई के लिए भविष्यद्वक्ता की यौन उपमा
  choice: मुख्य पाठ में वेश्यावृत्ति और वेश्याचार की स्पष्ट छवि बनाए रखना
  alternative: इसे नरम करके केवल ‘बेवफाई की’ या ‘विश्वासघात किया’ कहना
  rationale: इब्रानी पाठ मूर्तिपूजा और राजनीतिक/वाचागत बेवफाई को यौन वेश्यावृत्ति की जानबूझकर तीखी उपमा से चित्रित करता है। अनुवाद उस उपमा की धर्मवैचारिक बेचैनी को किसी अमूर्त व्याख्या में नहीं बदलता।
translation_notes:
  register: आधुनिक मानक हिन्दी में स्त्रीलिंग एकवचन ‘तू’ रखा गया है, क्योंकि संबोधन व्यक्तिरूप में यरूशलेम से है। भाषा सहज किंतु गरिमापूर्ण है; मूल की कठोर यौन छवि और ‘उँडेलने’ का सजीव रूपक जानबूझकर सुरक्षित रखे गए हैं।
