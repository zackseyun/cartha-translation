base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/016/031.yaml
  text: When you built your mound at the head of every road and made your high place in every square[a], you were not like a prostitute[c][b], in that you scorned payment.
translation:
  language: hi
  text: जब तूने हर मार्ग के आरम्भ पर अपना ऊँचा चबूतरा बनाया और हर चौक में अपना ऊँचा स्थान खड़ा किया[a], तब तू वेश्या के समान न थी, क्योंकि तूने वेश्या के पारिश्रमिक को तुच्छ जाना[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ऊँचा चबूतरा’ के लिए प्रयुक्त इब्रानी शब्द का अर्थ अनिश्चित है; इसका अनुवाद ‘मेहराबदार कोठरी’ या ‘पूजा-मंच’ भी किया गया है। यहाँ यह अध्याय की वेश्यावृत्ति की उपमा से जुड़ी कोई उठी हुई संरचना है।
    reason: lexical_alternative
  - marker: b
    text: अर्थात साधारण वेश्या के विपरीत, यरूशलेम ने पारिश्रमिक पाने के लिए ऐसा नहीं किया; अगले पद बताते हैं कि उसने लेने के बजाय अपने प्रेमियों को उपहार दिए।
    reason: cross_reference
lexical_decisions:
- source_word: בִּבְנוֹתַיִךְ
  choice: जब तूने ... बनाया
  rationale: בְּ + infinitive construct यहाँ कालसूचक परिस्थिति बताता है; आधुनिक हिन्दी में ‘जब तूने’ स्वाभाविक है।
- source_word: גַּבֵּךְ
  choice: अपना ऊँचा चबूतरा
  rationale: संज्ञा किसी उठी हुई संरचना को सूचित करती है, पर उसकी ठीक वास्तुकला अनिश्चित है; ‘ऊँचा चबूतरा’ ठोस अर्थ देता है और अनिश्चितता को टिप्पणी में बनाए रखता है।
- source_word: בְּרֹאשׁ כָּל־דֶּרֶךְ
  choice: हर मार्ग के आरम्भ पर
  rationale: רֹאשׁ का मूल स्थानिक अर्थ ‘सिर/आरम्भ’ है; यह अनुवाद उसे मुहावरेदार ‘हर मोड़ पर’ में विलीन नहीं करता।
- source_word: וְרָמָתֵךְ
  choice: अपना ऊँचा स्थान
  rationale: संदर्भ में यह सम्भवतः उपासना से जुड़ा ऊँचा स्थान है; स्थापित बाइबलीय अभिव्यक्ति उसके धार्मिक संकेत को बनाए रखती है।
- source_word: עשיתי
  choice: खड़ा किया
  rationale: मसोरेटिक पाठ में व्यंजन עשיתי है, जिसका लिखित रूप प्रथम पुरुष जैसा दिखता है, पर प्रसंग और पारम्परिक पठन स्त्रीलिंग द्वितीय पुरुष ‘तूने बनाया’ की माँग करते हैं; संरचना के लिए ‘खड़ा किया’ स्वाभाविक है।
- source_word: בְּכָל רְחוֹב
  choice: हर चौक में
  rationale: רְחוֹב प्रायः नगर के चौड़े सार्वजनिक स्थान या चौक को दर्शाता है।
- source_word: וְלֹא הָיִית כַּזּוֹנָה
  choice: तू वेश्या जैसी भी न रही
  rationale: 'तुलना के व्यंग्य को सीधे रखा गया है: यरूशलेम साधारण वेश्या से भी इस बात में भिन्न थी। ‘भी’ आरोप की विरोधाभासी तीव्रता व्यक्त करता है।'
- source_word: לְקַלֵּס
  choice: तुच्छ जाना
  rationale: क्रिया का आशय अवमानना या तिरस्कार करना है; ‘तुच्छ जाना’ गरिमापूर्ण और सहज हिन्दी है।
- source_word: אֶתְנָן
  choice: मेहनताना
  rationale: यह विशेषतः वेश्या को मिलने वाले पारिश्रमिक को दर्शाता है; ‘मेहनताना’ स्पष्ट है, जबकि टिप्पणी संदर्भ को और खोलती है।
theological_decisions:
- issue: यरूशलेम की मूर्तिपूजा के लिए वेश्यावृत्ति का रूपक
  choice: ‘वेश्या’ और ‘मेहनताना’ जैसे प्रत्यक्ष शब्द बनाए रखे गए।
  alternative: ‘विश्वासघाती स्त्री’ अथवा केवल ‘मूर्तिपूजक’ कहना।
  rationale: यहेजकेल की जानबूझकर तीखी यौन-उपमा वाचा के विश्वासघात को व्यक्त करती है; उसे नरम करना भविष्यद्वाणी की वाग्मिता को घटा देता।
- issue: अन्तिम खंड का सम्बन्ध
  choice: ‘क्योंकि तूने मेहनताना तुच्छ जाना’—साधारण वेश्या से भिन्नता का कारण।
  alternative: ‘तू मेहनताना माँगनेवाली वेश्या जैसी न थी।’
  rationale: यह पद की विडम्बना को बनाए रखता है और पद 32–34 में आनेवाली व्याख्या—लेने के बदले देने—की ओर संकेत करता है, बिना उसे इस पद में मिला देने के।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और प्रत्यक्ष हिन्दी। यरूशलेम को सम्बोधित एकवचन स्त्रीलिंग ‘तू’ रखा गया है। कठोर भविष्यद्वाणी की भाषा को नरम नहीं किया गया, जबकि दुर्लभ वास्तुशब्द की अनिश्चितता पादटिप्पणी में सुरक्षित है।
