    reason: lexical_alternative
lexical_decisions:
- source_word: זִמָּתֵךְ
  choice: अपनी निर्लज्ज कामुकता
  rationale: यहेजकेल 16 के व्यभिचार और वेश्यावृत्ति के विस्तृत रूपक में זִמָּה केवल सामान्य दुष्टता नहीं, बल्कि नैतिक रूप से निर्लज्ज और यौन आशय वाली बुराई को दर्शाता है। यह पदबंध उस बल को स्वाभाविक आधुनिक हिन्दी में बनाए रखता है।
- source_word: תּוֹעֲבוֹתַיִךְ
  choice: अपने घिनौने कामों
  rationale: תּוֹעֵבָה नैतिक या उपासना-संबंधी ऐसी बात के लिए आता है जो अत्यंत घृणित हो। हिन्दी में ‘घिनौने काम’ स्पष्ट, स्वाभाविक और बहुवचन की तीव्रता के अनुरूप है।
- source_word: אַתְּ
  choice: तू
  rationale: स्वतंत्र स्त्रीलिंग एकवचन सर्वनाम संबोधित यरूशलेम को सीधे और बलपूर्वक निर्दिष्ट करता है। हिन्दी में क्रिया का स्त्रीलिंग रूप भी इस व्याकरणिक संबोधन को प्रकट करता है।
- source_word: נְשָׂאתִם
  choice: का बोझ उठा चुकी है
  rationale: נשׂא का मूल अर्थ उठाना या ढोना है और न्याय के प्रसंग में दोष अथवा दंड के परिणाम सहने का संकेत दे सकता है। ‘बोझ उठा चुकी है’ मूल रूपक और उसकी न्यायिक व्यापकता दोनों को बनाए रखता है।
- source_word: נְאֻם יְהוָה
  choice: यह यहोवा की घोषणा है
  rationale: נְאֻם भविष्यद्वाणी की अधिकारपूर्ण घोषणा का सूत्र है। יְהוָה को उसके वाचा-नाम ‘यहोवा’ से प्रस्तुत किया गया है।
theological_decisions:
- issue: वाचा-नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: प्रभु
  rationale: मूल पाठ में परमेश्वर का विशिष्ट वाचा-नाम सीधे आया है; उसे सामान्य उपाधि से बदलने के बजाय हिन्दी में प्रचलित नाम-रूप ‘यहोवा’ रखा गया है।
- issue: נשׂא के न्यायिक आशय को स्पष्ट करना
  choice: का बोझ उठा चुकी है
  alternative: अपने दंड को भुगत चुकी है / अपना दोष उठा चुकी है
  rationale: संदर्भ दोष और उसके परिणाम दोनों की ओर संकेत कर सकता है, पर इब्रानी वाक्य केवल किसी एक को स्पष्ट नहीं करता। इसलिए मुख्य पाठ मूल की संक्षिप्त अस्पष्टता को बनाए रखता है और विकल्प पादटिप्पणी में दिए गए हैं।
translation_notes:
  register: भाषा आधुनिक, सीधी और गरिमापूर्ण रखी गई है। स्त्रीलिंग ‘चुकी है’ यरूशलेम के स्त्रीरूप संबोधन को दर्शाता है। ‘तू’ भविष्यद्वाणी के सीधे अभियोग की तीव्रता बनाए रखता है; ‘आप’ इस संदर्भ में अनावश्यक आदरसूचक होता।
