source:
  edition: WLC
  text: רְבָבָ֗ה כְּ/צֶ֤מַח הַ/שָּׂדֶה֙ נְתַתִּ֔י/ךְ וַ/תִּרְבִּי֙ וַֽ/תִּגְדְּלִ֔י וַ/תָּבֹ֖אִי בַּ/עֲדִ֣י עֲדָיִ֑ים שָׁדַ֤יִם נָכֹ֨נוּ֙ וּ/שְׂעָרֵ֣/ךְ צִמֵּ֔חַ וְ/אַ֖תְּ עֵרֹ֥ם וְ/עֶרְיָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/016/007.yaml
  text: I made you countless like the growth of the field[a], and you multiplied and grew up and came to full adornment. Your breasts were formed and your hair had grown[d][c][b], yet you were naked and bare.
translation:
  language: hi
  text: मैंने तुम्हें खेत की वनस्पति के समान बहुतायत में बढ़ाया[a]। तुम बहुत बढ़ीं, बड़ी हुईं और पूर्ण शोभा को पहुँचीं[b]। तुम्हारे स्तन विकसित हो गए और तुम्हारे बाल उग आए[c], फिर भी तुम नंगी और निर्वस्त्र थीं[d]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “मैंने तुम्हें खेत की वनस्पति के समान असंख्य किया।”
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में शाब्दिक रूप से “आभूषणों के आभूषण को पहुँचीं” जैसा कठिन मुहावरा है। इसका आशय पूर्ण सौंदर्य या परिपक्वता, संभवतः आभूषण पहनने की आयु, हो सकता है।
    reason: alternative_reading
  - marker: c
    text: संदर्भ में “बाल” से संभवतः यौवन में उगने वाले जघन के बाल अभिप्रेत हैं, पर इब्रानी में केवल “तुम्हारे बाल” है।
    reason: ambiguity
  - marker: d
    text: “नंगी और निर्वस्त्र” की दोहरी अभिव्यक्ति पूरी तरह अनावृत होने पर बल देती है।
    reason: literary_emphasis
lexical_decisions:
- source_word: רְבָבָה ... נְתַתִּיךְ
  choice: मैंने तुम्हें ... बहुत बढ़ाया
  rationale: רְבָבָה अत्यधिक संख्या या बहुतायत का बोध कराता है और נתן के साथ यह बढ़ाने का कारक अर्थ देता है। हिंदी में यह प्रयोग स्वाभाविक है और संदर्भ में तीव्र वृद्धि को व्यक्त करता है।
- source_word: כְּצֶמַח הַשָּׂדֶה
  choice: खेत की वनस्पति के समान
  rationale: צֶמַח अंकुर, उपज या वनस्पति को सूचित कर सकता है। यह चयन कृषि-बिंब और बढ़ने के भाव दोनों को बनाए रखता है।
- source_word: וַתִּרְבִּי וַתִּגְדְּלִי
  choice: तुम बढ़ती गईं, बड़ी हुईं
  rationale: दोनों क्रियाओं के क्रमशः वृद्धि और परिपक्व होने के निकट लेकिन भिन्न भाव सुरक्षित रखे गए हैं। स्त्रीलिंग रूप यरूशलेम के स्त्री-रूपक के अनुरूप है।
- source_word: וַתָּבֹאִי בַּעֲדִי עֲדָיִים
  choice: पूर्ण शोभा को पहुँचीं
  rationale: दुर्बोध इब्रानी मुहावरा शाब्दिक रूप से ‘आभूषणों की शोभा’ जैसा है। ‘पूर्ण शोभा’ परिपक्व सौंदर्य का संकेत देता है, पर विवाह या किसी विशिष्ट जैविक अवस्था को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: שָׁדַיִם נָכֹנוּ
  choice: तुम्हारे स्तन विकसित हो गए
  rationale: निफ़अल रूप यहाँ स्थापित या विकसित हो जाने का भाव देता है; युवावस्था के संदर्भ में ‘विकसित’ स्पष्ट और स्वाभाविक है।
- source_word: וּשְׂעָרֵךְ צִמֵּחַ
  choice: तुम्हारे बाल उग आए
  rationale: צמח का मूल भाव उगना या अंकुरित होना है। ‘उग आए’ शारीरिक परिपक्वता के इस चित्र को सीधे व्यक्त करता है, जबकि बालों के सटीक प्रकार को अनिर्णीत छोड़ता है।
- source_word: עֵרֹם וְעֶרְיָה
  choice: नंगी और निर्वस्त्र
  rationale: दो समानार्थी शब्दों की जोड़ी पूर्ण अनावृत अवस्था पर बल देती है। हिंदी की दोहरी अभिव्यक्ति उस तीव्रता को बनाए रखती है।
theological_decisions:
- issue: בַּעֲדִי עֲדָיִים का परिपक्वता-रूपक
  choice: पूर्ण शोभा को पहुँचीं
  alternative: आभूषण पहनने की आयु को पहुँचीं; यौवन को पहुँचीं; दुल्हन की शोभा को पहुँचीं
  rationale: पद यरूशलेम को बढ़ती हुई लड़की के रूप में चित्रित करता है, पर इब्रानी वाक्यांश विवादित है। मुख्य पाठ शोभा और परिपक्वता का संकेत रखता है, किंतु वैवाहिक, मासिक-धर्म संबंधी या अन्य विशिष्ट व्याख्या आरोपित नहीं करता।
- issue: וּשְׂעָרֵךְ में बालों का अभिप्राय
  choice: बाल
  alternative: जघन के बाल
  rationale: यौवन के संदर्भ से जघन के बाल अभिप्रेत हो सकते हैं, लेकिन इब्रानी संज्ञा स्वयं केवल ‘बाल’ कहती है। अतः मुख्य पाठ मूल की अनिश्चितता बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिंदी का गरिमापूर्ण, सहज गद्य। स्त्रीलिंग क्रियाएँ यरूशलेम के स्त्री-रूपक को बनाए रखती हैं। यौवन-विकास से संबंधित शारीरिक भाषा को मूल पाठ के अनुरूप स्पष्ट रखा गया है, पर विवादित संकेतों को पादटिप्पणियों में सीमित किया गया है।
