source:
  edition: WLC
  text: וְ/אֵ֤ת כָּל תּוֹעֲבֹתַ֨יִ/ךְ֙ וְ/תַזְנֻתַ֔יִ/ךְ לֹ֥א זכרתי אֶת יְמֵ֣י נְעוּרָ֑יִ/ךְ בִּֽ/הְיוֹתֵ/ךְ֙ עֵרֹ֣ם וְ/עֶרְיָ֔ה מִתְבּוֹסֶ֥סֶת בְּ/דָמֵ֖/ךְ הָיִֽית־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/016/022.yaml
  text: And in all your abominations and your prostitutions[a], you did not remember the days of your youth, when you were naked and bare[c][b], wallowing in your blood.
translation:
  language: hi
  text: और अपने सारे घिनौने कामों और वेश्या-जैसे कामों[a] के बीच तूने अपनी जवानी के दिनों को याद नहीं किया—जब तू नंगी और उघाड़ी हुई[b] थी और अपने ही खून में लोट रही थी[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “वेश्यावृत्ति के कामों”; इब्रानी में वेश्यावृत्ति का चित्र यरूशलेम की वाचा-संबंधी और मूर्तिपूजक बेवफाई के लिए प्रयुक्त है।
    reason: lexical_alternative
  - marker: b
    text: या “नंगी और सबके सामने खुली हुई।”
    reason: lexical_alternative
  - marker: c
    text: या “अपने खून में छटपटा रही थी” अथवा “अपने खून में हाथ-पाँव मार रही थी”; इब्रानी क्रिया खून से सनी हुई असहाय दशा और गति का चित्र खींचती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: תּוֹעֲבֹתַיִךְ
  choice: तेरे/अपने सारे घिनौने काम
  rationale: ‘घिनौने काम’ सामान्य आधुनिक हिन्दी में बोधगम्य है और इब्रानी शब्द की नैतिक तथा उपासना-संबंधी तीव्र निंदा को बनाए रखता है। वाक्य में कर्ता ‘तू’ होने के कारण स्वाभाविक हिन्दी के लिए ‘अपने’ रखा गया है।
- source_word: תַזְנֻתַיִךְ
  choice: तेरे/अपने वेश्याचार
  rationale: यह बहुवचन यौन रूपक को ठोस रूप में बनाए रखता है; उसे केवल ‘विश्वासघात’ या ‘मूर्तिपूजा’ कहकर व्याख्यात्मक और अमूर्त नहीं बनाया गया।
- source_word: לֹא זכרתי
  choice: तूने ... याद नहीं किया
  rationale: संदर्भ और परंपरागत पाठ-पठन के अनुसार संबोधन स्त्रीलिंग एकवचन है; सीधा निषेध और स्मरण का अर्थ सुरक्षित है।
- source_word: יְמֵי נְעוּרָיִךְ
  choice: अपनी जवानी के दिन
  rationale: इब्रानी संबंध-वाक्यांश का निकट, सहज और वर्तमान हिन्दी रूप।
- source_word: עֵרֹם וְעֶרְיָה
  choice: नंगी और उघाड़ी हुई
  rationale: दो समानार्थी शब्दों की तीव्रता और असुरक्षित, सबके सामने खुली दशा को बनाए रखा गया है।
- source_word: מִתְבּוֹסֶסֶת בְּדָמֵךְ
  choice: अपने ही खून में लोट रही थी
  rationale: क्रिया की बार-बार होने वाली या आत्म-संबंधी गति तथा खून से सनी असहाय दशा को सजीव रूप से व्यक्त करता है; ‘ही’ अपने खून पर बल देता है, कोई नया आशय नहीं जोड़ता।
- source_word: וְאֵת כָּל ... וְ...
  choice: और ... के बीच
  rationale: आरंभिक इब्रानी रचना संक्षिप्त और कुछ कठिन है। ‘के बीच’ इन घिनौने कार्यों के चलते रहने के दौरान स्मरण न करने का अर्थ देता है, बिना ‘इसके बावजूद’ जैसी अधिक निर्णायक व्याख्या थोपे।
theological_decisions:
- issue: वाचा-विरोधी बेवफाई के लिए भविष्यद्वक्ताओं का यौन रूपक
  choice: ‘वेश्याचारों’ का ठोस रूपक बनाए रखा गया।
  alternative: ‘बेवफाइयों’ या ‘मूर्तिपूजा’
  rationale: यहेजकेल जानबूझकर तीखा यौन रूपक इस्तेमाल करता है। अमूर्त धार्मिक शब्द उस आरोप की शक्ति घटा देते और रूपक की व्याख्या को मूल पाठ में मिला देते।
- issue: यरूशलेम की आरंभिक असहाय दशा
  choice: ‘नंगी और उघाड़ी हुई’ तथा ‘अपने ही खून में लोट रही थी’ के चित्र को ज्यों का त्यों रखा गया।
  alternative: इसे सामान्य रूप से ‘पूरी तरह असहाय थी’ कहना
  rationale: मूल पाठ शारीरिक और कठोर जन्म-संबंधी चित्र द्वारा असहायता प्रकट करता है; केवल उसका निष्कर्ष देने से साहित्यिक और धर्मवैचारिक तनाव मिट जाता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु तीखा भविष्यद्वाणी-संबंधी लहजा रखा गया है। स्त्रीलिंग एकवचन ‘तू’ यरूशलेम से सीधे संबोधन और अध्याय की रूपकात्मक शैली के अनुरूप है। ‘वेश्याचार’ कठोर है, पर मूल के जानबूझकर कठोर यौन रूपक को अनावश्यक रूप से नरम नहीं करता।
