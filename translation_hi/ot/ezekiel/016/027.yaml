  text: וְ/הִנֵּ֨ה נָטִ֤יתִי יָדִ/י֙ עָלַ֔יִ/ךְ וָ/אֶגְרַ֖ע חֻקֵּ֑/ךְ וָ/אֶתְּנֵ֞/ךְ בְּ/נֶ֤פֶשׁ שֹׂנְאוֹתַ֨יִ/ךְ֙ בְּנ֣וֹת פְּלִשְׁתִּ֔ים הַ/נִּכְלָמ֖וֹת מִ/דַּרְכֵּ֥/ךְ זִמָּֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/016/027.yaml
  text: And behold[a], I stretched out my hand against you, and I reduced your allotted portion, and gave you over to the desire of those who hate you, the daughters of the Philistines[c][b], who are ashamed of your lewd way.
translation:
  language: hi
  text: और देख, मैंने अपना हाथ तेरे विरुद्ध बढ़ाया, तेरे लिए ठहराया हुआ भाग घटा दिया[a], और तुझे तेरी बैरिनों—पलिश्तियों की बेटियों[c]—की इच्छा के हवाले कर दिया[b], जो तेरे अश्लील चाल-चलन से लज्जित हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘तेरा निर्धारित हिस्सा,’ ‘तेरा नियत भत्ता,’ अथवा ‘तेरा हक़।’ हिब्रू शब्द किसी निर्धारित या आवंटित वस्तु को सूचित कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: या ‘तेरी बैरिनों की मर्ज़ी के हवाले।’ हिब्रू अभिव्यक्ति में शाब्दिक रूप से ‘प्राण’ है, जिसका अर्थ यहाँ इच्छा, लालसा या मर्ज़ी है।
    reason: lexical_alternative
  - marker: c
    text: ‘पलिश्तियों की बेटियाँ’ जातियों या नगरों को बेटियों के रूप में प्रस्तुत करने वाले भविष्यद्वाणी के व्यक्तिकरण को बनाए रखता है।
    reason: cultural_note
lexical_decisions:
- source_word: וְהִנֵּה
  choice: और देख
  rationale: यह ध्यान खींचने वाला कथन है। ‘और देख’ हिब्रू की संकेतात्मक और सजीव शक्ति को स्वाभाविक आधुनिक हिन्दी में बनाए रखता है।
- source_word: נָטִיתִי יָדִי עָלַיִךְ
  choice: मैंने अपना हाथ तेरे विरुद्ध बढ़ाया
  rationale: यह न्याय के लिए निर्णायक कार्रवाई का बिंब है; अनुवाद हिब्रू चित्र को बिना अतिरिक्त व्याख्या के सुरक्षित रखता है।
- source_word: וָאֶגְרַע חֻקֵּךְ
  choice: तेरे लिए ठहराया हुआ भाग घटा दिया
  rationale: क्रिया घटाने का और संज्ञा निर्धारित या आवंटित अंश का बोध कराती है। यह रूप भोजन, भूमि या भत्ते जैसे किसी एक अर्थ तक अनावश्यक रूप से सीमित नहीं करता।
- source_word: וָאֶתְּנֵךְ בְּנֶפֶשׁ שֹׂנְאוֹתַיִךְ
  choice: तुझे तेरी बैरिनों की इच्छा के हवाले कर दिया
  rationale: दंडात्मक प्रसंग में ‘हवाले कर दिया’ समर्पित कर देने का भाव देता है; נֶפֶשׁ यहाँ इच्छा या अभिलाषा के अर्थ में है। स्त्रीलिंग रूपों को ‘बैरिनों’ से रखा गया है।
- source_word: בְּנוֹת פְּלִשְׁתִּים
  choice: पलिश्तियों की बेटियाँ
  rationale: यह लोगों या नगरों के भविष्यद्वाणी-संबंधी स्त्रीरूप व्यक्तिकरण को बनाए रखता है और इसे केवल व्यक्तिगत स्त्रियों में नहीं बदलता।
- source_word: הַנִּכְלָמוֹת מִדַּרְכֵּךְ זִמָּה
  choice: जो तेरे अश्लील चाल-चलन से लज्जित थीं
  rationale: यह यरूशलेम के यौन और नैतिक रूप से विकृत आचरण पर उनकी लज्जा को व्यक्त करता है। ‘चाल-चलन’ דרך के रूपक और व्यवहार दोनों को सहज हिन्दी में संप्रेषित करता है।
theological_decisions:
- issue: भविष्यद्वाणी के रूपक में ईश्वरीय न्याय और यौन-नैतिक आरोप
  choice: प्रथम पुरुष में न्याय की भाषा और व्यभिचार-संबंधी नैतिक रूपक दोनों को स्पष्ट रूप से बनाए रखा गया।
  alternative: इसे केवल सामान्य दंड और सामान्य दुष्टता की अमूर्त भाषा में कहना।
  rationale: यह पद वाचा के प्रति अविश्वास के विस्तृत रूपक का अंग है। मूल बिंब को बनाए रखना आरोप और न्याय की तीव्रता को सुरक्षित रखता है, पर पाठ से आगे कोई सांप्रदायिक निष्कर्ष नहीं जोड़ता।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य हिन्दी। यरूशलेम को संबोधन मूल में स्त्रीलिंग एकवचन और निकट संबोधन में है, इसलिए ‘तेरे/तुझे’ रखा गया है। ‘बैरिनों’ और ‘थीं’ से स्रोत के स्त्रीलिंग बहुवचन का संकेत सुरक्षित है।
