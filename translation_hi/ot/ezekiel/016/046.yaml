base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/016/046.yaml
  text: Your older sister is Samaria[a], she and her daughters, who dwell to your left; and your younger sister, who dwells to your right, is Sodom and her daughters.
translation:
  language: hi
  text: तेरी बड़ी बहन सामरिया[a] है; वह और उसकी बेटियाँ तेरी बाईं ओर रहती हैं। और तेरी तुझसे छोटी बहन, जो तेरी दाईं ओर रहती है, सदोम है, और उसकी बेटियाँ भी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यरूशलेम के दृष्टिकोण से सामरिया उत्तर में और सदोम दक्षिण में था।
    reason: cultural_note
lexical_decisions:
- source_word: אֲחוֹתֵךְ
  choice: तेरी बहन
  rationale: शहरों को बहनों के रूप में प्रस्तुत करने वाले मूल पारिवारिक रूपक को बनाए रखता है; एकवचन स्त्रीलिंग संबोधन यरूशलेम से है।
- source_word: הַגְּדוֹלָה
  choice: बड़ी
  rationale: हिब्रू विशेषण का सामान्य अर्थ ‘बड़ी’ है और हिन्दी में ‘बड़ी बहन’ आयु तथा पारिवारिक वरिष्ठता दोनों को स्वाभाविक रूप से व्यक्त करता है।
- source_word: שֹׁמְרוֹן
  choice: सामरिया
  rationale: स्थान-नाम का प्रचलित मानक हिन्दी रूप।
- source_word: וּבְנוֹתֶיהָ
  choice: वह और उसकी बेटियाँ
  rationale: ‘बेटियाँ’ को बनाए रखने से नगर-परिवार का रूपक सुरक्षित रहता है; प्रसंग में आश्रित नगर या बस्तियाँ अभिप्रेत हो सकती हैं।
- source_word: הַיּוֹשֶׁבֶת
  choice: जो ... रहती हैं
  rationale: ישׁב का अर्थ यहाँ निवास करना है। पहले खंड में सामरिया और उसकी बेटियों के संयुक्त संदर्भ के कारण हिन्दी में बहुवचन क्रिया स्वाभाविक है।
- source_word: עַל שְׂמֹאולֵךְ
  choice: तेरी बाईं ओर
  rationale: मूल के देह-अभिमुख स्थानवाचक रूप को सीधे और स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: הַקְּטַנָּה מִמֵּךְ
  choice: तेरी छोटी बहन
  rationale: ‘छोटी बहन’ हिन्दी का स्वाभाविक संबंधवाचक प्रयोग है और מִמֵּךְ में निहित यरूशलेम से तुलना को बिना असहज ‘तुझसे छोटी’ के पर्याप्त रूप से व्यक्त करता है।
- source_word: מִימִינֵךְ
  choice: तेरी दाईं ओर
  rationale: मूल के स्थानवाचक रूप को बनाए रखता है और मुख्य पाठ में सीधे ‘दक्षिण’ जोड़ने से बचता है।
- source_word: סְדֹם
  choice: सदोम
  rationale: स्थान-नाम का प्रचलित मानक हिन्दी रूप।
- source_word: וּבְנוֹתֶיהָ
  choice: और उसकी बेटियाँ
  rationale: पहले प्रयोग के अनुरूप मूल रूपक को बनाए रखता है; इसका आशय सदोम से जुड़े नगरों या बस्तियों से हो सकता है।
theological_decisions:
- issue: यरूशलेम के सापेक्ष बाईं और दाईं ओर की भौगोलिक भाषा
  choice: मुख्य पाठ में ‘तेरी बाईं ओर’ और ‘तेरी दाईं ओर’ रखा गया है।
  alternative: इन्हें क्रमशः ‘तेरे उत्तर में’ और ‘तेरे दक्षिण में’ अनूदित करना।
  rationale: हिब्रू में स्पष्ट दिशासूचक शब्दों के बजाय देह-अभिमुख स्थानवाचक भाषा है। मूल बिंब को पाठ में सुरक्षित रखते हुए उसका भौगोलिक आशय पादटिप्पणी में स्पष्ट किया गया है।
- issue: ‘बड़ी/छोटी’ को आयु या आकार के रूप में समझना
  choice: पारिवारिक रूपक के अनुरूप ‘बड़ी बहन’ और ‘छोटी बहन’।
  alternative: ‘विशाल/छोटी’ या ‘महान/कमतर’ बहन।
  rationale: גָּדוֹל और קָטָן आकार अथवा दर्जा भी बता सकते हैं, पर बहनों की तुलना में हिन्दी का ‘बड़ी/छोटी बहन’ मूल की अर्थगत खुलावट रखते हुए सबसे स्वाभाविक है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य हिन्दी; यरूशलेम को स्त्री रूप में सीधे संबोधित करने के कारण ‘तेरी’ रखा गया है। अर्धविराम और डैश से हिब्रू वाक्य की समानांतर संरचना स्पष्ट की गई है। पादटिप्पणी चिह्न मुख्य पाठ में उपस्थित है।
