  yaml_path: translation/ot/ezekiel/016/018.yaml
  text: You took your embroidered garments and covered them[a], and you set my oil and my incense before them.
translation:
  language: hi
  text: तूने अपने कढ़ाईदार वस्त्र लेकर उन्हें ढक दिया[a], और मेरा तेल और मेरी धूप उनके सामने रख दी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उन्हें ये वस्त्र पहना दिए।” इब्रानी क्रिया का मूल अर्थ “ढकना” है, पर प्रसंग में आशय मूर्तियों को इन वस्त्रों से सजाने या वस्त्र पहनाने का हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּגְדֵי רִקְמָתֵךְ
  choice: अपने कढ़ाईदार वस्त्र
  rationale: בִּגְדֵי का अर्थ ‘वस्त्र’ और רִקְמָה का अर्थ कढ़ाई या बारीक सजावटी काम वाला कपड़ा है। यह चयन वस्त्रों की बहुमूल्यता और सजावट को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וַתְּכַסִּים
  choice: उन्हें ढक दिया
  rationale: כסה का मूल अर्थ ‘ढकना’ है। पुल्लिंग बहुवचन प्रत्यय को ‘उन्हें’ के रूप में रखा गया है; प्रसंग उसका संकेत मूर्तियों की ओर करता है, पर मुख्य पाठ में उसे स्पष्ट करके अर्थ को संकुचित नहीं किया गया।
- source_word: וְשַׁמְנִי
  choice: मेरा तेल
  rationale: שֶׁמֶן का अर्थ तेल है। स्रोत में जैतून का स्पष्ट उल्लेख नहीं है, इसलिए ‘मेरा तेल’ अधिक सटीक है और परमेश्वर के स्वामित्व पर बल भी बनाए रखता है।
- source_word: וּקְטָרְתִּי
  choice: मेरी धूप
  rationale: קְטֹרֶת उपासना में चढ़ाई जाने वाली सुगन्धित धूप को दर्शाता है। आधुनिक धार्मिक हिन्दी में ‘धूप’ स्वाभाविक और संक्षिप्त है।
- source_word: נתתי לִפְנֵיהֶם
  choice: उनके सामने रख दी
  rationale: व्यंजन-पाठ נתתי को प्रसंग और स्त्रीलिंग एकवचन संबोधन के अनुसार ‘तूने रखी’ समझा गया है। तेल और धूप को उपासना की वस्तुओं के रूप में सामने अर्पित करने के प्रसंग में ‘रख दी’ सहज हिन्दी है।
theological_decisions:
- issue: ‘उन्हें/उनके’ का संदर्भ
  choice: सर्वनामों को मुख्य पाठ में ‘उन्हें’ और ‘उनके’ ही रखा गया है; निकटवर्ती प्रसंग में वे मूर्तियों/प्रतिमाओं की ओर संकेत करते हैं।
  alternative: मुख्य पाठ में सीधे ‘मूर्तियों को/उनके सामने’ कहना।
  rationale: मूर्तियाँ प्रसंगगत संदर्भ हैं, लेकिन इब्रानी पद स्वयं संज्ञा को दोहराता नहीं। सर्वनाम बनाए रखने से स्रोत की अभिव्यक्ति और उसका प्रसंगगत तनाव सुरक्षित रहता है।
- issue: נתתי का पाठ और संबोधन
  choice: मसोरेटिक पाठ के व्यंजन נתתי को प्रसंगानुसार द्वितीय पुरुष स्त्रीलिंग एकवचन क्रिया मानकर ‘रख दी’ अनूदित किया गया है।
  alternative: लिखित रूप को प्रथम पुरुष ‘मैंने दिया’ समझना।
  rationale: पूरे वाक्य में यरूशलेम को स्त्रीलिंग एकवचन ‘तू’ कहकर संबोधित किया गया है, और प्राचीन पाठ-परंपरा भी यहाँ प्रसंगानुकूल स्त्रीलिंग क्रिया का संकेत देती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज और प्रत्यक्ष शैली रखी गई है। यरूशलेम के लिए मूल पाठ का आत्मीय एकवचन संबोधन ‘तू’ सुरक्षित रखा गया है। ‘कढ़ाईदार वस्त्र,’ ‘तेल’ और ‘धूप’ सामान्य पाठक के लिए स्पष्ट हैं तथा उपासना-संबंधी प्रसंग को बनाए रखते हैं।
