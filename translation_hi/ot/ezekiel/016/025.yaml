base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/016/025.yaml
  text: At every street corner you built your high place[a], and you made your beauty detestable[b]. You spread your legs to every passerby and multiplied your prostitution.
translation:
  language: hi
  text: हर चौराहे पर तुमने अपना ऊँचा पूजास्थल[a] बनाया और अपनी सुन्दरता को घृणित बना दिया। तुमने हर राहगीर के सामने अपनी टाँगें फैलाईं और अपनी वेश्यावृत्ति बढ़ाई।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, ‘हर मार्ग के सिर पर’; अर्थात हर सड़क के प्रमुख मोड़ या संगम पर।
    reason: lexical_alternative
lexical_decisions:
- source_word: רֹאשׁ דֶּרֶךְ
  choice: हर चौराहे पर
  rationale: शाब्दिक अर्थ ‘हर मार्ग के सिर पर’ है; प्रसंग में यह सड़कों के मिलने के प्रमुख, सार्वजनिक स्थान को दर्शाता है। ‘चौराहे’ आधुनिक हिन्दी में स्वाभाविक है।
- source_word: רָמָה
  choice: ऊँचा स्थान
  rationale: यह शब्द ऊँचे पूजास्थल की ओर संकेत करता है। ‘ऊँचा स्थान’ उपासना-संबंधी अर्थ और यौन-व्यभिचार के रूपक, दोनों को बनाए रखता है।
- source_word: תְּתַעֲבִי אֶת יָפְיֵךְ
  choice: अपनी सुन्दरता को घिनौना कर दिया
  rationale: क्रिया תעב यहाँ सुन्दरता को घृणित बना देने का भाव देती है; यह अनुवाद कर्मवाचक संबंध को स्पष्ट और स्वाभाविक रखता है।
- source_word: תְּפַשְּׂקִי אֶת רַגְלַיִךְ
  choice: अपनी टाँगें फैलाईं
  rationale: इब्रानी की जानबूझकर स्पष्ट और कठोर यौन छवि को बिना शिष्टोक्ति से नरम किए व्यक्त करता है।
- source_word: לְכָל עוֹבֵר
  choice: हर राहगीर के लिए
  rationale: भाग लेने वाले रूप עוֹבֵר का अर्थ मार्ग से गुजरने वाला व्यक्ति है; ‘राहगीर’ संक्षिप्त और सहज हिन्दी है।
- source_word: וַתַּרְבִּי אֶת תַּזְנוּתֵךְ
  choice: अपनी वेश्यागिरी बढ़ाती गईं
  rationale: רבה मात्रा या बारंबारता बढ़ाने का भाव देता है। ‘बढ़ाती गईं’ हिन्दी में निरंतर विस्तार का अर्थ स्वाभाविक ढंग से व्यक्त करता है; ‘वेश्यागिरी’ रूपक की कठोरता बनाए रखता है।
theological_decisions:
- issue: यौन और मूर्तिपूजक विश्वासघात के संयुक्त रूपक की स्पष्टता
  choice: ‘अपनी टाँगें फैलाईं’ और ‘वेश्यागिरी’ जैसी सीधी भाषा
  alternative: ‘अपने आपको सौंप दिया’ या ‘व्यभिचार किया’ जैसी नरम अभिव्यक्तियाँ
  rationale: मूल पाठ यरूशलेम की सार्वजनिक मूर्तिपूजा और वाचा-विषयक विश्वासघात को चौंकाने वाली यौन भाषा से चित्रित करता है। इसे नरम करना भविष्यद्वाणी के उद्देश्य और प्रभाव को घटा देगा।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। मूल की कठोर यौन छवि को शिष्टोक्ति से नहीं ढका गया। स्त्रीलिंग कर्ता के अनुरूप ‘गईं’ का आदरसूचक/मानक बहुवचन रूप प्रयुक्त है, जैसा हिन्दी बाइबल शैली में नगर-रूपी स्त्री को संबोधित करते समय स्वाभाविक है।
