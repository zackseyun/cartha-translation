  text: בֶּן אָדָ֕ם הוֹדַ֥ע אֶת יְרוּשָׁלִַ֖ם אֶת תּוֹעֲבֹתֶֽי/הָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/016/002.yaml
  text: Son of man[a], make known to Jerusalem her abominations.
translation:
  language: hi
  text: हे मनुष्य के पुत्र, यरूशलेम को उसके घिनौने काम जता दे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֶּן אָדָם
  choice: हे मनुष्य के पुत्र
  rationale: यह शाब्दिक इब्रानी संबोधन है और यहेजकेल में नबी के लिए बार-बार प्रयुक्त विशिष्ट संबोधन को सुरक्षित रखता है। संबोधन सूचित करने के लिए ‘हे’ जोड़ा गया है।
- source_word: הוֹדַע
  choice: जता दे
  rationale: ידע के हिफ़ईल आज्ञार्थक का कारक भाव ‘जानने योग्य बना’ या ‘ज्ञात करा’ है। ‘जता दे’ आधुनिक हिन्दी में स्वाभाविक रहते हुए आदेश और कारक अर्थ दोनों व्यक्त करता है।
- source_word: יְרוּשָׁלִַם
  choice: यरूशलेम
  rationale: स्थान-नाम का हिन्दी में प्रचलित बाइबलीय रूप।
- source_word: תּוֹעֲבֹתֶיהָ
  choice: उसके घिनौने काम
  rationale: תּוֹעֵבָה की प्रबल नैतिक और धार्मिक घृणा को ‘घिनौने’ व्यक्त करता है; ‘काम’ बहुवचन कृत्यों को सहज हिन्दी में स्पष्ट करता है। स्त्रीलिंग एकवचन प्रत्यय का संदर्भ व्यक्तिरूप में चित्रित यरूशलेम है; हिन्दी का ‘उसके’ उसी संबंध को स्वाभाविक रूप से व्यक्त करता है।
theological_decisions:
- issue: यरूशलेम का स्त्री के रूप में मानवीकरण
  choice: ‘उसके घिनौने काम’ द्वारा यरूशलेम से संबंध बनाए रखा गया है।
  alternative: ‘इस नगर के घिनौने काम’ या स्त्रीवाचक ‘उसकी’
  rationale: पूरे अध्याय में यरूशलेम का स्त्री के रूप में मानवीकरण महत्वपूर्ण है। पर आधुनिक मानक हिन्दी में ‘यरूशलेम’ नगर-नाम के साथ ‘उसके काम’ व्याकरणतः स्वाभाविक है; कृत्रिम स्त्रीवाचक सर्वनाम लगाए बिना मूल का आलंकारिक संबंध सुरक्षित रहता है।
translation_notes:
  register: भाषा आधुनिक, संक्षिप्त और गरिमापूर्ण रखी गई है। ‘मनुष्य के पुत्र’ स्थापित स्रोत-सन्निकट संबोधन है; ‘घिनौने काम’ सामान्य पाठक के लिए ‘घृणित कृत्य’ की तुलना में अधिक सहज है, फिर भी भविष्यद्वक्तापरक कठोरता बनाए रखता है।
