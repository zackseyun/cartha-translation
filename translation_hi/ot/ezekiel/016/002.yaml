  source_fidelity: ‘हे मनुष्य के पुत्र’ faithfully renders the recurring vocative בֶּן־אָדָם. ‘यरूशलेम को उसके घिनौने काम जता दे’ preserves the Hiphil imperative’s causative force, Jerusalem as the addressee, the plural object, and the possessive suffix.
