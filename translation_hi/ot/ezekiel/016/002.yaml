  terminology: ‘मनुष्य के पुत्र’ retains the established source-near biblical idiom. ‘घिनौने काम’ communicates the strongly negative force of תּוֹעֵבָה in accessible Hindi without adding interpretive content. ‘उसके’ naturally links the acts to personified Jerusalem, though Hindi does not overtly mark the feminine grammatical personification.
