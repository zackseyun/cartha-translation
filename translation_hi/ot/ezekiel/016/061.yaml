base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/016/061.yaml
  text: Then you will remember your ways and be ashamed when you receive your sisters[a], those older than you along with those younger than you; and I will give them to you as daughters[b], but not because of your covenant.
translation:
  language: hi
  text: तब तू अपने चालचलन को याद करेगी और लज्जित होगी, जब तू अपनी बहनों[a] को—जो तुझसे बड़ी हैं और जो तुझसे छोटी हैं—ग्रहण करेगी; और मैं उन्हें तेरी बेटियों के रूप में तुझे दूँगा, पर तेरी वाचा के कारण नहीं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जब तू अपनी बहनों को लेगी—जो तुझसे बड़ी हैं और जो तुझसे छोटी हैं।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְזָכַרְתְּ
  choice: तब तू ... याद करके
  rationale: संयोजक सहित पूर्ण क्रिया यहाँ भविष्यसूचक परिणाम व्यक्त करती है। ‘तब’ पूर्ववर्ती पुनर्स्थापना के परिणाम को दर्शाता है और ‘याद’ זכר का मूल अर्थ बनाए रखता है।
- source_word: דְּרָכַיִךְ
  choice: अपने चालचलन को
  rationale: דֶּרֶךְ का शाब्दिक अर्थ ‘मार्ग’ है, पर नैतिक प्रसंग में यह आचरण को सूचित करता है। आधुनिक हिन्दी में ‘चालचलन’ इस नैतिक आशय को स्वाभाविक रूप से व्यक्त करता है।
- source_word: וְנִכְלַמְתְּ
  choice: लज्जित होगी
  rationale: נכלם लज्जा अथवा अपमान अनुभव करने को दर्शाता है; स्त्रीलिंग एकवचन संबोधन को हिन्दी में स्पष्ट रखा गया है।
- source_word: בְּקַחְתֵּךְ
  choice: जब तू ... ग्रहण करेगी
  rationale: בְּ सहित infinitive construct को कालवाचक ‘जब’ के रूप में लिया गया है। ‘ग्रहण करेगी’ पुनर्स्थापना और संबंध के प्रसंग में קח के अर्थ को व्यक्त करता है; शाब्दिक विकल्प पादटिप्पणी में रखा गया है।
- source_word: אֲחוֹתַיִךְ
  choice: अपनी बहनों
  rationale: यरूशलेम, सामरिया और सदोम से जुड़ी अध्याय की पारिवारिक रूपक-भाषा को अक्षुण्ण रखा गया है।
- source_word: הַגְּדֹלוֹת מִמֵּךְ אֶל הַקְּטַנּוֹת מִמֵּךְ
  choice: जो तुझसे बड़ी हैं और जो तुझसे छोटी हैं
  rationale: ‘बड़ी’ और ‘छोटी’ मूल विशेषणों को बनाए रखते हैं और बहनों के रूपक में आयु अथवा तुलनात्मक स्थिति की संभावित अर्थ-व्याप्ति को अनावश्यक रूप से सीमित नहीं करते। אֶל यहाँ दोनों समूहों को जोड़ता है।
- source_word: וְנָתַתִּי אֶתְהֶן לָךְ לְבָנוֹת
  choice: मैं उन्हें तेरी बेटियाँ बनाकर तुझे दूँगा
  rationale: לְבָנוֹת का संबंधसूचक परिणाम समकालीन हिन्दी में ‘बेटियाँ बनाकर’ से स्पष्ट और स्वाभाविक रूप से व्यक्त होता है।
- source_word: וְלֹא מִבְּרִיתֵךְ
  choice: पर तेरी वाचा के कारण नहीं
  rationale: מִ यहाँ स्रोत अथवा आधार का निषेध कर सकता है। ‘के कारण नहीं’ यह स्पष्ट करता है कि दिया जाना यरूशलेम की अपनी वाचा से उत्पन्न नहीं होता, जबकि ‘वाचा’ की धर्मवैचारिक भाषा सुरक्षित रहती है।
theological_decisions:
- issue: समापन वाक्यांश ‘तेरी वाचा’ का आशय
  choice: बहनों को बेटियों के रूप में दिया जाना यरूशलेम की अपनी वाचा के कारण या उसके आधार पर नहीं है।
  alternative: यह यरूशलेम द्वारा की गई वाचा के अनुसार नहीं है; अथवा उसकी वाचा के माध्यम से नहीं है।
  rationale: मूल पाठ परमेश्वर के देने के कार्य और यरूशलेम की वाचा के बीच आधारगत संबंध का निषेध करता है। अनुवाद किसी विस्तृत धर्मवैचारिक व्यवस्था या ‘योग्यता’ की अवधारणा को पाठ में जोड़े बिना इस तनाव को बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण भविष्यसूचक शैली रखी गई है। यरूशलेम के लिए मूल स्त्रीलिंग एकवचन संबोधन के अनुरूप ‘तू/तेरी’ और ‘लज्जित होगी/ग्रहण करेगी’ प्रयुक्त हैं। पारिवारिक रूपक और ‘वाचा’ जैसी प्रमुख धर्मवैचारिक शब्दावली सुरक्षित रखी गई है।
