  text: מָ֤ה אֲמֻלָה֙ לִבָּתֵ֔/ךְ נְאֻ֖ם אֲדֹנָ֣/י יְהוִ֑ה בַּ/עֲשׂוֹתֵ/ךְ֙ אֶת כָּל אֵ֔לֶּה מַעֲשֵׂ֥ה אִשָּֽׁה זוֹנָ֖ה שַׁלָּֽטֶת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/016/030.yaml
  text: How weak your heart is[a], declares the Lord GOD, when you do all these things, the deeds of a brazen prostitute,
translation:
  language: hi
  text: “तेरा हृदय कितना दुर्बल है![a]”—प्रभु याहवे की यह घोषणा है—“जब तू ये सब काम करती है, जो एक ढीठ वेश्या के ही हैं।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तेरा हृदय कितना रोगी है!”
    reason: אֲמֻלָה का अर्थ दुर्बल, क्षीण या रोगी होना हो सकता है।
lexical_decisions:
- source_word: מָה אֲמֻלָה
  choice: कितना दुर्बल है
  rationale: מָה यहाँ मात्रा बताने वाला विस्मयादिबोधक प्रयोग है। אֲמֻלָה कमज़ोरी, क्षीणता या रोगग्रस्त दशा का बोध करा सकता है; ‘कितना दुर्बल’ मूल के विस्मय और भीतरी नैतिक दशा, दोनों को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: לִבָּתֵךְ
  choice: तेरा हृदय
  rationale: ‘हृदय’ मूल रूपक को सुरक्षित रखता है और यहाँ मन, इच्छा तथा भीतरी व्यक्तित्व का संकेत देता है। स्त्रीलिंग एकवचन संबोधन के कारण ‘तेरा’ प्रयुक्त है।
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: प्रभु याहवे की यह घोषणा है
  rationale: נְאֻם भविष्यद्वाणी की प्रामाणिक घोषणा का सूत्र है। אֲדֹנָי को ‘प्रभु’ और परमेश्वर के व्यक्तिगत नाम יהוה को ‘याहवे’ रखा गया है।
- source_word: בַּעֲשׂוֹתֵךְ אֶת כָּל אֵלֶּה
  choice: जब तू ये सब काम करती है
  rationale: בְּ के साथ क्रियार्थक संज्ञा को यहाँ कालसूचक ‘जब’ से व्यक्त करना सहज है; ‘ये सब काम’ आरोप की व्यापकता बनाए रखता है।
- source_word: מַעֲשֵׂה אִשָּׁה זוֹנָה
  choice: जो एक … वेश्या के काम हैं
  rationale: मूल में यह पिछले कार्यों का विशेषणात्मक वर्णन है। ‘वेश्या’ זוֹנָה का आधुनिक, स्पष्ट और अनावश्यक रूप से अशिष्ट न होने वाला हिन्दी पर्याय है।
- source_word: שַׁלָּטֶת
  choice: ढीठ
  rationale: यह शब्द अधिकार जताने वाली, हावी होने वाली अथवा निर्लज्ज साहस दिखाने वाली स्त्री का भाव दे सकता है। संदर्भ में ‘ढीठ’ बेशर्मी और दुस्साहस को संक्षेप में व्यक्त करता है, जबकि अन्य संभावनाएँ पादटिप्पणी में सुरक्षित हैं।
theological_decisions:
- issue: אֲדֹנָי יְהוִה में परमेश्वर के नाम का अनुवाद
  choice: प्रभु याहवे
  alternative: प्रभु परमेश्वर
  rationale: मूल पाठ יהוה के व्यक्तिगत वाचा-नाम को स्पष्ट रूप से रखता है। ‘याहवे’ उस नाम को छिपाए बिना प्रस्तुत करता है, जबकि אֲדֹנָי का अर्थ ‘प्रभु’ है।
- issue: यरूशलेम को स्त्रीलिंग एकवचन में संबोधन
  choice: तेरा…तू…करती है
  alternative: तुम्हारा…तुम…करती हो
  rationale: अध्याय में यरूशलेम का मानवीकरण एक स्त्री के रूप में हुआ है और इब्रानी रूप एकवचन हैं। निकट, अभियोगात्मक संबोधन को बनाए रखने के लिए ‘तू’ रखा गया है; इसका उद्देश्य अनादरपूर्ण बोलचाल जोड़ना नहीं, मूल व्याकरणिक संबोधन को व्यक्त करना है।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। स्त्रीलिंग एकवचन संबोधन तथा अध्याय के कठोर वेश्यावृत्ति-रूपक को नरम किए बिना प्रस्तुत किया गया है। घोषणा-सूत्र को डैश के बीच रखने से हिन्दी वाक्य का प्रवाह स्पष्ट रहता है।
