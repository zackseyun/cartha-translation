  edition: WLC
  text: הִנֵּה זֶ֣ה הָיָ֔ה עֲוֺ֖ן סְדֹ֣ם אֲחוֹתֵ֑/ךְ גָּא֨וֹן שִׂבְעַת לֶ֜חֶם וְ/שַׁלְוַ֣ת הַשְׁקֵ֗ט הָ֤יָה לָ/הּ֙ וְ/לִ/בְנוֹתֶ֔י/הָ וְ/יַד עָנִ֥י וְ/אֶבְי֖וֹן לֹ֥א הֶחֱזִֽיקָה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/016/049.yaml
  text: 'Look[a], this was the guilt of your sister Sodom: pride, fullness of bread, and prosperous ease belonged to her and to her daughters[c][b], but she did not strengthen the hand of the poor and needy.'
translation:
  language: hi
  text: 'देख, तेरी बहन सदोम का दोष यह था: उसके और उसकी बेटियों[a] के पास घमंड, रोटी की भरपूरी और निश्चिंत सुख-चैन था, पर उसने गरीब और जरूरतमंद का हाथ मजबूत नहीं किया[b]।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘उसकी बेटियाँ’ से आशय सदोम से जुड़े नगरों या बस्तियों से है।
    reason: cultural_note
  - marker: b
    text: ‘हाथ मजबूत करना’ एक इब्रानी मुहावरा है, जिसका अर्थ सहायता या सहारा देना है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה זֶה
  choice: देख, ... यह था
  rationale: यह अभिव्यक्ति आगे आने वाले स्पष्टीकरण पर जोर देती है। ‘देख’ आधुनिक हिन्दी में उसका स्वाभाविक और प्रभावशाली रूप है।
- source_word: עֲוֺן
  choice: अपराध
  rationale: यह शब्द दोष, अधर्म या दोषपूर्ण कार्य को सूचित कर सकता है। यहाँ सदोम के दोषपूर्ण आचरणों की सूची आरम्भ होती है, इसलिए ‘अपराध’ नैतिक दोष और किए गए अन्याय दोनों को व्यक्त करता है।
- source_word: אֲחוֹתֵךְ
  choice: तेरी बहन
  rationale: यहेजकेल में यरूशलेम और सदोम के बीच पारिवारिक रूपक स्पष्ट और महत्वपूर्ण है, इसलिए उसे बनाए रखा गया है।
- source_word: גָּאוֹן
  choice: घमंड
  rationale: संदर्भ में यह शब्द निंदनीय अहंकार या अभिमान को सूचित करता है; ‘घमंड’ सामान्य आधुनिक हिन्दी में स्पष्ट है।
- source_word: שִׂבְעַת לֶחֶם
  choice: भरपूर रोटी
  rationale: शाब्दिक भाव ‘रोटी की भरपूरी’ है। ‘भरपूर रोटी’ मूल बिंब को रखते हुए पर्याप्त और प्रचुर भोजन का स्वाभाविक हिन्दी अर्थ देती है।
- source_word: שַׁלְוַת הַשְׁקֵט
  choice: निश्चिंत सुख-चैन
  rationale: यह संयुक्त अभिव्यक्ति समृद्धि से उपजी शांति, सुरक्षा और निष्क्रिय आराम का भाव रखती है। यह अनुवाद दोनों पहलुओं को सहज हिन्दी में व्यक्त करता है।
- source_word: בְנוֹתֶיהָ
  choice: उसकी बेटियाँ
  rationale: मूल में शाब्दिक रूप से ‘उसकी बेटियाँ’ है। भविष्यद्वक्ताओं की नगरीय भाषा में इससे सदोम से जुड़े नगर या बस्तियाँ अभिप्रेत हैं; मुख्य पाठ में रूपक सुरक्षित रखा गया है।
- source_word: יָד ... לֹא הֶחֱזִיקָה
  choice: हाथ मजबूत नहीं किया
  rationale: मूल इब्रानी बिंब को बनाए रखा गया है। यह मुहावरा सहायता देने या सहारा देने का अर्थ रखता है, जिसे पादटिप्पणी में स्पष्ट किया गया है।
- source_word: עָנִי וְאֶבְיוֹן
  choice: गरीब और जरूरतमंद
  rationale: यह सामान्य युग्म आर्थिक और सामाजिक रूप से कमजोर लोगों को सूचित करता है। चुना हुआ रूप आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: הָיָה לָהּ וְלִבְנוֹתֶיהָ
  choice: उसके और उसकी बेटियों के पास ... था
  rationale: यह हिन्दी में स्वाभाविक अधिकारसूचक रचना है और बताती है कि ये स्थितियाँ सदोम तथा उससे जुड़ी बस्तियों में विद्यमान थीं।
theological_decisions:
- issue: इस पद में सदोम के अपराध का स्वरूप
  choice: पद में स्पष्ट रूप से बताए गए सामाजिक और नैतिक अपराध—घमंड, भोजन की प्रचुरता, निश्चिंत आराम और गरीबों की उपेक्षा—ही प्रस्तुत किए गए हैं।
  alternative: अनुवाद में संकेत द्वारा केवल यौन पाप को प्रमुख बनाना।
  rationale: इस पद का इब्रानी पाठ घमंड, प्रचुरता, सुख-चैन और गरीब तथा जरूरतमंद की सहायता न करने को स्पष्ट रूप से नाम देता है। अनुवाद बाद की व्याख्यात्मक बहस को पाठ में नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘तेरी’ सम्बोधन मूल के एकवचन स्त्रीलिंग रूप और यरूशलेम को संबोधित भविष्यद्वाणी के सीधे स्वर को सुरक्षित रखता है। मूल के पारिवारिक तथा शारीरिक बिंबों को मुख्य पाठ में बनाए रखते हुए आवश्यक सांस्कृतिक और मुहावरेदार अर्थ पादटिप्पणियों में दिए गए हैं।
