  text: वे घमंड से फूल गईं[a] और मेरे सामने घिनौना काम किया। इसलिए जब मैंने यह देखा[b], तो मैंने उन्हें दूर कर दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वे घमंडी हो गईं” अथवा “वे अहंकारी हो गईं।”
    reason: lexical_alternative
