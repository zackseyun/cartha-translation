    text: शाब्दिक रूप से, “जब/जैसा मैंने देखा।” हिब्रू में ‘देखा’ का कर्म व्यक्त नहीं है; यहाँ वह पूर्ववर्ती घिनौने काम से समझा जाता है।
    reason: source_ambiguity
lexical_decisions:
- source_word: וַתִּגְבְּהֶינָה
  choice: वे घमण्ड से फूल गईं
  rationale: גבהּ का मूल भाव ऊँचा होना है; इस नैतिक अभियोग के प्रसंग में यह घमण्डी या अहंकारी हो जाने का बोध देता है। यह हिन्दी अभिव्यक्ति उस रूपक और नकारात्मक अर्थ दोनों को बनाए रखती है।
- source_word: וַתַּעֲשֶׂינָה תוֹעֵבָה
  choice: घिनौना काम करने लगीं
  rationale: עשה सामान्यतः ‘करना’ और תועבה अत्यन्त घृणित, विशेषतः परमेश्वर की दृष्टि में निंदनीय कार्य को दर्शाता है। ‘घिनौना काम’ आधुनिक हिन्दी में स्वाभाविक है और प्रबल नैतिक-धार्मिक भाव बनाए रखता है।
- source_word: לְפָנָי
  choice: मेरे सामने
  rationale: यह परमेश्वर की उपस्थिति और दृष्टि में किए गए कार्य का सीधा, स्वाभाविक हिन्दी रूप है।
- source_word: וָאָסִיר אֶתְהֶן
  choice: मैंने उन्हें दूर कर दिया
  rationale: हिफ़ील रूप यहाँ हटाने या दूर कर देने का अर्थ देता है। यह न्याय की कार्रवाई को स्पष्ट रखता है, पर उसके ढंग के बारे में अतिरिक्त विवरण नहीं जोड़ता।
- source_word: כַּאֲשֶׁר רָאִיתִי
  choice: जब मैंने देखा
  rationale: हिब्रू में क्रिया ‘मैंने देखा’ का कर्म स्पष्ट रूप से नहीं दिया गया है। मुख्य पाठ इस अपूर्णता को बनाए रखता है और टिप्पणी सम्भावित अर्थ स्पष्ट करती है।
theological_decisions:
- issue: परमेश्वर के न्याय का वर्णन
  choice: मैंने उन्हें दूर कर दिया
  alternative: मैंने उन्हें मिटा दिया
  rationale: मूल क्रिया हटाने का अर्थ देती है। ‘मिटा दिया’ विनाश की रीति को अधिक निश्चित कर देगा, जबकि इस पद में वह स्पष्ट नहीं की गई।
- issue: כַּאֲשֶׁר רָאִיתִי का अर्थ
  choice: जब मैंने देखा
  alternative: जैसा मुझे उचित लगा
  rationale: मुख्य पाठ कालवाचक अर्थ और मूल की अनिर्दिष्टता को सुरक्षित रखता है। ‘जैसा मुझे उचित लगा’ सम्भव व्याख्यात्मक अर्थ है, पर वह ‘देखने’ को निर्णय या उपयुक्तता के भाव में स्पष्ट कर देता है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की है। स्त्रीलिंग बहुवचन ‘गईं/लगीं’ मूल पाठ के स्त्रीलिंग बहुवचन रूपों को बनाए रखता है, जो प्रसंग में नगरों को स्त्रियों के रूप में संबोधित किए जाने से मेल खाता है। ‘घिनौना काम’ साधारण पाठक के लिए ‘घृणित कार्य’ की अपेक्षा अधिक स्वाभाविक है, फिर भी मूल की तीव्र निंदा को सुरक्षित रखता है।
