  text: और मैंने तेरी नाक में नथ[a], तेरे कानों में बालियाँ, और तेरे सिर पर शोभायमान मुकुट रखा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “नाक की बाली।” इब्रानी शब्द נֶזֶם अंगूठी-जैसे आभूषण को दर्शाता है, जो यहाँ नाक में पहना गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶתֵּן
  choice: और मैंने…रखा
  rationale: נתן का मूल अर्थ ‘देना/रखना’ है; आभूषण पहनाने के इस प्रसंग में हिन्दी का ‘रखा’ स्वाभाविक रूप से ठोस क्रिया व्यक्त करता है।
- source_word: נֶזֶם עַל אַפֵּךְ
  choice: तेरी नाक में नथ
  rationale: נֶזֶם अंगूठी-जैसा आभूषण है और אַף उसके नाक में पहने जाने को स्पष्ट करता है। आधुनिक हिन्दी में ‘नथ’ इसका सटीक और सहज समतुल्य है; ‘में’ आभूषण पहनने का स्वाभाविक हिन्दी प्रयोग है।
- source_word: וַעֲגִילִים עַל אָזְנָיִךְ
  choice: तेरे कानों में बालियाँ
  rationale: עֲגִילִים कान के आभूषण हैं। ‘बालियाँ’ सामान्य आधुनिक हिन्दी में स्पष्ट है, और ‘कानों में’ स्वाभाविक प्रयोग है।
- source_word: וַעֲטֶרֶת תִּפְאֶרֶת
  choice: शोभायमान मुकुट
  rationale: עֲטֶרֶת ‘मुकुट’ है और תִּפְאֶרֶת सौन्दर्य, शोभा या वैभव का भाव जोड़ता है। ‘शोभायमान मुकुट’ इस विशेषणात्मक अर्थ को गरिमापूर्ण और सहज हिन्दी में व्यक्त करता है।
- source_word: בְּרֹאשֵׁךְ
  choice: तेरे सिर पर
  rationale: मुकुट के संदर्भ में בְּ का आशय सिर पर स्थित या रखा होना है; हिन्दी में ‘सिर पर’ स्वाभाविक है।
