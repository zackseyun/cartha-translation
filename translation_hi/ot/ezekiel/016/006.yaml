base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/016/006.yaml
  text: And I passed by you and saw you wallowing in your blood[a], and I said to you, ‘In your blood, live!’ Yes, I said to you, ‘In your blood[b], live!’
translation:
  language: hi
  text: मैं तेरे पास से गुज़रा और तुझे तेरे खून में छटपटाती देखा। मैंने तुझसे कहा, “तेरे खून में जीवित रह!”[a] और मैंने तुझसे कहा, “तेरे खून में जीवित रह!”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तेरे खून में होने पर भी जीवित रह!” हिब्रू पूर्वसर्ग का प्रसंग में रियायती अर्थ भी समझा जा सकता है।
    reason: alternative_reading
  - marker: b
    text: “तेरे खून में जीवित रह!” यह पंक्ति हिब्रू में बल देने के लिए दोहराई गई है।
    reason: repetition
lexical_decisions:
- source_word: וָאֶעֱבֹר עָלַיִךְ
  choice: मैं तेरे पास से होकर निकला
  rationale: עבר के साथ על यहाँ किसी के पास से गुजरने की गति व्यक्त करता है। यह हिन्दी में स्वाभाविक है और दृश्य की गति को बनाए रखता है।
- source_word: וָאֶרְאֵךְ
  choice: मैंने तुझे ... देखा
  rationale: ראה का सीधा अर्थ ‘देखना’ है; हिन्दी वाक्य-रचना में कर्ता को दोहराने से कथन स्पष्ट और स्वाभाविक रहता है।
- source_word: מִתְבּוֹסֶסֶת
  choice: छटपटाते
  rationale: यह रूप खून में पड़े नवजात की असहाय शारीरिक हलचल का सजीव चित्र देता है। ‘लोटते’ से जानबूझकर किए गए कार्य या नैतिक घृणा का अनचाहा भाव आ सकता है। स्त्रीलिंग सम्बोधित पात्र के साथ ‘तुझे ... छटपटाते’ व्याकरणतः स्वाभाविक है।
- source_word: בְּדָמָיִךְ
  choice: अपने ही खून में
  rationale: हिब्रू का बहुवचन रूप इस प्रसंग में हिन्दी में स्वाभाविक रूप से ‘खून’ है। ‘ही’ तीखे दृश्य और सम्बोधित बालिका के अपने खून पर बल देता है, पर इसे केवल जन्म का खून या रक्तपात मानकर सीमित नहीं करता।
- source_word: וָאֹמַר לָךְ
  choice: तब मैंने तुझसे कहा
  rationale: אמר ל का अर्थ सीधे ‘किसी से कहना’ है। ‘तब’ क्रम को सहज बनाता है, बिना कोई नई व्याख्या जोड़े।
- source_word: בְּדָמַיִךְ חֲיִי
  choice: अपने खून में ही जीवित रह!
  rationale: पूर्वसर्गीय पद के बाद स्त्रीलिंग एकवचन आज्ञार्थक क्रिया की संक्षिप्त और प्रबल रचना को बनाए रखा गया है। ‘जीवित रह’ आधुनिक हिन्दी में ‘जी!’ की अपेक्षा स्पष्ट है और हिब्रू की अस्पष्टता को व्याख्यात्मक विस्तार से नहीं मिटाता।
- source_word: וָאֹמַר לָךְ ... חֲיִי (repeated)
  choice: हाँ, मैंने तुझसे कहा, “अपने खून में ही जीवित रह!”
  rationale: दूसरी बार आए पूरे कथन को बनाए रखने से हिब्रू का जानबूझकर किया गया बलाघात दिखाई देता है; ‘हाँ’ उसकी पुष्टि और तीव्रता को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: בְּדָמַיִךְ חֲיִי में ב का अर्थ
  choice: 'मुख्य पाठ में स्थानवाचक रूप: “अपने खून में ही जीवित रह!”'
  alternative: 'रियायती अर्थ: “अपने खून में पड़े होने पर भी जीवित रह!”'
  rationale: हिब्रू वाक्य अत्यन्त संक्षिप्त है और ב को स्थानवाचक या प्रसंगानुसार रियायती समझा जा सकता है। मुख्य पाठ उसकी काव्यात्मक कठोरता और वास्तविक अस्पष्टता बनाए रखता है; वैकल्पिक अर्थ पादटिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सजीव हिन्दी; स्त्रीलिंग पात्र को संबोधित करते हुए निकटता और मूल के एकवचन रूप के लिए ‘तू’ के रूप प्रयुक्त हैं। कठोर रक्त-चित्र और दोहराव को नरम नहीं किया गया है।
