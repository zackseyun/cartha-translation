  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וָ/אֶרְחָצֵ֣/ךְ בַּ/מַּ֔יִם וָ/אֶשְׁטֹ֥ף דָּמַ֖יִ/ךְ מֵֽ/עָלָ֑יִ/ךְ וָ/אֲסֻכֵ֖/ךְ בַּ/שָּֽׁמֶן׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/016/009.yaml
  text: Then I washed you with water[a], rinsed your blood off you[b], and anointed you with oil.
translation:
  language: hi
  text: तब मैंने तुम्हें पानी से नहलाया[a], तुम्हारे ऊपर लगा खून धो डाला[b] और तुम्हारे शरीर पर तेल लगाया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘पानी से धोया।’
    reason: lexical_alternative
  - marker: b
    text: अधिक शाब्दिक रूप में, ‘तुम्हारे ऊपर से तुम्हारा खून धो डाला।’
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶרְחָצֵךְ
  choice: मैंने तुम्हें नहलाया
  rationale: רחץ का अर्थ धोना या नहलाना हो सकता है। इस प्रसंग में पूरे शरीर की देखभाल का चित्र है, इसलिए ‘नहलाया’ स्वाभाविक और सटीक है।
- source_word: בַּמַּיִם
  choice: पानी से
  rationale: यहाँ ב साधन को व्यक्त करता है; आधुनिक हिन्दी में ‘पानी से नहलाया’ सहज प्रयोग है।
- source_word: וָאֶשְׁטֹף
  choice: धो डाला
  rationale: שטף यहाँ शरीर पर से खून को धोकर हटा देने का बोध देता है। ‘धो डाला’ क्रिया की पूर्णता और ठोस शारीरिक देखभाल दोनों व्यक्त करता है।
- source_word: דָּמַיִךְ
  choice: खून
  rationale: हिब्रू का बहुवचन रूप रक्त के लिए प्रचलित प्रयोग है। ‘खून’ सीधा अनुवाद है; ‘खून के धब्बे’ कहना अनावश्यक व्याख्या जोड़ता।
- source_word: מֵעָלָיִךְ
  choice: तुम्हारे ऊपर लगा
  rationale: शाब्दिक अर्थ ‘तुम्हारे ऊपर से’ है। हिन्दी में खून हटाने की क्रिया के साथ ‘तुम्हारे ऊपर लगा खून’ अधिक स्वाभाविक ढंग से वही स्थानिक चित्र व्यक्त करता है।
- source_word: וָאֲסֻכֵךְ בַּשָּׁמֶן
  choice: तुम्हारे शरीर पर तेल लगाया
  rationale: סוך का अर्थ शरीर पर तेल लगाना या मलना है। ‘अभिषेक किया’ सम्भव होते हुए भी यहाँ अनुष्ठानिक अर्थ का आभास दे सकता है; ठोस शारीरिक देखभाल के प्रसंग में ‘तेल लगाया’ अधिक उपयुक्त है।
theological_decisions:
- issue: रूपक में शुद्ध करने और तेल लगाने के कार्यों का स्वरूप
  choice: इन कार्यों को रूपक के भीतर शिशु/स्त्री के शरीर की वास्तविक देखभाल के रूप में व्यक्त किया गया है।
  alternative: मुख्य पाठ में इन्हें वाचा, संस्कार या उपासना-विधि के संकेतों के रूप में स्पष्ट करना।
  rationale: पद स्वयं पानी से नहलाने, खून हटाने और तेल लगाने की ठोस क्रियाएँ बताता है। यरूशलेम से जुड़े व्यापक धार्मिक अर्थ संदर्भ से उभरते हैं; उन्हें इस पद के शब्दों में जोड़ना उचित नहीं।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और ठोस शारीरिक देखभाल का बिंब रखने वाली भाषा चुनी गई है। ‘अभिषेक’ जैसे संभावित अनुष्ठानिक शब्द से बचकर मूल क्रिया का सामान्य अर्थ व्यक्त किया गया है।
