  yaml_path: translation/ot/ezekiel/016/047.yaml
  text: Yet you did not walk in their ways or act according to their abominations[a]; as if that were too little[b], you became more corrupt than they in all your ways.
translation:
  language: hi
  text: तूने न केवल उनके मार्गों पर चलकर उनके घिनौने काम किए[a], बल्कि मानो यह बहुत छोटी-सी बात हो[b], तू अपने सभी मार्गों में उनसे भी अधिक भ्रष्ट हो गई।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी वाक्य-विन्यास को बहुत शाब्दिक रूप से “तू उनके मार्गों पर नहीं चली और उनके घिनौने काम किए” पढ़ा जा सकता है। पर आगे के “बहुत छोटी-सी बात” और “उनसे भी अधिक” के कारण यहाँ आशय “न केवल ...” के रूप में लिया गया है।
    reason: source_ambiguity
  - marker: b
    text: 'इब्रानी मुहावरा: “मानो बहुत छोटी-सी बात हो।” भाव यह है कि उनके समान पाप करना भी यरूशलेम के लिए पर्याप्त नहीं था; वह उनसे आगे निकल गई।'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּדַרְכֵיהֶן ... הָלַכְתְּ
  choice: उनके मार्गों पर चली
  rationale: הלך בְּדֶרֶךְ आचरण या जीवन-पद्धति के अनुसार चलने का मुहावरा है। यह अनुवाद इब्रानी रूपक और स्त्रीलिंग एकवचन संबोधन दोनों को बनाए रखता है।
- source_word: וּבְתוֹעֲבוֹתֵיהֶן עשיתי
  choice: उनके घिनौने काम किए
  rationale: संदर्भ में क्रिया का अर्थ स्त्रीलिंग एकवचन ‘तूने किए’ है। תּוֹעֵבָה के लिए ‘घिनौने काम’ आधुनिक हिन्दी में स्वाभाविक है और यहेजकेल की नैतिक तथा उपासना-संबंधी कड़ी निंदा को व्यक्त करता है।
- source_word: כִּמְעַט קָט
  choice: मानो यह बहुत छोटी-सी बात थी
  rationale: 'यह संक्षिप्त इब्रानी मुहावरा व्यंग्यात्मक बढ़ोतरी व्यक्त करता है: उनके समान पाप करना ही यरूशलेम के लिए पर्याप्त नहीं था। हिन्दी वाक्यांश उस आलंकारिक बल को सहज रूप में रखता है।'
- source_word: וַתַּשְׁחִתִי
  choice: तू ... अधिक भ्रष्ट हो गई
  rationale: שׁחת यहाँ नैतिक पतन के अकर्मक या आत्मवाची भाव में है। ‘भ्रष्ट हो गई’ वर्तमान हिन्दी में स्पष्ट है और स्त्रीलिंग संबोधन से मेल खाता है।
- source_word: מֵהֵן
  choice: उनसे भी अधिक
  rationale: तुलनात्मक מִן यरूशलेम के उनके मुकाबले अधिक भ्रष्ट होने को व्यक्त करता है।
- source_word: בְּכָל דְּרָכָיִךְ
  choice: अपने सभी मार्गों में
  rationale: ‘मार्गों’ से דרך की पुनरावृत्ति बनी रहती है और सम्पूर्ण आचरण का भाव आता है।
theological_decisions:
- issue: सामरिया और सदोम की तुलना में यरूशलेम का दोष
  choice: यरूशलेम को केवल उनका अनुकरण करने वाली नहीं, बल्कि अपने सभी मार्गों में उनसे भी अधिक भ्रष्ट बताया गया है।
  alternative: यरूशलेम उनके मार्गों पर नहीं चली, पर किसी भिन्न अर्थ में भ्रष्ट हुई; अथवा वह केवल थोड़ा-सा भटकी।
  rationale: כִּמְעַט קָט के बाद וַתַּשְׁחִתִי מֵהֵן तुलनात्मक और व्यंग्यात्मक बढ़ोतरी को सबसे स्वाभाविक रूप से व्यक्त करता है। इससे भविष्यद्वाणी का कठोर अभियोग बना रहता है, बिना किसी बाद की धर्मसैद्धांतिक धारणा को जोड़े।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण भविष्यद्वाणी-संबंधी शैली रखी गई है। यरूशलेम को स्त्रीलिंग एकवचन ‘तू’ से संबोधित किया गया है, जैसा इब्रानी व्याकरण और अध्याय के रूपक में है। ‘मार्ग’ की पुनरावृत्ति मूल पाठ की साहित्यिक संगति बनाए रखती है।
