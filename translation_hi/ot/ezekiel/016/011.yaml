  yaml_path: translation/ot/ezekiel/016/011.yaml
  text: I adorned you with jewelry[c][b][a], and I put bracelets on your hands and a necklace on your neck.
translation:
  language: hi
  text: मैंने तुझे आभूषणों से सजाया[a], और मैंने तेरे हाथों पर कंगन[b] और तेरे गले में हार[c] रखे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “साज-सज्जा से सजाया।”
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से “तेरे हाथों पर”; यहाँ कलाई या बाँह भी अभिप्रेत हो सकती है।
    reason: lexical_alternative
  - marker: c
    text: या “जंजीर।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶעְדֵּךְ עֶדִי
  choice: मैंने तुझे आभूषणों से सजाया
  rationale: क्रिया עדה और संज्ञा עֶדִי मिलकर आभूषणों से सजाने का भाव देते हैं। यह हिन्दी में स्वाभाविक है और आगे गिनाए गए गहनों के अनुकूल है।
- source_word: צְמִידִים
  choice: कंगन
  rationale: यह बहुवचन संज्ञा हाथ या बाँह पर पहने जाने वाले सजावटी छल्लों को दर्शाती है; ‘कंगन’ आधुनिक हिन्दी का स्पष्ट और स्वाभाविक समतुल्य है।
- source_word: עַל יָדַיִךְ
  choice: तेरे हाथों में
  rationale: יָד का अर्थ हाथ के साथ बाँह या कलाई तक विस्तृत हो सकता है। हिन्दी में कंगन ‘हाथों में’ पहनना सहज मुहावरा है और इब्रानी अभिव्यक्ति के निकट भी है।
- source_word: רָבִיד
  choice: हार
  rationale: यह गले में पहने जाने वाले आभूषण, संभवतः जंजीर या हार, को दर्शाता है। ‘हार’ प्रसंग में सबसे स्वाभाविक सामान्य हिन्दी शब्द है।
- source_word: עַל גְּרוֹנֵךְ
  choice: तेरे गले में
  rationale: גָּרוֹן गला या कंठ है। गहने के संदर्भ में हिन्दी का स्वाभाविक प्रयोग ‘गले में’ है।
theological_decisions:
- issue: परमेश्वर द्वारा यरूशलेम को सजाई गई स्त्री के रूप में चित्रित करना
  choice: अलंकरण के ठोस रूपक को बिना व्याख्यात्मक विस्तार के बनाए रखा गया है।
  alternative: मुख्य पाठ में इसे वाचा की आशीष या दुल्हन की तैयारी के रूप में स्पष्ट करना।
  rationale: यह पद यहेजकेल के विस्तृत रूपक का भाग है, पर अनुवाद को उसके ठोस चित्र को सुरक्षित रखना चाहिए और धर्मवैज्ञानिक व्याख्या को मूल शब्दों में नहीं जोड़ना चाहिए।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। सम्बोधन का एकवचन स्त्रीलिंग प्रसंग से स्पष्ट है; हिन्दी में ‘तुझे/तेरे’ रूप मूल की निकटता और काव्यात्मक गंभीरता बनाए रखते हैं।
