  text: I clothed you with embroidered cloth[a], put fine leather sandals on you, wrapped you in fine linen[b], and covered you with silk.
translation:
  language: hi
  text: मैंने तुझे कढ़ाईदार कपड़ा पहनाया, तेरे पैरों में उत्तम चमड़े[a] की जूतियाँ पहनाईं, तुझे महीन सन-वस्त्र में लपेटा और रेशमी वस्त्र[b] से ढका।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी תָּחַשׁ उस सामग्री को दर्शाता है जिससे उत्तम पादत्राण बनाए जाते थे; वह किस पशु या स्रोत से मिलती थी, यह निश्चित नहीं है।
    reason: lexical_alternative
  - marker: b
    text: या ‘बहुमूल्य कपड़े’; इब्रानी शब्द की ठीक पहचान अनिश्चित है।
    reason: lexical_alternative
lexical_decisions:
- source_word: רִקְמָה
  choice: कढ़ाईदार वस्त्र
  rationale: यह संज्ञा कढ़ाई किए हुए कपड़े या कढ़ाई के काम को दर्शाती है। ‘कढ़ाईदार वस्त्र’ हिन्दी में स्वाभाविक है और किसी विशेष प्रकार के परिधान का अनावश्यक निर्धारण नहीं करता।
- source_word: תָּחַשׁ
  choice: उत्तम चमड़ा
  rationale: इस शब्द से अभिप्रेत पशु या सामग्री की ठीक पहचान अनिश्चित है। पादत्राण और विलासिता के प्रसंग में ‘उत्तम चमड़ा’ अर्थ को स्पष्ट रखता है और अटकलपूर्ण प्राणी-निर्धारण से बचता है।
- source_word: וָאֶנְעֲלֵךְ תָּחַשׁ
  choice: तेरे पैरों में उत्तम चमड़े की जूतियाँ पहनाईं
  rationale: הנעל का causative रूप किसी को पादत्राण पहनाने का भाव देता है। ‘जूतियाँ पहनाईं’ आधुनिक हिन्दी में सहज है और प्रसंगानुसार निहित पादत्राण को स्पष्ट करता है।
- source_word: שֵׁשׁ
  choice: बढ़िया मलमल
  rationale: שֵׁשׁ उच्च कोटि के महीन सन-वस्त्र का द्योतक है। ‘बढ़िया मलमल’ उसकी महीनता और विलासपूर्ण गुण को सामान्य हिन्दी में व्यक्त करता है।
- source_word: וָאֶחְבְּשֵׁךְ בַּשֵּׁשׁ
  choice: तुझे बढ़िया मलमल में लपेटा
  rationale: חבש के अर्थ बाँधना, लपेटना या कमरबंद बाँधना हो सकते हैं। वस्त्र पहनाने के इस क्रम में ‘लपेटा’ स्वाभाविक है और चिकित्सकीय पट्टी का अनचाहा संकेत नहीं देता।
- source_word: מֶשִׁי
  choice: रेशमी वस्त्र
  rationale: यह किसी बहुमूल्य कपड़े को सूचित करता है और परंपरागत रूप से रेशम समझा जाता है। सटीक पहचान अनिश्चित होने के कारण विकल्प को पाद-टिप्पणी में रखा गया है।
- source_word: וָאֲכַסֵּךְ
  choice: ढका
  rationale: כסה का सीधा अर्थ ढकना है। यह एक के ऊपर एक बहुमूल्य वस्त्र पहनाने की छवि के अनुकूल है।
