  yaml_path: translation/ot/ezekiel/016/056.yaml
  text: Was not Sodom your sister a byword in your mouth in the day of your pride?[a]
translation:
  language: hi
  text: क्या तेरे घमण्ड के दिनों में तेरी बहन सदोम की चर्चा तेरी बातों में नहीं होती थी?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “सुनी हुई बात,” “समाचार,” या “लोगों में कही जाने वाली बात।” हिब्रू शब्द किसी ऐसी बात का अर्थ भी दे सकता है जो लोगों में सुनाई और कही जाती हो।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלֹא
  choice: क्या ... न थी?
  rationale: सन्दर्भ में संयोजक और निषेध मिलकर भर्त्सना से भरा आलंकारिक प्रश्न बनाते हैं; आधुनिक हिन्दी में ‘क्या ... न थी?’ उसी बल को स्वाभाविक रूप से व्यक्त करता है।
- source_word: הָיְתָה
  choice: थी
  rationale: यहाँ היה का क़ाल पूर्ण रूप अतीत की साधारण अवस्था बताता है।
- source_word: סְדֹם
  choice: सदोम
  rationale: व्यक्तिवाचक स्थान-नाम का प्रचलित हिन्दी लिप्यन्तरण।
- source_word: אֲחוֹתֵךְ
  choice: तेरी बहन
  rationale: बहन-नगरों का रूपक अध्याय में महत्त्वपूर्ण है, इसलिए वास्तविक रिश्तेदारी-सूचक शब्द को बनाए रखा गया है।
- source_word: לִשְׁמוּעָה
  choice: चर्चा का विषय
  rationale: שְׁמוּעָה का अर्थ सुनी हुई बात, समाचार या लोगों में कही जाने वाली बात हो सकता है। ‘तेरे मुँह में’ के साथ ‘चर्चा का विषय’ सहज हिन्दी है और मूल की अर्थगत व्यापकता को अपेक्षाकृत सुरक्षित रखता है; ‘कहावत’ अधिक संकीर्ण अर्थ दे सकती है।
- source_word: בְּפִיךְ
  choice: तेरे मुँह में
  rationale: मूल हिब्रू मुहावरे को निकटता से रखा गया है; हिन्दी में यह समझ में आता है और वाणी में बार-बार उल्लेख का भाव देता है।
- source_word: בְּיוֹם
  choice: के दिनों में
  rationale: एकवचन हिब्रू काल-सूचक मुहावरा किसी अवधि या समय को दर्शा सकता है; ‘के दिनों में’ हिन्दी में स्वाभाविक है।
- source_word: גְּאוֹנָיִךְ
  choice: तेरे घमण्ड
  rationale: यहाँ द्विवचन/बहुवचन-सदृश रूप अहंकारी आत्म-उत्थान को व्यक्त करता है; ‘घमण्ड’ स्पष्ट, संक्षिप्त और सन्दर्भानुकूल है।
theological_decisions:
- issue: सदोम के विषय में कथन का आलंकारिक बल
  choice: 'इसे आलंकारिक प्रश्न के रूप में अनूदित किया गया: ‘क्या ... न थी?’'
  alternative: 'इसे सीधा नकारात्मक कथन माना जा सकता है: ‘तेरी बहन सदोम ... चर्चा का विषय न थी।’'
  rationale: आरम्भिक निषेध और पूर्ण क्रिया का क्रम भविष्यद्वक्ता की भर्त्सना के सन्दर्भ में आलंकारिक प्रश्न को स्वाभाविक बनाता है। फिर भी मूल की सम्भावित कथनात्मक व्याख्या को टिप्पणी में स्वीकार किया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, प्रत्यक्ष भविष्यद्वाणी शैली रखी गई है। यरूशलेम को स्त्रीलिंग एकवचन में सम्बोधित करते हुए ‘तेरी’ और ‘तेरे’ का प्रयोग अध्याय की निकट और आरोपात्मक वाणी को बनाए रखता है।
