base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/016/059.yaml
  text: 'For thus says the Lord GOD: I will deal with you as you have done[a], because you despised the oath by breaking the covenant.'
translation:
  language: hi
  text: 'क्योंकि प्रभु यहोवा यों कहता है: “मैं तेरे साथ वैसा ही व्यवहार करूँगा जैसा तूने किया है, क्योंकि तूने वाचा को तोड़कर शपथ[a] को तुच्छ जाना।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “शाप”; इब्रानी शब्द ऐसी शपथ को भी सूचित कर सकता है जिसके साथ वाचा तोड़ने पर शाप का दंड जुड़ा हो।
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  choice: प्रभु यहोवा
  rationale: उपाधि אֲדֹנָי और परमेश्वर के व्यक्तिगत नाम יְהוִה—दोनों को स्पष्ट रूप से बनाए रखता है और हिन्दी की भविष्यद्वक्ताई शैली में स्वाभाविक है।
- source_word: וְעָשִׂית אוֹתָךְ
  choice: मैं तेरे साथ ... करूँगा
  rationale: עשה + कर्म का मुहावरा यहाँ किसी के साथ उसके कर्मों के अनुसार व्यवहार करने का न्यायिक भाव रखता है; यह हिन्दी में स्वाभाविक रहते हुए उस बल को बनाए रखता है।
- source_word: כַּאֲשֶׁר עָשִׂית
  choice: वैसा ही ... जैसा तूने किया है
  rationale: כַּאֲשֶׁר के तुलनात्मक भाव और यरूशलेम के पिछले आचरण के सीधे संदर्भ, दोनों को सुरक्षित रखता है।
- source_word: בָּזִית
  choice: तुच्छ जाना
  rationale: בזה का अर्थ अवमानना करना या तुच्छ समझना है; यह चयन आरोप की प्रबलता को संक्षेप और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: אָלָה
  choice: शपथ
  rationale: वाचा के प्रसंग में यह शब्द बंधनकारी शपथ को सूचित कर सकता है, यद्यपि उसमें शाप-दंड का भाव भी हो सकता है; वैकल्पिक अर्थ पादटिप्पणी में रखा गया है।
- source_word: לְהָפֵר בְּרִית
  choice: वाचा तोड़कर
  rationale: הפר ברית वाचा का उल्लंघन करने की प्रचलित अभिव्यक्ति है। कृदन्तीय हिन्दी रचना शपथ के तिरस्कार और वाचा तोड़ने के बीच संबंध को स्वाभाविक ढंग से व्यक्त करती है।
theological_decisions:
- issue: אֲדֹנָי יְהוִה में परमेश्वर के नाम का अनुवाद
  choice: प्रभु यहोवा
  alternative: प्रभु परमेश्वर
  rationale: ‘यहोवा’ वाचा में प्रकट किए गए व्यक्तिगत नाम को बनाए रखता है, जबकि ‘प्रभु’ אֲדֹנָי की उपाधि को दर्शाता है; इस प्रकार दोनों तत्व बिना मिलाए सुरक्षित रहते हैं।
- issue: वाचा के प्रसंग में אָלָה का अर्थ
  choice: शपथ
  alternative: शाप
  rationale: तत्काल वाक्य-विन्यास में बंधनकारी वाचा-शपथ का भाव उपयुक्त है, पर शब्द में शपथ से जुड़े शाप-दंड का वास्तविक अर्थ भी संभव है; इसलिए उस तनाव को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण भविष्यद्वक्ताई शैली अपनाई गई है। स्त्रीलिंग एकवचन संबोधन यरूशलेम के मानवीकरण के अनुरूप ‘तेरे/तूने’ से व्यक्त है।
