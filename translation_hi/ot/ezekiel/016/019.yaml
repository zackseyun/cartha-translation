source:
  edition: WLC
  text: וְ/לַחְמִ/י֩ אֲשֶׁר נָתַ֨תִּי לָ֜/ךְ סֹ֣לֶת וָ/שֶׁ֤מֶן וּ/דְבַשׁ֙ הֶֽאֱכַלְתִּ֔י/ךְ וּ/נְתַתִּ֧י/הוּ לִ/פְנֵי/הֶ֛ם לְ/רֵ֥יחַ נִיחֹ֖חַ וַ/יֶּ֑הִי נְאֻ֖ם אֲדֹנָ֥/י יְהוִֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/016/019.yaml
  text: And my bread that I gave you—fine flour[a], oil, and honey with which I fed you—you set before them as a pleasing aroma, and so it was[c][b], declares the Lord GOD.
translation:
  language: hi
  text: और मेरी रोटी, जो मैंने तुझे दी थी—मैदा[a], तेल और मधु, जिनसे मैंने तुझे खिलाया था—तूने उसे सुखदायक सुगंध के रूप में उनके सामने रख दिया। ऐसा ही हुआ[b]—प्रभु यहोवा की घोषणा है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘मेरा भोजन।’ इब्रानी में ‘रोटी’ कभी-कभी व्यापक अर्थ में भोजन को भी दर्शाती है।
    reason: lexical_alternative
  - marker: b
    text: ‘सुखदायक सुगंध’ बलिदानों से जुड़ी प्रचलित भाषा है; यहाँ इसका प्रयोग मूर्तियों के सामने रखी गई भेंट के लिए विडम्बनापूर्वक हुआ है।
    reason: cultural_note
lexical_decisions:
- source_word: לַחְמִי
  choice: मेरी रोटी
  rationale: לֶחֶם का मूल अर्थ ‘रोटी’ है, यद्यपि यह व्यापक रूप से भोजन भी सूचित कर सकता है। ठोस बिंब बनाए रखा गया है।
- source_word: סֹלֶת
  choice: मैदा
  rationale: बारीक, उत्तम आटे के लिए आधुनिक हिन्दी में सहज शब्द; भेंट-संबंधी अनुगूँज भी बनी रहती है।
- source_word: שֶׁמֶן
  choice: तेल
  rationale: मूल पाठ केवल ‘तेल’ कहता है; ‘जैतून का’ जोड़ना अनावश्यक विशिष्टीकरण होगा।
- source_word: דְבַשׁ
  choice: मधु
  rationale: דְבַשׁ का मानक अर्थ मधु है; शब्द गरिमापूर्ण और सामान्यतः बोधगम्य है, जबकि सम्भावित मीठे रस की अस्पष्टता को मुख्य पाठ में नहीं खोला गया।
- source_word: הֶאֱכַלְתִּיךְ
  choice: मैंने तुझे खिलाया था
  rationale: हिफ़ील का कारक अर्थ स्वाभाविक हिन्दी में ‘खिलाया’ से व्यक्त होता है।
- source_word: וּנְתַתִּיהוּ
  choice: तूने उन्हें ... रख दिया
  rationale: सन्दर्भ में कर्ता यरूशलेम रूपी स्त्री है। एकवचन प्रत्यय सामूहिक भोजन की ओर संकेत करता है; हिन्दी में सूची के अनुरूप बहुवचन ‘उन्हें’ स्वाभाविक है।
- source_word: לִפְנֵיהֶם
  choice: उनके सामने
  rationale: सर्वनाम को मूल की तरह अनिर्दिष्ट रखा गया है; पूर्वसन्दर्भ में यह मूर्तियों की ओर संकेत करता है।
- source_word: לְרֵיחַ נִיחֹחַ
  choice: सुखदायक सुगंध के रूप में
  rationale: यह बलिदान-संबंधी प्रचलित पदावली है, जिसे यहाँ मूर्तिपूजा के लिए विडम्बनापूर्वक प्रयोग किया गया है।
- source_word: וַיֶּהִי
  choice: ऐसा ही हुआ
  rationale: आरोप की वास्तविकता की पुष्टि करने वाला संक्षिप्त और स्वाभाविक अनुवाद।
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: प्रभु यहोवा की घोषणा है
  rationale: नְאֻם की भविष्यद्वाणी-सूचक घोषणा और אֲדֹנָי יְהוִה में उपाधि तथा दिव्य नाम, दोनों स्पष्ट रखे गए हैं।
theological_decisions:
- issue: दिव्य नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे / प्रभु परमेश्वर
  rationale: मूल में अֲדֹנָי के साथ चतुराक्षरी दिव्य नाम उपस्थित है। हिन्दी की परिचित बाइबलीय परम्परा में ‘प्रभु यहोवा’ उपाधि और नाम का भेद बनाए रखता है; किसी सम्प्रदायगत व्याख्या को नहीं जोड़ा गया।
- issue: मूर्तियों के लिए बलिदानी पदावली
  choice: सुखदायक सुगंध के रूप में
  alternative: मनभावनी सुगंध के लिए
  rationale: मूल की मानक बलिदानी भाषा को यथावत रखा गया है, ताकि मूर्तिपूजा के प्रसंग में उसकी विडम्बना और धर्मवैचारिक तनाव पाठक के सामने बना रहे।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सीधे सम्बोधन वाला रूप अपनाया गया है। स्त्रीलिंग एकवचन ‘तू’ यरूशलेम के मानवीकरण और मूल की तीखी भविष्यद्वाणी-वाणी को बनाए रखता है।
