source:
  edition: WLC
  text: גַּם אַ֣תְּ שְׂאִ֣י כְלִמָּתֵ֗/ךְ אֲשֶׁ֤ר פִּלַּלְתְּ֙ לַֽ/אֲחוֹתֵ֔/ךְ בְּ/חַטֹּאתַ֛יִ/ךְ אֲשֶׁר הִתְעַ֥בְתְּ מֵ/הֵ֖ן תִּצְדַּ֣קְנָה מִמֵּ֑/ךְ וְ/גַם אַ֥תְּ בּ֨וֹשִׁי֙ וּ/שְׂאִ֣י כְלִמָּתֵ֔/ךְ בְּ/צַדֶּקְתֵּ֖/ךְ אַחְיוֹתֵֽ/ךְ־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/016/052.yaml
  text: You also[a], bear your disgrace, because you pronounced judgment in favor of your sisters. By your sins in which you acted more abominably than they, they have become more righteous than you. So you too, be ashamed and bear your disgrace[b], because you made your sisters appear righteous.
translation:
  language: hi
  text: तू भी अपना अपमान सह, क्योंकि तूने अपनी बहनों के पक्ष में निर्णय दिया है[a]। तेरे उन पापों के कारण, जिनमें तूने उनसे भी अधिक घिनौना आचरण किया, वे तुझसे अधिक धर्मी ठहरी हैं[b]। इसलिए तू भी लज्जित हो और अपना अपमान सह, क्योंकि तूने अपनी बहनों को धर्मी ठहराया है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इसका अनुवाद ‘तूने अपनी बहनों की ओर से विनती की’ या ‘तूने अपनी बहनों का न्याय किया’ भी हो सकता है। हिब्रू कथन विडंबनापूर्ण है: यरूशलेम के पापों ने तुलना के द्वारा उसकी बहनों का पक्ष सही सिद्ध कर दिया।'
    reason: lexical_alternative
  - marker: b
    text: अर्थात वे अपने आप में पूर्णतः धर्मी नहीं थीं; यरूशलेम की तुलना में अधिक धर्मी ठहरीं। इसका अनुवाद ‘वे तुझसे अधिक सही ठहराई गई हैं’ भी हो सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: שְׂאִי כְלִמָּתֵךְ
  choice: अपना अपमान सह
  rationale: נשׂא के आज्ञार्थक प्रयोग और כְּלִמָּה को मिलाकर यह सार्वजनिक लज्जा और उसके दंडात्मक भार को सहने का भाव देता है; निकटवर्ती בּוֹשִׁי के लिए अलग से ‘लज्जित हो’ रखा गया है।
- source_word: פִּלַּלְתְּ לַאֲחוֹתֵךְ
  choice: अपनी बहनों के पक्ष में निर्णय दिया है
  rationale: 'पिएल פלל के न्यायिक/पक्ष-समर्थक अर्थ और ל उपसर्ग को व्यक्त करता है। कथन विडंबनापूर्ण है: यरूशलेम के आचरण ने तुलना में उसकी बहनों का पक्ष पुष्ट कर दिया।'
- source_word: בְּחַטֹּאתַיִךְ
  choice: तेरे उन पापों के कारण
  rationale: 'ב को यहाँ साधन अथवा कारण के रूप में समझना प्रसंग के अनुकूल है: उन्हीं पापों के द्वारा बहनें तुलना में अधिक धर्मी ठहरीं।'
- source_word: הִתְעַבְתְּ מֵהֵן
  choice: तूने उनसे भी अधिक घिनौना आचरण किया
  rationale: हित्पएल रूप और מִן की तुलनात्मक शक्ति दोनों को स्पष्ट और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: תִּצְדַּקְנָה מִמֵּךְ
  choice: वे तुझसे अधिक धर्मी ठहरी हैं
  rationale: צדק और तुलनात्मक מִן को सीधे रूप में रखता है। ‘ठहरी हैं’ मूल्यांकन या तुलना में ऐसा सिद्ध होने का भाव देता है, बिना पूर्ण नैतिक निर्दोषता का दावा किए।
- source_word: בּוֹשִׁי
  choice: लज्जित हो
  rationale: בוש का आज्ञार्थक रूप भावात्मक लज्जा की प्रतिक्रिया की मांग करता है; यह आधुनिक मानक हिन्दी में संक्षिप्त और स्वाभाविक है।
- source_word: בְּצַדֶּקְתֵּךְ אַחְיוֹתֵךְ
  choice: क्योंकि तूने अपनी बहनों को धर्मी ठहराया है
  rationale: 'इस संक्षिप्त हिब्रू रचना का परिणामसूचक/कारणसूचक भाव व्यक्त होता है: यरूशलेम ने अपने अधिक घिनौने पापों के द्वारा तुलना में अपनी बहनों को सही या धर्मी सिद्ध कर दिया।'
theological_decisions:
- issue: सदोम और सामरिया के संबंध में तुलनात्मक धार्मिकता
  choice: ‘वे तुझसे अधिक धर्मी ठहरी हैं’ और ‘तूने ... धर्मी ठहराया है’
  alternative: बहनों को पूर्ण अर्थ में धर्मी या औपचारिक रूप से निर्दोष घोषित करना
  rationale: 'प्रसंग का आघात तुलनात्मक है: यरूशलेम के अधिक घिनौने पापों के सामने उसकी बहनें अपेक्षाकृत धर्मी ठहरती हैं। अनुवाद इस तीखी धार्मिक भाषा को बनाए रखता है, पर उसमें निरपेक्ष निष्पापता नहीं जोड़ता।'
- issue: פלל का विडंबनापूर्ण न्यायिक अर्थ
  choice: ‘बहनों के पक्ष में निर्णय दिया’
  alternative: ‘बहनों के लिए विनती की’ अथवा केवल ‘बहनों का न्याय किया’
  rationale: हिब्रू में न्याय करने, हस्तक्षेप करने या किसी के पक्ष में मामला सिद्ध करने की अर्थ-सीमा है। चुना हुआ रूप न्यायिक विडंबना को स्पष्ट करता है, जबकि पादटिप्पणी वास्तविक शब्दगत बहुअर्थकता सुरक्षित रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में भविष्यद्वाणी की सीधी, कठोर और गरिमापूर्ण वाणी रखी गई है। स्त्रीलिंग एकवचन संबोधन के लिए प्रसंगानुकूल ‘तू’ प्रयुक्त है। ‘अपमान’ सार्वजनिक बदनामी को और ‘लज्जित हो’ आंतरिक प्रतिक्रिया को अलग-अलग व्यक्त करते हैं।
