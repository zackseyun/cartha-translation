  text: וַ/תַּעְדִּ֞י זָהָ֣ב וָ/כֶ֗סֶף וּ/מַלְבּוּשֵׁ/ךְ֙ ששי וָ/מֶ֨שִׁי֙ וְ/רִקְמָ֔ה סֹ֧לֶת וּ/דְבַ֛שׁ וָ/שֶׁ֖מֶן אכלתי וַ/תִּ֨יפִי֙ בִּ/מְאֹ֣ד מְאֹ֔ד וַֽ/תִּצְלְחִ֖י לִ/מְלוּכָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/016/013.yaml
  text: You adorned yourself with gold and silver[a], and your clothing was fine linen, silk, and embroidered cloth. You ate fine flour, honey, and oil[b], and you became exceedingly beautiful and prospered to royalty.
translation:
  language: hi
  text: तूने सोने और चाँदी से अपना श्रृंगार किया, और तेरे वस्त्र महीन सन-वस्त्र, विलासपूर्ण कपड़े[a] और कढ़ाईदार कपड़े थे। तू महीन आटा, मधु और तेल खाती थी। तू अत्यन्त सुन्दर हो गई और राजसी प्रतिष्ठा तक पहुँच गई[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इस वस्त्र के लिए प्रयुक्त इब्रानी शब्द की ठीक पहचान अनिश्चित है; सम्भवतः यह रेशम जैसा कोई विलासपूर्ण कपड़ा था।
    reason: lexical_alternative
  - marker: b
    text: या “राजपद तक उन्नति की” या “रानी की स्थिति तक पहुँची।” इब्रानी पदबंध राजकीय स्थिति तक सफलतापूर्वक पहुँचने के व्यापक अर्थ दे सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: וַתַּעְדִּי
  choice: तूने ... अपना श्रृंगार किया
  rationale: क्रिया עדה यहाँ सोने-चाँदी से स्वयं को सजाने का भाव देती है; स्त्रीलिंग एकवचन संबोधन और वैवाहिक रूपक बनाए रखा गया है।
- source_word: שֵׁשִׁי
  choice: उत्तम मलमल
  rationale: यह बढ़िया और मूल्यवान महीन सन-वस्त्र का सूचक है; आधुनिक हिन्दी में 'उत्तम मलमल' विलासपूर्ण महीन वस्त्र का सहज बोध कराता है।
- source_word: מֶשִׁי
  choice: बहुमूल्य कपड़ा
  rationale: इस दुर्लभ वस्त्र-शब्द की ठीक पहचान अनिश्चित है; इसलिए निश्चित रूप से 'रेशम' कहने के बजाय सामान्य विलासपूर्ण अर्थ मुख्य पाठ में रखा गया है।
- source_word: רִקְמָה
  choice: कढ़ाईदार कपड़ा
  rationale: शब्द कढ़ाई किए हुए वस्त्र या सामग्री को दर्शाता है।
- source_word: סֹלֶת וּדְבַשׁ וָשֶׁמֶן
  choice: मैदा, मधु और तेल
  rationale: उत्तम पिसे आटे तथा अन्य खाद्य पदार्थों को संक्षिप्त और स्वाभाविक हिन्दी में रखा गया है; 'तेल' को मूल से अधिक विशिष्ट नहीं बनाया गया।
- source_word: בִּמְאֹד מְאֹד
  choice: अत्यन्त
  rationale: दोहराए गए हिब्रू तीव्रताबोधक का स्वाभाविक हिन्दी समतुल्य।
- source_word: וַתִּצְלְחִי לִמְלוּכָה
  choice: रानी के पद तक पहुँच गई
  rationale: स्त्री-रूपक के संदर्भ में राजकीय प्रतिष्ठा तक सफल उन्नति व्यक्त होती है; पदबंध की व्यापक सम्भावना पादटिप्पणी में सुरक्षित है।
theological_decisions:
- issue: यरूशलेम का वैवाहिक रूपक के भीतर राजकीय प्रतिष्ठा तक उठाया जाना
  choice: रानी के पद तक पहुँच गई
  alternative: राजपद तक उन्नति की / एक राज्य बन गई
  rationale: स्त्रीलिंग संबोधन के साथ 'रानी के पद' रूपक को स्वाभाविक रखता है, जबकि पादटिप्पणी हिब्रू की व्यापक राजकीय सम्भावना को बिना किसी सांप्रदायिक निष्कर्ष के सुरक्षित रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी, स्त्रीलिंग एकवचन में निकट संबोधन 'तू'; भाषा गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज रखी गई है। दोनों पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित हैं।
