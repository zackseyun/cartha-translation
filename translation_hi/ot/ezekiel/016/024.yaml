    text: या “मेहराबदार कोठरी,” “चबूतरा,” अथवा संभवतः वेश्यावृत्ति से जुड़ी कोई संरचना; यहाँ प्रयुक्त इब्रानी शब्द दुर्लभ है और उसका अर्थ अनिश्चित है।
    reason: lexical_alternative
lexical_decisions:
- source_word: גֶּב
  choice: टीला
  rationale: यह दुर्लभ शब्द किसी निर्मित, उभरी हुई संरचना का संकेत देता है। ‘टीला’ ठोस अर्थ को बनाए रखता है और इसे निश्चित रूप से वेश्यागृह या मंदिर मान लेने से बचता है।
- source_word: רָמָה
  choice: ऊँचा स्थान
  rationale: भविष्यद्वक्ताओं के साहित्य और इस अध्याय के मूर्तिपूजात्मक संदर्भ में यह किसी उपासना-संबंधी ऊँचे स्थान को सूचित कर सकता है; फिर भी अनुवाद मूल स्थापत्य अभिव्यक्ति को बनाए रखता है।
- source_word: רְחֹוב
  choice: चौक
  rationale: यह नगर के खुले सार्वजनिक स्थान को दर्शाता है, केवल सड़क को नहीं; ‘चौक’ सार्वजनिक दृश्यता और शहरी परिवेश दोनों को स्वाभाविक रूप से व्यक्त करता है।
- source_word: וַתִּבְנִי לָךְ
  choice: तूने अपने लिए ... बनाया
  rationale: לָךְ के हितार्थक भाव को आधुनिक, स्वाभाविक हिन्दी में स्पष्ट रखा गया है।
- source_word: וַתַּעֲשִׂי לָךְ
  choice: अपने लिए ... खड़ा किया
  rationale: दोहराए गए हितार्थक सर्वनाम को बनाए रखते हुए ‘खड़ा किया’ किसी संरचना के बनाए जाने को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: בְּכָל
  choice: हर ... में
  rationale: यह वितरणात्मक अर्थ को व्यक्त करता है कि ऐसी संरचना नगर के प्रत्येक सार्वजनिक चौक में बनाई गई थी।
theological_decisions:
- issue: क्या स्थापत्य शब्दों का अनुवाद मुख्य पाठ में स्पष्ट यौन या पंथीय वेश्यावृत्ति की भाषा से किया जाए
  choice: मुख्य पाठ में अपेक्षाकृत शाब्दिक स्थापत्य भाषा—‘टीला’ और ‘ऊँचा स्थान’—रखी गई है।
  alternative: גֶּב का अनुवाद ‘वेश्यागृह’ या ‘वेश्यावृत्ति का मंदिर’ करना।
  rationale: यहेजकेल 16 मूर्तिपूजा के लिए यौन रूपक का प्रयोग करता है, पर इस पद में निर्मित संरचनाओं का उल्लेख है और גֶּב का अर्थ अनिश्चित है। स्पष्ट यौन अर्थ मुख्य पाठ में रखने से संदर्भगत व्याख्या दुर्लभ शब्द पर आरोपित हो जाएगी।
translation_notes:
  register: सम्बोधन स्त्रीलिंग एकवचन है और यरूशलेम को संबोधित करता है। ‘तूने’ मूल के सीधे, अभियोगात्मक स्वर को बनाए रखता है। भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है।
