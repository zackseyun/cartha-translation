base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/016/039.yaml
  text: I will give you into their hand[a], and they will tear down your vaulted chamber and demolish your high places. They will strip you of your clothes, take your beautiful jewelry[b], and leave you naked and bare.
translation:
  language: hi
  text: मैं तुझे उनके हाथ में सौंप दूँगा, और वे तेरे मेहराबदार कक्ष[a] को ढा देंगे और तेरे ऊँचे पूजा-स्थलों को तोड़ डालेंगे। वे तुझे तेरे वस्त्रों से वंचित कर देंगे, तेरे शोभायमान आभूषण[b] ले लेंगे, और तुझे नंगी और निर्वस्त्र छोड़ देंगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “तेरा टीला,” “तेरा देवस्थान,” अथवा “तेरी मेहराब”; इब्रानी शब्द दुर्लभ है और संभवतः इस अध्याय में यरूशलेम की अवैध उपासना से जुड़ी किसी निर्मित संरचना को दर्शाता है।
    reason: lexical_alternative
  - marker: b
    text: या “तेरे वैभव के सामान” अथवा “तेरी शानदार सजावटी वस्तुएँ।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתִּי אוֹתָךְ בְּיָדָם
  choice: मैं तुझे उनके हाथ में कर दूँगा
  rationale: यह न्याय के लिए दूसरों के अधिकार में सौंपे जाने का भाव व्यक्त करता है और ‘हाथ’ की इब्रानी छवि को बनाए रखता है।
- source_word: גַבֵּךְ
  choice: तेरे मेहराबदार कक्ष
  rationale: दुर्लभ इब्रानी शब्द यहाँ अवैध उपासना से जुड़ी किसी निर्मित संरचना का संकेत देता है। यह अनुवाद स्थापत्य भाव रखता है, पर अर्थ को किसी एक निश्चित प्रकार के धर्मस्थल तक सीमित नहीं करता।
- source_word: וְנִתְּצוּ רָמֹתַיִךְ
  choice: तेरे पूजा-स्थलों को तोड़ डालेंगे
  rationale: רָמוֹת यहाँ उपासना के लिए बने ऊँचे स्थानों को सूचित करता है। आधुनिक हिन्दी में ‘पूजा-स्थल’ आशय स्पष्ट करता है; ऊँचाई का पक्ष पादटिप्पणी में सुरक्षित है।
- source_word: וְהִפְשִׁיטוּ אוֹתָךְ בְּגָדַיִךְ
  choice: वे तेरे वस्त्र उतार लेंगे
  rationale: क्रिया किसी व्यक्ति को उसके कपड़ों से वंचित कर नग्न करने का ठोस और अपमानजनक भाव रखती है।
- source_word: כְּלֵי תִפְאַרְתֵּךְ
  choice: तेरे शोभायमान आभूषण
  rationale: כְּלֵי का अर्थ वस्तुएँ या सामान हो सकता है और תִפְאַרְתֵּךְ शोभा/वैभव सूचित करता है। प्रसंग में अलंकरण संभावित है, किंतु पादटिप्पणी व्यापक अर्थ सुरक्षित रखती है।
- source_word: עֵירֹם וְעֶרְיָה
  choice: नंगी और निर्वस्त्र
  rationale: दो समानार्थी शब्द पूर्ण नग्नता और सार्वजनिक अनावरण पर बल देते हैं; हिन्दी में दोहरी अभिव्यक्ति उस तीव्रता को बनाए रखती है।
theological_decisions:
- issue: यरूशलेम को व्यभिचारिणी स्त्री के रूप में चित्रित करने वाली रूपकात्मक और उपासना-संबंधी भाषा
  choice: निर्मित स्थलों के विनाश, वस्त्रहरण और नग्नता की ठोस छवियाँ बनाए रखी गई हैं।
  alternative: इसे सामान्य विनाश और अपमान के अमूर्त कथन के रूप में कहना।
  rationale: इब्रानी पाठ वाचा-विहीनता और मूर्तिपूजा पर न्याय को विस्तृत स्त्री-रूपक में व्यक्त करता है। छवियों को नरम करना भविष्यद्वाणी की तीव्रता और साहित्यिक तनाव को घटा देता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज शैली रखी गई है। स्त्रीलिंग एकवचन संबोधन के अनुरूप ‘नंगी’ प्रयुक्त है। ‘तू/तेरे’ रूप भविष्यद्वाणी के सीधे और तीखे संबोधन को बनाए रखते हैं।
