base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/016/055.yaml
  text: And your sisters[a], Sodom and her daughters, will return to their former state, and Samaria and her daughters will return to their former state, and you and your daughters will return to your former state.
translation:
  language: hi
  text: और तेरी बहनें—सदोम और उसकी बेटियाँ—अपनी पहले की दशा में लौट आएँगी[a]; सामरिया और उसकी बेटियाँ अपनी पहले की दशा में लौट आएँगी; और तू और तेरी बेटियाँ भी अपनी पहले की दशा में लौट आओगी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “फिर से अपनी पहले की दशा में पहुँचा दी जाएँगी।” इब्रानी में अधिक शाब्दिक रूप से “अपनी पहले की दशा में लौट आएँगी” है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲחוֹתַיִךְ
  choice: तेरी बहनें
  rationale: नगरों के मानवीकरण और पूरे अध्याय में प्रयुक्त पारिवारिक रूपक को बनाए रखने के लिए शाब्दिक संबंधवाचक भाषा रखी गई है।
- source_word: סְדֹם
  choice: सदोम
  rationale: इस स्थान-नाम का प्रचलित हिन्दी रूप।
- source_word: בְנוֹתֶיהָ / בְנוֹתַיִךְ
  choice: उसकी बेटियाँ / तेरी बेटियाँ
  rationale: इब्रानी में शाब्दिक अर्थ ‘बेटियाँ’ है। यह आश्रित नगरों या समुदायों की ओर संकेत कर सकता है, पर ‘बेटियाँ’ नगरों के मानवीकरण और पारिवारिक रूपक को सुरक्षित रखता है।
- source_word: תָּשֹׁבְנָה / תְּשֻׁבֶינָה
  choice: लौट आएँगी / लौट आओगी
  rationale: שוב का मूल अर्थ ‘लौटना’ है। इसी क्रिया को तीनों समानांतर खंडों में बनाए रखने से इब्रानी की पुनरावृत्ति और बहाली का निहित भाव दोनों सुरक्षित रहते हैं।
- source_word: לְקַדְמָתָן / לְקַדְמַתְכֶן
  choice: अपनी पहले की दशा में
  rationale: קדם से बना यह पद पिछली या पूर्व दशा को दर्शाता है। यह हिन्दी में स्वाभाविक है और पाठ में कही बात से आगे बढ़कर उस दशा का स्वरूप निर्धारित नहीं करता।
- source_word: וְ
  choice: और
  rationale: साधारण संयोजक तीन समानांतर कथनों को जोड़ता है और कोई अतिरिक्त कालगत अर्थ नहीं जोड़ता।
- source_word: שֹׁמְרוֹן
  choice: सामरिया
  rationale: इस स्थान-नाम का प्रचलित हिन्दी रूप।
theological_decisions:
- issue: सदोम, सामरिया और यरूशलेम के लिए प्रतिज्ञात उलटाव/बहाली का स्वरूप
  choice: ‘अपनी पहले की दशा में लौट आएँगी’ कहकर पाठ की वापसी की भाषा सुरक्षित रखी गई है, पर उसकी प्रक्रिया या अंतिम धर्मवैज्ञानिक अर्थ निर्धारित नहीं किया गया।
  alternative: अधिक व्याख्यात्मक रूप से ‘फिर से बहाल की जाएँगी’ कहना।
  rationale: पद שוב और ‘पहले की दशा’ के माध्यम से वापसी या बहाली की बात करता है। सदोम की बहाली के व्यापक धर्मवैज्ञानिक निहितार्थ विवादित हैं, इसलिए अनुवाद उस तनाव को सुलझाने के बजाय मूल अभिव्यक्ति को बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सम्मानपूर्ण, स्पष्ट और भविष्यद्वाणी-साहित्य के अनुरूप शैली रखी गई है। यरूशलेम को स्त्री रूप में संबोधित करने के कारण ‘तेरी’, ‘तू’ और ‘लौट आओगी’ प्रयुक्त हैं। विराम-चिह्नों से ‘सदोम और उसकी बेटियाँ’ को ‘बहनें’ की व्याख्या के रूप में स्पष्ट किया गया है।
