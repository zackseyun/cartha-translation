  text: וְ/הֶעֱל֤וּ עָלַ֨יִ/ךְ֙ קָהָ֔ל וְ/רָגְמ֥וּ אוֹתָ֖/ךְ בָּ/אָ֑בֶן וּ/בִתְּק֖וּ/ךְ בְּ/חַרְבוֹתָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/016/040.yaml
  text: They will bring up an assembly against you[b][a], and they will stone you and cut you down with their swords.
translation:
  language: hi
  text: वे तुम्हारे विरुद्ध एक सभा इकट्ठी करेंगे, और तुम्हें पत्थरों से मारेंगे तथा अपनी तलवारों से तुम्हें टुकड़े-टुकड़े कर डालेंगे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהֶעֱלוּ עָלַיִךְ קָהָל
  choice: वे तुम्हारे विरुद्ध एक सभा जुटाएँगे
  rationale: העלה के हिफ़ील रूप, עַל के विरोधात्मक अर्थ और קָהָל के औपचारिक सामूहिक भाव को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: וְרָגְמוּ אוֹתָךְ בָּאָבֶן
  choice: तुम्हें पत्थरवाह करेंगे
  rationale: רגם और साधनसूचक בָּאָבֶן मिलकर पत्थरों से मारने की दंडात्मक क्रिया बताते हैं; ‘पत्थरवाह करेंगे’ इसे बिना अनावश्यक पुनरुक्ति के व्यक्त करता है।
- source_word: וּבִתְּקוּךְ
  choice: तुम्हारे टुकड़े कर डालेंगे
  rationale: בתק हिंसक रूप से काटने या चीर डालने का प्रबल अर्थ रखता है; यह चयन उस तीव्रता को ‘मार गिराएँगे’ की अपेक्षा अधिक ठीक रखता है।
- source_word: בְּחַרְבוֹתָם
  choice: अपनी तलवारों से
  rationale: בְּ साधन को और बहुवचन प्रत्यय उनकी अपनी तलवारों को सूचित करता है।
theological_decisions:
- issue: दंड की न्यायिक और सैनिक छवियों का संबंध
  choice: सभा, पत्थरवाह और तलवार—तीनों छवियों को स्पष्ट रूप से बनाए रखा गया है।
  alternative: इसे केवल सामान्य सैनिक आक्रमण के रूप में प्रस्तुत करना।
  rationale: पद सार्वजनिक सामुदायिक दंड और हिंसक विजय, दोनों की ओर संकेत कर सकता है; अनुवाद इस तनाव को किसी एक अर्थ तक सीमित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी; गंभीर और गरिमापूर्ण शैली। स्त्रीलिंग एकवचन संबोधन ‘तुम्हारे/तुम्हें’ यरूशलेम के स्त्रीरूप व्यक्तिकरण के अनुरूप है, जबकि कर्ता बहुवचन है।
