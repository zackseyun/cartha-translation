base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/016/044.yaml
  text: Look[a], everyone who uses proverbs about you will use this proverb, saying, ‘Like mother, like daughter.’
translation:
  language: hi
  text: 'देखो[a], जो कोई तुम्हारे विषय में कहावत कहता है, वह यह कहावत कहेगा: ‘जैसी माँ, वैसी बेटी।’'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ इब्रानी मूल में משל धातु का अर्थ ‘कहावत कहना’ है, ‘शासन करना’ नहीं।
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: देखो
  rationale: यह शब्द श्रोता का ध्यान आगामी कथन की ओर खींचता है। ‘देखो’ आधुनिक हिन्दी में स्वाभाविक रहते हुए इस बल को बनाए रखता है।
- source_word: כָּל הַמֹּשֵׁל
  choice: जो कोई ... कहावत कहता है
  rationale: כָּל के साथ कृदन्त का अर्थ यहाँ प्रत्येक ऐसे व्यक्ति से है जो कहावत कहता है। यह हिन्दी में वितरणात्मक अर्थ को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: הַמֹּשֵׁל / יִמְשֹׁל
  choice: कहावत कहता है / यह कहावत कहेगा
  rationale: दोनों रूप משל धातु से हैं और यहाँ उनका अर्थ कहावत कहना है, शासन करना नहीं। एक ही हिन्दी अभिव्यक्ति की पुनरावृत्ति मूल के शब्दालंकार को यथासंभव बनाए रखती है।
- source_word: עָלַיִךְ
  choice: तुम्हारे विषय में
  rationale: कहावत कहने के संदर्भ में עַל उस व्यक्ति को दर्शाता है जिसके संबंध में बात कही जाती है। प्रसंग में उपहास की छाया हो सकती है, पर पूर्वसर्ग स्वयं अनिवार्यतः ‘विरुद्ध’ नहीं कहता।
- source_word: לֵאמֹר
  choice: 'कहेगा:'
  rationale: यह प्रत्यक्ष कथन का परिचय देता है; हिन्दी में मुख्य क्रिया और द्विबिंदु से इसका कार्य स्वाभाविक रूप से व्यक्त होता है।
- source_word: כְאִמָּה בִּתָּהּ
  choice: जैसी माँ, वैसी बेटी
  rationale: यह संक्षिप्त कहावती तुलना है। प्रचलित हिन्दी रूप मूल की संक्षिप्तता और प्रभाव को सुरक्षित रखता है।
