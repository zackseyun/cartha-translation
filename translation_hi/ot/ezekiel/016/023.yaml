base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/016/023.yaml
  text: And it came about[a], after all your wickedness—woe[b], woe to you! declares the Lord GOD—
translation:
  language: hi
  text: और ऐसा हुआ[a] कि तेरी सारी दुष्टता के बाद—हाय, हाय तुझ पर![b] प्रभु यहोवा की यह घोषणा है—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “और ऐसा घटित हुआ।”
    reason: alternative_reading
  - marker: b
    text: इब्रानी में “हाय” दो बार है; यह दोहराव विलाप और न्याय की घोषणा को तीव्र करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: और ऐसा हुआ
  rationale: यह रूप आगे होने वाले घटनाक्रम की ओर संक्रमण कराता है। ‘और ऐसा हुआ’ इब्रानी कथात्मक सूत्र को स्वाभाविक आधुनिक हिन्दी में बनाए रखता है।
- source_word: אַחֲרֵי כָּל רָעָתֵךְ
  choice: तेरी सारी दुष्टता के बाद
  rationale: אַחֲרֵי का कालवाचक अर्थ ‘के बाद’, כָּל का समग्र अर्थ ‘सारी’, और רָעָה का यहाँ नैतिक अर्थ ‘दुष्टता’ है। स्त्रीलिंग एकवचन सम्बोधन को ‘तेरी’ से सुरक्षित रखा गया है।
- source_word: אוֹי אוֹי לָךְ
  choice: हाय, हाय तुझ पर!
  rationale: ‘हाय’ शोक और न्याय की चेतावनी—दोनों की ध्वनि रखता है; दोहराव मूल की तीव्रता बनाए रखता है। ‘तुझ’ स्त्रीलिंग एकवचन सम्बोधन के निकट और प्रत्यक्ष है।
- source_word: נְאֻם
  choice: की यह घोषणा है
  rationale: नबी-साहित्य के इस ईश्वरीय उद्घोषणा-सूत्र को वर्तमान और गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: אֲדֹנָי יְהוִה
  choice: प्रभु यहोवा
  rationale: אֲדֹנָי को ‘प्रभु’ और चतुरक्षरीय ईश-नाम יהוה को पारंपरिक हिन्दी रूप ‘यहोवा’ से व्यक्त किया गया है, जिससे दोनों अलग तत्व स्पष्ट रहते हैं।
theological_decisions:
- issue: संयुक्त ईश्वरीय उपाधि אֲדֹנָי יְהוִה का अनुवाद
  choice: प्रभु यहोवा
  alternative: प्रभु याहवे
  rationale: मूल पाठ में सामान्य उपाधि אֲדֹנָי और वाचा का व्यक्तिगत नाम יהוה दोनों हैं। ‘प्रभु यहोवा’ हिन्दी बाइबलीय प्रयोग में परिचित है और नाम को केवल ‘प्रभु’ में विलीन नहीं करता; ‘याहवे’ अधिक प्रत्यक्ष लिप्यंतरण है, पर सामान्य हिन्दी पाठक के लिए कम परिचित है।
- issue: אוֹי की भाव-सीमा
  choice: हाय
  alternative: धिक्कार
  rationale: אוֹי में विलाप और आसन्न न्याय की घोषणा दोनों हो सकते हैं। ‘हाय’ इस तनाव को सुरक्षित रखता है, जबकि ‘धिक्कार’ इसे केवल निंदा की दिशा में अधिक निश्चित कर देता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सीधी रखी गई है। ‘तेरी/तुझ’ मूल के स्त्रीलिंग एकवचन सम्बोधन और अध्याय में यरूशलेम के मानवीकरण को बनाए रखते हैं। अन्त का दीर्घ विराम-चिह्न बताता है कि वाक्य अगली आयत में जारी रहता है।
