source:
  edition: WLC
  text: וַ/תִּקְחִ֞י אֶת בָּנַ֤יִ/ךְ וְ/אֶת בְּנוֹתַ֨יִ/ךְ֙ אֲשֶׁ֣ר יָלַ֣דְתְּ לִ֔/י וַ/תִּזְבָּחִ֥י/ם לָ/הֶ֖ם לֶ/אֱכ֑וֹל הַ/מְעַ֖ט מ/תזנת/ך־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/016/020.yaml
  text: And you took your sons and your daughters, whom you had borne to me, and sacrificed them to them as food. Was your prostitution too small a thing?
translation:
  language: hi
  text: तूने अपने बेटों और बेटियों को, जिन्हें तूने मेरे लिए जन्म दिया था, ले लिया और उनके भोजन के लिए उन्हें बलि चढ़ा दिया। क्या तेरी वेश्यावृत्ति कम थी?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתִּזְבָּחִים
  choice: उन्हें बलि चढ़ा दिया
  rationale: זבח का मूल अर्थ बलि के रूप में वध करना है; यह पद मूर्तियों के लिए बच्चों की बलि का वर्णन करता है।
- source_word: לָהֶם לֶאֱכוֹל
  choice: उनके भोजन के लिए
  rationale: इब्रानी में उद्देश्य का भाव है—उन्हें उन देवताओं के लिए खाने/भोजन हेतु बलि किया गया; सर्वनाम की मूल अस्पष्टता बनाए रखी गई है।
- source_word: מִתַּזְנוּתָךְ
  choice: तेरी वेश्यावृत्ति
  rationale: यहेजकेल 16 में यह यरूशलेम की बेवफाई के लिए प्रयुक्त तीखा वैवाहिक-वेश्यावृत्ति रूपक है; इसे नरम करके केवल ‘बेवफाई’ नहीं किया गया।
- source_word: אֲשֶׁר יָלַדְתְּ לִי
  choice: जिन्हें तूने मेरे लिए जन्म दिया था
  rationale: לִי के ‘मेरे लिए/मुझे’ संबंधगत दावे को स्पष्ट रखा गया है, बिना उसे स्वामित्व या समर्पण की किसी एक व्याख्या तक सीमित किए।
theological_decisions:
- issue: बच्चों का परमेश्वर से संबंध
  choice: ‘मेरे लिए जन्म दिया था’
  alternative: ‘जो मुझसे उत्पन्न हुए थे’ या ‘जो मेरे थे’
  rationale: मूल पाठ मातृत्व और वाचा-संबंध का दावा करता है, न कि परमेश्वर को जैविक पिता बताता है; इसलिए इब्रानी संबंध को यथासंभव सीधे रखा गया।
- issue: मूर्तिपूजा के लिए वेश्यावृत्ति का रूपक
  choice: ‘वेश्यावृत्ति’
  alternative: ‘बेवफाई’ या ‘व्यभिचार’
  rationale: मूल की जानबूझकर कठोर और शारीरिक रूपक-भाषा को सुरक्षित रखा गया है; अधिक सामान्य शब्द उसकी तीव्रता घटा देते।
- issue: לָהֶם का संदर्भ
  choice: ‘उनके’
  alternative: ‘उन देवताओं के’
  rationale: पद में देवताओं का नाम दोहराया नहीं गया है; सर्वनाम रखने से स्रोत-पाठ की संदर्भ-निर्भरता और अस्पष्टता बनी रहती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में स्त्रीलिंग एकवचन ‘तू’ रखा गया है, क्योंकि संबोधन व्यक्तिरूप में यरूशलेम से है। भाषा सीधी, गंभीर और आरोपात्मक है; बच्चों की बलि तथा वेश्यावृत्ति के मूल तीखे बिंबों को नरम नहीं किया गया।
