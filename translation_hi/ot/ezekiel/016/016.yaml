source:
  edition: WLC
  text: וַ/תִּקְחִ֣י מִ/בְּגָדַ֗יִ/ךְ וַ/תַּֽעֲשִׂי לָ/ךְ֙ בָּמ֣וֹת טְלֻא֔וֹת וַ/תִּזְנִ֖י עֲלֵי/הֶ֑ם לֹ֥א בָא֖וֹת וְ/לֹ֥א יִהְיֶֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/016/016.yaml
  text: You took some of your garments and made for yourself colorful high places[a], and you prostituted yourself on them—such things should not come[b], nor should they be.
translation:
  language: hi
  text: तुमने अपने वस्त्रों में से कुछ लेकर अपने लिए रंग-बिरंगे ऊँचे पूजा-स्थल[a] बनाए और उन पर वेश्यावृत्ति की—ऐसी बातें न हों और न ऐसा हो[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “पैबंददार ऊँचे पूजा-स्थल,” “चितकबरे ऊँचे पूजा-स्थल,” अथवा “बहुरंगे देवस्थान।” इब्रानी विशेषण कठिन है और संभवतः वस्त्रों से बने इन पूजा-स्थलों की सजावट की ओर संकेत करता है।
    reason: lexical_alternative
  - marker: b
    text: अंतिम इब्रानी वाक्यांश कठिन है। अधिक शाब्दिक रूप में, “वे न आएँ, और न ऐसा हो”; इसका अर्थ “ऐसी बातें नहीं होनी चाहिए” भी हो सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: וַתִּקְחִי מִבְּגָדַיִךְ
  choice: तुमने अपने वस्त्रों में से कुछ लेकर
  rationale: מִן का अंशवाचक भाव ‘में से कुछ’ द्वारा स्वाभाविक रूप से व्यक्त होता है; स्त्रीलिंग एकवचन संबोधन यरूशलेम से है।
- source_word: וַתַּעֲשִׂי לָךְ
  choice: अपने लिए ... बनाए
  rationale: לָךְ में निहित हितार्थक/आत्मवाचक भाव को ‘अपने लिए’ सुरक्षित रखता है।
- source_word: בָּמוֹת
  choice: पूजा-स्थल
  rationale: यह शब्द यहाँ उपासना के स्थलों को सूचित करता है। केवल ‘ऊँचे स्थान’ आधुनिक पाठक को भौगोलिक अर्थ दे सकता है, इसलिए ‘पूजा-स्थल’ प्रसंगगत अर्थ स्पष्ट करता है।
- source_word: טְלֻאוֹת
  choice: रंग-बिरंगे
  rationale: दुर्लभ विशेषण में चितकबरे, पैबंददार या विविध रंगों से सजाए होने का भाव संभव है; वस्त्रों के प्रसंग में ‘रंग-बिरंगे’ सबसे स्वाभाविक है, जबकि अनिश्चितता पादटिप्पणी में दी गई है।
- source_word: וַתִּזְנִי עֲלֵיהֶם
  choice: उन पर वेश्यावृत्ति की
  rationale: זנה की जानबूझकर तीखी यौन उपमा तथा עַל का ‘पर’ अर्थ दोनों बनाए रखे गए हैं।
- source_word: לֹא בָאוֹת וְלֹא יִהְיֶה
  choice: ऐसी बातें न कभी हुई थीं, न कभी होनी चाहिए
  rationale: अत्यंत कठिन और संभवतः विकृत अंतिम वाक्यांश का कालगत तथा निषेधात्मक तनाव बनाए रखा गया है; हिंदी में अर्थगम्य रूप दिया गया है, और अधिक शाब्दिक संभावना पादटिप्पणी में सुरक्षित है।
theological_decisions:
- issue: मूर्तिपूजा के लिए भविष्यद्वाणी की यौन उपमा
  choice: ‘वेश्यावृत्ति’ की स्पष्ट भाषा बनाए रखना
  alternative: ‘विश्वासघात किया’ जैसे नरम शब्द
  rationale: यहेजकेल की चौंकाने वाली उपमा वाचा के प्रति यरूशलेम की बेवफाई को जानबूझकर यौन भाषा में चित्रित करती है; इसे नरम करने से मूल वक्तृता क्षीण होगी।
- issue: अंतिम कठिन वाक्यांश का आशय
  choice: भूतकालीन अभूतपूर्वता और भावी अनुचितता दोनों को व्यक्त करना
  alternative: ‘वे नहीं आतीं और ऐसा नहीं होगा’ अथवा ‘ऐसी बातें नहीं होनी चाहिए’
  rationale: इब्रानी לֹא בָאוֹת וְלֹא יִהְיֶה असामान्य और अस्पष्ट है। मुख्य पाठ पठनीय हिंदी देता है, पर पादटिप्पणी अधिक शाब्दिक संरचना और दूसरी व्याख्या को खुला रखती है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सीधी हिंदी। यरूशलेम को स्त्री के रूप में संबोधित करने वाली मूल व्याकरणिक संरचना क्रियाओं के स्त्रीलिंग रूप में बनी हुई है। तीखी भविष्यद्वाणी भाषा को नरम नहीं किया गया, जबकि दुर्लभ विशेषण और कठिन अंतिम उपवाक्य की अनिश्चितता पादटिप्पणियों में स्पष्ट है।
