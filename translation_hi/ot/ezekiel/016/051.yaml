source:
  edition: WLC
  text: וְ/שֹׁ֣מְר֔וֹן כַּ/חֲצִ֥י חַטֹּאתַ֖יִ/ךְ לֹ֣א חָטָ֑אָה וַ/תַּרְבִּ֤י אֶת תּוֹעֲבוֹתַ֨יִ/ךְ֙ מֵ/הֵ֔נָּה וַ/תְּצַדְּקִי֙ אֶת אחות/ך בְּ/כָל תּוֹעֲבוֹתַ֖יִ/ךְ אֲשֶׁ֥ר עשיתי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/016/051.yaml
  text: And Samaria did not sin half as much as you; you multiplied your abominations more than they[a], and by all your abominations that you committed, you made your sisters appear righteous.
translation:
  language: hi
  text: और सामरिया ने तुम्हारे पापों के आधे जितना भी पाप नहीं किया। तुमने अपने घिनौने काम उनसे कहीं अधिक बढ़ा लिए; और अपने किए हुए सब घिनौने कामों के द्वारा तुमने अपनी बहनों को धर्मी ठहरा दिया[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात् तुम्हारे अधिक घिनौने कामों के कारण तुम्हारी बहनें तुलना में धर्मी दिखाई देने लगीं।
    reason: ‘धर्मी ठहराना’ यहाँ वास्तविक निर्दोषता घोषित करना नहीं, बल्कि तुलनात्मक रूप से धर्मी दिखाना है।
lexical_decisions:
- source_word: שֹׁמְרוֹן
  choice: सामरिया
  rationale: व्यक्तित्व दिए गए नगर का मानक हिन्दी नाम; प्रसंग में यह उत्तरी राज्य का प्रतिनिधित्व करता है।
- source_word: כַּחֲצִי חַטֹּאתַיִךְ לֹא חָטָאָה
  choice: तुम्हारे पापों के आधे के बराबर भी पाप नहीं किया
  rationale: तुलनात्मक वाक्य की तीव्रता और मूल में उपस्थित ‘तुम्हारे पापों’ को स्पष्ट, स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: וַתַּרְבִּי אֶת תּוֹעֲבוֹתַיִךְ מֵהֵנָּה
  choice: तुमने उनसे कहीं अधिक घिनौने काम किए
  rationale: רבה और מן की तुलना को स्वाभाविक हिन्दी में व्यक्त करता है; ‘कहीं अधिक’ मात्रा की प्रबल तुलना दिखाता है।
- source_word: תּוֹעֲבוֹתַיִךְ
  choice: घिनौने काम
  rationale: यहेजकेल में इस प्रबल नैतिक-धार्मिक शब्द की कठोरता को सामान्य आधुनिक हिन्दी में समझने योग्य ढंग से व्यक्त करता है।
- source_word: וַתְּצַדְּקִי אֶת אֲחוֹתַיִךְ
  choice: तुमने अपनी बहनों को धर्मी ठहरा दिया
  rationale: צדק के पिएल रूप की न्यायिक और तुलनात्मक धार को संरक्षित करता है; संदर्भ में इसका आशय वास्तविक निर्दोषता नहीं, बल्कि तुलना में धर्मी प्रतीत कराना है।
- source_word: בְּכָל תּוֹעֲבוֹתַיִךְ אֲשֶׁר עָשִׂית
  choice: अपने किए हुए सब घिनौने कामों के द्वारा
  rationale: בְּ का साधनवाचक अर्थ और यरूशलेम द्वारा किए गए कर्मों का संदर्भ स्पष्ट रखता है।
theological_decisions:
- issue: ‘अपनी बहनों को धर्मी ठहरा दिया’ का आशय
  choice: मूल की न्यायिक अभिव्यक्ति को मुख्य पाठ में रखना और तुलनात्मक अर्थ पादटिप्पणी में स्पष्ट करना
  alternative: ‘अपनी बहनों को धर्मी-सा दिखा दिया’
  rationale: यह वास्तविक नैतिक दोषमुक्ति का कथन नहीं है; यरूशलेम की अधिक बुराई के कारण सामरिया और सदोम तुलना में धर्मी दिखाई देती हैं। फिर भी मूल की तनावपूर्ण भाषा को पूरी तरह व्याख्यात्मक वाक्य में बदलने के बजाय संरक्षित किया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी; भविष्यद्वक्ता की कठोरता बनाए रखते हुए सामान्य पाठक के लिए स्वाभाविक शब्दावली। स्त्रीलिंग एकवचन ‘तुम’ व्यक्तित्व दिए गए यरूशलेम को संबोधित करता है।
