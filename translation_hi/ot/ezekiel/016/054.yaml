source:
  edition: WLC
  text: לְמַ֨עַן֙ תִּשְׂאִ֣י כְלִמָּתֵ֔/ךְ וְ/נִכְלַ֕מְתְּ מִ/כֹּ֖ל אֲשֶׁ֣ר עָשִׂ֑ית בְּ/נַחֲמֵ֖/ךְ אֹתָֽ/ן׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/016/054.yaml
  text: so that you may bear your disgrace and be ashamed because of all that you have done[a], becoming a comfort to them.
translation:
  language: hi
  text: ताकि तू अपना अपमान सहे और अपने किए हुए सभी कामों के कारण लज्जित हो, उन्हें सांत्वना देते समय।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इसका अनुवाद ‘जब तू उन्हें सांत्वना दे’, ‘उन्हें सांत्वना देने के द्वारा’ या ‘उनके लिए सांत्वना बनकर’ भी हो सकता है। हिब्रू वाक्यांश को इन निकटवर्ती अर्थों में समझा जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: לְמַעַן
  choice: ताकि
  rationale: यह उद्देश्य अथवा परिणाम का भाव प्रकट करता है; ‘ताकि’ आधुनिक हिन्दी में दोनों के लिए स्वाभाविक है।
- source_word: תִּשְׂאִי כְלִמָּתֵךְ
  choice: तू अपना अपमान सहे
  rationale: נשׂא का मूल अर्थ ‘उठाना/ढोना’ है, पर כְּלִמָּה के साथ इसका मुहावरेदार अर्थ अपमान का भार सहना है। ‘अपमान’ सार्वजनिक तिरस्कार के पहलू को व्यक्त करता है।
- source_word: וְנִכְלַמְתְּ
  choice: और ... लज्जित हो
  rationale: כלם के निफ़अल रूप का अर्थ यहाँ लज्जित या अपमानित होना है। ‘लज्जित हो’ आंतरिक प्रतिक्रिया को व्यक्त करता है और पिछले ‘अपमान’ की अनावश्यक पुनरावृत्ति से बचता है।
- source_word: מִכֹּל אֲשֶׁר עָשִׂית
  choice: अपने किए हुए सभी कामों के कारण
  rationale: लज्जा-सूचक क्रिया के बाद מִן कारण या आधार बताता है; ‘के कारण’ हिन्दी में इस संबंध को स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
- source_word: בְּנַחֲמֵךְ אֹתָן
  choice: जब तू उन्हें सांत्वना दे
  rationale: נחם के साथ בְּ उपसर्ग को यहाँ कालगत/परिस्थितिजन्य अर्थ में लिया गया है। स्त्रीलिंग बहुवचन कर्म-सर्वनाम उन नगरों या बहनों की ओर संकेत करता है जिनका पहले उल्लेख हुआ है।
theological_decisions:
- issue: पुनर्स्थापना के संदर्भ में यरूशलेम का दूसरी स्त्रियों/नगरों को सांत्वना देना
  choice: यरूशलेम उस समय लज्जित होती है जब वह उन्हें सांत्वना देती है।
  alternative: यरूशलेम उन्हें सांत्वना देने के द्वारा लज्जित होती है, अथवा उनके लिए सांत्वना बनती है।
  rationale: यहेजकेल 16:53-55 का संदर्भ यरूशलेम, सदोम और सामरिया की भावी पुनर्स्थापना की ओर देखता है। בְּנַחֲמֵךְ का कालगत/परिस्थितिजन्य अनुवाद इस संदर्भ के अनुकूल है, जबकि पादटिप्पणी हिब्रू वाक्यांश की निकटवर्ती वैकल्पिक समझ को सुरक्षित रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सहज रूप अपनाया गया है। परमेश्वर द्वारा यरूशलेम को स्त्रीलिंग एकवचन में संबोधित किए जाने के कारण ‘तू’ रखा गया है; इससे मूल पाठ का सीधा और न्यायसूचक संबोधन बना रहता है।
