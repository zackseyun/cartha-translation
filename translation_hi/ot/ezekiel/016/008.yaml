  text: וָ/אֶעֱבֹ֨ר עָלַ֜יִ/ךְ וָ/אֶרְאֵ֗/ךְ וְ/הִנֵּ֤ה עִתֵּ/ךְ֙ עֵ֣ת דֹּדִ֔ים וָ/אֶפְרֹ֤שׂ כְּנָפִ/י֙ עָלַ֔יִ/ךְ וָ/אֲכַסֶּ֖ה עֶרְוָתֵ֑/ךְ וָ/אֶשָּׁ֣בַֽע לָ֠/ךְ וָ/אָב֨וֹא בִ/בְרִ֜ית אֹתָ֗/ךְ נְאֻ֛ם אֲדֹנָ֥/י יְהוִ֖ה וַ/תִּ֥הְיִי לִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/016/008.yaml
  text: When I passed by you and saw you[a], behold, your time was the time for love. So I spread the edge of my garment over you and covered your nakedness. I swore myself to you and entered into a covenant with you, declares the Lord GOD[b], and you became mine.
translation:
  language: hi
  text: जब मैं तेरे पास से गुज़रा और मैंने तुझे देखा, और देखो, तेरा समय प्रेम का समय था।[a] तब मैंने अपने वस्त्र का छोर तेरे ऊपर फैलाया[b] और तेरी नग्नता ढक दी। मैंने तुझसे शपथ खाई और तेरे साथ वाचा बाँधी—प्रभु याहवे की यह घोषणा है—और तू मेरी हो गई।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘प्रेम का समय’ का अनुवाद ‘प्रणय का समय’, ‘दुलार का समय’ या प्रसंगानुसार ‘प्रेम-संबंध का समय’ भी हो सकता है। इब्रानी शब्द में विवाह-रूपक के भीतर रोमानी और कामुक दोनों संकेत हैं।
    reason: lexical_alternative
  - marker: b
    text: अधिक शाब्दिक रूप से, ‘मैंने अपना पंख तेरे ऊपर फैलाया।’ यहाँ इब्रानी शब्द वस्त्र के छोर को भी दर्शा सकता है और वैवाहिक संरक्षण या अधिकार का संकेत देता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶעֱבֹר עָלַיִךְ
  choice: जब मैं तेरे पास से गुज़रा
  rationale: עבר על का सीधा अर्थ पास से गुज़रना है। पहले के प्रसंग से ‘फिर’ समझा जा सकता है, पर वह इस पद के इब्रानी पाठ में स्पष्ट नहीं है, इसलिए उसे मुख्य पाठ में नहीं जोड़ा गया।
- source_word: וְהִנֵּה
  choice: तो देख
  rationale: הִנֵּה ध्यान आकर्षित करने वाला जीवंत सूचक है। ‘तो देख’ आधुनिक हिन्दी में उसका कथात्मक और अलंकारिक बल बनाए रखता है।
- source_word: עִתֵּךְ עֵת דֹּדִים
  choice: तेरा समय प्रेम का समय था
  rationale: דֹּדִים में प्रेम, प्रणय और दैहिक स्नेह के अर्थ समाहित हैं। यह चयन विवाह-रूपक की आत्मीय और कामुक छाया को बनाए रखता है, पर अनावश्यक रूप से अधिक स्पष्ट नहीं करता।
- source_word: וָאֶפְרֹשׂ כְּנָפִי עָלַיִךְ
  choice: मैंने अपने वस्त्र का छोर तेरे ऊपर फैलाया
  rationale: כָּנָף का मूल अर्थ ‘पंख’ है और इसका अर्थ वस्त्र का किनारा या छोर भी होता है। इस वैवाहिक प्रसंग में ‘वस्त्र का छोर’ हिन्दी पाठक के लिए संकेत को स्वाभाविक बनाता है; शाब्दिक विकल्प पाद-टिप्पणी में दिया गया है।
- source_word: וָאֲכַסֶּה עֶרְוָתֵךְ
  choice: तेरी नग्नता ढक दी
  rationale: עֶרְוָה का सीधा अर्थ नग्नता है और उसमें यौन अनावरण तथा लज्जा की छाया हो सकती है। हिन्दी अनुवाद ठोस बिंब को सुरक्षित रखता है।
- source_word: וָאֶשָּׁבַע לָךְ
  choice: मैंने तुझसे शपथ खाई
  rationale: यह किसी व्यक्ति के प्रति शपथ लेने की अभिव्यक्ति है। हिन्दी में यह वाचा से पहले आने वाली गंभीर प्रतिज्ञा को स्वाभाविक रूप से व्यक्त करती है।
- source_word: וָאָבוֹא בִבְרִית אֹתָךְ
  choice: तेरे साथ वाचा बाँधी
  rationale: शाब्दिक अभिव्यक्ति ‘तेरे साथ वाचा में आया’ है। ‘वाचा बाँधी’ आधुनिक हिन्दी में इस इब्रानी वाचागत मुहावरे का स्वाभाविक और औपचारिक समतुल्य है।
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: प्रभु यहोवा की यह घोषणा है
  rationale: נְאֻם भविष्यद्वाणी की आधिकारिक घोषणा का सूत्र है। אֲדֹנָי को ‘प्रभु’ और परमेश्वर के व्यक्तिगत वाचा-नाम יהוה को ‘यहोवा’ के रूप में रखा गया है।
- source_word: וַתִּהְיִי לִי
  choice: तू मेरी हो गई
  rationale: इब्रानी का शाब्दिक अर्थ ‘तू मेरे लिए हो गई’ है। ‘तू मेरी हो गई’ वैवाहिक-वाचागत संबंध को व्यक्त करता है, पर पाठ में स्पष्ट रूप से न आए ‘पत्नी’ शब्द को नहीं जोड़ता।
theological_decisions:
- issue: विवाह-वाचा के रूपक में प्रणय और यौन संकेत
  choice: ‘प्रेम का समय’, ‘वस्त्र का छोर’ और ‘नग्नता’ जैसे शब्दों से वैवाहिक तथा वाचागत रूपक को बनाए रखा गया है।
  alternative: भाषा को केवल सामान्य स्नेह तक सीमित करना, या उसे ‘संभोग का समय’ कहकर अधिक स्पष्ट बनाना।
  rationale: इब्रानी पाठ यरूशलेम के साथ यहोवा की वाचा को विवाह के रूपक में प्रस्तुत करता है। अनुवाद को न तो उसकी कामुक छाया मिटानी चाहिए, न उसे मूल से अधिक तीखा करना चाहिए।
- issue: אֲדֹנָי יְהוִה में परमेश्वर का नाम
  choice: प्रभु यहोवा
  alternative: प्रभु परमेश्वर; प्रभु याहवे
  rationale: संयुक्त उपाधि में אֲדֹנָי और יהוה दोनों को अलग-अलग दर्शाते हुए, हिन्दी में प्रचलित व्यक्तिगत वाचा-नाम ‘यहोवा’ सुरक्षित रखा गया है।
- issue: וַתִּהְיִי לִי में संबंध की प्रकृति
  choice: तू मेरी हो गई
  alternative: तू मेरी पत्नी हो गई
  rationale: विवाह का भाव प्रसंग में स्पष्ट है, पर ‘पत्नी’ मूल पद में प्रत्यक्ष रूप से नहीं है। चुना गया रूप वाचागत अपनत्व और मूल की संक्षिप्तता दोनों बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य हिन्दी पाठक के लिए बोधगम्य रखी गई है। यरूशलेम को संबोधन स्त्रीलिंग एकवचन और आत्मीय ‘तू/तेरे’ में है, जिससे इब्रानी के स्त्रीलिंग रूप तथा निकट वाचागत संबंध दोनों प्रकट होते हैं। ‘वाचा’ बाइबलीय औपचारिकता को बनाए रखता है, जबकि वाक्य-विन्यास स्वाभाविक हिन्दी में है।
