  rationale: स्थान-नाम का हिन्दी बाइबलीय रूप।
- source_word: וּבְנוֹתֶיהָ
  choice: और उसकी बेटियाँ
  rationale: मूल का पारिवारिक-भौगोलिक रूपक सुरक्षित रखा गया है; यहाँ ‘बेटियाँ’ आश्रित नगरों या आसपास की बस्तियों को सूचित करती हैं।
- source_word: שֹׁמְרוֹן
  choice: सामरिया
  rationale: स्थान-नाम का प्रचलित हिन्दी रूप।
- source_word: בְּתוֹכָהְנָה
  choice: उनके बीच
  rationale: ‘उनके मध्य/बीच’ का स्वाभाविक आधुनिक हिन्दी रूप, जो सदोम और सामरिया के साथ यरूशलेम की बहाली को रखता है।
theological_decisions:
- issue: न्याय और बहाली की भविष्यवाणी में שׁוּב שְׁבוּת/שְׁבִית मुहावरे का अर्थ
  choice: व्यापक रूप से बिगड़ी दशा को पलटकर फिर सँवारना
  alternative: बँधुआई लौटा देना / बंदियों को वापस लाना
  rationale: सदोम के समावेश के कारण वाक्यांश को केवल ऐतिहासिक निर्वासन से वापसी मानना अनावश्यक रूप से संकीर्ण होगा। व्यापक बहाली का अनुवाद भविष्यवाणी के तनाव को बनाए रखता है, जबकि शाब्दिक विकल्प पादटिप्पणी में दिया गया है।
- issue: सदोम और सामरिया की ‘बेटियों’ का आशय
  choice: मुख्य पाठ में पारिवारिक रूपक बनाए रखना
  alternative: आश्रित नगर / आसपास की बस्तियाँ
  rationale: ‘बेटियाँ’ अध्याय की नगर-परिवार संबंधी छवि का अंग है। भौगोलिक आशय को पादटिप्पणी स्पष्ट करती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। मूल इब्रानी की पुनरावृत्ति और ‘बेटियों’ का रूपक सुरक्षित है। दोनों पादटिप्पणी-चिह्न मुख्य पाठ में लगाए गए हैं।
