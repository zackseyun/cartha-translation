base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/016/053.yaml
  text: And I will restore their fortunes—the fortunes of Sodom and her daughters[a], and the fortunes of Samaria and her daughters—and your fortunes among them[b],
translation:
  language: hi
  text: और मैं उनकी दशा बहाल करूँगा[a]—सदोम और उसकी बेटियों[b] की दशा, और सामरिया और उसकी बेटियों की दशा—और उनके बीच तुम्हारी दशा भी बहाल करूँगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से, ‘उनकी बँधुआई को लौटाऊँगा’; इसका अनुवाद ‘उनके बंदियों को वापस लाऊँगा’ भी किया जा सकता है। यह मुहावरा प्रायः किसी जाति की दशा पलटकर उसे बहाल करने का अर्थ देता है।
    reason: lexical_alternative
  - marker: b
    text: यहाँ ‘बेटियाँ’ सदोम और सामरिया से जुड़े आश्रित नगरों या आसपास की बस्तियों को दर्शाती हैं।
    reason: cultural_note
