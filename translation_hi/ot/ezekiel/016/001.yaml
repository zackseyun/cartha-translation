  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: आया
  rationale: भविष्यद्वाणी के प्रचलित इब्रानी सूत्र में इसका स्वाभाविक हिन्दी रूप ‘वचन ... आया’ है; शाब्दिक ‘हुआ’ यहाँ असहज होगा।
- source_word: דְבַר
  choice: वचन
  rationale: इस संदर्भ में यह परमेश्वर की ओर से दिए गए वचन या संदेश को दर्शाता है; ‘वचन’ भविष्यद्वाणी की स्थापित भाषा और प्रत्यक्ष प्रकाशन, दोनों को बनाए रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी पाठ में परमेश्वर का व्यक्तिगत नाम YHWH है; हिन्दी में प्रचलित निकट लिप्यंतरण ‘याहवे’ उस नाम को किसी उपाधि से बदलने के बजाय सुरक्षित रखता है।
- source_word: אֵלַי
  choice: मेरे पास
  rationale: इब्रानी पूर्वसर्ग और प्रथम पुरुष प्रत्यय वचन के भविष्यद्वक्ता तक पहुँचने की दिशा बताते हैं; हिन्दी भविष्यद्वाणी-सूत्र में ‘मेरे पास आया’ स्वाभाविक है।
- source_word: לֵאמֹר
  choice: उन्होंने कहा
  rationale: यह अगले ईश्वरीय कथन का परिचय देता है। हिन्दी में वाक्य को ‘उन्होंने कहा’ के रूप में खोलना ‘कहते हुए’ की अपेक्षा अधिक सहज है।
theological_decisions:
- issue: परमेश्वर के नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ चार अक्षरों वाला व्यक्तिगत नाम सीधे प्रयोग करता है। ‘याहवे’ उसे उपाधि ‘प्रभु’ से प्रतिस्थापित किए बिना और किसी सांप्रदायिक विशिष्टता को जोड़े बिना प्रस्तुत करता है।
- issue: לֵאמֹר में वक्ता का व्याकरणिक परिचय
  choice: उन्होंने कहा
  alternative: यह कहते हुए
  rationale: इब्रानी में कर्ता अलग से व्यक्त नहीं है, पर निकटतम और सूत्रगत वक्ता याहवे हैं। हिन्दी का आदरसूचक बहुवचन स्वाभाविक है और आगे आने वाली प्रत्यक्ष वाणी का स्पष्ट परिचय देता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; संक्षिप्त, गरिमापूर्ण और भविष्यद्वाणी-साहित्य के परिचित सूत्र के अनुरूप। ‘याहवे’ को हिन्दी लिपि में व्यक्तिगत नाम के रूप में रखा गया है।
