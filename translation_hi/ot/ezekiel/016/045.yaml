  edition: WLC
  text: בַּת אִמֵּ֣/ךְ אַ֔תְּ גֹּעֶ֥לֶת אִישָׁ֖/הּ וּ/בָנֶ֑י/הָ וַ/אֲח֨וֹת אֲחוֹתֵ֜/ךְ אַ֗תְּ אֲשֶׁ֤ר גָּֽעֲ֨לוּ֙ אַנְשֵׁי/הֶ֣ן וּ/בְנֵי/הֶ֔ן אִמְּ/כֶ֣ן חִתִּ֔ית וַ/אֲבִי/כֶ֖ן אֱמֹרִֽי־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/016/045.yaml
  text: You are the daughter of your mother[a], who loathed her husband and her children; and you are the sister of your sisters, who loathed their husbands and their children. Your mother was a Hittite, and your father an Amorite.
translation:
  language: hi
  text: तू अपनी माँ की बेटी है, जो अपने पति और अपने बच्चों से घृणा[a] करती थी; और तू अपनी बहनों की बहन है, जिन्होंने अपने पतियों और अपने बच्चों से घृणा की। तुम सबकी माँ हित्ती थी, और तुम सबका पिता एमोरी था।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “घिन करती थी” अथवा “तुच्छ जानती थी”; दोनों स्थानों पर प्रयुक्त इब्रानी क्रिया प्रबल विरक्ति का भाव व्यक्त करती है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में यहाँ संबोधन एकवचन “तू” से बदलकर बहुवचन “तुम सब” हो जाता है।
    reason: source_form
lexical_decisions:
- source_word: בַּת אִמֵּךְ
  choice: अपनी माँ की बेटी
  rationale: यह वंश-संबंध के द्वारा स्वभाव और आचरण में समानता बताने वाला रूपक है। हिन्दी में यह अभिव्यक्ति इब्रानी संरचना और आरोपात्मक बल दोनों को बनाए रखती है।
- source_word: גֹּעֶלֶת / גָּעֲלוּ
  choice: घृणा करती थी / घृणा की
  rationale: געל प्रबल विरक्ति और अस्वीकार का भाव व्यक्त करता है। ‘घृणा करना’ आधुनिक हिन्दी में स्वाभाविक है और दोनों प्रयोगों में एक ही मूल क्रिया की संगति बनाए रखता है।
- source_word: אִישָׁהּ / אַנְשֵׁיהֶן
  choice: अपने पति / अपने पतियों
  rationale: घरेलू और वैवाहिक प्रसंग में אִישׁ का अर्थ सामान्य ‘पुरुष’ के बजाय ‘पति’ है।
- source_word: וּבָנֶיהָ / וּבְנֵיהֶן
  choice: अपने बच्चों
  rationale: בנים यहाँ सामूहिक रूप से संतान को सूचित कर सकता है; ‘बच्चों’ से अर्थ को केवल पुत्रों तक अनावश्यक रूप से सीमित नहीं किया गया।
- source_word: וַאֲחוֹת אֲחוֹתֵךְ
  choice: तू अपनी बहनों की बहन है
  rationale: यह असामान्य किन्तु बोधगम्य संरचना बहनों के साथ निकट संबंध और आचरण की समानता पर इब्रानी के बल को सुरक्षित रखती है।
- source_word: אִמְּכֶן חִתִּית וַאֲבִיכֶן אֱמֹרִי
  choice: तुम सबकी माँ हित्ती थी, और तुम सबका पिता एमोरी था
  rationale: मूल पाठ यहाँ स्त्रीलिंग एकवचन संबोधन से स्त्रीलिंग बहुवचन प्रत्ययों की ओर बदलता है। ‘तुम सबकी’ इस बदलाव को स्पष्ट रूप से सुरक्षित रखता है; ‘हित्ती’ और ‘एमोरी’ जातीय पदनामों को यथावत रखता है।
theological_decisions:
- issue: माँ को हित्ती और पिता को एमोरी कहना
  choice: भविष्यद्वाणी के पारिवारिक रूपक और तिरस्कारपूर्ण आरोप की शाब्दिक भाषा को बनाए रखा गया है
  alternative: यरूशलेम के निवासियों की वास्तविक जातीय वंशावली का कथन मानना
  rationale: यहेजकेल 16 में यरूशलेम को स्त्री, पत्नी और बहन के रूप में चित्रित किया गया है। अनुवाद मूल रूपक को बिना ऐतिहासिक या जैविक वंशावली का अतिरिक्त दावा किए सुरक्षित रखता है।
- issue: एकवचन से बहुवचन संबोधन का परिवर्तन
  choice: पहले ‘तू’ और अंत में ‘तुम सबकी/तुम सबका’
  alternative: पूरे पद में केवल एकवचन ‘तेरी/तेरा’ रखना
  rationale: इब्रानी पाठ में आरम्भिक संबोधन स्त्रीलिंग एकवचन है, जबकि माता-पिता वाले अंतिम खंड में प्रत्यय स्त्रीलिंग बहुवचन हैं। इस तनाव को समतल करने के बजाय अनुवाद में बनाए रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सीधा, गंभीर और आरोपात्मक भविष्यद्वाणी-स्वर रखा गया है। स्त्रीलिंग एकवचन ‘तू’ मूल संबोधन की निकटता और तीखेपन को व्यक्त करता है; अंतिम वाक्य में मूल के बहुवचन को ‘तुम सबकी/तुम सबका’ से स्पष्ट किया गया है।
