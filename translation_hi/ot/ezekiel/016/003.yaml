source:
  edition: WLC
  text: וְ/אָמַרְתָּ֞ כֹּה אָמַ֨ר אֲדֹנָ֤/י יְהוִה֙ לִ/יר֣וּשָׁלִַ֔ם מְכֹרֹתַ֨יִ/ךְ֙ וּ/מֹ֣לְדֹתַ֔יִ/ךְ מֵ/אֶ֖רֶץ הַֽ/כְּנַעֲנִ֑י אָבִ֥י/ךְ הָ/אֱמֹרִ֖י וְ/אִמֵּ֥/ךְ חִתִּֽית־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/016/003.yaml
  text: 'and say[a], ‘Thus says the Lord GOD to Jerusalem: Your origin and your birth are from the land of the Canaanite; your father was an Amorite, and your mother a Hittite.’'
translation:
  language: hi
  text: 'और यरूशलेम से कह, “प्रभु याहवे यह कहता है: तेरा मूल और तेरा जन्म कनानी के देश से हैं।[a] तेरा पिता एमोरी था और तेरी माता हित्ती थी।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, अधिक सहज रूप में, “कनान देश से।” इब्रानी में अधिक शाब्दिक रूप से “कनानी के देश से” है, जिससे जातीय बल बना रहता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  choice: प्रभु याहवे
  rationale: אֲדֹנָי को ‘प्रभु’ और परमेश्वर के व्यक्तिगत नाम יהוה को ‘याहवे’ से व्यक्त किया गया है, ताकि उपाधि और नाम दोनों अलग-अलग बने रहें।
- source_word: לִירוּשָׁלִַם
  choice: यरूशलेम से
  rationale: ל यहाँ कथन के संबोधित पक्ष को चिह्नित करता है; स्वाभाविक हिन्दी में ‘यरूशलेम से ... कहता है’ इसका स्पष्ट रूप है।
- source_word: מְכֹרֹתַיִךְ
  choice: तेरा मूल
  rationale: यह शब्द स्रोत या उद्गम का बोध देता है। ‘मूल’ आधुनिक हिन्दी में संक्षिप्त और स्वाभाविक है तथा वंशगत उद्गम की रूपकात्मक भाषा को बनाए रखता है।
- source_word: מוֹלְדֹתַיִךְ
  choice: तेरा जन्म
  rationale: शब्द जन्म अथवा जन्म-संबंधी उद्गम को सूचित करता है; ‘जन्म’ सामान्य पाठक के लिए सीधा और स्पष्ट है।
- source_word: מֵאֶרֶץ הַכְּנַעֲנִי
  choice: कनानी के देश से
  rationale: इब्रानी में जातिवाचक एकवचन ‘कनानी’ आया है। इसे बनाए रखने से आगे आने वाले ‘एमोरी’ और ‘हित्ती’ के साथ जातीय बल सुरक्षित रहता है।
- source_word: אָבִיךְ הָאֱמֹרִי
  choice: तेरा पिता एमोरी था
  rationale: इब्रानी का क्रियारहित वाक्य भूतकालीन संदर्भ में हिन्दी में ‘था’ के साथ स्वाभाविक है। आरोपात्मक रूपक को बिना व्याख्यात्मक विस्तार के रखा गया है।
- source_word: וְאִמֵּךְ חִתִּית
  choice: तेरी माता हित्ती थी
  rationale: स्त्रीलिंग जातिवाचक पद और क्रियारहित कथन को हिन्दी में स्वाभाविक रूप से ‘हित्ती थी’ कहा गया है।
- source_word: וְאָמַרְתָּ ... כֹּה אָמַר
  choice: और कहना ... यह कहता है
  rationale: पहली क्रिया भविष्यसूचक आदेश के रूप में ‘कहना’ और नबी-संदेश सूत्र को वर्तमान ‘यह कहता है’ से व्यक्त किया गया है।
theological_decisions:
- issue: यरूशलेम की रूपकात्मक वंशावली
  choice: पिता, माता, मूल और जन्म की भाषा को सीधे रूपकात्मक आरोप के रूप में बनाए रखना
  alternative: मुख्य पाठ में इसे नैतिक या आत्मिक समानता की स्पष्ट व्याख्या बना देना
  rationale: पद यरूशलेम को देश की इस्राएल-पूर्व जातियों से जोड़कर तीखा आरोप लगाता है। अनुवाद को इस तनावपूर्ण चित्र को न तो नरम करना चाहिए, न उसके भीतर अतिरिक्त धार्मिक व्याख्या जोड़नी चाहिए।
- issue: אֲדֹנָי יְהוִה में परमेश्वर के नाम का अनुवाद
  choice: प्रभु याहवे
  alternative: प्रभु यहोवा; प्रभु परमेश्वर
  rationale: यह रूप אֲדֹנָי की उपाधि और יהוה के व्यक्तिगत नाम दोनों को स्पष्ट एवं पृथक रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। यरूशलेम को स्त्री रूप में संबोधित करने के कारण ‘तेरा/तेरी’ का प्रयोग संबंधित संज्ञाओं के व्याकरणिक लिंग के अनुसार हुआ है। जातिनामों के लिए प्रचलित हिन्दी बाइबलीय रूप ‘कनानी’, ‘एमोरी’ और ‘हित्ती’ रखे गए हैं।
