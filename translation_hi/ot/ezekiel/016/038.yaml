  text: וּ/שְׁפַטְתִּי/ךְ֙ מִשְׁפְּטֵ֣י נֹאֲפ֔וֹת וְ/שֹׁפְכֹ֖ת דָּ֑ם וּ/נְתַתִּ֕י/ךְ דַּ֥ם חֵמָ֖ה וְ/קִנְאָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/016/038.yaml
  text: And I will judge you with the judgments of women who commit adultery and who shed blood[b][a], and I will give you over to blood in wrath and jealousy.
translation:
  language: hi
  text: मैं तेरा न्याय उन स्त्रियों के न्यायों के अनुसार करूँगा जो व्यभिचार करती हैं और रक्त बहाती हैं; और क्रोध और ईर्ष्या में तुझे रक्तपात के हवाले कर दूँगा।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इब्रानी में शाब्दिक रूप से: “मैं तुझे क्रोध और ईर्ष्या का रक्त दूँगा।” इसका आशय संभवतः क्रोध और ईर्ष्या में दिया गया रक्तमय दंड, अथवा रक्त बहाया जाना, है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּשְׁפַטְתִּיךְ
  choice: मैं तेरा न्याय ... करूँगा
  rationale: שׁפט यहाँ यरूशलेम के विरुद्ध परमेश्वर की न्यायिक कार्रवाई को व्यक्त करता है। ‘न्याय करना’ अगले מִשְׁפְּטֵי के साथ शब्द-संबंध बनाए रखता है और केवल दंडादेश तक अर्थ को सीमित नहीं करता।
- source_word: מִשְׁפְּטֵי
  choice: के न्याय के अनुसार
  rationale: सम्बद्ध बहुवचन यहाँ न्याय के मानदंड या प्रकार को दर्शाता है। हिन्दी में एकवचन भाववाचक ‘न्याय’ अधिक स्वाभाविक है, जबकि कानूनी अर्थ बना रहता है।
- source_word: נֹאֲפוֹת
  choice: व्यभिचारिणियों
  rationale: स्त्रीलिंग बहुवचन कृदन्त उन स्त्रियों को दर्शाता है जो व्यभिचार करती हैं। ‘व्यभिचारिणियों’ अध्याय के वैवाहिक रूपक और स्त्रीलिंग संकेत दोनों को संक्षेप में सुरक्षित रखता है।
- source_word: וְשֹׁפְכֹת דָּם
  choice: और रक्त बहानेवाली स्त्रियों
  rationale: यह स्त्रीलिंग कृदन्तीय पद पिछले शब्द के समानान्तर है और रक्तपात की दोषी स्त्रियों का वर्णन करता है। ‘रक्त बहाना’ मूल बिंब और हत्या की गंभीरता बनाए रखता है।
- source_word: וּנְתַתִּיךְ
  choice: तुझे ... के हवाले कर दूँगा
  rationale: נתן और उसके बाद के रक्त-संबंधी पद को हिन्दी में किसी को एक दंडात्मक दशा या परिणाम के हवाले करने के रूप में स्वाभाविक ढंग से व्यक्त किया गया है। इससे परमेश्वर की न्यायिक भूमिका स्पष्ट रहती है, पर क्रिया को अनावश्यक रूप से विस्तार नहीं दिया जाता।
- source_word: דַּם
  choice: रक्तपात
  rationale: यहाँ ‘रक्त’ अपराध के अनुरूप रक्तमय दंड या रक्त बहाए जाने की दशा को सूचित करता है। ‘रक्तपात’ हिन्दी में बोधगम्य है; मूल की संक्षिप्त और कुछ अस्पष्ट अभिव्यक्ति पादटिप्पणी में दी गई है।
- source_word: חֵמָה
  choice: क्रोध
  rationale: חֵמָה तीव्र, दहकते रोष को दर्शाता है। ‘क्रोध’ आधुनिक हिन्दी में गरिमापूर्ण और भविष्यद्वाणी के न्याय-प्रसंग के अनुकूल है।
- source_word: וְקִנְאָה
  choice: और जलन
  rationale: वैवाहिक-वाचा के प्रसंग में קִנְאָה विश्वासघात पर उठी ईर्ष्यापूर्ण प्रबल प्रतिक्रिया को दर्शाता है। ‘जलन’ वैवाहिक रूपक को बनाए रखता है और ‘उत्साह’ की अपेक्षा इस प्रसंग में अधिक सीधा है।
theological_decisions:
- issue: परमेश्वर के न्याय में वैवाहिक-वाचा की जलन और रक्त-दंड का संबंध
  choice: क्रोध और जलन में तुझे रक्तपात के हवाले कर दूँगा
  alternative: क्रोध और जलन का रक्त तुझे दूँगा
  rationale: चुना हुआ पाठ परमेश्वर की न्यायिक सक्रियता और दंड की कठोरता दोनों को बनाए रखता है, साथ ही कच्चे शाब्दिक रूप को अस्वाभाविक हिन्दी में थोपता नहीं। ‘जलन’ गलत ठहराए गए पति और टूटी वाचा के रूपक को नरम किए बिना सुरक्षित रखता है। मूल की संरचनात्मक अस्पष्टता पादटिप्पणी में बनी रहती है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। स्त्रीलिंग वैवाहिक रूपक, न्यायिक शब्दावली और कठोर रक्त-बिंब सुरक्षित हैं।
