source:
  edition: WLC
  text: וַ/הֲקִימוֹתִ֥י אֲנִ֛י אֶת בְּרִיתִ֖/י אִתָּ֑/ךְ וְ/יָדַ֖עַתְּ כִּֽי אֲנִ֥י יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/016/062.yaml
  text: And I myself will establish my covenant with you, and you will know that I am Yahweh.
translation:
  language: hi
  text: और मैं स्वयं तुम्हारे साथ अपनी वाचा स्थापित करूँगा, और तुम जानोगी कि मैं याहवे हूँ।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַהֲקִימוֹתִי
  choice: स्थापित करूँगा
  rationale: קום के हिफ़ील रूप का अर्थ यहाँ वाचा को स्थिर या प्रभावी रूप से स्थापित करना है। ‘स्थापित करूँगा’ आधुनिक हिन्दी में स्वाभाविक है और वाचा के संदर्भ को स्पष्ट रखता है।
- source_word: אֲנִי
  choice: मैं स्वयं
  rationale: क्रिया में कर्ता पहले से निहित होने पर भी स्वतंत्र सर्वनाम אֲנִי का प्रयोग बल देता है; ‘मैं स्वयं’ उस बल को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: בְּרִיתִי
  choice: अपनी वाचा
  rationale: בְּרִית परमेश्वर और मनुष्यों के संबंध में प्रयुक्त मानक बाइबलीय शब्द है। हिन्दी में ‘वाचा’ इसकी साहित्यिक और धर्मवैचारिक गंभीरता को सुरक्षित रखता है; ‘अपनी’ हिन्दी वाक्य-विन्यास में प्रथम पुरुष कर्ता से संबंध स्पष्ट करती है।
- source_word: אִתָּךְ
  choice: तुम्हारे साथ
  rationale: यह वाचा-संबंध को व्यक्त करता है। स्रोत में संबोधित व्यक्ति स्त्रीलिंग एकवचन है; हिन्दी में यह भेद आगे की क्रिया ‘जानोगी’ से स्पष्ट होता है।
- source_word: וְיָדַעַתְּ
  choice: और तुम जानोगी
  rationale: भविष्यसूचक कथन में यह रूप भावी या परिणामसूचक अर्थ देता है। ‘जानोगी’ स्त्रीलिंग एकवचन संबोधन को सुरक्षित रखता है, क्योंकि संदर्भ में यरूशलेम को स्त्री के रूप में संबोधित किया गया है; संयोजक को ‘और’ ही रखा गया है, ‘तब’ नहीं जोड़ा गया।
- source_word: יְהוָה
  choice: यहोवा
  rationale: चार अक्षरों वाले दिव्य नाम को उपाधि से बदलने के बजाय हिन्दी में प्रचलित नामरूप ‘यहोवा’ से प्रस्तुत किया गया है।
theological_decisions:
- issue: दिव्य नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ व्यक्तिगत दिव्य नाम का प्रयोग करता है। हिन्दी बाइबल-परंपरा में व्यापक रूप से पहचाने जाने वाले ‘यहोवा’ को रखते हुए उसे ‘प्रभु’ जैसी उपाधि से प्रतिस्थापित नहीं किया गया।
- issue: स्वतंत्र सर्वनाम אֲנִי का बल
  choice: मैं स्वयं
  alternative: मैं
  rationale: यह रूप परमेश्वर की अपनी पहल पर स्रोत-पाठ के बल को सुरक्षित रखता है, बिना उससे आगे कोई धर्मसैद्धांतिक निष्कर्ष जोड़े।
- issue: स्त्रीलिंग एकवचन संबोधन
  choice: तुम जानोगी
  alternative: तुम जानोगे
  rationale: हिब्रू रूप וְיָדַעַתְּ स्त्रीलिंग एकवचन है और प्रसंग में यरूशलेम को स्त्रीरूप में संबोधित किया गया है; हिन्दी में ‘जानोगी’ इस व्याकरणिक विशेषता को स्पष्ट रूप से बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। ‘वाचा’ बाइबलीय शब्दावली की निरंतरता बनाए रखता है। वाक्य में मूल का समन्वयी ढाँचा और ‘मैं स्वयं’ का बल सुरक्षित है।
