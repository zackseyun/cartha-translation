  text: וַ/יְהִי בָ֨/ךְ הֵ֤פֶךְ מִן הַ/נָּשִׁים֙ בְּ/תַזְנוּתַ֔יִ/ךְ וְ/אַחֲרַ֖יִ/ךְ לֹ֣א זוּנָּ֑ה וּ/בְ/תִתֵּ֣/ךְ אֶתְנָ֗ן וְ/אֶתְנַ֛ן לֹ֥א נִתַּן לָ֖/ךְ וַ/תְּהִ֥י לְ/הֶֽפֶךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/016/034.yaml
  text: 'And in your prostitution you were the opposite of other women: no one solicited you[a], but you gave payment, and no payment was given to you; so you became the opposite.'
translation:
  language: hi
  text: 'तुम अपनी वेश्यावृत्ति में अन्य स्त्रियों के विपरीत थीं: तुम्हें पाने के लिए कोई तुम्हारे पीछे नहीं आया[a], पर तुमने दाम दिया और तुम्हें दाम नहीं दिया गया; इस प्रकार तुम विपरीत हो गईं।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “तुम्हारे पीछे किसी ने वेश्यावृत्ति नहीं की”; प्रसंग में भाव यह है कि सामान्य वेश्याओं के विपरीत, ग्राहक तुम्हें खोजते हुए नहीं आए।
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵפֶךְ / לְהֶפֶךְ
  choice: बिलकुल उलट / बिलकुल उलट
  rationale: यह संज्ञा उलटाव या विपरीत स्थिति को दर्शाती है। आरंभ और अंत में एक ही अभिव्यक्ति रखने से इब्रानी की पुनरावृत्ति और सामान्य वेश्यावृत्ति की रीति के विडंबनापूर्ण उलटाव—दोनों सुरक्षित रहते हैं।
- source_word: תַזְנוּתַיִךְ
  choice: अपनी वेश्यावृत्ति में
  rationale: यह शब्द यहाँ यरूशलेम की बेवफाई के लिए प्रयुक्त विस्तृत और जानबूझकर तीखे यौन रूपक को व्यक्त करता है। ‘वेश्यावृत्ति’ आधुनिक, स्पष्ट और अनावश्यक रूप से प्राचीन शब्दावली से मुक्त है।
- source_word: וְאַחֲרַיִךְ לֹא זוּנָּה
  choice: कोई तुम्हारे पीछे वेश्यागमन करने नहीं आया
  rationale: शाब्दिक रचना लगभग ‘तुम्हारे पीछे किसी ने वेश्यागमन नहीं किया’ है। चुना हुआ रूप सामान्य ग्राहकों द्वारा उसके पास न आने का प्रसंगगत भाव देता है, जबकि ‘तुम्हारे पीछे’ को बनाए रखकर मूल की असामान्य अभिव्यक्ति और उसकी अस्पष्टता को पूरी तरह मिटाता नहीं।
- source_word: אֶתְנָן
  choice: दाम
  rationale: यह वेश्यावृत्ति के बदले दिए जाने वाले भुगतान का शब्द है। प्रसंग इसे पर्याप्त रूप से स्पष्ट करता है; ‘दाम’ दोनों उपवाक्यों में स्वाभाविक है और देने तथा पाने के स्पष्ट विरोध को बनाए रखता है।
- source_word: וּבְתִתֵּךְ אֶתְנָן
  choice: तुमने ही दाम दिया
  rationale: ‘ही’ इस विडंबनापूर्ण विरोध को उभारता है कि दाम पाने के बजाय उसने स्वयं दाम दिया।
- source_word: וְאֶתְנַן לֹא נִתַּן לָךְ
  choice: और तुम्हें कोई दाम नहीं दिया गया
  rationale: कर्मवाच्य रूप इब्रानी के निकट है और भुगतान वाले शब्द की स्पष्ट पुनरावृत्ति सुरक्षित रखता है।
- source_word: וַתְּהִי לְהֶפֶךְ
  choice: इस प्रकार तुम बिलकुल उलट ठहरीं
  rationale: यह परिणामस्वरूप बनी स्थिति को व्यक्त करता है और पद के आरंभ में आए ‘बिलकुल उलट’ को दोहराता है। स्त्रीलिंग क्रिया संबोधित यरूशलेम के अनुरूप है।
theological_decisions:
- issue: यरूशलेम की बेवफाई के लिए यौन रूपक
  choice: मुख्य पाठ में वेश्यावृत्ति के रूपक को सीधे बनाए रखा गया
  alternative: इसे केवल ‘बेवफाई’ या ‘मूर्तिपूजा’ कहकर नरम करना
  rationale: यहेजकेल यरूशलेम की वाचा-विरोधी बेवफाई को दिखाने के लिए जानबूझकर चौंकाने वाली यौन भाषा का उपयोग करता है। उसे किसी कम तीखे धर्मवैचारिक सार में बदलना मूल की आलंकारिक और नैतिक शक्ति को घटा देता।
