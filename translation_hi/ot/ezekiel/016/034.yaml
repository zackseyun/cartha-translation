  register: आधुनिक मानक हिन्दी में सीधी, गंभीर और सामान्य पाठक के लिए बोधगम्य भाषा रखी गई है। मूल के कठोर वेश्यावृत्ति-रूपक, भुगतान के उलटाव और आरंभ-अंत की पुनरावृत्ति को सुरक्षित रखा गया है।
