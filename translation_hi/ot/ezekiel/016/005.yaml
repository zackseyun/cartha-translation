base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/016/005.yaml
  text: No eye pitied you enough to do for you even one of these things[a], to have compassion on you; instead, you were thrown out into the open field in loathing of your life on the day you were born.
translation:
  language: hi
  text: किसी की आँख को तुम पर इतना भी तरस न आया कि वह तुम पर दया करके तुम्हारे लिए इनमें से एक भी काम करती। इसके बजाय, जिस दिन तुम पैदा हुईं, तुम्हें तुमसे घृणा के कारण[a] खुले मैदान में फेंक दिया गया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी पदबंध संक्षिप्त है। इसका अनुवाद “तुम्हारे प्रति घृणा के कारण” या अधिक शाब्दिक रूप से “तुम्हारे प्राण के प्रति घृणा में” भी किया जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: חָסָה עָלַיִךְ עַיִן
  choice: किसी आँख ने तुम पर तरस नहीं खाया
  rationale: इब्रानी के मानवीकृत मुहावरे ‘आँख ने तरस नहीं खाया’ को बनाए रखता है और आधुनिक हिन्दी में स्वाभाविक है।
- source_word: לַעֲשׂוֹת לָךְ אַחַת מֵאֵלֶּה
  choice: तुम्हारे लिए इनमें से एक भी काम करती
  rationale: यह पिछले पद में बताई नवजात-शिशु की देखभाल की क्रियाओं की ओर संकेत करता है; ‘एक भी’ पूर्ण उपेक्षा पर बल देता है।
- source_word: לְחֻמְלָה עָלָיִךְ
  choice: तुम पर दया दिखाती
  rationale: חֻמְלָה की करुणामय चिंता को सहज हिन्दी में व्यक्त करता है, बिना किसी अतिरिक्त वाचा-संबंधी अर्थ के।
- source_word: וַתֻּשְׁלְכִי
  choice: तुम्हें ... फेंक दिया गया
  rationale: होफ़अल रूप की कर्मवाच्य शक्ति और परित्याग की कठोरता दोनों को सुरक्षित रखता है।
- source_word: אֶל־פְּנֵי הַשָּׂדֶה
  choice: खुले मैदान में
  rationale: शाब्दिक ‘मैदान की सतह पर’ के आशय—खुले में असुरक्षित छोड़ देना—को स्वाभाविक हिन्दी में देता है।
- source_word: בְּגֹעַל נַפְשֵׁךְ
  choice: तुम्हारे प्राण से घृणा किए जाने के कारण
  rationale: गूढ़ इब्रानी पदबंध में גֹעַל की घृणा और נֶפֶשׁ के ‘प्राण/जीवित व्यक्ति’ दोनों को यथासंभव बनाए रखता है; कर्ता को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: בְּיוֹם הֻלֶּדֶת אֹתָךְ
  choice: जिस दिन तुम पैदा हुईं
  rationale: सीधा, स्वाभाविक कालवाचक अनुवाद है और स्त्रीलिंग संबोधन के अनुरूप है।
theological_decisions:
- issue: בְּגֹעַל נַפְשֵׁךְ में घृणा का संबंध
  choice: तुम्हारे प्राण से घृणा किए जाने के कारण
  alternative: अपने प्राण की घृणा में / तुम्हारे प्रति घृणा के कारण
  rationale: इब्रानी पदबंध संक्षिप्त और अर्थ की दृष्टि से तनावपूर्ण है। मुख्य पाठ घृणा को नवजात के जीवन/व्यक्ति की ओर निर्देशित दिखाता है, पर उसके कर्ता या अनुभवकर्ता को स्पष्ट करके अस्पष्टता समाप्त नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी; संबोधित नगर का स्त्रीलिंग रूप बनाए रखा गया है। भाषा गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध है।
