source:
  edition: WLC
  text: הָ/אִשָּׁ֖ה הַ/מְּנָאָ֑פֶת תַּ֣חַת אִישָׁ֔/הּ תִּקַּ֖ח אֶת זָרִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/016/032.yaml
  text: The adulterous wife takes strangers instead of her husband[a].
translation:
  language: hi
  text: व्यभिचारिणी पत्नी अपने पति के बदले पराए पुरुषों को लेती है[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जो स्त्री व्यभिचार करती है, वह अपने पति के स्थान पर दूसरे पुरुषों को लेती है।”
    reason: ‘पत्नी/स्त्री,’ कृदन्त ‘व्यभिचारिणी/जो व्यभिचार करती है,’ तथा ‘पराए/दूसरे’ के सम्भव शाब्दिक रूपों को दर्शाने वाला वैकल्पिक अनुवाद।
lexical_decisions:
- source_word: הָאִשָּׁה
  choice: पत्नी
  rationale: संज्ञा का अर्थ ‘स्त्री’ या ‘पत्नी’ हो सकता है, पर आगे ‘उसका पति’ आने के कारण यहाँ वैवाहिक अर्थ स्पष्ट है।
- source_word: הַמְּנָאָפֶת
  choice: व्यभिचारिणी
  rationale: यह कृदन्त उस पत्नी को व्यभिचार करने वाली के रूप में चित्रित करता है। ‘व्यभिचारिणी’ संक्षिप्त, स्पष्ट और वर्तमान हिन्दी में बोधगम्य है।
- source_word: תַּחַת
  choice: के बदले
  rationale: 'यहाँ संबंध स्थान का नहीं, प्रतिस्थापन का है: वह अपने पति के स्थान पर दूसरों को अपनाती है।'
- source_word: אִישָׁהּ
  choice: अपने पति
  rationale: वैवाहिक प्रसंग में אִישׁ और स्त्रीलिंग एकवचन प्रत्यय का स्वाभाविक अर्थ ‘उसका पति’ है; हिन्दी में कर्ता-संबंध स्पष्ट करने के लिए ‘अपने’ अधिक स्वाभाविक है।
- source_word: תִּקַּח
  choice: अपनाती है
  rationale: לקח का मूल अर्थ ‘लेना’ है। इस यौन और वैवाहिक प्रसंग में केवल ‘लेती है’ हिन्दी में अधूरा लगता है; ‘अपनाती है’ क्रिया की सक्रियता और पराए पुरुषों को पति के स्थान पर स्वीकार करने का भाव रखता है।
- source_word: זָרִים
  choice: पराए पुरुषों
  rationale: זָרִים outsiders या strangers को दर्शाता है। प्रसंग से पुरुष अभिप्रेत हैं; ‘पराए पुरुष’ अनावश्यक रूप से राष्ट्रीयता का अर्थ जोड़े बिना वैवाहिक और वाचा-संबंधी परायेपन को बनाए रखता है।
theological_decisions:
- issue: यरूशलेम की वाचा-विहीनता का वैवाहिक व्यभिचार के रूप में रूपक
  choice: वैवाहिक और व्यभिचार की छवि को सीधे बनाए रखा गया है।
  alternative: अर्थ को केवल आत्मिक विश्वासघात के रूप में व्याख्यात्मक ढंग से कहना।
  rationale: यह पद यहेजकेल 16 के विस्तृत वैवाहिक रूपक का भाग है। सीधे रूपक को बनाए रखने से आरोप की तीक्ष्णता और वाचा से विश्वासघात का तनाव सुरक्षित रहता है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की है। ‘व्यभिचारिणी’ पद की कठोर भविष्यद्वाणी-संबंधी शैली बनाए रखता है, जबकि ‘अपनाती है’ शाब्दिक ‘लेती है’ की अपेक्षा हिन्दी में अधिक स्वाभाविक है।
