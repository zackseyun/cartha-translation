source:
  edition: WLC
  text: וְ/שָׂרְפ֤וּ בָתַּ֨יִ/ךְ֙ בָּ/אֵ֔שׁ וְ/עָשׂוּ בָ֣/ךְ שְׁפָטִ֔ים לְ/עֵינֵ֖י נָשִׁ֣ים רַבּ֑וֹת וְ/הִשְׁבַּתִּי/ךְ֙ מִ/זּוֹנָ֔ה וְ/גַם אֶתְנַ֖ן לֹ֥א תִתְּנִי עֽוֹד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/016/041.yaml
  text: They will burn your houses with fire and execute judgments against you before the eyes of many women[a]. I will put a stop to your prostitution[c][b], and you will no longer give payment.
translation:
  language: hi
  text: वे तुम्हारे घरों को आग से जला देंगे और बहुत-सी स्त्रियों के सामने[a] तुम्हारे विरुद्ध न्याय के दंड लागू करेंगे। मैं तुम्हारी वेश्यावृत्ति समाप्त कर दूँगा[b], और तुम फिर वेश्यावृत्ति के लिए कोई भुगतान नहीं दोगी[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘बहुत-सी स्त्रियों की आँखों के सामने।’
    reason: lexical_alternative
  - marker: b
    text: 'इब्रानी का अधिक शाब्दिक अर्थ: ‘मैं तुम्हें वेश्या होने से रोक दूँगा।’'
    reason: lexical_alternative
  - marker: c
    text: इब्रानी शब्द वेश्यावृत्ति से जुड़े भुगतान या शुल्क के लिए प्रयुक्त होता है।
    reason: lexical_clarification
lexical_decisions:
- source_word: וְשָׂרְפוּ בָתַּיִךְ בָּאֵשׁ
  choice: वे तुम्हारे घरों को आग में जला देंगे
  rationale: भविष्यसूचक दंड के क्रम में क्रिया को भविष्यकाल में रखा गया है; בָּאֵשׁ आग द्वारा विनाश का ठोस चित्र बनाए रखता है।
- source_word: וְעָשׂוּ בָךְ שְׁפָטִים
  choice: तुम्हें दंड देंगे
  rationale: עשה + שְׁפָטִים न्यायिक दंड को कार्यान्वित करने का मुहावरा है। सरल हिन्दी में ‘तुम्हें दंड देंगे’ उसका न्यायिक परिणाम स्वाभाविक रूप से व्यक्त करता है।
- source_word: לְעֵינֵי נָשִׁים רַבּוֹת
  choice: बहुत-सी स्त्रियों की आँखों के सामने
  rationale: शाब्दिक दृश्य-भाषा सार्वजनिक अपमान के भाव को सुरक्षित रखती है और हिन्दी में भी स्वाभाविक है।
- source_word: וְהִשְׁבַּתִּיךְ מִזּוֹנָה
  choice: मैं तुम्हारी वेश्यावृत्ति बंद करा दूँगा
  rationale: हिफ़ील रूप का कारणवाचक अर्थ ‘बंद करा दूँगा’ में सुरक्षित है। זנה की जानबूझकर प्रयुक्त यौन और वाचा-भंग संबंधी उपमा को अस्पष्ट ‘विश्वासघात’ से नहीं बदला गया।
- source_word: אֶתְנַן
  choice: वेश्यावृत्ति का दाम
  rationale: यह शब्द वेश्यावृत्ति से जुड़े भुगतान को दर्शाता है। प्रसंग में यरूशलेम स्वयं भुगतान देती है, इसलिए ‘मजदूरी’ की अपेक्षा ‘दाम’ अधिक स्पष्ट है।
- source_word: לֹא תִתְּנִי עוֹד
  choice: तुम फिर कभी ... नहीं दोगी
  rationale: स्त्रीलिंग एकवचन संबोधन और भविष्य में पूर्ण समाप्ति—दोनों को हिन्दी में बनाए रखा गया है।
theological_decisions:
- issue: यरूशलेम की अविश्वासयोग्यता के लिए यौन रूपक
  choice: मुख्य पाठ में ‘वेश्यावृत्ति’ को स्पष्ट रूप से बनाए रखा गया
  alternative: इसे केवल ‘विश्वासघात’ या ‘मूर्तिपूजा’ कहना
  rationale: यहेजकेल का रूपक जानबूझकर तीखा है और वाचा-भंग को यौन भाषा में चित्रित करता है; इसे अमूर्त धार्मिक शब्द में बदलना मूल पाठ के प्रभाव और तनाव को कम कर देता।
- issue: यरूशलेम द्वारा भुगतान देना
  choice: ‘वेश्यावृत्ति का दाम नहीं दोगी’
  alternative: ‘वेश्या की कमाई नहीं लोगी’
  rationale: क्रिया תִתְּנִי का अर्थ ‘तुम दोगी’ है, और निकटवर्ती प्रसंग में उलटी स्थिति यह है कि यरूशलेम अपने प्रेमियों को भुगतान करती है। इसलिए प्राप्त करने का भाव नहीं जोड़ा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी, स्त्रीलिंग एकवचन संबोधन और गरिमापूर्ण किंतु तीखे भविष्यसूचक स्वर को बनाए रखा गया है। ‘दंड देंगे’ को अत्यधिक प्रशासनिक ‘दंडादेश कार्यान्वित करेंगे’ की अपेक्षा सामान्य पाठक के लिए स्वाभाविक रखा गया है।
