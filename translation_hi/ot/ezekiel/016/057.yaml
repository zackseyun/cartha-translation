- from: तेरी दुष्टता प्रकट होने से पहले[a], जैसा उस समय हुआ जब अराम की बेटियाँ[b] और उसके चारों ओर के सब लोग, और पलिश्तियों की बेटियाँ[c]—जो चारों ओर से तुझे तुच्छ समझती थीं—तेरी निन्दा करती थीं।
  to: तेरी दुष्टता प्रकट होने से पहले[a], उस समय के समान जब अराम की बेटियों और उसके चारों ओर के सब लोगों की ओर से, तथा पलिश्तियों की उन बेटियों[b] की ओर से—जो चारों ओर से तुझे तुच्छ समझती हैं[c]—तेरी निन्दा होती थी।
  rationale: The revision removes an added, undefined event from the comparison, preserves the source’s “time of reproach” construction, and clarifies that the listed neighboring groups are the agents of Jerusalem’s reproach. The participial contempt is rendered in the present tense (“समझती हैं”), corresponding to the Hebrew participle and the English audit trail. Footnote anchors have been placed on the relevant expressions; their order is adjusted to keep each note adjacent to its referent.
  reviewer_model: gpt-5.6-terra
