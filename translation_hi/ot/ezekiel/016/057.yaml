translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की है, पर भविष्यद्वाणी के आरोप और सार्वजनिक अपमान की गरिमा तथा तीव्रता बनाए रखी गई है। यरूशलेम के लिए मूल पाठ के स्त्रीलिंग एकवचन सम्बोधन को ‘तेरी/तुझे’ से सुरक्षित रखा गया है।
