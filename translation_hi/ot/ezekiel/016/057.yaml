source:
  edition: WLC
  text: בְּ/טֶרֶם֮ תִּגָּלֶ֣ה רָעָתֵ/ךְ֒ כְּמ֗וֹ עֵ֚ת חֶרְפַּ֣ת בְּנוֹת אֲרָ֔ם וְ/כָל סְבִיבוֹתֶ֖י/הָ בְּנ֣וֹת פְּלִשְׁתִּ֑ים הַ/שָּׁאט֥וֹת אוֹתָ֖/ךְ מִ/סָּבִֽיב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/016/057.yaml
  text: before your wickedness was uncovered[a], as at the time of the reproach of the daughters of Aram and all those around her, the daughters of the Philistines[c][b], who despise you from every side.
translation:
  language: hi
  text: तेरी दुष्टता प्रकट होने से पहले[a], उस समय के समान जब अराम की बेटियों और उसके चारों ओर के सब लोगों की ओर से, तथा पलिश्तियों की उन बेटियों[b] की ओर से—जो चारों ओर से तुझे तुच्छ समझती हैं[c]—तेरी निन्दा होती थी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘उजागर होने से पहले’ या ‘प्रकट किए जाने से पहले’।
    reason: lexical_alternative
  - marker: b
    text: ‘पलिश्तियों की बेटियाँ’ एक इब्रानी मुहावरा है, जिसका आशय पलिश्ती लोग या उनके नगर हैं।
    reason: cultural_note
  - marker: c
    text: ‘अराम’ को परम्परागत रूप से ‘सीरिया’ भी कहा जाता है। ‘अराम की बेटियाँ’ से आशय अराम के लोग या उसके नगर हैं।
    reason: cultural_note
lexical_decisions:
- source_word: בְּטֶרֶם תִּגָּלֶה רָעָתֵךְ
  choice: तेरी दुष्टता प्रकट होने से पहले
  rationale: यह वाक्यांश समयगत पूर्वता और दुष्टता के सार्वजनिक रूप से सामने आने का भाव रखता है। ‘प्रकट होना’ נִפעל रूप की निष्क्रिय अर्थ-छाया को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: כְּמוֹ עֵת חֶרְפַּת
  choice: जैसा उस समय हुआ … तेरी निन्दा करती थीं
  rationale: शाब्दिक संज्ञात्मक रचना ‘निन्दा के समय के समान’ हिन्दी में बोझिल होती। इसे उपवाक्य के रूप में व्यक्त करने से तुलना और सार्वजनिक अपमान, दोनों का भाव स्पष्ट रहता है।
- source_word: בְּנוֹת אֲרָם
  choice: अराम की बेटियाँ
  rationale: स्थान-नाम ‘अराम’ और इब्रानी सामूहिक मुहावरे ‘बेटियाँ’ को सुरक्षित रखा गया है; उसका आशय पादटिप्पणी में स्पष्ट किया गया है।
- source_word: וְכָל סְבִיבוֹתֶיהָ
  choice: और उसके चारों ओर के सब लोग
  rationale: स्त्रीलिंग प्रत्यय को निकटतम पूर्वपद ‘अराम’ से सम्बद्ध माना गया है। ‘सब लोग’ निहित निवासियों/समुदायों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: בְּנוֹת פְּלִשְׁתִּים
  choice: पलिश्तियों की बेटियाँ
  rationale: मूल का ‘बेटियाँ’ वाला सामूहिक मुहावरा बनाए रखा गया है और उसका अर्थ पादटिप्पणी में दिया गया है।
- source_word: הַשָּׁאטוֹת אוֹתָךְ
  choice: जो … तुझे तुच्छ समझती थीं
  rationale: कृदन्त लगातार बने तिरस्कारपूर्ण रवैये को दर्शाता है; ‘तुच्छ समझना’ आधुनिक हिन्दी में इस भाव को स्पष्ट और गरिमापूर्ण ढंग से व्यक्त करता है।
- source_word: מִסָּבִיב
  choice: चारों ओर से
  rationale: यह चारों दिशाओं से घेर लेने वाले तिरस्कार का भाव संक्षेप में बनाए रखता है।
