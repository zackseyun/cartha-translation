source:
  edition: WLC
  text: כֹּֽה אָמַ֞ר אֲדֹנָ֣/י יְהֹוִ֗ה יַ֣עַן הִשָּׁפֵ֤ךְ נְחֻשְׁתֵּ/ךְ֙ וַ/תִּגָּלֶ֣ה עֶרְוָתֵ֔/ךְ בְּ/תַזְנוּתַ֖יִ/ךְ עַל מְאַהֲבָ֑יִ/ךְ וְ/עַל֙ כָּל גִּלּוּלֵ֣י תוֹעֲבוֹתַ֔יִ/ךְ וְ/כִ/דְמֵ֣י בָנַ֔יִ/ךְ אֲשֶׁ֥ר נָתַ֖תְּ לָ/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/016/036.yaml
  text: 'Thus says the Lord GOD: Because your bronze was poured out[a], and your nakedness was uncovered in your prostitutions with your lovers, and because of all the idols of your abominations, and because of the blood of your children whom you gave to them[c][b],'
translation:
  language: hi
  text: '“प्रभु यहोवा यों कहता है: चूँकि तुम्हारा काँसा उँडेला गया[a], और अपने प्रेमियों के साथ किए गए वेश्यागमन में तुम्हारी नग्नता उघाड़ी गई, और तुम्हारी सभी घिनौनी मूर्तियों[b] तथा तुम्हारे बच्चों के रक्त के कारण, जिन्हें तुमने उन्हें दे दिया[c],”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या सम्भवतः, “तुम्हारा धन उँडेला गया।” इब्रानी में शाब्दिक रूप से “तुम्हारा काँसा” है; यह प्रेमियों पर लुटाए गए धन का रूपक हो सकता है, और कुछ इसे अश्लील यौन प्रदर्शन का संकेत मानते हैं।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी पदबंध का अधिक शाब्दिक रूप है, “तुम्हारी घिनौनी वस्तुओं की मूर्तियाँ।” यहाँ ‘मूर्तियों’ के लिए यहेजकेल का तिरस्कारपूर्ण शब्द प्रयुक्त है।
    reason: lexical_alternative
  - marker: c
    text: अर्थात बच्चों को मूर्तियों के लिए बलि के रूप में देना।
    reason: cultural_note
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  choice: प्रभु यहोवा
  rationale: इस विशिष्ट संयुक्त ईश्वरीय उपाधि में אֲדֹנָי को ‘प्रभु’ और चतुरक्षरीय नाम יהוה को ‘यहोवा’ कहा गया है, जिससे दोनों तत्व अलग और स्पष्ट रहते हैं।
- source_word: יַעַן
  choice: चूँकि
  rationale: यह आने वाले न्याय के कारणों की शृंखला आरम्भ करता है; ‘चूँकि’ अधूरे वाक्य के अगले पद में जारी रहने का संकेत भी स्वाभाविक रूप से देता है।
- source_word: הִשָּׁפֵךְ
  choice: उँडेला गया
  rationale: שפך के निष्क्रिय अर्थ ‘उँडेला/बहाया जाना’ को बनाए रखता है और रूपक को समझाकर सीमित नहीं करता।
- source_word: נְחֻשְׁתֵּךְ
  choice: तुम्हारा काँसा
  rationale: संज्ञा का सामान्य अर्थ ‘काँसा/ताँबा’ है। संदर्भ में धन, भुगतान अथवा अश्लील प्रदर्शन का रूपक सम्भव है, पर मुख्य पाठ स्रोत-छवि को बनाए रखता है।
- source_word: וַתִּגָּלֶה עֶרְוָתֵךְ
  choice: तुम्हारी नग्नता उघाड़ी गई
  rationale: यौन अनावरण और लज्जा की इब्रानी छवि को गरिमापूर्ण, स्पष्ट हिन्दी में सुरक्षित रखता है।
- source_word: בְּתַזְנוּתַיִךְ עַל מְאַהֲבָיִךְ
  choice: अपने प्रेमियों के साथ किए गए वेश्यागमन में
  rationale: बहुवचन यौन कृत्यों और प्रेमियों से सम्बन्ध को स्वाभाविक हिन्दी में व्यक्त करता है; यह वाचा-विमुखता के निहित रूपक को अलग से व्याख्यायित नहीं करता।
- source_word: גִּלּוּלֵי תוֹעֲבוֹתַיִךְ
  choice: तुम्हारी सभी घिनौनी मूर्तियों
  rationale: दोनों संज्ञाओं के संयुक्त भाव को सहज हिन्दी में ‘घिनौनी मूर्तियाँ’ कहा गया है; גִּלּוּלִים में निहित तिरस्कार को पादटिप्पणी में बताया गया है।
- source_word: וְכִדְמֵי בָנַיִךְ
  choice: तुम्हारे बच्चों के रक्त के कारण
  rationale: आरोपों की कारणसूचक शृंखला में כִ को प्रसंगानुसार कारणसूचक समझा गया है; ‘रक्त’ बाल-बलि से उत्पन्न रक्तदोष को बिना विस्तार जोड़े सामने रखता है।
- source_word: אֲשֶׁר נָתַתְּ לָהֶם
  choice: जिन्हें तुमने उन्हें दे दिया
  rationale: ‘जिन्हें’ का सम्बन्ध बच्चों से है और נתן के सीधे अर्थ ‘देना’ को रखा गया है। ‘उन्हें’ मूर्तियों की ओर संकेत करता है, जबकि बलि का आशय पादटिप्पणी में स्पष्ट है।
theological_decisions:
- issue: נְחֻשְׁתֵּךְ का रूपकार्थ
  choice: मुख्य पाठ में शाब्दिक छवि ‘तुम्हारा काँसा’ रखी गई।
  alternative: ‘तुम्हारा धन’ अथवा यौन उच्छृंखलता/अनावरण को सीधे व्यक्त करने वाला अर्थ।
  rationale: शब्द का सामान्य कोशीय अर्थ काँसा या ताँबा है, पर इस संदर्भ में उसका सटीक रूपकार्थ विवादित है। मुख्य पाठ में स्रोत की असामान्य छवि रखने से वास्तविक अस्पष्टता सुरक्षित रहती है।
- issue: बच्चों को देने का बलिदानी आशय
  choice: ‘जिन्हें तुमने उन्हें दे दिया’ के रूप में נתן का सीधा अर्थ रखा गया।
  alternative: ‘जिन्हें तुमने उन मूर्तियों के लिए बलि चढ़ाया।’
  rationale: संदर्भ बाल-बलि की ओर स्पष्ट संकेत करता है, पर इब्रानी क्रिया केवल ‘दिया’ कहती है। मुख्य पाठ मूल की कठोर संक्षिप्तता रखता है और पादटिप्पणी सांस्कृतिक आशय बताती है।
- issue: כִדְמֵי में כִ की भूमिका
  choice: समांतर आरोपों के अनुसार कारणसूचक—‘रक्त के कारण’।
  alternative: तुलनात्मक—‘तुम्हारे बच्चों के रक्त के समान’।
  rationale: יַעַן के अधीन आरोपों की संचयी संरचना कारणसूचक अर्थ का समर्थन करती है, यद्यपि उपसर्ग का सामान्य तुलनात्मक अर्थ व्याकरणतः ध्यान देने योग्य है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु स्पष्ट रखी गई है। यरूशलेम को सम्बोधित आरोप की तीव्रता बनाए रखने के लिए ‘तुम्हारा/तुम्हारी’ का प्रयोग हुआ है। पद 36 अगले पद में जारी रहने वाला कारणसूचक वाक्यांश है, इसलिए अन्त में अल्पविराम रखा गया है। असामान्य ‘काँसा’ को सरल बनाकर किसी एक व्याख्या में नहीं बदला गया।
