  text: וַ/תִּזְנִי֙ אֶל בְּנֵ֣י אַשּׁ֔וּר מִ/בִּלְתִּ֖י שָׂבְעָתֵ֑/ךְ וַ/תִּזְנִ֕י/ם וְ/גַ֖ם לֹ֥א שָׂבָֽעַתְּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/016/028.yaml
  text: You prostituted yourself with the sons of Assyria because you were not satisfied[a]; you prostituted yourself with them[b], and even then you were not satisfied.
translation:
  language: hi
  text: तूने अश्शूर के पुत्रों के साथ वेश्यावृत्ति की, क्योंकि तू तृप्त नहीं थी[a]। तूने उनके साथ वेश्यावृत्ति की[b], फिर भी तू तृप्त नहीं हुई।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘अश्शूर के पुत्रों’ का अर्थ ‘अश्शूरियों’ से है।
    reason: lexical_alternative
  - marker: b
    text: वेश्यावृत्ति का यह दोहराया गया रूपक यरूशलेम की विदेशी संधियों और मूर्तिपूजा में प्रकट बेवफ़ाई को दर्शाता है।
    reason: cultural_note
lexical_decisions:
- source_word: וַתִּזְנִי
  choice: तू वेश्यावृत्ति करने लगी
  rationale: זנה के स्पष्ट और झकझोरने वाले यौन रूपक को बनाए रखता है; यहाँ यह यरूशलेम की राजनीतिक और धार्मिक बेवफ़ाई को चित्रित करता है।
- source_word: אֶל בְּנֵי אַשּׁוּר
  choice: अश्शूर के पुत्रों के साथ
  rationale: אֶל को זנה के साथ स्वाभाविक हिन्दी में ‘के साथ’ किया गया है, जबकि בְּנֵי אַשּׁוּר की स्रोत-अभिव्यक्ति ‘अश्शूर के पुत्रों’ के रूप में सुरक्षित रखी गई है।
- source_word: מִבִּלְתִּי שָׂבְעָתֵךְ
  choice: क्योंकि तू तृप्त नहीं हुई थी
  rationale: यह अभिव्यक्ति अतृप्ति को कार्य के कारण अथवा प्रेरक परिस्थिति के रूप में प्रस्तुत करती है; ‘तृप्त’ שׂבע के परितोष और भर जाने, दोनों भावों को सँभालता है।
- source_word: וַתִּזְנִים
  choice: तूने उनके साथ वेश्यावृत्ति की
  rationale: क्रिया से जुड़े तृतीय पुरुष बहुवचन प्रत्यय को ‘उनके साथ’ द्वारा स्पष्ट किया गया है, जिसका संकेत अश्शूर के पुत्रों की ओर है।
- source_word: וְגַם לֹא שָׂבָעַתְּ
  choice: फिर भी तू तृप्त नहीं हुई
  rationale: 'संदर्भ में וְגַם विडंबनापूर्ण तीव्रता उत्पन्न करता है: और अधिक वेश्यावृत्ति के बाद भी तृप्ति नहीं मिली; ‘फिर भी’ इसे स्वाभाविक हिन्दी में व्यक्त करता है।'
theological_decisions:
- issue: यरूशलेम की वाचा-संबंधी, राजनीतिक और धार्मिक बेवफ़ाई के लिए वेश्यावृत्ति के रूपक को बनाए रखना
  choice: मुख्य पाठ में स्पष्ट यौन रूपक ‘वेश्यावृत्ति’ रखा गया
  alternative: इसे नरम करके ‘बेवफ़ाई की’ या ‘विदेशी संधियाँ कीं’ कहना
  rationale: यहेजकेल 16 जानबूझकर तीखी यौन छवि के द्वारा यरूशलेम की मूर्तिपूजा और विदेशी संबंधों को चित्रित करता है। इसे नरम करना भविष्यवाणी की अलंकारिक और धर्मवैचारिक शक्ति को घटा देता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु जानबूझकर तीखा भविष्यद्वाणी-संबंधी स्वर रखा गया है। स्त्रीलिंग एकवचन ‘तू’ यरूशलेम को संबोधित मूल इब्रानी रूप के अनुरूप है।
