source:
  edition: WLC
  text: וַ/תִּקְחִ֞י כְּלֵ֣י תִפְאַרְתֵּ֗/ךְ מִ/זְּהָבִ֤/י וּ/מִ/כַּסְפִּ/י֙ אֲשֶׁ֣ר נָתַ֣תִּי לָ֔/ךְ וַ/תַּעֲשִׂי לָ֖/ךְ צַלְמֵ֣י זָכָ֑ר וַ/תִּזְנִי בָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/016/017.yaml
  text: You took your beautiful jewels from my gold and my silver[a], which I had given to you, and made for yourself male images[c][b], and you prostituted yourself with them.
translation:
  language: hi
  text: तुमने मेरे सोने और चाँदी से बने अपने शोभायमान आभूषण[a] लिए, जो मैंने तुम्हें दिया था, और अपने लिए पुरुष-आकृतियाँ[b] बनाईं; फिर तुमने उनके साथ वेश्यावृत्ति की[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘अपनी वैभवशाली वस्तुएँ’ अथवा ‘अपने सुंदर अलंकार।’ इब्रानी शब्द का अर्थ सामान्यतः वस्तु या सामान भी हो सकता है, पर यहाँ सोने-चाँदी से बनी सजावटी वस्तुएँ अभिप्रेत जान पड़ती हैं।
    reason: lexical_alternative
  - marker: b
    text: या ‘पुरुष-मूर्तियाँ’ अथवा ‘पुरुषों के रूप वाली प्रतिमाएँ।’
    reason: alternative_reading
  - marker: c
    text: ‘वेश्यावृत्ति की’ भविष्यद्वक्ताओं में बार-बार आने वाला रूपक है, जो मूर्तिपूजा के द्वारा वाचा के प्रति विश्वासघात को व्यक्त करता है।
    reason: cultural_note
lexical_decisions:
- source_word: כְּלֵי תִפְאַרְתֵּךְ
  choice: अपने शोभायमान आभूषण
  rationale: כְּלִי का अर्थ वस्तु, पात्र या सामान हो सकता है; सोने-चाँदी और श्रृंगार के संदर्भ में ‘आभूषण’ स्वाभाविक है। ‘शोभायमान’ תִפְאֶרֶת के सौंदर्य और वैभव के भाव को बनाए रखता है।
- source_word: מִזְּהָבִי וּמִכַּסְפִּי
  choice: मेरे उस सोने और उस चाँदी से
  rationale: מִן यहाँ निर्माण-सामग्री का स्रोत बताता है। ‘मेरे’ को बनाए रखने से इस आरोप पर बल रहता है कि यरूशलेम ने परमेश्वर की दी हुई बहुमूल्य सामग्री का दुरुपयोग किया।
- source_word: אֲשֶׁר נָתַתִּי לָךְ
  choice: जो मैंने तुम्हें दिए थे
  rationale: यह संबंधवाचक उपवाक्य सोने और चाँदी को वक्ता द्वारा पहले दिए गए उपहारों के रूप में पहचानता है; ‘दिए थे’ आरोप की पूर्वकालिक पृष्ठभूमि स्पष्ट करता है।
- source_word: וַתַּעֲשִׂי לָךְ
  choice: और अपने लिए ... बनाईं
  rationale: ‘अपने लिए’ לָךְ के आत्म-लाभार्थक बल को सुरक्षित रखता है और बताता है कि दिए गए उपहारों को अनुचित निजी उद्देश्य के लिए उपयोग किया गया।
- source_word: צַלְמֵי זָכָר
  choice: पुरुष-आकृतियाँ
  rationale: צֶלֶם ‘प्रतिमा/आकृति’ और זָכָר स्पष्टतः ‘पुरुष/नर’ है। ‘पुरुष-आकृतियाँ’ मूल की लैंगिक और चौंकाने वाली भाषा को रखती हैं, पर मुख्य पाठ में ‘मूर्तियाँ’ कहकर व्याख्या नहीं थोपतीं।
- source_word: וַתִּזְנִי בָם
  choice: फिर तुमने उनके साथ वेश्यावृत्ति की
  rationale: זנה की स्पष्ट यौन और भविष्यद्वक्ताओं में प्रयुक्त वाचा-विरोधी रूपकात्मक शक्ति को बनाए रखा गया है। ‘उनके साथ’ בָם का सीधा संबंध व्यक्त करता है।
theological_decisions:
- issue: मूर्तिपूजा के लिए भविष्यद्वक्ताओं का यौन रूपक
  choice: स्पष्ट भाषा ‘वेश्यावृत्ति की’ को मुख्य पाठ में रखा गया।
  alternative: ‘उनके साथ विश्वासघात किया’ या ‘मूर्तिपूजा की’
  rationale: यहेजकेल जानबूझकर यरूशलेम की वाचा-विरोधी मूर्तिपूजा को चौंकाने वाले यौन रूपक से चित्रित करता है। इसे सामान्य ‘विश्वासघात’ में नरम करना मूल की वाग्मय शक्ति घटा देता।
- issue: צַלְמֵי זָכָר का स्वरूप
  choice: ‘पुरुष-आकृतियाँ’
  alternative: ‘पुरुष-मूर्तियाँ’ या ‘पुरुषों के रूप वाली मूर्तियाँ’
  rationale: संदर्भ मूर्तिपूजा का है, पर צֶלֶם का सीधा अर्थ ‘आकृति/प्रतिमा’ है। चुना गया रूप यौन और उपासना-संबंधी दोनों संकेतों को खुला रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गंभीर और स्पष्ट शैली रखी गई है। ‘तुम’ संबोधन सामान्य पाठक के लिए स्वाभाविक है; मूल की स्त्रीलिंग एकवचन क्रियाएँ संदर्भ में यरूशलेम को संबोधित करती हैं। यौन रूपक को न तो अश्लील बनाया गया है, न नरम करके हटाया गया है।
