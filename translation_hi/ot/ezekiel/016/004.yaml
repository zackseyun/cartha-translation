  text: וּ/מוֹלְדוֹתַ֗יִ/ךְ בְּ/י֨וֹם הוּלֶּ֤דֶת אֹתָ/ךְ֙ לֹֽא כָרַּ֣ת שָׁרֵּ֔/ךְ וּ/בְ/מַ֥יִם לֹֽא רֻחַ֖צְתְּ לְ/מִשְׁעִ֑י וְ/הָמְלֵ֨חַ֙ לֹ֣א הֻמְלַ֔חַתְּ וְ/הָחְתֵּ֖ל לֹ֥א חֻתָּֽלְתְּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/016/004.yaml
  text: And as for your birth[a], on the day you were born your cord was not cut, and you were not washed with water for cleansing; you were not rubbed with salt[c][b], and you were not wrapped in cloths.
translation:
  language: hi
  text: और जहाँ तक तेरे जन्म की बात है, जिस दिन तू जन्मी, न तो तेरी नाल काटी गई, न तुझे साफ करने के लिए[a] पानी से धोया गया; न तेरे शरीर पर नमक लगाया गया[b], और न तुझे कपड़ों में लपेटा गया[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘रगड़कर साफ करने के लिए’ अथवा ‘त्वचा चिकनी करने के लिए।’ यहाँ प्रयुक्त हिब्रू शब्द दुर्लभ है, इसलिए उसके सटीक अर्थ पर मतभेद है।
    reason: lexical_alternative
  - marker: b
    text: यह नवजात शिशु के शरीर पर नमक मलने की एक प्राचीन देखभाल-प्रथा का उल्लेख है।
    reason: cultural_note
  - marker: c
    text: अर्थात नवजात शिशु को कपड़ों या पट्टियों में कसकर लपेटना।
    reason: lexical_clarification
lexical_decisions:
- source_word: מוֹלְדוֹתַיִךְ
  choice: तेरे जन्म
  rationale: बहुवचन रूप यहाँ जन्म की परिस्थिति के लिए मुहावरेदार ढंग से प्रयुक्त है। निकटवर्ती प्रसव-चित्रण के कारण ‘तेरे जन्म’ स्वाभाविक और सटीक है।
- source_word: בְּיוֹם הוּלֶּדֶת אֹתָךְ
  choice: जिस दिन तू जन्मी
  rationale: यह सीधा कालवाचक वाक्यांश है। यरूशलेम को स्त्री के रूप में संबोधित किए जाने के कारण स्त्रीलिंग ‘जन्मी’ रखा गया है।
- source_word: שָׁרֵךְ
  choice: तेरी नाल
  rationale: संदर्भ नवजात शिशु की गर्भनाल का है। ‘नाल’ साधारण आधुनिक हिन्दी में स्पष्ट है और ‘गर्भनाल’ की अपेक्षा कम चिकित्सकीय लगता है।
- source_word: לֹא כָרַּת שָׁרֵּךְ
  choice: न तो तेरी नाल काटी गई
  rationale: हिब्रू में क्रिया सक्रिय रूप में है, पर हिन्दी में नाल को विषय बनाकर कर्मवाच्य प्रयोग अधिक स्वाभाविक है और अर्थ को ठीक रखता है।
- source_word: וּבְמַיִם לֹא רֻחַצְתְּ
  choice: न ... तुझे पानी से धोया गया
  rationale: यह जन्म के बाद शिशु को धोने का चित्र है। ‘पानी से धोया गया’ मूल अभिव्यक्ति के निकट और सहज है।
- source_word: לְמִשְׁעִי
  choice: शुद्ध करने के लिए
  rationale: यह दुर्लभ शब्द है। संदर्भ में इसे धोकर साफ करने के प्रयोजन के रूप में लेना सम्भव और स्वाभाविक है, जबकि रगड़ने या त्वचा चिकनी करने का अर्थ भी सम्भव है; इसलिए विकल्प पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: וְהָמְלֵחַ לֹא הֻמְלַחַתְּ
  choice: न तुझे नमक मलकर तैयार किया गया
  rationale: शाब्दिक ‘नमकीन किया गया’ हिन्दी में भोजन का बोध करा सकता है। यह चयन नवजात पर नमक मलने की प्राचीन प्रथा को स्पष्ट करता है, बिना उसे शुद्धिकरण का निश्चित धार्मिक अर्थ दिए।
- source_word: וְהָחְתֵּל לֹא חֻתָּלְתְּ
  choice: न कपड़ों में लपेटा गया
  rationale: क्रिया नवजात को कपड़े या पट्टियाँ लपेटने को दर्शाती है। यह आधुनिक पाठक के लिए ‘स्वैडल’ जैसे उधार शब्द से अधिक स्पष्ट है।
