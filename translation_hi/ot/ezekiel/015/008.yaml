    reason: alternative_reading
lexical_decisions:
- source_word: וְנָתַתִּי
  choice: और मैं ... बना दूँगा
  rationale: נתן का मूल अर्थ ‘देना/रखना/ठहराना’ है, पर देश और उजाड़पन के साथ यह परिणाम उत्पन्न करने का भाव देता है। ‘बना दूँगा’ आधुनिक हिन्दी में इस कारक अर्थ को स्वाभाविक रूप से व्यक्त करता है।
- source_word: הָאָרֶץ
  choice: इस देश
  rationale: यहाँ אֶרֶץ पूरी पृथ्वी नहीं, न्याय के अधीन उस क्षेत्र या देश को सूचित करता है। प्रसंग को स्पष्ट करने के लिए हिन्दी में ‘इस देश’ स्वाभाविक है।
- source_word: שְׁמָמָה
  choice: उजाड़
  rationale: संज्ञा शְׁמָמָה निर्जनता और बरबादी की अवस्था बताती है। ‘उजाड़ बना दूँगा’ उसके परिणामात्मक अर्थ को संक्षिप्त और स्वाभाविक हिन्दी में रखता है।
- source_word: יַעַן
  choice: क्योंकि
  rationale: यह न्याय का कारण प्रस्तुत करने वाला स्पष्ट कारणसूचक संयोजक है।
- source_word: מָעֲלוּ מַעַל
  choice: उन्होंने विश्वासघात किया है
  rationale: एक ही मूल से बने क्रिया-संज्ञा के इस मेल में भरोसा या वाचा तोड़ने की प्रबल धारणा है। ‘विश्वासघात किया’ उस नैतिक और संबंधपरक गंभीरता को बनाए रखता है।
- source_word: נְאֻם
  choice: की यह घोषणा है
  rationale: यह भविष्यद्वक्ताओं में प्रयुक्त गंभीर ईश्वरीय कथन-सूत्र है। ‘यह घोषणा है’ आधुनिक, गरिमापूर्ण और स्पष्ट है।
- source_word: אֲדֹנָי יְהוִה
  choice: प्रभु यहोवा
  rationale: אֲדֹנָי को ‘प्रभु’ और व्यक्तिगत ईश्वरीय नाम יהוה को ‘यहोवा’ देकर दोनों तत्वों को अलग और पहचानने योग्य रखा गया है।
theological_decisions:
- issue: संयुक्त उपाधि אֲדֹנָי יְהוִה में ईश्वरीय नाम का अनुवाद
  choice: प्रभु यहोवा
  alternative: प्रभु परमेश्वर
  rationale: ‘प्रभु यहोवा’ इब्रानी में उपस्थित उपाधि और ईश्वरीय व्यक्तिगत नाम, दोनों को प्रत्यक्ष रूप से सुरक्षित रखता है; पारंपरिक प्रतिस्थापन ‘प्रभु परमेश्वर’ नाम को उपाधि में बदल देता है।
- issue: מָעֲלוּ מַעַל में अपराध की प्रकृति
  choice: विश्वासघात किया है
  alternative: अपराध किया है
  rationale: यह पद केवल सामान्य अपराध नहीं, भरोसे या वाचा के उल्लंघन का भाव रख सकता है। ‘विश्वासघात’ उस संबंधपरक तनाव को बिना किसी विशिष्ट सम्प्रदायगत व्याख्या के बनाए रखता है।
