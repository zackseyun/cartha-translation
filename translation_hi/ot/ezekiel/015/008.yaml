  text: और मैं इस देश को उजाड़ बना दूँगा, क्योंकि उन्होंने विश्वासघात किया है[a]—प्रभु याहवे की यह घोषणा है।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में एक ही मूल से बनी क्रिया और संज्ञा साथ हैं; अर्थ ‘उन्होंने घोर विश्वासघात किया’ या ‘वे विश्वासहीन निकले’ भी हो सकता है।
