  text: Son of man[a], how is the wood of the vine better than any wood, the branch that is among the trees of the forest?
translation:
  language: hi
  text: “हे मनुष्य के पुत्र, अंगूर की बेल की लकड़ी—जंगल के पेड़ों के बीच की वह बेल की डाली—किसी भी लकड़ी से किस बात में बढ़कर है?[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक शाब्दिक रूप में: “बेल की लकड़ी किसी भी लकड़ी से क्या बढ़कर है, वह डाली जो जंगल के पेड़ों के बीच होती है?” हिब्रू वाक्य संक्षिप्त है और तुलना व्यक्त करता है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן אָדָם
  choice: हे मनुष्य के पुत्र
  rationale: यहेजकेल में यह नबी के लिए बार-बार प्रयुक्त संबोधन है। यह हिब्रू मुहावरे को बनाए रखता है; यहाँ इसे मसीही पदवी के रूप में नहीं समझा गया है।
- source_word: מַה יִּהְיֶה
  choice: किस बात में बढ़कर है
  rationale: हिब्रू वाक्य संक्षिप्त और तुलनात्मक है। यह रूप स्वाभाविक हिन्दी में दूसरी लकड़ियों की तुलना में बेल की लकड़ी की श्रेष्ठता या विशेषता पर प्रश्न करता है।
- source_word: עֵץ הַגֶּפֶן
  choice: अंगूर की बेल की लकड़ी
  rationale: शाब्दिक अर्थ ‘बेल की लकड़ी’ है। ‘अंगूर’ जोड़ने से आधुनिक हिन्दी में बेल का प्रकार स्पष्ट होता है, जबकि ध्यान पौधे के बजाय उसकी लकड़ी पर बना रहता है।
- source_word: מִכָּל עֵץ
  choice: किसी भी दूसरी लकड़ी से
  rationale: מִן तुलना को व्यक्त करता है। ‘दूसरी’ तुलना के आशय को हिन्दी में स्पष्ट और सहज बनाता है।
- source_word: הַזְּמוֹרָה
  choice: बेल की डाली
  rationale: शब्द अंगूर की बेल की डाली या अंकुर को दर्शाता है। ‘बेल की डाली’ संदर्भ को स्पष्ट रखता है।
- source_word: אֲשֶׁר הָיָה בַּעֲצֵי הַיָּעַר
  choice: जो जंगल के पेड़ों के बीच होती है
  rationale: यह सामान्य तुलना है, इसलिए हिब्रू पूर्ण क्रिया का वर्तमानकालीन हिन्दी रूप स्वाभाविक है। ‘पेड़ों के बीच’ स्थान-संबंध को ठीक व्यक्त करता है।
