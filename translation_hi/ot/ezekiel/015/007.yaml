  terminology: ‘याहवे’ consistently renders the divine name without replacing it with a title. ‘मुख,’ ‘भस्म कर देगी,’ and ‘जान लोगे’ fit the elevated but accessible register. Footnote a is anchored to the idiom, and footnote b is correctly anchored to the divine name in the Hindi text.
