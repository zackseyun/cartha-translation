  source_fidelity: 'The translation accurately conveys the Hebrew sequence and imagery: Yahweh sets his face against the people; they emerge from fire yet are consumed by fire; and the audience comes to know Yahweh through this act of judgment. ‘फिर भी’ appropriately represents the contextual contrast without specifying whether one or two fires are meant.'
