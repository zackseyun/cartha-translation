id: EZK.15.7
reference: Ezekiel 15:7
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/נָתַתִּ֤י אֶת פָּנַ/י֙ בָּ/הֶ֔ם מֵ/הָ/אֵ֣שׁ יָצָ֔אוּ וְ/הָ/אֵ֖שׁ תֹּֽאכְלֵ֑/ם וִֽ/ידַעְתֶּם֙ כִּֽי אֲנִ֣י יְהוָ֔ה בְּ/שׂוּמִ֥/י אֶת פָּנַ֖/י בָּ/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/015/007.yaml
  text: And I will set my face against them[a]. They have come out from the fire, but the fire will consume them. Then you will know that I am Yahweh[b], when I set my face against them.
translation:
  language: hi
  text: मैं उनके विरुद्ध अपना मुख करूँगा[a]। वे आग में से निकल आए हैं, फिर भी आग उन्हें भस्म कर देगी। जब मैं उनके विरुद्ध अपना मुख करूँगा, तब तुम जान लोगे कि मैं याहवे[b] हूँ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘किसी के विरुद्ध अपना मुख करना’ इब्रानी मुहावरा है, जिसका अर्थ दृढ़ता से उसका विरोध करना और उस पर न्याय लाना है।
    reason: cultural_note
  - marker: b
    text: ‘याहवे’ परमेश्वर के इब्रानी व्यक्तिगत नाम יהוה का लिप्यंतरण है।
    reason: lexical_note
lexical_decisions:
- source_word: וְנָתַתִּי אֶת־פָּנַי בָּהֶם
  choice: मैं उनके विरुद्ध अपना मुख करूँगा
  rationale: נתן का मूल अर्थ ‘रखना/लगाना’ है, पर ‘किसी के विरुद्ध अपना मुख करना’ पूरा इब्रानी मुहावरा दृढ़ विरोध और न्याय का भाव व्यक्त करता है। हिन्दी में मुहावरे की छवि बनाए रखी गई है और पादटिप्पणी में उसका अर्थ स्पष्ट किया गया है।
- source_word: מֵהָאֵשׁ יָצָאוּ
  choice: वे आग में से निकल आए हैं
  rationale: יצא केवल बाहर निकलने को बताता है, सफलतापूर्वक बच निकलने को नहीं। पूर्ण क्रिया को वर्तमान-संबद्ध भूतकाल में रखा गया है, जिससे अगली पंक्ति का विडंबनापूर्ण विरोध बना रहता है।
- source_word: וְהָאֵשׁ תֹּאכְלֵם
  choice: फिर भी आग उन्हें भस्म कर देगी
  rationale: आग के कर्ता होने पर אכל का अर्थ ‘खा जाना/भस्म करना’ है। संयोजक ו को प्रसंगानुसार विरोधसूचक ‘फिर भी’ किया गया है, क्योंकि आग से निकल आने के बावजूद वे आग से नष्ट होंगे।
- source_word: וִידַעְתֶּם
  choice: तब तुम जान लोगे
  rationale: यह बहुवचन संबोधन है। भविष्यसूचक कथन में परिणाम का भाव स्वाभाविक हिन्दी ‘तब’ से व्यक्त किया गया है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय हिन्दी में लिप्यंतरित किया गया है।
- source_word: בְּשׂוּמִי אֶת־פָּנַי בָּהֶם
  choice: जब मैं उनके विरुद्ध अपना मुख करूँगा
  rationale: בְּ के साथ क्रियार्थक संज्ञा यहाँ समयसूचक है, इसलिए ‘जब’ उपयुक्त है। पद के आरंभ वाले न्याय-मुहावरे की पुनरावृत्ति भी सुरक्षित रखी गई है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: प्रभु अथवा यहोवा
  rationale: मूल पाठ में व्यक्तिगत वाचा-नाम सीधे आया है। ‘याहवे’ उसका प्रचलित विद्वत्तापूर्ण लिप्यंतरण है और उसे किसी उपाधि से प्रतिस्थापित नहीं करता।
- issue: ‘उनके विरुद्ध अपना मुख करना’ न्याय-मुहावरे का बल
  choice: मुख्य पाठ में मुहावरे की छवि बनाए रखना
  alternative: मैं उनका विरोध करूँगा
  rationale: शाब्दिक छवि भविष्यद्वाणी के दृढ़, व्यक्तिगत और न्यायिक विरोध को बनाए रखती है; पादटिप्पणी साधारण पाठक के लिए उसका आशय स्पष्ट करती है।
- issue: आग से निकलने और आग द्वारा भस्म किए जाने का संबंध
  choice: विरोध को बनाए रखते हुए यह निर्धारित न करना कि दोनों उल्लेख एक ही आग के हैं या अलग आग के
  alternative: एक आग से बचेंगे, पर दूसरी आग उन्हें भस्म करेगी
  rationale: इब्रानी पाठ ‘आग’ को दोहराता है, पर स्पष्ट रूप से ‘एक’ और ‘दूसरी’ नहीं कहता। अनुवाद मूल की विडंबना और अस्पष्टता दोनों सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गंभीर, भविष्यद्वाणी-संगत स्वर रखा गया है। ‘मुख’ गरिमापूर्ण साहित्यिक शब्द है, जबकि वाक्यरचना सामान्य पाठक के लिए स्पष्ट है। ‘भस्म कर देगी’ आग द्वारा पूर्ण विनाश का स्वाभाविक और गंभीर हिन्दी प्रयोग है।
