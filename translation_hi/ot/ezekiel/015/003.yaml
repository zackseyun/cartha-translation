  choice: क्या उससे ... लकड़ी ली जाती है
  rationale: प्रश्नवाचक הֲ और לקח के कर्मवाच्य रूप को बनाए रखता है। “उससे” पिछले संदर्भ की दाखलता की ओर संकेत करता है, पर इस पद में उसे अनावश्यक रूप से स्पष्ट नहीं करता।
- source_word: לַעֲשׂוֹת לִמְלָאכָה
  choice: कोई उपयोगी वस्तु बनाने के लिए
  rationale: מְלָאכָה यहाँ काम या व्यावहारिक उपयोग का भाव रखता है; यह हिंदी में आलंकारिक प्रश्न की उपयोगिता-संबंधी धार को स्वाभाविक रूप से व्यक्त करता है।
- source_word: אִם יִקְחוּ מִמֶּנּוּ יָתֵד
  choice: या क्या उससे ऐसी खूँटी बनाई जाती है
  rationale: אִם यहाँ दूसरे आलंकारिक प्रश्न को विकल्प के रूप में प्रस्तुत करता है। स्रोत में शाब्दिक अर्थ “उससे खूँटी लेते हैं” है, पर लकड़ी से खूँटी प्राप्त करने के आशय को आधुनिक हिंदी में “बनाई जाती है” अधिक स्वाभाविक ढंग से व्यक्त करता है।
- source_word: לִתְלוֹת עָלָיו כָּל־כֶּלִי
  choice: जिस पर हर प्रकार का पात्र लटकाया जा सके
  rationale: עָלָיו का पूर्वपद खूँटी है। כְּלִי व्यापक शब्द है, जिसमें पात्र, उपकरण या अन्य उपयोगी वस्तु आ सकती है; “हर प्रकार का पात्र” पाठ को सुबोध रखते हुए इस व्यापकता की ओर संकेत करता है।
