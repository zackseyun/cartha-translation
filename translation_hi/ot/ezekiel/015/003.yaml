  text: Is wood taken from it to make anything useful? Or do they take from it a peg to hang every kind of vessel on it?[a][b][c]
translation:
  language: hi
  text: क्या कोई उपयोगी वस्तु बनाने के लिए उससे लकड़ी ली जाती है? या क्या उससे खूँटी ली जाती है, जिस पर हर वस्तु लटकाई जा सके?[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “कोई उपयोगी वस्तु बनाने के लिए” का अनुवाद “किसी काम की वस्तु बनाने के लिए” या “किसी काम के लिए कुछ बनाने के लिए” भी हो सकता है। इब्रानी वाक्यांश व्यावहारिक उपयोग पर बल देता है।
    reason: lexical_alternative
  - marker: b
    text: “खूँटी” के लिए प्रयुक्त इब्रानी शब्द का अर्थ “कील” या “खूँटा” भी हो सकता है; यहाँ आशय किसी वस्तु को लटकाने के लिए स्थिर किए गए सहारे से है।
    reason: lexical_alternative
  - marker: c
    text: यहाँ “वस्तु” के लिए प्रयुक्त इब्रानी शब्द व्यापक है और किसी बरतन, उपकरण या अन्य वस्तु को भी सूचित कर सकता है; इसका अर्थ केवल मिट्टी का बरतन नहीं है।
    reason: lexical_alternative
