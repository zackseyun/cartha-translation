source:
  edition: WLC
  text: הִנֵּה֙ בִּֽ/הְיוֹת֣/וֹ תָמִ֔ים לֹ֥א יֵֽעָשֶׂ֖ה לִ/מְלָאכָ֑ה אַ֣ף כִּי אֵ֤שׁ אֲכָלַ֨תְ/הוּ֙ וַ/יֵּחָ֔ר וְ/נַעֲשָׂ֥ה ע֖וֹד לִ/מְלָאכָֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/015/005.yaml
  text: Look[a], when it was whole, it was not made for any work. How much less, when the fire has consumed it and it is charred[c][b], can it still be made for any work?
translation:
  language: hi
  text: देखो, जब वह साबुत था, तब भी उससे कोई काम की वस्तु नहीं बनाई जाती थी। तो फिर, जब आग उसे जला चुकी है और वह झुलस गया है, तो क्या उससे अब भी कोई काम की वस्तु बनाई जा सकती है?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “वह जलकर काला पड़ गया है।”
    reason: lexical_alternative
  - marker: b
    text: 'हिब्रू में यहाँ न्यून से अधिक की दलील है: यदि साबुत लकड़ी ही किसी काम की नहीं थी, तो आग से जलने के बाद वह और भी कम उपयोगी होगी।'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: देखो
  rationale: ध्यान आकर्षित करने वाले हिब्रू उद्गार का स्वाभाविक और वर्तमान हिन्दी रूप।
- source_word: בִּהְיוֹתוֹ תָמִים
  choice: जब वह साबुत था
  rationale: यहाँ תָמִים नैतिक निर्दोषता नहीं, बल्कि आग से क्षतिग्रस्त होने से पहले लकड़ी की अक्षुण्ण दशा बताता है।
- source_word: לֹא יֵעָשֶׂה לִמְלָאכָה
  choice: उससे कोई काम की वस्तु नहीं बनाई जाती थी
  rationale: निफ़ाल रूप को निष्क्रिय अर्थ में रखा गया है; सन्दर्भ में आशय बेल की लकड़ी को किसी उपयोगी वस्तु के रूप में गढ़ने से है।
- source_word: אַף כִּי
  choice: फिर ... पर
  rationale: 'हिन्दी में स्वाभाविक ढंग से न्यून से अधिक की दलील व्यक्त करता है: जो साबुत रहते उपयोगी न थी, वह जलने के बाद और भी कम उपयोगी है। इस तर्क को प्रश्न की संरचना भी स्पष्ट करती है।'
- source_word: אֵשׁ אֲכָלַתְהוּ
  choice: आग के उसे भस्म कर देने
  rationale: आग द्वारा खा लिए जाने की हिब्रू छवि का स्वाभाविक हिन्दी अर्थ; पूर्ण क्रिया से हो चुकी जलन व्यक्त होती है।
- source_word: וַיֵּחָר
  choice: उसके झुलस जाने
  rationale: חרר आग या ताप से जलकर क्षतिग्रस्त होने को दर्शाता है; ‘झुलस’ हिन्दी में स्वाभाविक है और पूर्णतः भस्म होने तथा सतह के जलने के बीच मूल पाठ का तनाव बनाए रखता है।
- source_word: וְנַעֲשָׂה עוֹד לִמְלָאכָה
  choice: क्या उससे अब भी कोई काम की वस्तु बनाई जा सकती है?
  rationale: सन्दर्भानुसार अलंकारिक प्रश्न के रूप में अनुवाद किया गया है; ‘अब भी’ עוֹד को और ‘काम की वस्तु’ מְלָאכָה के व्यावहारिक उपयोग को स्पष्ट करता है।
theological_decisions:
- issue: दृष्टान्त की प्रकृति
  choice: पद में जली हुई बेल की लकड़ी की अनुपयोगिता का चित्र ही रखा गया है।
  alternative: मुख्य पाठ में लकड़ी को सीधे यरूशलेम या यहूदा कहना।
  rationale: आस-पास का प्रसंग दृष्टान्त का अभिप्राय बताता है, पर यह पद स्वयं चित्रात्मक भाषा में बोलता है; अनुवाद में व्याख्या जोड़ने के बजाय उस रूपक को सुरक्षित रखना उचित है।
- issue: אַף כִּי की तार्किक शक्ति
  choice: अलंकारिक प्रश्न के साथ ‘फिर ... पर’ द्वारा ‘कितना कम’ का तर्क व्यक्त किया गया है।
  alternative: शाब्दिक रूप से ‘कितना कम’ या ‘कितना अधिक’ लिखना।
  rationale: हिब्रू न्यून से अधिक की दलील देता है। वर्तमान हिन्दी में प्रश्नात्मक संरचना सहित ‘फिर ... पर’ वही निष्कर्ष स्वाभाविक ढंग से पहुँचाता है, जबकि पादटिप्पणी मूल मुहावरे को स्पष्ट करती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज शैली अपनाई गई है। ‘साबुत’, ‘काम की वस्तु’ और ‘झुलस’ सामान्य पाठक के लिए स्पष्ट हैं। मुख्य पाठ में बेल की लकड़ी का रूपक बनाए रखा गया है और उसके ऐतिहासिक अभिप्राय को समय से पहले नहीं खोला गया।
