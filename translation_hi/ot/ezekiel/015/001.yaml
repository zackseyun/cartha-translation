- source_word: דְבַר
  choice: वचन
  rationale: यहाँ דָּבָר दैवी संचार को दर्शाता है। ‘वचन’ भविष्यवाणी-संबंधी सूत्र और उसके धार्मिक अर्थ को बनाए रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी पाठ में परमेश्वर का व्यक्तिगत नाम יהוה है; इसलिए किसी उपाधि से बदलने के बजाय उसका हिन्दी लिप्यंतरण किया गया है।
- source_word: אֵלַי
  choice: मेरे पास
  rationale: אֶל के साथ प्रथम पुरुष प्रत्यय का अर्थ ‘मेरी ओर/मेरे पास’ है; ‘मेरे पास पहुँचा’ आधुनिक हिन्दी का स्वाभाविक प्रयोग है।
- source_word: לֵאמֹר
  choice: उन्होंने कहा
  rationale: यह रूप आगे आने वाले प्रत्यक्ष कथन का परिचय देता है। हिन्दी में ‘उन्होंने कहा’ अधिक सहज है और इसका कर्ता याहवे संदर्भ से स्पष्ट है।
theological_decisions:
- issue: परमेश्वर के नाम יהוה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में उपाधि नहीं, चार अक्षरों वाला व्यक्तिगत नाम है। ‘याहवे’ उसका प्रचलित विद्वत्तापूर्ण लिप्यंतरण है और मूल की भिन्नता सुरक्षित रखता है।
