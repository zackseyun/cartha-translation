base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/015/004.yaml
  text: Look[a], it is given to the fire for fuel. The fire has consumed both of its ends, and its middle is charred[b]. Is it fit for any work?
translation:
  language: hi
  text: देखो, उसे आग के हवाले कर दिया गया है, ताकि आग उसे भस्म कर दे[a]। आग उसके दोनों सिरों को भस्म कर चुकी है, और उसका बीच का भाग झुलस गया है। क्या वह किसी काम के योग्य है?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक अर्थ ‘खाने के लिए’ है; यहाँ आग को लकड़ी खाने वाले के रूप में चित्रित किया गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: देखो
  rationale: यह श्रोता का ध्यान आने वाले दृष्टांत की ओर खींचता है; ‘देखो’ आधुनिक हिन्दी में स्वाभाविक और प्रभावपूर्ण है।
- source_word: לָאֵשׁ נִתַּן
  choice: उसे आग के हवाले कर दिया जाता है
  rationale: यह अनुवाद נתן के कर्मवाच्य और ל के गंतव्य-भाव को बनाए रखते हुए हिन्दी में आग को सौंपे जाने का चित्र स्वाभाविक ढंग से व्यक्त करता है।
- source_word: לְאָכְלָה
  choice: कि वह उसे भस्म कर दे
  rationale: मूल अभिव्यक्ति शाब्दिक रूप से ‘खाने के लिए’ है और आग को खाने वाले के रूप में चित्रित करती है। ‘भस्म कर दे’ आधुनिक हिन्दी में उसी आशय को स्पष्ट करता है; शाब्दिक चित्र पादटिप्पणी में सुरक्षित है।
- source_word: שְׁנֵי קְצוֹתָיו
  choice: उसके दोनों सिरों
  rationale: यह शाखा या लकड़ी के दो छोरों को स्पष्ट और सहज हिन्दी में व्यक्त करता है।
- source_word: אָכְלָה הָאֵשׁ
  choice: आग ... भस्म कर चुकी है
  rationale: अग्नि के विषय में אכל का अर्थ ‘खा जाना’ अर्थात नष्ट या भस्म कर देना है; पूर्ण परिणाम को ‘कर चुकी है’ से व्यक्त किया गया है।
- source_word: וְתוֹכוֹ נָחָר
  choice: और उसका बीच का भाग झुलस गया है
  rationale: תוֹךְ यहाँ बीच या मध्य भाग है और נחר आग से झुलसने अथवा जलकर क्षतिग्रस्त होने की अवस्था बताता है।
- source_word: הֲיִצְלַח לִמְלָאכָה
  choice: क्या वह किसी काम के योग्य होगी?
  rationale: इस प्रसंग में צלח सामान्य समृद्धि नहीं, बल्कि किसी व्यावहारिक काम के लिए उपयुक्त या उपयोगी होने को दर्शाता है। प्रश्नवाचक रूप मूल की आलंकारिक शक्ति बनाए रखता है।
