source:
  edition: WLC
  text: לָ/כֵ֗ן כֹּ֤ה אָמַר֙ אֲדֹנָ֣/י יְהוִ֔ה כַּ/אֲשֶׁ֤ר עֵץ הַ/גֶּ֨פֶן֙ בְּ/עֵ֣ץ הַ/יַּ֔עַר אֲשֶׁר נְתַתִּ֥י/ו לָ/אֵ֖שׁ לְ/אָכְלָ֑ה כֵּ֣ן נָתַ֔תִּי אֶת יֹשְׁבֵ֖י יְרוּשָׁלִָֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/015/006.yaml
  text: 'Therefore thus says the Lord GOD: As the wood of the vine among the trees of the forest[a], which I have given to the fire for fuel, so I have given the inhabitants of Jerusalem.'
translation:
  language: hi
  text: 'इसलिए प्रभु याहवे यों कहते हैं: “जैसे जंगल के पेड़ों के बीच अंगूर की बेल की लकड़ी को मैंने आग में जलने के लिए दे दिया है, वैसे ही मैंने यरूशलेम के निवासियों को आग के हवाले कर दिया है।”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לָכֵן
  choice: इसलिए
  rationale: यह निष्कर्षसूचक अव्यय पिछले पदों की तुलना को यरूशलेम पर लागू करता है।
- source_word: כֹּה אָמַר
  choice: यों कहते हैं
  rationale: यह भविष्यद्वाणी का पारंपरिक संदेशवाहक सूत्र है; चुना हुआ रूप आधुनिक और गरिमापूर्ण हिन्दी में उसकी औपचारिक ध्वनि बनाए रखता है।
- source_word: אֲדֹנָי יְהוִה
  choice: प्रभु याहवे
  rationale: אֲדֹנָי को ‘प्रभु’ और परमेश्वर के व्यक्तिगत नाम יהוה को ‘याहवे’ रूप में रखा गया है।
- source_word: עֵץ הַגֶּפֶן
  choice: अंगूर की बेल की लकड़ी
  rationale: यहाँ עֵץ जीवित पेड़ की अपेक्षा जलाए जाने वाले पदार्थ, अर्थात लकड़ी, को दर्शाता है; ‘अंगूर की बेल’ सामान्य पाठक के लिए बेल का प्रकार स्पष्ट करती है।
- source_word: בְּעֵץ הַיַּעַר
  choice: जंगल के पेड़ों के बीच
  rationale: בְּ को यहाँ समूह के भीतर स्थिति बताने वाला माना गया है; इससे बेल की लकड़ी और जंगल के अन्य पेड़ों की लकड़ी का निहित विरोध बना रहता है।
- source_word: נְתַתִּיו לָאֵשׁ לְאָכְלָה
  choice: मैंने आग के हवाले कर दिया है कि वह उसे भस्म कर दे
  rationale: यह रूप ‘आग को दे देना’ और आग द्वारा पूरी तरह खा लिए जाने की मूल छवि को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: כֵּן נָתַתִּי
  choice: वैसे ही मैंने ... उसके हवाले कर दिया है
  rationale: ‘वैसे ही’ उपमा के उत्तरार्ध को स्पष्ट करता है और ‘उसके हवाले’ आग के साथ तुलना को बनाए रखता है, बिना न्याय के किसी अतिरिक्त साधन को पाठ में जोड़ने के।
- source_word: יֹשְׁבֵי יְרוּשָׁלִָם
  choice: यरूशलेम के निवासी
  rationale: यह कृदन्तीय पदबंध का स्वाभाविक सामूहिक हिन्दी रूप है।
theological_decisions:
- issue: संयुक्त उपाधि אֲדֹנָי יְהוִה में परमेश्वर के नाम का अनुवाद
  choice: प्रभु याहवे
  alternative: प्रभु यहोवा; प्रभु परमेश्वर
  rationale: मूल पाठ में चार अक्षरों वाला व्यक्तिगत नाम स्पष्ट रूप से उपस्थित है। ‘याहवे’ उसे उपाधि ‘प्रभु’ से अलग रखते हुए नाम के रूप में प्रस्तुत करता है।
- issue: यरूशलेम के निवासियों को किसके हवाले किया गया है
  choice: उसके हवाले
  alternative: आग के हवाले
  rationale: हिब्रू उत्तरार्ध में आग को दोहराता नहीं, पर उपमा उसका स्पष्ट संकेत देती है। सर्वनाम मूल की संक्षिप्तता और तुलना दोनों को बनाए रखता है; ‘आग’ को दोहराना अर्थ को अधिक स्पष्ट पर कुछ अधिक व्याख्यात्मक बना देता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण भविष्यद्वाणी शैली रखी गई है। ‘यों कहते हैं’, ‘आग के हवाले’ और ‘भस्म कर दे’ सामान्य पाठक के लिए स्वाभाविक हैं, जबकि जैसे–वैसे की रचना मूल उपमा और उसके न्याय-संबंधी अनुप्रयोग को स्पष्ट रखती है।
