reference: Ezekiel 37:22
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/עָשִׂ֣יתִי אֹ֠תָ/ם לְ/ג֨וֹי אֶחָ֤ד בָּ/אָ֨רֶץ֙ בְּ/הָרֵ֣י יִשְׂרָאֵ֔ל וּ/מֶ֧לֶךְ אֶחָ֛ד יִֽהְיֶ֥ה לְ/כֻלָּ֖/ם לְ/מֶ֑לֶךְ וְ/לֹ֤א יהיה עוֹד֙ לִ/שְׁנֵ֣י גוֹיִ֔ם וְ/לֹ֨א יֵחָ֥צוּ ע֛וֹד לִ/שְׁתֵּ֥י מַמְלָכ֖וֹת עֽוֹד־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/037/022.yaml
  text: And I will make them one nation in the land[a], on the mountains of Israel, and one king will be king over all of them. They will no longer be two nations[b], and they will no longer be divided into two kingdoms.
translation:
  language: hi
  text: मैं उन्हें उस देश में, इस्राएल के पहाड़ों पर[a], एक ही राष्ट्र बना दूँगा, और एक ही राजा उन सबका राजा होगा[b]। वे फिर कभी दो राष्ट्र नहीं होंगे और फिर कभी दो राज्यों में बाँटे नहीं जाएँगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “इस्राएल के पहाड़ी प्रदेश में।”
    reason: בְּהָרֵי יִשְׂרָאֵל का भौगोलिक अर्थ ‘इस्राएल के पहाड़ों पर’ या सामूहिक रूप से ‘इस्राएल के पहाड़ी प्रदेश में’ समझा जा सकता है।
  - marker: b
    text: इब्रानी में “राजा” शब्द बल देने के लिए दोहराया गया है।
    reason: मूल वाक्यांश की जानबूझकर की गई नामपदात्मक पुनरावृत्ति को पाठक के लिए स्पष्ट करना।
lexical_decisions:
- source_word: וְעָשִׂיתִי אֹתָם לְגוֹי אֶחָד
  choice: मैं उन्हें ... एक ही राष्ट्र बना दूँगा
  rationale: עשה के साथ कर्म और לְ यहाँ किसी को कुछ बना देने का भाव व्यक्त करते हैं। ‘राष्ट्र’ גּוֹי का सुसंगत राजनीतिक-सामुदायिक अर्थ रखता है और आगे आए ‘दो राष्ट्र’ से मेल खाता है।
- source_word: בָּאָרֶץ
  choice: उस देश में
  rationale: यहाँ הָאָרֶץ सामान्य पृथ्वी नहीं, इस्राएल से संबंधित विशिष्ट देश को सूचित करता है; ‘उस देश’ संदर्भगत निश्चितता को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: בְּהָרֵי יִשְׂרָאֵל
  choice: इस्राएल के पहाड़ों पर
  rationale: यह यहेजकेल की विशिष्ट भौगोलिक अभिव्यक्ति का निकट और पारदर्शी अनुवाद है। ‘इस्राएल के पहाड़ी प्रदेश में’ अर्थानुकूल विकल्प है।
- source_word: וּמֶלֶךְ אֶחָד יִהְיֶה לְכֻלָּם לְמֶלֶךְ
  choice: और एक ही राजा उन सबका राजा होगा
  rationale: मूल में ‘राजा’ की पुनरावृत्ति बल देती है। हिन्दी वाक्य इस पुनरावृत्ति और सब पर एक राजा होने के भाव, दोनों को बनाए रखता है।
- source_word: וְלֹא יהיה עוֹד לִשְׁנֵי גוֹיִם
  choice: वे फिर कभी दो राष्ट्र नहीं होंगे
  rationale: सामूहिक जनसमुदाय के लिए हिन्दी में बहुवचन स्वाभाविक है। ‘फिर कभी ... नहीं’ עוֹד के स्थायी निषेध को स्पष्ट करता है।
- source_word: וְלֹא יֵחָצוּ עוֹד לִשְׁתֵּי מַמְלָכוֹת
  choice: और फिर कभी दो राज्यों में बाँटे नहीं जाएँगे
  rationale: חצה का निफ़अल रूप यहाँ निष्क्रिय भाव देता है। ‘बाँटे नहीं जाएँगे’ राजनीतिक विभाजन को सहज आधुनिक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: इस्राएल के फिर से एक होने की प्रतिज्ञा का स्वरूप
  choice: प्रतिज्ञा को देश, एक राष्ट्र और एक राजा की मूल राष्ट्रीय-राजकीय भाषा में रखा गया है।
  alternative: मुख्य पाठ में राजा को स्पष्ट रूप से मसीहा कहना, अथवा एकीकरण को केवल प्रतीकात्मक या आत्मिक बनाना।
  rationale: इस पद में एक राजा की बात है, पर उसे यहाँ सीधे ‘मसीहा’ नहीं कहा गया। इसलिए अनुवाद तत्काल भविष्यद्वाणीय अर्थ को रखता है और व्यापक संदर्भ से निकाले जाने वाले मसीही निष्कर्ष को पाठ में नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण भविष्यद्वाणीय शैली रखी गई है। ‘एक ही’ एकता पर दिए गए बल को व्यक्त करता है; ‘फिर कभी’ की पुनरावृत्ति मूल के दोहरे עוֹד को दर्शाती है।
