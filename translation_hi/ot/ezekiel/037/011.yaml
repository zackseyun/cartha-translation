language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יֹּאמֶר֮ אֵלַ/י֒ בֶּן אָדָ֕ם הָ/עֲצָמ֣וֹת הָ/אֵ֔לֶּה כָּל בֵּ֥ית יִשְׂרָאֵ֖ל הֵ֑מָּה הִנֵּ֣ה אֹמְרִ֗ים יָבְשׁ֧וּ עַצְמוֹתֵ֛י/נוּ וְ/אָבְדָ֥ה תִקְוָתֵ֖/נוּ נִגְזַ֥רְנוּ לָֽ/נוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/037/011.yaml
  text: Then he said to me, “Son of man, these bones are the whole house of Israel. Look, they are saying, ‘Our bones have dried up, and our hope has perished; we are cut off.’”
translation:
  language: hi
  text: तब उसने मुझसे कहा, “हे मनुष्य के पुत्र, ये हड्डियाँ इस्राएल का पूरा घराना हैं। देखो, वे कह रहे हैं, ‘हमारी हड्डियाँ सूख गई हैं, हमारी आशा नष्ट हो गई है; हम काट दिए गए हैं।’”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֶּן אָדָם
  choice: हे मनुष्य के पुत्र
  rationale: यहेजकेल को संबोधित करने वाली इब्रानी पदवी का परिचित और गरिमापूर्ण रूप; यहाँ यह मसीह-संबंधी उपाधि के रूप में नहीं, नबी के संबोधन के रूप में प्रयुक्त है।
- source_word: כָּל בֵּית יִשְׂרָאֵל
  choice: इस्राएल का पूरा घराना
  rationale: ‘घराना’ सामूहिक वाचा-समुदाय के अर्थ को बनाए रखता है और केवल किसी भवन या एक परिवार का संकेत नहीं देता।
- source_word: הִנֵּה
  choice: देखो
  rationale: वक्ता द्वारा आगामी कथन की ओर ध्यान खींचने वाले संकेत को स्पष्ट और स्वाभाविक हिन्दी में रखा गया है।
- source_word: וְאָבְדָה תִקְוָתֵנוּ
  choice: हमारी आशा मिट गई है
  rationale: אָבַד के नष्ट हो जाने या खो जाने के भाव को निराशा के इस प्रसंग में स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: נִגְזַרְנוּ לָנוּ
  choice: हम पूरी तरह कट चुके हैं
  rationale: मूल के ‘काट दिए जाने/कट जाने’ के रूपक और לָנוּ से उभरते आत्म-संबंधी जोर को सुरक्षित रखता है।
theological_decisions:
- issue: सूखी हड्डियों की पहचान
  choice: ‘ये हड्डियाँ इस्राएल के पूरे घराने को दर्शाती हैं’
  alternative: ‘ये हड्डियाँ इस्राएल का पूरा घराना हैं’
  rationale: इब्रानी का शाब्दिक विधेय ‘हैं’ है, पर दर्शन में प्रतीक की पहचान बताते हुए हिन्दी में ‘दर्शाती हैं’ अर्थ को स्पष्ट करता है, बिना हड्डियों के संदर्भ को किसी अन्य समुदाय पर आरोपित किए।
- issue: נִגְזַרְנוּ का आशय
  choice: हम पूरी तरह कट चुके हैं
  alternative: हमारा अंत हो गया है
  rationale: ‘अंत हो गया’ निराशा का भाव देता है, लेकिन मूल में उपस्थित काटे जाने के रूपक को मिटा देता है; चुना हुआ रूप निर्वासन, अलगाव या विनाश में से किसी एक अर्थ को अनावश्यक रूप से निश्चित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी, सरल किंतु गरिमापूर्ण भविष्यद्वाणी-संबंधी शैली। इस्राएल की सामूहिक पहचान और लोगों की गहरी निराशा को स्पष्ट रखा गया है; अंतिम वाक्यांश की रूपकीय अनिश्चितता को नहीं सुलझाया गया।
