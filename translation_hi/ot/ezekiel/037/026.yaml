reference: Ezekiel 37:26
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/כָרַתִּ֤י לָ/הֶם֙ בְּרִ֣ית שָׁל֔וֹם בְּרִ֥ית עוֹלָ֖ם יִהְיֶ֣ה אוֹתָ֑/ם וּ/נְתַתִּי/ם֙ וְ/הִרְבֵּיתִ֣י אוֹתָ֔/ם וְ/נָתַתִּ֧י אֶת מִקְדָּשִׁ֛/י בְּ/תוֹכָ֖/ם לְ/עוֹלָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/037/026.yaml
  text: I will make with them a covenant of peace[a]; it will be an everlasting covenant with them. And I will place them and multiply them[c][b], and I will set my sanctuary in their midst forever.
translation:
  language: hi
  text: मैं उनके साथ शांति की वाचा बाँधूँगा; वह उनके साथ[a] एक सदा की वाचा होगी। मैं उन्हें बसाऊँगा[b] और उनकी संख्या बढ़ाऊँगा, और अपना पवित्रस्थान सदा के लिए उनके बीच स्थापित करूँगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वह उनके लिए सदा की वाचा होगी।”
    reason: lexical_alternative
  - marker: b
    text: या, “मैं उन्हें रखूँगा” अथवा “स्थापित करूँगा।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכָרַתִּי ... בְּרִית
  choice: वाचा बाँधूँगा
  rationale: כרת के साथ בְּרִית वाचा करने का स्थापित इब्रानी मुहावरा है। हिन्दी का ‘वाचा बाँधना’ शाब्दिक ‘काटना’ अपनाए बिना उसकी वाचागत गंभीरता और स्वाभाविकता बनाए रखता है।
- source_word: בְּרִית שָׁלוֹם
  choice: शांति की वाचा
  rationale: यह पदबंध वाचा के स्वरूप को शांति, कुशल और समग्र कल्याण से चिह्नित करता है। ‘शांति की वाचा’ परिचित और अर्थपूर्ण हिन्दी अभिव्यक्ति है।
- source_word: בְּרִית עוֹלָם
  choice: सदा की वाचा
  rationale: वाचा के संदर्भ में עוֹלָם उसकी स्थायी अवधि बताता है। ‘सदा की’ आधुनिक हिन्दी में सहज है और अनावश्यक दार्शनिक विशिष्टता से बचता है।
- source_word: יִהְיֶה אוֹתָם
  choice: वह उनके साथ ... होगी
  rationale: אֵת संबंध या संगति प्रकट कर सकता है। पूर्ववर्ती वाक्यांश के अनुरूप ‘उनके साथ’ वाचागत संबंध को स्पष्ट रखता है; ‘उनके लिए’ को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: וּנְתַתִּים
  choice: मैं उन्हें बसाऊँगा
  rationale: נתן का मूल भाव देना/रखना है, पर पुनर्स्थापना के इस प्रसंग में लोगों को स्थिर रूप से स्थान देने का अर्थ स्वाभाविक है। ‘बसाऊँगा’ हिन्दी में यह भाव संक्षेप और स्पष्टता से देता है; अधिक शाब्दिक विकल्प पादटिप्पणी में है।
- source_word: וְהִרְבֵּיתִי אוֹתָם
  choice: उनकी संख्या बढ़ाऊँगा
  rationale: רבה का हिफ़ील रूप लोगों को बहुत करने या उनकी संख्या बढ़ाने का अर्थ देता है। यह हिन्दी में ‘उन्हें बढ़ाऊँगा’ से अधिक स्पष्ट और स्वाभाविक है।
- source_word: מִקְדָּשִׁי
  choice: अपना पवित्रस्थान
  rationale: מִקְדָּשׁ किसी पवित्र धाम या sanctuary को दर्शाता है। ‘पवित्रस्थान’ ‘मन्दिर’ की अपेक्षा व्यापक है और मूल शब्द को अधिक ठीक प्रकार से सुरक्षित रखता है।
- source_word: בְּתוֹכָם
  choice: उनके बीच
  rationale: यह सामुदायिक रूप से लोगों के मध्य परमेश्वर के पवित्रस्थान की उपस्थिति बताता है। ‘उनके भीतर’ व्यक्तिगत आंतरिक निवास का ऐसा अर्थ दे सकता है जिसकी यहाँ आवश्यकता नहीं है।
- source_word: לְעוֹלָם
  choice: सदा के लिए
  rationale: यह सरल आधुनिक हिन्दी में निरंतर और स्थायी अवधि को स्वाभाविक रूप से व्यक्त करता है।
theological_decisions:
- issue: पुनर्स्थापना के प्रसंग में वाचा की भाषा
  choice: ‘शांति की वाचा’ और ‘सदा की वाचा’ को स्पष्ट रूप से बनाए रखा गया
  alternative: केवल आशीष, सुरक्षा या मेल-मिलाप का भावार्थ
  rationale: पद की संरचना स्पष्ट रूप से वाचागत है। मूल वाचा-शब्दावली बनाए रखने से परमेश्वर और पुनर्स्थापित प्रजा के बंधन का धार्मिक भार सुरक्षित रहता है।
- issue: पवित्रस्थान की स्थिति
  choice: सामुदायिक अर्थ में ‘उनके बीच’
  alternative: ‘उनके भीतर’ को मुख्यतः व्यक्तिगत आंतरिक निवास मानना
  rationale: בְּתוֹכָם का सबसे स्वाभाविक अर्थ लोगों के समुदाय के मध्य है। यह बाद की धार्मिक श्रेणियाँ आरोपित किए बिना सामुदायिक पवित्रस्थान-उपस्थिति की छवि बनाए रखता है।
- issue: וּנְתַתִּים में लोगों को रखने या बसाने का भाव
  choice: मुख्य पाठ में ‘बसाऊँगा’
  alternative: ‘रखूँगा’ या ‘स्थापित करूँगा’
  rationale: पुनर्स्थापना के संदर्भ में स्थिर निवास का भाव संभव है, पर क्रिया स्वयं व्यापक है; इसलिए अधिक शाब्दिक विकल्प को पादटिप्पणी में रखा गया है और किसी निर्दिष्ट भूमि को पाठ में नहीं जोड़ा गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘वाचा’ और ‘पवित्रस्थान’ जैसे आवश्यक बाइबलीय पद बनाए गए हैं, जबकि वाक्य-विन्यास स्वाभाविक हिन्दी का है।
