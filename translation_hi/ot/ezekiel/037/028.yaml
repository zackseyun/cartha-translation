source:
  edition: WLC
  text: וְ/יָֽדְעוּ֙ הַ/גּוֹיִ֔ם כִּ֚י אֲנִ֣י יְהוָ֔ה מְקַדֵּ֖שׁ אֶת יִשְׂרָאֵ֑ל בִּ/הְי֧וֹת מִקְדָּשִׁ֛/י בְּ/תוֹכָ֖/ם לְ/עוֹלָֽם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/037/028.yaml
  text: Then the nations will know that I am Yahweh who sanctifies Israel[c][b][a], when my sanctuary is in their midst forever.
translation:
  language: hi
  text: तब[a] जातियाँ जान लेंगी कि मैं याहवे हूँ, जो इस्राएल को पवित्र करता हूँ[b], जब मेरा पवित्रस्थान सदा के लिए उनके बीच[c] रहेगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “और जातियाँ जान लेंगी।” इब्रानी संयोजक का साधारण अर्थ “और” भी हो सकता है, यद्यपि यहाँ पिछले पुनर्स्थापना-वचनों के परिणाम का भाव सम्भावित है।
    reason: lexical_alternative
  - marker: b
    text: या, “जो इस्राएल को पवित्र बनाता हूँ।”
    reason: lexical_alternative
  - marker: c
    text: या, “उनके मध्य में।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָדְעוּ
  choice: तब ... जान लेंगी
  rationale: संयोजक וְ यहाँ पिछले पदों की पुनर्स्थापना की प्रतिज्ञाओं के परिणाम की ओर संकेत करता है। भविष्यसूचक कथन के अनुरूप क्रिया को भविष्यकाल में रखा गया है।
- source_word: הַגּוֹיִם
  choice: जातियाँ
  rationale: यहेजकेल में यह शब्द सामान्यतः इस्राएल के बाहर की जातियों अथवा राष्ट्रों के लिए आता है; ‘जातियाँ’ स्वाभाविक और व्यापक हिन्दी विकल्प है।
- source_word: כִּי אֲנִי יְהוָה
  choice: कि मैं याहवे हूँ
  rationale: यह यहेजकेल की विशिष्ट पहचान-सूत्र भाषा है। परमेश्वर के व्यक्तिगत वाचा-नाम को शीर्षक से बदलने के बजाय ‘याहवे’ रूप में रखा गया है।
- source_word: מְקַדֵּשׁ
  choice: जो ... पवित्र करता हूँ
  rationale: पिएल कृदन्त याहवे के निरंतर अथवा विशिष्ट कार्य को व्यक्त करता है—वह इस्राएल को पवित्र ठहराता और पवित्र बनाता है। यह चयन उसी पद में आए पवित्रस्थान के साथ शब्दार्थ-संबंध भी बनाए रखता है।
- source_word: אֶת יִשְׂרָאֵל
  choice: इस्राएल को
  rationale: मूल में सीधे व्यक्तिवाचक नाम कर्म के रूप में है; अनावश्यक विस्तार नहीं किया गया।
- source_word: בִּהְיוֹת
  choice: जब ... रहेगा
  rationale: בְּ के साथ היה का infinitive construct उस परिस्थिति अथवा समय को बताता है जिसमें जातियाँ याहवे को पहचानेंगी। मुख्य भविष्यसूचक कथन के अनुरूप हिन्दी में ‘जब ... रहेगा’ स्वाभाविक है।
- source_word: מִקְדָּשִׁי
  choice: मेरा पवित्रस्थान
  rationale: מִקְדָּשׁ पवित्र स्थान अथवा sanctuary को दर्शाता है। ‘पवित्रस्थान’ ‘मन्दिर’ की अपेक्षा व्यापक है और किसी भवन तक अर्थ को अनावश्यक रूप से सीमित नहीं करता।
- source_word: בְּתוֹכָם
  choice: उनके बीच
  rationale: यह सामूहिक और स्थानवाचक भाव में लोगों के मध्य परमेश्वर की उपस्थिति को व्यक्त करता है।
- source_word: לְעוֹלָם
  choice: सदा के लिए
  rationale: पुनर्स्थापना के इस प्रसंग में यह स्थायी, अनन्त अवधि को व्यक्त करने वाला स्वाभाविक आधुनिक हिन्दी रूप है।
theological_decisions:
- issue: परमेश्वर के नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में चार अक्षरों वाला व्यक्तिगत वाचा-नाम सीधे आया है। ‘याहवे’ उसे किसी उपाधि से प्रतिस्थापित किए बिना प्रस्तुत करता है।
- issue: מְקַדֵּשׁ का इस्राएल से सम्बन्ध
  choice: जो इस्राएल को पवित्र करता हूँ
  alternative: जो इस्राएल को पवित्र बनाता हूँ; जो इस्राएल का पवित्रीकरण करता हूँ
  rationale: यह रूप याहवे को इस्राएल की पवित्रता का कर्ता बताता है और संस्कारगत अभिषेक तक अर्थ को सीमित किए बिना वाचा और पवित्र उपस्थिति के सम्बन्ध को बनाए रखता है।
- issue: पवित्रस्थान की उपस्थिति और जातियों का ज्ञान
  choice: जब मेरा पवित्रस्थान ... रहेगा
  alternative: मेरे पवित्रस्थान के ... रहने से
  rationale: मूल का בִּהְיוֹת समय और परिस्थिति दोनों का भाव दे सकता है। ‘जब’ इस अस्पष्टता को पर्याप्त रूप से खुला रखता है और इसे केवल कारणार्थक कथन नहीं बनाता।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण भविष्यसूचक शैली रखी गई है। ‘पवित्रस्थान’ बाइबलीय पवित्र-उपस्थिति का भाव बनाए रखता है, जबकि वाक्य-विन्यास सामान्य पाठक के लिए स्पष्ट है।
