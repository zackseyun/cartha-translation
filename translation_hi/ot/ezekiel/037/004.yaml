language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר אֵלַ֔/י הִנָּבֵ֖א עַל הָ/עֲצָמ֣וֹת הָ/אֵ֑לֶּה וְ/אָמַרְתָּ֣ אֲלֵי/הֶ֔ם הָ/עֲצָמוֹת֙ הַ/יְבֵשׁ֔וֹת שִׁמְע֖וּ דְּבַר יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/037/004.yaml
  text: Then he said to me[a], “Prophesy over these bones, and say to them, ‘Dry bones, hear the word of Yahweh.’”
translation:
  language: hi
  text: तब उसने मुझसे कहा, “इन हड्डियों पर भविष्यवाणी कर और उनसे कह, ‘हे सूखी हड्डियो, याहवे[a] का वचन सुनो।’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इब्रानी: YHWH; परंपरागत रूप से ‘प्रभु’ अनूदित।'
    reason: ईश्वरीय नाम के पारंपरिक वैकल्पिक अनुवाद की जानकारी।
lexical_decisions:
- source_word: וַיֹּאמֶר אֵלַי
  choice: तब उसने मुझसे कहा
  rationale: वाव-परिणामी कथा को आगे बढ़ाता है; ‘तब’ आधुनिक हिन्दी में घटनाक्रम को स्वाभाविक रूप से व्यक्त करता है।
- source_word: הִנָּבֵא
  choice: भविष्यवाणी कर
  rationale: निफ़अल आज्ञार्थक का यह सटीक और प्रचलित भविष्यद्वक्ताई अर्थ है।
- source_word: עַל
  choice: पर
  rationale: इस संदर्भ में यह उन हड्डियों को लक्ष्य बनाकर भविष्यवाणी करने का संकेत देता है। ‘पर’ इब्रानी संबंध को बनाए रखता है और अनावश्यक रूप से विरोध या दण्ड की भावना नहीं जोड़ता।
- source_word: הָעֲצָמוֹת הָאֵלֶּה
  choice: इन हड्डियों
  rationale: निश्चयवाचक सर्वनाम और संज्ञा का सीधा अनुवाद; यहाँ ‘सूखी’ नहीं जोड़ा गया, क्योंकि वह आगे संबोधन में स्पष्ट रूप से आता है।
- source_word: וְאָמַרְתָּ אֲלֵיהֶם
  choice: और उनसे कह
  rationale: אָמַר सामान्यतः ‘कहना’ है; एकवचन आज्ञा का भाव हिन्दी में स्वाभाविक रूप से रखा गया है।
- source_word: הָעֲצָמוֹת הַיְבֵשׁוֹת
  choice: हे सूखी हड्डियो
  rationale: यह प्रत्यक्ष संबोधन है; ‘हे’ और संबोधन रूप ‘हड्डियो’ आधुनिक गरिमामय हिन्दी में इसे स्पष्ट करते हैं।
- source_word: שִׁמְעוּ
  choice: सुनो
  rationale: बहुवचन आज्ञार्थक को सीधे रखा गया है और भविष्यद्वक्ताई सूत्र की गंभीरता बनी रहती है।
- source_word: דְּבַר יְהוָה
  choice: याहवे का वचन
  rationale: דָּבָר को भविष्यद्वक्ताई प्रसंग में ‘वचन’ और परमेश्वर के विशिष्ट नाम יהוה को ‘याहवे’ रूप में प्रस्तुत किया गया है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: याहवे
  alternative: प्रभु; यहोवा
  rationale: मूल पाठ में चार-अक्षरीय विशिष्ट ईश्वरीय नाम सीधे प्रयुक्त है। ‘याहवे’ उसे उपाधि में बदलने के बजाय नाम के रूप में सुरक्षित रखता है; पारंपरिक रूप पाठक-सहायता के लिए पादटिप्पणी में दिया गया है।
- issue: निर्जीव हड्डियों को सुनने की आज्ञा
  choice: प्रत्यक्ष संबोधन और आज्ञा को यथावत रखना
  alternative: अर्थ स्पष्ट करने के लिए इसे रूपकात्मक कथन बनाना
  rationale: दर्शन में नबी सचमुच हड्डियों को संबोधित करता है। मूल की धर्मवैचारिक और काव्यात्मक तीव्रता को बिना समझाए या नरम किए सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमामय रखी गई है। एकवचन आज्ञाएँ ‘कर’ और ‘कह’ मूल में नबी को दिए गए सीधे आदेश को व्यक्त करती हैं, जबकि ‘सुनो’ हड्डियों के बहुवचन संबोधन के अनुरूप है।
