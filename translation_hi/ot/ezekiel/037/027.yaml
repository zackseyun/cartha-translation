id: EZK.37.27
reference: Ezekiel 37:27
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/הָיָ֤ה מִשְׁכָּנִ/י֙ עֲלֵי/הֶ֔ם וְ/הָיִ֥יתִי לָ/הֶ֖ם לֵֽ/אלֹהִ֑ים וְ/הֵ֖מָּה יִֽהְיוּ לִ֥/י לְ/עָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/037/027.yaml
  text: My dwelling place will be over them[a], and I will be their God, and they will be my people.
translation:
  language: hi
  text: मेरा निवास-स्थान उनके ऊपर होगा[a], और मैं उनका परमेश्वर होऊँगा, और वे मेरे लोग होंगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘मेरा तम्बू उनके ऊपर होगा’ अथवा ‘मेरा निवास उनके ऊपर होगा।’
    reason: מִשְׁכָּן के लिए ‘निवास-स्थान’, ‘तम्बू’ और ‘निवास’ सम्भव हैं; टिप्पणी वास्तविक शब्दार्थ-विकल्प सुरक्षित रखती है।
lexical_decisions:
- source_word: מִשְׁכָּנִי
  choice: मेरा निवास-स्थान
  rationale: מִשְׁכָּן का अर्थ निवास या तम्बू हो सकता है। ‘निवास-स्थान’ मूल के ठोस अर्थ को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है और इसे केवल मूसा के तम्बू तक सीमित नहीं करता।
- source_word: עֲלֵיהֶם
  choice: उनके ऊपर
  rationale: עַל का सीधा स्थानवाचक अर्थ ‘पर/ऊपर’ है। ‘उनके ऊपर’ मूल बिंब और उसकी सम्भावित रक्षात्मक छाया को बनाए रखता है; इसे व्याख्यात्मक रूप से ‘उनके बीच’ नहीं बनाया गया।
- source_word: וְהָיִיתִי לָהֶם לֵאלֹהִים
  choice: और मैं उनका परमेश्वर होऊँगा
  rationale: यह इब्रानी की स्थापित वाचा-सूत्र भाषा का स्वाभाविक हिन्दी रूप है और उसके सम्बन्धपरक बल को बनाए रखता है।
- source_word: וְהֵמָּה יִהְיוּ לִי לְעָם
  choice: और वे मेरी प्रजा होंगे
  rationale: यह वाचा-सूत्र के दूसरे भाग का स्वाभाविक और परिचित हिन्दी रूप है। ‘प्रजा’ सामूहिक עָם को गरिमापूर्ण ढंग से व्यक्त करती है।
- source_word: וְהָיָה
  choice: होगा
  rationale: भविष्यसूचक प्रसंग में संयोजित पूर्ण क्रिया का सरल भविष्य रूप स्वाभाविक है; इसे अनावश्यक रूप से ‘और ऐसा होगा कि’ कहकर विस्तृत नहीं किया गया।
theological_decisions:
- issue: वाचा-सूत्र की भाषा
  choice: ‘मैं उनका परमेश्वर होऊँगा, और वे मेरी प्रजा होंगे’ के पारम्परिक वाचा-सूत्र को बनाए रखना
  alternative: ‘मैं उनके लिए परमेश्वर होऊँगा, और वे मेरे लिए एक जाति होंगे’
  rationale: इब्रानी में सुविख्यात वाचा-सूत्र है। उसका पहचाना जाने वाला रूप बनाए रखना व्यापक बाइबलीय प्रतिध्वनि को सुरक्षित रखता है, बिना पाठ से परे कोई साम्प्रदायिक व्याख्या जोड़े।
- issue: עֲלֵיהֶם का स्थानवाचक बिंब
  choice: ‘उनके ऊपर’
  alternative: ‘उनके बीच/साथ’
  rationale: मूल पाठ का सीधा अर्थ ‘ऊपर/पर’ है। अधिक सहज लगने वाले ‘बीच’ से बदलना वास्तविक स्थानवाचक और सम्भवतः रक्षात्मक बिंब को मिटा देता।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और बाइबलीय वाचा-भाषा। ‘निवास-स्थान’ सामान्य पाठक के लिए स्पष्ट है; ‘उनके ऊपर’ जानबूझकर मूल इब्रानी बिंब को बनाए रखता है।
