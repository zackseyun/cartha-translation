  text: הָיְתָ֣ה עָלַ/י֮ יַד יְהוָה֒ וַ/יּוֹצִאֵ֤/נִי בְ/ר֨וּחַ֙ יְהוָ֔ה וַ/יְנִיחֵ֖/נִי בְּ/ת֣וֹךְ הַ/בִּקְעָ֑ה וְ/הִ֖יא מְלֵאָ֥ה עֲצָמֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/037/001.yaml
  text: The hand of Yahweh was upon me[a], and he brought me out by the Spirit of Yahweh and set me down in the middle of the valley[b]; it was full of bones.
translation:
  language: hi
  text: याहवे का हाथ मुझ पर था, और वह मुझे याहवे की आत्मा के द्वारा बाहर ले गया[a] और मुझे घाटी[b] के बीच में रख दिया; वह हड्डियों से भरी हुई थी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “याहवे की आत्मा में।” इब्रानी वाक्यांश माध्यम (“आत्मा के द्वारा”) अथवा अवस्था/क्षेत्र (“आत्मा में”)—दोनों व्यक्त कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: “घाटी” का अनुवाद “मैदान” या “विस्तृत घाटी” भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: יַד יְהוָה
  choice: याहवे का हाथ
  rationale: यह भविष्यद्वाणी संबंधी प्रचलित बिंब याहवे की सामर्थ्य और भविष्यद्वक्ता पर उसके प्रभाव को व्यक्त करता है; ‘हाथ’ बनाए रखने से इब्रानी की ठोस छवि सुरक्षित रहती है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी परमेश्वर-नाम का लिप्यंतरण व्यक्तिगत नाम को सुरक्षित रखता है, उसे किसी उपाधि से नहीं बदलता।
- source_word: וַיּוֹצִאֵנִי
  choice: वह मुझे ... बाहर ले गया
  rationale: יצא के हिफ़ील रूप का कारक अर्थ ‘बाहर ले जाना’ है; यह हिन्दी में स्वाभाविक है और गति के ढंग को अनावश्यक रूप से निर्धारित नहीं करता।
- source_word: בְרוּחַ יְהוָה
  choice: याहवे के आत्मा के द्वारा
  rationale: भविष्यद्वक्ता को ले जाए जाने के प्रसंग में רוּחַ का ‘आत्मा’ अर्थ सबसे उपयुक्त है; ‘के द्वारा’ दैवी माध्यम को व्यक्त करता है, जबकि ‘आत्मा में’ की संभावित व्याख्या पादटिप्पणी में सुरक्षित है।
- source_word: וַיְנִיחֵנִי
  choice: उसने मुझे ... उतार दिया
  rationale: נוח के हिफ़ील रूप में किसी स्थान पर ठहरा देने का भाव है। इस अलौकिक स्थानांतरण के क्रम में ‘उतार दिया’ स्वाभाविक और सजीव हिन्दी है।
- source_word: בְּתוֹךְ הַבִּקְעָה
  choice: उस चौड़ी घाटी के बीच में
  rationale: בִּקְעָה विस्तृत घाटी या समतल घाटी को सूचित कर सकता है; ‘चौड़ी घाटी’ मूल की भौगोलिक व्यापकता को स्पष्ट और सहज रूप में व्यक्त करती है।
- source_word: מְלֵאָה עֲצָמוֹת
  choice: हड्डियों से भरी हुई थी
  rationale: यह सीधा विशेषणात्मक वाक्यांश है और मूल की कठोर, प्रभावशाली छवि को बनाए रखता है।
theological_decisions:
- issue: भविष्यद्वक्ता के स्थानांतरण में רוּחַ का अर्थ
  choice: याहवे का आत्मा
  alternative: याहवे की हवा
  rationale: शब्द में ‘आत्मा’, ‘हवा’ और ‘श्वास’ की अर्थ-सीमा है, पर यहाँ भविष्यद्वाणी के अनुभव और दैवी कार्य का प्रसंग ‘आत्मा’ का समर्थन करता है; साथ ही माध्यम और अवस्था की व्याकरणिक अस्पष्टता पादटिप्पणी में रखी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज शैली रखी गई है। वाक्य की गतिशीलता और ‘हाथ’, ‘आत्मा’ तथा ‘हड्डियों’ की ठोस मूल छवियाँ सुरक्षित हैं। हर पादटिप्पणी-सूचक मुख्य पाठ में उपस्थित है।
