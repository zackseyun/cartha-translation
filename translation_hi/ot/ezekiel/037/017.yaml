  yaml_path: translation/ot/ezekiel/037/017.yaml
  text: Then bring them near to each other for yourself as one stick[b][a], so that they may become one in your hand.
translation:
  language: hi
  text: फिर उन दोनों को अपने लिए एक-दूसरे के पास ले आकर एक ही लकड़ी बना दे[a]; तब वे तेरे हाथ में एक हो जाएँगी[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उन्हें एक-दूसरे के पास एक ही लकड़ी के रूप में ले आ।” हिब्रू वाक्यांश परिणाम (“एक लकड़ी बना देना”) या अवस्था (“एक लकड़ी के रूप में”)—दोनों अर्थ व्यक्त कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “वे तेरे हाथ में एकों के लिए होंगी”; यह एक होने को व्यक्त करने वाला हिब्रू प्रयोग है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְקָרַב
  choice: फिर ... पास ले आ
  rationale: यह קרב का द्वितीय पुरुष एकवचन पुल्लिंग आज्ञार्थक रूप है। ‘फिर’ वाव के क्रमसूचक बल को व्यक्त करता है और ‘पास ले आ’ मूल क्रिया के अर्थ को बिना अनावश्यक व्याख्या के बनाए रखता है।
- source_word: אֹתָם
  choice: उन दोनों को
  rationale: सर्वनाम पिछले पद में बताई गई दो लकड़ियों की ओर संकेत करता है; हिन्दी में द्विवचन-संदर्भ स्पष्ट करने के लिए ‘दोनों’ स्वाभाविक है।
- source_word: אֶחָד אֶל אֶחָד
  choice: एक-दूसरे के पास
  rationale: शाब्दिक संरचना ‘एक को एक की ओर’ है, जिसका पारस्परिक अर्थ आधुनिक हिन्दी में ‘एक-दूसरे के पास’ से स्वाभाविक रूप से व्यक्त होता है।
- source_word: לְךָ
  choice: अपने लिए
  rationale: यह यहेजकेल से संबंधित दत्तिव को बनाए रखता है और चिह्नात्मक कार्य में उसकी निजी भागीदारी को व्यक्त करता है।
- source_word: לְעֵץ אֶחָד
  choice: एक ही लकड़ी के रूप में
  rationale: עֵץ यहाँ संदर्भानुसार लिखी हुई लकड़ी को दर्शाता है। לְ परिणाम (‘एक लकड़ी बना कर’) अथवा अवस्था/भूमिका (‘एक लकड़ी के रूप में’) व्यक्त कर सकता है; मुख्य पाठ में दूसरा अर्थ रखा गया और विकल्प पादटिप्पणी में दिया गया है।
- source_word: וְהָיוּ לַאֲחָדִים
  choice: और वे ... एक हो जाएँगे
  rationale: हिब्रू का असामान्य बहुवचन ‘एकों के लिए होंगे’ एकता प्राप्त करने का भाव देता है। हिन्दी का ‘एक हो जाएँगे’ उस परिणाम को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: בְיָדֶךָ
  choice: तेरे हाथ में
  rationale: 'यह ठोस चिह्नात्मक दृश्य को अक्षुण्ण रखता है: दोनों लकड़ियाँ भविष्यद्वक्ता के हाथ में एक होती हैं।'
theological_decisions:
- issue: दो लकड़ियों द्वारा दर्शाई गई एकता का स्वरूप
  choice: पद में केवल दृश्य चिह्नात्मक कार्य को रखा गया है—लकड़ियाँ हाथ में एक होती हैं।
  alternative: इसे व्याख्यात्मक रूप से ‘दोनों को मिला दे’ या इस्राएल के पुनर्मिलन का स्पष्ट उल्लेख करते हुए अनुवाद करना।
  rationale: आस-पास का प्रसंग इस चिह्न का अर्थ बताता है, पर यह पद स्वयं भविष्यद्वक्ता की ठोस क्रिया का वर्णन करता है। इसलिए बाद की धार्मिक या राजनीतिक व्याख्या को पद में नहीं जोड़ा गया।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सहज हिन्दी अपनाई गई है। परमेश्वर द्वारा यहेजकेल को सीधे संबोधन के कारण एकवचन ‘तेरे/ले आ’ रखा गया है। ठोस ‘लकड़ी’ की छवि सुरक्षित है और वाक्यांश की वास्तविक हिब्रू अस्पष्टता पादटिप्पणी में दी गई है।
