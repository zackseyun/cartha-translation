base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/037/016.yaml
  text: And you[a], son of man, take for yourself one stick and write on it, ‘For Judah and for the sons of Israel, his companions.’ Then take one stick and write on it, ‘For Joseph, the stick of Ephraim, and all the house of Israel[c][b], his companions.’
translation:
  language: hi
  text: '“और हे मनुष्य के पुत्र, तू अपने लिए लकड़ी का एक टुकड़ा[a] ले और उस पर लिख: ‘यहूदा के लिए, और इस्राएल के पुत्रों[b], उसके साथियों[c] के लिए।’ फिर लकड़ी का एक और टुकड़ा ले और उस पर लिख: ‘यूसुफ के लिए—अर्थात् एप्रैम की लकड़ी—और इस्राएल के सारे घराने, उसके साथियों के लिए।’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘लकड़ी का एक टुकड़ा’ का अनुवाद ‘एक छड़ी’ या, अधिक व्याख्यात्मक रूप में, ‘लकड़ी की एक पट्टी’ भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या ‘इस्राएल की सन्तानों।’ इब्रानी का शाब्दिक अर्थ ‘इस्राएल के पुत्र’ है।
    reason: lexical_alternative
  - marker: c
    text: या ‘उससे जुड़े हुए लोग,’ ‘उसके सहयोगी,’ अथवा ‘उसके सहचर।’ यही शब्द पद में आगे दूसरी बार भी आया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶן אָדָם
  choice: मनुष्य के पुत्र
  rationale: यह यहेजकेल के लिए बार-बार प्रयुक्त विशिष्ट सम्बोधन है। शाब्दिक इब्रानी मुहावरे को बनाए रखने से इसकी भविष्यद्वक्ताई पुनरावृत्ति और प्रभाव सुरक्षित रहते हैं।
- source_word: קַח לְךָ
  choice: तू अपने लिए ... ले
  rationale: לְךָ में निहित व्यक्तिगत अथवा आत्मवाचक भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: עֵץ
  choice: लकड़ी का एक टुकड़ा
  rationale: इस प्रतीकात्मक कार्य में वस्तु हाथ में ली और उस पर लिखा जा सकता है। हिन्दी में यह अर्थ ‘पेड़’ की अपेक्षा स्पष्ट है, जबकि ‘लकड़ी की पट्टी’ अनावश्यक रूप से अधिक व्याख्यात्मक हो सकती है।
- source_word: וּכְתֹב עָלָיו
  choice: उस पर लिख
  rationale: भौतिक वस्तु पर लिखने की क्रिया का सीधा और स्वाभाविक अनुवाद।
- source_word: לִיהוּדָה / לְיוֹסֵף
  choice: यहूदा के लिए / यूसुफ के लिए
  rationale: उपसर्ग ל को वस्तु पर लिखे जाने वाले स्वामित्व अथवा सम्बन्धसूचक लेख के रूप में प्रस्तुत करता है।
- source_word: בְנֵי יִשְׂרָאֵל
  choice: इस्राएल के पुत्रों
  rationale: इब्रानी में स्पष्ट रूप से ‘पुत्र’ है; मुख्य पाठ उस रूप को बनाए रखता है, जबकि व्यापक वंशगत अर्थ फुटनोट में दिया गया है।
- source_word: חֲבֵרָיו
  choice: उसके साथी
  rationale: यह उन लोगों को सूचित करता है जो नामित पक्ष के साथ जुड़े हैं। एकवचन पुरुषवाचक प्रत्यय को ‘उसके’ द्वारा बनाए रखा गया है।
- source_word: עֵץ אֶפְרַיִם
  choice: एप्रैम की लकड़ी
  rationale: सम्बन्धसूचक रचना को संक्षेप में सुरक्षित रखता है और यूसुफ की लकड़ी को एप्रैम से जोड़ता है।
- source_word: כָּל בֵּית יִשְׂרָאֵל
  choice: इस्राएल के सारे घराने
  rationale: ‘इस्राएल का घराना’ मानक भविष्यद्वक्ताई अभिव्यक्ति है; ‘सारे’ כָּל के व्यापक भाव को बनाए रखता है।
theological_decisions:
- issue: प्रतीकात्मक कार्य में विभाजित राज्यों का निरूपण
  choice: यहूदा तथा यूसुफ/एप्रैम को दो अलग किन्तु सम्बन्धित समूहों के रूप में बनाए रखा गया है, जिन्हें आगे प्रतीकात्मक रूप से एक किया जाना है।
  alternative: दोनों पक्षों को सामान्यीकृत करके केवल ‘इस्राएली’ कहना, अथवा यूसुफ और एप्रैम के बीच के अलंकारिक सम्बन्ध को मिटा देना।
  rationale: इब्रानी पाठ ऐतिहासिक रूप से विभाजित राज्यों के अनुरूप एक ओर यहूदा और दूसरी ओर यूसुफ/एप्रैम को जानबूझकर नाम देता है। अनुवाद तत्काल प्रतीकात्मक कार्य से आगे कोई बाद की सैद्धान्तिक पहचान आरोपित नहीं करता।
- issue: חֲבֵרָיו में एकवचन सम्बन्धसूचक प्रत्यय
  choice: दोनों स्थानों पर ‘उसके साथी’ रखकर एकवचन प्रत्यय और उसके सम्भावित पूर्वपद की वास्तविक अस्पष्टता सुरक्षित रखी गई है।
  alternative: ‘उनके साथी’ कहकर वचन को समूह के अनुसार सहज बनाना।
  rationale: हिन्दी में ‘उसके’ कुछ औपचारिक लगता है, पर इससे स्रोत-पाठ का एकवचन रूप मिटता नहीं और यहूदा तथा यूसुफ के साथ सम्बन्ध बना रहता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण भविष्यद्वक्ताई शैली रखी गई है। ईश्वरीय सम्बोधन में एकवचन ‘तू’ मूल इब्रानी के निकट है। उद्धरणों को स्पष्ट रखा गया है, और ‘मनुष्य के पुत्र’ तथा ‘इस्राएल का घराना’ जैसी आवर्ती बाइबलीय अभिव्यक्तियों को सरल किए बिना समझने योग्य रूप दिया गया है।
