  text: וְ/הִנַּבֵּ֖אתִי כַּ/אֲשֶׁ֣ר צִוָּ֑/נִי וַ/תָּבוֹא֩ בָ/הֶ֨ם הָ/ר֜וּחַ וַ/יִּֽחְי֗וּ וַ/יַּֽעַמְדוּ֙ עַל רַגְלֵי/הֶ֔ם חַ֖יִל גָּד֥וֹל מְאֹד מְאֹֽד־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/037/010.yaml
  text: So I prophesied as he commanded me[a], and the breath entered into them, and they lived and stood on their feet, an exceedingly great army.
translation:
  language: hi
  text: तब जैसा उसने मुझे आज्ञा दी थी, मैंने वैसी ही भविष्यवाणी की। और वह श्वास[a] उनमें आ गया; वे जीवित हो गए और अपने पैरों पर खड़े हो गए—एक अत्यन्त विशाल सेना।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “आत्मा उनमें आ गया।” इब्रानी शब्द רוּחַ का अर्थ “श्वास,” “वायु” या “आत्मा” हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנַּבֵּאתִי
  choice: मैंने भविष्यवाणी की
  rationale: हित्पएल रूप यहाँ यहेजकेल के आज्ञानुसार नबी के रूप में वचन बोलने को व्यक्त करता है; ‘भविष्यवाणी की’ इसका संक्षिप्त और प्रचलित हिन्दी रूप है।
- source_word: כַּאֲשֶׁר צִוָּנִי
  choice: जैसा उसने मुझे आज्ञा दी थी ... वैसी ही
  rationale: इससे तुलना का भाव स्वाभाविक हिन्दी में सुरक्षित रहता है। कर्ता को मूल की तरह सर्वनाम से रखा गया है; यहाँ ‘यहोवा’ जोड़ना मूल से अधिक स्पष्ट करना होता।
- source_word: וַתָּבוֹא בָהֶם
  choice: उनमें आ गई
  rationale: בוא के साथ ב प्रवेश का भाव देता है। ‘उनमें आ गई’ सहज हिन्दी है और भीतर प्रवेश करने की गति को बनाए रखता है।
- source_word: הָרוּחַ
  choice: वह श्वास
  rationale: निकटवर्ती प्रसंग में यह मृत शरीरों को जीवित करने वाली श्वास है। मूल רוּחַ की ‘श्वास/वायु/आत्मा’ बहुअर्थकता को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: וַיִּחְיוּ
  choice: वे जीवित हो गए
  rationale: हिन्दी में यह बनने या पुनः जीवन पाने का भाव स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: וַיַּעַמְדוּ עַל רַגְלֵיהֶם
  choice: अपने पैरों पर खड़े हो गए
  rationale: यह इब्रानी बिंब का सीधा, स्पष्ट और स्वाभाविक हिन्दी रूप है।
- source_word: חַיִל
  choice: सेना
  rationale: यहाँ חַיִל खड़ी हुई संगठित सैन्य शक्ति को सूचित करता है; इसलिए ‘सेना’ सर्वाधिक ठोस और प्रसंगानुकूल है।
- source_word: גָּדוֹל מְאֹד מְאֹד
  choice: अत्यन्त विशाल
  rationale: दो बार आए מְאֹד के प्रबल तीव्रताबोध को स्वाभाविक, गरिमापूर्ण हिन्दी में ‘अत्यन्त विशाल’ व्यक्त करता है।
theological_decisions:
- issue: घाटी के दर्शन में बहुअर्थक רוּחַ का अनुवाद
  choice: श्वास
  alternative: आत्मा; वायु
  rationale: इस वाक्य में उसका तात्कालिक कार्य शरीरों में प्रवेश करके उन्हें जीवित करना है, इसलिए ‘श्वास’ मुख्य पाठ में उपयुक्त है। फिर भी पूरे दर्शन में वायु और परमेश्वर के आत्मा की प्रतिध्वनि बनी रहती है; अतः अर्थगत और धर्मवैचारिक तनाव को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और मौखिक पठन के अनुकूल। मूल की क्रमिक क्रियाओं और प्रबल समापन-बिंब को बनाए रखा गया है।
