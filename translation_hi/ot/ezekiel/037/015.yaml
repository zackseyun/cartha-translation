  rationale: ‘वचन’ मूल की औपचारिक नबूवतीय अभिव्यक्ति और उसके धार्मिक भार को बनाए रखता है, जबकि ‘संदेश’ अर्थ को स्पष्ट तो करता है पर कुछ अधिक व्याख्यात्मक है।
