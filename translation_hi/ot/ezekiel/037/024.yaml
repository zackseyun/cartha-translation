reference: Ezekiel 37:24
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/עַבְדִּ֤/י דָוִד֙ מֶ֣לֶךְ עֲלֵי/הֶ֔ם וְ/רוֹעֶ֥ה אֶחָ֖ד יִהְיֶ֣ה לְ/כֻלָּ֑/ם וּ/בְ/מִשְׁפָּטַ֣/י יֵלֵ֔כוּ וְ/חֻקֹּתַ֥/י יִשְׁמְר֖וּ וְ/עָשׂ֥וּ אוֹתָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/037/024.yaml
  text: My servant David will be king over them[a], and there will be one shepherd for all of them. They will walk in my judgments[b], and they will keep my statutes and do them.
translation:
  language: hi
  text: मेरा सेवक दाऊद[a] उन पर राजा होगा, और उन सबके लिए एक ही चरवाहा होगा।[b] वे मेरे न्याय-विधानों के अनुसार चलेंगे, मेरी विधियों का पालन करेंगे और उन्हें पूरा करेंगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘दाऊद’ को ऐतिहासिक दाऊद, दाऊद के वंश के किसी भावी शासक, या प्रतीकात्मक रूप से मसीह के रूप में समझा जा सकता है। इब्रानी पाठ केवल ‘दाऊद’ कहता है।
    reason: वैकल्पिक व्याख्याओं को सुरक्षित रखना, बिना मुख्य पाठ में किसी एक को निश्चित किए।
  - marker: b
    text: या, ‘वही उन सबके लिए एक चरवाहा होगा।’ इब्रानी को इस प्रकार भी समझा जा सकता है कि चरवाहे वाला उपवाक्य सीधे दाऊद की ओर संकेत करता है।
    reason: चरवाहे वाले उपवाक्य के दाऊद से संभावित व्याकरणिक संबंध को सुरक्षित रखना।
lexical_decisions:
- source_word: עַבְדִּי
  choice: मेरा सेवक
  rationale: राजकीय और वाचागत संदर्भ में עֶבֶד सम्मानसूचक पद है; ‘सेवक’ स्वाभाविक हिन्दी में इस भाव और संबंध दोनों को सुरक्षित रखता है।
- source_word: דָוִד
  choice: दाऊद
  rationale: व्यक्तिनाम को हिन्दी बाइबलीय परंपरा के प्रचलित रूप में रखा गया है, बिना उसकी पहचान की व्याख्या मूल पाठ में जोड़े।
- source_word: מֶלֶךְ עֲלֵיהֶם
  choice: उन पर राजा होगा
  rationale: מֶלֶךְ का सीधा अर्थ ‘राजा’ है और עַל शासन के संबंध में ‘पर’ दर्शाता है।
- source_word: וְרֹעֶה אֶחָד יִהְיֶה לְכֻלָּם
  choice: और उन सबका एक ही चरवाहा होगा
  rationale: ‘चरवाहा’ मूल के राजकीय-पशुपालकीय रूपक को बनाए रखता है; हिन्दी संबंधवाचक रचना एकीकृत नेतृत्व के भाव को स्वाभाविक ढंग से व्यक्त करती है।
- source_word: מִשְׁפָּטַי
  choice: मेरे नियमों
  rationale: מִשְׁפָּט यहाँ परमेश्वर के बाध्यकारी न्याय-विधानों को सूचित करता है। ‘नियम’ आधुनिक पाठक के लिए स्पष्ट है और अगले पद ‘विधियों’ से पर्याप्त भिन्नता रखता है।
- source_word: יֵלֵכוּ
  choice: चलेंगे
  rationale: चलना आचरण के रूपक के रूप में मूल इब्रानी मुहावरे को सुरक्षित रखता है और हिन्दी में समझने योग्य है।
- source_word: חֻקֹּתַי
  choice: मेरी विधियों
  rationale: חֻקּוֹת निर्धारित विधानों को दर्शाता है; ‘विधियाँ’ कानूनी-वाचागत अर्थ बनाए रखती हैं।
- source_word: יִשְׁמְרוּ
  choice: पालन करेंगे
  rationale: कानूनी संदर्भ में שׁמר का अर्थ मानना या पालन करना है; हिन्दी में ‘पालन करना’ स्वाभाविक है।
- source_word: וְעָשׂוּ אוֹתָם
  choice: और उन्हें व्यवहार में लाएँगे
  rationale: यह वाक्यांश विधियों को क्रियान्वित करने पर बल देता है; यह हिन्दी अभिव्यक्ति मूल के सक्रिय आज्ञापालन को स्पष्ट करती है।
theological_decisions:
- issue: पुनर्स्थापना की इस भविष्यवाणी में ‘दाऊद’ की पहचान
  choice: मुख्य पाठ में केवल ‘दाऊद’ रखा गया है।
  alternative: ऐतिहासिक दाऊद, दाऊदवंशी भावी शासक, अथवा मसीह के रूप में स्पष्ट व्याख्या जोड़ना।
  rationale: इब्रानी पाठ सीधे ‘दाऊद’ कहता है। अनुवाद किसी एक ऐतिहासिक, वंशगत या मसीही अर्थ को आरोपित किए बिना मूल की व्याख्यात्मक और धर्मवैज्ञानिक गुंजाइश बनाए रखता है।
- issue: चरवाहे वाले उपवाक्य का दाऊद से व्याकरणिक संबंध
  choice: ‘उन सबका एक ही चरवाहा होगा’—अलग अस्तित्वसूचक उपवाक्य।
  alternative: ‘वही उन सबका एक चरवाहा होगा’—दाऊद को प्रत्यक्ष कर्ता मानना।
  rationale: इब्रानी विधेय रचना दोनों समझ की अनुमति देती है। मुख्य पाठ एकीकृत नेतृत्व पर बल देता है, जबकि पादटिप्पणी व्यक्तिगत संबंध वाली वैकल्पिक समझ सुरक्षित रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज और वाचागत-भविष्यद्वाणी संबंधी शैली रखी गई है। ‘राजा’ और ‘चरवाहा’ जैसे मूल बिंब अक्षुण्ण हैं; अत्यधिक संस्कृतनिष्ठ कानूनी शब्दावली से बचते हुए ‘नियम’ और ‘विधियाँ’ चुने गए हैं।
