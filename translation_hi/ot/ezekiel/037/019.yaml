  text: דַּבֵּ֣ר אֲלֵ/הֶ֗ם כֹּֽה אָמַר֮ אֲדֹנָ֣/י יְהוִה֒ הִנֵּה֩ אֲנִ֨י לֹקֵ֜חַ אֶת עֵ֤ץ יוֹסֵף֙ אֲשֶׁ֣ר בְּ/יַד אֶפְרַ֔יִם וְ/שִׁבְטֵ֥י יִשְׂרָאֵ֖ל חבר/ו וְ/נָתַתִּי֩ אוֹתָ֨/ם עָלָ֜י/ו אֶת עֵ֣ץ יְהוּדָ֗ה וַֽ/עֲשִׂיתִ/ם֙ לְ/עֵ֣ץ אֶחָ֔ד וְ/הָי֥וּ אֶחָ֖ד בְּ/יָדִֽ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/037/019.yaml
  text: 'tell them[a], ‘Thus says the Lord GOD: Behold, I am taking the stick of Joseph, which is in the hand of Ephraim, and the tribes of Israel associated with him, and I will place them with it, with the stick of Judah, and make them one stick[b], and they will be one in my hand.’'
translation:
  language: hi
  text: 'उनसे कहो[a], ‘प्रभु याहवे यों कहता है: देखो, मैं यूसुफ की उस लकड़ी को, जो एप्रैम के हाथ में है, और इस्राएल के उन गोत्रों को जो उसके साथ जुड़े हैं, ले रहा हूँ; और मैं उन्हें उस पर, अर्थात् यहूदा की लकड़ी पर, रखूँगा[b]। मैं उन्हें एक लकड़ी बना दूँगा, और वे मेरे हाथ में एक हो जाएँगी।’'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “उनसे बोलो।”
    reason: lexical_alternative
  - marker: b
    text: हिब्रू में शाब्दिक रूप से, “मैं उन्हें उस पर रखूँगा, यहूदा की लकड़ी के साथ।” वाक्य-विन्यास में “उस” का संबंध कठिन है; यह दोनों प्रतीकात्मक लकड़ियों को एक करने का चित्र प्रस्तुत करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: דַּבֵּר אֲלֵהֶם
  choice: उनसे कहो
  rationale: आज्ञार्थक संबोधन को सहज और स्पष्ट आधुनिक हिन्दी में व्यक्त करता है।
- source_word: כֹּה אָמַר אֲדֹנָי יְהוִה
  choice: प्रभु यहोवा यों कहता है
  rationale: भविष्यद्वाणी के संदेशवाहक-सूत्र को बनाए रखता है और יהוה को वाचा-नाम ‘यहोवा’ के रूप में व्यक्त करता है।
- source_word: הִנֵּה
  choice: देखो
  rationale: दैवी घोषणा की ओर गंभीरतापूर्वक ध्यान खींचता है और आधुनिक हिन्दी में स्वाभाविक है।
- source_word: לֹקֵחַ
  choice: लेकर
  rationale: הִנֵּה के साथ कृदन्त की सजीव और आसन्न क्रिया को अगले क्रियापद से स्वाभाविक हिन्दी संरचना में जोड़ता है।
- source_word: עֵץ
  choice: लकड़ी
  rationale: प्रतीकात्मक क्रिया में प्रयुक्त लकड़ी के टुकड़े को दर्शाता है; ‘पेड़’ यहाँ अनुपयुक्त है और ‘छड़ी’ अनावश्यक रूप से डंडे का आकार निश्चित कर सकती है।
- source_word: אֲשֶׁר בְּיַד אֶפְרַיִם
  choice: जो एप्रैम के हाथ में है
  rationale: मूल का ‘हाथ’ बिंब सुरक्षित रखता है, जो पद के अंत में परमेश्वर के हाथ के उल्लेख से जुड़ता है।
- source_word: וְשִׁבְטֵי יִשְׂרָאֵל חברו
  choice: और उसके साथ जुड़ी इस्राएल की गोत्रों को
  rationale: חבר की संगति/जुड़ाव की सम्भावित भावना व्यक्त करता है और पुरुषवाचक प्रत्यय का संदर्भ यूसुफ/एप्रैम से जोड़ता है।
- source_word: וְנָתַתִּי אוֹתָם עָלָיו אֶת עֵץ יְהוּדָה
  choice: उन्हें यहूदा की लकड़ी के साथ रखूँगा
  rationale: वाक्य की कठिन हिब्रू रचना को सहज हिन्दी में देते हुए दोनों प्रतीकात्मक लकड़ियों के मिलाए जाने का चित्र बनाए रखता है।
- source_word: וַעֲשִׂיתִם לְעֵץ אֶחָד
  choice: मैं उन्हें एक ही लकड़ी बना दूँगा
  rationale: עשה + ל के ‘किसी रूप में बना देना’ अर्थ और एकता पर बल को स्पष्ट करता है।
- source_word: וְהָיוּ אֶחָד בְּיָדִי
  choice: वे मेरे हाथ में एक हो जाएँगी
  rationale: एकता और ‘हाथ’ के समापन-बिंब को सुरक्षित रखता है; हिन्दी में ‘लकड़ियाँ’ के अनुसार स्त्रीलिंग बहुवचन स्वाभाविक है।
theological_decisions:
- issue: אֲדֹנָי יְהוִה में ईश्वरीय नाम का अनुवाद
  choice: प्रभु यहोवा
  alternative: प्रभु परमेश्वर; प्रभु याहवे
  rationale: אֲדֹנָי को ‘प्रभु’ और יהוה को हिन्दी में प्रचलित नाम ‘यहोवा’ देकर दोनों पदों का भेद तथा व्यक्तिगत वाचा-नाम सुरक्षित रखा गया है।
- issue: दो लकड़ियों का एक होना
  choice: प्रतीकात्मक एकता को बिना अतिरिक्त व्याख्या के व्यक्त किया गया
  alternative: राजनीतिक, कलीसियाई या अंतिमकालीन अर्थ को अनुवाद में स्पष्ट कर देना
  rationale: पद स्वयं प्रतीकात्मक मिलन बताता है; किसी विशिष्ट सम्प्रदायगत पूर्ति को मूल पाठ में जोड़ना उचित नहीं है।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण भविष्यद्वाणी-शैली और सामान्य पाठक के लिए स्पष्ट वाक्य-विन्यास अपनाया गया है। ‘यों कहता है’ पारंपरिक बाइबलीय गंभीरता बनाए रखता है; ‘देखो’ अपेक्षाकृत सहज आधुनिक ध्यान-सूचक है।
