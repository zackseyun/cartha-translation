source:
  edition: WLC
  text: וְ/יָשְׁב֣וּ עַל הָ/אָ֗רֶץ אֲשֶׁ֤ר נָתַ֨תִּי֙ לְ/עַבְדִּ֣/י לְ/יַֽעֲקֹ֔ב אֲשֶׁ֥ר יָֽשְׁבוּ בָ֖/הּ אֲבֽוֹתֵי/כֶ֑ם וְ/יָשְׁב֣וּ עָלֶ֡י/הָ הֵ֠מָּה וּ/בְנֵי/הֶ֞ם וּ/בְנֵ֤י בְנֵי/הֶם֙ עַד עוֹלָ֔ם וְ/דָוִ֣ד עַבְדִּ֔/י נָשִׂ֥יא לָ/הֶ֖ם לְ/עוֹלָֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/037/025.yaml
  text: They will dwell in the land that I gave to my servant Jacob[a], where your fathers dwelt; and they will dwell on it, they and their sons and their sons' sons, forever[c][b]. And David my servant will be prince for them forever.
translation:
  language: hi
  text: वे उस देश में बसेंगे जिसे मैंने अपने दास याकूब को दिया था और जिसमें तुम्हारे पुरखे[a] बसे थे। वे और उनके बेटे और उनके बेटों के बेटे उसमें सदा तक बसे रहेंगे। और मेरा दास दाऊद सदा तक उनका प्रधान[b] रहेगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शब्दशः, “तुम्हारे पिता”; यहाँ आशय पूर्वजों से है।
    reason: lexical_alternative
  - marker: b
    text: “प्रधान” का अनुवाद “राजकुमार,” “अगुआ” या “शासक” भी हो सकता है। इब्रानी में यहाँ “राजा” शब्द नहीं है। “दाऊद” से ऐतिहासिक दाऊद अभिप्रेत है या भावी दाऊदी शासक, यह पद स्वयं स्पष्ट नहीं करता।
    reason: lexical_and_interpretive_ambiguity
lexical_decisions:
- source_word: וְיָשְׁבוּ
  choice: बसेंगे / बसे रहेंगे
  rationale: ישׁב का अर्थ यहाँ किसी देश में स्थायी रूप से निवास करना है। ‘बसेंगे’ स्वाभाविक आधुनिक हिन्दी में भूमि और पुनर्स्थापना का भाव बनाए रखता है; दूसरी आवृत्ति में ‘बसे रहेंगे’ निरंतरता को स्पष्ट करती है।
- source_word: עַל הָאָרֶץ
  choice: उस देश में
  rationale: ישׁב के साथ עַל הָאָרֶץ का मुहावरेदार हिन्दी रूप ‘देश में बसना’ है। ‘भूमि पर’ अधिक शब्दशः होता, पर इस संदर्भ में कम स्वाभाविक है।
- source_word: אֲשֶׁר נָתַתִּי לְעַבְדִּי לְיַעֲקֹב
  choice: जिसे मैंने अपने दास याकूब को दिया था
  rationale: पूर्ण क्रिया पूर्व में दिए गए देश की ओर संकेत करती है; ‘दिया था’ उस पूर्वकालिक संबंध को सहज हिन्दी में व्यक्त करता है। ‘मेरे दास याकूब’ की वाचाई उपाधि सुरक्षित रखी गई है।
- source_word: אֲבוֹתֵיכֶם
  choice: तुम्हारे पुरखे
  rationale: शब्दशः अर्थ ‘तुम्हारे पिता’ है, पर यहाँ आशय पूर्वजों से है। ‘पुरखे’ आधुनिक हिन्दी में स्वाभाविक है और मूल के पुंल्लिंग रूप की छाप भी बनाए रखता है।
- source_word: הֵמָּה וּבְנֵיהֶם וּבְנֵי בְנֵיהֶם
  choice: वे और उनके बेटे और उनके बेटों के बेटे
  rationale: मूल की ‘वे, उनके पुत्र और उनके पुत्रों के पुत्र’ संरचना को पारदर्शी ढंग से रखा गया है; इसे केवल ‘वंशज’ या ‘पोते’ करके संक्षिप्त नहीं किया गया।
- source_word: עַד עוֹלָם / לְעוֹלָם
  choice: सदा तक
  rationale: दोनों पद स्थायी, अनिश्चित-अंत अवधि व्यक्त करते हैं। समान हिन्दी अभिव्यक्ति से पद की दोहरी स्थायित्व-प्रतिज्ञा सुरक्षित रहती है।
- source_word: וְדָוִד עַבְדִּי
  choice: और मेरा दास दाऊद
  rationale: नाम और उपाधि बिना व्याख्यात्मक विस्तार के रखे गए हैं। हिन्दी में ‘मेरा दास दाऊद’ स्वाभाविक शब्दक्रम है।
- source_word: נָשִׂיא
  choice: प्रधान
  rationale: यहेजकेल में נָשִׂיא शासकीय अगुआ के लिए प्रयुक्त होता है और מֶלֶךְ ‘राजा’ से अलग है। ‘प्रधान’ उस भेद को बनाए रखते हुए आधुनिक हिन्दी में समझने योग्य है।
- source_word: לָהֶם
  choice: उनका
  rationale: शब्दशः लकार ‘उनके लिए/उनके संबंध में’ है, किंतु नָשִׂיא के साथ हिन्दी में ‘उनका प्रधान’ स्वाभाविक रूप से उनके ऊपर अथवा उनके लिए नेतृत्व का संबंध व्यक्त करता है, बिना मूल से अधिक कठोर शासनार्थ जोड़ने के।
theological_decisions:
- issue: ‘मेरा दास दाऊद’ की पहचान
  choice: मुख्य पाठ में केवल ‘मेरा दास दाऊद’ रखा गया है।
  alternative: ऐतिहासिक दाऊद का पुनर्स्थापन; भावी दाऊदी शासक; मसीही दाऊदी राजा
  rationale: इब्रानी पाठ स्वयं ‘दाऊद’ कहता है और यह निर्धारित नहीं करता कि नाम को ऐतिहासिक, प्रतिनिधिक या मसीही अर्थ में लिया जाए। अनुवाद इस तनाव को नहीं सुलझाता।
- issue: נָשִׂיא का पदनाम
  choice: प्रधान
  alternative: राजकुमार; अगुआ; शासक; राजा
  rationale: मूल में ‘राजा’ (מֶלֶךְ) नहीं है। ‘प्रधान’ नेतृत्व और शासन का भाव देता है, पर पाठ में अनुपस्थित अधिक प्रबल राजकीय पदवी नहीं जोड़ता।
- issue: אֲבוֹתֵיכֶם का सामूहिक संदर्भ
  choice: पुरखे
  alternative: पिता; पूर्वज
  rationale: यहाँ बहुवचन पद पिछली पीढ़ियों को सामूहिक रूप से दर्शाता है। ‘पुरखे’ मूल के पुंल्लिंग रूप और व्यापक वंशगत आशय दोनों को सहज हिन्दी में व्यक्त करता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘बसेंगे/बसे रहेंगे’ निवास की पुनरावृत्ति और स्थायित्व को व्यक्त करते हैं। मुख्य पाठ में व्याख्यात्मक मसीही पहचान नहीं जोड़ी गई और ‘प्रधान’ द्वारा נָשִׂיא तथा ‘राजा’ के बीच मूल भेद सुरक्षित रखा गया है।
