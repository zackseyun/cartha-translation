  text: וַ/יֹּ֣אמֶר אֵלַ֔/י הִנָּבֵ֖א אֶל הָ/ר֑וּחַ הִנָּבֵ֣א בֶן אָ֠דָם וְ/אָמַרְתָּ֨ אֶל הָ/ר֜וּחַ כֹּֽה אָמַ֣ר אֲדֹנָ֣/י יְהוִ֗ה מֵ/אַרְבַּ֤ע רוּחוֹת֙ בֹּ֣אִי הָ/ר֔וּחַ וּ/פְחִ֛י בַּ/הֲרוּגִ֥ים הָ/אֵ֖לֶּה וְ/יִֽחְיֽוּ־־־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/037/009.yaml
  text: 'Then he said to me[a], “Prophesy to the breath; prophesy, son of man, and say to the breath, ‘Thus says the Lord GOD: Come from the four winds, O breath, and breathe on these slain, so that they may live.’”'
translation:
  language: hi
  text: 'तब उसने मुझसे कहा, “श्वास को संबोधित करके भविष्यवाणी कर; हे मनुष्य के पुत्र, भविष्यवाणी कर और श्वास से कह, ‘प्रभु यहोवा यों कहता है: हे श्वास, चारों दिशाओं की हवाओं से आ और इन मारे हुए लोगों पर फूँक मार, ताकि वे जीवित हो जाएँ।’”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी רוּחַ का अर्थ “श्वास,” “हवा” या “आत्मा” हो सकता है। यहाँ एकवचन में “श्वास” और “चारों दिशाओं की हवाओं” में “हवाएँ” अनूदित है; “आत्मा” भी समझा जा सकता है, जिससे दर्शन की बहुस्तरीय छवि बनी रहती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנָּבֵא
  choice: भविष्यवाणी कर
  rationale: नבא के आज्ञार्थक रूप की भविष्यद्वक्ताई वाणी की क्रिया को मानक और संक्षिप्त हिन्दी में व्यक्त करता है।
- source_word: הָרוּחַ / רוּחוֹת
  choice: श्वास / हवाएँ
  rationale: רוּחַ में श्वास, हवा और आत्मा—तीनों अर्थों की संभावना है। मृतकों को जीवन मिलने के निकट संदर्भ में एकवचन के लिए ‘श्वास’ उपयुक्त है, जबकि מֵאַרְבַּע רוּחוֹת को ‘चारों दिशाओं की हवाओं’ कहना स्वाभाविक है; बहुस्तरीय अर्थ पाद-टिप्पणी में सुरक्षित है।
- source_word: בֶן אָדָם
  choice: हे मनुष्य के पुत्र
  rationale: यहेजकेल को संबोधित करने वाला विशिष्ट इब्रानी पद है। यह स्थापित, पारदर्शी अनुवाद है और नबी की मानवीय स्थिति को व्यक्त करता है।
- source_word: אֲדֹנָי יְהוִה
  choice: प्रभु यहोवा
  rationale: संयुक्त ईश्वरीय उपाधि को हिन्दी बाइबलीय परंपरा में स्पष्ट और गरिमापूर्ण ढंग से व्यक्त करता है।
- source_word: בֹּאִי
  choice: आ
  rationale: רוּחַ के अनुरूप स्त्रीलिंग एकवचन आज्ञार्थक का स्वाभाविक हिन्दी रूप।
- source_word: וּפְחִי
  choice: फूँक मार
  rationale: נפח का अर्थ फूँकना या श्वास देना है। בַּהֲרוּגִים के साथ ‘पर फूँक मार’ क्रिया और दृश्य को सीधे व्यक्त करता है।
- source_word: בַּהֲרוּגִים הָאֵלֶּה
  choice: इन मारे हुओं पर
  rationale: הֲרוּגִים युद्ध में मारे गए लोगों को सूचित करता है; यह हिन्दी अभिव्यक्ति स्पष्ट और दृश्य के अनुरूप है।
- source_word: וְיִחְיוּ
  choice: ताकि वे जीवित हो जाएँ
  rationale: संदर्भ में संयोजक सहित अपूर्ण क्रिया अपेक्षित उद्देश्य या परिणाम व्यक्त करती है।
theological_decisions:
- issue: घाटी के दर्शन में רוּחַ का बहुअर्थी प्रयोग
  choice: एकवचन को ‘श्वास’ और बहुवचन को ‘हवाएँ’ अनूदित किया गया है; ‘आत्मा’ की अर्थ-संभावना पाद-टिप्पणी में रखी गई है।
  alternative: सभी प्रयोगों में ‘आत्मा’ या सभी प्रयोगों में ‘हवा’ कहना।
  rationale: यह पद जानबूझकर श्वास, हवा और आत्मा के अर्थों को परस्पर प्रतिध्वनित करता है। निकट प्रसंग में ‘श्वास’ जीवन देने की क्रिया के अनुकूल है और ‘चारों दिशाओं की हवाएँ’ मुहावरे के अनुकूल; पाद-टिप्पणी धार्मिक-साहित्यिक तनाव को सुरक्षित रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण बाइबलीय शैली रखी गई है। ‘हे मनुष्य के पुत्र’ और ‘प्रभु यहोवा यों कहता है’ जैसे स्थापित पदबंध सुरक्षित हैं, जबकि वाक्य-संरचना साधारण पाठक के लिए सहज रखी गई है।
