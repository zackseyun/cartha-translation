source:
  edition: WLC
  text: וִֽ/ידַעְתֶּ֖ם כִּֽי אֲנִ֣י יְהוָ֑ה בְּ/פִתְחִ֣/י אֶת קִבְרֽוֹתֵי/כֶ֗ם וּ/בְ/הַעֲלוֹתִ֥/י אֶתְ/כֶ֛ם מִ/קִּבְרוֹתֵי/כֶ֖ם עַמִּֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/037/013.yaml
  text: Then you will know that I am Yahweh[a], when I open your graves and bring you up from your graves[b], O my people.
translation:
  language: hi
  text: तब तुम जानोगे कि मैं याहवे[a] हूँ, जब मैं तुम्हारी कब्रें खोलूँगा और तुम्हें तुम्हारी कब्रों से ऊपर निकाल लाऊँगा[b], हे मेरी प्रजा!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “और तुम जानोगे कि मैं याहवे हूँ।”
    reason: lexical_alternative
  - marker: b
    text: या, “और तुम्हें तुम्हारी कब्रों से ऊपर ले आऊँगा।” इब्रानी क्रिया का शाब्दिक अर्थ “ऊपर ले आना” या “ऊपर निकाल लाना” है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וִידַעְתֶּם
  choice: तब तुम जानोगे
  rationale: वाव-संयुक्त पूर्ण क्रिया यहाँ भविष्य के परिणाम को व्यक्त करती है। प्रसंग में ‘तब’ परिणामसूचक बल को स्वाभाविक हिन्दी में स्पष्ट करता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: परमेश्वर के व्यक्तिगत नाम को हिन्दी में प्रचलित लिप्यंतरण ‘यहोवा’ से रखा गया है, किसी उपाधि से प्रतिस्थापित नहीं किया गया।
- source_word: בְּפִתְחִי
  choice: जब मैं ... खोलूँगा
  rationale: בְּ के साथ प्रथम पुरुष प्रत्यययुक्त infinitive construct यहाँ कालवाचक है; ‘जब मैं खोलूँगा’ इसका स्वाभाविक हिन्दी रूप है।
- source_word: קִבְרוֹתֵיכֶם
  choice: तुम्हारी कब्रें
  rationale: קבר का सीधा अर्थ कब्र या दफनाने का स्थान है; बहुवचन और द्वितीय पुरुष प्रत्यय दोनों सुरक्षित रखे गए हैं।
- source_word: וּבְהַעֲלוֹתִי
  choice: और तुम्हें ... ऊपर निकाल लाऊँगा
  rationale: עלה के हिफ़ील रूप का मूल भाव ‘ऊपर ले आना/निकाल लाना’ है। यह चयन कब्रों से बाहर और ऊपर लाने की ठोस गति को रखता है तथा पुनरुत्थान की किसी एक धर्मवैज्ञानिक व्याख्या को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: מִקִּבְרוֹתֵיכֶם
  choice: तुम्हारी कब्रों से
  rationale: מן स्रोत या आरम्भ-बिन्दु बताता है; ‘से’ हिन्दी में इसे सीधे व्यक्त करता है।
- source_word: עַמִּי
  choice: हे मेरी प्रजा
  rationale: यह सम्बोधन है। ‘हे’ सम्बोधन-बल को और ‘मेरी प्रजा’ सम्बन्ध तथा वाचा-संबंधी पहचान को सुरक्षित रखते हैं।
theological_decisions:
- issue: क्या कब्रों को खोलने और उनमें से ऊपर लाने की भाषा को केवल राष्ट्रीय पुनर्स्थापना या स्पष्ट शारीरिक पुनरुत्थान के रूप में सीमित किया जाए
  choice: कब्रों को खोलने और उनसे ऊपर निकाल लाने की ठोस भाषा को यथावत रखना
  alternative: इसे निर्वासन से राष्ट्रीय पुनर्स्थापना के रूप में रूपकात्मक बनाना, या इसे स्पष्टतः शारीरिक पुनरुत्थान कहना
  rationale: इब्रानी पाठ पुनर्स्थापना के दर्शन में पुनरुत्थान-सदृश ठोस बिंब प्रयोग करता है। सीधा अनुवाद दोनों स्तरों की सम्भावना और धर्मवैज्ञानिक तनाव को सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, स्पष्ट और सामान्य पाठक के लिए सहज शैली। ‘कब्र’, ‘प्रजा’ और ‘हे’ बाइबलीय प्रसंग की गंभीरता बनाए रखते हैं; वाक्य में मूल पाठ की पुनरावृत्ति जानबूझकर सुरक्षित रखी गई है।
