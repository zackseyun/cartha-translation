  text: וַ/יֹּ֣אמֶר אֵלַ֔/י בֶּן אָדָ֕ם הֲ/תִחְיֶ֖ינָה הָ/עֲצָמ֣וֹת הָ/אֵ֑לֶּה וָ/אֹמַ֕ר אֲדֹנָ֥/י יְהוִ֖ה אַתָּ֥ה יָדָֽעְתָּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/037/003.yaml
  text: And he said to me[a], “Son of man, can these bones live?” And I said, “Lord GOD, you know.”
translation:
  language: hi
  text: उसने मुझसे कहा, “हे मनुष्य-पुत्र, क्या ये हड्डियाँ जीवित हो सकती हैं?” मैंने कहा, “हे प्रभु यहोवा, आप ही जानते हैं।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר אֵלַי
  choice: उसने मुझसे कहा
  rationale: वाव-क्रमिक कथा को आगे बढ़ाता है। हिन्दी में अनावश्यक ‘और’ के बिना यह स्वाभाविक कथात्मक प्रवाह देता है, जबकि ‘मुझसे’ אֵלַי का सीधा अर्थ रखता है।
- source_word: בֶּן אָדָם
  choice: हे मनुष्य के पुत्र
  rationale: यहेजकेल के लिए प्रयुक्त इस नियमित ईश्वरीय संबोधन की इब्रानी संरचना और साहित्यिक प्रतिध्वनि सुरक्षित रहती है; ‘हे’ हिन्दी में संबोधन स्पष्ट करता है।
- source_word: הֲתִחְיֶינָה
  choice: क्या ... जीवित हो सकती हैं
  rationale: प्रश्नवाचक कण और अपूर्ण क्रिया यहाँ संभावना पूछते हैं। स्त्रीलिंग बहुवचन क्रिया का मेल ‘हड्डियाँ’ से स्वाभाविक रूप से किया गया है।
- source_word: הָעֲצָמוֹת הָאֵלֶּה
  choice: ये हड्डियाँ
  rationale: पद में केवल ‘ये हड्डियाँ’ है; प्रसंग से ‘सूखी’ जोड़ना मूल पाठ से अधिक कहना होगा।
- source_word: וָאֹמַר
  choice: मैंने कहा
  rationale: यह अगली कथात्मक क्रिया है। आधुनिक हिन्दी में ‘मैंने कहा’ पर्याप्त और स्वाभाविक है।
- source_word: אֲדֹנָי יְהוִה
  choice: हे प्रभु यहोवा
  rationale: अֲדֹנָי को ‘प्रभु’ और व्यक्तिगत दिव्य नाम יְהוִה को पारदर्शी रूप से ‘यहोवा’ दिया गया है; ‘हे’ प्रत्यक्ष संबोधन को स्वाभाविक बनाता है।
- source_word: אַתָּה יָדָעְתָּ
  choice: आप ही जानते हैं
  rationale: स्पष्ट कर्ता אַתָּה पर दिए गए बल को हिन्दी का ‘आप ही’ स्वाभाविक रूप से व्यक्त करता है। सम्मानसूचक ‘आप’ ईश्वर को संबोधित करने के आधुनिक हिन्दी प्रयोग के अनुकूल है।
theological_decisions:
- issue: संयुक्त उपाधि אֲדֹנָי יְהוִה में दिव्य नाम का अनुवाद
  choice: प्रभु यहोवा
  alternative: प्रभु परमेश्वर
  rationale: ‘यहोवा’ चतुरक्षरीय व्यक्तिगत नाम को दिखाई देने देता है और अֲדֹנָי से उसका भेद बनाए रखता है। ‘प्रभु परमेश्वर’ अधिक प्रचलित हो सकता है, पर नाम को सामान्य पदवी में बदल देता है।
- issue: यहेजकेल में בֶּן אָדָם का अनुवाद
  choice: मनुष्य के पुत्र
  alternative: हे नश्वर मनुष्य
  rationale: शाब्दिक इब्रानी मुहावरे और पुस्तक में बार-बार आने वाले संबोधन की साहित्यिक एकरूपता रखी गई है, बिना इस प्रसंग में बाद की मसीही व्याख्या आरोपित किए।
- issue: אַתָּה में बल का निरूपण
  choice: आप ही जानते हैं
  alternative: आप जानते हैं
  rationale: इब्रानी में स्वतंत्र सर्वनाम אַתָּה क्रिया में निहित कर्ता के अतिरिक्त उपस्थित है और संदर्भ में उत्तर को परमेश्वर के ज्ञान पर छोड़ने का बल देता है। ‘ही’ उस व्यावहारिक बल को व्यक्त करता है, यद्यपि शब्दशः ‘अकेले’ नहीं जोड़ा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी, सरल किंतु गरिमापूर्ण। ईश्वर के लिए सम्मानसूचक ‘आप’ और संबोधन में ‘हे’ रखा गया है। वाक्यरचना को इब्रानी के निकट रखते हुए हिन्दी में स्वाभाविक बनाया गया है।
