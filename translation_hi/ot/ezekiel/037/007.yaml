- source_word: וַתִּקְרְבוּ עֲצָמוֹת
  choice: हड्डियाँ एक-दूसरे के पास आ गईं
  rationale: קרב के मूल अर्थ ‘निकट आना’ को बनाए रखते हुए हड्डियों की परस्पर गति को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: עֶצֶם אֶל עַצְמוֹ
  choice: हर हड्डी अपनी हड्डी से
  rationale: इब्रानी की वितरणात्मक और जानबूझकर असामान्य अभिव्यक्ति को सुरक्षित रखता है; इसका आशय प्रत्येक हड्डी का अपनी संगत हड्डी से जुड़ना है।
