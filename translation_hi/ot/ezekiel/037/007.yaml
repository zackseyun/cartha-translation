  yaml_path: translation/ot/ezekiel/037/007.yaml
  text: So I prophesied as I was commanded[a], and as I prophesied, there was a sound, and behold, a rattling, and the bones came together[b], bone to its bone.
translation:
  language: hi
  text: मैंने जैसा मुझे आज्ञा दी गई थी, वैसी ही भविष्यवाणी की। जब मैं भविष्यवाणी कर रहा था, तब एक आवाज़ हुई; और देखो, खड़खड़ाहट हुई, और हड्डियाँ पास आ गईं—हर हड्डी अपनी हड्डी के पास[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से ‘हड्डी अपनी हड्डी के पास’ है; यह वितरणात्मक अभिव्यक्ति बताती है कि हर हड्डी अपनी संगत हड्डी के पास आ गई।
    reason: lexical_alternative
