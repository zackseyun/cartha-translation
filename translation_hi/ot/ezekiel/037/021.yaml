source:
  edition: WLC
  text: וְ/דַבֵּ֣ר אֲלֵי/הֶ֗ם כֹּֽה אָמַר֮ אֲדֹנָ֣/י יְהוִה֒ הִנֵּ֨ה אֲנִ֤י לֹקֵ֨חַ֙ אֶת בְּנֵ֣י יִשְׂרָאֵ֔ל מִ/בֵּ֥ין הַ/גּוֹיִ֖ם אֲשֶׁ֣ר הָֽלְכוּ שָׁ֑ם וְ/קִבַּצְתִּ֤י אֹתָ/ם֙ מִ/סָּבִ֔יב וְ/הֵבֵאתִ֥י אוֹתָ֖/ם אֶל אַדְמָתָֽ/ם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/037/021.yaml
  text: 'Then say to them[a], ‘Thus says the Lord GOD: Behold, I am taking the children of Israel from among the nations where they have gone[b], and I will gather them from all around and bring them to their own land.’'
translation:
  language: hi
  text: 'तुम उनसे कहो, ‘प्रभु यहोवा यों कहता है: देखो, मैं इस्राएलियों को उन जातियों के बीच से ले रहा हूँ जहाँ वे चले गए हैं, और मैं उन्हें चारों ओर से इकट्ठा करूँगा और उनकी अपनी भूमि में ले आऊँगा।’'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְדַבֵּר אֲלֵיהֶם
  choice: तू उनसे कह
  rationale: एकवचन आदेश को स्पष्ट रखते हुए हिन्दी में स्वाभाविक भविष्यद्वाणी-संबंधी निर्देश दिया गया है। आरम्भिक וְ कथानक के क्रम को आगे बढ़ाता है, जिसे हिन्दी में अलग से ‘और’ कहना आवश्यक नहीं।
- source_word: כֹּה אָמַר
  choice: यों कहता है
  rationale: यह भविष्यद्वक्ताओं का मानक संदेशवाहक-सूत्र है; ‘यों कहता है’ औपचारिक, गरिमापूर्ण और सहज हिन्दी है।
- source_word: אֲדֹנָי יְהוִה
  choice: प्रभु यहोवा
  rationale: אֲדֹנָי को ‘प्रभु’ और परमेश्वर के व्यक्तिगत नाम יהוה को ‘यहोवा’ के रूप में अलग-अलग सुरक्षित रखा गया है।
- source_word: הִנֵּה
  choice: देखो
  rationale: यह आगामी ईश्वरीय घोषणा की ओर गंभीरतापूर्वक ध्यान खींचता है और आधुनिक हिन्दी में स्पष्ट है।
- source_word: לֹקֵחַ
  choice: ले रहा हूँ
  rationale: הִנֵּה के साथ आया कृदन्त कार्य को सजीव और आसन्न रूप में प्रस्तुत करता है; साधारण भविष्यकाल इसकी जीवंतता घटा देता।
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: इस्राएलियों
  rationale: शाब्दिक अर्थ ‘इस्राएल की सन्तान’ है, पर यहाँ पूरे इस्राएली समुदाय का बोध है; ‘इस्राएलियों’ आधुनिक हिन्दी में स्वाभाविक और समावेशी है।
- source_word: מִבֵּין הַגּוֹיִם
  choice: उन जातियों के बीच से
  rationale: यह उन विदेशी राष्ट्रों/जातियों को दर्शाता है जिनके बीच इस्राएली तितर-बितर हुए; ‘जातियों’ बाइबलीय अर्थ और बहुवचन दोनों को बनाए रखता है।
- source_word: אֲשֶׁר הָלְכוּ שָׁם
  choice: जहाँ वे चले गए हैं
  rationale: सम्बन्धवाचक वाक्यांश बिखराव के स्थानों को बताता है; पूर्ण वर्तमान उनके वहाँ चले जाने के वर्तमान परिणाम को व्यक्त करता है।
- source_word: וְקִבַּצְתִּי אֹתָם מִסָּבִיב
  choice: मैं उन्हें चारों ओर से इकट्ठा करूँगा
  rationale: מִסָּבִיב सभी दिशाओं से व्यापक पुनःएकत्रीकरण का चित्र देता है।
- source_word: וְהֵבֵאתִי אוֹתָם אֶל אַדְמָתָם
  choice: और उनकी अपनी भूमि में ले आऊँगा
  rationale: אַדְמָה यहाँ उनकी मातृभूमि है; हिन्दी का ‘ले आऊँगा’ गन्तव्य की ओर पुनःलाने का भाव और ‘अपनी’ मूल possessive प्रत्यय का बल व्यक्त करता है।
theological_decisions:
- issue: संयुक्त उपाधि אֲדֹנָי יְהוִה में परमेश्वर के नाम का अनुवाद
  choice: प्रभु यहोवा
  alternative: प्रभु परमेश्वर
  rationale: मूल में व्यक्तिगत नाम יהוה प्रत्यक्ष रूप से उपस्थित है। ‘प्रभु यहोवा’ אֲדֹנָי और יהוה दोनों को अलग बनाए रखता है और नाम को सामान्य पदवी में विलीन नहीं करता।
- issue: बिखरे हुए इस्राएल को वापस लाने की क्रिया का काल
  choice: ‘ले रहा हूँ’ के बाद ‘इकट्ठा करूँगा’ और ‘ले आऊँगा’
  alternative: सभी क्रियाओं को साधारण भविष्यकाल में रखना
  rationale: पहली क्रिया कृदन्त है और הִנֵּה के साथ सजीव/आसन्न ईश्वरीय कार्य दिखाती है, जबकि बाद की क्रियाएँ पूर्णरूप होते हुए भविष्यसूचक प्रतिज्ञा का कार्य करती हैं। यह कालगत तनाव मूल पाठ के अनुरूप सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। भविष्यद्वाणी-सूत्र के लिए ‘यों कहता है’ तथा ध्यानसूचक הִנֵּה के लिए ‘देखो’ रखा गया है। कोई पादटिप्पणी आवश्यक नहीं मानी गई, क्योंकि अनुवाद में मूल की अर्थगत और कालगत विशेषताएँ सीधे व्यक्त हो जाती हैं।
