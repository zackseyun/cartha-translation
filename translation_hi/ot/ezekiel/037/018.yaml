  text: וְ/כַֽ/אֲשֶׁר֙ יֹאמְר֣וּ אֵלֶ֔י/ךָ בְּנֵ֥י עַמְּ/ךָ֖ לֵ/אמֹ֑ר הֲ/לֽוֹא תַגִּ֥יד לָ֖/נוּ מָה אֵ֥לֶּה לָּֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/037/018.yaml
  text: And when the sons of your people say to you[a], ‘Will you not tell us what these things are to you?’
translation:
  language: hi
  text: और जब तुम्हारी प्रजा के लोग तुमसे कहें, ‘क्या तुम हमें नहीं बताओगे कि ये तुम्हारे लिए क्या हैं?’[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक अर्थ, ‘ये तुम्हारे लिए क्या हैं?’ इब्रानी मुहावरा यह पूछता है कि यहेजकेल के इस प्रतीकात्मक कार्य का क्या अर्थ है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכַאֲשֶׁר
  choice: और जब
  rationale: संयोजक और कालवाचक पद भविष्यसूचक प्रतीकात्मक कार्य के अगले चरण को कथा से जोड़ते हैं; ‘और जब’ दोनों भाव स्वाभाविक रूप से रखता है।
- source_word: יֹאמְרוּ אֵלֶיךָ
  choice: तुमसे कहें
  rationale: אָמַר का सामान्य अर्थ ‘कहना’ है। प्रश्न आगे प्रत्यक्ष कथन में आता है, इसलिए अधिक व्याख्यात्मक ‘पूछें’ के बजाय मूल क्रिया को रखा गया है।
- source_word: בְּנֵי עַמְּךָ
  choice: तुम्हारे लोगों के बेटे
  rationale: इब्रानी में स्पष्ट रूप से ‘तुम्हारे लोगों के बेटे’ है। यह मूल के पुल्लिंग और संबंधवाचक संरचना को बनाए रखता है।
- source_word: לֵאמֹר
  choice: प्रत्यक्ष उद्धरण द्वारा व्यक्त
  rationale: यह वाणी का परिचय देने वाला क्रियारूप है; हिन्दी में ‘यह कहते हुए’ जोड़ना अनावश्यक होता, इसलिए उद्धरण से इसका कार्य व्यक्त किया गया है।
- source_word: הֲלוֹא
  choice: क्या ... नहीं
  rationale: यह अपेक्षा-भरा आलंकारिक प्रश्न प्रस्तुत करता है; हिन्दी में ‘क्या ... नहीं’ उसके बल को स्वाभाविक रूप से व्यक्त करता है।
- source_word: תַגִּיד לָנוּ
  choice: हमें नहीं बताओगे
  rationale: נגד के हिफ़ील रूप का अर्थ बताना या प्रकट करना है; इस सीधे प्रश्न में ‘हमें बताओगे’ सहज और पर्याप्त रूप से सटीक है।
- source_word: מָה אֵלֶּה לָּךְ
  choice: ये तुम्हारे लिए क्या हैं
  rationale: यह इब्रानी अभिव्यक्ति का निकट और स्वाभाविक हिन्दी रूप है। संदर्भ में आशय प्रतीकात्मक कार्य के महत्व से है, पर मुख्य पाठ उसकी वास्तविक अस्पष्टता को हल नहीं करता।
theological_decisions:
- issue: प्रतीकात्मक वस्तुओं के अर्थ को मुख्य पाठ में स्पष्ट करना
  choice: शाब्दिक रूप ‘ये तुम्हारे लिए क्या हैं’ बनाए रखा
  alternative: ‘इनका तुम्हारे लिए क्या अर्थ है’
  rationale: संदर्भ अर्थ या महत्व पूछे जाने का संकेत देता है, लेकिन इब्रानी वाक्य स्वयं अधिक खुला है। अतः व्याख्या पादटिप्पणी में दी गई है, मुख्य पाठ में नहीं।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और मूल-पाठ के निकट शैली अपनाई गई है। संबोधन में ‘तुम’ रखा गया है, और ‘लोगों के बेटे’ मूल के स्पष्ट पुल्लिंग बहुवचन को सुरक्षित रखता है।
