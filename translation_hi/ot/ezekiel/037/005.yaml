- source_word: וִחְיִיתֶם
  choice: और तुम जीवित हो जाओगी
  rationale: यह आने वाले परिणाम को व्यक्त करता है। ‘जीवित हो जाओगी’ हड्डियों के पुनर्जीवित होने का अर्थ स्वाभाविक हिन्दी में स्पष्ट करता है।
theological_decisions:
- issue: संयुक्त उपाधि אֲדֹנָי יְהוִה में परमेश्वर के नाम का अनुवाद
  choice: प्रभु याहवे
  alternative: प्रभु परमेश्वर
  rationale: ‘याहवे’ मूल पाठ में आए विशिष्ट ईश्वरीय नाम को नाम के रूप में बनाए रखता है, जबकि ‘प्रभु’ אֲדֹנָי का अनुवाद है।
- issue: רוּחַ की बहुअर्थकता
  choice: मुख्य पाठ में ‘श्वास’, साथ में पादटिप्पणी
  alternative: आत्मा; वायु
  rationale: इस पद में जीवन पाने का ठोस चित्र ‘श्वास’ का समर्थन करता है, पर अध्याय में श्वास, वायु और आत्मा के बीच का अर्थ-संबंध महत्त्वपूर्ण है; इसलिए इसे किसी एक धर्मवैज्ञानिक अर्थ तक सीमित नहीं किया गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। ‘यों कहते हैं’ नबूवत के औपचारिक स्वर को बनाए रखता है; ‘देखो’ ध्यान आकर्षित करने वाले הִנֵּה का सहज हिन्दी रूप है।
