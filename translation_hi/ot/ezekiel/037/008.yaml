base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/037/008.yaml
  text: And I looked[a], and behold, there were sinews on them, and flesh had come up, and skin covered them from above; but there was no breath in them.
translation:
  language: hi
  text: मैंने देखा, और देखो, उन पर कंडराएँ थीं, मांस चढ़ आया था और त्वचा ने उन्हें ऊपर से ढक लिया था; पर उनमें साँस[a] नहीं थी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी शब्द ‘रूअख़’ का अर्थ ‘साँस’, ‘हवा’ या ‘आत्मा’ हो सकता है। यहाँ निर्जीव शरीरों के संदर्भ में ‘साँस’ उपयुक्त है, पर पूरे प्रसंग में इन तीनों अर्थों का परस्पर संबंध बना रहता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרָאִיתִי
  choice: मैंने देखा
  rationale: ראה का सामान्य और स्वाभाविक हिन्दी अर्थ ‘देखना’ है; यह भविष्यदर्शी के प्रत्यक्ष अवलोकन को व्यक्त करता है।
- source_word: וְהִנֵּה
  choice: और देखो
  rationale: הִנֵּה आगे के दृश्य की ओर ध्यान खींचता है। ‘देखो’ इसकी सजीवता को आधुनिक हिन्दी में बनाए रखता है।
- source_word: גִּדִים
  choice: नसें
  rationale: यह शब्द शरीर को जोड़ने वाले स्नायुओं या कंडराओं का बोध कराता है। ‘नसें’ सामान्य पाठक के लिए सहज और इस दृश्य में पर्याप्त रूप से स्पष्ट है।
- source_word: וּבָשָׂר עָלָה
  choice: मांस चढ़ आया था
  rationale: यह हड्डियों पर मांस के उभरकर आ जाने का चित्र प्रस्तुत करता है और हिन्दी में स्वाभाविक शारीरिक बिंब बनाए रखता है।
- source_word: וַיִּקְרַם עֲלֵיהֶם עוֹר מִלְמָעְלָה
  choice: ऊपर से उन पर चमड़ी चढ़ गई थी
  rationale: क्रिया त्वचा की परत से ढक जाने को बताती है; ‘ऊपर से’ बाहरी आवरण के स्थानगत भाव को सुरक्षित रखता है।
- source_word: וְרוּחַ אֵין בָּהֶם
  choice: पर उनमें साँस नहीं थी
  rationale: फिर से बने हुए पर अब भी निर्जीव शरीरों के इस तात्कालिक संदर्भ में ‘साँस’ सर्वाधिक स्वाभाविक है; रוּחַ के अन्य अर्थ पादटिप्पणी में सुरक्षित हैं।
theological_decisions:
- issue: सूखी हड्डियों के दर्शन में רוּחַ का अर्थ
  choice: साँस
  alternative: हवा; आत्मा
  rationale: यह वाक्य उन शरीरों का वर्णन करता है जो बन तो गए हैं, पर अभी जीवित नहीं हुए। इसलिए मुख्य पाठ में ‘साँस’ उपयुक्त है। फिर भी पूरे प्रसंग में साँस, हवा और आत्मा के अर्थों का जानबूझकर परस्पर संबंध है, इसलिए इस बहुअर्थकता को पादटिप्पणी में रखा गया है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण मानक हिन्दी। ‘नसें’, ‘मांस चढ़ आया’ और ‘चमड़ी चढ़ गई’ दृश्य की शारीरिक सजीवता को सामान्य पाठक के लिए स्पष्ट रखते हैं।
