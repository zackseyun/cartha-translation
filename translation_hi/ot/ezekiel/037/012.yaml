base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/037/012.yaml
  text: 'Therefore prophesy and say to them[a], ‘Thus says the Lord GOD: Behold, I am opening your graves and will bring you up from your graves, my people[b], and I will bring you into the land of Israel.’'
translation:
  language: hi
  text: '“इसलिए भविष्यद्वाणी कर और उनसे कह, ‘प्रभु यहोवा यों कहता है: देखो, मैं तुम्हारी कब्रें खोल रहा हूँ और तुम्हें तुम्हारी कब्रों से ऊपर ले आऊँगा[a], हे मेरी प्रजा[b], और तुम्हें इस्राएल की भूमि में ले आऊँगा।’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तुम्हें तुम्हारी कब्रों से उठा लाऊँगा।” इब्रानी में शाब्दिक भाव है, “तुम्हें तुम्हारी कब्रों से ऊपर ले आऊँगा।”
    reason: lexical_alternative
  - marker: b
    text: यह चित्र कब्रें खोले जाने की भाषा में निर्वासन से इस्राएल की पुनर्स्थापना का वर्णन कर सकता है; साथ ही यह पुनरुत्थान की बाद की आशा के साथ भी गूँजता है।
    reason: cross_reference
