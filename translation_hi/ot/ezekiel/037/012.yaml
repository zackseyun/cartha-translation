theological_decisions:
- issue: कब्रें खोले जाने के चित्र का स्वरूप
  choice: पुनरुत्थान-जैसी ठोस भाषा को बनाए रखा गया है, पर इसे केवल राष्ट्रीय निर्वासन-वापसी या अंतिम शारीरिक पुनरुत्थान के पूर्ण सिद्धान्त तक सीमित नहीं किया गया।
  alternative: इसे या तो पूर्णतः रूपकात्मक निर्वासन-वापसी अथवा सीधे व्यक्तिगत शारीरिक पुनरुत्थान की भविष्यद्वाणी के रूप में प्रस्तुत करना।
  rationale: पद पुनर्स्थापना के भविष्यद्वक्ताई प्रसंग में कब्रों और उनमें से ऊपर निकाले जाने की स्पष्ट भाषा प्रयुक्त करता है। अनुवाद इस वास्तविक व्याख्यात्मक तनाव को खुला रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण भविष्यद्वक्ताई शैली रखी गई है। ‘देखो’ और ‘यह कहता है’ जैसे रूप सामान्य पाठक के लिए बोधगम्य हैं; ‘प्रभु यहोवा’ मूल की संयुक्त उपाधि को सुरक्षित रखता है।
