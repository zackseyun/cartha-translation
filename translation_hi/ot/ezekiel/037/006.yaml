source:
  edition: WLC
  text: וְ/נָתַתִּי֩ עֲלֵי/כֶ֨ם גִּדִ֜ים וְֽ/הַעֲלֵתִ֧י עֲלֵי/כֶ֣ם בָּשָׂ֗ר וְ/קָרַמְתִּ֤י עֲלֵי/כֶם֙ ע֔וֹר וְ/נָתַתִּ֥י בָ/כֶ֛ם ר֖וּחַ וִ/חְיִיתֶ֑ם וִ/ידַעְתֶּ֖ם כִּֽי אֲנִ֥י יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/037/006.yaml
  text: I will put sinews on you[a], and I will bring flesh up over you, and I will cover you with skin, and I will put breath in you, and you will live. Then you will know that I am Yahweh.
translation:
  language: hi
  text: मैं तुम पर कंडराएँ चढ़ाऊँगा, तुम पर मांस चढ़ाऊँगा और तुम्हें त्वचा से ढक दूँगा। मैं तुम्हारे भीतर श्वास[a] डालूँगा और तुम जीवित हो जाओगे। तब तुम जानोगे कि मैं यहोवा हूँ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “आत्मा” या “हवा”; इब्रानी शब्द רוּחַ के ये तीनों अर्थ हो सकते हैं, और यहेजकेल 37 में इस व्यापक अर्थ-क्षेत्र का प्रयोग हुआ है।
    reason: lexical_alternative
lexical_decisions:
- source_word: גִּדִים
  choice: नसें
  rationale: यहाँ हड्डियों को जोड़ने वाले तंतुओं का बोध है। आधुनिक सामान्य हिन्दी में ‘नसें’ दृश्य को सहज रूप से व्यक्त करता है; अधिक तकनीकी ‘कंडराएँ’ अर्थ में संकरा और कम परिचित है।
- source_word: וְהַעֲלֵתִי עֲלֵיכֶם בָּשָׂר
  choice: तुम पर मांस उगाऊँगा
  rationale: עלה के कारक रूप की ‘ऊपर आने/चढ़ने देना’ वाली सजीव छवि को प्राकृतिक हिन्दी में ‘मांस उगाऊँगा’ व्यक्त करता है और शरीर के क्रमिक पुनर्गठन को बनाए रखता है।
- source_word: וְקָרַמְתִּי עֲלֵיכֶם עוֹר
  choice: तुम्हें चमड़े से ढक दूँगा
  rationale: क्रिया ऊपर से आवरण चढ़ाने या ढकने का भाव देती है; यह हिन्दी अभिव्यक्ति स्पष्ट और स्वाभाविक है।
- source_word: רוּחַ
  choice: श्वास
  rationale: इस वाक्य में इसके डाले जाने के बाद जीवित होने का परिणाम आता है, इसलिए स्थानीय संदर्भ में ‘श्वास’ सबसे उपयुक्त है। व्यापक प्रसंग में ‘आत्मा’ और ‘वायु’ के अर्थ भी सक्रिय हैं, जिन्हें पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: וִחְיִיתֶם
  choice: तुम जीवित हो जाओगे
  rationale: सूखी हड्डियों के पुनर्जीवन के प्रसंग में परिणाम को आधुनिक हिन्दी में स्वाभाविक ढंग से व्यक्त करता है।
- source_word: וִידַעְתֶּם כִּי אֲנִי יְהוָה
  choice: तब तुम जानोगे कि मैं यहोवा हूँ
  rationale: ‘तब’ पुनर्जीवन के बाद होने वाली पहचान के क्रम और परिणाम को स्पष्ट करता है; ईश्वरीय नाम को ‘यहोवा’ के रूप में रखा गया है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: व्यक्तिगत ईश्वरीय नाम को हिन्दी में प्रचलित लिप्यंतरण द्वारा स्पष्ट रूप से सुरक्षित रखता है।
theological_decisions:
- issue: רוּחַ का अर्थ ऐसे प्रसंग में जहाँ ‘श्वास’, ‘आत्मा’ और ‘वायु’ तीनों अर्थ संभव हैं
  choice: श्वास
  alternative: आत्मा; वायु
  rationale: निकट संदर्भ में शरीर पर नसें, मांस और चमड़ा आने के बाद רוּחַ डाली जाती है और वे जीवित होते हैं, इसलिए मुख्य पाठ में ‘श्वास’ उपयुक्त है। फिर भी अध्याय में शब्द की बहुअर्थकता जानबूझकर प्रयुक्त है, इसलिए अन्य अर्थ पादटिप्पणी में दिए गए हैं।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। शरीर के क्रमिक पुनर्गठन की दृश्यात्मकता बचाने के लिए सक्रिय और ठोस क्रियाओं का प्रयोग किया गया है।
