  choice: अपनी मूरतों
  rationale: सामान्य पाठ में सहज और स्पष्ट शब्द चुना गया है; मूल इब्रानी शब्द में निहित तीव्र तिरस्कार को पादटिप्पणी में बताया गया है।
- source_word: שִׁקּוּצֵיהֶם
  choice: अपनी घिनौनी वस्तुओं
  rationale: यह शब्द विशेषकर मूर्तिपूजा से जुड़ी घृणित वस्तुओं या रीति-रिवाजों के लिए प्रयुक्त होता है। 'घिनौनी वस्तुएँ' उसके विकर्षणकारी भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: פִּשְׁעֵיהֶם
  choice: अपने किसी भी अपराध
  rationale: פשע में अधिकार के विरुद्ध विद्रोह या उल्लंघन का भाव हो सकता है। 'अपराध' आधुनिक हिन्दी में स्पष्ट है और प्रसंग वाचा के विरुद्ध विद्रोह का संकेत बनाए रखता है।
- source_word: וְהוֹשַׁעְתִּי
  choice: मैं ... बचाऊँगा
  rationale: ישׁע उद्धार या छुड़ाने को व्यक्त करता है। यहाँ 'बचाऊँगा' तत्काल प्रसंग में स्वाभाविक रहते हुए परमेश्वर की उद्धारकारी पहल को बनाए रखता है।
- source_word: מוֹשְׁבֹתֵיהֶם
  choice: उनके ... सभी निवास-स्थानों
  rationale: मसोरेटिक पाठ का शब्द निवास या बसने के स्थानों को दर्शाता है। कठिन प्रसंग के बावजूद इस ठोस भौगोलिक बिंब को मुख्य पाठ में सुरक्षित रखा गया है।
- source_word: אֲשֶׁר חָטְאוּ בָהֶם
  choice: जहाँ उन्होंने पाप किया था
  rationale: सम्बन्धवाचक वाक्यांश को 'निवास-स्थानों' से जोड़ा गया है। 'जहाँ' हिन्दी में स्वाभाविक है और इब्रानी के स्थानवाचक संबंध को व्यक्त करता है।
- source_word: וְטִהַרְתִּי
  choice: मैं उन्हें शुद्ध करूँगा
  rationale: यह क्रिया धार्मिक और नैतिक शुद्धि, दोनों को समेट सकती है; 'शुद्ध करूँगा' दोनों आयामों को खुला रखता है।
- source_word: וְהָיוּ לִי לְעָם
  choice: वे मेरी प्रजा होंगे
  rationale: यह प्रचलित वाचा-सूत्र है। 'मेरी प्रजा' उसके सामुदायिक और वाचागत भाव को सहज हिन्दी में रखता है।
- source_word: וַאֲנִי אֶהְיֶה לָהֶם לֵאלֹהִים
  choice: मैं उनका परमेश्वर होऊँगा
  rationale: वाचा-सूत्र के दूसरे भाग का सीधा और स्वाभाविक हिन्दी रूप, जो मूल कथन की पारस्परिकता बनाए रखता है।
theological_decisions:
- issue: पाप, निर्वासन और उद्धार के बीच संबंध
  choice: मसोरेटिक पाठ के अनुसार परमेश्वर उन्हें उन सभी निवास-स्थानों से बचाता है जहाँ उन्होंने पाप किया, फिर शुद्ध करके वाचा का संबंध पुनः स्थापित करता है।
  alternative: इसे विशेष रूप से निर्वासन के स्थानों से छुड़ाना, अथवा स्थानों के बजाय धर्मत्यागों से बचाना समझा जा सकता है।
  rationale: מוֹשְׁבֹתֵיהֶם का सामान्य अर्थ 'निवास-स्थान' है, यद्यपि इस संदर्भ में वाक्यांश कठिन है। मुख्य पाठ मूल बिंब को बनाए रखता है और पादटिप्पणी वैकल्पिक समझ की सूचना देती है; इस प्रकार किसी संकीर्ण धर्मसैद्धांतिक निष्कर्ष को आरोपित नहीं किया गया।
- issue: शुद्धि और वाचा की पुनर्स्थापना
  choice: बचाना और शुद्ध करना परमेश्वर की पहल के रूप में प्रस्तुत हैं, जिसके बाद 'मेरी प्रजा' और 'उनका परमेश्वर' वाला वाचा-सूत्र आता है।
  alternative: इन चरणों को किसी बाद की विशिष्ट उद्धार-व्यवस्था या सम्प्रदायगत क्रम से समान ठहराना।
  rationale: पद का क्रम सुरक्षित रखा गया है, पर उससे परे कोई निजी या सम्प्रदायगत सिद्धांत नहीं जोड़ा गया।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध रखी गई है। 'अपने आपको अशुद्ध', 'घिनौनी वस्तुएँ', 'निवास-स्थान' और वाचा-सूत्र मूल के धार्मिक तथा नैतिक आयामों को बिना अत्यधिक संस्कृतनिष्ठ हुए सुरक्षित रखते हैं। सभी पादटिप्पणी-चिह्न मुख्य पाठ में अपने संबंधित पदों पर दिए गए हैं।
