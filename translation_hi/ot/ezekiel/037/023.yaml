base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/037/023.yaml
  text: They will no longer defile themselves with their idols[a], with their detestable things, or with any of their transgressions. I will save them from all their dwelling places in which they sinned, and I will cleanse them. Then they will be my people[b], and I will be their God.
translation:
  language: hi
  text: वे फिर अपनी मूर्तियों[a], अपनी घिनौनी वस्तुओं या अपने किसी भी अपराध के कारण अपने आपको अशुद्ध नहीं करेंगे। मैं उन्हें उनके सभी निवास-स्थानों से बचाऊँगा, जहाँ उन्होंने पाप किया[b], और मैं उन्हें शुद्ध करूँगा। तब वे मेरी प्रजा होंगे और मैं उनका परमेश्वर होऊँगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ “मूर्तियों” के लिए प्रयुक्त इब्रानी शब्द झूठे देवताओं के प्रति तीव्र तिरस्कार प्रकट करता है।
    reason: lexical_alternative
  - marker: b
    text: या, “उनकी सभी बस्तियों से, जहाँ उन्होंने पाप किया।” यह इब्रानी वाक्यांश कठिन है; कुछ लोग इसे अधिक व्यापक अर्थ में पाप से जुड़े सभी स्थानों या परिस्थितियों से छुड़ाया जाना समझते हैं।
    reason: alternative_reading
lexical_decisions:
- source_word: יִטַמְּאוּ
  choice: अपने आपको अशुद्ध नहीं करेंगे
  rationale: हित्पएल रूप आत्म-संबंधी क्रिया व्यक्त करता है। यह अनुवाद नैतिक और उपासना-संबंधी अशुद्धता, दोनों का भाव बनाए रखता है।
