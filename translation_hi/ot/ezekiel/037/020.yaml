lexical_decisions:
- source_word: וְהָיוּ
  choice: और ... रहेंगी
  rationale: संयोजक वाव के साथ प्रयुक्त पूर्ण क्रिया यहाँ भविष्यसूचक निर्देश के परिणाम को व्यक्त करती है। वस्तुओं के हाथ में बने रहने और सबको दिखाई देने के भाव के लिए ‘रहेंगी’ स्वाभाविक है।
- source_word: הָעֵצִים
  choice: लकड़ियाँ
  rationale: עֵץ का अर्थ पेड़, लकड़ी या लकड़ी का टुकड़ा हो सकता है। इस प्रतीकात्मक कार्य में यह लिखे और हाथ में पकड़े जाने वाले लकड़ी के टुकड़ों को दर्शाता है; ‘लकड़ियाँ’ संक्षिप्त और स्वाभाविक है।
- source_word: אֲשֶׁר תִּכְתֹּב עֲלֵיהֶם
  choice: जिन लकड़ियों पर तुम लिखोगे
  rationale: यह संबंधवाचक उपवाक्य लकड़ियों को विशेषित करता है और עַל के ‘पर’ अर्थ को स्पष्ट रूप से बनाए रखता है।
- source_word: בְּיָדְךָ
  choice: तुम्हारे हाथ में
  rationale: इब्रानी में ‘हाथ’ एकवचन है और यहाँ माध्यम नहीं, बल्कि वस्तुओं को सचमुच हाथ में रखने का भाव है।
- source_word: לְעֵינֵיהֶם
  choice: उनकी आँखों के सामने
  rationale: यह इब्रानी मुहावरे की दृश्यात्मकता बनाए रखते हुए खुले तौर पर उनकी दृष्टि में प्रदर्शित किए जाने का अर्थ देता है।
