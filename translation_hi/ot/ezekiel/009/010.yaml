  text: וְ/גַ֨ם אֲנִ֔י לֹא תָח֥וֹס עֵינִ֖/י וְ/לֹ֣א אֶחְמֹ֑ל דַּרְכָּ֖/ם בְּ/רֹאשָׁ֥/ם נָתָֽתִּי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/009/010.yaml
  text: And as for me[a], my eye will not spare, nor will I show pity[b]; I have brought their way upon their heads.
translation:
  language: hi
  text: और जहाँ तक मेरी बात है, मेरी आँख न तो तरस खाएगी, न मैं दया करूँगा; मैंने उनके व्यवहार[a] को उनके ही सिर पर डाल दिया है[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, ‘उनका मार्ग’; हिब्रू में यह जीवन-व्यवहार या आचरण के लिए प्रयुक्त मुहावरा है।
    reason: lexical_alternative
  - marker: b
    text: ‘सिर पर डालना’ हिब्रू अभिव्यक्ति है, जो उनके व्यवहार का प्रतिफल उन्हीं पर आने को दर्शाती है।
    reason: cultural_note
lexical_decisions:
- source_word: וְגַם אֲנִי
  choice: और जहाँ तक मेरी बात है
  rationale: संयोजक, योगसूचक बल और स्वतंत्र सर्वनाम के जोर को स्वाभाविक हिन्दी में व्यक्त करता है; परमेश्वर के अपने न्यायकारी संकल्प पर बल बना रहता है।
- source_word: לֹא תָחוֹס עֵינִי
  choice: मेरी आँख न तो तरस खाएगी
  rationale: हिब्रू के मूर्त मुहावरे ‘मेरी आँख’ को बनाए रखते हुए दया न करने का आशय स्पष्ट करता है।
- source_word: וְלֹא אֶחְמֹל
  choice: न मैं दया करूँगा
  rationale: पहले खंड के समानांतर करुणा रोकने की घोषणा को स्पष्ट रखता है, पर अनावश्यक शब्द-दोहराव से बचता है।
- source_word: דַּרְכָּם
  choice: उनके चालचलन
  rationale: एकवचन ‘उनका मार्ग’ यहाँ जीवन-व्यवहार का मुहावरा है; ‘चालचलन’ आधुनिक पाठक के लिए नैतिक व्यवहार का अर्थ सीधे पहुँचाता है।
- source_word: בְּרֹאשָׁם נָתָתִּי
  choice: का फल उन्हीं के सिर पर डालूँगा
  rationale: प्रतिफल के दोषियों पर लौटने की हिब्रू छवि को ‘सिर पर’ के द्वारा सुरक्षित रखता है; हिन्दी में अर्थ स्पष्ट करने के लिए ‘फल’ जोड़ा गया है। हिब्रू पूर्ण क्रिया को प्रसंगानुसार निश्चित भावी न्याय के रूप में व्यक्त किया गया है।
theological_decisions:
- issue: ईश्वरीय न्याय और दया का रोका जाना
  choice: परमेश्वर की ओर से न बख्शने और दया न करने की कठोर घोषणा को बिना नरम किए रखा गया है।
  alternative: इसे अधिक व्याख्यात्मक रूप में ‘मैं उनके कर्मों के परिणाम उन्हीं को भुगताऊँगा’ कहा जा सकता था।
  rationale: मूल पाठ न्याय की गंभीरता और करुणा रोकने की घोषणा को साथ रखता है; अनुवाद किसी अतिरिक्त सिद्धान्त से इसे समझाता या हल्का नहीं करता।
- issue: נָתָתִּי का कालगत मूल्य
  choice: डालूँगा
  alternative: मैंने डाल दिया है
  rationale: रूप पूर्ण है, पर भविष्य के न्याय की निश्चयात्मक घोषणा वाले प्रसंग में हिन्दी का भविष्यकाल स्वाभाविक है। पूर्णता का शाब्दिक भूतकाल भी संभव है, इसलिए इस तनाव को निर्णय-टिप्पणी में दर्ज किया गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘मेरी आँख’ और ‘सिर पर’ जैसी मूल हिब्रू छवियाँ सुरक्षित हैं, जबकि ‘चालचलन’ और ‘फल’ अर्थ को स्वाभाविक हिन्दी में स्पष्ट करते हैं।
