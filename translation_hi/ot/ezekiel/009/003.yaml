  text: וּ/כְב֣וֹד אֱלֹהֵ֣י יִשְׂרָאֵ֗ל נַעֲלָה֙ מֵ/עַ֤ל הַ/כְּרוּב֙ אֲשֶׁ֣ר הָיָ֣ה עָלָ֔י/ו אֶ֖ל מִפְתַּ֣ן הַ/בָּ֑יִת וַ/יִּקְרָ֗א אֶל הָ/אִישׁ֙ הַ/לָּבֻ֣שׁ הַ/בַּדִּ֔ים אֲשֶׁ֛ר קֶ֥סֶת הַ/סֹּפֵ֖ר בְּ/מָתְנָֽי/ו׀־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/009/003.yaml
  text: And the glory of the God of Israel went up from above the cherub on which it had been[a], to the threshold of the house. And he called to the man clothed in linen[c][b], who had the scribe’s writing case at his waist.
translation:
  language: hi
  text: इस्राएल के परमेश्वर की महिमा उस करूब के ऊपर से, जिस पर वह थी, उठकर भवन की देहरी तक गई। और उसने[a] सन के वस्त्र पहने हुए उस पुरुष को पुकारा, जिसकी कमर पर लिपिक की लेखन-पेटी[b] थी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: हिब्रू में ‘महिमा’ को कर्ता मानकर ‘महिमा ने पुकारा’ भी अनुवाद किया जा सकता है; संदर्भ में व्यक्तिगत ईश्वरीय कर्तृत्व का भाव है।
    reason: alternative_reading
  - marker: b
    text: या “लिपिक की दवात”; हिब्रू शब्द लेखन-सामग्री रखने के पात्र को सूचित कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כְבוֹד אֱלֹהֵי יִשְׂרָאֵל
  choice: इस्राएल के परमेश्वर की महिमा
  rationale: כְבוֹד का मानक और संदर्भानुकूल अनुवाद ‘महिमा’ है; यह यहेजकेल के दर्शन में परमेश्वर की प्रकट उपस्थिति को व्यक्त करता है, जबकि संबंधवाचक पदबंध को यथावत रखा गया है।
- source_word: נַעֲלָה מֵעַל
  choice: के ऊपर से ... उठकर ... आ गई
  rationale: עלה में ऊपर उठने या चढ़ने की स्थानिक गति है और מֵעַל आरंभिक स्थिति ‘के ऊपर से’ बताता है। हिंदी में गंतव्य के साथ ‘उठकर ... आ गई’ स्वाभाविक है।
- source_word: הַכְּרוּב
  choice: उस करूब
  rationale: मूल रूप एकवचन है; इसलिए बहुवचन ‘करूबों’ के बजाय ‘करूब’ रखा गया है। निश्चयवाचकता और आगे के संबंधवाक्य के कारण ‘उस’ स्वाभाविक है।
- source_word: אֲשֶׁר הָיָה עָלָיו
  choice: जिस पर वह ठहरी हुई थी
  rationale: यह संबंधवाक्य महिमा की पहले की स्थिति बताता है। ‘ठहरी हुई थी’ हिंदी में स्थिर उपस्थिति को स्वाभाविक ढंग से व्यक्त करता है, यद्यपि मूल क्रिया सामान्यतः ‘होना’ है।
- source_word: מִפְתַּן הַבָּיִת
  choice: भवन की देहरी
  rationale: מִפְתָּן के लिए ‘देहरी’ और בַּיִת के लिए शाब्दिक ‘भवन’ चुना गया है। मंदिर का संदर्भ स्पष्ट है, पर मुख्य पाठ में ‘मंदिर’ जोड़कर अर्थ को संकरा नहीं किया गया।
- source_word: הַלָּבֻשׁ הַבַּדִּים
  choice: मलमल के वस्त्र पहने
  rationale: בַּדִּים यहाँ महीन सन के वस्त्रों को दर्शाता है। ‘मलमल के वस्त्र’ आधुनिक हिंदी में सहज और विशिष्ट है तथा केवल सामान्य ‘सफेद वस्त्र’ जैसी व्याख्या नहीं जोड़ता।
- source_word: קֶסֶת הַסֹּפֵר
  choice: लेखक की दवात
  rationale: קֶסֶת लेखन के लिए स्याही रखने वाले पात्र या लेखन-सामग्री की पेटी को सूचित कर सकता है। ‘दवात’ संक्षिप्त और सुबोध है; वैकल्पिक व्यापक अर्थ पादटिप्पणी में दिया गया है।
- source_word: בְּמָתְנָיו
  choice: जिसकी कमर पर ... बँधी थी
  rationale: מָתְנַיִם का प्रसंगानुकूल आधुनिक हिंदी रूप ‘कमर’ है। ‘बँधी थी’ रखने/धारण करने की व्यावहारिक स्थिति स्पष्ट करता है।
theological_decisions:
- issue: 'וַיִּקְרָא का कर्ता: ‘महिमा’ या उसमें व्यक्तिगत रूप से कार्यरत परमेश्वर'
  choice: और उसने ... पुकारा
  alternative: और महिमा ने ... पुकारा / और परमेश्वर ने ... पुकारा
  rationale: मूल में पुल्लिंग एकवचन क्रिया है और निकटतम व्याकरणिक पूर्वपद ‘महिमा’ है, जो स्वयं भी पुल्लिंग है। हिंदी ‘उसने’ इस संदर्भ को बनाए रखते हुए व्यक्तिगत कर्तृत्व व्यक्त करता है, पर मूल में अनुपस्थित ‘परमेश्वर ने’ दोहराकर अस्पष्टता को पूरी तरह समाप्त नहीं करता।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और कथात्मक हिंदी। ‘करूब’ जैसे स्थापित बाइबलीय पद को रखा गया है। वाक्य में दृश्य की स्थानिक गति स्पष्ट की गई है और मूल की कर्ता-संबंधी सूक्ष्म अस्पष्टता ‘उसने’ के द्वारा सुरक्षित रखी गई है।
