source:
  edition: WLC
  text: וּ/לְ/אֵ֨לֶּה֙ אָמַ֣ר בְּ/אָזְנַ֔/י עִבְר֥וּ בָ/עִ֛יר אַחֲרָ֖י/ו וְ/הַכּ֑וּ על תָּחֹ֥ס עיני/כם וְ/אַל תַּחְמֹֽלוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/009/005.yaml
  text: And to the others he said in my hearing[a], “Pass through the city after him and strike; do not let your eye spare, and do not show pity.”
translation:
  language: hi
  text: और उसने दूसरों से मेरे सुनते हुए कहा, “उसके पीछे नगर में से होकर जाओ और मारो। तुम्हारी आँख तरस न खाए और करुणा न दिखाओ।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּלְאֵלֶּה
  choice: और दूसरों से
  rationale: संदर्भ में ये सन के वस्त्र पहने पुरुष से अलग शेष दण्ड देने वाले हैं; ‘दूसरों’ से यह विरोध स्वाभाविक हिन्दी में स्पष्ट होता है।
- source_word: אָמַר בְּאָזְנַי
  choice: उसने मेरे सुनते हुए कहा
  rationale: इब्रानी मुहावरे ‘मेरे कानों में’ का आशय है कि नबी ने वचन प्रत्यक्ष सुना; यह रूप उस अर्थ को सहज हिन्दी में रखता है।
- source_word: עִבְרוּ בָעִיר אַחֲרָיו
  choice: उसके पीछे नगर में से होकर जाओ
  rationale: आज्ञा उस पहले बताए गए पुरुष के पीछे-पीछे नगर से होकर जाने की है; शब्दक्रम को स्वाभाविक हिन्दी के अनुरूप रखा गया है।
- source_word: וְהַכּוּ
  choice: और मारो
  rationale: נכה का अर्थ प्रहार करना अथवा मार गिराना हो सकता है। इस न्याय-दृश्य में ‘मारो’ आदेश की कठोरता बनाए रखता है, पर ‘मार डालो’ कहकर क्रिया को अनावश्यक रूप से अधिक संकीर्ण नहीं करता।
- source_word: עַל תָּחֹס עֵינֵיכֶם
  choice: तुम्हारी आँख दया न करे
  rationale: यह दया करके किसी को छोड़ न देने का सजीव इब्रानी मुहावरा है। शाब्दिक छवि हिन्दी में भी समझी जा सकती है और पादटिप्पणी उसका आशय स्पष्ट करती है।
- source_word: וְאַל תַּחְמֹלוּ
  choice: और करुणा न दिखाओ
  rationale: חמל पिछले निषेध के समानार्थक होते हुए करुणा न करने पर बल देता है; अलग अभिव्यक्ति इब्रानी समानांतरता को सपाट होने से बचाती है।
theological_decisions:
- issue: न्याय की आज्ञा की कठोरता
  choice: हिंसा को नरम किए बिना कठोर दैवी न्याय की आज्ञा के रूप में अनुवाद
  alternative: आज्ञा की हिंसक तीव्रता घटाने वाला व्यंजनापूर्ण अनुवाद
  rationale: इब्रानी पाठ न्याय को अत्यन्त कठोर रूप में प्रस्तुत करता है। अनुवाद को इस धर्मवैचारिक तनाव को बनाए रखना चाहिए, न कि अतिरिक्त व्याख्या जोड़कर उसे कम करना चाहिए।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण और सीधी आज्ञार्थक शैली रखी गई है। ‘तुम्हारी आँख दया न करे’ की स्रोत-भाषायी छवि को सुरक्षित रखते हुए पादटिप्पणी से उसका मुहावरेदार अर्थ बताया गया है।
