source:
  edition: WLC
  text: וַ/יִּקְרָ֣א בְ/אָזְנַ֗/י ק֤וֹל גָּדוֹל֙ לֵ/אמֹ֔ר קָרְב֖וּ פְּקֻדּ֣וֹת הָ/עִ֑יר וְ/אִ֛ישׁ כְּלִ֥י מַשְׁחֵת֖/וֹ בְּ/יָדֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/009/001.yaml
  text: Then he cried out in my ears with a loud voice[a], saying, “Draw near, you executioners of the city[b], each with his weapon of destruction in his hand.”
translation:
  language: hi
  text: तब उसने मेरे कानों में ऊँचे स्वर से पुकारकर कहा, “नगर पर नियुक्त लोगो[a], निकट आओ—हर एक अपने हाथ में विनाश का हथियार लिए हुए[b]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इस कठिन इब्रानी पद का अर्थ “नगर के निरीक्षको,” “नगर के लिए नियुक्त जनो,” या इस प्रसंग में “नगर को दण्ड देने वालों” भी हो सकता है।
    reason: alternative_reading
  - marker: b
    text: 'इब्रानी में शाब्दिक रूप से: “और प्रत्येक पुरुष के हाथ में उसका विनाशकारी साधन।”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: उसने ... पुकारकर कहा
  rationale: क्रिया का मूल अर्थ ‘पुकारना’ है; ‘ऊँचे स्वर से’ के साथ यह बलपूर्वक पुकारने का भाव स्वाभाविक रूप से व्यक्त करता है। कर्ता पूर्ववर्ती प्रसंग से लिया गया है।
- source_word: בְאָזְנַי
  choice: मेरे कानों में
  rationale: इब्रानी की सजीव देहात्मक अभिव्यक्ति को सुरक्षित रखता है और आधुनिक हिन्दी में स्पष्ट है।
- source_word: קוֹל גָּדוֹל
  choice: ऊँचे स्वर से
  rationale: शाब्दिक ‘बड़े स्वर’ के बजाय यही आधुनिक हिन्दी में तेज आवाज़ का स्वाभाविक और गरिमापूर्ण रूप है।
- source_word: קָרְבוּ
  choice: निकट आओ
  rationale: बहुवचन आज्ञार्थक क्रिया का औपचारिक किंतु सहज हिन्दी रूप।
- source_word: פְּקֻדּוֹת הָעִיר
  choice: नगर पर नियुक्त जनो
  rationale: פקד से बने कठिन पद में नियुक्ति, देखरेख और न्यायपूर्ण निरीक्षण/दण्ड की अर्थ-छायाएँ हैं। यह अनुवाद व्यक्तियों को संबोधन मानता है, पर उन्हें सीधे ‘जल्लाद’ कहकर अर्थ को संकीर्ण नहीं करता।
- source_word: וְאִישׁ
  choice: हर एक
  rationale: एकवचन ‘पुरुष’ यहाँ वितरणात्मक है; ‘हर एक’ स्वाभाविक हिन्दी में वही भाव देता है।
- source_word: כְּלִי מַשְׁחֵתוֹ
  choice: विनाश का हथियार
  rationale: כְּלִי सामान्यतः साधन या उपकरण है, पर न्याय के इस प्रसंग में ‘हथियार’ स्पष्ट है; מַשְׁחֵת विनाशकारी प्रयोजन बताता है।
- source_word: בְּיָדוֹ
  choice: अपने हाथ में
  rationale: वितरणात्मक ‘हर एक’ के साथ एकवचन और सजीव चित्र दोनों सुरक्षित रहते हैं।
theological_decisions:
- issue: פְּקֻדּוֹת הָעִיר का न्याय-संबंधी अर्थ
  choice: नगर पर नियुक्त जनो
  alternative: नगर को दण्ड देनेवालो / नगर के निरीक्षको
  rationale: आगे का प्रसंग इन व्यक्तियों को विनाशकारी न्याय के कार्यकर्ता दिखाता है, किंतु स्वयं यह पद नियुक्ति, निरीक्षण अथवा दण्डात्मक ‘भेंट’ की व्यापक अर्थ-सीमा रखता है। मुख्य पाठ उनकी नियुक्त भूमिका को रखता है और पादटिप्पणी न्याय-संबंधी संभावना स्पष्ट करती है; किसी विशिष्ट स्वर्गदूतीय श्रेणी को आरोपित नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, श्रव्य और सामान्य पाठक के लिए सुबोध रूप। ‘मेरे कानों में’ मूल की सजीवता बनाए रखता है। संबोधन में ‘जनो’ पद की अनिश्चितता को सुरक्षित रखता है, जबकि पादटिप्पणी उसके न्याय-संबंधी संदर्भ को बताती है।
