base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/009/002.yaml
  text: And behold[a], six men were coming from the direction of the upper gate, which faces north, each with his weapon for smashing in his hand; and one man among them was clothed in linen, with a scribe’s writing case at his waist[b]. And they came and stood beside the bronze altar.
translation:
  language: hi
  text: और देखो, छह पुरुष उस ऊपरी फाटक की दिशा से आ रहे थे जिसका मुख उत्तर की ओर था। हर एक के हाथ में चकनाचूर करने का हथियार[a] था। उनके बीच एक पुरुष लिनन के वस्त्र पहने हुए था और उसकी कमर पर लेखक की लेखन-पेटी[b] थी। वे आकर काँसे की वेदी के पास खड़े हो गए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “नाश करने का हथियार।” इब्रानी शब्द तोड़ने या चकनाचूर करने के साधन को दर्शाता है, पर यह ठीक किस प्रकार का हथियार था, यह निश्चित नहीं है।
    reason: lexical_alternative
  - marker: b
    text: 'परंपरागत अनुवाद: “लेखक की दवात।”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  choice: और देखो
  rationale: दर्शन में अचानक सामने आए दृश्य की जीवंतता बनाए रखता है; आधुनिक हिन्दी में समझने योग्य रहते हुए भविष्यद्वाणी के गरिमापूर्ण स्वर के अनुकूल है।
- source_word: שִׁשָּׁה אֲנָשִׁים
  choice: छः पुरुष
  rationale: इब्रानी का स्पष्ट पुल्लिंग बहुवचन सुरक्षित रहता है और दर्शन में दिखाई देने वाले मानव-सदृश पात्रों से आगे उनकी प्रकृति निर्धारित नहीं की जाती।
- source_word: בָּאִים מִדֶּרֶךְ שַׁעַר הָעֶלְיוֹן
  choice: उस ऊपरी फाटक की दिशा से आ रहे थे
  rationale: कृदन्त की जारी क्रिया और आगमन की दिशा, दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: אֲשֶׁר מָפְנֶה צָפוֹנָה
  choice: जिसका मुख उत्तर की ओर था
  rationale: फाटक की दिशा का स्पष्ट और स्वाभाविक वर्णन है।
- source_word: וְאִישׁ כְּלִי מַפָּצוֹ בְּיָדוֹ
  choice: हर एक के हाथ में चकनाचूर करने का हथियार था
  rationale: מַפָּץ के तोड़ने या चूर करने के अर्थ को रखता है, पर हथियार का अनिश्चित प्रकार मनमाने ढंग से निर्दिष्ट नहीं करता।
- source_word: וְאִישׁ אֶחָד בְּתוֹכָם
  choice: उनके बीच एक पुरुष
  rationale: समूह के भीतर उसकी स्थिति को सीधे और सहज ढंग से व्यक्त करता है।
- source_word: לָבֻשׁ בַּדִּים
  choice: सन के वस्त्र पहने हुए था
  rationale: בַּדִּים को वस्त्र-सामग्री के रूप में स्पष्ट करता है और पौरोहित्य-संबंधी अर्थ को अनावश्यक रूप से पाठ में नहीं जोड़ता।
- source_word: וְקֶסֶת הַסֹּפֵר בְּמָתְנָיו
  choice: उसकी कमर पर लेखक की लिखने की डिबिया बँधी थी
  rationale: किसी लेखक की लेखन-सामग्री रखने वाले पात्र का भाव आधुनिक, सहज हिन्दी में देता है; पारंपरिक 'दवात' को पाठ में निश्चित नहीं करता।
- source_word: וַיָּבֹאוּ וַיַּעַמְדוּ אֵצֶל מִזְבַּח הַנְּחֹשֶׁת
  choice: वे आकर काँसे की वेदी के पास खड़े हो गए
  rationale: क्रमिक क्रियाओं और स्थान को संक्षिप्त, स्वाभाविक हिन्दी में सुरक्षित रखता है।
theological_decisions:
- issue: छः पुरुषों और सन के वस्त्र पहने पुरुष की पहचान और प्रकृति
  choice: दर्शन में दिखाई देने के अनुसार उन्हें 'पुरुष' कहा गया है।
  alternative: उन्हें अनुवाद में विनाश करने वाले स्वर्गदूत और स्वर्गदूतीय लेखक कहना।
  rationale: इब्रानी पाठ उन्हें पुरुषों के रूप में प्रस्तुत करता है। व्यापक प्रसंग उनके स्वर्गीय दूत होने का संकेत दे सकता है, पर अनुवाद उनकी पहचान को पाठ से अधिक निश्चित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज शैली रखी गई है। दृश्य की आकस्मिकता के लिए “और देखो” तथा वास्तु और उपासना-संबंधी शब्दों के लिए “ऊपरी फाटक,” “काँसे की वेदी” जैसे परिचित पद चुने गए हैं।
