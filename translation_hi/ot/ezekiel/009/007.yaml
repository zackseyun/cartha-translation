base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/009/007.yaml
  text: And he said to them[a], “Defile the house, and fill the courts with the slain[b]. Go out.” So they went out and struck down people in the city.
translation:
  language: hi
  text: तब उसने उनसे कहा, “भवन[a] को अशुद्ध कर दो और आँगनों को मारे गए लोगों[b] से भर दो। बाहर निकलो।” तब वे बाहर निकले और नगर में लोगों को मार गिराया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात् मंदिर। इब्रानी में शाब्दिक रूप से “भवन” या “घर”।
    reason: lexical_alternative
  - marker: b
    text: या “आँगनों को लाशों से भर दो।”
    reason: lexical_alternative
lexical_decisions:
- source_word: טַמְּאוּ
  choice: अशुद्ध कर दो
  rationale: पिएल आज्ञार्थक यहाँ उपासना-स्थान को विधिवत अशुद्ध करने की तीखी आज्ञा देता है। ‘अशुद्ध कर दो’ आधुनिक हिन्दी में स्वाभाविक है और धार्मिक अशुद्धता का भाव बनाए रखता है।
- source_word: הַבַּיִת
  choice: इस भवन
  rationale: इब्रानी में शाब्दिक अर्थ ‘भवन/घर’ है और प्रसंग में संकेत मंदिर की ओर है। ‘इस भवन’ मूल रूपक को रखता है, जबकि पादटिप्पणी संदर्भ स्पष्ट करती है।
- source_word: הַחֲצֵרוֹת
  choice: आँगनों
  rationale: यह मंदिर-परिसर के आँगनों को सूचित करता है। ‘आँगन’ सामान्य आधुनिक हिन्दी में स्पष्ट और स्थापत्य-संदर्भ के अनुकूल है।
- source_word: חֲלָלִים
  choice: मारे हुओं
  rationale: संज्ञा हिंसा से मारे गए लोगों को दर्शाती है। यह अनुवाद मूल की गंभीरता और व्यक्तिवाचकता बचाता है; ‘लाशों’ का ठोस अर्थ पादटिप्पणी में दिया गया है।
- source_word: צֵאוּ
  choice: बाहर निकलो
  rationale: यह मंदिर-क्षेत्र से नगर की ओर जाने की सीधी बहुवचन आज्ञा है।
- source_word: וְיָצְאוּ
  choice: तब वे बाहर निकले
  rationale: वाव कथा की अगली घटना को आगे बढ़ाता है; ‘तब’ क्रम को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וְהִכּוּ
  choice: लोगों को मारने लगे
  rationale: נכה इस न्याय-दृश्य में प्राणघातक प्रहार को दर्शाता है। इब्रानी में कर्म निहित है; हिन्दी में ‘लोगों को’ प्रसंगानुसार आवश्यक पूर्ति है। ‘मारने लगे’ अनुवर्ती गतिविधि को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: בָעִיר
  choice: नगर में
  rationale: यह सीधा स्थानवाचक पद है; ‘नगर भर में’ कहने से वितरण का भाव अनावश्यक रूप से बढ़ जाता।
theological_decisions:
- issue: मंदिर-परिसर को अशुद्ध करने की आज्ञा
  choice: आज्ञा को सीधे ‘इस भवन को अशुद्ध कर दो’ के रूप में रखना
  alternative: इसे नरम करके ‘इस भवन को अपवित्र होने दो’ या केवल परिणाम के रूप में कहना
  rationale: दर्शन में वक्ता स्वयं न्याय की आज्ञा देता है, जिसका परिणाम मंदिर की धार्मिक अशुद्धता है। मूल पाठ के चौंकाने वाले धार्मिक तनाव को नरम नहीं किया गया।
- issue: הַבַּיִת का संदर्भ
  choice: मुख्य पाठ में ‘इस भवन’ रखकर पादटिप्पणी में ‘मंदिर’ स्पष्ट करना
  alternative: मुख्य पाठ में सीधे ‘मंदिर’ कहना
  rationale: इब्रानी की शाब्दिक छवि को बनाए रखते हुए संदर्भगत अर्थ पाठक को उपलब्ध कराया गया है; इससे अर्थ स्पष्ट होता है पर व्याख्या मूल पाठ का स्थान नहीं लेती।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सीधी रखी गई है। ‘अशुद्ध’ धार्मिक-सांस्कारिक संदर्भ को व्यक्त करता है, ‘अपवित्र’ की अपेक्षा मूल טמא के शुद्ध-अशुद्ध आयाम के अधिक निकट है। ‘नगर’ वर्णनात्मक-बाइबलीय गरिमा बनाए रखता है, जबकि वाक्य-विन्यास सामान्य हिन्दी पाठक के लिए सरल है।
