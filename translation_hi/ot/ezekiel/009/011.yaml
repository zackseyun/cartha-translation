  text: And behold[a], the man clothed in linen, who had the writing case at his waist, brought back word, saying, “I have done as you commanded me.”
translation:
  language: hi
  text: 'और देखो, सन के वस्त्र पहने हुए वह पुरुष, जिसकी कमर पर लेखन-सामग्री की पेटी थी, यह सूचना दे रहा था: “जैसा तुमने मुझे आज्ञा दी थी, मैंने वैसा ही किया है।”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהִנֵּה
  choice: और देखो
  rationale: यह भविष्यद्वाणी के वर्णन में अचानक ध्यान खींचने वाला संकेत है। ‘और देखो’ इसकी सजीवता बनाए रखता है और आधुनिक हिन्दी में स्वाभाविक है।
- source_word: הָאִישׁ
  choice: उस पुरुष
  rationale: इब्रानी पद पुल्लिंग एकवचन है और पहले से परिचित व्यक्ति की ओर संकेत करता है; ‘उस पुरुष’ संदर्भगत निश्चितता को व्यक्त करता है।
- source_word: לְבֻשׁ הַבַּדִּים
  choice: मलमल के वस्त्र पहने हुए
  rationale: בַּדִּים यहाँ सन से बने महीन वस्त्र का संकेत देता है। ‘मलमल के वस्त्र’ हिन्दी बाइबलीय प्रयोग में परिचित है और परिधान का वर्णन बिना उस व्यक्ति की पहचान निर्धारित किए करता है।
- source_word: הַקֶּסֶת
  choice: लिखने की सामग्री की डिबिया
  rationale: यह शब्द लेखक द्वारा कमर पर रखे जाने वाले स्याही अथवा लेखन-सामग्री के पात्र को दर्शाता है। यह चयन आधुनिक पाठक को वस्तु का कार्य स्पष्ट करता है, पर उसे केवल ‘दवात’ तक सीमित नहीं करता।
- source_word: בְּמָתְנָיו
  choice: जिसकी कमर पर
  rationale: ‘कमर पर’ शरीर पर वस्तु के स्थान को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: מֵשִׁיב דָּבָר
  choice: लौटकर यह समाचार दिया
  rationale: यह पदबंध उत्तर अथवा कार्य-समाप्ति का प्रतिवेदन वापस देने का भाव रखता है। चयन में लौटकर सूचना देने का आशय सुरक्षित है।
- source_word: לֵאמֹר
  choice: प्रत्यक्ष कथन के रूप में प्रस्तुत
  rationale: हिन्दी में ‘समाचार दिया’ के बाद सीधे उद्धरण से לֵאמֹר का कथन-परिचायक कार्य स्वाभाविक रूप से व्यक्त हो जाता है; अलग से ‘कहते हुए’ जोड़ना बोझिल होता।
- source_word: עָשִׂיתִי
  choice: मैंने ... किया है
  rationale: पूर्ण की गई आज्ञा के वर्तमान प्रतिवेदन का भाव हिन्दी के पूर्णकाल ‘किया है’ से स्पष्ट होता है।
- source_word: כַאֲשֶׁר צִוִּיתָנִי
  choice: जैसा आपने मुझे आदेश दिया था ... वैसा ही
  rationale: यह आज्ञा के ठीक अनुरूप कार्य करने का भाव स्वाभाविक हिन्दी तुलना-संरचना में सुरक्षित रखता है।
theological_decisions:
- issue: मलमल के वस्त्र पहने व्यक्ति का स्वरूप
  choice: केवल ‘मलमल के वस्त्र पहने हुए उस पुरुष’ के रूप में वर्णन
  alternative: उसे स्वर्गदूत, याजकीय व्यक्ति अथवा ईश्वरीय प्राकट्य के रूप में पहचानना
  rationale: यह पद उसके रूप और कार्य का वर्णन करता है, पर उसके तात्त्विक स्वरूप की स्पष्ट पहचान नहीं करता। अधिक विशिष्ट उपाधि देना पाठ से परे व्याख्या जोड़ता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य हिन्दी पाठक के लिए स्पष्ट रखी गई है। वाक्य में मूल इब्रानी की प्रतिवेदनात्मक संरचना और अचानक ध्यान आकर्षित करने वाला आरंभ सुरक्षित है। सम्मानसूचक ‘आपने’ उस संबोधित दिव्य वक्ता के लिए स्वाभाविक हिन्दी प्रयोग है, बिना कोई अतिरिक्त उपाधि जोड़े।
