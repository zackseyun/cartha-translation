source:
  edition: WLC
  text: וַֽ/יְהִי֙ כְּ/הַכּוֹתָ֔/ם וְ/נֵֽאשֲׁאַ֖ר אָ֑נִי וָ/אֶפְּלָ֨/ה עַל פָּנַ֜/י וָ/אֶזְעַ֗ק וָֽ/אֹמַר֙ אֲהָהּ֙ אֲדֹנָ֣/י יְהוִ֔ה הֲ/מַשְׁחִ֣ית אַתָּ֗ה אֵ֚ת כָּל שְׁאֵרִ֣ית יִשְׂרָאֵ֔ל בְּ/שָׁפְכְּ/ךָ֥ אֶת חֲמָתְ/ךָ֖ עַל יְרוּשָׁלִָֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/009/008.yaml
  text: And it happened, while they were striking them down, and I alone was left, that I fell on my face and cried out, and I said, “Ah, Lord GOD, will you destroy all the remnant of Israel as you pour out your wrath on Jerusalem?”
translation:
  language: hi
  text: जब वे उन्हें मार रहे थे और केवल मैं ही बचा रह गया, तब मैं मुँह के बल गिर पड़ा और पुकारकर कहने लगा, “हाय, प्रभु यहोवा! क्या आप यरूशलेम पर अपना क्रोध उँडेलते हुए इस्राएल के बचे हुए सभी लोगों को नष्ट कर देंगे?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כְּהַכּוֹתָם
  choice: जब वे उन्हें मार रहे थे
  rationale: הכה का यहाँ संदर्भ प्राणघातक प्रहार से है; यह अनुवाद चल रही कार्रवाई को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וְנֵאשֲאַר אָנִי
  choice: और केवल मैं ही बचा रह गया
  rationale: क्रिया का निष्क्रिय भाव और सर्वनाम אָנִי पर बल दोनों सुरक्षित रखे गए हैं।
- source_word: אֲדֹנָי יְהוִה
  choice: प्रभु यहोवा
  rationale: ईश्वरीय उपाधि और व्यक्तिगत नाम के भेद को बनाए रखता है।
- source_word: שְׁאֵרִית יִשְׂרָאֵל
  choice: इस्राएल के बचे हुए सभी लोग
  rationale: שְׁאֵרִית का सामूहिक अर्थ सामान्य पाठक के लिए स्पष्ट करते हुए ‘सभी’ के व्यापक बल को सुरक्षित रखा गया है।
- source_word: בְּשָׁפְכְּךָ אֶת חֲמָתְךָ
  choice: अपना क्रोध उँडेलते हुए
  rationale: בְּ के साथ infinitive construct को समकालिक परिस्थिति के रूप में लिया गया है और ‘उँडेलना’ मूल रूपक को बनाए रखता है।
theological_decisions:
- issue: यहेजकेल के प्रश्न का स्वर
  choice: क्या आप ... नष्ट कर देंगे?
  alternative: क्या आप ... नष्ट कर रहे हैं?
  rationale: हिब्रू participle מַשְׁחִית आसन्न या चल रही विनाशकारी कार्रवाई को व्यक्त कर सकता है; भविष्याभिमुख हिन्दी प्रश्न नबी की भयभीत विनती को स्वाभाविक रूप से व्यक्त करता है, बिना उत्तर पूर्वनिर्धारित किए।
- issue: ‘शेष’ का स्वरूप
  choice: इस्राएल के बचे हुए सभी लोग
  alternative: इस्राएल का समूचा शेष भाग
  rationale: यहाँ ‘शेष’ को किसी निश्चित धर्मवैज्ञानिक वर्ग के रूप में सीमित नहीं किया गया; नबी की दृष्टि में बचे हुए समुदाय की व्यापकता बनी रहती है।
translation_notes:
  register: आधुनिक मानक हिन्दी; भाषा गरिमापूर्ण किंतु सहज है। कथन की क्रमिकता, नबी का अकेला बचना, उसका भूमि पर गिरना और उसकी व्याकुल पुकार स्पष्ट रखी गई है।
