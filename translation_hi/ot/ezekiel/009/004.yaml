base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/009/004.yaml
  text: And Yahweh said to him[a], “Pass through the midst of the city, through the midst of Jerusalem, and put a mark on the foreheads of the men who sigh and groan over all the abominations being done in her midst.”
translation:
  language: hi
  text: और याहवे ने उससे कहा, “नगर के बीच से—यरूशलेम के बीच से—होकर जा, और उन पुरुषों के माथों पर एक चिह्न[a] लगा दे, जो उसके भीतर किए जा रहे सभी घृणित कामों के कारण आहें भरते और कराहते हैं।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इब्रानी: ताव; संभवतः चिह्न के रूप में प्रयुक्त अक्षर ת की ओर संकेत है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के विशिष्ट इब्रानी नाम को उपाधि से बदलने के बजाय आधुनिक हिन्दी में लिप्यंतरित किया गया है।
- source_word: עֲבֹר
  choice: होकर जा
  rationale: आज्ञार्थक क्रिया नगर के भीतर से आगे बढ़ने का निर्देश देती है; यह हिन्दी में स्वाभाविक और स्पष्ट है।
- source_word: בְּתוֹךְ ... בְּתוֹךְ
  choice: नगर के बीच से, यरूशलेम के बीच से
  rationale: इब्रानी की पुनरुक्ति और उसके बल को बनाए रखा गया है।
- source_word: וְהִתְוִיתָ תָּו
  choice: एक चिह्न लगा दे
  rationale: क्रिया और संज्ञा मिलकर पहचान के लिए निशान लगाने का भाव देती हैं। תָּו के अक्षर-नाम होने की संभावना पादटिप्पणी में रखी गई है।
- source_word: מִצְחוֹת
  choice: माथों
  rationale: शरीर के इस अंग के लिए यह स्पष्ट और सामान्य आधुनिक हिन्दी शब्द है।
- source_word: הָאֲנָשִׁים
  choice: उन पुरुषों
  rationale: इब्रानी संज्ञा पुल्लिंग बहुवचन है; इसलिए इसके लिंग-सूचक अर्थ को सुरक्षित रखा गया है।
- source_word: הַנֶּאֱנָחִים וְהַנֶּאֱנָקִים
  choice: आहें भरते और कराहते हैं
  rationale: दोनों कृदंतों में व्यक्त दुःख की श्रव्य और अलग-अलग अभिव्यक्तियों को बनाए रखा गया है।
- source_word: עַל כָּל הַתּוֹעֵבוֹת
  choice: सभी घृणित कामों के कारण
  rationale: עַל यहाँ उन कार्यों को उनके दुःख का कारण बताता है; תּוֹעֵבוֹת की प्रबल नैतिक-धार्मिक निंदा को ‘घृणित काम’ स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: הַנַּעֲשׂוֹת
  choice: किए जा रहे
  rationale: निष्क्रिय कृदंत को जारी गतिविधि के रूप में व्यक्त किया गया है।
- source_word: בְּתוֹכָהּ
  choice: उसके बीच
  rationale: स्त्रीलिंग प्रत्यय नगर या यरूशलेम की ओर संकेत करता है; हिन्दी में ‘उसके’ संदर्भ को स्वाभाविक रूप से बनाए रखता है।
theological_decisions:
- issue: תָּו के अक्षर ‘ताव’ के रूप में संभावित प्रतीकात्मक अर्थ
  choice: मुख्य पाठ में कार्यात्मक रूप से ‘एक चिह्न’
  alternative: ‘एक ताव’ अथवा ‘ताव अक्षर’
  rationale: तात्कालिक संदर्भ में यह न्याय के समय लोगों को अलग पहचानने वाला चिह्न है। मुख्य पाठ में अक्षर का निश्चित उल्लेख करने से ऐसी प्रतीकात्मक व्याख्या जुड़ सकती है जिसे पद स्वयं स्पष्ट नहीं करता; शाब्दिक संभावना पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। इब्रानी की दोहरी ‘बीच से’ संरचना जानबूझकर सुरक्षित है। आज्ञा के एकवचन रूप को ‘जा’ और ‘लगा दे’ से व्यक्त किया गया है।
