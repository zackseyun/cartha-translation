base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/009/009.yaml
  text: Then he said to me[a], “The iniquity of the house of Israel and Judah is exceedingly great, and the land is filled with bloodshed, and the city is full of perversion. For they say, ‘Yahweh has forsaken the land, and Yahweh does not see.’”
translation:
  language: hi
  text: तब उसने मुझसे कहा, “इस्राएल और यहूदा के घराने का अधर्म बहुत ही बड़ा है। देश रक्तपात से भर गया है और नगर अन्याय[a] से भर गया है; क्योंकि वे कहते हैं, ‘याहवे ने देश को त्याग दिया है; याहवे नहीं देखता।’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “विकृति” अथवा “विकृत न्याय।” इब्रानी शब्द का अर्थ टेढ़ापन या सही बात को बिगाड़ना है और यहाँ सम्भवतः न्याय के विकृत किए जाने को भी समेटता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲוֺן
  choice: अधर्म
  rationale: यहाँ यह संज्ञा इस्राएल और यहूदा की नैतिक बुराई और दोष को समेटती है; प्रसंग में दण्ड के बजाय पापपूर्ण आचरण प्रमुख है।
- source_word: בֵּית יִשְׂרָאֵל וִיהוּדָה
  choice: इस्राएल और यहूदा का घराना
  rationale: सामूहिक वाचा-संबंधी अभिव्यक्ति ‘घराना’ को बनाए रखते हुए हिन्दी में दोनों समुदायों को एक संयुक्त पदबंध के रूप में प्रस्तुत करता है।
- source_word: גָּדוֹל בִּמְאֹד מְאֹד
  choice: अत्यन्त बढ़ गया है
  rationale: शाब्दिक रूप से अधर्म ‘बहुत ही बड़ा’ है; स्वाभाविक हिन्दी में ‘अत्यन्त बढ़ गया है’ उसकी चरम व्यापकता और गंभीरता व्यक्त करता है।
- source_word: דָּמִים
  choice: रक्तपात
  rationale: बहुवचन रूप यहाँ केवल भौतिक रक्त नहीं, हिंसक हत्याओं और उनसे उत्पन्न रक्तदोष का संकेत देता है।
- source_word: מֻטֶּה
  choice: अन्याय
  rationale: दुर्लभ शब्द का मूल भाव टेढ़ापन या सही बात को विकृत करना है; नगर के सामाजिक संदर्भ में ‘अन्याय’ स्पष्ट है, जबकि व्यापक अर्थ को पाद-टिप्पणी में सुरक्षित रखा गया है।
- source_word: עָזַב
  choice: त्याग दिया है
  rationale: पूर्ण क्रिया उनके इस दावे को व्यक्त करती है कि याहवे देश को छोड़ चुका है; ‘त्याग दिया’ संबंधपरक और धर्मवैचारिक भार बनाए रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: मूल पाठ में प्रयुक्त परमेश्वर के व्यक्तिगत वाचा-नाम को उपाधि से बदलने के बजाय लिप्यंतरित किया गया है।
- source_word: רֹאֶה
  choice: नहीं देखता
  rationale: कृदन्त यहाँ निरंतर या सामान्य निगरानी के निषेध को व्यक्त करता है; सीधा हिन्दी रूप मूल की संक्षिप्तता और आशय बनाए रखता है।
theological_decisions:
- issue: यहोवा-नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल में परमेश्वर का व्यक्तिगत नाम सीधे आया है; ‘याहवे’ उसे उपाधि में बदले बिना सुरक्षित रखता है।
- issue: דָּמִים और מֻטֶּה का न्याय-संदर्भ में अर्थ
  choice: रक्तपात ... अन्याय
  alternative: रक्त/रक्तदोष ... विकृति/विकृत न्याय
  rationale: ये शब्द हिंसा और सामाजिक अथवा न्यायिक टेढ़ेपन की निंदा करते हैं। मुख्य पाठ सुबोध रखा गया है और מֻטֶּה की वास्तविक अर्थ-व्याप्ति पाद-टिप्पणी में दी गई है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण मानक हिन्दी। वाक्य-संरचना मूल की क्रमिक अभियोगात्मक शैली को बनाए रखती है। ‘अन्याय’ सामान्य पाठक के लिए स्पष्ट है, जबकि दुर्लभ इब्रानी शब्द की अनिश्चित अर्थ-सीमा पाद-टिप्पणी में संरक्षित है।
