base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/009/006.yaml
  text: Old man[a], young man, and virgin, and little children, and women—you shall kill them utterly. But do not come near anyone on whom is the mark, and begin at my sanctuary[b]. So they began with the old men who were before the house.
translation:
  language: hi
  text: बूढ़े पुरुष को, जवान पुरुष को और कुँवारी को, और छोटे बच्चों तथा स्त्रियों को पूरी तरह मार डालो। परन्तु जिस किसी पर वह चिह्न[a] हो, उसके निकट मत जाना। मेरे पवित्रस्थान से आरम्भ करो। तब उन्होंने उन बूढ़े पुरुषों[b] से आरम्भ किया जो भवन के सामने थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: हिब्रू में ‘ताव’; अर्थात वह सुरक्षात्मक चिह्न जो पद 4 में वर्णित लोगों पर लगाया गया था।
    reason: lexical_alternative
  - marker: b
    text: या ‘पुरनियों से’; वे भवन, अर्थात मन्दिर, के सामने थे।
    reason: alternative_reading
lexical_decisions:
- source_word: זָקֵן
  choice: बूढ़ा पुरुष / बूढ़े पुरुष
  rationale: पहली occurrence में एकवचन को वर्ग-सूचक रूप में रखा गया है; अंतिम occurrence में हिब्रू बहुवचन है। ‘बूढ़ा पुरुष’ आयु-वर्ग का अर्थ स्पष्ट करता है, जबकि अंतिम पद के लिए ‘पुरनिए’ भी सम्भव है।
- source_word: בָּחוּר
  choice: जवान पुरुष
  rationale: यह जीवन के यौवनकाल के पुरुष को दर्शाता है; यहाँ ‘योद्धा’ जैसा विशिष्ट अर्थ संदर्भ से आवश्यक नहीं है।
- source_word: בְתוּלָה
  choice: कुँवारी
  rationale: मूल शब्द का सामान्य और सीधा अर्थ ‘कुँवारी’ है; इसे केवल ‘युवती’ कहना उसकी lexical specificity घटा देता।
- source_word: טַף
  choice: छोटे बच्चे
  rationale: यह छोटे बच्चों या नन्हों को सूचित करता है; ‘छोटे बच्चे’ इसकी आयु-संबंधी विशेषता और कथन की मार्मिकता बनाए रखता है।
- source_word: נָשִׁים
  choice: स्त्रियाँ
  rationale: जनसमूहों की इस सूची में सामान्य अर्थ ‘स्त्रियाँ’ स्वाभाविक है; ‘पत्नियाँ’ अनावश्यक संबंधपरक अर्थ जोड़ता।
- source_word: תַּהַרְגוּ לְמַשְׁחִית
  choice: पूरी तरह मार डालो
  rationale: मारने की कठोर आज्ञा और לְמַשְׁחִית की विनाशकारी तीव्रता को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: הַתָּו
  choice: वह चिह्न
  rationale: संदर्भ में यह 9:4 में लगाया गया सुरक्षात्मक चिह्न है। निश्चित article को ‘वह’ से व्यक्त किया गया है; अक्षर-नाम ‘ताव’ को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: אַל תִּגַּשׁוּ
  choice: निकट मत जाना
  rationale: क्रिया का मूल भाव पास आने का निषेध है; ‘छूना मत’ अनावश्यक रूप से अर्थ को सीमित करता।
- source_word: וּמִמִּקְדָּשִׁי תָּחֵלּוּ
  choice: मेरे पवित्रस्थान से आरम्भ करो
  rationale: מִן आरम्भ-बिंदु बताता है और מִקְדָּשִׁי परमेश्वर के पवित्रस्थान को; हिन्दी में यह आज्ञा स्पष्ट और स्वाभाविक है।
- source_word: הַבָּיִת
  choice: भवन
  rationale: शाब्दिक अर्थ ‘घर/भवन’ है, और संदर्भ में यह मन्दिर है। मुख्य पाठ में मूल की अभिव्यक्ति बनाए रखी गई है।
theological_decisions:
- issue: הַתָּו को अक्षर-नाम मानकर अनुवाद किया जाए या उसके कथात्मक कार्य के अनुसार
  choice: वह चिह्न
  alternative: ताव-चिह्न
  rationale: निकटवर्ती संदर्भ में इसका कार्य चिह्नित लोगों की रक्षा करना है। मुख्य पाठ अर्थ को सहज बनाता है और पादटिप्पणी हिब्रू अक्षर-नाम सुरक्षित रखती है।
- issue: अंतिम הַזְּקֵנִים आयु को दर्शाता है या पद को
  choice: बूढ़े पुरुष
  alternative: पुरनिए
  rationale: पद का आरम्भ आयु और लिंग के वर्गों से होता है, इसलिए पुनरावृत्ति को ‘बूढ़े पुरुष’ समझना स्वाभाविक है। फिर भी मन्दिर के सामने उनकी स्थिति के कारण पदाधिकारी ‘पुरनिए’ अर्थ सम्भव है और पादटिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सहज मानक हिन्दी। आरम्भिक तीन हिब्रू संज्ञाओं के वर्ग-सूचक एकवचन को हिन्दी में अलग-अलग ‘को’ के साथ बनाए रखा गया है, जबकि ‘छोटे बच्चे’ और ‘स्त्रियाँ’ बहुवचन हैं। ‘पवित्रस्थान’ बाइबलीय संदर्भ में प्रचलित और समझने योग्य है। अंग्रेज़ी consultation layer में पादटिप्पणी-चिह्न गलत शब्दों से जुड़े दिखाई देते थे; हिन्दी मुख्य पाठ में [a] को ‘चिह्न’ और [b] को अंतिम ‘बूढ़े पुरुषों’ के साथ स्रोत और पादटिप्पणी-विषय के अनुसार जोड़ा गया है।
