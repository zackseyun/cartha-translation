source:
  edition: WLC
  text: פָּרַ֨ס וְ/ל֤וּד וּ/פוּט֙ הָי֣וּ בְ/חֵילֵ֔/ךְ אַנְשֵׁ֖י מִלְחַמְתֵּ֑/ךְ מָגֵ֤ן וְ/כוֹבַע֙ תִּלּוּ בָ֔/ךְ הֵ֖מָּה נָתְנ֥וּ הֲדָרֵֽ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/027/010.yaml
  text: Persia[a], Lud, and Put were in your army as your men of war. They hung shield and helmet in you[b]; they gave you splendor.
translation:
  language: hi
  text: फ़ारस, लूद और पूत तेरी सेना में तेरे योद्धा थे। वे तेरे भीतर ढाल और टोप टाँग रखे थे[a]; उन्होंने तेरी शोभा बढ़ाई[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वे तुझ पर ढाल और टोप टाँग रखे थे।” इससे सोर की दीवारों पर अथवा नगर के भीतर सैनिक साज-सामान सजाकर रखने का चित्र उभर सकता है।
    reason: lexical_alternative
  - marker: b
    text: या, “उन्होंने तेरे वैभव में योगदान दिया” अथवा “उन्होंने तुझे वैभव दिया।”
    reason: lexical_alternative
lexical_decisions:
- source_word: פָּרַס
  choice: फ़ारस
  rationale: यह फ़ारस देश का नाम है; आधुनिक मानक हिन्दी में प्रचलित रूप ‘फ़ारस’ है।
- source_word: לוּד
  choice: लूद
  rationale: इब्रानी जाति अथवा स्थान के नाम को बिना ‘लुदिया’ जैसी व्याख्यात्मक पहचान निश्चित किए लिप्यंतरित किया गया है।
- source_word: פוּט
  choice: पूत
  rationale: इब्रानी जाति अथवा स्थान के नाम का निकट देवनागरी लिप्यंतरण रखा गया है।
- source_word: בְחֵילֵךְ
  choice: तेरी सेना में
  rationale: חַיִל के कई अर्थ हो सकते हैं, पर अगले पदबंध ‘तेरे युद्ध के पुरुष’ के कारण यहाँ सैनिक बल का अर्थ स्पष्ट है।
- source_word: אַנְשֵׁי מִלְחַמְתֵּךְ
  choice: तेरे योद्धा
  rationale: शाब्दिक अर्थ ‘तेरे युद्ध के पुरुष’ है; ‘तेरे योद्धा’ आधुनिक हिन्दी में स्वाभाविक रूप से वही सैनिक आशय व्यक्त करता है।
- source_word: מָגֵן וְכוֹבַע
  choice: ढाल और टोप
  rationale: ये क्रमशः रक्षात्मक ढाल और सैनिक सिर-कवच के सामान्य अर्थ हैं; ‘टोप’ संक्षिप्त और पारंपरिक हिन्दी सैन्य शब्द है।
- source_word: תִּלּוּ בָךְ
  choice: तेरे भीतर ... टाँगते थे
  rationale: תלה का अर्थ ‘टाँगना’ है और בָךְ का शाब्दिक अर्थ, स्त्रीलिंग नगर सोर को संबोधित करते हुए, ‘तेरे भीतर’ है। मुख्य पाठ में इस स्थानगत बिंब को रखा गया है।
- source_word: הֵמָּה נָתְנוּ הֲדָרֵךְ
  choice: उन्होंने तेरी शोभा बढ़ाई
  rationale: शाब्दिक संरचना ‘उन्होंने तेरी शोभा दी’ है। प्रसंग में विदेशी सैनिक और प्रदर्शित हथियार सोर की भव्यता में योगदान देते हैं; इसलिए स्वाभाविक हिन्दी में ‘शोभा बढ़ाई’ रखा गया है, जबकि वैकल्पिक समझ पादटिप्पणी में दी गई है।
