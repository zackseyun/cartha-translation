source:
  edition: WLC
  text: תַּרְשִׁ֥ישׁ סֹחַרְתֵּ֖/ךְ מֵ/רֹ֣ב כָּל ה֑וֹן בְּ/כֶ֤סֶף בַּרְזֶל֙ בְּדִ֣יל וְ/עוֹפֶ֔רֶת נָתְנ֖וּ עִזְבוֹנָֽיִ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/027/012.yaml
  text: Tarshish was your trader because of your abundant wealth[a]; with silver, iron, tin[c][b], and lead they paid for your wares.
translation:
  language: hi
  text: तर्शीश तेरी अपार धन-संपदा के कारण तुझसे व्यापार करता था[a]; चाँदी, लोहा, टिन और सीसा देकर वे तेरे व्यापारिक माल का मूल्य चुकाते थे[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: तर्शीश संभवतः किसी दूरस्थ व्यापारिक क्षेत्र का नाम था; कुछ लोग इसकी पहचान स्पेन के तार्तेस्सुस से करते हैं।
    reason: cultural_note
  - marker: b
    text: 'शाब्दिक अर्थ: “उन्होंने तेरे व्यापारिक माल के लिए दिया।” यहाँ “दिया” व्यापारिक लेन-देन के संदर्भ में प्रयुक्त है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּרְשִׁישׁ
  choice: तर्शीश
  rationale: मूल पाठ के स्थान-नाम का प्रचलित हिन्दी लिप्यंतरण; इसकी अनिश्चित भौगोलिक पहचान को मुख्य पाठ में व्याख्या बनाकर नहीं रखा गया।
- source_word: סֹחַרְתֵּךְ
  choice: तुझसे व्यापार करता था
  rationale: סחר के व्यापार-संबंधी अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है; एकवचन रूप तर्शीश के साथ रखा गया है, जबकि आगे बहुवचन क्रिया वहाँ के व्यापारियों की ओर संकेत कर सकती है।
- source_word: מֵרֹב כָּל הוֹן
  choice: तेरी अपार धन-संपदा के कारण
  rationale: מִן को प्रसंगानुसार कारणसूचक और הוֹן को धन-संपदा के अर्थ में लिया गया है; רֹב כָּל प्रचुरता पर बल देता है।
- source_word: בְּכֶסֶף בַּרְזֶל בְּדִיל וְעוֹפֶרֶת
  choice: चाँदी, लोहा, टिन और सीसा देकर
  rationale: בְּ का साधन अथवा विनिमय-माध्यम वाला अर्थ व्यापारिक संदर्भ में ‘देकर’ से स्वाभाविक रूप में प्रकट होता है।
- source_word: נָתְנוּ
  choice: मूल्य चुकाते थे
  rationale: क्रिया का मूल अर्थ ‘उन्होंने दिया’ है, पर व्यापार के प्रसंग में यह वस्तुओं के बदले भुगतान देने को व्यक्त करती है; शाब्दिक विकल्प पादटिप्पणी में सुरक्षित है।
- source_word: עִזְבוֹנָיִךְ
  choice: तेरे व्यापारिक माल
  rationale: यहेजकेल 27 में यह व्यापार की वस्तुओं अथवा माल के लिए प्रयुक्त तकनीकी वाणिज्यिक पद है।
