  register: आधुनिक मानक हिन्दी में गरिमापूर्ण और सुबोध शैली रखी गई है। सोर को स्त्रीलिंग एकवचन में संबोधित करने वाले मूल रूप के अनुरूप ‘तेरी/तुझसे/तेरे’ रखा गया है। व्यापार-संबंधी आशय स्पष्ट किया गया है, पर तर्शीश की पहचान और נתנו की शाब्दिक व्यापकता पादटिप्पणियों में सुरक्षित हैं।
