  text: אֳנִיּ֣וֹת תַּרְשִׁ֔ישׁ שָׁרוֹתַ֖יִ/ךְ מַעֲרָבֵ֑/ךְ וַ/תִּמָּלְאִ֧י וַֽ/תִּכְבְּדִ֛י מְאֹ֖ד בְּ/לֵ֥ב יַמִּֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/027/025.yaml
  text: The ships of Tarshish were your carriers for your merchandise[b][a], and you were filled and became very heavy in the heart of the seas.
translation:
  language: hi
  text: तर्शीश के जहाज़ तेरे व्यापारिक माल के वाहक[a] थे; तू समुद्रों के हृदय[b] में भर गई और बहुत भारी हो गई।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी पद का अर्थ कठिन है; संभवतः “तेरे काफ़िले”।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से “समुद्रों के हृदय में”; अर्थात समुद्र के बीच या गहरे जल में।
    reason: cultural_note
lexical_decisions:
- source_word: אֳנִיּוֹת תַּרְשִׁישׁ
  choice: तर्शीश के जहाज़
  rationale: यह रचना जहाज़ों का तर्शीश से संबंध दर्शाती है और इब्रानी की विशिष्ट व्यापारिक अभिव्यक्ति को बनाए रखती है।
- source_word: שָׁרוֹתַיִךְ
  choice: तेरे ... वाहक थे
  rationale: यह कठिन पद प्रसंग में तीर के व्यापारिक माल को ले जाने वाले जहाज़ों की सेवा को सूचित करता है। ‘वाहक’ जहाज़ों के लिए स्वाभाविक है, जबकि पद की अनिश्चितता पाद-टिप्पणी में रखी गई है।
- source_word: מַעֲרָבֵךְ
  choice: तेरे व्यापारिक माल
  rationale: इस अध्याय में संज्ञा विनिमय के लिए लाई-ले जाई जाने वाली वस्तुओं को दर्शाती है; ‘व्यापारिक माल’ आधुनिक हिन्दी में स्पष्ट और प्रसंगानुकूल है।
- source_word: וַתִּמָּלְאִי
  choice: तू ... भर गई
  rationale: स्त्रीलिंग संबोधन तीर नगर से है और क्रिया उसके माल से भर जाने का परिणाम व्यक्त करती है।
- source_word: וַתִּכְבְּדִי מְאֹד
  choice: बहुत भारी हो गई
  rationale: समुद्री और माल-लदान के प्रसंग में भौतिक भार का बिंब प्रमुख है; इसे ‘सम्मानित’ जैसे अमूर्त अर्थ में नहीं बदला गया।
- source_word: בְּלֵב יַמִּים
  choice: समुद्रों के हृदय में
  rationale: यह अनुवाद इब्रानी रूपक को सुरक्षित रखता है; उसका भावार्थ पाद-टिप्पणी में स्पष्ट किया गया है।
