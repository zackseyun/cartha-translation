  text: עֲרַב֙ וְ/כָל נְשִׂיאֵ֣י קֵדָ֔ר הֵ֖מָּה סֹחֲרֵ֣י יָדֵ֑/ךְ בְּ/כָרִ֤ים וְ/אֵילִים֙ וְ/עַתּוּדִ֔ים בָּ֖/ם סֹחֲרָֽיִ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/027/021.yaml
  text: Arabia and all the princes of Kedar—they were your traders[a]; in lambs, rams, and male goats[b], in these they traded with you.
translation:
  language: hi
  text: अरब[a] और केदार के सब प्रधान तेरे साथ व्यापार करनेवाले थे; वे मेम्नों, मेढ़ों और बकरों में तुझसे व्यापार करते थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “अरबवासी।” हिब्रू नाम से अरब का भूभाग या उसके लोग अभिप्रेत हो सकते हैं।
    reason: alternative_reading
lexical_decisions:
- source_word: עֲרַב
  choice: अरब
  rationale: यह नाम भूभाग या उसके लोगों—दोनों को सूचित कर सकता है। हिन्दी में ‘अरब’ इस संक्षिप्तता और संदर्भगत द्वयर्थता को स्वाभाविक रूप से बनाए रखता है।
- source_word: נְשִׂיאֵי
  choice: प्रधान
  rationale: यह शब्द जनजातीय शासकों या मुखियाओं के लिए प्रयुक्त है। ‘प्रधान’ गरिमापूर्ण और व्यापक है तथा अनावश्यक राजवंशीय अर्थ नहीं जोड़ता।
- source_word: קֵדָר
  choice: केदार
  rationale: व्यक्तिवाचक नाम का प्रचलित हिन्दी लिप्यंतरण।
- source_word: סֹחֲרֵי יָדֵךְ
  choice: तेरे साथ व्यापार करनेवाले
  rationale: शाब्दिक रूप ‘तेरे हाथ के व्यापारी’ हिन्दी में अस्पष्ट होगा; यह मुहावरा सूर के साथ व्यापारिक संबंध बताता है।
- source_word: כָרִים
  choice: मेम्ने
  rationale: यह छोटे अथवा चरागाह में पले भेड़-शावकों को सूचित करता है; अगले ‘मेढ़ों’ से भेद बनाए रखने के लिए ‘मेम्ने’ उपयुक्त है।
- source_word: אֵילִים
  choice: मेढ़े
  rationale: नर भेड़ों के लिए मानक और स्पष्ट हिन्दी शब्द।
- source_word: עַתּוּדִים
  choice: बकरे
  rationale: स्रोत में विशेष रूप से नर बकरों का उल्लेख है; ‘बकरे’ सहज आधुनिक हिन्दी है।
- source_word: בָּם סֹחֲרָיִךְ
  choice: वे ... में तुझसे व्यापार करते थे
  rationale: ‘उनमें’ की यांत्रिक पुनरावृत्ति के बजाय वस्तुओं को व्यापार की सामग्री बताते हुए हिब्रू वाक्य का अर्थ स्वाभाविक हिन्दी में व्यक्त किया गया है।
