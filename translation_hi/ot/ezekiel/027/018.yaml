  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। व्यापार-सूची का भाव स्पष्ट करने के लिए दूसरे उपवाक्य में ‘वह ... लाता था’ जोड़ा गया है; इससे वस्तुओं को दमिश्क की व्यापार-सामग्री के रूप में समझना सहज होता है।
