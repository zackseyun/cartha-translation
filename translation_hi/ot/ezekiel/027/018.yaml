base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/027/018.yaml
  text: Damascus traded with you because of your many products[a], because of your abundant wealth, with wine of Helbon and white wool.
translation:
  language: hi
  text: दमिश्क तुम्हारे बहुत-से उत्पादों और तुम्हारी अपार संपदा के कारण तुम्हारे साथ व्यापार करता था[a]; वह हेलबोन की दाखमधु और उजली ऊन का व्यापार करता था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “दमिश्क तुम्हारा व्यापारी था ... और हेलबोन की दाखमधु तथा उजली ऊन का व्यापार करता था।”
    reason: סֹחַרְתֵּךְ को क्रियात्मक रूप में ‘तुम्हारे साथ व्यापार करता था’ अथवा संज्ञात्मक रूप में ‘तुम्हारा व्यापारी था’ समझा जा सकता है।
lexical_decisions:
- source_word: דַּמֶּשֶׂק
  choice: दमिश्क
  rationale: इस प्राचीन स्थान-नाम का हिन्दी में प्रचलित बाइबलीय रूप अपनाया गया है।
- source_word: סֹחַרְתֵּךְ
  choice: तुम्हारे साथ व्यापार करता था
  rationale: सחר के वाणिज्यिक अर्थ और सोर को संबोधित स्त्रीलिंग एकवचन प्रत्यय को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है; वैकल्पिक पद-संबंधी अर्थ पादटिप्पणी में रखा गया है।
- source_word: בְּרֹב מַעֲשַׂיִךְ
  choice: तुम्हारे बहुत-से उत्पादों के कारण
  rationale: מַעֲשֶׂה का मूल अर्थ काम या बनाई हुई वस्तु है, पर अध्याय की व्यापार-सूची में यह वाणिज्यिक उत्पादों या माल को सूचित करता है। בְּ को यहाँ कारणवाचक माना गया है।
- source_word: מֵרֹב כָּל הוֹן
  choice: तुम्हारी अपार संपदा के कारण
  rationale: הוֹן धन-संपदा को सूचित करता है। हिन्दी वाक्य में संबंध स्पष्ट करने के लिए 'तुम्हारी' रखा गया है, जबकि मूल का बल अपार संपदा पर है।
- source_word: בְּיֵין חֶלְבּוֹן
  choice: हेलबोन की दाखमधु
  rationale: हेलबोन स्थान का नाम है और वहाँ की प्रसिद्ध दाखमधु व्यापार की वस्तु है। 'की' स्रोत के संबंध को संक्षेप और स्वाभाविक रूप से व्यक्त करता है।
- source_word: וְצֶמֶר צָחַר
  choice: और उजली ऊन
  rationale: צֶמֶר का अर्थ ऊन है; दुर्लभ צָחַר को चमकीली/सफेद के अर्थ में लेते हुए 'उजली' चुना गया है, जो रंग और चमक दोनों की संभावना बनाए रखता है।
