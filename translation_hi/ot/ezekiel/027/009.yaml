translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध हिन्दी रखी गई है। सोर को किए गए स्त्रीलिंग एकवचन संबोधन के कारण ‘तेरे/तेरी’ का प्रयोग है। ‘पुरनिये’ बाइबलीय-सामाजिक पद को व्यक्त करता है, जबकि शेष वाक्यावली को अत्यधिक पुरातन होने से बचाया गया है।
