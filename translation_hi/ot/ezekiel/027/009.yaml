  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: זִקְנֵ֨י גְבַ֤ל וַ/חֲכָמֶ֨י/הָ֙ הָ֣יוּ בָ֔/ךְ מַחֲזִיקֵ֖י בִּדְקֵ֑/ךְ כָּל אֳנִיּ֨וֹת הַ/יָּ֤ם וּ/מַלָּֽחֵי/הֶם֙ הָ֣יוּ בָ֔/ךְ לַ/עֲרֹ֖ב מַעֲרָבֵֽ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/027/009.yaml
  text: The elders of Gebal and her skilled men were within you[a], repairing your damage[c][b]. All the ships of the sea and their sailors were within you to trade for your merchandise.
translation:
  language: hi
  text: गबाल के पुरनिये और उसके कुशल कारीगर तेरे भीतर थे[a]; वे तेरी दरारों की मरम्मत करते थे[b]। समुद्र के सभी जहाज़ और उनके नाविक तेरे भीतर थे, ताकि तेरे माल का लेन-देन करें[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: गबाल वह फ़ीनीकी नगर है जो बाद में यूनानी भाषा में बिबलोस कहलाया।
    reason: alternative_reading
  - marker: b
    text: या, “तेरे टूटे हुए भागों की मरम्मत करते थे”; इब्रानी शब्द संरचना की दरारों, टूट-फूट या क्षतिग्रस्त भागों के लिए प्रयुक्त हो सकता है।
    reason: lexical_alternative
  - marker: c
    text: या, “तेरे माल की अदला-बदली करें।”
    reason: lexical_alternative
lexical_decisions:
- source_word: זִקְנֵי
  choice: पुरनिये
  rationale: यहाँ शब्द केवल वृद्ध पुरुषों को नहीं, बल्कि नगर के प्रतिष्ठित अगुओं को सूचित करता है; ‘पुरनिये’ इस सामाजिक-पदगत अर्थ को बनाए रखता है।
- source_word: גְבַל
  choice: गबाल
  rationale: इब्रानी स्थान-नाम का देवनागरी लिप्यंतरण किया गया है; यूनानी परंपरा में यह नगर बिबलोस कहलाया।
- source_word: חֲכָמֶיהָ
  choice: उसके कुशल कारीगर
  rationale: समुद्री मरम्मत के प्रसंग में यह व्यावहारिक और तकनीकी निपुणता को दर्शाता है, न कि केवल सामान्य बुद्धिमत्ता को।
- source_word: הָיוּ בָךְ
  choice: तेरे भीतर थे
  rationale: सोर को स्त्रीलिंग नगर और रूपकात्मक जहाज़ के रूप में संबोधित किया गया है; स्थानवाचक अर्थ और विस्तृत जहाज़-रूपक दोनों सुरक्षित रहते हैं।
- source_word: מַחֲזִיקֵי בִּדְקֵךְ
  choice: तेरी दरारों की मरम्मत करते थे
  rationale: חזק का मूल भाव दृढ़ करने का है, पर בדק के साथ यह क्षतिग्रस्त भागों को सुधारने का अर्थ देता है। ‘दरारों’ से संरचनात्मक क्षति का चित्र बना रहता है, बिना इसे केवल रिसाव या जोड़ तक सीमित किए।
- source_word: כָּל אֳנִיּוֹת הַיָּם
  choice: समुद्र के सभी जहाज़
  rationale: समग्रता और समुद्री बिंब को सीधे और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: מַלָּחֵיהֶם
  choice: उनके नाविक
  rationale: आधुनिक हिन्दी में जहाज़ चलाने वाले दल के लिए स्पष्ट और सामान्य शब्द।
- source_word: לַעֲרֹב מַעֲרָבֵךְ
  choice: तेरे माल का लेन-देन करें
  rationale: मूल में क्रिया और संज्ञा एक ही शब्द-मूल से हैं और व्यापारिक विनिमय का संकेत देती हैं; ‘लेन-देन’ विनिमय का भाव रखता है, जबकि ‘माल’ व्यापारिक वस्तुओं को स्वाभाविक हिन्दी में व्यक्त करता है।
