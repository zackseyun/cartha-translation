base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/027/016.yaml
  text: Aram traded with you because of your many products[a], giving turquoise, purple, embroidered cloth, fine linen, coral[c][b], and rubies for your wares.
translation:
  language: hi
  text: तुम्हारे बहुत-से उत्पादों के कारण अराम तुम्हारे साथ व्यापार करता था। तुम्हारे माल के बदले वे फ़िरोज़ा[a], बैंगनी कपड़ा, कढ़ाईदार कपड़ा, महीन लिनन, मूँगा[b] और माणिक[c] देते थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘पन्ना’ अथवा लाल रंग का कोई बहुमूल्य रत्न; इस इब्रानी रत्न-नाम की ठीक पहचान अनिश्चित है।
    reason: lexical_alternative
  - marker: b
    text: सम्भवतः कोई दूसरी विलास-वस्तु, जैसे सीप की मोतीदार परत; इस इब्रानी शब्द का अर्थ अनिश्चित है।
    reason: lexical_alternative
  - marker: c
    text: या ‘अकीक,’ ‘गार्नेट’ अथवा कोई अन्य बहुमूल्य रत्न; इस इब्रानी रत्न-नाम की ठीक पहचान अनिश्चित है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲרָם
  choice: अराम
  rationale: मूल इब्रानी स्थान-नाम का लिप्यंतरण आधुनिक राजनीतिक नाम थोपने से बचाता है; यहाँ यह क्षेत्र और उसके व्यापारियों के लिए सामूहिक रूप से प्रयुक्त है।
- source_word: סֹחַרְתֵּךְ
  choice: तुम्हारे साथ व्यापार करता था
  rationale: यह वाणिज्यिक गतिविधि को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: מֵרֹב מַעֲשָׂיִךְ
  choice: तुम्हारे बहुत-से उत्पादों के कारण
  rationale: शाब्दिक अर्थ ‘तुम्हारी बनाई हुई वस्तुओं की बहुतायत के कारण’ है; व्यापारिक प्रसंग में ‘उत्पाद’ स्वाभाविक और स्पष्ट है।
- source_word: נֹפֶךְ
  choice: फ़िरोज़ा
  rationale: रत्न की ठीक पहचान अनिश्चित है; मुख्य पाठ में एक प्रचलित सम्भावना रखकर विकल्प पादटिप्पणी में दिए गए हैं।
- source_word: אַרְגָּמָן
  choice: बैंगनी कपड़ा
  rationale: यह विलासितापूर्ण बैंगनी रंग की सामग्री या वस्त्र को सूचित करता है; व्यापार-सूची में ‘कपड़ा’ अर्थ स्पष्ट करता है, यद्यपि रंग और सामग्री का भेद पूरी तरह निश्चित नहीं है।
- source_word: רִקְמָה
  choice: कढ़ाईदार कपड़ा
  rationale: व्यापार की वस्तु के रूप में कढ़ाई किए हुए वस्त्र का अर्थ सहज रूप से व्यक्त होता है।
- source_word: בוּץ
  choice: महीन मलमल
  rationale: यह उत्तम कोटि के बारीक लिनन-वस्त्र को दर्शाता है; ‘महीन मलमल’ सामान्य हिन्दी पाठक के लिए स्वाभाविक है।
- source_word: רָאמֹת
  choice: मूँगा
  rationale: दुर्लभ शब्द की पहचान अनिश्चित है; विलास-वस्तुओं की सूची में ‘मूँगा’ एक सम्भावित अर्थ है, और अनिश्चितता पादटिप्पणी में सुरक्षित है।
- source_word: כַדְכֹּד
  choice: माणिक
  rationale: किसी बहुमूल्य रत्न का संकेत है, पर ठीक पहचान अनिश्चित है; ‘माणिक’ सम्भावित मुख्य-पाठ चयन है और अन्य सम्भावनाएँ पादटिप्पणी में हैं।
- source_word: נָתְנוּ
  choice: वे ... देते थे
  rationale: इब्रानी क्रिया बहुवचन है। ‘वे’ अराम के लोगों या व्यापारियों को सूचित करता है और मूल के क्षेत्र-नाम से बहुवचन क्रिया की ओर हुए बदलाव को बनाए रखता है।
- source_word: בְּעִזְבוֹנָיִךְ
  choice: तुम्हारे माल के बदले
  rationale: वाणिज्यिक सन्दर्भ में यह विनिमय के लिए दी गई व्यापारिक वस्तुओं को स्पष्ट और स्वाभाविक हिन्दी में व्यक्त करता है।
