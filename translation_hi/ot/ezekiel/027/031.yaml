  text: They will make themselves bald for you[a], and put on sackcloth, and they will weep over you with bitterness of soul, with bitter mourning.
translation:
  language: hi
  text: वे तुम्हारे लिए अपने सिर मुँड़ाकर गंजे हो जाएँगे और टाट पहनेंगे। वे मन की कड़वाहट के साथ तुम्हारे लिए रोएँगे और कड़वा विलाप करेंगे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהִקְרִיחוּ אֵלַיִךְ קָרְחָה
  choice: वे तुम्हारे कारण अपने सिर मुँड़ाकर गंजे हो जाएँगे
  rationale: क्रिया का हिफ़ईल रूप और संज्ञा קָרְחָה मिलकर शोक के चिह्न के रूप में सिर मुँड़ाकर गंजा होने का भाव देते हैं। ‘तुम्हारे कारण’ यहाँ सोर के विनाश को इस शोक का कारण बताता है।
- source_word: וְחָגְרוּ שַׂקִּים
  choice: टाट ओढ़ेंगे
  rationale: शाब्दिक अर्थ ‘टाट कमर से बाँधेंगे’ है; आधुनिक हिन्दी में ‘टाट ओढ़ना’ शोक-वस्त्र धारण करने का स्वाभाविक और स्पष्ट रूप है।
- source_word: וּבָכוּ אֵלַיִךְ
  choice: तुम्हारे लिए रोएँगे
  rationale: בכה का अर्थ रोना है और אֶל यहाँ विलाप के लक्ष्य अथवा प्रसंग को दर्शाता है; ‘तुम्हारे लिए’ हिन्दी में दोनों के संबंध को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: בְּמַר נֶפֶשׁ
  choice: मन की कड़वाहट में
  rationale: यह ‘प्राण/जीवन की कड़वाहट में’ का निकट अर्थ देता है। हिन्दी में ‘मन’ गहरे भीतरी संताप को सहजता से व्यक्त करता है, जबकि ‘कड़वाहट’ मूल बिंब को बनाए रखती है।
- source_word: מִסְפֵּד מָר
  choice: फूट-फूटकर विलाप करेंगे
  rationale: शाब्दिक रूप ‘कड़वा विलाप’ है। आधुनिक हिन्दी में ‘फूट-फूटकर’ विलाप की तीव्रता और गहरे दुःख को स्वाभाविक रूप से व्यक्त करता है।
