  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सहज व्यापारिक गद्य अपनाया गया है। सोर को संबोधित स्त्रीलिंग एकवचन ‘तुम्हारे/तुम्हें’ को संदर्भानुसार बनाए रखा गया है; जहाँ शाब्दिक इब्रानी मुहावरा हिन्दी में अस्पष्ट या अस्वाभाविक होता, वहाँ अर्थ-समान स्वाभाविक अभिव्यक्ति दी गई है।
