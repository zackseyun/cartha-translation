  text: בְּנֵ֤י דְדָן֙ רֹֽכְלַ֔יִ/ךְ אִיִּ֥ים רַבִּ֖ים סְחֹרַ֣ת יָדֵ֑/ךְ קַרְנ֥וֹת שֵׁן֙ ו/הובנים הֵשִׁ֖יבוּ אֶשְׁכָּרֵֽ/ךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/027/015.yaml
  text: The sons of Dedan were your merchants[a]. Many coastlands were the market of your hand[c][b]; they brought back ivory tusks and ebony as your payment.
translation:
  language: hi
  text: ददान के वंशज तुम्हारे व्यापारी थे। बहुत-से समुद्रतटीय प्रदेश[a] तुम्हारे व्यापार के बाज़ार थे; वे हाथी के दाँत[b] और आबनूस की लकड़ी तुम्हें भुगतान के रूप में लाते थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘बहुत-से द्वीप’।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से ‘हाथीदाँत के सींग’।
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי דְדָן
  choice: ददान के वंशज
  rationale: शाब्दिक ‘ददान के पुत्र’ यहाँ जातीय अथवा भौगोलिक समुदाय को सूचित करता है। ‘वंशज’ मूल संरचना का भाव रखते हुए आधुनिक हिन्दी में स्वाभाविक है।
- source_word: רֹכְלַיִךְ
  choice: तुम्हारे व्यापारी
  rationale: यह संज्ञा घूमकर अथवा दूर-दूर तक माल का व्यापार करने वालों को दर्शाती है; अध्याय के व्यापारिक संदर्भ में ‘व्यापारी’ स्पष्ट और सहज है।
- source_word: אִיִּים רַבִּים
  choice: बहुत-से समुद्रतटीय प्रदेश
  rationale: אִיִּים द्वीपों के साथ व्यापक समुद्री तटवर्ती क्षेत्रों को भी सूचित कर सकता है। मुख्य पाठ में संदर्भानुकूल व्यापक अर्थ रखा गया है और ‘द्वीप’ को पाद-टिप्पणी में सुरक्षित किया गया है।
- source_word: סְחֹרַת יָדֵךְ
  choice: तुम्हारे व्यापार के क्षेत्र
  rationale: इब्रानी मुहावरे का शाब्दिक रूप ‘तुम्हारे हाथ का व्यापार/बाज़ार’ हिन्दी में अस्वाभाविक है। बहुवचन कर्ता के अनुरूप ‘व्यापार के क्षेत्र’ उसके वाणिज्यिक आशय को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: קַרְנוֹת שֵׁן
  choice: हाथी के दाँत
  rationale: शाब्दिक रूप ‘हाथीदाँत के सींग’ है, पर व्यापार-वस्तु के रूप में आशय हाथी के दाँतों से है। स्पष्ट हिन्दी रूप मुख्य पाठ में और ठोस मूल बिंब पाद-टिप्पणी में रखा गया है।
- source_word: וְהוֹבְנִים
  choice: आबनूस की लकड़ी
  rationale: शब्द को परंपरागत और संदर्भानुकूल रूप से विलास-वस्तु आबनूस समझा जाता है; ‘लकड़ी’ जोड़ने से सामान्य पाठक के लिए वस्तु स्पष्ट होती है।
- source_word: הֵשִׁיבוּ אֶשְׁכָּרֵךְ
  choice: तुम्हें भुगतान के रूप में लाते थे
  rationale: הֵשִׁיבוּ मूलतः ‘लौटाते/वापस लाते थे’ और אֶשְׁכָּרֵךְ ‘तुम्हारा भुगतान/प्रतिफल’ है। व्यापारिक लेन-देन में हिन्दी वाक्यांश विनिमय में माल दिए जाने का अर्थ स्पष्ट करता है, बिना उसे मुद्रा-भुगतान बनाने के।
