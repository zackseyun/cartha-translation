  text: Judah and the land of Israel—they were your merchants; they traded for your merchandise with wheat of Minnith[a], pannag, honey, oil, and balm.
translation:
  language: hi
  text: यहूदा और इस्राएल का देश—वे तुम्हारे व्यापारी थे; उन्होंने तुम्हारे माल के बदले मिन्नीत का गेहूँ, पन्नग[a], शहद, तेल और बलसान दिए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘पन्नग’ का अर्थ अनिश्चित है; प्रस्तावित अर्थों में मिठाई, मसाला या पेस्ट्री-उत्पाद शामिल हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: רֹכְלָיִךְ
  choice: तुम्हारे व्यापारी
  rationale: यह संज्ञा व्यापार करने वालों को दर्शाती है। सोर के व्यापार पर आधारित इस विलाप में ‘व्यापारी’ स्वाभाविक और प्रसंगानुकूल है।
- source_word: בְּחִטֵּי מִנִּית
  choice: मिन्नीत का गेहूँ
  rationale: यह पद व्यापार में दी गई वस्तु को बताता है और मिन्नीत स्थान-नाम को बनाए रखता है; संबंध संभवतः गेहूँ के उद्गम या उसकी पहचानी हुई किस्म से है।
- source_word: פַנַּג
  choice: पन्नग
  rationale: यह अत्यंत दुर्लभ शब्द है और इसका अर्थ अनिश्चित है। लिप्यंतरण स्रोत की अनिश्चितता को सुरक्षित रखता है; संभावित अर्थ पादटिप्पणी में दिए गए हैं।
- source_word: דְבַשׁ
  choice: शहद
  rationale: यह शब्द का सामान्य और प्रसंगानुकूल अर्थ है।
- source_word: שֶׁמֶן
  choice: तेल
  rationale: मूल शब्द व्यापक रूप से तेल को दर्शाता है। संभवतः जैतून का तेल अभिप्रेत हो, पर मूल पाठ में यह विशेषता स्पष्ट नहीं है।
- source_word: צֹרִי
  choice: बलसान
  rationale: यह किसी मूल्यवान सुगंधित गोंद या औषधीय लेप-सामग्री को दर्शाता है। ‘बलसान’ इस वस्तु के लिए स्थापित हिंदी शब्द है और केवल ‘मरहम’ की तुलना में पदार्थ के स्वरूप को बेहतर बनाए रखता है।
- source_word: נָתְנוּ מַעֲרָבֵךְ
  choice: उन्होंने तुम्हारे माल के बदले ... दिया
  rationale: शाब्दिक ‘उन्होंने तुम्हारा विनिमय/माल दिया’ व्यापार-सूची में विनिमय का भाव रखता है। हिंदी में ‘माल के बदले ... दिया’ वाणिज्यिक संबंध को स्पष्ट और स्वाभाविक रूप से व्यक्त करता है, बिना विनिमय की दिशा पर अनावश्यक विस्तार किए।
- source_word: יְהוּדָה וְאֶרֶץ יִשְׂרָאֵל
  choice: यहूदा और इस्राएल देश
  rationale: मूल पाठ ‘यहूदा’ और ‘इस्राएल देश’ दोनों को स्पष्ट रूप से रखता है; अनुवाद इस भेद को केवल ‘यहूदा और इस्राएल’ कहकर संक्षिप्त नहीं करता।
