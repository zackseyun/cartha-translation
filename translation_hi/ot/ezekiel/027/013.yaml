base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/027/013.yaml
  text: Javan[a], Tubal, and Meshech—they were your traders; they exchanged human lives and articles of bronze for your wares.
translation:
  language: hi
  text: यावान[a], तूबल और मेशेक—ये तेरे व्यापारी थे; मनुष्यों और काँसे की वस्तुओं के बदले वे तेरा माल लेते थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “यूनान”; प्रसंग में यह यावान नामक जाति अथवा उसके क्षेत्र का नाम है।
    reason: नाम की प्रचलित ऐतिहासिक पहचान
lexical_decisions:
- source_word: יָוָן
  choice: यावान
  rationale: इब्रानी जाति/स्थान-सूचक नाम का लिप्यंतरण किया गया है; ‘यूनान’ ऐतिहासिक पहचान को अधिक स्पष्ट करता, पर मूल नामरूप से कम निकट होता।
- source_word: תֻּבַל
  choice: तूबल
  rationale: जाति अथवा क्षेत्र के नाम का इब्रानी रूप के निकट लिप्यंतरण।
- source_word: מֶשֶׁךְ
  choice: मेशेक
  rationale: जाति अथवा क्षेत्र के नाम का इब्रानी रूप के निकट लिप्यंतरण।
- source_word: רֹכְלָיִךְ
  choice: तेरे व्यापारी
  rationale: यह शब्द व्यापार करने वालों अथवा व्यापारिक साझेदारों को बताता है; ‘व्यापारी’ आधुनिक हिन्दी में स्वाभाविक है।
- source_word: בְּנֶפֶשׁ אָדָם
  choice: मनुष्यों के प्राण
  rationale: शाब्दिक संरचना ‘मनुष्य का प्राण/जीवन’ है। व्यापार के संदर्भ में मनुष्य स्वयं वस्तु बनाए गए हैं; यह अनुवाद उस कठोरता को बनाए रखते हुए ‘दास’ कहकर कानूनी स्थिति को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: כְלֵי נְחֹשֶׁת
  choice: काँसे की वस्तुएँ
  rationale: व्यापक अर्थ में काँसे से बनी सामग्री अभिप्रेत है; ‘पात्र’ अर्थ को अनावश्यक रूप से सीमित करता।
- source_word: נָתְנוּ
  choice: देकर ... लेते थे
  rationale: मूल क्रिया ‘उन्होंने दिया’ है, पर व्यापारिक प्रसंग में विनिमय अभिप्रेत है। हिन्दी की इस रचना में देने का मूल बिंब और लेन-देन दोनों स्वाभाविक रूप से व्यक्त होते हैं।
- source_word: מַעֲרָבֵךְ
  choice: तेरा व्यापारिक माल
  rationale: यहाँ व्यापार में बदले जाने वाले माल का संकेत है; ‘व्यापारिक माल’ सामान्य पाठक के लिए स्पष्ट है और ‘बाज़ार’ की अपेक्षा प्रसंग के अनुकूल है।
