  yaml_path: translation/ot/ezekiel/027/027.yaml
  text: Your wealth[a], your wares, your merchandise, your sailors, and your pilots, those who repair your damage, and those who trade in your merchandise, and all your men of war who are in you, with all your assembly that is in your midst[b], will fall into the heart of the seas on the day of your downfall.
translation:
  language: hi
  text: तेरा धन, तेरा माल, तेरी व्यापार-वस्तुएँ, तेरे नाविक और तेरे कर्णधार, तेरी टूट-फूट को ठीक करनेवाले[a], तेरे व्यापारिक माल के व्यापारी, और तेरे सभी योद्धा जो तेरे भीतर हैं—तेरे बीच में जो तेरी सारी सभा है, उसके साथ—तेरे पतन के दिन समुद्रों के हृदय में[b] गिर पड़ेंगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तेरी दरारों को भरनेवाले” या “तेरी टूटनों को ठीक करनेवाले।”
    reason: lexical_alternative
  - marker: b
    text: अर्थात् समुद्रों के बीच या उनकी गहराई में।
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹנֵךְ
  choice: तेरा धन
  rationale: הוֹן का सामान्य अर्थ धन या संपत्ति है; व्यापारिक विलाप में ‘धन’ स्वाभाविक और स्पष्ट है।
- source_word: עִזְבוֹנַיִךְ
  choice: तेरा माल
  rationale: इस अध्याय के व्यापारिक संदर्भ में यह बिक्री या ढुलाई की वस्तुओं को दर्शाता है; ‘माल’ सहज आधुनिक हिन्दी है।
- source_word: מַעֲרָבֵךְ
  choice: तेरी व्यापार-वस्तुएँ
  rationale: यहाँ संज्ञा व्यापार में विनिमय होनेवाली वस्तुओं या व्यापार-माल की ओर संकेत करती है; पास के עִזְבוֹן से भेद रखने के लिए यह रूप चुना गया है।
- source_word: מַלָּחַיִךְ
  choice: तेरे नाविक
  rationale: जहाज़ पर काम करनेवाले सामान्य समुद्री कर्मियों के लिए यह स्पष्ट आधुनिक शब्द है।
- source_word: חֹבְלָיִךְ
  choice: तेरे कर्णधार
  rationale: संदर्भ में ये सामान्य नाविकों से अलग जहाज़ का मार्गदर्शन या संचालन करनेवाले हैं; ‘कर्णधार’ समुद्री अर्थ बनाए रखता है।
- source_word: מַחֲזִיקֵי בִדְקֵךְ
  choice: तेरी टूट-फूट की मरम्मत करनेवाले
  rationale: शाब्दिक भाव दरार या क्षति को मजबूत करके ठीक करनेवालों का है; मुख्य पाठ में व्यापक जहाज़ी मरम्मत का सहज अर्थ रखा गया है और अधिक विशिष्ट विकल्प पादटिप्पणी में हैं।
- source_word: עֹרְבֵי מַעֲרָבֵךְ
  choice: तेरे व्यापार का लेन-देन करनेवाले
  rationale: व्यापारिक प्रसंग में कृदन्त विनिमय या सौदा करनेवालों को दर्शाता है; यह अनिश्चितता रखता है कि वे व्यापारी, सौदागर या वस्तु-विनिमय करनेवाले थे।
- source_word: אַנְשֵׁי מִלְחַמְתֵּךְ
  choice: तेरे भीतर के सभी योद्धा
  rationale: यह युद्ध करनेवाले पुरुषों का सामूहिक सैन्य पद है; ‘योद्धा’ संक्षिप्त, वर्तमान और गरिमापूर्ण है।
- source_word: קְהָלֵךְ
  choice: तेरे बीच की सारी सभा
  rationale: קהל एकत्र जनसमूह को दर्शाता है; यहाँ नगर-जहाज़ में उपस्थित व्यापक समुदाय अभिप्रेत हो सकता है, इसलिए अर्थ को अनावश्यक रूप से सीमित नहीं किया गया।
- source_word: יִפְּלוּ
  choice: गिर पड़ेंगे
  rationale: मूल क्रिया ‘गिरना’ है। समुद्री संदर्भ में डूबना निहित है, पर मूल बिंब को मुख्य पाठ में बनाए रखा गया है।
- source_word: בְּלֵב יַמִּים
  choice: समुद्रों के हृदय में
  rationale: मूल का सजीव रूपक ज्यों का त्यों रखा गया है; इसका भाव समुद्रों के बीच या गहराई में है।
- source_word: מַפַּלְתֵּךְ
  choice: तेरे पतन
  rationale: संज्ञा गिरावट, विनाशकारी ढहाव या पराजय का भाव देती है; ‘पतन’ मूल से निकट और स्वाभाविक है।
