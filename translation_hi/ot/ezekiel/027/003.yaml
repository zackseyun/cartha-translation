source:
  edition: WLC
  text: וְ/אָמַרְתָּ֣ לְ/צ֗וֹר ה/ישבתי עַל מְבוֹאֹ֣ת יָ֔ם רֹכֶ֨לֶת֙ הָֽ/עַמִּ֔ים אֶל אִיִּ֖ים רַבִּ֑ים כֹּ֤ה אָמַר֙ אֲדֹנָ֣/י יְהוִ֔ה צ֕וֹר אַ֣תְּ אָמַ֔רְתְּ אֲנִ֖י כְּלִ֥ילַת יֹֽפִי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/027/003.yaml
  text: 'and say to Tyre[a], who dwells at the entrances of the sea, trader of the peoples to many coastlands: Thus says the Lord GOD: Tyre, you have said, ‘I am perfect in beauty.’'
translation:
  language: hi
  text: 'और सोर से कह, जो समुद्र के प्रवेश-मार्गों पर बसा है और बहुत-से तटीय प्रदेशों[a] के लोगों के साथ व्यापार करता है: प्रभु याहवे यों कहता है, ‘हे सोर, तूने कहा है, “मैं सुंदरता में पूर्ण हूँ।”’'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘बहुत-से द्वीपों’। इब्रानी शब्द द्वीपों अथवा व्यापक अर्थ में समुद्र-तटीय प्रदेशों के लिए प्रयुक्त हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הישבתי
  choice: जो ... बसा है
  rationale: स्त्रीलिंग एकवचन कर्तृवाचक कृदंत सोर का वर्णन करता है। हिन्दी में नगर के लिए ‘बसा है’ स्वाभाविक है और स्थित होने की निरंतर अवस्था बनाए रखता है।
- source_word: מְבוֹאֹת יָם
  choice: समुद्र के प्रवेश-स्थानों
  rationale: मूल शब्द के ठोस ‘प्रवेश/पहुँच के मार्ग’ वाले समुद्री बिंब को बनाए रखता है और सोर की सामरिक स्थिति व्यक्त करता है।
- source_word: רֹכֶלֶת הָעַמִּים
  choice: देश-देश के लोगों से व्यापार करता है
  rationale: स्त्रीलिंग कृदंत सोर की व्यापारिक भूमिका बताता है। शाब्दिक ‘लोगों का व्यापारी’ की तुलना में यह आधुनिक हिन्दी में अधिक स्वाभाविक है, जबकि बहुवचन समुदायों के साथ व्यापार का भाव सुरक्षित रहता है।
- source_word: אֶל אִיִּים רַבִּים
  choice: बहुत-से तटीय प्रदेशों तक
  rationale: אִיִּים द्वीपों के साथ व्यापक समुद्री तटवर्ती भूभागों को भी सूचित कर सकता है। ‘तक’ व्यापार की पहुँच और אֶל की दिशात्मकता को व्यक्त करता है।
- source_word: אֲדֹנָי יְהוִה
  choice: प्रभु यहोवा
  rationale: אֲדֹנָי को ‘प्रभु’ और परमेश्वर के विशिष्ट नाम יהוה को ‘यहोवा’ देकर संयुक्त उपाधि के दोनों तत्व अलग और स्पष्ट रखे गए हैं।
- source_word: כְּלִילַת יֹפִי
  choice: सुंदरता में सिद्ध
  rationale: यह पदबंध संपूर्ण या चरम सुंदरता का दावा व्यक्त करता है। चुना हुआ रूप सोर के गर्वपूर्ण दावे को संक्षिप्त और स्वाभाविक हिन्दी में बनाए रखता है।
theological_decisions:
- issue: संयुक्त ईश्वरीय उपाधि אֲדֹנָי יְהוִה में परमेश्वर के नाम का रूप
  choice: प्रभु यहोवा
  alternative: प्रभु याहवे
  rationale: मूल पाठ में सामान्य पदवी के बाद चार-अक्षरीय विशिष्ट नाम है। ‘प्रभु यहोवा’ हिन्दी बाइबलीय पाठकों के लिए परिचित है और नाम को केवल ‘प्रभु’ में विलीन नहीं करता; ‘याहवे’ संभावित अधिक ध्वन्यात्मक विकल्प है।
- issue: सोर के सौंदर्य-दावे की तीव्रता
  choice: मैं सुंदरता में सिद्ध हूँ
  alternative: मैं सुंदरता की परिपूर्णता हूँ
  rationale: כְּלִילַת יֹפִי चरम या पूर्ण सुंदरता का दावा है। चुना हुआ पाठ उसके घमंड को बनाए रखता है, पर उसे उससे भी अधिक अमूर्त पहचान-वाक्य में नहीं बदलता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। सोर के नगर-रूप के कारण हिन्दी में पुल्लिंग ‘बसा है/व्यापार करता है’ स्वाभाविक रूप से आया है, यद्यपि इब्रानी में नगर का मानवीकरण स्त्रीलिंग में है। उद्धरण-स्तरों को अलग दिखाने के लिए एकहरे और दोहरे उद्धरण-चिह्न प्रयुक्त हैं।
