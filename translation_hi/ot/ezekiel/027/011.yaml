base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/027/011.yaml
  text: The sons of Arvad[a], along with your army, were on your walls all around, and the Gammadites were in your towers. They hung their shields on your walls all around; they perfected your beauty.
translation:
  language: hi
  text: अरवद के लोग और तुम्हारी सेना चारों ओर तुम्हारी दीवारों पर तैनात थे, और गम्मादी लोग[a] तुम्हारी मीनारों में थे। उन सबने अपनी ढालें चारों ओर तुम्हारी दीवारों पर टाँग रखी थीं; उन्होंने तुम्हारी सुंदरता को पूर्णता प्रदान की।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी शब्द גַמָּדִים का अर्थ अनिश्चित है। यहाँ इसे एक जाति या समुदाय के नाम के रूप में ‘गम्मादी लोग’ लिखा गया है; इसे ‘गमादी’ भी लिखा जाता है। कुछ लोग इसका सामान्य अर्थ ‘योद्धा’ समझते हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי אַרְוַד
  choice: अरवद के लोग
  rationale: शाब्दिक रूप ‘अरवद के पुत्र’ एक इब्रानी जातीय-भौगोलिक अभिव्यक्ति है, जिसका आशय अरवद के निवासी या लोग है। आधुनिक हिन्दी में ‘अरवद के लोग’ इसका स्वाभाविक और स्पष्ट रूप है।
- source_word: חֵילֵךְ
  choice: तुम्हारी सेना
  rationale: सैन्य सुरक्षा और दीवारों पर तैनाती के प्रसंग में חַיִל का अर्थ सेना या सैन्य बल है।
- source_word: חוֹמוֹתַיִךְ סָבִיב
  choice: चारों ओर तुम्हारी दीवारों पर
  rationale: यह नगर की दीवारों के चारों ओर पूरी परिधि में तैनाती और ढालें लगाए जाने का भाव व्यक्त करता है।
- source_word: גַמָּדִים
  choice: गम्मादी
  rationale: यह शब्द अस्पष्ट है और संभवतः किसी जाति या समुदाय का नाम है। अर्थ का अनुमान लगाकर ‘योद्धा’ कहने के बजाय लिप्यंतरण मूल अनिश्चितता को सुरक्षित रखता है।
- source_word: בְּמִגְדְּלוֹתַיִךְ
  choice: तुम्हारी मीनारों में
  rationale: उपसर्ग בְּ सामान्यतः ‘में’ या ‘पर’ हो सकता है; पहरेदारों के मीनारों में तैनात होने के प्रसंग में ‘में’ स्वाभाविक है।
- source_word: שִׁלְטֵיהֶם
  choice: अपनी ढालें
  rationale: यह संज्ञा रक्षात्मक ढालों को सूचित करती है; हिन्दी में ‘ढालें’ स्पष्ट और सामान्य शब्द है। कर्ता वही गम्मादी और सैनिक हैं, इसलिए हिन्दी में ‘अपनी’ स्वाभाविक है।
- source_word: תִּלּוּ
  choice: टाँग रखी थीं
  rationale: क्रिया का अर्थ टाँगना या लटकाना है। ‘टाँग रखी थीं’ दीवारों पर प्रदर्शित ढालों की परिणामी अवस्था भी व्यक्त करता है।
- source_word: כָּלְלוּ
  choice: पूर्ण कर दिया
  rationale: क्रिया में पूरा करने या परिपूर्ण बनाने का भाव है। यह रूप काव्यात्मक कथन को बनाए रखता है कि सैनिकों और उनकी ढालों ने सोर की सुंदरता को पूर्णता दी।
- source_word: יָפְיֵךְ
  choice: तुम्हारी सुंदरता
  rationale: יֹפִי का सीधा अर्थ सुंदरता है; यह सोर के वैभवपूर्ण चित्रण के अनुकूल है।
