source:
  edition: WLC
  text: בְּ/צֵ֤את עִזְבוֹנַ֨יִ/ךְ֙ מִ/יַּמִּ֔ים הִשְׂבַּ֖עַתְּ עַמִּ֣ים רַבִּ֑ים בְּ/רֹ֤ב הוֹנַ֨יִ/ךְ֙ וּ/מַ֣עֲרָבַ֔יִ/ךְ הֶעֱשַׁ֖רְתְּ מַלְכֵי אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/027/033.yaml
  text: When your wares went out from the seas[a], you satisfied many peoples[b]; with your abundant wealth and your merchandise you enriched the kings of the earth.
translation:
  language: hi
  text: जब समुद्रों से तुम्हारा व्यापारिक माल[a] निकलता था, तब तुम बहुत-से लोगों को तृप्त करते थे; अपनी अपार धन-संपत्ति और व्यापार की वस्तुओं से तुम पृथ्वी[b] के राजाओं को धनी बनाते थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “तुम्हारी व्यापारिक वस्तुएँ”; עִזְבוֹנַיִךְ यहाँ सोर के व्यापारिक माल या जहाज़ी खेप को दर्शाता है।
    reason: lexical_alternative
  - marker: b
    text: या “देश”; इब्रानी אֶרֶץ का अर्थ संदर्भ के अनुसार “पृथ्वी,” “देश” या “भूमि” हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּצֵאת
  choice: जब ... निकलता था
  rationale: ב के साथ infinitive construct यहाँ समयसूचक उपवाक्य बनाता है। हिंदी में “जब ... निकलता था” स्वाभाविक रूप से उस अर्थ को व्यक्त करता है।
- source_word: עִזְבוֹנַיִךְ
  choice: तुम्हारा व्यापारिक माल
  rationale: यह शब्द सोर के व्यापार में भेजी जाने वाली वस्तुओं या खेप को दर्शाता है। “व्यापारिक माल” आधुनिक हिंदी में स्पष्ट है और आगे आए מַעֲרָבַיִךְ से कुछ शब्दगत भिन्नता भी बनाए रखता है।
- source_word: מִיַּמִּים
  choice: समुद्रों से
  rationale: मूल में बहुवचन है; “समुद्रों” उसे और अध्याय की व्यापक समुद्री छवि को सुरक्षित रखता है।
- source_word: הִשְׂבַּעַתְּ
  choice: तुम ... तृप्त करते थे
  rationale: שׂבע के हिफ़ील रूप का अर्थ तृप्त करना या भरपूर देना है। व्यापार से अनेक लोगों की आवश्यकताएँ पूरी होने के भाव को “तृप्त करते थे” सीधे व्यक्त करता है।
- source_word: עַמִּים רַבִּים
  choice: बहुत-से लोगों
  rationale: עַמִּים अनेक मानव-समुदायों को सूचित करता है। “लोगों” आधुनिक हिंदी में सहज है और आधुनिक राष्ट्र-राज्यों का अनावश्यक भाव नहीं जोड़ता।
- source_word: בְּרֹב הוֹנַיִךְ
  choice: अपनी अपार धन-संपत्ति से
  rationale: בְּ यहाँ साधन का भाव देता है, जबकि רֹב प्रचुरता और הוֹן धन को दर्शाता है। यह वाक्यांश उस संयुक्त अर्थ को स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: וּמַעֲרָבַיִךְ
  choice: और व्यापार की वस्तुओं से
  rationale: यहेजकेल 27 में यह संज्ञा विनिमय और व्यापार की वस्तुओं के लिए प्रयुक्त होती है। यह अनुवाद अर्थ स्पष्ट रखते हुए पहले आए “व्यापारिक माल” की यांत्रिक पुनरावृत्ति से बचता है।
- source_word: הֶעֱשַׁרְתְּ
  choice: तुम ... धनी बनाते थे
  rationale: עשר के हिफ़ील का अर्थ किसी को धनी बनाना है। हिंदी में यह सीधा और स्वाभाविक प्रयोग है।
- source_word: מַלְכֵי אָרֶץ
  choice: पृथ्वी के राजाओं
  rationale: अंतरराष्ट्रीय व्यापार के इस विलाप में אֶרֶץ का व्यापक अर्थ “पृथ्वी” उपयुक्त है, यद्यपि “देश” या “भूमि” भी संभव है।
theological_decisions:
- issue: אֶרֶץ का भौगोलिक विस्तार
  choice: पृथ्वी
  alternative: देश/भूमि
  rationale: सोर के दूर-दूर तक फैले व्यापार के संदर्भ में व्यापक अर्थ अधिक उपयुक्त है, पर मूल शब्द की संकुचित भौगोलिक संभावना पाद-टिप्पणी में सुरक्षित रखी गई है।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। सोर को संबोधित स्त्रीलिंग इब्रानी रूप हिंदी में लिंग-निरपेक्ष “तुम” के कारण स्वाभाविक ढंग से व्यक्त हुआ है। व्यापार-संबंधी दो निकटार्थक इब्रानी संज्ञाओं के लिए “व्यापारिक माल” और “व्यापार की वस्तुएँ” चुने गए हैं।
