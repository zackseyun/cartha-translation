base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/027/019.yaml
  text: Dan and Javan from Uzal traded with you[a]; they exchanged wrought iron, cassia[c][b], and cane for your wares.
translation:
  language: hi
  text: दान और यावान ने ऊज़ाल से आकर[a][b] तुम्हारे साथ व्यापार किया; उन्होंने तुम्हारे माल के बदले गढ़ा हुआ लोहा, कासिया और सुगंधित नरकट[c] दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी पाठ में ‘दान’ है; पाठ कठिन होने के कारण कुछ विद्वान ‘वदान’ पढ़ते हैं या नाम में अन्य संशोधन सुझाते हैं।
    reason: textual_variant
  - marker: b
    text: या, ‘ऊज़ाल का यावान।’ इब्रानी में ‘यावान’ और ‘ऊज़ाल’ का परस्पर संबंध स्पष्ट नहीं है।
    reason: alternative_reading
  - marker: c
    text: या, ‘कैलमस’ या ‘मीठा नरकट।’
    reason: lexical_alternative
lexical_decisions:
- source_word: וְדָן
  choice: दान
  rationale: मसोरेटिक पाठ में आए स्थान अथवा व्यापारी समुदाय के नाम को लिप्यंतरित किया गया है; कठिन पाठ के कारण प्रस्तावित ‘वदान’ को पादटिप्पणी में रखा गया है।
- source_word: וְיָוָן
  choice: यावान
  rationale: व्यापार-सूची में व्यक्तिवाचक भौगोलिक नाम को ‘यूनान’ जैसे व्याख्यात्मक रूप के बजाय लिप्यंतरित किया गया है।
- source_word: מְאוּזָּל
  choice: ऊज़ाल से आकर
  rationale: מ prefixed preposition को ‘से’ और אוּזָּל को स्थाननाम माना गया है; स्वाभाविक हिन्दी वाक्य के लिए ‘आकर’ जोड़ा गया है, जबकि इसका दान और यावान से संबंध अस्पष्ट है।
- source_word: בְּעִזְבוֹנַיִךְ
  choice: तुम्हारे साथ व्यापार किया
  rationale: व्यापारिक प्रसंग में माल अथवा व्यापार से संबंधित संज्ञा को हिन्दी में स्वाभाविक क्रियात्मक अभिव्यक्ति दी गई है।
- source_word: נָתָנּוּ
  choice: दिया
  rationale: मूल क्रिया का सीधा अर्थ ‘दिया’ है; ‘माल के बदले’ के साथ यह व्यापारिक लेन-देन को स्पष्ट करता है।
- source_word: בַּרְזֶל עָשׁוֹת
  choice: गढ़ा हुआ लोहा
  rationale: यह कच्चे लोहे के बजाय तैयार अथवा काम किए हुए लोहे को सूचित करता है।
- source_word: קִדָּה
  choice: दालचीनी
  rationale: यह सुगंधित कासिया/दालचीनी की छाल के लिए प्रयुक्त शब्द है; सामान्य हिन्दी पाठक के लिए ‘दालचीनी’ अधिक सुबोध है।
- source_word: וְקָנֶה
  choice: सुगंधित नरकट
  rationale: व्यापारिक सुगंध-द्रव्यों के संदर्भ में साधारण नरकट के बजाय सुगंधित केन/कैलमस अभिप्रेत है।
- source_word: בְּמַעֲרָבֵךְ
  choice: तुम्हारे माल के बदले
  rationale: अध्याय के व्यापारिक संदर्भ में शब्द का अर्थ व्यापार का माल है; ‘के बदले’ लेन-देन का संबंध स्वाभाविक हिन्दी में व्यक्त करता है।
