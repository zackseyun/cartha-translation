  yaml_path: translation/ot/ezekiel/027/014.yaml
  text: From Beth-togarmah they traded horses[a], horsemen[b], and mules for your wares.
translation:
  language: hi
  text: बेत-तोगर्मा से उन्होंने तेरे माल के बदले घोड़े, घुड़सवार[a] और खच्चर दिए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “युद्ध के घोड़े” अथवा “घुड़सवारी के घोड़े।” इब्रानी शब्द प्रायः घुड़सवारों को दर्शाता है, पर यहाँ घोड़ों और खच्चरों के साथ व्यापारिक वस्तुओं की सूची में होने के कारण घोड़ों का अर्थ भी संभव है।
    reason: alternative_reading
lexical_decisions:
- source_word: מִבֵּית תּוֹגַרְמָה
  choice: तोगर्मा के क्षेत्र से
  rationale: בֵּית का शाब्दिक अर्थ ‘घर’ है, पर इस जातीय-भौगोलिक व्यापार-सूची में यह तोगर्मा से संबद्ध क्षेत्र या लोगों को सूचित करता है। स्वाभाविक हिन्दी में ‘क्षेत्र’ इसी आशय को स्पष्ट करता है।
- source_word: סוּסִים
  choice: घोड़े
  rationale: यह घोड़ों के लिए प्रयुक्त सामान्य बहुवचन संज्ञा है।
- source_word: וּפָרָשִׁים
  choice: घुड़सवार
  rationale: פָּרָשִׁים का सामान्य अर्थ घुड़सवार या अश्वारोही है। यद्यपि व्यापार-सूची के कारण ‘युद्ध के घोड़े’ अर्थ संभव माना गया है, मूल शब्द का सीधा मानवीय अर्थ मुख्य पाठ में रखा गया है और विकल्प पादटिप्पणी में दिया गया है।
- source_word: וּפְרָדִים
  choice: खच्चर
  rationale: यह पशु-संज्ञा का मानक हिन्दी अर्थ है और व्यापार की वस्तुओं की सूची में स्वाभाविक बैठता है।
- source_word: נָתְנוּ
  choice: दिए
  rationale: मूल क्रिया का सीधा अर्थ ‘दिया’ है। ‘तेरे माल के बदले’ के साथ इसका व्यापारिक और विनिमय-संबंधी आशय हिन्दी में स्पष्ट रहता है।
- source_word: עִזְבוֹנָיִךְ
  choice: तेरे माल
  rationale: इस अध्याय के वाणिज्यिक प्रसंग में संज्ञा का अर्थ व्यापारिक माल या वस्तुएँ है। ‘माल’ सरल, वर्तमान और प्रसंगानुकूल है।
theological_decisions:
- issue: פָּרָשִׁים का संदर्भ मनुष्य से है या घोड़ों से
  choice: मुख्य पाठ में ‘घुड़सवार’
  alternative: ‘युद्ध के घोड़े’ या ‘घुड़सवारी के घोड़े’
  rationale: शब्द प्रायः सवारों या अश्वारोही सैनिकों को दर्शाता है, जबकि आसपास पशुओं की व्यापार-सूची वैकल्पिक अश्व-संबंधी अर्थ का समर्थन कर सकती है। इसलिए अस्पष्टता को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी; व्यापार-सूची की संक्षिप्त शैली बनाए रखते हुए ‘तेरे’ का प्रयोग सोर नगर से किए गए एकवचन संबोधन के अनुरूप है।
