base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/027/035.yaml
  text: All the inhabitants of the coastlands are appalled at you[a], and their kings shudder with horror[c][b]; their faces are convulsed.
translation:
  language: hi
  text: समुद्री तटवर्ती प्रदेशों के सभी निवासी तेरे कारण स्तब्ध हैं[a]; उनके राजा भय से बुरी तरह काँप उठते हैं[b], और उनके चेहरे विकृत हो जाते हैं[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “द्वीपों के सभी निवासी।” इब्रानी शब्द का अर्थ द्वीप या अधिक व्यापक रूप से समुद्री तटवर्ती प्रदेश हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में क्रिया के साथ उसी मूल की संज्ञा का प्रयोग है, जो प्रतिक्रिया की अत्यधिक तीव्रता व्यक्त करता है।
    reason: lexical_alternative
  - marker: c
    text: अंतिम वाक्यांश कठिन है; अन्य सम्भव अनुवाद हैं, “उनके चेहरे काँपने लगते हैं” या “उनके चेहरे व्याकुल हो जाते हैं।”
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּל יֹשְׁבֵי הָאִיִּים
  choice: समुद्री तटवर्ती प्रदेशों के सभी निवासी
  rationale: אִיִּים द्वीपों के साथ व्यापक समुद्री तटवर्ती भूभागों को भी सूचित कर सकता है। सूर के समुद्री व्यापार के प्रसंग में यह चयन स्वाभाविक है, जबकि पादटिप्पणी संकीर्ण विकल्प सुरक्षित रखती है।
- source_word: שָׁמְמוּ עָלָיִךְ
  choice: तेरे कारण स्तब्ध हैं
  rationale: यह क्रिया यहाँ सूर के विनाश को देखकर उत्पन्न सदमे और विस्मय को व्यक्त करती है; עַל उस प्रतिक्रिया का कारण बताता है।
- source_word: שָׂעֲרוּ שַׂעַר
  choice: भय से बुरी तरह काँप उठते हैं
  rationale: एक ही मूल से बने क्रिया और संज्ञा का मेल प्रतिक्रिया की तीव्रता बढ़ाता है। हिन्दी में इसे स्वाभाविक ढंग से 'बुरी तरह' द्वारा व्यक्त किया गया है, और भय का भाव प्रसंगानुकूल है।
- source_word: רָעֲמוּ פָּנִים
  choice: उनके चेहरे विकृत हो जाते हैं
  rationale: यह कठिन इब्रानी पद चेहरे पर प्रकट हिंसक व्याकुलता या कंपकंपी का चित्र देता है। 'विकृत हो जाते हैं' उस दृश्यात्मक प्रभाव को बनाए रखता है, पर अन्य संभावनाएँ पादटिप्पणी में दी गई हैं।
