  yaml_path: translation/ot/ezekiel/027/036.yaml
  text: Merchants among the peoples hiss at you[a]; you have become a horror[b], and you will be no more forever.
translation:
  language: hi
  text: देश-देश के व्यापारी तुम पर सीटी बजाते हैं[a]; तुम आतंक की वस्तु बन गई हो[b], और फिर कभी नहीं रहोगी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तुम पर फुफकारते हैं।” इब्रानी क्रिया सीटी बजाने या फुफकारने का अर्थ दे सकती है; यहाँ यह विस्मय या उपहास की प्रतिक्रिया व्यक्त करती है।
    reason: lexical_alternative
  - marker: b
    text: या, “तुम भयावहता बन गई हो” अथवा “तुम आतंक बन गई हो।” इब्रानी संज्ञा बहुवचन रूप में है, पर उसका प्रयोग सामूहिक अर्थ में हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: סֹחֲרִים
  choice: व्यापारी
  rationale: यह סחר से बना कृदंत है और व्यापार करने वालों को दर्शाता है; सोर के व्यापार-विषयक विलाप में ‘व्यापारी’ स्वाभाविक है।
- source_word: בָּעַמִּים
  choice: देश-देश के
  rationale: बहुवचन עַמִּים अनेक जातीय समुदायों या देशों के लोगों की ओर संकेत करता है; इस प्रसंग में ‘देश-देश के व्यापारी’ आधुनिक हिन्दी में स्वाभाविक रूप से व्यापक अंतरराष्ट्रीय अर्थ देता है।
- source_word: שָׁרְקוּ עָלָיִךְ
  choice: तुम पर सीटी बजाते हैं
  rationale: שׁרק सीटी बजाने या फुफकारने जैसी ध्वनि को व्यक्त कर सकता है और यहाँ विस्मय अथवा उपहास की प्रतिक्रिया है; ‘तुम पर सीटी बजाते हैं’ अस्पष्टता को पादटिप्पणी सहित सहज हिन्दी में रखता है।
- source_word: בַּלָּהוֹת הָיִת
  choice: तुम भय का कारण बन गई हो
  rationale: बहुवचन בלהות का सामूहिक अर्थ भयावहता या आतंक की वस्तु हो सकता है। स्त्रीलिंग संबोधन के अनुरूप यह वाक्य सोर की परिणत दशा व्यक्त करता है।
- source_word: וְאֵינֵךְ עַד־עוֹלָם
  choice: और फिर कभी नहीं रहोगी
  rationale: नकारात्मक अस्तित्ववाचक रूप और עַד־עוֹלָם मिलकर स्थायी रूप से मिट जाने का भाव देते हैं; यह हिन्दी में कठोर भविष्यगत परिणाम को स्वाभाविक ढंग से व्यक्त करता है।
theological_decisions:
- issue: भविष्यद्वाणी के न्याय-वचन में अंतिम उपवाक्य का बल
  choice: ‘और फिर कभी नहीं रहोगी’ के द्वारा अपरिवर्तनीय अंत व्यक्त किया गया है।
  alternative: ‘और सदा के लिए तुम्हारा अस्तित्व नहीं रहेगा’
  rationale: इब्रानी नकारात्मक अस्तित्ववाचक अभिव्यक्ति के साथ עַד־עוֹלָם न्याय के स्थायी परिणाम पर बल देती है। अनुवाद वचन की कठोरता बनाए रखता है, पर इससे आगे कोई विशिष्ट आध्यात्मिक या तत्त्वमीमांसात्मक दावा नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सहज स्तर रखा गया है। सोर को संबोधन होने के कारण स्त्रीलिंग रूप ‘गई हो/रहोगी’ प्रयुक्त हैं। ‘देश-देश के’ ने विभिन्न लोगों/राष्ट्रों में फैले व्यापारियों का भाव स्वाभाविक हिन्दी में व्यक्त किया है।
