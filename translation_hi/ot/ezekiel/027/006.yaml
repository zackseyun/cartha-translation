translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। जहाज़-निर्माण की शब्दावली में ‘चप्पू’ और ‘तख़्ते’ जैसे परिचित शब्द चुने गए हैं। कठिन इब्रानी पदबंध को मुख्य पाठ में संदर्भानुकूल ढंग से व्यक्त किया गया है, पर उसकी वास्तविक अनिश्चितता पादटिप्पणी में स्पष्ट रूप से सुरक्षित है।
