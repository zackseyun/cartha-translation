source:
  edition: WLC
  text: אַלּוֹנִים֙ מִ/בָּ֔שָׁן עָשׂ֖וּ מִשּׁוֹטָ֑יִ/ךְ קַרְשֵׁ֤/ךְ עָֽשׂוּ שֵׁן֙ בַּת אֲשֻׁרִ֔ים מֵ/אִיֵּ֖י כתים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/027/006.yaml
  text: They made your oars of oaks from Bashan[c][b][a]; they made your deck of ivory from the coasts of Kittim.
translation:
  language: hi
  text: उन्होंने तेरे चप्पू बाशान के बलूत की लकड़ी से बनाए; तेरे जहाज़ के तख़्ते[a] उन्होंने कित्तीम के द्वीपों[c] से लाई हुई बक्स की लकड़ी में हाथीदाँत जड़कर बनाए[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘तेरा डेक’। इब्रानी शब्द जहाज़ के तख़्तों, पट्टों या उनसे बनी सतह को दर्शा सकता है।
    reason: lexical_alternative
  - marker: b
    text: यहाँ इब्रानी कठिन है; शाब्दिक रूप लगभग ‘हाथीदाँत, अश्शूरीम की पुत्री’ है। कई विद्वान इसे कित्तीम से आई बक्स, सरू या किसी अन्य बहुमूल्य लकड़ी में हाथीदाँत की जड़ाई का वर्णन मानते हैं।
    reason: alternative_reading
  - marker: c
    text: ‘कित्तीम’ संभवतः कुप्रुस या उसके आसपास के पश्चिमी समुद्री प्रदेशों को दर्शाता है; ‘द्वीपों’ का अर्थ ‘तटीय प्रदेशों’ भी हो सकता है।
    reason: cultural_note
lexical_decisions:
- source_word: אַלּוֹנִים
  choice: बलूत की लकड़ी
  rationale: यह शब्द बड़े, कठोर लकड़ी वाले वृक्षों के लिए प्रयुक्त होता है और ‘बलूत’ या ‘बांज’ हो सकता है। जहाज़ के चप्पुओं और बाशान के प्रसिद्ध वृक्षों के संदर्भ में ‘बलूत’ सहज और उपयुक्त है।
- source_word: מִבָּשָׁן
  choice: बाशान के
  rationale: यह लकड़ी के भौगोलिक स्रोत को बताता है; स्थान-नाम को प्रचलित हिन्दी रूप में रखा गया है।
- source_word: מִשּׁוֹטַיִךְ
  choice: तेरे चप्पू
  rationale: जहाज़ के रूपक में यह शब्द खेने के उपकरणों को दर्शाता है; आधुनिक हिन्दी में ‘चप्पू’ स्पष्ट और स्वाभाविक है।
- source_word: קַרְשֵׁךְ
  choice: तेरे जहाज़ के तख़्ते
  rationale: मूल संज्ञा तख़्तों या पट्टों को दर्शाती है। ‘जहाज़ के तख़्ते’ मूल अर्थ के निकट है और ‘डेक’ की अपेक्षा अनिश्चितता को कम नहीं करता।
- source_word: שֵׁן
  choice: हाथीदाँत
  rationale: शाब्दिक अर्थ ‘दाँत’ है, पर सामग्री के वर्णन में इसका स्थापित अर्थ हाथीदाँत है।
- source_word: בַּת אֲשֻׁרִים
  choice: बक्स की लकड़ी में ... जड़कर
  rationale: यह अत्यंत कठिन पदबंध है। जहाज़-निर्माण और विलासपूर्ण सजावट के संदर्भ में इसे प्रायः बक्स या किसी समान बहुमूल्य लकड़ी में हाथीदाँत की जड़ाई समझा जाता है। कठिन शाब्दिक रूप को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: מֵאִיֵּי כִתִּים
  choice: कित्तीम के द्वीपों से
  rationale: אִיִּים का सीधा अर्थ ‘द्वीप’ है, यद्यपि इसका आशय तटीय प्रदेश भी हो सकता है। कित्तीम को स्थान-नाम के रूप में लिप्यंतरित किया गया है।
