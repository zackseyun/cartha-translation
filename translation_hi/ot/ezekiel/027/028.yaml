- from: तेरे मल्लाहों[a] की पुकार की आवाज़ से नगर के बाहर की खुली भूमियाँ[b] काँप उठेंगी।
  to: तेरे मल्लाहों[a] की पुकार सुनकर बस्ती के आसपास की खुली भूमियाँ[b] काँप उठेंगी।
