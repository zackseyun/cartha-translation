  yaml_path: translation/ot/ezekiel/027/028.yaml
  text: At the sound of the cry of your pilots[b][a], the pasturelands will quake.
translation:
  language: hi
  text: तेरे मल्लाहों[a] की पुकार सुनकर बस्ती के आसपास की खुली भूमियाँ[b] काँप उठेंगी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘तेरे नाविकों’ या ‘तेरे खेने वालों’; इब्रानी शब्द जहाज़ पर काम करने वाले लोगों, और संदर्भ के अनुसार विशेष रूप से रस्सियाँ सँभालने वालों या खेने वालों, के लिए प्रयुक्त हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या ‘चरागाह’ अथवा ‘खुली/सामुदायिक भूमि’; इब्रानी शब्द बस्ती के चारों ओर की खुली भूमि को दर्शाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: לְקוֹל
  choice: की आवाज़ से
  rationale: קוֹל का अर्थ ‘आवाज़’ या ‘ध्वनि’ है; उपसर्ग לְ यहाँ उस आवाज़ के कारण या उसके सुनाई देते ही होने वाली प्रतिक्रिया बताता है।
- source_word: זַעֲקַת
  choice: पुकार
  rationale: זעק से बना यह शब्द संकट या व्यथा में उठी पुकार को व्यक्त करता है; विलाप के संदर्भ में ‘पुकार’ स्वाभाविक और गरिमापूर्ण है।
- source_word: חֹבְלָיִךְ
  choice: तेरे मल्लाहों
  rationale: समुद्री संदर्भ में यह शब्द रस्सियाँ सँभालनेवाले जहाज़ियों, नाविकों, खेनेवालों या कभी जहाज़ चलानेवालों के लिए प्रयुक्त हो सकता है। ‘मल्लाह’ व्यापक समुद्री अर्थ को स्वाभाविक हिन्दी में रखता है और अधिक विशिष्ट विकल्प पादटिप्पणी में दिए गए हैं।
- source_word: יִרְעֲשׁוּ
  choice: काँप उठेंगी
  rationale: רעש ज़ोर से हिलने या काँपने को दर्शाता है। ‘काँप उठेंगी’ भावी क्रिया और काव्यात्मक तीव्रता दोनों व्यक्त करता है।
- source_word: מִגְרֹשׁוֹת
  choice: नगर के बाहर की खुली भूमियाँ
  rationale: מִגְרָשׁ किसी बस्ती के चारों ओर की खुली, प्रायः चराई के काम आने वाली भूमि है। यह अनुवाद आधुनिक ‘उपनगर’ का भ्रामक आवासीय अर्थ लेने से बचाता है और मूल के बहुवचन को बनाए रखता है।
