base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/027/024.yaml
  text: They were your merchants in choice wares[a], in wraps of blue and embroidered cloth, and in treasuries of multicolored fabrics, bound with cords and secured[b], among your merchandise.
translation:
  language: hi
  text: 'वे उत्तम माल के व्यापार में तेरे व्यापारी थे: नीले कपड़े के लपेटों और कढ़ाईदार कपड़े में, तथा तरह-तरह के रंगीन कपड़ों के बहुमूल्य भंडारों[a] में, जो रस्सियों से बँधे और अच्छी तरह सुरक्षित[b] थे, तेरे माल में।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इस पदबंध का अर्थ अनिश्चित है; इसका अर्थ मूल्यवान भंडार, सन्दूक, या बहुरंगी कपड़ों के गट्ठर भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या “देवदार के सन्दूकों में रखे हुए” अथवा “देवदार से मढ़े हुए”; इब्रानी शब्द का अर्थ अनिश्चित है।
    reason: alternative_reading
lexical_decisions:
- source_word: רֹכְלַיִךְ
  choice: तुझसे ... व्यापार करते थे
  rationale: यह पद सूर नगर को स्त्रीलिंग एकवचन में संबोधित करता है। हिन्दी में शाब्दिक ‘तेरे व्यापारी थे’ के बजाय यह प्रयोग व्यापारिक संबंध को स्वाभाविक और स्पष्ट ढंग से व्यक्त करता है।
- source_word: מַכְלֻלִים
  choice: उत्तम माल
  rationale: व्यापार-सूची में यह शब्द बढ़िया, चुनिंदा या मूल्यवान तैयार वस्तुओं की ओर संकेत करता है; ‘उत्तम माल’ संक्षिप्त और सहज है।
- source_word: גְלוֹמֵי תְּכֵלֶת
  choice: नीले ... कपड़े के लपेटों
  rationale: גלמים संभवतः लपेटे या गट्ठर जैसे वस्त्र-माल को और תכלת नीले अथवा नील-बैंगनी रंग को दर्शाता है। ‘नीले कपड़े के लपेटे’ वस्त्र और पैकिंग दोनों भाव बनाए रखता है।
- source_word: רִקְמָה
  choice: कढ़ाईदार कपड़ा
  rationale: व्यापार की वस्तुओं की सूची में यह कढ़ाई किए हुए वस्त्र या कपड़े को दर्शाता है।
- source_word: גִנְזֵי בְּרֹמִים
  choice: तरह-तरह के रंगीन कपड़ों के बहुमूल्य भंडार
  rationale: यह कठिन पदबंध मूल्यवान संचित या पैक किए हुए बहुरंगी वस्त्रों की ओर संकेत कर सकता है। अनिश्चितता को अत्यधिक विशिष्ट ‘सन्दूक’ बनाकर नहीं सुलझाया गया।
- source_word: חֲבָלִים חֲבֻשִׁים
  choice: रस्सियों से बँधे
  rationale: यह माल के गट्ठरों को डोरियों या रस्सियों से बाँधे जाने का स्पष्ट चित्र देता है।
- source_word: אֲרֻזִים
  choice: अच्छी तरह सुरक्षित
  rationale: संदर्भ में यह बँधे हुए माल की मजबूत पैकिंग या सुरक्षा का वर्णन कर सकता है; पर शब्द को देवदार से जोड़ने वाला वैकल्पिक अर्थ पादटिप्पणी में रखा गया है।
- source_word: מַרְכֻלְתֵּךְ
  choice: तेरे व्यापार का माल
  rationale: अध्याय के ठोस व्यापारिक संदर्भ में यह सूर की व्यापार-वस्तुओं या माल को दर्शाता है।
