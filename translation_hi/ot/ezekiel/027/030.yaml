revisions:
- from: वे तेरे लिए अपनी आवाज़ ऊँची करेंगे[a] और बिलखकर पुकारेंगे; वे अपने सिरों पर धूल डालेंगे और राख में लोटेंगे[b]।
  to: वे तेरे लिए अपनी आवाज़ सुनाएँगे[a] और बहुत दुःख से चिल्लाएँगे; वे अपने सिरों पर धूल डालेंगे और राख में लोटेंगे[b]।
  rationale: Opening clause revised to reflect the Hiphil ‘cause to be heard’ more closely, and the manner of crying revised to convey bitter grief without over-specifying it as sobbing. The remaining mourning imagery and the two footnote anchors are retained.
