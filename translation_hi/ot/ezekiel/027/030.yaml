source:
  edition: WLC
  text: וְ/הִשְׁמִ֤יעוּ עָלַ֨יִ/ךְ֙ בְּ/קוֹלָ֔/ם וְ/יִזְעֲק֖וּ מָרָ֑ה וְ/יַעֲל֤וּ עָֽפָר֙ עַל רָ֣אשֵׁי/הֶ֔ם בָּ/אֵ֖פֶר יִתְפַּלָּֽשׁוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/027/030.yaml
  text: They will make their voice heard over you and cry out bitterly[a]; they will throw dust on their heads[b]; they will roll in ashes.
translation:
  language: hi
  text: वे तेरे लिए अपनी आवाज़ सुनाएँगे[a] और बहुत दुःख से चिल्लाएँगे; वे अपने सिरों पर धूल डालेंगे और राख में लोटेंगे[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “वे तेरे ऊपर अपनी आवाज़ सुनाएँगे।”
    reason: עַל का स्थानिक रूप तथा विलाप में उसका ‘तेरे लिए/तेरे विषय में’ अर्थ दोनों संभव हैं।
  - marker: b
    text: या, “वे अपने आपको राख से ढक लेंगे।”
    reason: יִתְפַּלָּשׁוּ का इस शोक-संदर्भ में ‘राख में लोटना’ मुख्य अर्थ है; राख से अपने को ढक लेना एक प्रसंगानुकूल वैकल्पिक समझ है।
lexical_decisions:
- source_word: וְהִשְׁמִיעוּ עָלַיִךְ בְּקוֹלָם
  choice: वे तेरे लिए अपनी आवाज़ ऊँची करेंगे
  rationale: हिफ़ील रूप का मूल भाव ‘सुनाना/सुनाई देना’ है। हिंदी में ‘अपनी आवाज़ ऊँची करना’ स्वाभाविक रूप से ऊँचे स्वर में शोक प्रकट करने का भाव देता है। עָלַיִךְ को विलाप के प्रसंग में ‘तेरे लिए’ रखा गया है; उसका अधिक शाब्दिक रूप पादटिप्पणी में है।
- source_word: וְיִזְעֲקוּ מָרָה
  choice: और बिलखकर पुकारेंगे
  rationale: זעק ऊँची पुकार को और מָרָה उस पुकार के कटु दुःख को व्यक्त करता है। ‘बिलखकर पुकारेंगे’ आधुनिक हिंदी में इस शोकपूर्ण तीव्रता को संक्षेप और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: וְיַעֲלוּ עָפָר עַל רָאשֵׁיהֶם
  choice: वे अपने सिरों पर धूल डालेंगे
  rationale: עלה का सामान्य अर्थ ‘ऊपर चढ़ाना/लाना’ है, पर सिर पर धूल डालने की शोक-रीति के इस प्रसंग में ‘धूल डालेंगे’ स्पष्ट और स्वाभाविक है।
- source_word: בָּאֵפֶר יִתְפַּלָּשׁוּ
  choice: राख में लोटेंगे
  rationale: התפעל रूप यहाँ शोक में राख के भीतर लोटने या अपने को राख से ढक लेने की क्रिया बताता है। ‘राख में लोटेंगे’ चित्रात्मक और संदर्भानुकूल है; दूसरी सम्भव समझ पादटिप्पणी में दी गई है।
