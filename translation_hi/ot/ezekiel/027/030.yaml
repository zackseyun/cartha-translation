review_pass:
  verdict: revise
  source_fidelity: 'The mourning actions are conveyed accurately: dust is put on the heads and the mourners roll in ashes. The opening should retain the Hiphil sense of making their voice heard more directly than ‘अपनी आवाज़ ऊँची करेंगे’; and מָרָה is better rendered as intense grief rather than specifically sobbing.'
  naturalness: ‘तेरे लिए अपनी आवाज़ सुनाएँगे’ is idiomatic enough in a poetic lament and, with ‘बहुत दुःख से चिल्लाएँगे,’ reads naturally in modern formal Hindi. ‘राख में लोटेंगे’ is vivid, natural, and contextually appropriate.
  terminology: ‘धूल,’ ‘राख,’ and the direct singular address to Tyre are appropriate. The footnotes preserve the spatial/lamentative ambiguity of עָלַיִךְ and the contextual range of יִתְפַּלָּשׁוּ without introducing doctrinal interpretation.
  issues:
  - severity: medium
    issue: The opening ‘अपनी आवाज़ ऊँची करेंगे’ does not express the causative force of וְהִשְׁמִיעוּ as directly as the source.
    rationale: The Hebrew says that they cause their voice to be heard. Raising one’s voice can imply loudness, but need not state that their voice is made heard.
  - severity: low
    issue: ‘बिलखकर’ narrows the manner of the cry beyond מָרָה.
    rationale: The Hebrew indicates bitter or deeply grief-stricken crying; ‘बहुत दुःख से’ communicates this naturally without specifying sobbing.
  revised_text: वे तेरे लिए अपनी आवाज़ सुनाएँगे[a] और बहुत दुःख से चिल्लाएँगे; वे अपने सिरों पर धूल डालेंगे और राख में लोटेंगे[b]।
