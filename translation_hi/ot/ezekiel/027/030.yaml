  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘तेरे’ का प्रयोग सोर नगर को स्त्रीलिंग एकवचन संबोधन के रूप में करता है। समानांतर शोक-क्रियाओं की लय को अर्धविराम से बनाए रखा गया है।
