lexical_decisions:
- source_word: חָרָן
  choice: हारान
  rationale: स्थाननाम को प्रचलित हिन्दी बाइबलीय रूप में लिप्यंतरित किया गया है।
- source_word: כַנֵּה
  choice: कन्ने
  rationale: मसोरेटी व्यंजन-पाठ का सीधा लिप्यंतरण; ‘कल्ने’ पाठ-संबंधी पारंपरिक विकल्प के रूप में पादटिप्पणी में रखा गया है।
- source_word: עֶדֶן
  choice: एदेन
  rationale: यहाँ व्यापारिक स्थानों की सूची में स्थाननाम है, इसलिए इसका लिप्यंतरण किया गया है।
- source_word: רֹכְלֵי שְׁבָא
  choice: शेबा के व्यापारी
  rationale: निर्मित बहुवचन रूप का स्वाभाविक हिन्दी अनुवाद, जो व्यावसायिक व्यापारियों को सूचित करता है।
- source_word: אַשּׁוּר
  choice: अश्शूर
  rationale: हिब्रू नाम का निकट लिप्यंतरण रखा गया; संदर्भ में ‘अश्शूर देश’ भी संभव है।
- source_word: כִּלְמַד
  choice: किल्मद
  rationale: दुर्लभ और अनिश्चित स्थाननाम होने के कारण पारदर्शी लिप्यंतरण उपयुक्त है।
- source_word: רֹכַלְתֵּךְ
  choice: तेरे साथ व्यापार करते थे
  rationale: व्यापार-संबंधी अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है; एकवचन स्त्रीलिंग क्रिया संभवतः निकटवर्ती नाम-समूह को सामूहिक इकाई मानती है।
