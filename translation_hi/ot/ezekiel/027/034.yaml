  rationale: इब्रानी कालवाचक संज्ञा को स्पष्ट और स्वाभाविक हिन्दी सहसंबंधी रचना में रखा गया है।
- source_word: נִשְׁבֶּרֶת
  choice: तू ... तोड़ी गई
