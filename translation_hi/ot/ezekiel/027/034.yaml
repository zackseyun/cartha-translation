revisions:
- from: जिस समय तू समुद्रों के द्वारा गहरे जल में तोड़ी गई,[a] उस समय तेरी व्यापार-वस्तुएँ और तेरे भीतर की सारी भीड़ गिर पड़ी।[b]
  to: जिस समय समुद्रों ने तुझे जल की गहराइयों में तोड़ दिया,[a] तेरी व्यापार-वस्तुएँ और तेरा सारा समुदाय तेरे बीच में गिर पड़े।[b]
  rationale: The revision restores the explicit ‘depths of waters,’ makes the causal/agentive force of the seas idiomatic in Hindi, and renders the collective and its location as distinct source elements. It retains the direct feminine singular address, the broad commercial sense, and the deliberately non-specific ‘fell.’
  reviewer_model: gpt-5.6-terra
