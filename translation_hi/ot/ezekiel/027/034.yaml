- source_word: בְּמַעֲמַקֵּי מָיִם
  choice: गहरे जल में
  rationale: ‘जल की गहराइयों में’ के भाव को आधुनिक, सहज हिन्दी में व्यक्त करता है और समुद्री विनाश का बिंब बनाए रखता है।
- source_word: מַעֲרָבֵךְ
  choice: तेरी व्यापार-वस्तुएँ
  rationale: अध्याय के व्यापारिक संदर्भ में यह सूर के माल और व्यापार-सामग्री को व्यापक रूप से व्यक्त करता है।
- source_word: וְכָל קְהָלֵךְ
  choice: तेरे भीतर की सारी भीड़
  rationale: קהל के सामूहिक अर्थ को किसी एक समूह—जैसे नाविकों या व्यापारियों—तक सीमित किए बिना स्वाभाविक हिन्दी में रखता है।
- source_word: בְּתוֹכֵךְ
  choice: तेरे भीतर की
  rationale: नगर और जहाज़ के संयुक्त रूपक में भीतर उपस्थित समुदाय का स्थानिक भाव व्यक्त करता है।
- source_word: נָפָלוּ
  choice: गिर पड़ी
  rationale: मूल क्रिया נפל का सामान्य अर्थ रखा गया है; संदर्भ से डूबने और नाश होने का आशय उभरता है, पर उसे अनावश्यक रूप से स्पष्ट नहीं किया गया।
