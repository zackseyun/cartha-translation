base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/027/034.yaml
  text: At the time you were broken by the seas in the depths of the waters[b][a], your merchandise and all your assembly in your midst fell.
translation:
  language: hi
  text: जिस समय समुद्रों ने तुझे जल की गहराइयों में तोड़ दिया,[a] तेरी व्यापार-वस्तुएँ और तेरा सारा समुदाय तेरे बीच में गिर पड़े।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जब समुद्रों ने तुझे जल की गहराइयों में तोड़ दिया।”
    reason: lexical_alternative
  - marker: b
    text: “तेरा सारा समुदाय” से आशय सूर के भीतर इकट्ठे सभी लोगों—उसके निवासियों, व्यापारियों और समुद्री दल—से व्यापक रूप में हो सकता है।
    reason: lexical_alternative
