review_pass:
  verdict: revise
  source_fidelity: The draft correctly reflects the feminine singular address to Tyre, the plural ‘seas,’ the commercial term, and the final unqualified ‘fell.’ However, ‘गहरे जल में’ weakens the construct phrase ‘in the depths of waters,’ and ‘तेरे भीतर की सारी भीड़’ awkwardly attaches ‘within you’ to the collective rather than preserving the Hebrew sequence and scope.
  naturalness: ‘समुद्रों के द्वारा ... तोड़ी गई’ is overly mechanical in modern Hindi, and ‘तेरे भीतर की सारी भीड़’ is less natural than a direct collective noun followed by ‘तेरे बीच में.’
  terminology: ‘व्यापार-वस्तुएँ’ adequately conveys Tyre’s goods/cargo. ‘समुदाय’ is a broad, non-sectarian rendering for קָהָל and avoids both the potentially ecclesial ‘सभा’ and the less precise ‘भीड़.’
  issues:
  - severity: medium
    issue: The phrase for בְּמַעֲמַקֵּי מָיִם is compressed.
    rationale: ‘गहरे जल में’ conveys deep water but not specifically ‘in the depths of waters.’ ‘जल की गहराइयों में’ preserves the source image more fully.
  - severity: medium
    issue: The rendering and placement of ‘तेरे भीतर की सारी भीड़’ are imprecise and stylistically awkward.
    rationale: कָּל־קְהָלֵךְ denotes Tyre’s entire gathered community/company, while בְּתוֹכֵךְ separately locates it within Tyre. ‘तेरा सारा समुदाय तेरे बीच में’ preserves both elements without narrowing the referent.
  - severity: low
    issue: The passive instrumental expression is stiff Hindi.
    rationale: Using ‘समुद्रों ने तुझे ... तोड़ दिया’ naturally expresses the destructive agency/cause allowed by מִן with the passive Hebrew verb, without adding maritime-specific ‘wrecked’ language.
  revised_text: जिस समय समुद्रों ने तुझे जल की गहराइयों में तोड़ दिया,[a] तेरी व्यापार-वस्तुएँ और तेरा सारा समुदाय तेरे बीच में गिर पड़े।[b]
