  text: רֹכְלֵ֤י שְׁבָא֙ וְ/רַעְמָ֔ה הֵ֖מָּה רֹכְלָ֑יִ/ךְ בְּ/רֹ֨אשׁ כָּל בֹּ֜שֶׂם וּ/בְ/כָל אֶ֤בֶן יְקָרָה֙ וְ/זָהָ֔ב נָתְנ֖וּ עִזְבוֹנָֽיִ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/027/022.yaml
  text: The merchants of Sheba and Raamah—they were your merchants; with the finest of every spice[a], with every precious stone, and gold, they paid for your wares.
translation:
  language: hi
  text: शबा और रामाह के व्यापारी ही तेरे व्यापारी थे; वे हर प्रकार के उत्तम सुगंध-द्रव्य, हर प्रकार के बहुमूल्य रत्न और सोना तेरे माल के बदले देते थे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: רֹכְלֵי שְׁבָא וְרַעְמָה
  choice: शबा और रामाह के व्यापारी
  rationale: रֹכְלֵי व्यापार में लगे लोगों को दर्शाता है; आधुनिक हिन्दी में ‘व्यापारी’ स्वाभाविक है। स्थान-नामों को प्रचलित बाइबलीय रूप में लिप्यंतरित किया गया है।
- source_word: הֵמָּה רֹכְלָיִךְ
  choice: तेरे व्यापारी थे
  rationale: स्वतंत्र सर्वनाम הֵמָּה कर्ता पर बल देता है। हिन्दी वाक्य-विन्यास में इसे स्वाभाविक रखते हुए ‘तेरे व्यापारी थे’ से व्यक्त किया गया है। स्त्रीलिंग एकवचन प्रत्यय सोर नगर को संबोधित करता है।
- source_word: בְּרֹאשׁ כָּל בֹּשֶׂם
  choice: हर प्रकार के उत्तम सुगंध-द्रव्य
  rationale: רֹאשׁ का यहाँ मुहावरेदार अर्थ सर्वोत्तम या चुना हुआ है, और בֹּשֶׂם सुगंधित मसालों अथवा इत्र-सामग्री का व्यापक बोध देता है। ‘सुगंध-द्रव्य’ इस विलास-वस्तु वर्ग को अनावश्यक रूप से केवल मसालों तक सीमित नहीं करता।
- source_word: וּבְכָל אֶבֶן יְקָרָה
  choice: हर प्रकार के बहुमूल्य रत्न
  rationale: एकवचन सामूहिक पद אֶבֶן יְקָרָה को हिन्दी में वस्तु-वर्ग के रूप में बहुवचन ‘बहुमूल्य रत्न’ कहना सहज है; כָּל का भाव ‘हर प्रकार के’ से स्पष्ट होता है।
- source_word: וְזָהָב
  choice: और सोना
  rationale: व्यापार-सामग्री का सीधा और स्वाभाविक हिन्दी रूप।
- source_word: נָתְנוּ עִזְבוֹנָיִךְ
  choice: देकर तेरे माल का व्यापार करते थे
  rationale: נָתְנוּ का मूल अर्थ ‘उन्होंने दिया’ है, जबकि עִזְבוֹן इस अध्याय में व्यापार का माल है। केवल ‘कीमत चुकाई’ कहने के बजाय यह रूप ‘देने’ का शाब्दिक भाव बनाए रखता और वाणिज्यिक विनिमय को स्पष्ट करता है।
theological_decisions: []
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सरल व्यापारिक शब्द-विन्यास अपनाया गया है। सोर को संबोधन मूल में एकवचन स्त्रीलिंग है; हिन्दी में नगर के सीधे संबोधन के अनुरूप ‘तेरे’ रखा गया है।
