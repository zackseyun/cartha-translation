lexical_decisions:
- source_word: וַיְהִי
  choice: आया
  rationale: यहाँ היה का वाव-क्रमिक रूप भविष्यद्वाणी के अगले प्रसंग को आरम्भ करने वाला प्रचलित कथात्मक सूत्र है। हिन्दी में इसे अलग से ‘और ऐसा हुआ’ कहने के बजाय मुख्य वाक्य की क्रिया ‘आया’ में समाहित करना स्वाभाविक है।
- source_word: דְבַר
  choice: वचन
  rationale: דְבַר יְהוָה भविष्यद्वाणी का स्थापित सूत्र है। ‘वचन’ मूल शब्द और उसके धार्मिक-साहित्यिक महत्व को सुरक्षित रखता है; ‘संदेश’ अपेक्षाकृत अधिक व्याख्यात्मक होता।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय परमेश्वर-नाम YHWH को उपाधि से बदलने के बजाय हिन्दी में उसके प्रचलित विद्वत्तापूर्ण उच्चारण के निकट लिप्यंतरित किया गया है।
- source_word: אֵלַי
  choice: मेरे पास
  rationale: पूर्वसर्ग אֶל और प्रथम पुरुष एकवचन प्रत्यय वचन के नबी की ओर आने को बताते हैं। इस सूत्र में ‘मेरे पास’ सहज आधुनिक हिन्दी है।
- source_word: לֵאמֹר
  choice: ':'
  rationale: यह क्रियार्थक रूप आगे आने वाले प्रत्यक्ष कथन का परिचय देता है। हिन्दी में ‘यह कहते हुए’ अस्वाभाविक लगेगा; विसर्ग अगले पद में आने वाले कथन को स्पष्ट और संक्षिप्त ढंग से प्रस्तुत करता है।
theological_decisions:
- issue: परमेश्वर के नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: प्रभु; यहोवा
  rationale: मूल पाठ में उपाधि नहीं, परमेश्वर का विशिष्ट नाम YHWH है। ‘याहवे’ उस नाम को नाम के रूप में सुरक्षित रखता है। पादटिप्पणी पारंपरिक अनुवाद और अन्य प्रचलित लिप्यंतरण की जानकारी देती है, बिना पाठ में किसी एक परंपरा को चुपचाप आरोपित किए।
translation_notes:
  register: सरल, गरिमापूर्ण आधुनिक मानक हिन्दी। भविष्यद्वाणी के सूत्र को स्वाभाविक रखने के लिए संयोजक का अलग अनुवाद नहीं किया गया और לֵאמֹר को प्रत्यक्ष कथन आरम्भ करने वाले विसर्ग से व्यक्त किया गया है।
