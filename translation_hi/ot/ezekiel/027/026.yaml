  yaml_path: translation/ot/ezekiel/027/026.yaml
  text: Into great waters your rowers brought you[b][a]; the east wind shattered you in the heart of the seas.
translation:
  language: hi
  text: तेरे खेने वाले तुझे विशाल जलराशि में ले आए[a]; पुरवाई ने तुझे समुद्रों के बीचों-बीच चकनाचूर कर दिया[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘विशाल जलराशि पर’ अथवा ‘बहुत से जलों में।’ इब्रानी संबंधबोधक उपसर्ग के कई अर्थ हो सकते हैं, पर ‘ले आए’ में निहित गति के कारण यहाँ गंतव्य का भाव अधिक उपयुक्त है।
    reason: lexical_alternative
  - marker: b
