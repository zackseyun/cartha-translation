    reason: lexical_alternative
lexical_decisions:
- source_word: בְּמַיִם רַבִּים
  choice: विशाल जलराशि में
  rationale: ב गति-सूचक הֱבִיאוּךְ के साथ गंतव्य का भाव देता है। מַיִם רַבִּים यहाँ पानी की विशालता और खुले, गहरे समुद्री क्षेत्र को व्यक्त करता है; इसलिए शाब्दिक ‘बहुत से जल’ की अपेक्षा ‘विशाल जलराशि’ अधिक स्वाभाविक है।
- source_word: הֱבִיאוּךְ
  choice: तुझे ... ले आए
  rationale: हिफ़ील रूप का मूल अर्थ ‘लाना/ले आना’ है। सामान्य भूतकाल भविष्यद्वाणी के इस विलाप के अनुकूल है।
- source_word: הַשָּׁטִים אֹתָךְ
  choice: तेरे खेनेवाले
  rationale: समुद्री प्रसंग में यह कृदंत नाव या जहाज़ को चप्पुओं से चलानेवालों का बोध कराता है। ‘तेरे’ संबोधन और व्यक्तिरूप जहाज़ से उनका संबंध स्वाभाविक रूप से स्पष्ट करता है।
- source_word: רוּחַ הַקָּדִים
  choice: पुरवाई
  rationale: यह निश्चित पूर्वी हवा है, जो भविष्यद्वाणी की काव्यात्मक भाषा में विनाशकारी हवा के रूप में जानी-पहचानी है। ‘पुरवाई’ आधुनिक हिन्दी में संक्षिप्त और काव्यात्मक है।
- source_word: שְׁבָרֵךְ
  choice: तुझे ... चकनाचूर कर दिया
  rationale: שׁבר यहाँ जहाज़ को हिंसापूर्वक तोड़ डालने का अर्थ देता है। ‘चकनाचूर’ विनाश की तीव्रता और जहाज़ टूटने के बिंब को व्यक्त करता है।
- source_word: בְּלֵב יַמִּים
  choice: समुद्रों के बीचों-बीच
  rationale: לֵב का शाब्दिक अर्थ ‘हृदय’ है, पर यहाँ मुहावरे के रूप में भीतरी या मध्य भाग का बोध है। ‘बीचों-बीच’ हिन्दी में यही आशय स्वाभाविक ढंग से देता है और יַמִּים के बहुवचन को बनाए रखता है।
