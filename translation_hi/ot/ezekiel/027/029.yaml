- source_word: וְיָרְדוּ
  choice: उतरेंगे
  rationale: समुद्री जहाज़ों से भूमि की ओर होने वाली गति के लिए सरल और स्वाभाविक हिन्दी; भविष्यकाल इस भविष्यसूचक विलाप के प्रसंग के अनुकूल है।
- source_word: מֵאָנִיּוֹתֵיהֶם
  choice: अपने जहाज़ों से
