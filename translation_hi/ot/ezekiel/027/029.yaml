- source_word: מַלָּחִים
  choice: नाविक
  rationale: आधुनिक मानक हिन्दी में sailors के लिए स्पष्ट, संक्षिप्त और सम्मानित शब्द।
- source_word: כֹּל חֹבְלֵי הַיָּם
  choice: समुद्र में जहाज़ चलानेवाले सभी लोग
  rationale: व्यापक समुद्री कर्मियों का अर्थ व्यक्त करते हुए पहले पद ‘नाविक’ के साथ इब्रानी समानांतरता और विस्तार बनाए रखता है।
- source_word: אֶל הָאָרֶץ
  choice: सूखी भूमि पर
  rationale: जहाज़ और समुद्र के विपरीत स्थल का आशय स्पष्ट करता है; ‘किनारे पर’ की अपेक्षा मूल ‘भूमि’ के निकट रहता है।
- source_word: יַעֲמֹדוּ
  choice: खड़े होंगे
  rationale: עמד के मूल अर्थ को सीधे और बिना अतिरिक्त व्याख्या के प्रस्तुत करता है।
