  register: भाषा आधुनिक, गरिमापूर्ण और काव्यात्मक रखी गई है। ‘शोकगीत छेड़ेंगे’ औपचारिक विलाप के भाव को साधारण पाठक के लिए स्वाभाविक बनाता है। कठिन इब्रानी रूपों को मुख्य पाठ में अत्यधिक स्पष्ट किए बिना उनकी अनिश्चितता पादटिप्पणियों में सुरक्षित रखी गई है।
