  text: וְ/נָשְׂא֨וּ אֵלַ֤יִ/ךְ בְּ/נִי/הֶם֙ קִינָ֔ה וְ/קוֹנְנ֖וּ עָלָ֑יִ/ךְ מִ֣י כְ/צ֔וֹר כְּ/דֻמָ֖ה בְּ/ת֥וֹךְ הַ/יָּֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/027/032.yaml
  text: 'They will raise a lamentation over you in their wailing[a], and they will lament over you: ‘Who is like Tyre[b], silenced in the midst of the sea?’'
translation:
  language: hi
  text: 'वे अपने विलाप में[a] तुम्हारे लिए शोकगीत गाएँगे और तुम पर विलाप करेंगे:


    ‘सोर के समान कौन है,

    जो समुद्र के बीच मौन कर दी गई है?’[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यह इब्रानी वाक्यांश पाठ और शब्दार्थ की दृष्टि से कठिन है। मसोराई पाठ को शाब्दिक रूप से ‘उनके पुत्र’ भी समझा जा सकता है; विलाप का प्रसंग शोकपूर्ण विलाप का अर्थ लेने के पक्ष में है।
    reason: textual_variant
  - marker: b
    text: या, ‘जो समुद्र के बीच निस्तब्ध कर दी गई है’ अथवा ‘जो समुद्र के बीच उजाड़ दी गई है।’ इब्रानी शब्द शांत, मौन, या उजाड़ कर दिए जाने का भाव दे सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָשְׂאוּ ... קִינָה
  choice: शोकगीत छेड़ेंगे
  rationale: נשא के साथ קינה शोकगीत आरम्भ करने या गाने का मुहावरा है। ‘शोकगीत छेड़ेंगे’ इस क्रिया को स्वाभाविक हिन्दी में व्यक्त करता है और गीतात्मक भाव बनाए रखता है।
- source_word: אֵלַיִךְ
  choice: तुम्हारे लिए
  rationale: विलाप के प्रसंग में אל उस व्यक्ति या नगर की ओर निर्देशित शोकगीत को दर्शाता है; हिन्दी में ‘तुम्हारे लिए’ सहज है।
- source_word: בְּנִיהֶם
  choice: अपने रोने-बिलखने के बीच
  rationale: मसोराई रूप शाब्दिक रूप से ‘उनके पुत्रों के साथ/में’ समझा जा सकता है, पर पाठ और शब्दार्थ कठिन हैं। आसपास के קינה और קוננו के कारण मुख्य पाठ में शोकपूर्ण पुकार का अर्थ लिया गया है, जबकि पादटिप्पणी वास्तविक अनिश्चितता सुरक्षित रखती है।
- source_word: וְקוֹנְנוּ עָלָיִךְ
  choice: और तुम पर विलाप करेंगे
  rationale: קונן औपचारिक विलाप करने को बताता है और על के साथ ‘तुम पर विलाप’ हिन्दी की स्वाभाविक शोक-अभिव्यक्ति है।
- source_word: מִי כְצוֹר
  choice: सोर के समान कौन है
  rationale: तुलनात्मक प्रश्न को निकटता से रखा गया है और צור के लिए हिन्दी में प्रचलित बाइबलीय नाम ‘सोर’ अपनाया गया है।
- source_word: כְּדֻמָה
  choice: जिसे ... मौन कर दिया गया है
  rationale: यह कठिन रूप शांत, निस्तब्ध या उजाड़ कर दिए जाने का भाव दे सकता है। ‘मौन कर दिया गया’ समुद्री नगर के पतन की काव्यात्मक छवि रखता है, पर पूर्ण विनाश का अर्थ अनावश्यक रूप से निश्चित नहीं करता।
- source_word: בְּתוֹךְ הַיָּם
  choice: समुद्र के बीच
  rationale: यह मूल की समुद्री स्थिति और काव्यात्मक बल को संक्षिप्त, स्वाभाविक हिन्दी में बनाए रखता है।
