base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/027/005.yaml
  text: With cypresses from Senir they built all your planking[b][a]; they took a cedar from Lebanon to make a mast for you.
translation:
  language: hi
  text: सनीर[a] के सरू-वृक्षों[b] से उन्होंने तुम्हारी सारी तख़्तियाँ बनाईं; तुम्हारे लिए मस्तूल बनाने को उन्होंने लबानोन से देवदार की लकड़ी ली।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: सनीर, हर्मोन पर्वत से जुड़ा एक क्षेत्रीय नाम है (देखें व्यवस्थाविवरण 3:9)।
    reason: cross_reference
  - marker: b
    text: या “जुनिपर-वृक्ष” अथवा “फर-वृक्ष”; इब्रानी शब्द בְּרוֹשִׁים से अभिप्रेत वृक्ष की ठीक प्रजाति अनिश्चित है।
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּרוֹשִׁים
  choice: सरू-वृक्षों
  rationale: यह इब्रानी शब्द किसी शंकुधारी वृक्ष को सूचित करता है, पर उसकी ठीक प्रजाति अनिश्चित है। ‘सरू-वृक्ष’ जहाज़ बनाने योग्य लकड़ी के इस प्रसंग में स्वाभाविक और प्रचलित हिन्दी पर्याय है; अन्य सम्भावनाएँ पादटिप्पणी में दी गई हैं।
- source_word: מִשְּׂנִיר
  choice: सनीर से
  rationale: यह हर्मोन पर्वत से जुड़ा क्षेत्रीय स्थान-नाम है; इसलिए इसका अनुवाद करने के बजाय हिन्दी में लिप्यंतरण किया गया है।
- source_word: בָּנוּ לָךְ אֵת כָּל לֻחֹתָיִם
  choice: उन्होंने तुम्हारी सारी तख़्तियाँ बनाईं
  rationale: בנה का मूल भाव ‘बनाना/निर्माण करना’ है और לוּחַ जहाज़ के प्रसंग में लकड़ी की तख़्ती है। हिन्दी में ‘तुम्हारी’ जहाज़ के रूप में संबोधित सोर के स्त्रीलिंग एकवचन संबंध को स्वाभाविक ढंग से व्यक्त करता है; לָךְ का हितार्थक भाव पूरे वाक्य और संबोधन में निहित है।
- source_word: אֶרֶז מִלְּבָנוֹן
  choice: लबानोन से देवदार का एक पेड़
  rationale: एकवचन אֶרֶז को ठोस रूप में ‘देवदार का एक पेड़’ कहा गया है, क्योंकि अगली पंक्ति में उसी से एक मस्तूल बनाया जाता है।
- source_word: לָקָחוּ
  choice: उन्होंने ... लिया
  rationale: לקח का सीधा अर्थ ‘लेना’ है; यह इब्रानी की क्रिया-श्रृंखला को बिना अनावश्यक विस्तार के बनाए रखता है।
- source_word: לַעֲשׂוֹת תֹּרֶן עָלָיִךְ
  choice: तुम्हारे लिए मस्तूल बनाने को
  rationale: תֹּרֶן का अर्थ ‘मस्तूल’ है। עָלָיִךְ का शब्दशः भाव ‘तुम पर’ हो सकता है, किंतु जहाज़ के अंग के निर्माण के संदर्भ में हिन्दी का ‘तुम्हारे लिए’ अधिक स्वाभाविक है और स्त्रीलिंग एकवचन संबोधन को सुरक्षित रखता है।
