- source_word: לְרִכְבָּה
  choice: सवारी के लिए
  rationale: רכב से बना यह पद सवारी या उससे जुड़े उपयोग को व्यापक रूप से बताता है; मूल में घोड़े अथवा रथ का स्पष्ट उल्लेख न होने के कारण उन्हें नहीं जोड़ा गया।
