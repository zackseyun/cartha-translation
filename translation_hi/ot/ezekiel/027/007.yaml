base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/027/007.yaml
  text: Fine embroidered linen from Egypt was your sail[a], serving as your banner[b]; blue and purple from the coasts of Elishah was your covering.
translation:
  language: hi
  text: मिस्र से आया महीन कढ़ाईदार सन का कपड़ा तेरा पाल था, जो तेरे लिए ध्वज[a] का काम करता था; एलीशा के तटवर्ती प्रदेशों[b] से आया नीला और बैंगनी कपड़ा तेरा आच्छादन था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “पताका” अथवा “संकेत।” इब्रानी शब्द दूर से दिखाई देने वाले ध्वज, पताका या संकेत को दर्शा सकता है।
    reason: lexical_alternative
  - marker: b
    text: या “एलीशा के द्वीपों।” इब्रानी शब्द द्वीपों या समुद्रतटीय प्रदेशों, दोनों के लिए प्रयुक्त हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: שֵׁשׁ בְּרִקְמָה
  choice: कढ़ाईदार बारीक मलमल
  rationale: שֵׁשׁ उच्च कोटि के महीन सन के वस्त्र को और רִקְמָה कढ़ाई अथवा रंग-बिरंगी बुनावट वाले काम को दर्शाता है। यह प्रयोग विलासपूर्ण वस्त्र और उसकी कारीगरी, दोनों को सहज हिन्दी में व्यक्त करता है।
- source_word: מִמִּצְרַיִם
  choice: मिस्र का
  rationale: यह वस्त्र के भौगोलिक उद्गम को सीधे व्यक्त करता है।
- source_word: מִפְרָשֵׂךְ
  choice: तेरा पाल
  rationale: सोर को जहाज़ के रूप में चित्रित करने वाले संदर्भ में מִפְרָשׂ का स्वाभाविक नौकायन-संबंधी अर्थ ‘पाल’ है।
- source_word: לִהְיוֹת לָךְ לְנֵס
  choice: तेरे लिए झंडे का काम करता था
  rationale: נֵס दूर से दिखाई देने वाले झंडे, ध्वज अथवा संकेत को दर्शा सकता है। ‘झंडे का काम करता था’ पाल के प्रतीक और दृश्य संकेत के रूप में कार्य करने की बात बनाए रखता है।
- source_word: תְּכֵלֶת וְאַרְגָּמָן
  choice: नीला और बैंगनी कपड़ा
  rationale: ये शब्द क्रमशः नीले अथवा नील-बैंगनी और बैंगनी रंग के बहुमूल्य रंगे हुए वस्त्र को दर्शाते हैं। ‘कपड़ा’ जोड़ने से हिन्दी में स्पष्ट होता है कि रंगों से वस्त्र अभिप्रेत है।
- source_word: מֵאִיֵּי אֱלִישָׁה
  choice: एलीशा के तटवर्ती प्रदेशों से
  rationale: אִיִּים का अर्थ द्वीप या समुद्रतटीय प्रदेश, दोनों हो सकता है। व्यापार और समुद्री संदर्भ में ‘तटवर्ती प्रदेश’ स्वाभाविक है, जबकि दूसरा अर्थ पाद-टिप्पणी में सुरक्षित है।
- source_word: מְכַסֵּךְ
  choice: तेरा आच्छादन
  rationale: यह जहाज़ को ढकने वाले आवरण को दर्शाता है। ‘आच्छादन’ मूल की व्यापकता बनाए रखता है और बिना पर्याप्त आधार इसे किसी विशेष नौकायन उपकरण तक सीमित नहीं करता।
