  choice: तेरे मल्लाह
  rationale: שָׁטִים यहाँ जहाज़ को चप्पुओं से चलाने वालों को दर्शाता है। ‘मल्लाह’ सामान्य हिन्दी में सुबोध और समुद्री रूपक के अनुकूल है; לָךְ का संबंधपरक भाव ‘तेरे’ से व्यक्त हुआ है।
- source_word: חֲכָמַיִךְ
  choice: तेरे कुशल जन[a]
  rationale: חכם बुद्धिमान होने के साथ किसी कार्य में निपुण व्यक्ति को भी सूचित कर सकता है। समुद्री प्रसंग में ‘कुशल जन’ तकनीकी दक्षता को स्वाभाविक हिन्दी में व्यक्त करता है, जबकि पादटिप्पणी शाब्दिक विकल्प सुरक्षित रखती है।
- source_word: צוֹר
  choice: हे सोर
  rationale: संज्ञा यहाँ सीधे संबोधन में है; हिन्दी में संबोधन को स्पष्ट करने के लिए ‘हे’ जोड़ा गया है।
- source_word: בָךְ
  choice: तेरे भीतर
  rationale: सोर को जहाज़ के रूप में चित्रित किया गया है; ‘तेरे भीतर’ नगर-जहाज़ में उपस्थित होने का स्थानगत भाव बनाए रखता है।
- source_word: הֵמָּה חֹבְלָיִךְ
  choice: वे ही तेरे कर्णधार थे
  rationale: הֵמָּה का बल ‘वे ही’ से व्यक्त किया गया है। חֹבְלָיִךְ जहाज़ को संभालने या दिशा देने वाले नाविकों के लिए प्रयुक्त हो सकता है; ‘कर्णधार’ इस प्रसंग में चालक/नियामक की भूमिका स्पष्ट करता है और पहले आए मल्लाहों से भेद बनाए रखता है।
