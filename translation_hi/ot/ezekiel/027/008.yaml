lexical_decisions:
- source_word: יֹשְׁבֵי צִידוֹן וְאַרְוַד
  choice: सीदोन और अरवद के निवासी
  rationale: Construct participle יֹשְׁבֵי को आधुनिक हिन्दी में स्वाभाविक रूप से ‘निवासी’ कहा गया है; दोनों स्थान-नामों के प्रचलित हिन्दी रूप रखे गए हैं।
