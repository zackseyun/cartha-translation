lexical_decisions:
- source_word: בְּלֵב
  choice: हृदय में
  rationale: לֵב का मूल अर्थ ‘हृदय’ है और स्थानसूचक प्रयोग में यह भीतरी या मध्य भाग को दर्शाता है। ‘हृदय में’ इब्रानी के सजीव रूपक को बनाए रखता है और हिन्दी में काव्यात्मक पर स्वाभाविक है।
- source_word: יַמִּים
  choice: समुद्रों
  rationale: इब्रानी शब्द बहुवचन है; ‘समुद्रों’ उसी रूप और सोर के समुद्री चित्रण को सुरक्षित रखता है।
- source_word: גְּבוּלַיִךְ
  choice: तेरी सीमाएँ
  rationale: यह शब्द सीमा, सरहद या भू-भाग का बोध करा सकता है। ‘सीमाएँ’ सबसे सीधा और इस संदर्भ में स्वाभाविक अनुवाद है।
- source_word: בֹּנַיִךְ
  choice: तेरे निर्माता
  rationale: शब्द का सीधा अर्थ ‘तेरे बनानेवाले/निर्माता’ है। संदर्भ में जहाज़ बनानेवाले अभिप्रेत हो सकते हैं, पर ‘निर्माता’ नगर और जहाज़—दोनों में निहित रूपक की व्यापकता बनाए रखता है।
- source_word: כָּלְלוּ
  choice: पूर्ण किया है
  rationale: क्रिया किसी वस्तु को पूरा करने या पूर्णता तक पहुँचाने का भाव देती है। ‘पूर्ण किया है’ सौंदर्य को उसके पूर्ण रूप तक पहुँचाने का भाव व्यक्त करता है और ‘पूरा किया’ के विकल्प को टिप्पणी में सुरक्षित रखता है।
- source_word: יָפְיֵךְ
  choice: तेरी सुंदरता
  rationale: ‘सुंदरता’ יֹפִי का सीधा, सहज हिन्दी अर्थ है और सोर के काव्यात्मक मानवीकरण को बनाए रखता है।
