lexical_decisions:
- source_word: וְלָקַחְתָּ
  choice: और ... लेना
  rationale: संयोजक वाव के साथ यह रूप भविष्यवाणी-संबंधी निर्देशों की क्रमिक शृंखला को आगे बढ़ाता है; हिन्दी में ‘लेना’ स्वाभाविक निर्देशात्मक बल रखता है।
- source_word: מִשָּׁם
  choice: वहाँ से
  rationale: मूल क्रियाविशेषण का सीधा अर्थ ‘वहाँ से’ है और यह पिछले पद में बताए गए बालों की ओर संकेत करता है।
- source_word: מְעַט בְּמִסְפָּר
  choice: थोड़े-से बाल गिनकर
  rationale: मूल पदबंध संख्या की अल्पता पर बल देता है। प्रसंग से कर्म ‘बाल’ स्पष्ट है; ‘गिनकर’ संख्या-संबंधी भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וְצַרְתָּ
  choice: बाँध लेना
  rationale: क्रिया बाँधने या सुरक्षित रूप से समेटने का भाव रखती है; बालों और वस्त्र के प्रतीकात्मक कार्य के संदर्भ में ‘बाँध लेना’ स्पष्ट है।
- source_word: אוֹתָם
  choice: उन्हें
  rationale: यह सर्वनाम चुने हुए थोड़े-से बालों की ओर लौटता है।
- source_word: בִּכְנָפֶיךָ
  choice: अपने वस्त्र के छोरों में
  rationale: כָּנָף का मूल अर्थ ‘पंख’ है, पर वस्त्र के लिए यह उसके छोर, किनारे या आँचल को सूचित करता है। ‘वस्त्र के छोरों’ से रूपक को गलत दिशा दिए बिना अर्थ स्पष्ट रहता है।
