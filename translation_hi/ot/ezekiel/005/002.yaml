  text: שְׁלִשִׁ֗ית בָּ/א֤וּר תַּבְעִיר֙ בְּ/ת֣וֹךְ הָ/עִ֔יר כִּ/מְלֹ֖את יְמֵ֣י הַ/מָּצ֑וֹר וְ/לָֽקַחְתָּ֣ אֶת הַ/שְּׁלִשִׁ֗ית תַּכֶּ֤ה בַ/חֶ֨רֶב֙ סְבִ֣יבוֹתֶ֔י/הָ וְ/הַ/שְּׁלִשִׁית֙ תִּזְרֶ֣ה לָ/ר֔וּחַ וְ/חֶ֖רֶב אָרִ֥יק אַחֲרֵי/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/005/002.yaml
  text: A third you shall burn in the fire in the midst of the city[a], when the days of the siege are completed; and you shall take a third and strike it with the sword all around the city, and a third you shall scatter to the wind[c][b], and I will draw out a sword after them.
translation:
  language: hi
  text: एक तिहाई को नगर के बीच आग में जला देना, जब घेराबंदी के दिन पूरे हो जाएँ[a]। फिर एक तिहाई को लेकर, नगर के चारों ओर उस पर तलवार से प्रहार करना, और एक तिहाई को हवा में बिखेर देना[b]। और मैं उनके पीछे तलवार खींचूँगा[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘जब घेराबंदी के दिन अपनी पूरी अवधि तक पहुँच जाएँ।’
    reason: lexical_alternative
  - marker: b
    text: या ‘हवाओं में बिखेर देना’; इब्रानी में ‘हवा’ एकवचन है।
    reason: lexical_alternative
  - marker: c
    text: या ‘मैं उनके पीछे तलवार म्यान से निकालूँगा।’
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁלִשִׁית / הַשְּׁלִשִׁית
  choice: एक तिहाई
  rationale: यह स्त्रीलिंग एकवचन रूप विभाजित बालों के तीन भागों में से प्रत्येक को सूचित करता है; ‘एक तिहाई’ स्वाभाविक हिन्दी है और तीन भागों की आवृत्ति बनाए रखता है।
- source_word: בָּאוּר תַּבְעִיר
  choice: आग में जला देना
  rationale: ב उपसर्ग यहाँ स्थान अथवा साधन का भाव दे सकता है और בער का हिफ़ील रूप जलाने का कारण बनने को व्यक्त करता है; हिन्दी में यह संयुक्त पद स्वाभाविक और स्पष्ट है।
- source_word: בְּתוֹךְ הָעִיר
  choice: नगर के बीच
  rationale: यह नगर के भीतर, मध्य में किए जाने वाले प्रतीकात्मक कार्य की स्थानिक छवि को बनाए रखता है।
- source_word: כִּמְלֹאת יְמֵי הַמָּצוֹר
  choice: जब घेराबंदी के दिन पूरे हो जाएँ
  rationale: כ के साथ infinitive construct समय-संबंधी परिस्थिति बताता है; यह अनुवाद निर्धारित अवधि के पूर्ण होने का भाव स्पष्ट रखता है।
- source_word: תַּכֶּה בַחֶרֶב
  choice: तलवार से मारना
  rationale: नכה यहाँ हथियार से प्रहार करने या मार गिराने का भाव रखता है; ‘मारना’ साधारण आधुनिक हिन्दी में पर्याप्त रूप से सशक्त है।
- source_word: סְבִיבוֹתֶיהָ
  choice: नगर के चारों ओर
  rationale: स्त्रीलिंग प्रत्यय निकटतम संदर्भ में नगर की ओर संकेत करता है; संज्ञा को दोहराने से हिन्दी में संदर्भ अस्पष्ट नहीं रहता।
- source_word: תִּזְרֶה לָרוּחַ
  choice: हवा में बिखेर देना
  rationale: זרה बिखेरने या फटककर उड़ाने का अर्थ देता है। एकवचन ‘हवा’ मूल के व्याकरण को बनाए रखता है और हिन्दी में स्वाभाविक है।
- source_word: וְחֶרֶב אָרִיק אַחֲרֵיהֶם
  choice: तब मैं उनके पीछे तलवार खींचूँगा
  rationale: אָרִיק प्रथम पुरुष एकवचन है और म्यान से तलवार खींचने की युद्ध-संबंधी छवि देता है; ‘उनके पीछे’ शत्रुतापूर्ण पीछा करने का भाव सुरक्षित रखता है।
theological_decisions:
- issue: अंतिम उपवाक्य में वक्ता का परिवर्तन
  choice: ‘तब मैं उनके पीछे तलवार खींचूँगा’ के रूप में प्रथम पुरुष का ईश्वरीय कथन बनाए रखा गया।
  alternative: इसे सामान्य या निर्वैयक्तिक न्याय-वर्णन बना देना।
  rationale: मूल में אָרִיק प्रथम पुरुष एकवचन है। यह यहेजकेल को दिए गए निर्देशों से स्वयं परमेश्वर की कार्रवाई की ओर जानबूझकर परिवर्तन दिखाता है; इसे बनाए रखने से प्रतीकात्मक कार्य और ईश्वरीय न्याय का संबंध स्पष्ट रहता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, स्पष्ट और मौखिक रूप से सहज शैली अपनाई गई है। भविष्यसूचक निर्देशों के लिए हिन्दी का infinitive आदेश-रूप प्रयोग किया गया है। ‘नगर’ और ‘घेराबंदी’ जैसे प्रचलित औपचारिक शब्द संदर्भ के अनुरूप हैं; अंतिम वाक्य में वक्ता का प्रथम पुरुष परिवर्तन स्पष्ट रखा गया है।
