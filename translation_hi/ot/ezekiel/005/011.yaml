  text: לָ/כֵ֣ן חַי אָ֗נִי נְאֻם֮ אֲדֹנָ֣/י יְהוִה֒ אִם לֹ֗א יַ֚עַן אֶת מִקְדָּשִׁ֣/י טִמֵּ֔את בְּ/כָל שִׁקּוּצַ֖יִ/ךְ וּ/בְ/כָל תּוֹעֲבֹתָ֑יִ/ךְ וְ/גַם אֲנִ֤י אֶגְרַע֙ וְ/לֹא תָח֣וֹס עֵינִ֔/י וְ/גַם אֲנִ֖י לֹ֥א אֶחְמֽוֹל־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/005/011.yaml
  text: Therefore[a], as I live, declares the Lord GOD, surely because you have defiled my sanctuary with all your detestable things and with all your abominations, I also will diminish you; my eye will not spare, and I also will show no pity.
translation:
  language: hi
  text: 'इसलिए, प्रभु यहोवा की यह घोषणा है: “मेरे जीवन की शपथ, निश्चय ही, क्योंकि तूने अपनी सारी घृणित वस्तुओं और अपने सारे घिनौने कामों से मेरे पवित्रस्थान को अशुद्ध किया है, इसलिए मैं भी तुझे घटा दूँगा[a]; मेरी आँख तरस नहीं खाएगी, और मैं भी दया नहीं करूँगा।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मैं भी कम करूँगा” अथवा “मैं भी काट डालूँगा।” इब्रानी क्रिया संक्षिप्त है और उसका कर्म स्पष्ट रूप से नहीं दिया गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: इसलिए
  rationale: यह पिछले प्रसंग के आधार पर आने वाले न्याय का निष्कर्ष प्रस्तुत करता है।
- source_word: חַי אָ֗נִי
  choice: मेरे जीवन की शपथ
  rationale: यह परमेश्वर की गंभीर आत्म-शपथ का स्वाभाविक और स्पष्ट हिन्दी रूप है।
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: प्रभु यहोवा की यह घोषणा है
  rationale: נְאֻם को भविष्यद्वाणी की घोषणा के रूप में और दोनों ईश्वरीय पदों को अलग-अलग सुरक्षित रखा गया है।
- source_word: אִם לֹא
  choice: निश्चयात्मक शपथ-वाक्य में निहित
  rationale: शपथ के प्रसंग में यह शाब्दिक शर्त नहीं, बल्कि आगामी कथन को दृढ़ करता है; हिन्दी में आत्म-शपथ और सीधे न्याय-वचन से यह बल स्वाभाविक रूप से व्यक्त होता है।
- source_word: מִקְדָּשִׁי
  choice: मेरे पवित्रस्थान
  rationale: यह उपासना के लिए अलग किए गए पवित्र स्थान का व्यापक धार्मिक अर्थ बनाए रखता है।
- source_word: טִמֵּאת
  choice: अशुद्ध किया है
  rationale: यह क्रिया धार्मिक और नैतिक अपवित्रता, दोनों का बोध कराती है।
- source_word: שִׁקּוּצַיִךְ
  choice: अपनी सारी घृणित वस्तुओं
  rationale: यह मूर्तियों अथवा अन्य घृणित वस्तुओं की सम्भावना बनाए रखता है और अगले समानार्थी पद से भेद करता है।
- source_word: תּוֹעֲבוֹתַיִךְ
  choice: अपने सारे घिनौने कामों
  rationale: यह घृणास्पद धार्मिक और नैतिक आचरण का स्वाभाविक आधुनिक हिन्दी रूप है।
- source_word: אֶגְרַע
  choice: मैं भी तुझे घटा दूँगा
  rationale: मूल क्रिया के ‘कम करना/घटा देना’ अर्थ को सुरक्षित रखता है; कर्म मूल में व्यक्त नहीं है, पर संबोधित नगर/समुदाय को हिन्दी में स्पष्ट किया गया है और अनिश्चितता पादटिप्पणी में रखी गई है।
- source_word: לֹא תָחוֹס עֵינִי
  choice: मेरी आँख तुझ पर तरस नहीं खाएगी
  rationale: हिब्रू की ‘मेरी आँख’ वाली सजीव छवि को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: לֹא אֶחְמוֹל
  choice: मैं भी दया नहीं करूँगा
  rationale: यह समानांतर पंक्ति में करुणा न दिखाने के अर्थ को स्पष्ट रखता है।
theological_decisions:
- issue: अֲדֹנָי יְהוִה में ईश्वरीय नाम का अनुवाद
  choice: प्रभु यहोवा
  alternative: प्रभु परमेश्वर
  rationale: व्यक्तिगत वाचा-नाम יהוה को ‘यहोवा’ के रूप में और אֲדֹנָי को ‘प्रभु’ के रूप में अलग-अलग सुरक्षित रखा गया है।
- issue: אֶגְרַע में ईश्वरीय न्याय की सटीक छटा
  choice: मैं भी तुझे घटा दूँगा
  alternative: मैं भी काट डालूँगा / मैं भी कम करूँगा
  rationale: क्रिया संक्षिप्त है और उसका कर्म मूल में अप्रकट है। मुख्य पाठ मूल अर्थ के निकट रहता है, जबकि पादटिप्पणी वैकल्पिक अर्थ और व्याकरणिक अस्पष्टता बताती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गंभीर भविष्यद्वाणीय शैली रखी गई है। एकवचन स्त्रीलिंग संबोधन ‘तू’ यरूशलेम के व्यक्तिकरण के अनुरूप है। वाक्य-विन्यास को पठनीय बनाया गया है, पर शपथ, न्याय और समानांतरता की मूल संरचना सुरक्षित है।
