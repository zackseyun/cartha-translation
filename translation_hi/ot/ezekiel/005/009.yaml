  text: And I will do in you what I have not done[a], and the like of which I will never do again, because of all your abominations.
translation:
  language: hi
  text: और मैं तेरे भीतर[a] वह करूँगा जो मैंने कभी नहीं किया, और जिसके समान फिर कभी नहीं करूँगा—तेरे सब घृणित कामों के कारण।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तुझ पर” अथवा “तेरे साथ।” हिब्रू पूर्वसर्ग का शाब्दिक अर्थ “तुझ में” है; यहाँ “तेरे भीतर” नगर के भीतर किए जाने वाले न्याय का भाव व्यक्त करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשִׂיתִי
  choice: और मैं ... करूँगा
  rationale: עָשָׂה का सामान्य अर्थ ‘करना’ है। यहाँ ‘करूँगा’ मूल की व्यापकता और न्याय की कठोर घोषणा को बनाए रखता है, बिना कार्य का स्वरूप आवश्यकता से अधिक स्पष्ट किए।
- source_word: בָךְ
  choice: तेरे बीच
  rationale: בְּ का मूल स्थानवाचक भाव ‘में’ है। नगर यरूशलेम को संबोधित करते हुए ‘तेरे बीच’ स्वाभाविक हिन्दी में यह बताता है कि न्याय उसी के भीतर घटित होगा; ‘तुझ पर’ अधिक व्याख्यात्मक विकल्प है।
- source_word: אֵת אֲשֶׁר לֹא עָשִׂיתִי
  choice: ऐसा ... जो मैंने कभी नहीं किया
  rationale: हिब्रू पूर्ण क्रिया अब तक के पिछले समय में ऐसे कार्य के न होने को व्यक्त करती है। ‘कभी नहीं किया’ आधुनिक हिन्दी में इस भाव को स्वाभाविक रूप से देता है।
- source_word: וְאֵת אֲשֶׁר לֹא אֶעֱשֶׂה כָמֹהוּ עוֹד
  choice: और फिर कभी उसके समान नहीं करूँगा
  rationale: इस संयुक्त वाक्यांश में भावी पुनरावृत्ति का निषेध और तुलना दोनों हैं। ‘फिर कभी’ עוֹד को और ‘उसके समान’ כָמֹהוּ को स्पष्ट रूप से व्यक्त करता है।
- source_word: יַעַן
  choice: के कारण
  rationale: יַעַן आने वाले न्याय का कारण प्रस्तुत करता है; संज्ञा-वाक्यांश के साथ ‘के कारण’ सहज और सटीक है।
- source_word: כָּל תּוֹעֲבֹתָיִךְ
  choice: तेरे सब घृणित कामों
  rationale: תּוֹעֵבָה उन आचरणों या वस्तुओं को दर्शाता है जो धार्मिक और नैतिक रूप से अत्यंत घिनौने हैं। ‘घृणित काम’ सामान्य पाठक के लिए स्पष्ट रहते हुए भविष्यद्वाणी की नैतिक गंभीरता बनाए रखता है।
theological_decisions:
- issue: न्याय का अभूतपूर्व और फिर न दोहराया जाने वाला स्वरूप
  choice: पूर्ण बल के साथ ‘कभी नहीं’ और ‘फिर कभी ... नहीं’ रखा गया है।
  alternative: इसे केवल ‘बहुत कठोर न्याय’ कहकर सामान्य बनाना।
  rationale: मूल पाठ न्याय की केवल तीव्रता नहीं, बल्कि उसके अभूतपूर्व और अनुपम होने पर बल देता है; इसलिए इस तनाव को नरम नहीं किया गया।
- issue: बָךְ में परमेश्वर के कार्य का स्थान या लक्ष्य
  choice: ‘तेरे बीच’
  alternative: ‘तुझ पर’ या ‘तेरे साथ’
  rationale: ‘तेरे बीच’ हिब्रू पूर्वसर्ग के स्थानवाचक भाव और नगर के भीतर न्याय घटित होने की छवि को सुरक्षित रखता है, जबकि दूसरे विकल्प न्याय के लक्ष्य को अधिक स्पष्ट रूप से व्याख्यायित करते हैं।
translation_notes:
  register: भाषा आधुनिक, गंभीर और भविष्यद्वाणी-सुलभ रखी गई है। यरूशलेम को एकवचन में संबोधित करने के कारण ‘तेरे’ का प्रयोग हुआ है। ‘घृणित काम’ सामान्य पाठक के लिए ‘घृणित वस्तुओं/घिनौने कृत्यों’ से अधिक सहज है और मूल की धार्मिक-नैतिक गंभीरता भी बनाए रखता है।
