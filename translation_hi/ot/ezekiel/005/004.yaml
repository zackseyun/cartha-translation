source:
  edition: WLC
  text: וּ/מֵ/הֶם֙ ע֣וֹד תִּקָּ֔ח וְ/הִשְׁלַכְתָּ֤ אוֹתָ/ם֙ אֶל תּ֣וֹךְ הָ/אֵ֔שׁ וְ/שָׂרַפְתָּ֥ אֹתָ֖/ם בָּ/אֵ֑שׁ מִמֶּ֥/נּוּ תֵצֵא אֵ֖שׁ אֶל כָּל בֵּ֥ית יִשְׂרָאֵֽל־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/005/004.yaml
  text: And from them you shall take some more[a], and throw them into the midst of the fire and burn them in the fire. From it a fire will go out to all the house of Israel.
translation:
  language: hi
  text: और उनमें से कुछ और लेकर आग के बीच में फेंक देना और उन्हें आग में जला देना। उसी में से[a] आग निकलकर इस्राएल के सारे घराने तक पहुँचेगी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वहाँ से आग निकलेगी।” एकवचन प्रत्यय संभवतः अभी-अभी उल्लिखित आग की ओर संकेत करता है; कुछ व्याख्याकार, कम संभावना के साथ, इसका अर्थ “उनमें से आग निकलेगी” समझते हैं।
    reason: מִמֶּנּוּ के संदर्भ की वास्तविक अस्पष्टता और संभव स्थानवाचक अनुवाद को सुरक्षित रखना।
lexical_decisions:
- source_word: וּמֵהֶם עוֹד תִּקָּח
  choice: और उनमें से कुछ और लेकर
  rationale: מֵהֶם का अंशवाचक अर्थ ‘उनमें से’ है, और עוֹד पहले अलग रखे गए बालों में से अतिरिक्त मात्रा लेने को व्यक्त करता है। निर्देशात्मक क्रियाओं की स्वाभाविक हिन्दी शृंखला के लिए ‘लेकर’ चुना गया है।
- source_word: וְהִשְׁלַכְתָּ אוֹתָם אֶל תּוֹךְ הָאֵשׁ
  choice: आग के बीच में फेंक देना
  rationale: תּוֹךְ के ‘बीच/भीतर’ भाव को बनाए रखा गया है; ‘फेंक देना’ आधुनिक हिन्दी में निर्देश का बल स्पष्ट करता है।
- source_word: וְשָׂרַפְתָּ אֹתָם בָּאֵשׁ
  choice: और उन्हें आग में जला देना
  rationale: שרף का सीधा अर्थ ‘जलाना’ और בָּאֵשׁ का प्रसंगानुकूल अर्थ ‘आग में’ रखा गया है।
- source_word: מִמֶּנּוּ
  choice: उसी में से
  rationale: पुल्लिंग एकवचन प्रत्यय का सर्वाधिक निकट और स्वाभाविक पूर्वपद ‘आग’ है। ‘उसी में से’ उस संदर्भ को दर्शाता है, पर वैकल्पिक समझ को पादटिप्पणी में सुरक्षित रखता है।
- source_word: תֵצֵא אֵשׁ
  choice: आग निकलकर ... पहुँचेगी
  rationale: יצא के निकलने/बाहर जाने के चित्र को ‘निकलकर’ बनाए रखते हुए हिन्दी में אֶל के लक्ष्य तक जाने को ‘पहुँचेगी’ से स्वाभाविक बनाया गया है।
- source_word: אֶל כָּל בֵּית יִשְׂרָאֵל
  choice: इस्राएल के सारे घराने तक
  rationale: אֶל को स्पष्ट रूप से ‘के विरुद्ध’ न बनाकर दिशासूचक ‘तक’ रखा गया है। ‘इस्राएल का घराना’ वाचाई-राष्ट्रीय अभिव्यक्ति को सुरक्षित रखता है।
theological_decisions:
- issue: מִמֶּנּוּ से संकेतित आग का स्रोत
  choice: मुख्य पाठ में इसे अभी-अभी उल्लिखित आग से जोड़ा गया है।
  alternative: इसे जलाए गए बालों/उन लोगों से निकलने वाली आग समझना, अथवा स्थानवाचक ‘वहाँ से’ कहना।
  rationale: एकवचन प्रत्यय निकटवर्ती ‘आग’ की ओर सबसे स्वाभाविक रूप से संकेत करता है, लेकिन प्रतीकात्मक क्रिया की यांत्रिकी को अनावश्यक रूप से निश्चित नहीं किया गया; विकल्प पादटिप्पणी में दिया गया है।
- issue: 'अग्नि की दिशा: ‘तक’ या ‘के विरुद्ध’'
  choice: इस्राएल के सारे घराने तक
  alternative: इस्राएल के सारे घराने के विरुद्ध
  rationale: न्याय का प्रसंग विरोधी प्रभाव बताता है, पर אֶל स्वयं सामान्यतः दिशा/लक्ष्य व्यक्त करता है। मुख्य पाठ निकटतर शब्दार्थ रखता है और प्रसंग को न्याय का अर्थ प्रकट करने देता है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी। आज्ञार्थक भविष्य की लंबी शृंखला को स्वाभाविक हिन्दी निर्देशात्मक रूप ‘लेकर… फेंक देना… जला देना’ में व्यक्त किया गया है। ‘इस्राएल का घराना’ बाइबिलीय सामूहिक पद को बनाए रखता है।
