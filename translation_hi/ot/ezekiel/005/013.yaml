source:
  edition: WLC
  text: וְ/כָלָ֣ה אַפִּ֗/י וַ/הֲנִחוֹתִ֧י חֲמָתִ֛/י בָּ֖/ם וְ/הִנֶּחָ֑מְתִּי וְֽ/יָדְע֞וּ כִּי אֲנִ֣י יְהוָ֗ה דִּבַּ֨רְתִּי֙ בְּ/קִנְאָתִ֔/י בְּ/כַלּוֹתִ֥/י חֲמָתִ֖/י בָּֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/005/013.yaml
  text: So my anger will be spent[a], and I will cause my wrath to rest on them, and I will be comforted. Then they will know that I, Yahweh, have spoken in my jealousy[b], when I spend my wrath against them.
translation:
  language: hi
  text: इस प्रकार मेरा क्रोध समाप्त हो जाएगा, और मैं अपना प्रकोप उन पर ठहराऊँगा, और मुझे सांत्वना मिलेगी[a]। तब वे जानेंगे कि मैं, याहवे, ने अपनी ईर्ष्या[b] में कहा है, जब मैं उन पर अपना प्रकोप पूरा करूँगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘मुझे राहत मिलेगी’ अथवा ‘मैं शांत हो जाऊँगा।’ इब्रानी क्रिया न्याय पूरा होने के बाद सांत्वना या राहत मिलने का भाव व्यक्त कर सकती है।
    reason: lexical_alternative
  - marker: b
    text: या, ‘अपने उत्साह में।’ इब्रानी शब्द का अर्थ ‘ईर्ष्या’ या ‘उत्साह’ दोनों हो सकता है; यहाँ ‘ईर्ष्या’ वाचा के संबंधपरक भाव को बनाए रखती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכָלָה אַפִּי
  choice: मेरा क्रोध समाप्त हो जाएगा
  rationale: כלה के साथ אַף क्रोध के अपने पूरे परिणाम तक पहुँचने और समाप्त होने का भाव देता है। ‘समाप्त हो जाएगा’ इसे स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: וַהֲנִחוֹתִי חֲמָתִי בָּם
  choice: मैं अपना प्रकोप उन पर ठहरा दूँगा
  rationale: नוח के हिफ़ील रूप का मूल भाव ‘विश्राम देना/ठहराना’ है और בם न्याय के लक्ष्य को सूचित करता है। यह अनुवाद प्रकोप को उन पर रखे जाने की कठिन परंतु महत्वपूर्ण मूल छवि बनाए रखता है।
- source_word: וְהִנֶּחָמְתִּי
  choice: मुझे चैन मिलेगा
  rationale: נחם के निफ़ाल रूप में न्याय पूरा होने के बाद सांत्वना, राहत या शांत होने का भाव हो सकता है। ‘मुझे चैन मिलेगा’ आधुनिक हिन्दी में सहज है और मूल के भावात्मक कथन को अमूर्त न्यायिक भाषा में नहीं बदलता।
- source_word: וְיָדְעוּ
  choice: तब वे जानेंगे
  rationale: वाव के साथ आया पूर्ण क्रियारूप यहाँ पिछले न्याय के परिणाम को व्यक्त करता है; ‘तब’ उस परिणामी क्रम को स्वाभाविक रूप से स्पष्ट करता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: यह परमेश्वर के व्यक्तिगत नाम יהוה का हिन्दी लिप्यंतरण है; इसे किसी उपाधि से प्रतिस्थापित नहीं किया गया।
- source_word: בְּקִנְאָתִי
  choice: अपनी जलन में
  rationale: קנאה में ‘जलन’ और ‘उत्साह’ दोनों भाव संभव हैं। इस वाचा-संबंधी न्याय के प्रसंग में ‘जलन’ संबंधपरक तीव्रता को सुरक्षित रखती है।
- source_word: בְּכַלּוֹתִי חֲמָתִי בָּם
  choice: जब मैं उन पर अपना प्रकोप पूरी तरह उंडेल दूँगा
  rationale: כלה का infinitive construct कार्य की पूर्णता और समय/परिस्थिति दोनों बताता है। हिन्दी में ‘पूरी तरह उंडेल दूँगा’ प्रकोप के उनके विरुद्ध पूर्ण रूप से कार्यान्वित होने को सहजता से व्यक्त करता है।
theological_decisions:
- issue: ईश्वरीय भावात्मक भाषा
  choice: ‘क्रोध,’ ‘प्रकोप,’ ‘जलन,’ और ‘मुझे चैन मिलेगा’ को प्रत्यक्ष भावात्मक भाषा में रखा गया है।
  alternative: इन्हें ‘न्याय पूरा होगा’ अथवा ‘न्याय संतुष्ट होगा’ जैसी अमूर्त भाषा में नरम करना।
  rationale: इब्रानी पाठ स्वयं परमेश्वर के न्याय को भावात्मक और संबंधपरक शब्दों में प्रस्तुत करता है। इन शब्दों को बनाए रखना भविष्यद्वाणी की शक्ति और धर्मवैज्ञानिक तनाव दोनों को सुरक्षित रखता है।
- issue: נחם के निफ़ाल रूप का अर्थ
  choice: मुझे चैन मिलेगा
  alternative: मैं शांत हो जाऊँगा / मुझे सांत्वना मिलेगी / मैं तृप्त होऊँगा
  rationale: पाठ न्याय से मुड़ने की बात नहीं करता, बल्कि प्रकोप पूरा होने के बाद मिलने वाली राहत या सांत्वना की बात करता है। मुख्य अनुवाद सहज हिन्दी चुनता है, जबकि पादटिप्पणी वास्तविक अर्थ-विकल्प को बनाए रखती है।
- issue: कִנְאָה का संबंधपरक अर्थ
  choice: जलन
  alternative: उत्साह
  rationale: दोनों अर्थ शब्द में संभव हैं, पर इस वाचा-संबंधी न्याय के प्रसंग में ‘जलन’ परमेश्वर के संबंधपरक दावे को अधिक स्पष्ट रखती है; विकल्प पादटिप्पणी में दिया गया है।
- issue: יהוה का प्रस्तुतीकरण
  choice: याहवे
  alternative: प्रभु / यहोवा
  rationale: व्यक्तिगत ईश्वरीय नाम को उपाधि में बदलने के बजाय उसका लिप्यंतरण किया गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य हिन्दी पाठक के लिए बोधगम्य रखी गई है। ‘प्रकोप उन पर ठहरा दूँगा’ जानबूझकर कुछ औपचारिक है, क्योंकि यह इब्रानी क्रिया की विशिष्ट छवि को सुरक्षित रखता है; अंतिम खंड में स्वाभाविक हिन्दी के लिए ‘पूरी तरह उंडेल दूँगा’ प्रयोग किया गया है।
