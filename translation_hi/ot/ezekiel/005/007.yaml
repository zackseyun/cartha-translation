base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/005/007.yaml
  text: 'Therefore thus says the Lord GOD: Because you have been more turbulent than the nations that are around you[a], you have not walked in my statutes, and you have not carried out my judgments; and you have not even acted according to the judgments of the nations that are around you.'
translation:
  language: hi
  text: 'इसलिए प्रभु याहवे यों कहता है: “क्योंकि तुमने अपने चारों ओर की जातियों से अधिक हलचल मचाई है[a]—तुम न तो मेरी विधियों के अनुसार चले, न मेरे न्याय-विधानों का पालन किया; यहाँ तक कि तुमने अपने चारों ओर की जातियों के न्याय-विधानों के अनुसार भी आचरण नहीं किया।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इसका अनुवाद ‘तुम उनसे अधिक उग्र हुए,’ ‘तुम उनसे अधिक विद्रोही हुए,’ या सम्भवतः ‘तुम उनकी अपेक्षा अधिक संख्या में थे’ भी हो सकता है। यहाँ प्रयुक्त हिब्रू शब्द कठिन है; मुख्य पाठ में संदर्भ के अनुकूल अत्यधिक अव्यवस्था और हलचल का भाव लिया गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  choice: प्रभु यहोवा
  rationale: संयुक्त ईश्वरीय उपाधि में אֲדֹנָי को ‘प्रभु’ और वाचा के नाम יהוה को ‘यहोवा’ से व्यक्त किया गया है; इससे दोनों अवयव बने रहते हैं और हिन्दी में ‘प्रभु प्रभु’ जैसी अस्वाभाविक पुनरावृत्ति नहीं होती।
- source_word: יַעַן
  choice: क्योंकि
  rationale: यह आनेवाले न्याय के कारण का परिचय देता है; आधुनिक हिन्दी में ‘क्योंकि’ इसका स्पष्ट और स्वाभाविक समतुल्य है।
- source_word: הֲמָנְכֶם
  choice: तुमने ... अधिक उपद्रव मचाया है
  rationale: यह कठिन हिब्रू रूप अत्यधिक हलचल, उग्रता या विद्रोही अव्यवस्था का संकेत दे सकता है। संदर्भ के अनुरूप ‘उपद्रव मचाया’ नैतिक आरोप की तीव्रता व्यक्त करता है, जबकि अन्य सम्भव अर्थ पादटिप्पणी में सुरक्षित रखे गए हैं।
- source_word: מִן הַגּוֹיִם אֲשֶׁר סְבִיבוֹתֵיכֶם
  choice: अपने चारों ओर की जातियों से अधिक
  rationale: מִן यहाँ तुलना सूचित करता है; ‘से अधिक’ उस तुलनात्मक सम्बन्ध को हिन्दी में स्पष्ट करता है।
- source_word: בְּחֻקּוֹתַי לֹא הֲלַכְתֶּם
  choice: तुम न तो मेरी विधियों पर चले
  rationale: ‘चलना’ हिब्रू नैतिक-जीवन के रूपक को बनाए रखता है और ‘विधियों पर चलना’ हिन्दी में बोधगम्य है।
- source_word: מִשְׁפָּטַי
  choice: मेरे न्याय-विधान
  rationale: ‘न्याय-विधान’ מִשְׁפָּט के न्यायिक और नियामक दोनों पक्षों को व्यक्त करता है तथा बाद में जातियों के מִשְׁפָּטֵי के साथ शब्दगत सम्बन्ध बनाए रखता है।
- source_word: לֹא עֲשִׂיתֶם
  choice: पालन नहीं किया
  rationale: परमेश्वर के न्याय-विधानों के साथ עשה का आशय उन्हें व्यवहार में लागू करना है; ‘पालन करना’ आधुनिक हिन्दी में स्वाभाविक है।
- source_word: וּכְמִשְׁפְּטֵי הַגּוֹיִם ... לֹא עֲשִׂיתֶם
  choice: यहाँ तक कि ... न्याय-विधानों के अनुसार भी आचरण नहीं किया
  rationale: כְּ को ‘के अनुसार’ से व्यक्त किया गया है। ‘यहाँ तक कि ... भी’ उस प्रबल विरोधाभास को सामने लाता है कि उन्होंने न परमेश्वर के विधान माने, न आसपास की जातियों के मानदण्डों तक के अनुसार आचरण किया।
theological_decisions:
- issue: אֲדֹנָי יְהוִה में ईश्वरीय नाम का अनुवाद
  choice: प्रभु यहोवा
  alternative: प्रभु याहवे; परमेश्वर प्रभु
  rationale: मूल पाठ में वाचा का विशिष्ट नाम יהוה उपस्थित है। ‘यहोवा’ हिन्दी बाइबलीय प्रयोग में पहचाना जाने वाला नामरूप है और इसे सामान्य उपाधि में विलीन किए बिना אֲדֹנָי से अलग रखता है।
- issue: जातियों के न्याय-विधानों के अनुसार आचरण न करने का आशय
  choice: कथन को उसके व्यंग्यात्मक और आरोपात्मक तनाव सहित रखा गया
  alternative: इसे केवल जातियों की बुरी प्रथाओं को न अपनाने के अर्थ में समझना
  rationale: हिब्रू वाक्य सीधे कहता है कि उन्होंने आसपास की जातियों के מִשְׁפָּטִים के अनुसार भी नहीं किया। अनुवाद इस कठिन धार्मिक तनाव को हल नहीं करता, बल्कि ‘यहाँ तक कि ... भी’ द्वारा उसकी अलंकारिक शक्ति बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘यों कहता है,’ ‘विधियाँ,’ और ‘न्याय-विधान’ भविष्यद्वाणी तथा विधिक प्रसंग की औपचारिकता बनाए रखते हैं; वाक्य-विन्यास को हिन्दी की स्वाभाविक लय के अनुसार व्यवस्थित किया गया है।
