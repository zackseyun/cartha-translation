  text: בְּֽ/שַׁלְּחִ֡/י אֶת חִצֵּי֩ הָ/רָעָ֨ב הָ/רָעִ֤ים בָּ/הֶם֙ אֲשֶׁ֣ר הָי֣וּ לְ/מַשְׁחִ֔ית אֲשֶׁר אֲשַׁלַּ֥ח אוֹתָ֖/ם לְ/שַֽׁחֶתְ/כֶ֑ם וְ/רָעָב֙ אֹסֵ֣ף עֲלֵי/כֶ֔ם וְ/שָׁבַרְתִּ֥י לָ/כֶ֖ם מַטֵּה לָֽחֶם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/005/016.yaml
  text: When I send against them the deadly arrows of famine[a], which are for destruction, which I will send to destroy you[b], then I will add famine upon you and break for you the staff of bread.
translation:
  language: hi
  text: जब मैं अकाल के घातक तीर[a] उन पर चलाऊँगा—वे तीर जो विनाश लाने वाले हैं और जिन्हें मैं तुम्हें नष्ट करने के लिए भेजूँगा—तब मैं तुम पर अकाल और बढ़ा दूँगा और तुम्हारा रोटी का सहारा[b] तोड़ दूँगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अकाल के हानिकारक/विनाशकारी तीर।”
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में शाब्दिक रूप से “रोटी की लाठी”; यह रोटी की उपलब्धता अथवा जीवन बनाए रखने वाली खाद्य-आपूर्ति के लिए मुहावरा है।
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּשַׁלְּחִי
  choice: जब मैं ... चलाऊँगा
  rationale: ב के साथ infinitive construct यहाँ कालवाचक उपवाक्य बनाता है। तीरों के संदर्भ में हिन्दी का ‘चलाऊँगा’ लक्ष्य की ओर भेजने का भाव स्वाभाविक रूप से व्यक्त करता है।
- source_word: חִצֵּי הָרָעָב
  choice: अकाल के ... तीर
  rationale: 'इस construct chain का रूपक ज्यों का त्यों रखा गया है: अकाल को परमेश्वर द्वारा चलाए गए हथियार के रूप में चित्रित किया गया है।'
- source_word: הָרָעִים
  choice: घातक
  rationale: רַע का मूल अर्थ ‘बुरा’ हो सकता है, पर यहाँ यह विनाशकारी अकाल-तीरों का गुण बताता है। ‘घातक’ प्रसंगानुकूल प्रभाव व्यक्त करता है; व्यापक शाब्दिक विकल्प पादटिप्पणी में दिया गया है।
- source_word: בָּהֶם
  choice: उन पर
  rationale: בָּהֶם तीरों के लक्ष्य को सूचित करता है। हिन्दी में ‘उन पर तीर चलाना’ स्वाभाविक है और मूल पाठ में ‘उन’ से बाद के ‘तुम्हें/तुम पर’ की ओर होने वाले सर्वनाम-परिवर्तन को सुरक्षित रखता है।
- source_word: לְמַשְׁחִית
  choice: विनाश लाने वाले
  rationale: यह विनाशकारी उद्देश्य अथवा परिणाम को व्यक्त करता है और अगले לְשַׁחֶתְכֶם के साथ मूल की पुनरुक्ति को बनाए रखता है।
- source_word: לְשַׁחֶתְכֶם
  choice: तुम्हें नष्ट करने के लिए
  rationale: שׁחת के infinitive और द्वितीय पुरुष बहुवचन प्रत्यय का सीधा, प्रसंगानुकूल अनुवाद है।
- source_word: וְרָעָב אֹסֵף עֲלֵיכֶם
  choice: तब मैं तुम पर अकाल और बढ़ा दूँगा
  rationale: אָסַף यहाँ ‘बढ़ाना/और जोड़ना’ अर्थ देता है। प्रथम पुरुष कर्ता प्रसंग से जारी रहता है, और עַל का दंड के भार जैसा भाव ‘तुम पर’ से सुरक्षित है।
- source_word: וְשָׁבַרְתִּי לָכֶם מַטֵּה לָחֶם
  choice: तुम्हारे लिए रोटी की लाठी तोड़ दूँगा
  rationale: ‘लाठी’ מַטֶּה की ठोस छवि और ‘रोटी की लाठी’ मूल मुहावरे को सुरक्षित रखते हैं। לָכֶם को ‘तुम्हारे लिए’ से स्पष्ट रखा गया है; मुहावरे का आशय पादटिप्पणी में समझाया गया है।
theological_decisions:
- issue: न्याय में परमेश्वर की प्रत्यक्ष भूमिका
  choice: 'प्रथम पुरुष की क्रियाएँ स्पष्ट रखी गईं: ‘मैं ... चलाऊँगा’, ‘मैं ... भेजूँगा’, ‘मैं ... बढ़ा दूँगा’, ‘तोड़ दूँगा’।'
  alternative: अकाल या विनाश को स्वतः घटित होने वाली निरपेक्ष घटनाओं के रूप में प्रस्तुत करना।
  rationale: इब्रानी पाठ न्याय की इन क्रियाओं को बार-बार सीधे परमेश्वर से जोड़ता है; अनुवाद इस तनाव को नरम नहीं करता।
- issue: न्याय-संबंधी रूपकों का संरक्षण
  choice: ‘अकाल के तीर’ और ‘रोटी की लाठी’ दोनों रूपक मुख्य पाठ में रखे गए हैं।
  alternative: इनका पूरा अर्थ खोलकर केवल ‘घातक अकाल’ और ‘रोटी की आपूर्ति’ लिखना।
  rationale: मूल की काव्यात्मक और धर्मवैचारिक छवि बनाए रखना महत्त्वपूर्ण है। कम परिचित ‘रोटी की लाठी’ का अर्थ पादटिप्पणी से स्पष्ट किया गया है।
- issue: ‘उन’ से ‘तुम’ की ओर सर्वनाम-परिवर्तन
  choice: मूल पाठ का परिवर्तन ‘उन पर’ और फिर ‘तुम्हें/तुम पर’ के रूप में रखा गया है।
  alternative: सभी सर्वनामों को ‘तुम’ करके संबोधन को समरूप बनाना।
  rationale: इब्रानी में यह वास्तविक परिवर्तन मौजूद है। उसे समतल कर देना पाठ की वाक्पटुता और संभावित अर्थ-तनाव को अनावश्यक रूप से मिटा देता।
translation_notes:
  register: आधुनिक मानक हिन्दी का गंभीर, न्यायवाणी के अनुकूल स्तर रखा गया है। वाक्य की मूल पुनरुक्ति और ‘उन’ से ‘तुम’ का परिवर्तन सुरक्षित हैं। ‘रोटी की लाठी’ जानबूझकर स्रोत-सन्निकट रूपक है और उसकी अस्पष्टता पादटिप्पणी से दूर की गई है।
