  naturalness: The sentence is otherwise fluent and appropriately grave. “रोटी की लाठी” is not natural modern Hindi and obscures the Hebrew idiom more than it preserves its image. “रोटी का सहारा” is an established, comprehensible metaphor that conveys the idiom’s sense.
  terminology: “अकाल,” “घातक,” “विनाश,” and “नष्ट” fit the judgment register and source sense. The revision changes only the opaque final idiom and adjusts its note accordingly.
