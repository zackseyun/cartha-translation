    issue: “रोटी की लाठी” is an opaque and misleading rendering of מַטֵּה לָחֶם.
    rationale: Although it formally imitates “staff of bread,” modern Hindi “लाठी” normally denotes a physical stick, often a weapon. The Hebrew idiom denotes bread’s sustaining support or supply. “रोटी का सहारा” preserves the support metaphor while communicating the intended sense naturally.
