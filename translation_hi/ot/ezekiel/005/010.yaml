  text: לָ/כֵ֗ן אָב֞וֹת יֹאכְל֤וּ בָנִים֙ בְּ/תוֹכֵ֔/ךְ וּ/בָנִ֖ים יֹאכְל֣וּ אֲבוֹתָ֑/ם וְ/עָשִׂ֤יתִי בָ/ךְ֙ שְׁפָטִ֔ים וְ/זֵרִיתִ֥י אֶת כָּל שְׁאֵרִיתֵ֖/ךְ לְ/כָל רֽוּחַ־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/005/010.yaml
  text: Therefore fathers will eat sons in your midst[a], and sons will eat their fathers[b]; and I will execute judgments on you and scatter all your remnant to every wind.
translation:
  language: hi
  text: इसलिए तुम्हारे बीच पिता अपने बेटों को खाएँगे, और बेटे अपने पिताओं को खाएँगे। मैं तुम्हारे विरुद्ध न्याय के कार्य करूँगा और तुम्हारे बचे हुए सभी लोगों को[a] हर हवा की ओर[b] तितर-बितर कर दूँगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “तुम्हारा सारा शेष भाग।”
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक अर्थ “हर हवा की ओर”; यह चारों ओर, हर दिशा में पूरी तरह बिखेर दिए जाने का मुहावरा है।
    reason: cultural_note
lexical_decisions:
- source_word: לָכֵן
  choice: इसलिए
  rationale: यह पिछले आरोप और घोषित दंड के परिणाम को स्पष्ट करता है और हिब्रू के निष्कर्षसूचक बल को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: אָבוֹת ... בָנִים
  choice: पिता ... अपने बेटों
  rationale: हिब्रू के पुरुषवाची पारिवारिक शब्दों और पारिवारिक संबंधों के भयावह उलटाव को बनाए रखता है।
- source_word: יֹאכְלוּ
  choice: खाएँगे
  rationale: साधारण क्रिया 'खाना' ही अकाल और न्याय के प्रसंग में नरभक्षण की कठोर वास्तविकता व्यक्त करती है; अधिक व्याख्यात्मक शब्द की आवश्यकता नहीं है।
- source_word: בְּתוֹכֵךְ
  choice: तुम्हारे बीच
  rationale: स्त्रीलिंग एकवचन में संबोधित नगर या समुदाय के भीतर घटने वाली बात के लिए यह स्वाभाविक आधुनिक हिन्दी है।
- source_word: וּבָנִים יֹאכְלוּ אֲבוֹתָם
  choice: और बेटे अपने पिता को खाएँगे
  rationale: हिन्दी में 'अपने पिता' वितरणात्मक अर्थ में प्रत्येक बेटे के पिता को दर्शाता है और हिब्रू की पारस्परिक भयावहता को स्वाभाविक ढंग से रखता है।
- source_word: וְעָשִׂיתִי בָךְ שְׁפָטִים
  choice: मैं तुम्हारे विरुद्ध न्याय-दंड दूँगा
  rationale: यह दैवी न्याय और उसके दंडात्मक परिणाम दोनों को व्यक्त करता है तथा केवल सामान्य 'सज़ा' कहकर न्यायिक स्वर को नहीं मिटाता।
- source_word: וְזֵרִיתִי
  choice: तितर-बितर कर दूँगा
  rationale: निर्वासन और पूर्ण बिखराव के प्रसंग में זרה का स्पष्ट और स्वाभाविक हिन्दी रूप है।
- source_word: כָּל שְׁאֵרִיתֵךְ
  choice: तुममें जो कुछ बचा रहेगा
  rationale: यह लोगों तक अर्थ को अनावश्यक रूप से सीमित किए बिना शेष बचे भाग या बचे हुए लोगों—दोनों की संभाव्यता बनाए रखता है।
- source_word: לְכָל רוּחַ
  choice: हर हवा की ओर
  rationale: हिब्रू की हवा वाली उपमा को बनाए रखता है; पादटिप्पणी इसके सर्वदिशात्मक बिखराव के मुहावरेदार अर्थ को स्पष्ट करती है।
theological_decisions:
- issue: न्याय के प्रसंग में שְׁאֵרִית का अनुवाद
  choice: तुममें जो कुछ बचा रहेगा
  alternative: तुम्हारे बचे हुए सभी लोग / तुम्हारा सारा शेष भाग
  rationale: यहाँ शेष बचे हुए पर भी दंड आता है। यह रूप मूल शब्द की व्यापकता को बनाए रखता है और उसमें अपने आप पुनर्स्थापना या आशा का अर्थ नहीं जोड़ता।
- issue: שְׁפָטִים का न्यायिक और दंडात्मक स्वर
  choice: न्याय-दंड
  alternative: न्याय के कार्य / दंड
  rationale: संयुक्त हिन्दी पद न्यायिक निर्णय और उसके दंडात्मक क्रियान्वयन दोनों को संक्षेप में व्यक्त करता है, बिना इसे केवल अमूर्त निर्णय या केवल दंड तक सीमित किए।
translation_notes:
  register: भाषा आधुनिक, गंभीर और सामान्य पाठक के लिए बोधगम्य रखी गई है। नरभक्षण की कठोरता को नरम नहीं किया गया। नगर को किए गए स्त्रीलिंग एकवचन संबोधन का हिन्दी में स्वाभाविक रूप 'तुम' है। पादटिप्पणी-चिह्न उन शब्दों पर लगाए गए हैं जिनसे उनकी सामग्री वास्तव में संबंधित है।
