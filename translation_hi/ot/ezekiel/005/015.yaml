  text: וְֽ/הָ֨יְתָ֜ה חֶרְפָּ֤ה וּ/גְדוּפָה֙ מוּסָ֣ר וּ/מְשַׁמָּ֔ה לַ/גּוֹיִ֖ם אֲשֶׁ֣ר סְבִיבוֹתָ֑יִ/ךְ בַּ/עֲשׂוֹתִ/י֩ בָ֨/ךְ שְׁפָטִ֜ים בְּ/אַ֤ף וּ/בְ/חֵמָה֙ וּ/בְ/תֹכְח֣וֹת חֵמָ֔ה אֲנִ֥י יְהוָ֖ה דִּבַּֽרְתִּי׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/005/015.yaml
  text: And you shall become a reproach and a taunt[a], a warning and a horror, to the nations that are around you, when I execute judgments on you in anger and in wrath and with wrathful rebukes. I am Yahweh[c][b]; I have spoken.
translation:
  language: hi
  text: और तू अपने चारों ओर की जातियों के लिए निन्दा और उपहास का पात्र, एक चेतावनी और भय का विषय बनेगी, जब मैं क्रोध और प्रकोप में, प्रकोप-भरी फटकारों के साथ, तुझ पर न्याय करूँगा। मैं यहोवा हूँ; मैंने कहा है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהָיְתָה
  choice: तू ... बनेगी
  rationale: क्रिया स्त्रीलिंग एकवचन है और सम्बोधित यरूशलेम से मेल खाती है; हिन्दी में स्त्रीलिंग प्रत्यक्ष सम्बोधन इसे स्पष्ट रखता है।
- source_word: חֶרְפָּה
  choice: निन्दा
  rationale: यह सार्वजनिक अपमान और तिरस्कार दोनों का भाव व्यक्त करता है और भविष्यद्वाणी के न्याय-सन्दर्भ में स्वाभाविक है।
- source_word: וּגְדוּפָה
  choice: उपहास
  rationale: शब्द गाली-गलौज या ताना मारने का संकेत देता है; ‘उपहास’ निन्दा से भिन्न रहते हुए सहज हिन्दी देता है।
- source_word: מוּסָר
  choice: चेतावनी
  rationale: यहाँ यरूशलेम का दण्ड आसपास की जातियों के लिए शिक्षा देने वाला उदाहरण बनता है; ‘चेतावनी’ इस प्रसंगगत प्रभाव को व्यक्त करती है।
- source_word: וּמְשַמָּה
  choice: आतंक का कारण
  rationale: शब्द उजाड़ दशा के साथ उससे उत्पन्न भय और स्तब्धता भी दर्शा सकता है; इस सूची में प्रतिक्रिया का भाव प्रमुख है।
- source_word: לַגּוֹיִם אֲשֶׁר סְבִיבוֹתָיִךְ
  choice: अपने चारों ओर की जातियों के लिए
  rationale: यह सम्बन्धसूचक पूर्वसर्ग और पड़ोसी राष्ट्रों के भौगोलिक सन्दर्भ दोनों को स्वाभाविक हिन्दी में रखता है।
- source_word: בַּעֲשׂוֹתִי בָךְ שְׁפָטִים
  choice: जब मैं ... तुझ पर न्याय-दण्ड दूँगा
  rationale: रचना कालवाचक है; ‘न्याय-दण्ड’ שְׁפָטִים के न्यायिक और दण्डात्मक दोनों पहलुओं को संक्षेप में रखता है।
- source_word: בְּאַף וּבְחֵמָה
  choice: क्रोध और प्रकोप में
  rationale: दो समानार्थी पर तीव्रता में बढ़ते पदों का अन्तर बनाए रखने के लिए अलग हिन्दी शब्द चुने गए हैं।
- source_word: וּבְתוֹכְחוֹת חֵמָה
  choice: प्रकोप-भरी फटकारों के साथ
  rationale: यह मूल के ‘प्रकोप की फटकारों’ को सहज हिन्दी में व्यक्त करता है और फटकार तथा उग्रता दोनों तत्व बचाता है।
- source_word: אֲנִי יְהוָה דִּבַּרְתִּי
  choice: मैं यहोवा हूँ; मैंने यह कहा है
  rationale: दिव्य नाम का लिप्यन्तरण रखा गया है और समापन की दृढ़, प्रतिज्ञात्मक घोषणा सुरक्षित है।
theological_decisions:
- issue: दिव्य नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: मूल में व्यक्तिगत दिव्य नाम है। हिन्दी पाठकों में प्रचलित लिप्यन्तरण ‘यहोवा’ नाम को उपाधि से बदले बिना स्पष्ट और स्वाभाविक है।
- issue: न्याय-सूची में מוּסָר का अर्थ
  choice: चेतावनी
  alternative: शिक्षा; अनुशासन; सुधार
  rationale: यरूशलेम पर हुआ न्याय आसपास की जातियों के लिए दृष्टान्तात्मक चेतावनी बनता है; फिर भी वैकल्पिक शैक्षिक अर्थ पादटिप्पणी में सुरक्षित है।
- issue: מְשַׁמָּה का भाव
  choice: आतंक का कारण
  alternative: उजाड़; विस्मय का कारण
  rationale: क्योंकि यह बताता है कि यरूशलेम जातियों के लिए क्या बनेगी, अनुवाद उनकी भयभीत प्रतिक्रिया को प्रमुखता देता है, जबकि मूल की अर्थ-व्याप्ति पादटिप्पणी में दी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण भविष्यद्वाणी-शैली रखी गई है। यरूशलेम के स्त्रीलिंग एकवचन सम्बोधन को ‘तू ... बनेगी’ से स्पष्ट किया गया है। ‘न्याय-दण्ड’ न्यायिक अर्थ और वास्तविक दण्ड दोनों को समेटता है; ‘प्रकोप-भरी फटकारें’ मूल की तीव्रता को पठनीय हिन्दी में बनाए रखती हैं।
