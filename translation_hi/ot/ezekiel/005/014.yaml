  text: וְ/אֶתְּנֵ/ךְ֙ לְ/חָרְבָּ֣ה וּ/לְ/חֶרְפָּ֔ה בַּ/גּוֹיִ֖ם אֲשֶׁ֣ר סְבִיבוֹתָ֑יִ/ךְ לְ/עֵינֵ֖י כָּל עוֹבֵֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/005/014.yaml
  text: And I will make you a ruin and a reproach among the nations that are around you[b][a], in the sight of everyone who passes by.
translation:
  language: hi
  text: और मैं तुझे उजाड़[a] और निंदा का विषय[b] बना दूँगा—तेरे चारों ओर की जातियों के बीच, हर गुजरने वाले की आँखों के सामने।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘खंडहर’।
    reason: lexical_alternative
  - marker: b
    text: या ‘तिरस्कार का विषय’।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֶתְּנֵךְ
  choice: और मैं तुझे ... बना दूँगा
  rationale: נתן यहाँ לְ के साथ किसी दशा में पहुँचा देने का भाव देता है। ‘बना दूँगा’ हिन्दी में स्वाभाविक है और कारणात्मक अर्थ को स्पष्ट रखता है।
- source_word: לְחָרְבָּה
  choice: उजाड़
  rationale: חָרְבָּה किसी स्थान की नष्ट और उजड़ी हुई दशा को सूचित करता है। ‘उजाड़’ नगर की विनष्ट अवस्था को संक्षिप्त और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וּלְחֶרְפָּה
  choice: अपमान का पात्र
  rationale: חֶרְפָּה में निन्दा, तिरस्कार और अपमान का भाव है। ‘अपमान का पात्र’ बताता है कि यरूशलेम दूसरों की निन्दा और तिरस्कार का विषय बनेगा।
- source_word: בַּגּוֹיִם
  choice: जातियों के बीच
  rationale: גּוֹיִם यहाँ आसपास के राष्ट्रों अथवा जनसमुदायों को दर्शाता है; ‘जातियों’ से यह अर्थ धार्मिक यहूदी–गैरयहूदी भेद जोड़े बिना व्यक्त होता है।
- source_word: אֲשֶׁר סְבִיבוֹתָיִךְ
  choice: तेरे चारों ओर की
  rationale: यह सम्बन्धवाचक पद उन जातियों को निर्दिष्ट करता है जो सम्बोधित नगर के आसपास हैं। संक्षिप्त हिन्दी संरचना मूल अर्थ को बनाए रखती है।
- source_word: לְעֵינֵי
  choice: आँखों के सामने
  rationale: शाब्दिक दृश्य-वाचक मुहावरे को बनाए रखते हुए यह सार्वजनिक और प्रत्यक्ष रूप से घटने का भाव देता है।
- source_word: כָּל עוֹבֵר
  choice: हर आने-जाने वाले
  rationale: עֹבֵר गुजरने वाले व्यक्ति को दर्शाता है। हिन्दी का प्रचलित पद ‘आने-जाने वाला’ राह से गुजरने वाले प्रत्येक व्यक्ति का स्वाभाविक बोध कराता है।
theological_decisions:
- issue: यरूशलेम को स्त्रीलिंग एकवचन में प्रत्यक्ष सम्बोधन
  choice: ‘तुझे’ और ‘तेरे’ के द्वारा एकवचन प्रत्यक्ष सम्बोधन बनाए रखा गया।
  alternative: मुख्य पाठ में ‘यरूशलेम’ नाम स्पष्ट रूप से जोड़ना।
  rationale: इब्रानी पाठ नगर को स्त्रीलिंग एकवचन में सम्बोधित करते हुए उसका मानवीकरण करता है। नाम न जोड़ने से भविष्यद्वाणी की प्रत्यक्षता बनी रहती है और स्रोत से परे स्पष्टीकरण मुख्य पाठ में नहीं आता।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सहज भविष्यद्वाणी-संबंधी मुहावरा अपनाया गया है। ‘तू’ रूप मूल के एकवचन प्रत्यक्ष सम्बोधन और नगर के मानवीकरण को बनाए रखता है; वाक्य में डैश परिणाम और उसके सार्वजनिक दृश्य के बीच स्वाभाविक विराम देता है।
