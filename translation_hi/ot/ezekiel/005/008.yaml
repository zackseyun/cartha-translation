  rationale: The revision corrects the two substantive lexical and idiomatic problems while preserving the source’s solemn prophetic register, emphatic divine first person, singular address to Jerusalem, plural judgments, and public visibility before the nations. No footnote is needed, since the Hindi wording directly represents the source without unresolved ambiguity.
