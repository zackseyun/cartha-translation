review_pass:
  verdict: revise
  source_fidelity: The draft accurately represents the inferential opening, prophetic formula, compound divine title, divine opposition, the internal location of the action, and its public character. However, “जाति-जाति के लोगों” is not an accurate or idiomatic representation of הַגּוֹיִם (“the nations”), and “दण्ड के काम” is an unnatural rendering of the judicial plural מִשְׁפָּטִים.
  naturalness: “तेरे विरुद्ध” and “तेरे बीच” suitably retain the singular feminine address to Jerusalem in a dignified Hindi register. “जाति-जाति के लोगों की आँखों के सामने” is redundant and cumbersome, while “दण्ड के काम” is not natural modern Hindi. “राष्ट्रों की आँखों के सामने” and “न्याय के कार्य” are clear and formal without becoming excessively Sanskritized.
  terminology: “प्रभु यहोवा” appropriately preserves both אֲדֹנָי and the divine name יְהוָה. “न्याय के कार्य” retains the plural judicial acts without over-specifying their precise form; the punitive setting is evident from the context but need not be inserted as an interpretive paraphrase.
  issues:
  - severity: medium
    issue: “जाति-जाति के लोगों” for הַגּוֹיִם
    rationale: The Hebrew denotes “the nations,” not a repeated construction meaning people of every caste or ethnicity. In contemporary Hindi, “जाति-जाति” also risks evoking caste categories and adds “लोगों,” neither of which is present in the source.
  - severity: medium
    issue: “दण्ड के काम” for מִשְׁפָּטִים
    rationale: Although the judgments are punitive in context, “दण्ड के काम” is not idiomatic Hindi and weakens the explicit judicial sense of the Hebrew plural. “न्याय के कार्य” preserves the judicial terminology and plurality.
  revised_text: 'इसलिए प्रभु यहोवा यों कहते हैं: देखो, मैं स्वयं तेरे विरुद्ध हूँ, और मैं तेरे बीच राष्ट्रों की आँखों के सामने न्याय के कार्य करूँगा।'
  revised_footnotes: []
