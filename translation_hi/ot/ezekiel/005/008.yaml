source:
  edition: WLC
  text: לָ/כֵ֗ן כֹּ֤ה אָמַר֙ אֲדֹנָ֣/י יְהוִ֔ה הִנְ/נִ֥י עָלַ֖יִ/ךְ גַּם אָ֑נִי וְ/עָשִׂ֧יתִי בְ/תוֹכֵ֛/ךְ מִשְׁפָּטִ֖ים לְ/עֵינֵ֥י הַ/גּוֹיִֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/005/008.yaml
  text: 'Therefore thus says the Lord GOD: Behold[a], I myself am against you, and I will execute judgments in your midst before the eyes of the nations.'
translation:
  language: hi
  text: 'इसलिए प्रभु यहोवा यों कहते हैं: देखो, मैं स्वयं तेरे विरुद्ध हूँ, और मैं तेरे बीच राष्ट्रों की आँखों के सामने न्याय के कार्य करूँगा।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לָכֵן
  choice: इसलिए
  rationale: यह पिछले अभियोग के परिणाम को प्रस्तुत करने वाला स्वाभाविक और स्पष्ट निष्कर्षसूचक शब्द है।
- source_word: כֹּה אָמַר
  choice: यों कहते हैं
  rationale: भविष्यद्वक्ताओं के संदेश-सूत्र को वर्तमानकालीन, गरिमापूर्ण और प्रचलित हिन्दी में व्यक्त करता है।
- source_word: אֲדֹנָי יְהוִה
  choice: प्रभु यहोवा
  rationale: אֲדֹנָי को ‘प्रभु’ और परमेश्वर के विशिष्ट नाम יהוה को ‘यहोवा’ के रूप में रखकर संयुक्त उपाधि के दोनों अंश सुरक्षित रहते हैं।
- source_word: הִנְנִי
  choice: देख
  rationale: यह गंभीर घोषणा की ओर ध्यान खींचता है; आधुनिक हिन्दी में ‘देख’ संक्षिप्त और स्वाभाविक है।
- source_word: עָלַיִךְ
  choice: तेरे विरुद्ध
  rationale: न्याय के प्रसंग में यह स्थान नहीं, बल्कि शत्रुतापूर्ण विरोध व्यक्त करता है। स्त्रीलिंग एकवचन सम्बोधन यरूशलेम से है।
- source_word: גַּם אֲנִי
  choice: मैं स्वयं
  rationale: यह दैवी कर्ता पर दिए गए बल को सहज हिन्दी में सुरक्षित रखता है।
- source_word: וְעָשִׂיתִי ... מִשְׁפָּטִים
  choice: मैं ... दण्ड के काम करूँगा
  rationale: शाब्दिक ‘न्याय करूँगा’ की अपेक्षा यह बहुवचन מִשְׁפָּטִים को प्रसंगानुसार दण्डात्मक न्याय के ठोस कार्यों के रूप में व्यक्त करता है।
- source_word: בְתוֹכֵךְ
  choice: तेरे बीच
  rationale: यरूशलेम नगर के भीतर होने वाले न्याय को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: לְעֵינֵי הַגּוֹיִם
  choice: जाति-जाति के लोगों की आँखों के सामने
  rationale: न्याय की सार्वजनिक दृश्यता को बनाए रखता है और הַגּוֹיִם को आसपास की अन्य जातियों के अर्थ में व्यक्त करता है।
theological_decisions:
- issue: संयुक्त दैवी उपाधि אֲדֹנָי יְהוִה में יהוה का अनुवाद
  choice: प्रभु यहोवा
  alternative: प्रभु परमेश्वर
  rationale: ‘यहोवा’ मूल पाठ में आए विशिष्ट दैवी नाम को प्रकट रखता है, जबकि ‘परमेश्वर’ उसे सामान्य उपाधि में बदल देता।
- issue: מִשְׁפָּטִים का न्यायिक-दण्डात्मक आशय
  choice: दण्ड के काम
  alternative: न्याय के काम
  rationale: निकटवर्ती प्रसंग में ये निष्पक्ष निर्णय मात्र नहीं, यरूशलेम पर लागू किए जाने वाले दण्ड हैं; फिर भी ‘काम’ बहुवचन और ठोस क्रियान्वयन को बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण भविष्यद्वाणी-संबंधी शैली रखी गई है। यरूशलेम को स्त्रीलिंग एकवचन में सम्बोधित करने के कारण ‘तेरे’ का प्रयोग हुआ है। वाक्य को अत्यधिक संस्कृतनिष्ठ बनाने से बचाया गया है।
