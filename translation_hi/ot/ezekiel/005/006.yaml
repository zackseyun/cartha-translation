base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/005/006.yaml
  text: And she rebelled against my judgments with wickedness more than the nations[a], and against my statutes more than the lands that are around her; for they rejected my judgments[b], and they did not walk in my statutes.
translation:
  language: hi
  text: उसने मेरे न्याय-विधानों के विरुद्ध जातियों से भी बढ़कर दुष्टता से विद्रोह किया[a], और मेरी विधियों के विरुद्ध अपने चारों ओर के देशों से भी बढ़कर विद्रोह किया; क्योंकि उन्होंने मेरे न्याय-विधानों को ठुकरा दिया और मेरी विधियों पर नहीं चले[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसने मेरे न्याय-विधानों को दुष्टता में बदल डाला, जातियों से भी बढ़कर।” इस क्रिया को विद्रोह के अर्थ में या परमेश्वर की दी हुई बात को भ्रष्ट रूप से बदलने के अर्थ में समझा जा सकता है; मुख्य पाठ वाचा के विरुद्ध विद्रोह का अर्थ अपनाता है।
    reason: lexical_alternative
  - marker: b
    text: “विधियों पर चलना” हिब्रू मुहावरा है, जिसका अर्थ उनके अनुसार जीवन बिताना या उनका पालन करना है।
    reason: cultural_note
lexical_decisions:
- source_word: וַתֶּמֶר
  choice: उसने ... विद्रोह किया
  rationale: מרה का वाचा-संबंधी संदर्भ में प्रमुख अर्थ आज्ञा न मानना अथवा विद्रोह करना है। हिब्रू का कर्ता स्त्रीलिंग एकवचन है और पिछले संदर्भ के नगर, यरूशलेम, को मानवीकृत रूप में दिखाता है।
- source_word: מִשְׁפָּטַי
  choice: मेरे न्याय-विधान
  rationale: מִשְׁפָּטִים में न्यायिक और विधिक दोनों भाव हैं। ‘न्याय-विधान’ उस अर्थ को बनाए रखता और חֻקּוֹת से भेद करता है।
- source_word: לְרִשְׁעָה
  choice: दुष्टता से
  rationale: यहाँ पदबंध विद्रोह के दुष्ट ढंग अथवा स्वरूप को व्यक्त करता है। आधुनिक हिन्दी में ‘दुष्टता से’ स्वाभाविक है; भ्रष्ट परिवर्तन की सम्भावना पादटिप्पणी में सुरक्षित है।
- source_word: מִן הַגּוֹיִם
  choice: जातियों से भी बढ़कर
  rationale: מִן यहाँ तुलनात्मक है। ‘जातियाँ’ प्राचीन जनसमूहों के लिए स्वाभाविक बाइबलीय शब्द है और आधुनिक राष्ट्र-राज्य का अनावश्यक अर्थ नहीं जोड़ता।
- source_word: חֻקּוֹתַי
  choice: मेरी विधियाँ
  rationale: חֻקִּים परमेश्वर द्वारा ठहराए गए नियमों को सूचित करता है। ‘विधियाँ’ औपचारिक गरिमा रखते हुए מִשְׁפָּטִים के लिए प्रयुक्त ‘न्याय-विधान’ से शब्दगत भेद बनाए रखता है।
- source_word: מִן הָאֲרָצוֹת אֲשֶׁר סְבִיבוֹתֶיהָ
  choice: अपने चारों ओर के देशों से भी बढ़कर
  rationale: אֲרָצוֹת का यहाँ क्षेत्रीय अर्थ ‘देश’ है; स्त्रीलिंग प्रत्यय मानवीकृत यरूशलेम की ओर संकेत करता है।
- source_word: מָאָסוּ
  choice: ठुकरा दिया
  rationale: מאס तिरस्कारपूर्ण अस्वीकार को व्यक्त करता है। ‘ठुकरा दिया’ आधुनिक हिन्दी में स्पष्ट और अर्थपूर्ण है।
- source_word: לֹא הָלְכוּ בָהֶם
  choice: उन पर नहीं चले
  rationale: הלך ב व्यवस्था के अनुसार जीवन बिताने का हिब्रू मुहावरा है। हिन्दी में ‘विधियों पर चलना’ परिचित रूपक है और मूल बिंब को बनाए रखता है।
theological_decisions:
- issue: नगर का स्त्रीरूप मानवीकरण
  choice: ‘उसने’ के द्वारा पूर्वसंदर्भ के यरूशलेम को मानवीकृत कर्ता बनाए रखा गया है।
  alternative: ‘यरूशलेम ने’ या ‘उस नगर ने’ स्पष्ट रूप से जोड़ना।
  rationale: हिब्रू स्त्रीलिंग एकवचन कर्ता को संदर्भ से ग्रहण करता है। हिन्दी सर्वनाम में लिंग प्रकट नहीं होता, फिर भी ‘उसने’ अनावश्यक व्याख्यात्मक संज्ञा जोड़े बिना संदर्भगत मानवीकरण को बनाए रखता है।
- issue: एकवचन कर्ता से बहुवचन की ओर परिवर्तन
  choice: पहले ‘उसने’ और कारणवाचक भाग में ‘उन्होंने’ रखा गया है।
  alternative: पूरे पद में एकवचन बनाए रखना।
  rationale: मसोरेटिक पाठ स्वयं וַתֶּמֶר में स्त्रीलिंग एकवचन से מָאָסוּ और הָלְכוּ में बहुवचन पर जाता है। अनुवाद नगर और उसके निवासियों के बीच के इस अर्थपूर्ण तनाव को समतल नहीं करता।
- issue: व्यवस्था-संबंधी दो पदों का भेद
  choice: מִשְׁפָּטַי को ‘न्याय-विधान’ और חֻקּוֹתַי को ‘विधियाँ’ कहा गया है।
  alternative: दोनों को ‘नियम’ या ‘व्यवस्था’ कहना।
  rationale: मूल पाठ समानांतर संरचना में दो अलग वाचा-विधिक शब्द रखता है; भेद बनाए रखने से आरोप की विधिक बनावट सुरक्षित रहती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य रखी गई है। ‘न्याय-विधान’ और ‘विधियाँ’ विधिक-वाचा संबंधी औपचारिकता रखते हैं; ‘ठुकरा दिया’ तथा ‘पर चलना’ सहज आधुनिक हिन्दी हैं। तुलनात्मक वाक्य की दूसरी शाखा में ‘विद्रोह किया’ को मूल की तरह लुप्त माना गया है, ताकि समानांतरता और संक्षिप्तता बनी रहे।
