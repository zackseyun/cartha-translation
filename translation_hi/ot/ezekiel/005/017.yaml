base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/005/017.yaml
  text: And I will send famine and wild beasts against you[a], and they will bereave you; and pestilence and bloodshed will pass through you, and I will bring a sword upon you. I, Yahweh[d][c][b], have spoken.
translation:
  language: hi
  text: और मैं तुम पर अकाल और हिंसक जंगली पशु भेजूँगा[a], और वह तुम्हें संतानहीन कर देगा[b]। महामारी और रक्तपात तुम्हारे बीच से होकर गुज़रेंगे[c], और मैं तुम पर तलवार लाऊँगा। मैं, यहवे, ने कहा है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से “बुरा/हानिकारक जंगली पशु”; अर्थ “खूँखार पशु” भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: इस हिब्रू क्रिया का अर्थ “तुम्हें संतान-वियोग का दुःख देगा” भी हो सकता है; मूल में “संतान” अलग शब्द के रूप में नहीं आया है।
    reason: lexical_alternative
  - marker: c
    text: हिब्रू में “रक्त”; यहाँ आशय संभवतः रक्तपात है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשִׁלַּחְתִּי
  choice: और मैं ... भेजूँगा
  rationale: संयोजक सहित पिएल पूर्ण रूप प्रसंग में आगामी दण्ड की शृंखला को आगे बढ़ाता है; ‘भेजूँगा’ सक्रिय दैवी कार्रवाई को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: עֲלֵיכֶם
  choice: तुम पर
  rationale: यह 2 बहुवचन रूप है और विपत्ति भेजने के साथ हिन्दी में ‘तुम पर’ स्वाभाविक तथा स्रोत के निकट है। आगे एकवचन स्त्रीलिंग रूपों से व्यक्तिरूप यरूशलेम को संबोधन जारी रहता है; हिन्दी में यह संख्या-भेद दिखाई नहीं देता।
- source_word: רָעָב
  choice: अकाल
  rationale: न्याय के इस भविष्यवाणी-संदर्भ में यह केवल भूख नहीं, व्यापक अकाल को सूचित करता है।
- source_word: וְחַיָּה רָעָה
  choice: और हिंसक जंगली पशु
  rationale: शाब्दिक रूप से ‘बुरा/हानिकारक पशु’; यहाँ दण्ड लाने वाले खतरनाक वन्य पशु अभिप्रेत हैं। ‘हिंसक जंगली पशु’ खतरे और वन्य प्रकृति दोनों को स्पष्ट करता है।
- source_word: וְשִׁכְּלֻךְ
  choice: और वे तुम्हें संतानहीन कर देंगे
  rationale: शׁכל का यह रूप प्रायः संतान-वियोग या संतान से वंचित कर देने का अर्थ देता है। हिन्दी में ‘संतानहीन कर देंगे’ क्रिया के निहित अर्थ को स्पष्ट रखता है।
- source_word: וְדֶבֶר
  choice: महामारी
  rationale: न्याय-सूचियों में דֶבֶר व्यापक घातक रोग या महामारी को दर्शाता है; आधुनिक हिन्दी में ‘महामारी’ स्पष्ट और गरिमापूर्ण है।
- source_word: וָדָם
  choice: और रक्तपात
  rationale: मूल शब्द ‘रक्त’ है, पर दण्ड, महामारी और तलवार के संदर्भ में हिंसक मृत्यु या रक्तपात का अर्थ संभावित है; विकल्प पादटिप्पणी में सुरक्षित है।
- source_word: יַעֲבָר בָּךְ
  choice: तुम्हारे बीच से होकर गुज़रेंगे
  rationale: व्यक्तिरूप नगर के भीतर विपत्तियों के फैलने का भाव व्यक्त करता है। हिब्रू में क्रिया एकवचन है, जबकि हिन्दी में जुड़े हुए दोनों संज्ञा-पदों के कारण बहुवचन अधिक स्वाभाविक है।
- source_word: וְחֶרֶב אָבִיא עָלַיִךְ
  choice: और मैं तुम पर तलवार चलवाऊँगा
  rationale: ‘तलवार’ के ठोस न्याय-चित्र को बनाए रखते हुए हिन्दी मुहावरे में इसका आशय युद्ध और वध को अपने विरुद्ध आने देने से है; शाब्दिक विकल्प पादटिप्पणी में दिया गया है।
- source_word: אֲנִי יְהוָה דִּבַּרְתִּי
  choice: मैं, यहवे, कह चुका हूँ
  rationale: स्वतंत्र सर्वनाम दैवी वक्ता पर बल देता है; יְהוָה को व्यक्तिगत नाम ‘यहवे’ से और पूर्ण क्रिया को घोषणा की निश्चितता दर्शाने वाले ‘कह चुका हूँ’ से व्यक्त किया गया है।
theological_decisions:
- issue: दैवी नाम יְהוָה का अनुवाद
  choice: यहवे
  alternative: यहोवा; प्रभु
  rationale: मूल में चार-अक्षरी व्यक्तिगत दैवी नाम प्रत्यक्ष है। ‘यहवे’ उसे उपाधि में बदले बिना आधुनिक हिन्दी लिप्यंतरण में प्रस्तुत करता है।
- issue: וְשִׁכְּלֻךְ में संतान-वियोग को स्पष्ट करना
  choice: तुम्हें संतानहीन कर देंगे
  alternative: तुम्हें शोक-संतप्त कर देंगे; तुम्हारी संतान छीन लेंगे
  rationale: क्रिया में संतान खोने या संतान से वंचित होने का अर्थ निहित है, यद्यपि ‘संतान’ अलग संज्ञा के रूप में नहीं लिखी गई। मुख्य पाठ अर्थ स्पष्ट करता है और पादटिप्पणी अधिक सामान्य विकल्प सुरक्षित रखती है।
- issue: דָם का संदर्भगत अर्थ
  choice: रक्तपात
  alternative: रक्त
  rationale: न्याय की सूची में यह हिंसक मृत्यु का सूचक जान पड़ता है, पर शाब्दिक ‘रक्त’ की वास्तविक संभावना पादटिप्पणी में रखी गई है।
- issue: अकाल और पशुओं का וְשִׁכְּלֻךְ से व्याकरणिक संबंध
  choice: वे तुम्हें संतानहीन कर देंगे
  alternative: वह तुम्हें संतानहीन कर देगा
  rationale: पूर्ववर्ती दोनों विपत्तियों को संयुक्त कर्ता समझना सहज है, यद्यपि निकटतम ‘पशु’ व्याकरणिक रूप से एकवचन है। हिन्दी बहुवचन उस सामूहिक प्रभाव को व्यक्त करता है, बिना दण्ड के साधन को किसी एक तक सीमित किए।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की है, पर भविष्यवाणी की गंभीरता बनाए रखने के लिए ‘अकाल’, ‘महामारी’, ‘रक्तपात’ और ‘तलवार’ जैसे गरिमापूर्ण शब्द रखे गए हैं। संबोधन मूल में पहले बहुवचन और फिर व्यक्तिरूप यरूशलेम के लिए स्त्रीलिंग एकवचन हो जाता है; हिन्दी ‘तुम’ इस परिवर्तन को स्वाभाविक रूप से अस्पष्ट रखता है। सभी पाठ-पादटिप्पणी चिह्न मुख्य पाठ में क्रम से उपस्थित हैं।
