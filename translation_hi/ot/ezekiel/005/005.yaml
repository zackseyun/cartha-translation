base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/005/005.yaml
  text: 'Thus says the Lord GOD: This is Jerusalem. I have set her in the midst of the nations[a], with lands all around her.'
translation:
  language: hi
  text: 'प्रभु याहवे[a] यों कहते हैं: यह यरूशलेम है। मैंने उसे जातियों के बीच में रखा है, और उसके चारों ओर देश हैं।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'हिब्रू में: ‘अदोनाय’ और परमेश्वर का नाम יהוה (YHWH); यहाँ इस नाम को ‘याहवे’ लिखा गया है। कुछ अनुवाद इसे ‘प्रभु परमेश्वर’ लिखते हैं।'
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה אָמַר
  choice: यों कहते हैं
  rationale: यह भविष्यवाणी की घोषणा का प्रचलित सूत्र है; वर्तमानकालीन हिन्दी वाक्य-विन्यास मूल के औपचारिक और अधिकारपूर्ण स्वर को स्वाभाविक ढंग से रखता है।
- source_word: אֲדֹנָי יְהוִה
  choice: प्रभु यहोवा
  rationale: אֲדֹנָי को ‘प्रभु’ और परमेश्वर के व्यक्तिगत नाम יהוה को ‘यहोवा’ किया गया है, जिससे संयुक्त उपाधि के दोनों घटक स्पष्ट रहते हैं।
- source_word: זֹאת יְרוּשָׁלִַם
  choice: यह यरूशलेम है
  rationale: संकेतवाचक זֹאת के पहचान कराने वाले और बलयुक्त अर्थ को सीधे बनाए रखता है।
- source_word: בְּתוֹךְ הַגּוֹיִם
  choice: जातियों के बीच में
  rationale: בְּתוֹךְ केंद्रीय अथवा मध्यवर्ती स्थिति को दर्शाता है; ‘बीच में’ साधारण ‘के बीच’ से इस स्थानगत बल को अधिक स्पष्ट रखता है।
- source_word: שַׂמְתִּיהָ
  choice: मैंने उसे ... रखा है
  rationale: क्रिया का अर्थ रखना/स्थापित करना है; पूर्ण वर्तमान उस स्थापित स्थिति के वर्तमान परिणाम को सहज हिन्दी में व्यक्त करता है। स्त्रीलिंग प्रत्यय यरूशलेम की ओर संकेत करता है, जिसे हिन्दी में ‘उसे’ कहा गया है।
- source_word: וּסְבִיבוֹתֶיהָ אֲרָצוֹת
  choice: और उसके चारों ओर देश हैं
  rationale: मूल के समन्वयी वाक्य-विन्यास और यरूशलेम को घेरे हुए भूभागों के स्थानगत चित्र को स्पष्ट तथा स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: संयुक्त ईश्वरीय उपाधि אֲדֹנָי יְהוִה का अनुवाद
  choice: प्रभु यहोवा
  alternative: प्रभु परमेश्वर
  rationale: मूल में सामान्य उपाधि אֲדֹנָי के साथ वाचा-संबंधी व्यक्तिगत नाम יהוה उपस्थित है। ‘प्रभु यहोवा’ दोनों को अलग-अलग पहचानने देता है; पादटिप्पणी पाठक को नाम के हिब्रू रूप और एक प्रचलित वैकल्पिक परंपरा की जानकारी देती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, स्पष्ट भविष्यवाणी-शैली। ‘यों कहते हैं’ पारंपरिक बाइबलीय स्वर रखते हुए आज भी सहज बोधगम्य है; वाक्य-संरचना मूल के स्थानगत जोर और संक्षिप्तता को बनाए रखती है।
