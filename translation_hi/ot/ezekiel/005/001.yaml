source:
  edition: WLC
  text: וְ/אַתָּ֨ה בֶן אָדָ֜ם קַח לְ/ךָ֣ חֶ֣רֶב חַדָּ֗ה תַּ֤עַר הַ/גַּלָּבִים֙ תִּקָּחֶ֣/נָּה לָּ֔/ךְ וְ/הַעֲבַרְתָּ֥ עַל רֹאשְׁ/ךָ֖ וְ/עַל זְקָנֶ֑/ךָ וְ/לָקַחְתָּ֥ לְ/ךָ֛ מֹאזְנֵ֥י מִשְׁקָ֖ל וְ/חִלַּקְתָּֽ/ם־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/005/001.yaml
  text: And you[a], son of man, take for yourself a sharp sword; take it as a barber’s razor, and pass it over your head and over your beard[b]. Then take for yourself scales for weighing and divide the hair.
translation:
  language: hi
  text: “और हे मनुष्य के पुत्र, तू अपने लिए एक तेज तलवार ले। उसे नाई के उस्तरे की तरह काम में ले और अपने सिर तथा अपनी दाढ़ी पर चला। फिर अपने लिए तौलने का तराजू ले और बालों[a] को अलग-अलग भागों में बाँट दे।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: मूल हिब्रू में शाब्दिक रूप से “उन्हें बाँट दे” है; “उन्हें” से आशय अभी काटे गए बालों से है।
    reason: implicit_referent
lexical_decisions:
- source_word: בֶן אָדָם
  choice: मनुष्य के पुत्र
  rationale: यहेजकेल में बार-बार आने वाले इस संबोधन के हिब्रू रूप और परिचित भविष्यद्वक्तात्मक शैली को सुरक्षित रखता है।
- source_word: חֶרֶב חַדָּה
  choice: एक तेज तलवार
  rationale: חֶרֶב का सामान्य अर्थ ‘तलवार’ और חַדָּה का अर्थ ‘तेज’ है; सरल और सीधा अनुवाद मूल बिंब को बनाए रखता है।
- source_word: תַּעַר הַגַּלָּבִים
  choice: नाई के उस्तरे
  rationale: यह संबंधवाची पद नाइयों द्वारा काम में लिए जाने वाले उस्तरे को दर्शाता है। आधुनिक हिन्दी में एकवचन ‘नाई का उस्तरा’ स्वाभाविक है।
- source_word: תִּקָּחֶנָּה לָּךְ
  choice: उसे … की तरह काम में ले
  rationale: हिब्रू में ‘लेना’ क्रिया दोहराई गई है, पर यहाँ दूसरी बार उसका व्यावहारिक भाव तलवार को उस्तरे के रूप में इस्तेमाल करना है। हिन्दी में यह प्रयोग आदेश का आशय स्पष्ट और स्वाभाविक बनाता है।
- source_word: וְהַעֲבַרְתָּ עַל רֹאשְׁךָ וְעַל זְקָנֶךָ
  choice: अपने सिर तथा अपनी दाढ़ी पर चला
  rationale: עבר का कारक रूप और עַל यहाँ उस्तरे को सिर और दाढ़ी पर चलाने की क्रिया बताते हैं; ‘चला’ हिन्दी में इसी क्रिया का सहज प्रयोग है।
- source_word: מֹאזְנֵי מִשְׁקָל
  choice: तौलने का तराजू
  rationale: यह तौलकर हिस्से निर्धारित करने वाले तराजू का मानक हिब्रू पद है; हिन्दी में स्पष्ट और ठोस बिंब देता है।
- source_word: וְחִלַּקְתָּם
  choice: बालों को अलग-अलग भागों में बाँट दे
  rationale: पुल्लिंग बहुवचन प्रत्यय का संदर्भ मुंडन से प्राप्त बालों से है, यद्यपि ‘बाल’ संज्ञा इस पद में व्यक्त नहीं है। प्रसंगानुसार इसे स्पष्ट करना हिन्दी में आवश्यक है।
