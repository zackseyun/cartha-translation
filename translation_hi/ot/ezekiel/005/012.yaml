  text: שְׁלִשִׁתֵ֞/יךְ בַּ/דֶּ֣בֶר יָמ֗וּתוּ וּ/בָֽ/רָעָב֙ יִכְל֣וּ בְ/תוֹכֵ֔/ךְ וְ/הַ֨/שְּׁלִשִׁ֔ית בַּ/חֶ֖רֶב יִפְּל֣וּ סְבִיבוֹתָ֑יִ/ךְ וְ/הַ/שְּׁלִישִׁית֙ לְ/כָל ר֣וּחַ אֱזָרֶ֔ה וְ/חֶ֖רֶב אָרִ֥יק אַחֲרֵי/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/005/012.yaml
  text: A third of you will die by pestilence and be consumed by famine in your midst[a], and a third will fall by the sword all around you, and a third I will scatter to every wind[b], and I will draw out a sword after them.
translation:
  language: hi
  text: तुममें से एक तिहाई महामारी से मर जाएँगे और तुम्हारे बीच अकाल से नष्ट हो जाएँगे; एक तिहाई तुम्हारे चारों ओर तलवार से मारे जाएँगे; और एक तिहाई को मैं हर हवा की ओर बिखेर दूँगा[a], और उनके पीछे तलवार खींचूँगा[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में ‘हर हवा की ओर’ है; यह हर दिशा में बिखेरने का मुहावरा है।
    reason: cultural_note
  - marker: b
    text: या ‘उनके पीछे तलवार म्यान से निकालूँगा।’
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁלִשִׁתֵיךְ / הַשְּׁלִשִׁית / הַשְּׁלִישִׁית
  choice: एक तिहाई
  rationale: न्याय के तीन समान भागों की दोहराई गई संरचना को स्पष्ट और स्वाभाविक आधुनिक हिन्दी में बनाए रखता है। पहले खंड में ‘लोग’ जोड़ने से बहुवचन क्रियाएँ सहज होती हैं, जबकि बाद के खंडों में वही संदर्भ समझा जाता है।
- source_word: דֶּבֶר
  choice: महामारी
  rationale: यह भविष्यद्वाणी के न्याय-संदर्भ में व्यापक रूप से फैलने वाले घातक रोग को सूचित करता है; ‘महामारी’ आधुनिक हिन्दी में स्पष्ट और सटीक है।
- source_word: רָעָב
  choice: अकाल
  rationale: यह केवल भूख की अनुभूति नहीं, बल्कि भोजन की व्यापक कमी और अकाल की दशा को दर्शाता है।
- source_word: יִכְלוּ
  choice: समाप्त हो जाएँगे
  rationale: क्रिया के ‘पूरी तरह चुक जाने/नष्ट हो जाने’ के कठोर भाव को बनाए रखता है और अकाल के साथ स्वाभाविक है।
- source_word: בְּתוֹכֵךְ
  choice: तुम्हारे बीच
  rationale: यरूशलेम को स्त्रीलिंग एकवचन में संबोधित करने वाले मूल पाठ का सीधा द्वितीय-पुरुष संबोधन बिना नाम जोड़े सुरक्षित रहता है।
- source_word: חֶרֶב
  choice: तलवार
  rationale: युद्ध में हिंसक मृत्यु के ठोस भविष्यद्वाणी-संबंधी बिंब को ‘युद्ध’ जैसे अमूर्त शब्द में नहीं बदलता।
- source_word: יִפְּלוּ
  choice: मारे जाएँगे
  rationale: तलवार से ‘गिरने’ का आशय हिन्दी में स्पष्ट करता है; शाब्दिक ‘गिरेंगे’ की संभावित अस्पष्टता से बचते हुए युद्ध में मृत्यु का अर्थ रखता है।
- source_word: סְבִיבוֹתָיִךְ
  choice: तुम्हारे चारों ओर
  rationale: बहुवचनात्मक, चारों तरफ फैले हुए अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: לְכָל רוּחַ
  choice: हर ओर की हवा में
  rationale: मूल का ‘हर हवा की ओर’ वाला ठोस बिंब बनाए रखते हुए हिन्दी में पठनीय अभिव्यक्ति देता है; मुहावरे का दिशात्मक अर्थ पादटिप्पणी में स्पष्ट किया गया है।
- source_word: אֱזָרֶה
  choice: मैं ... बिखेर दूँगा
  rationale: क्रिया के तितर-बितर करने के मुख्य अर्थ को स्पष्ट करता है; संभावित ओसाने के बिंब को अनावश्यक रूप से प्रमुख नहीं बनाता।
- source_word: אָרִיק
  choice: तलवार खींचूँगा
  rationale: तलवार को म्यान से निकालने के मुहावरे को संक्षिप्त और सजीव हिन्दी में रखता है; वैकल्पिक विशदीकरण पादटिप्पणी में दिया गया है।
theological_decisions:
- issue: मानवीकृत नगर को संबोधन और न्याय का लक्ष्य
  choice: ‘तुम/तुम्हारे’ के सीधे संबोधन को बनाए रखना
  alternative: पद में स्पष्ट रूप से ‘यरूशलेम’ जोड़ना
  rationale: इब्रानी पाठ नगर को स्त्रीलिंग एकवचन में सीधे संबोधित करता है। नाम जोड़ने के बजाय संबोधन सुरक्षित रखने से भविष्यद्वाणी की मानवीकरणयुक्त वाक्शैली बनी रहती है।
- issue: न्याय के ठोस बिंब
  choice: ‘महामारी’, ‘तलवार’ और हवा में बिखेरने के बिंब बनाए रखना
  alternative: इन्हें सामान्यीकृत करके ‘रोग’, ‘युद्ध’ और ‘हर दिशा में’ कहना
  rationale: मूल के ठोस और प्रबल न्याय-बिंब आधुनिक पाठक के लिए समझने योग्य हैं; उन्हें अमूर्त करने की आवश्यकता नहीं है।
- issue: तलवार खींचने का अनुवर्ती न्याय
  choice: ‘उनके पीछे तलवार खींचूँगा’ के रूप में मूल की संक्षिप्तता रखना
  alternative: ‘उनका पीछा करके उन्हें तलवार से मारूँगा’ के रूप में निहित परिणाम स्पष्ट करना
  rationale: मूल पाठ पीछा और तलवार का बिंब देता है, पर परिणाम को इस विस्तृत रूप में नहीं कहता; इसलिए धार्मिक आशय को बढ़ाकर निश्चित नहीं किया गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए स्पष्ट रखी गई है। अर्धविरामों से तीन ‘एक तिहाई’ खंडों की न्याय-संरचना उभरती है। मूल स्रोत के अनुसार पादटिप्पणी [a] हवा वाले वाक्यांश के बाद और [b] तलवार खींचने वाले वाक्यांश के बाद रखी गई है; प्रदत्त अंग्रेज़ी परामर्श-पाठ में इन संकेतों का स्थान विषय से मेल नहीं खाता था।
