  text: לָ/כֵ֞ן כֹּה אָמַ֨ר אֲדֹנָ֣/י יְהוִה֮ חַי אָנִי֒ אִם לֹ֗א אָֽלָתִ/י֙ אֲשֶׁ֣ר בָּזָ֔ה וּ/בְרִיתִ֖/י אֲשֶׁ֣ר הֵפִ֑יר וּ/נְתַתִּ֖י/ו בְּ/רֹאשֽׁ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/017/019.yaml
  text: 'Therefore thus says the Lord GOD: As I live[a], surely my oath that he despised and my covenant that he broke—I will place them on his own head.'
translation:
  language: hi
  text: 'इसलिए प्रभु याहवे यह कहते हैं: मेरे जीवन की शपथ,[a] जिस शपथ को उसने तुच्छ जाना और जिस वाचा को उसने तोड़ा है, मैं उसे उसी के सिर पर रखूँगा।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “अपने जीवन की सौगंध।” यहाँ प्रयुक्त ‘शपथ’ के शब्द में शपथ तोड़ने पर आने वाले अभिशाप का भाव भी हो सकता है।
    reason: हिब्रू के शपथ-सूत्र और אָלָה की अर्थ-व्याप्ति को सुरक्षित रखना।
lexical_decisions:
- source_word: לָכֵן
  choice: इसलिए
  rationale: यह पिछले आरोप से निकलने वाले दैवी न्याय का स्पष्ट निष्कर्ष प्रस्तुत करता है।
- source_word: כֹּה אָמַר
  choice: यह कहते हैं
  rationale: भविष्यद्वाणी के पारंपरिक संदेश-सूत्र को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: אֲדֹנָי יְהוִה
  choice: प्रभु याहवे
  rationale: אֲדֹנָי को 'प्रभु' और परमेश्वर के व्यक्तिगत वाचा-नाम יהוה को 'याहवे' के रूप में अलग-अलग सुरक्षित रखता है।
- source_word: חַי אָנִי
  choice: मेरे जीवन की शपथ
  rationale: दैवी आत्म-शपथ के सूत्र का गंभीर और हिन्दी में स्वाभाविक रूप है।
- source_word: אִם לֹא
  choice: '[शपथ-सूत्र द्वारा दृढ़ निश्चय]'
  rationale: शपथ के प्रसंग में यह शाब्दिक शर्त नहीं, बल्कि आने वाली घोषणा की निश्चितता पर बल देता है; हिन्दी के शपथ-सूत्र में यह बल अंतर्निहित है।
- source_word: אָלָתִי
  choice: जिस शपथ को
  rationale: אלה में उल्लंघन पर अभिशाप का भाव हो सकता है, पर यहाँ मुख्य बल उस शपथबद्ध दायित्व पर है जिसे राजा ने तुच्छ जाना।
- source_word: בָּזָה
  choice: तुच्छ जाना
  rationale: यह केवल अवज्ञा नहीं, बल्कि अवमाननापूर्ण अस्वीकार का भाव व्यक्त करता है।
- source_word: בְּרִיתִי
  choice: जिस वाचा को
  rationale: राजनीतिक संधि होने पर भी याहवे उसे अपनी वाचा कहते हैं क्योंकि वह उनके समक्ष शपथ के द्वारा बाँधी गई थी।
- source_word: הֵפִיר
  choice: तोड़ा
  rationale: वाचा के उल्लंघन के लिए स्पष्ट और प्रचलित हिन्दी अभिव्यक्ति है।
- source_word: וּנְתַתִּיו
  choice: उसका फल मैं ... डालूँगा
  rationale: हिब्रू में एकवचन प्रत्यय है; यह तुच्छ ठहराई गई शपथ और तोड़ी गई वाचा से उत्पन्न संयुक्त परिणाम अथवा दंड की ओर संकेत कर सकता है। 'उसका फल' इस एकवचन को बनाए रखते हुए हिन्दी में अर्थ स्पष्ट करता है।
- source_word: בְּרֹאשׁוֹ
  choice: उसी के सिर पर
  rationale: उत्तरदायित्व और दंड अपराधी पर लौटने के रूपक को सुरक्षित रखता है और हिन्दी में स्वाभाविक है।
theological_decisions:
- issue: संयुक्त उपाधि אֲדֹנָי יְהוִה में परमेश्वर के नाम का अनुवाद
  choice: प्रभु याहवे
  alternative: प्रभु परमेश्वर
  rationale: मूल पाठ की उपाधि और व्यक्तिगत वाचा-नाम, दोनों को स्पष्ट रखता है तथा उन्हें एक ही सामान्य पदवी में नहीं मिलाता।
- issue: אָלָה का मुख्य अर्थ
  choice: शपथ
  alternative: अभिशाप
  rationale: इस प्रसंग में केंद्र उस शपथबद्ध दायित्व पर है जिसे सिदकिय्याह ने तुच्छ जाना; फिर भी उल्लंघन से जुड़े अभिशाप का अर्थ-संकेत पादटिप्पणी में सुरक्षित है।
- issue: וּנְתַתִּיו के एकवचन कर्म का संदर्भ
  choice: शपथ और वाचा के उल्लंघन का संयुक्त फल
  alternative: दोनों को बहुवचन रूप में उसके सिर पर रखना
  rationale: मसोरेटी पाठ में प्रत्यय एकवचन है। अतः दोनों संज्ञाओं को सीधे बहुवचन कर्म बनाने के बजाय उनके उल्लंघन के संयुक्त परिणाम को व्यक्त किया गया है, बिना दंड की प्रकृति को अत्यधिक निश्चित किए।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। भविष्यद्वाणी की औपचारिकता बनाए रखते हुए अस्वाभाविक शब्दशः संरचना से बचा गया है; ‘उसी के सिर पर’ मूल रूपक को सुरक्षित रखता है।
