source:
  edition: WLC
  text: לִֽ/הְיוֹת֙ מַמְלָכָ֣ה שְׁפָלָ֔ה לְ/בִלְתִּ֖י הִתְנַשֵּׂ֑א לִ/שְׁמֹ֥ר אֶת בְּרִית֖/וֹ לְ/עָמְדָֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/017/014.yaml
  text: so that it might become a lowly kingdom[a], not lifting itself up, but keeping his covenant so as to stand.
translation:
  language: hi
  text: ताकि वह निम्न स्थिति वाला राज्य बने, अपने आपको ऊँचा न उठाए, बल्कि उसकी वाचा का पालन करे ताकि वह कायम रहे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לִהְיוֹת
  choice: ताकि वह ... बना रहे
  rationale: ל־युक्त क्रियार्थक संज्ञा यहाँ पिछले कथन के उद्देश्य को व्यक्त करती है। היה के अवस्था में होने या बने रहने के भाव को सहज हिन्दी में व्यक्त किया गया है।
- source_word: מַמְלָכָה שְׁפָלָה
  choice: एक छोटा राज्य
  rationale: ממלכה राजनीतिक राज्य को और שׁפלה उसकी घटाई गई, अधीन हैसियत को दर्शाता है। ‘छोटा राज्य’ सामान्य हिन्दी में राजनीतिक दुर्बलता व्यक्त करता है, नैतिक विनम्रता नहीं।
- source_word: לְבִלְתִּי הִתְנַשֵּׂא
  choice: अपने आपको ऊँचा न उठाए
  rationale: Hitpael रूप आत्म-उत्थान या स्वयं को महान बनाने का भाव रखता है; प्रतिवर्ती अर्थ स्पष्ट रखा गया है।
- source_word: לִשְׁמֹר
  choice: पालन करे
  rationale: वाचा या संधि के साथ שׁמר का अर्थ उसकी शर्तों को मानना और निभाना है; हिन्दी में ‘पालन करना’ सर्वाधिक स्वाभाविक है।
- source_word: בְּרִיתוֹ
  choice: उसकी वाचा
  rationale: ברית यहाँ बेबीलोन के राजा के साथ बाध्यकारी राजनीतिक समझौते को सूचित करता है। ‘वाचा’ मूल पद की गंभीरता और शास्त्रीय शब्द-संगति को बनाए रखता है; ‘संधि’ पाद-टिप्पणी में दिया गया है।
- source_word: לְעָמְדָהּ
  choice: और इस प्रकार स्थिर रहे
  rationale: עמד का मूल बिंब ‘खड़े रहने’ का है, पर राज्य के लिए हिन्दी में ‘स्थिर रहना’ उसके कायम या स्थापित रहने का अर्थ स्वाभाविक ढंग से देता है। स्त्रीलिंग प्रत्यय का संदर्भ राज्य से है।
theological_decisions:
- issue: राजनीतिक प्रसंग में בְּרִית का अनुवाद
  choice: वाचा
  alternative: संधि
  rationale: तात्कालिक प्रसंग एक शपथबद्ध राजनीतिक समझौते का है, फिर भी मूल इब्रानी पद ברית है। ‘वाचा’ प्रमुख शास्त्रीय शब्द-संबंध को बनाए रखता है, जबकि ‘संधि’ का प्रसंगानुकूल अर्थ पाद-टिप्पणी में सुरक्षित है।
translation_notes:
  register: आधुनिक मानक हिन्दी; शैली गरिमापूर्ण और सामान्य पाठक के लिए सहज है। राजनीतिक अधीनता को ‘छोटा राज्य’ से व्यक्त किया गया है और वाचा/संधि की वास्तविक शब्दगत गुंजाइश पाद-टिप्पणी में रखी गई है।
