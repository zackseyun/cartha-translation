base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/017/009.yaml
  text: 'Say[a], ‘Thus says the Lord GOD: Will it prosper? Will he not pull up its roots and cut off its fruit, so that it dries up? All the fresh leaves of its growth will wither[b]. And not by a great arm or by many people will it be lifted from its roots.’'
translation:
  language: hi
  text: 'कह, ‘प्रभु याहवे यों कहते हैं: क्या वह दाखलता फले-फूलेगी? क्या वह उसकी जड़ें उखाड़कर[a] उसका फल नहीं काट डालेगा, जिससे वह सूख जाए? उसकी नई बढ़त के सारे पत्ते मुरझा जाएँगे। उसे उसकी जड़ों से उठा लेने के लिए न तो बड़ी भुजा[b] की और न बहुत-से लोगों की आवश्यकता पड़ेगी।’'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इस इब्रानी क्रिया का अर्थ जड़ों को खींचकर अलग कर देना या तोड़ निकालना भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक अर्थ ‘बड़ी भुजा’ है; यह सामर्थ्य या शक्ति के लिए प्रयुक्त रूपक है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱמֹר
  choice: कह
  rationale: एकवचन पुल्लिंग आज्ञार्थक रूप और भविष्यद्वक्ताई घोषणा की संक्षिप्त भूमिका को बनाए रखता है।
- source_word: כֹּה אָמַר אֲדֹנָי יְהוִה
  choice: प्रभु याहवे यों कहते हैं
  rationale: मानक संदेशवाहक सूत्र को स्वाभाविक हिन्दी में रखा गया है और יהוה को व्यक्तिगत वाचा-नाम ‘याहवे’ के रूप में लिप्यंतरित किया गया है।
- source_word: תִּצְלָח
  choice: क्या वह दाखलता फले-फूलेगी?
  rationale: क्रिया की सफलता और वनस्पति की समृद्धि—दोनों भाव ‘फले-फूलेगी’ में आते हैं; संदर्भ स्पष्ट करने के लिए निहित कर्ता ‘दाखलता’ व्यक्त किया गया है।
- source_word: הֲלוֹא
  choice: क्या ... नहीं
  rationale: सकारात्मक उत्तर की अपेक्षा रखने वाले इब्रानी आलंकारिक प्रश्न को उसी प्रश्नात्मक तनाव के साथ रखा गया है।
- source_word: יְנַתֵּק
  choice: जड़ें उखाड़कर
  rationale: क्रिया जड़ों को खींचकर अलग करने या तोड़ निकालने का प्रबल अर्थ देती है; ‘उखाड़ना’ कृषि-बिंब में स्वाभाविक है।
- source_word: יְקוֹסֵס
  choice: फल ... काट डालेगा
  rationale: दुर्लभ क्रिया के काटने या अलग कर देने के भाव को स्पष्ट रखते हुए विनाशकारी पूर्णता ‘डालेगा’ से व्यक्त की गई है।
- source_word: וְיָבֵשׁ
  choice: जिससे वह सूख जाए
  rationale: जड़ों और फल के नष्ट किए जाने के परिणाम को व्यक्त करता है, जबकि अगले תִּיבָשׁ से शब्दगत भिन्नता भी बनाए रखता है।
- source_word: כָּל טַרְפֵּי צִמְחָהּ
  choice: उसकी नई बढ़त के सारे पत्ते
  rationale: ताज़ी पत्तियों और अंकुरित बढ़त के ठोस वनस्पति-बिंब को सहज आधुनिक हिन्दी में रखा गया है।
- source_word: תִּיבָשׁ
  choice: मुरझा जाएँगे
  rationale: पत्तियों के सूखने के लिए स्वाभाविक हिन्दी क्रिया है और पूर्ववर्ती ‘सूख जाए’ की अनावश्यक पुनरावृत्ति से बचाती है।
- source_word: וְלֹא בִזְרֹעַ גְּדוֹלָה וּבְעַם רָב לְמַשְׂאוֹת אוֹתָהּ מִשָּׁרָשֶׁיהָ
  choice: उसे उसकी जड़ों से उखाड़ने के लिए न तो बड़ी शक्ति की और न बहुत-से लोगों की आवश्यकता पड़ेगी
  rationale: इब्रानी का आशय है कि दाखलता इतनी निर्बल होगी कि उसे उखाड़ने के लिए विशाल बल या जनसमूह आवश्यक नहीं होगा। ‘लोगों’ को ‘सेना’ बनाकर अर्थ को अधिक विशिष्ट नहीं किया गया।
theological_decisions:
- issue: संयुक्त उपाधि אֲדֹנָי יְהוִה में दिव्य नाम का रूप
  choice: प्रभु याहवे
  alternative: प्रभु परमेश्वर
  rationale: יהוה पाठ में प्रत्यक्ष वाचा-नाम है; ‘याहवे’ उसे उपाधि में विलीन किए बिना सुरक्षित रखता है और אֲדֹנָי का अलग अनुवाद ‘प्रभु’ देता है।
- issue: जड़ों को उखाड़ने वाले का अनिर्दिष्ट संदर्भ
  choice: वह
  alternative: पहला उकाब
  rationale: इब्रानी क्रिया का कर्ता संदर्भ से समझा जाता है, पर इस पद में उसका नाम नहीं दिया गया; सर्वनाम मूल की साहित्यिक और व्याख्यात्मक गुंजाइश बनाए रखता है।
- issue: अंतिम खंड में सामर्थ्य की आवश्यकता का निषेध
  choice: बड़ी शक्ति और बहुत-से लोगों की आवश्यकता नहीं पड़ेगी
  alternative: बड़ी शक्ति या बहुत-से लोगों के द्वारा वह जड़ों से नहीं उठाई जाएगी
  rationale: לְמַשְׂאוֹת के प्रयोजन और निषेध का सन्दर्भगत अर्थ यह है कि उसे उखाड़ना कठिन नहीं होगा; यह रूप वाक्य को स्वाभाविक बनाता है, पर किसी विशेष सैन्य पहचान को नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। दाखलता, जड़, फल, नई बढ़त और पत्तों के मूल कृषि-बिंब सुरक्षित हैं। आलंकारिक प्रश्न को कथन में बदलने के बजाय प्रश्न ही रखा गया है।
