base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/017/001.yaml
  text: And the word of Yahweh came to me[a], saying,
translation:
  language: hi
  text: 'और याहवे का वचन मेरे पास आया, यह कहते हुए:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: और ... आया
  rationale: वाव-क्रमिक के साथ היה यहाँ सामान्य भविष्यद्वाणी-वृत्तांत सूत्र का आरम्भ करता है। शाब्दिक ‘और ऐसा हुआ’ हिन्दी में अनावश्यक रूप से बोझिल होता; ‘और ... आया’ क्रम और स्वाभाविकता दोनों बनाए रखता है।
- source_word: דְבַר
  choice: वचन
  rationale: भविष्यद्वाणी के सूत्र में דָּבָר परमेश्वर से प्राप्त वचन या संदेश को दर्शाता है। ‘वचन’ इस स्थापित बाइबलीय प्रयोग को सुरक्षित रखते हुए आधुनिक हिन्दी में बोधगम्य है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: मूल पाठ में परमेश्वर का व्यक्तिगत नाम टेट्राग्रामटन है। हिन्दी में प्रचलित नाम-रूप ‘यहोवा’ शीर्षक ‘प्रभु’ से भेद बनाए रखता है।
- source_word: אֵלַי
  choice: मेरे पास
  rationale: इस भविष्यद्वाणी-सूत्र में אֵלַי का स्वाभाविक हिन्दी रूप ‘मेरे पास’ है; यह वचन के भविष्यद्वक्ता तक पहुँचने का भाव व्यक्त करता है।
- source_word: לֵאמֹר
  choice: उसने कहा,
  rationale: यह infinitive construct आगे आने वाले प्रत्यक्ष कथन का परिचय देता है। हिन्दी में ‘उसने कहा’ अस्पष्ट लटकते कृदन्त ‘कहते हुए’ की अपेक्षा अधिक स्वाभाविक है; कर्ता निकटस्थ ‘यहोवा’ से स्पष्ट है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे / प्रभु
  rationale: मूल में व्यक्तिगत ईश्वरीय नाम है, इसलिए उसे शीर्षक ‘प्रभु’ से नहीं बदला गया। आधुनिक हिन्दी पाठकों में व्यापक रूप से पहचाने जाने वाले नाम-रूप ‘यहोवा’ को चुना गया; ‘याहवे’ निकटतर विद्वत्तापूर्ण लिप्यंतरण है।
- issue: לֵאמֹר में कथनकर्ता की अभिव्यक्ति
  choice: उसने कहा
  alternative: कहते हुए / यह कहते हुए
  rationale: हिब्रू व्याकरण में कथनकर्ता पृथक रूप से दोहराया नहीं गया, पर सूत्र में वह यहोवा है। हिन्दी में वाक्य को स्वाभाविक बनाने के लिए सर्वनाम दिया गया, बिना कथन की विषयवस्तु या अर्थ बढ़ाए।
translation_notes:
  register: आधुनिक मानक हिन्दी; संक्षिप्त, गरिमापूर्ण भविष्यद्वाणी-सूत्र। ‘वचन’ बाइबलीय परिचितता बनाए रखता है, जबकि वाक्य-विन्यास सामान्य पाठक के लिए सहज रखा गया है।
