  naturalness: “याहवे का वचन मेरे पास आया, यह कहते हुए:” is natural, dignified modern Hindi for this prophetic formula. The demonstrative “यह” makes the participial phrase clear and avoids introducing an unnecessary pronoun.
  terminology: “वचन” is an appropriate established Hindi rendering of דְבַר in prophetic formulae. “याहवे” consistently represents the personal divine name, rather than substituting a title or using the distinct conventional form “यहोवा.”
