id: EZK.17.4
reference: Ezekiel 17:4
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: אֵ֛ת רֹ֥אשׁ יְנִֽיקוֹתָ֖י/ו קָטָ֑ף וַ/יְבִיאֵ֨/הוּ֙ אֶל אֶ֣רֶץ כְּנַ֔עַן בְּ/עִ֥יר רֹכְלִ֖ים שָׂמֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/017/004.yaml
  text: He plucked off the topmost of its young shoots and brought it to the land of Canaan[a]; he set it in a city of merchants.
translation:
  language: hi
  text: उसने उसकी कोमल टहनियों में से सबसे ऊपर की टहनी तोड़ ली और उसे कनान देश[a] में ले गया; उसने उसे व्यापारियों के एक नगर में रख दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘व्यापारियों के देश’ में; यहाँ ‘कनान’ शब्द का व्यापार से जुड़ा अर्थ भी हो सकता है, विशेषकर इसके समानांतर आए वाक्यांश ‘व्यापारियों के एक नगर’ के कारण।
    reason: lexical_alternative
lexical_decisions:
- source_word: רֹאשׁ יְנִיקוֹתָיו
  choice: उसकी कोमल टहनियों में से सबसे ऊपर की टहनी
  rationale: רֹאשׁ यहाँ पेड़ की नई बढ़त के ऊपरी भाग को दर्शाता है, और יְנִיקוֹתָיו उसकी कोमल या नई टहनियों को। यह अनुवाद वृक्ष-संबंधी रूपक को स्पष्ट और स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: קָטָף
  choice: तोड़ ली
  rationale: क्रिया का अर्थ टहनी या अंकुर को तोड़कर अलग करना है। ‘तोड़ ली’ दृश्य की सजीवता बनाए रखते हुए सामान्य आधुनिक हिन्दी में स्वाभाविक है।
- source_word: וַיְבִיאֵהוּ
  choice: उसे ... ले गया
  rationale: पुल्लिंग प्रत्यय संदर्भ में तोड़ी गई टहनी की ओर संकेत करता है। हिन्दी में ‘उसे ले गया’ स्थानांतरण को सहज ढंग से व्यक्त करता है।
- source_word: אֶרֶץ כְּנַעַן
  choice: कनान देश
  rationale: मुख्य पाठ में परंपरागत भौगोलिक नाम सुरक्षित रखा गया है, जबकि כְּנַעַן के संभावित व्यापारिक अर्थ को पादटिप्पणी में दिया गया है; अगली पंक्ति का ‘व्यापारियों का नगर’ इस अर्थ-संकेत को बल देता है।
- source_word: בְּעִיר רֹכְלִים
  choice: व्यापारियों के एक नगर में
  rationale: רֹכְלִים घूम-घूमकर व्यापार करने वाले व्यापारियों या सौदागरों को दर्शाता है। यह चयन इब्रानी संबंध-रचना और व्यापारिक संदर्भ दोनों को स्पष्ट रखता है।
- source_word: שָׂמוֹ
  choice: उसे ... रख दिया
  rationale: שׂים रखने या स्थापित करने की सामान्य क्रिया है। यहाँ ‘रख दिया’ स्वाभाविक हिन्दी है और वस्तु को नगर में छोड़े या स्थापित किए जाने का भाव देता है।
