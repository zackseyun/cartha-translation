  text: אֱמָר נָא֙ לְ/בֵ֣ית הַ/מֶּ֔רִי הֲ/לֹ֥א יְדַעְתֶּ֖ם מָה אֵ֑לֶּה אֱמֹ֗ר הִנֵּה בָ֨א מֶֽלֶךְ בָּבֶ֤ל יְרוּשָׁלִַ֨ם֙ וַ/יִּקַּ֤ח אֶת מַלְכָּ/הּ֙ וְ/אֶת שָׂרֶ֔י/הָ וַ/יָּבֵ֥א אוֹתָ֛/ם אֵלָ֖י/ו בָּבֶֽלָ/ה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/017/012.yaml
  text: Say now to the rebellious house[a], ‘Do you not know what these things mean?’ Say, ‘Behold[c][b], the king of Babylon came to Jerusalem and took its king and its officials and brought them to him in Babylon.’
translation:
  language: hi
  text: अब विद्रोही घराने से कह, ‘क्या तुम नहीं जानते कि इन बातों का क्या अर्थ है?’ कह, ‘देखो, बाबेल का राजा यरूशलेम आया, और उसके राजा और उसके अधिकारियों को ले गया और उन्हें बाबेल में अपने पास ले गया।’
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֵית הַמֶּרִי
  choice: विद्रोही घराने
  rationale: यहेजकेल में बार-बार आने वाली सामूहिक उपमा ‘घराना’ के द्वारा सुरक्षित रहती है, जबकि ‘विद्रोही’ संबंधवाचक भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: הֲלֹא יְדַעְתֶּם מָה אֵלֶּה
  choice: क्या तुम नहीं जानते कि इन बातों का अर्थ क्या है?
  rationale: प्रश्न पिछली पहेली/दृष्टान्त के अभिप्राय को पूछता है। ‘अर्थ’ संदर्भ में निहित आशय स्पष्ट करता है, और ‘नहीं जानते’ मूल की आलंकारिक प्रश्न-रचना बनाए रखता है।
- source_word: הִנֵּה
  choice: देखो
  rationale: यह ध्यान आकर्षित करने वाला कथन-सूचक है; ‘देखो’ आधुनिक, गरिमापूर्ण और मूल के संकेतात्मक बल के अनुरूप है।
- source_word: בָּא
  choice: आया
  rationale: इब्रानी पूर्ण क्रिया यहाँ बीती ऐतिहासिक घटना के वर्णन में है; हिन्दी का सामान्य भूतकाल स्वाभाविक है।
- source_word: וַיִּקַּח
  choice: पकड़कर
  rationale: לקח का मूल अर्थ ‘लेना’ है, पर राजा और शासकों के बलपूर्वक निर्वासन के प्रसंग में ‘पकड़कर ... ले गया’ हिन्दी में घटना का स्वाभाविक और सटीक प्रवाह देता है।
- source_word: מַלְכָּהּ
  choice: उसके राजा
  rationale: स्त्रीलिंग प्रत्यय यरूशलेम को संदर्भित करता है; हिन्दी में ‘उसके’ नगर के राजा को सहज रूप से बताता है।
- source_word: שָׂרֶיהָ
  choice: उसके हाकिमों
  rationale: שׂרים राजकीय अथवा प्रशासनिक अगुओं को सूचित करता है। ‘हाकिम’ राजपुत्रों तक अर्थ सीमित किए बिना शासन करने वाले उच्च पदाधिकारियों को दर्शाता है।
- source_word: וַיָּבֵא אוֹתָם אֵלָיו בָּבֶלָה
  choice: अपने पास बाबेल ले गया
  rationale: אֵלָיו गंतव्य को बाबेल के राजा की ओर बताता है और בָּבֶלָה दिशासूचक प्रत्यय सहित ‘बाबेल को/तक’ है। ‘अपने पास बाबेल ले गया’ दोनों तत्वों को स्वाभाविक हिन्दी में सुरक्षित रखता है।
