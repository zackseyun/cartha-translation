translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में है, पर भविष्यद्वक्ता के सीधे और गंभीर संबोधन के अनुरूप एकवचन आज्ञार्थक ‘कह’ रखा गया है। ‘बाबेल’ पारंपरिक बाइबलीय स्थान-नाम है। मूल में वास्तविक अर्थगत अस्पष्टता इस पद में इतनी नहीं कि प्रकाशन-पाठ में पाद-टिप्पणी आवश्यक हो।
