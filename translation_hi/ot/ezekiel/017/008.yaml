lexical_decisions:
- source_word: שָׂדֶה טּוֹב
  choice: अच्छे खेत
  rationale: שָׂדֶה का सामान्य अर्थ ‘खेत’ है; यह चुनाव कृषि-संबंधी ठोस बिंब को बनाए रखता है और ‘उपजाऊ’ जैसी निहित व्याख्या नहीं जोड़ता।
- source_word: אֶל מַיִם רַבִּים
  choice: भरपूर जल के पास
  rationale: रोपने के संदर्भ में אֶל स्थान अथवा निकटता दर्शाता है, और מַיִם רַבִּים पर्याप्त तथा प्रचुर जल की उपलब्धता का बिंब देता है।
- source_word: שְׁתוּלָה
  choice: लगाई गई थी
  rationale: निष्क्रिय कृदन्त पौधे या बेल के लगाए जाने की अवस्था बताता है। ‘रोपी गई’ भी संभव है, पर आधुनिक सामान्य हिन्दी में बेल के लिए ‘लगाई गई’ अधिक सहज है।
- source_word: לַעֲשׂוֹת עָנָף
  choice: डालियाँ निकाले
  rationale: शाब्दिक ‘डाली बनाए’ के बजाय यह स्वाभाविक हिन्दी में पौधे की वृद्धि और अभिप्रेत परिणाम दोनों व्यक्त करता है।
- source_word: וְלָשֵׂאת פֶּרִי
  choice: फल दे
  rationale: נשא और פְּרִי का संयोग फल उत्पन्न करने का सामान्य वानस्पतिक मुहावरा है; हिन्दी में ‘फल दे’ सहज और स्पष्ट है।
- source_word: לִהְיוֹת לְגֶפֶן אַדָּרֶת
  choice: एक शानदार अंगूर की बेल बन जाए
  rationale: אַדָּרֶת यहाँ भव्यता या शोभा व्यक्त करता है। ‘शानदार’ आधुनिक और सुबोध है; ‘अंगूर की बेल’ גֶפֶן का स्पष्ट हिन्दी अर्थ देता है।
