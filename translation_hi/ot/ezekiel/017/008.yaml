translation_notes:
  register: आधुनिक मानक हिन्दी में स्वाभाविक, गरिमापूर्ण और कृषि-बिंब के अनुरूप भाषा रखी गई है। पद के उद्देश्यसूचक तीनों खंड—डालियाँ निकालना, फल देना और शानदार बेल बनना—समानांतर रूप में सुरक्षित हैं। अंग्रेज़ी परामर्श-पाठ का दूसरा पाद-टिप्पणी विकल्प मूलतः אַדָּרֶת के अनुवाद का सामान्य पर्याय है, इसलिए हिन्दी मुख्य पाठ में अलग पाद-टिप्पणी आवश्यक नहीं समझी गई।
