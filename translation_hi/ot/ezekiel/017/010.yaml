  text: וְ/הִנֵּ֥ה שְׁתוּלָ֖ה הֲ/תִצְלָ֑ח הֲ/לוֹא֩ כְ/גַ֨עַת בָּ֜/הּ ר֤וּחַ הַ/קָּדִים֙ תִּיבַ֣שׁ יָבֹ֔שׁ עַל עֲרֻגֹ֥ת צִמְחָ֖/הּ תִּיבָֽשׁ־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/017/010.yaml
  text: And look[a], though it is planted[c][b], will it prosper? Will it not completely wither when the east wind touches it? It will wither on the beds where it sprouted.
translation:
  language: hi
  text: और देखो, भले ही वह रोपी हुई है, क्या वह फले-फूलेगी? क्या पूर्वी हवा[a] के उसे छूते ही वह पूरी तरह सूख नहीं जाएगी?[b] जिन क्यारियों में वह उगी थी, वहीं वह सूख जाएगी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘पूर्वी हवा’ से आशय पूर्व के मरुस्थल से आने वाली गरम, विनाशकारी हवा है; बाइबिल में यह प्रायः मुरझाने और न्याय का चित्र है।
    reason: cultural_note
  - marker: b
    text: इब्रानी में ‘सूखना’ क्रिया के साथ उसी धातु का विशेष बल देने वाला रूप आया है; अर्थ है, ‘निश्चय ही’ या ‘पूरी तरह सूख जाएगी।’
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  choice: और देखो
  rationale: यह ध्यान आकर्षित करने वाला कथन-सूचक है; ‘और देखो’ आधुनिक, सहज हिन्दी में उसके संकेतात्मक बल को बनाए रखता है।
- source_word: שְׁתוּלָה
  choice: रोपी जाने पर भी
  rationale: שתל का स्त्रीलिंग कर्मवाच्य कृदन्त बेल के रोपे या स्थापित किए जाने को बताता है; ‘रोपी जाने पर भी’ अगले प्रश्न के साथ स्वाभाविक रूप से जुड़ता है।
- source_word: הֲתִצְלָח
  choice: क्या वह फले-फूलेगी?
  rationale: צלח यहाँ सफल या समृद्ध होने के अर्थ में है; पौधे के रूपक में ‘फले-फूलेगी’ वृद्धि और सफलता दोनों को सहज हिन्दी में व्यक्त करता है।
- source_word: כְגַעַת בָּהּ
  choice: उसे छूते ही
  rationale: כ के साथ נגע का infinitive construct संपर्क के समय और तत्क्षण परिणाम को व्यक्त करता है; यह हिन्दी प्रयोग उस कालिक-कारणात्मक संबंध को संक्षेप में रखता है।
- source_word: רוּחַ הַקָּדִים
  choice: पुरवाई
  rationale: यह पूर्व दिशा से आने वाली गरम, विनाशकारी हवा है; ‘पुरवाई’ हिन्दी में पूर्वी हवा का स्वाभाविक पद है, जबकि उसके विनाशकारी सांस्कृतिक संदर्भ को पाद-टिप्पणी स्पष्ट करती है।
- source_word: תִּיבַשׁ יָבֹשׁ
  choice: पूरी तरह सूख न जाएगी
  rationale: यבש के finite verb और infinitive absolute का मेल क्रिया पर प्रबल बल देता है; ‘पूरी तरह’ उस तीव्रता को व्यक्त करता है और ‘सूखना’ पौधे के संदर्भ में सीधा है।
- source_word: עַל עֲרֻגֹת צִמְחָהּ
  choice: जिन क्यारियों में वह उगी थी, वहीं
  rationale: עֲרֻגוֹת खेती की क्यारियाँ हैं और צִמְחָהּ उसके उगने या बढ़ने को दर्शाता है; अनुवाद उसी वृद्धि-स्थल पर विनाश होने की विडंबना बनाए रखता है।
- source_word: תִּיבָשׁ
  choice: वह सूख जाएगी
  rationale: अंतिम יבש निश्चित परिणाम को दोहराता है; वही क्रिया दोहराने से मूल की पुनरुक्ति सुरक्षित रहती है।
