  text: וְ/אָמַרְתָּ֞ כֹּה אָמַ֣ר אֲדֹנָ֣/י יְהוִ֗ה הַ/נֶּ֤שֶׁר הַ/גָּדוֹל֙ גְּד֤וֹל הַ/כְּנָפַ֨יִם֙ אֶ֣רֶךְ הָ/אֵ֔בֶר מָלֵא֙ הַ/נּוֹצָ֔ה אֲשֶׁר ל֖/וֹ הָֽ/רִקְמָ֑ה בָּ֚א אֶל הַ/לְּבָנ֔וֹן וַ/יִּקַּ֖ח אֶת צַמֶּ֥רֶת הָ/אָֽרֶז־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/017/003.yaml
  text: 'and say[a], ‘Thus says the Lord GOD: The great eagle, great in wings, long in pinions, full of plumage, which had variegated feathers, came to Lebanon and took the top of the cedar.’'
translation:
  language: hi
  text: 'और कहना, ‘प्रभु यहोवा यों कहता है: एक विशाल उकाब, बड़े डैनों और लंबे उड़ान-पंखों वाला, घने और रंग-बिरंगे परों वाला[a], लबानोन आया और देवदार की चोटी ले गया।’'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी का शाब्दिक अर्थ ‘जिसके पास कढ़ाई/रंग-बिरंगी बनावट थी’ है; यहाँ संभवतः चितकबरे या बहुरंगी पर अभिप्रेत हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  choice: प्रभु यहोवा
  rationale: संयुक्त उपाधि में אֲדֹנָי को ‘प्रभु’ और वाचा के नाम יהוה को प्रचलित हिन्दी रूप ‘यहोवा’ से व्यक्त किया गया है; इससे दोनों की भिन्नता बनी रहती है।
- source_word: הַנֶּשֶׁר הַגָּדוֹל
  choice: विशाल उकाब
  rationale: נֶשֶׁר के लिए ‘उकाब’ बड़ा शिकारी पक्षी दर्शाता है, और ‘विशाल’ आकार तथा प्रभाव दोनों को व्यक्त करता है।
- source_word: גְּדוֹל הַכְּנָפַיִם
  choice: जिसके पंख बड़े ... थे
  rationale: इब्रानी वर्णन की शारीरिक भव्यता को सहज आधुनिक हिन्दी में रखा गया है।
- source_word: אֶרֶךְ הָאֵבֶר
  choice: उड़ान-पंख लंबे
  rationale: אֵבֶר यहाँ पक्षी के उड़ने वाले लंबे पंखों/परों को सूचित करता है; ‘उड़ान-पंख’ सामान्य ‘अंग’ की अपेक्षा प्रसंग को स्पष्ट करता है।
- source_word: מָלֵא הַנּוֹצָה
  choice: घने परों से भरा
  rationale: बहुतायत से भरे पक्षी-पिच्छ का चित्र स्वाभाविक हिन्दी में व्यक्त होता है।
- source_word: אֲשֶׁר לוֹ הָרִקְמָה
  choice: जिसके पर रंग-बिरंगे थे
  rationale: רִקְמָה मूलतः कढ़ाई अथवा विविध रंगों की बनावट को दर्शाता है; पक्षी के प्रसंग में बहुरंगी या चितकबरे पर अभिप्रेत जान पड़ते हैं, पर शाब्दिक चित्र पादटिप्पणी में सुरक्षित है।
- source_word: בָּא אֶל הַלְּבָנוֹן
  choice: लबानोन आया
  rationale: स्थान-नाम का सीधा और हिन्दी बाइबलीय परंपरा में परिचित लिप्यंतरण।
- source_word: צַמֶּרֶת הָאָרֶז
  choice: देवदार की चोटी
  rationale: צַמֶּרֶת वृक्ष के सबसे ऊपरी भाग अथवा मुकुट को दर्शाता है; ‘चोटी’ स्पष्ट और चित्रात्मक है।
theological_decisions:
- issue: संयुक्त ईश्वरीय उपाधि אֲדֹנָי יְהוִה का अनुवाद
  choice: प्रभु यहोवा
  alternative: प्रभु याहवे
  rationale: יהוה को केवल सामान्य उपाधि से बदलने के बजाय उसका व्यक्तिवाचक स्वरूप रखा गया है। ‘यहोवा’ आधुनिक हिन्दी बाइबल पाठकों में अधिक परिचित है, जबकि ‘याहवे’ संभावित वैकल्पिक उच्चारण है; पाठ किसी सांप्रदायिक व्याख्या को नहीं जोड़ता।
translation_notes:
  register: भविष्यवाणी की गरिमामय और चित्रात्मक शैली बनाए रखते हुए वाक्य को आधुनिक मानक हिन्दी में स्वाभाविक बनाया गया है। ‘उकाब’, ‘उड़ान-पंख’ और ‘देवदार की चोटी’ रूपक की दृश्यता सुरक्षित रखते हैं।
