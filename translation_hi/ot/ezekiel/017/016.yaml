  yaml_path: translation/ot/ezekiel/017/016.yaml
  text: As I live[a], declares the Lord GOD, surely in the place of the king who made him king[b], whose oath he despised and whose covenant he broke—with him in the midst of Babylon he will die.
translation:
  language: hi
  text: “मेरे जीवन की शपथ[a],” प्रभु याहवे की यह घोषणा है, “निश्चय ही वह उस राजा के स्थान पर, जिसने उसे राजा बनाया था, जिसकी शपथ का उसने तिरस्कार किया था और जिसकी वाचा उसने तोड़ दी थी, उसी के साथ बाबेल के बीच मरेगा।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “मैं जीवित हूँ।” यह परमेश्वर द्वारा अपने जीवन की शपथ लेने का सूत्र है।
    reason: idiom_and_literal_form
