  choice: प्रभु यहोवा की यह घोषणा है
  rationale: נְאֻם को भविष्यद्वाणी की घोषणा के सूत्र के रूप में और יהוה को उसके व्यक्तिगत नाम ‘यहोवा’ से प्रस्तुत किया गया है; אֲדֹנָי के लिए ‘प्रभु’ रखा गया है।
- source_word: אִם לֹא
  choice: निश्चय ही
  rationale: शपथ-वाक्य में यह पदबंध शाब्दिक शर्त नहीं, बल्कि दृढ़ निश्चय और निश्चितता व्यक्त करता है।
- source_word: בִּמְקוֹם הַמֶּלֶךְ הַמַּמְלִיךְ אֹתוֹ
  choice: उसी राजा के स्थान पर, जिसने उसे राजा बनाया था
  rationale: מלך के संज्ञा और कारक रूप के शब्द-संबंध को ‘राजा...राजा बनाया’ द्वारा सुरक्षित रखा गया है। ‘स्थान’ मूल के स्थानवाचक कथन को बनाए रखता है।
- source_word: אֲשֶׁר בָּזָה אֶת אָלָתוֹ
  choice: उसने उस राजा की शपथ का तिरस्कार किया
  rationale: אָלָה शपथ को सूचित करता है, जिसमें आत्म-शाप का भाव भी हो सकता है। मुख्य पाठ स्पष्ट रखा गया और वह अतिरिक्त अर्थ पादटिप्पणी में दिया गया है।
- source_word: וַאֲשֶׁר הֵפֵר אֶת בְּרִיתוֹ
