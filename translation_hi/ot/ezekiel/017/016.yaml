  choice: मेरे जीवन की शपथ
  rationale: यह इब्रानी की गंभीर आत्म-शपथ का सूत्र है। हिंदी में यह स्वाभाविक रूप से उस बल को व्यक्त करता है जो शाब्दिक ‘मैं जीवित हूँ’ से स्पष्ट नहीं होगा।
