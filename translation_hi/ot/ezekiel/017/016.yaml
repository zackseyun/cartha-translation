  rationale: בְּרִית के व्यापक धार्मिक-राजनीतिक अर्थ को ‘वाचा’ सुरक्षित रखता है; प्रसंग में ‘संधि’ भी संभव है और पादटिप्पणी में दिया गया है।
- source_word: אִתּוֹ בְתוֹךְ בָּבֶל
  choice: बाबेल के बीच उसी के पास
