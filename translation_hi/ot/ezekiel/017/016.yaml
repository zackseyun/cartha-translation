theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: याहवे; बड़े अक्षरों में ‘प्रभु’
  rationale: मूल में चतुरक्षरीय व्यक्तिगत नाम सीधे उपस्थित है। ‘यहोवा’ आधुनिक हिंदी बाइबलीय प्रयोग में व्यापक रूप से पहचाना जाता है और साथ आए אֲדֹנָי से भेद बनाए रखता है।
- issue: राजनीतिक בְּרִית का अर्थ
  choice: वाचा
  alternative: संधि
  rationale: ‘वाचा’ इब्रानी पद की गंभीर और संबंधपरक शक्ति बनाए रखता है, जबकि तत्काल प्रसंग में राजाओं की राजनीतिक संधि का अर्थ भी वास्तविक है; इसलिए विकल्प को पादटिप्पणी में सुरक्षित रखा गया है।
- issue: אִתּוֹ का संबंध
  choice: उसी के पास, अर्थात उसे राजा बनाने वाले राजा के स्थान/अधीन बाबेल में
  alternative: उसके साथ मरना
  rationale: पूर्वसर्गीय पद स्थान और संगति दोनों का रंग रख सकता है। हिंदी पाठ स्थानगत अर्थ देता है, पर ‘उसी के पास’ द्वारा मूल की संगति को पूरी तरह मिटाता नहीं।
translation_notes:
  register: भाषा आधुनिक, गंभीर और सार्वजनिक पाठ के योग्य रखी गई है। लंबी इब्रानी संरचना को हिंदी में उद्धृत ईश्वरीय वचन के रूप में व्यवस्थित किया गया है। संदर्भ स्पष्ट करने के लिए सर्वनामों के साथ ‘उस राजा’ जोड़ा गया, पर मूल की शपथ, वाचा/संधि और बाबेल में मृत्यु की निश्चितता सुरक्षित रखी गई है।
