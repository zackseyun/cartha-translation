  text: בְּ/הַ֨ר מְר֤וֹם יִשְׂרָאֵל֙ אֶשְׁתֳּלֶ֔/נּוּ וְ/נָשָׂ֤א עָנָף֙ וְ/עָ֣שָׂה פֶ֔רִי וְ/הָיָ֖ה לְ/אֶ֣רֶז אַדִּ֑יר וְ/שָׁכְנ֣וּ תַחְתָּ֗י/ו כֹּ֚ל צִפּ֣וֹר כָּל כָּנָ֔ף בְּ/צֵ֥ל דָּלִיּוֹתָ֖י/ו תִּשְׁכֹּֽנָּה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/017/023.yaml
  text: On the high mountain of Israel I will plant it[a], and it will put forth branches and bear fruit and become a majestic cedar. Under it every bird of every wing will dwell[b]; in the shade of its boughs they will dwell.
translation:
  language: hi
  text: इस्राएल के ऊँचे पर्वत पर मैं उसे रोपूँगा[a]। वह शाखाएँ फैलाएगा, फल देगा और एक प्रतापी देवदार बन जाएगा। उसके नीचे हर प्रकार के पक्षी बसेंगे[b]; उसकी डालियों की छाया में वे बसेंगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मैं उसे दूसरी जगह रोपूँगा।” इब्रानी क्रिया नए स्थान पर रोपने का भाव भी दे सकती है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “हर पक्षी, हर पंख”—हर प्रकार के पक्षियों के लिए एक काव्यात्मक अभिव्यक्ति।
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּהַר מְרוֹם יִשְׂרָאֵל
  choice: इस्राएल के ऊँचे पर्वत पर
  rationale: מְרוֹם ऊँचाई या उन्नत स्थान का बोध कराता है; यह रूप मूल के भौगोलिक और उत्कर्ष-संबंधी चित्र को स्वाभाविक हिन्दी में रखता है।
- source_word: אֶשְׁתֳּלֶנּוּ
  choice: मैं उसे रोपूँगा
  rationale: שתל का मूल अर्थ किसी पौधे या कलम को रोपना है। प्रसंग में दूसरी जगह लगाना निहित हो सकता है, इसलिए वैकल्पिक अर्थ पादटिप्पणी में रखा गया है।
- source_word: וְנָשָׂא עָנָף
  choice: वह डालियाँ निकालेगा
  rationale: शाब्दिक रूप से 'डाली उठाएगा/धारण करेगा'; वृक्ष-वृद्धि के सन्दर्भ में 'डालियाँ निकालेगा' सहज है और एकवचन עָנָף को सामूहिक अर्थ में व्यक्त करता है।
- source_word: וְעָשָׂה פֶרִי
  choice: फल देगा
  rationale: यह फल उत्पन्न करने के लिए प्रयुक्त सामान्य इब्रानी पदबंध है; 'फल देगा' आधुनिक हिन्दी में स्वाभाविक है।
- source_word: וְהָיָה לְאֶרֶז אַדִּיר
  choice: एक प्रतापी देवदार बन जाएगा
  rationale: אַדִּיר सामर्थ्य, भव्यता और महिमा का भाव रखता है; 'प्रतापी' इन अर्थों को गरिमापूर्ण और सुबोध हिन्दी में समेटता है।
- source_word: וְשָׁכְנוּ תַחְתָּיו
  choice: उसके नीचे ... बसेरा करेंगे
  rationale: שׁכן का अर्थ बसना या निवास करना है। पक्षियों के प्रसंग में 'बसेरा करना' स्वाभाविक है और सुरक्षित निवास का चित्र बनाए रखता है।
- source_word: כֹּל צִפּוֹר כָּל כָּנָף
  choice: हर पंख के पक्षी
  rationale: मूल का काव्यात्मक विन्यास शाब्दिक रूप से 'हर पक्षी, हर पंख' है। 'हर पंख के पक्षी' उसकी असामान्य काव्यात्मकता को बनाए रखता है; आशय पादटिप्पणी में स्पष्ट किया गया है।
- source_word: בְּצֵל דָּלִיּוֹתָיו
  choice: उसकी शाखाओं की छाया में
  rationale: דָּלִיּוֹת बड़ी या फैली हुई शाखाओं को सूचित करता है। 'शाखाओं की छाया' वृक्ष के आश्रयकारी चित्र को सहज हिन्दी में व्यक्त करता है।
- source_word: תִּשְׁכֹּנָּה
  choice: वे बसेरा करेंगे
  rationale: क्रिया सामूहिक विषय पक्षियों के साथ आती है; हिन्दी में बहुवचन 'वे ... करेंगे' आशय को स्पष्ट और व्याकरणसम्मत बनाता है।
theological_decisions:
- issue: पक्षियों के चित्र का आशय और विस्तार
  choice: मुख्य पाठ में व्यापक पक्षी-चित्र को बनाए रखा गया है, पर उसे राष्ट्रों या लोगों के रूप में स्पष्टतः नहीं समझाया गया।
  alternative: पक्षियों को बहाल राज्य के आश्रय में आने वाले राष्ट्रों के रूप में अनूदित या व्याख्यायित करना।
  rationale: अध्याय का व्यापक सन्दर्भ ऐसा अर्थ सुझा सकता है, किन्तु इस पद में रूपक स्वयं प्रस्तुत है, उसकी व्याख्या नहीं। अनुवाद मूल की धर्मवैचारिक सम्भावना को खुला रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सहज भविष्यद्वाणीपरक स्वर अपनाया गया है। वृक्ष और पक्षियों के रूपक को बिना अतिरिक्त व्याख्या के सुरक्षित रखा गया है; 'डालियाँ' और 'शाखाएँ' मूल के दो अलग वृक्ष-संबंधी शब्दों का भेद दर्शाते हैं।
