base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/017/006.yaml
  text: And it sprouted and became a spreading vine[a], low in stature, with its branches turned toward him and its roots beneath him[c][b]. So it became a vine and produced branches and sent out boughs.
translation:
  language: hi
  text: और वह अंकुरित होकर फैलने वाली बेल[a] बन गई, जो कद में नीची थी। उसकी डालियाँ उसकी ओर मुड़ी हुई थीं और उसकी जड़ें उसके नीचे थीं[c]। इस प्रकार वह बेल बन गई[b]; उसने शाखाएँ निकालीं और डालियाँ फैलाईं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘फैलने वाली बेल’ का अनुवाद ‘घनी बेल’ या ‘शाखाओं वाली बेल’ भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में ‘बेल बन गई’ वाक्यांश दोबारा आया है; यहाँ उस दोहराव को बल देने के लिए बनाए रखा गया है।
    reason: literary_feature
  - marker: c
    text: ‘उसकी ओर’ और ‘उसके नीचे’ में ‘उसके’ का संकेत संभवतः इस रूपक के बड़े उकाब की ओर है (देखें यहेजकेल 17:3–4); इसे निर्जीव अर्थ में भी समझा जा सकता है।
    reason: referent_ambiguity
