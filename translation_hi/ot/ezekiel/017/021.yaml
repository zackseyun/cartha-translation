source:
  edition: WLC
  text: וְ/אֵ֨ת כָּל מברח/ו בְּ/כָל אֲגַפָּי/ו֙ בַּ/חֶ֣רֶב יִפֹּ֔לוּ וְ/הַ/נִּשְׁאָרִ֖ים לְ/כָל ר֣וּחַ יִפָּרֵ֑שׂוּ וִ/ידַעְתֶּ֕ם כִּ֛י אֲנִ֥י יְהוָ֖ה דִּבַּֽרְתִּי־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/017/021.yaml
  text: And all his fugitives among all his troops will fall by the sword[a], and those who remain will be scattered to every wind. Then you will know that I, Yahweh[b], have spoken.
translation:
  language: hi
  text: और उसकी सारी सैन्य टुकड़ियों[b] में उसके सभी भागनेवाले लोग[a] तलवार से मारे जाएँगे, और जो बच जाएँगे वे हर दिशा में तितर-बितर हो जाएँगे। तब तुम जानोगे कि मैं, याहवे, ने कहा है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में ‘उसके भागे हुए लोग’; कुछ प्राचीन संस्करण और अनुवाद इसे ‘उसके चुने हुए लोग’ या इसी प्रकार समझते हैं।
    reason: alternative_reading
  - marker: b
    text: शाब्दिक अर्थ ‘उसके पंख’ है; यह सेना के विभागों या टुकड़ियों के लिए प्रयुक्त इब्रानी सैन्य बिंब है।
    reason: lexical_alternative
lexical_decisions:
- source_word: מברחו
  choice: भाग निकलनेवाले सभी लोग
  rationale: यह रूप ברח से निकला हुआ सबसे स्वाभाविक रूप से भागने या बच निकलने का प्रयास करनेवालों को दर्शाता है। यह हिन्दी में प्रसंगानुकूल और स्पष्ट है, जबकि प्राचीन पाठ-परंपराओं में पाया जानेवाला ‘चुने हुए लोग’ अर्थ पादटिप्पणी में रखा गया है।
- source_word: אֲגַפָּיו
  choice: उसकी सारी सैन्य-टुकड़ियाँ
  rationale: शाब्दिक अर्थ ‘उसके पंख’ है, पर सैन्य प्रसंग में यह सेना के पार्श्वों, विभागों या टुकड़ियों का रूपक है। ‘सैन्य-टुकड़ियाँ’ अर्थ को स्पष्ट रखते हुए मूल सैन्य बिंब की सूचना पादटिप्पणी में सुरक्षित रखता है।
- source_word: בַּחֶרֶב יִפֹּלוּ
  choice: तलवार से मारे जाएँगे
  rationale: शाब्दिक ‘तलवार से गिरेंगे’ युद्ध में हिंसक मृत्यु का मुहावरा है। आधुनिक हिन्दी में ‘तलवार से मारे जाएँगे’ उसका आशय स्वाभाविक रूप से व्यक्त करता है।
- source_word: הַנִּשְׁאָרִים
  choice: जो बच जाएँगे
  rationale: यह न्याय के बाद बचे लोगों को सूचित करता है। ‘शेष’ या धार्मिक अर्थवाले ‘बचे हुए समुदाय’ की अपेक्षा यह वाक्यांश प्रसंग को बिना अतिरिक्त धर्मवैज्ञानिक अर्थ दिए स्पष्ट करता है।
- source_word: לְכָל רוּחַ
  choice: हर दिशा की हवा में
  rationale: मूल में ‘हर हवा की ओर’ का सजीव बिंब है, जिसका अर्थ चारों ओर बिखर जाना है। चुना हुआ रूप हिन्दी में दिशा का आशय स्पष्ट करते हुए हवा का बिंब बनाए रखता है।
- source_word: יִפָּרֵשׂוּ
  choice: तितर-बितर हो जाएँगे
  rationale: निफ़अल रूप यहाँ निष्क्रिय या परिणामसूचक बिखराव व्यक्त करता है। ‘तितर-बितर हो जाएँगे’ न्याय और निर्वासन के प्रसंग में स्वाभाविक हिन्दी है।
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय हिन्दी लिपि में प्रतिलिपित किया गया है।
- source_word: דִּבַּרְתִּי
  choice: मैंने यह कहा है
  rationale: पूर्ण क्रिया और गंभीर भविष्यसूचक घोषणा को स्वाभाविक हिन्दी में व्यक्त करता है; ‘यह’ उस घोषित न्याय की ओर संकेत करता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: प्रभु; यहोवा
  rationale: मूल पाठ में चार-अक्षरी व्यक्तिगत नाम सीधे प्रयुक्त है। उसे उपाधि ‘प्रभु’ से बदलने के बजाय ‘याहवे’ लिखना स्रोत का भेद सुरक्षित रखता है।
- issue: הַנִּשְׁאָרִים में ‘रेमनंट’ संबंधी धर्मवैज्ञानिक अर्थ
  choice: जो बच जाएँगे
  alternative: शेष जन; बचे हुए पवित्र लोग
  rationale: यहाँ बचे लोगों को भी तितर-बितर किया जाता है; पाठ उन्हें विश्वासयोग्य या संरक्षित समुदाय नहीं कहता। इसलिए अनावश्यक सकारात्मक ‘शेष’ धर्मविज्ञान नहीं जोड़ा गया।
- issue: מברחו की पाठगत/व्याख्यात्मक अनिश्चितता
  choice: भाग निकलनेवाले लोग
  alternative: उसके चुने हुए लोग
  rationale: व्यंजनात्मक रूप ברח से ‘भागनेवालों’ का अर्थ सबसे सीधा है, किंतु कुछ प्राचीन संस्करण और अनुवाद ‘चुने हुए’ जैसा अर्थ समझते हैं। इस वास्तविक अनिश्चितता को पादटिप्पणी में रखा गया है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, सहज किंतु गरिमापूर्ण रखी गई है। ‘तलवार से मारे जाएँगे’ और ‘तितर-बितर हो जाएँगे’ सामान्य पाठक के लिए स्पष्ट हैं। ‘हर दिशा की हवा में’ मूल के हवा-संबंधी बिंब और दिशात्मक अर्थ दोनों को बनाए रखता है। सभी पादटिप्पणी-चिह्न संबंधित शब्दों के तुरंत बाद मुख्य पाठ में दिए गए हैं।
