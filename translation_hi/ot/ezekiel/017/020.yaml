source:
  edition: WLC
  text: וּ/פָרַשְׂתִּ֤י עָלָי/ו֙ רִשְׁתִּ֔/י וְ/נִתְפַּ֖שׂ בִּ/מְצֽוּדָתִ֑/י וַ/הֲבִיאוֹתִ֣י/הוּ בָבֶ֗לָ/ה וְ/נִשְׁפַּטְתִּ֤י אִתּ/וֹ֙ שָׁ֔ם מַעֲל֖/וֹ אֲשֶׁ֥ר מָֽעַל בִּֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/017/020.yaml
  text: I will spread my net over him[a], and he will be caught in my snare; then I will bring him to Babylon[b], and there I will enter into judgment with him for his treachery by which he acted treacherously against me.
translation:
  language: hi
  text: मैं उस पर अपना जाल फैलाऊँगा, और वह मेरे फंदे में पकड़ा जाएगा। तब मैं उसे बाबेल ले आऊँगा, और वहाँ मैं उसके साथ न्याय-विचार करूँगा[a], उसके उस विश्वासघात के कारण जो उसने मेरे विरुद्ध किया[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वहाँ मैं उसका न्याय करूँगा।” इब्रानी अभिव्यक्ति का यह अधिक सरल अनुवाद सम्भव है; मुख्य पाठ में उसके साथ न्यायिक कार्यवाही करने का भाव सुरक्षित रखा गया है।
    reason: lexical_alternative
  - marker: b
    text: “विश्वासघात” का अनुवाद “निष्ठा-भंग” या “अविश्वासयोग्यता” भी किया जा सकता है। इब्रानी शब्द विशेष रूप से वाचा अथवा विश्वास-भंग पर बल देता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וּפָרַשְׂתִּי עָלָיו רִשְׁתִּי
  choice: मैं उस पर अपना जाल फैलाऊँगा
  rationale: פָרַשׂ का अर्थ फैलाना है और רֶשֶׁת सामान्यतः जाल को दर्शाता है। यह रूपक और प्रथम पुरुष की भावी क्रिया दोनों को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: וְנִתְפַּשׂ בִּמְצוּדָתִי
  choice: वह मेरे फंदे में पकड़ा जाएगा
  rationale: निफ़ाल क्रिया यहाँ कर्मवाच्य अर्थ देती है। प्रसंग में מְצוּדָה दुर्ग नहीं, बल्कि जाल के समानांतर पकड़ने वाला फंदा है।
- source_word: וַהֲבִיאוֹתִיהוּ בָבֶלָה
  choice: तब मैं उसे बाबेल ले आऊँगा
  rationale: दिशासूचक הָ गति को बाबेल की ओर बताता है। 'तब' घटनाक्रम को आधुनिक हिन्दी में सहजता से व्यक्त करता है।
- source_word: וְנִשְׁפַּטְתִּי אִתּוֹ שָׁם
  choice: वहाँ उसके साथ न्याय करूँगा
  rationale: यह रचना केवल दण्डादेश सुनाने से अधिक, किसी के साथ न्यायिक रूप से निपटने का भाव रख सकती है। हिन्दी वाक्य उस वैधानिक और संबंधपरक बल को बनाए रखता है।
- source_word: מַעֲלוֹ אֲשֶׁר מָעַל בִּי
  choice: उस विश्वासघात के कारण, जो उसने मेरे विरुद्ध किया था
  rationale: מַעַל और उसके सजातीय क्रियारूप में निष्ठा अथवा वाचा भंग करने का गंभीर भाव है। 'विश्वासघात' राजनीतिक और वाचागत दोनों आयामों को खुला रखता है, जबकि 'मेरे विरुद्ध' परमेश्वर के प्रति अपराध को स्पष्ट करता है।
theological_decisions:
- issue: מַעַל / מָעַל द्वारा बताए गए अपराध का स्वरूप
  choice: '''विश्वासघात'' रखा गया है, ताकि वाचा-भंग और राजनीतिक द्रोह दोनों का गंभीर भाव बना रहे।'
  alternative: '''अविश्वासयोग्यता'' या ''निष्ठा-भंग'''
  rationale: सन्दर्भ में शपथ और वाचा का उल्लंघन अन्ततः परमेश्वर के विरुद्ध अपराध माना गया है। किसी संकीर्ण कर्मकाण्डीय अर्थ को आरोपित नहीं किया गया।
- issue: וְנִשְׁפַּטְתִּי אִתּוֹ का न्यायिक अर्थ
  choice: '''उसके साथ न्याय करूँगा'''
  alternative: '''उसका न्याय करूँगा'' या ''उससे न्याय-विवाद करूँगा'''
  rationale: मुख्य पाठ इब्रानी रचना के पारस्परिक-जैसे न्यायिक बल को सुरक्षित रखता है, जबकि पादटिप्पणी अधिक सरल सम्भव अनुवाद देती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य हिन्दी पाठक के लिए सुबोध रखी गई है। 'बाबेल' हिन्दी बाइबलीय नाम-परम्परा के अनुरूप है। जाल और फंदे की काव्यात्मक समानता तथा न्याय और वाचा-भंग की कानूनी-धार्मिक ध्वनि सुरक्षित रखी गई है।
