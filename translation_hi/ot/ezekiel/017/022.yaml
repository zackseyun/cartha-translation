source:
  edition: WLC
  text: כֹּ֤ה אָמַר֙ אֲדֹנָ֣/י יְהוִ֔ה וְ/לָקַ֣חְתִּי אָ֗נִי מִ/צַּמֶּ֧רֶת הָ/אֶ֛רֶז הָ/רָמָ֖ה וְ/נָתָ֑תִּי מֵ/רֹ֤אשׁ יֹֽנְקוֹתָי/ו֙ רַ֣ךְ אֶקְטֹ֔ף וְ/שָׁתַ֣לְתִּי אָ֔נִי עַ֥ל הַר גָּבֹ֖הַ וְ/תָלֽוּל־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/017/022.yaml
  text: 'Thus says the Lord GOD: I myself will take from the top of the lofty cedar and set it out[a]. From the tip of its young shoots I myself will pluck a tender one[b], and I myself will plant it on a high and lofty mountain.'
translation:
  language: hi
  text: 'प्रभु याहवे यों कहता है: “मैं स्वयं ऊँचे देवदार की चोटी[a] से एक टहनी लेकर उसे लगाऊँगा। उसकी नई डालियों के सिरे से मैं एक कोमल कोंपल[b] तोड़ूँगा, और मैं स्वयं उसे एक ऊँचे और उन्नत पहाड़ पर रोपूँगा।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘देवदार के मुकुट’।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में शाब्दिक रूप से ‘एक कोमल’; आशय एक कोमल कोंपल या टहनी से है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  choice: प्रभु यहोवा
  rationale: संयुक्त ईश्वरीय उपाधि में אֲדֹנָי को ‘प्रभु’ और परमेश्वर के व्यक्तिगत नाम יהוה को ‘यहोवा’ के रूप में रखा गया है; इससे ‘प्रभु प्रभु’ जैसी अस्वाभाविक पुनरुक्ति से भी बचा जाता है।
- source_word: מִצַּמֶּרֶת הָאֶרֶז הָרָמָה
  choice: ऊँचे देवदार की चोटी से
  rationale: צַמֶּרֶת वृक्ष के सबसे ऊपरी भाग या मुकुट को दर्शाता है; ‘चोटी’ आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: וְנָתַתִּי
  choice: उसे लगाऊँगा
  rationale: मूल क्रिया का सामान्य अर्थ ‘रखना/स्थापित करना’ है, पर यहाँ पौधे की कलम लेने और बाद में रोपने के बाग़बानी-संदर्भ में ‘लगाना’ स्वाभाविक है।
- source_word: מֵרֹאשׁ יֹנְקוֹתָיו
  choice: उसकी नई डालियों के सिरे से
  rationale: רֹאשׁ यहाँ सिरा या सबसे ऊपरी भाग है और יֹנְקוֹתָיו नई उगती डालियों या कोंपलों को सूचित करता है।
- source_word: רַךְ
  choice: एक कोमल कोंपल
  rationale: विशेषण का प्रयोग संज्ञा के रूप में, शाब्दिकतः ‘एक कोमल’, हुआ है; संदर्भ में ‘कोंपल’ जोड़ने से वृक्ष की छवि स्पष्ट रहती है।
- source_word: אֶקְטֹף
  choice: तोड़ूँगा
  rationale: क्रिया किसी कोमल टहनी या कोंपल को तोड़ लेने का भाव देती है; ‘तोड़ूँगा’ सहज हिन्दी है।
- source_word: וְשָׁתַלְתִּי
  choice: रोपूँगा
  rationale: यह पौधा लगाने या रोपने की सामान्य क्रिया है; ‘रोपूँगा’ बाग़बानी की छवि को सटीक रखता है।
- source_word: עַל הַר גָּבֹהַ וְתָלוּל
  choice: एक ऊँचे और उन्नत पहाड़ पर
  rationale: गָּבֹהַ ऊँचाई और תָלוּל उठे हुए, उन्नत या प्रमुख होने का भाव देता है; दोनों विशेषणों को बनाए रखा गया है।
- source_word: אָנִי ... אָנִי
  choice: मैं स्वयं ... मैं स्वयं
  rationale: क्रियाओं में पुरुष पहले से निहित होने पर भी दो बार प्रयुक्त स्वतंत्र सर्वनाम वक्ता पर विशेष बल देता है; हिन्दी में ‘मैं स्वयं’ उस बल को व्यक्त करता है।
theological_decisions:
- issue: संयुक्त उपाधि אֲדֹנָי יְהוִה में परमेश्वर के नाम का अनुवाद
  choice: प्रभु यहोवा
  alternative: प्रभु परमेश्वर
  rationale: मूल में वाचा का व्यक्तिगत नाम יהוה उपस्थित है। ‘यहोवा’ उस नाम को प्रत्यक्ष रखता है, जबकि ‘प्रभु परमेश्वर’ शीर्षक के रूप में अधिक सामान्य लेकिन कम विशिष्ट होगा।
- issue: देवदार की कोमल कोंपल की भावी पहचान
  choice: रूपक को बिना व्याख्यात्मक पहचान जोड़े बनाए रखना
  alternative: कोंपल को सीधे मसीहा या दाऊदी राजा कहना
  rationale: इस पद में रूपकात्मक कोंपल की पहचान स्पष्ट संज्ञा से नहीं की गई है; अनुवाद में आगे के संदर्भ या किसी विशिष्ट धार्मिक व्याख्या को समय से पहले आरोपित नहीं किया गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। वृक्ष और रोपण की काव्यात्मक छवि सुरक्षित है। ‘मैं स्वयं’ की पुनरावृत्ति मूल के विशेष बल को दर्शाती है।
