base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/017/017.yaml
  text: Pharaoh will not act for him in the war with a great army and a large assembly[b][a], when they cast up a siege ramp and build a siege wall to cut off many lives.
translation:
  language: hi
  text: फ़िरौन युद्ध में बड़ी सेना और विशाल जनसमूह के साथ उसके लिए कोई प्रभावी कार्रवाई नहीं करेगा[a], जब वह बहुत-से लोगों के प्राण लेने के लिए घेराबंदी का टीला खड़ा करेगा और घेराबंदी की दीवार बनाएगा।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “युद्ध में उसकी सहायता नहीं करेगा।” इब्रानी में शाब्दिक रूप से “उसके लिए नहीं करेगा” है; यहाँ आशय उसके पक्ष में प्रभावी कदम उठाने से है।
    reason: lexical_alternative
  - marker: b
    text: “घेराबंदी का टीला” का अनुवाद “घेराबंदी का चढ़ाई-पथ” भी हो सकता है, और “घेराबंदी की दीवार” का अनुवाद “घेराबंदी का मोर्चा,” “घेराबंदी की संरचना,” या “घेराबंदी का बुर्ज” भी सम्भव है।
    reason: lexical_alternative
lexical_decisions:
- source_word: בְחַיִל גָּדוֹל
  choice: बड़ी सेना के साथ
  rationale: सैन्य प्रसंग में חַיִל सेना या सैन्य बल को सूचित करता है; ‘बड़ी सेना’ आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: וּבְקָהָל רָב
  choice: और विशाल जनसमूह के साथ
  rationale: קָהָל का मूल अर्थ एकत्र हुआ समुदाय या जनसमूह है। सैन्य प्रसंग को बनाए रखते हुए ‘जनसमूह’ इसके व्यापक शाब्दिक अर्थ को अनावश्यक रूप से ‘सैनिक दल’ तक सीमित नहीं करता।
- source_word: יַעֲשֶׂה אוֹתוֹ
  choice: उसके लिए कोई प्रभावी कार्रवाई नहीं करेगा
  rationale: यह संक्षिप्त इब्रानी प्रयोग उसके पक्ष में कारगर कदम उठाने का भाव देता है। यह अनुवाद केवल ‘सहायता’ कहने की अपेक्षा עשה की व्यापकता को अधिक सुरक्षित रखता है।
- source_word: בַּמִּלְחָמָה
  choice: युद्ध में
  rationale: निश्चित लेख सहित एकवचन संज्ञा का सीधा और स्वाभाविक हिन्दी रूप।
- source_word: בִּשְׁפֹּךְ סֹלְלָה
  choice: जब घेराबंदी का टीला खड़ा किया जाएगा
  rationale: שׁפך का मूल अर्थ ‘उंडेलना’ है, पर סֹלְלָה के साथ यह मिट्टी जमा करके घेराबंदी का टीला या चढ़ाई-पथ बनाने का मुहावरा है। कर्मवाच्य रूप निहित कर्ता को अनिर्धारित रखता है।
- source_word: וּבִבְנוֹת דָּיֵק
  choice: और घेराबंदी की दीवार बनाई जाएगी
  rationale: דָּיֵק किसी घेराबंदी-संरचना को दर्शाता है; ‘घेराबंदी की दीवार’ पठनीय है, जबकि अन्य सम्भव संरचनाएँ पादटिप्पणी में दी गई हैं।
- source_word: לְהַכְרִית נְפָשׁוֹת רַבּוֹת
  choice: बहुत-से प्राणों का अन्त करने के लिए
  rationale: הכרית का ‘काट डालना/समाप्त करना’ और נְפָשׁוֹת का ‘प्राण/जीवन’ भाव सुरक्षित रहता है तथा हिन्दी में वाक्य स्वाभाविक सुनाई देता है।
