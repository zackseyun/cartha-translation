  rationale: दुर्लभ קָח को ‘ले गया’ के रूप में और עַל को स्थान-सूचक ‘के पास’ के रूप में पढ़ा गया है। ‘भरपूर जल’ सिंचाई के लिए उपलब्ध प्रचुर पानी की छवि देता है।
- source_word: צַפְצָפָה
  choice: विलो वृक्ष
  rationale: इस अनिश्चित वनस्पति-नाम के लिए जल के निकट उगने वाला ‘विलो’ उपयुक्त मुख्य पाठ है; ‘पॉपलर’ को पाठ-टिप्पणी में सुरक्षित रखा गया है।
- source_word: שָׂמוֹ
  choice: रोप दिया
  rationale: שׂים का मूल भाव ‘रखना/स्थापित करना’ है; इस कृषि-रूपक में ‘रोप दिया’ सहज हिन्दी में उसी क्रिया को व्यक्त करता है।
