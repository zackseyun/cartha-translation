base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/017/013.yaml
  text: And he took one of the royal offspring and made a covenant with him[a], bringing him under an oath, and he took the mighty men of the land.
translation:
  language: hi
  text: उसने राजवंश में से एक व्यक्ति को लिया और उसके साथ वाचा बाँधी। उसने उसे शपथ से बाँधा[a] और देश के सामर्थी लोगों को ले गया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “शापयुक्त शपथ से बाँधा”; इब्रानी शब्द ऐसी शपथ को भी दर्शा सकता है जिसके साथ उसे तोड़ने पर शाप जुड़ा होता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: מִזֶּרַע הַמְּלוּכָה
  choice: राजवंश में से एक व्यक्ति
  rationale: זֶרַע का मूल अर्थ ‘बीज’ है, पर वंश के संदर्भ में यह संतान या वंशज को दर्शाता है। यह अनुवाद מִן के अंशवाचक भाव और राजकीय वंश—दोनों को स्वाभाविक हिन्दी में रखता है।
- source_word: וַיִּכְרֹת אִתּוֹ בְּרִית
  choice: उसके साथ वाचा बाँधी
  rationale: כרת ברית वाचा स्थापित करने का प्रचलित इब्रानी मुहावरा है। ‘वाचा बाँधी’ हिन्दी में गंभीर और बंधनकारी संबंध को व्यक्त करता है तथा इसे केवल राजनीतिक ‘संधि’ तक सीमित नहीं करता।
- source_word: וַיָּבֵא אֹתוֹ בְּאָלָה
  choice: उसे शपथ के अधीन किया
  rationale: אָלָה शपथ को दर्शा सकता है, जिसमें उसे तोड़ने पर शाप का दंड निहित हो। मुख्य पाठ में सहज और कानूनी रूप से बंधनकारी अर्थ रखा गया है; शाप-संबंधी अर्थ पाद-टिप्पणी में सुरक्षित है।
- source_word: אֵילֵי הָאָרֶץ
  choice: देश के सामर्थी लोगों
  rationale: אֵילִים का शाब्दिक अर्थ ‘मेढ़े’ है, पर यहाँ रूपक रूप में शक्तिशाली या प्रभावशाली व्यक्तियों के लिए प्रयुक्त है। ‘सामर्थी लोग’ शक्ति और प्रतिष्ठा का भाव रखता है, बिना कोई निश्चित पद आरोपित किए।
- source_word: לָקָח
  choice: ले गया
  rationale: לָקָח का सामान्य अर्थ ‘लेना’ है। यहाँ संदर्भ देश के प्रभावशाली लोगों को वहाँ से ले जाने का है, इसलिए ‘ले गया’ स्वाभाविक हिन्दी में दिशा और परिणाम स्पष्ट करता है।
theological_decisions:
- issue: वाचागत और राजनीतिक शब्दावली
  choice: ‘वाचा’ को बनाए रखा गया है।
  alternative: ‘संधि’
  rationale: בְּרִית वाचा का सामान्य इब्रानी शब्द है। यद्यपि प्रसंग राजनीतिक है, साथ की शपथ इसकी गंभीर और बंधनकारी प्रकृति की पुष्टि करती है; इसलिए इसे केवल लौकिक संधि कहना अर्थ को संकरा कर सकता है।
- issue: אָלָה का शपथ और शाप वाला अर्थ
  choice: मुख्य पाठ में ‘शपथ’ और पाद-टिप्पणी में शाप-दंड का संकेत।
  alternative: ‘शाप’ अथवा ‘शापयुक्त शपथ’ सीधे मुख्य पाठ में
  rationale: यह शब्द शपथ तथा उसके उल्लंघन पर निहित शाप—दोनों का भाव रख सकता है। मुख्य पाठ को सहज रखते हुए पाद-टिप्पणी मूल की अर्थगत व्यापकता और तनाव को सुरक्षित रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सहज कथात्मक स्तर रखा गया है। ‘राजवंश’, ‘वाचा’ और ‘शपथ के अधीन’ मूल के राजकीय तथा बंधनकारी भाव को स्पष्ट रखते हैं; दुर्लभ शाब्दिक मुहावरों से बचा गया है।
