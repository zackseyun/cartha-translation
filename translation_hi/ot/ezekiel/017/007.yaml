base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/017/007.yaml
  text: And there was another great eagle with great wings and much plumage[a]; and behold, this vine bent its roots toward him and sent out its branches to him[d][c][b], that he might water it from the beds where it was planted.
translation:
  language: hi
  text: फिर एक और बड़ा उकाब[a] था, बड़े पंखों और बहुत-से परों वाला; और देखो, इस बेल ने अपनी जड़ें उसकी ओर मोड़ लीं और अपनी डालियाँ उसकी ओर बढ़ाईं, ताकि वह उसे उसकी रोपाई की क्यारियों से सींचे।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘गिद्ध’; इब्रानी शब्द किसी बड़े शिकारी पक्षी के लिए प्रयुक्त हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: 'वैकल्पिक रूप से, ‘अपनी रोपाई की क्यारियों से’ का संबंध बेल के जड़ें मोड़ने और डालियाँ बढ़ाने से जोड़ा जा सकता है: ‘बेल ने अपनी रोपाई की क्यारियों से अपनी जड़ें उसकी ओर मोड़ लीं और अपनी डालियाँ उसकी ओर बढ़ाईं।’'
    reason: syntactic_ambiguity
lexical_decisions:
- source_word: נֶשֶׁר
  choice: उकाब
  rationale: यह इब्रानी शब्द किसी बड़े शिकारी पक्षी को सूचित कर सकता है। इस राजकीय रूपक में प्रचलित और स्वाभाविक हिन्दी रूप ‘उकाब’ उपयुक्त है।
- source_word: גָּדוֹל גְּדֹול כְּנָפַיִם וְרַב נוֹצָה
  choice: बड़ा ... जिसके पंख बड़े और पर बहुत थे
  rationale: גדול की पुनरावृत्ति और נוצָה के ‘पर/पक्षति’ संबंधी अर्थ को सहज आधुनिक हिन्दी में बनाए रखा गया है।
- source_word: וְהִנֵּה
  choice: और देखो
  rationale: यह पद रूपक में आए नए और चौंकाने वाले मोड़ पर ध्यान खींचता है।
- source_word: כָּפְנָה שָׁרֳשֶׁיהָ עָלָיו
  choice: अपनी जड़ें उसकी ओर मोड़ दीं
  rationale: क्रिया बेल के स्वयं को दूसरे उकाब की दिशा में मोड़ने का सजीव चित्र प्रस्तुत करती है; על यहाँ दिशासूचक है।
- source_word: דָלִיּוֹתָיו שִׁלְחָה לּוֹ
  choice: अपनी डालियाँ उसकी ओर बढ़ाईं
  rationale: शाब्दिक रूप से ‘भेजीं’ संभव है, किंतु बेल की डालियों के संदर्भ में ‘बढ़ाईं’ अधिक स्वाभाविक है। प्रत्यय की रूपगत अनियमितता के बावजूद संदर्भ डालियों को बेल की ही बताता है।
- source_word: לְהַשְׁקוֹת אֹתָהּ
  choice: ताकि वह उसे सींचे
  rationale: लामेदयुक्त infinitive को प्रयोजन के रूप में रखा गया है और निहित कर्ता दूसरे उकाब को माना गया है।
- source_word: מֵעֲרֻגוֹת מַטָּעָהּ
  choice: अपनी रोपाई की क्यारियों से दूर
  rationale: מן को अलगावसूचक मानकर यह पद बेल के अपनी क्यारियों से दूसरे उकाब की ओर मुड़ने से जोड़ा गया है। निकटवर्ती ‘सींचने’ से इसका संबंध भी व्याकरणतः संभव है, इसलिए उसे पादटिप्पणी में सुरक्षित रखा गया है।
theological_decisions:
- issue: מֵעֲרֻגוֹת מַטָּעָהּ का वाक्यगत संबंध
  choice: इसे बेल के अपनी रोपाई की क्यारियों से दूर दूसरे उकाब की ओर मुड़ने से जोड़ा गया है।
  alternative: 'इसे ‘सींचे’ से जोड़कर पढ़ा जा सकता है: ‘ताकि वह उसकी रोपाई की क्यारियों से उसे सींचे।’'
  rationale: इब्रानी पदक्रम निकटवर्ती क्रिया ‘सींचना’ से संबंध की अनुमति देता है, जबकि מן का अलगावसूचक अर्थ और रूपक का प्रसंग इसे बेल के मुड़ने से जोड़ने का समर्थन करते हैं। अस्पष्टता को पादटिप्पणी में स्पष्ट रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘उकाब’, ‘क्यारियाँ’ और ‘सींचे’ कृषि तथा राजकीय रूपक की चित्रात्मकता बनाए रखते हैं; वास्तविक इब्रानी वाक्यगत अस्पष्टता को मुख्य पाठ में दबाने के बजाय पादटिप्पणी में सुरक्षित रखा गया है।
