source:
  edition: WLC
  text: וְֽ/יָדְע֞וּ כָּל עֲצֵ֣י הַ/שָּׂדֶ֗ה כִּ֣י אֲנִ֤י יְהוָה֙ הִשְׁפַּ֣לְתִּי עֵ֣ץ גָּבֹ֗הַ הִגְבַּ֨הְתִּי֙ עֵ֣ץ שָׁפָ֔ל הוֹבַ֨שְׁתִּי֙ עֵ֣ץ לָ֔ח וְ/הִפְרַ֖חְתִּי עֵ֣ץ יָבֵ֑שׁ אֲנִ֥י יְהוָ֖ה דִּבַּ֥רְתִּי וְ/עָשִֽׂיתִי־׀׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/017/024.yaml
  text: 'And all the trees of the field shall know that I am Yahweh: I have brought low the high tree[a], I have raised up the low tree, I have dried up the green tree, and I have made the dry tree flourish. I am Yahweh; I have spoken[b], and I have done it.'
translation:
  language: hi
  text: और मैदान के सभी वृक्ष जान लेंगे कि मैं याहवे हूँ। मैंने ऊँचे वृक्ष को नीचा किया है और निचले वृक्ष को ऊँचा किया है। मैंने हरे-भरे वृक्ष[a] को सुखा दिया है और सूखे वृक्ष में कोंपलें फूटने दी हैं[b]। मैं याहवे हूँ; मैंने कहा है और उसे पूरा किया है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, ‘नम वृक्ष’ या ‘ताज़ा वृक्ष’। इब्रानी विशेषण में नमी और ताज़गी का भाव है।
    reason: lexical_alternative
  - marker: b
    text: या, ‘सूखे वृक्ष को अंकुरित किया है’ अथवा ‘सूखे वृक्ष को पुष्पित किया है’।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָדְעוּ
  choice: जान लेंगे
  rationale: भविष्यसूचक प्रसंग में पूर्ण क्रिया परिणाम और निश्चित भविष्य व्यक्त करती है; ‘जान लेंगे’ आधुनिक हिन्दी में इसे स्वाभाविक रूप से संप्रेषित करता है।
- source_word: כָּל עֲצֵי הַשָּׂדֶה
  choice: मैदान के सभी वृक्ष
  rationale: वृक्षों के रूपक को अक्षुण्ण रखते हुए रचना-सम्बन्ध का सीधा और स्वाभाविक हिन्दी रूप।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय लिप्यंतरित किया गया है।
- source_word: הִשְׁפַּלְתִּי עֵץ גָּבֹהַ
  choice: मैंने ऊँचे वृक्ष को नीचा किया है
  rationale: हिफ़ील की कारणवाचक शक्ति और ऊँचा–नीचा विरोध दोनों सुरक्षित रहते हैं।
- source_word: הִגְבַּהְתִּי עֵץ שָׁפָל
  choice: नीचे वृक्ष को ऊँचा किया है
  rationale: समानांतर विरोध को सीधे रूप में रखता है और अनावश्यक नैतिक अर्थ नहीं जोड़ता।
- source_word: הוֹבַשְׁתִּי עֵץ לָח
  choice: हरे-भरे वृक्ष को सुखा दिया है
  rationale: לָח का मूल अर्थ नम या ताज़ा है; वृक्ष के सन्दर्भ में ‘हरा-भरा’ जीवित और रसयुक्त दशा को स्वाभाविक हिन्दी में व्यक्त करता है, जबकि ‘सुखा दिया’ कारणवाचक क्रिया को बनाए रखता है।
- source_word: וְהִפְרַחְתִּי עֵץ יָבֵשׁ
  choice: सूखे वृक्ष को अंकुरित कर दिया है
  rationale: פרח की कोंपल निकलने, खिलने या प्रस्फुटित होने की छवि को कारणवाचक ढंग से व्यक्त करता है और सामान्य ‘फलने-फूलने’ से अधिक स्रोत-सन्निकट है।
- source_word: דִּבַּרְתִּי וְעָשִׂיתִי
  choice: मैंने कहा है और कर भी दिया है
  rationale: याहवे के वचन और उसके निश्चित कार्यान्वयन के बल को सहज, दृढ़ हिन्दी में रखता है; ‘भी’ कथन और सिद्धि के सम्बन्ध पर बल देता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: प्रभु / यहोवा
  rationale: मूल पाठ व्यक्तिगत वाचा-नाम का प्रयोग करता है; ‘याहवे’ उसे उपाधि से प्रतिस्थापित किए बिना प्रस्तुत करता है।
- issue: वृक्षों के रूपक का आशय
  choice: मुख्य पाठ में वृक्षों का रूपक ज्यों का त्यों रखा गया
  alternative: वृक्षों को स्पष्टतः राजाओं या राष्ट्रों के रूप में अनूदित करना
  rationale: प्रसंग रूपक के राजनीतिक और धर्मवैचारिक संकेत देता है, पर इस पद में इब्रानी पाठ स्वयं वृक्षों की छवि बनाए रखता है; अनुवाद में उसका अर्थ पहले से तय नहीं किया गया।
- issue: पूर्ण क्रियाओं का कालगत बल
  choice: पहले वाक्य में निश्चित भविष्य और याहवे के कार्यों में पूर्णता का रूप
  alternative: सभी क्रियाओं को साधारण भविष्य में रखना
  rationale: וְיָדְעוּ परिणामस्वरूप भविष्य की ओर संकेत करता है, जबकि प्रथम पुरुष पूर्ण क्रियाएँ घोषित कार्य की निश्चितता और पूर्णता को नाटकीय ढंग से रखती हैं।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमामय, स्पष्ट भविष्यसूचक शैली अपनाई गई है। ‘वृक्ष’ रूपक और साहित्यिक स्वर के अनुकूल है; वाक्य छोटे रखे गए हैं ताकि विरोधी युग्म—ऊँचा/नीचा और हरा-भरा/सूखा—स्पष्ट सुनाई दें। सभी पादटिप्पणी-चिह्न मुख्य पाठ में सम्बद्ध शब्दों के तुरन्त बाद दिए गए हैं।
