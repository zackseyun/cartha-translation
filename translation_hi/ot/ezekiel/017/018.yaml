id: EZK.17.18
reference: Ezekiel 17:18
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וּ/בָזָ֥ה אָלָ֖ה לְ/הָפֵ֣ר בְּרִ֑ית וְ/הִנֵּ֨ה נָתַ֥ן יָד֛/וֹ וְ/כָל אֵ֥לֶּה עָשָׂ֖ה לֹ֥א יִמָּלֵֽט־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/017/018.yaml
  text: He despised the oath by breaking the covenant[a]; behold, he had given his hand, yet did all these things[b]. He will not escape.
translation:
  language: hi
  text: उसने वाचा तोड़कर शपथ का तिरस्कार किया[a]। देखो, उसने अपना हाथ दिया था[b], फिर भी उसने ये सब काम किए। वह बच नहीं पाएगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘शाप’; इब्रानी शब्द ऐसी शपथ को भी सूचित कर सकता है जिसके साथ शाप का दंड जुड़ा हो।
    reason: lexical_alternative
  - marker: b
    text: ‘अपना हाथ देना’ किसी प्रतिज्ञा या समझौते की पुष्टि करने का मुहावरा है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָזָה
  choice: उसने…तिरस्कार किया
  rationale: בזה का अर्थ तुच्छ जानना या तिरस्कार करना है। यह चयन आरोप की नैतिक गंभीरता को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: אָלָה
  choice: शपथ
  rationale: वाचा के प्रसंग में यह शब्द ऐसी शपथ को सूचित कर सकता है जिसके उल्लंघन पर शाप का दंड जुड़ा हो। मुख्य पाठ में ‘शपथ’ समानांतर ‘वाचा’ के साथ सर्वाधिक स्वाभाविक है; ‘शाप’ की अर्थ-छाया पादटिप्पणी में रखी गई है।
- source_word: לְהָפֵר בְּרִית
  choice: वाचा तोड़कर
  rationale: लामेद सहित infinitive शपथ के तिरस्कार की रीति को व्यक्त करता है। ‘वाचा तोड़कर’ इस संबंध को संक्षिप्त और स्पष्ट हिन्दी में रखता है।
- source_word: בְּרִית
  choice: वाचा
  rationale: यद्यपि तत्काल प्रसंग राजनीतिक संधि का है, בְּרִית बाइबिल का मानक वाचा-संबंधी शब्द है। ‘वाचा’ राजनीतिक और नैतिक-धार्मिक दोनों भार को बनाए रखता है।
- source_word: וְהִנֵּה
  choice: देखो
  rationale: הִנֵּה आगे की बात पर ध्यान खींचता और उसे बल देता है। ‘देखो’ हिन्दी में इस आलंकारिक प्रभाव को स्वाभाविक रूप से व्यक्त करता है।
- source_word: נָתַן יָדוֹ
  choice: उसने अपना हाथ दिया था
  rationale: मूल मुहावरे को पारदर्शिता के लिए मुख्य पाठ में रखा गया है; इसका अर्थ किसी प्रतिज्ञा या समझौते की पुष्टि करना है, जिसे पादटिप्पणी स्पष्ट करती है।
- source_word: וְכָל אֵלֶּה עָשָׂה
  choice: फिर भी उसने ये सब काम किए
  rationale: संदर्भ में यह खंड उसके हाथ देकर वचनबद्ध होने और उसके विश्वासघाती कार्यों के बीच विरोध प्रकट करता है। ‘फिर भी’ उस निहित विरोध को स्पष्ट करता है।
- source_word: לֹא יִמָּלֵט
  choice: वह बच नहीं पाएगा
  rationale: यहाँ מלט का निफ़ाल रूप न्याय से बच निकलने को दर्शाता है। ‘बच नहीं पाएगा’ आधुनिक हिन्दी में स्वाभाविक और प्रसंगानुकूल है।
theological_decisions:
- issue: वाचागत और राजनीतिक शब्दावली का अनुवाद
  choice: ‘शपथ’ और ‘वाचा’ को बनाए रखना
  alternative: ‘शाप’ और ‘संधि’
  rationale: पद राजनीतिक विश्वासघात की निंदा ऐसी भाषा में करता है जिसमें परमेश्वर के सामने नैतिक और वाचागत उत्तरदायित्व भी निहित है। ‘शपथ’ और ‘वाचा’ इस आयाम को बिना बढ़ा-चढ़ाकर प्रस्तुत किए सुरक्षित रखते हैं।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण शैली रखी गई है। ‘वाचा’ बाइबिलीय शब्दावली को सुरक्षित रखता है, जबकि वाक्य-विन्यास सामान्य पाठक के लिए सहज है। मूल का ‘हाथ देना’ मुहावरा मुख्य पाठ में रखा गया और पादटिप्पणी में स्पष्ट किया गया है।
