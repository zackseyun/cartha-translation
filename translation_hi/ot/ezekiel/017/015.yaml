source:
  edition: WLC
  text: וַ/יִּמְרָד בּ֗/וֹ לִ/שְׁלֹ֤חַ מַלְאָכָי/ו֙ מִצְרַ֔יִם לָֽ/תֶת ל֥/וֹ סוּסִ֖ים וְ/עַם רָ֑ב הֲ/יִצְלָ֤ח הֲ/יִמָּלֵט֙ הָ/עֹשֵׂ֣ה אֵ֔לֶּה וְ/הֵפֵ֥ר בְּרִ֖ית וְ/נִמְלָֽט־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/017/015.yaml
  text: But he rebelled against him by sending his messengers to Egypt[a], that they might give him horses and many people. Will he prosper? Will he escape[b], who does these things? Can he break a covenant and yet escape?
translation:
  language: hi
  text: परन्तु उसने अपने दूतों को मिस्र भेजकर उसके विरुद्ध विद्रोह किया, ताकि वह मिस्र से घोड़े और बहुत-से लोग[a] पाए। क्या वह सफल होगा? क्या ऐसा करनेवाला बच निकलेगा? क्या वह वाचा तोड़कर भी बच निकलेगा?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “घोड़े और एक बड़ी सेना” अथवा “घोड़े और बहुत-से सैनिक”; इब्रानी में शाब्दिक रूप से “घोड़े और बहुत-से लोग” है, जो प्रसंग में मिस्र से मिलनेवाली सैन्य सहायता को दर्शाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּמְרָד בּוֹ
  choice: उसने उसके विरुद्ध विद्रोह किया
  rationale: מרד राजनीतिक अधीनता के विरुद्ध विद्रोह को व्यक्त करता है; בּוֹ का आशय प्रसंग में उस अधिपति से है जिसके विरुद्ध विद्रोह हुआ।
- source_word: לִשְׁלֹחַ מַלְאָכָיו מִצְרַיִם
  choice: अपने दूत मिस्र भेजे
  rationale: מַלְאָכִים यहाँ राजनयिक दूत हैं; सामान्य और स्वाभाविक हिन्दी में ‘दूत’ अर्थ और गरिमा दोनों बनाए रखता है।
- source_word: לָתֶת לוֹ סוּסִים וְעַם רָב
  choice: ताकि वे उसे घोड़े और बहुत-से लोग दें
  rationale: मुख्य पाठ में עַם का मूल अर्थ ‘लोग’ रखा गया है; प्रसंग में यह मिस्र से मिलनेवाली सैन्य जनशक्ति की ओर संकेत करता है, जिसे पादटिप्पणी स्पष्ट करती है।
- source_word: הֲיִצְלָח
  choice: क्या वह सफल होगा?
  rationale: צלח यहाँ विद्रोह के सफल होने के विषय में परिणामपरक प्रश्न है; ‘सफल होगा’ आधुनिक हिन्दी में सीधा और स्वाभाविक है।
- source_word: הֲיִמָּלֵט ... וְנִמְלָט
  choice: क्या ... बच निकलेगा? ... क्या ... बच निकलेगा?
  rationale: נמלט संकट या दण्ड से निकल भागने अथवा बचने को दर्शाता है; दोनों occurrences में पुनरावृत्ति बनाए रखी गई है।
- source_word: הָעֹשֵׂה אֵלֶּה
  choice: ऐसा करनेवाला
  rationale: यह मूल के substantival participle को संक्षिप्त, स्वाभाविक और सामान्यवाची एकवचन रूप में व्यक्त करता है।
- source_word: וְהֵפֵר בְּרִית
  choice: वाचा तोड़कर
  rationale: הפר ברית का अर्थ वाचा भंग करना है। ‘वाचा’ इस राजनीतिक प्रतिज्ञा के नैतिक-धार्मिक भार को ‘सन्धि’ की अपेक्षा बेहतर बनाए रखता है।
theological_decisions:
- issue: בְּרִית द्वारा सूचित राजनीतिक बन्धन का स्वरूप
  choice: वाचा
  alternative: सन्धि / समझौता
  rationale: प्रसंग राजनीतिक है, फिर भी यहेजकेल में בְּרִית शपथबद्ध दायित्व और उसके उल्लंघन की गम्भीरता रखता है। ‘वाचा’ इस आयाम को बिना किसी सम्प्रदायगत व्याख्या के सुरक्षित रखता है।
- issue: अन्तिम प्रश्न में बच निकलने की सम्भावना
  choice: क्या वह वाचा तोड़कर भी बच निकलेगा?
  alternative: और वाचा तोड़कर बच निकलेगा?
  rationale: ‘भी’ मूल के विस्मयपूर्ण आलंकारिक बल को स्वाभाविक हिन्दी में व्यक्त करता है, पर उत्तर को पाठ में जोड़ता नहीं।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किन्तु सहज शैली रखी गई है। ‘परन्तु’, ‘दूत’, ‘वाचा’ और ‘बच निकलेगा’ जैसे पद सामान्य पाठक के लिए बोधगम्य रहते हुए भविष्यद्वाणी के गम्भीर स्वर को बनाए रखते हैं।
