translation:
  language: hi
  text: “हे मनुष्य के पुत्र[a], इस्राएल के घराने से एक पहेली प्रस्तुत कर और एक दृष्टान्त[b] सुना।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “हे नश्वर मनुष्य” अथवा “हे मानव।” इब्रानी मुहावरे “मनुष्य के पुत्र” को यहाँ इसलिए रखा गया है क्योंकि यह यहेजकेल को बार-बार किया गया संबोधन है।
    reason: lexical_alternative
  - marker: b
    text: या, “कहावत।” इब्रानी माशाल का अर्थ कहावत, दृष्टान्त या लाक्षणिक कथन हो सकता है; यहाँ आगे आने वाला विस्तृत प्रतीकात्मक वर्णन “दृष्टान्त” के पक्ष में है।
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן אָדָם
  choice: मनुष्य के पुत्र
  rationale: यहेजकेल को बार-बार किए गए इस संबोधन की इब्रानी शब्दावली और पुस्तक की साहित्यिक पुनरावृत्ति को बनाए रखता है। यहाँ यह भविष्यद्वक्ता के लिए संबोधन है, कोई मसीही उपाधि नहीं।
- source_word: חוּד חִידָה
  choice: एक पहेली रख
  rationale: इब्रानी क्रिया और संज्ञा का संयुक्त भाव किसी पहेली को श्रोताओं के सामने प्रस्तुत करना है; आधुनिक हिन्दी में ‘पहेली रख’ स्वाभाविक और निर्देशात्मक है।
- source_word: וּמְשֹׁל מָשָׁל
  choice: एक दृष्टान्त सुना
  rationale: शाब्दिक पुनरुक्ति हिन्दी में अस्वाभाविक होती। आगे आने वाला विस्तृत प्रतीकात्मक कथन ‘दृष्टान्त’ कहलाना अधिक उपयुक्त है, और ‘सुना’ वाणी द्वारा प्रस्तुत करने का भाव देता है।
- source_word: אֶל בֵּית יִשְׂרָאֵל
  choice: इस्राएल के घराने के सामने
  rationale: אֶל यहाँ संबोधित श्रोताओं की ओर संकेत करता है। ‘के सामने’ पहेली रखने और दृष्टान्त सुनाने—दोनों क्रियाओं के साथ स्वाभाविक है, जबकि ‘घराना’ सामुदायिक और वाचागत अभिव्यक्ति को सुरक्षित रखता है।
theological_decisions:
- issue: यहेजकेल में בֶּן אָדָם संबोधन का अनुवाद
  choice: मनुष्य के पुत्र
  alternative: नश्वर मनुष्य; मानव
  rationale: यहाँ वाक्यांश मसीही उपाधि के रूप में नहीं, बल्कि भविष्यद्वक्ता के लिए परमेश्वर के नियमित संबोधन के रूप में प्रयुक्त है। फिर भी शाब्दिक मुहावरे को रखना यहेजकेल की साहित्यिक बनावट और पुनरावृत्ति को सुरक्षित रखता है; पादटिप्पणी अर्थगत विकल्प स्पष्ट करती है।
- issue: מָשָׁל की विधागत व्यापकता
  choice: दृष्टान्त
  alternative: कहावत; रूपक-कथा
  rationale: इब्रानी शब्द कहावत, दृष्टान्त या लाक्षणिक कथन को सूचित कर सकता है। यहाँ आगे का विस्तृत प्रतीकात्मक वर्णन ‘दृष्टान्त’ का समर्थन करता है, पर पादटिप्पणी शब्द की वास्तविक व्यापकता बनाए रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और प्रत्यक्ष आज्ञार्थक शैली अपनाई गई है। ‘इस्राएल का घराना’ जैसे बाइबिलीय सामुदायिक पद को बनाए रखा गया है, पर क्रियाओं को स्वाभाविक हिन्दी में व्यक्त किया गया है।
