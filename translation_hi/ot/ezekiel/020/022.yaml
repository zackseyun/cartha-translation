source:
  edition: WLC
  text: וַ/הֲשִׁבֹ֨תִי֙ אֶת יָדִ֔/י וָ/אַ֖עַשׂ לְמַ֣עַן שְׁמִ֑/י לְ/בִלְתִּ֤י הֵחֵל֙ לְ/עֵינֵ֣י הַ/גּוֹיִ֔ם אֲשֶׁר הוֹצֵ֥אתִי אוֹתָ֖/ם לְ/עֵינֵי/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/020/022.yaml
  text: But I held back my hand[a], and I acted for the sake of my name, so that it would not be profaned in the sight of the nations[b], before whose eyes I had brought them out.
translation:
  language: hi
  text: किन्तु मैंने अपना हाथ रोक लिया[a] और अपने नाम के कारण ऐसा किया, ताकि उन जातियों के सामने मेरा नाम अपवित्र न हो[b], जिनकी आँखों के सामने मैं उन्हें निकाल लाया था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘मैंने अपना हाथ पीछे खींच लिया’ अथवा ‘मैंने अपना हाथ लौटा लिया।’ इब्रानी मुहावरा दण्ड की कार्रवाई पूरी करने से रुकने का भाव व्यक्त करता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, ‘ताकि अपवित्र न किया जाए।’ निहित कर्म परमेश्वर का ‘नाम’ है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַהֲשִׁבֹתִי אֶת־יָדִי
  choice: मैंने अपना हाथ रोक लिया
  rationale: इब्रानी मुहावरे का शाब्दिक भाव हाथ को पीछे लौटाने का है; प्रसंग में इसका अर्थ घोषित दण्ड को पूरा करने से रुकना है। यह रूप हाथ की उपमा और संयम—दोनों को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: וָאַעַשׂ
  choice: ऐसा किया
  rationale: עשה का अर्थ व्यापक रूप से ‘करना’ है। यहाँ यह परमेश्वर द्वारा अपने हाथ को रोकने के निर्णय की ओर संकेत करता है; ‘ऐसा किया’ पूर्ववर्ती कथन से स्वाभाविक रूप से जुड़ता है और अनावश्यक विवरण नहीं जोड़ता।
- source_word: לְמַעַן שְׁמִי
  choice: अपने नाम के कारण
  rationale: मूल पाठ के ‘मेरे नाम के लिए/कारण’ को बनाए रखकर परमेश्वर के नाम के सार्वजनिक सम्मान का वाचा-संबंधी भाव सुरक्षित रखा गया है।
- source_word: לְבִלְתִּי הֵחֵל
  choice: ताकि ... मेरा नाम अपवित्र न हो
  rationale: חלל का यहाँ अर्थ पवित्र नाम को अपवित्र या अनादृत करना है। इब्रानी में कर्म निहित है; हिन्दी में स्पष्टता के लिए पिछले पदबंध से ‘मेरा नाम’ दोहराया गया है।
- source_word: לְעֵינֵי הַגּוֹיִם
  choice: उन जातियों के सामने
  rationale: यह सार्वजनिक रूप से जातियों की दृष्टि में होने का भाव देता है। ‘सामने’ सहज हिन्दी है, जबकि अंतिम समान पदबंध में ‘आँखों के सामने’ रखकर मूल की दृष्टि-संबंधी छवि भी सुरक्षित है।
- source_word: אֲשֶׁר הוֹצֵאתִי אוֹתָם לְעֵינֵיהֶם
  choice: जिनकी आँखों के सामने मैं उन्हें निकाल लाया था
  rationale: हिफ़ील रूप ‘निकाल लाना’ दर्शाता है। ‘था’ इस पहले घट चुकी घटना को चिह्नित करता है और ‘आँखों के सामने’ मूल के दोहराए गए दृष्टि-बिंब को व्यक्त करता है।
theological_decisions:
- issue: घोषित दण्ड के बाद परमेश्वर का हाथ रोकना
  choice: परमेश्वर ने दण्ड की कार्रवाई पूरी करने से अपने को रोका—‘मैंने अपना हाथ रोक लिया।’
  alternative: ‘मैंने अपना हाथ पीछे खींच लिया’ या ‘मैंने अपना हाथ लौटा लिया।’
  rationale: मूल मुहावरा हाथ की गति की छवि देता है, पर प्रसंग में आशय दण्ड से विरत होना है। चुना हुआ रूप इस आशय को स्पष्ट करता है, फिर भी ‘हाथ’ की मूल उपमा बनाए रखता है।
- issue: ‘मेरे नाम’ का आशय
  choice: मुख्य पाठ में ‘अपने नाम’ को बनाए रखा गया है और अगले वाक्यांश में स्पष्टता के लिए ‘मेरा नाम’ कहा गया है।
  alternative: ‘अपने सम्मान’ या ‘अपनी प्रतिष्ठा के कारण।’
  rationale: मूल पाठ स्पष्टतः परमेश्वर के ‘नाम’ की बात करता है। इसे ‘प्रतिष्ठा’ से बदलने पर बाइबलीय और वाचा-संबंधी अनुगूँज घट जाती; जातियों के सामने अपवित्र होने का उल्लेख सार्वजनिक सम्मान का संदर्भ स्वयं स्पष्ट करता है।
- issue: לְבִלְתִּי הֵחֵל में निहित कर्म
  choice: हिन्दी में निहित कर्म को ‘मेरा नाम’ के रूप में स्पष्ट किया गया है।
  alternative: ‘ताकि अपवित्र न किया जाए,’ बिना कर्म बताए।
  rationale: निकटतम पूर्वपद ‘मेरा नाम’ ही निहित कर्म है। उसे स्पष्ट करना हिन्दी में अस्पष्टता दूर करता है, पर कोई नया धर्मवैज्ञानिक दावा नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज शैली अपनाई गई है। ‘जातियाँ,’ ‘नाम’ और ‘अपवित्र’ जैसे बाइबलीय शब्द बनाए गए हैं। वाक्य में मूल की कारण-परिणाम संरचना तथा ‘आँखों के सामने’ वाला दृश्य-बिंब सुरक्षित रखा गया है।
