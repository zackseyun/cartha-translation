base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/020/029.yaml
  text: Then I said to them, ‘What is this high place where you are going?’ So its name is called Bamah to this day.
translation:
  language: hi
  text: तब मैंने उनसे कहा, “वह ऊँचा स्थान क्या है, जहाँ तुम जा रहे हो?” और उसका नाम आज तक बामा[a] कहलाता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “बामा” इब्रानी शब्द है, जिसका अर्थ “ऊँचा स्थान” है और जो अक्सर उपासना के स्थान के लिए प्रयुक्त होता है।
    reason: स्थान-नाम ‘बामा’ और पहले आए इब्रानी सामान्य शब्द के बीच संबंध तथा उसका सामान्य धार्मिक प्रयोग स्पष्ट करने के लिए।
lexical_decisions:
- source_word: הַבָּמָה
  choice: ऊँचा पूजा-स्थान
  rationale: ‘बामा’ किसी ऊँचे स्थान, विशेषकर उपासना या बलि के स्थल, को दर्शाता है। केवल ‘ऊँचा स्थान’ कहने से धार्मिक संदर्भ अस्पष्ट रह सकता था।
- source_word: הַבָּאִים שָׁם
  choice: जहाँ तुम जा रहे हो
  rationale: इब्रानी में शाब्दिक भाव ‘वहाँ आने वाले’ है; हिन्दी में संबोधित लोगों की गति के लिए ‘जहाँ तुम जा रहे हो’ स्वाभाविक और प्रसंगानुकूल है।
- source_word: בָּמָה
  choice: बामा
  rationale: स्थान-नाम को लिप्यंतरित किया गया है ताकि उसी इब्रानी शब्द के सामान्य अर्थ और नाम के बीच का शब्द-संबंध बना रहे।
theological_decisions:
- issue: ‘बामा’ का धार्मिक स्वरूप
  choice: मुख्य पाठ में ‘ऊँचा पूजा-स्थान’
  alternative: ‘ऊँचा स्थान’
  rationale: संदर्भ में यह सामान्य भू-आकृति नहीं, उपासना से जुड़ा स्थल है; फिर भी ‘पूजा-स्थान’ यह निर्धारित नहीं करता कि वहाँ किस देवता की पूजा की जाती थी।
- issue: नामकरण-वाक्य का संबंध
  choice: ‘और उसका नाम’
  alternative: ‘इसलिए उसका नाम’
  rationale: इब्रानी संयोजक केवल कथात्मक क्रम या परिणाम—दोनों की अनुमति देता है। ‘और’ कारण-संबंध को आवश्यकता से अधिक निश्चित किए बिना मूल की अस्पष्टता बचाता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। प्रश्न की तीखी, लगभग व्यंग्यात्मक ध्वनि को अतिरिक्त व्याख्या जोड़े बिना बनाए रखा गया है।
