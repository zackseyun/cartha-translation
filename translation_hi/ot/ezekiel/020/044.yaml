  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וִֽ/ידַעְתֶּם֙ כִּֽי אֲנִ֣י יְהוָ֔ה בַּ/עֲשׂוֹתִ֥/י אִתְּ/כֶ֖ם לְמַ֣עַן שְׁמִ֑/י לֹא֩ כְ/דַרְכֵי/כֶ֨ם הָ/רָעִ֜ים וְ/כַ/עֲלִילֽוֹתֵי/כֶ֤ם הַ/נִּשְׁחָתוֹת֙ בֵּ֣ית יִשְׂרָאֵ֔ל נְאֻ֖ם אֲדֹנָ֥/י יְהוִֽה־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/020/044.yaml
  text: Then you will know that I am Yahweh[a], when I deal with you for the sake of my name, not according to your evil ways or according to your corrupt deeds, O house of Israel[b], declares the Lord GOD.
translation:
  language: hi
  text: तब तुम जानोगे कि मैं याहवे हूँ, जब मैं अपने नाम के निमित्त[b] तुम्हारे साथ व्यवहार करूँगा[a]—तुम्हारे बुरे चालचलन और तुम्हारे भ्रष्ट कामों के अनुसार नहीं। हे इस्राएल के घराने, प्रभु याहवे की यह घोषणा है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जब मैं तुम्हारे प्रति कार्य करूँगा।” इब्रानी अभिव्यक्ति व्यापक है और यहाँ परमेश्वर की कार्रवाई का ढंग स्पष्ट नहीं करती।
    reason: lexical_alternative
  - marker: b
    text: “अपने नाम के निमित्त” का अर्थ है अपने नाम की प्रतिष्ठा और सम्मान की खातिर।
    reason: cultural_note
lexical_decisions:
- source_word: וִידַעְתֶּם
  choice: तब तुम जानोगे
  rationale: संयोजक सहित पूर्ण क्रिया भविष्यसूचक कथन में परिणामस्वरूप भविष्य का भाव देती है; ‘तब’ पहचान-सूत्र के परिणामी बल को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत नाम चतुरक्षरीय יהוה का लिप्यंतरण किया गया है, उसे किसी उपाधि से नहीं बदला गया।
- source_word: בַּעֲשׂוֹתִי אִתְּכֶם
  choice: जब मैं ... तुम्हारे साथ व्यवहार करूँगा
  rationale: यह इब्रानी पद इस्राएल के प्रति परमेश्वर की कार्रवाई को व्यापक रूप में बताता है और यह स्पष्ट नहीं करता कि कार्रवाई दंडात्मक है, पुनर्स्थापनात्मक है, या दोनों; ‘व्यवहार करूँगा’ उस खुलेपन को बनाए रखता है।
- source_word: לְמַעַן שְׁמִי
  choice: अपने नाम के निमित्त
  rationale: यह वाक्यांश परमेश्वर के नाम, अर्थात उसकी प्रतिष्ठा और सम्मान, की खातिर कार्य करने का भाव सुरक्षित रखता है।
- source_word: לֹא כְדַרְכֵיכֶם הָרָעִים
  choice: तुम्हारे बुरे चालचलन ... के अनुसार नहीं
  rationale: नैतिक संदर्भ में דֶּרֶךְ आचरण या जीवन-व्यवहार को दर्शाता है; ‘चालचलन’ आधुनिक हिन्दी में इस सामूहिक नैतिक अर्थ को स्पष्ट करता है।
- source_word: וְכַעֲלִילוֹתֵיכֶם הַנִּשְׁחָתוֹת
  choice: और तुम्हारे भ्रष्ट कामों के अनुसार नहीं
  rationale: עֲלִילוֹת कामों या कृत्यों को और הַנִּשְׁחָתוֹת उनके नैतिक रूप से भ्रष्ट होने को व्यक्त करता है।
- source_word: בֵּית יִשְׂרָאֵל
  choice: हे इस्राएल के घराने
  rationale: प्रत्यक्ष संबोधन को ‘हे’ द्वारा सुरक्षित रखा गया है और ‘घराना’ सामूहिक वंशगत समुदाय का स्वाभाविक हिन्दी रूप है।
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: प्रभु याहवे की यह घोषणा है
  rationale: נְאֻם के भविष्यद्वाणी-सूत्र को ‘घोषणा’ और אֲדֹנָי יְהוִה में उपाधि तथा व्यक्तिगत नाम के मेल को ‘प्रभु याहवे’ से व्यक्त किया गया है।
theological_decisions:
- issue: יהוה परमेश्वर के नाम का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में चतुरक्षरीय व्यक्तिगत नाम है। ‘याहवे’ उसका सीधा और प्रचलित विद्वत्तापूर्ण लिप्यंतरण है तथा नाम और उपाधि का भेद बनाए रखता है।
- issue: בַּעֲשׂוֹתִי אִתְּכֶם में परमेश्वर की कार्रवाई का स्वरूप
  choice: तुम्हारे साथ व्यवहार करूँगा
  alternative: तुम्हारे प्रति कार्य करूँगा
  rationale: इब्रानी अभिव्यक्ति कार्रवाई की रीति को निर्दिष्ट नहीं करती। व्यापक अनुवाद दंड और दया अथवा पुनर्स्थापना के बीच विद्यमान धार्मिक तनाव को समय से पहले नहीं सुलझाता।
- issue: अपने नाम के निमित्त कार्य करने का आशय
  choice: नाम का मूल रूप मुख्य पाठ में बनाए रखना और प्रतिष्ठा का अर्थ टिप्पणी में बताना
  alternative: अपनी प्रतिष्ठा की खातिर
  rationale: ‘नाम’ बाइबिलीय धार्मिक भाषा का महत्त्वपूर्ण अंग है; उसे मुख्य पाठ में सुरक्षित रखते हुए टिप्पणी पाठक को उसके सम्मान और प्रतिष्ठा संबंधी आशय से परिचित कराती है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में गरिमामय किंतु सहज रखी गई है। प्रत्यक्ष संबोधन के लिए ‘हे’ और भविष्यद्वाणी-सूत्र के लिए ‘घोषणा’ का प्रयोग पाठ की ऊँची शैली बनाए रखता है। दोनों पादटिप्पणी-चिह्न मुख्य पाठ में उनके वास्तविक संबंधित पदों के साथ लगाए गए हैं।
