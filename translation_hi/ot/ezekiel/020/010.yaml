translation:
  language: hi
  text: इसलिए मैं उन्हें मिस्र देश से निकाल लाया और उन्हें निर्जन प्रदेश में ले आया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וָאֽוֹצִיאֵם
  choice: इसलिए मैं उन्हें…से निकाल लाया
  rationale: יצא के हिफ़इल रूप में प्रथम पुरुष एकवचन कर्ता और तृतीय पुरुष बहुवचन कर्म है; इसका कारणवाचक अर्थ ‘बाहर निकालना’ है। आरंभिक וַ को पिछले प्रसंग के क्रम और परिणाम से जोड़ने के लिए ‘इसलिए’ कहा गया है।
- source_word: מֵאֶרֶץ מִצְרָיִם
  choice: मिस्र देश से
  rationale: अभिव्यक्ति में אֶרֶץ (‘देश’) स्पष्ट रूप से मौजूद है; इसलिए केवल ‘मिस्र से’ कहने के बजाय उसे अनुवाद में रखा गया है।
- source_word: וָאֲבִאֵם
  choice: और उन्हें…ले आया
  rationale: בוא के हिफ़इल का अर्थ यहाँ ‘लाना’ है। हिन्दी में गंतव्य की ओर गति के साथ ‘ले आया’ स्वाभाविक है और पहले खंड के ‘निकाल लाया’ के समानांतर भी है।
- source_word: אֶל הַמִּדְבָּר
  choice: वीराने में
  rationale: מִדְבָּר निर्जन, कम आबाद वन्य भूभाग को दर्शाता है। ‘वीराना’ आधुनिक हिन्दी में इस अर्थ को सहजता से व्यक्त करता है; אֶל और गति-सूचक क्रिया के कारण ‘में’ गंतव्य में प्रवेश का भाव देता है।
