  yaml_path: translation/ot/ezekiel/020/011.yaml
  text: I gave them my statutes[a], and I made my judgments known to them, which, if a man does them, he will live by them.
translation:
  language: hi
  text: मैंने उन्हें अपनी विधियाँ दीं और अपने न्याय-विधान उन्हें बताए; यदि कोई मनुष्य[a] उनका पालन करे, तो वह उनके पालन से जीवित रहेगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘व्यक्ति’ अथवा ‘मानवजाति’; इब्रानी में ‘मनुष्य’ एकवचन प्रतिनिधि रूप में प्रयुक्त हुआ है।
    reason: אָדָם के प्रतिनिधि एकवचन और उसके समावेशी मानवीय आशय को स्पष्ट करने के लिए।
lexical_decisions:
- source_word: וָאֶתֵּן
  choice: मैंने ... दीं
  rationale: נתן का यहाँ सीधा अर्थ देना या प्रदान करना है; यह वाचा-संबंधी व्यवस्था के संदर्भ में स्वाभाविक है।
- source_word: חֻקּוֹתַי
  choice: अपनी विधियाँ
  rationale: חֻקִּים निर्धारित वैधानिक विधियों को सूचित करता है। ‘विधियाँ’ आधुनिक हिन्दी में गरिमापूर्ण और सहज है तथा अगले कानूनी पद से भिन्नता बनाए रखता है।
- source_word: מִשְׁפָּטַי
  choice: अपने न्याय-विधान
  rationale: מִשְׁפָּטִים का कानूनी और न्यायिक भाव बनाए रखने के लिए ‘न्याय-विधान’ चुना गया है; केवल ‘न्याय’ निर्णय या निष्पक्षता का संकरा अर्थ दे सकता था।
- source_word: הוֹדַעְתִּי אוֹתָם
  choice: उन्हें बताए
  rationale: ידע के हिफ़ील रूप का अर्थ ‘ज्ञात कराया’ है। ‘बताए’ उसी अर्थ को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है, बिना ‘सिखाया’ जैसी अतिरिक्त व्याख्या जोड़े।
- source_word: אֲשֶׁר יַעֲשֶׂה אוֹתָם
  choice: यदि ... उनका पालन करे
  rationale: शाब्दिक ‘उन्हें करे’ हिन्दी में अस्वाभाविक है; विधियों और न्याय-विधानों को ‘पालन करना’ मूल के क्रियात्मक तथा शर्तसूचक भाव को स्पष्ट रूप से व्यक्त करता है।
- source_word: הָאָדָם
  choice: कोई मनुष्य
  rationale: यहाँ אָדָם निश्चित लेख के साथ एकवचन प्रतिनिधि रूप में है। ‘कोई मनुष्य’ सामान्य रूप से प्रत्येक मानव पर लागू होने वाला अर्थ और वाक्य की शर्तसूचक संरचना दोनों बनाए रखता है।
- source_word: וָחַי בָּהֶם
  choice: वह उनके द्वारा जीवित रहेगा
  rationale: ‘उनके द्वारा’ בָּהֶם के साधनात्मक/संबंधात्मक भाव को सुरक्षित रखता है। ‘जीवित रहेगा’ जीवन के स्वरूप या अवधि को आवश्यकता से अधिक परिभाषित नहीं करता।
theological_decisions:
- issue: आज्ञापालन और जीवन के संबंध का आशय
  choice: ‘वह उनके द्वारा जीवित रहेगा’ कहकर वाचा-संबंधी जीवन की व्यापक और अनिर्धारित भाषा बनाए रखी गई है।
  alternative: इसे केवल सांसारिक समृद्धि, राष्ट्रीय उन्नति, या व्यवस्था-पालन से मिलने वाले अनन्त जीवन के रूप में स्पष्ट करना।
  rationale: मूल पद जीवन के व्यक्तिगत, सामूहिक, लौकिक या युगान्त-संबंधी विस्तार को यहाँ निश्चित नहीं करता। इसलिए अनुवाद उस धर्मवैज्ञानिक तनाव को किसी एक व्याख्या में सीमित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘विधियाँ’ और ‘न्याय-विधान’ कानूनी-वाचा संबंधी शब्दावली का भेद बनाए रखते हैं। अर्धविराम मूल के जुड़े हुए कथनों को स्पष्ट करता है, और ‘यदि ... तो’ इब्रानी संबंधवाचक वाक्य में निहित शर्तसूचक अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है।
