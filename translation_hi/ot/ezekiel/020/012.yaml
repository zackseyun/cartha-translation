  text: וְ/גַ֤ם אֶת שַׁבְּתוֹתַ/י֙ נָתַ֣תִּי לָ/הֶ֔ם לִ/הְי֣וֹת לְ/א֔וֹת בֵּינִ֖/י וּ/בֵֽינֵי/הֶ֑ם לָ/דַ֕עַת כִּ֛י אֲנִ֥י יְהוָ֖ה מְקַדְּשָֽׁ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/020/012.yaml
  text: I also gave them my Sabbaths to be a sign between me and them[a], so that they might know that I am Yahweh who sanctifies them.
translation:
  language: hi
  text: मैंने उन्हें अपने विश्राम-दिन भी दिए, ताकि ये मेरे और उनके बीच एक चिन्ह हों और वे जानें कि मैं याहवे हूँ, जो उन्हें पवित्र करता है[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जो उन्हें पवित्र बनाता है।”
    reason: קדשׁ का पिएल रूप किसी को पवित्र करने या पवित्र बनाने का भाव व्यक्त कर सकता है।
lexical_decisions:
- source_word: וְגַם
  choice: भी
  rationale: यह पहले कही गई बात में एक और बात जोड़ता है; हिन्दी में ‘भी’ इसके योगात्मक भाव को स्वाभाविक रूप से व्यक्त करता है।
- source_word: שַׁבְּתוֹתַי
  choice: अपने विश्राम-दिन
  rationale: यह बहुवचन रूप और प्रथम पुरुष स्वामित्व दोनों को बनाए रखता है तथा आधुनिक हिन्दी पाठक के लिए स्पष्ट है।
- source_word: נָתַתִּי לָהֶם
  choice: मैंने उन्हें ... दिए
  rationale: यह נתן और उसके परोक्ष कर्म का सीधा, स्वाभाविक हिन्दी अनुवाद है।
- source_word: לִהְיוֹת לְאוֹת
  choice: ताकि ये ... एक चिन्ह हों
  rationale: यह उद्देश्य/परिणाम के भाव और אוֹת के वाचा-संबंधी संकेत के अर्थ को सुरक्षित रखता है। ‘ये’ का संबंध विश्राम-दिनों से स्पष्ट किया गया है।
- source_word: בֵּינִי וּבֵינֵיהֶם
  choice: मेरे और उनके बीच
  rationale: यह मूल के संबंधसूचक वाक्यांश का सीधा और सहज रूप है।
- source_word: לָדַעַת
  choice: और वे जानें
  rationale: संदर्भ में यह दिए गए चिन्ह का उद्देश्य बताता है; हिन्दी में संयुक्त उद्देश्य-वाक्य स्वाभाविक है।
- source_word: יְהוָה
  choice: याहवे
  rationale: मूल पाठ में आए परमेश्वर के व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय लिप्यंतरित किया गया है।
- source_word: מְקַדְּשָׁם
  choice: जो उन्हें पवित्र करता हूँ
  rationale: קדשׁ के पिएल कृदंत का निरंतर दैवी कार्य यहाँ ‘पवित्र करता हूँ’ से व्यक्त होता है; प्रथम पुरुष संबंधवाचक संरचना हिन्दी में वक्ता की पहचान को बनाए रखती है।
theological_decisions:
- issue: परमेश्वर के नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा
  rationale: यह रूप चतुराक्षरी दैवी नाम का निकट प्रचलित लिप्यंतरण है और मूल में प्रयुक्त व्यक्तिगत वाचा-नाम को सुरक्षित रखता है।
- issue: वाचा के संदर्भ में קדשׁ का अर्थ
  choice: पवित्र करता हूँ
  alternative: पवित्र बनाता हूँ
  rationale: मुख्य पाठ का रूप इस्राएल को पवित्र करने अथवा अपने लिए अलग ठहराने वाले परमेश्वर के कार्य को संक्षेप में व्यक्त करता है, जबकि पादटिप्पणी अधिक स्पष्ट कारणवाचक विकल्प देती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य हिन्दी पाठक के लिए सहज रखी गई है। ‘विश्राम-दिन’ बहुवचन शब्बतों को स्पष्ट करता है; लगातार आने वाले दो ‘वे’ के अलग-अलग संदर्भ से बचने के लिए विश्राम-दिनों के लिए ‘ये’ और लोगों के लिए ‘वे’ प्रयुक्त हुआ है।
