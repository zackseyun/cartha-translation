language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/אַתֶּ֨ם בֵּֽית יִשְׂרָאֵ֜ל כֹּֽה אָמַ֣ר אֲדֹנָ֣/י יְהֹוִ֗ה אִ֤ישׁ גִּלּוּלָי/ו֙ לְכ֣וּ עֲבֹ֔דוּ וְ/אַחַ֕ר אִם אֵינְ/כֶ֖ם שֹׁמְעִ֣ים אֵלָ֑/י וְ/אֶת שֵׁ֤ם קָדְשִׁ/י֙ לֹ֣א תְחַלְּלוּ ע֔וֹד בְּ/מַתְּנֽוֹתֵי/כֶ֖ם וּ/בְ/גִלּוּלֵי/כֶֽם־־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/020/039.yaml
  text: 'But as for you[a], house of Israel, thus says the Lord GOD: Go, each man, serve his idols—if afterward you will not listen to me[b]; but you shall no longer profane my holy name with your gifts and with your idols.'
translation:
  language: hi
  text: 'परन्तु हे इस्राएल के घराने, प्रभु यहोवा यों कहते हैं: जाओ, तुममें से हर पुरुष अपनी-अपनी मूर्तियों[a] की उपासना करे—यदि इसके बाद तुम मेरी बात नहीं सुनोगे[b]; किन्तु आगे से तुम अपनी भेंटों और अपनी मूर्तियों के द्वारा मेरे पवित्र नाम को अपवित्र नहीं करोगे।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ ‘मूर्तियों’ के लिए प्रयुक्त इब्रानी शब्द अत्यन्त तिरस्कारसूचक है; इसका भाव ‘घिनौनी मूर्तियाँ’ या यहाँ तक कि ‘मल-मूर्तियाँ’ भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: 'इब्रानी वाक्य-विन्यास कठिन है। इसका विराम-विन्यास इस प्रकार भी समझा जा सकता है: ‘जाओ, हर पुरुष अपनी मूर्तियों की उपासना करे; पर इसके बाद, यदि तुम मेरी बात नहीं सुनोगे…।’'
    reason: alternative_reading
lexical_decisions:
- source_word: וְאַתֶּם בֵּית יִשְׂרָאֵל
  choice: परन्तु हे इस्राएल के घराने
  rationale: स्वतंत्र सर्वनाम और संयोजक का विरोधसूचक बल रखा गया है; ‘हे’ सीधे सम्बोधन को स्वाभाविक हिन्दी में स्पष्ट करता है।
- source_word: אֲדֹנָי יְהוִה
  choice: प्रभु यहोवा
  rationale: संयुक्त ईश्वरीय उपाधि को हिन्दी बाइबलीय प्रयोग के अनुरूप रखते हुए व्यक्तिगत नाम यहोवा को सुरक्षित रखा गया है।
- source_word: אִישׁ גִּלּוּלָיו
  choice: तुममें से हर पुरुष अपनी मूर्तियों
  rationale: אִישׁ का वितरणात्मक और पुल्लिंग रूप सुरक्षित है। मुख्य पाठ में सहज ‘मूर्तियों’ रखा गया है और मूल शब्द का तीखा तिरस्कारसूचक भाव पादटिप्पणी में बताया गया है।
- source_word: לְכוּ עֲבֹדוּ
  choice: जाओ, ... उपासना करे
  rationale: दोनों आज्ञार्थक क्रियाओं का तीखा न्यायिक स्वर बना रहता है; बहुवचन सम्बोधन के भीतर वितरणात्मक एकवचन को स्वाभाविक हिन्दी वाक्य में व्यक्त किया गया है।
- source_word: וְאַחַר אִם אֵינְכֶם שֹׁמְעִים אֵלָי
  choice: यदि इसके बाद भी तुम मेरी नहीं सुनोगे
  rationale: कालसूचक ‘इसके बाद’ और शर्त दोनों सुरक्षित हैं। ‘मेरी सुनना’ हिन्दी में सुनने और आज्ञा मानने, दोनों निहितार्थों को समेटता है।
- source_word: לֹא תְחַלְּלוּ עוֹד
  choice: आगे से ... अपवित्र नहीं करोगे
  rationale: भविष्यात्मक निषेध/दृढ़ घोषणा का बल रखा गया है और עוֹד को स्वाभाविक रूप से ‘आगे से’ कहा गया है।
- source_word: בְּמַתְּנוֹתֵיכֶם וּבְגִלּוּלֵיכֶם
  choice: अपनी भेंटों और अपनी मूर्तियों के द्वारा
  rationale: साधनसूचक पूर्वसर्ग को ‘के द्वारा’ से व्यक्त किया गया है और उपासना-संबंधी ‘भेंटों’ ने प्रसंगगत अर्थ स्पष्ट रखा है।
theological_decisions:
- issue: आरम्भिक आज्ञाओं का आशय
  choice: न्यायिक अनुमति अथवा व्यंग्यात्मक आज्ञा—यदि इस्राएल सुनने से इनकार करे तो वह अपनी मूर्तियों की उपासना करता रहे, पर परमेश्वर के नाम को अपवित्र करना आगे नहीं चलेगा।
  alternative: मूर्तिपूजा का अनुमोदन करने वाली सीधी आज्ञा।
  rationale: आज्ञार्थक रूप को बदले बिना निकटवर्ती शर्त और अंतिम निषेध उसके न्यायिक, न कि अनुमोदनात्मक, आशय को सामने रखते हैं।
- issue: कठिन मध्यवर्ती वाक्य-विन्यास
  choice: ‘यदि इसके बाद भी तुम मेरी नहीं सुनोगे’ को पहली आज्ञा से जोड़ा गया है।
  alternative: इसे अगले वाक्य से जोड़ना, अथवा ‘बाद में भी जाकर उपासना करो’ समझना।
  rationale: इब्रानी वाक्य-विन्यास असामान्य है; मुख्य पाठ एक सम्भव संबंध देता है, जबकि पादटिप्पणी दूसरे विराम-विन्यास की वास्तविक सम्भावना सुरक्षित रखती है।
- issue: अंतिम क्रिया का बल
  choice: 'दृढ़ भविष्यात्मक निषेध: ‘अपवित्र नहीं करोगे।’'
  alternative: 'सीधा आज्ञार्थक निषेध: ‘अपवित्र मत करो।’'
  rationale: अपूर्ण क्रिया भविष्य की घोषणा और निषेध दोनों का भाव दे सकती है; चुना हुआ रूप भविष्यात्मक न्यायिक दृढ़ता बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सार्वजनिक पाठ के योग्य रखी गई है। ‘इस्राएल के घराने’, ‘भेंटों’ और ‘पवित्र नाम’ जैसे बाइबलीय पद बनाए रखते हुए वाक्य को सामान्य हिन्दी पाठक के लिए सहज रखा गया है।
