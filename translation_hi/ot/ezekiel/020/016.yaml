source:
  edition: WLC
  text: יַ֜עַן בְּ/מִשְׁפָּטַ֣/י מָאָ֗סוּ וְ/אֶת חֻקּוֹתַ/י֙ לֹא הָלְכ֣וּ בָ/הֶ֔ם וְ/אֶת שַׁבְּתוֹתַ֖/י חִלֵּ֑לוּ כִּ֛י אַחֲרֵ֥י גִלּוּלֵי/הֶ֖ם לִבָּ֥/ם הֹלֵֽךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/020/016.yaml
  text: because they rejected my judgments[a], and did not walk in my statutes, and profaned my Sabbaths; for their heart went after their idols.
translation:
  language: hi
  text: क्योंकि उन्होंने मेरे न्याय-विधानों को ठुकरा दिया, मेरी विधियों का पालन नहीं किया और मेरे विश्राम-दिनों को अपवित्र किया; क्योंकि उनका हृदय अपनी मूर्तियों[a] के पीछे चलता रहा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ ‘मूर्तियों’ के लिए प्रयुक्त इब्रानी शब्द גִלּוּלִים तिरस्कारसूचक है; इसमें ‘घिनौनी’ या संभवतः ‘गोबर-जैसी मूर्तियाँ’ का भाव हो सकता है।
    reason: मूल इब्रानी शब्द का तीखा अपमानसूचक अर्थ सामान्य हिन्दी शब्द ‘मूर्तियाँ’ में पूरी तरह प्रकट नहीं होता।
lexical_decisions:
- source_word: יַעַן
  choice: क्योंकि
  rationale: यह पिछले संदर्भ में बताए गए दण्ड का कारण प्रस्तुत करता है; आधुनिक हिन्दी में यह स्वाभाविक कारणसूचक संयोजक है।
- source_word: מִשְׁפָּטַי
  choice: मेरे न्याय-विधान
  rationale: यह चुनाव पद के न्यायिक और विधिक भाव को बनाए रखता है तथा חֻקּוֹתַי के लिए प्रयुक्त ‘विधियों’ से भेद भी स्पष्ट करता है।
- source_word: מָאָסוּ
  choice: ठुकरा दिया
  rationale: यह केवल उपेक्षा नहीं, बल्कि सक्रिय अस्वीकार का भाव सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: חֻקּוֹתַי
  choice: मेरी विधियाँ
  rationale: यह परमेश्वर द्वारा ठहराए गए नियमों का भाव देता है और מִשְׁפָּטַי से शब्दगत भेद बनाए रखता है।
- source_word: לֹא הָלְכוּ בָהֶם
  choice: उन पर नहीं चले
  rationale: यह आचरण के लिए प्रयुक्त इब्रानी ‘चलने’ के रूपक को हिन्दी में समझने योग्य ढंग से सुरक्षित रखता है।
- source_word: שַׁבְּתוֹתַי
  choice: मेरे विश्राम-दिन
  rationale: यह इब्रानी बहुवचन को बनाए रखता है और सामान्य हिन्दी पाठक के लिए ‘सब्तों’ की अपेक्षा अधिक स्पष्ट है।
- source_word: חִלֵּלוּ
  choice: अपवित्र किया
  rationale: यह पवित्र वस्तु या समय को साधारण अथवा अशुद्ध ठहराने के वाचा-संबंधी भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: גִלּוּלֵיהֶם
  choice: अपनी मूर्तियाँ
  rationale: मुख्य पाठ में ‘मूर्तियाँ’ स्पष्ट और पठनीय है; मूल शब्द का तीखा तिरस्कारसूचक भाव पाद-टिप्पणी में सुरक्षित किया गया है।
- source_word: לִבָּם הֹלֵךְ אַחֲרֵי
  choice: उनका हृदय ... के पीछे चलता रहा
  rationale: यह एकवचन ‘हृदय’, पीछे चलने के रूपक और कृदन्त से सूचित निरंतर झुकाव—तीनों को बनाए रखता है।
theological_decisions:
- issue: वाचा-संबंधी व्यवस्था के दो पदों में भेद
  choice: מִשְׁפָּטַי के लिए ‘न्याय-विधान’ और חֻקּוֹתַי के लिए ‘विधियाँ’
  alternative: दोनों के लिए व्यापक शब्द ‘नियम’ या ‘व्यवस्थाएँ’
  rationale: मूल पाठ दो अलग विधिक शब्दों का प्रयोग करता है; उन्हें अलग रखना वाचा की भाषा की बनावट को सपाट होने से बचाता है।
- issue: לִבָּם הֹלֵךְ में हृदय और चलने का रूपक
  choice: उनका हृदय अपनी मूर्तियों के पीछे चलता रहा
  alternative: वे अपनी मूर्तियों के प्रति समर्पित थे
  rationale: चुना हुआ पाठ मूर्तिपूजा को मनुष्य के भीतरी नैतिक-आध्यात्मिक केंद्र से जोड़ने वाला मूल रूपक बनाए रखता है और निरंतर झुकाव को अनावश्यक व्याख्या के बिना व्यक्त करता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। ‘हृदय ... के पीछे चलता रहा’ जानबूझकर कुछ बाइबलीय रूपकात्मकता बनाए रखता है। पाद-टिप्पणी का चिह्न संबंधित शब्द ‘मूर्तियों’ के तुरंत बाद रखा गया है।
