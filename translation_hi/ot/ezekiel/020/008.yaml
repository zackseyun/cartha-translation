base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/020/008.yaml
  text: But they rebelled against me and refused to listen to me. None of them cast away the detestable things before their eyes[a] or abandoned the idols[b] of Egypt. So I said that I would pour out my wrath on them, bringing my anger against them to its full measure in the midst of the land of Egypt.
translation:
  language: hi
  text: परन्तु उन्होंने मेरे विरुद्ध विद्रोह किया और मेरी सुनने से इनकार कर दिया। उनमें से किसी ने भी उनकी आँखों के सामने की घृणित वस्तुओं[a] को नहीं फेंका और न मिस्र की मूर्तियों[b] को छोड़ा। तब मैंने कहा कि मैं मिस्र देश के भीतर उन पर अपना प्रकोप उण्डेलूँगा और उनके विरुद्ध अपने क्रोध को पूरी तरह कार्यान्वित करूँगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उनकी आँखों की घृणित वस्तुएँ।” इब्रानी पद आँखों के सामने की घृणित वस्तुओं को सूचित कर सकता है और उन पर टिकी उनकी मूर्तिपूजक दृष्टि का संकेत भी दे सकता है।
    reason: alternative_reading
  - marker: b
    text: यहाँ “मूर्तियों” के लिए प्रयुक्त इब्रानी शब्द जानबूझकर तिरस्कारपूर्ण है और किसी गन्दी या घिनौनी वस्तु का भाव दे सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּמְרוּ בִי
  choice: उन्होंने मेरे विरुद्ध विद्रोह किया
  rationale: מָרָה के साथ ב किसी व्यक्ति के विरुद्ध जानबूझकर विद्रोह या अवज्ञा व्यक्त करता है; यह हिन्दी प्रयोग अर्थ की तीव्रता बनाए रखता है।
- source_word: וְלֹא אָבוּ לִשְׁמֹעַ אֵלַי
  choice: मेरी सुनने से इनकार कर दिया
  rationale: नकारात्मक इच्छार्थक अभिव्यक्ति केवल न सुनने को नहीं, बल्कि जानबूझकर सुनने से मना करने को दर्शाती है।
- source_word: אִישׁ
  choice: उनमें से किसी ने भी
  rationale: यहाँ एकवचन संज्ञा पूरे समूह में प्रत्येक व्यक्ति के लिए वितरणात्मक रूप से प्रयुक्त है; यह हिन्दी में स्वाभाविक और समावेशी ढंग से उसका बल व्यक्त करती है।
- source_word: שִׁקּוּצֵי עֵינֵיהֶם
  choice: अपनी आँखों के सामने की घृणित वस्तुओं
  rationale: संरचना आँखों के सामने उपस्थित घृणित वस्तुओं को सूचित कर सकती है और उन पर लगी हुई मूर्तिपूजक दृष्टि का संकेत भी दे सकती है; मुख्य पाठ जानबूझकर संयत रखा गया है और अस्पष्टता टिप्पणी में दी गई है।
- source_word: הִשְׁלִיכוּ
  choice: नहीं फेंका
  rationale: क्रिया इन घृणित वस्तुओं को दूर फेंकने और अस्वीकार करने की ठोस छवि देती है।
- source_word: גִּלּוּלֵי מִצְרַיִם
  choice: मिस्र की मूरतों
  rationale: גִּלּוּלִים यहेजकेल का मूर्तियों के लिए तिरस्कारपूर्ण शब्द है। ‘मूरतों’ से मुख्य आशय स्पष्ट रहता है और तिरस्कारपूर्ण अर्थ टिप्पणी में सुरक्षित है।
- source_word: וָאֹמַר
  choice: तब मैंने कहा कि मैं
  rationale: वाव-क्रमागत कथा को आगे बढ़ाता है और यहाँ परमेश्वर के न्याय-संकल्प का परिचय देता है।
- source_word: לִשְׁפֹּךְ חֲמָתִי עֲלֵיהֶם
  choice: उन पर अपना प्रकोप उण्डेलूँगा
  rationale: ‘प्रकोप उण्डेलना’ मूल रूपक की तीव्रता और न्यायात्मक अर्थ को स्वाभाविक, गरिमापूर्ण हिन्दी में बनाए रखता है।
- source_word: לְכַלּוֹת אַפִּי בָּהֶם
  choice: उनके विरुद्ध अपने क्रोध को पूरी तरह भड़का दूँगा
  rationale: כּלה क्रोध को उनके विरुद्ध पूर्ण सीमा तक कार्यान्वित करने का भाव देता है। यह अनुवाद पूर्णता को बनाए रखता है, यद्यपि इसे केवल भावनात्मक विस्फोट न मानकर न्याय के पूर्ण क्रियान्वयन के रूप में पढ़ना चाहिए।
- source_word: בְּתוֹךְ אֶרֶץ מִצְרָיִם
  choice: मिस्र देश के बीच ही
  rationale: בְּתוֹךְ उस देश के भीतर/बीच में होने पर बल देता है; ‘ही’ उस स्थानगत बल को स्वाभाविक हिन्दी में उभारता है।
theological_decisions:
- issue: ईश्वरीय न्याय के लिए मानवीय भाव-सदृश भाषा
  choice: ‘प्रकोप’ और ‘क्रोध’ दोनों को अलग किंतु सम्बद्ध अभिव्यक्तियों के रूप में रखा गया
  alternative: दोनों को केवल ‘क्रोध’ करना अथवा उन्हें नरम करके ‘दण्ड’ कहना
  rationale: मूल पाठ חֵמָה और אַף दोनों का निकट प्रयोग करके न्याय की तीव्रता बढ़ाता है। दोनों को बनाए रखने से मूर्तिपूजा के प्रति परमेश्वर का पवित्र विरोध कम नहीं होता और पाठ से परे कोई व्यवस्थित भेद भी आरोपित नहीं होता।
- issue: אִישׁ का वितरणात्मक प्रतिनिधि बल
  choice: ‘उनमें से किसी ने भी’
  alternative: ‘किसी पुरुष ने नहीं’ या ‘एक ने भी नहीं’
  rationale: व्याकरणिक रूप पुल्लिंग एकवचन है, पर सन्दर्भ में पूरे विद्रोही समुदाय के प्रत्येक सदस्य को वितरणात्मक रूप से दर्शाता है; हिन्दी चयन इसी वास्तविक अर्थ को स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
- issue: लְכַלּוֹת אַפִּי में क्रोध की पूर्णता
  choice: क्रोध को उनके विरुद्ध पूरी तरह कार्यान्वित करने का अर्थ रखा गया
  alternative: केवल ‘क्रोध निकालना’ या ‘क्रोध समाप्त करना’
  rationale: पद न्यायात्मक क्रोध को लक्ष्य पर पूर्ण सीमा तक पहुँचाने की बात करता है; इसे मात्र भावनात्मक निकास या परमेश्वर के भीतर क्रोध समाप्त होने के रूप में सीमित करना उचित नहीं।
