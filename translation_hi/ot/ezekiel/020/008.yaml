  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सामान्य पाठकों के लिए सुबोध रूप अपनाया गया है। ‘विद्रोह,’ ‘प्रकोप’ और ‘क्रोध’ जैसे परिचित बाइबलीय शब्द मूल की तीव्रता रखते हैं; कठिन इब्रानी वाक्यांशों की वास्तविक अस्पष्टता पादटिप्पणियों में सुरक्षित है।
