base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/020/038.yaml
  text: I will purge from among you the rebels and those who transgress against me[a]. I will bring them out of the land where they sojourn, but they will not enter the land of Israel[c][b]. Then you will know that I am Yahweh.
translation:
  language: hi
  text: मैं तुम्हारे बीच से विद्रोहियों और मेरे विरुद्ध अपराध करनेवालों को छाँटकर निकाल दूँगा।[a] मैं उन्हें उस देश से बाहर निकाल लाऊँगा जहाँ वे परदेशी होकर रहते हैं,[b] पर वे इस्राएल की भूमि में प्रवेश नहीं करेंगे।[c] तब तुम जानोगे कि मैं याहवे हूँ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अलग करके निकाल दूँगा।” हिब्रू क्रिया में समुदाय के भीतर से अयोग्य लोगों को छाँटकर अलग करने का भाव है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “उनके परदेशवास के देश से।”
    reason: lexical_alternative
  - marker: c
    text: हिब्रू में क्रिया एकवचन है—“वह प्रवेश नहीं करेगा”—जो यहाँ समूह के प्रत्येक सदस्य के लिए वितरणात्मक अर्थ में प्रयुक्त हुई है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָרוֹתִי
  choice: छाँटकर निकाल दूँगा
  rationale: क्रिया यहाँ समूह के भीतर से अनुपयुक्त लोगों को अलग करके हटाने का भाव देती है। यह हिन्दी में स्वाभाविक रहते हुए न्यायपूर्ण पृथक्करण की छवि बनाए रखती है।
- source_word: מִכֶּם
  choice: तुम्हारे बीच से
  rationale: 'מן के पृथक्करण-सूचक अर्थ को स्पष्ट करता है: उन्हें केवल तुमसे दूर नहीं, बल्कि समुदाय के भीतर से निकाला जाएगा।'
- source_word: הַמֹּרְדִים
  choice: विद्रोहियों
  rationale: कर्तृवाचक कृदन्त का संज्ञात्मक प्रयोग है और लगातार विद्रोही आचरण का भाव रखता है।
- source_word: וְהַפּוֹשְׁעִים בִּי
  choice: मेरे विरुद्ध अपराध करनेवालों
  rationale: पשע के गंभीर उल्लंघन/द्रोह के भाव को व्यक्त करता है, जबकि निकटवर्ती מרד से शब्दगत भेद भी बनाए रखता है; בִּי का व्यक्तिगत लक्ष्य ‘मेरे विरुद्ध’ में सुरक्षित है।
- source_word: מֵאֶרֶץ מְגוּרֵיהֶם
  choice: उस देश से जहाँ वे परदेशी होकर रहते हैं
  rationale: מָגוּר के अस्थायी या परदेशी निवास के भाव को केवल ‘रहते हैं’ की अपेक्षा अधिक स्पष्ट रूप से व्यक्त करता है।
- source_word: אוֹצִיא אוֹתָם
  choice: मैं उन्हें ... बाहर निकाल लाऊँगा
  rationale: יצא के हिफ़ईल रूप का कारणवाचक अर्थ—बाहर लाना/निकालना—सुरक्षित रहता है।
- source_word: וְאֶל אַדְמַת יִשְׂרָאֵל
  choice: इस्राएल की भूमि में
  rationale: אַדְמָה का मूल अर्थ मिट्टी/भूमि है, पर यहाँ यह भू-क्षेत्र का स्वाभाविक पद है।
- source_word: לֹא יָבוֹא
  choice: वे ... प्रवेश नहीं करेंगे
  rationale: हिब्रू क्रिया व्याकरणतः एकवचन है, पर पूर्ववर्ती बहुवचन समूह के प्रत्येक सदस्य पर सामूहिक/वितरणात्मक रूप से लागू होती है; हिन्दी में बहुवचन स्वाभाविक है।
- source_word: וִידַעְתֶּם
  choice: तब तुम जानोगे
  rationale: 'संयोजक का परिणामसूचक प्रवाह स्पष्ट करता है: इस न्याय के फलस्वरूप पहचान होगी।'
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिन्दी बाइबिलीय परंपरा में प्रचलित देवनागरी रूप द्वारा परमेश्वर के व्यक्तिगत वाचा-नाम को उपाधि से बदलने के बजाय नाम के रूप में रखा गया है।
theological_decisions:
- issue: वाचा-नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे / प्रभु
  rationale: मूल पाठ में व्यक्तिगत दिव्य नाम है। ‘यहोवा’ आधुनिक हिन्दी पाठकों के लिए परिचित नामरूप है और इसे केवल ‘प्रभु’ जैसी उपाधि से प्रतिस्थापित नहीं करता।
- issue: וּבָרוֹתִי में न्याय की तीव्रता
  choice: छाँटकर निकाल दूँगा
  alternative: शुद्ध कर दूँगा / अलग कर दूँगा
  rationale: यह चयन समुदाय के भीतर से विद्रोहियों को अलग करके हटाने का न्यायिक भाव बनाए रखता है, पर ‘शुद्ध कर दूँगा’ से उत्पन्न संभावित नैतिक रूपांतरण के अतिरिक्त अर्थ को नहीं जोड़ता।
- issue: לֹא יָבוֹא का वचन-सामंजस्य
  choice: वे प्रवेश नहीं करेंगे
  alternative: वह प्रवेश नहीं करेगा
  rationale: एकवचन क्रिया को समूह के प्रत्येक व्यक्ति पर लागू वितरणात्मक प्रयोग माना गया है। हिन्दी में बहुवचन पूर्वपद के साथ बहुवचन अनुवाद अर्थ को स्पष्ट करता है, जबकि पाठगत विशेषता पादटिप्पणी में बताई गई है।
