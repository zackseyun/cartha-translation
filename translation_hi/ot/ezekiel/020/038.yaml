  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य हिन्दी पाठक के लिए सुबोध रखी गई है। ‘छाँटकर निकाल दूँगा’ मूल की पृथक्करण-छवि और न्याय की गंभीरता दोनों बचाता है। ‘परदेशी होकर रहते हैं’ निर्वासन/अस्थायी निवास की छाया बनाए रखता है। सभी पादटिप्पणी-चिह्न संबंधित वाक्यांशों के तुरंत बाद दिए गए हैं।
