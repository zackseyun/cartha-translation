id: EZK.20.43
reference: Ezekiel 20:43
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וּ/זְכַרְתֶּם שָׁ֗ם אֶת דַּרְכֵי/כֶם֙ וְ/אֵת֙ כָּל עֲלִיל֣וֹתֵי/כֶ֔ם אֲשֶׁ֥ר נִטְמֵאתֶ֖ם בָּ֑/ם וּ/נְקֹֽטֹתֶם֙ בִּ/פְנֵי/כֶ֔ם בְּ/כָל רָעוֹתֵי/כֶ֖ם אֲשֶׁ֥ר עֲשִׂיתֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/020/043.yaml
  text: There you will remember your ways and all your deeds by which you defiled yourselves[b][a], and you will loathe yourselves in your own sight for all the evils that you have done.
translation:
  language: hi
  text: वहाँ तुम अपने चालचलन और अपने उन सब कामों को याद करोगे, जिनसे तुम अशुद्ध हुए थे; और अपने किए हुए सभी बुरे कामों के कारण तुम्हें अपने आप से घृणा होगी।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּזְכַרְתֶּם
  choice: तुम ... याद करोगे
  rationale: संदर्भ में संयोजक वाव के साथ पूर्ण रूप भविष्य की भविष्यवाणी व्यक्त करता है; ‘याद करोगे’ आधुनिक हिन्दी में स्वाभाविक है।
- source_word: שָׁם
  choice: वहाँ
  rationale: यह पिछले संदर्भ में बताए गए पुनर्स्थापन के स्थान की ओर संकेत करता है।
- source_word: דַּרְכֵיכֶם
  choice: अपने चालचलन
  rationale: नैतिक संदर्भ में דֶּרֶךְ जीवन-व्यवहार को दर्शाता है; ‘चालचलन’ हिन्दी में इस अर्थ को स्पष्ट रखता है।
- source_word: עֲלִילוֹתֵיכֶם
  choice: अपने उन सब कामों
  rationale: यह संज्ञा किए गए कार्यों को सूचित करती है; ‘कामों’ से सामान्य पाठक के लिए अर्थ सहज रहता है और चालचलन से भेद भी बना रहता है।
- source_word: אֲשֶׁר נִטְמֵאתֶם בָּם
  choice: जिनसे तुम अशुद्ध हुए थे
  rationale: निफ़अल रूप का सीधा अर्थ ‘अशुद्ध होना’ है और ב साधन अथवा क्षेत्र बता सकता है। यह अनुवाद मूल की व्याकरणिक अस्पष्टता को अनावश्यक रूप से आत्म-कारक नहीं बनाता।
- source_word: וּנְקֹטֹתֶם
  choice: तुम्हें अपने आप से घृणा होगी
  rationale: קוט प्रबल आत्म-वितृष्णा या घृणा व्यक्त करता है; यह हिन्दी वाक्य उस तीव्रता को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: בִּפְנֵיכֶם
  choice: अपने आप से
  rationale: शाब्दिक अर्थ ‘अपने मुखों के सामने’ है, पर प्रसंग में यह स्वयं के प्रति घृणा को व्यक्त करता है; हिन्दी में ‘अपने आप से’ स्वाभाविक और स्पष्ट है।
- source_word: בְּכָל רָעוֹתֵיכֶם אֲשֶׁר עֲשִׂיתֶם
  choice: अपने किए हुए सभी बुरे कामों के कारण
  rationale: רָעוֹת यहाँ की गई बुराइयों को दर्शाता है; कारणसूचक ב को ‘के कारण’ से और relative clause को संक्षिप्त स्वाभाविक हिन्दी में व्यक्त किया गया है।
theological_decisions:
- issue: पुनर्स्थापन के बाद इस्राएल की प्रतिक्रिया का स्वरूप
  choice: बीते पापों को याद करके अपने प्रति गहरी घृणा
  alternative: केवल पछतावा या लज्जा
  rationale: קוט का प्रबल अर्थ और पापपूर्ण चालचलन के स्मरण का संदर्भ गहरी नैतिक वितृष्णा का समर्थन करते हैं; पद में इससे आगे कोई व्यवस्थित धर्मवैज्ञानिक श्रेणी नहीं जोड़ी गई।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण और सामान्य पाठकों के लिए स्पष्ट रूप। ‘चालचलन’ नैतिक जीवन-पद्धति को और ‘काम’ ठोस कृत्यों को दर्शाता है। मूल पाठ के अर्थ को मुख्य पाठ में स्पष्ट रूप से दिया गया है, इसलिए कोई पाद-टिप्पणी आवश्यक नहीं समझी गई।
