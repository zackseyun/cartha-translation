  yaml_path: translation/ot/ezekiel/020/035.yaml
  text: I will bring you into the wilderness of the peoples[b][a], and there I will enter into judgment with you face to face.
translation:
  language: hi
  text: मैं तुम्हें राष्ट्रों के निर्जन प्रदेश में ले आऊँगा[a], और वहाँ तुमसे आमने-सामने न्यायिक वाद करूँगा[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘राष्ट्रों का निर्जन प्रदेश’ उन राष्ट्रों के बीच किसी निर्जन प्रदेश-जैसे स्थान की ओर संकेत कर सकता है, जिनमें इस्राएल के लोग तितर-बितर हुए थे।
    reason: cultural_note
  - marker: b
    text: या, “वहाँ आमने-सामने तुम्हारा न्याय करूँगा।” इब्रानी क्रिया का अनुवाद केवल ‘न्याय करना’ भी हो सकता है, पर इस रचना में किसी के साथ न्यायिक वाद में प्रवेश करने का भाव भी है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֵבֵאתִי
  choice: मैं ... ले आऊँगा
  rationale: בוא के हिफ़ईल रूप का सीधा अर्थ ‘ले आना’ है; यह वक्ता की ओर या उसके ठहराए हुए स्थान तक पहुँचाने का भाव स्वाभाविक रूप से व्यक्त करता है।
- source_word: אֶתְכֶם
  choice: तुम्हें
  rationale: यह द्वितीय पुरुष पुल्लिंग बहुवचन कर्म-प्रत्यय है; हिन्दी में ‘तुम्हें’ स्वाभाविक सामूहिक संबोधन है।
- source_word: אֶל מִדְבַּר הָעַמִּים
  choice: जाति-जाति के लोगों के निर्जन प्रदेश में
  rationale: מִדְבָּר को केवल रेतीला ‘रेगिस्तान’ न मानकर असंस्कृत या निर्जन प्रदेश के व्यापक अर्थ में लिया गया है। הָעַמִּים बहुवचन ‘लोगों/जातियों’ को दर्शाता है; ‘जाति-जाति के लोग’ आधुनिक हिन्दी में विभिन्न राष्ट्र-समुदायों का बोध कराता है और इब्रानी पदबंध की असामान्यता भी कुछ हद तक बनाए रखता है।
- source_word: וְנִשְׁפַּטְתִּי אִתְּכֶם
  choice: तुमसे ... न्याय-विवाद करूँगा
  rationale: שׁפט के निफ़अल रूप के साथ אִתְּכֶם प्रत्यक्ष न्यायिक मुठभेड़ या वाद में उतरने का भाव दे सकता है। ‘न्याय-विवाद’ इस पारस्परिक/न्यायिक सूक्ष्मता को साधारण ‘न्याय करूँगा’ से अधिक स्पष्ट रखता है।
- source_word: שָׁם
  choice: वहाँ
  rationale: यह पहले बताए गए निर्जन प्रदेश की ओर संकेत करने वाला स्थानवाचक क्रियाविशेषण है।
- source_word: פָּנִים אֶל פָּנִים
  choice: आमने-सामने
  rationale: यह प्रचलित हिन्दी मुहावरा इब्रानी के शाब्दिक ‘मुख से मुख’ भाव को स्वाभाविक ढंग से व्यक्त करते हुए सीधी और व्यक्तिगत भेंट पर बल देता है।
theological_decisions:
- issue: परमेश्वर की न्यायिक कार्रवाई का स्वरूप
  choice: तुमसे ... न्याय-विवाद करूँगा
  alternative: वहाँ आमने-सामने तुम्हारा न्याय करूँगा
  rationale: इब्रानी निफ़अल रचना और साथ प्रयुक्त संबंधसूचक पद केवल निर्णय सुनाने के बजाय सीधे न्यायिक सामना या वाद में प्रवेश करने का संकेत दे सकते हैं। मुख्य पाठ इस तनाव को बनाए रखता है, जबकि पादटिप्पणी सरल वैकल्पिक अनुवाद देती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य रखी गई है। ‘निर्जन प्रदेश’ मִדְבָּר के व्यापक अर्थ और निर्गमन-संबंधी प्रतिध्वनि को ‘रेगिस्तान’ से बेहतर सुरक्षित रखता है। ‘न्याय-विवाद’ कुछ औपचारिक है, पर पद की विधिक और प्रत्यक्ष मुठभेड़ वाली सूक्ष्मता के कारण जानबूझकर चुना गया है।
