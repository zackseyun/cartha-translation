  rationale: ‘जाति-जाति के लोगों’ को ‘राष्ट्रों’ से बदला गया है ताकि הָעַמִּים का संदर्भानुकूल अर्थ स्पष्ट और आधुनिक हिन्दी में स्वाभाविक हो। ‘न्याय-विवाद’ को ‘न्यायिक वाद’ किया गया है, जिससे प्रत्यक्ष न्यायिक कार्रवाई का भाव बना रहे और सामान्य वाद-विवाद का संकेत कम हो। पादटिप्पणियों के चिह्न और उनके पाठ-संबंध सुरक्षित रखे गए हैं।
