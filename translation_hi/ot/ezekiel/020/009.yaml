base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/020/009.yaml
  text: But I acted for the sake of my name[a], so that it should not be profaned in the sight of the nations among whom they were[c][b], to whom I had made myself known in their sight by bringing them out of the land of Egypt.
translation:
  language: hi
  text: परन्तु मैंने अपने नाम के निमित्त[a] कार्य किया, ताकि वह उन जातियों की दृष्टि में अपवित्र न ठहरे[b], जिनके बीच वे थे और जिनके देखते-देखते मैंने उन्हें मिस्र देश से निकालकर अपने आपको प्रकट किया था[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अपने नाम के लिए।”
    reason: lexical_alternative
  - marker: b
    text: या, “ताकि मैं अपने नाम को जातियों की दृष्टि में अपवित्र न करूँ।”
    reason: grammatical_ambiguity
  - marker: c
    text: या, “जिनके सम्मुख मैंने उन्हें मिस्र देश से निकालते समय अपने आपको प्रकट किया था।”
    reason: lexical_and_syntactic_alternative
lexical_decisions:
- source_word: וָאַעַשׂ
  choice: परन्तु मैंने ... ऐसा किया
  rationale: עשה का व्यापक अर्थ ‘करना’ है; पिछले पद में वर्णित विद्रोह के विपरीत परमेश्वर की निर्णायक कार्रवाई दिखाने के लिए संयोजक को विरोधसूचक ‘परन्तु’ और क्रिया को स्वाभाविक हिन्दी में ‘ऐसा किया’ कहा गया है।
- source_word: לְמַעַן שְׁמִי
  choice: अपने नाम के लिए
  rationale: यह परमेश्वर के नाम से जुड़े सार्वजनिक सम्मान और प्रकट चरित्र के कारण कार्य करने का हिब्रानी मुहावरा है। ‘अपने नाम के लिए’ इसे संक्षिप्त और स्पष्ट रखता है।
- source_word: לְבִלְתִּי הֵחֵל
  choice: ताकि वह ... अपवित्र न ठहरे
  rationale: חלל यहाँ परमेश्वर के नाम को साधारण या अनादृत ठहराए जाने का भाव देता है। निष्क्रिय/परिणामसूचक अर्थ बनाए रखने के लिए ‘अपवित्र न ठहरे’ चुना गया है।
- source_word: לְעֵינֵי הַגּוֹיִם
  choice: जातियों की दृष्टि में
  rationale: यह सार्वजनिक दृश्यता का संकेत देता है; ‘दृष्टि में’ मूल की नेत्र-संबंधी अभिव्यक्ति को स्वाभाविक हिन्दी में बचाता है।
- source_word: הַגּוֹיִם
  choice: जातियाँ
  rationale: यहाँ גוים इस्राएल से भिन्न राष्ट्रों/लोगों को सूचित करता है; ‘जातियाँ’ पारंपरिक बाइबिलीय और व्यापक पद है।
- source_word: אֲשֶׁר הֵמָּה בְתוֹכָם
  choice: जिनके बीच वे थे
  rationale: वाक्यांश को उसके संक्षिप्त अस्तित्वसूचक रूप में रखा गया है; ‘रहते थे’ अर्थ-स्पष्टीकरण होता, पर मूल में वह क्रिया व्यक्त नहीं है।
- source_word: אֲשֶׁר נוֹדַעְתִּי אֲלֵיהֶם
  choice: जिनके सामने मैंने अपने आपको उन पर प्रकट किया था
  rationale: נודעתי परमेश्वर के स्वयं को ज्ञात/प्रकट करने का भाव दे सकता है। ‘अपने आपको ... प्रकट किया’ आत्म-प्रकाशन को स्पष्ट करता है, जबकि ‘उन पर’ אֲלֵיהֶם को अलग बनाए रखता है।
- source_word: לְעֵינֵיהֶם
  choice: जिनके सामने
  rationale: दूसरी दृश्यता-संबंधी अभिव्यक्ति को ‘सामने’ से दिया गया है, जिससे सार्वजनिकता बनी रहती है और हिन्दी में अनावश्यक पुनरुक्ति नहीं होती।
- source_word: לְהוֹצִיאָם
  choice: जब मैं उन्हें ... निकालने वाला था
  rationale: לְהוֹצִיאָם उद्देश्यसूचक ‘उन्हें निकालने के लिए’ और निकट भविष्य/इरादे ‘निकालने वाला था’ दोनों का अवकाश देता है। यहाँ पूर्ववर्ती आत्म-प्रकाशन से उसका संबंध स्वाभाविक हिन्दी में दिखाया गया है और वैकल्पिक अर्थ पादटिप्पणी में रखा गया है।
- source_word: מֵאֶרֶץ מִצְרָיִם
  choice: मिस्र देश से
  rationale: यह मानक और सहज हिन्दी बाइबिलीय अभिव्यक्ति है।
theological_decisions:
- issue: परमेश्वर का अपने नाम के लिए कार्य करना
  choice: इसे परमेश्वर के प्रकट नाम और सार्वजनिक सम्मान की चिंता व्यक्त करने वाले मूल मुहावरे के रूप में रखा गया है।
  alternative: इसे केवल अपनी प्रतिष्ठा बचाने की मानवीय प्रवृत्ति की तरह समझाना।
  rationale: यहेजकेल में परमेश्वर का ‘नाम’ उसके प्रकट चरित्र, पवित्रता और जातियों के बीच उसके सम्मान से जुड़ा है; अनुवाद मुहावरे को बिना व्याख्यात्मक विस्तार के सुरक्षित रखता है।
- issue: परमेश्वर के नाम के साथ חלל का अर्थ
  choice: अपवित्र न ठहरे
  alternative: अपवित्र न किया जाए; मैं अपने नाम को अपवित्र न करूँ
  rationale: हिब्रानी रचना रूप और कर्ता की दृष्टि से कुछ अस्पष्टता रखती है। मुख्य पाठ परिणामसूचक/निष्क्रिय अर्थ देता है; पादटिप्पणी अधिक सक्रिय व्याकरणिक संभावना सुरक्षित रखती है।
- issue: नודעתי और לְהוֹצִיאָם का संबंध
  choice: परमेश्वर ने स्वयं को जातियों के सामने इस्राएल पर प्रकट किया था, जब वह उन्हें निकालने वाला था।
  alternative: परमेश्वर ने उन्हें निकालने के लिए स्वयं को प्रकट किया; अथवा उन्हें निकालकर स्वयं को प्रकट किया।
  rationale: मूल infinitive उद्देश्य, अवसर या साधन का भाव ग्रहण कर सकता है। मुख्य पाठ काल-संदर्भ देता है और पादटिप्पणी उद्देश्यसूचक विकल्प रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण बाइबिलीय शैली अपनाई गई है। ‘जातियाँ’, ‘अपवित्र’ और ‘मिस्र देश’ जैसे परिचित धर्मग्रंथीय पद रखे गए हैं, पर वाक्य-विन्यास को सामान्य पाठक के लिए प्रवाहपूर्ण बनाया गया है।
