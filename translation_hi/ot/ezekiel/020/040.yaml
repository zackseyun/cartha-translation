source:
  edition: WLC
  text: כִּ֣י בְ/הַר קָדְשִׁ֞/י בְּ/הַ֣ר מְר֣וֹם יִשְׂרָאֵ֗ל נְאֻם֙ אֲדֹנָ֣/י יְהוִ֔ה שָׁ֣ם יַעַבְדֻ֜/נִי כָּל בֵּ֧ית יִשְׂרָאֵ֛ל כֻּלֹּ֖/ה בָּ/אָ֑רֶץ שָׁ֣ם אֶרְצֵ֔/ם וְ/שָׁ֞ם אֶדְר֣וֹשׁ אֶת תְּרוּמֹֽתֵי/כֶ֗ם וְ/אֶת רֵאשִׁ֛ית מַשְׂאוֹתֵי/כֶ֖ם בְּ/כָל קָדְשֵׁי/כֶֽם־׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/020/040.yaml
  text: For on my holy mountain[a], on the high mountain of Israel, declares the Lord GOD, there all the house of Israel, all of them in the land, will serve me. There I will accept them, and there I will require your contributions and the firstfruits of your offerings[c][b], with all your holy things.
translation:
  language: hi
  text: क्योंकि मेरे पवित्र पर्वत पर, इस्राएल के ऊँचे पर्वत पर—प्रभु यहोवा की यह वाणी है—वहाँ इस्राएल का सारा घराना, सब-के-सब, उस देश में मेरी सेवा करेंगे। वहाँ मैं उन्हें ग्रहण करूँगा, और वहीं मैं तुम्हारी अर्पित भेंटें और तुम्हारी चढ़ाई हुई भेंटों का पहला भाग, तुम्हारी सभी पवित्र वस्तुओं समेत, माँगूँगा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְהַר קָדְשִׁי
  choice: मेरे पवित्र पर्वत पर
  rationale: בְ यहाँ स्थानसूचक है; पर्वत पर आराधना के प्रसंग में ‘पर’ स्वाभाविक और सटीक है।
- source_word: בְהַר מְרוֹם יִשְׂרָאֵל
  choice: इस्राएल के ऊँचे पर्वत पर
  rationale: מְרוֹם ऊँचाई को व्यक्त करता है और यह अनुवाद पहले पदबंध के साथ समानांतरता बनाए रखता है।
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: प्रभु यहोवा की यह वाणी है
  rationale: נְאֻם के भविष्यद्वाणी-सूत्र को स्वाभाविक हिन्दी में व्यक्त करते हुए יהוה के व्यक्तिगत वाचा-नाम को ‘यहोवा’ रखा गया है।
- source_word: יַעַבְדֻנִי
  choice: मेरी सेवा करेंगे
  rationale: עבד में सेवा और आराधना दोनों का भाव हो सकता है; ‘सेवा’ इसकी व्यापकता तथा आगे के उपासना-संबंधी प्रसंग को बनाए रखती है।
- source_word: כָּל בֵּית יִשְׂרָאֵל כֻּלֹּה
  choice: इस्राएल का सारा घराना, वे सभी के सभी
  rationale: मूल के दोहरे समग्रताबोधक बल को हिन्दी में स्पष्ट रूप से सुरक्षित रखा गया है।
- source_word: בָּאָרֶץ
  choice: उस देश में
  rationale: इकाई इस्राएल की भूमि की ओर संकेत करती है; ‘उस देश में’ हिन्दी में स्वाभाविक है और निश्चित भौगोलिक संदर्भ रखता है।
- source_word: אֶרְצֵם
  choice: मैं उन्हें ग्रहण करूँगा
  rationale: רצה यहाँ लोगों को अनुग्रहपूर्वक स्वीकार करने का भाव देता है; ‘ग्रहण’ धार्मिक प्रसंग में गरिमापूर्ण और सहज है।
- source_word: אֶדְרוֹשׁ
  choice: मैं ... माँगूँगा
  rationale: דרש यहाँ देय भेंटों की अपेक्षा या माँग को सूचित करता है; ‘माँगूँगा’ ‘ढूँढ़ूँगा’ से अधिक प्रसंगानुकूल और ‘दावा करूँगा’ से कम कठोर है।
- source_word: תְּרוּמֹתֵיכֶם
  choice: तुम्हारी अर्पित भेंटें
  rationale: תְּרוּמָה परमेश्वर के लिए अलग करके प्रस्तुत अंश या भेंट है; ‘अर्पित भेंटें’ तकनीकी संकीर्णता के बिना यह भाव देता है।
- source_word: רֵאשִׁית מַשְׂאוֹתֵיכֶם
  choice: तुम्हारी चढ़ाई हुई भेंटों का पहला भाग
  rationale: רֵאשִׁית का मूल अर्थ ‘पहला/आरम्भिक भाग’ है, जबकि מַשְׂאוֹת उठाकर लाई या चढ़ाई गई भेंटों को सूचित कर सकता है। यह अनुवाद ‘पहली उपज’ का अनावश्यक कृषि-विशेषीकरण नहीं करता।
- source_word: בְּכָל קָדְשֵׁיכֶם
  choice: तुम्हारी सभी पवित्र वस्तुएँ
  rationale: קָדְשֵׁיכֶם व्यापक पद है, जो समर्पित पवित्र वस्तुओं को समेटता है; इसे केवल बलिदानी भेंटों तक सीमित नहीं किया गया।
theological_decisions:
- issue: אֲדֹנָי יְהוִה में दिव्य नाम का अनुवाद
  choice: प्रभु यहोवा
  alternative: प्रभु परमेश्वर
  rationale: मूल में वाचा का व्यक्तिगत नाम יהוה स्पष्ट रूप से उपस्थित है; ‘यहोवा’ उसे सामान्य उपाधि में विलीन किए बिना हिन्दी बाइबलीय प्रयोग में पहचानने योग्य रूप में रखता है।
- issue: יַעַבְדֻנִי में सेवा और आराधना का संबंध
  choice: मेरी सेवा करेंगे
  alternative: मेरी आराधना करेंगे
  rationale: ‘सेवा’ मूल क्रिया की व्यापक अर्थ-सीमा को सुरक्षित रखती है; निकटवर्ती भेंट-संबंधी भाषा से आराधनात्मक पहलू स्वतः स्पष्ट होता है।
- issue: אֶרְצֵם में लोगों की स्वीकृति
  choice: मैं उन्हें ग्रहण करूँगा
  alternative: मैं उनसे प्रसन्न होऊँगा
  rationale: क्रिया अनुकूल स्वीकृति और प्रसन्नता दोनों का भाव रख सकती है। प्रत्यक्ष कर्म ‘उन्हें’ के कारण ‘ग्रहण करूँगा’ वाक्य-संरचना के अधिक निकट है, जबकि वैकल्पिक अर्थ टिप्पणी में सुरक्षित है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सहज धार्मिक गद्य। मूल की पुनरुक्ति और भविष्यद्वाणी-सूत्र को बनाए रखा गया है। भेंट-संबंधी शब्दावली को अत्यधिक तकनीकी बनाए बिना विभिन्न इब्रानी पदों का अंतर यथासंभव सुरक्षित रखा गया है।
