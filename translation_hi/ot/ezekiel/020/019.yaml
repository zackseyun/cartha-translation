    text: या, “मेरे नियम।”
    reason: מִשְׁפָּטַי न्यायिक निर्णयों/विधानों के साथ-साथ बाध्यकारी नियमों को भी सूचित कर सकता है।
  revision_rationale: Revision preserves the Hebrew syntax and all principal lexical distinctions while improving modern Hindi idiom. “के अनुसार चलो” naturally conveys walking in the statutes; “मानो और उन पर अमल करो” maintains the deliberate twofold command to observe and actually carry out Yahweh’s judgments. The divine name remains transliterated as “याहवे,” in accordance with the source and audit trail.
