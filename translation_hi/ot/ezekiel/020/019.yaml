  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: אֲנִי֙ יְהוָ֣ה אֱלֹהֵי/כֶ֔ם בְּ/חֻקּוֹתַ֖/י לֵ֑כוּ וְ/אֶת מִשְׁפָּטַ֥/י שִׁמְר֖וּ וַ/עֲשׂ֥וּ אוֹתָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/020/019.yaml
  text: I am Yahweh your God; walk in my statutes[a], and keep my judgments and do them.
translation:
  language: hi
  text: मैं, याहवे, तुम्हारा परमेश्वर हूँ। मेरी विधियों के अनुसार चलो, मेरे न्याय-विधानों[a] को मानो और उन पर अमल करो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मेरे नियम।”
    reason: מִשְׁפָּטַי न्यायिक निर्णयों/विधानों के साथ-साथ बाध्यकारी नियमों को भी सूचित कर सकता है।
lexical_decisions:
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के वाचा-संबंधी व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय देवनागरी में लिप्यंतरित किया गया है।
- source_word: אֱלֹהֵיכֶם
  choice: तुम्हारा परमेश्वर
  rationale: यहाँ बहुवचन संबोधन-प्रत्यय के साथ אֱלֹהִים इस्राएल के परमेश्वर के लिए एकवचन अर्थ में प्रयुक्त है।
- source_word: בְּחֻקּוֹתַי לֵכוּ
  choice: मेरी विधियों पर चलो
  rationale: הלך के साथ בְּחֻקּוֹתַי जीवन और आचरण को परमेश्वर की ठहराई हुई विधियों के अनुसार चलाने का वाचा-संबंधी मुहावरा है; हिन्दी में ‘विधियों पर चलो’ इस चित्र और अर्थ दोनों को बनाए रखता है।
- source_word: מִשְׁפָּטַי
  choice: मेरे न्याय-विधानों
  rationale: מִשְׁפָּטִים में न्यायिक निर्णयों और बाध्यकारी नियमों, दोनों का भाव हो सकता है। ‘न्याय-विधान’ इसके न्यायिक पक्ष को सुरक्षित रखते हुए ‘विधियों’ से उसका भेद भी बनाए रखता है।
- source_word: שִׁמְרוּ
  choice: मानो
  rationale: वाचा और व्यवस्था के संदर्भ में שׁמר का अर्थ आदेशों को संभालकर रखना और उनका अनुपालन करना है; सहज हिन्दी में ‘मानो’ इस आशय को व्यक्त करता है।
- source_word: וַעֲשׂוּ אוֹתָם
  choice: और उनका पालन करो
  rationale: עשה वास्तविक रूप से आदेशों को करने पर बल देता है। ‘उनका पालन करो’ आधुनिक हिन्दी में स्वाभाविक है और केवल सुनने या स्वीकार करने से आगे सक्रिय अनुपालन व्यक्त करता है।
- source_word: אֲנִי
  choice: मैं ... हूँ
  rationale: स्वतंत्र सर्वनाम אֲנִי कथन को बल देता है; हिन्दी की नामवाचक रचना में ‘मैं ... हूँ’ स्वाभाविक रूप है।
theological_decisions:
- issue: वाचा के नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा
  rationale: मूल पाठ में चार अक्षरों वाला परमेश्वर का व्यक्तिगत नाम सीधे आया है। ‘याहवे’ उसे ‘प्रभु’ जैसी उपाधि से प्रतिस्थापित किए बिना प्रचलित विद्वत्तापूर्ण उच्चारण के अनुसार प्रस्तुत करता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और आज्ञात्मक शैली रखी गई है। ‘विधियों पर चलो’ मूल के वाचा-संबंधी रूपक को बनाए रखता है, जबकि ‘मानो और उनका पालन करो’ שׁמר तथा עשה की निकट, पर अलग, क्रियात्मक धाराओं को स्वाभाविक हिन्दी में व्यक्त करता है।
