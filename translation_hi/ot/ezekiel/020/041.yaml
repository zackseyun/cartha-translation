  text: בְּ/רֵ֣יחַ נִיחֹחַ֮ אֶרְצֶ֣ה אֶתְ/כֶם֒ בְּ/הוֹצִיאִ֤/י אֶתְ/כֶם֙ מִן הָ֣/עַמִּ֔ים וְ/קִבַּצְתִּ֣י אֶתְ/כֶ֔ם מִן הָ֣/אֲרָצ֔וֹת אֲשֶׁ֥ר נְפֹצֹתֶ֖ם בָּ֑/ם וְ/נִקְדַּשְׁתִּ֥י בָ/כֶ֖ם לְ/עֵינֵ֥י הַ/גּוֹיִֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/020/041.yaml
  text: I will accept you like a pleasing aroma when I bring you out from the peoples and gather you from the lands where you have been scattered, and I will show myself holy through you before the eyes of the nations.
translation:
  language: hi
  text: मैं तुम्हें सुखद सुगंध के समान स्वीकार करूँगा, जब मैं तुम्हें जातियों में से निकालूँगा और उन देशों में से इकट्ठा करूँगा जहाँ तुम तितर-बितर किए गए थे; और जातियों की आँखों के सामने तुम्हारे द्वारा अपनी पवित्रता प्रकट करूँगा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּרֵיחַ נִיחֹחַ
  choice: सुखदायक सुगंध के समान
  rationale: यह बलिदान-संबंधी हिब्रू अभिव्यक्ति है, जिसका भाव ऐसी सुगंध से है जो स्वीकार्य और प्रसन्न करने वाली हो। ‘के समान’ यहाँ व्यक्ति और सुगंध के बीच रूपक-संबंध को स्वाभाविक हिन्दी में स्पष्ट करता है।
- source_word: אֶרְצֶה אֶתְכֶם
  choice: मैं तुम्हें ... ग्रहण करूँगा
  rationale: רצה यहाँ अनुग्रहपूर्वक स्वीकार करने या प्रसन्न होकर ग्रहण करने का भाव देता है; ‘ग्रहण करूँगा’ प्रसंग के बलिदान-संबंधी स्वर को बनाए रखता है।
- source_word: נְפֹצֹתֶם
  choice: तुम तितर-बितर किए गए थे
  rationale: हिब्रू रूप निष्क्रिय है; यह अनुवाद उस निष्क्रियता को सुरक्षित रखता है और बिखराव के कर्ता को अनावश्यक रूप से निर्धारित नहीं करता।
- source_word: וְנִקְדַּשְׁתִּי בָכֶם
  choice: तुम्हारे द्वारा अपने को पवित्र प्रकट करूँगा
  rationale: हिब्रू में परमेश्वर के पवित्र ठहरने/पवित्र सिद्ध होने और בָכֶם के माध्यमात्मक या क्षेत्रगत संबंध का भाव है। यह चयन राष्ट्रों के सामने इस पवित्रता के प्रत्यक्ष होने तथा इस्राएल के माध्यम बनने—दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: בָכֶם में माध्यम (‘तुम्हारे द्वारा’) और क्षेत्र (‘तुम्हारे बीच/तुममें’) की संभावित अर्थ-छाया
  choice: तुम्हारे द्वारा
  alternative: तुम्हारे बीच
  rationale: निकटवर्ती वाक्यांश ‘जातियों की आँखों के सामने’ सार्वजनिक प्रदर्शन पर बल देता है, इसलिए ‘तुम्हारे द्वारा’ इस्राएल को परमेश्वर की पवित्रता प्रकट होने का माध्यम बताता है। फिर भी यह परमेश्वर की अंतर्निहित पवित्रता में वृद्धि का दावा नहीं करता; ‘पवित्र प्रकट करूँगा’ सार्वजनिक रूप से पवित्र सिद्ध होने का भाव देता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण और सामान्य पाठक के लिए सुबोध शैली। वाक्य-क्रम को हिन्दी में स्वाभाविक बनाने के लिए समयवाचक उपवाक्य पहले रखा गया है, जबकि मूल पाठ के कारण-क्रम और सभी प्रमुख अर्थ-घटकों को सुरक्षित रखा गया है।
