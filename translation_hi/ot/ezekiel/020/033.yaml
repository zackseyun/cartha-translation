base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/020/033.yaml
  text: As I live[a], declares the Lord GOD, surely with a strong hand and an outstretched arm and with wrath poured out, I will reign over you.
translation:
  language: hi
  text: “मेरे जीवन की शपथ,” प्रभु याहवे की घोषणा है, “मैं निश्चय ही शक्तिशाली हाथ, फैलाई हुई भुजा और उंडेले हुए प्रकोप के साथ तुम पर राज करूँगा[a]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “तुम पर शासन करूँगा” अथवा “तुम्हारा राजा बनूँगा।” इब्रानी क्रिया में राजकीय भाव है।
    reason: lexical_alternative
lexical_decisions:
- source_word: חַי אָנִי
  choice: मेरे जीवन की शपथ
  rationale: यह भविष्यद्वाणी में प्रयुक्त शपथ-सूत्र है। शाब्दिक ‘मैं जीवित हूँ’ की अपेक्षा यह हिन्दी में स्वाभाविक रूप से उसके गंभीर और सुनिश्चित भाव को व्यक्त करता है।
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: प्रभु याहवे की घोषणा है
  rationale: נְאֻם को भविष्यद्वाणी के औपचारिक कथन-सूत्र ‘की घोषणा है’ से व्यक्त किया गया है; אֲדֹנָי को ‘प्रभु’ और יהוה को उसके निज नाम ‘याहवे’ के रूप में रखा गया है।
- source_word: אִם לֹא
  choice: निश्चय ही
  rationale: शपथ के प्रसंग में यह शब्द-समूह वास्तविक शर्त नहीं, बल्कि कथन की प्रबल निश्चितता व्यक्त करता है।
- source_word: בְּיָד חֲזָקָה
  choice: बलवन्त हाथ
  rationale: यह अनुवाद सामर्थ्य का अर्थ और निर्गमन-संबंधी हाथ की मूल बिंबात्मक भाषा दोनों बनाए रखता है।
- source_word: וּבִזְרוֹעַ נְטוּיָה
  choice: बढ़ाई हुई भुजा
  rationale: यह परमेश्वर की सक्रिय सामर्थ्य का पारंपरिक शारीरिक बिंब सुरक्षित रखता है।
- source_word: וּבְחֵמָה שְׁפוּכָה
  choice: उंडेले गए प्रकोप के साथ
  rationale: ‘प्रकोप’ חֵמָה की तीव्रता व्यक्त करता है और ‘उंडेले गए’ मूल निष्क्रिय कृदन्त तथा उंडेलने के बिंब को बनाए रखता है।
- source_word: אֶמְלֹךְ עֲלֵיכֶם
  choice: तुम पर राज करूँगा
  rationale: מלך का राजकीय अर्थ स्पष्ट रखने के लिए ‘राज करना’ चुना गया है; केवल ‘शासन करना’ इस राजत्व-भाव को कुछ कम कर सकता है।
theological_decisions:
- issue: अदोनाय और परमेश्वर के निज नाम का संयुक्त पद אֲדֹנָי יְהוִה
  choice: प्रभु याहवे
  alternative: प्रभु परमेश्वर
  rationale: ‘प्रभु याहवे’ दोनों पदों का भेद बनाए रखता है और יהוה को सामान्य उपाधि में बदलने के बजाय निज नाम के रूप में प्रस्तुत करता है।
- issue: न्याय के माध्यम से राजत्व का दावा
  choice: तुम पर राज करूँगा
  alternative: तुम पर शासन करूँगा
  rationale: मूल क्रिया में राजा होकर राज करने का भाव है। यह शब्दावली परमेश्वर के राजत्व और यहाँ उपस्थित प्रकोपपूर्ण न्याय के तनाव को बिना नरम किए सुरक्षित रखती है।
translation_notes:
  register: भाषा आधुनिक, गंभीर और भविष्यद्वाणी के अनुरूप है। उद्धरण और डैश शपथ-सूत्र तथा घोषणा-सूत्र को स्पष्ट करते हैं। फुटनोट चिह्न को अंग्रेज़ी परामर्श-पाठ की असंगत जगह के बजाय उसी क्रिया के बाद रखा गया है जिसकी वैकल्पिक व्याख्याएँ फुटनोट में दी गई हैं।
