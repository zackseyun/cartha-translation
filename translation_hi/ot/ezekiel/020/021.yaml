  text: וַ/יַּמְרוּ בִ֣/י הַ/בָּנִ֗ים בְּ/חֻקּוֹתַ֣/י לֹֽא הָ֠לָכוּ וְ/אֶת מִשְׁפָּטַ֨/י לֹא שָׁמְר֜וּ לַ/עֲשׂ֣וֹת אוֹתָ֗/ם אֲשֶׁר֩ יַעֲשֶׂ֨ה אוֹתָ֤/ם הָֽ/אָדָם֙ וָ/חַ֣י בָּ/הֶ֔ם אֶת שַׁבְּתוֹתַ֖/י חִלֵּ֑לוּ וָ/אֹמַ֞ר לִ/שְׁפֹּ֧ךְ חֲמָתִ֣/י עֲלֵי/הֶ֗ם לְ/כַלּ֥וֹת אַפִּ֛/י בָּ֖/ם בַּ/מִּדְבָּֽר־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/020/021.yaml
  text: But the children rebelled against me[a]. They did not walk in my statutes, and they did not keep my judgments so as to do them—the judgments that, if a man does them, he will live by them. They profaned my Sabbaths. So I said I would pour out my wrath on them[b], to spend my anger against them in the wilderness.
translation:
  language: hi
  text: परन्तु उनकी सन्तान ने मेरे विरुद्ध विद्रोह किया। वे मेरी विधियों के अनुसार नहीं चले और उन्होंने मेरे न्याय-विधानों को नहीं माना कि उनका पालन करें—वे न्याय-विधान जिनका पालन यदि कोई मनुष्य करे, तो वह उनके कारण जीवित रहेगा।[a] उन्होंने मेरे विश्राम-दिनों को अपवित्र किया। तब मैंने कहा कि मैं अपना कोप उन पर उंडेल दूँगा और जंगल में उन पर अपना क्रोध पूरी तरह उतार दूँगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यह वाक्य लैव्यव्यवस्था 18:5 की प्रतिध्वनि है।
    reason: cross_reference
lexical_decisions:
- source_word: וַיַּמְרוּ בִי
  choice: मेरे विरुद्ध विद्रोह किया
  rationale: מָרָה के साथ בְּ परमेश्वर के विरुद्ध जान-बूझकर विद्रोह व्यक्त करता है; ‘विद्रोह किया’ केवल अवज्ञा से अधिक प्रबल वाचा-संबंधी अर्थ बनाए रखता है।
- source_word: הַבָּנִים
  choice: उनकी सन्तान
  rationale: शाब्दिक रूप ‘पुत्र’ है, पर सन्दर्भ में यह इस्राएल की अगली पीढ़ी का सामूहिक उल्लेख है; ‘सन्तान’ इस पीढ़ीगत भेद को स्वाभाविक ढंग से व्यक्त करता है और केवल पुरुषों तक अर्थ सीमित नहीं करता।
- source_word: בְּחֻקּוֹתַי לֹא הָלָכוּ
  choice: मेरी विधियों पर नहीं चले
  rationale: ‘चलना’ इब्रानी वाचा-संबंधी रूपक को बनाए रखता है, जबकि हिन्दी में ‘विधियों पर चलना’ स्वाभाविक और बोधगम्य है।
- source_word: מִשְׁפָּטַי
  choice: मेरे नियमों
  rationale: यहाँ מִשְׁפָּטִים परमेश्वर के बाध्यकारी न्याय-विधानों को दर्शाता है; आधुनिक हिन्दी में ‘नियम’ स्पष्ट है और कानूनी-नैतिक बल बनाए रखता है।
- source_word: לֹא שָׁמְרוּ לַעֲשׂוֹת אוֹתָם
  choice: मानकर उनका पालन नहीं किया
  rationale: 'यह अभिव्यक्ति שׁמר और עשׂה दोनों को स्वाभाविक हिन्दी में दर्शाती है: नियमों को मानना और व्यवहार में उनका पालन करना।'
- source_word: אֲשֶׁר יַעֲשֶׂה אוֹתָם הָאָדָם וָחַי בָּהֶם
  choice: जिनका पालन यदि कोई मनुष्य करे, तो वह उनके द्वारा जीवित रहेगा
  rationale: शर्त-सदृश सम्बन्ध, הָאָדָם का सामान्य मानव-सूचक एकवचन और בָּהֶם का ‘उनके द्वारा’ सम्बन्ध सुरक्षित रखे गए हैं; यह लैव्यव्यवस्था 18:5 की प्रतिध्वनि भी बनाए रखता है।
- source_word: אֶת שַׁבְּתוֹתַי חִלֵּלוּ
  choice: मेरे विश्राम-दिनों को अपवित्र किया
  rationale: पिएल חִלֵּל पवित्र वस्तु को अपवित्र करने का अर्थ देता है; ‘विश्राम-दिन’ सामान्य हिन्दी पाठक को ‘सब्त’ का आशय स्पष्ट करता है।
- source_word: לִשְׁפֹּךְ חֲמָתִי עֲלֵיהֶם
  choice: अपना कोप उन पर उंडेल दूँगा
  rationale: ‘उंडेलना’ मूल रूपक को बनाए रखता है और ‘कोप’ חֵמָה की तीव्र दैवी रोष-भावना को गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: לְכַלּוֹת אַפִּי בָּם
  choice: उन पर अपना क्रोध पूरी तरह उतारूँगा
  rationale: כּלה के पूर्णता तक पहुँचाने वाले अर्थ और אַף के क्रोध-सूचक प्रयोग को स्वाभाविक हिन्दी मुहावरे में व्यक्त किया गया है, बिना यह संकेत दिए कि परमेश्वर का क्रोध स्वयं थक या समाप्त हो जाता है।
- source_word: בַּמִּדְבָּר
  choice: जंगल में
  rationale: निर्गमन-वृत्तान्त के सन्दर्भ में מִדְבָּר निर्जन वन-प्रदेश है; हिन्दी बाइबलीय प्रयोग में ‘जंगल’ प्रचलित और सहज है।
theological_decisions:
- issue: הָאָדָם का सामान्य मानव-सूचक प्रयोग
  choice: कोई मनुष्य
  alternative: कोई व्यक्ति; मनुष्य
  rationale: इब्रानी में निश्चित एकवचन रूप सामान्य रूप से किसी भी मानव को सूचित करता है। ‘कोई मनुष्य’ एकवचन और सार्वभौमिक अर्थ दोनों को रखता है तथा इसे केवल पुरुष तक सीमित नहीं करता।
- issue: וָחַי בָּהֶם में जीवन और आज्ञापालन का सम्बन्ध
  choice: वह उनके द्वारा जीवित रहेगा
  alternative: वह उनमें जीवित रहेगा; वह उनके अनुसार जीएगा
  rationale: בָּהֶם के साधनात्मक अथवा क्षेत्र-सूचक बल को अत्यधिक व्याख्यायित किए बिना ‘उनके द्वारा’ से रखा गया है। पाठ यह नहीं बताता कि यहाँ जीवन की पूरी धर्मवैज्ञानिक प्रकृति क्या है, इसलिए अनुवाद उस तनाव को खुला रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण पर सहज शैली अपनाई गई है। ‘विधियों पर चलना’, ‘कोप उंडेलना’ और ‘क्रोध उतारना’ मूल इब्रानी रूपकों को जहाँ सम्भव हो बनाए रखते हैं; ‘सन्तान’ सामूहिक अगली पीढ़ी को स्वाभाविक रूप से व्यक्त करता है।
