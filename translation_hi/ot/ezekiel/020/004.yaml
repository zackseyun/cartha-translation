  text: הֲ/תִשְׁפֹּ֣ט אֹתָ֔/ם הֲ/תִשְׁפּ֖וֹט בֶּן אָדָ֑ם אֶת תּוֹעֲבֹ֥ת אֲבוֹתָ֖/ם הוֹדִיעֵֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/020/004.yaml
  text: Will you judge them? Will you judge[b][a], son of man? Make known to them the abominations of their fathers.
translation:
  language: hi
  text: क्या तू उनका न्याय करेगा? क्या तू न्याय करेगा, हे मनुष्य-पुत्र?[a] उनके पिताओं[b] के घृणित काम उन्हें बता दे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘मनुष्य-पुत्र’ यहेजकेल के लिए प्रयुक्त नियमित संबोधन है; इसका अनुवाद ‘नश्वर मनुष्य’ या ‘मानव’ भी किया जा सकता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से ‘उनके पिताओं’; अर्थ ‘उनके पूर्वजों’ भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲתִשְׁפֹּט ... הֲתִשְׁפּוֹט
  choice: क्या तू ... न्याय करेगा? क्या तू न्याय करेगा
  rationale: שׁפט का यहाँ न्यायिक अर्थ है। इब्रानी की जानबूझकर की गई पुनरुक्ति और दोनों प्रश्नों का चुनौतीपूर्ण बल बनाए रखा गया है।
- source_word: אֹתָם
  choice: उनका
  rationale: यह प्रसंग में उपस्थित इस्राएल के पुरनियों की ओर संकेत करने वाला प्रत्यक्ष कर्म है। हिंदी में ‘उनका न्याय करना’ स्वाभाविक है।
- source_word: בֶּן אָדָם
  choice: हे मनुष्य के पुत्र
  rationale: यह यहेजकेल को संबोधित करने का नियमित इब्रानी रूप है। संबोधन के लिए ‘हे’ जोड़कर मूल रूपक और पुल्लिंग रूप सुरक्षित रखा गया है।
- source_word: תּוֹעֲבֹת
  choice: घृणित काम
  rationale: यह चयन उन नैतिक, वाचा-विरोधी और प्रायः मूर्तिपूजक आचरणों के प्रति मूल शब्द की तीव्र घृणा को स्पष्ट और स्वाभाविक आधुनिक हिंदी में व्यक्त करता है।
- source_word: אֲבוֹתָם
  choice: उनके पुरखाओं
  rationale: ‘पुरखा’ पुरुष पूर्वजों को सूचित करता है और ‘पितरों’ की अपेक्षा सामान्य आधुनिक पाठक के लिए अधिक सहज है; पादटिप्पणी मूल के शाब्दिक रूप को बताती है।
- source_word: הוֹדִיעֵם
  choice: उन्हें बता दे
  rationale: ידע के हिफ़ील रूप का आशय उन्हें उन कामों का ज्ञान कराना है। ‘बता दे’ हिंदी में स्वाभाविक आदेश है और इस कारक अर्थ को पर्याप्त रूप से व्यक्त करता है।
theological_decisions:
- issue: בֶּן אָדָם का अर्थ
  choice: मनुष्य के पुत्र
  alternative: नश्वर मनुष्य; मानव
  rationale: यहाँ यह परमेश्वर द्वारा यहेजकेल को दिया गया भविष्यद्वक्तीय संबोधन है। अनुवाद इब्रानी रूप को बचाता है, पर इसमें बाद की मसीही पदवी का अर्थ आरोपित नहीं करता।
- issue: אֲבוֹתָם का वंशगत संकेत
  choice: उनके पुरखाओं
  alternative: उनके पूर्वजों; उनके पितरों
  rationale: मूल शब्द पुल्लिंग और वंशगत है। ‘पुरखाओं’ से यह विशेषता बनी रहती है, जबकि ‘पूर्वजों’ से पुरुष-संबंधी अभिव्यक्ति कुछ धुंधली हो सकती है।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण किंतु सहज शैली रखी गई है। परमेश्वर से भविष्यद्वक्ता को एकवचन संबोधन होने के कारण ‘तू’ प्रयुक्त है। इब्रानी की दोहरी प्रश्नात्मक पुनरुक्ति को बिना समतल किए ज्यों का त्यों बनाए रखा गया है।
