source:
  edition: WLC
  text: וַ/יְהִ֣י בַּ/שָּׁנָ֣ה הַ/שְּׁבִיעִ֗ית בַּֽ/חֲמִשִׁי֙ בֶּ/עָשׂ֣וֹר לַ/חֹ֔דֶשׁ בָּ֧אוּ אֲנָשִׁ֛ים מִ/זִּקְנֵ֥י יִשְׂרָאֵ֖ל לִ/דְרֹ֣שׁ אֶת יְהוָ֑ה וַ/יֵּשְׁב֖וּ לְ/פָנָֽ/י׀־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/020/001.yaml
  text: And it happened in the seventh year[a], in the fifth month, on the tenth day of the month, that some of the elders of Israel came to inquire of Yahweh[b], and they sat before me.
translation:
  language: hi
  text: सातवें वर्ष में, पाँचवें महीने के दसवें दिन ऐसा हुआ कि इस्राएल के बुज़ुर्गों में से कुछ लोग याहवे से पूछने आए और मेरे सामने बैठ गए।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: ऐसा हुआ
  rationale: यह नया, तिथि-सहित वृत्तांत आरम्भ करने वाला स्वाभाविक आधुनिक हिन्दी प्रयोग है और इब्रानी कथात्मक रूप का बल बनाए रखता है।
- source_word: בַּשָּׁנָה הַשְּׁבִיעִית
  choice: सातवें वर्ष में
  rationale: पद केवल सातवें वर्ष का उल्लेख करता है; निर्वासन का काल-संदर्भ मुख्य पाठ में जोड़ना मूल से अधिक स्पष्ट करना होता।
- source_word: בַּחֲמִשִׁי בֶּעָשׂוֹר לַחֹדֶשׁ
  choice: पाँचवें महीने के दसवें दिन
  rationale: यह इब्रानी तिथि-सूत्र का अर्थ सटीक रखते हुए हिन्दी में संक्षिप्त और स्वाभाविक है।
- source_word: בָּאוּ אֲנָשִׁים מִזִּקְנֵי יִשְׂרָאֵל
  choice: इस्राएल के पुरनियों में से कुछ लोग ... आए
  rationale: शाब्दिक रूप से 'इस्राएल के पुरनियों में से पुरुष' प्रतिनिधियों या उस समूह के कुछ सदस्यों की ओर संकेत करता है; हिन्दी में यह रूप उसी अंशात्मक भाव को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: לִדְרֹשׁ אֶת יְהוָה
  choice: यहोवा से पूछने
  rationale: इस प्रसंग में דרש का आशय परमेश्वर से उत्तर या मार्गदर्शन प्राप्त करने के लिए विधिवत पूछना है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिन्दी में दिव्य नाम का प्रचलित, पहचाना जाने वाला लिप्यंतरण है और इसे किसी उपाधि से प्रतिस्थापित नहीं करता।
- source_word: וַיֵּשְׁבוּ לְפָנָי
  choice: मेरे सामने बैठ गए
  rationale: यह शारीरिक मुद्रा और नबी की उपस्थिति में औपचारिक रूप से बैठने—दोनों को सहज हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: दिव्य नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे / प्रभु
  rationale: मूल में व्यक्तिगत दिव्य नाम है। हिन्दी पाठकों के लिए प्रचलित लिप्यंतरण 'यहोवा' नामत्व को बनाए रखता है; 'प्रभु' उपाधि बन जाती, जबकि 'याहवे' मूल उच्चारण के अधिक निकट माना जाता है पर सामान्य हिन्दी बाइबलीय प्रयोग में कम परिचित है।
- issue: सातवें वर्ष का ऐतिहासिक आधार
  choice: केवल 'सातवें वर्ष में'
  alternative: '''यहोयाकीन के निर्वासन के सातवें वर्ष में'''
  rationale: व्यापक पुस्तक-संदर्भ निर्वासन की ओर संकेत करता है, पर यह पद स्वयं उसका उल्लेख नहीं करता; इसलिए अनिर्दिष्टता सुरक्षित रखी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी, सहज किंतु गरिमापूर्ण कथात्मक शैली। 'पुरनियों' को इस्राएल के मान्य अगुओं के लिए परिचित बाइबलीय पद के रूप में रखा गया है। किसी पादटिप्पणी की आवश्यकता नहीं समझी गई, इसलिए मुख्य पाठ में कोई पादटिप्पणी-चिह्न नहीं है।
