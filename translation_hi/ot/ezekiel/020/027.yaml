base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/020/027.yaml
  text: 'Therefore speak to the house of Israel[a], son of man, and say to them, ‘Thus says the Lord Yahweh: In this also your fathers blasphemed me[b], by acting treacherously against me.’'
translation:
  language: hi
  text: 'इसलिए, हे मनुष्य के पुत्र, इस्राएल के घराने को संबोधित कर और उनसे कह, ‘प्रभु याहवे यह कहते हैं: तुम्हारे पुरखाओं ने इस बात में भी मेरी निन्दा की[a], कि उन्होंने मेरे प्रति विश्वासघात किया[b]।’'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “मेरा अपमान किया” अथवा “मेरे साथ तिरस्कार का व्यवहार किया।”
    reason: lexical_alternative
  - marker: b
    text: या “मेरे विरुद्ध बेवफाई की” अथवा “मेरे साथ निष्ठा का बन्धन तोड़ा।”
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: इसलिए
  rationale: यह पूर्ववर्ती कथन से निकलने वाले निष्कर्ष को स्वाभाविक और स्पष्ट रूप से व्यक्त करता है।
- source_word: דַּבֵּר אֶל־בֵּית יִשְׂרָאֵל
  choice: इस्राएल के घराने से कह
  rationale: ‘घराना’ सामूहिक वाचा-संबंधी अभिव्यक्ति ‘इस्राएल का घराना’ को बनाए रखता है, उसे केवल ‘लोग’ नहीं बनाता।
- source_word: בֶּן־אָדָם
  choice: हे मनुष्य के पुत्र
  rationale: यहेजकेल के लिए बार-बार प्रयुक्त ईश्वरीय संबोधन को पारंपरिक और निकट-शाब्दिक रूप में सुरक्षित रखता है।
- source_word: כֹּה אָמַר אֲדֹנָי יְהוִה
  choice: प्रभु याहवे यह कहते हैं
  rationale: אֲדֹנָי को ‘प्रभु’ और परमेश्वर के व्यक्तिगत नाम יהוה को ‘याहवे’ के रूप में अलग-अलग व्यक्त करता है तथा भविष्यद्वाणी के संदेश-सूत्र को सहज हिन्दी में रखता है।
- source_word: עוֹד זֹאת
  choice: इस बात में भी
  rationale: עוֹד की योगात्मक शक्ति और זֹאת के संकेत—दोनों को बनाए रखता है।
- source_word: גִּדְּפוּ אוֹתִי
  choice: मेरी निन्दा की
  rationale: परमेश्वर के विरुद्ध अपमानजनक अवमानना की गंभीरता को स्वाभाविक धार्मिक हिन्दी में व्यक्त करता है।
- source_word: אֲבוֹתֵיכֶם
  choice: तुम्हारे पुरखाओं
  rationale: संबोधित पीढ़ी के पूर्वजों के लिए सहज आधुनिक हिन्दी है और मूल के पारिवारिक-सामूहिक आशय को बनाए रखता है।
- source_word: בְּמַעֲלָם בִּי מָעַל
  choice: कि उन्होंने मेरे प्रति विश्वासघात किया
  rationale: מעל की संज्ञा और क्रिया वाले सजातीय प्रयोग का जोर सहज हिन्दी में ‘विश्वासघात’ द्वारा व्यक्त होता है; ‘कि’ इस बात को स्पष्ट करता है कि यही वह रीति थी जिसमें उन्होंने परमेश्वर की निन्दा की।
theological_decisions:
- issue: אֲדֹנָי יְהוִה में परमेश्वर के नाम का अनुवाद
  choice: प्रभु याहवे
  alternative: प्रभु परमेश्वर / प्रभु यहोवा
  rationale: मूल में उपाधि אֲדֹנָי और व्यक्तिगत नाम יהוה दोनों उपस्थित हैं; ‘प्रभु याहवे’ दोनों को अलग रखता है और नाम को सामान्य उपाधि में नहीं बदलता।
- issue: בֶּן־אָדָם का संबोधन
  choice: हे मनुष्य के पुत्र
  alternative: हे नश्वर मनुष्य
  rationale: यहाँ यह यहेजकेल के लिए नियमित भविष्यद्वाणी-संबोधन है। निकट-शाब्दिक रूप पुस्तक के भीतर इसकी पुनरावृत्ति और पहचान बनाए रखता है, बिना इसे अनावश्यक रूप से मसीह-संबंधी अर्थ देने के।
- issue: מעל की वाचा-संबंधी गंभीरता
  choice: विश्वासघात किया
  alternative: अविश्वासी रहे / अपराध किया
  rationale: ‘विश्वासघात’ संबंध और निष्ठा के टूटने की गंभीरता को व्यक्त करता है, पर पद में स्पष्ट न की गई किसी विशिष्ट घटना को नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सार्वजनिक पाठ के योग्य रखी गई है। ‘घराना’, ‘मनुष्य का पुत्र’ और ‘प्रभु याहवे’ जैसे मुख्य पद मूल की भविष्यद्वाणी तथा वाचा-संबंधी शैली बनाए रखते हैं; वाक्य-क्रम हिन्दी की स्वाभाविकता के लिए समायोजित किया गया है।
