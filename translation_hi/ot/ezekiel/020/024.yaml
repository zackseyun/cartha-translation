id: EZK.20.24
reference: Ezekiel 20:24
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: יַ֜עַן מִשְׁפָּטַ֤/י לֹֽא עָשׂוּ֙ וְ/חֻקּוֹתַ֣/י מָאָ֔סוּ וְ/אֶת שַׁבְּתוֹתַ֖/י חִלֵּ֑לוּ וְ/אַחֲרֵי֙ גִּלּוּלֵ֣י אֲבוֹתָ֔/ם הָי֖וּ עֵינֵי/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/020/024.yaml
  text: because they did not practice my judgments[a], and they rejected my statutes, and they profaned my Sabbaths, and their eyes were after the idols of their fathers.
translation:
  language: hi
  text: क्योंकि उन्होंने मेरे न्याय-विधानों का पालन नहीं किया, मेरी विधियों को ठुकरा दिया, मेरे विश्राम-दिनों को अपवित्र किया, और उनकी आँखें अपने पुरखों की मूरतों[a] पर लगी रहीं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी गिल्लूलीम मूरतों के लिए अत्यंत तिरस्कारपूर्ण शब्द है; इसका भाव ‘घिनौनी मूरतें’ या ‘मल-मूरतें’ जैसा है।
    reason: मूल शब्द के अपमानसूचक अर्थ को स्पष्ट करना।
lexical_decisions:
- source_word: יַעַן
  choice: क्योंकि
  rationale: यह पद पिछले कथन में बताए गए परमेश्वर के कार्य का कारण देता है; ‘क्योंकि’ आधुनिक हिन्दी में इसका स्वाभाविक कारणसूचक रूप है।
- source_word: מִשְׁפָּטַי
  choice: मेरे न्याय-विधान
  rationale: यह वाचा-संबंधी कानूनी निर्णयों और नियमों को दर्शाता है। ‘न्याय-विधान’ इसके न्यायिक भाव को बनाए रखता है और חֻקּוֹתַי से भेद भी करता है।
- source_word: עָשׂוּ
  choice: पालन नहीं किया
  rationale: नियमों या विधानों के साथ हिन्दी में ‘पालन करना’ स्वाभाविक है और इब्रानी क्रिया के व्यवहार में उतारने वाले भाव को व्यक्त करता है।
- source_word: חֻקּוֹתַי
  choice: मेरी विधियाँ
  rationale: यह स्थापित किए गए वाचा-संबंधी आदेशों का द्योतक है; ‘विधियाँ’ स्पष्ट और गरिमापूर्ण हिन्दी है।
- source_word: מָאָסוּ
  choice: ठुकरा दिया
  rationale: यह केवल उपेक्षा नहीं, बल्कि जान-बूझकर अस्वीकार करने का भाव देता है; ‘ठुकरा दिया’ इस बल को स्वाभाविक हिन्दी में रखता है।
- source_word: שַׁבְּתוֹתַי
  choice: मेरे विश्राम-दिन
  rationale: बहुवचन शब्बात के पवित्र दिनों को सूचित करता है। ‘विश्राम-दिन’ सामान्य आधुनिक हिन्दी पाठक के लिए ‘सब्त’ से अधिक तुरंत समझ में आता है।
- source_word: חִלֵּלוּ
  choice: अपवित्र किया
  rationale: पिएल रूप पवित्र वस्तु को साधारण या अशुद्ध ठहराने का भाव देता है; ‘अपवित्र किया’ धार्मिक और वाचा-संबंधी वजन बनाए रखता है।
- source_word: גִּלּוּלֵי
  choice: मूरतों
  rationale: संदर्भ में ये उपासना की झूठी प्रतिमाएँ हैं। ‘मूरतों’ स्वाभाविक हिन्दी है; इब्रानी शब्द में निहित तीव्र तिरस्कार को पाद-टिप्पणी में स्पष्ट किया गया है।
- source_word: אֲבוֹתָם
  choice: अपने पुरखों
  rationale: ‘पुरखे’ पुरुष पूर्वजों के लिए स्वाभाविक हिन्दी शब्द है और इब्रानी के स्पष्ट पुल्लिंग पारिवारिक पद को व्यापक ‘पूर्वजों’ में नहीं बदलता।
- source_word: הָיוּ עֵינֵיהֶם אַחֲרֵי
  choice: उनकी आँखें ... पर लगी रहीं
  rationale: यह मुहावरा उनकी चाह और झुकाव को आँखों की छवि द्वारा व्यक्त करता है। ‘आँखें ... पर लगी रहीं’ उस छवि और लगातार उन्मुखता दोनों को बनाए रखता है।
theological_decisions:
- issue: אֲבוֹתָם में पुल्लिंग पारिवारिक पद
  choice: अपने पुरखों
  alternative: अपने पूर्वजों
  rationale: इब्रानी में विशेष रूप से ‘पिताओं/पुरखों’ का पुल्लिंग बहुवचन है। ‘पुरखों’ स्रोत की इस विशिष्टता को स्वाभाविक हिन्दी में बनाए रखता है।
- issue: גִּלּוּלִים का तिरस्कारपूर्ण भाव
  choice: मुख्य पाठ में ‘मूरतों’, और तिरस्कारपूर्ण अर्थ पाद-टिप्पणी में
  alternative: घिनौनी मूरतों / मल-मूरतों
  rationale: यहेजकेल का शब्द जान-बूझकर अपमानसूचक है, पर मुख्य पाठ में उसका विस्तारित शाब्दिक रूप अस्वाभाविक या अत्यधिक व्याख्यात्मक हो सकता है। पाद-टिप्पणी मूल की तीक्ष्णता को पारदर्शी रूप से सुरक्षित रखती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। समानार्थी कानूनी शब्दों מִשְׁפָּט और חֻקּוֹת का भेद क्रमशः ‘न्याय-विधान’ और ‘विधियाँ’ से बनाए रखा गया है। आँखों के मूरतों पर लगे रहने वाली इब्रानी छवि को हिन्दी मुहावरे में सुरक्षित रखा गया है।
