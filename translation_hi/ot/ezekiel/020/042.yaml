source:
  edition: WLC
  text: וִֽ/ידַעְתֶּם֙ כִּֽי אֲנִ֣י יְהוָ֔ה בַּ/הֲבִיאִ֥/י אֶתְ/כֶ֖ם אֶל אַדְמַ֣ת יִשְׂרָאֵ֑ל אֶל הָ/אָ֗רֶץ אֲשֶׁ֤ר נָשָׂ֨אתִי֙ אֶת יָדִ֔/י לָ/תֵ֥ת אוֹתָ֖/הּ לַ/אֲבֽוֹתֵי/כֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/020/042.yaml
  text: Then you will know that I am Yahweh[a], when I bring you into the land of Israel, into the land that I lifted up my hand to give to your fathers.
translation:
  language: hi
  text: तब तुम जानोगे कि मैं याहवे हूँ, जब मैं तुम्हें इस्राएल की भूमि में, उस भूमि में ले आऊँगा, जिसे मैंने तुम्हारे पितरों को देने के लिए अपना हाथ उठाया था।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात्, “जिसे तुम्हारे पितरों को देने की मैंने शपथ खाई थी।” इब्रानी में शाब्दिक रूप से “मैंने अपना हाथ उठाया था” है; हाथ उठाना शपथ लेने का संकेत था।
    reason: शाब्दिक इब्रानी मुहावरे का भावार्थ स्पष्ट करना।
lexical_decisions:
- source_word: וִידַעְתֶּם
  choice: तब तुम जानोगे
  rationale: संयोजक वाव के साथ पूर्ण क्रिया यहाँ भविष्य के परिणाम को व्यक्त करती है; ‘तब’ पिछले और वर्तमान प्रसंग में बताई गई परमेश्वर की कार्रवाई के फल को स्वाभाविक हिन्दी में स्पष्ट करता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत वाचा-नाम को उपाधि से बदलने के बजाय देवनागरी में लिप्यंतरित किया गया है।
- source_word: בַּהֲבִיאִי
  choice: जब मैं ... ले आऊँगा
  rationale: बेथ के साथ क्रियार्थक संज्ञा पहचान होने की परिस्थिति अथवा समय बताती है; हिन्दी में यह रूप स्वाभाविक है।
- source_word: אַדְמַת יִשְׂרָאֵל
  choice: इस्राएल की भूमि
  rationale: אַדְמָה का मूल अर्थ मिट्टी या भूमि हो सकता है, पर बहाली के इस प्रसंग में यह इस्राएल के भू-प्रदेश का संकेत है।
- source_word: הָאָרֶץ
  choice: उस देश
  rationale: यह समूची पृथ्वी नहीं, प्रतिज्ञा किए गए विशेष देश को दर्शाता है। ‘देश’ हिन्दी में क्षेत्रीय अर्थ स्पष्ट करता है, जबकि पहले पदबंध में ‘भूमि’ मूल की निकट पुनरावृत्ति बनाए रखती है।
- source_word: נָשָׂאתִי אֶת־יָדִי
  choice: मैंने अपना हाथ उठाया था
  rationale: मुख्य पाठ में इब्रानी शपथ-संकेत का ठोस बिंब सुरक्षित रखा गया है; उसका भावार्थ पाद-टिप्पणी में बताया गया है।
- source_word: לָתֵת אוֹתָהּ
  choice: देने के लिए
  rationale: सरल उद्देश्यवाचक अर्थ रखा गया है; स्त्रीलिंग सर्वनाम का आशय निकटवर्ती ‘देश’ से स्वतः स्पष्ट होने के कारण अलग से ‘उसे’ आवश्यक नहीं है।
- source_word: לַאֲבוֹתֵיכֶם
  choice: तुम्हारे पुरखों को
  rationale: ‘पुरखे’ आधुनिक हिन्दी में पूर्वज पिताओं के लिए सहज शब्द है और इब्रानी אָבוֹת की पुरुषवाची, वंशगत अभिव्यक्ति को बनाए रखता है।
theological_decisions:
- issue: परमेश्वर के नाम יהוה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में वाचा का व्यक्तिगत नाम सीधे आया है। लिप्यंतरण उस नाम को किसी उपाधि में बदले बिना सुरक्षित रखता है।
- issue: नָשָׂאתִי אֶת־יָדִי में शपथ की अभिव्यक्ति
  choice: मुख्य पाठ में ‘मैंने अपना हाथ उठाया था’
  alternative: ‘मैंने शपथ खाई थी’ अथवा ‘मैंने हाथ उठाकर शपथ खाई थी’
  rationale: शाब्दिक बिंब परमेश्वर की गंभीर प्रतिज्ञा को मूल के अनुरूप रखता है, जबकि पाद-टिप्पणी पाठक को मुहावरे का शपथ-संबंधी अर्थ बताती है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। वाक्य-विन्यास मूल की पहचान-सूत्र संरचना को बनाए रखता है; डैश ‘इस्राएल की भूमि’ और ‘उस देश’ के समानार्थी संबंध को स्पष्ट करते हैं।
