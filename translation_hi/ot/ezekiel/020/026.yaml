base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/020/026.yaml
  text: And I defiled them through their gifts[a], by making every firstborn pass through the fire, so that I might devastate them[d][c][b], so that they might know that I am Yahweh.
translation:
  language: hi
  text: और मैंने उनकी भेंटों के द्वारा उन्हें अशुद्ध कर दिया[a], हर पहलौठे को पार कराने के द्वारा[b], ताकि मैं उन्हें उजाड़ कर दूँ[c], ताकि वे जान लें कि मैं यहोवा हूँ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘अशुद्ध कर दिया’ का अनुवाद ‘अपवित्र कर दिया’ या ‘दूषित कर दिया’ भी हो सकता है। ‘भेंटों’ का अर्थ प्रसंग के अनुसार ‘चढ़ावों’ भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: ‘हर पहलौठे’ का शाब्दिक इब्रानी रूप ‘गर्भ को खोलने वाला हर एक’ है। ‘पार कराना’ उस कर्मकाण्ड की ओर संकेत करता है जो संभवतः बाल-बलि से जुड़ा था; इस पद में ‘आग’ शब्द प्रत्यक्ष रूप से नहीं है।
    reason: cultural_note
  - marker: c
    text: या ‘उन्हें उजाड़ बना दूँ’; इब्रानी क्रिया का अर्थ ‘उन्हें स्तब्ध’ या ‘भयभीत कर दूँ’ भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֲטַמֵּא
  choice: मैंने ... उन्हें अशुद्ध कर दिया
  rationale: טמא के हिफ़ील रूप में कारणवाचक अर्थ है—उन्हें अशुद्ध ठहराना या कर देना। यह अनुवाद उपासना-संबंधी और नैतिक दोनों अर्थों को बनाए रखता है तथा परमेश्वर के प्रत्यक्ष प्रथम-पुरुष कथन को नरम नहीं करता।
- source_word: בְּמַתְּנוֹתָם
  choice: उनके चढ़ावों के द्वारा
  rationale: מַתָּנוֹת का मूल अर्थ ‘भेंटें/उपहार’ है, पर इस बलिदान-संबंधी प्रसंग में ‘चढ़ावे’ स्वाभाविक है। ‘के द्वारा’ साधनसूचक בְּ को व्यक्त करता है।
- source_word: בְּהַעֲבִיר
  choice: जब उन्होंने ... पार कराया
  rationale: בְּ के साथ हिफ़ील क्रियार्थक संज्ञा साधन या समय दोनों बता सकती है। यहाँ ‘जब उन्होंने ... पार कराया’ सहज हिन्दी में कर्मकाण्डीय क्रिया और लोगों की सहभागिता व्यक्त करता है।
- source_word: כָּל פֶּטֶר רָחַם
  choice: हर पहलौठे
  rationale: शाब्दिक मुहावरा ‘गर्भ को खोलने वाला हर एक’ है और सामान्यतः पहलौठे को दर्शाता है। मुख्य पाठ में प्रचलित हिन्दी ‘पहलौठे’ रखा गया है और शाब्दिक रूप पाद-टिप्पणी में दिया गया है।
- source_word: לְמַעַן אֲשִׁמֵּם
  choice: ताकि मैं उन्हें उजाड़ दूँ
  rationale: שמם का हिफ़ील रूप उजाड़ने, विनष्ट दशा में डालने या स्तब्ध/भयभीत कर देने का अर्थ दे सकता है। ‘उजाड़ दूँ’ न्याय के प्रसंग में ठोस अर्थ देता है, जबकि वैकल्पिक अर्थ पाद-टिप्पणी में सुरक्षित है।
- source_word: לְמַעַן אֲשֶׁר יֵדְעוּ
  choice: और वे जान लें
  rationale: यह यहेजकेल में बार-बार आने वाले उद्देश्यसूचक ज्ञान-वाक्य को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: चार अक्षरों वाले परमेश्वर के व्यक्तिगत नाम को उपाधि से बदलने के बजाय हिन्दी में प्रचलित लिप्यंतरण ‘यहोवा’ से प्रस्तुत किया गया है।
theological_decisions:
- issue: इस्राएल को अशुद्ध करने में परमेश्वर की भूमिका
  choice: प्रत्यक्ष प्रथम-पुरुष कथन ‘मैंने ... उन्हें अशुद्ध कर दिया’ बनाए रखा गया है, साथ ही उनके अपने चढ़ावों और कर्मकाण्ड को माध्यम बताया गया है।
  alternative: ‘मैंने उन्हें अशुद्धता के हवाले कर दिया’ कहकर कथन को केवल अनुमति देने के अर्थ में समझाना।
  rationale: इब्रानी पाठ स्पष्ट कारणवाचक प्रथम-पुरुष रूप प्रयोग करता है। अनुवाद इस कठिन धर्मवैज्ञानिक तनाव को हल्का नहीं करता, पर यह भी दिखाता है कि अशुद्धता उनके चढ़ावों और घृणित कर्मकाण्ड से जुड़ी थी।
- issue: पहलौठों को पार कराने का कर्मकाण्ड
  choice: मुख्य पाठ में प्रसंगानुसार ‘आग में से पार कराया’ और ‘हर पहलौठे’ रखा गया है; शाब्दिक तथा सांस्कृतिक जानकारी पाद-टिप्पणी में दी गई है।
  alternative: केवल ‘गर्भ खोलने वाले हर एक को पार कराया’ जैसा पूर्णतः शाब्दिक, पर अस्पष्ट अनुवाद।
  rationale: ‘आग’ इस पद में प्रत्यक्ष रूप से नहीं है, पर ‘पार कराना’ इसी पुस्तक के निकटवर्ती प्रसंग और व्यापक पुराने नियम में बाल-बलि से जुड़ा कर्मकाण्डीय संकेत है। पाद-टिप्पणी इस व्याख्यात्मक पूर्ति को पारदर्शी बनाती है।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। ‘चढ़ावे’, ‘अशुद्ध’ और ‘पहलौठा’ जैसे परिचित बाइबलीय शब्द उपासना-संबंधी प्रसंग को बनाए रखते हैं। वाक्य की दो उद्देश्यसूचक धाराओं को सहज हिन्दी में ‘ताकि ... और ...’ से जोड़ा गया है।
