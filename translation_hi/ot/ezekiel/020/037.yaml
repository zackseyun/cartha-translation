source:
  edition: WLC
  text: וְ/הַעֲבַרְתִּ֥י אֶתְ/כֶ֖ם תַּ֣חַת הַ/שָּׁ֑בֶט וְ/הֵבֵאתִ֥י אֶתְ/כֶ֖ם בְּ/מָסֹ֥רֶת הַ/בְּרִֽית׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/020/037.yaml
  text: I will make you pass under the rod[b][a], and I will bring you into the bond of the covenant.
translation:
  language: hi
  text: मैं तुम्हें लाठी के नीचे से गुजारूँगा[a], और तुम्हें वाचा के बंधन में लाऊँगा[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “लाठी के नीचे से गुजारना” संभवतः उस प्रथा की ओर संकेत करता है जिसमें चरवाहा अपने झुंड के पशुओं को लाठी के नीचे से गुजारकर उनकी गिनती या जाँच करता था।
    reason: cultural_note
  - marker: b
    text: या “वाचा की बेड़ी में” अथवा “वाचा की बाध्यता में।” यहाँ प्रयुक्त इब्रानी शब्द दुर्लभ है और वाचा के संबंध में बाँधे या बाध्य किए जाने का भाव व्यक्त करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַעֲבַרְתִּי
  choice: मैं ... पार कराऊँगा
  rationale: עבר का हिफ़ील रूप कारणवाचक है; ‘पार कराऊँगा’ इस भाव को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: תַּחַת הַשָּׁבֶט
  choice: लाठी के नीचे से
  rationale: שֵׁבֶט का अर्थ लाठी, डंडा या राजदंड हो सकता है। यहाँ चरवाहे की लाठी के नीचे से पशुओं को गिनने या जाँचने की पृष्ठभूमि संभावित है, इसलिए ‘लाठी’ सहज और उपयुक्त है।
- source_word: וְהֵבֵאתִי
  choice: लाऊँगा
  rationale: בוא के हिफ़ील का सामान्य अर्थ ‘लाना’ है; यह पहले खंड की कारणवाचक क्रिया के साथ समानांतरता भी रखता है।
- source_word: בְּמָסֹרֶת
  choice: बंधन में
  rationale: दुर्लभ शब्द מָסֹרֶת बाँधने वाले बंधन, बेड़ी या बाध्यता का संकेत देता है। ‘बंधन’ भौतिक बेड़ी का अर्थ थोपे बिना इसकी व्यापक रूपकात्मक शक्ति बनाए रखता है।
- source_word: הַבְּרִית
  choice: वाचा
  rationale: בְּרִית के लिए ‘वाचा’ स्थापित हिन्दी बाइबलीय शब्द है और इसके संबंधात्मक तथा धर्मवैचारिक अर्थ को सुरक्षित रखता है।
theological_decisions:
- issue: वाचा-संबंधी रूपक का आशय
  choice: पद में लोगों को प्रभु की जाँच और वाचा के बाध्यकारी संबंध में लाए जाने का चित्र है; अनुवाद यह तय नहीं करता कि बल मुख्यतः दंड पर है या पुनर्स्थापना पर।
  alternative: इसे केवल दंडात्मक बंधन अथवा केवल वाचा में पुनः स्वागत के रूप में स्पष्ट करना।
  rationale: लाठी के नीचे से गुजरने में जाँच और न्याय का भाव हो सकता है, जबकि वाचा के बंधन में आने में बाध्यता और नए सिरे से वाचा-संबंध—दोनों की संभावना है। मूल का तनाव बनाए रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और सहज वाक्य-विन्यास रखा गया है। ‘वाचा’ बाइबलीय संदर्भ में परिचित शब्द है; दुर्लभ रूपक ‘बंधन’ के साथ रखा गया है और उसकी अनिश्चितता पादटिप्पणी में स्पष्ट की गई है।
