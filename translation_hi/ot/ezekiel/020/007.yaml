  text: וָ/אֹמַ֣ר אֲלֵ/הֶ֗ם אִ֣ישׁ שִׁקּוּצֵ֤י עֵינָי/ו֙ הַשְׁלִ֔יכוּ וּ/בְ/גִלּוּלֵ֥י מִצְרַ֖יִם אַל תִּטַּמָּ֑אוּ אֲנִ֖י יְהוָ֥ה אֱלֹהֵי/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/020/007.yaml
  text: And I said to them[a], ‘Each man, throw away the detestable things before his eyes, and do not defile yourselves with the idols of Egypt[b]. I am Yahweh your God.’
translation:
  language: hi
  text: और मैंने उनसे कहा, “तुममें से हर एक उन घिनौनी वस्तुओं को फेंक दे जिन पर उसकी आँखें लगी हैं[a], और मिस्र की मूरतों[b] से अपने आपको अशुद्ध न करो। मैं याहवे, तुम्हारा परमेश्वर हूँ।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “उसकी आँखों की घिनौनी वस्तुएँ।” यह मुहावरा उन घृणित वस्तुओं की ओर संकेत करता है जिन्हें हर व्यक्ति देखता या चाहता है; संदर्भ में ये संभवतः मूर्तिपूजा की वस्तुएँ हैं।
    reason: lexical_alternative
  - marker: b
    text: यहाँ “मूरतों” के लिए प्रयुक्त हिब्रू शब्द यहेजकेल में अत्यंत तिरस्कारपूर्ण है; इसका अनुवाद “गंदी मूरतें” या अधिक शाब्दिक ढंग से “मल-समान मूरतें” भी किया जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֹמַר אֲלֵהֶם
  choice: और मैंने उनसे कहा
  rationale: वाव-क्रमिक रूप बीती हुई कथा को आगे बढ़ाता है; ‘और मैंने उनसे कहा’ उसके क्रम को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: אִישׁ
  choice: तुममें से हर एक
  rationale: एकवचन אִישׁ यहाँ बहुवचन आज्ञाओं के साथ वितरणात्मक अर्थ देता है—समुदाय के प्रत्येक व्यक्ति को अलग-अलग संबोधित किया गया है।
- source_word: שִׁקּוּצֵי עֵינָיו
  choice: उन घिनौनी वस्तुओं को … जिन पर उसकी आँखें लगी हैं
  rationale: שִׁקּוּץ धार्मिक संदर्भ में घृणित, विशेषतः मूर्तिपूजक वस्तु है। ‘आँखें लगी हैं’ हिब्रू के ‘उसकी आँखों की’ मुहावरेदार छवि को पठनीय हिन्दी में रखता है और देखने अथवा चाहने—दोनों संभावित भावों के लिए कुछ गुंजाइश छोड़ता है।
- source_word: הַשְׁלִיכוּ
  choice: फेंक दे
  rationale: क्रिया निर्णायक रूप से त्याग देने की आज्ञा व्यक्त करती है; एकवचन ‘दे’ वितरणात्मक ‘हर एक’ के अनुरूप है।
- source_word: גִּלּוּלֵי מִצְרַיִם
  choice: मिस्र की मूरतों
  rationale: גִּלּוּלִים यहेजकेल में मूर्तियों के लिए अत्यंत तिरस्कारपूर्ण शब्द है। मुख्य पाठ में ‘मूरतों’ स्पष्ट और सहज है; शब्द की तीखी अवमाननापूर्ण छाया पादटिप्पणी में दी गई है।
- source_word: אַל תִּטַּמָּאוּ
  choice: अपने आपको अशुद्ध न करो
  rationale: हित्पएल रूप का आत्मवाची भाव और मूर्तिपूजा से जुड़ी धार्मिक-नैतिक अशुद्धता दोनों सुरक्षित रहते हैं।
- source_word: יְהוָה
  choice: याहवे
  rationale: हिब्रू चतुरक्षरीय व्यक्तिगत नाम को उपाधि से बदलने के बजाय हिन्दी लिप्यंतरण में प्रस्तुत किया गया है।
- source_word: אֱלֹהֵיכֶם
  choice: तुम्हारा परमेश्वर
  rationale: याहवे के साथ यह रूप एकवचन ‘परमेश्वर’ है और इस्राएल के साथ वाचा-संबंध को व्यक्त करता है।
theological_decisions:
- issue: שִׁקּוּצֵי עֵינָיו के मुहावरे का अर्थ
  choice: उन घिनौनी वस्तुओं को … जिन पर उसकी आँखें लगी हैं
  alternative: अपनी आँखों के सामने की घिनौनी वस्तुओं को
  rationale: मूल पदबंध शाब्दिक रूप से ‘उसकी आँखों की घिनौनी वस्तुएँ’ है और संभवतः उन मूर्तिपूजक वस्तुओं की ओर संकेत करता है जिन्हें व्यक्ति देखता, चाहता या जिनकी ओर आसक्ति से ताकता है। चुना हुआ रूप छवि को स्वाभाविक हिन्दी में रखता है, पर अर्थ को केवल भौतिक स्थान तक सीमित नहीं करता।
- issue: גִּלּוּלִים की तिरस्कारपूर्ण शक्ति
  choice: मूरतों
  alternative: गंदी मूरतों / मल-समान मूरतों
  rationale: मूल शब्द जानबूझकर अपमानजनक है, किंतु उसके शब्दचित्र की व्युत्पत्ति को मुख्य पाठ में निश्चित रूप देना अर्थ को आवश्यकता से अधिक सीमित कर सकता है। इसलिए मूल अर्थ मुख्य पाठ में और प्रबल अवमानना पादटिप्पणी में रखी गई है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। वितरणात्मक एकवचन ‘हर एक … दे’ के बाद सामूहिक बहुवचन ‘अपने आपको … न करो’ मूल हिब्रू की वचन-रचना को स्वाभाविक हिन्दी में प्रतिबिंबित करता है। ‘याहवे’ व्यक्तिगत ईश्वरीय नाम का देवनागरी लिप्यंतरण है।
