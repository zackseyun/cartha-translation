base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/020/014.yaml
  text: But I acted for the sake of my name[a], so that it would not be profaned in the sight of the nations[b], in whose sight I had brought them out.
translation:
  language: hi
  text: परन्तु मैंने अपने नाम की खातिर[a] ऐसा किया, ताकि उन राष्ट्रों की आँखों के सामने मेरे नाम को अपवित्र[b] न किया जाए, जिनकी आँखों के सामने मैं उन्हें निकाल लाया था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अपने नाम के निमित्त।”
    reason: lexical_alternative
  - marker: b
    text: यहाँ “अपवित्र” का अर्थ है पवित्र को साधारण समझना या उसका निरादर करना।
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶעֱשֶׂה
  choice: परन्तु मैंने ... ऐसा किया
  rationale: עשה का अर्थ व्यापक रूप से ‘करना’ है। पिछले पद में घोषित न्याय के विपरीत परमेश्वर के कदम को दिखाने के लिए וָ का अनुवाद ‘परन्तु’ किया गया है; ‘ऐसा किया’ हिन्दी में प्रसंगानुकूल और स्वाभाविक है।
- source_word: לְמַעַן שְׁמִי
  choice: अपने नाम की खातिर
  rationale: यह मुहावरा परमेश्वर के नाम से जुड़ी पवित्रता, प्रतिष्ठा और प्रकट चरित्र की रक्षा के लिए कार्य करने को व्यक्त करता है। ‘की खातिर’ आधुनिक हिन्दी में सहज रहते हुए मूल भाव बनाए रखता है।
- source_word: לְבִלְתִּי הֵחֵל
  choice: ताकि ... अपवित्र न किया जाए
  rationale: यह रचना रोकथाम या उद्देश्य बताती है। חלל यहाँ किसी पवित्र वस्तु को अपवित्र करने या साधारण ठहराने के अर्थ में है। निष्क्रिय अभिव्यक्ति मूल में कर्ता के अनिर्दिष्ट रहने को बनाए रखती है।
- source_word: לְעֵינֵי הַגּוֹיִם
  choice: उन जातियों की आँखों के सामने
  rationale: यह अनुवाद मूल के ‘आँखों के सामने’ मुहावरे को बनाए रखते हुए कार्य की सार्वजनिक और प्रत्यक्ष प्रकृति व्यक्त करता है।
- source_word: הַגּוֹיִם
  choice: जातियों
  rationale: यहाँ גוים आसपास के राष्ट्रों या जनसमूहों को दर्शाता है। ‘जातियाँ’ इस संदर्भ में उपयुक्त है और बाद के धार्मिक अर्थ वाला कोई शब्द आरोपित नहीं करता।
- source_word: אֲשֶׁר הוֹצֵאתִים
  choice: जिनकी ... मैं उन्हें निकाल लाया था
  rationale: हिफ़ील रूप का अर्थ ‘निकाल लाना’ है और प्रत्यय इस्राएलियों की ओर संकेत करता है। ‘था’ पूर्व में घटित निष्क्रमण को स्पष्ट करता है।
- source_word: לְעֵינֵיהֶם
  choice: जिनकी आँखों के सामने
  rationale: मूल में ‘आँखों के सामने’ की पुनरावृत्ति सार्वजनिक साक्ष्य पर बल देती है; इसलिए हिन्दी में भी उसे जानबूझकर दोहराया गया है।
theological_decisions:
- issue: परमेश्वर का ‘अपने नाम की खातिर’ कार्य करना
  choice: वाक्यांश को उसके मूल मुहावरे सहित रखा गया है, जिससे परमेश्वर के नाम की पवित्रता और जातियों के बीच उसके सार्वजनिक सम्मान का भाव बना रहे।
  alternative: इसे केवल परमेश्वर की बाहरी प्रतिष्ठा बचाने के रूप में स्पष्ट करना।
  rationale: यहेजकेल में परमेश्वर का ‘नाम’ उसके प्रकट चरित्र और पवित्र सम्मान को दर्शाता है, केवल सतही प्रतिष्ठा को नहीं। मुख्य पाठ मुहावरे को बिना संप्रदायगत व्याख्या जोड़े सुरक्षित रखता है।
- issue: कौन या क्या नाम को अपवित्र करता
  choice: ‘अपवित्र न किया जाए’ के निष्क्रिय रूप द्वारा कर्ता को अनिर्दिष्ट रखा गया है।
  alternative: स्पष्ट रूप से कहना कि जातियाँ परमेश्वर के नाम को अपवित्र करतीं या कि परमेश्वर स्वयं उसे अपवित्र करता।
  rationale: हिब्रू में यहाँ अपवित्र करने वाला कर्ता स्पष्ट नहीं है। निष्क्रिय हिन्दी अनुवाद इस तनाव को अनावश्यक रूप से नहीं सुलझाता।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘आँखों के सामने’ की पुनरावृत्ति हिन्दी में कुछ बलपूर्ण है, पर मूल हिब्रू के सार्वजनिक साक्ष्य वाले जोर को सुरक्षित रखने के लिए इसे बनाए रखा गया है।
