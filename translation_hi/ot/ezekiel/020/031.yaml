base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/020/031.yaml
  text: And when you present your gifts[a], when you make your sons pass through the fire, you defile yourselves with all your idols to this day. And shall I be inquired of by you, O house of Israel? As I live, declares the Lord GOD[c][b], I will not be inquired of by you.
translation:
  language: hi
  text: 'और जब तुम अपनी भेंटें चढ़ाते और अपने पुत्रों को आग में से गुजारते हो[a], तब तुम आज तक अपनी सब मूर्तियों के साथ अपने आप को अशुद्ध करते आए हो। हे इस्राएल के घराने, क्या मैं तुम्हें मुझसे परामर्श करने दूँ? प्रभु याहवे की यह घोषणा है: मेरे जीवन की शपथ, मैं तुम्हें मुझसे परामर्श नहीं करने दूँगा[b]।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “पुत्रों को आग में से गुजारना” मूर्तिपूजक उपासना में बाल-बलि से जुड़ा इब्रानी वाक्यांश है।
    reason: cultural_note
  - marker: b
    text: 'इब्रानी में शपथ के साथ शब्दशः “यदि मैं तुम्हारे द्वारा पूछा जाऊँ” है; इस प्रसंग में यह एक प्रबल निषेध है: “मैं निश्चय ही तुम्हें मुझसे परामर्श नहीं करने दूँगा।”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבִשְׂאֵת מַתְּנֹתֵיכֶם
  choice: जब तुम अपनी भेंटें चढ़ाते
  rationale: नשׂא का मूल भाव ‘उठाना’ है, पर भेंटों के साथ यह उन्हें धार्मिक रीति से प्रस्तुत या अर्पित करने का अर्थ देता है। ‘भेंटें चढ़ाते’ आधुनिक हिन्दी में इस उपासना-संबंधी प्रयोग को स्वाभाविक रूप से व्यक्त करता है।
- source_word: בְּהַעֲבִיר בְּנֵיכֶם בָּאֵשׁ
  choice: अपने पुत्रों को आग में से पार कराते हो
  rationale: यह अनुवाद इब्रानी के स्पष्ट पुल्लिंग बहुवचन ‘पुत्रों’ और ‘आग में से पार कराना’—दोनों को बनाए रखता है। वाक्यांश मूर्तिपूजक बाल-बलि का संकेत देता है, पर मुख्य पाठ अनुष्ठान की विधि को स्रोत से अधिक स्पष्ट नहीं करता।
- source_word: אַתֶּם נִטְמְאִים
  choice: अपने आप को अशुद्ध करते आए हो
  rationale: निफ़अल रूप अशुद्ध हो जाने या अशुद्ध किए जाने का भाव रखता है। यहाँ लोगों के अपने कर्म कारण हैं, इसलिए हिन्दी का आत्मवाचक प्रयोग परिणाम और उत्तरदायित्व दोनों व्यक्त करता है; ‘करते आए हो’ עַד הַיּוֹם के साथ निरंतरता दिखाता है।
- source_word: לְכָל גִּלּוּלֵיכֶם
  choice: अपनी सारी मूर्तियों के द्वारा
  rationale: גִּלּוּלִים यहेजकेल में मूर्तियों के लिए तिरस्कारपूर्ण शब्द है। हिन्दी में ‘मूर्तियों’ अर्थ स्पष्ट रखता है, जबकि ‘के द्वारा’ अशुद्धि के साधन या संबंध को व्यक्त करता है।
- source_word: וַאֲנִי אִדָּרֵשׁ לָכֶם
  choice: क्या मैं तुम्हें मुझसे पूछने दूँ?
  rationale: דרשׁ का निफ़अल यहाँ परमेश्वर से परामर्श या उत्तर माँगने के लिए उसके पास आने का भाव देता है। प्रश्न आलंकारिक है और आगे आने वाली शपथपूर्ण मनाही की भूमिका बनता है।
- source_word: חַי אָנִי
  choice: मेरे जीवन की शपथ
  rationale: यह परमेश्वर की जीवित सत्ता पर आधारित गंभीर शपथ-सूत्र है। यह हिन्दी में ‘मेरे जीवन की शपथ’ से स्वाभाविक और गंभीर ढंग से व्यक्त होता है।
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: प्रभु याहवे की यह घोषणा है
  rationale: נְאֻם भविष्यद्वाणी की अधिकारपूर्ण घोषणा है। אֲדֹנָי को ‘प्रभु’ और परमेश्वर के व्यक्तिगत नाम יהוה को ‘याहवे’ के रूप में अलग-अलग सुरक्षित रखा गया है।
- source_word: אִם אִדָּרֵשׁ לָכֶם
  choice: मैं तुम्हें मुझसे पूछने नहीं दूँगा
  rationale: शपथ के बाद אִם वाला अपूर्ण सूत्र प्रबल निषेध व्यक्त करता है। शब्दशः ‘यदि’ रखने से हिन्दी में अधूरा या सशर्त अर्थ निकलता; स्पष्ट निषेध मूल मुहावरे की वास्तविक शक्ति देता है।
theological_decisions:
- issue: אֲדֹנָי יְהוִה में परमेश्वर के नाम का अनुवाद
  choice: प्रभु याहवे
  alternative: प्रभु परमेश्वर
  rationale: मूल पाठ में उपाधि אֲדֹנָי और व्यक्तिगत नाम יהוה दोनों हैं। ‘प्रभु याहवे’ इस भेद को बनाए रखता है और नाम को सामान्य उपाधि में विलीन नहीं करता।
- issue: בְּנֵיכֶם का लिंग और आशय
  choice: तुम्हारे पुत्रों
  alternative: तुम्हारे बच्चों
  rationale: इब्रानी में स्पष्ट रूप से ‘पुत्र’ का पुल्लिंग बहुवचन है। व्यापक सांस्कृतिक आशय बाल-बलि है, पर मुख्य पाठ स्रोत की लैंगिक विशिष्टता को बनाए रखता है।
- issue: अंतिम אִם-शपथ सूत्र की शक्ति
  choice: 'प्रबल निषेध: ‘मैं तुम्हें मुझसे पूछने नहीं दूँगा’'
  alternative: 'शब्दशः: ‘यदि मैं तुम्हारे द्वारा पूछा जाऊँ’'
  rationale: यह अधूरा शपथ-सूत्र किसी शर्त की संभावना नहीं, बल्कि दृढ़ मनाही व्यक्त करता है। अर्थपूर्ण निषेध मूल की धर्मवैचारिक कठोरता को न घटाता है, न उसमें अतिरिक्त कारण जोड़ता है।
translation_notes:
  register: भाषा आधुनिक, गंभीर और भविष्यद्वाणी-सुलभ रखी गई है। ‘हे इस्राएल के घराने’ संबोधन की औपचारिकता बनाए रखता है; बाकी वाक्यरचना सामान्य पाठक के लिए सीधी है। मुख्य पाठ में अनुष्ठान को स्रोत से अधिक विशिष्ट नहीं बनाया गया, जबकि सांस्कृतिक आशय पादटिप्पणी में स्पष्ट किया गया है।
