  text: וְ/הָֽ/עֹלָה֙ עַל ר֣וּחֲ/כֶ֔ם הָי֖וֹ לֹ֣א תִֽהְיֶ֑ה אֲשֶׁ֣ר אַתֶּ֣ם אֹמְרִ֗ים נִֽהְיֶ֤ה כַ/גּוֹיִם֙ כְּ/מִשְׁפְּח֣וֹת הָ/אֲרָצ֔וֹת לְ/שָׁרֵ֖ת עֵ֥ץ וָ/אָֽבֶן־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/020/032.yaml
  text: What is coming up in your mind will certainly not happen—that you say[a], ‘We will be like the nations, like the clans of the lands[d][c][b], serving wood and stone.’
translation:
  language: hi
  text: और जो बात तुम्हारे मन में उठ रही है, वह हरगिज़ पूरी नहीं होगी—तुम कहते हो, ‘हम राष्ट्रों के समान, देशों के कुलों के समान हो जाएँगे और लकड़ी और पत्थर की सेवा करेंगे।’[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘लकड़ी और पत्थर की सेवा’ का अर्थ यहाँ लकड़ी और पत्थर से बनी मूर्तियों की धार्मिक सेवा या पूजा करना है।
    reason: cultural_note
lexical_decisions:
- source_word: וְהָעֹלָה עַל רוּחֲכֶם
  choice: जो बात तुम्हारे मन में उठ रही है
  rationale: यह इब्रानी मुहावरा भीतर उठने वाले विचार या इरादे को व्यक्त करता है। ‘मन में उठ रही है’ मूल बिंब को रखते हुए आधुनिक हिन्दी में स्वाभाविक है।
- source_word: הָיוֹ לֹא תִהְיֶה
  choice: वह हरगिज़ पूरी नहीं होगी
  rationale: क्रिया के साथ infinitive absolute नकार को प्रबल बनाता है। ‘हरगिज़ ... नहीं’ इस दृढ़ निषेध को व्यक्त करता है; ‘पूरी नहीं होगी’ किसी सोची हुई योजना के घटित न होने के लिए स्वाभाविक हिन्दी है।
- source_word: אֲשֶׁר אַתֶּם אֹמְרִים
  choice: तुम कहते हो
  rationale: यह आगे दिए गए कथन को सीधे उद्धरण के रूप में प्रस्तुत करता है।
- source_word: נִהְיֶה
  choice: हम ... हो जाएँगे
  rationale: प्रथम पुरुष बहुवचन imperfect यहाँ इच्छित भावी दशा को व्यक्त करता है। ‘हो जाएँगे’ उस बनने की मंशा को सहज हिन्दी में दिखाता है।
- source_word: כַגּוֹיִם
  choice: राष्ट्रों के समान
  rationale: גּוֹיִם का संकेत आसपास के गैर-इस्राएली राष्ट्रों की ओर है। ‘राष्ट्र’ बाद के धार्मिक अर्थों से बचते हुए सामान्य अर्थ रखता है।
- source_word: כְּמִשְׁפְּחוֹת הָאֲרָצוֹת
  choice: दूसरे देशों के कुलों के समान
  rationale: מִשְׁפָּחוֹת सामाजिक वंश-समूहों या कुलों को दर्शाता है और הָאֲרָצוֹת बहुवचन में देशों/भूमियों को। ‘दूसरे’ हिन्दी में संदर्भ स्पष्ट करता है, यद्यपि मूल में पृथक शब्द के रूप में नहीं है।
- source_word: לְשָׁרֵת
  choice: सेवा करेंगे
  rationale: मूल क्रिया का सामान्य अर्थ ‘सेवा करना’ है। मूर्तिपूजक संदर्भ होने पर भी मुख्य पाठ में अधिक विशिष्ट ‘पूजा करना’ डालकर अर्थ को अनावश्यक रूप से सीमित नहीं किया गया।
- source_word: עֵץ וָאָבֶן
  choice: लकड़ी-पत्थर
  rationale: यह लकड़ी और पत्थर से बनी मूर्तियों के लिए तिरस्कारपूर्ण भौतिक संकेत है। हिन्दी का संयुक्त प्रयोग मूल की संक्षिप्तता और बल बनाए रखता है।
theological_decisions:
- issue: मूर्तियों के प्रति धार्मिक सेवा
  choice: लकड़ी-पत्थर की सेवा करेंगे
  alternative: लकड़ी-पत्थर की पूजा करेंगे
  rationale: संदर्भ निस्संदेह मूर्तिपूजा का है, पर इब्रानी क्रिया शाब्दिक रूप से ‘सेवा करना’ कहती है। मुख्य पाठ उसी व्यापक शब्द को रखता है और पादटिप्पणी संदर्भ स्पष्ट करती है।
- issue: רוּחַ से सूचित भीतरी क्षमता
  choice: मन
  alternative: आत्मा
  rationale: इस मुहावरे में רוּחַ व्यक्ति के भीतर उठने वाले विचार या इरादे को सूचित करता है। ‘मन’ यहाँ स्वाभाविक है और मानव आत्मा के विषय में कोई अनावश्यक सैद्धान्तिक निष्कर्ष नहीं जोड़ता।
- issue: दृढ़ ईश्वरीय निषेध
  choice: हरगिज़ पूरी नहीं होगी
  alternative: कभी घटित नहीं होगी
  rationale: infinitive absolute के कारण निषेध अत्यन्त emphatic है। अनुवाद उस निश्चितता को रखता है, बिना यह अतिरिक्त रूप से तय किए कि निषेध केवल इच्छा, योजना या उसके ऐतिहासिक क्रियान्वयन के किस पहलू पर लागू है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, सीधी और गरिमापूर्ण रखी गई है। ‘हरगिज़’ दृढ़ निषेध को सामान्य पाठक के लिए प्रभावी ढंग से व्यक्त करता है। ‘कुल’ सामाजिक वंश-समूह का भाव देता है, जबकि ‘लकड़ी-पत्थर’ मूल की मूर्तिविरोधी संक्षिप्तता बनाए रखता है।
