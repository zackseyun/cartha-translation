  yaml_path: translation/ot/ezekiel/020/018.yaml
  text: And I said to their children in the wilderness[a], ‘Do not walk in the statutes of your fathers, and do not keep their judgments, and do not defile yourselves with their idols.’
translation:
  language: hi
  text: और मैंने निर्जन प्रदेश में उनके बच्चों से कहा, “तुम अपने पुरखाओं की विधियों के अनुसार मत चलो, न उनके नियमों को मानो, और उनकी मूर्तियों[a] से अपने को अशुद्ध मत करो।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ प्रयुक्त इब्रानी शब्द גִּלּוּלִים मूर्तियों के लिए अत्यंत तिरस्कारपूर्ण शब्द है; इसका अनुवाद “घिनौनी मूर्तियाँ” या और भी तीखे रूप में “गोबर-जैसी मूर्तियाँ” किया जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֹמַר
  choice: और मैंने कहा
  rationale: वय्यिक्तोल रूप कथा की क्रमिक अगली क्रिया बताता है; ‘और मैंने कहा’ इस सरल प्रवाह को बनाए रखता है।
- source_word: בְּנֵיהֶם
  choice: उनके बच्चों
  rationale: בנים का अर्थ विशेष रूप से ‘बेटे’ भी हो सकता है, पर यहाँ पिछली पीढ़ी के बाद आने वाली पूरी पीढ़ी अभिप्रेत है; इसलिए ‘बच्चों’ अधिक स्वाभाविक और संदर्भानुकूल है।
- source_word: בַּמִּדְבָּר
  choice: जंगल में
  rationale: מִדְבָּר निर्जन वनप्रदेश या जंगल को दर्शाता है। निर्गमन के संदर्भ में ‘जंगल’ आधुनिक हिन्दी में स्वाभाविक बाइबलीय पद है।
- source_word: בְּחֻקֵּי
  choice: विधियों के अनुसार
  rationale: חֻקִּים निर्धारित विधियों या विधान को दर्शाता है। ‘के अनुसार चलना’ हिब्रू मुहावरे का अर्थ स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: אֲבוֹתֵיכֶם
  choice: अपने पुरखाओं
  rationale: शब्द व्याकरणतः पुल्लिंग बहुवचन है और यहाँ पिछली पीढ़ी को दर्शाता है। ‘पुरखाओं’ में पूर्वजों का पुल्लिंग और पीढ़ीगत भाव बना रहता है तथा यह आधुनिक हिन्दी में सहज है।
- source_word: אַל תֵּלֵכוּ
  choice: मत चलो
  rationale: הלך यहाँ किसी विधान के अनुसार आचरण करने का मुहावरा है। ‘के अनुसार मत चलो’ रूपक और आशय दोनों को बनाए रखता है।
- source_word: מִשְׁפְּטֵיהֶם
  choice: उनके नियमों
  rationale: מִשְׁפָּטִים यहाँ नियम या न्यायिक विधान हैं। ‘नियम’ स्वाभाविक है और חֻקִּים के लिए प्रयुक्त ‘विधियों’ से शब्दगत भेद बनाए रखता है।
- source_word: תִּשְׁמֹרוּ
  choice: न मानो
  rationale: व्यवस्था के साथ שׁמר का अर्थ उसका पालन करना है। ‘नियमों को मानना’ आधुनिक हिन्दी में स्पष्ट और सहज है।
- source_word: גִּלּוּלֵיהֶם
  choice: उनकी मूर्तियों
  rationale: גִּלּוּלִים मूर्तिपूजक प्रतिमाओं के लिए अत्यंत तिरस्कारपूर्ण शब्द है। मुख्य पाठ में ‘मूर्तियों’ अर्थ को स्पष्ट रखता है, जबकि इसकी अपमानसूचक तीव्रता पादटिप्पणी में दी गई है।
- source_word: תִּטַּמָּאוּ
  choice: अपने को अशुद्ध मत करो
  rationale: हित्पएल रूप आत्मवाची अर्थ देता है—उन मूर्तियों के कारण स्वयं अशुद्ध होना। यह हिन्दी रूप उस आत्मवाची तथा धार्मिक-अनुष्ठानिक अशुद्धता के भाव को स्पष्ट रखता है।
theological_decisions:
- issue: אֲבוֹתֵיכֶם में पूर्ववर्ती पीढ़ी का पुल्लिंग संबोधन
  choice: अपने पुरखाओं
  alternative: अपने पूर्वजों
  rationale: ‘पुरखाओं’ हिब्रू के पुल्लिंग बहुवचन और पिछली पीढ़ी के संदर्भ को बनाए रखता है, बिना इसे केवल निकट जैविक पिताओं तक सीमित किए।
- issue: גִּלּוּלִים की तिरस्कारपूर्ण शक्ति
  choice: मुख्य पाठ में ‘मूर्तियों’, और पादटिप्पणी में तिरस्कारपूर्ण अर्थ
  alternative: घिनौनी मूर्तियों / गोबर-जैसी मूर्तियों
  rationale: मूल शब्द का तिरस्कार वास्तविक और प्रबल है, पर उसे मुख्य पाठ में ‘गोबर-जैसी मूर्तियाँ’ कहना हिन्दी में व्याख्यात्मक और अस्वाभाविक लग सकता है। पादटिप्पणी अर्थ की तीव्रता को बिना दबाए सुरक्षित रखती है।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। ‘विधियों के अनुसार चलना’ हिब्रू रूपक को हिन्दी में बोधगम्य बनाता है; ‘विधियाँ’ और ‘नियम’ दो अलग हिब्रू कानूनी पदों का भेद बनाए रखते हैं। पादटिप्पणी-चिह्न उसी शब्द ‘मूर्तियों’ के बाद रखा गया है जिसकी शब्दार्थगत तीव्रता वह समझाता है।
