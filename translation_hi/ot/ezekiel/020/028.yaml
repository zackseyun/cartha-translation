  text: וָ/אֲבִיאֵ/ם֙ אֶל הָ/אָ֔רֶץ אֲשֶׁ֤ר נָשָׂ֨אתִי֙ אֶת יָדִ֔/י לָ/תֵ֥ת אוֹתָ֖/הּ לָ/הֶ֑ם וַ/יִּרְאוּ֩ כָל גִּבְעָ֨ה רָמָ֜ה וְ/כָל עֵ֣ץ עָבֹ֗ת וַ/יִּזְבְּחוּ שָׁ֤ם אֶת זִבְחֵי/הֶם֙ וַ/יִּתְּנוּ שָׁם֙ כַּ֣עַס קָרְבָּנָ֔/ם וַ/יָּשִׂ֣ימוּ שָׁ֗ם רֵ֚יחַ נִיח֣וֹחֵי/הֶ֔ם וַ/יַּסִּ֥יכוּ שָׁ֖ם אֶת נִסְכֵּי/הֶֽם־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/020/028.yaml
  text: So I brought them into the land that I had lifted up my hand to give to them[a], and they saw every high hill and every leafy tree, and there they sacrificed their sacrifices, and there they presented the provocation of their offering, and there they set their pleasing aromas[c][b], and there they poured out their drink offerings.
translation:
  language: hi
  text: इसलिए मैं उन्हें उस देश में ले आया, जिसे उन्हें देने के लिए मैंने अपना हाथ उठाया था[a]। वहाँ उन्होंने हर ऊँची पहाड़ी और घने पत्तों वाला हर पेड़ देखा। वहीं उन्होंने अपने बलिदान चढ़ाए, वहीं अपनी क्रोधोत्तेजक भेंट चढ़ाई[b], वहीं अपनी सुखदायक सुगंधें अर्पित कीं, और वहीं अपनी पेय-भेंटें उंडेली।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या, “जिसे उन्हें देने की मैंने शपथ खाई थी।” मूलतः: “जिसे उन्हें देने के लिए मैंने अपना हाथ उठाया था।”'
    reason: lexical_alternative
  - marker: b
    text: इब्रानी वाक्यांश मूलतः “उनकी भेंट का क्रोध/भड़काव” है; आशय है कि उनकी भेंट परमेश्वर को क्रोधित करने वाली थी।
    reason: cultural_note
lexical_decisions:
- source_word: וָאֲבִיאֵם
  choice: इसलिए मैं उन्हें ... ले आया
  rationale: हिफ़ील रूप का अर्थ ‘ले आना’ है; आरंभिक वाव पूर्ववर्ती प्रसंग के परिणामात्मक कथानक-प्रवाह को आगे बढ़ाता है, जिसे ‘इसलिए’ स्वाभाविक रूप से व्यक्त करता है।
- source_word: נָשָׂאתִי אֶת־יָדִי
  choice: मैंने अपना हाथ उठाया था
  rationale: यह शपथ लेने का मुहावरा है। मुख्य पाठ में इब्रानी बिंब सुरक्षित रखा गया है और पादटिप्पणी में उसका आशय स्पष्ट किया गया है।
- source_word: כָל גִּבְעָה רָמָה וְכָל עֵץ עָבֹת
  choice: हर ऊँची पहाड़ी और हर घना-पत्तेदार पेड़
  rationale: רָמָה का ठोस अर्थ ‘ऊँची’ है और עָבֹת घने/सघन पत्तों वाले वृक्ष का संकेत देता है। यह अनधिकृत उपासना-स्थलों की दृश्यात्मक भाषा को तकनीकी शब्दावली थोपे बिना बनाए रखता है।
- source_word: וַיִּזְבְּחוּ שָׁם אֶת־זִבְחֵיהֶם
  choice: वहीं उन्होंने अपने बलिदान चढ़ाए
  rationale: इब्रानी में सजातीय क्रिया और संज्ञा की पुनरुक्ति है; हिन्दी में ‘बलिदान चढ़ाए’ बलि-अर्पण की क्रिया को स्वाभाविक और स्पष्ट रूप से व्यक्त करता है।
- source_word: וַיִּתְּנוּ שָׁם כַּעַס קָרְבָּנָם
  choice: वहीं अपनी भेंट के द्वारा क्रोध भड़काया
  rationale: כַּעַס का अर्थ क्रोध या उत्तेजना/भड़काव है। संक्षिप्त इब्रानी वाक्यांश का आशय है कि उनकी भेंट परमेश्वर को क्रोधित करने वाली थी; हिन्दी में कर्म को स्पष्ट रूप से जोड़े बिना यही बल सुरक्षित रखा गया है।
- source_word: רֵיחַ נִיחוֹחֵיהֶם
  choice: अपनी सुखदायक सुगंधें
  rationale: यह बलिदान-संबंधी रूढ़ वाक्यांश है। बहुवचन-प्रत्यय को ‘सुगंधें’ द्वारा रखा गया है; प्रसंग में व्यंग्यात्मक तनाव भी बना रहता है क्योंकि ये मूर्तिपूजक अर्पण हैं।
- source_word: נִסְכֵּיהֶם
  choice: अपने अर्घ
  rationale: यहाँ शब्द उंडेली जाने वाली पेय-भेंटों को दर्शाता है। ‘अर्घ’ हिन्दी में धार्मिक रूप से अर्पित द्रव के लिए संक्षिप्त और बोधगम्य शब्द है; ‘उंडेले’ क्रिया उसके स्वरूप को स्पष्ट करती है।
theological_decisions:
- issue: नָשָׂא יָד शपथ-मुहावरे का अनुवाद
  choice: मैंने अपना हाथ उठाया था
  alternative: मैंने शपथ खाई थी
  rationale: मुख्य पाठ में मूल बिंब और दैवी शपथ की गंभीरता सुरक्षित है; अर्थ पादटिप्पणी में दिया गया है ताकि मुहावरे को चुपचाप सपाट न किया जाए।
- issue: मूर्तिपूजक भेंट और ‘सुखदायक सुगंध’ का तनाव
  choice: अपनी सुखदायक सुगंधें अर्पित कीं
  alternative: अपनी सुगंधित भेंटें चढ़ाईं
  rationale: मूल पाठ वही बलिदानी सूत्र इस्तेमाल करता है जो सामान्यतः स्वीकार्य भेंटों के लिए आता है। उसे बनाए रखने से इन अवैध अर्पणों के संदर्भ में निहित विडंबना और धार्मिक तनाव सुरक्षित रहता है।
- issue: כַּעַס קָרְבָּנָם में क्रोध का अव्यक्त लक्ष्य
  choice: अपनी भेंट के द्वारा क्रोध भड़काया
  alternative: अपनी भेंट से मुझे क्रोधित किया
  rationale: प्रसंग में क्रोधित होने वाला परमेश्वर है, पर इस वाक्यांश में ‘मुझे’ व्यक्त नहीं है। चुना गया रूप आशय बताता है, किंतु मूल से अतिरिक्त स्पष्ट कर्म नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सार्वजनिक-पाठ योग्य रूप अपनाया गया है। वाक्य-विन्यास सहज रखा गया है, जबकि शपथ का हाथ उठाने वाला बिंब, स्थानसूचक ‘वहीं’ की पुनरावृत्ति और बलिदानी भाषा का धर्मवैचारिक तनाव सुरक्षित रखा गया है।
