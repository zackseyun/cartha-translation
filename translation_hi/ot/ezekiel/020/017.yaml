  yaml_path: translation/ot/ezekiel/020/017.yaml
  text: But my eye spared them from destroying them[a], and I did not make a complete end of them in the wilderness.
translation:
  language: hi
  text: लेकिन मेरी आँख ने उन पर तरस खाया और उन्हें नाश होने से बचाया; मैंने मरुभूमि में उनका सर्वनाश नहीं किया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתָּחָס עֵינִי עֲלֵיהֶם
  choice: मेरी आँख ने उन पर तरस खाया
  rationale: हिब्रू में एकवचन ‘मेरी आँख’ कर्ता है और חוס करुणा दिखाते हुए विनाश से रोकने का भाव देता है। यह हिन्दी अभिव्यक्ति मूल की सजीव देहात्मक छवि को बनाए रखती है।
- source_word: מִשַּׁחֲתָם
  choice: और उन्हें नष्ट नहीं किया
  rationale: מן के साथ שׁחת का infinitive construct ‘उन्हें नष्ट करने से’ का अर्थ देता है। हिन्दी में पिछले खंड से स्वाभाविक रूप से जुड़ने के लिए निषेधात्मक परिणाम स्पष्ट किया गया है।
- source_word: וְלֹא עָשִׂיתִי אוֹתָם כָּלָה
  choice: मैंने उनका पूरी तरह अन्त नहीं किया
  rationale: עשה כלה पूर्ण विनाश या समूल अन्त करने का मुहावरा है। ‘पूरी तरह अन्त नहीं किया’ उस पूर्णता के बल को बनाए रखते हुए आधुनिक हिन्दी में स्पष्ट है।
- source_word: בַּמִּדְבָּר
  choice: जंगल में
  rationale: निर्गमन के प्रसंग में מִדְבָּר निर्जन वनप्रदेश को सूचित करता है; ‘जंगल’ हिन्दी बाइबलीय प्रयोग में परिचित और सहज है।
theological_decisions:
- issue: परमेश्वर की करुणा की देहात्मक अभिव्यक्ति
  choice: ‘मेरी आँख ने उन पर तरस खाया’ को बनाए रखा गया।
  alternative: ‘मैंने उन पर दया की’ या ‘मैंने उन्हें छोड़ दिया।’
  rationale: मूल पाठ जानबूझकर ‘मेरी आँख’ की सजीव छवि का प्रयोग करता है। इसे बनाए रखने से परमेश्वर की करुणामय रोक का आलंकारिक बल सुरक्षित रहता है, बिना उसे अमूर्त कथन में बदलने के।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सहज रखी गई है। ‘मेरी आँख’ की मूल सजीव छवि सुरक्षित है; फुटनोट शाब्दिक रचना स्पष्ट करता है।
