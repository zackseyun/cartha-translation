  text: וַ/יַּמְרוּ בִ֨/י בֵֽית יִשְׂרָאֵ֜ל בַּ/מִּדְבָּ֗ר בְּ/חֻקּוֹתַ֨/י לֹא הָלָ֜כוּ וְ/אֶת מִשְׁפָּטַ֣/י מָאָ֗סוּ אֲשֶׁר֩ יַעֲשֶׂ֨ה אֹתָ֤/ם הָֽ/אָדָם֙ וָ/חַ֣י בָּ/הֶ֔ם וְ/אֶת שַׁבְּתֹתַ֖/י חִלְּל֣וּ מְאֹ֑ד וָ/אֹמַ֞ר לִ/שְׁפֹּ֨ךְ חֲמָתִ֧/י עֲלֵי/הֶ֛ם בַּ/מִּדְבָּ֖ר לְ/כַלּוֹתָֽ/ם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/020/013.yaml
  text: But the house of Israel rebelled against me in the wilderness[a]. They did not walk in my statutes, and they rejected my judgments, which if a person does them, he will live by them. They greatly profaned my Sabbaths. Then I said I would pour out my wrath on them in the wilderness[c][b], to put an end to them.
translation:
  language: hi
  text: परन्तु इस्राएल के घराने ने निर्जन प्रदेश में मेरे विरुद्ध विद्रोह किया। वे मेरी विधियों के अनुसार नहीं चले और उन्होंने मेरे नियमों को ठुकरा दिया—जिनका पालन करके कोई मनुष्य जीवित रहेगा।[a] उन्होंने मेरे विश्राम-दिनों को बहुत अपवित्र किया। तब मैंने कहा कि मैं निर्जन प्रदेश में उन पर अपना प्रकोप उण्डेल दूँगा और उनका अन्त कर दूँगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यह कथन लैव्यव्यवस्था 18:5 की भाषा को दोहराता है। यहाँ ‘कोई मनुष्य’ सामान्य, प्रतिनिधिक एकवचन है और किसी भी मनुष्य को सूचित करता है।
    reason: cross_reference_and_lexical_clarification
lexical_decisions:
- source_word: וַיַּמְרוּ בִי
  choice: मेरे विरुद्ध विद्रोह किया
  rationale: यह प्रयोग परमेश्वर के विरुद्ध जानबूझकर किए गए विद्रोह को व्यक्त करता है; केवल ‘आज्ञा नहीं मानी’ इसकी वाचा-संबंधी तीव्रता घटा देता।
- source_word: בֵּית יִשְׂרָאֵל
  choice: इस्राएल का घराना
  rationale: भविष्यद्वाणी में प्रयुक्त सामूहिक पारिवारिक पदवी को बनाए रखता है।
- source_word: בַּמִּדְבָּר
  choice: निर्जन प्रदेश
  rationale: मִדְבָּר ऐसे उजाड़ और विरल आबादी वाले क्षेत्र को दर्शाता है; यह हिंदी में स्वाभाविक है और केवल रेतीले ‘रेगिस्तान’ का अनावश्यक अर्थ नहीं जोड़ता।
- source_word: בְּחֻקּוֹתַי לֹא הָלָכוּ
  choice: मेरी विधियों पर नहीं चले
  rationale: ‘चलना’ मूल के वाचा-संबंधी जीवन-आचरण वाले रूपक को बनाए रखता है।
- source_word: מִשְׁפָּטַי
  choice: मेरे नियम
  rationale: यहाँ कानूनी-वाचा संबंधी आदेश अभिप्रेत हैं; ‘नियम’ आधुनिक हिंदी में स्पष्ट और ‘विधियों’ से पर्याप्त भिन्न है।
- source_word: מָאָסוּ
  choice: ठुकरा दिया
  rationale: यह वाचा के नियमों को सक्रिय रूप से अस्वीकार करने की शक्ति को स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: אֲשֶׁר יַעֲשֶׂה אֹתָם הָאָדָם וָחַי בָּהֶם
  choice: जिनका पालन यदि कोई मनुष्य करे, तो वह उनके द्वारा जीवित रहेगा
  rationale: प्रतिनिधिक एकवचन और जीवन की वाचा-संबंधी प्रतिज्ञा दोनों सुरक्षित रहते हैं; वाक्य को किसी संकीर्ण धर्मवैज्ञानिक व्यवस्था के अनुसार नहीं समझाया गया।
- source_word: שַׁבְּתֹתַי
  choice: मेरे विश्राम-दिनों
  rationale: बहुवचन को बनाए रखते हुए ‘विश्राम-दिन’ सामान्य हिंदी पाठक के लिए अर्थ स्पष्ट करता है।
- source_word: חִלְּלוּ מְאֹד
  choice: बहुत अपवित्र किया
  rationale: क्रिया के पवित्रता-विरोधी अर्थ और מְאֹד की तीव्रता दोनों को सीधे व्यक्त करता है।
- source_word: לִשְׁפֹּךְ חֲמָתִי
  choice: अपना प्रकोप उण्डेल दूँगा
  rationale: ‘उण्डेलना’ मूल रूपक को और ‘प्रकोप’ न्यायपूर्ण तीव्र क्रोध को बनाए रखता है।
- source_word: לְכַלּוֹתָם
  choice: उनका अन्त कर दूँगा
  rationale: इस संदर्भ में पूर्ण विनाश की घोषित मंशा को स्पष्ट रूप से व्यक्त करता है।
theological_decisions:
- issue: הָאָדָם का प्रतिनिधिक एकवचन
  choice: कोई मनुष्य ... वह
  alternative: जो कोई ... वह; कोई व्यक्ति
  rationale: मूल का एकवचन और सार्वत्रिक मानवीय आशय दोनों बने रहते हैं; हिंदी में ‘मनुष्य’ सामान्य मानव का स्वाभाविक बोध देता है।
- issue: וָחַי בָּהֶם में जीवन की प्रतिज्ञा का आशय
  choice: वह उनके द्वारा जीवित रहेगा
  alternative: वह उनका पालन करके जीवन पाएगा; वह उनके कारण जीवित रहेगा
  rationale: यह लैव्यव्यवस्था 18:5 की सूत्रात्मक भाषा और उसके धर्मवैज्ञानिक तनाव को सुरक्षित रखता है, बिना ‘जीवन’ को केवल सांसारिक आयु या किसी विशिष्ट उद्धार-सिद्धांत तक सीमित किए।
- issue: לְכַלּוֹתָם में घोषित न्याय
  choice: उनका अन्त कर दूँगा
  alternative: उन्हें नष्ट कर दूँगा
  rationale: मूल की कठोरता को बनाए रखते हुए हिंदी में गरिमापूर्ण और स्पष्ट अभिव्यक्ति देता है।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण भविष्यद्वाणी शैली रखी गई है। ‘विधियों पर चलना,’ ‘विश्राम-दिनों को अपवित्र करना’ और ‘प्रकोप उण्डेलना’ जैसे मूल रूपक सुरक्षित हैं, पर अनावश्यक संस्कृतनिष्ठता से बचा गया है।
