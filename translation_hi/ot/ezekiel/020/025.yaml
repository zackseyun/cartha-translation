id: EZK.20.25
reference: Ezekiel 20:25
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/גַם אֲנִי֙ נָתַ֣תִּי לָ/הֶ֔ם חֻקִּ֖ים לֹ֣א טוֹבִ֑ים וּ/מִ֨שְׁפָּטִ֔ים לֹ֥א יִֽחְי֖וּ בָּ/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/020/025.yaml
  text: Moreover[b][a], I myself gave them statutes that were not good and ordinances by which they could not live.
translation:
  language: hi
  text: इसके अतिरिक्त, मैंने स्वयं उन्हें ऐसी विधियाँ दीं जो अच्छी नहीं थीं, और ऐसे नियम दिए जिनके द्वारा वे जीवित न रह सकें।[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या, अर्थ की व्याख्या करते हुए: “मैंने उन्हें ऐसी विधियों के वश में कर दिया जो अच्छी नहीं थीं।” इससे यह भाव सामने आता है कि यह नैतिक रूप से दोषपूर्ण व्यवस्था देने के बजाय न्यायस्वरूप किया गया कार्य था।'
    reason: alternative_reading
  - marker: b
    text: “उनके द्वारा जीवित रहना” वाचा से जुड़ी उस अभिव्यक्ति की ओर संकेत करता है जिसके अनुसार परमेश्वर की विधियों का पालन करने वाला उनके द्वारा जीवित रहेगा (लैव्यव्यवस्था 18:5 से तुलना करें)। यहाँ उसी अभिव्यक्ति को उलट दिया गया है।
    reason: cross_reference
lexical_decisions:
- source_word: וְגַם
  choice: इसके अतिरिक्त
  rationale: यह पिछले कथन से संबंध रखते हुए योगात्मक बल व्यक्त करता है; आधुनिक हिन्दी में स्वाभाविक और गरिमापूर्ण है।
- source_word: אֲנִי
  choice: मैंने स्वयं
  rationale: स्वतंत्र सर्वनाम אֲנִי क्रिया में पहले से निहित कर्ता पर विशेष बल देता है; ‘स्वयं’ उस बल को सुरक्षित रखता है।
- source_word: נָתַתִּי
  choice: दीं / दिए
  rationale: נתן का सीधा अर्थ ‘देना’ है। प्रसंग में न्यायिक अर्थ संभव है, पर उसे मुख्य पाठ में जोड़कर मूल कथन की धर्मवैचारिक तीक्ष्णता को कम नहीं किया गया।
- source_word: חֻקִּים
  choice: विधियाँ
  rationale: यह वाचा और व्यवस्था के प्रसंग में निर्धारित विधानों को दर्शाता है; ‘विधियाँ’ साधारण पाठक के लिए स्पष्ट और औपचारिक दोनों है।
- source_word: לֹא טוֹבִים
  choice: जो अच्छी नहीं थीं
  rationale: मूल के सीधे निषेध ‘अच्छी नहीं’ को बनाए रखा गया है; ‘बुरी’ कहने से अर्थ मूल शब्दों की अपेक्षा अधिक प्रबल हो जाता।
- source_word: וּמִשְׁפָּטִים
  choice: और ऐसे नियम
  rationale: מִשְׁפָּטִים यहाँ बाध्यकारी निर्णयों अथवा नियमों के अर्थ में है। ‘नियम’ विधिक भाव रखता है और आधुनिक हिन्दी में सहज है।
- source_word: לֹא יִחְיוּ בָּהֶם
  choice: जिनके द्वारा वे जीवित न रह सकें
  rationale: यह ‘उनके द्वारा जीवित रहना’ वाली वाचागत अभिव्यक्ति को उलटकर प्रस्तुत करता है। ‘न रह सकें’ प्रसंग के घातक परिणाम को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: क्या परमेश्वर द्वारा ‘अच्छी न होने वाली’ विधियाँ देने के कथन को केवल अनुमति के रूप में नरम किया जाए
  choice: मुख्य पाठ में सीधे कथन ‘मैंने स्वयं उन्हें ... विधियाँ दीं’ को रखा गया।
  alternative: ‘मैंने उन्हें उन विधियों के वश में कर दिया जो अच्छी नहीं थीं।’
  rationale: इब्रानी में परमेश्वर कर्ता है और נתן का सामान्य अर्थ ‘दिया’ है। न्यायिक रूप से वश में कर देने की व्याख्या संभव है, पर उसे मुख्य पाठ में डालना मूल की वास्तविक धर्मवैचारिक तनातनी को समय से पहले सुलझाना होगा।
- issue: इस पद और अन्यत्र परमेश्वर की अच्छी व्यवस्था के बीच संबंध
  choice: ‘अच्छी नहीं थीं’ का सीधा अनुवाद किया गया, बिना मुख्य पाठ में कोई सामंजस्यकारी व्याख्या जोड़े।
  alternative: इसे मूर्तिपूजक प्रथाओं अथवा न्यायस्वरूप हानिकारक विधानों के हवाले किए जाने के रूप में समझना।
  rationale: पद का कथन जानबूझकर तीखा है। अनुवाद में उसे सुरक्षित रखना और संभावित व्याख्या को पादटिप्पणी में देना मूल के प्रति अधिक निष्ठावान है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण और विधिक-वाचागत स्वर रखा गया है। ‘मैंने स्वयं’ से मूल का बल सुरक्षित है। मुख्य पाठ में कठिन धर्मवैचारिक कथन को नरम नहीं किया गया; व्याख्यात्मक संभावना पादटिप्पणी में दी गई है।
