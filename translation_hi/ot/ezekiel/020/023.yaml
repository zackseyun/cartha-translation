base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/020/023.yaml
  text: Moreover[a], I also raised my hand to them in the wilderness, to scatter them among the nations and disperse them through the lands.
translation:
  language: hi
  text: इसके अलावा, मैंने भी जंगल में उनसे यह शपथ खाई[a] कि मैं उन्हें राष्ट्रों के बीच तितर-बितर कर दूँगा और देशों में छितरा दूँगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “मैंने जंगल में उनके लिए अपना हाथ उठाया।” यह हिब्रू शपथ लेने का मुहावरा है।
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם אֲנִי
  choice: फिर मैंने भी
  rationale: यह पद पिछले कथन में एक और गंभीर घोषणा जोड़ता है। ‘फिर’ क्रम को और ‘भी’ हिब्रू के योगात्मक बल को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: נָשָׂאתִי אֶת יָדִי
  choice: अपना हाथ उठाया
  rationale: मुख्य पाठ में हिब्रू का ठोस बिंब सुरक्षित रखा गया है; इस प्रसंग में यह शपथ लेने का मुहावरा है, जिसे पादटिप्पणी स्पष्ट करती है।
- source_word: לָהֶם
  choice: उनके सामने
  rationale: शाब्दिक ‘उनके लिए/उनकी ओर’ हिन्दी में भ्रामक हो सकता है। ‘उनके सामने’ उस समुदाय को शपथ के संबोधित पक्ष के रूप में स्वाभाविक ढंग से दिखाता है।
- source_word: בַּמִּדְבָּר
  choice: जंगल में
  rationale: यह इस्राएल की जंगल-यात्रा के ऐतिहासिक परिवेश के लिए प्रचलित, सहज बाइबलीय हिन्दी है।
- source_word: לְהָפִיץ
  choice: तितर-बितर कर दूँगा
  rationale: हिफ़ील रूप के कारण कराए गए बिखराव का भाव स्पष्ट होता है और न्याय की घोषणा का बल बना रहता है।
- source_word: בַּגּוֹיִם
  choice: जातियों के बीच
  rationale: גּוֹיִם यहाँ इस्राएल के बाहर की विभिन्न जातियों या राष्ट्रों को सूचित करता है; ‘जातियों’ बाद के धार्मिक वर्गीकरण को आरोपित नहीं करता।
- source_word: וּלְזָרוֹת
  choice: छितरा दूँगा
  rationale: यह पहले क्रियापद के समानांतर बिखराव का भाव रखता है, पर उसी शब्द को दोहराए बिना दूसरे हिब्रू क्रियापद की अलग अभिव्यक्ति देता है।
- source_word: בָּאֲרָצוֹת
  choice: अलग-अलग देशों में
  rationale: बहुवचन को स्पष्ट रखते हुए अनेक भूभागों में फैलाए जाने का अर्थ स्वाभाविक आधुनिक हिन्दी में व्यक्त होता है।
theological_decisions:
- issue: शपथ के मुहावरे को सीधे ‘मैंने शपथ खाई’ कहना या हाथ उठाने का हिब्रू बिंब बनाए रखना
  choice: मुख्य पाठ में ‘अपना हाथ उठाया’ रखकर पादटिप्पणी में शपथ का अर्थ स्पष्ट किया गया है।
  alternative: मैंने उनसे शपथ खाई
  rationale: इससे मूल का विधिक और वाचागत बिंब सुरक्षित रहता है, जबकि पादटिप्पणी पाठक को मुहावरे का आशय बताती है और व्याख्या को चुपचाप मुख्य पाठ में नहीं मिलाती।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘तितर-बितर’ और ‘छितरा’ समानांतर क्रियाओं की निकटता के साथ उनका हल्का भेद भी बनाए रखते हैं।
