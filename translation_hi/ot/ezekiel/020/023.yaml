- from: फिर मैंने भी जंगल में उनके सामने अपना हाथ उठाया[a] कि मैं उन्हें जातियों के बीच तितर-बितर कर दूँगा और अलग-अलग देशों में छितरा दूँगा।
  to: इसके अलावा, मैंने भी जंगल में उनसे यह शपथ खाई[a] कि मैं उन्हें राष्ट्रों के बीच तितर-बितर कर दूँगा और देशों में छितरा दूँगा।
  rationale: The revision renders the Hebrew oath formula by its established sense in natural modern Hindi, while the footnote preserves the literal raised-hand wording and identifies it as an idiom. It also replaces the potentially ambiguous 'जातियों' with 'राष्ट्रों' and retains the distinct paired actions of scattering and dispersing.
