review_pass:
  verdict: revise
  source_fidelity: 'The draft correctly conveys the divine oath''s prospective content: scattering among the nations and dispersal through multiple lands. However, ''उनके सामने'' (''before them'') does not adequately represent לָהֶם in this oath idiom, whose recipients are ''them/to them''; it also leaves the raised-hand action liable to be understood as a mere gesture rather than an oath.'
  naturalness: The judgment sentence is clear and appropriately solemn. 'फिर' is acceptable, but 'इसके अलावा' more directly expresses the additive force of גַּם. Rendering the Hebrew oath idiom explicitly in the Hindi main text is substantially more natural than a literal raised-hand formulation, which would be opaque or potentially misleading in modern Hindi.
  terminology: '''राष्ट्रों'' is preferable to ''जातियों'' here for גּוֹיִם, since in contemporary Hindi ''जातियों'' can suggest caste groups. ''देशों'' suitably represents the plural ''lands.'' The footnote preserves the literal hand-raising image and explains its oath sense without imposing a doctrinal interpretation.'
  issues:
  - severity: medium
    issue: '''उनके सामने'' is used for לָהֶם, both in the verse and footnote.'
    rationale: The Hebrew construction in Ezekiel is an oath formula meaning that God swore to them/concerning them. 'Before them' shifts the relation to physical presence and does not make the oath’s addressees clear.
  - severity: low
    issue: '''जातियों'' may be misunderstood in modern Hindi.'
    rationale: For nations/peoples in an exile-scattering context, 'राष्ट्रों' is clearer and avoids the common modern caste-related sense of 'जाति.'
  - severity: low
    issue: The literal raised-hand idiom is retained in the main text without a sufficiently natural Hindi oath cue.
    rationale: Unlike the Hebrew conventional oath formula, 'उनके सामने अपना हाथ उठाया' can be read as a non-oath gesture. An explicit oath in the main text, with the literal expression in a footnote, better preserves the source sense in idiomatic Hindi.
  revised_text: इसके अलावा, मैंने भी जंगल में उनसे यह शपथ खाई[a] कि मैं उन्हें राष्ट्रों के बीच तितर-बितर कर दूँगा और देशों में छितरा दूँगा।
