source:
  edition: WLC
  text: בַּ/יּ֣וֹם הַ/ה֗וּא נָשָׂ֤אתִי יָדִ/י֙ לָ/הֶ֔ם לְ/הֽוֹצִיאָ֖/ם מֵ/אֶ֣רֶץ מִצְרָ֑יִם אֶל אֶ֜רֶץ אֲשֶׁר תַּ֣רְתִּי לָ/הֶ֗ם זָבַ֤ת חָלָב֙ וּ/דְבַ֔שׁ צְבִ֥י הִ֖יא לְ/כָל הָ/אֲרָצֽוֹת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/020/006.yaml
  text: On that day I raised my hand to them[a], to bring them out from the land of Egypt into a land that I had searched out for them, flowing with milk and honey[c][b]; it is the glory of all lands.
translation:
  language: hi
  text: उस दिन मैंने उनके सामने अपना हाथ उठाया[a], कि मैं उन्हें मिस्र देश से निकालकर उस देश में ले आने के लिए, जिसे मैंने उनके लिए खोज निकाला था[b]—जो दूध और मधु से बहता है और सब देशों का गौरव है[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात्, मैंने उनसे शपथ खाई या दृढ़ प्रतिज्ञा की।
    reason: मुहावरे का शपथ-संबंधी अर्थ स्पष्ट करना।
  - marker: b
    text: या “जिसे मैंने उनके लिए चुन रखा था”; इब्रानी क्रिया का शाब्दिक अर्थ “खोज निकालना” या “पता लगाना” है।
    reason: मूल क्रिया की वास्तविक अर्थ-सीमा बताना।
  - marker: c
    text: या “सब देशों की शोभा/शान।”
    reason: צְבִי के वैकल्पिक अर्थों को सुरक्षित रखना।
lexical_decisions:
- source_word: נָשָׂאתִי יָדִי לָהֶם
  choice: मैंने उनके सामने अपना हाथ उठाया
  rationale: हाथ उठाने की ठोस इब्रानी छवि को बनाए रखा गया है; प्रसंग में यह शपथ लेने या दृढ़ प्रतिज्ञा करने का संकेत है। לָהֶם को स्वाभाविक हिन्दी में ‘उनके सामने’ कहा गया है।
- source_word: לְהוֹצִיאָם מֵאֶרֶץ מִצְרָיִם
  choice: उन्हें मिस्र देश से निकालकर
  rationale: हिफ़ील रूप का कारक अर्थ ‘निकालना’ सहज हिन्दी में निर्गमन की गति व्यक्त करता है।
- source_word: אֶל אֶרֶץ אֲשֶׁר תַּרְתִּי לָהֶם
  choice: उस देश में ले जाऊँ जिसे मैंने उनके लिए खोज निकाला था
  rationale: תור के खोजने/पता लगाने के अर्थ को रखा गया है; ‘चुन रखा था’ अधिक व्याख्यात्मक होता और मूल की मानव-सदृश अभिव्यक्ति को समतल कर देता।
- source_word: זָבַת חָלָב וּדְבַשׁ
  choice: दूध और मधु की धाराएँ बहाने वाला देश
  rationale: समृद्धि और उर्वरता की परिचित इब्रानी उपमा को स्वाभाविक और चित्रात्मक हिन्दी में व्यक्त किया गया है।
- source_word: צְבִי הִיא לְכָל הָאֲרָצוֹת
  choice: सब देशों का गौरव
  rationale: צְבִי के गौरव, शोभा और वैभव संबंधी अर्थ-क्षेत्र को संक्षिप्त ऊँची शैली में सुरक्षित रखा गया है।
theological_decisions:
- issue: תַּרְתִּי में परमेश्वर का मानव-सदृश वर्णन
  choice: जिसे मैंने उनके लिए खोज निकाला था
  alternative: जिसे मैंने उनके लिए चुन रखा था
  rationale: मूल क्रिया की खोजने या पता लगाने की छवि को बनाए रखा गया है, बिना यह निष्कर्ष निकाले कि परमेश्वर को पहले उस देश का ज्ञान नहीं था।
- issue: हाथ उठाने की शपथ-सूचक क्रिया
  choice: अपना हाथ उठाया
  alternative: उनसे शपथ खाई
  rationale: मूल की प्रत्यक्ष शारीरिक छवि रखी गई है और पादटिप्पणी में उसके शपथ-संबंधी आशय को स्पष्ट किया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी; गरिमापूर्ण पर सामान्य पाठक के लिए सहज। मूल की शपथ-सूचक हाथ उठाने की छवि, खोजने की मानव-सदृश भाषा और भूमि के गौरव की काव्यात्मक अभिव्यक्ति को बनाए रखा गया है।
