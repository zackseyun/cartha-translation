revisions:
- from: मैं तुम्हें जाति-जाति के लोगों के बीच से निकाल लाऊँगा और उन देशों से तुम्हें इकट्ठा करूँगा जहाँ तुम तितर-बितर हो गए हो। यह मैं सामर्थी हाथ, बढ़ाई हुई भुजा और उंडेले गए प्रकोप के साथ करूँगा।
  to: मैं तुम्हें जातियों में से निकाल लाऊँगा और उन देशों से इकट्ठा करूँगा जहाँ तुम तितर-बितर हो गए हो—बलवन्त हाथ, फैलाई हुई भुजा और उंडेले हुए प्रकोप के साथ।
  rationale: The revision corrects the rendering of the outstretched-arm idiom, streamlines the expression for ‘peoples,’ and retains the source’s deliberate conjunction of regathering, exodus-like divine power, and poured-out wrath. It does not resolve the verse’s restoration-and-judgment tension.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T02:29:54Z'
review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the two divine actions (bringing out and gathering), the places of dispersion, and the three accompanying expressions of power and judgment. However, 'बढ़ाई हुई भुजा' is not an idiomatic rendering of 'outstretched arm'; it can suggest an enlarged arm rather than an arm extended in action. The revision uses 'फैलाई हुई भुजा.'
  naturalness: ‘जाति-जाति के लोगों के बीच से’ is somewhat cumbersome in modern standard Hindi. ‘जातियों में से’ is concise, natural, and retains the plural sense. A single coordinated sentence also more closely reflects the Hebrew construction without reducing clarity.
  terminology: ‘बलवन्त हाथ’ and ‘फैलाई हुई भुजा’ retain the recognizable exodus-style formula while using natural Hindi. ‘उंडेले हुए प्रकोप’ preserves the image of poured-out wrath and its judgmental force. No footnote is required for fidelity in this Hindi rendering.
  issues:
  - severity: medium
    issue: ‘बढ़ाई हुई भुजा’ is semantically and idiomatically unsuitable for ‘outstretched arm.’
    rationale: The Hebrew נְטוּיָה means extended or stretched out. In Hindi, ‘बढ़ाई हुई’ ordinarily means increased/enlarged; ‘फैलाई हुई भुजा’ conveys the intended physical and metaphorical image.
  - severity: low
    issue: ‘जाति-जाति के लोगों के बीच से’ is unnecessarily heavy.
    rationale: The source has ‘from the peoples,’ not specifically ‘from among people of each caste/ethnicity.’ ‘जातियों में से’ is a standard, clear equivalent that contrasts well with ‘देशों से.’
  revised_text: मैं तुम्हें जातियों में से निकाल लाऊँगा और उन देशों से इकट्ठा करूँगा जहाँ तुम तितर-बितर हो गए हो—बलवन्त हाथ, फैलाई हुई भुजा और उंडेले हुए प्रकोप के साथ।
  revised_footnotes: []
  revision_rationale: The revision corrects the rendering of the outstretched-arm idiom, streamlines the expression for ‘peoples,’ and retains the source’s deliberate conjunction of regathering, exodus-like divine power, and poured-out wrath. It does not resolve the verse’s restoration-and-judgment tension.
