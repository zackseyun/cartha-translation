reference: Ezekiel 20:34
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/הוֹצֵאתִ֤י אֶתְ/כֶם֙ מִן הָ֣/עַמִּ֔ים וְ/קִבַּצְתִּ֣י אֶתְ/כֶ֔ם מִן הָ֣/אֲרָצ֔וֹת אֲשֶׁ֥ר נְפוֹצֹתֶ֖ם בָּ֑/ם בְּ/יָ֤ד חֲזָקָה֙ וּ/בִ/זְר֣וֹעַ נְטוּיָ֔ה וּ/בְ/חֵמָ֖ה שְׁפוּכָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/020/034.yaml
  text: I will bring you out from the peoples and gather you from the lands where you have been scattered[c][b][a], with a strong hand and an outstretched arm and with wrath poured out.
translation:
  language: hi
  text: मैं तुम्हें जातियों में से निकाल लाऊँगा और उन देशों से इकट्ठा करूँगा जहाँ तुम तितर-बितर हो गए हो—बलवन्त हाथ, फैलाई हुई भुजा और उंडेले हुए प्रकोप के साथ।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהוֹצֵאתִי
  choice: मैं ... निकाल लाऊँगा
  rationale: हिफ़ील रूप का अर्थ ‘बाहर निकालना/ले आना’ है। यह स्वाभाविक हिन्दी में निर्गमन-जैसी निर्णायक दैवी कार्रवाई को बनाए रखता है।
- source_word: הָעַמִּים
  choice: जाति-जाति के लोग
  rationale: बहुवचन עַמִּים विभिन्न जनसमुदायों को सूचित करता है। यह प्रयोग ‘देशों’ से भेद बनाए रखते हुए आधुनिक हिन्दी में स्पष्ट है।
- source_word: וְקִבַּצְתִּי
  choice: इकट्ठा करूँगा
  rationale: קבץ बिखरे हुए लोगों को फिर से एकत्र करने का सामान्य क्रियापद है; ‘इकट्ठा करना’ सहज और सटीक है।
- source_word: הָאֲרָצוֹת
  choice: देशों
  rationale: यहाँ बहुवचन אֲרָצוֹת निर्वासन के विभिन्न भूभागों या देशों को दर्शाता है; ‘देशों’ सामान्य पाठक के लिए स्वाभाविक है।
- source_word: אֲשֶׁר נְפוֹצֹתֶם בָּם
  choice: जहाँ तुम तितर-बितर हो गए हो
  rationale: נפץ का निफ़ाल रूप बिखर जाने की निष्पन्न अवस्था बताता है। ‘तितर-बितर हो गए हो’ पूर्व घटना और वर्तमान दशा दोनों व्यक्त करता है।
- source_word: בְּיָד חֲזָקָה
  choice: सामर्थी हाथ के साथ
  rationale: शाब्दिक भाव ‘मज़बूत/शक्तिशाली हाथ’ है। ‘सामर्थी हाथ’ गरिमापूर्ण हिन्दी में निर्गमन-सूत्र की दैवी शक्ति को व्यक्त करता है।
- source_word: וּבִזְרֹעַ נְטוּיָה
  choice: बढ़ाई हुई भुजा के साथ
  rationale: यह निर्णायक दैवी कार्रवाई का स्थापित बाइबलीय बिंब है और मूल अभिव्यक्ति के दृश्य रूप को सुरक्षित रखता है।
- source_word: וּבְחֵמָה שְׁפוּכָה
  choice: उंडेले गए प्रकोप के साथ
  rationale: חֵמָה तीव्र क्रोध या प्रकोप और שְׁפוּכָה उंडेले जाने को दर्शाता है। यह चयन न्याय की तीव्रता को बिना नरम किए बनाए रखता है।
theological_decisions:
- issue: पुनः एकत्र करने में निर्गमन का बिंब और न्याय का प्रकोप दोनों
  choice: ‘सामर्थी हाथ’, ‘बढ़ाई हुई भुजा’ और ‘उंडेले गए प्रकोप’—तीनों को स्पष्ट रखा गया है।
  alternative: इसे केवल छुटकारे की भाषा में गतिशील रूप से प्रस्तुत करना, या न्याय के पक्ष को हल्का करना।
  rationale: इब्रानी पाठ निर्गमन-सूत्र को याद दिलाता है, पर इसी कार्य को उंडेले गए प्रकोप से भी जोड़ता है। अनुवाद पुनर्स्थापना और न्याय के इस तनाव को सुलझाने के बजाय सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सरल शैली। लंबी इब्रानी समन्वयी रचना को स्पष्टता के लिए दो वाक्यों में रखा गया है; दूसरे वाक्य का ‘यह मैं ... करूँगा’ मूल के साधन-सूचक पदों को स्वाभाविक हिन्दी में पहले कथन से जोड़ता है।
