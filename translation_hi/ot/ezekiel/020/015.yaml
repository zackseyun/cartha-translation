source:
  edition: WLC
  text: וְ/גַם אֲנִ֗י נָשָׂ֧אתִי יָדִ֛/י לָ/הֶ֖ם בַּ/מִּדְבָּ֑ר לְ/בִלְתִּי֩ הָבִ֨יא אוֹתָ֜/ם אֶל הָ/אָ֣רֶץ אֲשֶׁר נָתַ֗תִּי זָבַ֤ת חָלָב֙ וּ/דְבַ֔שׁ צְבִ֥י הִ֖יא לְ/כָל הָ/אֲרָצֽוֹת־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/020/015.yaml
  text: Yet I myself also raised my hand to them in the wilderness[a], that I would not bring them into the land that I had given them, flowing with milk and honey[b], the glory of all lands.
translation:
  language: hi
  text: और मैंने भी जंगल में उनकी ओर अपना हाथ उठाया[a] कि मैं उन्हें उस भूमि में न ले जाऊँगा जो मैंने दी थी—दूध और मधु से बहती हुई, जो सब देशों का गौरव[b] है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, ‘अपना हाथ उठाया।’ यह शपथ का मुहावरा है; इसका अर्थ ‘मैंने शपथ खाई’ या ‘मैंने शपथपूर्वक कहा’ भी किया जा सकता है।
    reason: lexical_alternative
  - marker: b
    text: या, ‘शोभा’ अथवा ‘वैभव।’
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם
  choice: और मैंने भी
  rationale: ‘और’ योगसूचक संबंध तथा ‘भी’ גַּם का बल बनाए रखते हैं; इससे पिछले प्रसंग से जुड़ी हल्की विरोधात्मक प्रगति को बिना बढ़ाए व्यक्त किया गया है।
- source_word: נָשָׂאתִי יָדִי לָהֶם
  choice: उनके सामने अपना हाथ उठाया
  rationale: मूल की ठोस शपथ-संबंधी भंगिमा को मुख्य पाठ में रखा गया है। हिन्दी में ‘उनके सामने’ यह स्पष्ट करता है कि यह हाथ उठाना उन्हीं को संबोधित घोषणा थी, न कि उन पर प्रहार की मुद्रा।
- source_word: בַּמִּדְבָּר
  choice: जंगल में
  rationale: बाइबलीय प्रसंग में ‘जंगल’ निर्जन वन्य प्रदेश का स्वाभाविक और प्रचलित हिन्दी पद है; यह केवल रेतीले मरुस्थल का अर्थ नहीं बाँधता।
- source_word: לְבִלְתִּי הָבִיא אוֹתָם
  choice: कि मैं उन्हें ... नहीं ले जाऊँगा
  rationale: यह शपथ की विषय-वस्तु और उसके भावी निषेध को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: הָאָרֶץ אֲשֶׁר נָתַתִּי
  choice: उस देश में, जिसे मैंने उन्हें दिया था
  rationale: ‘दिया था’ जंगल में की गई घोषणा से पहले दिए गए दान/अनुदान का पूर्वकालिक दृष्टिकोण व्यक्त करता है; ‘उन्हें’ निहित प्राप्तकर्ताओं को स्पष्ट करता है।
- source_word: זָבַת חָלָב וּדְבַשׁ
  choice: जिसमें दूध और मधु की धाराएँ बहती हैं
  rationale: हिब्रू कृदन्तीय मुहावरे की समृद्धि और निरंतर बहाव की छवि को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: צְבִי הִיא לְכָל הָאֲרָצוֹת
  choice: जो सब देशों का गौरव है
  rationale: צְבִי की वांछनीय सुंदरता, वैभव और श्रेष्ठता को ऊँचे किंतु सुबोध स्तर पर व्यक्त करता है तथा मूल की संबंधसूचक रचना को बनाए रखता है।
theological_decisions:
- issue: नָשָׂאתִי יָדִי में शपथ का अर्थ कितना स्पष्ट किया जाए
  choice: मुख्य पाठ में ‘अपना हाथ उठाया’ की ठोस उपमा रखना
  alternative: ‘शपथ खाई’ कहना
  rationale: हिब्रू शपथ-मुहावरे की स्रोतभाषीय छवि संरक्षित रहती है; उसके आशय को पादटिप्पणी में स्पष्ट करने से केवल एक व्याख्यात्मक रूप को मुख्य पाठ पर नहीं थोपा जाता।
- issue: नָתַתִּי का काल और देश के दिए जाने का भाव
  choice: ‘जिसे मैंने उन्हें दिया था’
  alternative: ‘जिसे मैंने उन्हें दिया’
  rationale: यह जंगल की शपथ के दृष्टिकोण से पहले हो चुके दान को दर्शाता है, पर ‘प्रतिज्ञा की थी’ जोड़कर दान और प्रतिज्ञा के बीच कोई अतिरिक्त धर्मवैज्ञानिक भेद नहीं बनाता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध शैली रखी गई है। लंबी हिब्रू संबंधसूचक रचना को स्पष्ट करने के लिए डैश और ‘उस देश में’ की पुनरुक्ति प्रयुक्त हुई है। सभी पादटिप्पणी-चिह्न संबंधित शब्दों के तुरंत बाद दिए गए हैं।
