source:
  edition: WLC
  text: בֶּן אָדָ֗ם דַּבֵּ֞ר אֶת זִקְנֵ֤י יִשְׂרָאֵל֙ וְ/אָמַרְתָּ֣ אֲלֵ/הֶ֔ם כֹּ֤ה אָמַר֙ אֲדֹנָ֣/י יְהוִ֔ה הֲ/לִ/דְרֹ֥שׁ אֹתִ֖/י אַתֶּ֣ם בָּאִ֑ים חַי אָ֨נִי֙ אִם אִדָּרֵ֣שׁ לָ/כֶ֔ם נְאֻ֖ם אֲדֹנָ֥/י יְהוִֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/020/003.yaml
  text: 'Son of man[a], speak to the elders of Israel and say to them, Thus says the Lord GOD: Is it to inquire of me that you have come? As I live, I will not be inquired of by you[b], declares the Lord GOD.'
translation:
  language: hi
  text: '“हे मनुष्य के पुत्र, इस्राएल के बुज़ुर्गों से बात कर और उनसे कह, ‘प्रभु याहवे यों कहते हैं: क्या तुम मुझसे परामर्श करने[a] आए हो? मेरे जीवन की शपथ, मैं तुम्हें मुझसे परामर्श करने नहीं दूँगा[b]—प्रभु याहवे की यही घोषणा है।’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ “परामर्श करने” का अर्थ परमेश्वर से वचन, निर्णय या मार्गदर्शन जानने के लिए पूछताछ करना है।
    reason: lexical_alternative
  - marker: b
    text: 'इब्रानी में शाब्दिक रूप से, “मेरे जीवन की शपथ, यदि मैं तुम्हारे द्वारा पूछा जाऊँ…”। शपथ के बाद यह अधूरा शर्त-वाक्य प्रबल निषेध व्यक्त करता है: परमेश्वर उनसे परामर्श किए जाने से इनकार करते हैं।'
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן אָדָם
  choice: हे मनुष्य के पुत्र
  rationale: यहेजकेल को संबोधित करने वाला नियमित इब्रानी पदबंध है। यह मूल रूपक को बनाए रखते हुए स्वाभाविक हिन्दी संबोधन देता है।
- source_word: זִקְנֵי יִשְׂרָאֵל
  choice: इस्राएल के पुरनियों
  rationale: यह किसी सामान्य वृद्ध समूह के बजाय इस्राएल के मान्य अगुओं को सूचित करता है; ‘पुरनियों’ इस बाइबलीय पद के लिए संक्षिप्त और प्रतिष्ठित हिन्दी है।
- source_word: כֹּה אָמַר אֲדֹנָי יְהוִה
  choice: प्रभु याहवे यह कहते हैं
  rationale: भविष्यद्वक्ताओं की संदेशवाहक-शैली को स्वाभाविक हिन्दी में व्यक्त करता है और אֲדֹנָי तथा परमेश्वर के निज नाम יְהוָה, दोनों को बनाए रखता है।
- source_word: הֲלִדְרֹשׁ אֹתִי
  choice: क्या तुम मुझसे पूछने आए हो
  rationale: דרשׁ यहाँ सामान्य आध्यात्मिक खोज नहीं, बल्कि परमेश्वर से वचन या निर्णय जानने के लिए पूछने का भाव रखता है।
- source_word: חַי אָנִי
  choice: मेरे जीवन की शपथ
  rationale: ईश्वरीय शपथ-सूत्र का गंभीर और स्पष्ट हिन्दी रूप है; इसका अर्थ ‘जैसा कि मैं जीवित हूँ’ है।
- source_word: אִם אִדָּרֵשׁ לָכֶם
  choice: मैं तुम्हें मुझसे पूछने नहीं दूँगा
  rationale: शपथ के बाद אִם प्रबल निषेध व्यक्त करता है। हिन्दी में सक्रिय-वाक्य रचना मूल निषेध और पहले आए ‘पूछने’ से शब्दगत संबंध दोनों को स्पष्ट रखती है।
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: प्रभु याहवे की यही घोषणा है
  rationale: नְאֻם की आधिकारिक, भविष्यद्वाणी-संबंधी वाणी का बल बनाए रखते हुए आधुनिक हिन्दी में स्वाभाविक है।
theological_decisions:
- issue: संयुक्त उपाधि אֲדֹנָי יְהוִה में परमेश्वर के निज नाम का अनुवाद
  choice: प्रभु याहवे
  alternative: प्रभु यहोवा; प्रभु परमेश्वर
  rationale: ‘याहवे’ चार अक्षरों वाले इब्रानी निज नाम को पारदर्शी ढंग से प्रस्तुत करता है, जबकि ‘प्रभु’ אֲדֹנָי को व्यक्त करता है; इससे दोनों पद एक में नहीं मिलते।
- issue: शपथ के बाद אִם का बल
  choice: 'स्पष्ट और प्रबल निषेध: ‘मैं तुम्हें मुझसे पूछने नहीं दूँगा’'
  alternative: 'शाब्दिक अधूरा शर्त-वाक्य: ‘यदि मैं तुमसे पूछे जाने दूँ…’'
  rationale: इब्रानी शपथ-रचना में अघोषित दंड सहित אִם दृढ़ निषेध का मुहावरा है। हिन्दी में सीधे निषेध से आशय स्पष्ट होता है, जबकि टिप्पणी मूल रचना को सुरक्षित करती है।
translation_notes:
  register: भाषा आधुनिक, गंभीर और सार्वजनिक पाठ के योग्य रखी गई है। भविष्यद्वाणी की संदेशवाहक शैली सुरक्षित है। ‘पूछने’ की पुनरावृत्ति मूल इब्रानी דרשׁ के दोनों रूपों का संबंध बनाए रखती है।
