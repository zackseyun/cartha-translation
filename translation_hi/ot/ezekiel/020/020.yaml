id: EZK.20.20
reference: Ezekiel 20:20
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/אֶת שַׁבְּתוֹתַ֖/י קַדֵּ֑שׁוּ וְ/הָי֤וּ לְ/אוֹת֙ בֵּינִ֣/י וּ/בֵֽינֵי/כֶ֔ם לָ/דַ֕עַת כִּ֛י אֲנִ֥י יְהוָ֖ה אֱלֹהֵי/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/020/020.yaml
  text: Keep my Sabbaths holy[a], and let them be a sign between me and you, so that you may know that I am Yahweh your God.
translation:
  language: hi
  text: मेरे सब्तों को पवित्र मानो, और वे मेरे और तुम्हारे बीच एक चिन्ह हों, जिससे तुम जानो कि मैं याहवे, तुम्हारा परमेश्वर हूँ।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שַׁבְּתוֹתַי
  choice: मेरे सब्तों
  rationale: बहुवचन और प्रथम पुरुष एकवचन संबंधसूचक प्रत्यय को बनाए रखता है तथा बार-बार आने वाले वाचा-संबंधी सब्तों को व्यक्त करता है।
- source_word: קַדֵּשׁוּ
  choice: पवित्र मानो
  rationale: पिएल आज्ञार्थक यहाँ सब्तों को पवित्र समझने और उसी के अनुरूप बरतने का निर्देश देता है; यह आधुनिक हिन्दी में स्वाभाविक और अर्थपूर्ण है।
- source_word: וְהָיוּ
  choice: और वे ... हों
  rationale: आज्ञा के बाद आया यह रूप उपदेशात्मक अथवा परिणामसूचक क्रम को व्यक्त करता है; ‘हों’ उस भाव को सुरक्षित रखता है।
- source_word: לְאוֹת
  choice: एक चिन्ह
  rationale: אוֹת वाचा-संबंधी पहचान या संकेत को दर्शाता है; ‘चिन्ह’ सटीक और परिचित बाइबलीय हिन्दी है।
- source_word: בֵּינִי וּבֵינֵיכֶם
  choice: मेरे और तुम्हारे बीच
  rationale: मूल के पारस्परिक वाचा-संबंधी वाक्यांश का सीधा और स्वाभाविक अनुवाद।
- source_word: לָדַעַת
  choice: जिससे तुम जानो
  rationale: לְ के साथ क्रियार्थक संज्ञा यहाँ उद्देश्य व्यक्त करती है; यह हिन्दी में उस उद्देश्य-संबंध को स्पष्ट रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय लिप्यंतरित किया गया है।
- source_word: אֱלֹהֵיכֶם
  choice: तुम्हारा परमेश्वर
  rationale: रूपात्मक बहुवचन होते हुए भी यहाँ इस्राएल के एकमात्र परमेश्वर के लिए एकवचन अर्थ है; प्रत्यय वाचा-संबंध को प्रकट करता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में व्यक्तिगत वाचा-नाम सीधे प्रयुक्त है। ‘याहवे’ उसे उपाधि से प्रतिस्थापित किए बिना सुरक्षित रखता है।
- issue: सब्तों को पवित्र करने का आशय
  choice: पवित्र मानो
  alternative: पवित्र करो; अलग ठहराओ
  rationale: इस प्रसंग में आदेश सब्तों को पवित्र मानकर उनके अनुरूप आचरण करने का है। ‘पवित्र मानो’ न तो मनुष्य द्वारा उनमें अंतर्निहित पवित्रता उत्पन्न करने का अनावश्यक संकेत देता है, न आदेश की व्यावहारिक शक्ति घटाता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध शैली। ‘सब्त’ और ‘परमेश्वर’ जैसे स्थापित बाइबलीय शब्द रखे गए हैं; वाक्य की आज्ञात्मक और वाचा-संबंधी संरचना सुरक्षित है।
