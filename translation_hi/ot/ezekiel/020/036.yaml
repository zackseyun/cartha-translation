  text: כַּ/אֲשֶׁ֤ר נִשְׁפַּ֨טְתִּי֙ אֶת אֲב֣וֹתֵי/כֶ֔ם בְּ/מִדְבַּ֖ר אֶ֣רֶץ מִצְרָ֑יִם כֵּ֚ן אִשָּׁפֵ֣ט אִתְּ/כֶ֔ם נְאֻ֖ם אֲדֹנָ֥/י יְהוִֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/020/036.yaml
  text: Just as I entered into judgment with your fathers in the wilderness of the land of Egypt[a], so I will enter into judgment with you, declares the Lord GOD.
translation:
  language: hi
  text: “जिस प्रकार मैंने मिस्र देश के निर्जन प्रदेश में तुम्हारे पूर्वजों के साथ न्याय-विचार किया था,[a] उसी प्रकार मैं तुम्हारे साथ न्याय-विचार करूँगा,” प्रभु यहोवा की घोषणा है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मैंने तुम्हारे पूर्वजों का न्याय किया था ... उसी प्रकार मैं तुम्हारा न्याय करूँगा।” इब्रानी क्रिया का यह सरल अनुवाद भी संभव है; मुख्य पाठ का “न्याय-विचार” उसके औपचारिक न्यायिक भाव को बनाए रखता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּאֲשֶׁר ... כֵּן
  choice: जिस प्रकार ... उसी प्रकार
  rationale: यह युग्म बीते हुए और आने वाले परमेश्वर के कार्य के बीच स्पष्ट समानता व्यक्त करता है।
- source_word: נִשְׁפַּטְתִּי ... אִשָּׁפֵט
  choice: मैंने ... न्यायिक विवाद किया था ... मैं ... न्यायिक विवाद करूँगा
  rationale: שׁפט के निफ़अल रूप यहाँ केवल निर्णय सुनाने से अधिक, न्यायिक रूप से पक्षों का आमना-सामना होने का भाव रखते हैं। दोनों समानांतर क्रियाओं का एक-सा अनुवाद रखा गया है।
- source_word: אֶת אֲבוֹתֵיכֶם ... אִתְּכֶם
  choice: तुम्हारे पुरखाओं के साथ ... तुम्हारे साथ
  rationale: ‘के साथ’ न्यायिक व्यवहार के सहभागी पक्ष को दिखाता है और ‘विरुद्ध’ जोड़कर विरोधी भाव को आवश्यकता से अधिक स्पष्ट नहीं करता।
- source_word: בְּמִדְבַּר אֶרֶץ מִצְרָיִם
  choice: मिस्र देश के निर्जन प्रदेश में
  rationale: यह अनुवाद מִדְבָּר का जंगल/मरुभूमि जैसा निर्जन क्षेत्र और אֶרֶץ מִצְרָיִם के सभी घटक बनाए रखता है, बिना स्थान-संबंधी असामान्य वाक्यांश को चुपचाप सरल किए।
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: प्रभु यहोवा की यह घोषणा है
  rationale: נְאֻם को स्वाभाविक भविष्यद्वाणी-सूत्र ‘घोषणा’ से और दोनों ईश्वरीय संबोधनों को ‘प्रभु यहोवा’ से व्यक्त किया गया है।
theological_decisions:
- issue: נִשְׁפַּטְתִּי और אִשָּׁפֵט का न्यायिक/वाचा-विवाद संबंधी बल
  choice: न्यायिक विवाद किया था / करूँगा
  alternative: न्याय किया था / करूँगा
  rationale: मुख्य पाठ औपचारिक न्यायिक मुठभेड़ का भाव सुरक्षित रखता है; अधिक सरल और संभव अर्थ पादटिप्पणी में दिया गया है।
- issue: אֲדֹנָי יְהוִה में परमेश्वर के नाम का अनुवाद
  choice: प्रभु यहोवा
  alternative: प्रभु याहवे
  rationale: प्रत्यक्ष ईश्वरीय नाम को सामान्य हिन्दी बाइबलीय रूप ‘यहोवा’ से अलग पहचान दी गई है और אֲדֹנָי को ‘प्रभु’ से अनूदित किया गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सार्वजनिक पाठ के योग्य रखी गई है। ‘पुरखाओं’ सामान्य पाठकों के लिए स्वाभाविक है; ‘न्यायिक विवाद’ कुछ औपचारिक होते हुए भी मूल की न्यायिक सूक्ष्मता सुरक्षित रखता है।
