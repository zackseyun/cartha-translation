source:
  edition: WLC
  text: וְ/אָמַרְתָּ֣ אֲלֵי/הֶ֗ם כֹּֽה אָמַר֮ אֲדֹנָ֣/י יְהוִה֒ בְּ/יוֹם֙ בָּחֳרִ֣/י בְ/יִשְׂרָאֵ֔ל וָ/אֶשָּׂ֣א יָדִ֗/י לְ/זֶ֨רַע֙ בֵּ֣ית יַֽעֲקֹ֔ב וָ/אִוָּדַ֥ע לָ/הֶ֖ם בְּ/אֶ֣רֶץ מִצְרָ֑יִם וָ/אֶשָּׂ֨א יָדִ֤/י לָ/הֶם֙ לֵ/אמֹ֔ר אֲנִ֖י יְהוָ֥ה אֱלֹהֵי/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/020/005.yaml
  text: 'And say to them[a], ‘Thus says the Lord GOD: On the day when I chose Israel, I lifted up my hand to the offspring of the house of Jacob and made myself known to them in the land of Egypt; I lifted up my hand to them, saying, “I am Yahweh your God.”’'
translation:
  language: hi
  text: 'और उनसे कहो, ‘प्रभु याहवे यह कहते हैं: जिस दिन मैंने इस्राएल को चुना, उस दिन मैंने याकूब के घराने के वंशजों के लिए अपना हाथ उठाया[a] और मिस्र देश में उन्हें अपने आपको प्रकट किया। मैंने उनके लिए अपना हाथ उठाकर कहा, “मैं याहवे, तुम्हारा परमेश्वर हूँ।”’'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में “अपना हाथ उठाया”; यह मुहावरा प्रायः शपथ खाने या गंभीर प्रतिज्ञा करने के लिए प्रयुक्त होता है।
    reason: मूल मुहावरे के अभिप्राय को स्पष्ट करना।
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  choice: प्रभु याहवे
  rationale: संयुक्त ईश्वरीय उपाधि में אֲדֹנָי को ‘प्रभु’ और व्यक्तिगत वाचा-नाम יהוה को ‘याहवे’ रखा गया है, ताकि दोनों अलग-अलग और स्वाभाविक रूप से व्यक्त हों।
- source_word: בְּיוֹם בָּחֳרִי בְיִשְׂרָאֵל
  choice: जिस दिन मैंने इस्राएल को चुना, उस दिन
  rationale: यह हिब्रू कालवाचक रचना का स्वाभाविक हिन्दी रूप है और בחר के चुनाव-संबंधी अर्थ को बिना अतिरिक्त धर्मवैज्ञानिक व्याख्या के सुरक्षित रखता है।
- source_word: וָאֶשָּׂא יָדִי
  choice: मैंने ... अपना हाथ उठाया
  rationale: मूल की सजीव उपमा को मुख्य पाठ में सुरक्षित रखा गया है; इसके शपथ या गंभीर प्रतिज्ञा के भाव को पादटिप्पणी में स्पष्ट किया गया है।
- source_word: לְזֶרַע בֵּית יַעֲקֹב
  choice: याकूब के घराने के वंशजों के सामने
  rationale: זֶרַע का सामूहिक वंशार्थ यहाँ ‘वंशजों’ से सहज और स्पष्ट होता है। לְ का प्रयोग इस शपथ-सूचक मुहावरे में उन लोगों की ओर संबोधित क्रिया बताता है, जिसे हिन्दी में ‘के सामने’ कहा गया है।
- source_word: וָאִוָּדַע לָהֶם
  choice: अपने आपको उन पर प्रकट किया
  rationale: ידע के निफ़अल रूप में परमेश्वर के आत्म-प्रकाशन का भाव है; यह अनुवाद उस भाव को स्पष्ट रखते हुए किसी अतिरिक्त विवरण को नहीं जोड़ता।
- source_word: בְּאֶרֶץ מִצְרָיִם
  choice: मिस्र देश में
  rationale: אֶרֶץ को स्पष्ट रूप से ‘देश’ कहकर मूल की पूर्ण स्थान-सूचक अभिव्यक्ति रखी गई है।
- source_word: אֲנִי יְהוָה אֱלֹהֵיכֶם
  choice: मैं याहवे, तुम्हारा परमेश्वर हूँ
  rationale: वाचा-सूत्र को सीधे रूप में अनूदित किया गया है और יהוה को व्यक्तिगत नाम ‘याहवे’ के रूप में सुरक्षित रखा गया है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: याहवे
  alternative: यहोवा; ‘यहोवा’ के स्थान पर ‘प्रभु’
  rationale: मूल में चार अक्षरों वाला व्यक्तिगत ईश्वरीय नाम सीधे आया है। ‘याहवे’ उसका व्यापक रूप से स्वीकृत आधुनिक लिप्यंतरण है और उपाधि אֲדֹנָי (‘प्रभु’) से उसका भेद बनाए रखता है।
- issue: וָאֶשָּׂא יָדִי को शपथ के रूप में अर्थानुवाद करना या मूल मुहावरा रखना
  choice: मुख्य पाठ में ‘अपना हाथ उठाया’ रखना और शपथ का भाव पादटिप्पणी में बताना
  alternative: ‘मैंने शपथ खाई’ अथवा ‘मैंने प्रतिज्ञा की’
  rationale: वाक्यांश निश्चय ही शपथ-सूचक है, पर मूल की शारीरिक छवि पाठ का हिस्सा है। उसे बनाए रखने और अर्थ को टिप्पणी में बताने से रूप तथा अभिप्राय दोनों सुरक्षित रहते हैं।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य हिन्दी पाठक के लिए सहज रखी गई है। ‘घराना’, ‘वंशज’ और ‘प्रकट किया’ जैसे परिचित बाइबलीय शब्द मूल के संबंधों और आत्म-प्रकाशन के भाव को स्पष्ट रखते हैं।
