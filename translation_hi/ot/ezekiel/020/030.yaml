source:
  edition: WLC
  text: לָ/כֵ֞ן אֱמֹ֣ר אֶל בֵּ֣ית יִשְׂרָאֵ֗ל כֹּ֤ה אָמַר֙ אֲדֹנָ֣/י יְהוִ֔ה הַ/בְּ/דֶ֥רֶךְ אֲבֽוֹתֵי/כֶ֖ם אַתֶּ֣ם נִטְמְאִ֑ים וְ/אַחֲרֵ֥י שִׁקּוּצֵי/הֶ֖ם אַתֶּ֥ם זֹנִֽים׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/020/030.yaml
  text: 'Therefore say to the house of Israel[a], Thus says the Lord Yahweh: Are you defiling yourselves in the way of your fathers[b], and whoring after their detestable things?'
translation:
  language: hi
  text: 'इसलिए इस्राएल के घराने से कह, ‘प्रभु यहोवा यों कहता है: क्या तुम अपने पुरखाओं की राह पर चलकर अपने आपको अशुद्ध करते हो, और उनकी घिनौनी वस्तुओं[a] के पीछे वेश्या के समान भटकते हो[b]?’'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “घिनौनी वस्तुओं” का अनुवाद “घृणित वस्तुओं” या संदर्भ के अनुसार “मूर्तियों” भी किया जा सकता है।
    reason: lexical_alternative
  - marker: b
    text: मूल क्रिया का शाब्दिक अर्थ वेश्यावृत्ति करना है। यहाँ यह मूर्तिपूजा के द्वारा यहोवा के प्रति वाचा-भंग का रूपक है।
    reason: metaphor_clarification
lexical_decisions:
- source_word: לָכֵן
  choice: इसलिए
  rationale: यह पिछले आरोपों से निकलने वाले निष्कर्ष और वर्तमान संबोधन को स्वाभाविक रूप से जोड़ता है।
- source_word: אֱמֹר אֶל־בֵּית יִשְׂרָאֵל
  choice: इस्राएल के घराने से कह
  rationale: ‘घराना’ इस्राएल की सामूहिक और वाचागत पहचान को बनाए रखता है, और एकवचन ‘कह’ भविष्यद्वक्ता को दिए गए आदेश को दर्शाता है।
- source_word: כֹּה אָמַר אֲדֹנָי יְהוִה
  choice: प्रभु यहोवा यों कहता है
  rationale: यह भविष्यद्वाणी का संदेशवाहक-सूत्र है; ‘यहोवा’ स्रोत में आए परमेश्वर के विशिष्ट नाम को और ‘प्रभु’ उससे पहले आए אֲדֹנָי को अलग-अलग बनाए रखता है।
- source_word: הַבְּדֶרֶךְ אֲבוֹתֵיכֶם
  choice: अपने पुरखाओं की राह पर चलकर
  rationale: ‘राह’ मूल रूपक को रखती है, जबकि ‘चलकर’ हिंदी में पूर्वजों के आचरण का अनुसरण करने का भाव स्पष्ट और सहज बनाता है।
- source_word: אַתֶּם נִטְמְאִים
  choice: क्या तुम ... अपने आप को अशुद्ध कर रहे हो
  rationale: प्रश्नवाचक ה और वर्तमान कृदंत के जारी क्रियाकलाप को प्रश्नात्मक, वर्तमान अभिव्यक्ति में रखा गया है; संदर्भ में अशुद्धता उन्हीं के आचरण से उत्पन्न है।
- source_word: שִׁקּוּצֵיהֶם
  choice: उनकी घिनौनी वस्तुओं
  rationale: यह अभिव्यक्ति मूल शब्द की घृणित वस्तुओं वाली व्यापकता को बनाए रखती है और उसे बिना आवश्यकता केवल ‘मूर्तियाँ’ तक सीमित नहीं करती।
- source_word: אַתֶּם זֹנִים
  choice: व्यभिचार कर रहे हो
  rationale: यह मूर्तिपूजा के लिए प्रयुक्त तीखे दाम्पत्य/यौन रूपक को सहज आधुनिक हिंदी में बनाए रखता है; इसे केवल सामान्य ‘विश्वासघात’ बनाकर नरम नहीं किया गया।
theological_decisions:
- issue: संयुक्त उपाधि אֲדֹנָי יְהוִה में परमेश्वर के नाम का अनुवाद
  choice: प्रभु यहोवा
  alternative: प्रभु परमेश्वर
  rationale: स्रोत में אֲדֹנָי और विशिष्ट नाम יְהוִה दोनों हैं; ‘प्रभु यहोवा’ दोनों को स्पष्ट रूप से सुरक्षित रखता है।
- issue: זנה के मूर्तिपूजात्मक रूपक की तीव्रता
  choice: व्यभिचार कर रहे हो
  alternative: वेश्या के समान उनके पीछे जा रहे हो
  rationale: चुना हुआ रूप हिंदी में स्वाभाविक रहते हुए वाचा-संबंधी यौन रूपक को बनाए रखता है; फुटनोट अधिक शाब्दिक संभावना बताता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सार्वजनिक पाठ के योग्य रखी गई है। ‘पुरखाओं की राह पर चलकर’ मूल के ‘राह’ रूपक को स्वाभाविक हिंदी में व्यक्त करता है। प्रश्न का स्वर आरोपात्मक है, पर उसे कथन में बदलकर उसकी वास्तविक प्रश्नात्मक बनावट को मिटाया नहीं गया।
