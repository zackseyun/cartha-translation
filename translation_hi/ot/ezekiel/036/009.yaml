language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: כִּ֖י הִנְ/נִ֣י אֲלֵי/כֶ֑ם וּ/פָנִ֣יתִי אֲלֵי/כֶ֔ם וְ/נֶעֱבַדְתֶּ֖ם וְ/נִזְרַעְתֶּֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/036/009.yaml
  text: For behold[a], I am for you, and I will turn to you, and you will be cultivated and sown.
translation:
  language: hi
  text: क्योंकि देखो, मैं तुम्हारे पक्ष में हूँ[a]; मैं तुम्हारी ओर फिरूँगा, और तुम जोते और बोए जाओगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘मैं तुम्हारी ओर हूँ।’ इब्रानी अभिव्यक्ति भूमि के प्रति यहोवा के अनुकूल रुख को प्रकट करती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले वचन में दी गई प्रतिज्ञा का आधार बताता है और प्रसंग में कारणसूचक संबंध बनाए रखता है।
- source_word: הִנְנִי
  choice: देखो, मैं
  rationale: यह ध्यान आकर्षित करने वाला भविष्यवाणी-संबंधी सूत्र है; ‘देखो’ उसकी गंभीरता और तात्कालिकता को स्वाभाविक आधुनिक हिन्दी में रखता है।
- source_word: אֲלֵיכֶם
  choice: तुम्हारे पक्ष में
  rationale: यहाँ संबोधन इस्राएल के पहाड़ों और भूमि से है, और पूर्वसर्ग यहोवा के अनुकूल रुख को व्यक्त करता है, केवल दिशा को नहीं।
- source_word: וּפָנִיתִי אֲלֵיכֶם
  choice: मैं तुम्हारी ओर फिरूँगा
  rationale: यह मूल के दिशा-संबंधी रूपक को बनाए रखते हुए अनुकूल ध्यान और कार्य की ओर संकेत करता है।
- source_word: וְנֶעֱבַדְתֶּם
  choice: तुम जोते ... जाओगे
  rationale: עבד का निफ़अल रूप यहाँ भूमि पर कृषि-कार्य किए जाने का निष्क्रिय अर्थ देता है; ‘जोते जाओगे’ भूमि के संदर्भ में स्पष्ट और सहज है।
- source_word: וְנִזְרַעְתֶּם
  choice: और बोए जाओगे
  rationale: זרע का निफ़अल रूप बीज बोए जाने के निष्क्रिय कृषि-अर्थ को सीधे व्यक्त करता है।
theological_decisions:
- issue: הִנְנִי אֲלֵיכֶם में परमेश्वर का रुख
  choice: मैं तुम्हारे पक्ष में हूँ
  alternative: मैं तुम्हारी ओर हूँ
  rationale: आसपास का प्रसंग इस्राएल की भूमि के प्रति यहोवा के अनुकूल पुनः-अभिमुख होने को दिखाता है। ‘पक्ष में’ इस कृपालु रुख को स्पष्ट करता है, जबकि पादटिप्पणी मूल की अधिक दिशात्मक सम्भावना सुरक्षित रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण भविष्यवाणी-शैली रखी गई है। भूमि/पहाड़ों को बहुवचन में संबोधित किए जाने के कारण ‘तुम’ और निष्क्रिय बहुवचन क्रियाएँ प्रयुक्त हुई हैं; कृषि-चित्र को ‘जोते और बोए जाओगे’ से ठोस तथा सहज रखा गया है।
