  text: וְ/יָדְע֣וּ הַ/גּוֹיִ֗ם אֲשֶׁ֣ר יִֽשָּׁאֲרוּ֮ סְבִיבוֹתֵי/כֶם֒ כִּ֣י אֲנִ֣י יְהוָ֗ה בָּנִ֨יתִי֙ הַ/נֶּ֣הֱרָס֔וֹת נָטַ֖עְתִּי הַ/נְּשַׁמָּ֑ה אֲנִ֥י יְהוָ֖ה דִּבַּ֥רְתִּי וְ/עָשִֽׂיתִי׀׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/036/036.yaml
  text: Then the nations that remain around you will know that I[a], Yahweh, have rebuilt the ruined places and planted what was desolate. I, Yahweh, have spoken, and I will do it.
translation:
  language: hi
  text: तब तुम्हारे चारों ओर बची हुई जातियाँ जानेंगी कि मैं, यहोवा, ने उजड़े हुए स्थानों को फिर से बनाया है और वीरान पड़ी भूमि में रोपण किया है। मैं, यहोवा, ने कहा है, और मैं इसे करूँगा।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मैं, यहोवा, ने कहा है और यह कर दिया है।” अन्तिम इब्रानी क्रिया रूपतः पूर्ण काल में है, पर यहाँ वह सम्भवतः यहोवा के भावी कार्य की निश्चितता व्यक्त करती है।
    reason: मूल क्रियारूप और उसके संभावित भावी भविष्यद्वाणी-संबंधी अर्थ—दोनों को सुरक्षित रखना।
lexical_decisions:
- source_word: וְיָדְעוּ
  choice: तब ... जान लेंगी
  rationale: वाव-संयुक्त रूप पिछले पुनर्स्थापना-वचनों के परिणाम और भावी बोध को व्यक्त करता है; ‘तब’ हिन्दी में प्रसंगगत प्रगति को स्वाभाविक बनाता है।
- source_word: הַגּוֹיִם
  choice: जातियाँ
  rationale: यह आसपास के अन्य राष्ट्रों अथवा जनसमूहों को सूचित करता है; ‘गैर-यहूदी’ जैसा बाद का धार्मिक भेद यहाँ आयात नहीं किया गया।
- source_word: אֲשֶׁר יִשָּׁאֲרוּ סְבִיבוֹתֵיכֶם
  choice: तुम्हारे चारों ओर बची हुई
  rationale: निफ़अल रूप का अर्थ शेष रहना या बचा होना है; यह न्याय के बाद आसपास बची जातियों की ओर संकेत करता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिन्दी बाइबल-परंपरा में प्रचलित देवनागरी नाम-रूप द्वारा चतुराक्षरीय निजी नाम को उपाधि से प्रतिस्थापित किए बिना रखा गया है।
- source_word: בָּנִיתִי הַנֶּהֱרָסוֹת
  choice: उजड़े हुए स्थानों को फिर से बसाया है
  rationale: शाब्दिक अर्थ ‘ढहाए गए स्थानों को बनाया’ है। हिन्दी में स्थानों के पुनर्निर्माण और पुनर्वास की व्यापक पुनर्स्थापना को ‘फिर से बसाया’ स्वाभाविक रूप से व्यक्त करता है।
- source_word: נָטַעְתִּי הַנְּשַׁמָּה
  choice: वीरान भूमि में पौधे लगाए हैं
  rationale: נטע का मूल अर्थ रोपना/लगाना है। स्त्रीलिंग एकवचन הַנְּשַׁמָּה यहाँ वीरान भूमि के लिए सामूहिक रूप से समझा जाता है; हिन्दी में अपेक्षित कर्म को स्पष्ट किया गया है, पर ‘फिर से’ नहीं जोड़ा गया।
- source_word: דִּבַּרְתִּי וְעָשִׂיתִי
  choice: मैंने यह कहा है, और मैं इसे पूरा करूँगा
  rationale: पहला पूर्ण रूप घोषित वचन को और अंतिम पूर्ण रूप भविष्य में निश्चित रूप से होने वाली ईश्वरीय सिद्धि को व्यक्त कर सकता है। ‘पूरा करूँगा’ हिन्दी में कथन को कार्यान्वित करने का आशय स्पष्ट करता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल में निजी ईश्वरीय नाम है, इसलिए ‘प्रभु’ जैसी उपाधि नहीं रखी गई। आधुनिक हिन्दी पाठकों में व्यापक रूप से पहचाने जाने वाले ‘यहोवा’ रूप का उपयोग किया गया है; स्वरांकन की ऐतिहासिक अनिश्चितता के कारण ‘याहवे’ भी संभव है।
- issue: דִּבַּרְתִּי וְעָשִׂיתִי में अंतिम पूर्ण क्रिया का काल
  choice: मैंने यह कहा है, और मैं इसे पूरा करूँगा
  alternative: मैंने कहा और कर दिया है
  rationale: दोनों क्रियाएँ रूपतः पूर्ण हैं, पर भविष्य की पुनर्स्थापना के संदर्भ में अंतिम क्रिया निश्चित भावी सिद्धि को व्यक्त करना अधिक संभावित है। वैकल्पिक शाब्दिक काल को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य हिन्दी पाठक के लिए सुबोध रखी गई है। बहुवचन स्त्रीलिंग ‘जातियाँ’ के अनुरूप ‘जान लेंगी’ रखा गया है। मुख्य पाठ में सहजता के लिए ‘वीरान भूमि’ स्पष्ट किया गया है, जबकि अंतिम क्रिया की वास्तविक कालगत अस्पष्टता पादटिप्पणी में दी गई है।
