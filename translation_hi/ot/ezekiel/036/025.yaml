source:
  edition: WLC
  text: וְ/זָרַקְתִּ֧י עֲלֵי/כֶ֛ם מַ֥יִם טְהוֹרִ֖ים וּ/טְהַרְתֶּ֑ם מִ/כֹּ֧ל טֻמְאוֹתֵי/כֶ֛ם וּ/מִ/כָּל גִּלּ֥וּלֵי/כֶ֖ם אֲטַהֵ֥ר אֶתְ/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/036/025.yaml
  text: And I will sprinkle clean water on you[a], and you will be clean; from all your uncleannesses and from all your idols I will cleanse you.
translation:
  language: hi
  text: और मैं तुम पर शुद्ध जल छिड़कूँगा, और तुम शुद्ध हो जाओगे। मैं तुम्हें तुम्हारी सारी अशुद्धताओं और तुम्हारी सारी मूर्तियों[a] से शुद्ध करूँगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: मूल इब्रानी में मूर्तियों के लिए जानबूझकर तिरस्कारपूर्ण शब्द है, जिसका अधिक शाब्दिक अर्थ “गोबर-जैसी मूर्तियाँ” हो सकता है। यहेजकेल प्रायः मूर्तियों के लिए यही शब्द प्रयोग करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְזָרַקְתִּי
  choice: और मैं ... छिड़कूँगा
  rationale: शुद्धिकरण के इस प्रसंग में זרק का स्वाभाविक अर्थ ‘छिड़कना’ है; ‘फेंकना’ या ‘बिखेरना’ यहाँ अनावश्यक रूप से कठोर होगा।
- source_word: מַיִם טְהוֹרִים
  choice: शुद्ध जल
  rationale: טָהוֹר अनुष्ठानिक और नैतिक शुद्धता, दोनों की प्रतिध्वनि रखता है। ‘शुद्ध जल’ आधुनिक हिन्दी में स्वाभाविक है और आगे आने वाले शुद्धिकरण से शब्दगत संबंध बनाए रखता है।
- source_word: וּטְהַרְתֶּם
  choice: और तुम शुद्ध हो जाओगे
  rationale: यह रूप लोगों की परिणामी अवस्था बताता है। इससे बाद के प्रथम-पुरुष क्रियापद ‘मैं ... शुद्ध करूँगा’ से उचित भेद भी बना रहता है।
- source_word: מִכֹּל טֻמְאוֹתֵיכֶם
  choice: तुम्हारी सारी अशुद्धताओं से
  rationale: बहुवचन टֻמְאוֹת व्यापक प्रकार की अशुद्धता या अपवित्रता को दर्शाता है। ‘अशुद्धताओं’ मूल के बहुवचन और טהר के साथ उसके विरोध को सुरक्षित रखता है।
- source_word: וּמִכָּל גִּלּוּלֵיכֶם
  choice: तुम्हारी सारी मूर्तियों से
  rationale: मुख्य पाठ में ‘मूर्तियों’ स्पष्ट और सहज है। यहेजकेल द्वारा प्रयुक्त गִּלּוּלִים की जानबूझकर तिरस्कारपूर्ण ध्वनि को पादटिप्पणी में स्पष्ट किया गया है।
- source_word: אֲטַהֵר אֶתְכֶם
  choice: मैं तुम्हें ... शुद्ध करूँगा
  rationale: यह परमेश्वर द्वारा सक्रिय रूप से अशुद्धता दूर करने को व्यक्त करता है और इसी पद में टהר धातु की पुनरावृत्ति बनाए रखता है।
theological_decisions:
- issue: शुद्धिकरण के बिंब का स्वरूप
  choice: अनुष्ठानिक और नैतिक शुद्धिकरण की भाषा को बनाए रखा गया है, पर किसी विशिष्ट संस्कारगत विधि को निर्धारित नहीं किया गया।
  alternative: इसे केवल राष्ट्रीय पुनर्स्थापना का रूपक मानना, या मुख्य पाठ में सीधे बपतिस्मा-संबंधी अर्थ जोड़ना।
  rationale: इब्रानी पाठ पुनर्स्थापना के संदर्भ में अशुद्धता और मूर्तियों से परमेश्वर के शुद्ध करने की बात करता है। अनुवाद इस धार्मिक खुलापन को सुरक्षित रखता है और बाद की सिद्धान्तगत विशिष्टता आरोपित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सहज रूप। ‘जल’ और ‘शुद्ध’ इस भविष्यवाणी के गंभीर शुद्धिकरण-बिंब के अनुकूल हैं। प्रत्येक बहुवचन संबोधन के लिए ‘तुम’ रखा गया है।
