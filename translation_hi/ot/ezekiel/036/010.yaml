id: EZK.36.10
reference: Ezekiel 36:10
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/הִרְבֵּיתִ֤י עֲלֵי/כֶם֙ אָדָ֔ם כָּל בֵּ֥ית יִשְׂרָאֵ֖ל כֻּלֹּ֑/ה וְ/נֹֽשְׁבוּ֙ הֶֽ/עָרִ֔ים וְ/הֶ/חֳרָב֖וֹת תִּבָּנֶֽינָה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/036/010.yaml
  text: And I will multiply people upon you—all the house of Israel[a], all of it. The cities will be inhabited[b], and the ruins will be rebuilt.
translation:
  language: hi
  text: मैं तुम पर लोगों को बहुत बढ़ाऊँगा—इस्राएल के सारे घराने को, पूरा का पूरा। नगर बसाए जाएँगे, और खंडहर बनाए जाएँगे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהִרְבֵּיתִי
  choice: मैं…की संख्या बहुत बढ़ाऊँगा
  rationale: רבה के हिफ़ील रूप का कारक भाव सुरक्षित रखते हुए यह स्वाभाविक हिन्दी में किसी जनसमूह को बहुत अधिक करने का अर्थ व्यक्त करता है।
- source_word: עֲלֵיכֶם
  choice: तुम पर
  rationale: बहुवचन सम्बोधन प्रसंग में इस्राएल के पहाड़ों/भूमि से है; ‘तुम पर’ स्थानगत बिंब को बनाए रखता है।
- source_word: אָדָם
  choice: मनुष्यों
  rationale: यहाँ אָדָם सामूहिक अर्थ में भूमि पर बसने वाली मानव-जनसंख्या को सूचित करता है। ‘मनुष्यों’ से यह अर्थ स्पष्ट रहता है और मूल शब्द का मानवीय संदर्भ भी बना रहता है।
- source_word: כָּל בֵּית יִשְׂרָאֵל כֻּלֹּה
  choice: इस्राएल का सारा घराना, पूरा का पूरा
  rationale: כָּל और כֻּלֹּה दोनों से व्यक्त पूर्णता के दोहरे बल को हिन्दी में दोहराकर सुरक्षित रखा गया है।
- source_word: וְנֹשְׁבוּ הֶעָרִים
  choice: नगर फिर बसाए जाएँगे
  rationale: ישׁב के निफ़ाल रूप का अर्थ नगरों का फिर से आबाद होना है। ‘बसाए जाएँगे’ हिन्दी में स्वाभाविक निष्पन्न/कर्मवाच्य भाव देता है।
- source_word: וְהֶחֳרָבוֹת
  choice: खंडहर
  rationale: חֳרָבוֹת उजड़े या ध्वस्त स्थानों को दर्शाता है; पुनर्निर्माण के साथ ‘खंडहर’ संक्षिप्त, सजीव और सहज है।
- source_word: תִּבָּנֶינָה
  choice: फिर बनाए जाएँगे
  rationale: בנה के निफ़ाल रूप का कर्मवाच्य भाव रखा गया है और ‘फिर’ से पहले से उजड़े स्थानों की बहाली का प्रसंग स्वाभाविक रूप से स्पष्ट होता है।
theological_decisions:
- issue: सम्बोधित पक्ष और बहाली का स्वरूप
  choice: पद में इस्राएल की भूमि/पहाड़ों को सम्बोधित करते हुए इस्राएल के जनसमूह, नगरों और खंडहरों की ठोस बहाली का वादा व्यक्त किया गया है।
  alternative: भूमि से अलग केवल रूपकात्मक या आत्मिक बहाली
  rationale: निकटवर्ती प्रसंग सीधे भूमि से बात करता है, और नगरों के बसाए तथा खंडहरों के बनाए जाने की शब्दावली ठोस स्थानगत बहाली दर्शाती है। इसलिए अनुवाद इस बिंब को आध्यात्मिक रूप देकर सीमित नहीं करता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की है—सहज, गरिमापूर्ण और सार्वजनिक पाठ के अनुकूल। ‘पूरा का पूरा’ मूल की प्रबल पुनरुक्ति को स्वाभाविक हिन्दी में रखता है; ‘फिर’ बहाली के प्रसंग को स्पष्ट करता है।
