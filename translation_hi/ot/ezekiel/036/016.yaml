  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: आया
  rationale: भविष्यद्वाणी के इस प्रचलित प्रकाशन-सूत्र में शाब्दिक ‘हुआ’ की अपेक्षा ‘वचन ... आया’ स्वाभाविक हिन्दी है और इब्रानी भाव को ठीक व्यक्त करता है।
- source_word: דְבַר
  choice: वचन
  rationale: यहाँ शब्द परमेश्वर से प्राप्त संदेश को दर्शाता है; ‘वचन’ सटीक, गरिमापूर्ण और भविष्यद्वाणी-साहित्य में परिचित पद है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: मूल पाठ के चतुरक्षरीय व्यक्तिगत नाम को हिन्दी में प्रचलित लिप्यंतरण ‘यहोवा’ से प्रस्तुत किया गया है, न कि किसी उपाधि से।
- source_word: אֵלַי
  choice: मेरे पास
  rationale: इस प्रकाशन-सूत्र में אֶל के दिशात्मक भाव को आधुनिक हिन्दी में ‘मेरे पास आया’ स्वाभाविक रूप से व्यक्त करता है।
- source_word: לֵאמֹר
  choice: ':'
  rationale: यह रूप आगे आने वाले कथन का परिचय देता है। हिन्दी में उद्धरण-सूचक द्विबिंदु उसी कार्य को अधिक स्वाभाविक ढंग से निभाता है; अलग से ‘यह कहते हुए’ कहना अनावश्यक रूप से भारी होता।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: प्रभु
  rationale: इब्रानी में यहाँ परमेश्वर का व्यक्तिगत नाम सीधे प्रयुक्त है। ‘यहोवा’ नाम और उपाधि के बीच का भेद बनाए रखता है और हिन्दी बाइबल-परंपरा में व्यापक रूप से पहचाना जाता है।
translation_notes:
