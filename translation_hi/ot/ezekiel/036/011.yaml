  text: וְ/הִרְבֵּיתִ֧י עֲלֵי/כֶ֛ם אָדָ֥ם וּ/בְהֵמָ֖ה וְ/רָב֣וּ וּ/פָר֑וּ וְ/הוֹשַׁבְתִּ֨י אֶתְ/כֶ֜ם כְּ/קַדְמֽוֹתֵי/כֶ֗ם וְ/הֵטִֽבֹתִי֙ מֵ/רִאשֹׁ֣תֵי/כֶ֔ם וִֽ/ידַעְתֶּ֖ם כִּֽי אֲנִ֥י יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/036/011.yaml
  text: And I will multiply upon you man and beast[a], and they will multiply and be fruitful; and I will settle you as in your former times, and I will do better for you than at your beginnings[c][b]. Then you will know that I am Yahweh.
translation:
  language: hi
  text: मैं तुम पर मनुष्यों और पशुओं[a] की संख्या बढ़ाऊँगा; वे बढ़ेंगे और फलवन्त होंगे। मैं तुम्हें पहले के समय की तरह फिर बसाऊँगा[b] और तुम्हारे आरम्भिक दिनों की अपेक्षा तुम्हारे साथ अधिक भलाई करूँगा[c]। तब तुम जानोगे कि मैं यहोवा हूँ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “मनुष्य और पशु”; यहाँ दोनों शब्द सामूहिक रूप से मानव और पशु आबादी को दर्शाते हैं।
    reason: lexical_alternative
  - marker: b
    text: या, “मैं तुम्हें पहले की तरह निवास कराऊँगा।”
    reason: lexical_alternative
  - marker: c
    text: या, “मैं तुम्हारी दशा आरम्भिक दिनों से बेहतर कर दूँगा।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִרְבֵּיתִי עֲלֵיכֶם
  choice: मैं तुम पर ... की संख्या बढ़ाऊँगा
  rationale: हिफ़ील रूप कारणात्मक वृद्धि व्यक्त करता है। 'तुम पर' उन पर्वतों/भूमि को सम्बोधित करने वाली इब्रानी छवि बनाए रखता है जिन पर आबादी बढ़ेगी, जबकि 'की संख्या बढ़ाऊँगा' स्वाभाविक हिन्दी है।
- source_word: אָדָם וּבְהֵמָה
  choice: मनुष्यों और पशुओं
  rationale: אָדָם यहाँ सामूहिक रूप से मानव-समुदाय को और בְּהֵמָה पशु-समुदाय को दर्शाता है। हिन्दी में बहुवचन इस जोड़ी का आशय स्पष्ट और स्वाभाविक बनाता है।
- source_word: וְרָבוּ וּפָרוּ
  choice: वे बढ़ेंगे और फलवन्त होंगे
  rationale: दोनों क्रियाओं की क्रमिक समानता तथा פרה की बाइबलीय फलवन्तता-संबंधी भाषा सुरक्षित रखी गई है।
- source_word: וְהוֹשַׁבְתִּי אֶתְכֶם
  choice: मैं तुम्हें ... फिर बसाऊँगा
  rationale: ישב का हिफ़ील किसी को बसाने अथवा पुनः निवास कराने का भाव देता है; प्रसंग में 'फिर बसाऊँगा' पुनर्स्थापन को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: כְּקַדְמֹתֵיכֶם
  choice: पहले के समय की तरह
  rationale: यह पूर्वकालीन अवस्था की ओर संकेत करता है; अनावश्यक रूप से किसी एक निश्चित आरम्भ-बिन्दु को नहीं ठहराया गया।
- source_word: וְהֵטִבֹתִי מֵרִאשֹׁתֵיכֶם
  choice: तुम्हारे आरम्भिक दिनों से भी अधिक तुम्हारी भलाई करूँगा
  rationale: יטב का कारणात्मक/हितकारी भाव और מן की तुलना दोनों स्पष्ट हैं। यह वाक्य भलाई करने और पहले से बेहतर दशा देने के बीच मूल अर्थ-तनाव को बनाए रखता है।
- source_word: וִידַעְתֶּם כִּי אֲנִי יְהוָה
  choice: तब तुम जानोगे कि मैं यहोवा हूँ
  rationale: यद्यपि संयोजक साधारण वाव है, यहाँ परिणाम का भाव स्वाभाविक है। परमेश्वर का व्यक्तिगत वाचा-नाम 'यहोवा' के रूप में दिया गया है।
theological_decisions:
- issue: יהוה परमेश्वर के नाम का अनुवाद
  choice: यहोवा
  alternative: याहवे / प्रभु
  rationale: मूल पाठ में चार-अक्षरी व्यक्तिगत नाम स्पष्ट रूप से है। आधुनिक हिन्दी पाठकों में परिचित नामरूप 'यहोवा' नाम को उपाधि में बदले बिना प्रस्तुत करता है।
- issue: אָדָם का सामूहिक अर्थ
  choice: मनुष्यों
  alternative: मनुष्यजाति / मनुष्य
  rationale: यहाँ स्त्री-पुरुष सहित मानव आबादी पशुओं के समानांतर है; बहुवचन 'मनुष्यों' सामूहिक और समावेशी आशय को सहज हिन्दी में व्यक्त करता है।
- issue: पुनर्स्थापन की तुलना
  choice: आरम्भिक दिनों से भी अधिक तुम्हारी भलाई
  alternative: पहले से तुम्हारी दशा बेहतर करूँगा
  rationale: मूल में 'भला करना' और तुलनात्मक 'पहले/आरम्भिक अवस्थाओं से' दोनों उपस्थित हैं। चुना हुआ पाठ दोनों को रखता है और समृद्धि की किसी संकीर्ण धार्मिक व्याख्या को आरोपित नहीं करता।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी। पर्वतों/भूमि को सम्बोधित बहुवचन 'तुम' को बनाए रखा गया है। 'फलवन्त', 'भलाई' और 'यहोवा' जैसे बाइबलीय शब्द परिचित औपचारिकता रखते हैं, पर वाक्यरचना वर्तमान हिन्दी के अनुरूप है।
