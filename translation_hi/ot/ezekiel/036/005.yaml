source:
  edition: WLC
  text: לָ/כֵ֗ן כֹּֽה אָמַר֮ אֲדֹנָ֣/י יְהוִה֒ אִם לֹ֠א בְּ/אֵ֨שׁ קִנְאָתִ֥/י דִבַּ֛רְתִּי עַל שְׁאֵרִ֥ית הַ/גּוֹיִ֖ם וְ/עַל אֱד֣וֹם כֻּלָּ֑/א אֲשֶׁ֣ר נָתְנֽוּ אֶת אַרְצִ֣/י לָ֠/הֶם לְ/מ֨וֹרָשָׁ֜ה בְּ/שִׂמְחַ֤ת כָּל לֵבָב֙ בִּ/שְׁאָ֣ט נֶ֔פֶשׁ לְמַ֥עַן מִגְרָשָׁ֖/הּ לָ/בַֽז־־־־־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/036/005.yaml
  text: 'Therefore thus says the Lord GOD: Surely in the fire of my jealousy I have spoken against the remnant of the nations and against all Edom[a], who gave my land to themselves as a possession with wholehearted joy and with contempt of soul[c][b], in order to make its pastureland plunder.'
translation:
  language: hi
  text: 'इस कारण प्रभु यहोवा यों कहता है: निश्चय ही मैंने अपनी जलन की आग में बाकी जातियों और सारे एदोम के विरुद्ध कहा है, जिन्होंने पूरे मन के आनंद और पूरे मन के तिरस्कार के साथ मेरी भूमि को अपनी संपत्ति बना लिया, ताकि उसकी चरागाह-भूमि को लूट का माल बना दें।[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अंतिम इब्रानी वाक्यांश कठिन है। मִगְרָशׁ का अर्थ ‘खुली भूमि’ या ‘चरागाह-भूमि’ हो सकता है; इसलिए इसका अर्थ यह भी हो सकता है: “ताकि उसकी खुली भूमि को लूट का माल बना दें।”'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  choice: प्रभु यहोवा
  rationale: उपाधि और व्यक्तिगत वाचा-नाम, दोनों को स्वाभाविक हिन्दी में सुरक्षित रखा गया है।
- source_word: אִם לֹא
  choice: निश्चय ही
  rationale: यहाँ यह शाब्दिक शर्त नहीं, बल्कि भविष्यद्वाणी की शपथ-सदृश दृढ़ घोषणा है।
- source_word: בְּאֵשׁ קִנְאָתִי
  choice: अपनी जलन की आग में
  rationale: ‘आग’ के ठोस रूपक तथा परमेश्वर की संबंधपरक और न्यायिक जलन, दोनों को बनाए रखता है।
- source_word: שְׁאֵרִית הַגּוֹיִם
  choice: बाकी जातियों
  rationale: संदर्भ में שְׁאֵרִית का अर्थ आसपास की शेष जातियाँ है; ‘बाकी’ किसी सकारात्मक धार्मिक ‘शेष’ अर्थ को अनावश्यक रूप से नहीं जोड़ता।
- source_word: נָתְנוּ אֶת אַרְצִי לָהֶם לְמוֹרָשָׁה
  choice: मेरी भूमि को अपनी संपत्ति बना लिया
  rationale: अनुचित आत्म-अधिग्रहण और מוֹרָשָׁה के अधिकार/संपत्ति भाव को सहज हिन्दी में व्यक्त करता है।
- source_word: בְּשִׂמְחַת כָּל לֵבָב
  choice: पूरे मन के आनंद के साथ
  rationale: समूचे अंतर्मन से किए गए उल्लास का भाव सुरक्षित है।
- source_word: בִּשְׁאָט נֶפֶשׁ
  choice: मन के घोर तिरस्कार के साथ
  rationale: נֶפֶשׁ को आंतरिक वृत्ति और שְׁאָט को गहरे तिरस्कार के रूप में व्यक्त करता है।
- source_word: לְמַעַן מִגְרָשָׁהּ לָבַז
  choice: ताकि उसके चरागाह को लूट लें
  rationale: कठिन और संक्षिप्त इब्रानी में מִגְרָשׁ के ‘खुली भूमि/चरागाह’ अर्थ को प्राथमिकता दी गई है, और उद्देश्यसूचक לְמַעַן तथा लूट के भाव को रखा गया है।
theological_decisions:
- issue: אֲדֹנָי יְהוִה में ईश्वरीय नाम का अनुवाद
  choice: प्रभु यहोवा
  alternative: प्रभु परमेश्वर
  rationale: मूल में आए व्यक्तिगत वाचा-नाम को सामान्य पदवी में बदलने के बजाय ‘यहोवा’ के रूप में सुरक्षित रखा गया है।
- issue: קִנְאָה का अर्थ
  choice: जलन
  alternative: जोश
  rationale: ‘जलन’ परमेश्वर के अपने लोगों और भूमि के प्रति संबंधपरक आग्रह तथा न्यायिक रोष के तनाव को बनाए रखती है; इसे केवल सामान्य उत्साह नहीं बनाया गया।
- issue: שְׁאֵרִית का आशय
  choice: बाकी जातियाँ
  alternative: जातियों का बचा हुआ भाग
  rationale: यहाँ शब्द को उद्धार पाए धार्मिक ‘शेष’ के तकनीकी अर्थ में नहीं पढ़ा गया, यद्यपि उसका शेष/बाकी होना बना रहता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सार्वजनिक-पाठ योग्य रूप। वाक्य को हिन्दी में स्पष्टता के लिए दो वाक्यों में बाँटा गया है। ‘यों कहता है’, ‘जलन की आग’ और ‘चरागाह’ मूल की भविष्यद्वाणीय शैली और ठोस बिंबों को बनाए रखते हैं।
