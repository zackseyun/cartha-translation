source:
  edition: WLC
  text: וְ/אַתָּ֣ה בֶן אָדָ֔ם הִנָּבֵ֖א אֶל הָרֵ֣י יִשְׂרָאֵ֑ל וְ/אָ֣מַרְתָּ֔ הָרֵי֙ יִשְׂרָאֵ֔ל שִׁמְע֖וּ דְּבַר יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/036/001.yaml
  text: And you[a], son of man, prophesy to the mountains of Israel, and say, ‘Mountains of Israel[c][b], hear the word of Yahweh.’
translation:
  language: hi
  text: और तू, हे मनुष्य के पुत्र,[a] इस्राएल के पहाड़ों को संबोधित करके भविष्यवाणी कर और कह, ‘हे इस्राएल के पहाड़ो,[b] याहवे[c] का वचन सुनो।’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “हे नश्वर मनुष्य।” यह यहेजकेल को संबोधित करने वाला बार-बार आने वाला इब्रानी पदबंध है।
    reason: lexical_alternative
  - marker: b
    text: या, “इस्राएल के पहाड़ी प्रदेश।” इब्रानी में शाब्दिक रूप से “इस्राएल के पहाड़” है; मुख्य पाठ भूभाग को व्यक्ति की तरह संबोधित करने वाली छवि बनाए रखता है।
    reason: lexical_alternative
  - marker: c
    text: “याहवे” इब्रानी दिव्य नाम יהוה (YHWH) का लिप्यंतरण है; हिन्दी में “यहोवा” भी प्रचलित है, और कई परंपराएँ इसके स्थान पर “प्रभु” लिखती हैं।
    reason: alternative_reading
lexical_decisions:
- source_word: בֶן אָדָם
  choice: मनुष्य के पुत्र
  rationale: यहेजकेल में यह परमेश्वर द्वारा नबी को संबोधित करने का बार-बार आने वाला निश्चित पदबंध है। इसे बनाए रखने से पुस्तक की साहित्यिक निरंतरता बनी रहती है; यहाँ यह मसीही उपाधि नहीं, बल्कि नबी के मनुष्य होने पर बल देने वाला संबोधन है।
- source_word: הִנָּבֵא
  choice: भविष्यवाणी कर
  rationale: नबा धातु का निफ़अल आज्ञार्थ यहाँ नबी को दिए गए आदेश का सामान्य सूत्र है। ‘भविष्यवाणी कर’ आधुनिक हिन्दी में स्पष्ट और स्थापित समतुल्य है।
- source_word: אֶל
  choice: से
  rationale: 'यह पूर्वसर्ग यहाँ संबोधन की दिशा बताता है: नबी को पहाड़ों को संबोधित करना है। अगले प्रत्यक्ष संबोधन से अर्थ स्पष्ट हो जाता है; इसलिए इसे ‘के विरुद्ध’ नहीं किया गया।'
- source_word: הָרֵי יִשְׂרָאֵל
  choice: इस्राएल के पहाड़
  rationale: यह इब्रानी पदबंध का सीधा अर्थ है और निर्जीव भूभाग को व्यक्ति की तरह संबोधित करने वाली यहेजकेल की सजीव छवि को सुरक्षित रखता है।
- source_word: וְאָמַרְתָּ
  choice: और कह
  rationale: पहली आज्ञा के बाद जुड़ी हुई दूसरी आज्ञा का संक्षिप्त और स्वाभाविक हिन्दी रूप।
- source_word: שִׁמְעוּ
  choice: सुनो
  rationale: बहुवचन आज्ञार्थ उन पहाड़ों को संदेश ग्रहण करने के लिए बुलाता है जिन्हें व्यक्ति की तरह संबोधित किया गया है। ‘सुनो’ इसकी सीधी आज्ञात्मक शक्ति और बाइबलीय अनुगूँज बनाए रखता है।
- source_word: דְּבַר יְהוָה
  choice: याहवे का वचन
  rationale: ‘वचन’ मानक नबूवत-सूत्र और उसकी साहित्यिक-धर्मवैज्ञानिक निरंतरता को सुरक्षित रखता है; יְהוָה को व्यक्तिगत दिव्य नाम के रूप में लिप्यंतरित किया गया है।
- source_word: יְהוָה
  choice: याहवे
  rationale: मूल पाठ में चार अक्षरों वाला परमेश्वर का व्यक्तिगत नाम YHWH है। ‘याहवे’ उसका प्रचलित विद्वत्तापूर्ण हिन्दी लिप्यंतरण है और उसे किसी उपाधि से नहीं बदलता।
theological_decisions:
- issue: दिव्य नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; अथवा परंपरागत प्रतिस्थापन ‘प्रभु’
  rationale: मूल में व्यक्तिगत दिव्य नाम YHWH सीधे आया है। ‘याहवे’ नाम को नाम के रूप में सुरक्षित रखता है; पादटिप्पणी हिन्दी पाठकों को अन्य परिचित परंपराओं से अवगत कराती है।
- issue: यहेजकेल में בֶן אָדָם का रूप
  choice: मनुष्य के पुत्र
  alternative: नश्वर मनुष्य
  rationale: यह यहेजकेल में नबी के लिए बार-बार आने वाला संबोधन है। मूल मुहावरे को बनाए रखने से साहित्यिक संगति रहती है और व्याख्यात्मक अर्थ को मुख्य पाठ में थोपने से बचा जाता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य हिन्दी पाठक के लिए सहज रखी गई है। एकवचन ‘तू’ मूल के निकट और नबी को दिए गए सीधे दिव्य संबोधन के अनुकूल है। ‘हे … पहाड़ो’ मानवीकरण को स्पष्ट करता है।
