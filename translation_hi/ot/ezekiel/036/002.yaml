  edition: WLC
  text: כֹּ֤ה אָמַר֙ אֲדֹנָ֣/י יְהוִ֔ה יַ֣עַן אָמַ֧ר הָ/אוֹיֵ֛ב עֲלֵי/כֶ֖ם הֶאָ֑ח וּ/בָמ֣וֹת עוֹלָ֔ם לְ/מֽוֹרָשָׁ֖ה הָ֥יְתָה לָּֽ/נוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/036/002.yaml
  text: 'Thus says the Lord GOD: Because the enemy said against you, ‘Aha!’ and, ‘The ancient heights have become our possession,’'
translation:
  language: hi
  text: 'प्रभु यहोवा यों कहता है: क्योंकि शत्रु ने तुम्हारे विरुद्ध कहा, ‘आहा!’ और, ‘प्राचीन ऊँचे स्थान हमारे अधिकार में हो गए हैं,’'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  choice: प्रभु यहोवा
  rationale: संयुक्त ईश्वरीय उपाधि को स्पष्ट रखते हुए יְהוִה के व्यक्तिगत नाम को ‘यहोवा’ से दर्शाया गया है।
- source_word: הָאוֹיֵב
  choice: शत्रु
  rationale: एकवचन सामूहिक संज्ञा का सीधा और स्वाभाविक हिन्दी रूप।
- source_word: הֶאָח
  choice: आहा!
  rationale: शत्रु के उपहासपूर्ण विजयोल्लास को व्यक्त करने वाला विस्मयादिबोधक।
- source_word: בָמוֹת עוֹלָם
  choice: प्राचीन ऊँचे स्थान
  rationale: עוֹלָם यहाँ संदर्भानुसार अत्यंत पुराने या प्राचीन होने का भाव देता है; ‘सनातन’ अनावश्यक दार्शनिक अर्थ ला सकता है। בָמוֹת को व्यापक रूप में ‘ऊँचे स्थान’ रखा गया है।
- source_word: מוֹרָשָׁה
  choice: विरासत
  rationale: अधिकार में आई पैतृक या स्थायी संपत्ति के भाव को संक्षेप में व्यक्त करता है।
theological_decisions:
- issue: בָמוֹת को धार्मिक पूजा-स्थलों के रूप में या भौगोलिक ऊँचाइयों के रूप में समझना
  choice: ऊँचे स्थान
  alternative: पूजा के ऊँचे स्थान / पहाड़ी प्रदेश
  rationale: इस पद में शब्दार्थ जानबूझकर व्यापक रखा गया है; निकटवर्ती संदर्भ इस्राएल के पर्वतों और भूभाग से जुड़ा है, जबकि בָמוֹת धार्मिक अर्थ भी धारण कर सकता है। अनुवाद किसी एक अर्थ को अनावश्यक रूप से निश्चित नहीं करता।
- issue: עוֹלָם का कालगत अर्थ
  choice: प्राचीन
  alternative: सनातन / सदा के
  rationale: शत्रु भूमि के पुराने, दीर्घकालिक अधिकार का दावा करता है; ‘प्राचीन’ इस संदर्भ को स्वाभाविक रूप से व्यक्त करता और ऊँचे स्थानों को शाश्वत ठहराने से बचता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गंभीर भविष्यवाणी-संबंधी शैली रखी गई है। ‘यों कहता है’ पारंपरिक बाइबिलीय उद्घोष को सहज रूप में बनाए रखता है; उद्धरण की अधूरी व्याकरणिक संरचना अगले पद में जारी रहने के कारण अंत में अल्पविराम रखा गया है।
