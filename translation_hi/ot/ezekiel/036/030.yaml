id: EZK.36.30
reference: Ezekiel 36:30
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/הִרְבֵּיתִי֙ אֶת פְּרִ֣י הָ/עֵ֔ץ וּ/תְנוּבַ֖ת הַ/שָּׂדֶ֑ה לְמַ֗עַן אֲ֠שֶׁר לֹ֣א תִקְח֥וּ ע֛וֹד חֶרְפַּ֥ת רָעָ֖ב בַּ/גּוֹיִֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/036/030.yaml
  text: And I will multiply the fruit of the tree and the produce of the field[a], so that you will no longer bear the reproach of famine among the nations.
translation:
  language: hi
  text: और मैं पेड़ों के फल और खेत की उपज को बहुत बढ़ाऊँगा, ताकि तुम्हें फिर कभी जातियों के बीच अकाल के कारण अपमान न सहना पड़े।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהִרְבֵּיתִי
  choice: और मैं ... को बहुत बढ़ाऊँगा
  rationale: हिफ़ील रूप कारणात्मक वृद्धि और भविष्य की ईश्वरीय प्रतिज्ञा व्यक्त करता है; ‘बहुत बढ़ाऊँगा’ आधुनिक हिन्दी में स्वाभाविक रूप से प्रचुरता भी बताता है।
- source_word: פְּרִי הָעֵץ
  choice: पेड़ों के फल
  rationale: इब्रानी एकवचन सामूहिक अर्थ में है। हिन्दी में ‘पेड़ों के फल’ कृषि-संदर्भ में अधिक सहज है और सामूहिक अर्थ स्पष्ट करता है।
- source_word: וּתְנוּבַת הַשָּׂדֶה
  choice: और खेत की उपज
  rationale: תְּנוּבָה उपज या पैदावार को सूचित करता है; ‘खेत की उपज’ स्रोत के सामूहिक एकवचन को बनाए रखते हुए स्वाभाविक हिन्दी है।
- source_word: לְמַעַן אֲשֶׁר
  choice: ताकि
  rationale: यह उद्देश्य या परिणाम का परिचय देता है; ‘ताकि’ संक्षिप्त और स्वाभाविक हिन्दी समतुल्य है।
- source_word: לֹא תִקְחוּ עוֹד
  choice: तुम्हें फिर कभी ... न सहना पड़े
  rationale: לקח का मूल अर्थ ‘लेना’ है, पर חֶרְפָּה के साथ अपमान को झेलने या सहने का मुहावरेदार भाव बनता है। यह हिन्दी में स्वाभाविक है और अनुभव किए गए तिरस्कार को व्यक्त करता है।
- source_word: חֶרְפַּת רָעָב
  choice: अकाल के कारण अपमान
  rationale: सम्बन्धसूचक पदबंध अकाल से जुड़े सार्वजनिक तिरस्कार या बदनामी को बताता है। ‘अकाल के कारण अपमान’ अस्पष्ट ‘अकाल का अपमान’ की तुलना में हिन्दी में सम्बन्ध स्पष्ट करता है, पर आर्थिक संकट और सार्वजनिक लज्जा दोनों को बनाए रखता है।
- source_word: בַּגּוֹיִם
  choice: जातियों के बीच
  rationale: यह आसपास के गैर-इस्राएली लोगों या राष्ट्रों की ओर संकेत करता है। ‘जातियों’ भविष्यद्वाणी-साहित्य के प्रचलित अर्थ को रखता है; यहाँ ‘अन्यजातियों’ अनावश्यक रूप से नए नियम की शब्दावली जैसा लग सकता है।
theological_decisions:
- issue: क्या प्रतिज्ञा केवल कृषि-समृद्धि पर बल देती है या जातियों के सामने वाचा-संबंधी प्रतिष्ठा की बहाली पर
  choice: 'अनुवाद दोनों को साथ रखता है: परमेश्वर कृषि की उपज बढ़ाता है, जिससे अकाल से जुड़ा सार्वजनिक अपमान समाप्त हो।'
  alternative: इसे केवल आर्थिक समृद्धि या केवल मान-सम्मान की बहाली के रूप में प्रस्तुत करना।
  rationale: इब्रानी पाठ कृषि-वृद्धि को जातियों के बीच अकाल का अपमान दूर होने के उद्देश्य/परिणाम से स्पष्ट रूप से जोड़ता है; किसी एक पहलू को दूसरे में विलीन नहीं करना चाहिए।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण भविष्यद्वाणी-संबंधी गद्य। बहुवचन ‘पेड़ों’ से इब्रानी सामूहिक एकवचन का स्वाभाविक हिन्दी रूप दिया गया है। कोई पादटिप्पणी आवश्यक नहीं मानी गई, क्योंकि मुख्य पाठ में अपमान सहने का मुहावरेदार अर्थ स्पष्ट है।
