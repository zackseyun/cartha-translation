source:
  edition: WLC
  text: לָ/כֵ֞ן אֱמֹ֣ר לְ/בֵֽית יִשְׂרָאֵ֗ל כֹּ֤ה אָמַר֙ אֲדֹנָ֣/י יְהוִ֔ה לֹ֧א לְמַעַנְ/כֶ֛ם אֲנִ֥י עֹשֶׂ֖ה בֵּ֣ית יִשְׂרָאֵ֑ל כִּ֤י אִם לְ/שֵׁם קָדְשִׁ/י֙ אֲשֶׁ֣ר חִלַּלְתֶּ֔ם בַּ/גּוֹיִ֖ם אֲשֶׁר בָּ֥אתֶם שָֽׁם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/036/022.yaml
  text: 'Therefore say to the house of Israel[a], ‘Thus says the Lord GOD: It is not for your sake that I am acting, O house of Israel, but for my holy name[b], which you have profaned among the nations where you went.’'
translation:
  language: hi
  text: 'इसलिए इस्राएल के घराने से कह, ‘प्रभु याहवे यों कहता है: हे इस्राएल के घराने, मैं यह तुम्हारी खातिर नहीं, बल्कि अपने पवित्र नाम की खातिर कर रहा हूँ, जिसे तुमने उन जातियों के बीच अपवित्र किया है, जिनके बीच तुम गए।’'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לָכֵן
  choice: इसलिए
  rationale: यह पिछले प्रसंग से निष्कर्षात्मक संबंध को स्पष्ट और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: לְבֵית יִשְׂרָאֵל
  choice: इस्राएल के घराने से
  rationale: ‘घराना’ सामूहिक और वाचागत अभिव्यक्ति को बनाए रखता है; हिन्दी में ‘कह’ के साथ ‘से’ स्वाभाविक है।
- source_word: כֹּה אָמַר
  choice: यों कहता है
  rationale: यह नबूवत के परंपरागत संदेशवाहक-सूत्र का संक्षिप्त, गरिमापूर्ण हिन्दी रूप है।
- source_word: אֲדֹנָי יְהוִה
  choice: प्रभु यहोवा
  rationale: दोनों पदों को अलग रखते हुए אֲדֹנָי को ‘प्रभु’ और परमेश्वर के विशिष्ट नाम יהוה को हिन्दी में प्रचलित ‘यहोवा’ से व्यक्त किया गया है।
- source_word: לֹא לְמַעַנְכֶם אֲנִי עֹשֶׂה
  choice: मैं यह तुम्हारे कारण नहीं कर रहा हूँ
  rationale: לְמַעַן का अभिप्राय प्रेरक कारण है; ‘यह’ प्रसंग में निहित दैवी कार्य की ओर संकेत करता है और हिन्दी वाक्य को स्वाभाविक बनाता है।
- source_word: כִּי אִם לְשֵׁם קָדְשִׁי
  choice: बल्कि अपने पवित्र नाम के कारण कर रहा हूँ
  rationale: नकार के बाद כִּי אִם का तीखा विरोध ‘बल्कि’ से स्पष्ट होता है; ‘पवित्र नाम’ मूल धर्मवैचारिक धारणा को अक्षुण्ण रखता है।
- source_word: אֲשֶׁר חִלַּלְתֶּם
  choice: जिसे तुमने ... अपवित्र किया
  rationale: पिएल रूप חלל यहाँ किसी पवित्र वस्तु को साधारण या अपवित्र ठहराने का भाव देता है; ‘अपवित्र किया’ स्पष्ट और प्रचलित हिन्दी है।
- source_word: בַּגּוֹיִם אֲשֶׁר בָּאתֶם שָׁם
  choice: उन जातियों के बीच ... जिनके बीच तुम जा पहुँचे
  rationale: ‘जातियाँ’ גּוֹיִם का व्यापक अर्थ रखता है; ‘जा पहुँचे’ निर्वासन के संदर्भ में हिन्दी दृष्टिकोण से स्वाभाविक है और मूल के ‘वहाँ पहुँचे’ भाव को बनाए रखता है।
theological_decisions:
- issue: पुनर्स्थापन के लिए परमेश्वर की प्रेरणा
  choice: तुम्हारे कारण नहीं ... बल्कि अपने पवित्र नाम के कारण
  alternative: तुम्हारे हित के लिए नहीं ... बल्कि अपने पवित्र नाम की खातिर
  rationale: मूल पाठ इस्राएल की योग्यता या हित के बजाय परमेश्वर के पवित्र नाम को उसके कार्य का आधार बताता है; अनुवाद इस तनाव को बिना नरम किए बनाए रखता है।
- issue: אֲדֹנָי יְהוִה में परमेश्वर के नाम का रूप
  choice: प्रभु यहोवा
  alternative: प्रभु याहवे / प्रभु परमेश्वर
  rationale: ‘प्रभु यहोवा’ दोनों हिब्रू पदों को अलग-अलग व्यक्त करता है और हिन्दी पाठकों के लिए परिचित है; ‘प्रभु परमेश्वर’ विशिष्ट नाम को सामान्य उपाधि बना देता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सार्वजनिक पाठ के अनुकूल रखी गई है। ‘हे इस्राएल के घराने’ मूल में दोहराए गए प्रत्यक्ष संबोधन और उसके जोर को बनाए रखता है। किसी परामर्श-पाठ की त्रुटिपूर्ण या असंगत पादटिप्पणी को ग्रहण नहीं किया गया, क्योंकि इस पद के हिब्रू पाठ में उसके लिए ठोस आधार नहीं है।
