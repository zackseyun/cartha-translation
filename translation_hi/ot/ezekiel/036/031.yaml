reference: Ezekiel 36:31
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וּ/זְכַרְתֶּם֙ אֶת דַּרְכֵי/כֶ֣ם הָ/רָעִ֔ים וּ/מַעַלְלֵי/כֶ֖ם אֲשֶׁ֣ר לֹֽא טוֹבִ֑ים וּ/נְקֹֽטֹתֶם֙ בִּ/פְנֵי/כֶ֔ם עַ֚ל עֲוֺנֹ֣תֵי/כֶ֔ם וְ/עַ֖ל תּוֹעֲבֽוֹתֵי/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/036/031.yaml
  text: Then you will remember your evil ways and your deeds that were not good[a], and you will loathe yourselves for your iniquities and your abominations.
translation:
  language: hi
  text: तब तुम अपने बुरे चालचलन और अपने उन कामों को याद करोगे जो अच्छे नहीं थे; और अपने अधर्मों तथा अपने घिनौने कामों के कारण तुम्हें अपने आप से घृणा होगी।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तुम अपनी ही दृष्टि में अपने से घृणा करोगे।”
    reason: בִּפְנֵיכֶם का शाब्दिक अर्थ ‘अपने सामने/अपनी दृष्टि में’ है; मुख्य पाठ में पूरे मुहावरे का स्वाभाविक आत्मवाचक अर्थ दिया गया है।
lexical_decisions:
- source_word: וּזְכַרְתֶּם
  choice: तब तुम ... याद करोगे
  rationale: संदर्भ में पुनर्स्थापना की पिछली प्रतिज्ञाओं के परिणाम को व्यक्त करने के लिए वाव-सहित पूर्ण क्रिया का भाव भविष्यकालीन है; ‘तब’ परिणामसूचक क्रम को स्वाभाविक हिन्दी में स्पष्ट करता है।
- source_word: דַּרְכֵיכֶם הָרָעִים
  choice: अपने बुरे चालचलन
  rationale: דֶּרֶךְ का मूल अर्थ ‘मार्ग’ है, पर यहाँ यह नैतिक जीवन-व्यवहार का रूपक है। ‘चालचलन’ साधारण आधुनिक हिन्दी में उस आशय को स्पष्ट रखता है।
- source_word: וּמַעַלְלֵיכֶם אֲשֶׁר לֹא טוֹבִים
  choice: अपने उन कामों ... जो अच्छे नहीं थे
  rationale: מַעֲלָל ठोस कार्यों को सूचित करता है। ‘अच्छे नहीं थे’ मूल के निषेधात्मक कथन को बनाए रखता है और उसे अनावश्यक रूप से ‘बुरे’ में तीव्र नहीं करता।
- source_word: וּנְקֹטֹתֶם בִּפְנֵיכֶם
  choice: तुम्हें अपने आप से घृणा होगी
  rationale: נקט यहाँ नैतिक आत्म-विकर्षण या घृणा का बोध देता है। בִּפְנֵיכֶם के साथ पूरा पद हिन्दी में स्वाभाविक रूप से आत्म-घृणा व्यक्त करता है; अधिक शाब्दिक संरचना पादटिप्पणी में दी गई है।
- source_word: עַל עֲוֺנֹתֵיכֶם
  choice: अपने अधर्मों ... के कारण
  rationale: עָוֹן नैतिक कुटिलता, अधर्म या दोष का भार रखता है। ‘अधर्म’ इस गंभीरता को बनाए रखता है, और עַל का कारणसूचक भाव ‘के कारण’ से स्पष्ट होता है।
- source_word: וְעַל תּוֹעֲבֹתֵיכֶם
  choice: तथा अपने घिनौने कामों के कारण
  rationale: תּוֹעֵבָה किसी नैतिक या उपासना-संबंधी घृणित वस्तु या आचरण को सूचित करता है। ‘घिनौने काम’ आधुनिक पाठक के लिए स्पष्ट है और मूल की तीव्रता भी रखता है।
theological_decisions:
- issue: पुनर्स्थापना के बाद इस्राएल की प्रतिक्रिया का स्वरूप
  choice: पद को बीते पापों के स्मरण और उनके कारण गहरी आत्म-घृणा के रूप में रखा गया है।
  alternative: इसे केवल मनोवैज्ञानिक पछतावा कहना, या इसमें बाद की पूर्ण विकसित पश्चाताप-संबंधी धर्मशास्त्रीय शब्दावली जोड़ना।
  rationale: निकट संदर्भ में यह प्रतिक्रिया परमेश्वर के पुनर्स्थापना-कार्य के बाद आती है, पर पद स्वयं न तो इसे केवल भावना तक सीमित करता है, न विस्तृत धर्मशास्त्रीय परिभाषा देता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘चालचलन,’ ‘अधर्म’ और ‘घिनौने काम’ नैतिक गंभीरता बनाए रखते हैं, पर अत्यधिक पुरातन या संप्रदाय-विशिष्ट शब्दावली से बचते हैं।
