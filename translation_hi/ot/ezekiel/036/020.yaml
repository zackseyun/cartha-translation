source:
  edition: WLC
  text: וַ/יָּב֗וֹא אֶל הַ/גּוֹיִם֙ אֲשֶׁר בָּ֣אוּ שָׁ֔ם וַֽ/יְחַלְּל֖וּ אֶת שֵׁ֣ם קָדְשִׁ֑/י בֶּ/אֱמֹ֤ר לָ/הֶם֙ עַם יְהוָ֣ה אֵ֔לֶּה וּ/מֵ/אַרְצ֖/וֹ יָצָֽאוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/036/020.yaml
  text: And when they came to the nations where they went[a], they profaned my holy name, in that people said of them, ‘These are the people of Yahweh[b], and yet they had to go out of his land.’
translation:
  language: hi
  text: वे जिन राष्ट्रों में गए, वहाँ पहुँचकर उन्होंने मेरे पवित्र नाम को अपवित्र किया, क्योंकि उनके विषय में[a] कहा गया, “ये यहवे के लोग हैं, फिर भी इन्हें उसके देश से निकलना पड़ा।”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “उनसे” या “उन्हें”; प्रसंग में आशय उनके विषय में कही गई बात से है।
    reason: lexical_alternative
  - marker: b
    text: या, अधिक शाब्दिक रूप से, “और वे उसके देश से निकल गए।” इब्रानी निर्वासन के अपमान को सूचित करता है, पर यहाँ यह स्पष्ट नहीं कहता कि उन्हें किसने निकाला।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבוֹא אֶל־הַגּוֹיִם אֲשֶׁר־בָּאוּ שָׁם
  choice: वे जिन जातियों के बीच गए, वहाँ पहुँचकर
  rationale: וַיָּבוֹא का रूप एकवचन है, पर निकटवर्ती בָּאוּ और וַיְחַלְּלוּ बहुवचन हैं और सामूहिक प्रजा संदर्भित है। हिंदी में बहुवचन रखने से आशय स्वाभाविक और स्पष्ट रहता है। הַגּוֹיִם यहाँ विदेशी जातियों/राष्ट्रों को सूचित करता है; ‘जातियों के बीच’ निर्वासन के प्रसंग को सहज रूप से व्यक्त करता है।
- source_word: וַיְחַלְּלוּ
  choice: उन्होंने ... अपवित्र किया
  rationale: पिएल रूप में חלל का अर्थ किसी पवित्र वस्तु की पवित्रता का अनादर करना है। ‘अपवित्र किया’ आधुनिक हिंदी में सुबोध है और परमेश्वर के नाम से जुड़ी धार्मिक गंभीरता बनाए रखता है।
- source_word: שֵׁם קָדְשִׁי
  choice: मेरे पवित्र नाम
  rationale: यह इब्रानी पदबंध का स्वाभाविक और निकट हिंदी रूप है तथा परमेश्वर की प्रतिष्ठा और प्रकट पहचान दोनों का संकेत बनाए रखता है।
- source_word: בֶּאֱמֹר לָהֶם
  choice: क्योंकि उनके विषय में कहा गया
  rationale: शाब्दिक रूप से לָהֶם ‘उनसे/उनके लिए’ है, किंतु प्रसंग में राष्ट्रों के बीच इस्राएल के विषय में कही जाने वाली बात अभिप्रेत है। कर्मवाच्य वाक्य इस बात को खुला रखता है कि कहने वाले कौन थे और नाम का अपमान किस प्रकार प्रकट हुआ।
- source_word: עַם יְהוָה אֵלֶּה
  choice: ये यहवे के लोग हैं
  rationale: निर्देशक אֵלֶּה का बल ‘ये’ से बना रहता है। יְהוָה को व्यक्तिगत वाचा-नाम ‘यहवे’ के रूप में लिप्यंतरित किया गया है।
- source_word: וּמֵאַרְצוֹ יָצָאוּ
  choice: फिर भी इन्हें उसके देश से निकलना पड़ा
  rationale: मूल पाठ शाब्दिक रूप से कहता है कि वे उसके देश से निकले। निर्वासन के अपमानजनक आशय को ‘निकलना पड़ा’ व्यक्त करता है, पर यह स्पष्ट रूप से नहीं जोड़ता कि किसने उन्हें निकाला।
theological_decisions:
- issue: यहोवा-नाम יְהוָה का रूप
  choice: यहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में वाचा-नाम स्वयं उपस्थित है। ‘यहवे’ उसे उपाधि में बदले बिना आधुनिक हिंदी देवनागरी में प्रस्तुत करता है।
- issue: परमेश्वर के नाम को किसने अपवित्र किया
  choice: बहुवचन ‘उन्होंने’ द्वारा निर्वासित इस्राएल को व्याकरणिक कर्ता रखा गया, जबकि ‘उनके विषय में कहा गया’ नाम के अपमान के प्रकट होने का माध्यम बताता है
  alternative: जातियों को प्रत्यक्ष कर्ता बनाना कि उन्होंने यह कहकर नाम अपवित्र किया
  rationale: निकटवर्ती बहुवचन क्रिया निर्वासित प्रजा की ओर संकेत करती है, पर कथन और अपमान के बीच संबंध संक्षिप्त तथा तनावपूर्ण है। अनुवाद किसी एक पक्ष को अनावश्यक रूप से पूर्णतः दोषी ठहराकर इस तनाव को समाप्त नहीं करता।
- issue: निर्वासन की विवशता
  choice: निकलना पड़ा
  alternative: निकल गए; निकाल दिए गए
  rationale: प्रसंग विवश और लज्जाजनक निर्वासन सूचित करता है, किंतु इब्रानी यहाँ स्पष्ट कर्मवाच्य ‘निकाल दिए गए’ नहीं कहता। चुना हुआ रूप निहित विवशता को व्यक्त करते हुए निष्कासन के कर्ता को अनकहा रखता है।
translation_notes:
  register: आधुनिक मानक हिंदी, सामान्य पाठक के लिए सुबोध किंतु गरिमापूर्ण। ‘जातियों के बीच’, ‘पवित्र नाम’ और ‘यहवे’ जैसे पद मूल की धार्मिक तथा वाचागत गंभीरता बनाए रखते हैं। उद्धरण में ‘इन्हें’ बाहरी लोगों की दृष्टि से इस्राएल की ओर संकेत को स्वाभाविक हिंदी में व्यक्त करता है।
