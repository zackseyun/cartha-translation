source:
  edition: WLC
  text: כְּ/צֹ֣אן קָֽדָשִׁ֗ים כְּ/צֹ֤אן יְרוּשָׁלִַ֨ם֙ בְּ/מ֣וֹעֲדֶ֔י/הָ כֵּ֤ן תִּהְיֶ֨ינָה֙ הֶ/עָרִ֣ים הֶ/חֳרֵב֔וֹת מְלֵא֖וֹת צֹ֣אן אָדָ֑ם וְ/יָדְע֖וּ כִּֽי אֲנִ֥י יְהוָֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/036/038.yaml
  text: Like the holy flock[a], like the flock of Jerusalem at her appointed feasts, so the ruined cities will be filled with flocks of people. Then they will know that I am Yahweh.
translation:
  language: hi
  text: जैसे पवित्र भेड़-बकरियों का झुंड, जैसे यरूशलेम में उसके नियत पर्वों के समय भेड़-बकरियों के झुंड होते हैं, वैसे ही उजड़े हुए नगर मनुष्यों के झुंडों से भर जाएँगे। तब वे जानेंगे कि मैं यहवे हूँ।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כְּצֹאן קָדָשִׁים
  choice: जैसे पवित्र बलियों का झुंड
  rationale: קָדָשִׁים का शाब्दिक अर्थ ‘पवित्र वस्तुएँ/पवित्र जन’ हो सकता है, पर पर्वकालीन यरूशलेम और पशुओं के झुंड के समानांतर संदर्भ में यह बलि के लिए पवित्र ठहराए गए पशुओं की ओर संकेत करता है। हिंदी में ‘पवित्र बलियों का झुंड’ इस उपासना-संबंधी आशय को स्वाभाविक रूप से स्पष्ट करता है।
- source_word: כְּצֹאן יְרוּשָׁלִַם בְּמוֹעֲדֶיהָ
  choice: जैसे यरूशलेम में उसके नियत पर्वों के समय भेड़-बकरियों के झुंड होते हैं
  rationale: מוֹעֵד यहाँ उपासना के लिए नियत पर्वों को दर्शाता है। צֹאן छोटे पालतू पशुओं का सामूहिक शब्द है, इसलिए ‘भेड़-बकरियों के झुंड’ हिंदी में दृश्य को स्पष्ट रखता है। स्त्रीलिंग प्रत्यय को ‘उसके’ द्वारा यरूशलेम से जोड़ा गया है।
- source_word: הֶעָרִים הֶחֳרֵבוֹת
  choice: उजड़े हुए नगर
  rationale: חֳרֵבוֹת उन नगरों को बताता है जो विनाश के कारण उजाड़ पड़े हैं; ‘उजड़े हुए’ आधुनिक हिंदी में स्वाभाविक और अर्थ-सटीक है।
- source_word: מְלֵאוֹת צֹאן אָדָם
  choice: मनुष्यों के झुंडों से भर जाएँगे
  rationale: हिब्रू का निकट अर्थ ‘मनुष्य के झुंड से भरे’ है। ‘मनुष्यों के झुंडों’ से लोगों की अत्यधिक वृद्धि और भेड़-बकरियों वाले पूर्ववर्ती बिंब, दोनों सुरक्षित रहते हैं।
- source_word: וְיָדְעוּ
  choice: तब वे जानेंगे
  rationale: संयोजक वाव यहाँ परिणामसूचक प्रवाह रखता है; ‘तब’ उस परिणाम को सहज हिंदी में व्यक्त करता है।
- source_word: יְהוָה
  choice: यहवे
  rationale: परमेश्वर के व्यक्तिगत नाम चतुरक्षर को उपाधि से बदलने के बजाय हिंदी में प्रचलित निकट लिप्यंतरण ‘यहवे’ रखा गया है।
theological_decisions:
- issue: כְּצֹאן קָדָשִׁים में ‘पवित्र’ का संबंध
  choice: इसे बलि के लिए पवित्र पशुओं के झुंड के रूप में व्यक्त किया गया है
  alternative: ‘पवित्र जनों का झुंड’ या ‘पवित्र वस्तुओं का झुंड’
  rationale: यरूशलेम के नियत पर्वों में बड़ी संख्या में लाए गए पशुओं का समानांतर उल्लेख बलिदानी अर्थ को प्रबल बनाता है, फिर भी अनुवाद किसी विशिष्ट बलि-विधान को नहीं जोड़ता।
- issue: צֹאן אָדָם का रूपक
  choice: मनुष्यों के झुंडों से
  alternative: लोगों से, मानो किसी झुंड से
  rationale: स्रोत की असामान्य परंतु अर्थपूर्ण रूपकात्मक अभिव्यक्ति को समतल किए बिना हिंदी में बोधगम्य रखा गया है।
- issue: ईश्वरीय नाम יְהוָה
  choice: यहवे
  alternative: यहोवा; प्रभु
  rationale: मूल में व्यक्तिगत वाचा-नाम है; इसलिए उसका लिप्यंतरण किया गया है, उसे केवल उपाधि में नहीं बदला गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। पर्वकालीन बलि-पशुओं और बढ़ी हुई मानव आबादी के बीच मूल रूपक को बनाए रखने के लिए ‘झुंड’ की पुनरावृत्ति जानबूझकर रखी गई है।
