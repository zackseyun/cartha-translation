base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/036/033.yaml
  text: 'Thus says the Lord GOD: On the day I cleanse you from all your iniquities[a], I will cause the cities to be inhabited[c][b], and the ruins will be rebuilt.'
translation:
  language: hi
  text: 'प्रभु याहवे[a] यों कहते हैं: जिस दिन मैं तुम्हें तुम्हारे सब अधर्मों से शुद्ध करूँगा, उस दिन मैं नगरों को आबाद करूँगा,[b] और उजड़े हुए स्थानों का पुनर्निर्माण किया जाएगा।[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में ‘अदोनाय याहवे’; इसका अनुवाद ‘प्रभु परमेश्वर’ भी किया जाता है।
    reason: alternative_reading
  - marker: b
    text: अर्थात, मैं नगरों में लोगों को बसाऊँगा।
    reason: lexical_alternative
  - marker: c
    text: या, ‘खंडहरों का पुनर्निर्माण किया जाएगा’ अथवा ‘उजाड़ स्थानों को बनाया जाएगा।’
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  choice: प्रभु याहवे
  rationale: संयुक्त उपाधि में אֲדֹנָי को ‘प्रभु’ और परमेश्वर के विशिष्ट नाम יהוה को ‘याहवे’ के रूप में रखा गया है, ताकि मूल पाठ में उपस्थित नाम और उपाधि दोनों स्पष्ट रहें।
- source_word: בְּיוֹם טַהֲרִי אֶתְכֶם
  choice: जिस दिन मैं तुम्हें … शुद्ध करूँगा, उस दिन
  rationale: यह हिन्दी में स्वाभाविक रहते हुए בְּיוֹם की काल-सूचक रचना और טהר के पिएल रूप में निहित शुद्ध करने के भाव को सुरक्षित रखता है।
- source_word: מִכֹּל עֲוֺנוֹתֵיכֶם
  choice: तुम्हारे सब अधर्मों से
  rationale: עָוֹן के नैतिक अपराध/कुटिलता के भार को ‘अधर्म’ व्यक्त करता है; ‘से’ शुद्ध किए जाने में अलगाव या मुक्ति का भाव देता है।
- source_word: וְהוֹשַׁבְתִּי אֶת הֶעָרִים
  choice: मैं नगरों को फिर से आबाद करूँगा
  rationale: ישׁב का हिफ़ील रूप कारक है—नगरों को बसाना या उनमें लोगों का निवास कराना। ‘आबाद करूँगा’ हिन्दी में इस कारक अर्थ को स्वाभाविक ढंग से व्यक्त करता है। ‘फिर से’ पुनर्स्थापना के संदर्भ से स्पष्ट है, यद्यपि अलग शब्द के रूप में इब्रानी में नहीं है।
- source_word: וְנִבְנוּ הֶחֳרָבוֹת
  choice: उजड़े हुए स्थान फिर बनाए जाएँगे
  rationale: חֳרָבוֹת उजाड़ या ध्वस्त स्थानों को सूचित करता है, और נִבְנוּ के निफ़अल रूप को हिन्दी के कर्मवाच्य ‘बनाए जाएँगे’ से व्यक्त किया गया है।
theological_decisions:
- issue: संयुक्त ईश्वरीय उपाधि אֲדֹנָי יְהוִה का अनुवाद
  choice: प्रभु याहवे
  alternative: प्रभु परमेश्वर / प्रभु यहोवा
  rationale: मूल में सामान्य उपाधि और वाचा-संबंधी विशिष्ट नाम दोनों हैं। ‘प्रभु याहवे’ इस भेद को बनाए रखता है और नाम को केवल सामान्य पदवी में नहीं बदलता। प्रचलित वैकल्पिक रूप पादटिप्पणी में दिए गए हैं।
- issue: शुद्धीकरण और नगरों की पुनर्बहाली के बीच काल-संबंध
  choice: जिस दिन … उस दिन
  alternative: जब मैं … तब
  rationale: यह בְּיוֹם की निकट संरचना को बनाए रखता है, बिना इस बात को अतिरिक्त रूप से समझाए कि आगे के सभी परिणाम अनिवार्यतः एक ही चौबीस घंटे में पूरे होंगे।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज रखी गई है। ‘आबाद करूँगा’ कारक क्रिया को स्वाभाविक बनाता है, जबकि ‘उजड़े हुए स्थान फिर बनाए जाएँगे’ मूल के कर्मवाच्य और उजाड़पन दोनों को बनाए रखता है।
