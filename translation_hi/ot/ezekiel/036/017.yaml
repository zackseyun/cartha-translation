  text: בֶּן אָדָ֗ם בֵּ֤ית יִשְׂרָאֵל֙ יֹשְׁבִ֣ים עַל אַדְמָתָ֔/ם וַ/יְטַמְּא֣וּ אוֹתָ֔/הּ בְּ/דַרְכָּ֖/ם וּ/בַ/עֲלִֽילוֹתָ֑/ם כְּ/טֻמְאַת֙ הַ/נִּדָּ֔ה הָיְתָ֥ה דַרְכָּ֖/ם לְ/פָנָֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/036/017.yaml
  text: Son of man[a], when the house of Israel was dwelling on their own land, they defiled it by their way and by their deeds; their way before me was like the uncleanness of a menstruating woman.
translation:
  language: hi
  text: “हे मनुष्य-पुत्र, जब इस्राएल का घराना अपनी भूमि पर रहता था, तब उन्होंने अपने आचरण और अपने कर्मों से उसे अशुद्ध कर दिया। मेरे सामने उनका आचरण मासिक धर्म की अशुद्धता[a] के समान था।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “मासिक धर्म वाली स्त्री की अशुद्धता।” हिब्रू में इस्राएल के आचरण की तुलना मासिक धर्म से जुड़ी अनुष्ठानिक अशुद्धता से की गई है।
    reason: मूल पदबंध की वैकल्पिक, अधिक व्यक्तिनिष्ठ अभिव्यक्ति देना और ‘अशुद्धता’ के अनुष्ठानिक संदर्भ को स्पष्ट करना।
lexical_decisions:
- source_word: בֶּן אָדָם
  choice: हे मनुष्य के पुत्र
  rationale: यहेजकेल में नबी के लिए प्रयुक्त नियमित संबोधन है। यह हिब्रू मुहावरे और पुस्तक की साहित्यिक निरंतरता को बनाए रखता है।
- source_word: בֵּית יִשְׂרָאֵל
  choice: इस्राएल का घराना
  rationale: यह इस्राएल को एक सामूहिक और वाचागत इकाई के रूप में व्यक्त करने वाला पारंपरिक पद है।
- source_word: יֹשְׁבִים עַל אַדְמָתָם
  choice: अपनी भूमि पर रहता था
  rationale: कृदंत वहाँ लगातार निवास करने की पृष्ठभूमि देता है; एकवचन क्रिया सामूहिक ‘घराना’ के अनुरूप है।
- source_word: וַיְטַמְּאוּ אוֹתָהּ
  choice: उन्होंने उसे अशुद्ध कर दिया
  rationale: ‘अशुद्ध’ भूमि की धार्मिक और नैतिक अपवित्रता, दोनों की प्रतिध्वनि सुरक्षित रखता है।
- source_word: בְּדַרְכָּם וּבַעֲלִילוֹתָם
  choice: अपने चालचलन और अपने कामों से
  rationale: ‘चालचलन’ דֶּרֶךְ के आचरण-संबंधी रूपक को स्वाभाविक हिन्दी में व्यक्त करता है, जबकि ‘काम’ वास्तविक कृत्यों को दर्शाता है।
- source_word: כְּטֻמְאַת הַנִּדָּה
  choice: मासिक धर्म की अशुद्धता के समान
  rationale: यह मासिक धर्म से जुड़ी धार्मिक अशुद्धता के स्पष्ट हिब्रू बिंब को बिना शिथिल किए सुरक्षित रखता है।
- source_word: הָיְתָה דַרְכָּם לְפָנָי
  choice: मेरे सामने उनका चालचलन ... था
  rationale: ‘मेरे सामने’ परमेश्वर की उपस्थिति तथा उसके मूल्यांकन, दोनों को सीधे व्यक्त करता है।
theological_decisions:
- issue: अशुद्धता की भाषा का स्वरूप
  choice: इस्राएल के नैतिक चालचलन की तुलना मासिक धर्म से जुड़ी धार्मिक अशुद्धता से स्पष्ट रूप में की गई है।
  alternative: इसे केवल सामान्य ‘गंदगी’ या ‘प्रदूषण’ कहना।
  rationale: मूल पाठ धार्मिक अशुद्धता के बिंब द्वारा भूमि की नैतिक अपवित्रता बताता है; सामान्यीकृत शब्द इस धर्मवैधानिक रूपक को मिटा देगा।
- issue: आरंभिक कृदंतीय उपवाक्य का कालगत संबंध
  choice: ‘जब ... रहता था, तब ...’ के द्वारा पृष्ठभूमि और बाद की क्रिया का संबंध स्पष्ट किया गया है।
  alternative: शाब्दिक किंतु अस्वाभाविक कृदंतीय रचना बनाए रखना।
  rationale: हिब्रू कृदंत निरंतर निवास की परिस्थिति प्रस्तुत करता है। ‘जब...तब’ हिन्दी में वही संबंध स्वाभाविक ढंग से व्यक्त करता है।
- issue: ‘इस्राएल का घराना’ के बाद सर्वनाम-वचन
  choice: निवास के लिए व्याकरणिक एकवचन ‘रहता था’, फिर लोगों को सूचित करने के लिए अर्थानुसार बहुवचन ‘उन्होंने’।
  alternative: पूरे वाक्य में केवल एकवचन या केवल बहुवचन रखना।
  rationale: हिब्रू में सामूहिक संज्ञा के साथ कृदंत और अगली क्रिया बहुवचन हैं। हिन्दी में यह बदलाव सामूहिक संस्था और उसके सदस्यों, दोनों को स्वाभाविक रूप से सामने लाता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सामान्य पाठकों के लिए सुबोध रूप। ‘मनुष्य के पुत्र’, ‘इस्राएल का घराना’ और ‘मेरे सामने’ से यहेजकेल की विशिष्ट भाषा सुरक्षित रखी गई है; ‘मासिक धर्म’ स्पष्ट और सम्मानजनक आधुनिक शब्दावली है।
