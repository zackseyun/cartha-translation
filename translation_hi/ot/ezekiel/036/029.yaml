base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/036/029.yaml
  text: I will save you from all your uncleannesses[a], and I will call for the grain and multiply it[b], and I will not bring famine upon you.
translation:
  language: hi
  text: मैं तुम्हें तुम्हारी सब अशुद्धताओं से बचाऊँगा[a]। मैं अनाज को बुलाऊँगा और उसे बहुत बढ़ाऊँगा[b], और तुम पर अकाल नहीं लाऊँगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तुम्हारी सब अपवित्रताओं से।” इब्रानी में प्रयुक्त अशुद्धता की भाषा अनुष्ठानिक और नैतिक, दोनों प्रकार की अशुद्धता को समेट सकती है।
    reason: lexical_alternative
  - marker: b
    text: या, “मैं अनाज को पुकारूँगा।” इब्रानी में परमेश्वर द्वारा अनाज को पुकारने का चित्र है; यह कृषि की बहुतायत पर उसके प्रभुतापूर्ण आदेश को उभारता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוֹשַׁעְתִּי
  choice: मैं ... बचाऊँगा
  rationale: ישׁע के हिफ़ील रूप का सीधा अर्थ बचाना या छुड़ाना है। यह चुनाव परमेश्वर द्वारा लोगों को उनकी अशुद्ध दशा और उसके परिणामों से निकालने का भाव रखता है, पर उद्धार की रीति को आवश्यकता से अधिक निर्दिष्ट नहीं करता।
- source_word: מִכֹּל טֻמְאוֹתֵיכֶם
  choice: तुम्हारी सब अशुद्धताओं से
  rationale: טֻמְאָה की शब्दावली यहेजकेल में धार्मिक और नैतिक, दोनों प्रकार की अशुद्धता को समेट सकती है। बहुवचन ‘अशुद्धताओं’ मूल पाठ की व्यापकता और तनाव को बनाए रखता है।
- source_word: וְקָרָאתִי אֶל הַדָּגָן
  choice: मैं अनाज को बुलाऊँगा
  rationale: קרא אל का मूल चित्र किसी को पुकारने या बुलाने का है। यहाँ यह कृषि-उपज पर परमेश्वर के प्रभुतापूर्ण आदेश को व्यक्त करता है।
- source_word: הַדָּגָן
  choice: अनाज
  rationale: דגן सामान्य रूप से धान्य या अन्न की उपज को दर्शाता है, किसी एक विशेष फसल को नहीं। ‘अनाज’ आधुनिक हिन्दी में स्वाभाविक और व्यापक है।
- source_word: וְהִרְבֵּיתִי אֹתוֹ
  choice: उसे बहुत बढ़ाऊँगा
  rationale: רבה का हिफ़ील रूप किसी वस्तु को बहुतायत में करने या बढ़ाने का अर्थ देता है। यह वाक्यांश अनाज की उपज में प्रचुर वृद्धि को स्पष्ट और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וְלֹא אֶתֵּן עֲלֵיכֶם רָעָב
  choice: तुम पर अकाल नहीं लाऊँगा
  rationale: נתן על के साथ רָעָב किसी पर अकाल डालने या लाने का मुहावरा है। ‘अकाल नहीं लाऊँगा’ आधुनिक हिन्दी में स्पष्ट रहते हुए परमेश्वर की क्रियाशीलता को बनाए रखता है।
theological_decisions:
- issue: इस प्रसंग में उद्धार का स्वरूप
  choice: अशुद्धता और उसके परिणामों से ऐतिहासिक-वाचागत छुटकारा, जिसमें व्यापक धर्मवैज्ञानिक प्रतिध्वनि भी बनी रहती है
  alternative: इसे केवल पाप से आत्मिक उद्धार या केवल अनुष्ठानिक शुद्धि मानना
  rationale: यहेजकेल 36 में शुद्धि, नया हृदय और आत्मा, देश की पुनर्स्थापना तथा कृषि-संपन्नता एक साथ हैं। ‘बचाऊँगा’ इन सभी से जुड़े उद्धार के भाव को रखता है, बिना पद को किसी बाद की संकीर्ण धर्मसैद्धांतिक श्रेणी तक सीमित किए।
- issue: अशुद्धता की शब्दावली
  choice: ‘अशुद्धताओं’ कहकर धार्मिक और नैतिक अशुद्धता के बीच मूल पाठ की व्यापकता बनाए रखना
  alternative: इसे केवल ‘पापों’ या केवल अनुष्ठानिक ‘अपवित्रताओं’ के रूप में स्पष्ट कर देना
  rationale: इब्रानी טֻמְאָה यहेजकेल में उपासना-संबंधी और नैतिक प्रदूषण दोनों को सूचित कर सकता है; इसलिए अनुवाद किसी एक अर्थ को अनावश्यक रूप से निर्णायक नहीं बनाता।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य शैली रखी गई है। ‘अनाज को बुलाऊँगा’ जानबूझकर मूल इब्रानी के सजीव रूपक को बनाए रखता है, जबकि ‘बहुत बढ़ाऊँगा’ उसके परिणाम को स्वाभाविक हिन्दी में व्यक्त करता है।
