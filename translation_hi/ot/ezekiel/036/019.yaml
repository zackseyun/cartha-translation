  text: וָ/אָפִ֤יץ אֹתָ/ם֙ בַּ/גּוֹיִ֔ם וַ/יִּזָּר֖וּ בָּ/אֲרָצ֑וֹת כְּ/דַרְכָּ֥/ם וְ/כַ/עֲלִילוֹתָ֖/ם שְׁפַטְתִּֽי/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/036/019.yaml
  text: So I scattered them among the nations[a], and they were dispersed through the lands; I judged them according to their ways and according to their deeds.
translation:
  language: hi
  text: तब मैंने उन्हें राष्ट्रों के बीच तितर-बितर कर दिया, और वे देशों में बिखर गए[a]। मैंने उनके चालचलन और उनके कर्मों के अनुसार उनका न्याय किया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वे देशों में छितरा दिए गए।”
    reason: निफ़अल क्रिया וַיִּזָּרוּ के संभावित कर्मवाच्य अर्थ को दर्शाने वाला वैकल्पिक अनुवाद।
lexical_decisions:
- source_word: וָאָפִיץ
  choice: मैंने उन्हें…तितर-बितर कर दिया
  rationale: हिफ़ईल रूप में किसी को बिखेरने का कारण बनना व्यक्त होता है। यह चयन परमेश्वर की स्पष्ट कर्तृता बनाए रखता है और निर्वासन के ढंग के बारे में अनावश्यक विवरण नहीं जोड़ता।
- source_word: בַּגּוֹיִם
  choice: जातियों के बीच
  rationale: यहाँ גּוֹיִם उन विदेशी जातियों या राष्ट्रों को सूचित करता है जिनके बीच इस्राएल को निर्वासित किया गया। ‘जातियों’ से मूल का सामूहिक अर्थ स्वाभाविक हिन्दी में बना रहता है।
- source_word: וַיִּזָּרוּ
  choice: वे…बिखर गए
  rationale: 'निफ़अल रूप पहली क्रिया के परिणामस्वरूप हुई दशा को व्यक्त करता है: परमेश्वर ने उन्हें तितर-बितर किया और वे बिखर गए। हिन्दी में यह निष्प्रयोज्य भारीपन के बिना उस परिणाम को स्पष्ट करता है।'
- source_word: בָּאֲרָצוֹת
  choice: अलग-अलग देशों में
  rationale: אֲרָצוֹת बहुवचन है और निर्वासन के संदर्भ में अनेक भूभागों या देशों को दर्शाता है। ‘अलग-अलग’ वितरण के भाव को स्वाभाविक रूप से व्यक्त करता है।
- source_word: כְּדַרְכָּם
  choice: उनके चालचलन के अनुसार
  rationale: भविष्यद्वाणी के नैतिक संदर्भ में דֶּרֶךְ जीवन-व्यवहार को सूचित करता है। ‘चालचलन’ आधुनिक हिन्दी में इस अर्थ को स्पष्ट और गरिमापूर्ण ढंग से व्यक्त करता है।
- source_word: וְכַעֲלִילוֹתָם
  choice: और उनके कामों के अनुसार
  rationale: עֲלִילוֹתָם उनके नैतिक रूप से मूल्यांकित कर्मों को दर्शाता है। ‘कामों’ से अर्थ सामान्य पाठक के लिए सहज रहता है, जबकि न्याय का संदर्भ उसका नैतिक भार स्पष्ट करता है।
- source_word: שְׁפַטְתִּים
  choice: मैंने…उनका न्याय किया
  rationale: שׁפט का मूल न्यायिक अर्थ सुरक्षित रखा गया है। ‘दण्ड दिया’ कहना अर्थ को केवल दण्ड तक सीमित कर देता, जबकि मूल पाठ न्याय करने की व्यापक संकल्पना रखता है।
theological_decisions:
- issue: निर्वासन और परमेश्वर के न्याय का संबंध
  choice: पद निर्वासन को लोगों के चालचलन और कामों के प्रत्युत्तर में परमेश्वर के न्यायिक कार्य के रूप में प्रस्तुत करता है।
  alternative: अनुवाद बिखराव की अवस्था पर अधिक बल देकर परमेश्वर की कर्तृता को पृष्ठभूमि में रख सकता था।
  rationale: प्रथम पुरुष क्रियाएँ बिखेरने और न्याय करने, दोनों को स्पष्ट रूप से परमेश्वर से जोड़ती हैं। अनुवाद इस दावे को सुरक्षित रखता है, पर पद से परे कोई अतिरिक्त सिद्धान्त नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की है। ‘तितर-बितर’ और ‘बिखर गए’ मूल की निकटार्थी क्रमिक क्रियाओं को बनाए रखते हैं; ‘चालचलन’ भविष्यद्वाणी के नैतिक संदर्भ में स्वाभाविक और गरिमापूर्ण है।
