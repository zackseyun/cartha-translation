source:
  edition: WLC
  text: כֹּ֤ה אָמַר֙ אֲדֹנָ֣/י יְהוִ֔ה ע֗וֹד זֹ֛את אִדָּרֵ֥שׁ לְ/בֵֽית יִשְׂרָאֵ֖ל לַ/עֲשׂ֣וֹת לָ/הֶ֑ם אַרְבֶּ֥ה אֹתָ֛/ם כַּ/צֹּ֖אן אָדָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/036/037.yaml
  text: 'Thus says the Lord GOD: Yet in this also I will let the house of Israel ask me to act for them: I will multiply them like a flock of men[a][b].'
translation:
  language: hi
  text: 'प्रभु यहोवा यों कहता है: “इस बात के लिए भी मैं इस्राएल के घराने को मुझसे विनती करने दूँगा कि मैं उनके लिए यह करूँ[a]: मैं उनकी संख्या मनुष्यों के झुंड के समान बढ़ाऊँगा[b]।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “इस बात के लिए भी इस्राएल का घराना मुझसे विनती करेगा कि मैं उनके लिए यह करूँ।”
    reason: इब्रानी क्रिया का रूप शाब्दिक रूप से परमेश्वर के खोजे जाने या उससे पूछे जाने को व्यक्त कर सकता है।
  - marker: b
    text: शाब्दिक रूप से, “मनुष्यों के झुंड के समान”; अर्थात झुंड जैसी बड़ी मानव-भीड़।
    reason: मूल इब्रानी के असामान्य रूपक को स्पष्ट करता है।
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  choice: प्रभु यहोवा
  rationale: 'संयुक्त ईश्वरीय उपाधि के दोनों तत्वों को स्पष्ट रखता है: אֲדֹנָי को ‘प्रभु’ और वाचा के नाम יְהוָה को ‘यहोवा’ के रूप में।'
- source_word: עוֹד זֹאת
  choice: इस बात के लिए भी
  rationale: עוֹד के अतिरिक्तता/निरंतरता के भाव और זֹאת द्वारा पहले कही गई बात की ओर संकेत—दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: אִדָּרֵשׁ
  choice: मैं ... को मुझसे विनती करने दूँगा
  rationale: דרש के निफ़अल रूप में अपने को खोजे या पुकारे जाने देने का भाव है। यह प्रयोग इस्राएल की विनती और परमेश्वर की स्वीकृति, दोनों को बनाए रखता है।
- source_word: לְבֵית יִשְׂרָאֵל
  choice: इस्राएल के घराने को
  rationale: इब्रानी की सामूहिक और वाचागत अभिव्यक्ति ‘इस्राएल का घराना’ को बनाए रखता है।
- source_word: לַעֲשׂוֹת לָהֶם
  choice: कि मैं उनके लिए यह करूँ
  rationale: עשה के व्यापक ‘करना’ अर्थ को रखता है और निकट प्रसंग में संकेतित बहाली के कार्य की ओर स्वाभाविक रूप से संकेत करता है।
- source_word: אַרְבֶּה אֹתָם
  choice: मैं उनकी संख्या ... बढ़ाऊँगा
  rationale: רבה के हिफ़ईल रूप का अर्थ उन्हें बहुत करना या संख्या में बढ़ाना है; हिन्दी में ‘उनकी संख्या बढ़ाऊँगा’ सहज और सटीक है।
- source_word: כַּצֹּאן אָדָם
  choice: मनुष्यों के झुंड के समान
  rationale: असामान्य इब्रानी रूपक में ‘झुंड’ और सामूहिक अर्थ वाले ‘मनुष्य’ दोनों को बनाए रखता है, बिना उसे केवल ‘भीड़’ बनाकर समतल किए।
theological_decisions:
- issue: संयुक्त उपाधि אֲדֹנָי יְהוִה में ईश्वरीय नाम का अनुवाद
  choice: प्रभु यहोवा
  alternative: प्रभु परमेश्वर
  rationale: ‘यहोवा’ मूल पाठ में आए वाचा के विशिष्ट नाम को सामान्य पद ‘परमेश्वर’ में विलीन नहीं करता।
- issue: אִדָּרֵשׁ में प्रतिज्ञा, परमेश्वर की पहल और इस्राएल की प्रार्थना का संबंध
  choice: मैं ... को मुझसे विनती करने दूँगा
  alternative: इस्राएल का घराना मुझसे विनती करेगा
  rationale: चुना हुआ पाठ इस तनाव को बनाए रखता है कि बहाली परमेश्वर का प्रतिज्ञात कार्य है, फिर भी उसके लोग उसके लिए उससे विनती करेंगे और वह अपने को उनकी विनती के लिए उपलब्ध करेगा।
- issue: כַּצֹּאן אָדָם के असामान्य रूपक का निर्वाह
  choice: मनुष्यों के झुंड के समान
  alternative: लोगों की बड़ी भीड़ के समान
  rationale: मूल रूपक की विचित्रता और सामूहिक मानव अर्थ दोनों सुरक्षित रहते हैं; व्याख्यात्मक अर्थ पादटिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सामान्य-पाठक के लिए सुबोध रूप अपनाया गया है। ‘यों कहता है’, ‘इस्राएल का घराना’ और ‘प्रभु यहोवा’ बाइबिलीय औपचारिकता बनाए रखते हैं, जबकि वाक्य-विन्यास समकालीन और सहज है।
