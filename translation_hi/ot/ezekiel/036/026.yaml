id: EZK.36.26
reference: Ezekiel 36:26
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/נָתַתִּ֤י לָ/כֶם֙ לֵ֣ב חָדָ֔שׁ וְ/ר֥וּחַ חֲדָשָׁ֖ה אֶתֵּ֣ן בְּ/קִרְבְּ/כֶ֑ם וַ/הֲסִ֨רֹתִ֜י אֶת לֵ֤ב הָ/אֶ֨בֶן֙ מִ/בְּשַׂרְ/כֶ֔ם וְ/נָתַתִּ֥י לָ/כֶ֖ם לֵ֥ב בָּשָֽׂר־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/036/026.yaml
  text: And I will give you a new heart[a], and I will put a new spirit within you; and I will remove the heart of stone from your flesh and give you a heart of flesh.
translation:
  language: hi
  text: मैं तुम्हें एक नया हृदय दूँगा और तुम्हारे भीतर एक नई आत्मा[a] रखूँगा। मैं तुम्हारी देह में से पत्थर का हृदय निकाल दूँगा और तुम्हें मांस का हृदय दूँगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ “नई आत्मा” से मनुष्य की नई भीतरी प्रवृत्ति समझी जा सकती है; कुछ लोग इसे अगले पद में परमेश्वर की आत्मा दिए जाने की पूर्वसूचना मानते हैं।
    reason: alternative_reading
lexical_decisions:
- source_word: לֵב
  choice: हृदय
  rationale: यह इब्रानी मानव-विज्ञान में विचार, इच्छा और भीतरी प्रवृत्ति को समेटने वाला पारदर्शी और प्रतिष्ठित हिन्दी समतुल्य है।
- source_word: חָדָשׁ / חֲדָשָׁה
  choice: नया / नई
  rationale: विशेषण का सीधा अर्थ ‘नया’ है; ‘नवीकृत’ कहना पाठ में स्पष्ट निहितार्थ से अधिक व्याख्यात्मक होता।
- source_word: רוּחַ
  choice: आत्मा
  rationale: भीतरी परिवर्तन और ‘नए हृदय’ के समानांतर प्रयोग में ‘आत्मा’ उपयुक्त है; फिर भी अगले पद में ‘मेरी आत्मा’ से इसका संबंध या भेद अनुवाद में निर्णायक रूप से तय नहीं किया गया।
- source_word: בְּקִרְבְּכֶם
  choice: तुम्हारे भीतर
  rationale: हृदय और आत्मा के भीतरी परिवर्तन के संदर्भ में यह स्वाभाविक है तथा केवल सामुदायिक ‘तुम्हारे बीच’ की स्थानिक धारणा से बचाता है।
- source_word: וַהֲסִרֹתִי
  choice: निकाल दूँगा
  rationale: देह में से पत्थर का हृदय हटाकर दूसरा हृदय देने की ठोस प्रतिस्थापन-छवि को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: לֵב הָאֶבֶן
  choice: पत्थर का हृदय
  rationale: इब्रानी संबंध-वाक्यांश को सीधे रखता और ‘मांस का हृदय’ के साथ उसका विरोध सुरक्षित रखता है।
- source_word: מִבְּשַׂרְכֶם
  choice: तुम्हारी देह में से
  rationale: בָּשָׂר की शारीरिक छवि को बनाए रखते हुए आधुनिक हिन्दी में स्वाभाविक स्थान-संबंध व्यक्त करता है।
- source_word: לֵב בָּשָׂר
  choice: मांस का हृदय
  rationale: पत्थर के विपरीत जीवित और संवेदनशील हृदय की मूल ठोस उपमा को बिना ‘कोमल हृदय’ जैसी व्याख्यात्मक स्पष्टता जोड़े सुरक्षित रखता है।
- source_word: וְנָתַתִּי ... אֶתֵּן ... וְנָתַתִּי
  choice: दूँगा ... रखूँगा ... दूँगा
  rationale: पहले और अंतिम נתן को ‘देना’ तथा भीतर रखे जाने वाले मध्य प्रयोग को प्रसंगानुकूल ‘रखना’ अनूदित करना पुनरावृत्ति और स्वाभाविक हिन्दी के बीच संतुलन रखता है।
theological_decisions:
- issue: ‘नई आत्मा’ का अभिप्राय
  choice: मुख्य पाठ में ‘नई आत्मा’ को अस्पष्ट रखा गया है; इसका स्वाभाविक प्राथमिक संकेत परमेश्वर द्वारा बदली गई मानवीय भीतरी प्रवृत्ति की ओर है।
  alternative: इसे पवित्र आत्मा के वरदान का सीधा उल्लेख समझना।
  rationale: ‘नया हृदय’ के साथ समानांतरता मानवीय भीतरी नवीकरण की ओर संकेत करती है, जबकि अगले पद में ‘मेरी आत्मा’ अलग और अधिक स्पष्ट रूप में आती है। फिर भी दोनों के धर्मवैज्ञानिक संबंध को नकारा नहीं गया है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सुबोध हिन्दी। ‘हृदय’, ‘आत्मा’, ‘देह’ और ‘मांस’ जैसे पारंपरिक किंतु आज भी समझ में आने वाले शब्द मूल की ठोस उपमा और धर्मवैज्ञानिक तनाव को सुरक्षित रखते हैं।
