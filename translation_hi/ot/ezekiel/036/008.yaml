source:
  edition: WLC
  text: וְ/אַתֶּ֞ם הָרֵ֤י יִשְׂרָאֵל֙ עַנְפְּ/כֶ֣ם תִּתֵּ֔נוּ וּ/פֶרְיְ/כֶ֥ם תִּשְׂא֖וּ לְ/עַמִּ֣/י יִשְׂרָאֵ֑ל כִּ֥י קֵרְב֖וּ לָ/בֽוֹא׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/036/008.yaml
  text: But you[a], mountains of Israel, shall put forth your branches and bear your fruit for my people Israel, for they are about to come.
translation:
  language: hi
  text: परन्तु हे इस्राएल के पहाड़ों, तुम अपनी शाखाएँ निकालोगे और मेरी प्रजा इस्राएल के लिए अपना फल उत्पन्न करोगे, क्योंकि वे शीघ्र आने वाले हैं।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “क्योंकि उनका आना निकट है।”
    reason: lexical_alternative
lexical_decisions:
- source_word: הָרֵי יִשְׂרָאֵל
  choice: इस्राएल के पहाड़ो
  rationale: सम्बोधन और सामासिक सम्बन्ध दोनों को स्पष्ट रखता है। यह यहेजकेल में भूमि के मानवीकृत स्थलाकृतिक सम्बोधन को सुरक्षित रखता है।
- source_word: עַנְפְּכֶם תִּתֵּנוּ
  choice: तुम अपनी डालियाँ निकालोगे
  rationale: क्रिया का मूल अर्थ ‘देना’ है, पर डालियों के साथ हिन्दी में ‘डालियाँ निकालना’ स्वाभाविक है और नई वनस्पति उगने का चित्र बनाए रखता है।
- source_word: וּפֶרְיְכֶם תִּשְׂאוּ
  choice: फल उपजाओगे
  rationale: शाब्दिक रूप से क्रिया ‘उठाना/ढोना’ है, पर फल के साथ इसका अर्थ फल धारण या उत्पन्न करना है। ‘फल उपजाओगे’ पहाड़ों/भूमि के सम्बोधन में सहज हिन्दी है।
- source_word: לְעַמִּי יִשְׂרָאֵל
  choice: मेरी प्रजा इस्राएल के लिए
  rationale: לְ के हितार्थ भाव और ‘मेरी प्रजा’ के वाचाई सम्बन्ध को स्पष्ट रूप से सुरक्षित रखता है।
- source_word: קֵרְבוּ לָבוֹא
  choice: वे आने ही वाले हैं
  rationale: ‘निकट होना’ और ‘आना’ की इब्रानी रचना को स्वाभाविक आधुनिक हिन्दी में आसन्न आगमन के रूप में व्यक्त करता है।
theological_decisions:
- issue: קֵרְבוּ לָבוֹא में बहुवचन कर्ता का सन्दर्भ
  choice: ‘वे’ का सन्दर्भ निकटतम पद ‘मेरी प्रजा इस्राएल’ से है।
  alternative: इसे निर्वैयक्तिक ढंग से ‘उनके आने का समय निकट है’ समझा जा सकता है।
  rationale: व्याकरण और प्रसंग में निर्वासित इस्राएलियों का शीघ्र लौटना सबसे स्वाभाविक सन्दर्भ है; फिर भी वैकल्पिक अभिव्यक्ति को पादटिप्पणी में रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘हे ... पहाड़ो’ से प्रत्यक्ष सम्बोधन स्पष्ट होता है और भूमि का मानवीकरण बना रहता है।
