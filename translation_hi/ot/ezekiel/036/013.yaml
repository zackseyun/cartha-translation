source:
  edition: WLC
  text: כֹּ֤ה אָמַר֙ אֲדֹנָ֣/י יְהוִ֔ה יַ֚עַן אֹמְרִ֣ים לָ/כֶ֔ם אֹכֶ֥לֶת אָדָ֖ם אתי וּ/מְשַׁכֶּ֥לֶת גוי/ך הָיִֽית׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/036/013.yaml
  text: 'Thus says the Lord GOD: Because they say of you[b][a], ‘You devour people and have bereaved your nation,’'
translation:
  language: hi
  text: 'प्रभु यहोवा यों कहता है: क्योंकि लोग तुम्हारे विषय में कहते हैं, ‘तू मनुष्यों को निगल जाती है[a] और तेरे राष्ट्र को संतानहीन कर चुकी है[b],’'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से ‘मनुष्य को निगलने वाली’; यहाँ ‘मनुष्य’ का सामूहिक अर्थ है—मनुष्य या लोग।
    reason: lexical_alternative
  - marker: b
    text: या ‘तेरे लोगों को उनकी संतान से वंचित कर चुकी है।’
    reason: alternative_reading
lexical_decisions:
- source_word: כֹּה אָמַר
  choice: यों कहता है
  rationale: यह नबूवत के प्रचलित परिचय का स्वाभाविक और गरिमापूर्ण हिन्दी रूप है।
- source_word: אֲדֹנָי יְהוִה
  choice: प्रभु यहोवा
  rationale: दोनों पदों को अलग-अलग बनाए रखता है और वाचा के नाम יהוה को ‘यहोवा’ के रूप में स्पष्ट करता है।
- source_word: יַעַן
  choice: क्योंकि
  rationale: आगे आने वाले कारण-वाक्य को सीधे और स्वाभाविक ढंग से प्रस्तुत करता है।
- source_word: אֹמְרִים לָכֶם
  choice: लोग तुम्हारे विषय में कहते हैं
  rationale: לָכֶם का अर्थ यहाँ संबोधित देश के बारे में कही जाने वाली बात है; ‘तुम्हारे विषय में’ हिन्दी में यह संबंध स्पष्ट करता है।
- source_word: אֹכֶלֶת אָדָם
  choice: तू मनुष्यों को निगल जाती है
  rationale: אכל की हिंसक रूपक-छवि को ‘निगल जाती है’ सुरक्षित रखता है; אָדָם यहाँ सामूहिक अर्थ में मानव-समुदाय को सूचित करता है।
- source_word: וּמְשַׁכֶּלֶת
  choice: संतानहीन करती रही है
  rationale: पिएल रूप का अर्थ किसी को उसकी संतान से वंचित करना या संतानहीन बनाना है; हिन्दी में यह ‘शोकित करना’ से अधिक सटीक है।
- source_word: גוי/ך
  choice: अपने राष्ट्र को
  rationale: एकवचन גוי और स्त्रीलिंग संबोधित देश के संबंध को बनाए रखता है; ‘अपने’ हिन्दी में स्वाभाविक आत्मवाचक संबंध दिखाता है।
- source_word: הָיִית
  choice: करती रही है
  rationale: पूर्ण क्रिया को ऐसी चली आती स्थिति या प्रतिष्ठा के रूप में व्यक्त करता है, जो प्रसंग में देश पर लगाए गए आरोप के अनुकूल है।
theological_decisions:
- issue: अֲדֹנָי יְהוִה में परमेश्वर के नाम का अनुवाद
  choice: प्रभु यहोवा
  alternative: प्रभु परमेश्वर
  rationale: मूल में सामान्य उपाधि और विशिष्ट वाचा-नाम दोनों हैं; ‘प्रभु यहोवा’ इस भेद को मिटाए बिना हिन्दी में प्रस्तुत करता है।
- issue: देश को मनुष्यों का भक्षक कहने वाली रूपकात्मक भाषा
  choice: तू मनुष्यों को निगल जाती है
  alternative: तू मनुष्यों का भक्षण करने वाली है
  rationale: रूपक को वास्तविक आरोप के रूप में बनाए रखता है, पर उसकी व्याख्या करके अकाल, युद्ध या किसी एक कारण तक सीमित नहीं करता।
- issue: שׁכל के कारणात्मक अर्थ की व्याप्ति
  choice: अपने राष्ट्र को संतानहीन करती रही है
  alternative: अपने राष्ट्र को शोक-संतप्त करती रही है
  rationale: मूल का संतान-वियोग संबंधी अर्थ सुरक्षित रहता है और इसे केवल गर्भपात अथवा केवल मृत्यु के किसी एक प्रकार तक सीमित नहीं किया जाता।
translation_notes:
  register: आधुनिक मानक हिन्दी में भविष्यद्वक्ताई गरिमा बनाए रखने के लिए ‘यों कहता है’ और दिव्य उपाधि ‘प्रभु यहोवा’ प्रयुक्त हैं। उद्धरण में ‘तू’ और स्त्रीलिंग क्रियाएँ मूल के स्त्रीलिंग एकवचन संबोधन—देश—को सुरक्षित रखती हैं; ‘तुम्हारे विषय में’ बाहरी वक्ताओं के बहुवचन संबोधन के अनुरूप है।
