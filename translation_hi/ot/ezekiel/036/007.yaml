id: EZK.36.7
reference: Ezekiel 36:7
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: לָ/כֵ֗ן כֹּ֤ה אָמַר֙ אֲדֹנָ֣/י יְהוִ֔ה אֲנִ֖י נָשָׂ֣אתִי אֶת יָדִ֑/י אִם לֹ֤א הַ/גּוֹיִם֙ אֲשֶׁ֣ר לָ/כֶ֣ם מִ/סָּבִ֔יב הֵ֖מָּה כְּלִמָּתָ֥/ם יִשָּֽׂאוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/036/007.yaml
  text: 'Therefore thus says the Lord GOD: I have lifted up my hand in oath that surely the nations that are around you will bear their disgrace[a].'
translation:
  language: hi
  text: 'इसलिए प्रभु याहवे ऐसा कहते हैं: मैंने अपना हाथ उठाकर शपथ खाई है कि तुम्हारे चारों ओर की जातियाँ निश्चय ही अपना अपमान सहेंगी।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  choice: प्रभु याहवे
  rationale: संयुक्त उपाधि में אֲדֹנָי को ‘प्रभु’ और परमेश्वर के व्यक्तिगत नाम יהוה को ‘याहवे’ के रूप में रखा गया है, जिससे दोनों तत्व स्पष्ट बने रहते हैं।
- source_word: נָשָׂאתִי אֶת יָדִי
  choice: मैंने अपना हाथ उठाकर शपथ खाई है
  rationale: मूल चित्र ‘मैंने अपना हाथ उठाया’ सुरक्षित रखते हुए शपथ-संबंधी मुहावरे का अर्थ आधुनिक हिन्दी पाठक के लिए स्पष्ट किया गया है।
- source_word: אִם לֹא
  choice: निश्चय ही
  rationale: शपथ-सूत्र के बाद यह साधारण शर्त नहीं, बल्कि दृढ़ प्रतिज्ञा का बल व्यक्त करता है; ‘निश्चय ही’ उसी बल को स्वाभाविक हिन्दी में प्रकट करता है।
- source_word: הַגּוֹיִם אֲשֶׁר לָכֶם מִסָּבִיב
  choice: तुम्हारे चारों ओर की जातियाँ
  rationale: यह पद इस्राएल के आसपास रहने वाली विदेशी जातियों को सूचित करता है; ‘जातियाँ’ और ‘चारों ओर’ भौगोलिक तथा सामूहिक अर्थ को सहज रूप से व्यक्त करते हैं।
- source_word: כְּלִמָּתָם יִשָּׂאוּ
  choice: अपना अपमान सहेंगी
  rationale: נשׂא का मूल अर्थ ‘उठाना/ढोना’ है, पर अपमान के साथ हिन्दी में ‘अपमान सहना’ अधिक स्वाभाविक है और दण्डस्वरूप अपमान भोगने का भाव बनाए रखता है।
theological_decisions:
- issue: संयुक्त ईश्वरीय उपाधि אֲדֹנָי יְהוִה का अनुवाद
  choice: प्रभु याहवे
  alternative: प्रभु परमेश्वर
  rationale: ‘याहवे’ वाचा-संबंधी व्यक्तिगत नाम को सीधे दर्शाता है, जबकि ‘प्रभु’ אֲדֹנָי को व्यक्त करता है; इससे मूल के दोनों अलग तत्व एक ही सामान्य पदवी में विलीन नहीं होते।
- issue: जातियों द्वारा ‘अपना अपमान’ सहने का आशय
  choice: कारण या स्वरूप को अतिरिक्त रूप से स्पष्ट किए बिना मूल कथन बनाए रखना
  alternative: अपने किए का अपमान/दण्ड सहेंगी
  rationale: पद स्वयं अपमान का विस्तृत कारण नहीं बताता। कोई कर्मफल-संबंधी व्याख्या जोड़ना मूल की संक्षिप्तता और संभावित व्यापकता को सीमित कर देता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण भविष्यवाणी-संबंधी शैली रखी गई है। वाक्य सहज है, पर शपथ का दृश्यात्मक मुहावरा और कथन का न्यायिक बल दोनों सुरक्षित हैं।
