id: EZK.36.32
reference: Ezekiel 36:32
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: לֹ֧א לְמַעַנְ/כֶ֣ם אֲנִֽי עֹשֶׂ֗ה נְאֻם֙ אֲדֹנָ֣/י יְהוִ֔ה יִוָּדַ֖ע לָ/כֶ֑ם בּ֧וֹשׁוּ וְ/הִכָּלְמ֛וּ מִ/דַּרְכֵי/כֶ֖ם בֵּ֥ית יִשְׂרָאֵֽל־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/036/032.yaml
  text: It is not for your sake that I am acting[a], declares the Lord GOD; let it be known to you. Be ashamed and humiliated because of your ways, O house of Israel.
translation:
  language: hi
  text: “मैं यह तुम्हारे लिए नहीं कर रहा हूँ,” प्रभु यहोवा की घोषणा है; “यह बात तुम्हें मालूम हो। हे इस्राएल के घराने, अपने चालचलन के कारण लज्जित हो और अपमानित हो।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְמַעַנְכֶם
  choice: तुम्हारे लिए
  rationale: यह पदबंध उद्देश्य या हित का भाव व्यक्त करता है। ‘तुम्हारे लिए’ स्वाभाविक हिन्दी में इस बात को खुला रखता है कि परमेश्वर का कार्य इस्राएल के हित अथवा योग्यता से प्रेरित नहीं है।
- source_word: עֹשֶׂה
  choice: कर रहा हूँ
  rationale: עשה का अर्थ व्यापक रूप से ‘करना’ है; वर्तमान कृदन्त यहाँ आसपास वर्णित परमेश्वर की कार्रवाई को दर्शाता है।
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: प्रभु यहोवा की घोषणा है
  rationale: נְאֻם भविष्यद्वाणी की प्रामाणिक घोषणा का सूत्र है। אֲדֹנָי को ‘प्रभु’ और परमेश्वर के व्यक्तिगत नाम יהוה को ‘यहोवा’ कहने से दोनों स्रोत-शब्दों का भेद बना रहता है।
- source_word: יִוָּדַע לָכֶם
  choice: यह बात तुम्हें मालूम हो
  rationale: ידע का निफ़अल रूप यहाँ निष्क्रिय तथा आदेशात्मक भाव रखता है। यह अनुवाद उसी भाव को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: בֹּשׁוּ וְהִכָּלְמוּ
  choice: लज्जित हो और अपमानित हो
  rationale: 'दोनों बहुवचन आज्ञार्थक क्रियाओं को अलग रखा गया है: בוש आंतरिक लज्जा और כלם अपमान/बेइज्जती का भाव देता है।'
- source_word: מִדַּרְכֵיכֶם
  choice: अपने चालचलन के कारण
  rationale: शर्म व्यक्त करने वाली क्रियाओं के साथ מן कारण बताता है। דֶּרֶךְ यहाँ वास्तविक मार्ग नहीं, बल्कि आचरण को दर्शाता है; ‘चालचलन’ हिन्दी में यह नैतिक अर्थ स्पष्ट करता है।
- source_word: בֵּית יִשְׂרָאֵל
  choice: हे इस्राएल के घराने
  rationale: संबोधन को ‘हे’ से स्पष्ट किया गया है और सामूहिक पहचान के रूप में ‘घराने’ को बनाए रखा गया है।
theological_decisions:
- issue: אֲדֹנָי יְהוִה में परमेश्वर के नाम का अनुवाद
  choice: प्रभु यहोवा
  alternative: प्रभु परमेश्वर
  rationale: मूल पाठ में उपाधि אֲדֹנָי और व्यक्तिगत नाम יהוה दोनों हैं। ‘प्रभु यहोवा’ इनके भेद को सुरक्षित रखता है और हिन्दी बाइबलीय भाषा में पहचाना जाने वाला रूप है।
- issue: परमेश्वर के कार्य का आधार
  choice: ‘तुम्हारे लिए नहीं’ को बिना व्याख्यात्मक विस्तार के रखा गया
  alternative: ‘तुम्हारी योग्यता के कारण नहीं’
  rationale: संदर्भ योग्यता के अभाव की ओर संकेत कर सकता है, पर לְמַעַן स्वयं केवल हित/उद्देश्य व्यक्त करता है। इसलिए किसी विशिष्ट धर्मवैज्ञानिक कारण को पाठ में नहीं जोड़ा गया।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। प्रत्यक्ष वचन के उद्धरण-चिह्न जोड़े गए हैं ताकि घोषणा का प्रवाह स्पष्ट हो; ‘हे इस्राएल के घराने’ भविष्यद्वाणी के गंभीर संबोधन को बनाए रखता है।
