  yaml_path: translation/ot/ezekiel/036/014.yaml
  text: Therefore you will no longer devour people[a], and you will no longer cause your nation to stumble, declares the Lord GOD.
translation:
  language: hi
  text: इसलिए अब तू लोगों को नहीं निगलेगी, और अपने राष्ट्र के ठोकर खाने का कारण फिर नहीं बनेगी[a]—प्रभु यहोवा की यह घोषणा है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'वैकल्पिक स्वरीकरण या पाठ-परंपरा के अनुसार: “और अपने राष्ट्र को उसकी संतानों से फिर वंचित नहीं करेगी।”'
    reason: alternative_reading
lexical_decisions:
- source_word: לָכֵן
  choice: इसलिए
  rationale: यह पिछले कथन से निष्कर्ष और उसके परिणामस्वरूप दी गई प्रतिज्ञा को स्वाभाविक रूप से जोड़ता है।
- source_word: אָדָם
  choice: लोगों को
  rationale: यहाँ शब्द सामूहिक अर्थ में मनुष्यों के लिए है; आधुनिक हिन्दी में ‘लोगों’ से अर्थ स्पष्ट और स्वाभाविक रहता है।
- source_word: תֹאכְלִי
  choice: निगलेगी
  rationale: शाब्दिक अर्थ ‘खाएगी’ है, पर देश के मानवीकरण और निवासियों के विनाश के रूपक को ‘निगलेगी’ अधिक स्वाभाविक ढंग से व्यक्त करता है।
- source_word: עוֹד
  choice: अब ... नहीं / फिर ... नहीं
  rationale: לֹא के साथ यह आगे से किसी बात की समाप्ति बताता है; हिन्दी वाक्य के अनुसार दोनों उपवाक्यों में स्वाभाविक रूप बदला गया है।
- source_word: וְגוֹיִךְ
  choice: अपने राष्ट्र को
  rationale: संज्ञा एकवचन है और स्त्रीलिंग एकवचन प्रत्यय संबोधित देश की ओर संकेत करता है; ‘अपने राष्ट्र’ इस संबंध को स्पष्ट करता है।
- source_word: תכשלי
  choice: ठोकर नहीं खिलाएगी
  rationale: मसोरेटिक व्यंजन-पाठ כשל से प्रेरक अर्थ ‘ठोकर खिलाना/गिरने का कारण बनना’ निकलता है; वैकल्पिक परंपरा ‘संतानहीन करना’ पादटिप्पणी में रखी गई है।
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: प्रभु यहोवा की घोषणा है
  rationale: נְאֻם की भविष्यद्वाणी-सूचक औपचारिकता को ‘घोषणा है’ व्यक्त करता है, और अֲדֹנָי तथा יהוה दोनों को क्रमशः ‘प्रभु’ और ‘यहोवा’ के रूप में सुरक्षित रखा गया है।
theological_decisions:
- issue: अֲדֹנָי יְהוִה में परमेश्वर के नाम का अनुवाद
  choice: प्रभु यहोवा
  alternative: प्रभु परमेश्वर
  rationale: मूल पाठ में उपाधि אֲדֹנָי के बाद वाचा का विशिष्ट नाम יהוה है; ‘प्रभु यहोवा’ दोनों को अलग-अलग बनाए रखता है और नाम को सामान्य उपाधि में नहीं बदलता।
- issue: תכשלי की पाठगत/स्वरीकरणगत व्याख्या
  choice: अपने राष्ट्र को ठोकर नहीं खिलाएगी
  alternative: अपने राष्ट्र को संतानहीन नहीं करेगी
  rationale: WLC का मसोरेटिक स्वरित पाठ כשל, ‘ठोकर खाना’, के अनुरूप है। प्रसंग और कुछ प्राचीन परंपराओं से समर्थित वैकल्पिक अर्थ को मुख्य पाठ में मिलाए बिना पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: देश को स्त्रीलिंग एकवचन में सीधे संबोधित करने के कारण ‘तू’ और स्त्रीलिंग क्रियाएँ रखी गई हैं। भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सहज है; रूपक तथा पाठगत अस्पष्टता दोनों सुरक्षित हैं।
