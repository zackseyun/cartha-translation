  text: परन्तु मुझे अपने पवित्र नाम की चिन्ता हुई[a], जिसे इस्राएल के घराने ने उन राष्ट्रों के बीच अपवित्र किया था जहाँ वे गए थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “मैंने अपने पवित्र नाम को बचाए रखा” अथवा “मुझे अपने पवित्र नाम पर तरस आया।” इब्रानी क्रिया बचाए रखने, दया करने या तरस खाने का भाव दे सकती है; यहाँ आशय प्रभु के पवित्र नाम की प्रतिष्ठा के प्रति उसके सरोकार से है।
