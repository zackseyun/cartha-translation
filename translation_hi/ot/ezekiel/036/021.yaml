  choice: परमेश्वर को अपने पवित्र नाम की पवित्रता और प्रतिष्ठा की चिन्ता हुई
  alternative: परमेश्वर ने अपने पवित्र नाम पर तरस खाया / अपने पवित्र नाम को बचाए रखा
  rationale: वाक्य में חמל का सीधा विषय-वस्तु ‘मेरा पवित्र नाम’ है और 36:20–23 में प्रमुख बल जातियों के बीच उस नाम को पवित्र सिद्ध करने पर है। ‘चिन्ता हुई’ नाम के प्रति परमेश्वर के प्रबल सरोकार को व्यक्त करता है, बिना यह कहे कि नाम स्वयं दया का पात्र था।
