  choice: अपने पवित्र नाम
  rationale: यह निकट और प्रचलित अनुवाद है, जो परमेश्वर की प्रकट पहचान तथा प्रतिष्ठा का संकेत बनाए रखता है।
- source_word: אֲשֶׁר חִלְּלוּהוּ
  choice: जिसे ... अपवित्र किया था
  rationale: पिएल रूप חלל पवित्र वस्तु को साधारण ठहराने या उसकी पवित्रता का अनादर करने को दर्शाता है; ‘अपवित्र किया’ यहेजकेल की पवित्रता-संबंधी शब्दावली को बनाए रखता है।
