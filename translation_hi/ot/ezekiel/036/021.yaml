  choice: इस्राएल के घराने
  rationale: भविष्यवाणी-साहित्य में प्रयुक्त सामूहिक पदवी को स्पष्ट और गरिमापूर्ण हिन्दी में सुरक्षित रखा गया है।
- source_word: בַּגּוֹיִם
  choice: जातियों के बीच
  rationale: यह उन विदेशी लोगों और देशों की ओर संकेत करता है जिनके बीच इस्राएली पहुँचे थे; ‘जातियों के बीच’ प्रसंगानुकूल और स्वाभाविक है।
- source_word: אֲשֶׁר בָּאוּ שָׁמָּה
  choice: जहाँ वे गए थे
  rationale: शाब्दिक भाव ‘जहाँ वे आए थे’ है, पर अपने देश से निर्वासन की दिशा को देखते हुए हिन्दी में ‘जहाँ वे गए थे’ अधिक स्वाभाविक है।
theological_decisions:
