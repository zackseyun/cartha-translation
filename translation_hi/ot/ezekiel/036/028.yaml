  yaml_path: translation/ot/ezekiel/036/028.yaml
  text: You will dwell in the land that I gave to your fathers[a], and you will be my people, and I will be your God.
translation:
  language: hi
  text: तुम उस भूमि में बसोगे जो मैंने तुम्हारे पूर्वजों[a] को दी थी। तुम मेरी प्रजा होगे, और मैं तुम्हारा परमेश्वर होऊँगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, ‘पिताओं’; यह अभिव्यक्ति पूर्वजों से की गई वाचा की प्रतिज्ञाओं की प्रतिध्वनि है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וִישַׁבְתֶּם
  choice: तुम ... बसोगे
  rationale: ישׁב यहाँ भविष्यसूचक कथन में स्थिर निवास का भाव देता है। ‘बसोगे’ आधुनिक हिन्दी में स्वाभाविक है और केवल अस्थायी रहने की अपेक्षा भूमि में निवास का भाव बेहतर व्यक्त करता है।
- source_word: בָּאָרֶץ
  choice: उस देश में
  rationale: אֶרֶץ यहाँ वाचा से जुड़ी भौगोलिक भूमि को सूचित करता है। हिन्दी में ‘देश’ इस संदर्भ में स्वाभाविक है और प्रतिज्ञात भूभाग का भाव बनाए रखता है।
- source_word: אֲשֶׁר נָתַתִּי
  choice: जिसे मैंने ... दिया था
  rationale: पूर्ण क्रिया पूर्वजों को पहले दिए जा चुके देश की ओर संकेत करती है; ‘दिया था’ हिन्दी में उस पूर्वकालिक संबंध को स्पष्ट और सहज रूप से व्यक्त करता है।
- source_word: לַאֲבֹתֵיכֶם
  choice: तुम्हारे पूर्वजों[a] को
  rationale: אָבוֹת का शाब्दिक अर्थ ‘पिताओं’ है, पर इस वाचागत संदर्भ में आशय पिछली पीढ़ियों अथवा पुरखों से है। ‘पूर्वजों’ आधुनिक हिन्दी में स्वाभाविक और अर्थतः सटीक है; शाब्दिक रूप पादटिप्पणी में सुरक्षित है।
- source_word: וִהְיִיתֶם לִי לְעָם
  choice: तुम मेरी प्रजा होगे
  rationale: यह पारंपरिक वाचा-सूत्र है। ‘मेरी प्रजा’ हिन्दी में स्वाभाविक ढंग से संबंध और सामूहिक पहचान दोनों व्यक्त करता है।
- source_word: וְאָנֹכִי אֶהְיֶה לָכֶם לֵאלֹהִים
  choice: और मैं तुम्हारा परमेश्वर होऊँगा
  rationale: यह वाचा-सूत्र का दूसरा भाग है। हिन्दी का संबंधवाचक रूप ‘तुम्हारा परमेश्वर’ मूल के ‘तुम्हारे लिए परमेश्वर’ का स्वाभाविक समतुल्य है; אָנֹכִי का स्पष्ट कर्ता ‘मैं’ गंभीर बल को पर्याप्त रूप से बनाए रखता है।
theological_decisions:
- issue: वाचा-सूत्र का अनुवाद
  choice: ‘तुम मेरी प्रजा होगे, और मैं तुम्हारा परमेश्वर होऊँगा’
  alternative: ‘तुम मेरे लिए एक प्रजा होगे, और मैं तुम्हारे लिए परमेश्वर होऊँगा’
  rationale: मुहावरेदार हिन्दी मूल के पारस्परिक वाचागत संबंध और बाइबिलीय सूत्र की पहचान को बनाए रखती है, जबकि अधिक शाब्दिक विकल्प अस्वाभाविक लगता है।
- issue: पूर्वजों के लिए पुल्लिंग इब्रानी शब्द
  choice: मुख्य पाठ में ‘पूर्वजों’, पादटिप्पणी में शाब्दिक ‘पिताओं’
  alternative: मुख्य पाठ में ‘पिताओं’ या ‘पुरखों’
  rationale: मूल शब्द व्याकरणतः पुल्लिंग और शाब्दिक रूप से ‘पिताओं’ है, किंतु यहाँ पैतृक पीढ़ियों का वाचागत संदर्भ है। ‘पूर्वजों’ अर्थ को स्पष्ट करता है और पादटिप्पणी मूल रूप तथा उसकी प्रतिज्ञात्मक प्रतिध्वनि सुरक्षित रखती है।
