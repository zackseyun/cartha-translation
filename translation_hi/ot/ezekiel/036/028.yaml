  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और वाचागत शैली। ‘बसोगे’, ‘प्रजा’ और ‘परमेश्वर’ सामान्य पाठक के लिए बोधगम्य रहते हुए बाइबिलीय गंभीरता बनाए रखते हैं।
