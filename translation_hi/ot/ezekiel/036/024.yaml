  yaml_path: translation/ot/ezekiel/036/024.yaml
  text: For I will take you from the nations[a], and gather you from all the lands[c][b], and bring you into your own land.
translation:
  language: hi
  text: क्योंकि मैं तुम्हें राष्ट्रों[a] में से ले लूँगा, तुम्हें सभी देशों[b] से इकट्ठा करूँगा, और तुम्हारी अपनी भूमि में[c] ले आऊँगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “राष्ट्रों के बीच में से।”
    reason: lexical_alternative
  - marker: b
    text: या “सभी भूभागों से।”
    reason: lexical_alternative
  - marker: c
    text: शाब्दिक रूप से “तुम्हारी भूमि में”; इब्रानी पूर्वसर्ग गंतव्य का भाव देता है। “अपनी” स्वामित्व के बल को स्पष्ट करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָקַחְתִּי
  choice: मैं ... ले लूँगा
  rationale: यह क्रिया परमेश्वर द्वारा लोगों को राष्ट्रों के बीच से निकाल लेने की सोद्देश्य और प्रत्यक्ष कार्रवाई व्यक्त करती है। ‘ले लूँगा’ आधुनिक हिन्दी में स्वाभाविक रहते हुए प्रथम पुरुष के सक्रिय भाव को बनाए रखता है।
- source_word: מִן הַגּוֹיִם
  choice: राष्ट्रों में से
  rationale: גּוֹיִם यहाँ उन विदेशी राष्ट्रों को सूचित करता है जिनके बीच इस्राएली तितर-बितर हुए थे। ‘राष्ट्र’ आधुनिक और तटस्थ शब्द है; ‘में से’ इब्रानी מן के यहाँ निहित ‘बीच में से’ वाले भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וְקִבַּצְתִּי
  choice: इकट्ठा करूँगा
  rationale: קבץ तितर-बितर लोगों को फिर एकत्र करने की मानक पुनर्स्थापना-संबंधी क्रिया है। ‘इकट्ठा करूँगा’ सामान्य पाठक के लिए स्पष्ट और स्वाभाविक है।
- source_word: מִכָּל הָאֲרָצוֹת
  choice: सभी देशों से
  rationale: אֲרָצוֹת बहुवचन में उन विभिन्न भूभागों या देशों को दर्शाता है जहाँ निर्वासित लोग फैले हुए थे। इस संदर्भ में ‘देशों’ हिन्दी में ‘भूमियों’ से अधिक सहज है।
- source_word: וְהֵבֵאתִי
  choice: ले आऊँगा
  rationale: בוא का हिफ़ील रूप ‘आने का कारण बनना’ अथवा ‘ले आना’ है। ‘ले आऊँगा’ कारणवाचक और गंतव्याभिमुख भाव को स्वाभाविक रूप से रखता है; पाठ में स्पष्ट न होने के कारण ‘वापस’ नहीं जोड़ा गया।
- source_word: אֶל אַדְמַתְכֶם
  choice: तुम्हारी अपनी भूमि में
  rationale: אַדָמָה यहाँ मिट्टी मात्र नहीं, इस्राएल की मातृभूमि को सूचित करती है। ‘अपनी’ संबद्ध प्रत्यय ‘तुम्हारी’ के स्वामित्व-संबंधी बल को सहज हिन्दी में उभारता है, जबकि पादटिप्पणी अधिक शाब्दिक रूप देती है।
theological_decisions:
- issue: पुनर्स्थापना और भूमि से संबंध
  choice: तुम्हारी अपनी भूमि में
  alternative: तुम्हारी भूमि में / तुम्हारी भूमि पर
  rationale: अनुवाद निर्वासित लोगों को उनकी भूमि में पहुँचाने की परमेश्वर की कार्रवाई और इब्रानी के संबद्ध प्रत्यय—दोनों को व्यक्त करता है। यह भूमि-संबंधी कथन को बनाए रखता है, पर इसके आगे कोई बाद की धर्मवैज्ञानिक व्यवस्था पाठ पर आरोपित नहीं करता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज रखी गई है। समानांतर प्रथम-पुरुष क्रियाओं और तीन चरणों—लेना, इकट्ठा करना, ले आना—को स्पष्ट बनाए रखा गया है।
