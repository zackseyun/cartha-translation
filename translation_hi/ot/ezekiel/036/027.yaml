  yaml_path: translation/ot/ezekiel/036/027.yaml
  text: And I will put my Spirit within you[a], and I will cause you to walk in my statutes[b], and you will keep my judgments and do them.
translation:
  language: hi
  text: और मैं अपना आत्मा तुम्हारे भीतर रखूँगा, और ऐसा करूँगा कि तुम मेरी विधियों[a] के अनुसार चलोगे; तुम मेरे न्याय-विधानों[b] को मानोगे और उनका पालन करोगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘मेरी विधियों’ का अनुवाद ‘मेरे ठहराए हुए नियमों’ भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: ‘मेरे न्याय-विधानों’ का अनुवाद ‘मेरे नियमों’ या ‘मेरे अध्यादेशों’ भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: רוּחִי
  choice: अपना आत्मा
  rationale: पुनर्स्थापना और नया हृदय देने के निकटवर्ती संदर्भ में यह परमेश्वर के अपने आत्मा को सूचित करता है, न कि केवल श्वास या हवा को। हिन्दी में अनावश्यक व्याख्या जोड़े बिना यही अर्थ स्वाभाविक रूप से व्यक्त होता है।
- source_word: בְּקִרְבְּכֶם
  choice: तुम्हारे भीतर
  rationale: यह पदबंध भीतर अथवा मध्य में होने का अर्थ दे सकता है; नए हृदय और आंतरिक परिवर्तन के संदर्भ में ‘तुम्हारे भीतर’ उपयुक्त है।
- source_word: וְעָשִׂיתִי אֵת אֲשֶׁר
  choice: और ऐसा करूँगा कि
  rationale: हिब्रू की शाब्दिक रचना ‘मैं वह करूँगा कि...’ परिणामकारी अर्थ रखती है। यह हिन्दी अभिव्यक्ति परमेश्वर की प्रभावी पहल को स्पष्ट और स्वाभाविक रूप में बनाए रखती है।
- source_word: בְּחֻקַּי תֵּלֵכוּ
  choice: मेरी विधियों पर चलो
  rationale: ‘चलना’ वाचा के अनुरूप आचरण का प्रचलित बाइबलीय रूपक है। ‘पर चलना’ आधुनिक हिन्दी में समझने योग्य रहते हुए उस रूपक को सुरक्षित रखता है।
- source_word: חֻקַּי
  choice: मेरी विधियों
  rationale: חֹק/חֻקָּה निर्धारित विधि या विधान को दर्शाता है। ‘विधियाँ’ औपचारिक कानूनी भाव बनाए रखता है और अगले מִשְׁפָּטַי से कुछ भेद भी करता है।
- source_word: מִשְׁפָּטַי
  choice: मेरे न्याय-विधानों
  rationale: מִשְׁפָּט न्याय, न्यायिक निर्णय, नियम या विधान का अर्थ दे सकता है। ‘न्याय-विधान’ कानूनी और न्याय-संबंधी भाव को व्यक्त करते हुए חֻקִּים से भेद बनाए रखता है।
- source_word: תִּשְׁמְרוּ
  choice: मानोगे
  rationale: व्यवस्था के संदर्भ में שׁמר का अर्थ किसी आदेश को मानना या उसका पालन करना है। यहाँ ‘मानोगे’ अगले क्रियापद के साथ हिन्दी में स्वाभाविक है।
- source_word: וַעֲשִׂיתֶם
  choice: और उनका पालन करोगे
  rationale: अंतिम क्रिया आज्ञाओं को व्यवहार में पूरा करने पर बल देती है। ‘पालन करोगे’ हिब्रू के सरल और क्रियात्मक भाव को स्पष्ट करता है।
theological_decisions:
- issue: परमेश्वर की सक्रियता और मनुष्य की आज्ञाकारिता
  choice: ऐसा करूँगा कि तुम मेरी विधियों पर चलो
  alternative: तुम्हें मेरी विधियों पर चलने के योग्य बनाऊँगा
  rationale: हिब्रू पाठ परमेश्वर की प्रभावी कार्रवाई को इस्राएल की भावी आज्ञाकारिता का कारण बताता है। चुनी हुई भाषा इस मजबूत दैवी सक्रियता और मनुष्य के वास्तविक आज्ञापालन—दोनों को बनाए रखती है, पर किसी बाद की सांप्रदायिक व्याख्या से तनाव का समाधान नहीं करती।
- issue: רוּחִי का अभिप्राय
  choice: अपना आत्मा
  alternative: अपनी श्वास
  rationale: आसपास के पदों में नया हृदय और आज्ञाकारिता उत्पन्न करने की बात होने के कारण सन्दर्भ परमेश्वर के अपने आत्मा की ओर संकेत करता है; ‘श्वास’ यहाँ अपेक्षाकृत कम उपयुक्त है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। ‘चलना’ जैसे बाइबलीय वाचा-रूपक को सुरक्षित रखा गया है, जबकि परिणामकारी हिब्रू रचना को स्वाभाविक हिन्दी ‘ऐसा करूँगा कि’ से व्यक्त किया गया है। परामर्श-पाठ में फुटनोट चिह्न अर्थ से असंगत स्थानों पर थे; हिन्दी मुख्य पाठ में [a] को חֻקַּי और [b] को מִשְׁפָּטַי के ठीक बाद रखा गया है।
