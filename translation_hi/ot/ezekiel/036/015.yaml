source:
  edition: WLC
  text: וְ/לֹא אַשְׁמִ֨יעַ אֵלַ֤יִ/ךְ עוֹד֙ כְּלִמַּ֣ת הַ/גּוֹיִ֔ם וְ/חֶרְפַּ֥ת עַמִּ֖ים לֹ֣א תִשְׂאִי ע֑וֹד ו/גוי/ך לֹא תַכְשִׁ֣לִי ע֔וֹד נְאֻ֖ם אֲדֹנָ֥/י יְהוִֽה־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/036/015.yaml
  text: And I will no longer let you hear the disgrace of the nations[a], and you will no longer bear the reproach of the peoples, and you will no longer cause your nation to stumble, declares the Lord GOD.
translation:
  language: hi
  text: और मैं तुम्हें राष्ट्रों की ओर से अपमान फिर कभी सुनने नहीं दूँगा। तुम्हें लोगों की ओर से निन्दा फिर कभी नहीं सहनी पड़ेगी, और तुम अपने राष्ट्र को फिर कभी ठोकर नहीं खिलाओगी[a]—प्रभु याहवे की यह घोषणा है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इस कठिन इब्रानी वाक्यांश का अनुवाद ‘अपने राष्ट्र को गिरने का कारण नहीं बनोगी’ भी हो सकता है। एक अन्य व्याख्यात्मक परंपरा के अनुसार अर्थ है, ‘अपने राष्ट्र को संतान से वंचित नहीं करोगी।’ इब्रानी मसोरीटी स्वरांकन ‘ठोकर खिलाओगी’ का समर्थन करता है।
    reason: वैकल्पिक व्याख्यात्मक परंपरा और कठिन इब्रानी रूप
lexical_decisions:
- source_word: אַשְׁמִיעַ אֵלַיִךְ
  choice: मैं तुम्हें ... नहीं सुनने दूँगा
  rationale: שׁמע के हिफ़ील रूप का कारणवाचक अर्थ है। इस प्रसंग में यह स्वाभाविक हिन्दी बताती है कि परमेश्वर देश को विदेशी अपमान फिर सुनने या उसका सामना करने नहीं देगा।
- source_word: כְּלִמַּת הַגּוֹיִם
  choice: राष्ट्रों का अपमान
  rationale: כְּלִמָּה सार्वजनिक लज्जा और अपमान को व्यक्त करता है; הַגּוֹיִם आसपास के राष्ट्रों को सूचित करता है।
- source_word: חֶרְפַּת עַמִּים
  choice: जाति-जाति के लोगों की निन्दा
  rationale: חֶרְפָּה तिरस्कार, निन्दा या कलंक का भाव रखता है। यह अनुवाद पहले खंड के 'अपमान' से शब्दगत भेद बनाए रखता है और עַמִּים के बहुवचन सामुदायिक अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: תִשְׂאִי
  choice: नहीं सहनी पड़ेगी
  rationale: נשׂא का शाब्दिक अर्थ 'उठाना/ढोना' है, पर निन्दा के साथ इसका मुहावरेदार अर्थ उसे सहना है।
- source_word: וְגוֹיִךְ
  choice: अपने राष्ट्र को
  rationale: पाठ में גוי एकवचन है और स्त्रीलिंग सम्बोधित सत्ता—देश—से सम्बन्धित है; इसलिए 'अपने राष्ट्र को' इस सम्बन्ध को बनाए रखता है।
- source_word: תַכְשִׁלִי
  choice: ठोकर नहीं खिलाओगी
  rationale: मसोरेटिक स्वरांकन के अनुसार यह כשל का हिफ़ील रूप है, जिसका सामान्य अर्थ किसी को ठोकर खिलाना या गिरने का कारण बनना है। स्त्रीलिंग क्रिया सम्बोधित देश के व्याकरणिक लिंग को दर्शाती है।
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: प्रभु यहवे की यह घोषणा है
  rationale: נְאֻם भविष्यद्वाणी की अधिकारपूर्ण घोषणा का सूत्र है। אֲדֹנָי को 'प्रभु' और परमेश्वर के निज नाम יהוה को 'यहवे' रूप में रखा गया है।
theological_decisions:
- issue: אֲדֹנָי יְהוִה में परमेश्वर के नाम का अनुवाद
  choice: प्रभु यहवे
  alternative: प्रभु परमेश्वर
  rationale: मूल पाठ में उपाधि אֲדֹנָי के बाद निज नाम יהוה है। 'प्रभु यहवे' दोनों के बीच का भेद बनाए रखता है और निज नाम को सामान्य उपाधि में नहीं बदलता।
- issue: देश द्वारा अपने राष्ट्र को ठोकर खिलाने का कठिन कथन
  choice: अपने राष्ट्र को ठोकर नहीं खिलाओगी
  alternative: अपने राष्ट्र को सन्तानहीन नहीं करोगी
  rationale: मसोरेटिक स्वरांकन כשל के कारणवाचक अर्थ का समर्थन करता है। प्रसंग में कथन कठिन होने पर भी उसे धर्मवैचारिक रूप से सरल नहीं किया गया; वैकल्पिक पाठ-परम्परा पाद-टिप्पणी में दी गई है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सहज हिन्दी अपनाई गई है। सम्बोधित सत्ता देश है, इसलिए अन्तिम क्रिया का स्त्रीलिंग ‘खिलाओगी’ मूल के स्त्रीलिंग एकवचन को सुरक्षित रखता है। समानार्थी इब्रानी पदों के भेद के लिए ‘अपमान’ और ‘निन्दा’ अलग रखे गए हैं।
