  text: וְ/הוֹלַכְתִּי֩ עֲלֵי/כֶ֨ם אָדָ֜ם אֶת עַמִּ֤/י יִשְׂרָאֵל֙ וִֽ/ירֵשׁ֔וּ/ךָ וְ/הָיִ֥יתָ לָ/הֶ֖ם לְ/נַחֲלָ֑ה וְ/לֹא תוֹסִ֥ף ע֖וֹד לְ/שַׁכְּלָֽ/ם־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/036/012.yaml
  text: And I will cause people—my people Israel—to walk upon you[a], and they will possess you, and you will be their inheritance[c][b], and you will no longer bereave them.
translation:
  language: hi
  text: और मैं लोगों को—अपनी प्रजा इस्राएल को—तुम पर चलवाऊँगा[a]। वे तुम्हें अपने अधिकार में कर लेंगे[b], और तुम उनकी विरासत होगे। और तुम फिर कभी उन्हें उनके बच्चों से वंचित नहीं करोगे[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मैं लोगों को—अपनी प्रजा इस्राएल को—तुम पर ले आऊँगा।” इब्रानी में शाब्दिक भाव है, “मैं मनुष्य को तुम पर चलवाऊँगा”; “अपनी प्रजा इस्राएल” बताता है कि यहाँ किन लोगों की बात है।
    reason: lexical_alternative
  - marker: b
    text: या, “वे तुम्हें विरासत में पाएँगे।” भूमि के प्रसंग में इब्रानी क्रिया का अर्थ अधिकार में करना या विरासत में पाना हो सकता है।
    reason: lexical_alternative
  - marker: c
    text: या, “तुम फिर कभी उन्हें निःसन्तान नहीं करोगे।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוֹלַכְתִּי ... עֲלֵיכֶם
  choice: मैं तुम पर ... चलाऊँगा
  rationale: הלך के हिफ़ील रूप की प्रेरणार्थक शक्ति और भूमि पर लोगों के चलने-बसने की छवि दोनों को बनाए रखता है; संबोधन पहाड़ों/भूमि से है।
- source_word: אָדָם אֶת־עַמִּי יִשְׂרָאֵל
  choice: लोगों को—अपनी प्रजा इस्राएल को—
  rationale: אָדָם यहाँ सामूहिक अर्थ में है और अगला पदबंध उसकी पहचान परमेश्वर की प्रजा इस्राएल के रूप में स्पष्ट करता है।
- source_word: וִירֵשׁוּךָ
  choice: वे तुम पर अधिकार करेंगे
  rationale: ירשׁ भूमि के प्रसंग में अधिकार करने या विरासत में पाने, दोनों अर्थ दे सकता है। मुख्य पाठ में सहज हिन्दी के लिए 'अधिकार करेंगे' और विकल्प पादटिप्पणी में रखा गया है।
- source_word: וְהָיִיתָ לָהֶם לְנַחֲלָה
  choice: तुम उनकी विरासत होगे
  rationale: נַחֲלָה के वाचा और भूमि से जुड़े अर्थ को 'विरासत' स्पष्ट और संक्षिप्त रूप में सुरक्षित रखता है।
- source_word: וְלֹא תוֹסִף עוֹד לְשַׁכְּלָם
  choice: फिर तुम उन्हें निःसन्तान नहीं करोगे
  rationale: לֹא תוֹסִף עוֹד पुनरावृत्ति के समाप्त होने को दर्शाता है, जिसे स्वाभाविक हिन्दी में 'फिर ... नहीं' कहा गया है। שׁכל के पिएल का मूल भाव सन्तानों से वंचित या निःसन्तान करना है।
theological_decisions:
- issue: वाचा से जुड़ी भूमि की शब्दावली
  choice: तुम उनकी विरासत होगे
  alternative: तुम उनकी सम्पत्ति होगे
  rationale: '''विरासत'' इस्राएल को परमेश्वर से भूमि मिलने की धारणा को बनाए रखता है और इसे केवल स्वामित्व की भाषा तक सीमित नहीं करता।'
- issue: भूमि द्वारा लोगों को निःसन्तान करने का मानवीकरण
  choice: फिर तुम उन्हें निःसन्तान नहीं करोगे
  alternative: फिर तुम उनसे उनके बच्चे नहीं छीनोगे
  rationale: मूल पाठ भूमि को संबोधित करके उसे कर्ता के रूप में प्रस्तुत करता है; इस तनावपूर्ण मानवीकरण को हटाया नहीं गया।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सामान्य-पाठक-सुलभ रूप। भूमि/पहाड़ों के बहुवचन संबोधन के कारण 'तुम' रखा गया है। 'चलाऊँगा' मूल की प्रेरणार्थक रचना को बचाता है, जबकि पादटिप्पणी अधिक सहज विकल्प देती है। सभी पादटिप्पणी चिह्न मुख्य पाठ में उसी संबंधित वाक्यांश के पास रखे गए हैं।
