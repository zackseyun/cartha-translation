source:
  edition: WLC
  text: וְ/קִדַּשְׁתִּ֞י אֶת שְׁמִ֣/י הַ/גָּד֗וֹל הַֽ/מְחֻלָּל֙ בַּ/גּוֹיִ֔ם אֲשֶׁ֥ר חִלַּלְתֶּ֖ם בְּ/תוֹכָ֑/ם וְ/יָדְע֨וּ הַ/גּוֹיִ֜ם כִּי אֲנִ֣י יְהוָ֗ה נְאֻם֙ אֲדֹנָ֣/י יְהוִ֔ה בְּ/הִקָּדְשִׁ֥/י בָ/כֶ֖ם לְ/עֵינֵי/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/036/023.yaml
  text: I will sanctify my great name[a], which has been profaned among the nations, which you have profaned among them. Then the nations will know that I am Yahweh, declares the Lord GOD[b], when I show myself holy through you before their eyes.
translation:
  language: hi
  text: मैं अपने उस महान नाम की पवित्रता प्रकट करूँगा[a], जो जातियों के बीच अपवित्र किया गया है—जिसे तुमने उनके बीच अपवित्र किया। तब जातियाँ जान लेंगी कि मैं याहवे हूँ—प्रभु याहवे की यह घोषणा है—जब मैं उनकी आँखों के सामने तुम्हारे द्वारा अपनी पवित्रता प्रकट करूँगा[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक शाब्दिक रूप में: “मैं अपने उस महान नाम को पवित्र करूँगा।”'
    reason: lexical_alternative
  - marker: b
    text: 'अधिक शाब्दिक रूप में: “जब मैं उनकी आँखों के सामने तुममें पवित्र ठहरूँगा।”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְקִדַּשְׁתִּי
  choice: मैं ... की पवित्रता प्रकट करूँगा
  rationale: पिएल रूप यहाँ परमेश्वर के नाम को पहले से अपवित्र मानकर पवित्र बनाने की बात नहीं, बल्कि जातियों के सामने उसकी पवित्रता स्थापित और प्रकट करने की बात करता है। अधिक शाब्दिक रूप पाद-टिप्पणी में रखा गया है।
- source_word: שְׁמִי הַגָּדוֹל
  choice: मेरे उस महान नाम
  rationale: ‘महान नाम’ मूल विशेषण को बनाए रखता है; ‘उस’ पहले से वर्णित और अपवित्र किए गए नाम की ओर स्वाभाविक संकेत करता है।
- source_word: הַמְחֻלָּל ... אֲשֶׁר חִלַּלְתֶּם
  choice: जो ... अपवित्र किया गया है—जिसे तुमने ... अपवित्र किया
  rationale: ‘अपवित्र’ חלל के धार्मिक अर्थ को सटीक रूप से व्यक्त करता है। कर्मवाच्य और फिर इस्राएल की प्रत्यक्ष जिम्मेदारी—दोनों को सुरक्षित रखा गया है।
- source_word: בַּגּוֹיִם
  choice: जातियों के बीच
  rationale: यहाँ גּוֹיִם आसपास के राष्ट्रों और लोगों को दर्शाता है; ‘जातियाँ’ हिंदी बाइबलीय प्रयोग में स्पष्ट और प्रचलित है।
- source_word: וְיָדְעוּ
  choice: तब ... जान लेंगी
  rationale: वाव यहाँ परमेश्वर की कार्रवाई के परिणाम को आगे बढ़ाता है; ‘तब’ इस संबंध को स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: चार अक्षरों वाले व्यक्तिगत ईश्वरीय नाम को किसी उपाधि से बदलने के बजाय हिंदी लिप्यंतरण में प्रस्तुत किया गया है।
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: प्रभु याहवे की यह घोषणा है
  rationale: נְאֻם की भविष्यद्वाणी-संबंधी उद्घोषणा को सहज हिंदी में रखा गया है और אֲדֹנָי तथा יְהוָה दोनों को क्रमशः उपाधि और नाम के रूप में बनाए रखा गया है।
- source_word: בְּהִקָּדְשִׁי בָכֶם
  choice: जब मैं ... तुम्हारे द्वारा अपनी पवित्रता प्रकट करूँगा
  rationale: निफअल रूप परमेश्वर के इस्राएल से संबंधित कार्यों में सार्वजनिक रूप से पवित्र सिद्ध होने को व्यक्त करता है। בָכֶם के साधनवाचक अर्थ को मुख्य पाठ में ‘तुम्हारे द्वारा’ रखा गया है, जबकि स्थानवाचक अधिक शाब्दिक संभावना पाद-टिप्पणी में सुरक्षित है।
- source_word: לְעֵינֵיהֶם
  choice: उनकी आँखों के सामने
  rationale: यह सार्वजनिक और प्रत्यक्ष प्रदर्शन का जीवंत हिब्रू मुहावरा बनाए रखता है।
theological_decisions:
- issue: परमेश्वर के नाम के संबंध में קדשׁ का अर्थ
  choice: अपने महान नाम की पवित्रता प्रकट करना
  alternative: अपने महान नाम को पवित्र करना
  rationale: मुख्य पाठ स्पष्ट करता है कि परमेश्वर के नाम में पवित्रता की कमी नहीं है; वह उस पवित्रता को उन जातियों के सामने स्थापित करेगा जिनके बीच नाम अपवित्र किया गया। अधिक औपचारिक अनुवाद पाद-टिप्पणी में दिया गया है।
- issue: בְּהִקָּדְשִׁי בָכֶם में ב का साधनवाचक अथवा स्थानवाचक अर्थ
  choice: तुम्हारे द्वारा अपनी पवित्रता प्रकट करूँगा
  alternative: तुममें पवित्र ठहरूँगा
  rationale: संदर्भ में परमेश्वर इस्राएल के साथ किए अपने कार्यों के माध्यम से जातियों के सामने अपनी पवित्रता दिखाता है। फिर भी हिब्रू ‘तुममें’ भी समझा जा सकता है, इसलिए उस वास्तविक अस्पष्टता को पाद-टिप्पणी में सुरक्षित रखा गया है।
