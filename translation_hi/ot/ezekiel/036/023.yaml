  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘अपवित्र’ और ‘पवित्रता’ जैसे परिचित धार्मिक शब्द मूल के קדשׁ/חלל विरोध को बनाए रखते हैं। विराम-चिह्न पुनरुक्त संबंधों और भविष्यद्वाणी की घोषणा को स्पष्ट करते हैं।
