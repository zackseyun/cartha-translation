  text: וְ/הָ/אָ֥רֶץ הַ/נְּשַׁמָּ֖ה תֵּֽעָבֵ֑ד תַּ֚חַת אֲשֶׁ֣ר הָיְתָ֣ה שְׁמָמָ֔ה לְ/עֵינֵ֖י כָּל עוֹבֵֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/036/034.yaml
  text: And the desolate land will be cultivated instead of being a desolation in the sight of all who pass by[a].
translation:
  language: hi
  text: और उजाड़ पड़ी भूमि में खेती की जाएगी, जबकि वह हर आने-जानेवाले की आँखों के सामने उजाड़ पड़ी थी।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “और उजाड़ पड़ी भूमि में खेती की जाएगी, उसके बदले कि वह हर आने-जानेवाले की आँखों के सामने उजाड़ पड़ी थी।”
    reason: תַּחַת אֲשֶׁר के विरोधसूचक/प्रतिस्थापनात्मक संबंध को अधिक शाब्दिक रूप में व्यक्त करने का विकल्प।
lexical_decisions:
- source_word: הָאָרֶץ
  choice: भूमि
  rationale: पुनर्स्थापना के इस प्रसंग में यह इस्राएल के भूभाग को दर्शाता है; ‘भूमि’ स्वाभाविक और संदर्भानुकूल है।
- source_word: הַנְּשַׁמָּה
  choice: उजाड़ पड़ी
  rationale: यह कर्मवाच्य कृदन्त भूमि की नष्ट और निर्जन अवस्था बताता है; ‘उजाड़ पड़ी’ आधुनिक हिन्दी में स्वाभाविक है।
- source_word: תֵּעָבֵד
  choice: जोती-बोई जाएगी
  rationale: यहाँ निफ़अल रूप का आशय भूमि का कृषि के लिए काम में लाया जाना है; यह पदबंध कर्मवाच्य अर्थ और कृषि-चित्र दोनों स्पष्ट करता है।
- source_word: תַּחַת אֲשֶׁר
  choice: जो ... थी, वह
  rationale: इब्रानी रचना वर्तमान होनेवाले परिवर्तन और भूमि की पिछली दशा में विरोध दिखाती है; हिन्दी वाक्य-विन्यास इस बदलाव को स्वाभाविक रूप से व्यक्त करता है, जबकि वैकल्पिक अर्थ पादटिप्पणी में रखा गया है।
- source_word: הָיְתָה שְׁמָמָה
  choice: उजाड़ थी
  rationale: यद्यपि שְׁמָמָה संज्ञा है, हिन्दी में ‘उजाड़ थी’ अधिक स्वाभाविक ढंग से उसी पूर्ण वीरानी की दशा को व्यक्त करता है।
- source_word: לְעֵינֵי
  choice: की आँखों के सामने
  rationale: यह मूल के दृश्य और सार्वजनिक रूप से दिखाई देने के भाव को बनाए रखता है।
- source_word: כָּל עוֹבֵר
  choice: हर आने-जानेवाले
  rationale: כָּל के साथ एकवचन कृदन्त का सामूहिक और सामान्य अर्थ है; यह हिन्दी में राहगीरों के व्यापक वर्ग को सहजता से व्यक्त करता है।
