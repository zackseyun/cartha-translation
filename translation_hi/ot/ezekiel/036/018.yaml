base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/036/018.yaml
  text: So I poured out my wrath upon them for the blood that they had poured out on the land[a], and because they had defiled it with their idols.
translation:
  language: hi
  text: इसलिए मैंने उन पर अपना क्रोध उंडेल दिया, उस खून के कारण जो उन्होंने उस देश में बहाया था, और इसलिए कि उन्होंने अपनी मूर्तियों[a] से उसे अशुद्ध कर दिया था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी शब्द גִּלּוּלִים मूर्तियों के लिए अत्यंत तिरस्कारपूर्ण शब्द है; इसका भाव “घृणित मूर्तियाँ” जैसा है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶשְׁפֹּךְ
  choice: मैंने ... उंडेल दिया
  rationale: שׁפךְ के द्रव उंडेलने वाले मूल बिंब को बनाए रखता है और प्रकोप के साथ स्वाभाविक हिन्दी प्रयोग है।
- source_word: חֲמָתִי
  choice: अपना प्रकोप
  rationale: ईश्वरीय न्याय के प्रसंग में חֵמָה की तीव्र और गंभीर क्रोधार्थक शक्ति को व्यक्त करता है; आधुनिक हिन्दी में 'प्रकोप उंडेलना' स्वाभाविक और गरिमापूर्ण है।
- source_word: עַל הַדָּם אֲשֶׁר שָׁפְכוּ
  choice: उस खून के कारण जो उन्होंने ... बहाया था
  rationale: हिन्दी में रक्तपात के लिए 'खून बहाना' स्वाभाविक है। इससे पहले שׁפךְ के साथ अर्थगत संबंध भी कुछ हद तक बना रहता है, यद्यपि समान क्रिया को हूबहू दोहराना हिन्दी में अस्वाभाविक होता।
- source_word: עַל הָאָרֶץ
  choice: उस देश में
  rationale: प्रसंग में הָאָרֶץ इस्राएल के देश को सूचित करता है। रक्त बहाने के स्थान के लिए हिन्दी में 'देश में' अधिक स्वाभाविक है।
- source_word: וּבְגִלּוּלֵיהֶם
  choice: और इसलिए कि ... अपनी मूर्तियों से
  rationale: וּ और समानांतर कारणसूचक संरचना को स्पष्ट रखते हुए मूर्तियों को देश की अशुद्धि का माध्यम बताया गया है। גִּלּוּלִים की तिरस्कारपूर्ण छाया पादटिप्पणी में दी गई है।
- source_word: טִמְּאוּהָ
  choice: उसे अशुद्ध कर दिया था
  rationale: Piel रूप का कारणवाचक अर्थ व्यक्त करता है; स्त्रीलिंग प्रत्यय का संदर्भ 'देश' है। 'अशुद्ध' धार्मिक और वाचा-संबंधी अपवित्रता को समेटता है।
theological_decisions:
- issue: ईश्वरीय न्याय की भाषा
  choice: '''अपना प्रकोप उंडेल दिया'' और दोनों कारण—खून बहाना तथा मूर्तियों से देश को अशुद्ध करना—स्पष्ट रखे गए।'
  alternative: '''अपना क्रोध/कोप उंडेल दिया'''
  rationale: पद परमेश्वर की प्रतिक्रिया को रक्तपात और मूर्तिपूजक अशुद्धि के प्रत्युत्तर में न्याय के रूप में प्रस्तुत करता है; अनियंत्रित भावावेग का अर्थ आरोपित नहीं किया गया।
- issue: הָאָרֶץ का संदर्भ
  choice: '''उस देश'''
  alternative: '''पृथ्वी'' या ''भूमि'''
  rationale: यहेजकेल के निकट प्रसंग में संदर्भ इस्राएल के देश का है। निश्चित संकेत 'उस' इस संदर्भ को स्वाभाविक हिन्दी में प्रकट करता है, बिना इसे पूरी पृथ्वी तक विस्तृत किए।
translation_notes:
  register: आधुनिक मानक हिन्दी; गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध। 'प्रकोप उंडेल दिया' मूल बिंब को रखता है, और 'खून बहाया' हिन्दी का स्वाभाविक प्रयोग है। मुख्य पाठ में पादटिप्पणी-चिह्न [a] संबंधित शब्द के तुरंत बाद रखा गया है।
