  edition: WLC
  text: לָ/כֵן֙ הִנָּבֵ֣א וְ/אָמַרְתָּ֔ כֹּ֥ה אָמַ֖ר אֲדֹנָ֣/י יְהוִ֑ה יַ֣עַן בְּ/יַ֡עַן שַׁמּוֹת֩ וְ/שָׁאֹ֨ף אֶתְ/כֶ֜ם מִ/סָּבִ֗יב לִֽ/הְיוֹתְ/כֶ֤ם מֽוֹרָשָׁה֙ לִ/שְׁאֵרִ֣ית הַ/גּוֹיִ֔ם וַ/תֵּֽעֲל֛וּ עַל שְׂפַ֥ת לָשׁ֖וֹן וְ/דִבַּת עָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/036/003.yaml
  text: 'Therefore prophesy and say[a], Thus says the Lord GOD: Because, indeed because they have made you desolate and have snapped at you from every side, so that you became a possession for the remnant of the nations, and you have come up on the lips of the tongue and in the slander of the people[b],'
translation:
  language: hi
  text: 'इसलिए भविष्यवाणी करके कहो, ‘प्रभु यहोवा यों कहता है: चूँकि—हाँ, चूँकि—उन्होंने तुम्हें उजाड़ दिया और चारों ओर से हाँफते हुए तुम्हारे पीछे पड़े[a], जिससे तुम बची हुई जातियों की संपत्ति बन गए; और तुम लोगों की ज़बान पर चढ़ गए और उनकी बदनामी का विषय बन गए[b],’'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इस इब्रानी क्रिया का अर्थ कठिन है। इसके अन्य सम्भव अनुवाद हैं: ‘लपककर तुम्हें हड़पना चाहा,’ ‘तुम्हें निगल गए,’ या ‘हाँफते हुए तुम्हारा पीछा किया।’ यहाँ आसपास की जातियों के हिंसक, शिकारी दबाव का भाव है।'
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, ‘तुम जीभ के होंठ पर चढ़ गए’; अर्थात तुम लोगों की चर्चा और निंदात्मक बातों का विषय बन गए।
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: इसलिए
  rationale: यह पिछले कथन के आधार पर आने वाली भविष्यवाणी का निष्कर्ष प्रस्तुत करता है।
- source_word: הִנָּבֵא וְאָמַרְתָּ
  choice: भविष्यवाणी करके कहो
  rationale: आज्ञार्थक संबोधन को स्वाभाविक आधुनिक हिन्दी में रखते हुए दोनों क्रियाओं का भाव सुरक्षित किया गया है।
- source_word: אֲדֹנָי יְהוִה
  choice: प्रभु यहोवा
  rationale: संयुक्त ईश्वरीय उपाधि में אֲדֹנָי को ‘प्रभु’ और व्यक्तिगत नाम יהוה को प्रचलित हिन्दी रूप ‘यहोवा’ से व्यक्त किया गया है।
- source_word: יַעַן בְּיַעַן
  choice: चूँकि—हाँ, चूँकि—
  rationale: दोहराए गए कारणसूचक पद का जोर बनाए रखने के लिए हिन्दी में भी बलयुक्त पुनरुक्ति रखी गई है।
- source_word: שַׁמּוֹת
  choice: उन्होंने तुम्हें उजाड़ दिया
  rationale: पहाड़ों/देश को निर्जन और ध्वस्त करने का भाव व्यक्त होता है; प्रसंग से शत्रु जातियाँ निहित कर्ता हैं।
- source_word: שָׁאֹף אֶתְכֶם מִסָּבִיב
  choice: चारों ओर से हाँफते हुए तुम्हारे पीछे पड़े
  rationale: दुर्बोध क्रिया में हाँफने, लपकने अथवा निगल जाने की शत्रुतापूर्ण आकांक्षा का भाव है; चुना गया रूप मूल बिंब और आक्रामक दबाव दोनों को रखता है।
- source_word: לִהְיוֹתְכֶם מוֹרָשָׁה
  choice: ताकि तुम ... की संपत्ति बन जाओ
  rationale: לְ־ के प्रयोजन/परिणाम और מורשה के अधिकार में ली गई संपत्ति के भाव को स्पष्ट करता है।
- source_word: לִשְׁאֵרִית הַגּוֹיִם
  choice: बची हुई जातियों की
  rationale: यहाँ שְׁאֵרִית आसपास की शेष जातियों को सूचित करता है, किसी विशेष धार्मिक ‘शेष’ समुदाय को नहीं।
- source_word: וַתֵּעֲלוּ עַל שְׂפַת לָשׁוֹן
  choice: तुम लोगों की ज़बान पर चढ़ गए
  rationale: हिन्दी का स्वाभाविक मुहावरा इब्रानी के ‘जीभ के होंठ पर चढ़ने’ वाले चित्र और चर्चा का विषय बनने के अर्थ को साथ रखता है।
- source_word: וְדִבַּת עָם
  choice: उनकी बदनामी का विषय बन गए
  rationale: דִבָּה निंदात्मक चर्चा, बुरी रिपोर्ट या बदनामी का संकेत देता है; यह रूप शत्रुतापूर्ण लोक-चर्चा को सहज हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: אֲדֹנָי יְהוִה में ईश्वरीय नाम का अनुवाद
  choice: प्रभु यहोवा
  alternative: प्रभु याहवे; प्रभु परमेश्वर
  rationale: ‘यहोवा’ हिन्दी पाठकों में ईश्वरीय व्यक्तिगत नाम के रूप में परिचित है और יהוה को सामान्य उपाधि ‘परमेश्वर’ में विलीन नहीं करता; साथ ही אֲדֹנָי के लिए ‘प्रभु’ रखा गया है।
- issue: שְׁאֵרִית הַגּוֹיִם में ‘शेष’ का आशय
  choice: बची हुई जातियाँ
  alternative: जातियों का शेष भाग; शेष जातियाँ
  rationale: प्रसंग अन्य राष्ट्रों के बचे हुए समूह की बात करता है; शब्दावली को इस्राएल के धार्मिक ‘शेष’ की अवधारणा की ओर मोड़ने से बचाया गया है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सहज मानक हिन्दी अपनाई गई है। भविष्यद्वाणी की तीव्रता दिखाने के लिए ‘चूँकि—हाँ, चूँकि—’ की जोरदार पुनरुक्ति रखी गई है। कठिन शिकारी बिंब और ‘ज़बान पर चढ़ना’ मुहावरा मुख्य पाठ में सुरक्षित हैं, जबकि वैकल्पिक अर्थ पादटिप्पणियों में दिए गए हैं।
