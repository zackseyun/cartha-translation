  text: לָ/כֵ֕ן הִנָּבֵ֖א עַל אַדְמַ֣ת יִשְׂרָאֵ֑ל וְ/אָמַרְתָּ֡ לֶ/הָרִ֣ים וְ֠/לַ/גְּבָעוֹת לָ/אֲפִיקִ֨ים וְ/לַ/גֵּאָי֜וֹת כֹּֽה אָמַ֣ר אֲדֹנָ֣/י יְהוִ֗ה הִנְ/נִ֨י בְ/קִנְאָתִ֤/י וּ/בַ/חֲמָתִ/י֙ דִּבַּ֔רְתִּי יַ֛עַן כְּלִמַּ֥ת גּוֹיִ֖ם נְשָׂאתֶֽם־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/036/006.yaml
  text: 'Therefore prophesy concerning the land of Israel, and say to the mountains and the hills, to the ravines and the valleys, ‘Thus says the Lord GOD: Look, I have spoken in my jealousy and in my wrath, because you have borne the disgrace of the nations.’'
translation:
  language: hi
  text: 'इसलिए इस्राएल की भूमि के विषय में भविष्यवाणी करो और पहाड़ों और पहाड़ियों, नालों और घाटियों से यह कहो, ‘प्रभु यहोवा यों कहता है: देखो, मैंने अपनी जलन और अपने क्रोध में यह बात कही है, क्योंकि तुमने राष्ट्रों की निन्दा सही है।’'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  choice: प्रभु यहोवा
  rationale: संयुक्त ईश्वरीय उपाधि और व्यक्तिगत नाम, दोनों को स्पष्ट रखते हुए हिन्दी बाइबल की परिचित और गरिमापूर्ण शैली बनाए रखता है।
- source_word: הִנְנִי
  choice: देखो
  rationale: ध्यान आकर्षित करने वाले हिब्रू संकेत का स्वाभाविक और संक्षिप्त हिन्दी रूप।
- source_word: קִנְאָתִי
  choice: मेरी जलन
  rationale: यह शब्द ईश्वरीय प्रबल, विशिष्ट निष्ठा और जोशीले आग्रह को व्यक्त करता है; ‘ईर्ष्या’ अनावश्यक रूप से क्षुद्र मानवीय भाव का संकेत दे सकती है।
- source_word: כְּלִמַּת גּוֹיִם
  choice: राष्ट्रों का अपमान
  rationale: 'संबंध की मूल अस्पष्टता को यथासंभव बनाए रखता है: यह राष्ट्रों द्वारा पहुँचाया गया अपमान अथवा उनसे जुड़ा अपमान हो सकता है।'
- source_word: נְשָׂאתֶם
  choice: तुमने ... सहा है
  rationale: भूमि के विभिन्न भू-भागों को संबोधित बहुवचन और अपमान उठाने/झेलने के भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: ईश्वर की קִנְאָה का स्वरूप
  choice: जलन
  alternative: ईर्ष्या / उत्साह
  rationale: मूल पाठ के भावात्मक तनाव को बनाए रखा गया है; इसे केवल निष्पक्ष ‘उत्साह’ बनाकर नरम नहीं किया गया और न ही मानवीय दोष के रूप में निश्चित किया गया।
- issue: भूमि के भू-भागों का मानवीकरण
  choice: दूसरे पुरुष बहुवचन ‘तुमने’ बनाए रखा
  alternative: ‘इस भूमि ने’ या निर्जीव वर्णन
  rationale: मूल में पहाड़ों, पहाड़ियों, घाटियों और तराइयों को प्रत्यक्ष संबोधन मिलता है; इस काव्यात्मक-भविष्यवाणीय रूप को सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में स्वाभाविक, गरिमापूर्ण भविष्यवाणीय शैली। ‘यों कहता है’ और ‘प्रभु यहोवा’ परिचित बाइबलीय भाषा रखते हैं, जबकि वाक्यरचना सामान्य पाठक के लिए स्पष्ट है।
