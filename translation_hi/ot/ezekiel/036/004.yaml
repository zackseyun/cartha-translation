source:
  edition: WLC
  text: לָ/כֵן֙ הָרֵ֣י יִשְׂרָאֵ֔ל שִׁמְע֖וּ דְּבַר אֲדֹנָ֣/י יְהוִ֑ה כֹּֽה אָמַ֣ר אֲדֹנָ֣/י יְ֠הוִה לֶ/הָרִ֨ים וְ/לַ/גְּבָע֜וֹת לָ/אֲפִיקִ֣ים וְ/לַ/גֵּאָי֗וֹת וְ/לֶ/חֳרָב֤וֹת הַ/שֹּֽׁמְמוֹת֙ וְ/לֶ/עָרִ֣ים הַ/נֶּעֱזָב֔וֹת אֲשֶׁ֨ר הָי֤וּ לְ/בַז֙ וּ/לְ/לַ֔עַג לִ/שְׁאֵרִ֥ית הַ/גּוֹיִ֖ם אֲשֶׁ֥ר מִ/סָּבִֽיב־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/036/004.yaml
  text: 'Therefore[a], mountains of Israel, hear the word of the Lord GOD. Thus says the Lord GOD to the mountains and to the hills, to the ravines and to the valleys[b], to the desolate ruins and to the abandoned cities that have become plunder and mockery to the remnant of the nations that are all around:'
translation:
  language: hi
  text: 'इसलिए, हे इस्राएल के पहाड़ो, प्रभु याहवे का वचन सुनो। प्रभु याहवे पहाड़ों और पहाड़ियों को, नालों[a] और घाटियों को, उजाड़ खंडहरों और त्यागे हुए नगरों को—जो चारों ओर की बाकी बची जातियों[b] के लिए लूट और उपहास का विषय बन गए हैं—यह कहता है:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘जलमार्गों’ अथवा ‘दर्रों’।
    reason: אֲפִיקִים जलधारा के मार्ग, नाले या गहरे भू-मार्ग के लिए प्रयुक्त हो सकता है।
  - marker: b
    text: या ‘जातियों के शेष भाग’।
    reason: שְׁאֵרִית का अर्थ ‘बाकी बचे लोग’ या अधिक शाब्दिक रूप से ‘शेष भाग’ हो सकता है।
lexical_decisions:
- source_word: לָכֵן
  choice: इसलिए
  rationale: यह पिछले कथन से निष्कर्ष या परिणाम प्रस्तुत करने वाला सामान्य कारणसूचक शब्द है।
- source_word: הָרֵי יִשְׂרָאֵל
  choice: हे इस्राएल के पहाड़ो
  rationale: प्रत्यक्ष संबोधन और भूमि-रूपों के मानवीकरण को बनाए रखने के लिए संबोधन-चिह्न ‘हे’ सहित शाब्दिक रूप रखा गया है।
- source_word: שִׁמְעוּ דְּבַר
  choice: वचन सुनो
  rationale: बहुवचन आज्ञार्थक क्रिया और भविष्यद्वाणी के औपचारिक ‘वचन’ को सुरक्षित रखता है।
- source_word: אֲדֹנָי יְהוִה
  choice: प्रभु यहोवा
  rationale: אֲדֹנָי को ‘प्रभु’ और परमेश्वर के व्यक्तिगत नाम יהוה को प्रचलित हिंदी रूप ‘यहोवा’ से दर्शाया गया है; दोनों घटकों को अलग बनाए रखा गया है।
- source_word: אֲפִיקִים
  choice: नालों
  rationale: यह शब्द जलधाराओं के मार्ग, नाले या दर्रे-सदृश गहरे भूभाग को सूचित कर सकता है; स्थलाकृतिक सूची में ‘नाले’ सहज और पर्याप्त व्यापक है।
- source_word: גֵּאָיוֹת
  choice: घाटियों
  rationale: सामान्य स्थलाकृतिक अर्थ को आधुनिक और स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: חֳרָבוֹת הַשֹּׁמְמוֹת
  choice: उजाड़ खंडहरों
  rationale: ‘खंडहर’ विनाश और ‘उजाड़’ निर्जनता—दोनों इब्रानी घटकों को संक्षेप में व्यक्त करते हैं।
- source_word: עָרִים הַנֶּעֱזָבוֹת
  choice: त्यागे हुए नगरों
  rationale: निष्क्रिय रूप में छोड़ दिए जाने या परित्यक्त होने का भाव सुरक्षित है।
- source_word: לְבַז וּלְלַעַג
  choice: लूट और उपहास का विषय
  rationale: नगर स्वयं लूटे जाने की वस्तु और हँसी-ठट्ठे का निशाना बने; हिंदी में संयुक्त वाक्यांश दोनों अर्थ स्पष्ट करता है।
- source_word: שְׁאֵרִית הַגּוֹיִם אֲשֶׁר מִסָּבִיב
  choice: चारों ओर की बाकी बची जातियों
  rationale: ‘बाकी बची’ שְׁאֵרִית का सामान्य प्रसंगगत अर्थ और ‘चारों ओर की’ स्थानिक संबंध दोनों बनाए रखता है।
theological_decisions:
- issue: अֲדֹנָי יְהוִה में परमेश्वर के नाम का अनुवाद
  choice: प्रभु यहोवा
  alternative: प्रभु याहवे / परमेश्वर यहोवा
  rationale: मूल पाठ के उपाधि और व्यक्तिगत नाम—दोनों को अलग दिखाया गया है। ‘यहोवा’ आधुनिक हिंदी बाइबलीय प्रयोग में पहचाना जाने वाला रूप है; इसे केवल ‘परमेश्वर’ बनाकर नाम को छिपाया नहीं गया।
- issue: שְׁאֵרִית को विशेष उद्धार-संबंधी ‘शेष’ अर्थ देना या सामान्य ‘बाकी बचे’ अर्थ में लेना
  choice: बाकी बची जातियाँ
  alternative: जातियों का शेष भाग
  rationale: यहाँ संदर्भ आसपास की बची हुई अन्यजातियों का है; अनुवाद शब्द का अवशेष-संबंधी अर्थ रखता है, पर ऐसा विशेष धर्मवैज्ञानिक आशय नहीं जोड़ता जिसकी प्रसंग में माँग नहीं है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और भविष्यद्वाणी के सार्वजनिक संबोधन के अनुकूल रखी गई है। सूची की पुनरावृत्त लय को ‘से’ के प्रयोग द्वारा बनाए रखा गया है, जबकि डैश के भीतर संबंधवाचक उपवाक्य से यह स्पष्ट किया गया है कि लूट और उपहास बनने का कथन उजाड़ स्थानों और नगरों से संबंधित है।
