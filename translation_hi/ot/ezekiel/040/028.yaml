  text: Then he brought me into the inner court by way of the south gate[b][a], and he measured the south gate according to these measurements.
translation:
  language: hi
  text: फिर वह मुझे दक्षिणी फाटक से होकर भीतरी आँगन में ले गया[a], और उसने दक्षिणी फाटक को इन मापों के अनुसार नापा[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “दक्षिणी फाटक के मार्ग से।” इब्रानी पूर्वसर्ग फाटक से प्रवेश करने का भाव दे सकता है।
    reason: lexical_alternative
  - marker: b
    text: अर्थात दक्षिणी फाटक की मापें पहले वर्णित मापों के समान थीं।
    reason: cross_reference
lexical_decisions:
- source_word: וַיְבִיאֵנִי
  choice: फिर वह मुझे ... ले गया
  rationale: हिफ़ील रूप का अर्थ ‘ले आना/ले जाना’ है; प्रसंग में ‘फिर’ वर्णन की क्रमिक प्रगति को स्वाभाविक रूप से व्यक्त करता है।
- source_word: חָצֵר הַפְּנִימִי
  choice: भीतरी आँगन
  rationale: मन्दिर-परिसर के भीतर के court के लिए यह आधुनिक, सहज और स्थापत्य-संदर्भ के अनुकूल हिन्दी है।
- source_word: בְּשַׁעַר הַדָּרוֹם
  choice: दक्षिणी फाटक से होकर
  rationale: בְּ यहाँ प्रवेश के मार्ग या माध्यम को सूचित करता है; ‘से होकर’ इस अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וַיָּמָד
  choice: और उसने ... नापा
  rationale: מדד के काल रूप का सीधा अर्थ ‘नापना’ है; दर्शन में बार-बार होने वाली माप की क्रिया स्पष्ट रखी गई है।
- source_word: אֶת הַשַּׁעַר הַדָּרוֹם
  choice: दक्षिणी फाटक को
  rationale: यह क्रिया का निश्चित प्रत्यक्ष कर्म है और अभी बताए गए उसी फाटक की ओर संकेत करता है।
- source_word: כַּמִּדּוֹת הָאֵלֶּה
  choice: उसकी मापें पहले बताई गई मापों के समान थीं
  rationale: כְּ समानता दर्शाता है। हिन्दी में यह स्पष्ट और सहज ढंग से बताता है कि फाटक की माप पहले वर्णित मापों से मेल खाती थी; ‘पहले बताई गई’ प्रसंगगत निर्देश को खोलता है।
