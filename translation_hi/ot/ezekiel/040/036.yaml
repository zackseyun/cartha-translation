  choice: उसकी लंबाई पचास हाथ और चौड़ाई पच्चीस हाथ थी
  rationale: मूल माप-इकाई אַמָּה को परंपरागत और समझने योग्य हिन्दी ‘हाथ’ से व्यक्त किया गया है; आधुनिक इकाई में अनुमानित रूपांतरण नहीं किया गया।
