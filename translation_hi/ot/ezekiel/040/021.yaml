- source_word: הַשַּׁעַר הָרִאשׁוֹן
  choice: पहला फाटक
  rationale: वर्णन में पहले मापे गए फाटक की ओर संकेत करता है।
- source_word: חֲמִשִּׁים אַמָּה אָרְכּוֹ
  choice: उसकी लंबाई पचास हाथ
  rationale: मूल में आए स्पष्ट संज्ञा ‘लंबाई’ और माप दोनों को बनाए रखता है।
- source_word: וְרֹחַב חָמֵשׁ וְעֶשְׂרִים בָּאַמָּה
  choice: चौड़ाई पच्चीस हाथ
  rationale: लंबाई वाले वाक्यांश के समानांतर रहते हुए माप को संक्षेप और स्पष्टता से देता है।
- source_word: אַמָּה
  choice: हाथ
  rationale: बाइबलीय ‘क्यूबिट’ के लिए प्रचलित हिन्दी माप-शब्द है और दर्शन में प्रयुक्त मूल माप-प्रणाली को बनाए रखता है।
