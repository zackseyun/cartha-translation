base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/040/021.yaml
  text: 'Its guardrooms were three on this side and three on that side[a], and its side pillars and its portico had the same measurements as the first gate: its length was fifty cubits[b], and the width twenty-five cubits.'
translation:
  language: hi
  text: उसकी पहरेदार कोठरियाँ इस ओर तीन और उस ओर तीन थीं। उसके पार्श्व-स्तंभ[a] और उसका द्वार-मंडप[b] पहले फाटक के समान माप के थे। उसकी लंबाई पचास हाथ और उसकी चौड़ाई पच्चीस हाथ थी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “चौखट के खंभे” अथवा “भित्ति-स्तंभ”; यहाँ प्रयुक्त इब्रानी वास्तुशिल्पीय शब्द का ठीक अर्थ कुछ अनिश्चित है।
    reason: lexical_alternative
  - marker: b
    text: या “प्रवेश-कक्ष” अथवा “बरामदा”।
    reason: lexical_alternative
