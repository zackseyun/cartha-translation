  register: आधुनिक मानक हिन्दी में सहज किंतु गरिमापूर्ण स्थापत्य-वर्णन रखा गया है। ‘मंडप,’ ‘फाटक’ और ‘मंदिर-भवन’ सामान्य पाठक के लिए बोधगम्य हैं; जहाँ मूल स्थापत्य शब्द अनिश्चित है, वहाँ मुख्य पाठ को बोझिल किए बिना पादटिप्पणी दी गई है।
