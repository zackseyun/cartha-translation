  text: וַ/יָּ֜מָד אֶת אֻלָ֤ם הַ/שַּׁ֨עַר֙ שְׁמֹנֶ֣ה אַמּ֔וֹת ו/איל/ו שְׁתַּ֣יִם אַמּ֑וֹת וְ/אֻלָ֥ם הַ/שַּׁ֖עַר מֵ/הַ/בָּֽיִת־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/040/009.yaml
  text: 'Then he measured the portico of the gate: eight cubits[a], and its side pillars two cubits[b]; and the portico of the gate was toward the temple.'
translation:
  language: hi
  text: तब उसने फाटक के मंडप को मापा; मंडप आठ हाथ का था, और उसके पार्श्व-स्तंभ[a] दो हाथ के थे। फाटक का मंडप मंदिर-भवन[b] की ओर था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इस स्थापत्य शब्द का अनुवाद ‘द्वार-स्तंभ,’ ‘भित्ति-स्तंभ’ या ‘चौखट के खंभे’ भी किया जा सकता है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में ‘भवन’ या ‘घर’; मंदिर के इस दर्शन में यह मंदिर की मुख्य इमारत को सूचित करता है।
    reason: cultural_note
lexical_decisions:
- source_word: וַיָּמָד
  choice: तब उसने ... मापा
  rationale: वय्यिक्तोल रूप दर्शन के वर्णन में अगली क्रिया को आगे बढ़ाता है; ‘तब’ आधुनिक हिन्दी में इस क्रम को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: אֻלָם
  choice: मंडप
  rationale: यह फाटक से जुड़ी प्रवेश-रचना या छायादार अग्रभाग को दर्शाता है। ‘मंडप’ संक्षिप्त, गरिमापूर्ण और स्थापत्य-संदर्भ में सहज है।
- source_word: הַשַּׁעַר
  choice: फाटक
  rationale: यह केवल द्वार-पल्ले के बजाय मापी जा रही पूरी प्रवेश-संरचना को सूचित करता है; ‘फाटक’ आधुनिक हिन्दी में इसे स्पष्ट करता है।
- source_word: שְׁמֹנֶה אַמּוֹת
  choice: आठ हाथ
  rationale: प्राचीन माप ‘अम्मा’ के लिए हिन्दी बाइबल परंपरा में समझ आने वाला ‘हाथ’ रखा गया है; आधुनिक इकाई में अनुमानित परिवर्तन नहीं किया गया।
- source_word: וְאֵילוֹ
  choice: और उसके बगल के खंभे
  rationale: אֵיל यहाँ फाटक की ओर निकले सहायक स्थापत्य-अंगों के लिए प्रयुक्त है। सटीक आधुनिक समकक्ष अनिश्चित होने के कारण सरल मुख्य पाठ के साथ विकल्प पादटिप्पणी में दिए गए हैं।
- source_word: שְׁתַּיִם אַמּוֹת
  choice: दो हाथ के थे
  rationale: मूल में बताए गए माप को सीधे रखा गया है और यह नहीं जोड़ा गया कि यह ऊँचाई, चौड़ाई या मोटाई थी।
- source_word: מֵהַבָּיִת
  choice: मंदिर-भवन की ओर था
  rationale: בַּיִת का शाब्दिक अर्थ ‘भवन/घर’ है, पर इस दर्शन में यह मंदिर की मुख्य इमारत को सूचित करता है। מִן का स्थानिक प्रयोग यहाँ मंदिर की तरफ स्थित होने या उन्मुख होने का भाव देता है।
