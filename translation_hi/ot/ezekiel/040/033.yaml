base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/040/033.yaml
  text: And its guardrooms[a], its side pillars, and its portico were according to these measurements; and it and its side pillars had windows all around. Its length was fifty cubits[b], and its width twenty-five cubits.
translation:
  language: hi
  text: उसकी पहरेदार कोठरियाँ, उसके पार्श्व-स्तंभ[a] और उसका द्वार-मंडप[b] इन्हीं मापों के अनुसार थे। उसमें और उसके द्वार-मंडप में चारों ओर खिड़कियाँ थीं। उसकी लंबाई पचास हाथ और चौड़ाई पच्चीस हाथ थी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘द्वार के बाजू’ अथवा ‘भित्ति-स्तंभ’। इब्रानी स्थापत्य शब्द कठिन है और द्वार के किनारों के संरचनात्मक अंगों को सूचित कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: या ‘बरामदा’ अथवा ‘प्रवेश-कक्ष’।
    reason: lexical_alternative
lexical_decisions:
- source_word: תָּא
  choice: पहरेदार कोठरियाँ
  rationale: यहेजकेल 40 के द्वार-विन्यास में यह शब्द द्वार से लगी छोटी कोठरियों को सूचित करता है; प्रसंग में उनका पहरेदारी से संबंध संभावित है। यह रूप स्थापत्य और संभावित कार्य, दोनों को सहज हिन्दी में व्यक्त करता है।
- source_word: אַיִל
  choice: पार्श्व-स्तंभ
  rationale: यह कठिन स्थापत्य शब्द द्वार के किनारों के उभरे हुए संरचनात्मक अंगों के लिए है। ‘पार्श्व-स्तंभ’ सामान्य ‘खंभे’ से अधिक सटीक है, जबकि ‘भित्ति-स्तंभ’ अत्यधिक तकनीकी हो सकता है।
- source_word: אֵילָם
  choice: द्वार-मंडप
  rationale: मंदिर के प्रवेश-द्वार से जुड़े मंडप या बरामदे के अर्थ को ‘द्वार-मंडप’ स्पष्ट और गरिमापूर्ण आधुनिक हिन्दी में व्यक्त करता है।
- source_word: כַּמִּדּוֹת הָאֵלֶּה
  choice: इन्हीं मापों के अनुसार
  rationale: यह पद पहले बताए गए मापों के साथ अनुरूपता प्रकट करता है; चुना हुआ रूप हिन्दी में स्वाभाविक और सटीक है।
- source_word: חַלּוֹנוֹת
  choice: खिड़कियाँ
  rationale: सामान्य स्थापत्य अर्थ ‘खिड़कियाँ’ यहाँ उपयुक्त है; ‘खिड़कीनुमा झरोखे’ जैसा विस्तार मूल में आवश्यक नहीं है।
- source_word: לוֹ וּלְאֵילַמּוֹ
  choice: उसमें और उसके द्वार-मंडप में
  rationale: पूर्वसर्ग ל यहाँ संरचना और द्वार-मंडप में खिड़कियों की स्थिति/संबंध बताता है। उपलब्ध इब्रानी पाठ में दूसरा संज्ञा-पद אֵילָם ‘द्वार-मंडप’ है, न कि אַיִל ‘पार्श्व-स्तंभ’; इसलिए अंग्रेज़ी परामर्श-पाठ की संशोधित पंक्ति का अनुसरण नहीं किया गया।
- source_word: סָבִיב סָבִיב
  choice: चारों ओर
  rationale: दोहराया हुआ इब्रानी पद हर ओर होने पर बल देता है; ‘चारों ओर’ उसका स्वाभाविक हिन्दी समतुल्य है।
- source_word: אַמָּה
  choice: हाथ
  rationale: बाइबिलीय लंबाई की इकाई ‘क्यूबिट’ के लिए हिन्दी बाइबिल-परंपरा में बोधगम्य ‘हाथ’ रखा गया है; यह आधुनिक मानकीकृत लंबाई नहीं थी।
