  text: And from the front of the outer gateway to the front of the vestibule of the inner gate was fifty cubits[a][b][c].
translation:
  language: hi
  text: और बाहरी फाटक[a] के सामने से लेकर भीतरी फाटक के द्वार-मंडप[b] के सामने तक पचास हाथ थे।[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ ‘बाहरी’ के लिए आया इब्रानी रूप कठिन और असामान्य है। आसपास दिए गए मापों के संदर्भ में बहुत-से व्याख्याकार इसे बाहरी फाटक का संकेत मानते हैं।
    reason: textual_variant
  - marker: b
    text: या, “बरामदा।”
    reason: lexical_alternative
  - marker: c
    text: इस अध्याय में ‘फाटक’ केवल किवाड़ों के लिए नहीं, बल्कि पूरे फाटक-परिसर के लिए भी प्रयुक्त हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל
  choice: और ... से
  rationale: माप के इस प्रसंग में यह दूरी के आरंभ-बिंदु को सूचित करता है; ‘से’ स्वाभाविक हिन्दी है और וְ का संबंधसूचक बल ‘और’ से बना रहता है।
- source_word: פְּנֵי
  choice: के सामने
  rationale: स्थापत्य-मापन में यह किसी संरचना के अग्रभाग या सामने वाले तल को दर्शाता है।
- source_word: הַשַּׁעַר
  choice: फाटक
  rationale: इस अध्याय में शब्द केवल किवाड़ों के बजाय पूरी फाटक-संरचना को सूचित कर सकता है; ‘फाटक’ सामान्य हिन्दी में दोनों अर्थ वहन कर सकता है।
- source_word: היאתון
  choice: बाहरी
  rationale: यह रूप कठिन और असामान्य है, पर आसपास के मापों के संदर्भ में बाहरी फाटक का अर्थ सर्वाधिक संगत है; अनिश्चितता पादटिप्पणी में सुरक्षित रखी गई है।
- source_word: לִפְנֵי
  choice: के सामने तक
  rationale: यह मापी गई दूरी का अंतिम बिंदु बताता है और स्थानिक संबंध को स्पष्ट रखता है।
- source_word: אֻלָם
  choice: द्वार-मंडप
  rationale: यह फाटक से जुड़ा बरामदे या प्रवेश-कक्ष जैसा मंडप है; ‘द्वार-मंडप’ आधुनिक पाठक के लिए स्थापत्य अर्थ को स्पष्ट करता है।
- source_word: הַשַּׁעַר הַפְּנִימִי
  choice: भीतरी फाटक
  rationale: यह परिसर के भीतर की ओर स्थित फाटक को दर्शाता है और बाहरी फाटक के साथ स्पष्ट विरोध बनाए रखता है।
- source_word: חֲמִשִּׁים אַמָּה
  choice: पचास हाथ
  rationale: ‘हाथ’ אַמָּה के लिए प्रचलित हिन्दी बाइबलीय माप-शब्द है; आधुनिक पाठक के लिए अनुमानित मान पादटिप्पणी में दिया गया है।
