  register: आधुनिक मानक हिन्दी; स्थापत्य वर्णन के लिए स्पष्ट और गरिमापूर्ण शब्दावली। ‘याजक’ बाइबलीय पद है और ‘सेवा की ज़िम्मेदारी निभाना’ मंदिर-संबंधी नियुक्त दायित्व को स्वाभाविक हिन्दी में व्यक्त करता है।
