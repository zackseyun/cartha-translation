- source_word: אֲשֶׁר פָּנֶיהָ דֶּרֶךְ הַדָּרוֹם
  choice: जिसका सामने का भाग दक्षिण की ओर है
  rationale: פָּנֶיהָ भवन के मुख अथवा सामने वाले भाग का ठोस स्थानिक वर्णन करता है; अनुवाद इस स्थापत्य विवरण को बनाए रखता है।
- source_word: לַכֹּהֲנִים
  choice: उन याजकों के लिए है
  rationale: उपसर्ग ל यहाँ नियत उपयोग या आवंटन दर्शाता है, स्वामित्व आवश्यक रूप से नहीं।
- source_word: שֹׁמְרֵי מִשְׁמֶרֶת
  choice: सेवा की ज़िम्मेदारी निभाते हैं
  rationale: सजातीय क्रिया-भाव मंदिर में सौंपे गए दायित्व के निष्ठापूर्वक निर्वाह को दर्शाता है; केवल पहरा देने का अर्थ बहुत संकीर्ण होगा।
- source_word: הַבָּיִת
  choice: भवन
  rationale: मूल शब्द का सामान्य अर्थ ‘घर/भवन’ है, जबकि इस दर्शन के संदर्भ में उसका अभिप्राय मन्दिर है; मुख्य पाठ में ‘भवन’ मूल रूपक को रखता है और पादटिप्पणी संदर्भ स्पष्ट करती है।
theological_decisions:
- issue: मन्दिर-दर्शन में הַבָּיִת का संदर्भ
  choice: भवन
  alternative: मन्दिर
  rationale: इब्रानी शब्द का शाब्दिक अर्थ बनाए रखते हुए संदर्भगत मन्दिर-अर्थ को पादटिप्पणी में स्पष्ट किया गया है; इससे वास्तविक शाब्दिक विकल्प मिटता नहीं और कोई अतिरिक्त धर्मवैज्ञानिक निष्कर्ष नहीं जोड़ा जाता।
