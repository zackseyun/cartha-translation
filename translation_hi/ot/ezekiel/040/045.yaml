  text: 'Then he spoke to me: “This chamber[a], whose front faces south, is for the priests who keep charge of the temple.”'
translation:
  language: hi
  text: तब उसने मुझसे कहा, “यह कक्ष, जिसका सामने वाला भाग दक्षिण की ओर है, उन याजकों के लिए है जो मंदिर[a] की देखरेख का दायित्व निभाते हैं।”
  philosophy: optimal-equivalence
  footnotes:
