  choice: तब उसने मुझसे कहा
  rationale: वय्यिक्तोल कथानक को आगे बढ़ाता है और प्रत्यक्ष कथन का परिचय देता है; आधुनिक हिन्दी में ‘कहा’ स्वाभाविक है।
- source_word: זֹה הַלִּשְׁכָּה
