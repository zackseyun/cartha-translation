  text: And there were recessed windows toward the guardrooms and toward their side pillars[a], inward, all around the gate; and likewise for the porticos. And windows were all around on the inside[c][b], and on each pillar were palm-tree decorations.
translation:
  language: hi
  text: पहरेदारों की कोठरियों और उनके पार्श्व-स्तंभों की ओर, फाटक के भीतर की तरफ चारों ओर, धँसी हुई खिड़कियाँ[a] थीं। बरामदों[c] में भी ऐसा ही था। भीतर की ओर चारों ओर खिड़कियाँ थीं, और हर स्तंभ[b] पर खजूर के पेड़ की आकृतियाँ बनी थीं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “बंद खिड़कियाँ,” “संकरी खिड़कियाँ,” अथवा “धँसे हुए चौखटों वाली खिड़कियाँ।” इब्रानी विशेषण संभवतः एक खास वास्तु-रूप बताता है, न कि ऐसी खिड़कियाँ जिनसे प्रकाश बिल्कुल न आ सके।
    reason: lexical_alternative
  - marker: b
    text: इन संरचनात्मक अंगों के लिए प्रयुक्त इब्रानी शब्द कठिन वास्तुशब्द हैं; “द्वार-स्तंभ,” “चौखट के खड़े भाग,” या “भित्ति-स्तंभ” भी संभव हैं।
    reason: lexical_alternative
  - marker: c
    text: “बरामदों” के लिए “ड्योढ़ियों” या “प्रवेश-मंडपों” का अनुवाद भी संभव है।
    reason: lexical_alternative
