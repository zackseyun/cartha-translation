    issue: ‘चौखटों’ for אֵילָו
    rationale: A चौखट is ordinarily the doorframe; the Hebrew architectural term here refers more specifically to the gateway’s side-posts/jambs. ‘द्वार-स्तंभों’ better represents the structural reference.
  - severity: low
    issue: ‘ड्योढ़ी’ for אֵילָם
    rationale: Although possible, ‘ड्योढ़ी’ can denote an entrance or gateway generally. ‘प्रवेश-मंडप’ more clearly identifies the vestibule/portico and avoids conflating it with the gate structure.
