  text: And its ascent had seven steps[a], with its vestibule before them; and it had palm-tree ornaments, one on this side and one on that side[b], on its jambs.
translation:
  language: hi
  text: और उसकी चढ़ाई में सात सीढ़ियाँ थीं, और उसका प्रवेश-मंडप[a] उनके सामने था। उसके द्वार-स्तंभों[b] पर खजूर-वृक्ष की नक्काशियाँ थीं—एक इस ओर और एक उस ओर।
  philosophy: optimal-equivalence
  footnotes:
