    text: या ‘ड्योढ़ी’ अथवा ‘बरामदा’।
    reason: lexical_alternative
  - marker: b
    text: या ‘चौखटों’ अथवा ‘बगल के स्तंभों’।
    reason: lexical_alternative
lexical_decisions:
- source_word: מַעֲלוֹת שִׁבְעָה עֲלוֹתוֹ
  choice: उसकी चढ़ाई में सात सीढ़ियाँ थीं
  rationale: यह पदबंध द्वार तक ऊपर जाने वाली सात सीढ़ियों का वर्णन करता है। हिंदी में यह रूप वास्तु-संबंधी अर्थ को स्वाभाविक ढंग से व्यक्त करता है और चढ़ाई तथा सीढ़ियों—दोनों भावों को बनाए रखता है।
- source_word: וְאֵילַמּוֹ
  choice: उसकी ड्योढ़ी
  rationale: मंदिर-दर्शन के इस वास्तु-संदर्भ में אֵילָם प्रवेश-द्वार के आगे के आच्छादित भाग को दर्शाता है। आधुनिक हिंदी में ‘ड्योढ़ी’ संक्षिप्त और सुबोध है; ‘बरामदा’ भी संभव है।
- source_word: לִפְנֵיהֶם
  choice: उनके सामने
  rationale: बहुवचन सर्वनाम को बनाए रखते हुए ड्योढ़ी की स्थिति सीढ़ियों के सामने बताई गई है।
- source_word: וְתִמֹרִים
  choice: खजूर के पेड़ की आकृतियाँ
  rationale: वास्तु-संदर्भ में वास्तविक पेड़ नहीं, बल्कि खजूर के पेड़ के सजावटी अंकन या नक्काशी अभिप्रेत हैं।
- source_word: אֶחָד מִפּוֹ וְאֶחָד מִפּוֹ
  choice: एक इस ओर और एक उस ओर
  rationale: मूल की स्थान-सूचक और सममित अभिव्यक्ति को सीधे और स्वाभाविक हिंदी में रखा गया है।
- source_word: אֵילָו
  choice: उसकी चौखटों
  rationale: यहाँ शब्द द्वार के दोनों पार्श्ववर्ती संरचनात्मक अंगों को सूचित करता है। ‘चौखटों’ से संदर्भ स्पष्ट होता है, जबकि ‘खंभे’ या ‘बगल के स्तंभ’ भी संभव अर्थ हैं।
