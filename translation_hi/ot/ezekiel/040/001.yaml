source:
  edition: WLC
  text: בְּ/עֶשְׂרִ֣ים וְ/חָמֵ֣שׁ שָׁנָ֣ה לְ֠/גָלוּתֵ/נוּ בְּ/רֹ֨אשׁ הַ/שָּׁנָ֜ה בֶּ/עָשׂ֣וֹר לַ/חֹ֗דֶשׁ בְּ/אַרְבַּ֤ע עֶשְׂרֵה֙ שָׁנָ֔ה אַחַ֕ר אֲשֶׁ֥ר הֻכְּתָ֖ה הָ/עִ֑יר בְּ/עֶ֣צֶם הַ/יּ֣וֹם הַ/זֶּ֗ה הָיְתָ֤ה עָלַ/י֙ יַד יְהוָ֔ה וַ/יָּבֵ֥א אֹתִ֖/י שָֽׁמָּ/ה׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/040/001.yaml
  text: In the twenty-fifth year of our exile[a], at the beginning of the year, on the tenth day of the month, in the fourteenth year after the city had been struck down, on that very day the hand of Yahweh was upon me[b], and he brought me there.
translation:
  language: hi
  text: हमारे निर्वासन के पच्चीसवें वर्ष में, वर्ष के आरम्भ में[a], महीने के दसवें दिन—नगर पर प्रहार किए जाने के चौदह वर्ष बाद[b]—ठीक उसी दिन यहोवा का हाथ मुझ पर था, और वह मुझे वहाँ ले गया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से ‘वर्ष के सिर पर’; यह नववर्ष के अवसर का संकेत हो सकता है, पर यह निश्चित नहीं है।
    reason: lexical_alternative
  - marker: b
    text: या ‘नगर के पतन के चौदह वर्ष बाद’ अथवा ‘नगर पर अधिकार किए जाने के चौदह वर्ष बाद।’ इब्रानी अधिक शाब्दिक रूप से कहता है, ‘नगर पर प्रहार किए जाने के बाद।’
    reason: lexical_alternative
lexical_decisions:
- source_word: לְגָלוּתֵנוּ
  choice: हमारे निर्वासन के
  rationale: גָּלוּת सामूहिक देश-निकाले या निर्वासन को दर्शाता है; प्रथम पुरुष बहुवचन प्रत्यय को ‘हमारे’ से स्पष्ट रखा गया है। ‘निर्वासन’ आधुनिक हिन्दी में स्वाभाविक है और केवल कारावास का भाव नहीं देता।
- source_word: בְּרֹאשׁ הַשָּׁנָה
  choice: वर्ष के आरम्भ में
  rationale: शाब्दिक अर्थ ‘वर्ष के सिर पर’ है। मुख्य पाठ में अर्थ को पारदर्शी और स्वाभाविक रखा गया है, बिना इसे निश्चित रूप से किसी विशेष नववर्ष पर्व का नाम दिए।
- source_word: בֶּעָשׂוֹר לַחֹדֶשׁ
  choice: महीने के दसवें दिन
  rationale: यह वाक्यांश महीने की निश्चित तारीख बताता है; स्पष्ट हिन्दी के लिए ‘दिन’ जोड़ा गया है।
- source_word: הֻכְּתָה הָעִיר
  choice: नगर को ध्वस्त कर दिया गया था
  rationale: נכה के होफ़अल रूप में हिंसक निष्क्रिय भाव है, ‘प्रहार किया गया/मार गिराया गया।’ नगर के लिए ‘ध्वस्त कर दिया गया’ स्वाभाविक हिन्दी में उस भाव को रखता है; केवल ‘नगर गिर गया’ कारण और हिंसा को कम स्पष्ट करता।
- source_word: הָעִיר
  choice: नगर
  rationale: मूल पाठ केवल ‘नगर’ कहता है। सन्दर्भ में यरूशलेम अभिप्रेत है, पर उसे मुख्य पाठ में स्पष्ट नाम देकर मूल से अधिक विशिष्ट नहीं किया गया।
- source_word: בְּעֶצֶם הַיּוֹם הַזֶּה
  choice: ठीक उसी दिन
  rationale: עֶצֶם यहाँ तारीख की सटीकता पर बल देता है; ‘ठीक उसी दिन’ इस बल को सहज हिन्दी में व्यक्त करता है।
- source_word: יַד יְהוָה
  choice: यहोवा का हाथ
  rationale: यह यहेजकेल में बार-बार आने वाला भविष्यद्वक्ताई मुहावरा है, जो परमेश्वर की सामर्थ्य या प्रभाव को व्यक्त कर सकता है। धर्मवैज्ञानिक महत्त्व और मूल बिम्ब बनाए रखने के लिए इसे शाब्दिक रूप में रखा गया है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: इब्रानी चतुरक्षरीय दिव्य नाम को सामान्य हिन्दी बाइबलीय रूप ‘यहोवा’ से व्यक्त किया गया है, न कि उपाधि ‘प्रभु’ से।
- source_word: וַיָּבֵא אֹתִי שָׁמָּה
  choice: और वह मुझे वहाँ ले गया
  rationale: שָׁמָּה का सीधा अर्थ ‘वहाँ’ है। कर्ता प्रसंग से यहोवा है; गन्तव्य को मूल पाठ से अधिक स्पष्ट नहीं किया गया।
theological_decisions:
- issue: दिव्य नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: प्रभु
  rationale: पद में वाचा का व्यक्तिगत दिव्य नाम सीधे प्रयुक्त है। हिन्दी पाठ में नाम को नाम के रूप में रखा गया है, उपाधि से प्रतिस्थापित नहीं किया गया।
- issue: ‘यहोवा का हाथ मुझ पर था’ का अर्थ
  choice: मूल बिम्ब को बनाए रखना
  alternative: यहोवा की सामर्थ्य मुझ पर काम कर रही थी
  rationale: मुहावरा दिव्य सामर्थ्य, नियन्त्रण या भविष्यद्वक्ताई प्रेरणा का संकेत दे सकता है। केवल एक व्याख्या चुनने के बजाय मूल की धर्मवैज्ञानिक व्यापकता और तनाव को सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, गरिमापूर्ण किन्तु सामान्य पाठक के लिए सुबोध रखी गई है। लम्बे काल-सूचक वाक्य को स्पष्ट करने के लिए डैश का प्रयोग किया गया है। ‘नगर’ और ‘वहाँ’ को जानबूझकर अनिर्दिष्ट रखा गया है, क्योंकि मूल पद भी इन्हें अधिक स्पष्ट नहीं करता।
