  yaml_path: translation/ot/ezekiel/040/019.yaml
  text: 'Then he measured the width from the front of the lower gate to the front of the inner court outside: one hundred cubits[b][a], to the east and to the north.'
translation:
  language: hi
  text: 'तब उसने बाहरी ओर निचले फाटक[a] के सामने से भीतरी आँगन के सामने तक की चौड़ाई मापी: सौ हाथ—पूर्व और उत्तर, दोनों ओर[b]।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘निचले फाटक-भवन।’ इब्रानी शब्द केवल द्वार ही नहीं, बल्कि फाटक की पूरी संरचना को भी सूचित कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: अर्थात पूर्वी ओर और उत्तरी ओर—दोनों का माप सौ-सौ हाथ था।
    reason: cross_reference
lexical_decisions:
- source_word: וַיָּמָד
  choice: तब उसने…मापी
  rationale: वय्यिक्तोल रूप दर्शन-वर्णन में अगली क्रमिक क्रिया बताता है; ‘तब’ आधुनिक हिन्दी में इस क्रम को स्वाभाविक रूप से व्यक्त करता है।
- source_word: רֹחַב
  choice: चौड़ाई
  rationale: यह संज्ञा मापी गई आड़ी दूरी को सूचित करती है; स्थापत्य-संदर्भ में ‘चौड़ाई’ सहज और स्पष्ट है।
- source_word: מִלִּפְנֵי הַשַּׁעַר הַתַּחְתּוֹנָה
  choice: निचले फाटक के सामने से
  rationale: לִפְנֵי का प्रयोग यहाँ स्थान-सूचक है और माप के आरम्भ-बिंदु को बताता है। ‘निचला’ भीतरी आँगन की अपेक्षा फाटक की स्थिति दर्शाता है।
- source_word: לִפְנֵי הֶחָצֵר הַפְּנִימִי מִחוּץ
  choice: भीतरी आँगन के सामने तक बाहर की ओर
  rationale: यह माप के अंतिम बिंदु और उसके बाहरी ओर लिए जाने, दोनों को व्यक्त करता है। स्रोत में מִחוּץ के संबंध की कुछ स्थानिक संक्षिप्तता बनी हुई है, इसलिए अनावश्यक वास्तु-विवरण नहीं जोड़ा गया।
- source_word: מֵאָה אַמָּה
  choice: सौ हाथ
  rationale: ‘हाथ’ बाइबलीय अम्मा के लिए हिन्दी में प्रचलित पारंपरिक माप-शब्द है और मूल संस्कृति की माप-इकाई को बिना आधुनिक रूपांतरण के बनाए रखता है।
- source_word: הַקָּדִים וְהַצָּפוֹן
  choice: पूर्व और उत्तर, दोनों ओर
  rationale: अंतिम दिशासूचक पद बताते हैं कि यही माप पूर्वी और उत्तरी दोनों ओर लागू था; ‘दोनों ओर’ इस वितरण को स्वाभाविक हिन्दी में स्पष्ट करता है।
