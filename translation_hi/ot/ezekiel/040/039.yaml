  text: וּ/בְ/אֻלָ֣ם הַ/שַּׁ֗עַר שְׁנַ֤יִם שֻׁלְחָנוֹת֙ מִ/פּ֔וֹ וּ/שְׁנַ֥יִם שֻׁלְחָנ֖וֹת מִ/פֹּ֑ה לִ/שְׁח֤וֹט אֲלֵי/הֶם֙ הָ/עוֹלָ֔ה וְ/הַ/חַטָּ֖את וְ/הָ/אָשָֽׁם׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/040/039.yaml
  text: And in the portico of the gate were two tables on this side and two tables on that side[a], on which they slaughtered the burnt offering, the sin offering[b], and the guilt offering.
translation:
  language: hi
  text: फाटक के मंडप में इस ओर दो मेज़ें और उस ओर दो मेज़ें थीं, जिन पर होमबलि, पापबलि[a] और दोषबलि[b] के बलि-पशुओं का वध किया जाता था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘शुद्धिकरण-बलि’; हिब्रू शब्द पाप या अशुद्धता से शुद्ध किए जाने से संबंधित बलि को भी सूचित कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: या ‘क्षतिपूर्ति-बलि’।
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְאֻלָם הַשַּׁעַר
  choice: फाटक के द्वारमण्डप में
  rationale: אֻלָם फाटक की संरचना के सामने या भीतर बने मंडप/बरामदे को सूचित करता है। ‘द्वारमण्डप’ स्थापत्य-संदर्भ को संक्षिप्त, गरिमापूर्ण और स्पष्ट रूप से व्यक्त करता है।
- source_word: שְׁנַיִם שֻׁלְחָנוֹת מִפּוֹ וּשְׁנַיִם שֻׁלְחָנוֹת מִפֹּה
  choice: इस ओर दो मेज़ें और उस ओर दो मेज़ें
  rationale: מִפּוֹ ... מִפֹּה यहाँ आमने-सामने अथवा अलग-अलग ओर की स्थानिक व्यवस्था बताता है। हिंदी में ‘इस ओर ... उस ओर’ स्वाभाविक रहते हुए दोनों ओर की समान व्यवस्था बनाए रखता है।
- source_word: לִשְׁחֹט אֲלֵיהֶם
  choice: उन पर ... के पशुओं का वध किया जाता था
  rationale: שׁחט बलिदान के पशु के विधिवत वध का मानक क्रियापद है और אֲלֵיהֶם मेज़ों पर किए जाने वाले कार्य को बताता है। हिंदी में ‘के पशुओं’ का प्रयोग यह स्पष्ट करता है कि बलियों के लिए पशुओं का वध होता था; यह प्रसंग में निहित अर्थ है।
- source_word: הָעוֹלָה
  choice: होमबलि
  rationale: यह עוֹלָה के लिए प्रचलित और संक्षिप्त हिंदी धार्मिक शब्द है तथा पूरी तरह चढ़ाई जाने वाली अग्नि-बलि की श्रेणी को सूचित करता है।
- source_word: הַחַטָּאת
  choice: पापबलि
  rationale: חַטָּאת बलिदानी संदर्भ में पाप से संबंधित बलि को दर्शाता है। ‘पापबलि’ हिंदी पाठकों के लिए परिचित है; शुद्धिकरण संबंधी अर्थछाया पादटिप्पणी में रखी गई है।
- source_word: הָאָשָׁם
  choice: दोषबलि
  rationale: אָשָׁם बलिदानी संदर्भ में दोष अथवा दायित्व से जुड़ी बलि है। ‘दोषबलि’ मान्य और समझने योग्य रूप है; क्षतिपूर्ति की अर्थछाया पादटिप्पणी में दी गई है।
theological_decisions:
- issue: बलिदानी शब्दावली का अनुवाद बिना बाद की धर्मसैद्धांतिक व्याख्या जोड़े करना
  choice: होमबलि, पापबलि और दोषबलि
  alternative: होमबलि, शुद्धिकरण-बलि और क्षतिपूर्ति-बलि
  rationale: मुख्य पाठ हिब्रू बलिदानी श्रेणियों के परिचित हिंदी नाम रखता है। חַטָּאת में शुद्धिकरण और אָשָׁם में क्षतिपूर्ति की वास्तविक अर्थछायाएँ हो सकती हैं; उन्हें मुख्य पाठ में निर्णायक रूप से थोपने के बजाय पादटिप्पणियों में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण किंतु सुबोध शैली अपनाई गई है। ‘द्वारमण्डप’ मंदिर-स्थापत्य को स्पष्ट रखता है, जबकि वाक्य-विन्यास सामान्य पाठक के लिए सरल रखा गया है। सभी पादटिप्पणी-चिह्न संबंधित बलि-शब्दों के तुरंत बाद रखे गए हैं।
