  yaml_path: translation/ot/ezekiel/040/012.yaml
  text: And there was a barrier of one cubit in front of the side rooms[a], and a barrier of one cubit on the other side[b]; and each side room was six cubits on this side and six cubits on that side.
translation:
  language: hi
  text: और पार्श्व-कक्षों[a] के सामने एक हाथ चौड़ी सीमा थी, और दूसरी ओर भी सीमा एक हाथ चौड़ी थी[b]। प्रत्येक पार्श्व-कक्ष इस ओर छह हाथ और उस ओर छह हाथ का था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “पार्श्व-कक्षों” के लिए “पहरे के कक्ष,” “कोठरियाँ” या “आले” भी सम्भव हैं। इब्रानी תָּאוֹת फाटक की संरचना में बने छोटे कक्षों को दर्शाता है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में संकेतवाचक अभिव्यक्तियाँ दोहराई गई हैं—शाब्दिक रूप से “यहाँ से” और “वहाँ से”—जो विपरीत ओरों के माप को सूचित करती हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: גְבוּל
  choice: सीमा
  rationale: इस स्थापत्य-संदर्भ में यह शब्द कक्षों के सामने की एक हाथ चौड़ी सीमांकित पट्टी या विभाजक भाग को सूचित करता है। ‘सीमा’ मूल शब्द की व्यापकता बनाए रखता है और अनिश्चित रूप से कोई दीवार या अवरोध नहीं जोड़ता।
- source_word: לִפְנֵי
  choice: के सामने
  rationale: मन्दिर-दर्शन के स्थानिक और स्थापत्य संदर्भ में इसका स्वाभाविक अर्थ ‘के सामने’ है।
- source_word: הַתָּאוֹת / וְהַתָּא
  choice: पार्श्व-कक्षों / प्रत्येक पार्श्व-कक्ष
  rationale: תָּא gate structure के छोटे कक्ष को दर्शाता है। ‘पार्श्व-कक्ष’ उसके स्थान को स्पष्ट करता है, पर उसे निश्चित रूप से पहरेदारों का कमरा नहीं ठहराता। बाद का एकवचन संदर्भ में वितरणात्मक है, इसलिए ‘प्रत्येक’ उपयुक्त है।
- source_word: אַמָּה
  choice: हाथ
  rationale: ‘हाथ’ आधुनिक हिन्दी बाइबल-पाठकों के लिए प्राचीन cubit का परिचित पारंपरिक माप है और मूल की प्राचीन माप-इकाई को बिना आधुनिक रूपांतरण के सुरक्षित रखता है।
- source_word: מִפֹּה ... מִפּוֹ
  choice: दूसरी ओर ... इस ओर ... उस ओर
  rationale: बार-बार आए संकेतवाचक पद विपरीत ओरों को बताते हैं। हिन्दी में यह रूप स्थानिक विरोध को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: שֵׁשׁ אַמּוֹת
  choice: छह हाथ
  rationale: मूल माप को सीधे और पुनरावृत्त माप-शैली सहित प्रस्तुत किया गया है।
