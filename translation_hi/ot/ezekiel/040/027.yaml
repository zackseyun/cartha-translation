  yaml_path: translation/ot/ezekiel/040/027.yaml
  text: 'And there was a gate to the inner court toward the south[a], and he measured from gate to gate toward the south: one hundred cubits.'
translation:
  language: hi
  text: और भीतरी आँगन का एक फाटक दक्षिण की ओर था[a]। तब उसने दक्षिण की ओर एक फाटक से दूसरे फाटक तक नापा—एक सौ हाथ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “भीतरी आँगन का एक फाटक दक्षिणी ओर था।” इब्रानी में शाब्दिक रूप से “दक्षिण के मार्ग/दिशा से” है।
    reason: דֶּרֶךְ הַדָּרוֹם फाटक की दिशा अथवा दक्षिणी ओर उसकी स्थिति—दोनों भाव दे सकता है; टिप्पणी इस स्थान-संबंधी अस्पष्टता को सुरक्षित रखती है।
lexical_decisions:
- source_word: וְשַׁעַר
  choice: और ... एक फाटक ... था
  rationale: इब्रानी उपवाक्य में क्रिया नहीं है; स्वाभाविक हिन्दी के लिए ‘था’ जोड़ा गया है। שַׁעַר का इस स्थापत्य-वर्णन में सीधा अर्थ ‘फाटक’ है।
- source_word: לֶחָצֵר הַפְּנִימִי
  choice: भीतरी आँगन का
  rationale: लामेद यहाँ संबंध या पहुँच को सूचित करता है। ‘भीतरी आँगन का’ सहज हिन्दी में उस फाटक का भीतरी आँगन से स्थापत्य-संबंध व्यक्त करता है।
- source_word: דֶּרֶךְ הַדָּרוֹם
  choice: दक्षिण की ओर
  rationale: דֶּרֶךְ का मूल भाव मार्ग या दिशा है; इस प्रसंग में यह फाटक की दक्षिणी स्थिति/दिशा बताता है। ‘दक्षिण की ओर’ उस दिशात्मक भाव को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: וַיָּמָד
  choice: तब उसने ... नापा
  rationale: वाव-क्रमिक कथा को आगे बढ़ाता है। कर्ता पूर्व प्रसंग का मापने वाला पुरुष है; ‘तब’ क्रम को और ‘उसने’ निहित कर्ता को स्पष्ट करता है।
- source_word: מִשַּׁעַר אֶל הַשַּׁעַר
  choice: एक फाटक से दूसरे फाटक तक
  rationale: यह दो अनुरूप फाटकों के बीच की माप है। हिन्दी में यह रूप ‘फाटक से फाटक तक’ की अपेक्षा अधिक स्पष्ट और स्वाभाविक है।
- source_word: דֶּרֶךְ הַדָּרוֹם
  choice: दक्षिण की ओर
  rationale: दूसरी बार यह पद माप की दक्षिणी दिशा या दक्षिणी ओर की स्थिति बताता है; स्रोत की संक्षिप्तता और संभावित दिशात्मकता सुरक्षित रखी गई है।
- source_word: מֵאָה אַמּוֹת
  choice: एक सौ हाथ
  rationale: אַמָּה प्राचीन लंबाई की इकाई ‘हाथ’ है। परिचित बाइबलीय हिन्दी पदावली रखते हुए आधुनिक इकाई में अनुमानित रूपांतरण नहीं किया गया।
