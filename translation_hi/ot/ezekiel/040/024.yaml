- source_word: אֵילוֹ
  choice: उसके पार्श्व-स्तंभों
  rationale: मंदिर-वास्तु के संदर्भ में यह शब्द फाटक के किनारों की सहायक खड़ी संरचनाओं को दर्शाता है; तकनीकी विकल्प पादटिप्पणी में दिया गया है।
- source_word: וְאֵילַמּוֹ
