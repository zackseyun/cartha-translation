- source_word: כַּמִּדּוֹת הָאֵלֶּה
  choice: इन्हीं नापों के अनुसार
  rationale: पहले वर्णित मापों के साथ समानता व्यक्त करता है और तुलनात्मक अर्थ को बनाए रखता है।
