  yaml_path: translation/ot/ezekiel/040/040.yaml
  text: And on the outer side[a], by the ascent to the entrance of the north gate, were two tables; and on the other side, which belonged to the porch of the gate[c][b], were two tables.
translation:
  language: hi
  text: और बाहर की ओर, उत्तरी फाटक के प्रवेश तक जाने वाली चढ़ाई के पास, एक तरफ़[a] दो मेज़ें थीं; और दूसरी तरफ़, जो फाटक के बरामदे के पास थी,[b] दो मेज़ें थीं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: मूल इब्रानी में शाब्दिक रूप से ‘कंधा’; स्थापत्य-वर्णन में इसका अर्थ ‘तरफ़’ या ‘पार्श्व’ हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या ‘जो फाटक के बरामदे से संबंधित थी’; इब्रानी में बरामदे के साथ संबंध व्यक्त है, पर उसका ठीक स्वरूप निश्चित नहीं है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּתֵף
  choice: तरफ़
  rationale: शाब्दिक अर्थ ‘कंधा’ है, पर स्थापत्य-वर्णन में यह किसी संरचना के पार्श्व या बगल को सूचित करता है। आधुनिक हिन्दी में ‘तरफ़’ स्वाभाविक और स्पष्ट है; शाब्दिक बिंब को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: מִחוּצָה
  choice: बाहर की ओर
  rationale: यह बाहरी स्थान या दिशा को दर्शाता है। ‘बाहर की ओर’ प्रसंग के स्थानिक अर्थ को सहज हिन्दी में व्यक्त करता है।
- source_word: לָעוֹלֶה
  choice: चढ़ाई के पास
  rationale: עלה से बना यह रूप ऊपर जाने की क्रिया, व्यक्ति, अथवा उस स्थान को सूचित कर सकता है जहाँ से ऊपर जाया जाता है। मंदिर के स्थापत्य-प्रसंग में ‘चढ़ाई’ उपयुक्त स्थानिक अर्थ देता है।
- source_word: פֶּתַח
  choice: प्रवेश-द्वार
  rationale: फाटक की वास्तु-रचना में खुलने या प्रवेश के स्थान को स्पष्ट करने के लिए ‘प्रवेश-द्वार’ चुना गया है।
- source_word: שַׁעַר הַצָּפוֹנָה
  choice: उत्तरी फाटक
  rationale: दिशासूचक अभिव्यक्ति का आधुनिक हिन्दी में स्वाभाविक स्थापत्य रूप ‘उत्तरी फाटक’ है।
- source_word: שְׁנַיִם שֻׁלְחָנוֹת
  choice: दो मेज़ें
  rationale: संख्या और वस्तु का सीधा तथा प्रसंगानुकूल अनुवाद।
- source_word: אֻלָם
  choice: बरामदा
  rationale: मंदिर के फाटक से जुड़े आच्छादित अग्रभाग या मंडप के लिए ‘बरामदा’ सामान्य पाठक को समझ आने वाला स्थापत्य शब्द है; ‘ड्योढ़ी’ या ‘प्रवेश-मंडप’ भी संभव हैं।
- source_word: אֲשֶׁר לְאֻלָם הַשַּׁעַר
  choice: जो फाटक के बरामदे से लगी थी
  rationale: לְ यहाँ बरामदे के साथ स्थानिक संबंध या संबद्धता दिखाता है। ‘से लगी थी’ इस संबंध को स्वाभाविक हिन्दी में रखता है, बिना उसे अत्यधिक निश्चित किए।
