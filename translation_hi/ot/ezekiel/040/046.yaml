source:
  edition: WLC
  text: וְ/הַ/לִּשְׁכָּ֗ה אֲשֶׁ֤ר פָּנֶ֨י/הָ֙ דֶּ֣רֶךְ הַ/צָּפ֔וֹן לַ/כֹּ֣הֲנִ֔ים שֹׁמְרֵ֖י מִשְׁמֶ֣רֶת הַ/מִּזְבֵּ֑חַ הֵ֣מָּה בְנֵֽי צָד֗וֹק הַ/קְּרֵבִ֧ים מִ/בְּנֵֽי לֵוִ֛י אֶל יְהוָ֖ה לְ/שָׁרְתֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/040/046.yaml
  text: And the chamber whose front faces north is for the priests who keep charge of the altar. They are the sons of Zadok[a], who from among the sons of Levi come near to Yahweh to minister to him.
translation:
  language: hi
  text: और वह कक्ष, जिसका सामने का भाग उत्तर की ओर है, उन याजकों के लिए है जो वेदी की देखरेख का दायित्व सँभालते हैं। वे सादोक के वंशज हैं, जो लेवी के वंशजों में से यहोवा की सेवा करने के लिए उसके निकट आते हैं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לִּשְׁכָּה
  choice: कक्ष
  rationale: मन्दिर-परिसर के भीतर निर्धारित कमरे के लिए ‘कक्ष’ स्वाभाविक, गरिमापूर्ण और स्थापत्य-संदर्भ के अनुकूल है।
- source_word: פָּנֶיהָ דֶּרֶךְ הַצָּפוֹן
  choice: जिसका सामने का भाग उत्तर की ओर है
  rationale: यह संरचना के मुख या अग्रभाग की दिशा बताता है; हिन्दी में यह रूप स्थापत्य अर्थ को स्पष्ट रखता है।
- source_word: לַכֹּהֲנִים
  choice: उन याजकों के लिए है
  rationale: उपसर्ग ל यहाँ नियोजन या प्रयोजन दर्शाता है; हिन्दी में ‘के लिए है’ आवश्यक और स्वाभाविक पूर्ति है।
- source_word: שֹׁמְרֵי מִשְׁמֶרֶת הַמִּזְבֵּחַ
  choice: जो वेदी की सेवा की ज़िम्मेदारी निभाते हैं
  rationale: שמר משמרת का अर्थ सौंपे गए दायित्व को निभाना है। यह अनुवाद केवल भौतिक पहरे का संकेत देने से बचते हुए वेदी-संबंधी पवित्र सेवा की ज़िम्मेदारी व्यक्त करता है।
- source_word: בְנֵי צָדוֹק
  choice: सादोक के वंशज
  rationale: בני वंशगत समूह को सूचित करता है। आधुनिक हिन्दी में ‘वंशज’ जैविक पुत्रों तक अर्थ को सीमित किए बिना आशय स्पष्ट करता है।
- source_word: הַקְּרֵבִים
  choice: निकट ... आते हैं
  rationale: קרב याजकीय संदर्भ में परमेश्वर के निकट पवित्र सेवा के लिए आने का तकनीकी भाव रखता है; इसे सामान्य ‘पास आते हैं’ से अधिक धार्मिक संदर्भ सहित रखा गया है।
- source_word: מִבְּנֵי לֵוִי
  choice: लेवी के वंशजों में से
  rationale: 'מִן का अंशसूचक बल सुरक्षित है: सादोक का वंश व्यापक लेवी-वंश के भीतर का एक समूह है।'
- source_word: יְהוָה
  choice: यहोवा
  rationale: इब्रानी व्यक्तिगत नाम יהוה को हिन्दी में प्रचलित लिप्यंतरण ‘यहोवा’ से प्रस्तुत किया गया है, न कि किसी उपाधि से प्रतिस्थापित किया गया है।
- source_word: לְשָׁרְתוֹ
  choice: उसकी सेवा करने
  rationale: שרת याजकीय और पवित्र सेवा को दर्शाता है। ‘सेवा करने’ सामान्य पाठक के लिए सहज है और प्रसंग से इसका धार्मिक आशय स्पष्ट रहता है।
theological_decisions:
- issue: लेवी-वंश के भीतर सादोक के वंश की विशिष्ट याजकीय भूमिका
  choice: पद सादोक के वंशजों को लेवी के वंशजों में से वह समूह बताता है जो यहोवा के निकट सेवा करने आता है।
  alternative: इसे बिना किसी भेद के सभी लेवियों पर लागू समझना।
  rationale: इब्रानी पाठ ‘सादोक के वंशज’ और ‘लेवी के वंशजों में से’ कहकर व्यापक लेवी समूह के भीतर एक विशिष्ट वंश को चिह्नित करता है; अनुवाद इससे आगे कोई बाद की धर्मवैज्ञानिक व्यवस्था नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण और मन्दिर-दर्शन के स्थापत्य तथा याजकीय संदर्भ के अनुरूप भाषा रखी गई है। ‘याजक’, ‘वेदी’ और ‘यहोवा’ जैसे स्थापित बाइबलीय पद बनाए गए हैं; वाक्य को अनावश्यक रूप से संस्कृतनिष्ठ नहीं बनाया गया।
