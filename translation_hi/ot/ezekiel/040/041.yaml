    text: शाब्दिक रूप से “फाटक के कंधे पर”; वास्तु-संदर्भ में इसका अर्थ फाटक का किनारा या पार्श्व है।
    reason: cultural_note
  - marker: c
    text: या “वध किया जाएगा”; हिब्रू अपूर्ण क्रिया भावी कार्य या मेज़ों के निर्धारित अथवा प्रचलित उपयोग को व्यक्त कर सकती है।
