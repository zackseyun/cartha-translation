  text: चार मेज़ें इस ओर और चार मेज़ें उस ओर[a], फाटक के पार्श्व में[b]—कुल आठ मेज़ें; उन पर वध किया जाता था[c]।
  philosophy: optimal-equivalence
  footnotes:
