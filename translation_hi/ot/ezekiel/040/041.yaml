  choice: वध किया जाता था
  alternative: वध किया जाएगा / वे वध करते थे
  rationale: दर्शन के वर्णन में अपूर्ण रूप भावी कार्य अथवा निर्धारित/प्रचलित उपयोग बता सकता है। मुख्य पाठ में प्रचलित उपयोग लिया गया है और अन्य संभावना पादटिप्पणी में सुरक्षित रखी गई है।
