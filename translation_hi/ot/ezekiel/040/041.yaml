  rationale: सर्वनाम का संदर्भ मेज़ों से है और वध-क्रिया का स्थान उनकी सतह को बताता है।
- source_word: יִשְׁחָטוּ
  choice: पशुओं का वध किया जाता था
  rationale: हिब्रू अपूर्ण क्रिया यहाँ इन मेज़ों के निर्धारित या प्रचलित उपयोग को व्यक्त कर सकती है। हिन्दी का कर्मवाच्य अनिर्दिष्ट कर्ता को बनाए रखता है; ‘पशुओं’ को क्रिया ‘वध’ में निहित अर्थ स्पष्ट करने के लिए जोड़ा गया है।
theological_decisions:
