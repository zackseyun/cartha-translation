  text: בְּ/מַרְא֣וֹת אֱלֹהִ֔ים הֱבִיאַ֖/נִי אֶל אֶ֣רֶץ יִשְׂרָאֵ֑ל וַ/יְנִיחֵ֗/נִי אֶל הַ֤ר גָּבֹ֨הַּ֙ מְאֹ֔ד וְ/עָלָ֥י/ו כְּ/מִבְנֵה עִ֖יר מִ/נֶּֽגֶב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/040/002.yaml
  text: In visions of God he brought me into the land of Israel and set me down on a very high mountain[a]; on it, to the south[b], was something like the structure of a city.
translation:
  language: hi
  text: परमेश्वर के दर्शनों द्वारा वह मुझे इस्राएल देश में ले आया और उसने मुझे एक बहुत ऊँचे पर्वत पर रख दिया; उस पर, दक्षिण की ओर,[a] नगर की संरचना जैसा कुछ था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘दक्षिण में’ अथवा ‘दक्षिण की तरफ़’; इब्रानी पद दक्षिणी दिशा, अभिमुखता या स्थान का संकेत दे सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּמַרְאוֹת אֱלֹהִים
  choice: परमेश्वर के दर्शनों में
  rationale: यह रूप इब्रानी पदबंध की रचना को बनाए रखते हुए दर्शनों के परमेश्वर-संबंधी अथवा दैवी होने का भाव व्यक्त करता है; इसे केवल स्वामित्व के अर्थ में सीमित नहीं करता।
- source_word: הֱבִיאַנִי
  choice: वह मुझे ... ले आया
  rationale: בוא के हिफ़ील रूप का स्वाभाविक अर्थ ‘ले आना’ है। कर्ता इब्रानी में निहित है, इसलिए ‘वह’ रखा गया है, ‘परमेश्वर’ स्पष्ट रूप से नहीं जोड़ा गया।
- source_word: אֶל אֶרֶץ יִשְׂרָאֵל
  choice: इस्राएल देश में
  rationale: गति और गंतव्य दोनों को आधुनिक हिन्दी में स्वाभाविक ढंग से व्यक्त करता है।
- source_word: וַיְנִיחֵנִי
  choice: और उसने मुझे ... उतारा
  rationale: इस दर्शनात्मक स्थानांतरण के प्रसंग में हिफ़ील का अर्थ किसी स्थान पर रख देना या उतार देना है; ‘विश्राम दिया’ यहाँ भ्रामक होता।
- source_word: אֶל הַר גָּבֹהַּ מְאֹד
  choice: एक बहुत ऊँचे पहाड़ पर
  rationale: स्थान पर रखे जाने के भाव के साथ हिन्दी में ‘पहाड़ पर’ स्वाभाविक है; अत्यधिक ऊँचाई का भाव स्पष्ट रखा गया है।
- source_word: וְעָלָיו
  choice: उस पर
  rationale: सर्वनाम का निकटतम संदर्भ पहाड़ है; हिन्दी में यही संक्षिप्त और स्पष्ट रूप है।
- source_word: כְּמִבְנֵה עִיר
  choice: नगर की संरचना जैसा कुछ
  rationale: מִבְנֶה संरचना या निर्माण-विन्यास का संकेत देता है, केवल नगर का नहीं; כְּ की तुलनात्मक और सावधान दर्शनात्मक भाषा ‘जैसा कुछ’ से सुरक्षित रहती है।
- source_word: מִנֶּגֶב
  choice: दक्षिण की ओर
  rationale: यह दिशा या दक्षिणी अभिमुखता व्यक्त कर सकता है। ‘दक्षिण की ओर’ स्रोत-दिशा और निश्चित दक्षिणी स्थान के बीच की अस्पष्टता को अपेक्षाकृत सुरक्षित रखता है।
theological_decisions:
- issue: दर्शन में स्थानांतरण करने वाली क्रियाओं का निहित कर्ता
  choice: कर्ता को ‘वह’ कहना
  alternative: ‘परमेश्वर मुझे ले आया ...’
  rationale: इब्रानी में कर्ता तीसरे पुरुष एकवचन क्रियारूप में निहित है, पर इस पद में उसका नाम स्पष्ट नहीं है। ‘वह’ मूल की संक्षिप्तता बनाए रखता है, जबकि आरंभिक पदबंध कार्य को दैवी संदर्भ देता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज शैली अपनाई गई है। ‘दर्शन’, ‘संरचना’ और ‘दक्षिण की ओर’ मूल की दर्शनात्मक सावधानी तथा दिशासूचक अस्पष्टता बनाए रखते हैं।
