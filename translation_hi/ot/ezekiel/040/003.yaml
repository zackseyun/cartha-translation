source:
  edition: WLC
  text: וַ/יָּבֵ֨יא אוֹתִ֜/י שָׁ֗מָּ/ה וְ/הִנֵּה אִישׁ֙ מַרְאֵ֨/הוּ֙ כְּ/מַרְאֵ֣ה נְחֹ֔שֶׁת וּ/פְתִיל פִּשְׁתִּ֥ים בְּ/יָד֖/וֹ וּ/קְנֵ֣ה הַ/מִּדָּ֑ה וְ/ה֥וּא עֹמֵ֖ד בַּ/שָּֽׁעַר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/040/003.yaml
  text: He brought me there[a], and behold, there was a man whose appearance was like the appearance of bronze, with a linen cord in his hand and a measuring reed[c][b]; and he was standing in the gateway.
translation:
  language: hi
  text: वह मुझे वहाँ ले आया। और देखो, वहाँ एक पुरुष था, जिसका रूप काँसे के रूप जैसा था[a]। उसके हाथ में सन की डोरी[b] और मापने का सरकंडा था; और वह फाटक पर[c] खड़ा था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘काँसे’ का अनुवाद ‘ताँबे’ के रूप में भी किया जा सकता है। इब्रानी में शाब्दिक रूप से ‘उसका रूप काँसे के रूप जैसा था’ है।
    reason: lexical_alternative
  - marker: b
    text: या, ‘सन की रस्सी’ अथवा ‘सन की मापने की डोरी’।
    reason: lexical_alternative
  - marker: c
    text: या, ‘फाटक के प्रवेश-मार्ग में’। इब्रानी शब्द फाटक के साथ-साथ पूरे फाटक-भवन या प्रवेश-क्षेत्र को भी सूचित कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֵא אֹתִי שָׁמָּה
  choice: वह मुझे वहाँ ले आया
  rationale: यह क्रिया कथा को आगे बढ़ाती है और पहले से उल्लिखित मार्गदर्शक को कर्ता बनाए रखती है। ‘वहाँ ले आया’ गंतव्य की ओर गति को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וְהִנֵּה
  choice: और देखो
  rationale: यह दर्शन में अचानक सामने आए दृश्य की ओर ध्यान खींचने वाला सूचक है। ‘और देखो’ भविष्यद्वक्ताओं की गरिमामय शैली और दृश्य की सजीवता दोनों बनाए रखता है।
- source_word: אִישׁ
  choice: एक पुरुष
  rationale: मूल शब्द साधारण पुल्लिंग संज्ञा ‘पुरुष/मनुष्य’ है। ‘पुरुष’ आकृति के पुरुष होने को स्पष्ट रखता है, पर उसे स्वर्गदूत या ईश्वरीय स्वरूप के रूप में नहीं पहचानता।
- source_word: מַרְאֵהוּ כְּמַרְאֵה נְחֹשֶׁת
  choice: जिसका रूप काँसे के रूप जैसा था
  rationale: मूल इब्रानी में ‘रूप’ का विचार दोहराया गया है; हिन्दी में कुछ औपचारिक लगने पर भी यह अभिव्यक्ति उस जोर को बनाए रखती है। נְחֹשֶׁת काँसा या ताँबा सूचित कर सकता है; दर्शनीय धात्विक चमक के संदर्भ में ‘काँसा’ उपयुक्त है।
- source_word: פְּתִיל פִּשְׁתִּים
  choice: सन की डोरी
  rationale: यह सन से बनी डोरी है, संभवतः मापने के लिए। ‘सन की डोरी’ सामग्री और वस्तु दोनों को स्पष्ट तथा स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: בְּיָדוֹ
  choice: उसके हाथ में
  rationale: मूल पाठ में ‘हाथ’ एकवचन है, जिसे हिन्दी में भी बनाए रखा गया है।
- source_word: קְנֵה הַמִּדָּה
  choice: मापने का सरकंडा
  rationale: קָנֶה मूलतः सरकंडा है, जिसे यहाँ मापने के उपकरण के रूप में प्रयोग किया गया है। अनुवाद वस्तु की प्रकृति और उसके कार्य दोनों को बनाए रखता है।
- source_word: וְהוּא עֹמֵד
  choice: और वह ... खड़ा था
  rationale: इब्रानी कृदंत दृश्य में जारी अवस्था को दर्शाता है; ‘खड़ा था’ उसी वर्णनात्मक पक्ष को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: בַּשָּׁעַר
  choice: फाटक पर
  rationale: हिन्दी में किसी फाटक के स्थान पर खड़े होने के लिए ‘फाटक पर’ स्वाभाविक है। इब्रानी शब्द पूरे फाटक-भवन या प्रवेश-क्षेत्र को भी सूचित कर सकता है, इसलिए विकल्प पादटिप्पणी में दिया गया है।
theological_decisions:
- issue: दर्शन में दिखाई देने वाले ‘पुरुष’ की पहचान
  choice: केवल ‘एक पुरुष’ कहा गया है
  alternative: स्वर्गदूत या ईश्वरीय/ईश्वर-दर्शी स्वरूप के रूप में स्पष्ट पहचान
  rationale: इब्रानी पद स्वयं केवल ‘एक पुरुष’ कहता है और उसके रूप तथा मापने के उपकरणों का वर्णन करता है। अधिक विशिष्ट पहचान जोड़ने से मूल पाठ की खुली हुई धार्मिक व्याख्या अनावश्यक रूप से सीमित हो जाएगी।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में गरिमामय और दृश्यात्मक रखी गई है। ‘और देखो’ भविष्यद्वक्ताओं की शैली को बनाए रखता है। मूल की ‘रूप’ संबंधी पुनरुक्ति जानबूझकर रखी गई है, जबकि वास्तु-संबंधी अस्पष्टता को पादटिप्पणी में सुरक्षित किया गया है।
