  text: And each guardroom was one reed long and one reed wide[a], and between the guardrooms was five cubits[c][b]. And the threshold of the gate beside the portico of the gate on the inside was one reed.
translation:
  language: hi
  text: और हर पहरेदार-कक्ष एक सरकंडा लंबा और एक सरकंडा चौड़ा था[a]। पहरेदार-कक्षों के बीच पाँच हाथ का अंतर था। और फाटक की देहरी, फाटक की ड्योढ़ी के पास, भीतरी ओर, एक सरकंडे की थी[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘पहरेदार-कक्ष’ के लिए ‘बगल का कमरा’ या ‘कक्ष’ भी सम्भव है। इब्रानी תָּא यहेजकेल के मंदिर-दर्शन का एक स्थापत्य शब्द है।
    reason: lexical_alternative
  - marker: b
    text: ‘ड्योढ़ी’ के लिए ‘बरामदा’ या ‘प्रवेश-कक्ष’ भी सम्भव है (इब्रानी אוּלָם)। ‘भीतरी ओर’ का इब्रानी पाठ शाब्दिक रूप से ‘घर की ओर से’ है; सम्भवतः इसका आशय फाटक की संरचना के भीतरी पक्ष से है।
    reason: textual_or_semantic_ambiguity
lexical_decisions:
- source_word: הַתָּא
  choice: पहरेदार-कक्ष
  rationale: फाटक की संरचना में बने छोटे कक्षों के लिए यह सहज और प्रसंगानुकूल शब्द है; मूल स्थापत्य पद का कार्य पूर्णतः निश्चित न होने के कारण विकल्प पादटिप्पणी में दिए गए हैं।
- source_word: קָנֶה אֶחָד
  choice: एक सरकंडा
  rationale: यहाँ קָנֶה पिछले प्रसंग में निर्धारित माप की इकाई है। ‘एक सरकंडा’ मूल दृश्य की मापन-शब्दावली बनाए रखता है।
- source_word: אֹרֶךְ / רֹחַב
  choice: लंबा / चौड़ा
  rationale: दोनों आयामों को आधुनिक हिन्दी में स्वाभाविक और समानांतर ढंग से व्यक्त किया गया है।
- source_word: חָמֵשׁ אַמּוֹת
  choice: पाँच हाथ का अंतर
  rationale: אַמָּה प्राचीन लंबाई की इकाई ‘हाथ’ है; ‘अंतर’ हिन्दी में अपूर्ण नाममात्र वाक्य को स्पष्ट करता है और בין से निहित दूरी को व्यक्त करता है।
- source_word: סַף
  choice: देहरी
  rationale: प्रवेश-द्वार के निचले पारगमन भाग के लिए ‘देहरी’ सटीक और सामान्य हिन्दी शब्द है।
- source_word: אוּלָם הַשַּׁעַר
  choice: फाटक की ड्योढ़ी
  rationale: אוּלָם यहाँ फाटक से जुड़ा बरामदा अथवा प्रवेश-कक्ष है; ‘ड्योढ़ी’ स्थापत्य प्रसंग में संक्षिप्त और बोधगम्य है।
- source_word: מֵהַבַּיִת
  choice: भीतर की ओर स्थित
  rationale: शाब्दिक रूप ‘घर की ओर से/घर की तरफ’ है, पर मंदिर-दर्शन के स्थापत्य प्रसंग में यह फाटक के भीतरी पक्ष का संकेत देता प्रतीत होता है। अनिश्चितता पादटिप्पणी में सुरक्षित रखी गई है।
