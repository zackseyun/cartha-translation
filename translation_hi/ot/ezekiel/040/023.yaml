lexical_decisions:
- source_word: שַׁעַר
  choice: फाटक
  rationale: मन्दिर-परिसर की वास्तुकला के सन्दर्भ में यह शब्द प्रवेश-द्वार या फाटक को दर्शाता है; ‘फाटक’ स्वाभाविक और पर्याप्त रूप से सटीक है।
- source_word: חָצֵר הַפְּנִימִי
  choice: भीतरी आँगन
  rationale: यह मन्दिर-परिसर के भीतर घिरे हुए प्रांगण को दर्शाता है; ‘भीतरी आँगन’ आधुनिक हिन्दी में स्पष्ट और सहज है।
- source_word: נֶגֶד
  choice: के सामने
  rationale: यह स्थानगत सम्बन्ध बताता है—एक फाटक दूसरे के सम्मुख है। ‘के सामने’ मूल की स्थानगत अभिव्यक्ति को बिना अनावश्यक व्याख्या के बनाए रखता है।
- source_word: לַצָּפוֹן וְלַקָּדִים
  choice: उत्तर और पूर्व की ओर
  rationale: ये दिशासूचक पद सम्बन्धित फाटक की दिशा या स्थिति बताते हैं। यह अनुवाद मूल की संक्षिप्तता और हल्की संरचनात्मक अस्पष्टता को बनाए रखता है।
- source_word: וַיָּמָד
  choice: और उसने … मापा
  rationale: क्रिया मापने की क्रमिक क्रिया बताती है; कर्ता दर्शन के प्रसंग में मापने वाला पुरुष है।
- source_word: מִשַּׁעַר אֶל שַׁעַר
  choice: फाटक से फाटक तक
  rationale: यह दोनों फाटकों के बीच मापी गई दूरी की संक्षिप्त और मूलनिष्ठ अभिव्यक्ति है।
- source_word: מֵאָה אַמָּה
  choice: सौ हाथ
  rationale: ‘हाथ’ प्राचीन אמה माप के लिए हिन्दी बाइबलीय प्रयोग में परिचित शब्द है; आधुनिक इकाई में बदलने के बजाय मूल माप को सुरक्षित रखा गया है।
