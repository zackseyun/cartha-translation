base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/040/044.yaml
  text: And outside the inner gate were chambers for singers in the inner court[a], which were beside the shoulder of the north gate, with their front toward the south; one was beside the shoulder of the east gate[c][b], facing toward the north.
translation:
  language: hi
  text: भीतरी फाटक के बाहर, भीतरी आँगन में गायकों के लिए कक्ष थे। वे उत्तर फाटक की बगल[a] में थे और उनका सामने का भाग दक्षिण की ओर था; एक कक्ष पूर्वी फाटक की बगल[b] में था और उसका सामने का भाग उत्तर की ओर था।[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: मूल इब्रानी में शाब्दिक रूप से ‘उत्तर फाटक के कंधे के पास’ है; स्थापत्य-वर्णन में ‘कंधा’ किसी संरचना की बगल या पार्श्व के लिए प्रयुक्त है।
    reason: lexical_alternative
  - marker: b
    text: मूल इब्रानी में शाब्दिक रूप से ‘पूर्वी फाटक के कंधे के पास’ है; यहाँ भी ‘कंधा’ फाटक की बगल को दर्शाता है।
    reason: lexical_alternative
  - marker: c
    text: इस पद की इब्रानी वाक्य-रचना संक्षिप्त और कुछ असामान्य है। उसका सामान्य अर्थ यह है कि भीतरी आँगन में गायकों के कक्ष उत्तर और पूर्व के फाटकों के पास थे और उनके सामने के भाग क्रमशः दक्षिण और उत्तर की ओर थे।
    reason: alternative_reading
lexical_decisions:
- source_word: וּמִחוּצָה לַשַּׁעַר הַפְּנִימִי
  choice: भीतरी फाटक के बाहर
  rationale: स्थान-सूचक अर्थ को सीधे और स्वाभाविक हिन्दी में रखा गया है; आरम्भिक וּ का संबंध वाक्य-प्रवाह और विराम-चिह्न से व्यक्त होता है।
- source_word: לִשְׁכוֹת שָׁרִים
  choice: गायकों के लिए कक्ष
  rationale: לִשְׁכוֹת मंदिर-परिसर के कक्षों को और שָׁרִים गाने वालों को दर्शाता है। ‘गायकों के लिए कक्ष’ संबंध को सहज हिन्दी में व्यक्त करता है।
- source_word: בֶּחָצֵר הַפְּנִימִי
  choice: भीतरी आँगन में
  rationale: חָצֵר के मंदिर-स्थापत्य संबंधी अर्थ के लिए ‘आँगन’ सामान्य आधुनिक हिन्दी में स्पष्ट है और ‘भीतरी’ स्थानगत भेद बनाए रखता है।
- source_word: אֶל כֶּתֶף שַׁעַר הַצָּפוֹן
  choice: उत्तर फाटक की बगल में
  rationale: כֶּתֶף का मूल अर्थ ‘कंधा’ है, पर स्थापत्य-वर्णन में यह किसी रचना के पार्श्व या बगल को बताता है। मुख्य पाठ में स्वाभाविक ‘बगल’ रखा और मूल रूपक पादटिप्पणी में बताया गया है।
- source_word: וּפְנֵיהֶם דֶּרֶךְ הַדָּרוֹם
  choice: उनका सामने का भाग दक्षिण की ओर था
  rationale: स्थापत्य-संदर्भ में פָּנִים कमरों के सामने वाले भाग या मुख को दर्शाता है; यह अनुवाद मानवीय ‘चेहरों’ का भ्रामक बोध नहीं कराता।
- source_word: אֶחָד
  choice: एक कक्ष
  rationale: इब्रानी में केवल ‘एक’ है; हिन्दी में संदर्भित संज्ञा ‘कक्ष’ जोड़ने से वाक्य स्पष्ट होता है, बिना यह तय किए कि कोई बड़ा कक्ष-समूह अभिप्रेत था।
- source_word: אֶל כֶּתֶף שַׁעַר הַקָּדִים
  choice: पूर्वी फाटक की बगल में
  rationale: כֶּתֶף को पहले प्रयोग के अनुरूप ‘बगल’ कहा गया है और קָדִים का दिशात्मक अर्थ ‘पूर्वी’ रखा गया है।
- source_word: פְּנֵי דֶּרֶךְ הַצָּפוֹן
  choice: उसका सामने का भाग उत्तर की ओर था
  rationale: दूसरे कक्ष की दिशा को पहले खंड के समानांतर स्थापत्य भाषा में व्यक्त किया गया है।
