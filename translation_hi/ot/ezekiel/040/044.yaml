translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। मंदिर-स्थापत्य के लिए ‘फाटक’, ‘आँगन’, ‘कक्ष’ और ‘सामने का भाग’ जैसे सुसंगत शब्द चुने गए हैं। मूल के ‘कंधे’ रूपक को मुख्य पाठ में अस्वाभाविक बनाने के बजाय पादटिप्पणियों में सुरक्षित रखा गया है; संकुचित इब्रानी विन्यास को भी पादटिप्पणी में स्पष्ट किया गया है।
