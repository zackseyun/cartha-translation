- source_word: כַּמִּדּוֹת הָאֵלֶּה
  choice: इन्हीं मापों के अनुसार
  rationale: यह पहले बताई गई मापों के साथ समानता या अनुरूपता व्यक्त करता है।
- source_word: חַלּוֹנוֹת
  choice: खिड़कियाँ
