  text: And its guardroom[a], its side pillars, and its porch were according to these measurements; and it had windows, and its porch had windows, all around. The length was fifty cubits[b], and the width twenty-five cubits.
translation:
  language: hi
  text: उसकी पहरेदार कोठरी, उसका पार्श्व-स्तंभ[a] और उसका द्वार-मंडप[b] भी इन्हीं मापों के अनुसार थे। उसमें और उसके द्वार-मंडप में चारों ओर खिड़कियाँ थीं। उसकी लंबाई पचास हाथ और चौड़ाई पच्चीस हाथ थी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “चौखट के स्तंभ,” “भित्ति-स्तंभ” अथवा “खंभे।”
    reason: lexical_alternative
  - marker: b
    text: या “प्रवेश-कक्ष।”
    reason: lexical_alternative
