  rationale: मंदिर-द्वार की वास्तुकला में यह द्वार से जुड़ी छोटी कोठरी को दर्शाता है; संदर्भ में उसका उपयोग पहरेदारों की कोठरी के रूप में समझ आता है।
- source_word: אַיִל
