- source_word: חֲמִשִּׁים אַמָּה אֹרֶךְ
  choice: उसकी लंबाई पचास हाथ
  rationale: माप को स्पष्ट हिन्दी वाक्य-विन्यास में रखते हुए אַמָּה के लिए परंपरागत और समझने योग्य ‘हाथ’ चुना गया है।
- source_word: וְרֹחַב עֶשְׂרִים וְחָמֵשׁ אַמּוֹת
  choice: और चौड़ाई पच्चीस हाथ
  rationale: मूल के समन्वित माप-विन्यास को संक्षिप्त और स्वाभाविक हिन्दी में सुरक्षित रखा गया है।
- source_word: לּוֹ ... וְלְאֵילָמוֹ
  choice: उसमें और उसके द्वार-मंडप में ... खिड़कियाँ थीं
  rationale: इब्रानी संबंधसूचक रचना दोनों स्थानों—द्वार-संरचना और उसके मंडप—में खिड़कियों की उपस्थिति बताती है।
