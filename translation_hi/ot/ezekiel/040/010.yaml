  yaml_path: translation/ot/ezekiel/040/010.yaml
  text: And the guardrooms of the gate facing east were three on this side and three on that side[a]; the three of them had one measure[b], and the side pillars had one measure on this side and on that side.
translation:
  language: hi
  text: पूर्व की ओर मुख किए हुए फाटक के पहरे के कक्ष[a] इस ओर तीन और उस ओर तीन थे। उन तीनों का नाप एक ही था, और इस ओर तथा उस ओर के पार्श्व-स्तंभों[b] का नाप भी एक ही था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “बगल के कक्ष”; इब्रानी शब्द फाटक की संरचना में बनी छोटी कोठरियों के लिए प्रयुक्त हुआ है।
    reason: lexical_alternative
  - marker: b
    text: या “चौखट के खंभे” अथवा “भित्ति-स्तंभ”; यहेजकेल के मंदिर-दर्शन में प्रयुक्त इस वास्तु-संबंधी शब्द का सटीक अर्थ विवादित है।
    reason: lexical_alternative
lexical_decisions:
- source_word: תָאֵי
  choice: पहरे के कक्ष
