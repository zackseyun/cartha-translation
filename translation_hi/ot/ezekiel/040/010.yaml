  rationale: שער के लिए यह स्वाभाविक और इस वास्तु-वर्णन के अनुकूल आधुनिक हिन्दी शब्द है।
- source_word: דֶּרֶךְ הַקָּדִים
  choice: पूर्व दिशा की ओर वाला
