lexical_decisions:
- source_word: הַשְׁפַתַּיִם
  choice: काँटे
  rationale: यह दुर्लभ और अर्थ की दृष्टि से अनिश्चित शब्द है। बलि काटने की जगह, मेज़ों और चढ़ावे के मांस के संदर्भ में मांस या उपकरण टाँगने के काँटे उपयुक्त लगते हैं; अनिश्चितता पाद-टिप्पणी में सुरक्षित रखी गई है।
- source_word: טֹפַח אֶחָד
  choice: एक हथेली लंबे
  rationale: טֹפַח हाथ की चौड़ाई पर आधारित छोटी माप है। ‘एक हथेली लंबे’ आधुनिक हिन्दी में स्वाभाविक रूप से काँटों की माप बताता है, यद्यपि मूल में माप की दिशा स्पष्ट नहीं की गई।
- source_word: מוּכָנִים
  choice: जड़े हुए थे
  rationale: כון का निष्क्रिय भाव यहाँ वस्तुओं के स्थिर या दृढ़ता से लगाए जाने को व्यक्त करता है। काँटों के संदर्भ में ‘जड़े हुए’ स्वाभाविक और प्रसंगानुकूल है।
- source_word: בַּבַּיִת
  choice: भवन के भीतर
  rationale: इस मन्दिर-वर्णन में בַּיִת किसी भवन को सूचित करता है। ‘भवन के भीतर’ स्थान को स्पष्ट करता है, पर किसी अधिक विशिष्ट संरचना को अनावश्यक रूप से निर्धारित नहीं करता।
- source_word: סָבִיב סָבִיב
  choice: चारों ओर
  rationale: शब्द की पुनरावृत्ति पूरे घेरे या हर ओर होने पर बल देती है; ‘चारों ओर’ इसे सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: וְאֶל הַשֻּׁלְחָנוֹת
  choice: और मेज़ों पर
  rationale: אֶל सामान्यतः ‘की ओर’ कह सकता है, पर इस संक्षिप्त वर्णन और अगले संज्ञात्मक वाक्य में मेज़ों के साथ स्थान-संबंध अभिप्रेत है; इसलिए ‘मेज़ों पर’ सबसे सुसंगत है।
- source_word: בְּשַׂר הַקָּרְבָן
  choice: चढ़ावे का मांस
  rationale: בָּשָׂר का अर्थ ‘मांस’ और קָרְבָּן का अर्थ परमेश्वर के सामने लाया गया चढ़ावा है। यह चयन बलि-संबंधी संदर्भ को सामान्य पाठक के लिए स्पष्ट रखते हुए मूल शब्दावली के निकट रहता है।
