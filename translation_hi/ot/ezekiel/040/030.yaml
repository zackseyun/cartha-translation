lexical_decisions:
- source_word: אֵלַמּוֹת
  choice: बरामदे
  rationale: मन्दिर-स्थापत्य के संदर्भ में यह बहुवचन प्रवेश से जुड़े छायादार मंडपों अथवा प्रकोष्ठों को सूचित करता है। ‘बरामदे’ साधारण आधुनिक हिन्दी में स्पष्ट है, जबकि पादटिप्पणी अधिक स्थापत्यपरक विकल्प देती है।
- source_word: סָבִיב סָבִיב
  choice: चारों ओर, चारों ओर
  rationale: मूल की पुनरुक्ति उसके बल और वितरणात्मक भाव को बनाए रखती है।
- source_word: אֹרֶךְ
  choice: लंबे
  rationale: माप के साथ विशेषणात्मक प्रयोग आधुनिक हिन्दी में स्वाभाविक है और लंबाई का अर्थ सुरक्षित रखता है।
- source_word: חָמֵשׁ וְעֶשְׂרִים אַמָּה
  choice: पच्चीस हाथ
  rationale: संख्या को आधुनिक हिन्दी क्रम में रखा गया है और प्राचीन माप ‘हाथ’ को बिना आधुनिक इकाई में बदले बनाए रखा गया है।
- source_word: רֹחַב
  choice: चौड़े
  rationale: ‘लंबे’ के समानांतर विशेषणात्मक रूप सहज हिन्दी देता है।
- source_word: חָמֵשׁ אַמּוֹת
  choice: पाँच हाथ
  rationale: चौड़ाई के माप का सीधा और स्वाभाविक अनुवाद।
