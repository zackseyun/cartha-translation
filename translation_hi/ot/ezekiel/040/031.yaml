  text: וְ/אֵלַמָּ֗/ו אֶל חָצֵר֙ הַ/חִ֣צוֹנָ֔ה וְ/תִמֹרִ֖ים אֶל איל/ו וּ/מַעֲל֥וֹת שְׁמוֹנֶ֖ה מעל/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/040/031.yaml
  text: Its portico faced the outer court[a], and palm trees were on its jambs, and eight steps went up to it.
translation:
  language: hi
  text: उसका द्वारमंडप बाहरी आँगन की ओर था[a]। उसके द्वार-स्तंभों पर खजूर के पेड़ों की आकृतियाँ थीं, और उस तक आठ सीढ़ियाँ चढ़कर जाना होता था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसका प्रवेश-कक्ष बाहरी आँगन की ओर था, और उसके भित्ति-स्तंभों पर खजूर की आकृतियाँ थीं।” यहेजकेल 40 में प्रयुक्त इब्रानी स्थापत्य शब्द विशेष प्रकार के हैं और उनका अनुवाद अलग-अलग ढंग से किया जाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלַמּוֹ
  choice: उसका द्वारमंडप
  rationale: मंदिर-दर्शन के स्थापत्य संदर्भ में यह प्रवेश-द्वार से जुड़ी आगे निकली छतदार संरचना को दर्शाता है। ‘द्वारमंडप’ आधुनिक हिन्दी में पर्याप्त स्पष्ट और गरिमापूर्ण है।
- source_word: אֶל חָצֵר הַחִיצוֹנָה
  choice: बाहरी आँगन की ओर था
  rationale: दिशासूचक אֶל के साथ संज्ञात्मक वाक्यांश संरचना का रुख बाहरी आँगन की ओर बताता है; हिन्दी में यह स्वाभाविक अभिव्यक्ति है।
- source_word: תִמֹרִים
  choice: खजूर के पेड़ों की आकृतियाँ
  rationale: स्थापत्य संदर्भ में बहुवचन संज्ञा खजूर-वृक्ष के अलंकरणों को सूचित करती है। ‘आकृतियाँ’ जोड़ने से यह स्पष्ट होता है कि वास्तविक पेड़ नहीं, उकेरे या सजावटी रूप अभिप्रेत हैं।
- source_word: אֵילָו
  choice: उसके द्वार-स्तंभों
  rationale: यहेजकेल 40 में यह द्वार के पार्श्ववर्ती संरचनात्मक अंगों के लिए प्रयुक्त विशेष स्थापत्य शब्द है। ‘द्वार-स्तंभ’ साधारण पाठक के लिए ‘भित्ति-स्तंभ’ या तकनीकी विकल्पों से अधिक स्पष्ट है।
- source_word: מַעֲלוֹת שְׁמוֹנֶה
  choice: आठ सीढ़ियाँ
  rationale: यह पद चढ़ने के आठ सोपानों को दर्शाता है; ‘आठ सीढ़ियाँ’ स्वाभाविक और संदर्भानुकूल हिन्दी है।
- source_word: מַעֲלוֹ
  choice: उस तक ... चढ़कर जाना होता था
  rationale: प्रत्यययुक्त एकवचन रूप उस संरचना तक पहुँचने की चढ़ाई को सूचित करता है। हिन्दी में यह वाक्य-विन्यास पहुँच और आरोहण दोनों को सहज रूप से व्यक्त करता है।
