  text: וְ/חַלּוֹנִ֨ים ל֤/וֹ ו/ל/אילמ/ו סָבִ֣יב סָבִ֔יב כְּ/הַ/חֲלֹּנ֖וֹת הָ/אֵ֑לֶּה חֲמִשִּׁ֤ים אַמָּה֙ אֹ֔רֶךְ וְ/רֹ֕חַב חָמֵ֥שׁ וְ/עֶשְׂרִ֖ים אַמָּֽה׀׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/040/025.yaml
  text: And it had windows all around[a], and its porch also had windows all around, like these windows. The length was fifty cubits, and the width twenty-five cubits.
translation:
  language: hi
  text: उसमें चारों ओर खिड़कियाँ थीं, और उसके बरामदे में भी चारों ओर वैसी ही खिड़कियाँ थीं। उसकी लंबाई पचास हाथ और चौड़ाई पच्चीस हाथ थी।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חַלּוֹנִים
  choice: खिड़कियाँ
  rationale: यह संज्ञा द्वार की संरचना में बनी खिड़कियों अथवा खुले स्थानों को दर्शाती है; आधुनिक हिन्दी में ‘खिड़कियाँ’ सबसे स्वाभाविक और प्रसंगानुकूल है।
- source_word: לוֹ
  choice: उसमें ... थीं
  rationale: हिब्रू में शाब्दिक रूप से ‘उसके लिए/उसकी’ है, जिसे हिन्दी में संरचना के भीतर उपस्थित वस्तुओं के अर्थ में स्वाभाविक रूप से ‘उसमें ... थीं’ कहा गया है।
- source_word: וְלְאֵילָמָו
  choice: और उसके बरामदे में भी
  rationale: אֵילָם यहाँ द्वार से जुड़े सामने के छायादार प्रवेश-भाग को सूचित करता है। ‘बरामदा’ सामान्य आधुनिक हिन्दी में समझने योग्य वास्तुशिल्पीय शब्द है; ‘भी’ संदर्भगत समानता को स्पष्ट करता है।
- source_word: סָבִיב סָבִיב
  choice: चारों ओर
  rationale: दोहराया हुआ पद सभी ओर होने पर बल देता है; ‘चारों ओर’ हिन्दी में इसे स्वाभाविक ढंग से व्यक्त करता है।
- source_word: כְּהַחֲלֹּנוֹת הָאֵלֶּה
  choice: वैसी ही खिड़कियाँ
  rationale: वाक्यांश पहले वर्णित नमूने की खिड़कियों से तुलना करता है। हिन्दी में अनाफोरिक संकेत के लिए ‘वैसी ही’ स्पष्ट और सहज है।
- source_word: חֲמִשִּׁים אַמָּה אֹרֶךְ
  choice: उसकी लंबाई पचास हाथ
  rationale: माप-सूत्र को आधुनिक हिन्दी के स्वाभाविक वाक्य-विन्यास में रखा गया है। אַמָּה के पारंपरिक बाइबलीय समतुल्य के रूप में ‘हाथ’ चुना गया है।
- source_word: וְרֹחַב חָמֵשׁ וְעֶשְׂרִים אַמָּה
  choice: और चौड़ाई पच्चीस हाथ
  rationale: हिब्रू के ‘पाँच और बीस’ को समकालीन हिन्दी संख्या ‘पच्चीस’ में व्यक्त किया गया है और समानांतर माप-संरचना सुरक्षित रखी गई है।
