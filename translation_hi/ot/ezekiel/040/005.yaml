base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/040/005.yaml
  text: 'And behold[a], there was a wall outside the house, all around, and in the hand of the man was a measuring reed of six cubits, each cubit being a cubit and a handbreadth. And he measured the width of the structure: one reed[b], and the height: one reed.'
translation:
  language: hi
  text: और देखो, भवन के बाहर चारों ओर एक दीवार थी। उस पुरुष के हाथ में छह हाथ का एक मापने का सरकंडा था; प्रत्येक हाथ एक सामान्य हाथ और एक हथेली के बराबर था[a]। उसने उस संरचना की चौड़ाई[b] नापी—एक सरकंडा; और उसकी ऊँचाई—एक सरकंडा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी का शाब्दिक भाव है, “एक हाथ और एक हथेली वाले हाथ से।” अर्थात यहाँ सामान्य हाथ से एक हथेली लंबी माप-इकाई प्रयुक्त हुई है।
    reason: cultural_note
  - marker: b
    text: या “उस भवन की चौड़ाई।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  choice: और देखो
  rationale: दर्शन के वर्णन में यह पद नई वस्तु की ओर ध्यान खींचता है; ‘और देखो’ उसके संकेतात्मक बल को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: חוֹמָה
  choice: दीवार
  rationale: यह एक बड़ी बाहरी दीवार का सामान्य और प्रसंगानुकूल हिन्दी शब्द है; मूल पाठ इसे विशेष रूप से किलेबंदी नहीं कहता।
- source_word: מִחוּץ לַבַּיִת
  choice: भवन के बाहर
  rationale: בַּיִת का मूल अर्थ ‘घर/भवन’ है। मन्दिर-दर्शन का प्रसंग होते हुए भी ‘भवन’ मूल की व्यापकता को बनाए रखता और हिन्दी में स्पष्ट रहता है।
- source_word: סָבִיב סָבִיב
  choice: चारों ओर
  rationale: इब्रानी की पुनरुक्ति पूरी तरह घेरे होने पर बल देती है; ‘चारों ओर’ इसका स्वाभाविक हिन्दी रूप है।
- source_word: וּבְיַד הָאִישׁ
  choice: उस पुरुष के हाथ में
  rationale: मूल की ठोस अभिव्यक्ति को बनाए रखते हुए पहले से उल्लिखित दर्शनीय मार्गदर्शक की ओर संकेत करता है।
- source_word: קְנֵה הַמִּדָּה
  choice: नापने का एक सरकंडा
  rationale: קָנֶה मूलतः सरकंडा है जिसे यहाँ नापने के उपकरण के रूप में इस्तेमाल किया गया है; यह सामान्य ‘छड़’ से अधिक स्रोत-सन्निकट है।
- source_word: שֵׁשׁ אַמּוֹת בָּאַמָּה וָטֹפַח
  choice: छः हाथ लंबा था; हर हाथ एक सामान्य हाथ और एक हथेली के बराबर था
  rationale: प्राचीन इकाई ‘हाथ’ को बनाए रखकर यह स्पष्ट करता है कि यहाँ अपेक्षाकृत लंबा हाथ प्रयुक्त है, जिसमें सामान्य हाथ के साथ एक हथेली जोड़ी गई है।
- source_word: רֹחַב הַבִּנְיָן
  choice: उस संरचना की चौड़ाई
  rationale: בִּנְיָן किसी निर्मित वस्तु या भवन को सूचित कर सकता है। ‘संरचना’ वास्तु-संदर्भ में स्वाभाविक है और इसे पहले आए ‘भवन’ के साथ अनावश्यक रूप से एक नहीं कर देता।
- source_word: קָנֶה אֶחָד
  choice: एक सरकंडा
  rationale: माप के परिणाम को उसी इकाई में व्यक्त करता है जिसे वाक्य के आरम्भ में परिभाषित किया गया है।
- source_word: וְקוֹמָה
  choice: और उसकी ऊँचाई
  rationale: यहाँ קוֹמָה निर्मित वस्तु के ऊर्ध्वाधर विस्तार को दर्शाता है; ‘ऊँचाई’ इसका सहज वास्तुशिल्पीय समानार्थी है।
