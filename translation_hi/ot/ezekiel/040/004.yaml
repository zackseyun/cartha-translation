base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/040/004.yaml
  text: And the man said to me[a], “Son of man, see with your eyes, and hear with your ears, and set your heart on all that I show you, for you were brought here so that I might show you these things. Declare to the house of Israel all that you see.”
translation:
  language: hi
  text: तब उस पुरुष ने मुझसे कहा, “हे मनुष्य-पुत्र[a], अपनी आँखों से देख, अपने कानों से सुन, और जो कुछ मैं तुझे दिखाता हूँ, उस सब पर ध्यान दे; क्योंकि तुझे यहाँ इसीलिए लाया गया है कि मैं तुझे यह सब दिखाऊँ। जो कुछ तू देखता है, वह सब इस्राएल के घराने को बता।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “हे मनुष्य” अथवा “हे नश्वर मनुष्य।” इब्रानी में यह यहेजकेल के लिए नियमित रूप से प्रयुक्त संबोधन है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאִישׁ
  choice: उस पुरुष
  rationale: यह सामान्य इब्रानी शब्द उस पुरुष आकृति की ओर संकेत करता है जिसका परिचय पिछले पद में हुआ है; ‘उस पुरुष’ संदर्भ को स्वाभाविक रूप से जोड़ता है।
- source_word: בֶּן אָדָם
  choice: हे मनुष्य के पुत्र
  rationale: यहेजकेल में यह नबी के लिए बार-बार प्रयुक्त संबोधन है। इसे बनाए रखने से पुस्तक की साहित्यिक निरंतरता और मूल मुहावरा सुरक्षित रहते हैं।
- source_word: רְאֵה בְעֵינֶיךָ וּבְאָזְנֶיךָ שְׁמָע
  choice: अपनी आँखों से देख, अपने कानों से सुन
  rationale: दोनों समानांतर आज्ञाओं और शरीर-अंगों के स्पष्ट उल्लेख को निकटता से सुरक्षित रखा गया है।
- source_word: וְשִׂים לִבְּךָ
  choice: अपना मन लगा
  rationale: शाब्दिक चित्र ‘अपना हृदय लगा’ है, पर आधुनिक हिन्दी में ‘मन लगा’ ध्यानपूर्वक ग्रहण करने के बौद्धिक और आंतरिक भाव को अधिक स्वाभाविक ढंग से व्यक्त करता है।
- source_word: לְכֹל אֲשֶׁר אֲנִי מַרְאֶה אוֹתָךְ
  choice: जो कुछ मैं तुझे दिखाता हूँ उस सब पर
  rationale: ראה के हिफ़ईल रूप का कारक अर्थ ‘दिखाना’ स्पष्ट रखा गया है और לְכֹל को ध्यान लगाने वाली पिछली अभिव्यक्ति से जोड़ा गया है।
- source_word: כִּי לְמַעַן הַרְאוֹתְכָה הֻבָאתָה הֵנָּה
  choice: क्योंकि तुझे यहाँ इसीलिए लाया गया है कि मैं तुझे ये बातें दिखाऊँ
  rationale: वाक्य का प्रयोजन-संबंध और कर्मवाच्य दोनों सुरक्षित हैं। ‘ये बातें’ निहित सामूहिक दृश्य-विषय को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: הַגֵּד
  choice: बता
  rationale: हिफ़ईल आज्ञार्थ का अर्थ प्रकट करना या सूचना देना है। यहाँ ‘बता’ आधुनिक हिन्दी में स्पष्ट, गंभीर और स्वाभाविक है; ‘घोषणा कर’ अनावश्यक रूप से औपचारिक होता।
- source_word: לְבֵית יִשְׂרָאֵל
  choice: इस्राएल के घराने को
  rationale: मानक नबूवत-संबंधी अभिव्यक्ति ‘इस्राएल का घराना’ साहित्यिक बनावट और सामूहिक पहचान दोनों बनाए रखती है।
- source_word: כָּל אֲשֶׁר אַתָּה רֹאֶה
  choice: जो कुछ तू देखता है, वह सब
  rationale: मूल के व्यापक समावेशी अर्थ को सहज हिन्दी में रखा गया है।
theological_decisions:
- issue: यहेजकेल में बार-बार आने वाले संबोधन בֶּן אָדָם का अनुवाद
  choice: हे मनुष्य के पुत्र
  alternative: हे मनुष्य; हे नश्वर मनुष्य
  rationale: यहाँ यह मसीह-संबंधी उपाधि नहीं, बल्कि यहेजकेल के लिए नबूवत-संबंधी संबोधन है। पारंपरिक मुहावरे को रखने से इसकी पुनरावृत्ति और साहित्यिक भूमिका दिखाई देती है, जबकि पादटिप्पणी इसका सामान्य मानवीय आशय स्पष्ट करती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज शैली अपनाई गई है। दिव्य-दर्शनीय प्रसंग की गंभीरता के अनुरूप एकवचन ‘तू/तुझे’ रखा गया है। मूल की समानांतर आज्ञाएँ और ‘इस्राएल के घराने’ जैसी नबूवत-संबंधी अभिव्यक्ति सुरक्षित रखी गई हैं।
