  text: And the pavement was beside the side of the gates[a], corresponding to the length of the gates—the lower pavement.
translation:
  language: hi
  text: और फर्श फाटकों के किनारे, फाटकों की लंबाई के अनुरूप[a] था—यह निचला फर्श था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘फाटकों की लंबाई के सामने’; इब्रानी לְעֻמַּת स्थानिक अनुरूपता अथवा किसी वस्तु के सामने की स्थिति, दोनों को व्यक्त कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הָרִצְפָה
  choice: फर्श
  rationale: यह शब्द पक्की या बिछी हुई सतह को दर्शाता है; वास्तु-वर्णन में ‘फर्श’ सहज और स्पष्ट है।
- source_word: אֶל כֶּתֶף הַשְּׁעָרִים
  choice: फाटकों के किनारे
  rationale: כֶּתֶף का शाब्दिक अर्थ ‘कंधा’ है, पर यहाँ वास्तु-संदर्भ में ‘किनारा/बगल’ अभिप्रेत है; אֶל निकटता या संलग्न स्थिति बताता है।
- source_word: הַשְּׁעָרִים
  choice: फाटक
  rationale: बहुवचन को बनाए रखते हुए यह परिसर के फाटक या फाटक-संरचनाओं के लिए स्वाभाविक हिन्दी शब्द है।
- source_word: לְעֻמַּת
  choice: के अनुरूप
  rationale: यह स्थानिक सामंजस्य, समान विस्तार या सामने की स्थिति व्यक्त कर सकता है; ‘के अनुरूप’ मुख्य पाठ में वास्तु-संबंध को स्वाभाविक ढंग से रखता है।
- source_word: אֹרֶךְ
  choice: लंबाई
  rationale: माप-संबंधी इस सामान्य शब्द का सीधा और उपयुक्त हिन्दी रूप है।
- source_word: הָרִצְפָה הַתַּחְתּוֹנָה
  choice: निचला फर्श
  rationale: विशेषण इस फर्श को किसी ऊँचे अथवा भीतरी फर्श से अलग बताता है; ‘निचला फर्श’ संक्षिप्त और स्पष्ट है।
