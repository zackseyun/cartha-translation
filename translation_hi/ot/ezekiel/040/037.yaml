- source_word: תִמֹרִים
  choice: खजूर के पेड़ों की आकृतियाँ
  rationale: शब्द का मूल अर्थ खजूर के पेड़ है, पर पत्थर की द्वार-संरचना के स्तंभों पर होने के कारण यहाँ उत्कीर्ण या सजावटी आकृतियाँ अभिप्रेत हैं। ‘आकृतियाँ’ संदर्भ को स्पष्ट करता है, जबकि पादटिप्पणी अधिक शाब्दिक संभावना सुरक्षित रखती है।
- source_word: מִפּוֹ וּמִפּוֹ
  choice: दोनों ओर
  rationale: यह दोहराव सममित रूप से इस ओर और उस ओर होने का भाव देता है। ‘दोनों ओर’ सहज और सटीक आधुनिक हिन्दी है।
- source_word: שְׁמֹנֶה מַעֲלוֹת מַעֲלוֹ
  choice: उस तक चढ़ने के लिए आठ सीढ़ियाँ थीं
  rationale: מַעֲלוֹת सीढ़ियों को और अंतिम रूप चढ़ाई या पहुँच को सूचित करता है। यह अनुवाद उस वास्तुगत कार्य को स्वाभाविक हिन्दी में व्यक्त करता है।
