  yaml_path: translation/ot/ezekiel/040/037.yaml
  text: Its portico faced the outer court[a], and palm trees were on its jambs, on this side and on that side[b]; and eight steps went up to it.
translation:
  language: hi
  text: उसके द्वार-स्तंभ बाहरी आँगन की ओर थे[a]। उन द्वार-स्तंभों पर इस ओर और उस ओर खजूर के पेड़ थे[b], और उस तक आठ सीढ़ियाँ चढ़ती थीं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘उसके पार्श्व-स्तंभ/जाम्ब बाहरी आँगन की ओर थे।’ इब्रानी वास्तुशब्द को कुछ लोग ‘प्रवेश-बरामदा’ भी समझते हैं।
    reason: lexical_alternative
  - marker: b
    text: वास्तु-संदर्भ में इसका अर्थ खजूर के पेड़ों की उत्कीर्ण या सजावटी आकृतियाँ भी हो सकता है; इब्रानी में शाब्दिक रूप से ‘खजूर के पेड़’ है।
    reason: lexical_alternative
