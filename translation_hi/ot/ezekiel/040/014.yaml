  text: וַ/יַּ֥עַשׂ אֶת אֵילִ֖ים שִׁשִּׁ֣ים אַמָּ֑ה וְ/אֶל אֵיל֙ הֶֽ/חָצֵ֔ר הַ/שַּׁ֖עַר סָבִ֥יב סָבִֽיב־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/040/014.yaml
  text: And he made the jambs sixty cubits, and to the jamb of the court the gate extended all around.
translation:
  language: hi
  text: उसने द्वार-स्तंभ साठ हाथ[a] के बनाए; और फाटक चारों ओर आँगन के स्तंभ तक फैला हुआ था।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ ‘हाथ’ उस माप को सूचित करता है जो यहेजकेल 40:5 के अनुसार साधारण हाथ से एक हथेली अधिक था, अर्थात लगभग 52–53 सेंटीमीटर। हिब्रू पाठ यह स्पष्ट नहीं करता कि साठ हाथ से ऊँचाई, लंबाई या कोई अन्य आयाम अभिप्रेत है।
    reason: इसी संदर्भ में परिभाषित लंबे हाथ का अनुमानित आधुनिक मान ठीक करना और आयाम-संबंधी अस्पष्टता बनाए रखना।
  - marker: b
    text: 'इस वाक्यांश का हिब्रू पाठ कठिन और अर्थ की दृष्टि से अनिश्चित है; इसका अनुवाद इस प्रकार भी किया गया है: “और आँगन फाटक के स्तंभों तक चारों ओर फैला था।”'
    reason: दूसरे उपवाक्य की वास्तविक व्याकरणिक और वास्तु-संबंधी अस्पष्टता दर्ज करना।
lexical_decisions:
- source_word: אֵילִים / אֵיל
  choice: द्वार-स्तंभ / स्तंभ
  rationale: मन्दिर-वास्तु के इस प्रसंग में यह शब्द फाटक के मोटे सहायक खंभों या द्वार-स्तंभों को दर्शाता है; केवल ‘चौखट’ कहना इसके वास्तु-संबंधी अर्थ को अनावश्यक रूप से संकरा कर सकता है।
- source_word: אַמָּה
  choice: हाथ
  rationale: प्राचीन लंबाई की इकाई ‘क्यूबिट’ के लिए सामान्य और सुबोध हिन्दी पारंपरिक शब्द; इसका अनुमानित आधुनिक मान पादटिप्पणी में दिया गया है।
- source_word: סָבִיב סָבִיב
  choice: चारों ओर
  rationale: हिब्रू की पुनरुक्ति व्यापक घेराव पर बल देती है; हिन्दी में ‘चारों ओर’ उसका स्वाभाविक समतुल्य है।
theological_decisions:
- issue: साठ हाथ किस आयाम को बताता है
  choice: ‘साठ हाथ के’ कहकर आयाम को अनिर्दिष्ट रखा गया
  alternative: ‘साठ हाथ ऊँचे’
  rationale: मसोराई हिब्रू पाठ में ‘ऊँचे’ शब्द नहीं है; उसे मुख्य पाठ में जोड़ना अस्पष्ट वास्तु-विवरण का अनावश्यक समाधान होगा।
- issue: दूसरे उपवाक्य का कठिन वाक्य-विन्यास
  choice: फाटक को आँगन के स्तंभ तक चारों ओर फैला हुआ बताया
  alternative: आँगन को फाटक के स्तंभों तक फैला हुआ बताना
  rationale: व्यंजन-पाठ के शब्दक्रम और उपलब्ध परामर्श-पाठ के निकट रहते हुए अर्थ को पठनीय बनाया गया, पर पाठ की वास्तविक अनिश्चितता पादटिप्पणी में सुरक्षित रखी गई।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सरल वास्तु-शब्दावली रखी गई है। ‘द्वार-स्तंभ’ प्रसंग को स्पष्ट करता है, जबकि पादटिप्पणियाँ पाठ की माप और वाक्य-विन्यास संबंधी अनिश्चितताओं को ईमानदारी से सुरक्षित रखती हैं।
