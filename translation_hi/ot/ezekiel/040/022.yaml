  yaml_path: translation/ot/ezekiel/040/022.yaml
  text: Its windows[a], its porch, and its palm-tree decorations had the same measurements as the gate that faced east. People would go up to it by seven steps[c][b], and its porch was in front of them.
translation:
  language: hi
  text: उसकी खिड़कियाँ, उसका बरामदा[a] और उसकी खजूर-वृक्षों की नक्काशियाँ[b] उस फाटक के समान माप की थीं जिसका मुख पूर्व की ओर था। लोग[c] सात सीढ़ियाँ चढ़कर उस तक पहुँचते थे, और उसका बरामदा उनके सामने था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘प्रवेश-मंडप’; इस पद में आए स्थापत्य-सूचक शब्द के दोनों प्रयोगों के लिए।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से ‘उसके खजूर-वृक्ष’; इस स्थापत्य-सन्दर्भ में सम्भवतः खजूर-वृक्ष के आकार की नक्काशियाँ या सजावटी आकृतियाँ अभिप्रेत हैं, न कि वास्तविक पेड़।
    reason: cultural_note
  - marker: c
    text: इब्रानी में क्रिया बहुवचन है—शाब्दिक रूप से ‘वे चढ़ते थे’। यहाँ इसका प्रयोग सम्भवतः अनिश्चित अर्थ में है, अर्थात ‘लोग चढ़ते थे’।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְחַלּוֹנוֹ
  choice: उसकी खिड़कियाँ
  rationale: חַלּוֹן खिड़की अथवा खिड़की के खुले भाग को दर्शाता है। स्थापत्य-वर्णन में सामूहिक अर्थ को स्वाभाविक हिन्दी में बहुवचन से व्यक्त किया गया है।
- source_word: וְאֵלַמּוֹ / וְאֵילַמּוֹ
  choice: उसका बरामदा
  rationale: मन्दिर-स्थापत्य में यह शब्द प्रवेश के आगे निकले हुए ढके भाग को दर्शाता है। ‘बरामदा’ आधुनिक हिन्दी में सहज है और दोनों occurrences में एकरूप रखा गया है।
- source_word: וְתִמָּרוֹ
  choice: उसकी खजूर-वृक्ष की नक्काशियाँ
  rationale: इस स्थापत्य-सन्दर्भ में תִּמָּרָה वास्तविक पेड़ों के बजाय खजूर-वृक्ष के आकार के अलंकरणों को दर्शाता है; ‘नक्काशियाँ’ इस आशय को स्पष्ट करता है।
- source_word: כְּמִדַּת
  choice: उसी माप की थीं जिस माप का
  rationale: כְּ और מִדָּה का मेल आयामों की समानता बताता है। यह हिन्दी संरचना तुलना को स्पष्ट रखते हुए मूल के स्थापत्य भाव को सुरक्षित रखती है।
- source_word: הַשַּׁעַר אֲשֶׁר פָּנָיו דֶּרֶךְ הַקָּדִים
  choice: वह फाटक ... जिसका मुख पूर्व की ओर था
  rationale: פָּנָיו ... דֶּרֶךְ הַקָּדִים दिशा-अभिमुखता का मुहावरा है। ‘मुख पूर्व की ओर था’ मूल रूपक को बनाए रखता है और हिन्दी में स्वाभाविक है।
- source_word: וּבְמַעֲלוֹת שֶׁבַע יַעֲלוּ בוֹ
  choice: लोग सात सीढ़ियाँ चढ़कर उसके पास जाते थे
  rationale: तीसरे पुरुष बहुवचन क्रिया यहाँ सम्भवतः अनिश्चित अथवा निर्वैयक्तिक कर्ता व्यक्त करती है। ‘लोग’ इसे सहज हिन्दी में व्यक्त करता है, और בְּמַעֲלוֹת सीढ़ियों द्वारा ऊपर पहुँचने का साधन बताता है।
- source_word: לִפְנֵיהֶם
  choice: उनके सामने
  rationale: לִפְנֵי का स्थानवाचक अर्थ ‘सामने’ है। बहुवचन प्रत्यय का सन्दर्भ संक्षिप्त और कुछ अस्पष्ट है, इसलिए हिन्दी में भी ‘उनके’ रखकर उसे अनावश्यक रूप से निश्चित नहीं किया गया।
