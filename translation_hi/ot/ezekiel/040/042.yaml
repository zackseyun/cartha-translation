base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/040/042.yaml
  text: And four tables for the burnt offering were of cut stone[a], a cubit and a half long, a cubit and a half wide, and one cubit high[b]. On them they placed the implements with which they slaughtered the burnt offering and the sacrifice.
translation:
  language: hi
  text: और होमबलि के लिए तराशे हुए पत्थरों[a] की चार मेज़ें थीं। वे डेढ़ हाथ लंबी, डेढ़ हाथ चौड़ी और एक हाथ ऊँची थीं। उन पर वे औज़ार रखते थे, जिनसे वे होमबलि और बलि[b] के पशुओं का वध करते थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘काटकर तराशे हुए पत्थर’।
    reason: lexical_alternative
  - marker: b
    text: यहाँ प्रयुक्त इब्रानी शब्द सामान्य रूप से ‘बलि’ को दर्शा सकता है; कुछ प्रसंगों में इसका अर्थ विशेष रूप से ‘मेलबलि’ होता है।
    reason: alternative_reading
lexical_decisions:
- source_word: שֻׁלְחָנוֹת
  choice: मेज़ें
  rationale: यह संज्ञा मेज़ या मेज़ जैसी सतह को दर्शाती है; बलि-संबंधी उपयोग पद में आगे स्पष्ट है।
- source_word: לָעוֹלָה
  choice: होमबलि के लिए
  rationale: עוֹלָה पूर्णतः जलाई जाने वाली बलि का मानक पद है और ל उद्देश्य अथवा नियोजन बताता है।
- source_word: אַבְנֵי גָזִית
  choice: तराशे हुए पत्थर
  rationale: यह पद काटकर और गढ़कर तैयार किए गए पत्थरों को दर्शाता है; वैकल्पिक पारंपरिक अभिव्यक्ति फुटनोट में दी गई है।
- source_word: אַמָּה אַחַת וָחֵצִי
  choice: डेढ़ हाथ
  rationale: प्राचीन माप इकाई אַמָּה को हिन्दी बाइबल की सहज और प्रचलित इकाई ‘हाथ’ से व्यक्त किया गया है, बिना आधुनिक इकाई में बदलने के।
- source_word: וְגֹבַהּ אַמָּה אֶחָת
  choice: एक हाथ ऊँची
  rationale: हिब्रू में शाब्दिक रूप से ‘उसकी ऊँचाई एक हाथ’ है; हिन्दी में आयाम बताने का यह स्वाभाविक रूप है।
- source_word: אֲלֵיהֶם
  choice: उन पर
  rationale: पूर्वसर्ग मेज़ों की ऊपरी सतह पर वस्तुएँ रखने का संकेत करता है।
- source_word: וְיַנִּיחוּ
  choice: वे ... रखते थे
  rationale: हिफ़ील क्रिया किसी वस्तु को रख देने या टिकाने का अर्थ देती है; यहाँ नियमित कार्य का वर्णन करने वाला अपूर्ण पक्ष हिन्दी में ‘रखते थे’ से स्वाभाविक रूप में व्यक्त हुआ है।
- source_word: הַכֵּלִים
  choice: औज़ार
  rationale: כֵּלִים व्यापक शब्द है, पर इस प्रसंग में बलि-पशुओं को काटने में काम आने वाले साधनों को दर्शाता है; ‘औज़ार’ सामान्य पाठक के लिए स्पष्ट है।
- source_word: אֲשֶׁר יִשְׁחֲטוּ ... בָּם
  choice: जिनसे ... काटा जाता था
  rationale: בָּם साधन का बोध कराता है और relative clause औज़ारों का कार्य बताता है; हिन्दी का कर्मवाच्य अनावश्यक कर्ता जोड़े बिना अर्थ स्पष्ट करता है।
- source_word: הָעוֹלָה
  choice: होमबलि
  rationale: पद के आरंभ में आए उसी बलि-संज्ञा के साथ एकरूपता रखी गई है।
- source_word: וְהַזָּבַח
  choice: और अन्य बलि
  rationale: זֶבַח सामान्यतः बलि को और कुछ प्रसंगों में अधिक विशिष्ट बलि-श्रेणी को दर्शा सकता है। हिन्दी वाक्य में दोहरे ‘होमबलि और बलि’ से उत्पन्न भ्रम घटाने के लिए ‘अन्य’ लगाया गया है, जबकि पद की व्यापकता को फुटनोट सहित बनाए रखा गया है।
theological_decisions:
- issue: זֶבַח की बलिदानी पारिभाषिक विशिष्टता
  choice: व्यापक अर्थ में ‘अन्य बलि’
  alternative: ‘मेलबलि’
  rationale: इस पद में हिब्रू शब्द स्वयं किसी एक विशिष्ट बलि-श्रेणी को अनिवार्य नहीं करता। इसलिए मुख्य पाठ व्यापक रखा गया है और अधिक विशिष्ट संभावित अर्थ फुटनोट में दिया गया है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण मानक हिन्दी अपनाई गई है। ‘होमबलि’, ‘बलि’ और ‘हाथ’ जैसे परिचित बाइबलीय शब्द रखे गए हैं। प्रत्येक आयाम को स्पष्ट करने के लिए ‘हर मेज़’ जोड़ा गया है; यह हिब्रू में दिए एकवचन मापों का स्वाभाविक हिन्दी प्रस्तुतीकरण है।
