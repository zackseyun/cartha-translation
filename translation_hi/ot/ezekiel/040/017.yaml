    text: या “पक्के फर्श पर” अथवा “पक्के फर्श की ओर।” इब्रानी में शाब्दिक रूप से “पक्के फर्श की ओर तीस कोठरियाँ” है, जो कोठरियों और पक्के फर्श के बीच स्थानिक संबंध बताता है।
    reason: lexical_alternative
