- source_word: שְׁלֹשִׁים לְשָׁכוֹת
  choice: तीस कोठरियाँ
  rationale: संख्या और संज्ञा का सीधा अनुवाद है तथा पहले आए शब्द के साथ संगति रखता है।
- source_word: אֶל הָרִצְפָה
  choice: पक्के फर्श से लगी हुई
  rationale: अस्पष्ट स्थानिक संबंध को 'से लगी हुई' के द्वारा व्यक्त किया गया है; यह कोठरियों को फर्श पर स्थित बताने की अपेक्षा उनके फर्श से संबंध पर बल देता है, जबकि विकल्प पादटिप्पणी में सुरक्षित हैं।
