base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/040/049.yaml
  text: The length of the vestibule was twenty cubits, and the width was twelve cubits, and by the steps by which one went up to it; and pillars were beside the sidewalls, one on this side and one on that side.
translation:
  language: hi
  text: बरामदे की लंबाई बीस हाथ और चौड़ाई ग्यारह हाथ[a] थी। उस तक चढ़ने के लिए सीढ़ियाँ थीं। द्वार-चौखटों के पास खंभे थे—एक इस ओर और एक उस ओर।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: कुछ प्राचीन अनुवादों में “बारह हाथ” है।
    reason: मसोरेटिक पाठ ‘ग्यारह’ पढ़ता है, जबकि कुछ प्राचीन पाठ-साक्ष्य ‘बारह’ का समर्थन करते हैं।
lexical_decisions:
- source_word: הָאֻלָם
  choice: बरामदा
  rationale: मंदिर के मुख्य कक्ष के सामने बने प्रवेश-भाग के लिए आधुनिक और सहज हिन्दी शब्द।
- source_word: אַמָּה
  choice: हाथ
  rationale: प्राचीन लंबाई-माप ‘क्यूबिट’ का पारंपरिक, सुबोध हिन्दी समतुल्य।
- source_word: אֵילִים
  choice: चौखटें
  rationale: इस स्थापत्य प्रसंग में द्वार के किनारे के उभरे हुए आधारों/जाम्बों का बोध कराता है; ‘बगल की दीवारें’ से अधिक स्रोत-संगत।
- source_word: עַמֻּדִים
  choice: खंभे
  rationale: स्थापत्य के स्तंभों के लिए सामान्य आधुनिक हिन्दी।
theological_decisions:
- issue: बरामदे की चौड़ाई की पाठगत संख्या
  choice: ग्यारह हाथ
  alternative: बारह हाथ
  rationale: WLC के व्यंजन-पाठ עַשְׁתֵּי עֶשְׂרֵה सामान्यतः ‘ग्यारह’ दर्शाता है। कुछ प्राचीन गवाह और अनुवाद ‘बारह’ देते हैं; पाठांतर को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी; स्थापत्य-वर्णन को स्पष्ट और गरिमापूर्ण रखा गया है। हिब्रू की असहज समन्वयी रचना को स्वाभाविक हिन्दी वाक्यों में बाँटा गया, पर सभी विवरण सुरक्षित रखे गए हैं।
