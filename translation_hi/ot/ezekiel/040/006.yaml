base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/040/006.yaml
  text: 'Then he came to the gate that faced east[a], and he went up its steps and measured the threshold of the gate: one reed wide. And the other threshold was one reed wide.'
translation:
  language: hi
  text: 'फिर वह उस फाटक तक आया जिसका मुख पूर्व की ओर था। वह उसकी सीढ़ियाँ चढ़ा और उसने फाटक की देहली मापी: एक सरकंडे की चौड़ाई। दूसरी देहली[a] एक सरकंडे की चौड़ाई थी।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “एक देहली।” इब्रानी पाठ में शाब्दिक रूप से “एक देहली” है, पर संदर्भ में संभवतः फाटक की दूसरी ओर की संगत देहली का उल्लेख है।
    reason: lexical_alternative
