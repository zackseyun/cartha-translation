  yaml_path: translation/ot/ezekiel/040/020.yaml
  text: As for the gate whose front faced north toward the outer court[a], he measured its length and its width.
translation:
  language: hi
  text: फिर उसने बाहरी आँगन के उस फाटक की लंबाई और चौड़ाई मापी, जिसका सामने का भाग उत्तर की ओर था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהַשַּׁעַר
  choice: फिर ... उस फाटक की
  rationale: वाव वर्णन के क्रम को आगे बढ़ाता है; हिन्दी में ‘फिर’ स्वाभाविक रूप से अगले स्थापत्य भाग की ओर संकेत करता है, जबकि ‘उस फाटक’ निश्चित संदर्भ बनाए रखता है।
- source_word: אֲשֶׁר פָּנָיו דֶּרֶךְ הַצָּפוֹן
  choice: जिसका सामने का भाग उत्तर की ओर था
  rationale: פָּנָיו का स्थापत्य-संदर्भ में अर्थ ‘उसका सामने का भाग’ है, और דֶּרֶךְ הַצָּפוֹן दिशा अर्थात उत्तर की ओर उन्मुख होने को व्यक्त करता है।
- source_word: לֶחָצֵר הַחִיצוֹנָה
  choice: बाहरी आँगन के
  rationale: यहाँ לְ फाटक का बाहरी आँगन से संबंध दर्शा सकता है। हिन्दी में ‘बाहरी आँगन के उस फाटक’ स्थानिक संबंध को स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है, बिना अनावश्यक रूप से दिशा का दूसरा संकेत जोड़े।
- source_word: מָדַד
  choice: उसने ... मापी
  rationale: क्रिया का कर्ता पिछले प्रसंग में स्थापित मापने वाला पुरुष है; हिन्दी में सर्वनाम आवश्यक है। संयुक्त कर्म ‘लंबाई और चौड़ाई’ के अनुसार स्त्रीलिंग क्रिया स्वाभाविक है।
- source_word: אָרְכּוֹ וְרָחְבּוֹ
  choice: उस फाटक की लंबाई और चौड़ाई
  rationale: ये स्थापत्य मापों के लिए स्पष्ट, प्रचलित आधुनिक हिन्दी शब्द हैं; दोनों प्रत्यय फाटक की ओर संकेत करते हैं।
