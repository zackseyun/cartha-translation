source:
  edition: WLC
  text: וַ/יְבִאֵ/נִי֮ אֶל אֻלָ֣ם הַ/בַּיִת֒ וַ/יָּ֨מָד֙ אֵ֣ל אֻלָ֔ם חָמֵ֤שׁ אַמּוֹת֙ מִ/פֹּ֔ה וְ/חָמֵ֥שׁ אַמּ֖וֹת מִ/פֹּ֑ה וְ/רֹ֣חַב הַ/שַּׁ֔עַר שָׁלֹ֤שׁ אַמּוֹת֙ מִ/פּ֔וֹ וְ/שָׁלֹ֥שׁ אַמּ֖וֹת מִ/פּֽוֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/040/048.yaml
  text: 'Then he brought me to the vestibule of the house[a], and he measured the jambs of the vestibule: five cubits on this side and five cubits on that side[c][b]; and the width of the gate was three cubits on this side and three cubits on that side.'
translation:
  language: hi
  text: 'तब वह मुझे भवन[b] के प्रवेश-कक्ष[a] में ले आया। उसने प्रवेश-कक्ष के पार्श्व-स्तंभों[c] को नापा: इस ओर पाँच हाथ और उस ओर पाँच हाथ। द्वार की चौड़ाई इस ओर तीन हाथ और उस ओर तीन हाथ थी।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘प्रवेश-कक्ष’ का अनुवाद ‘बरामदा’ या ‘मंडप’ भी किया जा सकता है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में शाब्दिक रूप से ‘घर’; इस दर्शन में मंदिर का मुख्य भवन अभिप्रेत है।
    reason: lexical_alternative
  - marker: c
    text: यह इब्रानी वास्तु-शब्द प्रवेश के दोनों ओर की संरचनाओं के लिए है; इसका अनुवाद ‘चौखट के खंभे’ या ‘बगल के खंभे’ भी किया जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אֻלָם
  choice: प्रवेश-कक्ष
  rationale: मंदिर की वास्तुकला में यह मुख्य भवन के आगे स्थित प्रवेश-भाग को दर्शाता है। ‘प्रवेश-कक्ष’ आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है; ‘बरामदा’ और ‘ड्योढ़ी’ जैसे विकल्प अर्थ को कुछ अधिक घरेलू या क्षेत्रीय बना सकते हैं।
- source_word: הַבַּיִת
  choice: भवन
  rationale: इब्रानी में शाब्दिक अर्थ ‘घर/भवन’ है। यहाँ दर्शन में मंदिर का मुख्य भवन अभिप्रेत है। ‘भवन’ वास्तु-संदर्भ में स्वाभाविक रहते हुए मूल शब्द की व्यापकता बनाए रखता है।
- source_word: אֵל אֻלָם
  choice: प्रवेश-कक्ष के पार्श्व-स्तंभ
  rationale: यहाँ אֵל परमेश्वर के लिए प्रयुक्त सामान्य शब्द नहीं, बल्कि प्रवेश के दोनों ओर की वास्तु-संरचनाओं के लिए तकनीकी शब्द है। दोनों ओर की अलग-अलग माप के कारण बहुवचन ‘पार्श्व-स्तंभों’ से आशय स्पष्ट होता है।
- source_word: חָמֵשׁ אַמּוֹת ... מִפֹּה וְחָמֵשׁ אַמּוֹת מִפֹּה
  choice: इस ओर पाँच हाथ और उस ओर पाँच हाथ
  rationale: दोनों संकेतवाचक पद प्रवेश के परस्पर अनुरूप दोनों पक्ष बताते हैं। यह हिन्दी वाक्य-विन्यास मूल की पुनरावृत्ति और सममिति को बनाए रखता है।
- source_word: רֹחַב הַשַּׁעַר
  choice: द्वार की चौड़ाई
  rationale: שַׁעַר का सामान्य अर्थ द्वार अथवा प्रवेश-द्वार है। यहाँ माप के संदर्भ में द्वार के खुले भाग की चौड़ाई अभिप्रेत है; ‘द्वार की चौड़ाई’ संक्षिप्त और स्पष्ट है।
- source_word: שָׁלֹשׁ אַמּוֹת מִפּוֹ וְשָׁלֹשׁ אַמּוֹת מִפּוֹ
  choice: इस ओर तीन हाथ और उस ओर तीन हाथ
  rationale: मूल पाठ की द्विपक्षीय संरचना को सीधे और स्वाभाविक हिन्दी में सुरक्षित रखा गया है।
- source_word: וַיְבִאֵנִי ... וַיָּמָד
  choice: तब वह मुझे ... ले आया। उसने ... नापा
  rationale: क्रमिक क्रियाएँ दर्शन की कथा को आगे बढ़ाती हैं। ‘तब’ क्रम को स्वाभाविक बनाता है और दूसरे वाक्य में कर्ता दोहराने से हिन्दी में स्पष्टता रहती है।
- source_word: אַמּוֹת
  choice: हाथ
  rationale: प्राचीन लंबाई की इकाई ‘अम्मा/cubit’ के लिए हिन्दी बाइबलीय और सामान्य प्रयोग में ‘हाथ’ सुबोध है। संदर्भ इसे माप की इकाई के रूप में स्पष्ट करता है।
