  yaml_path: translation/ot/ezekiel/040/034.yaml
  text: Its portico faced the outer court[a], and palm trees were on its jambs, on this side and on that side[b]; and eight steps went up to it.
translation:
  language: hi
  text: उसका बरामदा बाहरी आँगन की ओर खुलता था। उसके द्वार-स्तंभों[a] पर, इस ओर और उस ओर, खजूर के पेड़[b] थे; और उस तक आठ सीढ़ियाँ चढ़ती थीं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘चौखट के पार्श्व-खंभों’।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से ‘खजूर के पेड़’; इस स्थापत्य-संदर्भ में संभवतः खजूर के पेड़ों की नक्काशी या सजावटी आकृतियाँ अभिप्रेत हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵלַמּוֹ
  choice: उसका बरामदा
  rationale: मन्दिर-द्वार के स्थापत्य-सन्दर्भ में אֵלָם आगे निकले हुए बरामदे या प्रवेश-कक्ष को दर्शाता है। ‘बरामदा’ आधुनिक हिन्दी में सहज और स्थापत्य की दृष्टि से उपयुक्त है।
- source_word: לֶחָצֵר הַחִיצוֹנָה
  choice: बाहरी आँगन की ओर था
  rationale: ל यहाँ दिशा या अभिमुखता बताता है। यह अनुवाद स्थानिक सम्बन्ध को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וְתִמֹרִים
  choice: खजूर के पेड़
  rationale: תִמֹרִים का शाब्दिक अर्थ ‘खजूर के पेड़’ है। स्थापत्य-सन्दर्भ में सम्भवतः उनकी नक्काशी या आकृतियाँ अभिप्रेत हैं, पर मूल शब्द इस बात को स्पष्ट नहीं करता; इसलिए सम्भावित अर्थ पाद-टिप्पणी में रखा गया है।
- source_word: אֶל־אֵילָיו
  choice: उसके द्वार-स्तंभों पर
  rationale: इस बार-बार आने वाले द्वार-वर्णन में אֵילָיו द्वार के पार्श्ववर्ती खंभों या चौखट के स्तंभों को सूचित करता है। ‘द्वार-स्तंभ’ सामान्य पाठक के लिए स्पष्ट है और स्थापत्य अर्थ बनाए रखता है।
- source_word: מִפֹּה וּמִפֹּה
  choice: इस ओर और उस ओर
  rationale: यह इब्रानी मुहावरा दोनों ओर समान रूप से स्थित वस्तुओं का बोध कराता है। चुना हुआ रूप उसकी वितरणात्मक अभिव्यक्ति को बनाए रखता है।
- source_word: וּשְׁמֹנֶה מַעֲלוֹת מַעֲלוֹ
  choice: उस तक आठ सीढ़ियाँ चढ़ती थीं
  rationale: מַעֲלוֹת सीढ़ियों को और מַעֲלוֹ उस संरचना तक की चढ़ाई को दर्शाता है। हिन्दी वाक्य स्वाभाविक ढंग से सीढ़ियों की संख्या और उनके गन्तव्य दोनों को व्यक्त करता है।
