  yaml_path: translation/ot/ezekiel/047/005.yaml
  text: Again he measured a thousand[a], and it was a river that I could not cross, because the waters had risen—waters to swim in[b], a river that could not be crossed.
translation:
  language: hi
  text: फिर उसने एक हज़ार नापा। वह ऐसी नदी थी जिसे मैं पार नहीं कर सकता था, क्योंकि पानी बढ़ गया था—तैरने लायक पानी[b], ऐसी नदी जिसे पार नहीं किया जा सकता था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: शाब्दिक रूप से, ‘तैरने का पानी,’ अर्थात इतना गहरा पानी कि उसमें तैरा जाए।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּמָד אֶלֶף
  choice: फिर उसने एक हज़ार हाथ नापा
  rationale: वय्यिक्तोल कथा-क्रम और पिछली मापों की पुनरावृत्ति को आगे बढ़ाता है, इसलिए ‘फिर’ स्वाभाविक है। इब्रानी में माप की इकाई यहाँ अनुक्त है, पर निकटवर्ती संदर्भ (पद 3–4) से ‘हाथ’ स्पष्ट है।
- source_word: נַחַל
  choice: नदी
  rationale: इस दर्शन में जलधारा इतनी गहरी हो चुकी है कि उसमें तैरना पड़ता है; इसलिए आधुनिक हिन्दी में ‘नदी’ दृश्य और अर्थ दोनों को स्वाभाविक रूप से व्यक्त करती है।
- source_word: אֲשֶׁר לֹא אוּכַל לַעֲבֹר
  choice: जिसे मैं पार नहीं कर सकता था
  rationale: אוּכַל सामर्थ्य और לַעֲבֹר पार जाने को व्यक्त करता है; यह हिन्दी रूप संक्षिप्त और सटीक है।
- source_word: גָאוּ הַמַּיִם
  choice: पानी बढ़ गया था
  rationale: גאה यहाँ पानी के चढ़ने, बढ़ने या उमड़ने का बोध देता है। ‘बढ़ गया था’ प्रगतिशील गहराई को स्पष्ट रखता है और ‘चढ़ गया’ की अपेक्षा अधिक स्वाभाविक है।
- source_word: מֵי שָׂחוּ
  choice: तैरने लायक पानी
  rationale: शाब्दिक संरचना ‘तैरने का पानी’ है और आशय इतना गहरा पानी है जिसमें तैरा जाए। चुना हुआ रूप हिन्दी में सहज रहते हुए इस चित्र को बचाता है।
- source_word: נַחַל אֲשֶׁר לֹא יֵעָבֵר
  choice: ऐसी नदी जिसे पार नहीं किया जा सकता था
  rationale: निफ़अल रूप निष्क्रिय/अव्यक्त कर्ता का भाव देता है। ‘नदी’ की पुनरावृत्ति इब्रानी के बलाघात को बनाए रखती है।
