  text: וְ/עַל הַ/נַּ֣חַל יַעֲלֶ֣ה עַל שְׂפָת֣/וֹ מִ/זֶּ֣ה וּ/מִ/זֶּ֣ה כָּל עֵֽץ מַ֠אֲכָל לֹא יִבּ֨וֹל עָלֵ֜/הוּ וְ/לֹֽא יִתֹּ֣ם פִּרְי֗/וֹ לָֽ/חֳדָשָׁי/ו֙ יְבַכֵּ֔ר כִּ֣י מֵימָ֔י/ו מִן הַ/מִּקְדָּ֖שׁ הֵ֣מָּה יֽוֹצְאִ֑ים ו/היו פִרְי/וֹ֙ לְ/מַֽאֲכָ֔ל וְ/עָלֵ֖/הוּ לִ/תְרוּפָֽה־־׀׀־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/047/012.yaml
  text: Along the river[a], on its bank, on this side and on that side, every kind of tree for food will grow. Its leaf will not wither, and its fruit will not fail; every month it will bear fresh fruit, because its waters are coming out from the sanctuary. Its fruit will be for food[c][b], and its leaf for healing.
translation:
  language: hi
  text: नदी के किनारे, उसके इस पार और उस पार[a], हर प्रकार के फलदार पेड़ उगेंगे। उनके पत्ते नहीं मुरझाएँगे और उनका फल कभी समाप्त नहीं होगा। हर महीने उनमें नए पके फल लगेंगे[b], क्योंकि नदी का जल पवित्रस्थान से निकलता है। उनका फल भोजन के लिए और उनके पत्ते उपचार के लिए होंगे[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, ‘इस ओर और उस ओर’; अर्थात नदी के दोनों किनारों पर।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी क्रिया में पहले या आरम्भ में पकने वाले फल उत्पन्न करने का भाव है; इसका अनुवाद ‘हर महीने ताजे फल लगेंगे’ भी हो सकता है।
    reason: lexical_alternative
  - marker: c
    text: या ‘आरोग्य के लिए,’ ‘औषधि के लिए’ अथवा ‘रोग के उपाय के लिए।’
    reason: lexical_alternative
lexical_decisions:
- source_word: יַעֲלֶה
  choice: उगेंगे
  rationale: क्रिया का मूल अर्थ ‘ऊपर जाना’ है, पर वनस्पति के संदर्भ में ‘उगना’ स्वाभाविक और सटीक हिन्दी है।
- source_word: שְׂפָתוֹ
  choice: किनारे
  rationale: शाब्दिक अर्थ ‘होंठ/छोर’ है; नदी के संदर्भ में ‘किनारा’ उपयुक्त है।
- source_word: מִזֶּה וּמִזֶּה
  choice: इस पार और उस पार
  rationale: यह नदी के दोनों ओर होने का बोध देता है और इब्रानी की स्थानिक अभिव्यक्ति को जीवंत रखता है।
- source_word: כָּל עֵץ מַאֲכָל
  choice: हर प्रकार के फलदार पेड़
  rationale: संदर्भ उन पेड़ों का है जिनका फल भोजन के काम आता है; यह आधुनिक हिन्दी में सहज है।
- source_word: לֹא יִבּוֹל עָלֵהוּ
  choice: उनके पत्ते नहीं मुरझाएँगे
  rationale: נבל वनस्पति के मुरझाने या कुम्हलाने को दर्शाता है। सामूहिक एकवचन को हिन्दी में स्वाभाविक बहुवचन से व्यक्त किया गया है।
- source_word: וְלֹא יִתֹּם פִּרְיוֹ
  choice: उनका फल कभी समाप्त नहीं होगा
  rationale: क्रिया का अर्थ चुक जाना या अंत हो जाना है; ‘कभी’ निरंतर फलने के भाव को स्पष्ट करता है।
- source_word: לָחֳדָשָׁיו
  choice: हर महीने
  rationale: यह नियमित, महीने-दर-महीने फलने को स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: יְבַכֵּר
  choice: नए पके फल लगेंगे
  rationale: क्रिया में पहले या आरम्भ में पकने वाले फल का भाव है; मासिक उपज के संदर्भ में ‘नए पके फल’ उस अर्थ को पठनीय हिन्दी में रखता है।
- source_word: מֵימָיו
  choice: नदी का जल
  rationale: इब्रानी बहुवचन ‘उसके जल’ को हिन्दी में स्वाभाविक सामूहिक एकवचन से व्यक्त किया गया है और संदर्भ की अस्पष्टता से बचने के लिए ‘नदी’ दोहराया गया है।
- source_word: מִן הַמִּקְדָּשׁ
  choice: पवित्रस्थान से
  rationale: מִקְדָּשׁ मंदिर-दर्शन के पवित्र स्थान या धर्मस्थान को दर्शाता है; ‘पवित्रस्थान’ सीधा और संप्रदाय-निरपेक्ष है।
- source_word: לִתְרוּפָה
  choice: उपचार के लिए
  rationale: शब्द आरोग्य, औषधीय उपयोग या रोग के उपाय का बोध देता है; ‘उपचार’ अर्थ को अनावश्यक रूप से केवल औषधि तक सीमित नहीं करता।
theological_decisions:
- issue: मंदिर-दर्शन में नदी और पेड़ों की जीवनदायी प्रचुरता
  choice: 'दृश्य को उसके प्रत्यक्ष रूप में रखा गया है: पवित्रस्थान से निकला जल पेड़ों को निरंतर फल और उपचारकारी पत्ते देता है।'
  alternative: मुख्य पाठ में इसे स्पष्ट रूप से संस्कारात्मक, कलीसियाई या अंतकालीन प्रतीक के रूप में समझाना।
  rationale: मूल पद समृद्ध धार्मिक प्रतीक प्रस्तुत करता है, पर स्वयं उसका बाद का धर्मवैज्ञानिक अर्थ निश्चित नहीं करता; इसलिए अनुवाद पाठक पर कोई विशिष्ट व्याख्या नहीं थोपता।
- issue: יְבַכֵּר में पहले या नए पके फल का भाव
  choice: ‘नए पके फल’ द्वारा उस विशेष अर्थ को मुख्य पाठ में बनाए रखा गया है।
  alternative: केवल ‘ताजे फल’ या सामान्यतः ‘फल देगा’।
  rationale: सामान्य अनुवाद अर्थ को सहज बनाता, पर मूल क्रिया के पहले/आरम्भिक पकने के भाव को दबा देता।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण शैली रखी गई है। ‘फलदार पेड़,’ ‘मुरझाएँगे’ और ‘उपचार’ सामान्य पाठकों के लिए बोधगम्य हैं। इब्रानी के सामूहिक एकवचन पेड़/पत्ता/फल को हिन्दी वाक्य-संगति के लिए बहुवचन में व्यक्त किया गया है, जबकि प्रत्येक प्रकार के पेड़ पर लागू अर्थ सुरक्षित है।
