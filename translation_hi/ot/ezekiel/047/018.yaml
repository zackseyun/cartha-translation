translation_notes:
  register: भाषा आधुनिक मानक हिंदी में, गरिमापूर्ण किंतु सामान्य पाठकों के लिए सुबोध रखी गई है। लंबे इब्रानी सीमा-वाक्य को दो हिंदी वाक्यों में बाँटा गया है। मूल की भौगोलिक अनिश्चितता—विशेषकर ‘सीमा से’—को बिना अनुमान से भरने के सुरक्षित रखा गया है।
