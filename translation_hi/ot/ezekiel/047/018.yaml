  text: וּ/פְאַ֣ת קָדִ֡ים מִ/בֵּ֣ין חַוְרָ֣ן וּ/מִ/בֵּין דַּמֶּשֶׂק֩ וּ/מִ/בֵּ֨ין הַ/גִּלְעָ֜ד וּ/מִ/בֵּ֨ין אֶ֤רֶץ יִשְׂרָאֵל֙ הַ/יַּרְדֵּ֔ן מִ/גְּב֛וּל עַל הַ/יָּ֥ם הַ/קַּדְמוֹנִ֖י תָּמֹ֑דּוּ וְ/אֵ֖ת פְּאַ֥ת קָדִֽימָ/ה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/047/018.yaml
  text: And the eastern side shall be from between Hauran and Damascus[a], and between Gilead and the land of Israel, the Jordan, from the border to the eastern sea; you shall measure the eastern side.
translation:
  language: hi
  text: पूर्वी सीमा हौरान और दमिश्क के बीच तथा गिलाद और इस्राएल देश के बीच से होकर, यरदन के साथ-साथ, सीमा से पूर्वी सागर[a] तक होगी। तुम पूर्वी सीमा को नापोगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात् संभवतः मृत सागर; इब्रानी में ‘पूर्वी सागर’।
    reason: मूल के वर्णनात्मक नाम ‘पूर्वी सागर’ को मुख्य पाठ में बनाए रखते हुए उसके संभावित भौगोलिक संकेत को स्पष्ट करना।
lexical_decisions:
- source_word: פְאַת קָדִים / פְאַת קָדִימָה
  choice: पूर्वी सीमा
  rationale: इस भू-सीमा-वर्णन में פאה किसी ज्यामितीय कोने के बजाय देश की एक दिशा की सीमा या भुजा को दर्शाता है। हिंदी में ‘पूर्वी सीमा’ प्रसंग को स्वाभाविक और स्पष्ट रखता है।
- source_word: מִבֵּין ... וּמִבֵּין ...
  choice: के बीच तथा ... के बीच से होकर
  rationale: दोहराई गई מן + בין रचना बताती है कि सीमा नामित क्षेत्रों के बीच से गुजरती है। ‘से होकर’ हिंदी में इस भौगोलिक गति को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: חַוְרָן
  choice: हौरान
  rationale: इस स्थान-नाम का प्रचलित हिंदी लिप्यंतरण।
- source_word: דַּמֶּשֶׂק
  choice: दमिश्क
  rationale: इस नगर का प्रचलित हिंदी नाम।
- source_word: הַגִּלְעָד
  choice: गिलाद
  rationale: इस क्षेत्रीय नाम का प्रचलित बाइबलीय हिंदी रूप।
- source_word: אֶרֶץ יִשְׂרָאֵל
  choice: इस्राएल देश
  rationale: मूल पदबंध में ‘देश/भूमि’ स्पष्ट रूप से उपस्थित है; इसे बनाए रखने से भूभाग और लोगों के बीच भेद स्पष्ट रहता है।
- source_word: הַיַּרְדֵּן
  choice: यरदन के साथ-साथ
  rationale: मूल में यरदन सीमा-वर्णन के बीच स्वतंत्र रूप से आता है। प्रसंग में यह नदी सीमा-रेखा का मार्ग बताती है; ‘के साथ-साथ’ हिंदी में उस संबंध को स्पष्ट करता है, बिना नदी का नाम बदलकर व्याख्यात्मक रूप देने के।
- source_word: מִגְּבוּל
  choice: सीमा से
  rationale: גְּבוּל का सामान्य अर्थ ‘सीमा’ है। मूल पाठ यह स्पष्ट नहीं करता कि यहाँ कौन-सी पहले कही गई सीमा अभिप्रेत है, इसलिए मुख्य पाठ में अनिर्दिष्टता रखी गई है।
- source_word: הַיָּם הַקַּדְמוֹנִי
  choice: पूर्वी सागर
  rationale: यह पदबंध शाब्दिक रूप से ‘पूर्वी सागर’ है। संभावित भौगोलिक पहचान को मुख्य पाठ में प्रतिस्थापित करने के बजाय पादटिप्पणी में दिया गया है।
- source_word: תָּמֹדּוּ
  choice: तुम नापना
  rationale: מדד का मूल अर्थ ‘नापना’ है और क्रिया बहुवचन संबोधन में है। हिंदी का निर्देशात्मक रूप सीमा निर्धारित करने की आज्ञा को सहजता से व्यक्त करता है।
