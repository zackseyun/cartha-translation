  yaml_path: translation/ot/ezekiel/047/015.yaml
  text: 'And this shall be the boundary of the land: on the north side[d][c][b][a], from the Great Sea by the way of Hethlon to Lebo-zedad.'
translation:
  language: hi
  text: 'और देश की सीमा यह होगी[a]: उत्तरी ओर, महान समुद्र[b] से हेतलोन के मार्ग[c] से, सदाद की ओर जाते हुए[d]।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “और देश की सीमा यह है।” इब्रानी में ‘है’ या ‘होगी’ के लिए कोई क्रिया स्पष्ट रूप से नहीं लिखी गई है।
    reason: lexical_alternative
  - marker: b
    text: “महान समुद्र” भूमध्य सागर को सूचित करता है।
    reason: cultural_note
  - marker: c
    text: या, “हेतलोन की ओर जाने वाले मार्ग से।”
    reason: lexical_alternative
  - marker: d
    text: या, “सदाद के प्रवेश की ओर।” इब्रानी पद को स्थान-नाम के साथ जुड़ा हुआ भी समझा जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְזֶה
  choice: और … यह होगी
  rationale: यह सीमा-विवरण का परिचय देता है। इब्रानी में क्रिया व्यक्त नहीं है; प्रसंग में भावी व्यवस्था को देखते हुए हिंदी में ‘होगी’ स्वाभाविक है।
- source_word: גְּבוּל הָאָרֶץ
  choice: देश की सीमा
  rationale: भूमि-विभाजन के भौगोलिक संदर्भ में ‘सीमा’ सटीक और स्वाभाविक है; הָאָרֶץ यहाँ वर्णित देश अथवा भूमि को सूचित करता है।
- source_word: לִפְאַת צָפוֹנָה
  choice: उत्तर की ओर
  rationale: यह देश की उत्तरी दिशा अथवा उत्तरी पार्श्व को बताता है और हिंदी में सीमा-विवरण की स्वाभाविक अभिव्यक्ति है।
- source_word: מִן הַיָּם הַגָּדוֹל
  choice: महासागर से
  rationale: शाब्दिक पदनाम ‘महान समुद्र’ है, जो भूमध्य सागर को सूचित करता है। ‘महासागर’ संक्षिप्त भौगोलिक पदनाम के रूप में मुख्य पाठ में रखा गया है और पहचान पादटिप्पणी में दी गई है।
- source_word: הַדֶּרֶךְ חֶתְלֹן
  choice: हेतलोन के मार्ग से होते हुए
  rationale: דֶּרֶךְ सड़क, मार्ग या दिशा का अर्थ दे सकता है। यह रूप सीमा-रेखा के मार्ग को स्वाभाविक हिंदी में व्यक्त करता है, जबकि वैकल्पिक संबंध पादटिप्पणी में सुरक्षित है।
- source_word: לְבוֹא צְדָדָה
  choice: सदाद के प्रवेश तक
  rationale: सीमा-सूत्र में לְבוֹא किसी स्थान के प्रवेश, पहुँच या उसकी ओर जाने को सूचित कर सकता है। ‘प्रवेश तक’ निकट-शाब्दिक है; दिशात्मक अर्थ पादटिप्पणी में दिया गया है।
- source_word: צְדָדָה
  choice: सदाद
  rationale: स्थान-नाम को प्रचलित ध्वन्यात्मक रूप में लिप्यंतरित किया गया है; अंतिम दिशासूचक ה को नाम का अंग नहीं माना गया।
