lexical_decisions:
- source_word: וְחִלַּקְתֶּם
  choice: इसलिए तुम … बाँट लेना
  rationale: חלק का पिएल रूप भूमि के विभाजन या बँटवारे को दर्शाता है। आरंभिक וְ पिछले पदों में सीमाओं के वर्णन से निष्कर्षात्मक निरंतरता जोड़ता है, इसलिए स्वाभाविक हिन्दी में ‘इसलिए’ चुना गया है। आज्ञार्थक भाव वाले इस विधान के लिए ‘बाँट लेना’ सहज और स्पष्ट है।
- source_word: אֶת
  choice: '[प्रत्यक्ष कर्म-चिह्न, अनूदित नहीं]'
  rationale: हिब्रू का यह प्रत्यक्ष कर्म-चिह्न हिन्दी में अलग शब्द के रूप में व्यक्त नहीं होता।
- source_word: הָאָרֶץ הַזֹּאת
  choice: इस देश को
  rationale: אֶרֶץ का मूल अर्थ ‘देश/भूमि’ है। यहाँ प्रतिज्ञात भौगोलिक क्षेत्र के संदर्भ में ‘इस देश’ सामान्य पाठक के लिए स्वाभाविक है और कर्मकारक ‘को’ हिब्रू वाक्य की कर्म-संरचना स्पष्ट करता है।
- source_word: לָכֶם
  choice: आपस में
  rationale: शाब्दिक अर्थ ‘अपने लिए/तुम्हारे लिए’ है; भूमि को समुदाय के भीतर बाँटने के संदर्भ में ‘आपस में’ उसके वितरणात्मक आशय को सहज हिन्दी में व्यक्त करता है।
- source_word: לְשִׁבְטֵי יִשְׂרָאֵל
  choice: इस्राएल के गोत्रों के अनुसार
  rationale: לְ यहाँ उन गोत्रीय इकाइयों के संबंध में वितरण दिखाता है जिनके अनुसार देश बाँटा जाना है। ‘के अनुसार’ तत्काल संदर्भ में बँटवारे की गोत्र-आधारित व्यवस्था स्पष्ट करता है, जबकि ‘गोत्रों के लिए’ सम्भव अधिक शाब्दिक विकल्प है।
