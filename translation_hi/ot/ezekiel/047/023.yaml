id: EZK.47.23
reference: Ezekiel 47:23
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/הָיָ֣ה בַ/שֵּׁ֔בֶט אֲשֶׁר גָּ֥ר הַ/גֵּ֖ר אִתּ֑/וֹ שָׁ֚ם תִּתְּנ֣וּ נַחֲלָת֔/וֹ נְאֻ֖ם אֲדֹנָ֥/י יְהוִֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/047/023.yaml
  text: And it shall be that in the tribe with which the sojourner resides[a], there you shall give him his inheritance, declares the Lord GOD.
translation:
  language: hi
  text: और ऐसा हो कि जिस गोत्र में परदेशी निवास करता हो, वहीं तुम उसे उसका उत्तराधिकार-भाग देना—प्रभु यहोवा की यह घोषणा है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהָיָה
  choice: और ... हो
  rationale: यह भविष्याभिमुख कानूनी प्रावधान को आगे बढ़ाता है; हिंदी में शर्तात्मक वाक्य-रचना के भीतर इसे स्वाभाविक रूप से व्यक्त किया गया है।
- source_word: בַשֵּׁבֶט
  choice: जिस गोत्र के बीच
  rationale: भूमि-विभाजन के संदर्भ में שֵׁבֶט किसी दंड या राजदंड का नहीं, बल्कि गोत्र और उसके भूभाग का द्योतक है।
- source_word: אֲשֶׁר גָּר הַגֵּר אִתּוֹ
  choice: जिस गोत्र के बीच परदेशी रहता हो
  rationale: גֵּר अस्थायी यात्री नहीं, इस्राएली समुदाय के बीच बसा गैर-मूल निवासी है। אִתּוֹ के संबंध को गोत्र के साथ वितरणात्मक रूप से व्यक्त किया गया है।
- source_word: שָׁם
  choice: वहीं
  rationale: 'मूल का स्थान-संबंधी बल सुरक्षित है: विरासत उसी गोत्र में दी जानी है जहाँ वह रहता है।'
- source_word: תִּתְּנוּ
  choice: तुम उसे ... देना
  rationale: द्वितीय पुरुष बहुवचन के कानूनी निर्देश को आधुनिक हिंदी में प्रत्यक्ष और स्वाभाविक आदेश के रूप में रखा गया है।
- source_word: נַחֲלָתוֹ
  choice: उसकी विरासत
  rationale: נַחֲלָה यहाँ भूमि में मिले उत्तराधिकार-भाग को सूचित करता है; 'विरासत' बाइबलीय और सामान्य हिंदी दोनों में उपयुक्त है।
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: प्रभु यहोवा की यह घोषणा है
  rationale: भविष्यद्वाणी की घोषणात्मक रीति को स्पष्ट रखा गया है और אֲדֹנָי तथा יהוה दोनों को अलग-अलग 'प्रभु' और 'यहोवा' से व्यक्त किया गया है।
theological_decisions:
- issue: אֲדֹנָי יְהוִה में वाचा के नाम יהוה का अनुवाद
  choice: प्रभु यहोवा
  alternative: प्रभु परमेश्वर
  rationale: मूल में सामान्य उपाधि אֲדֹנָי के बाद परमेश्वर का विशिष्ट वाचा-नाम יהוה है। 'प्रभु यहोवा' दोनों की भिन्नता बनाए रखता है और किसी एक व्याख्यात्मक परंपरा से अर्थ को ढकता नहीं।
- issue: גֵּר की सामुदायिक-कानूनी स्थिति
  choice: परदेशी
  alternative: निवासी विदेशी
  rationale: '''परदेशी'' सहज और प्रतिष्ठित हिंदी है, पर टिप्पणी द्वारा स्पष्ट किया गया है कि यहाँ अस्थायी यात्री नहीं बल्कि समुदाय में बसा गैर-मूल निवासी अभिप्रेत है।'
translation_notes:
  register: आधुनिक मानक हिंदी; कानूनी-भविष्यद्वाणी स्वर को गरिमापूर्ण लेकिन सहज रखा गया है। 'वहीं' से मूल के स्थानगत जोर और दीर्घ विराम से अंतिम दिव्य घोषणा का बल प्रकट किया गया है।
