review_pass:
  verdict: revise
  source_fidelity: Draft accurately identifies the tribal land-allotment setting, the resident status of גֵּר, the location emphasis of שָׁם, and the divine formula. However, 'और जिस गोत्र के बीच...' does not clearly represent the introductory וְהָיָה, and 'विरासत' alone can sound broader than the allotted hereditary share intended by נַחֲלָתוֹ.
  naturalness: The revised wording is modern, formal Hindi appropriate to a legal-prophetic pronouncement. 'जिस गोत्र में' is more idiomatic than 'जिस गोत्र के बीच' for residence and allocation; 'उत्तराधिकार-भाग' makes the land-allotment sense clear without undue expansion.
  terminology: '''गोत्र'', ''परदेशी'', and ''प्रभु यहोवा'' suitably preserve the source categories and the distinction of אֲדֹנָי from יהוה. The footnote retains ''निवासी विदेशी'' as a lexical alternative and explains that the term does not mean a transient traveler.'
  issues:
  - severity: low
    issue: The introductory formula וְהָיָה is only indirectly reflected in the draft.
    rationale: The initial 'और' plus a relative clause can be read as an incomplete continuation in Hindi. 'और ऐसा हो कि' naturally conveys the formula's future-oriented legal force.
  - severity: low
    issue: '''उसकी विरासत'' is potentially broad in Hindi.'
    rationale: In this territorial-allotment context, נַחֲלָתוֹ denotes the person's hereditary allotted share. 'उसका उत्तराधिकार-भाग' better conveys this while retaining the source sense.
  revised_text: और ऐसा हो कि जिस गोत्र में परदेशी निवास करता हो, वहीं तुम उसे उसका उत्तराधिकार-भाग देना—प्रभु यहोवा की यह घोषणा है।
  revised_footnotes:
  - marker: a
    text: ‘परदेशी’ यहाँ किसी अस्थायी यात्री को नहीं, बल्कि इस्राएल के समुदाय में बसा हुआ गैर-मूल निवासी को दर्शाता है; इसे ‘निवासी विदेशी’ भी कहा जा सकता है।
    reason: lexical_alternative
  revision_rationale: संशोधन वְהָיָה की कानूनी-भविष्याभिमुख भूमिका को स्पष्ट करता है, निवास और भूमि-वितरण के लिए स्वाभाविक हिंदी प्रयोग करता है, तथा נַחֲלָה के उत्तराधिकार-आवंटन संबंधी अर्थ को अधिक सटीक बनाता है। कोई विवादित व्याख्या नहीं जोड़ी गई है।
