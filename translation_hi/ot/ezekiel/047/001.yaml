base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/047/001.yaml
  text: Then he brought me back to the entrance of the house[a], and behold, water was coming out from under the threshold of the house eastward, because the front of the house faced east; and the water was flowing down from under the south side of the house[b], on the right side, south of the altar.
translation:
  language: hi
  text: तब वह मुझे भवन[a] के प्रवेश-द्वार पर वापस ले आया, और देखो, भवन की देहरी के नीचे से पानी पूर्व की ओर निकल रहा था, क्योंकि भवन का मुख पूर्व की ओर था; और पानी भवन के दाहिने पार्श्व[b] के नीचे से, वेदी के दक्षिण की ओर से, नीचे बह रहा था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “मंदिर।” मूल हिब्रू में शाब्दिक रूप से “घर/भवन” है, जो यहेजकेल के दर्शन में मंदिर-भवन को दर्शाता है।
    reason: lexical_alternative
  - marker: b
    text: मूल हिब्रू में “भवन के कंधे के नीचे से, दाहिनी ओर का।” यहाँ “कंधा” किसी संरचना के पार्श्व के लिए प्रयुक्त स्थापत्य अभिव्यक्ति है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְשִׁבֵנִי
  choice: वह मुझे…वापस ले आया
  rationale: שׁוב के हिफ़ील रूप का कारणवाचक अर्थ ‘मुझे लौटाया/वापस ले आया’ है; आधुनिक हिन्दी में ‘वापस ले आया’ स्वाभाविक और स्पष्ट है।
- source_word: פֶּתַח הַבַּיִת
  choice: भवन के प्रवेश-द्वार
  rationale: פֶּתַח प्रवेश या द्वार को दर्शाता है। הַבַּיִת का शाब्दिक अर्थ ‘घर/भवन’ है और इस दर्शन में यह मंदिर-भवन को सूचित करता है; मुख्य पाठ में ‘भवन’ स्रोत की शब्दावली को बनाए रखता है।
- source_word: וְהִנֵּה
  choice: और देखो
  rationale: यह ध्यान आकृष्ट करने वाला हिब्रू कथन-सूचक है; ‘और देखो’ उसका प्रत्यक्ष और गरिमापूर्ण हिन्दी रूप है।
- source_word: מַיִם יֹצְאִים
  choice: पानी…निकल रहा था
  rationale: מַיִם रूप की दृष्टि से बहुवचन है, पर हिन्दी में ‘पानी’ सामान्यतः एकवचन भाव में प्रयुक्त होता है। कृदन्त निरंतर चल रही क्रिया को व्यक्त करता है।
- source_word: מִתַּחַת מִפְתַּן
  choice: देहरी के नीचे से
  rationale: מִפְתָּן द्वार की देहरी है; हिन्दी का यह स्थानवाचक प्रयोग मूल अभिव्यक्ति के निकट और स्वाभाविक है।
- source_word: קָדִימָה
  choice: पूर्व की ओर
  rationale: यह दिशासूचक रूप है और पूर्वाभिमुख गति बताता है।
- source_word: כִּי פְנֵי הַבַּיִת קָדִים
  choice: क्योंकि भवन का सामने का भाग पूर्व की ओर था
  rationale: वाक्य पानी की दिशा का कारण भवन के पूर्वाभिमुख होने से बताता है; ‘सामने का भाग’ פְנֵי के स्थानगत अर्थ को स्पष्ट रखता है।
- source_word: יֹרְדִים
  choice: नीचे बह रहा था
  rationale: मूल क्रिया ‘नीचे जाना/उतरना’ है; पानी के संदर्भ में ‘नीचे बहना’ गति और प्रवाह दोनों को स्वाभाविक रूप से व्यक्त करता है।
- source_word: מִכֶּתֶף הַבַּיִת הַיְמָנִית
  choice: भवन के दाहिने पार्श्व के नीचे से
  rationale: כָּתֵף का मूल अर्थ ‘कंधा’ है, पर स्थापत्य प्रयोग में यह किसी संरचना के पार्श्व को दर्शाता है। הַיְמָנִית को अलग से ‘दाहिने’ द्वारा सुरक्षित रखा गया है।
- source_word: מִנֶּגֶב לַמִּזְבֵּחַ
  choice: वेदी के दक्षिण की ओर से
  rationale: נֶגֶב यहाँ दिशात्मक रूप से ‘दक्षिण’ है; מִן स्रोत-बिंदु का भाव देता है, इसलिए ‘दक्षिण की ओर से’ मूल संबंध को बनाए रखता है।
