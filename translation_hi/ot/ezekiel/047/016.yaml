base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/047/016.yaml
  text: Hamath[a], Berothah, Sibraim—which is between the border of Damascus and the border of Hamath—Hazer-hattikon[c][b], which is toward the border of Hauran.
translation:
  language: hi
  text: हमात, बेरोता[a], सिब्रैम—जो दमिश्क की सीमा और हमात की सीमा के बीच है—हासेर-हत्तीक़ोन[b], जो हौरान की सीमा की ओर है।[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी पाठ में ‘बेरोता’ है; कुछ विद्वान इसकी तुलना 2 शमूएल 8:8 के संबंधित स्थान-नाम ‘बेरोतै’ से करते हैं।
    reason: alternative_reading
  - marker: b
    text: ‘हासेर-हत्तीक़ोन’ संभवतः एक स्थान-नाम है; इसके शब्दों का शाब्दिक अर्थ लगभग ‘बीच का घेरा/बसाव’ है।
    reason: lexical_alternative
  - marker: c
    text: या, ‘जो हौरान की सीमा के पास है।’
    reason: lexical_alternative
