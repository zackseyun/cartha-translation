  text: You shall inherit it[a], each like his brother, concerning which I raised my hand to give it to your fathers[c][b]; and this land shall fall to you as an inheritance.
translation:
  language: hi
  text: तुम उस देश को विरासत में पाओगे; हर एक अपने भाई के समान हिस्सा पाएगा। उस देश को तुम्हारे पूर्वजों को देने के लिए मैंने अपना हाथ उठाया था[a]; और यह देश तुम्हारे हिस्से में विरासत के रूप में आएगा[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “अपना हाथ उठाया” शपथ लेने का इब्रानी मुहावरा है; अर्थात्, “मैंने शपथ खाई थी।”
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में शाब्दिक रूप से “यह देश तुम्हारे लिए विरासत में पड़ेगा”; आशय है कि वह तुम्हारे हिस्से में विरासत के रूप में आएगा।
    reason: lexical_alternative
lexical_decisions:
- source_word: וּנְחַלְתֶּם אוֹתָהּ
  choice: तुम उसका भाग पाओगे
  rationale: נחל यहाँ देश को बाँटने/विरासत के रूप में पाने के अर्थ में है। 'उसका भाग पाओगे' अगले समान बँटवारे के वाक्यांश से स्वाभाविक रूप से जुड़ता है और स्त्रीलिंग प्रत्यय का संदर्भ 'देश' से बनाए रखता है।
- source_word: אִישׁ כְּאָחִיו
  choice: हर एक को अपने भाई के समान
  rationale: शाब्दिक रूप से 'एक पुरुष अपने भाई के समान'; प्रसंग में लोगों के बीच समान हिस्से का भाव है। हिंदी में यह रूप मूल पुरुषवाची संबंध और वितरण—दोनों को बनाए रखता है।
- source_word: אֲשֶׁר נָשָׂאתִי אֶת יָדִי
  choice: इस देश को ... देने के लिए मैंने अपना हाथ उठाया था
  rationale: हाथ उठाना शपथ लेने का इब्रानी मुहावरा है। मुख्य पाठ में मूल बिंब रखा गया है और उसका अर्थ पादटिप्पणी में स्पष्ट किया गया है।
- source_word: לְתִתָּהּ לַאֲבֹתֵיכֶם
  choice: इस देश को तुम्हारे पूर्वजों को देने के लिए
  rationale: स्त्रीलिंग प्रत्यय का स्पष्ट संदर्भ देश है। אבות व्यापक रूप से पिछली पीढ़ियों/पूर्वजों को दर्शाता है; आधुनिक हिंदी में 'पूर्वजों' स्वाभाविक और सटीक है।
- source_word: וְנָפְלָה הָאָרֶץ הַזֹּאת לָכֶם בְּנַחֲלָה
  choice: और यह देश तुम्हें विरासत में मिलेगा
  rationale: נפל यहाँ चिट्ठी या बँटवारे में किसी के हिस्से आने का मुहावरा है। हिंदी का 'विरासत में मिलेगा' अर्थ को सहजता से व्यक्त करता है।
theological_decisions:
- issue: हाथ उठाने की शपथ-विधि
  choice: मुख्य पाठ में 'मैंने अपना हाथ उठाया था'
  alternative: '''मैंने शपथ खाई थी'''
  rationale: मूल भाषा का ठोस शपथ-बिंब सुरक्षित रखा गया है; पादटिप्पणी उसके अभिप्राय को बताती है, ताकि बिंब और अर्थ दोनों उपलब्ध रहें।
- issue: אִישׁ כְּאָחִיו में वितरण और समानता
  choice: हर एक को अपने भाई के समान
  alternative: हर एक को बराबर हिस्सा
  rationale: चुना हुआ पाठ समानता का आशय देता है, पर मूल के 'भाई' संबंध को सामान्यीकृत करके मिटाता नहीं।
- issue: נפל के विरासत-वितरण मुहावरे का अनुवाद
  choice: तुम्हें विरासत में मिलेगा
  alternative: तुम्हारे लिए विरासत में पड़ेगा
  rationale: शाब्दिक 'गिरना/पड़ना' आधुनिक हिंदी में यहाँ अस्पष्ट या अस्वाभाविक होता; अर्थगत मुहावरा भूमि के आवंटित विरासत बनने को स्पष्ट करता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। भूमि के लिए लगातार 'देश' प्रयुक्त है। मूल शपथ-बिंब मुख्य पाठ में सुरक्षित है, जबकि विरासत 'पड़ने' के मुहावरे को स्वाभाविक हिंदी में अर्थानुकूल रूप दिया गया है।
