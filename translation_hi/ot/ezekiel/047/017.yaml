  text: וְ/הָיָ֨ה גְב֜וּל מִן הַ/יָּ֗ם חֲצַ֤ר עֵינוֹן֙ גְּב֣וּל דַּמֶּ֔שֶׂק וְ/צָפ֥וֹן צָפ֖וֹנָ/ה וּ/גְב֣וּל חֲמָ֑ת וְ/אֵ֖ת פְּאַ֥ת צָפֽוֹן־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/047/017.yaml
  text: So the border shall be from the sea to Hazar-enon[a], at the border of Damascus; and on the north, northward, with the border of Hamath[b]. This shall be the north side.
translation:
  language: hi
  text: इस प्रकार सीमा समुद्र[a] से हसर-एनोन[b] तक, दमिश्क की सीमा पर होगी; और उत्तर में, उत्तर की ओर, वह हमात की सीमा के साथ होगी। यही उत्तर की ओर की सीमा होगी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: हिब्रू में केवल ‘समुद्र’ है। प्रसंग में इसका अर्थ भूमध्य सागर है, लेकिन यहाँ मूल पाठ ‘बड़ा समुद्र’ नहीं कहता।
    reason: cross_reference
  - marker: b
    text: ‘हसर-एनोन’ का पारंपरिक लिप्यंतरण ‘हसर-एनान’ भी किया जाता है।
    reason: alternative_reading
lexical_decisions:
- source_word: וְהָיָה
  choice: इस प्रकार ... होगी
  rationale: यह पद सीमा का अगला विनिर्देश प्रस्तुत करता है। ‘होगी’ इस भौगोलिक-विधिक वर्णन में हिब्रू क्रियारूप का भाव स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: גְּבוּל
  choice: सीमा
  rationale: प्रदेश की निर्धारित हद के लिए ‘सीमा’ आधुनिक मानक हिन्दी का स्वाभाविक और सुस्पष्ट शब्द है।
- source_word: מִן הַיָּם
  choice: समुद्र से
  rationale: हिब्रू पाठ में केवल ‘समुद्र से’ है। प्रसंग भूमध्य सागर की ओर संकेत करता है, पर यहाँ ‘महासागर’ या ‘बड़ा समुद्र’ नहीं दोहराया गया है।
- source_word: חֲצַר עֵינוֹן
  choice: हसर-एनोन
  rationale: स्थान-नाम का अनुवाद करने के बजाय उसका देवनागरी लिप्यंतरण किया गया है; मासोरेटिक स्वरीकरण ‘एनोन’ रूप का समर्थन करता है।
- source_word: גְּבוּל דַּמֶּשֶׂק
  choice: दमिश्क की सीमा पर
  rationale: यह पदबंध हसर-एनोन की स्थिति को दमिश्क की सीमा के संबंध में बताता है।
- source_word: וְצָפוֹן צָפוֹנָה
  choice: और उत्तर में, उत्तर की ओर
  rationale: मूल पाठ में ‘उत्तर’ की पुनरावृत्ति और दिशासूचक रूप दोनों हैं; कुछ असामान्य होते हुए भी हिन्दी में इन्हें बनाए रखा गया है ताकि पाठ का जोर न मिटे।
- source_word: וּגְבוּל חֲמָת
  choice: हमात की सीमा के साथ
  rationale: संयोजक पदबंध उत्तरी विस्तार को हमात की सीमा के संबंध में परिभाषित करता है; ‘के साथ’ उसके भौगोलिक-संलग्न भाव को बनाए रखता है।
- source_word: וְאֵת פְּאַת צָפוֹן
  choice: यही उत्तरी भुजा होगी
  rationale: यह समापन पदबंध वर्णित रेखा को उत्तरी ओर अथवा भुजा के रूप में संक्षेपित करता है। भूसीमा के संदर्भ में ‘भुजा’ चारों दिशाओं के किनारों के लिए उपयुक्त है।
