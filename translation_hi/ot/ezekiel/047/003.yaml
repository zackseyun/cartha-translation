  text: בְּ/צֵאת הָ/אִ֥ישׁ קָדִ֖ים וְ/קָ֣ו בְּ/יָד֑/וֹ וַ/יָּ֤מָד אֶ֨לֶף֙ בָּֽ/אַמָּ֔ה וַ/יַּעֲבִרֵ֥/נִי בַ/מַּ֖יִם מֵ֥י אָפְסָֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/047/003.yaml
  text: As the man went out eastward with a measuring line in his hand[a], he measured a thousand cubits and led me through the water, water up to the ankles.
translation:
  language: hi
  text: जब वह पुरुष हाथ में मापने की डोरी लिए पूर्व की ओर निकला, तब उसने एक हज़ार हाथ की दूरी मापी और मुझे पानी में से गुज़ारा; पानी टखनों तक था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּצֵאת הָאִישׁ
  choice: जब वह पुरुष ... निकला
  rationale: ב prefixed infinitive construct marks a temporal clause. पुरुष refers naturally and specifically to the previously introduced male figure.
- source_word: קָדִים
  choice: पूर्व की ओर
  rationale: The word functions directionally here; this is clear, natural modern Hindi.
- source_word: וְקָו בְּיָדוֹ
  choice: हाथ में मापने की डोरी लिए
  rationale: कָו is a line or cord used for measuring in this context; the Hindi expression preserves both its function and the concrete phrase 'in his hand.'
- source_word: וַיָּמָד אֶלֶף בָּאַמָּה
  choice: उसने एक हज़ार हाथ की दूरी मापी
  rationale: אַמָּה is the cubit, conventionally rendered हाथ in Hindi biblical usage. Adding दूरी makes the measured extent explicit and idiomatic without changing the sense.
- source_word: וַיַּעֲבִרֵנִי בַמַּיִם
  choice: मुझे पानी में से पार कराया
  rationale: The Hiphil form is causative, 'caused me to pass.' पार कराया preserves that causative movement more directly than merely 'led me.'
- source_word: מֵי אָפְסָיִם
  choice: पानी टखनों तक था
  rationale: The compact Hebrew expression literally relates the water to the ankles and idiomatically indicates ankle-deep water. The Hindi rendering clearly conveys that depth.
theological_decisions: []
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण कथात्मक शैली रखी गई है। माप की प्राचीन इकाई אַמָּה के लिए प्रचलित बाइबिलीय हिन्दी 'हाथ' रखा गया है; वाक्य में 'दूरी' जोड़ने से इसे शरीर-अंग के अर्थ से अलग समझना आसान होता है।
