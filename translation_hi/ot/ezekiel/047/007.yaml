lexical_decisions:
- source_word: בְּשׁוּבֵנִי
  choice: जब मैं लौटा
  rationale: שׁוב का कालवाचक infinitive construct प्रथम पुरुष एकवचन प्रत्यय के साथ है; इसलिए यह स्वाभाविक रूप से नबी के अपने लौटने को व्यक्त करता है।
- source_word: וְהִנֵּה
  choice: तो क्या देखा कि
  rationale: यह अभिव्यक्ति अचानक दिखाई देने वाली बात की ओर ध्यान खींचती है। आधुनिक हिन्दी में यह भविष्यद्वक्ताओं की वर्णन-शैली की सजीवता को स्वाभाविक ढंग से बनाए रखती है।
- source_word: אֶל שְׂפַת הַנַּחַל
  choice: धारा के किनारे
  rationale: שׂפה का अर्थ यहाँ किनारा है और נחל दर्शन में बहते जल की धारा को सूचित करता है; ‘नदी’ मूल शब्द की अपेक्षा जलधारा का आकार अधिक निश्चित कर सकता है।
- source_word: עֵץ רַב מְאֹד
  choice: बहुत-से पेड़
  rationale: עֵץ रूप की दृष्टि से एकवचन है, पर यहाँ सामूहिक अर्थ रखता है; רַב מְאֹד पेड़ों की अत्यधिक संख्या बताता है।
- source_word: מִזֶּה וּמִזֶּה
  choice: इस ओर और उस ओर
  rationale: यह चयन इब्रानी की वितरणात्मक और स्थान-सूचक अभिव्यक्ति को बनाए रखता है; आशय धारा के दोनों किनारों से है।
