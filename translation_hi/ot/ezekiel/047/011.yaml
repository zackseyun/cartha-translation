    reason: lexical_alternative
lexical_decisions:
- source_word: בצאתו
  choice: उसके दलदली स्थान
  rationale: यह दुर्लभ स्थलाकृतिक शब्द ऐसे निचले, दलदली निकास-स्थानों का संकेत देता है जहाँ पानी ठहर सकता है। 'दलदली स्थान' आधुनिक हिन्दी में अर्थ स्पष्ट रखता है; एकवचन प्रत्यय को 'उसके' से व्यक्त किया गया है।
- source_word: וגבאיו
  choice: और कीचड़-भरे गड्ढे
  rationale: גבא का अर्थ गड्ढे, जलकुंड या दलदली अवसाद हो सकता है। समानांतर पद से भेद बनाए रखते हुए 'कीचड़-भरे गड्ढे' ठहरे हुए निचले स्थानों का स्वाभाविक चित्र प्रस्तुत करता है।
- source_word: ולא ירפאו
  choice: चंगे नहीं किए जाएँगे
  rationale: רפא के निफ़अल रूप का शाब्दिक उपचार-रूपक सुरक्षित रखा गया है। सन्दर्भ में इसका आशय पानी का मीठा या स्वस्थ किया जाना है, पर अनुवाद उस रूपक को सपाट नहीं करता।
- source_word: למלח
  choice: नमक के लिए
  rationale: ל यहाँ प्रयोजन या परिणाम का भाव दे सकता है। 'नमक के लिए' हिब्रू की संक्षिप्तता और वास्तविक अस्पष्टता दोनों बनाए रखता है।
- source_word: נתנו
  choice: छोड़ दिए जाएँगे
  rationale: निफ़अल बहुवचन का निष्क्रिय भाव रखते हुए यह हिन्दी में स्वाभाविक रूप से बताता है कि ये स्थान उपचार से बाहर रहकर नमक के लिए नियत होंगे। पादटिप्पणी अधिक शाब्दिक विकल्प देती है।
