id: EZK.47.6
reference: Ezekiel 47:6
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יֹּ֥אמֶר אֵלַ֖/י הֲ/רָאִ֣יתָ בֶן אָדָ֑ם וַ/יּוֹלִכֵ֥/נִי וַ/יְשִׁבֵ֖/נִי שְׂפַ֥ת הַ/נָּֽחַל־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/047/006.yaml
  text: Then he said to me[a], “Have you seen this[d][c][b], son of man?” Then he led me and brought me back to the bank of the stream.
translation:
  language: hi
  text: तब उसने मुझसे कहा, “हे मनुष्य के पुत्र, क्या तूने यह देखा?” फिर वह मुझे ले गया और जलधारा के किनारे पर वापस ले आया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר אֵלַי
  choice: तब उसने मुझसे कहा
  rationale: वाव-क्रमिक कथा को आगे बढ़ाता है; ‘तब’ आधुनिक हिन्दी में घटनाक्रम को स्वाभाविक रूप से व्यक्त करता है।
- source_word: הֲרָאִיתָ
  choice: क्या तूने यह देखा?
  rationale: प्रश्नवाचक कण और पूर्ण क्रिया यह पूछते हैं कि यहेजकेल ने दिखाई गई बात देखी या नहीं। ‘यह’ मूल में व्यक्त नहीं है, पर तत्काल प्रसंग में निहित कर्म को स्वाभाविक हिन्दी में स्पष्ट करता है।
- source_word: בֶן אָדָם
  choice: हे मनुष्य के पुत्र
  rationale: यहेजकेल को संबोधित करने वाला यह बार-बार आने वाला पद है। औपचारिक रूप इसकी साहित्यिक और धर्मवैचारिक प्रतिध्वनि बनाए रखता है।
- source_word: וַיּוֹלִכֵנִי
  choice: वह मुझे ले गया
  rationale: הלך के हिफ़ील रूप का कारणवाचक अर्थ यहाँ स्वाभाविक हिन्दी में ‘ले गया’ से ठीक व्यक्त होता है।
- source_word: וַיְשִׁבֵנִי
  choice: वापस ले आया
  rationale: שוב के हिफ़ील रूप में किसी को लौटाने का कारणवाचक भाव है; ‘वापस ले आया’ पूर्व स्थान की ओर वापसी स्पष्ट करता है।
- source_word: שְׂפַת הַנָּחַל
  choice: जलधारा के किनारे पर
  rationale: שְׂפַת का शाब्दिक अर्थ ‘होंठ/छोर’ है, पर जलमार्ग के संदर्भ में ‘किनारा’ स्वाभाविक है। נחל यहाँ बहती जलधारा को सूचित करता है; ‘जलधारा’ ‘नदी’ की अपेक्षा उसके आकार को अनावश्यक रूप से निश्चित नहीं करता।
theological_decisions:
- issue: संबोधन בֶן אָדָם में אָדָם का अनुवाद
  choice: मनुष्य के पुत्र
  alternative: नश्वर मनुष्य
  rationale: यह यहेजकेल में नबी के लिए नियमित संबोधन है। स्रोत की संरचना और आवर्ती साहित्यिक पद को बचाने के लिए ‘मनुष्य के पुत्र’ रखा गया है, बिना इसे किसी बाद की धर्मवैचारिक पहचान से मिला देने के।
- issue: הֲרָאִיתָ में निहित कर्म
  choice: ‘यह’ को मुख्य पाठ में स्पष्ट करना
  alternative: क्या तूने देखा?
  rationale: इब्रानी में कर्म व्यक्त नहीं है और प्रसंग से समझा जाता है। हिन्दी में ‘यह’ प्रश्न को स्वाभाविक बनाता है, पर किसी विशिष्ट व्याख्या को नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और कथात्मक है। दिव्य/स्वर्गदूत-संबोधन के प्रसंग में एकवचन निकट संबोधन ‘तू’ रखा गया है; ‘हे’ संबोधन को स्पष्ट और शास्त्रीय गरिमा वाला बनाता है।
