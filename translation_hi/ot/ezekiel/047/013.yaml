source:
  edition: WLC
  text: כֹּ֤ה אָמַר֙ אֲדֹנָ֣/י יְהוִ֔ה גֵּ֤ה גְבוּל֙ אֲשֶׁ֣ר תִּתְנַחֲל֣וּ אֶת הָ/אָ֔רֶץ לִ/שְׁנֵ֥י עָשָׂ֖ר שִׁבְטֵ֣י יִשְׂרָאֵ֑ל יוֹסֵ֖ף חֲבָלִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/047/013.yaml
  text: 'Thus says the Lord GOD: This is the boundary by which you shall apportion the land as an inheritance among the twelve tribes of Israel[a]; Joseph shall have two portions.'
translation:
  language: hi
  text: 'प्रभु यहोवा यों कहता है: “यह वह सीमा है जिसके अनुसार तुम इस्राएल के बारह गोत्रों के लिए भूमि को विरासत के रूप में बाँटोगे; यूसुफ को दो भाग मिलेंगे[a]।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: हिब्रू में संक्षेप से “यूसुफ—भाग” है। ‘दो’ इस भूमि-विभाजन के संदर्भ में बहुवचन का स्पष्टार्थ है; अर्थात यूसुफ को दो भू-भाग मिलेंगे।
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  choice: प्रभु यहोवा
  rationale: अֲדֹנָי को ‘प्रभु’ और परमेश्वर के व्यक्तिगत वाचा-नाम יהוה को ‘यहोवा’ से व्यक्त किया गया है; इससे संयुक्त उपाधि स्वाभाविक हिन्दी में बनी रहती है और दोनों पद अलग पहचाने जाते हैं।
- source_word: גֵּה גְבוּל
  choice: यह उस भूभाग की सीमा है
  rationale: दर्शक पद और גְבוּל आगामी भू-सीमा का परिचय देते हैं। हिन्दी में ‘उस भूभाग की सीमा’ आगे होने वाले भूमि-विभाजन के संदर्भ को स्पष्ट और स्वाभाविक बनाता है।
- source_word: תִּתְנַחֲלוּ אֶת־הָאָרֶץ
  choice: जिसे तुम ... विरासत के रूप में बाँटोगे
  rationale: נחל के हित्पएल रूप में यहाँ भूमि को पैतृक भागों के रूप में ग्रहण करने और बाँटने का भाव है; केवल ‘विरासत में पाओगे’ कहने से वितरण का पहलू अस्पष्ट रह जाता।
- source_word: לִשְׁנֵי עָשָׂר שִׁבְטֵי יִשְׂרָאֵל
  choice: इस्राएल के बारह गोत्रों में
  rationale: पूर्वसर्ग ל वितरण के प्राप्तकर्ताओं का संबंध बताता है; ‘गोत्रों में’ हिन्दी में भूमि के बँटवारे का भाव सहजता से व्यक्त करता है।
- source_word: יוֹסֵף חֲבָלִים
  choice: यूसुफ को दो भाग मिलेंगे
  rationale: हिब्रू वाक्यांश अत्यंत संक्षिप्त है और חֲבָלִים मापी हुई भू-पट्टियों या हिस्सों को सूचित करता है। बारह गोत्रों के भूमि-विभाजन के संदर्भ में इसका आशय यूसुफ के लिए दो भू-भाग है।
theological_decisions:
- issue: संयुक्त उपाधि אֲדֹנָי יְהוִה में परमेश्वर के नाम का अनुवाद
  choice: प्रभु यहोवा
  alternative: प्रभु परमेश्वर
  rationale: मूल में יהוה व्यक्तिगत दिव्य नाम है, केवल सामान्य उपाधि नहीं। ‘यहोवा’ नाम को प्रत्यक्ष रखता है, जबकि ‘प्रभु’ אֲדֹנָי का प्रतिनिधित्व करता है; इस प्रकार मूल का भेद सुरक्षित रहता है।
- issue: यूसुफ के हिस्सों की संख्या
  choice: दो भाग
  alternative: भाग
  rationale: मूल में संख्या ‘दो’ प्रत्यक्ष नहीं है, पर बहुवचन חֲבָלִים और बारह गोत्रों के भूमि-वितरण का संदर्भ यूसुफ की दो शाखाओं को मिलने वाले दो भू-भागों की ओर संकेत करता है। इसे पाठ में स्पष्ट किया गया है और मूल की संक्षिप्तता पाद-टिप्पणी में बताई गई है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज रखी गई है। ‘विरासत के रूप में बाँटोगे’ भूमि के पैतृक आवंटन और वितरण—दोनों भावों को समेटता है।
