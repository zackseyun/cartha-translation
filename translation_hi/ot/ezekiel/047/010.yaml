  text: וְ/הָיָה֩ יעמדו עָלָ֜י/ו דַּוָּגִ֗ים מֵ/עֵ֥ין גֶּ֨דִי֙ וְ/עַד עֵ֣ין עֶגְלַ֔יִם מִשְׁט֥וֹחַ לַֽ/חֲרָמִ֖ים יִהְי֑וּ לְ/מִינָ/ה֙ תִּהְיֶ֣ה דְגָתָ֔/ם כִּ/דְגַ֛ת הַ/יָּ֥ם הַ/גָּד֖וֹל רַבָּ֥ה מְאֹֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/047/010.yaml
  text: And it will happen that fishermen will stand beside it[a]; from En-gedi even to En-eglaim there will be a place for spreading nets. Their fish will be of many kinds, like the fish of the Great Sea[b], very many.
translation:
  language: hi
  text: और ऐसा होगा कि उसके किनारे मछुआरे खड़े होंगे। एन-गेदी से लेकर एन-एगलाईम तक जाल फैलाने का स्थान होगा। वहाँ तरह-तरह की मछलियाँ[a] होंगी, जैसे बड़े समुद्र[b] की मछलियाँ; वे बहुत अधिक होंगी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अधिक शाब्दिक रूप से, “वहाँ की मछलियाँ अपने-अपने प्रकार के अनुसार होंगी,” अर्थात मछलियों के अनेक प्रकार होंगे।
    reason: lexical_alternative
  - marker: b
    text: “बड़ा समुद्र” भूमध्य सागर को कहा गया है।
    reason: cultural_note
lexical_decisions:
- source_word: וְהָיָה
  choice: और ऐसा होगा कि
  rationale: यह भविष्य में होने वाले परिणाम का परिचय देता है और इब्रानी कथन-प्रवाह को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: יעמדו עָלָיו דַּוָּגִים
  choice: उसके किनारे मछुआरे खड़े होंगे
  rationale: עָלָיו का शाब्दिक अर्थ ‘उस पर’ हो सकता है, पर जल के संदर्भ में आशय उसके पास या किनारे खड़े होने से है। ‘मछुआरे’ आधुनिक हिन्दी का सामान्य शब्द है।
- source_word: מֵעֵין גֶּדִי וְעַד עֵין עֶגְלַיִם
  choice: एनगदी से लेकर एनएग्लैम तक
  rationale: מִן...עַד द्वारा बताई गई पूरी सीमा को ‘से लेकर...तक’ स्पष्ट और स्वाभाविक रूप से व्यक्त करता है; स्थान-नामों का लिप्यंतरण किया गया है।
- source_word: מִשְׁטוֹחַ לַחֲרָמִים
  choice: जाल फैलाने के स्थान होंगे
  rationale: מִשְׁטוֹחַ फैलाने के स्थान या सतह को और חֲרָמִים मछली पकड़ने के जालों को दर्शाता है। बहुवचन ‘स्थान’ पूरे बताए गए तटवर्ती विस्तार का स्वाभाविक हिन्दी वर्णन है।
- source_word: לְמִינָהּ תִּהְיֶה דְגָתָם
  choice: वहाँ तरह-तरह की मछलियाँ होंगी
  rationale: शाब्दिक रूप ‘अपनी जाति के अनुसार’ है; प्रसंग में इसका आशय अनेक प्रकार की मछलियों से है। ‘वहाँ’ प्रत्यय के संदर्भ को सहज बनाता है, बिना किसी विशेष जलधारा को अनावश्यक रूप से निश्चित किए।
- source_word: כִּדְגַת הַיָּם הַגָּדוֹל
  choice: जैसे बड़े समुद्र की मछलियाँ
  rationale: ‘बड़ा समुद्र’ इब्रानी उपाधि का निकट रूप है। मुख्य पाठ में उसे सीधे ‘भूमध्य सागर’ करने के बजाय उसकी पहचान पादटिप्पणी में दी गई है।
- source_word: רַבָּה מְאֹד
  choice: वे बहुत अधिक होंगी
  rationale: यह मछलियों की अत्यधिक बहुतायत व्यक्त करता है; हिन्दी में यह संक्षिप्त और स्वाभाविक है।
