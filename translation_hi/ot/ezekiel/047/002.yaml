    text: या ‘पानी बुलबुलाता हुआ निकल रहा था’ अथवा ‘पानी बह रहा था’; इब्रानी क्रिया बड़े प्रवाह के बजाय थोड़ी मात्रा में उभरते हुए जल का संकेत देती है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक अर्थ ‘दाहिने कन्धे से’ है; यहाँ ‘कन्धा’ किसी रचना की बगल या पार्श्व को दर्शाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיּוֹצִאֵנִי
  choice: वह मुझे ... बाहर ले गया
  rationale: יצא के हिफ़ील रूप में किसी को बाहर ले जाने का भाव है; यह हिन्दी में स्वाभाविक रूप से मार्गदर्शित गति व्यक्त करता है।
- source_word: דֶּרֶךְ שַׁעַר צָפוֹנָה
  choice: उत्तरी फाटक के रास्ते
  rationale: דֶּרֶךְ यहाँ मार्ग बताता है और צָפוֹנָה उत्तर की दिशा सूचित करता है; सन्दर्भ में ‘उत्तरी फाटक’ सहज और स्पष्ट है।
- source_word: וַיְסִבֵּנִי
  choice: घुमाकर ... ले आया
  rationale: סבב का हिफ़ील रूप किसी को चारों ओर या घूमते हुए ले जाने का अर्थ देता है; इससे भवन के बाहर का चक्कर लगाकर पूर्वी फाटक तक पहुँचने की गति स्पष्ट होती है।
- source_word: דֶּרֶךְ חוּץ
  choice: बाहर के मार्ग से
  rationale: חוּץ बाहरी क्षेत्र या बाहर की ओर संकेत करता है; यह अनुवाद बताता है कि मार्ग भवन-परिसर के बाहर से था।
- source_word: אֶל שַׁעַר הַחוּץ
  choice: उस बाहरी फाटक तक
  rationale: सन्दर्भ में यह मन्दिर-परिसर के बाहरी फाटक को दर्शाता है; ‘बाहरी फाटक’ आधुनिक हिन्दी में स्पष्ट है।
- source_word: דֶּרֶךְ הַפּוֹנֶה קָדִים
  choice: जिसका मुँह पूर्व की ओर था
  rationale: פנה का कृदन्त फाटक की दिशा बताता है; हिन्दी में किसी प्रवेश-द्वार के उन्मुख होने के लिए ‘मुँह ... की ओर’ स्वाभाविक है।
- source_word: וְהִנֵּה
  choice: और देखो
  rationale: הִנֵּה दृश्य के एक नए और उल्लेखनीय विवरण की ओर ध्यान खींचता है; ‘और देखो’ उसकी सजीव भविष्यद्वक्ताई शैली बनाए रखता है।
- source_word: מַיִם מְפַכִּים
  choice: पानी धीरे-धीरे बह निकल रहा था
  rationale: פכה आरम्भिक, छोटी मात्रा में निकलते या रिसते-बहते जल का संकेत देता है; यह चुनाव बड़े प्रवाह का अर्थ थोपे बिना उस गति को सहज हिन्दी में व्यक्त करता है।
- source_word: מִן הַכָּתֵף הַיְמָנִית
  choice: दाहिनी ओर से
  rationale: כָּתֵף का मूल अर्थ ‘कन्धा’ है, पर स्थापत्य सन्दर्भ में यह किसी रचना की बगल या पार्श्व को दर्शाता है; ‘दाहिनी ओर’ अनावश्यक शारीरिक बिम्ब से बचते हुए अर्थ देता है।
