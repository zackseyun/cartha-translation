  text: Then he brought me out by way of the north gate[a], and led me around by the outside way to the outer gate, the one facing east; and behold[b], water was trickling from the right side.
translation:
  language: hi
  text: तब वह मुझे उत्तरी फाटक के रास्ते बाहर ले गया और बाहर के मार्ग से घुमाकर उस बाहरी फाटक तक ले गया जिसका मुँह पूर्व की ओर था। और देखो, दाहिनी ओर[b] से पानी हलका-सा बह निकल रहा था[a]।
  philosophy: optimal-equivalence
  footnotes:
