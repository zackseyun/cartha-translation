    text: शाब्दिक अर्थ, “एक हज़ार”; पिछली आयत के संदर्भ से माप की इकाई “हाथ” ली गई है।
    reason: cross_reference
  - marker: b
    text: या, “पानी कटि तक था।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּמָד
  choice: उसने ... नापा
  rationale: מדד के काल रूप को सीधे और स्वाभाविक ढंग से व्यक्त करता है; दर्शन में वह व्यक्ति दूरी नाप रहा है।
- source_word: אֶלֶף
  choice: एक हज़ार
  rationale: इब्रानी में केवल संख्या दी गई है। माप की इकाई पिछली आयत से समझी जाती है, इसलिए मुख्य पाठ में उसे नहीं जोड़ा गया।
- source_word: וַיַּעֲבִרֵנִי
  choice: मुझे ... में से पार कराया
  rationale: 'עבר के हिफ़ील रूप का कारक अर्थ सुरक्षित रखता है: उसने नबी को पानी से होकर पार कराया।'
- source_word: בַמַּיִם
  choice: पानी में से
  rationale: कारक क्रिया के साथ यह केवल पानी में स्थित होने के बजाय पानी से होकर गति करने को व्यक्त करता है।
- source_word: מַיִם בִּרְכָּיִם
  choice: पानी घुटनों तक था
  rationale: संज्ञा और शरीर के अंग की इब्रानी रचना पानी का स्तर बताती है; यह हिंदी में स्पष्ट और स्वाभाविक है।
- source_word: מֵי מָתְנָיִם
  choice: पानी कमर तक था
  rationale: מָתְנַיִם कमर/कटि-प्रदेश को दर्शाता है; आधुनिक सामान्य हिंदी में 'कमर' सर्वाधिक सहज है।
