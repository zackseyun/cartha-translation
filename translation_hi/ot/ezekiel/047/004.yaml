  text: Again he measured a thousand[a], and led me through the water—water up to the knees. Again he measured a thousand[b], and led me through water up to the waist.
translation:
  language: hi
  text: फिर उसने एक हज़ार[a] नापा और मुझे पानी में से होकर ले गया—पानी घुटनों तक था। फिर उसने एक हज़ार नापा और मुझे पानी में से होकर ले गया—पानी कमर[b] तक था।
  philosophy: optimal-equivalence
  footnotes:
