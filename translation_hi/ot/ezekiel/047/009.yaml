source:
  edition: WLC
  text: וְ/הָיָ֣ה כָל נֶ֣פֶשׁ חַיָּ֣ה אֲֽשֶׁר יִשְׁרֹ֡ץ אֶ֣ל כָּל אֲשֶׁר֩ יָב֨וֹא שָׁ֤ם נַחֲלַ֨יִם֙ יִֽחְיֶ֔ה וְ/הָיָ֥ה הַ/דָּגָ֖ה רַבָּ֣ה מְאֹ֑ד כִּי֩ בָ֨אוּ שָׁ֜מָּ/ה הַ/מַּ֣יִם הָ/אֵ֗לֶּה וְ/יֵרָֽפְאוּ֙ וָ/חָ֔י כֹּ֛ל אֲשֶׁר יָ֥בוֹא שָׁ֖מָּ/ה הַ/נָּֽחַל־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/047/009.yaml
  text: And every living creature that swarms[a], wherever the river goes, will live. And there will be very many fish, because these waters go there and are healed[b]; everything will live wherever the river goes.
translation:
  language: hi
  text: और हर जीवित प्राणी जो बहुतायत से विचरता है, जहाँ-जहाँ वे धाराएँ पहुँचेंगी, जीवित रहेगा। वहाँ मछलियाँ बहुत बड़ी संख्या में होंगी, क्योंकि ये जल वहाँ पहुँचेंगे और चंगे हो जाएँगे[b]; जहाँ-जहाँ यह नदी पहुँचेगी, वहाँ सब कुछ जीवित रहेगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: या, ‘ये जल वहाँ पहुँचेंगे, जिससे वहाँ का जल चंगा हो जाएगा।’ हिब्रू में जल के ‘चंगे होने’ की छवि स्पष्ट है, पर क्रिया का संबंध आने वाले जल से है या वहाँ के जल से—इसे अलग-अलग ढंग से समझा जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: נֶפֶשׁ חַיָּה
  choice: जीवित प्राणी
  rationale: यह पदबंध सामान्य रूप से सजीव प्राणी को दर्शाता है; जलीय संदर्भ में ‘जीवित प्राणी’ स्वाभाविक है और ‘आत्मा’ जैसा अनावश्यक मानवीय अर्थ नहीं जोड़ता।
- source_word: יִשְׁרֹץ
  choice: झुंडों में चलता-फिरता है
  rationale: क्रिया जल में बहुतायत से विचरने या झुंड बनाने वाले जीवों का सजीव चित्र देती है। यह हिन्दी में अर्थ स्पष्ट रखते हुए ‘रेंगने’ तक सीमित नहीं करती।
- source_word: נַחֲלַיִם
  choice: धाराएँ
  rationale: हिब्रू रूप द्विवचन/बहुवचन है। बहुवचन ‘धाराएँ’ उसकी आकृति को बनाए रखता है, पर अनिवार्य रूप से ठीक दो धाराओं का निर्णय नहीं करता।
- source_word: יִחְיֶה
  choice: जीवित रहेगा
  rationale: यह हिब्रू के सीधे जीवन-सूचक अर्थ को बनाए रखता है और ‘फलना-फूलना’ जैसा अतिरिक्त भाव नहीं जोड़ता।
- source_word: הַדָּגָה רַבָּה מְאֹד
  choice: मछलियाँ बहुत बड़ी संख्या में होंगी
  rationale: सामूहिक संज्ञा और अत्यधिक बहुतायत, दोनों को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: וְיֵרָפְאוּ
  choice: चंगे हो जाएँगे
  rationale: रפא की स्पष्ट उपचार-छवि को बनाए रखा गया है; इसे केवल ‘मीठा’ या ‘स्वच्छ’ बन जाने तक सीमित नहीं किया गया।
- source_word: וָחָי כֹּל
  choice: सब कुछ जीवित रहेगा
  rationale: समापन कथन की व्यापकता और नदी के जीवनदायी प्रभाव को सीधे रूप में व्यक्त करता है।
- source_word: הַנָּחַל
  choice: यह नदी
  rationale: अंतिम पद में संज्ञा एकवचन है। दर्शन में यह सतत बहती जीवनदायी जलधारा है, इसलिए ‘नदी’ स्पष्ट और स्वाभाविक है।
theological_decisions:
- issue: जल के चंगे होने की दर्शनीय छवि
  choice: ‘चंगे हो जाएँगे’ कहकर उपचार की छवि को स्पष्ट रूप से बनाए रखना
  alternative: ‘मीठे हो जाएँगे’, ‘शुद्ध हो जाएँगे’ या ‘वहाँ का जल चंगा हो जाएगा’
  rationale: हिब्रू में उपचार की भाषा स्पष्ट है। उसे बनाए रखने से पुनर्स्थापन का दर्शनीय प्रतीक सुरक्षित रहता है, जबकि किसी बाद की सिद्धान्तगत व्याख्या को पाठ में नहीं जोड़ा जाता।
- issue: बहुवचन धाराओं और अंत की एकवचन नदी का संबंध
  choice: पहले ‘धाराएँ’ और अंत में ‘यह नदी’
  alternative: दोनों स्थानों पर एकवचन ‘नदी’
  rationale: 'इससे पद में मौजूद व्याकरणिक तनाव सुरक्षित रहता है: पहले रूप द्विवचन/बहुवचन है, जबकि अंतिम הַנָּחַל स्पष्टतः एकवचन है।'
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठकों के लिए स्पष्ट। ‘चंगा’ बाइबिलीय उपचार-छवि को स्वाभाविक हिन्दी में बनाए रखता है। पहले बहुवचन ‘धाराएँ’ और बाद में एकवचन ‘नदी’ रखकर मूल का व्याकरणिक अंतर सुरक्षित किया गया है।
