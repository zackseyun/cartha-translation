source:
  edition: WLC
  text: וְ/הָיָ֗ה תַּפִּ֣לוּ אוֹתָ/הּ֮ בְּ/נַחֲלָה֒ לָ/כֶ֗ם וּ/לְ/הַ/גֵּרִים֙ הַ/גָּרִ֣ים בְּ/תוֹכְ/כֶ֔ם אֲשֶׁר הוֹלִ֥דוּ בָנִ֖ים בְּ/תֽוֹכְ/כֶ֑ם וְ/הָי֣וּ לָ/כֶ֗ם כְּ/אֶזְרָח֙ בִּ/בְנֵ֣י יִשְׂרָאֵ֔ל אִתְּ/כֶם֙ יִפְּל֣וּ בְ/נַחֲלָ֔ה בְּ/ת֖וֹךְ שִׁבְטֵ֥י יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/047/022.yaml
  text: And it shall be that you shall allot it as an inheritance for yourselves and for the sojourners who sojourn among you[a], who have fathered children among you; and they shall be to you like a native among the sons of Israel[c][b]. With you they shall receive an inheritance among the tribes of Israel.
translation:
  language: hi
  text: और ऐसा होगा कि तुम उस देश को अपने लिए और अपने बीच रहनेवाले परदेशियों[a] के लिए विरासत के रूप में बाँटोगे—उनके लिए जिन्होंने तुम्हारे बीच सन्तान उत्पन्न की है[b]। वे तुम्हारे लिए इस्राएलियों के बीच देशज[c] के समान होंगे। वे तुम्हारे साथ इस्राएल के गोत्रों के बीच विरासत पाएँगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘तुम्हारे बीच बसे हुए विदेशी’; इब्रानी शब्द ऐसे गैर-देशज व्यक्ति को दर्शाता है जो इस्राएल के बीच निवासी के रूप में रहता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, ‘पुत्र उत्पन्न किए हैं।’
    reason: lexical_alternative
  - marker: c
    text: या ‘जन्मजात निवासी।’
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּפִּלוּ / יִפְּלוּ (נפל, Hiphil/Qal, with נַחֲלָה)
  choice: विरासत के रूप में बाँटोगे / विरासत पाएँगे
  rationale: पहला रूप भूमि बाँटने की प्रेरणार्थक क्रिया है, जबकि दूसरा उसके परिणामस्वरूप विरासत पाने को व्यक्त करता है। हिन्दी में ये अलग स्वाभाविक प्रयोग इब्रानी के कारण-परिणाम और शब्द-संबंध को यथासम्भव बनाए रखते हैं।
- source_word: נַחֲלָה
  choice: विरासत
  rationale: यहाँ सन्दर्भ पुनर्स्थापित देश में वंशानुगत भूमि-अंश का है; ‘विरासत’ इस कानूनी और पारिवारिक अर्थ को स्पष्ट रखता है।
- source_word: הַגֵּרִים / הַגָּרִים בְּתוֹכְכֶם
  choice: अपने बीच रहनेवाले परदेशियों
  rationale: גֵּר किसी राह चलते विदेशी के बजाय समुदाय के बीच बसे गैर-देशज निवासी को बताता है। ‘परदेशी’ प्रचलित और गरिमापूर्ण है, और ‘अपने बीच रहनेवाले’ उसकी निवासी स्थिति स्पष्ट करता है।
- source_word: הוֹלִדוּ בָנִים
  choice: सन्तान उत्पन्न की है
  rationale: प्रेरणार्थक ילד का मूल अर्थ जन्म देना/उत्पन्न करना है। यहाँ בָנִים बसी हुई अगली पीढ़ी पर बल देता है; ‘सन्तान’ अनावश्यक रूप से केवल पुरुष बच्चों तक अर्थ सीमित नहीं करता।
- source_word: כְּאֶזְרָח
  choice: देशज के समान
  rationale: אֶזְרָח भूमि और समुदाय के मूल/जन्मजात सदस्य को दर्शाता है। ‘देशज’ तुलना की कानूनी-सामुदायिक शक्ति रखता है; अधिक सहज विकल्प फुटनोट में दिया गया है।
- source_word: בִּבְנֵי יִשְׂרָאֵל
  choice: इस्राएलियों के बीच
  rationale: शाब्दिक ‘इस्राएल की सन्तानों के बीच’ की अपेक्षा ‘इस्राएलियों के बीच’ आधुनिक हिन्दी में स्वाभाविक है और राष्ट्रीय-सामुदायिक आशय ठीक व्यक्त करता है।
- source_word: אִתְּכֶם ... בְּתוֹךְ שִׁבְטֵי יִשְׂרָאֵל
  choice: तुम्हारे साथ इस्राएल के गोत्रों के बीच
  rationale: यह परदेशियों की समान सहभागिता तथा इस्राएल की गोत्रीय भूमि-व्यवस्था के भीतर उनके वास्तविक अंश—दोनों को व्यक्त करता है।
theological_decisions:
- issue: पुनर्स्थापित देश में גֵּר की स्थिति
  choice: बसे हुए परदेशियों को देशज इस्राएलियों के साथ वास्तविक भूमि-विरासत मिलती है।
  alternative: उन्हें केवल संरक्षण या निवास मिलता है, भूमि-अंश नहीं; अथवा कथन केवल प्रतीकात्मक है।
  rationale: נַחֲלָה की पुनरावृत्ति, भूमि बाँटने और पाने की क्रियाएँ, तथा ‘देशज के समान’ का कथन वास्तविक विरासत-अधिकार की ओर संकेत करते हैं। अनुवाद इससे आगे किसी बाद की धर्मवैज्ञानिक व्यवस्था को आरोपित नहीं करता।
- issue: בָנִים का लैंगिक विस्तार
  choice: ‘सन्तान’—स्थापित अगली पीढ़ी का सामान्य अर्थ।
  alternative: ‘पुत्र’—रूप की अधिक शाब्दिक अभिव्यक्ति।
  rationale: इस प्रसंग में तर्क परदेशी परिवारों की पीढ़ीगत जड़ें और सामुदायिक स्थायित्व है, न कि केवल पुरुष सन्तान। फिर भी शाब्दिक रूप फुटनोट में सुरक्षित है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किन्तु सहज रूप अपनाया गया है। ‘उस देश’ से भूमि-वितरण का प्रसंग स्पष्ट होता है। ‘देशज’ कानूनी-सामुदायिक तुलना को संक्षेप में रखता है और उसका अधिक व्याख्यात्मक विकल्प फुटनोट में है। सभी फुटनोट चिह्न मुख्य पाठ में उपस्थित हैं।
