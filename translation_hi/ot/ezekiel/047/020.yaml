  language: hi
  text: और पश्चिमी सीमा बड़ा समुद्र[a] होगी—सीमा से लेकर लेबो-हमात[b] के सामने तक। यही पश्चिमी सीमा है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से “बड़ा समुद्र”; अर्थात भूमध्य सागर।
    reason: cultural_note
  - marker: b
    text: 'इब्रानी: लेबो-हमात; इसे परंपरागत रूप से “हमात का प्रवेश” भी समझा गया है, पर यहाँ संभवतः उत्तरी सीमा के एक स्थान का नाम है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּפְאַת יָם
  choice: और पश्चिमी सीमा
  rationale: शाब्दिक रूप से यह ‘समुद्र की ओर का किनारा’ है; इस्राएल के भूगोल में महासागर की ओर का भाग पश्चिमी सीमा को दर्शाता है। सीमा-वर्णन के संदर्भ में ‘पश्चिमी सीमा’ स्वाभाविक और स्पष्ट है।
- source_word: הַיָּם הַגָּדוֹל
  choice: महासागर
  rationale: यह इब्रानी पद भूमध्य सागर का पारंपरिक भौगोलिक नाम, शाब्दिक रूप से ‘बड़ा समुद्र’, है। आधुनिक हिन्दी में ‘महासागर’ स्रोत की भव्य संज्ञा को संक्षेप और स्वाभाविक ढंग से व्यक्त करता है; पादटिप्पणी इसकी पहचान स्पष्ट करती है।
- source_word: מִגְּבוּל
  choice: सीमा से
  rationale: גְּבוּל का अर्थ सीमा या सीमारेखा है। पद में आरंभ-बिंदु अनिर्दिष्ट रहने के कारण उसी संक्षिप्तता को बनाए रखा गया है।
- source_word: עַד נֹכַח
  choice: के सामने तक
  rationale: נֹכַח का स्थानवाचक अर्थ ‘सामने’ या ‘ठीक सम्मुख’ है; עַד के साथ यह सीमा की पहुँच बताता है।
- source_word: לְבוֹא חֲמָת
  choice: लेबो-हमात
  rationale: सीमा-सूचियों में यह अभिव्यक्ति भौगोलिक नाम के रूप में समझी जा सकती है, यद्यपि इसका शाब्दिक अर्थ ‘हमात का प्रवेश’ भी संभव है। नाम को लिप्यंतरित कर वास्तविक अस्पष्टता पादटिप्पणी में रखी गई है।
- source_word: זֹאת פְּאַת יָם
  choice: यही पश्चिमी सीमा है
  rationale: यह पहले वर्णित सीमा का सार देने वाला सूत्र है। ‘यही’ हिन्दी में संकेतवाचक बल को स्वाभाविक रूप से व्यक्त करता है।
