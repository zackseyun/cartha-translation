  text: וַ/יֹּ֣אמֶר אֵלַ֗/י הַ/מַּ֤יִם הָ/אֵ֨לֶּה֙ יוֹצְאִ֗ים אֶל הַ/גְּלִילָה֙ הַ/קַּדְמוֹנָ֔ה וְ/יָרְד֖וּ עַל הָֽ/עֲרָבָ֑ה וּ/בָ֣אוּ הַ/יָּ֔מָּ/ה אֶל הַ/יָּ֥מָּ/ה הַ/מּֽוּצָאִ֖ים ו/נרפאו הַ/מָּֽיִם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/047/008.yaml
  text: Then he said to me[a], “These waters flow out toward the eastern district and go down into the Arabah; then they enter the sea. and when they are brought out into the sea[c][b], the waters are healed.”
translation:
  language: hi
  text: तब उसने मुझसे कहा, “ये जल पूर्वी भूभाग की ओर बहते हैं और नीचे अराबा में उतरते हैं। फिर वे समुद्र[a] में जा मिलते हैं। जब ये समुद्र में बहाए जाते हैं[b], तब समुद्र का पानी चंगा हो जाता है[c]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ अभिप्रेत समुद्र सामान्यतः मृत सागर माना जाता है।
    reason: geographical_identification
  - marker: b
    text: यह हिब्रू वाक्यांश कठिन है। शाब्दिक रूप से इसका अर्थ हो सकता है, ‘समुद्र में निकाले या बहाए जाते हैं।’
    reason: textual_difficulty
  - marker: c
    text: या, ‘समुद्र का पानी ताज़ा हो जाता है।’ हिब्रू में शाब्दिक रूप से, ‘पानी चंगा हो जाता है।’
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמַּיִם הָאֵלֶּה
  choice: यह जल
  rationale: हिब्रू מַיִם व्याकरण की दृष्टि से बहुवचन रूप है, पर यहाँ मंदिर से निकलने वाली एक धारा का जल अभिप्रेत है। आधुनिक हिन्दी में ‘यह जल’ अधिक स्वाभाविक है।
- source_word: יוֹצְאִים
  choice: बहता है
  rationale: יצא का मूल अर्थ ‘निकलना’ है, पर जल के निरंतर आगे बढ़ने के संदर्भ में ‘बहता है’ स्वाभाविक और संदर्भानुकूल है।
- source_word: הַגְּלִילָה הַקַּדְמוֹנָה
  choice: पूर्वी भूभाग
  rationale: גְּלִילָה यहाँ किसी क्षेत्र या भूभाग को सूचित करता है; ‘पूर्वी भूभाग’ अस्पष्ट भौगोलिक विस्तार को अनावश्यक रूप से निश्चित किए बिना सहज हिन्दी देता है।
- source_word: וְיָרְדוּ עַל הָעֲרָבָה
  choice: नीचे अराबा में उतरता है
  rationale: ירד ऊँचाई से नीचे जाने को व्यक्त करता है। עֲרָבָה विशिष्ट भौगोलिक नाम है, इसलिए उसका लिप्यंतरण रखा गया है।
- source_word: וּבָאוּ הַיָּמָּה
  choice: समुद्र में जा मिलता है
  rationale: दिशासूचक रूप הַיָּמָּה समुद्र की ओर जाकर उसमें प्रवेश करने का भाव देता है; नदी या धारा के लिए ‘जा मिलता है’ स्वाभाविक हिन्दी है।
- source_word: אֶל הַיָּמָּה הַמּוּצָאִים
  choice: जब इसे समुद्र में बहा दिया जाता है
  rationale: यह कठिन हिब्रू वाक्यांश है। הַמּוּצָאִים को יצא के कारक कर्मवाच्य रूप के रूप में लेते हुए जल के समुद्र में बहा दिए जाने का भाव रखा गया है; कठिनाई को पादटिप्पणी में स्पष्ट किया गया है।
- source_word: וְנרפאו הַמָּיִם
  choice: तब वहाँ का पानी चंगा हो जाता है
  rationale: רפא का मूल अर्थ ‘चंगा करना/होना’ है। ‘वहाँ का’ स्पष्ट करता है कि समुद्र का पानी अभिप्रेत है, और ‘चंगा’ मूल रूपक को बनाए रखता है।
theological_decisions:
- issue: समुद्र के पानी के परिवर्तन का वर्णन
  choice: चंगा हो जाता है
  alternative: मीठा/स्वच्छ हो जाता है
  rationale: मूल पाठ רפואת यानी चंगाई का रूपक प्रयोग करता है। उसे बनाए रखने से भविष्यदर्शी चित्र की शक्ति और संभावित व्यापक अर्थ सुरक्षित रहते हैं; ‘मीठा’ कहना अर्थ को केवल लवणता तक सीमित कर सकता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘अराबा’ को भौगोलिक नाम के रूप में सुरक्षित रखा गया है। जल के लिए हिन्दी का स्वाभाविक एकवचन प्रयोग किया गया है, जबकि स्रोत का व्याकरणिक बहुवचन निर्णय-टिप्पणी में दर्ज है।
