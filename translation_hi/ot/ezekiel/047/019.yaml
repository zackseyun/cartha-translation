  terminology: “सीमा,” “तामार,” “मरीबोत-कादेश,” “नाला,” and “बड़ा समुद्र” are suitable. The footnotes appropriately retain the alternate place-name form, explain the watercourse term, and identify the Great Sea without placing that identification in the main text.
