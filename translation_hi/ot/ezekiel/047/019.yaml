source:
  edition: WLC
  text: וּ/פְאַת֙ נֶ֣גֶב תֵּימָ֔נָ/ה מִ/תָּמָ֗ר עַד מֵי֙ מְרִיב֣וֹת קָדֵ֔שׁ נַחֲלָ֖ה אֶל הַ/יָּ֣ם הַ/גָּד֑וֹל וְ/אֵ֥ת פְּאַת תֵּימָ֖נָ/ה נֶֽגְבָּ/ה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/047/019.yaml
  text: And the south side[a], southward, shall be from Tamar to the waters of Meriboth-kadesh, to the wadi, to the Great Sea. This is the south side[c][b], southward.
translation:
  language: hi
  text: और दक्षिणी सीमा, दक्षिण दिशा में, तामार से मरीबोत-कादेश के जल[a] तक, नाले[b] तक, फिर बड़े समुद्र[c] तक होगी। यह दक्षिण दिशा की सीमा होगी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मरीबा-कादेश के जल।” यहाँ इब्रानी पाठ में सम्बद्ध स्थान-नाम का रूप “मरीबोत-कादेश” है।
    reason: alternative_reading
  - marker: b
    text: इब्रानी शब्द किसी नाले, जलधारा या प्रायः मौसमी जलमार्ग की ओर संकेत करता है।
    reason: lexical_alternative
  - marker: c
    text: अर्थात भूमध्य सागर।
    reason: cultural_note
lexical_decisions:
- source_word: פְאַת
  choice: सीमा
  rationale: भूमि की सीमाओं के इस वर्णन में यह शब्द किसी दिशा की भुजा या सीमा-रेखा को दर्शाता है; आधुनिक हिन्दी में ‘सीमा’ सबसे स्वाभाविक और स्पष्ट है।
- source_word: נֶגֶב / תֵּימָנָה
  choice: दक्षिण की ओर की / दक्षिणी
  rationale: दोनों दिशासूचक शब्दों के संयुक्त बल को बनाए रखने के लिए आरम्भ और समापन में दक्षिण दिशा की पुनरुक्ति रखी गई है, पर उसे स्वाभाविक हिन्दी वाक्य-विन्यास दिया गया है।
- source_word: מִתָּמָר
  choice: तामार से
  rationale: यह स्थान-नाम है; आरम्भ-बिन्दु बताने वाले מִן उपसर्ग को ‘से’ से व्यक्त किया गया है।
- source_word: מֵי מְרִיבוֹת קָדֵשׁ
  choice: मरीबोत-कादेश के जल
  rationale: मसोरेटिक व्यंजन-पाठ में आए स्थान-नाम ‘मरीबोत-कादेश’ को सुरक्षित रखा गया है; अधिक परिचित सम्बद्ध रूप ‘मरीबा-कादेश’ पादटिप्पणी में दिया गया है।
- source_word: נַחֲלָה
  choice: नाले की ओर
  rationale: यहाँ रूप को נַחַל (‘नाला/जलधारा’) के साथ दिशासूचक ה के रूप में समझना सीमा-वर्णन और स्थलाकृतिक क्रम के अनुकूल है; इससे ‘विरासत’ वाला असंगत अर्थ नहीं आता।
- source_word: הַיָּם הַגָּדוֹל
  choice: बड़ा समुद्र
  rationale: मूल का पारंपरिक भौगोलिक पद यथावत रखा गया है; भूमध्य सागर की पहचान पादटिप्पणी में स्पष्ट की गई है।
- source_word: וְאֵת פְּאַת תֵּימָנָה נֶגְבָּה
  choice: यही दक्षिण की ओर की दक्षिणी सीमा होगी
  rationale: मूल की संक्षिप्त, पुनरावर्ती समापन-पंक्ति को बोधगम्य हिन्दी में व्यक्त करते हुए उसकी दिशात्मक पुनरुक्ति सुरक्षित रखी गई है।
