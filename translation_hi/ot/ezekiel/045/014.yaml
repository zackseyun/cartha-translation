base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/045/014.yaml
  text: And the fixed due of oil shall be one bath of oil from each cor[a], from ten baths, that is, one homer[c][b], for ten baths are one homer.
translation:
  language: hi
  text: 'तेल का निर्धारित देय यह होगा: तेल का एक बत—कोर[a] में से बत का दसवाँ भाग। दस बत एक होमेर[b] हैं, क्योंकि दस बत एक होमेर हैं।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: कोर प्राचीन इस्राएल की माप-इकाई थी। इस पद में उसे दस बत, अर्थात एक होमेर, के बराबर माना गया है।
    reason: cultural_note
  - marker: b
    text: बत, कोर और होमेर प्राचीन माप-इकाइयाँ हैं। मूल पाठ दस बत और एक होमेर की समानता दोहराता है।
    reason: cultural_note
lexical_decisions:
- source_word: חֹק
  choice: निर्धारित अंश
  rationale: बलि या कर के इस प्रसंग में यह किसी अमूर्त विधि के बजाय पहले से ठहराए गए देय अंश को दर्शाता है।
- source_word: שֶּׁמֶן
  choice: तेल
  rationale: इब्रानी शब्द सामान्यतः तेल को दर्शाता है; मूल पाठ में जैतून स्पष्ट रूप से नहीं कहा गया है।
- source_word: בַּת
  choice: बत
  rationale: यह द्रव माप की प्राचीन इस्राएली इकाई है। आधुनिक अनुमानित मात्रा देने के बजाय इसके नाम का लिप्यंतरण रखा गया है।
- source_word: מַעְשַׂר הַבַּת
  choice: एक बत का दसवाँ भाग
  rationale: מַעְשַׂר का स्पष्ट अर्थ दसवाँ भाग है। इसे छोड़कर ‘एक बत’ कहना निर्धारित अनुपात को दस गुना कर देगा।
- source_word: כֹּר
  choice: कोर
  rationale: यह प्राचीन माप की तकनीकी संज्ञा है; स्रोत की माप-व्यवस्था बनाए रखने के लिए लिप्यंतरण किया गया है।
- source_word: חֹמֶר
  choice: होमेर
  rationale: यह प्राचीन माप की तकनीकी संज्ञा है, जिसकी दस बत के साथ समानता पद में स्वयं बताई गई है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यहाँ शब्द अगले वाक्य में माप-समानता की पुष्टि या व्याख्या प्रस्तुत करता है; सामान्य कारणसूचक ‘क्योंकि’ स्रोत की संरचना और पुनरुक्ति दोनों को बनाए रखता है।
theological_decisions:
- issue: तेल के निर्धारित अंश का अनुपात
  choice: हर कोर में से एक बत का दसवाँ भाग
  alternative: हर कोर में से एक बत
  rationale: इब्रानी מַעְשַׂר הַבַּת स्पष्ट रूप से ‘बत का दसवाँ भाग’ कहता है। यद्यपि बाद की माप-व्याख्या से वाक्य असामान्य प्रतीत होता है, अनुवाद में ‘दसवाँ’ हटाना स्रोत के निर्धारित अनुपात को बदल देगा।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘बत’, ‘कोर’ और ‘होमेर’ को तकनीकी प्राचीन मापों के रूप में लिप्यंतरित किया गया है। स्रोत की असामान्य पुनरुक्ति तथा ‘एक बत का दसवाँ भाग’ वाला वास्तविक अनुपात जानबूझकर सुरक्षित रखा गया है।
