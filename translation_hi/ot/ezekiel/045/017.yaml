  text: וְ/עַֽל הַ/נָּשִׂ֣יא יִהְיֶ֗ה הָ/עוֹל֣וֹת וְ/הַ/מִּנְחָה֮ וְ/הַ/נֵּסֶךְ֒ בַּ/חַגִּ֤ים וּ/בֶ/חֳדָשִׁים֙ וּ/בַ/שַּׁבָּת֔וֹת בְּ/כָֽל מוֹעֲדֵ֖י בֵּ֣ית יִשְׂרָאֵ֑ל הֽוּא יַעֲשֶׂ֞ה אֶת הַ/חַטָּ֣את וְ/אֶת הַ/מִּנְחָ֗ה וְ/אֶת הָֽ/עוֹלָה֙ וְ/אֶת הַ/שְּׁלָמִ֔ים לְ/כַפֵּ֖ר בְּעַ֥ד בֵּֽית יִשְׂרָאֵֽל־־־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/045/017.yaml
  text: And the burnt offerings[a], the grain offering, and the drink offering at the feasts, at the new moons, and at the Sabbaths—at all the appointed times of the house of Israel—shall be the prince’s responsibility. He shall provide the sin offering, the grain offering, the burnt offering, and the peace offerings[b], to make atonement for the house of Israel.
translation:
  language: hi
  text: इस्राएल के घराने के सभी नियत अवसरों पर—पर्वों, नए चाँद के दिनों और विश्राम-दिनों में—होमबलियाँ, अन्नबलि और पेय-बलि चढ़ाने की ज़िम्मेदारी प्रधान की होगी। वही पापबलि[a], अन्नबलि, होमबलि और मेलबलियाँ[b] उपलब्ध कराएगा, ताकि इस्राएल के घराने के लिए प्रायश्चित किया जाए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘शुद्धि-बलि’।
    reason: lexical_alternative
  - marker: b
    text: या ‘सहभागिता की बलियाँ’ अथवा ‘कुशलता की बलियाँ’।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל הַנָּשִׂיא יִהְיֶה
  choice: ज़िम्मेदारी प्रधान की होगी
  rationale: עַל के साथ היה यहाँ किसी पर दायित्व होने का भाव देता है। यह स्वाभाविक हिन्दी में उस दायित्व को स्पष्ट करता है, बिना यह कहे कि प्रधान स्वयं याजकीय रीति पूरी करेगा।
- source_word: הַנָּשִׂיא
  choice: प्रधान
  rationale: यहेजकेल में נָשִׂיא नागरिक शासक या अगुवे के लिए प्रयुक्त है। ‘प्रधान’ पद की गरिमा रखता है और पाठ से आगे बढ़कर उसे ‘राजा’ नहीं कहता।
- source_word: הָעוֹלוֹת / הָעוֹלָה
  choice: होमबलियाँ / होमबलि
  rationale: עוֹלָה उस बलि को दर्शाता है जो वेदी पर पूर्णतः जलाई जाती थी। ‘होमबलि’ हिन्दी बाइबलीय प्रयोग में संक्षिप्त और पहचाना हुआ पद है; आरम्भिक बहुवचन और बाद का एकवचन सुरक्षित रखा गया है।
- source_word: הַמִּנְחָה
  choice: अन्नबलि
  rationale: बलिदानी संदर्भ में מִנְחָה सामान्य भेंट नहीं, अन्न से संबंधित भेंट है।
- source_word: הַנֵּסֶךְ
  choice: अर्घ
  rationale: נֶסֶךְ उँडेली जाने वाली पेय-भेंट है। ‘अर्घ’ हिन्दी में धार्मिक रूप से चढ़ाए जाने वाले द्रव की भेंट को संक्षेप में व्यक्त करता है।
- source_word: בַּחַגִּים וּבֶחֳדָשִׁים וּבַשַּׁבָּתוֹת
  choice: पर्वों, नए चाँद के दिनों और विश्राम-दिनों में
  rationale: तीनों आवर्ती पवित्र कालों को अलग-अलग बनाए रखा गया है। חֳדָשִׁים यहाँ महीनों के बजाय नवचन्द्र के धार्मिक अवसरों को सूचित करता है।
- source_word: בְּכָל מוֹעֲדֵי בֵּית יִשְׂרָאֵל
  choice: इस्राएल के घराने के सभी नियत अवसरों पर
  rationale: מוֹעֲדִים का व्यापक अर्थ नियत पवित्र समय या अवसर है। ‘नियत अवसर’ पहले आए ‘पर्वों’ की अनावश्यक पुनरावृत्ति से बचते हुए व्यापकता बनाए रखता है।
- source_word: הוּא יַעֲשֶׂה
  choice: वही ... उपलब्ध कराएगा
  rationale: עשה का मूल भाव ‘करना/तैयार करना’ है, पर प्रसंग प्रधान के दायित्व का है। ‘उपलब्ध कराएगा’ बलियाँ मुहैया कराने का भाव देता है और प्रधान को अनिवार्यतः याजकीय अनुष्ठान स्वयं करने वाला नहीं ठहराता।
- source_word: הַחַטָּאת
  choice: पापबलि
  rationale: पुरोहितीय संदर्भ में חַטָּאת पाप से संबंधित बलि का नाम है। पारंपरिक ‘पापबलि’ मुख्य पाठ में रखा गया है और ‘शुद्धि-बलि’ की सम्भावना पादटिप्पणी में सुरक्षित है।
- source_word: הַשְּׁלָמִים
  choice: मेलबलियाँ
  rationale: שְׁלָמִים शांति, कुशलता और सहभागिता से जुड़ी बलियों को दर्शाता है। ‘मेलबलियाँ’ संक्षिप्त और प्रचलित है; अन्य अर्थछायाएँ पादटिप्पणी में दी गई हैं।
- source_word: לְכַפֵּר בְּעַד
  choice: के लिए प्रायश्चित किया जाए
  rationale: כפר का बलिदानी अर्थ प्रायश्चित करना है। कर्मवाच्य हिन्दी प्रधान द्वारा सामग्री उपलब्ध कराने और अनुष्ठान के सम्पन्न होने में भेद बनाए रखती है तथा किसी विशिष्ट उत्तरकालीन प्रायश्चित-सिद्धान्त को नहीं जोड़ती।
theological_decisions:
- issue: बलिदानी उपासना में प्रधान की भूमिका
  choice: प्रधान पर आवश्यक बलियाँ उपलब्ध कराने की ज़िम्मेदारी रखी गई है।
  alternative: प्रधान अपने हाथों से याजक की तरह बलियाँ चढ़ाता है।
  rationale: וְעַל הַנָּשִׂיא יִהְיֶה स्पष्टतः दायित्व प्रधान पर रखता है, जबकि הוּא יַעֲשֶׂה ‘करेगा/तैयार करेगा’ भी हो सकता है। ‘उपलब्ध कराएगा’ निकटवर्ती प्रसंग के अनुरूप है और पाठ से अधिक याजकीय भूमिका निर्धारित नहीं करता।
- issue: प्रायश्चित का अर्थ
  choice: मन्दिर-दर्शन के बलिदानी संदर्भ में इस्राएल के घराने के लिए प्रायश्चित किया जाता है।
  alternative: इसे किसी बाद की व्यवस्थित धर्मवैज्ञानिक व्याख्या के अनुसार विस्तार से परिभाषित किया जाए।
  rationale: अनुवाद כפר की धार्मिक-बलिदानी भाषा को बनाए रखता है, लेकिन उसके साधन या सिद्धान्त के विषय में पाठ से अधिक दावा नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य शैली रखी गई है। ‘होमबलि’, ‘अन्नबलि’, ‘पापबलि’ और ‘प्रायश्चित’ जैसे स्थापित धार्मिक पद सटीकता के लिए रखे गए हैं। वाक्यक्रम को हिन्दी की स्वाभाविकता के अनुसार बदला गया है, पर पर्वों, नवचन्द्रों, विश्राम-दिनों और सभी नियत अवसरों की सूची तथा प्रधान के दायित्व पर बल सुरक्षित है।
