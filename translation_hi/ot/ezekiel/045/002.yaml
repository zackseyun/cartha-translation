base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/045/002.yaml
  text: From this there shall be for the holy place a square of five hundred by five hundred all around[b][a], with fifty cubits of open land for it all around.
translation:
  language: hi
  text: इसमें से पवित्र स्थान[a] के लिए पाँच सौ गुणा पाँच सौ का चौकोर क्षेत्र होगा, और उसके चारों ओर पचास हाथ की खुली भूमि[b] होगी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “पवित्रस्थान के लिए।” यहाँ इब्रानी शब्द קֹדֶשׁ केवल पवित्रस्थान के भवन को ही नहीं, बल्कि अधिक व्यापक पवित्र क्षेत्र को भी सूचित कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: या “चरागाह” अथवा “साझी भूमि।” इब्रानी מִגְרָשׁ से आशय आसपास की अलग रखी गई खुली भूमि है।
    reason: lexical_alternative
