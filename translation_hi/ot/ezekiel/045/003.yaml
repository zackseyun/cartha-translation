base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/045/003.yaml
  text: From this measured area you shall measure a length of twenty-five thousand and a width of ten thousand[a], and in it shall be the sanctuary, the most holy place.
translation:
  language: hi
  text: इस मापे हुए क्षेत्र में से तुम पच्चीस हज़ार की लंबाई और दस हज़ार की चौड़ाई नापोगे, और उसमें पवित्रस्थान होगा—परमपवित्र स्थान।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, अधिक पारंपरिक रूप में, “पवित्रों का पवित्र।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִן הַמִּדָּה הַזֹּאת
  choice: इस नापे हुए क्षेत्र में से
  rationale: מִדָּה यहाँ पहले बताए गए नापे हुए भूभाग को सूचित करता है; ‘क्षेत्र’ संदर्भ को स्पष्ट करता है और מִן का अर्थ ‘में से’ सुरक्षित रखता है।
- source_word: תָּמֹד
  choice: तुम ... नापना
  rationale: מדד का क़ाल अपूर्ण 2 पुल्लिंग एकवचन रूप निर्देशात्मक है; आधुनिक हिन्दी में ‘तुम ... नापना’ प्रत्यक्ष संबोधन और आदेशात्मक भाव को स्वाभाविक रूप से व्यक्त करता है।
- source_word: אֹרֶךְ חמש וְעֶשְׂרִים אֶלֶף
  choice: पच्चीस हज़ार की लंबाई
  rationale: संख्या को आधुनिक हिन्दी क्रम में रखा गया है और אֹרֶךְ को आयाम-सूचक ‘लंबाई’ से व्यक्त किया गया है।
- source_word: וְרֹחַב עֲשֶׂרֶת אֲלָפִים
  choice: और दस हज़ार की चौड़ाई
  rationale: רֹחַב का स्वाभाविक आधुनिक हिन्दी समतुल्य ‘चौड़ाई’ है, जो लंबाई के समानांतर दूसरा आयाम स्पष्ट करता है।
- source_word: וּבוֹ
  choice: और उसी में
  rationale: सर्वनामिक प्रत्यय नापे हुए भूभाग की ओर लौटता है; ‘उसी में’ उसका संदर्भ स्पष्ट और बलयुक्त रखता है।
- source_word: הַמִּקְדָּשׁ
  choice: पवित्रस्थान
  rationale: मंदिर-दर्शन के संदर्भ में מִקְדָּשׁ के लिए ‘पवित्रस्थान’ प्रतिष्ठित, व्यापक और संप्रदाय-निरपेक्ष हिन्दी पद है।
- source_word: קֹדֶשׁ קָדָשִׁים
  choice: परमपवित्र स्थान
  rationale: यह इब्रानी परमोत्कर्ष-सूचक रचना है। ‘परमपवित्र स्थान’ आधुनिक पाठक के लिए अर्थ स्पष्ट रखता है और इसे पवित्रस्थान के समानाधिकरण में प्रस्तुत करता है।
theological_decisions:
- issue: मंदिर-संदर्भ में קֹדֶשׁ קָדָשִׁים का अनुवाद
  choice: परमपवित्र स्थान
  alternative: परमपवित्र; पवित्रों का पवित्रस्थान
  rationale: वाक्यांश उपासना-संबंधी परमोत्कर्ष को व्यक्त करता है। चुना हुआ रूप स्थान-सूचक अर्थ को स्पष्ट करता है, पर कोई अतिरिक्त धर्मवैज्ञानिक दावा नहीं जोड़ता; अधिक शाब्दिक पारंपरिक रूप पादटिप्पणी में दिया गया है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, गरिमामय और निर्देशात्मक रखी गई है। संख्याओं के साथ मूल पाठ की अनिर्दिष्ट माप-इकाई मुख्य पाठ में नहीं जोड़ी गई; आवश्यक संदर्भ पादटिप्पणी में दिया गया है।
