id: EZK.45.25
reference: Ezekiel 45:25
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: בַּ/שְּׁבִיעִ֡י בַּ/חֲמִשָּׁה֩ עָשָׂ֨ר י֤וֹם לַ/חֹ֨דֶשׁ֙ בֶּ/חָ֔ג יַעֲשֶׂ֥ה כָ/אֵ֖לֶּה שִׁבְעַ֣ת הַ/יָּמִ֑ים כַּֽ/חַטָּאת֙ כָּ/עֹלָ֔ה וְ/כַ/מִּנְחָ֖ה וְ/כַ/שָּֽׁמֶן׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/045/025.yaml
  text: 'In the seventh month[a], on the fifteenth day of the month, at the feast, he shall provide the same offerings for seven days: the sin offering, the burnt offering, the grain offering[b], and the oil.'
translation:
  language: hi
  text: 'सातवें महीने में, महीने के पन्द्रहवें दिन, पर्व के समय, वह सात दिनों तक वैसे ही बलिदानों का प्रबन्ध करे: पापबलि, होमबलि, अन्नबलि और तेल।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בַּשְּׁבִיעִי
  choice: सातवें महीने में
  rationale: क्रमवाचक शब्द आगामी तिथि-वाक्यांश के साथ सातवें महीने को सूचित करता है; स्वाभाविक हिन्दी में ‘महीने’ स्पष्ट करना आवश्यक है।
- source_word: בַּחֲמִשָּׁה עָשָׂר יוֹם לַחֹדֶשׁ
  choice: महीने के पन्द्रहवें दिन
  rationale: यह इब्रानी की मानक पंचांगीय अभिव्यक्ति का स्वाभाविक और औपचारिक हिन्दी रूप है।
- source_word: בֶּחָג
  choice: पर्व के समय
  rationale: חָג धार्मिक पर्व को दर्शाता है; ‘पर्व के समय’ कालगत अर्थ को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: יַעֲשֶׂה כָאֵלֶּה
  choice: वैसे ही बलिदानों का प्रबन्ध करे
  rationale: शाब्दिक अर्थ ‘इनके समान करे’ है, पर सन्दर्भ पहले निर्धारित बलिदानों की ओर लौटता है। ‘प्रबन्ध करे’ प्रधान की जिम्मेदारी दिखाता है और उसे स्वयं याजकीय रीति से चढ़ाने वाला नहीं ठहराता।
- source_word: שִׁבְעַת הַיָּמִים
  choice: सात दिनों तक
  rationale: पर्व की पूरी सात-दिवसीय अवधि को सहज हिन्दी में व्यक्त करता है।
- source_word: כַּחַטָּאת
  choice: पापबलि
  rationale: यह प्रायश्चितार्थ बलिदान की मानक श्रेणी है; सूची में लगे तुलनात्मक כ को हिन्दी में प्रत्येक पद के साथ दोहराना अस्वाभाविक होगा।
- source_word: כָעֹלָה
  choice: होमबलि
  rationale: עוֹלָה के लिए स्थापित और संक्षिप्त हिन्दी बाइबलीय पद है, अर्थात पूर्णतः जलाया जाने वाला बलिदान।
- source_word: וְכַמִּנְחָה
  choice: अन्नबलि
  rationale: बलिदानी प्रसंग में מִנְחָה अनाज से बनी भेंट को दर्शाता है; ‘अन्नबलि’ संक्षिप्त और स्पष्ट है।
- source_word: וְכַשָּׁמֶן
  choice: और तेल
  rationale: यह निर्धारित बलिदानों के साथ प्रयुक्त तेल है; हिन्दी सूची में ‘तेल’ स्वाभाविक है और इब्रानी पद का अर्थ सुरक्षित रखता है।
theological_decisions:
- issue: יַעֲשֶׂה का अंतर्निहित कर्ता
  choice: ‘वह’ निकटवर्ती प्रसंग में वर्णित प्रधान को सूचित करता है
  alternative: कोई अनिर्दिष्ट उपासक या धर्माधिकारी
  rationale: आस-पास के पद इन बलिदानी प्रबन्धों की जिम्मेदारी प्रधान को देते हैं। ‘वह’ इब्रानी की अंतर्निहित कर्तृता बनाए रखता है, जबकि ‘प्रबन्ध करे’ अनावश्यक रूप से याजकीय कार्य नहीं आरोपित करता।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सामान्य पाठक के लिए सुबोध रूप। ‘पापबलि’, ‘होमबलि’ और ‘अन्नबलि’ जैसे स्थापित बलिदानी पद रखे गए हैं। इस पद में कोई पाद-टिप्पणी आवश्यक नहीं समझी गई; दी गई अंग्रेज़ी पाद-टिप्पणियों के चिह्न उनकी सामग्री से उलटे जुड़े प्रतीत होते हैं, इसलिए उन्हें यांत्रिक रूप से नहीं अपनाया गया।
