source:
  edition: WLC
  text: וְ/שִׁבְעַ֨ת יְמֵֽי הֶ/חָ֜ג יַעֲשֶׂ֧ה עוֹלָ֣ה לַֽ/יהוָ֗ה שִׁבְעַ֣ת פָּ֠רִים וְ/שִׁבְעַ֨ת אֵילִ֤ים תְּמִימִם֙ לַ/יּ֔וֹם שִׁבְעַ֖ת הַ/יָּמִ֑ים וְ/חַטָּ֕את שְׂעִ֥יר עִזִּ֖ים לַ/יּֽוֹם־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/045/023.yaml
  text: During the seven days of the feast he shall provide as a burnt offering to Yahweh seven bulls and seven rams without blemish each day for the seven days[b][a], and as a sin offering one male goat each day.
translation:
  language: hi
  text: 'पर्व[a] के सात दिनों में वह याहवे के लिए होमबलि चढ़ाएगा: सात दिनों तक प्रतिदिन सात दोषरहित साँड़ और सात दोषरहित मेढ़े, और पापबलि[b] के रूप में प्रतिदिन एक बकरा।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘उत्सव’।
    reason: lexical_alternative
  - marker: b
    text: या ‘शुद्धिकरण-बलि’।
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶחָג
  choice: पर्व
  rationale: חַג किसी धार्मिक पर्व, विशेषकर तीर्थ-पर्व, को दर्शाता है। ‘पर्व’ आधुनिक हिन्दी में संक्षिप्त, स्वाभाविक और उपासना-संदर्भ के अनुकूल है।
- source_word: יַעֲשֶׂה
  choice: चढ़ाएगा
  rationale: עָשָׂה का मूल अर्थ ‘करना/बनाना’ है, पर बलिदान-संदर्भ में यह बलि की व्यवस्था करने या उसे अर्पित करने का भाव देता है। ‘चढ़ाएगा’ हिन्दी में इस अनुष्ठानिक कार्य को स्वाभाविक रूप से व्यक्त करता है और राजकुमार द्वारा प्रबंध किए जाने की व्यापक पृष्ठभूमि को नकारता नहीं।
- source_word: עוֹלָה
  choice: होमबलि
  rationale: यह पूर्णतः जलाकर अर्पित की जाने वाली बलि का मानक हिन्दी धार्मिक पद है।
- source_word: לַיהוָה
  choice: याहवे के लिए
  rationale: לְ समर्पण या अभिमुखता बताता है और יהוה परमेश्वर का वाचा-नाम है; इसलिए नाम को ‘याहवे’ के रूप में रखा गया है।
- source_word: פָּרִים
  choice: साँड़
  rationale: פַּר बलिदान के संदर्भ में नर गोवंश को दर्शाता है। ‘साँड़’ लिंग को स्पष्ट रखता है और ‘बैल’ से जुड़ी बधियाकृत पशु की सम्भावना से बचता है।
- source_word: אֵילִים
  choice: मेढ़े
  rationale: אֵיל नर भेड़, अर्थात मेढ़ा, का स्पष्ट बलिदानी पद है।
- source_word: תְּמִימִם
  choice: निर्दोष
  rationale: बलिदानी पशुओं के विषय में תָּמִים का अर्थ किसी शारीरिक दोष से रहित होना है। ‘निर्दोष’ प्रचलित और सहज हिन्दी बलिदानी शब्दावली है।
- source_word: לַיּוֹם
  choice: प्रतिदिन
  rationale: इस सूची में לַיּוֹם का वितरणात्मक अर्थ ‘हर दिन’ है; ‘प्रतिदिन’ इसे संक्षेप और स्पष्टता से व्यक्त करता है।
- source_word: חַטָּאת
  choice: पापबलि
  rationale: बलिदानी विधान में חַטָּאת उस बलि को दर्शाता है जो पाप अथवा शुद्धिकरण से सम्बद्ध है। ‘पापबलि’ सर्वाधिक परिचित पद है, जबकि वैकल्पिक अर्थ पादटिप्पणी में सुरक्षित है।
- source_word: שְׂעִיר עִזִּים
  choice: एक बकरा
  rationale: यह पद नर बकरे को दर्शाता है। गणनात्मक सूची में एकवचन को हिन्दी में स्वाभाविक और स्पष्ट बनाने के लिए ‘एक’ रखा गया है।
theological_decisions:
- issue: יהוה परमेश्वर के नाम का अनुवाद
  choice: याहवे
  alternative: प्रभु / यहोवा
  rationale: मूल पाठ में चार अक्षरों वाला वाचा-नाम सीधे आया है। ‘याहवे’ उसका ध्वन्यात्मक प्रतिनिधित्व करता है और उसे किसी उपाधि से प्रतिस्थापित नहीं करता।
- issue: חַטָּאת का बलिदानी अर्थ
  choice: पापबलि
  alternative: शुद्धिकरण-बलि
  rationale: यह शब्द पाप और शुद्धिकरण—दोनों से जुड़ा बलिदानी अर्थ रख सकता है। मुख्य पाठ में परिचित ‘पापबलि’ रखा गया है और वास्तविक वैकल्पिक व्याख्या पादटिप्पणी में दी गई है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। मूल की ‘सात दिनों’ वाली पुनरुक्ति को बनाए रखा गया है। दोनों पशु-समूहों के लिए תְּמִימִם का समान सम्बन्ध स्पष्ट करने हेतु ‘निर्दोष’ दोहराया गया है।
