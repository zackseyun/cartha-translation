  text: וַ/אֲחֻזַּ֨ת הָ/עִ֜יר תִּתְּנ֗וּ חֲמֵ֤שֶׁת אֲלָפִים֙ רֹ֔חַב וְ/אֹ֗רֶךְ חֲמִשָּׁ֤ה וְ/עֶשְׂרִים֙ אֶ֔לֶף לְ/עֻמַּ֖ת תְּרוּמַ֣ת הַ/קֹּ֑דֶשׁ לְ/כָל בֵּ֥ית יִשְׂרָאֵ֖ל יִהְיֶֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/045/006.yaml
  text: And as the city's property[a], you shall give an area five thousand wide and twenty-five thousand long, alongside the holy contribution[b]; it shall belong to the whole house of Israel.
translation:
  language: hi
  text: और नगर की भूमि के लिए तुम पाँच हज़ार चौड़ा और पच्चीस हज़ार लंबा एक क्षेत्र पवित्र अंश के साथ-साथ निर्धारित करोगे; वह इस्राएल के पूरे घराने का होगा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֲחֻזַּת הָעִיר
  choice: नगर की भूमि
  rationale: אֲחֻזָּה यहाँ नगर के लिए निर्धारित भू-संपत्ति या भूमि-अधिकार को दर्शाता है। आधुनिक हिन्दी में ‘नगर की भूमि’ सहज है और भूमि-विभाजन का संदर्भ स्पष्ट रखता है।
- source_word: תִּתְּנוּ
  choice: तुम ... ठहराना
  rationale: נתן का मूल अर्थ ‘देना’ है, पर कानूनी भूमि-विभाजन के इस संदर्भ में ‘ठहराना’ किसी क्षेत्र को निर्धारित करने का भाव स्वाभाविक ढंग से व्यक्त करता है।
- source_word: חֲמֵשֶׁת אֲלָפִים רֹחַב
  choice: पाँच हज़ार चौड़ा
  rationale: मूल पाठ संख्या और चौड़ाई को संक्षेप में रखता है। इस पद में माप की इकाई नहीं दी गई, इसलिए मुख्य पाठ में उसे नहीं जोड़ा गया।
- source_word: וְאֹרֶךְ חֲמִשָּׁה וְעֶשְׂרִים אֶלֶף
  choice: पच्चीस हज़ार लंबा
  rationale: यह मूल इब्रानी की समानांतर माप-अभिव्यक्ति को स्पष्ट और स्वाभाविक हिन्दी में रखता है।
- source_word: לְעֻמַּת
  choice: के समानांतर
  rationale: यह पदबंध सामने, अनुरूप या समानांतर स्थिति का बोध करा सकता है। भूखंडों की स्थानिक व्यवस्था के संदर्भ में ‘समानांतर’ उपयुक्त है, जबकि अन्य सम्भावनाएँ पादटिप्पणी में सुरक्षित हैं।
- source_word: תְּרוּמַת הַקֹּדֶשׁ
  choice: पवित्र अंश
  rationale: תְּרוּמָה अलग किए गए अर्पण या हिस्से को दर्शाता है; यहाँ वह समर्पित भूभाग है। ‘पवित्र अंश’ धार्मिक अर्थ और भूमि-विभाजन, दोनों को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: לְכָל בֵּית יִשְׂרָאֵל יִהְיֶה
  choice: वह इस्राएल के सारे घराने का होगा
  rationale: היה के साथ לְ का प्रयोग यहाँ स्वामित्व या नियत संबंध व्यक्त करता है। ‘सारे घराने’ כָל בֵּית יִשְׂרָאֵל की सामूहिक अभिव्यक्ति को बनाए रखता है।
