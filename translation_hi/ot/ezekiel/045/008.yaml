source:
  edition: WLC
  text: לָ/אָ֛רֶץ יִֽהְיֶה לּ֥/וֹ לַֽ/אֲחֻזָּ֖ה בְּ/יִשְׂרָאֵ֑ל וְ/לֹא יוֹנ֨וּ ע֤וֹד נְשִׂיאַ/י֙ אֶת עַמִּ֔/י וְ/הָ/אָ֛רֶץ יִתְּנ֥וּ לְ/בֵֽית יִשְׂרָאֵ֖ל לְ/שִׁבְטֵי/הֶֽם־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/045/008.yaml
  text: This land shall belong to him as a possession in Israel. And my princes shall no longer oppress my people[a], but they shall give the land to the house of Israel according to their tribes.
translation:
  language: hi
  text: यह भूमि इस्राएल में उसके अधिकार की भूमि होगी। मेरे प्रधान फिर कभी मेरी प्रजा पर अत्याचार नहीं करेंगे, और वे भूमि इस्राएल के घराने को उनके गोत्रों के अनुसार देंगे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לָאָרֶץ
  choice: जहाँ तक इस भूमि का प्रश्न है
  rationale: आरम्भ में आए ל־युक्त, अग्रस्थ पद को विषय-सूचक मानकर अनुवाद किया गया है। प्रसंग में पहले से बताई गई भूमि के कारण ‘इस भूमि’ स्वाभाविक है।
- source_word: יִהְיֶה לּוֹ לַאֲחֻזָּה
  choice: वह ... उसकी संपत्ति होगी
  rationale: ‘उसके लिए होना’ अधिकार या स्वामित्व का इब्रानी मुहावरा है, और אֲחֻזָּה यहाँ भूमि पर स्थायी अधिकार वाली संपत्ति को दर्शाता है। हिंदी में ‘उसकी संपत्ति होगी’ अर्थ को स्पष्ट और सहज रखता है।
- source_word: נְשִׂיאַי
  choice: मेरे प्रधान
  rationale: यहेजकेल में נָשִׂיא शासकीय पद है। ‘प्रधान’ इस पद को बनाए रखता है और ‘राजकुमार’ से उत्पन्न होने वाले केवल वंशगत अर्थ से बचता है।
- source_word: יוֹנוּ
  choice: अत्याचार ... करेंगे
  rationale: ינה के हिफ़ील रूप में दबाने, शोषण करने या अनुचित व्यवहार करने का भाव है। शासकों और प्रजा के प्रसंग में ‘अत्याचार करना’ स्वाभाविक और पर्याप्त व्यापक है।
- source_word: וְהָאָרֶץ יִתְּנוּ
  choice: और वे भूमि ... देंगे
  rationale: וְ को उसके सामान्य संयोजक अर्थ ‘और’ में रखा गया है; ‘बल्कि’ जोड़कर विरोध को मूल पाठ से अधिक स्पष्ट नहीं किया गया। अग्रस्थ ‘भूमि’ को हिंदी वाक्य-विन्यास में कर्म के रूप में सहज ढंग से रखा गया है।
- source_word: לְבֵית יִשְׂרָאֵל
  choice: इस्राएल के घराने को
  rationale: यह भविष्यद्वक्ताओं की विशिष्ट सामूहिक संज्ञा है; साहित्यिक और वाचाई प्रतिध्वनि बनाए रखने के लिए ‘घराना’ रखा गया है।
- source_word: לְשִׁבְטֵיהֶם
  choice: उनके गोत्रों के अनुसार
  rationale: यह भूमि के गोत्रवार वितरण का भाव देता है। ‘गोत्रों के अनुसार’ आधुनिक हिंदी में इस वितरण को स्पष्ट करता है।
theological_decisions:
- issue: ‘उसकी’ सर्वनाम का संदर्भ
  choice: सर्वनाम को यथावत रखा गया है; निकटवर्ती प्रसंग इसे प्रधान से जोड़ता है।
  alternative: इसे सामान्य शासक या सामूहिक शासकीय पद का संकेत माना जा सकता है।
  rationale: मूल पाठ केवल एकवचन सर्वनाम देता है। ‘प्रधान’ जोड़कर स्पष्ट कर देना संभावित संदर्भ को अनुवाद के भीतर अनावश्यक रूप से निश्चित कर देता।
- issue: भूमि देने वाले बहुवचन कर्ता की पहचान
  choice: ‘वे’ को पिछले बहुवचन ‘मेरे प्रधान’ से स्वाभाविक रूप से जोड़ा गया है।
  alternative: क्रिया को अपेक्षात्मक या आदेशात्मक भाव में समझकर ‘उन्हें भूमि देनी होगी’ कहा जा सकता है।
  rationale: इब्रानी बहुवचन क्रिया का निकटतम व्याकरणिक कर्ता ‘मेरे प्रधान’ है; सामान्य भविष्यकाल मूल कथन की औपचारिक अस्पष्टता बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिंदी का गरिमापूर्ण, सामान्य-पाठक-सुलभ रूप अपनाया गया है। ‘प्रधान’, ‘प्रजा’, ‘घराना’ और ‘गोत्र’ भविष्यद्वक्ताई तथा भूमि-वितरण के प्रसंग की औपचारिकता बनाए रखते हैं, जबकि वाक्य-विन्यास सहज हिंदी में है।
