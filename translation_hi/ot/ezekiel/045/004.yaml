  text: קֹ֣דֶשׁ מִן הָ/אָ֜רֶץ ה֗וּא לַ/כֹּ֨הֲנִ֜ים מְשָׁרְתֵ֤י הַ/מִּקְדָּשׁ֙ יִֽהְיֶ֔ה הַ/קְּרֵבִ֖ים לְ/שָׁרֵ֣ת אֶת יְהוָ֑ה וְ/הָיָ֨ה לָ/הֶ֤ם מָקוֹם֙ לְ/בָ֣תִּ֔ים וּ/מִקְדָּ֖שׁ לַ/מִּקְדָּֽשׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/045/004.yaml
  text: It is a holy portion of the land; it shall be for the priests[a], the ministers of the sanctuary, who draw near to minister to Yahweh. And it shall be for them as a place for houses and as a holy place for the sanctuary.
translation:
  language: hi
  text: भूमि का यह पवित्र भाग याजकों के लिए होगा—अर्थात् पवित्रस्थान के सेवकों के लिए, जो याहवे की सेवा करने के लिए उसके निकट आते हैं। यह उनके लिए घरों का स्थान और पवित्रस्थान के लिए एक पवित्र स्थान[a] होगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “पवित्रस्थान के लिए एक समर्पित क्षेत्र।” इब्रानी पदबंध संक्षिप्त है; इसका अर्थ पवित्रस्थान से संबंधित या उसके लिए निर्धारित पवित्र क्षेत्र भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: קֹדֶשׁ מִן־הָאָרֶץ
  choice: भूमि का यह पवित्र भाग
  rationale: भूमि-विभाजन के प्रसंग में קֹדֶשׁ किसी अमूर्त ‘पवित्रता’ के बजाय भूमि के अलग किए गए पवित्र भाग को दर्शाता है; מִן का भाव अंशसूचक है।
- source_word: מְשָׁרְתֵי הַמִּקְדָּשׁ
  choice: जो पवित्रस्थान में सेवा करते हैं
  rationale: यह याजकीय उपासना-सेवा को सहज आधुनिक हिन्दी में व्यक्त करता है और किसी बाद की धार्मिक पदवी को आरोपित नहीं करता।
- source_word: הַקְּרֵבִים לְשָׁרֵת
  choice: सेवा करने के लिए उसके निकट आते हैं
  rationale: קְרֵבִים के याजकीय, उपासना-संबंधी ‘निकट आने’ के भाव को बनाए रखता है; ‘उसके’ से सेवा के प्राप्तकर्ता याहवे के प्रति निकटता स्पष्ट होती है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी पाठ में आए परमेश्वर के विशिष्ट वाचा-नाम को नाम के रूप में प्रस्तुत किया गया है।
- source_word: מָקוֹם לְבָתִּים
  choice: उनके घरों के लिए स्थान
  rationale: यह याजकों के निवास हेतु निर्धारित जगह का सीधा और स्वाभाविक हिन्दी रूप है।
- source_word: וּמִקְדָּשׁ לַמִּקְדָּשׁ
  choice: और पवित्रस्थान के लिए पवित्र क्षेत्र
  rationale: पहले מִקְדָּשׁ को समर्पित पवित्र क्षेत्र और दूसरे को मुख्य पवित्रस्थान समझते हुए कठिन एवं संक्षिप्त इब्रानी पदबंध को स्पष्ट किया गया है, पर वैकल्पिक अर्थ पादटिप्पणी में रखा गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: प्रभु
  rationale: मूल पाठ विशिष्ट ईश्वरीय नाम का प्रयोग करता है; ‘याहवे’ उसे सामान्य उपाधि में बदले बिना सुरक्षित रखता है।
- issue: याजकों का याहवे के निकट आना
  choice: उसके निकट आते हैं
  alternative: आगे आते हैं
  rationale: ‘निकट आना’ यहेजकेल में याजकीय सेवा का विशेष उपासना-संबंधी भाव रखता है; इसे केवल सामान्य गति के रूप में नहीं बनाया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण धार्मिक गद्य अपनाया गया है। ‘पवित्रस्थान’ को एक शब्द में रखा गया है ताकि भवन अथवा उपासना-केंद्र का भाव ‘पवित्र स्थान’ जैसे सामान्य वर्णन से अलग रहे।
