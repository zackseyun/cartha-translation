  text: וְ/שֶׂה אַחַ֨ת מִן הַ/צֹּ֤אן מִן הַ/מָּאתַ֨יִם֙ מִ/מַּשְׁקֵ֣ה יִשְׂרָאֵ֔ל לְ/מִנְחָ֖ה וּ/לְ/עוֹלָ֣ה וְ/לִ/שְׁלָמִ֑ים לְ/כַפֵּ֣ר עֲלֵי/הֶ֔ם נְאֻ֖ם אֲדֹנָ֥/י יְהוִֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/045/015.yaml
  text: and one sheep from every two hundred from the well-watered pastures of Israel[a], for a grain offering and for a burnt offering and for peace offerings, to make atonement for them, declares the Lord GOD.
translation:
  language: hi
  text: और इस्राएल की अच्छी तरह सिंचित चरागाहों से आने वाले भेड़-बकरियों के हर दो सौ पशुओं में से एक पशु अन्नबलि, होमबलि और मेलबलियों के लिए होगा, ताकि उनके लिए प्रायश्चित किया जाए। प्रभु याहवे की यह घोषणा है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְשֶׂה אַחַת מִן הַצֹּאן מִן הַמָּאתַיִם
  choice: भेड़-बकरियों के झुंड में से हर दो सौ पशुओं पर एक पशु
  rationale: שֶׂה भेड़ या बकरी, दोनों में से किसी एक पशु को सूचित कर सकता है; इसलिए केवल ‘भेड़’ कहकर अर्थ सीमित नहीं किया गया। अनुपात को स्वाभाविक हिन्दी में स्पष्ट किया गया है।
- source_word: מִמַּשְׁקֵה יִשְׂרָאֵל
  choice: इस्राएल की अच्छी सिंचाई वाली चरागाहों
  rationale: מַשְׁקֶה पानी पिलाने या सिंचाई से संबंधित है और यहाँ पशुओं के स्रोत के रूप में अच्छी तरह सिंचित चरागाहों का संकेत देता है।
- source_word: לְמִנְחָה
  choice: अन्नबलि
  rationale: बलिदान-संबंधी इस प्रसंग में מִנְחָה सामान्यतः अन्नबलि का तकनीकी पद है।
- source_word: וּלְעוֹלָה
  choice: होमबलि
  rationale: עוֹלָה उस बलि का मानक पद है जो पूर्णतः वेदी पर जलाई जाती थी; ‘होमबलि’ प्रचलित और संक्षिप्त हिन्दी पद है।
- source_word: וְלִשְׁלָמִים
  choice: मेलबलियों
  rationale: שְׁלָמִים शांति, कुशलता और सहभागिता से जुड़ी बलियों को दर्शाता है; ‘मेलबलि’ अर्थ को किसी एक संकीर्ण व्याख्या तक सीमित किए बिना हिन्दी में स्वाभाविक धार्मिक पद देता है।
- source_word: לְכַפֵּר עֲלֵיהֶם
  choice: लोगों के लिए प्रायश्चित किया जाए
  rationale: כפר के बलिदान-संबंधी अर्थ और עֲלֵיהֶם के बहुवचन संदर्भ को बनाए रखा गया है; ‘लोगों’ से हिन्दी में अस्पष्ट सर्वनाम का आशय स्पष्ट होता है, पर प्रायश्चित की किसी विशिष्ट धर्मवैज्ञानिक व्याख्या को आरोपित नहीं किया गया।
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: प्रभु याहवे की यह वाणी है
  rationale: נְאֻם को स्वाभाविक भविष्यद्वाणी-सूत्र ‘यह वाणी है’ से और אֲדֹנָי יְהוִה को उपाधि तथा व्यक्तिगत ईश्वरीय नाम दोनों बनाए रखते हुए ‘प्रभु याहवे’ से व्यक्त किया गया है।
theological_decisions:
- issue: שֶׂה की पशु-जाति
  choice: एक पशु, भेड़-बकरियों के झुंड में से
  alternative: एक भेड़
  rationale: इब्रानी शब्द भेड़ या बकरी दोनों को सूचित कर सकता है; अनुवाद वास्तविक व्यापकता को सुरक्षित रखता है।
- issue: לְכַפֵּר का धर्मवैज्ञानिक आशय
  choice: प्रायश्चित किया जाए
  alternative: शुद्ध किया जाए
  rationale: ‘प्रायश्चित’ बलिदान-संबंधी मूल अर्थ को बनाए रखता है और यहाँ क्रिया के प्रभाव की किसी एक संकीर्ण व्याख्या का निर्णय नहीं करता।
- issue: अֲדֹנָי יְהוִה में ईश्वरीय नाम
  choice: प्रभु याहवे
  alternative: प्रभु परमेश्वर
  rationale: व्यक्तिगत नाम יהוה और उपाधि אֲדֹנָי दोनों को अलग-अलग व्यक्त किया गया है; नाम को सामान्य उपाधि में विलीन नहीं किया गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। पहले वाक्य में ‘देना होगा’ संदर्भगत अंशदान की अपेक्षा को स्वाभाविक हिन्दी में व्यक्त करता है। बलिदान-संबंधी पदों के लिए प्रचलित ‘अन्नबलि’, ‘होमबलि’, ‘मेलबलि’ और ‘प्रायश्चित’ का प्रयोग किया गया है।
