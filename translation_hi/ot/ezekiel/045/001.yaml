  text: וּ/בְ/הַפִּֽילְ/כֶ֨ם אֶת הָ/אָ֜רֶץ בְּ/נַחֲלָ֗ה תָּרִימוּ֩ תְרוּמָ֨ה לַ/יהוָ֥ה קֹדֶשׁ֮ מִן הָ/אָרֶץ֒ אֹ֗רֶךְ חֲמִשָּׁ֨ה וְ/עֶשְׂרִ֥ים אֶ֨לֶף֙ אֹ֔רֶךְ וְ/רֹ֖חַב עֲשָׂ֣רָה אָ֑לֶף קֹדֶשׁ ה֥וּא בְ/כָל גְּבוּלָ֖/הּ סָבִֽיב־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/045/001.yaml
  text: 'And when you divide the land as an inheritance[a], you shall set apart a contribution to Yahweh, a holy portion from the land: twenty-five thousand cubits in length and ten thousand in width[b]. It shall be holy within all its surrounding boundary.'
translation:
  language: hi
  text: जब तुम देश को विरासत के रूप में बाँटोगे[a], तब तुम यहोवा के लिए देश में से एक पवित्र अंश अलग करोगे—उसकी लंबाई पच्चीस हज़ार हाथ और चौड़ाई दस हज़ार हाथ होगी[b]। वह अपने चारों ओर की सारी सीमा में पवित्र होगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या: “जब तुम देश को चिट्ठी डालकर विरासत के रूप में बाँटोगे।”'
    reason: lexical_alternative
  - marker: b
    text: मूल इब्रानी में केवल “पच्चीस हज़ार लंबाई और दस हज़ार चौड़ाई” है; माप के संदर्भ के आधार पर “हाथ” जोड़ा गया है।
    reason: cultural_note
lexical_decisions:
- source_word: וּבְהַפִּילְכֶם
  choice: जब तुम ... बाँटोगे
  rationale: हिफ़ील रूप भूमि के हिस्से निर्धारित करने, मूलतः चिट्ठी डालकर बाँटने, को दर्शाता है। सहज हिन्दी में ‘बाँटोगे’ रखा गया और अधिक विशिष्ट अर्थ पाद-टिप्पणी में दिया गया।
- source_word: בְּנַחֲלָה
  choice: विरासत के रूप में
  rationale: נַחֲלָה पैतृक अथवा विरासत में मिले अधिकार और भूमि-अंश का बोध कराता है; यह पदबंध उस वाचा-संबंधी भूमि-भाव को बनाए रखता है।
- source_word: תָּרִימוּ תְרוּמָה
  choice: एक अंश अलग करना
  rationale: यह मुहावरा किसी वस्तु को समर्पण के लिए अलग निर्धारित करने का है। यहाँ वस्तु भूमि है, इसलिए सामान्य ‘भेंट’ की अपेक्षा ‘अंश अलग करना’ अधिक सटीक और स्वाभाविक है।
- source_word: לַיהוָה
  choice: यहोवा के लिए
  rationale: ל समर्पण अथवा नियत किए जाने का संबंध बताता है; יְהוָה को उसके व्यक्तिवाचक वाचा-नाम ‘यहोवा’ से व्यक्त किया गया है।
- source_word: קֹדֶשׁ מִן הָאָרֶץ
  choice: एक पवित्र भूभाग
  rationale: קֹדֶשׁ यहाँ देश में से अलग किए गए पवित्र क्षेत्र के लिए संज्ञात्मक रूप में प्रयुक्त है। ‘भूभाग’ आगामी मापों के साथ स्पष्ट बैठता है।
- source_word: אֹרֶךְ חֲמִשָּׁה וְעֶשְׂרִים אֶלֶף ... וְרֹחַב עֲשָׂרָה אָלֶף
  choice: उसकी लंबाई पच्चीस हज़ार हाथ और चौड़ाई दस हज़ार हाथ
  rationale: मूल में माप की इकाई व्यक्त नहीं है, किंतु दर्शन के मापन-संदर्भ में हाथ निहित समझा जाता है। हिन्दी में स्पष्टता के लिए इसे जोड़ा गया और पाद-टिप्पणी में बताया गया।
- source_word: קֹדֶשׁ הוּא בְכָל גְּבוּלָהּ סָבִיב
  choice: उसकी चारों ओर की पूरी सीमा के भीतर का क्षेत्र पवित्र होगा
  rationale: यह अनुवाद पूरे परिसीमित भूभाग की पवित्रता व्यक्त करता है और בְכָל तथा סָבִיב की व्यापकता बनाए रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल में चार अक्षरों वाला व्यक्तिवाचक वाचा-नाम सीधे आया है। हिन्दी बाइबल-पाठकों के बीच पहचाना जाने वाला रूप ‘यहोवा’ नाम को उपाधि में बदले बिना प्रस्तुत करता है।
- issue: भूमि-अर्पण के लिए תְרוּמָה का अर्थ
  choice: अंश
  alternative: भेंट
  rationale: यहाँ समर्पित वस्तु एक मापा हुआ भूभाग है; ‘अंश’ उस स्थानिक अर्थ को स्पष्ट करता है और इसे चल संपत्ति अथवा बलिदान की भेंट मान लेने से बचाता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, निर्देशात्मक शैली रखी गई है। ‘पवित्र भूभाग’ और ‘अंश अलग करना’ भूमि-विभाजन के संदर्भ को साफ रखते हैं। मूल की निहित माप-इकाई तथा चिट्ठी द्वारा आवंटन की संभावना पाद-टिप्पणियों में सुरक्षित हैं।
