  yaml_path: translation/ot/ezekiel/045/010.yaml
  text: You must have honest scales[a], an honest ephah[c][b], and an honest bath.
translation:
  language: hi
  text: तुम्हारे पास सही तराज़ू, सही एपा[a] और सही बत[b] हों।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: एपा सूखी वस्तुओं को नापने की एक मानक इकाई थी।
    reason: cultural_note
  - marker: b
    text: बत तरल पदार्थों को नापने की एक मानक इकाई थी।
    reason: cultural_note
lexical_decisions:
- source_word: מֹאזְנֵי
  choice: तराज़ू
  rationale: यह द्विवचन/बहुवचन रूप तौलने के साधन को दर्शाता है। आधुनिक हिन्दी में ‘तराज़ू’ स्वाभाविक और स्पष्ट है।
- source_word: צֶדֶק
  choice: सही
  rationale: यह शब्द तीनों मापों के साथ दोहराया गया है और व्यापारिक संदर्भ में न्यायसंगत, प्रामाणिक तथा बिना हेरफेर के माप का भाव देता है। ‘सही’ इस पुनरावृत्ति और नैतिक बल को सहज हिन्दी में बनाए रखता है।
- source_word: אֵיפַת
  choice: एपा
  rationale: यह सूखी वस्तुओं की एक विशिष्ट इब्रानी माप-इकाई है; सांस्कृतिक विशिष्टता बनाए रखने के लिए इसका लिप्यंतरण किया गया है और अर्थ पादटिप्पणी में दिया गया है।
- source_word: בַת
  choice: बत
  rationale: यह तरल पदार्थों की एक विशिष्ट इब्रानी माप-इकाई है; स्रोत में एपा के साथ इसके युग्म को बनाए रखने हेतु लिप्यंतरण किया गया है।
- source_word: יְהִי לָכֶם
  choice: तुम्हारे पास ... हों
  rationale: यह विधिक निर्देश का भाव रखने वाला वाक्यांश है। यह रूप मूल के ‘तुम्हारे लिए हों’ के निकट रहते हुए आधुनिक हिन्दी में स्वाभाविक निर्देश व्यक्त करता है।
