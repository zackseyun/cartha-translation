source:
  edition: WLC
  text: וְ/כֵ֤ן תַּֽעֲשֶׂה֙ בְּ/שִׁבְעָ֣ה בַ/חֹ֔דֶשׁ מֵ/אִ֥ישׁ שֹׁגֶ֖ה וּ/מִ/פֶּ֑תִי וְ/כִפַּרְתֶּ֖ם אֶת הַ/בָּֽיִת־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/045/020.yaml
  text: And so you shall do on the seventh day of the month for anyone who sins unintentionally or through simplicity[b][a]; thus you shall make atonement for the temple.
translation:
  language: hi
  text: और महीने के सातवें दिन भी तुम ऐसा ही करना—हर उस व्यक्ति के कारण जो अनजाने में भूल करता है या भोला-भाला है[a]। इस प्रकार तुम मंदिर के लिए प्रायश्चित करोगे[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अनजाने में भूल करने वाले व्यक्ति और भोले-भाले व्यक्ति के कारण।” इब्रानी दो प्रकार के लोगों में भेद कर सकती है; “भोला-भाला” का अर्थ “अनुभवहीन” या “सीधा-सादा” भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक अर्थ “घर” है; यहाँ इससे मंदिर या पवित्रस्थान अभिप्रेत है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכֵן תַּעֲשֶׂה
  choice: भी तुम ऐसा ही करना
  rationale: यह पद पिछले अनुष्ठान से जुड़कर उसी के अनुरूप कार्य करने की आज्ञा देता है। हिंदी का यह रूप संबंध और आदेश दोनों को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: בְּשִׁבְעָה בַחֹדֶשׁ
  choice: महीने के सातवें दिन
  rationale: इब्रानी वाक्यांश में ‘दिन’ निहित है; हिंदी में अर्थ स्पष्ट करने के लिए इसे व्यक्त किया गया है।
- source_word: מֵאִישׁ
  choice: हर उस व्यक्ति के कारण
  rationale: אִישׁ यहाँ किसी भी व्यक्ति के लिए सामान्य अर्थ में है। מִן को ‘के कारण’ कहना मानवीय भूल और भवन के प्रायश्चित के बीच संबंध बनाए रखता है।
- source_word: שֹׁגֶה
  choice: जो अनजाने में भटक जाए
  rationale: שגה भूल करने या अनजाने में पथ से चूकने का भाव रखता है। ‘भटक जाए’ मूल रूपक को बचाता है और ‘अनजाने में’ अनैच्छिकता स्पष्ट करता है।
- source_word: וּמִפֶּתִי
  choice: या भोला हो
  rationale: פֶּתִי भोले, अनुभवहीन या सरल व्यक्ति को सूचित कर सकता है। ‘भोला’ आधुनिक हिंदी में सहज है; पाठ की व्याकरणिक अस्पष्टता पादटिप्पणी में सुरक्षित है।
- source_word: וְכִפַּרְתֶּם
  choice: इस प्रकार तुम ... के लिए प्रायश्चित करोगे
  rationale: כפר का याजकीय संदर्भ में पारंपरिक और पारदर्शी हिंदी प्रतिशब्द ‘प्रायश्चित करना’ है। बहुवचन क्रिया के अनुरूप ‘तुम ... करोगे’ रखा गया है।
- source_word: הַבָּיִת
  choice: भवन
  rationale: शाब्दिक अर्थ ‘घर/भवन’ है और इस दर्शन में संदर्भ मंदिर का है। मुख्य पाठ में स्रोत की अभिव्यक्ति रखी गई है तथा पादटिप्पणी संदर्भ स्पष्ट करती है।
theological_decisions:
- issue: प्रायश्चित का प्रत्यक्ष लक्ष्य
  choice: भवन के लिए प्रायश्चित
  alternative: भूल करने वाले व्यक्ति के लिए प्रायश्चित
  rationale: כפר का प्रत्यक्ष कर्म הַבָּיִת है; इसलिए संस्कार का लक्ष्य मंदिर-भवन है, यद्यपि उसका अवसर लोगों की अनजानी भूल या भोलापन है।
- issue: שֹׁגֶה और פֶּתִי का संबंध
  choice: ऐसा व्यक्ति जो अनजाने में भटके या भोला हो
  alternative: दो वर्ग—भूल करने वाला व्यक्ति और भोला व्यक्ति
  rationale: इब्रानी दो अलग श्रेणियों का संकेत दे सकती है, पर वाक्यरचना को एक व्यक्ति की दो वैकल्पिक स्थितियों के रूप में भी समझा जा सकता है। मुख्य पाठ पठनीय रूप अपनाता है और पादटिप्पणी वास्तविक अस्पष्टता बचाती है।
- issue: אִישׁ का सामान्य दायरा
  choice: हर उस व्यक्ति
  alternative: हर पुरुष
  rationale: व्याकरणिक रूप पुल्लिंग एकवचन है, पर यहाँ उसका प्रयोग सामान्य मानवीय संदर्भ में है; ‘व्यक्ति’ स्रोत के आशय को अनावश्यक लैंगिक सीमा के बिना व्यक्त करता है।
translation_notes:
  register: आधुनिक मानक हिंदी का गरिमापूर्ण, सहज धार्मिक गद्य। आदेश में ‘करना’ का प्रयोग अनुष्ठानिक निर्देश को स्पष्ट रखता है। ‘प्रायश्चित’ स्थापित धर्मग्रंथीय शब्द है, जबकि ‘भवन’ मूल के ‘घर’ रूपक को ‘मंदिर’ में चुपचाप बदलने से बचाता है।
