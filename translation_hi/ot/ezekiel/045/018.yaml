base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/045/018.yaml
  text: 'Thus says the Lord GOD: In the first month[a], on the first day of the month, you shall take a bull from the herd without blemish, and you shall purify the sanctuary.'
translation:
  language: hi
  text: '“प्रभु यहोवा यों कहते हैं: पहले महीने के पहले दिन तुम गाय-बैलों के झुंड में से एक निष्कलंक बैल लेना और पवित्रस्थान को शुद्ध करना।[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “पवित्रस्थान के लिए प्रायश्चित करना।” यहाँ प्रयुक्त इब्रानी क्रिया एक अनुष्ठानिक पद है, जिसका अर्थ पाप से उत्पन्न अशुद्धि को दूर करना भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  choice: प्रभु यहोवा
  rationale: संयुक्त ईश्वरीय उपाधि को स्वाभाविक और प्रतिष्ठित हिन्दी में व्यक्त करते हुए यहोवा नाम को स्पष्ट रखा गया है।
- source_word: בָּרִאשׁוֹן בְּאֶחָד לַחֹדֶשׁ
  choice: पहले महीने के पहले दिन
  rationale: पहला पद कैलेंडर-संदर्भ में महीना सूचित करता है और अगला मानक इब्रानी तिथि-वाक्यांश महीने के पहले दिन को दर्शाता है।
- source_word: תִּקַּח
  choice: तुम ... लेना
  rationale: विधिक निर्देश वाले अपूर्ण रूप की आदेशात्मक शक्ति को आधुनिक हिन्दी के स्वाभाविक निर्देशात्मक प्रयोग से व्यक्त किया गया है।
- source_word: פַּר בֶּן בָּקָר
  choice: गाय-बैलों में से एक बैल
  rationale: यह पद पशु के गोवंशीय झुंड से होने को बताता है; आयु को अनावश्यक रूप से निश्चित नहीं किया गया।
- source_word: תָּמִים
  choice: निर्दोष
  rationale: बलि-संबंधी प्रसंग में इसका अर्थ शारीरिक दोष या दाग से रहित, स्वीकार्य पशु है; ‘निर्दोष’ हिन्दी बाइबलीय-धार्मिक प्रयोग में संक्षिप्त और बोधगम्य है।
- source_word: וְחִטֵּאתָ
  choice: शुद्ध करना
  rationale: חטא का पिएल रूप यहाँ पापजनित अशुद्धि दूर करने की अनुष्ठानिक क्रिया बताता है, न कि पवित्रस्थान द्वारा पाप करना।
- source_word: הַמִּקְדָּשׁ
  choice: पवित्रस्थान
  rationale: यह पवित्र परिसर अथवा धर्मस्थान का सामान्य उपासना-संबंधी पद है; ‘पवित्रस्थान’ उसका गरिमापूर्ण और प्रचलित हिन्दी समतुल्य है।
theological_decisions:
- issue: पवित्रस्थान को कर्म बनाकर प्रयुक्त חטא के अनुष्ठानिक अर्थ का अनुवाद
  choice: पवित्रस्थान को शुद्ध करना
  alternative: पवित्रस्थान के लिए प्रायश्चित करना
  rationale: मुख्य पाठ अनुष्ठान द्वारा पापजनित अशुद्धि हटाने की क्रिया को सहज हिन्दी में व्यक्त करता है। ‘प्रायश्चित करना’ एक वास्तविक पारंपरिक विकल्प है, इसलिए मूल की धार्मिक अर्थ-व्याप्ति बनाए रखने हेतु उसे पादटिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठक के लिए स्पष्ट। विधिक निर्देश को स्वाभाविक हिन्दी में रखा गया है और अनुष्ठानिक क्रिया की वास्तविक अर्थगत अस्पष्टता पादटिप्पणी में सुरक्षित है।
