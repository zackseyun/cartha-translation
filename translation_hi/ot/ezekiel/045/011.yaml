id: EZK.45.11
reference: Ezekiel 45:11
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: הָ/אֵיפָ֣ה וְ/הַ/בַּ֗ת תֹּ֤כֶן אֶחָד֙ יִֽהְיֶ֔ה לָ/שֵׂ֕את מַעְשַׂ֥ר הַ/חֹ֖מֶר הַ/בָּ֑ת וַ/עֲשִׂירִ֤ת הַ/חֹ֨מֶר֙ הָֽ/אֵיפָ֔ה אֶל הַ/חֹ֖מֶר יִהְיֶ֥ה מַתְכֻּנְתּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/045/011.yaml
  text: The ephah and the bath shall be of one measure[a], so that the bath may hold a tenth of a homer, and the ephah a tenth of a homer[c][b]; their standard shall be according to the homer.
translation:
  language: hi
  text: 'एपा और बत का परिमाण एक ही होगा[a]: बत में होमेर का दसवाँ भाग और एपा में भी होमेर का दसवाँ भाग आएगा[c][b]। उनका मान होमेर के अनुसार होगा।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उनका निर्धारित अनुपात होमेर के अनुसार होगा।”
    reason: lexical_alternative
  - marker: b
    text: होमेर एक बड़ी मानक माप थी; एपा (सूखी वस्तुओं की माप) और बत (तरल पदार्थों की माप), दोनों उसका दसवाँ भाग थे।
    reason: cultural_note
  - marker: c
    text: “कोर” होमेर का एक पारंपरिक वैकल्पिक नाम है।
    reason: alternative_reading
lexical_decisions:
- source_word: אֵיפָה
  choice: एपा
  rationale: यह सूखी वस्तुओं की एक विशिष्ट प्राचीन माप है; अनुमानित आधुनिक इकाई देने के बजाय इसके नाम का लिप्यंतरण किया गया है।
- source_word: בַּת
  choice: बत
  rationale: यह तरल पदार्थों की एक विशिष्ट प्राचीन माप है; तकनीकी इकाई को बनाए रखने के लिए लिप्यंतरण किया गया है।
- source_word: תֹּכֶן אֶחָד
  choice: परिमाण एक ही होगा
  rationale: यह पद दोनों इकाइयों के समान निर्धारित परिमाण या मान को व्यक्त करता है; यह हिन्दी में स्वाभाविक रहते हुए माप-विज्ञान का आशय सुरक्षित रखता है।
- source_word: לָשֵׂאת
  choice: में ... आएगा
  rationale: माप की धारिता के संदर्भ में क्रिया का अर्थ किसी मात्रा को समाना या धारण करना है; हिन्दी में ‘में ... आएगा’ सहज और सटीक है।
- source_word: מַעְשַׂר / עֲשִׂירִת
  choice: दसवाँ भाग
  rationale: दोनों समानांतर शब्द यहाँ मात्रात्मक रूप से एक-दशमांश बताते हैं, धार्मिक दशमांश नहीं।
- source_word: חֹמֶר
  choice: होमेर
  rationale: यह बड़ी मानक माप का इब्रानी नाम है; आधुनिक माप में अनुमान लगाने के बजाय उसका लिप्यंतरण मूल इकाई को सुरक्षित रखता है।
- source_word: אֶל הַחֹמֶר
  choice: होमेर के अनुसार
  rationale: पूर्वसर्ग यहाँ छोटी मापों के लिए होमेर को नियंत्रक संदर्भ-मान के रूप में प्रस्तुत करता है।
- source_word: מַתְכֻּנְתּוֹ
  choice: उनका मान
  rationale: रूप व्याकरणतः एकवचन है, पर संदर्भ में एपा और बत के निर्धारित सामूहिक मान या अनुपात की ओर संकेत करता है; हिन्दी बहुवचन संबंध इस संदर्भ को स्पष्ट करता है।
theological_decisions: []
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और माप-संबंधी भाषा रखी गई है। प्राचीन इकाइयों एपा, बत और होमेर का लिप्यंतरण किया गया है, जबकि उनके संबंध को स्पष्ट करने के लिए ‘परिमाण’, ‘दसवाँ भाग’ और ‘मान’ जैसे सामान्य शब्द अपनाए गए हैं।
