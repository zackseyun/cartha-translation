language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: בָּ֠/רִאשׁוֹן בְּ/אַרְבָּעָ֨ה עָשָׂ֥ר יוֹם֙ לַ/חֹ֔דֶשׁ יִהְיֶ֥ה לָ/כֶ֖ם הַ/פָּ֑סַח חָ֕ג שְׁבֻע֣וֹת יָמִ֔ים מַצּ֖וֹת יֵאָכֵֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/045/021.yaml
  text: In the first month[a], on the fourteenth day of the month, you shall have the Passover, a feast of seven days[b]; unleavened bread shall be eaten.
translation:
  language: hi
  text: पहले महीने में, महीने के चौदहवें दिन, तुम्हारे लिए फसह[a] होगा—सात दिनों[b] का पर्व; अख़मीरी रोटी खाई जाएगी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से, “फसह, सात दिनों का पर्व।” अन्य स्थानों पर फसह और अख़मीरी रोटी के पर्व में भेद किया जा सकता है, पर यहाँ पाठ उन्हें साथ प्रस्तुत करता है।
    reason: alternative_reading
  - marker: b
    text: “सात दिनों का” का अनुवाद “सात दिनों तक” भी हो सकता है। इब्रानी अभिव्यक्ति शाब्दिक रूप से “दिनों के सप्ताह” है और यहाँ सात दिन की अवधि को दर्शाती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּרִאשׁוֹן
  choice: पहले महीने में
  rationale: तिथिसूचक संदर्भ में ‘पहले’ से पहला महीना अभिप्रेत है; अगले पदांश में ‘महीना’ स्पष्ट होने के कारण हिन्दी में इसे स्वाभाविक रूप से पूरा किया गया है।
- source_word: בְּאַרְבָּעָה עָשָׂר יוֹם לַחֹדֶשׁ
  choice: महीने के चौदहवें दिन
  rationale: यह इब्रानी की सामान्य तिथि-अभिव्यक्ति है और हिन्दी में यही सटीक तथा स्वाभाविक रूप है।
- source_word: יִהְיֶה לָכֶם
  choice: तुम्हारे लिए ... होगा
  rationale: इससे मूल का अस्तित्व/सम्बन्धसूचक ढाँचा और निर्देशात्मक भाव बना रहता है; इसे केवल ‘मनाना’ कहकर क्रिया को अधिक स्पष्ट नहीं किया गया।
- source_word: הַפָּסַח
  choice: फसह
  rationale: यह स्थापित पर्व का निश्चित नाम है; आधुनिक हिन्दी बाइबलीय प्रयोग में ‘फसह’ परिचित और संक्षिप्त है।
- source_word: חָג
  choice: पर्व
  rationale: חָג धार्मिक उत्सव को दर्शाता है; ‘पर्व’ आधुनिक, गरिमापूर्ण और सामान्य हिन्दी में स्पष्ट है।
- source_word: שְׁבֻעוֹת יָמִים
  choice: सात दिनों का
  rationale: यहाँ यह अभिव्यक्ति सात दिन की अवधि बताती है। हिन्दी में ‘सात दिनों का पर्व’ मूल के समान पद-समानाधिकरण को बनाए रखता है।
- source_word: מַצּוֹת
  choice: अख़मीरी रोटी
  rationale: यह खमीर के बिना बनी रोटी को दर्शाता है; ‘अख़मीरी रोटी’ अर्थ की स्पष्टता और प्रचलित धार्मिक शब्दावली दोनों बनाए रखती है।
- source_word: יֵאָכֵל
  choice: खाई जाएगी
  rationale: निफ़अल अपूर्ण क्रिया का कर्मवाच्य और निर्देशात्मक भाव सुरक्षित रखा गया है।
theological_decisions:
- issue: फसह और सात दिनों के पर्व का सम्बन्ध
  choice: ‘फसह होगा—सात दिनों का पर्व’ के रूप में दोनों को साथ प्रस्तुत करना
  alternative: फसह के एक दिन और अख़मीरी रोटी के सात-दिवसीय पर्व को अनुवाद में स्पष्ट रूप से अलग करना
  rationale: इब्रानी पाठ ‘फसह, सात दिनों का पर्व’ के समानाधिकरण-सदृश रूप में दोनों को साथ रखता है। दूसरे अंशों के आधार पर यहाँ कृत्रिम भेद जोड़ने के बजाय पाठ का तनाव सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज रखी गई है। ‘तुम्हारे लिए ... होगा’ मूल संरचना के निकट है; ‘उस समय’ हिन्दी में अंतिम वाक्य का सम्बन्ध पर्व की अवधि से स्वाभाविक बनाने के लिए जोड़ा गया है।
