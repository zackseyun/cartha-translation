base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/045/009.yaml
  text: 'Thus says the Lord GOD: Enough from you[a], princes of Israel! Remove violence and plunder, and do justice and righteousness. Put away your evictions from my people, declares the Lord GOD.'
translation:
  language: hi
  text: 'प्रभु याहवे यों कहता है: इस्राएल के प्रधानों, अब बस करो! हिंसा और लूटपाट छोड़ दो, और न्याय और धार्मिकता करो। मेरे लोगों को बेदखल करना[a] बंद करो, प्रभु याहवे की यह घोषणा है।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मेरे लोगों को निकाल बाहर करना”; अथवा, “उनसे उनकी संपत्ति छीनना।” इब्रानी शब्द का मूल भाव किसी को बलपूर्वक हटा देना है; इस संदर्भ में इसमें भूमि या संपत्ति से बेदखली सम्मिलित हो सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  choice: प्रभु यहोवा
  rationale: उपाधि אֲדֹנָי को ‘प्रभु’ और परमेश्वर के विशिष्ट नाम יְהוָה को ‘यहोवा’ के रूप में रखा गया है; इससे संयुक्त इब्रानी अभिव्यक्ति स्वाभाविक हिंदी में बनी रहती है।
- source_word: רַב לָכֶם
  choice: अब बहुत हो चुका
  rationale: यह कड़ी फटकार का मुहावरा है। यह हिंदी अभिव्यक्ति ‘बस, बहुत हुआ’ का भाव देती है और शासकों के प्रति सीधे विरोध को सुरक्षित रखती है।
- source_word: נְשִׂיאֵי יִשְׂרָאֵל
  choice: इस्राएल के प्रधानों
  rationale: נָשִׂיא राजनीतिक-सामाजिक शासक या प्रमुख को दर्शाता है। ‘प्रधान’ राजवंशीय ‘राजकुमार’ की अपेक्षा संदर्भ में अधिक व्यापक और स्वाभाविक है।
- source_word: חָמָס וָשֹׁד
  choice: हिंसा और लूटपाट
  rationale: दोनों शब्द क्रमशः हिंसक अन्याय और बलपूर्वक संपत्ति हड़पने की अलग धारणाएँ व्यक्त करते हैं।
- source_word: הָסִירוּ
  choice: छोड़ दो
  rationale: आज्ञा का आशय इन दुष्कर्मों को समाप्त करना है; ‘छोड़ दो’ आधुनिक हिंदी में स्वाभाविक और सीधा है।
- source_word: מִשְׁפָּט וּצְדָקָה עֲשׂוּ
  choice: न्याय और धार्मिकता के काम करो
  rationale: मानक नैतिक युग्म के दोनों पद अलग रखे गए हैं। ‘के काम करो’ हिंदी में עֲשׂוּ की सक्रिय, व्यावहारिक माँग स्पष्ट करता है।
- source_word: הָרִימוּ גְרֻשֹׁתֵיכֶם מֵעַל עַמִּי
  choice: मेरे लोगों को उनकी भूमि से बेदखल करना बंद करो
  rationale: संदर्भ भूमि-वितरण और शासकीय शोषण का है, इसलिए ‘बेदखल करना’ उपयुक्त है। ‘उनकी भूमि से’ संदर्भगत अर्थ स्पष्ट करता है, जबकि व्यापक शाब्दिक संभावना पादटिप्पणी में सुरक्षित है।
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: प्रभु यहोवा की यह घोषणा है
  rationale: נְאֻם के औपचारिक भविष्यद्वाणी-सूत्र को गरिमापूर्ण और स्पष्ट हिंदी में व्यक्त किया गया है।
theological_decisions:
- issue: אֲדֹנָי יְהוִה में परमेश्वर के नाम का अनुवाद
  choice: प्रभु यहोवा
  alternative: प्रभु परमेश्वर
  rationale: יְהוָה को सामान्य उपाधि में विलीन करने के बजाय उसका विशिष्ट वाचा-नाम रखा गया है; אֲדֹנָי का अर्थ ‘प्रभु’ अलग से बना रहता है।
- issue: מִשְׁפָּט וּצְדָקָה का नैतिक युग्म
  choice: न्याय और धार्मिकता
  alternative: न्याय और सही काम
  rationale: इब्रानी के दोनों प्रमुख धार्मिक-नैतिक पदों को अलग और भारपूर्ण रखा गया है, बिना उन्हें एक ही आधुनिक अवधारणा में मिला देने के।
- issue: גְרֻשֹׁתֵיכֶם का संदर्भगत विस्तार
  choice: उनकी भूमि से बेदखल करना
  alternative: निकाल बाहर करना / संपत्ति से वंचित करना
  rationale: अध्याय में भूमि और शासकों के दुरुपयोग का संदर्भ बेदखली की ओर संकेत करता है, पर मूल शब्द व्यापक रूप से जबरन निकालने या अधिकार छीनने को भी दर्शा सकता है; यह अस्पष्टता पादटिप्पणी में दी गई है।
translation_notes:
  register: आधुनिक मानक हिंदी का सीधा, गरिमापूर्ण और भविष्यद्वाणी-संबंधी फटकार वाला लहजा रखा गया है। आज्ञाओं को सहज बोलचाल के निकट किंतु प्रकाशनयोग्य रूप में प्रस्तुत किया गया है।
