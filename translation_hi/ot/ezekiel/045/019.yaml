source:
  edition: WLC
  text: וְ/לָקַ֨ח הַ/כֹּהֵ֜ן מִ/דַּ֣ם הַ/חַטָּ֗את וְ/נָתַן֙ אֶל מְזוּזַ֣ת הַ/בַּ֔יִת וְ/אֶל אַרְבַּ֛ע פִּנּ֥וֹת הָ/עֲזָרָ֖ה לַ/מִּזְבֵּ֑חַ וְ/עַ֨ל מְזוּזַ֔ת שַׁ֖עַר הֶ/חָצֵ֥ר הַ/פְּנִימִֽית־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/045/019.yaml
  text: And the priest shall take some of the blood of the sin offering and put it on the doorposts of the temple[a], on the four corners of the altar ledge, and on the doorposts of the gate of the inner court.
translation:
  language: hi
  text: और याजक पापबलि[a] के लहू में से कुछ लेकर उसे मन्दिर की चौखट पर, वेदी के चबूतरे के चारों कोनों पर और भीतरी आँगन के फाटक की चौखट पर लगाए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “शुद्धिकरण-बलि।” इब्रानी शब्द बलिदानी प्रसंगों में पाप से संबद्ध बलि और शुद्धिकरण के लिए चढ़ाई जाने वाली बलि—दोनों का बोध करा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָקַח הַכֹּהֵן
  choice: और याजक ... लेकर
  rationale: वाव-युक्त पूर्ण क्रिया यहाँ विधि-संबंधी क्रम को व्यक्त करती है; हिन्दी में संयुक्त कृदन्त के साथ मुख्य आज्ञार्थक क्रिया स्वाभाविक है। एकवचन ‘याजक’ मूल के निश्चित एकवचन को बनाए रखता है।
- source_word: מִדַּם הַחַטָּאת
  choice: पापबलि के लहू में से कुछ
  rationale: מִן अंश ग्रहण करने का भाव देता है। חַטָּאת बलिदानी प्रसंग में बलि को दर्शाता है; ‘पापबलि’ प्रचलित और संक्षिप्त है, जबकि शुद्धिकरण-संबंधी अर्थ पादटिप्पणी में रखा गया है।
- source_word: וְנָתַן אֶל
  choice: उसे ... पर लगाए
  rationale: अनुष्ठानिक प्रसंग में נתן का अर्थ रक्त को किसी सतह पर रखना या लगाना है; ‘लगाए’ हिन्दी में क्रिया को स्पष्ट और स्वाभाविक बनाता है।
- source_word: מְזוּזַת הַבַּיִת
  choice: मन्दिर की चौखट
  rationale: מְזוּזָה प्रवेश-द्वार की बाजू की चौखट/खम्भे को सूचित करता है। הַבַּיִת इस दर्शन में मन्दिर-भवन है; एकवचन को बनाए रखते हुए ‘चौखट’ सहज हिन्दी है।
- source_word: אַרְבַּע פִּנּוֹת הָעֲזָרָה לַמִּזְבֵּחַ
  choice: वेदी के घेरे के चारों कोनों
  rationale: פִּנּוֹת का सीधा अर्थ ‘कोने’ है। दुर्लभ स्थापत्य पद עֲזָרָה को निश्चित रूप से ‘छज्जा’ कहने के बजाय ‘घेरा’ अनुवादित किया गया है, जिससे वेदी से जुड़ी परिधीय संरचना का भाव रहता है और अनावश्यक विशिष्टता नहीं आती।
- source_word: מְזוּזַת שַׁעַר הֶחָצֵר הַפְּנִימִית
  choice: भीतरी आँगन के फाटक की चौखट
  rationale: यह मन्दिर-परिसर के आन्तरिक प्रांगण के प्रवेश की चौखट है। ‘आँगन’ और ‘फाटक’ आधुनिक पाठक के लिए स्पष्ट स्थापत्य शब्द हैं।
theological_decisions:
- issue: बलिदानी प्रसंग में חַטָּאת का अनुवाद
  choice: पापबलि
  alternative: शुद्धिकरण-बलि
  rationale: शब्द पाप से संबद्ध बलि और शुद्धिकरण का कार्य—दोनों अर्थछायाएँ रख सकता है। मुख्य पाठ में परिचित ‘पापबलि’ रखा गया है और कार्यपरक विकल्प पादटिप्पणी में दिया गया है, ताकि अर्थगत तनाव बना रहे।
- issue: रक्त लगाने की क्रिया का उद्देश्य
  choice: केवल अनुष्ठानिक क्रिया का वर्णन
  alternative: इसे स्पष्ट रूप से प्रायश्चित्त या शुद्धीकरण घोषित करना
  rationale: पद स्वयं स्थानों पर रक्त लगाने का निर्देश देता है, पर इस वाक्य में उसके धर्मवैज्ञानिक परिणाम को स्पष्ट नहीं करता; इसलिए अनुवाद में अतिरिक्त व्याख्या नहीं जोड़ी गई।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, विधि-संबंधी शैली रखी गई है। ‘मन्दिर,’ ‘वेदी,’ ‘याजक’ और ‘पापबलि’ जैसे परिचित बाइबलीय शब्दों के साथ वाक्यरचना सामान्य पाठकों के लिए सहज रखी गई है।
