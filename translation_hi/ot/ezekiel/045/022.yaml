id: EZK.45.22
reference: Ezekiel 45:22
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/עָשָׂ֤ה הַ/נָּשִׂיא֙ בַּ/יּ֣וֹם הַ/ה֔וּא בַּעֲד֕/וֹ וּ/בְעַ֖ד כָּל עַ֣ם הָ/אָ֑רֶץ פַּ֖ר חַטָּֽאת־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/045/022.yaml
  text: On that day the prince shall provide[a], for himself and for all the people of the land, a bull as a sin offering.
translation:
  language: hi
  text: उस दिन प्रधान अपने लिए और देश के सब लोगों के लिए पापबलि[a] के रूप में एक बैल चढ़ाएगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘शुद्धिकरण-बलि।’ इब्रानी शब्द חַטָּאת उस बलि को सूचित कर सकता है जो पाप या अशुद्धता को दूर करती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשָׂה
  choice: चढ़ाएगा
  rationale: यद्यपि עשה का मूल अर्थ ‘करना/बनाना’ है, बलिदान-संबंधी प्रसंग में यह बलि तैयार करने या अर्पित करने का भाव देता है। हिन्दी में ‘चढ़ाएगा’ इस उपासना-संबंधी कार्य को स्वाभाविक रूप से व्यक्त करता है।
- source_word: הַנָּשִׂיא
  choice: प्रधान
  rationale: यहेजकेल के इस दर्शन में נָשִׂיא एक विशिष्ट नागरिक शासक-पद को सूचित करता है। ‘प्रधान’ उस पद को व्यक्त करता है और ‘राजकुमार’ से उत्पन्न होने वाले राजपुत्र के अनचाहे अर्थ से बचाता है।
- source_word: בַּיּוֹם הַהוּא
  choice: उस दिन
  rationale: यह समय-सूचक इब्रानी पद का सीधा, स्वाभाविक और स्पष्ट हिन्दी रूप है।
- source_word: בַּעֲדוֹ
  choice: अपने लिए
  rationale: בְּעַד यहाँ किसी के पक्ष में या उसकी ओर से किए गए बलिदानी कार्य को दर्शाता है; ‘अपने लिए’ संक्षिप्त और स्पष्ट है।
- source_word: וּבְעַד כָּל עַם הָאָרֶץ
  choice: और देश के सब लोगों के लिए
  rationale: यह पूरी जनसमुदाय की ओर से बलि चढ़ाए जाने का भाव रखता है। ‘देश के सब लोग’ यहाँ עַם הָאָרֶץ को किसी विशेष सामाजिक वर्ग तक सीमित नहीं करता।
- source_word: פַּר
  choice: एक बैल
  rationale: बलिदानी प्रयोग में פַּר का अर्थ बैल है; पद में उसकी कम आयु स्पष्ट रूप से नहीं कही गई है।
- source_word: חַטָּאת
  choice: पापबलि
  rationale: यहाँ बैल के साथ प्रयुक्त חַטָּאת अमूर्त ‘पाप’ नहीं, पाप या अशुद्धता से निपटने वाली बलि को दर्शाता है। ‘पापबलि’ परिचित और सटीक मुख्य रूप है, जबकि वैकल्पिक अर्थ को पादटिप्पणी में सुरक्षित रखा गया है।
theological_decisions:
- issue: बलिदानी प्रसंग में חַטָּאת का अनुवाद
  choice: पापबलि
  alternative: शुद्धिकरण-बलि
  rationale: यह शब्द पाप से संबंधित बलि और अशुद्धता दूर करने वाली बलि—दोनों पहलुओं को व्यक्त कर सकता है। मुख्य पाठ में परिचित ‘पापबलि’ रखा गया है, पर पादटिप्पणी वास्तविक शाब्दिक और धार्मिक व्यापकता को बनाए रखती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘प्रधान’ यहेजकेल के दर्शन में शासकीय पद को स्पष्ट करता है, और ‘चढ़ाएगा’ बलिदानी प्रसंग में स्वाभाविक हिन्दी प्रयोग है।
