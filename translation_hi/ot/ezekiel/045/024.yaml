  text: וּ/מִנְחָ֗ה אֵיפָ֥ה לַ/פָּ֛ר וְ/אֵיפָ֥ה לָ/אַ֖יִל יַֽעֲשֶׂ֑ה וְ/שֶׁ֖מֶן הִ֥ין לָ/אֵיפָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/045/024.yaml
  text: And as the grain offering[a], he shall provide an ephah for each bull and an ephah for each ram, and a hin of oil for each ephah.
translation:
  language: hi
  text: और अन्नबलि के रूप में वह हर बैल के लिए एक एपा और हर मेढ़े के लिए एक एपा तैयार करे[a], और हर एपा के लिए एक हिन तेल दे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “दे” अथवा “बनाए”; इब्रानी क्रिया का शाब्दिक अर्थ “करना/बनाना” है और बलिदान के संदर्भ में यह अपेक्षित भेंट तैयार करने या उपलब्ध कराने को भी दर्शा सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: מִנְחָה
  choice: अन्नबलि
  rationale: बलिदान-संबंधी इस प्रसंग में यह शब्द सामान्य भेंट नहीं, बल्कि अनाज से तैयार की जाने वाली बलि को दर्शाता है। ‘अन्नबलि’ प्रचलित, संक्षिप्त और स्पष्ट धार्मिक पद है।
- source_word: אֵיפָה
  choice: एपा
  rationale: यह सूखी वस्तुओं की प्राचीन माप है। तकनीकी माप को बनाए रखने और अनिश्चित आधुनिक अनुमान जोड़ने से बचने के लिए नाम का लिप्यंतरण किया गया है।
- source_word: לַפָּר
  choice: हर बैल के लिए
  rationale: विधान के संदर्भ में निश्चित पद का अर्थ वितरणात्मक है—निर्धारित मात्रा प्रत्येक बैल के साथ दी जानी है।
- source_word: לָאַיִל
  choice: हर मेढ़े के लिए
  rationale: यह भी बलिदान-विधान में वितरणात्मक अनुपात बताता है, इसलिए ‘हर मेढ़े के लिए’ स्वाभाविक और स्पष्ट है।
- source_word: יַעֲשֶׂה
  choice: तैयार करे
  rationale: मूल क्रिया का सामान्य अर्थ ‘करना/बनाना’ है, पर बलिदान-संबंधी संदर्भ में अपेक्षित सामग्री तैयार करने या उपलब्ध कराने का भाव हो सकता है। ‘तैयार करे’ मूल क्रिया के व्यापक अर्थ और विधिसूचक बल को बनाए रखता है।
- source_word: שֶׁמֶן
  choice: तेल
  rationale: मूल पाठ केवल ‘तेल’ कहता है। सांस्कृतिक रूप से जैतून का तेल संभावित है, पर ‘जैतून’ जोड़ना पाठ से अधिक विशिष्ट होगा।
- source_word: הִין
  choice: हिन
  rationale: यह तरल पदार्थों की प्राचीन माप है। स्रोत की तकनीकी शब्दावली और माप-संबंधी सटीकता बनाए रखने के लिए इसका लिप्यंतरण किया गया है।
- source_word: לָאֵיפָה
  choice: हर एपा के लिए
  rationale: यह तेल और अन्न की माप का अनुपात बताता है; ‘हर एपा के लिए’ वितरणात्मक अर्थ को स्पष्ट करता है।
