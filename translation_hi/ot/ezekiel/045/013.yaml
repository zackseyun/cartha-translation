  text: זֹ֥את הַ/תְּרוּמָ֖ה אֲשֶׁ֣ר תָּרִ֑ימוּ שִׁשִּׁ֤ית הָֽ/אֵיפָה֙ מֵ/חֹ֣מֶר הַֽ/חִטִּ֔ים וְ/שִׁשִּׁיתֶם֙ הָֽ/אֵיפָ֔ה מֵ/חֹ֖מֶר הַ/שְּׂעֹרִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/045/013.yaml
  text: 'This is the contribution that you shall offer: one-sixth of an ephah from each homer of wheat[a], and one-sixth of an ephah from each homer of barley.'
translation:
  language: hi
  text: '“जो अंश तुम अर्पित करोगे, वह यह है: प्रत्येक होमेर गेहूँ में से एपा का छठा भाग, और प्रत्येक होमेर जौ में से एपा का छठा भाग।”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תְּרוּמָה
  choice: अर्पित अंश
  rationale: यह शब्द यहाँ नापकर अलग किए और प्रस्तुत किए जाने वाले अंश को दर्शाता है। ‘अर्पित अंश’ प्रशासनिक और उपासना-संबंधी दोनों पहलुओं को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: תָּרִימוּ
  choice: तुम अर्पित करोगे
  rationale: रूम के हिफ़ील रूप का तेरूमा के साथ प्रयोग किसी अंश को उठाकर प्रस्तुत करने के अर्थ में मुहावरेदार है; ‘अर्पित करोगे’ उसी भाव को बिना शाब्दिक अस्वाभाविकता के व्यक्त करता है।
- source_word: שִׁשִּׁית
  choice: छठा भाग
  rationale: माप के इस विधान में स्पष्ट रूप से एक-छठाई मात्रा अभिप्रेत है; ‘छठा भाग’ सहज और सटीक हिन्दी है।
- source_word: אֵיפָה
  choice: एपा
  rationale: यह प्राचीन सूखी वस्तुओं की क्षमता का विशिष्ट माप है; लिप्यंतरण तकनीकी इकाई को सुरक्षित रखता है।
- source_word: חֹמֶר
  choice: होमेर
  rationale: यह क्षमता की प्राचीन तकनीकी इकाई है; मूल इब्रानी शब्द का लिप्यंतरण उसकी विशिष्टता बनाए रखता है।
- source_word: מֵחֹמֶר
  choice: हर होमेर में से
  rationale: מִן निर्धारित इकाई में से लिया जाने वाला अंश बताता है। विधान का वितरणात्मक भाव हिन्दी में ‘हर ... में से’ द्वारा स्पष्ट और स्वाभाविक होता है।
- source_word: הַחִטִּים
  choice: गेहूँ
  rationale: अनाज के नाम के रूप में हिन्दी में लेख की आवश्यकता नहीं होती।
- source_word: וְשִׁשִּׁיתֶם
  choice: और ... छठा भाग
  rationale: रूप असामान्य है, पर प्रसंग में यह पहले अंश के समानांतर जौ की निर्धारित मात्रा बताता है; सरल समानांतर अभिव्यक्ति अर्थ को सुरक्षित रखती है।
- source_word: הַשְּׂעֹרִים
  choice: जौ
  rationale: यह अनाज का सामान्य आधुनिक हिन्दी नाम है और माप-विधान में स्वाभाविक है।
