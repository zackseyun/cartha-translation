  text: All the people of the land shall give this contribution to the prince in Israel[a][b].
translation:
  language: hi
  text: देश के सब लोग इस अंशदान को इस्राएल के प्रधान को देंगे[a][b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक शाब्दिक रूप से: “देश के सब लोग इस अंशदान के लिए इस्राएल में प्रधान के लिए होंगे।” इब्रानी मुहावरे का सम्भावित अर्थ है कि लोग यह निर्धारित अंशदान प्रधान के लिए उपलब्ध कराएँगे।'
    reason: lexical_alternative
  - marker: b
    text: “अंशदान” के लिए इब्रानी शब्द तेरूमा है, जिसका अर्थ अलग रखा गया अंश या भेंट हो सकता है। प्रसंग के अनुसार “भेंट” या “कर” भी सम्भव अनुवाद हैं। इब्रानी में अंतिम वाक्यांश अधिक शाब्दिक रूप से “इस्राएल में प्रधान के लिए” है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּל הָעָם הָאָרֶץ
  choice: देश के सब लोग
  rationale: यह पदबंध देश की पूरी जनसंख्या को दर्शाता है। ‘देश के सब लोग’ आधुनिक हिन्दी में स्वाभाविक है और इब्रानी अभिव्यक्ति के भौगोलिक तथा सामुदायिक दोनों पक्षों को बनाए रखता है।
- source_word: יִהְיוּ אֶל
  choice: देंगे
  rationale: शाब्दिक अर्थ ‘की ओर/के लिए होंगे’ है, पर इस निर्धारित अंशदान के प्रसंग में मुहावरे का आशय उसे उपलब्ध कराना है। ‘देंगे’ अपेक्षित क्रिया को स्पष्ट करता है, जबकि शाब्दिक विकल्प हिन्दी में अस्वाभाविक होगा।
- source_word: הַתְּרוּמָה הַזֹּאת
  choice: इस अंशदान को
  rationale: תְּרוּמָה अलग रखे गए अंश या भेंट को दर्शाता है। यहाँ राजकीय और उपासना-संबंधी दोनों पहलू हैं; ‘अंशदान’ किसी एक पहलू को अनावश्यक रूप से प्रधान किए बिना निर्धारित योगदान का अर्थ देता है। הַזֹּאת का अनुवाद ‘इस’ है और यह पिछले पदों में बताए अंशदान की ओर संकेत करता है।
- source_word: לַנָּשִׂיא
  choice: प्रधान को
  rationale: यहेजकेल में נָשִׂיא नागरिक शासक के लिए प्रयुक्त विशिष्ट पद है, आवश्यक रूप से राजा के लिए नहीं। ‘प्रधान’ इस पद को ‘राजा’ बनाए बिना सम्मानित शासकीय भूमिका व्यक्त करता है; ל को यहाँ प्राप्तकर्ता के अर्थ में ‘को’ कहा गया है।
- source_word: בְּיִשְׂרָאֵל
  choice: इस्राएल के
  rationale: इब्रानी में शाब्दिक रूप से ‘इस्राएल में’ है। हिन्दी में ‘इस्राएल के प्रधान’ अधिक स्वाभाविक रूप से उसके अधिकार-क्षेत्र/संबंध को व्यक्त करता है; अधिक शाब्दिक रूप पादटिप्पणी में सुरक्षित है।
theological_decisions:
- issue: अंशदान का धार्मिक या नागरिक स्वरूप
  choice: अंशदान
  alternative: भेंट; कर
  rationale: आसपास का प्रसंग प्रधान की उपासना-संबंधी जिम्मेदारियों और लोगों से लिए जाने वाले निर्धारित अंश—दोनों को जोड़ता है। इसलिए ऐसा शब्द चुना गया है जो इसे केवल स्वैच्छिक धार्मिक भेंट या केवल नागरिक कर न ठहराए।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। कानूनी-उपासना संबंधी प्रसंग को ध्यान में रखते हुए ‘अंशदान’ चुना गया है। ‘प्रधान’ यहेजकेल में प्रयुक्त शासकीय पद की निरंतरता बनाए रखता है और ‘राजा’ की अपेक्षा कम व्याख्यात्मक है।
