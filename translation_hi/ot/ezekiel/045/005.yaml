  register: आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट शैली रखी गई है। ‘लेवी’, ‘भवन’ और ‘कोठरियाँ’ जैसे बाइबलीय-सांस्कृतिक शब्द संदर्भ के अनुरूप हैं; कठिन इब्रानी वाक्य-संबंध को निर्णायक रूप से हल करने के बजाय पादटिप्पणी में सुरक्षित रखा गया है।
