    text: अंतिम इब्रानी पदबंध का वाक्य-संबंध कठिन है। इसका अर्थ संभवतः यह भी हो सकता है कि बीस कोठरियाँ उनकी संपत्ति हों।
    reason: alternative_reading
lexical_decisions:
- source_word: וַחֲמִשָּׁה וְעֶשְׂרִים אֶלֶף אֹרֶךְ וַעֲשֶׂרֶת אֲלָפִים רֹחַב
  choice: पच्चीस हज़ार लंबा और दस हज़ार चौड़ा भूभाग
  rationale: संख्याओं और दोनों आयामों को आधुनिक स्वाभाविक हिन्दी में व्यक्त किया गया है। संदर्भ भूमि के हिस्से का है, इसलिए स्पष्टता के लिए ‘भूभाग’ जोड़ा गया है; माप की इकाई इब्रानी में यहाँ दोहराई नहीं गई है।
- source_word: יהיה לַלְוִיִּם
  choice: लेवियों के लिए होगा
  rationale: अपूर्ण क्रिया और ל उपसर्ग इस दर्शनीय व्यवस्था में भूभाग के नियत किए जाने को बताते हैं; भविष्यकालीन ‘होगा’ इसे स्वाभाविक ढंग से व्यक्त करता है।
- source_word: מְשָׁרְתֵי הַבַּיִת
  choice: जो भवन में सेवा करते हैं
  rationale: सहभागी रूप को साधारण और गरिमापूर्ण हिन्दी में क्रियात्मक उपवाक्य बनाया गया है। ‘भवन’ इब्रानी ‘घर’ के रूपक को बनाए रखता है, जबकि पादटिप्पणी उसका मंदिर-संदर्भ स्पष्ट करती है।
- source_word: לָהֶם לַאֲחֻזָּה
  choice: यह उनके अधिकार की भूमि होगी
  rationale: אֲחֻזָּה स्थायी भू-अधिकार या संपत्ति को दर्शाता है। ‘अधिकार की भूमि’ संदर्भ में ‘सम्पत्ति’ से अधिक ठोस और सहज है।
- source_word: עֶשְׂרִים לְשָׁכֹת
  choice: जिसमें बीस कोठरियाँ होंगी
  rationale: לְשָׁכֹת मंदिर-परिसर की कोठरियों या कमरों के लिए प्रयुक्त होता है। इब्रानी वाक्य-संबंध संक्षिप्त और कठिन है; मुख्य पाठ में इसे भूभाग की अतिरिक्त विशेषता के रूप में पढ़ा गया है और अनिश्चितता पादटिप्पणी में रखी गई है।
