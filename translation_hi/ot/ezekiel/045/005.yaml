  text: And an area twenty-five thousand long and ten thousand wide shall be for the Levites[a], the ministers of the house, for their possession[b], with twenty chambers.
translation:
  language: hi
  text: और पच्चीस हज़ार लंबा और दस हज़ार चौड़ा भूभाग उन लेवियों के लिए होगा जो मंदिर में सेवा करते हैं—उनकी संपत्ति के रूप में, बीस कोठरियों सहित।[a]
  philosophy: optimal-equivalence
