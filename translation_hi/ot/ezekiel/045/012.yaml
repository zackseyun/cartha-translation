  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। प्राचीन इकाइयों को परिवर्तित न करके देवनागरी में लिप्यंतरित किया गया है। ‘मिलकर’ मूल में निहित संख्यात्मक योग को स्वाभाविक हिंदी में स्पष्ट करता है, जबकि सूची की असामान्य संरचना और कुल साठ शेकेल का अर्थ सुरक्षित रहता है।
