base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/045/012.yaml
  text: And the shekel shall be twenty gerahs[a]; twenty shekels, twenty-five shekels[b], and fifteen shekels shall be your mina.
translation:
  language: hi
  text: और शेकेल बीस गेरा का होगा; तुम्हारा माने बीस शेकेल, पच्चीस शेकेल और पंद्रह शेकेल होगा[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी पाठ में एक माने के लिए ‘बीस शेकेल, पच्चीस शेकेल और पंद्रह शेकेल’ दिए गए हैं—अर्थात कुल साठ शेकेल। यह माने की कुछ अन्य प्राचीन गणनाओं से भिन्न है और संभवतः यहेजकेल की मंदिर-व्यवस्था में निर्धारित एक विशेष मानक को दर्शाता है।
    reason: cultural_note
lexical_decisions:
- source_word: הַשֶּׁקֶל
  choice: शेकेल
  rationale: प्राचीन भार और मुद्रा की मानक इकाई को आधुनिक इकाई में अनुमानतः बदलने के बजाय प्रचलित लिप्यंतरण में रखा गया है।
- source_word: גֵּרָה
  choice: गेरा
  rationale: शेकेल की छोटी उप-इकाई के लिए मूल प्राचीन माप-पद्धति को सुरक्षित रखने वाला लिप्यंतरण अपनाया गया है।
- source_word: עֶשְׂרִים
  choice: बीस
  rationale: सीधी संख्या; पहले गेरा और बाद में शेकेल के साथ प्रयुक्त है।
- source_word: שְׁקָלִים / שֶׁקֶל
  choice: शेकेल
  rationale: भार अथवा मुद्रा की इकाई के रूप में पूरे पद में एकरूप रखा गया है; हिंदी में संख्या के बाद रूप अपरिवर्तित रखा गया है।
- source_word: חֲמִשָּׁה וְעֶשְׂרִים
  choice: पच्चीस
  rationale: मूल के ‘पाँच और बीस’ को स्वाभाविक आधुनिक हिंदी संख्या-रूप में व्यक्त किया गया है।
- source_word: עֲשָׂרָה וַחֲמִשָּׁה
  choice: पंद्रह
  rationale: मूल के ‘दस और पाँच’ को स्वाभाविक आधुनिक हिंदी संख्या-रूप में व्यक्त किया गया है।
- source_word: הַמָּנֶה
  choice: माने
  rationale: बड़ी प्राचीन भार अथवा मुद्रा इकाई के लिए इब्रानी शब्द का निकट लिप्यंतरण चुना गया है, ताकि इसे आधुनिक ‘माना’ जैसे सामान्य हिंदी शब्द से न मिलाया जाए।
- source_word: יִהְיֶה לָכֶם
  choice: तुम्हारा ... होगा
  rationale: संबोधित समुदाय के लिए निर्धारित मानक होने का विधिक और निर्देशात्मक भाव बनाए रखता है।
