base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/045/007.yaml
  text: And for the prince there shall be land on both sides of the holy district and the property of the city[a], adjoining the holy district and adjoining the property of the city, from the west side westward and from the east side eastward; and in length corresponding to one of the tribal portions[b], from the western border to the eastern border.
translation:
  language: hi
  text: और शासक के लिए पवित्र अलग किए हुए भूभाग[a] और नगर की संपत्ति के दोनों ओर भूमि होगी—पवित्र अलग किए हुए भूभाग के सामने और नगर की संपत्ति के सामने। वह पश्चिमी ओर से पश्चिम की ओर और पूर्वी ओर से पूर्व की ओर फैली होगी; उसकी लंबाई किसी एक गोत्र के भाग के अनुरूप, पश्चिमी सीमा से पूर्वी सीमा तक होगी।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से ‘पवित्र अर्पण’ या ‘पवित्र चढ़ावा’; यहाँ इसका आशय परमेश्वर के लिए अलग किए गए भूभाग से है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में पश्चिम के लिए शब्दशः ‘समुद्र की ओर’ आया है; इस भू-सीमा-वर्णन में समुद्र पश्चिम दिशा को सूचित करता है।
    reason: cultural_note
lexical_decisions:
- source_word: לַנָּשִׂיא
  choice: प्रधान के लिए
  rationale: यहेजकेल में נָשִׂיא प्रायः नागरिक शासक को दर्शाता है। ‘प्रधान’ आधुनिक हिन्दी में उसके नेतृत्व और शासन-संबंधी पद को व्यक्त करता है, बिना अनावश्यक रूप से वंशानुगत राजपद मान लिए।
- source_word: מִזֶּה וּמִזֶּה
  choice: दोनों ओर
  rationale: यह इब्रानी मुहावरा ‘इस ओर और उस ओर’ के अर्थ में है; भू-विभाजन के संदर्भ में ‘दोनों ओर’ स्वाभाविक और स्पष्ट है।
- source_word: תְּרוּמַת הַקֹּדֶשׁ
  choice: पवित्र अर्पित भूभाग
  rationale: यहाँ תְּרוּמָה धन या भेंट की वस्तु नहीं, बल्कि अलग करके अर्पित किया गया भूभाग है। यह अनुवाद ‘अर्पण’ और भूमि—दोनों भावों को बनाए रखता है।
- source_word: אֲחֻזַּת הָעִיר
  choice: नगर की संपत्ति
  rationale: אֲחֻזָּה स्थायी अधिकार में दी गई भूमि या संपत्ति को दर्शाता है; ‘नगर की संपत्ति’ भूमि-विभाजन के संदर्भ में स्पष्ट है।
- source_word: אֶל־פְּנֵי ... וְאֶל־פְּנֵי
  choice: से लगी हुई
  rationale: सीमा-वर्णन में यह वाक्यांश सामने स्थित अथवा साथ लगी भूमि का संकेत देता है। यहाँ भूखंडों की निकटता के कारण ‘से लगी हुई’ सर्वाधिक स्वाभाविक है।
- source_word: מִפְּאַת יָם יָמָּה ... וּמִפְּאַת קֵדְמָה קָדִימָה
  choice: पश्चिमी ओर से पश्चिम की दिशा में और पूर्वी ओर से पूर्व की दिशा में
  rationale: यह चयन इब्रानी की समांतर और दोहरावयुक्त सीमा-भाषा को पठनीय हिन्दी में सुरक्षित रखता है।
- source_word: לְעֻמּוֹת אַחַד הַחֲלָקִים
  choice: गोत्रों के किसी एक भाग के अनुरूप
  rationale: לְעֻמּוֹת समानांतरता या अनुरूपता दर्शाता है, आवश्यक रूप से ठीक बराबर माप नहीं। प्रसंग के आधार पर ‘गोत्रों’ जोड़ा गया है ताकि ‘भाग’ का संदर्भ स्पष्ट हो।
- source_word: מִגְּבוּל יָם אֶל־גְּבוּל קָדִימָה
  choice: पश्चिमी सीमा से पूर्वी सीमा तक
  rationale: यह दिशा-सूचक सीमा-वाक्यांश का सीधा और स्वाभाविक हिन्दी रूप है।
