  text: לָ/אֵ֤שׁ תִּֽהְיֶה֙ לְ/אָכְלָ֔ה דָּמֵ֥/ךְ יִהְיֶ֖ה בְּ/ת֣וֹךְ הָ/אָ֑רֶץ לֹ֣א תִזָּכֵ֔רִי כִּ֛י אֲנִ֥י יְהוָ֖ה דִּבַּֽרְתִּי׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/021/037.yaml
  text: You will be fuel for the fire; your blood will be in the midst of the land. You will not be remembered[a], for I, Yahweh, have spoken.
translation:
  language: hi
  text: तुम आग के लिए ईंधन बनोगी; तुम्हारा खून[a] देश के बीच में होगा। तुम्हें याद नहीं किया जाएगा, क्योंकि मैं, याहवे, ने कहा है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तुम्हारा रक्त-दोष देश के बीच में होगा।” इब्रानी में शाब्दिक रूप से “तुम्हारा खून” है, जो इस प्रसंग में रक्तपात या रक्त-दोष का संकेत कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: לָאֵשׁ ... לְאָכְלָה
  choice: आग का आहार
  rationale: शाब्दिक भाव ‘आग के लिए खाने की वस्तु’ है। ‘आग का आहार’ विनाश की छवि बनाए रखते हुए स्वाभाविक और गरिमापूर्ण हिन्दी है।
- source_word: תִּהְיֶה
  choice: तुम ... बनोगी
  rationale: क्रिया स्त्रीलिंग एकवचन संबोधन को दिखाती है; इसलिए ‘बनोगी’ रखा गया है।
- source_word: דָּמֵךְ
  choice: तुम्हारा खून
  rationale: मूल शब्द का सीधा अर्थ ‘तुम्हारा खून’ है। प्रसंग में रक्तपात या रक्त-दोष का संकेत हो सकता है, पर उसे मुख्य पाठ में स्पष्ट करके अर्थ को अनावश्यक रूप से सीमित नहीं किया गया।
- source_word: בְּתוֹךְ הָאָרֶץ
  choice: देश के बीचों-बीच
  rationale: यह בְּתוֹךְ की स्थानगत प्रबलता और सार्वजनिक रूप से पड़े रहने की न्याय-छवि को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: לֹא תִזָּכֵרִי
  choice: तुम्हें फिर याद नहीं किया जाएगा
  rationale: निफ़अल रूप निष्क्रिय अर्थ देता है। ‘फिर’ हिन्दी में भावी विस्मृति का प्रसंगानुकूल संकेत देता है, बिना मूल आशय बदले।
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत वाचा-नाम को उपाधि से बदलने के बजाय देवनागरी में लिप्यंतरित किया गया है।
- source_word: דִּבַּרְתִּי
  choice: मैंने यह कहा है
  rationale: पूर्ण क्रिया और भविष्यवाणी-संबंधी घोषणा की निर्णायकता को सहज आधुनिक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: דָּמֵךְ में निहित रक्त-दोष को स्पष्ट करना
  choice: मुख्य पाठ में ‘तुम्हारा खून’
  alternative: ‘तुम्हारा रक्त-दोष’ या ‘तुम्हारे किए रक्तपात का दोष’
  rationale: इब्रानी पाठ सीधे ‘तुम्हारा खून’ कहता है। रक्त-दोष की संभावना पाद-टिप्पणी में रखकर मूल की अर्थगत व्यापकता और न्याय-संबंधी तनाव सुरक्षित रखा गया है।
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा या ‘प्रभु’
  rationale: मूल पाठ में व्यक्तिगत ईश्वरीय नाम है; उसका लिप्यंतरण करना किसी उपाधि द्वारा उसके स्थानापन्न किए जाने से अधिक स्रोत-संगत है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गंभीर और भविष्यवाणी-संबंधी न्याय के अनुकूल शैली रखी गई है। स्त्रीलिंग एकवचन संबोधन सुरक्षित है। ‘खून’ सामान्य पाठक के लिए ‘रक्त’ से अधिक स्वाभाविक है, जबकि ‘आग का आहार’ मूल रूपक की गरिमा बनाए रखता है।
