base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/021/033.yaml
  text: 'And you[a], son of man, prophesy and say, ‘Thus says the Lord GOD concerning the sons of Ammon and concerning their reproach’: And you shall say, ‘A sword, a sword, drawn for slaughter, polished for devouring[c][b], so that it flashes like lightning.’'
translation:
  language: hi
  text: '“और हे मनुष्य के पुत्र, भविष्यवाणी करके कहो, ‘प्रभु यहोवा अम्मोनियों[a] और उनके अपमान[b] के विषय में यह कहता है: तलवार, तलवार! वध के लिए म्यान से निकाली गई, निगल जाने के लिए चमकाई गई, ताकि वह बिजली-सी चमके।’[c]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “अम्मोन के पुत्रों।”
    reason: lexical_alternative
  - marker: b
    text: या “उनके ताने,” “उनकी निंदा,” अथवा “उनकी भर्त्सना।”
    reason: lexical_alternative
  - marker: c
    text: 'अंतिम पंक्तियों का अनुवाद इस प्रकार भी हो सकता है: “वध के लिए म्यान से निकाली गई, भस्म करने के लिए माँजी गई, बिजली-सी चमकने के लिए।” इब्रानी वाक्यांश संक्षिप्त है और לְהָכִיל का अर्थ कठिन है।'
    reason: textual_or_syntactic_ambiguity
lexical_decisions:
- source_word: בֶן אָדָם
  choice: मनुष्य के पुत्र
  rationale: यहेजकेल को दिए जाने वाले परमेश्वर के आवर्ती संबोधन की शाब्दिक छवि और साहित्यिक संगति बनाए रखता है।
- source_word: אֲדֹנָי יְהוִה
  choice: प्रभु यहोवा
  rationale: दोनों इब्रानी पदों को बनाए रखते हुए परमेश्वर के निज नाम יהוה को प्रचलित हिन्दी रूप ‘यहोवा’ में व्यक्त करता है।
- source_word: בְּנֵי עַמּוֹן
  choice: अम्मोनी
  rationale: शाब्दिक ‘अम्मोन के पुत्र’ का स्वाभाविक आधुनिक हिन्दी जातिनाम है; शाब्दिक रूप पादटिप्पणी में दिया गया है।
- source_word: חֶרְפָּתָם
  choice: उनके ताने
  rationale: संदर्भ में חֶרְפָּה अपमानजनक उपहास या निंदा को सूचित करता है; ‘ताना’ वर्तमान हिन्दी में स्पष्ट है, जबकि वैकल्पिक अर्थ पादटिप्पणी में सुरक्षित हैं।
- source_word: חֶרֶב חֶרֶב
  choice: तलवार, तलवार!
  rationale: मूल की जोरदार पुनरुक्ति को बिना समतल किए बनाए रखता है।
- source_word: פְּתוּחָה לְטֶבַח
  choice: वध के लिए खींची गई
  rationale: तलवार के प्रसंग में פְּתוּחָה का आशय म्यान से निकाली गई तलवार है; ‘खींची गई’ स्वाभाविक और संक्षिप्त है।
- source_word: מְרוּטָה לְהָכִיל
  choice: निगल जाने के लिए चमकाई गई
  rationale: מְרוּטָה तलवार को चमकाने/माँजने और कठिन לְהָכִיל यहाँ विनाशकारी भक्षण को सूचित करता है; रूपक की तीव्रता बची रहती है।
- source_word: לְמַעַן בָּרָק
  choice: ताकि वह बिजली-सी चमके
  rationale: संक्षिप्त इब्रानी वाक्यांश में निहित बिजली-जैसी चमक को स्पष्ट, स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: יהוה परमेश्वर के निज नाम का अनुवाद
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: निज नाम को केवल उपाधि में बदलने के बजाय हिन्दी पाठकों में परिचित नामरूप से सुरक्षित रखा गया है; אֲדֹנָי को अलग से ‘प्रभु’ कहा गया है।
- issue: לְהָכִיל का कठिन अर्थ
  choice: निगल जाने के लिए
  alternative: भस्म करने के लिए; समाने के लिए
  rationale: वध के लिए निकाली तलवार के प्रसंग में विनाशकारी भक्षण सर्वाधिक संगत है, पर पाठ की कठिनता और वैकल्पिक संरचना पादटिप्पणी में बताई गई है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। परमेश्वर के संबोधन में ‘तुम’ प्रयोग किया गया है, ताकि अत्यधिक पुरातन ‘तू’ से बचते हुए एकवचन आदेश का भाव बना रहे। तलवार की पुनरुक्ति और कठोर विनाशकारी बिंब यथावत रखे गए हैं।
