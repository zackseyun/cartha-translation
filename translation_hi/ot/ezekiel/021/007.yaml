- source_word: יְרוּשָׁלִַם
  choice: यरूशलेम
  rationale: स्थान-नाम का मानक हिन्दी रूप।
- source_word: וְהַטֵּף
  choice: संदेश सुना
  rationale: נטף का शाब्दिक अर्थ ‘टपकाना’ है, पर भविष्यसूचक प्रयोग में यह वाणी सुनाने को व्यक्त करता है। ‘संदेश सुना’ आधुनिक हिन्दी में अर्थ स्पष्ट करता है; शाब्दिक बिंब पादटिप्पणी में दिया गया है।
- source_word: מִקְדָּשִׁים
  choice: पवित्र स्थानों
  rationale: इब्रानी बहुवचन को बनाए रखता है और ‘मंदिरों’ की अपेक्षा पवित्र परिसरों या स्थलों के व्यापक अर्थ को सुरक्षित रखता है।
- source_word: וְהִנָּבֵא
  choice: भविष्यवाणी कर
  rationale: नבא के आज्ञार्थक रूप का मानक और स्वाभाविक हिन्दी अनुवाद।
- source_word: אַדְמַת יִשְׂרָאֵל
  choice: इस्राएल की भूमि
  rationale: यहाँ אֲדָמָה का राष्ट्रीय-भौगोलिक अर्थ ‘भूमि’ सर्वाधिक उपयुक्त है।
theological_decisions:
- issue: न्याय-संदेश में וְהַטֵּף का भविष्यसूचक मुहावरा
  choice: मुख्य पाठ में ‘संदेश सुना’ और दिशा/विरोध को ‘के विरुद्ध’ से व्यक्त किया गया
  alternative: ‘[अपने वचन] पवित्र स्थानों की ओर टपका’ या ‘पवित्र स्थानों की ओर बोल’
  rationale: शाब्दिक ‘टपकाना’ आधुनिक पाठक के लिए भविष्यसूचक वाणी का आशय धुँधला कर सकता है। न्याय के प्रसंग में वाणी का प्रतिकूल लक्ष्य स्पष्ट है, जबकि मूल रूपक पादटिप्पणी में सुरक्षित है।
- issue: מִקְדָּשִׁים का बहुवचन
  choice: ‘पवित्र स्थानों’ के रूप में बहुवचन सुरक्षित रखा
  alternative: एकवचन ‘पवित्रस्थान’ या विशिष्ट ‘मंदिर’
  rationale: मूल पाठ का वास्तविक बहुवचन बिना किसी विशेष धार्मिक-संरचनात्मक व्याख्या को थोपे बनाए रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सीधा भविष्यसूचक आदेश। ‘तू’ को अलग से जोड़ने के बजाय आज्ञार्थक क्रियाओं से एकवचन संबोधन स्वाभाविक रखा गया है। ‘मनुष्य के पुत्र’ स्थापित इब्रानी बिंब को सुरक्षित रखता है।
