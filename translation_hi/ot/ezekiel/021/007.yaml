base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/021/007.yaml
  text: Son of man[a], set your face toward Jerusalem, and preach toward the sanctuaries, and prophesy against the land of Israel.
translation:
  language: hi
  text: हे मनुष्य के पुत्र, अपना मुख यरूशलेम की ओर कर, पवित्र स्थानों की ओर वचन सुना,[a] और इस्राएल की भूमि के विरुद्ध भविष्यवाणी कर।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक अर्थ है, “पवित्र स्थानों की ओर [अपने वचन] टपका।” यह भविष्यसूचक वाणी बोलने का मुहावरा है।
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן אָדָם
  choice: हे मनुष्य के पुत्र
  rationale: यहेजकेल को संबोधित करने वाला स्थायी इब्रानी संबोधन है। यह मूल मुहावरे को सुरक्षित रखता है; यहाँ यह मसीहाई उपाधि नहीं, नबी के लिए संबोधन है।
- source_word: שִׂים פָּנֶיךָ אֶל
