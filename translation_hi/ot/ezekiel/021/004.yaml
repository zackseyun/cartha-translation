  yaml_path: translation/ot/ezekiel/021/004.yaml
  text: And all flesh will see that I[a], Yahweh, have kindled it; it will not be quenched.
translation:
  language: hi
  text: और सभी लोग[a] देखेंगे कि मैं ही याहवे हूँ; मैंने उसे प्रज्वलित किया है, और वह नहीं बुझेगी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “सारा मांस”; यहाँ अर्थ है, “सभी मनुष्य।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרָאוּ
  choice: और … देखेंगे
  rationale: भविष्यसूचक संदर्भ में यह रूप भावी घटना व्यक्त करता है। ‘देखेंगे’ ראה के ठोस अर्थ को बनाए रखता है और इस संदर्भ में पहचान लेने का भाव भी दे सकता है।
- source_word: כָּל בָּשָׂר
  choice: सभी लोग[a]
  rationale: शाब्दिक इब्रानी मुहावरा ‘सारा मांस’ है, पर यहाँ उसका आशय समस्त मनुष्यों से है। सहज आधुनिक हिन्दी के लिए ‘सभी लोग’ रखा गया और शाब्दिक रूप पादटिप्पणी में दिया गया।
- source_word: כִּי
  choice: कि
  rationale: यह आगे आने वाली बात को उस विषय के रूप में प्रस्तुत करता है जिसे सभी लोग देखेंगे।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी के विशिष्ट परमेश्वर-नाम YHWH को उपाधि में बदलने के बजाय हिन्दी में लिप्यंतरित किया गया है।
- source_word: בִּעַרְתִּיהָ
  choice: मैंने … उसे सुलगाया है
  rationale: בער आग जलाने या सुलगाने का भाव देता है। स्त्रीलिंग कर्म-प्रत्यय को ‘उसे’ से रखा गया है, जिसका संदर्भ प्रसंग की आग से है; अनुवाद आग को यहाँ दोहराकर अस्पष्टता को कृत्रिम रूप से नहीं मिटाता।
- source_word: לֹא תִּכְבֶּה
  choice: वह बुझेगी नहीं
  rationale: क्रिया आग के न बुझने को व्यक्त करती है। ‘बुझेगी नहीं’ आधुनिक हिन्दी में स्वाभाविक है और स्त्रीलिंग संदर्भ को बनाए रखता है।
theological_decisions:
- issue: परमेश्वर के नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा / प्रभु
  rationale: मूल पाठ में परमेश्वर का विशिष्ट नाम सीधे आया है। ‘याहवे’ उसे नाम के रूप में सुरक्षित रखता है, न कि सामान्य उपाधि के रूप में।
- issue: आग लगाने वाले कर्ता पर बल
  choice: मैंने, याहवे ने
  alternative: याहवे ने
  rationale: मूल में אֲנִי और יְהוָה दोनों उपस्थित हैं। हिन्दी में यह संरचना परमेश्वर के स्वयं इस न्याय को आरम्भ करने पर दिए गए बल को बनाए रखती है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। भविष्यसूचक वाक्य का संक्षिप्त बल और आग के स्त्रीलिंग संदर्भ को सुरक्षित रखा गया है।
