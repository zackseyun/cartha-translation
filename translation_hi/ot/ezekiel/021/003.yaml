  text: וְ/אָֽמַרְתָּ֙ לְ/יַ֣עַר הַ/נֶּ֔גֶב שְׁמַ֖ע דְּבַר יְהוָ֑ה כֹּֽה אָמַ֣ר אֲדֹנָ֣/י יְהוִ֡ה הִנְ/נִ֣י מַֽצִּית בְּ/ךָ֣ אֵ֡שׁ וְ/אָכְלָ֣ה בְ/ךָ֣ כָל עֵֽץ לַח֩ וְ/כָל עֵ֨ץ יָבֵ֤שׁ לֹֽא תִכְבֶּה֙ לַהֶ֣בֶת שַׁלְהֶ֔בֶת וְ/נִצְרְבוּ בָ֥/הּ כָּל פָּנִ֖ים מִ/נֶּ֥גֶב צָפֽוֹנָ/ה־־־׀־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/021/003.yaml
  text: 'And say to the forest of the Negev[a], ‘Hear the word of Yahweh. Thus says the Lord GOD: Behold, I am kindling a fire in you, and it will consume in you every green tree and every dry tree. The blazing flame will not be quenched[b], and by it every face from south to north will be scorched.’'
translation:
  language: hi
  text: 'और नेगेव के वन[a] से कह, ‘याहवे का वचन सुन! प्रभु याहवे यों कहते हैं: देख, मैं तुझमें आग लगा रहा हूँ। वह तुझमें हर हरे पेड़ और हर सूखे पेड़ को भस्म कर देगी। धधकती ज्वाला बुझाई नहीं जाएगी, और उससे दक्षिण से उत्तर तक हर चेहरा झुलस जाएगा।’'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “दक्षिणी प्रदेश के वन।” इब्रानी नेगेव का अर्थ सामान्यतः “दक्षिण” या “दक्षिणी प्रदेश” भी हो सकता है और यह नेगेव नामक क्षेत्र को भी सूचित कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: יַעַר הַנֶּגֶב
  choice: नेगेव के वन
  rationale: יַעַר का अर्थ ‘वन’ है और נֶגֶב किसी विशिष्ट भौगोलिक क्षेत्र नेगेव अथवा सामान्यतः दक्षिणी प्रदेश को सूचित कर सकता है। मुख्य पाठ में स्थाननाम रखने और पादटिप्पणी में व्यापक अर्थ देने से मूल की अस्पष्टता बनी रहती है।
- source_word: שְׁמַע דְּבַר יְהוָה
  choice: याहवे का वचन सुन
  rationale: यह भविष्यवाणी में प्रयुक्त सीधी आज्ञा है। ‘सुन’ उसके आदेशात्मक बल को स्वाभाविक आधुनिक हिन्दी में बनाए रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: मूल पाठ में परमेश्वर का व्यक्तिगत नाम YHWH है; ‘याहवे’ उसका प्रचलित हिन्दी लिप्यंतरण है।
- source_word: אֲדֹנָי יְהוִה
  choice: प्रभु याहवे
  rationale: यह संयुक्त संबोधन אֲדֹנָי और YHWH दोनों को अलग-अलग व्यक्त करता है तथा किसी एक को छिपाता नहीं।
- source_word: הִנְנִי מַצִּית בְּךָ אֵשׁ
  choice: देख, मैं तुझमें आग लगा रहा हूँ
  rationale: הִנְנִי घोषणा पर ध्यान खींचता है और उसके साथ आया कृदंत आसन्न तथा आरंभ होती हुई कार्रवाई व्यक्त करता है। ‘देख’ और वर्तमान प्रगतिशील रूप हिन्दी में इस बल को सहज रूप से रखते हैं।
- source_word: וְאָכְלָה בְךָ כָּל עֵץ לַח וְכָל עֵץ יָבֵשׁ
  choice: वह तुझमें हर हरे पेड़ और हर सूखे पेड़ को भस्म कर देगी
  rationale: आग के लिए אָכַל का अर्थ ‘खा जाना/भस्म करना’ है। לַח मूलतः नम या ताज़ा है, पर पेड़ के संदर्भ में ‘हरा’ स्वाभाविक है और सूखे पेड़ से विरोध बनाए रखता है।
- source_word: לַהֶבֶת שַׁלְהֶבֶת
  choice: धधकती ज्वाला
  rationale: यह बलाघाती पदबंध ज्वाला की प्रचंडता बताता है। ‘धधकती ज्वाला’ उस तीव्रता को संक्षिप्त और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וְנִצְרְבוּ בָהּ כָּל פָּנִים
  choice: उससे ... हर चेहरा झुलस जाएगा
  rationale: צָרַב तेज़ ताप से झुलसने का भाव देता है। ‘हर चेहरा’ मूल की ठोस किंतु अर्थगर्भित अभिव्यक्ति को बिना व्याख्यात्मक विस्तार के सुरक्षित रखता है।
- source_word: מִנֶּגֶב צָפוֹנָה
  choice: दक्षिण से उत्तर तक
  rationale: शाब्दिक दिशा ‘दक्षिण से उत्तर की ओर’ है; ‘दक्षिण से उत्तर तक’ हिन्दी में उसके व्यापक विस्तार को स्वाभाविक ढंग से व्यक्त करता है।
theological_decisions:
- issue: परमेश्वर के नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल में व्यक्तिगत ईश्वरीय नाम है। उसका लिप्यंतरण नाम और उपाधि के बीच का अंतर बनाए रखता है।
- issue: वन और आग के न्याय-संबंधी रूपक
  choice: मुख्य पाठ में वन, पेड़ और आग की ठोस भाषा बनाए रखना
  alternative: वन को सीधे यहूदा और आग को दंड कहकर स्पष्ट करना
  rationale: इस वचन में अर्थ रूपक के द्वारा दिया गया है। उसकी व्याख्या को मुख्य पाठ में जोड़ना मूल की काव्यात्मक और भविष्यवाणीय तनाव को समय से पहले सुलझा देता।
- issue: כָּל פָּנִים की अर्थगर्भित अभिव्यक्ति
  choice: हर चेहरा
  alternative: हर व्यक्ति; सारी भूमि
  rationale: ‘चेहरा’ मूल का सीधा चित्र है और उसका संदर्भात्मक विस्तार खुला रखता है; ‘व्यक्ति’ या ‘भूमि’ चुनना संभावित अर्थों में से एक को निर्णायक बना देता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और भविष्यवाणी के सीधे संबोधन के अनुरूप रखी गई है। वन को एकवचन ‘तू’ में संबोधित करने के लिए ‘तुझमें’ रखा गया है। अंग्रेज़ी परामर्श-पाठ में [b] का स्थान और उसकी पादटिप्पणी परस्पर असंगत थे; चूँकि वह मूल इब्रानी की किसी वास्तविक अस्पष्टता को स्पष्ट नहीं करती, उसे हिन्दी प्रकाशन-पाठ में नहीं अपनाया गया।
