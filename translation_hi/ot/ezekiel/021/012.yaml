source:
  edition: WLC
  text: וְ/הָיָה֙ כִּֽי יֹאמְר֣וּ אֵלֶ֔י/ךָ עַל מָ֖ה אַתָּ֣ה נֶאֱנָ֑ח וְ/אָמַרְתָּ֡ אֶל שְׁמוּעָ֣ה כִֽי בָאָ֡ה וְ/נָמֵ֣ס כָּל לֵב֩ וְ/רָפ֨וּ כָל יָדַ֜יִם וְ/כִהֲתָ֣ה כָל ר֗וּחַ וְ/כָל בִּרְכַּ֨יִם֙ תֵּלַ֣כְנָה מַּ֔יִם הִנֵּ֤ה בָאָה֙ וְ/נִֽהְיָ֔תָה נְאֻ֖ם אֲדֹנָ֥/י יְהוִֽה־־־־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/021/012.yaml
  text: And it shall be[a], when they say to you, ‘Why are you groaning?’ that you shall say, ‘Because of the news, for it is coming.’ Then every heart will melt, all hands will grow weak, every spirit will faint, and all knees will run with water. Look, it is coming, and it will happen[b], declares the Lord GOD.
translation:
  language: hi
  text: और जब वे तुमसे पूछें, ‘तुम क्यों कराह रहे हो?’ तब तुम कहना, ‘उस समाचार के कारण, क्योंकि वह आ रहा है।’ तब हर एक का हृदय पिघल जाएगा, सबके हाथ ढीले पड़ जाएँगे, हर एक की आत्मा क्षीण हो जाएगी, और सबके घुटनों से पानी बहने लगेगा[a]। देखो, वह आ रहा है और ऐसा होकर रहेगा—प्रभु याहवे की घोषणा है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “सब घुटने पानी बहाएँगे।” यह घोर भय और शारीरिक पतन का सजीव मुहावरा है। इसका अर्थ घुटनों का पानी जैसा निर्बल हो जाना या भय के कारण शरीर पर नियंत्रण खो देना हो सकता है।
    reason: cultural_note
lexical_decisions:
- source_word: נֶאֱנָח
  choice: कराह रहे हो
  rationale: निफ़अल रूप श्रव्य दुःख और विलाप को व्यक्त करता है; ‘कराहना’ आधुनिक हिन्दी में इसकी शारीरिक और भावनात्मक तीव्रता बनाए रखता है।
- source_word: שְׁמוּעָה
  choice: समाचार
  rationale: यह आनेवाली विपत्ति की भयावह खबर है। ‘समाचार’ स्वाभाविक आधुनिक हिन्दी है; ‘सूचना’ या ‘खबर’ भी संभव हैं।
- source_word: כִּי בָאָה
  choice: क्योंकि वह आ रहा है
  rationale: स्त्रीलिंग क्रिया ‘समाचार’ से सहमत है और उसके निकट आगमन को व्यक्त करती है; हिन्दी में समाचार के लिए पुल्लिंग सर्वनाम स्वाभाविक है।
- source_word: וְנָמֵס כָּל לֵב
  choice: हर एक का हृदय पिघल जाएगा
  rationale: साहस टूटने की इब्रानी देहात्मक छवि को व्याख्या में बदलने के बजाय बनाए रखा गया है।
- source_word: וְרָפוּ כָל יָדַיִם
  choice: सबके हाथ ढीले पड़ जाएँगे
  rationale: यह शक्ति और कार्य करने की क्षमता खो देने का चित्र है; यह हिन्दी मुहावरा स्पष्ट रहते हुए शारीरिक बिंब को सुरक्षित रखता है।
- source_word: וְכִהֲתָה כָל רוּחַ
  choice: हर एक की आत्मा शिथिल पड़ जाएगी
  rationale: यहाँ רוּחַ मनोबल अथवा भीतरी शक्ति की ओर संकेत करता है। ‘आत्मा’ मूल शब्द की व्यापकता बनाए रखता है और ‘शिथिल पड़ना’ उसके क्षीण होने को दर्शाता है।
- source_word: וְכָל בִּרְכַּיִם תֵּלַכְנָה מַּיִם
  choice: सबके घुटनों से पानी बहने लगेगा
  rationale: मूल का जानबूझकर तीखा और कुछ अस्पष्ट चित्र सुरक्षित रखा गया है; भय से दुर्बलता या शरीर पर नियंत्रण खोना दोनों संभावनाएँ खुली रहती हैं।
- source_word: הִנֵּה
  choice: देखो
  rationale: यह ध्यान खींचने और तात्कालिकता बताने वाला स्वाभाविक आधुनिक हिन्दी रूप है।
- source_word: וְנִהְיָתָה
  choice: ऐसा होकर रहेगा
  rationale: यह घोषित घटना की निश्चित सिद्धि पर बल देता है और आधुनिक हिन्दी में स्वाभाविक है।
- source_word: אֲדֹנָי יְהוִה
  choice: प्रभु यहोवा
  rationale: संयुक्त उपाधि में אֲדֹנָי को ‘प्रभु’ और चार-अक्षरीय दिव्य नाम को हिन्दी की प्रचलित बाइबलीय वर्तनी ‘यहोवा’ से व्यक्त किया गया है, जिससे दोनों अलग बने रहते हैं।
theological_decisions:
- issue: אֲדֹנָי יְהוִה में दिव्य नाम का अनुवाद
  choice: प्रभु यहोवा
  alternative: प्रभु याहवे / प्रभु परमेश्वर
  rationale: मूल में सामान्य उपाधि और व्यक्तिगत दिव्य नाम दोनों हैं। ‘प्रभु यहोवा’ इस भेद को बनाए रखता है और हिन्दी बाइबल-पाठकों के लिए परिचित है; इसे केवल ‘प्रभु परमेश्वर’ करने से नाम और उपाधि का भेद मिट सकता है।
- issue: घुटनों से पानी बहने की छवि
  choice: मूल की अस्पष्ट देहात्मक छवि को मुख्य पाठ में बनाए रखना
  alternative: घुटने पानी जैसे निर्बल हो जाएँगे / भय से शरीर पर नियंत्रण जाता रहेगा
  rationale: इब्रानी वाक्य भयजनित पतन का सजीव चित्र देता है, पर उसका सटीक शारीरिक आशय विवादित है; मुख्य पाठ किसी एक व्याख्या को अंतिम नहीं बनाता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। समानांतर देहात्मक बिंब—हृदय, हाथ, आत्मा और घुटने—सुरक्षित हैं। भविष्यकाल आनेवाले समाचार और उसके निश्चित परिणाम को व्यक्त करता है।
