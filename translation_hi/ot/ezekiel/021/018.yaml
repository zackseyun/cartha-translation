  text: כִּ֣י בֹ֔חַן וּ/מָ֕ה אִם גַּם שֵׁ֥בֶט מֹאֶ֖סֶת לֹ֣א יִֽהְיֶ֑ה נְאֻ֖ם אֲדֹנָ֥/י יְהוִֽה־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/021/018.yaml
  text: For there is a testing[b][a]; and what if even the scepter that despises will not remain? declares the Lord GOD.
translation:
  language: hi
  text: क्योंकि परख है[a]; और यदि तिरस्कार करने वाला राजदंड भी नहीं रहेगा, तो क्या होगा?[b] प्रभु याहवे की यह घोषणा है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इस पद का इब्रानी पाठ बहुत कठिन और संक्षिप्त है। ‘परख है’ का अनुवाद ‘एक परीक्षा है’ या, संदर्भ के अनुसार, ‘परीक्षा होगी’ भी किया जा सकता है।
    reason: alternative_reading
  - marker: b
    text: 'इब्रानी शब्द שֵׁבֶט का अर्थ ‘राजदंड,’ ‘छड़ी’ या ‘गोत्र’ हो सकता है। राजदंड से संबंधित पूरे उपवाक्य का अर्थ अनिश्चित है; एक अन्य संभावित अनुवाद है: ‘और यदि तिरस्कार करने वाला राजदंड भी मिट जाएगा, तो क्या होगा?’'
    reason: lexical_and_syntactic_alternative
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले कथन का आधार या स्पष्टीकरण प्रस्तुत करता है और इब्रानी संयोजक का कारणसूचक बल बनाए रखता है।
- source_word: בֹחַן
  choice: परख
  rationale: בחן से बना यह संक्षिप्त और कुछ हद तक लुप्त पद है; ‘परख’ परीक्षा, जाँच और कसौटी के भाव को बिना अनावश्यक रूप से कर्ता निर्धारित किए व्यक्त करता है।
- source_word: וּמָה אִם גַּם
  choice: और यदि … भी …, तो क्या होगा?
  rationale: इन शब्दों को एक कठिन आलंकारिक और शर्तसूचक प्रश्न के रूप में लिया गया है। हिंदी में ‘तो क्या होगा?’ जोड़ने से वाक्य स्वाभाविक बनता है, जबकि मूल की अनिश्चितता बनी रहती है।
- source_word: שֵׁבֶט
  choice: राजदंड
  rationale: इस न्याय और राजकीय संदर्भ में ‘राजदंड’ उपयुक्त है; शब्द के अन्य संभव अर्थ ‘छड़ी’ और ‘गोत्र’ हैं।
- source_word: מֹאֶסֶת
  choice: तिरस्कार करने वाला
  rationale: מאס का सक्रिय अर्थ ‘ठुकराना/तुच्छ जानना/तिरस्कार करना’ है। इसे राजदंड को विशेषित करने वाले कृदंत के रूप में रखा गया है, यद्यपि इब्रानी रचना असामान्य और कठिन है।
- source_word: לֹא יִהְיֶה
  choice: नहीं रहेगा
  rationale: शाब्दिक अर्थ ‘नहीं होगा’ है; संदर्भ में किसी सत्ता या राजदंड के बने न रहने का भाव है।
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: प्रभु याहवे की यह घोषणा है
  rationale: यह मानक नबूवत-सूत्र है। ‘याहवे’ परमेश्वर के व्यक्तिगत वाचा-नाम को दर्शाता है और ‘प्रभु’ אֲדֹנָי का अनुवाद है।
theological_decisions:
- issue: אֲדֹנָי יְהוִה में परमेश्वर के नाम का अनुवाद
  choice: प्रभु याहवे
  alternative: प्रभु परमेश्वर / प्रभु यहोवा
  rationale: मूल पाठ में वाचा-नाम יהוה प्रत्यक्ष रूप से आया है। ‘याहवे’ उसे सामान्य उपाधि में बदलने के बजाय नाम के रूप में सुरक्षित रखता है; אֲדֹנָי का अलग अनुवाद ‘प्रभु’ किया गया है।
- issue: राजदंड वाले कठिन उपवाक्य का अर्थ
  choice: तिरस्कार करने वाला राजदंड भी नहीं रहेगा
  alternative: तलवार राजदंड को भी तुच्छ समझती है; वह नहीं रहेगा
  rationale: मूल इब्रानी अत्यंत कठिन है और अनेक व्याकरणिक संबंध संभव हैं। मुख्य पाठ में राजदंड को कृदंत का कर्ता मानने वाली सीधी रचना रखी गई है, पर पादटिप्पणी में अनिश्चितता स्पष्ट की गई है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। मूल की टूटी हुई, तनावपूर्ण शैली को डैश और आलंकारिक प्रश्न से प्रकट किया गया है; कठिनाई को किसी एक व्याख्या से पूरी तरह समतल नहीं किया गया।
