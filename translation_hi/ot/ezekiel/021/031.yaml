id: EZK.21.31
reference: Ezekiel 21:31
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: כֹּ֤ה אָמַר֙ אֲדֹנָ֣/י יְהוִ֔ה הָסִיר֙ הַ/מִּצְנֶ֔פֶת וְ/הָרִ֖ים הָֽ/עֲטָרָ֑ה זֹ֣את לֹא זֹ֔את הַ/שָּׁפָ֣לָה הַגְבֵּ֔הַ וְ/הַ/גָּבֹ֖הַ הַשְׁפִּֽיל־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/021/031.yaml
  text: 'Thus says the Lord GOD: Remove the turban[a], and take off the crown. This will not remain the same: exalt the lowly[b], and humble the exalted.'
translation:
  language: hi
  text: 'प्रभु याहवे यों कहते हैं: पगड़ी[a] उतार और मुकुट हटा। यह वैसा नहीं रहेगा[b]। जो नीचा है उसे ऊँचा कर, और जो ऊँचा है उसे नीचा कर।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘पगड़ी’ विशेष रूप से याजक के सिर पर पहने जाने वाले वस्त्र को सूचित कर सकती है; ‘मुकुट’ राजकीय अधिकार का चिह्न है। यहाँ स्थापित नेतृत्व के दोनों चिह्न हटाए जा रहे हैं।
    reason: cultural_note
  - marker: b
    text: इस संक्षिप्त इब्रानी वाक्यांश का अनुवाद ‘यह अब नहीं रहेगा’ या ‘यह पहले जैसा नहीं रहेगा’ भी हो सकता है। यह वर्तमान व्यवस्था के उलट दिए जाने पर बल देता है।
    reason: alternative_reading
lexical_decisions:
- source_word: הָסִיר
  choice: उतार
  rationale: हिफ़ील आज्ञार्थक रूप हटाने की सीधी आज्ञा देता है। सिर पर पहनी जाने वाली पगड़ी के साथ ‘उतार’ स्वाभाविक हिन्दी है।
- source_word: הַמִּצְנֶפֶת
  choice: पगड़ी
  rationale: यह शब्द लपेटकर पहने जाने वाले सिर-वस्त्र को दर्शाता है और विशेषतः याजकीय पगड़ी के लिए प्रयुक्त हो सकता है। ‘पगड़ी’ आधुनिक पाठक के लिए स्पष्ट और सहज है।
- source_word: וְהָרִים
  choice: और … हटा
  rationale: रום का हिफ़ील रूप मूलतः ‘ऊपर उठा’ है; मुकुट और पदच्युत करने के इस प्रसंग में उसका आशय मुकुट को उठाकर हटा देना है।
- source_word: הָעֲטָרָה
  choice: मुकुट
  rationale: עֲטָרָה मुकुट या सिर पर धारण किए जाने वाले राजचिह्न को दर्शाता है। ‘मुकुट’ व्यापक और स्वाभाविक हिन्दी पर्याय है।
- source_word: זֹאת לֹא זֹאת
  choice: यह वैसा नहीं रहेगा
  rationale: इब्रानी वाक्यांश अत्यंत संक्षिप्त और अध्याहृत है। यह वर्तमान व्यवस्था के पहले जैसी न रहने की घोषणा करता है; हिन्दी रूप अर्थ को स्पष्ट रखते हुए उसकी अनिश्चितता को पूरी तरह किसी एक व्याख्या में नहीं बाँधता।
- source_word: הַשָּׁפָלָה הַגְבֵּהַ
  choice: जो नीचा है उसे ऊँचा कर
  rationale: यह शब्दक्रम ‘नीचे/दीन को ऊँचा करने’ की उलटफेर वाली छवि को सीधे और समानांतर ढंग से रखता है।
- source_word: וְהַגָּבֹהַ הַשְׁפִּיל
  choice: और जो ऊँचा है उसे नीचा कर
  rationale: यह अनुवाद पहले खंड के समानांतर रहते हुए ऊँचे को नीचे किए जाने की स्पष्ट उलटफेर को सुरक्षित रखता है।
- source_word: אֲדֹנָי יְהוִה
  choice: प्रभु यहोवा
  rationale: 'संयुक्त उपाधि के दोनों तत्वों को अलग-अलग व्यक्त किया गया है: אֲדֹנָי के लिए ‘प्रभु’ और चार अक्षरों वाले परमेश्वर के नाम के लिए हिन्दी में प्रचलित ‘यहोवा’।'
theological_decisions:
- issue: אֲדֹנָי יְהוִה में परमेश्वर के नाम का अनुवाद
  choice: प्रभु यहोवा
  alternative: प्रभु याहवे
  rationale: ‘प्रभु यहोवा’ दोनों इब्रानी तत्वों को सुरक्षित रखता है और हिन्दी बाइबलीय प्रयोग में समझने योग्य है; ‘याहवे’ मूल उच्चारण को अधिक निकटता से दिखाने वाला वैकल्पिक रूप है।
- issue: संक्षिप्त वाक्यांश זֹאת לֹא זֹאת का अर्थ
  choice: यह वैसा नहीं रहेगा
  alternative: यह अब नहीं रहेगा; यह पहले जैसा नहीं रहेगा
  rationale: मूल वाक्य रचनात्मक रूप से संक्षिप्त और अर्थ की दृष्टि से खुला है। चुना हुआ रूप वर्तमान दशा के उलट जाने को व्यक्त करता है, पर उसे केवल राजसत्ता या केवल याजकपद तक सीमित नहीं करता।
- issue: नीचे और ऊँचे की उलटफेर
  choice: जो नीचा है उसे ऊँचा कर, और जो ऊँचा है उसे नीचा कर
  alternative: दीन को प्रतिष्ठित कर और प्रतिष्ठित को दीन कर
  rationale: स्थान और पद—दोनों की सम्भावित छवि को बनाए रखने के लिए सरल ‘नीचा/ऊँचा’ शब्दावली रखी गई है; इससे मूल की सामाजिक और शासकीय प्रतिध्वनि को किसी संकीर्ण धार्मिक अर्थ में नहीं बाँधा जाता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सीधी रखी गई है। एकवचन आज्ञार्थक क्रियाएँ मूल इब्रानी के रूप को दर्शाती हैं। समानांतर ‘नीचा/ऊँचा’ संरचना भविष्यवाणी की उलटफेर वाली लय को सुरक्षित रखती है।
