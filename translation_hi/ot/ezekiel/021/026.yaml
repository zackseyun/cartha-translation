source:
  edition: WLC
  text: כִּֽי עָמַ֨ד מֶלֶךְ בָּבֶ֜ל אֶל אֵ֣ם הַ/דֶּ֗רֶךְ בְּ/רֹ֛אשׁ שְׁנֵ֥י הַ/דְּרָכִ֖ים לִ/קְסָם קָ֑סֶם קִלְקַ֤ל בַּֽ/חִצִּים֙ שָׁאַ֣ל בַּ/תְּרָפִ֔ים רָאָ֖ה בַּ/כָּבֵֽד־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/021/026.yaml
  text: 'For the king of Babylon stands at the mother of the road[a], at the head of the two roads, to practice divination: he shakes the arrows, he consults the teraphim[c][b], he examines the liver.'
translation:
  language: hi
  text: 'क्योंकि बाबेल का राजा उस स्थान पर खड़ा है जहाँ से दो मार्ग निकलते हैं[a]—दोनों मार्गों के आरम्भ पर—शकुन जानने के लिए: वह तीरों को हिलाता है, तराफ़ीम[b] से पूछता है और कलेजे की जाँच करता है[c]।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से ‘मार्ग की माता’; आशय वह उद्गम-बिन्दु या दोराहा है जहाँ से मार्ग अलग होते हैं।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी ‘तराफ़ीम’; शकुन-विचार में प्रयुक्त प्रतिमाएँ या पूजनीय वस्तुएँ। इसका अर्थ ‘गृह-देवताओं की मूर्तियाँ’ भी हो सकता है।
    reason: cultural_note
  - marker: c
    text: अर्थात कलेजे का निरीक्षण करके शकुन जानना।
    reason: cultural_note
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले कथन का कारण अथवा स्पष्टीकरण प्रस्तुत करता है; ‘क्योंकि’ उस संबंध को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: עָמַד
  choice: खड़ा है
  rationale: पूर्ण क्रिया यहाँ भविष्यदर्शी दृश्य को सजीव रूप में सामने रखती है; हिन्दी वर्तमान काल उसी तात्कालिकता को व्यक्त करता है।
- source_word: אֵם הַדֶּרֶךְ
  choice: उस स्थान पर जहाँ से दो मार्ग निकलते हैं
  rationale: शाब्दिक रूप ‘मार्ग की माता’ है, पर सन्दर्भ में इसका आशय मार्गों का उद्गम अथवा दोराहा है। चुना हुआ रूप अर्थ को सहजता से स्पष्ट करता है और अगले वाक्यांश के साथ मेल खाता है।
- source_word: בְּרֹאשׁ שְׁנֵי הַדְּרָכִים
  choice: दोनों मार्गों के आरम्भ पर
  rationale: רֹאשׁ का ठोस अर्थ ‘सिर’ है, पर स्थानवाचक प्रयोग में यहाँ दोनों मार्गों के आरम्भ को सूचित करता है।
- source_word: לִקְסָם קָסֶם
  choice: ताकि शकुन-विचार करे
  rationale: धातु और उसी मूल की संज्ञा मिलकर शकुन द्वारा निर्णय जानने की क्रिया पर बल देते हैं; ‘शकुन-विचार’ आधुनिक हिन्दी में इस अर्थ को संक्षेप और स्पष्ट रूप से देता है।
- source_word: קִלְקַל בַּחִצִּים
  choice: वह तीरों को हिलाता है
  rationale: यह तीरों के माध्यम से शकुन जानने की प्रथा का संकेत है। क्रिया का ठीक स्वरूप दुर्लभ है; ‘हिलाता है’ सम्भावित अर्थ को बिना अनावश्यक विस्तार के रखता है।
- source_word: שָׁאַל בַּתְּרָפִים
  choice: गृह-देवमूर्तियों से पूछता है
  rationale: תְּרָפִים पूजा अथवा शकुन-विचार में प्रयुक्त मूर्तियों को सूचित करता है। ‘गृह-देवमूर्तियाँ’ सामान्य पाठक के लिए अर्थपूर्ण है, जबकि पादटिप्पणी सांस्कृतिक अनिश्चितता स्पष्ट करती है।
- source_word: רָאָה בַּכָּבֵד
  choice: कलेजे की जाँच करता है
  rationale: शाब्दिक क्रिया ‘देखना’ है, लेकिन प्रसंग बलि-पशु के कलेजे का निरीक्षण करके शकुन जानने की तकनीकी क्रिया का है; ‘जाँच करता है’ इसे स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: मूर्तिपूजक शकुन-विचार की क्रियाओं को बिना नरम किए या अतिरिक्त धार्मिक टिप्पणी जोड़े प्रस्तुत करना
  choice: तीरों, गृह-देवमूर्तियों और कलेजे की जाँच—तीनों ठोस विधियों को स्पष्ट रखा गया है।
  alternative: पूरी सूची को सामान्यीकृत करके केवल ‘वह शकुन देखता है’ कहना।
  rationale: इब्रानी पाठ अलग-अलग विधियों की सूची देता है। उन्हें बनाए रखने से ऐतिहासिक और भविष्यदर्शी प्रभाव सुरक्षित रहता है, जबकि अनुवाद स्वयं कोई अतिरिक्त मूल्यांकन नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य हिन्दी पाठक के लिए सुबोध रखी गई है। ‘बाबेल’ बाइबलीय स्थान-नाम के रूप में और ‘शकुन-विचार’ प्राचीन भविष्य-निर्णय की प्रथाओं के लिए प्रयुक्त है। शाब्दिक ‘मार्ग की माता’ को मुख्य पाठ में अस्वाभाविक बनाने के बजाय अर्थानुसार अनूदित कर पादटिप्पणी में सुरक्षित रखा गया है।
