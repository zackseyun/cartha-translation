  text: וְ/יָֽדְעוּ֙ כָּל בָּשָׂ֔ר כִּ֚י אֲנִ֣י יְהוָ֔ה הוֹצֵ֥אתִי חַרְבִּ֖/י מִ/תַּעְרָ֑/הּ לֹ֥א תָשׁ֖וּב עֽוֹד־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/021/010.yaml
  text: And all flesh will know that I[a], Yahweh, have drawn my sword from its sheath; it will not return again.
translation:
  language: hi
  text: और सभी लोग[a] जान लेंगे कि मैं, याहवे, अपनी तलवार उसकी म्यान से खींच चुका हूँ; वह फिर नहीं लौटेगी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक: ‘सारा मांस’; अर्थात ‘सभी लोग’ या ‘सारी मानवजाति।’'
    reason: मूल इब्रानी मुहावरे का शाब्दिक रूप और उसका संदर्भगत मानवीय अर्थ स्पष्ट करना।
lexical_decisions:
- source_word: וְיָדְעוּ
  choice: और ... जान लेंगे
  rationale: भविष्यवाणी के इस प्रसंग में संयोजक वाव के साथ पूर्ण क्रिया भावी परिणाम व्यक्त करती है। ‘जान लेंगे’ यहेजकेल में बार-बार आने वाले पहचान-सूत्र को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: כָּל בָּשָׂר
  choice: सब प्राणी
  rationale: इब्रानी का शाब्दिक अर्थ ‘सारा मांस’ है। ‘सब प्राणी’ मूल बाइबिलीय बिंब और व्यापकता को बनाए रखते हुए आधुनिक हिन्दी में समझने योग्य है; वैकल्पिक अर्थ पादटिप्पणी में दिया गया है।
- source_word: כִּי אֲנִי יְהוָה
  choice: कि मैं, याहवे,
  rationale: यह वाक्यांश वक्ता की पहचान पर बल देता है। अल्पविरामों के साथ ‘याहवे’ को ‘मैं’ के समानाधिकरण में रखना इब्रानी संरचना के निकट और हिन्दी में स्पष्ट है।
- source_word: יְהוָה
  choice: याहवे
  rationale: चार अक्षरों वाले परमेश्वर के निजी नाम को किसी उपाधि से बदलने के बजाय हिन्दी लिपि में ‘याहवे’ रूप में लिखा गया है।
- source_word: הוֹצֵאתִי חַרְבִּי
  choice: अपनी तलवार ... खींच चुका हूँ
  rationale: הוֹצֵאתִי का मूल भाव ‘बाहर निकालना’ है; तलवार और म्यान के प्रसंग में ‘खींच चुका हूँ’ स्वाभाविक हिन्दी है और पूर्ण हुई क्रिया का बल व्यक्त करता है।
- source_word: מִתַּעְרָהּ
  choice: उसकी म्यान से
  rationale: स्त्रीलिंग एकवचन प्रत्यय तलवार की ओर संकेत करता है। ‘उसकी म्यान से’ इस संबंध को स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
- source_word: לֹא תָשׁוּב עוֹד
  choice: वह फिर नहीं लौटेगी
  rationale: स्त्रीलिंग क्रिया का कर्ता तलवार है। यह अनुवाद निषेध और עוֹד के ‘फिर’ वाले अर्थ दोनों को सुरक्षित रखता है, बिना इसे अनावश्यक रूप से ‘कभी नहीं’ बनाकर अधिक प्रबल किए।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: प्रभु / यहोवा
  rationale: मूल पाठ में परमेश्वर का निजी नाम सीधे आया है। ‘याहवे’ उसका लिप्यंतरण है और उसे किसी उपाधि से प्रतिस्थापित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘सब प्राणी’ मूल मुहावरे की व्यापकता बचाता है, जबकि पादटिप्पणी उसका आशय स्पष्ट करती है।
