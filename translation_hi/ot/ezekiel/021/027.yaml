- source_word: לָשׂוּם כָּרִים
  choice: फाटक तोड़ने वाले युद्ध-यंत्र लगाने
  rationale: घेराबंदी के प्रसंग में כָּרִים से आशय टक्कर मारकर द्वार या प्राचीर तोड़ने वाले ‘बेटरिंग राम’ हैं। यह रूप आधुनिक सामान्य पाठक को साधन का कार्य स्पष्ट करता है और ‘मेंढ़े’ से उत्पन्न पशु-संबंधी भ्रम से बचाता है।
- source_word: לִפְתֹּחַ פֶּה בְּרֶצַח
  choice: मारकाट के लिए मुँह खोलने
  rationale: ‘मुँह खोलने’ का प्रबल मूल चित्र बनाए रखता है; בְּ का संबंध साधन, रीति या उद्देश्य से हो सकता है, इसलिए विकल्प पादटिप्पणी में दिया गया है।
- source_word: רֶצַח
  choice: मारकाट
  rationale: घेराबंदी में होने वाली हिंसक हत्या को व्यक्त करता है; ‘हत्या’ यहाँ अत्यधिक विधिक सुनाई दे सकती है और ‘वध’ कुछ पाठकों को अनुष्ठानिक अर्थ दे सकता है।
- source_word: לְהָרִים קוֹל בִּתְרוּעָה
  choice: रणघोष करते हुए आवाज़ बुलंद करने
  rationale: קול और תרועה, दोनों की श्रव्य तथा युद्ध-संबंधी शक्ति को सहज हिन्दी में व्यक्त करता है।
- source_word: עַל שְׁעָרִים
  choice: फाटकों के विरुद्ध
  rationale: עַל का विरोधात्मक, आक्रमणकारी अर्थ घेराबंदी के प्रसंग में स्पष्ट करता है।
- source_word: לִשְׁפֹּךְ סֹלְלָה
  choice: घेराबंदी का ढालू बाँध खड़ा करने
  rationale: סֹלְלָה आक्रमण के लिए मिट्टी-पत्थर से बनाए गए चढ़ाई वाले बाँध या रैंप को दर्शाता है; ‘ढालू बाँध’ सामान्य हिन्दी में उसका रूप स्पष्ट करता है।
- source_word: לִבְנוֹת דָּיֵק
  choice: घेराबंदी की दीवार बनाने
  rationale: דָּיֵק किसी घेराबंदी-संबंधी रक्षात्मक या घेरने वाली संरचना का द्योतक है; मुख्य पाठ में स्पष्ट और सुलभ विकल्प रखा गया है, जबकि शब्द की व्यापकता पादटिप्पणी में सुरक्षित है।
