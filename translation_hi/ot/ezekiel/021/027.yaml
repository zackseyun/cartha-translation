base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/021/027.yaml
  text: 'In his right hand was the divination for Jerusalem: to set battering rams[a], to open the mouth with slaughter, to raise the voice with a battle cry, to set battering rams against the gates, to heap up a siege ramp[b], to build a siege wall.'
translation:
  language: hi
  text: 'उसके दाहिने हाथ में यरूशलेम के लिए शकुन था: दुर्गभेदी यंत्र खड़े करने, मारकाट के लिए मुँह खोलने[a], रणघोष के साथ आवाज़ बुलंद करने, फाटकों के विरुद्ध दुर्गभेदी यंत्र खड़े करने, घेराबंदी का चढ़ाई-बाँध खड़ा करने और घेराबंदी की दीवार बनाने[b]।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मारकाट के साथ मुँह खोलने।” यह मुहावरा आक्रमण का आदेश देने या आक्रमण के साथ उठने वाली पुकार की ओर संकेत कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: या, “घेराबंदी का घेरा” अथवा “घेराबंदी का दुर्ग”; इब्रानी शब्द सामान्य रूप से घेराबंदी के लिए बनाई गई संरचना को दर्शाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּימִינוֹ
  choice: उसके दाहिने हाथ में
  rationale: स्थानसूचक ठोस चित्र को स्वाभाविक हिन्दी में सुरक्षित रखता है।
