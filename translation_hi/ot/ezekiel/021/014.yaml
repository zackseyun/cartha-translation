base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/021/014.yaml
  text: 'Son of man[a], prophesy and say, ‘Thus says the Lord GOD: Say, “A sword, a sword, sharpened and also polished.”’'
translation:
  language: hi
  text: 'हे मनुष्य के पुत्र, भविष्यवाणी कर और कह, ‘प्रभु ऐसा कहता है: कह, “तलवार, तलवार! वह तेज की गई है और चमकाई भी गई है[a]।”’'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘माँजी गई है।’ इब्रानी शब्द तलवार को घिसकर चिकना और चमकीला किए जाने का संकेत देता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן אָדָם
  choice: हे मनुष्य के पुत्र
  rationale: यहेजकेल में नबी के लिए प्रयुक्त स्थापित संबोधन को बनाए रखता है और इब्रानी संरचना का निकट, स्वाभाविक हिन्दी रूप देता है।
- source_word: הִנָּבֵא
  choice: भविष्यवाणी कर
  rationale: נבא के आज्ञार्थक रूप का प्रचलित और स्पष्ट हिन्दी समतुल्य।
- source_word: וְאָמַרְתָּ
  choice: और कह
  rationale: पहली आज्ञा के बाद आने वाली क्रमिक आज्ञा को सरलता से व्यक्त करता है।
- source_word: כֹּה אָמַר אֲדֹנָי
  choice: प्रभु ऐसा कहता है
  rationale: मानक नबूवत-संदेश सूत्र को स्वाभाविक हिन्दी में रखता है। उपलब्ध इब्रानी पाठ में אֲדֹנָי है, इसलिए यहाँ यहोवा नाम नहीं जोड़ा गया।
- source_word: אֱמֹר
  choice: कह
  rationale: אמר की दूसरी आज्ञा और मूल की जानबूझकर की गई पुनरावृत्ति को सुरक्षित रखता है।
- source_word: חֶרֶב חֶרֶב
  choice: तलवार, तलवार!
  rationale: इब्रानी की बलाघाती पुनरावृत्ति को यथावत रखता है; विस्मयादिबोधक चिह्न उसके उद्घोषात्मक बल को स्पष्ट करता है।
- source_word: הוּחַדָּה
  choice: तेज की गई है
  rationale: חדד के कर्मवाच्य रूप को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: וְגַם
  choice: और ... भी
  rationale: दूसरी क्रिया से जुड़ी संचयी बलवत्ता को हिन्दी की स्वाभाविक संरचना में दर्शाता है।
- source_word: מְרוּטָה
  choice: चमकाई गई है
  rationale: तलवार को घिसकर चिकना और चमकीला किए जाने का भाव सामान्य पाठक के लिए स्पष्ट करता है; ‘माँजी गई’ निकट विकल्प है।
theological_decisions:
- issue: אֲדֹנָי में ईश्वरीय उपाधि का अनुवाद
  choice: प्रभु
  alternative: प्रभु यहोवा
  rationale: दिए गए मूल पाठ में केवल אֲדֹנָי है, टेट्राग्राम नहीं; इसलिए ‘यहोवा’ जोड़ना मूल से आगे जाना होता। ‘प्रभु’ उपाधि को ठीक रूप से व्यक्त करता है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट हिन्दी। मूल की दोहरी आज्ञा और ‘तलवार’ की बलाघाती पुनरावृत्ति सुरक्षित रखी गई है।
