source:
  edition: WLC
  text: זְעַ֤ק וְ/הֵילֵל֙ בֶּן אָדָ֔ם כִּי הִיא֙ הָיתָ֣ה בְ/עַמִּ֔/י הִ֖יא בְּ/כָל נְשִׂיאֵ֣י יִשְׂרָאֵ֑ל מְגוּרֵ֤י אֶל חֶ֨רֶב֙ הָי֣וּ אֶת עַמִּ֔/י לָ/כֵ֖ן סְפֹ֥ק אֶל יָרֵֽךְ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/021/017.yaml
  text: Cry out and wail[a], son of man, for it has come upon my people; it is upon all the princes of Israel. They are given over to the sword along with my people[b]; therefore strike your thigh.
translation:
  language: hi
  text: हे मनुष्य के पुत्र, चिल्ला और विलाप कर, क्योंकि वह मेरी प्रजा पर आ पड़ी है; वह इस्राएल के सभी प्रधानों पर आ पड़ी है। वे मेरी प्रजा के साथ तलवार के हवाले कर दिए गए हैं।[a] इसलिए अपनी जाँघ पर प्रहार कर।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या: “तलवार का आतंक मेरी प्रजा पर आ पड़ा है।” यहाँ का इब्रानी उपवाक्य कठिन है, और מְגוּרֵי का ठीक अर्थ विवादित है।'
    reason: alternative_reading
  - marker: b
    text: जाँघ पर प्रहार करना शोक, आघात या विलाप प्रकट करने की एक देहगत क्रिया है।
    reason: cultural_note
lexical_decisions:
- source_word: זְעַק וְהֵילֵל
  choice: चिल्ला और विलाप कर
  rationale: दोनों एकवचन आज्ञार्थक रूप तीव्र दुःख की ऊँची पुकार व्यक्त करते हैं। ‘चिल्ला’ पहले क्रियापद की तीव्रता और ‘विलाप कर’ दूसरे की शोकपूर्ण ध्वनि को स्वाभाविक आधुनिक हिन्दी में रखता है।
- source_word: בֶּן אָדָם
  choice: हे मनुष्य के पुत्र
  rationale: यहेजकेल के लिए प्रयुक्त विशिष्ट संबोधन को उसके स्थापित, शाब्दिक रूप में रखा गया है।
- source_word: כִּי הִיא הָיְתָה בְעַמִּי ... הִיא בְּכָל נְשִׂיאֵי יִשְׂרָאֵל
  choice: क्योंकि वह मेरी प्रजा पर आ पड़ी है; वह इस्राएल के सभी प्रधानों पर आ पड़ी है
  rationale: स्त्रीलिंग सर्वनाम का संकेत प्रसंग में तलवार अथवा आने वाली विपत्ति की ओर है। हिन्दी का ‘वह’ इस संकेत को स्पष्ट किए बिना उसकी वास्तविक अस्पष्टता बनाए रखता है; ‘पर आ पड़ी’ न्याय के पहुँचने का स्वाभाविक भाव देता है।
- source_word: נְשִׂיאֵי
  choice: प्रधानों
  rationale: यहाँ शब्द इस्राएल के शासकीय अगुओं को सूचित करता है। ‘प्रधान’ पद और अधिकार का भाव रखता है, पर अनिवार्य रूप से राजवंशीय अर्थ नहीं जोड़ता।
- source_word: מְגוּרֵי אֶל חֶרֶב הָיוּ אֶת עַמִּי
  choice: वे मेरी प्रजा के साथ तलवार के हवाले कर दिए गए हैं
  rationale: कठिन इब्रानी वाक्यांश को प्रधानों के तलवार के अधीन कर दिए जाने के अर्थ में लिया गया है और אֶת को साहचर्य के अर्थ में ‘के साथ’ कहा गया है। वैकल्पिक ‘आतंक’ वाला पाठ पादटिप्पणी में सुरक्षित है।
- source_word: סְפֹק אֶל יָרֵךְ
  choice: अपनी जाँघ पर हाथ मार
  rationale: यह शोक, आघात या विलाप की देहगत क्रिया है। ‘जाँघ पर हाथ मार’ हिन्दी में स्पष्ट और स्वाभाविक है तथा प्रतीकात्मक क्रिया को बनाए रखता है।
theological_decisions:
- issue: दोहराए गए स्त्रीलिंग सर्वनाम הִיא का पूर्वपद
  choice: ‘वह’ द्वारा तलवार अथवा आने वाली विपत्ति की ओर संकेत, बिना किसी एक को स्पष्ट रूप से निश्चित किए
  alternative: सर्वनाम का स्पष्ट अनुवाद ‘तलवार’ या ‘विपत्ति’ के रूप में करना
  rationale: इब्रानी में स्त्रीलिंग संकेत प्रसंग से समझा जाता है, पर इसी पद में उसका संज्ञात्मक पूर्वपद व्यक्त नहीं है। ‘वह’ वास्तविक व्याख्यात्मक तनाव को सुरक्षित रखता है।
- issue: מְגוּרֵי का कठिन अर्थ
  choice: प्रधान मेरी प्रजा के साथ तलवार के हवाले कर दिए गए हैं
  alternative: तलवार का आतंक मेरी प्रजा पर आ पड़ा है
  rationale: रूप और वाक्यरचना विवादित हैं। मुख्य पाठ में तलवार के अधीन किए जाने वाला सुसंगत अर्थ चुना गया है, जबकि प्राचीन और आधुनिक व्याख्या में मिलने वाला ‘आतंक’ संबंधी अर्थ पादटिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सहज भविष्यद्वक्तीय लहजा रखा गया है। संबोधन और आज्ञाएँ एकवचन पुल्लिंग में हैं। अत्यधिक संस्कृतनिष्ठ शब्दावली से बचते हुए ‘प्रजा’, ‘प्रधान’ और ‘विलाप’ जैसे व्यापक रूप से समझे जाने वाले धार्मिक-साहित्यिक शब्द रखे गए हैं।
