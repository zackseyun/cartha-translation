source:
  edition: WLC
  text: וְ/אַתָּ֨ה בֶן אָדָ֜ם שִׂים לְ/ךָ֣ שְׁנַ֣יִם דְּרָכִ֗ים לָ/בוֹא֙ חֶ֣רֶב מֶֽלֶךְ בָּבֶ֔ל מֵ/אֶ֥רֶץ אֶחָ֖ד יֵצְא֣וּ שְׁנֵי/הֶ֑ם וְ/יָ֣ד בָּרֵ֔א בְּ/רֹ֥אשׁ דֶּֽרֶךְ עִ֖יר בָּרֵֽא־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/021/024.yaml
  text: And you[a], son of man, set for yourself two roads for the sword of the king of Babylon to come by; both of them shall go out from one land. And make a signpost[b]; make it at the head of the road to the city.
translation:
  language: hi
  text: “और हे मनुष्य के पुत्र, तुम अपने लिए दो मार्ग निर्धारित करो, जिनसे बाबेल के राजा की तलवार आए। वे दोनों एक ही देश से निकलें। एक दिशासूचक चिह्न[a] बनाओ; उसे नगर को जानेवाले मार्ग के आरम्भ पर[b] बनाओ।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक अर्थ ‘हाथ’ है; यहाँ संभवतः दिशा बतानेवाला चिह्न या संकेत-स्तंभ अभिप्रेत है।
    reason: lexical_alternative
  - marker: b
    text: या ‘नगर को जानेवाले मार्ग के मुख्य मोड़ पर’; इब्रानी वाक्यांश का शाब्दिक अर्थ ‘मार्ग के सिर पर’ है, जो उसके आरम्भ या प्रमुख जंक्शन को सूचित कर सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: בֶן אָדָם
  choice: मनुष्य के पुत्र
  rationale: यहेजकेल के लिए प्रयुक्त स्थायी संबोधन का हिब्रू रूपक बनाए रखता है और परमेश्वर के सामने नबी की मानवीय स्थिति को व्यक्त करता है।
- source_word: שִׂים לְךָ
  choice: अपने लिए…निर्धारित करो
  rationale: आज्ञार्थक क्रिया और לְךָ के आत्मसंबंधी भाव को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है; प्रसंग में नबी को प्रतीकात्मक कार्य के लिए मार्ग अंकित करने हैं।
- source_word: שְׁנַיִם דְּרָכִים
  choice: दो मार्ग
  rationale: दो अलग सैन्य मार्गों के दृश्य को स्पष्ट रखता है और דֶּרֶךְ का सामान्य अर्थ देता है।
- source_word: לָבוֹא חֶרֶב מֶלֶךְ בָּבֶל
  choice: जिनसे बाबेल के राजा की तलवार आए
  rationale: לָבוֹא के प्रयोजन और मार्ग से होकर आने के भाव को व्यक्त करता है। ‘तलवार’ को सैन्य आक्रमण के लक्षणालंकार के रूप में मूल चित्र के अनुसार अक्षरशः रखा गया है।
- source_word: מֵאֶרֶץ אֶחָד
  choice: एक ही देश से
  rationale: दोनों मार्गों के समान उद्गम को स्पष्ट करता है; ‘एक ही’ हिन्दी में इस संबंध को स्वाभाविक रूप से व्यक्त करता है।
- source_word: יֵצְאוּ שְׁנֵיהֶם
  choice: वे दोनों…निकलें
  rationale: सरल क्रिया ‘निकलना’ और द्विवचन-संदर्भ दोनों को बनाए रखता है, बिना यह अनिवार्य किए कि वे ठीक किसी दोराहे पर ही विभाजित होते हैं।
- source_word: יָד
  choice: दिशासूचक चिह्न
  rationale: शाब्दिक अर्थ ‘हाथ’ है, पर इस मार्ग-संदर्भ में दिशा बतानेवाला चिह्न अभिप्रेत होने की प्रबल संभावना है। अनिश्चितता को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: בָּרֵא
  choice: बनाओ
  rationale: इस दुर्लभ प्रयोग का व्यापक और संदर्भानुकूल अर्थ देता है तथा चिह्न को काटकर बनाने, गढ़ने या तैयार करने में से किसी एक प्रक्रिया को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: בְּרֹאשׁ דֶּרֶךְ
  choice: मार्ग के आरम्भ पर
  rationale: शाब्दिक ‘मार्ग के सिर पर’ को स्वाभाविक हिन्दी में प्रस्तुत करता है। यह स्थान मार्ग का आरम्भ या उसका प्रमुख जंक्शन हो सकता है; विकल्प पादटिप्पणी में दिया गया है।
- source_word: עִיר
  choice: नगर को जानेवाले
  rationale: लेखरहित संज्ञा को मार्ग के गंतव्य से जोड़कर स्वाभाविक हिन्दी बनाता है, जबकि किसी विशिष्ट नगर का नाम पाठ में नहीं जोड़ता।
theological_decisions:
- issue: ‘तलवार’ का लक्षणालंकार
  choice: ‘तलवार’ को मूल रूप में बनाए रखा गया
  alternative: बाबेल के राजा की सेना अथवा आक्रमण
  rationale: मूल भविष्यद्वाणी सैन्य आक्रमण को ‘तलवार’ के रूप में सजीव करती है। इसे स्पष्ट व्याख्या से बदलना मूल काव्यात्मक और धर्मवैचारिक तनाव को घटा देता।
translation_notes:
  register: आधुनिक मानक हिन्दी में सीधा, गरिमापूर्ण भविष्यद्वाणी-शैली का अनुवाद। ‘तुम’ एकवचन संबोधन को आज के पाठकों के लिए स्वाभाविक और सम्मानपूर्ण रखता है। ‘बाबेल’ मूल स्थाननाम और प्रचलित बाइबलीय रूप के निकट है। सभी पादटिप्पणी-चिह्न संबंधित शब्द-समूहों के तुरंत बाद रखे गए हैं।
