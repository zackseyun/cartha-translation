- source_word: יְהוָה
  choice: यहोवा
  rationale: मूल पाठ में परमेश्वर का व्यक्तिगत नाम יהוה है। आधुनिक हिन्दी बाइबल-प्रयोग में परिचित लिप्यंतरण ‘यहोवा’ नाम को किसी उपाधि से बदलने के बजाय स्पष्ट रूप से प्रस्तुत करता है।
- source_word: אֵלַי
  choice: मेरे पास
  rationale: पूर्वसर्ग और प्रथम पुरुष प्रत्यय दिशा को व्यक्त करते हैं; इस सूत्र में ‘मेरे पास’ स्वाभाविक आधुनिक हिन्दी है।
- source_word: לֵאמֹר
  choice: इसके बाद आने वाले प्रत्यक्ष कथन को द्विबिंदु से प्रस्तुत किया
  rationale: לֵאמֹר अगले ईश्वरीय कथन का परिचय देता है। हिन्दी में इस छोटे सूत्र को ‘यह कहते हुए’ कहने के बजाय द्विबिंदु से व्यक्त करना अधिक सहज है और उसका कार्य सुरक्षित रहता है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: मूल में चार अक्षरों वाला व्यक्तिगत ईश्वरीय नाम है। ‘यहोवा’ हिन्दी पाठकों में स्थापित नाम-रूप है और ‘प्रभु’ जैसी उपाधि से मूल नाम को प्रतिस्थापित नहीं करता; वैकल्पिक विद्वत्तापूर्ण उच्चारण पादटिप्पणी में दिया गया है।
