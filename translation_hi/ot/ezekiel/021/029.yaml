source:
  edition: WLC
  text: לָ/כֵ֗ן כֹּֽה אָמַר֮ אֲדֹנָ֣/י יְהוִה֒ יַ֗עַן הַזְכַּרְ/כֶם֙ עֲוֺ֣נְ/כֶ֔ם בְּ/הִגָּל֣וֹת פִּשְׁעֵי/כֶ֗ם לְ/הֵֽרָאוֹת֙ חַטֹּ֣אותֵי/כֶ֔ם בְּ/כֹ֖ל עֲלִילֽוֹתֵי/כֶ֑ם יַ֚עַן הִזָּ֣כֶרְ/כֶ֔ם בַּ/כַּ֖ף תִּתָּפֵֽשׂוּ־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/021/029.yaml
  text: 'Therefore thus says the Lord GOD: Because you have brought your guilt to remembrance by uncovering your transgressions[a], so that your sins are seen in all your deeds, because you have come to remembrance[b], you will be seized by the hand.'
translation:
  language: hi
  text: 'इसलिए प्रभु यहोवा यों कहता है: क्योंकि तुमने अपने अपराध प्रकट करके अपने दोष को स्मरण में ला दिया है[a], ताकि तुम्हारे हर काम में तुम्हारे पाप दिखाई दें; क्योंकि तुम स्मरण में आए हो, इसलिए तुम हाथ में पकड़े जाओगे[b]।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तुमने अपना दोष स्मरण में ला दिया है।” इब्रानी में इस पद में ‘स्मरण’ से बने शब्द दोहराए गए हैं।
    reason: कारणवाचक रूप और शब्द-पुनरावृत्ति को स्पष्ट करना।
  - marker: b
    text: अर्थात तुम किसी की पकड़ में आकर बंदी बना लिए जाओगे।
    reason: ‘हाथ में पकड़े जाने’ के रूपक का आशय स्पष्ट करना।
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  choice: प्रभु यहोवा
  rationale: संयुक्त उपाधि में אֲדֹנָי को ‘प्रभु’ और वाचा के नाम יהוה को प्रचलित हिन्दी रूप ‘यहोवा’ से व्यक्त किया गया है।
- source_word: הַזְכַּרְכֶם עֲוֺנְכֶם
  choice: अपना दोष स्मरण करा दिया है
  rationale: זכר के हिफ़ील रूप का कारणवाचक भाव और עָוֹן का दोष/अपराध-बोध संबंधी अर्थ सुरक्षित रहता है।
- source_word: בְּהִגָּלוֹת פִּשְׁעֵיכֶם
  choice: अपने अपराधों को उजागर करके
  rationale: בְּ के साधनात्मक संबंध और גלה की प्रकट या अनावृत करने की छवि को स्वाभाविक हिन्दी में रखा गया है।
- source_word: לְהֵרָאוֹת חַטֹּאותֵיכֶם
  choice: जिससे ... तुम्हारे पाप दिखाई देते हैं
  rationale: निफ़अल के निष्क्रिय भाव और परिणामसूचक संबंध दोनों को व्यक्त करता है।
- source_word: בְּכֹל עֲלִילוֹתֵיכֶם
  choice: तुम्हारे सब कामों में
  rationale: עֲלִילוֹת व्यापक रूप से कर्मों या आचरण को दर्शाता है; ‘काम’ सामान्य पाठक के लिए सहज है।
- source_word: הִזָּכֶרְכֶם
  choice: तुम स्मरण में आ गए हो
  rationale: पहले प्रयुक्त זכר की पुनरावृत्ति और उसके अलंकारिक प्रभाव को सुनाई देने देता है, बिना यह स्पष्ट किए कि किसके स्मरण में।
- source_word: בַּכַּף תִּתָּפֵשׂוּ
  choice: हाथ में पकड़ लिए जाओगे
  rationale: हथेली/हाथ की मूल छवि और शत्रु की पकड़ में आ जाने के निष्क्रिय अर्थ दोनों को बनाए रखता है।
theological_decisions:
- issue: אֲדֹנָי יְהוִה में ईश्वरीय नाम का अनुवाद
  choice: प्रभु यहोवा
  alternative: प्रभु याहवे
  rationale: हिन्दी बाइबलीय प्रयोग में ‘यहोवा’ पहचाना जाने वाला नाम-रूप है और इसे सामान्य उपाधि से अलग रखता है।
- issue: הִזָּכֶרְכֶם में स्मरण करने वाला कौन है
  choice: कर्ता को अनिर्दिष्ट रखते हुए ‘तुम स्मरण में आ गए हो’
  alternative: परमेश्वर ने तुम्हें स्मरण किया है
  rationale: मूल पाठ स्मरण करने वाले को स्पष्ट नहीं करता; अनुवाद उस धर्मवैज्ञानिक निहितार्थ को अनावश्यक रूप से निश्चित नहीं करता।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य हिन्दी; न्याय की भविष्यवाणी का गंभीर स्वर रखा गया है। ‘स्मरण’ की जानबूझकर की गई पुनरावृत्ति मूल इब्रानी के शब्दालंकार को बचाती है।
