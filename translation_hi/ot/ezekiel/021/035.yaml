  text: הָשַׁ֖ב אֶל תַּעְרָ֑/הּ בִּ/מְק֧וֹם אֲשֶׁר נִבְרֵ֛את בְּ/אֶ֥רֶץ מְכֻרוֹתַ֖יִ/ךְ אֶשְׁפֹּ֥ט אֹתָֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/021/035.yaml
  text: Return to your sheath[a]. In the place where you were created, in the land of your origins[b], I will judge you.
translation:
  language: hi
  text: अपनी म्यान में लौट जा।[a] जिस स्थान पर तू रची गई थी, तेरे उद्गम के देश में, मैं तेरा न्याय करूँगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उसे उसकी म्यान में वापस रख।” इब्रानी में शाब्दिक रूप से “उसकी म्यान में लौट” है; तलवार को मानवीय रूप देकर संबोधित करने की समझ में मुख्य पाठ का “अपनी म्यान” स्वाभाविक है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הָשַׁב
  choice: लौट जा
  rationale: यह שוב का आज्ञार्थक रूप है और प्रसंग में मानवीकृत तलवार को संबोधित करता है। ‘लौट जा’ संक्षिप्त और स्वाभाविक है।
- source_word: תַּעְרָהּ
  choice: अपनी म्यान में
  rationale: תער का अर्थ ‘म्यान’ है। इब्रानी में प्रत्यय तीसरे पुरुष स्त्रीलिंग का है, पर प्रत्यक्ष संबोधन और तलवार के मानवीकरण को स्वाभाविक हिन्दी में रखने के लिए ‘अपनी म्यान’ चुना गया है।
- source_word: בִּמְקוֹם
  choice: जिस स्थान पर
  rationale: यह स्थानवाचक पद न्याय के स्थान को प्रस्तुत करता है और अगले संबंधवाचक उपवाक्य से सहज रूप में जुड़ता है।
- source_word: נִבְרֵאת
  choice: तू रची गई थी
  rationale: यह ברא का निफ़अल रूप है, जिसका सामान्य अर्थ ‘रचा/सृजा जाना’ है। तलवार के संदर्भ में ‘रची गई’ उसके बनाए जाने का भाव देते हुए मूल शब्दावली को बनाए रखता है।
- source_word: בְּאֶרֶץ מְכֻרוֹתַיִךְ
  choice: तेरी उत्पत्ति के देश में
  rationale: מכורות जन्म, उद्गम या उत्पत्ति को सूचित कर सकता है। ‘उत्पत्ति’ आधुनिक हिन्दी में स्वाभाविक है और तलवार अथवा उसके द्वारा सूचित सत्ता—दोनों के संदर्भ की गुंजाइश बनाए रखता है।
- source_word: אֶשְׁפֹּט אֹתָךְ
  choice: मैं तेरा न्याय करूँगा
  rationale: שפט के प्रथम पुरुष एकवचन रूप और प्रत्यक्ष कर्म का सीधा, न्यायिक अर्थ सुरक्षित रहता है।
theological_decisions:
- issue: स्त्रीलिंग संबोधित पात्र किसे सूचित करता है
  choice: तात्कालिक व्याकरणिक संबोधन मानवीकृत तलवार से है, जबकि न्याय उस जनता या सत्ता पर भी लागू हो सकता है जिसका वह प्रतिनिधित्व करती है।
  alternative: संबोधित पात्र सीधे अम्मोन राष्ट्र या उसके शासक को माना जाए।
  rationale: ‘म्यान’ और स्त्रीलिंग रूप तत्काल संदर्भ में तलवार के मानवीकरण का समर्थन करते हैं। रूपक को बनाए रखने से भविष्यद्वाणी की अंतर्निहित अर्थगत और धर्मवैचारिक तनाव को समय से पहले हल नहीं किया जाता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। तलवार के स्त्रीलिंग मानवीकरण के कारण ‘तू/तेरी’ का प्रयोग किया गया है; हिन्दी में ‘तलवार’ भी स्त्रीलिंग है। ‘वहीं’ निर्णय के स्थान पर मूल के बल को स्वाभाविक ढंग से स्पष्ट करता है।
