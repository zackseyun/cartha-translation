base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/021/032.yaml
  text: A ruin[a], a ruin, a ruin—I will make it. This also shall not be, until he comes whose right it is[b], and I will give it to him.
translation:
  language: hi
  text: खंडहर, खंडहर, खंडहर[a]—मैं इसे ऐसा कर दूँगा। यह भी न रहेगा, जब तक वह न आए जिसका इस पर न्यायोचित अधिकार है;[b] और मैं इसे उसी को दे दूँगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इसका अनुवाद ‘उलट-पलट, उलट-पलट, उलट-पलट—मैं इसे ऐसा कर दूँगा’ भी हो सकता है। इब्रानी में प्रबल बलाघात के लिए एक संज्ञा तीन बार दोहराई गई है।
    reason: lexical_alternative
  - marker: b
    text: ‘जिसका इस पर न्यायोचित अधिकार है’ का अनुवाद ‘जिसे न्याय करने का अधिकार है’ या ‘जिसे इसका वैधानिक अधिकार है’ भी हो सकता है। संभव है कि यहाँ उत्पत्ति 49:10 की ओर संकेत हो; इसलिए अनेक व्याख्याकार इसे मसीह से संबंधित मानते हैं।
    reason: alternative_reading
lexical_decisions:
- source_word: עַוָּה עַוָּה עַוָּה
  choice: खंडहर, खंडहर, खंडहर
  rationale: तीन बार दोहराई गई संज्ञा को संज्ञात्मक रूप और प्रबल अलंकार सहित रखा गया है। ‘खंडहर’ पूर्ण विनाश और उजड़ी दशा को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: אֲשִׂימֶנָּה
  choice: मैं इसे ऐसा कर दूँगा
  rationale: שׂים के ‘करना/बना देना’ भाव और स्त्रीलिंग प्रत्यय को ‘इसे’ से व्यक्त किया गया है; ‘ऐसा’ पहले घोषित उजड़ी दशा की ओर संकेत करता है, बिना किसी अस्पष्ट वस्तु को अनावश्यक रूप से निश्चित किए।
- source_word: גַּם זֹאת לֹא הָיָה
  choice: यह भी बना न रहेगा
  rationale: גַּם का योगात्मक बल ‘भी’ से और भविष्यसूचक परिणाम को स्वाभाविक हिन्दी ‘बना न रहेगा’ से व्यक्त किया गया है।
- source_word: עַד בֹּא
  choice: जब तक वह न आए
  rationale: कालवाचक सीमा और आगे के संबंधवाचक वाक्यांश से संकेतित व्यक्तिगत कर्ता, दोनों सुरक्षित हैं।
- source_word: אֲשֶׁר לוֹ הַמִּשְׁפָּט
  choice: जिसका इस पर न्यायोचित अधिकार है
  rationale: מִשְׁפָּט यहाँ न्याय, निर्णय अथवा वैधानिक दावे का अर्थ दे सकता है। उत्तराधिकार के प्रसंग में ‘न्यायोचित अधिकार’ अर्थ को स्पष्ट करता है, जबकि ‘इस पर’ उस निहित राजसत्ता की ओर संकेत करता है जिसे आगे दिया जाएगा।
- source_word: וּנְתַתִּיו
  choice: और मैं इसे उसी को दे दूँगा
  rationale: पुल्लिंग प्रत्यय उस आने वाले व्यक्ति को और निहित कर्म राजकीय अधिकार/शासन को सूचित करता है। ‘उसी को’ अधिकारधारी व्यक्ति पर मूल के बल को स्वाभाविक हिन्दी में रखता है।
theological_decisions:
- issue: ‘जिसका इस पर न्यायोचित अधिकार है’ का मसीही अथवा निकट ऐतिहासिक संदर्भ
  choice: मुख्य पाठ में आने वाले व्यक्ति की पहचान खुली रखी गई है।
  alternative: इसे स्पष्ट रूप से भावी दाऊदी मसीहा अथवा किसी निकट ऐतिहासिक वैध शासक के रूप में पहचानना।
  rationale: इब्रानी पाठ व्यक्ति का नाम नहीं बताता। भाषा उत्पत्ति 49:10 की प्रतिध्वनि और मसीही अर्थ की संभावना रख सकती है, पर अनुवाद में उस निष्कर्ष को अनिवार्य नहीं बनाया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गंभीर, भविष्यवाणी-सुलभ और सामान्य पाठक के लिए बोधगम्य शैली रखी गई है। त्रिक पुनरुक्ति और मूल की संदर्भगत अस्पष्टता सुरक्षित हैं; अत्यधिक संस्कृतनिष्ठ कानूनी भाषा से बचते हुए ‘न्यायोचित अधिकार’ चुना गया है।
