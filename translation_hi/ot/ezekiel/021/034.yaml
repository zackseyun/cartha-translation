  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: בַּ/חֲז֥וֹת לָ/ךְ֙ שָׁ֔וְא בִּ/קְסָם לָ֖/ךְ כָּזָ֑ב לָ/תֵ֣ת אוֹתָ֗/ךְ אֶֽל צַוְּארֵי֙ חַֽלְלֵ֣י רְשָׁעִ֔ים אֲשֶׁר בָּ֣א יוֹמָ֔/ם בְּ/עֵ֖ת עֲוֺ֥ן קֵֽץ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/021/034.yaml
  text: while they see false visions for you and divine lies for you[a], to place you on the necks of the slain wicked[c][b], whose day has come at the time of the punishment of the end.
translation:
  language: hi
  text: जब वे तेरे विषय में झूठे दर्शन देखते और झूठे शकुन करते हैं[a], तब तुझे मारे गए दुष्टों की गर्दनों पर रखा जाएगा[b]—उनकी, जिनका दिन अन्तिम दण्ड के समय आ पहुँचा है[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जब वे तेरे विषय में असत्य देखते और झूठे शकुन करते हैं।”
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “मारे गए दुष्टों की गर्दनों पर”; यह एक कठिन बिम्ब है। सम्भवतः आशय है कि तुझे भी पहले से मारे पड़े दुष्टों के बीच गिरा दिया जाए।
    reason: lexical_alternative
  - marker: c
    text: या, “अन्त के अधर्म के समय,” अथवा “अन्तिम दोष के समय।”
    reason: alternative_reading
lexical_decisions:
- source_word: בַּחֲזוֹת לָךְ שָׁוְא
  choice: जब वे तेरे लिए झूठे दर्शन देखते हैं
  rationale: ב के साथ infinitive construct को कालवाचक ‘जब’ से व्यक्त किया गया है। संदर्भ से कर्ता शकुन-विचार करने वाले हैं; שָׁוְא यहाँ दर्शनों की असत्यता बताता है।
- source_word: בִּקְסָם לָךְ כָּזָב
  choice: तेरे लिए झूठी शकुन-वाणी करते हैं
  rationale: קסם का अर्थ शकुन अथवा दैवी संकेतों के आधार पर भविष्य बताना है। ‘शकुन-वाणी’ आधुनिक हिन्दी में इस क्रिया को संक्षेप में व्यक्त करती है और כָּזָב को ‘झूठी’ बनाए रखती है।
- source_word: לָתֵת אוֹתָךְ
  choice: तुझे ... रखने को कहते हैं
  rationale: शाब्दिक अर्थ ‘तुझे रखना’ है। पिछले खंड के भविष्यवक्ताओं/शकुन-विचारकों से इसका उद्देश्य-संबंध हिन्दी में स्पष्ट करने के लिए ‘कहते हैं’ जोड़ा गया है, पर रखने की मूल क्रिया सुरक्षित है।
- source_word: אֶל צַוְּארֵי חַלְלֵי רְשָׁעִים
  choice: मारे गए दुष्टों की गर्दनों पर
  rationale: कठिन और अस्पष्ट ठोस बिम्ब को व्याख्यात्मक रूप से ‘उनके बीच गिराने’ में नहीं बदला गया; צַוְּארֵי का बहुवचन ‘गर्दनों’ और חַלְלֵי רְשָׁעִים का स्वाभाविक अर्थ ‘मारे गए दुष्ट’ रखा गया है।
- source_word: אֲשֶׁר בָּא יוֹמָם
  choice: जिनका दिन ... आ पहुँचा है
  rationale: न्याय के नियत दिन की भविष्यद्वक्तापूर्ण अभिव्यक्ति को स्पष्ट दिन-बिम्ब सहित रखा गया है।
- source_word: בְּעֵת עֲוֺן קֵץ
  choice: अंतिम दण्ड के समय
  rationale: עָוֺן दोष, अधर्म या उसके दण्ड को सूचित कर सकता है। न्याय के संदर्भ में परिणामसूचक ‘दण्ड’ स्वाभाविक है; קֵץ को ‘अंतिम’ से व्यक्त किया गया है, जबकि वैकल्पिक अर्थ पादटिप्पणी में सुरक्षित हैं।
theological_decisions:
- issue: न्याय-सूत्र में עֲוֺן का अर्थ
  choice: दण्ड
  alternative: अधर्म; दोष
  rationale: संदर्भ दुष्टों के न्याय-दिन के आने का है, इसलिए परिणामसूचक अर्थ ‘दण्ड’ उपयुक्त है। फिर भी मूल शब्द की नैतिक-दोष संबंधी बहुअर्थकता पादटिप्पणी में दी गई है।
- issue: ‘मारे गए दुष्टों की गर्दनों पर’ का कठिन बिम्ब
  choice: ठोस बिम्ब को मुख्य पाठ में बनाए रखना
  alternative: मारे गए दुष्टों के बीच तुझे गिरा देना; तुझे उन्हीं के साथ मार डालना
  rationale: इब्रानी बिम्ब अस्पष्ट है। उसे किसी एक व्याख्या में सीमित करने के बजाय मुख्य पाठ में सुरक्षित रखा गया और संभावित आशय पादटिप्पणी में बताया गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य रखी गई है। संबोधन का एकवचन निकट रूप ‘तेरे/तुझे’ तलवार के मानवीकरण और भविष्यद्वक्तापूर्ण तीव्रता को बनाए रखता है। कठिन गर्दन-बिम्ब को सरल बनाकर मिटाया नहीं गया है।
