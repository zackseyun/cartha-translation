- source_word: לֵאמֹר
  choice: निम्न प्रत्यक्ष वचन का परिचय देने वाला विराम-चिह्न
  rationale: यह infinitive construct आने वाले प्रत्यक्ष कथन का परिचय देता है। हिंदी में ‘यह कहते हुए’ की अपेक्षा कोलन अधिक सहज है और अर्थ को बनाए रखता है।
