translation:
  language: hi
  text: और तू, हे इस्राएल के दुष्ट प्रधान, जो घातक रूप से घायल है, जिसका दिन अंत के अधर्म के समय आ पहुँचा है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חָלָל
  choice: घात किया हुआ
  rationale: मृत्यु-दंड के इस भविष्यद्वाणी-संदर्भ में यह ‘बेधा हुआ/मारा गया’ व्यक्ति दर्शाता है। ‘घात किया हुआ’ न्याय की निश्चितता बनाए रखता है, जबकि वैकल्पिक अर्थ ‘अपवित्र’ को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: רָשָׁע
  choice: दुष्ट
  rationale: यहाँ शब्द संज्ञा के रूप में संबोधन में प्रयुक्त है; ‘दुष्ट’ स्वाभाविक हिन्दी में नैतिक दोष को सीधे व्यक्त करता है।
- source_word: נְשִׂיא יִשְׂרָאֵל
  choice: इस्राएल के प्रधान
  rationale: נָשִׂיא शासकीय प्रधान, अगुवा या राजकुमार को सूचित कर सकता है। ‘प्रधान’ पदवी की गरिमा रखता है और आधुनिक हिन्दी में स्पष्ट है।
- source_word: אֲשֶׁר בָּא יוֹמוֹ
  choice: जिसका दिन आ पहुँचा है
  rationale: यह नियुक्त न्याय-दिवस के आ जाने का हिब्रू बिंब सुरक्षित रखता है; ‘समय आ गया’ की अपेक्षा मूल के ‘दिन’ को बनाए रखता है।
- source_word: בְּעֵת עֲוֺן קֵץ
  choice: अंत के अधर्म के समय
  rationale: संक्षिप्त और कठिन हिब्रू पदबंध को अपेक्षाकृत औपचारिक रूप में रखा गया है। עָוֹן ‘अधर्म/दोष’ अथवा उसके दंड को सूचित कर सकता है; मुख्य पाठ ‘अधर्म’ रखकर वास्तविक अस्पष्टता को पादटिप्पणी में स्पष्ट करता है।
theological_decisions:
- issue: עֲוֺן का अर्थ—अधर्म या उसका दंड
  choice: मुख्य पाठ में ‘अधर्म’
  alternative: ‘अंत के दंड के समय’ अथवा ‘अंतिम दंड के समय’
  rationale: עָוֹן दोष और उसके फलस्वरूप दंड दोनों को व्यक्त कर सकता है। अधिक मूलनिष्ठ ‘अधर्म’ व्याख्यात्मक निर्णय को मुख्य पाठ में थोपने से बचाता है; न्याय-संदर्भ में दंड का अर्थ पादटिप्पणी में दिया गया है।
- issue: חָלָל का अर्थ
  choice: ‘घात किया हुआ’—न्याय के अधीन व्यक्ति को मानो पहले ही मारा हुआ संबोधित करना
  alternative: ‘अपवित्र’ या ‘प्राणघातक रूप से घायल’
  rationale: तलवार और मृत्यु के निकट संदर्भ में ‘घात किया हुआ’ सबसे संभावित है, पर शब्द के ‘अपवित्र’ अर्थ की प्राचीन व्याख्यात्मक संभावना को पादटिप्पणी में बनाए रखा गया है।
- issue: נָשִׂיא की पदवी
  choice: प्रधान
  alternative: राजकुमार या शासक
  rationale: यह शब्द राजनीतिक अगुवे की पदवी है। ‘प्रधान’ हिन्दी में पद का भाव देता है, बिना आधुनिक वंशानुगत ‘राजकुमार’ का अनावश्यक संकेत जोड़े।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण भविष्यद्वाणी-संबोधन अपनाया गया है। ‘हे’ और ‘तू’ तीखे प्रत्यक्ष संबोधन को व्यक्त करते हैं। वाक्य अगले पद की ओर जारी रहने के कारण अंत में अल्पविराम रखा गया है। सभी पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित हैं।
