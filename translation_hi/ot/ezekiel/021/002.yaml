  yaml_path: translation/ot/ezekiel/021/002.yaml
  text: Son of man[a], set your face toward the south, and preach toward the south[c][b], and prophesy against the forest of the field in the Negeb.
translation:
  language: hi
  text: हे मनुष्य के पुत्र,[a] अपना मुख दक्षिण की ओर कर, दक्षिण की ओर वचन सुना,[b] और नेगेव के खुले मैदान के वन के विरुद्ध भविष्यवाणी कर।[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इब्रानी में यहाँ दक्षिण से जुड़े तीन शब्द क्रम से आए हैं: ‘तेमान/दक्षिण,’ ‘दारोम/दक्षिण,’ और ‘नेगेव।’ यह पुनरावृत्ति दक्षिणी भूभाग पर इस वाणी के केंद्र को और तीव्र करती है।'
    reason: lexical_alternative
  - marker: b
    text: ‘वचन सुना’ के लिए प्रयुक्त इब्रानी क्रिया का शाब्दिक अर्थ ‘टपकाना’ या ‘बूँद-बूँद गिराना’ है; यह भविष्यसूचक वचन बोलने का रूपक है।
    reason: lexical_alternative
  - marker: c
    text: या, ‘दक्षिण के खुले मैदान के वन के विरुद्ध।’
    reason: alternative_reading
