- source_word: וְהַטֵּף
  choice: वचन सुना
  rationale: मूल क्रिया का शाब्दिक अर्थ ‘टपकाना’ है, पर भविष्यवाणी के संदर्भ में यह वचन उच्चारित करने का रूपक है। ‘वचन सुना’ अर्थ को स्पष्ट रखता है, जबकि पादटिप्पणी मूल रूपक बचाती है।
- source_word: אֶל דָּרוֹם
  choice: दक्षिण की ओर
  rationale: אֶל का सामान्य दिशात्मक अर्थ सुरक्षित रखा गया है। न्यायसूचक संदर्भ के कारण ‘विरुद्ध’ संभव है, पर इस खंड में उसे स्पष्ट कर देना मूल की संभावित अस्पष्टता घटाता।
- source_word: וְהִנָּבֵא
  choice: भविष्यवाणी कर
  rationale: नबी को दिए गए आदेश में נבא का मानक और स्वाभाविक हिन्दी अनुवाद।
- source_word: אֶל יַעַר הַשָּׂדֶה נֶגֶב
  choice: नेगेव के खुले मैदान के वन के विरुद्ध
  rationale: असामान्य इब्रानी चित्र ‘मैदान का वन’ सुरक्षित है; שׂדה के खुले भूभाग के भाव को ‘खुले मैदान’ से व्यक्त किया गया है। न्याय की भविष्यवाणी के संदर्भ में אֶל को यहाँ स्वाभाविक रूप से ‘के विरुद्ध’ कहा गया है।
- source_word: נֶגֶב
  choice: नेगेव
  rationale: पहले आए दो दिशासूचक दक्षिण-शब्दों से भेद रखते हुए इसे विशिष्ट दक्षिणी क्षेत्र के नाम के रूप में लिप्यंतरित किया गया है।
