id: EZK.21.5
reference: Ezekiel 21:5
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וָ/אֹמַ֕ר אֲהָ֖הּ אֲדֹנָ֣/י יְהוִ֑ה הֵ֚מָּה אֹמְרִ֣ים לִ֔/י הֲ/לֹ֛א מְמַשֵּׁ֥ל מְשָׁלִ֖ים הֽוּא׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/021/005.yaml
  text: Then I said[a], “Ah, Lord GOD! They are saying of me[b], ‘Is he not a speaker of parables?’”
translation:
  language: hi
  text: तब मैंने कहा[a], “हाय, प्रभु याहवे! वे मेरे बारे में कहते हैं, ‘क्या वह दृष्टान्त कहने वाला नहीं है?’[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इसे इस प्रकार भी समझा जा सकता है: “वे मुझसे कहते हैं, ‘क्या वह दृष्टान्त नहीं कहता?’” इब्रानी वाक्यांश का अर्थ यह हो सकता है कि लोग यहेजकेल से ऐसा कहते हैं, या उसके बारे में ऐसा कहते हैं।'
    reason: alternative_reading
  - marker: b
    text: इब्रानी में एक ही शब्द-मूल की क्रिया और संज्ञा साथ आई हैं; इसका शाब्दिक भाव है, “दृष्टान्तों/कहावतों को कहने वाला।” इसमें लाक्षणिक, गूढ़ या पहेली-जैसी वाणी का संकेत भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֹמַר
  choice: तब मैंने कहा
  rationale: वाव-क्रम के साथ प्रथम पुरुष क्रिया कथा को आगे बढ़ाती है; ‘तब मैंने कहा’ स्वाभाविक हिन्दी में क्रम को स्पष्ट रखता है।
- source_word: אֲהָהּ
  choice: हाय
  rationale: यह दुःख, व्यथा या व्याकुलता की पुकार है; ‘हाय’ आधुनिक हिन्दी में संक्षिप्त और उपयुक्त है।
- source_word: אֲדֹנָי יְהוִה
  choice: प्रभु याहवे
  rationale: ‘अदोनाय’ को ‘प्रभु’ और परमेश्वर के व्यक्तिगत नाम יהוה को ध्वन्यात्मक रूप से ‘याहवे’ किया गया है, जिससे संयुक्त उपाधि और नाम दोनों बने रहते हैं।
- source_word: הֵמָּה אֹמְרִים לִי
  choice: वे मेरे बारे में कहते हैं
  rationale: לִי का सामान्य अर्थ ‘मुझसे’ है, पर प्रसंग में लोग यहेजकेल का वर्णन कर रहे हैं; इसलिए मुख्य पाठ में ‘मेरे बारे में’ स्वाभाविक है। सम्भव वैकल्पिक अर्थ पादटिप्पणी में सुरक्षित है।
- source_word: הֲלֹא
  choice: क्या ... नहीं है?
  rationale: यह सहमति की अपेक्षा रखने वाला आलंकारिक प्रश्न है; हिन्दी की नकारात्मक प्रश्न-रचना उसी बल को बनाए रखती है।
- source_word: מְמַשֵּׁל מְשָׁלִים
  choice: दृष्टान्त कहने वाला
  rationale: एक ही मूल से बनी क्रिया और संज्ञा ऐसी उक्तियाँ बोलने की आदत या पहचान प्रकट करती हैं। ‘दृष्टान्त कहने वाला’ मुहावरे को निकटता से रखता है, जबकि पहेली या रूपक जैसे किसी एक अर्थ तक सीमित नहीं करता।
- source_word: הוּא
  choice: वह
  rationale: उद्धृत कथन में यह सर्वनाम यहेजकेल की ओर संकेत करता है।
theological_decisions:
- issue: संयुक्त ईश्वरीय संबोधन אֲדֹנָי יְהוִה का अनुवाद
  choice: प्रभु याहवे
  alternative: प्रभु परमेश्वर / प्रभु यहोवा
  rationale: मूल पाठ में सामान्य प्रभुत्व-सूचक संबोधन के साथ व्यक्तिगत ईश्वरीय नाम है। ‘प्रभु याहवे’ दोनों तत्वों को अलग और प्रत्यक्ष रखता है, बिना पद में निहित अर्थ को किसी सम्प्रदायगत व्याख्या से विस्तृत किए।
- issue: लोग यहेजकेल से कहते हैं या उसके बारे में
  choice: मुख्य पाठ में ‘मेरे बारे में कहते हैं’
  alternative: ‘मुझसे कहते हैं’
  rationale: לִי व्याकरणतः दोनों प्रसंगगत दिशाओं की अनुमति देता है। लोगों द्वारा नबी को ‘दृष्टान्त कहने वाला’ ठहराने के प्रसंग में ‘मेरे बारे में’ चुना गया है, पर दूसरी सम्भावना पादटिप्पणी में स्पष्ट रखी गई है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में रखी गई है, पर भविष्यद्वाणी के प्रसंग के अनुरूप गरिमापूर्ण है। ‘हाय’ भावात्मक पुकार को स्वाभाविक रखता है और ‘दृष्टान्त कहने वाला’ मूल इब्रानी मुहावरे की पुनरुक्ति तथा लोगों के उपेक्षापूर्ण स्वर—दोनों को यथासम्भव बनाए रखता है।
