theological_decisions:
- issue: न्याय-सन्देश की अत्यन्त कठिन अन्तिम पंक्ति
  choice: 'मसोरेटिक पाठ के निकट रूप को बनाए रखा: ‘मेरे पुत्र का राजदण्ड हर पेड़ को तुच्छ जानता है।’'
