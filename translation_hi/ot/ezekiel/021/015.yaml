base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/021/015.yaml
  text: So that it may slaughter a slaughter[a], it is sharpened; so that it may have a flash, it is polished[b]. Or shall we rejoice? The scepter of my son despises every tree.
translation:
  language: hi
  text: इसलिए कि वह घोर संहार करे[a], वह तेज़ की गई है; इसलिए कि उसमें चमक हो, वह माँजी गई है[b]। या क्या हम आनन्द मनाएँ? मेरे पुत्र का राजदण्ड हर पेड़ को तुच्छ जानता है[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इब्रानी में एक ही मूल के क्रिया और संज्ञा रूप साथ रखकर संहार की तीव्रता पर बल दिया गया है; अधिक शब्दशः: “संहार का संहार करे।”'
    reason: source_idiom
  - marker: b
    text: या “उसमें बिजली हो” अथवा “वह चमके”; इब्रानी अभिव्यक्ति अण्डाकार है और माँजी हुई तलवार की तेज़ चमक का वर्णन करती है।
    reason: lexical_alternative
  - marker: c
    text: अन्तिम पंक्ति इब्रानी में कठिन है। “मेरे पुत्र” मसोरेटिक पाठ के अनुसार है; कुछ इसे यहूदा या मेरी प्रजा के व्यापक अर्थ में लेते हैं, और “हर पेड़” का आशय हर लकड़ी का दण्ड या हथियार हो सकता है।
    reason: textual_ambiguity
