  rationale: पाठ और वाक्य-विन्यास अनिश्चित हैं और कोई सिद्धान्तगत प्रश्न निर्णायक नहीं है; इसलिए मुख्य पाठ में अस्पष्टता को व्याख्यात्मक परिभाषा से समाप्त नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमामय, सार्वजनिक पाठ के योग्य स्तर रखा गया है। तलवार के लिए स्त्रीलिंग सर्वनाम और क्रियारूप प्रयुक्त हैं। कठिन अन्तिम वाक्य को जानबूझकर अपेक्षाकृत औपचारिक और अस्पष्ट रखा गया है।
