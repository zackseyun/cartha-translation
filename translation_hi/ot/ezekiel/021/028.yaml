  yaml_path: translation/ot/ezekiel/021/028.yaml
  text: And it will be to them like a false divination in their eyes; they have sworn sworn oaths to them[a], but he brings guilt to remembrance, so that they may be captured.
translation:
  language: hi
  text: और यह उनकी दृष्टि में झूठे शकुन-विचार के समान होगा; उनके लिए शपथों पर शपथें खाई गई हैं[a]। परन्तु वह अपराध को स्मरण में लाता है, ताकि वे पकड़ लिए जाएँ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी पदबंध अत्यन्त संक्षिप्त और कठिन है; इसका शाब्दिक भाव लगभग ‘उनके लिए शपथ-खाई हुई शपथें’ अथवा ‘उनके लिए शपथों पर शपथें’ है। इसका अर्थ ‘उनसे खाई गई गंभीर शपथें’ भी समझा गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: और यह…ठहरेगा
  rationale: भविष्यसूचक प्रसंग में संयोजक सहित पूर्ण क्रिया परिणाम अथवा भविष्य का भाव देती है; ‘ठहरेगा’ उनके आकलन को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: כקסום שוא
  choice: झूठा शकुन-विचार
  rationale: קסום शकुन अथवा संकेत के आधार पर भविष्य जानने की क्रिया है, और שוא उसके झूठे या निष्फल होने का भाव जोड़ता है। ‘शकुन-विचार’ सामान्य पाठक के लिए बोधगम्य है और प्रसंग की क्रिया को बनाए रखता है।
- source_word: בְּעֵינֵיהֶם
  choice: उनकी दृष्टि में
  rationale: इब्रानी मुहावरे ‘उनकी आँखों में’ का स्वाभाविक हिन्दी रूप, जो उनके निजी आकलन को दर्शाता है।
- source_word: שְׁבֻעֵי שְׁבֻעוֹת לָהֶם
  choice: उनके लिए शपथों पर शपथें खाई गई हैं[a]
  rationale: कठिन और संक्षिप्त पदबंध में शपथ की पुनरुक्ति तथा להם का संबंध यथासंभव सुरक्षित रखा गया है। अस्पष्टता को मुख्य पाठ में अनावश्यक रूप से नहीं सुलझाया गया।
- source_word: וְהוּא
  choice: परन्तु वह
  rationale: सर्वनाम पूर्व प्रसंग के बाबुल के राजा की ओर संकेत करता है; ‘परन्तु’ उनके आकलन और उसके प्रभावी कदम के बीच विरोध को स्पष्ट करता है।
- source_word: מַזְכִּיר עָוֹן
  choice: दोष को स्मरण कराता है
  rationale: הזכיר का कारणवाचक अर्थ ‘स्मरण कराना’ है; עון यहाँ अपराध से उत्पन्न दोष को व्यक्त कर सकता है। अभिव्यक्ति की न्यायिक गंभीरता सुरक्षित रहती है।
- source_word: לְהִתָּפֵשׂ
  choice: ताकि वे पकड़ लिए जाएँ
  rationale: निफ़अल infinitive उद्देश्य अथवा परिणाम व्यक्त करता है; सैन्य प्रसंग में ‘पकड़ लिए जाएँ’ उपयुक्त है।
