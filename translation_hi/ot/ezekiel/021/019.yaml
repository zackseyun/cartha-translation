  yaml_path: translation/ot/ezekiel/021/019.yaml
  text: And you[a], son of man, prophesy and strike palm to palm, and let the sword be doubled a third time—the sword of the slain. It is the sword of the great slain one[c][b], the one that presses in on them.
translation:
  language: hi
  text: और हे मनुष्य के पुत्र, तू भविष्यवाणी कर और हथेली पर हथेली मार[a]। तलवार तीसरी बार दुगुनी हो जाए[b]—वह मारे हुओं की तलवार है; वह उस बड़े मारे गए व्यक्ति की तलवार है, जो उन पर दबाव डालते हुए बढ़ती आती है[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “दोनों हाथों से ताली बजा।” इब्रानी में शाब्दिक अर्थ “हथेली पर हथेली मार” है; यह एक भविष्यसूचक सांकेतिक क्रिया है।
    reason: lexical_alternative
  - marker: b
    text: या “तिगुनी हो जाए।” इब्रानी अभिव्यक्ति तलवार के तीसरी बार तीव्र होने या उसके तीन गुना होने का संकेत दे सकती है।
    reason: lexical_alternative
  - marker: c
    text: या “जो उन पर धँसती है” अथवा “जो उन्हें घेर लेती है।” इब्रानी कृदंत भीतर प्रवेश करने, उन पर दबाव डालते हुए बढ़ने, या चारों ओर से आ घेरने का भाव दे सकता है।
    reason: lexical_alternative
