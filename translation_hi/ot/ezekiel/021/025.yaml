  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: דֶּ֣רֶךְ תָּשִׂ֔ים לָ/ב֣וֹא חֶ֔רֶב אֵ֖ת רַבַּ֣ת בְּנֵֽי עַמּ֑וֹן וְ/אֶת יְהוּדָ֥ה בִ/ירוּשָׁלִַ֖ם בְּצוּרָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/021/025.yaml
  text: You shall set a road for the sword to come to Rabbah of the Ammonites[b][a], and to Judah in fortified Jerusalem.
translation:
  language: hi
  text: तुम तलवार के आने के लिए एक रास्ता ठहराओ—अम्मोनियों के रब्बा[b] की ओर और यरूशलेम में, किलेबंद यहूदा की ओर[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अम्मोनियों के रब्बा के विरुद्ध और यरूशलेम में, किलेबंद यहूदा के विरुद्ध।” इब्रानी रचना को इन स्थानों की ओर बढ़ने या उन पर शत्रुतापूर्वक चढ़ाई करने के अर्थ में समझा जा सकता है।
    reason: alternative_reading
  - marker: b
    text: रब्बा अम्मोनियों का प्रमुख नगर था।
    reason: cultural_note
lexical_decisions:
- source_word: דֶּרֶךְ
  choice: एक मार्ग
  rationale: यह संज्ञा मार्ग या रास्ते को दर्शाती है। सैन्य चढ़ाई के लिए चिह्नित किए जाने वाले मार्ग के अर्थ में ‘मार्ग’ स्वाभाविक और गरिमापूर्ण है।
- source_word: תָּשִׂים
  choice: निर्धारित करो
  rationale: שׂים का मूल अर्थ ‘रखना/ठहराना’ है। प्रसंग में भविष्यद्वक्ता को आक्रमण का मार्ग तय या चिह्नित करना है; ‘निर्धारित करो’ इस निर्देश को आधुनिक हिन्दी में स्पष्ट रखता है।
- source_word: לָבוֹא
  choice: आने के लिए
  rationale: בוא का यह क्रियार्थक रूप मार्ग निर्धारित करने का उद्देश्य बताता है—ताकि तलवार उस मार्ग से आए।
- source_word: חֶרֶב
  choice: तलवार
  rationale: भविष्यवाणी के युद्ध-चित्र में तलवार आक्रमण और न्याय की परिचित प्रतिनिधि है; हिन्दी में बिना अनावश्यक निश्चयवाचक पद के यही स्वाभाविक है।
- source_word: אֵת רַבַּת בְּנֵי עַמּוֹן
  choice: अम्मोनियों के रब्बा की ओर
  rationale: रब्बा अम्मोनियों के प्रमुख नगर का नाम है। אֵת यहाँ तलवार की चढ़ाई के लक्ष्य/गंतव्य को सूचित करता है; ‘की ओर’ गति को व्यक्त करते हुए शत्रुतापूर्ण प्रसंग को खुला रखता है।
- source_word: וְאֶת יְהוּדָה
  choice: और ... यहूदा की ओर
  rationale: यह रब्बा के समानांतर तलवार का दूसरा लक्ष्य है। ‘की ओर’ मूल के गंतव्य और लक्ष्य—दोनों संभावित बलों को बनाए रखता है।
- source_word: בִירוּשָׁלַם בְּצוּרָה
  choice: किलेबंद यरूशलेम में
  rationale: ב स्थान को और בְּצוּרָה यरूशलेम के किलेबंद होने को बताता है। यह शब्दक्रम यहूदा को किलेबंद यरूशलेम में स्थित लक्ष्य के रूप में प्रस्तुत करता है।
theological_decisions:
- issue: ‘तलवार के आने’ के बाद אֵת से चिह्नित स्थानों का वाक्यगत बल
  choice: रब्बा और किलेबंद यरूशलेम में यहूदा—दोनों को तलवार की चढ़ाई के समानांतर गंतव्य/लक्ष्य माना गया है।
  alternative: ‘की ओर’ के बजाय ‘के विरुद्ध’ कहकर शत्रुतापूर्ण लक्ष्य को स्पष्ट किया जा सकता है; अथवा रब्बा को मुख्य गंतव्य और यहूदा को गौण पद माना जा सकता है।
  rationale: निकटवर्ती प्रसंग में बाबेल की तलवार के लिए दो मार्ग निर्धारित किए जाते हैं। समानांतर अनुवाद मूल वाक्यरचना को सबसे अच्छी तरह दर्शाता है और ‘गंतव्य’ तथा ‘आक्रमण के लक्ष्य’ के बीच के तनाव को अनावश्यक रूप से समाप्त नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और प्रत्यक्ष आज्ञार्थक शैली रखी गई है। ‘तुम’ एकवचन संबोधन को सहज आधुनिक रूप देता है। ‘मार्ग निर्धारित करो’ मूल के ‘रखो/ठहराओ’ को प्रसंगानुकूल बनाता है, जबकि पादटिप्पणी ‘की ओर’ और ‘के विरुद्ध’ के बीच वास्तविक वाक्यगत अस्पष्टता सुरक्षित रखती है।
