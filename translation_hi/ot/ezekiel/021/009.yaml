  text: יַ֛עַן אֲשֶׁר הִכְרַ֥תִּי מִמֵּ֖/ךְ צַדִּ֣יק וְ/רָשָׁ֑ע לָ֠/כֵן תֵּצֵ֨א חַרְבִּ֧/י מִ/תַּעְרָ֛/הּ אֶל כָּל בָּשָׂ֖ר מִ/נֶּ֥גֶב צָפֽוֹן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/021/009.yaml
  text: Because I will cut off from you both the righteous and the wicked[b][a], therefore my sword will go out from its sheath against all flesh from south to north.
translation:
  language: hi
  text: क्योंकि मैं तुझमें से धर्मी और दुष्ट—दोनों को काट डालूँगा[a], इसलिए मेरी तलवार अपनी म्यान से निकलकर दक्षिण से उत्तर तक सब मनुष्यों[b] के विरुद्ध चलेगी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “काट डाला है।” इब्रानी में यह क्रिया पूर्ण रूप में है, जिसे भविष्यसूचक प्रसंग में निश्चित भावी कार्य या पूर्ण हो चुके कार्य के रूप में समझा जा सकता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से “सब मांस”; यह नश्वर मनुष्यों के लिए प्रयुक्त एक सामान्य इब्रानी अभिव्यक्ति है।
    reason: lexical_alternative
lexical_decisions:
- source_word: יַעַן אֲשֶׁר
  choice: क्योंकि
  rationale: यह संयुक्त पद आने वाले न्याय का कारण बताता है; ‘क्योंकि’ आधुनिक हिन्दी में स्वाभाविक और स्पष्ट है।
- source_word: הִכְרַתִּי
  choice: मैं ... काट डालूँगा
  rationale: כרת के ‘काट देना/उच्छेद करना’ भाव और न्याय की ठोस छवि को बनाए रखा गया है। रूप पूर्णकालिक है, पर भविष्यसूचक संदर्भ में निश्चित भावी कार्य व्यक्त कर सकता है।
- source_word: מִמֵּךְ
  choice: तुझमें से
  rationale: स्त्रीलिंग एकवचन में सम्बोधित देश/भूमि की ओर संकेत है। ‘तुझमें से’ स्रोत के सम्बन्ध को सीधे और स्वाभाविक रूप से व्यक्त करता है।
- source_word: צַדִּיק וְרָשָׁע
  choice: धर्मी और दुष्ट—दोनों को
  rationale: यह विरोधी युग्म न्याय की भेदरहित व्यापकता दिखाता है। ‘दोनों’ हिन्दी में वितरणात्मक बल स्पष्ट करता है।
- source_word: לָכֵן
  choice: इसलिए
  rationale: पहले कथन से निकलने वाले परिणाम को आधुनिक, स्पष्ट हिन्दी में दर्शाता है।
- source_word: תֵּצֵא חַרְבִּי
  choice: मेरी तलवार ... निकलकर ... चलेगी
  rationale: तलवार के बाहर निकलने की सजीव छवि सुरक्षित है; ‘चलेगी’ उसके विरोध में बढ़ने को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: מִתַּעְרָהּ
  choice: अपनी म्यान से
  rationale: स्त्रीलिंग प्रत्यय तलवार की ओर लौटता है; हिन्दी में ‘अपनी म्यान’ स्पष्ट और सहज है।
- source_word: אֶל כָּל בָּשָׂר
  choice: सब प्राणियों के विरुद्ध
  rationale: शाब्दिक ‘सब मांस’ हिन्दी में भ्रामक हो सकता है। ‘सब प्राणी’ नश्वर मनुष्यों के सामूहिक अर्थ को पाठ में पठनीय ढंग से रखता है, और पादटिप्पणी मूल मुहावरा बताती है।
- source_word: מִנֶּגֶב צָפוֹן
  choice: दक्षिण से उत्तर तक
  rationale: भूमि के एक छोर से दूसरे छोर तक सम्पूर्ण भौगोलिक विस्तार का भाव स्पष्ट है; यहाँ נגב को दिशा के रूप में लेना प्रसंगानुकूल है।
theological_decisions:
- issue: न्याय के दायरे में ‘धर्मी और दुष्ट’ दोनों
  choice: पाठ में स्पष्ट रूप से रखा गया है कि आने वाली तलवार धर्मी और दुष्ट दोनों को प्रभावित करेगी।
  alternative: ‘धर्मी’ को केवल दिखावटी धर्मी मानना, अथवा पद में ही इस न्याय को केवल सांसारिक दण्ड तक सीमित कर देना।
  rationale: इब्रानी कथन ऐतिहासिक न्याय के तात्कालिक प्रभाव में कोई भेद व्यक्त नहीं करता। अनुवाद इस धर्मवैचारिक तनाव को किसी अतिरिक्त व्याख्या से हल नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। देश/भूमि को स्त्रीलिंग एकवचन में सम्बोधन बनाए रखने हेतु ‘तुझमें से’ चुना गया है। वाक्य में कारण और परिणाम का औपचारिक सम्बन्ध सुरक्षित है।
