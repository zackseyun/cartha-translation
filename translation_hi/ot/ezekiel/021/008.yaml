source:
  edition: WLC
  text: וְ/אָמַרְתָּ֞ לְ/אַדְמַ֣ת יִשְׂרָאֵ֗ל כֹּ֚ה אָמַ֣ר יְהוָ֔ה הִנְ/נִ֣י אֵלַ֔יִ/ךְ וְ/הוֹצֵאתִ֥י חַרְבִּ֖/י מִ/תַּעְרָ֑/הּ וְ/הִכְרַתִּ֥י מִמֵּ֖/ךְ צַדִּ֥יק וְ/רָשָֽׁע׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/021/008.yaml
  text: 'And say to the land of Israel[a], ‘Thus says Yahweh: Behold, I am against you, and I will draw my sword from its sheath and cut off from you both righteous and wicked.’'
translation:
  language: hi
  text: 'और इस्राएल की भूमि से कह, ‘याहवे यों कहता है: देख, मैं तेरे विरुद्ध हूँ। मैं अपनी तलवार उसकी म्यान से निकालूँगा और तुझमें से धर्मी और दुष्ट दोनों को काट डालूँगा[a]।’'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “धर्मी और दुष्ट को।” इब्रानी में दोनों वर्गों का स्पष्ट उल्लेख है; “दोनों” उनके समावेशी विस्तार को हिन्दी में स्पष्ट करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אַדְמַת יִשְׂרָאֵל
  choice: इस्राएल की भूमि
  rationale: אַדְמָה का मूल अर्थ भूमि या मिट्टी है; यहाँ भविष्यद्वाणी में देश को मानवीकृत करके संबोधित किया गया है, इसलिए ‘इस्राएल की भूमि’ स्वाभाविक और सटीक है।
- source_word: יְהוָה
  choice: याहवे
  rationale: चतुरक्षरीय व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय आधुनिक हिन्दी में उसके प्रचलित लिप्यंतरण से व्यक्त किया गया है।
- source_word: הִנְנִי אֵלַיִךְ
  choice: देख, मैं तेरे विरुद्ध हूँ
  rationale: הִנְנִי की ध्यान आकर्षित करने वाली और बलाघाती शक्ति को ‘देख’ रखता है, जबकि אֵלַיִךְ इस प्रसंग में विरोध दर्शाता है। भूमि को इब्रानी में स्त्रीलिंग एकवचन संबोधन किया गया है; हिन्दी में ‘तेरे’ उसी प्रत्यक्ष संबोधन को बनाए रखता है।
- source_word: וְהוֹצֵאתִי חַרְבִּי מִתַּעְרָהּ
  choice: मैं अपनी तलवार उसकी म्यान से निकालूँगा
  rationale: क्रिया का शाब्दिक भाव ‘बाहर निकालना’ है; तलवार और म्यान के साथ ‘म्यान से निकालना’ आधुनिक हिन्दी का स्वाभाविक प्रयोग है।
- source_word: וְהִכְרַתִּי מִמֵּךְ
  choice: और तुझमें से ... काट डालूँगा
  rationale: हिफ़ील כרת का ठोस अर्थ ‘काट देना/काट डालना’ है। यह न्याय की तीव्र छवि को सामान्य ‘नष्ट करना’ की अपेक्षा अधिक निकटता से सुरक्षित रखता है।
- source_word: צַדִּיק וְרָשָׁע
  choice: धर्मी और दुष्ट दोनों
  rationale: इब्रानी दोनों वर्गों का स्पष्ट नाम लेती है। हिन्दी में ‘दोनों’ जोड़ने से युग्म का व्यापक आशय स्वाभाविक रूप से प्रकट होता है, बिना उसके तनाव को कम किए।
theological_decisions:
- issue: घोषित न्याय में धर्मी और दुष्ट का समावेश
  choice: वचन को उसके स्पष्ट और कठोर रूप में रखा गया है कि आने वाली तलवार भूमि के धर्मी और दुष्ट दोनों को प्रभावित करेगी।
  alternative: इसे केवल सामूहिक या आलंकारिक कथन मानकर व्यक्तिगत न्याय के विषय में इसकी कठिनाई को अनुवाद में नरम किया जा सकता था।
  rationale: यह पद स्वयं इस तनाव की व्याख्या नहीं करता। इसलिए अनुवाद व्यापक बाइबलीय न्यायशास्त्र के आधार पर यहाँ कोई समाधान आरोपित नहीं करता, बल्कि दोनों वर्गों को स्पष्ट रूप से बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और मौखिक पाठ के लिए सहज रखी गई है। ‘यों कहता है’ भविष्यद्वाणी की औपचारिक उद्घोषणा का स्वर बनाए रखता है; ‘देख’ संक्षिप्त होते हुए भी मूल के बलाघात को व्यक्त करता है।
