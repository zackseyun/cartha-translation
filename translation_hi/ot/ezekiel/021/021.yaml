  text: Gather yourself[a]; go to the right; set yourself to the left[c][b], wherever your face is appointed.
translation:
  language: hi
  text: अपने को समेट ले[a]; दाहिनी ओर जा; बाईं ओर मुड़—जिधर तेरा मुख[b] नियत किया गया है[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘अपने को एक कर,’ ‘अपने को सँभाल,’ अथवा प्रसंग में ‘एक जगह इकट्ठी हो।’ इब्रानी क्रिया दुर्लभ और आत्मवाचक है; संभवतः वार करने से पहले एकत्र या केंद्रित होने का भाव है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से ‘तेरा मुख’; इब्रानी में यह उस दिशा को भी सूचित कर सकता है जिस ओर कोई मुँह किए हो।
