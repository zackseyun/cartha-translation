    reason: alternative_reading
lexical_decisions:
- source_word: הִתְאַחֲדִי
  choice: अपने को समेट ले
  rationale: यह दुर्लभ आत्मवाचक स्त्रीलिंग एकवचन आज्ञार्थक रूप है। युद्ध-संदर्भ में यह वार करने से पहले अपने को एकत्र या केंद्रित करने का भाव देता है; ‘अपने को समेट ले’ आत्मवाचकता और संक्षिप्त आदेशात्मक लहजा दोनों बनाए रखता है।
- source_word: הֵימִנִי
  choice: दाहिनी ओर जा
  rationale: ‘दाहिनी ओर’ से बना आज्ञार्थक दिशासूचक रूप है। यह चयन आधुनिक हिन्दी में स्वाभाविक रहते हुए दिशा और आदेश दोनों को स्पष्ट रखता है।
- source_word: הָשִׂימִי הַשְׂמִילִי
  choice: अपने को बाईं ओर लगा
  rationale: שׂים के ‘रखना/लगाना’ भाव और ‘बाईं ओर’ के दिशासूचक रूप को साथ व्यक्त करता है। ‘लगा’ तलवार के मानवीकरण और तीखे सैनिक आदेश के अनुकूल है।
- source_word: אָנָה
  choice: जिधर
  rationale: यह गंतव्य या दिशा बताने वाला पद है। इस वाक्य में ‘जिधर’ आधुनिक हिन्दी में सहज रूप से अगले उपवाक्य को जोड़ता है।
- source_word: פָּנַיִךְ
  choice: तेरा मुख
  rationale: मूल चित्र को अक्षुण्ण रखा गया है। प्रसंग में ‘मुख’ उस दिशा को भी सूचित कर सकता है जिस ओर संबोधित तलवार उन्मुख है।
- source_word: מֻעָדוֹת
  choice: ठहराया गया हो
  rationale: יעד से बना निष्क्रिय रूप किसी दिशा या लक्ष्य के नियत, निर्धारित या निर्देशित होने का भाव देता है। ‘ठहराया गया हो’ निष्क्रियता और जानबूझकर नियत किए जाने की अस्पष्टता को बनाए रखता है।
theological_decisions:
- issue: मानवीकृत संबोधन और युद्ध-संबंधी बिंब
  choice: आज्ञाएँ प्रसंग में मानवीकृत तलवार को संबोधित हैं, पर पद में ‘हे तलवार’ नहीं जोड़ा गया।
  alternative: पाठ में स्पष्ट रूप से ‘हे तलवार’ जोड़ना, अथवा आदेशों को सेना के लिए मानना।
  rationale: इब्रानी में लगातार स्त्रीलिंग एकवचन आज्ञार्थक रूप हैं और निकटवर्ती प्रसंग तलवार का मानवीकरण करता है। संबोधन जोड़ना अर्थ स्पष्ट करता, पर इस पद में अनुपस्थित शब्द भी जोड़ देता; इसलिए मूल की आकस्मिकता और प्रसंगगत पहचान सुरक्षित रखी गई है।
translation_notes:
  register: भाषा आधुनिक, संक्षिप्त और गरिमापूर्ण रखी गई है। एकवचन अनौपचारिक आज्ञार्थक ‘ले/जा/लगा’ मूल के तीखे, सीधे आदेशों और मानवीकृत तलवार के संबोधन को व्यक्त करता है; ‘आप’ या आदरसूचक रूप यहाँ अनुपयुक्त होते।
