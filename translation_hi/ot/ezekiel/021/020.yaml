  text: so that the heart may melt and the stumbling blocks may be many[a]. At all their gates I have set the flash of the sword. Ah! It is made for lightning[b], drawn for slaughter.
translation:
  language: hi
  text: ताकि हृदय पिघल जाए और ठोकरें बहुत हों।[a] उनके सभी फाटकों पर मैंने तलवार की चमक को रख दिया है। आह! वह बिजली की तरह चमकने के लिए बनाई गई है,[b] वध के लिए खींची गई है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “और बहुत-से लोग ठोकर खाकर गिरें।” इब्रानी संज्ञा ठोकरों अथवा उनके परिणामस्वरूप होने वाले पतन—दोनों की ओर संकेत कर सकती है।
    reason: lexical_alternative
  - marker: b
    text: इस पद के अंतिम वाक्यांश का इब्रानी पाठ कठिन है। “वध के लिए खींची गई” का अनुवाद “वध के लिए तेज की गई” या “वध के लिए चमकाई गई” भी हो सकता है।
    reason: lexical_alternative
