- source_word: עֲשׂוּיָה לְבָרָק
  choice: वह बिजली-सी चमकने के लिए तैयार की गई है
  rationale: शाब्दिक 'बिजली के लिए बनाई गई' की अपेक्षा स्वाभाविक हिन्दी में तलवार की बिजली जैसी चमक का बिंब स्पष्ट करता है।
- source_word: מְעֻטָּה לְטָבַח
  choice: वध के लिए खींची गई है
  rationale: दुर्लभ और कठिन रूप को युद्ध में म्यान से खींची हुई, वध के लिए तैयार तलवार के रूप में प्रस्तुत करता है; अन्य संभावनाएँ पादटिप्पणी में दी गई हैं।
