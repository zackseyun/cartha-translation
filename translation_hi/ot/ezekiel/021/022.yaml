  text: וְ/גַם אֲנִ֗י אַכֶּ֤ה כַפִּ/י֙ אֶל כַּפִּ֔/י וַ/הֲנִחֹתִ֖י חֲמָתִ֑/י אֲנִ֥י יְהוָ֖ה דִּבַּֽרְתִּי־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/021/022.yaml
  text: And I too will strike my hands together[a], and I will satisfy my wrath. I, Yahweh[b], have spoken.
translation:
  language: hi
  text: मैं भी अपने हाथों को आपस में पटकूँगा[a] और अपने क्रोध को शांत करूँगा[b]। मैं, याहवे, बोल चुका हूँ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक अर्थ: “अपनी हथेली को अपनी हथेली पर मारूँगा।” यह जोर देकर न्याय घोषित करने के लिए हाथों को आपस में मारने की प्रबल क्रिया का चित्र है।'
    reason: lexical_alternative
  - marker: b
    text: या, “अपने क्रोध को विश्राम दूँगा।” इब्रानी मुहावरे का अर्थ है कि न्याय पूरी तरह कार्यान्वित होने पर याहवे का क्रोध थम जाएगा।
    reason: alternative_reading
lexical_decisions:
- source_word: וְגַם אֲנִי
  choice: मैं भी
  rationale: ‘भी’ גַם के योगात्मक और बलात्मक भाव को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है, जबकि व्यक्त सर्वनाम אֲנִי का जोर ‘मैं’ से बना रहता है।
- source_word: אַכֶּה כַפִּי אֶל־כַּפִּי
  choice: अपने हाथ आपस में पटकूँगा
  rationale: इब्रानी में शाब्दिक चित्र ‘अपनी हथेली को अपनी हथेली पर मारना’ है। ‘हाथ आपस में पटकना’ न्याय के संदर्भ में इसकी जोरदार शारीरिक क्रिया को रखता है और ‘ताली बजाना’ से उत्पन्न उत्सव के संभावित अर्थ से बचता है।
- source_word: וַהֲנִחֹתִי
  choice: शांत करूँगा
  rationale: नוח का कारक रूप यहाँ क्रोध को विश्राम या ठहराव तक पहुँचाने को दर्शाता है। ‘शांत करूँगा’ सुबोध हिन्दी है; साथ की टिप्पणी स्पष्ट करती है कि संदर्भ में यह न्याय के पूरा हो जाने से क्रोध के थमने का भाव रख सकता है।
- source_word: חֲמָתִי
  choice: अपने क्रोध को
  rationale: חֵמָה तीव्र, दहकते हुए रोष को दर्शाता है। ‘क्रोध’ आधुनिक हिन्दी में स्पष्ट और गरिमापूर्ण है तथा भविष्यद्वाणी के न्याय-संदर्भ के अनुकूल है।
- source_word: יְהוָה
  choice: याहवे
  rationale: व्यक्तिगत ईश्वरीय नाम को किसी उपाधि से बदलने के बजाय हिन्दी लिपि में उसके प्रचलित निकट लिप्यंतरण से प्रस्तुत किया गया है।
- source_word: דִּבַּרְתִּי
  choice: यह कह चुका हूँ
  rationale: इब्रानी पूर्ण रूप भविष्यद्वाणी की गंभीर, निश्चित घोषणा है। ‘कह चुका हूँ’ उस पूर्णता और अटलता को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में चार-अक्षरी व्यक्तिगत नाम सीधे आया है। ‘याहवे’ उसे उपाधि में बदले बिना सुरक्षित रखता है।
- issue: ईश्वरीय क्रोध को विश्राम दिए जाने का मुहावरा
  choice: अपने क्रोध को शांत करूँगा
  alternative: अपने क्रोध को विश्राम दूँगा; अपने कोप को पूरा उतारूँगा
  rationale: मुख्य पाठ में स्वाभाविक हिन्दी रखी गई है, पर टिप्पणी मूल ‘विश्राम देना’ की छवि और न्याय के पूरा होने से क्रोध के थमने की संभावना दोनों सुरक्षित रखती है; इस प्रकार इसे केवल भावनात्मक आत्म-सांत्वना नहीं बनाया गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘हाथ आपस में पटकूँगा’ मूल की शारीरिक तीव्रता बचाता है, और विराम-चिह्नों से ‘मैं, याहवे’ की गंभीर आत्म-पहचान स्पष्ट होती है।
