  text: וְ/שָׁפַכְתִּ֤י עָלַ֨יִ/ךְ֙ זַעְמִ֔/י בְּ/אֵ֥שׁ עֶבְרָתִ֖/י אָפִ֣יחַ עָלָ֑יִ/ךְ וּ/נְתַתִּ֗י/ךְ בְּ/יַד֙ אֲנָשִׁ֣ים בֹּֽעֲרִ֔ים חָרָשֵׁ֖י מַשְׁחִֽית׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/021/036.yaml
  text: And I will pour out my indignation on you[a]; with the fire of my wrath I will blow on you, and I will give you into the hand of brutal men[b], craftsmen of destruction.
translation:
  language: hi
  text: मैं अपना रोष तुम पर उण्डेल दूँगा; अपने प्रकोप की आग से मैं तुम पर फूँक मारूँगा। मैं तुम्हें क्रूर लोगों[a] के हाथ में सौंप दूँगा—विनाश के कारीगरों[b] के हाथ में।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘उग्र लोगों’; शाब्दिक रूप से ‘जलते हुए लोग’।
    reason: lexical_alternative
  - marker: b
    text: या ‘विनाश करने में निपुण लोग’ अथवा ‘बरबादी के लोहार’।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁפַכְתִּי
  choice: मैं ... उण्डेल दूँगा
  rationale: यह क्रिया परमेश्वर के रोष को द्रव के समान उण्डेलने का रूपक रखती है और हिन्दी में स्वाभाविक तथा प्रभावशाली है।
- source_word: זַעְמִי
  choice: अपना रोष
  rationale: ‘रोष’ न्यायपूर्ण और तीव्र क्रोध का गरिमापूर्ण भाव व्यक्त करता है तथा पास आने वाले עֶבְרָה से शब्दगत भिन्नता बनाए रखता है।
- source_word: בְּאֵשׁ עֶבְרָתִי
  choice: अपने प्रकोप की आग से
  rationale: यह अनुवाद आग के न्याय-रूपक और בְּ के साधनात्मक भाव को सुरक्षित रखता है; ‘प्रकोप’ तीव्र क्रोध को दर्शाता है।
- source_word: אָפִיחַ עָלָיִךְ
  choice: मैं तुम पर फूँक मारूँगा
  rationale: נפח के हिफ़ील रूप का मूल बिंब बनाए रखा गया है, जो यहाँ न्याय की आग को भड़काने का संकेत दे सकता है, पर अनुवाद उस संकेत को स्पष्ट अर्थ बनाकर नहीं थोपता।
- source_word: וּנְתַתִּיךְ בְּיַד
  choice: मैं तुम्हें ... के हाथ में सौंप दूँगा
  rationale: यह हिन्दी में समझ आने योग्य ढंग से इब्रानी के ‘हाथ में देना’ मुहावरे और किसी दूसरे की सत्ता में सौंपे जाने के भाव दोनों को रखता है।
- source_word: אֲנָשִׁים בֹּעֲרִים
  choice: क्रूर लोगों
  rationale: शाब्दिक अर्थ ‘जलते हुए लोग’ है, पर प्रसंग में यह विनाशकारी उग्रता का वर्णन करता है। ‘क्रूर’ आधुनिक हिन्दी में उस आशय को स्वाभाविक रूप से व्यक्त करता है; शाब्दिक और वैकल्पिक अर्थ पादटिप्पणी में दिए गए हैं।
- source_word: חָרָשֵׁי מַשְׁחִית
  choice: विनाश के कारीगरों
  rationale: חָרָשׁ के कारीगर या शिल्पी वाले मूर्त रूपक को सुरक्षित रखते हुए यह वाक्यांश उन लोगों को विनाश करने में निपुण बताता है।
theological_decisions:
- issue: निकटवर्ती दो दैवी क्रोध-सूचक शब्दों זַעַם और עֶבְרָה का अनुवाद
  choice: क्रमशः ‘रोष’ और ‘प्रकोप’
  alternative: दोनों के लिए एक ही शब्द, जैसे ‘क्रोध’
  rationale: मूल पाठ दो संबंधित किन्तु अलग शब्दों से कथन को तीव्र करता है। अलग लेकिन अर्थ-समीपी हिन्दी शब्द उस काव्यात्मक तनाव को बनाए रखते हैं और कोई अतिरिक्त धर्मवैज्ञानिक भेद नहीं गढ़ते।
- issue: אָפִיחַ में आग भड़काने के निहित बिंब की प्रस्तुति
  choice: मूल क्रिया के अनुरूप ‘तुम पर फूँक मारूँगा’
  alternative: व्याख्यात्मक रूप से ‘तुम्हारे विरुद्ध आग भड़काऊँगा’
  rationale: ‘फूँक मारना’ मूल की स्पष्ट क्रिया को बनाए रखता है और पाठक को आग के पिछले उल्लेख के साथ उसका संबंध समझने देता है, बिना सम्भावित संकेत को निश्चित व्याख्या में बदलने के।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘उण्डेल दूँगा,’ ‘फूँक मारूँगा’ और ‘हाथ में सौंप दूँगा’ मूल के सजीव रूपकों को बनाए रखते हैं। स्त्रीलिंग एकवचन सम्बोधन का हिन्दी ‘तुम’ में स्वाभाविक रूप से पृथक लिंग-चिह्न नहीं आता। मुख्य पाठ में दोनों पादटिप्पणी-चिह्न सम्बद्ध पदों के ठीक बाद रखे गए हैं।
