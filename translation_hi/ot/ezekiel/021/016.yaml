translation_notes:
  register: आधुनिक मानक हिंदी; भविष्यवाणी की संक्षिप्त, तीखी और नाटकीय शैली बनाए रखने के लिए पुनरावृत्ति तथा मध्यस्थ पदबंध 'वह तलवार' सुरक्षित रखा गया है। 'हथेली' मूल के सजीव बिंब को रखता है, जबकि अंतिम पंक्ति में स्वाभाविक हिंदी मुहावरा 'हाथ में दिया जाए' प्रयुक्त है।
