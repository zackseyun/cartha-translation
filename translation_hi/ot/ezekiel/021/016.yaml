source:
  edition: WLC
  text: וַ/יִּתֵּ֥ן אֹתָ֛/הּ לְ/מָרְטָ֖ה לִ/תְפֹּ֣שׂ בַּ/כָּ֑ף הִֽיא הוּחַ֤דָּה חֶ֨רֶב֙ וְ/הִ֣יא מֹרָ֔טָּה לָ/תֵ֥ת אוֹתָ֖/הּ בְּ/יַד הוֹרֵֽג־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/021/016.yaml
  text: It is given to be polished[a], to be grasped in the hand. It is sharpened—the sword—and it is polished[c][b], to put it into the hand of a slayer.
translation:
  language: hi
  text: उसे चमकाने[a] के लिए दिया गया है, ताकि उसे हाथ[b] में थामा जाए। तलवार को तेज़ किया गया है, और उसे चमकाया गया है, ताकि उसे मारने वाले के हाथ में दिया जाए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “माँजने” या “चमकाकर पालिश करने”; इब्रानी शब्द तलवार को घिसकर उज्ज्वल और चमकीला करने का भाव रखता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “हथेली।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֵּן אֹתָהּ
  choice: उसे ... दिया गया है
  rationale: हिब्रू क्रिया रूप शाब्दिक रूप से सक्रिय है ('उसने उसे दिया'), पर कर्ता स्पष्ट नहीं है। हिंदी में कर्मवाच्य अनावश्यक कर्ता जोड़े बिना तलवार की तैयारी पर बल बनाए रखता है।
- source_word: לְמָרְטָה / מֹרָטָּה
  choice: चमकाने / चमकाई गई
  rationale: מרט यहाँ तलवार की धार को घिसकर चमकाने का बोध देता है। 'चमकाना' आधुनिक और सहज है तथा दोनों बार उसी मूल की पुनरावृत्ति रखता है।
- source_word: לִתְפֹּשׂ בַּכָּף
  choice: ताकि वह हथेली में पकड़ी जाए
  rationale: תפש का अर्थ पकड़ना और כַּף का सीधा अर्थ हथेली है। यह रूप तलवार को कर्म के रूप में स्पष्ट रखते हुए मूल चित्र को सुरक्षित रखता है।
- source_word: הוּחַדָּה חֶרֶב
  choice: वह तेज़ की गई है—वह तलवार
  rationale: Hophal रूप का निष्क्रिय अर्थ 'तेज़ की गई' है। חֶרֶב को नाटकीय पुनर्पहचान के रूप में 'वह तलवार' रखा गया है, जो प्रसंग की पहले से परिचित तलवार को इंगित करता है।
- source_word: לָתֵת אוֹתָהּ בְּיַד
  choice: ताकि उसे ... के हाथ में दिया जाए
  rationale: נתן के साथ 'हाथ में' सौंपे जाने या अधिकार में दिए जाने का मुहावरा है। हिंदी में 'हाथ में दिया जाए' मूल बिंब और स्वाभाविकता दोनों रखता है।
- source_word: הוֹרֵג
  choice: घात करनेवाले
  rationale: यह הרג का सक्रिय कृदंत है, अर्थात मारनेवाला। 'घात करनेवाला' गरिमापूर्ण, स्पष्ट और इस युद्ध-संदर्भ में उपयुक्त है; इससे व्यक्ति की पहचान को स्थायी संज्ञा 'हत्यारा' तक सीमित नहीं किया जाता।
