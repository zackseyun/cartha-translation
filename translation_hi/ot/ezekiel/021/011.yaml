lexical_decisions:
- source_word: בֶן אָדָם
  choice: मनुष्य के पुत्र
  rationale: यहेजकेल को परमेश्वर द्वारा दिए जाने वाले इस नियमित संबोधन के इब्रानी मुहावरे और पूरी पुस्तक में उसकी पुनरावृत्ति को सुरक्षित रखता है; यहाँ यह मसीहाई उपाधि नहीं, बल्कि नबी को संबोधन है।
- source_word: הֵאָנַח / תֵּאָנַח
  choice: कराह / कराहना
  rationale: אנח शारीरिक और शोकपूर्ण ध्वनि निकालने को व्यक्त करता है। ‘कराहना’ साधारण ‘आह भरना’ से अधिक तीव्र है और प्रसंग की शारीरिक वेदना को स्वाभाविक हिन्दी में व्यक्त करता है। दूसरे रूप में निर्देशात्मक अपूर्ण क्रिया का बल ‘तू ... कराहना’ से रखा गया है।
- source_word: בְּשִׁבְרוֹן מָתְנַיִם
  choice: कमर टूटने की पीड़ा के साथ
  rationale: שִׁבְרוֹן टूटने, चूर होने या कुचले जाने का भाव और מָתְנַיִם कमर/कटि का क्षेत्र बताता है। यह अनुवाद इब्रानी की तीव्र शारीरिक छवि को रखता है, साथ ही आधुनिक हिन्दी में उसे समझने योग्य बनाता है।
- source_word: וּבִמְרִירוּת
  choice: कड़वाहट में
  rationale: मूल अमूर्त संज्ञा ‘कड़वाहट’ को बनाए रखता है और उसे केवल ‘शोक’ जैसे किसी एक भाव तक सीमित नहीं करता।
- source_word: לְעֵינֵיהֶם
  choice: उनकी आँखों के सामने
  rationale: मूल का जीवंत मुहावरा निकटता से सुरक्षित रहता है और यह स्पष्ट करता है कि नबी को यह कार्य सार्वजनिक रूप से उनकी दृष्टि में करना है।
