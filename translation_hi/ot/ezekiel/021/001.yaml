  text: 'याहवे का वचन मेरे पास आया:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: आया
  rationale: भविष्यद्वाणी के इस प्रचलित आरंभिक सूत्र में शाब्दिक ‘हुआ’ की अपेक्षा ‘वचन ... आया’ स्वाभाविक हिन्दी है और मूल भाव को ठीक व्यक्त करता है।
- source_word: דְבַר
  choice: वचन
  rationale: यहाँ शब्द का अर्थ परमेश्वर की ओर से बोला गया संदेश है। ‘वचन’ भविष्यद्वाणी के स्थापित सूत्र और उसके धार्मिक भार, दोनों को बनाए रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: मूल में परमेश्वर का व्यक्तिगत नाम יהוה है; इसलिए उसे किसी पदवी से बदलने के बजाय ‘याहवे’ के रूप में लिप्यंतरित किया गया है।
- source_word: אֵלַי
  choice: मेरे पास
  rationale: इस संदर्भ में दिशा सूचित करने वाले इब्रानी पद का स्वाभाविक हिन्दी रूप ‘मेरे पास’ है।
- source_word: לֵאמֹר
  choice: उन्होंने कहा
  rationale: यह रूप आगे आने वाली ईश्वरीय वाणी का परिचय देता है। हिन्दी में ‘उन्होंने कहा’ स्वाभाविक है और अगले वचन के लिए स्पष्ट भूमिका बनाता है।
theological_decisions:
- issue: परमेश्वर के नाम יהוה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: पद में चार अक्षरों वाला व्यक्तिगत ईश्वरीय नाम सीधे प्रयुक्त है। ‘याहवे’ उसका लिप्यंतरण करता है और उसे किसी उपाधि से प्रतिस्थापित नहीं करता।
- issue: לֵאמֹר में वक्ता का स्पष्ट उल्लेख
  choice: उन्होंने कहा
  alternative: यह कहते हुए; कहकर
  rationale: इब्रानी में कर्ता निहित है और निकटतम कर्ता याहवे हैं। आदरसूचक बहुवचन हिन्दी की स्वाभाविक रीति है; इससे कथन का अर्थ नहीं बदला जाता।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और सहज भविष्यद्वाणी-सूत्र। ‘मेरे पास आया’ सामान्य हिन्दी प्रवाह रखता है; ‘उन्होंने कहा’ अगले पद की प्रत्यक्ष वाणी का स्वाभाविक परिचय देता है।
