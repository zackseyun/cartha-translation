base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/031/015.yaml
  text: 'Thus says the Lord GOD: On the day he went down to Sheol[a], I caused mourning; I covered the deep because of him, and I restrained its rivers, and the many waters were stopped. I made Lebanon grow dark because of him[c][b], and all the trees of the field fainted because of him.'
translation:
  language: hi
  text: 'प्रभु यहोवा यों कहता है: जिस दिन वह अधोलोक[a] में उतरा, उस दिन मैंने शोक मनवाया। उसके कारण मैंने गहरे जल को ढक दिया, उसकी नदियों को रोक दिया, और प्रचुर जल थम गया। उसके कारण मैंने लबानोन को अँधकारमय कर दिया[b], और मैदान के सभी वृक्ष मूर्छित हो गए[c]।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “शीओल,” “कब्र,” अथवा “मृतकों का लोक।” इब्रानी शब्द שְׁאוֹל मृतकों के अधोलोक को सूचित करता है; इसका अर्थ बाद की धारणा वाले “नरक” तक सीमित नहीं है।
    reason: lexical_alternative
  - marker: b
    text: या “मैंने लबानोन को उदास कर दिया।” इब्रानी क्रिया अँधकार और शोकपूर्ण उदासी—दोनों का भाव व्यक्त कर सकती है।
    reason: lexical_alternative
  - marker: c
    text: या “शिथिल पड़ गए” अथवा “अचेत-से हो गए।”
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  choice: प्रभु यहोवा
  rationale: उपाधि और दिव्य नाम—दोनों को स्पष्ट रूप से सुरक्षित रखता है और हिन्दी बाइबल की गरिमापूर्ण शैली में स्वाभाविक है।
- source_word: בְּיוֹם רִדְתּוֹ שְׁאוֹלָה
  choice: जिस दिन वह अधोलोक में उतरा
  rationale: कालवाचक संरचना को स्पष्ट रखता है; अधोलोक मृतकों के लोक का व्यापक भाव देता है और इसे केवल कब्र या बाद की ‘नरक’ धारणा तक सीमित नहीं करता।
- source_word: הֶאֱבַלְתִּי
  choice: मैंने शोक छा दिया
  rationale: हिफ़ील के कारक भाव को बनाए रखते हुए हिन्दी में प्राकृतिक अभिव्यक्ति देता है; मूल में शोक करने वाले कर्म का स्पष्ट उल्लेख नहीं है।
- source_word: כִּסֵּתִי עָלָיו אֶת תְּהוֹם
  choice: उसके कारण मैंने गहरे जल को ढक दिया
  rationale: כסה का सामान्य अर्थ ‘ढकना’ और עליו का प्रसंगानुकूल कारणार्थक भाव सुरक्षित है; תהום को आदिम अथवा अथाह गहरे जल की छवि के रूप में प्रस्तुत किया गया है।
- source_word: וָאֶמְנַע נַהֲרוֹתֶיהָ
  choice: उसकी नदियों को रोक दिया
  rationale: स्त्रीलिंग प्रत्यय को गहरे जल से संबद्ध रखता है और מנע के रोकने/थामने के अर्थ को सहज हिन्दी में व्यक्त करता है।
- source_word: וַיִּכָּלְאוּ מַיִם רַבִּים
  choice: प्रचुर जल थम गया
  rationale: निफ़ाल के परिणामकारी भाव को स्वाभाविक हिन्दी में देता है; ‘प्रचुर’ מים רבים की मात्रा और व्यापकता को दर्शाता है।
- source_word: וָאַקְדִּר עָלָיו לְבָנוֹן
  choice: उसके कारण मैंने लबानोन को अँधकारमय कर दिया
  rationale: קדר के कारक अँधकार/उदासी के भाव को बनाए रखता है और लबानोन की काव्यात्मक सहभागिता को बिना व्याख्यात्मक विस्तार के प्रस्तुत करता है।
- source_word: וְכָל עֲצֵי הַשָּׂדֶה
  choice: मैदान के सभी वृक्ष
  rationale: सामूहिक वृक्ष-छवि को सीधा और स्वाभाविक रूप देता है।
- source_word: עָלָיו עֻלְפֶּה
  choice: उसके कारण मूर्छित हो गए
  rationale: עֻלְפֶּה की मूर्छा, निर्बलता या शिथिलता की संज्ञात्मक अभिव्यक्ति को हिन्दी में स्वाभाविक क्रियात्मक रूप दिया गया है।
theological_decisions:
- issue: שְׁאוֹל का अनुवाद
  choice: अधोलोक
  alternative: कब्र; मृतकों का लोक; शीओल; नरक
  rationale: ‘अधोलोक’ मृतकों के नीचे के लोक की प्राचीन इब्रानी धारणा को पर्याप्त व्यापकता से रखता है; ‘कब्र’ अर्थ को भौतिक स्थान तक और ‘नरक’ उसे बाद की दंड-संबंधी धारणा तक सीमित कर सकता है। पादटिप्पणी वैकल्पिक रूपों को दर्ज करती है।
- issue: सृष्टि के शोक की काव्यात्मक छवि
  choice: गहरे जल, लबानोन और वृक्षों की सहभागिता को मुख्य पाठ में यथावत रखा
  alternative: इसे केवल पर्यावरणीय विपत्ति या राजनीतिक रूपक के रूप में स्पष्ट करना
  rationale: पद विश्वव्यापी/प्रकृति-संबंधी शोक की सजीव काव्यात्मक भाषा उपयोग करता है। अनुवाद उसे किसी एक व्याख्या में सीमित नहीं करता।
- issue: כִּסֵּתִי की कठिन अभिव्यक्ति
  choice: मैंने गहरे जल को ढक दिया
  alternative: मैंने गहरे जल को उसके ऊपर ढक दिया; मैंने गहरे जल को उसके कारण शोक कराया
  rationale: व्यंजन-पाठ के सामान्य क्रियार्थ ‘ढकना’ को प्राथमिकता दी गई है, यद्यपि प्रसंग और प्राचीन अनुवाद परंपराएँ शोक-संबंधी समझ की संभावना पैदा करती हैं; मुख्य पाठ में कठिनता को व्याख्यात्मक संशोधन से नहीं मिटाया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण भविष्यद्वक्तात्मक शैली रखी गई है। वाक्य सरल और श्रव्य हैं, पर मूल की काव्यात्मक विश्वव्यापी शोक-छवि तथा कठिन अभिव्यक्तियों को अतिव्याख्या द्वारा समतल नहीं किया गया।
