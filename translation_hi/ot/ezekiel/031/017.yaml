  text: גַּם הֵ֗ם אִתּ֛/וֹ יָרְד֥וּ שְׁא֖וֹלָ/ה אֶל חַלְלֵי חָ֑רֶב וּ/זְרֹע֛/וֹ יָשְׁב֥וּ בְ/צִלּ֖/וֹ בְּ/ת֥וֹךְ גּוֹיִֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/031/017.yaml
  text: They too went down with it to Sheol[a], to those slain by the sword; its arm dwelt in its shade among the nations.
translation:
  language: hi
  text: वे भी उसके साथ अधोलोक में, तलवार से मारे गए लोगों के पास उतर गए; उसकी भुजा[a] राष्ट्रों के बीच उसकी छाया में रहती थी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उसकी शक्ति” अथवा “उसके सहयोगी”; शाब्दिक अर्थ “उसकी भुजा।”
    reason: मूल शब्द ‘भुजा’ है, पर संदर्भ में वह शक्ति, समर्थकों या सहयोगियों का रूपक हो सकता है।
lexical_decisions:
- source_word: גַּם הֵם
  choice: वे भी
  rationale: यह पद पहले वर्णित न्याय में इन लोगों को भी सम्मिलित करता है।
- source_word: אִתּוֹ
  choice: उसके साथ
  rationale: संदर्भ में देवदार/अश्शूर का रूपक है; हिन्दी में पुल्लिंग संकेत सर्वनाम इस रूपक और उसके ऐतिहासिक संकेत दोनों के अनुकूल है।
- source_word: יָרְדוּ שְׁאוֹלָה
  choice: अधोलोक में उतर गए
  rationale: ‘अधोलोक’ मृतकों के लोक का भाव रखता है और इसे केवल कब्र या बाद की विकसित नरक-धारणा तक सीमित नहीं करता; ‘उतर गए’ मूल दिशा-सूचक प्रयोग को बनाए रखता है।
- source_word: חַלְלֵי חָרֶב
  choice: तलवार से मारे गए लोग
  rationale: यह सहज आधुनिक हिन्दी में मृत्यु के हिंसक कारण को स्पष्ट रूप से सुरक्षित रखता है।
- source_word: וּזְרֹעוֹ
  choice: और जो उसकी भुजा थे
  rationale: मूल में एकवचन ‘उसकी भुजा’ है, पर साथ का बहुवचन क्रियापद इसे सामूहिक रूप से उसके समर्थकों या सहयोगियों की ओर संकेत करने देता है। मुख्य पाठ मूल बिंब को बनाए रखता है और पादटिप्पणी अर्थ-संभावनाएँ देती है।
- source_word: יָשְׁבוּ בְצִלּוֹ
  choice: वे उसकी छाया में रहते थे
  rationale: बहुवचन क्रिया को सुरक्षित रखते हुए वृक्ष की सुरक्षात्मक छाया का रूपक स्वाभाविक हिन्दी में व्यक्त किया गया है।
- source_word: בְּתוֹךְ גּוֹיִם
  choice: राष्ट्रों के बीच
  rationale: यह स्थानवाचक वाक्यांश और यहेजकेल के अंतरराष्ट्रीय न्याय-संदर्भ दोनों के अनुकूल है।
theological_decisions:
- issue: שְׁאוֹל का अनुवाद
  choice: अधोलोक
  alternative: कब्र; मृतकों का लोक; शीओल
  rationale: ‘अधोलोक’ प्राचीन इस्राएली मृत-लोक की धारणा को पर्याप्त रूप से खुला रखता है और शब्द को केवल दफनाने की जगह या बाद की नरक-धारणा में नहीं बदलता।
- issue: זְרֹעוֹ की रूपकात्मक पहचान
  choice: जो उसकी भुजा थे
  alternative: उसकी शक्ति; उसके सहयोगी
  rationale: ‘भुजा’ का बिंब मूल पाठ में रखा गया है, जबकि बहुवचन क्रिया से प्रकट सामूहिक संकेत को हिन्दी वाक्य-रचना में दिखाया गया है; इसकी सटीक पहचान को किसी एक व्याख्या तक सीमित नहीं किया गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। अर्धविराम और दीर्घ विराम से कठिन हिब्रू वाक्य-संरचना को पठनीय बनाया गया है, जबकि ‘भुजा’ और ‘छाया’ के जुड़े हुए वृक्ष तथा सामर्थ्य-बिंब सुरक्षित हैं।
