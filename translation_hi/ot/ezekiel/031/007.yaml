lexical_decisions:
- source_word: וַיְּיִף
  choice: वह सुंदर था
  rationale: יפה के Qal wayyiqtol का यहाँ वर्णनात्मक अर्थ है; यह वृक्ष की मनोहर अवस्था बताता है।
- source_word: בְּגָדְלוֹ
  choice: अपनी विशालता के कारण
  rationale: גדל यहाँ वृक्ष की महान आकृति या आकार को दर्शाता है। कारणसूचक हिंदी प्रयोग प्रसंग में सुंदरता का आधार स्वाभाविक रूप से व्यक्त करता है।
- source_word: בְּאֹרֶךְ דָּלִיּוֹתָיו
  choice: अपनी डालियों की लंबाई के कारण
  rationale: אֹרֶךְ का अर्थ लंबाई और דָּלִיּוֹתָיו का अर्थ उसकी फैली या लटकती डालियाँ है; ‘डालियाँ’ आधुनिक हिंदी में स्पष्ट और वृक्ष-संदर्भ में स्वाभाविक है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यह वृक्ष की सुंदरता और विशालता का कारण प्रस्तुत करता है।
- source_word: הָיָה שָׁרְשׁוֹ אֶל
  choice: उसकी जड़ ... के पास थी
  rationale: אֶל का मूल भाव ‘की ओर’ है, पर जल-स्रोत के संदर्भ में ‘के पास’ निकटता और उपलब्धता को बिना अनावश्यक विस्तार के स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: מַיִם רַבִּים
  choice: बहुत जल
  rationale: शाब्दिक अर्थ ‘बहुत/अनेक जल’ है। हिंदी में ‘बहुत जल’ प्रचुर जलराशि का भाव स्पष्ट और गरिमापूर्ण ढंग से देता है।
