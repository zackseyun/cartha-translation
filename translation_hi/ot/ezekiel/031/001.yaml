id: EZK.31.1
reference: Ezekiel 31:1
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יְהִ֗י בְּ/אַחַ֤ת עֶשְׂרֵה֙ שָׁנָ֔ה בַּ/שְּׁלִישִׁ֖י בְּ/אֶחָ֣ד לַ/חֹ֑דֶשׁ הָיָ֥ה דְבַר יְהוָ֖ה אֵלַ֥/י לֵ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/031/001.yaml
  text: And it happened in the eleventh year[a], in the third month, on the first day of the month, that the word of Yahweh came to me, saying,
translation:
  language: hi
  text: 'ग्यारहवें वर्ष के तीसरे महीने के पहले दिन ऐसा हुआ कि याहवे[a] का वचन मेरे पास आया:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इब्रानी: YHWH; परंपरागत रूप से “प्रभु” और कभी-कभी “यहोवा” भी लिखा जाता है।'
    reason: ईश्वरीय नाम के प्रचलित वैकल्पिक रूप
lexical_decisions:
- source_word: וַיְהִי
  choice: ऐसा हुआ कि
  rationale: यह भविष्यवाणी के तिथि-सूत्र का आरंभ करता है। यह रूप इब्रानी कथात्मक अभिव्यक्ति को बनाए रखते हुए आधुनिक हिन्दी में स्वाभाविक है।
- source_word: בְּאַחַת עֶשְׂרֵה שָׁנָה
  choice: ग्यारहवें वर्ष
  rationale: इब्रानी तिथि-सूचक अभिव्यक्ति का मानक और सहज हिन्दी रूप।
- source_word: בַּשְּׁלִישִׁי
  choice: तीसरे महीने
  rationale: मूल में ‘महीना’ दोबारा नहीं आया है, पर तिथि-सूत्र में निहित है; स्पष्ट और स्वाभाविक हिन्दी के लिए इसे व्यक्त किया गया है।
- source_word: בְּאֶחָד לַחֹדֶשׁ
  choice: महीने के पहले दिन
  rationale: यह इब्रानी पंचांग की मानक अभिव्यक्ति है और दिन की सटीकता को स्पष्ट रखती है।
- source_word: הָיָה דְבַר יְהוָה אֵלַי
  choice: याहवे का वचन मेरे पास आया
  rationale: भविष्यवाणी में प्रकाशन प्राप्त होने का प्रचलित सूत्र; शब्दशः ‘वचन हुआ/था’ की अपेक्षा हिन्दी में ‘वचन आया’ अधिक स्वाभाविक है।
- source_word: יְהוָה
  choice: याहवे
  rationale: चतुर्वर्णी पवित्र नाम YHWH को किसी उपाधि से बदलने के बजाय उसके प्रचलित विद्वत्तापूर्ण उच्चारण का हिन्दी लिप्यंतरण किया गया है।
- source_word: לֵאמֹר
  choice: ':'
  rationale: यह क्रियारूप आगे आने वाले प्रत्यक्ष कथन का परिचय देता है। हिन्दी में वचन आने के सूत्र के बाद विसर्ग प्रत्यक्ष कथन की वही भूमिका स्वाभाविक रूप से निभाता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: प्रभु; यहोवा
  rationale: मूल पाठ में उपाधि नहीं, परमेश्वर का विशिष्ट नाम YHWH है। ‘याहवे’ उसे स्पष्ट रूप से सुरक्षित रखता है; पादटिप्पणी पाठकों को प्रचलित वैकल्पिक रूपों से अवगत कराती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। तिथि-सूत्र की औपचारिकता सुरक्षित है, और अगले पद में आरंभ होने वाले प्रत्यक्ष वचन के लिए अंत में विसर्ग लगाया गया है।
