  text: לְמַ֡עַן אֲשֶׁר֩ לֹא יִגְבְּה֨וּ בְ/קוֹמָתָ֜/ם כָּל עֲצֵי מַ֗יִם וְ/לֹֽא יִתְּנ֤וּ אֶת צַמַּרְתָּ/ם֙ אֶל בֵּ֣ין עֲבֹתִ֔ים וְ/לֹֽא יַעַמְד֧וּ אֵלֵי/הֶ֛ם בְּ/גָבְהָ֖/ם כָּל שֹׁ֣תֵי מָ֑יִם כִּֽי כֻלָּ/ם֩ נִתְּנ֨וּ לַ/מָּ֜וֶת אֶל אֶ֣רֶץ תַּחְתִּ֗ית בְּ/ת֛וֹךְ בְּנֵ֥י אָדָ֖ם אֶל י֥וֹרְדֵי בֽוֹר־־־־־־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/031/014.yaml
  text: so that all the trees by the waters may not grow tall in their height[a], and may not set their treetop among the clouds, and that none of the water-drinkers may stand over them in their height; for all of them are given over to death, to the land below, among the sons of man[b], with those who go down to the pit.
translation:
  language: hi
  text: ताकि जल के पास के सब पेड़ अपनी ऊँचाई में ऊँचे न हों, और अपनी फुनगी बादलों के बीच न रखें[a], और जल पीनेवालों में से कोई भी अपनी ऊँचाई में उनके ऊपर खड़ा न हो[b]; क्योंकि वे सब मृत्यु के हवाले कर दिए गए हैं—नीचे की धरती में, मनुष्यों के बीच, उन लोगों के साथ जो गड्ढे में उतरते हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “घनी डालियों/पत्तियों के बीच।” इब्रानी עֲבֹתִים का अर्थ घना वृक्ष-विस्तार भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: इस खंड का इब्रानी वाक्य-विन्यास कठिन है। इसका अर्थ यह भी हो सकता है कि कोई दूसरा जल से भरपूर पेड़ अपनी ऊँचाई में उनके बराबर या उनसे ऊँचा होकर खड़ा न हो।
    reason: alternative_reading
lexical_decisions:
- source_word: לְמַעַן אֲשֶׁר
  choice: ताकि
  rationale: उद्देश्य अथवा परिणाम का भाव स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: יִגְבְּהוּ בְקוֹמָתָם
  choice: अपनी ऊँचाई के कारण घमण्ड से ऊँचे न हों
  rationale: גבהּ में भौतिक ऊँचाई और अहंकारी उन्नति दोनों का संकेत है; यह रूप वृक्ष-चित्र और निहित घमण्ड दोनों रखता है।
- source_word: כָּל עֲצֵי מַיִם
  choice: जल के पास के सब पेड़
  rationale: शाब्दिक 'जल के पेड़' को सहज हिन्दी में व्यक्त करते हुए जल से पोषित होने का प्रसंग बनाए रखता है।
- source_word: יִתְּנוּ אֶת צַמַּרְתָּם
  choice: अपनी फुनगी ... न पहुँचाएँ
  rationale: צַמֶּרֶת पेड़ का सबसे ऊपरी भाग है; 'फुनगी' सामान्य, सटीक और चित्रात्मक हिन्दी है।
- source_word: אֶל בֵּין עֲבֹתִים
  choice: बादलों के बीच
  rationale: עֲבֹתִים को बादलों का घना समूह समझना अत्यन्त ऊँचे पेड़ के चित्र के अनुकूल है; घनी डालियों/पत्तियों का अर्थ पादटिप्पणी में सुरक्षित है।
- source_word: וְלֹא יַעַמְדוּ אֵלֵיהֶם בְּגָבְהָם כָּל שֹׁתֵי מָיִם
  choice: और जल पीनेवाले सभी अपनी ऊँचाई में उनके ऊपर खड़े न हों
  rationale: कठिन इब्रानी वाक्य-विन्यास के निकट रहते हुए אֵלֵיהֶם को तुलनात्मक अर्थ 'उनके ऊपर' दिया गया है; अनिश्चितता पादटिप्पणी में स्पष्ट है।
- source_word: שֹׁתֵי מָיִם
  choice: जल पीनेवाले
  rationale: शाब्दिक रूप वृक्षों, शासकों और राष्ट्रों के बीच रूपक की जानबूझकर रखी गई अस्पष्टता को सुरक्षित रखता है।
- source_word: כִּי כֻלָּם נִתְּנוּ לַמָּוֶת
  choice: क्योंकि वे सब मृत्यु के हवाले कर दिए गए हैं
  rationale: निफ़अल रूप में सौंपे अथवा नियत किए जाने का भाव है; हिन्दी वाक्यांश गंभीर और स्वाभाविक है।
- source_word: אֶל אֶרֶץ תַּחְתִּית
  choice: नीचे की धरती पर
  rationale: अधोलोक-संबंधी किसी तकनीकी धर्मवैज्ञानिक धारणा को आरोपित किए बिना नीचे उतरने का स्थानिक चित्र रखता है।
- source_word: בְּתוֹךְ בְּנֵי אָדָם
  choice: मनुष्यों के बीच
  rationale: בני אדם का सामूहिक अर्थ मानवजाति/मरणशील मनुष्य है; आधुनिक हिन्दी में 'मनुष्यों' से प्रतिनिधिक अर्थ स्पष्ट रहता है।
- source_word: יֹרְדֵי בוֹר
  choice: जो गड्ढे में उतरते हैं
  rationale: בּוֹר का मूल चित्र 'गड्ढा' रखता है और उसे केवल 'कब्र' कहकर सीमित नहीं करता।
theological_decisions:
- issue: בְּנֵי אָדָם में मानव-संबंधी अभिव्यक्ति
  choice: मनुष्यों के बीच
  alternative: मनुष्य की सन्तानों के बीच / मरणशीलों के बीच
  rationale: यहाँ वाक्यांश का आशय मरणशील मानव समुदाय है, केवल पुरुष नहीं। स्वाभाविक हिन्दी सामूहिक अर्थ को रखती है और ऊँचे वृक्षों/राष्ट्रों तथा सामान्य मानव-मृत्यु के विरोध को बनाए रखती है।
- issue: אֶרֶץ תַּחְתִּית और בּוֹר का मृत्यु-पश्चात् संकेत
  choice: नीचे की धरती ... गड्ढा
  alternative: अधोलोक ... कब्र
  rationale: मूल के अवतरण-चित्र को सुरक्षित रखा गया है, पर किसी विकसित परलोक-सिद्धान्त को पाठ में आरोपित नहीं किया गया।
