  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सामान्य-पाठक-सुलभ रूप। वृक्ष-रूपक को 'फुनगी', 'जल पीनेवाले' और 'गड्ढे में उतरते हैं' द्वारा बनाए रखा गया है। कठिन इब्रानी खंड और עֲבֹתִים की वास्तविक lexical ambiguity पादटिप्पणियों में सुरक्षित है।
