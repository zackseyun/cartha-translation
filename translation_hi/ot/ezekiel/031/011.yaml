  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/אֶ֨תְּנֵ֔/הוּ בְּ/יַ֖ד אֵ֣יל גּוֹיִ֑ם עָשׂ֤וֹ יַֽעֲשֶׂה֙ ל֔/וֹ כְּ/רִשְׁע֖/וֹ גֵּרַשְׁתִּֽ/הוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/031/011.yaml
  text: I gave him into the hand of a mighty one of the nations; he will surely deal with him[a]. According to his wickedness I drove him out.
translation:
  language: hi
  text: मैंने उसे जातियों में से एक शक्तिशाली जन के हाथ में दे दिया; वह उसके साथ निश्चय ही निपटेगा।[a] उसकी दुष्टता के अनुसार मैंने उसे निकाल दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वह निश्चय ही उसके विरुद्ध कार्रवाई करेगा।” “शक्तिशाली जन” के लिए “जातियों का शासक” भी संभव है; इब्रानी अभिव्यक्ति जातियों के बीच किसी शक्तिशाली शासक को सूचित कर सकती है।
    reason: शब्दार्थ और वाक्यांश की संभावित वैकल्पिक व्याख्या
lexical_decisions:
- source_word: וְאֶתְּנֵהוּ
  choice: मैंने उसे ... दे दिया
  rationale: נתן के प्रथम पुरुष एकवचन कर्ता और तृतीय पुरुष पुल्लिंग एकवचन कर्म को संदर्भ में पूर्ण हुई न्याय-क्रिया के रूप में लिया गया है। ‘दे दिया’ सुपुर्द किए जाने का भाव स्वाभाविक रूप से व्यक्त करता है।
- source_word: בְּיַד
  choice: के हाथ में
  rationale: यह किसी के अधिकार या नियंत्रण में सौंपने का सामान्य इब्रानी मुहावरा है; हिन्दी में भी ‘हाथ में देना’ स्पष्ट और स्वाभाविक है।
- source_word: אֵיל גּוֹיִם
  choice: जातियों में से एक शक्तिशाली जन
  rationale: אֵיל यहाँ बलवान या शक्तिशाली व्यक्ति को सूचित करता है। अनुवाद उसे अनावश्यक रूप से ‘राजा’ नहीं बनाता और जातियों के बीच से आए शक्तिशाली न्याय-साधन का सामान्य वर्णन बनाए रखता है।
- source_word: עָשׂוֹ יַעֲשֶׂה לּוֹ
  choice: वह निश्चय ही उसके साथ वैसा ही करेगा
  rationale: धातु עשה के infinitive absolute और imperfect का मेल क्रिया की निश्चितता पर बल देता है। ‘निश्चय ही’ उस बल को व्यक्त करता है; ‘वैसा ही’ दंडात्मक व्यवहार को संदर्भ से ग्रहण करता है, पर उसका विशिष्ट रूप नहीं जोड़ता।
- source_word: כְּרִשְׁעוֹ
  choice: उसकी दुष्टता के अनुसार
  rationale: כְּ यहाँ अनुरूपता या माप का भाव देता है—दंड उसकी दुष्टता के अनुरूप है।
- source_word: גֵּרַשְׁתִּהוּ
  choice: मैंने उसे निकाल दिया
  rationale: גרש का अर्थ निकाल देना या खदेड़ देना है। ‘निकाल दिया’ आधुनिक हिन्दी में सहज है और स्थान तथा पद से हटाए जाने की खुली अर्थ-सीमा बनाए रखता है।
theological_decisions:
- issue: אֵיל גּוֹיִם से अभिप्रेत न्याय के मानवीय साधन की पहचान
  choice: मुख्य पाठ में सामान्य रूप से ‘जातियों में से एक शक्तिशाली जन’
  alternative: ‘जातियों का शासक’ या बाबेल के राजा की स्पष्ट पहचान
  rationale: इब्रानी पाठ इस पद में व्यक्ति का नाम नहीं बताता। सम्भावित ऐतिहासिक पहचान को मुख्य पाठ में जोड़ने के बजाय मूल की सामान्य अभिव्यक्ति सुरक्षित रखी गई है।
- issue: עָשׂוֹ יַעֲשֶׂה לּוֹ में आगामी क्रिया का स्वरूप
  choice: ‘वह निश्चय ही उसके साथ वैसा ही करेगा’
  alternative: ‘वह निश्चय ही उसके विरुद्ध कार्रवाई करेगा’
  rationale: मूल क्रिया עשה सामान्य है, जबकि संदर्भ उसे दंडात्मक बनाता है। चुना हुआ रूप निश्चितता और संदर्भ दोनों रखता है, पर मूल से अधिक विशिष्ट हिंसक या न्यायिक क्रिया नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सामान्य-पाठक के लिए स्पष्ट रूप। ‘हाथ में’ की मूल छवि और ‘दुष्टता के अनुसार’ की न्यायानुरूपता बनाए रखी गई है।
