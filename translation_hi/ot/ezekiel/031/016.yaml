source:
  edition: WLC
  text: מִ/קּ֤וֹל מַפַּלְתּ/וֹ֙ הִרְעַ֣שְׁתִּי גוֹיִ֔ם בְּ/הוֹרִדִ֥/י אֹת֛/וֹ שְׁא֖וֹלָ/ה אֶת י֣וֹרְדֵי ב֑וֹר וַ/יִּנָּ֨חֲמ֜וּ בְּ/אֶ֤רֶץ תַּחְתִּית֙ כָּל עֲצֵי עֵ֔דֶן מִבְחַ֥ר וְ/טוֹב לְבָנ֖וֹן כָּל שֹׁ֥תֵי מָֽיִם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/031/016.yaml
  text: At the sound of his fall I made nations quake[a], when I brought him down to Sheol with those who go down to the pit; and all the trees of Eden, the choice and best of Lebanon, all that drink water[c][b], were comforted in the earth beneath.
translation:
  language: hi
  text: उसके गिरने की आवाज़ से मैंने राष्ट्रों को काँपने पर विवश किया, जब मैं उसे गड्ढे में उतरने वालों के साथ शीओल[a] में उतार ले गया। तब नीचे की धरती[b] में अदन के सभी वृक्ष—लबानोन के चुने हुए और उत्तम वृक्ष, वे सभी जो जल पीते थे—सांत्वना पाए[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘शीओल’ इब्रानी शब्द है, जिसका अर्थ मृतकों का लोक है; इसे ‘अधोलोक’ या प्रसंगानुसार ‘कब्र’ भी कहा जा सकता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, ‘निचली धरती।’
    reason: literal_rendering
  - marker: c
    text: या ‘ढाढ़स पाया’ अथवा ‘दिलासा मिला।’ आशय यह हो सकता है कि पहले से गिरी हुई शक्तियों को इस महान शक्ति के भी नीचे उतारे जाने पर एक गंभीर और विडंबनापूर्ण सांत्वना मिली।
    reason: lexical_alternative
lexical_decisions:
- source_word: מִקּוֹל מַפַּלְתּוֹ
  choice: उसके गिरने की आवाज़ से
  rationale: यह पदबंध वृक्ष के गिरने की प्रत्यक्ष छवि और साम्राज्य के पतन के रूपक, दोनों को बनाए रखता है। यहाँ מִן को प्रसंगानुसार कारणसूचक ‘से’ कहा गया है।
- source_word: הִרְעַשְׁתִּי גוֹיִם
  choice: मैंने राष्ट्रों को थरथरा दिया
  rationale: 'हिफ़ील रूप की कारणवाचक शक्ति स्पष्ट रहती है: वक्ता राष्ट्रों को काँपने पर विवश करता है। ‘राष्ट्र’ अंतरराष्ट्रीय न्याय के प्रसंग में גוֹיִם का स्वाभाविक अर्थ है।'
- source_word: בְּהוֹרִדִי אֹתוֹ
  choice: जब मैं उसे ... उतार ले गया
  rationale: पूर्वसर्ग सहित infinitive construct को यहाँ कालसूचक ‘जब’ के रूप में व्यक्त किया गया है; हिफ़ील की कारणवाचकता ‘उतार ले गया’ में बनी रहती है।
- source_word: שְׁאוֹלָה
  choice: शीओल
  rationale: इब्रानी सांस्कृतिक अवधारणा को लिप्यंतरित करने से इसे केवल भौतिक कब्र तक सीमित नहीं किया जाता; पादटिप्पणी सामान्य पाठक के लिए अर्थ स्पष्ट करती है।
- source_word: אֶת יֹרְדֵי בוֹר
  choice: गड्ढे में उतरनेवालों के साथ
  rationale: प्रसंग में אֶת को साहचर्यसूचक ‘के साथ’ समझना समानांतरता के अनुकूल है। ‘गड्ढा’ मृत्यु की काव्यात्मक छवि को सुरक्षित रखता है।
- source_word: בְּאֶרֶץ תַּחְתִּית
  choice: नीचे की धरती में
  rationale: यह मूल की स्थानवाची अधोलोक-संबंधी छवि को अपेक्षाकृत शाब्दिक ढंग से रखता है और किसी विकसित परलोक-सिद्धांत को नहीं जोड़ता।
- source_word: כָּל עֲצֵי עֵדֶן
  choice: अदन के सभी वृक्ष
  rationale: अध्याय में राष्ट्रों और शक्तियों के लिए प्रयुक्त वृक्ष-रूपक तथा अदन की ओर संकेत दोनों संरक्षित हैं।
- source_word: מִבְחַר וְטוֹב לְבָנוֹן
  choice: लबानोन के चुने हुए और उत्तम वृक्ष
  rationale: वाक्य में यह अदन के वृक्षों का विशेषणात्मक पुनर्वर्णन है। संज्ञा ‘वृक्ष’ दोहराने से हिन्दी में संबंध स्पष्ट और स्वाभाविक होता है।
- source_word: כָּל שֹׁתֵי מָיִם
  choice: वे सभी जो जल पीते थे
  rationale: वृक्षों के पानी पीने की मानवीकृत काव्य-छवि को बिना व्याख्यात्मक विस्तार के बनाए रखा गया है।
- source_word: וַיִּנָּחֲמוּ
  choice: सांत्वना पाए
  rationale: निफ़अल की प्राप्त/भाववाचक छाया बनी रहती है। यह अनुवाद इस विडंबनापूर्ण संभावना को खुला रखता है कि पहले से गिरी हुई शक्तियों को इस महान शक्ति के पतन से सांत्वना मिली।
theological_decisions:
- issue: שְׁאוֹל का अनुवाद
  choice: शीओल
  alternative: अधोलोक; कब्र; मृतकों का लोक
  rationale: लिप्यंतरण इब्रानी में मृतकों के लोक की व्यापक अवधारणा को सुरक्षित रखता है और अर्थ को केवल दफ़नाने की जगह तक सीमित नहीं करता। पादटिप्पणी संभावित अर्थ बताती है, पर किसी विशिष्ट परलोक-मत को स्थापित नहीं करती।
- issue: नीचे की धरती में वृक्षों को सांत्वना मिलना
  choice: रूपक को यथावत रखते हुए ‘सांत्वना पाए’
  alternative: ‘ढाढ़स पाया’ या केवल काव्यात्मक मानवीकरण मानना
  rationale: पद राष्ट्रों/शक्तियों को वृक्षों के रूप में चित्रित करता है और उन्हें मृतकों के क्षेत्र में सांत्वना पाते दिखाता है। अनुवाद यह निर्धारित नहीं करता कि यह सचेत परलोक-अनुभव का सिद्धांत है या काव्यात्मक मानवीकरण।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में है, किंतु भविष्यद्वाणी की गरिमा और वृक्ष-पतन की विस्तृत काव्यात्मक छवि बनाए रखी गई है। ‘शीओल’ जैसे स्रोत-सांस्कृतिक शब्द को पादटिप्पणी के सहारे रखा गया है; शेष वाक्यरचना सामान्य पाठक के लिए सहज बनाई गई है।
