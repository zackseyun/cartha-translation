base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/031/013.yaml
  text: On its fallen trunk all the birds of the heavens will dwell[b][a], and on its boughs will be all the beasts of the field.
translation:
  language: hi
  text: उसके गिरे हुए तने पर आकाश के सब पक्षी बसेरा करेंगे,[a] और उसकी डालियों[b] पर मैदान के सब पशु होंगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसके पतन पर आकाश के सब पक्षी बसेरा करेंगे।” इब्रानी संज्ञा अधिक अमूर्त अर्थ में भी ली जा सकती है, पर प्रसंग का वृक्ष-चित्र “गिरे हुए तने” का समर्थन करता है।
    reason: lexical_alternative
  - marker: b
    text: या, “उसकी शाखाओं पर।”
    reason: lexical_alternative
lexical_decisions:
- source_word: מַפַּלְתּוֹ
  choice: उसके गिरे हुए तने
  rationale: नפל से बना यह संज्ञा-रूप गिरने, पतन या गिरी हुई वस्तु का बोध करा सकता है। यहाँ काटे गए देवदार का रूपक चल रहा है, इसलिए ठोस वृक्ष-चित्र को बनाए रखने वाला अनुवाद उपयुक्त है।
- source_word: יִשְׁכְּנוּ
  choice: बसेरा करेंगे
  rationale: שׁכן का अर्थ बसना, ठहरना या निवास करना है। पक्षियों के संदर्भ में ‘बसेरा करेंगे’ स्वाभाविक है और स्थायी रूप से आ टिकने का चित्र रखता है।
- source_word: עוֹף הַשָּׁמַיִם
  choice: आकाश के सब पक्षी
  rationale: यह इब्रानी संबंध-वाक्यांश का निकट और आधुनिक हिन्दी में सहज रूप है।
- source_word: פֹּארֹתָיו
  choice: उसकी डालियों
  rationale: यह शब्द वृक्ष की फैली हुई बड़ी शाखाओं को सूचित करता है। ‘डालियाँ’ हिन्दी में वृक्ष-चित्र को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: הָיוּ
  choice: होंगे
  rationale: रूप की दृष्टि से यह पूर्ण क्रिया है, पर समानांतर भविष्यकालीन יִשְׁכְּנוּ और भविष्यसूचक प्रसंग के कारण यहाँ भविष्य अर्थ ग्रहण किया गया है।
- source_word: חַיַּת הַשָּׂדֶה
  choice: मैदान के सब जीव
  rationale: यह प्रचलित बाइबलीय पदबंध का व्यापक अर्थ रखता है। ‘जीव’ अनावश्यक रूप से जंगलीपन निर्धारित किए बिना पशु-जगत का बोध कराता है।
- source_word: עַל ... וְאֶל
  choice: पर ... और ... पर
  rationale: पहला संबंध स्पष्टतः ‘पर’ है। दूसरा मूलतः ‘की ओर’ हो सकता है, किंतु הָיוּ और डालियों पर पशुओं की उपस्थिति के चित्र में हिन्दी का स्वाभाविक स्थानसूचक रूप ‘पर’ है।
