base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/031/008.yaml
  text: Cedars did not overshadow it in the garden of God[a]; cypresses did not compare with its boughs, and plane trees were not like its branches[b]. No tree in the garden of God compared with it in its beauty.
translation:
  language: hi
  text: परमेश्वर की वाटिका के देवदार उसे अपनी छाया से ढक न सके[a]; सरू उसकी बड़ी डालियों की बराबरी न कर सके, और चिनार उसकी शाखाओं के समान न थे[b]। परमेश्वर की वाटिका का कोई भी वृक्ष सुंदरता में उसके समान न था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘परमेश्वर के बगीचे में।’ इब्रानी में शब्दशः ‘परमेश्वर की वाटिका में’ है; यह अभिव्यक्ति अदन की स्मृति जगाती है।
    reason: lexical_alternative
  - marker: b
    text: ‘चिनार’ संभावित अर्थ है; परंपरागत अनुवादों में प्रायः ‘शाहबलूत’ मिलता है।
    reason: alternative_reading
lexical_decisions:
- source_word: אֲרָזִים
  choice: देवदार
  rationale: אֶרֶז का प्रचलित और स्वाभाविक हिन्दी पर्याय; बहुवचन का भाव क्रिया और प्रसंग से स्पष्ट है।
- source_word: עֲמָמֻהוּ
  choice: उसे अपनी छाया से ढक न सके
  rationale: עמם के अँधेरा या ओझल करने के ठोस वृक्ष-संबंधी बिंब को सहज हिन्दी में व्यक्त करता है; केवल अमूर्त ‘टक्कर न दे सके’ कहने से मूल बिंब खो जाता।
- source_word: בְּגַן אֱלֹהִים
  choice: परमेश्वर की वाटिका में
  rationale: मूल अभिव्यक्ति को सीधे बनाए रखता है और अदन की ओर संकेत करने वाली ऊँची काव्यात्मक छवि को बिना स्पष्ट पहचान थोपे सुरक्षित रखता है।
- source_word: בְּרוֹשִׁים
  choice: सनोवर
  rationale: वृक्ष की सटीक जाति विवादित है; आधुनिक हिन्दी में यह सरो या फ़र जैसे सदाबहार शंकुधारी वृक्ष के लिए गरिमापूर्ण और परिचित पद है।
- source_word: דָמוּ / דָמָה אֵלָיו
  choice: समान न थे / उसके समान न था
  rationale: דמה की तुलनात्मक धारणा को स्वाभाविक हिन्दी में व्यक्त करता है और दोनों प्रयोगों में अर्थगत संगति रखता है।
- source_word: סְעַפֹּתָיו
  choice: उसकी बड़ी डालियाँ
  rationale: यह शब्द वृक्ष की बड़ी और फैली हुई शाखाओं का संकेत देता है; इससे आगे आने वाले פֹארֹתָיו से भेद बना रहता है।
- source_word: עַרְמֹנִים
  choice: चिनार
  rationale: आधुनिक स्रोत-साक्ष्य के अनुसार इसका संभावित अर्थ प्लेन वृक्ष है; हिन्दी में ‘चिनार’ उसी वृक्ष-समूह का सहज नाम है।
- source_word: פֹארֹתָיו
  choice: उसकी शाखाएँ
  rationale: शाखाओं या पत्तेदार फैलाव का स्वाभाविक हिन्दी रूप, और ‘बड़ी डालियों’ से हल्का शब्दगत भेद बनाए रखता है।
- source_word: כָּל עֵץ ... לֹא
  choice: कोई भी वृक्ष ... न था
  rationale: इब्रानी के सार्वभौमिक निषेध को स्वाभाविक हिन्दी वाक्य-विन्यास में ठीक रूप से व्यक्त करता है।
- source_word: בְּיָפְיוֹ
  choice: सुंदरता में
  rationale: 'בְּ द्वारा व्यक्त तुलना के क्षेत्र या पक्ष को बनाए रखता है: कोई वृक्ष उसकी सुंदरता की बराबरी नहीं करता था।'
theological_decisions:
- issue: ‘परमेश्वर की वाटिका’ की पहचान
  choice: मुख्य पाठ में ‘परमेश्वर की वाटिका’
  alternative: अदन; परमेश्वर का स्वर्गलोक
  rationale: यह अभिव्यक्ति अदन की स्मृति जगाती है, पर मूल पाठ स्पष्ट रूप से ‘परमेश्वर की वाटिका’ कहता है। शाब्दिक अभिव्यक्ति बनाए रखने से भविष्यद्वाणी की छवि और उसकी वास्तविक अस्पष्टता दोनों सुरक्षित रहती हैं।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की है, किंतु भविष्यद्वाणी के काव्यात्मक और गरिमापूर्ण स्वर के लिए ‘वाटिका’ रखा गया है। ‘बड़ी डालियाँ’ और ‘शाखाएँ’ मूल के दो अलग वृक्ष-संबंधी पदों का भेद सहज ढंग से बनाए रखते हैं।
