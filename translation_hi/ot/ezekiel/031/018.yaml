base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/031/018.yaml
  text: Whom were you like in glory and greatness among the trees of Eden? Yet you shall be brought down with the trees of Eden to the land below; you shall lie among the uncircumcised, with those slain by the sword. This is Pharaoh and all his multitude[a], declares the Lord GOD.
translation:
  language: hi
  text: “वैभव और महानता में अदन के वृक्षों के बीच तू किसके समान था? फिर भी तुझे अदन के वृक्षों के साथ नीचे की धरती[a] में उतारा जाएगा। तू खतनारहितों के बीच, तलवार से मारे गए लोगों के साथ पड़ा रहेगा। यही फ़िरौन और उसकी सारी भीड़ है,” प्रभु यहवे की यह वाणी है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “निचली धरती” अथवा “अधोलोक।” इब्रानी अभिव्यक्ति नीचे के क्षेत्र, अर्थात मृतकों के स्थान, की ओर संकेत करती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶל מִי דָמִיתָ כָּכָה
  choice: तू किसके समान था
  rationale: यह सीधा आलंकारिक प्रश्न है। ‘किसके समान था’ तुलना का भाव स्वाभाविक हिन्दी में रखता है; כָּכָה का बल पूरे प्रश्न में समाहित है।
- source_word: כָבוֹד וּבְגֹדֶל
  choice: वैभव और महानता
  rationale: शाही महिमा, प्रतिष्ठा और विशालता—इन संयुक्त भावों को क्रमशः ‘वैभव’ और व्यापक ‘महानता’ से व्यक्त किया गया है।
- source_word: עֲצֵי עֵדֶן
  choice: अदन के वृक्ष
  rationale: अध्याय में चली आ रही वृक्षों की उपमा को शाब्दिक और स्पष्ट रूप में सुरक्षित रखता है।
- source_word: וְהוּרַדְתָּ
  choice: तुझे ... उतारा जाएगा
  rationale: होफ़ाल रूप का कर्मवाच्य भाव और भविष्यसूचक न्याय—दोनों सुरक्षित रहते हैं।
- source_word: אֶרֶץ תַּחְתִּית
  choice: नीचे की धरती
  rationale: मृतकों के अधोलोक की स्थानिक छवि को बनाए रखता है, पर बाद की किसी सुव्यवस्थित पारलौकिक धारणा को पाठ में नहीं जोड़ता।
- source_word: בְּתוֹךְ עֲרֵלִים
  choice: खतनारहितों के बीच
  rationale: यहेजकेल में इस पद की वाचा-संबंधी और अपमानसूचक धार को संक्षिप्त, समझने योग्य हिन्दी में बनाए रखता है।
- source_word: תִּשְׁכַּב
  choice: पड़ा रहेगा
  rationale: यहाँ मृत्यु में पड़े रहने की छवि है; हिन्दी में ‘पड़ा रहेगा’ उस अर्थ को सहज रूप से व्यक्त करता है।
- source_word: חַלְלֵי חֶרֶב
  choice: तलवार से मारे गए लोग
  rationale: हिंसक मृत्यु को स्पष्ट और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: הוּא פַרְעֹה וְכָל הֲמוֹנוֹ
  choice: यही फ़िरौन और उसकी सारी भीड़ है
  rationale: समापन में फ़िरौन और उसके समूचे जनसमूह की पहचान कराने वाले הוּא के सारसूचक बल को रखता है।
- source_word: אֲדֹנָי יְהוִה
  choice: प्रभु यहवे
  rationale: אֲדֹנָי को ‘प्रभु’ और परमेश्वर के व्यक्तिगत वाचा-नाम יהוה को लिप्यंतरित ‘यहवे’ से व्यक्त किया गया है, जिससे ‘प्रभु प्रभु’ जैसी पुनरुक्ति नहीं होती।
theological_decisions:
- issue: אֶרֶץ תַּחְתִּית का आशय
  choice: नीचे की धरती
  alternative: अधोलोक
  rationale: मूल पद नीचे स्थित मृतकों के क्षेत्र की ओर संकेत करता है। मुख्य पाठ स्थानिक रूपक को खुला रखता है और टिप्पणी उसका संदर्भ स्पष्ट करती है।
- issue: אֲדֹנָי יְהוִה में ईश्वरीय नाम
  choice: प्रभु यहवे
  alternative: प्रभु परमेश्वर
  rationale: व्यक्तिगत वाचा-नाम को सामान्य उपाधि में बदलने के बजाय उसका लिप्यंतरण किया गया है, जबकि אֲדֹנָי का अर्थ ‘प्रभु’ रखा गया है।
- issue: खतनारहितों के बीच मृत्यु की भाषा
  choice: खतनारहितों के बीच
  alternative: अन्यजातियों के बीच
  rationale: ‘अन्यजाति’ कहने से मूल की शारीरिक, वाचा-संबंधी और अपमानसूचक भाषा सामान्यीकृत हो जाती; इसलिए वास्तविक अभिव्यक्ति सुरक्षित रखी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध रूप अपनाया गया है। ‘तू’ मूल के एकवचन प्रत्यक्ष संबोधन और न्याय-वाणी की तीक्ष्णता को बनाए रखता है। वृक्ष, नीचे उतरना और मृतकों के बीच पड़े रहना—इन परस्पर जुड़ी काव्यात्मक छवियों को सरल किए बिना स्वाभाविक हिन्दी वाक्य-विन्यास दिया गया है।
