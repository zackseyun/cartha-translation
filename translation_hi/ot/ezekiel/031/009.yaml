base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/031/009.yaml
  text: I made it beautiful with its many branches[a], and all the trees of Eden that were in the garden of God envied it.
translation:
  language: hi
  text: मैंने उसे उसकी बहुत-सी डालियों से सुंदर बनाया; और अदन के वे सभी पेड़ जो परमेश्वर के बाग में थे, उससे ईर्ष्या करते थे।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ ‘उसे’ और ‘उससे’ पेड़ की छवि के साथ-साथ उसके द्वारा दर्शाए गए अश्शूर अथवा उसके राजा की ओर भी संकेत कर सकते हैं।
    reason: alternative_reading
lexical_decisions:
- source_word: יָפֶה
  choice: सुन्दर
  rationale: यह विधेय विशेषण पेड़ के रूप और वैभव का वर्णन करता है; ‘सुन्दर’ आधुनिक, स्वाभाविक और गरिमापूर्ण हिन्दी है।
- source_word: עֲשִׂיתִיו
  choice: मैंने उसे ... बनाया
  rationale: यह प्रथम पुरुष एकवचन क्रिया के साथ तृतीय पुरुष पुल्लिंग एकवचन कर्म-प्रत्यय है। हिन्दी का ‘उसे’ पेड़ की छवि और उसके पीछे निहित अश्शूर—दोनों के लिए स्वाभाविक रूप से प्रयुक्त हो सकता है।
- source_word: בְּרֹב דָּלִיּוֹתָיו
  choice: उसकी बहुत-सी डालियों से
  rationale: ב को साधन/विशेषता के अर्थ में और רֹב को बहुलता के रूप में व्यक्त किया गया है। ‘डालियाँ’ इस वृक्ष-रूपक के लिए सामान्य आधुनिक शब्द है।
- source_word: וַיְקַנְאֻהוּ
  choice: उससे ईर्ष्या करते थे
  rationale: קנא यहाँ ईर्ष्या का भाव व्यक्त करता है। ‘उससे’ पुल्लिंग प्रत्यय को दर्शाते हुए हिन्दी में पेड़ और रूपकगत मानवीय/राजकीय संकेत की अस्पष्टता बनाए रखता है।
- source_word: כָּל עֲצֵי עֵדֶן
  choice: अदन के सभी पेड़
  rationale: मूल सामूहिक अभिव्यक्ति को स्पष्ट और स्वाभाविक हिन्दी क्रम में रखा गया है।
- source_word: אֲשֶׁר בְּגַן הָאֱלֹהִים
  choice: परमेश्वर के बाग में रहनेवाले
  rationale: सम्बन्धवाचक उपवाक्य पेड़ों का स्थान बताता है। ‘परमेश्वर का बाग’ मूल के ऊँचे बाइबलीय मुहावरे और अदन-संबंधी प्रतिध्वनि को सुरक्षित रखता है।
theological_decisions:
- issue: रूपक में तृतीय पुरुष पुल्लिंग एकवचन प्रत्ययों का संकेत
  choice: मुख्य पाठ में ‘उसे/उससे’ रखा गया है, जो निकटवर्ती पेड़ की छवि से मेल खाता है और हिन्दी में व्याकरणतः पुल्लिंग है।
  alternative: इसे सीधे अश्शूर या उसके राजा के मानवीय संकेत के रूप में स्पष्ट करना।
  rationale: अध्याय का विस्तृत रूपक अश्शूर को भव्य देवदार के रूप में प्रस्तुत करता है। हिन्दी सर्वनाम मूल की वास्तविक अस्पष्टता को अंग्रेज़ी के ‘it/him’ भेद से अधिक सहजता से सुरक्षित रखते हैं; इसलिए किसी एक संकेत को अनावश्यक रूप से स्पष्ट नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी, सहज किंतु गरिमापूर्ण शैली। वृक्ष-रूपक को स्पष्ट रखा गया है और सर्वनामों की मूल संकेतगत अस्पष्टता को पादटिप्पणी में बताया गया है।
