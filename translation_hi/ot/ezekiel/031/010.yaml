source:
  edition: WLC
  text: לָ/כֵ֗ן כֹּ֤ה אָמַר֙ אֲדֹנָ֣/י יְהוִ֔ה יַ֕עַן אֲשֶׁ֥ר גָּבַ֖הְתָּ בְּ/קוֹמָ֑ה וַ/יִּתֵּ֤ן צַמַּרְתּ/וֹ֙ אֶל בֵּ֣ין עֲבוֹתִ֔ים וְ/רָ֥ם לְבָב֖/וֹ בְּ/גָבְהֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/031/010.yaml
  text: 'Therefore thus says the Lord GOD: Because you grew tall in stature[a], and set your top among the thick boughs, and his heart was lifted up in his height,'
translation:
  language: hi
  text: 'इसलिए प्रभु यहोवा यों कहते हैं: “क्योंकि तू कद में ऊँचा हो गया, और उसने अपनी फुनगी घनी शाखाओं[a] के बीच पहुँचा दी, और अपनी ऊँचाई में उसका हृदय घमण्ड से फूल उठा,”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “बादलों के बीच।” עֲבוֹतִים का प्राथमिक अर्थ घनी पत्तियाँ या शाखाएँ है; फिर भी, संदर्भ में अत्यधिक ऊँचाई के बिंब के कारण ‘बादलों’ का अर्थ भी लिया जाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  choice: प्रभु यहोवा
  rationale: उपाधि और परमेश्वर के व्यक्तिगत नाम—दोनों को बनाए रखता है तथा हिन्दी में ‘प्रभु प्रभु’ जैसी पुनरुक्ति से बचता है।
- source_word: גָּבַהְתָּ בְּקוֹמָה
  choice: तू कद में ऊँचा हो गया
  rationale: पेड़ के बढ़ने की प्रतिमा और संबोधित सत्ता की महानता—दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: צַמַּרְתּוֹ
  choice: अपनी फुनगी
  rationale: शब्द पेड़ के सबसे ऊपरी भाग को दर्शाता है; ‘फुनगी’ हिन्दी में वृक्ष-प्रतिमा को स्पष्ट और संक्षिप्त रखता है। तृतीय पुरुष प्रत्यय को ‘अपनी’ के माध्यम से उसी खंड के कर्ता के साथ रखा गया है।
- source_word: אֶל בֵּין עֲבוֹתִים
  choice: घनी शाखाओं के बीच
  rationale: עֲבוֹתִים का प्राथमिक वृक्ष-संबंधी अर्थ घनी पत्तियों या मोटी/घनी शाखाओं की ओर संकेत करता है। अत्यधिक ऊँचाई दर्शाने वाला ‘बादलों के बीच’ भी संभव है और पादटिप्पणी में दिया गया है।
- source_word: וְרָם לְבָבוֹ
  choice: उसका हृदय घमण्ड से फूल उठा
  rationale: ऊँचा होने के शाब्दिक बिंब को अहंकार की प्रचलित हिन्दी अभिव्यक्ति से जोड़ता है और आंतरिक अभिमान का आशय स्पष्ट करता है।
- source_word: בְּגָבְהוֹ
  choice: अपनी ऊँचाई के कारण
  rationale: 'בְּ को यहाँ कारणसूचक समझना प्रसंग के अनुकूल है: उसकी असाधारण ऊँचाई उसके अभिमान का कारण बनी।'
theological_decisions:
- issue: वचन के भीतर पुरुष का परिवर्तन
  choice: ‘तू ... हो गया’ से ‘उसने ... उसका’ का परिवर्तन बनाए रखा गया है।
  alternative: पूरे वचन को केवल द्वितीय पुरुष या केवल तृतीय पुरुष में एकरूप करना।
  rationale: इब्रानी पाठ स्वयं द्वितीय पुरुष גָּבַהְתָּ से तृतीय पुरुष प्रत्ययों צַמַּרְתּוֹ और לְבָבוֹ की ओर बदलता है। इसे समतल कर देना मूल पाठ की शैलीगत अनियमितता और संभावित अर्थगत तनाव को छिपा देता।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध हिन्दी अपनाई गई है। ‘तू’ भविष्यद्वाणी के सीधे एकवचन संबोधन को बनाए रखता है; तृतीय पुरुष में अचानक परिवर्तन जानबूझकर सुरक्षित रखा गया है।
