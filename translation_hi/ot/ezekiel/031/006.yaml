source:
  edition: WLC
  text: בִּ/סְעַפֹּתָ֤י/ו קִֽנְנוּ֙ כָּל ע֣וֹף הַ/שָּׁמַ֔יִם וְ/תַ֤חַת פֹּֽארֹתָי/ו֙ יָֽלְד֔וּ כֹּ֖ל חַיַּ֣ת הַ/שָּׂדֶ֑ה וּ/בְ/צִלּ/וֹ֙ יֵֽשְׁב֔וּ כֹּ֖ל גּוֹיִ֥ם רַבִּֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/031/006.yaml
  text: In its branches all the birds of the heavens nested[a], and under its boughs all the beasts of the field gave birth, and in its shade all the many nations dwelt.
translation:
  language: hi
  text: उसकी शाखाओं में आकाश के सभी पक्षियों ने घोंसले बनाए, उसकी डालियों के नीचे मैदान के सभी जंगली पशुओं ने बच्चे जने, और उसकी छाया में बहुत-सी जातियाँ बसी रहीं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בִּסְעַפֹּתָיו
  choice: उसकी शाखाओं में
  rationale: סְעַפּוֹת पेड़ की बड़ी शाखाओं या शाखा-संरचना को दर्शाता है; ‘शाखाओं में’ घोंसलों के संदर्भ में सहज और सटीक है।
- source_word: קִנְנוּ
  choice: घोंसले बनाए
  rationale: क्रिया विशेषतः पक्षियों के घोंसला बनाने या घोंसला बसाने को व्यक्त करती है; सामान्य ‘रहे’ की अपेक्षा यह मूल बिंब सुरक्षित रखती है।
- source_word: עוֹף הַשָּׁמַיִם
  choice: आकाश के सभी पक्षियों
  rationale: यह आकाश में उड़ने वाले प्राणियों के लिए सामूहिक पद है; संदर्भ में ‘पक्षी’ स्वाभाविक आधुनिक हिन्दी है।
- source_word: תַחַת פֹּארֹתָיו
  choice: उसकी डालियों के नीचे
  rationale: פֹּארוֹת पत्तेदार या फैली हुई डालियों को सूचित करता है; ‘डालियाँ’ पहले पद की ‘शाखाओं’ से हल्का शब्दगत भेद बनाए रखता है।
- source_word: יָלְדוּ
  choice: बच्चे जने
  rationale: मूल क्रिया का अर्थ जन्म देना है। वन-पशुओं के लिए ‘बच्चे जने’ स्पष्ट, संक्षिप्त और स्वाभाविक है।
- source_word: כֹּל חַיַּת הַשָּׂדֶה
  choice: मैदान के सभी वन-पशुओं
  rationale: यह स्थलीय जंगली पशुओं के लिए प्रचलित इब्रानी अभिव्यक्ति है; ‘वन-पशु’ उनके जंगली होने का भाव स्पष्ट करता है।
- source_word: וּבְצִלּוֹ
  choice: उसकी छाया में
  rationale: צֵל का अर्थ छाया अथवा धूप से बचाने वाली छाँह हो सकता है; ‘छाया’ पेड़ के आश्रयकारी बिंब और रूपक दोनों को बनाए रखती है।
- source_word: יֵשְׁבוּ
  choice: बसी रहीं
  rationale: ישב यहाँ बैठने के बजाय निवास करने या बसे रहने के अर्थ में है। ‘बसी रहीं’ जातियों के दीर्घ निवास का स्वाभाविक हिन्दी रूप है।
- source_word: כֹּל גּוֹיִם רַבִּים
  choice: सभी बड़ी-बड़ी जातियाँ
  rationale: כֹּל के व्यापक भाव और רַבִּים के बहुलता/विशालता के भाव को हिन्दी में सहज रूप से व्यक्त करता है; ‘जातियाँ’ यहाँ जनसमुदायों या राष्ट्रों का बाइबलीय अर्थ रखता है।
theological_decisions:
- issue: साम्राज्य के आश्रय को दर्शाने वाला वृक्ष-रूपक
  choice: वृक्ष, पशु-पक्षी, छाया और जातियों के बिंब को बिना व्याख्यात्मक पहचान जोड़े यथावत रखा गया है।
  alternative: पद में ही वृक्ष को अश्शूर या साम्राज्य के रूप में स्पष्ट कर देना।
  rationale: यह पद विस्तृत रूपक का भाग है; अनुवाद को रूपक सुरक्षित रखना चाहिए और उसकी व्याख्या मूल पाठ में नहीं मिलानी चाहिए।
- issue: כֹּל גּוֹיִם רַבִּים का असामान्य संयोजन
  choice: ‘सभी बड़ी-बड़ी जातियाँ’ द्वारा व्यापकता और बहुलता दोनों व्यक्त की गई हैं।
  alternative: केवल ‘बहुत-सी जातियाँ’ या ‘सब जातियाँ’।
  rationale: केवल एक तत्व चुनने से כֹּל या רַבִּים का बल घट जाता; चुना हुआ रूप हिन्दी में दोनों को पठनीय ढंग से रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सरल गद्य। पेड़ के लिए स्त्रीलिंग सर्वनाम रखा गया है, क्योंकि निकटवर्ती रूपकगत संज्ञा का हिन्दी रूप स्त्रीलिंग समझा जाता है। समानार्थी इब्रानी शाखा-पदों के लिए ‘शाखाएँ’ और ‘डालियाँ’ का हल्का भेद रखा गया है।
