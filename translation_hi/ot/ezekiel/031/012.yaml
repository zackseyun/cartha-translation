source:
  edition: WLC
  text: וַ/יִּכְרְתֻ֧/הוּ זָרִ֛ים עָרִיצֵ֥י גוֹיִ֖ם וַֽ/יִּטְּשֻׁ֑/הוּ אֶל הֶ֠/הָרִים וּ/בְ/כָל גֵּ֨אָי֜וֹת נָפְל֣וּ דָלִיּוֹתָ֗י/ו וַ/תִּשָּׁבַ֤רְנָה פֹֽארֹתָי/ו֙ בְּ/כֹל֙ אֲפִיקֵ֣י הָ/אָ֔רֶץ וַ/יֵּרְד֧וּ מִ/צִּלּ֛/וֹ כָּל עַמֵּ֥י הָ/אָ֖רֶץ וַֽ/יִּטְּשֻֽׁ/הוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/031/012.yaml
  text: Foreigners[a], the ruthless of the nations, cut it down and left it. Its branches fell on the mountains and in every valley, and its boughs were broken in all the channels of the land[c][b]. Then all the peoples of the earth went down from its shade and left it.
translation:
  language: hi
  text: परदेशियों ने, जो राष्ट्रों के निर्दयी लोग थे, उसे काट गिराया और छोड़ दिया। उसकी डालियाँ पहाड़ों पर और हर घाटी में गिर पड़ीं, और उसकी शाखाएँ भूमि की सभी जलधाराओं में टूट गईं। तब पृथ्वी के सभी लोग उसकी छाया के नीचे से उतर गए और उसे छोड़ दिया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּכְרְתֻהוּ
  choice: उसे काट गिराया
  rationale: כרת वृक्ष के विस्तृत रूपक में पेड़ काटकर गिराने को व्यक्त करता है। हिन्दी का पुल्लिंग सर्वनाम ‘उसे’ देवदार तथा उसके राजनीतिक संकेत, दोनों के साथ स्वाभाविक है।
- source_word: זָרִים
  choice: परदेशियों
  rationale: यहाँ זרים राष्ट्रीय-सैनिक संदर्भ में बाहरी या विदेशी लोगों को दर्शाता है; ‘परदेशी’ सहज और गरिमापूर्ण आधुनिक हिन्दी है।
- source_word: עָרִיצֵי גוֹיִם
  choice: जो राष्ट्रों के क्रूर लोग थे
  rationale: עָרִיץ में क्रूर, हिंसक अथवा निर्दयी होने का भाव है। इब्रानी में स्पष्ट श्रेष्ठतासूचक रूप नहीं है, इसलिए ‘सबसे क्रूर’ नहीं जोड़ा गया।
- source_word: וַיִּטְּשֻׁהוּ
  choice: उसे छोड़ दिया
  rationale: נטש का अर्थ छोड़ देना या त्याग देना है। पद के आरम्भ और अन्त में आए इसी क्रियापद को समान रूप से अनूदित किया गया है।
- source_word: דָלִיּוֹתָיו
  choice: उसकी डालियाँ
  rationale: यह लटकती या फैली हुई डालियों को दर्शाता है; ‘डालियाँ’ सामान्य पाठक के लिए स्पष्ट है।
- source_word: פֹארֹתָיו
  choice: उसकी शाखाएँ
  rationale: यह पत्तेदार या बड़ी शाखाओं का शब्द है। ‘शाखाएँ’ पहले शब्द ‘डालियाँ’ से कुछ शब्दगत भेद बनाए रखता है।
- source_word: אֲפִיקֵי הָאָרֶץ
  choice: देश के सभी जलमार्गों में
  rationale: אפיקים जलधाराओं के मार्ग, नाले या नदी-नालों की तलहटियों को सूचित कर सकता है। ‘जलमार्ग’ स्थलाकृतिक चित्र को स्पष्ट रखते हुए अर्थ-सीमा को अनावश्यक रूप से संकीर्ण नहीं करता।
- source_word: וַיֵּרְדוּ מִצִּלּוֹ
  choice: उसकी छाया के नीचे से निकल गए
  rationale: शाब्दिक क्रिया ‘नीचे उतरना’ है, पर वृक्ष की छाया के प्रसंग में हिन्दी में ‘छाया के नीचे से निकल गए’ स्थानिक रूपक और आश्रय छोड़ने का आशय स्वाभाविक ढंग से व्यक्त करता है।
- source_word: כָּל עַמֵּי הָאָרֶץ
  choice: पृथ्वी के सभी लोग
  rationale: עמים सामूहिक ‘लोगों/जनसमुदायों’ को और הארץ इस अंतरराष्ट्रीय संदर्भ में पृथ्वी को सूचित करता है।
theological_decisions:
- issue: पुल्लिंग एकवचन प्रत्ययों का वृक्ष और अश्शूर/उसके शासक—दोनों से संबंध
  choice: हिन्दी में ‘उसे/उसकी’ रखा गया, जिससे देवदार का तात्कालिक रूपक बना रहता है और राजनीतिक संकेत भी बाधित नहीं होता।
  alternative: राजनीतिक संकेत को स्पष्ट करने के लिए ‘उस पुरुष/राजा’ के रूप में खोलना।
  rationale: मूल पद विस्तृत वृक्ष-रूपक को जारी रखता है। हिन्दी के सर्वनाम में अंग्रेज़ी जैसा ‘it/him’ भेद नहीं है, इसलिए मूल की अर्थगत परतें स्वाभाविक रूप से सुरक्षित रहती हैं।
translation_notes:
  register: आधुनिक मानक हिन्दी; शैली गरिमापूर्ण पर सामान्य पाठक के लिए सहज रखी गई है। इब्रानी की क्रमिक क्रियाओं और वृक्ष-रूपक को बनाए रखते हुए अस्वाभाविक शाब्दिकता से बचा गया है।
