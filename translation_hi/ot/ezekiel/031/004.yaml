source:
  edition: WLC
  text: מַ֣יִם גִּדְּל֔וּ/הוּ תְּה֖וֹם רֹֽמְמָ֑תְ/הוּ אֶת נַהֲרֹתֶ֗י/הָ הֹלֵךְ֙ סְבִיב֣וֹת מַטָּעָ֔/הּ וְ/אֶת תְּעָלֹתֶ֣י/הָ שִׁלְחָ֔ה אֶ֖ל כָּל עֲצֵ֥י הַ/שָּׂדֶֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/031/004.yaml
  text: Waters made it grow[a]; the deep made it rise high. Its rivers flowed all around its planting place[b], and it sent out its channels to all the trees of the field.
translation:
  language: hi
  text: जल ने उसे बढ़ाया; गहरे जल ने उसे ऊँचा किया। उसकी नदियाँ उसके रोपण-स्थान के चारों ओर बहती थीं, और उसने अपनी नहरें मैदान के सभी वृक्षों तक फैला दीं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מַיִם
  choice: जल
  rationale: बहुवचन रूप यहाँ सामूहिक द्रव्यवाचक अर्थ रखता है; ‘जल’ काव्यात्मक, स्वाभाविक और गरिमापूर्ण हिन्दी है।
- source_word: גִּדְּלוּהוּ
  choice: उसे बढ़ाया
  rationale: हिफ़ील अर्थ वृक्ष की वृद्धि कराने का है; इससे वृक्ष का रूपक अक्षुण्ण रहता है।
- source_word: תְּהוֹם
  choice: गहरे जल
  rationale: यह पोषण देने वाले अथाह या भूमिगत जल की ओर संकेत करता है; ‘गहरे जल’ सामान्य पाठक के लिए ‘अथाह गहराई’ से अधिक सहज है और जल-संदर्भ स्पष्ट रखता है।
- source_word: רֹמְמָתְהוּ
  choice: उसे ऊँचा किया
  rationale: रूम का कारक अर्थ ऊँचा करने का है; यह वृक्ष की ऊँचाई और साम्राज्य की महानता—दोनों संकेतों को खुला रखता है।
- source_word: נַהֲרֹתֶיהָ
  choice: उसकी नदियाँ
  rationale: स्त्रीलिंग प्रत्यय ‘गहरे जल’ से संबद्ध है; ‘नदियाँ’ נהרות का सीधा और चित्रात्मक अनुवाद है।
- source_word: הֹלֵךְ סְבִיבוֹת
  choice: चारों ओर बहती थीं
  rationale: नदियों के विषय में शाब्दिक ‘जाती थीं’ की अपेक्षा ‘बहती थीं’ स्वाभाविक हिन्दी है; ‘चारों ओर’ סְבִיבוֹת का व्यापक भाव देता है।
- source_word: מַטָּעָהּ
  choice: उसके रोपे जाने का स्थान
  rationale: यह रोपण अथवा रोपी हुई जगह को दर्शाता है; वाक्यांश कृषि-चित्र को स्पष्ट रखता है।
- source_word: תְּעָלֹתֶיהָ
  choice: अपनी नहरें
  rationale: शब्द जल पहुँचाने वाली धाराओं या सिंचाई-नालियों का द्योतक है; ‘नहरें’ सहज आधुनिक हिन्दी है।
- source_word: שִׁלְחָה
  choice: पहुँचाईं
  rationale: मूलतः ‘भेजीं’; नहरों को वृक्षों तक पहुँचाने के अर्थ में यह स्वाभाविक हिन्दी है और विस्तार का भाव सुरक्षित रखता है।
- source_word: אֶל כָּל עֲצֵי הַשָּׂדֶה
  choice: मैदान के सब वृक्षों तक
  rationale: ‘मैदान के वृक्ष’ बाइबलीय प्राकृतिक परिदृश्य को बनाए रखता है; ‘तक’ जलमार्गों के गंतव्य को स्पष्ट करता है।
theological_decisions:
- issue: मिश्रित रूपक में सर्वनाम का संदर्भ
  choice: संदर्भ के अनुसार वृक्ष और गहरे जल के लिए हिन्दी के व्याकरणानुकूल सर्वनाम रखे गए
  alternative: सभी सर्वनामों को प्रत्यक्षतः अश्शूर या उसके शासक के लिए पुल्लिंग व्यक्तिगत रूप में देना
  rationale: पद तत्काल स्तर पर वृक्ष और उसे सींचने वाली जल-व्यवस्था का रूपक प्रस्तुत करता है। राजनीतिक अभिप्राय को सीधे पाठ में आरोपित न करने से रूपक और उसकी व्याख्यात्मक गुंजाइश बनी रहती है।
- issue: רֹמְמָתְהוּ में भौतिक ऊँचाई और प्रतिष्ठा
  choice: उसे ऊँचा किया
  alternative: उसकी महिमा बढ़ाई
  rationale: ‘ऊँचा किया’ वृक्ष की वास्तविक ऊँचाई और साम्राज्य के उत्कर्ष—दोनों अर्थों को संभव रखता है; ‘महिमा’ रूपक को समय से पहले राजनीतिक-धार्मिक अर्थ में सीमित कर देती।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल किंतु गरिमापूर्ण काव्यात्मक गद्य। वृक्ष और जल के विस्तृत रूपक को बनाए रखते हुए अत्यधिक संस्कृतनिष्ठ या तकनीकी शब्दावली से बचा गया है।
