  yaml_path: translation/ot/ezekiel/031/002.yaml
  text: 'Son of man, say to Pharaoh king of Egypt and to his multitude: Whom are you like in your greatness?'
translation:
  language: hi
  text: '“हे मनुष्य के पुत्र, मिस्र के राजा फ़िरौन और उसकी भीड़ से कह: ‘अपनी महानता में तू किसके समान है?’”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֶּן־אָדָם
  choice: मनुष्य के पुत्र
  rationale: इब्रानी संबोधन का निकट और प्रतिष्ठित हिन्दी रूप; यह नबी की मानवीय स्थिति को व्यक्त करता है।
- source_word: הֲמוֹנוֹ
  choice: उसकी भीड़
  rationale: הָמוֹן यहाँ फ़िरौन से संबद्ध जनसमूह या विशाल समुदाय को सूचित करता है; ‘भीड़’ मूल की व्यापकता और सामूहिक भाव बनाए रखता है।
- source_word: בְגָדְלֶךָ
  choice: अपनी महानता में
  rationale: בְּ उपसर्ग और גֹּדֶל के भाव को सीधे रखता है; आकार, वैभव और सामर्थ्य की संभावित व्यापकता को किसी एक अर्थ तक सीमित नहीं करता।
theological_decisions:
- issue: ‘मनुष्य के पुत्र’ संबोधन का अर्थ
  choice: इसे शाब्दिक भविष्यवाणी-संबोधन के रूप में रखा गया है।
  alternative: ‘हे मनुष्य’
  rationale: यहेजकेल में यह नबी के लिए बार-बार प्रयुक्त इब्रानी संबोधन है; शाब्दिक रूप पाठ की अंतर्पाठीय पहचान बनाए रखता है और बाद की विशिष्ट मसीही उपाधि को यहाँ आरोपित नहीं करता।
- issue: महानता की तुलना का प्रश्न
  choice: ‘तू किसके समान है?’
  alternative: ‘तेरी महानता की तुलना किससे हो सकती है?’
  rationale: प्रत्यक्ष प्रश्न मूल की अलंकारिक तीक्ष्णता और आगामी तुलना के लिए उसका खुलापन बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण भविष्यवाणी-शैली अपनाई गई है। फ़िरौन को संबोधित एकवचन रूप के लिए ‘तू’ रखा गया है, क्योंकि मूल में दूसरा पुरुष एकवचन है और यह अनादर की अपेक्षा सीधे, अधिकारपूर्ण दैवी संबोधन को दर्शाता है।
