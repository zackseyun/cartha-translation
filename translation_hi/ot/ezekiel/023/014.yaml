  text: וַ/תּ֖וֹסֶף אֶל תַּזְנוּתֶ֑י/הָ וַ/תֵּ֗רֶא אַנְשֵׁי֙ מְחֻקֶּ֣ה עַל הַ/קִּ֔יר צַלְמֵ֣י כשדיים חֲקֻקִ֖ים בַּ/שָּׁשַֽׁר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/023/014.yaml
  text: Then she added to her acts of prostitution[a], and she saw men portrayed on the wall, images of Chaldeans portrayed in vermilion[b],
translation:
  language: hi
  text: तब उसने अपनी वेश्यावृत्ति के काम और बढ़ाए। उसने दीवार पर चित्रित पुरुषों को देखा—कसदियों[a] के चित्र, जो सिंदूरी रंग[b] में अंकित थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “बाबेलवासियों के चित्र”; इब्रानी में “कसदियों” है, जो बाबेल से जुड़े लोग थे।
    reason: lexical_alternative
  - marker: b
    text: अर्थात् चमकीला लाल वर्णक; इसे “लाल रंग” भी कहा जा सकता है। सम्भवतः यहाँ सिनेबार जैसे खनिज रंग का संकेत है, पर ठीक पहचान निश्चित नहीं है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתּוֹסֶף אֶל תַּזְנוּתֶיהָ
  choice: तब वह अपने वेश्यागमन के कामों को और बढ़ाती गई
  rationale: ‘और बढ़ाती गई’ יסף की वृद्धि/जोड़ने की धारणा और कथा की प्रगति को स्वाभाविक हिन्दी में व्यक्त करता है। ‘वेश्यागमन के काम’ बहुवचन तथा यहेजकेल की जानबूझकर तीखी यौन उपमा को बनाए रखता है।
- source_word: וַתֵּרֶא אַנְשֵׁי מְחֻקֶּה עַל הַקִּיר
  choice: उसने दीवार पर अंकित पुरुषों को देखा
  rationale: ראה का सीधा अर्थ ‘देखा’ है। חקה से बने रूप के लिए ‘अंकित’ ऐसा दृश्य चित्रण बताता है जो दीवार पर बनाया या उकेरा गया हो, पर माध्यम के विषय में आवश्यकता से अधिक निश्चित नहीं होता।
- source_word: צַלְמֵי כשדיים
  choice: कसदियों के चित्र
  rationale: ‘कसदी’ मूल जातीय-राजनीतिक नाम को सुरक्षित रखता है; बाबेल से उसका संबंध पादटिप्पणी में स्पष्ट किया गया है। צַלְמֵי का स्वाभाविक हिन्दी रूप ‘चित्र’ है।
- source_word: חֲקֻקִים
  choice: उकेरे गए थे
  rationale: यह उसी חקה धातु का दूसरा रूप है और चित्रों के अंकन/उत्कीर्णन का बोध कराता है। ‘उकेरे’ मूल की ठोस चित्रण-भाषा को बनाए रखता है।
- source_word: בַּשָּׁשַׁר
  choice: सिंदूरी लाल रंग से
  rationale: שָׁשַׁר एक चमकीले लाल वर्णक को सूचित करता है। ‘सिंदूरी लाल रंग’ आधुनिक हिन्दी में बोधगम्य है, जबकि ठीक खनिज की पहचान अनिश्चित है।
theological_decisions:
- issue: वाचा के प्रति विश्वासघात के लिए यौन रूपक
  choice: ‘वेश्यागमन के कामों’ को मुख्य पाठ में बनाए रखा
  alternative: ‘विश्वासघात के काम’ या केवल ‘बेवफाई’
  rationale: यहेजकेल की भाषा जानबूझकर तीखी और यौन रूपक वाली है। इसे सामान्य ‘बेवफाई’ में बदलना भविष्यद्वाणी के आघात और रूपक की विशिष्टता को कम कर देता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। मूल की तीखी यौन उपमा को नरम नहीं किया गया। ‘अंकित’ और ‘उकेरे’ חקה की पुनरावृत्ति को हिन्दी में निकट अर्थ वाले शब्दों से दर्शाते हैं। पादटिप्पणी-चिह्न उन्हीं शब्दों के बाद रखे गए हैं जिनकी व्याख्या वे करते हैं।
