lexical_decisions:
- source_word: וַיְהִי
  choice: फिर ... पहुँचा
  rationale: वाव-क्रमिक रूप यहाँ कथा में अगले प्रसंग का परिचय देता है। ‘फिर’ स्वाभाविक हिन्दी में क्रम बनाए रखता है, जबकि ‘पहुँचा’ वचन के आगमन की इब्रानी भविष्यद्वक्ताई अभिव्यक्ति को सहज रूप देता है।
- source_word: דְבַר
  choice: वचन
  rationale: भविष्यद्वक्ताई सूत्र में דָּבָר परमेश्वर से मिले वचन या संदेश को दर्शाता है। ‘वचन’ इस स्थापित बाइबलीय प्रयोग और रचनात्मक संबंध, दोनों को सुरक्षित रखता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: मूल पाठ में परमेश्वर का व्यक्तिगत नाम יהוה है। आधुनिक हिन्दी के परिचित लिप्यंतरण ‘यहोवा’ द्वारा इसे किसी उपाधि से बदलने के बजाय नाम के रूप में रखा गया है।
- source_word: אֵלַי
  choice: मेरे पास
  rationale: पूर्वसर्ग और प्रथम पुरुष एकवचन प्रत्यय वचन के भविष्यद्वक्ता की ओर आने को बताते हैं; ‘मेरे पास पहुँचा’ आधुनिक हिन्दी में स्वाभाविक है।
- source_word: לֵאמֹר
  choice: ':'
  rationale: यह infinitive construct आगे आने वाली प्रत्यक्ष वाणी का परिचय देता है। हिन्दी में पद के अंत का द्विबिंदु इस कार्य को ‘यह कहते हुए’ की अपेक्षा अधिक स्वाभाविक और संक्षिप्त रूप में व्यक्त करता है।
theological_decisions:
- issue: दिव्य नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: यहाँ मूल में चार अक्षरों वाला दिव्य नाम सीधे प्रयुक्त है। हिन्दी पाठकों में प्रचलित नामरूप ‘यहोवा’ व्यक्तिगत नाम को बनाए रखता है; इसे ‘प्रभु’ जैसी उपाधि से प्रतिस्थापित नहीं किया गया। उच्चारण के पुनर्निर्माण को लेकर मतांतर फुटनोट में बताया गया है।
