base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/023/035.yaml
  text: 'Therefore thus says the Lord GOD: Because you have forgotten me and cast me behind your back[a], you also must bear your lewdness and your prostitutions.'
translation:
  language: hi
  text: 'इसलिए प्रभु याहवे यों कहता है: क्योंकि तू मुझे भूल गई और मुझे अपनी पीठ के पीछे फेंक दिया[a], इसलिए तू भी अपनी अश्लीलता और अपने वेश्यागमन के कामों का भार उठा।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘और मुझे अपनी पीठ के पीछे डाल दिया।’ यह इब्रानी मुहावरा जानबूझकर ठुकराने या उपेक्षा करने का भाव व्यक्त करता है।
    reason: शाब्दिक विकल्प और इब्रानी मुहावरे का निहित अर्थ दोनों स्पष्ट करता है।
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  choice: प्रभु यहोवा
