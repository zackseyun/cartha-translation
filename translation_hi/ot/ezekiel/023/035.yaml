- source_word: יַעַן
  choice: क्योंकि
  rationale: यह न्याय के कारण का परिचय देता है; आधुनिक हिन्दी में ‘क्योंकि’ स्पष्ट और स्वाभाविक है।
- source_word: שָׁכַחַתְּ אוֹתִי
  choice: तू मुझे भूल गई
  rationale: स्त्रीलिंग एकवचन संबोधन को स्पष्ट रखा गया है और पूर्ण क्रिया को स्वाभाविक हिन्दी भूतकाल में व्यक्त किया गया है।
- source_word: וַתַּשְׁלִיכִי אוֹתִי אַחֲרֵי גַוֵּךְ
  choice: तूने मुझे अपनी पीठ के पीछे फेंक दिया
  rationale: जानबूझकर ठुकराने और उपेक्षा करने का सजीव इब्रानी मुहावरा यथासंभव सुरक्षित रखा गया है।
- source_word: וְגַם אַתְּ
  choice: इसलिए अब तू भी
  rationale: परिणाम और संबोधित स्त्री पर पड़े बल, दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: שְׂאִי
  choice: फल भोग
  rationale: आज्ञार्थक रूप यहाँ न्यायिक परिणाम सुनाता है; ‘फल भोग’ दंड के अनिवार्य परिणाम को स्वाभाविक हिन्दी में बताता है।
- source_word: זִמָּתֵךְ
  choice: अपनी अश्लीलता
  rationale: संदर्भ में यह घोर यौन दुराचार और निर्लज्ज आचरण को सूचित करता है; ‘अश्लीलता’ उसकी तीव्रता बनाए रखती है।
- source_word: תַּזְנוּתָיִךְ
  choice: अपने वेश्यागमन
  rationale: यह बहुवचन रूप बार-बार किए गए वेश्याचार को समष्टिगत रूप में व्यक्त करता है; ‘वेश्यागमन’ संदर्भ के यौन और वाचा-विरोधी रूपक को बनाए रखता है।
theological_decisions:
- issue: אֲדֹנָי יְהוִה में दिव्य नाम का अनुवाद
  choice: प्रभु यहोवा
  alternative: प्रभु याहवे
  rationale: हिन्दी बाइबलीय प्रयोग में ‘यहोवा’ पहचाना हुआ नाम-रूप है और मूल पाठ में आए व्यक्तिगत दिव्य नाम को सामान्य उपाधि में विलीन नहीं करता।
- issue: यौन भाषा का वाचा-विरोधी रूपक
  choice: अश्लीलता और वेश्यागमन की स्पष्ट भाषा बनाए रखी गई
  alternative: दुष्टता और विश्वासघात
  rationale: व्यापक धार्मिक विश्वासघात अभिप्रेत हो सकता है, पर मूल पद जानबूझकर यौन रूपक और उसके कठोर स्वर का प्रयोग करता है; उसे सामान्यीकृत नहीं किया गया।
