  text: וַ/יָּבֹ֨אוּ אֵלֶ֤י/הָ בְנֵֽי בָבֶל֙ לְ/מִשְׁכַּ֣ב דֹּדִ֔ים וַ/יְטַמְּא֥וּ אוֹתָ֖/הּ בְּ/תַזְנוּתָ֑/ם וַ/תִּ֨טְמָא בָ֔/ם וַ/תֵּ֥קַע נַפְשָׁ֖/הּ מֵ/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/023/017.yaml
  text: Then the sons of Babylon came to her[a], to the bed of love, and they defiled her with their prostitution; and she was defiled by them[c][b], and her soul was alienated from them.
translation:
  language: hi
  text: तब बाबेल के लोग[a] उसके पास प्रेम की शय्या पर[b] आए। उन्होंने अपने व्यभिचार से उसे अशुद्ध कर दिया; वह उनके द्वारा अशुद्ध हुई, और उसका मन उनसे फिर गया[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, ‘बाबेल के पुत्र’; अथवा ‘बाबेल के पुरुष।’
    reason: lexical_alternative
  - marker: b
    text: अथवा ‘प्रेम-क्रीड़ा की शय्या पर।’
    reason: lexical_alternative
  - marker: c
    text: अथवा ‘वह उनसे विरक्त हो गई,’ ‘वह उनसे घृणा करने लगी,’ या ‘उसका जी उनसे उचट गया।’
    reason: lexical_alternative
lexical_decisions:
- source_word: בְנֵי בָבֶל
  choice: बाबेल के लोग
  rationale: शाब्दिक रूप ‘बाबेल के पुत्र’ है, पर इस सामूहिक इब्रानी अभिव्यक्ति का स्वाभाविक आधुनिक हिन्दी अर्थ ‘बाबेल के लोग’ है; प्रसंग में विशेषतः पुरुष अभिप्रेत हैं।
- source_word: לְמִשְׁכַּב דֹּדִים
  choice: प्रेम की शय्या पर
  rationale: מִשְׁכָּב शय्या अथवा लेटने का स्थान और דֹּדִים इस कामुक प्रसंग में प्रेम अथवा प्रेम-क्रीड़ा को सूचित करता है। यह चयन मूल रूपक और यौन आशय दोनों बनाए रखता है।
- source_word: וַיְטַמְּאוּ אֹתָהּ
  choice: उन्होंने ... उसे अशुद्ध कर दिया
  rationale: טמא का यहाँ नैतिक, यौन और अनुष्ठानिक अशुद्धता से जुड़ा अर्थ है। ‘अशुद्ध कर दिया’ इस बहुस्तरीय अर्थ को सुरक्षित रखता है।
- source_word: בְּתַזְנוּתָם
  choice: अपने व्यभिचार से
  rationale: זְנוּת वेश्याचार, व्यभिचार अथवा यौन अनैतिकता का द्योतक है और यहेजकेल में राजनीतिक-धार्मिक विश्वासघात का रूपक भी है। ‘व्यभिचार’ आधुनिक हिन्दी में स्पष्ट और गरिमापूर्ण है।
- source_word: וַתִּטְמָא בָם
  choice: वह उनके द्वारा अशुद्ध हुई
  rationale: यह पद उसके अशुद्ध हो जाने के परिणाम को दुहराकर उभारता है; בָם को यहाँ कर्तृत्व/साधन के अर्थ में ‘उनके द्वारा’ व्यक्त किया गया है।
- source_word: וַתֵּקַע נַפְשָׁהּ מֵהֶם
  choice: उसका मन उनसे उचट गया
  rationale: नֶפֶשׁ सहित यह दुर्लभ मुहावरा विमुखता, वितृष्णा अथवा घृणा की ओर संकेत करता है। ‘मन उचट गया’ भावात्मक दूरी और परिवर्तन दोनों को स्वाभाविक हिन्दी में रखता है, बिना इसे केवल तीव्र घृणा तक सीमित किए।
theological_decisions:
- issue: भविष्यद्वाणी के रूपक में यौन और नैतिक भाषा
  choice: यौन रूपक, व्यभिचार और अशुद्धता की भाषा को स्पष्ट रूप से बनाए रखा गया है।
  alternative: इसे केवल विदेशी राजनीतिक गठबंधन की भाषा में नरम कर देना।
  rationale: इब्रानी पाठ जानबूझकर यौन रूपक के द्वारा ओहोलीबा/यरूशलेम की राजनीतिक और आध्यात्मिक विश्वासघातपूर्ण संलिप्तता दिखाता है; रूपक को हटाने से भविष्यद्वाणी की धार मंद हो जाएगी।
- issue: अंतिम मुहावरे में घृणा बनाम विमुखता
  choice: ‘उसका मन उनसे उचट गया’
  alternative: ‘उसने उनसे घृणा की’ अथवा ‘उसका प्राण उनसे अलग हो गया।’
  rationale: मूल मुहावरा वितृष्णा और संबंध-विच्छेद दोनों की गुंजाइश रखता है। चुना हुआ पाठ इस तनाव को बनाए रखता है और किसी एक भाव को अनावश्यक रूप से निर्णायक नहीं बनाता।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘शय्या’ और ‘अशुद्ध’ जैसे शब्द भविष्यद्वाणी की गंभीर शैली तथा नैतिक-अनुष्ठानिक अर्थ बनाए रखते हैं, जबकि ‘मन उचट गया’ अंतिम इब्रानी मुहावरे को सामान्य पाठक के लिए स्वाभाविक बनाता है।
