  text: וָ/אֵ֖רֶא כִּ֣י נִטְמָ֑אָה דֶּ֥רֶךְ אֶחָ֖ד לִ/שְׁתֵּי/הֶֽן׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/023/013.yaml
  text: And I saw that she had become unclean[b][a]; both of them followed the same way.
translation:
  language: hi
  text: तब मैंने देखा कि वह अशुद्ध हो गई थी[a]; दोनों की राह एक ही थी[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वह अशुद्ध थी” अथवा “वह अशुद्ध की गई थी।” इब्रानी क्रिया अवस्था या अशुद्ध हो जाने का भाव दे सकती है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “दोनों के लिए एक ही राह थी।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֵרֶא
  choice: तब मैंने देखा
  rationale: ראה के प्रथम पुरुष एकवचन कथात्मक रूप को बनाए रखते हुए ‘तब’ घटनाक्रम में इस निरीक्षण को स्वाभाविक ढंग से जोड़ता है।
- source_word: כִּי
  choice: कि
  rationale: यहाँ כִּי देखी गई बात का कथन आरम्भ करता है; हिन्दी में ‘कि’ इसका स्वाभाविक समतुल्य है।
- source_word: נִטְמָאָה
  choice: वह अशुद्ध हो गई थी
  rationale: טמא के निफ़अल पूर्ण स्त्रीलिंग एकवचन में अवस्था और उस अवस्था में आ जाने—दोनों का भाव संभव है। ‘अशुद्ध हो गई थी’ इस परिणामगत भाव को व्यक्त करता है, पर कर्तृवाच्य अर्थ को अनावश्यक रूप से नहीं थोपता।
- source_word: דֶּרֶךְ אֶחָד
  choice: राह एक ही थी
  rationale: דֶּרֶךְ आचरण या जीवन-क्रम का रूपक है और אֶחָד दोनों के साझा ढंग को दिखाता है। ‘राह एक ही थी’ हिन्दी में रूपक और मूल वाक्य-संरचना दोनों को सहज रूप से रखता है।
- source_word: לִשְׁתֵּיהֶן
  choice: दोनों की
  rationale: यह पद उस एक राह को दोनों स्त्रियों से सम्बद्ध करता है; ‘दोनों की’ संक्षिप्त और स्वाभाविक हिन्दी है।
theological_decisions:
- issue: ओहोला और ओहोलीबा के रूपक में अशुद्धता
  choice: ‘वह अशुद्ध हो गई थी’ द्वारा नैतिक और उपासना-संबंधी अशुद्धता का गंभीर भाव बनाए रखा गया है।
  alternative: ‘वह अशुद्ध की गई थी’ या ‘उसने अपने आपको अशुद्ध कर लिया था।’
  rationale: इब्रानी निफ़अल को केवल बाहरी कर्म का निष्क्रिय परिणाम या स्पष्ट आत्मवाचक कर्म मानना आवश्यक नहीं है। चुना हुआ पाठ उसके आचरण से उत्पन्न अवस्था को व्यक्त करता है और मूल की वास्तविक अर्थगत गुंजाइश को खुला रखता है।
- issue: दोनों बहनों के समान आचरण का रूपक
  choice: ‘दोनों की राह एक ही थी’
  alternative: ‘दोनों एक ही राह पर चली थीं।’
  rationale: चुना हुआ रूप इब्रानी के संक्षिप्त नामवाचक कथन और ‘राह’ के नैतिक रूपक को बनाए रखता है, बिना कोई अतिरिक्त क्रिया जोड़कर अर्थ को अधिक स्पष्ट करने के।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और सहज शैली अपनाई गई है। ‘अशुद्ध’ अध्याय के नैतिक तथा उपासना-संबंधी संदर्भ को बनाए रखता है, जबकि ‘राह’ आचरण के मूल इब्रानी रूपक को सुरक्षित रखती है।
