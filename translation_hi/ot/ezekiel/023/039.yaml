source:
  edition: WLC
  text: וּֽ/בְ/שַׁחֲטָ֤/ם אֶת בְּנֵי/הֶם֙ לְ/גִלּ֣וּלֵי/הֶ֔ם וַ/יָּבֹ֧אוּ אֶל מִקְדָּשִׁ֛/י בַּ/יּ֥וֹם הַ/ה֖וּא לְ/חַלְּל֑/וֹ וְ/הִנֵּה כֹ֥ה עָשׂ֖וּ בְּ/ת֥וֹךְ בֵּיתִֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/023/039.yaml
  text: For when they slaughtered their sons for their idols, they came into my sanctuary on that same day to defile it. Look—this is what they did within my house.
translation:
  language: hi
  text: जब उन्होंने अपनी मूर्तियों के लिए अपने बेटों का वध किया, तब उसी दिन वे मेरे पवित्रस्थान में उसे अपवित्र करने आए। देखो—उन्होंने मेरे भवन के भीतर ऐसा किया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבְשַׁחֲטָם
  choice: जब उन्होंने ... वध किया
  rationale: שׁחט का मूल अर्थ गला काटकर मारना या वध करना है; ‘वध’ बलिदानात्मक हिंसा की गंभीरता बनाए रखता है। आरंभिक וּ को प्रसंगगत कारणसूचक संबंध के अनुसार ‘क्योंकि’ से व्यक्त किया गया है।
- source_word: לְגִלּוּלֵיהֶם
  choice: अपनी मूर्तियों के लिए
  rationale: גִּלּוּלִים मूर्तियों के लिए तिरस्कारपूर्ण शब्द है। सहज हिन्दी में ‘मूर्तियाँ’ स्पष्ट है; ‘घृणित मूर्तियाँ’ जैसी व्याख्यात्मक वृद्धि नहीं की गई।
- source_word: מִקְדָּשִׁי
  choice: मेरे पवित्रस्थान
  rationale: מִקְדָּשׁ उस समर्पित पवित्र स्थान को बताता है; संयुक्त रूप ‘पवित्रस्थान’ हिन्दी बाइबिलीय गरिमा और स्रोत की संक्षिप्तता बनाए रखता है।
- source_word: לְחַלְּלוֹ
  choice: उसे अपवित्र करने
  rationale: חלל पवित्रता का उल्लंघन करने या अपवित्र ठहराने का भाव देता है; सर्वनाम का संदर्भ निकटवर्ती ‘पवित्रस्थान’ है।
- source_word: וְהִנֵּה
  choice: देखो—
  rationale: הִנֵּה ध्यान आकर्षित करने वाला उद्गार है। ‘देखो’ आधुनिक और स्वाभाविक है, तथा डैश अगले आरोप पर बल देता है।
- source_word: בֵּיתִי
  choice: मेरे भवन
  rationale: בַּיִת का शाब्दिक अर्थ ‘घर/भवन’ है। ‘भवन’ ईश्वर के मंदिर-संदर्भ में स्वाभाविक है और पहले आए ‘पवित्रस्थान’ से शब्दगत भेद बनाए रखता है।
theological_decisions:
- issue: बेटों की हत्या और मूर्तिपूजा का संबंध
  choice: ‘अपनी मूर्तियों के लिए अपने बेटों का वध किया’
  alternative: ‘अपने बेटों को अपनी मूर्तियों के आगे बलि चढ़ाया’
  rationale: स्रोत में שׁחט (‘वध करना’) और לְ (‘के लिए’) है; ‘बलि चढ़ाया’ संभावित आशय स्पष्ट करता, पर स्रोत के शब्द से अधिक विशिष्ट धार्मिक क्रिया जोड़ देता।
- issue: उसी दिन पवित्रस्थान का अपवित्रीकरण
  choice: दोनों कार्यों की तत्काल निकटता स्पष्ट रखी गई
  alternative: मंदिर-प्रवेश को केवल सामान्य पाखंड के रूप में व्याख्यायित करना
  rationale: בַּיּוֹם הַהוּא स्पष्टतः ‘उसी दिन’ कहता है; अनुवाद आरोप की तीव्रता रखता है, पर अतिरिक्त धर्मवैज्ञानिक व्याख्या नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी, गंभीर भविष्यद्वक्तीय स्वर। वाक्य सहज रखा गया है, पर ‘वध’, ‘पवित्रस्थान’ और ‘अपवित्र’ जैसे गरिमापूर्ण शब्द स्रोत की कठोरता तथा पवित्रता-संबंधी शब्दावली को बनाए रखते हैं।
