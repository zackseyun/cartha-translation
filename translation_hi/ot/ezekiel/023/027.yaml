source:
  edition: WLC
  text: וְ/הִשְׁבַּתִּ֤י זִמָּתֵ/ךְ֙ מִמֵּ֔/ךְ וְ/אֶת זְנוּתֵ֖/ךְ מֵ/אֶ֣רֶץ מִצְרָ֑יִם וְ/לֹֽא תִשְׂאִ֤י עֵינַ֨יִ/ךְ֙ אֲלֵי/הֶ֔ם וּ/מִצְרַ֖יִם לֹ֥א תִזְכְּרִי עֽוֹד־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/023/027.yaml
  text: So I will put an end to your lewdness from you[a], and your prostitution from the land of Egypt; and you will not lift up your eyes to them[b], and you will remember Egypt no more.
translation:
  language: hi
  text: इस प्रकार मैं तुझमें से तेरी लंपटता और मिस्र देश से उपजी तेरी वेश्यावृत्ति को समाप्त कर दूँगा। तब तू उनकी ओर अपनी आँखें नहीं उठाएगी[a], और मिस्र को फिर कभी याद नहीं करेगी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तू उनकी ओर नहीं देखेगी।” “किसी की ओर आँखें उठाना” चाह, ध्यान या उस पर निर्भरता का संकेत दे सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִשְׁבַּתִּי
  choice: मैं…दूर कर दूँगा…का अन्त कर दूँगा
  rationale: שׁבת के हिफ़ील रूप का कारक अर्थ है कि परमेश्वर इन आचरणों को रुकवा देगा। हिन्दी में दो समानान्तर कर्मों के साथ यह अभिव्यक्ति स्वाभाविक है और समाप्ति का बल बनाए रखती है।
- source_word: זִמָּתֵךְ
  choice: तेरी लंपटता
  rationale: यहाँ זִמָּה सामान्य दुष्टता नहीं, बल्कि निर्लज्ज कामुक दुराचार को दर्शाता है। ‘लंपटता’ इस यौन और नैतिक अर्थ को संक्षेप में व्यक्त करती है।
- source_word: מִמֵּךְ
  choice: तुझमें से दूर
  rationale: यह पद व्यक्तिरूप में संबोधित नगर से उस आचरण को हटाने का चित्र प्रस्तुत करता है; ‘तुझमें से दूर’ उस निष्कासन के भाव को स्वाभाविक हिन्दी में रखता है।
- source_word: וְאֶת זְנוּתֵךְ מֵאֶרֶץ מִצְרָיִם
  choice: और मिस्र देश से चली आ रही तेरी वेश्यावृत्ति
  rationale: זְנוּת के स्पष्ट वेश्यावृत्ति-रूपक को बनाए रखा गया है। מֵאֶרֶץ מִצְרָיִם उसके मिस्र से आरम्भ या प्राप्त होने की पृष्ठभूमि बताता है; ‘से चली आ रही’ इस सम्बन्ध को सहज हिन्दी में व्यक्त करता है।
- source_word: לֹא תִשְׂאִי עֵינַיִךְ אֲלֵיהֶם
  choice: तू उनकी ओर अपनी आँखें नहीं उठाएगी
  rationale: हिब्रू मुहावरे के दृश्य बिम्ब को बनाए रखा गया है, क्योंकि इसमें चाह, ध्यान या आश्रय लेने के भावों में से एक से अधिक निहित हो सकते हैं।
- source_word: וּמִצְרַיִם לֹא תִזְכְּרִי עוֹד
  choice: और मिस्र को फिर कभी याद नहीं करेगी
  rationale: यह अनुवाद עוֹד के समाप्ति-बोध और वाक्य के स्त्रीलिंग एकवचन सम्बोधन, दोनों को स्पष्ट रखता है।
theological_decisions:
- issue: भविष्यद्वाणी में यौन रूपक का स्वरूप
  choice: ‘लंपटता’ और ‘वेश्यावृत्ति’ के प्रत्यक्ष यौन रूपक को बनाए रखा गया है।
  alternative: इसे केवल ‘अनैतिकता’ या ‘विश्वासघात’ जैसे सामान्य शब्दों में नरम करना।
  rationale: यहेजकेल का मूल पाठ यरूशलेम की मूर्तिपूजक और राजनीतिक बेवफ़ाई को जानबूझकर तीखे यौन रूपक में प्रस्तुत करता है; इसे सामान्य नैतिक भाषा में बदलना भविष्यद्वाणी की धार को घटा देता।
- issue: ‘उनकी ओर आँखें उठाना’ का आशय
  choice: मुहावरे को ज्यों का त्यों बिम्बात्मक रूप में रखा गया है।
  alternative: इसे केवल ‘उनकी लालसा करना’ या ‘सहायता के लिए उनकी ओर देखना’ कहना।
  rationale: सन्दर्भ में इच्छा, ध्यान और निर्भरता—सभी की सम्भावना है। मूल पाठ किसी एक अर्थ तक सीमित नहीं करता, इसलिए अनुवाद भी इस अर्थगत तनाव को खुला रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में स्त्रीलिंग एकवचन ‘तू’ रखा गया है, क्योंकि सम्बोधन व्यक्तिरूप में प्रस्तुत ओहोलीबा/यरूशलेम से है। भाषा स्पष्ट और गरिमापूर्ण है, पर मूल की कठोर यौन शब्दावली को अनावश्यक रूप से नरम नहीं किया गया।
