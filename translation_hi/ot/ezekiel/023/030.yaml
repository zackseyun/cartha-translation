source:
  edition: WLC
  text: עָשֹׂ֥ה אֵ֖לֶּה לָ֑/ךְ בִּ/זְנוֹתֵ/ךְ֙ אַחֲרֵ֣י גוֹיִ֔ם עַ֥ל אֲשֶׁר נִטְמֵ֖את בְּ/גִלּוּלֵי/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/023/030.yaml
  text: These things are done to you because of your prostitution after the nations[a], because you defiled yourself with their idols.
translation:
  language: hi
  text: यह सब तेरे साथ इसलिए किया जाएगा, क्योंकि तू जातियों के पीछे वेश्यावृत्ति करती रही और उनकी मूर्तियों[a] से अपने को अशुद्ध करती रही।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी शब्द गिल्लूलीम मूर्तियों के लिए तिरस्कारसूचक शब्द है; इसका भाव ‘गंदी मूर्तियाँ’ या ‘मल-जैसी घृणित मूर्तियाँ’ भी हो सकता है।
    reason: मूल इब्रानी शब्द का अपमानसूचक अर्थ सामान्य शब्द ‘मूर्तियाँ’ में पूरी तरह प्रकट नहीं होता।
lexical_decisions:
- source_word: עָשֹׂה אֵלֶּה לָךְ
  choice: यह सब तेरे साथ किया जाएगा
  rationale: यह पद पिछले पदों में बताए गए दंडों की ओर संकेत करता है। इब्रानी अभिव्यक्ति में कर्ता स्पष्ट नहीं है, इसलिए हिन्दी में कर्मवाच्य रखा गया है और प्रसंगानुसार भावी दंड का बोध कराया गया है।
- source_word: בִּזְנוֹתֵךְ
  choice: तू ... वेश्यागमन करती रही
  rationale: זנה की जानबूझकर प्रयुक्त यौन उपमा को बनाए रखा गया है; इसे केवल ‘विश्वासघात’ या ‘मूर्तिपूजा’ कहना मूल रूपक को सपाट कर देता। उपसर्ग ב को यहाँ कारणसूचक माना गया है।
- source_word: אַחֲרֵי גוֹיִם
  choice: जातियों के पीछे
  rationale: אַחֲרֵי में पीछे जाने या पीछा करने का चित्र है। גוֹיִם का सीधा अर्थ ‘जातियाँ’ है और यहाँ आसपास की गैर-इस्राएली जातियाँ अभिप्रेत हैं।
- source_word: נִטְמֵאת
  choice: अपने को अशुद्ध करती रही
  rationale: निफ़अल रूप को यहाँ उत्तरदायित्व सहित आत्मवाचक अर्थ में लिया गया है; इससे धार्मिक अशुद्धता और उस स्त्रीरूप नगर की सक्रिय दोषिता दोनों व्यक्त होती हैं।
- source_word: בְּגִלּוּלֵיהֶם
  choice: उनकी मूर्तियों से
  rationale: ב को साधनसूचक ‘से’ के रूप में अनूदित किया गया है। גִּלּוּלִים का तिरस्कारपूर्ण भाव मुख्य पाठ में असहज शब्द गढ़े बिना पादटिप्पणी में सुरक्षित रखा गया है।
theological_decisions:
- issue: वाचा के विश्वासघात के लिए यौन रूपक
  choice: वेश्यागमन
  alternative: विश्वासघात / मूर्तिपूजा
  rationale: यहेजकेल का मूल पाठ जानबूझकर यौन रूपक का प्रयोग करता है। ‘विश्वासघात’ या ‘मूर्तिपूजा’ उसका अर्थ समझाते तो हैं, पर रूपक की तीव्रता मिटा देते हैं।
- issue: גִּלּוּלִים का तिरस्कारपूर्ण अर्थ
  choice: मुख्य पाठ में ‘मूर्तियाँ’, पादटिप्पणी में तिरस्कारसूचक अर्थ
  alternative: गंदी मूर्तियाँ / मल-मूर्तियाँ
  rationale: सीधा कठोर पर्याय आधुनिक हिन्दी में कृत्रिम या भ्रामक लग सकता है; इसलिए पठनीय मुख्य पाठ के साथ मूल का अपमानसूचक भाव पादटिप्पणी में दिया गया है।
- issue: दंड का कर्ता स्पष्ट न करना
  choice: 'कर्मवाच्य: ‘किया जाएगा’'
  alternative: वे तेरे साथ यह सब करेंगे / परमेश्वर तेरे साथ यह सब करेगा
  rationale: इस उपवाक्य में कर्ता स्पष्ट रूप से व्यक्त नहीं है। किसी मानवीय या दिव्य कर्ता को जोड़ना मूल की अस्पष्टता को अनावश्यक रूप से समाप्त कर देता।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट हिन्दी। स्त्रीलिंग एकवचन संबोधन के अनुरूप ‘तेरे’ और ‘करती रही’ रखा गया है। मूल की कठोर यौन उपमा तथा कर्ता की अस्पष्टता दोनों सुरक्षित रखी गई हैं।
