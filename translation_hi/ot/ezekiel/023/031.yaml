  text: You have walked in the way of your sister[a], so I will put her cup into your hand.
translation:
  language: hi
  text: तू अपनी बहन की राह पर चली है; इसलिए मैं उसका प्याला[a] तेरे हाथ में दूँगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात् वह प्याला जो उस बहन के लिए ठहराया गया था; यहाँ प्याला न्याय का प्रतीक है।
    reason: सांस्कृतिक और रूपक संबंधी टिप्पणी
lexical_decisions:
- source_word: בְּדֶרֶךְ
  choice: की राह पर
  rationale: דֶּרֶךְ का अर्थ राह या आचरण का ढंग हो सकता है। यहाँ यह जीवन-व्यवहार के लिए रूपक है; ‘की राह पर चलना’ हिब्रू बिंब को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: אֲחוֹתֵךְ
  choice: अपनी बहन
  rationale: मूल के पारिवारिक रूपक को ज्यों का त्यों रखा गया है। ‘अपनी’ हिन्दी में कर्ता से संबंध को स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: הָלָכְתְּ
  choice: चली है
  rationale: यह स्त्रीलिंग एकवचन संबोधन है। पूर्ण हुई चाल को वर्तमान परिणाम से जोड़ने के लिए ‘चली है’ उपयुक्त है और रूपकात्मक आचरण का भाव भी बनाए रखता है।
- source_word: וְנָתַתִּי
  choice: इसलिए मैं ... दूँगा
  rationale: נתן का मूल भाव देना या रखना है। प्रसंग में अगली क्रिया परिणामस्वरूप न्याय को व्यक्त करती है, इसलिए וְ को ‘इसलिए’ और क्रिया को भविष्यकाल में प्रस्तुत किया गया है।
- source_word: כוֹסָהּ
  choice: उसका प्याला
  rationale: मूल का ‘उसका प्याला’ रूपक बिना व्याख्यात्मक शब्द जोड़े सुरक्षित रखा गया है।
- source_word: בְּיָדֵךְ
  choice: तेरे हाथ में
  rationale: शाब्दिक स्थान-संबंध को सहज हिन्दी में व्यक्त करता है और प्याले को उसके अधिकार में सौंपे जाने का भाव देता है।
theological_decisions:
- issue: न्याय के प्याले का रूपक
  choice: मुख्य पाठ में केवल ‘उसका प्याला’ रखा गया है।
  alternative: उसके न्याय का प्याला / उसके दण्ड का प्याला
  rationale: निकटवर्ती प्रसंग में प्याला न्याय का प्रतीक है, पर इस पद के हिब्रू पाठ में ‘न्याय’ या ‘दण्ड’ शब्द नहीं हैं। इसलिए रूपक और उसकी अर्थगत गहनता को बनाए रखा गया है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी; स्त्रीलिंग एकवचन संबोधन के अनुरूप ‘तू/चली है/तेरे’ का प्रयोग। भविष्यसूचक न्याय की गंभीरता रखते हुए अनावश्यक व्याख्या मुख्य पाठ में नहीं जोड़ी गई।
