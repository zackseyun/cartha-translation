  text: כֹּ֤ה אָמַר֙ אֲדֹנָ֣/י יְהֹוִ֔ה כּ֤וֹס אֲחוֹתֵ/ךְ֙ תִּשְׁתִּ֔י הָ/עֲמֻקָּ֖ה וְ/הָ/רְחָבָ֑ה תִּהְיֶ֥ה לִ/צְחֹ֛ק וּ/לְ/לַ֖עַג מִרְבָּ֥ה לְ/הָכִֽיל׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/023/032.yaml
  text: 'Thus says the Lord GOD: You will drink your sister’s cup[a], deep and wide; it will be for laughter and for mockery[b], for it holds much.'
translation:
  language: hi
  text: 'प्रभु याहवे यह कहते हैं:


    “तू अपनी बहन का वह कटोरा[a] पिएगी,

    जो गहरा और चौड़ा है;

    वह हँसी और उपहास का पात्र होगा,

    क्योंकि उसमें बहुत कुछ समाता है।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यह ‘कटोरा’ न्याय में मिलने वाले हिस्से की भविष्यद्वक्ताई छवि है।
    reason: cross_reference
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  choice: प्रभु याहवे
  rationale: אֲדֹנָי को सम्मानसूचक पदवी ‘प्रभु’ और יהוה को परमेश्वर के व्यक्तिगत नाम ‘याहवे’ के रूप में रखा गया है।
- source_word: כּוֹס אֲחוֹתֵךְ
  choice: अपनी बहन का कटोरा
  rationale: इब्रानी संबंध-वाक्यांश का सीधा और स्वाभाविक अनुवाद है। ‘कटोरा’ न्याय में मिले हिस्से का भविष्यद्वक्ताई रूपक है, इसलिए रूपक को मूल रूप में बनाए रखा गया है।
- source_word: תִּשְׁתִּי
  choice: तू ... पिएगी
  rationale: स्त्रीलिंग एकवचन अपूर्ण क्रिया को इस भविष्यसूचक घोषणा में निश्चित भविष्य के रूप में व्यक्त किया गया है। एकवचन ‘तू’ संबोधन की सीधाई बनाए रखता है।
- source_word: הָעֲמֻקָּה וְהָרְחָבָה
  choice: जो गहरा और चौड़ा है
  rationale: दोनों विशेषण कटोरे के असाधारण आकार और क्षमता को बताते हैं; ‘गहरा और चौड़ा’ आधुनिक हिन्दी में स्वाभाविक है।
- source_word: תִּהְיֶה לִצְחֹק וּלְלַעַג
  choice: तू हँसी और उपहास का विषय बनेगी
  rationale: इब्रानी मुहावरे ‘हँसी और उपहास के लिए होना’ को अर्थ-स्पष्ट हिन्दी में व्यक्त किया गया है। स्त्रीलिंग क्रिया को संबोधित स्त्री के लिए पढ़ा गया है, जबकि व्याकरणगत वैकल्पिक संबंध को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: מִרְבָּה לְהָכִיל
  choice: उसमें बहुत कुछ समाता है
  rationale: यह वाक्यांश कटोरे की बड़ी क्षमता बताता है। हिन्दी में स्पष्ट सर्वनाम जोड़कर उस संबंध को स्वाभाविक बनाया गया है।
theological_decisions:
- issue: אֲדֹנָי יְהוִה में दिव्य नाम का अनुवाद
  choice: प्रभु याहवे
  alternative: प्रभु परमेश्वर
  rationale: मूल में יהוה व्यक्तिगत दिव्य नाम है; ‘याहवे’ उसे सामान्य पदवी में बदलने के बजाय नाम के रूप में सुरक्षित रखता है।
- issue: कटोरे की भविष्यद्वक्ताई छवि
  choice: ‘कटोरा’ रूपक को बनाए रखना
  alternative: दंड का हिस्सा
  rationale: मूल पाठ न्याय को सीधे स्पष्ट नहीं करता, बल्कि कटोरे की सशक्त छवि का प्रयोग करता है। अर्थ को पादटिप्पणी में समझाया गया है, मुख्य पाठ में रूपक को नहीं खोला गया।
- issue: תִּהְיֶה का कर्ता
  choice: 'संबोधित स्त्री: ‘तू ... बनेगी’'
  alternative: 'कटोरा: ‘वह ... का कारण होगा’'
  rationale: रूप और निकटवर्ती स्त्रीलिंग संज्ञा दोनों के कारण व्याकरणगत अस्पष्टता है। प्रसंग में अपमान संबोधित स्त्री पर आता है, इसलिए उसे मुख्य पाठ में चुना गया है; दूसरा संभव संबंध पादटिप्पणी में दिया गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सीधी रखी गई है। काव्यात्मक पंक्ति-विन्यास मूल घोषणा की लय को सहारा देता है। एकवचन स्त्रीलिंग ‘तू’ अध्याय के व्यक्तिकृत संबोधन और क्रियाओं के लिंग-वचन को स्पष्ट रूप से बनाए रखता है।
