  text: You will be filled with drunkenness and grief, with a cup of horror and desolation, the cup of your sister Samaria.
translation:
  language: hi
  text: तू मदहोशी और शोक से भर जाएगी—विभीषिका और उजाड़ का कटोरा, तेरी बहन सामरिया का कटोरा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שִׁכָּרוֹן
  choice: मतवालापन
  rationale: यह संज्ञा नशे अथवा मदहोशी की दशा बताती है; ‘मतवालापन’ दंड के रूपक और कटोरे की छवि दोनों को स्वाभाविक हिंदी में बनाए रखता है।
- source_word: יָגוֹן
  choice: शोक
  rationale: शब्द गहरे दुःख और संताप को व्यक्त करता है; ‘शोक’ संक्षिप्त, dignified और संदर्भानुकूल है।
- source_word: שַׁמָּה
  choice: भय
  rationale: यहाँ शब्द स्तब्ध कर देने वाली विभीषिका या भयावहता का बोध देता है; ‘भय’ पद्य की संक्षिप्त समानांतर संरचना में सहज है।
- source_word: שְׁמָמָה
  choice: उजाड़
  rationale: यह उजाड़ अथवा विनाश की अवस्था को दर्शाता है; ‘उजाड़’ ठोस और सामान्य आधुनिक हिंदी है।
- source_word: כּוֹס
  choice: कटोरा
  rationale: दिव्य दंड के पात्र की मूल रूपक-छवि को प्रत्यक्ष रूप से सुरक्षित रखा गया है।
theological_decisions:
- issue: कटोरे का रूपक
  choice: ‘कटोरा’ को दोनों बार स्पष्ट रखा गया
  alternative: दूसरी बार इसे सर्वनाम या ‘दंड’ से बदलना
  rationale: इब्रानी पाठ की पुनरुक्ति सामरिया के भाग्य में सहभागी होने पर बल देती है; इसे व्याख्यात्मक रूप से ‘दंड’ कहना रूपक को अनावश्यक रूप से खोल देता।
- issue: שַׁמָּה का अर्थ-क्षेत्र
  choice: ‘भय’
  alternative: ‘विभीषिका’ या ‘स्तब्धता’
  rationale: मूल में भयावहता और चकित कर देने वाली तबाही दोनों की छाया संभव है। मुख्य पाठ में सरल ‘भय’ चुना गया, बिना किसी विशिष्ट धर्मवैज्ञानिक अर्थ को थोपे।
translation_notes:
  register: आधुनिक मानक हिंदी; संबोधन स्त्रीलिंग एकवचन ‘तू’ मूल के व्याकरण और निकट, आरोपात्मक भविष्यवाणी-स्वर को सुरक्षित रखता है। वाक्य को डैश से बाँधा गया है ताकि इब्रानी की संक्षिप्त, काव्यात्मक समानता स्पष्ट रहे।
