  footnotes:
  - marker: a
    text: या, “तुम्हारी शोभा की वस्तुएँ”; अधिक शाब्दिक रूप से, “तुम्हारे सौंदर्य/वैभव की वस्तुएँ।”
    reason: כְּלֵי תִפְאַרְתֵּךְ में ‘वस्तुएँ/सामान’ तथा ‘सौंदर्य/शोभा/वैभव’ की अर्थगत व्यापकता को दिखाने के लिए।
lexical_decisions:
- source_word: וְהִפְשִׁיטוּךְ
  choice: वे तुम्हारे वस्त्र उतार देंगे
  rationale: हिफ़ील रूप का अर्थ किसी के कपड़े उतार देना है। इसके बाद स्पष्ट कर्म ‘तुम्हारे वस्त्र’ आता है, इसलिए ‘तुम्हें नंगा कर देंगे’ कहना मूल से अधिक अर्थ जोड़ सकता है।
- source_word: בְּגָדָיִךְ
  choice: तुम्हारे वस्त्र
  rationale: בגד का सामान्य अर्थ वस्त्र या कपड़े है। ‘वस्त्र’ भविष्यद्वाणी के न्याय-संबंधी प्रसंग के अनुरूप गरिमापूर्ण, किंतु सहज आधुनिक हिन्दी है।
- source_word: וְלָקְחוּ
  choice: और ... ले लेंगे
  rationale: לקח का सामान्य अर्थ ‘लेना’ है। प्रसंग में बलपूर्वक छीन लिए जाने का भाव संभव है, पर क्रिया में स्वयं ‘लूटना’ या ‘छीनना’ स्पष्ट नहीं है।
- source_word: כְּלֵי תִפְאַרְתֵּךְ
  choice: तुम्हारे वैभव के आभूषण
  rationale: כְּלִי का व्यापक अर्थ वस्तु/सामान है और תִפְאֶרֶת सौंदर्य, शोभा या वैभव को दर्शाता है। प्रसंग में सजावटी वस्तुएँ अभिप्रेत हैं; यह अनुवाद संबंधवाचक संरचना और अर्थ की व्यापकता को बनाए रखता है।
