reference: Ezekiel 23:23
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: בְּנֵ֧י בָבֶ֣ל וְ/כָל כַּשְׂדִּ֗ים פְּק֤וֹד וְ/שׁ֨וֹעַ֙ וְ/ק֔וֹעַ כָּל בְּנֵ֥י אַשּׁ֖וּר אוֹתָ֑/ם בַּח֨וּרֵי חֶ֜מֶד פַּח֤וֹת וּ/סְגָנִים֙ כֻּלָּ֔/ם שָֽׁלִשִׁים֙ וּ/קְרוּאִ֔ים רֹכְבֵ֥י סוּסִ֖ים כֻּלָּֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/023/023.yaml
  text: the sons of Babylon and all the Chaldeans[a], Pekod and Shoa and Koa, all the sons of Assyria with them—desirable young men, all of them governors and officials, officers and men of renown[b], all of them riding on horses.
translation:
  language: hi
  text: 'बाबेल के लोग और सभी कसदी—पकोद, शोआ और कोआ[a]—और उनके साथ अश्शूर के सभी लोग: ये सभी मनोहर युवक थे, सब-के-सब राज्यपाल और अधिकारी, सैन्य अधिकारी और प्रतिष्ठित जन[b]; ये सभी घोड़ों पर सवार थे।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: पकोद, शोआ और कोआ सम्भवतः बाबेल से जुड़ी जातियों या क्षेत्रों के नाम हैं। कुछ लोग इन शब्दों को पदाधिकारियों, कुलीनों या योद्धाओं जैसे वर्णनात्मक पद मानते हैं।
    reason: alternative_reading
  - marker: b
    text: या “विशिष्ट जन”; अधिक शाब्दिक रूप में, “बुलाए हुए लोग।”
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי בָבֶל / בְּנֵי אַשּׁוּר
  choice: बाबेल के लोग / अश्शूर के लोग
  rationale: शाब्दिक ‘पुत्र’ यहाँ जातीय समुदाय का इब्रानी मुहावरा है; आधुनिक हिन्दी में ‘लोग’ अर्थ को स्वाभाविक और स्पष्ट रखता है, जबकि दोनों पदों की समानांतरता भी बनी रहती है।
- source_word: כַּשְׂדִּים
  choice: कसदी
  rationale: यह पारंपरिक जातीय नाम है और बाबेल के व्यापक उल्लेख से इसे अलग बनाए रखता है।
- source_word: פְּקוֹד וְשׁוֹעַ וְקוֹעַ
  choice: पकोद, शोआ और कोआ
  rationale: सूची की संरचना में इन्हें जातियों अथवा क्षेत्रों के व्यक्तिवाचक नाम मानना सबसे उपयुक्त है; वैकल्पिक वर्णनात्मक अर्थ पादटिप्पणी में रखा गया है।
- source_word: בַּחוּרֵי חֶמֶד
  choice: मनभावने जवान
  rationale: यह चयन जवान पुरुषों के आकर्षक और वांछनीय होने की छाया को सुरक्षित रखता है, जो अध्याय की कामुक रूपक-भाषा के अनुकूल है।
- source_word: פַּחוֹת וּסְגָנִים
  choice: राज्यपाल और अधिकारी
  rationale: दोनों साम्राज्यिक प्रशासनिक पद हैं; यह हिन्दी स्पष्ट है और अनिश्चित तकनीकी पदक्रम को आवश्यकता से अधिक विशिष्ट नहीं बनाती।
- source_word: שָׁלִשִׁים
  choice: सेनानायक
  rationale: संदर्भ में यह किसी उच्च सैन्य पद को सूचित करता है; ‘सेनानायक’ सामान्य पाठक के लिए स्पष्ट है, जबकि ‘तीसरे पुरुष’ जैसा ऐतिहासिक शाब्दिक रूप अस्पष्ट होता।
- source_word: קְרוּאִים
  choice: प्रतिष्ठित जन
  rationale: शाब्दिक अर्थ ‘बुलाए हुए’ है, पर सम्मानसूचक सूची में यह विशिष्ट अथवा ख्यातिप्राप्त व्यक्तियों का संकेत देता है; शाब्दिक विकल्प पादटिप्पणी में सुरक्षित है।
- source_word: רֹכְבֵי סוּסִים
  choice: घोड़ों पर सवार
  rationale: इब्रानी कृदन्तीय वर्णन को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: כֻּלָּם ... כֻּלָּם ... כֻּלָּם
  choice: सभी ... सभी ... सभी
  rationale: मूल की संचयी और बलाघाती पुनरावृत्ति को हिन्दी में यथासंभव बनाए रखा गया है।
