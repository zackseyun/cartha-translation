  yaml_path: translation/ot/ezekiel/023/012.yaml
  text: She lusted after the sons of Assyria—governors and officials[a], clothed in full attire, horsemen riding horses, all of them desirable young men.
translation:
  language: hi
  text: वह अश्शूर के पुत्रों पर कामासक्त हो गई—राज्यपालों और अधिकारियों पर, निकटस्थ लोगों पर, भव्य वस्त्र पहने हुए घुड़सवारों पर, जो घोड़ों पर सवार थे—वे सभी मनभावने युवक थे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עָגָבָה
  choice: कामासक्त हो गई
  rationale: इस प्रसंग में क्रिया प्रबल कामुक लालसा व्यक्त करती है; यह चयन रूपक की तीव्रता बनाए रखता है।
- source_word: בְּנֵי אַשּׁוּר
  choice: अश्शूर के पुत्रों
  rationale: शाब्दिक इब्रानी अभिव्यक्ति को रखा गया है; संदर्भ में इसका अर्थ अश्शूरी पुरुष है।
- source_word: פַּחוֹת וּסְגָנִים
  choice: राज्यपालों और अधिकारियों
  rationale: दो प्रशासनिक पदों का भेद बनाए रखते हुए आधुनिक और सहज पदावली दी गई है।
- source_word: קְרֹבִים
  choice: जो निकट सेवा में थे
  rationale: शब्द का मूल भाव ‘निकट’ है और यहाँ संभवतः निकट उपस्थित अथवा राजकीय सेवा से जुड़े लोगों का संकेत है; अनिश्चितता पादटिप्पणी में सुरक्षित है।
- source_word: לְבֻשֵׁי מִכְלוֹל
  choice: पूरी सज-धज के वस्त्र पहने हुए
  rationale: पूर्ण, सुसज्जित या भव्य पहनावे का भाव स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: פָּרָשִׁים רֹכְבֵי סוּסִים
  choice: घोड़ों पर सवार घुड़सवारों
  rationale: मूल के घुड़सवार और घोड़ों पर सवार होने के पुनरुक्त चित्र को यथासंभव बनाए रखा गया है।
- source_word: בַּחוּרֵי חֶמֶד כֻּלָּם
  choice: वे सभी मनभावने जवान थे
  rationale: חֶמֶד के आकर्षक और वांछनीय भाव को प्रसंगानुकूल ‘मनभावने’ से व्यक्त किया गया है और כֻּלָּם का समाहारक बल रखा गया है।
