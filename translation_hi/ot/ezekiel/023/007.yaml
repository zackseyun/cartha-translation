  text: וַ/תִּתֵּ֤ן תַּזְנוּתֶ֨י/הָ֙ עֲלֵי/הֶ֔ם מִבְחַ֥ר בְּנֵֽי אַשּׁ֖וּר כֻּלָּ֑/ם וּ/בְ/כֹ֧ל אֲשֶׁר עָֽגְבָ֛ה בְּ/כָל גִּלּוּלֵי/הֶ֖ם נִטְמָֽאָה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/023/007.yaml
  text: She lavished her prostitutions on them[a], all the choicest sons of Assyria; and with all those for whom she lusted[c][b], with all their idols she defiled herself.
translation:
  language: hi
  text: उसने अपने वेश्याचार अश्शूर के सभी चुने हुए पुरुषों पर उंडेल दिए[a]। जिन-जिन की उसने कामना की, उनकी सभी घृणित मूर्तियों के द्वारा उसने अपने आपको अशुद्ध कर लिया।[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “अश्शूर के सभी उत्तम पुरुषों पर,” अथवा “अश्शूरियों में से सभी श्रेष्ठ लोगों पर।”
    reason: lexical_alternative
  - marker: b
    text: यहाँ “वेश्याचार” और “कामना” की स्पष्ट यौन भाषा राजनीतिक-धार्मिक विश्वासघात और मूर्तिपूजा के लिए भविष्यद्वाणी की उपमा है।
    reason: cultural_note
  - marker: c
    text: मूल इब्रानी में मूर्तियों के लिए अत्यन्त तिरस्कारपूर्ण शब्द प्रयुक्त हुआ है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּתֵּן תַּזְנוּתֶיהָ עֲלֵיהֶם
  choice: उसने अपना वेश्याचार उन पर लुटाया
  rationale: शाब्दिक अर्थ ‘उसने अपना वेश्याचार उन पर दिया’ है। ‘लुटाया’ सक्रिय और प्रचुर समर्पण का भाव रखते हुए हिन्दी में स्वाभाविक है; ‘वेश्याचार’ मूल की स्पष्ट यौन उपमा को बनाए रखता है।
- source_word: מִבְחַר בְּנֵי אַשּׁוּר כֻּלָּם
  choice: अश्शूर के उन सभी चुने हुए पुत्रों पर
  rationale: מִבְחַר का चयनित या उत्तम होने का भाव ‘चुने हुए’ से व्यक्त होता है। בְּנֵי का पुरुषवाचक रूप ‘पुत्रों’ द्वारा सुरक्षित रखा गया है, और כֻּלָּם के कारण ‘सभी’ जोड़ा गया है।
- source_word: וּבְכֹל אֲשֶׁר עָגְבָה
  choice: और जिन-जिन पर वह कामासक्त हुई थी
  rationale: עגב तीव्र कामुक लालसा बताता है। ‘कामासक्त हुई’ इस स्पष्ट यौन भाव को बनाए रखता है और सम्बन्धवाचक बहुवचन को ‘जिन-जिन’ स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: בְּכָל גִּלּוּלֵיהֶם
  choice: उनकी सभी घिनौनी मूर्तियों से
  rationale: גִּלּוּלִים मूर्तियों के लिए यहेजकेल का अत्यन्त तिरस्कारपूर्ण शब्द है। ‘घिनौनी मूर्तियाँ’ उसके अपमानसूचक बल को व्यक्त करती हैं; ‘से’ यहाँ अशुद्ध होने के साधन या संगति को दर्शाता है।
- source_word: נִטְמָאָה
  choice: उसने अपने आपको अशुद्ध कर लिया
  rationale: निफ़अल रूप यहाँ परिणामात्मक या आत्मसम्बन्धी अर्थ देता है। यह अनुवाद उसकी भागीदारी और उससे उत्पन्न धार्मिक-नैतिक अशुद्धता दोनों स्पष्ट करता है।
theological_decisions:
- issue: वैवाहिक/यौन उपमा द्वारा राजनीतिक और धार्मिक विश्वासघात
  choice: मुख्य पाठ में ‘वेश्याचार’ और ‘कामासक्त’ जैसी स्पष्ट भाषा बनाए रखना
  alternative: इसे केवल ‘विश्वासघात’ या ‘बेवफ़ाई’ कहकर नरम करना
  rationale: भविष्यद्वक्ता की जानबूझकर तीखी यौन उपमा सामरिया के मूर्तिपूजक और राजनीतिक सम्बन्धों को चित्रित करती है। इसे नरम करने से मूल की वाग्मिता और धार्मिक तनाव घट जाएगा।
- issue: בְּנֵי का अनुवाद
  choice: ‘पुत्रों’ को मुख्य पाठ में रखना
  alternative: ‘पुरुषों’ या ‘अश्शूरियों’ कहना
  rationale: मूल में स्पष्ट पुरुषवाचक सम्बन्धसूचक संज्ञा है और प्रसंग में पुरुष ही यौन उपमा के पात्र हैं; इसलिए ‘पुत्रों’ से मूल रूप सुरक्षित रहता है।
- issue: טמא की धार्मिक और नैतिक अर्थछाया
  choice: ‘अपने आपको अशुद्ध कर लिया’
  alternative: ‘अशुद्ध हो गई’ या ‘अपवित्र हो गई’
  rationale: यह रूप कर्म में उसकी सक्रिय भागीदारी को व्यक्त करता है, पर अशुद्धता की धार्मिक अर्थछाया को केवल नैतिक दोष में सीमित नहीं करता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की है, पर यहेजकेल की तीखी और असुविधाजनक यौन उपमा को शिष्ट बनाकर कमजोर नहीं किया गया। वाक्य में डैश द्वारा अश्शूरी पुरुषों की व्याख्यात्मक समानाधिकरण संरचना स्पष्ट की गई है।
