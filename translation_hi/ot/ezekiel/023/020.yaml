base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/023/020.yaml
  text: She lusted after their paramours[a], whose flesh was like the flesh of donkeys[c][b], and whose emission was like the emission of horses.
translation:
  language: hi
  text: वह उनके प्रेमियों[a] के प्रति कामवासना से भर गई, जिनका मांस गधों के मांस जैसा था[b], और जिनका स्राव घोड़ों के स्राव जैसा था[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: हिब्रू में शाब्दिक रूप से “उनकी रखैलें” या “उनकी उपपत्नियाँ।” इस संदर्भ में यह शब्द सामान्यतः यौन-साथियों या प्रेमियों के लिए प्रयुक्त रूपक समझा जाता है।
    reason: lexical_alternative
  - marker: b
    text: यहाँ “मांस” संभवतः पुरुष जननांग के लिए प्रयुक्त शिष्टोक्ति है।
    reason: lexical_alternative
  - marker: c
    text: अधिक स्पष्ट रूप में, “वीर्यस्राव।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּעְגְּבָה עַל
  choice: के लिए काम-वासना से भर गई
  rationale: עגב प्रबल कामुक लालसा को व्यक्त करता है और עַל उसके लक्ष्य को चिह्नित करता है। यह हिन्दी प्रयोग भाव की तीव्रता और यौन संदर्भ दोनों स्पष्ट करता है।
- source_word: פִּלַגְשֵׁיהֶם
  choice: उनके प्रेमियों
  rationale: शब्द का शाब्दिक रूप ‘उनकी रखैलें/उपपत्नियाँ’ है, पर इस रूपक के संदर्भ में आशय यौन-साथियों या प्रेमियों से समझा जाता है। सहज हिन्दी के लिए ‘प्रेमियों’ चुना गया है और असामान्य शाब्दिक अर्थ पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: בְּשַׂר חֲמוֹרִים בְּשָׂרָם
  choice: जिनका मांस गधों के मांस जैसा था
  rationale: בָּשָׂר का मूल अर्थ ‘मांस’ है। यहाँ यह संभवतः पुरुष जननांग के लिए शिष्टोक्ति है; मुख्य पाठ हिब्रू की अप्रत्यक्ष अभिव्यक्ति बनाए रखता है और निहित अर्थ पादटिप्पणी में बताता है।
- source_word: וְזִרְמַת סוּסִים זִרְמָתָם
  choice: और जिनका स्राव घोड़ों के स्राव जैसा था
  rationale: זִרְמָה बहने वाले स्राव को दर्शाता है और यहाँ वीर्यस्राव का संकेत देता है। ‘स्राव’ मूल की ठोस किंतु कुछ अप्रत्यक्ष भाषा को बनाए रखता है; अधिक स्पष्ट अर्थ पादटिप्पणी में दिया गया है।
