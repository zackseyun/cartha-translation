  text: וְ/נָתְנ֤וּ זִמַּתְ/כֶ֨נָה֙ עֲלֵי/כֶ֔ן וַ/חֲטָאֵ֥י גִלּוּלֵי/כֶ֖ן תִּשֶּׂ֑אינָה וִ/ידַעְתֶּ֕ם כִּ֥י אֲנִ֖י אֲדֹנָ֥/י יְהוִֽה׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/023/049.yaml
  text: They will put your lewdness upon you[a], and you will bear the sins of your idols; then you will know that I am the Lord YHWH.
translation:
  language: hi
  text: वे तुम्हारी अश्लीलता को तुम्हीं पर डालेंगे, और तुम अपनी घिनौनी मूर्तियों[a] से जुड़े पापों का भार उठाओगी। तब तुम जान लोगी[b] कि मैं प्रभु याहवे हूँ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ प्रयुक्त इब्रानी शब्द גִּלּוּלִים मूर्तियों के लिए अत्यंत तिरस्कारपूर्ण शब्द है; इसका और अधिक शाब्दिक भाव ‘मल-जैसी मूर्तियाँ’ हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: इस पद के पहले क्रियारूप स्त्रीलिंग बहुवचन हैं, पर ‘तुम जानोगे’ का इब्रानी क्रियारूप पुल्लिंग बहुवचन है। हिन्दी मुख्य पाठ में प्रसंग की दोनों स्त्रियों के अनुसार स्त्रीलिंग रखा गया है।
    reason: source_grammar
lexical_decisions:
- source_word: וְנָתְנוּ
  choice: वे ... डालेंगे
  rationale: נתן के मूल ठोस अर्थ ‘रखना/डालना’ और עַל ‘पर’ को बनाए रखता है; भविष्यसूचक प्रसंग में संयुक्त पूर्ण क्रिया को भविष्यकाल में व्यक्त किया गया है।
- source_word: זִמַּתְכֶנָה
  choice: तुम्हारी अश्लीलता
  rationale: यहेजकेल 23 के यौन और नैतिक संदर्भ में זִמָּה निर्लज्ज, अनैतिक आचरण को सूचित करता है। ‘अश्लीलता’ अर्थ की कठोरता बनाए रखती है, बिना उसे केवल सामान्य ‘दुष्टता’ बना देने के।
- source_word: עֲלֵיכֶן
  choice: तुम्हीं पर
  rationale: עַל के ‘पर’ अर्थ और न्यायिक प्रत्यावर्तन के बल को स्वाभाविक हिन्दी में व्यक्त करने के लिए ‘तुम्हीं पर’ चुना गया है।
- source_word: וַחֲטָאֵי גִלּוּלֵיכֶן
  choice: अपनी घिनौनी मूर्तियों से जुड़े पापों
  rationale: חַטָּאִים को ‘पाप’ रखा गया है। संबंधसूचक रचना को हिन्दी में स्पष्ट करने के लिए ‘से जुड़े’ कहा गया है। גִּלּוּלִים का तिरस्कारपूर्ण भाव ‘घिनौनी मूर्तियाँ’ से मुख्य पाठ में व्यक्त होता है।
- source_word: תִּשֶּׂאינָה
  choice: भार उठाओगी
  rationale: נשא के ‘उठाना/वहन करना’ अर्थ तथा पाप के न्यायिक परिणाम को हिन्दी मुहावरे ‘पापों का भार उठाना’ से सुरक्षित रखा गया है; स्त्रीलिंग बहुवचन संबोधन भी बना रहता है।
- source_word: וִידַעְתֶּם
  choice: तब तुम जान लोगी
  rationale: ו को यहाँ परिणाम अथवा क्रम के रूप में ‘तब’ कहा गया है। प्रसंग की स्त्रीलिंग बहुवचन संबोधित आकृतियों के अनुसार हिन्दी में ‘जान लोगी’ स्वाभाविक है; इब्रानी के लिंग-परिवर्तन को पादटिप्पणी में दर्ज किया गया है।
- source_word: אֲדֹנָי יְהוִה
  choice: प्रभु याहवे
  rationale: אֲדֹנָי को ‘प्रभु’ और चार-अक्षरीय व्यक्तिगत नाम יהוה को लिप्यंतरित रूप ‘याहवे’ दिया गया है, जिससे दोनों घटक अलग और प्रत्यक्ष रहते हैं।
theological_decisions:
- issue: אֲדֹנָי יְהוִה में परमेश्वर के नाम का अनुवाद
  choice: प्रभु याहवे
  alternative: प्रभु परमेश्वर / प्रभु यहोवा
  rationale: मूल पाठ में उपाधि אֲדֹנָי के साथ व्यक्तिगत नाम יהוה है। ‘प्रभु याहवे’ उपाधि और नाम दोनों को सुरक्षित रखता है तथा ‘प्रभु प्रभु’ जैसी पुनरावृत्ति से बचता है।
- issue: ‘मूर्तियों के पाप’ संबंध का अर्थ
  choice: मूर्तियों से जुड़े पाप
  alternative: मूर्तियों के कारण हुआ दोष
  rationale: सम्बन्धवाचक इब्रानी रचना कई प्रकार के संबंध व्यक्त कर सकती है। ‘से जुड़े’ यह खुला रखता है कि अभिप्राय मूर्तिपूजा के पाप, मूर्तियों के संबंध में किए पाप, अथवा उनसे उपजा दोष है; किसी एक कारणात्मक व्याख्या को आरोपित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। ‘अश्लीलता’ तथा ‘घिनौनी मूर्तियाँ’ मूल की कठोर और तिरस्कारपूर्ण भाषा को नरम नहीं करते। स्त्रीलिंग बहुवचन संबोधन को हिन्दी क्रियारूपों में स्पष्ट रखा गया है; मूल के अंतिम लिंग-परिवर्तन को पादटिप्पणी में पारदर्शी बनाया गया है।
