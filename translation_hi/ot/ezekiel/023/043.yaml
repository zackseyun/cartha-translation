  text: तब मैंने उस स्त्री के विषय में कहा, जो व्यभिचारों से जर्जर हो चुकी थी, “अब वे उसके साथ उसका वेश्याकर्म करेंगे, और वह स्वयं भी।”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'हिब्रू पाठ का अंतिम खंड कठिन और अस्पष्ट है। इसमें क्रिया का रूप असामान्य है और शाब्दिक रूप से अर्थ कुछ ऐसा है: “अब वे उसके साथ उसका वेश्याकर्म करेंगे, और वह स्वयं भी।” कुछ व्याख्याएँ इसे प्रश्न के रूप में समझती हैं।'
    reason: मसोराई पाठ के असामान्य क्रियारूप, ‘उसका वेश्याकर्म’ वाले प्रत्यय, और अंतिम अपूर्ण ‘और वह स्वयं भी’ को सुरक्षित रखते हुए सम्भावित प्रश्नात्मक समझ का उल्लेख करता है।
lexical_decisions:
- source_word: לַבָּלָה נִאוּפִים
  choice: व्यभिचारों से जर्जर हो चुकी उस स्त्री के विषय में
  rationale: לַבָּלָה को स्त्रीलिंग ‘जर्जर/चुक गई’ और נִאוּפִים को कारणसूचक ‘व्यभिचारों से’ समझा गया है; हिन्दी में ‘के विषय में’ וָאֹמַר के साथ स्वाभाविक है।
- source_word: תַזְנוּתֶהָ
  choice: उसके साथ वेश्यागमन
  rationale: मसोराई पाठ का यह रूप असामान्य और अर्थ की दृष्टि से कठिन है। प्रसंग में स्त्री को वेश्या की तरह इस्तेमाल करने या उसके साथ वेश्यागमन करने का भाव है; हिन्दी में यही निकटतम स्वाभाविक अभिव्यक्ति है।
- source_word: וָהִיא
  choice: और वह भी उनके साथ
  rationale: शाब्दिक रूप ‘और वह’ अधूरा प्रतीत होता है। पूर्ववर्ती क्रिया को परस्पर रूप में पूरा करके अनुवाद किया गया, पर पाठगत अनिश्चितता पादटिप्पणी में सुरक्षित रखी गई है।
theological_decisions:
- issue: पद के अंतिम खंड का कठिन और सम्भवतः विकृत मसोराई पाठ
  choice: इसे पुरुषों और स्त्री की परस्पर वेश्यागामी क्रिया के रूप में प्रस्तुत किया गया।
  alternative: “अब वे उसके वेश्याकर्म को उसके साथ करेंगे, और वह स्वयं भी” अथवा प्रश्न के रूप में “क्या अब वे उसके साथ व्यभिचार करेंगे—और वह भी?”
  rationale: हिब्रू व्याकरण और शब्दरूप अस्पष्ट हैं। प्रसंग परस्पर यौन अनैतिकता का संकेत देता है, लेकिन अनिश्चितता को निर्णायक सिद्धान्तगत अर्थ में नहीं बदला गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और स्पष्ट रखी गई है। अध्याय की कठोर यौन-रूपक भाषा को नरम करके छिपाया नहीं गया, पर अनावश्यक रूप से अश्लील भी नहीं बनाया गया।
