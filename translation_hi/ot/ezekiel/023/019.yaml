  yaml_path: translation/ot/ezekiel/023/019.yaml
  text: Yet she multiplied her prostitutions[a], remembering the days of her youth, when she prostituted herself in the land of Egypt.
translation:
  language: hi
  text: फिर भी उसने अपने वेश्यावृत्ति के काम बढ़ाए, अपनी जवानी के उन दिनों को याद करते हुए, जब उसने मिस्र की भूमि में वेश्यावृत्ति की थी।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתַּרְבֶּה
  choice: फिर भी ... बढ़ाती गई
  rationale: רבה के हिफ़ील रूप का अर्थ ‘बढ़ाना/बहुत करना’ है। प्रसंग में पूर्ववर्ती न्याय के बावजूद आचरण जारी रहने के कारण ‘फिर भी’ विरोधात्मक संबंध व्यक्त करता है, और ‘बढ़ाती गई’ उसकी निरंतर वृद्धि को स्वाभाविक हिन्दी में रखता है।
- source_word: תַּזְנוּתֶיהָ
  choice: अपनी वेश्यागामी करतूतें
  rationale: बहुवचन संज्ञा बार-बार किए गए वेश्यागमन के कार्यों को सूचित करती है। ‘वेश्यागामी करतूतें’ कठोर भविष्यद्वक्ताई रूपक और बहुवचन कार्य-बोध को बनाए रखता है; केवल ‘बेवफ़ाई’ कहना रूपक को अनावश्यक रूप से नरम कर देता।
- source_word: לִזְכֹּר
  choice: याद करती रही
  rationale: ל के साथ infinitive construct को संबद्ध परिस्थिति के रूप में समझा गया है। ‘याद करती रही’ मुख्य क्रिया के साथ जारी स्मरण को सहज हिन्दी में व्यक्त करता है, जबकि उद्देश्यसूचक ‘याद करने के लिए’ भी व्याकरणतः संभव है।
- source_word: יְמֵי נְעוּרֶיהָ
  choice: अपनी जवानी के उन दिनों
  rationale: यह हिब्रू मुहावरे ‘उसकी जवानी के दिन’ को स्वाभाविक आधुनिक हिन्दी में बनाए रखता है और इस्राएल के आरंभिक इतिहास की ओर संकेत को सुरक्षित रखता है।
- source_word: אֲשֶׁר זָנְתָה
  choice: जब उसने ... वेश्यागमन किया था
  rationale: זנה की स्पष्ट यौन-वेश्यावृत्ति संबंधी छवि को ‘वेश्यागमन’ से बनाए रखा गया है। ‘जब’ אֲשֶׁר के यहाँ कालगत संबंध को स्वाभाविक रूप से व्यक्त करता है।
- source_word: בְּאֶרֶץ מִצְרָיִם
  choice: मिस्र देश में
  rationale: हिब्रू के ‘मिस्र की भूमि/देश में’ को संक्षिप्त किंतु औपचारिक और ऐतिहासिक अनुगूँज वाले हिन्दी रूप में रखा गया है।
theological_decisions:
- issue: मूर्तिपूजा और राजनीतिक बेवफ़ाई के लिए भविष्यद्वक्ताई यौन रूपक
  choice: वेश्यागमन की भाषा को स्पष्ट रूप से बनाए रखना
  alternative: इसे केवल ‘बेवफ़ाई’ या ‘अनैतिकता’ कहना
  rationale: यहेजकेल की जानबूझकर तीखी यौन छवि वाचा-संबंधी और राजनीतिक विश्वासघात को चित्रित करती है। इसे नरम करने से मूल की आलंकारिक और भविष्यद्वक्ताई शक्ति घट जाएगी; अनुवाद रूपक को रखता है, पर उसमें कोई अतिरिक्त सांप्रदायिक व्याख्या नहीं जोड़ता।
- issue: 'לִזְכֹּר का संबंध: संबद्ध परिस्थिति या उद्देश्य'
  choice: संबद्ध परिस्थिति—‘याद करती रही’
  alternative: उद्देश्य—‘याद करने के लिए’
  rationale: दोनों व्याकरणतः संभव हैं, पर प्रसंग में उसका पुराना आचरण स्मरण करते हुए उसी को बढ़ाना अधिक स्वाभाविक संबंध देता है। अस्पष्टता को पादटिप्पणी में रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सीधा रूप अपनाया गया है। मूल की कठोर यौन छवि को शिष्टोक्ति से नरम नहीं किया गया, फिर भी अनावश्यक रूप से अपमानजनक या पुरातन शब्दावली से बचा गया है।
