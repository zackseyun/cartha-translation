source:
  edition: WLC
  text: וְ/נָתַתִּ֨י קִנְאָתִ֜/י בָּ֗/ךְ וְ/עָשׂ֤וּ אוֹתָ/ךְ֙ בְּ/חֵמָ֔ה אַפֵּ֤/ךְ וְ/אָזְנַ֨יִ/ךְ֙ יָסִ֔ירוּ וְ/אַחֲרִיתֵ֖/ךְ בַּ/חֶ֣רֶב תִּפּ֑וֹל הֵ֗מָּה בָּנַ֤יִ/ךְ וּ/בְנוֹתַ֨יִ/ךְ֙ יִקָּ֔חוּ וְ/אַחֲרִיתֵ֖/ךְ תֵּאָכֵ֥ל בָּ/אֵֽשׁ׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/023/025.yaml
  text: I will set my jealousy against you[a], and they will deal with you in wrath. They will remove your nose and your ears, and your survivors will fall by the sword. They will take your sons and your daughters[b], and your remnant will be consumed by fire.
translation:
  language: hi
  text: मैं तुम्हारे विरुद्ध अपनी जलन प्रकट करूँगा, और वे क्रोध में तुम्हारे साथ व्यवहार करेंगे। वे तुम्हारी नाक और तुम्हारे कान काट डालेंगे,[a] और तुम्हारा शेष तलवार से मारा जाएगा। वे तुम्हारे बेटे और बेटियाँ ले जाएँगे, और तुम्हारा शेष आग में भस्म हो जाएगा।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “वे तुम्हारी नाक और तुम्हारे कान हटा देंगे।” यहाँ आशय अंग काट डालने का हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: दोनों बार “शेष” के लिए प्रयुक्त इब्रानी शब्द का अर्थ “तुम्हारा अंत,” “तुम्हारा बाद का भाग,” या “तुम्हारा शेष” भी हो सकता है। इस संदर्भ में इसका आशय विनाश के बाद बचे हुए लोगों या बचे हुए भाग से हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתִּי קִנְאָתִי בָּךְ
  choice: मैं अपनी जलन तुम्हारे विरुद्ध भड़काऊँगा
  rationale: נתן का मूल अर्थ ‘देना/रखना’ है, पर इस प्रयोग में ईर्ष्यापूर्ण दंडात्मक आवेग को संबोधित स्त्री के विरुद्ध प्रवृत्त करना अभिप्रेत है। ‘जलन’ वैवाहिक और वाचा-संबंधी संदर्भ बनाए रखती है; ‘भड़काऊँगा’ स्वाभाविक हिन्दी में उसकी सक्रिय तीव्रता व्यक्त करता है।
- source_word: וְעָשׂוּ אוֹתָךְ בְּחֵמָה
  choice: वे क्रोध में तुम्हारे साथ व्यवहार करेंगे
  rationale: यह वाक्यांश उग्र क्रोध में किसी के विरुद्ध कार्रवाई करने का भाव देता है। हिन्दी अभिव्यक्ति मूल की गंभीरता रखती है और कार्रवाई की विशेष विधि नहीं जोड़ती।
- source_word: אַפֵּךְ וְאָזְנַיִךְ יָסִירוּ
  choice: वे तुम्हारी नाक और तुम्हारे कान काट डालेंगे
  rationale: हिफ़ील יָסִירוּ का शाब्दिक अर्थ ‘हटा देंगे’ है, किंतु नाक और कान के युद्धकालीन दंड-संदर्भ में अंग-विच्छेद निहित है। हिन्दी में केवल ‘हटा देंगे’ अस्वाभाविक और अस्पष्ट होता; शाब्दिक विकल्प पादटिप्पणी में सुरक्षित है।
- source_word: וְאַחֲרִיתֵךְ בַּחֶרֶב תִּפּוֹל
  choice: तुम्हारे बचे हुए लोग तलवार से मारे जाएँगे
  rationale: אַחֲרִית का अर्थ ‘अंत/शेष/बाद का भाग’ हो सकता है। स्त्रीलिंग एकवचन क्रिया मूल रूपक से मेल खाती है, जबकि संदर्भ में बचे लोगों का सामूहिक आशय स्वाभाविक है। ‘मारे जाएँगे’ हिन्दी में ‘तलवार से गिरेंगे’ के मृत्यु-सूचक मुहावरे को स्पष्ट करता है।
- source_word: הֵמָּה בָּנַיִךְ וּבְנוֹתַיִךְ יִקָּחוּ
  choice: वे तुम्हारे बेटे-बेटियों को ले जाएँगे
  rationale: לקח का व्यापक अर्थ ‘लेना’ है। विजय के संदर्भ में बंदी बनाकर ले जाना संभव है, पर मूल क्रिया जितना कहती है उससे अधिक विशिष्टता मुख्य पाठ में नहीं जोड़ी गई।
- source_word: וְאַחֲרִיתֵךְ תֵּאָכֵל בָּאֵשׁ
  choice: जो कुछ तुममें से बचा रहेगा, वह आग में भस्म हो जाएगा
  rationale: दूसरी बार אַחֲרִית शेष बचे भाग को सूचित करता है। אכל निफ़ाल का चित्र ‘आग द्वारा खा लिया जाना’ है; ‘भस्म हो जाएगा’ आधुनिक हिन्दी में पूर्ण विनाश का स्वाभाविक समतुल्य है।
theological_decisions:
- issue: קִנְאָה में वाचा-संबंधी दंडात्मक भावना
  choice: अपनी जलन
  alternative: अपना जोश
  rationale: अध्याय की वैवाहिक रूपक-भूमि में ‘जलन’ बेवफाई के प्रति संबंधपरक और दंडात्मक प्रतिक्रिया को बनाए रखती है। ‘जोश’ उस तनाव को सामान्य उत्साह में बदल सकता है।
- issue: मानवीय आक्रमणकारियों की कार्रवाई और परमेश्वर की दंडात्मक भूमिका का संबंध
  choice: पहले पुरुष में परमेश्वर की जलन, फिर ‘वे’ के द्वारा क्रियान्वयन
  alternative: सभी कार्यों को सीधे परमेश्वर का कार्य बताना
  rationale: मूल पाठ परमेश्वर की दंडात्मक पहल और शत्रुओं की प्रत्यक्ष कार्रवाई दोनों को साथ रखता है; अनुवाद ने इस धार्मिक तनाव को नहीं मिटाया।
translation_notes:
  register: आधुनिक मानक हिन्दी का गंभीर भविष्यद्वाणी-संबंधी रजिस्टर अपनाया गया है। स्त्रीलिंग संबोधन संदर्भ से स्पष्ट है, यद्यपि हिन्दी के इन रूपों में लिंग प्रायः प्रत्यक्ष नहीं दिखता। कठोर दंड-चित्रों को नरम नहीं किया गया।
