source:
  edition: WLC
  text: וְ/עָשׂ֨וּ אוֹתָ֜/ךְ בְּ/שִׂנְאָ֗ה וְ/לָקְחוּ֙ כָּל יְגִיעֵ֔/ךְ וַ/עֲזָב֖וּ/ךְ עֵירֹ֣ם וְ/עֶרְיָ֑ה וְ/נִגְלָה֙ עֶרְוַ֣ת זְנוּנַ֔יִ/ךְ וְ/זִמָּתֵ֖/ךְ וְ/תַזְנוּתָֽיִ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/023/029.yaml
  text: They will deal with you in hatred[a], and they will take all your wealth, and leave you naked and bare; and the nakedness of your prostitutions will be uncovered[c][b], your lewdness and your acts of prostitution.
translation:
  language: hi
  text: वे तुमसे घृणा से व्यवहार करेंगे और तुम्हारी सारी मेहनत की कमाई[a] ले लेंगे। वे तुम्हें नंगी और पूरी तरह उघाड़ी हुई छोड़ देंगे; तब तुम्हारे वेश्याकर्मों की नग्नता[b] प्रकट हो जाएगी—तुम्हारा कामुक दुराचार और तुम्हारे वेश्याकर्म।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “तुम्हारा सारा परिश्रम”; इसका अर्थ परिश्रम से प्राप्त कमाई या संपत्ति भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या, “तुम्हारे वेश्याकर्मों से जुड़ी लज्जाजनक बेपर्दगी।” “नग्नता” यहाँ अपमानजनक रूप से उजागर होने का भाव भी रखती है।
    reason: lexical_clarification
lexical_decisions:
- source_word: וְעָשׂוּ אוֹתָךְ בְּשִׂנְאָה
  choice: वे तुमसे घृणा के साथ व्यवहार करेंगे
  rationale: यह हिब्रू मुहावरे के व्यवहार और उसके घृणापूर्ण ढंग, दोनों को स्वाभाविक आधुनिक हिन्दी में बनाए रखता है।
- source_word: וְלָקְחוּ כָּל יְגִיעֵךְ
  choice: तुम्हारी सारी मेहनत की कमाई ले लेंगे
  rationale: יְגִיעַ का मूल अर्थ परिश्रम है, पर यहाँ ली जाने वाली वस्तु उसके परिश्रम से प्राप्त कमाई या संपत्ति है; यह अनुवाद दोनों पहलुओं को जोड़ता है।
- source_word: וַעֲזָבוּךְ עֵירֹם וְעֶרְיָה
  choice: तुम्हें नंगी और निर्वस्त्र छोड़ देंगे
  rationale: दो निकटार्थी हिब्रू शब्दों की तीव्रता और पूर्ण बेपर्दगी को हिन्दी की स्वाभाविक द्विपदी अभिव्यक्ति में रखा गया है।
- source_word: וְנִגְלָה
  choice: प्रकट हो जाएगा
  rationale: रूप की दृष्टि से पूर्ण क्रिया होने पर भी प्रसंग में यह भविष्य की घटनाशृंखला को आगे बढ़ाती है; 'प्रकट' बेपर्दगी और लज्जा दोनों की छवि के अनुकूल है।
- source_word: עֶרְוַת זְנוּנַיִךְ
  choice: तुम्हारे वेश्याकर्मों का नंगापन
  rationale: עֶרְוָה के शाब्दिक 'नंगेपन' और उससे जुड़ी लज्जाजनक बेपर्दगी को बनाए रखा गया है, जबकि זְנוּנִים की स्पष्ट वेश्यावृत्ति-छवि को नरम नहीं किया गया।
- source_word: וְזִמָּתֵךְ
  choice: तुम्हारी अश्लीलता
  rationale: इस यौन-संदर्भ में זִמָּה किसी सामान्य योजना की अपेक्षा कामुक दुराचार या अश्लीलता को सूचित करता है।
- source_word: וְתַזְנוּתָיִךְ
  choice: तुम्हारे वेश्याकर्म
  rationale: यह आसपास के समानार्थी शब्द के साथ जानबूझकर किए गए संचय और दोहराव को सुरक्षित रखता है।
theological_decisions:
- issue: यरूशलेम/सामरिया की बेवफाई के लिए यौन और वेश्यावृत्ति की रूपक-भाषा
  choice: स्पष्ट वेश्याकर्म और नंगेपन की भाषा को बनाए रखा गया।
  alternative: इसे सामान्य 'अनैतिकता' या 'बेवफाई' कहकर नरम करना।
  rationale: यहेजकेल की जानबूझकर तीखी भविष्यद्वाणी-संबंधी भाषा वाचा-भंग और आने वाली लज्जाजनक बेपर्दगी को व्यक्त करती है; इसे नरम करना मूल की आलंकारिक शक्ति घटा देता।
- issue: अंतिम दो संज्ञाओं का वाक्यगत संबंध
  choice: उन्हें डैश के बाद पहले पद की व्याख्यात्मक समानाधिकरणीय अभिव्यक्ति के रूप में रखा गया।
  alternative: उन्हें अलग से प्रकट होने वाली अतिरिक्त वस्तुएँ मानना।
  rationale: एकवचन क्रिया וְנִגְלָה और एकवचन मुख्य पद עֶרְוַת के बाद आने वाली संज्ञाएँ संभवतः उसी लज्जाजनक नंगेपन को स्पष्ट करती हैं; डैश इस संबंध को दर्शाता है, पर अर्थ को अत्यधिक निश्चित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी; संबोधन स्त्रीलिंग एकवचन रखा गया है क्योंकि अध्याय में नगर को स्त्री के रूप में संबोधित किया गया है। भाषा गरिमापूर्ण किंतु मूल की कठोर और स्पष्ट यौन-रूपकात्मक शक्ति के अनुरूप है।
