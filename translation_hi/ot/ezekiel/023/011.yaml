base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/023/011.yaml
  text: When her sister Oholibah saw this[a], she became more corrupt in her lust than her sister, and in her prostitutions more than the prostitutions of her sister.
translation:
  language: hi
  text: जब उसकी बहन ओहोलीबा ने यह देखा, तो उसने अपनी बहन से भी अधिक कामवासना में भ्रष्ट आचरण किया[a], और उसके वेश्यावृत्ति के काम उसकी बहन के वेश्यावृत्ति के कामों से भी बढ़ गए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसने अपनी बहन से भी अधिक कामवासना के द्वारा अपने आपको भ्रष्ट कर लिया।”
    reason: हिफ़ील क्रिया וַתַּשְׁחֵת को ‘भ्रष्ट आचरण किया’ अथवा आत्मवाचक भाव में ‘अपने आपको भ्रष्ट कर लिया’ समझा जा सकता है; इब्रानी की तुलनात्मक रचना संक्षिप्त है।
lexical_decisions:
- source_word: וַתֵּרֶא
  choice: जब ... ने यह देखा
  rationale: क्रिया का मूल अर्थ ‘देखना’ है। इब्रानी में कर्म व्यक्त नहीं है; पिछले प्रसंग को सहज रूप से जोड़ने के लिए हिन्दी में ‘यह’ जोड़ा गया है। ‘जब’ कथात्मक क्रम को स्वाभाविक रूप देता है।
- source_word: אֲחוֹתָהּ אָהֳלִיבָה
  choice: उसकी बहन ओहोलीबा
  rationale: व्यक्तिवाचक नाम का लिप्यंतरण किया गया है और ‘उसकी बहन’ के साथ उसका समानाधिकरण बनाए रखा गया है।
- source_word: וַתַּשְׁחֵת עַגְבָתָהּ מִמֶּנָּה
  choice: वह अपनी बहन से भी अधिक भ्रष्ट काम-वासना में पड़ गई
  rationale: हिफ़ील क्रिया यहाँ नैतिक भ्रष्टता या अपने को भ्रष्ट करने का भाव देती है; עַגְבָה तीव्र, विशेषतः यौन, लालसा है। तुलनात्मक מִן का संबंध पहले उल्लिखित बहन से रखा गया है।
- source_word: וְאֶת תַּזְנוּתֶיהָ
  choice: और उसके वेश्यावृत्ति के काम
  rationale: यह शब्द यौन अनैतिकता और इस अध्याय में उसके द्वारा चित्रित मूर्तिपूजक अविश्वास—दोनों का ठोस रूपक बनाए रखता है। ‘वेश्यावृत्ति के काम’ आधुनिक हिन्दी में बहुवचन कृत्यों को स्पष्ट करता है।
- source_word: מִזְּנוּנֵי אֲחוֹתָהּ
  choice: उसकी बहन के वेश्यावृत्ति के कामों से भी बढ़ गए
  rationale: מִן की तुलना और זְנוּנִים के बहुवचन कृत्यों को स्पष्ट, स्वाभाविक हिन्दी में व्यक्त किया गया है।
theological_decisions:
- issue: वैवाहिक/यौन बेवफ़ाई द्वारा वाचा-विरोध का रूपक
  choice: ‘काम-वासना’ और ‘वेश्यावृत्ति के काम’ जैसी स्पष्ट यौन भाषा बनाए रखी गई है।
  alternative: इसे केवल ‘अविश्वास’, ‘बेवफ़ाई’ या ‘मूर्तिपूजा’ जैसे अमूर्त धार्मिक शब्दों में कहना।
  rationale: नबी की भाषा जानबूझकर तीखी और यौन रूपकयुक्त है। उसे अमूर्त बनाना पाठ की आलंकारिक शक्ति और वाचा-विरोध के साथ उसके तनाव को समय से पहले सुलझा देता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, गरिमापूर्ण किंतु स्पष्ट रखी गई है। अध्याय की कठोर यौन शब्दावली को नरम नहीं किया गया, पर अनावश्यक रूप से अशिष्ट शब्द भी नहीं चुने गए।
