base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/023/005.yaml
  text: Oholah played the prostitute while under me[a], and she lusted after her lovers[c][b], the Assyrians who were nearby.
translation:
  language: hi
  text: ओहोला ने मेरे अधीन रहते हुए[a] वेश्यावृत्ति की, और उसने अपने प्रेमियों, अर्थात् निकटवर्ती अश्शूरियों, के प्रति वासना की[c][b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “मेरे अधीन।” यह वाक्य विवाह-रूपक में यहोवा के अधिकार और संरक्षण के अधीन ओहोला की स्थिति की ओर संकेत करता है।
    reason: lexical_alternative
  - marker: b
    text: या “निकटवर्ती अश्शूरियों पर” अथवा “उन अश्शूरियों पर, जो निकट थे।”
    reason: lexical_alternative
  - marker: c
    text: या “मोहित हो गई” अथवा “उन पर लट्टू हो गई।” इब्रानी क्रिया तीव्र कामुक लालसा व्यक्त करती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּזֶן
  choice: वेश्यावृत्ति की
