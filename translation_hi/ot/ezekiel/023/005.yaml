- source_word: אָהֳלָה
  choice: ओहोला
  rationale: व्यक्तिवाचक नाम का आधुनिक हिन्दी में सीधा लिप्यंतरण किया गया है।
- source_word: תַּחְתָּי
  choice: मेरे अधीन रहते हुए
  rationale: प्रभु के अधिकार और संरक्षण के अधीन होने के साथ-साथ उसी अवधि में किए गए विश्वासघात का भाव व्यक्त करता है; मूल रूपक को केवल 'मेरी होते हुए' में सीमित नहीं करता।
- source_word: וַתַּעְגַּב
  choice: वासना करने लगी
  rationale: क्रिया की तीव्र कामुक लालसा और नकारात्मक नैतिक रंग को स्वाभाविक आधुनिक हिन्दी में बनाए रखता है।
- source_word: מְאַהֲבֶיהָ
  choice: अपने प्रेमियों
  rationale: संज्ञा के रूप में प्रयुक्त कृदंत यहाँ रूपक के अवैध प्रेमियों अथवा विदेशी साझेदारों को दर्शाता है।
- source_word: אֶל אַשּׁוּר
  choice: अश्शूरियों पर
  rationale: אֶל की दिशात्मकता को हिन्दी में 'पर वासना करना' के स्वाभाविक प्रयोग द्वारा व्यक्त किया गया है; अगले बहुवचन विशेषण के अनुसार अश्शूर के लोगों का बहुवचन अर्थ ग्रहण किया गया है।
- source_word: קְרוֹבִים
  choice: अपने निकट रहनेवाले
  rationale: बहुवचन विशेषण का स्थानिक अर्थ सुरक्षित रखता है और 'पड़ोसी' कहकर अनावश्यक संबंधपरक अर्थ नहीं जोड़ता।
theological_decisions:
- issue: सामरिया की वाचा-विमुखता और विदेशी गठबंधनों के लिए विवाह/व्यभिचार का भविष्यवाणी-संबंधी रूपक
  choice: 'यौन रूपक को स्पष्ट रूप से बनाए रखा गया है: ''वेश्यावृत्ति की'' और ''वासना करने लगी''।'
  alternative: इसे नरम करके 'विश्वासघात किया' या 'विदेशी सहयोगियों को चाहा' कहना।
  rationale: यहेजकेल की जानबूझकर तीखी यौन छवि मूर्तिपूजा और राजनीतिक निर्भरता दोनों को चित्रित करती है; उसे केवल कूटनीतिक भाषा में बदलना मूल की शक्ति और तनाव को घटा देता।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु स्पष्ट रूप अपनाया गया है। मूल की तीखी यौन भाषा को शिष्टतावश धुँधला नहीं किया गया। वाक्य में दीर्घ विराम-चिह्न अश्शूरियों को 'प्रेमियों' की व्याख्या के रूप में स्पष्ट करता है, जबकि निकटता संबंधी वाक्यांश की वास्तविक व्याकरणिक संभाव्यता पादटिप्पणी में सुरक्षित है।
