base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/023/003.yaml
  text: They prostituted themselves in Egypt[a]; in their youth they committed prostitution there. There their breasts were fondled[c][b], and there their virgin bosoms were handled.
translation:
  language: hi
  text: उन्होंने मिस्र में वेश्यावृत्ति की[a]; अपनी जवानी में उन्होंने वहीं वेश्यावृत्ति की। वहाँ उनके स्तन दबाए गए, और वहीं उनके कुमारी स्तनों को हाथ लगाया गया[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उन्होंने मिस्र में वेश्या का काम किया”; इब्रानी क्रिया यौन वेश्यावृत्ति और रूपकात्मक बेवफाई—दोनों के लिए प्रयुक्त हो सकती है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी अभिव्यक्तियाँ अत्यन्त स्पष्ट और कुछ हद तक कठिन हैं; अधिक शब्दशः अर्थ हो सकता है, “वहीं उनके स्तन दबाए गए, और वहीं उनके कौमार्य के स्तनों को हाथ लगाया गया।”
    reason: alternative_reading
lexical_decisions:
- source_word: וַתִּזְנֶינָה / זָנוּ
  choice: वेश्यावृत्ति की
  rationale: זנה यहाँ यौन और रूपकात्मक बेवफाई दोनों का आरोप लगाता है। आधुनिक हिन्दी में ‘वेश्यावृत्ति की’ स्पष्ट है और इब्रानी की पुनरावृत्ति को दोनों वाक्यांशों में बनाए रखता है।
- source_word: בְמִצְרַיִם
  choice: मिस्र में
  rationale: स्थानवाचक पद का सीधा और स्वाभाविक अनुवाद।
- source_word: בִּנְעוּרֵיהֶן
  choice: अपनी जवानी में
  rationale: נְעוּרִים युवावस्था को सूचित करता है; यह हिन्दी में स्वाभाविक कालवाचक अभिव्यक्ति है।
- source_word: שָׁמָּה / וְשָׁם
  choice: वहीं / वहाँ ... वहीं
  rationale: इब्रानी में स्थानसूचक शब्द की पुनरावृत्ति बल देती है; हिन्दी में उसे बनाए रखा गया है।
- source_word: מֹעֲכוּ שְׁדֵיהֶן
  choice: उनके स्तन दबाए गए
  rationale: מעך का मूल भाव दबाना या कुचलना है। कर्मवाच्य रचना और स्पष्ट शारीरिक चित्र दोनों सुरक्षित रखे गए हैं।
- source_word: עִשּׂוּ דַּדֵּי בְתוּלֵיהֶן
  choice: उनके कुँवारेपन के उरोजों को छुआ-मसला गया
  rationale: यह कठिन और जानबूझकर स्पष्ट इब्रानी अभिव्यक्ति है। ‘छुआ-मसला गया’ यौन ढंग से हाथ लगाने का भाव देता है, जबकि ‘कुँवारेपन के उरोज’ मूल की असामान्य रचना और कौमार्य के संकेत को बचाता है।
theological_decisions:
- issue: भविष्यवाणी के रूपक में स्पष्ट यौन भाषा
  choice: मुख्य पाठ में स्पष्ट शारीरिक और यौन चित्रण बनाए रखा गया है।
  alternative: इसे ‘वे अपवित्र की गईं’ जैसे शिष्ट संकेत में नरम करना।
  rationale: इब्रानी भाषा जानबूझकर तीखी और असहज है तथा आरम्भिक बेवफाई और अपमान को चित्रित करती है; इसे शिष्टोक्ति से ढकना भविष्यवाणी के बल को घटा देता।
- issue: זנה का यौन और आध्यात्मिक रूपक
  choice: ‘वेश्यावृत्ति की’ कहकर मूल आरोप को खुला रखा गया है।
  alternative: सिर्फ ‘विश्वासघात किया’ या ‘व्यभिचार किया’ कहना।
  rationale: प्रसंग में यह राजनीतिक-धार्मिक बेवफाई का रूपक है, पर भाषा वास्तविक वेश्यावृत्ति की है। अनुवाद दोनों स्तरों के बीच के तनाव को स्वयं पाठ में रहने देता है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की है। पद की कठोर और स्पष्ट भविष्यवाणी-वाणी को बिना अश्लीलतापूर्ण विस्तार जोड़े बनाए रखा गया है। ‘उरोज’ ने दूसरी शारीरिक संज्ञा में गरिमापूर्ण भिन्नता दी है, जबकि ‘स्तन’ पहले पद में सीधा और सामान्य शब्द है।
