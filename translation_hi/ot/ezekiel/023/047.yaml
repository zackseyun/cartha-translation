id: EZK.23.47
reference: Ezekiel 23:47
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/רָגְמ֨וּ עֲלֵי/הֶ֥ן אֶ֨בֶן֙ קָהָ֔ל וּ/בָרֵ֥א אוֹתְ/הֶ֖ן בְּ/חַרְבוֹתָ֑/ם בְּנֵי/הֶ֤ם וּ/בְנֽוֹתֵי/הֶם֙ יַהֲרֹ֔גוּ וּ/בָתֵּי/הֶ֖ן בָּ/אֵ֥שׁ יִשְׂרֹֽפוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/023/047.yaml
  text: And the assembly will stone them with stones and cut them down with their swords. They will kill their sons and their daughters[a], and burn their houses with fire.
translation:
  language: hi
  text: सभा के लोग उन पर पत्थर बरसाएँगे और अपनी तलवारों से उन्हें काट डालेंगे[a]। वे उनके बेटे-बेटियों को मार डालेंगे और उनके घरों को आग से जला देंगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उन्हें काटकर टुकड़े कर देंगे।”
    reason: दुर्लभ क्रिया וּבָרֵא तलवार से काट डालने, चीरने या टुकड़े करने का अधिक तीव्र अर्थ भी दे सकती है।
lexical_decisions:
- source_word: וְרָגְמוּ עֲלֵיהֶן אֶבֶן
  choice: उन पर पत्थर बरसाएँगे
  rationale: רגם पत्थर मारने या पत्थरवाह करने को व्यक्त करता है। אֶבֶן यहाँ सामूहिक अर्थ में है। यह रूप आधुनिक हिन्दी में स्वाभाविक रहते हुए हिंसक क्रिया को स्पष्ट रखता है।
- source_word: קָהָל
  choice: सभा के लोग
  rationale: קהל एक एकत्र समूह या सभा है। हिन्दी में बहुवचन क्रियाओं और आगे आने वाले 'वे' के साथ स्वाभाविक सामंजस्य के लिए 'सभा के लोग' चुना गया है; इससे दंड देने वाले सामूहिक समूह का भाव बना रहता है।
- source_word: וּבָרֵא אוֹתְהֶן
  choice: उन्हें काट डालेंगे
  rationale: दुर्लभ पिएल रूप ברא यहाँ काटने या चीर डालने का अर्थ देता है। 'काट डालेंगे' तलवार से की गई हिंसा को स्पष्ट करता है, जबकि अधिक तीव्र सम्भावित अर्थ पादटिप्पणी में रखा गया है।
- source_word: בְּחַרְבוֹתָם
  choice: अपनी तलवारों से
  rationale: पूर्वसर्ग בְּ साधन सूचित करता है और बहुवचन प्रत्यय आक्रमण करने वालों की तलवारों की ओर संकेत करता है।
- source_word: בְּנֵיהֶם וּבְנוֹתֵיהֶם
  choice: उनके बेटे-बेटियों को
  rationale: मूल पाठ बेटे और बेटियों दोनों का स्पष्ट उल्लेख करता है; हिन्दी का युग्म इस भेद को संक्षिप्त और स्वाभाविक ढंग से बनाए रखता है।
- source_word: יַהֲרֹגוּ
  choice: मार डालेंगे
  rationale: הרג सामान्यतः जान से मारने को दर्शाता है। 'मार डालेंगे' आधुनिक हिन्दी में स्पष्ट और प्रसंगानुकूल है।
- source_word: וּבָתֵּיהֶן בָּאֵשׁ יִשְׂרֹפוּ
  choice: उनके घरों को आग से जला देंगे
  rationale: यह अनुवाद घरों के वास्तविक विनाश और मूल के साधनवाचक 'आग से' दोनों को बनाए रखता है।
theological_decisions:
- issue: स्त्रीलिंग बहुवचन सर्वनामों का संदर्भ
  choice: '''उन पर/उन्हें/उनके'' रखा गया है, स्त्रियों के नाम दोबारा नहीं जोड़े गए'
  alternative: '''इन स्त्रियों'' कहकर संदर्भ स्पष्ट करना'
  rationale: मूल पाठ के स्त्रीलिंग बहुवचन सर्वनाम रूपक की दोनों स्त्रियों की ओर लौटते हैं। केवल सर्वनाम रखने से पाठ का पूर्ववर्ती संदर्भ और उसकी साहित्यिक संगति सुरक्षित रहती है तथा अनावश्यक व्याख्या नहीं जुड़ती।
- issue: קָהָל के साथ बहुवचन क्रियाओं का सामूहिक कर्ता
  choice: '''सभा के लोग'''
  alternative: '''सभा'' को एकवचन कर्ता बनाना'
  rationale: इब्रानी में קָהָל के साथ क्रियाएँ बहुवचन हैं। हिन्दी में 'सभा के लोग' सामूहिकता और बहुवचन क्रिया, दोनों को स्वाभाविक रूप से व्यक्त करता है, बिना समूह की पहचान को अधिक विशिष्ट बनाए।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। हिंसा को न तो नरम किया गया है, न मूल से अधिक सनसनीखेज बनाया गया है। 'सभा के लोग' सामूहिक कर्ता को साधारण पाठक के लिए सहज बनाता है।
