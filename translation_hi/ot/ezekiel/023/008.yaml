base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/023/008.yaml
  text: Yet she did not abandon her prostitutions from Egypt[a], for in her youth they had lain with her[b], and they fondled her virgin breasts and poured out their prostitution upon her.
translation:
  language: hi
  text: फिर भी उसने मिस्र से चली आ रही अपनी वेश्यावृत्तियाँ नहीं छोड़ीं[a], क्योंकि उसकी जवानी में वे उसके साथ सोए थे, उन्होंने उसकी कुँवारी छातियों को सहलाया था[b] और अपनी वेश्यावृत्ति उस पर उँडेल दी थी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: वैकल्पिक रूप से, “मिस्र से उसकी वेश्यावृत्तियाँ।” इब्रानी में पूरे पद में वेश्यावृत्ति का यही रूपक वाचा के प्रति बेवफाई के लिए प्रयुक्त हुआ है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी का शाब्दिक ढाँचा है, “उन्होंने उसके कुँवारेपन की छातियों के साथ किया।” यह एक असामान्य पर स्पष्ट यौन बिंब है, जो उसकी युवावस्था से जुड़ा है।
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּזְנוּתֶיהָ
  choice: अपनी वेश्यागमनों की आदत
  rationale: बहुवचन संज्ञा बार-बार किए गए वेश्यावृत्तिसदृश आचरण को दर्शाती है। हिंदी में केवल ‘वेश्यागमन’ की अपेक्षा ‘वेश्यागमनों की आदत’ निरंतरता और पुनरावृत्ति को स्वाभाविक ढंग से व्यक्त करती है, जबकि वाचा-विमुखता की तीखी रूपक-छवि बनी रहती है।
- source_word: מִמִּצְרַיִם
  choice: मिस्र से चली आ रही
  rationale: מִן स्रोत अथवा आरंभ को सूचित करता है। ‘से चली आ रही’ मिस्र में आरंभ हुई और अब तक जारी आदत का भाव स्पष्ट करता है।
- source_word: לֹא עָזָבָה
  choice: नहीं छोड़ी
  rationale: पूर्व आचरण को जारी रखने के संदर्भ में यह सीधा, आधुनिक और स्वाभाविक हिंदी प्रयोग है।
- source_word: שָׁכְבוּ אוֹתָהּ
  choice: वे उसके साथ सोए थे
  rationale: यह यौन संबंध का इब्रानी शिष्टोक्ति-प्रयोग है; हिंदी वाक्यांश उसी अर्थ को स्पष्ट किंतु अनावश्यक रूप से अश्लील हुए बिना रखता है।
- source_word: בִנְעוּרֶיהָ
  choice: उसकी जवानी में
  rationale: यह स्त्री के आरंभिक जीवनकाल और रूपक में इस्राएल के आरंभिक इतिहास को दर्शाता है।
- source_word: עִשּׂוּ דַּדֵּי בְתוּלֶיהָ
  choice: उन्होंने उसके कुँवारेपन की छातियाँ सहलाई थीं
  rationale: कठिन इब्रानी अभिव्यक्ति का शाब्दिक ढाँचा और स्पष्ट यौन बिंब सुरक्षित रखा गया है। ‘सहलाई’ शारीरिक यौन स्पर्श को स्वाभाविक हिंदी में व्यक्त करती है; फुटनोट शाब्दिक कठिनाई बताता है।
- source_word: וַיִּשְׁפְּכוּ
  choice: उँडेला था
  rationale: ‘उँडेलना’ मूल क्रिया की ठोस ‘बहा देने/उँडेलने’ की छवि और भविष्यद्वक्ता की तीव्र भाषा बनाए रखता है।
- source_word: תַזְנוּתָם
  choice: अपना वेश्यागमन
  rationale: पहली समान-मूल संज्ञा के साथ शब्दगत संगति रखते हुए उनके यौन अनाचार का भाव व्यक्त करता है; इसे केवल ‘वासना’ बनाकर रूपक को नरम नहीं किया गया।
- source_word: עָלֶיהָ
  choice: उस पर
  rationale: עַל का सीधा और स्वाभाविक हिंदी समतुल्य, जो उँडेलने की दृश्यात्मकता बनाए रखता है।
theological_decisions:
- issue: मूर्तिपूजा और विदेशी संबंधों के लिए यौन रूपक
  choice: स्पष्ट यौन बिंब को मुख्य पाठ में बनाए रखा गया।
  alternative: पूरे पद में ‘अनैतिकता’ या ‘विश्वासघात’ जैसे नरम, अमूर्त शब्द रखना।
  rationale: यहेजकेल की भाषा जानबूझकर चौंकाने वाली है और वाचा के प्रति बेवफाई को वेश्यागमन के रूप में चित्रित करती है। इसे अमूर्त बनाने से मूल वक्तृत्व और निंदा की तीव्रता घट जाती।
- issue: मिस्रियों के साथ संबंध में सहमति अथवा शोषण का प्रश्न
  choice: मूल पाठ की स्पष्ट यौन क्रियाएँ रखीं, पर मुख्य पाठ में सहमति या बल का अतिरिक्त दावा नहीं जोड़ा।
  alternative: इसे स्पष्ट रूप से बलात्कार अथवा केवल स्वेच्छिक वेश्यावृत्ति कहना।
  rationale: इस पद की व्याकरणिक छवि स्त्री को क्रियाओं का लक्ष्य बनाती है, लेकिन अकेला यह पद संबंध की प्रकृति को पूरी तरह निर्णीत नहीं करता; इसलिए वास्तविक तनाव सुरक्षित रखा गया।
