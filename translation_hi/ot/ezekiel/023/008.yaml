  register: आधुनिक मानक हिंदी में गरिमापूर्ण किंतु मूल के अनुरूप स्पष्ट भविष्यद्वक्ताई भाषा रखी गई है। ‘वेश्यागमन’, ‘छातियाँ’ और ‘उँडेला’ जैसे शब्द मूल की तीखी यौन छवि को नरम नहीं करते। दोनों फुटनोट-चिह्न [a] और [b] मुख्य पाठ में उपस्थित हैं।
