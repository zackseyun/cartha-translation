source:
  edition: WLC
  text: וַ/אֲנָשִׁ֣ים צַדִּיקִ֗ם הֵ֚מָּה יִשְׁפְּט֣וּ אֽוֹתְ/הֶ֔ם מִשְׁפַּט֙ נֹֽאֲפ֔וֹת וּ/מִשְׁפַּ֖ט שֹׁפְכ֣וֹת דָּ֑ם כִּ֤י נֹֽאֲפֹת֙ הֵ֔נָּה וְ/דָ֖ם בִּֽ/ידֵי/הֶֽן׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/023/045.yaml
  text: But righteous men will judge them with the judgment of adulteresses and with the judgment of women who shed blood[a], because they are adulteresses[b], and blood is on their hands.
translation:
  language: hi
  text: पर धर्मी पुरुष उनका न्याय व्यभिचारिणियों के न्याय और खून बहाने वाली स्त्रियों के न्याय के अनुसार करेंगे[a], क्योंकि वे व्यभिचारिणियाँ हैं और उनके हाथों पर खून है[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘उनका न्याय वैसा करेंगे जैसा व्यभिचारिणियों और खून बहाने वाली स्त्रियों का किया जाता है।’
    reason: इब्रानी संबंधवाचक रचना न्याय के प्रकार, मानदण्ड या ऐसे अपराधियों के लिए निर्धारित न्याय को सूचित कर सकती है।
  - marker: b
    text: शब्दशः, ‘खून उनके हाथों में है।’
    reason: मुख्य पाठ में दोषी होने का स्वाभाविक हिन्दी मुहावरा दिया गया है, जबकि टिप्पणी मूल स्थानवाचक अभिव्यक्ति दिखाती है।
lexical_decisions:
- source_word: וַ/אֲנָשִׁים צַדִּיקִם הֵמָּה
  choice: परन्तु धर्मी पुरुष ही
  rationale: ו को प्रसंगगत विरोध के कारण ‘परन्तु’ कहा गया है। אֲנָשִׁים का स्पष्ट पुल्लिंग ‘पुरुष’ रखा गया है, और स्वतंत्र सर्वनाम הֵמָּה के बल को ‘ही’ से व्यक्त किया गया है।
- source_word: יִשְׁפְּטוּ אוֹתְהֶם
  choice: उनका न्याय ... करेंगे
  rationale: यह भविष्यसूचक प्रसंग में न्याय किए जाने की क्रिया है। हिन्दी में ‘उनका न्याय करेंगे’ स्वाभाविक और न्यायिक भाव के अनुकूल है।
- source_word: מִשְׁפַּט נֹאֲפוֹת
  choice: व्यभिचारिणियों के न्याय के अनुसार
  rationale: रचना का शाब्दिक भाव ‘व्यभिचारिणियों का न्याय’ है। ‘के अनुसार’ दण्ड-विधान अथवा न्याय के मानदण्ड का आशय स्पष्ट करता है, पर ‘न्याय’ की अर्थगत व्यापकता बनाए रखता है।
- source_word: וּמִשְׁפַּט שֹׁפְכוֹת דָּם
  choice: और खून बहानेवाली स्त्रियों के न्याय के अनुसार
  rationale: स्त्रीलिंग बहुवचन कृदन्त को ‘स्त्रियों’ से स्पष्ट रखा गया है। ‘खून बहाना’ आधुनिक हिन्दी में रक्तपात के लिए सहज और गंभीर अभिव्यक्ति है।
- source_word: כִּי נֹאֲפֹת הֵנָּה
  choice: क्योंकि वे व्यभिचारिणियाँ हैं
  rationale: כִּי यहाँ न्याय का कारण बताता है। स्त्रीलिंग बहुवचन और कानूनी-नैतिक श्रेणी दोनों सुरक्षित रखे गए हैं।
- source_word: וְדָם בִּידֵיהֶן
  choice: और उनके हाथों पर खून है
  rationale: इब्रानी में शब्दशः ‘उनके हाथों में खून’ है। हिन्दी का ‘हाथों पर खून होना’ रक्तपात के दोष का स्वाभाविक मुहावरा है और मूल रूपक को भी बनाए रखता है।
theological_decisions:
- issue: न्याय करनेवाले धर्मी पुरुषों की पहचान
  choice: पद में उन्हें मानवीय न्यायिक कर्ताओं के रूप में अनिर्दिष्ट रखा गया है
  alternative: उन्हें स्वर्गीय अथवा आदर्शीकृत दैवी न्याय के प्रतिनिधि मानना
  rationale: इब्रानी पाठ केवल ‘धर्मी पुरुष’ कहता है। अनुवाद उनकी पहचान को अधिक विशिष्ट बनाकर पद की वास्तविक अनिश्चितता को समाप्त नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। ‘धर्मी’, ‘न्याय’ और ‘व्यभिचारिणियाँ’ जैसे परिचित बाइबलीय-न्यायिक शब्द मूल पद के नैतिक और कानूनी तनाव को बनाए रखते हैं।
