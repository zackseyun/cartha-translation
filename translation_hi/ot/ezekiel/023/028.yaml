source:
  edition: WLC
  text: כִּ֣י כֹ֤ה אָמַר֙ אֲדֹנָ֣/י יְהוִ֔ה הִנְ/נִי֙ נֹֽתְנָ֔/ךְ בְּ/יַ֖ד אֲשֶׁ֣ר שָׂנֵ֑את בְּ/יַ֛ד אֲשֶׁר נָקְעָ֥ה נַפְשֵׁ֖/ךְ מֵ/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/023/028.yaml
  text: 'For thus says the Lord GOD: Behold[a], I am giving you into the hand of those whom you hate, into the hand of those from whom your soul has turned away.'
translation:
  language: hi
  text: 'क्योंकि प्रभु यहोवा यों कहता है: देख, मैं तुझे उनके हाथ में दे रहा हूँ जिनसे तू बैर रखती है—उनके हाथ में, जिनसे तेरा मन फिर गया है।[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “जिनसे तेरा जी घृणा करने लगा है,” अथवा “जिनसे तेरा मन पूरी तरह अलग हो गया है।” इब्रानी अभिव्यक्ति गहरी विरक्ति, घृणा या टूटे हुए लगाव का बोध करा सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  choice: प्रभु यहोवा
  rationale: यह संयुक्त ईश्वरीय उपाधि אֲדֹנָי को ‘प्रभु’ और वाचा के नाम יהוה को ‘यहोवा’ के रूप में व्यक्त करती है; इससे दोनों घटक स्पष्ट रहते हैं और असहज पुनरुक्ति नहीं होती।
- source_word: הִנְנִי
  choice: देख
  rationale: यह आसन्न और गंभीर ईश्वरीय घोषणा की ओर ध्यान खींचने वाला पद है। ‘देख’ आधुनिक हिन्दी में संक्षिप्त और भविष्यद्वाणी के गरिमापूर्ण स्वर के अनुकूल है।
- source_word: נֹתְנָךְ
  choice: मैं तुझे ... दे रहा हूँ
  rationale: הִנְנִי के साथ प्रयुक्त कृदंत आसन्न, आरम्भ होने वाली क्रिया दर्शाता है। वर्तमान प्रगतिशील रूप उस निकटता को बनाए रखता है।
- source_word: בְּיַד
  choice: के हाथ में
  rationale: यह किसी के अधिकार या नियंत्रण में दिए जाने का मुहावरा है। शाब्दिक ‘हाथ’ का बिंब हिन्दी में भी स्पष्ट और स्वाभाविक है।
- source_word: אֲשֶׁר שָׂנֵאת
  choice: जिनसे तू बैर रखती है
  rationale: स्त्रीलिंग एकवचन संबोधन ओहोलीबा/यरूशलेम से है। ‘बैर रखती है’ घृणा और शत्रुतापूर्ण संबंध दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: נָקְעָה נַפְשֵׁךְ מֵהֶם
  choice: जिनसे तेरा मन फिर गया है
  rationale: दुर्लभ क्रिया נקע यहाँ गहरी विमुखता, विरक्ति या अलगाव व्यक्त कर सकती है। ‘मन फिर गया’ נפש के भीतरी और व्यक्तिगत आयाम को रखते हुए इस बहुअर्थता को कठोरता से एक ही अर्थ में सीमित नहीं करता।
theological_decisions:
- issue: אֲדֹנָי יְהוִה में ईश्वरीय नाम का अनुवाद
  choice: प्रभु यहोवा
  alternative: प्रभु परमेश्वर
  rationale: मूल पाठ में वाचा का नाम יהוה स्पष्ट रूप से उपस्थित है। ‘यहोवा’ उसे सामान्य उपाधि ‘परमेश्वर’ में विलीन किए बिना हिन्दी पाठक के लिए परिचित रूप में रखता है।
- issue: दण्ड की घोषणा में परमेश्वर की सक्रिय भूमिका
  choice: मैं तुझे उनके हाथ में दे रहा हूँ
  alternative: तू उनके हाथ में पड़ने वाली है
  rationale: मूल में प्रथम पुरुष ईश्वरीय क्रिया נֹתְנָךְ है। सक्रिय रूप बनाए रखने से न्याय की घोषणा का मूल धार्मिक तनाव कम नहीं होता।
translation_notes:
  register: आधुनिक, गरिमापूर्ण भविष्यद्वाणी-शैली अपनाई गई है। स्त्रीलिंग एकवचन ‘तू/तुझे/रखती’ द्वारा यरूशलेम के रूपकात्मक स्त्री-संबोधन को स्पष्ट रखा गया है। ‘हाथ में’ का मूल बिंब सुरक्षित है, और दुर्लभ क्रिया נקע की अर्थगत अनिश्चितता को मुख्य पाठ तथा पादटिप्पणी में बनाए रखा गया है।
