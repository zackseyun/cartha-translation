- source_word: ק֣וֹל הָמוֹן֮ שָׁלֵ֣ו
  choice: बेफ़िक्र भीड़ का कोलाहल
  rationale: קוֹל और הָמוֹן मिलकर भीड़ से उठने वाली ध्वनि अथवा हलचल का दृश्य बनाते हैं; שָׁלֵו के निश्चिंत, आरामपरस्त अथवा आत्मसंतुष्ट भाव को यहाँ ‘बेफ़िक्र’ व्यक्त करता है।
- source_word: בָהּ
  choice: उसके भीतर
  rationale: स्त्री/नगर के मानवीकरण को बनाए रखते हुए स्थानवाचक अर्थ स्वाभाविक हिन्दी में व्यक्त किया गया है।
- source_word: אֲנָשִׁים
  choice: पुरुषों
  rationale: शब्द पुल्लिंग बहुवचन है और प्रसंग में स्त्रियों के पास आने वाले पुरुषों का उल्लेख है।
- source_word: מֵרֹב אָדָם
  choice: बहुत-से लोगों में से आए
  rationale: संक्षिप्त और कठिन इब्रानी पदबंध को जानबूझकर कुछ खुला रखा गया है; यह व्यापक जनसमूह में से पुरुषों के होने का भाव दे सकता है।
- source_word: מוּבָאִים סובאים מִמִּדְבָּר
  choice: निर्जन प्रदेश से पियक्कड़ लाए गए
  rationale: मध्य उपवाक्य पाठगत और वाक्यगत रूप से कठिन है। סובאים को प्रचलित समझ के अनुसार मद्यपायी पुरुष और מִדְבָּר को ‘निर्जन प्रदेश’ कहा गया है।
- source_word: צְמִידִים אֶל יְדֵיהֶן
  choice: उन स्त्रियों के हाथों में कंगन पहनाए
  rationale: शाब्दिक ‘हाथों पर/की ओर’ को आभूषण पहनाने की स्वाभाविक हिन्दी में दिया गया है; स्त्रीलिंग सर्वनाम की स्पष्टता के लिए ‘स्त्रियों’ जोड़ा गया है।
- source_word: עֲטֶרֶת תִּפְאֶרֶת
  choice: शोभायमान मुकुट
  rationale: समास का अर्थ ‘शोभा/वैभव का मुकुट’ है; ‘शोभायमान मुकुट’ संक्षिप्त, गरिमामय और सहज है।
theological_decisions:
- issue: कठिन मध्य उपवाक्य में कर्ता और संबंध
  choice: बहुत-से लोगों में से आए पुरुषों के पास निर्जन प्रदेश से पियक्कड़ लाए गए
  alternative: और जनसमूह के पुरुषों के साथ निर्जन प्रदेश से पियक्कड़ भी लाए गए
  rationale: इब्रानी वाक्यरचना असामान्य है और संबंध निश्चित नहीं है। मुख्य पाठ अपेक्षाकृत औपचारिक संरचना रखता है, जबकि पादटिप्पणी वैकल्पिक संबंध बताती है; किसी धर्मवैज्ञानिक निष्कर्ष को आरोपित नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमामय किंतु सामान्य पाठक के लिए सुबोध शैली रखी गई है। स्त्रीलिंग बहुवचन सर्वनाम को अस्पष्टता से बचाने हेतु ‘उन स्त्रियों’ कहा गया है। कठिन मध्य खंड की वास्तविक वाक्यगत अनिश्चितता पादटिप्पणी में सुरक्षित है।
