  yaml_path: translation/ot/ezekiel/023/042.yaml
  text: And the sound of a carefree multitude was in her[a], and to the men from the mass of mankind were brought drunkards from the wilderness[c][b]; and they put bracelets on their hands and a beautiful crown on their heads.
translation:
  language: hi
  text: और उसके भीतर बेफ़िक्र जनसमूह की आवाज़ थी[a]। जनसाधारण में से पुरुषों के पास निर्जन प्रदेश से पियक्कड़ लाए गए[b]। उन्होंने उन स्त्रियों के हाथों में कंगन पहनाए और उनके सिरों पर शोभायमान मुकुट रखे[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसके भीतर निश्चिंत जनसमूह की आवाज़ थी” अथवा “आत्मसंतुष्ट भीड़ का कोलाहल था।”
    reason: lexical_alternative
  - marker: b
    text: 'इस मध्य उपवाक्य का इब्रानी पाठ कठिन है। इसका अर्थ यह भी हो सकता है: “और जनसमूह के पुरुषों के साथ निर्जन प्रदेश से पियक्कड़ भी लाए गए।”'
    reason: alternative_reading
  - marker: c
    text: शाब्दिक रूप से, “शोभा का मुकुट” अथवा “वैभवशाली मुकुट।”
    reason: lexical_alternative
