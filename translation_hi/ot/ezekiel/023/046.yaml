source:
  edition: WLC
  text: כִּ֛י כֹּ֥ה אָמַ֖ר אֲדֹנָ֣/י יְהוִ֑ה הַעֲלֵ֤ה עֲלֵי/הֶם֙ קָהָ֔ל וְ/נָתֹ֥ן אֶתְ/הֶ֖ן לְ/זַעֲוָ֥ה וְ/לָ/בַֽז׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/023/046.yaml
  text: 'For thus says the Lord GOD: Bring up an assembly against them[a], and give them over to terror and plunder.'
translation:
  language: hi
  text: 'क्योंकि प्रभु यहोवा यों कहता है: उनके विरुद्ध एक दल ले आ और उन्हें आतंक और लूट के हवाले कर दे।[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उन्हें भयावह दशा और लूट का पात्र बना दे।” इब्रानी शब्द זַעֲוָה उस आतंक को भी सूचित कर सकता है जिसे वे सहें, और ऐसी भयावह दशा को भी जिसके कारण वे दूसरों के लिए डर का विषय बनें।
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  choice: प्रभु यहोवा
  rationale: संयुक्त ईश्वरीय उपाधि में אֲדֹנָי को ‘प्रभु’ और वाचा के नाम יהוה को ‘यहोवा’ रखा गया है; इससे दोनों तत्व स्पष्ट और स्वाभाविक हिन्दी में बने रहते हैं।
- source_word: הַעֲלֵה
  choice: बुला ला
  rationale: हिफ़ील आज्ञार्थक रूप यहाँ किसी विरोधी समूह को उनके विरुद्ध ले आने या बुलाने की आज्ञा देता है। ‘बुला ला’ इस प्रेरणार्थक भाव को सहज हिन्दी में व्यक्त करता है।
- source_word: קָהָל
  choice: एक दल
  rationale: शब्द का मूल अर्थ एकत्र किया हुआ समुदाय या जमावड़ा है। न्याय के इस प्रसंग में वह आक्रमण के लिए जुटे समूह को सूचित करता है; ‘दल’ सैन्य अर्थ को अनावश्यक रूप से अत्यधिक निश्चित किए बिना यह बात प्रकट करता है।
- source_word: וְנָתֹן
  choice: और ... हवाले कर दे
  rationale: रूप आज्ञाओं की शृंखला को आगे बढ़ाता है। हिन्दी में ‘हवाले कर दे’ किसी को विनाशकारी दशा में सौंप देने का भाव स्वाभाविक रूप से व्यक्त करता है।
- source_word: לְזַעֲוָה
  choice: आतंक
  rationale: दुर्लभ संज्ञा भय, दहशत अथवा भयावह दृश्य या दशा का बोध करा सकती है। मुख्य पाठ में ‘आतंक’ परिणाम की तीव्रता व्यक्त करता है, जबकि वैकल्पिक वस्तुपरक अर्थ पादटिप्पणी में सुरक्षित है।
- source_word: לָבַז
  choice: लूट
  rationale: בז का अर्थ लूटी हुई संपत्ति या लूट है। समान पूर्वसर्ग से जुड़े दोनों पदों को हिन्दी में ‘आतंक और लूट के हवाले’ कहना संक्षिप्त और सुबोध है।
- source_word: עֲלֵיהֶם / אֶתְהֶן
  choice: उनके विरुद्ध ... उन्हें
  rationale: इब्रानी में पहले पुल्लिंग बहुवचन और फिर स्त्रीलिंग बहुवचन आता है, जो ओहोला और ओहोलीबा के रूपक-संदर्भ से जुड़ा है। हिन्दी सर्वनाम यहाँ लिंग-भेद नहीं दिखाते, इसलिए प्रसंगानुकूल सामान्य बहुवचन रखा गया है।
theological_decisions:
- issue: אֲדֹנָי יְהוִה में ईश्वरीय नाम का अनुवाद
  choice: प्रभु यहोवा
  alternative: प्रभु याहवे
  rationale: मूल पाठ में उपाधि और व्यक्तिगत वाचा-नाम दोनों उपस्थित हैं। हिन्दी बाइबल-परंपरा में व्यापक रूप से पहचाने जाने वाले ‘यहोवा’ को रखकर नाम को केवल ‘परमेश्वर’ जैसी उपाधि में नहीं बदला गया; ‘याहवे’ अधिक प्रत्यक्ष लिप्यंतरण का संभव विकल्प है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘यों कहता है’ भविष्यद्वाणी की पारंपरिक उद्घोषणा को संक्षेप में बनाए रखता है। आज्ञार्थक क्रियाएँ एकवचन में हैं, जैसा इब्रानी पाठ में है।
