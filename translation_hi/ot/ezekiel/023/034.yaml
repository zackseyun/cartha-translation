  text: וְ/שָׁתִ֨ית אוֹתָ֜/הּ וּ/מָצִ֗ית וְ/אֶת חֲרָשֶׂ֛י/הָ תְּגָרֵ֖מִי וְ/שָׁדַ֣יִ/ךְ תְּנַתֵּ֑קִי כִּ֚י אֲנִ֣י דִבַּ֔רְתִּי נְאֻ֖ם אֲדֹנָ֥/י יְהוִֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/023/034.yaml
  text: You will drink it and drain it dry[a], and you will gnaw its shards, and tear off your breasts; for I have spoken, declares the Lord GOD.
translation:
  language: hi
  text: तू उसे पीएगी और पूरी तरह खाली कर देगी; उसके ठीकरों[a] को चबाएगी और अपने स्तनों को फाड़ डालेगी; क्योंकि मैंने कहा है—प्रभु यहोवा की यह घोषणा है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात मिट्टी के टूटे हुए पात्र के टुकड़े।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁתִית אוֹתָהּ
  choice: तू उसे पीएगी
  rationale: द्वितीय पुरुष स्त्रीलिंग एकवचन रूप संदर्भ में प्याले की ओर संकेत करता है और भविष्यसूचक वाणी में भावी क्रिया व्यक्त करता है।
- source_word: וּמָצִית
  choice: और पूरी तरह खाली कर देगी
  rationale: מצה यहाँ प्याले को अंतिम बूंद तक निकाल देने का अर्थ देता है; यह हिंदी में पूर्णतः पी डालने की छवि को स्वाभाविक रूप से व्यक्त करता है।
- source_word: חֲרָשֶׂיהָ
  choice: उसके मिट्टी के टुकड़ों
  rationale: חֶרֶשׂ मिट्टी के टूटे पात्र के टुकड़े को दर्शाता है। मुख्य पाठ में स्पष्ट और सामान्य हिंदी रखी गई है।
- source_word: תְּגָרֵמִי
  choice: को चबाएगी
  rationale: पिएल रूप कठोर वस्तु को कुतरने या चबाने की हिंसक क्रिया बताता है; 'चबाएगी' आधुनिक हिंदी में स्पष्ट है और विचलित करने वाली मूल छवि बनाए रखता है।
- source_word: וְשָׁדַיִךְ תְּנַתֵּקִי
  choice: और अपने स्तनों को नोच डालेगी
  rationale: נתק के पिएल में खींचकर अलग करने या फाड़ डालने का बल है। 'नोच डालेगी' आत्म-विकृति की जानबूझकर कठोर न्याय-छवि को नरम नहीं करता।
- source_word: כִּי אֲנִי דִבַּרְתִּי
  choice: क्योंकि मैंने ही यह कहा है
  rationale: כִּי कारण देता है और स्वतंत्र सर्वनाम אֲנִי का बल 'मैंने ही' से व्यक्त होता है; यह घोषित न्याय की निश्चितता पर जोर देता है।
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: प्रभु यहोवा की घोषणा है
  rationale: נְאֻם भविष्यसूचक घोषणा-सूत्र है। אֲדֹנָי को 'प्रभु' और יהוה को प्रचलित हिंदी बाइबलीय रूप 'यहोवा' से अलग-अलग सुरक्षित रखा गया है।
theological_decisions:
- issue: אֲדֹנָי יְהוִה में परमेश्वर के नाम का अनुवाद
  choice: प्रभु यहोवा
  alternative: प्रभु परमेश्वर
  rationale: हिब्रू में उपाधि אֲדֹנָי और विशिष्ट नाम יהוה दोनों उपस्थित हैं। 'प्रभु यहोवा' इस भेद को बनाए रखता है और किसी विशेष व्याख्यात्मक अर्थ को नहीं जोड़ता।
- issue: वक्ता के जोर का निर्वाह
  choice: मैंने ही यह कहा है
  alternative: मैंने यह कहा है
  rationale: अलग से प्रयुक्त אֲנִי वक्ता पर जोर दे सकता है; 'ही' उस जोर को हिंदी में सुरक्षित रखता है और न्याय की निश्चितता को स्पष्ट करता है।
translation_notes:
  register: आधुनिक मानक हिंदी में गंभीर, सीधी और भविष्यसूचक शैली रखी गई है। स्त्रीलिंग एकवचन संबोधन के लिए 'तू' मूल की तीखी प्रत्यक्षता को बनाए रखता है। हिंसक और विचलित करने वाली छवियों को जानबूझकर नरम नहीं किया गया है।
