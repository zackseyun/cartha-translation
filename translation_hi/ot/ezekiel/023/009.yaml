  text: לָ/כֵ֥ן נְתַתִּ֖י/הָ בְּ/יַד מְאַֽהֲבֶ֑י/הָ בְּ/יַד֙ בְּנֵ֣י אַשּׁ֔וּר אֲשֶׁ֥ר עָגְבָ֖ה עֲלֵי/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/023/009.yaml
  text: Therefore I gave her into the hand of her lovers[a], into the hand of the sons of Assyria[b], for whom she lusted.
translation:
  language: hi
  text: इसलिए मैंने उसे उसके प्रेमियों के हाथ में, अश्शूरियों के हाथ में सौंप दिया, जिनके प्रति वह कामुक लालसा रखती थी।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לָכֵן
  choice: इसलिए
  rationale: यह पिछले आरोप के परिणामस्वरूप आने वाले न्याय को स्पष्ट करता है और हिब्रू के निष्कर्षसूचक बल को स्वाभाविक हिन्दी में रखता है।
- source_word: נְתַתִּיהָ בְּיַד
  choice: मैंने उसे ... के हाथ में कर दिया
  rationale: נתן और בְּיַד का संयुक्त प्रयोग किसी को दूसरे के अधिकार में सौंपने का भाव देता है; यह हिन्दी मुहावरा मूल की ठोस छवि बनाए रखता है।
- source_word: מְאַהֲבֶיהָ
  choice: उसके प्रेमियों
  rationale: यहेजकेल के विस्तृत व्यभिचार-रूपक में यह अनुचित राजनीतिक संबंधों को प्रेमियों के रूप में प्रस्तुत करता है; रूपक को नरम नहीं किया गया।
- source_word: בְּנֵי אַשּׁוּר
  choice: अश्शूरियों
  rationale: शाब्दिक अर्थ ‘अश्शूर के पुत्र’ है, पर आधुनिक हिन्दी में ‘अश्शूरी’ उसी जनसमूह का स्पष्ट और स्वाभाविक नाम है।
- source_word: עָגְבָה עֲלֵיהֶם
  choice: जिनके लिए वह कामवासना से भर गई थी
  rationale: עגב यहाँ तीव्र, यौन-रंगी हुई लालसा व्यक्त करता है। यह चयन भविष्यद्वक्ता के व्यभिचार-रूपक की तीव्रता बनाए रखते हुए हिन्दी में समझने योग्य है।
theological_decisions:
- issue: सामरिया/ओहोला के विदेशी संबंधों के लिए भविष्यद्वाणी का यौन रूपक
  choice: ‘प्रेमियों’ और ‘कामवासना’ की रूपकात्मक भाषा बनाए रखी गई।
  alternative: ‘सहयोगियों’ और ‘आकर्षित हुई’ जैसे विशुद्ध राजनीतिक और नरम शब्द।
  rationale: मूल हिब्रू विदेशी गठबंधनों को वाचा-विरोधी व्यभिचार के रूप में जानबूझकर चित्रित करता है। इसे बनाए रखना पाठ की भविष्यद्वाणी-संबंधी शक्ति और नैतिक तनाव को सुरक्षित रखता है, बिना कोई अतिरिक्त सांप्रदायिक व्याख्या जोड़े।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। ‘के हाथ में कर दिया’ मूल मुहावरे को सुरक्षित रखता है, जबकि ‘अश्शूरियों’ शाब्दिक ‘अश्शूर के पुत्रों’ की अपेक्षा स्वाभाविक हिन्दी है।
