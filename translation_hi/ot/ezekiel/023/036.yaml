  naturalness: The wording is generally clear and suitably dignified. “उन्हें उनके घृणित काम बता दो” is natural modern Hindi while maintaining the direct imperative and the referential ambiguity of the Hebrew pronouns.
  terminology: Use “याहवे” for Yahweh and “घृणित काम” for the women’s תועבות, rather than the somewhat less specific “घिनौने काम.” “मनुष्य के पुत्र” appropriately preserves Ezekiel’s conventional form of address.
