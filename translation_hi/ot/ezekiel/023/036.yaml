  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֵלַ֔/י בֶּן אָדָ֕ם הֲ/תִשְׁפּ֥וֹט אֶֽת אָהֳלָ֖ה וְ/אֶת אָהֳלִיבָ֑ה וְ/הַגֵּ֣ד לָ/הֶ֔ן אֵ֖ת תוֹעֲבוֹתֵי/הֶֽן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/023/036.yaml
  text: Then Yahweh said to me, “Son of man, will you judge Oholah and Oholibah? Then declare to them their abominations.”
translation:
  language: hi
  text: तब याहवे ने मुझसे कहा, “हे मनुष्य के पुत्र, क्या तुम ओहोला और ओहोलीबा का न्याय करोगे? उन्हें उनके घृणित काम बता दो।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: तब ... ने ... कहा
  rationale: वाव-क्रमसूचक कथा को आगे बढ़ाता है; ‘तब’ आधुनिक हिन्दी में क्रम को स्वाभाविक रूप से व्यक्त करता है।
- source_word: יְהוָה
  choice: यहवे
  rationale: परमेश्वर के व्यक्तिगत नाम चतुरक्षर को उपाधि से बदलने के बजाय हिन्दी में प्रचलित निकट लिप्यंतरण दिया गया है।
- source_word: בֶּן אָדָם
  choice: हे मनुष्य के पुत्र
  rationale: यहेजकेल को किया जाने वाला यह विशिष्ट संबोधन मूल इब्रानी मुहावरे के निकट रखा गया है।
- source_word: הֲתִשְׁפּוֹט
  choice: क्या तुम ... का न्याय करोगे?
  rationale: प्रश्नवाचक कण और अपूर्ण क्रिया का प्रश्नरूप सुरक्षित है; इससे न्याय करने के भविष्याभिमुख आदेश का संकेत भी बना रहता है।
- source_word: אָהֳלָה וְאֶת אָהֳלִיבָה
  choice: ओहोला और ओहोलीबा
  rationale: दोनों प्रतीकात्मक स्त्री-नामों का देवनागरी में लिप्यंतरण किया गया है।
- source_word: וְהַגֵּד לָהֶן
  choice: उन्हें ... बता दो
  rationale: हिफ़ील आज्ञार्थक का अर्थ ‘ज्ञात करा देना/बता देना’ है; ‘बता दो’ सहज हिन्दी में आदेश की शक्ति रखता है।
- source_word: תוֹעֲבוֹתֵיהֶן
  choice: उनके घिनौने काम
  rationale: यह चयन शब्द की प्रबल नैतिक और धार्मिक घृणास्पदता व्यक्त करता है और हिन्दी में केवल अमूर्त ‘घृणित वस्तुएँ’ की अपेक्षा अधिक स्पष्ट है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में व्यक्तिगत वाचा-नाम है। ‘यहवे’ उसका निकट हिन्दी लिप्यंतरण है और उसे किसी उपाधि से प्रतिस्थापित नहीं करता।
- issue: הֲתִשְׁפּוֹט को प्रश्न अथवा आदेश के रूप में समझना
  choice: 'प्रश्नरूप: ‘क्या तुम ... न्याय करोगे?’'
  alternative: 'आदेशरूप: ‘... का न्याय करो’'
  rationale: मूल में स्पष्ट प्रश्नवाचक הֲ है, इसलिए प्रश्न को बनाए रखा गया है, यद्यपि प्रसंग में यह न्याय की भविष्यद्वक्ताई आज्ञा की ओर ले जाता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। प्रश्न और उसके बाद आने वाली स्पष्ट आज्ञा का मूल तनाव सुरक्षित है।
