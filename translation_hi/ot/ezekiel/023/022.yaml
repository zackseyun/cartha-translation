  edition: WLC
  text: לָ/כֵ֣ן אָהֳלִיבָ֗ה כֹּֽה אָמַר֮ אֲדֹנָ֣/י יְהוִה֒ הִנְ/נִ֨י מֵעִ֤יר אֶת מְאַהֲבַ֨יִ/ךְ֙ עָלַ֔יִ/ךְ אֵ֛ת אֲשֶׁר נָקְעָ֥ה נַפְשֵׁ֖/ךְ מֵ/הֶ֑ם וַ/הֲבֵאתִ֥י/ם עָלַ֖יִ/ךְ מִ/סָּבִֽיב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/023/022.yaml
  text: 'Therefore[a], Oholibah, thus says the Lord GOD: Behold, I am stirring up your lovers against you, those from whom your soul has turned away, and I will bring them against you from every side.'
translation:
  language: hi
  text: 'इसलिए, हे ओहोलीबा, प्रभु यहोवा यों कहता है: देख, मैं तेरे प्रेमियों को तेरे विरुद्ध उकसा रहा हूँ—उन्हीं को, जिनसे तेरा मन फिर गया है[a]—और मैं उन्हें चारों ओर से तेरे विरुद्ध ले आऊँगा।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “जिनसे तुझे घृणा हो गई थी” अथवा “जिनसे तू अलग हो गई थी।” इब्रानी क्रिया में घृणा या संबंध-विच्छेद—दोनों का भाव हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: इसलिए
  rationale: यह पिछले अभियोग के परिणाम को प्रस्तुत करता है और भविष्यवाणी के न्यायिक बल को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: אָהֳלִיבָה
  choice: ओहोलीबा
  rationale: व्यक्तिवाचक नाम का ध्वन्यात्मक लिप्यंतरण किया गया है।
- source_word: כֹּה אָמַר אֲדֹנָי יְהוִה
  choice: प्रभु यहोवा यों कहता है
  rationale: भविष्यद्वक्ताओं की मानक संदेश-विधि को रखते हुए אֲדֹנָי को ‘प्रभु’ और परमेश्वर के निज नाम יְהוָה को ‘यहोवा’ दिया गया है।
- source_word: הִנְנִי
  choice: देख, मैं
  rationale: गंभीर ईश्वरीय घोषणा की ओर ध्यान खींचने वाली शक्ति को गरिमापूर्ण और सहज हिन्दी में व्यक्त करता है।
- source_word: מֵעִיר
  choice: उकसा रहा हूँ
  rationale: हिफ़ील कृदंत यहाँ विरोधी कार्रवाई के लिए सक्रिय करने या भड़काने का भाव देता है।
- source_word: מְאַהֲבַיִךְ
  choice: तेरे प्रेमियों
  rationale: अध्याय में अवैध यौन और राजनीतिक संबंधों के रूपक तथा आरोपात्मक स्वर को सुरक्षित रखता है।
- source_word: אֵת אֲשֶׁר נָקְעָה נַפְשֵׁךְ מֵהֶם
  choice: उन्हीं को, जिनसे तेरा मन फिर गया है
  rationale: נפש को स्वाभाविक हिन्दी में ‘मन’ दिया गया है; נקע की विरक्ति अथवा अलगाव की संभावित छायाओं में से किसी एक को अनावश्यक रूप से निर्णायक नहीं बनाया गया।
- source_word: וַהֲבֵאתִים עָלַיִךְ מִסָּבִיב
  choice: और मैं उन्हें चारों ओर से तेरे विरुद्ध ले आऊँगा
  rationale: ईश्वर द्वारा शत्रुओं को लाने और घेर लेने के भाव को स्पष्ट, स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: संयुक्त उपाधि אֲדֹנָי יְהוִה में परमेश्वर के निज नाम का अनुवाद
  choice: प्रभु यहोवा
  alternative: प्रभु परमेश्वर
  rationale: मूल में उपस्थित य्ह्व्ह नाम को एक सामान्य उपाधि से बदलने के बजाय प्रचलित हिन्दी बाइबलीय रूप ‘यहोवा’ से सुरक्षित रखा गया है; इससे אֲדֹנָי और יְהוִה का भेद भी बना रहता है।
- issue: ओहोलीबा के अपने पूर्व प्रेमियों से संबंध-विच्छेद का भाव
  choice: जिनसे तेरा मन फिर गया है
  alternative: जिनसे तू घृणा करने लगी थी
  rationale: दुर्लभ क्रिया נקע यहाँ विरक्ति, विकर्षण या अलगाव का बोध करा सकती है। मुख्य पाठ व्यापक अर्थ रखता है और अधिक तीखे विकल्प को पाद-टिप्पणी में देता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में भविष्यवाणी की गंभीरता बनाए रखने के लिए ‘तू/तेरे’ का एकवचन स्त्रीलिंग संबोधन और ‘यों कहता है’ जैसी गरिमापूर्ण बाइबलीय अभिव्यक्ति रखी गई है। वाक्य को सहज बनाने के लिए ‘तेरा मन’ चुना गया, जबकि मूल की अर्थगत अनिश्चितता पाद-टिप्पणी में संरक्षित है।
