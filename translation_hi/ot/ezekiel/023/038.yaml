reference: Ezekiel 23:38
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: ע֥וֹד זֹ֖את עָ֣שׂוּ לִ֑/י טִמְּא֤וּ אֶת מִקְדָּשִׁ/י֙ בַּ/יּ֣וֹם הַ/ה֔וּא וְ/אֶת שַׁבְּתוֹתַ֖/י חִלֵּֽלוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/023/038.yaml
  text: 'Moreover, they did this to me: they defiled my sanctuary on that same day, and they profaned my Sabbaths.'
translation:
  language: hi
  text: 'इसके अलावा, उन्होंने मेरे साथ यह भी किया: उसी दिन उन्होंने मेरे पवित्र स्थान को अशुद्ध किया और मेरे सब्त-दिनों को अपवित्र किया।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עוֹד זֹאת
  choice: इसके अलावा ... यह
  rationale: यह पद एक और आरोप जोड़ता है। यह अभिव्यक्ति इब्रानी के योगात्मक बल को स्वाभाविक आधुनिक हिन्दी में बनाए रखती है।
- source_word: עָשׂוּ לִי
  choice: उन्होंने मेरे साथ यह किया
  rationale: यहाँ לִי परमेश्वर के प्रति किए गए व्यक्तिगत अपराध को व्यक्त करता है। 'मेरे साथ' इस निजी आघात को बनाए रखता है, बिना अर्थ को अनावश्यक रूप से 'मेरे विरुद्ध' तक सीमित किए।
- source_word: טִמְּאוּ
  choice: अशुद्ध किया
  rationale: पिएल रूप किसी पवित्र वस्तु या स्थान को धार्मिक रीति से अशुद्ध कर देने का बोध देता है। 'अशुद्ध किया' इस विधिक-पवित्रता संबंधी अर्थ को स्पष्ट रखता है।
- source_word: מִקְדָּשִׁי
  choice: मेरे पवित्रस्थान
  rationale: '''पवित्रस्थान'' पवित्र क्षेत्र के व्यापक अर्थ को सुरक्षित रखता है और शब्द को केवल मंदिर-भवन तक संकुचित नहीं करता।'
- source_word: בַּיּוֹם הַהוּא
  choice: उसी दिन
  rationale: संदर्भ में संकेत पहले वर्णित घृणित कामों वाले ठीक उसी दिन की ओर है; 'उसी दिन' इस संबंध को संक्षेप और स्वाभाविक ढंग से प्रकट करता है।
- source_word: שַׁבְּתוֹתַי
  choice: मेरे विश्राम-दिनों
  rationale: बहुवचन को बनाए रखा गया है। 'विश्राम-दिन' सामान्य हिन्दी पाठक के लिए अर्थपूर्ण है और परमेश्वर के ठहराए हुए पवित्र समय को दर्शाता है।
- source_word: חִלֵּלוּ
  choice: अपवित्र किया
  rationale: पिएल में यह पवित्र को साधारण या अपवित्र ठहराने का अर्थ देता है। 'अपवित्र किया' पवित्र समय के उल्लंघन की धार्मिक गंभीरता को बनाए रखता है।
theological_decisions:
- issue: पवित्र स्थान और पवित्र समय से जुड़ी धार्मिक शब्दावली
  choice: '''पवित्रस्थान'', ''विश्राम-दिनों'', ''अशुद्ध किया'' और ''अपवित्र किया'' जैसे स्पष्ट पवित्रता-उल्लंघन संबंधी शब्द बनाए रखे गए।'
  alternative: '''मंदिर'' और ''अनादर किया'' जैसे अधिक सामान्य शब्द'
  rationale: पद का बल परमेश्वर के पवित्र स्थान और उनके ठहराए पवित्र समय के वाचा-संबंधी उल्लंघन पर है। सामान्य शब्दावली उस धार्मिक गंभीरता और अशुद्धता/अपवित्रीकरण के भेद को कम कर देती।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य शैली। 'पवित्रस्थान' और 'विश्राम-दिन' बाइबिलीय धार्मिक संदर्भ को स्पष्ट रखते हैं; वाक्य की दो समानांतर क्रियाएँ मूल की आरोपात्मक लय को सुरक्षित रखती हैं।
