  text: “हे मनुष्य के पुत्र, दो स्त्रियाँ थीं, जो एक ही माँ की बेटियाँ थीं।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֶּן אָדָם
  choice: हे मनुष्य के पुत्र
  rationale: यहेजकेल को संबोधित करने वाला यह मानक सम्बोधन है। यह अनुवाद हिब्रू मुहावरे को बनाए रखता है और हिन्दी बाइबल की प्रतिष्ठित शैली में स्वाभाविक है।
- source_word: שְׁתַּיִם נָשִׁים
  choice: दो स्त्रियाँ
  rationale: यहाँ सामान्य अर्थ ‘दो स्त्रियाँ’ है; ‘दो पत्नियाँ’ कहना आगे के रूपक की व्याख्या को समय से पहले पाठ में ले आएगा।
- source_word: בְּנוֹת אֵם אַחַת
  choice: एक ही माँ की बेटियाँ
  rationale: शाब्दिक संरचना ‘एक माँ की बेटियाँ’ है; आधुनिक हिन्दी में ‘एक ही माँ की बेटियाँ’ समान मातृत्व का अर्थ अधिक स्वाभाविक और स्पष्ट रूप से व्यक्त करता है।
- source_word: הָיוּ
  choice: थीं
  rationale: हिब्रू अस्तित्वसूचक क्रिया का सरल और स्वाभाविक हिन्दी रूप है।
