base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/023/004.yaml
  text: 'Their names were Oholah the elder and Oholibah her sister[a]. They became mine and bore sons and daughters. As for their names: Samaria is Oholah[b], and Jerusalem is Oholibah.'
translation:
  language: hi
  text: 'उनके नाम ये थे: बड़ी बहन ओहोला और उसकी बहन ओहोलीबा[a]। वे मेरी हो गईं[b] और उन्होंने बेटे-बेटियों को जन्म दिया। उनके नाम ये हैं: सामरिया ओहोला है और यरूशलेम ओहोलीबा।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ओहोला” और “ओहोलीबा” नाम संभवतः उन हिब्रू पदों की ओर संकेत करते हैं जिनका अर्थ क्रमशः “उसका तंबू” और “मेरा तंबू उसमें है” है। यह शब्द-संकेत इस रूपक को और गहरा करता है।
    reason: cultural_note
  - marker: b
    text: इसका अनुवाद “वे मेरी थीं” भी हो सकता है। हिब्रू में अधिकार या संबंध का भाव है; व्यापक रूपक में यह संबंध वैवाहिक है।
    reason: alternative_reading
lexical_decisions:
- source_word: וּשְׁמוֹתָן
  choice: उनके नाम थे
  rationale: यह दोनों स्त्रियों के नाम प्रस्तुत करता है; हिन्दी में यह सहज और मूल के निकट है।
- source_word: אָהֳלָה
  choice: ओहोला
  rationale: व्यक्तिवाचक नाम को हिब्रू उच्चारण के निकट लिप्यंतरित किया गया है; उसके शब्द-संकेत को पादटिप्पणी में रखा गया है।
- source_word: הַגְּדוֹלָה
  choice: बड़ी बहन
  rationale: दो बहनों के संदर्भ में यह विशेषण आयु या वरिष्ठता बताता है, शारीरिक आकार नहीं।
- source_word: וְאָהֳלִיבָה אֲחוֹתָהּ
  choice: और उसकी बहन ओहोलीबा
  rationale: बहनों का संबंध स्पष्ट रखते हुए हिब्रू क्रम को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וַתִּהְיֶינָה לִי
  choice: वे मेरी हो गईं
  rationale: यह किसी संबंध या अधिकार में आने को व्यक्त करता है और मूल में निहित से अधिक स्पष्ट वैवाहिक शब्दावली नहीं जोड़ता।
- source_word: וַתֵּלַדְנָה בָּנִים וּבָנוֹת
  choice: उन्होंने बेटे-बेटियों को जन्म दिया
  rationale: हिब्रू क्रिया के मातृत्व-संबंधी अर्थ और पुत्र-पुत्रियों के स्पष्ट भेद, दोनों को सुरक्षित रखता है।
- source_word: וּשְׁמוֹתָן
  choice: उनके नामों का अर्थ यह है
  rationale: दूसरा प्रयोग प्रतीकात्मक स्त्रियों की पहचान नगरों से कराता है; यह हिन्दी में उस व्याख्यात्मक मोड़ को स्पष्ट करता है।
- source_word: שֹׁמְרוֹן אָהֳלָה
  choice: सामरिया ओहोला है
  rationale: निहित संबंधसूचक क्रिया को हिन्दी में जोड़कर प्रतीकात्मक पहचान स्पष्ट की गई है।
- source_word: וִירוּשָׁלִַם אָהֳלִיבָה
  choice: यरूशलेम ओहोलीबा
  rationale: पहले समतुल्य वाक्यखंड के अनुरूप नगर और प्रतीकात्मक स्त्री की पहचान रखी गई है; हिन्दी में पूर्ववर्ती ‘है’ दोनों पर लागू होता है।
theological_decisions:
- issue: भविष्यद्वाणी के रूपक में ‘वे मेरी हो गईं’ का अर्थ
  choice: संबंध या अधिकार में आने की बात कही गई है, पर मुख्य पाठ में उसे स्पष्ट रूप से विवाह नहीं कहा गया।
  alternative: वे मेरी पत्नियाँ हो गईं; अथवा, वे मेरी थीं।
  rationale: व्यापक रूपक वैवाहिक है, लेकिन इस पद का हिब्रू केवल ‘वे मेरी हो गईं/मेरी थीं’ कहता है। चयन मूल की व्यापकता और धर्मवैधानिक तनाव को बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण भाषा रखी गई है। ‘बड़ी बहन’ सामान्य पाठक के लिए वरिष्ठता स्पष्ट करता है। नामों को अनूदित करने के बजाय लिप्यंतरित किया गया है, और उनके शब्द-संकेत को पादटिप्पणी में समझाया गया है।
