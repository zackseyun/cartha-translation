- source_word: פַּחוֹת
  choice: राज्यपाल
  rationale: यह साम्राज्य के प्रादेशिक शासकों या उच्च अधिकारियों का पद है; ‘राज्यपाल’ स्पष्ट है और ‘सूबेदार’ की कालगत छाया से बचता है।
- source_word: וּסְגָנִים
  choice: अधिकारी
  rationale: यह अधीनस्थ उच्च शासकीय पदाधिकारियों को दर्शाता है; ‘अधिकारी’ अनिश्चित पदानुक्रम को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: בַּחוּרֵי חֶמֶד
  choice: मनभावने जवान
  rationale: בַּחוּרֵי युवावस्था के पुरुषों और חֶמֶד आकर्षण या अभिलाषणीयता को व्यक्त करता है; यह चयन प्रसंग की आकर्षण-प्रधान छवि बनाए रखता है।
- source_word: כֻּלָּם
  choice: वे सब-के-सब
  rationale: सर्वनामिक प्रत्यय और समग्रता पर दिए गए बल, दोनों को स्पष्ट रूप से व्यक्त करता है।
- source_word: פָּרָשִׁים
  choice: घुड़सवार
  rationale: घोड़े पर सवार योद्धाओं या पुरुषों के लिए सीधा और प्रचलित हिन्दी शब्द है।
- source_word: רֹכְבֵי סוּסִים
  choice: घोड़ों पर सवार
  rationale: मूल की स्पष्ट सहभागी पदावली को बनाए रखता है, भले ही ‘घुड़सवार’ के साथ अर्थ की कुछ पुनरुक्ति हो।
