  text: וַ/תְּגַל֙ תַּזְנוּתֶ֔י/הָ וַ/תְּגַ֖ל אֶת עֶרְוָתָ֑/הּ וַ/תֵּ֤קַע נַפְשִׁ/י֙ מֵֽ/עָלֶ֔י/הָ כַּ/אֲשֶׁ֛ר נָקְעָ֥ה נַפְשִׁ֖/י מֵ/עַ֥ל אֲחוֹתָֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/023/018.yaml
  text: She uncovered her prostitutions and uncovered her nakedness[a]; then my soul was repulsed by her[c][b], just as my soul had been repulsed by her sister.
translation:
  language: hi
  text: उसने अपने वेश्याकर्म प्रकट किए[a] और अपना नंगापन उघाड़ दिया। तब मेरा मन उससे घृणा करके अलग हो गया[b], ठीक वैसे ही जैसे मेरा मन उसकी बहन से अलग हो गया था[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसने अपने वेश्याकर्मों को उजागर किया।”
    reason: lexical_alternative
  - marker: b
    text: या, “मेरा मन उससे पूरी तरह विरक्त हो गया”; इब्रानी शब्द तीव्र घृणा के साथ पीछे हटने या अलग हो जाने का भाव व्यक्त करता है।
    reason: lexical_alternative
  - marker: c
    text: आसपास के रूपक में उसकी बहन से आशय ओहोला, अर्थात सामरिया, है।
    reason: cross_reference
lexical_decisions:
- source_word: וַתְּגַל
  choice: उजागर किया / खोल दिया
  rationale: גלה का अर्थ प्रकट करना या उघाड़ना है। पहले पदांश में स्वाभाविक हिन्दी के लिए ‘उजागर किया’ और समानांतर ‘नंगापन’ के साथ ठोस बिंब बनाए रखने के लिए ‘खोल दिया’ रखा गया है।
- source_word: תַּזְנוּתֶיהָ
  choice: अपने वेश्याकर्मों
  rationale: זְנוּת के बहुवचन भाव को ‘वेश्याकर्मों’ से व्यक्त किया गया है। यह यहेजकेल की जानबूझकर स्पष्ट यौन उपमा को बनाए रखता है और उसे केवल सामान्य ‘विश्वासघात’ में नहीं बदलता।
- source_word: עֶרְוָתָהּ
  choice: अपना नंगापन
  rationale: עֶרְוָה का सीधा अर्थ नंगापन है; प्रसंग में यौन प्रदर्शन निहित है, पर मुख्य पाठ में शरीर के किसी अंग को अनावश्यक रूप से निर्दिष्ट नहीं किया गया।
- source_word: וַתֵּקַע / נָקְעָה
  choice: घृणा करके फिर गया / फिर गया था
  rationale: दुर्लभ क्रिया यहाँ तीव्र विरक्ति, पीछे हटने और संबंध-विच्छेद का भाव देती है। ‘घृणा करके फिर गया’ इस तीव्र प्रतिक्रिया को स्पष्ट करता है, और दूसरी बार भूतपूर्वता के लिए ‘फिर गया था’ रखा गया है।
- source_word: נַפְשִׁי
  choice: मेरा मन
  rationale: נֶפֶשׁ यहाँ वक्ता के भीतरी व्यक्तित्व और भावनात्मक रुझान को दर्शाता है। आधुनिक हिन्दी में ‘मेरा मन’ हिब्रू मुहावरे का स्वाभाविक तथा व्यक्तिगत रूप है; केवल ‘मैं’ कहने से इसकी तीव्रता घटती।
- source_word: מֵעָלֶיהָ
  choice: उससे
  rationale: शाब्दिक रूप से ‘उसके ऊपर से/उससे दूर’ का भाव है। ‘मन उससे फिर गया’ हिन्दी में दूरी और संबंध-विच्छेद दोनों को स्वाभाविक रूप से व्यक्त करता है।
- source_word: כַּאֲשֶׁר
  choice: ठीक वैसे ही जैसे
  rationale: यह पहले उसकी बहन के प्रति हुई समान प्रतिक्रिया के साथ स्पष्ट तुलना स्थापित करता है।
- source_word: אֲחוֹתָהּ
  choice: उसकी बहन
  rationale: दो बहनों के रूपक में यह सीधा पारिवारिक पद है; आसपास के प्रसंग में बहन से आशय ओहोला अर्थात सामरिया है।
theological_decisions:
- issue: वाचा के प्रति विश्वासघात के लिए प्रयुक्त यौन रूपक
  choice: मुख्य पाठ में स्पष्ट ‘वेश्याकर्मों’ और ‘नंगापन’ बनाए रखना
  alternative: इसे नरम करके केवल ‘विश्वासघात’ या ‘लज्जा’ कहना
  rationale: यहेजकेल की वाणी जानबूझकर तीखी और यौन रूप से स्पष्ट है। इसे नरम करने पर मूर्तिपूजा और राजनीतिक बेवफाई के विरुद्ध भविष्यद्वाणी की आलंकारिक शक्ति दब जाती।
- issue: परमेश्वर की मानवीय भावनाओं जैसी तीव्र प्रतिक्रिया
  choice: ‘मेरा मन उससे घृणा करके फिर गया’
  alternative: ‘मैंने उसे छोड़ दिया’ या केवल ‘मैं उससे अलग हो गया’
  rationale: मूल पाठ परमेश्वर की प्रतिक्रिया को अत्यंत व्यक्तिगत और तीव्र विरक्ति के रूप में व्यक्त करता है। चुना हुआ अनुवाद इस धार्मिक तनाव को समझाकर समाप्त करने के बजाय सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। ‘वेश्याकर्मों’ और ‘नंगापन’ मूल की कठोरता को बिना पुरातन या अनावश्यक रूप से शारीरिक शब्दावली अपनाए बनाए रखते हैं। ‘मेरा मन … फिर गया’ सामान्य हिन्दी में संबंध-विच्छेद का स्वाभाविक मुहावरा है, जबकि ‘घृणा करके’ मूल क्रिया की तीव्रता स्पष्ट करता है।
