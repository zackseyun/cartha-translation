id: EZK.23.44
reference: Ezekiel 23:44
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יָּב֣וֹא אֵלֶ֔י/הָ כְּ/ב֖וֹא אֶל אִשָּׁ֣ה זוֹנָ֑ה כֵּ֣ן בָּ֗אוּ אֶֽל אָֽהֳלָה֙ וְ/אֶל אָ֣הֳלִיבָ֔ה אִשֹּׁ֖ת הַ/זִּמָּֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/023/044.yaml
  text: They went in to her as men go in to a prostitute[a]; so they went in to Oholah and to Oholibah[b], women of depravity.
translation:
  language: hi
  text: वह उसके पास गया, जैसे कोई वेश्या के पास जाता है;[a] इसी प्रकार वे ओहोला और ओहोलीबा के पास गए—वे दोनों दुराचारिणी स्त्रियाँ थीं।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी पाठ की पहली क्रिया एकवचन है—‘वह उसके पास गया’—लेकिन आगे क्रिया बहुवचन हो जाती है। भावानुसार इसे ‘वे उसके पास गए’ भी अनूदित किया जा सकता है।
    reason: textual_variant
  - marker: b
    text: शाब्दिक रूप से, ‘दुराचार की स्त्रियाँ’; इसका अनुवाद ‘लंपट स्त्रियाँ’ भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא / בָּאוּ
  choice: वह ... गया / वे ... गए
  rationale: पहली इब्रानी क्रिया एकवचन और बाद की क्रिया बहुवचन है। हिन्दी में इस संख्या-परिवर्तन को बनाए रखा गया है। इस यौन प्रसंग में בוא אֶל का स्वाभाविक अर्थ ‘के पास जाना’ है।
- source_word: אֵלֶיהָ / אֶל
  choice: उसके पास / के पास
  rationale: אֶל का मूल अर्थ ‘की ओर/के पास’ है। यहाँ ‘के पास जाना’ हिन्दी में यौन संबंध का संकेत प्रसंगानुसार देता है, बिना अनावश्यक रूप से स्पष्ट व्याख्या जोड़े।
- source_word: כְּבוֹא אֶל אִשָּׁה זוֹנָה
  choice: जैसे कोई वेश्या के पास जाता है
  rationale: तुलनार्थक כ और infinitive construct की रीति-सूचक तुलना को सहज हिन्दी में व्यक्त करने के लिए ‘जैसे कोई ... जाता है’ चुना गया है।
- source_word: אִשָּׁה זוֹנָה
  choice: वेश्या
  rationale: זוֹנָה के लिए ‘वेश्या’ आधुनिक, स्पष्ट और गरिमापूर्ण हिन्दी शब्द है; अधिक अपमानजनक या पुराने विकल्पों से बचा गया है।
- source_word: כֵּן
  choice: इसी प्रकार
  rationale: यह तुलना के निष्कर्ष और समानता को स्पष्ट तथा स्वाभाविक हिन्दी में दिखाता है।
- source_word: אָהֳלָה ... אָהֳלִיבָה
  choice: ओहोला ... ओहोलीबा
  rationale: इन व्यक्तिनामों को अर्थानुवाद करने के बजाय हिन्दी लिपि में लिप्यंतरित किया गया है।
- source_word: אִשֹּׁת הַזִּמָּה
  choice: दुराचारिणी स्त्रियाँ
  rationale: זִמָּה यहाँ घोर, विशेषतः यौन, अनैतिकता का बोध कराता है। ‘दुराचारिणी स्त्रियाँ’ नैतिक गंभीरता और प्रसंगगत यौन आशय दोनों को स्वाभाविक हिन्दी में रखता है।
theological_decisions:
- issue: आरंभिक एकवचन से बाद के बहुवचन में परिवर्तन
  choice: मुख्य पाठ में ‘वह ... गया’ और फिर ‘वे ... गए’ रखकर इब्रानी संख्या-परिवर्तन को सुरक्षित रखा गया है।
  alternative: 'पूरे वाक्य को बहुवचन में करना: ‘वे उसके पास गए ... इसी प्रकार वे ... गए।’'
  rationale: मसोरेटिक पाठ की पहली क्रिया स्पष्ट रूप से एकवचन है, जबकि अगली क्रिया बहुवचन है। संदर्भ में सामूहिक प्रेमी अभिप्रेत हो सकते हैं, फिर भी पाठ का वास्तविक व्याकरणिक तनाव चुपचाप समतल नहीं किया गया।
- issue: אִשֹּׁת הַזִּמָּה का नैतिक और यौन आशय
  choice: दुराचारिणी स्त्रियाँ
  alternative: लंपट स्त्रियाँ / कुकर्म की स्त्रियाँ
  rationale: चुना हुआ रूप व्यापक नैतिक भ्रष्टता को बनाए रखता है और अध्याय के यौन संदर्भ में स्वाभाविक रूप से समझा जाता है, जबकि ‘लंपट’ अर्थ को कुछ अधिक संकरा कर सकता है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की है। वाक्य की गरिमा बनाए रखते हुए यौन आशय को संकेतपूर्ण और स्रोत-संगत रखा गया है। इब्रानी के असामान्य एकवचन-से-बहुवचन परिवर्तन को मुख्य पाठ और टिप्पणी दोनों में सुरक्षित रखा गया है।
