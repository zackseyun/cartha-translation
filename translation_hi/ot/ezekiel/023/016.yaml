lexical_decisions:
- source_word: וַתַּעְגַּב עֲלֵיהֶם
  choice: वह उनके लिए काम-लालसा से भर गई
  rationale: עגב यहाँ प्रबल कामुक इच्छा व्यक्त करता है; यहेजकेल 23 की जानबूझकर तीखी यौन उपमा को बनाए रखने के लिए केवल ‘मोहित हुई’ या ‘चाहने लगी’ कहना बहुत हल्का होता। עַל इच्छा के लक्ष्य को सूचित करता है।
- source_word: לְמַרְאֵה עֵינֶיהָ
  choice: उन्हें देखते ही
  rationale: शाब्दिक वाक्यांश ‘उसकी आँखों के देखने/दृश्य पर’ है। आधुनिक हिन्दी में ‘उन्हें देखते ही’ स्वाभाविक रूप से दृष्टि और तत्काल उत्पन्न इच्छा के संबंध को व्यक्त करता है; शाब्दिक बनावट की अस्पष्टता पादटिप्पणी में रखी गई है।
- source_word: וַתִּשְׁלַח מַלְאָכִים
  choice: उसने ... दूत भेजे
  rationale: מַלְאָכִים का मूल अर्थ ‘दूत/संदेशवाहक’ है। राजनीतिक संदर्भ में वे राजनयिक प्रतिनिधि हो सकते हैं, पर मुख्य पाठ में पद को अनावश्यक रूप से अधिक विशिष्ट नहीं किया गया।
- source_word: אֲלֵיהֶם
  choice: उनके पास
  rationale: אֶל दूतों की दिशा और प्राप्तकर्ताओं को दर्शाता है; हिन्दी में ‘उनके पास ... भेजे’ इसका स्वाभाविक समतुल्य है।
- source_word: כַּשְׂדִּימָה
  choice: कसदिया में
  rationale: शब्द में दिशासूचक -ה लगा है, इसलिए मूल रूप गमन की दिशा बताता है। ‘कसदिया में उनके पास’ हिन्दी में प्राप्तकर्ताओं के स्थान को सहजता से व्यक्त करता है; ‘कसदिया की ओर/कसदिया को’ का अधिक रूपगत अनुवाद पादटिप्पणी में दिया गया है।
theological_decisions:
- issue: राजनीतिक-धार्मिक विश्वासघात के लिए प्रयुक्त कामुक उपमा
  choice: स्पष्ट कामुक भाषा को ‘काम-लालसा से भर गई’ के रूप में बनाए रखा गया।
  alternative: वह उन पर मोहित हो गई / वह उन्हें चाहने लगी
  rationale: अध्याय की भविष्यद्वाणी जानबूझकर चौंकाने वाली यौन भाषा से विश्वासघात दिखाती है। इसे नरम करने से मूल वक्तृता और उसका धर्मवैचारिक भार घट जाता।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘काम-लालसा’ भविष्यद्वक्ता की तीखी कामुक उपमा को स्पष्ट रखता है, जबकि ‘दूत’ उनके राजनयिक पद को अनावश्यक रूप से निश्चित नहीं करता।
