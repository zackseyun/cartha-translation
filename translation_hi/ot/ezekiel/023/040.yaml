base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/023/040.yaml
  text: And moreover[a], they sent for men coming from far away, to whom a messenger had been sent; and behold, they came—to the one who had washed herself, painted her eyes, and adorned herself with jewelry.
translation:
  language: hi
  text: और इससे भी बढ़कर, उन्होंने[a] दूर देश से आते हुए पुरुषों को बुलावा भेजा। उनके पास एक दूत भेजा गया था, और देखो, वे आ गए। उनके लिए तूने स्नान किया, अपनी आँखों में सुरमा लगाया[b] और गहने पहने।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी क्रिया-रूप का अनुवाद ‘तुम दोनों ने’ भी हो सकता है।
    reason: व्याकरणिक अस्पष्टता
  - marker: b
    text: अर्थात गहरे रंग के नेत्र-प्रसाधन से आँखों को सजाया।
    reason: शब्दार्थ स्पष्टीकरण
lexical_decisions:
- source_word: וְאַף כִּי
  choice: और इससे भी बढ़कर
  rationale: यह पदबंध पिछले आरोप में एक और, अधिक गंभीर बात जोड़ता है। यह हिन्दी में उसके योगात्मक और बलात्मक भाव को स्वाभाविक रूप से व्यक्त करता है।
- source_word: תִשְׁלַחְנָה לַאֲנָשִׁים
  choice: तुम दोनों ने ... पुरुषों को बुलावा भेजा
  rationale: क्रिया-रूप स्त्रीलिंग बहुवचन है और रूपात्मक रूप से दूसरे तथा तीसरे पुरुष—दोनों हो सकता है। प्रसंग में दो स्त्रीरूप नगरों को प्रत्यक्ष संबोधन होने के कारण मुख्य पाठ में ‘तुम दोनों ने’ चुना गया; ‘बुलावा भेजा’ यहाँ आमंत्रित करने का अर्थ स्पष्ट करता है।
- source_word: בָּאִים מִמֶּרְחָק
  choice: दूर देश से आते हुए
  rationale: यह सहभागी रूप ‘आते हुए’ और दूरी के स्थानिक भाव—दोनों को बनाए रखता है।
- source_word: אֲשֶׁר מַלְאָךְ שָׁלוּחַ אֲלֵיהֶם
  choice: उनके पास एक दूत भेजा गया था
  rationale: מַלְאָךְ यहाँ मानवीय संदेशवाहक है, इसलिए ‘दूत’ उपयुक्त है। कर्मवाच्य सहभागी को पूर्वकालिक तैयारी के रूप में व्यक्त किया गया है।
- source_word: וְהִנֵּה בָאוּ
  choice: और देखो, वे आ गए
  rationale: ‘देखो’ भविष्यद्वाणी के कथन में וְהִנֵּה की जीवंत, ध्यान खींचने वाली शक्ति बनाए रखता है।
- source_word: לַאֲשֶׁר רָחַצְתְּ
  choice: उनके लिए तूने स्नान किया
  rationale: לַאֲשֶׁר को उद्देश्य/लाभार्थक अर्थ में पुरुषों से जोड़ा गया है। स्त्रीलिंग एकवचन क्रिया के कारण सम्बोधन ‘तूने’ है; इससे बहुवचन से एकवचन की मूल बदलाव-रचना बनी रहती है।
- source_word: כָּחַלְתְּ עֵינַיִךְ
  choice: अपनी आँखों में सुरमा लगाया
  rationale: क्रिया विशेष रूप से गहरे रंग का नेत्र-प्रसाधन लगाने को दर्शाती है। ‘सुरमा लगाया’ आधुनिक हिन्दी में सटीक और सहज है।
- source_word: וְעָדִית עֶדִי
  choice: गहने पहने
  rationale: क्रिया और संज्ञा का यह मेल आभूषणों से सजने का मुहावरेदार अर्थ देता है; ‘गहने पहने’ स्वाभाविक आधुनिक हिन्दी है।
theological_decisions:
- issue: आरम्भिक स्त्रीलिंग बहुवचन क्रिया का पुरुष और बाद में स्त्रीलिंग एकवचन सम्बोधन
  choice: मुख्य पाठ में आरम्भ को प्रत्यक्ष बहुवचन सम्बोधन ‘तुम दोनों ने’ और श्रृंगार के कार्यों को एकवचन ‘तूने’ के रूप में रखा गया।
  alternative: आरम्भिक रूप को ‘उन्होंने’ भी समझा जा सकता है; पूरे पद को केवल एकवचन या केवल बहुवचन बनाकर समतल किया जा सकता है।
  rationale: תִשְׁלַחְנָה रूपात्मक रूप से दूसरे और तीसरे पुरुष स्त्रीलिंग बहुवचन दोनों हो सकता है। निकट प्रसंग में दो बहनों/नगरों को सम्बोधन मुख्य विकल्प का समर्थन करता है, पर वास्तविक अस्पष्टता पादटिप्पणी में सुरक्षित है। बाद की एकवचन स्त्रीलिंग क्रियाओं को ज्यों का त्यों रखने से भविष्यद्वाणी की सामूहिक और व्यक्तिगत सम्बोधन के बीच की तनावपूर्ण अदला-बदली बनी रहती है।
- issue: לַאֲשֶׁר का सम्बन्ध
  choice: इसे आए हुए पुरुषों से जोड़कर ‘उनके लिए तूने स्नान किया’ अनूदित किया गया।
  alternative: इसे ‘उसके पास जो स्नान कर चुकी थी’ जैसे गन्तव्य-वाचक वाक्यांश के रूप में पढ़ना।
  rationale: दूसरे पुरुष स्त्रीलिंग एकवचन क्रियाएँ רָחַצְתְּ, כָּחַלְתְּ और וְעָדִית प्रत्यक्ष सम्बोधन हैं। इसलिए लाभार्थक अर्थ वाक्य-विन्यास और प्रसंग—आगन्तुकों के लिए तैयारी—दोनों के अधिक निकट है।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। ‘तुम दोनों’ और ‘तूने’ का क्रम जानबूझकर रखा गया है ताकि मूल इब्रानी में दो स्त्रीरूप नगरों के सामूहिक सम्बोधन से एक स्त्री के व्यक्तिगत सम्बोधन की ओर बदलाव न मिटे।
