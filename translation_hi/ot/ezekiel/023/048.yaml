id: EZK.23.48
reference: Ezekiel 23:48
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/הִשְׁבַּתִּ֥י זִמָּ֖ה מִן הָ/אָ֑רֶץ וְ/נִֽוַּסְּרוּ֙ כָּל הַ/נָּשִׁ֔ים וְ/לֹ֥א תַעֲשֶׂ֖ינָה כְּ/זִמַּתְ/כֶֽנָה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/023/048.yaml
  text: Thus I will put an end to lewdness in the land[a], and all women will be warned and will not act according to your lewdness.
translation:
  language: hi
  text: इस प्रकार मैं देश से लज्जाजनक दुराचार का अंत कर दूँगा। तब सभी स्त्रियों को चेतावनी मिलेगी[a], और वे तुम्हारे लज्जाजनक दुराचार जैसा आचरण नहीं करेंगी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “अनुशासित की जाएँगी” अथवा “ताड़ना पाएँगी।” इब्रानी क्रिया दंड के द्वारा सुधार के साथ-साथ किसी उदाहरण से मिलने वाली चेतावनी भी व्यक्त कर सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִשְׁבַּתִּי
  choice: मैं ... का अंत कर दूँगा
  rationale: שׁבת के हिफ़ील रूप का अर्थ किसी वस्तु को समाप्त कर देना या रुकवा देना है। यह प्रयोग कारक भाव को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: זִמָּה
  choice: लज्जाजनक दुराचार
  rationale: यहेजकेल 23 में यह शब्द यौन और नैतिक दुराचार की निंदात्मक छाया लिए हुए है। ‘लज्जाजनक दुराचार’ उस व्यापक नैतिक अर्थ और प्रसंगगत यौन संकेत—दोनों को बनाए रखता है; केवल ‘अश्लीलता’ आधुनिक हिन्दी में वाणी या सामग्री तक सीमित समझी जा सकती है।
- source_word: מִן הָאָרֶץ
  choice: देश से
  rationale: 'מִן के मूल अपादान भाव को सीधे रखा गया है: दुराचार को देश में केवल रोकना नहीं, देश से समाप्त करना अभिप्रेत है।'
- source_word: וְנִוַּסְּרוּ
  choice: चेतावनी मिलेगी
  rationale: יסר का पुअल रूप अनुशासन, ताड़ना या सुधार के द्वारा सीखने का भाव दे सकता है। अगले उपवाक्य में दूसरों के वैसा आचरण न करने का परिणाम है, इसलिए ‘चेतावनी मिलेगी’ उदाहरणात्मक दंड के निवारक प्रभाव को स्वाभाविक हिन्दी में व्यक्त करता है; वैकल्पिक दंडात्मक अर्थ पादटिप्पणी में सुरक्षित है।
- source_word: כָּל הַנָּשִׁים
  choice: सभी स्त्रियों
  rationale: इब्रानी पद स्पष्ट रूप से स्त्रीलिंग बहुवचन है। प्रतीकात्मक संदर्भ के बावजूद इसे न तो ‘सभी लोग’ बनाया गया है, न केवल दोनों प्रतीकात्मक बहनों तक सीमित किया गया है।
- source_word: וְלֹא תַעֲשֶׂינָה
  choice: और वे ... आचरण नहीं करेंगी
  rationale: עשה का सामान्य अर्थ ‘करना’ है, पर नैतिक व्यवहार के इस संदर्भ में ‘आचरण करना’ अधिक स्वाभाविक और स्पष्ट है।
- source_word: כְּזִמַּתְכֶנָה
  choice: तुम्हारे लज्जाजनक दुराचार जैसा
  rationale: उपसर्ग כְּ तुलना दर्शाता है। ‘जैसा’ उसी प्रकार का आचरण न करने का भाव स्पष्ट करता है और זִמָּה की पुनरावृत्ति को भी बनाए रखता है।
theological_decisions:
- issue: न्याय-वाणी में स्त्री-रूपक के बीच ‘सभी स्त्रियों’ का संदर्भ और कार्य
  choice: मूल के अनुसार ‘सभी स्त्रियों’ रखा गया है और उन्हें न्याय के उदाहरण से चेतावनी मिलने का भाव व्यक्त किया गया है।
  alternative: ‘देश की सभी स्त्रियाँ’ अथवा ‘स्त्रियों द्वारा दर्शाए गए सभी लोग’
  rationale: इब्रानी पाठ केवल ‘सभी स्त्रियाँ’ कहता है। अध्याय सामरिया और यरूशलेम के लिए स्त्री-रूपक का उपयोग करता है और साथ ही उनके न्याय को दूसरों के लिए उदाहरण बनाता है। अनुवाद इस तनाव को किसी व्यापक या संकीर्ण व्याख्या से नहीं सुलझाता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘तब’ दूसरे खंड को पहले न्याय के परिणाम के रूप में जोड़ता है। संबोधन का स्त्रीलिंग बहुवचन भाव आगे ‘नहीं करेंगी’ में सुरक्षित है।
