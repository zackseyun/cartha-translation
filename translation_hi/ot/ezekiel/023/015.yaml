base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/023/015.yaml
  text: with belts fastened at their waists[a], with flowing turbans on their heads, all of them having the appearance of officers, the likeness of the sons of Babylon, Chaldeans[b], the land of their birth.
translation:
  language: hi
  text: अपनी कमर पर कमरबंद बाँधे और सिर पर लहराती पगड़ियाँ पहने हुए, वे सब सेनाधिकारियों[a] जैसे दिखाई देते थे—बाबेल के पुत्रों[b], अर्थात् कसदियों, जैसे। कसदिया उनकी जन्मभूमि थी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी शब्द किसी विशिष्ट उच्च सैनिक पद या अधिकारी को सूचित कर सकता है; इसे ‘कप्तान’ भी समझा गया है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से ‘बाबेल के पुत्रों’; यह बाबेलवासियों के लिए इब्रानी अभिव्यक्ति है।
    reason: lexical_alternative
lexical_decisions:
- source_word: חֲגוֹרֵי אֵזוֹר בְּמָתְנֵיהֶם
  choice: अपनी कमर में कमरबंद बाँधे
  rationale: यह ठोस परिधान-चित्र को बनाए रखता है और आधुनिक हिन्दी में स्वाभाविक है; מָתְנַיִם के लिए पुरातन ‘कटि’ या ‘कूल्हे’ के बजाय ‘कमर’ स्पष्ट है।
- source_word: סְרוּחֵי טְבוּלִים בְּרָאשֵׁיהֶם
  choice: सिरों पर लहराती पगड़ियाँ पहने हुए
  rationale: סְרוּחֵי में नीचे लटकने या फैले होने का भाव है और दुर्लभ טְבוּלִים यहाँ सिर के आवरण को सूचित करता है; ‘लहराती पगड़ियाँ’ दृश्य को सहज हिन्दी में व्यक्त करता है।
- source_word: מַרְאֵה שָׁלִשִׁים כֻּלָּם
  choice: वे सब सेनाधिकारियों जैसे दिखाई देते थे
  rationale: שָׁלִשִׁים एक विवादित प्राचीन सैनिक पद है; ‘सेनाधिकारी’ पद और प्रतिष्ठा का भाव देता है, पर किसी अत्यधिक विशिष्ट आधुनिक रैंक को आरोपित नहीं करता। כֻּלָּם का बल ‘वे सब’ से सुरक्षित है।
- source_word: דְּמוּת בְּנֵי בָבֶל
  choice: वे बाबेलवासियों के समान थे
  rationale: דְּמוּת का समानता/सदृशता का भाव रखा गया है। ‘बाबेलवासी’ हिन्दी में स्वाभाविक है, जबकि मूल का शाब्दिक पुत्रवाची मुहावरा पादटिप्पणी में सुरक्षित किया गया है।
- source_word: כַּשְׂדִּים אֶרֶץ מוֹלַדְתָּם
  choice: जिनकी जन्मभूमि कसदिया थी
  rationale: संदर्भ में כַּשְׂדִּים को भौगोलिक ‘कसदिया/कल्दिया’ समझना अगले पदबंध ‘उनकी जन्मभूमि का देश’ के साथ स्वाभाविक है और बाबेलवासियों की उत्पत्ति बताता है।
