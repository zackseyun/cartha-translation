id: EZK.23.37
reference: Ezekiel 23:37
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: כִּ֣י נִאֵ֗פוּ וְ/דָם֙ בִּֽ/ידֵי/הֶ֔ן וְ/אֶת גִּלּֽוּלֵי/הֶ֖ן נִאֵ֑פוּ וְ/גַ֤ם אֶת בְּנֵי/הֶן֙ אֲשֶׁ֣ר יָֽלְדוּ לִ֔/י הֶעֱבִ֥ירוּ לָ/הֶ֖ם לְ/אָכְלָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/023/037.yaml
  text: For they have committed adultery[a], and blood is on their hands; they have committed adultery with their idols, and they even made their sons, whom they bore to me[b], pass through the fire to them as food.
translation:
  language: hi
  text: क्योंकि उन्होंने व्यभिचार किया है और उनके हाथों पर खून लगा है। उन्होंने अपनी घिनौनी मूर्तियों के साथ व्यभिचार किया है। यहाँ तक कि जिन बेटों को उन्होंने मेरे लिए जन्म दिया था, उन्हें भी उन मूर्तियों का भोजन बनाने के लिए आग में से पार कराया[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से ‘पार कराया’। इस संदर्भ में यह बाल-बलि का मुहावरा है, जिसे परंपरागत रूप से आग में से पार कराना समझा जाता है।
    reason: cultural_note
lexical_decisions:
- source_word: נִאֵפוּ
  choice: उन्होंने व्यभिचार किया है
  rationale: मूल क्रिया का सीधा अर्थ ‘व्यभिचार करना’ है। इसे बनाए रखने से वैवाहिक और वाचा-विरोधी मूर्तिपूजा—दोनों से जुड़ा नबी का रूपक सुरक्षित रहता है।
- source_word: דָם בִּידֵיהֶן
  choice: उनके हाथों पर खून लगा है
  rationale: यह स्वाभाविक हिन्दी मुहावरा हत्या के दोष और रक्तपात की नैतिक जिम्मेदारी व्यक्त करता है।
- source_word: גִּלּוּלֵיהֶן
  choice: अपनी घिनौनी मूर्तियों
  rationale: גִּלּוּלִים केवल ‘मूर्तियाँ’ नहीं, बल्कि यहेजकेल का तिरस्कारसूचक शब्द है; ‘घिनौनी’ उस भाव को सहज हिन्दी में बनाए रखता है।
- source_word: וְאֶת גִּלּוּלֵיהֶן נִאֵפוּ
  choice: उन्होंने अपनी घिनौनी मूर्तियों के साथ व्यभिचार किया है
  rationale: ‘के साथ’ मूर्तियों को व्यभिचार-रूपक का संबंधपरक लक्ष्य दिखाता है और मूल में क्रिया की पुनरावृत्ति को सुरक्षित रखता है।
- source_word: בְּנֵיהֶן אֲשֶׁר יָלְדוּ לִי
  choice: जिन बेटों को उन्होंने मेरे लिए जन्म दिया था
  rationale: בָּנִים का विशिष्ट अर्थ ‘बेटे’ है और לִי को ‘मेरे लिए’ रखने से बच्चों पर परमेश्वर के दावे का भाव बिना अतिरिक्त व्याख्या के बना रहता है।
- source_word: הֶעֱבִירוּ
  choice: आग में से पार कराया
  rationale: शाब्दिक क्रिया ‘पार कराना’ है; इस मूर्तिपूजक बलि-संदर्भ में ‘आग’ स्थापित धार्मिक मुहावरे का निहित तत्व है और पाठक को बाल-बलि का आशय समझने में सहायता देता है।
- source_word: לָהֶם לְאָכְלָה
  choice: उन मूर्तियों का भोजन बनाने के लिए
  rationale: לָהֶם का निकटतम पूर्वपद मूर्तियाँ हैं और לְאָכְלָה भोजन के लिए दिए जाने की भयावह बलि-छवि व्यक्त करता है। संज्ञा को दोहराने से हिन्दी में सर्वनाम अस्पष्ट नहीं रहता।
theological_decisions:
- issue: क्या ‘पार कराया’ में आग और बाल-बलि का आशय स्पष्ट किया जाए
  choice: उन्हें भी उन मूर्तियों का भोजन बनाने के लिए आग में से पार कराया
  alternative: उन्हें भी उनके भोजन के लिए पार कराया
  rationale: मूल पाठ में ‘आग’ शब्द प्रत्यक्ष नहीं है, पर ‘पार कराना’ इस रक्तपात और मूर्तिपूजा के संदर्भ में बाल-बलि का स्थापित धार्मिक मुहावरा है। मुख्य पाठ में ‘आग’ जोड़ना अर्थ स्पष्ट करता है, जबकि पादटिप्पणी शाब्दिक रूप की जानकारी देती है।
- issue: ‘मेरे लिए जन्म दिया’ में परमेश्वर के दावे को कैसे रखा जाए
  choice: मेरे लिए जन्म दिया था
  alternative: मुझे जन्म दिए थे
  rationale: לִי का संबंध जानबूझकर खुला रखा गया है; ‘मेरे लिए’ परमेश्वर के वाचागत/स्वामित्व-संबंधी दावे को व्यक्त करता है, पर उसकी व्याख्या को किसी एक व्यवस्थित धर्मवैज्ञानिक सूत्र में सीमित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। ‘व्यभिचार’ की दोहरी पुनरावृत्ति, रक्तदोष का मुहावरा और बलि की कठोर भोजन-छवि मूल के नबी-संबंधी आघात को बनाए रखते हैं।
