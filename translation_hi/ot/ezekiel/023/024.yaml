  text: וּ/בָ֣אוּ עָלַ֡יִ/ךְ הֹ֠צֶן רֶ֤כֶב וְ/גַלְגַּל֙ וּ/בִ/קְהַ֣ל עַמִּ֔ים צִנָּ֤ה וּ/מָגֵן֙ וְ/קוֹבַ֔ע יָשִׂ֥ימוּ עָלַ֖יִ/ךְ סָבִ֑יב וְ/נָתַתִּ֤י לִ/פְנֵי/הֶם֙ מִשְׁפָּ֔ט וּ/שְׁפָט֖וּ/ךְ בְּ/מִשְׁפְּטֵי/הֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/023/024.yaml
  text: They will come against you with troops, chariots, and wagons, and with an assembly of peoples. They will set shield and buckler and helmet against you on every side, and I will set judgment before them, and they will judge you by their judgments.
translation:
  language: hi
  text: वे सैन्य दलों[a], रथों और पहिएदार गाड़ियों के साथ, और जातियों की एक सभा के साथ तुझ पर आएँगे। वे तेरे चारों ओर बड़ी ढालों, छोटी ढालों और टोपों से सज्जित होंगे। मैं उनके सामने न्याय रखूँगा, और वे अपने न्याय-विधानों के अनुसार तेरा न्याय करेंगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '‘सैन्य दलों’: इब्रानी शब्द का अर्थ अनिश्चित है; इसे ‘हथियार’ या ‘शस्त्र-सामग्री’ भी समझा गया है।'
    reason: दुर्लभ इब्रानी הֹצֶן की पाठगत/शब्दार्थगत अनिश्चितता को बिना किसी एक विकल्प को निर्णायक बनाए दर्शाना।
lexical_decisions:
- source_word: הֹצֶן
  choice: सेना
  rationale: यह दुर्लभ शब्द है और संदर्भ में आक्रमणकारी सैन्य दल का संकेत देता है; अंग्रेज़ी परामर्श-पाठ का ‘troops’ भी इसी अर्थ का समर्थन करता है।
- source_word: רֶכֶב וְגַלְגַּל
  choice: रथों और पहिएदार गाड़ियों
  rationale: רֶכֶב को ‘रथ’ और גַלְגַּל को उसके मूल ‘पहिया’ से जुड़े युद्ध-वाहन के अर्थ में रखा गया है, ताकि दोनों पद अलग बने रहें।
- source_word: בִּקְהַל עַמִּים
  choice: बहुत-से लोगों की भीड़
  rationale: शाब्दिक अर्थ ‘लोगों/जातियों की सभा’ है; यहाँ अनेक जनसमूहों की विशाल आक्रमणकारी भीड़ अभिप्रेत है।
- source_word: צִנָּה וּמָגֵן
  choice: बड़ी ढाल, छोटी ढाल
  rationale: 'दो भिन्न प्रकार की ढालों का अंतर स्पष्ट किया गया है: צִנָּה सामान्यतः बड़ी ढाल और מָגֵן अपेक्षाकृत छोटी ढाल है।'
- source_word: וְנָתַתִּי לִפְנֵיהֶם מִשְׁפָּט
  choice: मैं न्याय का अधिकार उनके हाथ में दूँगा
  rationale: इब्रानी मुहावरे ‘उनके सामने न्याय रखूँगा’ का स्वाभाविक हिन्दी रूप, जिसमें परमेश्वर द्वारा न्याय करने का कार्य आक्रमणकारियों को सौंपना व्यक्त होता है।
- source_word: בְּמִשְׁפְּטֵיהֶם
  choice: अपने न्याय-विधानों के अनुसार
  rationale: बहुवचन को बनाए रखते हुए उनके अपने न्यायिक मानकों और दंड-विधियों का भाव व्यक्त किया गया है।
theological_decisions:
- issue: दैवी न्याय और विदेशी आक्रमणकारियों की भूमिका
  choice: परमेश्वर न्याय का अधिकार उनके हाथ में देता है, और वे अपने न्याय-विधानों के अनुसार न्याय करते हैं।
  alternative: परमेश्वर स्वयं उनके माध्यम से केवल अपना न्याय लागू करता है।
  rationale: मूल पाठ में दैवी अधिकार और मानवीय/विदेशी न्याय-विधानों के बीच तनाव बना हुआ है; उसे किसी एक व्यवस्थित धर्मवैज्ञानिक निष्कर्ष में नहीं बदला गया।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट हिन्दी। स्त्रीलिंग एकवचन संबोधन के कारण ‘तुझ/तेरे/तेरा’ रखा गया है, जो इस अध्याय की रूपक स्त्री को संबोधित करता है।
