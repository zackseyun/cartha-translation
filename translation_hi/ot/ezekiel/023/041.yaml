source:
  edition: WLC
  text: וְ/יָשַׁבְתְּ֙ עַל מִטָּ֣ה כְבוּדָּ֔ה וְ/שֻׁלְחָ֥ן עָר֖וּךְ לְ/פָנֶ֑י/הָ וּ/קְטָרְתִּ֥/י וְ/שַׁמְנִ֖/י שַׂ֥מְתְּ עָלֶֽי/הָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/023/041.yaml
  text: You sat on a splendid couch[a], with a table set before it, and on it you placed my incense and my oil.
translation:
  language: hi
  text: तुम एक भव्य दीवान पर बैठी थीं, और उसके सामने एक मेज़ सजी हुई थी; उस पर तुमने मेरी धूप और मेरा तेल रखा था।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘उसके सामने’ और ‘उस पर’ के इब्रानी प्रत्यय स्त्रीलिंग हैं, पर उनका संदर्भ पूरी तरह निश्चित नहीं है। वे दीवान/शय्या या उस स्त्री की ओर संकेत कर सकते हैं; प्रसंग के आधार पर अंतिम वाक्यांश को मेज़ पर वस्तुएँ रखने के अर्थ में भी समझा जाता है।
    reason: alternative_reading
lexical_decisions:
- source_word: יָשַׁבְתְּ
  choice: तुम ... बैठी थीं
  rationale: यह ישׁב का काल रूप, द्वितीय पुरुष स्त्रीलिंग एकवचन है। स्त्रीलिंग क्रिया संबोधित स्त्री-रूपक को स्पष्ट रखते हुए भूतकालीन दृश्य को स्वाभाविक हिन्दी में व्यक्त करती है।
- source_word: מִטָּה כְבוּדָּה
  choice: एक भव्य दीवान
  rationale: מִטָּה पलंग, शय्या या लेटने-बैठने के दीवान को सूचित कर सकता है; विलासपूर्ण आतिथ्य के इस दृश्य में ‘दीवान’ उपयुक्त है। כְבוּדָּה यहाँ सम्मानित/शानदार वस्तु के अर्थ में है, जिसे ‘भव्य’ सहज रूप से व्यक्त करता है।
- source_word: שֻׁלְחָן עָרוּךְ
  choice: एक मेज़ सजी हुई थी
  rationale: עָרוּךְ का अर्थ व्यवस्थित या तैयार किया हुआ है। भोजन अथवा सत्कार के प्रसंग में ‘मेज़ सजी हुई’ स्वाभाविक हिन्दी है।
- source_word: לְפָנֶיהָ
  choice: उसके सामने
  rationale: स्त्रीलिंग प्रत्यय का संकेत दीवान अथवा संबोधित स्त्री की ओर हो सकता है। हिन्दी का ‘उसके सामने’ मूल की इस संदर्भगत अनिश्चितता को स्वाभाविक ढंग से बनाए रखता है।
- source_word: קְטָרְתִּי
  choice: मेरी धूप
  rationale: प्रथम पुरुष एकवचन प्रत्यय परमेश्वर के अधिकार या उसके लिए नियत धूप को व्यक्त करता है। ‘मेरी धूप’ मूल की संक्षिप्तता और धार्मिक दुरुपयोग के संकेत को बनाए रखता है।
- source_word: שַׁמְנִי
  choice: मेरा तेल
  rationale: שֶׁמֶן का सामान्य अर्थ तेल है। मूल पद इसे विशेष रूप से अभिषेक का तेल नहीं कहता, इसलिए व्यापक और सीधा अनुवाद रखा गया है।
- source_word: שַׂמְתְּ עָלֶיהָ
  choice: उस पर तुमने ... रखा था
  rationale: שׂים का स्त्रीलिंग एकवचन संबोधन के साथ अर्थ ‘रखना’ है। עָלֶיהָ का स्त्रीलिंग संदर्भ अस्पष्ट है; ‘उस पर’ हिन्दी में वस्तु का अनावश्यक लिंग-निर्धारण किए बिना ठोस क्रिया को व्यक्त करता है।
theological_decisions:
- issue: לְפָנֶיהָ और עָלֶיהָ के स्त्रीलिंग प्रत्ययों का संदर्भ
  choice: मुख्य पाठ में लिंग-निरपेक्ष हिन्दी सर्वनाम ‘उसके/उस पर’ रखकर दृश्य को स्वाभाविक तथा मूल की संदर्भगत अस्पष्टता को खुला रखा गया है।
  alternative: पहले प्रत्यय को स्त्री (‘तुम्हारे सामने’) और अंतिम को दीवान/शय्या से जोड़ा जा सकता है; प्रसंग के आधार पर अंतिम वाक्यांश को मेज़ पर वस्तुएँ रखने के रूप में भी समझा जाता है।
  rationale: मूल में दीवान/शय्या और संबोधित स्त्री दोनों स्त्रीलिंग संभावित संदर्भ हैं, जबकि मेज़ का संज्ञा-रूप पुल्लिंग है। अतः किसी एक संदर्भ को निश्चित कर देना मूल से अधिक व्याख्यात्मक होगा। पादटिप्पणी इस वास्तविक व्याकरणिक और दृश्यगत तनाव को स्पष्ट करती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण और दृश्यात्मक शैली रखी गई है। ‘तुम ... बैठी थीं’ स्त्रीलिंग एकवचन संबोधन को स्पष्ट करता है। ‘दीवान’ विलासपूर्ण बैठने-लेटने की वस्तु को ‘पलंग’ से अधिक प्रसंगानुकूल ढंग से व्यक्त करता है।
