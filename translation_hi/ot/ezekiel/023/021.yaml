id: EZK.23.21
reference: Ezekiel 23:21
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַֽ/תִּפְקְדִ֔י אֵ֖ת זִמַּ֣ת נְעוּרָ֑יִ/ךְ בַּ/עְשׂ֤וֹת מִ/מִּצְרַ֨יִם֙ דַּדַּ֔יִ/ךְ לְמַ֖עַן שְׁדֵ֥י נְעוּרָֽיִ/ךְ׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/023/021.yaml
  text: Thus you revisited the lewdness of your youth[a], when in Egypt they fondled your breasts[c][b], the breasts of your youth.
translation:
  language: hi
  text: इस प्रकार तू अपनी जवानी की लम्पटता की ओर फिर लौटी[a], जब मिस्र में तेरे स्तनों को सहलाया गया[b]—तेरी जवानी के स्तनों को।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “अपनी जवानी की लम्पटता को याद किया।” इब्रानी क्रिया का अर्थ ध्यान देना, स्मरण करना, भेंट करना, या फिर उसकी ओर लौटना हो सकता है; यहाँ पुराने आचरण की ओर दोबारा मुड़ने का भाव संभवतः शामिल है।
    reason: lexical_alternative
  - marker: b
    text: 'इब्रानी वाक्यांश का शब्दशः रूप कठिन है: “मिस्र से तेरे स्तनों को करते समय।” यहाँ इसे मिस्र में हुए कामुक स्पर्श के अर्थ में प्रस्तुत किया गया है; मूल में क्रिया करने वाला स्पष्ट रूप से नहीं बताया गया।'
    reason: textual_or_grammatical_clarity
lexical_decisions:
- source_word: וַתִּפְקְדִי
  choice: तूने ... फिर अपनाया
  rationale: פקד का अर्थ ध्यान देना, स्मरण करना या फिर उसकी ओर लौटना हो सकता है। प्रसंग में केवल याद करना नहीं, बल्कि पुराने आचरण की ओर फिर मुड़ना निहित है; ‘फिर अपनाया’ इस दोहरे भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: זִמַּת
  choice: अश्लीलता
  rationale: यौन प्रसंग में זִמָּה घोर कामुक और नैतिक रूप से भ्रष्ट आचरण को दर्शाता है। ‘अश्लीलता’ उसके यौन-नैतिक बल को बनाए रखती है।
- source_word: נְעוּרַיִךְ
  choice: अपनी/तेरी जवानी
  rationale: यह युवावस्था को सूचित करने वाला सामान्य पद है। मूल की पुनरावृत्ति और काव्यात्मक बल बनाए रखने के लिए दोनों स्थानों पर ‘जवानी’ रखा गया है।
- source_word: בַּעְשׂוֹת מִמִּצְרַיִם דַּדַּיִךְ
  choice: जब मिस्र में तेरे स्तनों को सहलाया गया
  rationale: शाब्दिक संरचना हिन्दी में अस्वाभाविक और कर्ता के विषय में संदिग्ध है। कर्मवाच्य मूल में व्यक्त क्रिया और मिस्र से संबंध को बनाए रखता है, पर ‘मिस्रियों ने’ जैसा स्पष्ट कर्ता नहीं जोड़ता। ‘सहलाया’ यहाँ कामुक स्पर्श का स्पष्ट भाव देता है।
- source_word: דַּדַּיִךְ / שְׁדֵי נְעוּרַיִךְ
  choice: तेरे स्तनों / तेरी जवानी के स्तनों
  rationale: दोनों ठोस शारीरिक शब्द हैं। स्पष्ट भविष्यद्वक्तात्मक रूपक को नरम किए बिना और मूल की पुनरावृत्ति बनाए रखते हुए ‘स्तन’ का प्रयोग किया गया है।
- source_word: לְמַעַן
  choice: प्रत्यक्ष अलग संयोजक के बिना पुनरुक्ति
  rationale: यहाँ לְמַעַן की वाक्यगत भूमिका कठिन है और सामान्य प्रयोजनसूचक ‘ताकि’ अर्थ असंगत होगा। डैश के बाद समानाधिकरणात्मक पुनरुक्ति हिन्दी में मूल के जोर को सुरक्षित रखती है, बिना किसी अनिश्चित संबंध को अत्यधिक स्पष्ट किए।
theological_decisions:
- issue: भविष्यद्वक्तात्मक न्याय-वाणी में स्पष्ट यौन रूपक
  choice: ‘अश्लीलता,’ ‘स्तनों’ और ‘सहलाया’ जैसी स्पष्ट भाषा बनाए रखना
  alternative: ‘अनैतिकता,’ ‘आकर्षण’ या अन्य शिष्टोक्ति से रूपक को नरम करना
  rationale: यह पद यरूशलेम की वाचा-विषयक विश्वासघातिता को जानबूझकर तीखे और स्पष्ट यौन बिंब से चित्रित करता है। शिष्टोक्ति मूल की वाग्मितापूर्ण तीव्रता घटा देती।
- issue: मिस्र से जुड़ी क्रिया का कर्ता
  choice: कर्मवाच्य ‘सहलाया गया’
  alternative: ‘मिस्रियों ने ... सहलाया’ या ‘उन्होंने ... सहलाया’
  rationale: מִמִּצְרַיִם मिस्र को स्रोत, स्थान अथवा संबद्ध पक्ष के रूप में प्रस्तुत कर सकता है, पर स्पष्ट बहुवचन कर्ता नहीं देता। कर्मवाच्य अनावश्यक कर्ता जोड़े बिना वास्तविक अस्पष्टता बचाता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु जानबूझकर स्पष्ट भविष्यद्वक्तात्मक भाषा। स्त्रीलिंग एकवचन संबोधन के लिए ‘तू/तेरे’ रखा गया है, क्योंकि अध्याय में नगर-रूपक के प्रति सीधा, आरोपात्मक संबोधन है। डैश मूल की अंतिम पुनरुक्ति और उसके जोर को बनाए रखता है।
