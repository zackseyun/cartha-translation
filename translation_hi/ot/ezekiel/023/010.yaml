- source_word: וַתְּהִי שֵׁם לַנָּשִׁים
  choice: वह स्त्रियों के बीच बदनाम हो गई
  rationale: शाब्दिक ‘स्त्रियों के बीच एक नाम हो गई’ हिन्दी में अस्पष्ट होगा। प्रसंग में שֵׁם प्रतिष्ठा नहीं, कुख्याति या बदनामी का संकेत देता है।
- source_word: וּשְׁפוּטִים עָשׂוּ בָהּ
  choice: उन्होंने उस पर न्याय के दंड लागू किए
  rationale: यह שְׁפוּטִים के बहुवचन और उसके न्यायिक-दंडात्मक भाव को बनाए रखता है; केवल ‘उसे दंड दिया’ कहने से न्यायिक भाषा मंद पड़ती।
