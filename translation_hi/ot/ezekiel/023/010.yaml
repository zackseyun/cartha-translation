  yaml_path: translation/ot/ezekiel/023/010.yaml
  text: They uncovered her nakedness[a]; they took her sons and her daughters, and they killed her with the sword. So she became a byword among women[c][b], and they executed judgments on her.
translation:
  language: hi
  text: उन्होंने उसकी नग्नता उघाड़ दी[a]; उसके बेटों और बेटियों को ले गए, और उसे तलवार से मार डाला। इस तरह वह स्त्रियों के बीच बदनाम हो गई[b], और उन्होंने उसे न्यायिक दंड दिए[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसकी नग्नता खोल दी”; इब्रानी मुहावरे में सार्वजनिक रूप से लज्जित करने का भाव भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या, “वह स्त्रियों के बीच बदनामी की मिसाल बन गई”; शाब्दिक अर्थ है, “वह स्त्रियों के बीच एक नाम हो गई।”
    reason: lexical_alternative
  - marker: c
    text: या, “उन्होंने उसके विरुद्ध न्याय के निर्णय पूरे किए।”
    reason: lexical_alternative
lexical_decisions:
- source_word: גִּלּוּ עֶרְוָתָהּ
  choice: उन्होंने उसकी नग्नता उघाड़ दी
  rationale: यह अनुवाद इब्रानी मुहावरे की ठोस देह-संबंधी छवि और सार्वजनिक अपमान—दोनों की संभावना बनाए रखता है; केवल ‘लज्जित किया’ कहना मूल बिंब को अमूर्त कर देता।
