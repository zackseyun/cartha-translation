  alternative: ‘उसे सबके सामने लज्जित किया’
  rationale: यहेजकेल 23 में यह देह-संबंधी न्याय-चित्रण वाचा की विश्वासघातिता और उसके परिणाम की तीव्रता का अंग है। अमूर्त अनुवाद उस तनाव को नरम कर देता।
- issue: अंतिम वाक्यांश की न्यायिक शक्ति
  choice: ‘उस पर न्याय के दंड लागू किए’
  alternative: ‘उसे दंड दिया’
  rationale: मूल में न्याय/न्यायिक दंड सूचित करने वाली बहुवचन संज्ञा है। इसलिए सैन्य हिंसा मात्र के बजाय न्याय घोषित किए जाने का भाव सुरक्षित रखा गया।
