  choice: उसके बेटे-बेटियों को ले लिया
  rationale: לָקַח का मूल अर्थ ‘लेना’ है। विजय के प्रसंग में बंदी बनाकर ले जाने का भाव संभव है, पर उसे मुख्य पाठ में अनावश्यक रूप से निश्चित नहीं किया गया।
- source_word: וְאוֹתָהּ בַּחֶרֶב הָרָגוּ
  choice: उसे तलवार से मार डाला
