source:
  edition: WLC
  text: וּ/כְ/מַרְאֵ֨ה הַ/מַּרְאֶ֜ה אֲשֶׁ֣ר רָאִ֗יתִי כַּ/מַּרְאֶ֤ה אֲשֶׁר רָאִ֨יתִי֙ בְּ/בֹאִ/י֙ לְ/שַׁחֵ֣ת אֶת הָ/עִ֔יר וּ/מַרְא֕וֹת כַּ/מַּרְאֶ֕ה אֲשֶׁ֥ר רָאִ֖יתִי אֶל נְהַר כְּבָ֑ר וָ/אֶפֹּ֖ל אֶל פָּנָֽ/י־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/043/003.yaml
  text: And the appearance of what I saw was like the appearance that I had seen when I came to destroy the city[a], and the visions were like the appearance that I had seen by the Kebar Canal[b]; and I fell on my face.
translation:
  language: hi
  text: और जो मैंने देखा था उसका स्वरूप उस दृश्य के स्वरूप के समान था जिसे मैंने उस समय देखा था जब मैं नगर को नष्ट करने आया था[a]; और दर्शन उस दृश्य के समान थे जिसे मैंने कबार नहर के पास देखा था[b]। और मैं मुँह के बल गिर पड़ा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जब वह नगर को नष्ट करने आया था।” इब्रानी पाठ में “जब मैं आया” है। यह यरूशलेम के विनाश के दर्शन में यहेजकेल की सहभागिता को सूचित कर सकता है, न कि यह कि उसने स्वयं वास्तव में नगर को नष्ट किया।
    reason: alternative_reading
  - marker: b
    text: इब्रानी में “कबार नदी”; सम्भवतः यह बाबेल की एक बड़ी नहर थी, प्राकृतिक नदी नहीं।
    reason: cultural_note
lexical_decisions:
- source_word: מַרְאֶה / מַרְאוֹת
  choice: दृश्य / दर्शन
  rationale: एकवचन מַרְאֶה के लिए ‘दृश्य’ और बहुवचन מַרְאוֹת के लिए ‘दर्शन’ चुना गया है। इससे इब्रानी में संख्या-परिवर्तन बना रहता है और बार-बार आने वाली दृश्य-समानता आधुनिक हिन्दी में स्वाभाविक रूप से व्यक्त होती है।
- source_word: רָאִיתִי
  choice: मैंने देखा / मैंने देखा था
  rationale: भूतकाल की पूर्व घटनाओं से तुलना स्पष्ट करने के लिए प्रसंगानुसार ‘देखा’ और ‘देखा था’ का प्रयोग किया गया है।
- source_word: בְּבֹאִי
  choice: जब मैं … आया था
  rationale: पहले पुरुष एकवचन प्रत्यय को ज्यों का त्यों रखा गया है; कठिन पाठ को किसी दूसरे कर्ता के पक्ष में मुख्य पाठ में नहीं बदला गया।
- source_word: לְשַׁחֵת
  choice: नष्ट करने
  rationale: यहाँ שׁחת विनाशकारी कार्य को व्यक्त करता है; ‘नष्ट करने’ सीधा और स्पष्ट अनुवाद है।
- source_word: הָעִיר
  choice: नगर
  rationale: मूल पाठ केवल ‘नगर’ कहता है। सन्दर्भ यरूशलेम का है, पर मुख्य पाठ में उसका नाम जोड़ना उचित नहीं है।
- source_word: אֶל נְהַר כְּבָר
  choice: कबार नहर के पास
  rationale: नְהַר כְּבָר बाबेल की एक प्रमुख जल-नहर को सूचित करता है; इसलिए भौगोलिक दृष्टि से ‘नहर’ सम्भावित अर्थ को अधिक ठीक व्यक्त करता है।
- source_word: וָאֶפֹּל אֶל־פָּנַי
  choice: मैं मुँह के बल गिर पड़ा
  rationale: यह श्रद्धा और दर्शन से अभिभूत होने की मानक इब्रानी अभिव्यक्ति है; हिन्दी में इसका स्वाभाविक और प्रभावशाली समतुल्य रखा गया है।
theological_decisions:
- issue: ‘जब मैं नगर को नष्ट करने आया था’ में निहित कर्ता
  choice: मुख्य पाठ में पहले पुरुष ‘मैं’ को बनाए रखा गया है।
  alternative: ‘जब वह नगर को नष्ट करने आया था’
  rationale: मसोरेटी पाठ में क्रिया पहले पुरुष में है। यह यहेजकेल की यरूशलेम के विनाश वाले दर्शन में सहभागिता को सूचित कर सकता है, यद्यपि यह वाक्य कठिन है। इसलिए नबी को वास्तविक विनाशकर्ता मानने या कर्ता को चुपचाप बदलने के बजाय तनाव को सुरक्षित रखा गया है और वैकल्पिक समझ पादटिप्पणी में दी गई है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘दृश्य’ और ‘दर्शन’ का भेद इब्रानी के एकवचन-बहुवचन परिवर्तन को व्यक्त करता है। अर्धविराम दो तुलनात्मक खंडों को अलग करता है, और अंतिम वाक्य नबी की प्रतिक्रिया को स्पष्ट रूप से सामने लाता है।
