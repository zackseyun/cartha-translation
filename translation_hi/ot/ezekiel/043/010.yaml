reference: Ezekiel 43:10
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: אַתָּ֣ה בֶן אָדָ֗ם הַגֵּ֤ד אֶת בֵּֽית יִשְׂרָאֵל֙ אֶת הַ/בַּ֔יִת וְ/יִכָּלְמ֖וּ מֵ/עֲוֺנֽוֹתֵי/הֶ֑ם וּ/מָדְד֖וּ אֶת תָּכְנִֽית־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/043/010.yaml
  text: As for you[a], son of man, declare the temple to the house of Israel, so that they may be ashamed of their iniquities[b]; and let them measure the plan.
translation:
  language: hi
  text: और तू, हे मनुष्य के पुत्र, इस्राएल के घराने को इस मंदिर[a] के विषय में बता, ताकि वे अपने अधर्मों के कारण लज्जित हों; और वे उसकी रूपरेखा[b] को मापें।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से ‘घर’। यहाँ यह शब्द यहेजकेल के दर्शन में दिखाए गए पवित्रस्थान या मंदिर को सूचित करता है।
    reason: lexical_alternative
  - marker: b
    text: या ‘नमूना’, ‘बनावट’ अथवा ‘योजना’।
    reason: lexical_alternative
lexical_decisions:
- source_word: אַתָּה
  choice: और तू
  rationale: सर्वनाम पर दिया गया बल बनाए रखा गया है; पिछले दर्शन-वर्णन से आज्ञा की ओर बढ़ते हुए ‘और तू’ हिन्दी में स्वाभाविक भी है।
- source_word: בֶן אָדָם
  choice: हे मनुष्य के पुत्र
  rationale: यहेजकेल को संबोधित करने वाला यह पुस्तक का नियमित पदबंध है। इसका औपचारिक रूप साहित्यिक निरंतरता बनाए रखता है और ‘नश्वर मनुष्य’ जैसी व्याख्यात्मक शब्दावली नहीं जोड़ता।
- source_word: הַגֵּד
  choice: बता
  rationale: נגד के हिफ़ील आज्ञार्थक का अर्थ यहाँ स्पष्ट रूप से बताना या अवगत कराना है। ‘बता’ आधुनिक और सहज है, फिर भी भविष्यद्वाणी की आज्ञा का बल रखता है।
- source_word: בֵּית יִשְׂרָאֵל
  choice: इस्राएल का घराना
  rationale: यह वाचागत सामूहिक अभिव्यक्ति स्रोत के ‘घर’ रूपक और भविष्यद्वाणी की शैली को बनाए रखती है।
- source_word: הַבַּיִת
  choice: यह भवन
  rationale: मूल शब्द का शाब्दिक अर्थ ‘घर/भवन’ है, और निकट संदर्भ में यह दर्शन में दिखाए गए पवित्रस्थान-मन्दिर को सूचित करता है। ‘यह भवन’ मूल रूपक और संदर्भगत संकेत दोनों रखता है।
- source_word: וְיִכָּלְמוּ מֵעֲוֺנוֹתֵיהֶם
  choice: ताकि वे अपने अधर्मों के कारण लज्जित हों
  rationale: आज्ञार्थक के बाद आया क्रिया-रूप उद्देश्य अथवा परिणाम व्यक्त कर सकता है। מִן को यहाँ लज्जा के कारण के रूप में सहज हिन्दी में व्यक्त किया गया है; ‘अधर्म’ עָוֹן का नैतिक भार रखता है।
- source_word: וּמָדְדוּ
  choice: और वे … मापें
  rationale: यह रूप पिछली आज्ञा के बाद अपेक्षित प्रतिक्रिया या परोक्ष निर्देश के रूप में समझा गया है। सम्भावनार्थक ‘मापें’ उस बल को साधारण भविष्यकाल की अपेक्षा बेहतर रखता है।
- source_word: תָּכְנִית
  choice: रूपरेखा
  rationale: यह शब्द भवन की मापी जा सकने वाली योजना, बनावट या प्रतिरूप को सूचित करता है। ‘रूपरेखा’ आधुनिक हिन्दी में वास्तु-योजना के लिए स्पष्ट है और अर्थ को किसी एक तकनीकी धारणा तक सीमित नहीं करती।
theological_decisions:
- issue: הַבַּיִת का संदर्भ
  choice: मुख्य पाठ में ‘यह भवन’, और पादटिप्पणी में मन्दिर/पवित्रस्थान का संदर्भ स्पष्ट किया गया।
  alternative: सीधे ‘मन्दिर’ अनुवाद करना।
  rationale: यहेजकेल 40–43 के संदर्भ में भवन निस्संदेह दर्शनीय पवित्रस्थान है, पर ‘भवन’ मूल के ‘घर’ रूपक को बचाता है और पादटिप्पणी आधुनिक पाठक के लिए संदर्भ स्पष्ट करती है।
- issue: आज्ञार्थक के बाद की क्रियाओं का बल
  choice: 'उद्देश्य और अपेक्षित प्रतिक्रिया: ‘ताकि … हों; और वे … मापें।’'
  alternative: 'साधारण समन्वय और भविष्यवाणी: ‘और वे लज्जित होंगे … और मापेंगे।’'
  rationale: वाक्य-विन्यास उद्देश्य/परिणाम तथा परोक्ष निर्देश की समझ का समर्थन करता है, किन्तु ‘मापें’ ऐसा रूप है जो आग्रह और अपेक्षित परिणाम के बीच कुछ व्याकरणिक खुलापन बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण भविष्यद्वाणी-शैली रखी गई है। ‘तू’ दिव्य संबोधन के पारंपरिक एकवचन और मूल की प्रत्यक्षता को बनाए रखता है; ‘हे’ संबोधन को स्पष्ट करता है। वाक्य को अत्यधिक संस्कृतनिष्ठ या प्राचीन बनाए बिना ‘अधर्मों’, ‘लज्जित’ और ‘रूपरेखा’ जैसे परिचित औपचारिक शब्द चुने गए हैं।
