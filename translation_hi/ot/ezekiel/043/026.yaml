  text: For seven days they shall make atonement for the altar and cleanse it[a], and they shall consecrate it.
translation:
  language: hi
  text: सात दिन तक वे वेदी के लिए प्रायश्चित-विधि करेंगे और उसे शुद्ध करेंगे, और उसे सेवा के लिए प्रतिष्ठित करेंगे[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से, “उसका हाथ भरेंगे।” यह पवित्र सेवा के लिए नियुक्त, प्रतिष्ठित या समर्पित करने का याजकीय मुहावरा है।
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁבְעַת יָמִים
  choice: सात दिन तक
  rationale: यह पदबंध कार्यों की अवधि बताता है; ‘तक’ आधुनिक हिन्दी में इस कालावधि को स्वाभाविक रूप से व्यक्त करता है।
- source_word: יְכַפְּרוּ אֶת הַמִּזְבֵּחַ
  choice: वेदी के लिए प्रायश्चित-विधि करेंगे
  rationale: याजकीय संदर्भ में כפר वेदी पर किए जाने वाले प्रायश्चित अथवा शुद्धीकरण-संबंधी अनुष्ठान को सूचित करता है। ‘प्रायश्चित-विधि’ धार्मिक अर्थ बनाए रखते हुए यह स्पष्ट करती है कि यहाँ वेदी के विषय में अनुष्ठान किया जा रहा है।
- source_word: וְטִהֲרוּ אֹתוֹ
  choice: और उसे शुद्ध करेंगे
  rationale: טהר का यहाँ अनुष्ठानिक शुद्धता से संबंध है; ‘शुद्ध करेंगे’ आधुनिक हिन्दी में स्पष्ट और संदर्भानुकूल है।
- source_word: וּמִלְאוּ יָדוֹ
  choice: फिर वे उसे पवित्र सेवा के लिए प्रतिष्ठित करेंगे
  rationale: शाब्दिक रूप से ‘उसका हाथ भरेंगे’ एक याजकीय मुहावरा है, जो किसी को सेवा के लिए नियुक्त या प्रतिष्ठित करने का भाव देता है। वेदी के लिए ‘पवित्र सेवा के लिए प्रतिष्ठित करेंगे’ स्वाभाविक हिन्दी में उस स्थापना और समर्पण के भाव को व्यक्त करता है।
theological_decisions:
- issue: वेदी के संबंध में וּמִלְאוּ יָדוֹ याजकीय मुहावरे का अनुवाद
  choice: उसे पवित्र सेवा के लिए प्रतिष्ठित करेंगे
  alternative: उसका हाथ भरेंगे; उसे पवित्र करेंगे; उसका अभिषेक करेंगे
  rationale: शाब्दिक हिन्दी अर्थ अस्पष्ट और भ्रामक होगा। ‘प्रतिष्ठित’ वेदी को उपासना-सेवा के लिए विधिवत स्थापित करने का भाव रखता है, जबकि ‘पवित्र सेवा के लिए’ इस असामान्य मुहावरे का प्रयोजन स्पष्ट करता है। पादटिप्पणी मूल रूप को सुरक्षित रखती है और अर्थ की संभावित व्यापकता को नहीं छिपाती।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए बोधगम्य रखी गई है। ‘प्रायश्चित-विधि’ अनुष्ठानिक संदर्भ स्पष्ट करती है, और ‘पवित्र सेवा के लिए प्रतिष्ठित’ वेदी पर लागू असामान्य इब्रानी मुहावरे को स्वाभाविक हिन्दी में व्यक्त करता है।
