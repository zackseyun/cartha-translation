translation:
  language: hi
  text: और ऊपरी चबूतरा चौदह हाथ लम्बा और चौदह हाथ चौड़ा था, उसके चारों ओर। उसके चारों ओर की किनारी आधा हाथ थी, और उसका आधार चारों ओर एक हाथ का था। उसकी सीढ़ियाँ पूर्व की ओर थीं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָעֲזָרָה
  choice: ऊपरी चौकोर भाग
  rationale: यह वेदी के ऊपरी, चौदह हाथ के वर्गाकार स्तर को सूचित करता है। केवल ‘चबूतरा’ कहने पर संरचना में इसका स्थान अस्पष्ट रह सकता था, इसलिए संदर्भानुकूल वर्णनात्मक पद चुना गया।
- source_word: הַגְּבוּל
  choice: किनारी
  rationale: यह उस स्तर के चारों ओर बने सीमांत उभार या घेर को दर्शाता है; ‘किनारी’ आधुनिक हिन्दी में स्वाभाविक है और किसी अत्यधिक विशिष्ट स्थापत्य रूप को आरोपित नहीं करती।
- source_word: הַחֵיק
  choice: आधार
  rationale: स्थापत्य संदर्भ में यह चारों ओर निकले निचले हिस्से या आधार को सूचित करता है। शब्द की सटीक बनावट अनिश्चित है, इसलिए सामान्य और संदर्भसंगत ‘आधार’ रखा गया।
- source_word: מַעֲלֹתָיו
  choice: उसकी सीढ़ियाँ
  rationale: बहुवचन रूप चढ़ने की सीढ़ियों को स्पष्टतः दर्शाता है।
- source_word: קָדִים
  choice: पूर्व की ओर
  rationale: दिशासूचक अर्थ को सीधे और स्वाभाविक हिन्दी में व्यक्त करता है।
