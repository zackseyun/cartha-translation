source:
  edition: WLC
  text: וְ/הִנֵּ֗ה כְּבוֹד֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל בָּ֖א מִ/דֶּ֣רֶךְ הַ/קָּדִ֑ים וְ/קוֹל֗/וֹ כְּ/קוֹל֙ מַ֣יִם רַבִּ֔ים וְ/הָ/אָ֖רֶץ הֵאִ֥ירָה מִ/כְּבֹדֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/043/002.yaml
  text: And behold[a], the glory of the God of Israel was coming from the way of the east, and his voice was like the sound of many waters[b], and the earth shone from his glory.
translation:
  language: hi
  text: और देखो, इस्राएल के परमेश्वर की महिमा पूरब की ओर से[a] आ रही थी। उसकी आवाज़ बहुत-से जलों की ध्वनि[b] के समान थी, और उसकी महिमा से पृथ्वी प्रकाशमान हो उठी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “पूरब के मार्ग से”; या “पूरब की दिशा से।”
    reason: lexical_alternative
  - marker: b
    text: या “बहुत-से जलों की गर्जना।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  choice: और देखो
  rationale: दर्शन के दृश्य में अचानक ध्यान खींचने और सजीवता लाने वाले हिब्रू उद्गार का स्वाभाविक आधुनिक हिन्दी रूप।
- source_word: כְּבוֹד אֱלֹהֵי יִשְׂרָאֵל
  choice: इस्राएल के परमेश्वर की महिमा
  rationale: रचनात्मक संबंध और ईशदर्शन-संबंधी ‘महिमा’ की गूँज को सीधे और स्पष्ट रूप में सुरक्षित रखता है।
- source_word: בָּא
  choice: आ रही थी
  rationale: दर्शन में नबी के सामने घटते हुए दृश्य को स्त्रीलिंग ‘महिमा’ के साथ अपूर्ण भूतकाल में स्वाभाविक रूप से व्यक्त करता है।
- source_word: מִדֶּרֶךְ הַקָּדִים
  choice: पूरब की ओर से
  rationale: हिब्रू में ‘पूरब के मार्ग/दिशा से’ है; मुख्य पाठ में यह रूप दिशा का अर्थ स्वाभाविक हिन्दी में देता है, जबकि शाब्दिक ‘मार्ग’ को पादटिप्पणी में रखा गया है।
- source_word: וְקוֹלוֹ
  choice: उसकी आवाज़
  rationale: व्याकरणतः प्रत्यय ‘महिमा’ की ओर लौटता है, पर प्रसंग परमेश्वर की व्यक्तिगत ईशदर्शनीय उपस्थिति का है; हिन्दी में व्यक्तिगत सर्वनाम इस तनाव को बिना अतिरिक्त व्याख्या के स्वाभाविक रूप देता है।
- source_word: כְּקוֹל מַיִם רַבִּים
  choice: बहुत-से जलों की ध्वनि के समान
  rationale: קול को तुलना में ‘ध्वनि’ और מים רבים को बहुवचन चित्र के साथ रखा गया है; ‘गर्जना’ अधिक व्याख्यात्मक होने के कारण विकल्प के रूप में पादटिप्पणी में है।
- source_word: הֵאִירָה מִכְּבֹדוֹ
  choice: उसकी महिमा से पृथ्वी प्रकाशमान हो उठी
  rationale: מן को प्रकाश के स्रोत के रूप में व्यक्त करता है और हिफ़ईल क्रिया के प्रकाशमान होने के परिणाम को सहज हिन्दी में सामने लाता है।
theological_decisions:
- issue: ‘आवाज़’ और ‘महिमा’ से जुड़े सर्वनाम का व्यक्तिगत या अवैयक्तिक रूप
  choice: ‘उसकी आवाज़’ और ‘उसकी महिमा’
  alternative: ‘उस महिमा की ध्वनि’ और ‘उसकी चमक’
  rationale: यद्यपि व्याकरणिक पूर्वपद ‘महिमा’ है, प्रसंग इस्राएल के परमेश्वर की व्यक्तिगत ईशदर्शनीय उपस्थिति को चित्रित करता है। व्यक्तिगत सर्वनाम पाठ की इस प्रस्तुति को बनाए रखता है, पर महिमा और परमेश्वर के संबंध को किसी अतिरिक्त सिद्धान्त से परिभाषित नहीं करता।
- issue: הָאָרֶץ का क्षेत्र
  choice: पृथ्वी
  alternative: भूमि
  rationale: व्यापक ईशदर्शनीय प्रकाश के संदर्भ में ‘पृथ्वी’ उपयुक्त है, फिर भी हिब्रू शब्द में ‘भूमि/देश’ का अर्थ संभव है; मुख्य पाठ अनावश्यक रूप से स्थानीय सीमा नहीं लगाता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की है, पर भविष्यद्वाणी के दर्शन के अनुरूप गरिमापूर्ण रखी गई है। ‘और देखो’ दृश्य की आकस्मिकता बनाए रखता है; ‘बहुत-से जलों’ का कुछ शास्त्रीय स्वर मूल के बहुवचन बिंब को सुरक्षित रखने के लिए जानबूझकर रखा गया है।
