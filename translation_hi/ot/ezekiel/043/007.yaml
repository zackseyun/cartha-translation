base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/043/007.yaml
  text: And he said to me[a], “Son of man, this is the place of my throne and the place of the soles of my feet, where I will dwell among the children of Israel forever. And the house of Israel shall no longer defile my holy name, neither they nor their kings, by their prostitution and by the corpses of their kings on their high places.”
translation:
  language: hi
  text: और उसने मुझसे कहा, “हे मनुष्य के पुत्र, यह मेरे सिंहासन का स्थान और मेरे पाँवों के तलवों का स्थान है, जहाँ मैं इस्राएल की सन्तानों के बीच सदा निवास करूँगा। इस्राएल का घराना फिर कभी मेरे पवित्र नाम को अशुद्ध नहीं करेगा—न तो वे, न उनके राजा—अपने व्यभिचार से और अपने राजाओं के उन शवों से जो उनके ऊँचे पूजा-स्थलों पर हैं।[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अन्तिम शब्द को परम्परागत रूप से “उनके ऊँचे पूजा-स्थल” पढ़ा जाता है। सम्भवतः इसे “उनकी मृत्यु में” भी समझा जा सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: בֶּן אָדָם
  choice: हे मनुष्य के पुत्र
  rationale: यहेजकेल के लिए प्रयुक्त इब्रानी सम्बोधन-सूत्र को बनाए रखता है और स्वाभाविक हिन्दी सम्बोधन देता है।
- source_word: מְקוֹם כִּסְאִי
  choice: मेरे सिंहासन का स्थान
  rationale: सम्बन्धवाचक इब्रानी रचना का सीधा और स्वाभाविक हिन्दी अनुवाद।
- source_word: מְקוֹם כַּפּוֹת רַגְלַי
  choice: मेरे पाँवों के तलवों का स्थान
  rationale: शाब्दिक देहात्मक बिम्ब को सुरक्षित रखता है; ‘पाँव रखने का स्थान’ या ‘पादपीठ’ अनावश्यक व्याख्या जोड़ते।
- source_word: אֲשֶׁר אֶשְׁכָּן שָׁם
  choice: जहाँ मैं ... निवास करूँगा
  rationale: दर्शन के भावी परिप्रेक्ष्य में अपूर्ण क्रिया का भावी अर्थ स्वाभाविक है; ‘जहाँ’ में שָׁם का स्थानगत अर्थ समाहित है।
- source_word: בְּתוֹךְ בְּנֵי יִשְׂרָאֵל
  choice: इस्राएल की सन्तान के बीच
  rationale: ‘बीच’ निकट उपस्थिति का अर्थ देता है और ‘इस्राएल की सन्तान’ मूल पारिवारिक-वाचा संबंधी अभिव्यक्ति को बनाए रखता है।
- source_word: לְעוֹלָם
  choice: सदा
  rationale: अवधि की निरन्तरता का संक्षिप्त, प्रतिष्ठित और सहज हिन्दी रूप।
- source_word: יְטַמְּאוּ
  choice: अशुद्ध नहीं करेगा
  rationale: טמא की शुद्धता-अशुद्धता संबंधी मूल अर्थभूमि को सुरक्षित रखता है; कर्ता ‘इस्राएल का घराना’ हिन्दी में एकवचन सामूहिक संज्ञा है।
- source_word: שֵׁם קָדְשִׁי
  choice: मेरे पवित्र नाम
  rationale: मूल सम्बन्धवाचक पदबंध का प्रचलित और सटीक हिन्दी रूप।
- source_word: הֵמָּה וּמַלְכֵיהֶם
  choice: न वे, न उनके राजा
  rationale: पहले आए निषेध के अधीन दोनों समूहों को हिन्दी में स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
- source_word: בִּזְנוּתָם
  choice: अपने व्यभिचार
  rationale: भविष्यद्वाणी में निहित यौन और वाचा-विरोधी दोनों अर्थों के लिए हिन्दी का दृढ़, परिचित शब्द; ‘वेश्यावृत्ति’ यहाँ केवल पेशागत अर्थ की ओर अधिक झुक सकता है।
- source_word: וּבְפִגְרֵי מַלְכֵיהֶם
  choice: अपने राजाओं के शवों से
  rationale: פגר का सीधा अर्थ ‘शव’ है और मृतदेह से होने वाली अशुद्धता का संकेत बनाए रखता है।
- source_word: בָּמוֹתָם
  choice: उनके पूजा-स्थलों पर
  rationale: मसोरेटिक स्वरांकन के अनुसार בָּמוֹת ‘ऊँचे स्थानों’ को दर्शाता है; साधारण पाठक के लिए उनका उपासना-संबंधी स्वरूप स्पष्ट करने हेतु ‘पूजा-स्थल’ चुना गया है, जबकि वैकल्पिक पाठ फुटनोट में सुरक्षित है।
theological_decisions:
- issue: अन्तिम पदबंध में अशुद्धता का स्वरूप
  choice: राजाओं के शवों द्वारा उनके पूजा-स्थलों पर होने वाली धार्मिक और वाचा-संबंधी अशुद्धता
  alternative: ‘उनकी मृत्यु में अपने राजाओं के शवों से’
  rationale: मसोरेटिक स्वरांकन और मन्दिर-पवित्रता का निकट सन्दर्भ पूजा-स्थलों वाले अर्थ का समर्थन करते हैं। फिर भी व्यंजनात्मक रूप से मृत्यु-संबंधी समझ सम्भव मानी गई है, इसलिए उसे फुटनोट में रखा गया है।
- issue: זְנוּת का रूपकात्मक विस्तार
  choice: ‘व्यभिचार’ द्वारा यौन तथा मूर्तिपूजात्मक/वाचा-विरोधी तनाव बनाए रखना
  alternative: ‘वेश्यावृत्ति’ या केवल ‘मूर्तिपूजा’
  rationale: केवल ‘मूर्तिपूजा’ मूल के तीखे रूपक को मिटा देती, जबकि ‘वेश्यावृत्ति’ हिन्दी में पेशागत अर्थ को अनावश्यक रूप से प्रमुख कर सकती है।
