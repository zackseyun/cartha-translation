  register: भाषा आधुनिक मानक हिन्दी में गरिमामय और सामान्य पाठक के लिए बोधगम्य रखी गई है। ‘मनुष्य के पुत्र’, ‘सिंहासन’, ‘पवित्र नाम’ और ‘इस्राएल का घराना’ जैसे बाइबिलीय पद मूल के औपचारिक और वाचा-संबंधी स्वर को बनाए रखते हैं। फुटनोट चिह्न [a] मुख्य पाठ में सम्बन्धित विवादित अन्तिम खंड के बाद रखा गया है।
