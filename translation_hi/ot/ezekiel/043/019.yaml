source:
  edition: WLC
  text: וְ/נָתַתָּ֣ה אֶל הַ/כֹּהֲנִ֣ים הַ/לְוִיִּ֡ם אֲשֶׁ֣ר הֵם֩ מִ/זֶּ֨רַע צָד֜וֹק הַ/קְּרֹבִ֣ים אֵלַ֗/י נְאֻ֛ם אֲדֹנָ֥/י יְהוִ֖ה לְ/שָֽׁרְתֵ֑/נִי פַּ֥ר בֶּן בָּקָ֖ר לְ/חַטָּֽאת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/043/019.yaml
  text: And you shall give to the Levitical priests who are from the offspring of Zadok[a], who draw near to me to minister to me, declares the Lord GOD, a bull from the herd for a sin offering.
translation:
  language: hi
  text: “तू लेवीय याजकों को—जो सादोक के वंशज हैं और मेरी सेवा करने के लिए मेरे निकट आते हैं,”—प्रभु यहोवा की यह घोषणा है—“पापबलि के लिए गाय-बैलों में से एक बैल[a] देना।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से, “एक बैल, गाय-बैलों का पुत्र”; इसका अर्थ “गाय-बैलों में से एक बैल” या “एक जवान बैल” हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתָּה
  choice: तू ... देना
  rationale: संयोजक सहित पूर्ण क्रिया इस निर्देशात्मक प्रसंग में आज्ञार्थक बल रखती है। ‘देना’ अगले आदेश के रूप में स्वाभाविक हिन्दी है और एकवचन संबोधन को बनाए रखता है।
- source_word: הַכֹּהֲנִים הַלְוִיִּם
  choice: लेवीय याजकों
  rationale: यह पदबंध याजकीय सेवा करने वाले लेवीय याजकों को सूचित करता है, सभी लेवियों को नहीं।
- source_word: אֲשֶׁר הֵם מִזֶּרַע צָדוֹק
  choice: जो सादोक के वंशज हैं
  rationale: מִזֶּרַע का वंशगत अर्थ आधुनिक हिन्दी में ‘वंशज’ से स्पष्ट और स्वाभाविक रूप से व्यक्त होता है।
- source_word: הַקְּרֹבִים אֵלַי
  choice: मेरे निकट आते हैं
  rationale: קרב का निकट आने का मूल अर्थ और याजकीय उपासना में परमेश्वर के सम्मुख आने का विशेष भाव दोनों सुरक्षित रहते हैं।
- source_word: לְשָׁרְתֵנִי
  choice: मेरी सेवा करने के लिए
  rationale: שׁרת यहाँ याजकीय-धार्मिक सेवा को दर्शाता है; प्रसंग इस सामान्य हिन्दी पदबंध का विशिष्ट अर्थ स्पष्ट करता है।
- source_word: פַּר בֶּן בָּקָר
  choice: गाय-बैलों में से एक बैल
  rationale: शाब्दिक ‘एक बैल, गाय-बैलों का पुत्र’ को जड़ हिन्दी में दोहराने के बजाय यह अनुवाद पशु-झुंड से लिए गए बैल का अर्थ स्वाभाविक रूप में देता है; शाब्दिक बनावट पादटिप्पणी में दी गई है।
- source_word: לְחַטָּאת
  choice: पापबलि के लिए
  rationale: बलिदान-संबंधी प्रसंग में חַטָּאת अमूर्त ‘पाप’ नहीं, पाप के लिए चढ़ाई जाने वाली बलि को सूचित करता है।
theological_decisions:
- issue: אֲדֹנָי יְהוִה में परमेश्वर के नाम का अनुवाद
  choice: प्रभु यहोवा
  alternative: प्रभु परमेश्वर
  rationale: मूल पाठ में उपाधि אֲדֹנָי के साथ वाचा का विशिष्ट नाम יהוה है। ‘प्रभु यहोवा’ दोनों को अलग रखता है और ‘प्रभु प्रभु’ जैसे अस्वाभाविक दोहराव से बचता है।
- issue: सादोक के वंशज याजकों की पहचान
  choice: लेवीय याजक जो सादोक के वंशज हैं
  alternative: याजक, अर्थात् लेवी, जो सादोक के वंशज हैं
  rationale: वाक्य की दोनों वंशगत विशेषताओं को बनाए रखा गया है, बिना इसका विस्तार सभी लेवियों तक किए।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और निर्देशात्मक रखी गई है। लंबे इब्रानी वाक्य में याजकों का परिचय डैश के बीच रखा गया है, ताकि मुख्य आदेश स्पष्ट रहे। परमेश्वर का संबोधन एकवचन ‘तू’ है, जो हिन्दी बाइबल की आज्ञात्मक शैली के अनुरूप है।
