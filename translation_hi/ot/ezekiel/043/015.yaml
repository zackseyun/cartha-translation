- source_word: הַרְאֵל / אֲרִאֵיל
  choice: वेदी का अग्निकुंड
  rationale: ये दोनों निकट-संबंधित और दुर्लभ इब्रानी शब्द इस प्रसंग में वेदी के सबसे ऊपरी, आग जलाने वाले भाग को सूचित करते हैं। ‘वेदी का अग्निकुंड’ उनके उपासना-संबंधी कार्य को साधारण आधुनिक हिन्दी में स्पष्ट करता है, जबकि उनकी शाब्दिक व्युत्पत्ति और लिप्यंतरण को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: אַרְבַּע אַמּוֹת
  choice: चार हाथ
  rationale: ‘हाथ’ प्राचीन माप ‘अम्माह’ (cubit) के लिए हिन्दी बाइबल-परंपरा में प्रचलित और सहज शब्द है; आधुनिक इकाई में अनुमानित रूपांतरण नहीं किया गया।
- source_word: וּלְמַעְלָה
  choice: ऊपर की ओर
  rationale: यह वेदी के अग्निकुंड से आरम्भ होने वाली ऊर्ध्व दिशा व्यक्त करता है।
- source_word: הַקְּרָנוֹת אַרְבַּע
  choice: चार सींग
  rationale: यह वेदी के चार उभरे हुए सींगों का उल्लेख है। हिन्दी में संख्या को संज्ञा से पहले रखना स्वाभाविक है।
