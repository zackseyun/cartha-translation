  edition: WLC
  text: וַ/יֹּ֣אמֶר אֵלַ֗/י בֶּן אָדָם֙ כֹּ֤ה אָמַר֙ אֲדֹנָ֣/י יְהוִ֔ה אֵ֚לֶּה חֻקּ֣וֹת הַ/מִּזְבֵּ֔חַ בְּ/י֖וֹם הֵעָֽשׂוֹת֑/וֹ לְ/הַעֲל֤וֹת עָלָי/ו֙ עוֹלָ֔ה וְ/לִ/זְרֹ֥ק עָלָ֖י/ו דָּֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/043/018.yaml
  text: 'And he said to me[a], “Son of man, thus says the Lord GOD: These are the statutes of the altar on the day it is made[c][b], for offering burnt offerings on it and for sprinkling blood on it.”'
translation:
  language: hi
  text: 'उसने मुझसे कहा, “हे मनुष्य के पुत्र, प्रभु याहवे यों कहता है: जब वेदी बनाई जाए, तब उसके लिए ये विधि-विधान हैं[a]—उस पर होम-बलियाँ[b] चढ़ाने और उस पर लहू छिड़कने[c] के लिए।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक रूप से: “उसके बनाए जाने के दिन”; इसका अधिक सामान्य अर्थ “जब वह बनाई जाए” भी हो सकता है।'
    reason: lexical_alternative
  - marker: b
    text: या “एक होम-बलि”; इब्रानी में शब्द एकवचन है, पर यहाँ उसका सामूहिक अर्थ हो सकता है।
    reason: lexical_alternative
  - marker: c
    text: या “लहू उस पर फेंकना”; इब्रानी क्रिया कभी-कभी ‘छिड़कने’ की अपेक्षा अधिक जोर से लहू लगाए जाने का संकेत देती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן אָדָם
  choice: हे मनुष्य के पुत्र
  rationale: यह यहेजकेल को संबोधित करने का बार-बार आने वाला विशिष्ट पद है; हिन्दी में इस पारंपरिक मुहावरे को बनाए रखने से इसकी साहित्यिक पुनरावृत्ति सुरक्षित रहती है।
- source_word: אֲדֹנָי יְהוִה
  choice: प्रभु याहवे
  rationale: अֲדֹנָי को ‘प्रभु’ और परमेश्वर के निजी नाम יְהוָה को ‘याहवे’ रूप में रखा गया है, जिससे संयुक्त ईश्वरीय उपाधि के दोनों अंग स्पष्ट रहते हैं।
- source_word: חֻקּוֹת
  choice: विधियाँ
  rationale: यह शब्द निर्धारित धार्मिक नियमों या विधान को सूचित करता है; ‘विधियाँ’ आधुनिक हिन्दी में संक्षिप्त, स्वाभाविक और इस अनुष्ठानिक संदर्भ के अनुकूल है।
- source_word: הַמִּזְבֵּחַ
  choice: वेदी
  rationale: बलिदान की वेदी के लिए मानक और स्पष्ट हिन्दी शब्द।
- source_word: בְּיוֹם הֵעָשׂוֹתוֹ
  choice: उसके बनाए जाने के दिन
  rationale: इब्रानी संरचना का शाब्दिक समयार्थ ‘उसके बनाए जाने के दिन’ है; यहाँ ‘उसके’ का संदर्भ वेदी से है।
- source_word: לְהַעֲלוֹת עוֹלָה
  choice: होम-बलियाँ चढ़ाना
  rationale: עלה का हिफ़ील रूप बलिदान-संदर्भ में अर्पित करने या ऊपर चढ़ाने का अर्थ देता है; עוֹלָה रूप में एकवचन होते हुए भी सामूहिक अर्थ रख सकता है।
- source_word: וְלִזְרֹק ... דָּם
  choice: और ... लहू छिड़कना
  rationale: זרק यहाँ वेदी पर लहू लगाने की अनुष्ठानिक क्रिया है। ‘छिड़कना’ परिचित हिन्दी धार्मिक शब्दावली है, यद्यपि क्रिया में अधिक जोर से लहू डालने या फेंकने का भाव भी हो सकता है।
- source_word: עָלָיו
  choice: उस पर
  rationale: यह सर्वनाम वेदी की ओर संकेत करता है और दोनों अनुष्ठानिक क्रियाओं के स्थान को स्पष्ट करता है।
theological_decisions:
- issue: संयुक्त पद אֲדֹנָי יְהוִה में परमेश्वर के नाम का अनुवाद
  choice: प्रभु याहवे
  alternative: प्रभु यहोवा
  rationale: मूल पाठ में चार अक्षरों वाला निजी नाम सीधे उपस्थित है; ‘याहवे’ उसे सामान्य उपाधि में बदलने के बजाय नाम के रूप में सुरक्षित रखता है।
- issue: עוֹלָה के व्याकरणिक एकवचन का अर्थ
  choice: होम-बलियाँ
  alternative: एक होम-बलि
  rationale: अनुष्ठानिक विधान के सामान्य उद्देश्य का वर्णन होने के कारण एकवचन को सामूहिक मानना संभव है; पाठ की व्याकरणिक एकवचनता पादटिप्पणी में सुरक्षित रखी गई है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। वाक्य की विधिक-अनुष्ठानिक प्रकृति बनाए रखने के लिए ‘विधियाँ’, ‘वेदी’ और ‘होम-बलियाँ’ जैसे परिचित बाइबलीय शब्द प्रयुक्त हुए हैं; मूल की संभावित अस्पष्टताएँ पादटिप्पणियों में सुरक्षित हैं।
