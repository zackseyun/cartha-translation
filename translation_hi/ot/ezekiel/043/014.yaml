base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/043/014.yaml
  text: And from the ledge of the ground to the lower platform shall be two cubits[a], with a width of one cubit; and from the smaller platform to the larger platform shall be four cubits[c][b], with a width of one cubit.
translation:
  language: hi
  text: और भूमि-स्तर के आधार[a] से निचले चबूतरे तक दो हाथ, और चौड़ाई एक हाथ; फिर छोटे चबूतरे से बड़े चबूतरे तक चार हाथ, और चौड़ाई एक हाथ।[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी חֵיק הָאָרֶץ का शाब्दिक अर्थ ‘धरती की गोद’ है। यहाँ इसका आशय वेदी के भूमि-स्तर वाले आधार, धँसे हुए भाग या निकले हुए किनारे से हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: इस खंड में इब्रानी עֲזָרָה वेदी के सीढ़ीनुमा संरचनात्मक स्तरों को दर्शाता है; इसका अनुवाद ‘चबूतरा’, ‘किनारा’ या ‘स्तर’ भी किया जाता है।
    reason: lexical_alternative
  - marker: c
    text: अंतिम वाक्यांश का शाब्दिक रूप ‘और हाथ की चौड़ाई’ है। पहले माप के समानांतर होने के कारण यहाँ संभवतः एक हाथ चौड़ाई अभिप्रेत है।
    reason: lexical_alternative
lexical_decisions:
- source_word: חֵיק הָאָרֶץ
  choice: भूमि-स्तर का आधार
  rationale: शाब्दिक अर्थ ‘धरती की गोद’ है, पर वेदी के स्थापत्य-संदर्भ में यह भूमि के स्तर पर स्थित आधार, धँसे हुए भाग या निकले हुए किनारे को सूचित करता है। ‘भूमि-स्तर का आधार’ आधुनिक हिन्दी में ठोस स्थापत्य अर्थ स्पष्ट करता है।
- source_word: עֲזָרָה
  choice: चबूतरा
  rationale: यहेजकेल 43:13–17 में यह वेदी के क्रमिक सीढ़ीनुमा स्तरों या उभरे हुए हिस्सों के लिए प्रयुक्त स्थापत्य शब्द है। ‘चबूतरा’ सामान्य हिन्दी में ऐसे संरचनात्मक स्तर को सहज रूप से व्यक्त करता है।
- source_word: הַתַּחְתּוֹנָה
  choice: निचला
  rationale: यह दो स्तरों में पहले, नीचे स्थित स्तर को बताता है; ‘निचला’ अनावश्यक रूप से ‘सबसे निचला’ अर्थ नहीं जोड़ता।
- source_word: שְׁתַּיִם אַמּוֹת / אַרְבַּע אַמּוֹת
  choice: ऊँचाई दो हाथ / ऊँचाई चार हाथ
  rationale: मूल में केवल माप दिए गए हैं, पर ‘से…तक’ की स्थापत्य रचना ऊर्ध्वाधर दूरी दर्शाती है। हिन्दी में अस्पष्टता से बचने के लिए ‘ऊँचाई’ जोड़ा गया है।
- source_word: וְרֹחַב אַמָּה אֶחָת
  choice: उसकी चौड़ाई एक हाथ
  rationale: רֹחַב चौड़ाई को दर्शाता है। यह अभिव्यक्ति प्राकृतिक हिन्दी में माप को स्पष्ट रखती है।
- source_word: הֳעֲזָרָה הַקְּטַנָּה / הָעֲזָרָה הַגְּדוֹלָה
  choice: छोटा चबूतरा / बड़ा चबूतरा
  rationale: दोनों विशेषण परस्पर सापेक्ष आकार बताते हैं। हिन्दी में ‘छोटे…बड़े’ इस तुलना को स्वाभाविक रूप से व्यक्त करते हैं।
- source_word: וְרֹחַב הָאַמָּה
  choice: उसकी चौड़ाई एक हाथ
  rationale: शाब्दिक रूप ‘और हाथ की चौड़ाई’ है। निश्चित उपपद संभवतः पहले बताए मानक एक हाथ की ओर संकेत करता है; समानांतर पहले खंड के आधार पर इसे ‘एक हाथ’ किया गया है, और इस व्याख्यात्मक निर्णय को पादटिप्पणी में बताया गया है।
