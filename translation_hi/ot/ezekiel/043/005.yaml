base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/043/005.yaml
  text: Then the Spirit lifted me up and brought me into the inner court[a], and behold[b], the glory of Yahweh filled the house.
translation:
  language: hi
  text: तब आत्मा[a] ने मुझे उठाया और भीतरी आँगन में ले आई। और देखो, भवन[b] यहोवा की महिमा से भरा हुआ था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘वायु’ अथवा ‘कोई आत्मा’। इब्रानी शब्द רוּחַ के ये अर्थ भी हो सकते हैं, यद्यपि यहेजकेल के दर्शन के संदर्भ में यहाँ संभवतः परमेश्वर की आत्मा अभिप्रेत है।
    reason: alternative_reading
  - marker: b
    text: या ‘मंदिर’। इब्रानी में शाब्दिक रूप से ‘घर’ है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּשָּׂאֵנִי
  choice: मुझे उठाया
  rationale: נשׂא यहाँ दर्शन में ऊपर उठाकर ले जाने की क्रिया व्यक्त करता है। ‘मुझे उठाया’ गति और यहेजकेल की दर्शनीय यात्रा—दोनों को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: רוּחַ
  choice: आत्मा
  rationale: इस दर्शनीय संदर्भ में רוּחַ का सबसे संभावित आशय परमेश्वर का आत्मा है; फिर भी मूल शब्द में ‘वायु’ या ‘कोई आत्मा’ का अर्थ संभव है, इसलिए अस्पष्टता पादटिप्पणी में सुरक्षित रखी गई है।
- source_word: וַתְּבִיאֵנִי
  choice: मुझे ... ले आया
  rationale: בוא के हिफ़ील रूप का कारक अर्थ ‘ले आना/प्रवेश कराना’ है। ‘ले आया’ गंतव्य ‘भीतरी आँगन’ के साथ सहज और सटीक है।
- source_word: הֶחָצֵר הַפְּנִימִי
  choice: भीतरी आँगन
  rationale: חָצֵר मंदिर-परिसर के आँगन को दर्शाता है। ‘भीतरी आँगन’ आधुनिक हिन्दी में स्पष्ट और स्थापत्य-संदर्भ के अनुकूल है।
- source_word: וְהִנֵּה
  choice: और देखो
  rationale: הִנֵּה अचानक सामने आए महत्त्वपूर्ण दृश्य की ओर ध्यान खींचता है। ‘और देखो’ भविष्यद्वक्ताई सजीवता को आधुनिक, बोधगम्य हिन्दी में रखता है।
- source_word: מָלֵא
  choice: भर दिया था
  rationale: यहाँ क्रिया का भाव यह है कि यहोवा की महिमा ने भवन को पूर्णतः भर दिया। हिन्दी का पूर्णताबोधक रूप दृश्य के परिणामी भाव को स्पष्ट करता है।
- source_word: כְבוֹד יְהוָה
  choice: यहोवा की महिमा
  rationale: כָּבוֹד यहाँ परमेश्वर की प्रकट महिमा या उपस्थिति का बोध कराता है; सम्बन्धवाचक हिन्दी रचना इब्रानी पदबंध को स्वाभाविक ढंग से व्यक्त करती है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: व्यक्तिगत ईश्वरीय नाम को किसी उपाधि से बदलने के बजाय हिन्दी में प्रचलित लिप्यंतरण ‘यहोवा’ के रूप में रखा गया है।
- source_word: הַבָּיִת
  choice: भवन
  rationale: בַּיִת का शाब्दिक अर्थ ‘घर/भवन’ है और यहाँ वह मंदिर के मुख्य भवन को सूचित करता है। ‘भवन’ मूल की अभिव्यक्ति बनाए रखते हुए इस पवित्र स्थापत्य-संदर्भ में स्वाभाविक है।
theological_decisions:
- issue: यहेजकेल के दर्शनीय परिवहन में רוּחַ का अभिप्राय
  choice: परमेश्वर के आत्मा की ओर संकेत करते हुए ‘आत्मा’
  alternative: ‘वायु’ या ‘कोई आत्मा’
  rationale: यहेजकेल के दर्शनों में רוּחַ बार-बार उसे चलाने या उठाने वाले दिव्य कर्ता के रूप में आता है। मुख्य पाठ में संभावित आशय चुना गया है, पर अनिश्चितता को पादटिप्पणी में स्पष्ट रखा गया है।
- issue: ईश्वरीय नाम יְהוָה का रूप
  choice: यहोवा
  alternative: ‘याहवे’ या स्थानापन्न उपाधि ‘प्रभु’
  rationale: मूल पाठ में व्यक्तिवाचक वाचा-नाम है। हिन्दी पाठकों के लिए परिचित प्रत्यक्ष लिप्यंतरण ‘यहोवा’ नाम और उपाधि के भेद को सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘और देखो’ मूल के ध्यानाकर्षक भाव को बनाए रखता है; ‘भवन’ मंदिर-संदर्भ को व्यक्त करता है, जबकि पादटिप्पणी शाब्दिक विकल्प स्पष्ट करती है।
