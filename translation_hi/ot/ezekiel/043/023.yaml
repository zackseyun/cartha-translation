  register: आधुनिक मानक हिन्दी का सरल किंतु गरिमापूर्ण अनुष्ठानिक प्रयोग रखा गया है। आज्ञा को ‘प्रस्तुत करना’ से व्यक्त किया गया है और बलि-संदर्भ स्पष्ट करने के लिए ‘चढ़ाने के लिए’ जोड़ा गया है। सभी पादटिप्पणी चिह्न मुख्य पाठ में अपने संबंधित पद के पास रखे गए हैं।
