base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/043/023.yaml
  text: When you have finished making purification[c][b][a], you shall present a flawless young bull and a flawless ram from the flock.
translation:
  language: hi
  text: जब तुम शुद्ध करने का काम पूरा कर लो[a], तब एक निर्दोष युवा बैल[b] और झुंड में से एक निर्दोष मेढ़ा[c] प्रस्तुत करो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “प्रायश्चित करने का काम पूरा कर लो” अथवा “पाप से शुद्ध करने का काम पूरा कर लो।” इब्रानी क्रिया बलि-विधान के प्रसंग में शुद्ध करने या पाप का दोष दूर करने का भाव रख सकती है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से “एक बैल, गाय-बैलों के झुंड का पुत्र।”
    reason: lexical_alternative
  - marker: c
    text: या “जिसमें कोई दोष न हो।” इब्रानी विशेषण यहाँ बैल और मेढ़े—दोनों पर लागू है।
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּכַלּוֹתְךָ
  choice: जब तुम ... पूरा कर लो
  rationale: בְּ के साथ infinitive construct और द्वितीय पुरुष एकवचन प्रत्यय एक कालवाचक उपवाक्य बनाते हैं। यह हिन्दी प्रयोग कार्य के पूर्ण हो चुकने का भाव स्वाभाविक रूप से व्यक्त करता है।
- source_word: מֵחַטֵּא
  choice: शुद्धीकरण का काम
  rationale: बलि-विधान के प्रसंग में חטא का यह रूप पाप अथवा अशुद्धता दूर करके शुद्ध करने की क्रिया बताता है। ‘शुद्धीकरण’ इस अनुष्ठानिक अर्थ को व्यक्त करता है, जबकि ‘प्रायश्चित’ जैसे अधिक विशिष्ट अर्थ को मुख्य पाठ में अनिवार्य नहीं बनाता।
- source_word: תַּקְרִיב
  choice: चढ़ाने के लिए प्रस्तुत करना
  rationale: קרב का हिफ़ील रूप बलि के प्रसंग में किसी पशु को निकट लाने, प्रस्तुत करने अथवा अर्पित करने का अर्थ देता है। यह अनुवाद प्रस्तुत करने की क्रिया और उसके बलिदानी उद्देश्य—दोनों को स्पष्ट रखता है।
- source_word: פַּר בֶּן בָּקָר
  choice: एक जवान बैल
  rationale: शाब्दिक पदबंध ‘गाय-बैलों का पुत्र, एक बैल’ है और पशु की जाति तथा अपेक्षाकृत कम आयु का संकेत देता है। ‘जवान बैल’ आधुनिक हिन्दी में सहज है।
- source_word: תָּמִים
  choice: दोषरहित
  rationale: बलि-पशु के लिए תָּמִים का आशय शारीरिक दोष या खोट से रहित होना है। ‘दोषरहित’ स्पष्ट, संक्षिप्त और अनुष्ठानिक प्रसंग के अनुकूल है।
- source_word: וְאַיִל
  choice: और ... एक ... मेढ़ा
  rationale: אַיִל का सामान्य अर्थ ‘मेढ़ा’ है; हिन्दी वाक्य में ‘एक’ जोड़ने से पशुओं की सूची स्वाभाविक और स्पष्ट बनती है।
- source_word: מִן הַצֹּאן
  choice: भेड़-बकरियों के झुंड में से
  rationale: צֹאן छोटे पालतू पशुओं—विशेषतः भेड़ों और बकरियों—का सामूहिक शब्द है। केवल ‘झुंड’ की अपेक्षा यह अनुवाद आधुनिक पाठक को उसके दायरे की स्पष्ट जानकारी देता है।
theological_decisions:
- issue: मंदिर-समर्पण के प्रसंग में חטא का अनुष्ठानिक अर्थ
  choice: शुद्धीकरण का काम
  alternative: प्रायश्चित करना; पाप दूर करके शुद्ध करना
  rationale: यह क्रिया इस प्रसंग में पाप अथवा अशुद्धता को अनुष्ठानिक रूप से दूर करने की ओर संकेत करती है। मुख्य पाठ में ‘शुद्धीकरण’ रखने से अर्थ को केवल प्रायश्चित तक सीमित नहीं किया गया; अन्य वास्तविक संभावनाएँ पादटिप्पणी में सुरक्षित हैं।
