  yaml_path: translation/ot/ezekiel/043/004.yaml
  text: And the glory of Yahweh came into the house by way of the gate that faces east[a][b].
translation:
  language: hi
  text: और याहवे की महिमा उस भवन[a] में उस फाटक से होकर आई, जिसका मुख पूर्व की ओर था।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में “भवन” या “घर”; इस दर्शन के प्रसंग में इससे मंदिर का मुख्य भवन अभिप्रेत है।
    reason: lexical_alternative
  - marker: b
    text: 'इसका अनुवाद इस प्रकार भी हो सकता है: “उस फाटक के द्वारा, जो पूर्व की ओर खुलता था।”'
    reason: alternative_reading
lexical_decisions:
- source_word: וּ/כְב֥וֹד
  choice: और … की महिमा
  rationale: כָּבוֹד यहाँ परमेश्वर की प्रकट महिमा और उपस्थिति को दर्शाता है; आरंभिक וּ को प्रसंग से जुड़ाव बनाए रखने के लिए ‘और’ कहा गया है।
- source_word: יְהוָ֖ה
  choice: याहवे
  rationale: मूल पाठ में परमेश्वर का विशिष्ट वाचा-नाम יְהוָה है; उसे उपाधि से बदलने के बजाय हिंदी में लिप्यंतरित किया गया है।
- source_word: בָּ֣א
  choice: आई
  rationale: בוא का मूल अर्थ ‘आना/प्रवेश करना’ है। स्त्रीलिंग संज्ञा ‘महिमा’ के साथ ‘आई’ स्वाभाविक है, और ‘भवन में’ प्रवेश की दिशा स्पष्ट करता है।
- source_word: אֶל הַ/בָּ֑יִת
  choice: उस भवन में
  rationale: בַּיִת का सीधा अर्थ ‘घर/भवन’ है, पर इस दर्शन में यह मंदिर के मुख्य भवन को सूचित करता है। ‘भवन’ मूल रूपक को बचाते हुए हिंदी में वास्तु-संदर्भ के अनुकूल है।
- source_word: דֶּ֣רֶךְ שַׁ֔עַר
  choice: उस फाटक के मार्ग से
  rationale: דֶּרֶךְ मार्ग या रास्ते के द्वारा आने का भाव देता है और שַׁעַר वास्तु-संदर्भ में ‘फाटक’ है। यह रूप इब्रानी संरचना और दिशा-सूचक अर्थ दोनों को बनाए रखता है।
- source_word: אֲשֶׁ֥ר פָּנָ֖י/ו דֶּ֥רֶךְ הַ/קָּדִֽים
  choice: जिसका मुख पूर्व की ओर था
  rationale: פָּנָיו का शाब्दिक भाव ‘उसका मुख/सामना’ है और यहाँ फाटक की दिशा बताता है; आधुनिक हिंदी में यह स्पष्ट और स्वाभाविक है।
theological_decisions:
- issue: परमेश्वर के नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पद में चतुरक्षरीय वाचा-नाम सीधे प्रयुक्त है। ‘याहवे’ उसे उपाधि में बदले बिना सामान्य विद्वत्तापूर्ण उच्चारण के निकट प्रस्तुत करता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। ‘भवन’ के द्वारा इब्रानी בַּיִת की छवि सुरक्षित है, जबकि पादटिप्पणी मंदिर-संदर्भ स्पष्ट करती है। ‘मुख पूर्व की ओर’ मूल इब्रानी मुहावरे को स्वाभाविक हिंदी में बनाए रखता है।
