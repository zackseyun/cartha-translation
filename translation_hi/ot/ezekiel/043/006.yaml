  yaml_path: translation/ot/ezekiel/043/006.yaml
  text: Then I heard one speaking to me from the house[b][a], while a man was standing beside me.
translation:
  language: hi
  text: तब मैंने भवन[b] में से किसी को मुझसे बोलते हुए सुना[a], और एक पुरुष मेरे पास खड़ा था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मैंने भवन में से एक आवाज़ को मुझसे बोलते हुए सुना।” इब्रानी में न तो ‘आवाज़’ संज्ञा स्पष्ट रूप से दी गई है, न इस पद में बोलने वाले की पहचान बताई गई है।
    reason: lexical_alternative
  - marker: b
    text: यहाँ “भवन” से आशय यहेजकेल के दर्शन में मंदिर के भवन से है।
    reason: cultural_note
lexical_decisions:
- source_word: וָאֶשְׁמַע
  choice: तब मैंने ... सुना
  rationale: वय्यिक्तोल रूप कथा को आगे बढ़ाता है; ‘तब’ स्वाभाविक हिन्दी में घटनाक्रम व्यक्त करता है।
- source_word: מִדַּבֵּר
  choice: किसी को ... बोलते
  rationale: इब्रानी में बोलने की क्रिया सुनाई देने का भाव है, पर कर्ता का नाम या ‘आवाज़’ संज्ञा स्पष्ट रूप से नहीं दी गई। हिन्दी वाक्य-रचना के लिए ‘किसी को’ जोड़कर अनिश्चितता बनाए रखी गई है।
- source_word: אֵלַי
  choice: मुझसे
  rationale: אֶל यहाँ वाणी की दिशा नबी की ओर दर्शाता है; हिन्दी में ‘मुझसे बोलते’ स्वाभाविक है।
- source_word: מֵהַבָּיִת
  choice: भवन में से
  rationale: בַּיִת का मूल अर्थ ‘घर/भवन’ है। इस दर्शन में यह मंदिर के मुख्य भवन को दर्शाता है; मुख्य पाठ में अपेक्षाकृत सीधा शब्द रखा गया है और संदर्भ पादटिप्पणी में स्पष्ट किया गया है।
- source_word: וְאִישׁ
  choice: और एक पुरुष
  rationale: אִישׁ अनिश्चित है, इसलिए ‘एक पुरुष’ रखा गया है; संयोजक וְ का सीधा और स्वाभाविक अनुवाद ‘और’ है।
- source_word: הָיָה עֹמֵד
  choice: खड़ा था
  rationale: היה और कृदंत का मेल बीते समय में जारी अवस्था दर्शाता है; ‘खड़ा था’ हिन्दी में वही स्थायी/जारी परिस्थिति व्यक्त करता है।
- source_word: אֶצְלִי
  choice: मेरे पास
  rationale: אֵצֶל निकटता दर्शाता है; ‘मेरे पास’ आधुनिक हिन्दी में स्वाभाविक स्थानवाचक अभिव्यक्ति है।
theological_decisions:
- issue: मंदिर-भवन के भीतर से बोलने वाले की पहचान
  choice: ‘किसी को मुझसे बोलते’ कहकर वक्ता को अनिश्चित रखा गया है।
  alternative: ‘उसे मुझसे बोलते’ या ‘एक आवाज़ को मुझसे बोलते’
  rationale: इस पद के इब्रानी पाठ में वक्ता की पहचान स्पष्ट नहीं की गई और ‘आवाज़’ संज्ञा भी नहीं है। व्यापक प्रसंग दिव्य वक्ता की ओर संकेत कर सकता है, पर मुख्य पाठ उस पहचान को इस पद में आरोपित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल किंतु गरिमापूर्ण शैली रखी गई है। ‘भवन’ मूल ‘घर’ के निकट रहते हुए मंदिर-संदर्भ के अनुकूल है; ‘एक पुरुष’ अनिश्चितता और औपचारिक गरिमा दोनों बनाए रखता है।
