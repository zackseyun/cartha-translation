source:
  edition: WLC
  text: וְ/אִֽם נִכְלְמ֞וּ מִ/כֹּ֣ל אֲשֶׁר עָשׂ֗וּ צוּרַ֣ת הַ/בַּ֡יִת וּ/תְכוּנָת֡/וֹ וּ/מוֹצָאָ֡י/ו וּ/מוֹבָאָ֣י/ו וְֽ/כָל צֽוּרֹתָ֡/ו וְ/אֵ֣ת כָּל חֻקֹּתָי/ו֩ וְ/כָל צורת/י וְ/כָל תורת/ו הוֹדַ֣ע אוֹתָ֔/ם וּ/כְתֹ֖ב לְ/עֵֽינֵי/הֶ֑ם וְ/יִשְׁמְר֞וּ אֶת כָּל צוּרָת֛/וֹ וְ/אֶת כָּל חֻקֹּתָ֖י/ו וְ/עָשׂ֥וּ אוֹתָֽ/ם־־־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/043/011.yaml
  text: And if they are ashamed of all that they have done[a], make known to them the design of the house, its arrangement, its exits, its entrances, all its forms, all its statutes, and all its laws; and write it before their eyes[b], so that they may keep its whole design and all its statutes and do them.
translation:
  language: hi
  text: और यदि वे अपने किए हुए सब कामों पर लज्जित हों, तो उन्हें भवन की रूपरेखा, उसकी संरचना, उसके निकास और प्रवेश, उसके सभी रूप, उसके सभी विधान, उसका पूरा रूप[a] और उसकी सारी शिक्षाएँ[b] बता देना। उसे उनकी आँखों के सामने लिख देना, ताकि वे उसके पूरे रूप और उसके सभी विधानों का पालन करें और उन पर चलें।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: मूल इब्रानी पाठ में ‘रूप’ से संबंधित पद सूची में फिर आता है। पहले पद में बहुवचन ‘सभी रूप’ है, जबकि बाद का पद ‘पूरा रूप’ के अर्थ में एकवचन है; यह पुनरावृत्ति मूल पाठ में ही है।
    reason: textual_or_stylistic_repetition
  - marker: b
    text: ‘शिक्षाएँ’ का अनुवाद ‘निर्देश’ या ‘व्यवस्थाएँ’ भी किया जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: נִכְלְמוּ
  choice: लज्जित हों
  rationale: निफ़अल रूप यहाँ पिछले कर्मों के कारण लज्जा अथवा पश्चात्तापपूर्ण संकोच को व्यक्त करता है; शर्तसूचक वाक्य में ‘लज्जित हों’ स्वाभाविक और स्पष्ट है।
- source_word: צוּרַת הַבַּיִת
  choice: भवन की रूपरेखा
  rationale: मन्दिर-दर्शन के स्थापत्य संदर्भ में צוּרָה आकार, नमूने और योजना—तीनों का बोध कराता है; ‘रूपरेखा’ इस व्यापकता को बनाए रखती है।
- source_word: תְכוּנָתוֹ
  choice: उसकी संरचना
  rationale: यह शब्द भवन की व्यवस्थित बनावट अथवा विन्यास को दर्शाता है; ‘संरचना’ आधुनिक हिन्दी में स्थापत्य अर्थ को सहजता से व्यक्त करती है।
- source_word: מוֹצָאָיו / מוֹבָאָיו
  choice: उसके निकास और प्रवेश
  rationale: स्थापत्य संदर्भ में ये परस्पर संबद्ध शब्द बाहर और भीतर जाने के मार्गों को बताते हैं।
- source_word: כָל צוּרֹתָיו / כָל צורתיו
  choice: उसकी सभी आकृतियाँ / उसकी सभी आकृतियाँ
  rationale: मसोराई पाठ में צורָה-सम्बन्धी पद दोहराया गया है। अंग्रेज़ी परामर्श-पाठ की नवीन संशोधित शैली के विपरीत, मूल पाठ की स्पष्ट पुनरावृत्ति को हिन्दी में बनाए रखा गया है।
- source_word: חֻקֹּתָיו
  choice: उसकी सभी विधियाँ
  rationale: חֻקּוֹת निर्धारित नियमों या विधान को सूचित करता है; ‘विधियाँ’ इसके नियामक बल को बनाए रखता है।
- source_word: תורתיו
  choice: उसके सभी निर्देश
  rationale: תּוֹרָה का मूल अर्थ शिक्षा या निर्देश है। ‘निर्देश’ इसे חֻקּוֹת से अलग रखते हुए इसके प्रामाणिक और व्यावहारिक अर्थ को व्यक्त करता है।
- source_word: הוֹדַע אוֹתָם
  choice: उन्हें ... बता देना
  rationale: हिफ़ईल रूप ‘ज्ञात कराना’ है; ‘बता देना’ आधुनिक हिन्दी में स्वाभाविक है और आदेश का भाव रखता है।
- source_word: וּכְתֹב לְעֵינֵיהֶם
  choice: उसे उनकी आँखों के सामने लिख देना
  rationale: यह मूल की सजीव अभिव्यक्ति और सार्वजनिक रूप से लिखे जाने के भाव को सुरक्षित रखता है।
- source_word: וְיִשְׁמְרוּ ... וְעָשׂוּ אוֹתָם
  choice: पालन करें और उन्हें कार्य में लाएँ
  rationale: यह שׁמר और עשׂה के क्रमशः सावधानी से मानने और व्यवहार में पूरा करने के संयुक्त भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: मन्दिर-वर्णन को शाब्दिक स्थापत्य नक्शा या व्यापक दर्शनीय प्रतिरूप मानना
  choice: स्थापत्य शब्दावली और नियामक शब्दावली दोनों को साथ रखा गया है।
  alternative: सभी पदों को केवल ‘नक्शा’ और ‘नियम’ के रूप में समतल कर देना।
  rationale: मूल पद स्वयं भवन की आकृति और उससे जुड़ी विधियों को साथ रखते हैं; अनुवाद मन्दिर की पूर्ति या प्रतीकात्मकता से जुड़े बड़े व्याख्यात्मक प्रश्न का निर्णय नहीं करता।
- issue: צוּרָה-सम्बन्धी पद की पुनरावृत्ति
  choice: सूची में उपस्थित दोनों समान पदों को अनुवाद में रखा गया है।
  alternative: अंग्रेज़ी संशोधित परामर्श-पाठ की तरह दूसरी आवृत्ति हटा देना।
  rationale: प्रदत्त WLC पाठ में पुनरावृत्ति वास्तविक रूप से उपस्थित है। कठिन या असामान्य शैली को बिना स्पष्ट पाठ-साक्ष्य के हटाना उचित नहीं; इसलिए इसे टिप्पणी सहित सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज शैली रखी गई है। ‘भवन’ संदर्भ में मन्दिर को सूचित करता है, पर मूल के הַבַּיִת का औपचारिक स्थापत्य स्वर बनाए रखता है। सूची की असामान्य पुनरावृत्ति मूल-साक्ष्य के कारण जानबूझकर सुरक्षित है।
