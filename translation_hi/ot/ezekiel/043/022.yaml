source:
  edition: WLC
  text: וּ/בַ/יּוֹם֙ הַ/שֵּׁנִ֔י תַּקְרִ֛יב שְׂעִיר עִזִּ֥ים תָּמִ֖ים לְ/חַטָּ֑את וְ/חִטְּאוּ֙ אֶת הַ/מִּזְבֵּ֔חַ כַּ/אֲשֶׁ֥ר חִטְּא֖וּ בַּ/פָּֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/043/022.yaml
  text: And on the second day you shall present a male goat without blemish for a sin offering[a], and they shall purify the altar just as they purified it with the bull.
translation:
  language: hi
  text: और दूसरे दिन तुम पापबलि[a] के लिए एक दोषरहित बकरा चढ़ाओगे; और वे वेदी को शुद्ध करेंगे, जैसा उन्होंने उसे बैल के द्वारा शुद्ध किया था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘शुद्धिकरण-बलि।’ इब्रानी शब्द חַטָּאת ‘पापबलि’ के साथ-साथ उस बलि को भी सूचित कर सकता है जिसके द्वारा अशुद्धि दूर की जाती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבַיּוֹם הַשֵּׁנִי
  choice: और दूसरे दिन
  rationale: संयोजक ו और कालवाचक ב को रखते हुए यह पिछले निर्देशों से क्रमिक संबंध स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: תַּקְרִיב
  choice: तुम ... चढ़ाना
  rationale: बलिदान-संबंधी प्रसंग में קרב का हिफ़ील रूप किसी पशु को बलि के लिए प्रस्तुत करने का अर्थ देता है; हिन्दी में ‘चढ़ाना’ स्वाभाविक और उपासना-संबंधी अर्थ में स्पष्ट है।
- source_word: שְׂעִיר עִזִּים
  choice: एक ... बकरा
  rationale: यह इब्रानी बलिदानी पदबंध नर बकरी को सूचित करता है; ‘बकरा’ आधुनिक हिन्दी में लिंग को स्पष्ट और सहज रूप से व्यक्त करता है।
- source_word: תָּמִים
  choice: निर्दोष
  rationale: बलिदानी पशु के संदर्भ में תמים का अर्थ शारीरिक दोष या खोट से रहित होना है; ‘निर्दोष’ संक्षिप्त और प्रचलित धार्मिक हिन्दी है।
- source_word: לְחַטָּאת
  choice: पापबलि के लिए
  rationale: यहाँ חטאת किसी बलिदान का नाम है। ‘पापबलि’ परिचित पारिभाषिक रूप है, जबकि उसके शुद्धिकरण-संबंधी अर्थ की वैकल्पिक अभिव्यक्ति पादटिप्पणी में सुरक्षित है।
- source_word: וְחִטְּאוּ אֶת־הַמִּזְבֵּחַ
  choice: और वे वेदी को ... शुद्ध करें
  rationale: वेदी पर लागू חטא का पिअेल रूप नैतिक पाप नहीं, बल्कि अनुष्ठानिक अशुद्धि दूर करने को दर्शाता है; इसलिए ‘शुद्ध करें’ अर्थ-सटीक है।
- source_word: כַּאֲשֶׁר חִטְּאוּ בַּפָּר
  choice: उसी प्रकार ... जैसे उन्होंने बछड़े के द्वारा उसे शुद्ध किया था
  rationale: כַּאֲשֶׁר तुलना व्यक्त करता है और ב यहाँ साधनवाचक है। ‘उसे’ का स्पष्ट प्रयोग वेदी को दोबारा सूचित करता है।
theological_decisions:
- issue: बलिदानी शुद्धिकरण के संदर्भ में חטאת संज्ञा और חטא क्रिया का अनुवाद
  choice: संज्ञा के लिए ‘पापबलि’ और वेदी पर की गई क्रिया के लिए ‘शुद्ध करना’
  alternative: संज्ञा के लिए ‘शुद्धिकरण-बलि’ और क्रिया के लिए ‘शुद्ध करना’
  rationale: इब्रानी में एक ही मूल बलि और उससे होने वाली अनुष्ठानिक शुद्धि को जोड़ता है। हिन्दी में ‘पापबलि’ परिचित बलिदानी पद है, जबकि ‘वेदी को शुद्ध करें’ स्पष्ट करता है कि वेदी को नैतिक पाप से नहीं, अनुष्ठानिक अशुद्धि से मुक्त किया जाता है। पादटिप्पणी वैकल्पिक कार्यात्मक अर्थ को बनाए रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सहज बलिदानी-विधि संबंधी भाषा-रूप अपनाया गया है। ‘तुम ... चढ़ाना’ आज्ञार्थक निर्देश को स्वाभाविक बनाता है; ‘वेदी’, ‘पापबलि’ और ‘शुद्ध करें’ परिचित धार्मिक शब्दावली रखते हुए मूल के अनुष्ठानिक अर्थ को स्पष्ट करते हैं।
