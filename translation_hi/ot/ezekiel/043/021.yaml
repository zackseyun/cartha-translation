base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/043/021.yaml
  text: Then you shall take the bull of the sin offering and burn it in the appointed place of the house[b][a], outside the sanctuary.
translation:
  language: hi
  text: फिर तुम पापबलि का बैल[a] लो और उसे पवित्रस्थान के बाहर मंदिर के निर्धारित स्थान में[b] जला दो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “शुद्धिकरण-बलि का बैल”; अधिक शाब्दिक रूप में, “पाप की बलि का बैल।”
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में, “भवन के निर्धारित स्थान में”; यहाँ “भवन” मंदिर-परिसर को दर्शाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָקַחְתָּ
  choice: फिर तुम ... को लेकर
  rationale: वाव के साथ पूर्ण क्रिया यहाँ अनुष्ठानिक निर्देशों का क्रम आगे बढ़ाती है। ‘फिर’ क्रम को और ‘तुम’ एकवचन सम्बोधन को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: הַפָּר הַחַטָּאת
  choice: पापबलि का बैल
  rationale: पार का सामान्य अर्थ ‘बैल’ है। बलिदानी सन्दर्भ में חַטָּאת पाप से सम्बन्धित बलि को सूचित करता है; ‘पापबलि’ प्रचलित और सामान्य पाठक के लिए स्पष्ट है, जबकि ‘शुद्धिकरण-बलि’ सम्भव वैकल्पिक अर्थ है।
- source_word: וּשְׂרָפוֹ
  choice: उसे जला देना
  rationale: इब्रानी रूप तीसरे पुरुष एकवचन में है, पर पिछले दूसरे पुरुष निर्देश के बीच कर्ता स्पष्ट नहीं किया गया। हिन्दी में क्रियार्थक निर्देश ‘उसे जला देना’ अनुष्ठानिक आदेश को स्वाभाविक ढंग से व्यक्त करता है; व्यक्ति-परिवर्तन की वास्तविकता को टिप्पणी में सुरक्षित रखा गया है।
- source_word: בְּמִפְקַד הַבַּיִת
  choice: मन्दिर-भवन के निर्धारित स्थान में
  rationale: מִפְקָד यहाँ नियुक्त या निर्धारित स्थान को सूचित करता है। הַבַּיִת का शाब्दिक अर्थ ‘भवन/घर’ है, पर इस दर्शन में वह मन्दिर-भवन को दर्शाता है; संयुक्त पद स्रोत की छवि और आधुनिक स्पष्टता दोनों बनाए रखता है।
- source_word: מִחוּץ לַמִּקְדָּשׁ
  choice: पवित्रस्थान के बाहर
  rationale: यह पद पवित्र क्षेत्र या sanctuary के बाहर होने को स्पष्ट करता है। ‘पवित्रस्थान’ गरिमापूर्ण और सामान्य हिन्दी में बोधगम्य है।
theological_decisions:
- issue: बलिदानी पद חַטָּאת का अर्थ
  choice: पापबलि
  alternative: शुद्धिकरण-बलि
  rationale: इस प्रसंग में यह शब्द बैल से जुड़ी बलि का नाम है। ‘पापबलि’ पारम्परिक और पारदर्शी है, जबकि शुद्धिकरण पर बल देने वाला अर्थ भी शब्दार्थ की सम्भव सीमा में है और पादटिप्पणी में रखा गया है।
- issue: וּשְׂרָפוֹ में पुरुष-परिवर्तन
  choice: 'स्वाभाविक हिन्दी निर्देश: ‘उसे जला देना’'
  alternative: ‘और वह उसे जलाए’
  rationale: मूल पाठ दूसरे पुरुष के निर्देश से तीसरे पुरुष एकवचन क्रिया पर जाता है, पर नए कर्ता की पहचान नहीं करता। मुख्य पाठ में अनिर्दिष्ट व्यक्ति को नाम दिए बिना निर्देश का आशय रखा गया है और मूल व्याकरणिक तनाव पादटिप्पणी में बताया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज अनुष्ठानिक शैली रखी गई है। ‘मन्दिर-भवन’ शाब्दिक ‘भवन’ और प्रसंगगत ‘मन्दिर’ के बीच संतुलन बनाता है; ‘पवित्रस्थान’ धार्मिक शब्दावली को अनावश्यक रूप से तकनीकी बनाए बिना cultic भेद बनाए रखता है।
