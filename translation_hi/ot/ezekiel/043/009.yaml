source:
  edition: WLC
  text: עַתָּ֞ה יְרַחֲק֧וּ אֶת זְנוּתָ֛/ם וּ/פִגְרֵ֥י מַלְכֵי/הֶ֖ם מִמֶּ֑/נִּי וְ/שָׁכַנְתִּ֥י בְ/תוֹכָ֖/ם לְ/עוֹלָֽם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/043/009.yaml
  text: Now let them put far from me their prostitution and the corpses of their kings[b][a], and I will dwell in their midst forever.
translation:
  language: hi
  text: अब वे अपनी वेश्यावृत्ति[a] और अपने राजाओं के शवों[b] को मुझसे दूर करें, और मैं सदा उनके बीच निवास करूँगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उनकी वेश्यासदृश बेवफ़ाई।” इब्रानी में वेश्यावृत्ति का रूपक वाचा के प्रति बेवफ़ाई के लिए प्रयुक्त है, जो प्रायः मूर्तिपूजा में प्रकट होती है।
    reason: lexical_alternative
  - marker: b
    text: “अपने राजाओं के शवों” का अर्थ सचमुच राजाओं की मृत देहें हो सकता है; अधिक व्यापक रूप से यह पवित्रस्थान के पास स्थित अपवित्र करने वाली राजकीय कब्रों या स्मारकों की ओर भी संकेत कर सकता है।
    reason: cultural_note
lexical_decisions:
- source_word: עַתָּה
  choice: अब
  rationale: यह समय-सूचक प्रवचन-चिह्न पिछले संदर्भ के उत्तर में अपेक्षित परिवर्तन का परिचय देता है।
- source_word: יְרַחֲקוּ
  choice: दूर करें
  rationale: רחק का हिफ़ील रूप किसी वस्तु को दूर करने का कारणात्मक अर्थ देता है; यहाँ संदर्भ में इच्छार्थक/आज्ञार्थक बल है।
- source_word: זְנוּתָם
  choice: अपने व्यभिचार
  rationale: यह शब्द भविष्यवाणी-साहित्य में वाचा के प्रति विश्वासघात, विशेषकर मूर्तिपूजा, के लिए वेश्यावृत्ति-आधारित रूपक है। आधुनिक हिन्दी में 'व्यभिचार' उस नैतिक और वाचागत रूपक को स्वाभाविक, गरिमापूर्ण ढंग से बनाए रखता है।
- source_word: פִגְרֵי מַלְכֵיהֶם
  choice: अपने राजाओं के शवों
  rationale: פגר का ठोस अर्थ शव या मृत देह है। अनिश्चित ऐतिहासिक संकेत को मुख्य पाठ में समाधानों या स्मारकों के रूप में व्याख्यायित नहीं किया गया।
- source_word: מִמֶּנִּי
  choice: मुझसे
  rationale: यह परमेश्वर की उपस्थिति से अलगाव को व्यक्त करता है और 'दूर करें' के साथ स्वाभाविक हिन्दी बनाता है।
- source_word: וְשָׁכַנְתִּי
  choice: तब मैं ... निवास करूँगा
  rationale: שכן स्थायी उपस्थिति का महत्त्वपूर्ण क्रियापद है। हिन्दी में 'निवास करना' उसका गरिमापूर्ण और स्वाभाविक अनुवाद है; 'तब' पूर्ववर्ती अपेक्षित निष्कासन और परिणाम का संबंध स्पष्ट करता है।
- source_word: בְתוֹכָם
  choice: उनके बीच
  rationale: यह लोगों के मध्य परमेश्वर की स्थानिक और वाचागत उपस्थिति को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: לְעוֹלָם
  choice: सदा
  rationale: पुनर्स्थापना के इस संदर्भ में यह निरंतर और स्थायी अवधि व्यक्त करता है।
theological_decisions:
- issue: זְנוּתָם के भविष्यवाणी-संबंधी रूपक का स्वरूप
  choice: '''व्यभिचार'' द्वारा रूपक को बनाए रखा गया'
  alternative: '''मूर्तिपूजा'' या ''यौन अनैतिकता'''
  rationale: '''मूर्तिपूजा'' अर्थ की व्याख्या कर रूपक मिटा देती, जबकि ''यौन अनैतिकता'' इसे केवल लैंगिक पाप तक सीमित कर सकती थी।'
- issue: יְרַחֲקוּ का विधेय बल
  choice: 'इच्छार्थक/आज्ञार्थक: ''दूर करें'''
  alternative: 'साधारण भविष्य: ''दूर करेंगे'''
  rationale: संदर्भ इसे लोगों से अपेक्षित प्रतिक्रिया के रूप में प्रस्तुत करता है, केवल भविष्यवाणी के रूप में नहीं।
- issue: '''राजाओं के शवों'' का संकेत'
  choice: ठोस अभिव्यक्ति को बिना व्याख्यात्मक विस्तार के रखा गया
  alternative: राजकीय समाधियाँ, स्मारक या मूर्तिपूजक राजकीय अवशेष
  rationale: ऐतिहासिक संकेत विवादित है; मूल इब्रानी ठोस है, इसलिए मुख्य पाठ उसी अस्पष्टता को सुरक्षित रखता है।
- issue: וְ के संबंध का हिन्दी निरूपण
  choice: '''तब'''
  alternative: '''और'''
  rationale: यह अपेक्षित शुद्धीकरण और परमेश्वर के स्थायी निवास के बीच प्रसंगगत परिणाम-संबंध को स्वाभाविक हिन्दी में व्यक्त करता है, बिना शर्त को अधिक कठोर सिद्धान्तगत सूत्र बनाने के।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सार्वजनिक पाठ के योग्य शैली अपनाई गई है। वाक्य सरल रखा गया है, पर भविष्यवाणी-संबंधी रूपक, राजकीय शवों की ठोस छवि और ऐतिहासिक अस्पष्टता सुरक्षित हैं।
