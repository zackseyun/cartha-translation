source:
  edition: WLC
  text: בְּ/תִתָּ֨/ם סִפָּ֜/ם אֶת סִפִּ֗/י וּ/מְזֽוּזָתָ/ם֙ אֵ֣צֶל מְזוּזָתִ֔/י וְ/הַ/קִּ֖יר בֵּינִ֣/י וּ/בֵֽינֵי/הֶ֑ם וְ/טִמְּא֣וּ אֶת שֵׁ֣ם קָדְשִׁ֗/י בְּ/תֽוֹעֲבוֹתָ/ם֙ אֲשֶׁ֣ר עָשׂ֔וּ וָ/אֲכַ֥ל אֹתָ֖/ם בְּ/אַפִּֽ/י־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/043/008.yaml
  text: When they set their threshold beside my threshold and their doorposts beside my doorposts[a], with only the wall between me and them, they defiled my holy name by the abominations that they committed[c][b]; so I consumed them in my anger.
translation:
  language: hi
  text: जब उन्होंने अपनी देहरी मेरी देहरी के पास और अपने द्वार-खंभे मेरे द्वार-खंभों के पास रखे[a], और दीवार मेरे और उनके बीच थी, तब उन्होंने अपने किए हुए घिनौने कामों से मेरे पवित्र नाम को अपवित्र किया; इसलिए मैंने अपने क्रोध में उन्हें निगल लिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘द्वार-खंभों’ के स्थान पर ‘चौखटों’ भी सम्भव है; इब्रानी शब्द द्वार के खड़े पार्श्व-भागों को सूचित करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּתִתָּם
  choice: जब उन्होंने ... रखे
  rationale: בְּ के साथ infinitive construct यहाँ समय-सूचक परिस्थितिजन्य उपवाक्य बनाता है; यह हिन्दी में स्वाभाविक रूप से 'जब उन्होंने ... रखे' है।
- source_word: סִפָּם / סִפִּי
  choice: अपनी देहरी / मेरी देहरी
  rationale: סַף द्वार की देहरी या चौखट के निचले भाग को सूचित कर सकता है; भवन-संदर्भ में 'देहरी' स्पष्ट और प्रचलित है।
- source_word: מְזוּזָתָם / מְזוּזָתִי
  choice: अपने द्वार-खंभे / मेरे द्वार-खंभे
  rationale: מְזוּזָה द्वार के खड़े पार्श्व-स्तंभ को सूचित करता है; 'द्वार-खंभे' वास्तु-चित्र को स्पष्ट रखता है।
- source_word: אֵצֶל
  choice: के पास
  rationale: यह निकट स्थान को व्यक्त करता है; 'के पास' सरल आधुनिक हिन्दी है।
- source_word: וְהַקִּיר בֵּינִי וּבֵינֵיהֶם
  choice: और मेरे और उनके बीच केवल दीवार थी
  rationale: मूल में क्रियारहित उपवाक्य है। 'केवल' इस चित्र को स्पष्ट करता है कि परमेश्वर के पवित्र स्थान और उनके निर्माणों के बीच दीवार ही विभाजन थी।
- source_word: וְטִמְּאוּ אֶת שֵׁם קָדְשִׁי
  choice: उन्होंने ... मेरे पवित्र नाम को अशुद्ध किया
  rationale: טמא के पिएल रूप का अर्थ अपवित्र या अशुद्ध करना है; पवित्रता के संदर्भ में 'अशुद्ध किया' सीधा और बोधगम्य है।
- source_word: בְּתוֹעֲבוֹתָם אֲשֶׁר עָשׂוּ
  choice: अपने किए हुए घिनौने कामों से
  rationale: תּוֹעֵבָה धार्मिक और नैतिक रूप से घृणित आचरण को दर्शाता है; 'घिनौने काम' सामान्य पाठक के लिए स्वाभाविक है और בְּ का साधनार्थक भाव 'से' द्वारा व्यक्त होता है।
- source_word: וָאֲכַל אֹתָם
  choice: इसलिए मैंने ... उन्हें भस्म कर दिया
  rationale: אכל का मूल अर्थ 'खाना' है, पर न्याय के इस प्रसंग में यह रूपकतः पूरी तरह नष्ट या ग्रस लेने को दर्शाता है। 'भस्म कर दिया' उसकी तीव्रता और रूपकात्मक प्रभाव को स्वाभाविक हिन्दी में रखता है।
- source_word: בְּאַפִּי
  choice: अपने क्रोध में
  rationale: אַף यहाँ मुहावरे के रूप में क्रोध को व्यक्त करता है; शारीरिक अर्थ 'नाक' अभिप्रेत नहीं है।
theological_decisions:
- issue: וָאֲכַל אֹתָם में परमेश्वर के न्याय का मानवरूपी रूपक
  choice: '''मैंने ... उन्हें भस्म कर दिया'' के रूप में अर्थानुकूल अनुवाद'
  alternative: '''मैंने उन्हें निगल लिया'' अथवा ''मैंने उन्हें नष्ट कर दिया'''
  rationale: मूल क्रिया न्याय की विनाशकारी पूर्णता को रूपक के द्वारा व्यक्त करती है। चुना हुआ पाठ न तो इसे शाब्दिक खाने की क्रिया बनाता है, न इसकी कठोरता को कम करता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; भाषा सहज पर गरिमापूर्ण रखी गई है। वास्तु-संबंधी समानांतरता और पवित्रता-न्याय का तनाव सुरक्षित रखा गया है।
