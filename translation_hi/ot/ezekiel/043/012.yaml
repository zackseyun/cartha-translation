  rationale: The revision changes the future-oriented 'होगा' to the source-faithful present 'है,' smooths the formal Hindi phrasing, and supplies a footnote for the legitimate ‘boundary/border’ alternative. It retains the draft’s rendering of the house, governing instruction, mountain summit, comprehensive holiness, and emphatic concluding restatement.
