id: EZK.43.12
reference: Ezekiel 43:12
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: זֹ֖את תּוֹרַ֣ת הַ/בָּ֑יִת עַל רֹ֣אשׁ הָ֠/הָר כָּל גְּבֻל֞/וֹ סָבִ֤יב סָבִיב֙ קֹ֣דֶשׁ קָדָשִׁ֔ים הִנֵּה זֹ֖את תּוֹרַ֥ת הַ/בָּֽיִת־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/043/012.yaml
  text: 'This is the law of the house: on the top of the mountain[a], all its surrounding territory is most holy. Behold[b], this is the law of the house.'
translation:
  language: hi
  text: '“भवन की व्यवस्था यह है: पहाड़ की चोटी पर उसके चारों ओर का समस्त क्षेत्र[क] परम पवित्र है। देखो, भवन की व्यवस्था यही है।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: क
    text: या, ‘उसकी सारी सीमा चारों ओर परम पवित्र है।’
    reason: गְּבוּल का अर्थ ‘सीमा’ या ‘सीमाबद्ध क्षेत्र’ हो सकता है; मुख्य पाठ संदर्भानुकूल ‘क्षेत्र’ रखता है।
lexical_decisions:
- source_word: תּוֹרַת הַבָּיִת
  choice: भवन की व्यवस्था
  rationale: תּוֹרָה का अर्थ यहाँ भवन और उसके परिसर के लिए निर्धारित नियम या व्यवस्था है। ‘भवन’ בַּיִת को सीधे रखता है, जबकि संदर्भ से स्पष्ट है कि यह मंदिर का भवन है।
- source_word: עַל רֹאשׁ הָהָר
  choice: पहाड़ की चोटी पर
  rationale: स्थल-वर्णन में רֹאשׁ का स्वाभाविक हिन्दी अर्थ ‘चोटी’ है।
- source_word: כָּל גְּבֻלוֹ סָבִיב סָבִיב
  choice: उसका चारों ओर का पूरा क्षेत्र
  rationale: גְּבוּל सीमा और सीमाबद्ध क्षेत्र दोनों का बोध करा सकता है; यहाँ पूरे पवित्र परिसर का आशय सबसे स्वाभाविक है। दोहराया गया סָבִיב व्यापक रूप से ‘चारों ओर’ होने पर बल देता है।
- source_word: קֹדֶשׁ קָדָשִׁים
  choice: परम पवित्र
  rationale: यह इब्रानी की श्रेष्ठतासूचक रचना है, जिसका अर्थ ‘सबसे/परम पवित्र’ है; यहाँ यह पूरे क्षेत्र की पवित्र स्थिति बताती है, किसी विशेष भीतरी कक्ष का नाम नहीं।
- source_word: הִנֵּה
  choice: देखो
  rationale: यह ध्यान आकर्षित करने वाला कथन-सूचक शब्द है; ‘देखो’ आधुनिक हिन्दी में उसकी शक्ति को स्वाभाविक ढंग से रखता है।
- source_word: זֹאת ... זֹאת
  choice: यह ... यही
  rationale: दोहराव को बनाए रखते हुए अंतिम ‘यही’ सारांशात्मक बल को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: पवित्रता का क्षेत्र
  choice: ‘परम पवित्र’ को पहाड़ पर भवन के चारों ओर के पूरे क्षेत्र से जोड़ा गया है।
  alternative: इसे केवल भवन या भीतरी पवित्रस्थान से जोड़ना।
  rationale: इब्रानी वाक्य-विन्यास में כָּל גְּבֻלוֹ סָבִיב סָבִיב ही קֹדֶשׁ קָדָשִׁים से वर्णित है; इसलिए पवित्रता पूरे सीमाबद्ध परिसर की है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। ‘मंदिर’ की अपेक्षा ‘भवन’ मूल בַּיִת की औपचारिक निकटता बनाए रखता है; ‘व्यवस्था’ यहाँ केवल विधान-संग्रह नहीं, बल्कि परिसर का नियामक सिद्धांत व्यक्त करती है।
