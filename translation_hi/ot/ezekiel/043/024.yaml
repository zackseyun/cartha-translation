source:
  edition: WLC
  text: וְ/הִקְרַבְתָּ֖/ם לִ/פְנֵ֣י יְהוָ֑ה וְ/הִשְׁלִ֨יכוּ הַ/כֹּהֲנִ֤ים עֲלֵי/הֶם֙ מֶ֔לַח וְ/הֶעֱל֥וּ אוֹתָ֛/ם עֹלָ֖ה לַֽ/יהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/043/024.yaml
  text: You shall present them before Yahweh[a], and the priests shall throw salt on them and offer them up as a burnt offering to Yahweh.
translation:
  language: hi
  text: तुम उन्हें याहवे के सामने उपस्थित करोगे, और याजक उन पर नमक फेंकेंगे[a] और उन्हें याहवे के लिए होमबलि के रूप में चढ़ाएँगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उन पर नमक डालेंगे।” इब्रानी क्रिया का शाब्दिक अर्थ “फेंकना” है; वह अधिक विशिष्ट रूप से “छिड़कना” नहीं कहती।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִקְרַבְתָּם
  choice: तुम उन्हें ... उपस्थित करोगे
  rationale: קרב के हिफ़ील रूप का अर्थ ‘निकट लाना/सामने प्रस्तुत करना’ है। ‘उपस्थित करोगे’ बलि चढ़ाने की बाद की क्रिया से इसे अलग रखते हुए स्वाभाविक हिन्दी देता है।
- source_word: לִפְנֵי יְהוָה
  choice: याहवे के सामने
  rationale: לִפְנֵי स्थान और उपस्थिति का संबंध व्यक्त करता है; ‘के सामने’ संक्षिप्त और स्पष्ट है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी परमेश्वर के व्यक्तिगत नाम יהוה का हिन्दी लिप्यंतरण किया गया है, किसी उपाधि से उसका स्थान नहीं लिया गया।
- source_word: וְהִשְׁלִיכוּ
  choice: फेंकेंगे
  rationale: שלך का सामान्य अर्थ ‘फेंकना’ है। यह ‘छिड़कना’ जैसी अधिक विशिष्ट अनुष्ठानिक क्रिया को पाठ में जोड़े बिना मूल क्रिया की शक्ति बनाए रखता है।
- source_word: הַכֹּהֲנִים
  choice: याजक
  rationale: मन्दिर और बलि के प्रसंग में כֹּהֵן का मानक, सहज हिन्दी पर्याय।
- source_word: עֲלֵיהֶם מֶלַח
  choice: उन पर नमक
  rationale: עַל प्रत्यय सहित बलि-पशुओं पर नमक डाले जाने का संकेत देता है; מֶלַח का सीधा अर्थ ‘नमक’ है।
- source_word: וְהֶעֱלוּ אוֹתָם
  choice: उन्हें ... चढ़ाएँगे
  rationale: עלה का हिफ़ील बलिदान-संदर्भ में ‘ऊपर चढ़ाना/अर्पित करना’ बताता है। ‘चढ़ाएँगे’ हिन्दी के बलिदान-संबंधी प्रयोग में स्वाभाविक है।
- source_word: עֹלָה
  choice: होमबलि के रूप में
  rationale: עֹלָה उस बलि का तकनीकी पद है जो पूरी तरह जलाई जाती थी; ‘होमबलि’ हिन्दी बाइबिलीय प्रयोग में इस श्रेणी को संक्षेप में पहचानता है।
- source_word: לַיהוָה
  choice: याहवे के लिए
  rationale: ל समर्पण या लक्ष्य दर्शाता है; ‘के लिए’ बलि के याहवे को समर्पित होने को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: परमेश्वर के नाम יהוה का अनुवाद
  choice: याहवे
  alternative: प्रभु / यहोवा
  rationale: मूल पाठ में व्यक्तिगत वाचा-नाम सीधे आया है। ‘याहवे’ उसका लिप्यंतरण करता है और उसे किसी उपाधि से प्रतिस्थापित नहीं करता।
- issue: नमक लगाने की क्रिया की प्रकृति
  choice: नमक फेंकेंगे
  alternative: नमक डालेंगे / छिड़केंगे
  rationale: मूल क्रिया שלך सामान्यतः ‘फेंकना’ बताती है। अनुष्ठान की सटीक विधि पाठ में स्पष्ट नहीं है, इसलिए ‘छिड़केंगे’ कहकर उसे अधिक विशिष्ट नहीं बनाया गया।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट हिन्दी। ‘उपस्थित करोगे’ और ‘चढ़ाएँगे’ से निकट लाने तथा बलि अर्पित करने की दो अलग इब्रानी क्रियाएँ अलग रखी गई हैं।
