id: EZK.43.27
reference: Ezekiel 43:27
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וִֽ/יכַלּ֖וּ אֶת הַ/יָּמִ֑ים וְ/הָיָה֩ בַ/יּ֨וֹם הַ/שְּׁמִינִ֜י וָ/הָ֗לְאָה יַעֲשׂ֨וּ הַ/כֹּהֲנִ֤ים עַל הַ/מִּזְבֵּ֨חַ֙ אֶת עוֹלֽוֹתֵי/כֶם֙ וְ/אֶת שַׁלְמֵי/כֶ֔ם וְ/רָצִ֣אתִי אֶתְ/כֶ֔ם נְאֻ֖ם אֲדֹנָ֥/י יְהֹוִֽה־ס־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/043/027.yaml
  text: When the days are completed[a], then from the eighth day onward the priests shall offer on the altar your burnt offerings and your peace offerings, and I will accept you, declares the Lord GOD.
translation:
  language: hi
  text: जब वे दिन पूरे हो जाएँगे, तब आठवें दिन से आगे याजक वेदी पर तुम्हारी होमबलियाँ और मेलबलियाँ[a] चढ़ाएँगे। तब मैं तुम्हें स्वीकार करूँगा—यह प्रभु याहवे की घोषणा है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “संगति-बलियाँ।”
    reason: שְׁלָמִים के लिए एक मान्य वैकल्पिक अनुवाद, जो बलि से जुड़ी सहभागिता पर बल देता है।
lexical_decisions:
- source_word: וִיכַלּוּ אֶת־הַיָּמִים
  choice: जब वे दिन पूरे हो जाएँगे
  rationale: यह वाक्यांश पिछले पदों में निर्धारित वेदी-अभिषेक की अवधि पूरी होने को बताता है। हिन्दी में ‘दिन पूरे होना’ स्वाभाविक है और इब्रानी के अनुष्ठानिक क्रम को बनाए रखता है।
- source_word: בַיּוֹם הַשְּׁמִינִי וָהָלְאָה
  choice: आठवें दिन से आगे
  rationale: यह आठवें दिन से आरम्भ होने और उसके बाद निरन्तर चलते रहने—दोनों भावों को व्यक्त करता है।
- source_word: יַעֲשׂוּ ... עַל־הַמִּזְבֵּחַ
  choice: वेदी पर ... चढ़ाएँगे
  rationale: क्रिया का मूल अर्थ ‘करना/बनाना’ है, पर बलिदान और वेदी के प्रसंग में हिन्दी की स्वाभाविक अनुष्ठानिक अभिव्यक्ति ‘चढ़ाना’ है।
- source_word: עוֹלֹתֵיכֶם
  choice: तुम्हारे होमबलि
  rationale: עוֹלָה उस बलि को दर्शाता है जो वेदी पर पूर्णतः जलाई जाती थी; ‘होमबलि’ हिन्दी बाइबलीय प्रयोग में प्रचलित और सटीक है।
- source_word: שַׁלְמֵיכֶם
  choice: तुम्हारी मेलबलियाँ
  rationale: שְׁלָמִים के शांति, कुशल और सहभागिता से जुड़े अर्थ-क्षेत्र को ‘मेलबलि’ संक्षेप और परिचित ढंग से व्यक्त करता है; ‘संगति-बलियाँ’ को पादटिप्पणी में रखा गया है।
- source_word: וְרָצִאתִי אֶתְכֶם
  choice: तब मैं तुम्हें स्वीकार करूँगा
  rationale: इब्रानी में प्रत्यक्ष कर्म लोग स्वयं हैं, केवल उनकी भेंटें नहीं। इसलिए अनुवाद लोगों की परमेश्वर द्वारा स्वीकृति को स्पष्ट रखता है।
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: यह प्रभु याहवे की घोषणा है
  rationale: נְאֻם भविष्यद्वाणी की औपचारिक घोषणा-सूक्ति है। אֲדֹנָי को ‘प्रभु’ और परमेश्वर के निज नाम יהוה को ‘याहवे’ रूप में रखा गया है।
theological_decisions:
- issue: וְרָצִאתִי אֶתְכֶם में स्वीकृति का कर्म
  choice: मैं तुम्हें स्वीकार करूँगा
  alternative: मैं तुम्हारी भेंटों को स्वीकार करूँगा
  rationale: मूल पाठ में ‘तुम्हें’ प्रत्यक्ष कर्म है। उसे ‘भेंटों’ में बदलना पाठ के संबंधपरक और वाचागत तनाव को अनावश्यक रूप से सीमित कर देता।
- issue: אֲדֹנָי יְהוִה में परमेश्वर के नाम का रूप
  choice: प्रभु याहवे
  alternative: प्रभु परमेश्वर
  rationale: यह रूप אֲדֹנָי की उपाधि और יהוה के प्रकट किए गए निज नाम के बीच भेद को सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘याजक’, ‘वेदी’, ‘होमबलि’ और ‘मेलबलि’ जैसे परिचित बाइबलीय अनुष्ठानिक शब्द बनाए गए हैं। पादटिप्पणी का चिह्न संबंधित शब्द ‘मेलबलियाँ’ के तुरंत बाद रखा गया है।
