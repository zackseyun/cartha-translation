source:
  edition: WLC
  text: וְ/לָקַחְתָּ֣ מִ/דָּמ֗/וֹ וְ/נָ֨תַתָּ֜ה עַל אַרְבַּ֤ע קַרְנֹתָי/ו֙ וְ/אֶל אַרְבַּע֙ פִּנּ֣וֹת הָ/עֲזָרָ֔ה וְ/אֶֽל הַ/גְּב֖וּל סָבִ֑יב וְ/חִטֵּאתָ֥ אוֹת֖/וֹ וְ/כִפַּרְתָּֽ/הוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/043/020.yaml
  text: And you shall take some of its blood and put it on its four horns[a], on the four corners of the ledge, and on the border all around; so you shall purify it and make atonement for it.
translation:
  language: hi
  text: तू उसके लहू में से कुछ लेकर उसके चारों सींगों पर, चबूतरे[a] के चारों कोनों पर और चारों ओर की सीमा पर लगाना। इस प्रकार तू उसे शुद्ध करना और उसके लिए प्रायश्चित करना।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “चौड़ा पट्टा।” यहाँ प्रयुक्त इब्रानी शब्द यहेजकेल के दर्शन में वेदी के चारों ओर बने संरचनात्मक चबूतरे या चौड़े पट्टे को सूचित करता है।
    reason: शब्द का सटीक स्थापत्य रूप अनिश्चित है; इसलिए मुख्य अर्थ के साथ एक स्वाभाविक वैकल्पिक शब्द दिया गया है।
lexical_decisions:
- source_word: מִדָּמוֹ
  choice: उसके लहू में से कुछ
  rationale: यहाँ מִן अंशसूचक है; इसलिए यह अभिव्यक्ति लहू के एक भाग को लेने का अर्थ स्वाभाविक हिन्दी में स्पष्ट करती है।
- source_word: קַרְנֹתָיו
  choice: उसकी चारों सींगों
  rationale: वेदी के प्रसंग में קֶרֶן उसके कोनों पर निकले सींग-जैसे भागों के लिए प्रचलित धार्मिक-स्थापत्य शब्द है।
- source_word: פִּנּוֹת הָעֲזָרָה
  choice: चबूतरे के चारों कोनों
  rationale: פִּנּוֹת का अर्थ कोने है और इस दर्शन में עֲזָרָה वेदी के चारों ओर बने संरचनात्मक चबूतरे या पट्टे को सूचित करता है।
- source_word: הַגְּבוּל סָבִיב
  choice: चारों ओर की सीमा
  rationale: גְּבוּל संरचना की सीमा या किनारा और סָבִיב उसके चारों ओर होने का भाव व्यक्त करता है।
- source_word: וְחִטֵּאתָ אֹתוֹ
  choice: इस प्रकार तू उसे शुद्ध करना
  rationale: חטא का पिएल रूप यहाँ पाप कराने का नहीं, बल्कि बलिदान-विधि द्वारा अशुद्धि दूर करने का अर्थ रखता है।
- source_word: וְכִפַּרְתָּהוּ
  choice: उसके लिए प्रायश्चित करना
  rationale: כפר याजकीय अनुष्ठान की भाषा में प्रायश्चित करने को सूचित करता है; यह अनुवाद किसी एक विशिष्ट प्रायश्चित-सिद्धांत को आरोपित किए बिना उसका धार्मिक अर्थ बनाए रखता है।
theological_decisions:
- issue: חטא (पिएल) और כפר के दो अलग अनुष्ठानिक क्रियार्थों को सुरक्षित रखना
  choice: उसे शुद्ध करना और उसके लिए प्रायश्चित करना
  alternative: उसे पवित्र करके उसका दोष दूर करना
  rationale: इब्रानी पाठ दो निकट-संबंधित किंतु भिन्न क्रियाएँ रखता है। अलग हिन्दी क्रियाओं से शुद्धीकरण और प्रायश्चित दोनों का क्रम तथा धार्मिक तनाव बना रहता है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध हिन्दी। परमेश्वर द्वारा एक व्यक्ति को दिए जा रहे निर्देश के अनुरूप एकवचन ‘तू’ और निर्देशात्मक ‘लगाना/करना’ रखा गया है। ‘लहू’, ‘सींग’ और ‘प्रायश्चित’ बाइबलीय-धार्मिक संदर्भ के परिचित शब्द हैं।
