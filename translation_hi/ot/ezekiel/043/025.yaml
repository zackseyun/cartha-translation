  text: שִׁבְעַ֣ת יָמִ֔ים תַּעֲשֶׂ֥ה שְׂעִיר חַטָּ֖את לַ/יּ֑וֹם וּ/פַ֧ר בֶּן בָּקָ֛ר וְ/אַ֥יִל מִן הַ/צֹּ֖אן תְּמִימִ֥ים יַעֲשֽׂוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/043/025.yaml
  text: For seven days you shall offer a goat as a sin offering each day[a], and they shall offer a bull, a son of the herd, and a ram from the flock[b], without blemish.
translation:
  language: hi
  text: सात दिन तक तुम प्रतिदिन पापबलि के लिए एक बकरा चढ़ाओगे। और वे एक जवान बैल[a] और झुंड में से एक मेढ़ा चढ़ाएँगे[b]; वे दोनों दोषरहित हों।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से, ‘एक बैल, गाय-बैलों का पुत्र’ है। यह बलिदानों के संदर्भ में प्रयुक्त एक रूढ़ अभिव्यक्ति है; इसका अर्थ ‘एक जवान बैल’ है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में कर्ता दूसरे पुरुष एकवचन (‘तुम चढ़ाओगे’) से बदलकर तीसरे पुरुष बहुवचन (‘वे चढ़ाएँगे’) हो जाता है। मुख्य पाठ में इस परिवर्तन को बनाए रखा गया है।
    reason: alternative_reading
lexical_decisions:
- source_word: שִׁבְעַת יָמִים
  choice: सात दिन तक
  rationale: यह पदबंध अवधि बताता है; ‘तक’ आधुनिक हिन्दी में सात दिनों की पूरी अवधि को स्वाभाविक रूप से व्यक्त करता है।
- source_word: תַּעֲשֶׂה / יַעֲשׂוּ
  choice: तुम ... चढ़ाना / वे ... चढ़ाएँगे
  rationale: यद्यपि मूल क्रिया का सामान्य अर्थ ‘करना/बनाना’ है, बलिदान के प्रसंग में इसका अर्थ बलि चढ़ाना है। दोनों क्रियारूपों के भिन्न कर्ताओं को भी सुरक्षित रखा गया है।
- source_word: שְׂעִיר חַטָּאת
  choice: पापबलि के रूप में एक बकरा
  rationale: שְׂעִיר नर बकरे को और חַטָּאת यहाँ किसी अमूर्त ‘पाप’ को नहीं, बल्कि पापबलि को दर्शाता है। साधारण हिन्दी में ‘बकरा’ से नर होना स्पष्ट है।
- source_word: לַיּוֹם
  choice: प्रतिदिन
  rationale: यह सातों दिनों में हर दिन बलि की पुनरावृत्ति व्यक्त करता है।
- source_word: פַר בֶּן בָּקָר
  choice: गाय-बैलों में से एक बछड़ा
  rationale: यह एक प्रचलित बलिदानी अभिव्यक्ति है। मुख्य पाठ में स्वाभाविक हिन्दी रखी गई है और अधिक शाब्दिक रूप पादटिप्पणी में दिया गया है।
- source_word: אַיִל מִן הַצֹּאן
  choice: भेड़-बकरियों के झुंड में से एक मेढ़ा
  rationale: אַיִל का अर्थ ‘मेढ़ा’ है और צֹאן छोटे पालतू पशुओं, विशेषतः भेड़-बकरियों, के सामूहिक झुंड को दर्शाता है।
- source_word: תְּמִימִים
  choice: दोनों निर्दोष हों
  rationale: बलिदानी प्रसंग में यह दोनों पशुओं के शारीरिक दोष से रहित होने को दर्शाता है; ‘निर्दोष’ संक्षिप्त और प्रचलित धार्मिक हिन्दी है।
theological_decisions:
- issue: बलिदान संबंधी निर्देश के बीच व्याकरणिक कर्ता का परिवर्तन
  choice: दूसरे पुरुष एकवचन ‘तुम ... चढ़ाना’ से तीसरे पुरुष बहुवचन ‘वे ... चढ़ाएँगे’ का परिवर्तन मुख्य पाठ में सुरक्षित रखा गया है।
  alternative: दोनों उपवाक्यों में एक ही कर्ता मानकर या तो ‘तुम’ या ‘वे’ कर देना।
  rationale: इब्रानी पाठ में תַּעֲשֶׂה और יַעֲשׂוּ स्पष्ट रूप से अलग पुरुष और वचन में हैं। संभव है कि संबोधन किसी एक व्यक्ति से हो जबकि अनुष्ठान के कुछ कार्य याजक करें, पर पाठ स्वयं इसे स्पष्ट नहीं करता; इसलिए इस तनाव को मिटाया नहीं गया।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। बलिदानी शब्दावली में ‘पापबलि’, ‘चढ़ाना’ और ‘निर्दोष’ जैसे व्यापक रूप से समझे जाने वाले पद चुने गए हैं। ‘צֹאן’ के व्यापक सामूहिक अर्थ के कारण ‘भेड़-बकरियों का झुंड’ रखा गया है।
