  text: וְ/אֵ֨לֶּה מִדּ֤וֹת הַ/מִּזְבֵּ֨חַ֙ בָּֽ/אַמּ֔וֹת אַמָּ֥ה אַמָּ֖ה וָ/טֹ֑פַח וְ/חֵ֨יק הָ/אַמָּ֜ה וְ/אַמָּה רֹ֗חַב וּ/גְבוּלָ֨/הּ אֶל שְׂפָתָ֤/הּ סָבִיב֙ זֶ֣רֶת הָ/אֶחָ֔ד וְ/זֶ֖ה גַּ֥ב הַ/מִּזְבֵּֽחַ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/043/013.yaml
  text: 'And these are the measurements of the altar in cubits (the cubit being a cubit and a handbreadth): its gutter shall be one cubit[a], and one cubit its width, and its border on its rim all around shall be one span[c][b]. And this shall be the base of the altar.'
translation:
  language: hi
  text: 'वेदी की मापें इस हाथ की माप के अनुसार ये हैं—हर हाथ सामान्य हाथ और एक हथेली के बराबर है[a]: उसकी नाली[b] एक हाथ की होगी और उसकी चौड़ाई एक हाथ होगी; उसके किनारे पर चारों ओर की मेड़ एक बालिश्त की होगी। और यह वेदी का आधार[c] होगा।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक रूप से: “हाथ—एक हाथ और एक हथेली”; अर्थात इन मापों में सामान्य से एक हथेली लंबा हाथ प्रयुक्त है।'
    reason: cultural_note
  - marker: b
    text: इब्रानी शब्द חֵיק का ठीक स्थापत्य अर्थ अनिश्चित है; इसके अर्थ ‘खाई’, ‘निचला भाग’ या ‘आधार’ भी हो सकते हैं।
    reason: lexical_alternative
  - marker: c
    text: इब्रानी शब्द גַּב के अर्थ यहाँ ‘ऊँचाई’, ‘पिछला भाग’ या वेदी का ‘उठा हुआ ढाँचा’ भी हो सकते हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: מִדּוֹת
  choice: मापें
  rationale: यह शब्द वेदी के नाप और आकार-संबंधी विनिर्देशों को दर्शाता है; ‘मापें’ आधुनिक हिन्दी में स्वाभाविक और स्पष्ट है।
- source_word: בָּאַמּוֹת אַמָּה אַמָּה וָטֹפַח
  choice: हाथों में… हर हाथ सामान्य हाथ से एक हथेली अधिक है
  rationale: इब्रानी वाक्यांश यहाँ प्रयुक्त लंबे हाथ को स्पष्ट करता है, जो सामान्य हाथ और एक हथेली के बराबर था। व्याख्यात्मक उपवाक्य मूल की माप-इकाई को सहज हिन्दी में रखता है।
- source_word: חֵיק
  choice: नाली
  rationale: इस दुर्लभ स्थापत्य शब्द को वेदी के निचले, धँसे हुए या नाली-जैसे भाग के रूप में समझा जा सकता है। ठीक संरचना अनिश्चित होने के कारण विकल्प पादटिप्पणी में दिए गए हैं।
- source_word: רֹחַב
  choice: चौड़ाई
  rationale: निर्माण और माप के प्रसंग में यह मानक आयामी अर्थ है।
- source_word: גְּבוּלָהּ
  choice: मेड़
  rationale: यह चारों ओर बनी सीमारेखा, उठी हुई पट्टी या घेरा दर्शाता है; ‘मेड़’ नाली के किनारे बने घेरे का ठोस बोध कराती है।
- source_word: שְׂפָתָהּ
  choice: किनारा
  rationale: शाब्दिक अर्थ ‘होंठ’ है, पर स्थापत्य वर्णन में ‘किनारा’ सहज हिन्दी है।
- source_word: זֶרֶת
  choice: बालिश्त
  rationale: यह फैले हुए हाथ से मापी जाने वाली छोटी प्राचीन इकाई है; हिन्दी में उसका पारंपरिक और संक्षिप्त नाम ‘बालिश्त’ है।
- source_word: גַּב
  choice: आधार
  rationale: इस प्रसंग में यह वेदी के निचले उठे हुए ढाँचे या आधार को सूचित कर सकता है। शब्द का सटीक स्थापत्य अर्थ अनिश्चित है, इसलिए अन्य संभावनाएँ पादटिप्पणी में सुरक्षित हैं।
- source_word: הַמִּזְבֵּחַ
  choice: वेदी
  rationale: बलिदान चढ़ाने की संरचना के लिए यह मानक और सर्वमान्य हिन्दी शब्द है।
theological_decisions:
- issue: मन्दिर और वेदी से जुड़े दुर्लभ स्थापत्य शब्दों के सटीक अभिप्राय की अनिश्चितता
  choice: मुख्य पाठ में स्पष्ट किन्तु संयमित स्थापत्य शब्द—‘नाली’ और ‘आधार’—रखे गए हैं।
  alternative: חֵיק को ‘खाई’ या ‘निचला भाग’ और גַּב को ‘ऊँचाई’, ‘पिछला भाग’ या ‘उठा हुआ ढाँचा’ समझा जा सकता है।
  rationale: पद का उद्देश्य तकनीकी माप देना है, पर दुर्लभ इब्रानी शब्द वेदी की ठीक बनावट को निश्चित नहीं करते। अतः मुख्य पाठ को पठनीय रखा गया है और वास्तविक भाषिक अनिश्चितता पादटिप्पणियों में प्रकट की गई है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, गरिमापूर्ण किन्तु साधारण पाठक के लिए सुबोध रखी गई है। प्राचीन इकाइयों के लिए ‘हाथ’, ‘हथेली’ और ‘बालिश्त’ प्रयुक्त हुए हैं। मूल के संज्ञात्मक स्थापत्य वर्णन को हिन्दी में स्पष्ट करने के लिए सीमित रूप से ‘होगी/होगा’ जोड़ा गया है; किसी विशिष्ट पुनर्निर्माण को निश्चित नहीं माना गया।
