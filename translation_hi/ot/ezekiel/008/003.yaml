base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/008/003.yaml
  text: Then he stretched out what looked like a hand and took me by a lock of my head[a], and the Spirit lifted me up between the earth and the heavens and brought me to Jerusalem in visions of God, to the entrance of the inner gate that faces north[b], where the seat of the image of jealousy that provokes jealousy was.
translation:
  language: hi
  text: तब उसने हाथ जैसी एक आकृति बढ़ाई और मेरे सिर के बालों की एक लट से मुझे पकड़ लिया। फिर आत्मा[a] ने मुझे पृथ्वी और आकाश के बीच उठा लिया और परमेश्वर के दर्शनों में मुझे यरूशलेम ले गई—भीतरी फाटक के उस प्रवेश-द्वार पर, जिसका मुख उत्तर की ओर था। वहीं ईर्ष्या की उस प्रतिमा का स्थान था, जो ईर्ष्या भड़काती है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “हवा” अथवा “कोई आत्मा।”
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּבְנִית יָד
  choice: हाथ जैसी आकृति
  rationale: תַּבְנִית रूप, नमूना या समानता को सूचित करता है; यह अनुवाद दर्शनीय समानता बनाए रखता है और उसे अनिवार्यतः वास्तविक हाथ नहीं ठहराता।
- source_word: בְּצִיצִת רֹאשִׁי
  choice: मेरे सिर के बालों की एक लट से
  rationale: צִיצִת यहाँ बालों की लट या गुच्छे का बोध कराता है; आधुनिक हिन्दी में यह स्वाभाविक और ठोस चित्र है।
- source_word: רוּחַ
  choice: आत्मा
  rationale: यहेजकेल के दर्शनीय स्थानांतरण के प्रसंग में दिव्य आत्मा अभिप्रेत होने की प्रबल संभावना है, पर मूल शब्द में हवा अथवा किसी आत्मा का अर्थ भी संभव है; इसे पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: בֵּין הָאָרֶץ וּבֵין הַשָּׁמַיִם
  choice: पृथ्वी और आकाश के बीच
  rationale: हिन्दी में 'आकाश' स्वाभाविक रूप से इब्रानी שָׁמַיִם का अर्थ देता है और दर्शनीय ऊँचाई का भाव बनाए रखता है।
- source_word: בְּמַרְאוֹת אֱלֹהִים
  choice: परमेश्वर के दर्शनों में
  rationale: बहुवचन 'दर्शनों' मूल रूप को सुरक्षित रखता है और 'परमेश्वर के' को स्रोत अथवा दिव्य गुण—दोनों अर्थों के लिए खुला छोड़ता है।
- source_word: פֶּתַח שַׁעַר הַפְּנִימִית
  choice: भीतरी फाटक के उस प्रवेश-द्वार पर
  rationale: פֶּתַח और שַׁעַר के प्रवेश तथा फाटक—दोनों घटकों को स्पष्ट रखते हुए हिन्दी वाक्य को स्वाभाविक बनाया गया है।
- source_word: הַפּוֹנֶה צָפוֹנָה
  choice: जिसका मुख उत्तर की ओर था
  rationale: दिशा की ओर उन्मुख होने का भाव आधुनिक हिन्दी में सहज ढंग से व्यक्त होता है।
- source_word: מוֹשַׁב
  choice: स्थान
  rationale: מוֹשַׁב यहाँ प्रतिमा के स्थापित होने की जगह बताता है; 'स्थान' हिन्दी में 'आसन' की संभावित राजकीय धारणा से बचते हुए अर्थ स्पष्ट करता है।
- source_word: סֵמֶל
  choice: प्रतिमा
  rationale: סֵמֶל किसी मूर्ति, प्रतिरूप या उपासना-प्रतिमा को सूचित करता है; 'प्रतिमा' मूल की अपेक्षाकृत औपचारिकता और तटस्थता बनाए रखती है।
- source_word: הַקִּנְאָה הַמַּקְנֶה
  choice: ईर्ष्या जगाने वाली ... जो ईर्ष्या भड़काती है
  rationale: संज्ञा और कारक कृदंत में उपस्थित קנא की पुनरावृत्ति को हिन्दी में 'ईर्ष्या' दोहराकर यथासंभव सुरक्षित रखा गया है।
theological_decisions:
- issue: दर्शनीय स्थानांतरण में רוּחַ का अर्थ हवा, कोई आत्मा, या दिव्य आत्मा
  choice: आत्मा
  alternative: हवा; कोई आत्मा
  rationale: अलौकिक स्थानांतरण और यहेजकेल की व्यापक शब्दावली दिव्य आत्मा की ओर संकेत करती है, किंतु इब्रानी की वास्तविक बहुअर्थकता पादटिप्पणी में रखी गई है।
- issue: קִנְאָה को ईर्ष्या या जलन/जोश के रूप में समझना
  choice: ईर्ष्या
  alternative: जलन; प्रबल लगाव/जोश
  rationale: यहाँ प्रतिमा द्वारा परमेश्वर की वाचा-संबंधी ईर्ष्या भड़काने का संकेत है। 'ईर्ष्या' मूल शब्द-खेल को स्पष्ट रखती है, बिना उसे किसी विशिष्ट सांप्रदायिक व्याख्या में बाँधे।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। दर्शनीय प्रसंग की गंभीरता के लिए 'परमेश्वर के दर्शनों' और 'प्रतिमा' जैसे औपचारिक पद रखे गए हैं; רוּחַ की अस्पष्टता पादटिप्पणी में संरक्षित है।
