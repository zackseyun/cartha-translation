  text: וַ/יֹּ֣אמֶר אֵלַ/י֮ הֲ/רָאִ֣יתָ בֶן אָדָם֒ הֲ/נָקֵל֙ לְ/בֵ֣ית יְהוּדָ֔ה מֵ/עֲשׂ֕וֹת אֶת הַ/תּוֹעֵב֖וֹת אֲשֶׁ֣ר עָֽשׂוּ פֹ֑ה כִּֽי מָלְא֨וּ אֶת הָ/אָ֜רֶץ חָמָ֗ס וַ/יָּשֻׁ֨בוּ֙ לְ/הַכְעִיסֵ֔/נִי וְ/הִנָּ֛/ם שֹׁלְחִ֥ים אֶת הַ/זְּמוֹרָ֖ה אֶל אַפָּֽ/ם־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/008/017.yaml
  text: Then he said to me[a], “Have you seen, son of man? Is it too trivial a thing for the house of Judah to do the abominations that they have done here, that they should also fill the land with violence and turn again to provoke me? And behold[b], they are putting the branch to their nose.”
translation:
  language: hi
  text: तब उसने मुझसे कहा, “हे मनुष्य के पुत्र, क्या तूने देखा? क्या यहूदा के घराने के लिए यहाँ किए गए इन घिनौने कामों को करना कोई छोटी बात है, कि वे देश को हिंसा से भर दें और फिर मुझे क्रोधित करें? और देख, वे उस डाल को अपनी नाक तक बढ़ा रहे हैं।[a][b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: कुछ प्राचीन साक्षियों के अनुसार, “वे उस डाल को मेरी नाक तक बढ़ा रहे हैं।” इब्रानी पाठ में “अपनी नाक” है।
    reason: textual_variant
  - marker: b
    text: “डाल को अपनी नाक तक बढ़ाना” वाक्यांश अस्पष्ट है; संभव है कि यह मूर्तिपूजा के किसी अनुष्ठानिक संकेत की ओर इशारा करता हो।
    reason: cultural_note
lexical_decisions:
- source_word: הֲרָאִיתָ
  choice: क्या तूने देखा?
  rationale: प्रश्नवाचक הֲ सहित पूर्ण क्रिया उस दर्शन की ओर संकेत करती है जो यहेजकेल को अभी दिखाया गया है; एकवचन संबोधन को ‘तू’ से रखा गया है।
- source_word: בֶן אָדָם
  choice: हे मनुष्य के पुत्र
  rationale: यहेजकेल में बार-बार आने वाले इस नबी-संबोधन की शाब्दिक और साहित्यिक पहचान बनाए रखता है।
- source_word: הֲנָקֵל
  choice: क्या ... कोई छोटी बात है
  rationale: קל की ‘हल्का/तुच्छ’ अर्थछाया और प्रश्न की व्यंग्यात्मक शक्ति को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: לְבֵית יְהוּדָה
  choice: यहूदा के घराने के लिए
  rationale: सामूहिक वाचा-संबंधी अभिव्यक्ति को केवल ‘यहूदा’ या ‘यहूदा के लोग’ बनाकर सपाट नहीं करता।
- source_word: הַתּוֹעֵבוֹת
  choice: घिनौने कामों
  rationale: मूर्तिपूजा और नैतिक घृणितता के प्रबल भाव को सामान्य आधुनिक हिन्दी में व्यक्त करता है।
- source_word: מָלְאוּ אֶת הָאָרֶץ חָמָס
  choice: देश को हिंसा से भर दें
  rationale: חָמָס के हिंसा, अन्यायपूर्ण उत्पीड़न और दुष्टता के अर्थक्षेत्र में यहाँ ‘हिंसा’ सीधा और प्रसंगानुकूल है।
- source_word: וַיָּשֻׁבוּ לְהַכְעִיסֵנִי
  choice: फिर मुझे क्रोधित करें
  rationale: שוב पुनरावृत्ति और הכעיס परमेश्वर को क्रोध दिलाने वाले आचरण को व्यक्त करते हैं।
- source_word: וְהִנָּם
  choice: और देख
  rationale: ध्यान खींचने वाले संकेत को आधुनिक, गरिमापूर्ण और सहज हिन्दी में रखता है।
- source_word: שֹׁלְחִים אֶת הַזְּמוֹרָה
  choice: उस डाल को ... ले जा रहे हैं
  rationale: शाब्दिक ‘भेजना/बढ़ाना’ और अस्पष्ट अनुष्ठानिक संकेत के बीच, शारीरिक गति को बिना अनावश्यक व्याख्या के व्यक्त करता है।
- source_word: אֶל אַפָּם
  choice: अपनी नाक के पास
  rationale: मसोरेटिक पाठ के तृतीय पुरुष बहुवचन प्रत्यय ‘उनकी नाक’ को हिन्दी में कर्ता-सापेक्ष ‘अपनी नाक’ से स्पष्ट रखा गया है; אֶל के लिए ‘के पास’ लक्ष्य/निकटता को दर्शाता है।
theological_decisions:
- issue: पद के अंत का अस्पष्ट संकेत और सर्वनाम-पाठ
  choice: मुख्य पाठ में मसोरेटिक ‘अपनी नाक’ को पारदर्शी ढंग से रखना
  alternative: ‘मेरी नाक’ अथवा इसे किसी विशेष मूर्तिपूजक अनुष्ठान के रूप में स्पष्ट करना
  rationale: इब्रानी मुहावरा अस्पष्ट है और कुछ प्राचीन साक्षी ‘मेरी नाक’ का समर्थन करते हैं। मुख्य पाठ में किसी निश्चित अनुष्ठानिक अर्थ को आरोपित किए बिना MT रखा गया है और विकल्प टिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण नबी-साहित्यिक शैली रखी गई है। परमेश्वर का यहेजकेल से एकवचन सीधा संबोधन ‘तू’ में है। अस्पष्ट अंतिम वाक्यांश को व्याख्यात्मक विस्तार दिए बिना सुरक्षित रखा गया है; दोनों टिप्पणी-चिह्न संबंधित वाक्य के अंत में दिए गए हैं।
