  yaml_path: translation/ot/ezekiel/008/008.yaml
  text: Then he said to me[a], “Son of man, please dig into the wall.” So I dug into the wall, and behold, there was an opening.
translation:
  language: hi
  text: तब उसने मुझसे कहा, “हे मनुष्य-पुत्र, कृपया दीवार में सेंध लगाओ[a]।” तब मैंने दीवार में सेंध लगाई, और देखो, वहाँ एक खुला स्थान दिखाई दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “दीवार को खोदकर आर-पार निकलो।” इब्रानी क्रिया का अर्थ खोदना या दीवार में सेंध लगाना हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן אָדָם
  choice: हे मनुष्य के पुत्र
  rationale: यहेजकेल को संबोधित करने वाला यह पुस्तक का बार-बार आने वाला इब्रानी पदबंध है। यह शाब्दिक रूप और संबोधन की गरिमा बनाए रखता है, पर यहाँ अपने-आप में कोई मसीहाई उपाधि घोषित नहीं करता।
- source_word: חֲתָר
  choice: सेंध लगाओ
  rationale: दीवार के संदर्भ में क्रिया खोदकर आर-पार जाने या दीवार में सेंध बनाने का भाव देती है। आधुनिक हिन्दी में ‘दीवार में सेंध लगाना’ इस क्रिया और उसके परिणाम दोनों को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: נָא
  choice: कृपया
  rationale: यह निपात आज्ञा को आग्रहपूर्ण या विनम्र बनाता है; ‘कृपया’ उसके भाव को स्पष्ट रखता है।
- source_word: קִּיר
  choice: दीवार
  rationale: इस संरचनात्मक संदर्भ में यह सामान्य और सीधा हिन्दी समतुल्य है।
- source_word: וְהִנֵּה
  choice: और देखो
  rationale: यह अचानक हुई खोज की ओर ध्यान खींचता है और इब्रानी वर्णन की जीवंतता बनाए रखता है।
- source_word: פֶּתַח אֶחָד
  choice: एक द्वार
  rationale: פֶּתַח खुलने की जगह, प्रवेश या द्वार को दर्शा सकता है; אֶחָד को ‘एक’ से स्पष्ट रखा गया है। यहाँ ‘द्वार’ दृश्य में मिले प्रवेश-पथ को स्वाभाविक हिन्दी में व्यक्त करता है, बिना किसी दरवाज़े के पल्ले का दावा किए।
theological_decisions:
- issue: संबोधन בֶּן אָדָם में אָדָם का अनुवाद
  choice: हे मनुष्य के पुत्र
  alternative: हे मानव
  rationale: मूल में एकवचन पुल्लिंग पदबंध है और यह यहेजकेल के लिए स्थापित संबोधन है। इसे बनाए रखने से पुस्तक की साहित्यिक पुनरावृत्ति सुरक्षित रहती है, जबकि इस स्थल पर बाद की मसीहाई व्याख्या आरोपित नहीं की जाती।
- issue: פֶּתַח אֶחָד की अनिश्चितता
  choice: एक द्वार
  alternative: एक खुला स्थान / एक प्रवेश-द्वार
  rationale: पद केवल दीवार में मिले प्रवेश या खुलने की जगह बताता है; वह निर्मित चौखट या दरवाज़े के पल्ले को अनिवार्य नहीं करता। ‘द्वार’ पठनीय है, और इस सीमा को निर्णय में स्पष्ट रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी, सरल किंतु गरिमापूर्ण कथात्मक शैली। ‘हे मनुष्य के पुत्र’ पुस्तक के आवर्ती संबोधन को सुरक्षित रखता है; ‘सेंध लगाना’ दीवार के संदर्भ में सहज और सटीक है।
