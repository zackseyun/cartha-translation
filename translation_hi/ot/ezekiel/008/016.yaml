source:
  edition: WLC
  text: וַ/יָּבֵ֣א אֹתִ֗/י אֶל חֲצַ֣ר בֵּית יְהוָה֮ הַ/פְּנִימִית֒ וְ/הִנֵּה פֶ֜תַח הֵיכַ֣ל יְהוָ֗ה בֵּ֤ין הָֽ/אוּלָם֙ וּ/בֵ֣ין הַ/מִּזְבֵּ֔חַ כְּ/עֶשְׂרִ֥ים וַ/חֲמִשָּׁ֖ה אִ֑ישׁ אֲחֹ֨רֵי/הֶ֜ם אֶל הֵיכַ֤ל יְהוָה֙ וּ/פְנֵי/הֶ֣ם קֵ֔דְמָ/ה וְ/הֵ֛מָּה מִשְׁתַּחֲוִיתֶ֥ם קֵ֖דְמָ/ה לַ/שָּֽׁמֶשׁ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/008/016.yaml
  text: Then he brought me into the inner court of the house of Yahweh[a], and behold, at the entrance of the temple of Yahweh, between the porch and the altar, were about twenty-five men, with their backs toward the temple of Yahweh and their faces toward the east[b]; and they were bowing down toward the east to the sun.
translation:
  language: hi
  text: फिर वह मुझे याहवे के भवन के भीतरी आँगन में ले गया। और देखो, याहवे के मन्दिर के प्रवेश-द्वार पर, बरामदे और वेदी के बीच, लगभग पच्चीस पुरुष थे। उनकी पीठ याहवे के मन्दिर की ओर और उनके मुँह पूर्व की ओर थे; और वे पूर्व की ओर, सूर्य को दण्डवत कर रहे थे[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात वे सूर्य की उपासना करते हुए उसके सामने झुक रहे थे।
    reason: मूल क्रिया दण्डवत होने की शारीरिक क्रिया के साथ उपासना का भाव भी व्यक्त कर सकती है।
lexical_decisions:
- source_word: וַיָּבֵא אֹתִי
  choice: फिर वह मुझे ... ले गया
  rationale: वाव-क्रमिक कथात्मक प्रगति को आधुनिक हिन्दी में स्वाभाविक रूप से व्यक्त करता है और पुरुषवाचक कर्ता को मूल की तरह अनिर्दिष्ट रहने देता है।
- source_word: חֲצַר בֵּית יְהוָה הַפְּנִימִית
  choice: याहवे के भवन का भीतरी आँगन
  rationale: חָצֵר के लिए ‘आँगन’ सहज है; בֵּית का शाब्दिक ‘भवन’ रखा गया है, जबकि आगे הֵיכָל को ‘मन्दिर’ कहा गया है।
- source_word: יְהוָה
  choice: याहवे
  rationale: ईश्वरीय व्यक्तिगत नाम के चार व्यंजनों का हिन्दी लिप्यन्तरण है; इसे किसी उपाधि से नहीं बदला गया।
- source_word: וְהִנֵּה
  choice: और देखो
  rationale: दर्शन-वृत्तान्त में अचानक दृश्य पर ध्यान खींचने वाली शक्ति को स्पष्ट और वर्तमान हिन्दी में बनाए रखता है।
- source_word: פֶּתַח הֵיכַל יְהוָה
  choice: याहवे के मन्दिर के प्रवेश-द्वार पर
  rationale: פֶּתַח प्रवेश या द्वार है और इस प्रसंग में הֵיכָל मन्दिर-भवन को सूचित करता है।
- source_word: בֵּין הָאוּלָם וּבֵין הַמִּזְבֵּחַ
  choice: बरामदे और वेदी के बीच
  rationale: אוּלָם मन्दिर के सामने का बरामदा या द्वारमण्डप है; ‘बरामदा’ सामान्य पाठक के लिए सुबोध है।
- source_word: כְּעֶשְׂרִים וַחֲמִשָּׁה אִישׁ
  choice: लगभग पच्चीस पुरुष
  rationale: संख्या से पहले כְּ अनुमान का भाव देता है; אִישׁ यहाँ संख्या के बाद सामूहिक अर्थ में है।
- source_word: אֲחֹרֵיהֶם אֶל הֵיכַל יְהוָה וּפְנֵיהֶם קֵדְמָה
  choice: उनकी पीठ याहवे के मन्दिर की ओर और उनके मुँह पूर्व की ओर थे
  rationale: मूल में मन्दिर से विमुख और पूर्वाभिमुख होने का तीखा स्थानिक विरोध ज्यों का त्यों रखा गया है।
- source_word: מִשְׁתַּחֲוִיתֶם
  choice: दण्डवत कर रहे थे
  rationale: क्रिया भूमि की ओर झुकने या दण्डवत होने की देहगत क्रिया बताती है और इस प्रसंग में उपासना का भाव भी रखती है; मुख्य पाठ ठोस क्रिया को सुरक्षित रखता है।
- source_word: קֵדְמָה לַשָּׁמֶשׁ
  choice: पूर्व की ओर सूर्य को
  rationale: मूल दिशा और उपासना के लक्ष्य—दोनों को व्यक्त करता है; ‘सूर्य को’ हिन्दी में दण्डवत का स्वाभाविक कर्म है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: प्रभु
  rationale: मूल में उपाधि नहीं बल्कि व्यक्तिगत नाम है; लिप्यन्तरण उस भेद को सुरक्षित रखता है।
- issue: מִשְׁתַּחֲוִיתֶם में उपासना का भाव
  choice: दण्डवत कर रहे थे
  alternative: सूर्य की उपासना कर रहे थे
  rationale: मूल क्रिया में उपासनात्मक दण्डवत का अर्थ सम्भव और प्रसंग में स्पष्ट है, पर मुख्य पाठ में शारीरिक क्रिया को रखना अनावश्यक व्याख्यात्मक विस्तार से बचाता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘आँगन’, ‘बरामदा’ और ‘वेदी’ परिचित स्थापत्य तथा उपासनात्मक शब्द हैं। दृश्य की गंभीरता बनाए रखने के लिए ‘और देखो’ तथा ‘दण्डवत’ का प्रयोग किया गया है।
