source:
  edition: WLC
  text: וָ/אֶרְאֶ֗ה וְ/הִנֵּ֤ה דְמוּת֙ כְּ/מַרְאֵה אֵ֔שׁ מִ/מַּרְאֵ֥ה מָתְנָ֛י/ו וּ/לְ/מַ֖טָּה אֵ֑שׁ וּ/מִ/מָּתְנָ֣י/ו וּ/לְ/מַ֔עְלָ/ה כְּ/מַרְאֵה זֹ֖הַר כְּ/עֵ֥ין הַ/חַשְׁמַֽלָ/ה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/008/002.yaml
  text: 'Then I looked[a], and behold, a form with the appearance of fire: from what appeared to be his waist and downward, fire; and from his waist and upward, like the appearance of brightness, like gleaming amber.'
translation:
  language: hi
  text: तब मैंने देखा, और देखो, आग-जैसी दिखाई देनेवाली एक आकृति थी। जहाँ उसकी कमर-सी प्रतीत होती थी, वहाँ से नीचे आग थी; और उसकी कमर से ऊपर चमक के दृश्य के समान था, मानो दमकते हुए कहरुबा के समान[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “इलेक्ट्रम के समान” अथवा “चमकती धातु के समान।” यहाँ प्रयुक्त इब्रानी शब्द दुर्लभ है और किसी अत्यन्त चमकीले पदार्थ को दर्शाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶרְאֶה
  choice: तब मैंने देखा
  rationale: वाव-क्रमसूचक कथा को आगे बढ़ाता है; यह अनुवाद प्रथम-पुरुष दर्शन-वर्णन को स्वाभाविक हिन्दी में रखता है।
- source_word: וְהִנֵּה
  choice: कि ... थी
  rationale: हिन्दी वाक्य में अचानक सामने आए दृश्य का भाव संरचना और शब्दक्रम से व्यक्त किया गया है; अलग से ‘देखो’ जोड़ना यहाँ अस्वाभाविक होता।
- source_word: דְמוּת
  choice: एक आकृति
  rationale: यह प्रत्यक्ष पहचान के बजाय दृश्य समानता या रूप को बताता है।
- source_word: כְּמַרְאֵה אֵשׁ
  choice: आग-जैसी दिखाई देनेवाली
  rationale: כ और מראה की तुलनात्मक भाषा सुरक्षित रखी गई है, ताकि आकृति को सीधे आग न कहा जाए।
- source_word: מִמַּרְאֵה מָתְנָיו
  choice: उसकी कमर जैसी दिखाई देनेवाली जगह से
  rationale: कठिन और संक्षिप्त इब्रानी पदबंध में ‘दिखाई देने’ तथा शारीरिक संदर्भ दोनों को रखा गया है।
- source_word: וּלְמַטָּה
  choice: नीचे तक
  rationale: आकृति के निचले भाग की दिशा को संक्षिप्त, स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: אֵשׁ
  choice: आग
  rationale: मूल के संक्षिप्त, क्रियारहित और सजीव कथन को बनाए रखता है।
- source_word: וּמִמָּתְנָיו וּלְמַעְלָה
  choice: और उसकी कमर से ऊपर की ओर
  rationale: पहले स्थानिक खंड के समानांतर संरचना को सुरक्षित रखता है।
- source_word: כְּמַרְאֵה זֹהַר
  choice: चमक का-सा रूप
  rationale: זֹהַר की उज्ज्वलता और מראה तथा כ की तुलनात्मक सावधानी दोनों व्यक्त होती हैं।
- source_word: כְּעֵין הַחַשְׁמַלָה
  choice: मानो दमकता हुआ कहरुबा
  rationale: दुर्लभ חַשְׁמַל को पारंपरिक उज्ज्वल पदार्थ ‘कहरुबा’ से व्यक्त किया गया है; इसकी अनिश्चितता और धात्विक विकल्प पादटिप्पणी में दिए गए हैं।
theological_decisions:
- issue: दर्शित आकृति का स्वरूप
  choice: ‘जैसी’, ‘दिखाई देनेवाली’, ‘का-सा’ और ‘मानो’ जैसी समानतासूचक भाषा बनाए रखना
  alternative: आकृति को सीधे आग, चमक या धातु के रूप में पहचानना
  rationale: यहेजकेल का वर्णन बार-बार समानता और दृश्य आभास की भाषा बरतता है। इसे बनाए रखने से दर्शन के विषय की वास्तविक प्रकृति को अनावश्यक रूप से निश्चित नहीं किया जाता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमामय किंतु सहज दर्शन-वर्णन। मूल की पुनरावृत्त समानतासूचक भाषा और संक्षिप्त स्थानिक समानांतरता को यथासंभव बनाए रखा गया है।
