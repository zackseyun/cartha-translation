- from: तब मैंने देखा कि आग-जैसी दिखाई देनेवाली एक आकृति थी। उसकी कमर जैसी दिखाई देनेवाली जगह से नीचे तक आग थी, और उसकी कमर से ऊपर की ओर चमक का-सा रूप था—मानो दमकता हुआ कहरुबा[a]।
  to: तब मैंने देखा, और देखो, आग-जैसी दिखाई देनेवाली एक आकृति थी। जहाँ उसकी कमर-सी प्रतीत होती थी, वहाँ से नीचे आग थी; और उसकी कमर से ऊपर चमक के दृश्य के समान था, मानो दमकते हुए कहरुबा के समान[a]।
  rationale: The revision preserves the Hebrew’s repeated language of appearance and comparison without identifying the visionary figure directly as fire or metal. It improves idiomatic Hindi in the two difficult descriptive clauses and clarifies the lexical alternatives for the rare term חַשְׁמַל.
  reviewer_model: gpt-5.6-terra
