translation:
  language: hi
  text: फिर उसने मुझसे कहा, “तुम फिर और भी बड़े घिनौने काम देखोगे, जो वे कर रहे हैं।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תּוֹעֵבוֹת
  choice: घिनौने काम
  rationale: बहुवचन संज्ञा यहाँ उन धार्मिक कृत्यों को दर्शाती है जिन्हें परमेश्वर की दृष्टि में अत्यंत आपत्तिजनक बताया गया है; आधुनिक हिन्दी में ‘घिनौने काम’ स्वाभाविक और स्पष्ट है।
- source_word: גְּדֹלוֹת
  choice: इससे भी बड़े
  rationale: संदर्भ में पहले दिखाए गए कृत्यों से तुलना निहित है; इसलिए ‘इससे भी बड़े’ हिब्रू विशेषण की तुलनात्मक शक्ति को व्यक्त करता है।
- source_word: תָּשׁוּב תִּרְאֶה
  choice: तुम फिर ... देखोगे
  rationale: שׁוב के साथ अपूर्ण क्रिया पुनरावृत्ति और भविष्य की घटना व्यक्त करती है; यह हिन्दी क्रम सहज रूप से वही अर्थ देता है।
theological_decisions:
- issue: ‘घिनौने काम’ का धार्मिक और नैतिक दायरा
  choice: व्यापक शब्दावली रखी गई
  alternative: ‘मूर्तिपूजा के और भी बड़े पाप’
  rationale: मूल में इस पद पर न तो ‘मूर्तिपूजा’ और न ‘पाप’ शब्द स्पष्ट रूप से है; व्यापक अनुवाद पाठ की अपनी व्याख्यात्मक गुंजाइश सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; भाषा सरल, गरिमापूर्ण और मौखिक कथन के अनुरूप है। ‘उसने’ का संदर्भ पिछले पदों से स्पष्ट होता है, इसलिए कोई व्याख्यात्मक संज्ञा नहीं जोड़ी गई।
