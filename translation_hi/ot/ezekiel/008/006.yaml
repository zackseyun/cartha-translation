  edition: WLC
  text: וַ/יֹּ֣אמֶר אֵלַ֔/י בֶּן אָדָ֕ם הֲ/רֹאֶ֥ה אַתָּ֖ה מ/הם עֹשִׂ֑ים תּוֹעֵב֨וֹת גְּדֹל֜וֹת אֲשֶׁ֥ר בֵּֽית יִשְׂרָאֵ֣ל עֹשִׂ֣ים פֹּ֗ה לְ/רָֽחֳקָה֙ מֵ/עַ֣ל מִקְדָּשִׁ֔/י וְ/עוֹד֙ תָּשׁ֣וּב תִּרְאֶ֔ה תּוֹעֵב֖וֹת גְּדֹלֽוֹת־־׀׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/008/006.yaml
  text: And he said to me[a], “Son of man, do you see what they are doing, the great abominations that the house of Israel is doing here[b], to drive me far from my sanctuary? Yet you will see even greater abominations.”
translation:
  language: hi
  text: और उसने मुझसे कहा, “हे मनुष्य के पुत्र, क्या तू देखता है कि वे क्या कर रहे हैं—वे बड़े घिनौने काम, जो इस्राएल का घराना यहाँ कर रहा है, मुझे अपने पवित्रस्थान से दूर करने के लिए?[a] फिर भी तू और बड़े घिनौने काम देखेगा।”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मुझे अपने पवित्रस्थान से बहुत दूर जाने पर विवश करने के लिए”; सम्भवतः, “मेरे पवित्रस्थान से दूर।”
    reason: संक्षिप्त इब्रानी वाक्यांश में कारणात्मक अर्थ और केवल स्थान-सूचक अर्थ—दोनों की सम्भावना है।
  - marker: b
    text: इब्रानी में यहाँ फिर “बड़े घिनौने काम” है; प्रसंग में बढ़ती गंभीरता दिखाने के लिए मुख्य पाठ में “और बड़े” कहा गया है।
    reason: मूल की पुनरावृत्ति और प्रसंगगत तुलना दोनों को स्पष्ट करना।
lexical_decisions:
- source_word: בֶּן אָדָם
  choice: हे मनुष्य के पुत्र
  rationale: यहेजकेल में बार-बार प्रयुक्त संबोधन को औपचारिक निकटता और हिन्दी बाइबलीय परिचितता के साथ सुरक्षित रखता है।
- source_word: הֲרֹאֶה אַתָּה
  choice: क्या तू देखता है
  rationale: प्रश्नवाचक उपसर्ग और वर्तमान कृदन्त के प्रत्यक्ष, चल रहे बोध को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: תּוֹעֵבוֹת גְּדֹלוֹת
  choice: बड़े घिनौने काम
  rationale: धार्मिक और नैतिक रूप से अत्यन्त घृणित कर्मों का प्रबल भाव बनाए रखता है; साधारण पाठक के लिए ‘घिनौने काम’ अधिक सहज है।
- source_word: בֵּית יִשְׂרָאֵל
  choice: इस्राएल का घर
  rationale: सामूहिक वाचक भविष्यद्वक्ताई पदबंध का औपचारिक रूप सुरक्षित रखता है।
- source_word: לְרָחֳקָה מֵעַל מִקְדָּשִׁי
  choice: ताकि मुझे अपने पवित्रस्थान से दूर कर दे
  rationale: सन्दर्भगत प्रथम पुरुष कर्ता को स्पष्ट रखते हुए दूरी उत्पन्न करने के संभावित कारक भाव को व्यक्त करता है, पर वैकल्पिक व्याकरणिक सम्भावना पादटिप्पणी में सुरक्षित है।
- source_word: מִקְדָּשִׁי
  choice: अपने पवित्रस्थान
  rationale: מִקְדָּשׁ के पवित्र उपासना-स्थान के अर्थ को ‘मन्दिर’ से अधिक सटीक रूप में देता है; प्रत्यक्ष वचन में ‘अपने’ स्वाभाविक रूप से ‘मेरे’ का सम्बन्ध बताता है।
- source_word: וְעוֹד תָּשׁוּב תִּרְאֶה
  choice: फिर भी तू ... देखेगा
  rationale: आगे और दृश्य दिखाए जाने की निरन्तरता तथा बढ़ती गंभीरता को सहज हिन्दी में व्यक्त करता है।
- source_word: תּוֹעֵבוֹת גְּדֹלוֹת
  choice: और बड़े घिनौने काम
  rationale: मूल में वही पदबंध दोहराया गया है; प्रसंग में ‘और बड़े’ आगे बढ़ती तीव्रता को दर्शाता है, जिसकी सूचना पादटिप्पणी में दी गई है।
theological_decisions:
- issue: לְרָחֳקָה מֵעַל מִקְדָּשִׁי में किसे पवित्रस्थान से दूर किया जा रहा है
  choice: इस्राएल के घिनौने काम परमेश्वर को उसके पवित्रस्थान से दूर करते हैं
  alternative: वाक्यांश का अर्थ केवल ‘मेरे पवित्रस्थान से दूर’ या ‘मेरे पवित्रस्थान से दूर करने के लिए’ भी समझा जा सकता है
  rationale: प्रथम पुरुष सन्दर्भ और यहेजकेल में परमेश्वर की महिमा के प्रस्थान की व्यापक प्रसंगरेखा इस अर्थ का समर्थन करती है, किन्तु संक्षिप्त इब्रानी रचना में वास्तविक अस्पष्टता होने के कारण विकल्प पादटिप्पणी में रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण भविष्यद्वक्ताई शैली। परमेश्वर द्वारा नबी को एकवचन निकट संबोधन के कारण ‘तू’ रखा गया है। ‘घिनौने काम’ सामान्य पाठक के लिए स्पष्ट है और תּוֹעֵבוֹת की तीव्र धार्मिक-नैतिक निन्दा को बनाए रखता है।
