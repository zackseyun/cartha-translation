base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/008/005.yaml
  text: Then he said to me[a], “Son of man, please lift up your eyes toward the north.” So I lifted up my eyes toward the north, and behold, north of the gate of the altar was this image of jealousy at the entrance.
translation:
  language: hi
  text: तब उसने मुझसे कहा, “हे मनुष्य-पुत्र, ज़रा अपनी आँखें उत्तर की ओर उठा।” तब मैंने अपनी आँखें उत्तर की ओर उठाईं, और देखो, वेदी के फाटक के उत्तर में प्रवेश पर ईर्ष्या की यह प्रतिमा[a] थी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “ईर्ष्या की यह मूर्ति,” अथवा “ईर्ष्या भड़काने वाली यह प्रतिमा।” इब्रानी पदबंध संक्षिप्त है और प्रतिमा के स्वरूप या परमेश्वर की ईर्ष्या भड़काने वाले उसके प्रभाव—दोनों में से किसी को सूचित कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן אָדָם
  choice: हे मनुष्य के पुत्र
  rationale: यह यहेजकेल को किया जाने वाला मानक ईश्वरीय संबोधन है। यह चुनाव इब्रानी मुहावरे और उसके साहित्यिक स्वर को बनाए रखता है।
- source_word: שָׂא נָא עֵינֶיךָ
  choice: ज़रा अपनी आँखें ... उठा
  rationale: ‘आँखें उठाना’ मूल बिंब को सुरक्षित रखता है; ‘ज़रा’ נָא के विनम्र अनुरोधात्मक भाव को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: דֶּרֶךְ צָפוֹנָה
  choice: उत्तर की ओर
  rationale: यह वाक्यांश दिशा बताता है; हिन्दी में यह संक्षिप्त, स्वाभाविक और सटीक है।
- source_word: וְהִנֵּה
  choice: और देखो
  rationale: ‘देखो’ दर्शनीय संकेत और दर्शन-वृत्तांत की सजीवता को बनाए रखता है।
- source_word: מִצָּפוֹן
  choice: उत्तर में
  rationale: संदर्भ में यह गति के बजाय फाटक के सापेक्ष स्थान बताता है; ‘के उत्तर में’ इसे स्पष्ट करता है।
- source_word: לְשַׁעַר הַמִּזְבֵּחַ
  choice: वेदी के फाटक के
  rationale: यह रचना संबंधसूचक इब्रानी पदबंध को औपचारिक रूप से सुरक्षित रखती है और अनिश्चित स्थापत्य-संदर्भ को अनावश्यक रूप से नहीं खोलती।
- source_word: סֵמֶל
  choice: प्रतिमा
  rationale: यह शब्द किसी आकृति या उपासना-संबंधी छवि को सूचित कर सकता है। ‘प्रतिमा’ हिन्दी में दृश्य वस्तु और मूर्तिपूजक संदर्भ दोनों के लिए उपयुक्त है, पर ‘मूर्ति’ जितना व्याख्यात्मक रूप से निश्चित नहीं।
- source_word: הַקִּנְאָה
  choice: ईर्ष्या की
  rationale: यह औपचारिक रूप से निकट अनुवाद संबंधसूचक पदबंध की वास्तविक अस्पष्टता को बनाए रखता है—यह प्रतिमा के चरित्र अथवा परमेश्वर की ईर्ष्या भड़काने वाले प्रभाव को सूचित कर सकता है।
- source_word: בַּבִּאָה
  choice: प्रवेश-स्थान पर
  rationale: यह स्थानवाचक अर्थ को स्पष्ट और स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: סֵמֶל הַקִּנְאָה की व्याख्या कितनी स्पष्ट की जाए
  choice: मुख्य पाठ में “ईर्ष्या की यह प्रतिमा”
  alternative: “ईर्ष्या दिलाने वाली यह प्रतिमा” अथवा “ईर्ष्या की यह मूर्ति”
  rationale: संदर्भ में मूर्तिपूजा से परमेश्वर की ईर्ष्या भड़कने का भाव है, किंतु इब्रानी पदबंध संक्षिप्त और संज्ञात्मक है। मुख्य पाठ उसी तनाव और अस्पष्टता को सुरक्षित रखता है; अधिक स्पष्ट अर्थ पाद-टिप्पणी में दिए गए हैं।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की है, किंतु भविष्यद्वाणी के गरिमामय और दर्शनात्मक स्वर को बनाए रखती है। ‘ज़रा’ विनम्र आग्रह को सहज बनाता है; ‘और देखो’ दृश्य के अचानक सामने आने का प्रभाव रखता है।
