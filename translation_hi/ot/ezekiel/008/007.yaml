  text: וַ/יָּבֵ֥א אֹתִ֖/י אֶל פֶּ֣תַח הֶֽ/חָצֵ֑ר וָ/אֶרְאֶ֕ה וְ/הִנֵּ֥ה חֹר אֶחָ֖ד בַּ/קִּֽיר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/008/007.yaml
  text: Then he brought me to the entrance of the court[a], and I looked, and behold[b], there was a hole in the wall.
translation:
  language: hi
  text: तब वह मुझे आँगन[a] के प्रवेश-द्वार पर ले आया। मैंने देखा[b], और देखो, दीवार में एक छेद था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘प्रांगण।’
    reason: lexical_alternative
  - marker: b
    text: या, ‘मैंने दृष्टि डाली’; हिब्रू क्रिया देखने की क्रिया या उसके परिणामस्वरूप दिखाई देने—दोनों को व्यक्त कर सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֵא
  choice: तब वह … ले आया
  rationale: בוא का हिफ़ील रूप किसी को लाने का अर्थ देता है। ‘तब’ हिब्रू कथानक के क्रमिक वाव का स्वाभाविक हिन्दी रूप है।
- source_word: אֹתִי
  choice: मुझे
  rationale: यह प्रथम पुरुष एकवचन का प्रत्यक्ष कर्म है।
- source_word: אֶל
  choice: … पर
  rationale: यह दिशा या गंतव्य बताता है। प्रवेश-द्वार के साथ हिन्दी में ‘पर’ स्वाभाविक है और भीतर प्रवेश करने का अनावश्यक संकेत नहीं देता।
- source_word: פֶּתַח
  choice: प्रवेश-द्वार
  rationale: शब्द किसी प्रवेश-स्थान या खुले द्वार को दर्शाता है; इस प्रसंग में ‘प्रवेश-द्वार’ स्पष्ट और स्वाभाविक है।
- source_word: הֶחָצֵר
  choice: आँगन
  rationale: חָצֵר घिरे हुए आँगन या प्रांगण को दर्शाता है; मन्दिर-परिसर के संदर्भ में ‘आँगन’ सामान्य पाठक के लिए सहज है।
- source_word: וָאֶרְאֶה
  choice: मैंने देखा
  rationale: ראה देखने की क्रिया अथवा उसके परिणामस्वरूप कुछ दिखाई देने—दोनों को व्यक्त कर सकता है। मुख्य पाठ में सरल और व्यापक ‘देखा’ रखा गया है।
- source_word: וְהִנֵּה
  choice: और देखो
  rationale: הִנֵּה आगे आने वाले दृश्य की ओर ध्यान खींचता है। ‘देखो’ उसकी जीवंत, ध्यानाकर्षक शक्ति को बनाए रखता है।
- source_word: חֹר
  choice: छेद
  rationale: חֹר दीवार में बने छेद या सुराख को दर्शाता है; ‘छेद’ सीधा और सामान्य हिन्दी शब्द है।
- source_word: אֶחָד
  choice: एक
  rationale: यहाँ אֶחָד किसी एक छेद का उल्लेख आरम्भ करता है; हिन्दी में अनिश्चित उल्लेख के लिए भी ‘एक’ स्वाभाविक है।
- source_word: בַּקִּיר
  choice: दीवार में
  rationale: קִיר का अर्थ ‘दीवार’ है और בַּ־ स्थान को ‘में’ के रूप में चिह्नित करता है।
