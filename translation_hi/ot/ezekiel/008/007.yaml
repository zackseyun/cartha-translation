  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और कथात्मक शैली रखी गई है। ‘और देखो’ मूल के ध्यानाकर्षक, भविष्यद्वक्तापरक स्वर को बनाए रखता है; मूल की क्रमिकता और ‘देखने’ की पुनरुक्ति को अनावश्यक रूप से समतल नहीं किया गया।
