  text: וְ/הִ֨נֵּה שָׁ֔ם כְּב֖וֹד אֱלֹהֵ֣י יִשְׂרָאֵ֑ל כַּ/מַּרְאֶ֕ה אֲשֶׁ֥ר רָאִ֖יתִי בַּ/בִּקְעָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/008/004.yaml
  text: And behold[a], there was the glory of the God of Israel, like the appearance that I had seen in the valley.
translation:
  language: hi
  text: और देखो, वहाँ इस्राएल के परमेश्वर की महिमा थी, उस रूप के समान जिसे मैंने घाटी[a] में देखा था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘मैदान में।’ इब्रानी शब्द בִּקְעָה किसी चौड़ी घाटी या समतल मैदान के लिए प्रयुक्त हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  choice: और देखो
  rationale: यह अनुवाद कथन-सूचक संबंध और दर्शन की आकस्मिक, सजीव प्रस्तुति—दोनों को स्वाभाविक आधुनिक हिन्दी में बनाए रखता है।
- source_word: שָׁם
  choice: वहाँ ... थी
  rationale: स्थानवाचक अर्थ को हिन्दी की स्वाभाविक वाक्य-रचना में स्पष्ट रूप से व्यक्त करता है।
- source_word: כְּבוֹד
  choice: महिमा
  rationale: ईश्वरीय प्रकट उपस्थिति के संदर्भ में यह मानक और अर्थगर्भित हिन्दी पद है; यह दृश्य वैभव और धार्मिक गहनता को बिना अतिरिक्त व्याख्या के बनाए रखता है।
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: इस्राएल के परमेश्वर
  rationale: सम्बन्धसूचक इब्रानी पदबंध का सीधा और स्वाभाविक अनुवाद है।
- source_word: כַּמַּרְאֶה
  choice: वैसी ही जैसी वह आकृति
  rationale: מַרְאֶה के दृश्य रूप या दिखाई देने वाली आकृति के अर्थ को व्यक्त करता है और तुलना को पूर्व दर्शन से जोड़ता है; इसे केवल 'दर्शन' कहकर अर्थ सीमित नहीं किया गया।
- source_word: אֲשֶׁר רָאִיתִי
  choice: मैंने ... देखी थी
  rationale: पूर्व में देखी गई घटना का स्मरण आधुनिक हिन्दी में स्वाभाविक पूर्णभूत रूप से व्यक्त होता है।
- source_word: בַּבִּקְעָה
  choice: घाटी में
  rationale: בִּקְעָה चौड़ी घाटी या समतल मैदान का बोध करा सकता है। मुख्य पाठ में 'घाटी' सहज है और यहेजकेल 3:22–23 के संभावित संदर्भ से मेल खाता है; दूसरा अर्थ पादटिप्पणी में रखा गया है।
theological_decisions:
- issue: ‘इस्राएल के परमेश्वर की महिमा’ के रूप में ईश्वरीय प्रकटीकरण का स्वरूप
  choice: ईश्वर की महिमा की दृश्य उपस्थिति को सीधे व्यक्त करना, बिना व्याख्यात्मक शब्द जोड़े
  alternative: इसे ‘परमेश्वर की उपस्थिति दर्शाने वाला दृश्य वैभव’ या तकनीकी ईश्वर-दर्शन के रूप में स्पष्ट करना
  rationale: इब्रानी पाठ कहता है कि परमेश्वर की महिमा वहाँ थी और उसकी तुलना पहले देखी गई आकृति से करता है। अनुवाद उसी धार्मिक तनाव और रहस्य को बनाए रखता है, पर पाठ से अधिक व्याख्या नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘और देखो’ भविष्यद्वक्ताई दर्शन की सजीवता बनाए रखता है; ‘आकृति’ दृश्य स्वरूप को व्यक्त करती है और अनावश्यक doctrinal व्याख्या से बचती है।
