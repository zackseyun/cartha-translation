lexical_decisions:
- source_word: שִׁבְעִים אִישׁ
  choice: सत्तर पुरुष
  rationale: गिनी हुई इस पुरुष-मंडली के लिए אִישׁ का लिंग-सूचक अर्थ बनाए रखता है और स्वाभाविक हिन्दी देता है।
- source_word: מִזִּקְנֵי בֵית יִשְׂרָאֵל
  choice: इस्राएल के घराने के पुरनियों में से
  rationale: מִן के चयनात्मक भाव को ‘में से’ द्वारा और בֵית יִשְׂרָאֵל को ‘इस्राएल का घराना’ द्वारा सुरक्षित रखा गया है। ‘पुरनिये’ इस्राएली नेतृत्व-मंडल के लिए परिचित और गरिमापूर्ण बाइबलीय शब्द है।
- source_word: יַאֲזַנְיָהוּ בֶן שָׁפָן
  choice: शापान का पुत्र याजन्याह
  rationale: व्यक्तिनामों का देवनागरी लिप्यंतरण किया गया है और पुत्र-संबंध को सीधे व्यक्त किया गया है।
- source_word: עֹמֵד בְּתוֹכָם
  choice: उनके बीच खड़ा था
  rationale: בְּתוֹךְ का समूह के मध्य होने का स्थानिक भाव सहज आधुनिक हिन्दी में व्यक्त होता है।
- source_word: עֹמְדִים לִפְנֵיהֶם
  choice: वे उनके सामने खड़े थे
  rationale: कृदंत दृश्य में जारी अवस्था दिखाता है। बहुवचन सर्वनाम ‘उनके’ को मुख्य पाठ में अस्पष्ट ही रखा गया है।
- source_word: מִקְטַרְתּוֹ
  choice: अपना धूपदान
  rationale: यह शब्द धूप जलाने के पात्र को दर्शाता है; ‘धूपदान’ संक्षिप्त, स्पष्ट और प्रचलित हिन्दी है।
- source_word: וַעֲתַר עֲנַן הַקְּטֹרֶת
  choice: धूप का घना बादल
  rationale: עֲתַר से व्यक्त प्रचुरता अथवा सघनता को ‘घना’ स्वाभाविक रूप से प्रकट करता है।
- source_word: עֹלֶה
  choice: ऊपर उठ रहा था
  rationale: कृदंत की जारी क्रिया और धुएँ की ऊपर की ओर गति दोनों सुरक्षित रहती हैं।
theological_decisions:
- issue: לִפְנֵיהֶם (‘उनके सामने’) का संदर्भ
  choice: मुख्य पाठ में बहुवचन सर्वनाम ‘उनके सामने’ बनाए रखा गया है।
  alternative: इसे स्पष्ट करके ‘दीवार पर बने उन चित्रों के सामने’ कहना।
  rationale: निकटवर्ती संदर्भ में यह बहुवचन संभवतः पिछले पद में दीवार पर उकेरे गए प्राणियों और मूर्तियों की ओर संकेत करता है, पर मुख्य पाठ में इसका संदर्भ व्याख्यात्मक रूप से निश्चित नहीं किया गया।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, सरल किन्तु गरिमापूर्ण रखी गई है। दृष्टि में चल रहे दृश्य को ‘खड़ा था/खड़े थे’ और ‘उठ रहा था’ से व्यक्त किया गया है। ‘उनके सामने’ की वास्तविक संदर्भगत अस्पष्टता मुख्य पाठ में सुरक्षित है और सम्भावित संदर्भ केवल पादटिप्पणी में बताया गया है।
