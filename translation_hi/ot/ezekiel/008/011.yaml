    text: या, “उनके मध्य में।”
    reason: lexical_alternative
  - marker: b
    text: सम्भवतः उस कक्ष की दीवार पर बने चित्रों के सामने; पद 10 देखें।
    reason: cross_reference
  - marker: c
    text: या, “धूप जलाने का पात्र।”
    reason: lexical_alternative
  - marker: d
