  text: וַ/יֹּ֖אמֶר אֵלָ֑/י בֹּ֤א וּ/רְאֵה֙ אֶת הַ/תּוֹעֵב֣וֹת הָ/רָע֔וֹת אֲשֶׁ֛ר הֵ֥ם עֹשִׂ֖ים פֹּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/008/009.yaml
  text: And he said to me, “Come and see the evil abominations that they are doing here.”
translation:
  language: hi
  text: तब उसने मुझसे कहा, “अन्दर आओ और उन बुरे घिनौने कामों को देखो जो वे यहाँ कर रहे हैं।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֹּא
  choice: अन्दर आओ
  rationale: संदर्भ में यह केवल निकट आने का नहीं, दीवार के छेद से भीतर प्रवेश करने का आदेश है; इसलिए आधुनिक हिन्दी में स्थानगत अर्थ स्पष्ट किया गया है।
- source_word: הַתּוֹעֵבוֹת הָרָעוֹת
  choice: बुरे घिनौने कामों
  rationale: תּוֹעֵבוֹת उन घृणित कृत्यों को सूचित करता है जो धार्मिक और नैतिक रूप से निंदनीय हैं, जबकि הָרָעוֹת उनके बुरे चरित्र पर बल देता है; दोनों विशेषताओं को बनाए रखा गया है।
- source_word: עֹשִׂים
  choice: कर रहे हैं
  rationale: हिब्रू कृदंत यहाँ जारी गतिविधि दर्शाता है, जिसे हिन्दी के अपूर्ण वर्तमान से स्वाभाविक रूप में व्यक्त किया गया है।
- source_word: פֹּה
  choice: यहाँ
  rationale: मूल का स्पष्ट स्थानवाचक संकेत सीधे सुरक्षित रखा गया है।
theological_decisions:
- issue: घृणित कार्यों की धार्मिक-मूर्तिपूजक प्रकृति
  choice: घिनौने कामों
  alternative: घृणित उपासनाओं
  rationale: तात्कालिक प्रसंग मूर्तिपूजा से जुड़ा है, पर इस पद में संज्ञा व्यापक है। अनुवाद ने प्रसंग को संकीर्ण धार्मिक व्याख्या में बदलने के बजाय मूल की व्यापकता बनाए रखी है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी। “उसने” पूर्ववर्ती पुरुष वक्ता का स्वाभाविक संदर्भ बनाए रखता है; “बुरे घिनौने काम” मूल के दोहरे नैतिक मूल्यांकन को बिना अनावश्यक संस्कृतनिष्ठता के व्यक्त करता है।
