  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יָּבֵ֣א אֹתִ֗/י אֶל פֶּ֨תַח֙ שַׁ֣עַר בֵּית יְהוָ֔ה אֲשֶׁ֖ר אֶל הַ/צָּפ֑וֹנָ/ה וְ/הִנֵּה שָׁם֙ הַ/נָּשִׁ֣ים יֹֽשְׁב֔וֹת מְבַכּ֖וֹת אֶת הַ/תַּמּֽוּז־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/008/014.yaml
  text: Then he brought me to the entrance of the gate of the house of Yahweh that faces north[a], and behold, there the women were sitting[b], weeping for Tammuz.
translation:
  language: hi
  text: तब वह मुझे यहोवा के भवन के उस फाटक के प्रवेश-द्वार पर ले आया, जिसका रुख उत्तर की ओर था; और देखो, वहाँ स्त्रियाँ बैठी हुई तम्मूज[a][b] के लिए रो रही थीं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: तम्मूज मेसोपोटामिया का एक देवता था, जिससे ऋतु-सम्बन्धी शोक-अनुष्ठान जुड़े थे; यहाँ स्त्रियाँ उसी के लिए विलाप करती दिखाई गई हैं।
    reason: cultural_note
  - marker: b
    text: या, “तम्मूज के लिए शोक मना रही थीं।” हिब्रू क्रिया का शाब्दिक अर्थ “रोना” है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֵא אֹתִי
  choice: तब वह मुझे ... ले आया
  rationale: בוא के हिफ़ील रूप का कारक अर्थ ‘ले आया’ है; ‘तब’ कथा के क्रम को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: פֶּתַח שַׁעַר
  choice: फाटक के प्रवेश-द्वार
  rationale: दोनों स्थापत्य संज्ञाओं—‘प्रवेश/मुहाना’ और ‘फाटक’—को बनाए रखते हुए यह हिन्दी में बोधगम्य है।
- source_word: בֵּית יְהוָה
  choice: यहोवा का भवन
  rationale: ‘भवन’ मूल के ‘घर’ को गरिमापूर्ण ढंग से सुरक्षित रखता है और ‘मन्दिर’ जैसी व्याख्यात्मक अदला-बदली से बचता है; יהוה को व्यक्तिगत नाम ‘यहोवा’ के रूप में लिप्यंतरित किया गया है।
- source_word: אֲשֶׁר אֶל הַצָּפוֹנָה
  choice: जिसका मुख उत्तर की ओर था
  rationale: दिशा की ओर उन्मुख फाटक का भाव आधुनिक हिन्दी में स्वाभाविक रूप से व्यक्त होता है।
- source_word: וְהִנֵּה
  choice: और देखो
  rationale: दृश्य की ओर तत्काल ध्यान खींचने वाले हिब्रू संकेतक की जीवंतता बनाए रखता है।
- source_word: הַנָּשִׁים יֹשְׁבוֹת
  choice: स्त्रियाँ बैठी हुई
  rationale: स्त्रीलिंग बहुवचन कृदन्त दृश्य में जारी मुद्रा को दर्शाता है। हिन्दी में निश्चितता प्रसंग और ‘वहाँ’ से स्पष्ट है।
- source_word: מְבַכּוֹת אֶת הַתַּמּוּז
  choice: तम्मूज के लिए रो रही थीं
  rationale: בכה का प्रत्यक्ष अर्थ ‘रोना’ रखा गया है; कर्म-सूचक संरचना को हिन्दी में ‘के लिए’ से स्वाभाविक बनाया गया है, जबकि अनुष्ठानिक शोक का संदर्भ टिप्पणी में स्पष्ट है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का रूप
  choice: यहोवा
  alternative: याहवे
  rationale: मूल में उपाधि नहीं बल्कि चतुरक्षरीय व्यक्तिगत नाम है। हिन्दी में प्रचलित बाइबिलीय लिप्यंतरण ‘यहोवा’ नाम के रूप को बनाए रखता है; ‘प्रभु’ लिखने से नाम उपाधि में बदल जाता।
- issue: תַּמּוּז की पहचान
  choice: तम्मूज
  alternative: देवता तम्मूज
  rationale: मूल पाठ उचित नाम देता है, पर ‘देवता’ जैसा व्याख्यात्मक शब्द नहीं जोड़ता। सांस्कृतिक पहचान पादटिप्पणी में दी गई है।
- issue: מְבַכּוֹת का अनुष्ठानिक आशय
  choice: रो रही थीं
  alternative: शोक मना रही थीं
  rationale: मूल क्रिया का सीधा अर्थ ‘रोना’ है। प्रसंग अनुष्ठानिक शोक का संकेत देता है, पर मुख्य पाठ में उसी व्याख्या को अनिवार्य नहीं किया गया।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी। भविष्यद्वाणी की दृश्यात्मक तीव्रता के लिए ‘और देखो’ रखा गया है। मुख्य पाठ में सांस्कृतिक व्याख्या नहीं जोड़ी गई; उसे पादटिप्पणी में सीमित रखा गया है।
