  text: וַ/יֹּ֥אמֶר אֵלַ֖/י הֲ/רָאִ֣יתָ בֶן אָדָ֑ם ע֣וֹד תָּשׁ֥וּב תִּרְאֶ֛ה תּוֹעֵב֥וֹת גְּדֹל֖וֹת מֵ/אֵֽלֶּה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/008/015.yaml
  text: Then he said to me, “Have you seen this, son of man? You will see again still greater abominations than these.”
translation:
  language: hi
  text: तब उसने मुझसे कहा, “हे मनुष्य के पुत्र, क्या तुमने यह देखा? तुम फिर इनसे भी बड़े घिनौने काम देखोगे।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֶן אָדָם
  choice: हे मनुष्य के पुत्र
  rationale: इब्रानी संबोधन का औपचारिक अर्थ सुरक्षित रखते हुए यहेजकेल के लिए प्रयुक्त विशिष्ट संबोधन को बनाए रखता है।
- source_word: תּוֹעֵבוֹת
  choice: घिनौने काम
  rationale: यह बहुवचन उन धार्मिक और नैतिक कृत्यों को दर्शाता है जो परमेश्वर की दृष्टि में अत्यंत घृणित हैं; आधुनिक हिन्दी में 'घिनौने काम' स्पष्ट और स्वाभाविक है।
- source_word: ע֣וֹד תָּשׁ֥וּב תִּרְאֶ֛ה
  choice: तुम फिर ... देखोगे
  rationale: ע֣וֹד और תָּשׁוּב में निहित पुनरावृत्ति/आगे और देखने के भाव को सहज हिन्दी में व्यक्त करता है।
- source_word: גְּדֹלוֹת מֵאֵלֶּה
  choice: इनसे भी बड़े
  rationale: तुलनात्मक संरचना को सीधे रखता है और आगे आने वाले घिनौने कामों की अधिक गंभीरता व्यक्त करता है।
theological_decisions:
- issue: תּוֹעֵבוֹת का धार्मिक-नैतिक आशय
  choice: घिनौने काम
  alternative: घृणित काम / घृणित रीति-रिवाज
  rationale: पद केवल वस्तुओं या रीति-रिवाजों तक अर्थ सीमित नहीं करता; व्यापक 'काम' मूल की अस्पष्टता बनाए रखता है।
- issue: दिव्य वक्ता के लिंग का हिन्दी में प्रकटीकरण
  choice: उसने
  alternative: उस पुरुष ने / प्रभु ने
  rationale: निकटवर्ती संदर्भ में वक्ता स्पष्ट है, पर इस पद में नाम या उपाधि नहीं दी गई; इसलिए उसे जोड़ना उचित नहीं।
translation_notes:
  register: आधुनिक मानक हिन्दी; शैली सरल, गरिमापूर्ण और मौखिक पाठ में स्वाभाविक है। संबोधन में शास्त्रीय निरंतरता के लिए 'हे मनुष्य के पुत्र' रखा गया है।
