  text: וָ/אָבוֹא֮ וָֽ/אֶרְאֶה֒ וְ/הִנֵּ֨ה כָל תַּבְנִ֜ית רֶ֤מֶשׂ וּ/בְהֵמָה֙ שֶׁ֔קֶץ וְ/כָל גִּלּוּלֵ֖י בֵּ֣ית יִשְׂרָאֵ֑ל מְחֻקֶּ֥ה עַל הַ/קִּ֖יר סָבִ֥יב סָבִֽיב־־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/008/010.yaml
  text: So I went in and looked[a], and behold, every form of creeping thing and detestable beast, and all the idols of the house of Israel, were engraved on the wall all around.
translation:
  language: hi
  text: तब मैं भीतर गया और मैंने देखा—और देखो, दीवार पर चारों ओर रेंगनेवाले जीवों और घिनौने पशुओं की हर प्रकार की आकृतियाँ तथा इस्राएल के घराने की सारी मूर्तियाँ[a] खुदी हुई थीं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: मूर्तियों के लिए प्रयुक्त हिब्रू शब्द अत्यंत तिरस्कारपूर्ण है; इसका भाव ‘मल-मूर्तियाँ’ या ‘गंदी मूर्तियाँ’ भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאָבוֹא וָאֶרְאֶה
  choice: तब मैं भीतर गया और मैंने देखा
  rationale: दोनों वय्यिक्तोल क्रियाएँ कथा को आगे बढ़ाती हैं। ‘भीतर गया’ कक्ष में प्रवेश को और ‘मैंने देखा’ यहेजकेल के प्रत्यक्ष निरीक्षण को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וְהִנֵּה
  choice: और देखो
  rationale: यह दृश्य को सजीव और आकस्मिक ढंग से सामने लानेवाले हिब्रू संकेतक का बल बनाए रखता है।
- source_word: כָל תַּבְנִית רֶמֶשׂ
  choice: रेंगनेवाले हर प्रकार के जीव ... की आकृतियाँ
  rationale: תַּבְנִית यहाँ दीवार पर बने रूप या प्रतिरूप को बताता है और רֶמֶשׂ रेंगनेवाले जीवों के लिए व्यापक शब्द है।
- source_word: וּבְהֵמָה שֶׁקֶץ
  choice: और घिनौने पशुओं की आकृतियाँ
  rationale: בְהֵמָה को व्यापक अर्थ में ‘पशु’ और שֶׁקֶץ के तीव्र मूल्यांकन को ‘घिनौने’ से व्यक्त किया गया है; यह क्रम हिब्रू वाक्यांश की स्वाभाविक हिन्दी व्याख्या देता है।
- source_word: גִּלּוּלֵי בֵּית יִשְׂרָאֵל
  choice: इस्राएल के घराने की सारी मूर्तियाँ
  rationale: ‘घराना’ प्रचलित भविष्यद्वक्ताई पदबंध को बनाए रखता है। גִּלּוּלִים का मूल संकेत मूर्तियों से है, जबकि उसकी जानबूझकर अपमानजनक छाया पादटिप्पणी में स्पष्ट की गई है।
- source_word: מְחֻקֶּה עַל־הַקִּיר סָבִיב סָבִיב
  choice: दीवार पर चारों ओर ... खुदी हुई थीं
  rationale: ‘खुदी हुई’ חקק के उत्कीर्ण या काटकर बनाए जाने के भाव को व्यक्त करता है; ‘चारों ओर’ दोहराए गए סָבִיב की व्यापकता को सहज हिन्दी में रखता है।
theological_decisions:
- issue: यहेजकेल द्वारा मूर्तियों के लिए प्रयुक्त तिरस्कारपूर्ण शब्द
  choice: मुख्य पाठ में ‘मूर्तियाँ’ और उसके साथ पादटिप्पणी
  alternative: ‘मल-मूर्तियाँ’ या ‘घिनौनी मूर्तियाँ’
  rationale: גִּלּוּלִים अत्यंत तिरस्कारपूर्ण शब्द है। ‘मूर्तियाँ’ सामान्य पाठक के लिए अर्थ स्पष्ट रखता है, और पादटिप्पणी मूल की अपमानजनक तीव्रता को बिना छिपाए बताती है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सहज मानक हिन्दी। ‘और देखो’ से भविष्यद्वक्ताई दृश्य की सजीवता रखी गई है; वाक्य-विन्यास हिन्दी की स्वाभाविकता के लिए व्यवस्थित किया गया है।
