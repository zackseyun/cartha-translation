base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/008/012.yaml
  text: Then he said to me[a], “Have you seen, son of man, what the elders of the house of Israel are doing in the darkness, each man in the rooms of his carved image? For they are saying, ‘Yahweh does not see us[c][b]; Yahweh has abandoned the land.’”
translation:
  language: hi
  text: तब उसने मुझसे कहा, “हे मनुष्य के पुत्र, क्या तुमने देखा कि इस्राएल के घराने के बुज़ुर्ग अँधेरे में क्या कर रहे हैं, हर एक अपने चित्रित प्रतिरूप वाले भीतरी कक्षों में?[a] क्योंकि वे कहते हैं, ‘याहवे हमें नहीं देखता; याहवे ने भूमि को छोड़ दिया है।’[b][c]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “हर एक अपने चित्रमय प्रतिरूपों के भीतरी कक्षों में” अथवा “हर एक अपनी प्रतिमा वाले कमरे में।” इब्रानी शब्द चित्रित, उकेरी हुई या अन्य रूप में बनाई गई आकृति अथवा प्रतिरूप को सूचित कर सकता है; यहाँ सम्भवतः मूर्तिपूजक प्रतिरूप अभिप्रेत हैं।
    reason: lexical_alternative
  - marker: b
    text: या “याहवे ने भूमि को त्याग दिया है।”
    reason: lexical_alternative
  - marker: c
    text: “भूमि” से सम्भवतः इस्राएल या यहूदा की भूमि अभिप्रेत है; इब्रानी शब्द का अनुवाद “पृथ्वी” भी हो सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֹּאמֶר אֵלַי
  choice: तब उसने मुझसे कहा
  rationale: वाव-क्रमागत रूप कथा को आगे बढ़ाता है; ‘तब’ स्वाभाविक हिन्दी में क्रम को व्यक्त करता है।
- source_word: הֲרָאִיתָ
  choice: क्या तुमने देखा
  rationale: प्रश्नवाचक पूर्ण रूप उस दृश्य की ओर संकेत करता है जो यहेजकेल को दिखाया जा चुका है।
- source_word: בֶן אָדָם
  choice: हे मनुष्य के पुत्र
  rationale: यहेजकेल को बार-बार दिए गए इस विशिष्ट सम्बोधन का साहित्यिक स्वरूप बनाए रखा गया है।
- source_word: זִקְנֵי בֵית יִשְׂרָאֵל
  choice: इस्राएल के घराने के बुज़ुर्ग
  rationale: ‘इस्राएल का घराना’ यहेजकेल की महत्वपूर्ण अभिव्यक्ति है; आधुनिक हिन्दी में זִקְנֵי के लिए ‘बुज़ुर्ग’ स्वाभाविक है।
- source_word: עֹשִׂים בַּחֹשֶׁךְ
  choice: अँधेरे में क्या कर रहे हैं
  rationale: यह दृश्य के वास्तविक अँधेरे और गुप्त रूप से किए जा रहे काम—दोनों अर्थों को खुला रखता है।
- source_word: אִישׁ בְּחַדְרֵי מַשְׂכִּיתוֹ
  choice: हर एक अपनी उकेरी हुई आकृतियों वाले भीतरी कक्षों में
  rationale: אִישׁ का वितरणात्मक भाव ‘हर एक’ से और חַדְרֵי का भीतरी कमरों का भाव ‘भीतरी कक्षों’ से व्यक्त होता है। מַשְׂכִּית की चित्र, आकृति या नक्काशी की अर्थ-सीमा को ‘उकेरी हुई आकृतियाँ’ पर्याप्त रूप से बनाए रखता है।
- source_word: כִּי אֹמְרִים
  choice: क्योंकि वे कहते हैं
  rationale: यह उनके छिपकर किए जाने वाले कार्यों के पीछे की धारणा या कारण प्रस्तुत करता है।
- source_word: אֵין יְהוָה רֹאֶה אֹתָנוּ
  choice: याहवे हमें नहीं देखता
  rationale: नकारात्मक कृदन्त वाक्य का सीधा और स्वाभाविक हिन्दी रूप है; יְהוָה को उसके व्यक्तिगत वाचा-नाम ‘याहवे’ से प्रस्तुत किया गया है।
- source_word: עָזַב יְהוָה אֶת הָאָרֶץ
  choice: याहवे ने देश को छोड़ दिया है
  rationale: עָזַב में त्यागने या छोड़ देने का प्रबल भाव है। सन्दर्भ में הָאָרֶץ सम्भवतः इस्राएल/यहूदा के देश को सूचित करता है, जबकि व्यापक अर्थ की सम्भावना पादटिप्पणी में रखी गई है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: प्रभु; यहोवा
  rationale: मूल पाठ व्यक्तिगत वाचा-नाम का प्रयोग करता है; उसका लिप्यन्तरण नाम की विशिष्टता बनाए रखता है।
- issue: הָאָרֶץ का भौगोलिक विस्तार
  choice: देश
  alternative: भूमि; पृथ्वी
  rationale: मन्दिर और निर्वासन के सन्दर्भ में सम्भावित आशय इस्राएल/यहूदा का देश है, पर मूल शब्द की व्यापक सम्भावना पादटिप्पणी में सुरक्षित रखी गई है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सुबोध रखी गई है। ‘भीतरी कक्ष’ दृश्य की गुप्तता और स्थान की अन्दरूनी प्रकृति दोनों व्यक्त करता है। सम्बोधन में आधुनिक सम्मानसूचक ‘तुम’ रखा गया है, जबकि ‘हे मनुष्य के पुत्र’ से यहेजकेल में दोहराया गया भविष्यद्वक्ताई पदनाम सुरक्षित रहता है।
