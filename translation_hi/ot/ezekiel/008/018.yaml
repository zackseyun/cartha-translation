source:
  edition: WLC
  text: וְ/גַם אֲנִי֙ אֶעֱשֶׂ֣ה בְ/חֵמָ֔ה לֹֽא תָח֥וֹס עֵינִ֖/י וְ/לֹ֣א אֶחְמֹ֑ל וְ/קָרְא֤וּ בְ/אָזְנַ/י֙ ק֣וֹל גָּד֔וֹל וְ/לֹ֥א אֶשְׁמַ֖ע אוֹתָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/008/018.yaml
  text: And I also will act in wrath; my eye will not spare[a], nor will I have compassion. Though they cry in my ears with a loud voice, I will not hear them.
translation:
  language: hi
  text: और मैं भी क्रोध में कार्य करूँगा; मेरी आँख तरस नहीं खाएगी, और न मैं दया करूँगा। चाहे वे मेरे कानों में ऊँचे स्वर में पुकारें, फिर भी मैं उनकी नहीं सुनूँगा।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘वे मेरे कानों में ऊँचे स्वर में पुकारेंगे, पर मैं उनकी नहीं सुनूँगा।’
    reason: इब्रानी संयोजक का रियायती (‘चाहे ... फिर भी’) अनुवाद संदर्भानुकूल है, किंतु साधारण समन्वयी/विरोधी अनुवाद भी संभव है।
lexical_decisions:
- source_word: וְגַם אֲנִי
  choice: इसलिए मैं भी
  rationale: וְגַם निरंतरता के साथ बल देता है और אֲנִי कर्ता पर जोर देता है। पिछले न्याय-वर्णन के परिणाम को आधुनिक हिन्दी में स्वाभाविक रूप से जोड़ने के लिए ‘इसलिए मैं भी’ चुना गया।
- source_word: אֶעֱשֶׂה בְחֵמָה
  choice: प्रचण्ड क्रोध में कार्य करूँगा
  rationale: עשה का व्यापक अर्थ यहाँ निर्णायक कार्रवाई है, जबकि חֵמָה तीव्र, दहकते क्रोध को व्यक्त करता है।
- source_word: לֹא תָחוֹס עֵינִי
  choice: मेरी आँख तरस नहीं खाएगी
  rationale: मूल पाठ की मानव-सदृश आँख वाली ठोस छवि को हिन्दी के स्वाभाविक मुहावरे ‘आँख तरस खाना’ से सुरक्षित रखा गया।
- source_word: וְלֹא אֶחְמֹל
  choice: और न मैं दया करूँगा
  rationale: חמל में करुणा अथवा दया का भाव है; इसे पिछले חס से अलग ढंग से प्रस्तुत करने से समानांतर कथनों का अर्थ-सूक्ष्म अंतर बना रहता है।
- source_word: וְקָרְאוּ בְאָזְנַי קוֹל גָּדוֹל
  choice: चाहे वे मेरे कानों में ऊँचे स्वर से पुकारें
  rationale: साधारण संयोजक वाक्य-संदर्भ में रियायती विरोध प्रकट करता है। ‘मेरे कानों में’ मूल की सजीव अभिव्यक्ति और ‘ऊँचे स्वर से’ קוֹל גָּדוֹל का स्वाभाविक हिन्दी रूप बनाए रखते हैं।
- source_word: וְלֹא אֶשְׁמַע אוֹתָם
  choice: फिर भी मैं उनकी नहीं सुनूँगा
  rationale: שמע का सीधा अर्थ सुनना है, पर इस संदर्भ में उत्तर न देने का भाव भी निहित है। ‘उनकी नहीं सुनूँगा’ हिन्दी में दोनों अर्थों को स्वाभाविक रूप से वहन करता है।
theological_decisions:
- issue: ईश्वरीय न्याय की कठोर और मानव-सदृश भाषा
  choice: ‘प्रचण्ड क्रोध,’ ‘मेरी आँख तरस नहीं खाएगी’ और ‘न मैं दया करूँगा’ को सीधी ईश्वरीय वाणी के रूप में बनाए रखा गया।
  alternative: इसे अमूर्त रूप में ‘मैं उन्हें कठोर दण्ड दूँगा’ या केवल ‘मैं दया नहीं दिखाऊँगा’ कहा जा सकता था।
  rationale: इब्रानी पाठ न्याय को व्यक्तिगत, तीव्र और मानव-सदृश भाषा में प्रस्तुत करता है; उसे नरम या अमूर्त करना मूल का धार्मिक तनाव घटा देता।
- issue: अंतिम पुकार और न सुनने के बीच रियायती संबंध
  choice: ‘चाहे ... फिर भी’
  alternative: ‘और वे ... पुकारेंगे, पर मैं उनकी नहीं सुनूँगा।’
  rationale: मूल संयोजक औपचारिक रूप से सामान्य है, पर प्रसंग स्पष्ट विरोध और निष्फल पुकार व्यक्त करता है। चुना हुआ रूप संबंध स्पष्ट करता है, बिना घटना में नई बात जोड़े।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सहज स्तर रखा गया है। ‘मेरी आँख तरस नहीं खाएगी’ मूल की ठोस छवि को बचाता है; ‘उनकी नहीं सुनूँगा’ केवल ध्वनि न सुन पाने के बजाय जानबूझकर ध्यान न देने का प्रसंगगत भाव भी देता है।
