  text: וַ/יְהִ֣י בַּ/שָּׁנָ֣ה הַ/שִּׁשִּׁ֗ית בַּ/שִּׁשִּׁי֙ בַּ/חֲמִשָּׁ֣ה לַ/חֹ֔דֶשׁ אֲנִי֙ יוֹשֵׁ֣ב בְּ/בֵיתִ֔/י וְ/זִקְנֵ֥י יְהוּדָ֖ה יוֹשְׁבִ֣ים לְ/פָנָ֑/י וַ/תִּפֹּ֤ל עָלַ/י֙ שָׁ֔ם יַ֖ד אֲדֹנָ֥/י יְהֹוִֽה׀׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/008/001.yaml
  text: And it happened in the sixth year[a], in the sixth month, on the fifth day of the month, as I was sitting in my house and the elders of Judah were sitting before me[b], that the hand of the Lord GOD fell upon me there.
translation:
  language: hi
  text: छठे वर्ष[a] के छठे महीने के पाँचवें दिन, जब मैं अपने घर में बैठा था और यहूदा के पुरनिये मेरे सामने बैठे थे, तब वहीं प्रभु याहवे का हाथ मुझ पर आ पड़ा।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ यह नहीं बताया गया है कि छठा वर्ष किस घटना से गिना गया है; निर्वासन का उल्लेख संदर्भ से समझा जाता है।
    reason: implicit_context
  - marker: b
    text: 'शाब्दिक रूप से: “वहीं प्रभु याहवे का हाथ मुझ पर आ पड़ा।” “वहीं” स्थानवाचक है; कुछ अनुवाद इसे “तब” के अर्थ में प्रस्तुत करते हैं।'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: तब ... हुआ
  rationale: यह कथात्मक सूत्र नए दृश्य का आरम्भ करता है; हिंदी वाक्य में काल-संदर्भ और मुख्य घटना की संरचना इसे स्वाभाविक रूप से व्यक्त करती है।
- source_word: בַּשָּׁנָה הַשִּׁשִּׁית
  choice: छठे वर्ष
  rationale: मूल में वर्ष किस घटना से गिना गया है, यह स्पष्ट नहीं किया गया; इसलिए मुख्य पाठ में संदर्भगत विस्तार नहीं जोड़ा गया।
- source_word: בַּשִּׁשִּׁי בַּחֲמִשָּׁה לַחֹדֶשׁ
  choice: छठे महीने के पाँचवें दिन
  rationale: हिब्रू तिथि-सूत्र का सटीक और स्वाभाविक आधुनिक हिंदी रूप।
- source_word: אֲנִי יוֹשֵׁב בְּבֵיתִי
  choice: जब मैं अपने घर में बैठा था
  rationale: कृदंत रचना मुख्य घटना की पृष्ठभूमि में जारी अवस्था बताती है।
- source_word: וְזִקְנֵי יְהוּדָה
  choice: यहूदा के पुरनिये
  rationale: यह मान्यताप्राप्त वरिष्ठ अगुओं को दर्शाता है; 'पुरनिये' बाइबलीय संदर्भ में सुबोध और गरिमापूर्ण है।
- source_word: יוֹשְׁבִים לְפָנָי
  choice: मेरे सामने बैठे थे
  rationale: यह भौतिक उपस्थिति तथा भविष्यद्वक्ता के सम्मुख सभा, दोनों भावों को स्वाभाविक रूप से रखता है।
- source_word: וַתִּפֹּל עָלַי
  choice: मुझ पर आ पड़ा
  rationale: נפל על की प्रबल और अकस्मात क्रिया को बनाए रखते हुए हिंदी मुहावरे में स्वाभाविक अभिव्यक्ति।
- source_word: שָׁם
  choice: वहीं
  rationale: मूल क्रियाविशेषण सामान्यतः स्थानवाचक 'वहाँ' है; 'वहीं' प्रसंग में उस स्थान पर बल देता है और इसे कालवाचक 'तब' में नहीं बदलता।
- source_word: יַד
  choice: हाथ
  rationale: प्रभु की सामर्थ्य और प्रभावकारी उपस्थिति का भविष्यद्वक्ताओं में प्रयुक्त सजीव मुहावरा है; इसे व्याख्यात्मक रूप से केवल 'शक्ति' नहीं बनाया गया।
- source_word: אֲדֹנָי יְהוִה
  choice: प्रभु यहोवा
  rationale: उपाधि אֲדֹנָי और दिव्य नाम יהוה दोनों को अलग-अलग और स्पष्ट रूप से दर्शाता है।
theological_decisions:
- issue: संयुक्त पद אֲדֹנָי יְהוִה में दिव्य नाम का अनुवाद
  choice: प्रभु यहोवा
  alternative: प्रभु याहवे
  rationale: मूल में उपाधि और परमेश्वर का निजी नाम दोनों हैं। हिंदी बाइबल-पाठकों में परिचित 'यहोवा' नाम को रखते हुए इसे केवल 'परमेश्वर' या दोहरे 'प्रभु' में विलीन नहीं किया गया।
- issue: ‘यहोवा का हाथ’ मुहावरे का अर्थ
  choice: प्रभु यहोवा का हाथ मुझ पर आ पड़ा
  alternative: प्रभु यहोवा की शक्ति मुझ पर आई
  rationale: मूल की देहात्मक छवि और भविष्यद्वाणी संबंधी प्रबल दैवी क्रिया को सुरक्षित रखा गया; उसका आशय मुख्य पाठ में सीमित नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण, कथात्मक शैली अपनाई गई है। तिथि-सूत्र संक्षिप्त रखा गया है, ‘पुरनिये’ सामुदायिक अगुओं के लिए प्रयुक्त है, और भविष्यद्वाणी संबंधी ‘हाथ ... आ पड़ा’ की मूल छवि सुरक्षित रखी गई है।
