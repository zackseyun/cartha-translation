  text: בֶּן אָדָ֕ם הִנָּבֵא֙ וְ/אָ֣מַרְתָּ֔ כֹּ֥ה אָמַ֖ר אֲדֹנָ֣/י יְהוִ֑ה הֵילִ֖ילוּ הָ֥הּ לַ/יּֽוֹם־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/030/002.yaml
  text: 'Son of man[a], prophesy and say, ‘Thus says the Lord GOD: Wail[b], “Alas for the day!”’'
translation:
  language: hi
  text: 'हे मनुष्य के पुत्र, भविष्यवाणी कर और कह, ‘प्रभु याहवे यों कहता है: विलाप करो[a], “हाय उस दिन के लिए!”[b]’'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इसका अनुवाद “जोर से रोओ” या “हाहाकार करो” भी हो सकता है। हिब्रू क्रिया मुखर शोक-क्रंदन व्यक्त करती है।
    reason: lexical_alternative
  - marker: b
    text: हिब्रू में संक्षिप्त रूप से “हाय उस दिन के लिए!” है। यह उद्गार उस आने वाले दिन को लेकर शोक या भय व्यक्त करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן אָדָם
  choice: मनुष्य के पुत्र
  rationale: यहेजकेल को परमेश्वर द्वारा संबोधित करने का यह पुस्तक भर में बार-बार आने वाला निश्चित पदबंध है। यह हिब्रू रूपक को बनाए रखता है और सामान्य हिन्दी पाठक के लिए बोधगम्य है।
- source_word: הִנָּבֵא
  choice: भविष्यवाणी कर
  rationale: नבא के आदेशात्मक रूप का सीधा और स्वाभाविक हिन्दी समतुल्य, जो नबी को परमेश्वर का संदेश सुनाने की आज्ञा देता है।
- source_word: וְאָמַרְתָּ
  choice: और कह
  rationale: यह पहले आदेश के बाद आने वाले दूसरे आदेश को संक्षिप्त और स्पष्ट रूप में बनाए रखता है।
- source_word: כֹּה אָמַר
  choice: यों कहता है
  rationale: नबूवत में प्रयुक्त संदेशवाहक-सूत्र का प्रचलित, गरिमापूर्ण हिन्दी रूप।
- source_word: אֲדֹנָי יְהוִה
  choice: प्रभु यहोवा
  rationale: אֲדֹנָי को ‘प्रभु’ और व्यक्तिगत दिव्य नाम יהוה को ‘यहोवा’ के रूप में अलग-अलग व्यक्त करता है, जिससे संयुक्त उपाधि के दोनों अंग सुरक्षित रहते हैं।
- source_word: הֵילִילוּ
  choice: विलाप करो
  rationale: बहुवचन आदेश तीव्र शोक-क्रंदन का आह्वान करता है। ‘विलाप करो’ आधुनिक हिन्दी में स्वाभाविक है और केवल सामान्य दुःख नहीं, मुखर शोक व्यक्त करता है।
- source_word: הָהּ
  choice: हाय
  rationale: यह आने वाले संकट पर शोक और भय की उद्गारवाचक ध्वनि को संक्षेप में व्यक्त करता है।
- source_word: לַיּוֹם
  choice: वह दिन
  rationale: मुहावरेदार हिन्दी में ‘हाय, वह दिन!’ हिब्रू के संक्षिप्त और अशुभ उद्गार को बनाए रखता है; संबंधसूचक ל का अधिक शाब्दिक रूप पादटिप्पणी में दिया गया है।
theological_decisions:
- issue: אֲדֹנָי יְהוִה में दिव्य नाम का अनुवाद
  choice: प्रभु यहोवा
  alternative: प्रभु परमेश्वर
  rationale: मूल पाठ में יהוה व्यक्तिगत दिव्य नाम है। ‘यहोवा’ उसे सामान्य पदवी ‘परमेश्वर’ में बदलने के बजाय नाम के रूप में सुरक्षित रखता है, जबकि אֲדֹנָי का अनुवाद ‘प्रभु’ किया गया है।
- issue: ‘उस दिन’ की पहचान
  choice: उद्गार को संक्षिप्त और अनिर्दिष्ट रखा गया है
  alternative: न्याय का आने वाला दिन
  rationale: निकटवर्ती संदर्भ उस दिन को न्याय से जोड़ता है, पर इस पद में केवल ‘वह दिन’ कहा गया है। इसलिए व्याख्यात्मक शब्द मुख्य पाठ में नहीं जोड़े गए।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की है, पर नबूवत की गरिमा और संक्षिप्तता बनाए रखी गई है। उद्धरण के भीतर उद्धरण से वक्ताओं का क्रम स्पष्ट किया गया है। ‘मनुष्य के पुत्र’ और ‘यों कहता है’ जैसे आवर्ती बाइबलीय पदबंधों में औपचारिकता रखी गई है, जबकि उद्गार को स्वाभाविक हिन्दी बनाया गया है।
