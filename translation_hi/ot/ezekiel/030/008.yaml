  text: וְ/יָדְע֖וּ כִּֽי אֲנִ֣י יְהוָ֑ה בְּ/תִתִּ/י אֵ֣שׁ בְּ/מִצְרַ֔יִם וְ/נִשְׁבְּר֖וּ כָּל עֹזְרֶֽי/הָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/030/008.yaml
  text: Then they will know that I am Yahweh[a], when I set fire to Egypt and all her helpers are broken.
translation:
  language: hi
  text: तब वे जानेंगे कि मैं याहवे हूँ, जब मैं मिस्र में आग लगाऊँगा और उसके सब सहायक[a] तोड़ दिए जाएँगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘उसके सब सहयोगी तोड़ दिए जाएँगे।’ इब्रानी में शाब्दिक रूप से ‘उसके सब सहायक’ है; इसका संकेत मिस्र का साथ देने वाले राष्ट्रों या सैन्य बलों की ओर हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָדְעוּ
  choice: तब वे जानेंगे
  rationale: संदर्भ में वाव घोषित न्याय के परिणाम की ओर ले जाता है; ‘तब’ इस प्रवाह को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: כִּי אֲנִי יְהוָה
  choice: कि मैं यहोवा हूँ
  rationale: כִּי यहाँ ज्ञात होने वाली बात का परिचय देता है। परमेश्वर के व्यक्तिगत नाम को हिन्दी में प्रचलित लिप्यंतरण ‘यहोवा’ से व्यक्त किया गया है।
- source_word: בְּתִתִּי אֵשׁ בְּמִצְרַיִם
  choice: जब मैं मिस्र में आग लगाऊँगा
  rationale: בְּ के साथ infinitive construct समयसूचक है, और בְּמִצְרַיִם का स्थानवाचक अर्थ ‘मिस्र में’ बनाए रखा गया है।
- source_word: וְנִשְׁבְּרוּ
  choice: और ... तोड़ दिए जाएँगे
  rationale: שׁבר का निफ़अल रूप टूटने या चकनाचूर किए जाने का कर्मवाच्य भाव देता है; भविष्यवाणी के सापेक्ष भावी घटना को हिन्दी भविष्यत् कर्मवाच्य में रखा गया है।
- source_word: כָּל עֹזְרֶיהָ
  choice: उसके सब सहायक
  rationale: עֹזְרֶיהָ का सीधा अर्थ ‘उसके सहायक’ है; यह मिस्र की सहायता करने वाले राष्ट्रों या सैन्य बलों को सूचित कर सकता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ में चार अक्षरों वाला व्यक्तिगत ईश्वरीय नाम है, इसलिए इसे किसी उपाधि से बदलने के बजाय हिन्दी में परिचित नाम-रूप ‘यहोवा’ रखा गया है।
- issue: עֹזְרֶיהָ की पहचान
  choice: उसके सब सहायक
  alternative: उसके सब सहयोगी राष्ट्र
  rationale: मूल शब्द व्यापक ‘सहायकों’ को दर्शाता है; अधिक विशिष्ट ‘सहयोगी राष्ट्र’ सम्भव है, पर मूल की अर्थगत व्यापकता को सीमित कर देगा।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण और मूल के निकट शैली। ‘मिस्र में’ द्वारा मूल स्थानवाचक प्रयोग सुरक्षित रखा गया है; ‘सहायक’ जानबूझकर व्यापक रखा गया है।
