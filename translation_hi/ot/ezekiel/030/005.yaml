base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/030/005.yaml
  text: Cush and Put and Lud and all the mixed people and Cub and the sons of the land of the covenant—with them they will fall by the sword[a][b][c].
translation:
  language: hi
  text: कूश, पूत, लूद, सारे मिले-जुले लोग[a], कूब[b] और वाचा के देश के पुत्र[c]—वे उनके साथ तलवार से गिर पड़ेंगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “सारा अरब,” “सभी भाड़े के सैनिक,” अथवा “सारा मिला-जुला जनसमुदाय।” यहाँ प्रयुक्त इब्रानी शब्द עֶרֶב का अर्थ विवादित है।
    reason: lexical_alternative
  - marker: b
    text: “कूब” एक दुर्लभ स्थान-नाम है और उसकी पहचान निश्चित नहीं है।
    reason: lexical_alternative
  - marker: c
    text: या “वाचा के देश के लोग।” यह पद संधि से जुड़े लोगों को सूचित कर सकता है; कुछ लोग इसे मिस्र में रहने वाले यहूदियों के लिए प्रयुक्त मानते हैं।
    reason: alternative_reading
