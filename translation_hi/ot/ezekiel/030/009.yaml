  to: उस दिन मेरे सामने से दूत जहाज़ों में निकलेंगे, ताकि वे निश्चिंत कूश को भयभीत करें। मिस्र के दिन[a] उन पर कंपकंपी छा जाएगी, क्योंकि देखो, वह आने ही वाली है।
