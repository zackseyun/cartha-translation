source:
  edition: WLC
  text: בַּ/יּ֣וֹם הַ/ה֗וּא יֵצְא֨וּ מַלְאָכִ֤ים מִ/לְּ/פָנַ/י֙ בַּ/צִּ֔ים לְ/הַחֲרִ֖יד אֶת כּ֣וּשׁ בֶּ֑טַח וְ/הָיְתָ֨ה חַלְחָלָ֤ה בָ/הֶם֙ בְּ/י֣וֹם מִצְרַ֔יִם כִּ֥י הִנֵּ֖ה בָּאָֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/030/009.yaml
  text: On that day messengers will go out from before me in ships to terrify Cush[a], secure as she is, and trembling will come upon them on the day of Egypt, for behold[c][b], it is coming.
translation:
  language: hi
  text: उस दिन मेरे सामने से दूत जहाज़ों में निकलेंगे, ताकि वे निश्चिंत कूश को भयभीत करें। मिस्र के दिन[a] उन पर कंपकंपी छा जाएगी, क्योंकि देखो, वह आने ही वाली है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात वह दिन जब मिस्र पर न्याय आएगा।
    reason: cultural_note
lexical_decisions:
- source_word: מַלְאָכִים
  choice: दूत
  rationale: इस भू-राजनीतिक न्याय-संदर्भ में यह मनुष्यों के समाचारवाहकों या प्रतिनिधियों को सूचित करता है; ‘दूत’ हिब्रू की व्यापकता बनाए रखता है।
- source_word: מִלְּפָנַי
  choice: मेरे सामने से
  rationale: हिब्रू मुहावरे में उपस्थिति का भाव स्पष्ट है; यह दर्शाता है कि दूत सीधे दिव्य वक्ता की उपस्थिति से निकलते हैं।
- source_word: בַּצִּים
  choice: जहाज़ों में
  rationale: यह शब्द जलमार्ग से चलने वाले पोतों को सूचित करता है; संदर्भ में ‘जहाज़ों में’ स्वाभाविक और सटीक है।
- source_word: לְהַחֲרִיד
  choice: थर्रा देंगे
  rationale: हिफ़ील रूप भय और कंपकंपी उत्पन्न करने का कारणवाचक भाव रखता है; ‘थर्रा देंगे’ उसी तीव्रता को व्यक्त करता है।
- source_word: כּוּשׁ
  choice: कूश
  rationale: प्राचीन स्थान-नाम को व्याख्यात्मक आधुनिक भौगोलिक पहचान से बदलने के बजाय लिप्यंतरित किया गया है।
- source_word: בֶּטַח
  choice: निश्चिंत
  rationale: यह सुरक्षा या बेफ़िक्री की अवस्था बताता है और आने वाले भय के साथ निहित विडंबना को स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: חַלְחָלָה
  choice: कंपकंपी
  rationale: संज्ञा शारीरिक कंपकंपी और भीतरी व्याकुलता दोनों का बोध कराती है; यह पिछले खंड के भय-विषय को भी आगे बढ़ाती है।
- source_word: בְּיוֹם מִצְרַיִם
  choice: मिस्र के दिन
  rationale: हिब्रू की संक्षिप्त अभिव्यक्ति को बनाए रखते हुए इसे मिस्र पर न्याय आने के समय के रूप में समझने हेतु पादटिप्पणी दी गई है।
- source_word: כִּי הִנֵּה בָּאָה
  choice: क्योंकि देखो, वह दिन आ रहा है
  rationale: स्त्रीलिंग क्रिया निकट आती विपत्ति या ‘दिन’ की ओर संकेत करती है। हिंदी में स्पष्ट संदर्भ के लिए ‘वह दिन’ कहा गया है, जबकि उसकी आसन्न निश्चितता बनी रहती है।
theological_decisions:
- issue: भविष्यद्वाणी के न्याय में दिव्य वक्ता का दृष्टिकोण
  choice: ‘मेरे सामने से’ कहकर यहोवा को प्रत्यक्ष वक्ता और दूतों के प्रस्थान का स्रोत बनाए रखा गया है।
  alternative: केवल ‘मेरी ओर से’ कहना, जिसमें उपस्थिति की छवि कम स्पष्ट होती।
  rationale: मूल हिब्रू में ‘मुख/सामने’ की भाषा है; इसे बनाए रखने से न्याय के परमेश्वर की अपनी उपस्थिति से निकलने का चित्र सुरक्षित रहता है।
- issue: בָאָה का व्याकरणिक संकेत
  choice: ‘वह दिन आ रहा है’
  alternative: ‘वह [विपत्ति] आ रही है’
  rationale: स्त्रीलिंग क्रिया का निहित कर्ता ‘दिन’ के अर्थ में יוֹם नहीं हो सकता क्योंकि वह पुल्लिंग है; संभवतः कोई निहित विपत्ति या घटना अभिप्रेत है। फिर भी संदर्भ में आने वाली न्याय-घटना को स्पष्ट करने के लिए ‘वह दिन’ स्वाभाविक हिंदी है, पर मूल की संदर्भगत अस्पष्टता को निर्णय-टिप्पणी में दर्ज किया गया है।
translation_notes:
  register: आधुनिक मानक हिंदी में गंभीर भविष्यद्वाणी-संबंधी शैली रखी गई है। ‘दूत’, ‘निश्चिंत’, ‘थर्रा देंगे’ और ‘कंपकंपी’ सामान्य पाठक के लिए सुबोध हैं, फिर भी मूल की तीव्रता और उपस्थिति-भाषा सुरक्षित रखते हैं।
