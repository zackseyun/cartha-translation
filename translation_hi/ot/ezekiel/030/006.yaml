id: EZK.30.6
reference: Ezekiel 30:6
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: כֹּ֚ה אָמַ֣ר יְהוָ֔ה וְ/נָֽפְלוּ֙ סֹמְכֵ֣י מִצְרַ֔יִם וְ/יָרַ֖ד גְּא֣וֹן עֻזָּ֑/הּ מִ/מִּגְדֹּ֣ל סְוֵנֵ֗ה בַּ/חֶ֨רֶב֙ יִפְּלוּ בָ֔/הּ נְאֻ֖ם אֲדֹנָ֥/י יְהוִֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/030/006.yaml
  text: 'Thus says Yahweh: The supporters of Egypt will fall[a], and the pride of her strength will come down. From Migdol to Syene they will fall by the sword within her[c][b], declares the Lord GOD.'
translation:
  language: hi
  text: 'याहवे यों कहते हैं: मिस्र को सहारा देनेवाले गिर पड़ेंगे, और उसकी शक्ति का घमंड नीचे उतर जाएगा। मिग्दोल से लेकर सवेने तक वे उसके भीतर तलवार से मारे जाएँगे[a]—प्रभु याहवे की यह घोषणा है।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “वे उसके भीतर तलवार से गिर पड़ेंगे।”
    reason: मूल हिब्रू के युद्ध-संबंधी मुहावरे और בָהּ (“उसके भीतर”) की संरचना को दर्शाने वाला शाब्दिक विकल्प।
lexical_decisions:
- source_word: כֹּה אָמַר יְהוָה
  choice: याहवे यों कहते हैं
  rationale: भविष्यद्वाणी के मानक संदेश-सूत्र को स्वाभाविक हिन्दी में रखा गया और יהוה को उसके निज नाम ‘याहवे’ से व्यक्त किया गया।
- source_word: סֹמְכֵי מִצְרַיִם
  choice: मिस्र को सहारा देनेवाले
  rationale: סמך के सक्रिय कृदन्त का ‘सहारा देनेवाले’ सीधा अर्थ देता है और इसे केवल सैनिक सहयोगियों तक सीमित नहीं करता।
- source_word: גְּאוֹן עֻזָּהּ
  choice: उसकी शक्ति का घमंड
  rationale: גאון के ‘घमंड/गौरव’ और עז के ‘शक्ति’ अर्थों को बनाए रखते हुए न्याय के प्रसंग में नकारात्मक आशय स्वाभाविक रूप से व्यक्त किया गया।
- source_word: וְיָרַד
  choice: नीचे उतर जाएगा
  rationale: हिब्रू की अकर्मक क्रिया को बनाए रखा गया; ‘गिरा दिया जाएगा’ जैसी अप्रकट कर्मवाच्य धारणा नहीं जोड़ी गई।
- source_word: מִמִּגְדֹּל סְוֵנֵה
  choice: मिग्दोल से लेकर सवेने तक
  rationale: दोनों स्थान-नामों को लिप्यंतरित कर मिस्र के उत्तर-दक्षिण विस्तार का संकेत देनेवाली संरचना सुरक्षित रखी गई।
- source_word: בַּחֶרֶב יִפְּלוּ בָהּ
  choice: वे उसके भीतर तलवार से मारे जाएँगे
  rationale: ‘तलवार से गिरना’ युद्ध में मारे जाने का हिब्रू मुहावरा है; בָהּ के स्त्रीलिंग संकेत को ‘उसके भीतर’ द्वारा मिस्र देश से जोड़ा गया।
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: प्रभु याहवे की यह घोषणा है
  rationale: भविष्यद्वाणी के प्रामाणिक घोषणा-सूत्र को स्पष्ट और गरिमापूर्ण हिन्दी में प्रस्तुत किया गया तथा दोनों ईश्वरीय पदों का भेद बनाए रखा गया।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल में आए वाचा-संबंधी निज नाम को उपाधि में बदलने के बजाय लिप्यंतरित किया गया।
- issue: גְּאוֹן עֻזָּהּ का मूल्यांकनात्मक अर्थ
  choice: उसकी शक्ति का घमंड
  alternative: उसकी शक्ति का गौरव
  rationale: גאון में ‘गौरव’ और ‘घमंड’ दोनों अर्थ संभव हैं; न्याय के संदर्भ में ‘घमंड’ उपयुक्त है, जबकि पदबंध की संरचना और तनाव सुरक्षित रहते हैं।
- issue: יִפְּלוּ का युद्ध-संदर्भीय अर्थ
  choice: मारे जाएँगे
  alternative: गिर पड़ेंगे
  rationale: בַּחֶרֶב के साथ ‘गिरना’ तलवार से मृत्यु का मुहावरा है। हिन्दी में ‘मारे जाएँगे’ आशय स्पष्ट करता है; वैकल्पिक शाब्दिक रूप पादटिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट हिन्दी। ‘सवेने’ मूल שְׁוֵנֵה का निकट लिप्यंतरण है। मुख्य पाठ में केवल वही पादटिप्पणी रखी गई है जो वास्तविक मुहावरेगत/वाक्यरचनात्मक अंतर स्पष्ट करती है।
