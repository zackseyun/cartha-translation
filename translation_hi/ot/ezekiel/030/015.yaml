  text: וְ/שָׁפַכְתִּ֣י חֲמָתִ֔/י עַל סִ֖ין מָע֣וֹז מִצְרָ֑יִם וְ/הִכְרַתִּ֖י אֶת הֲמ֥וֹן נֹֽא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/030/015.yaml
  text: And I will pour out my wrath on Sin[a], the stronghold of Egypt[b], and I will cut off the multitude of No.
translation:
  language: hi
  text: और मैं मिस्र के गढ़, सीन[a], पर अपना क्रोध उण्डेलूँगा, और नो[b] के जनसमूह को मिटा दूँगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: सीन की पहचान सामान्यतः पेलूसियम से की जाती है, जो मिस्र की उत्तर-पूर्वी सीमा पर स्थित एक किलेबंद नगर था।
    reason: cross_reference
  - marker: b
    text: नो की पहचान सामान्यतः थीब्स से की जाती है। ‘जनसमूह’ के लिए प्रयुक्त इब्रानी शब्द का अर्थ ‘बहुतायत’ या ‘धन-संपदा’ भी हो सकता है।
    reason: textual_or_lexical_clarification
lexical_decisions:
- source_word: וְשָׁפַכְתִּי
  choice: और मैं ... उण्डेलूँगा
  rationale: שׁפך के मूल बिंब को बनाए रखते हुए भविष्यकालीन दैवी न्याय को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: חֲמָתִי
  choice: अपना क्रोध
  rationale: חֵמָה तीव्र, दहकते हुए रोष का सूचक है; ‘क्रोध’ आधुनिक हिन्दी में गंभीर और स्पष्ट है।
- source_word: עַל סִין
  choice: सीन पर
  rationale: स्थान-नाम סִין को ऐतिहासिक पहचान से प्रतिस्थापित करने के बजाय लिप्यंतरित किया गया है; עַל का स्थानगत रूप ‘पर’ रखा गया है।
- source_word: מָעוֹז מִצְרָיִם
  choice: मिस्र के गढ़
  rationale: מָעוֹז किसी सुदृढ़ या किलेबंद स्थान को दर्शाता है; ‘गढ़’ संक्षिप्त, स्वाभाविक और पदबंध की विशेषणात्मक भूमिका के अनुकूल है।
- source_word: וְהִכְרַתִּי
  choice: और ... मिटा दूँगा
  rationale: כרת के हिफ़ील रूप का आशय निर्णायक रूप से समाप्त या नष्ट कर देना है; ‘मिटा दूँगा’ हिन्दी में उस न्यायात्मक बल को सहजता से पहुँचाता है।
- source_word: אֶת הֲמוֹן
  choice: भीड़ को
  rationale: הָמוֹן के ‘जनसमूह/बहुसंख्या’ अर्थ को ‘भीड़’ व्यक्त करता है, जबकि धन-संपदा या कोलाहल जैसे अन्य संभावित अर्थों को अनावश्यक रूप से नहीं जोड़ता।
- source_word: נֹא
  choice: नो
  rationale: हिब्रू स्थान-नाम को मुख्य पाठ में लिप्यंतरित रखा गया है; थीब्स से उसकी सामान्य पहचान पादटिप्पणी में दी गई है।
theological_decisions:
- issue: दैवी न्याय की प्रत्यक्ष और तीव्र भाषा
  choice: परमेश्वर के सक्रिय न्याय को ‘अपना क्रोध उण्डेलूँगा’ और ‘मिटा दूँगा’ के रूप में सीधे बनाए रखना
  alternative: भाषा को नरम करके ‘रोष प्रकट करूँगा’ या ‘दण्ड दूँगा’ कहना
  rationale: हिब्रू पाठ में वक्ता स्वयं इन न्यायकारी कार्यों का कर्ता है। अनुवाद उस तीव्रता और उत्तरदायित्व को कम नहीं करता।
- issue: הֲמוֹן का संदर्भगत अर्थ
  choice: ‘भीड़’
  alternative: ‘बहुतायत’, ‘धन-संपदा’ या ‘कोलाहल’
  rationale: नो जैसे नगर के साथ जनसमूह का अर्थ संदर्भ में सबसे सहज है, यद्यपि शब्द की व्यापक अर्थ-सीमा के कारण पादटिप्पणी में विकल्प बताया गया है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की है; वाक्य में भविष्यकालीन भविष्यवाणी और दैवी न्याय की गरिमा बनाए रखी गई है। स्थान-नामों को हिब्रू रूप के अनुसार लिप्यंतरित किया गया है और उनकी ऐतिहासिक पहचान पादटिप्पणियों में रखी गई है।
