base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/030/022.yaml
  text: 'Therefore thus says the Lord GOD: Behold[a], I am against Pharaoh king of Egypt, and I will break his arms, both the strong one and the broken one, and I will make the sword fall from his hand.'
translation:
  language: hi
  text: 'इसलिए प्रभु याहवे यह कहते हैं: देखो, मैं मिस्र के राजा फ़िरौन के विरुद्ध हूँ। मैं उसकी दोनों भुजाएँ—सशक्त भुजा और टूटी हुई भुजा[a]—तोड़ दूँगा, और उसके हाथ से तलवार गिरा दूँगा।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “सशक्त वाली और टूटी हुई वाली।” हिब्रू में ये दोनों रूप स्त्रीलिंग एकवचन हैं और पहले कही गई प्रत्येक “भुजा” की ओर संकेत करते हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: इसलिए
  rationale: यह पिछले न्याय-वचन से निकलने वाले निष्कर्ष को स्पष्ट और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: כֹּה אָמַר אֲדֹנָי יְהוִה
  choice: प्रभु याहवे यह कहते हैं
  rationale: यह भविष्यद्वक्ताओं के संदेश-सूत्र को स्वाभाविक आधुनिक हिन्दी में रखता है और यְהוִה को व्यक्तिगत वाचा-नाम ‘याहवे’ के रूप में सुरक्षित रखता है।
- source_word: הִנְנִי אֶל
  choice: देखो, मैं ... के विरुद्ध हूँ
  rationale: ‘देखो’ हִנְנִי के ध्यानाकर्षक और गंभीर बल को व्यक्त करता है; इस शत्रुतापूर्ण प्रसंग में אֶל का अर्थ ‘के विरुद्ध’ है।
- source_word: פַּרְעֹה מֶלֶךְ מִצְרַיִם
  choice: मिस्र के राजा फ़िरौन
  rationale: हिब्रू के पदवी-संबंध को हिन्दी की स्वाभाविक शब्द-व्यवस्था में व्यक्त करता है।
- source_word: וְשָׁבַרְתִּי אֶת זְרֹעֹתָיו
  choice: मैं उसकी दोनों भुजाएँ ... तोड़ दूँगा
  rationale: זְרֹעֹתָיו का ठोस ‘भुजाएँ’ रूप सैन्य शक्ति के रूपक को बनाए रखता है; आगे आए दो एकवचन विशेषणों के कारण ‘दोनों’ उचित रूप से स्पष्ट किया गया है।
- source_word: אֶת הַחֲזָקָה וְאֶת הַנִּשְׁבָּרֶת
  choice: सशक्त भुजा और टूटी हुई भुजा
  rationale: स्त्रीलिंग एकवचन रूप पहले आई ‘भुजाओं’ में से प्रत्येक की ओर संकेत करते हैं। संज्ञा को दोहराने से हिन्दी में संदर्भ स्पष्ट रहता है और यह अनावश्यक रूप से नहीं बताता कि दूसरी भुजा कब टूटी थी।
- source_word: וְהִפַּלְתִּי אֶת הַחֶרֶב מִיָּדוֹ
  choice: उसके हाथ से तलवार गिरा दूँगा
  rationale: हिफ़ील रूप का कारणवाचक अर्थ और फ़िरौन की सैन्य असमर्थता का सजीव चित्र दोनों सुरक्षित रहते हैं।
theological_decisions:
- issue: संयुक्त उपाधि אֲדֹנָי יְהוִה में परमेश्वर के नाम का अनुवाद
  choice: प्रभु याहवे
  alternative: प्रभु परमेश्वर
  rationale: אֲדֹנָי को ‘प्रभु’ और चतुरक्षरीय व्यक्तिगत नाम יְהוִה को ‘याहवे’ रखने से दोनों तत्व अलग पहचाने जाते हैं और स्रोत-पाठ में उपस्थित वाचा-नाम सुरक्षित रहता है।
- issue: फ़िरौन की भुजाओं की छवि
  choice: वास्तविक शारीरिक छवि को ‘भुजाएँ’ के रूप में बनाए रखना
  alternative: उसकी शक्ति
  rationale: पद में भुजाएँ, हाथ और तलवार एक संयुक्त सैन्य रूपक बनाते हैं; सीधे ‘शक्ति’ कहने से मूल चित्र और उसकी नाटकीयता घट जाती।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘देखो’ भविष्यद्वाणी की गंभीरता बनाए रखता है, जबकि ‘दोनों भुजाएँ’ और संज्ञा की पुनरावृत्ति हिब्रू व्याकरण को हिन्दी में स्पष्ट करती है।
