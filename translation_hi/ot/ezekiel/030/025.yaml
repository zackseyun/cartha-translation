source:
  edition: WLC
  text: וְ/הַחֲזַקְתִּ֗י אֶת זְרֹעוֹת֙ מֶ֣לֶךְ בָּבֶ֔ל וּ/זְרֹע֥וֹת פַּרְעֹ֖ה תִּפֹּ֑לְנָה וְֽ/יָדְע֞וּ כִּֽי אֲנִ֣י יְהוָ֗ה בְּ/תִתִּ֤/י חַרְבִּ/י֙ בְּ/יַ֣ד מֶֽלֶךְ בָּבֶ֔ל וְ/נָטָ֥ה אוֹתָ֖/הּ אֶל אֶ֥רֶץ מִצְרָֽיִם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/030/025.yaml
  text: I will strengthen the arms of the king of Babylon[a], but Pharaoh’s arms will fall. Then they will know that I am Yahweh[b], when I put my sword into the hand of the king of Babylon and he stretches it out against the land of Egypt.
translation:
  language: hi
  text: मैं बाबेल के राजा की भुजाओं को मज़बूत करूँगा, पर फ़िरौन की भुजाएँ गिर जाएँगी। तब वे जानेंगे कि मैं याहवे[a] हूँ, जब मैं अपनी तलवार बाबेल के राजा के हाथ में दूँगा और वह उसे मिस्र देश के विरुद्ध तानेगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में YHWH, परमेश्वर का व्यक्तिगत नाम।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַחֲזַקְתִּי
  choice: मैं ... बलवन्त करूँगा
  rationale: हिफ़ील रूप का कारणवाचक अर्थ है—बल देना या शक्तिशाली बनाना। यह सैन्य संदर्भ में स्वाभाविक है और भुजाओं के बिंब को बनाए रखता है।
- source_word: זְרֹעוֹת
  choice: भुजाओं
  rationale: इब्रानी का ठोस शारीरिक बिंब सुरक्षित रखा गया है; संदर्भ में यह सैन्य शक्ति को दर्शाता है।
- source_word: וּזְרֹעוֹת פַּרְעֹה תִּפֹּלְנָה
  choice: पर फ़िरौन की भुजाएँ गिर जाएँगी
  rationale: वाव को प्रसंगानुसार विरोधसूचक 'पर' किया गया है। 'गिर जाएँगी' נפל के सजीव पतन-बिंब को बनाए रखता है, बजाय उसका अर्थ केवल 'निर्बल हो जाएँगी' कर देने के।
- source_word: וְיָדְעוּ
  choice: तब वे जानेंगे
  rationale: '''तब'' पूर्ववर्ती दैवी कार्यों के परिणाम को आधुनिक हिन्दी में सहज रूप से व्यक्त करता है।'
- source_word: יְהוָה
  choice: यहोवा
  rationale: दैवी नाम YHWH को हिन्दी में व्यापक रूप से पहचाने जाने वाले नामरूप 'यहोवा' से प्रस्तुत किया गया है; इसे केवल उपाधि 'प्रभु' से प्रतिस्थापित नहीं किया गया।
- source_word: בְּתִתִּי חַרְבִּי בְּיַד מֶלֶךְ בָּבֶל
  choice: जब मैं अपनी तलवार बाबेल के राजा के हाथ में दूँगा
  rationale: נתן के 'देना/रखना' अर्थ और बाबेल के राजा को न्याय के साधन के रूप में सौंपे जाने की छवि दोनों सुरक्षित हैं।
- source_word: וְנָטָה אוֹתָהּ
  choice: और वह उसे ... बढ़ाएगा
  rationale: נטה का मूल 'फैलाना/बढ़ाना' अर्थ रखा गया है; स्त्रीलिंग सर्वनाम 'उसे' का संदर्भ तलवार से है।
- source_word: אֶל אֶרֶץ מִצְרָיִם
  choice: मिस्र देश के विरुद्ध
  rationale: אֶל मूलतः दिशा बताता है, पर शत्रुतापूर्ण सैन्य संदर्भ में 'के विरुद्ध' आशय को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: दैवी नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: मूल पाठ में व्यक्तिगत दैवी नाम है। हिन्दी पाठक के लिए प्रचलित नामरूप 'यहोवा' रखा गया और पादटिप्पणी में YHWH स्पष्ट किया गया, बिना इसे केवल एक उपाधि में बदलने के।
- issue: दैवी न्याय में बाबेल की भूमिका
  choice: परमेश्वर अपनी तलवार बाबेल के राजा के हाथ में देता है
  alternative: बाबेल के आक्रमण को दैवी साधन-संबंध बताए बिना प्रस्तुत करना
  rationale: मूल पाठ स्पष्टतः तलवार को यहोवा की और उसे धारण करने वाले को बाबेल का राजा बताता है। अनुवाद दैवी प्रभुता और मानवीय कर्तृत्व दोनों को सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज और बिंब-संरक्षक शैली अपनाई गई है। 'भुजाएँ गिर जाएँगी' जैसे असामान्य किंतु अर्थपूर्ण भविष्यद्वाणी-संबंधी बिंब को सरल व्याख्या से प्रतिस्थापित नहीं किया गया।
