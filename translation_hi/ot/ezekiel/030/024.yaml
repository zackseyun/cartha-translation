source:
  edition: WLC
  text: וְ/חִזַּקְתִּ֗י אֶת זְרֹעוֹת֙ מֶ֣לֶךְ בָּבֶ֔ל וְ/נָתַתִּ֥י אֶת חַרְבִּ֖/י בְּ/יָד֑/וֹ וְ/שָׁבַרְתִּי֙ אֶת זְרֹע֣וֹת פַּרְעֹ֔ה וְ/נָאַ֛ק נַאֲק֥וֹת חָלָ֖ל לְ/פָנָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/030/024.yaml
  text: And I will strengthen the arms of the king of Babylon[a], and I will put my sword into his hand; but I will break the arms of Pharaoh, and he will groan before him with the groanings of a slain man.
translation:
  language: hi
  text: और मैं बाबेल के राजा की भुजाओं को मज़बूत करूँगा और अपनी तलवार उसके हाथ में दूँगा; परन्तु फ़िरौन की भुजाओं को तोड़ दूँगा, और वह उसके सामने[a] मारे गए मनुष्य की-सी कराहें भरेगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मेरे सामने,” यदि अंतिम सर्वनाम का संकेत बाबेल के राजा के बजाय यहोवा की ओर माना जाए।
    reason: alternative_reading
lexical_decisions:
- source_word: חִזַּקְתִּי
  choice: बलवन्त करूँगा
  rationale: संयोजक वाव के साथ पूर्ण क्रिया यहाँ भविष्यसूचक क्रम में भविष्य का अर्थ देती है; यह सैन्य सामर्थ्य प्रदान करने का मूर्त रूपक भी बनाए रखती है।
- source_word: זְרֹעוֹת
  choice: भुजाओं
  rationale: शाब्दिक देह-चित्र को बनाए रखा गया है, क्योंकि इसी पद में बाबेल की भुजाओं को बलवन्त करने और फ़िरौन की भुजाओं को तोड़ने का जानबूझकर विरोध है।
- source_word: מֶלֶךְ בָּבֶל
  choice: बाबेल के राजा
  rationale: इब्रानी संबंध-रचना का सीधा और प्रचलित हिन्दी रूप; मूल में राजा का व्यक्तिगत नाम नहीं दिया गया है।
- source_word: נָתַתִּי אֶת חַרְבִּי בְּיָדוֹ
  choice: अपनी तलवार उसके हाथ में दूँगा
  rationale: यह सहज हिन्दी में मूल चित्र को सुरक्षित रखता है कि यहोवा न्याय के लिए बाबेल के राजा को अपना साधन बनाता है।
- source_word: שָׁבַרְתִּי
  choice: तोड़ डालूँगा
  rationale: भविष्यसूचक क्रम के अनुसार भविष्यकाल रखा गया है; ‘तोड़ डालना’ इस प्रसंग के टूट चुकी भुजा वाले प्रबल चित्र को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: נָאַק נַאֲקוֹת
  choice: कराहता रहेगा
  rationale: क्रिया और उसी धातु से बने संज्ञा-पद का बल हिन्दी में निरंतर और तीव्र कराह के रूप में व्यक्त किया गया है, बिना अस्वाभाविक ‘कराहों से कराहेगा’ कहे।
- source_word: חָלָל
  choice: मारे गए मनुष्य
  rationale: यह युद्ध में बेधे या मारे गए व्यक्ति को सूचित करता है; ‘मारे गए’ मृत्यु-संबंधी अर्थ को ‘घायल’ की अपेक्षा अधिक निकटता से सुरक्षित रखता है।
- source_word: לְפָנָיו
  choice: उसके सामने
  rationale: निकटतम प्रासंगिक पुरुषवाचक संदर्भ बाबेल का राजा है, इसलिए मुख्य पाठ में फ़िरौन का उसके सामने कराहना रखा गया है; वास्तविक संदर्भ-अस्पष्टता पादटिप्पणी में सुरक्षित है।
theological_decisions:
- issue: לְפָנָיו में सर्वनाम का संदर्भ
  choice: ‘उसके सामने’ से बाबेल के राजा का संदर्भ
  alternative: ‘मेरे सामने’ अर्थात् यहोवा के सामने
  rationale: तात्कालिक वाक्य-प्रवाह और ‘उसके हाथ में’ बाबेल के राजा को निकट संदर्भ बनाते हैं, किंतु इब्रानी सर्वनाम यहोवा की ओर भी लौट सकता है। अतः मुख्य पाठ में अधिक संभावित अर्थ और पादटिप्पणी में दूसरा संभव अर्थ रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सामान्य-पाठक-सुलभ रूप अपनाया गया है। ‘भुजाएँ’ और ‘तलवार’ जैसे मूल सैन्य रूपक बनाए रखे गए हैं; ‘कराहता रहेगा’ इब्रानी की बलवर्धक सजातीय रचना को स्वाभाविक हिन्दी में व्यक्त करता है।
