  text: ה֠וּא וְ/עַמּ֤/וֹ אִתּ/וֹ֙ עָרִיצֵ֣י גוֹיִ֔ם מֽוּבָאִ֖ים לְ/שַׁחֵ֣ת הָ/אָ֑רֶץ וְ/הֵרִ֤יקוּ חַרְבוֹתָ/ם֙ עַל מִצְרַ֔יִם וּ/מָלְא֥וּ אֶת הָ/אָ֖רֶץ חָלָֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/030/011.yaml
  text: He and his people with him—the ruthless of the nations—will be brought in to destroy the land[a]. They will draw their swords against Egypt and fill the land with the slain.
translation:
  language: hi
  text: वह और उसके लोग, जो उसके साथ हैं—राष्ट्रों के निर्दयी लोग[क]—देश को उजाड़ने के लिए लाए जाएँगे। वे मिस्र के विरुद्ध अपनी तलवारें खींचेंगे और देश को मारे गए लोगों से भर देंगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: क
    text: या, “राष्ट्रों के क्रूर लोग” अथवा “राष्ट्रों के भयावह लोग।” इब्रानी अभिव्यक्ति आक्रमणकारी लोगों के हिंसक और निर्दयी चरित्र पर बल देती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: עַמּוֹ
  choice: उसके लोग
  rationale: עַם का सामान्य अर्थ ‘लोग’ है; प्रसंग में ये उसके साथ आने वाले सैन्य जन हैं, पर ‘सेना’ कहने से अधिक विशिष्ट अर्थ जुड़ जाता।
- source_word: עָרִיצֵי גוֹיִם
  choice: राष्ट्रों के क्रूर लोग
  rationale: עָרִיץ हिंसक, निर्दयी अथवा आतंककारी व्यक्ति को दर्शाता है। ‘क्रूर लोग’ स्वाभाविक हिन्दी में उनके हिंसक चरित्र को व्यक्त करता है और मूल में निहित न होने वाला स्पष्ट सर्वोच्चताबोध नहीं जोड़ता।
- source_word: מוּבָאִים
  choice: लाए जाएँगे
  rationale: בוא का होफाल कृदंत किसी के द्वारा लाए जाने का भाव देता है; भविष्यकालीन अर्थ भविष्यवाणी के प्रसंग और आगे की क्रियाओं के अनुरूप है।
- source_word: לְשַׁחֵת
  choice: उजाड़ने के लिए
  rationale: इस प्रसंग में שׁחת देश को नष्ट और बरबाद करने की कार्रवाई बताता है; ‘उजाड़ना’ भूमि पर होने वाले विनाश के लिए स्वाभाविक और सटीक है।
- source_word: הָאָרֶץ
  choice: इस देश / देश
  rationale: मिस्र के विरुद्ध इस भविष्यवाणी में אֶרֶץ पूरी पृथ्वी नहीं, मिस्र की भूमि अथवा देश को दर्शाता है। पहली बार ‘इस देश’ निकटवर्ती संदर्भ को स्पष्ट करता है।
- source_word: וְהֵרִיקוּ חַרְבוֹתָם עַל
  choice: वे ... के विरुद्ध अपनी तलवारें खींचेंगे
  rationale: ריק के साथ ‘तलवारें’ युद्ध के लिए उन्हें म्यान से निकालने का मुहावरा है; हिन्दी में ‘तलवारें खींचना’ इसका स्वाभाविक समतुल्य है।
- source_word: וּמָלְאוּ אֶת־הָאָרֶץ חָלָל
  choice: देश को मारे गए लोगों से भर देंगे
  rationale: חָלָל युद्ध में मारे गए व्यक्तियों को दर्शाता है। यह अनुवाद मृत्यु का अर्थ स्पष्ट रखता है और ‘लाशों’ की अपेक्षा अधिक गरिमापूर्ण है।
