  yaml_path: translation/ot/ezekiel/030/023.yaml
  text: And I will scatter Egypt among the nations[a], and I will disperse them among the lands.
translation:
  language: hi
  text: और मैं मिस्र को राष्ट्रों के बीच तितर-बितर कर दूँगा[a], और उन्हें देशों में बिखेर दूँगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में पहले खंड में “मिस्र” है और दूसरे में “उन्हें”; राष्ट्र का नाम यहाँ उसके लोगों के लिए प्रयुक्त हुआ है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַהֲפִצוֹתִי
  choice: और मैं ... तितर-बितर कर दूँगा
  rationale: हिफ़ील रूप कारणात्मक बिखराव और दैवी कार्रवाई व्यक्त करता है। आधुनिक हिन्दी में यह प्रयोग स्वाभाविक है और आरम्भिक संयोजक का भी अनुवाद करता है।
- source_word: מִצְרַיִם
  choice: मिस्र
  rationale: इब्रानी में देश/राष्ट्र का नाम ही प्रत्यक्ष कर्म है; उसे बनाए रखने से मूल का राष्ट्रनाम और आगे आए बहुवचन सर्वनाम के बीच का अर्थगत तनाव सुरक्षित रहता है।
- source_word: בַּגּוֹיִם
  choice: जाति-जाति के बीच
  rationale: גּוֹיִם का अर्थ यहाँ अनेक राष्ट्र/जातियाँ है। यह मुहावरा व्यापक निर्वासन को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וְזֵרִיתִם
  choice: और उन्हें ... बिखेर दूँगा
  rationale: זרה यहाँ फैलाने या बिखेरने का भाव देता है। 'बिखेर दूँगा' पहले क्रियापद के समानांतर रहते हुए शब्दगत विविधता और बहुवचन प्रत्यय 'उन्हें' दोनों को स्पष्ट करता है।
- source_word: בָּאֲרָצוֹת
  choice: अलग-अलग देशों में
  rationale: बहुवचन אֲרָצוֹת विभिन्न देशों/प्रदेशों को सूचित करता है। उपसर्ग ב का सीधा स्थानगत भाव 'में' से व्यक्त होता है; 'अलग-अलग' बहुवचन वितरण को सहज हिन्दी में स्पष्ट करता है।
theological_decisions:
- issue: एकवचन राष्ट्रनाम 'मिस्र' से बहुवचन प्रत्यय 'उन्हें' की ओर बदलाव
  choice: पहले खंड में 'मिस्र' और दूसरे में 'उन्हें' रखा गया है।
  alternative: दोनों खंडों में 'मिस्रियों' कहकर वाक्य को व्याकरणतः समरूप बनाना।
  rationale: मूल पाठ में राष्ट्रनाम अपने लोगों का प्रतिनिधित्व करता है और उसके बाद बहुवचन प्रत्यय आता है। इसे बनाए रखना वास्तविक अर्थगत बदलाव को चुपचाप समतल नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी; भविष्यवाणी के न्याय-वचन के अनुरूप गरिमामय और स्पष्ट शैली। 'तितर-बितर' तथा 'बिखेर' समानांतर इब्रानी क्रियाओं की निकटता और विविधता दोनों को व्यक्त करते हैं।
