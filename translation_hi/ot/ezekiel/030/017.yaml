  yaml_path: translation/ot/ezekiel/030/017.yaml
  text: The young men of Aven and Pi-beseth will fall by the sword[b][a], and these cities will go into captivity.
translation:
  language: hi
  text: आवेन[a] और पी-बेसेत[b] के जवान तलवार से गिरेंगे, और ये नगर बंधुआई में चले जाएँगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: आवेन से सम्भवतः मिस्र का ओन, अर्थात् हेलियोपोलिस, अभिप्रेत है।
    reason: alternative_reading
  - marker: b
    text: पी-बेसेत की पहचान सामान्यतः बूबास्तिस से की जाती है।
    reason: alternative_reading
lexical_decisions:
- source_word: בַּח֥וּרֵי
  choice: के जवान
  rationale: यह शब्द प्रायः जीवन के उत्कर्ष पर पहुँचे जवान पुरुषों को दर्शाता है। युद्ध और न्याय के इस प्रसंग में ‘जवान’ स्वाभाविक है और उन्हें अनावश्यक रूप से विशिष्ट सैनिक नहीं ठहराता।
- source_word: אָ֛וֶן
  choice: आवेन
  rationale: मुख्य पाठ में इब्रानी स्थान-नाम का लिप्यंतरण रखा गया है; ओन/हेलियोपोलिस से इसकी संभावित पहचान पादटिप्पणी में दी गई है।
- source_word: וּ/פִי בֶ֖סֶת
  choice: और पी-बेसेत
  rationale: इब्रानी रूप के निकट स्थान-नाम का लिप्यंतरण रखा गया है; बूबास्तिस से इसकी प्रचलित पहचान पादटिप्पणी में सुरक्षित है।
- source_word: בַּ/חֶ֣רֶב
  choice: तलवार से
  rationale: यह युद्ध में तलवार द्वारा मारे जाने का सामान्य इब्रानी प्रयोग है।
- source_word: יִפֹּ֑לוּ
  choice: गिरेंगे
  rationale: शाब्दिक ‘गिरना’ युद्ध में मरने का प्रचलित बिंब है। ‘गिरेंगे’ मूल बिंब को बनाए रखता है और प्रसंग में अर्थ स्पष्ट रहता है।
- source_word: וְ/הֵ֖נָּה
  choice: और ये नगर
  rationale: स्त्रीलिंग बहुवचन सर्वनाम का संकेत अभी बताए गए नगरों की ओर है। हिन्दी में संदर्भ स्पष्ट करने के लिए ‘नगर’ जोड़ा गया है।
- source_word: בַּ/שְּׁבִ֥י
  choice: बंधुआई में
  rationale: यह बंदी अवस्था अथवा बंदी बनाकर ले जाए जाने को दर्शाता है; न्याय-वाणी के प्रसंग में ‘बंधुआई में’ सीधा और परिचित अनुवाद है।
- source_word: תֵלַֽכְנָה
  choice: चले जाएँगे
  rationale: मूल क्रिया का अर्थ ‘जाना’ है। ‘बंधुआई में चले जाएँगे’ मूल अभिव्यक्ति को रखते हुए निर्वासन के भाव को स्पष्ट करता है।
