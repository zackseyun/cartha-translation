source:
  edition: WLC
  text: כֹּֽה אָמַ֞ר אֲדֹנָ֣/י יְהוִ֗ה וְ/הַאֲבַדְתִּ֨י גִלּוּלִ֜ים וְ/הִשְׁבַּתִּ֤י אֱלִילִים֙ מִ/נֹּ֔ף וְ/נָשִׂ֥יא מֵ/אֶֽרֶץ מִצְרַ֖יִם לֹ֣א יִֽהְיֶה ע֑וֹד וְ/נָתַתִּ֥י יִרְאָ֖ה בְּ/אֶ֥רֶץ מִצְרָֽיִם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/030/013.yaml
  text: 'Thus says the Lord GOD: I will destroy the idols and put an end to the images from Noph[a], and there will no longer be a prince from the land of Egypt[b]; and I will put fear in the land of Egypt.'
translation:
  language: hi
  text: 'प्रभु यहोवा यों कहते हैं: “मैं मूर्तियों को नष्ट कर दूँगा और नोफ़[a] से देव-प्रतिमाओं को मिटा दूँगा। मिस्र देश से फिर कोई प्रधान न होगा[b], और मैं मिस्र देश में भय भर दूँगा।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: नोफ़ मिस्र के उस नगर का हिब्रू नाम है जिसे बाद में यूनानी भाषा में मेम्फिस कहा गया।
    reason: cross_reference
  - marker: b
    text: या ‘मिस्र देश से फिर कोई शासक न होगा।’
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  choice: प्रभु यहोवा
  rationale: संयुक्त ईश्वरीय उपाधि में אֲדֹנָי को ‘प्रभु’ और वाचा के नाम יהוה को हिन्दी में प्रचलित रूप ‘यहोवा’ से व्यक्त किया गया है।
- source_word: וְהַאֲבַדְתִּי גִלּוּלִים
  choice: मैं मूर्तियों को नष्ट कर दूँगा
  rationale: हिफ़ील क्रिया निर्णायक विनाश या हटाए जाने को व्यक्त करती है। גִלּוּלִים में निंदात्मक भाव है, पर हिन्दी में ‘मूर्तियाँ’ स्पष्ट और स्वाभाविक है।
- source_word: וְהִשְׁבַּתִּי אֱלִילִים
  choice: देव-प्रतिमाओं का अंत कर दूँगा
  rationale: שׁבת के हिफ़ील रूप का कारक अर्थ ‘अंत कर देना’ से व्यक्त हुआ है। ‘देव-प्रतिमाएँ’ निकटवर्ती גִלּוּלִים से शब्दगत भेद बनाए रखता है और मूर्तिपूजक वस्तुओं का संकेत देता है।
- source_word: מִנֹּף
  choice: नोफ़ से
  rationale: हिब्रू स्थान-नाम נֹף का लिप्यंतरण रखा गया है; परिचित यूनानी नाम ‘मेम्फिस’ पादटिप्पणी में दिया गया है।
- source_word: וְנָשִׂיא מֵאֶרֶץ מִצְרַיִם לֹא יִהְיֶה עוֹד
  choice: मिस्र देश से फिर कोई प्रधान न होगा
  rationale: נָשִׂיא के ‘प्रधान/नेता/शासक’ अर्थ-क्षेत्र और מֵאֶרֶץ के ‘देश से’ संबंध को बिना किसी देशी राजवंश संबंधी अतिरिक्त व्याख्या के निकटता से रखा गया है।
- source_word: וְנָתַתִּי יִרְאָה בְּאֶרֶץ מִצְרָיִם
  choice: मैं मिस्र देश में भय भर दूँगा
  rationale: शाब्दिक ‘भय रखूँगा/दूँगा’ को स्वाभाविक हिन्दी मुहावरे ‘भय भर दूँगा’ से व्यक्त किया गया है, बिना इसे अनिवार्य रूप से ‘आतंक’ बनाकर तीव्र किए।
theological_decisions:
- issue: संयुक्त उपाधि אֲדֹנָי יְהוִה में परमेश्वर के नाम का अनुवाद
  choice: प्रभु यहोवा
  alternative: प्रभु याहवे
  rationale: मूल पाठ में वाचा का नाम יהוה स्पष्ट है। हिन्दी पाठकों में पहचाने जाने वाले ‘यहोवा’ रूप को रखते हुए אֲדֹנָי से उसका भेद भी बनाए रखा गया है।
- issue: मिस्र में प्रधान के न रहने वाली घोषणा का आशय
  choice: मिस्र देश से फिर कोई प्रधान न होगा
  alternative: मिस्र देश का फिर कोई शासक न होगा
  rationale: मूल के מֵאֶרֶץ (‘देश से’) और נָשִׂיא के व्यापक पदनाम को बनाए रखा गया है; इसे विशेष रूप से फ़िरौन, विदेशी शासक या समूची शासन-व्यवस्था के अंत के रूप में नहीं समझाया गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। भविष्यसूचक न्याय की दृढ़ता के लिए ‘नष्ट कर दूँगा’ और ‘अंत कर दूँगा’ प्रयुक्त हैं। स्थान-नाम का हिब्रू रूप मुख्य पाठ में और उसका अधिक परिचित नाम पादटिप्पणी में रखा गया है।
