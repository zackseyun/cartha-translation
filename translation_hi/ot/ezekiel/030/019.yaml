base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/030/019.yaml
  text: Thus I will execute judgments on Egypt[a], and they will know that I am Yahweh.
translation:
  language: hi
  text: इस प्रकार मैं मिस्र में न्याय के कार्य करूँगा, और वे जान लेंगे कि मैं याहवे[a] हूँ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी पाठ में परमेश्वर का विशिष्ट नाम YHWH है, जिसे यहाँ “याहवे” लिखा गया है।
    reason: दिव्य नाम की पहचान और उसके इब्रानी रूप को स्पष्ट करना।
lexical_decisions:
- source_word: וְעָשִׂיתִי
  choice: इस प्रकार मैं ... करूँगा
  rationale: עשה का मूल अर्थ ‘करना’ है; שְׁפָטִים के साथ यह दंडात्मक न्याय के कार्य करने का अर्थ देता है। प्रसंग में וְ निष्कर्षात्मक परिणाम की ओर संकेत करता है, इसलिए ‘इस प्रकार’ स्वाभाविक है।
- source_word: שְׁפָטִים
  choice: दंड के कार्य
  rationale: बहुवचन संज्ञा यहाँ न्यायिक और दंडात्मक कार्रवाइयों को दर्शाती है। यह अनुवाद केवल अमूर्त ‘न्याय’ कहने के बजाय भविष्यद्वाणी के दंड-संबंधी भाव को स्पष्ट रखता है।
- source_word: בְּמִצְרָיִם
  choice: मिस्र में
  rationale: 'पूर्वसर्ग בְ का स्थानवाचक अर्थ सुरक्षित रखा गया है: परमेश्वर के दंड के कार्य मिस्र में घटित होंगे।'
- source_word: וְיָדְעוּ
  choice: और वे जान लेंगे
  rationale: यहेजकेल में बार-बार आने वाले पहचान-सूत्र को ‘जान लेंगे’ के रूप में रखा गया है, जिससे केवल बौद्धिक जानकारी नहीं बल्कि अनुभव से होने वाली पहचान का भाव भी बना रहता है।
- source_word: כִּי אֲנִי יְהוָה
  choice: कि मैं याहवे हूँ
  rationale: यहेजकेल के पहचान-सूत्र और इब्रानी में आए परमेश्वर के विशिष्ट नाम יהוה को सीधे ‘याहवे’ के रूप में प्रस्तुत किया गया है।
theological_decisions:
- issue: परमेश्वर के नाम יהוה का अनुवाद
  choice: याहवे
  alternative: प्रभु; यहोवा
  rationale: मूल पाठ में उपाधि नहीं बल्कि चार अक्षरों वाला विशिष्ट दिव्य नाम YHWH है। ‘याहवे’ उसका व्यापक रूप से स्वीकृत स्वरांकन है और नाम तथा उपाधि के भेद को बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, सहज और भविष्यद्वाणी की गरिमा के अनुरूप रखी गई है। ‘दंड के कार्य’ मूल के बहुवचन और न्यायिक-दंडात्मक अर्थ को बनाए रखता है; ‘जान लेंगे’ यहेजकेल के आवर्ती पहचान-सूत्र को स्वाभाविक हिन्दी में व्यक्त करता है।
