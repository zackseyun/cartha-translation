base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/030/007.yaml
  text: They will be desolated among desolated lands[a], and its cities will be among ruined cities.
translation:
  language: hi
  text: वे उजाड़े हुए देशों के बीच उजाड़ हो जाएँगे[a], और उसके नगर उजड़े हुए नगरों के बीच होंगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उजाड़ देशों के बीचों-बीच उजाड़ हो जाएँगे, और उसके नगर उजड़े नगरों के बीचों-बीच होंगे।”
    reason: בְּתוֹךְ के अधिक स्थानिक और बलयुक्त अर्थ ‘बीचों-बीच’ को वैकल्पिक रूप में सुरक्षित रखा गया है।
lexical_decisions:
- source_word: וְנָשַׁמּוּ
  choice: उजाड़ हो जाएँगे
  rationale: निफ़अल रूप विनाश के फलस्वरूप उत्पन्न अवस्था को व्यक्त करता है। यह प्रयोग आधुनिक हिन्दी में स्वाभाविक रहते हुए निष्क्रिय/परिणामात्मक भाव बनाए रखता है।
- source_word: בְּתוֹךְ
  choice: के बीच
  rationale: यह किसी बड़े समूह के मध्य स्थित होने का भाव देता है; ‘के बीच’ सहज और सटीक हिन्दी है।
- source_word: אֲרָצוֹת נְשַׁמּוֹת
  choice: उजाड़े हुए देश
  rationale: अֲרָצוֹת यहाँ भूभागों अथवा देशों को सूचित करता है, और נְשַׁמּוֹת उनकी उजड़ी हुई दशा बताता है। ‘उजाड़े हुए’ मूल की परिणामात्मक छाया को बनाए रखता है।
- source_word: וְעָרָיו
  choice: और उसके नगर
  rationale: एकवचन पुल्लिंग प्रत्यय का संदर्भ मिस्र नामक राष्ट्रीय इकाई से है; हिन्दी में ‘उसके’ स्वाभाविक है और संदर्भ को अनावश्यक रूप से व्यक्तिरूप नहीं देता।
- source_word: עָרִים נַחֲרָבוֹת
  choice: उजड़े हुए नगर
  rationale: חרב का यह वर्णनात्मक निष्क्रिय रूप नगरों की ध्वस्त और निर्जन दशा बताता है। ‘उजड़े हुए नगर’ स्पष्ट और स्वाभाविक है।
- source_word: תִּהְיֶינָה
  choice: होंगे
  rationale: היה का भविष्यकाल यहाँ नगरों की भावी स्थिति बताता है; ‘होंगे’ सीधा और स्वाभाविक अनुवाद है।
