lexical_decisions:
- source_word: וְנָתַתִּי אֵשׁ בְּמִצְרַיִם
  choice: मैं मिस्र में आग लगा दूँगा
  rationale: נתן के साथ אֵשׁ और स्थान का प्रयोग यहाँ आग लगाने का भाव देता है; בְּ का सीधा अर्थ ‘में’ रखा गया है।
- source_word: חוּל תחיל סִין
  choice: सीन पीड़ा से तड़पेगा
  rationale: חול काँपने, प्रसव-पीड़ा उठने या ऐंठकर तड़पने का बिंब दे सकता है। ‘पीड़ा से तड़पेगा’ न्याय के प्रसंग में इसकी तीव्र शारीरिक व्यथा को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: סִין
  choice: सीन
  rationale: इब्रानी नगर-नाम का लिप्यंतरण रखा गया है; पेलूसियम से इसकी सामान्य पहचान पादटिप्पणी में दी गई है।
- source_word: וְנֹא תִּהְיֶה לְהִבָּקֵעַ
  choice: नो को तोड़कर खोल दिया जाएगा
  rationale: בקע का निफ़अल रूप फाड़े जाने, तोड़े जाने या सेंध लगाकर खोल दिए जाने का अर्थ देता है। नगर के संदर्भ में यह ठोस बिंब सुरक्षित रहता है।
- source_word: וְנֹף
  choice: नोफ़
  rationale: इब्रानी नाम का लिप्यंतरण रखा गया है; मेम्फिस की ऐतिहासिक पहचान पादटिप्पणी में दी गई है।
- source_word: צָרֵי יוֹמָם
  choice: दिन-दहाड़े शत्रु चढ़ आएँगे
  rationale: पदबंध अत्यंत संक्षिप्त है। צָרֵי को शत्रु/विरोधी और יוֹמָם को दिन में या दिन-दहाड़े समझते हुए हिन्दी में खुले हमले का स्वाभाविक भाव व्यक्त किया गया है; पाठ की अनिश्चितता पादटिप्पणी में सुरक्षित है।
