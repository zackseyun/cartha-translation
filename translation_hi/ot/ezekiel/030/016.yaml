  text: मैं मिस्र में आग लगा दूँगा; सीन[a] पीड़ा से तड़पेगा, नो[b] में सेंध लगाई जाएगी, और नोफ़[c] पर दिन-दहाड़े शत्रु आ जाएँगे।[d]
