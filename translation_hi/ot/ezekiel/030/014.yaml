  yaml_path: translation/ot/ezekiel/030/014.yaml
  text: I will make Pathros desolate[a], and I will set fire in Zoan[c][b], and I will execute judgments on No.
translation:
  language: hi
  text: मैं पत्रोस को उजाड़ दूँगा[a], सोअन में आग लगा दूँगा[b], और नो में न्याय के कार्य करूँगा[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “पत्रोस को निर्जन कर दूँगा।”
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “सोअन में आग दूँगा”; भावार्थ, वहाँ विनाशकारी आग लगाऊँगा।
    reason: lexical_alternative
  - marker: c
    text: नो मिस्र का वह नगर है जो थीब्स के नाम से भी जाना जाता है।
    reason: cultural_note
lexical_decisions:
- source_word: וַהֲשִׁמֹּתִי
  choice: मैं ... को उजाड़ दूँगा
  rationale: हिफ़ील रूप किसी स्थान को उजाड़ बनाने का कारणात्मक और परिणामसूचक भाव व्यक्त करता है। यह आधुनिक हिन्दी में स्वाभाविक रहते हुए भविष्यवाणी की प्रबलता बनाए रखता है।
- source_word: פַּתְרוֹס
  choice: पत्रोस
  rationale: मिस्र के एक क्षेत्र का स्थाननाम होने के कारण इसका देवनागरी लिप्यंतरण किया गया है।
- source_word: וְנָתַתִּי אֵשׁ
  choice: आग लगा दूँगा
  rationale: शाब्दिक अर्थ ‘आग दूँगा’ है, पर यहाँ विनाशकारी आग लगाने का मुहावरेदार अर्थ है। ‘आग लगा दूँगा’ वर्तमान हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: בְּצֹעַן
  choice: सोअन में
  rationale: पूर्वसर्ग בְּ यहाँ आग लगने के स्थान को सूचित करता है; इसलिए ‘में’ रखा गया है। स्थाननाम का रूप ‘सोअन’ मूल उच्चारण के निकट है।
- source_word: וְעָשִׂיתִי שְׁפָטִים
  choice: दण्ड के न्याय करूँगा
  rationale: यह इब्रानी पदबंध दण्डात्मक न्याय-कार्यों को अंजाम देने का अर्थ रखता है। ‘दण्ड के न्याय’ बहुवचन שְׁפָטִים और उसके न्यायिक तथा दण्डात्मक दोनों पक्षों को बनाए रखता है।
- source_word: בְּנֹא
  choice: नो पर
  rationale: न्याय के लक्षित नगर को आधुनिक हिन्दी में ‘पर’ स्वाभाविक रूप से व्यक्त करता है, यद्यपि इब्रानी पूर्वसर्ग स्थान अथवा लक्ष्य—दोनों की छाया रख सकता है।
theological_decisions:
- issue: न्याय की घोषणा में परमेश्वर की प्रत्यक्ष कर्तृता
  choice: 'तीनों प्रथम-पुरुष क्रियाओं को प्रत्यक्ष दैवी कार्य के रूप में रखा गया: ‘उजाड़ दूँगा’, ‘आग लगा दूँगा’, ‘न्याय करूँगा’।'
  alternative: ऐसी नरम भाषा जो केवल अनुमति देने या अप्रत्यक्ष कारण बनने का भाव दे।
  rationale: इब्रानी पाठ वक्ता को इन न्यायकारी कार्यों का सीधा कर्ता बताता है; अनुवाद में इस धर्मवैचारिक तनाव को कम नहीं किया गया।
- issue: שְׁפָטִים का बहुवचन और दण्डात्मक अर्थ
  choice: ‘दण्ड के न्याय’
  alternative: ‘न्याय करूँगा’ या ‘दण्ड दूँगा’
  rationale: केवल ‘न्याय’ दण्डात्मक पक्ष को धुँधला कर सकता है, जबकि केवल ‘दण्ड’ न्यायिक अर्थ को। चुना हुआ रूप दोनों पक्ष और इब्रानी बहुवचन को सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। स्थाननाम मूल इब्रानी रूपों के निकट देवनागरी में दिए गए हैं। समानांतर प्रथम-पुरुष क्रियाओं से न्याय-वाणी की लय और प्रत्यक्षता सुरक्षित रखी गई है।
