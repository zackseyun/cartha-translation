  text: וַ/הֲפִצוֹתִ֤י אֶת מִצְרַ֨יִם֙ בַּ/גּוֹיִ֔ם וְ/זֵרִיתִ֥י אוֹתָ֖/ם בָּ/אֲרָצ֑וֹת וְ/יָדְע֖וּ כִּֽי אֲנִ֥י יְהוָֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/030/026.yaml
  text: I will scatter Egypt among the nations[a], and I will disperse them through the lands. Then they will know that I am Yahweh.
translation:
  language: hi
  text: मैं मिस्र को जातियों में तितर-बितर कर दूँगा,[a] और उसके लोगों को देशों में छितरा दूँगा। तब वे जानेंगे कि मैं याहवे हूँ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक शाब्दिक रूप: “मैं मिस्र को जातियों में तितर-बितर कर दूँगा और उन्हें देशों में छितरा दूँगा।” इब्रानी में पहले “मिस्र” कहा गया है और फिर उसके लोगों के लिए बहुवचन “उन्हें” आया है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַהֲפִצוֹתִי
  choice: मैं ... तितर-बितर कर दूँगा
  rationale: פוץ का अर्थ बिखेरना या तितर-बितर करना है। यह न्याय के फलस्वरूप विभिन्न जातियों में फैलाए जाने का भाव स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: מִצְרַיִם
  choice: मिस्र
  rationale: इब्रानी में देश/राष्ट्र का नाम सीधे आया है; इसलिए मुख्य पाठ में ‘मिस्र’ रखा गया है, जबकि आगे का बहुवचन सर्वनाम उसके लोगों की ओर संकेत करता है।
- source_word: בַּגּוֹיִם
  choice: जातियों में
  rationale: גּוֹיִם का सामान्य अर्थ ‘जातियाँ’ या ‘राष्ट्र’ है। यहाँ निर्वासन और बिखराव के प्रसंग में ‘जातियों में’ उपयुक्त है।
- source_word: וְזֵרִיתִי
  choice: छितरा दूँगा
  rationale: זרה का अर्थ बिखेरना, छितराना, या कभी-कभी फटकना है। यहाँ लोगों के भौगोलिक बिखराव के लिए ‘छितरा दूँगा’ पहले क्रियापद से हल्का शब्दगत भेद भी बनाए रखता है।
- source_word: אוֹתָם
  choice: उसके लोगों को
  rationale: शाब्दिक रूप से यह बहुवचन ‘उन्हें’ है, जिसका पूर्वपद सामूहिक संज्ञा ‘मिस्र’ है। स्पष्ट और स्वाभाविक हिन्दी के लिए निहित अर्थ ‘उसके लोगों को’ मुख्य पाठ में व्यक्त किया गया है।
- source_word: בָּאֲרָצוֹת
  choice: अलग-अलग देशों में
  rationale: אֲרָצוֹת का अर्थ ‘देशों/भूमियों’ है। ‘अलग-अलग देशों में’ व्यापक भौगोलिक फैलाव को सहज हिन्दी में बताता है।
- source_word: וְיָדְעוּ
  choice: तब वे जानेंगे
  rationale: वाव क्रम और परिणाम का संबंध जोड़ता है। ‘तब’ न्याय के बाद होने वाली पहचान को स्वाभाविक रूप से व्यक्त करता है, बिना कारणात्मक बल को बढ़ाए।
- source_word: יְהוָה
  choice: यहोवा
  rationale: व्यक्तिगत ईश्वरीय नाम יהוה को हिन्दी में प्रचलित लिप्यंतरण ‘यहोवा’ से व्यक्त किया गया है, न कि किसी उपाधि से।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ में चतुरक्षरीय व्यक्तिगत नाम सीधे प्रयुक्त है। हिन्दी बाइबलीय प्रयोग में व्यापक रूप से पहचाने जाने वाले ‘यहोवा’ को चुना गया है; ‘याहवे’ अधिक प्रत्यक्ष विद्वत्तापरक लिप्यंतरण है।
- issue: ‘मिस्र’ से बहुवचन ‘उन्हें’ की ओर बदलाव
  choice: मुख्य पाठ में ‘मिस्र’ के बाद ‘उसके लोगों को’
  alternative: ‘मिस्र को ... और उन्हें ...’
  rationale: इब्रानी का व्याकरणिक तनाव—राष्ट्र का एकवचन नाम और फिर उसके निवासियों के लिए बहुवचन सर्वनाम—अर्थ की दृष्टि से सुरक्षित रखा गया है, पर हिन्दी में संदर्भ स्पष्ट करने के लिए ‘उसके लोगों को’ कहा गया है। पादटिप्पणी अधिक शाब्दिक रूप बताती है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सहज रूप अपनाया गया है। समानार्थी इब्रानी क्रियाओं के लिए ‘तितर-बितर’ और ‘छितरा’ रखकर पुनरुक्ति से बचते हुए काव्यात्मक समानांतरता बनाए रखी गई है।
