base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/030/003.yaml
  text: For the day is near[a], yes, the day of Yahweh is near; it will be a day of clouds[c][b], a time of nations.
translation:
  language: hi
  text: क्योंकि वह दिन निकट है—हाँ, याहवे का दिन[a] निकट है। वह बादलों का दिन[b], राष्ट्रों का समय[c] होगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘याहवे का दिन’ भविष्यद्वक्ताओं में ईश्वरीय हस्तक्षेप और न्याय के विशेष दिन के लिए प्रयुक्त अभिव्यक्ति है।
    reason: cross_reference
  - marker: b
    text: शाब्दिक रूप से, ‘बादल का दिन।’
    reason: lexical_alternative
  - marker: c
    text: या, ‘राष्ट्रों के लिए समय।’ हिब्रू वाक्यांश संक्षिप्त है और राष्ट्रों से संबंधित किसी निर्णायक समय की ओर संकेत कर सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले विलाप और इस घोषणा के बीच कारणसूचक संबंध जोड़ता है; हिन्दी में ‘क्योंकि’ इस संदर्भगत बल को स्वाभाविक रूप से व्यक्त करता है।
- source_word: קָרוֹב יוֹם וְקָרוֹב יוֹם
  choice: वह दिन निकट है—हाँ, ... दिन निकट है
  rationale: मूल में ‘दिन’ और ‘निकट’ की पुनरावृत्ति आसन्नता पर बल देती है। ‘हाँ’ हिन्दी में उस बल को स्वाभाविक ढंग से बनाए रखता है।
- source_word: יוֹם לַיהוָה
  choice: याहवे का दिन
  rationale: लामेद यहाँ याहवे से संबंधित विशेष भविष्यद्वाणी-सूचक दिन को व्यक्त करता है। परमेश्वर के व्यक्तिगत नाम יהוה को ‘याहवे’ के रूप में रखा गया है।
- source_word: יוֹם עָנָן
  choice: बादलों का दिन
  rationale: हिब्रू में עָנָן व्याकरणतः एकवचन है, पर यहाँ बादल/घने मेघ से चिह्नित अशुभ दिन का बिंब है। ‘बादलों का दिन’ आधुनिक हिन्दी में स्वाभाविक है और बिंब को सुरक्षित रखता है।
- source_word: עֵת גּוֹיִם
  choice: राष्ट्रों का समय
  rationale: यह संक्षिप्त और अर्थगत रूप से खुला वाक्यांश है। यह राष्ट्रों से संबंधित निर्णायक समय बताता है, पर स्पष्ट नहीं करता कि वह उनके न्याय, उनके अवसर या उनके प्रभुत्व का समय है।
- source_word: יִהְיֶה
  choice: होगा
  rationale: भविष्यकालीन क्रिया पहले बताए गए दिन का स्वरूप घोषित करती है; हिन्दी में ‘होगा’ संक्षिप्त और स्पष्ट है।
theological_decisions:
- issue: יוֹם לַיהוָה का भविष्यद्वाणी-सूचक अर्थ
  choice: याहवे का दिन
  alternative: याहवे के लिए दिन; प्रभु का दिन
  rationale: मुख्य पाठ परमेश्वर के व्यक्तिगत नाम और उस दिन के याहवे से विशेष संबंध दोनों को बनाए रखता है। टिप्पणी इसे न्याय में ईश्वरीय हस्तक्षेप का दिन बताती है, पर मुख्य पाठ में निहितार्थ को विस्तार देकर नहीं जोड़ती।
- issue: עֵת גּוֹיִם की अर्थगत अनिश्चितता
  choice: राष्ट्रों का समय
  alternative: राष्ट्रों के लिए समय; राष्ट्रों का नियत समय
  rationale: हिब्रू वाक्यांश अत्यंत संक्षिप्त है। ‘राष्ट्रों का समय’ उसके संबंधात्मक अर्थ और वास्तविक अस्पष्टता को बनाए रखता है, बिना यह तय किए कि राष्ट्र कर्ता हैं, न्याय के पात्र हैं या किसी निर्धारित काल के विषय हैं।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की है, पर भविष्यद्वाणी की गंभीरता और मूल की जोरदार पुनरावृत्ति सुरक्षित रखी गई है। ‘याहवे’ को व्यक्तिगत ईश्वरीय नाम के रूप में लिप्यंतरित किया गया है; ‘राष्ट्रों का समय’ जानबूझकर संक्षिप्त रखा गया है ताकि मूल की अर्थगत खुलावट बनी रहे।
