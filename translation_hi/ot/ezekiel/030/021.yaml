base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/030/021.yaml
  text: Son of man[a], I have broken the arm of Pharaoh king of Egypt, and behold, it has not been bound up to apply remedies, to put on a bandage, to bind it, to strengthen it so that it may grasp the sword.
translation:
  language: hi
  text: “हे मनुष्य के पुत्र, मैंने मिस्र के राजा फ़िरौन की भुजा तोड़ दी है; और देखो, उसकी पट्टी नहीं बाँधी गई है—उसका उपचार करने[a], उस पर पट्टी रखने, उसे बाँधने और उसे इतना मज़बूत करने के लिए कि वह तलवार पकड़ सके।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “औषधियाँ देने।” हिब्रू पदबंध टूटी भुजा के लिए चिकित्सा-उपचार या उपचार-साधन दिए जाने की ओर संकेत करता है।
    reason: lexical_alternative
