- source_word: לֵאמֹר
  choice: इसके बाद आने वाले प्रत्यक्ष कथन को द्विबिंदु से प्रस्तुत किया गया
  rationale: इब्रानी infinitive आगामी वाणी का परिचय देता है। हिन्दी में द्विबिंदु इसी कार्य को अधिक स्वाभाविक ढंग से करता है; अलग से ‘यह कहते हुए’ कहना अनावश्यक रूप से भारी होता।
