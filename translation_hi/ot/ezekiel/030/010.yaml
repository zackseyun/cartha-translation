id: EZK.30.10
reference: Ezekiel 30:10
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: כֹּ֥ה אָמַ֖ר אֲדֹנָ֣/י יְהוִ֑ה וְ/הִשְׁבַּתִּי֙ אֶת הֲמ֣וֹן מִצְרַ֔יִם בְּ/יַ֖ד נְבוּכַדְרֶאצַּ֥ר מֶלֶךְ בָּבֶֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/030/010.yaml
  text: 'Thus says the Lord GOD: I will put an end to the multitude of Egypt by the hand of Nebuchadnezzar king of Babylon[a][b].'
translation:
  language: hi
  text: 'प्रभु याहवे यों कहता है: मैं बाबेल के राजा नबूकदनेस्सर[b] के हाथ से[a] मिस्र के जनसमूह[c] का अन्त कर दूँगा।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “के हाथ से”; अर्थात् उसके द्वारा या उसे माध्यम बनाकर।
    reason: lexical_alternative
  - marker: b
    text: या, “नबूकदरेस्सर,” जो इब्रानी वर्तनी के अधिक निकट है।
    reason: lexical_alternative
  - marker: c
    text: इब्रानी शब्द का अर्थ “जनसमूह,” “बहुलता,” या सन्दर्भ के अनुसार “सम्पदा” भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה אָמַר
  choice: यों कहता है
  rationale: यह भविष्यवाणी की घोषणा का प्रचलित सूत्र है; ‘यों कहता है’ औपचारिक गरिमा और प्रत्यक्ष वाणी दोनों बनाए रखता है।
- source_word: אֲדֹנָי יְהוִה
  choice: प्रभु यहोवा
  rationale: אֲדֹנָי को ‘प्रभु’ और परमेश्वर के व्यक्तिगत नाम יהוה को प्रचलित हिन्दी रूप ‘यहोवा’ से व्यक्त किया गया है, जिससे दोनों पद अलग बने रहते हैं।
- source_word: וְהִשְׁבַּתִּי
  choice: मैं ... का अन्त कर दूँगा
  rationale: हिफ़ील रूप का कारक अर्थ ‘बन्द करा देना/समाप्त कर देना’ है; यह हिन्दी अभिव्यक्ति उस बल को स्वाभाविक ढंग से रखती है।
- source_word: הֲמוֹן
  choice: भीड़
  rationale: यह शब्द जनसमूह, बहुलता या कोलाहलपूर्ण समुदाय का बोध करा सकता है। ‘भीड़’ यहाँ मूल अर्थ को संक्षेप में रखती है, जबकि टिप्पणी में सम्भावित व्यापक अर्थ बताया गया है।
- source_word: בְּיַד
  choice: के हाथ से
  rationale: मूल इब्रानी मुहावरे को सुरक्षित रखा गया है; इसका आशय किसी व्यक्ति को माध्यम या कर्ता बनाना है।
- source_word: נְבוּכַדְרֶאצַּר
  choice: नबूकदनेस्सर
  rationale: हिन्दी बाइबलीय परम्परा में पहचाना जाने वाला नामरूप चुना गया है; मूल वर्तनी के अधिक निकट रूप को टिप्पणी में दिया गया है।
- source_word: מֶלֶךְ בָּבֶל
  choice: बाबेल का राजा
  rationale: सम्बन्धवाचक इब्रानी रचना का सीधा और स्वाभाविक हिन्दी अनुवाद।
theological_decisions:
- issue: संयुक्त उपाधि אֲדֹנָי יְהוִה में दिव्य नाम का अनुवाद
  choice: प्रभु यहोवा
  alternative: प्रभु याहवे / प्रभु परमेश्वर
  rationale: मूल में व्यक्तिगत दिव्य नाम स्पष्ट रूप से उपस्थित है। ‘यहोवा’ आधुनिक हिन्दी पाठकों के लिए परिचित रूप है और उसे सामान्य पद ‘परमेश्वर’ में विलीन नहीं करता।
- issue: הֲמוֹן का आशय
  choice: भीड़
  alternative: जनसमूह / बहुलता / धन-सम्पदा
  rationale: सन्दर्भ मिस्र की सामूहिक शक्ति या जनसमुदाय के अन्त की बात करता है, पर शब्द में व्यापकता है; इसलिए मुख्य पाठ में संक्षिप्त अर्थ और टिप्पणी में विकल्प सुरक्षित रखे गए हैं।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। भविष्यवाणी-सूत्र तथा ‘के हाथ से’ जैसे मूल मुहावरे सुरक्षित हैं; अस्पष्ट הֲמוֹן को टिप्पणी द्वारा खुला रखा गया है।
