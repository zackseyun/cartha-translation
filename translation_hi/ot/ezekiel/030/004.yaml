base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/030/004.yaml
  text: And a sword will come against Egypt[a], and there will be anguish in Cush, when the slain fall in Egypt, and they take away her wealth[c][b], and her foundations are torn down.
translation:
  language: hi
  text: और मिस्र पर तलवार आएगी, और कूश[a] में व्याकुलता[b] होगी। जब मिस्र में लाशें गिरेंगी, तब वे उसकी धन-संपत्ति[c] उठा ले जाएंगे, और उसकी नींवें ढा दी जाएंगी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: कूश मिस्र के दक्षिण का क्षेत्र था, जो मोटे तौर पर प्राचीन नूबिया से मेल खाता था; इसे आधुनिक राष्ट्र इथियोपिया के समान नहीं समझना चाहिए।
    reason: cultural_note
  - marker: b
    text: या, “कूश में थरथराहट होगी।” इब्रानी शब्द विपत्ति के कारण कांपने, तड़पने या गहरी व्याकुलता को व्यक्त कर सकता है।
    reason: lexical_alternative
  - marker: c
    text: या, “उसके जनसमूह” अथवा “उसकी बहुतायत।” इब्रानी शब्द जनसमूह, बहुतायत या धन-संपत्ति का अर्थ दे सकता है; यहां इसे लूटकर ले जाई गई संपत्ति के अर्थ में लिया गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָאָה חֶרֶב בְּמִצְרַיִם
  choice: मिस्र पर तलवार आएगी
  rationale: भविष्यसूचक प्रसंग में पूर्ण क्रिया आगामी न्याय बताती है। ‘तलवार’ युद्ध या आक्रमण का सजीव लाक्षणिक चित्र बनाए रखती है, और ‘पर’ शत्रुतापूर्ण आगमन को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וְהָיְתָה חַלְחָלָה
  choice: घोर व्याकुलता होगी
  rationale: חַלְחָלָה विपत्ति से उत्पन्न कांपने, तड़पने या गहरी व्याकुलता को सूचित कर सकता है। ‘घोर व्याकुलता’ भावनात्मक और शारीरिक संकट दोनों के लिए पर्याप्त व्यापक है; विकल्प पादटिप्पणी में रखा गया है।
- source_word: בְּכוּשׁ
  choice: कूश में
  rationale: प्राचीन स्थान-नाम को आधुनिक राष्ट्र ‘इथियोपिया’ से प्रतिस्थापित न करके लिप्यंतरित किया गया है, क्योंकि उसका ऐतिहासिक भूगोल मुख्यतः मिस्र के दक्षिण में प्राचीन नूबिया से संबंधित था।
- source_word: בִּנְפֹל חָלָל
  choice: जब ... मारे गए लोग गिरेंगे
  rationale: इनफिनिटिव रचना को कालवाचक उपवाक्य के रूप में व्यक्त किया गया है। सैन्य प्रसंग में חָלָל सामान्यतः युद्ध में मारे गए व्यक्ति को दर्शाता है।
- source_word: וְלָקְחוּ הֲמוֹנָהּ
  choice: वे उसकी धन-संपत्ति उठा ले जाएंगे
  rationale: הָמוֹן का अर्थ जनसमूह, बहुतायत या धन-संपत्ति हो सकता है। विजय और विनाश के प्रसंग में लूटी जाने वाली ‘धन-संपत्ति’ स्वाभाविक है, पर मूल की वास्तविक बहुअर्थता पादटिप्पणी में सुरक्षित रखी गई है। सर्वनाम ‘वे’ आक्रमणकारियों को संकेत करता है, पर मूल की तरह उनका स्पष्ट नाम नहीं बताता।
- source_word: וְנֶהֶרְסוּ יְסוֹדֹתֶיהָ
  choice: उसकी नींवें ढा दी जाएंगी
  rationale: निफ़अल रूप ध्वस्त किए जाने का भाव देता है। ‘नींवें’ मूल के मूर्त चित्र को बनाए रखता है और शाब्दिक अथवा लाक्षणिक—दोनों अर्थों की संभावना खुली छोड़ता है।
