  text: וּ/בִֽ/תְחַפְנְחֵס֙ חָשַׂ֣ךְ הַ/יּ֔וֹם בְּ/שִׁבְרִ/י שָׁם֙ אֶת מֹט֣וֹת מִצְרַ֔יִם וְ/נִשְׁבַּת בָּ֖/הּ גְּא֣וֹן עֻזָּ֑/הּ הִ֚יא עָנָ֣ן יְכַסֶּ֔/נָּה וּ/בְנוֹתֶ֖י/הָ בַּ/שְּׁבִ֥י תֵלַֽכְנָה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/030/018.yaml
  text: And in Tahpanhes the day will grow dark when I break there the bars of Egypt[a], and the pride of her strength will cease in her. As for her, a cloud will cover her[b], and her daughters will go into captivity.
translation:
  language: hi
  text: और तहपन्हेस में दिन अँधेरा हो जाएगा, जब मैं वहाँ मिस्र के जुए की डंडियों[a] को तोड़ दूँगा; और उसमें उसकी सामर्थ्य का अभिमान मिट जाएगा। उस पर बादल छा जाएगा, और उसकी बेटियाँ[b] बंदी होकर चली जाएँगी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘मिस्र की सलाखें।’ इब्रानी रूपक मिस्र की शक्ति या प्रभुत्व के आधारों की ओर संकेत कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: भविष्यद्वक्ताओं की भाषा में किसी नगर की ‘बेटियाँ’ प्रायः उसके अधीन नगरों या आसपास की बस्तियों को दर्शाती हैं।
    reason: cultural_note
lexical_decisions:
- source_word: וּבִתְחַפְנְחֵס
  choice: और तहपन्हेस में
  rationale: स्थाननाम को देवनागरी में लिप्यंतरित किया गया है और ב को स्थानसूचक ‘में’ से व्यक्त किया गया है।
- source_word: חָשַׂךְ הַיּוֹם
  choice: दिन अँधेरा हो जाएगा
  rationale: यह वाक्यांश दिन के अंधकारमय होने का अशुभ न्याय-चित्र स्वाभाविक आधुनिक हिन्दी में बनाए रखता है।
- source_word: בְּשִׁבְרִי שָׁם
  choice: जब मैं वहाँ ... तोड़ दूँगा
  rationale: इनफिनिटिव रचना का समयसूचक अर्थ ‘जब’ से और שָׁם का स्थानीय बल ‘वहाँ’ से सुरक्षित रखा गया है।
- source_word: מֹטוֹת מִצְרַיִם
  choice: मिस्र के डंडों
  rationale: מֹטוֹת का ठोस रूपक बनाए रखा गया है; इसका आशय जुए के डंडों अथवा मिस्र के प्रभुत्व और सामर्थ्य के आधारों से हो सकता है, इसलिए विकल्प पादटिप्पणी में दिया गया है।
- source_word: וְנִשְׁבַּת בָּהּ
  choice: उसमें ... मिट जाएगा
  rationale: שבת के समाप्त हो जाने के भाव को सहज हिन्दी ‘मिट जाएगा’ से व्यक्त किया गया है और स्त्रीलिंग प्रत्यय को ‘उसमें’ के द्वारा अस्पष्ट ही रहने दिया गया है।
- source_word: גְּאוֹן עֻזָּהּ
  choice: उसकी शक्ति का घमंड
  rationale: सम्बन्धवाचक पदावली में ‘घमंड’ और ‘शक्ति’ दोनों संज्ञाओं को रखा गया है, जिससे मिस्र की गर्वीली सामर्थ्य का भाव बना रहता है।
- source_word: הִיא עָנָן יְכַסֶּנָּה
  choice: उस पर बादल छा जाएगा
  rationale: स्वतंत्र सर्वनाम का संदर्भ स्त्रीलिंग ‘उस पर’ में बना रहता है; हिन्दी में अनावश्यक भारी आरम्भ जोड़े बिना बादल के न्याय-संबंधी चित्र को सुरक्षित रखा गया है।
- source_word: וּבְנוֹתֶיהָ
  choice: उसकी बेटियाँ
  rationale: मूल का शाब्दिक भविष्यद्वक्ताई मुहावरा रखा गया है; आश्रित नगरों या आसपास की बस्तियों का संभावित अर्थ पादटिप्पणी में स्पष्ट किया गया है।
- source_word: בַּשְּׁבִי תֵלַכְנָה
  choice: बंदी होकर चली जाएँगी
  rationale: मूल के ‘बंदी अवस्था में जाएँगी’ वाले गतिशील चित्र को स्वाभाविक हिन्दी में बनाए रखा गया है।
theological_decisions:
- issue: पद के उत्तरार्ध में स्त्रीलिंग सर्वनामों का संदर्भ
  choice: हिन्दी में ‘उसमें’, ‘उस पर’ और ‘उसकी’ रखकर तहपन्हेस/नगर के स्त्रीरूपक को सम्भव रखा गया है।
  alternative: इन सर्वनामों को व्यापक रूप से स्त्रीरूप में चित्रित मिस्र का संदर्भ माना जा सकता है।
  rationale: निकटतम संदर्भ तहपन्हेस है और ‘बेटियाँ’ नगर की आश्रित बस्तियों का प्रचलित भविष्यद्वक्ताई मुहावरा है; फिर भी पूरा कथन मिस्र के विषय में है, इसलिए मुख्य पाठ किसी एक संदर्भ को निर्णायक रूप से आरोपित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ठोस इब्रानी रूपकों—‘डंडे’, ‘बादल’ और ‘बेटियाँ’—को मुख्य पाठ में सुरक्षित रखते हुए जहाँ आवश्यक है वहाँ पादटिप्पणी दी गई है।
