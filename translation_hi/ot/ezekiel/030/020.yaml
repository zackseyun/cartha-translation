id: EZK.30.20
reference: Ezekiel 30:20
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יְהִ֗י בְּ/אַחַ֤ת עֶשְׂרֵה֙ שָׁנָ֔ה בָּֽ/רִאשׁ֖וֹן בְּ/שִׁבְעָ֣ה לַ/חֹ֑דֶשׁ הָיָ֥ה דְבַר יְהוָ֖ה אֵלַ֥/י לֵ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/030/020.yaml
  text: And it happened in the eleventh year, in the first month, on the seventh day of the month, that the word of Yahweh came to me, saying,
translation:
  language: hi
  text: 'ग्यारहवें वर्ष के पहले महीने के सातवें दिन ऐसा हुआ कि याहवे का वचन मेरे पास आया:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: ऐसा हुआ कि
  rationale: यह कथात्मक सूत्र दिनांकित भविष्यवाणी का परिचय देता है। यह अनुवाद उसके कथात्मक कार्य को स्वाभाविक आधुनिक हिन्दी में बनाए रखता है।
- source_word: בְּאַחַת עֶשְׂרֵה שָׁנָה
  choice: ग्यारहवें वर्ष
  rationale: इब्रानी में मूल संख्या के साथ ‘वर्ष’ का प्रयोग यहाँ क्रमसूचक तिथि के अर्थ में है; हिन्दी में ‘ग्यारहवें वर्ष’ स्वाभाविक है।
- source_word: בָּרִאשׁוֹן
  choice: पहले महीने
  rationale: दिनांक-सूत्र में ‘पहला’ विशेषण संज्ञा के रूप में प्रयुक्त होकर पहले महीने को सूचित करता है; स्पष्टता के लिए ‘महीने’ व्यक्त किया गया है।
- source_word: בְּשִׁבְעָה לַחֹדֶשׁ
  choice: महीने के सातवें दिन
  rationale: शाब्दिक रूप से ‘महीने के सात पर’ का आशय उस महीने का सातवाँ दिन है।
- source_word: הָיָה דְבַר יְהוָה אֵלַי
  choice: याहवे का वचन मेरे पास आया
  rationale: यह भविष्यवाणी के आरम्भ का मानक सूत्र है। ‘आया’ मूल क्रिया के प्रसंगगत अर्थ को सहज हिन्दी में व्यक्त करता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: चार अक्षरों वाले व्यक्तिगत ईश्वरीय नाम का हिन्दी लिप्यंतरण किया गया है, उसे किसी उपाधि से प्रतिस्थापित नहीं किया गया।
- source_word: לֵאמֹר
  choice: ':'
  rationale: यह रूप आगे आने वाले प्रत्यक्ष कथन का परिचय देता है। हिन्दी में वचन के बाद विसर्ग-चिह्न अगली पंक्ति में आने वाले कथन को स्वाभाविक रूप से प्रस्तुत करता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में व्यक्तिगत ईश्वरीय नाम सीधे आया है। ‘याहवे’ उसका प्रचलित विद्वत्तापूर्ण लिप्यंतरण है और नाम को उपाधि में नहीं बदलता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सहज रखी गई है। इब्रानी दिनांक-सूत्र का क्रम सुरक्षित है, और अगले पद में आने वाले कथन के लिए अंत में विसर्ग-चिह्न लगाया गया है।
