source:
  edition: WLC
  text: וְ/נָתַתִּ֤י יְאֹרִים֙ חָֽרָבָ֔ה וּ/מָכַרְתִּ֥י אֶת הָ/אָ֖רֶץ בְּ/יַד רָעִ֑ים וַ/הֲשִׁמֹּתִ֞י אֶ֤רֶץ וּ/מְלֹאָ/הּ֙ בְּ/יַד זָרִ֔ים אֲנִ֥י יְהוָ֖ה דִּבַּֽרְתִּי־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/030/012.yaml
  text: And I will make the Nile channels dry[a], and I will sell the land into the hand of evil men; and I will devastate the land and its fullness by the hand of foreigners. I am Yahweh[c][b]; I have spoken.
translation:
  language: hi
  text: और मैं नील की जलधाराओं को सुखा दूँगा[a], और देश को दुष्टों के हाथों बेच दूँगा[b]। मैं विदेशियों के हाथों देश और उसमें जो कुछ है, उसे उजाड़ दूँगा[c]। मैं, याहवे, बोल चुका हूँ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “नील की नहरों” अथवा “नदियों को”; मिस्र के इस संदर्भ में यह शब्द संभवतः नील से जुड़े जलमार्गों के लिए है।
    reason: lexical_alternative
  - marker: b
    text: या “देश को दुष्टों के हाथ सौंप दूँगा”; इब्रानी क्रिया का शाब्दिक अर्थ “बेचना” है, पर न्याय के प्रसंग में इसका भाव किसी को शत्रुओं के वश में कर देना है।
    reason: lexical_alternative
  - marker: c
    text: शाब्दिक रूप से “देश और उसकी भरपूरी को।”
    reason: lexical_alternative
lexical_decisions:
- source_word: יְאֹרִים
  choice: नील की जलधाराओं
  rationale: मिस्र के संदर्भ में यह शब्द सामान्य नदियों के बजाय नील की शाखाओं, नहरों और संबंधित जलमार्गों को सूचित करता है; ‘जलधाराओं’ स्वाभाविक हिंदी में इस व्यापकता को बनाए रखता है।
- source_word: חָרָבָה
  choice: सुखा दूँगा
  rationale: נתן के साथ यहाँ जलमार्गों को सूखा कर देने का अर्थ है; हिंदी में क्रियात्मक रूप सहज और स्पष्ट है।
- source_word: וּמָכַרְתִּי
  choice: बेच दूँगा
  rationale: מכר का मूल अर्थ ‘बेचना’ है। न्याय के प्रसंग में इसका आशय शत्रुओं के वश में कर देना भी है, पर मुख्य पाठ में शाब्दिक और तीखा बिंब सुरक्षित रखा गया है।
- source_word: בְּיַד רָעִים
  choice: दुष्ट लोगों के हाथ
  rationale: ‘हाथ’ सत्ता या अधिकार का सामी मुहावरा है; ‘दुष्ट लोगों’ से substantival masculine plural का स्वाभाविक हिंदी रूप मिलता है।
- source_word: וַהֲשִׁמֹּתִי
  choice: उजाड़ दूँगा
  rationale: यह שמם के हिफ़ील रूप की कारक शक्ति को व्यक्त करता है और आधुनिक हिंदी में स्वाभाविक है।
- source_word: אֶרֶץ וּמְלֹאָהּ
  choice: देश और उसमें जो कुछ है
  rationale: शाब्दिक ‘देश और उसकी परिपूर्णता’ हिंदी में अस्पष्ट होगा; चुना हुआ रूप देश सहित उसकी समस्त सामग्री/निवासियों का भाव स्पष्ट करता है।
- source_word: בְּיַד זָרִים
  choice: परदेशियों के हाथ से
  rationale: זָרִים यहाँ बाहरी या विदेशी आक्रमणकारियों को सूचित करता है; ‘परदेशियों’ गरिमापूर्ण और सामान्य हिंदी है तथा ‘हाथ से’ मूल मुहावरे को रखता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिंदी बाइबलीय प्रयोग में टेट्राग्राम का स्थापित नामरूप ‘यहोवा’ है; इसे उपाधि ‘प्रभु’ से प्रतिस्थापित नहीं किया गया।
- source_word: דִּבַּרְתִּי
  choice: यह कहा है
  rationale: भविष्यवाणी की सुनिश्चितता व्यक्त करने वाले सूत्र का स्वाभाविक हिंदी रूप; ‘कहा है’ पूर्ण क्रिया के बल को बनाए रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल में व्यक्तिगत ईश्वरीय नाम है, इसलिए ‘प्रभु’ जैसी उपाधि नहीं रखी गई। आधुनिक हिंदी पाठकों में अधिक पहचाना जाने वाला लिप्यंतरण ‘यहोवा’ चुना गया; ‘याहवे’ अधिक प्रत्यक्ष विद्वत्तापरक पुनर्निर्माण है।
- issue: מכר के न्याय-संबंधी रूपक का संरक्षण
  choice: देश को ... बेच दूँगा
  alternative: देश को ... के हाथ सौंप दूँगा
  rationale: ‘बेचना’ ईश्वरीय न्याय और त्यागे जाने के मूल रूपक को सुरक्षित रखता है; पादटिप्पणी उसके मुहावरेदार आशय को स्पष्ट करती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सार्वजनिक पाठ के अनुकूल रखी गई है। ‘नील की जलधाराओं’ से मिस्री संदर्भ स्पष्ट होता है; ‘बेच दूँगा’ और दोहराया गया ‘हाथ’ मूल के न्याय-बिंब और सामी मुहावरे को यथासंभव सुरक्षित रखते हैं। सभी पादटिप्पणी-चिह्न संबंधित वाक्यांशों पर लगाए गए हैं।
