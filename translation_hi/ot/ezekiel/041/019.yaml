  yaml_path: translation/ot/ezekiel/041/019.yaml
  text: with a human face toward the palm tree on one side[a], and a young lion’s face toward the palm tree on the other side. They were made all around the whole temple.
translation:
  language: hi
  text: खजूर के पेड़ की एक ओर मनुष्य का मुख था[a], और दूसरी ओर जवान सिंह का मुख। पूरे मंदिर में चारों ओर ऐसी ही नक्काशी की गई थी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “आदमी का मुख।”
    reason: אָדָם का अर्थ संदर्भ के अनुसार ‘मनुष्य’ या ‘आदमी’ हो सकता है।
lexical_decisions:
- source_word: פְנֵי אָדָם
  choice: मनुष्य का मुख
  rationale: रचना का शाब्दिक अर्थ ‘मनुष्य का मुख’ है। यहाँ पशु-मुख के साथ तुलना में मानव-मुख अभिप्रेत है; इसलिए किसी विशेष पुरुष का अनावश्यक संकेत नहीं दिया गया।
- source_word: הַתִּמֹרָה
  choice: खजूर का पेड़
  rationale: आस-पास के वर्णन में यह मंदिर की नक्काशी में बने खजूर के पेड़ के रूपांकन को दर्शाता है।
- source_word: מִפּוֹ ... מִפּוֹ
  choice: एक ओर ... दूसरी ओर
  rationale: दोहराया गया स्थानवाचक पद खजूर के पेड़ की दोनों विपरीत ओरों को बताता है; आधुनिक हिन्दी में यह स्वाभाविक अभिव्यक्ति है।
- source_word: פְנֵי כְפִיר
  choice: जवान सिंह का मुख
  rationale: כְפִיר कम आयु के, पर सिंह-शावक मात्र न रहे सिंह को सूचित कर सकता है; ‘जवान सिंह’ इस भेद को सहज हिन्दी में बनाए रखता है।
- source_word: עָשׂוּי
  choice: ऐसी ही नक्काशी की गई थी
  rationale: एकवचन निष्क्रिय कृदन्त को सजावटी काम के सामूहिक सार के रूप में समझा गया है। ‘नक्काशी’ संदर्भ में निहित कारीगरी को स्पष्ट करती है, बिना अनेक आकृतियों को व्याकरणिक कर्ता बनाए।
- source_word: אֶל כָּל הַבַּיִת
  choice: पूरे मंदिर में
  rationale: इस दर्शन में הַבַּיִת मंदिर-भवन को संदर्भित करता है; ‘मंदिर’ आधुनिक पाठक के लिए स्पष्ट है।
- source_word: סָבִיב סָבִיב
  choice: चारों ओर
  rationale: दोहराव समूचे घेराव और व्यापकता पर बल देता है, जिसे हिन्दी का ‘चारों ओर’ स्वाभाविक रूप से व्यक्त करता है।
theological_decisions:
- issue: सजावटी आकृति के संदर्भ में אָדָם का अर्थ
  choice: मनुष्य
  alternative: पुरुष/आदमी
  rationale: यहाँ मुख का प्रकार सिंह के मुख से अलग बताया गया है, इसलिए मानव-जाति का बोध अधिक उपयुक्त है। फिर भी शब्द में ‘आदमी/पुरुष’ की संभावित व्याख्या को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘मुख’ मंदिर की कलात्मक आकृतियों के वर्णन के लिए ‘चेहरा’ से थोड़ा अधिक उपयुक्त साहित्यिक शब्द है, फिर भी सामान्य पाठक के लिए स्पष्ट है। पद की आरंभिक संयोजकता को हिन्दी वाक्य-प्रवाह में अलग से ‘और’ जोड़कर भारी नहीं किया गया।
