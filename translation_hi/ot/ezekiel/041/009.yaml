  text: पार्श्व-कक्षों की बाहरी दीवार की चौड़ाई पाँच हाथ[a] थी; और जो स्थान खाली छोड़ा गया था, वह भवन के पार्श्व-कक्षों का था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इब्रानी पाठ कठिन है। अंतिम खंड का अर्थ यह भी हो सकता है: “और जो खाली छोड़ा गया था, वह भवन से जुड़े पार्श्व-कक्षों की संरचना थी,” या इसी प्रकार। यह पद मंदिर-भवन के चारों ओर की बनावट का वर्णन करता है।'
    reason: alternative_reading
