- source_word: אֶל הַחוּץ
  choice: बाहर की ओर
  rationale: यह दीवार की बाहरी दिशा या स्थिति को स्पष्ट और स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: חָמֵשׁ אַמּוֹת
  choice: पाँच हाथ
  rationale: अम्मा प्राचीन लंबाई की इकाई है; हिंदी बाइबलीय प्रयोग में 'हाथ' सहज और परिचित समतुल्य है, इसलिए माप को आधुनिक इकाई में बदले बिना रखा गया है।
- source_word: וַאֲשֶׁר מֻנָּח
  choice: खुली जगह
  rationale: शाब्दिक भाव 'जो छोड़ा गया था' है; इस कठिन स्थापत्य वाक्य में इससे छोड़ी हुई या खुली जगह का संकेत समझा जाता है।
- source_word: בֵּית צְלָעוֹת אֲשֶׁר לַבָּיִת
  choice: भवन के पार्श्व-कक्षों के बीच
  rationale: संदर्भ में בַּיִת मंदिर के मुख्य भवन को और צְלָעוֹת उसके पार्श्व-कक्षों को सूचित करता है। 'के बीच' स्थापत्य अर्थ को सुबोध बनाता है, यद्यपि यह कठिन इब्रानी की व्याख्यात्मक अभिव्यक्ति है।
