  text: וּ/שְׁתַּ֧יִם דְּלָת֛וֹת לַֽ/הֵיכָ֖ל וְ/לַ/קֹּֽדֶשׁ׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/041/023.yaml
  text: And the nave and the sanctuary each had two doors[a].
translation:
  language: hi
  text: मुख्य भवन और पवित्रस्थान में दो-दो द्वार थे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/שְׁתַּיִם
  choice: दो-दो
  rationale: स्त्रीलिंग संख्या ‘दो’ דְּלָתוֹת (‘द्वार’) से जुड़ी है। दोनों स्थानों के लिए अलग-अलग दो द्वार होने का स्वाभाविक वितरणात्मक अर्थ हिन्दी में ‘दो-दो’ से स्पष्ट होता है।
- source_word: דְּלָתוֹת
  choice: द्वार
  rationale: बहुवचन संज्ञा का सीधा अर्थ ‘द्वार’ है। ‘दोहरे द्वार’ या ‘किवाड़’ कहना संरचना के विषय में मूल पाठ से अधिक विशिष्ट हो सकता है।
- source_word: הֵיכָל
  choice: मुख्य भवन
  rationale: मन्दिर-दर्शन के संदर्भ में यह भीतरी पवित्रस्थान से अलग मन्दिर के मुख्य सभागृह या भवन को दर्शाता है। ‘मुख्य भवन’ आधुनिक हिन्दी में सहज और वास्तु-संदर्भ के अनुकूल है।
- source_word: קֹּדֶשׁ
  choice: पवित्रस्थान
  rationale: यह הֵיכָל से अलग पवित्र भीतरी क्षेत्र को दर्शाता है। ‘पवित्रस्थान’ धार्मिक गरिमा और स्थानवाचक अर्थ दोनों बनाए रखता है, बिना किसी अधिक विशिष्ट पारिभाषिक पहचान को आरोपित किए।
- source_word: לַ/הֵיכָל וְ/לַ/קֹּדֶשׁ
  choice: मुख्य भवन और पवित्रस्थान में ... थे
  rationale: इब्रानी वाक्य क्रियारहित है—शाब्दिक रूप से ‘मुख्य भवन के लिए और पवित्रस्थान के लिए दो द्वार।’ हिन्दी में अस्तित्वसूचक ‘थे’ और स्थानसूचक ‘में’ इसका स्वाभाविक अर्थ देते हैं; ‘दो-दो’ दोनों स्थानों पर संख्या का वितरण व्यक्त करता है।
theological_decisions: []
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण वास्तु-वर्णन। ‘मुख्य भवन’ सामान्य पाठक के लिए ‘नैव’ जैसे तकनीकी ऋणशब्द से अधिक स्पष्ट है; ‘पवित्रस्थान’ को संयुक्त रूप में लिखा गया है ताकि वह एक निर्दिष्ट पवित्र क्षेत्र के नाम की तरह पढ़ा जाए।
