source:
  edition: WLC
  text: וַ/עֲשׂוּיָ֨ה אֲלֵי/הֶ֜ן אֶל דַּלְת֤וֹת הַֽ/הֵיכָל֙ כְּרוּבִ֣ים וְ/תִֽמֹרִ֔ים כַּ/אֲשֶׁ֥ר עֲשׂוּיִ֖ם לַ/קִּיר֑וֹת וְ/עָ֥ב עֵ֛ץ אֶל פְּנֵ֥י הָ/אוּלָ֖ם מֵ/הַ/חֽוּץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/041/025.yaml
  text: And cherubim and palm trees were made on them[a], on the doors of the nave, just as they were made on the walls[c][b]; and there was a wooden canopy before the front of the vestibule outside.
translation:
  language: hi
  text: और मंदिर के मुख्य कक्ष के द्वारों पर करूब और खजूर के पेड़ बनाए गए थे[a], ठीक वैसे ही जैसे दीवारों पर बनाए गए थे। और बाहर, बरामदे के सामने लकड़ी का एक छज्जा था[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उकेरे गए थे”; सजावटी संदर्भ में यह अर्थ सम्भव है, यद्यपि इब्रानी क्रिया का सामान्य अर्थ “बनाना” है।
    reason: lexical_alternative
  - marker: b
    text: “छज्जा” के लिए प्रयुक्त इब्रानी वास्तुशिल्पीय शब्द का ठीक अर्थ अनिश्चित है; इससे लकड़ी की बाहर निकली हुई संरचना या ओट का संकेत हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַעֲשׂוּיָה אֲלֵיהֶן
  choice: उन पर बनाए गए थे
  rationale: עשה के व्यापक कर्मवाच्य अर्थ को बनाए रखता है; सजावटी संदर्भ में नक्काशी सम्भव है, पर मूल क्रिया स्वयं इतनी विशिष्ट नहीं है।
- source_word: דַּלְתוֹת הַהֵיכָל
  choice: मंदिर के मुख्य कक्ष के द्वारों
  rationale: הֵיכָל यहाँ पूरे मंदिर-परिसर के बजाय मंदिर-भवन के मुख्य कक्ष को सूचित करता है; यह सामान्य हिन्दी पाठक के लिए स्पष्ट है।
- source_word: כְּרוּבִים
  choice: करूब
  rationale: मंदिर की प्रतीकात्मक आकृतियों से जुड़े पारंपरिक बाइबलीय नाम को सुरक्षित रखता है।
- source_word: וְתִמֹרִים
  choice: और खजूर के पेड़
  rationale: ताड़/खजूर-वृक्ष की सजावटी आकृतियों का सीधा और सहज रूपान्तरण है।
- source_word: כַּאֲשֶׁר עֲשׂוּיִם לַקִּירוֹת
  choice: ठीक वैसे ही जैसे दीवारों पर बनाए गए थे
  rationale: द्वारों और दीवारों की सजावट के बीच मूल पाठ की स्पष्ट तुलना को बनाए रखता है।
- source_word: וְעָב עֵץ
  choice: लकड़ी का एक छज्जा
  rationale: עָב अनिश्चित वास्तुशिल्पीय पद है; 'छज्जा' सामने निकली हुई लकड़ी की संरचना का स्वाभाविक हिन्दी संकेत देता है, बिना किसी अत्यधिक तकनीकी पहचान पर ज़ोर दिए।
- source_word: אֶל פְּנֵי הָאוּלָם מֵהַחוּץ
  choice: बाहर, बरामदे के सामने
  rationale: אוּלָם को प्रवेश-बरामदे के रूप में और מֵהַחוּץ को उसकी बाहरी स्थिति के रूप में स्पष्ट तथा स्वाभाविक ढंग से व्यक्त करता है।
