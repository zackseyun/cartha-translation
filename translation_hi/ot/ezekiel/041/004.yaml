source:
  edition: WLC
  text: וַ/יָּ֨מָד אֶת אָרְכּ֜/וֹ עֶשְׂרִ֣ים אַמָּ֗ה וְ/רֹ֛חַב עֶשְׂרִ֥ים אַמָּ֖ה אֶל פְּנֵ֣י הַֽ/הֵיכָ֑ל וַ/יֹּ֣אמֶר אֵלַ֔/י זֶ֖ה קֹ֥דֶשׁ הַ/קֳּדָשִֽׁים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/041/004.yaml
  text: 'Then he measured its length: twenty cubits[a], and the width: twenty cubits, before the nave; and he said to me, “This is the Most Holy Place.”'
translation:
  language: hi
  text: तब उसने उसकी लंबाई बीस हाथ और चौड़ाई बीस हाथ मापी, मंदिर के मुख्य कक्ष के सामने; और उसने मुझसे कहा, “यह परमपवित्र स्थान[a] है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, पारम्परिक रूप से, “महापवित्र स्थान”; शाब्दिक रूप से, “पवित्रों का पवित्र।”
    reason: इब्रानी श्रेष्ठतासूचक पदबंध के पारम्परिक और अधिक शाब्दिक विकल्प को सुरक्षित रखने के लिए।
lexical_decisions:
- source_word: וַיָּמָד
  choice: तब उसने…मापी
  rationale: वाव-क्रमागत क्रिया कथा में अगली घटना बताती है; ‘तब’ आधुनिक हिन्दी में इस क्रम को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: אָרְכּוֹ
  choice: उसकी लंबाई
  rationale: पुल्लिंग एकवचन प्रत्यय उस भीतरी कक्ष की ओर संकेत करता है जिसकी माप ली जा रही है।
- source_word: עֶשְׂרִים אַמָּה
  choice: बीस हाथ
  rationale: אַמָּה प्राचीन मानक लंबाई ‘क्यूबिट’ है; हिन्दी बाइबलीय प्रयोग में ‘हाथ’ इसे स्वाभाविक और पारदर्शी ढंग से व्यक्त करता है, बिना आधुनिक माप में अनुमानित परिवर्तन किए।
- source_word: וְרֹחַב
  choice: और चौड़ाई
  rationale: רֹחַב का सामान्य अर्थ चौड़ाई है; सम्बन्धसूचक भाव सन्दर्भ से स्पष्ट है।
- source_word: אֶל־פְּנֵי הַהֵיכָל
  choice: मन्दिर के मुख्य कक्ष के सामने
  rationale: הֵיכָל यहाँ पूरे मन्दिर-परिसर के बजाय मुख्य पवित्र कक्ष को दर्शाता है; אֶל־פְּנֵי स्थानिक सम्बन्ध ‘के सामने’ व्यक्त करता है। अलग वाक्यांश बनाकर हिन्दी में माप और कक्ष की स्थिति दोनों स्पष्ट रखे गए हैं।
- source_word: וַיֹּאמֶר אֵלַי
  choice: उसने मुझसे कहा
  rationale: यह कथात्मक सूत्र का सीधा और स्वाभाविक हिन्दी रूप है।
- source_word: קֹדֶשׁ הַקֳּדָשִׁים
  choice: परमपवित्र स्थान
  rationale: इब्रानी की श्रेष्ठतासूचक रचना भीतरी पवित्रतम कक्ष को दर्शाती है; ‘परमपवित्र स्थान’ आधुनिक हिन्दी में स्पष्ट और बाइबलीय सन्दर्भ में परिचित है।
theological_decisions:
- issue: कֹדֶשׁ הַקֳּדָשִׁים का अनुवाद
  choice: परमपवित्र स्थान
  alternative: शाब्दिक रूप से, ‘पवित्र स्थानों में परमपवित्र’
  rationale: मुख्य पाठ अर्थ को सहज हिन्दी में देता है, जबकि पादटिप्पणी इब्रानी की पारम्परिक श्रेष्ठतासूचक बनावट को सुरक्षित रखती है; इससे कोई अतिरिक्त साम्प्रदायिक व्याख्या नहीं जोड़ी जाती।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। प्राचीन माप के लिए प्रचलित बाइबलीय हिन्दी ‘हाथ’ रखा गया है। ‘मुख्य कक्ष’ पूरे मन्दिर और उसके भीतरी कक्ष के बीच भेद स्पष्ट करता है।
