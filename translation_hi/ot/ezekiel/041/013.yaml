    reason: lexical_alternative
lexical_decisions:
- source_word: וּמָדַד
  choice: फिर उसने मापा
  rationale: वाव के साथ आया क्रियापद कथा को आगे बढ़ाता है; ‘फिर’ स्वाभाविक हिन्दी में क्रम को व्यक्त करता है।
- source_word: הַבַּיִת
  choice: मन्दिर
  rationale: यहेजकेल के दर्शन के इस प्रसंग में शब्द सामान्य घर नहीं, मन्दिर की मुख्य संरचना को दर्शाता है।
- source_word: אֹרֶךְ מֵאָה אַמָּה
  choice: उसकी लम्बाई सौ हाथ थी
  rationale: माप की इब्रानी अभिव्यक्ति को स्पष्ट हिन्दी में रखा गया है और प्राचीन इकाई ‘हाथ’ सुरक्षित है।
- source_word: הַגִּזְרָה
  choice: अलग किया हुआ क्षेत्र
  rationale: यह मन्दिर-परिसर के भीतर अलग निर्धारित स्थान को दर्शाता है; अनिश्चितता बनाए रखने के लिए अधिक विशिष्ट भौगोलिक पहचान नहीं जोड़ी गई।
- source_word: הַבִּנְיָה
  choice: भवन
  rationale: निर्मित संरचना के लिए संक्षिप्त, गरिमापूर्ण और वर्तमान हिन्दी शब्द।
- source_word: קִירוֹתֶיהָ
  choice: उसकी दीवारें
  rationale: स्त्रीलिंग एकवचन प्रत्यय निकटवर्ती स्त्रीलिंग संज्ञा से सम्बद्ध है; हिन्दी वाक्य में बहुवचन संयुक्त कर्ता के कारण ‘इनकी’ से सम्बन्ध स्पष्ट किया गया है।
