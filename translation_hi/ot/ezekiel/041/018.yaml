source:
  edition: WLC
  text: וְ/עָשׂ֥וּי כְּרוּבִ֖ים וְ/תִֽמֹרִ֑ים וְ/תִֽמֹרָה֙ בֵּין כְּר֣וּב לִ/כְר֔וּב וּ/שְׁנַ֥יִם פָּנִ֖ים לַ/כְּרֽוּב־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/041/018.yaml
  text: Cherubim and palm trees were made on it[a], with a palm tree between cherub and cherub; and each cherub had two faces.
translation:
  language: hi
  text: उस पर[a] करूब और खजूर के पेड़ बनाए गए थे। हर दो करूबों के बीच एक खजूर का पेड़ था, और हर करूब के दो मुख थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उस पर उकेरे गए थे”; इब्रानी में शाब्दिक अर्थ “बनाए गए” है, पर इस स्थापत्य-संदर्भ में आशय संभवतः उकेरी हुई या गढ़ी हुई सजावट से है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשׂוּי
  choice: बनाए गए थे
  rationale: עשה का निष्क्रिय कृदन्त मूलतः ‘बनाया हुआ’ बताता है। स्थापत्य-सजावट के प्रसंग में बहुवचन अलंकरणों के अनुसार ‘बनाए गए थे’ स्वाभाविक है; ‘उस पर’ निकटवर्ती संदर्भ से पूरित है।
- source_word: כְּרוּבִים
  choice: करूब
  rationale: यह बाइबलीय प्राणियों के लिए प्रचलित हिन्दी लिप्यंतरण है; हिन्दी में रूप को अनावश्यक रूप से बहुवचन-प्रत्यय नहीं दिया गया।
- source_word: וְתִמֹרִים / וְתִמֹרָה
  choice: खजूर के पेड़ / एक खजूर का पेड़
  rationale: תמר मंदिर की सजावट में खजूर-वृक्ष की आकृति को सूचित करता है। ‘खजूर का पेड़’ साधारण आधुनिक हिन्दी में स्पष्ट है।
- source_word: בֵּין כְּרוּב לִכְרוּב
  choice: हर दो करूबों के बीच
  rationale: इब्रानी का एकवचन-वितरणात्मक प्रयोग प्रत्येक निकटवर्ती जोड़े के बीच एक वृक्ष होने का भाव देता है। यह हिन्दी में स्रोत के अर्थ को सहज रूप से व्यक्त करता है।
- source_word: וּשְׁנַיִם פָּנִים לַכְּרוּב
  choice: हर करूब के दो मुख थे
  rationale: शाब्दिक संरचना ‘और करूब के लिए दो मुख’ है। अगले पद से स्पष्ट वितरणात्मक अर्थ को हिन्दी में ‘हर करूब’ द्वारा स्वाभाविक बनाया गया है। ‘मुख’ वर्णन की गरिमा और दृश्यात्मकता बनाए रखता है।
theological_decisions:
- issue: मंदिर की सजावट में करूबों की छवियों का स्वरूप
  choice: करूब और खजूर-वृक्षों को वास्तविक सजावटी आकृतियों के रूप में वर्णित किया गया है, बिना प्रतीकात्मक विस्तार के।
  alternative: इन आकृतियों का प्रतीकात्मक या प्रतिरूपात्मक अर्थ अनुवाद में जोड़ना।
  rationale: इब्रानी पद स्थापत्य-सजावट का सीधा वर्णन करता है और स्वयं उसका कोई धर्मवैज्ञानिक प्रतीकार्थ नहीं बताता।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज किंतु गरिमापूर्ण स्थापत्य-वर्णन। ‘करूब’ बाइबलीय पारिभाषिक शब्द के रूप में रखा गया है; ‘हर दो करूबों के बीच’ स्रोत की वितरणात्मक रचना को स्वाभाविक हिन्दी में व्यक्त करता है।
