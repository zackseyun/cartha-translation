base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/041/015.yaml
  text: 'Then he measured the length of the building facing the separate area that was behind it[a], with its galleries on this side and on that side: one hundred cubits[b]; and the inner nave and the porches of the court.'
translation:
  language: hi
  text: 'फिर उसने उस भवन की लंबाई मापी जो उसके पीछे स्थित अलग क्षेत्र के सामने था, उसकी इस ओर और उस ओर की गैलरियों[a] सहित: एक सौ हाथ; भीतरी सभागृह[b] और आँगन के बरामदे।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘स्तम्भयुक्त बरामदे’ अथवा कोई अन्य पार्श्ववर्ती स्थापत्य संरचना; यहाँ प्रयुक्त इब्रानी शब्द का ठीक अर्थ अनिश्चित है।
    reason: lexical_alternative
  - marker: b
    text: या ‘भीतरी मंदिर’ अथवा ‘भीतरी पवित्रस्थान’।
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמָדַד
  choice: फिर उसने मापा
  rationale: वाव-युक्त क्रिया वर्णन को अगले क्रमिक कार्य की ओर बढ़ाती है; ‘फिर’ आधुनिक हिन्दी में इस क्रम को स्वाभाविक रूप से व्यक्त करता है।
- source_word: הַבִּנְיָן
  choice: भवन
  rationale: यह सामान्य स्थापत्य-संज्ञा है; मन्दिर-परिसर के प्रसंग में ‘भवन’ स्पष्ट और गरिमापूर्ण है।
- source_word: אֶל־פְּנֵי הַגִּזְרָה
  choice: अलग क्षेत्र की ओर मुख किए हुए
  rationale: אֶל־פְּנֵי दिशा अथवा अभिमुखता बताता है, और הַגִּזְרָה मन्दिर के पीछे के पृथक क्षेत्र को सूचित करता है; अनिश्चित स्थापत्य पहचान को अधिक विशिष्ट नहीं बनाया गया।
- source_word: אֲשֶׁר עַל־אַחֲרֶיהָ
  choice: उसके पीछे स्थित
  rationale: स्थान-संबंध को सहज हिन्दी में व्यक्त किया गया है; यहाँ अलग क्षेत्र को भवन के पीछे स्थित समझा गया है, जैसा प्रसंग संकेत करता है।
- source_word: וְאַתִּיקֶיהָ
  choice: उसकी दीर्घाएँ
  rationale: यह दुर्लभ और अनिश्चित स्थापत्य शब्द है। ‘दीर्घाएँ’ सम्भावित पार्श्ववर्ती या गलियारे-जैसी संरचनाओं को व्यक्त करता है, जबकि विकल्प पादटिप्पणी में सुरक्षित हैं।
- source_word: מִפּוֹ וּמִפּוֹ
  choice: इस ओर और उस ओर
  rationale: दोनों पार्श्वों को दर्शाने वाली मूल स्थानवाचक पुनरुक्ति को बनाए रखा गया है।
- source_word: מֵאָה אַמָּה
  choice: एक सौ हाथ
  rationale: प्राचीन माप ‘अम्मा’ के लिए प्रचलित बाइबिलीय हिन्दी ‘हाथ’ रखा गया है और आधुनिक इकाई में अनुमानित रूपांतरण नहीं किया गया।
- source_word: הַהֵיכָל הַפְּנִימִי
  choice: भीतरी सभागृह
  rationale: הֵיכָל यहाँ पूरे मन्दिर-परिसर के बजाय मुख्य आन्तरिक कक्ष का बोध करा सकता है; ‘सभागृह’ इस स्थापत्य भेद को बनाए रखता है।
- source_word: וְאֻלַמֵּי הֶחָצֵר
  choice: आँगन के बरामदे
  rationale: אוּלָם के बरामदा/प्रवेश-मंडप जैसे अर्थ को सामान्य आधुनिक हिन्दी में व्यक्त किया गया है।
