base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/041/003.yaml
  text: 'Then he went inside and measured the jambs of the entrance: two cubits[a]; the entrance: six cubits[b]; and the width of the entrance: seven cubits.'
translation:
  language: hi
  text: "तब वह भीतर गया और उसने प्रवेश-द्वार के चौखट-स्तंभ को मापा: दो हाथ[a]; द्वार: छह हाथ[b]; और द्वार की चौड़ाई: सात हाथ।\n\n[a] या “द्वार का भित्ति-स्तंभ।” \n\n[b] इब्रानी में शाब्दिक रूप से “द्वार की चौड़ाई सात हाथ” है। यहाँ वास्तु-संबंधी आशय स्पष्ट नहीं है; कुछ लोग इसे केवल खुले मार्ग की चौड़ाई के बजाय उससे जुड़ी संरचना की चौड़ाई समझते हैं।"
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “द्वार का भित्ति-स्तंभ।”
    reason: אֵיל का वास्तु-संबंधी अर्थ चौखट-स्तंभ, निकला हुआ सहारा, अथवा भित्ति-स्तंभ हो सकता है; वैकल्पिक तकनीकी अभिव्यक्ति दी गई है।
  - marker: b
    text: इब्रानी में शाब्दिक रूप से “द्वार की चौड़ाई सात हाथ” है। यहाँ वास्तु-संबंधी आशय स्पष्ट नहीं है; कुछ लोग इसे केवल खुले मार्ग की चौड़ाई के बजाय उससे जुड़ी संरचना की चौड़ाई समझते हैं।
    reason: छह और सात हाथ के निकटवर्ती मापों का वास्तु-संबंध अस्पष्ट है; टिप्पणी कठिनाई बताती है, पर किसी एक पुनर्निर्माण को निर्णायक नहीं बनाती।
