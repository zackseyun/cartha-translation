  choice: तब वह ... गया
  rationale: वाव के साथ आया क्रियात्मक क्रम कथा को आगे बढ़ाता है; संदर्भ में मापने वाला व्यक्ति और भीतर जाता है।
- source_word: לִפְנִימָה
  choice: भीतर
  rationale: यह क्रियाविशेषण अंदर की ओर जाने को बताता है; किसी विशेष भीतरी कक्ष का उल्लेख करना मूल से अधिक व्याख्यात्मक होता।
- source_word: וַיָּמָד
  choice: उसने ... मापा
  rationale: मन्दिर-दर्शन में माप लेने की क्रिया का सीधा और स्वाभाविक अनुवाद।
- source_word: אֵיל הַפֶּתַח
  choice: प्रवेश-द्वार की चौखट के दोनों बाजुओं
  rationale: वास्तु-संदर्भ में אֵיל द्वार के निकले हुए सहारे, बाजू या भित्ति-स्तंभ को सूचित कर सकता है। सामान्य पाठक के लिए ‘चौखट के दोनों बाजू’ स्पष्ट है; वैकल्पिक तकनीकी अर्थ पादटिप्पणी में रखा गया है।
- source_word: שְׁתַּיִם אַמּוֹת
  choice: दो हाथ
  rationale: माप का सीधा अनुवाद; ‘हाथ’ हिन्दी में बाइबलीय cubit के लिए प्रचलित और सुबोध शब्द है।
- source_word: וְהַפֶּתַח
  choice: द्वार
  rationale: मूल में संक्षिप्त वास्तु-सूची जैसी रचना है। केवल ‘द्वार’ कहने से यह संक्षिप्तता और आयाम की अस्पष्टता बनी रहती है।
- source_word: שֵׁשׁ אַמּוֹת
  choice: छः हाथ
  rationale: माप का सीधा अनुवाद।
- source_word: וְרֹחַב הַפֶּתַח
  choice: और द्वार की चौड़ाई
  rationale: रֹחַב का सामान्य अर्थ ‘चौड़ाई’ है। वास्तु-विन्यास कठिन होने पर भी मूल का सहज शाब्दिक अर्थ बनाए रखा गया है।
- source_word: שֶׁבַע אַמּוֹת
  choice: सात हाथ
  rationale: माप का सीधा अनुवाद।
