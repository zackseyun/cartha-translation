base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/041/006.yaml
  text: And the side chambers were side chamber upon side chamber[a], three and thirty times; and they entered into the wall that belonged to the house for the side chambers all around, so that they might be supported[b], but they were not supported by the wall of the house.
translation:
  language: hi
  text: और पार्श्व-कोठरियाँ तीन मंज़िलों में थीं, एक कोठरी दूसरी के ऊपर; हर मंज़िल में तीस कोठरियाँ थीं[a]। वे चारों ओर की पार्श्व-कोठरियों के लिए भवन से सम्बन्धित दीवार में इस प्रकार लगी थीं कि उन्हें सहारा मिले[b]; पर वे भवन की दीवार में जकड़ी हुई नहीं थीं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से ‘तीन और तीस बार’ है। इस कठिन स्थापत्य-वाक्यांश को सामान्यतः ‘तीन मंज़िलें, प्रत्येक में तीस कोठरियाँ’ समझा जाता है; इसका ठीक व्याकरणिक विभाजन निश्चित नहीं है।
    reason: lexical_alternative
  - marker: b
    text: ‘सहारा मिले’ और ‘जकड़ी हुई’ के लिए इब्रानी में एक ही मूल क्रिया है, जिसका अर्थ ‘पकड़ी हुई’, ‘स्थिर की हुई’ या ‘जुड़ी हुई’ भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הַצְּלָעוֹת / צֵלָע
  choice: बगल की कोठरियाँ / एक के ऊपर एक
  rationale: मन्दिर-स्थापत्य के इस प्रसंग में צלע मुख्य भवन के पार्श्व में बनी कोठरियों को सूचित करता है; दोहराया हुआ एकवचन उनके स्तरबद्ध विन्यास को व्यक्त करता है।
- source_word: שָׁלוֹשׁ וּשְׁלֹשִׁים פְּעָמִים
  choice: कुल तैंतीस[a]
  rationale: शाब्दिक रूप से ‘तीन और तीस बार’ है, पर स्थापत्य-संदर्भ में यह समयगत पुनरावृत्ति से अधिक कोठरियों या स्थानों की संख्या जान पड़ती है; हिन्दी में ‘कुल तैंतीस’ स्वाभाविक है और अनिश्चितता पादटिप्पणी में सुरक्षित है।
- source_word: וּבָאוֹת בַּקִּיר אֲשֶׁר לַבַּיִת
  choice: भवन से लगी उस दीवार में ... बैठाई गई थीं
  rationale: स्त्रीलिंग बहुवचन रूप को कोठरियों से जोड़ा गया है। ‘बैठाई गई’ स्थापत्य में किसी संरचना के दीवार के भीतर टिकने या प्रवेश करने का स्वाभाविक हिन्दी वर्णन है; ‘भवन से लगी’ मुख्य भवन की दीवार और सहायक दीवार के बीच सम्भावित भेद बनाए रखता है।
- source_word: סָבִיב סָבִיב
  choice: चारों ओर
  rationale: दोहराव पूरे परिवेश में घेरे होने पर बल देता है; ‘चारों ओर’ आधुनिक हिन्दी में यही अर्थ सहजता से देता है।
- source_word: לִהְיוֹת אֲחוּזִים / וְלֹא יִהְיוּ אֲחוּזִים
  choice: थमी रहें / जड़ी हुई नहीं थीं
  rationale: אחז यहाँ पकड़े, टिकाए या स्थिर रखे जाने का स्थापत्यगत भाव देता है। प्रसंगानुसार अलग हिन्दी अभिव्यक्तियाँ वाक्य को स्वाभाविक बनाती हैं, जबकि पादटिप्पणी मूल क्रिया की समानता और वैकल्पिक अर्थ स्पष्ट करती है।
