  text: וְ/הַ/בִּנְיָ֡ן אֲשֶׁר֩ אֶל פְּנֵ֨י הַ/גִּזְרָ֜ה פְּאַ֣ת דֶּֽרֶךְ הַ/יָּ֗ם רֹ֚חַב שִׁבְעִ֣ים אַמָּ֔ה וְ/קִ֧יר הַ/בִּנְיָ֛ן חָֽמֵשׁ אַמּ֥וֹת רֹ֖חַב סָבִ֣יב סָבִ֑יב וְ/אָרְכּ֖/וֹ תִּשְׁעִ֥ים אַמָּֽה־־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/041/012.yaml
  text: And the building that faced the separate area on the side toward the west was seventy cubits wide[a], and the wall of the building was five cubits wide all around, and its length was ninety cubits.
translation:
  language: hi
  text: और वह भवन, जिसका मुख अलग किए गए क्षेत्र की ओर था, पश्चिम की तरफ[a] सत्तर हाथ चौड़ा था। भवन की दीवार चारों ओर पाँच हाथ मोटी थी, और भवन की लंबाई नब्बे हाथ थी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक अर्थ, “समुद्र के मार्ग की तरफ”; अर्थात पश्चिम की तरफ।
    reason: lexical_alternative
lexical_decisions:
- source_word: הַבִּנְיָן
  choice: भवन
  rationale: यह शब्द निर्मित इमारत या ढाँचे को दर्शाता है; स्थापत्य-वर्णन में ‘भवन’ स्वाभाविक और गरिमापूर्ण है।
- source_word: אֲשֶׁר אֶל־פְּנֵי הַגִּזְרָה
  choice: जिसका मुख अलग किए गए क्षेत्र की ओर था
  rationale: אֶל־פְּנֵי स्थानिक अभिमुखता को और הַגִּזְרָה पृथक अथवा निर्धारित क्षेत्र को दर्शाता है। यह अनुवाद संबंध को स्पष्ट रखते हुए मूल की संरचना के निकट है।
- source_word: פְּאַת דֶּרֶךְ הַיָּם
  choice: पश्चिम की तरफ
  rationale: शाब्दिक अभिव्यक्ति ‘समुद्र के मार्ग की तरफ’ है; इस्राएल की भौगोलिक दिशा-भाषा में समुद्र पश्चिम को सूचित करता है। शाब्दिक रूप पाद-टिप्पणी में सुरक्षित है।
- source_word: רֹחַב שִׁבְעִים אַמָּה
  choice: सत्तर हाथ चौड़ा
  rationale: רֹחַב चौड़ाई बताता है। ‘हाथ’ אמה के लिए हिन्दी बाइबलीय माप-शब्द है और यहाँ सहज वाक्य-विन्यास में रखा गया है।
- source_word: קִיר הַבִּנְיָן חָמֵשׁ אַמּוֹת רֹחַב
  choice: भवन की दीवार पाँच हाथ मोटी थी
  rationale: दीवार के संदर्भ में माप का आशय उसकी मोटाई है; ‘मोटी’ हिन्दी में ‘चौड़ी’ से अधिक स्वाभाविक और वास्तुशिल्पीय रूप से स्पष्ट है।
- source_word: סָבִיב סָבִיב
  choice: चारों ओर
  rationale: दोहराया हुआ क्रियाविशेषण पूर्ण परिधि का भाव देता है, जिसे ‘चारों ओर’ स्वाभाविक रूप से व्यक्त करता है।
- source_word: וְאָרְכּוֹ תִּשְׁעִים אַמָּה
  choice: और भवन की लंबाई नब्बे हाथ थी
  rationale: प्रत्यय का संदर्भ स्पष्ट करने के लिए ‘उसकी’ के स्थान पर ‘भवन की’ कहा गया है; इससे स्थापत्य-वर्णन में संभावित संदिग्धता दूर होती है।
