lexical_decisions:
- source_word: רֹחַב
  choice: चौड़ाई
  rationale: यह संज्ञा किसी वास्तु-भाग के क्षैतिज माप को बताती है; आधुनिक हिन्दी में “चौड़ाई” सबसे स्वाभाविक है।
- source_word: פְּנֵי
  choice: सामने का भाग
  rationale: शाब्दिक अर्थ “मुख” है, पर वास्तु-संदर्भ में यह भवन के सामने वाले भाग को दर्शाता है।
- source_word: הַבַּיִת
  choice: मन्दिर
  rationale: यहेजकेल के इस दर्शन में “घर” से मन्दिर का भवन अभिप्रेत है; “मन्दिर” आधुनिक पाठक के लिए संदर्भ स्पष्ट करता है।
- source_word: הַגִּזְרָה
  choice: अलग क्षेत्र
  rationale: यह मन्दिर-परिसर से संबद्ध अलग किए गए स्थान को सूचित करता है; “अलग क्षेत्र” अर्थ को स्पष्ट रखते हुए किसी अनिश्चित धार्मिक व्याख्या को नहीं जोड़ता।
- source_word: לַקָּדִים
  choice: पूर्व दिशा में
  rationale: यह पूर्वी दिशा अथवा अभिमुखता बताता है। “पूर्व दिशा में” वास्तु-मापन के संदर्भ में स्वाभाविक हिन्दी है और स्थानगत संबंध की कुछ व्यापकता बनाए रखता है।
- source_word: מֵאָה אַמָּה
  choice: सौ हाथ
  rationale: यह प्राचीन माप की सीधी अभिव्यक्ति है। हिन्दी बाइबलीय प्रयोग में “हाथ” क्यूबिट के लिए परिचित शब्द है; आधुनिक इकाई में परिवर्तन नहीं किया गया।
