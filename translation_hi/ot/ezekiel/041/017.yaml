  yaml_path: translation/ot/ezekiel/041/017.yaml
  text: Above the doorway[a], and as far as the inner house, and outside, and on all the wall all around, in the inner part and in the outer part[b], were measurements.
translation:
  language: hi
  text: द्वार के ऊपर से लेकर भीतरी भवन[b] तक, और बाहर की ओर भी, चारों ओर की पूरी दीवार पर—भीतरी और बाहरी दोनों भागों में—माप[a] थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘आयाम’। इब्रानी संज्ञा वास्तु-संदर्भ में माप या आयामसूचक विनिर्देशों का अर्थ दे सकती है।
    reason: lexical_alternative
  - marker: b
    text: या ‘भीतरी मंदिर’। यहेजकेल के मंदिर-दर्शन में ‘भवन’ के लिए आया इब्रानी शब्द प्रायः मंदिर की इमारत को सूचित करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵעַל הַפֶּתַח
  choice: द्वार के ऊपर से
  rationale: מֵעַל द्वार के ऊपर स्थित क्षेत्र को सूचित करता है; अगले וְעַד के साथ ‘से लेकर ... तक’ हिन्दी में स्वाभाविक स्थानिक सीमा व्यक्त करता है।
- source_word: וְעַד הַבַּיִת הַפְּנִימִי
  choice: लेकर भीतरी भवन तक
  rationale: בַּיִת मंदिर-दर्शन में मंदिर की इमारत को सूचित कर सकता है। ‘भवन’ मूल के ‘घर/भवन’ बिंब को बचाता है और ‘कक्ष’ जैसी अनावश्यक विशिष्टता से बचता है।
- source_word: וְלַחוּץ
  choice: बाहर भी
  rationale: यह भीतर के विपरीत बाहरी क्षेत्र को सूचित करता है; ‘भी’ हिन्दी में समावेश का भाव स्पष्ट करता है।
- source_word: וְאֶל כָּל הַקִּיר סָבִיב סָבִיב
  choice: और चारों ओर की पूरी दीवार पर
  rationale: אֶל यहाँ दीवार की सतह से संबंध बताता है, इसलिए ‘पर’ उपयुक्त है। दोहराया हुआ סָבִיב व्यापक घेराव पर बल देता है, जिसे ‘चारों ओर की पूरी’ से व्यक्त किया गया है।
- source_word: בַּפְּנִימִי וּבַחִיצוֹן
  choice: भीतरी और बाहरी दोनों भागों में
  rationale: दोनों विशेषण संज्ञा के रूप में प्रयुक्त हैं और अंदर-बाहर के क्षेत्रों का भेद रखते हैं। ‘दोनों’ युग्म को स्वाभाविक हिन्दी में स्पष्ट करता है।
- source_word: מִדּוֹת
  choice: माप थे
  rationale: बहुवचन संज्ञा का मूल अर्थ ‘माप’ या ‘आयाम’ है। इब्रानी वाक्य खंडित/अध्याहृत है; हिन्दी में वाक्य पूरा करने के लिए ‘थे’ जोड़ा गया है, बिना यह तय किए कि माप किस रूप में प्रदर्शित थे।
