base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/041/022.yaml
  text: The altar was of wood[a], three cubits high and two cubits long; its corners, its length, and its sides were of wood. And he said to me, “This is the table that is before Yahweh.”
translation:
  language: hi
  text: वेदी लकड़ी की थी[a]। वह तीन हाथ ऊँची और दो हाथ लंबी थी। उसके कोने, उसकी लंबाई और उसकी दीवारें लकड़ी की थीं। और उसने मुझसे कहा, “यह वह मेज़ है जो याहवे के सामने है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी पाठ आरम्भ में इसे “वेदी” कहता है, पर आगे इसी को “मेज़” बताता है; सम्भवतः यह इस वस्तु की वेदी-जैसी और मेज़-जैसी भूमिका को दर्शाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמִּזְבֵּחַ
  choice: वेदी
  rationale: यह संज्ञा सामान्यतः ‘वेदी’ को सूचित करती है। आगे वस्तु को ‘मेज़’ कहा गया है, फिर भी मूल पाठ के शब्द-परिवर्तन को बनाए रखने के लिए यहाँ ‘वेदी’ रखा गया है।
- source_word: עֵץ
  choice: लकड़ी की
  rationale: यहाँ शब्द वस्तु की सामग्री बताता है; आधुनिक हिन्दी में ‘लकड़ी की’ स्वाभाविक और स्पष्ट है।
- source_word: שָׁלוֹשׁ אַמּוֹת גָּבֹהַּ
  choice: तीन हाथ ऊँची
  rationale: אַמָּה प्राचीन माप ‘हाथ’ है; हिन्दी बाइबलीय प्रयोग में यह सुबोध है और मूल माप को आधुनिक इकाई में अनुमानतः बदलने से बचाता है।
- source_word: וְאָרְכּוֹ שְׁתַּיִם אַמּוֹת
  choice: दो हाथ लंबी
  rationale: मूल पाठ की स्पष्ट लंबाई को सहज हिन्दी आयामी अभिव्यक्ति में रखा गया है।
- source_word: וּמִקְצֹעוֹתָיו לוֹ
  choice: उसके कोने
  rationale: מִקְצֹעוֹתָיו का सामान्य अर्थ ‘उसके कोने’ है; לוֹ को स्वामित्व/अस्तित्वसूचक मानकर हिन्दी में स्वाभाविक रूप से समाहित किया गया है।
- source_word: וְאָרְכּוֹ
  choice: उसकी लंबाई के भाग
  rationale: इसी शब्द का पहले आयाम के लिए प्रयोग हो चुका है, पर इस सूची में लकड़ी के संरचनात्मक अंग का आशय प्रतीत होता है। ‘लंबाई के भाग’ मूल की असामान्यता को पूरी तरह मिटाए बिना हिन्दी में बोधगम्य बनाता है।
- source_word: וְקִירֹתָיו
  choice: उसकी दीवारें
  rationale: קִיר का मूल अर्थ ‘दीवार’ है। छोटी साज-सज्जा की वस्तु के संदर्भ में ‘पार्श्व’ संभव है, पर ‘दीवारें’ अधिक प्रत्यक्ष स्रोत-संगत अनुवाद है।
- source_word: זֶה הַשֻּׁלְחָן
  choice: यह वह मेज़ है
  rationale: שֻׁלְחָן को ‘मेज़’ अनूदित कर मूल में ‘वेदी’ से ‘मेज़’ की ओर हुए स्पष्ट शब्द-परिवर्तन को सुरक्षित रखा गया है।
- source_word: לִפְנֵי יְהוָה
  choice: याहवे के सामने
  rationale: לִפְנֵי स्थानिक/उपस्थिति-सूचक ‘सामने’ है और יהוה को उसके व्यक्तिगत वाचा-नाम ‘याहवे’ के रूप में लिप्यंतरित किया गया है।
theological_decisions:
- issue: वेदी और मेज़ के बीच संबंध
  choice: मुख्य पाठ में दोनों अलग शब्दों—‘वेदी’ और ‘मेज़’—को बनाए रखा गया
  alternative: दोनों को केवल ‘वेदी’, केवल ‘मेज़’, या सर्वत्र ‘वेदी-मेज़’ कहना
  rationale: इब्रानी पाठ पहले מִזְבֵּחַ और फिर שֻׁלְחָן कहता है। दोनों को बनाए रखने से वस्तु की वेदी-जैसी और मेज़-जैसी पहचान का वास्तविक तनाव पाठक के सामने रहता है।
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में चार अक्षरों वाला व्यक्तिगत ईश्वरीय नाम उपस्थित है; ‘याहवे’ उसे उपाधि में बदलने के बजाय नाम के रूप में प्रस्तुत करता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। प्राचीन माप אַמָּה के लिए प्रचलित हिन्दी ‘हाथ’ रखा गया है। मूल पाठ की ‘वेदी/मेज़’ भिन्नता को न तो समरूप किया गया है और न किसी सम्प्रदायगत व्याख्या से सुलझाया गया है।
