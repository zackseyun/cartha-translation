    issue: The measure and final architectural term are syntactically misrelated.
    rationale: The wording ‘एक पूरा सरकंडा, अर्थात जोड़ तक छह हाथ ऊँची थी’ places ‘जोड़ तक’ inside the apposition to the measure and turns the phrase into an awkward height description. The source states a full reed, six cubits, followed by the disputed architectural term.
  - severity: low
    issue: The existing single footnote conflates two distinct uncertainties and is anchored only after ‘चबूतरा।’
    rationale: The contextual sense of ‘elevation/raised base’ and the much more obscure final term אַצִּילָה are best distinguished with separate anchors, especially since the latter occurs at the end of the verse.
