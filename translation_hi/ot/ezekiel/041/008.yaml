  text: וְ/רָאִ֧יתִי לַ/בַּ֛יִת גֹּ֖בַהּ סָבִ֣יב סָבִ֑יב מיסדות הַ/צְּלָעוֹת֙ מְל֣וֹ הַ/קָּנֶ֔ה שֵׁ֥שׁ אַמּ֖וֹת אַצִּֽילָה׀׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/041/008.yaml
  text: And I saw that the house had a raised platform all around[a]; the foundations of the side chambers were a full reed of six cubits to the offset.
translation:
  language: hi
  text: और मैंने देखा कि भवन के चारों ओर ऊँचा आधार था[a]; बगल की कोठरियों की नींवों का माप एक पूरा मापने का सरकंडा—अर्थात् छह हाथ—था, जोड़ तक[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “भवन के चारों ओर ऊँचाई थी।” इब्रानी शब्द का शाब्दिक अर्थ “ऊँचाई” है; इस स्थापत्य संदर्भ में इसका अर्थ ऊँचा आधार या चबूतरा भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी स्थापत्य शब्द का अर्थ अनिश्चित है; इसका अर्थ “जोड़ तक,” “निकले हुए किनारे तक,” “कगार तक,” या संभवतः “आधार पर” हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרָאִיתִי
  choice: और मैंने देखा
  rationale: रָאָה के प्रथम पुरुष एकवचन रूप और कथात्मक संयोजक को सीधे तथा स्वाभाविक ढंग से व्यक्त करता है।
- source_word: לַבַּיִת גֹּבַהּ
  choice: भवन के ... एक ऊँचा चबूतरा था
  rationale: गֹּבַהּ का मूल अर्थ ऊँचाई है; स्थापत्य-संदर्भ में यह भवन को घेरे हुए ऊँचे आधार या चबूतरे की ओर संकेत करता है। 'ऊँचा चबूतरा' पाठक के लिए दृश्य संरचना स्पष्ट करता है, यद्यपि पद का शाब्दिक अर्थ केवल 'ऊँचाई' है।
- source_word: סָבִיב סָבִיב
  choice: चारों ओर
  rationale: दोहराया हुआ क्रियाविशेषण भवन को पूरी तरह घेरे होने का भाव देता है; 'चारों ओर' आधुनिक हिन्दी में स्वाभाविक है।
- source_word: מיסדות הַצְּלָעוֹת
  choice: बगल की कोठरियों की नींव
  rationale: מיסדות नींवों/आधार-संरचना को और צלעות इस मंदिर-संदर्भ में मुख्य भवन से लगी पार्श्व कोठरियों को सूचित करता है।
- source_word: מְלֹא הַקָּנֶה
  choice: एक पूरा सरकंडा
  rationale: मापने के पूर्ण कנה को निकटता से व्यक्त करता है; अगले पदबंध में उसका माप छह हाथ बताया गया है।
- source_word: שֵׁשׁ אַמּוֹת
  choice: छह हाथ
  rationale: प्राचीन लंबाई की इकाई אַמָּה के लिए हिन्दी बाइबलीय प्रयोग में समझ में आने वाला पारंपरिक समतुल्य है।
- source_word: אַצִּילָה
  choice: जोड़ तक
  rationale: यह दुर्बोध स्थापत्य शब्द संभवतः जोड़, निकले हुए किनारे या आधार के किसी बिंदु को बताता है। मुख्य पाठ में 'जोड़ तक' रखा गया है और अनिश्चितता पादटिप्पणी में सुरक्षित है।
