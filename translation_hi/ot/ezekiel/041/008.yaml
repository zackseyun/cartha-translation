  naturalness: ‘एक पूरा सरकंडा, अर्थात जोड़ तक छह हाथ ऊँची थी’ is grammatically and architecturally difficult in modern Hindi. Recasting the phrase as the measurement of the foundations is clear and preserves the Hebrew sequence. ‘ऊँचा आधार’ is more neutral and natural than ‘ऊँचा चबूतरा’ while retaining the contextual architectural sense.
  terminology: ‘भवन,’ ‘बगल की कोठरियाँ,’ ‘नींवों,’ and ‘मापने का सरकंडा’ are suitable modern Hindi architectural renderings. ‘हाथ’ is retained as the conventional rendering of cubit. The uncertain term אַצִּילָה remains in the main text as ‘जोड़ तक’ but is explicitly qualified in a footnote; the contextual rendering of גֹּבַהּ also receives its own note.
