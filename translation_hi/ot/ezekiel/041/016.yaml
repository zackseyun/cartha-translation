base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/041/016.yaml
  text: the thresholds[a], the recessed windows, and the galleries all around on their three sides, opposite the threshold, were paneled with wood all around, from the floor up to the windows[c][b]; and the windows were covered.
translation:
  language: hi
  text: दहलीज़ें, भीतर धँसी हुई खिड़कियाँ[a] और चारों ओर की दीर्घाएँ[b], उनकी तीनों दिशाओं में, दहलीज़ के सामने, चारों ओर फर्श से खिड़कियों तक लकड़ी से मढ़ी हुई थीं[c]; और खिड़कियाँ ढकी हुई थीं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘बंद खिड़कियाँ,’ ‘पटों वाली खिड़कियाँ’ अथवा ‘जालीदार खिड़कियाँ’; इब्रानी में संभवतः उस समय केवल बंद खिड़कियों के बजाय एक स्थायी स्थापत्य-प्रकार का वर्णन है।
    reason: lexical_alternative
  - marker: b
    text: ‘दीर्घाएँ’ के लिए प्रयुक्त इब्रानी शब्द दुर्लभ है; इसका अर्थ छज्जे, स्तंभयुक्त बरामदे या ऊपरी गलियारे भी हो सकता है।
    reason: lexical_alternative
  - marker: c
    text: या ‘लकड़ी का आवरण’ अथवा ‘लकड़ी की परत’; इब्रानी अभिव्यक्ति दुर्लभ है और लकड़ी से ढकने या मढ़ने का संकेत देती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הַסִּפִּים / הַסַּף
  choice: देहलियाँ / देहली
  rationale: סַף द्वार से जुड़ी देहली, चौखट या निचला भाग दर्शा सकता है। मंदिर के स्थापत्य-वर्णन में ‘देहली’ ठोस संरचनात्मक अर्थ को स्वाभाविक रूप से व्यक्त करती है।
- source_word: הַחַלּוֹנִים הָאֲטֻמוֹת
  choice: संकरी खिड़कियाँ
  rationale: אֲטֻמוֹת का मूल भाव ‘बंद’ या ‘रुद्ध’ है, पर यहाँ संभवतः किसी स्थायी स्थापत्य-रूप—संकरी, जालीदार या बंद बनावट वाली खिड़कियों—का वर्णन है। ‘संकरी खिड़कियाँ’ प्रसंग के अनुकूल है, जबकि अनिश्चितता पादटिप्पणी में रखी गई है।
- source_word: הָאַתִּיקִים
  choice: दीर्घाएँ
  rationale: यह यहेजकेल में प्रयुक्त एक दुर्लभ स्थापत्य-शब्द है। ‘दीर्घाएँ’ आसपास बनी लंबी ऊपरी या स्तंभयुक्त संरचनाओं का सामान्य और गरिमापूर्ण संकेत देता है, बिना उसके ठीक रूप को निश्चित किए।
- source_word: סָבִיב לִשְׁלָשְׁתָּם
  choice: तीनों तरफ़
  rationale: वाक्यांश तीन ओर के स्थानिक विस्तार को सूचित करता है। ‘तीनों तरफ़’ संक्षिप्त और स्वाभाविक है तथा इसे तीन मंज़िलें मानकर अतिरिक्त व्याख्या नहीं करता।
- source_word: נֶגֶד הַסַּף
  choice: देहली के सामने
  rationale: נֶגֶד का अर्थ ‘सामने’ या ‘आमने-सामने’ है। यह अनुवाद स्थापत्य-संबंध को स्पष्ट रखते हुए मूल की स्थानिक भाषा को बनाए रखता है।
- source_word: שְׂחִיף עֵץ
  choice: लकड़ी से मढ़ी हुई थीं
  rationale: दुर्लभ शब्द שְׂחִיף संभवतः आवरण, पटरों की मढ़ाई या लकड़ी की परत को दर्शाता है। क्रियात्मक हिन्दी अनुवाद सहज है; अन्य संभावनाएँ पादटिप्पणी में दी गई हैं।
- source_word: וְהָאָרֶץ
  choice: फर्श से
  rationale: אֶרֶץ सामान्यतः भूमि है, किंतु भवन के भीतरी स्थापत्य-वर्णन में यहाँ निचली सतह अर्थात फर्श अभिप्रेत है।
- source_word: עַד הַחַלּוֹנוֹת
  choice: खिड़कियों तक
  rationale: यह लकड़ी की मढ़ाई की ऊपरी सीमा बताने वाला सीधा स्थानिक वाक्यांश है।
- source_word: וְהַחַלּוֹנוֹת מְכֻסּוֹת
  choice: और खिड़कियाँ ढकी हुई थीं
  rationale: מְכֻסּוֹת का सीधा अर्थ ‘ढकी हुई’ है। आवरण किस प्रकार का था, यह मूल में नहीं बताया गया, इसलिए अनुवाद भी उसे अनिर्दिष्ट रखता है।
