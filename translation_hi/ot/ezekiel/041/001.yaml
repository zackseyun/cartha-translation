  yaml_path: translation/ot/ezekiel/041/001.yaml
  text: 'Then he brought me into the nave and measured the jambs: six cubits wide on one side and six cubits wide on the other side—the width of the tent[a][b].'
translation:
  language: hi
  text: तब वह मुझे मन्दिर के मुख्य कक्ष[a] में ले गया और उसने द्वार-चौखट के पार्श्व-भागों को नापा—एक ओर की चौड़ाई छह हाथ और दूसरी ओर की चौड़ाई छह हाथ थी—यह तम्बू[b] की चौड़ाई थी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “मुख्य भवन” अथवा “पवित्र स्थान।” इब्रानी शब्द पूरे मन्दिर-परिसर को नहीं, बल्कि मन्दिर-भवन के प्रधान कक्ष को दर्शाता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से “तम्बू।” मन्दिर के इस दर्शन में कुछ लोग इसे एक तकनीकी स्थापत्य पद मानकर “निवास-मण्डप” समझते हैं।
    reason: lexical_alternative
