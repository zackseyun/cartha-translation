translation:
  language: hi
  text: मन्दिर के मुख्य कक्ष की चौखट चौकोर थी, और पवित्रस्थान का अग्रभाग भी वैसा ही दिखाई देता था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הֵיכָל
  choice: मन्दिर का मुख्य कक्ष
  rationale: इस मन्दिर-दर्शन में यह शब्द पूरे मन्दिर-परिसर के बजाय भीतरी पवित्रस्थान से पहले वाले मुख्य कक्ष को सूचित करता है।
- source_word: מְזוּזַת
  choice: चौखट
  rationale: यह द्वार की खड़ी चौखट अथवा समूची द्वार-चौखट को सूचित कर सकता है; उसके चौकोर आकार के वर्णन के साथ ‘चौखट’ स्वाभाविक है।
- source_word: רְבֻעָה
  choice: चौकोर
  rationale: विशेषण चार कोनों या वर्गाकार बनावट को व्यक्त करता है; स्थापत्य-सन्दर्भ में ‘चौकोर’ सहज है।
- source_word: וּפְנֵי
  choice: और ... के सामने का
  rationale: शाब्दिक अर्थ ‘मुख’ है, पर स्थापत्य-सन्दर्भ में दिखाई देने वाला सामने का भाग अभिप्रेत है।
- source_word: הַקֹּדֶשׁ
  choice: पवित्रस्थान
  rationale: मन्दिर के पवित्र कक्ष के लिए यह संक्षिप्त, गरिमापूर्ण और प्रचलित हिन्दी पद है।
- source_word: הַמַּרְאֶה כַּמַּרְאֶה
  choice: रूप भी वैसा ही था
  rationale: इब्रानी का पुनरुक्त और संक्षिप्त वाक्यांश शाब्दिक रूप से ‘रूप जैसा रूप’ है; हिन्दी में यह चयन दृश्य समानता व्यक्त करते हुए उसकी संक्षिप्तता बनाए रखता है।
