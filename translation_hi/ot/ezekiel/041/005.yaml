  naturalness: The revision uses clear modern architectural Hindi. “पार्श्व-कोठरियाँ” is more concise and idiomatic than “बगल वाली कोठरियाँ,” especially with “भवन के चारों ओर.” “छह” is the standard contemporary spelling.
  terminology: “भवन,” “दीवार,” “हाथ,” and “पार्श्व-कोठरियाँ” maintain a suitably formal, intelligible register for Ezekiel’s temple architecture. The footnote preserves the lexical range without overstating a particular reconstruction.
