- source_word: הַצֵּלָע
  choice: बगल वाली कोठरियाँ
  rationale: एकवचन रूप यहाँ भवन के चारों ओर बने पार्श्व-कक्षों को सामूहिक रूप से सूचित करता है। बहुवचन ‘कोठरियाँ’ उस सामूहिक स्थापत्य अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: אַרְבַּע אַמּוֹת
  choice: चार हाथ
  rationale: मूल माप को बिना आधुनिक इकाई में बदले सुरक्षित रखा गया है।
- source_word: סָבִיב סָבִיב לַבַּיִת סָבִיב
  choice: भवन के चारों ओर
  rationale: मूल में סָבִיב की पुनरावृत्ति पूर्ण घेराव पर बल देती है; हिन्दी का ‘चारों ओर’ इसी बल को अनावश्यक शब्दाडंबर के बिना व्यक्त करता है।
