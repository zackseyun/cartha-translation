  rationale: पुल्लिंग एकवचन प्रत्यय संदर्भित कक्ष अथवा भवन-भाग की ओर संकेत करता है; हिन्दी में ‘उसकी’ आवश्यक व्याकरणिक सामंजस्य के साथ इस संदर्भ को खुला रखता है।
- source_word: אַרְבָּעִים אַמָּה ... עֶשְׂרִים אַמָּה
  choice: चालीस हाथ ... बीस हाथ
  rationale: मूल पाठ की मापों और उसकी संक्षिप्त मापन-शैली को सीधे बनाए रखा गया है।
