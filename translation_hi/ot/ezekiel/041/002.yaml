  text: 'And the width of the entrance was ten cubits[a], and the sidewalls of the entrance were five cubits on this side and five cubits on that side. Then he measured its length: forty cubits, and the width: twenty cubits.'
translation:
  language: hi
  text: प्रवेश-द्वार की चौड़ाई दस हाथ थी। प्रवेश-द्वार के दोनों ओर के हिस्से[a] इस तरफ पाँच हाथ और उस तरफ पाँच हाथ थे। फिर उसने उसकी लंबाई नापी—चालीस हाथ, और चौड़ाई—बीस हाथ।
  philosophy: optimal-equivalence
  footnotes:
