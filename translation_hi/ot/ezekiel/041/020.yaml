  text: מֵ/הָ/אָ֨רֶץ֙ עַד מֵ/עַ֣ל הַ/פֶּ֔תַח הַ/כְּרוּבִ֥ים וְ/הַ/תִּֽמֹרִ֖ים עֲשׂוּיִ֑ם וְ/קִ֖יר הַׄ/הֵׄיׄכָֽׄלׄ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/041/020.yaml
  text: From the floor to above the entrance[a], cherubim and palm trees were made[b], and on the wall of the nave.
translation:
  language: hi
  text: फर्श[a] से लेकर प्रवेश-द्वार के ऊपर तक करूबों और खजूर के पेड़ों की आकृतियाँ बनाई गई थीं; ऐसा ही मुख्य कक्ष[b] की दीवार पर भी था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अधिक शाब्दिक अनुवाद ‘भूमि से’ या ‘धरती से’ भी हो सकता है; इस वास्तु-वर्णन में आशय फर्श के स्तर से है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी शब्द हेखाल यहाँ सम्भवतः पूरे मन्दिर-परिसर के बजाय मन्दिर के मुख्य कक्ष को सूचित करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵהָאָרֶץ
  choice: फर्श से
  rationale: אֶרֶץ का सामान्य अर्थ ‘धरती/भूमि’ है, पर इस वास्तु-वर्णन में यह कमरे के निचले स्तर, अर्थात फर्श, को सूचित करता है।
- source_word: עַד מֵעַל הַפֶּתַח
  choice: प्रवेश-द्वार के ऊपर तक
  rationale: यह सजावट के ऊर्ध्व विस्तार को बताता है; ‘प्रवेश-द्वार’ आधुनिक हिन्दी में स्वाभाविक वास्तुशिल्पीय पद है।
- source_word: הַכְּרוּבִים
  choice: करूबों
  rationale: ‘करूब’ इन पवित्रस्थान-संबंधी अलौकिक प्राणियों के लिए प्रचलित बाइबलीय पद है और उनके स्वरूप को अनुचित रूप से स्पष्ट नहीं करता।
- source_word: וְהַתִּמֹרִים
  choice: और खजूर के पेड़ों की आकृतियाँ
  rationale: תִּמֹרִים खजूर-वृक्ष के सजावटी रूपों को दर्शाता है; ‘आकृतियाँ’ वास्तु-संदर्भ को स्पष्ट करता है, बिना निर्माण-विधि को ‘नक्काशी’ तक सीमित किए।
- source_word: עֲשׂוּיִם
  choice: बनाई गई थीं
  rationale: निष्क्रिय कृदंत का व्यापक अर्थ सुरक्षित है; ‘तराशी गई थीं’ की अपेक्षा यह मूल में न बताई गई किसी विशेष तकनीक को नहीं जोड़ता।
- source_word: וְקִיר הַהֵיכָל
  choice: ऐसा ही मुख्य कक्ष की दीवार पर भी था
  rationale: खंडित क्रियारहित इब्रानी वाक्यांश को स्वाभाविक हिन्दी में जोड़ा गया है। הֵיכָל यहाँ पूरे मन्दिर-परिसर के बजाय मुख्य भवन-कक्ष को सूचित करता है।
