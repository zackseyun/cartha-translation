  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सुबोध रखी गई है। मूल इब्रानी के अंतिम क्रियारहित वाक्यांश को अर्थानुसार स्वाभाविक हिन्दी वाक्य में जोड़ा गया है; सजावट की विधि को अनावश्यक रूप से ‘नक्काशी’ नहीं कहा गया।
