  yaml_path: translation/ot/ezekiel/041/026.yaml
  text: And there were shuttered windows and palm trees on this side and on that[a], along the sidewalls of the vestibule, and on the side chambers of the temple[c][b], and the canopies.
translation:
  language: hi
  text: और बंद खिड़कियाँ[a] तथा खजूर-वृक्षों की आकृतियाँ[b] इस ओर और उस ओर, बरामदे की पार्श्व दीवारों पर, मंदिर की पार्श्व-कोठरियों पर और छज्जों[c] पर थीं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘ढकी हुई खिड़कियाँ’; इब्रानी से इतना स्पष्ट है कि खिड़कियाँ किसी प्रकार बंद या आच्छादित थीं।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से ‘खजूर-वृक्ष’; यहाँ संभवतः मंदिर पर बनी खजूर-वृक्षों की सजावटी आकृतियाँ अभिप्रेत हैं।
    reason: cultural_note
  - marker: c
    text: अंतिम इब्रानी शब्द का अर्थ अनिश्चित है; यह बाहर निकली हुई छतों, छज्जों या किसी अन्य ऊपरी वास्तु-भाग को सूचित कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: חַלּוֹנִים אֲטֻמוֹת
  choice: बंद खिड़कियाँ
  rationale: חַלּוֹנִים का सामान्य वास्तु-संदर्भित अर्थ ‘खिड़कियाँ’ है। אֲטֻמוֹת बताता है कि वे किसी प्रकार बंद या ढकी हुई थीं; ‘बंद’ स्वाभाविक है और उनकी बनावट के विषय में अनावश्यक निश्चितता नहीं लाता।
- source_word: תִמֹרִים
  choice: खजूर-वृक्षों की आकृतियाँ
  rationale: शाब्दिक अर्थ ‘खजूर-वृक्ष’ है, पर मंदिर के वास्तु-वर्णन में यह खजूर-वृक्ष के सजावटी रूपांकन को सूचित करता है। ‘आकृतियाँ’ संदर्भगत अर्थ स्पष्ट करती है।
- source_word: מִפּוֹ וּמִפּוֹ
  choice: इस ओर और उस ओर
  rationale: यह वितरणसूचक पद दोनों ओर स्थित होने का भाव रखता है और इब्रानी अभिव्यक्ति का निकट, सहज हिन्दी रूप है।
- source_word: אֶל כִּתְפוֹת הָאוּלָם
  choice: बरामदे की बगल की दीवारों पर
  rationale: כָּתֵף का मूल अर्थ ‘कंधा/बगल’ है और वास्तु-संदर्भ में पार्श्व भाग या बगल की दीवार को दर्शाता है। אוּלָם के लिए मंदिर के प्रवेश-भाग को सूचित करने वाला सहज शब्द ‘बरामदा’ चुना गया है।
- source_word: צַלְעוֹת הַבַּיִת
  choice: मंदिर की बगल की कोठरियाँ
  rationale: मंदिर-वास्तु के संदर्भ में צֵלָע पार्श्व कक्षों या संरचनाओं के लिए आता है। הַבַּיִת यहाँ सामान्य घर नहीं, मंदिर-भवन है।
- source_word: הָעֻבִּים
  choice: छज्जे
  rationale: यह दुर्लभ और अनिश्चित वास्तु-शब्द संभवतः बाहर निकले हुए छतदार या ऊपरी संरचनात्मक भागों को दर्शाता है। ‘छज्जे’ पठनीय है, जबकि पादटिप्पणी अनिश्चितता बनाए रखती है।
