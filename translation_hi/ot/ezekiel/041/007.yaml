  text: And the side chambers became wider as they went around upward and upward[a], because the structure of the temple went around upward and upward all around the temple. Therefore the width of the temple increased upward[c][b], and so one went up from the lowest story to the highest by way of the middle story.
translation:
  language: hi
  text: और चारों ओर ऊपर की ओर जाते-जाते पार्श्व-कक्ष[a] अधिक चौड़े होते गए, क्योंकि मन्दिर के चारों ओर की घेरती हुई संरचना[b] ऊपर-ऊपर बढ़ती जाती थी। इस कारण मन्दिर की चौड़ाई ऊपर की ओर बढ़ती गई; और निचली मंज़िल से बीच की मंज़िल के रास्ते ऊपरी मंज़िल पर चढ़ा जाता था।[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘पार्श्व-कमरे।’ हिब्रू शब्द मुख्य भवन से लगी हुई पार्श्व-संरचनाओं या कक्षों को सूचित कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: यह हिब्रू स्थापत्यगत वाक्यांश कठिन है। कुछ लोग इसे मन्दिर को घेरे हुए छज्जे, गलियारे या दीवार के क्रमिक कटाव के रूप में समझते हैं।
    reason: lexical_alternative
  - marker: c
    text: हिब्रू वाक्य बहुत संक्षिप्त है और उसका शाब्दिक क्रम लगभग ‘निचली से ऊपरी को, बीच वाली की ओर’ है। आशय सम्भवतः बीच की मंज़िल से होकर निचली मंज़िल से ऊपरी मंज़िल तक चढ़ना है।
    reason: textual_or_syntactic_ambiguity
