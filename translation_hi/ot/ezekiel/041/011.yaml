  text: और बगल की कोठरी का द्वार खुले स्थान[a] की ओर था—एक द्वार उत्तर की ओर था और एक द्वार दक्षिण की ओर था। उस खुले स्थान की चौड़ाई चारों ओर पाँच हाथ थी।
