base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/014/015.yaml
  text: If I cause dangerous wild animals to pass through the land[a], and they bereave it, and it becomes a desolation, without anyone passing through because of the animals[b],
translation:
  language: hi
  text: यदि मैं हानिकारक जंगली पशुओं को उस देश में से होकर गुज़रने के लिए भेजूँ[a], और वे उसे उसके निवासियों से वंचित कर दें[b], और वह ऐसा उजाड़ हो जाए कि उन पशुओं के कारण कोई भी उसमें से होकर न गुज़रे,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “बुरा/हानिकारक जंगली पशु”; यह हानिकारक जंगली पशुओं के लिए एक सामूहिक अभिव्यक्ति है।
    reason: lexical_alternative
  - marker: b
    text: या, “वे उसे निःसंतान कर दें।” हिब्रू में देश का मानवीकरण ऐसी भूमि के रूप में किया गया है जो अपने निवासियों से वंचित हो गई है।
    reason: lexical_alternative
lexical_decisions:
- source_word: לֽוּ
  choice: यदि
  rationale: यह न्याय के काल्पनिक प्रसंग की शर्त प्रस्तुत करता है; आधुनिक हिन्दी में ‘यदि’ स्वाभाविक और गरिमापूर्ण है।
- source_word: חַיָּה רָעָה
  choice: हिंसक जंगली पशु
  rationale: एकवचन सामूहिक अभिव्यक्ति हानि पहुँचाने वाले जंगली पशुओं के वर्ग को सूचित करती है। ‘हिंसक’ खतरे को स्पष्ट करता है, जबकि ‘बुरा पशु’ हिन्दी में भ्रामक नैतिक अर्थ दे सकता है।
- source_word: אַעֲבִיר
  choice: जाने दूँ
  rationale: 'हिफ़ील रूप ईश्वर की कारक भूमिका बनाए रखता है: वह पशुओं को देश में से होकर गुज़रने देता/चलाता है। हिन्दी में ‘में से होकर जाने दूँ’ स्वाभाविक रहते हुए गति की मूल छवि को सुरक्षित रखता है।'
- source_word: בָּאָרֶץ
  choice: उस देश में से होकर
  rationale: עבר के साथ यह भूभाग के भीतर से होकर गति को व्यक्त करता है; संदर्भित देश के लिए ‘उस देश’ उपयुक्त है।
- source_word: וְשִׁכְּלָתָּהּ
  choice: वे उसे उसके निवासियों से वंचित कर दें
  rationale: שׁכל का मूल भाव संतान-वियोग या किसी से वंचित कर देना है। भूमि के मानवीकरण को पूरी तरह सपाट किए बिना हिन्दी पाठक के लिए निवासियों के विनाश का आशय स्पष्ट किया गया है।
- source_word: וְהָיְתָה שְׁמָמָה
  choice: वह ऐसा उजाड़ हो जाए
  rationale: שְׁמָמָה भविष्यद्वक्ताओं के न्याय-संदर्भ में उजाड़ दशा दर्शाता है। विशेषणात्मक हिन्दी संरचना स्वाभाविक है और परिणाम को अगले वाक्यांश से जोड़ती है।
- source_word: מִבְּלִי עוֹבֵר
  choice: कोई भी उसमें से होकर न गुज़रे
  rationale: अनिश्चित कृदंत किसी भी राहगीर के न होने और आवागमन के पूर्णतः रुक जाने को व्यक्त करता है।
- source_word: מִפְּנֵי הַחַיָּה
  choice: उन पशुओं के कारण
  rationale: מִפְּנֵי यहाँ कारण बताता है और निश्चित पद पहले उल्लिखित पशुओं की ओर लौटता है।
theological_decisions:
- issue: ईश्वरीय न्याय में कर्तृत्व
  choice: ‘यदि मैं ... जाने दूँ’ के द्वारा ईश्वर की स्पष्ट कारक भूमिका बनाए रखी गई है।
  alternative: ‘यदि हिंसक जंगली पशु देश में आ जाएँ’
  rationale: हिब्रू का हिफ़ील क्रियारूप इस काल्पनिक न्याय में ईश्वर को सक्रिय कारक के रूप में प्रस्तुत करता है; वैकल्पिक निष्क्रिय रूप उस भूमिका को अस्पष्ट कर देता।
- issue: भूमि का मानवीकरण
  choice: भूमि को ‘उसके निवासियों से वंचित’ बताया गया है।
  alternative: ‘वे उसे निर्जन कर दें’ या ‘वे उसे निःसंतान कर दें’
  rationale: पहला विकल्प मूल रूपक को मिटा देता, जबकि दूसरा आधुनिक हिन्दी में भूमि के संदर्भ में अत्यधिक अस्पष्ट हो सकता है। मुख्य पाठ अर्थ स्पष्ट करता है और पादटिप्पणी मूल संतान-वियोग की छवि सुरक्षित रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी, सरल किंतु गरिमापूर्ण भविष्यद्वक्तात्मक शैली। पद आगे आने वाले मुख्य वाक्य से जुड़ी शर्त है, इसलिए अंत में अल्पविराम रखा गया है। ‘देश’ אֶרֶץ के संदर्भगत भूभाग को व्यक्त करता है; ‘पशु’ सामान्य पाठक के लिए स्वाभाविक है।
