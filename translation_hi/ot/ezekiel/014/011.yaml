  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: לְ֠מַעַן לֹֽא יִתְע֨וּ ע֤וֹד בֵּֽית יִשְׂרָאֵל֙ מֵ/אַֽחֲרַ֔/י וְ/לֹֽא יִטַּמְּא֥וּ ע֖וֹד בְּ/כָל פִּשְׁעֵי/הֶ֑ם וְ/הָ֥יוּ לִ֣/י לְ/עָ֗ם וַֽ/אֲנִי֙ אֶהְיֶ֤ה לָ/הֶם֙ לֵֽ/אלֹהִ֔ים נְאֻ֖ם אֲדֹנָ֥/י יְהוִֽה־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/014/011.yaml
  text: so that the house of Israel may no longer go astray from me[a], and may no longer defile themselves with all their transgressions, but may be my people, and I may be their God, declares the Lord GOD.
translation:
  language: hi
  text: ताकि इस्राएल के घराने के लोग फिर कभी मेरे पीछे चलने से न भटकें और अपने सभी अपराधों से अपने आप को अशुद्ध न करें, बल्कि वे मेरी प्रजा हों और मैं उनका परमेश्वर होऊँ—प्रभु याहवे की घोषणा है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְמַעַן
  choice: ताकि
  rationale: यह उद्देश्य अथवा अपेक्षित परिणाम का परिचय देता है; ‘ताकि’ आधुनिक हिन्दी में स्वाभाविक रूप से इस भाव को व्यक्त करता है।
- source_word: יִתְעוּ ... מֵאַחֲרַי
  choice: मेरे पीछे चलने से न भटके
  rationale: תעה का अर्थ ‘भटकना’ है और מֵאַחֲרַי का शाब्दिक भाव ‘मेरे पीछे से’ है। यह अनुवाद यहोवा का अनुसरण करने से विमुख होने की वाचा-संबंधी छवि को बनाए रखता है।
- source_word: יִטַּמְּאוּ
  choice: अपने आपको ... अशुद्ध न करे
  rationale: हित्पएल रूप आत्मवाचक भाव रखता है; हिन्दी में यह प्रयोग स्वयं को अशुद्ध करने का आशय स्पष्ट करता है और नैतिक तथा उपासना-संबंधी अशुद्धता दोनों के लिए खुला रहता है।
- source_word: בְּכָל פִּשְׁעֵיהֶם
  choice: अपने सभी अपराधों से
  rationale: पֶּשַׁע में अपराध और विद्रोह दोनों का भाव हो सकता है। ‘अपराधों’ स्पष्ट और गंभीर है, जबकि ‘से’ अशुद्ध होने के साधन अथवा कारण को व्यक्त करता है।
- source_word: וְהָיוּ לִי לְעָם
  choice: वे मेरी प्रजा हों
  rationale: यह वाचा का परिचित संबंध-सूत्र है। ‘मेरी प्रजा’ स्वाभाविक हिन्दी में मूल संबंधपरक अर्थ को सुरक्षित रखता है।
- source_word: וַאֲנִי אֶהְיֶה לָהֶם לֵאלֹהִים
  choice: मैं उनका परमेश्वर होऊँ
  rationale: यह भी वाचा-सूत्र का भाग है। ‘होऊँ’ आरम्भिक לְמַעַן के अधीन उद्देश्यात्मक भाव बनाए रखता है, बिना इसे केवल साधारण भविष्य में बदलने के।
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: प्रभु याहवे की घोषणा है
  rationale: נְאֻם भविष्यद्वक्ताई घोषणा-सूत्र है। אֲדֹנָי को ‘प्रभु’ और व्यक्तिगत दिव्य नाम יהוה को ‘याहवे’ रूप में रखा गया है, जिससे दोनों अलग-अलग अभिव्यक्त होते हैं।
theological_decisions:
- issue: वाचा-सूत्र का अनुवाद
  choice: मेरी प्रजा ... उनका परमेश्वर
  alternative: मेरे लिए प्रजा ... उनके लिए परमेश्वर
  rationale: मूल इब्रानी का संबंधपरक वाचा-सूत्र स्वाभाविक हिन्दी में दिया गया है; इससे कोई अतिरिक्त साम्प्रदायिक व्याख्या नहीं जोड़ी जाती।
- issue: אֲדֹנָי יְהוִה में दिव्य नाम का निरूपण
  choice: प्रभु याहवे
  alternative: प्रभु परमेश्वर
  rationale: ‘याहवे’ मूल पाठ में उपस्थित विशिष्ट दिव्य नाम को बनाए रखता है, जबकि ‘प्रभु’ אֲדֹנָי का अलग अनुवाद है।
- issue: לְמַעַן के अधीन अन्तिम वाचा-वाक्यों का भाव
  choice: हों ... होऊँ
  alternative: होंगे ... होऊँगा
  rationale: संयोजित वाक्य आरम्भिक उद्देश्य-सूचक לְמַעַן के प्रभाव में हैं। विध्यर्थक हिन्दी उस उद्देश्यात्मक तनाव को बनाए रखती है; साधारण भविष्य भी व्याकरणतः सम्भव समझा जा सकता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सुबोध रखी गई है। ‘घराना’, ‘प्रजा’, ‘अशुद्ध’ और ‘घोषणा’ भविष्यद्वक्ताई तथा वाचा-संबंधी प्रसंग की गंभीरता बनाए रखते हैं।
