id: EZK.14.17
reference: Ezekiel 14:17
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: א֛וֹ חֶ֥רֶב אָבִ֖יא עַל הָ/אָ֣רֶץ הַ/הִ֑יא וְ/אָמַרְתִּ֗י חֶ֚רֶב תַּעֲבֹ֣ר בָּ/אָ֔רֶץ וְ/הִכְרַתִּ֥י מִמֶּ֖/נָּה אָדָ֥ם וּ/בְהֵמָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/014/017.yaml
  text: Or if I bring a sword against that land and say[a], ‘Let a sword pass through the land,’ and I cut off from it man and beast,
translation:
  language: hi
  text: या यदि मैं उस देश पर तलवार लाऊँ और कहूँ, ‘तलवार उस देश में से होकर गुज़रे,’ और मैं उसमें से मनुष्य और पशु[a] दोनों को मिटा दूँ,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में ‘मनुष्य और पशु’; यह देश से मानव और पशु जीवन दोनों के मिटा दिए जाने का एक प्रचलित कथन है।
    reason: मूल इब्रानी युग्म के व्यापक अर्थ को स्पष्ट करना।
lexical_decisions:
- source_word: א֛וֹ
  choice: या यदि
  rationale: यह पद पिछले न्याय-दृश्यों की शृंखला में एक और संभावित स्थिति प्रस्तुत करता है; संदर्भ में निहित शर्त को ‘यदि’ स्वाभाविक रूप से व्यक्त करता है।
- source_word: חֶ֥רֶב אָבִ֖יא
  choice: मैं ... तलवार लाऊँ
  rationale: हिफ़ील क्रिया में परमेश्वर की सक्रिय भूमिका बनी रहती है; ‘तलवार’ यहाँ युद्ध और हिंसक न्याय का प्रतीक है।
- source_word: עַל הָאָרֶץ הַהִיא
  choice: उस देश पर
  rationale: ‘पर’ न्याय के उस देश पर आने को व्यक्त करता है और हिन्दी में सहज है।
- source_word: וְאָמַרְתִּי
  choice: और कहूँ
  rationale: शर्तसूचक वाक्य के क्रम में संभाव्य क्रिया-रूप स्वाभाविक है और परमेश्वर की घोषणा को सीधे रखता है।
- source_word: חֶרֶב תַּעֲבֹר בָּאָרֶץ
  choice: तलवार उस देश में से होकर गुज़रे
  rationale: यह दिव्य आदेश या निर्णायक घोषणा की शक्ति को बनाए रखता है तथा देश में फैलते विनाश की मूल छवि को सुरक्षित रखता है।
- source_word: וְהִכְרַתִּי
  choice: और मैं ... मिटा दूँ
  rationale: כרת यहाँ देश से जीवन का समूल हटाया जाना बताता है; ‘मिटा दूँ’ आधुनिक हिन्दी में स्पष्ट है और न्याय की तीव्रता बनाए रखता है।
- source_word: מִמֶּנָּה
  choice: उसमें से
  rationale: स्त्रीलिंग इब्रानी संज्ञा ‘देश/भूमि’ की ओर लौटता है और वहाँ से हटाए जाने का भाव व्यक्त करता है।
- source_word: אָדָם וּבְהֵמָה
  choice: मनुष्य और पशु दोनों
  rationale: यह प्रचलित इब्रानी युग्म देश से मानव और पशु जीवन—दोनों—के हटाए जाने को समेटता है; ‘मनुष्य’ यहाँ समस्त मानव निवासियों के लिए सामान्य अर्थ में है।
theological_decisions:
- issue: न्याय-सूत्र में אָדָם का सामान्य मानववाचक अर्थ
  choice: मनुष्य
  alternative: लोग / मानवजाति
  rationale: ‘मनुष्य और पशु’ मूल के पारंपरिक युग्म और उसके व्यापक, प्रतिनिधिक अर्थ को बनाए रखता है; यहाँ किसी एक पुरुष का संकेत नहीं है।
- issue: תַּעֲבֹר की विधि—आदेश या भविष्यवाणी
  choice: ‘गुज़रे’ के द्वारा दिव्य आदेश/घोषणा
  alternative: ‘गुज़रेगी’
  rationale: इब्रानी रूप को आदेशात्मक अथवा घोषणात्मक दोनों छायाओं में समझा जा सकता है। हिन्दी संभाव्य रूप ‘गुज़रे’ इस तनाव को अनावश्यक रूप से निश्चित किए बिना सीधे कथन में स्वाभाविक रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘तलवार लाऊँ’ और ‘देश में से होकर गुज़रे’ मूल की भविष्यद्वाणी-संबंधी छवि को बनाए रखते हैं; ‘मिटा दूँ’ विनाश के आशय को स्वाभाविक हिन्दी में व्यक्त करता है।
