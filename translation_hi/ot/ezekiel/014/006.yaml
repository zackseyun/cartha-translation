id: EZK.14.6
reference: Ezekiel 14:6
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: לָ/כֵ֞ן אֱמֹ֣ר אֶל בֵּ֣ית יִשְׂרָאֵ֗ל כֹּ֤ה אָמַר֙ אֲדֹנָ֣/י יְהוִ֔ה שׁ֣וּבוּ וְ/הָשִׁ֔יבוּ מֵ/עַ֖ל גִּלּֽוּלֵי/כֶ֑ם וּ/מֵ/עַ֥ל כָּל תּוֹעֲבֹתֵי/כֶ֖ם הָשִׁ֥יבוּ פְנֵי/כֶֽם׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/014/006.yaml
  text: 'Therefore say to the house of Israel[a], ‘Thus says the Lord GOD: Turn back, and turn away from your idols[b], and turn your faces away from all your abominations.’'
translation:
  language: hi
  text: 'इसलिए इस्राएल के घराने से कहो, ‘प्रभु यहोवा यों कहता है: लौट आओ और अपनी मूरतों से मुँह मोड़ लो; अपनी सब घिनौनी वस्तुओं से अपना मुँह फेर लो।’'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לָכֵן
  choice: इसलिए
  rationale: यह पिछले अभियोग से निकलने वाले निष्कर्ष और उसके आधार पर दिए गए आह्वान को स्पष्ट करता है।
- source_word: בֵּית יִשְׂרָאֵל
  choice: इस्राएल का घराना
  rationale: यह वाचा से जुड़ी सामूहिक पहचान को बनाए रखने वाला स्वाभाविक हिन्दी पद है।
- source_word: כֹּה אָמַר
  choice: यों कहता है
  rationale: यह भविष्यद्वक्ताओं की मानक संदेशवाहक उद्घोषणा का गरिमापूर्ण और प्रचलित हिन्दी रूप है।
- source_word: אֲדֹנָי יְהוִה
  choice: प्रभु यहोवा
  rationale: אֲדֹנָי को उपाधि ‘प्रभु’ और יהוה को व्यक्तिगत दिव्य नाम ‘यहोवा’ के रूप में अलग-अलग सुरक्षित रखता है।
- source_word: שׁוּבוּ
  choice: लौट आओ
  rationale: שׁוב की लौटने और पश्चात्ताप करने की संयुक्त छवि को बिना केवल तकनीकी धार्मिक शब्द में सीमित किए व्यक्त करता है।
- source_word: וְהָשִׁיבוּ מֵעַל גִּלּוּלֵיכֶם
  choice: और अपनी मूरतों से मुँह मोड़ लो
  rationale: हिफ़ील रूप के स्वयं को उनसे दूर करने के आह्वान को स्वाभाविक हिन्दी में व्यक्त करता है; ‘मूरतों’ से मूर्तिपूजा का संदर्भ स्पष्ट रहता है।
- source_word: גִּלּוּלֵיכֶם
  choice: अपनी मूरतों
  rationale: यह तिरस्कारपूर्ण इब्रानी पद का प्रसंगगत अर्थ देता है; अत्यधिक शाब्दिक और अस्वाभाविक ‘गोबर-मूर्तियाँ’ मुख्य पाठ में नहीं रखा गया।
- source_word: כָּל תּוֹעֲבֹתֵיכֶם
  choice: अपनी सब घिनौनी वस्तुओं
  rationale: תועבות के धार्मिक और नैतिक रूप से घृणित विषयों को बनाए रखता है और उन्हें केवल कर्मों तक सीमित नहीं करता।
- source_word: הָשִׁיבוּ פְנֵיכֶם
  choice: अपना मुँह फेर लो
  rationale: इब्रानी ‘अपने चेहरे फेरो’ की देहगत और संकल्पपूर्ण दिशा को स्वाभाविक हिन्दी मुहावरे में सुरक्षित रखता है।
theological_decisions:
- issue: אֲדֹנָי יְהוִה में दिव्य नाम का अनुवाद
  choice: प्रभु यहोवा
  alternative: प्रभु याहवे / प्रभु परमेश्वर
  rationale: मूल में उपाधि और चार-अक्षरी दिव्य नाम दोनों हैं। ‘प्रभु यहोवा’ हिन्दी बाइबलीय प्रयोग में परिचित है और दोनों को अलग बनाए रखता है; ‘परमेश्वर’ नाम को सामान्य उपाधि में बदल देता।
- issue: שׁוב में पश्चात्ताप और लौटने का संबंध
  choice: लौट आओ
  alternative: मन फिराओ / पश्चात्ताप करो
  rationale: यह चयन दिशा बदलने की मूल छवि और वाचा की ओर लौटने के आह्वान को सुरक्षित रखता है, जबकि अर्थ को बाद की तकनीकी शब्दावली तक सीमित नहीं करता।
- issue: תּוֹעֲבוֹת का दायरा
  choice: घिनौनी वस्तुएँ
  alternative: घिनौने काम
  rationale: इब्रानी बहुवचन उन वस्तुओं, रीति-रिवाजों या कर्मों को सूचित कर सकता है जो घृणित हैं; ‘वस्तुएँ’ इस प्रसंग में उस व्यापकता को अधिक सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘इस्राएल का घराना’ और ‘यों कहता है’ जैसी बाइबलीय अभिव्यक्तियाँ मूल की भविष्यद्वक्ताई शैली बनाए रखती हैं। समान मूल שׁוב की पुनरावृत्ति को हिन्दी में ‘लौट आओ’, ‘मुँह मोड़ लो’ और ‘मुँह फेर लो’ से अर्थानुसार व्यक्त किया गया है, ताकि आदेशों की स्वाभाविकता और मूल की दिशात्मक छवि दोनों रहें।
