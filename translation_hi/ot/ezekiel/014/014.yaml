  yaml_path: translation/ot/ezekiel/014/014.yaml
  text: even if these three men were in its midst—Noah[a], Daniel, and Job—they would deliver only themselves by their righteousness, declares the Lord GOD.
translation:
  language: hi
  text: चाहे ये तीन पुरुष—नूह, दानिय्येल[a] और अय्यूब—उसके बीच में होते, तौभी वे अपनी धार्मिकता के द्वारा केवल अपने ही प्राण बचा पाते, प्रभु याहवे की यह घोषणा है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: हिब्रू דנאל को ‘दानेल’ भी पढ़ा जा सकता है; कुछ विद्वान इसे बाइबल के दानिय्येल के बजाय प्राचीन निकट-पूर्व के दानेल नामक व्यक्ति के रूप में समझते हैं।
    reason: alternative_reading
lexical_decisions:
- source_word: וְהָיוּ
  choice: चाहे ... होते
  rationale: आसपास के न्याय-वचन में वाव + क़ातल का भाव रियायती-शर्तसूचक है; इसलिए केवल ‘और होते’ के बजाय ‘चाहे ... होते’ स्वाभाविक और प्रसंगानुकूल है।
- source_word: שְׁלֹשֶׁת הָאֲנָשִׁים הָאֵלֶּה
  choice: ये तीन पुरुष
  rationale: मूल में स्पष्ट रूप से पुरुषवाचक बहुवचन है; ‘पुरुष’ आधुनिक, गरिमापूर्ण और लिंग-सटीक है।
- source_word: בְּתוֹכָהּ
  choice: उसके बीच में
  rationale: स्त्रीलिंग एकवचन प्रत्यय प्रसंग की भूमि की ओर संकेत करता है; यह अभिव्यक्ति स्थानवाचक अर्थ को सहज हिन्दी में बनाए रखती है।
- source_word: נֹחַ
  choice: नूह
  rationale: इस बाइबलीय नाम का प्रचलित हिन्दी रूप।
- source_word: דנאל
  choice: दानिय्येल
  rationale: मुख्य पाठ में प्रचलित बाइबलीय पहचान रखी गई है; योड-रहित हिब्रू वर्तनी और ‘दानेल’ की सम्भावना पादटिप्पणी में सुरक्षित है।
- source_word: וְאִיּוֹב
  choice: और अय्यूब
  rationale: संयोजक सहित नाम का प्रचलित हिन्दी रूप।
- source_word: הֵמָּה
  choice: वे ... अपने ही
  rationale: स्वतंत्र सर्वनाम का बल ‘अपने ही’ से व्यक्त होता है और अगले पदांश की विशिष्टता स्पष्ट रहती है।
- source_word: בְצִדְקָתָם
  choice: अपनी धार्मिकता के कारण
  rationale: צְדָקָה यहाँ इन पुरुषों की व्यक्तिगत धार्मिकता/खराई को दर्शाता है; ‘के कारण’ साधन अथवा आधार का स्वाभाविक हिन्दी संकेत देता है।
- source_word: יְנַצְּלוּ
  choice: बचा पाते
  rationale: נצל का अर्थ संकट से छुड़ाना या बचाना है; सम्भावनात्मक ‘पाते’ काल्पनिक शर्त के परिणाम को व्यक्त करता है।
- source_word: נַפְשָׁם
  choice: केवल अपने ही प्राण
  rationale: נֶפֶשׁ यहाँ उनके स्वयं के जीवन/व्यक्तियों को सूचित करता है; ‘केवल’ यह स्पष्ट करता है कि वे दूसरों को नहीं बचा सकते।
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: प्रभु यहोवा की यह घोषणा है
  rationale: נְאֻם की भविष्यद्वक्ताई घोषणा और אֲדֹנָי के पदनाम को रखा गया है, जबकि יהוה को हिन्दी के परिचित नामरूप ‘यहोवा’ से दर्शाया गया है।
theological_decisions:
- issue: אֲדֹנָי יְהוִה में परमेश्वर के नाम का अनुवाद
  choice: प्रभु यहोवा
  alternative: प्रभु याहवे
  rationale: दोनों घटकों को अलग रखते हुए उपाधि ‘प्रभु’ और वाचा-नाम का परिचित हिन्दी रूप ‘यहोवा’ दिया गया है; इससे ‘प्रभु प्रभु’ जैसी पुनरुक्ति नहीं होती।
- issue: דנאל की पहचान
  choice: दानिय्येल
  alternative: दानेल
  rationale: मुख्य पाठ प्रचलित बाइबलीय नाम रखता है, पर मूल की योड-रहित वर्तनी किसी प्राचीन निकट-पूर्वी दानेल की सम्भावना उठा सकती है; इसे पादटिप्पणी में बिना निर्णायक रूप से सुलझाए रखा गया है।
- issue: धार्मिकता द्वारा बचाव की सीमा
  choice: केवल अपने ही प्राण बचा पाते
  alternative: अपने प्राण बचा पाते
  rationale: प्रसंग का बल यह है कि इन धर्मी पुरुषों की धार्मिकता दूसरों को नहीं छुड़ा सकती; ‘केवल’ इस निहित विशिष्टता को स्पष्ट करता है, बिना धार्मिकता के व्यापक धर्मवैज्ञानिक अर्थ पर अतिरिक्त दावा किए।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण भविष्यद्वक्ताई शैली रखी गई है। ‘तौभी’ रियायती शर्त और उसके परिणाम को स्पष्ट करता है; नामों के परिचित हिन्दी रूप अपनाए गए हैं।
