base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/014/021.yaml
  text: 'For thus says the Lord GOD: How much more when I send my four disastrous judgments against Jerusalem—sword and famine and wild beasts and plague—to cut off from it man and beast![a][b]'
translation:
  language: hi
  text: 'क्योंकि प्रभु यहोवा यों कहते हैं: तो क्या होगा जब मैं यरूशलेम के विरुद्ध अपने चार विनाशकारी दंड—तलवार, अकाल, जंगली पशु और महामारी—भेजूँ, ताकि उसमें से मनुष्य और पशु को मिटा दूँ![a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “विनाशकारी दंड” का अनुवाद “कठोर दंड” भी हो सकता है; यहाँ इब्रानी विशेषण का अर्थ बुरा, हानिकारक या विपत्तिपूर्ण हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: “महामारी” के स्थान पर “मरी” भी अनुवाद किया जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  choice: प्रभु यहोवा
  rationale: दोनों उपाधियों को बनाए रखते हुए अֲדֹנָי को ‘प्रभु’ और वाचा के नाम יְהוָה को ‘यहोवा’ के रूप में प्रस्तुत किया गया है।
- source_word: אַף כִּי
  choice: तब और भी कितना अधिक होगा
  rationale: पिछले पद से जुड़े न्यूनाधिक तर्क (a fortiori) की शक्ति को व्यक्त करता है; इसे साधारण शर्त के रूप में नहीं समतल किया गया।
- source_word: אַרְבַּעַת שְׁפָטַי הָרָעִים
  choice: अपने चार विनाशकारी दंड
  rationale: שְׁפָטִים यहाँ न्याय के दंडात्मक कार्य हैं और הָרָעִים नैतिक बुराई नहीं, बल्कि उनके विनाशकारी प्रभाव को बताता है।
- source_word: חֶרֶב
  choice: तलवार
  rationale: युद्ध के अमूर्त अर्थ के बजाय मूल का ठोस न्याय-सूचक बिंब रखा गया।
- source_word: רָעָב
  choice: अकाल
  rationale: सामूहिक विपत्ति के इस प्रसंग में प्रचलित और सटीक हिन्दी शब्द।
- source_word: חַיָּה רָעָה
  choice: हिंसक पशु
  rationale: हानिकारक और आक्रमणकारी वन्य पशुओं का आशय स्वाभाविक हिन्दी में व्यक्त करता है; ‘बुरे पशु’ नैतिक अर्थ दे सकता था।
- source_word: דֶבֶר
  choice: महामारी
  rationale: व्यापक घातक रोग के लिए आधुनिक और सहज हिन्दी; ‘मरी’ अधिक पारंपरिक विकल्प है।
- source_word: שִׁלַּחְתִּי
  choice: भेजूँगा
  rationale: रूप की पूर्णता के बावजूद इस भविष्यसूचक, ‘जब’ वाले कथन में हिन्दी भविष्यकाल प्रसंगगत बल को स्वाभाविक रूप से व्यक्त करता है।
- source_word: לְהַכְרִית
  choice: मिटा दूँ
  rationale: यहाँ लोगों और पशुओं को यरूशलेम से समाप्त कर देने का अर्थ स्पष्ट करता है; ‘काट डालूँ’ हिन्दी में अनावश्यक रूप से केवल शारीरिक काटने का बोध दे सकता है।
- source_word: אָדָם וּבְהֵמָה
  choice: मनुष्य और पशु दोनों
  rationale: सूत्रवत जोड़ी में सभी मनुष्यों और पालतू/अन्य पशुओं का समावेश व्यक्त होता है; ‘दोनों’ युग्म को स्वाभाविक बनाता है।
theological_decisions:
- issue: אֲדֹנָי יְהוִה में परमेश्वर के निजी नाम का अनुवाद
  choice: प्रभु यहोवा
  alternative: प्रभु परमेश्वर
  rationale: मूल में विद्यमान वाचा-नाम को सामान्य उपाधि में विलीन न करके हिन्दी की स्थापित लिप्यंतरण-परंपरा ‘यहोवा’ से सुरक्षित रखा गया।
- issue: אַף כִּי का तार्किक बल
  choice: जब ... तब और भी कितना अधिक होगा
  alternative: यदि ... तो कितना अधिक
  rationale: पिछले संदर्भ से जुड़े न्यूनाधिक तर्क को रखा गया है, जबकि घटना को केवल अनिश्चित संभावना के रूप में प्रस्तुत नहीं किया गया।
- issue: परमेश्वर के שְׁפָטַי הָרָעִים का नैतिक आशय
  choice: विनाशकारी दंड
  alternative: बुरे दंड
  rationale: विशेषण दंडों के विपत्तिपूर्ण प्रभाव को दर्शाता है, परमेश्वर के कार्य में नैतिक बुराई आरोपित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सार्वजनिक पाठ के योग्य शैली। ‘यों कहते हैं’ भविष्यद्वाणी की पारंपरिक गंभीरता रखता है, जबकि शेष वाक्य-विन्यास सामान्य आधुनिक पाठक के लिए स्पष्ट है।
