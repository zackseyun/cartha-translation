source:
  edition: WLC
  text: וְ/הַ/נָּבִ֤יא כִֽי יְפֻתֶּה֙ וְ/דִבֶּ֣ר דָּבָ֔ר אֲנִ֤י יְהוָה֙ פִּתֵּ֔יתִי אֵ֖ת הַ/נָּבִ֣יא הַ/ה֑וּא וְ/נָטִ֤יתִי אֶת יָדִ/י֙ עָלָ֔י/ו וְ/הִ֨שְׁמַדְתִּ֔י/ו מִ/תּ֖וֹךְ עַמִּ֥/י יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/014/009.yaml
  text: And if the prophet is deceived and speaks a word[a], I, Yahweh, have deceived that prophet; and I will stretch out my hand against him and destroy him from the midst of my people Israel.
translation:
  language: hi
  text: और यदि भविष्यद्वक्ता बहकाया जाए और कोई वचन बोले, तो मैं, यहोवा, ने उस भविष्यद्वक्ता को बहकाया है[a]। मैं उसके विरुद्ध अपना हाथ बढ़ाऊँगा और उसे अपनी प्रजा इस्राएल के बीच से नष्ट कर दूँगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या, “मैंने उस भविष्यद्वक्ता को फुसलाया है”; कुछ लोग इसका अधिक अनुमतिमूलक अर्थ समझते हैं: “मैंने उस भविष्यद्वक्ता को बहकने दिया है।”'
    reason: פתה के अर्थ-क्षेत्र तथा परमेश्वर की सक्रियता के संबंध में वैकल्पिक समझ को दर्ज करना, बिना मुख्य पाठ की सीधी अभिव्यक्ति या इब्रानी पूर्णकाल को बदले।
lexical_decisions:
- source_word: יְפֻתֶּה
  choice: बहकाया जाए
  rationale: पुअल रूप निष्क्रिय भाव व्यक्त करता है। ‘बहकाया जाए’ धोखे या प्रलोभन—दोनों संभावित अर्थछायाओं को कुछ हद तक खुला रखता है और न्याय के प्रसंग में स्वाभाविक है।
- source_word: וְדִבֶּר דָּבָר
  choice: और कोई वचन बोले
  rationale: ‘वचन’ मूल के דָּבָר को बनाए रखता है और भविष्यद्वाणी के प्रसंग में स्वाभाविक, गरिमापूर्ण हिन्दी है।
- source_word: אֲנִי יְהוָה
  choice: मैं, यहोवा
  rationale: स्वतंत्र सर्वनाम और दिव्य नाम से आने वाले बल को बनाए रखा गया है। יהוה को पारंपरिक हिन्दी रूप ‘यहोवा’ से प्रस्तुत किया गया है।
- source_word: פִּתֵּיתִי
  choice: उस भविष्यद्वक्ता को बहकाने वाला हूँ
  rationale: यह उसी פתה धातु का पिएल रूप है और परमेश्वर की प्रत्यक्ष सक्रियता बताता है। हिन्दी में परिणामगत वर्तमान ‘बहकाने वाला हूँ’ इस पूर्ण क्रिया को प्रसंगानुकूल ढंग से व्यक्त करता है, बिना उसे केवल अनुमति में बदलकर theological tension को मिटाए।
- source_word: וְנָטִיתִי אֶת יָדִי עָלָיו
  choice: मैं उसके विरुद्ध अपना हाथ बढ़ाऊँगा
  rationale: यह न्याय में परमेश्वर की सक्रिय कार्रवाई का चित्रात्मक मुहावरा है; हिन्दी में भी अर्थ स्पष्ट रहते हुए मूल बिंब सुरक्षित है।
- source_word: וְהִשְׁמַדְתִּיו
  choice: उसे ... नष्ट कर दूँगा
  rationale: हिफ़ील रूप का प्रबल विनाशकारी अर्थ ‘नष्ट कर दूँगा’ में स्वाभाविक और पर्याप्त रूप से व्यक्त होता है।
- source_word: מִתּוֹךְ עַמִּי יִשְׂרָאֵל
  choice: अपनी प्रजा इस्राएल के बीच से
  rationale: यह वाचा-समुदाय के भीतर से हटाए जाने की मूल धारणा को स्पष्ट और स्वाभाविक हिन्दी में बनाए रखता है।
theological_decisions:
- issue: भविष्यद्वक्ता के बहकाए जाने में परमेश्वर की सक्रियता
  choice: मुख्य पाठ में परमेश्वर को सीधे ‘उस भविष्यद्वक्ता को बहकाने वाला’ कहा गया है।
  alternative: मैंने उस भविष्यद्वक्ता को बहकने दिया है।
  rationale: इब्रानी पाठ उसी פתה धातु से क्रिया को स्पष्टतः यहोवा से जोड़ता है। इसलिए मुख्य पाठ में इसे केवल अनुमति के अर्थ में नरम नहीं किया गया; वैकल्पिक अनुमतिमूलक समझ को पादटिप्पणी में रखा गया है।
- issue: פתה की अर्थछाया
  choice: बहकाना
  alternative: फुसलाना
  rationale: धातु में धोखा देने, लुभाने या फुसलाने की अर्थछायाएँ हो सकती हैं। ‘बहकाना’ प्रसंग में स्पष्ट है, जबकि ‘फुसलाना’ वैकल्पिक अर्थ के रूप में पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सहज रूप अपनाया गया है। ‘भविष्यद्वक्ता’, ‘वचन’ और ‘यहोवा’ बाइबलीय संदर्भ में परिचित शब्द हैं। वाक्य-विन्यास को हिन्दी में स्वाभाविक बनाया गया है, जबकि मूल की न्याय-संबंधी कठोरता और theological tension सुरक्षित रखी गई है।
