base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/014/008.yaml
  text: And I will set my face against that man[a], and I will make him a sign and a proverb, and I will cut him off from the midst of my people. Then you will know that I am Yahweh.
translation:
  language: hi
  text: मैं अपना मुख उस मनुष्य के विरुद्ध कर दूँगा। मैं उसे एक चिन्ह और कहावत[a] बना दूँगा और उसे अपने लोगों के बीच से काटकर अलग कर दूँगा। तब तुम जानोगे कि मैं याहवे हूँ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उपहास की उक्ति” या “बदनामी की कहावत।” इब्रानी शब्द कहावत, ताना, या किसी के बारे में प्रचलित सार्वजनिक उक्ति को दर्शा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתִּי פָנַי בָּאִישׁ הַהוּא
  choice: मैं उस मनुष्य के विरुद्ध अपना मुख करूँगा
  rationale: यह इब्रानी मुहावरा परमेश्वर के दृढ़ विरोध और न्याय को व्यक्त करता है। ‘अपना मुख करूँगा’ मूल की सजीव देहात्मक छवि को बनाए रखता है, जबकि ‘के विरुद्ध’ בְּ के विरोधात्मक भाव को स्पष्ट करता है।
- source_word: הָאִישׁ הַהוּא
  choice: उस मनुष्य
  rationale: इब्रानी पद पुल्लिंग एकवचन है और संदर्भ में बताए गए व्यक्ति की ओर लौटता है; इसलिए लिंग और वचन को यथावत रखा गया है।
- source_word: וַהֲשִׂמֹתִיהוּ
  choice: मैं उसे ... बना दूँगा
  rationale: इस संदर्भ में क्रिया किसी को एक विशेष स्थिति या सार्वजनिक उदाहरण बना देने का भाव रखती है। हिंदी में यह प्रयोग स्वाभाविक है।
- source_word: לְאוֹת
  choice: एक चिन्ह
  rationale: אוֹת का सामान्य अर्थ ‘चिन्ह’ है। यहाँ वह दैवी न्याय के प्रत्यक्ष उदाहरण का संकेत देता है, पर अनुवाद में ‘चेतावनी’ जोड़कर अर्थ को अनावश्यक रूप से सीमित नहीं किया गया।
- source_word: וְלִמְשָׁלִים
  choice: और कहावतों का विषय
  rationale: מְשָׁלִים बहुवचन है और ऐसी सार्वजनिक उक्तियों, कहावतों या तानों की ओर संकेत कर सकता है जिनमें उस व्यक्ति का उदाहरण दिया जाए। ‘कहावतों का विषय’ हिंदी में स्वाभाविक रहते हुए बहुवचन और व्यापक अर्थ को बनाए रखता है।
- source_word: וְהִכְרַתִּיו מִתּוֹךְ עַמִּי
  choice: उसे अपने लोगों के बीच से काटकर अलग कर दूँगा
  rationale: ‘काटकर अलग करना’ כרת की कठोर न्याय-संबंधी छवि को बचाता है और מִתּוֹךְ עַמִּי के समुदाय के बीच से हटाए जाने के भाव को स्पष्ट करता है, बिना इसे केवल मृत्यु या केवल निष्कासन तक सीमित किए।
- source_word: וִידַעְתֶּם
  choice: तब तुम जानोगे
  rationale: ‘तब’ न्याय के परिणामस्वरूप होने वाली पहचान को स्वाभाविक हिंदी में स्पष्ट करता है। बहुवचन ‘तुम’ इब्रानी क्रिया के बहुवचन को दर्शाता है।
- source_word: יְהוָה
  choice: यहवे
  rationale: ईश्वर के व्यक्तिगत नाम יהוה को किसी उपाधि से बदलने के बजाय हिंदी में प्रचलित निकट लिप्यंतरण ‘यहवे’ से प्रस्तुत किया गया है।
theological_decisions:
- issue: परमेश्वर के मुख से जुड़े न्याय-सूत्र का अनुवाद
  choice: मैं उस मनुष्य के विरुद्ध अपना मुख करूँगा
  alternative: मैं उस मनुष्य की ओर विरोध में अपना मुख फेरूँगा
  rationale: चुना हुआ पाठ परमेश्वर के सक्रिय और दृढ़ विरोध को व्यक्त करते हुए मूल की देहात्मक छवि बनाए रखता है; ‘मुख फेरना’ हिंदी में कभी-कभी केवल उपेक्षा या विमुखता समझा जा सकता है।
- issue: מְשָׁלִים का न्याय-संदर्भ में अर्थ
  choice: कहावतों का विषय
  alternative: बदनामी की मिसाल / उपहास की उक्ति
  rationale: संदर्भ सार्वजनिक अपमान या चेतावनी का भाव सुझाता है, किंतु शब्द का अर्थ केवल उपहास तक सीमित नहीं है। मुख्य पाठ व्यापक अर्थ रखता है और संभावित ताने या सार्वजनिक उक्ति का भाव पादटिप्पणी में सुरक्षित है।
- issue: ‘काटकर अलग करने’ के परिणाम की सीमा
  choice: अपने लोगों के बीच से काटकर अलग कर दूँगा
  alternative: अपने लोगों के बीच से उसका नाश कर दूँगा
  rationale: मूल वाक्यांश कठोर दैवी न्याय बताता है, पर यहाँ क्रिया को केवल शारीरिक मृत्यु के रूप में स्पष्ट करना संभावित अर्थ को समय से पहले सीमित कर सकता है। चुना हुआ अनुवाद मूल मुहावरे और उसकी गंभीरता दोनों को बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। ‘अपना मुख करूँगा’ और ‘काटकर अलग कर दूँगा’ जैसे वाक्यांश मूल इब्रानी की ठोस छवियों को सुरक्षित रखते हैं। लंबे संयुक्त वाक्य को पठनीयता के लिए दो वाक्यों में बाँटा गया है। पादटिप्पणी का चिह्न उसी पदबंध के बाद रखा गया है जिससे वह वास्तव में संबंधित है।
