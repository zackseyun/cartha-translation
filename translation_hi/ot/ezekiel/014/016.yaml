id: EZK.14.16
reference: Ezekiel 14:16
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: שְׁלֹ֨שֶׁת הָ/אֲנָשִׁ֣ים הָ/אֵלֶּה֮ בְּ/תוֹכָ/הּ֒ חַי אָ֗נִי נְאֻם֙ אֲדֹנָ֣/י יְהוִ֔ה אִם בָּנִ֥ים וְ/אִם בָּנ֖וֹת יַצִּ֑ילוּ הֵ֤מָּה לְ/בַדָּ/ם֙ יִנָּצֵ֔לוּ וְ/הָ/אָ֖רֶץ תִּהְיֶ֥ה שְׁמָמָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/014/016.yaml
  text: Even if these three men were in its midst[a], as I live, declares the Lord GOD, they would deliver neither sons nor daughters; they alone would be delivered, and the land would become a desolation.
translation:
  language: hi
  text: यदि ये तीनों पुरुष उसके बीच हों भी, तो मेरे जीवन की शपथ—प्रभु यहोवा की घोषणा है—वे न तो बेटों को और न बेटियों को बचा पाएँगे।[a] केवल वे स्वयं बचेंगे, और वह देश उजाड़ हो जाएगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक रूप से: “यदि बेटे और यदि बेटियाँ वे बचाएँगे”; शपथ के इस प्रयोग में इसका अर्थ है कि वे न बेटों को बचाएँगे, न बेटियों को।'
    reason: मूल इब्रानी की शपथ-संबंधी नकारात्मक मुहावरेदार रचना स्पष्ट करना।
lexical_decisions:
- source_word: שְׁלֹשֶׁת הָאֲנָשִׁים הָאֵלֶּה
  choice: ये तीनों पुरुष
  rationale: यह पद आसपास के संदर्भ में नामित तीन पुरुषों की ओर संकेत करता है; ‘पुरुष’ मूल के लिंग और संदर्भ दोनों को स्पष्ट रखता है।
- source_word: בְּתוֹכָהּ
  choice: उसके बीच
  rationale: स्त्रीलिंग प्रत्यय का संबंध संदर्भ में आए देश/भूमि से है; यह वाक्यांश उसके भीतर उपस्थित होने का भाव देता है।
- source_word: חַי אָנִי
  choice: मेरे जीवन की शपथ
  rationale: यह परमेश्वर की गंभीर आत्म-शपथ का सूत्र है; हिन्दी में यह मूल के शपथ-संबंधी बल को स्वाभाविक रूप से व्यक्त करता है।
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: प्रभु यहोवा की घोषणा है
  rationale: נְאֻם को भविष्यद्वाणी की प्रामाणिक घोषणा के रूप में रखा गया है और יְהוִה को वाचा-संबंधी नाम ‘यहोवा’ से स्पष्ट किया गया है।
- source_word: אִם בָּנִים וְאִם בָּנוֹת יַצִּילוּ
  choice: वे न तो बेटों को और न बेटियों को बचा पाएँगे
  rationale: शपथ के प्रसंग में אִם नकारात्मक बल रखता है। ‘बचा पाएँगे’ נצל के न्याय और विपत्ति से छुड़ाने के अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: הֵמָּה לְבַדָּם יִנָּצֵלוּ
  choice: केवल वे स्वयं बचेंगे
  rationale: बलवाचक सर्वनाम और לְבַדָּם की विशिष्टता को ‘केवल’ और ‘स्वयं’ दोनों से सुरक्षित रखा गया है।
- source_word: וְהָאָרֶץ תִּהְיֶה שְׁמָמָה
  choice: और वह देश उजाड़ हो जाएगा
  rationale: यह रूप देश की परिणामी उजड़ी हुई दशा को सरल और गरिमापूर्ण आधुनिक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: अֲדֹנָי יְהוִה में परमेश्वर के नाम का अनुवाद
  choice: प्रभु यहोवा
  alternative: प्रभु परमेश्वर
  rationale: मूल में वाचा-संबंधी व्यक्तिगत नाम יְהוִה उपस्थित है; ‘यहोवा’ उसे सामान्य उपाधि में विलीन किए बिना सुरक्षित रखता है।
- issue: धर्मी पुरुषों द्वारा संतानों को बचा पाने की सीमा
  choice: वे बेटों या बेटियों को नहीं बचा पाएँगे; केवल स्वयं बचेंगे
  alternative: इसे सामान्य रूप से केवल अनिर्दिष्ट बच्चों के विषय में समझना
  rationale: पद संतानों का स्पष्ट उल्लेख करता है, पर यह नहीं बताता कि वे अनिवार्यतः उन्हीं पुरुषों की अपनी संतान हैं। अनुवाद इस कठोर व्यक्तिगत उत्तरदायित्व को बनाए रखता है और संबंध के बारे में मूल से अधिक नहीं कहता।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘हों भी’ से पिछले प्रसंग की काल्पनिक स्थिति का बल आता है; ‘मेरे जीवन की शपथ’ भविष्यद्वाणी की गंभीरता बनाए रखता है।
