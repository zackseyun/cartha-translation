lexical_decisions:
- source_word: וַיָּב֤וֹא
  choice: तब … आए
  rationale: कथात्मक וַ को ‘तब’ से व्यक्त किया गया है। क्रिया रूप एकवचन है, पर वह अपने बाद आने वाले बहुवचन कर्ता אֲנָשִׁים के साथ प्रयुक्त सामान्य इब्रानी रचना है; इसलिए हिन्दी में बहुवचन ‘आए’ स्वाभाविक है।
- source_word: אֵלַי
  choice: मेरे पास
  rationale: दिशासूचक אֶל और प्रथम पुरुष एकवचन प्रत्यय का प्रसंगानुकूल, स्वाभाविक हिन्दी रूप।
- source_word: אֲנָשִׁים
  choice: कुछ पुरुष
  rationale: אֲנָשִׁים स्पष्ट रूप से पुरुषों को सूचित करता है। ‘कुछ’ अगली מן-रचना के चयनात्मक भाव को हिन्दी में स्वाभाविक ढंग से प्रकट करता है।
- source_word: מִזִּקְנֵי יִשְׂרָאֵל
  choice: इस्राएल के पुरनियों में से
  rationale: מן यहाँ बड़े समूह में से आए या चुने गए व्यक्तियों का भाव देता है। ‘पुरनिये’ सामान्य हिन्दी बाइबलीय पद है और यहाँ पदाधिकारी बुज़ुर्गों को दर्शाता है।
- source_word: וַיֵּשְׁבוּ
  choice: बैठ गए
  rationale: ישׁב का मूल प्रसंगगत अर्थ शारीरिक रूप से बैठना है; कथात्मक हिन्दी में ‘बैठ गए’ पूर्ण क्रिया को सहजता से व्यक्त करता है।
- source_word: לְפָנָי
  choice: मेरे सामने
  rationale: यह प्रत्यक्ष स्थान और उपस्थिति—दोनों भावों को स्वाभाविक हिन्दी में बनाए रखता है।
