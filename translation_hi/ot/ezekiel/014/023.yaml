reference: Ezekiel 14:23
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/נִחֲמ֣וּ אֶתְ/כֶ֔ם כִּֽי תִרְא֥וּ אֶת דַּרְכָּ֖/ם וְ/אֶת עֲלִֽילוֹתָ֑/ם וִֽ/ידַעְתֶּ֗ם כִּי֩ לֹ֨א חִנָּ֤ם עָשִׂ֨יתִי֙ אֵ֣ת כָּל אֲשֶׁר עָשִׂ֣יתִי בָ֔/הּ נְאֻ֖ם אֲדֹנָ֥/י יְהֹוִֽה־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/014/023.yaml
  text: And they will comfort you when you see their ways and their deeds[a], and you will know that I have not done without cause all that I did in it[c][b], declares the Lord GOD.
translation:
  language: hi
  text: और जब तुम उनके चालचलन और उनके कामों को देखोगे, तब वे तुम्हें सांत्वना देंगे[a]। तब तुम जान लोगे कि मैंने उसमें[b] जो कुछ किया, वह अकारण नहीं किया[c]—प्रभु यहोवा की घोषणा है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उनके द्वारा तुम्हें सांत्वना मिलेगी” अथवा “वे तुम्हें ढाढ़स बँधाएँगे।” इब्रानी रूप इस अर्थ की अनुमति देता है कि बचे हुए लोग अपना आचरण दिखाई देने पर तुम्हारी सांत्वना का माध्यम बनेंगे।
    reason: lexical_alternative
  - marker: b
    text: अर्थात् यरूशलेम में।
    reason: referent_clarification
  - marker: c
    text: या, “मैंने उसमें जो कुछ किया, वह बिना कारण नहीं किया।”
    reason: alternative_reading
lexical_decisions:
- source_word: וְנִחֲמוּ אֶתְכֶם
  choice: वे तुम्हें सांत्वना देंगे
  rationale: निफ़अल रूप को यहाँ बचे हुए लोगों के कर्ता और निर्वासित श्रोताओं के कर्म होने के रूप में लिया गया है। उनका दिखाई देने वाला आचरण यरूशलेम के दण्ड का कारण स्पष्ट करके श्रोताओं को सांत्वना देगा।
- source_word: כִּי תִרְאוּ
  choice: जब तुम ... देखोगे
  rationale: כִּי यहाँ उस अवसर या परिस्थिति को सूचित करता है जिसमें यह सांत्वना मिलेगी; आधुनिक हिन्दी में ‘जब’ प्रसंग का प्रवाह स्वाभाविक रखता है।
- source_word: דַּרְכָּם וְאֶת עֲלִילוֹתָם
  choice: उनके चालचलन और उनके कामों
  rationale: ‘चालचलन’ דֶּרֶךְ के नैतिक जीवन-व्यवहार के अर्थ को व्यक्त करता है, जबकि ‘काम’ עֲלִילוֹת के ठोस कर्मों को; इस प्रकार दोनों पदों का भेद बना रहता है।
- source_word: וִידַעְתֶּם
  choice: तब तुम जान लोगे
  rationale: क्रियाओं के परिणामसूचक सम्बन्ध को हिन्दी में स्पष्ट और स्वाभाविक बनाने के लिए ‘तब’ रखा गया है।
- source_word: לֹא חִנָּם
  choice: अकारण नहीं
  rationale: חִנָּם का आशय यहाँ ‘बिना कारण’ या ‘व्यर्थ ही’ है। ‘अकारण नहीं’ संक्षिप्त रूप से बताता है कि परमेश्वर का दण्ड मनमाना नहीं था।
- source_word: עָשִׂיתִי אֵת כָּל אֲשֶׁר עָשִׂיתִי
  choice: मैंने ... जो कुछ किया, वह ... नहीं किया
  rationale: עשה की पुनरावृत्ति को हिन्दी में भी बनाए रखा गया है, क्योंकि वह परमेश्वर के समस्त किए हुए कार्य पर बल देती है।
- source_word: בָהּ
  choice: उसमें
  rationale: स्त्रीलिंग एकवचन सर्वनाम का संकेत नगर यरूशलेम की ओर है। ‘उसमें’ בְּ का औपचारिक रूप से निकट अनुवाद है; ‘उसके विरुद्ध’ अधिक व्याख्यात्मक होता।
- source_word: נְאֻם אֲדֹנָי יְהוָה
  choice: प्रभु यहोवा की घोषणा है
  rationale: נְאֻם के प्रचलित भविष्यद्वक्ताई सूत्र को ‘घोषणा है’ और אֲדֹנָי יְהוָה को दोनों पदों का भेद रखते हुए ‘प्रभु यहोवा’ अनूदित किया गया है।
theological_decisions:
- issue: बचे हुए लोगों से मिलने वाली सांत्वना का आशय
  choice: उनका प्रत्यक्ष आचरण परमेश्वर के दण्ड का औचित्य दिखाकर निर्वासित श्रोताओं को सांत्वना देगा।
  alternative: श्रोता उनके कारण सांत्वना पाएँगे; अथवा वे स्वयं अपने को सांत्वना देंगे।
  rationale: वाक्य का अगला भाग देखने से जानने की ओर बढ़ता है कि परमेश्वर ने अकारण कार्य नहीं किया। इसलिए सांत्वना केवल उनके जीवित बचने में नहीं, बल्कि उनके आचरण द्वारा न्याय का कारण स्पष्ट होने में है; फिर भी व्याकरणगत विकल्प पादटिप्पणी में सुरक्षित है।
- issue: אֲדֹנָי יְהוָה में परमेश्वर के नाम का अनुवाद
  choice: प्रभु यहोवा
  alternative: प्रभु याहवे; प्रभु परमेश्वर
  rationale: ‘प्रभु’ אֲדֹנָי को और ‘यहोवा’ יהוה के व्यक्तिगत वाचा-नाम को अलग-अलग व्यक्त करता है तथा हिन्दी बाइबलीय प्रयोग में पहचाना जाता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘चालचलन और काम’ मूल के दो नैतिक पदों का भेद बनाए रखते हैं। न्याय से उत्पन्न ‘सांत्वना’ की कठिन धर्मवैचारिक धार को नरम या भावुक नहीं बनाया गया है।
