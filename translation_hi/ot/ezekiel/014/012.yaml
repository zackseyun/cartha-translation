lexical_decisions:
- source_word: וַיְהִי
  choice: और ... आया
  rationale: यहाँ वाव-क्रमिक के साथ היה भविष्यद्वाणी के अगले प्रसंग का सामान्य कथात्मक आरम्भ है। हिन्दी में अगले कर्ता के साथ ‘और ... आया’ स्वाभाविक है और ‘ऐसा हुआ’ की अनावश्यक शब्दशः कठोरता से बचता है।
- source_word: דְבַר
  choice: वचन
  rationale: भविष्यद्वाणी के इस सूत्र में דָּבָר परमेश्वर के कहे हुए वचन या संदेश को दर्शाता है। ‘वचन’ स्थापित, गरिमापूर्ण और स्रोत के निकट हिन्दी अभिव्यक्ति है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: मूल पाठ में परमेश्वर का व्यक्तिगत नाम יהוה है। हिन्दी में प्रचलित नामरूप ‘यहोवा’ शीर्षक से प्रतिस्थापित किए बिना उस नाम को प्रत्यक्ष रूप से प्रस्तुत करता है।
- source_word: אֵלַי
  choice: मेरे पास
  rationale: पूर्वसर्ग אֶל और प्रथम पुरुष एकवचन प्रत्यय दिशा को व्यक्त करते हैं। वचन आने के हिन्दी मुहावरे में ‘मेरे पास’ स्वाभाविक और अर्थतः सटीक है।
- source_word: לֵאמֹר
  choice: ':'
  rationale: यह रूप आगे आने वाली प्रत्यक्ष ईश्वरीय वाणी का परिचय देता है। हिन्दी में इस अधूरे परिचयात्मक पद के अंत में विसर्ग-चिह्न आगामी कथन को स्वाभाविक ढंग से खोलता है; ‘यह कहते हुए’ यहाँ भारी और कम स्वाभाविक होता।
theological_decisions:
- issue: दिव्य नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: पद में उपाधि नहीं, चतुरक्षरीय व्यक्तिगत नाम प्रत्यक्ष रूप से है। आधुनिक हिन्दी बाइबलीय प्रयोग में पहचानने योग्य ‘यहोवा’ नाम को नाम के रूप में बनाए रखता है; ‘याहवे’ अधिक शैक्षिक लिप्यंतरण है, पर सामान्य पाठकों के लिए कम परिचित हो सकता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का संक्षिप्त, गरिमापूर्ण भविष्यद्वाणी-सूत्र। ‘वचन मेरे पास आया’ स्वाभाविक बाइबलीय हिन्दी है। आगे की प्रत्यक्ष वाणी का संकेत देने के लिए अंत में विसर्ग-चिह्न रखा गया है।
