base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/014/003.yaml
  text: Son of man[a], these men have set up their idols in their hearts and have placed the stumbling block of their iniquity before their faces[b]. Should I indeed let myself be consulted by them?
translation:
  language: hi
  text: “हे मनुष्य-पुत्र, इन पुरुषों ने अपनी घिनौनी मूर्तियों[a] को अपने हृदय में बसा लिया है और अपने अधर्म के ठोकर के कारण को अपने सामने रख लिया है। क्या मैं सचमुच उन्हें मुझसे परामर्श लेने दूँ?”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ ‘मूर्तियों’ के लिए प्रयुक्त हिब्रू शब्द גִלּוּלִים अत्यन्त तिरस्कारपूर्ण है।
    reason: lexical_alternative
  - marker: b
    text: या, “क्या सचमुच मुझसे उनके द्वारा परामर्श लिया जाए?” हिब्रू में प्रश्न पर विशेष बल है और उसका अपेक्षित उत्तर नकारात्मक है।
    reason: alternative_reading
lexical_decisions:
- source_word: בֶּן אָדָם
  choice: हे मनुष्य के पुत्र
  rationale: यहेजकेल में नबी के लिए प्रयुक्त स्थायी संबोधन को पहचानने योग्य और गरिमापूर्ण रूप में रखा गया है।
- source_word: הָאֲנָשִׁים הָאֵלֶּה
  choice: इन पुरुषों
  rationale: संदर्भ में पुरुष पुरनियों की बात है, इसलिए स्रोत का पुल्लिंग अर्थ बनाए रखा गया है।
- source_word: הֶעֱלוּ גִלּוּלֵיהֶם עַל לִבָּם
  choice: अपनी घिनौनी मूर्तियों को अपने हृदय में बसा लिया है
  rationale: क्रिया का भाव आंतरिक रूप से स्थापित करने का है; ‘घिनौनी’ से גִלּוּלִים का तिरस्कारपूर्ण स्वर सामने आता है।
- source_word: מִכְשׁוֹל עֲוֺנָם
  choice: अपने अधर्म की ठोकर खिलानेवाली बाधा
  rationale: מִכְשׁוֹל के पतन या ठोकर का कारण होने और עָוֹן के नैतिक भार, दोनों को सहज हिन्दी में सुरक्षित रखा गया है।
- source_word: נָתְנוּ נֹכַח פְּנֵיהֶם
  choice: अपने सामने रख लिया है
  rationale: हिब्रू के दृश्यात्मक भाव को स्वाभाविक हिन्दी में व्यक्त करता है; इसका अर्थ है कि उन्होंने उसे जानबूझकर अपने सम्मुख रखा।
- source_word: הַאִדָּרֹשׁ אִדָּרֵשׁ לָהֶם
  choice: क्या मैं सचमुच उन्हें मुझसे पूछने दूँ?
  rationale: निफ़ाल रूप और infinitive absolute की तीव्रता को ‘सचमुच’ तथा अनुमति-सूचक रचना से व्यक्त किया गया है; प्रश्न अपेक्षित नकारात्मक उत्तर को स्पष्ट कथन में नहीं बदलता।
theological_decisions:
- issue: मूर्तिपूजकों द्वारा परमेश्वर से मार्गदर्शन माँगने पर उसकी प्रतिक्रिया
  choice: 'प्रश्न को तीव्र आलंकारिक अस्वीकार के रूप में रखा गया: ‘क्या मैं सचमुच उन्हें मुझसे पूछने दूँ?’'
  alternative: क्या मैं सचमुच उनके द्वारा अपने से पूछा जाने दूँ?
  rationale: हिब्रू रचना नकारात्मक उत्तर का संकेत देती है, पर स्वयं स्पष्ट ‘नहीं’ नहीं कहती; इसलिए तनाव और प्रश्नात्मक रूप दोनों सुरक्षित रखे गए हैं।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की, गरिमापूर्ण और सामान्य पाठकों के लिए बोधगम्य रखी गई है। ‘हृदय में बसा लिया’ आंतरिक निष्ठा को स्वाभाविक ढंग से व्यक्त करता है, जबकि ‘अपने सामने’ मूल की दृश्यात्मकता को बनाए रखता है।
