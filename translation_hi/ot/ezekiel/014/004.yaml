base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/014/004.yaml
  text: 'Therefore speak to them and say to them[a], ‘Thus says the Lord GOD: Any man of the house of Israel who brings up his idols into his heart, and sets the stumbling block of his iniquity before his face, and then comes to the prophet—I, Yahweh[c][b], will answer him according to the multitude of his idols.’'
translation:
  language: hi
  text: 'इसलिए उनसे बात कर और उनसे कह, ‘प्रभु याहवे यों कहता है: इस्राएल के घराने का जो कोई अपनी घिनौनी मूर्तियों को अपने मन में बसा लेता है, और अपने अधर्म की ठोकर को अपने सामने रखता है, और फिर नबी के पास आता है—मैं, याहवे, उसकी घिनौनी मूर्तियों की बहुतायत के अनुसार उसे उत्तर दूँगा[a]।’'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अंतिम इब्रानी उपवाक्य कठिन है। ‘उसकी घिनौनी मूर्तियों की बहुतायत के अनुसार’ से पहले एक स्त्रीलिंग सर्वनाम है, जिसका संबंध अनिश्चित है। इसलिए इसका अर्थ ‘मैं उसी के द्वारा उसे उत्तर दूँगा’ या ‘मैं उसकी घिनौनी मूर्तियों की बहुतायत के कारण उसे उत्तर दूँगा’ भी लिया गया है।
    reason: alternative_reading
