theological_decisions:
- issue: יהוה परमेश्वर के निजी नाम का अनुवाद
  choice: यहोवा
  alternative: याहवे / प्रभु
  rationale: मूल में निजी नाम दो बार आया है। हिन्दी बाइबल परंपरा में व्यापक और पहचाना हुआ रूप ‘यहोवा’ नाम को शीर्षक ‘प्रभु’ से अलग रखता है।
- issue: גִּלּוּלִים का तिरस्कारपूर्ण अर्थ
  choice: घिनौने देवता
  alternative: मूर्तियाँ / घिनौनी मूर्तियाँ
  rationale: यह शब्द केवल निष्पक्ष ‘मूर्ति’ नहीं, बल्कि तिरस्कारसूचक है। ‘घिनौने देवता’ उस भाव को स्पष्ट करता है, यद्यपि वस्तुगत मूर्तियों का बोध भी प्रसंग से बना रहता है।
- issue: परमेश्वर के उत्तर वाली कठिन उपवाक्य-रचना
  choice: उसके घिनौने देवताओं की बहुतायत के अनुसार उसे उत्तर दूँगा
  alternative: उसी के द्वारा ... उत्तर दूँगा / उसके बहुत-से घिनौने देवताओं के कारण उत्तर दूँगा
  rationale: בָהּ का संकेत और उसका वाक्यगत संबंध अनिश्चित है। मुख्य पाठ न्यायिक अनुरूपता का संभावित अर्थ देता है, जबकि पादटिप्पणी वैकल्पिक संरचनाओं को खुला रखती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। भविष्यद्वाणी-सूत्र और ‘इस्राएल का घराना’ जैसी बाइबिलीय अभिव्यक्तियाँ सुरक्षित हैं। मुख्य पाठ का एकमात्र पादटिप्पणी-चिह्न [a] कठिन इब्रानी अंतिम उपवाक्य पर लगाया गया है।
