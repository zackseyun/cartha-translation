  rationale: मानक भविष्यद्वाणी-सूत्र को रखते हुए אֲדֹנָי को ‘प्रभु’ और परमेश्वर के नाम יהוה को ‘यहोवा’ से व्यक्त करता है।
- source_word: אִישׁ אִישׁ מִבֵּית יִשְׂרָאֵל
  choice: इस्राएल के घराने का जो कोई
  rationale: दोहराया हुआ אִישׁ वितरणार्थक है; ‘जो कोई’ प्रत्येक व्यक्ति पर लागू होने वाला भाव स्वाभाविक हिन्दी में देता है।
- source_word: יַעֲלֶה אֶת גִּלּוּלָיו אֶל לִבּוֹ
  choice: अपने घिनौने देवताओं को अपने मन में बसा लेता है
  rationale: עלה की ऊपर चढ़ाने वाली सजीव छवि को हिन्दी में अक्षरशः रखना अस्वाभाविक है; ‘मन में बसा लेना’ भीतर प्रतिष्ठित करने का आशय देता है। ‘घिनौने देवता’ גִּלּוּלִים के तिरस्कारपूर्ण रंग को भी व्यक्त करता है।
- source_word: וּמִכְשׁוֹל עֲוֺנוֹ יָשִׂים נֹכַח פָּנָיו
  choice: अपने अधर्म की ठोकर को अपने सामने रखता है
  rationale: מִכְשׁוֹל की ठोकर/बाधा की उपमा और עָוֹן का नैतिक भार दोनों सुरक्षित रखे गए हैं।
- source_word: וּבָא אֶל הַנָּבִיא
  choice: और फिर नबी के पास आता है
  rationale: '‘फिर’ क्रियाओं का क्रम स्पष्ट करता है: मन में मूर्तिपूजा बसाने के बाद नबी से पूछने आना।'
- source_word: נַעֲנֵיתִי לוֹ בָהּ בְּרֹב גִּלּוּלָיו
  choice: उसके घिनौने देवताओं की बहुतायत के अनुसार उसे उत्तर दूँगा
