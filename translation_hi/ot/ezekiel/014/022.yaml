source:
  edition: WLC
  text: וְ/הִנֵּ֨ה נֽוֹתְרָה בָּ֜/הּ פְּלֵטָ֗ה הַֽ/מּוּצָאִים֮ בָּנִ֣ים וּ/בָנוֹת֒ הִנָּ/ם֙ יוֹצְאִ֣ים אֲלֵי/כֶ֔ם וּ/רְאִיתֶ֥ם אֶת דַּרְכָּ֖/ם וְ/אֶת עֲלִֽילוֹתָ֑/ם וְ/נִחַמְתֶּ֗ם עַל הָֽ/רָעָה֙ אֲשֶׁ֤ר הֵבֵ֨אתִי֙ עַל יְר֣וּשָׁלִַ֔ם אֵ֛ת כָּל אֲשֶׁ֥ר הֵבֵ֖אתִי עָלֶֽי/הָ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/014/022.yaml
  text: Yet behold[a], a remnant will be left in it—those brought out, sons and daughters. Behold, they are coming out to you, and you will see their way and their deeds; and you will be comforted concerning the disaster that I brought upon Jerusalem[c][b], all that I brought upon it.
translation:
  language: hi
  text: फिर भी देखो, उसमें बचे हुए लोगों का एक समूह रहेगा—वे जो बाहर निकाले गए हैं, बेटे और बेटियाँ। देखो, वे तुम्हारे पास निकलकर आ रहे हैं। तुम उनके चालचलन और उनके कामों को देखोगे, और उस विपत्ति[a] के विषय में सांत्वना पाओगे जो मैं यरूशलेम पर लाया—अर्थात् वह सब जो मैं उस पर लाया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ “विपत्ति” का अर्थ यरूशलेम पर लाई गई आपदा या दंड है, नैतिक बुराई नहीं।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  choice: फिर भी देखो
  rationale: पूर्ववर्ती न्याय-वर्णन के बाद संयोजक का प्रसंगगत विरोधात्मक बल और הִנֵּה का ध्यान आकर्षित करने वाला जोर, दोनों बनाए रखता है।
- source_word: נוֹתְרָה בָּהּ פְּלֵטָה
  choice: उसमें कुछ बचे हुए लोग रहेंगे
  rationale: פְּלֵטָה के बचे हुए अथवा बच निकले समूह के अर्थ को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है; נותר की शेष रहने की परिणामी छाया भी सुरक्षित है।
- source_word: הַמּוּצָאִים
  choice: वे जिन्हें बाहर लाया जाएगा
  rationale: יצא के होफ़ाल कृदन्त का कारक-कर्मवाच्य अर्थ व्यक्त करता है; यह आगे आने वाले सक्रिय יוֹצְאִים से भेद भी बनाए रखता है।
- source_word: בָּנִים וּבָנוֹת
  choice: बेटे और बेटियाँ
  rationale: इब्रानी पाठ द्वारा दोनों को स्पष्ट रूप से नामित करने को सामान्यीकृत 'बच्चे' में नहीं बदलता।
- source_word: הִנָּם יוֹצְאִים אֲלֵיכֶם
  choice: देखो, वे तुम्हारे पास निकलकर आ रहे हैं
  rationale: יוֹצְאִים की बाहर निकलने की गति और אֲלֵיכֶם की श्रोताओं की ओर दिशा, दोनों को व्यक्त करता है।
- source_word: דַּרְכָּם
  choice: उनकी चाल
  rationale: नैतिक जीवन-रीति के रूपक को बनाए रखता है और साथ आने वाले 'कामों' से स्वाभाविक जोड़ी बनाता है।
- source_word: עֲלִילוֹתָם
  choice: उनके काम
  rationale: व्यवहार और कृत्यों को सरल, गरिमापूर्ण और नैतिक रंग वाली हिन्दी में व्यक्त करता है।
- source_word: וְנִחַמְתֶּם
  choice: सांत्वना पाओगे
  rationale: निफ़ाल रूप का यहाँ सांत्वना अथवा आश्वासन पाने वाला अर्थ संदर्भानुकूल है, जबकि 'पछताओगे' इस प्रसंग में कम उपयुक्त है।
- source_word: עַל הָרָעָה
  choice: उस विपत्ति के विषय में
  rationale: यहाँ רָעָה नैतिक बुराई नहीं, यरूशलेम पर लाई गई न्याय-संबंधी विपत्ति है; 'के विषय में' עַל के संबंधसूचक प्रयोग को व्यक्त करता है।
- source_word: אֵת כָּל אֲשֶׁר הֵבֵאתִי עָלֶיהָ
  choice: वह सब जो मैं उस पर लाया
  rationale: इब्रानी के पुनरुक्त, समग्रता पर बल देने वाले उपवाक्य को बनाए रखता है।
theological_decisions:
- issue: ईश्वरीय न्याय के संदर्भ में הָרָעָה का अनुवाद
  choice: विपत्ति
  alternative: बुराई / अनिष्ट / संकट
  rationale: पद उस दंडात्मक आपदा की बात करता है जिसे परमेश्वर यरूशलेम पर लाया; 'विपत्ति' ईश्वरीय कर्तृत्व को बनाए रखती है, पर नैतिक बुराई करने का अनपेक्षित अर्थ नहीं देती।
- issue: वְנִחַמְתֶּם में सांत्वना का आशय
  choice: सांत्वना पाओगे
  alternative: पछताओगे / अपना मन बदलोगे
  rationale: बचे हुए लोगों की चाल और काम देखकर श्रोता यरूशलेम पर आए न्याय के विषय में आश्वस्त या सांत्वना पाएँगे। पाठ इस पद में उस निष्कर्ष को विस्तार से नहीं समझाता, इसलिए अनुवाद केवल सांत्वना पाने का कथन रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी, देवनागरी; शैली सरल किंतु भविष्यद्वाणी-साहित्य के अनुरूप गरिमापूर्ण है। 'चाल और काम' मूल के रूपक और ठोस कृत्यों के युग्म को बनाए रखता है। स्पष्ट 'बेटे और बेटियाँ' को सामान्य 'बच्चे' में नहीं बदला गया।
