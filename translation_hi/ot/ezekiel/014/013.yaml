base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/014/013.yaml
  text: Son of man[a], if a land sins against me by acting unfaithfully, and I stretch out my hand against it and break its supply of bread, and send famine upon it, and cut off from it man and beast[b],
translation:
  language: hi
  text: “हे मनुष्य के पुत्र, यदि कोई देश मेरे विरुद्ध पाप करके घोर विश्वासघात करे, और मैं उसके विरुद्ध अपना हाथ बढ़ाऊँ, उसकी रोटी का सहारा तोड़ दूँ[a], उस पर अकाल भेजूँ और उसमें से मनुष्य और पशु दोनों को मिटा दूँ[b],”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “उसकी रोटी की लाठी तोड़ दूँ।” यह भोजन के सहारे या आपूर्ति को समाप्त करने का इब्रानी मुहावरा है।
    reason: lexical_alternative
  - marker: b
    text: या, “लोगों और पशुओं को।” “मनुष्य और पशु” मानव और पशु निवासियों को साथ समेटने वाली एक प्रचलित अभिव्यक्ति है।
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן אָדָם
  choice: हे मनुष्य के पुत्र
  rationale: यहेजकेल में यह परमेश्वर द्वारा नबी को संबोधित करने का नियमित सूत्र है; हिन्दी बाइबल की परिचित और गरिमापूर्ण अभिव्यक्ति मूल रूपक को बनाए रखती है।
- source_word: אֶרֶץ
  choice: कोई देश
  rationale: यहाँ संज्ञा अनिश्चित और शर्तसूचक कथन में सामान्य अर्थ रखती है; ‘कोई देश’ इस भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: תֶחֱטָא לִי
  choice: मेरे विरुद्ध पाप करे
  rationale: לִי पाप की दिशा परमेश्वर की ओर दिखाता है; ‘मेरे विरुद्ध’ इसे स्पष्ट और सहज रूप से व्यक्त करता है।
- source_word: לִמְעָל מַעַל
  choice: घोर विश्वासघात करे
  rationale: सजातीय क्रिया-निर्माण अपराध की तीव्रता पर बल देता है और מַעַל में निहित निष्ठाभंग को व्यक्त करता है; ‘घोर’ उस बल को दर्शाता है।
- source_word: וְנָטִיתִי יָדִי עָלֶיהָ
  choice: मैं उसके विरुद्ध अपना हाथ बढ़ाऊँ
  rationale: न्याय के इस इब्रानी रूपक को हिन्दी में लगभग उसी चित्रात्मकता और स्वाभाविकता के साथ रखा गया है।
- source_word: וְשָׁבַרְתִּי לָהּ מַטֵּה לָחֶם
  choice: उसके लिए रोटी का सहारा तोड़ दूँ
  rationale: ‘रोटी का सहारा’ मूल ‘रोटी की लाठी’ के चित्र को समझने योग्य हिन्दी में बचाता है और खाद्य-आपूर्ति के समाप्त होने का संकेत देता है।
- source_word: וְהִשְׁלַחְתִּי בָהּ רָעָב
  choice: उसमें अकाल भेजूँ
  rationale: בָהּ का स्थानगत भाव और רָעָב का अकाल-संबंधी अर्थ सीधे बनाए रखे गए हैं।
- source_word: וְהִכְרַתִּי מִמֶּנָּה אָדָם וּבְהֵמָה
  choice: उसमें से मनुष्य और पशु दोनों को मिटा दूँ
  rationale: כרת यहाँ न्याय के द्वारा निर्णायक रूप से हटा देने का भाव रखता है; ‘मिटा दूँ’ हिन्दी में परिणाम स्पष्ट करता है, जबकि ‘मनुष्य और पशु’ मूल युग्म को सुरक्षित रखता है।
theological_decisions:
- issue: מַעַל द्वारा बताए गए अपराध का स्वरूप
  choice: परमेश्वर के विरुद्ध गंभीर विश्वासघात
  alternative: सामान्य पाप अथवा संकीर्ण कानूनी अपराध
  rationale: ‘मेरे विरुद्ध पाप’ के साथ सजातीय निर्माण निष्ठाभंग को तीव्र करता है। अनुवाद गंभीरता और विश्वासघात को व्यक्त करता है, पर किसी विशिष्ट प्रकार की मूर्तिपूजा या वाचा-भंग को अनावश्यक रूप से निश्चित नहीं करता।
- issue: אָדָם וּבְהֵמָה का विस्तार
  choice: मनुष्य और पशु दोनों
  alternative: लोग और जानवर
  rationale: यह न्याय-वर्णन का पारंपरिक समावेशी युग्म है, जो देश के मानव और पशु निवासियों को सम्मिलित करता है; मूल शैली को मुख्य पाठ में रखा गया है और व्यापक अर्थ पादटिप्पणी में बताया गया है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट हिन्दी। भविष्यसूचक संबोधन तथा न्याय के मूल रूपकों को यथासंभव बनाए रखते हुए कठिन मुहावरे को पादटिप्पणी से स्पष्ट किया गया है। यह पद अगले वाक्य में जारी रहता है, इसलिए अंत में अल्पविराम रखा गया है।
