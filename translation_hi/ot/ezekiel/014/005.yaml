source:
  edition: WLC
  text: לְמַ֛עַן תְּפֹ֥שׂ אֶת בֵּֽית יִשְׂרָאֵ֖ל בְּ/לִבָּ֑/ם אֲשֶׁ֤ר נָזֹ֨רוּ֙ מֵֽ/עָלַ֔/י בְּ/גִלּֽוּלֵי/הֶ֖ם כֻּלָּֽ/ם־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/014/005.yaml
  text: so that I may seize the house of Israel by their heart[b][a], because all of them have turned away from me through their idols.
translation:
  language: hi
  text: ताकि मैं इस्राएल के घराने को उनके हृदय में[a] पकड़ लूँ, क्योंकि वे सब अपनी मूरतों के कारण मुझसे दूर हो गए हैं।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उनके हृदय के द्वारा।” इब्रानी अभिव्यक्ति कठिन है और इसका अर्थ वह क्षेत्र या साधन हो सकता है जिसके द्वारा यहोवा इस्राएल को पकड़ता है।
    reason: lexical_alternative
  - marker: b
    text: या, “अपनी मूरतों के द्वारा मुझसे पराए हो गए हैं।”
    reason: alternative_reading
lexical_decisions:
- source_word: לְמַעַן
  choice: ताकि
  rationale: यह उद्देश्य प्रकट करता है और आधुनिक हिन्दी में स्वाभाविक है।
- source_word: תְּפֹשׂ
  choice: मैं ... पकड़ लूँ
  rationale: תפשׂ के बलपूर्ण ‘पकड़ना/धर लेना’ रूपक को बनाए रखता है; प्रथम पुरुष निकटवर्ती ईश्वरीय वाणी से स्पष्ट है।
- source_word: אֶת בֵּית יִשְׂרָאֵל
  choice: इस्राएल के घराने को
  rationale: सामूहिक और वाचा-संबंधी अभिव्यक्ति को केवल ‘इस्राएल’ कहकर समतल नहीं करता।
- source_word: בְּלִבָּם
  choice: उनके हृदय में
  rationale: सामूहिक एकवचन ‘हृदय’ को बनाए रखते हुए ב को स्थान/क्षेत्र के अर्थ में प्रस्तुत करता है; इसकी कठिन और संभावित साधनवाचक बारीकी पादटिप्पणी में सुरक्षित है।
- source_word: אֲשֶׁר
  choice: क्योंकि
  rationale: यहाँ यह इस्राएल को पकड़ने की पृष्ठभूमि या कारण बताता है।
- source_word: נָזֹרוּ
  choice: दूर हो गए हैं
  rationale: Niphal रूप में उत्पन्न अलगाव/विमुखता को सरल आधुनिक हिन्दी में व्यक्त करता है, बिना यह तय किए कि बल केवल क्रिया पर है या परिणामी परायापन पर।
- source_word: מֵעָלַי
  choice: मुझसे
  rationale: अलगाव का लक्ष्य स्पष्ट करता है; ‘दूर’ क्रिया-पद में व्यक्त है।
- source_word: בְּגִלּוּלֵיהֶם
  choice: अपनी मूरतों के कारण
  rationale: ב को यहाँ कारण/अवसर के रूप में स्वाभाविक हिन्दी में व्यक्त करता है; גִּלּוּלִים के लिए ‘मूरतें’ यहेजकेल के मूर्तिपूजा-विरोधी संदर्भ में स्पष्ट है।
- source_word: כֻּלָּם
  choice: वे सब
  rationale: समूचे समूह पर दिए गए जोर को स्पष्ट रूप से बनाए रखता है।
theological_decisions:
- issue: परमेश्वर द्वारा इस्राएल के भीतरी जीवन को पकड़ने का रूपक
  choice: इस्राएल के घराने को उनके हृदय में पकड़ लूँ
  alternative: इस्राएल के घराने को उनके हृदय के द्वारा पकड़ लूँ
  rationale: मुख्य पाठ हिन्दी में समझने योग्य रहते हुए हृदय को परमेश्वर के पकड़ने का भीतरी क्षेत्र बताता है; इब्रानी ב की संभावित साधनवाचकता पादटिप्पणी में रखी गई है, इसलिए अस्पष्टता मिटाई नहीं गई।
- issue: इस्राएल की मूर्तिपूजाजनित विमुखता
  choice: अपनी मूरतों के कारण मुझसे दूर हो गए हैं
  alternative: अपनी मूरतों के द्वारा मुझसे पराए हो गए हैं
  rationale: ‘दूर हो गए’ आधुनिक हिन्दी में स्पष्ट है और वाचा-संबंधी अलगाव को व्यक्त करता है; वैकल्पिक परिणामी/निष्क्रिय बारीकी पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘इस्राएल का घराना’ सामूहिक बाइबलीय अभिव्यक्ति बनाए रखता है। मुख्य पाठ में ‘हृदय में’ सहज हिन्दी देता है, जबकि पादटिप्पणी इब्रानी पूर्वसर्ग की वास्तविक अस्पष्टता सुरक्षित रखती है।
