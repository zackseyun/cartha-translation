base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/014/007.yaml
  text: For any man from the house of Israel[a], or from the foreigner who sojourns in Israel, who separates himself from following me and brings up his idols into his heart, and sets the stumbling block of his iniquity before his face, and then comes to the prophet to inquire of me through him, I, Yahweh[d][c][b], will answer him myself.
translation:
  language: hi
  text: क्योंकि इस्राएल के घराने का कोई भी पुरुष[a], या इस्राएल में रहने वाला कोई परदेशी[b], यदि मेरे पीछे चलना छोड़कर मुझसे अलग हो जाए[c], अपनी मूरतों को अपने मन में बसा ले, अपने अधर्म के ठोकर-पत्थर को अपने सामने रखे, और फिर भविष्यद्वक्ता के पास उसके द्वारा मुझसे पूछने आए, तो मैं, याहवे, स्वयं उसे उत्तर दूँगा[d]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में ‘पुरुष’ शब्द दो बार आया है, जिससे ‘हर एक पुरुष’ या ‘कोई भी व्यक्ति’ का वितरणात्मक बल प्रकट होता है।
    reason: lexical_alternative
  - marker: b
    text: यहाँ ‘परदेशी’ से आशय उस गैर-इस्राएली व्यक्ति से है जो इस्राएलियों के बीच निवासी के रूप में रहता था।
    reason: cultural_note
  - marker: c
    text: इब्रानी का शाब्दिक भाव है, ‘मेरे पीछे से अपने को अलग कर ले,’ अर्थात याहवे के पीछे चलना छोड़ दे।
    reason: lexical_alternative
  - marker: d
    text: अंतिम इब्रानी पदबंध संक्षिप्त और व्याख्यात्मक रूप से कठिन है। इसका भाव ‘मैं स्वयं उसे उत्तर दूँगा’ है; इसे ‘मैं अपने द्वारा उसे उत्तर दूँगा’ भी समझा गया है।
    reason: textual_ambiguity
lexical_decisions:
- source_word: אִישׁ אִישׁ
  choice: कोई भी पुरुष
  rationale: संज्ञा की पुनरावृत्ति प्रत्येक अलग-अलग व्यक्ति पर लागू होने वाला वितरणात्मक बल देती है; ‘कोई भी पुरुष’ मूल के पुल्लिंग एकवचन को भी बनाए रखता है।
- source_word: מִבֵּית יִשְׂרָאֵל
  choice: इस्राएल के घराने का
  rationale: ‘घराना’ मूल की वाचा-संबंधी राष्ट्रीय अभिव्यक्ति को केवल ‘इस्राएल’ कहने की अपेक्षा अधिक स्पष्टता से सुरक्षित रखता है।
- source_word: הַגֵּר אֲשֶׁר יָגוּר בְּיִשְׂרָאֵל
  choice: इस्राएल में रहने वाला कोई परदेशी
  rationale: यह इस्राएलियों के बीच स्थायी या दीर्घकालिक रूप से रहने वाले गैर-इस्राएली निवासी को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: וְיִנָּזֵר מֵאַחֲרַי
  choice: मेरे पीछे चलना छोड़कर मुझसे अलग हो जाए
  rationale: यह निफ़अल क्रिया के अलगाव के भाव और ‘मेरे पीछे से’ मुहावरे के निष्ठा त्यागकर अनुसरण बंद करने के अर्थ—दोनों को व्यक्त करता है।
- source_word: וְיַעַל גִּלּוּלָיו אֶל־לִבּוֹ
  choice: अपनी मूरतों को अपने मन में बसा ले
  rationale: ‘ऊपर चढ़ाकर हृदय में लाने’ की इब्रानी छवि का आशय भीतर मूरतों को प्रतिष्ठित करना है; ‘मन में बसा ले’ इसे सहज हिन्दी में बताता है।
- source_word: מִכְשׁוֹל עֲוֺנוֹ
  choice: अपने अधर्म की ठोकर
  rationale: यहेजकेल में बार-बार आने वाली ‘ठोकर’ की छवि और עָוֹן का नैतिक दोष—दोनों सुरक्षित हैं।
- source_word: יָשִׂים נֹכַח פָּנָיו
  choice: अपने सामने रखे
  rationale: यह जानबूझकर पतन का कारण अपने ही सामने रखने की सजीव छवि को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: לִדְרָשׁ לוֹ בִי
  choice: अपने लिए मुझसे पूछने को
  rationale: דרשׁ और ב का अर्थ यहाँ परमेश्वर से पूछना है; לוֹ का हितार्थक भाव ‘अपने लिए’ से व्यक्त होता है, जबकि भविष्यद्वक्ता के पास आना माध्यम को प्रसंग से स्पष्ट करता है।
- source_word: אֲנִי יְהוָה
  choice: मैं, यहोवा
  rationale: स्वतंत्र सर्वनाम का बल और वाक्य की निरंतरता सुरक्षित रखते हुए दिव्य नाम को उसके व्यक्तिवाचक रूप में प्रस्तुत किया गया है।
- source_word: נַעֲנֶה לוֹ בִּי
  choice: स्वयं उसे उत्तर दूँगा
  rationale: इब्रानी पदबंध संक्षिप्त और कठिन है; यह अनुवाद उस प्रमुख बल को रखता है कि उत्तर यहोवा स्वयं देगा, केवल भविष्यद्वक्ता नहीं।
theological_decisions:
- issue: दिव्य नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे / प्रभु
  rationale: मूल में चतुरक्षरीय दिव्य नाम सीधे आया है। हिन्दी में व्यापक रूप से पहचाना जाने वाला व्यक्तिवाचक रूप ‘यहोवा’ नाम की विशिष्टता को ‘प्रभु’ उपाधि की अपेक्षा अधिक स्पष्टता से सुरक्षित रखता है।
- issue: אִישׁ אִישׁ का लिंग और वितरणात्मक बल
  choice: कोई भी पुरुष
  alternative: हर व्यक्ति / कोई भी जन
  rationale: मूल पुल्लिंग एकवचन संज्ञा को दोहराकर प्रत्येक पुरुष को अलग-अलग दायरे में लाता है; चुना हुआ रूप इस व्याकरणिक रूप और उसके प्रतिनिधिक प्रयोग दोनों को बनाए रखता है।
- issue: अंतिम בִּי की व्याख्या
  choice: स्वयं
  alternative: अपने द्वारा / अपने विषय में
  rationale: रूप व्याख्यात्मक रूप से कठिन है। प्रसंग में यहोवा और भविष्यद्वक्ता के बीच विरोध को देखते हुए आत्मवाचक बल मुख्य पाठ में रखा गया है, पर अन्य संभावनाओं को पादटिप्पणी में स्वीकार किया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण और सामान्य पाठक के लिए सुबोध शैली रखी गई है। वाक्य की लंबी शर्तात्मक संरचना मूल के अनुरूप है, पर अल्पविरामों से स्पष्ट की गई है। ‘मूरत’, ‘अधर्म’, ‘भविष्यद्वक्ता’ और ‘यहोवा’ बाइबिलीय संदर्भ में परिचित शब्द हैं; कठिन इब्रानी मुहावरों को मुख्य पाठ में स्वाभाविक बनाया गया और वास्तविक विकल्प पादटिप्पणियों में सुरक्षित रखे गए हैं।
