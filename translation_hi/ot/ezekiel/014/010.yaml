base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/014/010.yaml
  text: And they will bear their punishment[a]; the punishment of the one who inquires will be the same as the punishment of the prophet.
translation:
  language: hi
  text: और वे अपने दण्ड को भोगेंगे[a]; पूछनेवाले का दण्ड वैसा ही होगा जैसा भविष्यद्वक्ता का दण्ड।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “और वे अपना दोष/अधर्म उठाएँगे; पूछनेवाले का दोष भविष्यद्वक्ता के दोष के समान होगा।” इब्रानी शब्द का अर्थ अधर्म, दोष, या दोष के फलस्वरूप मिलने वाला दण्ड हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָשְׂאוּ
  choice: और वे ... भोगेंगे
  rationale: נשא जब עון के साथ आता है, तो दोष अथवा उसके दण्ड को उठाने या सहने का भाव देता है। हिन्दी में दण्ड के साथ ‘भोगेंगे’ स्वाभाविक और न्यायिक प्रसंग के अनुकूल है।
- source_word: עֲוֺנָם
  choice: अपने दण्ड को
  rationale: עון अधर्म, दोष और दोष के फलस्वरूप मिलने वाले दण्ड—तीनों का बोध करा सकता है। इस न्यायिक घोषणा में ‘दण्ड’ परिणाम के पक्ष को स्पष्ट करता है, जबकि पादटिप्पणी मूल की व्यापकता सुरक्षित रखती है।
- source_word: כַּעֲוֺן
  choice: दण्ड वैसा ही ... जैसा ... दण्ड
  rationale: उपसर्ग כ तुलना सूचित करता है। ‘वैसा ही ... जैसा’ पूछनेवाले और भविष्यद्वक्ता के समान दण्ड को सहज हिन्दी में व्यक्त करता है।
- source_word: הַדֹּרֵשׁ
  choice: पूछनेवाले
  rationale: דרש यहाँ भविष्यद्वक्ता से उत्तर या वाणी जानने के लिए पूछने वाले व्यक्ति को दर्शाता है। ‘पूछनेवाला’ संक्षिप्त, स्पष्ट और प्रसंगानुकूल है।
- source_word: הַנָּבִיא
  choice: भविष्यद्वक्ता
  rationale: נביא का मानक और गरिमापूर्ण हिन्दी प्रतिशब्द।
- source_word: יִהְיֶה
  choice: होगा
  rationale: सरल भविष्यकालीन संबंधसूचक क्रिया; आधुनिक हिन्दी में स्वाभाविक।
theological_decisions:
- issue: न्यायसूत्र में עון का अर्थ
  choice: मुख्य पाठ में ‘दण्ड’
  alternative: '‘दोष’ अथवा ‘अधर्म’: ‘वे अपना दोष उठाएँगे; पूछनेवाले का दोष भविष्यद्वक्ता के दोष के समान होगा।’'
  rationale: ‘עון को उठाना’ न्यायिक प्रसंग में दोष का परिणाम भोगने का अर्थ दे सकता है। ‘दण्ड’ इस परिणाम को स्पष्ट करता है, पर मूल शब्द में नैतिक दोष और अधर्म का भाव भी बना रहता है; इसलिए उसे पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी; न्यायिक गंभीरता और मूल की सममिति बनाए रखी गई है। ‘भोगेंगे’ ने इब्रानी मुहावरे को स्वाभाविक हिन्दी दी है, और [a] मुख्य पाठ में उपस्थित है।
