source:
  edition: WLC
  text: וּ/שְׁלֹ֨שֶׁת הָ/אֲנָשִׁ֣ים הָ/אֵלֶּה֮ בְּ/תוֹכָ/הּ֒ חַי אָ֗נִי נְאֻם֙ אֲדֹנָ֣/י יְהוִ֔ה לֹ֥א יַצִּ֖ילוּ בָּנִ֣ים וּ/בָנ֑וֹת כִּ֛י הֵ֥ם לְ/בַדָּ֖/ם יִנָּצֵֽלוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/014/018.yaml
  text: And if these three men were in its midst[a], as I live, declares the Lord GOD, they would not deliver sons or daughters[b]; they alone would be delivered.
translation:
  language: hi
  text: और यदि ये तीनों पुरुष उसके बीच में हों, तो मेरे जीवन की शपथ—प्रभु यहोवा की यह वाणी है—वे बेटों या बेटियों को बचा न सकेंगे; केवल वे ही बचेंगे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּשְׁלֹשֶׁת הָאֲנָשִׁים הָאֵלֶּה
  choice: और यदि ये तीनों पुरुष
  rationale: वाव को निकटवर्ती पदों में बार-बार आने वाली काल्पनिक शर्त के अनुसार ‘और यदि’ से व्यक्त किया गया है। ‘पुरुष’ उन तीन पुरुष उदाहरणों—नूह, दानिय्येल और अय्यूब—के संदर्भ को बनाए रखता है।
- source_word: בְּתוֹכָהּ
  choice: उसके बीच में
  rationale: यह इब्रानी मुहावरे ‘उसके मध्य में’ का स्वाभाविक हिन्दी रूप है और संदर्भ में उस देश की ओर संकेत करता है।
- source_word: חַי אָנִי
  choice: मेरे जीवन की शपथ
  rationale: यह परमेश्वर की गंभीर शपथ का सूत्र है; हिन्दी में यह शाब्दिक ‘मैं जीवित हूँ’ की अपेक्षा उसके शपथ-संबंधी अर्थ को स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: प्रभु यहोवा की घोषणा है
  rationale: नְאֻם को नबूवत की औपचारिक घोषणा के रूप में और व्यक्तिगत दिव्य नाम יהוה को ‘यहोवा’ के रूप में रखा गया है।
- source_word: לֹא יַצִּילוּ בָּנִים וּבָנוֹת
  choice: वे न बेटों को बचा पाएँगे, न बेटियों को
  rationale: हिफ़ील क्रिया यहाँ न्याय से छुड़ाने या बचाने का अर्थ देती है। ‘न…न…’ नकार के भीतर इब्रानी के ‘बेटे और बेटियाँ’ को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: כִּי הֵם לְבַדָּם יִנָּצֵלוּ
  choice: केवल वे ही बचेंगे
  rationale: לְבַדָּם की अनन्यता को ‘केवल…ही’ से बल दिया गया है। निफ़ाल क्रिया को ‘बचेंगे’ कहना पहले प्रयुक्त ‘बचा पाएँगे’ से मूल की शब्दगत कड़ी बनाए रखता है।
theological_decisions:
- issue: अदोनाय יהוה में दिव्य नाम का अनुवाद
  choice: प्रभु यहोवा
  alternative: प्रभु परमेश्वर
  rationale: मूल पाठ में वाचा का व्यक्तिगत नाम יהוה उपस्थित है; ‘यहोवा’ उसे सामान्य उपाधि में बदले बिना स्पष्ट रखता है और ‘अदोनाय’ को ‘प्रभु’ से अलग व्यक्त करता है।
- issue: बचाए जाने का आशय
  choice: बचा पाएँगे / बचेंगे
  alternative: उद्धार कर पाएँगे / उद्धार पाएँगे
  rationale: संदर्भ इस न्याय से प्राणरक्षा का है, अनन्त उद्धार का स्पष्ट प्रतिपादन नहीं। ‘बचना’ उस सीमा को बनाए रखता है और मूल की सक्रिय तथा निफ़ाल क्रियाओं का संबंध भी दिखाता है।
- issue: शर्त का स्पष्ट किया जाना
  choice: यदि…हों, तो
  alternative: और ये तीनों पुरुष उसके बीच में हों
  rationale: यद्यपि इस पद में अलग शर्तसूचक कण नहीं है, पद 14–20 की दोहराई गई वाक्यरचना इसे स्पष्ट काल्पनिक शर्त बनाती है। हिन्दी में ‘यदि…तो’ संदर्भगत संबंध को स्वाभाविक बनाता है।
translation_notes:
  register: भाषा आधुनिक, गंभीर और सार्वजनिक पाठ के योग्य रखी गई है। ‘मेरे जीवन की शपथ’ दिव्य शपथ-सूत्र को सामान्य पाठक के लिए स्पष्ट करता है; अर्धविराम अंतिम विरोध और अनन्यता को उभारता है।
