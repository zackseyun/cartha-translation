source:
  edition: WLC
  text: א֛וֹ דֶּ֥בֶר אֲשַׁלַּ֖ח אֶל הָ/אָ֣רֶץ הַ/הִ֑יא וְ/שָׁפַכְתִּ֨י חֲמָתִ֤/י עָלֶ֨י/הָ֙ בְּ/דָ֔ם לְ/הַכְרִ֥ית מִמֶּ֖/נָּה אָדָ֥ם וּ/בְהֵמָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/014/019.yaml
  text: Or if I send a plague against that land and pour out my wrath on it with blood[a], to cut off from it man and beast,
translation:
  language: hi
  text: या यदि मैं उस देश पर महामारी भेजूँ और उस पर अपना प्रकोप लहू के द्वारा[a] उण्डेलूँ, ताकि उसमें से मनुष्य और पशु दोनों को मिटा दूँ,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘रक्तपात के द्वारा।’ इब्रानी में शाब्दिक रूप से ‘लहू में’ है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אוֹ
  choice: या यदि
  rationale: यह पद न्याय की क्रमिक काल्पनिक स्थितियों में एक और शर्त प्रस्तुत करता है; ‘या यदि’ इस संबंध को स्वाभाविक हिन्दी में स्पष्ट करता है।
- source_word: דֶּבֶר
  choice: महामारी
  rationale: यह शब्द दैवी न्याय के रूप में भेजे गए व्यापक संक्रामक रोग को दर्शाता है; आधुनिक हिन्दी में ‘महामारी’ स्पष्ट और स्वाभाविक है।
- source_word: אֲשַׁלַּח אֶל הָאָרֶץ הַהִיא
  choice: मैं उस देश पर … भेजूँ
  rationale: אֶל मूलतः दिशा सूचित करता है, पर न्याय के इस प्रसंग में हिन्दी का ‘उस देश पर भेजूँ’ लक्षित विपत्ति को स्वाभाविक रूप से व्यक्त करता है।
- source_word: וְשָׁפַכְתִּי חֲמָתִי
  choice: अपना प्रकोप … उण्डेलूँ
  rationale: यह दैवी न्याय का प्रबल रूपक सुरक्षित रखता है; ‘प्रकोप’ חֲמָה की तीव्रता को गरिमापूर्ण आधुनिक हिन्दी में व्यक्त करता है।
- source_word: בְּדָם
  choice: लहू के द्वारा
  rationale: शाब्दिक ‘लहू में’ हिन्दी में अस्पष्ट और अस्वाभाविक हो सकता है। ‘लहू के द्वारा’ साधनवाचक अर्थ रखता है, जबकि ‘रक्तपात के द्वारा’ का व्याख्यात्मक विकल्प पादटिप्पणी में दिया गया है।
- source_word: לְהַכְרִית מִמֶּנָּה
  choice: ताकि उसमें से … मिटा दूँ
  rationale: כרת के कारण होने वाले विनाश अथवा उन्मूलन को ‘मिटा दूँ’ सहज हिन्दी में व्यक्त करता है; מִמֶּנָּה का देश-संदर्भ ‘उसमें से’ से सुरक्षित है।
- source_word: אָדָם וּבְהֵמָה
  choice: मनुष्य और पशु दोनों
  rationale: यह सूत्र मानव और पशु जीवन पर व्यापक न्याय को दर्शाता है। ‘मनुष्य’ यहाँ समस्त मानवजाति के अर्थ में है और ‘दोनों’ युग्म की समावेशिता स्पष्ट करता है।
theological_decisions:
- issue: אָדָם וּבְהֵמָה के न्याय-सूत्र का अनुवाद
  choice: मनुष्य और पशु दोनों
  alternative: लोगों और पशुओं को
  rationale: ‘मनुष्य’ אָדָם के सामूहिक और सर्वमानवीय अर्थ को बनाए रखता है; ‘पशु’ בְּהֵמָה के साथ सूत्र की संक्षिप्त व्यापकता सुरक्षित रहती है।
- issue: בְּדָם में दैवी प्रकोप और रक्त का संबंध
  choice: लहू के द्वारा
  alternative: रक्तपात के द्वारा
  rationale: इब्रानी वाक्यांश संक्षिप्त है और साधन, परिस्थिति या रक्तपात के परिणाम की छाया रख सकता है। मुख्य पाठ निकट रूप रखता है और पादटिप्पणी अधिक व्याख्यात्मक अर्थ देती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘उण्डेलूँ’ दैवी प्रकोप के मूल रूपक को बनाए रखता है; ‘लहू’ बाइबलीय संदर्भ में स्वाभाविक है। पद अगले वाक्य से जुड़ा होने के कारण अंत में अल्पविराम रखा गया है।
