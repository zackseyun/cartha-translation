source:
  edition: WLC
  text: וְ/נֹ֨חַ דנאל וְ/אִיּוֹב֮ בְּ/תוֹכָ/הּ֒ חַי אָ֗נִי נְאֻם֙ אֲדֹנָ֣/י יְהוִ֔ה אִם בֵּ֥ן אִם בַּ֖ת יַצִּ֑ילוּ הֵ֥מָּה בְ/צִדְקָתָ֖/ם יַצִּ֥ילוּ נַפְשָֽׁ/ם־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/014/020.yaml
  text: Even if Noah[a], Daniel, and Job were in it, as I live, declares the Lord GOD, they would deliver neither son nor daughter; by their righteousness they would deliver only themselves.
translation:
  language: hi
  text: चाहे नूह, दानिय्येल[a] और अय्यूब उसमें होते, तौभी मेरे जीवन की शपथ—प्रभु याहवे की यह वाणी है—वे न तो पुत्र को बचा पाते, न पुत्री को; वे अपनी धार्मिकता के द्वारा केवल अपने ही प्राण बचा पाते।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी नाम דנאל को ‘दनेल’ भी पढ़ा जा सकता है। संभव है कि यहाँ सुविख्यात दानिय्येल के बजाय किसी प्राचीन धर्मी व्यक्ति का उल्लेख हो।
    reason: वैकल्पिक पठन और नाम की अनिश्चित पहचान को सुरक्षित रखना।
lexical_decisions:
- source_word: בְּתוֹכָהּ
  choice: उसके बीच में
  rationale: स्त्रीलिंग प्रत्यय संदर्भ में उस देश की ओर संकेत करता है जिस पर न्याय आने वाला है। यह रूप मूल की स्थानवाचक अभिव्यक्ति को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: חַי אָנִי נְאֻם אֲדֹנָי יְהוִה
  choice: मेरे जीवन की शपथ—प्रभु यहोवा की यह वाणी है
  rationale: यह परमेश्वर की गंभीर शपथ का सूत्र है। हिन्दी में ‘मेरे जीवन की शपथ’ उसके शपथात्मक बल को स्पष्ट करता है, और ‘प्रभु यहोवा’ दोनों इब्रानी पदों को अलग-अलग दर्शाता है।
- source_word: אִם בֵּן אִם בַּת
  choice: न तो पुत्र को ... न पुत्री को
  rationale: शपथ-सूत्र के बाद दोहराया गया אִם पूर्ण निषेध का भाव देता है। यह हिन्दी संरचना उस जोर को स्वाभाविक रूप से व्यक्त करती है।
- source_word: יַצִּילוּ
  choice: बचा पाते
  rationale: נצל का हिफ़ील रूप यहाँ न्याय से छुड़ाने या बचाने का अर्थ देता है। संभावित परिस्थिति के अनुरूप ‘बचा पाते’ उपयुक्त है।
- source_word: בְצִדְקָתָם
  choice: अपनी धार्मिकता के द्वारा
  rationale: בְ यहाँ साधन अथवा आधार बताता है। ‘के द्वारा’ इस अर्थ को स्पष्ट रखते हुए कारणात्मक अर्थ को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: נַפְשָׁם
  choice: अपने ही प्राण
  rationale: נֶפֶשׁ यहाँ अमूर्त ‘आत्मा’ नहीं, बल्कि व्यक्ति का जीवन दर्शाता है। ‘प्राण’ न्याय से जीवन बचने का भाव रखता है और הֵמָּה का जोर ‘अपने ही’ में व्यक्त होता है।
- source_word: דנאל
  choice: दानिय्येल
  rationale: मुख्य पाठ में परंपरागत और व्यापक रूप से पहचाना जाने वाला नाम रखा गया है; किंतु इब्रानी वर्तनी דנאל के कारण ‘दनेल’ पाठ-संभावना को पादटिप्पणी में सुरक्षित रखा गया है।
theological_decisions:
- issue: אֲדֹנָי יְהוִה में परमेश्वर के नाम का अनुवाद
  choice: प्रभु यहोवा
  alternative: प्रभु याहवे
  rationale: אֲדֹנָי को ‘प्रभु’ और चतुरक्षरीय नाम יהוה को हिन्दी बाइबल परंपरा में परिचित ‘यहोवा’ से व्यक्त किया गया है; इससे दोनों तत्व स्पष्ट रहते हैं और केवल उपाधि के पीछे व्यक्तिगत नाम नहीं छिपता।
- issue: דנאל की पहचान
  choice: दानिय्येल
  alternative: दनेल
  rationale: इब्रानी वर्तनी सुविख्यात दानिय्येल की सामान्य वर्तनी से भिन्न है और किसी प्राचीन धर्मी दनेल की ओर संकेत कर सकती है। पाठ स्वयं पहचान को निर्णायक रूप से स्पष्ट नहीं करता, इसलिए मुख्य पाठ में परिचित रूप और पादटिप्पणी में वैकल्पिक पठन दिया गया है।
- issue: धार्मिकता से बचाए जाने का दायरा
  choice: वे अपनी धार्मिकता के द्वारा केवल अपने ही प्राण बचा पाते
  alternative: अपनी धार्मिकता के कारण वे केवल स्वयं बचते
  rationale: मूल पाठ धार्मिकता और बचाव के बीच संबंध बताता है, पर उसे किसी व्यापक धर्मसैद्धांतिक व्यवस्था में नहीं समझाता। ‘के द्वारा’ साधन/आधार की मूल अस्पष्टता और यह जोर दोनों रखता है कि उनकी धार्मिकता संतान को नहीं बचाती।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण भविष्यद्वाणी-शैली रखी गई है। ‘तौभी’ शपथ के बाद आने वाले निषेध को सहजता से जोड़ता है। ‘पुत्र’ और ‘पुत्री’ औपचारिक किंतु सामान्य बाइबलीय शब्द हैं; ‘अपने ही प्राण’ व्यक्ति/जीवन के अर्थ को ‘आत्मा’ संबंधी अनावश्यक दार्शनिक अर्थ से बचाता है।
