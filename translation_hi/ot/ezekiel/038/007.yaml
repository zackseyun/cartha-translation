  yaml_path: translation/ot/ezekiel/038/007.yaml
  text: Be prepared[b][a], and prepare yourself—you and all your assembly who are gathered around you—and be a guard for them.
translation:
  language: hi
  text: तैयार हो जा और अपने आपको तैयार कर—तू और तेरी सारी सभा के लोग, जो तेरे चारों ओर इकट्ठे हुए हैं—और तू उनका पहरेदार बन।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उनकी चौकसी कर” अथवा “उनका रखवाला बन।” इब्रानी शब्द पहरा देने, निगरानी रखने या उनकी ज़िम्मेदारी लेने का भाव दे सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הִכֹּן וְהָכֵן לְךָ
  choice: तैयार हो जा और अपने आपको तैयार कर
  rationale: एक ही मूल से आए निफ़अल और हिफ़ईल आज्ञार्थक रूप मिलकर तैयारी की आज्ञा को बल देते हैं। हिन्दी में यह युग्म अवस्था और सक्रिय आत्म-तैयारी, दोनों को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: קְהָלֶךָ
  choice: तेरी सारी सभा
  rationale: קהל किसी इकट्ठे समूह को दर्शाता है। ‘सभा’ मूल की व्यापकता बनाए रखती है और संदर्भ को अनावश्यक रूप से केवल सेना तक सीमित नहीं करती।
- source_word: הַנִּקְהָלִים עָלֶיךָ
  choice: जो तेरे चारों ओर इकट्ठी हुई है
  rationale: सम्बन्धवाचक कृदन्त और עָלֶיךָ का यहाँ स्वाभाविक अर्थ गोग के चारों ओर जुटी हुई सभा है। एकवचन ‘हुई है’ सामूहिक संज्ञा ‘सभा’ के अनुरूप है।
- source_word: וְהָיִיתָ לָהֶם לְמִשְׁמָר
  choice: और तू उनका पहरेदार बन
  rationale: מִשְׁמָר पहरे, निगरानी, रक्षक या दायित्व का भाव दे सकता है। ‘पहरेदार बन’ संज्ञात्मक रचना और आज्ञार्थक बल को बनाए रखते हुए सहज हिन्दी है।
theological_decisions:
- issue: מִשְׁמָר में सुरक्षा, निगरानी या नेतृत्व का संभावित भाव
  choice: उनका पहरेदार बन
  alternative: उनकी चौकसी कर / उनकी निगरानी अपने हाथ में ले
  rationale: मुख्य पाठ अपेक्षाकृत औपचारिक और व्यापक अर्थ रखता है; पादटिप्पणी वास्तविक शाब्दिक अनिश्चितता बताती है और किसी विशिष्ट सैन्य या धर्मवैज्ञानिक भूमिका को आरोपित नहीं करती।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सीधा आज्ञार्थक रूप अपनाया गया है। भविष्यवाणी में गोग को एकवचन अनौपचारिक सम्बोधन होने के कारण ‘तू/तेरे’ रखा गया है। दोहराई गई तैयारी की आज्ञा को मूल के बलाघात सहित बनाए रखा गया है।
