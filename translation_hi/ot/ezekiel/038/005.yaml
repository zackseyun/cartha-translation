  text: फ़ारस, कूश[a] और पूत[b] उनके साथ हैं; उन सबके पास ढाल और टोप हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: कुछ पारंपरिक अनुवादों में कूश को ‘इथियोपिया’ कहा गया है।
    reason: lexical_alternative
  - marker: b
    text: कुछ अनुवादों और ऐतिहासिक पहचानों में पूत को लीबिया से जोड़ा गया है।
