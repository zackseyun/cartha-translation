lexical_decisions:
- source_word: פָּרַס
  choice: फ़ारस
  rationale: यह इस प्राचीन जाति और क्षेत्र का हिन्दी में प्रचलित नाम है।
- source_word: כּוּשׁ
  choice: कूश
  rationale: मूल जाति-भौगोलिक नाम का लिप्यंतरण किया गया है; इसे ‘इथियोपिया’ कहना अधिक व्याख्यात्मक और संभावित रूप से काल-विसंगत होगा।
- source_word: פוּט
  choice: पूत
  rationale: मूल जाति-भौगोलिक नाम को लिप्यंतरित किया गया है; ‘लीबिया’ एक पारंपरिक पहचान है, पर इब्रानी पाठ में वह नाम स्पष्ट रूप से नहीं है।
- source_word: אִתָּם
  choice: उनके साथ हैं
  rationale: इब्रानी संबंधबोधक पद का सीधा अर्थ ‘उनके साथ’ है; स्वाभाविक हिन्दी वाक्य के लिए ‘हैं’ जोड़ा गया है।
- source_word: כֻּלָּם
  choice: उन सबके
  rationale: यह सूचीबद्ध सहयोगियों की समग्रता पर बल देता है और अगले सैन्य-साज के वर्णन से जोड़ा गया है।
- source_word: מָגֵן
  choice: ढाल
  rationale: यह रक्षात्मक युद्ध-सामग्री के लिए सहज और सटीक आधुनिक हिन्दी शब्द है।
- source_word: כוֹבָע
  choice: टोप
  rationale: सैन्य प्रसंग में सिर की रक्षात्मक सामग्री को दर्शाने वाला संक्षिप्त, पारंपरिक और बोधगम्य हिन्दी शब्द है।
