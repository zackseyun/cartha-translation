  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/אָ֣מַרְתָּ֔ כֹּ֥ה אָמַ֖ר אֲדֹנָ֣/י יְהוִ֑ה הִנְ/נִ֤י אֵלֶ֨י/ךָ֙ גּ֔וֹג נְשִׂ֕יא רֹ֖אשׁ מֶ֥שֶׁךְ וְ/תֻבָֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/038/003.yaml
  text: 'and say, ‘Thus says the Lord GOD: Behold, I am against you, Gog, chief prince of Meshech and Tubal.’'
translation:
  language: hi
  text: 'और कहना, ‘प्रभु यहोवा[a] यों कहता है: देख, हे गोग, मेशेक और तूबल के प्रधान शासक, मैं तेरे विरुद्ध हूँ।’'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या: ‘प्रभु याहवे’। ‘यहोवा’ उस इब्रानी नाम יהוה का पारंपरिक हिन्दी रूप है। इब्रानी पद נְשִׂיא רֹאשׁ का अनुवाद ‘रोश, मेशेक और तूबल का शासक’ भी किया गया है।'
    reason: दिव्य नाम के रूप तथा רֹאשׁ की वास्तविक शाब्दिक/व्याकरणिक अस्पष्टता से पाठक को अवगत कराना।
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  choice: प्रभु यहोवा
  rationale: दिव्य उपाधि और व्यक्तिगत नाम, दोनों को अलग रखते हुए हिन्दी में स्वाभाविक और गरिमापूर्ण रूप दिया गया है।
- source_word: הִנְנִי אֵלֶיךָ
  choice: देख, ... मैं तेरे विरुद्ध हूँ
  rationale: הִנְנִי की ध्यान आकर्षित करने वाली शक्ति को ‘देख’ से और אֵלֶיךָ के इस शत्रुतापूर्ण संदर्भगत अर्थ को ‘तेरे विरुद्ध’ से व्यक्त किया गया है।
- source_word: נְשִׂיא רֹאשׁ
  choice: प्रधान शासक
  rationale: रֹאשׁ को सामान्य संज्ञा ‘प्रधान’ मानकर נְשִׂיא के साथ पदवी के रूप में पढ़ा गया है; इसे अनिश्चित स्थान-नाम ‘रोश’ नहीं बनाया गया।
- source_word: מֶשֶׁךְ וְתֻבָל
  choice: मेशेक और तूबल
  rationale: दोनों प्राचीन जातीय/भौगोलिक नामों का हिन्दी लिप्यंतरण किया गया है।
theological_decisions:
- issue: רֹאשׁ को पदवी मानें या व्यक्तिवाचक स्थान-नाम
  choice: ‘प्रधान शासक’—रֹאשׁ को विशेषण/पदवी माना गया
  alternative: ‘रोश, मेशेक और तूबल का शासक’
  rationale: व्याकरण और निकटवर्ती प्राचीन अनुवाद-परंपरा में दोनों की संभावना पर चर्चा हुई है; यहाँ WLC के व्यंजन-पाठ और व्यापक आधुनिक समझ के अनुरूप ‘मुख्य/प्रधान शासक’ चुना गया, जबकि वास्तविक पाठगत अस्पष्टता को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी; भविष्यद्वाणी की सीधी, गंभीर और गरिमापूर्ण वाणी। सम्बोधन में एकवचन ‘तेरे’ मूल इब्रानी के एकवचन रूप को बनाए रखता है।
