base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/038/015.yaml
  text: And you will come from your place[a], from the far north—you and many peoples with you[b], all of them riding horses—a great assembly and a mighty army.
translation:
  language: hi
  text: और तू अपने स्थान से, सुदूर उत्तर के छोरों से[a] आएगा—तू और तेरे साथ बहुत-से लोग; वे सब घोड़ों पर सवार होंगे—एक बड़ी सभा और एक विशाल सेना।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “सुदूर उत्तर से।” इब्रानी मुहावरा उत्तर के सबसे दूर के भागों को दर्शाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָאתָ
  choice: और तू...आएगा
  rationale: संयोजक वाव सहित क़ाल पूर्ण 2 पुल्लिंग एकवचन यहाँ भविष्यसूचक कथन में भविष्य का भाव देता है। ‘और’ क्रम को बनाए रखता है।
- source_word: מִמְּקוֹמְךָ
  choice: अपने स्थान से
  rationale: מָקוֹם का सामान्य अर्थ ‘स्थान’ है; यह सहज और अर्थ की अनावश्यक विशिष्टता से मुक्त है।
- source_word: מִיַּרְכְּתֵי צָפוֹן
  choice: सुदूर उत्तर के छोरों से
  rationale: यह इब्रानी मुहावरा उत्तर के दूरस्थतम भागों को दर्शाता है। ‘छोरों’ बहुवचन रूप और दूरस्थ सीमा, दोनों को स्पष्ट रखता है।
- source_word: אַתָּה וְעַמִּים רַבִּים אִתָּךְ
  choice: तू और तेरे साथ बहुत-से लोग
  rationale: स्वतंत्र सर्वनाम का बल बनाए रखते हुए עַמִּים को ‘राष्ट्रों’ की अपेक्षा अधिक मूल अर्थ वाले ‘लोग’ से व्यक्त किया गया है।
- source_word: רֹכְבֵי סוּסִים כֻּלָּם
  choice: वे सब घोड़ों पर सवार होंगे
  rationale: सहभागी कृदंत का दृश्यात्मक अर्थ सुरक्षित है और כֻּלָּם का समष्टिगत बल ‘वे सब’ से स्पष्ट होता है। वाक्य में भविष्यकालीन क्रिया स्वाभाविक हिन्दी के लिए जोड़ी गई है।
- source_word: קָהָל גָּדוֹל
  choice: एक बड़ी सभा
  rationale: קָהָל एकत्र समूह को दर्शाता है। ‘सभा’ मूल सामूहिक अर्थ रखता है, बिना इसे धार्मिक मंडली तक सीमित किए।
- source_word: וְחַיִל רָב
  choice: और एक विशाल सेना
  rationale: सैन्य संदर्भ में חַיִל का अर्थ सेना या सैन्य बल है; רָב यहाँ उसके बड़े विस्तार को सूचित करता है।
