source:
  edition: WLC
  text: כֹּֽה אָמַ֞ר אֲדֹנָ֣/י יְהוִ֗ה הַֽ/אַתָּה ה֨וּא אֲשֶׁר דִּבַּ֜רְתִּי בְּ/יָמִ֣ים קַדְמוֹנִ֗ים בְּ/יַד֙ עֲבָדַ/י֙ נְבִיאֵ֣י יִשְׂרָאֵ֔ל הַֽ/נִּבְּאִ֛ים בַּ/יָּמִ֥ים הָ/הֵ֖ם שָׁנִ֑ים לְ/הָבִ֥יא אֹתְ/ךָ֖ עֲלֵי/הֶֽם־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/038/017.yaml
  text: 'Thus says the Lord GOD: Are you the one of whom I spoke in former days by the hand of my servants the prophets of Israel[c][b][a], who prophesied in those days for years that I would bring you against them?'
translation:
  language: hi
  text: '“प्रभु यहोवा यों कहता है: क्या तू वही है जिसके विषय में मैंने प्राचीन दिनों में अपने सेवकों—इस्राएल के भविष्यद्वक्ताओं—के द्वारा[a] कहा था? वे उन दिनों वर्षों तक[b] यह भविष्यवाणी करते रहे थे कि मैं तुझे उनके विरुद्ध ले आऊँगा।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से “अपने सेवकों ... के हाथ से”; यह मुहावरा “के द्वारा” या “के माध्यम से” के अर्थ में है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में शाब्दिक शब्दक्रम “उन दिनों, वर्षों” है; यह संभवतः इस बात पर बल देता है कि ये भविष्यवाणियाँ लंबे समय तक कही जाती रहीं।
    reason: textual_ambiguity
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  choice: प्रभु यहोवा
  rationale: संयुक्त ईश्वरीय उपाधि में אֲדֹנָי को ‘प्रभु’ और वाचा के व्यक्तिगत नाम יהוה को ‘यहोवा’ के रूप में रखा गया है; इससे हिंदी में अस्वाभाविक ‘प्रभु प्रभु’ से बचते हुए मूल नाम सुरक्षित रहता है।
- source_word: הַאַתָּה הוּא
  choice: क्या तू वही है
  rationale: दो स्वतंत्र सर्वनामों से बने बलाघाती प्रश्न का स्वाभाविक हिंदी रूप है और गोग की ओर सीधे संकेत को बनाए रखता है।
- source_word: אֲשֶׁר דִּבַּרְתִּי
  choice: जिसके विषय में मैंने ... कहा था
  rationale: यहाँ संबंधवाचक पद का आशय उस व्यक्ति से है जिसके बारे में पहले भविष्यसूचक वचन कहा गया था।
- source_word: בְּיָמִים קַדְמוֹנִים
  choice: प्राचीन दिनों में
  rationale: समय की प्राचीनता और पूर्वकालीन संदर्भ दोनों को स्पष्ट तथा गरिमापूर्ण आधुनिक हिंदी में व्यक्त करता है।
- source_word: בְּיַד
  choice: के द्वारा
  rationale: शाब्दिक अर्थ ‘के हाथ से’ है, पर यह इब्रानी में माध्यम अथवा प्रतिनिधि के द्वारा बोलने का मुहावरा है; हिंदी में ‘के द्वारा’ अधिक स्वाभाविक है।
- source_word: עֲבָדַי נְבִיאֵי יִשְׂרָאֵל
  choice: अपने सेवकों, इस्राएल के भविष्यद्वक्ताओं
  rationale: ‘इस्राएल के भविष्यद्वक्ता’ उन्हीं सेवकों की व्याख्या करता है; अल्पविराम इस समानाधिकरण को हिंदी में स्पष्ट करता है।
- source_word: הַנִּבְּאִים בַּיָּמִים הָהֵם שָׁנִים
  choice: वे उन दिनों वर्षों तक यह भविष्यवाणी करते रहे थे
  rationale: भागसूचक रूप और असामान्य ‘उन दिनों, वर्षों’ संरचना को इस तरह व्यक्त किया गया है कि दीर्घ अवधि का बल बना रहे।
- source_word: לְהָבִיא אֹתְךָ עֲלֵיהֶם
  choice: कि मैं तुझे उनके विरुद्ध ले आऊँगा
  rationale: अनंत क्रिया को पूर्व भविष्यवाणी की विषय-वस्तु के रूप में लिया गया है; युद्ध-संदर्भ में עֲלֵיהֶם का स्वाभाविक अर्थ ‘उनके विरुद्ध’ है।
theological_decisions:
- issue: אֲדֹנָי יְהוִה में परमेश्वर के नाम का अनुवाद
  choice: प्रभु यहोवा
  alternative: प्रभु परमेश्वर
  rationale: मूल में יהוה व्यक्तिगत वाचा-नाम है; ‘यहोवा’ उसे सामान्य उपाधि में विलीन किए बिना सुरक्षित रखता है।
- issue: पूर्व भविष्यवक्ताओं के वचनों और गोग की पहचान का संबंध
  choice: प्रश्नवाचक पहचान को यथावत रखा गया है
  alternative: इसे सीधी घोषणा बनाना कि गोग का उल्लेख स्पष्ट रूप से पहले हो चुका था
  rationale: הַאַתָּה הוּא प्रश्न के रूप में है। अनुवाद यह निश्चित नहीं करता कि पहले के किन विशिष्ट भविष्यसूचक वचनों का संकेत है।
- issue: שָׁנִים का वाक्यगत संबंध
  choice: भविष्यवाणी की विस्तृत अवधि—‘वर्षों तक’
  alternative: ‘उन प्राचीन वर्षों में’ जैसे समय-संज्ञा के साथ जोड़ना
  rationale: इब्रानी पदबंध संक्षिप्त और कुछ असामान्य है। मुख्य पाठ संभावित अवधि-बोध देता है, जबकि पादटिप्पणी मूल संरचना की अस्पष्टता बताती है।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण भविष्यसूचक शैली रखी गई है। गोग को संबोधित करने के कारण एकवचन ‘तू/तुझे’ प्रयुक्त है। ‘यों कहता है’ पारंपरिक बाइबलीय सूत्र की पहचान बनाए रखते हुए सामान्य पाठक के लिए सुबोध है।
