base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/038/013.yaml
  text: Sheba and Dedan and the merchants of Tarshish, with all her young lions, will say to you, ‘Have you come to take plunder? Have you assembled your company to seize silver and gold, to take livestock and goods, to take great plunder?’
translation:
  language: hi
  text: शबा और ददान, तर्शीश के व्यापारी और उसके सभी जवान सिंह[a] तुझसे कहेंगे, ‘क्या तू लूट लेने आया है? क्या तूने चाँदी-सोना उठा ले जाने, पशुधन और माल-संपत्ति छीन लेने और बड़ी लूट लेने के लिए अपना दल इकट्ठा किया है?’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “जवान सिंह” संभवतः तर्शीश से जुड़े प्रभावशाली अगुओं या शासकों के लिए एक रूपक है; मूल हिब्रू में यही चित्रात्मक अभिव्यक्ति है।
    reason: शाब्दिक चित्र आधुनिक पाठक को असामान्य लग सकता है, जबकि उसका सटीक संदर्भ अनिश्चित है।
lexical_decisions:
- source_word: כְּפִירֶיהָ
  choice: उसके सभी जवान सिंह
  rationale: मसोरेटिक स्वरांकन के अनुसार כְּפִיר का सामान्य अर्थ ‘जवान सिंह’ है। स्त्रीलिंग प्रत्यय का निकटतम पूर्वपद तर्शीश है; रूपक को मुख्य पाठ में सुरक्षित रखा गया है।
- source_word: שָׁלָל / בַּז
  choice: लूट / छीन लेना
  rationale: दो निकटार्थक हिब्रू शब्द लूट के विचार को दोहराते हैं। हिन्दी में अनावश्यक कृत्रिमता से बचते हुए ‘लूट’ और क्रियात्मक ‘छीन लेना’ से अर्थ तथा बल बनाए रखा गया है।
- source_word: קָהָלֶךָ
  choice: अपना दल
  rationale: यहाँ कָהָל आक्रमण के लिए जुटाए गए समूह को दर्शाता है; ‘दल’ आधुनिक हिन्दी में प्रसंगानुकूल और सहज है।
- source_word: מִקְנֶה וְקִנְיָן
  choice: पशुधन और माल-संपत्ति
  rationale: מִקְנֶה विशेषतः पशुधन और קִנְיָן अर्जित वस्तुओं अथवा संपत्ति को सूचित करता है; दोनों के भेद को रखा गया है।
theological_decisions:
- issue: ‘जवान सिंहों’ की रूपकात्मक पहचान
  choice: रूपक को मुख्य पाठ में अक्षुण्ण रखा गया
  alternative: ‘सरदारों’, ‘शासकों’ या ‘व्यापारियों’ के रूप में अर्थ खोल देना
  rationale: मूल पाठ उनकी पहचान स्पष्ट नहीं करता। किसी विशेष राजनीतिक या व्यापारी वर्ग को निश्चित कर देना वास्तविक अस्पष्टता को समाप्त कर देता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। संबोधन एकवचन ‘तू/तुझसे’ है, क्योंकि हिब्रू में संबोधित व्यक्ति गोग है। प्रश्नों की आरोपात्मक ध्वनि और लूट की पुनरावृत्ति सुरक्षित रखी गई है।
