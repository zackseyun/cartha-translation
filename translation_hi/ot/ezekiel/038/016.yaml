base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/038/016.yaml
  text: And you will come up against my people Israel like a cloud to cover the land. In the latter days it will happen that I will bring you against my land[a], so that the nations may know me when I show myself holy through you before their eyes, O Gog.
translation:
  language: hi
  text: और तू मेरी प्रजा इस्राएल के विरुद्ध चढ़ आएगा, देश को ढक लेने वाले बादल के समान। अंत के दिनों में ऐसा होगा कि मैं तुझे अपने देश के विरुद्ध लाऊँगा, ताकि जब मैं तेरे द्वारा उनकी आँखों के सामने अपनी पवित्रता प्रकट करूँगा[a], तब जातियाँ मुझे जानें। हे गोग!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या अधिक शाब्दिक रूप में, “जब मैं उनकी आँखों के सामने तुझमें अपने को पवित्र ठहराऊँ।”
    reason: בְּהִקָּדְשִׁי בְךָ की अधिक शाब्दिक रचना तथा ‘तुझमें/तेरे द्वारा’ की अर्थ-सम्भावना को सुरक्षित रखता है।
lexical_decisions:
- source_word: וְעָלִיתָ עַל עַמִּי יִשְׂרָאֵל
  choice: तू मेरी प्रजा इस्राएल के विरुद्ध चढ़ आएगा
  rationale: עלה सैन्य सन्दर्भ में किसी के विरुद्ध आगे बढ़ने को व्यक्त करता है। ‘चढ़ आएगा’ मूल आरोहण-चित्र और आक्रमणकारी भाव दोनों को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: כֶּעָנָן לְכַסּוֹת הָאָרֶץ
  choice: मानो देश को ढक लेने वाला बादल
  rationale: उपमा को स्पष्ट रखा गया है। यहाँ הָאָרֶץ का निकट सन्दर्भ इस्राएल का देश है, इसलिए ‘देश’ चुना गया; ‘ढक लेने वाला’ उद्देश्य अथवा परिणाम का स्वाभाविक हिन्दी रूप है।
- source_word: בְּאַחֲרִית הַיָּמִים
  choice: अन्त के दिनों में
  rationale: यह पारम्परिक भविष्यसूचक अभिव्यक्ति है। यह भविष्यकालीन और युगान्त-संबंधी भार बनाए रखती है, पर किसी विशेष अन्त-समय प्रणाली को आरोपित नहीं करती।
- source_word: תִּהְיֶה
  choice: ऐसा होगा
  rationale: स्त्रीलिंग एकवचन क्रिया सम्भवतः पहले कही गई समूची घटना की ओर संकेत करती है; ‘ऐसा होगा’ उसका स्वाभाविक घटनात्मक अनुवाद है।
- source_word: וַהֲבִאוֹתִיךָ עַל אַרְצִי
  choice: मैं तुझे अपने देश के विरुद्ध लाऊँगा
  rationale: בוא के हिफ़ईल रूप में परमेश्वर की कारक भूमिका है। hostile context में עַל के लिए ‘के विरुद्ध’ उपयुक्त है, और ‘अपने देश’ मूल के दैवी स्वामित्व को सुरक्षित रखता है।
- source_word: לְמַעַן דַּעַת הַגּוֹיִם אֹתִי
  choice: ताकि ... जातियाँ मुझे जानें
  rationale: यह दैवी उद्देश्य व्यक्त करता है। ‘मुझे जानें’ ידע के बौद्धिक तथा सम्बन्धपरक-प्रकाशनात्मक अर्थ को खुला रखता है।
- source_word: בְּהִקָּדְשִׁי בְךָ
  choice: जब मैं तेरे द्वारा ... अपने को पवित्र प्रकट करूँ
  rationale: यह परमेश्वर के अधिक पवित्र बनने की बात नहीं, बल्कि गोग के माध्यम से उसके पवित्र होने के सार्वजनिक प्रकटीकरण की बात है। בְךָ में ‘तुझमें’ अथवा ‘तेरे द्वारा’ दोनों सम्भव छायाएँ हैं; सहज मुख्य पाठ में माध्यमसूचक ‘तेरे द्वारा’ लिया गया और अधिक शाब्दिक रूप पादटिप्पणी में रखा गया।
- source_word: לְעֵינֵיהֶם
  choice: उनकी आँखों के सामने
  rationale: यह घटना के सार्वजनिक और प्रत्यक्ष रूप से घटने का सजीव, निकट-शाब्दिक हिन्दी मुहावरा है।
- source_word: גּוֹג
  choice: हे गोग!
  rationale: पद के अन्त में नाम सम्बोधन के रूप में प्रयुक्त है; ‘हे’ हिन्दी में इसे स्पष्ट करता है।
theological_decisions:
- issue: בְּאַחֲרִית הַיָּמִים की युगान्त-संबंधी अभिव्यक्ति
  choice: अन्त के दिनों में
  alternative: आनेवाले दिनों में; अंतिम दिनों में
  rationale: चुना हुआ रूप भविष्यसूचक और युगान्त-संबंधी तनाव को बनाए रखता है, लेकिन किसी निश्चित कालक्रम या सम्प्रदायगत अन्त-समय योजना का निर्णय नहीं करता।
- issue: בְּהִקָּדְשִׁי בְךָ में परमेश्वर के अपने को पवित्र ठहराने की भाषा
  choice: जब मैं तेरे द्वारा उनकी आँखों के सामने अपने को पवित्र प्रकट करूँ
  alternative: जब मैं उनकी आँखों के सामने तुझमें अपने को पवित्र ठहराऊँ
  rationale: मुख्य पाठ स्पष्ट करता है कि परमेश्वर की पवित्रता सार्वजनिक रूप से प्रकट होती है; वह नैतिक रूप से अधिक पवित्र नहीं बनता। फिर भी मूल की ‘तुझमें/तेरे द्वारा’ वाली अस्पष्टता और अधिक शाब्दिक आत्म-पवित्रीकरण भाषा पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सामान्य पाठक के लिए बोधगम्य शैली अपनाई गई है। दैवी सम्बोधन की एकवचन निकटता के कारण ‘तू/तुझे/तेरे’ रखा गया है। ‘चढ़ आएगा’ भविष्यसूचक सैन्य चित्र को बनाए रखता है, जबकि वाक्य-विन्यास को हिन्दी में सहज बनाया गया है।
