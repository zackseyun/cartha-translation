id: EZK.38.14
reference: Ezekiel 38:14
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: לָ/כֵן֙ הִנָּבֵ֣א בֶן אָדָ֔ם וְ/אָמַרְתָּ֣ לְ/ג֔וֹג כֹּ֥ה אָמַ֖ר אֲדֹנָ֣/י יְהוִ֑ה הֲ/ל֣וֹא בַּ/יּ֣וֹם הַ/ה֗וּא בְּ/שֶׁ֨בֶת עַמִּ֧/י יִשְׂרָאֵ֛ל לָ/בֶ֖טַח תֵּדָֽע־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/038/014.yaml
  text: 'Therefore prophesy[a], son of man, and say to Gog, ‘Thus says the Lord GOD: On that day, when my people Israel dwell securely, will you not know it?’'
translation:
  language: hi
  text: 'इसलिए, हे मनुष्य के पुत्र, भविष्यवाणी कर और गोग से कह, ‘प्रभु याहवे यों कहता है: जिस दिन मेरी प्रजा इस्राएल सुरक्षित[a] बसेगी, क्या उस दिन तुझे इसका पता न चलेगा?’'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘निश्चिन्त होकर।’ इब्रानी לָבֶטַח का अर्थ सुरक्षित अथवा निर्भय अवस्था में बसना हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: इसलिए
  rationale: यह पिछले प्रसंग से निकले निष्कर्ष और आगे दिए जाने वाले आदेश के बीच स्वाभाविक तार्किक संबंध दिखाता है।
- source_word: הִנָּבֵא
  choice: भविष्यवाणी कर
  rationale: नבא के आज्ञार्थक रूप का मानक, स्पष्ट और प्रसंगानुकूल हिन्दी अनुवाद।
- source_word: בֶן אָדָם
  choice: हे मनुष्य के पुत्र
  rationale: यहेजकेल को बार-बार दिए गए इस सम्बोधन की शाब्दिक छवि और पुस्तक के भीतर उसकी साहित्यिक निरन्तरता बनाए रखता है।
- source_word: וְאָמַרְתָּ לְגוֹג
  choice: और गोग से कह
  rationale: पहली आज्ञा के बाद आने वाली क्रमिक आज्ञा को सहज हिन्दी में व्यक्त करता है।
- source_word: כֹּה אָמַר
  choice: यों कहता है
  rationale: भविष्यद्वक्ताओं के पारम्परिक सन्देशवाहक सूत्र का गरिमापूर्ण और स्वाभाविक हिन्दी रूप।
- source_word: אֲדֹנָי יְהוִה
  choice: प्रभु याहवे
  rationale: אֲדֹנָי को ‘प्रभु’ और परमेश्वर के व्यक्तिगत नाम יהוה को ‘याहवे’ के रूप में अलग-अलग बनाए रखता है।
- source_word: בַּיּוֹם הַהוּא
  choice: जिस दिन … क्या उस दिन
  rationale: इब्रानी कालवाचक पद को हिन्दी वाक्य-विन्यास में स्पष्ट रूप से रखता है और प्रश्न के मुख्य खण्ड से उसका संबंध बनाए रखता है।
- source_word: בְּשֶׁבֶת עַמִּי יִשְׂרָאֵל
  choice: मेरी प्रजा इस्राएल … बसेगी
  rationale: ישב के कालवाचक infinitive construct को स्वाभाविक हिन्दी उपवाक्य में व्यक्त करता है; ‘प्रजा’ सामूहिक लोगों के अर्थ को दर्शाता है।
- source_word: לָבֶטַח
  choice: सुरक्षित
  rationale: इस्राएल के निर्भय और सुरक्षित अवस्था में बसने का भाव संक्षेप और सहजता से व्यक्त करता है; ‘निश्चिन्त होकर’ भी सम्भव है।
- source_word: הֲלוֹא … תֵּדָע
  choice: क्या … तुझे इसका पता न चलेगा?
  rationale: सकारात्मक उत्तर की अपेक्षा रखने वाले आलंकारिक प्रश्न को बनाए रखता है। ידע यहाँ किसी स्थिति से अवगत होने या उसका पता चलने के अर्थ में स्वाभाविक रूप से लिया गया है; ‘इसका’ प्रसंग में निहित कर्म को स्पष्ट करता है।
theological_decisions:
- issue: אֲדֹנָי יְהוִה में परमेश्वर के नाम का अनुवाद
  choice: प्रभु याहवे
  alternative: प्रभु परमेश्वर; प्रभु यहोवा
  rationale: मूल पाठ में वाचा का व्यक्तिगत नाम יהוה उपस्थित है। ‘याहवे’ उसे सामान्य उपाधि में बदलने के बजाय नाम के रूप में सुरक्षित रखता है, जबकि אֲדֹנָי का पृथक अर्थ ‘प्रभु’ से व्यक्त होता है।
- issue: גּוֹג से एकवचन सम्बोधन
  choice: तुझे
  alternative: तुम्हें; आपको
  rationale: इब्रानी क्रिया द्वितीय पुरुष पुल्लिंग एकवचन है। हिन्दी में ‘तुझे’ प्रत्यक्ष एकवचन सम्बोधन को स्पष्ट रखता है और शत्रु-शासक को अनावश्यक आदरसूचकता नहीं देता।
- issue: הֲלוֹא תֵּדָע के आलंकारिक प्रश्न की व्याख्या
  choice: क्या … तुझे इसका पता न चलेगा?
  alternative: तुझे निश्चय ही इसका पता चलेगा
  rationale: कथन में बदलने के बजाय मूल पाठ का प्रश्नात्मक रूप और उसकी अपेक्षित सकारात्मक प्रतिक्रिया दोनों बनाए रखे गए हैं।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। भविष्यद्वाणी के औपचारिक सन्देशवाहक सूत्र के लिए ‘यों कहता है’ प्रयुक्त है। पादटिप्पणी का चिह्न उसी शब्द ‘सुरक्षित’ पर रखा गया है जिससे उसका वास्तविक lexical संबंध है।
