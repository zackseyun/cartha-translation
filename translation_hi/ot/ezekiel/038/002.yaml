  text: בֶּן אָדָ֗ם שִׂ֤ים פָּנֶ֨י/ךָ֙ אֶל גּוֹג֙ אֶ֣רֶץ הַ/מָּג֔וֹג נְשִׂ֕יא רֹ֖אשׁ מֶ֣שֶׁךְ וְ/תֻבָ֑ל וְ/הִנָּבֵ֖א עָלָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/038/002.yaml
  text: Son of man, set your face toward Gog, of the land of Magog, the chief prince of Meshech and Tubal, and prophesy against him.
translation:
  language: hi
  text: “हे मनुष्य के पुत्र, मागोग देश के गोग की ओर अपना मुख कर, जो मेशेक और तूबल का प्रधान शासक है, और उसके विरुद्ध भविष्यवाणी कर।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֶּן־אָדָם
  choice: हे मनुष्य के पुत्र
  rationale: यहेजकेल के लिए प्रयुक्त संबोधन को उसके पारंपरिक और स्रोत-सन्निकट रूप में रखा गया है; यहाँ इसका अर्थ साधारण मानवता पर बल देना है।
- source_word: שִׂים פָּנֶיךָ אֶל
  choice: अपना मुख ... की ओर कर
  rationale: इब्रानी मुहावरे की छवि को बनाए रखते हुए स्वाभाविक हिंदी दी गई है; यह दृढ़तापूर्वक किसी की ओर उन्मुख होने का आदेश है।
- source_word: גּוֹג אֶרֶץ הַמָּגוֹג
  choice: मागोग देश के गोग
  rationale: व्यक्तिनाम और स्थाननाम का संबंध स्रोत के अनुसार स्पष्ट रखा गया है।
- source_word: נְשִׂיא רֹאשׁ מֶשֶׁךְ וְתֻבָל
  choice: मेशेक और तूबल का प्रधान शासक
  rationale: רֹאשׁ को सामान्य संज्ञा ‘प्रधान’ माना गया है, न कि ‘रोश’ नामक स्थान; נְשִׂיא के लिए आधुनिक पाठकों हेतु व्यापक और स्वाभाविक ‘शासक’ चुना गया है।
- source_word: וְהִנָּבֵא עָלָיו
  choice: और उसके विरुद्ध भविष्यवाणी कर
  rationale: עַל का यहाँ विरोधात्मक भाव संदर्भानुकूल है और आने वाले न्याय-संदेश को व्यक्त करता है।
theological_decisions:
- issue: רֹאשׁ की व्याख्या
  choice: ‘प्रधान’—मेशेक और तूबल के शासक का विशेषण
  alternative: ‘रोश, मेशेक और तूबल का शासक’
  rationale: वाक्य-विन्यास और प्राचीन अनुवाद-परंपरा दोनों व्याख्याओं की संभावना दिखाते हैं, पर इस संदर्भ में सामान्य संज्ञा ‘प्रधान’ अधिक संभावित मानी गई है; किसी आधुनिक राष्ट्र से पहचान नहीं जोड़ी गई।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण, स्पष्ट और स्रोत-सन्निकट शैली। व्यक्तिनामों का प्रचलित हिंदी बाइबलीय लिप्यंतरण रखा गया है।
