  text: וְ/רָעֲשׁ֣וּ מִ/פָּנַ֡/י דְּגֵ֣י הַ/יָּם֩ וְ/ע֨וֹף הַ/שָּׁמַ֜יִם וְ/חַיַּ֣ת הַ/שָּׂדֶ֗ה וְ/כָל הָ/רֶ֨מֶשׂ֙ הָ/רֹמֵ֣שׂ עַל הָֽ/אֲדָמָ֔ה וְ/כֹל֙ הָֽ/אָדָ֔ם אֲשֶׁ֖ר עַל פְּנֵ֣י הָ/אֲדָמָ֑ה וְ/נֶהֶרְס֣וּ הֶ/הָרִ֗ים וְ/נָֽפְלוּ֙ הַ/מַּדְרֵג֔וֹת וְ/כָל חוֹמָ֖ה לָ/אָ֥רֶץ תִּפּֽוֹל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/038/020.yaml
  text: The fish of the sea[a], the birds of the heavens, the beasts of the field, every creeping thing that creeps on the ground, and every man who is on the face of the earth will quake at my presence; the mountains will be thrown down, the cliffs will fall, and every wall will fall to the ground.
translation:
  language: hi
  text: समुद्र की मछलियाँ, आकाश के पक्षी, मैदान के जंगली पशु, हर रेंगनेवाला प्राणी जो भूमि पर रेंगता है, और धरती के ऊपर रहने वाला हर मनुष्य मेरी उपस्थिति से काँप उठेंगे। पहाड़ ढह जाएँगे, खड़ी ढलानें गिर पड़ेंगी, और हर दीवार धरती पर गिर जाएगी।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְרָעֲשׁוּ
  choice: काँप उठेगा
  rationale: רעשׁ यहाँ परमेश्वर की उपस्थिति से होने वाले तीव्र कंपन या थरथराहट को व्यक्त करता है। संयुक्त कर्ता को समष्टि मानकर हिंदी में एकवचन क्रिया स्वाभाविक है।
- source_word: מִפָּנַי
  choice: मेरी उपस्थिति से
  rationale: शाब्दिक अर्थ ‘मेरे मुख/उपस्थिति के कारण’ है। ‘से’ भय और कंपन के कारण को स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: דְּגֵי הַיָּם
  choice: समुद्र की मछलियाँ
  rationale: हिब्रू संबंधवाचक पदबंध का सीधा और स्वाभाविक हिंदी रूप।
- source_word: עוֹף הַשָּׁמַיִם
  choice: आकाश के पक्षी
  rationale: इस संदर्भ में שָׁמַיִם उड़ते पक्षियों के क्षेत्र, अर्थात आकाश, को सूचित करता है; यह आधुनिक हिंदी में स्पष्ट और गरिमापूर्ण है।
- source_word: חַיַּת הַשָּׂדֶה
  choice: मैदान के जंगली पशु
  rationale: यह पद सामान्यतः खुले भूभाग के वन्य पशुओं को दर्शाता है; ‘जंगली’ अर्थ को स्पष्ट करता है।
- source_word: כָּל הָרֶמֶשׂ הָרֹמֵשׂ עַל הָאֲדָמָה
  choice: भूमि पर रेंगनेवाला हर जीव
  rationale: मूल की धातुगत पुनरुक्ति को ‘रेंगनेवाला’ में पर्याप्त रूप से दर्शाते हुए बोझिल हिंदी से बचा गया है।
- source_word: כֹל הָאָדָם
  choice: हर मनुष्य
  rationale: אָדָם यहाँ किसी पुरुष-विशेष के बजाय मानवजाति के प्रत्येक सदस्य के लिए सामूहिक अर्थ में प्रयुक्त है।
- source_word: עַל פְּנֵי הָאֲדָמָה
  choice: धरती के ऊपर रहनेवाला
  rationale: मुहावरे का आशय धरती पर निवास करने वालों से है; ‘रहनेवाला’ हिंदी में संबंध स्पष्ट करता है।
- source_word: וְנֶהֶרְסוּ הֶהָרִים
  choice: पहाड़ ढहा दिए जाएँगे
  rationale: הרס के निफ़अल रूप में गिराए या ध्वस्त किए जाने का भाव है; हिंदी कर्मवाच्य इसे बनाए रखता है।
- source_word: הַמַּדְרֵגוֹת
  choice: खड़ी ढलानें
  rationale: दुर्लभ शब्द מדרגות यहाँ पर्वतीय सीढ़ीनुमा या खड़े स्थानों को सूचित कर सकता है। ‘खड़ी ढलानें’ स्थलरूप को व्यक्त करता है, पर उसे निश्चित रूप से ‘चट्टानें’ नहीं ठहराता।
- source_word: כָל חוֹמָה לָאָרֶץ תִּפּוֹל
  choice: हर दीवार धरती पर गिर जाएगी
  rationale: पूर्ण पतन का सीधा, स्वाभाविक हिंदी रूप।
theological_decisions:
- issue: אָדָם का सामूहिक मानवीय अर्थ
  choice: हर मनुष्य
  alternative: सारी मानवजाति; हर आदमी
  rationale: एकवचन אָדָם यहाँ सामूहिक रूप से मनुष्यों को समेटता है। ‘हर मनुष्य’ लिंग-सीमित अर्थ जोड़े बिना एकवचन वितरणात्मक बल बनाए रखता है।
- issue: מִפָּנַי में दिव्य उपस्थिति और कारण
  choice: मेरी उपस्थिति से
  alternative: मेरे सामने; मेरे कारण
  rationale: यह रूप परमेश्वर की प्रकट उपस्थिति और उससे उत्पन्न भय-कंपन दोनों को बनाए रखता है, बिना प्रकट होने की रीति को अधिक स्पष्ट किए।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण, स्पष्ट भविष्यसूचक शैली। सूची की व्यापकता और विनाश की क्रमिक तीव्रता बनाए रखी गई है। दुर्लभ הַמַּדְרֵגוֹת को अति-निश्चित किए बिना ‘खड़ी ढलानें’ कहा गया है।
