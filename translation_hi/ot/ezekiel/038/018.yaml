base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/038/018.yaml
  text: And it will happen on that day[a], on the day when Gog comes against the land of Israel, declares the Lord GOD, that my wrath will rise up in my nostrils.
translation:
  language: hi
  text: '“उस दिन ऐसा होगा—जिस दिन गोग इस्राएल की भूमि के विरुद्ध आएगा—प्रभु यहोवा की यह घोषणा है: मेरा क्रोध भड़क उठेगा[a]।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक रूप से: “मेरा प्रकोप मेरी नाक में ऊपर उठेगा।” इब्रानी में “नाक” क्रोध के लिए प्रयुक्त मुहावरेदार बिंब है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: ऐसा होगा
  rationale: यह भविष्यसूचक घटना का सूत्रात्मक परिचय है; ‘ऐसा होगा’ आधुनिक हिन्दी में स्वाभाविक रहते हुए भावी निश्चितता बनाए रखता है।
- source_word: בַּיּוֹם הַהוּא
  choice: उस दिन
  rationale: भविष्यसूचक समय-सूचक पद का सीधा और प्रचलित हिन्दी रूप।
- source_word: בְּיוֹם בּוֹא גוֹג
  choice: जिस दिन गोग … चढ़ आएगा
  rationale: पूर्वसर्ग सहित infinitive construct को स्वाभाविक कालवाचक उपवाक्य में व्यक्त किया गया है। ‘चढ़ आएगा’ प्रसंग में आक्रमणकारी आगमन को स्पष्ट करता है।
- source_word: עַל אַדְמַת יִשְׂרָאֵל
  choice: इस्राएल की भूमि पर
  rationale: עַל का स्थानगत अर्थ बनाए रखा गया है, जबकि ‘चढ़ आएगा’ से प्रसंग का शत्रुतापूर्ण भाव प्रकट होता है; אַדְמָה के लिए ‘भूमि’ उपयुक्त है।
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: प्रभु यहोवा की यह घोषणा है
  rationale: נְאֻם के भविष्यसूचक घोषणा-सूत्र को स्पष्ट हिन्दी में रखा गया है; אֲדֹנָי को ‘प्रभु’ और व्यक्तिगत दिव्य नाम יהוה को ‘यहोवा’ दिया गया है।
- source_word: תַּעֲלֶה
  choice: भड़क उठेगा
  rationale: עלה के ऊपर उठने के रूपक और तीव्र क्रोध के प्रसंग—दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: חֲמָתִי
  choice: मेरा प्रकोप
  rationale: חֵמָה के उग्र, दहकते और न्यायकारी क्रोध के गंभीर भाव के लिए ‘प्रकोप’ उपयुक्त है।
- source_word: בְּאַפִּי
  choice: मेरे नथनों में
  rationale: אַף की ठोस शारीरिक छवि को मुख्य पाठ में बनाए रखा गया है; यह क्रोध के लिए प्रयुक्त इब्रानी मुहावरा भी है।
theological_decisions:
- issue: אֲדֹנָי יְהוִה में दिव्य नाम का अनुवाद
  choice: प्रभु यहोवा
  alternative: प्रभु परमेश्वर
  rationale: यह रूप אֲדֹנָי की उपाधि और יהוה के व्यक्तिगत वाचा-नाम के बीच भेद बनाए रखता है, बिना किसी सम्प्रदायगत व्याख्या को जोड़े।
- issue: दिव्य क्रोध की शारीरिक छवि
  choice: मेरे नथनों में मेरा प्रकोप भड़क उठेगा
  alternative: मेरा क्रोध भड़क उठेगा
  rationale: मुख्य पाठ में मूल इब्रानी की ठोस और तीव्र छवि सुरक्षित रखी गई है; पादटिप्पणी इसके मुहावरेदार अर्थ को स्पष्ट करती है, पर तनाव को मिटाती नहीं।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और भविष्यसूचक शैली के अनुरूप है। डैश मूल वाक्य के दोहराए हुए कालवाचक ढाँचे और बीच में आए घोषणा-सूत्र को पठनीय बनाते हैं। ठोस इब्रानी बिंब को मुख्य पाठ में रखा गया है और पादटिप्पणी में उसका शाब्दिक तथा मुहावरेदार अर्थ दिया गया है।
