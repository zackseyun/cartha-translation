source:
  edition: WLC
  text: וְ/הִתְגַּדִּלְתִּי֙ וְ/הִתְקַדִּשְׁתִּ֔י וְ/נ֣וֹדַעְתִּ֔י לְ/עֵינֵ֖י גּוֹיִ֣ם רַבִּ֑ים וְ/יָדְע֖וּ כִּֽי אֲנִ֥י יְהוָֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/038/023.yaml
  text: I will show myself great and show myself holy[a], and I will make myself known in the sight of many nations[b]. Then they will know that I am Yahweh.
translation:
  language: hi
  text: इस प्रकार मैं अपनी महानता और पवित्रता प्रकट करूँगा[a], और बहुत-से राष्ट्रों की आँखों के सामने अपने आपको प्रकट करूँगा। तब वे जानेंगे कि मैं यहोवा[b] हूँ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अथवा अधिक शाब्दिक रूप में, “मैं अपने आपको महान करूँगा और अपने आपको पवित्र करूँगा।” इब्रानी क्रियाएँ आत्म-संदर्भित रूप में हैं; प्रसंग में भाव यह है कि परमेश्वर अपने कार्यों द्वारा अपनी महानता और पवित्रता सबके सामने दिखाएगा।
    reason: lexical_alternative
  - marker: b
    text: 'इब्रानी: YHWH (יהוה); ईश्वरीय नाम का हिन्दी रूप “यहोवा।” कुछ अनुवाद इसे “प्रभु” लिखते हैं।'
    reason: divine_name
lexical_decisions:
- source_word: וְהִתְגַּדִּלְתִּי
  choice: मैं अपने आपको महान ... प्रकट करूँगा
  rationale: हित्पाएल रूप आत्म-संदर्भित सार्वजनिक प्रदर्शन का भाव देता है। यह अनुवाद परमेश्वर के अपने कार्यों द्वारा अपनी महानता दिखाने का अर्थ स्पष्ट करता है, बिना इसे केवल आत्म-बड़ाई के रूप में प्रस्तुत किए।
- source_word: וְהִתְקַדִּשְׁתִּי
  choice: मैं अपने आपको ... पवित्र प्रकट करूँगा
  rationale: यहेजकेल में यह रूप राष्ट्रों के सामने परमेश्वर की पवित्रता के प्रदर्शन का संकेत देता है। 'पवित्र प्रकट करूँगा' आधुनिक हिन्दी में 'अपने आपको पवित्र करूँगा' की अपेक्षा कम भ्रामक है।
- source_word: וְנוֹדַעְתִּי
  choice: अपने आपको प्रकट करूँगा
  rationale: निफ़ाल रूप का शाब्दिक अर्थ 'जाना जाऊँगा' हो सकता है, पर प्रथम पुरुष क्रियाओं की शृंखला में यह परमेश्वर द्वारा स्वयं को सबके सामने ज्ञात कराने का प्रभाव व्यक्त करता है।
- source_word: לְעֵינֵי
  choice: की आँखों के सामने
  rationale: यह इब्रानी मुहावरे की दृश्यता और सार्वजनिकता दोनों को स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: גּוֹיִם רַבִּים
  choice: बहुत-सी जातियाँ
  rationale: संदर्भ में גּוֹיִם राजनीतिक-सामुदायिक राष्ट्रों या जातियों को दर्शाता है। 'जातियाँ' बाइबलीय हिन्दी में सुबोध है और 'अन्यजाति' जैसा बाद का धार्मिक विरोध आयात नहीं करता।
- source_word: וְיָדְעוּ
  choice: वे जानेंगे
  rationale: सरल काल रूप और यहेजकेल में बार-बार आने वाले पहचान-सूत्र को सीधे रूप में सुरक्षित रखा गया है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: व्यक्तिगत ईश्वरीय नाम को किसी उपाधि से बदलने के बजाय हिन्दी में प्रचलित नाम-रूप 'यहोवा' से प्रस्तुत किया गया है।
theological_decisions:
- issue: परमेश्वर की महानता और पवित्रता प्रकट करने वाली आत्म-संदर्भित क्रियाएँ
  choice: '''अपने आपको महान और पवित्र प्रकट करूँगा'''
  alternative: '''मैं अपने आपको बड़ा करूँगा और पवित्र करूँगा'' अथवा ''मैं महान ठहरूँगा और पवित्र माना जाऊँगा'''
  rationale: चुना गया पाठ परमेश्वर की निर्णायक गतिविधि और राष्ट्रों के सामने उसके सार्वजनिक आत्म-प्रकाशन दोनों को रखता है, पर यह दावा नहीं करता कि वह पहले महान या पवित्र नहीं था।
- issue: וְנוֹדַעְתִּי में कर्तृत्व और कर्मवाच्यता
  choice: '''अपने आपको प्रकट करूँगा'''
  alternative: '''मैं जाना जाऊँगा'''
  rationale: मुख्य पाठ प्रसंग में निहित ईश्वरीय कर्तृत्व को स्वाभाविक हिन्दी में व्यक्त करता है; पादटिप्पणी रूपगत कर्मवाच्य विकल्प को सुरक्षित रखती है।
- issue: ईश्वरीय नाम יהוה
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: हिन्दी पाठकों के लिए परिचित व्यक्तिगत नाम-रूप अपनाया गया है और उसे केवल 'प्रभु' जैसी उपाधि से प्रतिस्थापित नहीं किया गया।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सार्वजनिक पाठ के योग्य हिन्दी। 'अपने आपको' की पुनरावृत्ति इब्रानी की आत्म-संदर्भित क्रियाओं को स्पष्ट करती है। मुख्य पाठ में 'प्रकट' दो बार आता है; पहली बार गुणों के प्रदर्शन और दूसरी बार स्वयं को ज्ञात कराने के लिए, जिससे मूल क्रियात्मक क्रम बना रहता है।
