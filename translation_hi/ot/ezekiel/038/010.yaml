  text: כֹּ֥ה אָמַ֖ר אֲדֹנָ֣/י יְהוִ֑ה וְ/הָיָ֣ה בַּ/יּ֣וֹם הַ/ה֗וּא יַעֲל֤וּ דְבָרִים֙ עַל לְבָבֶ֔/ךָ וְ/חָשַׁבְתָּ֖ מַחֲשֶׁ֥בֶת רָעָֽה׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/038/010.yaml
  text: 'Thus says the Lord GOD: On that day[a], things will come up in your heart[b], and you will devise an evil plan.'
translation:
  language: hi
  text: 'प्रभु याहवे यों कहता है: उस दिन तुम्हारे हृदय[b] में विचार[a] उठेंगे, और तुम एक बुरी योजना बनाओगे।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘बातें’ या ‘मामले’। इब्रानी דְבָרִים का अर्थ ‘शब्द’, ‘बातें’ या अधिक व्यापक रूप से ‘मामले’ हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी मुहावरे में हृदय केवल भावनाओं का नहीं, बल्कि सोच, इच्छा और इरादे का भी केंद्र है।
    reason: cultural_note
lexical_decisions:
- source_word: כֹּה אָמַר
  choice: यों कहता है
  rationale: यह भविष्यद्वक्ताओं की मानक संदेशवाहक उद्घोषणा है। ‘यों कहता है’ मूल की औपचारिक गरिमा बनाए रखते हुए स्वाभाविक हिन्दी है।
- source_word: אֲדֹנָי יְהוִה
  choice: प्रभु यहोवा
  rationale: אֲדֹנָי को ‘प्रभु’ और परमेश्वर के व्यक्तिगत वाचा-नाम יהוה को ‘यहोवा’ से व्यक्त किया गया है; इससे संयुक्त उपाधि के दोनों अंग बने रहते हैं।
- source_word: וְהָיָה בַּיּוֹם הַהוּא
  choice: उस दिन
  rationale: यह इब्रानी प्रयोग भविष्य में घटने वाली परिस्थिति का समय बताता है। हिन्दी में ‘उस दिन’ उसका संक्षिप्त और स्वाभाविक रूप है।
- source_word: יַעֲלוּ דְבָרִים
  choice: बातें उठेंगी
  rationale: עלה का मूल बिंब ‘ऊपर उठना’ और דְבָרִים की ‘बातें/मामले’ वाली व्यापकता दोनों रखे गए हैं। प्रसंग में इसका आशय भीतर विचार या इरादे उभरने से है, पर मुख्य पाठ उस अर्थ को आवश्यकता से अधिक सीमित नहीं करता।
- source_word: עַל לְבָבֶךָ
  choice: तुम्हारे हृदय में
  rationale: शाब्दिक संबंधसूचक ‘पर’ को स्वाभाविक हिन्दी मुहावरे के अनुसार ‘में’ किया गया है। ‘हृदय’ मूल की देह-संबंधी संकल्पना को बनाए रखता है, जहाँ सोच और इरादा भी केंद्र में हैं।
- source_word: וְחָשַׁבְתָּ מַחֲשֶׁבֶת רָעָה
  choice: तुम एक बुरी योजना बनाओगे
  rationale: संज्ञा और उसी मूल से बने क्रिया-पद का संयुक्त अर्थ जान-बूझकर योजना गढ़ना है। हिन्दी में शब्द-मूल की पुनरुक्ति की अपेक्षा ‘योजना बनाना’ अधिक स्वाभाविक है और רָעָה की नैतिक बुराई स्पष्ट रखता है।
theological_decisions:
- issue: संयुक्त ईश्वरीय उपाधि אֲדֹנָי יְהוִה का अनुवाद
  choice: प्रभु यहोवा
  alternative: प्रभु परमेश्वर
  rationale: मूल पाठ में सामान्य उपाधि אֲדֹנָי के साथ वाचा-नाम יהוה स्पष्ट रूप से उपस्थित है। ‘प्रभु यहोवा’ दोनों को अलग-अलग व्यक्त करता है और नाम को सामान्य पदवी में विलीन नहीं करता।
- issue: ‘हृदय’ को केवल भावना अथवा केवल बुद्धि मानने का प्रश्न
  choice: हृदय को मुख्य पाठ में बनाए रखकर पादटिप्पणी में उसके व्यापक इब्रानी अर्थ को स्पष्ट करना
  alternative: मन
  rationale: इब्रानी मानव-विज्ञान में לֵבָב विचार, इच्छा और इरादे का भी केंद्र है। ‘मन’ तत्काल अर्थ स्पष्ट करता, पर मूल बिंब को संकुचित कर देता।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण भविष्यद्वाणी-संबंधी स्वर रखा गया है। वाक्य सहज है, पर ‘हृदय में बातें उठना’ मूल इब्रानी बिंब और उसकी वास्तविक अर्थगत व्यापकता को जान-बूझकर सुरक्षित रखता है।
