  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וּ/בְ/קִנְאָתִ֥/י בְ/אֵשׁ עֶבְרָתִ֖/י דִּבַּ֑רְתִּי אִם לֹ֣א בַּ/יּ֣וֹם הַ/ה֗וּא יִֽהְיֶה֙ רַ֣עַשׁ גָּד֔וֹל עַ֖ל אַדְמַ֥ת יִשְׂרָאֵֽל־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/038/019.yaml
  text: 'For in my jealousy[a], in the fire of my wrath, I have spoken: surely on that day there will be a great earthquake upon the land of Israel.'
translation:
  language: hi
  text: 'क्योंकि मैंने अपनी जलन में, अपने क्रोध की आग में, कहा है: निश्चय ही उस दिन इस्राएल की भूमि पर एक बड़ा भूकंप[a] आएगा।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘एक बड़ा कंपन’ अथवा ‘एक प्रबल थरथराहट।’ हिब्रू शब्द רַעַשׁ व्यापक प्रकार के हिलने या काँपने को भी दर्शा सकता है, यद्यपि इस प्रसंग में ‘भूकंप’ उपयुक्त है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְקִנְאָתִי
  choice: क्योंकि मैंने अपनी जलन में
  rationale: वाव को प्रसंग के कारणवाचक संबंध के अनुसार ‘क्योंकि’ कहा गया है। קִנְאָה में ईर्ष्या और प्रबल उत्साह—दोनों की अर्थछाया हो सकती है; ‘जलन’ यहाँ परमेश्वर की तीव्र, व्यक्तिगत और वाचा-संबंधी प्रतिक्रिया को बिना नरम किए व्यक्त करती है।
- source_word: בְאֵשׁ עֶבְרָתִי
  choice: अपने प्रकोप की आग में
  rationale: शाब्दिक ‘आग’ की तीव्र रूपक-छवि बनाए रखी गई है और עֶבְרָה के उग्र क्रोध को स्वाभाविक, गरिमापूर्ण हिन्दी में ‘प्रकोप’ से व्यक्त किया गया है।
- source_word: דִּבַּרְתִּי
  choice: मैंने ... कहा है
  rationale: हिब्रू पूर्ण क्रिया को ऐसी पूरी हो चुकी गंभीर घोषणा के रूप में प्रस्तुत किया गया है जिसका प्रभाव वर्तमान में बना हुआ है।
- source_word: אִם לֹא
  choice: निश्चय ही
  rationale: यहाँ यह पदबंध शर्त नहीं, बल्कि शपथ-सदृश दृढ़ पुष्टि है; ‘निश्चय ही’ उसका स्वाभाविक हिन्दी रूप है।
- source_word: בַּיּוֹם הַהוּא
  choice: उस दिन
  rationale: भविष्यसूचक काल-सूत्र का सीधा और प्रचलित हिन्दी अनुवाद।
- source_word: יִהְיֶה
  choice: आएगा
  rationale: भूकंप के साथ हिन्दी में ‘आना’ स्वाभाविक है और अस्तित्वसूचक भाव ‘होगा’ को अर्थ की हानि के बिना व्यक्त करता है।
- source_word: רַעַשׁ גָּדוֹל
  choice: एक बड़ा भूकंप
  rationale: רַעַשׁ व्यापक रूप से हिलने या काँपने को भी दर्शा सकता है, पर भूमि और अगले पद के व्यापक कंपन के प्रसंग में ‘भूकंप’ सबसे स्पष्ट अर्थ है; व्यापक विकल्प पादटिप्पणी में सुरक्षित है।
- source_word: עַל אַדְמַת יִשְׂרָאֵל
  choice: इस्राएल की भूमि पर
  rationale: אַדְמָה का अर्थ भूमि, धरती या मिट्टी हो सकता है। यहाँ ‘भूमि’ स्थानगत अर्थ को स्वाभाविक रूप से व्यक्त करती है और עַל का अर्थ ‘पर’ से सुरक्षित रहता है।
theological_decisions:
- issue: परमेश्वर के भावात्मक वर्णन की तीव्रता
  choice: अपनी जलन में, अपने प्रकोप की आग में
  alternative: अपने उत्साह में, अपने क्रोध की आग में
  rationale: मूल पाठ परमेश्वर की जलन और प्रकोप को प्रबल व्यक्तिगत भाषा में रखता है। अनुवाद उसे अमूर्त न्याय या केवल उत्साह बनाकर नरम नहीं करता और न बाद की कोई व्याख्या जोड़ता है।
- issue: पहले पुरुष में परमेश्वर का वचन, जबकि इस पद में वक्ता का नाम नहीं है
  choice: वक्ता का कोई अतिरिक्त परिचय न जोड़ना
  alternative: ‘प्रभु ने कहा’ जैसा वक्ता-सूचक वाक्य जोड़ना
  rationale: प्रसंग से वक्ता परमेश्वर हैं, पर इस पद के हिब्रू पाठ में अलग वक्ता-सूचक वाक्य नहीं है; इसलिए उसे जोड़ना मूल से आगे जाना होगा।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण भविष्यसूचक शैली रखी गई है। वाक्य को सहज बनाने के लिए ‘भूकंप होगा’ के स्थान पर प्रचलित ‘भूकंप आएगा’ कहा गया है। पादटिप्पणी-चिह्न उसी शब्द पर रखा गया है जिससे वह संबंधित है।
