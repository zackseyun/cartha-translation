    issue: ‘प्रकोप’ for עֶבְרָה
    rationale: In modern Hindi, ‘प्रकोप’ often refers to a disaster, plague, or destructive outbreak, and thus may shift the meaning from God’s anger to its consequence. The Hebrew denotes wrath/indignation; ‘क्रोध’ preserves that sense directly.
  - severity: low
    issue: Footnote alternative ‘बहुत बड़ा काँपना’
    rationale: This is less idiomatic as a noun phrase and does not closely mirror the lexical alternative ‘a great trembling.’ ‘एक बड़ा कंपन’ and ‘एक प्रबल थरथराहट’/‘ज़ोरदार कंपन’ communicate the broader shaking sense more naturally.
