id: EZK.38.21
reference: Ezekiel 38:21
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/קָרָ֨אתִי עָלָ֤י/ו לְ/כָל הָרַ/י֙ חֶ֔רֶב נְאֻ֖ם אֲדֹנָ֣/י יְהוִ֑ה חֶ֥רֶב אִ֖ישׁ בְּ/אָחִ֥י/ו תִּֽהְיֶֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/038/021.yaml
  text: And I will summon a sword against him on all my mountains[a], declares the Lord GOD; every man's sword will be against his brother.
translation:
  language: hi
  text: “मैं अपने सभी पहाड़ों पर उसके विरुद्ध तलवार बुलाऊँगा[a],” प्रभु यहोवा की यह घोषणा है। “हर एक की तलवार उसके भाई के विरुद्ध होगी।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मैं उसके विरुद्ध तलवार के लिए पुकारूँगा।”
    reason: कרא का एक अधिक शाब्दिक विकल्प ‘पुकारना/के लिए पुकारना’ हो सकता है; मुख्य पाठ का ‘तलवार बुलाऊँगा’ न्याय के साधन को बुलाने का भाव अधिक स्वाभाविक हिन्दी में व्यक्त करता है।
lexical_decisions:
- source_word: וְקָרָאתִי
  choice: मैं ... बुलाऊँगा
  rationale: קרא यहाँ न्याय के साधन के रूप में तलवार को बुलाने या तलब करने का भाव रखता है। ‘बुलाऊँगा’ मूल क्रिया की ठोस छवि को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: עָלָיו
  choice: उसके विरुद्ध
  rationale: न्याय और युद्ध के इस प्रसंग में עַל शत्रुतापूर्ण दिशा व्यक्त करता है; इसका संकेत गोग की ओर है।
- source_word: לְכָל הָרַי
  choice: अपने सभी पहाड़ों पर
  rationale: वाक्यांश न्याय का स्थान इस्राएल के उन पहाड़ों पर बताता है जिन्हें यहोवा ‘अपने’ कहता है। हिन्दी में ‘पर’ स्थानवाचक अर्थ को स्वाभाविक रूप से व्यक्त करता है।
- source_word: חֶרֶב
  choice: तलवार
  rationale: यह युद्ध और न्याय के साधन की मूर्त छवि है। हिन्दी में अनिश्चित पदबंध के लिए अलग उपपद आवश्यक नहीं है।
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: प्रभु यहोवा की यह घोषणा है
  rationale: נְאֻם को प्रचलित भविष्यद्वाणी-सूत्र ‘यह घोषणा है’ से व्यक्त किया गया है; אֲדֹנָי को ‘प्रभु’ और परमेश्वर के निज नाम יהוה को ‘यहोवा’ रखा गया है।
- source_word: חֶרֶב אִישׁ בְּאָחִיו תִּהְיֶה
  choice: हर एक की तलवार उसके भाई के विरुद्ध होगी
  rationale: אִישׁ का वितरणात्मक बल ‘हर एक’ से व्यक्त होता है। ‘भाई’ मूल की निकटता बनाए रखता है और यहाँ साथियों के बीच परस्पर हिंसा का संकेत देता है।
theological_decisions:
- issue: संयुक्त उपाधि אֲדֹנָי יְהוִה में परमेश्वर के नाम का अनुवाद
  choice: प्रभु यहोवा
  alternative: प्रभु परमेश्वर
  rationale: मूल पाठ में יהוה निज नाम के रूप में स्पष्ट है। ‘यहोवा’ उसे सामान्य पदवी ‘परमेश्वर’ में बदलने के बजाय नाम के रूप में सुरक्षित रखता है, जबकि אֲדֹנָי का अर्थ ‘प्रभु’ है।
- issue: भाइयों के बीच तलवार होने का आशय
  choice: मूल की ठोस भाषा को बनाए रखा गया
  alternative: वे एक-दूसरे को मार डालेंगे
  rationale: व्याख्यात्मक विकल्प परस्पर संहार का आशय खोल देता, पर मूल की तलवार और ‘भाई’ वाली तनावपूर्ण छवि को घटा देता। इसलिए पाठ इस परिणाम की प्रक्रिया को अतिरिक्त रूप से स्पष्ट नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सहज भविष्यद्वाणी-संबंधी गद्य अपनाया गया है। ‘तलवार बुलाऊँगा’ की सजीव छवि और ‘उसके भाई’ की मूल अभिव्यक्ति को व्याख्यात्मक विस्तार के बिना सुरक्षित रखा गया है।
