  rationale: भविष्यसूचक क्रम में सम्बोधित गोग के भावी कथन को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: אֶעֱלֶה
  choice: मैं ... पर चढ़ाई करूँगा
  rationale: עלה की ऊपर जाने की दिशा और प्रसंग में सैन्य अभियान—दोनों को हिन्दी मुहावरे ‘चढ़ाई करना’ में व्यक्त किया गया है।
- source_word: אֶרֶץ פְּרָזוֹת
  choice: बिना शहरपनाह वाली बस्तियों का देश
  rationale: פְּרָזוֹת खुली, रक्षात्मक दीवार से रहित बस्तियों को सूचित करता है; यह अनुवाद ठोस अर्थ को बनाए रखता है।
- source_word: אָבוֹא
  choice: मैं ... पर हमला करूँगा
  rationale: मूल क्रिया सामान्यतः ‘आना’ है, पर गोग के शत्रुतापूर्ण इरादे के प्रसंग में लक्ष्य की ओर आक्रमणकारी गति निहित है।
- source_word: הַשֹּׁקְטִים
  choice: जो चैन से रहते हैं
  rationale: शान्त, निर्विघ्न और निश्चिन्त अवस्था को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: יֹשְׁבֵי לָבֶטַח
  choice: सुरक्षित बसे हैं
  rationale: ישב के निवास/बसने और לָבֶטַח के सुरक्षा-बोध दोनों को सुरक्षित रखता है।
- source_word: כֻּלָּם יֹשְׁבִים בְּאֵין חוֹמָה
  choice: वे सब बिना शहरपनाह के रहते हैं
  rationale: नए व्याख्यात्मक उपवाक्य की संरचना बनाए रखता है और חוֹמָה को सामूहिक रक्षात्मक दीवार के अर्थ में प्रस्तुत करता है।
- source_word: וּבְרִיחַ וּדְלָתַיִם אֵין לָהֶם
  choice: उनके पास न बेड़े हैं, न फाटक
  rationale: בְרִיחַ प्रवेश को रोकने वाली अड़चन/बेड़े को और דְלָתַיִם द्वार-पल्लों को दर्शाता है; किलेबन्दी के प्रसंग में ‘फाटक’ स्वाभाविक है।
