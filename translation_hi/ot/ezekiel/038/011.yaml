  text: and you will say[a], ‘I will go up against a land of unwalled villages; I will come against those who are at rest, who dwell securely, all of them dwelling without walls[d][c][b], and having no bars or gates.’
translation:
  language: hi
  text: और तू कहेगा, ‘मैं बिना शहरपनाह वाली बस्तियों के देश पर चढ़ाई करूँगा; मैं उन लोगों के विरुद्ध आऊँगा जो चैन से रहते हैं और सुरक्षित बसे हैं। वे सब बिना शहरपनाह के रहते हैं[a]; उनके पास न बेंड़े[b] हैं, न दरवाज़े।’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “वे सब बिना दीवार के रहते हैं”; यहाँ दीवार से आशय बस्ती की रक्षात्मक शहरपनाह है।
    reason: lexical_alternative
  - marker: b
    text: अर्थात दरवाज़ों या फाटकों को बंद करने वाले आड़े सुरक्षा-दंड; इब्रानी शब्द का सीधा अर्थ ‘बेंड़े’ या ‘अर्गल’ है।
    reason: lexical_alternative
