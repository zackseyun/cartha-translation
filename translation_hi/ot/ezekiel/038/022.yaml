source:
  edition: WLC
  text: וְ/נִשְׁפַּטְתִּ֥י אִתּ֖/וֹ בְּ/דֶ֣בֶר וּ/בְ/דָ֑ם וְ/גֶ֣שֶׁם שׁוֹטֵף֩ וְ/אַבְנֵ֨י אֶלְגָּבִ֜ישׁ אֵ֣שׁ וְ/גָפְרִ֗ית אַמְטִ֤יר עָלָי/ו֙ וְ/עַל אֲגַפָּ֔י/ו וְ/עַל עַמִּ֥ים רַבִּ֖ים אֲשֶׁ֥ר אִתּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/038/022.yaml
  text: And I will enter into judgment with him by pestilence and bloodshed[a]; and I will rain down on him, on his troops, and on the many peoples who are with him, torrential rain, hailstones, fire[c][b], and sulfur.
translation:
  language: hi
  text: और मैं महामारी और रक्तपात के द्वारा उसका न्याय करूँगा; और उस पर, उसके सैन्य-दलों पर[a], और उसके साथ के बहुत-से लोगों पर मूसलाधार वर्षा, ओले, आग और गंधक[b] बरसाऊँगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उसकी सैन्य टुकड़ियों पर” अथवा “उसकी सेनाओं पर”; इब्रानी शब्द उसके साथ आने वाली सैन्य शक्तियों को सूचित करता है।
    reason: lexical_alternative
  - marker: b
    text: 'परम्परागत अंग्रेज़ी अभिव्यक्ति: “fire and brimstone”; इब्रानी में: “आग और गंधक।”'
    reason: lexical_clarification
lexical_decisions:
- source_word: וְנִשְׁפַּטְתִּי אִתּוֹ
  choice: उसका न्याय करूँगा
  rationale: निफ़अल रूप और אִתּוֹ मिलकर उसके विरुद्ध न्यायिक कार्रवाई करने का भाव देते हैं। हिन्दी में ‘उसका न्याय करूँगा’ कानूनी भाव को स्वाभाविक और स्पष्ट रूप से व्यक्त करता है।
- source_word: בְּדֶבֶר וּבְדָם
  choice: महामारी और रक्तपात के द्वारा
  rationale: דֶּבֶר दैवी दण्ड के रूप में महामारी को और דָּם इस सूची में हिंसक मृत्यु अथवा रक्तपात को सूचित करता है; करणसूचक בְּ को ‘के द्वारा’ से व्यक्त किया गया है।
- source_word: וְגֶשֶׁם שׁוֹטֵף
  choice: मूसलाधार वर्षा
  rationale: यह पद प्रचण्ड, बहा ले जाने वाली वर्षा का चित्र प्रस्तुत करता है। ‘मूसलाधार वर्षा’ आधुनिक हिन्दी में स्वाभाविक है और उसकी तीव्रता बनाए रखती है।
- source_word: וְאַבְנֵי אֶלְגָּבִישׁ
  choice: ओले
  rationale: यह पद ओलों को दर्शाता है; हिन्दी में ‘ओले’ संक्षिप्त, सटीक और स्वाभाविक है।
- source_word: אֵשׁ וְגָפְרִית
  choice: आग और गन्धक
  rationale: दोनों ठोस संज्ञाओं का सीधा अनुवाद रखा गया है, ताकि न्याय की मूर्त छवि बनी रहे और किसी पारम्परिक मुहावरे से अतिरिक्त अर्थ न जुड़े।
- source_word: אַמְטִיר
  choice: बरसाऊँगा
  rationale: हिफ़ईल रूप का कारणवाचक भाव हिन्दी के सकर्मक ‘बरसाऊँगा’ में स्वाभाविक रूप से व्यक्त होता है।
- source_word: אֲגַפָּיו
  choice: उसके सैन्य-दलों
  rationale: सैन्य प्रसंग में यह शब्द गोग के साथ चलने वाले दलों या सैन्य टुकड़ियों को सूचित करता है। ‘सैन्य-दल’ अर्थ स्पष्ट करता है और सेना की संरचना को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: עַמִּים רַבִּים אֲשֶׁר אִתּוֹ
  choice: उसके साथ के बहुत-से लोगों
  rationale: עַמִּים को राजनीतिक राष्ट्रों तक सीमित न करके ‘लोगों’ से प्रस्तुत किया गया है; सम्बन्धवाचक वाक्यांश को सहज हिन्दी में ‘उसके साथ के’ कहा गया है।
theological_decisions:
- issue: न्याय के चित्रण का स्वरूप
  choice: महामारी, रक्तपात, वर्षा, ओले, आग और गन्धक को परमेश्वर के घोषित न्याय के ठोस साधनों के रूप में प्रस्तुत किया गया है।
  alternative: इन सबको अनुवाद में केवल प्रतीकात्मक विपत्तियों के रूप में ढालना।
  rationale: इब्रानी पाठ इन्हें प्रत्यक्ष दैवी न्याय की घोषणा के रूप में रखता है। अनुवाद उसकी ठोस भाषा को बनाए रखता है, पर इन घटनाओं के व्यापक प्रतीकात्मक या भावी अर्थ का निर्णय नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। भविष्यकालीन दैवी घोषणा की दृढ़ता बनाए रखने के लिए ‘करूँगा’ और ‘बरसाऊँगा’ का प्रयोग किया गया है। ‘गन्धक’ मानक हिन्दी वर्तनी है; ‘बहुत-से लोगों’ עַמִּים की सामूहिक बहुवचनता को बिना ‘राष्ट्र’ का राजनीतिक अर्थ थोपे व्यक्त करता है।
