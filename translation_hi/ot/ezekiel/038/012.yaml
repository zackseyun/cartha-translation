  text: לִ/שְׁלֹ֥ל שָׁלָ֖ל וְ/לָ/בֹ֣ז בַּ֑ז לְ/הָשִׁ֨יב יָדְ/ךָ֜ עַל חֳרָב֣וֹת נוֹשָׁבֹ֗ת וְ/אֶל עַם֙ מְאֻסָּ֣ף מִ/גּוֹיִ֔ם עֹשֶׂה֙ מִקְנֶ֣ה וְ/קִנְיָ֔ן יֹשְׁבֵ֖י עַל טַבּ֥וּר הָ/אָֽרֶץ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/038/012.yaml
  text: to seize spoil and to carry off plunder[a], to turn your hand against ruins now inhabited and against a people gathered from the nations, who have acquired livestock and goods, who dwell at the center of the earth.
translation:
  language: hi
  text: लूट का माल छीनने और लूट ले जाने के लिए, अपना हाथ उन उजड़े हुए स्थानों के विरुद्ध मोड़ने के लिए, जो अब आबाद हैं, और उस प्रजा के विरुद्ध जो राष्ट्रों में से इकट्ठी की गई है, जिसने पशुधन और संपत्ति अर्जित की है और जो धरती के केंद्र[a] में रहती है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “धरती की नाभि”; यह धरती, भूमि या देश के मध्य भाग के लिए एक रूपक है।
    reason: शाब्दिक रूपक और אֶרֶץ की भौगोलिक व्यापकता स्पष्ट करना।
lexical_decisions:
- source_word: לִשְׁלֹל שָׁלָל וְלָבֹז בַּז
  choice: लूट का माल छीनने और धन लूटकर ले जाने के लिए
  rationale: दोनों समानांतर क्रियाओं और उनके सजातीय कर्मों का लूटने का तीव्र भाव रखा गया है, पर हिन्दी में अस्वाभाविक दोहराव से बचने के लिए अलग किंतु निकटार्थी अभिव्यक्तियाँ अपनाई गई हैं।
- source_word: לְהָשִׁיב יָדְךָ
  choice: अपना हाथ ... के विरुद्ध बढ़ाने
  rationale: यह मुहावरा किसी लक्ष्य के विरुद्ध अपनी शक्ति या कार्रवाई मोड़ने का भाव देता है। ‘हाथ बढ़ाने’ से शारीरिक रूपक और विरोधात्मक आशय दोनों स्पष्ट रहते हैं।
- source_word: חֳרָבוֹת נוֹשָׁבוֹת
  choice: खंडहरों ... जो अब फिर बस गए हैं
  rationale: यह अनुवाद पूर्व विनाश और वर्तमान पुनर्वास के बीच मूल इब्रानी के तनाव को बनाए रखता है।
- source_word: עַם מְאֻסָּף מִגּוֹיִם
  choice: लोगों ... जो राष्ट्रों में से इकट्ठे किए गए हैं
  rationale: ‘लोगों’ आधुनिक हिन्दी में सामूहिक עם का स्वाभाविक रूप है; कर्मवाच्य मूल पाठ में लोगों के इकट्ठा किए जाने को सुरक्षित रखता है।
- source_word: עֹשֶׂה מִקְנֶה וְקִנְיָן
  choice: जिन्होंने पशुधन और संपत्ति अर्जित की है
  rationale: यहाँ עֹשֶׂה का आशय वस्तुओं को बनाना नहीं, बल्कि धन-संपदा जुटाना या अर्जित करना है। ‘पशुधन’ מִקְנֶה की व्यापकता और ‘संपत्ति’ קִנְיָן का अर्जित अधिकार दर्शाते हैं।
- source_word: יֹשְׁבֵי עַל טַבּוּר הָאָרֶץ
  choice: जो धरती के केंद्र में रहते हैं
  rationale: טַבּוּר का शाब्दिक अर्थ ‘नाभि’ है और यहाँ मध्य या केंद्र के लिए रूपक है। मुख्य पाठ में अर्थ स्पष्ट किया गया है तथा रूपक पादटिप्पणी में सुरक्षित है।
theological_decisions:
- issue: טַבּוּר הָאָרֶץ में रूपकात्मक भूगोल
  choice: धरती के केंद्र
  alternative: धरती की नाभि
  rationale: मुहावरेदार अनुवाद केंद्रीय स्थिति का भाव देता है और शाब्दिक रूप से अनावश्यक ब्रह्मांड-विज्ञान आरोपित नहीं करता; मूल रूपक पादटिप्पणी में दिया गया है।
- issue: הָאָרֶץ का भौगोलिक विस्तार
  choice: धरती
  alternative: देश/भूमि
  rationale: संदर्भ में शब्द ‘भूमि’ या व्यापक ‘धरती’ दोनों का भाव दे सकता है। मुख्य पाठ में व्यापक और पारंपरिक रूप रखा गया है, जबकि पादटिप्पणी इस संभावित विस्तार को स्वीकार करती है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। पद एक उद्देश्य-सूचक वाक्यांश के रूप में पिछले संदर्भ से जुड़ता है। ‘खंडहर जो अब फिर बस गए हैं’ मूल पाठ के जानबूझकर रखे गए विरोधाभास को स्पष्ट और स्वाभाविक हिन्दी में व्यक्त करता है।
