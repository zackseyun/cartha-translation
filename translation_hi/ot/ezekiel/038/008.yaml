base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/038/008.yaml
  text: After many days you will be mustered[a]; in the latter years you will come into a land restored from the sword, gathered from many peoples, onto the mountains of Israel, which had been a continual waste; but it was brought out from the peoples[b], and all of them will dwell securely.
translation:
  language: hi
  text: बहुत दिनों के बाद तुझे जुटाया जाएगा[a]; अन्तिम वर्षों[b] में तू उस देश में आएगा, जिसे तलवार के विनाश से बहाल किया गया है और जिसके लोगों को बहुत-सी जातियों में से इकट्ठा किया गया है—इस्राएल के उन पहाड़ों पर, जो सदा उजाड़ पड़े रहे हैं। उस देश के लोगों को विभिन्न जातियों में से निकालकर लाया गया है, और वे सब निश्चिन्त होकर बसे हुए हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘तुझे बुलाया जाएगा’ अथवा ‘तेरी सुधि ली जाएगी।’ यहाँ इब्रानी क्रिया का अर्थ सम्भवतः किसी अभियान के लिए बुलाकर जुटाना है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से ‘वर्षों के अन्तिम भाग में।’ कुछ अनुवाद इसे ‘अन्तिम दिनों में’ कहते हैं।
    reason: alternative_reading
lexical_decisions:
- source_word: תִּפָּקֵד
  choice: तुझे युद्ध के लिए जुटाया जाएगा
  rationale: निफ़ाल रूप यहाँ आगे होने वाले सैन्य अभियान के संदर्भ में बुलाए या गिने जाने से अधिक युद्ध के लिए एकत्र किए जाने का भाव देता है। ‘युद्ध के लिए’ निहित सैन्य संदर्भ को स्वाभाविक हिन्दी में स्पष्ट करता है।
- source_word: בְּאַחֲרִית הַשָּׁנִים
  choice: अन्तिम वर्षों में
  rationale: इब्रानी में ‘वर्षों का अन्तिम भाग’ है, सामान्य भविष्यद्वाणी-सूत्र ‘अन्तिम दिनों में’ नहीं; इसलिए शब्दगत भेद सुरक्षित रखा गया है।
- source_word: אֶרֶץ מְשׁוֹבֶבֶת מֵחֶרֶב
  choice: वह देश जो तलवार के विनाश से उबरकर फिर बसाया गया है
  rationale: מְשׁוֹבֶבֶת पुनर्स्थापन या वापस लाए जाने का भाव रखता है; ‘तलवार’ युद्धजनित विनाश का लाक्षणिक संकेत है। यह हिन्दी उस पुनर्बहाली को स्वाभाविक ढंग से व्यक्त करती है।
- source_word: מְקֻבֶּצֶת מֵעַמִּים רַבִּים
  choice: जिसके लोग बहुत-सी जातियों में से इकट्ठे किए गए हैं
  rationale: व्याकरण में स्त्रीलिंग कृदन्त ‘देश’ से जुड़ा है, पर ‘जातियों में से इकट्ठा किया जाना’ देश की जनसंख्या को इंगित करता है। हिन्दी में ‘जिसके लोग’ कहने से अर्थ स्पष्ट होता है, बिना किसी विशेष जातीय-धार्मिक व्याख्या को आरोपित किए।
- source_word: עַל הָרֵי יִשְׂרָאֵל
  choice: इस्राएल के पहाड़ों पर
  rationale: गति-सूचक תָּבוֹא के साथ עַל गन्तव्य की ओर या उसके ऊपर आने का भाव देता है। ‘पहाड़ों पर आएगा’ आधुनिक हिन्दी में स्वाभाविक है और आक्रमण की दिशा भी बनाए रखता है।
- source_word: אֲשֶׁר הָיוּ לְחָרְבָּה תָּמִיד
  choice: जो लगातार उजाड़ पड़े थे
  rationale: תָּמִיד यहाँ उजाड़ अवस्था की दीर्घ निरन्तरता बताता है। ‘लगातार उजाड़ पड़े थे’ हिन्दी में इस अवधि को व्यक्त करता है, जबकि अनिवार्यतः अनन्त उजाड़ का अर्थ नहीं थोपता।
- source_word: וְהִיא מֵעַמִּים הוּצָאָה
  choice: उस देश के लोगों को जाति-जाति के लोगों में से निकालकर लाया गया है
  rationale: मूल में स्त्रीलिंग ‘वह’ देश को संदर्भित करता है, जबकि लोगों में से निकाले जाने और अगले बहुवचन वाक्य के कारण आशय देश के निवासियों से है। हिन्दी में संदर्भ स्पष्ट किया गया है।
- source_word: וְיָשְׁבוּ לָבֶטַח כֻּלָּם
  choice: वे सब सुरक्षित बसे हुए हैं
  rationale: ישׁב לָבֶטַח सुरक्षित और निश्चिन्त रूप से बसे होने की प्रचलित अभिव्यक्ति है। प्रसंग आक्रमण के समय लोगों की विद्यमान अवस्था बताता है; इसलिए हिन्दी वर्तमान परिणामी अवस्था को व्यक्त करती है।
theological_decisions:
- issue: अन्त-काल संबंधी कालवाचक पद
  choice: अन्तिम वर्षों में
  alternative: अन्तिम दिनों में
  rationale: मूल पाठ הַשָּׁנִים ‘वर्षों’ कहता है। अधिक परिचित ‘अन्तिम दिनों’ को अपनाने से यह पद अन्य भविष्यद्वाणी-सूत्रों के साथ अनावश्यक रूप से मिला दिया जाता।
- issue: सुरक्षित निवास की कालगत स्थिति
  choice: वे सब सुरक्षित बसे हुए हैं
  alternative: वे सब सुरक्षित बसेंगे
  rationale: इब्रानी पूर्ण रूप को इस प्रसंग में गोग के आने के समय विद्यमान परिणामी अवस्था के रूप में पढ़ा गया है। भविष्यकाल भी व्यापक भविष्यद्वाणी-संदर्भ में सम्भव है, पर निकट प्रसंग वर्तमान सुरक्षित बसावट को लक्ष्य बनाता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। सैन्य संदर्भ में ‘युद्ध के लिए जुटाया जाएगा’ तथा पुनर्बहाली के लिए ‘उबरकर फिर बसाया गया’ स्वाभाविक हिन्दी देते हैं। मूल के देश और उसके लोगों के बीच व्याकरणिक-अर्थगत बदलाव को स्पष्ट करने के लिए ‘जिसके लोग’ और ‘उस देश के लोगों’ का प्रयोग किया गया है।
