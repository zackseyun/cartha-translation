- source_word: לֵאמֹר
  choice: उसने कहा
  rationale: यह infinitive construct आगे आने वाली प्रत्यक्ष ईश्वरीय वाणी का परिचय देता है। हिन्दी में ‘उसने कहा’ अर्थ और वाक्य-प्रवाह को स्वाभाविक रूप से व्यक्त करता है।
