  text: וְ/שׁ֣וֹבַבְתִּ֔י/ךָ וְ/נָתַתִּ֥י חַחִ֖ים בִּ/לְחָיֶ֑י/ךָ וְ/הוֹצֵאתִי֩ אוֹתְ/ךָ֨ וְ/אֶת כָּל חֵילֶ֜/ךָ סוּסִ֣ים וּ/פָרָשִׁ֗ים לְבֻשֵׁ֤י מִכְלוֹל֙ כֻּלָּ֔/ם קָהָ֥ל רָב֙ צִנָּ֣ה וּ/מָגֵ֔ן תֹּפְשֵׂ֥י חֲרָב֖וֹת כֻּלָּֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/038/004.yaml
  text: I will turn you around[a], put hooks in your jaws, and bring you out—you and all your army, horses and horsemen, all of them clothed in full armor, a great assembly with shield and buckler[b], all of them wielding swords.
translation:
  language: hi
  text: मैं तुझे घुमा दूँगा, तेरे जबड़ों[a] में काँटे डालूँगा, और तुझे तथा तेरी सारी सेना को बाहर ले आऊँगा—घोड़े और घुड़सवार, जो सब-के-सब पूरे युद्ध-साज से सुसज्जित होंगे; एक विशाल जनसमूह, जो बड़ी और छोटी ढालों[b] से सुसज्जित होगा, और जो सब-के-सब तलवारें थामे होंगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘तेरे गालों में।’
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में यहाँ दो अलग प्रकार की ढालों के शब्द हैं—संभवतः एक बड़ी और दूसरी छोटी ढाल।
    reason: cultural_note
lexical_decisions:
- source_word: וְשׁוֹבַבְתִּיךָ
  choice: मैं तुझे घुमाकर लौटा दूँगा
  rationale: क्रिया गोग को परमेश्वर द्वारा मोड़ने अथवा वापस फेरने का बोध देती है। यह अनुवाद दिशा-परिवर्तन और प्रबल दैवी सक्रियता दोनों को बनाए रखता है, बिना मार्ग या गंतव्य तय किए।
- source_word: חַחִים בִּלְחָיֶיךָ
  choice: तेरे जबड़ों में अंकुश
  rationale: חַחִים नियंत्रण के लिए लगाए जाने वाले काँटेदार अंकुशों अथवा छल्लों को दर्शाता है; לחי का अर्थ जबड़ा या गाल हो सकता है। पशु अथवा बंदी को नियंत्रित करने के बिंब में ‘जबड़ों में अंकुश’ स्वाभाविक और सजीव हिन्दी है।
- source_word: וְהוֹצֵאתִי אוֹתְךָ
  choice: तुझे ... बाहर निकाल लाऊँगा
  rationale: हिफ़ील रूप स्पष्ट रूप से कर्ता द्वारा बाहर लाने को व्यक्त करता है; हिन्दी पदबंध परमेश्वर की सक्रिय भूमिका बनाए रखता है।
- source_word: חֵילֶךָ
  choice: तेरी सारी सेना
  rationale: इस युद्ध-संदर्भ में חַיִל धन या पराक्रम के बजाय सैनिक बल को दर्शाता है।
- source_word: סוּסִים וּפָרָשִׁים
  choice: घोड़े और घुड़सवार
  rationale: मूल के दोहरे सैन्य पद को संक्षिप्त ‘घुड़सवार सेना’ में विलीन किए बिना सीधे रूप में रखा गया है।
- source_word: לְבֻשֵׁי מִכְלוֹל
  choice: पूरे युद्ध-साज से सुसज्जित
  rationale: מִכְלוֹל की व्याख्या पूर्ण पोशाक, सजावट या संपूर्ण साज के रूप में हो सकती है। निकटवर्ती सैन्य संदर्भ युद्ध के पूरे साज-सामान की ओर संकेत करता है; ‘कवच’ कहने से बचकर संभावित अर्थ को अनावश्यक रूप से संकीर्ण नहीं किया गया।
- source_word: קָהָל רָב
  choice: एक विशाल जनसमूह
  rationale: קָהָל एक एकत्रित समूह है और רָב यहाँ उसके बड़े आकार को बताता है; प्रसंग से यह सैन्य जमावड़ा है, पर मूल का व्यापक सामूहिक शब्द सुरक्षित रखा गया है।
- source_word: צִנָּה וּמָגֵן
  choice: बड़ी और छोटी ढालें
  rationale: दो इब्रानी शब्द सामान्यतः बड़े शरीर-रक्षक कवच और अपेक्षाकृत छोटी ढाल के बीच भेद करते हैं। आधुनिक हिन्दी में आकार का भेद स्पष्ट करना पुरातन तकनीकी शब्दावली से अधिक बोधगम्य है।
- source_word: תֹּפְשֵׂי חֲרָבוֹת
  choice: तलवारें थामे हुए
  rationale: תפש का मूल भाव पकड़ना या हाथ में लेना है। ‘थामे हुए’ युद्ध के लिए तत्परता बताता है, पर सक्रिय प्रहार का अतिरिक्त अर्थ नहीं जोड़ता।
- source_word: כֻּלָּם
  choice: वे सब-के-सब
  rationale: मूल में दो बार आए बलाघात को दोनों स्थानों पर बनाए रखा गया है।
theological_decisions:
- issue: गोग की सैन्य लामबंदी में परमेश्वर की सक्रियता
  choice: 'प्रथम पुरुष की सक्रिय और कारणवाचक क्रियाएँ रखी गई हैं: ‘घुमाकर लौटा दूँगा’, ‘अंकुश डालूँगा’, ‘बाहर निकाल लाऊँगा’।'
  alternative: इसे केवल अनुमति के अर्थ में प्रस्तुत करना—‘मैं तुझे आने दूँगा’।
  rationale: इब्रानी वाक्य परमेश्वर को गोग को मोड़ने, नियंत्रित करने और बाहर लाने वाले सक्रिय कर्ता के रूप में प्रस्तुत करता है। अनुवाद इस दैवी सक्रियता और गोग के अपने इरादे के बीच तनाव को समझाकर समाप्त नहीं करता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। एकवचन संबोधन में ‘तू/तेरा’ का भविष्यवाणी-संबंधी सीधा रूप है। ‘अंकुश’, ‘युद्ध-साज’ और ‘सब-के-सब’ सजीव सैन्य बिंब तथा मूल के बलाघात को बनाए रखते हैं।
