  yaml_path: translation/ot/ezekiel/038/009.yaml
  text: You will come up like a storm; you will be like a cloud covering the land—you and all your troops, and many peoples with you.
translation:
  language: hi
  text: तू चढ़ आएगा, आँधी के समान आएगा; तू देश को ढकनेवाले बादल के समान होगा—तू, तेरे सारे दल और तेरे साथ अनेक जनसमूह।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כַשֹּׁאָה
  choice: आँधी के समान
  rationale: שׁוֹאָה यहाँ अचानक और प्रचंड तूफ़ानी आक्रमण का बिंब है; ‘आँधी’ आधुनिक हिन्दी में इसे स्वाभाविक और सजीव रूप से व्यक्त करती है।
- source_word: אֲגַפֶּיךָ
  choice: तेरे सारे दल
  rationale: אֲגַפִּים का मूल संकेत पंखों/पार्श्वों से है, पर सैन्य संदर्भ में यह सेना के दलों या टुकड़ियों को दर्शाता है; ‘दल’ अर्थ को स्पष्ट रखते हुए अनावश्यक विशिष्टता से बचता है।
- source_word: עַמִּים רַבִּים
  choice: बहुत-से लोग
  rationale: עַמִּים बहुवचन में विभिन्न जनसमूहों/जातियों को सूचित कर सकता है; यहाँ गोग के साथ आने वाले अनेक लोगों का सामूहिक उल्लेख है।
theological_decisions:
- issue: तूफ़ान और बादल के दो समानांतर बिंबों का संबंध
  choice: ‘आँधी के समान आएगा; ... बादल के समान होगा’
  alternative: ‘आँधी के समान चढ़ आएगा और बादल के समान देश को ढक लेगा’
  rationale: 'हिब्रू के תָבוֹא और תִהְיֶה के भेद को बनाए रखा गया है: पहले आने की तीव्रता, फिर देश को ढकते बादल जैसी व्यापक उपस्थिति। इससे किसी विशेष पहचान या घटनाक्रम को पाठ में आयात नहीं किया जाता।'
translation_notes:
  register: आधुनिक मानक हिन्दी का सीधा, गरिमापूर्ण और भविष्यवाणी-संदर्भ के अनुकूल संबोधन। एकवचन अनौपचारिक ‘तू’ हिब्रू के प्रत्यक्ष एकवचन संबोधन को सुरक्षित रखता है; वाक्य की पुनरुक्ति मूल की काव्यात्मक समानांतरता बनाए रखती है।
