reference: Ezekiel 18:2
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: מַה לָּ/כֶ֗ם אַתֶּם֙ מֹֽשְׁלִים֙ אֶת הַ/מָּשָׁ֣ל הַ/זֶּ֔ה עַל אַדְמַ֥ת יִשְׂרָאֵ֖ל לֵ/אמֹ֑ר אָבוֹת֙ יֹ֣אכְלוּ בֹ֔סֶר וְ/שִׁנֵּ֥י הַ/בָּנִ֖ים תִּקְהֶֽינָה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/018/002.yaml
  text: What do you mean, that you keep repeating this proverb in the land of Israel[a], saying, ‘The fathers eat sour grapes, and the children’s teeth are set on edge’?”
translation:
  language: hi
  text: “तुम्हें क्या हुआ है कि तुम इस्राएल देश में यह कहावत बार-बार कहते हो, ‘पिता खट्टे अंगूर खाते हैं, और बच्चों[a] के दाँत सुन्न हो जाते हैं[b]’?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से “बेटों”। यहाँ इसका आशय संतान से हो सकता है।
    reason: शाब्दिक लिंगसूचक रूप और प्रसंगगत व्यापक अर्थ दोनों को सुरक्षित रखना।
  - marker: b
    text: या, “दाँत कुंद पड़ जाते हैं” अथवा “झनझना उठते हैं।”
    reason: इब्रानी क्रिया खट्टे अंगूरों से दाँतों में होने वाली अप्रिय सुन्नता या संवेदना को व्यक्त करती है; हिन्दी में इसका एकमात्र पूर्ण समानार्थी मुहावरा नहीं है।
lexical_decisions:
- source_word: מַה לָּכֶם
  choice: तुम लोग ... क्यों
  rationale: यह इब्रानी मुहावरा श्रोताओं के व्यवहार पर डाँट-भरा प्रश्न उठाता है। आधुनिक हिन्दी में ‘क्यों’ उस चुनौती को स्वाभाविक और स्पष्ट रूप से व्यक्त करता है।
- source_word: מֹשְׁלִים
  choice: बार-बार ... कहते हो
  rationale: यहाँ משל का अर्थ कहावत बोलना या दुहराना है। कृदन्त रूप प्रचलित अथवा लगातार किए जा रहे व्यवहार को दर्शाता है, जिसे ‘बार-बार’ स्पष्ट करता है।
- source_word: הַמָּשָׁל הַזֶּה
  choice: यह कहावत
  rationale: इस प्रसंग में מָשָׁל कथा-दृष्टान्त नहीं, बल्कि लोक में प्रचलित संक्षिप्त उक्ति है; इसलिए ‘कहावत’ सर्वाधिक सटीक है।
- source_word: עַל אַדְמַת יִשְׂרָאֵל
  choice: इस्राएल देश में
  rationale: אַדְמָה का मूल अर्थ भूमि या मिट्टी है, पर यहाँ पदबंध उस क्षेत्र को सूचित करता है जहाँ यह कहावत प्रचलित थी। ‘इस्राएल देश में’ स्वाभाविक हिन्दी है और प्रसंगानुकूल अर्थ देता है।
- source_word: אָבוֹת
  choice: पिता
  rationale: इब्रानी शब्द स्पष्ट रूप से पिताओं को दर्शाता है; कहावत की पीढ़ीगत तुलना बनाए रखने के लिए ‘पिता’ रखा गया है।
- source_word: יֹאכְלוּ בֹסֶר
  choice: खट्टे अंगूर खाते हैं
  rationale: בֹסֶר कच्चे और फलतः खट्टे अंगूरों को सूचित करता है। अपूर्ण क्रिया को कहावत के सामान्य वर्तमान के रूप में अनूदित किया गया है।
- source_word: שִׁנֵּי הַבָּנִים
  choice: बच्चों के दाँत
  rationale: בָּנִים का शाब्दिक अर्थ ‘बेटे’ है, पर पीढ़ीगत कहावत में यह संतान का प्रतिनिधिक अर्थ रख सकता है। ‘बच्चों’ से यह व्यापक अर्थ स्वाभाविक हिन्दी में आता है; शाब्दिक रूप पादटिप्पणी में दिया गया है।
- source_word: תִּקְהֶינָה
  choice: कुंद हो जाते हैं
  rationale: क्रिया खट्टे फल के कारण दाँतों में आने वाली सुन्नता, संवेदनहीनता या धार घटने जैसे अनुभव को व्यक्त करती है। ‘कुंद हो जाते हैं’ मूल बिंब को बनाए रखता है और हिन्दी के ‘दाँत खट्टे करना’ वाले अलग मुहावरे से अनावश्यक भ्रम घटाता है।
theological_decisions:
- issue: कहावत में लिंगसूचक पारिवारिक शब्द
  choice: אָבוֹת के लिए ‘पिता’ और בָּנִים के लिए ‘बच्चे’
  alternative: ‘पिता ... बेटों के दाँत’
  rationale: पहला शब्द पिताओं के लिए स्पष्ट रूप से पुरुषवाची है, जबकि दूसरा इस पीढ़ीगत कहावत में समस्त संतान का प्रतिनिधित्व कर सकता है। पादटिप्पणी शाब्दिक ‘बेटों’ को सुरक्षित रखती है और पाठ में व्यापक आशय को व्यक्त करती है।
- issue: पूर्वजों के कर्म और अगली पीढ़ी के परिणाम के विषय में कहावत का दावा
  choice: कहावत को उद्धरण के रूप में बिना व्याख्यात्मक संशोधन के रखा गया है
  alternative: कहावत में ही उसके दावे को अस्वीकार करने वाला स्पष्टीकरण जोड़ना
  rationale: यह पद लोगों की प्रचलित कहावत उद्धृत करता है; उसके धर्मवैचारिक मूल्यांकन को अगले पदों पर छोड़ना मूल पाठ की तनावपूर्ण संरचना को सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक, सामान्य और गरिमापूर्ण रखी गई है। ‘बार-बार’ जारी या प्रचलित व्यवहार को स्पष्ट करता है। ‘दाँत कुंद हो जाते हैं’ मूल बिंब के निकट है और हिन्दी के अलग अर्थ वाले प्रचलित मुहावरे ‘दाँत खट्टे करना’ से दूरी बनाए रखता है।
