  text: “मेरे जीवन की शपथ,” प्रभु याहवे की घोषणा है, “तुम इस्राएल में इस कहावत का फिर कभी प्रयोग नहीं करोगे।[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इब्रानी में शपथ-वाक्य शब्दशः है: “यदि यह कहावत आगे भी इस्राएल में तुम्हारे लिए रहे।” शपथ के इस मुहावरे में निहित निषेध का भाव है: “तुम इस्राएल में इस कहावत का फिर कभी प्रयोग नहीं करोगे।”'
    reason: lexical_alternative
lexical_decisions:
- source_word: חַי אָ֕נִי
  choice: मेरे जीवन की शपथ
  rationale: यह इब्रानी की गंभीर शपथ-विधि है। यह हिन्दी में स्वाभाविक ढंग से परमेश्वर के अपने जीवन की शपथ लेने का बल व्यक्त करती है।
- source_word: נְאֻ֖ם
  choice: यह घोषणा है
  rationale: भविष्यद्वक्ताओं में प्रयुक्त अधिकारपूर्ण वाणी-सूत्र को आधुनिक, गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: אֲדֹנָ֣י יְהוִ֑ה
  choice: प्रभु यहोवा
  rationale: संयुक्त उपाधि में אֲדֹנָי को ‘प्रभु’ और वाचा के नाम יהוה को ‘यहोवा’ रखा गया है, जिससे दोनों अलग-अलग बने रहते हैं।
- source_word: אִם יִֽהְיֶ֨ה
  choice: फिर कभी ... नहीं करोगे
  rationale: शपथ-वाक्य में אִם निहित निषेध व्यक्त करता है; सीधे हिन्दी निषेध से उसका आशय स्पष्ट होता है।
- source_word: לָכֶ֜ם
  choice: तुम ... करोगे
  rationale: संदर्भ में यह कहावत के लोगों के बीच प्रचलन और उनके द्वारा उपयोग को सूचित करता है। हिन्दी में कर्तृवाच्य संबोधन स्वाभाविक है।
- source_word: ע֗וֹד
  choice: अब ... फिर कभी
  rationale: शपथ से निषेधित भविष्य के साथ यह आगे से उपयोग पूर्णतः बंद होने का भाव देता है।
- source_word: מְשֹׁ֛ל
  choice: इस्तेमाल करोगे
  rationale: यहाँ क्रिया किसी कहावत को बोलने, उद्धृत करने या व्यवहार में लाने को दर्शाती है; ‘इस्तेमाल करना’ इन अर्थों को व्यापक रूप से समेटता है।
- source_word: הַמָּשָׁ֥ל הַזֶּ֖ה
  choice: इस कहावत को
  rationale: מָשָׁל यहाँ लोगों में प्रचलित लोकोक्ति है; ‘कहावत’ आधुनिक हिन्दी में सबसे उपयुक्त है।
- source_word: בְּיִשְׂרָאֵֽל
  choice: इस्राएल में
  rationale: कहावत के प्रचलन का स्थान और सामाजिक क्षेत्र दोनों सहज रूप से व्यक्त होते हैं।
theological_decisions:
- issue: אֲדֹנָי יְהוִה में दिव्य नाम का अनुवाद
  choice: प्रभु यहोवा
  alternative: प्रभु परमेश्वर
  rationale: मूल पाठ स्पष्ट रूप से वाचा का व्यक्तिगत नाम יהוה रखता है। ‘यहोवा’ उसे सामान्य पदवी ‘परमेश्वर’ में विलीन किए बिना पारंपरिक हिन्दी रूप में सुरक्षित रखता है।
- issue: दिव्य शपथ में אִם की निहित नकारात्मकता
  choice: अब ... फिर कभी नहीं करोगे
  alternative: यदि यह कहावत आगे भी तुम्हारे लिए रहे
  rationale: इब्रानी शपथ-विधि का शाब्दिक रूप अधूरा शर्त-वाक्य है, पर उसका प्रचलित अर्थ दृढ़ निषेध है। मुख्य पाठ में आशय दिया गया और पादटिप्पणी में मूल मुहावरे की बनावट सुरक्षित रखी गई है।
