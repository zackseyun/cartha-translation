source:
  edition: WLC
  text: וְ/אָֽמְרוּ֙ בֵּ֣ית יִשְׂרָאֵ֔ל לֹ֥א יִתָּכֵ֖ן דֶּ֣רֶךְ אֲדֹנָ֑/י הַ/דְּרָכַ֞/י לֹ֤א יִתָּֽכְנּוּ֙ בֵּ֣ית יִשְׂרָאֵ֔ל הֲ/לֹ֥א דַרְכֵי/כֶ֖ם לֹ֥א יִתָּכֵֽן׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/018/029.yaml
  text: Yet the house of Israel says[a], ‘The way of the Lord is not just.’ Are my ways not just, O house of Israel? Is it not your ways that are not just?
translation:
  language: hi
  text: फिर भी इस्राएल का घराना कहता है[a], “प्रभु का मार्ग न्यायपूर्ण नहीं है।” हे इस्राएल के घराने, क्या मेरे मार्ग न्यायपूर्ण नहीं हैं? क्या तुम्हारे ही मार्ग न्यायपूर्ण नहीं हैं?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “प्रभु का मार्ग उचित नहीं है,” “सही नहीं है,” या “न्यायसंगत नहीं है।” इब्रानी क्रिया का मूल भाव ठीक मापे या व्यवस्थित किए जाने से जुड़ा है; यहाँ वह प्रभु के व्यवहार की नैतिक न्यायशीलता को दर्शाती है।
    reason: प्रमुख नैतिक शब्द के सम्भव अनुवाद स्पष्ट करना
lexical_decisions:
- source_word: וְאָמְרוּ
  choice: फिर भी ... कहता है
  rationale: संयोजक वाव के साथ पूर्ण क्रिया यहाँ पहले से चल रही आपत्ति को आगे रखती है। संदर्भ में विरोधसूचक भाव होने के कारण ‘फिर भी’ स्वाभाविक है; सामूहिक संज्ञा ‘घराना’ के अनुसार एकवचन ‘कहता है’ रखा गया है।
- source_word: בֵּית יִשְׂרָאֵל
  choice: इस्राएल का घराना
  rationale: यह इस्राएल को एक सामूहिक समुदाय के रूप में संबोधित करने वाली इब्रानी अभिव्यक्ति को सुरक्षित रखता है और केवल ‘इस्राएल’ कहकर उसके रूपक को समतल नहीं करता।
- source_word: לֹא יִתָּכֵן
  choice: न्यायपूर्ण नहीं है/हैं
  rationale: निफ़अल रूप यहाँ ठीक मापे, व्यवस्थित या नैतिक रूप से उचित होने का भाव देता है। इस न्याय-विवाद के संदर्भ में ‘न्यायपूर्ण’ परमेश्वर के व्यवहार की नैतिक और न्यायिक शुद्धता को स्पष्ट करता है।
- source_word: דֶּרֶךְ / דְּרָכַי / דַרְכֵיכֶם
  choice: मार्ग / मेरे मार्ग / तुम्हारे मार्ग
  rationale: ‘मार्ग’ प्रभु के कार्य करने के ढंग और लोगों के आचरण—दोनों के लिए स्वाभाविक है तथा पद में दोहराए गए शब्द और उसके विरोधात्मक शब्द-खेल को बनाए रखता है।
- source_word: אֲדֹנָי
  choice: प्रभु
  rationale: यह इस दिव्य उपाधि का स्वाभाविक और प्रतिष्ठित हिन्दी रूप है।
- source_word: הֲלֹא
  choice: क्या ... नहीं ...? / क्या ... ही ... नहीं ...?
  rationale: इसे सहमति की अपेक्षा करने वाले आलंकारिक प्रश्न के रूप में रखा गया है। अंतिम प्रश्न में ‘ही’ प्रभु के मार्गों और लोगों के मार्गों के बीच इब्रानी के तीखे विरोध को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: परमेश्वर के व्यवहार के नैतिक मूल्यांकन का शब्द
  choice: तीनों स्थलों पर יִתָּכֵן को ‘न्यायपूर्ण’ से व्यक्त करना
  alternative: ‘उचित’, ‘सही’ या ‘न्यायसंगत’
  rationale: अध्याय का विवाद इस बात पर केंद्रित है कि प्रभु का व्यवहार नैतिक रूप से सीधा और निष्पक्ष है या नहीं। ‘न्यायपूर्ण’ न्यायिक-नैतिक बल को बनाए रखता है, और तीनों प्रयोगों में एक ही शब्द रखने से आरोप तथा प्रत्युत्तर की समरूपता सुरक्षित रहती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘इस्राएल का घराना’ सामूहिक संबोधन को सुरक्षित रखता है; ‘मार्ग’ की पुनरावृत्ति मूल की अलंकारिक समरूपता बनाए रखती है।
