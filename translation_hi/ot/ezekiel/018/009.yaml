base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/018/009.yaml
  text: He walks in my statutes and keeps my judgments[a], acting faithfully; he is righteous; he shall surely live, declares the Lord GOD.
translation:
  language: hi
  text: वह मेरी विधियों के अनुसार चलता है, मेरे न्याय-विधानों का पालन करता है और सत्यनिष्ठा से आचरण करता है[a]। वह धर्मी है; वह निश्चय ही जीवित रहेगा—प्रभु याहवे की यह घोषणा है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “सत्य करने के लिए”; अर्थात सत्यनिष्ठा या विश्वासयोग्यता से आचरण करना।
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּחֻקּוֹתַי
  choice: मेरी विधियों पर
  rationale: חֻקּוֹת परमेश्वर द्वारा ठहराई गई विधियों या आदेशों को दर्शाता है। ‘पर चलना’ मूल इब्रानी जीवन-आचरण के रूपक को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: יְהַלֵּךְ
  choice: चलता है
  rationale: הלך यहाँ जीवन बिताने या आचरण करने का रूपक है; ‘चलता है’ उस रूपक को सुरक्षित रखता है और हिन्दी बाइबलीय शैली में सुबोध है।
- source_word: וּמִשְׁפָּטַי
  choice: मेरे न्याय-विधानों
  rationale: מִשְׁפָּטִים में न्यायिक निर्णयों और बाध्यकारी नियमों का भाव है। ‘न्याय-विधान’ कानूनी और नैतिक दोनों पक्षों को व्यक्त करता है।
- source_word: שָׁמַר
  choice: पालन करता है
  rationale: विधि-संबंधी प्रसंग में שׁמר का अर्थ किसी आदेश को मानना और उसका पालन करना है; हिन्दी में ‘पालन करना’ स्वाभाविक है।
- source_word: לַעֲשׂוֹת אֱמֶת
  choice: सच्चाई से काम करता है
  rationale: शब्दशः वाक्यांश ‘सत्य करना’ है, पर इस प्रसंग में אֱמֶת सत्यनिष्ठा, विश्वसनीयता या विश्वासयोग्यता को सूचित करता है। मुख्य पाठ नैतिक आचरण का भाव देता है और पादटिप्पणी मूल अभिव्यक्ति की व्यापकता सुरक्षित रखती है।
- source_word: צַדִּיק
  choice: धर्मी
  rationale: צַדִּיק वाचा, न्याय और नैतिक आचरण से जुड़ा प्रमुख शब्द है; ‘धर्मी’ उसका प्रचलित और अर्थपूर्ण हिन्दी समतुल्य है।
- source_word: חָיֹה יִחְיֶה
  choice: निश्चय ही जीवित रहेगा
  rationale: क्रिया के साथ infinitive absolute निश्चितता और बल व्यक्त करता है; ‘निश्चय ही’ उसी जोर को स्पष्ट रूप से दर्शाता है।
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: प्रभु याहवे की यह घोषणा है
  rationale: נְאֻם एक गंभीर ईश्वरीय घोषणा का सूत्र है। אֲדֹנָי को ‘प्रभु’ और יהוה को व्यक्तिगत वाचा-नाम ‘याहवे’ के रूप में रखा गया है।
theological_decisions:
- issue: אֲדֹנָי יְהוִה में परमेश्वर के नाम का अनुवाद
  choice: प्रभु याहवे
  alternative: प्रभु यहोवा; प्रभु परमेश्वर
  rationale: मूल पाठ में उपाधि אֲדֹנָי के बाद वाचा-नाम יהוה है। ‘प्रभु याहवे’ उपाधि और व्यक्तिगत नाम के भेद को बनाए रखता है।
- issue: חָיֹה יִחְיֶה में जीवन की प्रतिज्ञा का आशय
  choice: वह निश्चय ही जीवित रहेगा
  alternative: वह निश्चय जीवन पाएगा; वह अवश्य जीवित बना रहेगा
  rationale: अनुवाद इब्रानी की प्रबल निश्चितता को बनाए रखता है, पर इस पद में ‘जीवन’ को केवल शारीरिक आयु या बाद के धर्मवैज्ञानिक अर्थ में सीमित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य हिन्दी पाठक के लिए सुबोध रखी गई है। ‘चलता है’ मूल जीवन-आचरण रूपक को बनाए रखता है, जबकि ‘पालन करता है’ और ‘सच्चाई से काम करता है’ स्वाभाविक हिन्दी देते हैं।
