base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/018/005.yaml
  text: But if a man is righteous and does justice and righteousness,[a]
translation:
  language: hi
  text: पर[a] यदि कोई पुरुष धर्मी हो और न्याय तथा धार्मिकता करे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अब यदि कोई पुरुष”; अथवा, “और यदि कोई पुरुष।” इब्रानी संयोजक केवल क्रम जारी रखने के साथ-साथ विरोधसूचक मोड़ भी दिखा सकता है।
    reason: आरम्भिक וְ के सम्भव प्रवचनात्मक अर्थों को सुरक्षित रखना।
lexical_decisions:
- source_word: וְ/אִישׁ
  choice: पर यदि कोई पुरुष
  rationale: אִישׁ का अर्थ यहाँ एकवचन पुल्लिंग ‘पुरुष’ है; उसे बनाए रखा गया है। आरम्भिक וְ को प्रसंग में तर्क के नए, किंचित विरोधसूचक मोड़ के रूप में ‘पर’ कहा गया है।
- source_word: כִּי
  choice: यदि
  rationale: अपूर्ण क्रिया के साथ यह सामान्य शर्त प्रस्तुत करता है; इसलिए आधुनिक हिन्दी में ‘यदि’ स्वाभाविक है।
- source_word: יִהְיֶה
  choice: हो
  rationale: היה के अपूर्ण रूप को सामान्य शर्त में हिन्दी के संभावनार्थक ‘हो’ से व्यक्त किया गया है।
- source_word: צַדִּיק
  choice: धर्मी
  rationale: यह शब्द नैतिक और वाचा-संबंधी सही आचरण वाले व्यक्ति को दर्शाता है; ‘धर्मी’ इस अर्थ को संक्षेप और गरिमा से रखता है।
- source_word: וְ/עָשָׂה
  choice: और ... के काम करे
  rationale: עשה का मूल अर्थ ‘करना’ है। हिन्दी में दोनों भाववाचक संज्ञाओं के साथ ‘के काम करे’ वाक्य को स्वाभाविक बनाता और ठोस आचरण पर बल बनाए रखता है।
- source_word: מִשְׁפָּט
  choice: न्याय
  rationale: इस नैतिक युग्म में מִשְׁפָּט न्यायपूर्ण निर्णय और व्यवहार को सूचित करता है; ‘न्याय’ इसका स्पष्ट आधुनिक समतुल्य है।
- source_word: וּ/צְדָקָה
  choice: धार्मिकता
  rationale: צְדָקָה को ‘धार्मिकता’ कहने से उसे מִשְׁפָּט ‘न्याय’ में मिला देने के बजाय इब्रानी के दो अलग पद सुरक्षित रहते हैं।
theological_decisions:
- issue: प्रतिनिधिक पुल्लिंग एकवचन
  choice: कोई पुरुष
  alternative: कोई व्यक्ति
  rationale: इब्रानी אִישׁ स्पष्ट रूप से पुल्लिंग एकवचन है। अनुवाद इसे ‘पुरुष’ के रूप में सुरक्षित रखता है, जबकि ‘कोई’ बताता है कि यह एक प्रतिनिधिक उदाहरण है।
translation_notes:
  register: आधुनिक मानक हिन्दी, देवनागरी; भाषा सहज पर गरिमापूर्ण है। ‘न्याय तथा धार्मिकता के काम करे’ इब्रानी के दोनों नैतिक पदों का भेद रखते हुए हिन्दी में स्वाभाविक अभिव्यक्ति देता है।
