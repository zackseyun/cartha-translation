source:
  edition: WLC
  text: וְ/הָ/רָשָׁ֗ע כִּ֤י יָשׁוּב֙ מִ/כָּל חטאת/ו אֲשֶׁ֣ר עָשָׂ֔ה וְ/שָׁמַר֙ אֶת כָּל חֻקּוֹתַ֔/י וְ/עָשָׂ֥ה מִשְׁפָּ֖ט וּ/צְדָקָ֑ה חָיֹ֥ה יִחְיֶ֖ה לֹ֥א יָמֽוּת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/018/021.yaml
  text: But if the wicked man turns back from all his sins that he has committed[a], and keeps all my statutes, and does justice and righteousness, he shall surely live; he shall not die.
translation:
  language: hi
  text: परन्तु यदि दुष्ट मनुष्य अपने किए हुए सभी पापों से फिर जाए[a], मेरी सभी विधियों का पालन करे, और न्याय और धार्मिकता के काम करे, तो वह निश्चय ही जीवित रहेगा; वह नहीं मरेगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “पश्चाताप करे”; इब्रानी क्रिया का शाब्दिक अर्थ “मुड़ना/लौटना” है और यहाँ यह पाप से फिरने को दर्शाती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הָרָשָׁע
  choice: दुष्ट मनुष्य
  rationale: यह व्याकरण की दृष्टि से पुल्लिंग एकवचन है और किसी दुष्ट व्यक्ति को सूचित करता है; ‘दुष्ट मनुष्य’ उस व्यक्तिगत और पुल्लिंग रूप को स्पष्ट रखता है।
- source_word: יָשׁוּב מִכָּל חטאתו
  choice: अपने किए हुए सभी पापों से फिर जाए
  rationale: שׁוּב का मूल बिंब मुड़ने या लौटने का है; מן के साथ यहाँ इसका अर्थ पापों से विमुख होना है। ‘फिर जाए’ इस बिंब को बनाए रखता है और केवल पारिभाषिक धार्मिक शब्द तक अर्थ को सीमित नहीं करता।
- source_word: וְשָׁמַר אֶת כָּל חֻקּוֹתַי
  choice: मेरी सभी विधियों का पालन करे
  rationale: कानूनी-वाचा संबंधी प्रसंग में שׁמר का अर्थ मानना या पालन करना और חֻקּוֹת का अर्थ निर्धारित विधियाँ है। यह हिंदी में स्वाभाविक और स्पष्ट है।
- source_word: וְעָשָׂה מִשְׁפָּט וּצְדָקָה
  choice: न्याय और धार्मिकता के काम करे
  rationale: यह रूप दोनों महत्वपूर्ण नैतिक संज्ञाओं—מִשְׁפָּט और צְדָקָה—को अलग-अलग बनाए रखता है, जबकि ‘के काम करे’ हिंदी में क्रियात्मक अर्थ को स्वाभाविक बनाता है।
- source_word: חָיֹה יִחְיֶה
  choice: निश्चय ही जीवित रहेगा
  rationale: क्रिया के साथ प्रयुक्त infinitive absolute की प्रबल पुष्टि को ‘निश्चय ही’ द्वारा व्यक्त किया गया है।
- source_word: לֹא יָמוּת
  choice: वह नहीं मरेगा
  rationale: यह निषेधात्मक अपूर्ण क्रिया का सीधा और गंभीर हिंदी रूप है तथा पहले कथन के साथ संतुलन रखता है।
theological_decisions:
- issue: שׁוּב को स्पष्ट धर्मशास्त्रीय शब्द ‘पश्चाताप करे’ से अनूदित करना या मूल दिशात्मक बिंब बनाए रखना
  choice: पापों से फिर जाए
  alternative: पश्चाताप करे
  rationale: पद पापों से वास्तविक रूप से विमुख होकर आज्ञाकारिता की ओर मुड़ने का वर्णन करता है। ‘फिर जाए’ इब्रानी बिंब और उसके व्यापक नैतिक आशय को बनाए रखता है।
- issue: חָיֹה יִחְיֶה में जीवन को केवल शारीरिक जीवन, वाचा का जीवन, या अंतकालीन उद्धार के रूप में निश्चित करना
  choice: निश्चय ही जीवित रहेगा
  alternative: निश्चय ही जीवित बचा रहेगा
  rationale: इब्रानी कथन ‘जीवन’ को व्यापक रखता है। अनुवाद भी इस धर्मशास्त्रीय विस्तार और तनाव को किसी एक व्याख्या तक सीमित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण, स्पष्ट भविष्यसूचक-कानूनी शैली रखी गई है। ‘परन्तु’, ‘विधियों’, ‘न्याय’ और ‘धार्मिकता’ मूल पाठ के औपचारिक तथा वाचा-संबंधी स्वर को बनाए रखते हैं; वाक्य-संरचना सामान्य पाठक के लिए सहज रखी गई है।
