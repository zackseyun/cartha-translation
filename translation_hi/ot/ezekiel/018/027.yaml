language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וּ/בְ/שׁ֣וּב רָשָׁ֗ע מֵֽ/רִשְׁעָת/וֹ֙ אֲשֶׁ֣ר עָשָׂ֔ה וַ/יַּ֥עַשׂ מִשְׁפָּ֖ט וּ/צְדָקָ֑ה ה֖וּא אֶת נַפְשׁ֥/וֹ יְחַיֶּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/018/027.yaml
  text: And when a wicked man turns away from the wickedness that he has done and does justice and righteousness[a], he will preserve his life.
translation:
  language: hi
  text: पर जब कोई दुष्ट अपने किए हुए दुष्ट कामों से फिरकर न्याय और धार्मिकता के काम करता है, तो वह अपना जीवन बचाए रखेगा।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “वह अपने प्राण को जीवित रखेगा” अथवा “वह अपने आपको जीवित रखेगा।” इब्रानी मुहावरे में “उसका नेफ़ेश” है, जिसका अर्थ संदर्भ के अनुसार “जीवन,” “प्राण” या “स्वयं” हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְשׁוּב רָשָׁע
  choice: पर जब कोई दुष्ट ... से फिरकर
  rationale: וּ के साथ infinitive construct שׁוּב यहाँ समय और प्रसंगगत विरोध दोनों व्यक्त करता है। आधुनिक हिन्दी में ‘पर जब ... फिरकर’ पिछले कथन से विरोध और बुरे आचरण को छोड़ने का भाव स्वाभाविक रूप से प्रकट करता है।
- source_word: מֵרִשְׁעָתוֹ אֲשֶׁר עָשָׂה
  choice: अपने किए हुए दुष्ट कामों से
  rationale: शाब्दिक रूप से यह ‘उसकी दुष्टता से, जो उसने की’ है। हिन्दी में ‘अपने किए हुए दुष्ट कामों से’ अमूर्त दुष्टता और उसके वास्तविक कर्म—दोनों को स्पष्ट एवं सहज ढंग से व्यक्त करता है।
- source_word: וַיַּעַשׂ מִשְׁפָּט וּצְדָקָה
  choice: न्याय और धार्मिकता के काम करता है
  rationale: מִשְׁפָּט और צְדָקָה के अलग-अलग नैतिक अर्थों को ‘न्याय’ और ‘धार्मिकता’ के रूप में बनाए रखा गया है। ‘के काम करता है’ हिन्दी में עשה के साथ इस युग्म को स्वाभाविक बनाता है।
- source_word: אֶת־נַפְשׁוֹ
  choice: अपना जीवन
  rationale: इस अध्याय में נֶפֶשׁ जीवन, व्यक्ति या स्वयं को सूचित कर सकता है। जीवन और मृत्यु के तात्कालिक संदर्भ में ‘अपना जीवन’ सबसे उपयुक्त है और अनावश्यक आत्मा-देह द्वैत नहीं जोड़ता।
- source_word: יְחַיֶּה
  choice: बचाए रखेगा
  rationale: חיה का पिएल रूप यहाँ जीवित रखने या जीवन संरक्षित करने का अर्थ देता है। ‘बचाए रखेगा’ इस कारक भाव को सहज हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: नैतिक-न्यायिक संदर्भ में נֶפֶשׁ का अर्थ
  choice: अपना जीवन
  alternative: अपने प्राण को / अपने आपको
  rationale: यहेजकेल 18 में आचरण के संबंध में जीने और मरने का विरोध प्रमुख है। ‘जीवन’ संदर्भगत अर्थ बनाए रखता है और कथन को केवल अभौतिक आत्मा तक सीमित नहीं करता।
- issue: मनुष्य के कर्म और जीवन के बीच संबंध
  choice: पद के शर्तात्मक-परिणामी कथन को सीधे बनाए रखा गया है
  alternative: इसे किसी विशिष्ट मतानुसार केवल सांसारिक या केवल अनन्त उद्धार का कथन बनाना
  rationale: इब्रानी पाठ पश्चात्ताप, न्यायपूर्ण आचरण और जीवन के बीच संबंध बताता है, पर इस पद में जीवन की सीमा को किसी व्यवस्थित धर्मसिद्धान्त के अनुसार स्पष्ट नहीं करता। अनुवाद इस तनाव को खुला रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘दुष्ट,’ ‘न्याय’ और ‘धार्मिकता’ जैसे पारंपरिक बाइबलीय शब्दों को स्पष्ट वाक्य-विन्यास के साथ रखा गया है।
