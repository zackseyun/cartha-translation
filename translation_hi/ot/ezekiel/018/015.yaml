source:
  edition: WLC
  text: עַל הֶֽ/הָרִים֙ לֹ֣א אָכָ֔ל וְ/עֵינָי/ו֙ לֹ֣א נָשָׂ֔א אֶל גִּלּוּלֵ֖י בֵּ֣ית יִשְׂרָאֵ֑ל אֶת אֵ֥שֶׁת רֵעֵ֖/הוּ לֹ֥א טִמֵּֽא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/018/015.yaml
  text: He has not eaten on the mountains[a], nor lifted up his eyes to the idols of the house of Israel[b]; he has not defiled his neighbor’s wife.
translation:
  language: hi
  text: उसने पहाड़ों पर नहीं खाया[a], न इस्राएल के घराने की मूर्तियों की ओर आँखें उठाईं[b]; उसने अपने पड़ोसी की पत्नी को अशुद्ध नहीं किया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अधिक स्पष्ट रूप में, “पहाड़ी पूजा-स्थलों पर नहीं खाया”; इसका आशय मूर्तिपूजक उपासना में होने वाले भोज में भाग न लेने से है।
    reason: lexical_alternative
  - marker: b
    text: “मूर्तियों” के लिए प्रयुक्त हिब्रू शब्द तिरस्कारपूर्ण है और उसमें “घिनौनी” या “गंदी मूर्तियाँ” जैसा भाव हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל הֶהָרִים ... אָכָל
  choice: पहाड़ों पर बलि-भोज नहीं किया
  rationale: शाब्दिक बिंब ‘पहाड़ों पर’ को रखते हुए ‘बलि-भोज’ प्रसंग में निहित मूर्तिपूजक उपासना को सामान्य हिन्दी पाठक के लिए स्पष्ट करता है; केवल ‘खाना नहीं खाया’ हिन्दी में साधारण भोजन समझा जा सकता है।
- source_word: וְעֵינָיו לֹא נָשָׂא
  choice: न ... की ओर आँखें उठाईं
  rationale: यह हिन्दी में स्वाभाविक धार्मिक मुहावरा है और किसी वस्तु की ओर भक्ति या आशा से उन्मुख होने का हिब्रू भाव सुरक्षित रखता है।
- source_word: גִּלּוּלֵי בֵּית יִשְׂרָאֵל
  choice: इस्राएल के घराने की मूर्तियों
  rationale: ‘मूर्तियाँ’ मुख्य अर्थ स्पष्ट करता है; मूल शब्द का तिरस्कारपूर्ण, अशुद्धता-सूचक रंग पादटिप्पणी में रखा गया है।
- source_word: בֵּית יִשְׂרָאֵל
  choice: इस्राएल का घराना
  rationale: यहेजकेल की वाचागत और राष्ट्रीय अभिव्यक्ति को केवल ‘इस्राएल’ कर देने के बजाय सुरक्षित रखता है।
- source_word: אֵשֶׁת רֵעֵהוּ
  choice: अपने पड़ोसी की पत्नी
  rationale: רֵעַ के लिए ‘पड़ोसी’ नैतिक प्रसंग में सहज और सटीक आधुनिक हिन्दी है।
- source_word: לֹא טִמֵּא
  choice: अशुद्ध नहीं किया
  rationale: यह व्यभिचार से जुड़ी नैतिक और अनुष्ठानिक अशुद्धता के मूल भाव को रखता है; ‘अपवित्र’ सम्भव है, जबकि ‘बलात्कार किया’ मूल से अधिक अर्थ जोड़ देगा।
theological_decisions:
- issue: पहाड़ों पर खाने की उपासना-संबंधी भाषा
  choice: ‘पहाड़ों पर बलि-भोज नहीं किया’—इसे ऊँचे स्थानों की मूर्तिपूजक उपासना में सहभागिता के रूप में प्रस्तुत किया गया है।
  alternative: 'अधिक शाब्दिक: ‘पहाड़ों पर नहीं खाया।’'
  rationale: यहेजकेल के प्रसंग में यह पहाड़ी पूजा-स्थलों पर धार्मिक भोजन का संकेत है। ‘बलि-भोज’ अर्थ स्पष्ट करता है, जबकि पादटिप्पणी अधिक शाब्दिक रूप बचाती है।
- issue: यौन पाप के लिए अशुद्धता की भाषा
  choice: ‘अपने पड़ोसी की पत्नी को अशुद्ध नहीं किया।’
  alternative: ‘अपने पड़ोसी की पत्नी को अपवित्र नहीं किया’ अथवा प्रसंग स्पष्ट करते हुए ‘उसके साथ व्यभिचार नहीं किया।’
  rationale: हिब्रू טמא अशुद्ध करने पर बल देता है। चुना हुआ रूप नैतिक-धार्मिक तनाव सुरक्षित रखता है और जबरदस्ती जैसी ऐसी बात नहीं जोड़ता जो इस पद में स्पष्ट नहीं है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण और सामान्य पाठकों के लिए बोधगम्य शैली। समानांतर नकारात्मक वाक्यरचना तथा यहेजकेल की ‘इस्राएल का घराना’ अभिव्यक्ति बनाए रखी गई है।
