  text: וַ/יִּרְאֶ֣ה ו/ישוב מִ/כָּל פְּשָׁעָ֖י/ו אֲשֶׁ֣ר עָשָׂ֑ה חָי֥וֹ יִחְיֶ֖ה לֹ֥א יָמֽוּת־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/018/028.yaml
  text: Because he considered and turned back from all his transgressions that he had committed[a], he will surely live[b]; he will not die.
translation:
  language: hi
  text: क्योंकि उसने विचार किया[a] और अपने किए हुए सभी अपराधों से मुड़ गया[b], इसलिए वह निश्चय ही जीवित रहेगा; वह नहीं मरेगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, ‘उसने देखा’; यहाँ इसका अर्थ ‘उसने समझा’ या ‘उसने विचार किया’ हो सकता है। वाक्य के आरंभ का अनुवाद ‘और’ या ‘क्योंकि’ भी किया जा सकता है।
    reason: lexical_alternative
  - marker: b
    text: या ‘लौट गया’; इब्रानी क्रिया में मुड़ने या लौटने का चित्र है और इस संदर्भ में इसका अर्थ ‘पश्चाताप किया’ भी समझा जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּרְאֶה
  choice: क्योंकि उसने समझा
  rationale: רָאָה का शाब्दिक अर्थ ‘देखना’ है, पर यहाँ यह अपनी दशा को पहचानने या उस पर विचार करने का भाव देता है। आरंभिक ו को पिछले कथन से कारणात्मक संबंध के अनुसार ‘क्योंकि’ से व्यक्त किया गया है।
- source_word: וישוב
  choice: फिर गया
  rationale: שׁוּב का मूल अर्थ ‘लौटना/फिरना’ है। ‘फिर गया’ पाप से दिशा बदलने का ठोस रूपक बनाए रखता है और केवल धर्मशास्त्रीय पारिभाषिक शब्द पर निर्भर नहीं होता।
- source_word: מִכָּל פְּשָׁעָיו
  choice: अपने ... सभी अपराधों से
  rationale: פֶּשַׁע जानबूझकर किए गए उल्लंघन या विद्रोह का भाव रखता है। ‘अपराध’ आधुनिक हिन्दी में स्पष्ट है और नैतिक गंभीरता को बनाए रखता है।
- source_word: אֲשֶׁר עָשָׂה
  choice: अपने किए हुए
  rationale: עָשָׂה का सामान्य अर्थ ‘करना’ है। अपराधों के साथ ‘किए हुए’ सहज हिन्दी है और मुड़ने से पहले के आचरण को सूचित करता है।
- source_word: חָיוֹ יִחְיֶה
  choice: वह निश्चय ही जीवित रहेगा
  rationale: क्रिया के धात्वर्थक रूप और अपूर्ण क्रिया का मेल कथन को प्रबल बनाता है; ‘निश्चय ही’ उस बल को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: לֹא יָמוּת
  choice: वह नहीं मरेगा
  rationale: यह नकारात्मक क्रिया जीवन के दृढ़ आश्वासन के साथ सीधा विरोध प्रस्तुत करती है।
theological_decisions:
- issue: यहेजकेल की वाचा-संबंधी चेतावनी में जीवन और मृत्यु का आशय
  choice: ‘जीवित रहेगा; नहीं मरेगा’ के सीधे आश्वासन को बिना सीमित व्याख्या के रखा गया है।
  alternative: इसे केवल शारीरिक बचाव, वाचा-संबंधी न्यायिक जीवन, आत्मिक जीवन अथवा अंतकालीन जीवन तक सीमित समझना।
  rationale: इस पद में जीवन और मृत्यु के सटीक धर्मशास्त्रीय दायरे को अलग से निश्चित नहीं किया गया है। मूल कथन को बनाए रखने से उसकी नैतिक शक्ति और वास्तविक अर्थगत तनाव सुरक्षित रहता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘फिर गया’ दिशा-परिवर्तन के इब्रानी रूपक को सुरक्षित रखता है, जबकि पादटिप्पणी अधिक व्याख्यात्मक विकल्प बताती है।
