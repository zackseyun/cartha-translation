source:
  edition: WLC
  text: וַ/אֲמַרְתֶּ֕ם מַדֻּ֛עַ לֹא נָשָׂ֥א הַ/בֵּ֖ן בַּ/עֲוֺ֣ן הָ/אָ֑ב וְ/הַ/בֵּ֞ן מִשְׁפָּ֧ט וּ/צְדָקָ֣ה עָשָׂ֗ה אֵ֣ת כָּל חֻקּוֹתַ֥/י שָׁמַ֛ר וַ/יַּעֲשֶׂ֥ה אֹתָ֖/ם חָיֹ֥ה יִחְיֶֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/018/019.yaml
  text: Yet you say[a], ‘Why does the son not bear the iniquity of the father?’ Because the son has done justice and righteousness, has kept all my statutes, and has done them; he shall surely live.
translation:
  language: hi
  text: फिर भी तुम कहते हो, “पुत्र अपने पिता के अधर्म का भार क्यों नहीं उठाता[a]?” क्योंकि पुत्र ने न्याय और धार्मिकता का आचरण किया है, मेरी सभी विधियों को माना है और उनका पालन किया है; वह निश्चय ही जीवित रहेगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “पिता का दोष क्यों नहीं उठाता” अथवा “पिता के अधर्म का दंड क्यों नहीं भोगता।” “अधर्म का भार उठाना” हिब्रू मुहावरा है, जिसमें दोष और उसके परिणाम—दोनों का भाव हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲמַרְתֶּם
  choice: फिर भी तुम कहते हो
  rationale: संयोजक और द्वितीय पुरुष बहुवचन क्रिया प्रसंग में लोगों की आपत्ति प्रस्तुत करते हैं। ‘फिर भी’ पिछले कथन के प्रति उनके विरोध को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: לֹא נָשָׂא ... בַּעֲוֺן הָאָב
  choice: अपने पिता के अधर्म का भार ... नहीं उठाता
  rationale: נשא עון एक हिब्रू मुहावरा है, जिसमें अधर्म, दोष और उसके परिणाम सहने के अर्थ परस्पर जुड़े हो सकते हैं। ‘अधर्म का भार उठाना’ इस व्यापकता को बनाए रखता है।
- source_word: מִשְׁפָּט וּצְדָקָה עָשָׂה
  choice: न्याय और धार्मिकता के काम किए हैं
  rationale: यह अनुवाद यहेजकेल में प्रचलित दोनों नैतिक-धार्मिक संज्ञाओं को अलग-अलग बनाए रखते हुए आधुनिक हिन्दी में स्वाभाविक क्रियात्मक अभिव्यक्ति देता है।
- source_word: חֻקּוֹתַי
  choice: मेरी सभी विधियों
  rationale: ‘विधियाँ’ वाचा और व्यवस्था से संबंधित חֻקּוֹת के कानूनी भाव को स्पष्ट तथा गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: שָׁמַר וַיַּעֲשֶׂה אֹתָם
  choice: माना है और उनका पालन किया है
  rationale: यह שמר और עשה के दोहरे बल—आज्ञाओं को मानना और व्यवहार में पूरा करना—को सहज हिन्दी में सुरक्षित रखता है।
- source_word: חָיֹה יִחְיֶה
  choice: निश्चय ही जीवित रहेगा
  rationale: क्रिया के साथ प्रयुक्त infinitive absolute की प्रबल निश्चितता को ‘निश्चय ही’ स्पष्ट रूप से व्यक्त करता है।
theological_decisions:
- issue: पिता के अधर्म का भार उठाने का अर्थ
  choice: मुहावरे को व्यापक रूप में रखा गया है, ताकि दोष और उसके परिणाम दोनों की संभावना बनी रहे।
  alternative: ‘पिता का दोष अपने ऊपर लेना’ अथवा ‘पिता के अधर्म का दंड भोगना’
  rationale: पद व्यक्तिगत उत्तरदायित्व पर बल देता है, पर עָוֹן और נשא עון का मुहावरा केवल दोष या केवल दंड में से किसी एक को अनिवार्य रूप से नहीं चुनता। इसलिए अनुवाद इस धर्मवैचारिक तनाव को संकीर्ण नहीं करता।
- issue: पुत्र के जीवित रहने के कथन का आधार
  choice: दूसरे वाक्य को ‘क्योंकि’ से प्रश्न का कारणात्मक उत्तर बनाया गया है।
  alternative: ‘परन्तु पुत्र ने...’
  rationale: यद्यपि हिब्रू में सामान्य संयोजक וְ है, प्रसंग में पुत्र का न्यायपूर्ण आचरण इस बात का कारण बताता है कि वह पिता के अधर्म का भार क्यों नहीं उठाता।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण और सामान्य पाठकों के लिए बोधगम्य रूप अपनाया गया है। ‘अधर्म’, ‘न्याय’, ‘धार्मिकता’ और ‘विधियाँ’ जैसे शब्द मूल के नैतिक तथा वाचा-संबंधी स्वर को बनाए रखते हैं; अत्यधिक संस्कृतनिष्ठ वाक्य-विन्यास से बचा गया है।
