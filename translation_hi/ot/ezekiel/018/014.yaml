  text: וְ/הִנֵּה֙ הוֹלִ֣יד בֵּ֔ן וַ/יַּ֕רְא אֶת כָּל חַטֹּ֥את אָבִ֖י/ו אֲשֶׁ֣ר עָשָׂ֑ה וַ/יִּרְאֶ֕ה וְ/לֹ֥א יַעֲשֶׂ֖ה כָּ/הֵֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/018/014.yaml
  text: But behold[a], he fathers a son, and he sees all the sins that his father has done; he sees them[b], and he does not do likewise.
translation:
  language: hi
  text: पर देखो, वह एक पुत्र का पिता बनता है। वह अपने पिता के किए हुए सभी पापों को देखता है; वह उन्हें देखता है[a], और वैसा नहीं करता।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इब्रानी में ‘देखता है’ की पुनरावृत्ति है: ‘वह देखता है ... वह देखता है, और वैसा नहीं करता।’'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  choice: पर देखो
  rationale: यह पद पिछले उदाहरण के विपरीत एक नया, सजीव मामला सामने रखता है। ‘पर’ विरोध और ‘देखो’ הִנֵּה की ध्यान आकर्षित करने वाली शक्ति व्यक्त करता है।
- source_word: הוֹלִיד בֵּן
  choice: वह एक पुत्र का पिता बनता है
  rationale: हिफ़ील रूप संतान उत्पन्न करने का भाव रखता है। यह आधुनिक हिन्दी में स्वाभाविक है और केवल ‘उसका एक पुत्र होता है’ की अपेक्षा जनन-संबंध को अधिक स्पष्ट रखता है।
- source_word: כָּל חַטֹּאת אָבִיו אֲשֶׁר עָשָׂה
  choice: अपने पिता के किए हुए सभी पापों को
  rationale: यह पिता के वास्तविक पापपूर्ण कामों को दर्शाता है और सम्बन्धवाचक उपवाक्य का आशय संक्षिप्त, स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: וַיַּרְא ... וַיִּרְאֶה
  choice: देखता है; वह उन्हें देखकर
  rationale: ראה की पुनरावृत्ति को मिटाया नहीं गया है। दूसरे प्रयोग को ‘उन्हें देखकर’ कहने से हिन्दी स्वाभाविक रहती है और देखने के बाद वैसा न करने का संबंध स्पष्ट होता है।
- source_word: וְלֹא יַעֲשֶׂה כָּהֵן
  choice: वैसे काम नहीं करता
  rationale: כָּהֵן का तुलनात्मक अर्थ ‘उस प्रकार/वैसे’ है और यह पिता के पापपूर्ण कामों की ओर लौटता है।
theological_decisions:
- issue: दृष्टांत में व्यक्तिगत नैतिक उत्तरदायित्व
  choice: पुत्र अपने पिता के पाप देखता है, पर उनका अनुकरण नहीं करता।
  alternative: पुत्र केवल पापों को देखता है, अथवा पिता से भिन्न आचरण के बावजूद उसका दोष विरासत में पाता है।
  rationale: पद का निष्कर्ष पुत्र के अपने आचरण पर केंद्रित है। अनुवाद इससे आगे कोई व्यापक धर्मसैद्धांतिक निष्कर्ष नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी; सजीव किंतु गरिमापूर्ण शैली। ‘पिता बनता है’ जनन के भाव को स्वाभाविक हिन्दी में रखता है, और ‘देखता है ... देखकर’ मूल की पुनरावृत्ति को पठनीय ढंग से सुरक्षित करता है।
