source:
  edition: WLC
  text: וְ/הוֹלִ֥יד בֵּן פָּרִ֖יץ שֹׁפֵ֣ךְ דָּ֑ם וְ/עָ֣שָׂה אָ֔ח מֵ/אַחַ֖ד מֵ/אֵֽלֶּה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/018/010.yaml
  text: But if he fathers a violent son[a], one who sheds blood and does any one of these things,
translation:
  language: hi
  text: पर यदि उसका एक हिंसक बेटा हो, जो खून बहाता हो और किसी भाई के साथ इनमें से कोई एक काम करता हो,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक शब्दशः: “और वह एक हिंसक बेटे का पिता हो, जो खून बहानेवाला हो और किसी भाई के साथ इनमें से एक काम करे।”'
    reason: आरम्भिक संयोजक, पिता होनेवाली क्रिया, कृदन्तीय पदबंध, और ‘भाई’ के लिए प्रयुक्त कठिन हिब्रू पद को अधिक औपचारिक रूप में दिखाना।
lexical_decisions:
- source_word: וְהוֹלִיד
  choice: पर यदि उसका ... बेटा पैदा हो
  rationale: हिब्रू क्रिया का मूल अर्थ ‘जन्म देना/उत्पन्न करना’ है। प्रसंग में धर्मी पिता के विपरीत पुत्र की सशर्त स्थिति आरम्भ होती है, इसलिए ‘पर यदि’ स्वाभाविक है; ‘उसका ... बेटा पैदा हो’ आधुनिक हिन्दी में पितृत्व का संबंध स्पष्ट करता है।
- source_word: בֵּן
  choice: बेटा
  rationale: यह शब्द पुरुषवाचक एकवचन ‘पुत्र/बेटा’ को सूचित करता है। ‘बेटा’ साधारण आधुनिक हिन्दी में अधिक सहज है।
- source_word: פָּרִיץ
  choice: हिंसक
  rationale: शब्द हिंसक, निर्दयी अथवा उपद्रवी व्यक्ति को सूचित कर सकता है। निकटवर्ती रक्तपात के उल्लेख के कारण ‘हिंसक’ सटीक और संक्षिप्त है।
- source_word: שֹׁפֵךְ דָּם
  choice: जो खून बहाता हो
  rationale: यह कृदन्तीय पदबंध अक्षरशः रक्त बहाने को व्यक्त करता है। यह ‘हत्यारा’ की अपेक्षा मूल मुहावरे को बनाए रखता और अर्थ को अनावश्यक रूप से संकीर्ण नहीं करता।
- source_word: וְעָשָׂה
  choice: और ... करता हो
  rationale: सामान्य क्रिया עשה का सीधा अर्थ ‘करना’ है; हिन्दी में आगे आने वाले कर्म के साथ यही स्वाभाविक है।
- source_word: אָח מֵאַחַד מֵאֵלֶּה
  choice: इनमें से कोई एक काम
  rationale: हिब्रू पाठ का אָח कठिन और असामान्य है, पर पूरे वाक्यांश का प्रासंगिक अर्थ ‘इनमें से कोई एक’ समझा जाता है। ‘काम’ जोड़ने से हिन्दी वाक्य पूर्ण और सहज होता है।
theological_decisions:
- issue: आरम्भिक וְ का संबंध और सशर्त भाव
  choice: पर यदि
  alternative: और वह उत्पन्न करे
  rationale: व्याकरण में संयोजक साधारणतः ‘और’ है, किंतु 18:5–9 के धर्मी व्यक्ति के बाद यहाँ उसके हिंसक पुत्र की विपरीत, काल्पनिक स्थिति आती है। ‘पर यदि’ इस प्रवचन-संबंध को स्पष्ट करता है, कोई अतिरिक्त धर्मवैज्ञानिक निष्कर्ष नहीं जोड़ता।
- issue: क्या एक अपराध या पूरी सूची अभिप्रेत है
  choice: इनमें से कोई एक काम
  alternative: इन सभी कामों को
  rationale: מֵאַחַד מֵאֵלֶּה में एकवचन ‘एक’ उपस्थित है। इसलिए अनुवाद इस तनाव को बनाए रखता है कि सूची के अपराधों में से एक का करना भी यहाँ विचाराधीन हो सकता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सहज पर गरिमापूर्ण शैली। ‘बेटा’ और ‘खून बहाता’ सामान्य पाठक के लिए स्वाभाविक हैं। पद के सशर्त प्रवाह को हिन्दी में स्पष्ट किया गया है, जबकि कठिन हिब्रू वाक्यांश की एकवचन शक्ति ‘कोई एक’ में सुरक्षित रखी गई है।
