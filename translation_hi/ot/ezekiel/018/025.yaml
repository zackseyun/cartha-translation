source:
  edition: WLC
  text: וַ/אֲמַרְתֶּ֕ם לֹ֥א יִתָּכֵ֖ן דֶּ֣רֶךְ אֲדֹנָ֑/י שִׁמְעוּ נָא֙ בֵּ֣ית יִשְׂרָאֵ֔ל הֲ/דַרְכִּ/י֙ לֹ֣א יִתָּכֵ֔ן הֲ/לֹ֥א דַרְכֵי/כֶ֖ם לֹ֥א יִתָּכֵֽנוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/018/025.yaml
  text: 'Yet you say[a], ‘The way of the Lord is not just.’ Hear now, house of Israel: Is my way not just? Is it not your ways that are not just?'
translation:
  language: hi
  text: फिर भी तुम कहते हो[a], “प्रभु का मार्ग न्यायपूर्ण नहीं है।” अब सुनो, हे इस्राएल के घराने! क्या मेरा मार्ग न्यायपूर्ण नहीं है? क्या न्यायपूर्ण न होने वाले तुम्हारे ही मार्ग नहीं हैं?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “न्यायपूर्ण” के प्रत्येक प्रयोग के लिए “उचित,” “निष्पक्ष,” या “न्यायसंगत” भी सम्भव है। इब्रानी शब्द का सम्बन्ध उस बात से है जो उचित या समतापूर्ण हो।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲמַרְתֶּם
  choice: फिर भी तुम कहते हो
  rationale: संदर्भ में वाव के साथ यह क्रिया इस्राएल की आपत्ति को विरोधात्मक ढंग से सामने रखती है; ‘फिर भी’ उस भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: יִתָּכֵן
  choice: न्यायपूर्ण है
  rationale: यहाँ निफ़अल रूप नैतिक रूप से उचित, समतापूर्ण या न्यायसंगत होने का अर्थ देता है। ‘न्यायपूर्ण’ पूरे पद में आरोप और प्रत्युत्तर की न्याय-संबंधी गंभीरता बनाए रखता है।
- source_word: דֶּרֶךְ / דַרְכִּי / דַרְכֵיכֶם
  choice: मार्ग / मेरा मार्ग / तुम्हारे मार्ग
  rationale: ‘मार्ग’ आचरण या व्यवहार-पद्धति का प्रचलित रूपक है और एकवचन तथा बहुवचन के स्रोतगत विरोध को सुरक्षित रखता है।
- source_word: אֲדֹנָי
  choice: प्रभु
  rationale: यह परमेश्वर के लिए प्रयुक्त उपाधि אֲדֹנָי का स्वाभाविक और गरिमापूर्ण हिन्दी रूप है।
- source_word: שִׁמְעוּ נָא
  choice: अब सुनो
  rationale: आज्ञार्थक क्रिया और נָא की तात्कालिक आग्रह-भावना को आधुनिक, सीधे और गरिमापूर्ण रूप में व्यक्त करता है।
- source_word: בֵּית יִשְׂרָאֵל
  choice: हे इस्राएल के घराने
  rationale: यह इस्राएल को सामूहिक वाचा-समुदाय के रूप में किया गया पारंपरिक भविष्यद्वाणी-संबंधी संबोधन है।
- source_word: הֲלֹא דַרְכֵיכֶם לֹא יִתָּכֵנוּ
  choice: क्या तुम्हारे ही मार्ग न्यायपूर्ण नहीं हैं?
  rationale: ‘ही’ परमेश्वर के मार्ग और इस्राएल के मार्गों के बीच स्रोत में दिए गए तीखे विरोध को उभारता है; प्रश्नात्मक रचना इब्रानी के आलंकारिक प्रत्युत्तर को बनाए रखती है।
theological_decisions:
- issue: परमेश्वर के व्यवहार पर इस्राएल के नैतिक आरोप का स्वरूप
  choice: יִתָּכֵן को हर बार ‘न्यायपूर्ण’ से व्यक्त किया गया
  alternative: ‘उचित’ या ‘निष्पक्ष’
  rationale: अध्याय परमेश्वर के न्याय और व्यक्तिगत उत्तरदायित्व पर केंद्रित है। ‘न्यायपूर्ण’ आरोप तथा परमेश्वर के प्रत्युत्तर का नैतिक-न्यायिक बल बनाए रखता है, जबकि अन्य सम्भव अर्थ पादटिप्पणी में सुरक्षित हैं।
translation_notes:
  register: आधुनिक मानक हिन्दी में सीधा, गरिमापूर्ण भविष्यद्वाणी-संबंधी लहजा रखा गया है। ‘हे इस्राएल के घराने’ स्रोत के सामूहिक संबोधन को बनाए रखता है।
