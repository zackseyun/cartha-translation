base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/018/023.yaml
  text: Do I take any pleasure at all in the death of the wicked? declares the Lord GOD[c][b][a]. Is it not rather in his turning from his ways and living?
translation:
  language: hi
  text: “क्या मुझे दुष्ट की मृत्यु से तनिक भी प्रसन्नता होती है?[a]” प्रभु यहोवा[b] की यह घोषणा है। “क्या इसके बजाय मुझे इस बात से प्रसन्नता नहीं होती कि वह अपने मार्गों से फिरकर जीवित रहे?[c]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “क्या मैं सचमुच दुष्ट की मृत्यु चाहता हूँ?” इब्रानी क्रिया प्रसन्नता, आनन्द या इच्छा का भाव व्यक्त कर सकती है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में “प्रभु यहोवा” (אֲדֹנָי יְהוִה), जहाँ “यहोवा” परमेश्वर के दिव्य नाम का रूप है।
    reason: lexical_alternative
  - marker: c
    text: 'अधिक शब्दशः: “क्या यह नहीं कि वह अपने मार्गों से फिरे और जीवित रहे?”'
    reason: alternative_reading
lexical_decisions:
- source_word: הֶחָפֹץ אֶחְפֹּץ
  choice: क्या मुझे ... तनिक भी प्रसन्नता होती है?
  rationale: धातु חפץ प्रसन्न होने, आनन्द लेने या इच्छा रखने का भाव व्यक्त कर सकती है। धातु के साधारण क्रियारूप के साथ उसी धातु का infinitive absolute कथन पर बल देता है; हिन्दी में ‘तनिक भी’ इस जोर और आलंकारिक प्रश्न को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: מוֹת רָשָׁע
  choice: दुष्ट की मृत्यु
  rationale: מוֹת मृत्यु की घटना या अवस्था को सूचित करता है और רָשָׁע यहाँ किसी दुष्ट व्यक्ति के लिए संज्ञा की तरह प्रयुक्त प्रतिनिधिक एकवचन है। ‘दुष्ट की मृत्यु’ संक्षिप्त और स्वाभाविक है।
- source_word: נְאֻם
  choice: की यह घोषणा है
  rationale: भविष्यद्वाणी के इस सूत्र में נְאֻם अधिकारपूर्ण ईश्वरीय कथन को दर्शाता है। ‘घोषणा’ आधुनिक हिन्दी में उस औपचारिक और अधिकारपूर्ण भाव को बनाए रखती है।
- source_word: אֲדֹנָי יְהוִה
  choice: प्रभु यहोवा
  rationale: संयुक्त ईश्वरीय उपाधि में אֲדֹנָי को ‘प्रभु’ और चार अक्षरों वाले दिव्य नाम יהוה को ‘यहोवा’ से व्यक्त किया गया है, जिससे दोनों घटक स्पष्ट रहते हैं।
- source_word: הֲלוֹא
  choice: क्या इसके बजाय ... नहीं
  rationale: प्रश्नवाचक अव्यय ऐसे सकारात्मक उत्तर की अपेक्षा करता है जो पहले प्रश्न के विपरीत है। ‘इसके बजाय’ उस प्रसंगगत विरोध को स्वाभाविक हिन्दी में स्पष्ट करता है।
- source_word: בְּשׁוּבוֹ מִדְּרָכָיו
  choice: कि वह अपने मार्गों से फिरकर
  rationale: ב के साथ infinitive construct को हिन्दी में आशयगत उपवाक्य से व्यक्त किया गया है। ‘मार्गों से फिरना’ आचरण के लिए प्रयुक्त मूल रूपक को बनाए रखता है और पश्चात्ताप की धारणा को अनावश्यक रूप से किसी तकनीकी शब्द में सीमित नहीं करता।
- source_word: וְחָיָה
  choice: जीवित रहे
  rationale: यह क्रिया फिरने के फलस्वरूप जीवन को सामने रखती है। ‘जीवित रहे’ हिन्दी में स्वाभाविक है और इसे केवल आदेश या स्पष्ट प्रयोजनवाचक कथन नहीं बनाता।
theological_decisions:
- issue: दुष्ट की मृत्यु के प्रति परमेश्वर की प्रवृत्ति और उसके फिरकर जीवित रहने की इच्छा
  choice: पद को ऐसे आलंकारिक प्रश्नों के रूप में रखा गया है जो दुष्ट की मृत्यु में परमेश्वर की प्रसन्नता का निषेध करते और उसके फिरकर जीवित रहने को सकारात्मक विकल्प बताते हैं।
  alternative: חפץ को अधिक इच्छावाचक रूप में लेकर कहा जा सकता है, ‘क्या मैं सचमुच दुष्ट की मृत्यु चाहता हूँ?’
  rationale: חפץ में प्रसन्नता, आनन्द और इच्छा के अर्थ-क्षेत्र एक-दूसरे से जुड़े हैं। ‘प्रसन्नता होती है’ भावात्मक पक्ष को सीधे व्यक्त करता है, पर पादटिप्पणी इच्छावाचक संभावना को सुरक्षित रखती है। इस प्रकार न्याय और दया के बीच पाठ में उपस्थित धार्मिक तनाव को किसी व्यवस्थित सिद्धान्त द्वारा पहले से हल नहीं किया गया।
- issue: दूसरे प्रश्न का व्याकरणिक सम्बन्ध
  choice: पहले प्रश्न से ‘मुझे इससे प्रसन्नता होती है’ का भाव दूसरे प्रश्न में स्पष्ट रूप से दोहराया गया है।
  alternative: 'अधिक शब्दशः रूप: ‘क्या यह नहीं कि वह अपने मार्गों से फिरे और जीवित रहे?’'
  rationale: इब्रानी में दूसरे प्रश्न का अपेक्षित भाव पहले प्रश्न से ग्रहण किया जाता है। हिन्दी में उसे दोहराने से वाक्य स्पष्ट और स्वाभाविक होता है, जबकि पादटिप्पणी निकटतर संरचना बताती है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, सम्मानपूर्ण किंतु सामान्य पाठक के लिए सहज रखी गई है। ‘तनिक भी’ इब्रानी की जोरदार पुनरुक्ति को स्वाभाविक रूप देता है; ‘अपने मार्गों से फिरकर’ मूल रूपक और प्रतिनिधिक एकवचन दोनों को बनाए रखता है।
