source:
  edition: WLC
  text: כָּל פְּשָׁעָי/ו֙ אֲשֶׁ֣ר עָשָׂ֔ה לֹ֥א יִזָּכְר֖וּ ל֑/וֹ בְּ/צִדְקָת֥/וֹ אֲשֶׁר עָשָׂ֖ה יִֽחְיֶֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/018/022.yaml
  text: None of the transgressions that he has committed will be remembered against him[a]; by the righteousness that he has practiced[b], he will live.
translation:
  language: hi
  text: उसने जितने भी अपराध किए हैं, उनमें से कोई भी उसके विरुद्ध याद नहीं किया जाएगा[a]; उसने जिस धार्मिकता का आचरण किया है, उसके कारण[b] वह जीवित रहेगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसके विरुद्ध नहीं गिना जाएगा।”
    reason: lexical_alternative
  - marker: b
    text: या, “अपनी धार्मिकता में” अथवा “अपनी धार्मिकता के द्वारा”; यहाँ इब्रानी पूर्वसर्ग को इन निकटवर्ती अर्थों में भी समझा जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל פְּשָׁעָיו
  choice: उसने जितने भी अपराध किए हैं, उनमें से कोई भी
  rationale: निषेध के साथ כָּל की समग्रता को स्वाभाविक हिन्दी में ‘जितने भी… उनमें से कोई भी नहीं’ से व्यक्त किया गया है। פְּשָׁעִים के नैतिक और न्यायिक भाव के लिए ‘अपराध’ चुना गया है।
- source_word: אֲשֶׁר עָשָׂה
  choice: किए हैं
  rationale: गलत कामों के संदर्भ में עָשָׂה को सहज हिन्दी में ‘किए हैं’ कहा गया है; पूर्ण क्रिया के वर्तमान-संबंधी प्रभाव को भी बनाए रखा गया है।
- source_word: לֹא יִזָּכְרוּ לוֹ
  choice: उसके विरुद्ध याद नहीं किया जाएगा
  rationale: זכר के निफ़ाल रूप का कर्मवाच्य भाव रखा गया है, और न्यायिक संदर्भ में לוֹ को ‘उसके विरुद्ध’ से स्पष्ट किया गया है।
- source_word: בְּצִדְקָתוֹ
  choice: उसकी धार्मिकता के कारण
  rationale: צְדָקָה के लिए ‘धार्मिकता’ रखा गया है। בְּ को मुख्य पाठ में कारणसूचक समझा गया है, जबकि उसके निकटवर्ती साधनसूचक और अवस्थासूचक अर्थ फुटनोट में सुरक्षित हैं।
- source_word: אֲשֶׁר עָשָׂה
  choice: जिसका आचरण किया है
  rationale: धार्मिकता के साथ ‘करना’ की अपेक्षा ‘आचरण करना’ आधुनिक हिन्दी में अधिक स्वाभाविक है और व्यवहार में प्रकट धार्मिकता का भाव बनाए रखता है।
- source_word: יִחְיֶה
  choice: वह जीवित रहेगा
  rationale: यह भविष्य अथवा परिणामसूचक कथन को स्पष्ट आधुनिक हिन्दी में व्यक्त करता है, बिना ‘जीवन’ के स्वरूप को आवश्यकता से अधिक सीमित किए।
theological_decisions:
- issue: क्या यह पद पुण्य के द्वारा आत्म-धर्मी ठहराए जाने की शिक्षा देता है, या पश्चात्ताप करने वाले धर्मी व्यक्ति के लिए व्यक्तिगत उत्तरदायित्व और जीवन का वाचा-संबंधी सिद्धांत बताता है?
  choice: 'पद को यहेजकेल की अपनी न्यायिक और वाचा-संबंधी भाषा में सीधा रखा गया है: उसके अपराध उसके विरुद्ध याद नहीं किए जाएँगे, और जिस धार्मिकता का उसने आचरण किया है उसके कारण वह जीवित रहेगा।'
  alternative: इसे बाद की धर्मवैज्ञानिक ‘धर्मी ठहराए जाने’ की शब्दावली में अधिक स्पष्ट करना, अथवा ‘जीवित रहेगा’ को केवल सांसारिक कुशलता तक सीमित कर देना।
  rationale: इब्रानी पाठ व्यापक धर्मवैज्ञानिक प्रश्नों का यहाँ स्पष्ट समाधान नहीं करता। अनुवाद इसलिए वास्तविक तनाव को बनाए रखता है और किसी संप्रदायगत निष्कर्ष को आरोपित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण लेकिन सामान्य पाठक के लिए सहज शैली रखी गई है। ‘अपराध’, ‘धार्मिकता’ और ‘जीवित रहेगा’ मूल के नैतिक-न्यायिक शब्दभार को बनाए रखते हैं; वाक्य की समानांतर संरचना को स्वाभाविक हिन्दी के अनुरूप हल्का रूप दिया गया है।
