  yaml_path: translation/ot/ezekiel/018/018.yaml
  text: As for his father[a], because he practiced extortion, robbed his brother, and did what was not good among his people, behold[d][c][b], he shall die in his iniquity.
translation:
  language: hi
  text: उसका पिता—क्योंकि उसने घोर अत्याचार किया, अपने भाई को बुरी तरह लूटा, और अपने लोगों के बीच वह किया जो अच्छा नहीं था—देखो,[a] वह अपने अधर्म में मरेगा।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में ‘देखो’ एक बलाघाती कथन-सूचक है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी का अर्थ ‘वह अपने अधर्म में मरता है’ या ‘वह अपने अधर्म में मर चुका है’ भी हो सकता है; पूर्ण क्रिया परिणाम को निश्चित रूप में प्रस्तुत करती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אָבִיו
  choice: उसका पिता
  rationale: तीसरे पुरुष एकवचन संबंधसूचक प्रत्यय को स्पष्ट रखता है और प्रसंग में धर्मी पुत्र के विपरीत पिता की ओर फिर से संकेत करता है।
- source_word: כִּי
  choice: क्योंकि
  rationale: पिता के निश्चित परिणाम का कारण प्रस्तुत करने वाली अर्थ-भूमिका को स्वाभाविक आधुनिक हिन्दी में स्पष्ट करता है।
- source_word: עָשַׁק עֹשֶׁק
  choice: घोर अत्याचार किया
  rationale: सजातीय क्रिया-संज्ञा के बलाघात को ‘घोर’ से व्यक्त किया गया है; ‘अत्याचार’ शोषण और उत्पीड़न दोनों की व्यापकता बनाए रखता है।
- source_word: גָּזַל גֵּזֶל אָח
  choice: अपने भाई को लूटा
  rationale: दूसरे सजातीय प्रयोग की तीव्रता को स्वाभाविक हिन्दी में व्यक्त करता है। ‘भाई’ मूल शब्द को रखता है, जबकि ‘अपने’ प्रसंगगत संबंध को सहज बनाता है; यह समुदाय के साथी सदस्य को भी सूचित कर सकता है।
- source_word: וַאֲשֶׁר לֹא טוֹב עָשָׂה
  choice: और ... वह किया जो अच्छा नहीं था
  rationale: इब्रानी के संयमित नकारात्मक मुहावरे को बचाता है और उसे स्वतः अधिक प्रबल ‘बुराई की’ में नहीं बदलता।
- source_word: בְּתוֹךְ עַמָּיו
  choice: अपने लोगों के बीच
  rationale: समुदाय के भीतर किए गए अन्याय की सामाजिक स्थिति को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: וְהִנֵּה
  choice: देखो
  rationale: भविष्यद्वक्ताई कथन के संकेतक और बलाघाती स्वर को वर्तमान, बोधगम्य हिन्दी में बनाए रखता है।
- source_word: מֵת
  choice: वह ... मरेगा
  rationale: रूपतः पूर्ण क्रिया निश्चित परिणाम को सामने रखती है; न्यायिक-भविष्यद्वक्ताई प्रसंग में हिन्दी भविष्यकाल उस निश्चित परिणति को स्वाभाविक रूप से व्यक्त करता है।
- source_word: בַּעֲוֹנוֹ
  choice: अपने अधर्म में
  rationale: व्यक्तिगत प्रत्यय और בְּ की ‘के भीतर/की अवस्था में’ वाली अस्पष्टता को बनाए रखता है; इसे केवल कारणवाचक ‘अधर्म के कारण’ में सीमित नहीं करता।
theological_decisions:
- issue: यहेजकेल 18 में पाप के लिए व्यक्तिगत उत्तरदायित्व
  choice: पिता अपने ही अधर्म में मरता है; व्यक्तिगत संबंधसूचक रूप और कारणवाचक संरचना स्पष्ट रखी गई है।
  alternative: इसे केवल दोष की अवस्था में मृत्यु का सामान्य कथन मानना, जिसमें व्यक्तिगत नैतिक उत्तरदायित्व पर कम बल हो।
  rationale: निकटवर्ती प्रसंग पीढ़ीगत नियतिवादी दंड की धारणा का प्रतिवाद करता है। अनुवाद पाठ के अपने व्यक्तिगत प्रत्ययों और कारण-संबंध को रखता है, पर कोई अतिरिक्त सिद्धान्त नहीं जोड़ता।
- issue: מֵת का काल और पक्ष
  choice: निश्चित भावी परिणाम के रूप में ‘मरेगा’।
  alternative: ‘मरता है’ अथवा ‘मर चुका है’।
  rationale: इब्रानी पूर्ण रूप परिणाम की निश्चितता सामने रख सकता है। हिन्दी भविष्यकाल इस न्यायिक घोषणा में अर्थ को स्वाभाविक बनाता है, जबकि पादटिप्पणी रूपगत विकल्प सुरक्षित रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी, सहज किंतु गरिमापूर्ण भविष्यद्वक्ताई शैली। मूल के दो सजातीय क्रिया-संज्ञा प्रयोगों का बल स्वाभाविक हिन्दी से व्यक्त किया गया है। ‘जो अच्छा नहीं था’ और ‘अपने अधर्म में’ जैसे पद जानबूझकर मूल की अर्थगत कसावट और संभावित अस्पष्टता को बनाए रखते हैं। सभी पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित हैं।
