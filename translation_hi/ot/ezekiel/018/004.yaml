  text: הֵ֤ן כָּל הַ/נְּפָשׁוֹת֙ לִ֣/י הֵ֔נָּה כְּ/נֶ֧פֶשׁ הָ/אָ֛ב וּ/כְ/נֶ֥פֶשׁ הַ/בֵּ֖ן לִ/י הֵ֑נָּה הַ/נֶּ֥פֶשׁ הַ/חֹטֵ֖את הִ֥יא תָמֽוּת־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/018/004.yaml
  text: Look[a], every life belongs to me. The life of the father is like the life of the son—both belong to me. The person who sins is the one who will die.
translation:
  language: hi
  text: देखो, हर व्यक्ति का जीवन[a] मेरा है। जैसे पिता का जीवन मेरा है, वैसे ही पुत्र का जीवन भी मेरा है। जो व्यक्ति पाप करता है, वही मरेगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “सभी प्राण मेरे हैं ... पाप करने वाला प्राण ही मरेगा।” हिब्रू शब्द נֶפֶשׁ का अर्थ प्रसंग के अनुसार ‘प्राण,’ ‘जीवन,’ ‘स्वयं’ या ‘व्यक्ति’ हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן
  choice: देखो
  rationale: यह शब्द ध्यान आकर्षित करते हुए एक बलपूर्ण घोषणा आरम्भ करता है। ‘देखो’ आधुनिक हिन्दी में स्वाभाविक है और हिब्रू के उद्गारात्मक बल को बनाए रखता है।
- source_word: כָּל הַנְּפָשׁוֹת
  choice: हर व्यक्ति का जीवन
  rationale: נֶפֶשׁ का अर्थ प्रसंगानुसार प्राण, जीवन, स्वयं या व्यक्ति हो सकता है। यहाँ ‘हर व्यक्ति का जीवन’ परमेश्वर के अधिकार और आगे आने वाली व्यक्तिगत जवाबदेही—दोनों को स्पष्ट करता है।
- source_word: לִי הֵנָּה
  choice: मेरा है / दोनों मेरे हैं
  rationale: हिब्रू में सीधा स्वामित्व व्यक्त किया गया है। हिन्दी में ये रूप उसी दावे को सहज ढंग से व्यक्त करते हैं।
- source_word: כְּנֶפֶשׁ הָאָב וּכְנֶפֶשׁ הַבֵּן
  choice: पिता का जीवन हो या पुत्र का
  rationale: כְּ...וּכְּ की समांतर रचना पिता और पुत्र को परमेश्वर के सामने समान स्तर पर रखती है। ‘हो या’ हिन्दी में इस समान समावेश को स्वाभाविक रूप से व्यक्त करता है, बिना उनके जीवनों को गुणात्मक रूप से समान ठहराने का अतिरिक्त अर्थ जोड़े।
- source_word: הַנֶּפֶשׁ הַחֹטֵאת
  choice: जो व्यक्ति पाप करता है
  rationale: अन्तिम उपवाक्य में נֶפֶשׁ नैतिक कर्म करने वाले व्यक्ति को सूचित करता है। यह चयन आधुनिक हिन्दी में स्पष्ट है और ‘आत्मा’ से जुड़ी संकुचित दार्शनिक धारणाएँ आरोपित नहीं करता।
- source_word: הִיא תָמוּת
  choice: वही मरेगा
  rationale: स्त्रीलिंग सर्वनाम הִיא का लिंग נֶפֶשׁ के व्याकरणिक लिंग के कारण है; वह किसी स्त्री को विशेष रूप से नहीं दर्शाता। ‘वही’ कर्ता की बलपूर्ण पहचान और व्यक्तिगत परिणाम दोनों को सुरक्षित रखता है।
theological_decisions:
- issue: नֶפֶשׁ का अनुवाद ऐसे प्रसंग में करना जिसे आत्मा के स्वरूप से जोड़ा जाता है
  choice: स्वामित्व वाले कथनों में ‘जीवन’ और जवाबदेही वाले कथन में ‘व्यक्ति’
  alternative: पूरे पद में ‘प्राण’ या ‘आत्मा’
  rationale: यह पद मुख्यतः सभी मानव जीवनों पर परमेश्वर के अधिकार और पाप करने वाले व्यक्ति की जवाबदेही की घोषणा करता है। ‘आत्मा’ आधुनिक पाठक को अमूर्त, देह से पृथक तत्व का अधिक संकीर्ण अर्थ दे सकता है, जिसकी माँग हिब्रू यहाँ नहीं करता। पादटिप्पणी वास्तविक शाब्दिक विकल्प को खुला रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण और सार्वजनिक पाठ के योग्य रूप अपनाया गया है। ‘देखो’ बलपूर्ण किन्तु प्रचलित है; ‘वही मरेगा’ मूल की व्यक्तिगत जवाबदेही और emphatic identification को स्पष्ट रखता है।
