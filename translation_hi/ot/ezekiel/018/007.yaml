id: EZK.18.7
reference: Ezekiel 18:7
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/אִישׁ֙ לֹ֣א יוֹנֶ֔ה חֲבֹלָת֥/וֹ חוֹב֙ יָשִׁ֔יב גְּזֵלָ֖ה לֹ֣א יִגְזֹ֑ל לַחְמ/וֹ֙ לְ/רָעֵ֣ב יִתֵּ֔ן וְ/עֵירֹ֖ם יְכַסֶּה בָּֽגֶד־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/018/007.yaml
  text: He does not oppress anyone[a], but restores the debtor’s pledge; he does not commit robbery[c][b]; he gives his bread to the hungry and covers the naked with a garment.
translation:
  language: hi
  text: वह किसी पर अत्याचार नहीं करता, कर्ज़ के बदले ली गई गिरवी लौटा देता है[a], लूटपाट नहीं करता; वह अपना भोजन[b] भूखे को देता है और वस्त्रहीन को वस्त्र से ढकता है[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘ऋणी को उसकी गिरवी लौटा देता है।’
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से ‘अपनी रोटी’; यहाँ आशय भोजन से है।
    reason: lexical_alternative
  - marker: c
    text: अर्थात वस्त्रहीन को कपड़ा पहनाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: יוֹנֶה
  choice: अत्याचार करता
  rationale: हिफ़ील रूप सामाजिक या आर्थिक रूप से दबाने, शोषण करने अथवा अनुचित व्यवहार करने का भाव रखता है। ‘अत्याचार करता’ इस नैतिक संदर्भ में स्वाभाविक और व्यापक है।
- source_word: אִישׁ
  choice: किसी पर
  rationale: यहाँ אִישׁ कर्म के रूप में सामान्य अर्थ रखता है; ‘किसी पर’ आधुनिक हिन्दी में किसी भी व्यक्ति को समेटता है।
- source_word: חֲבֹלָתוֹ חוֹב יָשִׁיב
  choice: कर्ज़ के बदले ली गई गिरवी लौटा देता है
  rationale: यह पदबंध ऋण की जमानत के रूप में ली गई वस्तु लौटाने की बात करता है। यह अनुवाद संबंध को स्पष्ट करता है, पर यह नहीं मानता कि गिरवी किस विशेष वस्तु की थी।
- source_word: גְּזֵלָה לֹא יִגְזֹל
  choice: लूटपाट नहीं करता
  rationale: सजातीय संज्ञा और क्रिया का प्रयोग जबरन छीनने या लूटने पर बल देता है। ‘लूटपाट’ हिन्दी में उस प्रबल भाव को संक्षेप में व्यक्त करता है।
- source_word: לַחְמוֹ
  choice: अपना भोजन
  rationale: शाब्दिक अर्थ ‘उसकी रोटी’ है, पर इस प्रसंग में ‘रोटी’ सामान्य भोजन का द्योतक है। ‘अपना भोजन’ आधुनिक हिन्दी में आशय स्पष्ट करता है और स्वामित्व बनाए रखता है।
- source_word: לְרָעֵב
  choice: भूखे को
  rationale: विशेषण यहाँ संज्ञा की तरह प्रयुक्त है। ‘भूखे को’ स्वाभाविक हिन्दी है और अभावग्रस्त व्यक्ति पर ध्यान बनाए रखता है।
- source_word: עֵירֹם
  choice: वस्त्रहीन
  rationale: यह शब्द नग्न अथवा पर्याप्त वस्त्र से वंचित व्यक्ति के लिए है। ‘वस्त्रहीन’ गरिमापूर्ण और प्रसंगानुकूल है।
- source_word: יְכַסֶּה בָּגֶד
  choice: वस्त्र से ढकता है
  rationale: यह चयन मूल की ‘ढकना’ क्रिया और ‘वस्त्र’ संज्ञा दोनों को सुरक्षित रखते हुए सुबोध हिन्दी देता है।
theological_decisions:
- issue: धर्मी व्यक्ति के वर्णन में पुल्लिंग एकवचन कर्ता
  choice: वह किसी पर अत्याचार नहीं करता
  alternative: ऐसा मनुष्य किसी दूसरे पर अत्याचार नहीं करता
  rationale: पद पिछले संदर्भ के प्रतिनिधि धर्मी व्यक्ति का वर्णन जारी रखता है। ‘वह’ मूल के एकवचन क्रम को बनाए रखता है, जबकि ‘किसी पर’ निषेध के सामान्य दायरे को स्पष्ट करता है।
- issue: गिरवी लौटाने वाले वाक्यांश में संबंध
  choice: कर्ज़ के बदले ली गई गिरवी लौटा देता है
  alternative: ऋणी की गिरवी लौटा देता है
  rationale: मूल में ऋण और गिरवी का संबंध स्पष्ट है, पर हिन्दी में ‘ऋणी की’ कहने से स्वामित्व या संबंध कुछ अधिक निश्चित हो सकता है। चुना गया रूप मूल की कानूनी-आर्थिक परिस्थिति बताता है और अनावश्यक विशिष्टीकरण से बचता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सामान्य पाठक के लिए सुबोध शैली रखी गई है। ‘अत्याचार’, ‘गिरवी’ और ‘लूटपाट’ सामाजिक-आर्थिक नैतिकता को स्पष्ट करते हैं; ‘वस्त्रहीन’ अनावश्यक कठोरता के बिना मूल अर्थ को व्यक्त करता है।
