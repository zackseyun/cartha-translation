  text: וּ/בְ/שׁ֨וּב צַדִּ֤יק מִ/צִּדְקָת/וֹ֙ וְ/עָ֣שָׂה עָ֔וֶל כְּ/כֹ֨ל הַ/תּוֹעֵב֜וֹת אֲשֶׁר עָשָׂ֧ה הָ/רָשָׁ֛ע יַעֲשֶׂ֖ה וָ/חָ֑י כָּל צדקת/ו אֲשֶׁר עָשָׂה֙ לֹ֣א תִזָּכַ֔רְנָה בְּ/מַעֲל֧/וֹ אֲשֶׁר מָעַ֛ל וּ/בְ/חַטָּאת֥/וֹ אֲשֶׁר חָטָ֖א בָּ֥/ם יָמֽוּת־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/018/024.yaml
  text: But when a righteous man turns away from his righteousness and does injustice[a], doing all the abominations that the wicked man does, shall he live? None of the righteous deeds that he has done will be remembered. In the treachery by which he has acted treacherously[c][b], and in the sin that he has committed—in them he shall die.
translation:
  language: hi
  text: पर जब कोई धर्मी अपनी धार्मिकता से फिर जाए और अन्याय करे, और वे सारे घृणित काम करे जो दुष्ट करता है, तो क्या वह जीवित रहेगा? उसके किए हुए धर्मी कामों में से एक भी याद नहीं किया जाएगा। उसके किए हुए विश्वासघात में और उस पाप में जो उसने किया है—उन्हीं में वह मरेगा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבְשׁוּב צַדִּיק מִצִּדְקָתוֹ
  choice: पर जब कोई धर्मी अपने धर्म के मार्ग से फिरकर
  rationale: שׁוּב מן पूर्व अवस्था या आचरण से मुड़ने को दर्शाता है। ‘धर्म के मार्ग’ हिंदी में नैतिक आचरण का आशय स्वाभाविक रूप से स्पष्ट करता है और צַדִּיק/צִדְקָה का शब्द-संबंध बनाए रखता है।
- source_word: וְעָשָׂה עָוֶל
  choice: अन्याय करने लगे
  rationale: עָוֶל अन्याय, बुराई या अधर्म को सूचित करता है। ‘अन्याय’ आधुनिक और गंभीर नैतिक शब्द है; ‘करने लगे’ मुड़ने के बाद के आचरण को सहज हिंदी में व्यक्त करता है।
- source_word: כְּכֹל הַתּוֹעֵבוֹת
  choice: वे सब घिनौने काम
  rationale: תּוֹעֵבוֹת प्रबल नैतिक और वाचा-संबंधी घृणितता व्यक्त करता है। ‘घिनौने काम’ साधारण पाठक के लिए ‘घृणित कामों’ से अधिक सहज है, फिर भी शब्द की तीव्रता रखता है।
- source_word: יַעֲשֶׂה וָחָי
  choice: करे ... तो क्या वह जीवित रहेगा?
  rationale: इब्रानी में यह जीवन के विषय में अलंकारिक प्रश्न है। हिंदी प्रश्नवाचक रचना उसके न्यायिक बल को बनाए रखती है।
- source_word: כָּל צִדְקֹתָו ... לֹא תִזָּכַרְנָה
  choice: उसने जो भी धर्म के काम किए थे, उनमें से कोई याद नहीं किया जाएगा
  rationale: बहुवचन צִדְקֹתָו उसके धर्मपूर्ण कार्यों को दर्शाता है। नकार के साथ ‘कोई ... नहीं’ यह स्पष्ट करता है कि एक भी पूर्व धर्मकार्य स्मरण में नहीं रखा जाएगा।
- source_word: בְּמַעֲלוֹ אֲשֶׁר מָעַל
  choice: उसने जो विश्वासघात किया
  rationale: מעל का संज्ञा-क्रिया युग्म निष्ठा भंग करने पर बल देता है। हिंदी में उसी धातु-संज्ञा की पुनरुक्ति कृत्रिम होती; ‘विश्वासघात किया’ वाचा या निष्ठा तोड़ने का आशय सुरक्षित रखता है।
- source_word: וּבְחַטָּאתוֹ אֲשֶׁר חָטָא
  choice: और जो पाप किया
  rationale: इब्रानी सजातीय रचना व्यक्तिगत दोष पर बल देती है। हिंदी में संक्षिप्त रूप स्वाभाविक है और अर्थ को पूरा रखता है।
- source_word: בָּם יָמוּת
  choice: उन्हीं के कारण वह मरेगा
  rationale: शाब्दिक ‘उन्हीं में’ हिंदी में अस्पष्ट और अस्वाभाविक होगा। यहाँ בְּ कारण या आधार का भाव दे सकता है और बहुवचन सर्वनाम पहले बताए विश्वासघात तथा पाप की ओर लौटता है।
theological_decisions:
- issue: क्या पद को संचित पुण्य के नष्ट होने या वर्तमान धर्मत्याग के लिए न्यायिक उत्तरदायित्व के किसी बाद के सिद्धांत के रूप में समझाया जाए
  choice: पूर्व धर्मपूर्ण कार्य याद नहीं किए जाएंगे और व्यक्ति अपने विश्वासघात तथा पाप के कारण मरेगा—पद के इसी न्यायिक कथन को यथावत रखा गया है।
  alternative: इसे संचित पुण्य की हानि, अनन्त उद्धार की निश्चित हानि, या केवल सामाजिक परिणाम के किसी विशिष्ट सिद्धांत के रूप में स्पष्ट करना।
  rationale: यहेजकेल 18 व्यक्तिगत नैतिक उत्तरदायित्व पर केंद्रित है। अनुवाद पद की धर्मवैचारिक तीव्रता को बनाए रखता है, पर उससे व्यापक सिद्धांतगत विवाद का निर्णय नहीं कराता।
translation_notes:
  register: आधुनिक मानक हिंदी, गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। ‘धर्मी’, ‘दुष्ट’, ‘पाप’ और ‘विश्वासघात’ जैसे स्थापित बाइबिलीय शब्द रखे गए हैं; अत्यधिक संस्कृतनिष्ठ ‘अधर्म/घृणित कृत्य’ तथा पुरातन वाक्य-विन्यास से बचा गया है।
