source:
  edition: WLC
  text: הַשְׁלִ֣יכוּ מֵ/עֲלֵי/כֶ֗ם אֶת כָּל פִּשְׁעֵי/כֶם֙ אֲשֶׁ֣ר פְּשַׁעְתֶּ֣ם בָּ֔/ם וַ/עֲשׂ֥וּ לָ/כֶ֛ם לֵ֥ב חָדָ֖שׁ וְ/ר֣וּחַ חֲדָשָׁ֑ה וְ/לָ֥/מָּה תָמֻ֖תוּ בֵּ֥ית יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/018/031.yaml
  text: Cast away from yourselves all your transgressions by which you have transgressed[a], and make for yourselves a new heart and a new spirit. Why should you die, O house of Israel?
translation:
  language: hi
  text: अपने ऊपर से अपने सारे अपराध फेंक दो, जिनमें तुमने अपराध किया है[a], और अपने लिए एक नया हृदय और एक नई आत्मा बनाओ। हे इस्राएल के घराने, तुम क्यों मरो?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अपने सारे विद्रोह फेंक दो, जिनमें तुमने विद्रोह किया है।” इब्रानी में ‘अपराधों’ और ‘अपराध किया’ के लिए एक ही शब्द-मूल दोहराया गया है, जो दोष की जिम्मेदारी पर बल देता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשְׁלִיכוּ מֵעֲלֵיכֶם
  choice: अपने ऊपर से ... फेंक दो
  rationale: बहुवचन आज्ञा की प्रबलता और מֵעֲלֵיכֶם के शाब्दिक ‘अपने ऊपर से’ भाव को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: פִּשְׁעֵיכֶם אֲשֶׁר פְּשַׁעְתֶּם בָּם
  choice: अपने सारे अपराधों ... जिनसे तुमने अपराध किया है
  rationale: संज्ञा और उसी धातु से बने क्रिया-रूप की इब्रानी पुनरुक्ति को हिन्दी में भी सुनाई देता है; ‘अपराध’ विद्रोह और उल्लंघन के अर्थ-क्षेत्र को यहाँ पर्याप्त रूप से व्यक्त करता है।
- source_word: וַעֲשׂוּ לָכֶם
  choice: अपने लिए ... बनाओ
  rationale: עשה और लाभसूचक לָכֶם को निकटता से व्यक्त करता है तथा मनुष्य की जिम्मेदारी वाली प्रत्यक्ष आज्ञा को नरम नहीं करता।
- source_word: לֵב חָדָשׁ
  choice: एक नया हृदय
  rationale: यहेजकेल की प्रमुख रूपकात्मक शब्दावली और आंतरिक अभिवृत्ति के अर्थ को सुरक्षित रखता है।
- source_word: רוּחַ חֲדָשָׁה
  choice: एक नई आत्मा
  rationale: רוּחַ के आंतरिक जीवन या प्रवृत्ति संबंधी अर्थ और ‘हृदय’ के साथ उसके युग्म को बनाए रखता है; हिन्दी बाइबलीय प्रयोग में ‘नई आत्मा’ स्वाभाविक है।
- source_word: וְלָמָּה תָמֻתוּ
  choice: तुम क्यों मरो?
  rationale: यह भविष्यवाणी मात्र नहीं, बल्कि आग्रहपूर्ण आलंकारिक प्रश्न है; सम्भावनार्थक ‘मरो’ इस बल को संक्षेप में व्यक्त करता है।
- source_word: בֵּית יִשְׂרָאֵל
  choice: हे इस्राएल के घराने
  rationale: प्रत्यक्ष संबोधन और सामूहिक वाचा-समुदाय के भाव को गरिमापूर्ण आधुनिक हिन्दी में रखता है।
theological_decisions:
- issue: नया हृदय और नई आत्मा बनाने की मानवीय आज्ञा तथा परमेश्वर द्वारा उन्हें दिए जाने के बीच तनाव
  choice: ‘अपने लिए एक नया हृदय और एक नई आत्मा बनाओ’ के प्रत्यक्ष आज्ञार्थक रूप को बनाए रखा गया।
  alternative: ‘नया हृदय और नई आत्मा पा लो’ कहना या यह स्पष्ट करना कि केवल परमेश्वर ही इन्हें देता है।
  rationale: इस पद का इब्रानी पाठ मनुष्य को सीधे आज्ञा देता है। यहेजकेल 36 जैसे स्थलों से सामंजस्य बैठाने के लिए इस कथन को नरम करना पाठ में निहित धर्मवैज्ञानिक तनाव को समय से पहले सुलझा देता।
- issue: פשע संज्ञा और क्रिया की पुनरुक्ति
  choice: ‘अपराधों ... अपराध किया’
  alternative: ‘विद्रोहों ... विद्रोह किया’
  rationale: दोनों अर्थ सम्भव हैं। ‘अपराध’ सामान्य पाठक के लिए स्वाभाविक है, जबकि समान शब्द-मूल की पुनरावृत्ति दोष की जिम्मेदारी पर मूल पाठ के जोर को बनाए रखती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और प्रत्यक्ष भविष्यद्वाणी-संबोधन के अनुरूप है। ‘फेंक दो’ आज्ञा की तीव्रता रखता है; ‘हे इस्राएल के घराने’ औपचारिक संबोधन को स्वाभाविक हिन्दी में व्यक्त करता है।
