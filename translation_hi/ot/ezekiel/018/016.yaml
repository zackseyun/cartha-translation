  yaml_path: translation/ot/ezekiel/018/016.yaml
  text: He has not oppressed anyone[a], has not taken a pledge, and has not robbed[b]; he has given his bread to the hungry and covered the naked with a garment.
translation:
  language: hi
  text: उसने किसी पर अत्याचार नहीं किया, किसी से गिरवी[a] नहीं लिया, और किसी को नहीं लूटा; उसने अपनी रोटी भूखे को दी और नंगे को वस्त्र से ढका।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात् ऋण के बदले रखी गई गिरवी या प्रतिज्ञा-वस्तु; इब्रानी में इसे लेना, विशेषकर अनुचित ढंग से लेना, अभिप्रेत हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ לֹא הוֹנָה
  choice: किसी पर अत्याचार नहीं किया
  rationale: אִישׁ निषेध के साथ सामान्य अर्थ में ‘किसी’ को दर्शाता है, और הוֹנָה सामाजिक-अन्याय के संदर्भ में सताने या अत्याचार करने का भाव रखता है।
- source_word: חֲבֹל לֹא חָבָל
  choice: बंधक नहीं लिया
  rationale: एक ही मूल से बने संज्ञा-क्रिया प्रयोग का आशय ऋण के बदले गिरवी या बंधक लेना है। ‘बंधक’ कानूनी-आर्थिक संदर्भ को संक्षेप और स्वाभाविक रूप से व्यक्त करता है।
- source_word: גְזֵלָה לֹא גָזָל
  choice: न किसी को लूटा
  rationale: संज्ञा-क्रिया युग्म बलपूर्वक या अन्यायपूर्वक छीनने का प्रबल भाव देता है; ‘लूटा’ सामान्य ‘चोरी की’ से अधिक सटीक है।
- source_word: לַחְמוֹ
  choice: अपनी रोटी
  rationale: प्रत्यय ‘उसकी’ को दर्शाता है और לֶחֶם का ठोस अर्थ ‘रोटी’ है; ‘अपनी रोटी’ साझा किए गए निजी आहार की छवि बनाए रखता है।
- source_word: לְרָעֵב
  choice: भूखे को
  rationale: विशेषण यहाँ संज्ञा की तरह प्रयुक्त है और भूखे व्यक्ति को दर्शाता है।
- source_word: וְעֵרוֹם כִּסָּה בָגֶד
  choice: नंगे को वस्त्र पहनाया
  rationale: शाब्दिक संरचना ‘नंगे को वस्त्र से ढका’ है। आधुनिक हिन्दी में ‘वस्त्र पहनाया’ वही ठोस सहायता स्वाभाविक और गरिमापूर्ण ढंग से व्यक्त करता है।
