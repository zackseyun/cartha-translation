base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/018/026.yaml
  text: When a righteous man turns away from his righteousness and does injustice[a], and dies because of them[b], he shall die for the injustice that he has done.
translation:
  language: hi
  text: जब कोई धर्मी मनुष्य अपनी धार्मिकता से फिरकर अन्याय[a] करता है और उन्हीं कर्मों के कारण मर जाता है[b], तो वह अपने किए हुए अन्याय के कारण मरेगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “गलत काम” अथवा “अधर्म।” इब्रानी शब्द עָוֶל में अन्याय, गलत काम और अधर्म का भाव है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से “उनके कारण”; इब्रानी में सर्वनाम बहुवचन है और वह अभी बताए गए अन्यायपूर्ण कर्मों की ओर संकेत करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּשׁוּב
  choice: जब ... से फिरकर
  rationale: בְּ + infinitive construct एक कालवाचक उपवाक्य बनाता है; שוב के साथ מִ यहाँ पहले की अवस्था से हटने का अर्थ देता है।
- source_word: צַדִּיק
  choice: कोई धर्मी मनुष्य
  rationale: एकवचन पुल्लिंग विशेषण यहाँ संज्ञा के रूप में एक सामान्य व्यक्तिगत उदाहरण के लिए प्रयुक्त है।
- source_word: מִצִּדְקָתוֹ
  choice: अपनी धार्मिकता से
  rationale: यहाँ צְדָקָה नैतिक धार्मिकता अथवा धर्ममय आचरण को दर्शाती है; 'धार्मिकता' मूल पद और निकटवर्ती विरोध को बनाए रखता है।
- source_word: וְעָשָׂה עָוֶל
  choice: अन्याय करता है
  rationale: עָוֶל में अन्याय, गलत काम और अधर्म का अर्थक्षेत्र है; 'अन्याय करता है' मूल क्रिया-संज्ञा संरचना तथा नैतिक-न्यायिक बल को स्वाभाविक हिन्दी में रखता है।
- source_word: וּמֵת עֲלֵיהֶם
  choice: और उन्हीं कर्मों के कारण मर जाता है
  rationale: עֲלֵיהֶם का बहुवचन प्रत्यय पूर्वोक्त अन्यायपूर्ण कर्मों की ओर संकेत करता है और यहाँ कारणसूचक है; हिन्दी में संदर्भ स्पष्ट करने के लिए 'उन्हीं कर्मों' कहा गया है।
- source_word: בְּעַוְלוֹ אֲשֶׁר עָשָׂה
  choice: अपने किए हुए अन्याय के कारण
  rationale: בְּ यहाँ कारण बताता है और संबंधवाचक वाक्यांश उस व्यक्ति के अपने किए हुए अन्याय पर बल देता है।
- source_word: יָמוּת
  choice: मरेगा
  rationale: अपूर्ण क्रिया यहाँ सुनिश्चित परिणाम अथवा सामान्य न्यायिक सिद्धान्त व्यक्त करती है; हिन्दी का भविष्यत् रूप इसे स्वाभाविक रूप से व्यक्त करता है।
theological_decisions:
- issue: क्या पद को धर्मत्याग या दृढ़ बने रहने से जुड़े बाद के धर्मसैद्धान्तिक विवादों का निर्णय करने वाली भाषा में प्रस्तुत किया जाए
  choice: धर्मी मनुष्य के अपनी धार्मिकता से फिरने, अन्याय करने और उसके कारण मरने की शर्तयुक्त नैतिक चेतावनी को सीधे अनूदित किया गया है।
  alternative: इसे अंतिम धर्मत्याग पर विशेष बल देने या वास्तविक रूप से फिरने की बात को कम करने वाली भाषा में प्रस्तुत करना।
  rationale: इब्रानी पाठ चेतावनी को वास्तविक और स्पष्ट रूप में रखता है, पर व्यापक व्यवस्थित धर्मसिद्धान्त का निर्णय इस पद में स्वयं नहीं करता; इसलिए मूल तनाव सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य शैली। 'धर्मी मनुष्य' और 'धार्मिकता' मूल के पुल्लिंग एकवचन तथा नैतिक शब्दावली को बनाए रखते हैं। दोनों पादटिप्पणी-चिह्न मुख्य पाठ में दिए गए हैं।
