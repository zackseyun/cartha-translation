source:
  edition: WLC
  text: הַ/נֶּ֥פֶשׁ הַ/חֹטֵ֖את הִ֣יא תָמ֑וּת בֵּ֞ן לֹא יִשָּׂ֣א בַּ/עֲוֺ֣ן הָ/אָ֗ב וְ/אָב֙ לֹ֤א יִשָּׂא֙ בַּ/עֲוֺ֣ן הַ/בֵּ֔ן צִדְקַ֤ת הַ/צַּדִּיק֙ עָלָ֣י/ו תִּֽהְיֶ֔ה וְ/רִשְׁעַ֥ת רשע עָלָ֥י/ו תִּֽהְיֶֽה־׀׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/018/020.yaml
  text: The person who sins—he shall die[a]. A son shall not bear the iniquity of the father, and a father shall not bear the iniquity of the son. The righteousness of the righteous shall be upon him[b], and the wickedness of the wicked shall be upon him.
translation:
  language: hi
  text: जो व्यक्ति पाप करता है, वही मरेगा[a]। पुत्र पिता के अधर्म का भार नहीं उठाएगा[b], और पिता पुत्र के अधर्म का भार नहीं उठाएगा। धर्मी की धार्मिकता उसी पर होगी, और दुष्ट की दुष्टता उसी पर होगी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक शाब्दिक रूप में: “पाप करने वाला प्राणी, वही मरेगा।” यहाँ “प्राणी” (हिब्रू: नेफ़ेश) से आशय स्वयं व्यक्ति से है।'
    reason: lexical_alternative
  - marker: b
    text: “अधर्म का भार उठाना” एक हिब्रू विधिक मुहावरा है, जिसमें अपराध का दोष और उससे जुड़ा दायित्व—दोनों सम्मिलित हो सकते हैं।
    reason: cultural_note
lexical_decisions:
- source_word: הַנֶּפֶשׁ
  choice: व्यक्ति
  rationale: यहाँ נֶפֶשׁ किसी अलग अमूर्त ‘आत्मा’ के बजाय उत्तरदायी जीवित व्यक्ति को दर्शाता है; ‘व्यक्ति’ आधुनिक हिन्दी में इस आशय को स्वाभाविक रूप से व्यक्त करता है।
- source_word: הַחֹטֵאת
  choice: जो ... पाप करता है
  rationale: हिब्रू कृदन्त सामान्य और चरित्रगत कर्म का भाव देता है; यह हिन्दी रूप उस व्यापक कथन को बनाए रखता है।
- source_word: הִיא תָמוּת
  choice: वही मरेगा
  rationale: ‘वही’ हिब्रू के स्पष्ट सर्वनाम का बल सुरक्षित रखता है, और ‘मरेगा’ न्यायिक भविष्यवचन को सहज हिन्दी में व्यक्त करता है।
- source_word: בֵּן / אָב
  choice: पुत्र / पिता
  rationale: मूल के एकवचन पुल्लिंग और पिता-पुत्र के परस्पर समानांतर कानूनी कथन को यथावत रखा गया है।
- source_word: יִשָּׂא בַּעֲוֹן
  choice: अधर्म का भार उठाएगा
  rationale: यह हिब्रू विधिक मुहावरे की भार-वाली छवि बचाता है; ‘अधर्म’ में अपराध तथा उससे जुड़ी जवाबदेही दोनों की गुंजाइश रहती है।
- source_word: צִדְקַת הַצַּדִּיק
  choice: धर्मी की धार्मिकता
  rationale: संज्ञा और विशेषण की समान मूल वाली पुनरुक्ति तथा नैतिक-विधिक समानांतरता सुरक्षित रहती है।
- source_word: וְרִשְׁעַת רָשָׁע
  choice: दुष्ट की दुष्टता
  rationale: यह पिछले खंड के साथ मूल की अलंकारिक और वैचारिक समरूपता बनाए रखता है।
- source_word: עָלָיו תִּהְיֶה
  choice: उसी पर रहेगी
  rationale: ‘उसी पर’ व्यक्तिगत जवाबदेही पर बल देता है और हिब्रू पूर्वसर्गीय रूपक को अनावश्यक व्याख्या के बिना बनाए रखता है।
theological_decisions:
- issue: נֶפֶשׁ का मानवशास्त्रीय अर्थ
  choice: मुख्य पाठ में ‘व्यक्ति’
  alternative: ‘प्राण’ या ‘आत्मा’
  rationale: संदर्भ व्यक्तिगत नैतिक उत्तरदायित्व का है, आत्मा की प्रकृति पर तकनीकी कथन का नहीं; इसलिए ऐसा शब्द चुना गया है जो बाद की दार्शनिक धारणाएँ न जोड़े।
- issue: प्रतिनिधिक पुल्लिंग भाषा
  choice: ‘पुत्र’ और ‘पिता’ बनाए रखे
  alternative: ‘सन्तान’ और ‘माता-पिता’
  rationale: मूल पाठ की एकवचन पुल्लिंग और परस्पर पिता-पुत्र संरचना को सुरक्षित रखा गया है, बिना उसके सामान्य नैतिक अनुप्रयोग को सीमित किए।
- issue: עָוֹן में अपराध और दायित्व की व्यापकता
  choice: ‘अधर्म का भार उठाना’
  alternative: ‘दोषी ठहरना’ या ‘दण्ड पाना’
  rationale: अधिक व्याख्यात्मक विकल्प अभिव्यक्ति को केवल दोष या केवल दण्ड तक सीमित कर सकते हैं; चुना हुआ रूप मूल की वास्तविक अस्पष्टता बनाए रखता है।
- issue: व्यक्तिगत नैतिक फल का सूत्र
  choice: धार्मिकता और दुष्टता ‘उसी पर रहेगी’
  alternative: ‘उसी को उसका फल मिलेगा’
  rationale: वैकल्पिक रूप प्रतिफल की धारणा स्पष्ट रूप से जोड़ देता, जबकि मूल केवल यह कहता है कि उसकी धार्मिकता या दुष्टता उसी पर होगी।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘अधर्म का भार उठाना’ मूल के विधिक रूपक को बचाते हुए हिन्दी में स्वाभाविक है; ‘उसी पर रहेगी’ जानबूझकर कुछ औपचारिक रखा गया है ताकि मूल की नैतिक जवाबदेही और अस्पष्टता बनी रहे।
