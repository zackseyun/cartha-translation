- source_word: גְּזֵלוֹת גָּזָל
  choice: लूटपाट की
  rationale: सजातीय संज्ञा और क्रिया का प्रयोग बलपूर्वक या अन्यायपूर्वक छीनने पर जोर देता है। ‘लूटपाट की’ उस तीव्रता को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: חֲבֹל לֹא יָשִׁיב
  choice: गिरवी रखी वस्तु नहीं लौटाई
  rationale: חֲבֹל ऋण के बदले ली गई गिरवी या बंधक वस्तु है। स्पष्टता के लिए केवल ‘गिरवी’ के बजाय ‘गिरवी रखी वस्तु’ कहा गया है।
- source_word: וְאֶל־הַגִּלּוּלִים נָשָׂא עֵינָיו
  choice: मूरतों की ओर अपनी आँखें उठाईं
  rationale: यह अनुवाद आँखें उठाने की इब्रानी छवि को बनाए रखता है और संदर्भ में मूरतों की ओर श्रद्धापूर्ण या उपासना-संबंधी रुख का संकेत देता है, बिना उसे व्याख्यात्मक रूप से केवल ‘पूजा की’ बना देने के।
- source_word: הַגִּלּוּלִים
  choice: मूरतों
  rationale: मुख्य पाठ में ‘मूरतों’ सामान्य पाठक के लिए स्पष्ट है; मूल शब्द का तिरस्कारपूर्ण भाव पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: תּוֹעֵבָה עָשָׂה
  choice: घिनौना काम किया
  rationale: यह पद परमेश्वर की दृष्टि में नैतिक या धार्मिक रूप से घृणित कार्य को बताता है। ‘घिनौना काम किया’ अर्थ और गंभीरता को स्पष्ट, वर्तमान हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: मूरतों की ओर आँखें उठाने वाले मुहावरे का धार्मिक अर्थ
  choice: मूरतों की ओर अपनी आँखें उठाईं
  alternative: मूरतों की पूजा की
  rationale: संदर्भ में यह मुहावरा मूर्तिपूजक श्रद्धा या भक्ति का संकेत देता है, पर मूल पाठ उपासना की सीधी क्रिया के बजाय आँखें उठाने की छवि रखता है। उसी छवि को बनाए रखने से पाठ की वास्तविक अभिव्यक्ति और उसका निहित धार्मिक बल दोनों सुरक्षित रहते हैं।
