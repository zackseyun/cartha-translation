base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/018/012.yaml
  text: He has oppressed the poor and needy[a], committed robbery, not returned a pledge, lifted up his eyes to the idols, and done an abomination.
translation:
  language: hi
  text: उसने निर्धनों और जरूरतमंदों पर अत्याचार किया, लूटपाट की, बंधक रखी वस्तु नहीं लौटाई, मूर्तियों[a] की ओर अपनी आँखें उठाईं और घृणित काम किया।
  philosophy: optimal-equivalence
