id: EZK.18.6
reference: Ezekiel 18:6
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: אֶל הֶֽ/הָרִים֙ לֹ֣א אָכָ֔ל וְ/עֵינָי/ו֙ לֹ֣א נָשָׂ֔א אֶל גִּלּוּלֵ֖י בֵּ֣ית יִשְׂרָאֵ֑ל וְ/אֶת אֵ֤שֶׁת רֵעֵ֨/הוּ֙ לֹ֣א טִמֵּ֔א וְ/אֶל אִשָּׁ֥ה נִדָּ֖ה לֹ֥א יִקְרָֽב־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/018/006.yaml
  text: he does not eat on the mountains[a], does not lift up his eyes to the idols of the house of Israel, does not defile his neighbor’s wife[c][b], and does not approach a woman during her menstrual impurity.
translation:
  language: hi
  text: वह पहाड़ों पर भोजन नहीं करता[a], इस्राएल के घराने की मूरतों[b] की ओर अपनी आँखें नहीं उठाता, अपने पड़ोसी की पत्नी को अपवित्र नहीं करता, और मासिक धर्म की अशुद्धता के समय किसी स्त्री के पास नहीं जाता[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “पहाड़ी पूजा-स्थानों पर भोजन नहीं करता”; यह वाक्यांश ऊँचे स्थानों पर बलि-भोज में भाग लेने की ओर संकेत करता है।
    reason: alternative_reading
  - marker: b
    text: यहाँ “मूरतों” के लिए प्रयुक्त इब्रानी शब्द झूठे देवताओं के प्रति तीव्र तिरस्कार प्रकट करता है।
    reason: lexical_alternative
  - marker: c
    text: “पास जाना” यौन-संबंध के लिए प्रयुक्त एक इब्रानी शिष्टोक्ति है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶל־הֶהָרִים ... אָכָל
  choice: पहाड़ों पर भोजन नहीं करता
  rationale: यह इब्रानी अभिव्यक्ति शाब्दिक चित्र को बनाए रखती है; प्रसंग में इसका संकेत ऊँचे स्थानों पर बलि-भोज में भाग लेने की ओर है, जिसे पाद-टिप्पणी में स्पष्ट किया गया है।
- source_word: וְעֵינָיו לֹא נָשָׂא
  choice: अपनी आँखें नहीं उठाता
  rationale: मूल मुहावरे को सुरक्षित रखते हुए मूरतों की ओर श्रद्धा, लालसा या भक्ति से देखने का भाव खुला रखा गया है।
- source_word: גִּלּוּלֵי
  choice: मूरतों
  rationale: यह सामान्य पाठक के लिए स्पष्ट और स्वाभाविक शब्द है; इब्रानी शब्द का अत्यंत तिरस्कारपूर्ण भाव पाद-टिप्पणी में बताया गया है।
- source_word: בֵּית יִשְׂרָאֵל
  choice: इस्राएल के घराने
  rationale: यह भविष्यद्वक्ताओं की सामूहिक वाचा-संबंधी अभिव्यक्ति को केवल ‘इस्राएल’ कहकर सपाट करने के बजाय सुरक्षित रखता है।
- source_word: אֵשֶׁת רֵעֵהוּ
  choice: अपने पड़ोसी की पत्नी
  rationale: רֵעַ के ‘पड़ोसी/साथी’ अर्थ को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है और मूल से अधिक संकीर्ण नहीं बनाता।
- source_word: לֹא טִמֵּא
  choice: अपवित्र नहीं करता
  rationale: यह व्यभिचार से जुड़ी नैतिक अपवित्रता और शुद्धता-विषयक भाषा—दोनों को बनाए रखता है।
- source_word: אִשָּׁה נִדָּה
  choice: मासिक धर्म की अशुद्धता के समय किसी स्त्री
  rationale: यह लैव्यव्यवस्था की शुद्धता-संबंधी अवस्था को स्पष्ट, आधुनिक और सम्मानजनक हिन्दी में व्यक्त करता है।
- source_word: לֹא יִקְרָב
  choice: पास नहीं जाता
  rationale: मूल क्रिया का ‘निकट जाना’ वाला रूप सुरक्षित है; यहाँ इसके यौन-संबंध के लिए प्रयुक्त शिष्टोक्ति होने की जानकारी पाद-टिप्पणी में दी गई है।
theological_decisions:
- issue: पहाड़ों पर भोजन करने के उपासना-संबंधी संदर्भ को मुख्य पाठ में स्पष्ट करना
  choice: मुख्य पाठ में ‘पहाड़ों पर भोजन नहीं करता’ रखना
  alternative: ‘पहाड़ी पूजा-स्थानों पर बलि-भोज नहीं करता’
  rationale: शाब्दिक भविष्यद्वक्ताई चित्र को बनाए रखने और व्याख्यात्मक विस्तार से बचने के लिए मूल अभिव्यक्ति मुख्य पाठ में रखी गई है; उसका धार्मिक संदर्भ पाद-टिप्पणी में स्पष्ट है।
- issue: शुद्धता की भाषा को केवल नैतिक या केवल अनुष्ठानिक अर्थ देना
  choice: ‘अपवित्र’ और ‘मासिक धर्म की अशुद्धता’ द्वारा दोनों आयाम बनाए रखना
  alternative: ‘व्यभिचार नहीं करता’ और ‘मासिक धर्म के समय’
  rationale: पद नैतिक अपराध और अनुष्ठानिक शुद्धता की श्रेणियों को साथ रखता है; अनुवाद इस तनाव को किसी एक पक्ष में सीमित नहीं करता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य रखी गई है। भविष्यद्वक्ताई मुहावरों को जहाँ संभव हो सुरक्षित रखा गया है और आवश्यक सांस्कृतिक या शाब्दिक स्पष्टीकरण पाद-टिप्पणियों में दिया गया है।
