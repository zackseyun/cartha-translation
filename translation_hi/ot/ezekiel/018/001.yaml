lexical_decisions:
- source_word: וַיְהִי
  choice: फिर ... आया
  rationale: वाव-क्रमिक के साथ היה यहाँ भविष्यद्वाणी के वृत्तांत को आगे बढ़ाने वाला सामान्य सूत्र है। ‘फिर’ प्रसंग का क्रम स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: דְבַר
  choice: वचन
  rationale: דְבַר־יְהוָה भविष्यद्वाणी का स्थापित सूत्र है। ‘वचन’ किसी विशिष्ट ईश्वरीय संदेश को दर्शाता है और मूल अभिव्यक्ति से औपचारिक संबंध बनाए रखता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिन्दी बाइबलीय परंपरा में प्रचलित लिप्यंतरण ‘यहोवा’ यहाँ इब्रानी चतुरक्षरीय व्यक्तिगत नाम को किसी उपाधि से प्रतिस्थापित किए बिना प्रस्तुत करता है।
- source_word: אֵלַי
  choice: मेरे पास
  rationale: पूर्वसर्ग אֶל और प्रथम पुरुष प्रत्यय वचन के भविष्यद्वक्ता तक पहुँचने की दिशा बताते हैं; ‘मेरे पास आया’ स्वाभाविक आधुनिक हिन्दी है।
- source_word: לֵאמֹר
  choice: ':'
  rationale: यह क्रियार्थक रूप आगे आने वाली प्रत्यक्ष वाणी का परिचय देता है। हिन्दी में उद्धरण-प्रस्तावक द्विबिंदु ‘यह कहते हुए’ जैसी बोझिल पुनरुक्ति के बिना यही कार्य स्वाभाविक रूप से करता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: मूल पाठ व्यक्तिगत ईश्वरीय नाम का सीधे प्रयोग करता है। ‘यहोवा’ आधुनिक हिन्दी के सामान्य पाठकों के लिए परिचित लिप्यंतरण है और ‘प्रभु’ जैसी उपाधि रखकर नाम को छिपाता नहीं; ‘याहवे’ अधिक संभावित विद्वत्तापूर्ण उच्चारण है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। भविष्यद्वाणी के सूत्र को ‘यहोवा का वचन मेरे पास आया’ के परिचित रूप में रखा गया है; לֵאמֹר को हिन्दी की स्वाभाविक विराम-चिह्न पद्धति से व्यक्त किया गया है।
