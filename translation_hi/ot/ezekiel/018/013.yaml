  text: בַּ/נֶּ֧שֶׁךְ נָתַ֛ן וְ/תַרְבִּ֥ית לָקַ֖ח וָ/חָ֑י לֹ֣א יִֽחְיֶ֗ה אֵ֣ת כָּל הַ/תּוֹעֵב֤וֹת הָ/אֵ֨לֶּה֙ עָשָׂ֔ה מ֣וֹת יוּמָ֔ת דָּמָ֖י/ו בּ֥/וֹ יִהְיֶֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/018/013.yaml
  text: He lends at interest and takes profit—and shall he live? He shall not live[a]. He has done all these abominations; he shall surely be put to death[c][b]; his blood shall be upon him.
translation:
  language: hi
  text: वह ब्याज पर उधार देता और अतिरिक्त लाभ लेता है[a]—क्या वह जीवित रहेगा? वह जीवित नहीं रहेगा। उसने ये सब घृणित काम किए हैं; वह निश्चय ही मार डाला जाएगा।[b] उसका खून उसी पर होगा।[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ब्याज’ के लिए ‘सूद’ भी हो सकता है। दोनों इब्रानी शब्द ऋण पर लिए गए ब्याज या अतिरिक्त लाभ को दर्शाते हैं, खासकर निंदित शोषणकारी उधारी में।
    reason: lexical_alternative
  - marker: b
    text: या, ‘वह निश्चय ही मर जाएगा।’ इब्रानी में यह मृत्यु-दंड की अत्यंत जोरदार घोषणा है।
    reason: alternative_reading
  - marker: c
    text: शाब्दिक रूप से, ‘उसका खून उसी पर होगा।’ यह मुहावरा बताता है कि वह अपनी मृत्यु का उत्तरदायी है।
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּנֶּשֶׁךְ
  choice: ब्याज पर उधार देता
  rationale: נֶשֶׁךְ ऋण पर लिए जाने वाले ब्याज को दर्शाता है, विशेषकर ऐसी शोषणकारी उधारी को जिसकी व्यवस्था और भविष्यवाणी-संबंधी प्रसंगों में निंदा की गई है। यह हिंदी में स्वाभाविक है और केवल अत्यधिक ब्याज तक अर्थ को सीमित नहीं करता।
- source_word: וְתַרְבִּית
  choice: बढ़ोतरी वसूल करता है
  rationale: תַּרְבִּית, נֶשֶׁךְ के साथ प्रयुक्त होकर, ऋण से वसूली गई अतिरिक्त राशि या लाभ को दर्शाता है। ‘बढ़ोतरी’ दोनों निकटार्थी शब्दों के बीच का भेद बनाए रखती है।
- source_word: וָחָי לֹא יִחְיֶה
  choice: क्या वह जीवित रहेगा? वह जीवित नहीं रहेगा।
  rationale: वाक्यक्रम को आलंकारिक प्रश्न और उसके बाद स्पष्ट निषेध के रूप में रखना इब्रानी की तीव्रता तथा वाक्यगत तनाव को सुरक्षित रखता है।
- source_word: אֵת כָּל הַתּוֹעֵבוֹת הָאֵלֶּה
  choice: ये सब घृणित काम
  rationale: תּוֹעֵבוֹת अत्यंत निंदनीय और वाचा-विरोधी कर्मों को दर्शाता है। ‘घृणित काम’ आधुनिक हिंदी में स्पष्ट है और भविष्यवाणी-संबंधी नैतिक गंभीरता बनाए रखता है।
- source_word: מוֹת יוּמָת
  choice: वह निश्चय ही मार डाला जाएगा
  rationale: इन्फिनिटिव एब्सोल्यूट के साथ निष्क्रिय क्रिया मृत्यु-दंड की प्रबल और न्यायिक घोषणा व्यक्त करती है। यह अनुवाद निष्क्रियता और जोर दोनों को बनाए रखता है।
- source_word: דָּמָיו בּוֹ יִהְיֶה
  choice: उसका खून उसी के सिर पर होगा
  rationale: यह हिंदी में प्रचलित बाइबलीय मुहावरा है, जो बताता है कि अपनी मृत्यु का उत्तरदायित्व उसी पर है; ‘सिर पर’ अर्थ को स्वाभाविक रूप से स्पष्ट करता है।
theological_decisions:
- issue: भविष्यवाणी-संबंधी कानूनी भाषा में मृत्यु की घोषणा का स्वरूप
  choice: ‘वह निश्चय ही मार डाला जाएगा’ कहकर इसे न्यायिक मृत्यु-दंड की घोषणा के रूप में प्रस्तुत किया गया है।
  alternative: ‘वह निश्चय ही मर जाएगा।’
  rationale: इब्रानी का निष्क्रिय रूप सुनाए गए दंड की ओर संकेत करता है, पर पद यह नहीं बताता कि उसे मनुष्य लागू करेंगे या परमेश्वर। इसलिए अनुवाद न्यायिक बल बनाए रखता है, पर दंड लागू होने की विधि तय नहीं करता।
translation_notes:
  register: आधुनिक मानक हिंदी में स्पष्ट, गरिमापूर्ण और भविष्यवाणी-संबंधी न्यायिक स्वर रखा गया है। आलंकारिक प्रश्न को बनाए रखा गया है और मृत्यु-दंड के कर्ता को पाठ से आगे बढ़कर निर्दिष्ट नहीं किया गया।
