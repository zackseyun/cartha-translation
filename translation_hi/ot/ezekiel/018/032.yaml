source:
  edition: WLC
  text: כִּ֣י לֹ֤א אֶחְפֹּץ֙ בְּ/מ֣וֹת הַ/מֵּ֔ת נְאֻ֖ם אֲדֹנָ֣/י יְהוִ֑ה וְ/הָשִׁ֖יבוּ וִֽ/חְיֽוּ׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/018/032.yaml
  text: For I take no pleasure in the death of the one who dies[a], declares the Lord GOD[c][b]. Therefore turn back and live.
translation:
  language: hi
  text: क्योंकि मरनेवाले की मृत्यु से मुझे कोई प्रसन्नता नहीं होती[a]—प्रभु याहवे की यह घोषणा है[b]। इसलिए लौट आओ[c] और जीवित रहो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मैं मरनेवाले की मृत्यु की इच्छा नहीं करता।”
    reason: lexical_alternative
  - marker: b
    text: हिब्रू में אֲדֹנָי יְהוִה; इसे “प्रभु यहोवा” भी कहा जा सकता है।
    reason: alternative_reading
  - marker: c
    text: या, “फिरो।”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले आग्रह का आधार बताता है; ‘क्योंकि’ हिन्दी में इसके व्याख्यात्मक-कारणसूचक बल को स्वाभाविक रूप से व्यक्त करता है।
- source_word: לֹא אֶחְפֹּץ
  choice: मुझे कोई प्रसन्नता नहीं होती
  rationale: חפץ इच्छा, प्रसन्नता या आनंद का भाव व्यक्त कर सकता है। इस प्रसंग में यह वाक्यांश मृत्यु में परमेश्वर की प्रसन्नता न होने को स्वाभाविक हिन्दी में व्यक्त करता है, पर इच्छा के अर्थ को पादटिप्पणी में सुरक्षित रखता है।
- source_word: בְּמוֹת הַמֵּת
  choice: जो मरता है, उसकी मृत्यु से
  rationale: בְּמוֹת का संबंध חפץ से है और הַמֵּת कृदन्त रूप में ‘जो मरता है/मरनेवाला’ है। यह अनुवाद ‘दुष्ट’ जैसा प्रसंगाधारित शब्द जोड़े बिना मूल की असामान्य पुनरुक्ति और व्यापकता बनाए रखता है।
- source_word: נְאֻם
  choice: यह घोषणा है
  rationale: यह मानक भविष्यद्वक्तीय उद्घोषणा-सूत्र है। ‘यह घोषणा है’ उसके गंभीर और अधिकारपूर्ण स्वर को आधुनिक हिन्दी में बनाए रखता है।
- source_word: אֲדֹנָי יְהוִה
  choice: प्रभु यहोवा
  rationale: अֲדֹנָי को ‘प्रभु’ और चतुरक्षरीय दिव्य नाम יְהוִה को हिन्दी बाइबलीय परंपरा में परिचित ‘यहोवा’ से दर्शाया गया है; ‘याहवे’ को पादटिप्पणी में वैकल्पिक उच्चारण के रूप में दिया गया है।
- source_word: וְהָשִׁיבוּ
  choice: इसलिए लौट आओ
  rationale: שׁוב लौटने या फिरने का ठोस रूपक रखता है। प्रसंग में संयोजक परिणामसूचक है; ‘इसलिए’ पिछले कथन से आग्रह का संबंध स्पष्ट करता है, जबकि ‘लौट आओ’ बिना अतिरिक्त धर्मशास्त्रीय शब्द जोड़े नैतिक आह्वान व्यक्त करता है।
- source_word: וִחְיוּ
  choice: और जीवित रहो
  rationale: मूल की आज्ञार्थक परिणति को सीधे और स्वाभाविक रूप से रखता है।
theological_decisions:
- issue: אֲדֹנָי יְהוִה में दिव्य नाम का अनुवाद
  choice: प्रभु यहोवा
  alternative: प्रभु याहवे
  rationale: दोनों हिब्रू पदों को अलग-अलग व्यक्त किया गया है। ‘यहोवा’ हिन्दी पाठकों के लिए परिचित रूप है, जबकि अधिक संभावित प्राचीन उच्चारण ‘याहवे’ पादटिप्पणी में दिया गया है; दिव्य नाम को केवल सामान्य उपाधि में नहीं बदला गया।
- issue: הַמֵּת को प्रसंग के आधार पर ‘दुष्ट’ कहना या मूल शब्दरूप बनाए रखना
  choice: जो मरता है
  alternative: दुष्ट
  rationale: आसपास का प्रसंग दुष्ट व्यक्ति के फिरने की बात करता है, पर इस पद में הַמֵּת का अर्थ ‘मरनेवाला/जो मरता है’ है। ‘दुष्ट’ जोड़ना व्याख्यात्मक रूप से तनाव और कथन की शब्दगत व्यापकता को सीमित कर देता।
- issue: חפץ को प्रसन्नता या इच्छा के रूप में व्यक्त करना
  choice: मुझे कोई प्रसन्नता नहीं होती
  alternative: मैं इच्छा नहीं करता
  rationale: दोनों अर्थ शब्द के दायरे में हैं। मृत्यु के साथ यह प्रयोग ‘प्रसन्नता न होना’ स्वाभाविक है, पर इच्छात्मक अर्थ को पादटिप्पणी में रखा गया है ताकि कथन की वास्तविक अर्थ-व्याप्ति बनी रहे।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। ‘जो मरता है, उसकी मृत्यु’ मूल हिब्रू की जानबूझकर असामान्य अभिव्यक्ति को सहज हिन्दी में यथासंभव सुरक्षित रखता है। भविष्यद्वक्तीय सूत्र को अत्यधिक प्राचीन या कृत्रिम शब्दावली के बिना गंभीर स्वर दिया गया है।
