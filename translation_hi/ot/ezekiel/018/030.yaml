base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/018/030.yaml
  text: Therefore I will judge each man according to his ways[a], O house of Israel, declares the Lord GOD. Repent and turn away from all your transgressions, so that iniquity may not become a stumbling block to you.
translation:
  language: hi
  text: इसलिए, हे इस्राएल के घराने, मैं तुम में से हर एक का न्याय उसके चालचलन के अनुसार करूँगा—प्रभु यहोवा की यह घोषणा है। लौट आओ और अपने सब अपराधों से मुँह मोड़ लो, ताकि अधर्म तुम्हारे लिए ठोकर का कारण न बने।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तुम्हारा अधर्म तुम्हारे विनाश का कारण न बने।” अंतिम इब्रानी वाक्यांश संक्षिप्त है; उसका अर्थ अधर्म को ठोकर का कारण बताना, या अधर्म के कारण विनाश होना, दोनों हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: इसलिए
  rationale: यह पिछले तर्क से निकले निष्कर्ष को स्वाभाविक और स्पष्ट हिन्दी में व्यक्त करता है।
- source_word: אִישׁ כִּדְרָכָיו
  choice: हर एक पुरुष का ... उसके चालचलन के अनुसार
  rationale: वितरणात्मक एकवचन और उसके व्यक्तिगत उत्तरदायित्व को बनाए रखते हुए דֶּרֶךְ के नैतिक आचरण-संबंधी अर्थ को स्पष्ट करता है।
- source_word: אֶשְׁפֹּט אֶתְכֶם
  choice: मैं ... न्याय ... करूँगा
  rationale: שׁפט का यहाँ न्यायिक अर्थ है; हिन्दी वाक्य-विन्यास में कर्म को व्यक्तिगत वितरणात्मक रूप में रखा गया है।
- source_word: בֵּית יִשְׂרָאֵל
  choice: हे इस्राएल के घराने
  rationale: प्रत्यक्ष भविष्यद्वाणी-संबोधन को गरिमापूर्ण तथा परिचित हिन्दी में सुरक्षित रखता है।
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: प्रभु यहोवा की यह घोषणा है
  rationale: נְאֻם को भविष्यद्वाणी की घोषणा और संयुक्त ईश्वरीय उपाधि אֲדֹנָי יְהוִה को स्पष्ट रूप से प्रस्तुत करता है।
- source_word: שׁוּבוּ וְהָשִׁיבוּ
  choice: लौट आओ और ... से मुँह मोड़ लो
  rationale: पहला आदेश वापसी के रूपक को रखता है और दूसरा अपराधों के व्यावहारिक त्याग को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: מִכָּל פִּשְׁעֵיכֶם
  choice: अपने सब अपराधों से
  rationale: פֶּשַׁע में विद्रोह और उल्लंघन का नैतिक भार है; 'अपराध' आधुनिक पाठक के लिए सुबोध है।
- source_word: לְמִכְשׁוֹל עָוֺן
  choice: अधर्म तुम्हारे लिए ठोकर का कारण न बने
  rationale: מִכְשׁוֹל की ठोकर वाली छवि और עָוֺן के नैतिक अर्थ को रखते हुए संक्षिप्त इब्रानी वाक्यांश की अस्पष्टता को पूर्णतः समाप्त नहीं करता।
theological_decisions:
- issue: सामूहिक संबोधन में वितरणात्मक पुल्लिंग אִישׁ
  choice: हर एक पुरुष
  alternative: हर एक व्यक्ति; हर कोई
  rationale: इब्रानी पाठ इस्राएल के घराने में प्रत्येक व्यक्ति को अलग-अलग न्याय के अधीन बताता है और स्पष्ट पुल्लिंग प्रतिनिधि संज्ञा का प्रयोग करता है; मुख्य पाठ उसी रूप को बनाए रखता है।
- issue: अंतिम वाक्यांश में עָוֺן और מִכְשׁוֹל का संबंध
  choice: अधर्म तुम्हारे लिए ठोकर का कारण न बने
  alternative: तुम्हारा अधर्म तुम्हारे विनाश का कारण न बने
  rationale: इब्रानी वाक्यांश अत्यंत संक्षिप्त है और अधर्म को ठोकर का कारण अथवा विनाश तक पहुँचाने वाला समझा जा सकता है। मुख्य पाठ शब्द-चित्र को सुरक्षित रखता है और वैकल्पिक अर्थ पादटिप्पणी में देता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण भविष्यद्वाणी-शैली वाला रूप अपनाया गया है। 'लौट आओ' मूल रूपक को रखता है, जबकि 'मुँह मोड़ लो' अनावश्यक पुनरुक्ति से बचते हुए दूसरे आदेश को स्वाभाविक बनाता है।
