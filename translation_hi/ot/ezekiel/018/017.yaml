source:
  edition: WLC
  text: מֵ/עָנִ֞י הֵשִׁ֣יב יָד֗/וֹ נֶ֤שֶׁךְ וְ/תַרְבִּית֙ לֹ֣א לָקָ֔ח מִשְׁפָּטַ֣/י עָשָׂ֔ה בְּ/חֻקּוֹתַ֖/י הָלָ֑ךְ ה֗וּא לֹ֥א יָמ֛וּת בַּ/עֲוֺ֥ן אָבִ֖י/ו חָיֹ֥ה יִחְיֶֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/018/017.yaml
  text: He has withheld his hand from the poor[a], has not taken interest or profit, has carried out my judgments, and has walked in my statutes. He will not die for his father's iniquity[c][b]; he will surely live.
translation:
  language: hi
  text: उसने गरीब को हानि पहुँचाने से अपना हाथ रोक लिया है,[a] ब्याज या अतिरिक्त लाभ[b] नहीं लिया है, मेरे न्याय-विधानों को पूरा किया है और मेरी विधियों पर चला है। वह अपने पिता के अधर्म के कारण नहीं मरेगा;[c] वह निश्चय जीवित रहेगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “उसने गरीब से अपना हाथ फेर लिया है।” इब्रानी मुहावरा गरीब को हानि पहुँचाने या उसका शोषण करने से रुकने का चित्र प्रस्तुत करता है।
    reason: lexical_alternative
  - marker: b
    text: “ब्याज या अतिरिक्त लाभ” ऋण से लिए जाने वाले लाभ के लिए प्रयुक्त दो संबंधित इब्रानी शब्दों का अनुवाद है; परंपरागत रूप से, “ब्याज और वृद्धि।”
    reason: lexical_alternative
  - marker: c
    text: या, “वह अपने पिता के अधर्म में नहीं मरेगा।” संदर्भ में अर्थ है कि वह अपने पिता के दोष के कारण नहीं मरेगा।
    reason: alternative_reading
lexical_decisions:
- source_word: מֵעָנִי הֵשִׁיב יָדוֹ
  choice: उसने गरीब पर हाथ उठाने से अपने को रोका है
  rationale: शाब्दिक चित्र ‘गरीब से अपना हाथ फेर लिया’ है, पर संदर्भ में इसका अर्थ गरीब को हानि पहुँचाने या उसका शोषण करने से रुकना है। हिंदी में ‘हाथ उठाने से अपने को रोका’ हाथ के रूपक और हानिकारक आचरण—दोनों को व्यक्त करता है।
- source_word: נֶשֶׁךְ וְתַרְבִּית
  choice: ब्याज या बढ़ोतरी
  rationale: दोनों निकटवर्ती आर्थिक शब्द ऋण पर लिए जाने वाले ब्याज और अतिरिक्त लाभ/वृद्धि को सूचित करते हैं। ‘बढ़ोतरी’ दूसरे शब्द की ‘वृद्धि’ की मूल धारणा बनाए रखती है।
- source_word: מִשְׁפָּטַי עָשָׂה
  choice: मेरे न्यायों का पालन किया है
  rationale: מִשְׁפָּטַי में न्यायिक और विधिक भाव है। हिंदी में ‘न्यायों का पालन’ स्वाभाविक ढंग से उनके अनुसार आचरण करना व्यक्त करता है।
- source_word: בְּחֻקּוֹתַי הָלָךְ
  choice: मेरी विधियों पर चला है
  rationale: ‘चलना’ मूल वाचा-संबंधी आचरण के रूपक को सुरक्षित रखता है; ‘विधियाँ’ חֻקּוֹת के निर्धारित नियमों का भाव देती हैं।
- source_word: בַּעֲוֺן אָבִיו
  choice: अपने पिता के अधर्म के कारण
  rationale: यहाँ בְּ कारण या दंड के आधार को दर्शाता है। अध्याय का संदर्भ स्पष्ट करता है कि पुत्र पिता के दोष के कारण मृत्यु नहीं पाएगा।
- source_word: חָיֹה יִחְיֶה
  choice: वह निश्चय जीवित रहेगा
  rationale: क्रिया के साथ infinitive absolute का प्रयोग प्रबल निश्चय व्यक्त करता है, जिसे ‘निश्चय’ स्वाभाविक हिंदी में सुरक्षित रखता है।
theological_decisions:
- issue: व्यक्तिगत उत्तरदायित्व और पिता के अधर्म का परिणाम
  choice: धर्मी आचरण करने वाला पुत्र अपने पिता के अधर्म के कारण नहीं मरेगा।
  alternative: 'अधिक शाब्दिक रूप: ‘वह अपने पिता के अधर्म में नहीं मरेगा।’'
  rationale: यहेजकेल 18 का निकट संदर्भ प्रत्येक व्यक्ति के अपने आचरण के लिए उत्तरदायित्व पर बल देता है। ‘के कारण’ प्रसंगगत कारणार्थ को स्पष्ट करता है, जबकि वैकल्पिक शाब्दिक रूप पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण और सामान्य पाठक के लिए सुबोध शैली रखी गई है। विधिक-वाचा संबंधी शब्दावली के लिए ‘न्याय’, ‘विधि’ और ‘चलना’ जैसे बाइबिलीय रूपक सुरक्षित हैं; दुर्बोध पुरातनता से बचा गया है।
