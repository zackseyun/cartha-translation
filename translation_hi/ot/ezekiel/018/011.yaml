source:
  edition: WLC
  text: וְ/ה֕וּא אֶת כָּל אֵ֖לֶּה לֹ֣א עָשָׂ֑ה כִּ֣י גַ֤ם אֶל הֶֽ/הָרִים֙ אָכַ֔ל וְ/אֶת אֵ֥שֶׁת רֵעֵ֖/הוּ טִמֵּֽא־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/018/011.yaml
  text: But he has done none of all these things; instead, he has even eaten on the mountains and defiled his neighbor’s wife.
translation:
  language: hi
  text: उसने इनमें से कोई भी काम नहीं किया; बल्कि उसने पहाड़ों पर खाया[a] और अपने पड़ोसी की पत्नी को अपवित्र किया[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात पहाड़ों पर बने मूर्तिपूजक पूजा-स्थलों में धार्मिक भोज किया।
    reason: प्राचीन सांस्कृतिक संकेत आधुनिक पाठक के लिए स्पष्ट करना।
  - marker: b
    text: यहाँ आशय है कि उसने उसके साथ अनुचित यौन-संबंध बनाया।
    reason: ‘अपवित्र किया’ में निहित यौन अर्थ स्पष्ट करना।
lexical_decisions:
- source_word: וְהוּא
  choice: परन्तु उसने
  rationale: यहाँ विषय को पिछले वर्णन से अलग करते हुए विरोध प्रकट होता है; आधुनिक हिन्दी में ‘परन्तु उसने’ स्वाभाविक है।
- source_word: אֶת כָּל אֵלֶּה לֹא עָשָׂה
  choice: इनमें से कोई भी काम नहीं किया
  rationale: शाब्दिक अर्थ ‘इन सबको नहीं किया’ है; हिन्दी में यह रूप पूर्ववर्ती धर्ममय कामों की ओर स्पष्ट और स्वाभाविक संकेत करता है।
- source_word: כִּי גַם
  choice: इसके बजाय
  rationale: इस प्रसंग में यह पहले कथन के विपरीत उसके वास्तविक दुष्कर्मों को सामने लाता है; केवल ‘क्योंकि भी’ हिन्दी में अर्थहीन होगा।
- source_word: אֶל הֶהָרִים אָכַל
  choice: पहाड़ों पर भोजन किया
  rationale: मूल के सांस्कृतिक संकेत को बनाए रखा गया है; प्रसंग में यह पहाड़ी पूजा-स्थलों पर किए जाने वाले मूर्तिपूजक भोज की ओर संकेत करता है।
- source_word: אֶת אֵשֶׁת רֵעֵהוּ טִמֵּא
  choice: अपने पड़ोसी की पत्नी को अशुद्ध किया
  rationale: मूल क्रिया ‘अशुद्ध करना’ को बनाए रखते हुए उसके यौन आशय को पादटिप्पणी में स्पष्ट किया गया है।
theological_decisions:
- issue: पहाड़ों पर भोजन करने का धार्मिक आशय
  choice: मुख्य पाठ में मूल बिंब ‘पहाड़ों पर भोजन किया’ रखा
  alternative: ‘पहाड़ों के पूजा-स्थलों पर बलि का भोजन किया’
  rationale: विस्तृत विकल्प प्रसंग समझाता है, पर मूल में ‘बलि’ या ‘पूजा-स्थल’ स्पष्ट रूप से नहीं हैं; इसलिए व्याख्या पादटिप्पणी में दी गई है।
- issue: ‘अशुद्ध किया’ का यौन आशय
  choice: मूल रूपक को मुख्य पाठ में सुरक्षित रखा
  alternative: ‘उसके साथ व्यभिचार किया’
  rationale: वैकल्पिक रूप आशय स्पष्ट करता है, पर मूल की पवित्रता-अशुद्धता की भाषा खो देता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। वाक्य-विन्यास मूल के विरोध को स्पष्ट करता है, जबकि सांस्कृतिक और यौन रूपकों को मुख्य पाठ में सुरक्षित रखकर पादटिप्पणियों में समझाया गया है।
