id: EZK.18.8
reference: Ezekiel 18:8
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: בַּ/נֶּ֣שֶׁךְ לֹֽא יִתֵּ֗ן וְ/תַרְבִּית֙ לֹ֣א יִקָּ֔ח מֵ/עָ֖וֶל יָשִׁ֣יב יָד֑/וֹ מִשְׁפַּ֤ט אֱמֶת֙ יַֽעֲשֶׂ֔ה בֵּ֥ין אִ֖ישׁ לְ/אִֽישׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/018/008.yaml
  text: He does not lend at interest or take profit[a]; he keeps his hand back from injustice[c][b]; he executes true justice between one man and another.
translation:
  language: hi
  text: वह ब्याज पर उधार नहीं देता और न बढ़ोतरी लेता है[a]; वह अन्याय से अपना हाथ खींच लेता है[b]; वह एक मनुष्य और दूसरे मनुष्य के बीच सच्चा न्याय करता है[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वह सूद पर उधार नहीं देता और न कोई वृद्धि लेता है।”
    reason: lexical_alternative
  - marker: b
    text: 'शाब्दिक अर्थ: “वह अन्याय से अपना हाथ वापस फेरता है।”'
    reason: lexical_alternative
  - marker: c
    text: इब्रानी में शाब्दिक रूप से “मनुष्य और मनुष्य के बीच”; यह दो पक्षों के बीच निष्पक्ष न्याय करने का वैधानिक मुहावरा है।
    reason: cultural_note
lexical_decisions:
- source_word: בַּנֶּשֶׁךְ לֹא יִתֵּן
  choice: ब्याज पर उधार नहीं देता
  rationale: יִתֵּן का मूल अर्थ ‘देता’ है, पर נֶשֶׁךְ के साथ यह ब्याज पर ऋण देने का मुहावरा है। यह अनुवाद आधुनिक हिन्दी में आर्थिक-वैधानिक अर्थ स्पष्ट रखता है।
- source_word: וְתַרְבִּית לֹא יִקָּח
  choice: और न बढ़ोतरी लेता है
  rationale: תַרְבִּית ऋण की मूल राशि के ऊपर ली गई वृद्धि या लाभ को सूचित करता है। ‘बढ़ोतरी’ पहले पद ‘ब्याज’ से शब्दगत भेद बनाए रखती है, यद्यपि दोनों निकटार्थी हैं।
- source_word: מֵעָוֶל
  choice: अन्याय से
  rationale: עָוֶל सामाजिक और न्यायिक संदर्भ में अन्याय, कुटिलता या गलत आचरण को दर्शाता है; यहाँ ‘अन्याय’ प्रसंगानुकूल है।
- source_word: יָשִׁיב יָדוֹ
  choice: अपना हाथ खींच लेता है
  rationale: इब्रानी मुहावरे का शाब्दिक चित्र ‘अपना हाथ वापस फेरना’ है और आशय अन्याय में भाग लेने से रुकना है। हिन्दी का यह मुहावरा चित्र और अर्थ दोनों बनाए रखता है।
- source_word: מִשְׁפַּט אֱמֶת
  choice: सच्चा न्याय
  rationale: इस पदबंध में न्यायिक निर्णय और सत्यनिष्ठा दोनों निहित हैं। ‘सच्चा न्याय’ दोनों पक्षों को संक्षेप में व्यक्त करता है।
- source_word: יַעֲשֶׂה
  choice: करता है
  rationale: क्रिया का सामान्य अर्थ ‘करना’ है; ‘न्याय करता है’ हिन्दी में स्वाभाविक है और अनावश्यक औपचारिक विस्तार से बचता है।
- source_word: בֵּין אִישׁ לְאִישׁ
  choice: एक मनुष्य और दूसरे मनुष्य के बीच
  rationale: यह शाब्दिक रूप से ‘मनुष्य और मनुष्य के बीच’ है—दो पक्षों के बीच निष्पक्ष न्याय करने का वैधानिक मुहावरा। चुना हुआ रूप स्रोत की प्रतिनिधिक पुल्लिंग संज्ञा को बनाए रखते हुए स्वाभाविक हिन्दी देता है।
theological_decisions:
- issue: נֶשֶׁךְ और תַרְבִּית का परस्पर संबंध
  choice: ‘ब्याज’ और ‘बढ़ोतरी’ के रूप में दो निकटार्थी किंतु अलग शब्द
  alternative: दोनों के लिए ‘ब्याज’, अथवा ‘सूद’ और ‘लाभ’
  rationale: स्रोत दो संबद्ध आर्थिक शब्दों का युग्म रखता है। अलग हिन्दी शब्द उस युग्म को सुरक्षित रखते हैं, बिना उनके बीच अत्यधिक तकनीकी अंतर आरोपित किए।
- issue: בֵּין אִישׁ לְאִישׁ का प्रतिनिधिक पुल्लिंग वैधानिक मुहावरा
  choice: एक मनुष्य और दूसरे मनुष्य के बीच
  alternative: दो पक्षों के बीच
  rationale: मुख्य पाठ में स्रोत के रूप को निकटता से रखा गया है; फुटनोट स्पष्ट करता है कि न्यायिक प्रसंग में यह दो विवादरत पक्षों को सूचित करने वाला मुहावरा है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। आर्थिक शब्दावली में ‘ब्याज’ प्रचलित है, जबकि ‘बढ़ोतरी’ इब्रानी के दूसरे निकटार्थी पद का भेद बचाती है। काव्यात्मक-नैतिक समानांतरता के लिए तीनों खंड अर्धविराम से जोड़े गए हैं।
