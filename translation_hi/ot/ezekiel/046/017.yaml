base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/046/017.yaml
  text: But if he gives a gift from his inheritance to one of his servants[a], it shall belong to him until the year of liberty; then it shall return to the prince. Only his inheritance belongs to his sons; it shall be theirs.
translation:
  language: hi
  text: परन्तु यदि वह अपनी विरासत में से अपने सेवकों में से किसी एक को कोई भेंट दे, तो वह स्वतंत्रता के वर्ष[a] तक उसकी रहेगी; इसके बाद वह प्रधान के पास लौट जाएगी। परन्तु उसकी विरासत केवल उसके पुत्रों की होगी; वह उनकी रहेगी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “रिहाई का वर्ष।” सम्भवतः इसका आशय जुबली-जैसे उस पुनर्स्थापन-वर्ष से है जिसमें संपत्ति लौटाई जाती थी; किन्तु यहाँ हिब्रू पाठ में सामान्यतः प्रयुक्त “जुबली” शब्द नहीं, बल्कि “स्वतंत्रता” शब्द है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִי יִתֵּן
  choice: परन्तु यदि वह ... दे
  rationale: कानूनी प्रसंग में यह पिछले नियम के विपरीत एक शर्त प्रस्तुत करता है; हिन्दी में यह स्वाभाविक और स्पष्ट है।
- source_word: מַתָּנָה מִנַּחֲלָתוֹ
  choice: अपनी विरासत में से ... कोई भेंट
  rationale: מַתָּנָה को ‘भेंट’ और נַחֲלָה को वंशानुगत भू-संपत्ति के अर्थ में ‘विरासत’ कहा गया है।
- source_word: לְאַחַד מֵעֲבָדָיו
  choice: अपने सेवकों में से किसी एक को
  rationale: עבד में सेवक अथवा दास दोनों अर्थ संभव हैं; यहाँ पुत्रों और आश्रित सेवकों को दी गई संपत्ति के अधिकारों का अंतर मुख्य है, इसलिए ‘सेवक’ उपयुक्त है।
- source_word: וְהָיְתָה לּוֹ
  choice: वह ... उसकी रहेगी
  rationale: स्त्रीलिंग क्रिया दी गई संपत्ति/विरासत के अंश से मेल खाती है और सीमित अवधि के स्वामित्व को व्यक्त करती है।
- source_word: עַד שְׁנַת הַדְּרוֹר
  choice: मुक्ति के वर्ष तक
  rationale: דְּרוֹר का मूल भाव मुक्ति अथवा रिहाई है; सामान्य ‘जुबली’ शब्द स्रोत में नहीं है।
- source_word: וְשָׁבַת לַנָּשִׂיא
  choice: इसके बाद वह प्रधान के पास लौट जाएगी
  rationale: שׁוב का सीधा अर्थ लौटना है; यहेजकेल के इस दर्शन में נָשִׂיא के लिए ‘प्रधान’ उपयुक्त है।
- source_word: אַךְ נַחֲלָתוֹ בָּנָיו לָהֶם תִּהְיֶה
  choice: केवल उसकी अपनी विरासत उसके पुत्रों की होगी; वह उन्हीं की रहेगी
  rationale: אַךְ के सीमितकारी बल और पुत्रों के स्थायी वंशानुगत अधिकार पर मूल पाठ के बल को दो उपवाक्यों में सुरक्षित रखा गया है।
theological_decisions:
- issue: עבד का सामाजिक-कानूनी अर्थ
  choice: सेवक
  alternative: दास
  rationale: शब्द दोनों अर्थ रखता है। इस पद में बंधुआ स्थिति की व्याख्या नहीं, बल्कि सेवक और पुत्र को दिए गए विरासत-अंश के अधिकारों का भेद केंद्र में है।
- issue: דְּרוֹר का अनुवाद
  choice: मुक्ति
  alternative: रिहाई; जुबली
  rationale: मूल शब्द ‘मुक्ति/रिहाई’ बताता है। प्रसंग जुबली-जैसी संपत्ति-वापसी की व्यवस्था का संकेत दे सकता है, पर यहाँ सामान्य हिब्रू शब्द יוֹבֵל प्रयुक्त नहीं है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण और सहज कानूनी-वर्णनात्मक रूप अपनाया गया है। ‘प्रधान’ से नָשִׂיא को ‘राजा’ से अलग रखा गया है। फुटनोट चिह्न सम्बद्ध ‘मुक्ति के वर्ष’ के तुरंत बाद होना अधिक स्पष्ट होता, इसलिए प्रकाशन-पाठ में चिह्न वहीं रखा जाना चाहिए।
