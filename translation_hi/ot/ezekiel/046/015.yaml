  yaml_path: translation/ot/ezekiel/046/015.yaml
  text: They shall provide the lamb, the grain offering, and the oil, morning by morning, as a regular burnt offering.
translation:
  language: hi
  text: वे हर सुबह मेम्ना, अन्नबलि और तेल तैयार करें; यह नित्य होमबलि है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעָשׂוּ
  choice: तैयार करें
  rationale: यहाँ क्रिया का अर्थ बलि-सामग्री को विधिपूर्वक उपलब्ध कराने अथवा तैयार करने से है; हिंदी में ‘तैयार करें’ इस संदर्भ में स्वाभाविक है।
- source_word: הַכֶּבֶשׂ
  choice: मेम्ना
  rationale: एक निश्चित युवा भेड़ को सूचित करने वाले एकवचन पद का सीधा और प्रचलित धार्मिक-संदर्भीय अनुवाद।
- source_word: הַמִּנְחָה
  choice: अन्नबलि
  rationale: मन्दिर की बलि-व्यवस्था में अन्न से संबंधित भेंट के लिए स्थापित और स्पष्ट हिंदी शब्द।
- source_word: בַּבֹּקֶר בַּבֹּקֶר
  choice: प्रतिदिन सुबह
  rationale: इब्रानी पुनरुक्ति प्रत्येक सुबह की नियमितता व्यक्त करती है; इसे सहज आधुनिक हिंदी में प्रस्तुत किया गया है।
- source_word: עוֹלַת תָּמִיד
  choice: नित्य होमबलि
  rationale: עוֹלָה पूर्णतः वेदी पर चढ़ाई जाने वाली होमबलि है और תָּמִיד उसकी निरंतर नियमितता बताता है।
theological_decisions:
- issue: बलि-सामग्री और नित्य होमबलि के बीच संबंध
  choice: ‘यह नित्य होमबलि होगी’
  alternative: ‘नित्य होमबलि के रूप में’
  rationale: मूल का संक्षिप्त पदबंध संबंध को खुला रखता है; हिंदी वाक्य इसे दैनिक सामग्री से संबद्ध करता है, बिना कोई अतिरिक्त कर्मकाण्डीय या सिद्धान्तगत व्याख्या जोड़े।
- issue: कर्ता की पहचान
  choice: बहुवचन ‘वे’ को बनाए रखा
  alternative: कर्ता को किसी विशिष्ट समूह या प्रधान से पहचानना
  rationale: इब्रानी पाठ में क्रिया बहुवचन है, पर इस पद में कर्ता का स्पष्ट नाम नहीं है; इसलिए उसकी पहचान को संकीर्ण नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिंदी, संक्षिप्त और गरिमापूर्ण शैली। बलि-संबंधी पारंपरिक शब्दावली रखी गई है, जबकि पुनरुक्त इब्रानी मुहावरे को सामान्य पाठक के लिए स्वाभाविक बनाया गया है।
