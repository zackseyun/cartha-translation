  yaml_path: translation/ot/ezekiel/046/006.yaml
  text: And on the day of the new moon[a], there shall be an unblemished young bull from the herd, and six lambs and a ram; they shall be unblemished.
translation:
  language: hi
  text: और नए चाँद के दिन[a] झुंड में से एक जवान बैल, छह मेमने और एक मेढ़ा हों; वे दोषरहित हों।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक अर्थ, ‘महीने के दिन’; इस उपासना-संबंधी प्रसंग में यह नए चाँद के पर्व को दर्शाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְיוֹם הַחֹדֶשׁ
  choice: और नए चाँद के दिन
  rationale: शाब्दिक अर्थ ‘महीने के दिन’ है, पर इस उपासना-संबंधी प्रसंग में यह नए चाँद के नियत पर्व-दिन को दर्शाता है।
- source_word: פַּר בֶּן בָּקָר
  choice: गाय-बैलों में से एक बछड़ा
  rationale: यह बलिदान-संबंधी मानक अभिव्यक्ति झुंड के एक युवा बैल को दर्शाती है; हिन्दी में यह रूप स्वाभाविक रहते हुए पशु के वर्ग और आयु-संकेत को बनाए रखता है।
- source_word: תְּמִימִם
  choice: निर्दोष
  rationale: बलिदान के संदर्भ में इसका अर्थ शारीरिक दोष या खोट से रहित पशु है; ‘निर्दोष’ हिन्दी बाइबलीय प्रयोग में संक्षिप्त और परिचित है।
- source_word: וְשֵׁשֶׁת כְּבָשִׂים
  choice: छः मेमने
  rationale: बलिदान-सूची में כְּבָשִׂים कम आयु की भेड़ों अर्थात मेमनों को दर्शाता है; व्याकरणिक पुल्लिंग को अलग से स्पष्ट करना आवश्यक नहीं।
- source_word: וָאַיִל
  choice: और एक मेढ़ा
  rationale: אַיִל बलिदान-संबंधी संदर्भ में वयस्क नर भेड़, अर्थात मेढ़े, का सामान्य शब्द है।
- source_word: יִהְיוּ
  choice: वे निर्दोष हों
  rationale: बहुवचन क्रिया सूचीबद्ध पशुओं के लिए दोषरहित होने की विधिक अपेक्षा व्यक्त करती है; ‘हों’ आदेशात्मक-विधिक बल को स्वाभाविक हिन्दी में रखता है।
