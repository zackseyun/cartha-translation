  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी। ‘चढ़ाया जाए’ मूल में निहित बलिदान-सूची के विधिक संदर्भ को स्पष्ट करता है, जबकि पशुओं के निर्दोष होने की अंतिम अपेक्षा अलग वाक्यांश में सुरक्षित है।
