  rationale: हिन्दी में मार्ग और प्रवेश-द्वार के लिए ‘फाटक से’ स्वाभाविक रूप से דרך का मार्गगत भाव व्यक्त करता है।
- source_word: יֵצֵא
  choice: बाहर जाए
