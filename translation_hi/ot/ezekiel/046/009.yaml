- source_word: לֹא יָשׁוּב
  choice: लौटकर बाहर न जाए
  rationale: שוב का लौटने का अर्थ सुरक्षित है और प्रसंग स्पष्ट करता है कि उसी प्रवेश-मार्ग से बाहर नहीं निकलना है।
