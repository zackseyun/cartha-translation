base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/046/009.yaml
  text: And when the people of the land come before Yahweh at the appointed times[a], whoever enters by way of the north gate to worship shall go out by way of the south gate, and whoever enters by way of the south gate shall go out by way of the north gate. He shall not return by way of the gate through which he entered[c][b], but shall go out straight ahead.
translation:
  language: hi
  text: और जब देश के लोग नियत समयों[a] पर यहोवा के सामने आएँ, तब जो आराधना करने[b] के लिए उत्तरी फाटक से भीतर आए, वह दक्षिणी फाटक से बाहर जाए; और जो दक्षिणी फाटक से भीतर आए, वह उत्तरी फाटक से बाहर जाए। वह जिस फाटक से भीतर आया था, उसी से लौटकर बाहर न जाए, बल्कि सीधे सामने की ओर से बाहर जाए[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “नियत पर्वों पर” अथवा “त्योहारों पर”।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक अर्थ, “झुकने” या “दण्डवत करने के लिए।”
    reason: lexical_alternative
  - marker: c
    text: अधिक शाब्दिक रूप से, “क्योंकि वे उसके/उसके सामने की ओर से बाहर जाएँगे।” इब्रानी में यहाँ क्रिया बहुवचन है। आशय सम्भवतः यह है कि लोग पीछे न लौटें, बल्कि सीधे आगे बढ़कर विपरीत ओर से निकलें।
    reason: textual_and_lexical_clarification
