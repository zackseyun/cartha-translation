theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: मूल में चतुरक्षरी व्यक्तिगत नाम सीधे आया है। हिन्दी बाइबल-पाठकों में परिचित ‘यहोवा’ नाम-सूचक स्वरूप बनाए रखता है और इसे उपाधि ‘प्रभु’ में नहीं बदलता।
- issue: הִשְׁתַּחֲוָה में शारीरिक दण्डवत और व्यापक आराधना का संबंध
  choice: मुख्य पाठ में ‘आराधना करना’, पादटिप्पणी में ‘झुकना/दण्डवत करना’
  alternative: मुख्य पाठ में केवल ‘दण्डवत करना’
  rationale: मन्दिर-संदर्भ में क्रिया उपासना का कार्य बताती है, पर उसके शाब्दिक शारीरिक भाव को पादटिप्पणी में सुरक्षित रखना अर्थगत तनाव को मिटने नहीं देता।
- issue: כִּי נִכְחוֹ יֵצֵאוּ में एकवचन से बहुवचन का परिवर्तन
  choice: सामान्य नियम के अनुरूप मुख्य पाठ में एकवचन, पादटिप्पणी में मूल का बहुवचन उल्लेखित
  alternative: ‘वे उसके सामने की ओर से बाहर जाएँ’
  rationale: पूर्ववर्ती सामान्य एकवचन सहभागी रूपों के बाद बहुवचन क्रिया सामूहिक अथवा सामान्य बल रख सकती है। सहज हिन्दी के लिए वचन-संगति रखी गई, जबकि पाठगत परिवर्तन छिपाया नहीं गया।
