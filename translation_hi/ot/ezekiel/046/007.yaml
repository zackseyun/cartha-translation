  register: आधुनिक मानक हिन्दी में विधिक और गरिमापूर्ण शैली रखी गई है। प्राचीन मापों ‘एपा’ और ‘हिन’ को लिप्यंतरित किया गया है। अर्थ-संबंधित पादटिप्पणी-चिह्न को ‘मेम्नों’ वाली सामर्थ्य-सूचक अभिव्यक्ति के बाद रखा गया है, क्योंकि वही כַּאֲשֶׁר תַּשִּׂיג יָדוֹ का स्थान और आशय है।
