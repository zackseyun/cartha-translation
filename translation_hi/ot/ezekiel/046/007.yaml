base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/046/007.yaml
  text: And he shall provide as a grain offering an ephah for the bull and an ephah for the ram[a], and for the lambs whatever his hand can afford, and a hin of oil with each ephah.
translation:
  language: hi
  text: 'और वह अन्नबलि चढ़ाएगा: बैल के लिए एक एपा और मेढ़े के लिए एक एपा; और मेम्नों के लिए जितना वह जुटा सके[a]। प्रत्येक एपा के लिए एक हिन तेल भी चढ़ाएगा।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जितना उसके साधन अनुमति दें।” इब्रानी मुहावरा शाब्दिक रूप से उस चीज़ को दर्शाता है जहाँ तक उसका हाथ पहुँचता है, अर्थात जिसे वह जुटाने में समर्थ है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵיפָה
  choice: एपा
  rationale: प्राचीन इब्रानी सूखी माप का नाम बनाए रखा गया है; आधुनिक इकाई में अनुमानित रूपांतरण करने से विधि में निर्दिष्ट माप की पहचान धुंधली हो सकती थी।
- source_word: פַּר
  choice: बैल
  rationale: उपसर्ग सहित निश्चित रूप इस विधि में पहले से निर्दिष्ट बलि के बैल की ओर संकेत करता है।
- source_word: אַיִל
  choice: मेढ़ा
  rationale: यह बलि के लिए निर्दिष्ट नर भेड़ को दर्शाने वाला सामान्य और स्पष्ट हिन्दी शब्द है।
- source_word: יַעֲשֶׂה מִנְחָה
  choice: अन्नबलि के रूप में ... चढ़ाएगा
  rationale: बलिदान-संबंधी प्रसंग में מִנְחָה अन्नबलि है; יַעֲשֶׂה के ‘करना/तैयार करना’ भाव को हिन्दी में बलि प्रस्तुत करने के स्वाभाविक क्रियापद ‘चढ़ाना’ से व्यक्त किया गया है।
- source_word: כְּבָשִׂים
  choice: मेम्ने
  rationale: यहाँ आयु-वर्ग प्रमुख है; हिन्दी में ‘मेम्ने’ सहज है और मूल से अधिक विशिष्टता नहीं जोड़ता।
- source_word: כַּאֲשֶׁר תַּשִּׂיג יָדוֹ
  choice: जितना उसका हाथ जुटा सके
  rationale: यह संसाधन-सामर्थ्य बताने वाला इब्रानी मुहावरा है। अनुवाद में ‘हाथ’ का ठोस बिंब बचाते हुए अर्थ को समझने योग्य रखा गया है।
- source_word: שֶׁמֶן הִין לָאֵיפָה
  choice: हर एपा के साथ एक हिन तेल
  rationale: यह अन्नबलि की प्रत्येक एपा मात्रा के अनुपात में तेल की मात्रा निर्धारित करता है; ‘हर ... के साथ’ वितरणार्थ को स्पष्ट करता है।
