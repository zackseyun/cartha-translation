source:
  edition: WLC
  text: וּ/מִנְחָה֩ תַעֲשֶׂ֨ה עָלָ֜י/ו בַּ/בֹּ֤קֶר בַּ/בֹּ֨קֶר֙ שִׁשִּׁ֣ית הָֽ/אֵיפָ֔ה וְ/שֶׁ֛מֶן שְׁלִישִׁ֥ית הַ/הִ֖ין לָ/רֹ֣ס אֶת הַ/סֹּ֑לֶת מִנְחָה֙ לַֽ/יהוָ֔ה חֻקּ֥וֹת עוֹלָ֖ם תָּמִֽיד־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/046/014.yaml
  text: And you shall prepare with it[a], morning by morning, a grain offering of a sixth of an ephah, and a third of a hin of oil to moisten the fine flour—a grain offering to Yahweh[c][b], a perpetual statute continually.
translation:
  language: hi
  text: और उसके साथ[a] तुम हर सुबह एपा का छठा भाग मैदा और हीन का तिहाई भाग तेल अन्नबलि के रूप में तैयार करना, ताकि मैदे को नम किया जाए।[b] यह यहोवा के लिए अन्नबलि है—सदा के लिए निरन्तर की जानेवाली विधि।[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उसके लिए” अथवा “उस पर”; इब्रानी में संकेत सम्भवतः पिछले पद की प्रतिदिन चढ़ाई जानेवाली मेमने की होमबलि की ओर है।
    reason: alternative_reading
  - marker: b
    text: या “मिलाने के लिए”; यहाँ प्रयुक्त इब्रानी क्रिया दुर्लभ है और तेल से मैदे को नम या तर करने का संकेत देती है।
    reason: lexical_alternative
  - marker: c
    text: शाब्दिक रूप से, “सदा की विधियाँ, निरन्तर”; यह मुहावरा इस विधान के स्थायी और नियमित पालन पर बल देता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִנְחָה
  choice: अन्नबलि
  rationale: बलिदान-संबंधी प्रसंग में מִנְחָה मैदे और तेल से तैयार की जानेवाली अन्नबलि को दर्शाता है; सामान्य 'भेंट' की अपेक्षा 'अन्नबलि' अधिक स्पष्ट है।
- source_word: תַעֲשֶׂה
  choice: तुम ... तैयार करना
  rationale: द्वितीय पुरुष एकवचन रूप को बनाए रखते हुए, बलि-विधान के प्रसंग में עשה का स्वाभाविक हिन्दी रूप 'तैयार करना' है।
- source_word: עָלָיו
  choice: उसके साथ
  rationale: सर्वनाम सम्भवतः पिछले पद की प्रतिदिन की होमबलि के मेमने की ओर संकेत करता है। 'उसके साथ' संगति का भाव देता है, पर स्थान-संबंधी अर्थ को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: בַּבֹּקֶר בַּבֹּקֶר
  choice: हर सुबह
  rationale: दोहराव का वितरक और नियमित अर्थ स्वाभाविक आधुनिक हिन्दी में 'हर सुबह' से स्पष्ट होता है।
- source_word: שִׁשִּׁית הָאֵיפָה
  choice: एपा का छठा भाग
  rationale: प्राचीन माप को सुरक्षित रखते हुए मात्रा को ठीक-ठीक व्यक्त करता है।
- source_word: וְשֶׁמֶן שְׁלִישִׁית הַהִין
  choice: हीन का तिहाई भाग तेल
  rationale: मूल मात्रा और प्राचीन माप को बनाए रखते हुए हिन्दी में स्वाभाविक क्रम अपनाया गया है।
- source_word: לָרֹס
  choice: भिगोया जाए
  rationale: दुर्लभ क्रिया רוס मैदे को तेल से नम या तर करने का संकेत देती है। 'भिगोना' क्रिया को स्पष्ट रखता है, जबकि पूर्णतः मिलाने का अर्थ आरोपित नहीं करता।
- source_word: אֶת־הַסֹּלֶת
  choice: मैदा
  rationale: סֹלֶת बलियों में प्रयुक्त बारीक आटा है; सामान्य आधुनिक हिन्दी में 'मैदा' संक्षिप्त और बोधगम्य समतुल्य है।
- source_word: מִנְחָה לַיהוָה
  choice: यहोवा के लिए अन्नबलि
  rationale: मूल में भेंट का प्रकार और उसका प्राप्तकर्ता दोनों दोहराकर बताए गए हैं; हिन्दी में भी यह पहचान सुरक्षित रखी गई है।
- source_word: חֻקּוֹת עוֹלָם תָּמִיד
  choice: सदा बनी रहनेवाली विधि, जिसका पालन निरन्तर किया जाए
  rationale: मूल की संचयी अभिव्यक्ति स्थायी विधान और नियमित पालन दोनों पर बल देती है; हिन्दी वाक्य दोनों पहलुओं को स्पष्ट रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल में वाचा का विशिष्ट नाम יהוה है। हिन्दी बाइबलीय प्रयोग में 'यहोवा' व्यापक रूप से पहचाना जाता है और नाम को पदवी 'प्रभु' में नहीं बदलता; स्वरांकन की ऐतिहासिक अनिश्चितता बनी रहती है।
- issue: עָלָיו का पूर्वसंदर्भ
  choice: उसके साथ
  alternative: उस पर / उसके लिए
  rationale: यह रूप पिछले पद के मेमने अथवा उसकी होमबलि की ओर संकेत कर सकता है। मुख्य पाठ में साथ होने का सम्भावित अर्थ रखा गया है और विकल्प पादटिप्पणी में दिए गए हैं, ताकि अस्पष्टता मिटे नहीं।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किन्तु सहज शैली अपनाई गई है। प्राचीन माप 'एपा' और 'हीन' सुरक्षित रखे गए हैं। विधिक स्वर के लिए 'तैयार करना' और 'पालन ... किया जाए' का प्रयोग किया गया है; दुर्लभ क्रिया और अस्पष्ट सर्वनाम के विकल्प पादटिप्पणियों में सुरक्षित हैं।
