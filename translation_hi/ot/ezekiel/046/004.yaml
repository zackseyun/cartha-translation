base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/046/004.yaml
  text: And the burnt offering that the prince presents to Yahweh on the Sabbath day shall be six unblemished lambs and one unblemished ram[a].
translation:
  language: hi
  text: और सब्त के दिन प्रधान याहवे के लिए जो होमबलि चढ़ाएगा[a], वह छह दोषरहित मेमनों और एक दोषरहित मेढ़े की होगी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अर्पित करेगा।” हिब्रू क्रिया का शाब्दिक अर्थ “निकट लाएगा” है; बलिदानी संदर्भ में इसका अर्थ भेंट अर्पित करना है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָעֹלָה
  choice: और जो होमबलि
  rationale: עֹלָה बलिदानी संदर्भ में पूरी तरह जलाए जाने वाले बलिदान का मानक पद है; हिन्दी में ‘होमबलि’ संक्षिप्त, प्रतिष्ठित और संदर्भानुकूल है।
- source_word: אֲשֶׁר יַקְרִב
  choice: चढ़ाएगा
  rationale: קרב का हिफ़ील बलिदानी प्रयोग किसी भेंट को निकट लाने अथवा अर्पित करने का बोध देता है। ‘चढ़ाएगा’ स्वाभाविक हिन्दी बलिदानी अभिव्यक्ति है; शाब्दिक ‘निकट लाएगा’ अस्पष्ट लगेगा।
- source_word: הַנָּשִׂיא
  choice: प्रधान
  rationale: यहेजकेल के मन्दिर-दर्शन में נָשִׂיא एक मान्य शासकीय अगुवे को दर्शाता है, आवश्यक रूप से राजा को नहीं। ‘प्रधान’ पद की नेतृत्वकारी प्रकृति को बिना राजकीय उपाधि बढ़ाए व्यक्त करता है।
- source_word: לַיהוָה
  choice: यहवे को
  rationale: ל दिशा अथवा समर्पण बताता है, और יהוה को उसके व्यक्तिवाचक वाचा-नाम ‘यहवे’ के रूप में रखा गया है।
- source_word: בְּיוֹם הַשַּׁבָּת
  choice: सब्त के दिन
  rationale: यह अभिव्यक्ति बलिदान का समय स्पष्ट करती है और हिब्रू पदबंध का सहज हिन्दी रूप है।
- source_word: שִׁשָּׁה כְבָשִׂים תְּמִימִם
  choice: छः निर्दोष मेमने
  rationale: כְבָשִׂים बलिदानी सूची में मेमनों को और תְּמִימִם शारीरिक दोष से रहित दशा को दर्शाता है; ‘निर्दोष’ यहाँ बलिदानी अखंडता के अर्थ में है।
- source_word: וְאַיִל תָּמִים
  choice: और एक निर्दोष मेढ़ा
  rationale: אַיִל नर भेड़ अर्थात मेढ़ा है। हिन्दी में गिनती की समानांतर संरचना स्पष्ट करने के लिए ‘एक’ स्वाभाविक रूप से रखा गया है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: यहवे
  alternative: यहोवा / प्रभु
  rationale: मूल पाठ में चतुरक्षरीय व्यक्तिवाचक नाम सीधे आया है। ‘यहवे’ उस वाचा-नाम को सामान्य उपाधि में बदले बिना सुरक्षित रखता है।
- issue: תמים का बलिदानी अर्थ
  choice: निर्दोष
  alternative: बेदाग / दोषरहित / सिद्ध
  rationale: यहाँ शब्द नैतिक निष्पापता नहीं, बलिदान में स्वीकार्य शारीरिक दोषरहितता बताता है। ‘निर्दोष’ सहज है, जबकि पादटिप्पणी उसके विशिष्ट बलिदानी अर्थ को स्पष्ट करती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण और सुबोध शैली रखी गई है। वाक्य की हिब्रू विषय-विधेय संरचना बनाए रखते हुए हिन्दी में स्वाभाविक भविष्यकाल अपनाया गया है।
