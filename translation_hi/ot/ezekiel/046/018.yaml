  text: וְ/לֹא יִקַּ֨ח הַ/נָּשִׂ֜יא מִ/נַּחֲלַ֣ת הָ/עָ֗ם לְ/הֽוֹנֹתָ/ם֙ מֵ/אֲחֻזָּתָ֔/ם מֵ/אֲחֻזָּת֖/וֹ יַנְחִ֣ל אֶת בָּנָ֑י/ו לְמַ֨עַן֙ אֲשֶׁ֣ר לֹֽא יָפֻ֣צוּ עַמִּ֔/י אִ֖ישׁ מֵ/אֲחֻזָּתֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/046/018.yaml
  text: The prince shall not take any of the people's inheritance[a], thrusting them out of their property. He shall give his sons an inheritance out of his own property, so that my people may not be scattered[b], each man from his property.
translation:
  language: hi
  text: प्रधान लोगों की विरासत में से कुछ भी लेकर उन्हें उनकी संपत्ति से बेदखल न करे। वह अपनी ही संपत्ति में से अपने बेटों को विरासत दे, ताकि मेरी प्रजा का कोई भी व्यक्ति[a] अपनी संपत्ति से तितर-बितर न हो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से, “हर एक पुरुष”; यह अभिव्यक्ति प्रजा के प्रत्येक व्यक्ति को अलग-अलग दर्शाती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנָּשִׂיא
  choice: प्रधान
  rationale: यहेजकेल में यह नागरिक अगुवे के लिए एक विशिष्ट पद है; ‘प्रधान’ राजवंशीय अर्थ वाला ‘राजकुमार’ कहे बिना उस पद को व्यक्त करता है।
- source_word: יִקַּח מִנַּחֲלַת הָעָם
  choice: लोगों की विरासत में से कुछ लेकर
  rationale: לקח के साथ מן लोगों को मिली पैतृक भूमि में से लेने का निषेध व्यक्त करता है; ‘कुछ’ हिन्दी में इस अनिश्चित अंश को स्वाभाविक बनाता है।
- source_word: לְהוֹנֹתָם מֵאֲחֻזָּתָם
  choice: उन्हें उनकी संपत्ति से बेदखल
  rationale: ינה का हिफ़ील रूप उत्पीड़न या अन्याय करने का अर्थ रखता है और מן־אחזה के साथ भूमि से वंचित करने की परिस्थिति बताता है। मुख्य पाठ में प्रसंगगत परिणाम स्पष्ट है, जबकि पादटिप्पणी व्यापक शाब्दिक अर्थ सुरक्षित रखती है।
- source_word: מֵאֲחֻזָּתוֹ יַנְחִל אֶת־בָּנָיו
  choice: वह अपनी ही संपत्ति में से अपने बेटों को विरासत दे
  rationale: נחל का हिफ़ील किसी को विरासत दिलाने या देने का अर्थ रखता है; ‘अपनी ही’ प्रधान की संपत्ति और लोगों की संपत्ति के बीच विरोध को स्पष्ट करता है।
- source_word: לֹא יָפֻצוּ
  choice: तितर-बितर न हो
  rationale: פוץ के बिखरने या तितर-बितर होने के चित्र को बनाए रखता है, बिना यह अनावश्यक रूप से तय किए कि विस्थापन किस साधन से होगा।
- source_word: עַמִּי אִישׁ מֵאֲחֻזָּתוֹ
  choice: मेरी प्रजा का हर एक व्यक्ति अपनी संपत्ति से
  rationale: איש यहाँ वितरणात्मक है। ‘हर एक व्यक्ति’ आधुनिक हिन्दी में प्रत्येक सदस्य को स्पष्ट करता है और मूल वाक्य की वितरणात्मक शक्ति को बनाए रखता है।
theological_decisions:
- issue: אִישׁ का वितरणात्मक और पुल्लिंग रूप
  choice: हर एक व्यक्ति
  alternative: हर एक पुरुष
  rationale: इस प्रसंग में אִישׁ प्रजा के प्रत्येक सदस्य के लिए वितरणात्मक रूप से प्रयुक्त है। ‘व्यक्ति’ उसके प्रतिनिधिक अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है; पादटिप्पणी मूल के शाब्दिक पुल्लिंग रूप को दर्ज करती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। ‘विरासत’ (נחלה) और ‘संपत्ति’ (אחזה) का भेद बनाए रखा गया है; भूमि-अधिकार का प्रसंग ‘बेदखल’ से स्पष्ट होता है, पर मूल क्रिया के व्यापक अर्थ को पादटिप्पणी में सुरक्षित रखा गया है।
