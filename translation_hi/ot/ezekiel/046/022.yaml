  yaml_path: translation/ot/ezekiel/046/022.yaml
  text: In the four corners of the court there were enclosed courts[a], forty long and thirty wide[c][b]; the four of them had the same measurement.
translation:
  language: hi
  text: आँगन के चारों कोनों में घिरे हुए आँगन[a] थे। उनमें से हर एक की लंबाई चालीस और चौड़ाई तीस थी[b]; चारों का माप एक ही था[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “दीवारों से घिरे आँगन” अथवा “अलग किए हुए आँगन।” इब्रानी विशेषण संभवतः उनके बंद या परिसीमित स्थान होने का वर्णन करता है।
    reason: lexical_alternative
  - marker: b
    text: इस पद के इब्रानी पाठ में माप की इकाई “हाथ” स्पष्ट रूप से दोहराई नहीं गई है, यद्यपि आसपास दिए गए मन्दिर के मापों से इसका संकेत मिलता है।
    reason: cultural_note
  - marker: c
    text: इब्रानी का अंतिम शब्द दुर्लभ और कठिन है। इसका अर्थ यह भी हो सकता है कि ये चारों कोनों में बनाए गए आँगन थे।
    reason: lexical_alternative
lexical_decisions:
