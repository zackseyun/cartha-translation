  choice: कोनों
  rationale: मन्दिर की वास्तुकला के इस संदर्भ में यह शब्द बड़े आँगन के कोनों या कोने वाले भागों को दर्शाता है; ‘कोनों’ सहज और सटीक है।
- source_word: חֲצֵרוֹת
  choice: आँगन
  rationale: यह बड़े आँगन के भीतर बने छोटे प्रांगणों को दर्शाता है। आधुनिक हिन्दी में ‘आँगन’ सरल है और मन्दिर-परिसर के संदर्भ में स्वाभाविक लगता है।
- source_word: קְטֻרוֹת
  choice: घिरे हुए
  rationale: यह विशेषण इन आँगनों के बंद या परिसीमित होने का भाव देता है, पर यह स्पष्ट नहीं करता कि वे किस सामग्री की दीवार से घिरे थे।
- source_word: אַרְבָּעִים אֹרֶךְ וּשְׁלֹשִׁים רֹחַב
  choice: चालीस लंबा और तीस चौड़ा
  rationale: इब्रानी में माप संक्षिप्त रूप से दिया गया है। हिन्दी में ‘लंबा’ और ‘चौड़ा’ जोड़ना स्वाभाविक है; इकाई इस पद में स्पष्ट नहीं है, इसलिए उसे मुख्य पाठ में नहीं जोड़ा गया।
- source_word: מִדָּה אַחַת
  choice: माप एक ही था
  rationale: यह वाक्यांश चारों आँगनों के समान आकार और आयाम को व्यक्त करता है।
- source_word: לְאַרְבַּעְתָּם
  choice: चारों का
  rationale: सर्वनामिक प्रत्यय पीछे बताए गए चार कोने वाले आँगनों की ओर संकेत करता है।
- source_word: מְהֻקְצָעוֹת
  choice: था
  rationale: यह अंतिम रूप दुर्लभ और अर्थ की दृष्टि से कठिन है। मुख्य पाठ समान माप वाले चार आँगनों का संदर्भ सहज रूप में देता है, जबकि वैकल्पिक समझ को पाद-टिप्पणी में सुरक्षित रखा गया है।
