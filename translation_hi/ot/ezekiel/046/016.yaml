id: EZK.46.16
reference: Ezekiel 46:16
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: כֹּה אָמַ֞ר אֲדֹנָ֣/י יְהֹוִ֗ה כִּֽי יִתֵּ֨ן הַ/נָּשִׂ֤יא מַתָּנָה֙ לְ/אִ֣ישׁ מִ/בָּנָ֔י/ו נַחֲלָת֥/וֹ הִ֖יא לְ/בָנָ֣י/ו תִּֽהְיֶ֑ה אֲחֻזָּתָ֥/ם הִ֖יא בְּ/נַחֲלָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/046/016.yaml
  text: 'Thus says the Lord GOD: If the prince gives a gift to any one of his sons[a], it is his inheritance[b]; it shall belong to his sons as their property by inheritance.'
translation:
  language: hi
  text: 'प्रभु यहोवा यों कहता है: यदि शासक अपने बेटों में से किसी एक को कोई भेंट दे, तो वह उसकी विरासत होगी; वह उसके बेटों की विरासत के रूप में उनकी संपत्ति होगी।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כֹּה אָמַר
  choice: यों कहता है
  rationale: यह नबी के संदेश का मानक सूत्र है; वर्तमानकालीन हिन्दी मूल इब्रानी सूत्र के लिए स्वाभाविक और गरिमापूर्ण है।
- source_word: אֲדֹנָי יְהוִה
  choice: परमेश्वर यहोवा
  rationale: संयुक्त उपाधि में אֲדֹנָי को ‘परमेश्वर’ और वाचा के नाम יְהוָה को ‘यहोवा’ रखा गया है, जिससे दोनों तत्व अलग और स्पष्ट रहते हैं।
- source_word: כִּי
  choice: यदि
  rationale: यहाँ כִּי विधिक प्रसंग में एक शर्त प्रस्तुत करता है, कारण नहीं।
- source_word: הַנָּשִׂיא
  choice: प्रधान
  rationale: यहेजकेल के इस विधान में यह नागरिक शासक की तकनीकी उपाधि है; ‘प्रधान’ आधुनिक हिन्दी में स्पष्ट है और अनावश्यक राजवंशीय अर्थ से बचता है।
- source_word: מַתָּנָה
  choice: भेंट
  rationale: यह किसी को दी गई वस्तु या अनुदान को सूचित करता है; ‘भेंट’ संक्षिप्त और सहज है।
- source_word: לְאִישׁ מִבָּנָיו
  choice: अपने बेटों में से किसी एक को
  rationale: शाब्दिक रूप ‘अपने बेटों में से एक पुरुष को’ है, पर אִישׁ यहाँ समूह के किसी एक सदस्य का वितरणात्मक बोध देता है।
- source_word: נַחֲלָתוֹ הִיא
  choice: वह उसका पैतृक भाग होगा
  rationale: נַחֲלָה यहाँ वंशानुगत संपत्ति या हिस्से को दर्शाता है; ‘पैतृक भाग’ भूमि-संबंधी और उत्तराधिकार-संबंधी अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: לְבָנָיו תִּהְיֶה
  choice: वह उसके बेटों को ... मिलेगा
  rationale: सर्वनाम का सबसे निकट और प्रसंगानुकूल पूर्वपद वह बेटा है जिसे भेंट मिली; आगे उसकी संतति में संपत्ति बने रहने की बात है।
- source_word: אֲחֻזָּתָם בְּנַחֲלָה
  choice: विरासत में मिली उनकी संपत्ति के रूप में
  rationale: אֲחֻזָּה स्थायी भू-संपत्ति या अधिकार में रखी संपत्ति है, और בְּנַחֲלָה उसके वंशानुगत आधार को बताता है।
theological_decisions:
- issue: संयुक्त ईश्वरीय उपाधि אֲדֹנָי יְהוִה का अनुवाद
  choice: परमेश्वर यहोवा
  alternative: प्रभु यहोवा / प्रभु परमेश्वर
  rationale: ‘यहोवा’ मूल में आए विशिष्ट ईश्वरीय नाम को प्रत्यक्ष रखता है; אֲדֹנָי को ‘परमेश्वर’ कहने से अस्वाभाविक ‘प्रभु यहोवा’ से बचते हुए संयुक्त संबोधन सुरक्षित रहता है।
- issue: לְבָנָיו में सर्वनाम का संदर्भ
  choice: भेंट पाने वाले बेटे के बेटे
  alternative: प्रधान के बेटे
  rationale: वाक्य की उत्तराधिकार-श्रृंखला और निकटतम एकवचन पुरुष-संदर्भ भेंट पाने वाले बेटे की ओर संकेत करते हैं; हिन्दी में ‘उसके बेटों’ मूल की संदर्भगत लघु अस्पष्टता को भी पूरी तरह समाप्त नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण विधिक-नबीगत शैली रखी गई है। वाक्य को सामान्य पाठक के लिए स्पष्ट बनाया गया है, पर उत्तराधिकार की मूल क्रमिक संरचना और सर्वनाम-संबंध को अनावश्यक व्याख्या से नहीं बदला गया।
