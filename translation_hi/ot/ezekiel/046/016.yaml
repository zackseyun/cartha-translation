revisions:
- from: 'परमेश्वर यहोवा यों कहता है: यदि प्रधान अपने बेटों में से किसी एक को कोई भेंट दे, तो वह उसका पैतृक भाग होगा; वह उसके बेटों को विरासत में मिली उनकी संपत्ति के रूप में मिलेगा।'
  to: 'प्रभु यहोवा यों कहता है: यदि शासक अपने बेटों में से किसी एक को कोई भेंट दे, तो वह उसकी विरासत होगी; वह उसके बेटों की विरासत के रूप में उनकी संपत्ति होगी।'
  rationale: 'The revision preserves the Hebrew conditional and its deliberately compact pronominal succession: the gift becomes the receiving son''s inheritance and remains the inherited property of his sons. It corrects the divine title, removes the unsupported paternal nuance, and expresses the final legal-status clause in clear modern Hindi without adding interpretation.'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T02:56:05Z'
review_pass:
  verdict: revise
  source_fidelity: The conditional legal sense, the distributive reference to one son, and the succession of the holding to that son's sons are substantially represented. However, “पैतृक भाग” adds a specifically paternal sense not expressed by נַחֲלָה, and “परमेश्वर यहोवा” does not adequately preserve the distinct title-plus-divine-name combination אַדֹנָי יְהוִה.
  naturalness: The draft is generally clear, but “विरासत में मिली उनकी संपत्ति के रूप में मिलेगा” is syntactically heavy and can misleadingly imply that the property had already been inherited. A more direct legal formulation is natural in modern Hindi.
  terminology: Use “प्रभु यहोवा” for אַדֹנָי יְהוִה, retaining both the lordship title and the name Yahweh. “शासक” is a natural modern rendering of the technical civic title נָשִׂיא in this context. “विरासत” avoids the unwarranted paternal specification of “पैतृक भाग.”
  issues:
  - severity: medium
    issue: “परमेश्वर यहोवा” for אַדֹנָי יְהוִה
    rationale: אַדֹנָי is “Lord,” whereas “परमेश्वर” means God. The draft changes the first element of the compound divine title rather than translating it.
  - severity: medium
    issue: “पैतृक भाग” for נַחֲלָתוֹ
    rationale: The Hebrew denotes an inheritance or hereditary holding; it does not specify that it is paternal property. “पैतृक” introduces an unnecessary restriction.
  - severity: low
    issue: Final inheritance clause is cumbersome
    rationale: “मिलेगा” plus “विरासत में मिली ... के रूप में” is less idiomatic and can obscure the legal assertion that the holding belongs to the recipient son's sons as an inherited possession.
  revised_text: 'प्रभु यहोवा यों कहता है: यदि शासक अपने बेटों में से किसी एक को कोई भेंट दे, तो वह उसकी विरासत होगी; वह उसके बेटों की विरासत के रूप में उनकी संपत्ति होगी।'
  revised_footnotes: []
  revision_rationale: 'The revision preserves the Hebrew conditional and its deliberately compact pronominal succession: the gift becomes the receiving son''s inheritance and remains the inherited property of his sons. It corrects the divine title, removes the unsupported paternal nuance, and expresses the final legal-status clause in clear modern Hindi without adding interpretation.'
