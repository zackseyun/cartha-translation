source:
  edition: WLC
  text: וְ/הִשְׁתַּחֲו֣וּ עַם הָ/אָ֗רֶץ פֶּ֚תַח הַ/שַּׁ֣עַר הַ/ה֔וּא בַּ/שַּׁבָּת֖וֹת וּ/בֶ/חֳדָשִׁ֑ים לִ/פְנֵ֖י יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/046/003.yaml
  text: And the people of the land shall bow down at the entrance of that gate[a], before Yahweh[b], on the Sabbaths and on the new moons.
translation:
  language: hi
  text: और देश के लोग[a] सब्तों और नए चाँद के दिनों में उस फाटक के प्रवेश पर यहोवा के सामने दण्डवत् करेंगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘देश के लोग’ से यहाँ सम्भवतः राजकुमार और याजकों से अलग सामान्य जन का आशय है।
    reason: cultural_note
lexical_decisions:
- source_word: וְהִשְׁתַּחֲווּ
  choice: दण्डवत् करेंगे
  rationale: क्रिया שׁחה यहाँ श्रद्धापूर्वक झुकने की शारीरिक क्रिया और उपासना—दोनों का भाव रखती है। ‘दण्डवत् करेंगे’ इसे संक्षेप और गरिमा के साथ व्यक्त करता है।
- source_word: עַם הָאָרֶץ
  choice: देश के लोग
  rationale: शाब्दिक सामाजिक पदबंध को बनाए रखा गया है; इस प्रसंग में इससे राजकुमार और याजकों से भिन्न सामान्य जन का संकेत मिलता है।
- source_word: פֶּתַח הַשַּׁעַר הַהוּא
  choice: उस फाटक के प्रवेश-द्वार पर
  rationale: פֶּתַח के स्थानगत अर्थ और הַהוּא के संकेतवाचक बल, दोनों को स्पष्ट रूप से सुरक्षित रखता है।
- source_word: בַּשַּׁבָּתוֹת
  choice: सब्तों ... में
  rationale: इब्रानी बहुवचन आवर्ती पवित्र दिनों को दर्शाता है; हिन्दी में ‘सब्तों’ उसे सीधे बनाए रखता है।
- source_word: וּבֶחֳדָשִׁים
  choice: और नए चाँद के दिनों में
  rationale: חֹדֶשׁ यहाँ केवल महीनों के बजाय नवचंद्र के धार्मिक अवसरों को सूचित करता है; ‘नए चाँद के दिन’ सामान्य पाठक के लिए स्वाभाविक और स्पष्ट है।
- source_word: לִפְנֵי יְהוָה
  choice: यहोवा के सामने
  rationale: לִפְנֵי परमेश्वर की उपस्थिति में आराधना का भाव देता है, और יְהוָה को उसके विशिष्ट नाम ‘यहोवा’ से प्रस्तुत किया गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे / प्रभु
  rationale: मूल पाठ में चार अक्षरों वाला विशिष्ट ईश्वरीय नाम है। हिन्दी में व्यापक रूप से पहचाना जाने वाला रूप ‘यहोवा’ नाम की विशिष्टता को बनाए रखता है, जबकि ‘प्रभु’ उसे उपाधि में बदल देता है।
- issue: עַם הָאָרֶץ की सामाजिक पहचान
  choice: मुख्य पाठ में ‘देश के लोग’, टिप्पणी में सामान्य जन का संकेत
  alternative: सामान्य लोग
  rationale: शाब्दिक पदबंध को मुख्य पाठ में रखने से पाठ की भाषा सुरक्षित रहती है; प्रसंगगत सामाजिक भेद को टिप्पणी स्पष्ट करती है, बिना अनुवाद में व्याख्या जोड़ने के।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज शैली अपनाई गई है। वाक्यक्रम को हिन्दी के स्वाभाविक प्रवाह के अनुसार रखा गया है; ‘दण्डवत्’ उपासना की शारीरिक और धार्मिक दोनों छवियों को सुरक्षित रखता है।
