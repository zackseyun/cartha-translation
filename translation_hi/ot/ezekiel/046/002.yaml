source:
  edition: WLC
  text: וּ/בָ֣א הַ/נָּשִׂ֡יא דֶּרֶךְ֩ אוּלָ֨ם הַ/שַּׁ֜עַר מִ/ח֗וּץ וְ/עָמַד֙ עַל מְזוּזַ֣ת הַ/שַּׁ֔עַר וְ/עָשׂ֣וּ הַ/כֹּהֲנִ֗ים אֶת עֽוֹלָת/וֹ֙ וְ/אֶת שְׁלָמָ֔י/ו וְ/הִֽשְׁתַּחֲוָ֛ה עַל מִפְתַּ֥ן הַ/שַּׁ֖עַר וְ/יָצָ֑א וְ/הַ/שַּׁ֥עַר לֹֽא יִסָּגֵ֖ר עַד הָ/עָֽרֶב־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/046/002.yaml
  text: And the prince shall enter by way of the porch of the gate from outside[a], and shall stand by the doorpost of the gate. Then the priests shall offer his burnt offering and his peace offerings, and he shall bow down in worship at the threshold of the gate. Then he shall go out, but the gate shall not be shut until evening.
translation:
  language: hi
  text: और प्रधान बाहर से फाटक के बरामदे के मार्ग से भीतर आएगा और फाटक की चौखट पर खड़ा होगा। तब याजक उसकी होमबलि और मेलबलियाँ[a] चढ़ाएँगे। वह फाटक की देहरी पर दण्डवत् करेगा और फिर बाहर चला जाएगा; पर फाटक साँझ तक बन्द नहीं किया जाएगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘उसकी सहभागिता-बलियाँ’ अथवा ‘उसकी शान्ति-बलियाँ’।
    reason: שְׁלָמִים की अर्थ-सीमा में मेल, शान्ति और सहभागी भोज—तीनों की छाया है; किसी एक हिन्दी पद से यह पूरी तरह व्यक्त नहीं होती।
lexical_decisions:
- source_word: הַנָּשִׂיא
  choice: प्रधान
  rationale: यहेजकेल के मन्दिर-दर्शन में यह एक विशिष्ट नागरिक अथवा शासकीय पदधारी है, पर पद स्वयं उसे राजा या मसीहा नहीं ठहराता। ‘प्रधान’ इस पदगत भेद को बनाए रखता है।
- source_word: דֶּרֶךְ אוּלָם הַשַּׁעַר מִחוּץ
  choice: बाहर से फाटक के बरामदे के मार्ग से
  rationale: דֶּרֶךְ मार्ग को, אוּלָם प्रवेश-बरामदे को और מִחוּץ बाहर की ओर से आने को व्यक्त करता है; यह अनुवाद स्थानिक क्रम सुरक्षित रखता है।
- source_word: מְזוּזַת הַשַּׁעַר
  choice: फाटक की चौखट
  rationale: מְזוּזָה द्वार की चौखट या खम्भे को सूचित करता है। ‘चौखट’ सामान्य हिन्दी में स्वाभाविक और स्थापत्य की दृष्टि से पर्याप्त विशिष्ट है।
- source_word: וְעָשׂוּ הַכֹּהֲנִים אֶת עֹלָתוֹ
  choice: याजक उसकी होमबलि ... चढ़ाएँगे
  rationale: बलिदान के प्रसंग में עָשָׂה उसका अनुष्ठान करने अथवा उसे चढ़ाने के अर्थ में है; हिन्दी में ‘चढ़ाना’ स्वाभाविक है।
- source_word: שְׁלָמָיו
  choice: उसकी मेलबलियाँ
  rationale: שְׁלָמִים बहुवचन बलिदानों को सूचित करता है और शान्ति, कुशलता तथा सहभागिता की अर्थ-छाया रखता है। ‘मेलबलियाँ’ संक्षिप्त पारम्परिक पद है; वैकल्पिक अर्थ फुटनोट में दिया गया है।
- source_word: וְהִשְׁתַּחֲוָה
  choice: दण्डवत् करेगा
  rationale: यह क्रिया श्रद्धापूर्वक झुकने अथवा भूमि तक दण्डवत् होने की शारीरिक क्रिया बताती है। प्रसंग उपासना का अर्थ स्पष्ट करता है।
- source_word: מִפְתַּן הַשַּׁעַר
  choice: फाटक की देहरी पर
  rationale: מִפְתָּן देहरी अथवा दहलीज है; ‘देहरी’ आधुनिक हिन्दी में स्पष्ट और स्वाभाविक स्थापत्य शब्द है।
- source_word: לֹא יִסָּגֵר עַד הָעָרֶב
  choice: फाटक साँझ तक बन्द नहीं किया जाएगा
  rationale: סגר का निफ़अल रूप बन्द किए जाने या बन्द होने का अर्थ देता है। यह हिन्दी वाक्य निष्क्रिय भाव को स्पष्ट रखता है।
theological_decisions:
- issue: यहेजकेल के मन्दिर-दर्शन में הַנָּשִׂיא की पहचान और पद
  choice: ‘प्रधान’ कहकर पद को अनिर्धारित रखना
  alternative: राजकुमार, शासक, मसीही प्रधान
  rationale: पद इस व्यक्ति को विशेष मन्दिर-संबंधी अधिकार और सीमाएँ देता है, पर इस पद में उसे स्पष्टतः राजा या मसीहा नहीं कहा गया। अतः अनुवाद व्यापक धार्मिक पहचान तय नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य शैली। ‘याजक’, ‘होमबलि’ और ‘दण्डवत्’ जैसे परिचित बाइबलीय-धार्मिक शब्द बनाए गए हैं; वाक्य-संरचना मूल इब्रानी के क्रम और स्थापत्य विवरण के निकट है।
