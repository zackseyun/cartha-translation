- source_word: מִנְחָה
  choice: अन्नबलि
  rationale: बलिदान-संबंधी संदर्भ में यह अनाज से बनी भेंट को दर्शाता है; ‘अन्नबलि’ आधुनिक हिन्दी में संक्षिप्त और प्रचलित धार्मिक पद है।
- source_word: אֵיפָה
