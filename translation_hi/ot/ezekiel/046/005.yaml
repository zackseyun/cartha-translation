  text: And the grain offering shall be an ephah with the ram[a], and with the lambs a grain offering as much as his hand can give[b], and a hin of oil with each ephah.
translation:
  language: hi
  text: और मेढ़े के लिए अन्नबलि एक एपा हो[a], और मेम्नों के लिए अन्नबलि उसकी सामर्थ्य के अनुसार हो[b]; और हर एपा के साथ तेल एक हीन हो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “मेढ़े के साथ”; इसी प्रकार आगे “मेम्नों के साथ।” बलिदान-संबंधी निर्देशों में इब्रानी संबंधबोधक शब्द संगति या किसी पशु के लिए नियत किए जाने—दोनों का भाव दे सकता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक अर्थ, “उसके हाथ की भेंट”; यह मुहावरा उसकी देने की सामर्थ्य के अनुसार देने को दर्शाता है।
    reason: lexical_alternative
