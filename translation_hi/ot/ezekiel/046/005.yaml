  rationale: यह सूखी वस्तुओं की प्राचीन माप है; मूल पाठ की विधिक-सांस्कृतिक सटीकता बनाए रखने के लिए इसका लिप्यंतरण किया गया है।
- source_word: לָאַיִל / לַכְּבָשִׂים
  choice: मेढ़े के साथ / मेम्नों के साथ
