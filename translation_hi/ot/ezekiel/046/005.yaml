- source_word: מַתַּת יָדוֹ
  choice: जितना उसका हाथ दे सके
  rationale: यह सामर्थ्य के अनुसार देने का मुहावरा है; अनुवाद अर्थ स्पष्ट करते हुए मूल का ठोस ‘हाथ’ वाला बिंब बनाए रखता है।
- source_word: שֶׁמֶן
  choice: तेल
  rationale: बलिदान-संबंधी संदर्भ में इसका सामान्य और पर्याप्त हिन्दी रूप।
- source_word: הִין
  choice: हीन
  rationale: यह तरल पदार्थों की प्राचीन माप है; तकनीकी माप को सुरक्षित रखने के लिए लिप्यंतरण किया गया है।
- source_word: לָאֵיפָה
  choice: हर एपा के साथ
  rationale: यह तेल और अन्न की माप का अनुपात बताता है; ‘हर एपा के साथ’ हिन्दी में वितरणात्मक अर्थ स्वाभाविक रूप से व्यक्त करता है।
