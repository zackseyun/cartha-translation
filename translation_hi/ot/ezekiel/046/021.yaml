- source_word: אַרְבַּעַת מִקְצוֹעֵי הֶחָצֵר
  choice: आँगन के चारों कोने
  rationale: מִקְצוֹעַ वास्तु-सन्दर्भ में कोने या कोण को दर्शाता है; हिन्दी में “चारों कोने” सहज और सटीक है।
- source_word: וְהִנֵּה
  choice: और देखो
  rationale: यह दृष्टिगोचर बात की ओर अचानक ध्यान खींचता है। “और देखो” यह संकेतात्मक बल बनाए रखता है और दर्शन-वृत्तान्त के अनुरूप है।
- source_word: חָצֵר בְּמִקְצֹעַ הֶחָצֵר חָצֵר בְּמִקְצֹעַ הֶחָצֵר
  choice: आँगन के हर कोने में एक आँगन था
  rationale: इब्रानी में वाक्यांश दोहराया गया है, जबकि ठीक पहले चार कोनों का उल्लेख है। हिन्दी में “हर कोने में” उसके वितरणात्मक आशय को स्पष्ट और स्वाभाविक रूप से व्यक्त करता है; शाब्दिक पुनरावृत्ति पादटिप्पणी में दी गई है।
