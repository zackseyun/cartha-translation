  text: Then he brought me out to the outer court and led me past the four corners of the court[a], and behold, in each corner of the court there was a court.
translation:
  language: hi
  text: फिर वह मुझे बाहरी आँगन में ले गया और मुझे आँगन के चारों कोनों के पास से ले गया। और देखो, आँगन के हर कोने में एक आँगन था।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इब्रानी में यहाँ शाब्दिक रूप से दोहराव है: “आँगन के कोने में एक आँगन, आँगन के कोने में एक आँगन।” पहले चार कोनों का उल्लेख होने के कारण इसका आशय है कि चारों में से हर कोने में एक आँगन था।'
    reason: lexical_alternative
