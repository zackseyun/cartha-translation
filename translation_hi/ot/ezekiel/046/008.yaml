id: EZK.46.8
reference: Ezekiel 46:8
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וּ/בְ/ב֖וֹא הַ/נָּשִׂ֑יא דֶּ֣רֶךְ אוּלָ֤ם הַ/שַּׁ֨עַר֙ יָב֔וֹא וּ/בְ/דַרְכּ֖/וֹ יֵצֵֽא׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/046/008.yaml
  text: When the prince enters[a], he shall enter by way of the porch of the gate, and he shall go out by the same way.
translation:
  language: hi
  text: जब प्रधान प्रवेश करे, तब वह फाटक के बरामदे से होकर भीतर आए, और अपने ही मार्ग से[a] बाहर निकले।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक अर्थ, “अपने मार्ग से वह बाहर निकलेगा”; अर्थात वह उसी मार्ग से बाहर निकले जिससे उसने प्रवेश किया था।
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בְ/ב֖וֹא
  choice: जब ... प्रवेश करे
  rationale: וְ + בְּ के साथ infinitive construct यहाँ समयसूचक है। ‘जब ... प्रवेश करे’ इस अर्थ को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: הַ/נָּשִׂיא
  choice: प्रधान
  rationale: यहेजकेल के इस दर्शन में נָשִׂיא नागरिक शासक या अगुवे के लिए प्रयुक्त है; ‘प्रधान’ उसकी भूमिका को व्यक्त करता है, पर उसे अनिवार्य रूप से राजा या राजपुत्र नहीं ठहराता।
- source_word: דֶּ֣רֶךְ אוּלָ֤ם הַ/שַּׁ֨עַר
  choice: फाटक के बरामदे से होकर
  rationale: यह वाक्यांश प्रवेश का मार्ग बताता है। ‘से होकर’ דֶּרֶךְ की मार्गवाचक शक्ति को स्वाभाविक हिन्दी में देता है, और ‘बरामदा’ אוּלָם के स्थापत्यगत अर्थ को साधारण पाठक के लिए स्पष्ट रखता है।
- source_word: יָב֔וֹא
  choice: भीतर आए
  rationale: यह अपूर्ण क्रिया इस नियमावली में निर्देशात्मक बल रखती है। ‘भीतर आए’ हिन्दी में प्रवेश की गति को स्पष्ट करता है और केवल भविष्यवाणी का भाव नहीं देता।
- source_word: וּ/בְ/דַרְכּ֖/וֹ
  choice: अपने ही मार्ग से
  rationale: शाब्दिक अर्थ ‘अपने मार्ग से’ है। ‘ही’ पहले बताए गए प्रवेश-मार्ग और निकास-मार्ग की समानता को संदर्भानुसार उजागर करता है, जबकि पादटिप्पणी शाब्दिक रूप सुरक्षित रखती है।
- source_word: יֵצֵֽא
  choice: बाहर निकले
  rationale: יצא का सीधा अर्थ बाहर जाना या निकलना है। निर्देशात्मक संदर्भ में ‘बाहर निकले’ स्वाभाविक और स्पष्ट है।
theological_decisions:
- issue: यहेजकेल के मन्दिर-दर्शन में הַנָּשִׂיא की पहचान और पद
  choice: तटस्थ रूप से ‘प्रधान’
  alternative: ‘राजकुमार’, ‘शासक’, या विशेष रूप से मसीही प्रधान
  rationale: यह पद केवल उसके प्रवेश और निकास की प्रक्रिया बताता है तथा उसकी व्यापक पहचान निश्चित नहीं करता। इसलिए अनुवाद उसे राजा, राजपुत्र या मसीह के रूप में पहले से निर्धारित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘फाटक के बरामदे से होकर’ स्थापत्य-विवरण को अनावश्यक तकनीकी शब्दावली के बिना स्पष्ट करता है; विधिसूचक क्रियाओं के लिए ‘करे/आए/निकले’ का प्रयोग किया गया है।
