  text: וַ/יְבִיאֵ֣/נִי בַ/מָּבוֹא֮ אֲשֶׁ֣ר עַל כֶּ֣תֶף הַ/שַּׁעַר֒ אֶל הַ/לִּשְׁכ֤וֹת הַ/קֹּ֨דֶשׁ֙ אֶל הַ/כֹּ֣הֲנִ֔ים הַ/פֹּנ֖וֹת צָפ֑וֹנָ/ה וְ/הִנֵּה שָׁ֣ם מָק֔וֹם ב/ירכת/ם יָֽמָּ/ה־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/046/019.yaml
  text: Then he brought me through the entrance that was beside the gate to the holy chambers for the priests[a], which faced north; and behold, there was a place there at their far western end.
translation:
  language: hi
  text: तब वह मुझे उस प्रवेश-मार्ग से होकर, जो फाटक की बगल में था, उत्तर की ओर मुख किए हुए याजकों के पवित्र कक्षों तक ले गया। और देखो, वहाँ उनके सुदूर पश्चिमी छोर पर एक स्थान था।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “उनके सुदूर छोर पर, पश्चिम की ओर।”
    reason: हिब्रू पदबंध की स्थान-संबंधी रचना और उसमें उपस्थित ‘उनके’ प्रत्यय को स्पष्ट करने के लिए।
lexical_decisions:
- source_word: וַיְבִיאֵנִי
  choice: तब वह मुझे … ले गया
  rationale: यह בוא का हिफ़ील रूप है, जिसमें प्रथम पुरुष एकवचन कर्म-प्रत्यय है। ‘तब’ कथानक के क्रम को और ‘ले गया’ कारक अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: בַמָּבוֹא
  choice: प्रवेश-मार्ग से होकर
  rationale: מָבוֹא प्रवेश या आने-जाने के मार्ग को दर्शाता है। प्रसंग में इसी मार्ग से आगे ले जाए जाने की गति है, इसलिए ‘से होकर’ उपयुक्त है।
- source_word: אֲשֶׁר עַל כֶּתֶף הַשַּׁעַר
  choice: जो फाटक की बगल में था
  rationale: כֶּתֶף का मूल अर्थ ‘कंधा’ है, पर स्थापत्य-संदर्भ में इसका अर्थ पार्श्व या बगल है। ‘फाटक की बगल में’ स्पष्ट और स्वाभाविक है।
- source_word: אֶל הַלִּשְׁכוֹת הַקֹּדֶשׁ אֶל הַכֹּהֲנִים
  choice: याजकों के पवित्र कक्षों तक
  rationale: לִשְׁכוֹת मंदिर के कक्ष हैं और הַקֹּדֶשׁ उन्हें पवित्र बताता है। दूसरा אֶל इन कक्षों का याजकों से संबंध या उनके उपयोग के लिए नियोजन दर्शाता है; हिन्दी में संबंधवाचक रूप इसे संक्षेप और स्पष्टता से व्यक्त करता है।
- source_word: הַפֹּנוֹת צָפוֹנָה
  choice: उत्तर की ओर मुख किए हुए
  rationale: פנה का कृदन्त और दिशासूचक צָפוֹנָה कक्षों की उत्तराभिमुख स्थिति बताते हैं।
- source_word: וְהִנֵּה שָׁם מָקוֹם
  choice: और देखो, वहाँ … एक स्थान था
  rationale: הִנֵּה दृश्य की ओर ध्यान खींचता है; ‘देखो’ यह बल बनाए रखता है। מָקוֹם को सामान्य अर्थ में ‘स्थान’ रखा गया है।
- source_word: בְּיַרְכְתָם יָמָּה
  choice: उनके सुदूर पश्चिमी छोर पर
  rationale: יַרְכָה दूरस्थ या पिछला भाग/छोर दर्शाता है और प्रत्यय ‘उनके’ को स्पष्ट करता है। יָמָּה यहाँ प्रचलित दिशासूचक अर्थ में पश्चिम की ओर संकेत करता है।
