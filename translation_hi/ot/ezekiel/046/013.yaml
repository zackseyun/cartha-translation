base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/046/013.yaml
  text: And you shall offer a year-old male lamb without blemish as a burnt offering to Yahweh daily[a]; morning by morning you shall offer it.
translation:
  language: hi
  text: तुम हर दिन यहोवा के लिए एक वर्ष का दोषरहित नर मेमना होमबलि के रूप में चढ़ाया करो; उसे हर सुबह[a] चढ़ाया करो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'हिब्रू में, ‘सुबह-सुबह’; यह नियमित दैनिक पुनरावृत्ति को व्यक्त करता है। वैकल्पिक अनुवाद: ‘हर सुबह।’'
    reason: हिब्रू की दोहराई हुई अभिव्यक्ति בַּבֹּקֶר בַּבֹּקֶר के वितरणात्मक अर्थ को स्पष्ट करना।
lexical_decisions:
- source_word: כֶבֶשׂ
  choice: नर मेमना
  rationale: बलिदान के संदर्भ में यह शब्द भेड़ के बच्चे को दर्शाता है; यहाँ व्याकरणिक रूप पुल्लिंग है, इसलिए ‘नर मेमना’ बलि की पहचान स्पष्ट करता है।
- source_word: בֶּן שְׁנָתוֹ
  choice: एक वर्ष का
  rationale: शाब्दिक मुहावरा ‘अपने वर्ष का पुत्र’ है, जिसका स्वाभाविक हिन्दी अर्थ एक वर्ष की आयु का पशु है।
- source_word: תָּמִים
  choice: निर्दोष
  rationale: बलिदान-संबंधी प्रसंग में इसका अर्थ शारीरिक दोष या दाग से रहित होना है; ‘निर्दोष’ संक्षिप्त और प्रचलित धार्मिक हिन्दी है।
- source_word: תַּעֲשֶׂה
  choice: चढ़ाना
  rationale: यद्यपि मूल क्रिया का सामान्य अर्थ ‘करना/बनाना’ है, बलि के प्रसंग में यह बलिदान अर्पित करने की क्रिया व्यक्त करती है।
- source_word: עוֹלָה
  choice: होमबलि
  rationale: यह उस बलि का मानक पद है जो वेदी पर पूर्णतः जलाई जाती थी; ‘होमबलि’ हिन्दी बाइबलीय प्रयोग में स्थापित है।
- source_word: לַיּוֹם
  choice: प्रतिदिन
  rationale: यहाँ पदबंध नियमित दैनिक अर्पण को व्यक्त करता है; ‘प्रतिदिन’ सहज और सटीक है।
- source_word: לַיהוָה
  choice: यहोवा के लिए
  rationale: पूर्वसर्ग बलि के समर्पण को दर्शाता है और יהוה को उसके व्यक्तिगत वाचा-नाम ‘यहोवा’ से प्रस्तुत किया गया है।
- source_word: בַּבֹּקֶר בַּבֹּקֶר
  choice: हर सुबह
  rationale: दोहराव वितरणात्मक अर्थ में नियमित पुनरावृत्ति दर्शाता है; आधुनिक हिन्दी में ‘हर सुबह’ स्वाभाविक रूप से वही अर्थ देता है।
- source_word: אֹתוֹ
  choice: उसे
  rationale: पुल्लिंग एकवचन सर्वनाम पहले उल्लिखित मेमने की ओर संकेत करता है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ में चतुरक्षरी व्यक्तिगत नाम है, इसलिए उपाधि ‘प्रभु’ के स्थान पर नाम को रखा गया है। ‘यहोवा’ आधुनिक हिन्दी के सामान्य पाठकों के लिए व्यापक रूप से पहचाना जाने वाला पारंपरिक रूप है, जबकि ‘याहवे’ संभावित उच्चारण का अधिक प्रत्यक्ष लिप्यंतरण है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और निर्देशात्मक रखी गई है। हिब्रू की पुनरावृत्ति בַּבֹּקֶר בַּבֹּקֶר को शब्दशः दुहराने के बजाय स्वाभाविक वितरणात्मक हिन्दी ‘हर सुबह’ में व्यक्त किया गया है। ‘प्रतिदिन’ और ‘हर सुबह’ दोनों को बनाए रखकर मूल का दैनिक तथा प्रातःकालीन बलाघात सुरक्षित रखा गया है।
