source:
  edition: WLC
  text: וּ/בַ/חַגִּ֣ים וּ/בַ/מּוֹעֲדִ֗ים תִּהְיֶ֤ה הַ/מִּנְחָה֙ אֵיפָ֤ה לַ/פָּר֙ וְ/אֵיפָ֣ה לָ/אַ֔יִל וְ/לַ/כְּבָשִׂ֖ים מַתַּ֣ת יָד֑/וֹ וְ/שֶׁ֖מֶן הִ֥ין לָ/אֵיפָֽה׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/046/011.yaml
  text: At the festivals and the appointed times[a], the grain offering shall be one ephah for the bull and one ephah for the ram, and for the lambs as much as he is able to give, with a hin of oil to each ephah.
translation:
  language: hi
  text: 'पर्वों और नियत समयों पर अन्नबलि यह होगी: बैल के लिए एक एपा और मेढ़े के लिए एक एपा; मेमनों के लिए वह जितना दे सके[a], और हर एपा के लिए एक हीन तेल।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक अर्थ, “उसके हाथ का उपहार”; अर्थात वह जितना देने में समर्थ हो।
    reason: मेमनों के लिए दी जाने वाली भेंट की मात्रा बताने वाले हिब्रू मुहावरे के शाब्दिक रूप और उसके सहज अर्थ को सुरक्षित रखना।
lexical_decisions:
- source_word: וּבַחַגִּים
  choice: पर्वों पर
  rationale: חַגִּים धार्मिक उत्सवों या पर्वों को सूचित करता है; ‘पर्व’ आधुनिक हिन्दी में स्वाभाविक और उपासना-संबंधी अर्थ के अनुकूल है।
- source_word: וּבַמּוֹעֲדִים
  choice: और नियत अवसरों पर
  rationale: מוֹעֲדִים ठहराए हुए समयों या अवसरों का व्यापक अर्थ रखता है। इसे חַגִּים के समान केवल ‘पर्व’ न बनाकर दोनों शब्दों का भेद सुरक्षित रखा गया है।
- source_word: תִּהְיֶה הַמִּנְחָה
  choice: अन्नबलि इस प्रकार होगी
  rationale: बलिदान-संबंधी प्रसंग में מִנְחָה अनाज से चढ़ाई जाने वाली भेंट है; ‘अन्नबलि’ संक्षिप्त, स्पष्ट और प्रसंगानुकूल है। ‘इस प्रकार’ आगे आने वाली मात्राओं से वाक्य का स्वाभाविक संबंध बनाता है।
- source_word: אֵיפָה לַפָּר
  choice: प्रत्येक बैल के साथ एक एपा
  rationale: אֵיפָה सूखी वस्तुओं की प्राचीन माप है और פַּר बलि का बैल है। विधान की वितरणात्मक प्रकृति स्पष्ट करने के लिए ‘प्रत्येक’ रखा गया है।
- source_word: וְאֵיפָה לָאַיִל
  choice: प्रत्येक मेढ़े के साथ एक एपा
  rationale: אַיִל का अर्थ मेढ़ा है। समानांतर विधान और वितरणात्मक भाव को हिन्दी में स्पष्ट रखा गया है।
- source_word: וְלַכְּבָשִׂים מַתַּת יָדוֹ
  choice: और मेमनों के साथ उसकी सामर्थ्य के अनुसार[a]
  rationale: מַתַּת יָדוֹ का शाब्दिक अर्थ ‘उसके हाथ का उपहार’ है, पर यहाँ यह देने की क्षमता या साधन के अनुसार मात्रा बताने वाला मुहावरा है। सहज अर्थ मुख्य पाठ में और शाब्दिक रूप पादटिप्पणी में रखा गया है।
- source_word: וְשֶׁמֶן הִין לָאֵיפָה
  choice: और हर एपा के साथ एक हीन तेल
  rationale: यह अन्नबलि के प्रत्येक एपा के अनुपात में तेल की मात्रा निर्धारित करता है। प्राचीन माप הִין को ‘हीन’ के रूप में लिप्यंतरित किया गया है।
