base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/046/010.yaml
  text: And the prince shall be among them[a]; when they enter, he shall enter, and when they go out[b], he shall go out.
translation:
  language: hi
  text: और प्रधान उनके बीच होगा[a]; जब वे भीतर आएँगे, तब वह भी भीतर आएगा, और जब वे बाहर जाएँगे, तब वे बाहर जाएँगे[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक अर्थ: “उनके मध्य।”'
    reason: lexical_alternative
  - marker: b
    text: 'हिब्रू में क्रिया बहुवचन है: “वे बाहर जाएँगे।” संदर्भ से प्रधान का उनके साथ बाहर जाना अभिप्रेत हो सकता है।'
    reason: textual_ambiguity
lexical_decisions:
- source_word: הַנָּשִׂיא
  choice: प्रधान
  rationale: यहेजकेल 40–48 में यह उपासना से जुड़े नागरिक शासक की पदवी है। ‘प्रधान’ आधुनिक हिन्दी में गरिमापूर्ण और पर्याप्त व्यापक है तथा अनावश्यक राजवंशीय या मसीही निष्कर्ष नहीं जोड़ता।
- source_word: בְּתוֹכָם
  choice: उनके बीच
  rationale: यह ‘उनके मध्य’ का स्वाभाविक आधुनिक हिन्दी रूप है और लोगों के साथ प्रधान की उपस्थिति व्यक्त करता है।
- source_word: בְּבוֹאָם יָבוֹא
  choice: जब वे भीतर आएँगे, तब वह भी भीतर आएगा
  rationale: पूर्वसर्गयुक्त क्रियार्थक संज्ञा कालवाचक है। ‘भी’ हिन्दी में यह संबंध स्पष्ट करता है कि प्रधान लोगों के प्रवेश के साथ प्रवेश करता है।
- source_word: וּבְצֵאתָם
  choice: और जब वे बाहर जाएँगे
  rationale: कालवाचक रचना को स्वाभाविक हिन्दी में रखा गया है और יצא के मूल भाव ‘बाहर जाना’ को बनाए रखा गया है।
- source_word: יֵצֵאוּ
  choice: तब वे बाहर जाएँगे
  rationale: WLC का स्वरांकित रूप स्पष्टतः तृतीय पुरुष बहुवचन है। इसलिए इसे एकवचन ‘वह बाहर जाएगा’ नहीं किया गया; यद्यपि संदर्भ में प्रधान का उनके साथ निकलना अभिप्रेत हो सकता है, मूल पाठ की व्याकरणिक बहुवचनता सुरक्षित रखी गई है।
theological_decisions:
- issue: मन्दिर-दर्शन में प्रधान की भूमिका और पहचान
  choice: נָשִׂיא को ‘प्रधान’ रखा गया और उसकी पहचान के विषय में अतिरिक्त मसीही या राजकीय दावा नहीं जोड़ा गया।
  alternative: ‘राजकुमार’ या ‘शासक’
  rationale: पदवी को सुरक्षित रखते हुए पाठ से आगे जाकर इस व्यक्ति की धर्मवैचारिक पहचान निश्चित नहीं की जानी चाहिए।
- issue: अन्तिम क्रिया का कर्ता
  choice: WLC के बहुवचन יֵצֵאוּ के अनुसार ‘वे बाहर जाएँगे’ रखा गया।
  alternative: ‘वह बाहर जाएगा’ अथवा ‘वे साथ-साथ बाहर जाएँगे’
  rationale: एकवचन अनुवाद उपलब्ध स्वरांकित हिब्रू से मेल नहीं खाता, जबकि ‘साथ-साथ’ पाठ में निहित संभावित अर्थ को स्पष्ट तो करता है, पर एक ऐसा शब्द जोड़ता है जो मूल में प्रत्यक्ष नहीं है। अतः वास्तविक व्याकरणिक तनाव सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण विधिक-वर्णनात्मक शैली। ‘भीतर आना/बाहर जाना’ की समानांतरता रखी गई है। हर पाद-टिप्पणी चिह्न मुख्य पाठ में उपस्थित है।
