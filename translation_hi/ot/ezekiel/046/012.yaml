  text: וְ/כִֽי יַעֲשֶׂה֩ הַ/נָּשִׂ֨יא נְדָבָ֜ה עוֹלָ֣ה אֽוֹ שְׁלָמִים֮ נְדָבָ֣ה לַֽ/יהוָה֒ וּ/פָ֣תַֽח ל֗/וֹ אֶת הַ/שַּׁ֨עַר֙ הַ/פֹּנֶ֣ה קָדִ֔ים וְ/עָשָׂ֤ה אֶת עֹֽלָת/וֹ֙ וְ/אֶת שְׁלָמָ֔י/ו כַּ/אֲשֶׁ֥ר יַעֲשֶׂ֖ה בְּ/י֣וֹם הַ/שַּׁבָּ֑ת וְ/יָצָ֛א וְ/סָגַ֥ר אֶת הַ/שַּׁ֖עַר אַחֲרֵ֥י צֵאתֽ/וֹ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/046/012.yaml
  text: But when the prince makes a freewill offering to Yahweh[a], either a burnt offering or peace offerings, the gate that faces east shall be opened for him, and he shall offer his burnt offering and his peace offerings as he does on the Sabbath day. Then he shall go out[b], and after he goes out the gate shall be shut.
translation:
  language: hi
  text: परन्तु जब प्रधान यहवे के लिए स्वेच्छा-भेंट चढ़ाए—चाहे होमबलि हो या मेलबलियाँ हों—तब पूर्व की ओर मुख वाला फाटक उसके लिए खोला जाए। वह अपनी होमबलि और मेलबलियाँ वैसे ही चढ़ाए जैसे वह सब्त के दिन चढ़ाता है। फिर वह बाहर निकल जाए, और उसके बाहर निकलने के बाद फाटक बन्द कर दिया जाए[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: इब्रानी में फाटक खोलने और बन्द करने वाली क्रियाओं का कर्ता बताया नहीं गया है; इसलिए यहाँ कर्मवाच्य रखा गया है।
    reason: source_ambiguity
lexical_decisions:
- source_word: וְכִי
  choice: परन्तु जब
  rationale: यह पहले दिए गए नियमों से एक विशेष परिस्थिति की ओर संक्रमण कराता है; आधुनिक हिन्दी में ‘परन्तु जब’ इस बदलाव को स्वाभाविक रूप से व्यक्त करता है।
- source_word: הַנָּשִׂיא
  choice: प्रधान
  rationale: यहेजकेल के मन्दिर-विधान में यह एक विशिष्ट राजनैतिक और उपासना-संबंधी पद है। ‘प्रधान’ राजकीय भूमिका को व्यक्त करता है, पर उसे अनिवार्यतः राजा नहीं बनाता।
- source_word: נְדָבָה
  choice: स्वेच्छा-भेंट
  rationale: यह ऐसी भेंट है जो निश्चित बाध्यता के बजाय स्वेच्छा से दी जाती है।
- source_word: עוֹלָה
  choice: होमबलि
  rationale: पूरी तरह आग में चढ़ाई जाने वाली बलि के लिए हिन्दी बाइबिल-परम्परा का संक्षिप्त और पहचाना हुआ शब्द।
- source_word: שְׁלָמִים
  choice: मेलबलि
  rationale: शांति, कुशल और सहभागिता से जुड़े इस बलिदान के लिए परिचित हिन्दी पद; ‘सहभागिता-बलि’ को पादटिप्पणी में विकल्प के रूप में रखा गया है।
- source_word: לַיהוָה
  choice: यहवे के लिए
  rationale: पूर्वसर्ग भेंट के समर्पण को दर्शाता है और יהוה को व्यक्तिगत वाचा-नाम ‘यहवे’ के रूप में प्रस्तुत किया गया है।
- source_word: וּפָתַח לוֹ
  choice: उसके लिए खोला जाए
  rationale: इब्रानी क्रिया एकवचन पुल्लिंग में है, पर उसका कर्ता व्यक्त नहीं है। हिन्दी का कर्मवाच्य अनिर्दिष्ट कर्ता को सुरक्षित रखता है।
- source_word: הַשַּׁעַר הַפֹּנֶה קָדִים
  choice: पूर्व की ओर मुख वाला फाटक
  rationale: दिशा की ओर उन्मुख फाटक का स्पष्ट और स्वाभाविक हिन्दी वर्णन।
- source_word: וְעָשָׂה
  choice: चढ़ाए
  rationale: बलिदान के प्रसंग में עשה का अर्थ बलि को सम्पन्न करना या अर्पित करना है; ‘चढ़ाए’ हिन्दी में सहज उपासना-संबंधी प्रयोग है।
- source_word: כַּאֲשֶׁר יַעֲשֶׂה בְּיוֹם הַשַּׁבָּת
  choice: वैसे ही चढ़ाए जैसे वह सब्त के दिन चढ़ाता है
  rationale: यह पहले वर्णित सब्त की नियमित प्रक्रिया से तुलना करता है; वर्तमानकालीन ‘चढ़ाता है’ उसकी प्रथागत प्रकृति दर्शाता है।
- source_word: וְיָצָא
  choice: फिर वह बाहर निकल जाए
  rationale: ‘फिर’ विधिक क्रम के अगले चरण को स्पष्ट करता है।
- source_word: וְסָגַר אֶת־הַשַּׁעַר אַחֲרֵי צֵאתוֹ
  choice: उसके बाहर निकलने के बाद फाटक बन्द कर दिया जाए
  rationale: मूल पाठ में बन्द करने वाला कर्ता स्पष्ट नहीं है; कर्मवाच्य इस अस्पष्टता को बनाए रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: यहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में चतुरक्षरी व्यक्तिगत वाचा-नाम सीधे आया है। ‘यहवे’ उसका आधुनिक हिन्दी लिप्यन्तरण है और उसे केवल उपाधि में परिवर्तित नहीं करता।
- issue: שְׁלָמִים की बलिदानी संज्ञा
  choice: मेलबलि
  alternative: सहभागिता-बलि; शान्ति-बलि
  rationale: शब्द में कुशल, शांति और सामुदायिक सहभागिता के अर्थ-संबंध हैं। मुख्य पाठ में परिचित ‘मेलबलि’ रखा गया है और वैकल्पिक अर्थ पादटिप्पणी में दिया गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और विधिक-उपासना संबंधी है। ‘प्रधान’, ‘होमबलि’, ‘मेलबलि’ और ‘सब्त’ जैसे परिचित बाइबिलीय शब्द बनाए गए हैं। वाक्य-क्रम प्रक्रिया को स्पष्ट रखता है, जबकि फाटक खोलने और बन्द करने वाले अनिर्दिष्ट कर्ता की मूल अस्पष्टता सुरक्षित है।
