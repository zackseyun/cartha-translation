  text: וַ/יֹּ֣אמֶר אֵלַ֔/י זֶ֣ה הַ/מָּק֗וֹם אֲשֶׁ֤ר יְבַשְּׁלוּ שָׁם֙ הַ/כֹּ֣הֲנִ֔ים אֶת הָ/אָשָׁ֖ם וְ/אֶת הַ/חַטָּ֑את אֲשֶׁ֤ר יֹאפוּ֙ אֶת הַ/מִּנְחָ֔ה לְ/בִלְתִּ֥י הוֹצִ֛יא אֶל הֶ/חָצֵ֥ר הַ/חִֽיצוֹנָ֖ה לְ/קַדֵּ֥שׁ אֶת הָ/עָֽם־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/046/020.yaml
  text: Then he said to me[a], “This is the place where the priests shall boil the guilt offering and the sin offering, and where they shall bake the grain offering, so as not to bring them out into the outer court to make the people holy.”
translation:
  language: hi
  text: तब उसने मुझसे कहा, “यह वह स्थान है जहाँ याजक दोषबलि और पापबलि को उबालेंगे और अन्नबलि को सेंकेंगे, ताकि उन्हें बाहर वाले आँगन में ले जाकर लोगों को पवित्र न करें[a]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “लोगों को पवित्र न ठहराएँ” अथवा “लोगों को समर्पित न करें।” इब्रानी क्रिया का अर्थ ‘पवित्र करना’ है; इस मंदिर-संदर्भ में सम्भवतः पवित्र भेंटों के संपर्क से पवित्रता लोगों तक पहुँचने का भाव है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אֵלַי
  choice: तब उसने मुझसे कहा
  rationale: वाव-क्रमिक कथा को आगे बढ़ाता है; ‘तब’ आधुनिक हिन्दी में स्वाभाविक क्रम व्यक्त करता है।
- source_word: אֲשֶׁר יְבַשְּׁלוּ שָׁם הַכֹּהֲנִים
  choice: जहाँ याजक ... उबालेंगे
  rationale: बलिदानी संदर्भ में בשל का आशय उबालकर पकाना है; ‘उबालेंगे’ सामान्य ‘पकाएँगे’ से अधिक सटीक है।
- source_word: הָאָשָׁם
  choice: दोषबलि
  rationale: यह प्रायश्चित्त/क्षतिपूर्ति से जुड़ी विशिष्ट बलिदानी श्रेणी है; ‘दोषबलि’ हिन्दी बाइबलीय शब्दावली में संक्षिप्त और स्पष्ट है।
- source_word: הַחַטָּאת
  choice: पापबलि
  rationale: यहाँ मान्य बलिदानी श्रेणी का नाम है; शुद्धिकरण का पक्ष संभव होने पर भी ‘पापबलि’ उसका पारंपरिक और समझने योग्य नाम है।
- source_word: הַמִּנְחָה
  choice: अन्नबलि
  rationale: याजकीय संदर्भ में מִנְחָה अन्न से बनी भेंट को दर्शाता है; सामान्य ‘भेंट’ की अपेक्षा ‘अन्नबलि’ अधिक विशिष्ट है।
- source_word: אֲשֶׁר יֹאפוּ
  choice: पकाएँगे
  rationale: אפה का मूल अर्थ सेंकना/पकाना है। अन्नबलि के विविध सम्भव रूपों को देखते हुए ‘पकाएँगे’ स्वाभाविक हिन्दी है और अनावश्यक रूप से किसी एक विधि तक सीमित नहीं करता।
- source_word: לְבִלְתִּי הוֹצִיא אֶל הֶחָצֵר הַחִיצוֹנָה
  choice: ताकि उन्हें बाहर वाले आँगन में ले जाकर ... न
  rationale: לְבִלְתִּי उद्देश्य अथवा रोक व्यक्त करता है। हिन्दी वाक्य-विन्यास में निषेध को अंतिम क्रिया के साथ रखने से पूरा आशय स्वाभाविक बनता है; ‘उन्हें’ का संकेत पहले उल्लिखित पवित्र भेंटों की ओर है।
- source_word: לְקַדֵּשׁ אֶת הָעָם
  choice: लोगों को पवित्र न ठहराएँ
  rationale: קדש हिफ़ील का मूल भाव पवित्र करना/पवित्र ठहराना है। यह अनुवाद मंदिर-संदर्भ में पवित्र वस्तुओं के संपर्क से लोगों पर पवित्रता लागू होने की संभावना को बनाए रखता है।
theological_decisions:
- issue: לְקַדֵּשׁ אֶת הָעָם में पवित्रता के संचार का अर्थ
  choice: पवित्र भेंटों को बाहरी आँगन में ले जाने से लोगों को पवित्र ठहराए जाने की रोक
  alternative: लोगों को पवित्र करना; लोगों का अभिषेक करना; पवित्र वस्तुओं से अनधिकृत संपर्क रोकना
  rationale: निर्दिष्ट पकाने के स्थानों का तात्कालिक संदर्भ संकेत करता है कि अत्यंत पवित्र बलियों को सामान्य लोगों के क्षेत्र में ले जाने से बचाया जाए। फिर भी क्रिया की वास्तविक अस्पष्टता को पादटिप्पणी में रखा गया है और किसी विस्तृत धार्मिक सिद्धांत को पाठ में नहीं जोड़ा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सहज स्तर रखा गया है। ‘याजक’, ‘दोषबलि’, ‘पापबलि’ और ‘अन्नबलि’ जैसी प्रचलित बाइबलीय संज्ञाएँ तकनीकी बलिदानी श्रेणियों को सुरक्षित रखती हैं।
