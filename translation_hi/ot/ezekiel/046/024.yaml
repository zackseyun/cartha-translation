  text: וַ/יֹּ֖אמֶר אֵלָ֑/י אֵ֚לֶּה בֵּ֣ית הַֽ/מְבַשְּׁלִ֔ים אֲשֶׁ֧ר יְבַשְּׁלוּ שָׁ֛ם מְשָׁרְתֵ֥י הַ/בַּ֖יִת אֶת זֶ֥בַח הָ/עָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/046/024.yaml
  text: Then he said to me[b][a], “These are the kitchens where the ministers of the temple shall boil the people's sacrifice.”
translation:
  language: hi
  text: तब उसने मुझसे कहा, “ये वे रसोईघर हैं[a], जहाँ मंदिर के सेवक[b] लोगों का बलिदान पकाएँगे।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “पकाने के कमरे”; अधिक शाब्दिक रूप में, “पकानेवालों का भवन।”
    reason: lexical_alternative
  - marker: b
    text: या “मंदिर में सेवा करनेवाले परिचारक।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אֵלַי
  choice: तब उसने मुझसे कहा
  rationale: वाव-क्रमागत कथानक को आगे बढ़ाता है; ‘तब’ आधुनिक हिन्दी में क्रम को सहज रूप से व्यक्त करता है।
- source_word: בֵּית הַמְבַשְּׁלִים
  choice: रसोईघर
  rationale: शाब्दिक अर्थ ‘पकानेवालों का भवन’ है, पर मंदिर की वास्तु-संबंधी इस पहचान में ‘रसोईघर’ स्थान के कार्य को स्पष्ट और स्वाभाविक ढंग से बताता है।
- source_word: יְבַשְּׁלוּ
  choice: पकाएँगे
  rationale: בשׁל का अर्थ उबालना अथवा पकाना हो सकता है। हिन्दी में ‘पकाना’ व्यापक और स्वाभाविक है तथा मूल की अर्थगत गुंजाइश बनाए रखता है।
- source_word: מְשָׁרְתֵי הַבַּיִת
  choice: मंदिर के सेवक
  rationale: यह पद भवन अर्थात मंदिर में आधिकारिक सेवा करनेवालों को दर्शाता है। ‘सेवक’ सेवा के मूल भाव को रखता है, जबकि ‘मंदिर’ प्रसंगगत अर्थ स्पष्ट करता है।
- source_word: זֶבַח הָעָם
  choice: लोगों का बलिदान
  rationale: זֶבַח सामान्य भेंट नहीं, बल्कि बलिदान को सूचित करता है; संबंधवाचक रचना इसे लोगों से संबद्ध बताती है।
- source_word: שָׁם
  choice: जहाँ
  rationale: मूल का ‘वहाँ’ हिन्दी में स्थान की पहचान के बाद संबंधवाचक ‘जहाँ’ द्वारा अधिक सहज रूप से व्यक्त होता है।
theological_decisions: []
