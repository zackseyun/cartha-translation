lexical_decisions:
- source_word: טוּר
  choice: कतार
  rationale: यह संज्ञा चारों ओर फैली किसी लगातार बनी हुई पंक्ति या निर्माण-क्रम को दर्शाती है। ‘कतार’ मूल की स्थानिक छवि बनाए रखती है, यद्यपि वास्तु-संबंधी उसका सटीक रूप निश्चित नहीं है।
- source_word: סָבִיב ... סָבִיב
  choice: चारों ओर ... चारों ओर
  rationale: दोहराव प्रत्येक आँगन को घेरे होने और पकाने की जगहों के सर्वत्र बने होने पर बल देता है; हिन्दी में दोनों प्रयोग बनाए रखे गए हैं।
- source_word: בָּהֶם
  choice: उन चारों के भीतर
  rationale: सर्वनाम पिछले पद में बताए गए चार छोटे आँगनों की ओर संकेत करता है। ‘भीतर’ आंतरिक स्थान को स्वाभाविक हिन्दी में स्पष्ट करता है।
- source_word: לְאַרְבַּעְתָּם
  choice: हर एक के
  rationale: यह चारों आँगनों पर इस विशेषता के लागू होने का वितरणात्मक भाव व्यक्त करता है। ‘उन चारों के भीतर, हर एक के चारों ओर’ संख्या और वितरण दोनों स्पष्ट करता है।
- source_word: מְבַשְּׁלוֹת
  choice: पकाने की जगहें
  rationale: בשׁל धातु उबालने या पकाने को व्यक्त करती है। यहाँ संज्ञा मंदिर के आँगनों में पकाने के लिए निर्धारित स्थानों को बताती है; ‘जगहें’ किसी अनिश्चित प्रकार के उपकरण को अनावश्यक रूप से निश्चित नहीं करती।
- source_word: עָשׂוּי
  choice: बनाई गई थीं
  rationale: निष्क्रिय कृदंत निर्मित होकर विद्यमान रहने की परिणामी अवस्था बताता है। हिन्दी का पूर्ण निष्क्रिय रूप प्रसंग में स्वाभाविक है।
- source_word: מִתַּחַת
  choice: के नीचे
  rationale: यह सीधा स्थान-संबंध बताता है और वास्तु-वर्णन में सहज है।
- source_word: הַטִּירוֹת
  choice: उन कतारों
  rationale: यह संभवतः पहले उल्लिखित घेरेदार निर्माण-पंक्तियों से संबंधित वास्तु-तत्त्व है। एकरूप अनुवाद उस संबंध को बनाए रखता है, जबकि शब्द का अनिश्चित वास्तु-अर्थ पादटिप्पणी में दिया गया है।
