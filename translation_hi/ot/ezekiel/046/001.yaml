reference: Ezekiel 46:1
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: כֹּֽה אָמַר֮ אֲדֹנָ֣/י יְהוִה֒ שַׁ֜עַר הֶ/חָצֵ֤ר הַ/פְּנִימִית֙ הַ/פֹּנֶ֣ה קָדִ֔ים יִהְיֶ֣ה סָג֔וּר שֵׁ֖שֶׁת יְמֵ֣י הַֽ/מַּעֲשֶׂ֑ה וּ/בְ/י֤וֹם הַ/שַּׁבָּת֙ יִפָּתֵ֔חַ וּ/בְ/י֥וֹם הַ/חֹ֖דֶשׁ יִפָּתֵֽחַ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/046/001.yaml
  text: 'Thus says the Lord GOD: The gate of the inner court that faces east shall be shut during the six working days[a], but on the Sabbath day it shall be opened, and on the day of the new moon it shall be opened.'
translation:
  language: hi
  text: 'प्रभु याहवे यों कहते हैं: भीतरी आँगन का वह फाटक, जिसका मुख पूर्व की ओर है, कामकाज के छह दिनों में बंद रहेगा; पर सब्त के दिन उसे खोला जाएगा, और नए चाँद के दिन[a] भी उसे खोला जाएगा।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात महीने के आरंभ में मनाया जाने वाला नए चाँद का उत्सव।
    reason: cultural_note
lexical_decisions:
- source_word: כֹּה אָמַר
  choice: यों कहते हैं
  rationale: यह भविष्यद्वाणी के संदेशवाहक-सूत्र का स्वाभाविक और गरिमापूर्ण हिन्दी रूप है।
- source_word: אֲדֹנָי יְהוִה
  choice: प्रभु याहवे
  rationale: אֲדֹנָי को ‘प्रभु’ और परमेश्वर के व्यक्तिगत नाम יהוה को ‘याहवे’ के रूप में रखा गया है, जिससे दोनों पदों का भेद बना रहता है।
- source_word: שַׁעַר הֶחָצֵר הַפְּנִימִית
  choice: भीतरी आँगन का ... फाटक
  rationale: यह रचना उस फाटक को भीतरी मंदिर-प्रांगण से संबंधित बताती है; ‘आँगन’ सामान्य पाठक के लिए सहज है।
- source_word: הַפֹּנֶה קָדִים
  choice: जिसका मुख पूर्व की ओर है
  rationale: इब्रानी कृदंत फाटक की दिशा बताता है; यह हिन्दी में स्वाभाविक वास्तु-वर्णन है।
- source_word: יִהְיֶה סָגוּר
  choice: बंद रहेगा
  rationale: היה और विशेषण का मेल लगातार बनी रहने वाली अवस्था व्यक्त करता है।
- source_word: שֵׁשֶׁת יְמֵי הַמַּעֲשֶׂה
  choice: कामकाज के छः दिनों में
  rationale: यह सामान्य कार्य-दिवसों को सब्त और नए चाँद के दिन से अलग करता है।
- source_word: וּבְיוֹם הַשַּׁבָּת
  choice: पर सब्त के दिन
  rationale: वाव यहाँ पहले कथन के साथ स्पष्ट विरोध दिखाता है; ‘पर’ इस संबंध को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: יִפָּתֵחַ
  choice: उसे खोला जाएगा
  rationale: פתח का निफ़ाल रूप कर्मवाच्य क्रिया है; दोनों बार उसी कर्मवाच्य अर्थ को बनाए रखा गया है।
- source_word: וּבְיוֹם הַחֹדֶשׁ
  choice: और नए चाँद के दिन
  rationale: इस उपासना-पंचांग के संदर्भ में חֹדֶשׁ महीने के आरंभ पर नए चाँद के धार्मिक दिन को दर्शाता है।
theological_decisions:
- issue: אֲדֹנָי יְהוִה में परमेश्वर के नाम का अनुवाद
  choice: प्रभु याहवे
  alternative: प्रभु परमेश्वर
  rationale: मूल पाठ में उपाधि אֲדֹנָי और व्यक्तिगत नाम יהוה दोनों हैं। ‘प्रभु याहवे’ इस भेद को सुरक्षित रखता है और ‘प्रभु प्रभु’ जैसी अस्वाभाविक पुनरुक्ति से बचता है।
- issue: הַחֹדֶשׁ का धार्मिक-पंचांगीय अर्थ
  choice: नए चाँद का दिन
  alternative: महीने का दिन
  rationale: सब्त के साथ इसका उल्लेख और यहेजकेल के मंदिर-विधान का संदर्भ इसे मासिक नए-चाँद का उत्सव बताता है, केवल किसी सामान्य मास-दिवस को नहीं।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, गरिमापूर्ण विधिक-भविष्यद्वाणी शैली के साथ रखी गई है। मंदिर-संदर्भ में ‘आँगन’ और ‘फाटक’ सामान्य पाठकों के लिए स्पष्ट शब्द हैं; ‘सब्त’ बाइबलीय सांस्कृतिक पद के रूप में सुरक्षित है।
