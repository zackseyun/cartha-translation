  text: וַ/יֹּ֣אמֶר יְהוָ֔ה כָּ֣כָה יֹאכְל֧וּ בְנֵֽי יִשְׂרָאֵ֛ל אֶת לַחְמָ֖/ם טָמֵ֑א בַּ/גּוֹיִ֕ם אֲשֶׁ֥ר אַדִּיחֵ֖/ם שָֽׁם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/004/013.yaml
  text: And Yahweh said[c][b][a], “Thus the sons of Israel will eat their bread unclean among the nations where I will drive them.”
translation:
  language: hi
  text: और याहवे ने कहा, “इसी प्रकार इस्राएल के पुत्र[a] उन राष्ट्रों के बीच, जहाँ मैं उन्हें खदेड़ दूँगा[c], अपनी अशुद्ध[b] रोटी खाएँगे।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “इस्राएली” अथवा “इस्राएल के लोग।” इब्रानी में शाब्दिक रूप से “इस्राएल के पुत्र” है और यहाँ यह पूरे समुदाय के लिए प्रयुक्त है।
    reason: lexical_alternative
  - marker: b
    text: या “अपवित्र।” इस शब्द में विशेष रूप से धार्मिक अथवा अनुष्ठानिक अशुद्धता का भाव है।
    reason: lexical_alternative
  - marker: c
    text: या “निर्वासित कर दूँगा” अथवा “तितर-बितर कर दूँगा।”
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के वाचा-नाम को उपाधि से बदलने के बजाय हिन्दी लिप्यंतरण में रखा गया है।
- source_word: כָּכָה
  choice: इसी प्रकार
  rationale: यह पद पिछले प्रतीकात्मक कार्य की रीति और उसके अर्थ की ओर संकेत करता है; ‘इसी प्रकार’ उस संकेतात्मक बल को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: בְנֵי יִשְׂרָאֵל
  choice: इस्राएल के पुत्र
  rationale: मूल का पारिवारिक और सामूहिक पदबंध सुरक्षित रखा गया है; यहाँ यह समूचे इस्राएली समुदाय का द्योतक है।
- source_word: לַחְמָם
  choice: अपनी रोटी
  rationale: संदर्भ में सचमुच रोटी पकाने का प्रतीकात्मक कार्य है, इसलिए व्यापक ‘भोजन’ के बजाय ठोस अर्थ ‘रोटी’ रखा गया है।
- source_word: טָמֵא
  choice: अशुद्ध
  rationale: यह शब्द सामान्य गंदगी से अधिक धार्मिक और अनुष्ठानिक अशुद्धता का भाव रखता है।
- source_word: בַּגּוֹיִם
  choice: राष्ट्रों के बीच
  rationale: यह निर्वासन में उन विदेशी राष्ट्रों या लोगों को दर्शाता है जिनके बीच इस्राएल रहेगा; ‘राष्ट्रों के बीच’ बाद के तकनीकी धार्मिक अर्थ आरोपित नहीं करता।
- source_word: אַדִּיחֵם
  choice: मैं उन्हें खदेड़ दूँगा
  rationale: हिफ़ील रूप बलपूर्वक दूर कर देने या निकाल देने का कारणवाचक भाव व्यक्त करता है; ‘खदेड़ दूँगा’ उस सक्रिय कठोरता को बनाए रखता है।
- source_word: שָׁם
  choice: जहाँ
  rationale: शाब्दिक ‘वहाँ’ को हिन्दी के स्वाभाविक सम्बन्धवाचक वाक्य-विन्यास में ‘जहाँ’ किया गया है।
theological_decisions:
- issue: वाचा-नाम יהוה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में परमेश्वर का विशिष्ट वाचा-नाम है। लिप्यंतरण नाम को दृश्यमान रखता है और उसे किसी उपाधि में नहीं बदलता।
- issue: בְנֵי יִשְׂרָאֵל का सामूहिक पारिवारिक प्रयोग
  choice: इस्राएल के पुत्र
  alternative: इस्राएली; इस्राएल के लोग; इस्राएल की सन्तान
  rationale: शाब्दिक पारिवारिक अभिव्यक्ति रखी गई है, जबकि पादटिप्पणी स्पष्ट करती है कि सन्दर्भ में इसका आशय समूचे इस्राएली समुदाय से है।
- issue: טָמֵא में धार्मिक अशुद्धता
  choice: अशुद्ध
  alternative: अपवित्र; दूषित
  rationale: निर्वासन और निषिद्ध रीति से तैयार रोटी के प्रसंग में यह शब्द धार्मिक-अनुष्ठानिक अशुद्धता का तनाव बनाए रखता है; ‘दूषित’ इसे केवल भौतिक संदूषण तक सीमित कर सकता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, स्पष्ट और सामान्य पाठक के लिए सुबोध शैली रखी गई है। वाक्य-विन्यास हिन्दी के अनुसार स्वाभाविक किया गया है, पर निर्वासन की कठोरता, रोटी की अशुद्धता और ‘इस्राएल के पुत्र’ की पारिवारिक-सामूहिक अभिव्यक्ति को सुरक्षित रखा गया है।
