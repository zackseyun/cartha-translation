base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/004/017.yaml
  text: so that they may lack bread and water[a], and each man and his brother may be appalled[b], and waste away in their iniquity.
translation:
  language: hi
  text: ताकि उन्हें रोटी और पानी की कमी हो जाए, और हर एक पुरुष और उसका भाई स्तब्ध हो जाएँ[a], और वे अपने अधर्म में क्षीण होते जाएँ[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘उजड़ जाएँ,’ ‘भयभीत हो जाएँ,’ अथवा ‘सन्न रह जाएँ।’ इब्रानी क्रिया उजाड़ होने या उससे उत्पन्न स्तब्ध और भयभीत दशा—दोनों को व्यक्त कर सकती है।
    reason: lexical_alternative
  - marker: b
    text: या ‘अपने दोष में,’ अथवा ‘अपने अधर्म के दंड के कारण।’ इब्रानी शब्द अधर्म, दोष, या अधर्म से मिलने वाले दंड का अर्थ दे सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: לְמַעַן
  choice: ताकि
  rationale: यह पिछले प्रतीकात्मक कार्य से निकलने वाले उद्देश्य अथवा परिणाम का परिचय देता है; ‘ताकि’ हिन्दी में इस संबंध को स्वाभाविक रूप से व्यक्त करता है।
- source_word: יַחְסְרוּ
  choice: उन्हें ... की घटी हो जाए
  rationale: חסר का अर्थ किसी आवश्यक वस्तु का अभाव होना है। यह प्रयोग आने वाले परिणाम को व्यक्त करता है और आधुनिक हिन्दी में स्वाभाविक है।
- source_word: לֶחֶם וָמָיִם
  choice: रोटी और पानी
  rationale: मूल पाठ की ठोस जोड़ी को बनाए रखा गया है; इसे सामान्य बनाकर ‘भोजन और पानी’ नहीं किया गया।
- source_word: וְנָשַׁמּוּ
  choice: स्तब्ध रह जाएँ
  rationale: נשׁם का निफ़ाल रूप उजड़ने अथवा उजाड़ से उत्पन्न भय और स्तब्धता—दोनों का बोध करा सकता है। मनुष्यों के विषय में ‘स्तब्ध रह जाएँ’ अनुभूत आघात को स्वाभाविक हिन्दी में व्यक्त करता है, जबकि विकल्प पाद-टिप्पणी में सुरक्षित हैं।
- source_word: אִישׁ וְאָחִיו
  choice: हर एक पुरुष और उसका भाई
  rationale: इब्रानी की पुल्लिंग, वितरणात्मक अभिव्यक्ति और ‘भाई’ के स्पष्ट संबंध को बनाए रखा गया है।
- source_word: וְנָמַקּוּ
  choice: गलते जाएँ
  rationale: מקק धीरे-धीरे गलने, क्षीण होने या नष्ट होने का भाव देता है। ‘गलते जाएँ’ उसकी प्रबल शारीरिक और रूपकात्मक छवि को संक्षेप में बनाए रखता है।
- source_word: בַּעֲוֺנָם
  choice: अपने अधर्म में
  rationale: עָוֹן अधर्म, दोष और अधर्म के दंड तक का अर्थ दे सकता है। ‘अधर्म में’ मूल की संक्षिप्तता और जानबूझकर छोड़ी गई अर्थगत व्यापकता को यथासंभव सुरक्षित रखता है।
theological_decisions:
- issue: אִישׁ וְאָחִיו में पुल्लिंग प्रतिनिधिक भाषा
  choice: हर एक पुरुष और उसका भाई
  alternative: हर एक व्यक्ति और उसका भाई; हर एक जन और उसका पड़ोसी
  rationale: मूल में पुल्लिंग एकवचन संज्ञाएँ वितरणात्मक अर्थ में हैं। ‘पुरुष’ और ‘भाई’ मूल की व्याकरणिक और संबंधपरक विशिष्टता को लिंग-निरपेक्ष या ‘पड़ोसी’ जैसे व्यापक रूप में बदलने से बचाते हैं।
- issue: עָוֹן की अर्थ-व्याप्ति
  choice: अधर्म
  alternative: दोष; अपने अधर्म के दंड के कारण
  rationale: शब्द नैतिक अधर्म, उससे उत्पन्न दोष, या उसके दंड को सूचित कर सकता है। मुख्य पाठ में ‘अधर्म’ रखने से न्याय के इस प्रसंग में नैतिक भार बना रहता है, पर अर्थ को केवल आंतरिक दोष अथवा केवल दंड तक सीमित नहीं किया जाता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘घटी,’ ‘स्तब्ध,’ ‘अधर्म,’ और ‘गलते जाएँ’ अकाल तथा न्याय की गंभीरता को बनाए रखते हैं। पाद-टिप्पणी चिह्न संबंधित शब्दों के तुरंत बाद रखे गए हैं।
