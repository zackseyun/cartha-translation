language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/אַתָּ֤ה בֶן אָדָם֙ קַח לְ/ךָ֣ לְבֵנָ֔ה וְ/נָתַתָּ֥ה אוֹתָ֖/הּ לְ/פָנֶ֑י/ךָ וְ/חַקּוֹתָ֥ עָלֶ֛י/הָ עִ֖יר אֶת יְרוּשָׁלִָֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/004/001.yaml
  text: And you[a], son of man, take for yourself a brick, set it before you, and engrave on it a city, Jerusalem.
translation:
  language: hi
  text: “और हे मनुष्य के पुत्र, तुम अपने लिए एक ईंट लो, उसे अपने सामने रखो और उस पर एक नगर—यरूशलेम—उकेरो[a]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उस पर अंकित करो” अथवा “उस पर बनाओ।” इब्रानी क्रिया का अर्थ खोदकर उकेरना या अंकित करना हो सकता है; यहाँ इसका आशय ईंट पर यरूशलेम का चित्रात्मक निरूपण बनाने से है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַתָּה
  choice: और हे ... तुम
  rationale: आरम्भिक וְ को ‘और’ से रखा गया है और אַתָּה के बल को सीधे संबोधन तथा ‘तुम’ से व्यक्त किया गया है। आधुनिक हिन्दी में ‘तुम’ स्वाभाविक है और अनावश्यक रूप से कठोर या पुरातन ‘तू’ से बचाता है।
- source_word: בֶן־אָדָם
  choice: मनुष्य के पुत्र
  rationale: यह इब्रानी पद का निकट और प्रतिष्ठित अर्थ है तथा यहेजकेल में भविष्यद्वक्ता के लिए बार-बार आने वाले संबोधन को सुरक्षित रखता है। ‘नश्वर मनुष्य’ अधिक व्याख्यात्मक होता।
- source_word: לְבֵנָה
  choice: एक ईंट
  rationale: संज्ञा का सामान्य अर्थ ‘ईंट’ है। प्रसंग के आधार पर ‘मिट्टी की पटिया’ कहना मूल शब्द से अधिक विशिष्ट होता।
- source_word: וְנָתַתָּה אוֹתָהּ לְפָנֶיךָ
  choice: उसे अपने सामने रखो
  rationale: נתן और ‘अपने सामने’ का संयोग किसी वस्तु को सामने रखने का सीधा और स्वाभाविक अर्थ देता है।
- source_word: וְחַקּוֹתָ עָלֶיהָ
  choice: उस पर ... उकेरो
  rationale: חקק का मूल भाव खोदकर चिह्न या आकृति बनाने का है। ईंट पर नगर का निरूपण करने के प्रसंग में ‘उकेरो’ इस ठोस भाव को बनाए रखता है; अन्य सम्भव अर्थ पादटिप्पणी में दिए गए हैं।
- source_word: עִיר אֶת־יְרוּשָׁלָם
  choice: एक नगर—यरूशलेम
  rationale: ‘एक नगर’ के बाद ‘यरूशलेम’ समानाधिकरण में उस नगर की पहचान बताता है। डैश हिन्दी में इस संबंध को स्पष्ट और सहज बनाता है।
- source_word: יְרוּשָׁלָם
  choice: यरूशलेम
  rationale: यह नाम का हिन्दी में प्रचलित बाइबलीय रूप है।
theological_decisions:
- issue: בֶן־אָדָם संबोधन का अर्थ
  choice: मनुष्य के पुत्र
  alternative: नश्वर मनुष्य
  rationale: शाब्दिक और आवर्ती संबोधन को बनाए रखा गया है, ताकि नश्वरता पर सम्भावित बल को व्याख्या के रूप में पाठ में न जोड़ा जाए और पद के व्यापक धर्मवैचारिक संबंध खुले रहें।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, सरल किंतु गरिमापूर्ण रखी गई है। एकवचन आज्ञाओं के लिए ‘तुम’ रूप अपनाया गया है। ‘मनुष्य के पुत्र’ मूल संबोधन की निकटता और यहेजकेल में उसकी आवृत्ति को सुरक्षित रखता है।
