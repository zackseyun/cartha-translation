  text: וְ/כִלִּיתָ֣ אֶת אֵ֗לֶּה וְ/שָׁ֨כַבְתָּ֜ עַל צִדְּ/ךָ֤ ה/ימיני שֵׁנִ֔ית וְ/נָשָׂ֖אתָ אֶת עֲוֺ֣ן בֵּית יְהוּדָ֑ה אַרְבָּעִ֣ים י֔וֹם י֧וֹם לַ/שָּׁנָ֛ה י֥וֹם לַ/שָּׁנָ֖ה נְתַתִּ֥י/ו לָֽ/ךְ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/004/006.yaml
  text: When you have finished these[a], you shall lie down a second time on your right side, and you shall bear the iniquity of the house of Judah for forty days. I have assigned you a day for each year.
translation:
  language: hi
  text: जब तुम ये काम पूरे कर लो, तब दूसरी बार अपनी दाहिनी करवट पर लेट जाना और चालीस दिन तक यहूदा के घराने का अधर्म उठाना। मैंने तुम्हारे लिए एक दिन को एक वर्ष ठहराया है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इब्रानी में शाब्दिक रूप से: “एक दिन एक वर्ष के लिए, एक दिन एक वर्ष के लिए।” यह पुनरुक्ति यहेजकेल के लेटने के दिनों और उनके द्वारा दर्शाए गए वर्षों के बीच सांकेतिक समानता पर बल देती है।'
    reason: मूल इब्रानी की बलसूचक पुनरुक्ति को दर्ज करना
lexical_decisions:
- source_word: וְכִלִּיתָ אֶת־אֵלֶּה
  choice: जब तुम ये काम पूरे कर लो
  rationale: संयोजक सहित क्रिया यहाँ पहले प्रतीकात्मक कार्यों की समाप्ति के बाद अगले कार्य का समय बताती है। ‘ये काम’ पूर्ववर्ती सांकेतिक कार्यों को स्वाभाविक हिन्दी में संदर्भित करता है।
- source_word: וְשָׁכַבְתָּ עַל־צִדְּךָ הַיְמָנִי שֵׁנִית
  choice: तब दूसरी बार अपनी दाहिनी करवट लेटना
  rationale: שֵׁנִית कार्य की पुनरावृत्ति को स्पष्ट करता है; ‘दाहिनी करवट’ हिन्दी में इस शारीरिक मुद्रा का सहज और सटीक वर्णन है।
- source_word: וְנָשָׂאתָ אֶת־עֲוֺן
  choice: अधर्म उठाना
  rationale: נשא עון में अधर्म, दोष और उसके परिणाम का भार उठाने की अर्थ-व्याप्ति है। ‘अधर्म उठाना’ इस व्यापकता को बनाए रखता है और इसे केवल दण्ड या केवल दोष तक सीमित नहीं करता।
- source_word: בֵּית יְהוּדָה
  choice: यहूदा के घराने
  rationale: भविष्यद्वाणी-साहित्य में यह दक्षिणी राज्य और उसके लोगों का स्थापित सामूहिक पद है; ‘घराना’ हिन्दी में रूपक और सामुदायिक अर्थ दोनों बनाए रखता है।
- source_word: אַרְבָּעִים יוֹם
  choice: चालीस दिन तक
  rationale: अवधि व्यक्त करने के लिए ‘तक’ सहज आधुनिक हिन्दी है और मूल समयावधि को स्पष्ट रखता है।
- source_word: יוֹם לַשָּׁנָה יוֹם לַשָּׁנָה
  choice: एक दिन को एक वर्ष
  rationale: मुख्य पाठ में सांकेतिक दिन-वर्ष correspondence को संक्षेप और सहज हिन्दी में व्यक्त किया गया है; मूल की पुनरुक्ति को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: נְתַתִּיו לָךְ
  choice: मैंने तुम्हारे लिए ... ठहराया है
  rationale: נתן यहाँ परमेश्वर द्वारा सांकेतिक माप या अवधि निर्धारित करने के अर्थ में है। ‘ठहराया है’ सामान्य ‘दिया है’ की अपेक्षा प्रसंग के अनुरूप है।
theological_decisions:
- issue: प्रतीकात्मक कार्य में עָוֺן का अर्थ
  choice: अधर्म
  alternative: दोष; पाप का दण्ड
  rationale: यह पद लोगों के पाप और उससे जुड़े भार या परिणाम दोनों की ओर संकेत कर सकता है। ‘अधर्म’ अर्थ को केवल व्यक्तिगत दोष अथवा दण्ड तक सीमित किए बिना मूल का धर्मवैचारिक तनाव बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और निर्देशात्मक रूप अपनाया गया है। ‘दाहिनी करवट’, ‘घराना’ और ‘अधर्म उठाना’ जैसे पद मूल के चित्र और अर्थ-व्याप्ति को रखते हुए सामान्य पाठक के लिए बोधगम्य हैं।
