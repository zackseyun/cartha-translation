  source_fidelity: 'The Hindi accurately represents the Hebrew sequence and sense: the attention marker, God''s completed action of placing ropes on Ezekiel, the resulting inability to turn from one side to the other, and the endpoint at completion of the days of his siege. “नहीं पलट सकोगे” appropriately conveys the contextual force of the Niphal, without requiring a stronger interpretive paraphrase.'
  naturalness: The wording is clear, idiomatic modern standard Hindi, with an appropriately solemn prophetic register. “एक करवट से दूसरी करवट” naturally expresses bodily turning from side to side, and the paired “जब तक ... तब तक” is fluent.
  terminology: “रस्सियाँ” is a sound concrete rendering of עֲבוֹתִים, and “घेराबंदी” suitably renders מָצוֹר. The possessive wording “अपनी घेराबंदी” preserves the Hebrew suffix without adding an explanatory identification of the siege.
