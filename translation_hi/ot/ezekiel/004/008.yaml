id: EZK.4.8
reference: Ezekiel 4:8
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/הִנֵּ֛ה נָתַ֥תִּי עָלֶ֖י/ךָ עֲבוֹתִ֑ים וְ/לֹֽא תֵהָפֵ֤ךְ מִֽ/צִּדְּ/ךָ֙ אֶל צִדֶּ֔/ךָ עַד כַּלּוֹתְ/ךָ֖ יְמֵ֥י מְצוּרֶֽ/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/004/008.yaml
  text: And behold[a], I have put ropes on you[b], and you will not turn yourself from your side to your other side until you have completed the days of your siege.
translation:
  language: hi
  text: और देखो, मैंने तुम पर रस्सियाँ डाल दी हैं, और जब तक तुम अपनी घेराबंदी के दिन पूरे न कर लो, तब तक तुम एक करवट से दूसरी करवट नहीं पलट सकोगे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהִנֵּה
  choice: और देखो
  rationale: ध्यान आकर्षित करने वाले हिब्रू सूचक का स्वाभाविक और गरिमापूर्ण आधुनिक हिन्दी रूप।
- source_word: נָתַתִּי עָלֶיךָ
  choice: मैंने तुम पर ... डाल दी हैं
  rationale: पूर्ण क्रिया को घटित कार्य के रूप में रखता है और रस्सियों के साथ हिन्दी में स्वाभाविक है।
- source_word: עֲבוֹתִים
  choice: रस्सियाँ
  rationale: बाँधने के ठोस साधनों का स्पष्ट आधुनिक हिन्दी अर्थ; ‘डोरियाँ’ अपेक्षाकृत हल्की और ‘बंधन’ अधिक अमूर्त होता।
- source_word: וְלֹא תֵהָפֵךְ
  choice: तुम ... नहीं पलट सकोगे
  rationale: निफ़अल रूप और रस्सियों से उत्पन्न शारीरिक असमर्थता, दोनों को प्रसंगानुकूल व्यक्त करता है।
- source_word: מִצִּדְּךָ אֶל צִדֶּךָ
  choice: एक करवट से दूसरी करवट
  rationale: शरीर की स्थिति बदलने के आशय को मुहावरेदार हिन्दी में व्यक्त करता है, जबकि शाब्दिक ‘अपनी ओर से अपनी ओर’ अस्पष्ट होता।
- source_word: עַד כַּלּוֹתְךָ יְמֵי מְצוּרֶךָ
  choice: जब तक तुम अपनी घेराबंदी के दिन पूरे न कर लो
  rationale: निर्धारित अवधि की समाप्ति और मूल के द्वितीय पुरुष संबंधसूचक प्रत्यय दोनों सुरक्षित रखे गए हैं।
theological_decisions:
- issue: ‘अपनी घेराबंदी’ का संदर्भ
  choice: मूल के संबंधसूचक रूप को ‘अपनी घेराबंदी’ के रूप में बनाए रखा गया है
  alternative: इसे स्पष्ट करके ‘यरूशलेम की घेराबंदी का अभिनय’ कहना
  rationale: अध्याय में यह यहेजकेल द्वारा किया गया प्रतीकात्मक कार्य है, पर पद स्वयं संदर्भ को विस्तार से नहीं खोलता; अतः अनावश्यक व्याख्या जोड़े बिना मूल तनाव बनाए रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और भविष्यद्वाणी के कथन के अनुरूप। ‘करवट’ शारीरिक मुद्रा को सामान्य पाठक के लिए तुरंत स्पष्ट करता है।
