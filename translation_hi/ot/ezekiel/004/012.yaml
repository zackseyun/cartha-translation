  text: You shall eat it as a barley cake, and you shall bake it over human dung in their sight.
translation:
  language: hi
  text: तुम उसे जौ की रोटी की तरह खाओ, और उनकी आँखों के सामने उसे मनुष्य के मल के उपलों पर सेंको।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עֻגַת שְׂעֹרִים
  choice: जौ की रोटी
  rationale: यह पद जौ से बनी चपटी रोटी को सूचित करता है; साधारण आधुनिक हिन्दी में ‘जौ की रोटी’ स्वाभाविक और स्पष्ट है।
- source_word: בְּגֶלְלֵי צֵאַת הָאָדָם
  choice: मनुष्य के मल पर
  rationale: בְ यहाँ ईंधन के रूप में प्रयुक्त मल के ऊपर रोटी सेंकने की परिस्थिति बताता है; ‘पर’ मूल की कठोर और अपवित्र छवि को बनाए रखता है।
- source_word: תְּעֻגֶנָה
  choice: उसे ... सेंकना
  rationale: क्रिया का अर्थ रोटी को पकाना/सेंकना है; ‘सेंकना’ जौ की रोटी और ईंधन की इस परिस्थिति में सहज हिन्दी है।
- source_word: לְעֵינֵיהֶם
  choice: उनकी आँखों के सामने
  rationale: इब्रानी मुहावरे का निकट, स्वाभाविक हिन्दी रूप है और कार्य के सार्वजनिक रूप से किए जाने पर बल बनाए रखता है।
theological_decisions:
- issue: मनुष्य के मल का प्रयोग
  choice: मल को रोटी सेंकने के ईंधन/आधार के रूप में स्पष्ट रखा गया है
  alternative: मल मिलाकर बनी रोटी
  rationale: मूल पाठ रोटी को मल में मिलाने के बजाय उसके ऊपर सेंकने की बात करता है; इससे प्रतीकात्मक अशुद्धता बनी रहती है, पर पाठ से अधिक नहीं कहा जाता।
translation_notes:
  register: आज्ञार्थक शैली में आधुनिक, dignified और सीधी हिन्दी रखी गई है। अशुद्धता की चौंकाने वाली छवि को नरम नहीं किया गया।
