  text: וְ/אַתָּ֣ה קַח לְ/ךָ֡ חִטִּ֡ין וּ֠/שְׂעֹרִים וּ/פ֨וֹל וַ/עֲדָשִׁ֜ים וְ/דֹ֣חַן וְ/כֻסְּמִ֗ים וְ/נָתַתָּ֤ה אוֹתָ/ם֙ בִּ/כְלִ֣י אֶחָ֔ד וְ/עָשִׂ֧יתָ אוֹתָ֛/ם לְ/ךָ֖ לְ/לָ֑חֶם מִסְפַּ֨ר הַ/יָּמִ֜ים אֲשֶׁר אַתָּ֣ה שׁוֹכֵ֣ב עַֽל צִדְּ/ךָ֗ שְׁלֹשׁ מֵא֧וֹת וְ/תִשְׁעִ֛ים י֖וֹם תֹּאכֲלֶֽ/נּוּ־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/004/009.yaml
  text: And you[a], take for yourself wheat and barley, beans and lentils, millet and spelt, and put them into one vessel, and make them into bread for yourself. For the number of the days that you lie on your side—three hundred and ninety days—you shall eat it.
translation:
  language: hi
  text: “और तू अपने लिए गेहूँ, जौ, सेम, मसूर, बाजरा और कठिया गेहूँ[a] ले। उन्हें एक ही बरतन में डाल और उनसे अपने लिए रोटी बना। जितने दिन तू करवट लेटा रहेगा—तीन सौ नब्बे दिन—उतने दिन तू वही रोटी खाना।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “एमर” अथवा “एक प्रकार का गेहूँ”; प्राचीन अनाज כֻסְּמִים की ठीक-ठीक पहचान निश्चित नहीं है।
    reason: lexical_alternative
lexical_decisions:
- source_word: קַח לְךָ
  choice: अपने लिए ... ले
  rationale: आज्ञार्थक क्रिया के साथ आए हितवाचक सर्वनाम का भाव बनाए रखता है और स्वाभाविक हिन्दी है।
- source_word: חִטִּין וּשְׂעֹרִים
  choice: गेहूँ, जौ
  rationale: दोनों अनाजों के मानक और सहज हिन्दी नाम।
- source_word: פּוֹל וַעֲדָשִׁים
  choice: सेम, मसूर
  rationale: פּוֹל के लिए सामान्य 'सेम' प्राचीन दाल की अति-विशिष्ट पहचान से बचता है; עֲדָשִׁים का मानक अर्थ 'मसूर' है।
- source_word: דֹחַן
  choice: बाजरा
  rationale: हिन्दी में millet के लिए प्रचलित, आसानी से समझ आने वाला अनाज-नाम।
- source_word: כֻסְּמִים
  choice: कठिया गेहूँ
  rationale: यह प्राचीन गेहूँ-प्रकार के लिए समझने योग्य हिन्दी पद है; सटीक वनस्पति-पहचान अनिश्चित होने के कारण विकल्प पाद-टिप्पणी में रखे गए हैं।
- source_word: בִּכְלִי אֶחָד
  choice: एक ही बरतन में
  rationale: '''एक ही'' सभी पदार्थों को साथ रखने पर हिब्रू के बल को व्यक्त करता है; ''बरतन'' כְּלִי का स्वाभाविक आधुनिक हिन्दी रूप है।'
- source_word: וְעָשִׂיתָ אוֹתָם לְךָ לְלָחֶם
  choice: उनसे अपने लिए रोटी बना
  rationale: हिब्रू के रूपांतरण और हितवाचक भाव दोनों को सहज हिन्दी में व्यक्त करता है।
- source_word: מִסְפַּר הַיָּמִים
  choice: जितने दिन ... उतने दिन
  rationale: अवधि और उसके अनुरूप भोजन करने का संबंध हिन्दी में स्पष्ट और स्वाभाविक ढंग से प्रस्तुत करता है।
- source_word: שׁוֹכֵב עַל צִדְּךָ
  choice: तू करवट लेटा रहेगा
  rationale: चल रहे प्रतीकात्मक कार्य को व्यक्त करता है; 'करवट' किसी एक पार्श्व पर लेटने का स्वाभाविक हिन्दी रूप है।
- source_word: שְׁלֹשׁ מֵאוֹת וְתִשְׁעִים יוֹם
  choice: तीन सौ नब्बे दिन
  rationale: हिब्रू की पूरी संख्या को औपचारिक बाइबलीय शैली में शब्दों से रखता है।
- source_word: תֹּאכֲלֶנּוּ
  choice: तू वही रोटी खाना
  rationale: अंतिम प्रत्यय का एकवचन संकेत पहले उल्लिखित रोटी की ओर है; हिन्दी आज्ञार्थक प्रयोग भविष्य निर्देश को सहजता से व्यक्त करता है।
