base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/004/010.yaml
  text: And your food that you shall eat shall be by weight[a], twenty shekels a day[b]; from time to time you shall eat it.
translation:
  language: hi
  text: तुम्हें जो भोजन खाना है, वह तौल के अनुसार प्रतिदिन बीस शेकेल[a] का हो; उसे तुम समय-समय पर[b] खाना।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ शेकेल सिक्का नहीं, भार की एक प्राचीन इकाई है।
    reason: cultural_note
  - marker: b
    text: शाब्दिक रूप से, “एक समय से दूसरे समय तक”; इसका अर्थ अंतरालों पर या नियत समयों पर हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: מַאֲכָלְךָ אֲשֶׁר תֹּאכֲלֶנּוּ
  choice: तुम जो भोजन खाओगे
  rationale: मַאֲכָל का सामान्य अर्थ ‘भोजन’ है, और संबंधवाचक उपवाक्य उस भोजन को स्पष्ट करता है जिसे यहेजकेल को खाना है।
- source_word: בְּמִשְׁקוֹל
  choice: उसे तौलकर खाना
  rationale: מִשְׁקוֹל भार या तौल को दर्शाता है। हिंदी में ‘तौलकर’ राशन की निश्चित मात्रा को स्वाभाविक और ठोस रूप से व्यक्त करता है।
- source_word: עֶשְׂרִים שֶׁקֶל לַיּוֹם
  choice: प्रतिदिन बीस शेकेल
  rationale: ऐतिहासिक भार-इकाई ‘शेकेल’ को बनाए रखा गया है; לַיּוֹם का वितरणात्मक अर्थ ‘प्रतिदिन’ से स्पष्ट होता है।
- source_word: מֵעֵת עַד עֵת
  choice: निश्चित समयों पर
  rationale: शाब्दिक रूप से ‘एक समय से दूसरे समय तक’ यह मुहावरा अंतरालों या नियत अवसरों पर खाने का निर्देश देता है। मुख्य पाठ में स्वाभाविक अर्थ रखा गया है और शाब्दिक रूप पादटिप्पणी में दिया गया है।
- source_word: תֹּאכֲלֶנּוּ
  choice: तुम उसे ... खाना
  rationale: अंत में दोहराई गई क्रिया निर्देश के बल को बनाए रखती है। आधुनिक हिंदी का आज्ञार्थक ‘खाना’ इस प्रसंग में स्वाभाविक है।
