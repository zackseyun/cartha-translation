  text: וְ/אַתָּ֤ה קַח לְ/ךָ֙ מַחֲבַ֣ת בַּרְזֶ֔ל וְ/נָתַתָּ֤ה אוֹתָ/הּ֙ קִ֣יר בַּרְזֶ֔ל בֵּינְ/ךָ֖ וּ/בֵ֣ין הָ/עִ֑יר וַ/הֲכִינֹתָה֩ אֶת פָּנֶ֨י/ךָ אֵלֶ֜י/הָ וְ/הָיְתָ֤ה בַ/מָּצוֹר֙ וְ/צַרְתָּ֣ עָלֶ֔י/הָ א֥וֹת הִ֖יא לְ/בֵ֥ית יִשְׂרָאֵֽל־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/004/003.yaml
  text: And you[a], take for yourself an iron griddle and set it as an iron wall between yourself and the city, and set your face toward it; and it will be under siege, and you shall besiege it. It is a sign for the house of Israel.
translation:
  language: hi
  text: और तू अपने लिए लोहे का एक तवा[a] ले और उसे अपने और नगर के बीच लोहे की दीवार के रूप में रख। फिर अपना मुख उसकी ओर कर; नगर घेरे में होगा, और तू उस पर घेरा डाल। यह इस्राएल के घराने के लिए एक चिन्ह है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “लोहे की चपटी तश्तरी” अथवा “लोहे की कड़ाही।” इब्रानी शब्द धातु का एक चपटा पकाने का उपकरण दर्शाता है, जिसे यहाँ प्रतीकात्मक रूप से दीवार के समान रखा गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: מַחֲבַת בַּרְזֶל
  choice: लोहे का एक तवा
  rationale: מַחֲבַת किसी चपटे धातु के पकाने के पात्र को दर्शाता है। आधुनिक हिन्दी में ‘तवा’ उसके पाक-संबंधी अर्थ को स्वाभाविक और स्पष्ट रूप से बनाए रखता है; प्रतीकात्मक प्रयोग के कारण अन्य आकारों की संभावना पादटिप्पणी में रखी गई है।
- source_word: קִיר בַּרְזֶל
  choice: लोहे की दीवार
  rationale: קִיר का सामान्य अर्थ ‘दीवार’ है। यह ठोस चित्रात्मकता प्रतीकात्मक कार्य के लिए महत्त्वपूर्ण है, इसलिए व्याख्यात्मक ‘बाधा’ के बजाय मूल रूपक रखा गया है।
- source_word: וַהֲכִינֹתָה אֶת־פָּנֶיךָ אֵלֶיהָ
  choice: अपना मुख उसकी ओर कर
  rationale: यह इब्रानी मुहावरा जानबूझकर किसी ओर उन्मुख होने को व्यक्त करता है। हिन्दी में ‘मुख उसकी ओर कर’ औपचारिक किंतु सहज है और मुहावरे की ठोस छवि बचाता है।
- source_word: וְהָיְתָה בַמָּצוֹר
  choice: वह घेराबंदी में होगा
  rationale: מָצוֹר घेराबंदी की दशा को दर्शाता है। इस वाक्यांश में अवस्था और अगले क्रियात्मक आदेश के बीच मूल का अंतर बना रहता है। स्त्रीलिंग प्रत्यय नगर को इंगित करता है, जो हिन्दी में पुल्लिंग है।
- source_word: וְצַרְתָּ עָלֶיהָ
  choice: तू उसे घेर लेना
  rationale: צור यहाँ नगर को घेरने या उसकी घेराबंदी करने का आदेश है। ‘घेर लेना’ हिन्दी में क्रियात्मक बल को सहज रूप में व्यक्त करता है और निकटवर्ती ‘घेराबंदी’ से संबंध भी बनाए रखता है।
- source_word: אוֹת הִיא
  choice: यह ... एक चिन्ह है
  rationale: אוֹת भविष्यसूचक प्रतीक या चिन्ह है। ‘यह’ पूरे अभिनीत कार्य की ओर संकेत कर सकता है और उसके अर्थ की अतिरिक्त व्याख्या नहीं जोड़ता।
- source_word: לְבֵית יִשְׂרָאֵל
  choice: इस्राएल के घराने के लिए
  rationale: यह सामूहिक, वाचा-संबंधी अभिव्यक्ति को केवल ‘इस्राएल’ में संक्षिप्त किए बिना बनाए रखता है; ל यहाँ लक्ष्य या संदर्भ को ‘के लिए’ से स्वाभाविक रूप से व्यक्त करता है।
theological_decisions:
- issue: भविष्यसूचक प्रतीकात्मक कार्य की ठोस चित्रात्मकता
  choice: ‘लोहे की दीवार’, ‘घेराबंदी’ और ‘इस्राएल का घराना’ जैसी ठोस अभिव्यक्तियाँ बनाए रखी गईं।
  alternative: इनका व्याख्यात्मक अनुवाद ‘लोहे की बाधा’, ‘आक्रमण’ और केवल ‘इस्राएल’ किया जा सकता था।
  rationale: पद स्वयं प्रतीक का पूरा धर्मवैज्ञानिक अर्थ स्पष्ट नहीं करता। ठोस भाषा बनाए रखने से पाठक प्रतीकात्मक तनाव को देख सकता है और अनुवाद किसी एक व्याख्या को आरोपित नहीं करता।
- issue: लोहे की दीवार का निहितार्थ
  choice: पाठ में केवल प्रतीकात्मक वस्तु और क्रिया दी गई है; यह नहीं बताया गया कि दीवार न्याय, अलगाव, अभेद्यता या किसी अन्य बात का विशेष प्रतीक है।
  alternative: अनुवाद में दीवार के धर्मवैज्ञानिक अर्थ को स्पष्ट कर देना।
  rationale: मूल पद उस अर्थ को खुला छोड़ता है, इसलिए वास्तविक अस्पष्टता सुरक्षित रखी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण भविष्यसूचक शैली रखी गई है। संबोधन एकवचन है, इसलिए ‘तू’ मूल की प्रत्यक्ष आज्ञात्मकता को बनाए रखता है। ‘नगर’ और ‘मुख’ जैसे शब्द साहित्यिक-बाइबलीय गरिमा देते हैं, पर सामान्य पाठक के लिए स्पष्ट हैं।
