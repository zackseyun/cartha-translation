  text: And set a siege against it[a], and build a siege wall against it, and heap up a ramp against it, and set camps against it[b], and place battering rams against it all around.
translation:
  language: hi
  text: और उसके विरुद्ध घेरा डाल, उसके विरुद्ध घेराबंदी की दीवार बना[a], उसके विरुद्ध चढ़ाई का बाँध खड़ा कर[b], उसके विरुद्ध सैनिक छावनियाँ लगा, और उसके चारों ओर दीवार तोड़ने वाले मेढ़े लगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘घेराबंदी का मचान’। इब्रानी शब्द דָּיֵק घेराबंदी में काम आने वाली किसी संरचना को दर्शाता है और आक्रमण के लिए बनाई गई ऊँची किलेबंदी भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या ‘घेराबंदी का चढ़ाई-मार्ग’। इब्रानी סֹלְלָה नगर की दीवार के विरुद्ध मिट्टी आदि का ढेर लगाकर बनाए गए बाँध या ढलानदार मार्ग को दर्शाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: מָצוֹר
  choice: घेरा
  rationale: यह सैनिक घेराबंदी को दर्शाता है। ‘घेरा डाल’ आधुनिक हिन्दी में स्वाभाविक है और इब्रानी आदेश की संक्षिप्तता बनाए रखता है।
- source_word: דָּיֵק
  choice: घेराबंदी की दीवार
  rationale: यह नगर पर आक्रमण के लिए बनाई गई किसी घेराबंदी-संरचना का नाम है। इसका ठीक स्वरूप अनिश्चित है, इसलिए मुख्य पाठ में व्यापक अर्थ रखा गया और वैकल्पिक अर्थ पादटिप्पणी में दिया गया है।
- source_word: סֹלְלָה
  choice: चढ़ाई का बाँध
  rationale: यह नगर की दीवार तक पहुँचने के लिए मिट्टी आदि का ढेर लगाकर बनाए गए उठे हुए मार्ग या बाँध को दर्शाता है। यह अनुवाद वस्तु और उसके सैनिक प्रयोजन दोनों को समझने योग्य बनाता है।
- source_word: מַחֲנוֹת
  choice: सैनिक छावनियाँ
  rationale: बहुवचन शब्द नगर को घेरने वाली सेनाओं की छावनियों को दर्शाता है; ‘सैनिक’ जोड़ने से प्रसंग सामान्य पाठक के लिए स्पष्ट होता है।
- source_word: כָּרִים
  choice: दीवार तोड़ने वाले मेढ़े
  rationale: घेराबंदी के प्रसंग में यह दीवार या फाटक पर प्रहार करने वाले भारी मेढ़ाकार यंत्रों को दर्शाता है, न कि जीवित पशुओं को।
- source_word: עָלֶיהָ
  choice: उसके विरुद्ध / उसके सामने
  rationale: दोहराया गया संबंधबोधक पद नगर की प्रतिकृति की ओर निर्देशित शत्रुतापूर्ण कार्रवाई बताता है। हिन्दी में प्रसंगानुसार ‘विरुद्ध’ और ‘सामने’ स्वाभाविक हैं।
- source_word: סָבִיב
  choice: चारों ओर
  rationale: यह पूरी तरह घेर लेने की तस्वीर प्रस्तुत करता है।
- source_word: וְנָתַתָּה / וּבָנִיתָ / וְשָׁפַכְתָּ / וְשִׂים
  choice: डाल / बना / खड़ा कर / लगा
  rationale: इन आज्ञार्थक क्रियाओं को एकवचन प्रत्यक्ष आदेशों के रूप में रखा गया है और प्रत्येक सैनिक कार्रवाई को स्वाभाविक हिन्दी क्रिया से व्यक्त किया गया है।
