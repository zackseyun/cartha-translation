language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר אֵלַ֔/י רְאֵ֗ה נָתַ֤תִּֽי לְ/ךָ֙ אֶת צפועי הַ/בָּקָ֔ר תַּ֖חַת גֶּלְלֵ֣י הָֽ/אָדָ֑ם וְ/עָשִׂ֥יתָ אֶֽת לַחְמְ/ךָ֖ עֲלֵי/הֶֽם־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/004/015.yaml
  text: Then he said to me[a], “See, I have given you cow dung instead of human dung, and you shall prepare your bread over it.”
translation:
  language: hi
  text: तब उसने मुझसे कहा, “देख, मैंने मनुष्य के मल के बदले तुझे गाय का गोबर दिया है; तू उसी पर अपनी रोटी तैयार करना।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר אֵלַי
  choice: तब उसने मुझसे कहा
  rationale: वाव-क्रमिक कथा को आगे बढ़ाता है। आधुनिक हिन्दी में ‘तब’ स्वाभाविक रूप से क्रम व्यक्त करता है; कर्ता पूर्व प्रसंग से परमेश्वर है, इसलिए मूल की तरह सर्वनाम रखा गया है।
- source_word: רְאֵה
  choice: देख
  rationale: यह ध्यान आकर्षित करने वाला एकवचन आदेश है। ‘देख’ सीधा, वर्तमान और मूल के निकट है।
- source_word: נָתַתִּי לְךָ
  choice: मैंने ... तुझे ... दिया है
  rationale: पूर्ण क्रिया यहाँ पहले से स्वीकृत किए गए प्रबंध को दर्शाती है; ‘दिया है’ उसका वर्तमान परिणाम भी बनाए रखता है।
- source_word: צפועי הַבָּקָר
  choice: गाय का गोबर
  rationale: यह मवेशियों के गोबर को ईंधन के रूप में इस्तेमाल करने की बात है। ‘गाय का गोबर’ सामान्य हिन्दी में ठोस और सहज अभिव्यक्ति है।
- source_word: תַּחַת גֶּלְלֵי הָאָדָם
  choice: मनुष्य के मल के बदले
  rationale: תַּחַת यहाँ स्थान नहीं, प्रतिस्थापन बताता है। הָאָדָם मानव जाति को सामान्य रूप से दर्शाता है, और ‘मनुष्य का मल’ पशु के गोबर से स्पष्ट विरोध बनाए रखता है।
- source_word: וְעָשִׂיתָ אֶת לַחְמְךָ
  choice: तू ... अपनी रोटी तैयार करना
  rationale: עשה व्यापक अर्थ में ‘करना/बनाना’ है। पकाने के प्रसंग में ‘तैयार करना’ अर्थ स्पष्ट करता है, पर ‘सेंकना’ जैसी अधिक विशिष्ट क्रिया नहीं जोड़ता।
- source_word: עֲלֵיהֶם
  choice: उसी पर
  rationale: इब्रानी प्रत्यय बहुवचन है और गोबर के उपलों/टुकड़ों की ओर संकेत करता है; हिन्दी में ‘गोबर’ द्रव्यवाचक एकवचन होने के कारण ‘उसी पर’ स्वाभाविक है और ईंधन के ऊपर रोटी तैयार करने का भाव देता है।
theological_decisions:
- issue: הָאָדָם का अर्थ
  choice: मनुष्य
  alternative: आदमी / मानव-मल
  rationale: यहाँ הָאָדָם किसी विशेष पुरुष को नहीं, मनुष्यों को सामान्य रूप से मवेशियों के विपरीत दर्शाता है। ‘मनुष्य’ इस सामान्य अर्थ को बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; संबोधन मूल के एकवचन निकट रूप के अनुरूप ‘तू/तुझे’ में रखा गया है। भाषा सीधी और गरिमापूर्ण है। ‘मल’ तथा ‘गोबर’ का भेद हिन्दी में मानव और पशु के उत्सर्जन का स्वाभाविक अंतर स्पष्ट करता है।
