  yaml_path: translation/ot/ezekiel/004/016.yaml
  text: Then he said to me[a], “Son of man, behold, I am breaking the staff of bread in Jerusalem, and they will eat bread by weight and with anxiety, and they will drink water by measure and with horror.”
translation:
  language: hi
  text: फिर उसने मुझसे कहा, “हे मनुष्य के पुत्र, देख, मैं यरूशलेम में रोटी की जीवन-निर्वाहक आपूर्ति[a] तोड़ने वाला हूँ। वे रोटी तौलकर और चिंता के साथ खाएँगे, और पानी नापकर और दहशत में पिएँगे।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से “रोटी की लाठी”; यह भोजन की जीवन-निर्वाहक आपूर्ति के लिए इब्रानी मुहावरा है।
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן אָדָם
  choice: हे मनुष्य के पुत्र
  rationale: यहेजकेल को दिए जाने वाले इब्रानी संबोधन की परंपरागत और स्रोत-समीप अभिव्यक्ति; यहाँ यह मसीही उपाधि नहीं, बल्कि नबी की मानवीय स्थिति पर बल देता है।
- source_word: הִנְנִי שֹׁבֵר
  choice: देख, मैं ... तोड़ने वाला हूँ
  rationale: הִנְנִי के ध्यानाकर्षक और बलात्मक भाव को ‘देख’ से तथा कृदंत के निकट और निश्चित कार्य को ‘तोड़ने वाला हूँ’ से व्यक्त किया गया है।
- source_word: מַטֵּה לֶחֶם
  choice: रोटी का सहारा
  rationale: ‘लाठी/आधार’ के रूपक को स्वाभाविक हिन्दी में सुरक्षित रखता है और रोटी की जीवन-निर्वाहक आपूर्ति की ओर संकेत करता है; मुहावरे का अर्थ पादटिप्पणी में स्पष्ट है।
- source_word: וְאָכְלוּ לֶחֶם בְּמִשְׁקָל
  choice: वे रोटी तौलकर ... खाएँगे
  rationale: अकाल में राशन की तरह रोटी तौले जाने की ठोस छवि को बनाए रखता है।
- source_word: וּבִדְאָגָה
  choice: चिंता के साथ
  rationale: דְאָגָה की व्याकुल चिंता और आशंका को सीधे और आधुनिक हिन्दी में व्यक्त करता है।
- source_word: וּמַיִם בִּמְשׂוּרָה
  choice: पानी नापकर
  rationale: पानी की सीमित, मापी हुई मात्रा का ठोस भाव रखता है और ‘रोटी तौलकर’ के समानांतर है।
- source_word: וּבְשִׁמָּמוֹן
  choice: दहशत में
  rationale: שִׁמָּמוֹן के भयाक्रांत स्तब्धता, उजाड़पन और आतंक के अर्थ-क्षेत्र को इस न्याय-संदर्भ में स्वाभाविक हिन्दी से व्यक्त करता है।
- source_word: יִשְׁתּוּ
  choice: पिएँगे
  rationale: संदर्भ में अपूर्ण काल को आगामी परिणाम के रूप में, ‘खाएँगे’ के समानांतर रखा गया है।
theological_decisions:
- issue: מַטֵּה לֶחֶם में निहित रूपक
  choice: मुख्य पाठ में ‘रोटी का सहारा’ रूपक बनाए रखा गया है और पादटिप्पणी में उसका मुहावरेदार अर्थ समझाया गया है।
  alternative: मुख्य पाठ में सीधे ‘रोटी की आपूर्ति’ या ‘भोजन की आपूर्ति’ कहना।
  rationale: यह रूपक परमेश्वर के न्याय को उस जीवन-निर्वाहक आधार के टूटने के रूप में चित्रित करता है जिस पर नगर निर्भर है; पादटिप्पणी अर्थ को स्पष्ट रखते हुए मूल चित्र को बचाती है।
- issue: הִנְנִי שֹׁבֵר का कालगत बल
  choice: ‘देख, मैं ... तोड़ने वाला हूँ’
  alternative: ‘देख, मैं ... तोड़ रहा हूँ’
  rationale: इब्रानी रचना आसन्न और निश्चित दैवी कार्य दोनों को व्यक्त कर सकती है। चुना हुआ रूप हिन्दी में आसन्नता को स्वाभाविक रूप से रखता है, बिना उसकी निश्चितता घटाए।
translation_notes:
  register: आधुनिक मानक हिन्दी का गंभीर, भविष्यद्वाणी-संगत रजिस्टर अपनाया गया है। वाक्य सामान्य पाठक के लिए सहज है, जबकि ‘रोटी का सहारा’ मूल इब्रानी रूपक को सुरक्षित रखता है।
