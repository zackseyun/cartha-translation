  text: וְ/אַתָּ֤ה שְׁכַב֙ עַל צִדְּ/ךָ֣ הַ/שְּׂמָאלִ֔י וְ/שַׂמְתָּ֛ אֶת עֲוֺ֥ן בֵּֽית יִשְׂרָאֵ֖ל עָלָ֑י/ו מִסְפַּ֤ר הַ/יָּמִים֙ אֲשֶׁ֣ר תִּשְׁכַּ֣ב עָלָ֔י/ו תִּשָּׂ֖א אֶת עֲוֺנָֽ/ם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/004/004.yaml
  text: And you[a], lie on your left side, and place the iniquity of the house of Israel upon it; for the number of the days that you lie on it, you shall bear their iniquity.
translation:
  language: hi
  text: और तू अपनी बाईं करवट लेट जा और इस्राएल के घराने का अधर्म उस पर रख। जितने दिन तू उस पर लेटा रहेगा, उतने दिन तू उनका अधर्म उठाएगा।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: दोनों स्थानों पर “अधर्म” के लिए “दोष” या “अधर्म का दण्ड” भी सम्भव है। इब्रानी עָוֹן पाप स्वयं, उससे उत्पन्न दोष, या उसके परिणाम को सूचित कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁכַב עַל צִדְּךָ הַשְּׂמָאלִי
  choice: अपनी बाईं करवट लेट जा
  rationale: भौतिक मुद्रा की आज्ञा को आधुनिक, स्वाभाविक हिन्दी में व्यक्त करता है; ‘करवट’ शरीर के बाएँ पार्श्व पर लेटने का अर्थ स्पष्ट करती है।
- source_word: עֲוֺן
  choice: अधर्म
  rationale: यह शब्द पाप, उससे उत्पन्न दोष और उसके परिणाम का संकेत दे सकता है। ‘अधर्म’ नैतिक आयाम बनाए रखता है, जबकि व्यापक अर्थ-सीमा पाद-टिप्पणी में दी गई है।
- source_word: בֵּית יִשְׂרָאֵל
  choice: इस्राएल का घराना
  rationale: इब्रानी की सामूहिक और वाचागत अभिव्यक्ति को स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: וְשַׂמְתָּ ... עָלָיו
  choice: उस पर रख
  rationale: सर्वनाम का सबसे स्वाभाविक संदर्भ बाईं करवट/पार्श्व है और यह प्रतीकात्मक क्रिया की स्थानिक छवि बनाए रखता है।
- source_word: מִסְפַּר הַיָּמִים אֲשֶׁר תִּשְׁכַּב עָלָיו
  choice: जितने दिन तू उस पर लेटा रहेगा, उतने दिन
  rationale: दिनों की गिनी हुई अवधि का परिमाणात्मक संबंध स्पष्ट और सहज हिन्दी में व्यक्त करता है।
- source_word: תִּשָּׂא אֶת עֲוֺנָם
  choice: तू उनका अधर्म उठाएगा
  rationale: נשא और עָוֹן के भार-वाले रूपक को सुरक्षित रखता है तथा प्रतीकात्मक वहन के अर्थ को किसी विशिष्ट प्रायश्चित-सिद्धांत में नहीं बदलता।
theological_decisions:
- issue: यहेजकेल द्वारा इस्राएल का עָוֹן उठाने का अर्थ
  choice: ‘उनका अधर्म उठाएगा’ को भविष्यद्वक्ता की प्रतीकात्मक क्रिया के रूप में खुला रखा गया है।
  alternative: ‘उनका दोष उठाएगा’ या ‘उनके अधर्म का दण्ड सहेगा’
  rationale: इब्रानी शब्द पाप, दोष अथवा परिणाम/दण्ड को समेट सकता है। पद स्वयं किसी विकसित स्थानापन्न-प्रायश्चित व्याख्या की माँग नहीं करता, इसलिए मूल का धर्मवैचारिक तनाव सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण और सहज रूप अपनाया गया है। एक व्यक्ति को सीधे संबोधित करने वाले मूल के एकवचन रूप के अनुरूप ‘तू’ रखा गया है; ‘बाईं करवट’ शारीरिक मुद्रा को स्वाभाविक ढंग से स्पष्ट करता है।
