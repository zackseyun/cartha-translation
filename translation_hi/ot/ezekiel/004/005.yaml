  yaml_path: translation/ot/ezekiel/004/005.yaml
  text: And I have assigned to you the years of their iniquity according to the number of days[a], three hundred and ninety days, and you shall bear the iniquity of the house of Israel.
translation:
  language: hi
  text: और मैंने उनके अधर्म[a] के वर्षों को दिनों की गिनती के अनुसार तेरे लिए ठहराया है—तीन सौ नब्बे दिन; और तू इस्राएल के घराने का अधर्म उठाएगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उनके अधर्म का दण्ड” अथवा “उनका दोष”; इब्रानी शब्द अधर्म, उससे उत्पन्न दोष, या दोष के फलस्वरूप मिलने वाले दण्ड को सूचित कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: נָתַתִּי
  choice: मैंने ... तेरे लिए ठहराया है
  rationale: मूल अर्थ ‘दिया’ है, पर इस प्रतीकात्मक कार्य में परमेश्वर द्वारा अवधि नियत किए जाने का भाव व्यक्त करने के लिए ‘ठहराया है’ स्वाभाविक और सटीक है।
- source_word: שְׁנֵי עֲוֺנָם
  choice: उनके अधर्म के वर्षों
  rationale: इब्रानी संरचना को निकटता से रखते हुए वर्षों और अधर्म का संबंध स्पष्ट किया गया है; अगले पदांश में दिन उन वर्षों का प्रतीकात्मक प्रतिनिधित्व करते हैं।
- source_word: עֲוֺן
  choice: अधर्म
  rationale: यह शब्द अधर्म, दोष और दोष के फलस्वरूप दण्ड—तीनों अर्थ-छायाएँ रख सकता है। मुख्य पाठ में ‘अधर्म’ नैतिक अर्थ को सुरक्षित रखता है और टिप्पणी अन्य संभावनाएँ बताती है।
- source_word: לְמִסְפַּר יָמִים
  choice: दिनों की गिनती के अनुसार
  rationale: यह वर्षों और प्रतीकात्मक दिनों के संख्यात्मक अनुरूप संबंध को सीधे व्यक्त करता है।
- source_word: שְׁלֹשׁ מֵאוֹת וְתִשְׁעִים יוֹם
  choice: तीन सौ नब्बे दिन
  rationale: संख्या और संज्ञा का आधुनिक मानक हिन्दी में सीधा अनुवाद।
- source_word: וְנָשָׂאתָ
  choice: तू ... उठाएगा
  rationale: नָשָׂא के ‘वहन करना/उठाना’ भाव को बनाए रखता है और भविष्यसूचक प्रतीकात्मक कार्य का भार भी व्यक्त करता है।
- source_word: בֵּית יִשְׂרָאֵל
  choice: इस्राएल के घराने
  rationale: यह सामूहिक, वाचाई-राष्ट्रीय पदवी की इब्रानी संरचना को स्वाभाविक हिन्दी में सुरक्षित रखता है।
theological_decisions:
- issue: भविष्यसूचक प्रतीकात्मक कार्य में עָוֹן का अर्थ
  choice: दोनों स्थानों पर ‘अधर्म’
  alternative: ‘दोष’ अथवा ‘अधर्म का दण्ड’
  rationale: इब्रानी शब्द पाप, उससे उत्पन्न दोष और उसके दण्ड का भार—इन जुड़े हुए अर्थों को समेट सकता है। ‘अधर्म’ चुनने से पाठ इस तनाव को किसी एक अर्थ में सीमित नहीं करता; ‘उठाएगा’ परिणाम या भार की अर्थ-छाया बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सामान्य पाठक के लिए सुबोध शैली। परमेश्वर के प्रत्यक्ष संबोधन और भविष्यसूचक प्रसंग के अनुरूप ‘तेरे/तू’ रखा गया है। ‘घराना’ सामूहिक पदवी को बनाए रखता है।
