lexical_decisions:
- source_word: וּמַיִם
  choice: और पानी भी
  rationale: ו संयोजक है और מַיִם का अर्थ ‘पानी’ है; ‘भी’ पिछले निर्देश के साथ स्वाभाविक क्रम और अतिरिक्त राशन की भावना व्यक्त करता है।
- source_word: בִּמְשׂוּרָה
  choice: नापकर
  rationale: מְשׂוּרָה नपी हुई मात्रा या माप को दर्शाता है। ‘नापकर’ आधुनिक हिन्दी में राशन बाँधने का भाव संक्षेप और स्वाभाविक ढंग से रखता है।
- source_word: תִשְׁתֶּה
  choice: पीना
  rationale: द्वितीय पुरुष एकवचन अपूर्ण क्रिया यहाँ निर्देशात्मक है। ‘पीना’ पिछले आदेशों की शैली में दृढ़, सहज निर्देश देता है।
- source_word: שִׁשִּׁית הַהִין
  choice: एक हीन का छठा भाग
  rationale: प्राचीन माप ‘हीन’ को बदले बिना रखा गया है और שִׁשִּׁית को स्पष्ट हिन्दी में ‘छठा भाग’ कहा गया है।
- source_word: מֵעֵת עַד עֵת
  choice: समय-समय पर
  rationale: यह पदबंध शाब्दिक रूप से एक समय से दूसरे समय तक और प्रसंग में अंतराल पर पीने को सूचित करता है; ‘समय-समय पर’ उसकी संभावित व्यापकता बनाए रखता है।
- source_word: תִּשְׁתֶּה
  choice: उसे पीना
  rationale: इब्रानी में क्रिया की पुनरावृत्ति को हिन्दी में भी रखा गया है, जिससे पीने की नियंत्रित व्यवस्था पर बल बना रहता है।
