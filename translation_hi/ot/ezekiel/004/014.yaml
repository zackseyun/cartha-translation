  text: וָ/אֹמַ֗ר אֲהָהּ֙ אֲדֹנָ֣/י יְהוִ֔ה הִנֵּ֥ה נַפְשִׁ֖/י לֹ֣א מְטֻמָּאָ֑ה וּ/נְבֵלָ֨ה וּ/טְרֵפָ֤ה לֹֽא אָכַ֨לְתִּי֙ מִ/נְּעוּרַ֣/י וְ/עַד עַ֔תָּה וְ/לֹא בָ֥א בְּ/פִ֖/י בְּשַׂ֥ר פִּגּֽוּל־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/004/014.yaml
  text: Then I said[a], “Ah, Lord Yahweh! Look, I have never defiled myself. From my youth until now I have not eaten what dies of itself or what is torn by beasts[c][b], and no defiled meat has entered my mouth.”
translation:
  language: hi
  text: तब मैंने कहा, “हाय, प्रभु यहोवा! देखिए, मैंने अपने आपको कभी अशुद्ध नहीं किया। अपनी युवावस्था से लेकर अब तक मैंने न तो अपने आप मर गए जानवर का मांस खाया है, न हिंसक पशु द्वारा फाड़े गए जानवर का मांस; और घृणित मांस[a] कभी मेरे मुँह में नहीं आया है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “धार्मिक रीति से अशुद्ध मांस।” इब्रानी शब्द ऐसे मांस को दर्शाता है जो धार्मिक रीति से अस्वीकार्य या घृणित ठहराया गया हो।
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲהָהּ
  choice: हाय
  rationale: यह व्यथा और विरोध प्रकट करने वाला विस्मयादिबोधक है; ‘हाय’ आधुनिक हिन्दी में स्वाभाविक रूप से यह भाव व्यक्त करता है।
- source_word: אֲדֹנָי יְהוִה
  choice: प्रभु यहोवा
  rationale: उपाधि אֲדֹנָי और परमेश्वर के व्यक्तिगत नाम יהוה, दोनों का भेद बनाए रखता है।
- source_word: הִנֵּה
  choice: देखिए
  rationale: यह यहेजकेल की विनती पर ध्यान खींचने वाला संबोधन है; आदरसूचक रूप प्रभु से प्रत्यक्ष संबोधन के अनुकूल है।
- source_word: נַפְשִׁי לֹא מְטֻמָּאָה
  choice: मैंने अपने आपको कभी अशुद्ध नहीं किया
  rationale: शाब्दिक अर्थ ‘मेरा प्राण/जीवन अशुद्ध नहीं हुआ’ है, पर यहाँ נֶפֶשׁ पूरे व्यक्ति को सूचित करता है; हिन्दी रूप धार्मिक अशुद्धता के व्यक्तिगत दावे को स्पष्ट करता है।
- source_word: נְבֵלָה
  choice: अपने आप मरे हुए पशु का मांस
  rationale: यह ऐसे पशु के शव को सूचित करता है जो विधिपूर्वक वध किए बिना मर गया हो; सन्दर्भ के कारण ‘मांस’ स्पष्ट किया गया है।
- source_word: טְרֵפָה
  choice: जंगली पशु द्वारा फाड़े गए पशु का
  rationale: यह किसी हिंसक पशु द्वारा फाड़े या मारे गए पशु के लिए प्रचलित आहार-विधि संबंधी शब्द है।
- source_word: מִנְּעוּרַי וְעַד עַתָּה
  choice: अपनी युवावस्था से लेकर अब तक
  rationale: यह अभिव्यक्ति यहेजकेल की जीवनभर की आचरण-पद्धति पर बल देती है।
- source_word: וְלֹא בָא בְּפִי
  choice: न कभी ... मेरे मुँह में गया है
  rationale: मूल की ठोस ‘मुँह में आने’ वाली छवि बनाए रखते हुए खाने का आशय स्वाभाविक हिन्दी में व्यक्त होता है।
- source_word: בְּשַׂר פִּגּוּל
  choice: घृणित मांस
  rationale: פִּגּוּל केवल सामान्य अशुद्धता नहीं, धार्मिक रीति से अस्वीकार्य या घृणित मांस को सूचित करता है; ‘घृणित’ इसकी तीव्रता और विशिष्टता बचाता है।
theological_decisions:
- issue: संयुक्त दिव्य संबोधन אֲדֹנָי יְהוִה का अनुवाद
  choice: प्रभु यहोवा
  alternative: प्रभु परमेश्वर
  rationale: ‘प्रभु यहोवा’ उपाधि और वाचा-संबंधी व्यक्तिगत नाम, दोनों को स्पष्ट रखता है और उन्हें एक सामान्य पदवी में नहीं मिलाता।
- issue: פִּגּוּל की धार्मिक-अनुष्ठानिक बारीकी
  choice: घृणित मांस
  alternative: अशुद्ध मांस
  rationale: यह शब्द धार्मिक रीति से अस्वीकार्य मांस का द्योतक हो सकता है; मुख्य पाठ में ‘घृणित’ रखा गया है और पादटिप्पणी में वैकल्पिक अर्थ दिया गया है, जिससे अस्पष्टता बनी रहती है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण और सहज रूप अपनाया गया है। धार्मिक शुद्धता की भाषा स्पष्ट रखी गई है, पर मूल के विशिष्ट आहार-संबंधी पदों को अत्यधिक सामान्य नहीं बनाया गया।
