  text: וְ/אֶל מְצ֤וֹר יְרוּשָׁלִַ֨ם֙ תָּכִ֣ין פָּנֶ֔י/ךָ וּֽ/זְרֹעֲ/ךָ֖ חֲשׂוּפָ֑ה וְ/נִבֵּאתָ֖ עָלֶֽי/הָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/004/007.yaml
  text: And toward the siege of Jerusalem you shall set your face[a], with your arm bared, and you shall prophesy against it.
translation:
  language: hi
  text: और यरूशलेम की घेराबंदी की ओर अपना मुख किए रखना, अपनी बाँह उघाड़ी रखना, और उसके विरुद्ध[a] भविष्यवाणी करना।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उसके विषय में।” इब्रानी पूर्वसर्ग का अर्थ अधिक व्यापक हो सकता है, पर यहाँ घेराबंदी और न्याय का प्रसंग “उसके विरुद्ध” अर्थ का समर्थन करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: מְצוֹר
  choice: घेराबंदी
  rationale: यह संज्ञा नगर को घेरे जाने या उसकी घेराबंदी की अवस्था को दर्शाती है। इस प्रतीकात्मक क्रिया के प्रसंग में “यरूशलेम की घेराबंदी” स्वाभाविक है और अनावश्यक रूप से घेराबंदी के किसी खास निर्माण को नहीं जोड़ती।
- source_word: תָּכִין פָּנֶיךָ
  choice: अपना मुख स्थिर करो
  rationale: כון के हिफ़ील रूप और “मुख” का मेल किसी दिशा में दृढ़तापूर्वक उन्मुख होने का भाव देता है। यह अनुवाद मूल मुहावरे की गंभीरता और संकल्प दोनों बनाए रखता है।
- source_word: זְרֹעֲךָ חֲשׂוּפָה
  choice: अपनी बाँह उघाड़ी रखो
  rationale: मूल पदबंध क्रियारहित है और शाब्दिक अर्थ “तुम्हारी बाँह खुली/उघड़ी हुई” है। “उघाड़ी रखो” हिन्दी में स्वाभाविक ढंग से कार्रवाई के लिए तैयार बाँह का दृश्य सुरक्षित रखता है।
- source_word: וְנִבֵּאתָ עָלֶיהָ
  choice: और उसके विरुद्ध भविष्यवाणी करो
  rationale: न्याय और घेराबंदी के इस प्रसंग में נבא के साथ עַל का विरोधात्मक अर्थ प्रमुख है। “उसके” का संकेत यरूशलेम की ओर है।
theological_decisions:
- issue: यरूशलेम की ओर निर्देशित भविष्यवाणी का भाव
  choice: “उसके विरुद्ध” द्वारा न्यायसूचक और विरोधात्मक भाव व्यक्त किया गया है।
  alternative: इसे अधिक तटस्थ रूप में “उसके विषय में” भी अनुवाद किया जा सकता है।
  rationale: עַל का अर्थ केवल विरोधात्मक नहीं होता, परन्तु यहेजकेल की इस प्रतीकात्मक क्रिया में घेराबंदी और न्याय की घोषणा होने के कारण “विरुद्ध” प्रसंग के बल को बेहतर व्यक्त करता है, बिना किसी अतिरिक्त धर्मसैद्धांतिक निष्कर्ष को जोड़े।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण आज्ञार्थक शैली रखी गई है। “मुख स्थिर करो” भविष्यद्वाणी की गंभीरता और दृढ़ उन्मुखता को बनाए रखता है, जबकि “बाँह उघाड़ी रखो” प्रतीकात्मक दृश्य को सहज भाषा में प्रस्तुत करता है।
