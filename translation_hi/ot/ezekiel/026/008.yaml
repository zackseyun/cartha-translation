base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/026/008.yaml
  text: He will kill your daughters in the field with the sword[a], set up a siege wall against you, throw up a siege ramp against you[b], and raise a large shield against you.
translation:
  language: hi
  text: मैदान में तुम्हारी बेटियों[a] को वह तलवार से मार डालेगा। वह तुम्हारे विरुद्ध घेराबंदी की दीवार खड़ी करेगा, तुम्हारे विरुद्ध मिट्टी का चढ़ाई-ढलान बनाएगा, और तुम्हारे विरुद्ध एक बड़ी ढाल[b] खड़ी करेगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “मैदान में तुम्हारी बेटियाँ।” यहाँ “बेटियाँ” मुख्य नगर पर निर्भर छोटे नगरों या देहाती बस्तियों के लिए भी कहा जा सकता है।
    reason: lexical_alternative
  - marker: b
    text: “बड़ी ढाल” से आशय घेराबंदी के समय आक्रमणकारियों को बचाने वाला बड़ा चल सुरक्षा-आवरण भी हो सकता है।
    reason: cultural_note
lexical_decisions:
- source_word: בְּנוֹתַיִךְ
  choice: तुम्हारे अधीन नगरों
  rationale: इब्रानी में शाब्दिक अर्थ ‘तुम्हारी बेटियाँ’ है, पर नगर के संदर्भ में यह उसके अधीन या आश्रित बस्तियों के लिए प्रयुक्त रूपक है। मुख्य पाठ में आशय स्पष्ट किया गया है और मूल रूपक को पादटिप्पणी में रखा गया है।
- source_word: בַּשָּׂדֶה
  choice: मैदान में बसे
  rationale: मूल अर्थ खुले मैदान या देहात में होना है। सोर के संदर्भ में ये मुख्य नगर से बाहर, संभवतः मुख्यभूमि पर स्थित बस्तियाँ हैं; अनुवाद उस भौगोलिक निष्कर्ष को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: בַּחֶרֶב יַהֲרֹג
  choice: तलवार से मार डालेगा
  rationale: यह युद्ध में तलवार द्वारा वध किए जाने का सीधा और स्वाभाविक आधुनिक हिन्दी रूप है।
- source_word: דָּיֵק
  choice: घेराबंदी की दीवार
  rationale: यह घेराबंदी में प्रयुक्त किसी घेरे, दीवार या सैन्य निर्माण का तकनीकी शब्द है। एकवचन को बनाए रखते हुए ‘घेराबंदी की दीवार’ प्रसंग को स्पष्ट करता है।
- source_word: סֹלְלָה
  choice: चढ़ाई के लिए मिट्टी का बाँध
  rationale: यह नगर की दीवार तक पहुँचने के लिए मिट्टी डालकर बनाए गए ऊँचे मार्ग, पुश्ते या चढ़ाईदार बाँध को दर्शाता है। यह हिन्दी पाठक के लिए ‘रैम्प’ से अधिक स्पष्ट है।
- source_word: צִנָּה
  choice: एक बड़ी ढाल
  rationale: शब्द सामान्यतः बड़ी ढाल को दर्शाता है; घेराबंदी के प्रसंग में यह सैनिकों या आक्रमण-उपकरणों को बचाने वाले चल सुरक्षा-आवरण का संकेत भी दे सकता है। मुख्य पाठ मूल शब्द का सामान्य अर्थ रखता है।
- source_word: וְנָתַן ... וְשָׁפַךְ ... וְהֵקִים
  choice: खड़ी करेगा ... बनाएगा ... खड़ी करेगा
  rationale: भविष्यवाणी के क्रम में इन क्रियाओं का भावी अर्थ है। अलग-अलग स्वाभाविक हिन्दी क्रियाएँ प्रत्येक घेराबंदी-कार्य को स्पष्ट करती हैं।
