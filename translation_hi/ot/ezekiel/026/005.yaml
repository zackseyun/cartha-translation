id: EZK.26.5
reference: Ezekiel 26:5
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: מִשְׁטַ֨ח חֲרָמִ֤ים תִּֽהְיֶה֙ בְּ/ת֣וֹךְ הַ/יָּ֔ם כִּ֚י אֲנִ֣י דִבַּ֔רְתִּי נְאֻ֖ם אֲדֹנָ֣/י יְהוִ֑ה וְ/הָיְתָ֥ה לְ/בַ֖ז לַ/גּוֹיִֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/026/005.yaml
  text: She will become a place for spreading nets in the midst of the sea[a], for I have spoken, declares the Lord GOD, and she will become plunder for the nations.
translation:
  language: hi
  text: वह समुद्र के बीचोंबीच जाल फैलाने की जगह बन जाएगी[a], क्योंकि मैंने ही कहा है—प्रभु यहोवा की यह घोषणा है—और वह राष्ट्रों के लिए लूट बन जाएगी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मछली पकड़ने के जाल फैलाने का स्थान।”
    reason: מִשְׁטַח חֲרָמִים पदबंध को अधिक स्पष्ट रूप से मछली पकड़ने के जालों से जोड़ने वाला वैकल्पिक अनुवाद।
lexical_decisions:
- source_word: מִשְׁטַח חֲרָמִים
  choice: जाल फैलाने की जगह
  rationale: מִשְׁטַח किसी फैलाव-स्थल या फैली हुई सतह को दर्शाता है और חֲרָמִים जालों को। संयुक्त पदबंध का स्वाभाविक हिन्दी रूप मूल समुद्री बिंब को बनाए रखता है; जालों को सुखाने का उद्देश्य सम्भावित है, पर मूल पाठ में स्पष्ट नहीं है।
- source_word: בְּתוֹךְ הַיָּם
  choice: समुद्र के बीचोंबीच
  rationale: यह स्थानवाचक पदबंध समुद्र के मध्य होने का भाव देता है। ‘बीचोंबीच’ आधुनिक, सहज और भविष्यवाणी की गरिमा के अनुकूल है।
- source_word: כִּי אֲנִי דִבַּרְתִּי
  choice: क्योंकि मैंने ही कहा है
  rationale: כִּי कारण बताता है और स्वतंत्र सर्वनाम אֲנִי वक्ता पर बल देता है। ‘ही’ उस बल को हिन्दी में व्यक्त करता है; पूर्ण क्रिया को ‘कहा है’ स्वाभाविक रूप से प्रस्तुत करता है।
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: प्रभु यहोवा की यह घोषणा है
  rationale: נְאֻם भविष्यवाणी की प्रामाणिक घोषणा का सूत्र है। אֲדֹנָי को ‘प्रभु’ और יהוה को उसके पारंपरिक हिन्दी नाम-रूप ‘यहोवा’ से अलग-अलग व्यक्त किया गया है।
- source_word: וְהָיְתָה לְבַז לַגּוֹיִם
  choice: और वह राष्ट्रों के लिए लूट बन जाएगी
  rationale: לְבַז शत्रुओं के हाथ लगने वाली लूट को दर्शाता है और לַגּוֹיִם का सामान्य अर्थ ‘राष्ट्रों के लिए’ है। स्त्रीलिंग ‘वह’ सूर नगर के साहित्यिक व्यक्तिकरण को बनाए रखता है।
theological_decisions:
- issue: אֲדֹנָי יְהוִה में परमेश्वर के नाम का अनुवाद
  choice: प्रभु यहोवा
  alternative: प्रभु परमेश्वर
  rationale: मूल में सामान्य प्रभुता-सूचक אֲדֹנָי और विशिष्ट दिव्य नाम יהוה दोनों उपस्थित हैं। ‘प्रभु यहोवा’ इस भेद और नाम की पहचान को बनाए रखता है, जबकि ‘प्रभु परमेश्वर’ नाम को उपाधि में बदल देता।
- issue: सूर के लिए स्त्रीलिंग व्यक्तिकरण
  choice: वह ... बन जाएगी
  alternative: यह ... बन जाएगा
  rationale: दोनों इब्रानी क्रियाएँ स्त्रीलिंग एकवचन हैं और संदर्भ में सूर नगर को व्यक्तित्व प्रदान करती हैं। हिन्दी स्त्रीलिंग इस साहित्यिक विशेषता को सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण भविष्यवाणी-संबंधी शैली अपनाई गई है। वाक्य में मूल की पुनरावृत्ति और सूर के स्त्रीलिंग व्यक्तिकरण को बनाए रखा गया है; अनकहा उद्देश्य, जैसे जाल सुखाना, मुख्य पाठ में नहीं जोड़ा गया।
