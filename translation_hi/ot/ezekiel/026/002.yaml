  yaml_path: translation/ot/ezekiel/026/002.yaml
  text: Son of man[a], because Tyre said concerning Jerusalem, ‘Aha! The gateway of the peoples is broken; it has turned to me. I will be filled[b], now that she is laid waste,’
translation:
  language: hi
  text: “हे मनुष्य के पुत्र, क्योंकि सोर ने यरूशलेम के विषय में कहा, ‘अहा! जातियों का प्रवेश-द्वार[a] टूट गया है; वह मेरी ओर मुड़ गया है। अब जब वह उजाड़ हो गई है, तो मैं भर जाऊँगा[b],’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “जातियों के फाटक” अथवा “जातियों के किवाड़।” हिब्रू वाक्यांश संक्षिप्त है और यरूशलेम को अनेक जातियों के लिए प्रवेश-स्थान के रूप में चित्रित कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: अर्थात सोर को आशा थी कि यरूशलेम के पतन से व्यापार या आवागमन उसकी ओर मुड़ जाएगा और उसे लाभ होगा।
    reason: cultural_note
lexical_decisions:
- source_word: בֶּן אָדָם
  choice: हे मनुष्य के पुत्र
  rationale: यहेजकेल के लिए बार-बार प्रयुक्त संबोधन के हिब्रू मुहावरे को सुरक्षित रखता है और हिन्दी बाइबलीय भाषा में सहज पहचाना जाता है।
- source_word: יַעַן אֲשֶׁר
  choice: क्योंकि
  rationale: यह संयुक्त पद आने वाली भविष्यवाणी का कारण बताता है; आधुनिक हिन्दी में ‘क्योंकि’ इसका स्वाभाविक और सटीक रूप है।
- source_word: צֹר
  choice: सोर
  rationale: नगर के नाम का प्रचलित मानक हिन्दी रूप।
- source_word: עַל יְרוּשָׁלַם
  choice: यरूशलेम के विषय में
  rationale: कहने की क्रिया के साथ עַל का अर्थ ‘के विषय में’ हो सकता है। कथन का विद्वेष उसकी विषयवस्तु से स्पष्ट है, इसलिए मुख्य पाठ में ‘के विरुद्ध’ जोड़ना आवश्यक नहीं।
- source_word: הֶאָח
  choice: अहा!
  rationale: यह दुर्भावनापूर्ण प्रसन्नता और उपहास का उद्गार है; ‘अहा!’ उसके व्यंग्यपूर्ण स्वर को बनाए रखता है।
- source_word: נִשְׁבְּרָה
  choice: टूट गया है
  rationale: निफ़अल रूप निष्क्रिय तथा परिणामी भाव देता है; यह रूप वर्तमान परिणाम को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: דַּלְתוֹת הָעַמִּים
  choice: जाति-जाति के लोगों का प्रवेश-द्वार
  rationale: דַּלְתוֹת रूपतः बहुवचन ‘किवाड़/फाटक’ है, पर यहाँ सामूहिक रूप से नगर के प्रवेश-द्वार की छवि देता है। ‘जाति-जाति के लोग’ עַמִּים की बहुवचनीय व्यापकता को व्यक्त करता है।
- source_word: נָסֵבָּה אֵלַי
  choice: वह मेरी ओर मुड़ गया है
  rationale: क्रिया किसी लाभ, आवागमन या प्रवेश के सोर की ओर मुड़ आने की छवि बनाए रखती है; इसका व्यापारिक आशय मुख्य पाठ में अनावश्यक रूप से स्पष्ट नहीं किया गया।
- source_word: אִמָּלְאָה
  choice: मैं भर जाऊँगा
  rationale: सोर की समृद्धि और लाभ की आशा को ‘भरने’ के मूल रूपक सहित सुरक्षित रखता है।
- source_word: הָחֳרָבָה
  choice: अब जब वह उजाड़ हो गई है
  rationale: स्त्रीलिंग रूप यरूशलेम की ओर संकेत करता है। ‘उजाड़ हो गई है’ विनाश की परिणामी दशा बताता है; ‘अब जब’ प्रसंग में सोर की अपेक्षा और यरूशलेम के उजड़ने का संबंध स्वाभाविक रूप से व्यक्त करता है।
theological_decisions:
- issue: यरूशलेम के लिए דַּלְתוֹת הָעַמִּים की रूपकात्मक उपाधि
  choice: जाति-जाति के लोगों का प्रवेश-द्वार
  alternative: जाति-जाति के लोगों के फाटक / किवाड़
  rationale: हिब्रू पद संक्षिप्त और कुछ हद तक अस्पष्ट है। मुख्य पाठ में कार्यात्मक एकवचन ‘प्रवेश-द्वार’ छवि को समझने योग्य बनाता है, जबकि पादटिप्पणी औपचारिक बहुवचन विकल्पों को सुरक्षित रखती है और व्यापार अथवा सामरिक पहुँच में से किसी एक अर्थ को निर्णायक नहीं बनाती।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए स्पष्ट रखी गई है। ‘हे मनुष्य के पुत्र’ पुस्तक में दोहराए जाने वाले पारंपरिक संबोधन को बनाए रखता है। सोर के उपहासपूर्ण स्वर के लिए ‘अहा!’ और उसकी अपेक्षित समृद्धि के मूल रूपक के लिए ‘मैं भर जाऊँगा’ रखा गया है। पादटिप्पणी [a] को उसी पद के बाद रखा गया है जिसकी वैकल्पिक व्याख्या वह देती है।
