  text: עַתָּה֙ יֶחְרְד֣וּ הָֽ/אִיִּ֔ן י֖וֹם מַפַּלְתֵּ֑/ךְ וְ/נִבְהֲל֛וּ הָ/אִיִּ֥ים אֲשֶׁר בַּ/יָּ֖ם מִ/צֵּאתֵֽ/ךְ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/026/018.yaml
  text: Now the coastlands will tremble on the day of your downfall[b][a], and the islands that are in the sea will be terrified at your departure.
translation:
  language: hi
  text: अब तेरे पतन के दिन तटवर्ती प्रदेश[a] काँप उठेंगे, और समुद्र के द्वीप तेरे चले जाने पर[b] भयभीत हो जाएँगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “द्वीप”; इब्रानी शब्द אִיִּים का अर्थ द्वीप अथवा समुद्रतटीय प्रदेश हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से “तेरे निकलने से” या “तेरे निकलने पर”; संभवतः यह न्याय में सोर के मिट जाने की ओर संकेत करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: עַתָּה
  choice: अब
  rationale: यह कालवाचक क्रियाविशेषण सोर के पतन के तात्कालिक परिणाम को सामने लाता है; ‘अब’ स्वाभाविक और संक्षिप्त है।
- source_word: יֶחְרְדוּ
  choice: काँप उठेंगे
  rationale: חרד भय के कारण काँपने की शारीरिक और भावात्मक तीव्रता व्यक्त करता है; ‘काँप उठेंगे’ इसे सहज हिन्दी में बनाए रखता है।
- source_word: הָאִיִּן
  choice: तटवर्ती प्रदेश
  rationale: אִיִּים का अर्थ द्वीप या समुद्रतटीय भूभाग हो सकता है। पहले खंड में व्यापक समुद्री तटवर्ती क्षेत्रों का अर्थ प्रसंगानुकूल है, पर वैकल्पिक अर्थ पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: יוֹם מַפַּלְתֵּךְ
  choice: तेरे पतन के दिन
  rationale: यह सोर के विनाश का समय बताने वाला संबंध-पदबंध है; ‘पतन’ भविष्यद्वाणी के गंभीर न्याय-संदर्भ को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: וְנִבְהֲלוּ
  choice: भयभीत हो जाएँगे
  rationale: בהל का निफ़अल रूप घबरा जाने या आतंकित होने का भाव देता है। यह पहले खंड के काँपने से संबंधित, पर उससे भिन्न, आंतरिक भय को व्यक्त करता है।
- source_word: הָאִיִּים אֲשֶׁר בַּיָּם
  choice: समुद्र के द्वीप
  rationale: ‘जो समुद्र में हैं’ विशेषण के कारण यहाँ אִיִּים का अधिक ठोस अर्थ ‘द्वीप’ उपयुक्त है। हिन्दी में ‘समुद्र के द्वीप’ स्वाभाविक और संक्षिप्त है।
- source_word: מִצֵּאתֵךְ
  choice: तेरे चले जाने पर
  rationale: शाब्दिक अर्थ ‘तेरे निकलने/चले जाने से’ है। विनाश के संदर्भ में यह सोर के दृश्य से मिट जाने की ओर संकेत कर सकता है, किंतु अनुवाद मूल की रूपकात्मक अनिश्चितता को बनाए रखता है।
