  text: וְ/הִשְׁבַּתִּ֖י הֲמ֣וֹן שִׁירָ֑יִ/ךְ וְ/ק֣וֹל כִּנּוֹרַ֔יִ/ךְ לֹ֥א יִשָּׁמַ֖ע עֽוֹד׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/026/013.yaml
  text: And I will put an end to the noise of your songs[a], and the sound of your lyres will be heard no more.
translation:
  language: hi
  text: मैं तेरे गीतों का कोलाहल बंद कर दूँगा, और तेरी वीणाओं[a] की ध्वनि फिर कभी सुनाई न देगी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी शब्द כִּנּוֹר एक प्राचीन तार वाले वाद्य को दर्शाता है, जिसे प्रायः ‘लायर’ और कभी ‘हार्प’ कहा जाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִשְׁבַּתִּי
  choice: मैं ... बंद कर दूँगा
  rationale: שׁבת के हिफ़ील रूप का कारणवाचक अर्थ यहाँ किसी गतिविधि को समाप्त कर देना है। यह हिन्दी प्रयोग निर्णायक रूप से रुकवा देने का भाव स्वाभाविक ढंग से व्यक्त करता है।
- source_word: הֲמוֹן
  choice: कोलाहल
  rationale: गीतों के प्रसंग में यह शब्द जनसमूह की संख्या के बजाय उनकी ऊँची, गूँजती ध्वनि या चहल-पहल को सूचित करता है। ‘कोलाहल’ न्याय के प्रसंग और काव्यात्मक समानांतरता दोनों के अनुकूल है।
- source_word: שִׁירָיִךְ
  choice: तेरे गीतों
  rationale: यह सोर को संबोधित स्त्रीलिंग एकवचन संबंधसूचक प्रत्यय सहित बहुवचन संज्ञा है। ‘तेरे गीतों’ इसका सीधा और स्वाभाविक अनुवाद है।
- source_word: וְקוֹל
  choice: और ... की ध्वनि
  rationale: वाद्ययंत्रों के साथ קוֹל का अर्थ ‘आवाज़’ से अधिक स्वाभाविक रूप से ‘ध्वनि’ है।
- source_word: כִּנּוֹרַיִךְ
  choice: तेरी वीणाओं
  rationale: כִּנּוֹר एक प्राचीन तार वाला वाद्य था, जिसे सामान्यतः lyre और कभी harp कहा जाता है। ‘वीणा’ हिन्दी पाठक के लिए सुबोध निकटतम सामान्य पद है; पादटिप्पणी ऐतिहासिक वाद्य की अनिश्चित सटीक पहचान स्पष्ट करती है।
- source_word: לֹא יִשָּׁמַע עוֹד
  choice: फिर कभी सुनाई न देगी
  rationale: निफ़ाल रूप निष्क्रिय अर्थ ‘सुनाई देना’ व्यक्त करता है, और עוֹד के साथ उसका पूर्ण अंत—‘फिर कभी नहीं’—सूचित होता है।
