translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सहज रखी गई है। सोर नगर को इब्रानी में स्त्रीलिंग एकवचन में संबोधित किए जाने के कारण ‘तेरे/तेरी’ का प्रयोग किया गया है। ‘गीतों का कोलाहल’ मूल के कठोर न्याय-संदर्भ को बनाए रखता है; पादटिप्पणी का चिह्न अर्थानुसार वाद्य के बाद रखा गया है।
