base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/026/012.yaml
  text: They will plunder your wealth and loot your merchandise. They will tear down your walls and demolish your splendid houses. They will throw your stones[a], your timbers, and your dust into the midst of the waters.
translation:
  language: hi
  text: वे तेरी धन-संपत्ति लूट लेंगे और तेरे व्यापार का माल छीन लेंगे। वे तेरी शहरपनाह ढा देंगे और तेरे भव्य घरों को तोड़ डालेंगे। वे तेरे पत्थर, तेरी इमारती लकड़ी और तेरी मिट्टी[a] जल के बीचोंबीच डाल देंगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “तेरा मलबा।” यहाँ प्रयुक्त इब्रानी शब्द का अर्थ “धूल” या “मिट्टी” भी हो सकता है; इस प्रसंग में यह ढहाए गए नगर के मलबे को सूचित कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁלְלוּ
  choice: लूट लेंगे
  rationale: यह क्रिया युद्ध में माल लूटने को दर्शाती है; भविष्यकाल भविष्यवाणी के इस प्रसंग में स्वाभाविक है।
- source_word: חֵילֵךְ
  choice: तेरी धन-संपत्ति
  rationale: חַיִל के अर्थ बल, सेना या संपत्ति हो सकते हैं। सोर के व्यापार और अगले पदांश में व्यापार के माल के उल्लेख के कारण यहाँ आर्थिक अर्थ सबसे उपयुक्त है।
- source_word: וּבָזְזוּ
  choice: छीन लेंगे
  rationale: यह हिंसक ढंग से माल ले जाने का निकटार्थक शब्द है; इससे पहले प्रयुक्त 'लूट लेंगे' की अनावश्यक पुनरावृत्ति से बचते हुए बलपूर्वक हरण का भाव बना रहता है।
- source_word: רְכֻלָּתֵךְ
  choice: तेरे व्यापार का माल
  rationale: संज्ञा व्यापार अथवा व्यापारिक वस्तुओं को सूचित करती है। चूँकि इसे लूटा जा रहा है, इसलिए ठोस अर्थ 'व्यापार का माल' उपयुक्त है।
- source_word: חוֹמוֹתַיִךְ
  choice: तेरी शहरपनाह
  rationale: यह नगर की रक्षात्मक दीवारों का बहुवचन है; 'शहरपनाह' आधुनिक हिंदी में नगर की किलेबंदी को संक्षेप में व्यक्त करता है।
- source_word: בָתֵּי חֶמְדָּתֵךְ
  choice: तेरे भव्य घर
  rationale: शाब्दिक भाव मनोहर, वांछनीय या बहुमूल्य घरों का है; 'भव्य घर' समृद्ध और शानदार भवनों का आशय सहजता से देता है।
- source_word: יִתֹּצוּ
  choice: तोड़ डालेंगे
  rationale: נתץ भवनों को तोड़ने या ध्वस्त करने के लिए आता है; यह हिंदी में सजीव और स्वाभाविक है।
- source_word: עֵצַיִךְ
  choice: तेरी इमारती लकड़ी
  rationale: शब्द का मूल अर्थ लकड़ी है, पर पत्थरों और ढहाए गए भवनों के प्रसंग में निर्माण में प्रयुक्त लकड़ी अभिप्रेत है।
- source_word: עֲפָרֵךְ
  choice: तेरी मिट्टी
  rationale: עָפָר का सीधा अर्थ धूल या मिट्टी है। नगर-विनाश के प्रसंग में यह टूटे हुए पदार्थ अथवा मलबे की महीन सामग्री भी सूचित कर सकता है; मुख्य पाठ में निकटस्थ शाब्दिक अर्थ रखा गया है।
- source_word: בְּתוֹךְ מַיִם
  choice: जल के बीचोंबीच
  rationale: यह हिब्रू के 'जल के मध्य' और מַיִם के रूप को बनाए रखते हुए हिंदी में चित्रात्मक तथा गरिमापूर्ण है।
