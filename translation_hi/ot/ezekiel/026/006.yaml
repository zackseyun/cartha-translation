base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/026/006.yaml
  text: And her daughters who are in the field will be killed by the sword[b][a], and they will know that I am Yahweh.
translation:
  language: hi
  text: और उसकी बेटियाँ[a], जो मैदान में हैं[b], तलवार से मारी जाएँगी, और वे जान लेंगे कि मैं याहवे हूँ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उसके अधीन नगर” अथवा “उसके गाँव”; अर्थात् सूर के अधीन बस्तियाँ।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक अर्थ “मैदान में”; संभवतः मुख्यभूमि पर या ग्रामीण क्षेत्र में स्थित बस्तियों की ओर संकेत है।
    reason: cultural_note
lexical_decisions:
- source_word: וּבְנוֹתֶיהָ
  choice: और उसकी बेटियाँ
  rationale: शाब्दिक रूप ‘उसकी बेटियाँ’ है। नगर-संबंधी भविष्यवाणी में यह मातृ-नगर के अधीन बस्तियों को सूचित कर सकता है; मुख्य पाठ में इब्रानी रूपक रखा गया है और अर्थ-संभावना पादटिप्पणी में दी गई है।
- source_word: אֲשֶׁר בַּשָּׂדֶה
  choice: जो मैदान में हैं
  rationale: यह इब्रानी वाक्यांश का सीधा और स्वाभाविक हिन्दी रूप है। सूर के संदर्भ में इससे संभवतः द्वीपीय नगर के विपरीत मुख्यभूमि या ग्रामीण क्षेत्र की बस्तियाँ अभिप्रेत हैं।
- source_word: בַּחֶרֶב
  choice: तलवार से
  rationale: यह युद्ध में हिंसक मृत्यु का सामान्य इब्रानी मुहावरा है; ‘तलवार से’ साधनवाचक अर्थ को स्पष्ट रूप से व्यक्त करता है।
- source_word: תֵּהָרַגְנָה
  choice: मार डाली जाएँगी
  rationale: निफ़अल अपूर्ण, स्त्रीलिंग बहुवचन का कर्मवाच्य भाव सुरक्षित है। यह आधुनिक हिन्दी में स्पष्ट है और ‘बेटियाँ’ के साथ व्याकरणिक सामंजस्य रखता है।
- source_word: וְיָדְעוּ
  choice: तब वे जान लेंगी
  rationale: यहाँ परिणामसूचक संबंध को स्वाभाविक हिन्दी में ‘तब’ से व्यक्त किया गया है। ‘जान लेंगी’ भविष्य में निर्णायक पहचान के भाव को दर्शाता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत नाम के चार इब्रानी अक्षरों का हिन्दी लिप्यंतरण किया गया है; उसके स्थान पर कोई उपाधि नहीं रखी गई।
theological_decisions:
- issue: सूर की ‘बेटियों’ का आशय
  choice: मुख्य पाठ में शाब्दिक रूपक ‘उसकी बेटियाँ’ रखा गया है; पादटिप्पणी में सूर के अधीन नगरों या बस्तियों का संभावित अर्थ बताया गया है।
  alternative: इसे सीधे ‘उसके अधीन नगर’ या ‘उसके गाँव’ अनूदित करना।
  rationale: नगरों की मातृ-नगर और बेटियों के रूप में कल्पना इब्रानी भविष्यवाणी में प्रचलित है। शाब्दिक रूपक और उसका भौगोलिक आशय दोनों सुरक्षित रखने से वास्तविक अर्थगत तनाव बना रहता है।
- issue: ‘मैदान में’ का भौगोलिक संकेत
  choice: मुख्य पाठ में ‘मैदान में’ रखा गया है।
  alternative: ‘मुख्यभूमि पर’ या ‘ग्रामीण क्षेत्र में’।
  rationale: मूल वाक्यांश सामान्यतः ‘मैदान में’ है, जबकि सूर के विशेष संदर्भ में मुख्यभूमि की बस्तियाँ संभावित आशय हैं। अनिश्चितता को पादटिप्पणी में स्पष्ट किया गया है, मुख्य पाठ में हल नहीं किया गया।
- issue: ईश्वरीय नाम יְהוָה का रूप
  choice: याहवे
  alternative: यहोवा या प्रभु
  rationale: मूल पाठ में व्यक्तिगत नाम है। ‘याहवे’ उसे उपाधि से प्रतिस्थापित किए बिना हिन्दी में प्रस्तुत करता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का स्पष्ट, गरिमापूर्ण और सामान्य पाठक के लिए सहज रूप अपनाया गया है। ‘बेटियाँ’ और ‘मैदान में’ जैसे मूल रूपकों को मुख्य पाठ में बनाए रखकर आवश्यक व्याख्या पादटिप्पणियों में दी गई है।
