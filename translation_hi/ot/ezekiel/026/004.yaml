  text: וְ/שִׁחֲת֞וּ חֹמ֣וֹת צֹ֗ר וְ/הָֽרְסוּ֙ מִגְדָּלֶ֔י/הָ וְ/סִֽחֵיתִ֥י עֲפָרָ֖/הּ מִמֶּ֑/נָּה וְ/נָתַתִּ֥י אוֹתָ֖/הּ לִ/צְחִ֥יחַ סָֽלַע׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/026/004.yaml
  text: They will destroy the walls of Tyre and tear down her towers[a], and I will scrape her dust away from her and make her a bare rock.
translation:
  language: hi
  text: वे सोर की नगर-दीवारों को नष्ट कर देंगे और उसकी मीनारें ढा देंगे। मैं उसकी मिट्टी[a] को उस पर से खुरच डालूँगा और उसे नंगी चट्टान बना दूँगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उसकी धूल”; इब्रानी शब्द עָפָר का अर्थ धूल, भुरभुरी धरती या मिट्टी हो सकता है। यहाँ भाव यह है कि नगर को चट्टान तक पूरी तरह उघाड़ दिया जाएगा।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשִׁחֲתוּ
  choice: नष्ट कर देंगे
  rationale: שׁחת यहाँ घेराबंदी में नगर की सुरक्षा-दीवारों को बरबाद करने का बोध देता है; ‘नष्ट कर देंगे’ स्पष्ट और स्वाभाविक है।
- source_word: חֹמוֹת צֹר
  choice: सोर की शहरपनाहों
  rationale: חֹמוֹת नगर की किलेबंद दीवारें हैं। ‘शहरपनाह’ आधुनिक हिन्दी में सामान्य ‘दीवार’ से अधिक स्पष्ट रूप से रक्षात्मक नगर-दीवार को व्यक्त करता है; צֹר का प्रचलित हिन्दी रूप ‘सोर’ है।
- source_word: וְהָרְסוּ מִגְדָּלֶיהָ
  choice: उसकी मीनारें ढा देंगे
  rationale: הרס संरचनाओं को गिराने या ढाने के लिए प्रयुक्त होता है और מִגְדָּלִים का ठोस अर्थ ‘मीनारें’ है।
- source_word: וְסִחֵיתִי
  choice: मैं ... खुरच डालूँगा
  rationale: यह क्रिया सतह पर की सामग्री को हटाकर नीचे की चट्टान उजागर करने का चित्र देती है; ‘खुरच डालूँगा’ उस तीव्र और पूर्ण निष्कासन को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: עֲפָרָהּ מִמֶּנָּה
  choice: उसकी मिट्टी उस पर से
  rationale: עָפָר धूल, भुरभुरी मिट्टी या धरती हो सकता है। प्रसंग में नगर-स्थल की ऊपरी मिट्टी हटाने का चित्र होने से ‘मिट्टी’ चुना गया; מִמֶּנָּה को ‘उस पर से’ हटाए जाने के स्थान के रूप में व्यक्त करता है।
- source_word: וְנָתַתִּי אוֹתָהּ לִצְחִיחַ סָלַע
  choice: उसे नंगी चट्टान बना दूँगा
  rationale: נתן यहाँ परिणामी अवस्था बनाना व्यक्त करता है, और צְחִיחַ סָלַע ऐसी खुली, मिट्टी-विहीन चट्टानी सतह है; ‘नंगी चट्टान’ उजाड़ और पूरी तरह उघड़ी अवस्था का सजीव चित्र रखता है।
