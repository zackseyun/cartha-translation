base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/026/007.yaml
  text: 'For thus says the Lord GOD: Behold[a], I am bringing against Tyre Nebuchadnezzar king of Babylon from the north, king of kings, with horses and chariots and horsemen, and an assembly and a numerous people.'
translation:
  language: hi
  text: 'क्योंकि प्रभु याहवे यों कहता है: देख, मैं उत्तर दिशा से बाबेल के राजा नबूकदरेस्सर[a] को सोर के विरुद्ध ला रहा हूँ—राजाओं का राजा—घोड़ों, रथों, घुड़सवारों, एक दल और बहुत-से लोगों के साथ।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ हिब्रू वर्तनी ‘नबूकदरेस्सर’ के अधिक निकट है; हिन्दी में ‘नबूकदनेस्सर’ रूप भी प्रचलित है।
    reason: lexical_alternative
