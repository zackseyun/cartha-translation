source:
  edition: WLC
  text: וּ/נְתַתִּ֞י/ךְ לִ/צְחִ֣יחַ סֶ֗לַע מִשְׁטַ֤ח חֲרָמִים֙ תִּֽהְיֶ֔ה לֹ֥א תִבָּנֶ֖ה ע֑וֹד כִּ֣י אֲנִ֤י יְהוָה֙ דִּבַּ֔רְתִּי נְאֻ֖ם אֲדֹנָ֥/י יְהוִֽה׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/026/014.yaml
  text: I will make you a bare rock[a], a place for spreading nets. You will not be rebuilt again, for I, Yahweh, have spoken[b], declares the Lord GOD.
translation:
  language: hi
  text: मैं तुझे नंगी चट्टान[a] बना दूँगा। तू मछली पकड़ने के जाल फैलाने की जगह होगी। तेरा फिर से निर्माण नहीं किया जाएगा, क्योंकि मैं, याहवे, बोल चुका हूँ—प्रभु याहवे की यह घोषणा है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “सूखी चट्टान” अथवा “खुली चट्टानी सतह।” इब्रानी शब्द ऐसी चट्टान का बोध कराता है जिससे मिट्टी और आवरण हटा दिया गया हो।
    reason: lexical_alternative
lexical_decisions:
- source_word: וּנְתַתִּיךְ
  choice: मैं तुझे ... बना दूँगा
  rationale: נתן के साथ विधेय पूरक यहाँ सूर को किसी दशा में पहुँचा देने का भाव व्यक्त करता है; हिन्दी में ‘बना दूँगा’ स्वाभाविक और अर्थ-सटीक है।
- source_word: לִצְחִיחַ סֶלַע
  choice: नंगी चट्टान
  rationale: צְחִיחַ यहाँ मिट्टी और आवरण से रहित, उजड़ी हुई चट्टानी सतह का चित्र देता है। ‘नंगी चट्टान’ उस ठोस और विनाशकारी बिंब को सहज हिन्दी में बनाए रखता है।
- source_word: מִשְׁטַח חֲרָמִים
  choice: मछली पकड़ने के जाल फैलाने की जगह
  rationale: מִשְׁטַח फैलाने की सतह या स्थान है और חֲרָמִים प्रसंग में मछली पकड़ने के जाल हैं। स्पष्टता के लिए ‘मछली पकड़ने के’ जोड़ा गया है।
- source_word: לֹא תִבָּנֶה עוֹד
  choice: तेरा फिर से निर्माण नहीं किया जाएगा
  rationale: בנה का निफ़अल रूप निष्क्रिय अर्थ ‘बनाया/निर्मित किया जाना’ देता है और עוֹד का अर्थ ‘फिर से’ है। यह रूप सूर नगर को किए गए सीधे संबोधन को हिन्दी में स्वाभाविक रखता है।
- source_word: כִּי אֲנִי יְהוָה דִּבַּרְתִּי
  choice: क्योंकि मुझ याहवे ने यह कहा है
  rationale: כִּי कारण बताता है और पूर्ण क्रिया דִּבַּרְתִּי परमेश्वर के कहे वचन की निश्चितता पर बल देती है। ‘मुझ याहवे ने’ मूल के אֲנִי पर पड़े बल को व्यक्त करता है।
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: यह प्रभु याहवे की घोषणा है
  rationale: נְאֻם भविष्यद्वाणी की प्रामाणिक घोषणा का सूत्र है। ‘प्रभु याहवे’ אֲדֹנָי और יְהוִה दोनों को अलग-अलग सुरक्षित रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में वाचा का व्यक्तिगत नाम YHWH है। ‘याहवे’ उसका प्रचलित विद्वत्तापूर्ण उच्चारण-सन्निकटन है और उसे सामान्य उपाधि ‘प्रभु’ में बदलता नहीं है।
- issue: अंतिम उपाधि אֲדֹנָי יְהוִה
  choice: प्रभु याहवे
  alternative: प्रभु परमेश्वर; प्रभु यहोवा
  rationale: यह रूप इब्रानी की उपाधि אֲדֹנָי और व्यक्तिगत नाम יְהוִה, दोनों को दृश्यमान रखता है और ‘प्रभु प्रभु’ जैसी अस्पष्ट पुनरुक्ति से बचता है।
- issue: सूर के दोबारा न बनाए जाने की घोषणा
  choice: तेरा फिर से निर्माण नहीं किया जाएगा
  alternative: तू फिर कभी नहीं बसाई जाएगी
  rationale: मूल क्रिया निर्माण की है, बसाने की नहीं। עוֹד को ‘फिर से’ के रूप में रखा गया है ताकि पाठ के कथन को न तो कमजोर किया जाए, न उससे अधिक विस्तृत ऐतिहासिक दावा जोड़ा जाए।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सीधी रखी गई है। सूर को एक नगर के रूप में संबोधित करने वाली मूल की काव्यात्मक व्यक्तिवाचकता सुरक्षित है। ‘मछली पकड़ने के’ अर्थ-स्पष्टता के लिए जोड़ा गया है; शेष चित्रात्मक भाषा यथासंभव ठोस रखी गई है।
