base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/026/011.yaml
  text: With the hoofs of his horses he will trample all your streets[a]; he will kill your people with the sword[b], and the pillars of your strength will come down to the ground.
translation:
  language: hi
  text: उसके घोड़ों के खुरों से वह तुम्हारी सारी सड़कों[a] को रौंद डालेगा; वह तुम्हारे लोगों को तलवार से मार डालेगा, और तुम्हारी शक्ति के स्तंभ[b] धरती पर गिर पड़ेंगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “तुम्हारे सारे खुले स्थानों” अथवा “तुम्हारे सारे चौकों।”
    reason: lexical_alternative
  - marker: b
    text: या “तुम्हारी शक्ति के स्मारक।” इब्रानी शब्द उन प्रमुख स्तंभों, खड़े पत्थरों या स्मारकों को सूचित कर सकता है जो सोर की शक्ति से जुड़े थे।
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּפַרְסוֹת סוּסָיו
  choice: उसके घोड़ों के खुरों से
  rationale: בְּ साधन का बोध कराता है; यह वाक्यांश स्वाभाविक हिन्दी में बताता है कि रौंदना घोड़ों के खुरों द्वारा होगा।
- source_word: יִרְמֹס
  choice: रौंद डालेगा
  rationale: רמס का मूल चित्र पैरों तले रौंदने का है। ‘डालेगा’ सैन्य विनाश की पूर्णता को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: כָּל חוּצוֹתָיִךְ
  choice: तुम्हारी सारी सड़कों
  rationale: חוּצוֹת नगर की सड़कों, खुले स्थानों या चौकों को सूचित कर सकता है। घुड़सवार आक्रमण के संदर्भ में ‘सड़कें’ सबसे सहज व्यापक अर्थ है; अन्य संभावनाएँ पादटिप्पणी में सुरक्षित हैं।
- source_word: עַמֵּךְ
  choice: तुम्हारे लोगों
  rationale: עַם यहाँ नगर के निवासियों या लोगों को सीधे सूचित करता है।
- source_word: בַּחֶרֶב יַהֲרֹג
  choice: तलवार से मार डालेगा
  rationale: यह युद्ध में तलवार द्वारा हत्या का ठोस चित्र बनाए रखता है और आधुनिक हिन्दी में स्वाभाविक है।
- source_word: וּמַצְּבוֹת עֻזֵּךְ
  choice: और तुम्हारी शक्ति के स्तंभ
  rationale: מַצֵּבוֹת का अर्थ खड़े पत्थर, स्तंभ या स्मारक हो सकता है। ‘शक्ति के स्तंभ’ रूपक और मूल की अनिश्चितता को अत्यधिक व्याख्या किए बिना बनाए रखता है।
- source_word: לָאָרֶץ תֵּרֵד
  choice: धरती पर गिर पड़ेंगे
  rationale: शाब्दिक अर्थ ‘धरती की ओर नीचे उतरेंगे’ है; विनाश के प्रसंग में ‘धरती पर गिर पड़ेंगे’ स्वाभाविक हिन्दी है और ढहने का चित्र स्पष्ट करता है।
