base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/026/017.yaml
  text: They will raise a lament over you and say to you[a], ‘How you have perished, you who were inhabited from the seas, the praised city, which was strong in the sea, she and her inhabitants[c][b], who imposed their terror on all her inhabitants.’
translation:
  language: hi
  text: वे तेरे विषय में विलाप उठाएँगे और तुझसे कहेंगे, ‘हाय! तू कैसे नष्ट हो गई—तू, जो समुद्रों से आबाद थी,[a] वह प्रशंसित नगर,[b] जो समुद्र में शक्तिशाली था—वह और उसके निवासी, जिन्होंने उसके सभी निवासियों पर अपना आतंक थोप दिया था![c]’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से ‘समुद्रों से आबाद’। यह कठिन पदबंध समुद्री क्षेत्रों से बसाए जाने या वहाँ से आपूर्ति पाने का संकेत दे सकता है; कुछ अनुवाद इसे अधिक व्याख्यात्मक रूप में ‘समुद्र के प्रवेश पर बसी’ कहते हैं।
    reason: lexical_alternative
  - marker: b
    text: या ‘विख्यात नगर’ अथवा ‘यशस्वी नगर’।
    reason: lexical_alternative
  - marker: c
    text: इब्रानी में शाब्दिक रूप से ‘अपना आतंक दिया’। ‘उसके सभी निवासियों’ में ‘उसके’ का संदर्भ कठिन है; इब्रानी पाठ में यह स्त्रीलिंग प्रत्यय है और इसे निश्चित रूप से समुद्र या किसी बाहरी समुद्री क्षेत्र के निवासियों के लिए नहीं कहा गया है।
    reason: textual_ambiguity
lexical_decisions:
- source_word: וְנָשְׂאוּ ... קִינָה
  choice: विलाप का गीत उठाएँगे
  rationale: נשׂא + קינה विलाप आरम्भ करने या गाने का मुहावरा है। ‘विलाप का गीत उठाना’ काव्यात्मक रूपक और हिन्दी की स्वाभाविकता दोनों बनाए रखता है।
- source_word: אָבַדְתְּ
  choice: तू कैसे नष्ट हो गई
  rationale: אבד विनाश या मिट जाने को दर्शाता है; स्त्रीलिंग ‘गई’ नगर सूर की काव्यात्मक मानवीकरण-शैली को सुरक्षित रखता है।
- source_word: נוֹשֶׁבֶת מִיַּמִּים
  choice: जो समुद्रों से आबाद थी
  rationale: कठिन मसोरेटी पदबंध में ישׁב का निष्क्रिय कृदन्त और बहुवचन יַמִּים के साथ מִן है। निकटस्थ अर्थ को रखते हुए इसे अस्पष्ट ही रहने दिया गया है; इसका आशय समुद्री क्षेत्रों से बसाया या आपूर्ति किया जाना हो सकता है।
- source_word: הָעִיר הַהֻלָּלָה
  choice: वह प्रशंसित नगर
  rationale: הלל का निष्क्रिय रूप यहाँ ‘जिसकी प्रशंसा की गई’ का भाव देता है। ‘प्रशंसित’ मूल के निकट है; ‘विख्यात’ अधिक व्याख्यात्मक विकल्प है।
- source_word: חֲזָקָה בַיָּם
  choice: समुद्र में शक्तिशाली था
  rationale: חזק को ‘शक्तिशाली’ और בַיָּם को सीधे ‘समुद्र में’ कहा गया है, जिससे सूर की समुद्री शक्ति और मूल पूर्वसर्ग दोनों बने रहते हैं।
- source_word: הִיא וְיֹשְׁבֶיהָ
  choice: वह और उसके निवासी
  rationale: हिन्दी में ‘नगर’ व्याकरणतः पुल्लिंग है, इसलिए अस्वाभाविक स्त्रीलिंग सर्वनाम थोपे बिना, दूसरे पुरुष के स्त्रीलिंग क्रियारूप ‘हो गई/थी’ में इब्रानी मानवीकरण सुरक्षित रखा गया है।
- source_word: נָתְנוּ חִתִּיתָם
  choice: अपना आतंक फैला रखा था
  rationale: נתן + חִתִּית का आशय दूसरों में भय उत्पन्न करना है। यह हिन्दी में स्वाभाविक है और जारी प्रभाव का भाव देता है।
- source_word: לְכָל יוֹשְׁבֶיהָ
  choice: समुद्र के सभी निवासियों में
  rationale: शाब्दिक प्रत्यय ‘उसके/उसकी’ संदर्भतः कठिन है और ऐसा लग सकता है कि सूर ने अपने ही नागरिकों को आतंकित किया। समुद्री संदर्भ में इसे ‘समुद्र के सभी निवासियों’ के रूप में स्पष्ट किया गया है, जबकि टिप्पणी में पाठगत कठिनाई दर्ज है।
theological_decisions:
- issue: सूर नगर का मानवीकरण
  choice: सूर को सीधे ‘तू’ कहकर स्त्रीलिंग क्रियारूपों में संबोधित करना, पर ‘नगर’ के साथ स्वाभाविक हिन्दी पुल्लिंग रखना
  alternative: हर सर्वनाम और विशेषण को स्त्रीलिंग करके ‘वह और उसकी निवासी’ जैसी रचना करना
  rationale: इब्रानी में עִיר स्त्रीलिंग है और भविष्यद्वाणी का विलाप नगर को व्यक्ति बनाकर संबोधित करता है। आधुनिक हिन्दी में ‘नगर’ पुल्लिंग है; अतः संबोधन और स्त्रीलिंग क्रियाएँ काव्यात्मक मानवीकरण बचाती हैं, जबकि संज्ञा-सामंजस्य स्वाभाविक रहता है।
- issue: अंतिम प्रत्यय का संदर्भ
  choice: ‘समुद्र के सभी निवासियों’ के रूप में व्यापक समुद्री समुदाय समझना
  alternative: ‘उसके सभी निवासियों’ का अत्यंत शाब्दिक अनुवाद, जिससे सूर के अपने निवासियों का अर्थ निकल सकता है
  rationale: इब्रानी पाठ का स्त्रीलिंग प्रत्यय औपचारिक रूप से निकटवर्ती नगर से जुड़ सकता है, पर इससे प्रसंगगत कठिनाई पैदा होती है। समुद्री क्षेत्र के निवासियों का अर्थ विलाप और सूर की बाहरी प्रतिष्ठा के अनुरूप है; इसे निश्चित सिद्धान्त नहीं बनाया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण भविष्यद्वाणी-काव्य का स्वर रखा गया है। ‘हाय!’ विलापसूचक אֵיךְ की भावात्मक शक्ति व्यक्त करता है। वाक्य में डैश द्वारा संबोधनात्मक उपपद स्पष्ट किए गए हैं। सभी पादटिप्पणी-चिह्न मुख्य पाठ में क्रमशः उपस्थित हैं।
