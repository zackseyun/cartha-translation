source:
  edition: WLC
  text: בַּלָּה֥וֹת אֶתְּנֵ֖/ךְ וְ/אֵינֵ֑/ךְ וּֽ/תְבֻקְשִׁ֗י וְ/לֹֽא תִמָּצְאִ֥י עוֹד֙ לְ/עוֹלָ֔ם נְאֻ֖ם אֲדֹנָ֥/י יְהֹוִֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/026/021.yaml
  text: I will make you a terror[a], and you will be no more. Though you are sought, you will never again be found[b], declares the Lord GOD.
translation:
  language: hi
  text: “मैं तुझे भय का कारण बना दूँगा, और तू नहीं रहेगी। तुझे ढूँढ़ा जाएगा[a], पर तू फिर कभी नहीं मिलेगी,” प्रभु याहवे की यह घोषणा है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “चाहे तुझे ढूँढ़ा जाए, फिर भी तू फिर कभी नहीं मिलेगी।” इब्रानी में इन जुड़े हुए भविष्यकालीन वाक्यों को साधारण समन्वय के रूप में या भावार्थतः रियायती संबंध के रूप में समझा जा सकता है।
    reason: syntactic_ambiguity
lexical_decisions:
- source_word: בַּלָּהוֹת אֶתְּנֵךְ
  choice: मैं तुझे आतंक का विषय बना दूँगा
  rationale: בַּלָּהוֹת बहुवचन रूप में होते हुए यहाँ भाववाचक अथवा तीव्र अर्थ दे सकता है, और נתן विधेय संज्ञा के साथ ‘बना देना’ का अर्थ देता है। ‘आतंक का विषय’ सोर को दूसरों के लिए भयावह दृश्य या उदाहरण बनाए जाने का भाव स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וְאֵינֵךְ
  choice: और तू नहीं रहेगी
  rationale: यह नकारात्मक निर्वाचक वाक्यांश सोर के अस्तित्व या उपस्थिति के समाप्त हो जाने को व्यक्त करता है। स्त्रीलिंग एकवचन ‘तू’ नगर से सीधे संबोधन को बनाए रखता है।
- source_word: וּתְבֻקְשִׁי
  choice: तुझे ढूँढ़ा जाएगा
  rationale: पुअल अपूर्ण क्रिया का भविष्यकालीन कर्मवाच्य अर्थ सीधे रखा गया है और ढूँढ़ने वालों की पहचान अनिर्दिष्ट छोड़ी गई है।
- source_word: וְלֹא תִמָּצְאִי עוֹד לְעוֹלָם
  choice: पर तू फिर कभी नहीं मिलेगी
  rationale: निफ़अल का कर्मवाच्य ‘मिलना’ रखा गया है। ‘फिर कभी नहीं’ עוֹד לְעוֹלָם की स्थायी और पूर्ण निषेधात्मक शक्ति को सहज हिन्दी में व्यक्त करता है।
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: प्रभु याहवे की यह घोषणा है
  rationale: נְאֻם को प्रामाणिक भविष्यद्वक्तीय सूत्र ‘घोषणा’ से व्यक्त किया गया है। אֲדֹנָי को ‘प्रभु’ और परमेश्वर के व्यक्तिगत नाम יהוה को ‘याहवे’ रखा गया है।
theological_decisions:
- issue: अदोनाय और दिव्य नाम יהוה के संयुक्त पद का अनुवाद
  choice: प्रभु याहवे
  alternative: प्रभु परमेश्वर
  rationale: ‘प्रभु याहवे’ दोनों इब्रानी पदों को अलग-अलग पहचान देता है और दिव्य नाम को सामान्य उपाधि में विलीन नहीं करता।
- issue: सोर के फिर न पाए जाने की स्थायिता
  choice: फिर कभी नहीं मिलेगी
  alternative: फिर सदा तक नहीं मिलेगी
  rationale: עֹוד और לְעוֹלָם की संयुक्त तीव्रता को ‘फिर कभी नहीं’ स्वाभाविक हिन्दी में पूर्ण स्थायिता के साथ व्यक्त करता है; अधिक शब्दशः विकल्प हिन्दी में अनावश्यक पुनरुक्ति लगेगा।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। नगर सोर को स्त्रीलिंग एकवचन में सीधे संबोधित करने के कारण ‘तू’ का प्रयोग मूल के निकट है; संदर्भ में यह अपमानसूचक नहीं, बल्कि काव्यात्मक प्रत्यक्ष संबोधन है।
