  text: מִ/שִּׁפְעַ֥ת סוּסָ֖י/ו יְכַסֵּ֣/ךְ אֲבָקָ֑/ם מִ/קּוֹל֩ פָּרַ֨שׁ וְ/גַלְגַּ֜ל וָ/רֶ֗כֶב תִּרְעַ֨שְׁנָה֙ חֽוֹמוֹתַ֔יִ/ךְ בְּ/בֹא/וֹ֙ בִּ/שְׁעָרַ֔יִ/ךְ כִּ/מְבוֹאֵ֖י עִ֥יר מְבֻקָּעָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/026/010.yaml
  text: From the abundance of his horses their dust will cover you[a]; at the sound of horsemen and wheel and chariot your walls will quake when he enters your gates[b], as one enters a city that has been breached.
translation:
  language: hi
  text: उसके घोड़ों की बहुतायत से उनकी धूल तुझे ढक लेगी। घुड़सवारों, पहियों और रथों की आवाज़ से तेरी दीवारें काँप उठेंगी, जब वह तेरे फाटकों से प्रवेश करेगा, जैसे किसी ऐसे नगर में प्रवेश किया जाता है जिसमें सेंध लग चुकी हो।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी का शाब्दिक रूप है, “सेंध लगाए गए नगर के प्रवेश-मार्गों के समान।” यहाँ आशय ऐसे नगर में प्रवेश करने की रीति है।
    reason: मूल के कठिन बहुवचन מְבוֹאֵי (‘प्रवेश-मार्ग/प्रवेश’) और उपमा की कुछ हद तक अस्पष्ट रचना को स्पष्ट करना।
lexical_decisions:
- source_word: מִשִּׁפְעַת סוּסָיו
  choice: उसके घोड़ों की बहुतायत से
  rationale: שִׁפְעָה का अर्थ बहुतायत या प्रचुरता है; מִן यहाँ धूल छाने के कारण या स्रोत को व्यक्त करता है।
- source_word: יְכַסֵּךְ אֲבָקָם
  choice: उनकी उड़ाई हुई धूल तुझे ढक लेगी
  rationale: כסה के स्पष्ट अर्थ ‘ढकना’ को रखा गया है। ‘उड़ाई हुई’ हिंदी में यह स्पष्ट करता है कि घोड़ों की बहुतायत से धूल उठ रही है, यद्यपि मूल में केवल ‘उनकी धूल’ है।
- source_word: מִקּוֹל פָּרַשׁ וְגַלְגַּל וָרֶכֶב
  choice: घुड़सवारों, पहियों और रथों की आवाज़ से
  rationale: קוֹל को सैन्य दल के सम्मिलित शोर के रूप में ‘आवाज़’ कहा गया है। मूल के एकवचन रूप सामूहिक अर्थ रखते हैं; स्वाभाविक हिंदी के लिए बहुवचन उपयुक्त हैं।
- source_word: תִּרְעַשְׁנָה חוֹמוֹתַיִךְ
  choice: तेरी शहरपनाहें काँप उठेंगी
  rationale: רעשׁ तीव्र हिलने या काँपने को दर्शाता है। חוֹמוֹת यहाँ किलेबंद नगर की बाहरी दीवारें हैं, इसलिए ‘शहरपनाहें’ सटीक और प्रसंगानुकूल है।
- source_word: בְּבֹאוֹ בִּשְׁעָרַיִךְ
  choice: जब वह तेरे फाटकों में प्रवेश करेगा
  rationale: पूर्वसर्ग सहित क्रियार्थक संज्ञा का स्वाभाविक कालवाचक अर्थ ‘जब वह प्रवेश करेगा’ है; एकवचन प्रत्यय हमलावर राजा की ओर संकेत करता है।
- source_word: כִּמְבוֹאֵי עִיר מְבֻקָּעָה
  choice: मानो किसी ऐसे नगर में प्रवेश कर रहा हो जिसमें सेंध लग चुकी हो
  rationale: מְבֻקָּעָה उस नगर को बताता है जिसकी सुरक्षा तोड़कर उसमें सेंध लगाई गई है। कठिन बहुवचन מְבוֹאֵי का आशय उपमा में प्रवेश की रीति से है; मुख्य पाठ में इसे सहज हिंदी में व्यक्त किया और शाब्दिक रूप पादटिप्पणी में सुरक्षित रखा गया है।
