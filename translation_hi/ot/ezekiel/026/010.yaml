translation_notes:
  register: आधुनिक, गरिमापूर्ण और कथात्मक हिंदी अपनाई गई है। सूर नगर को सीधे संबोधन के कारण ‘तुझे/तेरी’ रखा गया है। ‘शहरपनाह’ किलेबंद नगर की दीवार के लिए प्रचलित साहित्यिक शब्द है, पर वाक्य-विन्यास सामान्य पाठक के लिए सरल रखा गया है।
