  text: כֹּ֥ה אָמַ֛ר אֲדֹנָ֥/י יְהוִ֖ה לְ/צ֑וֹר הֲ/לֹ֣א מִ/קּ֣וֹל מַפַּלְתֵּ֗/ךְ בֶּ/אֱנֹ֨ק חָלָ֜ל בֵּ/הָ֤רֵֽג הֶ֨רֶג֙ בְּ/תוֹכֵ֔/ךְ יִרְעֲשׁ֖וּ הָ/אִיִּֽים׀׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/026/015.yaml
  text: 'Thus says the Lord GOD to Tyre: Will not the coastlands quake at the sound of your fall[a], when the wounded groan[b], when the slaughter is carried out in your midst?'
translation:
  language: hi
  text: 'प्रभु यहोवा सोर से यों कहता है: क्या तेरे पतन की आवाज़ पर, जब घायल कराहेंगे[b], और जब तेरे बीच घोर मार-काट होगी, समुद्रतटीय प्रदेश[a] थरथरा नहीं उठेंगे?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “द्वीप।” इब्रानी शब्द द्वीपों अथवा अधिक व्यापक रूप से समुद्रतटीय क्षेत्रों को दर्शा सकता है।
    reason: lexical_alternative
  - marker: b
    text: “घायल” का अनुवाद “मारे गए” या “घातक रूप से घायल” भी हो सकता है। यहाँ कराहने के उल्लेख के कारण “घायल” मुख्य पाठ में रखा गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  choice: प्रभु यहोवा
  rationale: संयुक्त ईश्वरीय उपाधि में אֲדֹנָי को ‘प्रभु’ और वाचा के नाम יהוה को प्रचलित हिन्दी रूप ‘यहोवा’ से व्यक्त किया गया है; इससे दोनों तत्व स्पष्ट रहते हैं।
- source_word: לְצוֹר
  choice: सोर से
  rationale: לְ यहाँ संबोधन/वचन के लक्ष्य को दर्शाता है। ‘सोर’ इस नगर का मानक हिन्दी बाइबलीय नाम है।
- source_word: הֲלֹא
  choice: क्या ... नहीं
  rationale: यह सकारात्मक उत्तर की अपेक्षा करने वाला आलंकारिक प्रश्न है; हिन्दी में ‘क्या ... नहीं’ उसके प्रश्नात्मक बल को स्वाभाविक रूप से बनाए रखता है।
- source_word: מִקּוֹל מַפַּלְתֵּךְ
  choice: तेरे गिरने की आवाज़ सुनाई देगी
  rationale: शाब्दिक अर्थ ‘तेरे पतन की आवाज़ से’ है। यहाँ नगर के हिंसक ढहने/पतन की सुनाई देने वाली ध्वनि का चित्र है; हिन्दी वाक्य-संरचना के लिए इसे कालवाचक उपवाक्य बनाया गया है।
- source_word: בֶּאֱנֹק חָלָל
  choice: जब घायल कराहेंगे
  rationale: חָלָל छेदा हुआ, घातक रूप से घायल या मारा गया व्यक्ति हो सकता है। אנק ‘कराहना’ के साथ ‘घायल’ संदर्भ में अधिक स्वाभाविक है, जबकि मृत्यु की संभावना को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: בֵּהָרֵג הֶרֶג
  choice: घोर मार-काट होगी
  rationale: क्रिया और उसी मूल के कर्म का संयोजन हत्या की तीव्रता पर बल देता है। ‘घोर मार-काट’ इस जोर को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: בְּתוֹכֵךְ
  choice: तेरे बीच
  rationale: सोर नगर को स्त्रीलिंग एकवचन में प्रत्यक्ष संबोधन है; ‘तेरे बीच’ नगर के भीतर होने वाली घटना को संक्षेप में दर्शाता है।
- source_word: יִרְעֲשׁוּ
  choice: थरथरा ... उठेंगे
  rationale: क्रिया भौतिक काँपने और भय से हिल उठने, दोनों का संकेत दे सकती है। ‘थरथरा उठेंगे’ इस दोहरे प्रभाव को बनाए रखता है।
- source_word: הָאִיִּים
  choice: समुद्रतटीय प्रदेश
  rationale: אִיִּים द्वीपों के साथ व्यापक समुद्री तटवर्ती भूभागों को भी सूचित कर सकता है। सोर के समुद्री संसार के संदर्भ में व्यापक अर्थ मुख्य पाठ में रखा गया है।
theological_decisions:
- issue: संयुक्त उपाधि אֲדֹנָי יְהוִה में ईश्वरीय नाम का अनुवाद
  choice: प्रभु यहोवा
  alternative: प्रभु याहवे / प्रभु परमेश्वर
  rationale: मूल पाठ में सामान्य उपाधि और व्यक्तिगत वाचा-नाम दोनों उपस्थित हैं। ‘प्रभु यहोवा’ हिन्दी पाठक के लिए परिचित है और יהוה को केवल सामान्य उपाधि में विलीन नहीं करता।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और मौखिक पठन में सहज हिन्दी। सोर को एक व्यक्ति की तरह प्रत्यक्ष संबोधित करने वाले मूल के ‘तेरे’ रूप को बनाए रखा गया है। आलंकारिक प्रश्न और विनाश की श्रव्य तथा भावात्मक छवि सुरक्षित हैं।
