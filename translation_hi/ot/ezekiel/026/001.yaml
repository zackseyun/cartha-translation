  language: en
  yaml_path: translation/ot/ezekiel/026/001.yaml
  text: And it happened in the eleventh year[a], on the first day of the month, that the word of Yahweh came to me, saying,
translation:
  language: hi
  text: 'और ऐसा हुआ कि ग्यारहवें वर्ष में, महीने के पहले दिन[a], याहवे का वचन मेरे पास आया:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इब्रानी: ‘महीने के एक पर’; यह एक प्रचलित दिनांक-सूत्र है, जिसका अर्थ महीने का पहला दिन है।'
    reason: मूल इब्रानी अभिव्यक्ति का शाब्दिक रूप और उसका मुहावरेदार अर्थ स्पष्ट करना।
lexical_decisions:
- source_word: וַיְהִי
  choice: —
  rationale: इब्रानी कथात्मक सूत्र यहाँ दिनांकित भविष्यवाणी का आरम्भ करता है। हिन्दी में अलग से ‘और ऐसा हुआ’ जोड़ने के बजाय स्वाभाविक दिनांक-वाक्य और ‘वचन मेरे पास आया’ से उसका कार्य स्पष्ट हो जाता है।
- source_word: בְּעַשְׁתֵּי עֶשְׂרֵה שָׁנָה
  choice: ग्यारहवें वर्ष में
  rationale: पूर्वसर्ग और क्रमसूचक संख्या से बने दिनांक-सूत्र का सीधा और स्वाभाविक हिन्दी रूप।
- source_word: בְּאֶחָד לַחֹדֶשׁ
  choice: महीने के पहले दिन
  rationale: शाब्दिक रूप ‘महीने के एक पर’ एक प्रचलित इब्रानी दिनांक-सूत्र है, जिसका अर्थ महीने का पहला दिन है।
- source_word: הָיָה דְבַר יְהוָה אֵלַי
  choice: यहोवा का वचन मेरे पास आया
  rationale: यह भविष्यद्वाणी मिलने का मानक सूत्र है। इब्रानी में ‘था/हुआ’ है, पर आधुनिक हिन्दी में प्रकाशना के आगमन के लिए ‘मेरे पास आया’ स्वाभाविक और अर्थनिष्ठ है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: चतुरक्षरीय ईश्वरीय नाम को किसी उपाधि से बदलने के बजाय हिन्दी में प्रचलित नाम-रूप ‘यहोवा’ से व्यक्त किया गया है।
- source_word: לֵאמֹר
  choice: ':'
  rationale: यह कृदन्त आगामी प्रत्यक्ष वचन का परिचय देता है। हिन्दी में वाक्य के अंत का द्विबिंदु वही कार्य स्वाभाविक ढंग से करता है और अगले पद से निरंतरता दिखाता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: मूल पाठ में व्यक्तिगत ईश्वरीय नाम है। हिन्दी के सामान्य बाइबलीय प्रयोग में ‘यहोवा’ अधिक परिचित है और इसे ‘प्रभु’ जैसी उपाधि से नहीं बदलता; ‘याहवे’ मूल उच्चारण का एक वैकल्पिक लिप्यंतरण है।
