  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, किंतु सामान्य पाठक के लिए सुबोध रूप अपनाया गया है। राजकीय वस्त्रों से भय के वस्त्र तक का मूल विरोध बनाए रखा गया है। संबोधन स्त्रीलिंग नगर सोर से है, पर इस वाक्य में हिन्दी सर्वनाम ‘तुम्हारे’ लिंग-निरपेक्ष है।
