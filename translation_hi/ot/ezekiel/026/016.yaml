  text: וְֽ/יָרְד֞וּ מֵ/עַ֣ל כִּסְאוֹתָ֗/ם כֹּ֚ל נְשִׂיאֵ֣י הַ/יָּ֔ם וְ/הֵסִ֨ירוּ֙ אֶת מְעִ֣ילֵי/הֶ֔ם וְ/אֶת בִּגְדֵ֥י רִקְמָתָ֖/ם יִפְשֹׁ֑טוּ חֲרָד֤וֹת יִלְבָּ֨שׁוּ֙ עַל הָ/אָ֣רֶץ יֵשֵׁ֔בוּ וְ/חָֽרְדוּ֙ לִ/רְגָעִ֔ים וְ/שָׁמְמ֖וּ עָלָֽיִ/ךְ־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/026/016.yaml
  text: Then all the princes of the sea will come down from their thrones[a], remove their robes, and strip off their embroidered garments. They will clothe themselves with trembling, sit on the ground, tremble moment by moment[b], and be appalled at you.
translation:
  language: hi
  text: तब समुद्र के सभी प्रधान अपने-अपने सिंहासनों से उतरेंगे[a], अपने चोगे उतार देंगे और अपने कढ़ाईदार वस्त्र उतार फेंकेंगे। वे थरथराहट ओढ़ लेंगे[b], भूमि पर बैठेंगे, हर पल काँपेंगे और तुम्हें देखकर हतप्रभ रह जाएँगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “समुद्र के सभी शासक।” मूल इब्रानी में शाब्दिक रूप से “समुद्र के सभी प्रधान” है; आशय समुद्री क्षेत्रों के शासकों से है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “वे थरथराहटें पहनेंगे”—भय को वस्त्र की तरह पहन लेने का सजीव चित्र।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָרְדוּ מֵעַל כִּסְאוֹתָם
  choice: अपने-अपने सिंहासनों से उतरेंगे
  rationale: ירד का सामान्य अर्थ ‘उतरना’ है और מֵעַל כִּסְאוֹתָם सत्ता के आसन से नीचे उतरने तथा अपमानित होने का दृश्य प्रस्तुत करता है। ‘अपने-अपने’ बहुवचन स्वामित्व को स्वाभाविक हिन्दी में स्पष्ट करता है।
- source_word: כֹּל נְשִׂיאֵי הַיָּם
  choice: समुद्र के सभी प्रधान
  rationale: נָשִׂיא के अर्थ-क्षेत्र में प्रधान, नेता और राजकुमार आते हैं। ‘प्रधान’ समुद्री शासकों की उच्च राजनीतिक हैसियत को बिना वंशानुगत राजकुमार होने का अनावश्यक संकेत दिए सुरक्षित रखता है; ‘समुद्र’ मूल रूपक को बनाए रखता है।
- source_word: וְהֵסִירוּ אֶת מְעִילֵיהֶם
  choice: अपने चोगे उतार देंगे
  rationale: מְעִיל बाहरी चोगे या लबादे को दर्शाता है। वस्त्र के प्रसंग में סור के हिफ़ील का स्वाभाविक हिन्दी रूप ‘उतार देना’ है।
- source_word: וְאֶת בִּגְדֵי רִקְמָתָם יִפְשֹׁטוּ
  choice: अपने कढ़ाईदार वस्त्र खोल डालेंगे
  rationale: רִקְמָה कढ़ाई अथवा रंग-बिरंगे सजावटी काम को सूचित करता है और פשט वस्त्र उतारने को। ‘खोल डालेंगे’ पहले आए ‘उतार देंगे’ से शब्दगत भेद रखते हुए क्रिया की तीव्रता व्यक्त करता है।
- source_word: חֲרָדוֹת יִלְבָּשׁוּ
  choice: वे थरथराहट को पहन लेंगे
  rationale: इब्रानी में बहुवचन ‘थरथराहटें’ को वस्त्र की तरह पहनने का सजीव रूपक है। हिन्दी में स्वाभाविकता के लिए भाववाचक एकवचन रखा गया, पर ‘पहनना’ बनाए रखकर रूपक सुरक्षित किया गया।
- source_word: עַל הָאָרֶץ יֵשֵׁבוּ
  choice: भूमि पर बैठेंगे
  rationale: यहाँ הָאָרֶץ बैठने की जगह, अर्थात धरती या भूमि, को दर्शाता है। ‘भूमि पर’ गरिमापूर्ण और स्पष्ट हिन्दी है तथा शोक और दीनता की मुद्रा को व्यक्त करता है।
- source_word: וְחָרְדוּ לִרְגָעִים
  choice: हर पल काँपेंगे
  rationale: לִרְגָעִים क्षण-क्षण होने वाली या निरंतर दोहराई जाने वाली प्रतिक्रिया बताता है। ‘हर पल’ आधुनिक हिन्दी में इस पुनरावृत्त भाव को सहजता से व्यक्त करता है।
- source_word: וְשָׁמְמוּ עָלָיִךְ
  choice: तुम्हारे कारण स्तब्ध रह जाएँगे
  rationale: שׁמם भयावह विनाश के सामने स्तब्ध, चकित या आतंकित हो जाने का अर्थ दे सकता है। עַל को यहाँ कारणसूचक समझना स्वाभाविक है। ‘स्तब्ध रह जाएँगे’ मूल की प्रतिक्रिया को व्यक्त करता है, पर उसकी संभावित अर्थ-छटाओं को पूरी तरह संकुचित नहीं करता।
