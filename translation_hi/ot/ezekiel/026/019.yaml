source:
  edition: WLC
  text: כִּ֣י כֹ֤ה אָמַר֙ אֲדֹנָ֣/י יְהוִ֔ה בְּ/תִתִּ֤/י אֹתָ/ךְ֙ עִ֣יר נֶחֱרֶ֔בֶת כֶּ/עָרִ֖ים אֲשֶׁ֣ר לֹֽא נוֹשָׁ֑בוּ בְּ/הַעֲל֤וֹת עָלַ֨יִ/ךְ֙ אֶת תְּה֔וֹם וְ/כִסּ֖וּ/ךְ הַ/מַּ֥יִם הָ/רַבִּֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/026/019.yaml
  text: 'For thus says the Lord GOD: When I make you a ruined city[a], like the cities that are not inhabited, when I bring up the deep over you and the great waters cover you[b],'
translation:
  language: hi
  text: 'क्योंकि प्रभु याहवे यों कहता है: “जब मैं तुझे उजड़ा हुआ नगर बना दूँगा, उन नगरों के समान जो बसे हुए नहीं हैं; जब मैं तेरे ऊपर गहरे जल को चढ़ा लाऊँगा और विशाल जलराशियाँ तुझे ढक लेंगी,'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  choice: प्रभु याहवे
  rationale: אֲדֹנָי को ‘प्रभु’ और चतुरक्षरीय निजी नाम יְהוִה को ‘याहवे’ रूप में रखा गया है, जिससे संयुक्त उपाधि और परमेश्वर के नाम का भेद बना रहे।
- source_word: בְּתִתִּי אֹתָךְ עִיר נֶחֱרֶבֶת
  choice: जब मैं तुझे उजड़ा हुआ नगर बना दूँगा
  rationale: נתן यहाँ विधेय के साथ ‘बना देना’ का अर्थ देता है; נֶחֱרֶבֶת नगर की उजड़ी हुई परिणति को व्यक्त करता है।
- source_word: כֶּעָרִים אֲשֶׁר לֹא נוֹשָׁבוּ
  choice: उन नगरों के समान जो बसे हुए नहीं हैं
  rationale: ישב के निफ़अल रूप का निष्क्रिय भाव बनाए रखते हुए निर्जन नगरों की तुलना स्पष्ट की गई है।
- source_word: בְּהַעֲלוֹת עָלַיִךְ אֶת תְּהוֹם
  choice: जब मैं तेरे ऊपर अथाह सागर को चढ़ा लाऊँगा
  rationale: הַעֲלוֹת का कारक भाव ‘चढ़ा लाना’ से और תְּהוֹם की समुद्री अथाह गहराई ‘अथाह सागर’ से व्यक्त होती है।
- source_word: וְכִסּוּךְ הַמַּיִם הָרַבִּים
  choice: और विशाल जलराशियाँ तुझे ढक लेंगी
  rationale: הַמַּיִם הָרַבִּים यहाँ प्रचंड अथवा व्यापक जल के बहुवचन चित्र को दर्शाता है; ‘विशाल जलराशियाँ’ हिंदी में स्वाभाविक रहते हुए उस बिंब को बनाए रखता है।
theological_decisions:
- issue: संयुक्त दिव्य उपाधि אֲדֹנָי יְהוִה का अनुवाद
  choice: प्रभु याहवे
  alternative: प्रभु परमेश्वर
  rationale: चुना हुआ रूप मूल पाठ में उपाधि אֲדֹנָי और निजी नाम יְהוִה—दोनों को अलग-अलग प्रत्यक्ष करता है और किसी संप्रदायगत व्याख्या को नहीं जोड़ता।
- issue: תְּהוֹם की छवि
  choice: अथाह सागर
  alternative: गहरा जल / अथाह गहराई
  rationale: यहाँ नगर के ऊपर जल चढ़ने और ढकने का प्रसंग समुद्री अथाह गहराई की छवि देता है; इसे किसी विशिष्ट पौराणिक या ब्रह्मांड-विज्ञान संबंधी अर्थ में सीमित नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण, सहज और स्रोत-समीप शैली अपनाई गई है। सोर नगर को स्त्रीलिंग एकवचन में संबोधित करने वाले हिब्रू रूप के अनुरूप ‘तुझे/तेरे’ रखा गया है। वाक्य अगले पद में जारी रहता है, इसलिए अंत में अल्पविराम रखा गया है।
