source:
  edition: WLC
  text: וְ/הוֹרַדְתִּי/ךְ֩ אֶת י֨וֹרְדֵי ב֜וֹר אֶל עַ֣ם עוֹלָ֗ם וְ֠/הוֹשַׁבְתִּי/ךְ בְּ/אֶ֨רֶץ תַּחְתִּיּ֜וֹת כָּ/חֳרָב֤וֹת מֵֽ/עוֹלָם֙ אֶת י֣וֹרְדֵי ב֔וֹר לְמַ֖עַן לֹ֣א תֵשֵׁ֑בִי וְ/נָתַתִּ֥י צְבִ֖י בְּ/אֶ֥רֶץ חַיִּֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/026/020.yaml
  text: Then I will bring you down with those who go down to the pit[a], to the people of long ago; and I will make you dwell in the land below, like ruins from ancient times, with those who go down to the pit, so that you will not be inhabited[c][b]. But I will set beauty in the land of the living.
translation:
  language: hi
  text: तब मैं तुझे गड्ढे में उतरने वालों के साथ, प्राचीन काल के लोगों[a] के पास नीचे उतार दूँगा। मैं तुझे नीचे के प्रदेश[b] में, प्राचीन काल के खंडहरों के समान, गड्ढे में उतरने वालों के साथ बसा दूँगा, ताकि तू आबाद न हो। पर मैं जीवितों के देश में शोभा[c] स्थापित करूँगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘पुराने समय के लोगों’; यहाँ मूल शब्द दूर अतीत अथवा प्राचीनता का संकेत दे सकता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से ‘निचले स्थानों की भूमि में’; इसका आशय पृथ्वी के सबसे नीचे के भागों अथवा मृतलोक से भी लिया जा सकता है।
    reason: lexical_alternative
  - marker: c
    text: या ‘वैभव’ अथवा ‘महिमा’।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוֹרַדְתִּיךְ
  choice: तब मैं तुझे ... नीचे उतार दूँगा
  rationale: हिफ़ील रूप का कारक अर्थ ‘नीचे उतारना’ रखा गया है। स्त्रीलिंग एकवचन संबोधन को ‘तुझे’ से व्यक्त किया गया है, क्योंकि संबोधन सोर नगर से है।
- source_word: יֹרְדֵי בוֹר
  choice: गड्ढे में उतरनेवाले
  rationale: ‘गड्ढा’ मूल बिंब को बनाए रखता है और कब्र तथा मृतलोक—दोनों से जुड़े अर्थों की गुंजाइश छोड़ता है।
- source_word: עַם עוֹלָם
  choice: प्राचीन काल के लोग
  rationale: यहाँ עוֹלָם दूर अतीत या प्राचीनता का बोध कराता है; अनंतता का अर्थ थोपे बिना इसे स्वाभाविक हिन्दी में व्यक्त किया गया है।
- source_word: וְהוֹשַׁבְתִּיךְ
  choice: मैं तुझे ... बसा दूँगा
  rationale: ישׁב के हिफ़ील रूप का कारक भाव सुरक्षित है। न्याय के प्रसंग में ‘बसा दूँगा’ अनैच्छिक रूप से किसी स्थान पर ठहरा दिए जाने को व्यक्त करता है।
- source_word: בְּאֶרֶץ תַּחְתִּיּוֹת
  choice: नीचे के प्रदेश में
  rationale: शाब्दिक ‘निचले स्थानों की भूमि’ को सहज हिन्दी में रखा गया है और ‘अधोलोक’ जैसा अधिक व्याख्यात्मक पारिभाषिक शब्द मुख्य पाठ में नहीं अपनाया गया।
- source_word: כָּחֳרָבוֹת מֵעוֹלָם
  choice: मानो तू प्राचीन काल का कोई खंडहर हो
  rationale: तुलनासूचक כ और प्राचीनता के अर्थ—दोनों सुरक्षित हैं। हिन्दी में तुलना स्पष्ट और स्वाभाविक बनाने के लिए इसे पूर्ण उपवाक्य के रूप में व्यक्त किया गया है।
- source_word: לְמַעַן לֹא תֵשֵׁבִי
  choice: ताकि तू आबाद न हो
  rationale: नगर को संबोधित इस कथन में ‘न बसे’ की अपेक्षा ‘आबाद न हो’ आधुनिक हिन्दी में संदर्भानुकूल है, यद्यपि मूल क्रिया व्याकरणतः कर्तृवाच्य है।
- source_word: צְבִי
  choice: शोभा
  rationale: צְבִי के सौंदर्य, वैभव और महिमा-संबंधी व्यापक अर्थ को ‘शोभा’ अपेक्षाकृत खुला रखता है; विकल्प पादटिप्पणी में दिए गए हैं।
- source_word: בְּאֶרֶץ חַיִּים
  choice: जीवितों के देश में
  rationale: यह गड्ढे और नीचे के प्रदेश के विपरीत सांसारिक जीवन के क्षेत्र का पारंपरिक और स्पष्ट बोध देता है।
theological_decisions:
- issue: अंतिम वाक्यांश וְנָתַתִּי צְבִי בְּאֶרֶץ חַיִּים का आशय
  choice: पर मैं जीवितों के देश में शोभा स्थापित करूँगा
  alternative: और मैं जीवितों के देश में महिमा/वैभव रखूँगा
  rationale: मूल कथन संक्षिप्त है और यह स्पष्ट नहीं करता कि ‘शोभा’ किस विशिष्ट वस्तु, नगर या पुनर्स्थापना को सूचित करती है। अनुवाद गड्ढे में उतारे जाने और जीवितों के देश में परमेश्वर के कार्य के बीच विरोध को बनाए रखता है, पर किसी विशिष्ट धर्मवैज्ञानिक पहचान को नहीं जोड़ता।
- issue: לְמַעַן לֹא תֵשֵׁבִי में नगर के न बसने का भाव
  choice: ताकि तू आबाद न हो
  alternative: ताकि तू न बसे
  rationale: सोर को स्त्रीलिंग नगर के रूप में संबोधित किया गया है। निष्क्रिय हिन्दी अभिव्यक्ति संदर्भगत नगर-अर्थ को स्पष्ट करती है, बिना यह जोड़ने के कि उसका विनाश किस प्रकार या कितने समय तक रहेगा।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य रखी गई है। ‘गड्ढा’, ‘नीचे का प्रदेश’ और ‘जीवितों का देश’ जैसे परस्पर विरोधी स्थान-बिंब सुरक्षित हैं। नगर सोर के स्त्रीलिंग संबोधन को ‘तुझे/तू’ से बनाए रखा गया है।
