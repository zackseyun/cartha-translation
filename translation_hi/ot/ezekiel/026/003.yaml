base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/026/003.yaml
  text: 'Therefore thus says the Lord GOD: Behold[a], I am against you, Tyre, and I will bring up many nations against you, as the sea brings up its waves.'
translation:
  language: hi
  text: 'इसलिए प्रभु याहवे[a] यों कहते हैं: “देख, हे सोर, मैं तेरे विरुद्ध हूँ। मैं बहुत-सी जातियों को तेरे विरुद्ध चढ़ा लाऊँगा, जैसे समुद्र अपनी लहरों को उठाता है।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में “अदोनाय याहवे” (אֲדֹנָי יְהוִה), अर्थात् उपाधि “प्रभु” के साथ परमेश्वर का नाम “याहवे” है।
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: इसलिए
  rationale: यह निष्कर्षसूचक अव्यय पिछले प्रसंग के आधार पर परमेश्वर की न्यायपूर्ण प्रतिक्रिया का परिचय देता है।
- source_word: כֹּה אָמַר
  choice: यों कहते हैं
  rationale: यह नबूवत का प्रचलित संदेशवाहक-सूत्र है; हिंदी में यह स्वाभाविक, गरिमापूर्ण और संक्षिप्त है।
- source_word: אֲדֹנָי יְהוִה
  choice: प्रभु याहवे
  rationale: यह अनुवाद אֲדֹנָי को ‘प्रभु’ और परमेश्वर के व्यक्तिगत नाम יהוה को ‘याहवे’ के रूप में अलग-अलग सुरक्षित रखता है।
- source_word: הִנְנִי עָלַיִךְ
  choice: देख, मैं तेरे विरुद्ध हूँ
  rationale: הִנְנִי घोषणा पर जोर देता है और न्याय के इस प्रसंग में עָלַיִךְ विरोधी रुख व्यक्त करता है।
- source_word: צֹר
  choice: सोर
  rationale: यह नगर के इब्रानी नाम का हिंदी बाइबलीय रूप है।
- source_word: וְהַעֲלֵיתִי עָלַיִךְ גּוֹיִם רַבִּים
  choice: मैं बहुत-सी जातियों को तेरे विरुद्ध चढ़ा लाऊँगा
  rationale: हिफ़ील क्रिया सैन्य दलों को आगे चढ़ा लाने का भाव देती है; ‘जातियाँ’ अंतरराष्ट्रीय सैन्य संदर्भ में גּוֹיִם को व्यक्त करता है।
- source_word: כְּהַעֲלוֹת הַיָּם לְגַלָּיו
  choice: जैसे समुद्र अपनी लहरों को उठाता है
  rationale: यह आने वाली अनेक जातियों की तुलना लगातार उठने वाली समुद्री लहरों से करता है और हिंदी में चित्र को स्वाभाविक रखता है।
theological_decisions:
- issue: संयुक्त उपाधि אֲדֹנָי יְהוִה में परमेश्वर के नाम का अनुवाद
  choice: प्रभु याहवे
  alternative: प्रभु परमेश्वर
  rationale: मूल पाठ में सामान्य उपाधि אֲדֹנָי के साथ चार अक्षरों वाला व्यक्तिगत नाम יהוה स्पष्ट रूप से उपस्थित है; ‘याहवे’ उस भेद को बनाए रखता है, जबकि वैकल्पिक पारंपरिक अनुवाद नाम को उपाधि से बदल देता है।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। सोर को एक नगर के रूप में सीधे संबोधित करने के कारण एकवचन ‘तेरे’ रखा गया है। ‘चढ़ा लाऊँगा’ सैन्य अग्रगमन के भाव को और ‘लहरों को उठाता है’ समुद्र के लगातार उमड़ने के चित्र को सुरक्षित रखता है।
