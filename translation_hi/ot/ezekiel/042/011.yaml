  yaml_path: translation/ot/ezekiel/042/011.yaml
  text: And before them was a passage[a], like the appearance of the chambers that faced north; as was their length, so was their width, and all their exits, their arrangements[b], and their entrances were alike.
translation:
  language: hi
  text: और उनके सामने एक मार्ग[a] था, जो उत्तर की ओर की कोठरियों के रूप के समान था। उनकी लंबाई और चौड़ाई भी वैसी ही थी; उनके सभी निकास, उनका विन्यास[b] और उनके प्रवेश-द्वार भी वैसे ही थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उनके सामने एक रास्ता था, जो उत्तर की ओर की कोठरियों के रूप के अनुरूप था।”
    reason: दֶּרֶךְ का अर्थ सामान्य ‘रास्ता’ भी हो सकता है, और כְּמַרְאֵה को अनुरूपता के रूप में समझा जा सकता है।
  - marker: b
    text: यहाँ अनूदित इब्रानी शब्द का अर्थ “विधान,” “नियम” या “निर्धारित रीति” भी हो सकता है; इस स्थापत्य संदर्भ में यह संभवतः कोठरियों के विन्यास या नियत व्यवस्था को दर्शाता है।
    reason: מִשְׁפָּט की सामान्य विधिक अर्थ-सीमा और यहाँ के स्थापत्य अर्थ, दोनों को सुरक्षित रखना आवश्यक है।
lexical_decisions:
- source_word: וְדֶרֶךְ לִפְנֵיהֶם
  choice: और उनके सामने एक मार्ग था
  rationale: דֶּרֶךְ का मूल अर्थ ‘मार्ग/रास्ता’ है; स्थापत्य संदर्भ में यह कोठरियों के सामने बने आने-जाने के मार्ग को दर्शाता है। ‘मार्ग’ स्वाभाविक है और आवश्यकता से अधिक विशिष्ट नहीं होता।
- source_word: כְּמַרְאֵה הַלְּשָׁכוֹת
  choice: कोठरियों के रूप के समान
  rationale: מַרְאֶה यहाँ दृश्य रूप या विन्यास का बोध कराता है। ‘रूप के समान’ मूल तुलना को बनाए रखता है।
- source_word: אֲשֶׁר דֶּרֶךְ הַצָּפוֹן
  choice: उत्तर की ओर की
  rationale: शाब्दिक पदबंध ‘उत्तर के मार्ग/दिशा की’ स्थान अथवा अभिमुखता बता सकता है। ‘उत्तर की ओर की’ इस हल्की अस्पष्टता को ‘उत्तरमुखी’ की अपेक्षा बेहतर बनाए रखता है।
- source_word: הַלְּשָׁכוֹת
  choice: कोठरियाँ
  rationale: मंदिर-स्थापत्य में לְשָׁכָה के लिए ‘कोठरी’ प्रचलित और सटीक है; सामान्य ‘कमरा’ की तुलना में यह विशेष स्थापत्य संदर्भ को अधिक अच्छी तरह व्यक्त करता है।
- source_word: כְּאָרְכָּן כֵּן רָחְבָּן
  choice: उनकी लंबाई और चौड़ाई भी वैसी ही थी
  rationale: सहसंबंधी रचना उन कोठरियों के आयामों की उत्तरी कोठरियों से समानता बताती है। हिंदी में यह रूप सहज है और तुलना स्पष्ट रखता है।
- source_word: וְכֹל מוֹצָאֵיהֶן
  choice: उनके सभी निकास
  rationale: מוֹצָא स्थापत्य संदर्भ में बाहर निकलने के स्थान या निकास को दर्शाता है।
- source_word: וּכְמִשְׁפְּטֵיהֶן
  choice: उनकी निर्धारित बनावट
  rationale: מִשְׁפָּט सामान्यतः न्याय, विधान या निर्धारित रीति है; यहाँ भवन-वर्णन में यह नियत विन्यास अथवा रूपरेखा का संकेत देता है। ‘निर्धारित बनावट’ निर्धारित मानक और स्थापत्य विन्यास दोनों पक्षों को रखती है।
- source_word: וּכְפִתְחֵיהֶן
  choice: उनके प्रवेश-द्वार
  rationale: פֶּתַח खुलने के स्थान, द्वार या प्रवेश को दर्शाता है; भवन के संदर्भ में ‘प्रवेश-द्वार’ स्पष्ट और स्वाभाविक है।
- source_word: final implicit comparison
  choice: भी वैसे ही थे
  rationale: इब्रानी में अंतिम पदों के साथ क्रिया निहित है। हिंदी वाक्य पूरा करने के लिए तुलना को स्पष्ट किया गया है, बिना कोई नई विशेषता जोड़े।
