  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज शैली रखी गई है। स्थापत्य के लिए ‘कोठरियाँ’, याजकीय क्रिया के लिए ‘निकट आनेवाले’ और बलि-श्रेणियों के लिए प्रचलित संक्षिप्त पद चुने गए हैं। सभी वास्तविक शब्दार्थ-विकल्प पादटिप्पणियों में सुरक्षित हैं।
