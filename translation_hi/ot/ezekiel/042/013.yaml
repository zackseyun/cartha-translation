  text: וַ/יֹּ֣אמֶר אֵלַ֗/י לִֽשְׁכ֨וֹת הַ/צָּפ֜וֹן לִֽשְׁכ֣וֹת הַ/דָּרוֹם֮ אֲשֶׁ֣ר אֶל פְּנֵ֣י הַ/גִּזְרָה֒ הֵ֣נָּה לִֽשְׁכ֣וֹת הַ/קֹּ֗דֶשׁ אֲשֶׁ֨ר יֹאכְלוּ שָׁ֧ם הַ/כֹּהֲנִ֛ים אֲשֶׁר קְרוֹבִ֥ים לַֽ/יהוָ֖ה קָדְשֵׁ֣י הַ/קֳּדָשִׁ֑ים שָׁ֞ם יַנִּ֣יחוּ קָדְשֵׁ֣י הַ/קֳּדָשִׁ֗ים וְ/הַ/מִּנְחָה֙ וְ/הַ/חַטָּ֣את וְ/הָ/אָשָׁ֔ם כִּ֥י הַ/מָּק֖וֹם קָדֹֽשׁ־׀־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/042/013.yaml
  text: Then he said to me[a], “The north chambers, the south chambers, which are opposite the separate area—they are the holy chambers, where the priests who draw near to Yahweh shall eat the most holy things. There they shall place the most holy things, the grain offering, the sin offering, and the guilt offering[d][c][b], for the place is holy.”
translation:
  language: hi
  text: तब उसने मुझसे कहा, “उत्तर की कोठरियाँ और दक्षिण की कोठरियाँ, जो पृथक क्षेत्र के सामने हैं[a]—वे पवित्र कोठरियाँ हैं। वहाँ याहवे के निकट आनेवाले याजक परमपवित्र वस्तुएँ[b] खाएँगे। वहीं वे परमपवित्र वस्तुएँ—अन्नबलि, पापबलि[c] और दोषबलि[d]—रखेंगे, क्योंकि वह स्थान पवित्र है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इसका अनुवाद “पृथक क्षेत्र की ओर मुख किए हुए” भी हो सकता है। इब्रानी अभिव्यक्ति बताती है कि ये कोठरियाँ मंदिर-परिसर के अलग रखे गए भाग के सामने थीं।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में “परमपवित्र वस्तुएँ” है। यहाँ इसका संकेत सर्वोच्च पवित्रता वाली भेंटों से है, न कि ‘परमपवित्र स्थान’ कहलाने वाले भीतरी कक्ष से।
    reason: lexical_alternative
  - marker: c
    text: “पापबलि” का अनुवाद “शुद्धिकरण-बलि” भी किया जा सकता है।
    reason: alternative_reading
  - marker: d
    text: “दोषबलि” का अनुवाद “क्षतिपूर्ति-बलि” भी किया जा सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: לִשְׁכוֹת
  choice: कोठरियाँ
  rationale: मंदिर की सेवा से जुड़े भवन के कमरों के लिए ‘कोठरियाँ’ सटीक और स्वाभाविक स्थापत्य-संबंधी शब्द है।
- source_word: הַצָּפוֹן / הַדָּרוֹם
  choice: उत्तर की कोठरियाँ / दक्षिण की कोठरियाँ
  rationale: यह दिशासूचक प्रयोग को स्पष्ट रखता है और आधुनिक हिन्दी में सहज है।
- source_word: אֶל פְּנֵי הַגִּזְרָה
  choice: पृथक क्षेत्र के सामने
  rationale: אֶל־פְּנֵי स्थानिक रूप से ‘के सामने’ या ‘की ओर मुख किए हुए’ बताता है; הַגִּזְרָה मंदिर-परिसर के अलग रखे गए क्षेत्र को सूचित करता है।
- source_word: לִשְׁכוֹת הַקֹּדֶשׁ
  choice: पवित्र कोठरियाँ
  rationale: यह कमरों के पवित्र उपयोग और קדשׁ की मानक धार्मिक शब्दावली, दोनों को बनाए रखता है।
- source_word: קְרוֹבִים לַיהוָה
  choice: याहवे के निकट आनेवाले
  rationale: यह केवल भौतिक निकटता नहीं, बल्कि याजकीय सेवा में परमेश्वर के निकट आने का अनुष्ठानिक भाव व्यक्त करता है।
- source_word: קָדְשֵׁי הַקֳּדָשִׁים
  choice: परमपवित्र वस्तुएँ
  rationale: संदर्भ में यह परमपवित्र स्थान नामक भीतरी कक्ष नहीं, बल्कि सर्वोच्च पवित्रता-श्रेणी की बलि-वस्तुओं को दर्शाता है।
- source_word: יַנִּיחוּ
  choice: रखेंगे
  rationale: यह निर्दिष्ट पवित्र स्थान में वस्तुओं को रख देने के अर्थ को सरल और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: הַמִּנְחָה
  choice: अन्नबलि
  rationale: याजकीय संदर्भ में यह अनाज से चढ़ाई जाने वाली निर्धारित बलि है; ‘अन्नबलि’ प्रचलित और संक्षिप्त हिन्दी पद है।
- source_word: הַחַטָּאת
  choice: पापबलि
  rationale: यह बलि-व्यवस्था की मानक श्रेणी को स्पष्ट करता है, जबकि शुद्धिकरण-संबंधी वैकल्पिक अर्थ पादटिप्पणी में सुरक्षित है।
- source_word: הָאָשָׁם
  choice: दोषबलि
  rationale: यह אָשָׁם की मानक बलि-श्रेणी को दर्शाता है; क्षतिपूर्ति का पहलू वैकल्पिक पद के रूप में पादटिप्पणी में दिया गया है।
- source_word: כִּי הַמָּקוֹם קָדֹשׁ
  choice: क्योंकि वह स्थान पवित्र है
  rationale: כִּי यहाँ पिछली व्यवस्था का कारण देता है; ‘क्योंकि’ इस तार्किक संबंध को साफ रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का रूप
  choice: याहवे
  alternative: यहोवा
  rationale: मूल पाठ में चार-अक्षरीय वाचा-नाम सीधे आया है; ‘याहवे’ उसका व्यापक रूप से स्वीकृत ध्वन्यात्मक प्रतिनिधित्व है और उसे किसी उपाधि से प्रतिस्थापित नहीं करता।
- issue: קָדְשֵׁי הַקֳּדָשִׁים का आशय
  choice: परमपवित्र वस्तुएँ
  alternative: परमपवित्र भेंटें
  rationale: इसके तुरंत बाद अन्नबलि, पापबलि और दोषबलि का उल्लेख स्पष्ट करता है कि यहाँ भीतरी पवित्र कक्ष नहीं, सर्वोच्च पवित्रता वाली बलि-वस्तुएँ अभिप्रेत हैं।
