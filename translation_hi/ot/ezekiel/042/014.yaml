base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/042/014.yaml
  text: When the priests enter[a], they shall not go out from the holy place into the outer court, but there they shall leave their garments in which they minister, for they are holy. They shall put on other garments, and then approach what belongs to the people.
translation:
  language: hi
  text: जब याजक प्रवेश करें, तब वे पवित्र स्थान से निकलकर बाहरी आँगन में न जाएँ। वे अपने वस्त्र, जिनमें वे सेवा करते हैं, उतारकर वहीं रख दें, क्योंकि वे पवित्र हैं। फिर वे दूसरे वस्त्र पहनें और लोगों के लिए जो है, उसके निकट जाएँ।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “लोगों के लिए जो है।” इब्रानी अभिव्यक्ति अण्डाकार है और इसमें कोई संज्ञा नहीं दी गई है; इसका संकेत संभवतः लोगों के लिए सुलभ स्थान की ओर है।
    reason: alternative_reading
lexical_decisions:
- source_word: בְּבֹאָם הַכֹּהֲנִים
  choice: जब याजक भीतर आएँ
  rationale: בְּ के साथ infinitive construct कालसूचक उपवाक्य बनाता है। संदर्भ में प्रवेश भीतर के पवित्र क्षेत्र में है; ‘भीतर’ स्वाभाविक हिन्दी में इस गति को स्पष्ट करता है।
- source_word: וְלֹא יֵצְאוּ מֵהַקֹּדֶשׁ אֶל הֶחָצֵר הַחִיצוֹנָה
  choice: तब वे पवित्र स्थान से निकलकर बाहरी आँगन में न जाएँ
  rationale: निर्देशात्मक imperfect को ‘न जाएँ’ से व्यक्त किया गया है। קֹדֶשׁ और חָצֵר के स्थानिक विरोध को ‘पवित्र स्थान’ और ‘बाहरी आँगन’ बनाए रखते हैं।
- source_word: וְשָׁם יַנִּיחוּ בִגְדֵיהֶם
  choice: वे वहीं अपने वे वस्त्र उतारकर रख दें
  rationale: יניחו का मूल भाव ‘रखना/छोड़ देना’ है। वस्त्र बदलने के प्रसंग में ‘उतारकर रख दें’ स्वाभाविक है; ‘उतारकर’ संदर्भ से निहित क्रिया को स्पष्ट करता है।
- source_word: אֲשֶׁר יְשָׁרְתוּ בָהֶן
  choice: जिनमें वे सेवा करते हैं
  rationale: שרת याजकीय सेवा को सूचित करता है। ‘सेवा करते हैं’ सामान्य पाठक के लिए स्पष्ट है और वस्त्रों के साथ בָהֶן को ‘जिनमें’ स्वाभाविक रूप से व्यक्त करता है।
- source_word: כִּי קֹדֶשׁ הֵנָּה
  choice: क्योंकि वे पवित्र हैं
  rationale: स्त्रीलिंग बहुवचन सर्वनाम का पूर्वपद ‘वस्त्र’ है। हिन्दी में ‘वे’ इस संबंध को बनाए रखता है और पवित्रता को स्पष्ट छोड़ता है।
- source_word: ילבשו בְּגָדִים אֲחֵרִים
  choice: फिर वे दूसरे वस्त्र पहनें
  rationale: निर्देशात्मक बल को ‘पहनें’ से और क्रम को ‘फिर’ से सहज रूप में व्यक्त किया गया है।
- source_word: וְקָרְבוּ אֶל אֲשֶׁר לָעָם
  choice: और उस स्थान के पास जाएँ जो लोगों के लिए है
  rationale: मूल अभिव्यक्ति अण्डाकार है और कोई संज्ञा स्पष्ट नहीं करती। स्थानिक संदर्भ के कारण मुख्य पाठ में ‘स्थान’ की न्यूनतम पूर्ति पठनीय है, जबकि पादटिप्पणी मूल की अस्पष्टता बताती है।
theological_decisions:
- issue: याजकीय वस्त्रों की पवित्रता और पवित्र से जनसुलभ क्षेत्र की ओर गमन
  choice: वस्त्रों को स्वयं ‘पवित्र’ कहा गया है और दूसरे वस्त्र पहनने के बाद ही लोगों के लिए निर्धारित स्थान की ओर जाने का निर्देश दिया गया है।
  alternative: इसे केवल निर्धारित कक्ष में वस्त्र बदलने की स्थानिक व्यवस्था के रूप में पढ़ा जा सकता है।
  rationale: पाठ पवित्र और बाहरी क्षेत्र के बीच सीमा तथा सेवाकार्य में पहने वस्त्रों की पवित्रता दोनों को स्पष्ट करता है; अनुवाद इनमें से किसी एक पक्ष को दूसरे में विलीन नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सहज रखी गई है। ‘याजक’, ‘पवित्र स्थान’, ‘बाहरी आँगन’ और ‘वस्त्र’ जैसे परिचित बाइबलीय पद प्रयोग किए गए हैं। मूल की अंतिम अण्डाकार अभिव्यक्ति को मुख्य पाठ में हल्का स्पष्ट किया गया है और उसकी वास्तविक अस्पष्टता पादटिप्पणी में सुरक्षित रखी गई है।
