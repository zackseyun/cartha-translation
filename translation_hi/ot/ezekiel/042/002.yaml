lexical_decisions:
- source_word: אֶל פְּנֵי
  choice: के सामने
  rationale: यह स्थान-सूचक पद मापी गई इमारत के सापेक्ष दिशा या स्थिति बताता है। ‘के सामने’ स्वाभाविक हिन्दी है और इब्रानी की संक्षिप्त स्थान-संबंधी अभिव्यक्ति को बनाए रखता है।
- source_word: אֹרֶךְ אַמּוֹת הַמֵּאָה
