- source_word: פֶּתַח הַצָּפוֹן
  choice: उत्तर की ओर का प्रवेश-द्वार
  rationale: פֶּתַח यहाँ भवन में प्रवेश का खुला स्थान है। ‘प्रवेश-द्वार’ आधुनिक हिन्दी में स्पष्ट है, और ‘उत्तर की ओर का’ स्थान-संबंध को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: וְהָרֹחַב
  choice: और उसकी चौड़ाई ... थी
  rationale: רֹחַב अनुप्रस्थ माप अर्थात चौड़ाई है। इब्रानी का वाक्य क्रियारहित है; स्वाभाविक हिन्दी के लिए ‘थी’ और संदर्भ स्पष्ट करने हेतु ‘उसकी’ जोड़े गए हैं।
- source_word: חֲמִשִּׁים אַמּוֹת
  choice: पचास हाथ
  rationale: संख्या और प्राचीन माप को सीधे तथा पहले माप के अनुरूप रखा गया है।
