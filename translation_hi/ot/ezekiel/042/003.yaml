  yaml_path: translation/ot/ezekiel/042/003.yaml
  text: Opposite the twenty cubits that belonged to the inner court[a], and opposite the pavement that belonged to the outer court[b], gallery faced gallery in the third story.
translation:
  language: hi
  text: भीतरी आँगन से संबद्ध बीस हाथ की जगह के सामने और बाहरी आँगन के फर्श के सामने, तीसरी मंज़िल पर एक दीर्घा[a] दूसरी दीर्घा के सामने थी।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी शब्द ‘अत्तीक’ एक दुर्लभ वास्तु-शब्द है; इसका अर्थ दीर्घा, स्तंभयुक्त बरामदा, मंडप या इसी प्रकार की कोई ऊपरी संरचना भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या, “तीसरे स्तर पर।” इब्रानी वाक्यांश संभवतः भवन की तीसरी मंज़िल की ओर संकेत करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: נֶגֶד
  choice: के सामने
  rationale: यह स्थान-संबंध बताता है कि भवन का भाग उल्लिखित क्षेत्रों की ओर या उनके सामने था; आधुनिक हिन्दी में यह स्वाभाविक और स्पष्ट है।
- source_word: הָעֶשְׂרִים
  choice: बीस हाथ चौड़ी जगह
  rationale: मूल में केवल ‘बीस’ है, पर मंदिर-दर्शन के माप-संबंधी प्रसंग में इकाई ‘हाथ’ और मापी हुई जगह निहित हैं। ‘चौड़ी जगह’ हिन्दी पाठक के लिए वास्तु-विन्यास स्पष्ट करती है।
- source_word: לֶחָצֵר הַפְּנִימִי
  choice: भीतरी आँगन की
  rationale: लामेद यहाँ उस बीस हाथ के क्षेत्र का भीतरी आँगन से संबंध व्यक्त करता है। संक्षिप्त संबंधकारक हिन्दी में सहज है।
- source_word: רִצְפָה
  choice: पक्का फर्श
  rationale: यह मंदिर-परिसर की बिछी या पक्की सतह को दर्शाता है। ‘पक्का फर्श’ साधारण आधुनिक हिन्दी में ठोस वास्तु-सतह का अर्थ देता है।
- source_word: לֶחָצֵר הַחִיצוֹנָה
  choice: बाहरी आँगन के
  rationale: यह फर्श का बाहरी आँगन से संबंध बताता है; संबंधकारक रूप मूल के आशय को स्वाभाविक हिन्दी में रखता है।
- source_word: אַתִּיק
  choice: बरामदा
  rationale: यह एक दुर्लभ वास्तु-शब्द है। ‘बरामदा’ ऐसी खुली या स्तंभयुक्त संरचना के लिए सामान्य और बोधगम्य हिन्दी शब्द है, जबकि ठीक वास्तु-रूप अनिश्चित है और पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: אֶל פְּנֵי
  choice: आमने-सामने
  rationale: यह दोनों वास्तु-भागों के परस्पर मुख किए होने का स्थानिक संबंध व्यक्त करता है।
- source_word: בַּשְּׁלִשִׁים
  choice: तीसरी मंज़िल पर
  rationale: वास्तु-संदर्भ में यह भवन के तीसरे तल या स्तर की ओर संकेत करता है। ‘तीसरी मंज़िल’ आधुनिक हिन्दी में सर्वाधिक सहज है, जबकि वैकल्पिक समझ पादटिप्पणी में दी गई है।
