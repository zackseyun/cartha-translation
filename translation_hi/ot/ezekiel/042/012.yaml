  yaml_path: translation/ot/ezekiel/042/012.yaml
  text: And corresponding to the doorways of the chambers that were toward the south[a], there was a doorway at the head of the way, the way in front of the protective wall, toward the east[b], as one enters them.
translation:
  language: hi
  text: दक्षिण की ओर वाली कोठरियों के द्वारों के अनुरूप, मार्ग के आरम्भ[a] में एक द्वार था। वह मार्ग सुरक्षा देने वाली दीवार[b] के सामने, पूर्व की ओर था; उससे उनमें प्रवेश किया जाता था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘मार्ग के मुहाने पर।’ इब्रानी में ‘मार्ग’ शब्द कई बार आया है, और यहाँ स्थापत्य का ठीक आशय अनिश्चित है।
    reason: lexical_alternative
  - marker: b
    text: यहाँ प्रयुक्त इब्रानी शब्द दुर्लभ है; इसका अर्थ घेरने वाली या ओट देने वाली दीवार भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וּכְפִתְחֵי
  choice: द्वारों के अनुरूप
  rationale: तुलनासूचक כ को केवल जोड़ के रूप में नहीं, बल्कि पिछले स्थापत्य-विवरण से समानता या अनुरूपता के रूप में व्यक्त करता है।
- source_word: הַלְּשָׁכוֹת
  choice: कोठरियों
  rationale: मन्दिर के स्थापत्य-सन्दर्भ में לשכה सहायक कमरों या कक्षों को दर्शाता है; ‘कोठरियाँ’ साधारण पाठक के लिए स्पष्ट और स्थापत्य-संगत है।
- source_word: אֲשֶׁר דֶּרֶךְ הַדָּרוֹם
  choice: दक्षिण की ओर की
  rationale: यह पद कोठरियों की दिशा या स्थिति बताता है; अनिश्चित स्थापत्य-विन्यास को अनावश्यक रूप से ‘दक्षिणमुखी’ कहकर सीमित नहीं किया गया।
- source_word: פֶּתַח
  choice: एक द्वार
  rationale: פתח प्रवेश के खुले स्थान को दर्शाता है। हिन्दी में ‘द्वार’ यहाँ स्वाभाविक है और आवश्यक नहीं कि वह दरवाज़े के पल्ले को सूचित करे।
- source_word: בְּרֹאשׁ דָּרֶךְ
  choice: मार्ग के आरम्भ में
  rationale: शाब्दिक ‘मार्ग के सिर पर’ की अपेक्षा यह हिन्दी में स्वाभाविक है, जबकि रास्ते के आरम्भिक सिरे का भाव बनाए रखता है।
- source_word: דֶּרֶךְ
  choice: मार्ग
  rationale: स्थापत्य परिसर में पहुँचने के रास्ते या गलियारे का संकेत देता है। एक ही शब्द रखने से इब्रानी की पुनरावृत्ति यथासम्भव दिखाई देती है।
- source_word: בִּפְנֵי הַגְּדֶרֶת
  choice: दीवार के सामने
  rationale: בפני का स्थानवाचक अर्थ ‘सामने’ और גדרת का स्थापत्य अर्थ दीवार, बाड़ या घेरा हो सकता है; मुख्य पाठ में सबसे स्वाभाविक विकल्प चुना गया है।
- source_word: הֲגִינָה
  choice: सुरक्षा देने वाली
  rationale: यह दुर्लभ पद सम्भवतः दीवार के सुरक्षात्मक, घेरने वाले या ओट देने वाले कार्य का वर्णन करता है; अनिश्चितता पाद-टिप्पणी में सुरक्षित रखी गई है।
- source_word: דֶּרֶךְ הַקָּדִים
  choice: पूर्व की ओर
  rationale: दिशा को सहज हिन्दी में व्यक्त करता है, बिना यह निश्चित किए कि संरचना पूर्वी ओर स्थित थी या केवल पूर्वाभिमुख थी।
- source_word: בְּבוֹאָן
  choice: उनमें प्रवेश करने का
  rationale: בוא के क्रियात्मक भाव और स्त्रीलिंग बहुवचन प्रत्यय को बनाए रखते हुए इसे कोठरियों में प्रवेश के मार्ग के रूप में स्वाभाविक हिन्दी में व्यक्त किया गया है।
