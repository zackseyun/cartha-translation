  yaml_path: translation/ot/ezekiel/042/007.yaml
  text: And the wall that was outside[a], alongside the chambers, toward the outer court, in front of the chambers—its length was fifty cubits.
translation:
  language: hi
  text: और बाहर की ओर एक दीवार थी, जो कोठरियों के समानांतर[a], बाहरी आँगन की ओर, कोठरियों के सामने थी। उसकी लंबाई पचास हाथ थी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘कोठरियों के सामने’। इब्रानी संबंधबोधक शब्द अनुरूपता या आमने-सामने की स्थिति, दोनों को व्यक्त कर सकता है; स्थापत्य विन्यास और माप के संदर्भ में यहाँ ‘समानांतर’ चुना गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: גָדֵר
  choice: दीवार
  rationale: मंदिर-परिसर के इस स्थापत्य वर्णन में यह शब्द घेरने वाली दीवार या अवरोध को दर्शाता है; ‘दीवार’ स्वाभाविक और पर्याप्त रूप से ठोस है।
- source_word: לַחוּץ
  choice: बाहर की ओर
  rationale: यह कोठरियों के संबंध में दीवार की बाहरी स्थिति बताता है और आधुनिक हिन्दी में सहज है।
- source_word: לְעֻמַּת
  choice: के समानांतर
  rationale: इस स्थापत्य और माप-संबंधी संदर्भ में यह चयन दीवार और कोठरियों के अनुरूप स्थानिक फैलाव को स्पष्ट करता है, जबकि मूल में ‘सामने’ या ‘आमने-सामने’ होने की संभावना भी बनी रहती है।
- source_word: לְּשָׁכוֹת
  choice: कोठरियाँ
  rationale: यहेजकेल के मंदिर-दर्शन में यह परिसर के निर्धारित कक्षों का स्थापत्य पद है; ‘कोठरियाँ’ साधारण ‘कमरों’ की अपेक्षा इस विशेष प्रयोग को बेहतर बनाए रखता है।
- source_word: דֶּרֶךְ
  choice: की ओर
  rationale: यहाँ शब्द स्थानिक दिशा या पार्श्व-संबंध व्यक्त करता है; ‘बाहरी आँगन की ओर’ हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: הֶחָצֵר הַחִיצוֹנָה
  choice: बाहरी आँगन
  rationale: मंदिर-परिसर के बाहरी प्रांगण के लिए यह आधुनिक हिन्दी में सुबोध स्थापत्य अभिव्यक्ति है।
- source_word: אֶל־פְּנֵי
  choice: के सामने
  rationale: यह मुहावरा किसी वस्तु के सामने या उसकी ओर मुख किए होने की स्थानिक स्थिति दर्शाता है।
- source_word: אָרְכּוֹ
  choice: उसकी लंबाई
  rationale: एकवचन प्रत्यय पहले उल्लिखित दीवार की ओर संकेत करता है और स्थापत्य माप को सीधे व्यक्त करता है।
- source_word: חֲמִשִּׁים אַמָּה
  choice: पचास हाथ
  rationale: मूल की प्राचीन माप-इकाई को आधुनिक इकाई में अनुमानतः बदले बिना हिन्दी की प्रचलित बाइबलीय अभिव्यक्ति में रखा गया है।
