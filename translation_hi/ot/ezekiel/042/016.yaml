  text: 'उसने मापने के सरकंडे से पूर्वी ओर मापा: मापने के सरकंडे से पाँच सौ सरकंडे[a], चारों ओर।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी पाठ में शाब्दिक रूप से, “पाँच हाथ, सरकंडे” है। प्रसंग में इसे सामान्यतः “पाँच सौ सरकंडे” समझा जाता है, जो पद 16–19 की अन्य मापों के अनुरूप है। कुछ पांडुलिपियाँ और प्राचीन अनुवाद इसे अधिक स्पष्ट रूप से व्यक्त करते हैं।
    reason: textual_variant
