- source_word: בִּקְנֵה הַמִּדָּה
  choice: मापने के सरकंडे से
  rationale: यहाँ ב साधनवाचक है; माप उसी निर्धारित मापक-सरकंडे से लिया गया।
- source_word: חֲמֵשׁ אמות קָנִים
  choice: पाँच सौ सरकंडे
  rationale: मसोरेटिक पाठ का शाब्दिक रूप कठिन है, पर पद 16–19 की समान मापों और प्राचीन पाठ-साक्ष्य के आधार पर आशय सामान्यतः पाँच सौ सरकंडे समझा जाता है; पाठगत कठिनाई को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: סָבִיב
  choice: मुख्य पाठ में अलग से अनूदित नहीं
  rationale: यह शब्द चारों दिशाओं की क्रमिक परिधीय माप-श्रृंखला की ओर संकेत करता है। इस एक पद में 'चारों ओर' जोड़ने से ऐसा भ्रम हो सकता है कि केवल पूर्वी भाग ने पूरी परिधि घेर ली; अतः संदर्भगत अर्थ वाक्य की मापन-रचना में निहित रखा गया है।
