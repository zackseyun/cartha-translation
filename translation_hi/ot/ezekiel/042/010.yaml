  yaml_path: translation/ot/ezekiel/042/010.yaml
  text: Along the width of the court wall toward the east[a], facing the separate area and facing the building[b], were chambers.
translation:
  language: hi
  text: आँगन की चारदीवारी की चौड़ाई के साथ[b], पूर्व की ओर, अलग किए गए क्षेत्र[a] के सामने और इमारत के सामने कोठरियाँ थीं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘अलग किया गया क्षेत्र’ मंदिर-परिसर के उस विशिष्ट भाग के लिए प्रयुक्त पद है जिसे आसपास की संरचनाओं से पृथक रखा गया था।
    reason: cultural_note
  - marker: b
    text: हिब्रू का वास्तु-वर्णन अत्यंत संक्षिप्त है। आरंभिक वाक्यांश का अनुवाद ‘आँगन की चारदीवारी की चौड़ाई में’ या ‘आँगन के घेरे की चौड़ाई में’ भी किया जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּרֹחַב
  choice: की चौड़ाई में
  rationale: בְּ के साथ רֹחַב स्थान अथवा चौड़ाई के विस्तार से संबंध बताता है। हिब्रू की संक्षिप्त वास्तु-वर्णन शैली को बनाए रखने के लिए ‘की चौड़ाई में’ चुना गया है; इसका सटीक स्थानिक संबंध संदर्भ में कुछ अस्पष्ट है।
- source_word: גֶּדֶר הֶחָצֵר
  choice: आँगन की चारदीवारी
  rationale: גֶּדֶר दीवार, बाड़ या घेरने वाली सीमा हो सकती है। मंदिर-परिसर के संदर्भ में ‘चारदीवारी’ घेराबंदी का भाव स्पष्ट और स्वाभाविक रूप से व्यक्त करती है।
- source_word: דֶּרֶךְ הַקָּדִים
  choice: पूर्व की ओर
  rationale: दिशा-सूचक संज्ञा के साथ דֶּרֶךְ दिशा या ओर का बोध कराता है। ‘पूर्व की ओर’ बिना अनावश्यक स्थान-निर्धारण के दिशात्मक अर्थ बनाए रखता है।
- source_word: אֶל פְּנֵי
  choice: के सामने
  rationale: दो बार आया אֶל־פְּנֵי वास्तु-विन्यास में किसी वस्तु की ओर मुख या उसके सम्मुख स्थिति बताता है। हिंदी में संयुक्त पदों के साथ एक बार ‘के सामने’ रखना स्वाभाविक है और दोनों पर लागू होता है।
- source_word: הַגִּזְרָה
  choice: अलग किया गया क्षेत्र
  rationale: यहेजकेल के मंदिर-दर्शन में גִּזְרָה एक अलग या पृथक रखे गए भाग के लिए तकनीकी पद है। यह अनुवाद उस विशेष अर्थ को संप्रदायगत व्याख्या के बिना सुरक्षित रखता है।
- source_word: הַבִּנְיָן
  choice: इमारत
  rationale: הַבִּנְיָן का सामान्य अर्थ भवन या संरचना है। ‘इमारत’ आधुनिक हिंदी में सीधा और वास्तु-संदर्भ के अनुकूल है।
- source_word: לְשָׁכוֹת
  choice: कोठरियाँ थीं
  rationale: לְשָׁכוֹת मंदिर-परिसर की कोठरियों या कमरों को दर्शाता है। हिब्रू वाक्य क्रियारहित और संक्षिप्त है, इसलिए स्वाभाविक हिंदी के लिए ‘थीं’ जोड़ा गया है।
