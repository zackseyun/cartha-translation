base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/042/005.yaml
  text: And the upper chambers were narrower[a], because the galleries took away from them, more than from the lower and the middle parts of the building.
translation:
  language: hi
  text: और ऊपरी कोठरियाँ छोटी थीं, क्योंकि छज्जे[a] ऊपरी कोठरियों की जगह को निचली और बीच की कोठरियों की अपेक्षा अधिक घेरे हुए थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “बरामदे,” “स्तंभदार गलियारे” अथवा “निकले हुए किनारे।” “छज्जे” के लिए प्रयुक्त इब्रानी शब्द दुर्लभ है, और यह ठीक किस स्थापत्य भाग को दर्शाता है, यह निश्चित नहीं है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הַלְּשָׁכוֹת
  choice: कोठरियाँ
  rationale: मन्दिर-भवन के संदर्भ में यह शब्द सहायक कक्षों को दर्शाता है; ‘कोठरियाँ’ स्थापत्य संदर्भ में स्वाभाविक और विशिष्ट है।
- source_word: הָעֶלְיוֹנוֹת
  choice: ऊपर की
  rationale: यह निचली और बीच की मंज़िलों के विपरीत ऊपरी स्तर की कोठरियों को दर्शाता है।
- source_word: קְצֻרוֹת
  choice: छोटी थीं
  rationale: मूल शब्द का अर्थ ‘छोटी/घटी हुई’ है। स्थापत्य संदर्भ में यह उपलब्ध आकार या विस्तार कम होने को दर्शाता है; ‘छोटी’ मूल की वास्तविक अस्पष्टता को ‘सँकरी’ कहकर अनावश्यक रूप से सीमित नहीं करता।
- source_word: כִּי
  choice: क्योंकि
  rationale: यह ऊपरी कोठरियों के छोटे होने का कारण प्रस्तुत करता है।
- source_word: יוֹכְלוּ
  choice: जगह ... घेर रखी थी
  rationale: אכל का शाब्दिक अर्थ ‘खा जाना’ है, पर यहाँ स्थापत्य संरचनाओं द्वारा उपलब्ध स्थान कम करने का रूपक है। ‘जगह घेरना’ आधुनिक हिन्दी में इस प्रभाव को स्पष्ट करता है।
- source_word: אַתִּיקִים
  choice: छज्जों
  rationale: यह दुर्लभ स्थापत्य शब्द है जिसका सटीक अभिप्राय अनिश्चित है। ‘छज्जे’ बाहर निकली हुई ऐसी संरचनाओं का संभावित और समझने योग्य अनुवाद है; अन्य संभावनाएँ पादटिप्पणी में दी गई हैं।
- source_word: מֵהֵנָה
  choice: उनकी जगह
  rationale: सर्वनाम ऊपर की कोठरियों की ओर लौटता है और מִן स्थान में हुई कमी को व्यक्त करता है।
- source_word: מֵהַתַּחְתֹּנוֹת וּמֵהַתִּיכֹנוֹת
  choice: निचली और बीच की कोठरियों की अपेक्षा
  rationale: संदर्भगत तुलना को हिन्दी में स्पष्ट किया गया है; विशेषण तीन स्तरों की कोठरियों को सूचित करते हैं।
- source_word: בִּנְיָן
  choice: भवन (अंतर्निहित)
  rationale: इब्रानी में यह अंत में समूची संरचना को निर्दिष्ट करता है। हिन्दी वाक्य में तीनों स्तरों की ‘कोठरियाँ’ कहने से भवन का संबंध स्पष्ट है, इसलिए अलग से दोहराना अस्वाभाविक होता।
