    text: अधिक शाब्दिक रूप से, ‘पूर्व दिशा से।’ यह पद प्रवेश-द्वार के पूर्वी ओर होने या पूर्व दिशा से वहाँ पहुँचने—दोनों में से किसी अर्थ को सूचित कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִתַּחְתֶּה לְשָׁכוֹת הָאֵלֶּה
  choice: इन कोठरियों के नीचे
  rationale: यह अनुवाद पहले वर्णित कोठरियों के संबंध में स्थानसूचक अर्थ को बनाए रखता है और अस्पष्ट वास्तु-विवरण को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: הַמָּבוֹא
  choice: एक प्रवेश-द्वार
  rationale: मंदिर-परिसर के वास्तु-वर्णन में यह शब्द प्रवेश के स्थान या मार्ग को सूचित करता है; ‘प्रवेश-द्वार’ आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: מֵהַקָּדִים
  choice: पूर्व दिशा से
  rationale: यह इब्रानी पद का निकट और स्वाभाविक रूप है। इससे प्रवेश-द्वार की पूर्वी स्थिति अथवा पूर्व से आने की दिशा—दोनों संभावनाएँ खुली रहती हैं।
- source_word: בְּבֹאוֹ לָהֵנָּה
  choice: जिससे ... उनमें प्रवेश किया जाता था
  rationale: इब्रानी में एकवचन पुल्लिंग प्रत्यय है, पर प्रसंग में कथन सामान्य प्रवेश-क्रिया का वर्णन करता है। भाववाच्य हिन्दी अनावश्यक रूप से किसी पुरुष कर्ता को निर्दिष्ट किए बिना उस अर्थ को व्यक्त करता है।
- source_word: מֵהֶחָצֵר הַחִיצֹנָה
  choice: बाहरी आँगन से
  rationale: मंदिर-परिसर के संदर्भ में ‘आँगन’ חָצֵר का सहज हिन्दी रूप है, और ‘बाहरी’ उसकी स्थानगत पहचान को स्पष्ट रखता है।
