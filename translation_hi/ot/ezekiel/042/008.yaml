  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण स्थापत्य-वर्णन। ‘कोठरियाँ’, ‘आँगन’ और ‘हाथ’ जैसे परिचित शब्द चुने गए हैं; मूल के ध्यानसूचक ‘देखो’ को बनाए रखा गया है।
