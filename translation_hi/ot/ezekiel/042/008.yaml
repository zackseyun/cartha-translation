  yaml_path: translation/ot/ezekiel/042/008.yaml
  text: For the length of the chambers that were by the outer court was fifty cubits, and behold, the part facing the temple was a hundred cubits.
translation:
  language: hi
  text: क्योंकि बाहरी आँगन की ओर की कोठरियों की लंबाई पचास हाथ थी, और देखो, मंदिर की ओर का भाग सौ हाथ था।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: हिब्रू में अंतिम वाक्यांश का अधिक शाब्दिक रूप है, “मंदिर के सामने सौ हाथ।” यहाँ किस विशेष भाग की लंबाई बताई गई है, यह मूल वाक्य में निहित है।
    reason: मूल पाठ की स्थापत्य-संबंधी संक्षिप्तता और उससे उत्पन्न संदर्भगत अस्पष्टता को सुरक्षित रखना।
lexical_decisions:
- source_word: לְשָׁכוֹת
  choice: कोठरियों
  rationale: यह शब्द मंदिर-परिसर से जुड़े अलग-अलग कक्षों को दर्शाता है; ‘कोठरियाँ’ इस स्थापत्य संदर्भ में सहज और स्पष्ट है।
- source_word: אַמָּה
  choice: हाथ
  rationale: हिब्रू माप ‘अम्माह’ के लिए हिन्दी बाइबल परंपरा में प्रचलित और सामान्य पाठक के लिए बोधगम्य शब्द।
- source_word: וְהִנֵּה
  choice: और देखो
  rationale: वर्णन में ध्यान आकर्षित करने वाले हिब्रू संकेत को छोड़े बिना उसके बल को बनाए रखता है।
- source_word: עַל־פְּנֵי הַהֵיכָל
  choice: मंदिर की ओर का भाग
  rationale: स्थान-संबंधी भाव ‘मंदिर के सामने/मंदिर की ओर’ को व्यक्त करता है और वाक्य में निहित, पर स्पष्ट रूप से न लिखे गए मापे जाने वाले भाग को स्वाभाविक हिन्दी में सामने लाता है।
