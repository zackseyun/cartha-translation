    reason: alternative_reading
lexical_decisions:
- source_word: סָבַב
  choice: फिर वह ... मुड़ा
  rationale: क्रिया का अर्थ मुड़ना या घूमना है। मापने के इस क्रम में अगली दिशा की ओर जाने का भाव है; इसलिए स्वाभाविक हिन्दी में ‘मुड़ा’ उपयुक्त है। ‘फिर’ क्रम को स्पष्ट करता है।
- source_word: אֶל רוּחַ הַיָּם
  choice: पश्चिम की ओर
  rationale: शाब्दिक अर्थ ‘समुद्र की दिशा की ओर’ है। इस्राएली भौगोलिक प्रयोग में समुद्र भूमध्य सागर होने के कारण पश्चिम दिशा सूचित करता है। मुख्य पाठ में अर्थ स्पष्ट रखा गया है और शाब्दिक रूप पाद-टिप्पणी में दिया गया है।
- source_word: מָדַד
  choice: नापे
  rationale: सर्वेक्षण और दूरी निर्धारित करने के प्रसंग में यह सामान्य, सहज हिन्दी क्रिया है।
- source_word: חֲמֵשׁ מֵאוֹת
  choice: पाँच सौ
  rationale: हिब्रू संख्या-वाक्यांश का सीधा अनुवाद।
- source_word: קָנִים
  choice: सरकंडे
  rationale: हिब्रू बहुवचन קָנִים का अर्थ यहाँ माप की इकाई के रूप में ‘सरकंडे’ है, न कि ‘हाथ’। निकटवर्ती ‘मापने के सरकंडे से’ भी इसी अर्थ का समर्थन करता है।
- source_word: בִּקְנֵה הַמִּדָּה
  choice: मापने के सरकंडे से
  rationale: בְּ यहाँ साधन सूचक है और קְנֵה הַמִּדָּה मापने के मानक सरकंडे को दर्शाता है।
