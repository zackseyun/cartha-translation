  yaml_path: translation/ot/ezekiel/042/004.yaml
  text: Before the chambers was a walkway ten cubits wide toward the inner court[a], and a passage one cubit wide[b]; and their entrances faced north.
translation:
  language: hi
  text: उन कोठरियों के सामने भीतर की ओर[a] दस हाथ चौड़ा एक गलियारा था, और एक हाथ चौड़ा रास्ता[b] था; उनके प्रवेश-द्वार उत्तर की ओर थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक अर्थ ‘भीतरी की ओर’ है; संबद्ध संज्ञा नहीं दी गई है। कुछ अनुवाद यहाँ ‘भीतरी आँगन की ओर’ लिखते हैं, पर इस पद में ‘आँगन’ स्पष्ट रूप से नहीं है।
    reason: alternative_reading
  - marker: b
    text: इस खंड का इब्रानी पाठ कठिन है। कुछ इसे ‘एक हाथ का रास्ता’ समझते हैं; दूसरी स्वर-पद्धति या पाठ-परंपरा के अनुसार इसका अर्थ ‘सौ हाथ’ भी हो सकता है।
    reason: textual_variant
lexical_decisions:
- source_word: לִפְנֵי הַלְּשָׁכוֹת
  choice: उन कोठरियों के सामने
  rationale: मन्दिर के स्थापत्य-संदर्भ में לִפְנֵי स्थान-संबंधी ‘सामने’ और לְשָׁכוֹת ‘कोठरियाँ’ दर्शाता है।
- source_word: מַהֲלַךְ
  choice: एक गलियारा
  rationale: यह चलने के लिए निर्धारित स्थान या मार्ग है; ‘गलियारा’ स्थापत्य-विवरण में स्वाभाविक है और अगले דֶּרֶךְ से शब्दगत भेद बनाए रखता है।
- source_word: עֶשֶׂר אַמּוֹת רֹחַב
  choice: दस हाथ चौड़ा
  rationale: אַמָּה के लिए बाइबलीय माप ‘हाथ’ रखा गया है और चौड़ाई आधुनिक हिन्दी में सहज ढंग से व्यक्त की गई है।
- source_word: אֶל הַפְּנִימִית
  choice: भीतर की ओर
  rationale: मूल में विशेषण ‘भीतरी’ है, पर उससे संबद्ध संज्ञा व्यक्त नहीं हुई। यह अनुवाद दिशा बचाता है और ‘आँगन’ जैसी अनकही संज्ञा मुख्य पाठ में नहीं जोड़ता।
- source_word: דֶּרֶךְ אַמָּה אֶחָת
  choice: एक हाथ चौड़ा रास्ता
  rationale: व्यंजनात्मक मसोरेटी पाठ का सीधा अर्थ ‘एक हाथ का रास्ता’ है; संदर्भ से ‘चौड़ा’ स्पष्ट किया गया है, जबकि पाठ की कठिनाई पाद-टिप्पणी में बताई गई है।
- source_word: וּפִתְחֵיהֶם לַצָּפוֹן
  choice: उनके प्रवेश-द्वार उत्तर की ओर थे
  rationale: बहुवचन प्रत्यय और दिशा दोनों सुरक्षित हैं; हिन्दी में यह स्थापत्य अभिमुखता स्वाभाविक रूप से व्यक्त करता है।
