  yaml_path: translation/ot/ezekiel/042/018.yaml
  text: 'He measured the south side: five hundred reeds by the measuring reed[a].'
translation:
  language: hi
  text: उसने दक्षिणी भाग को मापा—मापने के बाँस से पाँच सौ बाँस[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: कुछ पांडुलिपियों और प्राचीन अनुवादों में इस माप के संदर्भ में ‘बाँस’ के स्थान पर ‘हाथ’ है; मसोराई पाठ में ‘बाँस’ है।
    reason: textual_variant
lexical_decisions:
- source_word: ר֥וּחַ הַ/דָּר֖וֹם
  choice: दक्षिणी भाग
  rationale: רוּחַ का अर्थ हवा, दिशा या ओर/भाग हो सकता है। भवन-परिसर की सीमाएँ मापने के इस प्रसंग में यह दक्षिणी ओर या भाग को दर्शाता है, न कि दक्षिणी हवा को।
- source_word: מָדָ֑ד
  choice: उसने ... मापा
  rationale: מדד का सामान्य अर्थ ‘मापना’ है। कर्ता पिछले प्रसंग में बताया गया मापने वाला पुरुष है, इसलिए हिन्दी में ‘उसने’ स्वाभाविक है।
- source_word: חֲמֵשׁ מֵא֥וֹת
  choice: पाँच सौ
  rationale: मूल इब्रानी की मानक संख्या-अभिव्यक्ति।
- source_word: קָנִ֖ים
  choice: बाँस
  rationale: קָנֶה मूलतः सरकंडे या बाँस जैसी मापने की छड़ को दर्शाता है और यहेजकेल के दर्शन में लंबाई की इकाई के रूप में प्रयुक्त है। हिन्दी बाइबलीय स्थापत्य प्रसंग में ‘बाँस’ संक्षिप्त और सुबोध है; ‘हाथ’ कुछ पाठ-परंपराओं का वैकल्पिक पाठ है, मसोराई पाठ का नहीं।
- source_word: בִּ/קְנֵ֥ה הַ/מִּדָּֽה
  choice: मापने के बाँस से
  rationale: 'यहाँ ב साधन सूचक है: माप निर्धारित माप-बाँस के द्वारा लिया गया। ‘मापने के बाँस से’ आधुनिक हिन्दी में स्वाभाविक है।'
