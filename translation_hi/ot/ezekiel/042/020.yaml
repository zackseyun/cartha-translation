base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/042/020.yaml
  text: He measured it on the four sides[a]; it had a wall all around, five hundred cubits long and five hundred cubits wide[b], to make a separation between the holy and the common.
translation:
  language: hi
  text: उसने उसे चारों दिशाओं में मापा[a]। उसके चारों ओर एक दीवार थी। उसकी लंबाई पाँच सौ और चौड़ाई पाँच सौ थी[b], पवित्र और सामान्य के बीच भेद करने के लिए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “चार हवाओं/दिशाओं की ओर”; इस स्थापत्य प्रसंग में, चारों दिशाओं में या चारों ओर से।
    reason: lexical_alternative
  - marker: b
    text: इस पद के इब्रानी पाठ में माप की इकाई नहीं दी गई है। संदर्भ के आधार पर इसे पाँच सौ हाथ लंबा और पाँच सौ हाथ चौड़ा समझा जाता है।
    reason: implicit_measurement_unit
lexical_decisions:
- source_word: לְאַרְבַּע רוּחוֹת
  choice: चारों दिशाओं में
  rationale: רוּחוֹת का शाब्दिक अर्थ ‘हवाएँ’ भी हो सकता है, पर स्थापत्य और माप के इस प्रसंग में यह चार दिशाओं या ओरों को सूचित करता है।
- source_word: מְדָדוֹ
  choice: उसने उसे नापा
  rationale: यह 3 पुं. एक. कर्ता और 3 पुं. एक. कर्म-प्रत्यय वाला क्रियारूप है; संदर्भ में कर्म पूर्ववर्णित परिसर या क्षेत्र है।
- source_word: חוֹמָה לוֹ סָבִיב סָבִיב
  choice: उसके चारों ओर एक दीवार थी
  rationale: दोहराया गया סָבִיב दीवार के पूरी तरह चारों ओर होने पर बल देता है; हिंदी में यह वाक्य उसी अर्थ को स्वाभाविक रूप से व्यक्त करता है।
- source_word: אֹרֶךְ חֲמֵשׁ מֵאוֹת וְרֹחַב חֲמֵשׁ מֵאוֹת
  choice: उसकी लंबाई पाँच सौ और चौड़ाई पाँच सौ थी
  rationale: इब्रानी पाठ इस पद में माप की इकाई स्पष्ट नहीं करता, इसलिए मुख्य पाठ में ‘हाथ’ नहीं जोड़ा गया; संदर्भ से इकाई समझी जा सकती है और टिप्पणी में इसे स्पष्ट किया गया है।
- source_word: לְהַבְדִּיל
  choice: ताकि ... भेद किया जाए
  rationale: इनफ़िनिटिव यहाँ उद्देश्य व्यक्त करता है; यह रूप दीवार के प्रयोजन को स्पष्ट और स्वाभाविक हिंदी में रखता है।
- source_word: בֵּין הַקֹּדֶשׁ לְחֹל
  choice: पवित्र और सामान्य के बीच
  rationale: חֹל का आशय यहाँ अपवित्र या दुष्ट से अनिवार्यतः नहीं, बल्कि उस चीज़ से है जो पवित्र उपयोग के लिए अलग नहीं की गई; ‘सामान्य’ इस धार्मिक-विधिक विरोध को सुरक्षित रखता है।
theological_decisions:
- issue: קֹדֶשׁ और חֹל के बीच धार्मिक-विधिक भेद
  choice: पवित्र और सामान्य
  alternative: पवित्र और अपवित्र
  rationale: यहाँ मुख्य विषय पवित्र स्थान और गैर-पवित्र, सामान्य स्थान का वर्गीय भेद है, नैतिक बुराई नहीं। ‘अपवित्र’ हिंदी में दूषण या अशुद्धता का अधिक प्रबल अर्थ दे सकता है।
- issue: माप की अनुल्लिखित इकाई
  choice: मुख्य पाठ में इकाई न जोड़ना
  alternative: पाँच सौ हाथ लंबी और पाँच सौ हाथ चौड़ी
  rationale: इस पद के इब्रानी पाठ में केवल ‘पाँच सौ’ है। निकटवर्ती संदर्भ माप की इकाई प्रदान कर सकता है, पर उसे मुख्य पाठ में जोड़ना निहित सूचना को स्पष्ट सूचना बना देता; इसलिए इसे पादटिप्पणी में रखा गया है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। छोटे वाक्यों से स्थापत्य विवरण स्पष्ट किया गया है। ‘सामान्य’ को धार्मिक-विधिक अर्थ में प्रयुक्त किया गया है, अर्थात जो पवित्र उपयोग के लिए अलग नहीं किया गया।
