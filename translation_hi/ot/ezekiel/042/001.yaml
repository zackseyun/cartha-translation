base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/042/001.yaml
  text: Then he brought me out into the outer court by the way toward the north[b][a], and he brought me to the chamber that was opposite the separate area and opposite the building to the north.
translation:
  language: hi
  text: फिर वह मुझे बाहरी आँगन में, उत्तर की ओर के मार्ग से बाहर ले गया[a]; और वह मुझे उस कक्ष तक ले आया, जो अलग क्षेत्र[b] के सामने और उत्तर की ओर की इमारत के सामने था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से ‘मार्ग, उत्तर का मार्ग’ है; यह दिशा बताने वाला मुहावरा है।
    reason: lexical_alternative
  - marker: b
    text: या ‘अलग स्थान’। इब्रानी शब्द यहेजकेल के मंदिर-दर्शन में एक पृथक क्षेत्र को दर्शाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיּוֹצִאֵנִי
  choice: वह मुझे बाहर...ले गया
  rationale: יצא के हिफ़ील रूप का अर्थ किसी को बाहर ले जाना है; हिन्दी में यह प्रयोग स्वाभाविक रूप से गति और कारणवाचक भाव दोनों व्यक्त करता है।
- source_word: הֶחָצֵר הַחִיצוֹנָה
  choice: बाहरी आँगन
  rationale: मन्दिर-परिसर के חָצֵר के लिए ‘आँगन’ सहज और स्पष्ट है, और הַחִיצוֹנָה उसका बाहरी होना बताता है।
- source_word: הַדֶּרֶךְ דֶּרֶךְ הַצָּפוֹן
  choice: उत्तर की ओर जानेवाले मार्ग से
  rationale: दोहराया हुआ דֶּרֶךְ दिशासूचक मुहावरा है। हिन्दी में शब्दशः पुनरावृत्ति के बजाय यह रूप मार्ग और दिशा दोनों को स्पष्ट रखता है।
- source_word: וַיְבִאֵנִי
  choice: वह मुझे...ले आया
  rationale: בוא के हिफ़ील रूप में ‘लाना/ले आना’ का अर्थ है। ‘कक्ष के पास ले आया’ भीतर प्रवेश को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: הַלִּשְׁכָּה
  choice: कक्ष
  rationale: मन्दिर की वास्तुकला में לִשְׁכָּה एक विशेष कमरे या कक्ष को दर्शाता है; एकवचन मूल पाठ के अनुरूप रखा गया है।
- source_word: נֶגֶד
  choice: के सामने
  rationale: यह स्थानिक आमने-सामने होने का स्वाभाविक हिन्दी रूप है और दोनों प्रयोगों में समान रखा गया है।
- source_word: הַגִּזְרָה
  choice: अलग किया हुआ क्षेत्र
  rationale: גִּזְרָה यहाँ मन्दिर-दर्शन के एक पृथक किए गए भाग को सूचित करता है। यह अनुवाद उस स्थानिक अर्थ को रखता है, पर किसी संप्रदायगत तकनीकी अर्थ को नहीं जोड़ता।
- source_word: הַבִּנְיָן
  choice: इमारत
  rationale: בִּנְיָן के सामान्य वास्तु-संबंधी अर्थ का सीधा और आधुनिक हिन्दी समतुल्य है।
- source_word: אֶל הַצָּפוֹן
  choice: उत्तर की ओर
  rationale: अंतिम दिशासूचक पद को कक्ष तक पहुँचने और उसके स्थान से जोड़ा गया है; इससे हिब्रू की संक्षिप्त स्थानिक रचना को किसी एक संज्ञा से अत्यधिक कठोरता से नहीं बाँधा गया।
