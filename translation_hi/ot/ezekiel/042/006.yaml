base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/042/006.yaml
  text: For they were in three stories[a], and they had no pillars like the pillars of the courts; therefore the upper stories receded more than the lower and middle ones from the ground.
translation:
  language: hi
  text: क्योंकि वे तीन मंज़िलों में बनी थीं, और उनमें आँगनों के खंभों जैसे खंभे नहीं थे; इसलिए ऊपरी मंज़िलें निचली और बीच की मंज़िलों की अपेक्षा भूमि से अधिक पीछे हटी हुई थीं[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “पीछे हटाई गई थीं” अथवा “कम कर दी गई थीं”; यहाँ प्रयुक्त इब्रानी क्रिया दुर्लभ है और इसका सटीक स्थापत्य अर्थ अनिश्चित है।
    reason: lexical_alternative
