- source_word: נֶאֱצַל
  choice: पीछे हटी हुई थी
  rationale: दुर्लभ क्रिया के संभावित स्थापत्य अर्थ—ऊपरी भाग का भीतर या पीछे होना—को व्यक्त करता है, जबकि विकल्प पादटिप्पणी में दिए गए हैं।
- source_word: מֵהַתַּחְתּוֹנוֹת וּמֵהַתִּיכֹנוֹת
