  text: וְ/כִלָּ֗ה אֶת מִדּוֹת֙ הַ/בַּ֣יִת הַ/פְּנִימִ֔י וְ/הוֹצִיאַ֨/נִי֙ דֶּ֣רֶךְ הַ/שַּׁ֔עַר אֲשֶׁ֥ר פָּנָ֖י/ו דֶּ֣רֶךְ הַ/קָּדִ֑ים וּ/מְדָד֖/וֹ סָבִ֥יב סָבִֽיב־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/042/015.yaml
  text: When he had finished measuring the inner house[a], he brought me out by way of the gate that faced east[b], and he measured it all around.
translation:
  language: hi
  text: जब वह भीतरी भवन[a] की नाप ले चुका था, तब वह मुझे उस फाटक के रास्ते बाहर ले गया जिसका मुख पूर्व की ओर था[b], और उसने उसे चारों ओर से नापा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से “भीतरी घर”; मंदिर-दर्शन के इस संदर्भ में “घर” पवित्र भवन को सूचित करता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से “वह फाटक जिसका मुख पूर्व की ओर था।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִלָּה אֶת מִדּוֹת
  choice: जब वह ... की नाप पूरी कर चुका
  rationale: כלה पूर्ण करने का और מִדּוֹת नाप/माप का बोध देता है। हिन्दी में कालवाचक आश्रित वाक्य कथा के क्रम और पहले कार्य की पूर्णता को स्वाभाविक रूप से व्यक्त करता है।
- source_word: הַבַּיִת הַפְּנִימִי
  choice: भीतरी भवन
  rationale: בַּיִת का मूल अर्थ ‘घर/भवन’ है; मंदिर-दर्शन के स्थापत्य संदर्भ में ‘भीतरी भवन’ मूल शब्द के निकट रहते हुए सामान्य हिन्दी पाठक के लिए उपयुक्त है।
- source_word: וְהוֹצִיאַנִי
  choice: वह मुझे ... बाहर ले गया
  rationale: יצא का हिफ़ईल रूप किसी को बाहर ले जाने या निकालने का कारणात्मक अर्थ रखता है।
- source_word: דֶּרֶךְ הַשַּׁעַר
  choice: फाटक के रास्ते
  rationale: דֶּרֶךְ यहाँ निकलने के मार्ग को सूचित करता है; ‘के रास्ते’ हिन्दी में इस संबंध को सहज ढंग से व्यक्त करता है।
- source_word: אֲשֶׁר פָּנָיו דֶּרֶךְ הַקָּדִים
  choice: जिसका मुख पूर्व की ओर था
  rationale: פָּנָיו का शाब्दिक अर्थ ‘उसका मुख/सामना’ है और पूरा पदबंध फाटक की पूर्वाभिमुख दिशा बताता है।
- source_word: וּמְדָדוֹ
  choice: और उसने उसे ... नापा
  rationale: पुल्लिंग एकवचन प्रत्यय का संभावित पूर्वपद भवन/मंदिर-परिसर है। ‘उसे’ मूल की सर्वनामिक अस्पष्टता को बनाए रखता है, यद्यपि संदर्भ में भवन या पूरे परिसर का संकेत संभव है।
- source_word: סָבִיב סָבִיב
  choice: चारों ओर से
  rationale: दोहराया गया סָבִיב पूरे घेरे या हर ओर नापे जाने पर बल देता है; ‘चारों ओर से’ इसका स्वाभाविक हिन्दी रूप है।
theological_decisions:
- issue: וּמְדָדוֹ में सर्वनाम का संदर्भ
  choice: उसे
  alternative: पूरे मंदिर-परिसर को
  rationale: हिब्रू पाठ केवल पुल्लिंग एकवचन प्रत्यय देता है और संदर्भ को स्पष्ट नाम से नहीं दोहराता। इसलिए अनुवाद में संदर्भ को निश्चित कर देने के बजाय मूल अस्पष्टता सुरक्षित रखी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण स्थापत्य भाषा अपनाई गई है। ‘भवन’ मूल ‘घर’ के निकट है, जबकि पाद-टिप्पणी मंदिर-दर्शन के संदर्भ को स्पष्ट करती है। सर्वनाम ‘उसे’ जानबूझकर रखा गया है ताकि हिब्रू में उसके संदर्भ की वास्तविक अस्पष्टता बनी रहे।
