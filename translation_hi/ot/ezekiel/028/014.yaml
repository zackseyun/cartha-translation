  text: אַ֨תְּ כְּר֔וּב מִמְשַׁ֖ח הַ/סּוֹכֵ֑ךְ וּ/נְתַתִּ֗י/ךָ בְּ/הַ֨ר קֹ֤דֶשׁ אֱלֹהִים֙ הָיִ֔יתָ בְּ/ת֥וֹךְ אַבְנֵי אֵ֖שׁ הִתְהַלָּֽכְתָּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/028/014.yaml
  text: You were an anointed guardian cherub[a], and I placed you on the holy mountain of God[b]; you walked in the midst of stones of fire.
translation:
  language: hi
  text: तू[b] अभिषिक्त संरक्षक करूब था[a], और मैंने तुझे परमेश्वर के पवित्र पर्वत पर रखा; तू वहाँ था; तू आग के पत्थरों के बीच चलता-फिरता था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अभिषिक्त करूब, जो ढाँपता है”; परंपरागत रूप से, “अभिषिक्त ढाँपनेवाला करूब।”
    reason: lexical_alternative
  - marker: b
    text: इब्रानी पाठ में आरम्भिक सर्वनाम “तू” स्त्रीलिंग रूप में है, जबकि आस-पास की क्रियाएँ और प्रत्यय पुल्लिंग हैं; अर्थ फिर भी एकवचन “तू” ही है।
    reason: textual_variant
lexical_decisions:
- source_word: כְּרוּב
  choice: करूब
  rationale: यह एकवचन संज्ञा स्वर्गीय सिंहासन-रक्षक प्राणी को दर्शाती है। हिन्दी बाइबलीय प्रयोग में ‘करूब’ इस विशिष्ट चित्र को बनाए रखता है; सामान्य शब्द ‘स्वर्गदूत’ इसे अनावश्यक रूप से व्यापक कर देता।
- source_word: מִמְשַׁח
  choice: अभिषिक्त
  rationale: यह शब्द अभिषेक से संबंधित है और यहाँ करूब का विशेषण बनकर उसके अभिषिक्त या समर्पित होने का भाव देता है।
- source_word: הַסּוֹכֵךְ
  choice: संरक्षक
  rationale: सכך का मूल भाव ढकना, छाया करना या आश्रय देना है। करूब के पवित्र स्थान पर छाया करने के चित्र में ‘संरक्षक’ उसका कार्य स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है; अधिक शाब्दिक विकल्प पाद-टिप्पणी में रखा गया है।
- source_word: וּנְתַתִּיךָ
  choice: और मैंने तुझे वहाँ रखा था
  rationale: נתן का अर्थ देना, रखना या ठहराना हो सकता है। यहाँ स्थान-संबंधी प्रसंग में ‘रखा’ उपयुक्त है; हिन्दी में वाक्य को स्वाभाविक बनाने के लिए ‘वहाँ’ निहित स्थान-संदर्भ को व्यक्त करता है।
- source_word: בְּהַר קֹדֶשׁ אֱלֹהִים
  choice: परमेश्वर के पवित्र पर्वत पर
  rationale: यह रचना पवित्र, परमेश्वर-संबंधी पर्वत का ऊँचा और पवित्र-स्थान वाला चित्र बिना अतिरिक्त व्याख्या के बनाए रखती है।
- source_word: הָיִיתָ
  choice: तू ... था
  rationale: היה का साधारण भूतकाल है। इसे अलग से व्यक्त करने पर इब्रानी पाठ में ‘रखा’ और ‘था’ दोनों क्रियाएँ सुरक्षित रहती हैं।
- source_word: בְּתוֹךְ אַבְנֵי אֵשׁ
  choice: आग के पत्थरों के बीच
  rationale: शाब्दिक रूप उस रहस्यमय और काव्यात्मक चित्र को बनाए रखता है; ‘अग्निमय पत्थर’ अधिक सहज है, पर मूल संबंध को कुछ समतल कर देता है।
- source_word: הִתְהַלָּכְתָּ
  choice: चलता-फिरता था
  rationale: הלך का हित्पएल रूप इधर-उधर या निरंतर चलने का भाव दे सकता है। ‘चलता-फिरता था’ आधुनिक हिन्दी में उस गतिशीलता को सहज रूप से व्यक्त करता है।
- source_word: אַתְּ
  choice: तू
  rationale: लिखित रूप स्त्रीलिंग एकवचन है, जबकि आसपास की क्रियाएँ और प्रत्यय पुल्लिंग एकवचन हैं। सम्बोधन एक ही व्यक्ति से है, इसलिए हिन्दी में एकवचन ‘तू’ और प्रसंगानुसार पुल्लिंग क्रिया रखी गई है; रूपगत असंगति पाद-टिप्पणी में बताई गई है।
theological_decisions:
- issue: सोर के राजा के विलाप में सम्बोधित व्यक्ति की प्रकृति
  choice: करूब, परमेश्वर के पवित्र पर्वत और आग के पत्थरों की ऊँची, पवित्र-लोक संबंधी छवियों को बिना निर्णायक व्याख्या के सुरक्षित रखा गया है।
  alternative: इसे केवल सोर के राजा के लिए राजकीय रूपक, उसके पीछे किसी अलौकिक सत्ता का संकेत, अथवा दोहरे/प्रतिरूपात्मक संकेत के रूप में स्पष्ट करना।
  rationale: इब्रानी पद स्वयं अत्यंत ऊँची और रहस्यमय पवित्र छवि का प्रयोग करता है, पर इस पद में उसके संदर्भ को किसी एक धर्मवैज्ञानिक व्याख्या तक सीमित नहीं करता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, गरिमापूर्ण किंतु साधारण पाठक के लिए सुबोध रखी गई है। ‘करूब’ जैसी विशिष्ट बाइबलीय संज्ञा सुरक्षित है। इब्रानी में ונתתיך और היית दोनों को व्यक्त करने के लिए दो निकटवर्ती वाक्य रखे गए हैं, जिससे मूल की पुनरुक्ति और संरचना अनावश्यक रूप से न मिटे।
