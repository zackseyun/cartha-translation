base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/028/008.yaml
  text: They will bring you down to the pit[c][b][a], and you will die the death of one slain in the heart of the seas.
translation:
  language: hi
  text: वे तुझे गड्ढे[a] में उतार देंगे, और तू समुद्रों के बीचोंबीच[c] मारे गए व्यक्ति की-सी मौत[b] मरेगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “कब्र में” अथवा “विनाश में”; इब्रानी में “गड्ढे में”।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में शाब्दिक रूप से “मारे गए की मौतें”; यह हिंसक मृत्यु के लिए एक मुहावरा है।
    reason: lexical_alternative
  - marker: c
    text: या “समुद्रों के मध्य में”; इब्रानी में शाब्दिक रूप से “समुद्रों के हृदय में”।
    reason: lexical_alternative
lexical_decisions:
- source_word: לַשַּׁחַת
  choice: गड्ढे में
  rationale: שַׁחַת गड्ढे, कब्र या विनाश का बोध करा सकता है। ירד के कारक रूप के साथ ‘गड्ढे में’ नीचे उतारे जाने की ठोस छवि बनाए रखता है और किसी विशिष्ट परलोक-संबंधी धारणा को आरोपित नहीं करता।
- source_word: יוֹרִדוּךָ
  choice: वे तुझे ... उतार देंगे
  rationale: हिफ़ील रूप का कारक अर्थ ‘वे तुझे नीचे उतार देंगे’ है। हिन्दी में यह स्वाभाविक है और मूल से अधिक हिंसा नहीं जोड़ता।
- source_word: וָמַתָּה
  choice: और तू ... मरेगा
  rationale: भविष्यसूचक प्रसंग में यह आगामी मृत्यु बताता है; ‘मरेगा’ आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: מְמוֹתֵי חָלָל
  choice: मारे गए मनुष्य जैसी मौत
  rationale: शाब्दिक रूप ‘मारे गए की मौतें’ एक इब्रानी मुहावरा है, जो हिंसक मृत्यु का संकेत देता है। हिन्दी वाक्यांश उस अर्थ और मारे जाने की छवि दोनों को सुरक्षित रखता है।
- source_word: חָלָל
  choice: मारे गए मनुष्य
  rationale: חָלָל सामान्यतः मारे गए या घातक रूप से घायल व्यक्ति को सूचित करता है। यहाँ एकवचन संबोधन के अनुरूप यह अभिव्यक्ति सहज है।
- source_word: בְּלֵב יַמִּים
  choice: समुद्रों के बीचोंबीच
  rationale: לֵב का शाब्दिक अर्थ ‘हृदय’ है, पर स्थानवाचक मुहावरे में इसका अर्थ मध्य या बीच होता है। ‘बीचोंबीच’ आधुनिक हिन्दी में स्वाभाविक है और सोर की समुद्री पृष्ठभूमि को स्पष्ट रखता है।
theological_decisions:
- issue: क्या שַׁחַת का अनुवाद किसी धर्मवैज्ञानिक रूप से अधिक विशिष्ट अधोलोक-संबंधी शब्द से किया जाए
  choice: गड्ढे में
  alternative: कब्र में / विनाश में / अथाह कुंड में
  rationale: यह पद न्याय और मृत्यु की बात करता है, किंतु שַׁחַת यहाँ किसी निश्चित परलोक-सिद्धांत की माँग नहीं करता। ‘गड्ढा’ मूल की ठोस छवि को बिना अतिरिक्त धर्मवैज्ञानिक अर्थ जोड़े सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सीधा भविष्यसूचक संबोधन रखा गया है। ‘तू/तुझे’ एकवचन राजकीय संबोधन और मूल के द्वितीय पुरुष पुल्लिंग एकवचन को बनाए रखता है। मुख्य पाठ में सहजता के लिए ‘बीचोंबीच’ है, जबकि पादटिप्पणी मूल ‘हृदय’ रूपक को दर्ज करती है।
