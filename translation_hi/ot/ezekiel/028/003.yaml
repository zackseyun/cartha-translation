  text: הִנֵּ֥ה חָכָ֛ם אַתָּ֖ה מ/דנאל כָּל סָת֖וּם לֹ֥א עֲמָמֽוּ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/028/003.yaml
  text: Look[a], you are wiser than Danel; no hidden thing is obscure to you.
translation:
  language: hi
  text: देख, तू दानेल[a] से भी अधिक बुद्धिमान है; कोई भी छिपी बात तेरे लिए अस्पष्ट नहीं है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में ‘दानेल’; परंपरागत रूप से ‘दानिय्येल।’ यहाँ की वर्तनी में वह योद अक्षर नहीं है जो अधिक परिचित नाम में मिलता है।
    reason: alternative_reading
lexical_decisions:
- source_word: הִנֵּה
  choice: देख
  rationale: यह शब्द कथन पर जोर देते हुए ध्यान खींचता है। आधुनिक हिन्दी में ‘देख’ इसकी संकेतात्मक और बलात्मक शक्ति को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: חָכָם ... מ/דנאל
  choice: दानेल से भी अधिक बुद्धिमान
  rationale: विशेषण ‘बुद्धिमान’ के साथ מ तुलना दर्शाता है; इसलिए हिन्दी में तुलनात्मक अर्थ ‘से भी अधिक बुद्धिमान’ स्पष्ट किया गया है।
- source_word: דנאל
  choice: दानेल
  rationale: मसोरेटी पाठ में नाम की वर्तनी דנאל है, जिसमें परिचित דניאל का योध नहीं है। इसलिए मुख्य पाठ में स्रोत-रूप ‘दानेल’ सुरक्षित रखा गया है।
- source_word: כָּל סָתוּם
  choice: कोई भी छिपी बात
  rationale: यह वाक्यांश हर छिपी या बंद रखी हुई वस्तु/बात को समष्टिगत रूप से नकारता है। ‘कोई भी छिपी बात’ हिन्दी में स्वाभाविक रहते हुए मूल अर्थ बनाए रखता है।
- source_word: לֹא עֲמָמוּךָ
  choice: तेरे लिए अस्पष्ट नहीं है
  rationale: क्रिया केवल छिपाने के बजाय धुँधला या समझ से परे होने का भाव देती है। ‘अस्पष्ट नहीं’ पिछली ‘छिपी बात’ से भेद भी बनाए रखता है।
theological_decisions:
- issue: दानेल की पहचान
  choice: मुख्य पाठ में ‘दानेल’
  alternative: ‘दानिय्येल’
  rationale: पद की वर्तनी परिचित बाइबलीय नाम דניאל से भिन्न है। व्यक्ति की पहचान निश्चित मानकर तय करने के बजाय वास्तविक पाठ-भेद को मुख्य पाठ और पाद-टिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सीधे संबोधन वाली हिन्दी। ‘तू/तेरे’ संदर्भ के राजकीय अभिमान पर भविष्यवाणी के तीखे, एकवचन संबोधन को बनाए रखते हैं; भाषा अनावश्यक रूप से पुरातन नहीं है।
