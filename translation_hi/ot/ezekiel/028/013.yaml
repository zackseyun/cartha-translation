source:
  edition: WLC
  text: בְּ/עֵ֨דֶן גַּן אֱלֹהִ֜ים הָיִ֗יתָ כָּל אֶ֨בֶן יְקָרָ֤ה מְסֻכָתֶ֨/ךָ֙ אֹ֣דֶם פִּטְדָ֞ה וְ/יָהֲלֹ֗ם תַּרְשִׁ֥ישׁ שֹׁ֨הַם֙ וְ/יָ֣שְׁפֵ֔ה סַפִּ֣יר נֹ֔פֶךְ וּ/בָרְקַ֖ת וְ/זָהָ֑ב מְלֶ֨אכֶת תֻּפֶּ֤י/ךָ וּ/נְקָבֶ֨י/ךָ֙ בָּ֔/ךְ בְּ/י֥וֹם הִבָּרַאֲ/ךָ֖ כּוֹנָֽנוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/028/013.yaml
  text: 'You were in Eden[a], the garden of God; every precious stone was your covering: ruby, topaz, and diamond; beryl, onyx, and jasper; sapphire, turquoise, and emerald; and gold. The workmanship of your tambourines and your sockets was in you; on the day you were created[b], they were prepared.'
translation:
  language: hi
  text: तू अदन में, परमेश्वर की वाटिका में था। हर बहुमूल्य रत्न तेरा आवरण था—माणिक, पुखराज और हीरा; बेरिल, सुलेमानी और यशब; नीलम, फ़िरोज़ा और पन्ना; और सोना।[a] तेरी डफों और तेरे खाँचों की कारीगरी तुझमें थी; जिस दिन तू रचा गया, उस दिन वे तैयार किए गए थे।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इस पद में आए कई रत्नों की सटीक पहचान अनिश्चित है; प्राचीन रत्न-नाम आधुनिक खनिज-नामों से हमेशा ठीक-ठीक मेल नहीं खाते। ‘माणिक’ के लिए ‘लाल अकीक’, ‘पुखराज’ या ‘बेरिल’ के लिए ‘पीतमणि’, ‘नीलम’ के लिए ‘लाजवर्द’, तथा ‘फ़िरोज़ा’ या ‘पन्ना’ के लिए ‘कारबंकल’ भी सम्भव विकल्प माने गए हैं।
    reason: lexical_alternative
  - marker: b
    text: 'इस कठिन इब्रानी वाक्यांश का अनुवाद यह भी हो सकता है: “तेरी जड़ाइयों और तेरे मढ़ावों की कारीगरी तुझमें थी”; इस अर्थ में शब्द वाद्ययंत्रों के बजाय आभूषण बनाने की कला को सूचित करते हैं।'
    reason: alternative_reading
lexical_decisions:
- source_word: בְּעֵדֶן גַּן אֱלֹהִים
  choice: अदन में, परमेश्वर की वाटिका में
  rationale: मूल के समानाधिकरणात्मक ढाँचे और पवित्र, उदात्त परिवेश को बनाए रखता है। ‘वाटिका’ आधुनिक पाठक के लिए बोधगम्य होने के साथ गरिमापूर्ण है।
- source_word: כָּל אֶבֶן יְקָרָה מְסֻכָתֶךָ
  choice: हर बहुमूल्य रत्न तेरा आवरण था
  rationale: אֶבֶן יְקָרָה को स्वाभाविक हिन्दी में ‘बहुमूल्य रत्न’ और מְסֻכָתֶךָ को ‘आवरण’ कहा गया है, जिससे वस्त्र, अलंकरण या ढकाव के बीच की अर्थगत खुलावट बनी रहती है।
- source_word: אֹדֶם פִּטְדָה וְיָהֲלֹם
  choice: माणिक, पुखराज और हीरा
  rationale: परिचित हिन्दी रत्न-नाम चुने गए हैं; प्राचीन नामों की सटीक आधुनिक पहचान अनिश्चित है और इसे पादटिप्पणी में स्पष्ट किया गया है।
- source_word: תַּרְשִׁישׁ שֹׁהַם וְיָשְׁפֵה
  choice: बेरिल, सुलेमानी और यशब
  rationale: ये क्रमशः प्रचलित या पारंपरिक समतुल्य हैं। ‘बेरिल’ खनिज-नाम को सुरक्षित रखता है, ‘सुलेमानी’ onyx का सहज हिन्दी नाम है, और ‘यशब’ jasper का स्थापित बाइबिलीय रूप है।
- source_word: סַפִּיר נֹפֶךְ וּבָרְקַת וְזָהָב
  choice: नीलम, फ़िरोज़ा और पन्ना; और सोना
  rationale: परिचित आधुनिक हिन्दी नामों से सूची पठनीय रहती है, जबकि प्राचीन रत्न-शब्दों की अनिश्चितता पादटिप्पणी में सुरक्षित है।
- source_word: מְלֶאכֶת תֻּפֶּיךָ וּנְקָבֶיךָ בָּךְ
  choice: तेरी डफों और तेरे खाँचों की कारीगरी तुझमें ही थी
  rationale: 'कठिन मसोरी पाठ को अपेक्षाकृत औपचारिक रूप में रखा गया है: תֻפֶּיךָ को ‘डफों’ और נְקָבֶיךָ को ‘खाँचों’ के रूप में। आभूषण-जड़ाई वाला वैकल्पिक अर्थ पादटिप्पणी में दिया गया है।'
- source_word: בְּיוֹם הִבָּרַאֲךָ כּוֹנָנוּ
  choice: जिस दिन तू रचा गया, उसी दिन वे तैयार किए गए थे
  rationale: निष्क्रिय सृष्टि-भाषा और बहुवचन क्रिया ‘वे तैयार किए गए’ दोनों सुरक्षित हैं; ‘उसी दिन’ समयगत बल को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: यहेजकेल 28:13 में संबोधित व्यक्ति की पहचान
  choice: अदन, परमेश्वर की वाटिका और रचे जाने की भाषा को सीधे अनूदित किया गया है, पर संबोधित व्यक्ति को शैतान, केवल सोर का राजा, या किसी पौराणिक पात्र के रूप में अनुवाद के भीतर नहीं पहचाना गया।
  alternative: पद को केवल सोर के मानवीय राजा के लिए अतिशयोक्तिपूर्ण राजकीय चित्रण मानना, अथवा इसे शैतान/पतित करूब की ओर संकेत करने वाला दोहरा संदर्भ मानना।
  rationale: मूल पद स्वयं इस व्यापक व्याख्यात्मक विवाद का स्पष्ट समाधान नहीं करता; इसलिए अनुवाद उसकी अदनी और सृष्टि-संबंधी छवियों तथा धर्मवैचारिक तनाव को खुला रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण भविष्यद्वाणी-शैली रखी गई है। संबोधन के लिए एकवचन ‘तू/तेरा’ मूल के पुल्लिंग एकवचन को स्पष्ट करता है। रत्नों के परिचित हिन्दी नामों को प्राथमिकता दी गई है, और जहाँ आवश्यक था वहाँ पारिभाषिक नाम रखा गया है।
