source:
  edition: WLC
  text: לָ/כֵ֗ן הִנְ/נִ֨י מֵבִ֤יא עָלֶ֨י/ךָ֙ זָרִ֔ים עָרִיצֵ֖י גּוֹיִ֑ם וְ/הֵרִ֤יקוּ חַרְבוֹתָ/ם֙ עַל יְפִ֣י חָכְמָתֶ֔/ךָ וְ/חִלְּל֖וּ יִפְעָתֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/028/007.yaml
  text: Therefore[a], behold, I am bringing strangers against you, the most ruthless of the nations; they will draw their swords against the beauty of your wisdom[c][b], and they will defile your splendor.
translation:
  language: hi
  text: इस कारण देख, मैं तेरे विरुद्ध परदेशियों[a] को ला रहा हूँ—जातियों में सबसे क्रूर लोगों को। वे तेरी बुद्धि की सुंदरता के विरुद्ध अपनी तलवारें खींचेंगे[b] और तेरे वैभव को अपवित्र करेंगे[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘अजनबियों’।
    reason: lexical_alternative
  - marker: b
    text: या ‘अपनी तलवारें म्यान से निकालेंगे।’ शाब्दिक अर्थ है, ‘अपनी तलवारें खाली करेंगे।’
    reason: lexical_alternative
  - marker: c
    text: या ‘तेरी दीप्ति को अपवित्र करेंगे।’
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: इस कारण
  rationale: यह पूर्ववर्ती आरोप के परिणामस्वरूप आने वाले न्याय का संकेत देने वाला निष्कर्षसूचक संयोजक है।
- source_word: הִנְנִי
  choice: देख, मैं
  rationale: यह गंभीर और आसन्न ईश्वरीय घोषणा का भविष्यदर्शी सूत्र है; ‘देख’ उसके ध्यानाकर्षक और गरिमापूर्ण स्वर को बनाए रखता है।
- source_word: מֵבִיא עָלֶיךָ
  choice: तेरे विरुद्ध ... को ला रहा हूँ
  rationale: הִנְנִי के साथ कृदंत आसन्न भविष्य को सजीव वर्तमान की तरह व्यक्त करता है; ‘ला रहा हूँ’ उस पक्षगत बल को स्वाभाविक हिन्दी में रखता है।
- source_word: זָרִים
  choice: परदेशियों
  rationale: शब्द का अर्थ विदेशी या बाहरी लोग है; ‘परदेशी’ आधुनिक हिन्दी में स्वाभाविक है और न्याय के लिए बाहर से आने वालों का भाव स्पष्ट करता है।
- source_word: עָרִיצֵי גּוֹיִם
  choice: जातियों में सबसे क्रूर लोगों को
  rationale: עָרִיץ हिंसक, निर्दयी या आतंककारी व्यक्ति को दर्शाता है; यह अभिव्यक्ति निर्माण की विशेष तीव्रता को सहज हिन्दी में व्यक्त करती है।
- source_word: וְהֵרִיקוּ חַרְבוֹתָם
  choice: अपनी तलवारें खींचेंगे
  rationale: क्रिया का शाब्दिक अर्थ ‘खाली करना’ है, पर तलवारों के साथ इसका मुहावरेदार अर्थ उन्हें म्यान से निकालना है।
- source_word: עַל יְפִי חָכְמָתֶךָ
  choice: तेरी बुद्धि की सुंदरता पर
  rationale: मूल का संबंधवाचक काव्यात्मक रूप ज्यों का त्यों रखा गया है, जिससे प्रशंसित बुद्धि पर होने वाले आक्रमण की विडंबना बनी रहती है।
- source_word: וְחִלְּלוּ
  choice: अपवित्र करेंगे
  rationale: पिएल रूप किसी वस्तु की पवित्रता, प्रतिष्ठा या सम्मान को दूषित करने का भाव रखता है; यहाँ ‘अपवित्र’ उस जानबूझकर किए गए अपमान को बनाए रखता है।
- source_word: יִפְעָתֶךָ
  choice: तेरे वैभव
  rationale: संज्ञा चमक, दीप्ति और भव्य रूप को दर्शाती है; राजकीय संदर्भ में ‘वैभव’ व्यापक और स्वाभाविक विकल्प है।
theological_decisions:
- issue: सोर के शासक के विरुद्ध वचन का संदर्भ और स्वर
  choice: पद को संबोधित शासक के विरुद्ध ऐतिहासिक-भविष्यदर्शी न्याय के रूप में अनूदित किया गया है।
  alternative: भाषा को किसी ब्रह्मांडीय पतन या शैतान की ओर संकेत करने वाली प्रतिरूपात्मक अभिव्यक्ति मानना।
  rationale: इस पद में सीधे परदेशी आक्रमणकारियों, तलवारों, बुद्धि और वैभव की बात है। इसलिए मुख्य पाठ में विवादित बाद की पहचान आरोपित किए बिना तत्काल ऐतिहासिक अर्थ और संभावित व्यापक तनाव को खुला रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण भविष्यदर्शी शैली रखी गई है। एकवचन संबोधन के लिए ‘तेरे’ मूल के निकट और प्रत्यक्ष है। वाक्य-विन्यास सहज रखा गया है, जबकि ‘बुद्धि की सुंदरता’ जैसी मूल की काव्यात्मक अभिव्यक्ति सुरक्षित है।
