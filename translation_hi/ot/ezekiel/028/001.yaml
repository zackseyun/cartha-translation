  rationale: इब्रानी चतुरक्षरीय दिव्य नाम YHWH को हिन्दी में प्रचलित नामरूप ‘यहोवा’ से व्यक्त किया गया है; इसे केवल उपाधि ‘प्रभु’ से प्रतिस्थापित नहीं किया गया।
- source_word: אֵלַי
  choice: मेरे पास
  rationale: इस संदर्भ में אֶל और प्रथम पुरुष एकवचन प्रत्यय वचन के नबी तक पहुँचने की दिशा बताते हैं; ‘मेरे पास’ आधुनिक हिन्दी में स्वाभाविक है।
- source_word: לֵאמֹר
  choice: ':'
  rationale: यह रूप आगे आने वाले प्रत्यक्ष कथन का परिचय देता है। हिन्दी में उद्धरण आरम्भ होने से पहले विसर्ग-चिह्न इस कार्य को स्वाभाविक ढंग से करता है और अलग से ‘यह कहते हुए’ की कृत्रिमता से बचाता है।
theological_decisions:
- issue: दिव्य नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: मूल पाठ में व्यक्तिगत दिव्य नाम YHWH है। हिन्दी पाठकों में पहचाने जाने वाले नामरूप ‘यहोवा’ को मुख्य पाठ में रखा गया है, जबकि स्वरांकन की अनिश्चितता और परंपरागत उपाधि को पादटिप्पणी में बताया गया है।
