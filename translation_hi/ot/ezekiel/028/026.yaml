base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/028/026.yaml
  text: They will dwell on it securely, and they will build houses and plant vineyards. They will dwell securely when I execute judgments on all those who treat them with contempt all around them. Then they will know that I am the LORD their God.
translation:
  language: hi
  text: वे उस देश में निडर होकर बसेंगे, घर बनाएँगे और अंगूर के बाग लगाएंगे। जब मैं उनके चारों ओर रहने वाले उन सब लोगों पर न्याय करूँगा जो उनका तिरस्कार करते हैं, तब वे निडर होकर रहेंगे। तब वे जान लेंगे कि मैं ही याहवे, उनका परमेश्वर हूँ।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לָבֶטַח
  choice: निडर होकर
  rationale: यह पद सुरक्षित और भयमुक्त निवास का भाव व्यक्त करता है; स्वाभाविक आधुनिक हिन्दी में ‘निडर होकर’ इस आश्वासन को स्पष्ट रखता है।
- source_word: שְׁפָטִים
  choice: दंड
  rationale: बहुवचन ‘न्यायिक निर्णयों’ का आशय यहाँ शत्रुओं पर परमेश्वर के दंडात्मक न्याय को कार्यान्वित करना है; ‘दंड दूँगा’ सहज हिन्दी है।
- source_word: הַשָּׁאטִים
  choice: तिरस्कार करते हैं
  rationale: मूल क्रिया अवमानना या तुच्छ समझने का भाव रखती है; ‘तिरस्कार’ अर्थ को सीधे और गरिमापूर्ण ढंग से व्यक्त करता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: यह परमेश्वर का विशिष्ट इब्रानी नाम है; लिप्यंतरण इसे सामान्य उपाधि ‘प्रभु’ से अलग रखता है।
theological_decisions:
- issue: भूमि पर पुनर्स्थापना और सुरक्षा
  choice: ‘उस देश में निडर होकर बसेंगे’
  alternative: ‘उस पर सुरक्षित रहेंगे’
  rationale: स्त्रीलिंग प्रत्यय निकटवर्ती इस्राएल की भूमि की ओर संकेत करता है; ‘उस देश में’ हिन्दी में संदर्भ को स्वाभाविक बनाता है, जबकि पद के पुनर्स्थापना-संबंधी आशय को नहीं बढ़ाता।
- issue: परमेश्वर के न्याय और प्रजा की सुरक्षा का संबंध
  choice: ‘जब मैं ... दंड दूँगा, तब वे निडर होकर रहेंगे’
  alternative: ‘वे सुरक्षित रहेंगे क्योंकि मैं ... न्याय करूँगा’
  rationale: בַּעֲשׂוֹתִי का कालगत-संदर्भगत संबंध ‘जब’ से स्वाभाविक रूप में व्यक्त होता है और न्याय के परिणामस्वरूप सुरक्षा का संबंध सुरक्षित रहता है।
- issue: दिव्य नाम का अनुवाद
  choice: ‘याहवे’
  alternative: ‘यहोवा’ या ‘प्रभु’
  rationale: मूल पाठ में יהוה व्यक्तिगत वाचा-नाम है। ‘याहवे’ प्रचलित विद्वत्तापूर्ण लिप्यंतरण है और उपाधि के साथ उसका भेद बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी, सरल किंतु गरिमापूर्ण शैली। वाक्य-विन्यास को हिन्दी के लिए स्वाभाविक रखा गया है और मूल की दोहराई गई सुरक्षा, घर-बाग की ठोस छवियाँ तथा तिरस्कार करने वालों पर न्याय—सभी सुरक्षित हैं।
