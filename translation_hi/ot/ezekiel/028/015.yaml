source:
  edition: WLC
  text: תָּמִ֤ים אַתָּה֙ בִּ/דְרָכֶ֔י/ךָ מִ/יּ֖וֹם הִבָּֽרְאָ֑/ךְ עַד נִמְצָ֥א עַוְלָ֖תָ/ה בָּֽ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/028/015.yaml
  text: You were blameless in your ways from the day you were created[a], until unrighteousness was found in you.
translation:
  language: hi
  text: जिस दिन तुझे रचा गया, उस दिन से तू अपने चालचलन में निर्दोष[a] था, जब तक कि तुझमें अधर्म पाया गया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “अपने चालचलन में पूर्ण।” हिब्रानी शब्द पूर्णता, खराई या निर्दोषता का भाव दे सकता है; यहाँ नैतिक प्रसंग के कारण “निर्दोष” चुना गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: תָּמִים
  choice: निर्दोष
  rationale: नैतिक और मूल्यांकन-संबंधी संदर्भ में यह शब्द खराई और दोषरहित आचरण का भाव देता है; ‘निर्दोष’ पूर्ण तत्त्वगत सिद्धता का अनावश्यक दावा किए बिना प्रसंग के अनुकूल है।
- source_word: בִּדְרָכֶיךָ
  choice: अपने चालचलन में
  rationale: ‘मार्गों में’ का हिब्रानी मुहावरा यहाँ जीवन-व्यवहार को सूचित करता है; ‘चालचलन’ आधुनिक हिन्दी में इस आशय को स्वाभाविक रूप से व्यक्त करता है।
- source_word: מִיּוֹם הִבָּרְאָךְ
  choice: जिस दिन से तुझे रचा गया, उस दिन से
  rationale: यह रचना की घटना से आरम्भ होने वाली अवधि को स्पष्ट और स्वाभाविक हिन्दी में व्यक्त करता है तथा कर्मवाच्य भाव सुरक्षित रखता है।
- source_word: עַד
  choice: जब तक कि
  rationale: स्थिति में आए परिवर्तन की समय-सीमा बताने वाला सामान्य और सटीक हिन्दी संयोजक है।
- source_word: נִמְצָא
  choice: पाया गया
  rationale: कर्मवाच्य को बनाए रखता है और यह अस्पष्टता सुरक्षित रखता है कि अधर्म उत्पन्न हुआ या प्रकट होकर पहचाना गया।
- source_word: עַוְלָתָה
  choice: अधर्म
  rationale: गलतपन, अन्याय और नैतिक दुष्टता के व्यापक भाव को संक्षिप्त, गरिमापूर्ण और बोधगम्य हिन्दी में व्यक्त करता है।
- source_word: בָּךְ
  choice: तुझमें
  rationale: मूल पूर्वसर्गीय वाक्यांश का सीधा अनुवाद है और पाए गए अधर्म की आंतरिक अवस्थिति को बनाए रखता है।
theological_decisions:
- issue: תָּמִים को पूर्ण तत्त्वगत सिद्धता मान लेने की सम्भावना
  choice: निर्दोष
  alternative: सिद्ध
  rationale: प्रसंग व्यक्ति के चालचलन की नैतिक खराई की बात करता है। ‘निर्दोष’ हिब्रानी के अपेक्षित अर्थ को व्यक्त करता है, पर व्यापक धर्मवैज्ञानिक व्याख्याओं से निकला निरपेक्ष सिद्धता का दावा पाठ में नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सहज और शास्त्रीय प्रसंग के अनुकूल रूप। एकवचन संबोधन के लिए ‘तू/तुझे/तुझमें’ रखा गया है, जो निकटवर्ती भविष्यद्वाणी की प्रत्यक्ष संबोधन-शैली को सुरक्षित रखता है।
