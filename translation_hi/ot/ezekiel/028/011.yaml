- source_word: אֵלַי
  choice: मेरे पास
  rationale: यह यहेजकेल को ईश्वरीय वचन के प्राप्तकर्ता के रूप में स्पष्ट करता है और आधुनिक हिन्दी में स्वाभाविक है।
- source_word: לֵאמֹר
  choice: ':'
  rationale: यह इन्फिनिटिव आगे आने वाली सीधी ईश्वरीय वाणी का परिचय देता है; हिन्दी में पदांत का द्विबिंदु उसी कार्य को अधिक स्वाभाविक ढंग से निभाता है।
