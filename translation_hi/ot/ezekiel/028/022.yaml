  register: आधुनिक मानक हिन्दी का गंभीर भविष्यवाणीपरक स्तर रखा गया है। नगर को स्त्रीलिंग मानकर ‘तेरे’ और फिर ‘उसमें’ का प्रयोग मूल इब्रानी के पुरुष-परिवर्तन को दर्शाता है। ईश्वरीय नाम יהוה के लिए ‘यहोवा’ और संयुक्त उपाधि के लिए ‘प्रभु यहोवा’ प्रयुक्त है।
