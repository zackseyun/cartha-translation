base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/028/022.yaml
  text: 'and say[a], ‘Thus says the Lord GOD: Behold, I am against you, Sidon, and I will be glorified in your midst[b]. And they will know that I am Yahweh when I execute judgments in her and show myself holy in her.’'
translation:
  language: hi
  text: 'और कहना, ‘प्रभु यहोवा यों कहते हैं: हे सीदोन, देख, मैं तेरे विरुद्ध हूँ। मैं तेरे बीच महिमान्वित होऊँगा[a]। जब मैं उसमें न्याय के कार्य करूँगा और उसमें अपनी पवित्रता प्रकट करूँगा[b], तब वे जानेंगे कि मैं यहोवा हूँ।’'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मैं तेरे बीच महिमा पाऊँगा” अथवा “मैं तेरे बीच अपनी महिमा प्रकट करूँगा।” इब्रानी क्रिया परमेश्वर के सम्मानित होने और न्याय के द्वारा उसकी महिमा प्रकट होने—दोनों भावों को व्यक्त कर सकती है।
    reason: lexical_alternative
  - marker: b
    text: या, “मैं उसमें पवित्र ठहरूँगा” अथवा “मैं उसमें अपनी पवित्रता प्रकट करूँगा।” इसका अर्थ है कि यहोवा के न्यायपूर्ण कार्यों से उसकी पवित्रता सबके सामने प्रकट और प्रमाणित होती है।
    reason: lexical_alternative
