- source_word: צִידוֹן
  choice: सीदोन
  rationale: यह स्थान-नाम का हिन्दी में प्रचलित बाइबलीय रूप है।
- source_word: וְנִכְבַּדְתִּי
  choice: मैं ... महिमा प्रकट करूँगा
  rationale: כבד के निफ़अल रूप में यहाँ परमेश्वर के न्याय द्वारा उसकी महिमा के सार्वजनिक रूप से प्रकट और प्रतिष्ठित होने का भाव है; सक्रिय हिन्दी अभिव्यक्ति स्वाभाविक रहते हुए इस अर्थ को रखती है।
