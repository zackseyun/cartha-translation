  choice: जब मैं उसमें दण्ड के न्याय करूँगा
  rationale: ב prefixed infinitive का कालवाचक अर्थ ‘जब’ से और שְׁפָטִים का बहुवचन ‘न्याय’ से रखा गया है; ‘दण्ड के’ प्रसंग में इन न्यायिक कार्यों की दण्डात्मक प्रकृति स्पष्ट करता है।
- source_word: וְנִקְדַּשְׁתִּי בָהּ
  choice: उसमें अपनी पवित्रता प्रकट करूँगा
  rationale: קדש के निफ़अल का भाव यह है कि ऐतिहासिक न्याय के द्वारा यहोवा की पवित्रता सार्वजनिक रूप से प्रकट और प्रमाणित होती है।
theological_decisions:
- issue: ईश्वरीय महिमा और पवित्रता के निफ़अल रूपों का अनुवाद
  choice: मैं ... महिमा प्रकट करूँगा ... अपनी पवित्रता प्रकट करूँगा
  alternative: मेरी महिमा होगी ... मैं उसमें पवित्र ठहरूँगा
  rationale: चुना हुआ रूप न्याय में परमेश्वर के आत्म-प्रकटन को स्पष्ट करता है, जबकि पादटिप्पणियाँ इब्रानी के कर्मवाच्य/मध्यवाच्य आयाम और सार्वजनिक प्रतिष्ठा की वास्तविक अस्पष्टता सुरक्षित रखती हैं।
- issue: नगर के संबोधन से तीसरे पुरुष की ओर बदलाव
  choice: ‘तेरे बीच’ के बाद ‘उसमें’
  alternative: सर्वत्र ‘तुझमें’
  rationale: इब्रानी पाठ स्वयं צִידוֹן को पहले स्त्रीलिंग द्वितीय पुरुष में संबोधित करता है और फिर בָהּ द्वारा स्त्रीलिंग तृतीय पुरुष में उसका उल्लेख करता है; इस बदलाव को हिन्दी में बनाए रखा गया है।
