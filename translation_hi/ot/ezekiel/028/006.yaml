- source_word: יַעַן
  choice: क्योंकि
  rationale: यह परमेश्वर की घोषणा का कारण बताने वाला स्पष्ट कारणसूचक संयोजक है।
- source_word: תִּתְּךָ אֶת לְבָבְךָ
  choice: तूने अपने हृदय को ... बना लिया है
  rationale: इब्रानी मुहावरे में हृदय को रखने या ठहराने का भाव है; यहाँ ‘बना लिया है’ शासक द्वारा अपने भीतरी स्वरूप को दैवी मान लेने की बात स्वाभाविक हिन्दी में व्यक्त करता और हृदय का मूल बिंब बनाए रखता है।
- source_word: כְּלֵב אֱלֹהִים
  choice: किसी देवता के हृदय के समान
  rationale: सोर के शासक के घमंड की निंदा के संदर्भ में अनिश्चित एकवचन ‘किसी देवता’ उसके दैवी होने के दावे को व्यक्त करता है, बिना उसे इस्राएल के परमेश्वर के समान वास्तव में ठहराए।
theological_decisions:
- issue: כְּלֵב אֱלֹהִים में אֱלֹהִים का अर्थ
  choice: किसी देवता के हृदय के समान
  alternative: परमेश्वर के हृदय के समान; देवताओं के हृदय के समान
  rationale: संदर्भ मानवीय घमंड और आत्म-देवत्व के दावे की निंदा करता है, इसलिए ‘किसी देवता’ मुख्य पाठ में सबसे उपयुक्त है। फिर भी इब्रानी אֱלֹהִים का रूप ‘परमेश्वर’ भी हो सकता है; इस वास्तविक अस्पष्टता को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। एकवचन संबोधन ‘तू’ भविष्यद्वाणी में शासक को सीधे संबोधित करने की तीव्रता बनाए रखता है; ‘हृदय’ मूल इब्रानी के विचार और इच्छा से जुड़े बिंब को सुरक्षित रखता है।
