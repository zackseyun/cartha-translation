    reason: alternative_reading
lexical_decisions:
- source_word: לָכֵן
  choice: इसलिए
  rationale: यह निष्कर्षसूचक अव्यय पिछले आरोप के परिणामस्वरूप आने वाली घोषणा का परिचय देता है।
- source_word: כֹּה אָמַר
