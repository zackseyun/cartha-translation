  rationale: यह नबूवत का प्रचलित संदेशवाहक-सूत्र है; वर्तमानकालीन हिन्दी इसकी सूत्रात्मक शक्ति को स्वाभाविक रूप से व्यक्त करती है।
- source_word: אֲדֹנָי יְהוִה
  choice: प्रभु यहोवा
