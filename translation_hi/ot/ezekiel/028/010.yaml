id: EZK.28.10
reference: Ezekiel 28:10
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: מוֹתֵ֧י עֲרֵלִ֛ים תָּמ֖וּת בְּ/יַד זָרִ֑ים כִּ֚י אֲנִ֣י דִבַּ֔רְתִּי נְאֻ֖ם אֲדֹנָ֥/י יְהוִֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/028/010.yaml
  text: You will die the death of the uncircumcised by the hand of foreigners[a], for I have spoken, declares the Lord GOD.
translation:
  language: hi
  text: तू परदेशियों के हाथों खतनारहित लोगों जैसी मौत मरेगा[a], क्योंकि मैंने ही कहा है—प्रभु यहोवा की घोषणा है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से, “तू खतनारहितों की मौतें मरेगा”; यह मुहावरा खतनारहित लोगों जैसी मौत मरने का भाव देता है।
    reason: मूल के असामान्य बहुवचन और मुहावरेदार रचना को दर्ज करने के लिए।
lexical_decisions:
- source_word: מוֹתֵי עֲרֵלִים
  choice: खतनारहित लोगों जैसी मौत
  rationale: रचनात्मक बहुवचन ‘मौतें’ और क्रिया ‘मरेगा’ मिलकर मृत्यु के प्रकार को बताने वाला इब्रानी मुहावरा बनाते हैं। हिन्दी में ‘जैसी मौत’ उसका अर्थ स्वाभाविक रूप से व्यक्त करता है और ‘खतनारहित’ शब्द की वाचागत तथा अपमानसूचक शक्ति बनाए रखता है।
- source_word: תָּמוּת
  choice: तू ... मरेगा
  rationale: काल अपूर्ण, द्वितीय पुरुष पुल्लिंग एकवचन है और यहाँ भविष्यसूचक न्याय व्यक्त करता है। ‘तू’ मूल के सीधे एकवचन सम्बोधन को बनाए रखता है।
- source_word: בְּיַד זָרִים
  choice: परदेशियों के हाथों
  rationale: ביד कर्ता अथवा माध्यम बताने वाला सजीव मुहावरा है; ‘के हाथों’ हिन्दी में स्वाभाविक है। זרים इस प्रसंग में दूसरे देशों से आए विदेशी आक्रमणकारियों को सूचित करता है, इसलिए ‘परदेशियों’ चुना गया है।
- source_word: כִּי אֲנִי דִבַּרְתִּי
  choice: क्योंकि मैंने ही कहा है
  rationale: כִּי न्याय की निश्चितता का आधार प्रस्तुत करता है। स्वतंत्र सर्वनाम אֲנִי के बल को ‘ही’ से व्यक्त किया गया है और पूर्ण क्रिया का परिणाम ‘कहा है’ में सुरक्षित है।
- source_word: נְאֻם
  choice: घोषणा
  rationale: यह नबूवत में ईश्वरीय वचन की प्रामाणिकता बताने वाला स्थिर सूत्र है; ‘घोषणा’ आधुनिक, गंभीर और संक्षिप्त हिन्दी है।
- source_word: אֲדֹנָי יְהוִה
  choice: प्रभु यहोवा
  rationale: אֲדֹנָי को ‘प्रभु’ और परमेश्वर के व्यक्तिगत वाचा-नाम יהוה को प्रचलित हिन्दी रूप ‘यहोवा’ से व्यक्त किया गया है; इससे दोनों अलग पद सुरक्षित रहते हैं।
theological_decisions:
- issue: אֲדֹנָי יְהוִה में ईश्वरीय नाम का अनुवाद
  choice: प्रभु यहोवा
  alternative: प्रभु परमेश्वर
  rationale: मूल पाठ में उपाधि אֲדֹנָי के साथ चतुरक्षरी व्यक्तिगत नाम יהוה स्पष्ट रूप से उपस्थित है। ‘प्रभु यहोवा’ उपाधि और नाम दोनों को दिखाता है तथा ‘प्रभु प्रभु’ जैसी पुनरुक्ति से बचता है।
- issue: ‘खतनारहितों की मौत’ का वाचागत और अपमानसूचक अर्थ
  choice: खतनारहित लोगों जैसी मौत
  alternative: अपमानजनक मौत
  rationale: सामान्यीकृत ‘अपमानजनक मौत’ प्रसंग का भाव तो देता, पर खतने से जुड़ी मूल वाचागत श्रेणी मिटा देता। चुना गया रूप स्रोत की धार्मिक-सांस्कृतिक धार बनाए रखता है और यह स्पष्ट करता है कि तुलना मृत्यु के प्रकार से है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, सीधी और गंभीर भविष्यसूचक शैली में रखी गई है। ‘तू’ मूल के एकवचन सीधे सम्बोधन को, ‘के हाथों’ इब्रानी बिंब को और ‘मैंने ही’ ईश्वरीय वक्ता पर दिए गए बल को सुरक्षित रखते हैं।
