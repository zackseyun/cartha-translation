reference: Ezekiel 28:12
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: בֶּן אָדָ֕ם שָׂ֥א קִינָ֖ה עַל מֶ֣לֶךְ צ֑וֹר וְ/אָמַ֣רְתָּ לּ֗/וֹ כֹּ֤ה אָמַר֙ אֲדֹנָ֣/י יְהוִ֔ה אַתָּה֙ חוֹתֵ֣ם תָּכְנִ֔ית מָלֵ֥א חָכְמָ֖ה וּ/כְלִ֥יל יֹֽפִי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/028/012.yaml
  text: 'Son of man[a], raise a lament over the king of Tyre, and say to him, ‘Thus says the Lord GOD: You were the seal of perfection[b], full of wisdom and perfect in beauty.’'
translation:
  language: hi
  text: '“हे मनुष्य के पुत्र, सोर के राजा पर विलाप कर और उससे कह, ‘प्रभु याहवे यों कहता है: तू पूर्णता की मुहर[b] था[a], बुद्धि से परिपूर्ण और सौंदर्य में पूर्ण था।’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तू पूर्णता की मुहर है”; इब्रानी में यहाँ स्पष्ट संयोजक क्रिया नहीं है, इसलिए काल संदर्भ से पूरा किया गया है।
    reason: alternative_reading
  - marker: b
    text: इब्रानी पदबंध का शाब्दिक अर्थ “पूर्णता की मुहर” है; अन्य संभव अर्थ हैं “पूर्णता की मुहर-अंगूठी” या “नमूने पर मुहर लगाने वाला।”
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן אָדָם
  choice: हे मनुष्य के पुत्र
  rationale: यहेजकेल के लिए प्रयुक्त इस स्थायी संबोधन के पारंपरिक रूप और साहित्यिक प्रतिध्वनि को सुरक्षित रखता है।
- source_word: שָׂא קִינָה
  choice: विलाप का गीत छेड़
  rationale: शाब्दिक चित्र ‘विलाप उठाना’ है; हिन्दी में ‘विलाप का गीत छेड़ना’ उसी भाव को स्वाभाविक और काव्यात्मक ढंग से व्यक्त करता है।
- source_word: עַל מֶלֶךְ צֹר
  choice: सोर के राजा पर
  rationale: विलाप के प्रसंग में עַל का अर्थ उस व्यक्ति को बताता है जिसके पतन पर विलाप किया जाना है; ‘पर’ संक्षिप्त और स्वाभाविक है।
- source_word: כֹּה אָמַר אֲדֹנָי יְהוִה
  choice: प्रभु याहवे यों कहता है
  rationale: אֲדֹנָי को ‘प्रभु’ और परमेश्वर के व्यक्तिवाचक नाम יהוה को ‘याहवे’ देकर दोनों को अलग-अलग बनाए रखा गया है।
- source_word: חוֹתֵם תָּכְנִית
  choice: पूर्णता की मुहर
  rationale: 'कठिन और कुछ अस्पष्ट पदबंध का औपचारिक चित्र सुरक्षित रहता है: חוֹתֵם ‘मुहर/मुहर-अंगूठी’ और תָּכְנִית ‘नमूना, सुव्यवस्था, पूर्णता’ का बोध करा सकता है। संदर्भ में चरम उत्कृष्टता अभिप्रेत है।'
- source_word: מָלֵא חָכְמָה
  choice: बुद्धि से परिपूर्ण
  rationale: मूल विशेषण-पदबंध का सीधा, गरिमापूर्ण और सहज हिन्दी रूप।
- source_word: וּכְלִיל יֹפִי
  choice: और सौंदर्य में सिद्ध
  rationale: כְלִיל में समग्रता अथवा पूर्णता का भाव है; ‘सिद्ध’ काव्यात्मक गरिमा रखते हुए पूर्ण सौंदर्य का अर्थ देता है।
theological_decisions:
- issue: अֲדֹנָי יְהוִה में परमेश्वर के नाम का अनुवाद
  choice: प्रभु याहवे
  alternative: प्रभु परमेश्वर
  rationale: मूल में उपाधि אֲדֹנָי और व्यक्तिवाचक नाम יהוה दोनों हैं। ‘प्रभु याहवे’ इस भेद को सुरक्षित रखता है और नाम को सामान्य उपाधि में नहीं बदलता।
- issue: राजा की पूर्णता के वर्णन का काल
  choice: था
  alternative: है
  rationale: इब्रानी वाक्य में स्पष्ट संयोजक क्रिया नहीं है। पतन पर किए जा रहे विलाप और आगे आने वाले पूर्व वैभव के वर्णन के कारण भूतकाल संदर्भानुकूल है, पर वर्तमानकाल व्याकरणतः संभव है और पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की है, पर विलाप की काव्यात्मक और भविष्यद्वक्ताई गरिमा बनाए रखने के लिए ‘हे मनुष्य के पुत्र’, ‘विलाप का गीत छेड़’ और ‘सौंदर्य में सिद्ध’ जैसे ऊँचे किंतु बोधगम्य पद चुने गए हैं।
