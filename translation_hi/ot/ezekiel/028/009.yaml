source:
  edition: WLC
  text: הֶ/אָמֹ֤ר תֹּאמַר֙ אֱלֹהִ֣ים אָ֔נִי לִ/פְנֵ֖י הֹֽרְגֶ֑/ךָ וְ/אַתָּ֥ה אָדָ֛ם וְ/לֹא אֵ֖ל בְּ/יַ֥ד מְחַלְלֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/028/009.yaml
  text: Will you still say[a], ‘I am a god,’ before the one who kills you? But you are a man, and not a god[c][b], in the hand of those who wound you.
translation:
  language: hi
  text: क्या तुम अपने मारनेवाले के सामने भी कहते रहोगे[a], ‘मैं एक देवता हूँ’? पर तुम उन्हें अपवित्र करनेवालों के हाथ में मनुष्य हो, देवता नहीं[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “क्या तुम सचमुच कहते रहोगे”; इब्रानी में क्रिया के साथ उसी धातु का इन्फिनिटिव एब्सोल्यूट प्रयुक्त होकर कथन पर बल देता है।
    reason: lexical_alternative
  - marker: b
    text: “तुम्हें अपवित्र करनेवालों” का अनुवाद “जो तुम्हें घायल करेंगे” या “जो तुम्हें बेधेंगे” भी किया गया है। यहाँ इब्रानी शब्द उस व्यक्ति को अपमानित और साधारण ठहराने का भाव दे सकता है जिसने देवता होने का दावा किया था।
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶאָמֹר תֹּאמַר
  choice: क्या तुम ... भी कहते रहोगे
  rationale: क्रिया के साथ प्रयुक्त infinitive absolute कथन पर बल देता है। प्रसंग में ‘भी कहते रहोगे’ आसन्न मृत्यु के सामने दावे को जारी रखने की चुनौती स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: אֱלֹהִים / אֵל
  choice: ईश्वर
  rationale: दोनों पदों में शासक के देवत्व के दावे और उसके निषेध का समानान्तर विरोध है। हिन्दी में विधेय रूप ‘मैं ईश्वर हूँ’ और ‘ईश्वर नहीं’ स्वाभाविक है तथा इसे इस्राएल के परमेश्वर के निजी नाम के रूप में अनावश्यक रूप से निश्चित नहीं करता।
- source_word: לִפְנֵי הֹרְגֶךָ
  choice: अपने मारनेवाले के सामने
  rationale: לִפְנֵי का स्थान-संबंधी अर्थ और कृदन्त הֹרְגֶךָ का सक्रिय कर्तृभाव दोनों सुरक्षित रहते हैं।
- source_word: אָדָם
  choice: मनुष्य
  rationale: यहाँ मानवीय शासक और देवता के बीच विरोध है; ‘मनुष्य’ आधुनिक हिन्दी में लिंग-संगत, सीधा और गरिमापूर्ण है।
- source_word: בְּיַד
  choice: के हाथ में
  rationale: मूल इब्रानी बिंब को रखते हुए यह दूसरों की शक्ति और वश में होने का भाव स्पष्ट करता है।
- source_word: מְחַלְלֶיךָ
  choice: जो तुम्हें अपवित्र करेंगे
  rationale: पील कृदन्त को חלל ‘अपवित्र करना/सामान्य ठहराना’ से समझना उस व्यक्ति के अपमान की विडम्बना रखता है जिसने देवत्व का दावा किया था; केवल शारीरिक घायल करने का अर्थ इसे संकुचित कर देगा।
theological_decisions:
- issue: सोर के शासक के देवत्व-दावे का रूप
  choice: ‘मैं ईश्वर हूँ’ ... ‘ईश्वर नहीं’
  alternative: ‘मैं एक देवता हूँ’ ... ‘देवता नहीं’
  rationale: हिन्दी में शून्य-विधेय ‘ईश्वर हूँ’ स्वाभाविक है। समान शब्दावली दावे और उसके खण्डन का तीखा समानान्तर बचाती है, जबकि प्रसंग स्पष्ट करता है कि यह मानवीय शासक का देवत्व-दावा है।
- issue: מְחַלְלֶיךָ का अर्थ
  choice: जो तुम्हें अपवित्र करेंगे
  alternative: जो तुम्हें घायल करेंगे / बेधेंगे
  rationale: अपवित्रीकरण का अर्थ देवत्व का दावा करनेवाले की बेइज्जती और साधारण मनुष्य सिद्ध होने की धार्मिक विडम्बना सुरक्षित रखता है; शारीरिक अर्थ सम्भव विकल्प के रूप में पादटिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सीधी, गरिमापूर्ण और व्यंग्यात्मक भविष्यवाणी-शैली रखी गई है। ‘मारनेवाले’ आसन्न हिंसा को, ‘मनुष्य हो, ईश्वर नहीं’ मूल के तीखे विरोध को, और ‘के हाथ में’ इब्रानी बिंब को सुरक्षित रखते हैं।
