id: EZK.28.17
reference: Ezekiel 28:17
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: גָּבַ֤הּ לִבְּ/ךָ֙ בְּ/יָפְיֶ֔/ךָ שִׁחַ֥תָּ חָכְמָתְ/ךָ֖ עַל יִפְעָתֶ֑/ךָ עַל אֶ֣רֶץ הִשְׁלַכְתִּ֗י/ךָ לִ/פְנֵ֧י מְלָכִ֛ים נְתַתִּ֖י/ךָ לְ/רַ֥אֲוָה בָֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/028/017.yaml
  text: Your heart was lifted up because of your beauty[a]; you corrupted your wisdom because of your splendor. I cast you to the earth; I set you before kings[c][b], for them to look at you.
translation:
  language: hi
  text: तेरी सुंदरता के कारण तेरे मन में घमंड भर गया[a]; तेरे वैभव के कारण तूने अपनी बुद्धि भ्रष्ट कर दी। मैंने तुझे धरती पर फेंक दिया; मैंने तुझे राजाओं के सामने रख दिया, ताकि वे तुझे देखें[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक रूप से: “तेरी सुंदरता के कारण तेरा हृदय ऊँचा हो गया।”'
    reason: इब्रानी मुहावरे के रूपक और उसके अभिमान-संबंधी अर्थ दोनों को सुरक्षित रखना।
  - marker: b
    text: 'या: “मैंने तुझे राजाओं के सामने तमाशा बना दिया।”'
    reason: अंतिम दोनों वाक्यांशों को मिलाकर परिणामसूचक अर्थ व्यक्त करने वाला संभावित अनुवाद।
lexical_decisions:
- source_word: גָּבַהּ לִבְּךָ
  choice: तेरे मन में घमंड भर गया
  rationale: इब्रानी मुहावरे का शाब्दिक अर्थ ‘तेरा हृदय ऊँचा हो गया’ है और प्रसंग में यह अभिमान व्यक्त करता है। सहज आधुनिक हिन्दी में नैतिक आशय स्पष्ट रखा गया है, जबकि शाब्दिक रूप पादटिप्पणी में सुरक्षित है।
- source_word: בְּיָפְיֶךָ
  choice: तेरी सुंदरता के कारण
  rationale: यहाँ ב कारणसूचक है; सुंदरता को घमंड का कारण बताना समानांतर पंक्ति और प्रसंग के अनुकूल है।
- source_word: שִׁחַתָּ חָכְמָתְךָ
  choice: तूने अपनी बुद्धि भ्रष्ट कर दी
  rationale: שׁחת बिगाड़ने या भ्रष्ट करने का भाव देता है। ‘बुद्धि भ्रष्ट कर दी’ व्यावहारिक और नैतिक दोनों हानि को व्यक्त करता है।
- source_word: עַל יִפְעָתֶךָ
  choice: तेरे वैभव के कारण
  rationale: עַל यहाँ कारणसूचक है और יִפְעָה चमक, दीप्ति अथवा वैभव को दर्शाता है। ‘वैभव’ सुंदरता के समानांतर स्वाभाविक और गरिमापूर्ण है।
- source_word: עַל אֶרֶץ הִשְׁלַכְתִּיךָ
  choice: मैंने तुझे धरती पर फेंक दिया
  rationale: אֶרֶץ का निकट अर्थ ‘धरती’ है और שלך का हिफ़ील रूप बलपूर्वक नीचे फेंकने का भाव रखता है।
- source_word: לִפְנֵי מְלָכִים נְתַתִּיךָ
  choice: मैंने तुझे राजाओं के सामने रख दिया
  rationale: यह इब्रानी वाक्य-विन्यास को निकटता से सुरक्षित रखता है और अगला उद्देश्य-वाक्य बताता है कि ऐसा दिखाए जाने के लिए किया गया।
- source_word: לְרַאֲוָה בָךְ
  choice: ताकि वे तुझे देखें
  rationale: ראה के साधित क्रिया-रूप का उद्देश्य स्पष्ट और सहज हिन्दी में व्यक्त किया गया है। ‘तमाशा’ वाली व्याख्या संभव है, पर मुख्य पाठ में अनावश्यक रूप से अधिक अर्थ नहीं जोड़ा गया।
theological_decisions:
- issue: यहेजकेल 28:17 में संबोधित व्यक्ति की पहचान
  choice: एकवचन ‘तू’ और उसके अभिमान तथा पतन की ऊँची काव्यात्मक भाषा को बनाए रखा गया है, पर उसकी पहचान अनुवाद में तय नहीं की गई।
  alternative: इसे केवल सोर के मानवीय राजा के विषय में मानना, अथवा मानवीय राजा के साथ किसी स्वर्गीय विद्रोही की प्रतीकात्मक ओर संकेत मानना।
  rationale: इस पद का इब्रानी पाठ स्वयं किसी अतिरिक्त अलौकिक पहचान को स्पष्ट नहीं करता; इसलिए अनुवाद मानवीय शासक और संभावित व्यापक प्रतीकात्मक संकेत के बीच की धर्मवैज्ञानिक तनातनी को खुला रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण और प्रत्यक्ष भविष्यद्वक्तापरक स्वर रखा गया है। एकवचन अनौपचारिक ‘तू/तेरा’ मूल इब्रानी के सीधे संबोधन और न्याय-वाणी की तीव्रता के अनुकूल है।
