  yaml_path: translation/ot/ezekiel/028/005.yaml
  text: By your great wisdom in your trade you increased your wealth[c][b][a], and your heart became proud because of your wealth.
translation:
  language: hi
  text: तूने अपनी बहुत बुद्धि से अपने व्यापार में अपनी धन-संपत्ति बढ़ाई[a], और अपनी धन-संपत्ति के कारण तेरा हृदय घमंडी हो गया[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “धन-संपत्ति” के लिए प्रयुक्त इब्रानी शब्द का अर्थ प्रसंग के अनुसार धन, संसाधन, सामर्थ्य या शक्ति भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “तेरा हृदय ऊँचा हो गया”; यह घमंडी होने का इब्रानी मुहावरा है।
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּרֹב חָכְמָתְךָ
  choice: अपने महान ज्ञान से
  rationale: בְּרֹב यहाँ साधन या परिस्थिति व्यक्त करता है और חָכְמָה का मूल अर्थ ‘ज्ञान/बुद्धि’ है; व्यापारिक संदर्भ में व्यावहारिक कुशलता की छाया भी बनी रहती है।
- source_word: בִּרְכֻלָּתְךָ
  choice: व्यापार करते हुए
  rationale: רְכֻלָּה व्यापारिक गतिविधि या वाणिज्य को सूचित करता है। यह रूप आधुनिक हिन्दी में स्वाभाविक है और व्यापार के माध्यम/परिस्थिति को व्यक्त करता है।
- source_word: הִרְבִּיתָ חֵילֶךָ
  choice: तूने अपनी धन-संपत्ति बढ़ाई
  rationale: רבה के हिफ़ील रूप का अर्थ ‘बढ़ाना’ है। व्यापारिक प्रसंग में חַיִל के लिए ‘धन-संपत्ति’ उपयुक्त है, यद्यपि शब्द में सामर्थ्य और संसाधनों का व्यापक भाव भी हो सकता है।
- source_word: וַיִּגְבַּהּ לְבָבְךָ
  choice: तेरा मन घमंड से भर गया
  rationale: शाब्दिक रूप से ‘तेरा हृदय ऊँचा हो गया’; यह इब्रानी मुहावरा अभिमानी होने को व्यक्त करता है। चुना हुआ रूप आधुनिक हिन्दी में अर्थ स्पष्ट करता है।
- source_word: בְּחֵילֶךָ
  choice: अपनी धन-संपत्ति के कारण
  rationale: यहाँ ב कारण या अवसर सूचित करता है; उसी חַיִל को ‘धन-संपत्ति’ कहना पद के दोनों प्रयोगों में संगति रखता है।
theological_decisions:
- issue: חֵיל का अर्थ धन-संपत्ति या सामर्थ्य
  choice: धन-संपत्ति
  alternative: धन, संसाधन, सामर्थ्य या शक्ति
  rationale: सोर के व्यापारिक संदर्भ में धन-संपत्ति प्रमुख अर्थ है, पर व्यापक अर्थ-क्षेत्र को पादटिप्पणी में सुरक्षित रखा गया है।
- issue: हृदय के ऊँचा होने वाले मुहावरे का अनुवाद
  choice: तेरा मन घमंड से भर गया
  alternative: तेरा हृदय ऊँचा हो गया
  rationale: अर्थ को सहज आधुनिक हिन्दी में व्यक्त किया गया है, जबकि मूल चित्र पादटिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी; संबोधन के एकवचन रूप ‘तू/तेरा’ से भविष्यवाणी की सीधी और गंभीर वाणी सुरक्षित रखी गई है। भाषा सहज, गरिमापूर्ण और गैर-सांप्रदायिक है।
