review_pass:
  verdict: revise
  source_fidelity: The draft conveys the increase of wealth and the resulting pride accurately. However, “अपने महान ज्ञान से व्यापार करते हुए” weakens the Hebrew’s explicit commercial setting as the sphere/means of the wisdom and uses “ज्ञान,” which can suggest accumulated information rather than practical wisdom.
  naturalness: The verse is generally clear and suitably direct. “अपनी बहुत बुद्धि से अपने व्यापार में” is more idiomatic and more closely reflects wisdom exercised in commerce. “तेरा हृदय घमंडी हो गया” is a natural rendering of the Hebrew pride idiom while retaining the source’s ‘heart’ terminology.
  terminology: “धन-संपत्ति” is an appropriate contextual rendering of חַיִל in both occurrences; its wider range is properly retained in the footnote. “हृदय” is preferable to “मन” here because the footnote preserves the Hebrew idiom with the same term.
  issues:
  - severity: low
    issue: “महान ज्ञान” for חָכְמָה
    rationale: In this context חָכְמָה denotes wisdom, skill, or shrewdness. “बुद्धि” better preserves this sense than “ज्ञान.”
  - severity: low
    issue: “व्यापार करते हुए” for בִּרְכֻלָּתְךָ
    rationale: The participial wording is understandable, but “अपने व्यापार में” more directly represents commerce as the setting in which the ruler’s wisdom operated and avoids making the source construction sound merely sequential.
