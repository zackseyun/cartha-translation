base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/028/023.yaml
  text: And I will send pestilence into her[a], and blood into her streets; the slain will fall in her midst by the sword all around her. Then they will know that I am Yahweh.
translation:
  language: hi
  text: और मैं उसमें महामारी और उसकी सड़कों में रक्त[a] भेजूँगा। उसके बीच में लोग उस तलवार से मारे जाकर गिरेंगे जो उस पर चारों ओर से चलेगी। तब वे जानेंगे कि मैं यहोवा हूँ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘रक्तपात’। शाब्दिक रूप से ‘रक्त’; यहाँ इसका आशय संभवतः नगर में होने वाले हिंसक रक्तपात से है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשִׁלַּחְתִּי
  choice: और मैं...भेजूँगा
  rationale: भविष्यसूचक वाणी में संयोजक सहित पूर्ण क्रिया परमेश्वर की भावी न्याय-घोषणा व्यक्त करती है; ‘भेजूँगा’ स्वाभाविक हिन्दी है।
- source_word: דֶּבֶר
  choice: महामारी
  rationale: न्याय-संदर्भ में यह व्यापक रोग नहीं, फैलने वाली घातक व्याधि को सूचित करता है; आधुनिक हिन्दी में ‘महामारी’ स्पष्ट और सहज है।
- source_word: וָדָם
  choice: और...रक्तपात
  rationale: शाब्दिक अर्थ ‘रक्त’ है, पर नगर की सड़कों और मारे गए लोगों के संदर्भ में यहाँ हिंसक रक्तपात अभिप्रेत है। पादटिप्पणी शाब्दिक विकल्प सुरक्षित रखती है।
- source_word: בְּחוּצוֹתֶיהָ
  choice: उसकी सड़कों पर
  rationale: חוּצוֹת नगर की गलियों, सड़कों अथवा सार्वजनिक स्थानों को दर्शाता है; ‘सड़कों पर’ आधुनिक हिन्दी में स्वाभाविक स्थान-सूचक प्रयोग है।
- source_word: וְנִפְלַל חָלָל
  choice: मारे गए लोग गिरेंगे
  rationale: क्रियारूप का स्वरूप असामान्य है, पर खंड का अर्थ युद्ध या न्याय में मारे जाकर गिरने वालों से संबंधित है; अनावश्यक रूप से ‘घायल’ या ‘बेधे गए’ निश्चित नहीं किया गया।
- source_word: בְּתוֹכָהּ
  choice: उसके बीच
  rationale: नगर के भीतर या मध्य का सामान्य हिब्रू मुहावरा; ‘उसके बीच’ संक्षिप्त और स्वाभाविक है।
- source_word: בְּחֶרֶב עָלֶיהָ מִסָּבִיב
  choice: जब तलवार चारों ओर से उसके विरुद्ध चलेगी
  rationale: शाब्दिक संरचना अत्यंत संक्षिप्त है। यह रूप तलवार द्वारा मृत्यु और नगर पर चारों ओर से आक्रमण—दोनों को स्पष्ट करता है, बिना किसी विशिष्ट सेना को जोड़ने के।
- source_word: וְיָדְעוּ
  choice: तब वे जानेंगे
  rationale: वाव यहाँ पिछले न्याय के परिणाम को आगे बढ़ाता है; ‘तब’ हिन्दी में यह परिणामी संबंध स्पष्ट करता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: मूल पाठ में परमेश्वर का व्यक्तिगत नाम चतुरक्षरीय रूप में है। हिन्दी बाइबलीय प्रयोग में परिचित लिप्यंतरण ‘यहोवा’ शीर्षक से उसका भेद बनाए रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: यहाँ मूल पाठ उपाधि אֲדֹנָי नहीं, व्यक्तिगत नाम יְהוָה देता है। इसलिए उपाधि ‘प्रभु’ से बदलने के बजाय हिन्दी में व्यापक रूप से पहचाना जाने वाला नामरूप ‘यहोवा’ रखा गया। ‘याहवे’ एक वैकल्पिक विद्वत्तापरक लिप्यंतरण है।
- issue: דָם का अर्थ
  choice: रक्तपात
  alternative: रक्त
  rationale: सड़कों, मारे गए लोगों और तलवार के निकट संदर्भ में ‘रक्त’ हिंसक हत्या या रक्तपात का लक्षणार्थक प्रयोग है। मुख्य पाठ में आशय स्पष्ट किया गया है और पादटिप्पणी में शाब्दिक रूप दिया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण भविष्यसूचक शैली रखी गई है। स्त्रीलिंग सर्वनाम पूर्ववर्ती नगर सीदोन के अनुरूप हैं। वाक्य-विन्यास को हिन्दी में स्वाभाविक बनाने के लिए तलवार वाले संक्षिप्त हिब्रू खंड को कालवाचक उपवाक्य के रूप में व्यक्त किया गया है।
