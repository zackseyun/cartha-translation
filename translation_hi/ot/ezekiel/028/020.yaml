  yaml_path: translation/ot/ezekiel/028/020.yaml
  text: And the word of Yahweh came to me[a], saying,
translation:
  language: hi
  text: 'और याहवे[a] का वचन मेरे पास यह कहते हुए आया:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में YHWH; परंपरागत रूप से इसका अनुवाद ‘प्रभु’ किया जाता है।
    reason: ईश्वरीय नाम के मूल रूप और परंपरागत वैकल्पिक अनुवाद की जानकारी देना।
lexical_decisions:
- source_word: וַיְהִי
  choice: तब … आया
  rationale: यह नबी की वाणी का प्रचलित आरंभिक सूत्र है। हिन्दी में ‘तब … आया’ प्रसंग की निरंतरता और स्वाभाविक अभिव्यक्ति दोनों बनाए रखता है।
- source_word: דְבַר
  choice: वचन
  rationale: यहाँ शब्द परमेश्वर से प्राप्त नबूवत-संबंधी वाणी को सूचित करता है। ‘वचन’ स्थापित बाइबलीय पदावली और मूल सूत्र का भाव बनाए रखता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: मूल में प्रयुक्त चार अक्षरों वाले व्यक्तिगत ईश्वरीय नाम को हिन्दी में परिचित लिप्यंतरण ‘यहोवा’ से व्यक्त किया गया है, किसी उपाधि से प्रतिस्थापित नहीं किया गया।
- source_word: אֵלַי
  choice: मेरे पास
  rationale: नबी को ईश्वरीय वचन प्राप्त होने के लिए आधुनिक हिन्दी में ‘मेरे पास आया’ स्वाभाविक अभिव्यक्ति है।
- source_word: לֵאמֹר
  choice: ':'
  rationale: यह रूप अगले पद में आने वाली प्रत्यक्ष ईश्वरीय वाणी का परिचय देता है। हिन्दी में विसर्ग-सूचक चिह्न अगली उक्ति से संबंध को स्वाभाविक रूप से व्यक्त करता है; ‘यह कहते हुए’ जोड़ना यहाँ अनावश्यक और कुछ असहज होता।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: मूल पाठ व्यक्तिगत ईश्वरीय नाम का प्रयोग करता है। हिन्दी पाठकों के बीच प्रचलित ‘यहोवा’ उसे एक नाम के रूप में सुरक्षित रखता है; ‘प्रभु’ उसे उपाधि में बदल देता, जबकि ‘याहवे’ स्रोत-उच्चारण का एक अन्य संभावित लिप्यंतरण है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सहज हिन्दी में है। नबूवत-संबंधी पारंपरिक सूत्र को बनाए रखते हुए शब्दशः अस्वाभाविकता से बचा गया है। फुटनोट-चिह्न वाक्य के अंत में लगाया गया है, क्योंकि टिप्पणी ‘यहोवा’ नाम से संबंधित होते हुए भी पूरे अनुवाद में प्रयुक्त नाम-नीति स्पष्ट करती है।
