  text: בְּ/רֹ֣ב רְכֻלָּתְ/ךָ֗ מָל֧וּ תוֹכְ/ךָ֛ חָמָ֖ס וַֽ/תֶּחֱטָ֑א וָ/אֶחַלֶּלְ/ךָ֩ מֵ/הַ֨ר אֱלֹהִ֤ים וָֽ/אַבֶּדְ/ךָ֙ כְּר֣וּב הַ/סֹּכֵ֔ךְ מִ/תּ֖וֹךְ אַבְנֵי אֵֽשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/028/016.yaml
  text: By the abundance of your trade[a], your midst was filled with violence, and you sinned; so I cast you as profane from the mountain of God, and I destroyed you, O guardian cherub[c][b], from the midst of the stones of fire.
translation:
  language: hi
  text: तेरे व्यापार की बहुतायत[a] के कारण तेरे भीतर हिंसा भर गई, और तूने पाप किया। इसलिए मैंने तुझे अपवित्र ठहराकर परमेश्वर के पर्वत से निकाल दिया[b]; हे रक्षक करूब[c], मैंने तुझे आग के पत्थरों के बीच से नष्ट कर दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “तेरे वाणिज्य की बहुतायत।” इब्रानी शब्द व्यापार, वाणिज्य अथवा माल की आवाजाही के अर्थ में आ सकता है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में शाब्दिक रूप से, “मैंने तुझे अपवित्र किया/ठहराया, परमेश्वर के पर्वत से।” क्रिया का अर्थ अपवित्र करना या अपवित्र मानना हो सकता है; संदर्भ में पवित्र स्थान से निष्कासन का भाव संभावित है।
    reason: lexical_alternative
  - marker: c
    text: या “छाया करनेवाला करूब” अथवा “ढाँपनेवाला करूब।” इब्रानी कृदन्त का मूल अर्थ ढाँपना, छाया करना या सुरक्षा देना है।
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּרֹב רְכֻלָּתְךָ
  choice: तेरे व्यापार की बहुतायत के कारण
  rationale: בְּרֹב यहाँ कारण या परिस्थिति व्यक्त करता है। רְכֻלָּה का अर्थ व्यापार, वाणिज्य या माल की खरीद-बिक्री हो सकता है; ‘व्यापार’ आधुनिक हिन्दी में स्वाभाविक और पर्याप्त रूप से व्यापक है।
- source_word: מָל֧וּ תוֹכְךָ חָמָס
  choice: तेरा अंतर हिंसा से भर गया
  rationale: מָל֧וּ रूप की दृष्टि से बहुवचन कर्तृवाच्य है, पर कर्ता अनिर्दिष्ट है; हिन्दी में परिणामसूचक कर्मवाच्य अभिव्यक्ति अर्थ को स्वाभाविक ढंग से रखती है। תוֹךְ के आंतरिक अथवा केंद्रीय भाव को ‘अंतर’ सुरक्षित रखता है।
- source_word: חָמָס
  choice: हिंसा
  rationale: यह शब्द हिंसा के साथ क्रूर अन्याय और उत्पीड़न का भी बोध करा सकता है; ‘हिंसा’ इसका सीधा और प्रचलित बाइबिलीय पर्याय है।
- source_word: וַתֶּחֱטָא
  choice: और तूने पाप किया
  rationale: सरल समन्वय मूल इब्रानी प्रवाह को बनाए रखता है; कारणात्मक संबंध पिछले उपवाक्य से स्वयं स्पष्ट है।
- source_word: וָאֶחַלֶּלְךָ מֵהַר אֱלֹהִים
  choice: मैंने तुझे अपवित्र ठहराकर परमेश्वर के पर्वत से निकाल दिया
  rationale: חלל के पिएल रूप में अपवित्र करना या पवित्र क्षेत्र से अपवित्र मानकर हटाना निहित है। हिन्दी में केवल ‘अपवित्र किया’ अस्पष्ट हो सकता था, इसलिए पवित्र स्थान से निष्कासन के प्रसंग को स्वाभाविक रूप में व्यक्त किया गया है।
- source_word: וָאַבֶּדְךָ
  choice: मैंने तुझे ... नष्ट कर दिया
  rationale: אבד का कारक रूप नष्ट करने, मिटा देने या विनाश की ओर पहुँचाने का अर्थ देता है। ‘नष्ट कर दिया’ इसका सीधा अर्थ सुरक्षित रखता है।
- source_word: כְּרוּב הַסֹּכֵךְ
  choice: हे रक्षक करूब
  rationale: כְּרוּב एकवचन है। סכך का मूल भाव ढाँपना, छाया करना या सुरक्षा देना है; ‘रक्षक’ इस भूमिका को सामान्य आधुनिक हिन्दी में स्पष्ट करता है, जबकि शाब्दिक विकल्प पादटिप्पणी में दिया गया है।
- source_word: מִתּוֹךְ אַבְנֵי אֵשׁ
  choice: आग के पत्थरों के बीच से
  rationale: यह अनोखा और रहस्यमय बिंब बिना व्याख्यात्मक विस्तार के सुरक्षित रखा गया है; ‘के बीच से’ מִתּוֹךְ का स्वाभाविक हिन्दी रूप है।
theological_decisions:
- issue: सम्बोधित व्यक्ति की पहचान—मानवीय राजा, करूब-सदृश काव्यात्मक पात्र या कोई अलौकिक सत्ता
  choice: प्रत्यक्ष सम्बोधन और ‘करूब’ की अदन/पवित्रस्थान-संबंधी छवि को ज्यों का त्यों रखना
  alternative: पाठ में उसे स्पष्ट रूप से केवल मानवीय राजा अथवा शैतान के रूप में पहचान देना
  rationale: इब्रानी पद स्वयं व्यापक पहचान-विवाद का समाधान नहीं करता। अनुवाद को उस तनाव को बनाए रखना चाहिए और किसी विशिष्ट धर्मवैज्ञानिक प्रणाली को पाठ में नहीं जोड़ना चाहिए।
- issue: וָאֶחַלֶּלְךָ में अपवित्रीकरण और निष्कासन का संबंध
  choice: ‘अपवित्र ठहराकर ... निकाल दिया’
  alternative: ‘तुझे अपवित्र किया’
  rationale: मूल क्रिया का पवित्रता-विरोधी बल बनाए रखते हुए מֵהַר से व्यक्त अलगाव को हिन्दी में स्पष्ट किया गया है; यह केवल नैतिक भ्रष्टता नहीं, पवित्र स्थान से हटाए जाने का प्रसंग भी है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सहज रूप अपनाया गया है। एकवचन निकट सम्बोधन के लिए ‘तू/तेरे/तुझे’ रखा गया है, क्योंकि भविष्यद्वाणी का स्वर सीधा और गंभीर है। ‘परमेश्वर का पर्वत,’ ‘करूब’ और ‘आग के पत्थर’ जैसे विशिष्ट बाइबिलीय बिंबों को समझाकर सपाट नहीं किया गया।
