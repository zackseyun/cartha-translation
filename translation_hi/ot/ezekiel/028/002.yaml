source:
  edition: WLC
  text: בֶּן אָדָ֡ם אֱמֹר֩ לִ/נְגִ֨יד צֹ֜ר כֹּֽה אָמַ֣ר אֲדֹנָ֣/י יְהֹוִ֗ה יַ֣עַן גָּבַ֤הּ לִבְּ/ךָ֙ וַ/תֹּ֨אמֶר֙ אֵ֣ל אָ֔נִי מוֹשַׁ֧ב אֱלֹהִ֛ים יָשַׁ֖בְתִּי בְּ/לֵ֣ב יַמִּ֑ים וְ/אַתָּ֤ה אָדָם֙ וְֽ/לֹא אֵ֔ל וַ/תִּתֵּ֥ן לִבְּ/ךָ֖ כְּ/לֵ֥ב אֱלֹהִֽים־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/028/002.yaml
  text: 'Son of man[a], say to the prince of Tyre, ‘Thus says the Lord GOD: Because your heart is proud, and you say, “I am a god; I sit in the seat of gods in the heart of the seas,” yet you are a man and not a god[b], though you set your heart like the heart of gods.”'
translation:
  language: hi
  text: 'हे मनुष्य के पुत्र, सोर के शासक से कह, “प्रभु यहोवा यों कहता है: क्योंकि तेरा हृदय घमंड से भर गया है और तू कहता है, ‘मैं एक देवता हूँ; मैं समुद्रों के बीचोंबीच देवताओं के आसन पर बैठा हूँ,’[a] फिर भी तू मनुष्य है, देवता नहीं, यद्यपि तूने अपने हृदय को देवताओं के हृदय के समान माना है[b]।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मैं परमेश्वर हूँ; मैं समुद्रों के बीचोंबीच परमेश्वर के आसन पर बैठा हूँ।” यहाँ हिब्रू אֵל और אֱלֹהִים को एकवचन अर्थ में भी पढ़ा जा सकता है।
    reason: alternative_reading
  - marker: b
    text: या, “यद्यपि तूने अपने हृदय को परमेश्वर के हृदय के समान माना है।”
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן אָדָם
  choice: हे मनुष्य के पुत्र
  rationale: यहेजकेल में नबी के लिए बार-बार प्रयुक्त संबोधन के हिब्रू रूपक को बनाए रखता है; ‘हे’ हिंदी में संबोधन को स्वाभाविक बनाता है।
- source_word: לִנְגִיד צֹר
  choice: सोर के शासक से
  rationale: נָגִיד का अर्थ प्रधान या शासक है। ‘शासक’ आधुनिक हिंदी में स्पष्ट है और इस पद में उसे ‘राजा’ कहकर अगले प्रसंग की शब्दावली नहीं थोपता।
- source_word: אֲדֹנָי יְהוִה
  choice: प्रभु यहोवा
  rationale: संयुक्त ईश्वरीय उपाधि के दोनों अंगों को स्पष्ट और प्रचलित हिंदी बाइबलीय रूप में व्यक्त करता है।
- source_word: יַעַן גָּבַהּ לִבְּךָ
  choice: क्योंकि तेरा हृदय घमंड से भर गया है
  rationale: हिब्रू में हृदय के ऊँचा होने का मुहावरा अभिमान व्यक्त करता है; यह हिंदी रूप अर्थ को स्वाभाविक रखते हुए ‘हृदय’ की छवि बचाता है।
- source_word: אֵל אָנִי
  choice: मैं एक देवता हूँ
  rationale: मूर्तिपूजक शासक के आत्म-दैवीकरण के संदर्भ में אֵל को सामान्य दैवी सत्ता के अर्थ में लिया गया है; विशिष्ट परमेश्वर का दावा भी संभव है और पादटिप्पणी में रखा गया है।
- source_word: מוֹשַׁב אֱלֹהִים
  choice: देवताओं के आसन पर
  rationale: מוֹשָׁב के बैठने के स्थान/आसन के बिंब और אֱלֹהִים के संभावित बहुवचन अर्थ दोनों को बनाए रखता है।
- source_word: בְּלֵב יַמִּים
  choice: समुद्रों के बीचोंबीच
  rationale: हिब्रू ‘समुद्रों के हृदय में’ का स्थान-सूचक अर्थ आधुनिक हिंदी में सहज और सजीव ढंग से व्यक्त होता है।
- source_word: וְאַתָּה אָדָם וְלֹא אֵל
  choice: फिर भी तू मनुष्य है, देवता नहीं
  rationale: शासक के मानवीय अस्तित्व और उसके दैवी दावे के बीच तीखा विरोध स्पष्ट रखता है।
- source_word: וַתִּתֵּן לִבְּךָ כְּלֵב אֱלֹהִים
  choice: यद्यपि तूने अपने हृदय को देवताओं के हृदय के समान माना है
  rationale: हृदय की हिब्रू छवि को बनाए रखते हुए आत्म-मूल्यांकन/आत्म-स्थापन का आशय स्वाभाविक हिंदी में देता है।
theological_decisions:
- issue: शासक के दावे में אֵל और אֱלֹהִים को एकवचन परमेश्वर के रूप में पढ़ा जाए या सामान्य/बहुवचन दैवी सत्ता के रूप में
  choice: मुख्य पाठ में ‘एक देवता’ और ‘देवताओं’
  alternative: ‘मैं परमेश्वर हूँ; मैं समुद्रों के बीचोंबीच परमेश्वर के आसन पर बैठा हूँ’ तथा अंतिम वाक्य में ‘परमेश्वर के हृदय के समान’
  rationale: समुद्री नगर के अभिमानी गैर-इस्राएली शासक का संदर्भ सामान्य आत्म-दैवीकरण और दैवी क्षेत्र पर दावे के पक्ष में है। फिर भी אֱלֹהִים एकवचन भी हो सकता है, इसलिए उस वास्तविक भाषिक और धर्मवैज्ञानिक संभावना को पादटिप्पणियों में सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य रखी गई है। संबोधन में पारंपरिक भविष्यद्वक्ताई पदबंध ‘मनुष्य के पुत्र’ और ईश्वरीय उपाधि ‘प्रभु यहोवा’ सुरक्षित हैं। मुख्य पाठ में देवता/देवताओं का पाठ चुना गया है, जबकि एकवचन ‘परमेश्वर’ की वास्तविक संभावना पादटिप्पणियों में दी गई है।
