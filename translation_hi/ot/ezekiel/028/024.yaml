  text: וְ/לֹֽא יִהְיֶ֨ה ע֜וֹד לְ/בֵ֣ית יִשְׂרָאֵ֗ל סִלּ֤וֹן מַמְאִיר֙ וְ/ק֣וֹץ מַכְאִ֔ב מִ/כֹּל֙ סְבִ֣יבֹתָ֔/ם הַ/שָּׁאטִ֖ים אוֹתָ֑/ם וְ/יָ֣דְע֔וּ כִּ֥י אֲנִ֖י אֲדֹנָ֥/י יְהוִֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/028/024.yaml
  text: And the house of Israel will no longer have a brier that causes bitterness or a thorn that causes pain from all those around them who despise them[a]. Then they will know that I am the Lord GOD.
translation:
  language: hi
  text: और इस्राएल के घराने के लिए फिर कभी कोई कड़वाहट पहुँचानेवाली कँटीली झाड़ी या पीड़ा देनेवाला काँटा नहीं होगा, जो उसके चारों ओर के उन सब लोगों की ओर से हो जो उसका तिरस्कार करते हैं[a]। तब वे जानेंगे कि मैं प्रभु याहवे हूँ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘कड़वाहट देनेवाली चुभन।’ इब्रानी में नुकीले और हानि पहुँचाने वाले पौधे की छवि है, जो रूपक रूप में इस्राएल के शत्रुतापूर्ण पड़ोसियों के लिए प्रयुक्त हुई है।
    reason: lexical_alternative
lexical_decisions:
- source_word: סִלּוֹן מַמְאִיר
  choice: चुभनेवाली कँटीली झाड़ी
  rationale: סִלּוֹן किसी नुकीले, हानि पहुँचाने वाले पौधे की छवि देता है। מַמְאִיר का सटीक भाव अनिश्चित है और इसमें पीड़ादायक या चुभनेवाला प्रभाव निहित है; यह अनुवाद स्वाभाविक हिन्दी में उस प्रभाव को रखता है और अगले ‘काँटे’ से भेद भी बनाए रखता है।
- source_word: קוֹץ מַכְאִב
  choice: पीड़ा देनेवाला काँटा
  rationale: קוֹץ का सामान्य अर्थ ‘काँटा’ है और מַכְאִב पीड़ा पहुँचाने का कारक भाव व्यक्त करता है।
- source_word: מִכֹּל סְבִיבֹתָם
  choice: उन सब आस-पास के लोगों में से
  rationale: संदर्भ में यह केवल भौगोलिक परिवेश नहीं, बल्कि इस्राएल को घेरे हुए शत्रुतापूर्ण लोगों की ओर संकेत करता है; ‘में से’ हिब्रू מִן को स्पष्ट रखता है।
- source_word: הַשָּׁאטִים אוֹתָם
  choice: जो उनका तिरस्कार करते हैं
  rationale: यह कृदन्त लगातार व्यक्त किए जाने वाले अपमान और अवमानना का भाव देता है; ‘तिरस्कार करना’ आधुनिक मानक हिन्दी में सटीक और गरिमापूर्ण है।
- source_word: בֵית יִשְׂרָאֵל
  choice: इस्राएल का घराना
  rationale: यह प्रचलित सामुदायिक और वाचागत पद है; ‘घराना’ मूल रूपक को बनाए रखते हुए हिन्दी में बोधगम्य है।
- source_word: וְיָדְעוּ כִּי אֲנִי
  choice: तब वे जानेंगे कि मैं
  rationale: वाव यहाँ पिछले प्रतिज्ञात्मक कथन के परिणाम की ओर बढ़ता है; ‘तब’ उस संबंध को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: אֲדֹנָי יְהוִה
  choice: प्रभु यहोवा
  rationale: अֲדֹנָי को ‘प्रभु’ और व्यक्तिगत दिव्य नाम יהוה को हिन्दी की परिचित बाइबलीय वर्तनी ‘यहोवा’ से व्यक्त किया गया है, जिससे संयुक्त उपाधि के दोनों अंग अलग बने रहते हैं।
theological_decisions:
- issue: אֲדֹנָי יְהוִה में दिव्य नाम का अनुवाद
  choice: प्रभु यहोवा
  alternative: प्रभु परमेश्वर
  rationale: मूल पाठ में सामान्य उपाधि אֲדֹנָי के साथ चार-अक्षरी व्यक्तिगत नाम יהוה स्पष्ट रूप से उपस्थित है। ‘प्रभु यहोवा’ इस भेद को सुरक्षित रखता है; ‘प्रभु परमेश्वर’ दिव्य नाम को एक सामान्य उपाधि में बदल देता।
- issue: कँटीले पौधों की छवि का संदर्भ
  choice: रूपक को बिना अतिरिक्त व्याख्या के बनाए रखा
  alternative: आस-पास के शत्रु राष्ट्रों को सीधे ‘काँटे’ कहना
  rationale: पद स्वयं हानिकारक पौधों की रूपकात्मक छवि को आसपास के तिरस्कार करने वालों से जोड़ता है। अनुवाद उस तनाव और काव्यात्मक समानता को बनाए रखता है, पर लोगों को सीधे पौधों के रूप में पुनर्लेखित नहीं करता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। वाक्यक्रम हिब्रू के ‘इस्राएल के घराने के लिए फिर कभी नहीं होगा’ के निकट है, पर हिन्दी की स्वाभाविकता हेतु संबंधवाची खंड को पौध-रूपकों से पहले रखा गया है।
