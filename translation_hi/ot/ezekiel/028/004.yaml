  text: בְּ/חָכְמָֽתְ/ךָ֙ וּ/בִ/תְבוּנָ֣תְ/ךָ֔ עָשִׂ֥יתָ לְּ/ךָ֖ חָ֑יִל וַ/תַּ֛עַשׂ זָהָ֥ב וָ/כֶ֖סֶף בְּ/אוֹצְרוֹתֶֽי/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/028/004.yaml
  text: By your wisdom and by your understanding you made wealth for yourself[a], and you put gold and silver into your treasuries.
translation:
  language: hi
  text: अपनी बुद्धि और अपनी समझ से तूने अपने लिए धन[a] कमाया, और अपने खज़ानों में सोना-चाँदी जमा किया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘अपने लिए सामर्थ्य/शक्ति अर्जित की’; इब्रानी शब्द धन, सामर्थ्य या संसाधनों को दर्शा सकता है, पर यहाँ सोने, चाँदी और खज़ानों का उल्लेख ‘धन’ अर्थ के पक्ष में है।
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּחָכְמָתְךָ
  choice: अपनी बुद्धि से
  rationale: ב instrumental है; ‘से’ साधन का अर्थ स्वाभाविक रूप से व्यक्त करता है।
- source_word: וּבִתְבוּנָתְךָ
  choice: और अपनी समझ से
  rationale: תְּבוּנָה समझ, सूझ-बूझ या विवेक को दर्शाता है; ‘समझ’ सरल है और ‘बुद्धि’ से संबंधित होते हुए भी अलग अर्थछाया रखता है।
- source_word: עָשִׂיתָ לְךָ חָיִל
  choice: तूने अपने लिए धन कमाया
  rationale: חַיִל का अर्थ धन, सामर्थ्य या संसाधन हो सकता है। निकटवर्ती सोने, चाँदी और खज़ानों के उल्लेख से यहाँ ‘धन’ मुख्य अर्थ है। हिंदी में ‘धन कमाया’ आर्थिक संचय के लिए स्वाभाविक है।
- source_word: וַתַּעַשׂ
  choice: जमा किया
  rationale: क्रिया का मूल अर्थ ‘करना/बनाना’ है, पर सोने-चाँदी और खज़ानों के साथ परिणामात्मक भाव है; ‘जमा किया’ इस संदर्भ को स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: זָהָב וָכֶסֶף
  choice: सोना-चाँदी
  rationale: यह मूल्यवान धातुओं का प्रचलित और स्वाभाविक हिंदी युग्म है।
- source_word: בְּאוֹצְרוֹתֶיךָ
  choice: अपने खज़ानों में
  rationale: אוֹצָר मूल्यवान वस्तुओं के भंडार या कोष को दर्शाता है; सोने-चाँदी के संदर्भ में ‘खज़ानों’ सटीक है।
theological_decisions:
- issue: सोर के शासक के विरुद्ध वचन में חַיִל का अर्थ
  choice: धन
  alternative: सामर्थ्य, शक्ति या संसाधन
  rationale: तत्काल संदर्भ में सोना, चाँदी और खज़ाने आर्थिक संपदा की ओर संकेत करते हैं; फिर भी शब्द की व्यापक अर्थ-सीमा पादटिप्पणी में सुरक्षित रखी गई है।
translation_notes:
  register: आधुनिक मानक हिंदी; शासक को संबोधित एकवचन ‘तू’ मूल पाठ की प्रत्यक्ष और तीखी संबोधन-शैली को बनाए रखता है। भाषा सहज किंतु गरिमापूर्ण है।
