base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/028/018.yaml
  text: By the abundance of your iniquities[a], in the unrighteousness of your trade, you profaned your sanctuaries[c][b]; so I brought out fire from your midst—it consumed you—and I turned you to ashes on the earth in the sight of all who saw you.
translation:
  language: hi
  text: तेरे अधर्मों की बहुतायत और तेरे व्यापार के अन्याय के कारण तूने अपने पवित्रस्थानों[a] को अपवित्र किया। इसलिए मैंने तेरे बीच से आग निकाली; उसने तुझे भस्म कर दिया। मैंने तुझे तेरे सब देखनेवालों के देखते-देखते धरती पर राख कर दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से ‘तेरे पवित्रस्थान’; इब्रानी शब्द बहुवचन में है। इसका सटीक संदर्भ यहाँ निश्चित नहीं किया गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵרֹב עֲוֺנֶיךָ
  choice: तेरे बहुत-से अधर्मों के कारण
  rationale: מִן के साथ רֹב यहाँ कारण व्यक्त करता है। עָוֹן के बहुवचन को रखते हुए ‘अधर्मों’ नैतिक अपराध का गंभीर भाव देता है।
- source_word: בְּעֶוֶל רְכֻלָּתְךָ
  choice: तेरे व्यापार में किए गए अन्याय के कारण
  rationale: עֶוֶל अन्याय या दुष्टता और רְכֻלָּה व्यापारिक गतिविधि को दर्शाता है। हिन्दी में यह रचना संबंध को स्वाभाविक और स्पष्ट रखती है।
- source_word: חִלַּלְתָּ מִקְדָּשֶׁיךָ
  choice: तूने अपने पवित्रस्थानों को अपवित्र किया
  rationale: חלל का पिएल रूप पवित्र वस्तु या स्थान को अपवित्र करने का अर्थ देता है; מִקְדָּשֶׁיךָ का बहुवचन स्पष्ट रूप से बनाए रखा गया है।
- source_word: וָאוֹצִא אֵשׁ מִתּוֹכְךָ
  choice: इसलिए मैंने तेरे बीच से आग निकाली
  rationale: वाव-क्रम परिणामस्वरूप न्याय को आगे बढ़ाता है और מִתּוֹךְ का स्थानिक भाव ‘तेरे बीच से’ में सुरक्षित है।
- source_word: הִיא אֲכָלַתְךָ
  choice: उसने तुझे भस्म कर दिया
  rationale: स्त्रीलिंग सर्वनाम का पूर्वपद ‘आग’ है। ‘भस्म कर दिया’ आग द्वारा पूर्ण विनाश के बिंब को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וָאֶתֶּנְךָ לְאֵפֶר עַל הָאָרֶץ
  choice: मैंने तुझे धरती पर राख कर दिया
  rationale: शाब्दिक ‘तुझे राख के लिए/राख बना दिया’ का परिणामात्मक अर्थ सहज हिन्दी में रखा गया है; הָאָרֶץ को व्यापक ‘धरती’ अनूदित किया गया है।
- source_word: לְעֵינֵי כָּל רֹאֶיךָ
  choice: उन सबकी आँखों के सामने, जो तुझे देखते थे
  rationale: इब्रानी मुहावरे का दृश्य और सार्वजनिक न्याय पर बल निकटता से सुरक्षित रहता है।
theological_decisions:
- issue: सोर के राजा पर विलाप में ‘तेरे पवित्रस्थान’ का संदर्भ
  choice: इब्रानी के बहुवचन और उपासना-संबंधी अर्थ को ‘तेरे पवित्रस्थान’ के रूप में बनाए रखना
  alternative: इसे केवल राजकीय गौरव, सोर के नगर-मंदिरों, या किसी अलौकिक प्राणी के स्वर्गीय पवित्रस्थानों के रूप में स्पष्ट कर देना
  rationale: मूल पाठ बहुवचन धार्मिक शब्द का प्रयोग करता है, पर उसका सटीक संदर्भ विवादित है। अनुवाद किसी एक ऐतिहासिक, रूपकात्मक या अलौकिक व्याख्या को आरोपित नहीं करता।
- issue: व्यक्ति के भीतर/बीच से निकलती आग का न्याय-बिंब
  choice: ‘तेरे बीच से आग निकाली’
  alternative: आग को केवल बाहरी दंड या अंतर्निहित नैतिक विनाश की व्याख्या के रूप में स्पष्ट करना
  rationale: मूल पाठ आग के उसके बीच से निकलने और उसी को भस्म करने का तनावपूर्ण बिंब देता है; इसे व्याख्यात्मक रूप से सीमित नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में गंभीर भविष्यद्वाणीपरक शैली रखी गई है। संबोधन के लिए एकवचन ‘तू/तेरे’ मूल के निकट है। वाक्य-विन्यास को पठनीय बनाने हेतु लंबे इब्रानी क्रम को तीन वाक्यों में बाँटा गया है, जबकि कारण, न्याय और सार्वजनिक अपमान का क्रम सुरक्षित है।
