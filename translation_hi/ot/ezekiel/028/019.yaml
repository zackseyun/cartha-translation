review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the universal scope, the reaction of stunned horror, the predicate of becoming an object/cause of terror, and irreversible disappearance. However, ‘देश-देश के लोगों में’ is less direct and less natural than a formulation using ‘राष्ट्रों,’ and ‘रह गए हैं’ can sound more narrowly like a completed past reaction than the Hebrew’s present/resultative force in this oracle.
  naturalness: The direct second-person register is appropriate. ‘विभिन्न राष्ट्रों में तुझे जाननेवाले सभी लोग’ is clearer modern Hindi, and ‘तुझे देखकर स्तब्ध हैं’ is concise and idiomatic.
  terminology: ‘आतंक का कारण’ is a viable contextual rendering of בַּלָּהוֹת, expressing that the addressee has become a cause/object of terror. The footnote appropriately preserves the more formally literal alternatives. ‘राष्ट्रों’ is a standard Hindi contextual equivalent for עַמִּים; a footnote notes ‘लोगों’ as the lexical alternative.
  issues:
  - severity: low
    issue: ‘देश-देश के लोगों में’ is awkward and somewhat diffuse for בָּעַמִּים.
    rationale: The Hebrew denotes peoples/nations. ‘विभिन्न राष्ट्रों में’ is more idiomatic modern Hindi and retains the plural collective scope.
  - severity: low
    issue: ‘स्तब्ध रह गए हैं’ gives the reaction a more completed-past coloring.
    rationale: The Hebrew perfect can be resultative/prophetic in context. ‘स्तब्ध हैं’ preserves the resulting state while maintaining natural Hindi.
  revised_text: विभिन्न राष्ट्रों में तुझे जाननेवाले सभी लोग तुझे देखकर स्तब्ध हैं[a]; तू आतंक का कारण बन गया है[b], और फिर कभी तेरा अस्तित्व नहीं रहेगा।
