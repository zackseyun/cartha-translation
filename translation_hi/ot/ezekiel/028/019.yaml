source:
  edition: WLC
  text: כָּל יוֹדְעֶ֨י/ךָ֙ בָּֽ/עַמִּ֔ים שָׁמְמ֖וּ עָלֶ֑י/ךָ בַּלָּה֣וֹת הָיִ֔יתָ וְ/אֵינְ/ךָ֖ עַד עוֹלָֽם־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/028/019.yaml
  text: All who know you among the peoples are appalled at you[a]; you have become a horror[b], and you will be no more forever.
translation:
  language: hi
  text: विभिन्न राष्ट्रों में तुझे जाननेवाले सभी लोग तुझे देखकर स्तब्ध हैं[a]; तू आतंक का कारण बन गया है[b], और फिर कभी तेरा अस्तित्व नहीं रहेगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “विभिन्न लोगों में।”
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “तू आतंक बन गया है”; या, “तू भयों का रूप बन गया है” / “तू भय का विषय बन गया है।”
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל יוֹדְעֶיךָ
  choice: जितने तुझे जानते हैं...वे सब
  rationale: यह स्वाभाविक हिन्दी में समस्त जानने वालों को समेटने वाला वितरक भाव व्यक्त करता है और participle के सामान्य चरित्र-वर्णन को बनाए रखता है।
- source_word: בָּעַמִּים
  choice: देश-देश के लोगों में
  rationale: עַמִּים का अर्थ अलग-अलग जनसमुदाय है। यह प्रयोग आधुनिक हिन्दी में बहुवचन और व्यापक अंतरराष्ट्रीय दायरे को स्वाभाविक रूप से व्यक्त करता है।
- source_word: שָׁמְמוּ עָלֶיךָ
  choice: तुझे देखकर स्तब्ध रह गए हैं
  rationale: שמם यहाँ न्याय के परिणाम पर भय-मिश्रित विस्मय और सन्न रह जाने का भाव देता है; על को प्रतिक्रिया के कारण/विषय के रूप में व्यक्त किया गया है।
- source_word: בַּלָּהוֹת הָיִיתָ
  choice: तू आतंक का कारण बन गया है
  rationale: बहुवचन abstract noun בלהות को विधेय के रूप में स्वाभाविक हिन्दी में किसी आतंककारी वस्तु या कारण के अर्थ में रखा गया है, बिना उसे केवल आंतरिक भय की अवस्था बनाने के।
- source_word: וְאֵינְךָ עַד־עוֹלָם
  choice: और फिर कभी तेरा अस्तित्व नहीं रहेगा
  rationale: अस्तित्ववाचक निषेध और स्थायी अंतिमता दोनों को स्पष्ट, आधुनिक हिन्दी में व्यक्त करता है; प्रसंग के कारण भविष्यकाल न्यायवाणी की परिणति को सामने लाता है।
theological_decisions:
- issue: अंतिम अस्तित्व-निषेध का बल
  choice: फिर कभी तेरा अस्तित्व नहीं रहेगा
  alternative: और तू सदा के लिए नहीं है / तू फिर कभी नहीं रहेगा
  rationale: यह राजकीय/न्याय-वाणी में संबोधित व्यक्ति की अपरिवर्तनीय समाप्ति को व्यक्त करता है, पर इस पद से आगे बढ़कर किसी व्यापक परलोक-सिद्धांत का निर्णय नहीं करता।
- issue: בַּלָּהוֹת का बहुवचन और आशय
  choice: आतंक का कारण
  alternative: आतंक / भयों का रूप
  rationale: हिब्रू बहुवचन तीव्र या अमूर्त भयावहता का संकेत दे सकता है। हिन्दी में 'आतंक का कारण' संबोधित सत्ता के दूसरों के लिए भयावह दृश्य या वस्तु बन जाने का भाव स्पष्ट करता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सुबोध रखी गई है। एकवचन संबोधन में ‘तू/तुझे/तेरा’ मूल के 2ms रूप और भविष्यद्वाणी की सीधी, तीखी वाणी को बनाए रखता है।
