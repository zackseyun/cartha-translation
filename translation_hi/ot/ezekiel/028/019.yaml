  to: विभिन्न राष्ट्रों में तुझे जाननेवाले सभी लोग तुझे देखकर स्तब्ध हैं[a]; तू आतंक का कारण बन गया है[b], और फिर कभी तेरा अस्तित्व नहीं रहेगा।
