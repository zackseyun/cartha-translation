base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/028/025.yaml
  text: 'Thus says the Lord GOD: When I gather the house of Israel from the peoples among whom they were scattered[a], and I show myself holy among them in the sight of the nations, then they will dwell on their own land that I gave to my servant Jacob.'
translation:
  language: hi
  text: 'प्रभु याहवे यों कहते हैं: जब मैं इस्राएल के घराने को उन जातियों के बीच से इकट्ठा करूँगा, जिनके बीच वे तितर-बितर हो गए थे, और उनके बीच राष्ट्रों की दृष्टि में अपने को पवित्र प्रकट करूँगा,[a] तब वे अपनी भूमि पर बसेंगे, जिसे मैंने अपने सेवक याकूब को दिया था।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक शाब्दिक रूप में: “उनमें पवित्र ठहरूँगा।” इसका अर्थ “उनके द्वारा अपने को पवित्र सिद्ध करूँगा” भी हो सकता है।'
    reason: וְנִקְדַּשְׁתִּי בָם के निफ़अल रूप तथा בָם के स्थानिक अथवा साधनात्मक अर्थ की वास्तविक अस्पष्टता को सुरक्षित रखना।
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  choice: प्रभु यहोवा
  rationale: संयुक्त ईश्वरीय उपाधि के दोनों तत्वों को अलग रखते हुए אֲדֹנָי को ‘प्रभु’ और वाचा-संबंधी नाम יהוה को ‘यहोवा’ से व्यक्त किया गया है।
- source_word: בְּקַבְּצִי
  choice: जब मैं ... इकट्ठा करूँगा
  rationale: בְּ के साथ प्रथम पुरुष प्रत्यययुक्त infinitive construct यहाँ समयसूचक है; हिंदी में भविष्यकालीन ‘जब’ उपवाक्य स्वाभाविक है।
- source_word: בֵּית יִשְׂרָאֵל
  choice: इस्राएल के घराने
  rationale: मूल के सामूहिक और वाचा-संबंधी रूपक ‘घराने’ को बनाए रखा गया है।
- source_word: מִן הָעַמִּים
  choice: जाति-जाति के लोगों के बीच से
  rationale: עַמִּים को सामुदायिक ‘peoples’ अर्थ में व्यक्त करता है और आगे आने वाले הַגּוֹיִם ‘राष्ट्रों’ से शब्दगत भेद बनाए रखता है।
- source_word: נָפֹצוּ בָם
  choice: जिनके बीच वे तितर-बितर हो गए थे
  rationale: निफ़अल रूप बिखर जाने की स्थिति बताता है; בָם को ‘जिनके बीच’ से सहज रूप में व्यक्त किया गया है।
- source_word: וְנִקְדַּשְׁתִּי בָם
  choice: उनके बीच अपने को ... पवित्र प्रकट करूँगा
  rationale: ईश्वर की पवित्रता के सार्वजनिक रूप से प्रकट होने का भाव देता है, जबकि בָם के ‘उनमें/उनके बीच’ अर्थ को मुख्य पाठ में सुरक्षित रखता है।
- source_word: לְעֵינֵי הַגּוֹיִם
  choice: राष्ट्रों की दृष्टि में
  rationale: दृश्य और सार्वजनिक साक्ष्य के मूल मुहावरे को स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: וְיָשְׁבוּ עַל אַדְמָתָם
  choice: तब वे अपनी भूमि पर बसेंगे
  rationale: יָשַׁב के स्थायी निवास और אַדְמָתָם के अधिकारसूचक भाव को स्पष्ट करता है।
- source_word: אֲשֶׁר נָתַתִּי לְעַבְדִּי לְיַעֲקֹב
  choice: जिसे मैंने अपने सेवक याकूब को दिया था
  rationale: याकूब के लिए वाचा-संबंधी पद ‘मेरे सेवक’ को अक्षुण्ण रखते हुए स्वाभाविक हिंदी क्रम अपनाया गया है।
theological_decisions:
- issue: संयुक्त ईश्वरीय नाम אֲדֹנָי יְהוִה का अनुवाद
  choice: प्रभु यहोवा
  alternative: प्रभु परमेश्वर
  rationale: मूल में आए वाचा-संबंधी व्यक्तिगत नाम को छिपाए बिना, दोनों हिब्रू तत्वों को अलग-अलग व्यक्त किया गया है।
- issue: וְנִקְדַּשְׁתִּי בָם में ईश्वर के पवित्र ठहरने का अर्थ
  choice: उनके बीच अपने को पवित्र प्रकट करूँगा
  alternative: उनमें पवित्र ठहरूँगा; उनके द्वारा अपने को पवित्र सिद्ध करूँगा
  rationale: निफ़अल की वास्तविक अस्पष्टता को पूरी तरह साधनात्मक अर्थ में सीमित नहीं किया गया। मुख्य पाठ संदर्भानुसार सार्वजनिक प्रकटीकरण बताता है और ‘उनके बीच’ स्थानिक/सामुदायिक बल को रखता है; अन्य संभव अर्थ पादटिप्पणी में दिए गए हैं।
translation_notes:
  register: आधुनिक मानक हिंदी का गरिमापूर्ण, सार्वजनिक पाठ के योग्य रूप अपनाया गया है। ‘यों कहते हैं’, ‘घराना’, ‘तितर-बितर’ और ‘दृष्टि में’ जैसे परिचित बाइबलीय पद रखे गए हैं, पर वाक्य-विन्यास सहज रखा गया है।
