translation:
  language: hi
  text: 'और याहवे का वचन मेरे पास पहुँचा:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: पहुँचा
  rationale: यहाँ היה का वाव-अनुक्रमिक रूप भविष्यद्वाणी के प्रचलित आरंभिक सूत्र का भाग है। हिंदी में ‘वचन मेरे पास पहुँचा’ स्वाभाविक ढंग से घटना और कथानक की निरंतरता व्यक्त करता है।
- source_word: דְבַר
  choice: वचन
  rationale: दְבַר־יְהוָה भविष्यद्वाणी का स्थापित सूत्र है। ‘वचन’ मूल रूपक और धार्मिक संदर्भ को बनाए रखता है तथा ‘संदेश’ की अपेक्षा कम व्याख्यात्मक है।
- source_word: יְהוָה
  choice: याहवे
  rationale: मूल पाठ में परमेश्वर का व्यक्तिगत नाम टेट्राग्रामटन है; इसलिए किसी उपाधि से बदलने के बजाय उसका देवनागरी लिप्यंतरण किया गया है।
- source_word: אֵלַי
  choice: मेरे पास
  rationale: पूर्वसर्ग और प्रथम पुरुष एकवचन प्रत्यय वचन के नबी तक आने की दिशा बताते हैं; ‘मेरे पास’ आधुनिक हिंदी में इस सूत्र के साथ सहज है।
- source_word: לֵאמֹר
  choice: उसने कहा
  rationale: यह infinitive construct आगे आने वाली प्रत्यक्ष वाणी का परिचय देता है। हिंदी में स्वतंत्र उपवाक्य ‘उसने कहा’ अस्पष्ट कृदंत ‘कहते हुए’ की अपेक्षा स्वाभाविक और स्पष्ट है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा / प्रभु
  rationale: इब्रानी पाठ व्यक्तिगत ईश्वरीय नाम का प्रयोग करता है। ‘याहवे’ नाम को नाम ही रहने देता है और उसे ‘प्रभु’ जैसी उपाधि से नहीं बदलता; साथ ही किसी संप्रदायगत व्याख्या को नहीं जोड़ता।
- issue: לֵאמֹר में निहित वक्ता
  choice: उसने कहा
  alternative: यह कहते हुए / कहा गया
  rationale: व्याकरणतः לֵאמֹר केवल आगामी कथन का परिचय देता है और अलग से कर्ता नहीं बताता, पर भविष्यद्वाणी के सूत्र में वचन का स्रोत याहवे है। हिंदी में पुल्लिंग एकवचन ‘उसने’ उसी संदर्भित वक्ता को स्वाभाविक रूप से व्यक्त करता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘वचन’ भविष्यद्वाणी के पारंपरिक सूत्र को सुरक्षित रखता है, जबकि ‘मेरे पास पहुँचा’ और ‘उसने कहा’ शब्दशः किंतु अस्वाभाविक हिंदी से बचते हैं।
