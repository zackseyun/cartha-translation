  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/נָשַׁ֨מּוּ֙ מִזְבְּח֣וֹתֵי/כֶ֔ם וְ/נִשְׁבְּר֖וּ חַמָּֽנֵי/כֶ֑ם וְ/הִפַּלְתִּי֙ חַלְלֵי/כֶ֔ם לִ/פְנֵ֖י גִּלּוּלֵי/כֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/006/004.yaml
  text: Your altars will be desolated[a], and your incense altars will be broken[b]; and I will cast down your slain before your idols.
translation:
  language: hi
  text: तुम्हारी वेदियाँ उजाड़ दी जाएँगी, और तुम्हारी धूप-वेदियाँ[b] तोड़ डाली जाएँगी; और मैं तुम्हारे मारे हुओं को तुम्हारी घिनौनी मूर्तियों[a] के सामने गिरा दूँगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी शब्द גִּלּוּלִים मूर्तियों के लिए अत्यंत तिरस्कारपूर्ण शब्द है; अधिक शाब्दिक रूप से ‘मल-मूर्तियाँ’ भी कहा जा सकता है।
    reason: lexical_alternative
  - marker: b
    text: या ‘सूर्य-स्तंभ’; इब्रानी חַמָּנִים निषिद्ध उपासना से जुड़ी पूजा-वस्तुओं को दर्शाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: נָשַׁמּוּ
  choice: उजाड़ दी जाएँगी
  rationale: निफ़अल रूप उजाड़ या निर्जन कर दिए जाने की परिणामी अवस्था व्यक्त करता है; यह वाक्यांश न्याय की निष्क्रिय/resultative छाया को स्वाभाविक हिन्दी में रखता है।
- source_word: מִזְבְּחוֹתֵיכֶם
  choice: तुम्हारी वेदियाँ
  rationale: מִזְבֵּחַ का सामान्य और स्पष्ट हिन्दी समतुल्य ‘वेदी’ है; प्रसंग में इसे और संकीर्ण करने की आवश्यकता नहीं है।
- source_word: נִשְׁבְּרוּ
  choice: तोड़ डाली जाएँगी
  rationale: निफ़अल का अर्थ ‘तोड़ी जाएँगी’ है; ‘तोड़ डाली जाएँगी’ विनाश की तीव्रता को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: חַמָּנֵיכֶם
  choice: तुम्हारी धूप-वेदियाँ
  rationale: यह शब्द निषिद्ध उपासना से जुड़ी पूजा-वस्तुओं को दर्शाता है और संभवतः सूर्य-स्तंभों अथवा धूप-वेदियों के लिए प्रयुक्त है। मुख्य पाठ में प्रसंगानुकूल और समझने योग्य ‘धूप-वेदियाँ’ रखा गया है, जबकि अनिश्चितता पादटिप्पणी में सुरक्षित है।
- source_word: הִפַּלְתִּי
  choice: मैं ... गिरा दूँगा
  rationale: נפל का हिफ़ील रूप कारणवाचक है—‘गिरा देना’। यह परमेश्वर की जानबूझकर की गई न्याय-क्रिया को सीधे व्यक्त करता है।
- source_word: חַלְלֵיכֶם
  choice: तुम्हारे मारे हुओं
  rationale: חָלָל युद्ध या हिंसा में मारे गए लोगों को दर्शाता है। ‘मारे हुओं’ संक्षिप्त है और मूल में निहित न होने वाला लिंग नहीं जोड़ता।
- source_word: לִפְנֵי
  choice: के सामने
  rationale: यह स्थानवाचक अर्थ ‘के सामने’ को स्पष्ट रूप से व्यक्त करता और मूर्तियों के आगे पड़े शवों की विडंबना बनाए रखता है।
- source_word: גִּלּוּלֵיכֶם
  choice: तुम्हारी घिनौनी मूर्तियों
  rationale: यहेजकेल में גִּלּוּלִים मूर्तियों के लिए जानबूझकर तिरस्कारपूर्ण शब्द है। ‘घिनौनी मूर्तियाँ’ उस अलंकारिक तीखेपन को स्वाभाविक हिन्दी में व्यक्त करता है; अधिक शाब्दिक संभावना पादटिप्पणी में दी गई है।
theological_decisions:
- issue: मूर्तियों के लिए यहेजकेल के तिरस्कारपूर्ण शब्द की शक्ति
  choice: मुख्य पाठ में ‘घिनौनी मूर्तियाँ’
  alternative: सिर्फ ‘मूर्तियाँ’, अथवा अधिक शाब्दिक ‘मल-मूर्तियाँ’
  rationale: मूल शब्द केवल सामान्य ‘मूर्ति’ नहीं, बल्कि घृणा और तिरस्कार व्यक्त करता है। ‘घिनौनी मूर्तियाँ’ इस धर्मवैचारिक और अलंकारिक तनाव को बिना अस्वाभाविक हुए बनाए रखता है; ‘मल-मूर्तियाँ’ को पादटिप्पणी में सुरक्षित किया गया है।
- issue: חַמָּנִים की विशिष्ट पहचान
  choice: मुख्य पाठ में ‘धूप-वेदियाँ’
  alternative: ‘सूर्य-स्तंभ’
  rationale: इन पूजा-वस्तुओं की ठीक पहचान निश्चित नहीं है और वे धूप अथवा सूर्य-पूजा से जुड़ी हो सकती हैं। मुख्य पाठ एक समझने योग्य cultic वस्तु देता है, जबकि वैकल्पिक पहचान पादटिप्पणी में रखकर वास्तविक अनिश्चितता सुरक्षित की गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, स्पष्ट और सामान्य पाठक के लिए सुबोध रूप। भविष्यकाल न्याय की भविष्यवाणी को व्यक्त करता है। ‘घिनौनी’ मूल के तिरस्कारपूर्ण स्वर को बनाए रखता है, और दोनों वास्तविक शब्दार्थगत अनिश्चितताएँ पादटिप्पणियों में दी गई हैं।
