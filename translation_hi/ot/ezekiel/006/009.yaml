  text: וְ/זָכְר֨וּ פְלִֽיטֵי/כֶ֜ם אוֹתִ֗/י בַּ/גּוֹיִם֮ אֲשֶׁ֣ר נִשְׁבּוּ שָׁם֒ אֲשֶׁ֨ר נִשְׁבַּ֜רְתִּי אֶת לִבָּ֣/ם הַ/זּוֹנֶ֗ה אֲשֶׁר סָר֙ מֵֽ/עָלַ֔/י וְ/אֵת֙ עֵֽינֵי/הֶ֔ם הַ/זֹּנ֕וֹת אַחֲרֵ֖י גִּלּֽוּלֵי/הֶ֑ם וְ/נָקֹ֨טּוּ֙ בִּ/פְנֵי/הֶ֔ם אֶל הָֽ/רָעוֹת֙ אֲשֶׁ֣ר עָשׂ֔וּ לְ/כֹ֖ל תּוֹעֲבֹתֵי/הֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/006/009.yaml
  text: Then your survivors will remember me among the nations where they were taken captive[a], when I have broken their whoring heart that turned away from me, and their eyes that whored after their idols[c][b]; and they will loathe themselves for the evils they committed in all their abominations.
translation:
  language: hi
  text: तब तुम्हारे बचे हुए लोग उन राष्ट्रों के बीच, जहाँ उन्हें बंदी बनाकर ले जाया गया होगा, मुझे याद करेंगे—जब उनका वह व्यभिचारी मन, जो मुझसे फिर गया था, और उनकी वे आँखें, जो उनकी घिनौनी मूर्तियों के पीछे व्यभिचार करती थीं, मुझे तोड़ चुकी होंगी[a][b][c]। तब वे अपने सभी घिनौने कामों में की हुई बुराइयों के कारण अपने आप से घृणा करेंगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या संभवतः, “जब मैंने उनके उस व्यभिचारी मन को, जो मुझसे फिर गया था, और उनकी उन आँखों को, जो उनकी मूर्तियों के पीछे व्यभिचार करती थीं, तोड़ दिया होगा।” कुछ व्याख्याकार हिब्रू क्रिया को इस सक्रिय अर्थ में समझते हैं; मुख्य पाठ में उसे “मुझे तोड़ चुकी होंगी” समझने से उनकी अविश्वासयोग्यता पर यहोवा के गहरे दुःख का भाव प्रकट होता है।
    reason: alternative_reading
  - marker: b
    text: यहाँ व्यभिचार की भाषा वाचा के प्रति विश्वासघात और मूर्तिपूजा की उपमा है।
    reason: cultural_note
  - marker: c
    text: “घिनौनी मूर्तियाँ” के लिए प्रयुक्त हिब्रू शब्द तिरस्कारपूर्ण है; इसका अनुवाद केवल “मूर्तियाँ” भी किया जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְזָכְרוּ פְלִיטֵיכֶם
  choice: तब तुम्हारे बचे हुए लोग ... मुझे याद करेंगे
  rationale: भविष्यसूचक क्रम में वाव परिणाम या अगली अवस्था दिखाता है; ‘तब’ इसे स्वाभाविक हिन्दी में व्यक्त करता है। פְלִיטֵיכֶם विनाश से बच निकले लोगों को सूचित करता है।
- source_word: בַּגּוֹיִם אֲשֶׁר נִשְׁבּוּ שָׁם
  choice: उन राष्ट्रों के बीच ... जहाँ उन्हें बंदी बनाकर ले जाया गया होगा
  rationale: גּוֹיִם यहाँ निर्वासन के विदेशी राष्ट्र हैं और נשבו बंदी बनाए जाने का कर्मवाच्य अर्थ देता है।
- source_word: אֲשֶׁר נִשְׁבַּרְתִּי אֶת־לִבָּם הַזּוֹנֶה
  choice: मैंने उनके व्यभिचारी मन को ... तोड़ दिया होगा
  rationale: मसोरा-पाठ में प्रथम पुरुष कर्ता और सीधा कर्म-सूचक אֶת सक्रिय अर्थ का समर्थन करते हैं। ‘व्यभिचारी मन’ वाचा-विमुखता की यौन उपमा को बनाए रखते हुए हिन्दी में स्वाभाविक है।
- source_word: וְאֵת עֵינֵיהֶם הַזֹּנוֹת אַחֲרֵי גִּלּוּלֵיהֶם
  choice: और उनकी आँखों को, जो उनकी घिनौनी मूर्तियों के पीछे व्यभिचार करती थीं
  rationale: आँखों का ‘व्यभिचार करना’ मूल की जानबूझकर तीखी और सजीव उपमा को सुरक्षित रखता है। גִּלּוּלִים के तिरस्कारपूर्ण भाव को ‘घिनौनी मूर्तियाँ’ व्यक्त करता है।
- source_word: וְנָקֹטּוּ בִּפְנֵיהֶם
  choice: वे ... अपने आप से घृणा करेंगे
  rationale: हिब्रू मुहावरा अपने ही प्रति घोर वितृष्णा व्यक्त करता है; यह हिन्दी में स्पष्ट और स्वाभाविक रूप है।
- source_word: אֶל הָרָעוֹת ... לְכֹל תּוֹעֲבֹתֵיהֶם
  choice: उन बुरे कामों के कारण ... अपने सारे घिनौने कामों में
  rationale: אֶל यहाँ घृणा का कारण/विषय बताता है। תּוֹעֵבוֹת नैतिक और धार्मिक रूप से घृणित आचरण के लिए प्रबल वाचिक शब्द है।
theological_decisions:
- issue: נִשְׁבַּרְתִּי का कर्ता और अर्थ
  choice: परमेश्वर उनके व्यभिचारी मन और मूर्तियों के पीछे जाने वाली आँखों को तोड़ता है।
  alternative: ‘मैं उनके व्यभिचारी मन ... के कारण टूट गया था,’ अर्थात उनकी अविश्वासयोग्यता से परमेश्वर का दुःखित होना।
  rationale: मसोरा की स्वर-रचना तथा אֶת के साथ आए कर्म सक्रिय अर्थ को बल देते हैं, फिर भी रूप की प्राचीन और अर्थपूर्ण वैकल्पिक व्याख्या को पाद-टिप्पणी में सुरक्षित रखा गया है।
- issue: व्यभिचार की उपमा
  choice: ‘व्यभिचारी मन’ और ‘आँखें ... व्यभिचार करती थीं’
  alternative: उपमा को नरम करके केवल ‘अविश्वासी’ या ‘लालसा करती थीं’ कहना।
  rationale: यहेजकेल वाचा के प्रति विश्वासघात और मूर्तिपूजा के लिए यौन-अविश्वास की तीखी उपमा जानबूझकर इस्तेमाल करता है; इसे मिटाना पाठ के अलंकारिक और धार्मिक तनाव को घटा देता।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सामान्य पाठक के लिए स्पष्ट स्तर रखा गया है। ‘मन’ לב के इच्छात्मक और निष्ठा-संबंधी अर्थ को स्वाभाविक हिन्दी में देता है। मूल की कठोर व्यभिचार-उपमा तथा גִּלּוּלִים का तिरस्कारपूर्ण स्वर सुरक्षित रखा गया है; वास्तविक पाठगत/व्याकरणिक तनाव पाद-टिप्पणी में प्रस्तुत है।
