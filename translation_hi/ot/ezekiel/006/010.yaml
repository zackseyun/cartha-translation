id: EZK.6.10
reference: Ezekiel 6:10
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/יָדְע֖וּ כִּֽי אֲנִ֣י יְהוָ֑ה לֹ֤א אֶל חִנָּם֙ דִּבַּ֔רְתִּי לַ/עֲשׂ֥וֹת לָ/הֶ֖ם הָ/רָעָ֥ה הַ/זֹּֽאת־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/006/010.yaml
  text: Then they will know that I am Yahweh[b][a]; I did not speak in vain when I said I would bring this disaster upon them.
translation:
  language: hi
  text: तब वे जानेंगे कि मैं यहोवा हूँ। मैंने व्यर्थ[a] नहीं कहा था कि मैं उन पर यह विपत्ति[b] लाऊँगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘यों ही नहीं’ अथवा ‘बिना कारण नहीं।’
    reason: lexical_alternative
  - marker: b
    text: मूल इब्रानी में ‘यह बुराई’; यहाँ इसका अर्थ नैतिक बुराई नहीं, बल्कि न्याय के रूप में आने वाली विपत्ति या आपदा है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָדְעוּ
  choice: तब वे जानेंगे
  rationale: संयोजक वाव के साथ पूर्ण क्रिया यहाँ भविष्यसूचक प्रसंग में परिणाम बताती है; ‘तब’ पिछले न्याय के फल को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: כִּי אֲנִי יְהוָה
  choice: कि मैं यहोवा हूँ
  rationale: यहेजकेल में बार-बार आने वाले पहचान-सूत्र की संरचना सुरक्षित रखी गई है और परमेश्वर के व्यक्तिगत नाम को ‘यहोवा’ के रूप में लिप्यंतरित किया गया है।
- source_word: לֹא אֶל חִנָּם
  choice: व्यर्थ नहीं
  rationale: यह मुहावरा बताता है कि यहोवा का वचन निष्फल, खोखला या निराधार नहीं था। ‘व्यर्थ नहीं’ संक्षिप्त और स्वाभाविक है, जबकि अन्य संभव अर्थ पादटिप्पणी में दिए गए हैं।
- source_word: דִּבַּרְתִּי
  choice: मैंने ... नहीं कहा था
  rationale: हिन्दी में आगामी कथन के साथ ‘कहा था’ अधिक स्वाभाविक है और पूर्व में घोषित दिव्य वचन पर बल बनाए रखता है।
- source_word: לַעֲשׂוֹת לָהֶם
  choice: कि मैं उन पर ... लाऊँगा
  rationale: शाब्दिक ‘उनके साथ करने के लिए’ हिन्दी में अस्वाभाविक होता। यह रूप पूर्वघोषित उद्देश्य और उनके विरुद्ध आने वाली कार्रवाई दोनों को स्पष्ट रखता है।
- source_word: הָרָעָה הַזֹּאת
  choice: यह विपत्ति
  rationale: इस संदर्भ में רָעָה नैतिक बुराई नहीं, बल्कि न्याय के रूप में आने वाली हानिकारक विपत्ति को दर्शाता है।
theological_decisions:
- issue: יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: परमेश्वर के व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय परिचित हिन्दी रूप ‘यहोवा’ में प्रस्तुत किया गया है।
- issue: दिव्य न्याय के संदर्भ में הָרָעָה
  choice: विपत्ति
  alternative: बुराई
  rationale: यहाँ शब्द परमेश्वर द्वारा लाई जाने वाली दंडात्मक आपदा को सूचित करता है, परमेश्वर में नैतिक बुराई को नहीं; ‘विपत्ति’ इस अर्थ को स्पष्ट रखते हुए न्याय की कठोरता बनाए रखता है।
- issue: לֹא אֶל חִנָּם की अर्थ-सीमा
  choice: व्यर्थ नहीं
  alternative: बिना कारण नहीं
  rationale: मुख्य पाठ में वचन के निष्फल न होने का भाव रखा गया है, पर मुहावरे में ‘बिना कारण’ का अर्थ भी संभव है; उसे पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और सार्वजनिक पाठ के अनुकूल रूप। पहचान-सूत्र को औपचारिक ढंग से रखा गया है, जबकि कठिन इब्रानी उद्देश्य-वाक्य को स्वाभाविक हिन्दी में व्यक्त किया गया है।
