  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/הוֹתַרְתִּ֗י בִּ/הְי֥וֹת לָ/כֶ֛ם פְּלִ֥יטֵי חֶ֖רֶב בַּ/גּוֹיִ֑ם בְּ/הִזָּרֽוֹתֵי/כֶ֖ם בָּ/אֲרָצֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/006/008.yaml
  text: Yet I will leave a remnant[a], when some of you become escapees from the sword among the nations, when you are scattered through the lands.
translation:
  language: hi
  text: फिर भी मैं राष्ट्रों के बीच तलवार से बच निकलने वाले तुम्हारे कुछ लोगों को शेष रखूँगा[a], जब तुम अलग-अलग देशों में तितर-बितर किए जाओगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मैं तुम्हारे कुछ लोगों को बचा रहने दूँगा।”
    reason: הוֹתַרְתִּי का अर्थ ‘शेष रहने देना,’ ‘बचा छोड़ना,’ या ‘बचा रहने देना’ हो सकता है।
lexical_decisions:
- source_word: וְהוֹתַרְתִּי
  choice: फिर भी मैं तुममें से कुछ को शेष रखूँगा
  rationale: הותיר के हिफ़ील रूप का अर्थ किसी को बचा या शेष रहने देना है। पिछले न्याय-वचनों के विपरीत यहाँ दया की ध्वनि होने के कारण וְ को प्रसंगानुसार “फिर भी” कहा गया है। “तुममें से कुछ” हिन्दी में बचे हुए समूह का भाव स्वाभाविक रूप से व्यक्त करता है।
- source_word: בִּהְיוֹת לָכֶם
  choice: तुममें से कुछ लोग … होंगे/बच निकलेंगे
  rationale: בְּ सहित infinitive construct समयसूचक परिस्थिति बताता है, और לָכֶם अस्तित्व अथवा संबंध का भाव देता है—शाब्दिक रूप से, “जब तुम्हारे लिए/तुम्हारे बीच … हों।” हिन्दी में इसे “तुममें से कुछ लोग” कहकर स्वाभाविक बनाया गया है।
- source_word: פְּלִיטֵי חֶרֶב
  choice: तलवार से बच निकलेंगे
  rationale: פְּלִיטֵי भागकर बचने वालों या बचे हुए लोगों को दर्शाता है। “तलवार से बच निकलेंगे” युद्धजनित संकट से वास्तविक बच निकलने का सजीव भाव बनाए रखता है।
- source_word: בַּגּוֹיִם
  choice: राष्ट्रों के बीच
  rationale: גּוֹיִם यहाँ उन विदेशी जातियों अथवा राष्ट्रों को सूचित करता है जिनके बीच इस्राएली बिखेर दिए जाएँगे। “राष्ट्रों” मूल की व्यापकता बनाए रखता है।
- source_word: בְּהִזָּרוֹתֵיכֶם
  choice: जब तुम … तितर-बितर किए जाओगे
  rationale: זרה का अर्थ बिखेरना है। रूप लोगों के बिखरने की समयसूचक परिस्थिति देता है; कर्मवाच्य हिन्दी मूल खंड में कर्ता को अनावश्यक रूप से स्पष्ट किए बिना अर्थ व्यक्त करती है।
- source_word: בָּאֲרָצוֹת
  choice: अलग-अलग देशों में
  rationale: बहुवचन אֲרָצוֹת निर्वासन के अनेक भूभागों या देशों को दर्शाता है। “अलग-अलग देशों में” व्यापक बिखराव को साधारण आधुनिक हिन्दी में स्पष्ट करता है।
theological_decisions:
- issue: न्याय के वचन के बीच शेष बचे लोगों का संरक्षण
  choice: फिर भी मैं तुममें से कुछ को शेष रखूँगा
  alternative: फिर भी मैं कुछ लोगों को बचा छोड़ूँगा
  rationale: यह कथन पूर्ण विनाश के बीच कुछ लोगों के बचाए जाने की तनावपूर्ण स्थिति बनाए रखता है। “शेष रखूँगा” मूल क्रिया के अर्थ और शेष बचे समुदाय की धारणा को व्यक्त करता है, पर बाद की किसी विशिष्ट धर्मवैज्ञानिक व्याख्या को पद पर आरोपित नहीं करता।
- issue: तलवार से बचने वालों की स्थिति
  choice: तुममें से कुछ लोग तलवार से बच निकलेंगे
  alternative: तुम्हारे बीच तलवार से बचे हुए लोग होंगे
  rationale: मुख्य पाठ פְּלִיטֵי के पलायन अथवा बच निकलने के सक्रिय चित्र को रखता है। विकल्प उसके परिणाम—जीवित बचे होने—पर बल देता है; दोनों अर्थ मूल पदबंध में संभव हैं।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। दो छोटे वाक्यों में विभाजन ने जटिल इब्रानी infinitive संरचना को स्पष्ट किया है, जबकि न्याय, बिखराव और दया का क्रम सुरक्षित है।
