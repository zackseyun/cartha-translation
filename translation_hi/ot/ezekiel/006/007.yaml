lexical_decisions:
- source_word: וְנָפַל
  choice: गिरेंगे
  rationale: भविष्यसूचक कथन में संयोजक सहित पूर्ण क्रिया आने वाले परिणाम को व्यक्त करती है। हिन्दी में सामूहिक कर्ता के साथ भविष्यकाल का बहुवचन स्वाभाविक है।
- source_word: חָלָל
  choice: मारे गए लोग
  rationale: न्याय के प्रसंग में यह संज्ञा केवल घायलों के बजाय वध किए गए लोगों को दर्शाती है; एकवचन रूप यहाँ सामूहिक अर्थ रखता है।
- source_word: בְּתוֹכְכֶם
  choice: तुम्हारे बीच
  rationale: यह लोगों के मध्य स्थान को बताता है और आधुनिक हिन्दी में स्वाभाविक तथा स्पष्ट है।
- source_word: וִידַעְתֶּם
  choice: तुम जानोगे
  rationale: यह यहेजकेल में बार-बार आने वाले पहचान-सूत्र के भविष्यगत और परिणामात्मक भाव को बनाए रखता है।
- source_word: כִּי אֲנִי יְהוָה
  choice: कि मैं यहोवा हूँ
  rationale: इब्रानी वाक्य की सीधी पहचान-रचना और परमेश्वर के व्यक्तिगत नाम יהוה को सुरक्षित रखा गया है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मुख्य पाठ में हिन्दी बाइबल-पाठकों के लिए व्यापक रूप से पहचाना जाने वाला नामरूप रखा गया है; यह उपाधि ‘प्रभु’ से भिन्न होकर मूल व्यक्तिगत नाम को स्पष्ट करता है। ‘याहवे’ संभावित वैकल्पिक लिप्यंतरण है, पर मूल स्वरांकन निश्चित नहीं है।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। ‘मारे गए लोग गिरेंगे’ मूल के सामूहिक एकवचन और घटना-केंद्रित क्रिया को स्वाभाविक हिन्दी में व्यक्त करता है।
