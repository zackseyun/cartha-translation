source:
  edition: WLC
  text: וְ/אָ֣מַרְתָּ֔ הָרֵי֙ יִשְׂרָאֵ֔ל שִׁמְע֖וּ דְּבַר אֲדֹנָ֣/י יְהוִ֑ה כֹּה אָמַ֣ר אֲדֹנָ֣/י יְ֠הוִה לֶ/הָרִ֨ים וְ/לַ/גְּבָע֜וֹת לָ/אֲפִיקִ֣ים ו/ל/גאית הִנְ/נִ֨י אֲנִ֜י מֵבִ֤יא עֲלֵי/כֶם֙ חֶ֔רֶב וְ/אִבַּדְתִּ֖י בָּמֽוֹתֵי/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/006/003.yaml
  text: 'and say[a], ‘Mountains of Israel, hear the word of the Lord GOD. Thus says the Lord GOD to the mountains and to the hills, to the ravines and to the valleys: Behold, I myself am bringing a sword upon you[b], and I will destroy your high places.’'
translation:
  language: hi
  text: 'और कहना, “इस्राएल के पहाड़ो, प्रभु याहवे का वचन सुनो। प्रभु याहवे पहाड़ों और पहाड़ियों, नालों[a] और घाटियों से यों कहते हैं: देखो, मैं स्वयं तुम पर तलवार ला रहा हूँ, और तुम्हारे ऊँचे पूजा-स्थलों[b] को नष्ट कर दूँगा।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “जलमार्गों” अथवा “मौसमी नदी-मार्गों।”
    reason: lexical_alternative
  - marker: b
    text: मूल शब्द ऐसे पूजा-स्थलों के लिए है जो प्रायः ऊँचे स्थानों पर बने होते थे और अक्सर अनुचित या मूर्तिपूजक उपासना से जुड़े थे।
    reason: cultural_note
lexical_decisions:
- source_word: הָרֵי יִשְׂרָאֵל
  choice: इस्राएल के पहाड़ो
  rationale: भौतिक भूभाग को मानवीकृत श्रोताओं के रूप में संबोधित करने वाले बहुवचन संबोधन को स्वाभाविक हिन्दी में रखा गया है।
- source_word: שִׁמְעוּ
  choice: सुनो
  rationale: बहुवचन आज्ञार्थक रूप और नबी की औपचारिक पुकार दोनों को सुरक्षित रखता है।
- source_word: דְּבַר אֲדֹנָי יְהוִה
  choice: प्रभु यहवे का वचन
  rationale: דְּבַר के एकवचन अर्थ को ‘वचन’ से और इब्रानी संयुक्त उपाधि में व्यक्त व्यक्तिगत दिव्य नाम को ‘यहवे’ से दर्शाया गया है।
- source_word: כֹּה אָמַר אֲדֹנָי יְהוִה
  choice: प्रभु यहवे ... यह कहते हैं
  rationale: मानक नबूवत-सूत्र का अर्थ बनाए रखते हुए हिन्दी में स्वाभाविक वाक्य-विन्यास अपनाया गया है।
- source_word: לֶהָרִים וְלַגְּבָעוֹת
  choice: पहाड़ों और पहाड़ियों से
  rationale: दोनों निकटार्थी स्थलरूपों का भेद रखा गया है; हिन्दी में कथन के संबोधित पक्ष के लिए ‘से’ स्वाभाविक है।
- source_word: לָאֲפִיקִים
  choice: नालों
  rationale: यह शब्द जलधाराओं के मार्गों, नालों या वादियों को सूचित कर सकता है; स्थलाकृतिक सूची में ‘नालों’ संक्षिप्त और सुबोध है, जबकि विकल्प पादटिप्पणी में रखे गए हैं।
- source_word: וְלַגֵּאָיוֹת
  choice: घाटियों
  rationale: निम्न भूभाग के व्यापक अर्थ को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: הִנְנִי אֲנִי
  choice: देखो, मैं स्वयं
  rationale: הִנְנִי और स्वतंत्र सर्वनाम से उत्पन्न प्रथम-पुरुष बलाघात को अप्राकृतिक दोहराव के बिना सुरक्षित रखता है।
- source_word: מֵבִיא ... חֶרֶב
  choice: तुम पर तलवार ला रहा हूँ
  rationale: भागवाची रूप की आसन्न और सजीव क्रिया-शक्ति को वर्तमान प्रगतिशील रूप में रखा गया है।
- source_word: וְאִבַּדְתִּי
  choice: नष्ट कर दूँगा
  rationale: हिफ़ील रूप के कारणवाचक विनाश और भावी परिणाम को स्पष्ट, स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: בָּמוֹתֵיכֶם
  choice: तुम्हारे पूजा-स्थलों
  rationale: यहाँ ‘ऊँचे स्थान’ केवल भू-आकृति नहीं, धार्मिक उपासना-स्थल हैं; ‘पूजा-स्थल’ पाठक को अभिप्रेत सांस्कृतिक अर्थ देता है, और पादटिप्पणी उनके प्रायः ऊँचाई पर तथा मूर्तिपूजा से जुड़े होने को स्पष्ट करती है।
theological_decisions:
- issue: अֲדֹנָי יְהוִה में दिव्य नाम का अनुवाद
  choice: प्रभु यहवे
  alternative: प्रभु परमेश्वर
  rationale: मूल में व्यक्तिगत वाचा-नाम יְהוִה प्रत्यक्ष रूप से उपस्थित है। ‘यहवे’ उसे छिपाए बिना रखता है, जबकि אֲדֹנָי को ‘प्रभु’ से व्यक्त करता है।
- issue: בָּמוֹת का धार्मिक आशय
  choice: पूजा-स्थल
  alternative: ऊँचे स्थान
  rationale: संदर्भ में ये वेदीयुक्त धार्मिक स्थल हैं, केवल ऊँचे भूभाग नहीं। अनुवाद आशय स्पष्ट करता है, जबकि पादटिप्पणी ऊँचाई और अनुचित अथवा मूर्तिपूजक उपासना से उनका सामान्य संबंध बताती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सार्वजनिक पाठ के अनुकूल रखी गई है। मानवीकृत भूभाग का सीधा संबोधन और न्याय की गंभीर नबूवतीय शैली सुरक्षित है।
