source:
  edition: WLC
  text: וְ/נָטִ֤יתִי אֶת יָדִ/י֙ עֲלֵי/הֶ֔ם וְ/נָתַתִּ֨י אֶת הָ/אָ֜רֶץ שְׁמָמָ֤ה וּ/מְשַׁמָּה֙ מִ/מִּדְבַּ֣ר דִּבְלָ֔תָ/ה בְּ/כֹ֖ל מוֹשְׁבֽוֹתֵי/הֶ֑ם וְ/יָדְע֖וּ כִּֽי אֲנִ֥י יְהוָֽה־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/006/014.yaml
  text: So I will stretch out my hand against them and make the land a desolation and a waste[a], from the wilderness toward Diblath, throughout all their settlements[b]. Then they will know that I am Yahweh.
translation:
  language: hi
  text: इसलिए मैं उनके विरुद्ध अपना हाथ बढ़ाऊँगा और देश को, मरुभूमि से दिबलाथ की ओर, उनकी सभी बस्तियों में उजाड़ और सुनसान कर दूँगा[a][b]। तब वे जानेंगे कि मैं याहवे हूँ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी वाक्यांश का शाब्दिक भाव ‘मरुभूमि से दिबलाथ की ओर’ है। इस स्थान-नाम की पहचान अनिश्चित है; कुछ इसे ‘मरुभूमि से दिबलाथ तक’ समझते हैं, और कुछ पाठ-संबंधी प्रस्ताव इसे ‘रिबला’ से जोड़ते हैं।
    reason: textual_variant
  - marker: b
    text: या ‘उनके सभी निवास-स्थानों में।’
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָטִיתִי אֶת־יָדִי עֲלֵיהֶם
  choice: मैं उनके विरुद्ध अपना हाथ बढ़ाऊँगा
  rationale: न्याय के प्रसंग में यह इब्रानी मुहावरा दंड देने के लिए परमेश्वर की सक्रिय और प्रतिकूल कार्रवाई व्यक्त करता है। ‘हाथ बढ़ाऊँगा’ मूल रूपक को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: וְנָתַתִּי אֶת־הָאָרֶץ
  choice: देश को ... कर दूँगा
  rationale: यहाँ נָתַן के साथ विधेय-संज्ञाएँ परिणामकारी अर्थ देती हैं—देश को एक विशेष दशा में पहुँचा देना। ‘कर दूँगा’ इस अर्थ को सहज हिन्दी में व्यक्त करता है।
- source_word: שְׁמָמָה וּמְשַׁמָּה
  choice: उजाड़ और सुनसान
  rationale: दोनों निकटार्थक शब्द विनाश की तीव्रता बढ़ाते हैं। हिन्दी युग्म मूल की पुनरुक्ति को बनाए रखता है, पर उसे एक ही शब्द में समेटता नहीं।
- source_word: מִמִּדְבַּר דִּבְלָתָה
  choice: मरुभूमि से दिबलाह की दिशा तक
  rationale: मूल वाक्यांश भौगोलिक विस्तार का संकेत देता प्रतीत होता है, पर स्थान-नाम और उसकी सटीक पहचान अनिश्चित हैं। ‘की दिशा तक’ दिशासूचक प्रत्यय का भाव रखता है और अत्यधिक निश्चितता से बचता है।
- source_word: בְּכֹל מוֹשְׁבוֹתֵיהֶם
  choice: उनकी सभी बस्तियों में
  rationale: מוֹשָׁב निवास-स्थान अथवा बस्ती को दर्शाता है। ‘बस्तियों’ आधुनिक, स्पष्ट और देश पर आने वाले न्याय के प्रसंग के अनुकूल है।
- source_word: וְיָדְעוּ כִּי אֲנִי יְהוָה
  choice: तब वे जानेंगे कि मैं याहवे हूँ
  rationale: यहेजकेल में बार-बार आने वाला यह सूत्र न्याय के फलस्वरूप होने वाली पहचान व्यक्त करता है। ‘तब’ परिणाम का संबंध स्पष्ट करता है और ‘याहवे’ व्यक्तिगत दिव्य नाम को लिप्यंतरित करता है।
theological_decisions:
- issue: दिव्य नाम יהוה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल में उपाधि नहीं, परमेश्वर का व्यक्तिगत नाम है। ‘याहवे’ उसका प्रचलित विद्वत्तापूर्ण लिप्यंतरण है और पहचान-सूत्र की वाचिक शक्ति बनाए रखता है।
- issue: מִמִּדְבַּר דִּבְלָתָה का कठिन भौगोलिक अर्थ
  choice: मरुभूमि से दिबलाह की दिशा तक
  alternative: मरुभूमि से दिबलाह तक; रिबला तक; अत्यंत उजाड़
  rationale: व्यंजन-पाठ एक स्थान-नाम की ओर संकेत करता है, किंतु उसका स्वरूप और पहचान निश्चित नहीं। मुख्य पाठ संभावित भौगोलिक अर्थ रखता है और पादटिप्पणी वास्तविक पाठगत तथा भौगोलिक अनिश्चितता बताती है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, गंभीर किंतु सामान्य पाठक के लिए सुबोध रखी गई है। भविष्यसूचक न्याय का रूपक और विनाश व्यक्त करने वाला मूल का दोहरा पद सुरक्षित रखा गया है; कठिन भौगोलिक वाक्यांश की अनिश्चितता पादटिप्पणी में स्पष्ट की गई है।
