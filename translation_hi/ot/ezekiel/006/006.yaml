  text: בְּ/כֹל֙ מוֹשְׁב֣וֹתֵי/כֶ֔ם הֶ/עָרִ֣ים תֶּחֱרַ֔בְנָה וְ/הַ/בָּמ֖וֹת תִּישָׁ֑מְנָה לְמַעַן֩ יֶחֶרְב֨וּ וְ/יֶאְשְׁמ֜וּ מִזְבְּחֽוֹתֵי/כֶ֗ם וְ/נִשְׁבְּר֤וּ וְ/נִשְׁבְּתוּ֙ גִּלּ֣וּלֵי/כֶ֔ם וְ/נִגְדְּעוּ֙ חַמָּ֣נֵי/כֶ֔ם וְ/נִמְח֖וּ מַעֲשֵׂי/כֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/006/006.yaml
  text: In all your dwelling places[a], the cities will be laid waste and the high places will be desolated, so that your altars may be laid waste and desolated, and your idols broken and brought to an end, and your incense altars cut down[b], and your works wiped out.
translation:
  language: hi
  text: तुम्हारे सभी निवास-स्थानों में नगर उजड़ जाएँगे और ऊँचे उपासना-स्थान वीरान हो जाएँगे, ताकि तुम्हारी वेदियाँ उजड़ और वीरान हो जाएँ, तुम्हारी घृणित मूर्तियाँ[a] तोड़ दी जाएँ और समाप्त कर दी जाएँ, तुम्हारी धूप-वेदियाँ[b] काट गिराई जाएँ और तुम्हारे कार्य मिटा दिए जाएँ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘घृणित मूर्तियाँ’ के लिए प्रयुक्त हिब्रू शब्द तिरस्कारसूचक है; संभव है कि उसमें ‘मल जैसी’ या ‘गंदी’ मूर्तियों का भाव हो।
    reason: lexical_alternative
  - marker: b
    text: या, ‘तुम्हारे सूर्य-स्तंभ’ अथवा ‘तुम्हारी सूर्य-प्रतिमाएँ।’ हिब्रू शब्द एक ऐसी उपासना-वस्तु का नाम है जिसकी ठीक पहचान विवादित है और जो संभवतः सूर्य-उपासना से जुड़ी थी।
    reason: lexical_alternative
lexical_decisions:
- source_word: מוֹשְׁבֹתֵיכֶם
  choice: तुम्हारे बसने के सभी स्थानों में
  rationale: यह बहुवचन संज्ञा निवास अथवा बसावट के स्थानों को सूचित करती है। यह हिंदी प्रयोग व्यापक अर्थ को बनाए रखते हुए स्वाभाविक है।
- source_word: הֶעָרִים תֶּחֱרַבְנָה
  choice: नगर उजाड़ दिए जाएँगे
  rationale: חרב यहाँ विनाश और उजाड़ हो जाने का भाव देता है; कर्मवाच्य हिंदी न्याय की बाहरी क्रिया को स्पष्ट रखती है।
- source_word: הַבָּמוֹת
  choice: पूजा के ऊँचे स्थान
  rationale: במות उपासना के लिए प्रयुक्त ऊँचे धार्मिक स्थलों का पारिभाषिक नाम है। केवल ‘ऊँचे स्थान’ की अपेक्षा यह रूप सामान्य पाठक के लिए आशय स्पष्ट करता है।
- source_word: תִּישָׁמְנָה
  choice: निर्जन कर दिए जाएँगे
  rationale: यह क्रिया उजाड़ अथवा सुनसान कर दिए जाने का भाव देती है और पहले खंड के विनाश-वर्णन से समानांतर रहती है।
- source_word: לְמַעַן
  choice: ताकि
  rationale: यह उद्देश्य अथवा फल का संबंध व्यक्त करता है; ‘ताकि’ दोनों संभावनाओं को स्वाभाविक हिंदी में खुला रखता है।
- source_word: יֶחֶרְבוּ וְיֶאְשְׁמוּ מִזְבְּחוֹתֵיכֶם
  choice: तुम्हारी वेदियाँ उजाड़ और निर्जन हो जाएँ
  rationale: दोनों हिब्रू क्रियाओं को रखा गया है, जिससे वेदियों के विनाश और वीरानी का तीव्र समानांतर भाव बना रहता है।
- source_word: גִּלּוּלֵיכֶם
  choice: तुम्हारी घृणित मूर्तियाँ
  rationale: גִּלּוּלִים मूर्तियों के लिए जानबूझकर प्रयुक्त तिरस्कारपूर्ण शब्द है। ‘घृणित’ उसकी निंदा का बल रखता है, जबकि अधिक शाब्दिक और अनिश्चित व्युत्पत्तिगत बिंब पादटिप्पणी में दिया गया है।
- source_word: וְנִשְׁבְּרוּ וְנִשְׁבְּתוּ
  choice: तोड़ दी जाएँ और उनका अंत कर दिया जाए
  rationale: पहली क्रिया टूटने और दूसरी बंद अथवा समाप्त कर दिए जाने को व्यक्त करती है; अनुवाद दोनों अलग अर्थों को बनाए रखता है।
- source_word: חַמָּנֵיכֶם
  choice: तुम्हारी धूप-वेदियाँ
  rationale: यह विवादित उपासना-वस्तु के लिए प्रयुक्त शब्द है, जिसे धूप-वेदियों अथवा सूर्य-उपासना से जुड़ी वस्तुओं के रूप में समझा गया है। प्रसंगानुकूल मुख्य पाठ के साथ वैकल्पिक अर्थ पादटिप्पणी में रखा गया है।
- source_word: וְנִמְחוּ מַעֲשֵׂיכֶם
  choice: तुम्हारे कार्य मिटा दिए जाएँ
  rationale: מחה मिटा देने या नामोनिशान समाप्त करने का बल रखता है। מַעֲשִׂים का ‘कार्य’ अनुवाद कर्मों और बनाई हुई उपासना-वस्तुओं के बीच मूल की संभावित व्यापकता बनाए रखता है।
theological_decisions:
- issue: मूर्तिपूजक स्थलों और वस्तुओं की निंदा का बल
  choice: ऊँचे उपासना-स्थलों, वेदियों और मूर्तियों को ठोस रूप में नामित किया गया तथा גִּלּוּלִים का तिरस्कारपूर्ण बल ‘घृणित मूर्तियाँ’ से रखा गया।
  alternative: सामान्य रूप से ‘झूठी उपासना’ कहना या केवल तटस्थ ‘मूर्तियाँ’ लिखना।
  rationale: पद इस्राएल की विशिष्ट मूर्तिपूजक व्यवस्था पर न्याय सुनाता है; इसे सामान्य धार्मिक भाषा में बदलना या इसकी कठोरता घटाना मूल के बल को कमजोर करेगा।
- issue: חַמָּנִים नामक उपासना-वस्तु की अनिश्चित पहचान
  choice: मुख्य पाठ में ‘धूप-वेदियाँ’ और पादटिप्पणी में ‘सूर्य-स्तंभ/सूर्य-प्रतिमाएँ’ रखा गया।
  alternative: मुख्य पाठ में निश्चित रूप से ‘सूर्य-स्तंभ’ लिखना।
  rationale: वस्तु का सटीक स्वरूप विवादित है। मुख्य पाठ प्रसंगानुकूल अर्थ देता है, पर पादटिप्पणी वास्तविक शाब्दिक-अर्थगत अनिश्चितता को सुरक्षित रखती है।
translation_notes:
  register: आधुनिक मानक हिंदी का सहज किंतु गरिमापूर्ण न्याय-वाणी वाला रूप अपनाया गया है। लगातार कर्मवाच्य क्रियाएँ हिब्रू के विनाश-सूचक क्रम और काव्यात्मक समानांतरता को बनाए रखती हैं। ‘पूजा के ऊँचे स्थान’ सामान्य पाठक को पारिभाषिक धार्मिक अर्थ समझाता है; पादटिप्पणियाँ केवल वास्तविक शब्दार्थगत अनिश्चितताओं को स्पष्ट करती हैं।
