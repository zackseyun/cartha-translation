language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/נָתַתִּ֗י אֶת פִּגְרֵי֙ בְּנֵ֣י יִשְׂרָאֵ֔ל לִ/פְנֵ֖י גִּלּֽוּלֵי/הֶ֑ם וְ/זֵרִיתִי֙ אֶת עַצְמ֣וֹתֵי/כֶ֔ם סְבִיב֖וֹת מִזְבְּחוֹתֵי/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/006/005.yaml
  text: And I will place the corpses of the sons of Israel before their idols[a], and I will scatter your bones around your altars.
translation:
  language: hi
  text: और मैं इस्राएल के पुत्रों के शव उनकी मूर्तियों[a] के सामने रख दूँगा, और तुम्हारी हड्डियाँ तुम्हारी वेदियों के चारों ओर बिखेर दूँगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी शब्द גִּלּוּלִים मूर्तियों के लिए यहेजकेल का घृणासूचक शब्द है; इसमें ‘घिनौनी मूर्तियाँ’ या यहाँ तक कि ‘गोबर-जैसी मूर्तियाँ’ जैसा तिरस्कारपूर्ण भाव हो सकता है।
    reason: शब्द के घृणासूचक अर्थ और संभावित चित्रात्मक अर्थ को पारदर्शी बनाना।
lexical_decisions:
- source_word: וְנָתַתִּי
  choice: और मैं ... रख दूँगा
  rationale: נתן का अर्थ यहाँ किसी वस्तु को एक स्थान पर रखना है। ‘रख दूँगा’ शवों को मूर्तियों के सामने रखने की ठोस और निर्णायक क्रिया को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: פִּגְרֵי
  choice: शव
  rationale: פגר मनुष्य या पशु के मृत शरीर को दर्शाता है। यहाँ मनुष्यों के संदर्भ में ‘शव’ सटीक, गरिमापूर्ण और पर्याप्त रूप से कठोर है।
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: इस्राएल के पुत्रों
  rationale: यह इब्रानी का परंपरागत सामुदायिक और वाचा-संबंधी पद है। ‘इस्राएल के पुत्र’ मूल अभिव्यक्ति की बनावट को बनाए रखता है; संदर्भ में यह केवल पुरुषों तक सीमित पद नहीं, बल्कि इस्राएल समुदाय का नाम है।
- source_word: לִפְנֵי
  choice: के सामने
  rationale: לִפְנֵי का स्थानवाचक अर्थ ‘के सामने’ है। इससे मूर्तियों के आगे शव रखे जाने का व्यंग्यपूर्ण न्याय-दृश्य स्पष्ट रहता है।
- source_word: גִּלּוּלֵיהֶם
  choice: उनकी मूर्तियों
  rationale: גִּלּוּלִים यहेजकेल का मूर्तियों के लिए घृणासूचक शब्द है। मुख्य पाठ में ‘मूर्तियाँ’ आशय को साफ और स्वाभाविक रखता है, जबकि उसका तिरस्कारपूर्ण भाव पादटिप्पणी में बताया गया है।
- source_word: וְזֵרִיתִי
  choice: और ... बिखेर दूँगा
  rationale: זרה का अर्थ बिखेरना या फटकना हो सकता है। हड्डियों के संदर्भ में ‘बिखेर दूँगा’ सबसे स्वाभाविक और दृश्यात्मक अनुवाद है।
- source_word: עַצְמוֹתֵיכֶם
  choice: तुम्हारी हड्डियाँ
  rationale: प्रत्यक्ष अर्थ ‘तुम्हारी हड्डियाँ’ है। द्वितीय पुरुष बहुवचन को बनाए रखने से भविष्यवक्ता के श्रोताओं को दिया गया सीधा न्याय-संदेश सुरक्षित रहता है।
- source_word: סְבִיבוֹת
  choice: चारों ओर
  rationale: यह शब्द घेरे हुए आसपास के क्षेत्र को दर्शाता है। ‘चारों ओर’ हड्डियों के वेदियों के आसपास बिखरने का पूर्ण स्थानिक भाव देता है।
- source_word: מִזְבְּחוֹתֵיכֶם
  choice: तुम्हारी वेदियों
  rationale: מִזְבֵּחַ का अर्थ ‘वेदी’ है और बहुवचन प्रत्यय ‘तुम्हारी’ है। इससे स्पष्ट होता है कि ये उन्हीं संबोधित लोगों की उपासना से जुड़ी वेदियाँ हैं।
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל की सामुदायिक वाचा-संबंधी अभिव्यक्ति
  choice: इस्राएल के पुत्र
  alternative: इस्राएली / इस्राएल के लोग
  rationale: मूल पद की इब्रानी बनावट और वाचा-संबंधी ध्वनि को बनाए रखने के लिए ‘इस्राएल के पुत्र’ चुना गया है। यहाँ यह समूचे समुदाय का परंपरागत नाम है, केवल पुरुषों का संकेत नहीं।
- issue: यहेजकेल के घृणासूचक शब्द גִּלּוּלִים का अनुवाद
  choice: मूर्तियाँ
  alternative: घिनौनी मूर्तियाँ / गोबर-जैसी मूर्तियाँ
  rationale: शब्द में तिरस्कार का भाव वास्तविक है, पर उसके सटीक व्युत्पत्तिगत चित्र पर कुछ अनिश्चितता है। इसलिए मुख्य पाठ में स्पष्ट ‘मूर्तियाँ’ रखा गया और तिरस्कारपूर्ण अर्थ पादटिप्पणी में सुरक्षित किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में गंभीर, भविष्यवाणी-संबंधी और गरिमापूर्ण शैली रखी गई है। ‘शव’, ‘हड्डियाँ’ और ‘बिखेर दूँगा’ न्याय-दृश्य की कठोरता को कम नहीं करते; ‘मूर्तियाँ’ सामान्य पाठक के लिए स्पष्ट है और उसके विशेष इब्रानी तिरस्कार-भाव को पादटिप्पणी में समझाया गया है।
