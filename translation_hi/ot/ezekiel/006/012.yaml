  text: הָ/רָח֞וֹק בַּ/דֶּ֣בֶר יָמ֗וּת וְ/הַ/קָּרוֹב֙ בַּ/חֶ֣רֶב יִפּ֔וֹל וְ/הַ/נִּשְׁאָר֙ וְ/הַ/נָּצ֔וּר בָּ/רָעָ֖ב יָמ֑וּת וְ/כִלֵּיתִ֥י חֲמָתִ֖/י בָּֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/006/012.yaml
  text: The one far away will die by pestilence[a], and the one nearby will fall by the sword, and the one left and besieged will die by famine[b]; and I will spend my wrath on them.
translation:
  language: hi
  text: जो दूर है, वह महामारी से मरेगा; जो पास है, वह तलवार से गिरेगा; और जो बचा रह गया और घेराबंदी में है[a], वह अकाल से मरेगा; और मैं उन पर अपना प्रकोप पूरी तरह उतारूँगा[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जो बचा रह गया और बंद कर दिया गया है”; इब्रानी शब्द का अर्थ “सुरक्षित बचा हुआ” भी समझा गया है, पर यहाँ अकाल का उल्लेख घेराबंदी में फँसे होने के अर्थ का समर्थन करता है।
    reason: lexical_alternative
  - marker: b
    text: 'शाब्दिक भाव: “मैं उन पर अपने प्रकोप को पूरा कर दूँगा”; इब्रानी क्रिया न्याय में प्रकोप को उसके पूरे अंत तक पहुँचाने का भाव देती है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָרָחוֹק
  choice: जो दूर है
  rationale: निश्चित विशेषण का संज्ञात्मक प्रयोग है; यह पास वाले व्यक्ति के साथ स्थानगत विरोध और एकवचन-वितरणात्मक शैली को स्वाभाविक हिन्दी में रखता है।
- source_word: בַּדֶּבֶר
  choice: महामारी से
  rationale: דֶּבֶר घातक महामारी को दर्शाता है; करणसूचक בְּ को ‘से’ द्वारा व्यक्त किया गया है।
- source_word: הַקָּרוֹב
  choice: जो पास है
  rationale: הָרָחוֹק के समानांतर संज्ञात्मक विशेषण है और स्थानगत निकटता दर्शाता है।
- source_word: בַּחֶרֶב יִפּוֹל
  choice: तलवार से गिरेगा
  rationale: युद्ध में हिंसक मृत्यु का ठोस इब्रानी बिंब बनाए रखता है; ‘गिरेगा’ נפל का सीधा और स्वाभाविक रूप है।
- source_word: הַנִּשְׁאָר
  choice: जो बचा रह गया
  rationale: שׁאר का निष्क्रिय कृदंत है, अर्थात जो बाकी रह गया; तकनीकी ‘शेष’ की अपेक्षा यह वितरित एकवचन को स्पष्ट करता है।
- source_word: הַנָּצוּר
  choice: घेराबंदी में है
  rationale: צור से बना रूप यहाँ घिरा या घेरे में बंद होने का अर्थ देता है, जो आगे अकाल से मरने के संदर्भ में उपयुक्त है; अन्य संभावित समझ को पादटिप्पणी में रखा गया है।
- source_word: בָּרָעָב
  choice: अकाल से
  rationale: दूसरे दंडों के समान करणसूचक प्रयोग है; ‘अकाल’ घेराबंदी से जुड़ी भोजन की व्यापक कमी को व्यक्त करता है।
- source_word: וְכִלֵּיתִי חֲמָתִי בָּם
  choice: इस प्रकार मैं उन पर अपना प्रकोप पूरी तरह उतारूँगा
  rationale: Piel כלה क्रोध को अंत तक कार्यान्वित करने या पूरा कर देने का भाव देता है। ‘पूरी तरह उतारूँगा’ उस पूर्ण निष्पादन को स्वाभाविक और गंभीर हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: ईश्वरीय न्याय और प्रकोप की तीव्रता
  choice: मैं उन पर अपना प्रकोप पूरी तरह उतारूँगा
  alternative: मैं उन पर अपने प्रकोप को समाप्त करूँगा
  rationale: पाठ दंड को नरम नहीं करता, बल्कि प्रकोप के पूर्ण रूप से कार्यान्वित होने की बात कहता है। चुना हुआ रूप इसी तीव्रता को बचाता है, बिना कोई अतिरिक्त धर्मवैज्ञानिक निष्कर्ष जोड़े।
- issue: הַנָּצוּר की संदर्भगत व्याख्या
  choice: घेराबंदी में है
  alternative: सुरक्षित बचा हुआ है
  rationale: अकाल के साथ इसका तत्काल संबंध घेराबंदी में बंद व्यक्ति के अर्थ का समर्थन करता है; फिर भी रूप की वैकल्पिक व्याख्या को पादटिप्पणी में स्वीकार किया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमामय भविष्यद्वाणी-शैली रखी गई है। समानांतर ‘जो…वह…’ संरचना मूल के तीन वर्गों को स्पष्ट करती है। ‘महामारी’, ‘तलवार’, ‘अकाल’ और ‘प्रकोप’ न्याय-सूची की ठोस तथा गंभीर भाषा बनाए रखते हैं।
