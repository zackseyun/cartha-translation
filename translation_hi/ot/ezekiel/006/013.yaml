  text: וִֽ/ידַעְתֶּם֙ כִּֽי אֲנִ֣י יְהוָ֔ה בִּֽ/הְי֣וֹת חַלְלֵי/הֶ֗ם בְּ/תוֹךְ֙ גִּלּ֣וּלֵי/הֶ֔ם סְבִיב֖וֹת מִזְבְּחֽוֹתֵי/הֶ֑ם אֶל֩ כָּל גִּבְעָ֨ה רָמָ֜ה בְּ/כֹ֣ל רָאשֵׁ֣י הֶ/הָרִ֗ים וְ/תַ֨חַת כָּל עֵ֤ץ רַֽעֲנָן֙ וְ/תַ֨חַת֙ כָּל אֵלָ֣ה עֲבֻתָּ֔ה מְק֗וֹם אֲשֶׁ֤ר נָֽתְנוּ שָׁם֙ רֵ֣יחַ נִיחֹ֔חַ לְ/כֹ֖ל גִּלּוּלֵי/הֶֽם־־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/006/013.yaml
  text: Then you will know that I am Yahweh[a], when their slain lie among their idols, all around their altars, on every high hill, on all the mountaintops, and under every green tree and under every leafy terebinth—the places where they offered a pleasing aroma to all their idols.
translation:
  language: hi
  text: तब तुम जानोगे कि मैं यहोवा हूँ, जब उनके मारे हुए लोग उनकी घिनौनी मूर्तियों[a] के बीच, उनकी वेदियों के चारों ओर, हर ऊँची पहाड़ी पर, पहाड़ों की हर चोटी पर, हर हरे-भरे पेड़ के नीचे और हर घने पत्तों वाले तारपीन-वृक्ष के नीचे पड़े होंगे—उन सभी स्थानों पर, जहाँ उन्होंने अपनी सारी घिनौनी मूर्तियों के लिए सुखदायक सुगंध चढ़ाई थी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी शब्द גִּלּוּלִים मूर्तियों के लिए अत्यंत तिरस्कारपूर्ण शब्द है; इसका अधिक शब्दशः भाव ‘गोबर-मूर्तियाँ’ या ‘गंदी मूर्तियाँ’ हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וִידַעְתֶּם
  choice: तब तुम जानोगे
  rationale: संयोजक वाव सहित पूर्ण क्रिया यहाँ भविष्यसूचक परिणाम व्यक्त करती है; ‘तब’ प्रसंग के परिणामात्मक भाव को स्वाभाविक हिंदी में दिखाता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: इब्रानी चतुरक्षरीय परमेश्वर-नाम को उपाधि से बदलने के बजाय प्रचलित हिंदी बाइबलीय रूप में रखा गया है।
- source_word: בִּהְיוֹת חַלְלֵיהֶם
  choice: जब उनके मारे हुए लोग ... पड़े होंगे
  rationale: בִּהְיוֹת परिस्थितिक/कालवाचक अर्थ देता है और חַלְלֵיהֶם हिंसक मृत्यु से मारे गए लोगों को दर्शाता है; हिंदी वाक्य में ‘पड़े होंगे’ निहित दृश्य को स्पष्ट और स्वाभाविक बनाता है।
- source_word: גִּלּוּלֵיהֶם
  choice: उनकी घिनौनी मूर्तियाँ
  rationale: यह मूर्तियों के लिए अत्यंत तिरस्कारपूर्ण शब्द है। ‘घिनौनी मूर्तियाँ’ उसका नकारात्मक बल साधारण ‘मूर्तियाँ’ की अपेक्षा बेहतर सुरक्षित रखता है, जबकि अधिक शब्दशः ‘गोबर-मूर्तियाँ’ मुख्य पाठ में अस्वाभाविक लगेगा।
- source_word: סְבִיבוֹת מִזְבְּחוֹתֵיהֶם
  choice: उनकी वेदियों के चारों ओर
  rationale: स्थानगत घेराव को स्पष्ट, स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: אֶל כָּל גִּבְעָה רָמָה
  choice: हर ऊँची पहाड़ी पर
  rationale: स्थान-सूची में אֶל का प्रयोग यहाँ गंतव्य के बजाय स्थानगत है; ‘पर’ हिंदी में उपयुक्त है।
- source_word: בְּכֹל רָאשֵׁי הֶהָרִים
  choice: पहाड़ों की हर चोटी पर
  rationale: ‘पहाड़ों के सिरों’ की इब्रानी अभिव्यक्ति शिखरों को सूचित करती है; यह हिंदी रूप अर्थ और वितरणात्मक बल दोनों रखता है।
- source_word: תַחַת כָּל עֵץ רַעֲנָן
  choice: हर हरे-भरे पेड़ के नीचे
  rationale: रसीली हरियाली और पत्तियों से भरपूर होने का भाव ‘हरे-भरे’ से सहज रूप में आता है।
- source_word: תַחַת כָּל אֵלָה עֲבֻתָּה
  choice: हर घनी पत्तियों वाले बांज वृक्ष के नीचे
  rationale: אֵלָה संभवतः टेरिबिन्थ कुल का वृक्ष है, जिसे हिंदी में ‘बांज’ कहना अधिक बोधगम्य है; עֲבֻתָּה की सघनता ‘घनी पत्तियों वाले’ से व्यक्त होती है।
- source_word: רֵיחַ נִיחֹחַ
  choice: सुखदायक सुगंध
  rationale: स्थिर बलिदानी पदबंध उस सुगंध को दर्शाता है जिसे प्रसन्नकारी माना गया; यहाँ व्यंग्यात्मक तनाव बना रहता है क्योंकि यह मूर्तियों को अर्पित की गई थी।
theological_decisions:
- issue: परमेश्वर के नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: मूल पाठ में व्यक्तिगत वाचा-नाम सीधे आया है। उसे ‘प्रभु’ उपाधि से नहीं बदला गया; ‘यहोवा’ आधुनिक हिंदी बाइबल-पाठकों में व्यापक रूप से पहचाना जाने वाला रूप है।
- issue: גִּלּוּלִים का तिरस्कारपूर्ण आशय
  choice: मुख्य पाठ में ‘घिनौनी मूर्तियाँ’, साथ में पाद-टिप्पणी
  alternative: मूर्तियाँ; गोबर-मूर्तियाँ; गंदी मूर्तियाँ
  rationale: मूल की कठोर तिरस्कारपूर्ण भाषा को केवल ‘मूर्तियाँ’ कहकर कमजोर नहीं किया गया, पर अत्यधिक शब्दशः रूप को मुख्य पाठ पर थोपने के बजाय टिप्पणी में बताया गया है।
- issue: רֵיחַ נִיחֹחַ में धार्मिक विडंबना
  choice: ‘सुखदायक सुगंध’ को बिना व्याख्यात्मक विस्तार के रखा गया
  alternative: सुगंधित धूप; देवताओं को प्रसन्न करने वाली सुगंध
  rationale: यह वही बलिदानी भाषा है जो अन्यत्र यहोवा को चढ़ावे के लिए आती है, किंतु यहाँ मूर्तियों के लिए प्रयुक्त है। अनुवाद इस तनाव को समझाकर समाप्त करने के बजाय सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक, गंभीर और सार्वजनिक पाठ के योग्य रखी गई है। स्थानों की क्रमिक सूची और न्याय के भयावह दृश्य को सुरक्षित रखते हुए हिंदी वाक्य-विन्यास को सहज बनाया गया है।
