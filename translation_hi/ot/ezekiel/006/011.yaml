source:
  edition: WLC
  text: כֹּֽה אָמַ֞ר אֲדֹנָ֣/י יְהוִ֗ה הַכֵּ֨ה בְ/כַפְּ/ךָ֜ וּ/רְקַ֤ע בְּ/רַגְלְ/ךָ֙ וֶֽ/אֱמָר אָ֔ח אֶ֛ל כָּל תּוֹעֲב֥וֹת רָע֖וֹת בֵּ֣ית יִשְׂרָאֵ֑ל אֲשֶׁ֗ר בַּ/חֶ֛רֶב בָּ/רָעָ֥ב וּ/בַ/דֶּ֖בֶר יִפֹּֽלוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/006/011.yaml
  text: 'Thus says the Lord GOD: Strike your hand and stamp your foot[a], and say, “Alas!” because of all the evil abominations of the house of Israel, who will fall by the sword, by famine[c][b], and by pestilence.'
translation:
  language: hi
  text: 'प्रभु याहवे यों कहते हैं: “अपनी हथेली पर प्रहार करो[a], अपना पैर पटको और कहो, ‘हाय! इस्राएल के घराने के सारे बुरे घिनौने कामों के कारण!’[c] वे तलवार, अकाल और महामारी से गिर पड़ेंगे।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “ताली बजाओ।” इब्रानी में हथेली पर प्रहार करने की जोरदार भाव-भंगिमा है; उसका सटीक रूप स्पष्ट नहीं है।
    reason: lexical_alternative
  - marker: c
    text: या “इस्राएल के घराने के सारे बुरे घिनौने कामों के विषय में।”
    reason: alternative_reading
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  choice: प्रभु याहवे
  rationale: אֲדֹנָי को ‘प्रभु’ और परमेश्वर के व्यक्तिगत नाम יהוה को ‘याहवे’ के रूप में रखा गया है, जिससे संयुक्त उपाधि और वाचा का नाम दोनों स्पष्ट रहें।
- source_word: הַכֵּה בְכַפְּךָ
  choice: अपनी हथेली पर मारो
  rationale: यह अनुवाद मूल के प्रहार-सूचक आदेश और כַּף के ‘हथेली’ अर्थ को बनाए रखता है। संकेत का सटीक रूप कुछ अस्पष्ट है, इसलिए ‘ताली बजाओ’ को पादटिप्पणी में रखा गया है।
- source_word: וּרְקַע בְרַגְלְךָ
  choice: अपना पैर पटको
  rationale: רקע यहाँ जोरदार भाव-भंगिमा के रूप में पैर पटकने को दर्शाता है; यह आधुनिक हिन्दी में स्वाभाविक और सजीव है।
- source_word: וֶאֱמָר אָח
  choice: कहो, ‘हाय!’
  rationale: इस प्रसंग में אָח आने वाले न्याय पर शोक या संताप की पुकार है; ‘हाय!’ हिन्दी में यही भाव व्यक्त करता है।
- source_word: אֶל כָּל תּוֹעֲבוֹת רָעוֹת
  choice: सारे बुरे घिनौने कामों के कारण
  rationale: विस्मयादिबोधक पुकार के बाद אֶל शोक के विषय या कारण को बता सकता है। ‘के कारण’ प्रसंग में स्वाभाविक है, जबकि ‘के विषय में’ की वास्तविक संभावना पादटिप्पणी में सुरक्षित है। תּוֹעֵבָה की तीव्र नैतिक और उपासना-संबंधी निंदा को ‘घिनौने काम’ व्यक्त करता है।
- source_word: בֵּית יִשְׂרָאֵל
  choice: इस्राएल का घराना
  rationale: यह वाचाई सामूहिक अभिव्यक्ति को केवल ‘इस्राएल’ कहकर सपाट किए बिना स्वाभाविक हिन्दी में रखता है।
- source_word: אֲשֶׁר ... יִפֹּלוּ
  choice: वे ... मारे जाएँगे
  rationale: ‘गिरेंगे’ युद्ध और विपत्ति से मृत्यु का मुहावरा है। हिन्दी में ‘मारे जाएँगे’ अभिप्रेत परिणाम को स्वाभाविक ढंग से स्पष्ट करता है और सामूहिक ‘घराने’ को ‘वे’ से ग्रहण करता है।
- source_word: בַּחֶרֶב בָּרָעָב וּבַדֶּבֶר
  choice: तलवार, अकाल और महामारी से
  rationale: यह भविष्यद्वक्ताओं में मिलने वाली न्याय की मानक त्रयी है। ‘महामारी’ דֶּבֶר के संक्रामक विनाश के अर्थ को वर्तमान हिन्दी में स्पष्ट रखती है।
theological_decisions:
- issue: אֲדֹנָי יְהוִה में परमेश्वर के नाम का अनुवाद
  choice: प्रभु याहवे
  alternative: प्रभु परमेश्वर / प्रभु यहोवा
  rationale: मूल पाठ में יהוה व्यक्तिगत वाचा-नाम है। ‘याहवे’ उसका सीधा लिप्यंतरण है और उसे सामान्य उपाधि ‘परमेश्वर’ में विलीन नहीं करता।
- issue: भविष्यद्वक्ता की भाव-भंगिमा का स्वर
  choice: आने वाले न्याय पर शोक और गंभीर निंदा
  alternative: विजय या उपहास की पुकार
  rationale: אָח, घिनौने कामों का उल्लेख, और तलवार-अकाल-महामारी का परिणाम मिलकर शोकपूर्ण न्याय-घोषणा का संकेत देते हैं; फिर भी हाथ की क्रिया की सटीक प्रकृति को पादटिप्पणी में खुला रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और मौखिक पाठ के लिए सहज रखी गई है। भविष्यद्वाणी की शारीरिक भाव-भंगिमा को सजीव रखा गया है, कठिन धार्मिक शब्दावली के स्थान पर ‘घिनौने काम’ और ‘महामारी’ जैसे सामान्य किन्तु गंभीर शब्द चुने गए हैं।
