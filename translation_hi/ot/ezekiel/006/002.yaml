base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/006/002.yaml
  text: Son of man[a], set your face toward the mountains of Israel, and prophesy to them.
translation:
  language: hi
  text: “हे मनुष्य के पुत्र, अपना मुख इस्राएल के पहाड़ों की ओर कर और उनके विरुद्ध भविष्यद्वाणी कर[a]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उनसे भविष्यद्वाणी कर।” इब्रानी पूर्वसर्ग अधिक तटस्थ रूप से दिशा या संबोधन बता सकता है; इस न्याय-संदर्भ में उसका भाव “उनके विरुद्ध” है।
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן אָדָם
  choice: हे मनुष्य के पुत्र
  rationale: यहेजकेल के लिए प्रयुक्त इस स्थायी संबोधन का शाब्दिक रूप और भविष्यसूचक प्रभाव बनाए रखा गया है।
- source_word: שִׂים פָּנֶיךָ
  choice: अपना मुख ... की ओर कर
  rationale: ‘मुख करना’ दिशा और आमने-सामने होने की मूल इब्रानी छवि को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: אֶל הָרֵי יִשְׂרָאֵל
  choice: इस्राएल के पहाड़ों की ओर
  rationale: ठोस भौगोलिक अभिव्यक्ति ‘इस्राएल के पहाड़’ को रूपक या ‘पहाड़ी प्रदेश’ में बदले बिना रखा गया है; पहले אֶל का दिशासूचक अर्थ ‘की ओर’ है।
- source_word: וְהִנָּבֵא
  choice: और ... भविष्यद्वाणी कर
  rationale: नबा धातु के निफ़अल आज्ञार्थक का मानक, स्पष्ट और गरिमापूर्ण हिन्दी रूप।
- source_word: אֲלֵיהֶם
  choice: उनके विरुद्ध
  rationale: पूर्वसर्ग मूलतः ‘उनकी ओर/उनसे’ का भाव दे सकता है, पर आगामी न्याय-संदेश के संदर्भ में भविष्यद्वाणी पहाड़ों के विरुद्ध निर्देशित है। इस संदर्भगत बल को मुख्य पाठ में रखा गया और अधिक तटस्थ विकल्प पादटिप्पणी में दिया गया है।
theological_decisions:
- issue: בֶּן אָדָם में אָדָם का अनुवाद
  choice: मनुष्य के पुत्र
  alternative: हे नश्वर मनुष्य
  rationale: यह यहेजकेल के लिए परमेश्वर का विशिष्ट और बार-बार आने वाला संबोधन है। पारंपरिक शाब्दिक मुहावरा मूल पाठ की पुरुषवाची अभिव्यक्ति और भविष्यसूचक गंभीरता दोनों बनाए रखता है।
- issue: אֲלֵיהֶם का तटस्थ अथवा विरोधसूचक अर्थ
  choice: उनके विरुद्ध
  alternative: उनसे
  rationale: इब्रानी पूर्वसर्ग में वास्तविक अस्पष्टता है। अध्याय के न्याय-संदर्भ में विरोधसूचक अर्थ प्रबल है, फिर भी तटस्थ दिशासूचक अर्थ को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण भविष्यसूचक शैली रखी गई है। ‘मुख ... की ओर कर’ मूल छवि को सुरक्षित रखता है, और ‘हे’ संबोधन को स्वाभाविक बनाता है।
