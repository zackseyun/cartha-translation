lexical_decisions:
- source_word: קְפָדָה
  choice: संकट
  rationale: यह दुर्लभ संज्ञा न्याय के साथ आने वाली भीषण दशा या उससे उपजे भय को सूचित कर सकती है। ‘संकट’ आधुनिक हिन्दी में स्वाभाविक है और अर्थ को केवल मनोव्यथा या केवल विनाश तक सीमित नहीं करता।
- source_word: בָא
  choice: आ पहुँचा है
  rationale: भविष्यद्वाणी के प्रसंग में पूर्ण क्रिया न्याय को निश्चित और मानो उपस्थित घटना के रूप में घोषित करती है; ‘आ पहुँचा है’ उसके आगमन और तात्कालिकता दोनों को व्यक्त करता है।
- source_word: וּבִקְשׁוּ
  choice: वे ... खोजेंगे
  rationale: घोषित संकट के बाद लोगों की प्रतिक्रिया बताने वाले इस क्रियारूप को हिन्दी में भविष्यकाल से सहज और स्पष्ट रूप से व्यक्त किया गया है।
- source_word: שָׁלוֹם
  choice: शान्ति
  rationale: यहाँ शब्द सुरक्षा, कुशलता और सामान्य स्थिति की बहाली के व्यापक अर्थ को समेटता है; ‘शान्ति’ उसका मानक और प्रसंगानुकूल हिन्दी रूप है।
- source_word: וָאָיִן
  choice: पर वह मिलेगी नहीं
  rationale: मूल में मांगी गई शान्ति के अभाव का कथन है। हिन्दी में यह मुहावरेदार रूप खोजने और न मिलने के विरोध को स्पष्ट करता है, बिना मूल आशय को बदलने के।
