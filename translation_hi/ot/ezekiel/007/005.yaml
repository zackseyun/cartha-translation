  yaml_path: translation/ot/ezekiel/007/005.yaml
  text: 'Thus says the Lord GOD: A disaster[a], a unique disaster—behold, it is coming.'
translation:
  language: hi
  text: 'प्रभु याहवे यों कहते हैं: विपत्ति[a], एक अनोखी विपत्ति—देखो, वह आ रही है!'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “विपत्ति, एक विपत्ति।” इब्रानी में ‘विपत्ति’ शब्द दोहराया गया है; ‘एक’ किसी एक विपत्ति, उसकी विशिष्टता, या उसके विशेष बल पर जोर दे सकता है।
    reason: मूल इब्रानी רָעָה אַחַת רָעָה की असामान्य पुनरावृत्ति तथा אַחַת के अर्थ-बल को सुरक्षित रखना।
lexical_decisions:
- source_word: כֹּה אָמַר
  choice: यों कहते हैं
  rationale: यह भविष्यद्वक्ताओं के संदेश का पारंपरिक आरंभिक सूत्र है; हिन्दी में वर्तमान काल और ‘यों’ इसकी औपचारिक, घोषणात्मक शैली को स्वाभाविक रूप से रखते हैं।
- source_word: אֲדֹנָי יְהוִה
  choice: प्रभु यहोवा
  rationale: אֲדֹנָי को ‘प्रभु’ और वाचा के व्यक्तिगत नाम יהוה को ‘यहोवा’ रखा गया है, जिससे दोनों अलग-अलग तत्व स्पष्ट रहते हैं।
- source_word: רָעָה
  choice: विपत्ति
  rationale: न्याय के इस प्रसंग में यह नैतिक बुराई नहीं, बल्कि आनेवाली घोर आपदा को सूचित करता है; ‘विपत्ति’ आधुनिक, गरिमापूर्ण और प्रसंगानुकूल है।
- source_word: רָעָה אַחַת רָעָה
  choice: विपत्ति पर विपत्ति
  rationale: यह स्वाभाविक हिन्दी में मूल की आकस्मिक पुनरावृत्ति और तीव्रता को व्यक्त करता है, पर אַחַת के शाब्दिक ‘एक’ को मुख्य पाठ में स्पष्ट नहीं करता; इसलिए विकल्प पादटिप्पणी में दिया गया है।
- source_word: הִנֵּה
  choice: देखो
  rationale: आनेवाली घटना की ओर तत्काल ध्यान खींचनेवाली भविष्यद्वाणी की पुकार को सुरक्षित रखता है।
- source_word: בָאָה
  choice: वह आ रही है
  rationale: स्त्रीलिंग क्रिया का संबंध ‘विपत्ति’ से है और यह निकट आती हुई घटना की तात्कालिकता व्यक्त करती है।
theological_decisions:
- issue: אֲדֹנָי יְהוִה में परमेश्वर के नाम का अनुवाद
  choice: प्रभु यहोवा
  alternative: प्रभु याहवे
  rationale: ‘यहोवा’ हिन्दी बाइबलीय प्रयोग में व्यापक रूप से पहचाना जाने वाला रूप है और יהוה को केवल पदवी में बदलने के बजाय व्यक्तिगत नाम के रूप में बनाए रखता है।
- issue: רָעָה का नैतिक या आपदात्मक अर्थ
  choice: विपत्ति
  alternative: बुराई
  rationale: अध्याय के न्याय-संदर्भ में आशय आनेवाली आपदा है; ‘बुराई’ परमेश्वर द्वारा नैतिक बुराई लाने का अनपेक्षित अर्थ दे सकती है।
translation_notes:
  register: आधुनिक मानक हिन्दी; स्वर गंभीर और भविष्यद्वाणी-संबंधी है। ‘विपत्ति पर विपत्ति’ साधारण पाठक के लिए सहज है, जबकि पादटिप्पणी मूल की कठिन, अस्पष्ट संरचना को सामने रखती है।
