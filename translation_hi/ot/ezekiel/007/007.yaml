  text: בָּ֧אָה הַ/צְּפִירָ֛ה אֵלֶ֖י/ךָ יוֹשֵׁ֣ב הָ/אָ֑רֶץ בָּ֣א הָ/עֵ֗ת קָר֛וֹב הַ/יּ֥וֹם מְהוּמָ֖ה וְ/לֹא הֵ֥ד הָרִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/007/007.yaml
  text: Doom has come upon you[a], inhabitant of the land. The time has come; the day is near—panic[b], and not joyful shouting on the mountains.
translation:
  language: hi
  text: हे देश के निवासी, तुझ पर विनाश आ पहुँचा है[a]। समय आ गया है; वह दिन निकट है—हाहाकार है, पहाड़ों पर आनंद का घोष नहीं[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इसका अनुवाद ‘तेरी बारी आ पहुँची है’ या ‘तेरी नियति आ पहुँची है’ भी हो सकता है। यहाँ प्रयुक्त इब्रानी शब्द दुर्लभ है और उसका अर्थ निश्चित नहीं है।
    reason: lexical_alternative
  - marker: b
    text: इसका अनुवाद ‘हाहाकार है, पहाड़ों की गूँज नहीं’ भी हो सकता है। अंतिम वाक्यांश का अर्थ कठिन है। अनेक विद्वान इसे हाहाकार और पहाड़ों पर सामान्यतः सुनाई देने वाले आनंदपूर्ण घोष के बीच विरोध मानते हैं, जो संभवतः कटनी के उत्सव से जुड़ा था।
    reason: lexical_alternative
lexical_decisions:
- source_word: הַצְּפִירָה
  choice: विनाश
  rationale: यह संज्ञा दुर्लभ और अर्थ की दृष्टि से कठिन है। न्याय की इस घोषणा में बार-बार आने वाले ‘आ पहुँचा/आ गया’ और समानांतर ‘समय आ गया है’ के कारण यह उस निर्णायक अंत या विपत्ति को सूचित करती जान पड़ती है जो अब आ पहुँची है। इसलिए मुख्य पाठ में स्वाभाविक हिन्दी ‘विनाश’ रखा गया है और अन्य संभावनाएँ पादटिप्पणी में दी गई हैं।
- source_word: יוֹשֵׁב הָאָרֶץ
  choice: हे देश के निवासी
  rationale: एकवचन कृदन्त को सीधे संबोधन के रूप में रखा गया है। प्रसंग में אֶרֶץ से संबंधित देश अभिप्रेत होना व्यापक ‘पृथ्वी’ की अपेक्षा अधिक स्वाभाविक है।
- source_word: הָעֵת
  choice: समय
  rationale: यह सामान्य और सीधा अनुवाद है; मूल शब्द अपने आप में ‘ठहराया हुआ’ जोड़ने की माँग नहीं करता।
- source_word: קָרוֹב הַיּוֹם
  choice: वह दिन निकट है
  rationale: यह आधुनिक हिन्दी में स्वाभाविक ढंग से दिन के आसन्न होने की घोषणा करता है। ‘वह’ उस घोषित न्याय-दिवस को स्पष्ट रूप से संदर्भित करता है, बिना उसका स्वरूप अधिक निर्धारित किए।
- source_word: מְהוּמָה
  choice: आतंक का कोलाहल
  rationale: शब्द अव्यवस्था, घबराहट और उपद्रव का भाव दे सकता है। ‘आतंक का कोलाहल’ भय और सुनाई देने वाली हलचल—दोनों पक्षों को समेटता है तथा अगले कठिन शब्द के साथ ध्वन्यात्मक विरोध बनाए रखता है।
- source_word: הֵד
  choice: आनंद की जयजयकार
  rationale: मूल शब्द का अर्थ कठिन है और संभवतः पहाड़ों पर सुनाई देने वाली पुकार या गूँज की ओर संकेत करता है। प्रसंग में מְהוּמָה के विपरीत उत्सवपूर्ण पुकार समझना संभव है; इस व्याख्या को मुख्य पाठ में रखा गया है, जबकि अधिक शाब्दिक विकल्प पादटिप्पणी में सुरक्षित है।
- source_word: הָרִים
  choice: पहाड़ों
  rationale: यह बहुवचन संज्ञा का मानक हिन्दी रूप है और मूल स्थान-सूचना को बनाए रखता है।
