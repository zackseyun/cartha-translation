source:
  edition: WLC
  text: תָּקְע֤וּ בַ/תָּק֨וֹעַ֙ וְ/הָכִ֣ין הַ/כֹּ֔ל וְ/אֵ֥ין הֹלֵ֖ךְ לַ/מִּלְחָמָ֑ה כִּ֥י חֲרוֹנִ֖/י אֶל כָּל הֲמוֹנָֽ/הּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/007/014.yaml
  text: They have blown the trumpet and made everything ready[a], but no one goes to battle[b], for my wrath is against all her multitude.
translation:
  language: hi
  text: उन्होंने तुरही[a] फूँक दी है और सब कुछ तैयार कर लिया है, फिर भी कोई युद्ध में नहीं जाता, क्योंकि मेरा प्रचण्ड क्रोध उसकी सारी भीड़[b] पर है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘सींग’ अथवा ‘मेढ़े का सींग’।
    reason: lexical_alternative
  - marker: b
    text: या ‘उसकी सारी धन-सम्पदा/बहुतायत’, यदि הֲמוֹנָהּ का अर्थ जनसमूह के बजाय भौतिक बहुतायत लिया जाए।
    reason: lexical_alternative
lexical_decisions:
- source_word: תָּקְעוּ בַתָּקוֹעַ
  choice: तुरही फूँक दी है
  rationale: תקע के साथ वाद्य-संज्ञा का अर्थ युद्ध-संकेत के लिए वाद्य फूँकना है। पूर्ण क्रिया को वर्तमान परिणाम सहित दिखाने के लिए ‘फूँक दी है’ स्वाभाविक हिन्दी है। दुर्लभ संज्ञा תָּקוֹעַ को सैन्य प्रसंग में ‘तुरही’ कहा गया है; सींग से बने वाद्य का अर्थ भी सम्भव है।
- source_word: וְהָכִין הַכֹּל
  choice: और सब कुछ तैयार कर लिया है
  rationale: हिफ़ील रूप הָכִין का अर्थ तैयार करना है और הַכֹּל तैयारी की पूर्णता बताता है। ‘तैयार कर लिया है’ तुरही फूँकने के साथ पूरी की गई तैयारी को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: וְאֵין הֹלֵךְ לַמִּלְחָמָה
  choice: फिर भी कोई युद्ध में नहीं जाता
  rationale: אֵין और कृदन्त किसी के जाने के अभाव को व्यक्त करते हैं। तैयारी और निष्क्रियता के विरोध को ‘फिर भी’ स्पष्ट करता है; לַמִּלְחָמָה यहाँ युद्ध में जाने को दर्शाता है।
- source_word: חֲרוֹנִי
  choice: मेरा प्रचण्ड क्रोध
  rationale: חָרוֹן जलते या तीव्र क्रोध का बोध कराता है। ‘प्रचण्ड क्रोध’ इसकी तीव्रता को सामान्य आधुनिक हिन्दी में बनाए रखता है।
- source_word: אֶל כָּל הֲמוֹנָהּ
  choice: उसकी सारी भीड़ पर
  rationale: הָמוֹן का प्रमुख प्रसंगगत अर्थ भीड़ या जनसमूह है और אֶל को क्रोध के लक्ष्य के रूप में ‘पर’ कहा गया है। स्त्रीलिंग एकवचन प्रत्यय का स्पष्ट पूर्वपद न जोड़ते हुए ‘उसकी’ रखा गया है; ‘धन-सम्पदा/बहुलता’ वैकल्पिक अर्थ है।
theological_decisions:
- issue: הֲמוֹנָהּ में स्त्रीलिंग एकवचन प्रत्यय का संदर्भ
  choice: मुख्य पाठ में ‘उसकी’ रखकर नगर या देश का नाम स्पष्ट रूप से नहीं जोड़ा गया।
  alternative: नगर की सारी भीड़; देश की सारी भीड़
  rationale: इब्रानी प्रत्यय स्त्रीलिंग एकवचन है, पर इस पद में उसका पूर्वपद स्पष्ट नहीं है। किसी खास स्थान को जोड़ना मूल की अस्पष्टता को अनावश्यक रूप से समाप्त कर देता।
- issue: הָמוֹן का अर्थ
  choice: भीड़
  alternative: धन-सम्पदा या बहुतायत
  rationale: युद्ध-संकेत और न्याय के प्रसंग में जनसमूह का अर्थ अधिक सहज है, लेकिन भौतिक बहुतायत का प्रमाणित अर्थ पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सहज रूप अपनाया गया है। ‘फिर भी’ तैयारी और युद्ध में न जाने के तीखे विरोध को स्वाभाविक बनाता है। पादटिप्पणी-चिह्न उन्हीं शब्दों के बाद रखे गए हैं जिनसे उनके विकल्प सम्बद्ध हैं।
