id: EZK.7.10
reference: Ezekiel 7:10
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: הִנֵּ֥ה הַ/יּ֖וֹם הִנֵּ֣ה בָאָ֑ה יָֽצְאָה֙ הַ/צְּפִרָ֔ה צָ֚ץ הַ/מַּטֶּ֔ה פָּרַ֖ח הַ/זָּדֽוֹן׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/007/010.yaml
  text: Look[a], the day! Look, it comes! Doom has gone out; the rod has budded; arrogance has blossomed.
translation:
  language: hi
  text: देखो, वह दिन! देखो, वह आ रहा है! विनाश[a] निकल पड़ा है; छड़ी में कोंपल फूट आई है; घमंड फूल उठा है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “भोर निकल आई है”; इब्रानी शब्द कठिन है और इसका अर्थ शाब्दिक रूप से “भोर” अथवा लाक्षणिक रूप से आ पहुँचा हुआ नियत विनाश या निर्णायक मोड़ हो सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: הִנֵּה
  choice: देखो
  rationale: यह अव्यय तत्काल और जोरदार ढंग से ध्यान खींचता है। आधुनिक हिन्दी में ‘देखो’ स्वाभाविक है और इसकी पुनरावृत्ति मूल की भविष्यवाणी-संबंधी तात्कालिकता बनाए रखती है।
- source_word: הַיּוֹם
  choice: वह दिन
  rationale: मूल के निश्चित पदबंध को सुरक्षित रखते हुए ‘वह दिन’ उसके संदर्भगत, आसन्न और अशुभ दिन की ओर संकेत करता है; मुख्य पाठ में ‘न्याय का दिन’ जोड़कर अर्थ को अधिक स्पष्ट नहीं किया गया।
- source_word: בָאָה
  choice: वह आ रहा है
  rationale: रूप पूर्णकालिक है, पर भविष्यवाणी के कथन में आसन्न और निश्चित घटना को सजीव रूप से प्रस्तुत करता है। हिन्दी में ‘आ रहा है’ इस तात्कालिकता को सहजता से व्यक्त करता है।
- source_word: יָצְאָה
  choice: निकल पड़ा है
  rationale: יצא के ‘बाहर निकलने/आगे बढ़ने’ के मूल भाव और पूर्ण क्रिया के वर्तमान परिणाम को बनाए रखता है।
- source_word: הַצְּפִרָה
  choice: विनाश
  rationale: यह कठिन और विवादित शब्द है। इस न्याय-वाणी के संदर्भ में नियत विपत्ति या विनाश का अर्थ उपयुक्त है, पर ‘भोर’ की शाब्दिक संभावना पादटिप्पणी में सुरक्षित रखी गई है।
- source_word: צָץ
  choice: कोंपल फूट आई है
  rationale: वनस्पति-वृद्धि का रूपक स्पष्ट और स्वाभाविक हिन्दी में सुरक्षित रहता है तथा अगले ‘फूल उठा है’ के साथ समानांतरता बनती है।
- source_word: הַמַּטֶּה
  choice: छड़ी
  rationale: מַטֶּה का सामान्य अर्थ छड़ी या दंड है। ‘छड़ी’ पौधे जैसी कोंपल फूटने की छवि को सहज रखती है, जबकि संदर्भ में दंड देने के साधन का संकेत भी बना रहता है।
- source_word: פָּרַח
  choice: फूल उठा है
  rationale: मूल की पुष्पित होने की छवि को सजीव रखता है और ‘कोंपल फूट आई है’ के साथ विकास का क्रम व्यक्त करता है।
- source_word: הַזָּדוֹן
  choice: घमंड
  rationale: यह शब्द अभिमानी, उद्दंड और धृष्ट मनोभाव का द्योतक है। ‘घमंड’ सामान्य आधुनिक हिन्दी में स्पष्ट है और नैतिक निंदा को व्यक्त करता है।
theological_decisions:
- issue: न्याय-वाणी में הַצְּפִרָה का अर्थ
  choice: मुख्य पाठ में ‘विनाश’
  alternative: ‘भोर’ या ‘नियत घड़ी/मोड़’
  rationale: निकटवर्ती संदर्भ आसन्न न्याय और विपत्ति की घोषणा करता है, इसलिए ‘विनाश’ प्रसंगगत अर्थ को संप्रेषित करता है। फिर भी इब्रानी शब्द दुर्लभ और विवादित है; अतः ‘भोर’ की शाब्दिक संभावना पादटिप्पणी में रखकर वास्तविक अस्पष्टता को नहीं मिटाया गया।
- issue: הַמַּטֶּה की रूपकगत पहचान
  choice: ‘छड़ी’ कहकर रूपक को खुला रखा गया
  alternative: ‘दंड देने वाली छड़ी’ या ‘राजदंड’
  rationale: संदर्भ इसे न्याय के साधन से जोड़ सकता है, किंतु पद स्वयं यह निश्चित नहीं करता कि यह दंड की छड़ी है, राजदंड है, या घमंड/हिंसा के उगने की विस्तृत वनस्पति-छवि का भाग। इसलिए व्याख्यात्मक विस्तार नहीं जोड़ा गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और घोषणात्मक रखी गई है। छोटे विस्मयात्मक वाक्य मूल की तात्कालिक लय बनाए रखते हैं। ‘कोंपल फूट आई है’ और ‘फूल उठा है’ से मूल की वनस्पति-छवि तथा समानांतर रचना सुरक्षित रहती है।
