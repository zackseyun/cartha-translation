id: EZK.7.24
reference: Ezekiel 7:24
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/הֵֽבֵאתִי֙ רָעֵ֣י גוֹיִ֔ם וְ/יָרְשׁ֖וּ אֶת בָּֽתֵּי/הֶ֑ם וְ/הִשְׁבַּתִּי֙ גְּא֣וֹן עַזִּ֔ים וְ/נִחֲל֖וּ מְקַֽדְשֵׁי/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/007/024.yaml
  text: And I will bring the worst of the nations[a], and they will take possession of their houses. I will put an end to the pride of the strong[c][b], and their sanctuaries will be profaned.
translation:
  language: hi
  text: और मैं जातियों में से सबसे दुष्ट लोगों को ले आऊँगा[a], और वे उनके घरों पर अधिकार कर लेंगे[b]। मैं बलवानों के घमंड का अंत कर दूँगा, और उनके पवित्र स्थान अपवित्र किए जाएँगे[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जातियों में से सबसे बुरे लोगों को।”
    reason: lexical_alternative
  - marker: b
    text: या, “वे उनके घरों को विरासत में पाएँगे”; इब्रानी क्रिया का अर्थ प्रसंग के अनुसार विरासत पाना, अधिकार करना या बेदखल करना हो सकता है।
    reason: lexical_alternative
  - marker: c
    text: या, “उनके पवित्र स्थान दूषित हो जाएँगे।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֵבֵאתִי
  choice: और मैं ... ले आऊँगा
  rationale: בוא के हिफ़ील रूप का स्वाभाविक अर्थ किसी को ले आना है; आक्रमणकारियों को किसके विरुद्ध लाया जाएगा, यह प्रसंग से स्पष्ट है।
- source_word: רָעֵי גוֹיִם
  choice: जातियों में से सबसे दुष्ट लोगों को
  rationale: बहुवचन संबंध-रूप यहाँ अतिशयोक्तिपरक अर्थ देता है—जातियों के सबसे बुरे या दुष्ट लोग। यह अनुवाद नैतिक तीव्रता बनाए रखता है।
- source_word: וְיָרְשׁוּ אֶת בָּתֵּיהֶם
  choice: वे उनके घरों पर अधिकार कर लेंगे
  rationale: ירשׁ का अर्थ उत्तराधिकार पाना, अधिकार करना या बेदखल करके कब्ज़ा करना हो सकता है। विजय के प्रसंग में 'अधिकार कर लेंगे' स्वाभाविक है और वैध उत्तराधिकार का अनचाहा संकेत नहीं देता।
- source_word: וְהִשְׁבַּתִּי
  choice: मैं ... का अंत कर दूँगा
  rationale: שׁבת के हिफ़ील का कारणवाचक भाव 'रोक देना' या 'अंत कर देना' है।
- source_word: גְּאוֹן עַזִּים
  choice: बलवानों के घमंड
  rationale: גאון का अर्थ घमंड, उत्कर्ष या महिमा हो सकता है और עזים बलवान लोगों को सूचित करता है। न्याय के प्रसंग में 'बलवानों का घमंड' उपयुक्त नकारात्मक भाव रखता है।
- source_word: וְנִחֲלוּ
  choice: अपवित्र किए जाएँगे
  rationale: חלל का निफ़ाल रूप निष्क्रिय अर्थ देता है—पवित्रता भंग होना या अपवित्र किया जाना। हिंदी में यह कर्मवाच्य मूल रूप को स्पष्ट रूप से बनाए रखता है।
- source_word: מְקַדְשֵׁיהֶם
  choice: उनके पवित्र स्थान
  rationale: מקדש का बहुवचन मंदिरों, पवित्र स्थलों या उपासना-स्थानों को सूचित कर सकता है। 'पवित्र स्थान' व्यापकता को बनाए रखता है और अनावश्यक विशिष्टीकरण से बचता है।
theological_decisions:
- issue: न्याय के प्रसंग में גְּאוֹן का भाव
  choice: घमंड
  alternative: महिमा या गौरव
  rationale: दंड और अपमान की इस घोषणा में नकारात्मक 'घमंड' सबसे उपयुक्त है, फिर भी मूल शब्द के सकारात्मक अर्थ अन्य संदर्भों में संभव हैं।
- issue: נִחֲלוּ מְקַדְשֵׁיהֶם का अर्थ
  choice: उनके पवित्र स्थान अपवित्र किए जाएँगे
  alternative: उनके पवित्र स्थान दूषित हो जाएँगे
  rationale: मूल में निष्क्रिय, उपासना-संबंधी अपवित्रीकरण का भाव है। यह अनुवाद यह निर्धारित नहीं करता कि ये पवित्र स्थान ठीक कौन-से हैं।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण और सहज शैली रखी गई है। 'जातियों में से सबसे दुष्ट लोग', 'अधिकार कर लेना' और 'पवित्र स्थान' सामान्य पाठक के लिए स्पष्ट हैं; पादटिप्पणियाँ मूल की प्रमुख शब्दार्थगत संभावनाएँ सुरक्षित रखती हैं।
