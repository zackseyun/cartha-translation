base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/007/004.yaml
  text: My eye will not spare you[a], nor will I have pity; for I will bring your ways upon you, and your abominations will be within you[b]. Then you will know that I am Yahweh.
translation:
  language: hi
  text: मेरी आँख तुझ पर तरस नहीं खाएगी[a], और न मैं दया करूँगा; क्योंकि मैं तेरे मार्गों को तुझ पर लाऊँगा, और तेरे घृणित काम तेरे भीतर होंगे[b]। तब तुम जानोगे कि मैं यहोवा हूँ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मेरी आँख तुझ पर दया नहीं करेगी।” इब्रानी में ‘आँख’ के साथ प्रयुक्त यह मुहावरा तरस खाने या दया करके छोड़ देने का भाव व्यक्त करता है।
    reason: lexical_alternative
  - marker: b
    text: या, “तेरे घृणित काम तेरे बीच में होंगे।”
    reason: lexical_alternative
lexical_decisions:
- source_word: תָחוֹס עֵינִי
  choice: मेरी आँख तुझ पर तरस नहीं खाएगी
  rationale: ‘आँख’ के इब्रानी मुहावरे को बनाए रखते हुए חוס का दया करके छोड़ देने या तरस खाने का भाव व्यक्त होता है।
- source_word: אֶחְמֹל
  choice: और न मैं दया करूँगा
  rationale: חמל को पहले पद के मुहावरे से अलग शब्दों में प्रस्तुत करके मूल की अर्थगत पुनरुक्ति और जोर सुरक्षित रखा गया है।
- source_word: דְרָכַיִךְ עָלַיִךְ אֶתֵּן
  choice: मैं तेरे चालचलन का फल तुझ पर ही डालूँगा
  rationale: ‘चालचलन’ जीवन-व्यवहार का भाव देता है; ‘फल’ को स्पष्ट रूप से जोड़ना प्रतिफल के सूत्र को स्वाभाविक हिन्दी में व्यक्त करता है, यद्यपि वह इब्रानी में अंतर्निहित है।
- source_word: וְתוֹעֲבוֹתַיִךְ
  choice: और तेरे घिनौने काम
  rationale: यह चयन תועבות के नैतिक तथा विशेषतः मूर्तिपूजक घृणित कर्मों के अर्थ को साधारण आधुनिक हिन्दी में स्पष्ट करता है।
- source_word: בְּתוֹכֵךְ תִּהְיֶיןָ
  choice: तेरे बीच बने रहेंगे
  rationale: स्थानवाचक ‘तेरे बीच’ को सुरक्षित रखते हुए स्त्रीलिंग बहुवचन क्रिया का संबंध ‘घिनौने कामों’ से रखा गया है; ‘बने रहेंगे’ वाक्य की कठोर, कुछ अस्पष्ट स्थिति को दर्शाता है।
- source_word: וִידַעְתֶּם
  choice: तब तुम जानोगे
  rationale: एकवचन स्त्रीलिंग संबोधन से बहुवचन क्रिया में मूल के परिवर्तन को ज्यों का त्यों रखा गया है; ‘तब’ न्याय के परिणाम को व्यक्त करता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिन्दी में प्रचलित व्यक्तिगत नाम ‘यहोवा’ चतुर्वर्णी ईश-नाम को किसी उपाधि से बदलने के बजाय नाम के रूप में प्रस्तुत करता है।
theological_decisions:
- issue: ईश्वरीय न्याय और प्रतिफल का सूत्र
  choice: मैं तेरे चालचलन का फल तुझ पर ही डालूँगा
  alternative: मैं तेरे चालचलन के कारण तुझे दण्ड दूँगा
  rationale: मूल पाठ सीधे ‘दण्ड’ शब्द नहीं जोड़ता, बल्कि व्यक्ति के चालचलन को उसी पर डालने की छवि देता है। चुना हुआ पाठ इस न्यायिक प्रतिफल को बनाए रखता है, हालांकि स्वाभाविक हिन्दी के लिए ‘फल’ अंतर्निहित अर्थ को स्पष्ट करता है।
- issue: एकवचन से बहुवचन संबोधन का परिवर्तन
  choice: तुझ/तेरे … तुम जानोगे
  alternative: तू जानेगी
  rationale: इब्रानी पाठ पहले यरूशलेम को स्त्रीलिंग एकवचन में संबोधित करता है, फिर וִידַעְתֶּם में बहुवचन पर जाता है। इस तनाव को एकरूप बनाकर मिटाया नहीं गया।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण भविष्यद्वाणी-संबंधी लहजा रखा गया है। यरूशलेम के लिए स्त्रीलिंग एकवचन ‘तुझ/तेरे’ और अंत में मूल के बहुवचन ‘तुम जानोगे’ को सुरक्षित रखा गया है।
