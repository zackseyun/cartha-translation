  text: עֲשֵׂ֖ה הָֽ/רַתּ֑וֹק כִּ֣י הָ/אָ֗רֶץ מָֽלְאָה֙ מִשְׁפַּ֣ט דָּמִ֔ים וְ/הָ/עִ֖יר מָלְאָ֥ה חָמָֽס׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/007/023.yaml
  text: Make the chain[a], for the land is full of bloody crimes[b], and the city is full of violence.
translation:
  language: hi
  text: ज़ंजीर बनाओ[a], क्योंकि देश खूनी अपराधों[b] से भरा है, और नगर हिंसा से भरा है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘बेड़ी’ अथवा ‘बंधन।’ इब्रानी शब्द सम्भवतः न्याय के अधीन रोके जाने, कैद या बंदीपन का बोध कराता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, ‘खूनों का न्याय।’ यह वाक्यांश रक्तदोष, हत्यापूर्ण अन्याय या न्याय-दण्ड के योग्य अपराधों की ओर संकेत कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲשֵׂה
  choice: बनाओ
  rationale: यह עשה का पुल्लिंग एकवचन आज्ञार्थक रूप है। ‘बनाओ’ प्रत्यक्ष आदेश को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: הָרַתּוֹק
  choice: ज़ंजीर
  rationale: यह दुर्लभ संज्ञा ज़ंजीर, बेड़ी या बंधन का संकेत देती है। न्याय और आनेवाली बंधुआई के संदर्भ में ‘ज़ंजीर’ ठोस प्रतिबंधकारी बिंब को बनाए रखती है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पहले आदेश का कारण प्रस्तुत करता है; हिन्दी में ‘क्योंकि’ स्पष्ट और स्वाभाविक है।
- source_word: הָאָרֶץ
  choice: देश
  rationale: यहाँ संदर्भ इस्राएल/यहूदा के भूभाग का है, पूरी पृथ्वी का नहीं; ‘देश’ आधुनिक हिन्दी में इस प्रादेशिक अर्थ को सहज रूप से व्यक्त करता है।
- source_word: מָלְאָה
  choice: से भरा है
  rationale: पूर्ण क्रिया का परिणामसूचक स्थितिपरक भाव वर्तमान हिन्दी में ‘से भरा है’ द्वारा स्वाभाविक रूप से व्यक्त होता है।
- source_word: מִשְׁפַּט דָּמִים
  choice: खून के अपराधों
  rationale: शाब्दिक वाक्यांश ‘खूनों का न्याय/निर्णय’ कठिन और बहुअर्थी है। ‘खून के अपराध’ रक्तपात, रक्तदोष और अन्यायपूर्ण हिंसा के न्यायिक पक्ष को संक्षेप में व्यक्त करता है, जबकि पादटिप्पणी मूल अभिव्यक्ति की कठिनाई सुरक्षित रखती है।
- source_word: וְהָעִיר
  choice: और नगर
  rationale: सरल संयोजन और निश्चित संज्ञा है; संदर्भ में नगर सम्भवतः यरूशलेम है, पर अनुवाद उसे स्पष्ट रूप से नामित नहीं करता।
- source_word: חָמָס
  choice: हिंसा
  rationale: यह शब्द क्रूरता, उत्पीड़न और सामाजिक अन्याय को समेटता है। ‘हिंसा’ भविष्यद्वाणी के इस संदर्भ में उसका मुख्य और परिचित हिन्दी समतुल्य है।
theological_decisions:
- issue: הָרַתּוֹק में न्याय के बिंब की व्याख्या
  choice: आनेवाले न्याय और बंधुआई से जुड़ी ठोस या प्रतीकात्मक ज़ंजीर
  alternative: घेराबंदी के लिए बेड़ी तैयार करना, या बंधुआई का स्पष्ट संकेत दिए बिना सामान्य ‘बंधन’
  rationale: यहेजकेल 7 के निकट संदर्भ में आक्रमण, दण्ड और सुरक्षा का अन्त प्रमुख हैं। ‘ज़ंजीर’ सटीक कार्यविधि तय किए बिना भविष्यद्वाणी के ठोस बिंब को बनाए रखती है।
- issue: מִשְׁפַּט דָּמִים का न्यायिक और नैतिक अर्थ
  choice: रक्तपात से जुड़े अपराध और रक्तदोष
  alternative: रक्तपात से दूषित न्याय, या खून का न्याय-दण्ड
  rationale: इब्रानी रचना वास्तविक रूप से कठिन है और न्याय, रक्तदोष तथा हिंसक अपराध के बीच तनाव रखती है। मुख्य पाठ सुबोध अर्थ देता है और पादटिप्पणी शाब्दिक रूप तथा विकल्पों को सुरक्षित रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सीधा भविष्यद्वाणीपरक स्वर रखा गया है। ‘देश’ और ‘नगर’ सामान्य पाठक के लिए सहज हैं; ‘ज़ंजीर’ ठोस बिंब रखती है। कठिन इब्रानी पदबंधों की वास्तविक अस्पष्टता पादटिप्पणियों में सुरक्षित है।
