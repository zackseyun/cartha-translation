source:
  edition: WLC
  text: הַ/חֶ֣רֶב בַּ/ח֔וּץ וְ/הַ/דֶּ֥בֶר וְ/הָ/רָעָ֖ב מִ/בָּ֑יִת אֲשֶׁ֤ר בַּ/שָּׂדֶה֙ בַּ/חֶ֣רֶב יָמ֔וּת וַ/אֲשֶׁ֣ר בָּ/עִ֔יר רָעָ֥ב וָ/דֶ֖בֶר יֹאכֲלֶֽ/נּוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/007/015.yaml
  text: The sword is outside[a], and pestilence and famine are inside. Whoever is in the field will die by the sword, and whoever is in the city[b], famine and pestilence will consume him.
translation:
  language: hi
  text: तलवार बाहर है, और महामारी और अकाल भीतर हैं। जो कोई मैदान में है, वह तलवार से मरेगा; और जो कोई नगर में है, उसे अकाल और महामारी निगल जाएँगे।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “उसे अकाल और महामारी खा जाएँगे।”
    reason: lexical_alternative
lexical_decisions:
- source_word: הַחֶרֶב
  choice: तलवार
  rationale: मूल ठोस बिंब और भविष्यद्वाणी में युद्धजनित हिंसक मृत्यु के संकेत—दोनों को बनाए रखता है।
- source_word: בַּחוּץ
  choice: बाहर
  rationale: מִבָּיִת के ‘भीतर’ से स्पष्ट स्थानगत विरोध व्यक्त करता है।
- source_word: הַדֶּבֶר
  choice: महामारी
  rationale: न्याय-सूत्र में प्रयुक्त व्यापक संक्रामक विपत्ति के लिए आधुनिक मानक हिन्दी का स्वाभाविक और गरिमापूर्ण शब्द है।
- source_word: הָרָעָב
  choice: अकाल
  rationale: व्यक्तिगत भूख नहीं, बल्कि व्यापक अभाव और भुखमरी को व्यक्त करता है।
- source_word: מִבָּיִת
  choice: भीतर
  rationale: शाब्दिक रूप में ‘घर के भीतर से’ की आंतरिक स्थिति का बोध है; यहाँ ‘बाहर’ के समानांतर संक्षिप्त ‘भीतर’ हिन्दी में स्वाभाविक है और किसी विशेष घर का अनावश्यक संकेत नहीं देता।
- source_word: אֲשֶׁר בַּשָּׂדֶה
  choice: जो कोई मैदान में है
  rationale: वितरणात्मक एकवचन और खुले क्षेत्र की स्थानगत धारणा बनाए रखता है।
- source_word: בַּחֶרֶב יָמוּת
  choice: तलवार से मरेगा
  rationale: हिब्रू की सीधी अभिव्यक्ति और साधनवाचक अर्थ को सुरक्षित रखता है।
- source_word: וַאֲשֶׁר בָּעִיר
  choice: और जो कोई नगर में है
  rationale: मैदान और नगर का विरोध तथा वितरणात्मक एकवचन दोनों बनाए रखता है।
- source_word: רָעָב וָדֶבֶר
  choice: अकाल और महामारी
  rationale: दूसरे खंड में हिब्रू शब्द-क्रम को बिना पहले खंड से समरूप किए सुरक्षित रखता है।
- source_word: יֹאכֲלֶנּוּ
  choice: उसे ... निगल जाएँगे
  rationale: क्रिया का शाब्दिक अर्थ ‘खा जाना’ है; ‘निगल जाना’ विनाशकारी व्यक्तिकरण को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: -נּוּ (3ms suffix)
  choice: उसे
  rationale: हिब्रू के तृतीय पुरुष पुल्लिंग एकवचन प्रत्यय और वितरणात्मक एकवचन का अनुसरण करता है।
theological_decisions:
- issue: न्याय की त्रयी का बिंब
  choice: ‘तलवार… महामारी… अकाल’ जैसे ठोस पद बनाए रखे गए हैं।
  alternative: इन्हें सामान्य रूप से ‘युद्ध, बीमारी और भुखमरी’ कहना।
  rationale: मूल की स्थापित भविष्यद्वाणी-संबंधी न्याय-भाषा को बिना व्याख्यात्मक विस्तार के सुरक्षित रखना उचित है।
- issue: वितरणात्मक एकवचन
  choice: ‘जो कोई… वह/उसे’ रखा गया है।
  alternative: बहुवचन ‘जो लोग… वे/उन्हें’।
  rationale: मूल के एकवचन संबंधवाचक विन्यास और 3ms प्रत्यय को बनाए रखता है; इसका सामान्य मानवीय संदर्भ हिन्दी में ‘जो कोई’ से स्पष्ट है।
- issue: विनाश का व्यक्तिकरण
  choice: अकाल और महामारी को ‘निगल जाने’ वाले कर्ताओं के रूप में रखा गया है।
  alternative: ‘अकाल और महामारी से नष्ट हो जाएगा।’
  rationale: मूल क्रिया אָכַל के सजीव रूपक को सुरक्षित रखता है और उसे केवल अमूर्त परिणाम में नहीं बदलता।
translation_notes:
  register: आधुनिक मानक हिन्दी का संक्षिप्त, गरिमापूर्ण भविष्यद्वाणी-रजिस्टर। ‘महामारी’ सामान्य पाठक के लिए ‘मरी’ जैसे अधिक पुरातन विकल्प से स्पष्ट है। विरामचिह्नों से बाहर/भीतर और मैदान/नगर की समानांतर संरचना उभारी गई है।
