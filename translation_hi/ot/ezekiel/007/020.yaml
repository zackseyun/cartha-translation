  text: וּ/צְבִ֤י עֶדְי/וֹ֙ לְ/גָא֣וֹן שָׂמָ֔/הוּ וְ/צַלְמֵ֧י תוֹעֲבֹתָ֛/ם שִׁקּוּצֵי/הֶ֖ם עָ֣שׂוּ ב֑/וֹ עַל כֵּ֛ן נְתַתִּ֥י/ו לָ/הֶ֖ם לְ/נִדָּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/007/020.yaml
  text: And they made the beauty of his ornament into pride[a], and in it they made the images of their abominations, their detestable things[b]; therefore I have made it an unclean thing to them.
translation:
  language: hi
  text: और उन्होंने उसके आभूषण की शोभा को घमण्ड का विषय बना दिया; और उसी से उन्होंने अपनी घिनौनी वस्तुओं की प्रतिमाएँ—अपनी घृणित चीज़ें—बनाईं[a]। इसलिए मैंने उसे उनके लिए अशुद्ध वस्तु बना दिया[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “और उसमें उन्होंने अपनी घिनौनी वस्तुओं की प्रतिमाएँ, अपनी घृणित चीज़ें बनाईं।” इब्रानी में “उससे/उसमें” सामग्री या साधन, अथवा स्थान—दोनों का बोध करा सकता है।
    reason: lexical_alternative
  - marker: b
    text: “अशुद्ध वस्तु” के लिए प्रयुक्त इब्रानी शब्द धार्मिक अशुद्धता से जुड़ा है; इसका अर्थ “त्याज्य वस्तु” भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וּצְבִי עֶדְיוֹ
  choice: उसके आभूषण की शोभा
  rationale: צְבִי को ‘शोभा’ और עֶדְיוֹ को एकवचन ‘उसके आभूषण’ के रूप में रखा गया है। इससे मूल्यवान सजावट का भाव बना रहता है और उसका निश्चित ऐतिहासिक संदर्भ अनावश्यक रूप से तय नहीं किया जाता।
- source_word: לְגָאוֹן שָׂמָהוּ
  choice: अपने घमण्ड का साधन बना लिया
  rationale: גָּאוֹן यहाँ न्याय-संदर्भ में नकारात्मक ‘घमण्ड’ व्यक्त करता है। परिणामसूचक ל और שׂים का स्वाभाविक हिन्दी रूप यह दिखाता है कि उन्होंने शोभा का उपयोग अभिमान के लिए किया।
- source_word: וְצַלְמֵי תוֹעֲבֹתָם שִׁקּוּצֵיהֶם
  choice: अपनी घिनौनी वस्तुओं की प्रतिमाएँ—अपनी घृणित मूर्तियाँ
  rationale: צֶלֶם के लिए ‘प्रतिमाएँ’ और תּוֹעֵבָה के लिए ‘घिनौनी वस्तुएँ’ रखा गया है; שִׁקּוּץ का मूर्तिपूजक संदर्भ स्पष्ट करने के लिए ‘घृणित मूर्तियाँ’ चुना गया है। विराम-चिह्न दोनों जुड़े हुए पदों को एक ही आरोप के रूप में प्रस्तुत करता है।
- source_word: עָשׂוּ בוֹ
  choice: उसी से ... बनाईं
  rationale: בּוֹ साधन या सामग्री भी बता सकता है और स्थान भी। संदर्भ में बहुमूल्य आभूषण से प्रतिमाएँ बनाने का अर्थ स्वाभाविक है; स्थानवाचक संभावना को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: עַל כֵּן נְתַתִּיו לָהֶם לְנִדָּה
  choice: इसलिए मैंने उसे उनके लिए अशुद्ध वस्तु बना दिया
  rationale: נָתַן के परिणामसूचक प्रयोग को ‘बना दिया’ से और נִדָּה के धार्मिक-अशुद्धता तथा त्याज्यता के भाव को ‘अशुद्ध वस्तु’ से व्यक्त किया गया है।
theological_decisions:
- issue: לְנִדָּה में अशुद्धता का स्वरूप
  choice: अशुद्ध वस्तु
  alternative: त्याज्य वस्तु
  rationale: यह चयन मूर्तिपूजा से उत्पन्न धार्मिक और नैतिक अशुद्धता को बनाए रखता है, जबकि वैकल्पिक ‘त्याज्य’ अर्थ पादटिप्पणी में दिया गया है।
- issue: आभूषण और मूर्तियों के बीच संबंध
  choice: आभूषण को सामग्री/साधन मानना
  alternative: उसमें प्रतिमाएँ बनाना
  rationale: בּוֹ दोनों अर्थों की अनुमति देता है। निकट संदर्भ में मूल्यवान वस्तु का मूर्तियों के निर्माण में उपयोग अधिक स्वाभाविक है, पर वास्तविक हिब्रू अस्पष्टता पादटिप्पणी में संरक्षित है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘घमण्ड का साधन’ और ‘अशुद्ध वस्तु’ मूल के अर्थ-संबंध स्पष्ट करते हैं; पादटिप्पणियाँ सामग्री/स्थान तथा अशुद्ध/त्याज्य की वास्तविक अस्पष्टता सुरक्षित रखती हैं।
