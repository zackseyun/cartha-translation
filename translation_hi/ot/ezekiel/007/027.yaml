source:
  edition: WLC
  text: הַ/מֶּ֣לֶךְ יִתְאַבָּ֗ל וְ/נָשִׂיא֙ יִלְבַּ֣שׁ שְׁמָמָ֔ה וִ/ידֵ֥י עַם הָ/אָ֖רֶץ תִּבָּהַ֑לְנָה מִ/דַּרְכָּ֞/ם אֶעֱשֶׂ֤ה אוֹתָ/ם֙ וּ/בְ/מִשְׁפְּטֵי/הֶ֣ם אֶשְׁפְּטֵ֔/ם וְ/יָדְע֖וּ כִּֽי אֲנִ֥י יְהוָֽה־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/007/027.yaml
  text: The king will mourn[a], and the prince will clothe himself with desolation, and the hands of the people of the land will tremble. According to their way I will deal with them, and by their own judgments I will judge them[c][b]. Then they will know that I am Yahweh.
translation:
  language: hi
  text: राजा विलाप करेगा, प्रधान उजाड़ ओढ़ लेगा[a], और देश के लोगों के हाथ भय से काँपेंगे[b]। उनके चालचलन के अनुसार मैं उनके साथ व्यवहार करूँगा, और उनके ही न्यायों के अनुसार उनका न्याय करूँगा[c]। तब वे जानेंगे कि मैं याहवे हूँ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “प्रधान विनाश की दहशत पहन लेगा।” हिब्रू में वस्त्र पहनने का रूपक है; प्रयुक्त संज्ञा उजाड़, स्तब्धकारी विनाश या उससे उपजी दहशत का बोध करा सकती है।
    reason: lexical_alternative
  - marker: b
    text: “देश के लोग” हिब्रू की एक अभिव्यक्ति है जिसका आशय सामान्य जनसमुदाय हो सकता है। शाब्दिक चित्र में उनके हाथ भयभीत या व्याकुल हो जाते हैं।
    reason: lexical_alternative
  - marker: c
    text: या, “उनके अपने न्यायिक व्यवहार के द्वारा मैं उनका न्याय करूँगा।” हिब्रू का आशय यह भी हो सकता है कि परमेश्वर उन्हें उन्हीं मानदंडों या न्यायिक प्रथाओं के अनुसार परखेंगे जिन्हें उन्होंने अपनाया था।
    reason: alternative_reading
lexical_decisions:
- source_word: הַמֶּלֶךְ יִתְאַבָּל
  choice: राजा विलाप करेगा
  rationale: יִתְאַבָּל शोक मनाने या विलाप करने को दर्शाता है। ‘विलाप करेगा’ आसन्न राष्ट्रीय विपत्ति के संदर्भ में स्वाभाविक और सटीक है।
- source_word: וְנָשִׂיא
  choice: प्रधान
  rationale: נָשִׂיא किसी प्रमुख, शासक या राजकीय अगुए का पदनाम है। ‘प्रधान’ उसके उच्च आधिकारिक पद को बनाए रखता है और उसे अनिवार्य रूप से राजा का पुत्र नहीं ठहराता।
- source_word: יִלְבַּשׁ שְׁמָמָה
  choice: उजाड़ ओढ़ लेगा
  rationale: हिब्रू में वस्त्र पहनने का सजीव रूपक है, जबकि שְׁמָמָה उजाड़, स्तब्धकारी विनाश या उससे उपजी दहशत का बोध करा सकता है। ‘उजाड़ ओढ़ लेगा’ उस रूपक और मूल की तीक्ष्णता को बनाए रखता है।
- source_word: וִידֵי עַם הָאָרֶץ תִּבָּהַלְנָה
  choice: देश के लोगों के हाथ भय से काँपेंगे
  rationale: ‘हाथ’ लोगों की सामर्थ्य और कार्य-क्षमता को मूर्त रूप में दिखाते हैं; בהל भयभीत, व्याकुल या आतंकित होने का भाव देता है। यह अनुवाद दोनों चित्रों को सहज हिन्दी में रखता है।
- source_word: מִדַּרְכָּם אֶעֱשֶׂה אוֹתָם
  choice: उनके चालचलन के अनुसार मैं उनके साथ व्यवहार करूँगा
  rationale: דֶּרֶךְ यहाँ जीवन-पद्धति या आचरण को सूचित करता है। ‘चालचलन’ प्रतिफलात्मक न्याय के आशय को स्पष्ट करता है, और ‘व्यवहार करूँगा’ हिब्रू के सामान्य क्रियापद को स्वाभाविक हिन्दी देता है।
- source_word: וּבְמִשְׁפְּטֵיהֶם אֶשְׁפְּטֵם
  choice: उनके ही न्यायों के अनुसार उनका न्याय करूँगा
  rationale: מִשְׁפָּט न्याय, न्यायिक निर्णय, मानदंड या व्यवहार को सूचित कर सकता है। ‘उनके ही’ प्रत्यय के प्रतिफलात्मक बल को उभारता है, जबकि पादटिप्पणी संभावित न्यायिक-अभ्यास वाले अर्थ को सुरक्षित रखती है।
- source_word: וְיָדְעוּ כִּי אֲנִי יְהוָה
  choice: तब वे जानेंगे कि मैं याहवे हूँ
  rationale: यह यहेजकेल का आवर्ती पहचान-सूत्र है। संदर्भ में ‘तब’ न्याय के परिणाम को स्वाभाविक रूप से व्यक्त करता है, और יְהוָה को व्यक्तिगत नाम ‘याहवे’ के रूप में लिप्यंतरित किया गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में चार अक्षरों वाला व्यक्तिगत ईश्वरीय नाम सीधे प्रयुक्त है। ‘याहवे’ उसका प्रचलित विद्वत्तापूर्ण लिप्यंतरण है और नाम को उपाधि में नहीं बदलता।
- issue: וְיָדְעוּ पहचान-सूत्र का संबंध
  choice: तब वे जानेंगे
  alternative: और वे जानेंगे
  rationale: वाव का साधारण संयोजक अर्थ ‘और’ संभव है, पर इस न्याय-वर्णन में वाक्य परिणाम भी व्यक्त करता है। ‘तब’ संदर्भगत परिणति को स्पष्ट करता है, बिना सूत्र के धार्मिक तनाव को बदलने के।
- issue: लोगों के अपने מִשְׁפָּטִים द्वारा न्याय
  choice: उनके ही न्यायों के अनुसार
  alternative: उनके न्यायिक व्यवहार के द्वारा
  rationale: वाक्यांश प्रतिफलात्मक न्याय का संकेत देता है, पर यह अस्पष्ट है कि आशय उनके मानदंडों, निर्णयों या न्यायिक प्रथाओं से है। मुख्य पाठ व्यापक अर्थ रखता है और पादटिप्पणी इस अस्पष्टता को दर्ज करती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सार्वजनिक पाठ के योग्य रखी गई है। ‘उजाड़ ओढ़ लेगा’ जानबूझकर कुछ असामान्य है, क्योंकि मूल का वस्त्र-रूपक भी तीखा और काव्यात्मक है। ‘प्रधान’ पदनाम נָשִׂיא की व्यापकता बनाए रखता है; ‘देश के लोग’ बाइबलीय अभिव्यक्ति को पठनीय हिन्दी में प्रस्तुत करता है।
