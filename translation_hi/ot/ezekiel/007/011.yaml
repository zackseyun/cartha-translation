source:
  edition: WLC
  text: הֶ/חָמָ֥ס קָ֖ם לְ/מַטֵּה רֶ֑שַׁע לֹא מֵ/הֶ֞ם וְ/לֹ֧א מֵ/הֲמוֹנָ֛/ם וְ/לֹ֥א מֶ/הֱמֵ/הֶ֖ם וְ/לֹא נֹ֥הַּ בָּ/הֶֽם׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/007/011.yaml
  text: Violence has arisen into a rod of wickedness[a]; none of them remains, none of their multitude, none of their wealth[b], and there is no eminence among them.
translation:
  language: hi
  text: हिंसा दुष्टता की छड़ी बनकर उठ खड़ी हुई है; न उनमें से कोई बचेगा, न उनकी भीड़ में से, न उनकी बहुतायत में से[a]; और उनमें कोई श्रेष्ठता न रहेगी[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इब्रानी में ये पदबंध अधूरे और कठिन हैं। अधिक शाब्दिक रूप होगा: “न उनमें से, न उनकी भीड़ में से, न उनकी बहुतायत में से।” तीसरे नकारात्मक पदबंध का अर्थ “बहुतायत,” “कोलाहल” या संभवतः “धन-संपत्ति” भी हो सकता है।'
    reason: alternative_reading
  - marker: b
    text: “श्रेष्ठता” के लिए प्रयुक्त इब्रानी शब्द दुर्लभ और अनिश्चित है। इसका अर्थ “प्रतिष्ठा” या “विशिष्टता” भी समझा गया है; कुछ व्याख्याएँ इस पूरे पदबंध को भिन्न प्रकार से लेती हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶחָמָס
  choice: हिंसा
  rationale: חָמָס हिंसा, अन्याय और हिंसक दुष्कर्म को सूचित करता है। वाक्य के आरम्भ में ‘हिंसा’ उसकी सजीव और प्रबल छवि बनाए रखता है।
- source_word: קָם
  choice: उठ खड़ी हुई है
  rationale: קום का पूर्ण रूप यहाँ उठने या उभर आने का भाव देता है; हिंदी में यह प्रयोग हिंसा के मानवीकरण को स्वाभाविक रूप से बनाए रखता है।
- source_word: לְמַטֵּה רֶשַׁע
  choice: दुष्टता की छड़ी बनकर
  rationale: מַטֶּה का अर्थ छड़ी या दंड हो सकता है और רֶשַׁע नैतिक दुष्टता को दर्शाता है। ‘बनकर’ לְ के परिणामी भाव को सहज हिंदी में व्यक्त करता है, जबकि रूपक को खुला रखता है।
- source_word: לֹא מֵהֶם
  choice: न उनमें से कोई बचेगा
  rationale: इब्रानी पदबंध अधूरा और संक्षिप्त है। निकटवर्ती न्याय-संदर्भ के आधार पर ‘बचेगा’ जोड़ने से निहित अर्थ स्पष्ट होता है, बिना किसी विशिष्ट व्यक्ति या वर्ग को आरोपित किए।
- source_word: וְלֹא מֵהֲמוֹנָם
  choice: न उनकी भीड़ में से
  rationale: הָמוֹן भीड़, जनसमूह, बहुतायत या कोलाहल का अर्थ दे सकता है। यहाँ लोगों के समूह के लिए ‘भीड़’ संक्षिप्त और स्वाभाविक है।
- source_word: וְלֹא מֶהֱמֵהֶם
  choice: न उनकी बहुतायत में से
  rationale: यह रूप दुर्बोध और अनिश्चित है। ‘बहुतायत’ संभावित abundance-वाचन को बनाए रखता है और ‘धन-संपत्ति’ जैसी अधिक निश्चित व्याख्या आरोपित नहीं करता।
- source_word: וְלֹא נֹהַּ בָּהֶם
  choice: और उनमें कोई प्रतिष्ठित न रहेगा
  rationale: नֹהַּ अत्यंत दुर्लभ और अनिश्चित शब्द है। ‘प्रतिष्ठित’ श्रेष्ठता या विशिष्टता के संभावित अर्थ को व्यक्त करता है; ‘न रहेगा’ पूर्ववर्ती दीर्घवृत्त से निहित विनाश के भाव को स्पष्ट करता है।
theological_decisions:
- issue: न्याय-वाणी में अधूरे और दुर्बोध पदबंधों का निर्वाह
  choice: पंक्ति को इस अर्थ में प्रस्तुत किया गया है कि हिंसा दुष्टता की छड़ी बन गई है और लोगों, उनकी भीड़, उनकी बहुतायत तथा उनके प्रतिष्ठित जनों में से कोई नहीं बचेगा।
  alternative: 'नकारात्मक पदबंधों को अधिक शाब्दिक किंतु अस्पष्ट रूप में रखा जा सकता है: ‘न उनमें से, न उनकी भीड़ में से, न उनकी बहुतायत में से; और उनमें कोई प्रतिष्ठा नहीं।’'
  rationale: अध्याय का संदर्भ सर्वग्रासी न्याय का है, पर इब्रानी स्वयं दीर्घवृत्तात्मक और अंतिम शब्दों में अनिश्चित है। मुख्य पाठ में न्यूनतम पूर्ति की गई है और वास्तविक शब्दगत अनिश्चितता टिप्पणियों में सुरक्षित रखी गई है।
translation_notes:
  register: आधुनिक मानक हिंदी, गंभीर भविष्यद्वाणी-संबंधी शैली। कठिन इब्रानी को अत्यधिक सपाट किए बिना वाक्य को सामान्य पाठक के लिए सुबोध बनाया गया है; ‘बहुतायत’ और ‘प्रतिष्ठित’ की अनिश्चितता फुटनोटों में स्पष्ट है।
