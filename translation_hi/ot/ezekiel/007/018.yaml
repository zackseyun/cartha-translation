  yaml_path: translation/ot/ezekiel/007/018.yaml
  text: They will put on sackcloth, and horror will cover them; shame will be on every face, and baldness on all their heads.
translation:
  language: hi
  text: वे टाट पहनेंगे, और दहशत उन्हें ढक लेगी; हर चेहरे पर लज्जा होगी और उनके हर सिर पर गंजापन होगा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְחָגְרוּ שַׂקִּים
  choice: वे टाट ओढ़ेंगे
  rationale: חגר का मूल अर्थ कमर में बाँधना है, पर टाट के शोक-वस्त्र पहनने के लिए आधुनिक हिन्दी में “टाट ओढ़ेंगे” स्वाभाविक और स्पष्ट है।
- source_word: פַּלָּצוּת
  choice: दहशत
  rationale: यह दुर्लभ संज्ञा तीव्र भय या आतंक का बोध कराती है; “दहशत” प्रसंग की प्रबलता बनाए रखती है।
- source_word: בּוּשָׁה
  choice: लज्जा
  rationale: यह सार्वजनिक अपमान और शर्म की दशा व्यक्त करता है; “लज्जा” dignified modern Hindi है।
- source_word: קָרְחָה
  choice: गंजे
  rationale: सिर के बाल हटने या मुंडे होने की शोक-संबंधी अवस्था को सरल हिन्दी में व्यक्त करता है, बिना कारण को मूल से अधिक स्पष्ट किए।
theological_decisions:
- issue: सिरों पर गंजापन शोक की रीति है या दैवी दंड का परिणाम
  choice: कारण बताए बिना केवल अवस्था का वर्णन
  alternative: वे शोक में अपने सिर मुंडाएँगे
  rationale: मूल पाठ केवल “उनके सभी सिरों पर गंजापन” कहता है; वह स्पष्ट रूप से यह नहीं बताता कि उन्होंने स्वयं सिर मुंडाए या बाल किसी अन्य कारण से गए।
