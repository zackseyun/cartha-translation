  text: All hands will grow weak[a], and all knees will run with water.
translation:
  language: hi
  text: सब हाथ ढीले पड़ जाएँगे, और सब घुटनों से पानी बहेगा।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में अभिव्यक्ति असामान्य रूप से, “सब घुटने पानी के साथ चलेंगे,” है। यह संभवतः आतंक से घुटनों के जवाब देने का मुहावरा है और इसमें शरीर पर नियंत्रण खो देने का संकेत भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל הַיָּדַיִם
  choice: सब हाथ
  rationale: दोनों शब्दों के सामान्य अर्थ और सामूहिक व्यापकता को बनाए रखता है; शरीर-अंग की मूल छवि को ‘भुजाएँ’ कहकर नहीं बदलता।
- source_word: תִּרְפֶּינָה
  choice: ढीले पड़ जाएँगे
  rationale: रפה यहाँ शक्ति चुकने और अंगों के शिथिल हो जाने का भाव देता है; यह हिन्दी में स्वाभाविक और चित्रात्मक है।
- source_word: וְכָל בִּרְכַּיִם
  choice: और सब घुटनों से
  rationale: ‘घुटनों’ का प्रत्यक्ष शारीरिक बिंब सुरक्षित रखा गया है। उत्तरपद ‘से’ अगले पद के पानी बहने की स्वाभाविक हिन्दी रचना बनाता है।
- source_word: תֵּלַכְנָה מָּיִם
  choice: पानी बहने लगेगा
  rationale: इब्रानी में क्रिया का मूल अर्थ ‘जाना/चलना’ है, पर ‘पानी’ के साथ यहाँ तरल के बहने का बिंब है। हिन्दी में ‘पानी बहने लगेगा’ मूल अभिव्यक्ति की असामान्यता और भयजनित शारीरिक प्रतिक्रिया की संभावना दोनों को खुला रखता है।
theological_decisions:
- issue: घुटनों से पानी बहने का आशय
  choice: मुख्य पाठ में शाब्दिक और अस्पष्ट बिंब बनाए रखा गया
  alternative: इसे सीधे ‘घुटने भय से जवाब दे जाएँगे’ या ‘पेशाब निकल जाएगा’ कहना
  rationale: मूल इब्रानी केवल ‘पानी’ कहता है। यह आतंक से घुटने जवाब देने अथवा शरीर पर नियंत्रण खोने की ओर संकेत कर सकता है, पर किसी एक अर्थ को निश्चित करना उचित नहीं।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी। ‘ढीले पड़ जाएँगे’ भय से शक्ति चुकने का स्वाभाविक भाव देता है। मुख्य पाठ मूल के तीखे और कुछ अस्पष्ट शारीरिक बिंब को बनाए रखता है; संभावित मुहावरेदार अर्थ पादटिप्पणी में दिया गया है।
