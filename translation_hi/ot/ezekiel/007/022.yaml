base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/007/022.yaml
  text: I will turn my face away from them[a], and they will profane my treasured place[b]; violent men will enter it and profane it.
translation:
  language: hi
  text: मैं अपना मुख उनसे फेर लूँगा, और वे मेरे बहुमूल्य स्थान[a] को अपवित्र करेंगे; हिंसक लोग[b] उसमें प्रवेश करेंगे और उसे अपवित्र करेंगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘मेरे धन’, ‘मेरे गुप्त स्थान’ अथवा ‘मेरी बहुमूल्य वस्तु’। इब्रानी शब्द सम्भवतः किसी बहुमूल्य और सुरक्षित वस्तु या स्थान को सूचित करता है, जिसका सम्बन्ध शायद पवित्र स्थान से है।
    reason: lexical_alternative
  - marker: b
    text: या ‘निर्दयी लोग’ अथवा ‘लुटेरे’।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַהֲסִבּוֹתִי
  choice: मैं ... फेर लूँगा
  rationale: हिफ़ील रूप को भविष्यकालीन भविष्यद्वाणी के प्रसंग में लिया गया है; ‘फेर लूँगा’ जानबूझकर ध्यान और अनुग्रह हटा लेने का भाव स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: פָנַי מֵהֶם
  choice: अपना मुख उनसे
  rationale: ‘मुख’ मूल इब्रानी बिंब को बनाए रखता है, जबकि ‘उनसे फेरना’ आधुनिक हिन्दी में सम्बन्धपरक विमुखता को स्पष्ट करता है।
- source_word: וְחִלְּלוּ / וְחִלְּלוּהָ
  choice: अपवित्र करेंगे / उसे अपवित्र करेंगे
  rationale: חלל के पिएल रूप में पवित्र वस्तु या स्थान की पवित्रता भंग करने का अर्थ है। दोनों occurrences में एक ही क्रिया रखकर मूल की पुनरावृत्ति सुरक्षित की गई है।
- source_word: צְפוּנִי
  choice: मेरे बहुमूल्य स्थान
  rationale: यह शब्द छिपाकर रखी, सुरक्षित या बहुमूल्य वस्तु/स्थान का संकेत दे सकता है। प्रसंग पवित्रस्थान में घुसकर उसे अपवित्र करने का है, इसलिए ‘बहुमूल्य स्थान’ सम्भावित स्थानवाचक अर्थ देता है, पर किसी विशेष पवित्र भवन को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: וּבָאוּ בָהּ
  choice: उसमें घुस आएँगे
  rationale: सिर्फ आने के बजाय किसी सुरक्षित पवित्र स्थान में अनधिकृत प्रवेश का प्रसंग ‘घुस आएँगे’ से स्वाभाविक और स्पष्ट होता है।
- source_word: פָּרִיצִים
  choice: हिंसक लोग
  rationale: यह शब्द हिंसक, निर्दयी या लुटेरे लोगों को सूचित कर सकता है। ‘हिंसक लोग’ अर्थ को केवल चोरी तक सीमित नहीं करता।
theological_decisions:
- issue: צְפוּנִי और स्त्रीलिंग प्रत्ययों का सन्दर्भ
  choice: इसे पवित्रस्थान से सम्बद्ध एक बहुमूल्य और सुरक्षित स्थान मानते हुए ‘मेरे बहुमूल्य स्थान’ और आगे ‘उसमें/उसे’ कहा गया है।
  alternative: ‘मेरा धन’, ‘मेरा गुप्त स्थान’, या ‘मेरी बहुमूल्य वस्तु’
  rationale: इब्रानी पद संक्षिप्त और अर्थ की दृष्टि से अस्पष्ट है। घुसने और अपवित्र करने का निकट प्रसंग स्थानवाचक अर्थ के पक्ष में है, फिर भी पादटिप्पणी वस्तु या धन सम्बन्धी सम्भावनाओं को सुरक्षित रखती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘मुख फेरना’ और ‘अपवित्र करना’ जैसे बाइबलीय किन्तु प्रचलित पद मूल के बिंब तथा पवित्रता-विरोध को बनाए रखते हैं। पादटिप्पणी-चिह्न उन शब्दों के ठीक बाद रखे गए हैं जिनसे वे सम्बन्धित हैं।
