source:
  edition: WLC
  text: הֹוָ֤ה עַל הֹוָה֙ תָּב֔וֹא וּ/שְׁמֻעָ֥ה אֶל שְׁמוּעָ֖ה תִּֽהְיֶ֑ה וּ/בִקְשׁ֤וּ חָזוֹן֙ מִ/נָּבִ֔יא וְ/תוֹרָה֙ תֹּאבַ֣ד מִ/כֹּהֵ֔ן וְ/עֵצָ֖ה מִ/זְּקֵנִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/007/026.yaml
  text: Disaster upon disaster will come[a], and rumor upon rumor will arise. They will seek a vision from a prophet, but instruction will perish from the priest[b], and counsel from the elders.
translation:
  language: hi
  text: विपत्ति पर विपत्ति आएगी, और खबर पर खबर होगी[a]। वे नबी से दर्शन प्राप्त करने की कोशिश करेंगे, पर याजक की शिक्षा लुप्त हो जाएगी[b], और बुज़ुर्गों का परामर्श भी लुप्त हो जाएगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘अफवाह पर अफवाह।’ इब्रानी शब्द का अर्थ ‘खबर,’ ‘समाचार’ या ‘अफवाह’ हो सकता है; यहाँ संभवतः लोगों के बीच फैलती हुई संकट की लगातार सूचनाएँ अभिप्रेत हैं।
    reason: lexical_alternative
  - marker: b
    text: या ‘व्यवस्था लुप्त हो जाएगी।’ इब्रानी तोराह का अर्थ ‘शिक्षा,’ ‘उपदेश’ या ‘व्यवस्था’ हो सकता है; यहाँ संदर्भ याजक द्वारा दी जाने वाली शिक्षा का है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הֹוָה
  choice: विपत्ति
  rationale: यह शब्द न्याय के प्रसंग में विनाशकारी आपदा या बरबादी को दर्शाता है। ‘विपत्ति पर विपत्ति’ मूल की पुनरावृत्ति और लगातार टूट पड़ने का भाव बनाए रखता है।
- source_word: שְׁמֻעָה / שְׁמוּעָה
  choice: खबर
  rationale: यह शब्द सुनी हुई सूचना, समाचार या अफवाह को सूचित कर सकता है। ‘खबर’ हिंदी में इस अर्थ-विस्तार को अपेक्षाकृत खुला रखती है और संकट की लगातार आती सूचनाओं के प्रसंग में स्वाभाविक है।
- source_word: חָזוֹן
  choice: दर्शन
  rationale: भविष्यद्वाणी के प्रसंग में यह परमेश्वर से मिलने वाले प्रकाशनात्मक दर्शन को दर्शाता है। ‘दर्शन’ स्थापित और सीधा हिंदी प्रतिशब्द है।
- source_word: נָבִיא
  choice: नबी
  rationale: हिंदी बाइबल की परिचित शब्दावली में यह भविष्यद्वक्ता के पद को स्वाभाविक रूप से व्यक्त करता है। मूल में निश्चित उपपद न होने के कारण ‘नबी’ को किसी एक ज्ञात व्यक्ति तक सीमित नहीं किया गया।
- source_word: תּוֹרָה
  choice: शिक्षा
  rationale: यहाँ यह याजक द्वारा दी जाने वाली आधिकारिक शिक्षा या निर्देश को सूचित करती है, केवल किसी लिखित विधि-संग्रह को नहीं। ‘शिक्षा’ इस संदर्भगत भूमिका को स्पष्ट रखती है।
- source_word: תֹּאבַד
  choice: लुप्त हो जाएगी
  rationale: मूल क्रिया के नष्ट हो जाने, खो जाने या उपलब्ध न रहने के गंभीर भाव को यह वर्तमान हिंदी में स्वाभाविक ढंग से व्यक्त करता है।
- source_word: עֵצָה
  choice: सलाह
  rationale: यह बुज़ुर्गों से मिलने वाले विवेकपूर्ण परामर्श को दर्शाता है। ‘सलाह’ साधारण पाठक के लिए स्पष्ट और स्वाभाविक है।
- source_word: זְקֵנִים
  choice: पुरनिये
  rationale: यह केवल अधिक आयु वाले लोगों के बजाय समुदाय के मान्य बुज़ुर्ग अगुओं को दर्शाता है। ‘पुरनिये’ हिंदी बाइबलीय संदर्भ में इस संस्थागत भूमिका को व्यक्त करता है।
theological_decisions:
- issue: याजकीय संदर्भ में תּוֹרָה का अर्थ
  choice: शिक्षा
  alternative: व्यवस्था या उपदेश
  rationale: पद में मार्गदर्शन के तीन मान्य स्रोत—नबी, याजक और पुरनिये—विफल होते दिखाए गए हैं। इसलिए यहाँ याजक से मिलने वाली शिक्षा अभिप्रेत है; ‘व्यवस्था’ भी संभव है, पर वह अर्थ को अनावश्यक रूप से केवल संहिताबद्ध कानून तक सीमित कर सकती है।
- issue: नबी और याजक के एकवचन रूपों का संस्थागत बल
  choice: नबी से ... याजक से
  alternative: उस नबी से ... उस याजक से
  rationale: मूल में ये पद एकवचन हैं, पर संदर्भ किसी विशिष्ट ज्ञात नबी या याजक की पहचान नहीं कराता। अनिश्चित/जातिवाचक हिंदी रूप नेतृत्व के सामान्य माध्यमों के ढहने का भाव सुरक्षित रखते हैं।
- issue: अंतिम खंड में क्रिया का लोप
  choice: ‘लुप्त हो जाएगी’ का भाव सलाह पर भी लागू करते हुए ‘भी’ जोड़ा गया
  alternative: ‘और पुरनियों से सलाह’ जैसा शब्दशः अपूर्ण खंड
  rationale: इब्रानी में अंतिम खंड पहली क्रिया पर निर्भर है। हिंदी में ‘भी’ जोड़ने से वही समानांतर अर्थ स्वाभाविक और स्पष्ट होता है, बिना कोई नया धर्मवैज्ञानिक दावा जोड़े।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य हिंदी पाठक के लिए सुबोध रखी गई है। ‘विपत्ति पर विपत्ति’ और ‘खबर पर खबर’ की समानांतर पुनरावृत्ति मूल की तीव्रता बनाए रखती है। ‘से मिलने वाली’ जोड़कर नबी, याजक और पुरनियों को मार्गदर्शन के स्रोत के रूप में स्वाभाविक हिंदी में स्पष्ट किया गया है।
