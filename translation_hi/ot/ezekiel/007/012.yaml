source:
  edition: WLC
  text: בָּ֤א הָ/עֵת֙ הִגִּ֣יעַ הַ/יּ֔וֹם הַ/קּוֹנֶה֙ אַל יִשְׂמָ֔ח וְ/הַ/מּוֹכֵ֖ר אַל יִתְאַבָּ֑ל כִּ֥י חָר֖וֹן אֶל כָּל הֲמוֹנָֽ/הּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/007/012.yaml
  text: The time has come[a]; the day has arrived. Let not the buyer rejoice, and let not the seller mourn[b], for wrath is against all her multitude.
translation:
  language: hi
  text: समय आ गया है; वह दिन आ पहुँचा है। खरीदनेवाला आनन्द न मनाए, और बेचनेवाला शोक न करे, क्योंकि उसके समस्त जनसमूह[a] पर कोप है।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसकी सारी धन-सम्पत्ति।” हिब्रू शब्द का अर्थ संदर्भ के अनुसार जनसमूह अथवा बहुतायत/सम्पत्ति हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: हिब्रू में “उसके” के लिए स्त्रीलिंग प्रत्यय है, जो सम्भवतः न्यायाधीन नगरी, भूमि या समुदाय के मानवीकरण की ओर संकेत करता है। पूर्वपद निश्चित नहीं है।
    reason: cultural_note
lexical_decisions:
- source_word: בָּא הָעֵת
  choice: समय आ गया है
  rationale: पूर्ण क्रिया निर्णायक समय के आ पहुँचने की घोषणा करती है; यह हिन्दी में स्वाभाविक और स्रोतनिष्ठ है।
- source_word: הִגִּיעַ הַיּוֹם
  choice: वह दिन आ पहुँचा है
  rationale: पहले खंड के समानांतर बल को बनाए रखते हुए הִגִּיעַ के ‘पहुँचने’ के भाव को व्यक्त करता है।
- source_word: הַקּוֹנֶה ... הַמּוֹכֵר
  choice: खरीदनेवाला ... बेचनेवाला
  rationale: संज्ञा के रूप में प्रयुक्त कृदंतों का सहज, सामान्य और परस्पर समानांतर हिन्दी रूप।
- source_word: אַל יִשְׂמָח ... אַל יִתְאַבָּל
  choice: आनन्द न मनाए ... शोक न करे
  rationale: אַל के निषेधात्मक आदेश/कामनार्थक भाव को गरिमापूर्ण आधुनिक हिन्दी में सुरक्षित रखता है।
- source_word: חָרוֹן
  choice: प्रकोप
  rationale: यह तीव्र, दहकते क्रोध और न्याय के भाव को संक्षिप्त तथा गरिमापूर्ण ढंग से व्यक्त करता है।
- source_word: הֲמוֹנָהּ
  choice: उसके सारे जनसमूह
  rationale: הָמוֹן का सामूहिक जनसमुदाय वाला अर्थ संदर्भ में उपयुक्त है; स्त्रीलिंग प्रत्यय के अनिश्चित पूर्वपद को हिन्दी में ‘उसके’ द्वारा बिना स्पष्ट किए रखा गया है।
theological_decisions:
- issue: הֲמוֹנָהּ में स्त्रीलिंग एकवचन प्रत्यय का संदर्भ
  choice: मुख्य पाठ में ‘उसके सारे जनसमूह’ रखकर पूर्वपद को अनिर्धारित रखना
  alternative: उसकी सारी धन-सम्पत्ति
  rationale: हिब्रू में प्रत्यय सम्भवतः न्यायाधीन नगरी, भूमि या समुदाय के स्त्रीलिंग मानवीकरण की ओर संकेत करता है, पर उसका निश्चित पूर्वपद नहीं बताता। हिन्दी में ‘उसके’ इसी अस्पष्टता को बनाए रखता है; ‘जनसमूह’ यहाँ प्राथमिक अर्थ है, जबकि ‘धन-सम्पत्ति’ सम्भव किंतु कम निश्चित विकल्प है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज किंतु गरिमापूर्ण भविष्यद्वाणी-संबंधी भाव रखा गया है। ‘खरीदनेवाला/बेचनेवाला’ सामान्य पाठक के लिए स्पष्ट हैं; समानांतर वाक्य-विन्यास और मूल की संदर्भगत अस्पष्टता सुरक्षित रखी गई है।
