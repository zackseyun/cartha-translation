source:
  edition: WLC
  text: וְ/לֹא תָח֥וֹס עֵינִ֖/י וְ/לֹ֣א אֶחְמ֑וֹל כִּ/דְרָכַ֜יִ/ךְ עָלַ֣יִ/ךְ אֶתֵּ֗ן וְ/תוֹעֲבוֹתַ֨יִ/ךְ֙ בְּ/תוֹכֵ֣/ךְ תִּֽהְיֶ֔יןָ וִֽ/ידַעְתֶּ֕ם כִּ֛י אֲנִ֥י יְהוָ֖ה מַכֶּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/007/009.yaml
  text: My eye will not spare[a], nor will I show pity. I will bring your ways upon you, and your abominations will be in your midst. Then you will know that I am Yahweh[c][b], who strikes.
translation:
  language: hi
  text: मेरी आँख तरस नहीं खाएगी[a], और न मैं दया करूँगा। मैं तेरे चालचलन को तुझ पर लाऊँगा[b], और तेरे घृणित काम तेरे बीच में होंगी। तब तुम जानोगे कि मैं याहवे[c] हूँ, जो प्रहार करता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “मेरी आँख नहीं बख्शेगी।” इब्रानी में ‘आँख’ के साथ प्रयुक्त यह मुहावरा तरस खाने या बख्श देने का भाव देता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “मैं तेरे चालचलन को तुझ पर डालूँगा।” इसका अर्थ यह भी हो सकता है, “मैं तेरे चालचलन के अनुसार तुझसे व्यवहार करूँगा।”
    reason: lexical_alternative
  - marker: c
    text: “याहवे” इब्रानी दिव्य नाम יהוה (YHWH) का लिप्यंतरण है।
    reason: cultural_note
lexical_decisions:
- source_word: תָחוֹס עֵינִי
  choice: मेरी आँख तरस नहीं खाएगी
  rationale: यह हिन्दी में ‘आँख’ वाले इब्रानी मुहावरे और दया न दिखाने के भाव, दोनों को स्वाभाविक रूप से बनाए रखता है।
- source_word: אֶחְמוֹל
  choice: न मैं दया करूँगा
  rationale: यह पहले खंड के ‘तरस’ से निकट समानांतरता रखते हुए חמל की करुणा-दया संबंधी छटा को अलग शब्द में व्यक्त करता है।
- source_word: כִדְרָכַיִךְ עָלַיִךְ אֶתֵּן
  choice: मैं तेरे चालचलन का फल तुझ पर लाऊँगा
  rationale: דרך यहाँ आचरण को सूचित करता है। ‘फल’ परिणामार्थक आशय स्पष्ट करता है, जबकि ‘तुझ पर लाऊँगा’ मूल की ठोस प्रतिदानात्मक छवि बनाए रखता है।
- source_word: וְתוֹעֲבוֹתַיִךְ
  choice: तेरे घिनौने काम
  rationale: यह תועבות की प्रबल नैतिक और धार्मिक घृणास्पदता को सामान्य आधुनिक हिन्दी में व्यक्त करता है।
- source_word: בְּתוֹכֵךְ תִּהְיֶיןָ
  choice: तेरे बीच बने रहेंगे
  rationale: यह स्थानवाचक ‘तेरे बीच’ को बनाए रखता है और बताता है कि वे घिनौने काम तथा उनके प्रत्यक्ष प्रभाव उसी समुदाय में उपस्थित रहेंगे।
- source_word: וִידַעְתֶּם
  choice: तब तुम जानोगे
  rationale: ‘तब’ न्याय के परिणामस्वरूप पहचान होने का संबंध स्वाभाविक हिन्दी में स्पष्ट करता है; बहुवचन ‘तुम’ मूल के अचानक आए बहुवचन को सुरक्षित रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: यह परमेश्वर के निजी नाम YHWH का हिन्दी लिप्यंतरण है, शीर्षक से उसका स्थानापन्न नहीं करता।
- source_word: מַכֶּה
  choice: जो प्रहार करता है
  rationale: वर्तमान कृदंत परमेश्वर को न्याय का सक्रिय कर्ता बताता है; यह रूप आधुनिक और गरिमापूर्ण हिन्दी में उस बल को बनाए रखता है।
theological_decisions:
- issue: दिव्य नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में चार अक्षरों वाला निजी दिव्य नाम है। उसका लिप्यंतरण नाम और उपाधि का भेद बनाए रखता है।
- issue: अंतिम न्याय-सूत्र में מַכֶּה का बल
  choice: मैं याहवे हूँ, जो प्रहार करता है
  alternative: मैं याहवे ही प्रहार कर रहा हूँ
  rationale: संबंधवाचक वाक्य कृदंत को पहचान और कार्य, दोनों से जोड़ता है, पर काल या घटना की प्रगतिशीलता को आवश्यकता से अधिक निश्चित नहीं करता।
- issue: एकवचन से बहुवचन संबोधन का परिवर्तन
  choice: पहले ‘तेरे/तुझ’, फिर ‘तुम’
  alternative: सर्वत्र एक ही वचन रखना
  rationale: इब्रानी पाठ स्त्रीलिंग एकवचन संबोधन से וִידַעְתֶּם में बहुवचन पर जाता है। पाठ की यह वास्तविक असमानता चुपचाप समतल नहीं की गई।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण भविष्यसूचक शैली रखी गई है। यरूशलेम/देश को संबोधित स्त्रीलिंग एकवचन ‘तेरे/तुझ’ और अंत में मूल के बहुवचन ‘तुम’ को सुरक्षित रखा गया है। ‘घिनौने काम’ सामान्य पाठक के लिए ‘घृणित वस्तुएँ’ से अधिक सहज है, फिर भी भविष्यसूचक निंदा की तीव्रता बनाए रखता है।
