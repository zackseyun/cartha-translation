  edition: WLC
  text: וּ/פָֽלְטוּ֙ פְּלִ֣יטֵי/הֶ֔ם וְ/הָי֣וּ אֶל הֶ/הָרִ֗ים כְּ/יוֹנֵ֧י הַ/גֵּאָי֛וֹת כֻּלָּ֖/ם הֹמ֑וֹת אִ֖ישׁ בַּ/עֲוֺנֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/007/016.yaml
  text: And their survivors will escape and be on the mountains[a], like doves of the valleys, all of them moaning[c][b], each one in his iniquity.
translation:
  language: hi
  text: उनमें से बचे हुए लोग बच निकलेंगे और पहाड़ों पर होंगे, घाटियों के कबूतरों[a] के समान—सब-के-सब कराहते हुए[b], हर एक अपने अधर्म में[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘खड्डों के कबूतरों’। इब्रानी शब्द घाटियों, वादियों या खड्डों को सूचित कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: या ‘धीमे-धीमे कुहराते हुए’। इब्रानी क्रिया धीमी, गूँजती ध्वनि को व्यक्त करती है, जो यहाँ शोक की कराह और कबूतरों की आवाज़—दोनों की छवि जगा सकती है।
    reason: lexical_alternative
  - marker: c
    text: या ‘हर एक अपने दोष के कारण’ अथवा ‘अपने दंड के कारण’। इब्रानी शब्द अधर्म, दोष, या अधर्म के दंडात्मक परिणाम को सूचित कर सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: וּפָלְטוּ
  choice: बच निकलेंगे
  rationale: פלט संकट से बच निकलने को व्यक्त करता है। यह चुनाव भविष्यसूचक भाव रखता है और भागने के ढंग के बारे में अनावश्यक विवरण नहीं जोड़ता।
- source_word: פְּלִיטֵיהֶם
  choice: उनमें से बचे हुए लोग
  rationale: यह संज्ञा उन लोगों को बताती है जो विनाश से बच गए हैं। हिन्दी में यह स्वाभाविक है और केवल ‘भगोड़ों’ का भाव नहीं देती।
- source_word: וְהָיוּ אֶל־הֶהָרִים
  choice: और पहाड़ों पर होंगे
  rationale: इब्रानी में शाब्दिक भाव ‘पहाड़ों की ओर/पर होंगे’ है। प्रसंग में यह बच निकलने के बाद उनका स्थान बताता है; अनुवाद स्पष्ट गति जोड़ने से बचता है।
- source_word: כְּיוֹנֵי הַגֵּאָיוֹת
  choice: घाटियों के कबूतरों के समान
  rationale: גֵּאָיוֹת घाटियों, वादियों या खड्डों को सूचित कर सकता है। ‘घाटियाँ’ सामान्य पाठक के लिए सुबोध है, जबकि वैकल्पिक स्थलाकृतिक अर्थ पादटिप्पणी में रखा गया है।
- source_word: כֻּלָּם הֹמוֹת
  choice: सब-के-सब कराहते हुए
  rationale: המה धीमी, गूँजती ध्वनि, कुहरने या कराहने का अर्थ दे सकता है। न्याय और शोक के प्रसंग में ‘कराहते हुए’ उपयुक्त है, जबकि कबूतरों की ध्वनि की छवि पादटिप्पणी से सुरक्षित रहती है।
- source_word: אִישׁ
  choice: हर एक
  rationale: אִישׁ यहाँ वितरणात्मक अर्थ में समूह के प्रत्येक व्यक्ति को दर्शाता है; ‘हर एक’ स्वाभाविक हिन्दी है और अर्थ को केवल पुरुषों तक सीमित नहीं करता।
- source_word: בַּעֲוֺנוֹ
  choice: अपने अधर्म में
  rationale: עָוֹן अधर्म, दोष या अधर्म के दंडात्मक परिणाम को सूचित कर सकता है। ‘अपने अधर्म में’ इब्रानी उपसर्ग בְּ के व्यापक भाव और मूल पद की अर्थगत खुलावट को बनाए रखता है।
theological_decisions:
- issue: न्याय के प्रसंग में עָוֹן का अर्थ
  choice: मुख्य पाठ में ‘अपने अधर्म में’, जिससे पाप और उससे जुड़े दोष का भाव खुला रहता है
  alternative: ‘अपने दोष के कारण’ या ‘अपने दंड के कारण’
  rationale: इब्रानी शब्द नैतिक अधर्म, उससे उत्पन्न दोष, अथवा उसके दंडात्मक परिणाम को बता सकता है। किसी एक अर्थ को निर्णायक बनाना मूल पाठ की वास्तविक धर्मवैचारिक तनावशीलता को मिटा देता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। वाक्य-विन्यास हिन्दी की स्वाभाविकता के लिए दो वाक्यों में बाँटा गया है, पर मूल चित्रों और वितरणात्मक ‘हर एक’ को बनाए रखा गया है।
