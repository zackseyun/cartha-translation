  text: כִּ֣י הַ/מּוֹכֵ֗ר אֶל הַ/מִּמְכָּר֙ לֹ֣א יָשׁ֔וּב וְ/ע֥וֹד בַּ/חַיִּ֖ים חַיָּתָ֑/ם כִּֽי חָז֤וֹן אֶל כָּל הֲמוֹנָ/הּ֙ לֹ֣א יָשׁ֔וּב וְ/אִ֧ישׁ בַּ/עֲוֺנ֛/וֹ חַיָּת֖/וֹ לֹ֥א יִתְחַזָּֽקוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/007/013.yaml
  text: For the seller will not return to what was sold[a], though they are still alive; for the vision concerning all its multitude will not turn back[e][d][c][b], and no one will strengthen his life in his iniquity.
translation:
  language: hi
  text: क्योंकि बेचनेवाला बेची हुई वस्तु को फिर नहीं पाएगा[a], चाहे वे अभी जीवित ही क्यों न हों[b]; क्योंकि उसके सारे जनसमूह के विषय में दर्शन[c] टलेगा नहीं[d], और कोई भी अपने अधर्म में रहते हुए अपना जीवन सुरक्षित नहीं कर पाएगा[e]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “बिक्री को”; आशय बेची गई वस्तु या सम्पत्ति से हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में शाब्दिक रूप से, “जब उनका जीवन अभी जीवितों में है।” यह संक्षिप्त अभिव्यक्ति बताती है कि सम्बन्धित लोग जीवित रहें, तब भी बेचनेवाला बेची हुई वस्तु फिर नहीं पाएगा।
    reason: lexical_alternative
  - marker: c
    text: या, “उसके सारे जनसमूह के विरुद्ध दर्शन।” पूर्वसर्ग न्याय के अधीन पूरे जनसमूह की ओर दिशा भी सूचित कर सकता है।
    reason: alternative_reading
  - marker: d
    text: या, “वापस नहीं लिया जाएगा।” आशय यह है कि घोषित न्याय रद्द या पलटा नहीं जाएगा।
    reason: alternative_reading
  - marker: e
    text: अन्तिम उपवाक्य का इब्रानी पाठ कठिन है। सम्भवतः आशय है कि कोई भी अपने अधर्म में रहते हुए अपना जीवन सुरक्षित नहीं कर सकेगा। इसे “अपने अधर्म के द्वारा” भी समझा जा सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: הַמּוֹכֵר
  choice: बेचनेवाला
  rationale: यह कर्तृवाचक कृदन्त संज्ञा के रूप में प्रयुक्त है। ‘बेचनेवाला’ व्यापारिक बिंब को बनाए रखते हुए आधुनिक हिन्दी में सहज है।
- source_word: אֶל הַמִּמְכָּר
  choice: उस वस्तु के पास जो बेची गई है
  rationale: मूल पद का अर्थ ‘बिक्री’ अथवा ‘बेची हुई वस्तु/सम्पत्ति’ हो सकता है। यह चयन बेची हुई चीज़ की ओर लौटने का ठोस भाव रखता है, पर उसे विशेष रूप से भूमि नहीं बताता।
- source_word: וְעוֹד בַּחַיִּים חַיָּתָם
  choice: चाहे वे अभी जीवित ही क्यों न हों
  rationale: इब्रानी अभिव्यक्ति संक्षिप्त और असामान्य है—शाब्दिक रूप से ‘जब उनका जीवन अभी जीवितों में है।’ हिन्दी में यह उसके रियायती भाव को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: חָזוֹן
  choice: दर्शन
  rationale: भविष्यद्वाणी में प्राप्त प्रकाशन के लिए ‘दर्शन’ प्रचलित, गरिमापूर्ण और स्रोत-संगत शब्द है।
- source_word: אֶל כָּל הֲמוֹנָהּ
  choice: उसकी सारी भीड़ के विषय में
  rationale: אֶל यहाँ सम्बन्ध अथवा दिशा सूचित कर सकता है। ‘के विषय में’ शत्रुतापूर्ण अर्थ को अनावश्यक रूप से पक्का किए बिना दर्शन के सन्दर्भ को व्यक्त करता है।
- source_word: לֹא יָשׁוּב
  choice: नहीं टलेगा
  rationale: दर्शन के विषय में שוב का आशय घोषित न्याय के वापस न होने या न टलने से है। हिन्दी में ‘नहीं टलेगा’ इस प्रसंगगत अर्थ को स्पष्ट रखता है।
- source_word: בַּעֲוֺנוֹ חַיָּתוֹ לֹא יִתְחַזָּקוּ
  choice: अपने अधर्म के बल पर अपना जीवन सुरक्षित नहीं कर पाएगा
  rationale: वाक्य-विन्यास कठिन है, पर प्रसंग में सम्भावित अर्थ यह है कि कोई अपने अधर्म के माध्यम से अपना जीवन बचा या सुरक्षित नहीं कर सकेगा। ‘के बल पर’ साधन के भाव को और ‘सुरक्षित’ जीवन को दृढ़ करने के रूपक का स्वाभाविक हिन्दी अर्थ व्यक्त करता है।
theological_decisions:
- issue: अधर्म और जीवन से सम्बन्धित अन्तिम उपवाक्य का अर्थ
  choice: कोई व्यक्ति अपने अधर्म के बल पर अपना जीवन सुरक्षित नहीं कर पाएगा।
  alternative: कोई अपने अधर्म में रहते हुए अपने जीवन को दृढ़ नहीं करेगा; अथवा वे अपने अधर्म में अपना जीवन दृढ़ नहीं कर पाएँगे।
  rationale: इब्रानी में एकवचन ‘कोई व्यक्ति’ के बाद बहुवचन क्रिया आने से वाक्य-विन्यास कठिन है। चुना हुआ पाठ प्रसंग के अनुरूप बताता है कि पापपूर्ण उपाय घोषित न्याय से जीवन को सुरक्षित नहीं कर सकते, पर किसी बाद की सिद्धान्तगत श्रेणी को इसमें नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, सामान्य पाठक के लिए सहज किन्तु भविष्यद्वाणी के अनुरूप गरिमापूर्ण रखी गई है। व्यापारिक बिंब को ‘बेचनेवाला’ और ‘बेची गई वस्तु’ से बनाए रखा गया है। कठिन इब्रानी वाक्य-विन्यास को मुख्य पाठ में पठनीय बनाया गया है, जबकि वास्तविक वैकल्पिक अर्थ पादटिप्पणियों में सुरक्षित हैं।
