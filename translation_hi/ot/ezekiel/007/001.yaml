base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/007/001.yaml
  text: And the word of Yahweh came to me[a], saying,
translation:
  language: hi
  text: 'फिर यहोवा[a] का वचन मेरे पास पहुँचा:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी YHWH, जिसका पारंपरिक अनुवाद ‘यहोवा’ किया जाता है; वैकल्पिक रूप से, ‘याहवे।’
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְהִי
  choice: फिर ... पहुँचा
  rationale: वाव-क्रमागत रूप यहाँ एक नई भविष्यवाणी इकाई आरम्भ करता है। आधुनिक हिन्दी में इसे मुख्य वाक्य के साथ जोड़कर कहना स्वाभाविक है।
- source_word: דְבַר
  choice: वचन
  rationale: भविष्यवाणी के प्रचलित सूत्र דְבַר־יְהוָה में 'वचन' मूल शब्द से औपचारिक संबंध बनाए रखता है और हिन्दी बाइबलीय भाषा में सहज है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: यह परमेश्वर के व्यक्तिगत नाम YHWH का हिन्दी में प्रचलित लिप्यंतरण है; इससे मूल में प्रयुक्त नाम किसी उपाधि से प्रतिस्थापित नहीं होता।
- source_word: אֵלַי
  choice: मेरे पास
  rationale: इस प्रकाशना-सूत्र में हिन्दी का स्वाभाविक प्रयोग 'मेरे पास पहुँचा' है, जिसका अर्थ मूल के 'मेरी ओर/मुझ तक' के अनुरूप है।
- source_word: לֵאמֹר
  choice: उसने कहा,
  rationale: यह आगामी कथन का परिचय देता है। हिन्दी में 'उसने कहा' मूल की उक्तिपरक भूमिका को स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
theological_decisions:
- issue: परमेश्वर के नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: मूल पाठ में चार अक्षरों वाला व्यक्तिगत नाम सीधे आया है। 'यहोवा' आधुनिक हिन्दी पाठकों में इसका सर्वाधिक परिचित नाम-रूप है और इसे उपाधि 'प्रभु' में नहीं बदलता; 'याहवे' अधिक संभावित प्राचीन उच्चारण का वैकल्पिक लिप्यंतरण है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। 'वचन' से भविष्यवाणी-सूत्र की पारंपरिक पहचान बनी रहती है, जबकि 'मेरे पास पहुँचा' और 'उसने कहा' स्वाभाविक हिन्दी प्रवाह देते हैं।
