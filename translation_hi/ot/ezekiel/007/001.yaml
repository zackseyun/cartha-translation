    text: इब्रानी YHWH, जिसका पारंपरिक अनुवाद ‘यहोवा’ किया जाता है; वैकल्पिक रूप से, ‘याहवे।’
    reason: alternative_reading
  revision_rationale: The revision removes the added finite clause ‘उसने कहा’ and uses a colon to carry the Hebrew speech-introduction function into the following verse. It retains the natural Hindi prophetic formula and provides a correctly placed note for the divine name.
