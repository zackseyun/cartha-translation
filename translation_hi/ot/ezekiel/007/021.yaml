source:
  edition: WLC
  text: וּ/נְתַתִּ֤י/ו בְּ/יַֽד הַ/זָּרִים֙ לָ/בַ֔ז וּ/לְ/רִשְׁעֵ֥י הָ/אָ֖רֶץ לְ/שָׁלָ֑ל ו/חלל/ה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/007/021.yaml
  text: And I will give it into the hand of foreigners for plunder[a], and to the wicked of the earth for spoil[b], and they will profane it.
translation:
  language: hi
  text: मैं उसे परदेशियों के हाथ में लूट के लिए, और धरती[a] के दुष्टों को लूट का माल बनने के लिए दे दूँगा; और वे उसे अपवित्र करेंगे।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘धरती’ के स्थान पर ‘देश’ भी सम्भव है। इब्रानी शब्द का अर्थ संदर्भ के अनुसार ‘धरती’ या ‘देश’ हो सकता है।
    reason: alternative_reading
  - marker: b
    text: ‘अपवित्र करेंगे’ का अर्थ यहाँ ‘उसकी पवित्रता भंग करेंगे’, ‘अपमानित करेंगे’, या ‘अपवित्र ठहराएँगे’ भी हो सकता है। क्रिया में किसी पवित्र वस्तु को अपवित्र करने का भाव है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וּנְתַתִּיו
  choice: मैं उसे...दे दूँगा
  rationale: नबी की घोषणा में נתן का सीधा भाव रखा गया है। प्रत्यय के अनिर्दिष्ट संदर्भ को हिन्दी में ‘उसे’ से बनाए रखा गया है।
- source_word: בְּיַד
  choice: के हाथ में
  rationale: यह किसी के अधिकार में सौंपे जाने का इब्रानी मुहावरा है; हिन्दी में ‘हाथ में’ स्वाभाविक भी है और मूल बिंब को सुरक्षित रखता है।
- source_word: הַזָּרִים
  choice: परदेशियों
  rationale: संदर्भ में यह अनजान व्यक्तियों के बजाय बाहरी या विदेशी आक्रमणकारियों को सूचित करता है।
- source_word: לָבַז
  choice: लूट के लिए
  rationale: בַּז बलपूर्वक छीनी गई संपत्ति है। यह अनुवाद प्रयोजन अथवा परिणाम बताने वाले לְ को भी व्यक्त करता है।
- source_word: וּלְרִשְׁעֵי הָאָרֶץ
  choice: और धरती के दुष्ट लोगों को
  rationale: רְשָׁעִים का अर्थ दुष्ट जन है। הָאָרֶץ की व्यापक सम्भावना ‘धरती’ मुख्य पाठ में रखी गई है, जबकि ‘देश’ को पादटिप्पणी में सुरक्षित किया गया है।
- source_word: לְשָׁלָל
  choice: लूट के माल के रूप में
  rationale: שָׁלָל, בַּז का निकट-समानार्थी है। ‘लूट का माल’ समानांतरता बनाए रखते हुए अर्थ को स्वाभाविक हिन्दी में स्पष्ट करता है।
- source_word: וְחִלְּלוּהָ
  choice: वे उसे अपवित्र करेंगे
  rationale: पिएल रूप में חלל पवित्र वस्तु को साधारण ठहराने, उसकी पवित्रता भंग करने या उसका अपमान करने का भाव रखता है। ‘अपवित्र करेंगे’ यह धार्मिक भार संक्षेप में बनाए रखता है।
theological_decisions:
- issue: पवित्रता के संदर्भ में חלל का अनुवाद
  choice: अपवित्र करेंगे
  alternative: उसकी पवित्रता भंग करेंगे
  rationale: यहेजकेल में पवित्र और अपवित्र का विरोध महत्त्वपूर्ण है। ‘अपवित्र’ केवल गंदा करने के बजाय पवित्र वस्तु के अनादर का धार्मिक भाव बनाए रखता है।
- issue: הָאָרֶץ का भौगोलिक विस्तार
  choice: धरती
  alternative: देश
  rationale: इब्रानी शब्द का अर्थ ‘धरती’ या किसी विशेष ‘देश’ दोनों हो सकता है। मुख्य पाठ व्यापक अर्थ रखता है और संकीर्ण सम्भावना पादटिप्पणी में दी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज वाक्य-विन्यास रखा गया है। בַּז और שָׁלָל की समानांतरता को ‘लूट’ तथा ‘लूट का माल’ से व्यक्त किया गया है। दोनों पादटिप्पणी-चिह्न सम्बद्ध पदों के बाद अलग-अलग होने चाहिए; प्रकाशन-पाठ में [a] ‘धरती’ के बाद और [b] ‘अपवित्र करेंगे’ के बाद लगाया जाए।
