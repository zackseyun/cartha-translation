source:
  edition: WLC
  text: כַּסְפָּ֞/ם בַּ/חוּצ֣וֹת יַשְׁלִ֗יכוּ וּ/זְהָבָ/ם֮ לְ/נִדָּ֣ה יִֽהְיֶה֒ כַּסְפָּ֨/ם וּ/זְהָבָ֜/ם לֹֽא יוּכַ֣ל לְ/הַצִּילָ֗/ם בְּ/יוֹם֙ עֶבְרַ֣ת יְהוָ֔ה נַפְשָׁ/ם֙ לֹ֣א יְשַׂבֵּ֔עוּ וּ/מֵעֵי/הֶ֖ם לֹ֣א יְמַלֵּ֑אוּ כִּֽי מִכְשׁ֥וֹל עֲוֺנָ֖/ם הָיָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/007/019.yaml
  text: They will throw their silver into the streets[a], and their gold will become an unclean thing. Their silver and their gold will not be able to deliver them in the day of Yahweh’s wrath. They will not satisfy their appetite, nor fill their stomachs, for it has become the stumbling block of their iniquity.
translation:
  language: hi
  text: वे अपनी चाँदी गलियों में फेंक देंगे, और उनका सोना अशुद्ध वस्तु हो जाएगा[a]। याहवे के प्रकोप के दिन उनकी चाँदी और उनका सोना उन्हें बचा नहीं सकेंगे; वे उनकी भूख नहीं मिटा सकेंगे और उनके पेट नहीं भर सकेंगे, क्योंकि वह उनके अधर्म के लिए ठोकर का कारण बन गया था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अधिक शाब्दिक रूप में, “उनका सोना अशुद्धता के लिए होगा।” यहाँ प्रयुक्त इब्रानी शब्द मासिक धर्म से जुड़ी अशुद्धता और इसलिए अनुष्ठानिक रूप से घृणित मानी जाने वाली वस्तु का भाव भी जगा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּסְפָּם
  choice: उनकी चाँदी
  rationale: כֶּסֶף का अर्थ चाँदी या धन हो सकता है; सोने के साथ समानांतर प्रयोग होने के कारण यहाँ ठोस धातु ‘चाँदी’ उपयुक्त है।
- source_word: בַּחוּצוֹת יַשְׁלִיכוּ
  choice: गलियों में फेंक देंगे
  rationale: חוּצוֹת नगर की गलियों या खुले सार्वजनिक स्थानों को दर्शाता है, और שלך बलपूर्वक त्याग देने का भाव रखता है।
- source_word: לְנִדָּה יִהְיֶה
  choice: अशुद्ध वस्तु बन जाएगा
  rationale: נִדָּה विधिक अशुद्धता, विशेषतः मासिक धर्म से जुड़ी अशुद्धता, को सूचित कर सकता है; यहाँ रूपकतः घृणित और अशुद्ध मानी जाने वाली वस्तु का भाव है।
- source_word: לֹא יוּכַל לְהַצִּילָם
  choice: उन्हें बचा नहीं सकेंगे
  rationale: נצל का यहाँ अर्थ आसन्न दण्ड से छुड़ाना या बचाना है; संयुक्त कर्ता के साथ इब्रानी एकवचन क्रिया को स्वाभाविक हिन्दी में बहुवचन किया गया है।
- source_word: בְּיוֹם עֶבְרַת יְהוָה
  choice: याहवे के प्रकोप के दिन
  rationale: עֶבְרָה तीव्र क्रोध या प्रकोप को दर्शाता है, और יְהוָה को उसके व्यक्तिगत नाम ‘याहवे’ से प्रस्तुत किया गया है।
- source_word: נַפְשָׁם לֹא יְשַׂבֵּעוּ
  choice: वे न अपनी भूख मिटा सकेंगे
  rationale: भोजन और पेट भरने के समानांतर संदर्भ में נֶפֶשׁ व्यक्ति की भूख या लालसा को दर्शाता है; यह हिन्दी अभिव्यक्ति उस संदर्भगत अर्थ को स्वाभाविक रूप से संप्रेषित करती है।
- source_word: וּמֵעֵיהֶם לֹא יְמַלֵּאוּ
  choice: न अपना पेट भर सकेंगे
  rationale: מֵעֶה भीतर के अंगों को दर्शाता है, पर भोजन के संदर्भ में ‘पेट’ इसका स्वाभाविक हिन्दी समतुल्य है।
- source_word: מִכְשׁוֹל עֲוֺנָם
  choice: उनके अधर्म की ठोकर
  rationale: מִכְשׁוֹל ठोकर या गिरने का कारण और עָוֹן अधर्म/दोष को दर्शाता है; अनुवाद मूल रूपक और उसकी संक्षिप्तता बनाए रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: प्रभु / यहोवा
  rationale: मूल पाठ में वाचा का व्यक्तिगत ईश्वरीय नाम है; उसे उपाधि से बदलने के बजाय हिन्दी लिप्यंतरण में रखा गया है।
- issue: נִדָּה में मासिक धर्म संबंधी बिंब को मुख्य पाठ में स्पष्ट करना
  choice: अशुद्ध वस्तु
  alternative: मासिक धर्म की अशुद्धता जैसी वस्तु
  rationale: शब्द में विशिष्ट विधिक-मासिक अशुद्धता की अनुगूँज है, पर इस रूपक में व्यापक अशुद्धता और घृणितता प्रमुख है; विशिष्ट अर्थ पादटिप्पणी में सुरक्षित रखा गया है।
- issue: נַפְשָׁם का संदर्भगत अर्थ
  choice: अपनी भूख
  alternative: अपने प्राण / अपनी आत्मा
  rationale: पेट भरने के तत्काल समानांतर से शारीरिक भूख अभिप्रेत है; ‘आत्मा’ कहने से अनावश्यक मानवशास्त्रीय अर्थ आ सकता है।
- issue: अन्तिम एकवचन संकेत ‘वही’ का पूर्वपद
  choice: पूर्वोक्त धन की ओर संकेत करते हुए अस्पष्टता बनाए रखना
  alternative: उनका धन ही उनके अधर्म की ठोकर बन गया था
  rationale: इब्रानी में एकवचन संकेत का सटीक व्याकरणिक पूर्वपद पूर्णतः स्पष्ट नहीं है, यद्यपि सन्दर्भ चाँदी-सोने की ओर इंगित करता है; ‘वही’ मूल की तनावपूर्ण संक्षिप्तता बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। ‘प्रकोप’, ‘अधर्म’ और ‘ठोकर’ भविष्यद्वाणी की न्याय-संबंधी गंभीरता और मूल रूपक को बनाए रखते हैं; अधिक दुर्बोध विधिक विशिष्टता पादटिप्पणी में दी गई है।
