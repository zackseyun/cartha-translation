  text: וְ/אַתָּ֣ה בֶן אָדָ֗ם כֹּה אָמַ֞ר אֲדֹנָ֧/י יְהוִ֛ה לְ/אַדְמַ֥ת יִשְׂרָאֵ֖ל קֵ֑ץ בָּ֣א הַ/קֵּ֔ץ עַל ארבעת כַּנְפ֥וֹת הָ/אָֽרֶץ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/007/002.yaml
  text: 'And you[a], son of man, thus says the Lord GOD to the land of Israel: An end! The end has come upon the four corners of the land.'
translation:
  language: hi
  text: और तू, हे मनुष्य के पुत्र, प्रभु यहोवा इस्राएल की भूमि को यों कहता है—अन्त! भूमि के चारों छोरों पर अन्त आ पहुँचा है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “पृथ्वी के चारों छोरों पर।” इब्रानी मुहावरा किसी देश की सीमाओं अथवा अधिक व्यापक प्रसंग में सारी पृथ्वी को सूचित कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶן אָדָם
  choice: मनुष्य के पुत्र
  rationale: यहेजकेल के लिए प्रयुक्त नियमित सम्बोधन का पारदर्शी और हिन्दी बाइबिलीय रूप; इब्रानी की पुरुषवाचक एकवचन संरचना सुरक्षित रहती है।
- source_word: אֲדֹנָי יְהוִה
  choice: प्रभु यहोवा
  rationale: दोनों पदों को अलग-अलग व्यक्त करता है और יְהוָה को उसके व्यक्तिवाचक वाचा-नाम ‘यहोवा’ से प्रस्तुत करता है।
- source_word: לְאַדְמַת יִשְׂרָאֵל
  choice: इस्राएल की भूमि से
  rationale: לְ यहाँ वाणी के सम्बोधित लक्ष्य को बताता है; ‘से’ हिन्दी में ‘यों कहता है’ के साथ स्वाभाविक है और ‘के विरुद्ध’ जैसी अतिरिक्त व्याख्या नहीं जोड़ता।
- source_word: קֵץ
  choice: अन्त!
  rationale: अकेले प्रयुक्त संज्ञा की आकस्मिक, उद्घोषणात्मक शक्ति बनाए रखता है।
- source_word: בָּא הַקֵּץ
  choice: अन्त आ पहुँचा है
  rationale: पूर्ण क्रिया के निश्चित और आसन्न न्यायसूचक बल को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: אַרְבַּעַת כַּנְפוֹת הָאָרֶץ
  choice: भूमि के चारों छोरों पर
  rationale: כַּנְפוֹת का मुहावरेदार अर्थ ‘छोर’ है; निकटवर्ती ‘इस्राएल की भूमि’ के कारण הָאָרֶץ को यहाँ ‘भूमि’ समझना अधिक स्वाभाविक है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे / प्रभु
  rationale: व्यक्तिवाचक वाचा-नाम को सामान्य उपाधि में विलीन किए बिना हिन्दी में प्रचलित रूप ‘यहोवा’ से प्रस्तुत किया गया है।
- issue: अन्तिम הָאָרֶץ का दायरा
  choice: भूमि
  alternative: पृथ्वी
  rationale: तत्काल प्रसंग इस्राएल की भूमि को सम्बोधित करता है, इसलिए स्थानीय अर्थ प्रमुख है; फिर भी व्यापक अर्थ की वास्तविक सम्भावना पादटिप्पणी में रखी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमामय भविष्यद्वाणी शैली रखी गई है। ‘तू’ मूल इब्रानी के एकवचन सम्बोधन को स्पष्ट करता है; विस्मयादिबोधक ‘अन्त!’ मूल की तीव्रता और पुनरुक्ति सुरक्षित रखता है।
