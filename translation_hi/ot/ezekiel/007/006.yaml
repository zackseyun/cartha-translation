translation:
  language: hi
  text: अंत आ गया है; अंत आ गया है। वह तेरे विरुद्ध जाग उठा है; देख, वह आ रही है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: קֵץ / הַקֵּץ
  choice: अंत
  rationale: यह सामान्य और सीधा हिन्दी शब्द है, जो पद में दोहराए गए हिब्रू शब्द का समान रूप से अनुवाद करता है।
- source_word: הֵקִיץ
  choice: जाग उठा है
  rationale: हिब्रू क्रिया का मूल अर्थ ‘जागना/जाग उठना’ है। इसे बनाए रखने से मूल का सजीव मानवीकरण और קֵץ के साथ ध्वन्यात्मक शब्द-क्रीड़ा की कुछ प्रतिध्वनि बचती है।
- source_word: אֵלָיִךְ
  choice: तेरे विरुद्ध
  rationale: शाब्दिक दिशा ‘तेरी ओर’ हो सकती है, पर न्याय के संदर्भ में यहाँ शत्रुतापूर्ण अभिमुखता है; ‘तेरे विरुद्ध’ इसे स्वाभाविक हिन्दी में व्यक्त करता है। स्त्रीलिंग एकवचन संबोधन सम्भवतः देश/भूमि से है।
- source_word: הִנֵּה
  choice: देख
  rationale: यह ध्यान आकृष्ट करने वाले हिब्रू उद्गार का संक्षिप्त, वर्तमान और सीधा हिन्दी रूप है।
- source_word: בָּאָה
  choice: वह आ रहा है
  rationale: हिन्दी में ‘अंत’ पुल्लिंग है, इसलिए मूल के अंतिम स्त्रीलिंग क्रियारूप को व्याकरणगत रूप से पुल्लिंग करना आवश्यक है। ‘वह’ संदर्भतः आए हुए अंत की ओर संकेत करता है, जबकि मूल में स्त्रीलिंग रूप के कारण उपस्थित हल्की व्याकरणगत असंगति हिन्दी में पूरी तरह संरक्षित नहीं की जा सकती।
