base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/007/003.yaml
  text: Now the end is upon you[a], and I will send my anger against you. I will judge you according to your ways, and I will bring all your abominations upon you.
translation:
  language: hi
  text: अब अंत तुझ पर आ पहुँचा है। मैं अपना क्रोध तुझ पर भेजूँगा। मैं तेरे चालचलन के अनुसार तेरा न्याय करूँगा और तेरे सभी घृणित कामों को तुझ पर डाल दूँगा।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तेरे सभी घृणित कामों के परिणाम तुझ पर लाऊँगा।” हिब्रू में शाब्दिक रूप से, “तेरे सभी घृणित कामों को तुझ पर रखूँगा/डालूँगा” है; यह उन कामों के परिणाम उसी पर लाने का मुहावरा है।
    reason: lexical_alternative
lexical_decisions:
- source_word: עַתָּה
  choice: अब
  rationale: यह समयसूचक शब्द आने वाले न्याय की तात्कालिकता और भविष्यवाणी के अकस्मात् जोर को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: הַקֵּץ
  choice: अन्त
  rationale: निश्चित उपपद सहित यह प्रसंग में निकट आ चुके निर्णायक विनाश अथवा न्याय को सूचित करता है। केवल ‘अन्त’ कहना मूल की गंभीरता बनाए रखता है और बाद की तकनीकी युगान्त-संबंधी धारणा नहीं जोड़ता।
- source_word: עָלַיִךְ
  choice: तुझ पर
  rationale: मूल में स्त्रीलिंग एकवचन सम्बोधन है और पूर्वसर्ग आने वाले अन्त की स्थानात्मक-रूपक छवि देता है। ‘तुझ पर’ उस छवि को सुरक्षित रखता है।
- source_word: וְשִׁלַּחְתִּי אַפִּי בָּךְ
  choice: मैं अपना क्रोध तुझ पर भेजूँगा
  rationale: שׁלח का मूल अर्थ ‘भेजना’ और אַף का यहाँ मुहावरेदार अर्थ ‘क्रोध’ है। यह अनुवाद दिव्य न्याय की दिशा और तीव्रता को बिना विस्तार जोड़े व्यक्त करता है।
- source_word: וּשְׁפַטְתִּיךְ
  choice: मैं ... तेरा न्याय करूँगा
  rationale: यह सीधा न्यायिक कथन है और हिन्दी में विधिक तथा वाचा-संबंधी गंभीरता बनाए रखता है।
- source_word: כִּדְרָכָיִךְ
  choice: तेरे चालचलन के अनुसार
  rationale: דֶּרֶךְ का नैतिक और भविष्यवाणी-संबंधी प्रसंग में आशय आचरण से है। ‘चालचलन’ मार्ग के रूपक की हल्की छाया रखते हुए आधुनिक पाठक के लिए अर्थ स्पष्ट करता है।
- source_word: וְנָתַתִּי עָלַיִךְ
  choice: तुझ पर डाल दूँगा
  rationale: נתן का मूल अर्थ ‘देना/रखना’ है और עַל के साथ यह यहाँ किए गए घिनौने कामों तथा उनके दण्ड को अपराधी पर लौटाने की न्यायिक छवि देता है। अपेक्षाकृत शाब्दिक रूप मूल की अर्थगत कसावट सुरक्षित रखता है।
- source_word: אֵת כָּל תּוֹעֲבֹתָיִךְ
  choice: तेरे सारे घिनौने काम
  rationale: תּוֹעֵבָה अत्यन्त घृणित, विशेषतः मूर्तिपूजा से जुड़े अपराधों के लिए प्रबल शब्द है। ‘घिनौने काम’ आधुनिक हिन्दी में स्पष्ट है और नैतिक-धार्मिक भार बनाए रखता है।
theological_decisions:
- issue: ‘अन्त’ का स्वरूप
  choice: निकट ऐतिहासिक न्याय की भविष्यवाणी के रूप में केवल ‘अन्त’
  alternative: अन्तिम ब्रह्माण्डीय युगान्त के तकनीकी अर्थ में ‘महाअन्त’ या ‘जगत का अन्त’
  rationale: यहेजकेल 7 का निकट प्रसंग देश और यरूशलेम पर आने वाले न्याय से संबंधित है। मूल शब्द की निर्णायकता रखी गई है, पर बाद की युगान्त-संबंधी अवधारणा नहीं जोड़ी गई।
- issue: घिनौने कामों को ‘तुझ पर डालने’ का आशय
  choice: मूल की ठोस न्यायिक छवि को मुख्य पाठ में रखना और परिणाम का आशय पादटिप्पणी में बताना
  alternative: मुख्य पाठ में सीधे ‘तेरे घिनौने कामों का फल तुझे भुगताऊँगा’ कहना
  rationale: हिब्रू वाक्य अपराधों को अपराधी पर रखे जाने की सघन छवि देता है, जिसमें कर्म और उसके दण्ड दोनों की निकटता बनी रहती है। सीधे ‘फल भुगतना’ अर्थ स्पष्ट करता, पर मूल की वास्तविक अभिव्यक्ति को अधिक निर्णायक ढंग से व्याख्यायित कर देता।
- issue: दिव्य न्याय की भाषा
  choice: ‘क्रोध’, ‘न्याय’ और ‘घिनौने काम’ जैसे सीधे और सशक्त शब्द
  alternative: भाषा को नरम करना अथवा अधिक पारंपरिक किन्तु कम सहज शब्दावली अपनाना
  rationale: पद दिव्य न्याय को बिना संकोच प्रस्तुत करता है। आधुनिक, सहज हिन्दी में उसकी गंभीरता और तनाव दोनों बनाए रखे गए हैं।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सीधा भविष्यवाणी-संबंधी स्वर रखा गया है। स्त्रीलिंग एकवचन सम्बोधन के कारण ‘तुझ/तेरा’ रूप प्रयुक्त हैं; प्रसंग में यह देश अथवा यरूशलेम की ओर संकेत करता है। ‘चालचलन’ और ‘घिनौने काम’ सामान्य पाठक के लिए बोधगम्य हैं, जबकि न्याय की गंभीरता कम नहीं करते।
