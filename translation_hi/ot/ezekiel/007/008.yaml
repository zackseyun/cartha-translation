  text: Now[a], soon I will pour out my wrath on you, and I will spend my anger against you; I will judge you according to your ways[b], and I will bring all your abominations upon you.
translation:
  language: hi
  text: अब[a], शीघ्र ही मैं अपना प्रकोप तुझ पर उंडेलूँगा और अपना पूरा क्रोध तुझ पर उतारूँगा। मैं तेरे चालचलन के अनुसार तेरा न्याय करूँगा और तेरे सारे घृणित काम तुझ पर डालूँगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘थोड़े ही समय में’; इब्रानी पदबंध आसन्न न्याय को दर्शाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: עַתָּה מִקָּרוֹב
  choice: अब[a] शीघ्र ही
  rationale: עַתָּה तात्कालिकता और מִקָּרוֹב इस प्रसंग में समय की निकटता व्यक्त करता है। यह संयोजन आसन्न न्याय की तात्कालिकता को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: אֶשְׁפּוֹךְ חֲמָתִי עָלַיִךְ
  choice: मैं अपना प्रकोप तुझ पर उण्डेलूँगा
  rationale: ‘उण्डेलना’ मूल रूपक को सुरक्षित रखता है और ‘प्रकोप’ חֵמָה की तीव्र, न्यायकारी रोष-भावना को व्यक्त करता है।
- source_word: וְכִלֵּיתִי אַפִּי בָּךְ
  choice: अपना क्रोध तुझ पर पूरी तरह उतारूँगा
  rationale: כלה यहाँ क्रोध को उसके पूर्ण परिणाम तक पहुँचाने का भाव देता है। ‘पूरी तरह उतारूँगा’ हिन्दी में स्वाभाविक रहते हुए उस पूर्णता और प्रतिकूल दिशा दोनों को व्यक्त करता है।
- source_word: וּשְׁפַטְתִּיךְ כִּדְרָכָיִךְ
  choice: मैं तेरे चालचलन के अनुसार तेरा न्याय करूँगा
  rationale: שפט का न्यायिक अर्थ बनाए रखा गया है; דְּרָכַיִךְ का रूपक ‘चालचलन’ द्वारा स्पष्ट और सामान्य आधुनिक हिन्दी में व्यक्त होता है।
- source_word: וְנָתַתִּי עָלַיִךְ אֵת כָּל תּוֹעֲבוֹתָיִךְ
  choice: तेरे सारे घिनौने कामों का फल तुझ पर डालूँगा
  rationale: תּוֹעֵבוֹת नैतिक और धार्मिक रूप से घृणित कर्मों को दर्शाता है। נתן על की दण्डात्मक परिणति को ‘कामों का फल तुझ पर डालूँगा’ स्पष्ट करता है, बिना यह कहे कि परमेश्वर स्वयं वे घिनौने काम उस पर आरोपित करता है।
theological_decisions:
- issue: ईश्वरीय रोष के दो समानांतर शब्द חֲמָה और אַף
  choice: ‘प्रकोप’ और ‘क्रोध’ जैसे दो अलग हिन्दी शब्द
  alternative: दोनों के लिए केवल ‘क्रोध’ या ‘कोप’
  rationale: मूल पाठ दो सम्बद्ध लेकिन भिन्न शब्दों का प्रयोग करता है। अलग हिन्दी शब्द समानांतरता और तीव्रता को बनाए रखते हैं, पर उनके बीच कोई कृत्रिम तकनीकी भेद स्थापित नहीं करते।
- issue: घिनौने कामों को व्यक्ति पर देने का अर्थ
  choice: ‘घिनौने कामों का फल तुझ पर डालूँगा’
  alternative: ‘तेरे सारे घिनौने काम तुझ पर डालूँगा’
  rationale: न्याय के प्रसंग में वाक्य का आशय उन कर्मों का दण्डात्मक प्रतिफल उस पर लाना है। ‘फल’ इसे हिन्दी में बोधगम्य बनाता है, यद्यपि यह निहित अर्थ की स्पष्टता है।
