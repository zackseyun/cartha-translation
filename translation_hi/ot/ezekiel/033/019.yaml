base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/033/019.yaml
  text: And when a wicked man turns from his wickedness and does justice and righteousness[a], by them he shall live.
translation:
  language: hi
  text: परन्तु जब दुष्ट अपनी दुष्टता से फिरकर न्याय और धार्मिकता करता है, तो वह उन्हीं के द्वारा[a] जीवित रहेगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उन्हीं के कारण”; अथवा अधिक शाब्दिक रूप में “उन्हीं पर।” इब्रानी पदबंध पीछे आए “न्याय और धार्मिकता” की ओर संकेत करता है और उन्हें उसके जीवित रहने के आधार के रूप में प्रस्तुत करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בְ/שׁוּב
  choice: पर जब ... फिरकर
  rationale: ו plus ב with the infinitive construct introduces a temporal clause. In this immediate contrastive context, Hindi ‘पर जब’ naturally marks the turn while ‘फिरकर’ expresses departure from the former way.
- source_word: רָשָׁע
  choice: दुष्ट
  rationale: The masculine singular adjective is substantival and representative. Hindi ‘दुष्ट’ preserves its moral force without adding an unnecessary noun.
- source_word: מֵֽ/רִשְׁעָת֔/וֹ
  choice: अपनी दुष्टता से
  rationale: ‘दुष्टता’ maintains the lexical link with ‘दुष्ट,’ and ‘अपनी’ naturally conveys the third-person possessive in Hindi.
- source_word: וְ/עָשָׂ֥ה
  choice: काम करता है
  rationale: In combination with the abstract objects ‘न्याय’ and ‘धार्मिकता,’ ‘के काम करता है’ is more natural modern Hindi than a wooden ‘करता है’ while retaining the emphasis on ethical action.
- source_word: מִשְׁפָּ֖ט
  choice: न्याय
  rationale: In the ethical pair with צדקה, the word denotes just conduct rather than merely a judicial verdict.
- source_word: וּ/צְדָקָ֑ה
  choice: धार्मिकता
  rationale: ‘धार्मिकता’ is the established dignified Hindi equivalent and here denotes morally upright conduct; ‘के काम’ clarifies its practical sense.
- source_word: עֲלֵי/הֶ֖ם
  choice: उन्हीं के कारण
  rationale: The plural pronoun refers back to न्याय and धार्मिकता. ‘के कारण’ expresses the likely basis/ground sense, while the footnote preserves the possible instrumental or more literal spatial renderings.
- source_word: ה֥וּא יִֽחְיֶֽה
  choice: वह ... जीवित रहेगा
  rationale: This naturally expresses the promised result in Hindi. The explicit ‘वह’ reflects the Hebrew pronoun’s emphasis without overtranslating it.
theological_decisions:
- issue: मन-फिराव, न्यायपूर्ण आचरण और जीवन का संबंध
  choice: पद कहता है कि दुष्ट अपनी दुष्टता से फिरकर न्याय और धार्मिकता के काम करता है, और उन्हीं के कारण जीवित रहेगा।
  alternative: वाक्य को केवल मन-फिराव या व्यापक वाचा-निष्ठा पर जीवन निर्भर बताने के लिए अधिक व्याख्यात्मक बनाया जा सकता था।
  rationale: अनुवाद इब्रानी पाठ में बताए गए नैतिक आचरण और עֲלֵיהֶם के आधार/कारण संबंध को बनाए रखता है तथा बाद की किसी धर्म-सैद्धांतिक व्यवस्था से इस तनाव को हल नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज किंतु गरिमापूर्ण भविष्यद्वाणी-संबंधी स्वर रखा गया है। ‘न्याय और धार्मिकता के काम’ अमूर्त इब्रानी संज्ञाओं को नैतिक आचरण के रूप में स्पष्ट करता है, और पाद-टिप्पणी עֲלֵיהֶם की वास्तविक अर्थ-व्याप्ति सुरक्षित रखती है।
