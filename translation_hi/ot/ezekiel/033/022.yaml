source:
  edition: WLC
  text: וְ/יַד יְהוָה֩ הָיְתָ֨ה אֵלַ֜/י בָּ/עֶ֗רֶב לִ/פְנֵי֙ בּ֣וֹא הַ/פָּלִ֔יט וַ/יִּפְתַּ֣ח אֶת פִּ֔/י עַד בּ֥וֹא אֵלַ֖/י בַּ/בֹּ֑קֶר וַ/יִּפָּ֣תַח פִּ֔/י וְ/לֹ֥א נֶאֱלַ֖מְתִּי עֽוֹד־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/033/022.yaml
  text: The hand of Yahweh had been upon me in the evening[a], before the fugitive came, and he opened my mouth until he came to me in the morning. So my mouth was opened, and I was no longer mute.
translation:
  language: hi
  text: बच निकलने वाले व्यक्ति के आने से पहले, शाम को यहोवा का हाथ मुझ पर था[a]; और सुबह उसके मेरे पास आने तक उसने मेरा मुँह खोल दिया था। तब मेरा मुँह खुल गया, और मैं फिर गूँगा न रहा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जीवित बच निकला व्यक्ति।” इब्रानी शब्द ऐसे व्यक्ति के लिए है जो बचकर निकल आया हो।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיַד יְהוָה
  choice: यहोवा का हाथ
  rationale: भविष्यद्वाणी-साहित्य में यह परमेश्वर की सामर्थ्यपूर्ण क्रिया या प्रभाव का मुहावरा है। मूल बिंब बनाए रखते हुए हिन्दी में स्वाभाविक संबंध-रचना अपनाई गई है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: मूल में आए परमेश्वर के व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय प्रचलित हिन्दी लिप्यंतरण में रखा गया है।
- source_word: הָיְתָה אֵלַי
  choice: मुझ पर था
  rationale: हाथ के साथ प्रयुक्त मूल मुहावरे और על-सदृश हिन्दी प्रयोग को सहज रूप में व्यक्त करता है; काल-संबंध अगली समय-सूचनाओं से स्पष्ट है।
- source_word: בָּעֶרֶב
  choice: शाम को
  rationale: आधुनिक हिन्दी में समय बताने का सीधा और स्वाभाविक रूप।
- source_word: לִפְנֵי בּוֹא הַפָּלִיט
  choice: भागे हुए व्यक्ति के आने से पहले
  rationale: הַפָּלִיט उस व्यक्ति को बताता है जो बचकर निकल आया हो। यह रूप भाग निकलने के मूल अर्थ को बचाता है और उस पर अपराधी होने का अनावश्यक भाव नहीं डालता।
- source_word: וַיִּפְתַּח אֶת פִּי
  choice: उसने मेरा मुँह खोल दिया था
  rationale: कर्ता प्रसंगानुसार यहोवा है। 'मुँह खोलना' का ठोस बिंब बनाए रखा गया है, क्योंकि आगे उसी अभिव्यक्ति की पुनरावृत्ति और यहेजकेल के गूँगेपन से उसका संबंध महत्त्वपूर्ण है। पूर्वकालिक क्रिया हिन्दी में घटनाक्रम स्पष्ट करती है।
- source_word: עַד בּוֹא אֵלַי בַּבֹּקֶר
  choice: सुबह उसके मेरे पास आने तक
  rationale: עַד को उसके सामान्य सीमाबोधक अर्थ 'तक' में रखा गया है। सर्वनाम स्वाभाविक रूप से भागे हुए व्यक्ति की ओर संकेत करता है।
- source_word: וַיִּפָּתַח פִּי
  choice: मेरा मुँह खुल गया
  rationale: निफ़अल रूप के परिणामकारी/अकर्मक भाव को स्वाभाविक हिन्दी में व्यक्त करता है और मूल की पुनरावृत्ति बनाए रखता है।
- source_word: וְלֹא נֶאֱלַמְתִּי עוֹד
  choice: मैं फिर गूँगा न रहा
  rationale: क्रिया बोल न सकने या गूँगा रहने को दर्शाती है। यह अनुवाद संक्षिप्त, स्वाभाविक और पूर्ववर्ती दैवी रूप से लगाए गए गूँगेपन के संदर्भ के अनुकूल है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: प्रभु
  rationale: पद में चार अक्षरों वाला व्यक्तिगत ईश्वरीय नाम सीधे आया है; हिन्दी पाठक के लिए परिचित लिप्यंतरण 'यहोवा' उस नाम को उपाधि से प्रतिस्थापित नहीं करता।
- issue: '''उसने मेरा मुँह खोल दिया था'' में कर्ता'
  choice: यहोवा को निहित कर्ता माना गया
  alternative: अव्यक्त या कर्मवाच्य अर्थ
  rationale: यद्यपि क्रिया के साथ कर्ता दोहराया नहीं गया, निकटतम संगत संदर्भ 'यहोवा का हाथ' है और व्यापक प्रसंग में यहेजकेल का गूँगापन परमेश्वर ही हटाता है।
- issue: עַד का समय-संबंध
  choice: आने तक
  alternative: आने से पहले
  rationale: मूल עַד सामान्यतः अंतिम समय-सीमा दर्शाता है। 'तक' वास्तविक भाषिक अस्पष्टता और घटनाक्रम के तनाव को बनाए रखता है; इसे चुपचाप 'पहले' नहीं बनाया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठकों के लिए सुबोध। भविष्यद्वाणी-संबंधी 'यहोवा का हाथ' और 'मुँह खोलना' जैसे मूल बिंब सुरक्षित रखे गए हैं; अत्यधिक संस्कृतनिष्ठ शब्दावली से बचा गया है।
