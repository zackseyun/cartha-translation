base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/033/033.yaml
  text: When it comes—and look, it is coming—then they will know that a prophet has been among them.
translation:
  language: hi
  text: जब वह आएगी—और देखो, वह आ रही है—तब वे जानेंगे कि उनके बीच एक नबी था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבְבֹאָהּ
  choice: जब वह बात पूरी होगी
  rationale: स्त्रीलिंग प्रत्यय का संकेत निकटवर्ती भविष्यवाणी/कही हुई बात की ओर है। केवल ‘जब वह आएगी’ हिन्दी में अस्पष्ट और अस्वाभाविक होता; ‘पूरी होगी’ भविष्यवाणी के घटित होने का भाव स्वाभाविक रूप से व्यक्त करता है।
- source_word: הִנֵּה
  choice: देखो
  rationale: ध्यान आकर्षित करने और निश्चितता पर बल देने वाले हिब्रू उद्गार का सीधा, आधुनिक हिन्दी रूप।
- source_word: בָאָה
  choice: वह पूरी होने ही वाली है
  rationale: हिब्रू कृदंत आसन्न और निश्चित घटना को प्रस्तुत करता है; ‘होने ही वाली है’ उस आसन्नता को रखता है।
- source_word: נָבִיא
  choice: नबी
  rationale: आधुनिक हिन्दी बाइबलीय प्रयोग में प्रचलित और सामान्य पाठकों को समझ आने वाला शब्द।
- source_word: הָיָה בְתוֹכָם
  choice: उनके बीच ... था
  rationale: हिब्रू अस्तित्ववाचक कथन को सरल और निकट रूप में रखा गया है।
theological_decisions:
- issue: भविष्यवाणी की पूर्ति और नबी की पहचान
  choice: पूर्ति के बाद लोग पहचानेंगे कि उनके बीच एक नबी था
  alternative: पूर्ति के बाद वे नबी के संदेश के प्रत्येक विवरण या उसकी धार्मिक स्थिति को पूर्णतः स्वीकार करेंगे
  rationale: मूल पाठ केवल नबी की उपस्थिति की पहचान कहता है; उससे अधिक धार्मिक निष्कर्ष नहीं जोड़ा गया।
- issue: स्त्रीलिंग प्रत्यय का संदर्भ
  choice: ‘वह बात’ के रूप में संकेतित
  alternative: किसी स्पष्ट रूप से नामित घटना या दण्ड को संदर्भ मानना
  rationale: हिब्रू में संदर्भ व्याकरणतः स्त्रीलिंग है पर इस पद में उसका संज्ञात्मक नाम नहीं दिया गया; ‘वह बात’ संदर्भ को खुला रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और मौखिक रूप से सहज रखी गई है। ‘देखो’ को हटाया नहीं गया, क्योंकि वह मूल के הִנֵּה का बल बनाए रखता है। कोई पादटिप्पणी आवश्यक नहीं है।
