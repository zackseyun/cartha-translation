source:
  edition: WLC
  text: וְ/אַתָּ֣ה בֶן אָדָ֗ם אֱמֹ֤ר אֶל בְּנֵֽי עַמְּ/ךָ֙ צִדְקַ֣ת הַ/צַּדִּ֗יק לֹ֤א תַצִּילֶ֨/נּוּ֙ בְּ/י֣וֹם פִּשְׁע֔/וֹ וְ/רִשְׁעַ֤ת הָֽ/רָשָׁע֙ לֹֽא יִכָּ֣שֶׁל בָּ֔/הּ בְּ/י֖וֹם שׁוּב֣/וֹ מֵֽ/רִשְׁע֑/וֹ וְ/צַדִּ֗יק לֹ֥א יוּכַ֛ל לִֽ/חְי֥וֹת בָּ֖/הּ בְּ/י֥וֹם חֲטֹאתֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/033/012.yaml
  text: 'And you[a], son of man, say to the sons of your people: The righteousness of the righteous man will not deliver him in the day of his transgression, and the wickedness of the wicked man—he will not stumble by it in the day he turns from his wickedness[c][b]; and the righteous man will not be able to live by it in the day of his sin.'
translation:
  language: hi
  text: 'और हे मनुष्य के पुत्र, तू अपने लोगों[a] से कह: धर्मी की धार्मिकता उसके अपराध करने के दिन उसे न बचाएगी; और दुष्ट की दुष्टता—जिस दिन वह अपनी दुष्टता से फिर जाए, उस दिन वह उसके कारण ठोकर न खाएगा[b]; और जिस दिन धर्मी पाप करे, उस दिन वह अपनी धार्मिकता के बल पर जीवित न रह सकेगा[c]।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “अपने लोगों के पुत्रों।”
    reason: lexical_alternative
  - marker: b
    text: या, “उसके कारण गिर न पड़ेगा।” इब्रानी में ठोकर खाने का चित्र है; यहाँ “उसके कारण” दुष्ट की पहले की दुष्टता की ओर संकेत करता है।
    reason: lexical_alternative
  - marker: c
    text: इब्रानी में सर्वनाम का अर्थ “उसके द्वारा” या “उसके आधार पर” है; स्त्रीलिंग सर्वनाम का सबसे स्वाभाविक संकेत धर्मी की धार्मिकता की ओर है।
    reason: textual_clarity
lexical_decisions:
- source_word: בֶן אָדָם
  choice: मनुष्य के पुत्र
  rationale: यह यहेजकेल के लिए बार-बार प्रयुक्त विशिष्ट संबोधन है। प्रचलित हिन्दी बाइबलीय पदबंध मूल इब्रानी रूपक और पुस्तक में उसकी साहित्यिक पुनरावृत्ति को सुरक्षित रखता है।
- source_word: בְּנֵי עַמְּךָ
  choice: अपने लोगों
  rationale: शाब्दिक अर्थ ‘अपने लोगों के पुत्रों’ है, पर आधुनिक हिन्दी में ‘अपने लोगों से’ वही अभिप्रेत समुदाय स्वाभाविक और स्पष्ट ढंग से व्यक्त करता है; शाब्दिक रूप पादटिप्पणी में दिया गया है।
- source_word: צִדְקַת הַצַּדִּיק
  choice: धर्मी की धार्मिकता
  rationale: यह चयन मूल के सजातीय शब्द-प्रयोग को बनाए रखता है और यहाँ व्यक्ति के धार्मिक आचरण अथवा स्थिति को व्यक्त करता है।
- source_word: תַצִּילֶנּוּ
  choice: उसे न बचाएगी
  rationale: हिफ़ील रूप का अर्थ बचाना या छुड़ाना है। ‘बचाएगी’ आधुनिक हिन्दी में सहज है और न्याय के प्रसंग में अपेक्षित विपत्ति से रक्षा का भाव देता है।
- source_word: בְּיוֹם פִּשְׁעוֹ
  choice: उसके अपराध करने के दिन
  rationale: פשע में अपराध और विद्रोह दोनों का भाव हो सकता है। ‘अपराध करने’ से नैतिक उल्लंघन स्पष्ट होता है और कालवाचक इब्रानी रचना भी बनी रहती है।
- source_word: רִשְׁעַת הָרָשָׁע
  choice: दुष्ट की दुष्टता
  rationale: यह मूल के शब्द-साम्य और धर्मी/दुष्ट के संतुलित विरोध को सुरक्षित रखता है।
- source_word: יִכָּשֶׁל בָּהּ
  choice: वह उसके कारण ठोकर न खाएगा
  rationale: ‘ठोकर खाना’ כשל का चित्रात्मक अर्थ बनाए रखता है। ‘उसके कारण’ का संकेत दुष्टता की ओर है; वैकल्पिक ‘गिर न पड़ेगा’ पादटिप्पणी में दिया गया है।
- source_word: בְּיוֹם שׁוּבוֹ מֵרִשְׁעוֹ
  choice: जिस दिन वह अपनी दुष्टता से फिर जाए
  rationale: שוב מן बुरे मार्ग अथवा आचरण से मुड़ने का भाव देता है। ‘फिर जाए’ पश्चात्ताप के संकेत को बिना व्याख्यात्मक विस्तार के सुरक्षित रखता है।
- source_word: לֹא יוּכַל לִחְיוֹת בָּהּ
  choice: वह अपनी धार्मिकता के कारण जीवित न रह सकेगा
  rationale: ‘न रह सकेगा’ יכל द्वारा व्यक्त असमर्थता को बनाए रखता है। हिन्दी में अस्पष्ट सर्वनाम से बचने के लिए स्त्रीलिंग इब्रानी सर्वनाम का स्वाभाविक संदर्भ ‘धार्मिकता’ स्पष्ट किया गया है, और इसकी सूचना पादटिप्पणी में दी गई है।
- source_word: בְּיוֹם חֲטֹאתוֹ
  choice: जिस दिन धर्मी पाप करे
  rationale: यह कालवाचक पदबंध को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है और मूल के सामान्य सिद्धांत वाले भाव को बनाए रखता है।
theological_decisions:
- issue: क्या पद को उद्धार खोने या संतों के निश्चित धीरज की व्यवस्थित शिक्षा के रूप में स्पष्ट किया जाए
  choice: पद को वर्तमान आचरण, पाप से फिरने और परमेश्वर के न्याय के विषय में भविष्यद्वाणी के कथन के रूप में रखा गया है।
  alternative: इसे अनिवार्य रूप से उद्धार खोने अथवा उद्धार कभी न खो सकने की बाद की सिद्धान्तगत श्रेणियों में ढालना।
  rationale: इब्रानी पाठ कहता है कि पहले की धार्मिकता पाप के दिन रक्षा नहीं करेगी और पहले की दुष्टता उससे फिरने वाले को गिरने का कारण नहीं बनेगी। अनुवाद इसी तनाव को बिना साम्प्रदायिक निष्कर्ष जोड़े सुरक्षित रखता है।
- issue: अंतिम בָּהּ का संदर्भ
  choice: मुख्य पाठ में ‘अपनी धार्मिकता के कारण’ कहकर सबसे स्वाभाविक संदर्भ स्पष्ट किया गया है।
  alternative: सर्वनाम को केवल ‘उसके कारण’ रखकर हिन्दी में संदर्भ खुला छोड़ना, अथवा उसे सामान्य पूर्व स्थिति मानना।
  rationale: स्त्रीलिंग एकवचन सर्वनाम पद के आरम्भ की ‘धार्मिकता’ से व्याकरणिक और अलंकारिक रूप से मेल खाता है। हिन्दी में केवल सर्वनाम रखने पर अनपेक्षित अस्पष्टता उत्पन्न होती; पादटिप्पणी मूल की सर्वनामात्मक रचना बताती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण भविष्यद्वाणी शैली रखी गई है। ‘तू’ यहेजकेल को दिए गए एकवचन प्रत्यक्ष दैवी संबोधन को दर्शाता है, अपमानसूचक बोलचाल नहीं। वाक्य-संतुलन और ‘धर्मी की धार्मिकता/दुष्ट की दुष्टता’ की मूल शब्द-क्रीड़ा सुरक्षित रखी गई है।
