id: EZK.33.20
reference: Ezekiel 33:20
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/אֲמַרְתֶּ֕ם לֹ֥א יִתָּכֵ֖ן דֶּ֣רֶךְ אֲדֹנָ֑/י אִ֧ישׁ כִּ/דְרָכָ֛י/ו אֶשְׁפּ֥וֹט אֶתְ/כֶ֖ם בֵּ֥ית יִשְׂרָאֵֽלפ
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/033/020.yaml
  text: Yet you say[a], ‘The way of the Lord is not just.’ I will judge each of you according to his ways[b], O house of Israel.
translation:
  language: hi
  text: फिर भी तुम कहते हो[a], “प्रभु का मार्ग न्यायपूर्ण नहीं है।” हे इस्राएल के घराने, मैं तुममें से हर एक का न्याय उसके चाल-चलन के अनुसार करूँगा[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “तौभी तुम कहते हो।” यह कथन पिछले प्रसंग में प्रभु द्वारा अपने न्याय का समर्थन किए जाने के विपरीत इस्राएल की आपत्ति को सामने रखता है।
    reason: discourse_alternative
  - marker: b
    text: शाब्दिक रूप से, “हर व्यक्ति का उसके मार्गों के अनुसार।” पूरे इस्राएल के घराने को संबोधित करते हुए भी यह कथन प्रत्येक व्यक्ति के उत्तरदायित्व पर बल देता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲמַרְתֶּם
  choice: फिर भी तुम कहते हो
  rationale: वाव सहित पूर्ण क्रिया यहाँ पिछले कथन के विपरीत इस्राएल की शिकायत सामने रखती है; ‘फिर भी’ इस विरोध को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: לֹא יִתָּכֵן
  choice: न्यायपूर्ण नहीं है
  rationale: निफ़अल रूप इस प्रसंग में उचित, सही या न्यायसंगत माने जाने की बात करता है। न्याय के प्रसंग में ‘न्यायपूर्ण’ नैतिक और न्यायिक आशय को स्पष्ट रखता है।
- source_word: דֶּרֶךְ אֲדֹנָי
  choice: प्रभु का मार्ग
  rationale: ‘मार्ग’ इब्रानी रूपक को बनाए रखता है और यहाँ प्रभु के आचरण अथवा न्याय करने की रीति को सूचित करता है। אֲדֹנָי को उसके दिव्य पदनाम के रूप में ‘प्रभु’ किया गया है।
- source_word: אִישׁ כִּדְרָכָיו
  choice: हर एक ... उसके चाल-चलन के अनुसार
  rationale: אִישׁ का वितरणात्मक बल ‘हर एक’ से और एकवचन כִּדְרָכָיו का बल ‘उसके’ से सुरक्षित रहता है। ‘चाल-चलन’ बहुवचन ‘मार्गों’ के व्यवहारगत अर्थ को सहज हिन्दी में व्यक्त करता है।
- source_word: אֶשְׁפּוֹט אֶתְכֶם
  choice: मैं तुममें से हर एक का न्याय ... करूँगा
  rationale: क्रिया न्यायिक है। बहुवचन ‘तुम्हारा’ को वितरणात्मक אִישׁ के साथ जोड़कर सामूहिक संबोधन के भीतर व्यक्तिगत उत्तरदायित्व स्पष्ट किया गया है।
- source_word: בֵּית יִשְׂרָאֵל
  choice: हे इस्राएल के घराने
  rationale: यह प्रत्यक्ष संबोधन है; ‘इस्राएल का घराना’ वाचा-समुदाय के लिए प्रचलित बाइबलीय अभिव्यक्ति है।
theological_decisions:
- issue: परमेश्वर के न्याय पर लोगों के आरोप का अनुवाद
  choice: प्रभु का मार्ग न्यायपूर्ण नहीं है
  alternative: प्रभु का मार्ग उचित नहीं है / निष्पक्ष नहीं है
  rationale: प्रसंग परमेश्वर के न्याय की समता पर उठी आपत्ति से संबंधित है। ‘न्यायपूर्ण’ न्यायिक और नैतिक आयाम बनाए रखता है, जबकि पादटिप्पणी वैध अर्थ-विकल्पों को सुरक्षित रखती है।
- issue: सामूहिक संबोधन के भीतर व्यक्तिगत उत्तरदायित्व
  choice: मैं तुममें से हर एक का न्याय उसके चाल-चलन के अनुसार करूँगा
  alternative: मैं तुम्हारा न्याय तुम्हारे चाल-चलन के अनुसार करूँगा
  rationale: इब्रानी पाठ बहुवचन समुदाय (‘तुम’, ‘इस्राएल का घराना’) के साथ वितरणात्मक एकवचन (‘हर व्यक्ति’, ‘उसके मार्ग’) रखता है। चुना हुआ रूप इस तनाव को सपाट किए बिना स्वाभाविक हिन्दी में बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज शैली अपनाई गई है। ‘प्रभु का मार्ग’ और ‘इस्राएल का घराना’ जैसे परिचित बाइबलीय पद सुरक्षित रखे गए हैं; ‘चाल-चलन’ से ‘मार्गों’ का व्यवहारगत अर्थ स्पष्ट किया गया है।
