  naturalness: “और यदि कोई व्यक्ति ... सुने, पर चेतावनी न माने” is clear, idiomatic modern Hindi, and preserves the sequential logic without unnecessary emphasis. “उसका खून उसके सिर पर होगा” retains the concrete Hebrew idiom naturally.
  terminology: “नरसिंगा” is a suitable rendering of שׁוֹפָר in this warning-signal setting. “तलवार” appropriately preserves חֶרֶב. “चेतावनी न माने” expresses נִזְהָר more precisely here than merely ‘not be cautious.’
  issues:
  - severity: low
    issue: Conditional connector is unnatural.
    rationale: “तब यदि” is not the most natural Hindi continuation of the conditional case already established in the preceding verse. “और यदि” better reflects the Hebrew conjunction and context.
  - severity: low
    issue: The response to the warning is expressed somewhat loosely.
    rationale: “सुनकर भी सावधान न हो” is understandable, but the Hebrew contrasts hearing the horn with not taking warning. “चेतावनी न माने” makes the warning-response relationship explicit without adding interpretation.
  revised_text: और यदि कोई व्यक्ति नरसिंगे की आवाज़ सुने, पर चेतावनी न माने, और तलवार आकर उसे ले जाए, तो उसका खून उसके सिर पर होगा।[a]
