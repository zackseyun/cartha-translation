language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/שָׁמַ֨ע הַ/שֹּׁמֵ֜עַ אֶת ק֤וֹל הַ/שּׁוֹפָר֙ וְ/לֹ֣א נִזְהָ֔ר וַ/תָּ֥בוֹא חֶ֖רֶב וַ/תִּקָּחֵ֑/הוּ דָּמ֥/וֹ בְ/רֹאשׁ֖/וֹ יִֽהְיֶֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/033/004.yaml
  text: then if the one who hears hears the sound of the trumpet and does not take warning[a], and the sword comes and takes him away, his blood will be on his own head.
translation:
  language: hi
  text: और यदि कोई व्यक्ति नरसिंगे की आवाज़ सुने, पर चेतावनी न माने, और तलवार आकर उसे ले जाए, तो उसका खून उसके सिर पर होगा।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से, “उसका खून उसके सिर पर होगा”; यह एक मुहावरा है, जिसका अर्थ है कि वह अपनी मृत्यु के लिए स्वयं ज़िम्मेदार होगा।
    reason: cultural_note
lexical_decisions:
- source_word: וְשָׁמַע הַשֹּׁמֵעַ
  choice: तब यदि कोई ... सुनकर
  rationale: यह पद पिछले पद में आरम्भ हुई शर्त को आगे बढ़ाता है। हिन्दी में ‘तब यदि कोई’ इस शर्त को स्वाभाविक ढंग से स्पष्ट करता है; संज्ञा के रूप में प्रयुक्त कृदन्त הַשֹּׁמֵעַ का अर्थ सामान्य रूप से ‘कोई सुननेवाला’ है।
- source_word: קוֹל הַשּׁוֹפָר
  choice: नरसिंगे की आवाज़
  rationale: שׁוֹפָר पशु के सींग से बना संकेत-वाद्य है; ‘नरसिंगा’ हिन्दी में उसके प्राचीन चेतावनी-वाद्य के स्वरूप को ‘तुरही’ की अपेक्षा अधिक निकटता से व्यक्त करता है। קוֹל यहाँ सुनाई देनेवाली आवाज़ है।
- source_word: נִזְהָר
  choice: सावधान न हो
  rationale: निफ़अल रूप चेतावनी पाकर सावधान होने या चेतावनी मानने का भाव रखता है। ‘सावधान न हो’ आधुनिक हिन्दी में स्पष्ट है और व्यक्ति की प्रतिक्रिया की ज़िम्मेदारी बनाए रखता है।
- source_word: חֶרֶב
  choice: तलवार
  rationale: मूल चित्र को बनाए रखा गया है; इस प्रसंग में तलवार हिंसक आक्रमण और उससे होनेवाली मृत्यु का संकेत भी देती है।
- source_word: וַתִּקָּחֵהוּ
  choice: उसे ले जाए
  rationale: לקח का मूल अर्थ ‘लेना’ है। प्रसंग से इसका घातक परिणाम स्पष्ट है, इसलिए अनावश्यक रूप से ‘मार डाले’ जोड़ने के बजाय मूल अभिव्यक्ति रखी गई है।
- source_word: דָּמוֹ בְרֹאשׁוֹ יִהְיֶה
  choice: उसका खून उसी के सिर पर होगा
  rationale: इब्रानी मुहावरे को उसके ठोस और न्याय-संबंधी प्रभाव सहित रखा गया है। ‘उसी’ से यह स्पष्ट होता है कि अपनी मृत्यु की ज़िम्मेदारी उस व्यक्ति पर है।
theological_decisions:
- issue: चेतावनी की उपेक्षा और व्यक्तिगत उत्तरदायित्व
  choice: उसका खून उसी के सिर पर होगा
  alternative: अपनी मृत्यु के लिए वह स्वयं ज़िम्मेदार होगा
  rationale: मूल इब्रानी मुहावरा व्यक्तिगत उत्तरदायित्व पर बल देता है। उसका सीधे अर्थ खोल देने के बजाय मुख्य पाठ में मुहावरा सुरक्षित रखा गया है और अर्थ पादटिप्पणी में बताया गया है, जिससे उसके धर्मवैचारिक और आलंकारिक तनाव दोनों बने रहते हैं।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘नरसिंगा’ प्राचीन चेतावनी-वाद्य को दर्शाता है, जबकि ‘तलवार’ और ‘खून सिर पर होना’ जैसे मूल बिंब सुरक्षित रखे गए हैं।
