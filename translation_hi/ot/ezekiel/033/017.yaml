reference: Ezekiel 33:17
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/אָמְרוּ֙ בְּנֵ֣י עַמְּ/ךָ֔ לֹ֥א יִתָּכֵ֖ן דֶּ֣רֶךְ אֲדֹנָ֑/י וְ/הֵ֖מָּה דַּרְכָּ֥/ם לֹֽא יִתָּכֵֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/033/017.yaml
  text: Yet the sons of your people say[a], ‘The way of the Lord is not just,’ though it is their own way that is not just.
translation:
  language: hi
  text: फिर भी तुम्हारी प्रजा के लोग कहते हैं, ‘प्रभु का मार्ग न्यायपूर्ण नहीं है,’ जबकि उनका अपना मार्ग ही न्यायपूर्ण नहीं है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאָמְרוּ
  choice: फिर भी ... कहते हैं
  rationale: संयोजक वाव यहाँ पिछले कथन के संदर्भ में हल्का विरोध प्रकट करता है; ‘फिर भी’ इस भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: בְּנֵי עַמְּךָ
  choice: तुम्हारी प्रजा के लोग
  rationale: शाब्दिक रूप ‘तुम्हारी प्रजा के पुत्र’ है, पर इस सामूहिक इब्रानी मुहावरे का आशय प्रजा के सदस्य हैं; आधुनिक हिन्दी में ‘प्रजा के लोग’ अधिक स्वाभाविक और समावेशी है।
- source_word: לֹא יִתָּכֵן
  choice: न्यायपूर्ण नहीं है
  rationale: निफ़अल रूप यहाँ उचित, सही या न्यायसंगत होने का भाव देता है। प्रसंग में परमेश्वर के न्याय पर आरोप है, इसलिए ‘न्यायपूर्ण नहीं’ दोनों प्रयोगों में उपयुक्त है और अलंकारिक उलटाव बनाए रखता है।
- source_word: דֶּרֶךְ אֲדֹנָי
  choice: प्रभु का मार्ग
  rationale: यह संबंधवाचक पदबंध का सीधा और स्वाभाविक हिन्दी अनुवाद है तथा ‘मार्ग’ की पुनरावृत्ति सुरक्षित रखता है।
- source_word: אֲדֹנָי
  choice: प्रभु
  rationale: यहाँ इब्रानी पाठ में ईश्वरीय उपाधि אֲדֹנָי है, चतुरक्षरीय दिव्य नाम नहीं; ‘प्रभु’ इसका प्रचलित और गरिमापूर्ण हिन्दी रूप है।
- source_word: וְהֵמָּה דַּרְכָּם
  choice: जबकि उनका अपना मार्ग ही
  rationale: स्वतंत्र सर्वनाम הֵמָּה विरोधात्मक बल देता है। ‘अपना’ और ‘ही’ दोष को उन्हीं की ओर लौटाने वाले इस जोर को हिन्दी में स्पष्ट करते हैं।
theological_decisions:
- issue: परमेश्वर के ‘मार्ग’ का नैतिक मूल्यांकन
  choice: दोनों खंडों में ‘न्यायपूर्ण नहीं है’
  alternative: ‘सही नहीं है’ अथवा ‘उचित नहीं है’
  rationale: यहेजकेल 33 के निकट प्रसंग में प्रश्न दिव्य न्याय और मानवीय उत्तरदायित्व का है। ‘न्यायपूर्ण’ आरोप की नैतिक-न्यायिक गंभीरता को बनाए रखता है, और दोनों खंडों में समान शब्दावली से मूल का प्रत्यावर्तन सुरक्षित रहता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; गरिमापूर्ण किंतु सामान्य पाठकों के लिए सहज। ‘प्रजा के पुत्र’ जैसी अस्वाभाविक शब्दशः अभिव्यक्ति के बदले अर्थ-सटीक ‘प्रजा के लोग’ रखा गया है। मूल की विरोधात्मक संरचना और ‘मार्ग’ की पुनरावृत्ति सुरक्षित है।
