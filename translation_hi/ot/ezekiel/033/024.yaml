  text: בֶּן אָדָ֗ם יֹ֠שְׁבֵי הֶ/חֳרָב֨וֹת הָ/אֵ֜לֶּה עַל אַדְמַ֤ת יִשְׂרָאֵל֙ אֹמְרִ֣ים לֵ/אמֹ֔ר אֶחָד֙ הָיָ֣ה אַבְרָהָ֔ם וַ/יִּירַ֖שׁ אֶת הָ/אָ֑רֶץ וַ/אֲנַ֣חְנוּ רַבִּ֔ים לָ֛/נוּ נִתְּנָ֥ה הָ/אָ֖רֶץ לְ/מוֹרָשָֽׁה־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/033/024.yaml
  text: Son of man, the inhabitants of these ruins on the land of Israel are saying, ‘Abraham was only one man, yet he possessed the land; but we are many—the land has been given to us as a possession.’
translation:
  language: hi
  text: हे मनुष्य के पुत्र, इस्राएल देश के इन खंडहरों में रहनेवाले कह रहे हैं, ‘अब्राहम तो एक ही व्यक्ति था, फिर भी उसने इस देश पर अधिकार पाया; पर हम तो बहुत हैं—यह देश हमें अपनी संपत्ति के रूप में दिया गया है।’
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֶּן־אָדָם
  choice: हे मनुष्य के पुत्र
  rationale: यहेजकेल के लिए प्रयुक्त इस नियमित संबोधन का औपचारिक और परिचित हिन्दी रूप रखा गया है।
- source_word: יֹשְׁבֵי הֶחֳרָבוֹת הָאֵלֶּה
  choice: इन खंडहरों में रहनेवाले
  rationale: יֹשְׁבֵי को निवास करनेवालों और חֳרָבוֹת को उजड़े हुए स्थानों/खंडहरों के अर्थ में स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: אֶחָד הָיָה אַבְרָהָם
  choice: अब्राहम अकेला था
  rationale: אֶחָד का आशय यहाँ संख्या में एक होने पर बल देना है, जो आगे के ‘हम तो बहुत हैं’ से स्पष्ट विरोध बनाता है।
- source_word: וַיִּירַשׁ אֶת־הָאָרֶץ
  choice: फिर भी उसने इस देश पर अधिकार पाया
  rationale: ירשׁ अधिकार में लेने, प्राप्त करने या उत्तराधिकार में पाने का अर्थ दे सकता है। प्रसंग में अब्राहम के अकेले होने के बावजूद देश पर अधिकार पाने का तर्क प्रमुख है; ‘फिर भी’ निहित विरोध को स्पष्ट करता है।
- source_word: לָנוּ נִתְּנָה הָאָרֶץ לְמוֹרָשָׁה
  choice: यह देश हमें अपनी संपत्ति के रूप में दिया गया है
  rationale: נתנה का दिव्य कर्मकर्ता मूल में अनुल्लिखित है, इसलिए हिन्दी में भी उसे नहीं जोड़ा गया। מורשה को स्थायी अधिकार/मिल्कियत के दावे के रूप में ‘अपनी संपत्ति’ कहा गया है।
theological_decisions:
- issue: देश दिए जाने के कथन में कर्ता
  choice: 'निष्क्रिय वाक्य रखा गया: ‘दिया गया है’'
  alternative: ‘परमेश्वर ने हमें यह देश दिया है’
  rationale: इब्रानी पाठ में देनेवाले का नाम स्पष्ट नहीं है। पाठक अनुमान लगा सकता है कि दावा परमेश्वर के विषय में है, पर अनुवाद में उसे जोड़ना मूल की अस्पष्टता को समाप्त कर देता।
- issue: अब्राहम द्वारा देश पाने का स्वरूप
  choice: ‘देश पर अधिकार पाया’
  alternative: ‘देश को विरासत में पाया’
  rationale: यहाँ ירשׁ को केवल उत्तराधिकार की तकनीकी धारणा तक सीमित न करके अधिकार-प्राप्ति के व्यापक अर्थ में रखा गया है; इससे बचे हुए लोगों का तर्क भी स्वाभाविक रहता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। प्रत्यक्ष कथन में ‘अकेला…पर हम तो बहुत’ द्वारा मूल का संख्यात्मक विरोध स्पष्ट किया गया है; अनुल्लिखित दिव्य कर्ता नहीं जोड़ा गया।
