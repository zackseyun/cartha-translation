  text: וְ/יָב֣וֹאוּ אֵ֠לֶי/ךָ כִּ/מְבוֹא עָ֞ם וְ/יֵשְׁב֤וּ לְ/פָנֶ֨י/ךָ֙ עַמִּ֔/י וְ/שָֽׁמְעוּ֙ אֶת דְּבָרֶ֔י/ךָ וְ/אוֹתָ֖/ם לֹ֣א יַֽעֲשׂ֑וּ כִּֽי עֲגָבִ֤ים בְּ/פִי/הֶם֙ הֵ֣מָּה עֹשִׂ֔ים אַחֲרֵ֥י בִצְעָ֖/ם לִבָּ֥/ם הֹלֵֽךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/033/031.yaml
  text: And they come to you as people come[a], and they sit before you as my people, and they hear your words, but they do not do them; for with their mouth they speak lustful things[b], while their heart goes after their unjust gain.
translation:
  language: hi
  text: वे तुम्हारे पास वैसे ही आते हैं जैसे लोग आया करते हैं, और मेरी प्रजा की तरह तुम्हारे सामने बैठते हैं। वे तुम्हारी बातें सुनते हैं, पर उन पर अमल नहीं करते; क्योंकि वे अपने मुँह से कामुक बातें करते हैं[a], जबकि उनका मन अपने अनुचित लाभ के पीछे लगा रहता है[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ प्रयुक्त इब्रानी शब्द दुर्लभ है। इसका अर्थ ‘वासनाएँ,’ ‘कामुक इच्छाएँ,’ ‘प्रेम-भरी बातें,’ या संभवतः ‘प्रेमगीत’ भी हो सकता है। यह उनके मुँह की बातों की ओर संकेत कर सकता है, अथवा यह बता सकता है कि वे नबी के वचनों को मनोरंजन की तरह लेते थे।
    reason: lexical_alternative
  - marker: b
    text: ‘अनुचित लाभ’ का अनुवाद ‘कमाई,’ ‘लोभ’ या ‘लालच से पाया हुआ लाभ’ भी किया जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּמְבוֹא עָם
  choice: जैसे लोग आया करते हैं
  rationale: כ־ की तुलनात्मक शक्ति और लोगों के सामान्य रूप से एकत्र होकर आने के भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: עַמִּי
  choice: मेरी प्रजा बनकर
  rationale: वाचा-संबंधी संबोधन ‘मेरी प्रजा’ को बनाए रखता है और साथ ही उनके बाहरी धार्मिक रूप तथा वास्तविक अवज्ञा के बीच की विडंबना व्यक्त करता है।
- source_word: וְשָׁמְעוּ אֶת־דְּבָרֶיךָ
  choice: वे तुम्हारी बातें सुनते हैं
  rationale: שמע के सुनने के मूल भाव को रखता है और अगले वाक्य में आज्ञापालन न करने के विरोध को स्पष्ट रहने देता है।
- source_word: וְאוֹתָם לֹא יַעֲשׂוּ
  choice: पर उन पर अमल नहीं करते
  rationale: शाब्दिक ‘उन्हें करते नहीं’ आधुनिक हिन्दी में अस्वाभाविक है; ‘उन पर अमल’ उन्हीं सुनी हुई बातों के अनुसार न चलने का आशय साफ करता है।
- source_word: עֲגָבִים בְּפִיהֶם הֵמָּה עֹשִׂים
  choice: वे अपने मुँह से कामुक बातें करते हैं
  rationale: दुर्लभ עֲגָבִים को विकृत या कामुक अभिलाषा से जुड़ी मौखिक अभिव्यक्ति के रूप में प्रस्तुत करता है। अर्थ की अनिश्चितता को पादटिप्पणी में सुरक्षित रखा गया है और किसी विशेष साहित्यिक विधा, जैसे प्रेमगीत, को मुख्य पाठ में निश्चित नहीं किया गया।
- source_word: בִצְעָם
  choice: अपने अनुचित लाभ
  rationale: בצע में लाभ के साथ लोभ या अन्यायपूर्ण प्राप्ति का नैतिक रंग हो सकता है; ‘अनुचित लाभ’ इस रंग को बनाए रखता है, जबकि विकल्प पादटिप्पणी में दिए गए हैं।
- source_word: לִבָּם הֹלֵךְ אַחֲרֵי
  choice: उनका मन ... के पीछे लगा रहता है
  rationale: हृदय के किसी वस्तु के पीछे जाने की इब्रानी उपमा को स्वाभाविक हिन्दी में आंतरिक लगाव और अभिमुखता के रूप में व्यक्त करता है।
theological_decisions:
- issue: लोगों की वाणी, इच्छा और कपट का नैतिक चित्रण
  choice: मुख्य पाठ उन्हें ऐसे श्रोता बताता है जो परमेश्वर की प्रजा होने का रूप धरते और वचन सुनते हैं, पर आज्ञा नहीं मानते; उनकी वाणी कामुक अभिव्यक्ति और उनका मन अनुचित लाभ की ओर झुका है।
  alternative: दुर्लभ पद स्नेहपूर्ण या चापलूसी भरी बातों, वासनाओं, अथवा नबी के वचनों को प्रेमगीत जैसा मनोरंजन समझने की ओर भी संकेत कर सकता है।
  rationale: निकट संदर्भ का मुख्य तनाव सुनने और न करने के बीच है। अनिश्चित पद को मुख्य पाठ में संभावित नैतिक अर्थ के साथ रखा गया है, पर उसके वैकल्पिक अर्थों को पादटिप्पणी में देकर किसी संकीर्ण व्याख्या को अंतिम नहीं बनाया गया।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, सहज और गरिमापूर्ण रखी गई है। ‘प्रजा’ वाचा-संबंधी संबोधन को बनाए रखता है; ‘अमल नहीं करते’ सामान्य पाठक के लिए स्वाभाविक रूप से आज्ञापालन की कमी व्यक्त करता है। दुर्लभ עֲגָבִים और नैतिक रंग वाले בִצְעָם की अर्थ-सीमा पादटिप्पणियों में सुरक्षित है।
