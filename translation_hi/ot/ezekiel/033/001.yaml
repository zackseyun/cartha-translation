source:
  edition: WLC
  text: וַ/יְהִ֥י דְבַר יְהוָ֖ה אֵלַ֥/י לֵ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/033/001.yaml
  text: And the word of Yahweh came to me[a], saying,
translation:
  language: hi
  text: फिर याहवे का वचन मेरे पास पहुँचा:[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “यह कहते हुए।”
    reason: इब्रानी לֵאמֹר का रूप दिखाने के लिए; मुख्य पाठ में इसका कार्य द्विबिंदु से व्यक्त किया गया है।
lexical_decisions:
- source_word: וַיְהִי
  choice: फिर ... पहुँचा
  rationale: वाव-क्रमागत के साथ היה यहाँ एक नए कथात्मक खंड का आरम्भ करता है। आधुनिक हिन्दी में “फिर” पूर्व प्रसंग से संबंध और कथा की प्रगति दोनों को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: דְבַר
  choice: वचन
  rationale: नबूवत के स्थिर सूत्र דְבַר־יְהוָה में “वचन” अर्थ को स्पष्ट रखते हुए उसके सूत्रात्मक और धर्मवैचारिक महत्व को भी बनाए रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: यह परमेश्वर का व्यक्तिगत नाम है; “याहवे” इब्रानी नाम का आधुनिक हिन्दी लिप्यंतरण है और इसे किसी उपाधि से नहीं बदलता।
- source_word: אֵלַי
  choice: मेरे पास
  rationale: इस नबूवत-सूत्र में “वचन मेरे पास पहुँचा” सहज आधुनिक हिन्दी है और אֵלַי का संबंध ठीक प्रकार व्यक्त करता है।
- source_word: לֵאמֹר
  choice: अगले कथन का परिचय देने वाला विराम-चिह्न (:)
  rationale: इब्रानी infinitive construct आने वाले सीधे कथन का परिचय देता है। हिन्दी में वचन के बाद द्विबिंदु इसका स्वाभाविक और संक्षिप्त समतुल्य है; शाब्दिक रूप पादटिप्पणी में दिया गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: प्रभु / यहोवा
  rationale: मूल पाठ में उपाधि אֲדֹנָי नहीं बल्कि चतुरक्षरी व्यक्तिगत नाम יְהוָה है। “याहवे” उस नाम को प्रत्यक्ष रखता है; “प्रभु” उसे उपाधि में बदल देता, जबकि “यहोवा” अपेक्षाकृत बाद की मिश्रित उच्चारण-परंपरा को दर्शाता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। “वचन मेरे पास पहुँचा” हिन्दी की परिचित नबूवतीय अभिव्यक्ति है। आरम्भिक “फिर” कथात्मक संबंध को स्वाभाविक बनाता है, और द्विबिंदु अगले पद में आने वाले सीधे कथन की ओर संकेत करता है।
