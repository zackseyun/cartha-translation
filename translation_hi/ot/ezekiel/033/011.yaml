  text: אֱמֹ֨ר אֲלֵי/הֶ֜ם חַי אָ֣נִי נְאֻ֣ם אֲדֹנָ֣/י יְהוִ֗ה אִם אֶחְפֹּץ֙ בְּ/מ֣וֹת הָ/רָשָׁ֔ע כִּ֣י אִם בְּ/שׁ֥וּב רָשָׁ֛ע מִ/דַּרְכּ֖/וֹ וְ/חָיָ֑ה שׁ֣וּבוּ שׁ֜וּבוּ מִ/דַּרְכֵי/כֶ֧ם הָ/רָעִ֛ים וְ/לָ֥/מָּה תָמ֖וּתוּ בֵּ֥ית יִשְׂרָאֵֽל־׀׀־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/033/011.yaml
  text: Say to them[a], ‘As I live,’ declares the Lord GOD, ‘I take no pleasure in the death of the wicked, but rather that the wicked turn from his way and live. Turn back, turn back from your evil ways! Why will you die[b], O house of Israel?’
translation:
  language: hi
  text: 'उनसे कहो, ‘प्रभु यहोवा की यह घोषणा है: मेरे जीवन की शपथ, दुष्ट के मरने से मुझे कोई प्रसन्नता नहीं होती, बल्कि इससे होती है कि दुष्ट अपने मार्ग से लौट आए और जीवित रहे। लौट आओ, लौट आओ अपने बुरे मार्गों से! हे इस्राएल के घराने, तुम क्यों मरोगे?’[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “लौट आओ, लौट आओ” की पुनरुक्त आज्ञा अत्यन्त आग्रहपूर्ण है। इब्रानी में यही क्रिया पहले दुष्ट के अपने मार्ग से लौट आने के लिए भी आई है।
    reason: lexical_alternative
lexical_decisions:
- source_word: חַי אָנִי
  choice: मेरे जीवन की शपथ
  rationale: यह एक गंभीर दैवीय शपथ-सूत्र है। यह हिन्दी में स्वाभाविक रहते हुए परमेश्वर के अपने जीवित होने को प्रतिज्ञा का आधार बनाए रखता है।
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: प्रभु यहोवा की यह घोषणा है
  rationale: נְאֻם को भविष्यद्वाणी की औपचारिक घोषणा के रूप में व्यक्त किया गया है; दोनों दैवीय उपाधियों को स्पष्ट रूप से सुरक्षित रखा गया है।
- source_word: אִם אֶחְפֹּץ בְּמוֹת הָרָשָׁע
  choice: दुष्ट के मरने से मुझे कोई प्रसन्नता नहीं होती
  rationale: शपथ के भीतर אִם नकारात्मक दृढ़ कथन व्यक्त करता है। חפץ के प्रसन्नता, आनन्द या इच्छा संबंधी अर्थ-क्षेत्र में से 'प्रसन्नता' भावात्मक आशय को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: כִּי אִם
  choice: बल्कि इससे होती है कि
  rationale: यह 'न यह, बल्कि वह' का स्पष्ट विरोध दर्शाता है और पिछले वाक्य की 'प्रसन्नता' को बिना अनावश्यक वैचारिक विस्तार के आगे ले जाता है।
- source_word: בְּשׁוּב רָשָׁע מִדַּרְכּוֹ
  choice: दुष्ट अपने मार्ग से फिर जाए
  rationale: שׁוּב के मुड़ने या लौटने के रूपक को 'फिर जाए' द्वारा सुरक्षित रखा गया है। एकवचन दुष्ट प्रतिनिधिक रूप में बना रहता है।
- source_word: וְחָיָה
  choice: और जीवित रहे
  rationale: सरल समन्वय मूल पाठ के संक्षिप्त परिणाम अथवा उद्देश्य को बनाए रखता है और संबंध को अधिक निश्चित नहीं करता।
- source_word: שׁוּבוּ שׁוּבוּ
  choice: फिर जाओ, फिर जाओ
  rationale: दोहराई गई आज्ञा का आग्रह सुरक्षित है और यही क्रिया पहले दुष्ट के अपने मार्ग से फिरने के लिए प्रयुक्त हुई है।
- source_word: מִדַּרְכֵיכֶם הָרָעִים
  choice: अपने बुरे मार्गों से
  rationale: यह नैतिक आचरण के लिए प्रयुक्त भविष्यद्वाणी-संबंधी मार्ग-रूपक को स्पष्ट और आधुनिक हिन्दी में बनाए रखता है।
- source_word: וְלָמָּה תָמוּתוּ
  choice: तुम क्यों मरोगे
  rationale: अपूर्ण क्रिया का भविष्याभिमुख प्रश्न सीधी चेतावनी और विनती दोनों का बल सुरक्षित रखता है।
- source_word: בֵּית יִשְׂרָאֵל
  choice: हे इस्राएल के घराने
  rationale: संबोधन और सामूहिक 'घराने' का भविष्यद्वाणी-संबंधी रूपक दोनों बनाए रखे गए हैं।
theological_decisions:
- issue: दुष्ट की मृत्यु के प्रति परमेश्वर का भाव
  choice: परमेश्वर को दुष्ट की मृत्यु से प्रसन्नता न होने और उसके फिरकर जीवित रहने से प्रसन्नता होने का विरोध सीधे व्यक्त किया गया है।
  alternative: חפץ को अधिक इच्छात्मक रूप में 'मैं नहीं चाहता' कहना।
  rationale: मूल पद परमेश्वर के भाव और उसकी भविष्यद्वाणी-संबंधी पुकार को सामने रखता है। अनुवाद व्यापक पूर्वनियति या दैवीय इच्छा-विषयक विवादों का समाधान आरोपित नहीं करता।
- issue: प्रतिनिधिक एकवचन רָשָׁע और बहुवचन श्रोता
  choice: पहले 'दुष्ट' को प्रतिनिधिक एकवचन रखा गया, फिर इस्राएल को बहुवचन में सीधे संबोधित किया गया।
  alternative: पूरे पद को बहुवचन या लिंग-निरपेक्ष सामूहिक कथन में समतल करना।
  rationale: इससे मूल इब्रानी का एकवचन से सामूहिक प्रत्यक्ष संबोधन की ओर संक्रमण सुरक्षित रहता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सार्वजनिक पाठ के योग्य रखी गई है। 'प्रभु यहोवा', 'इस्राएल के घराने' और 'मार्ग' जैसे बाइबिलीय पदबंध सुरक्षित हैं, जबकि वाक्य-विन्यास सामान्य हिन्दी पाठक के लिए स्पष्ट रखा गया है।
