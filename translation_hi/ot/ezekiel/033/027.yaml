id: EZK.33.27
reference: Ezekiel 33:27
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: כֹּֽה תֹאמַ֨ר אֲלֵ/הֶ֜ם כֹּה אָמַ֨ר אֲדֹנָ֣/י יְהוִה֮ חַי אָנִי֒ אִם לֹ֞א אֲשֶׁ֤ר בֶּֽ/חֳרָבוֹת֙ בַּ/חֶ֣רֶב יִפֹּ֔לוּ וַֽ/אֲשֶׁר֙ עַל פְּנֵ֣י הַ/שָּׂדֶ֔ה לַ/חַיָּ֥ה נְתַתִּ֖י/ו לְ/אָכְל֑/וֹ וַ/אֲשֶׁ֛ר בַּ/מְּצָד֥וֹת וּ/בַ/מְּעָר֖וֹת בַּ/דֶּ֥בֶר יָמֽוּתוּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/033/027.yaml
  text: 'Thus you shall say to them[a], ‘Thus says the Lord GOD: As I live, surely those who are in the ruins will fall by the sword, and whoever is on the face of the field I have given to the wild animals to be devoured[c][b], and those who are in the strongholds and in the caves will die by pestilence.’'
translation:
  language: hi
  text: 'तू उनसे ऐसा कहना[a], ‘प्रभु यहोवा यों कहता है: मेरे जीवन की शपथ, जो लोग खंडहरों में हैं वे तलवार से मारे जाएँगे; और जो कोई खुले मैदान में है, उसे मैंने जंगली पशुओं का आहार होने के लिए दे दिया है[b]; और जो लोग गढ़ों और गुफाओं में हैं वे महामारी से मरेंगे[c]।’'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘खंडहरों’ का अर्थ ‘उजड़े हुए स्थानों’ से भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: 'शाब्दिक रूप से: ‘उसे मैंने जंगली पशु को खाने के लिए दे दिया है।’ हिब्रू में एकवचन है, जिसका अर्थ यहाँ प्रत्येक व्यक्ति पर लागू हो सकता है।'
    reason: source_ambiguity
  - marker: c
    text: या ‘मरी से’।
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה תֹאמַר ... כֹּה אָמַר
  choice: तू ... ऐसा कहना ... यों कहता है
  rationale: हिब्रू भविष्यद्वाणी-संदेश की सूत्रबद्ध भाषा को स्वाभाविक और गरिमापूर्ण हिन्दी में बनाए रखता है।
- source_word: אֲדֹנָי יְהוִה
  choice: प्रभु यहोवा
  rationale: दोनों पदों को अलग रखते हुए אֲדֹנָי को ‘प्रभु’ और परमेश्वर के व्यक्तिगत नाम יהוה को प्रचलित हिन्दी रूप ‘यहोवा’ से व्यक्त किया गया है।
- source_word: חַי אָנִי אִם לֹא
  choice: मेरे जीवन की शपथ
  rationale: यह शपथ-सूत्र है; हिन्दी में यह रूप उसके दृढ़ निश्चयात्मक बल को स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: אֲשֶׁר בֶּחֳרָבוֹת
  choice: जो लोग खंडहरों में हैं
  rationale: חֳרָבוֹת उजड़े अथवा ध्वस्त स्थानों को सूचित करता है; प्रसंग में ‘खंडहर’ ठोस और सहज है।
- source_word: בַּחֶרֶב יִפֹּלוּ
  choice: तलवार से मारे जाएँगे
  rationale: शाब्दिक ‘तलवार से गिरेंगे’ के अर्थ को आधुनिक हिन्दी में स्पष्ट करता है, जबकि हिंसक मृत्यु का भाव सुरक्षित रहता है।
- source_word: אֲשֶׁר עַל פְּנֵי הַשָּׂדֶה
  choice: जो कोई खुले मैदान में है
  rationale: עַל פְּנֵי הַשָּׂדֶה का आशय असुरक्षित खुले क्षेत्र में होने से है; हिन्दी में ‘खुले मैदान’ यही भाव स्वाभाविक रूप से देता है।
- source_word: לַחַיָּה נְתַתִּיו לְאָכְלוֹ
  choice: उसे मैंने जंगली पशुओं का आहार होने के लिए दे दिया है
  rationale: एकवचन प्रत्ययों को बनाए रखता है और उनके वितरणात्मक अर्थ को ‘जो कोई ... उसे’ के द्वारा स्पष्ट करता है।
- source_word: בַּמְּצָדוֹת וּבַמְּעָרוֹת
  choice: गढ़ों और गुफाओं में
  rationale: מְצָדוֹת सुरक्षित अथवा किलेबंद शरणस्थानों को दर्शाता है; ‘गढ़’ संक्षिप्त, वर्तमान और प्रसंगानुकूल है।
- source_word: בַּדֶּבֶר יָמוּתוּ
  choice: महामारी से मरेंगे
  rationale: דֶּבֶר व्यापक रूप से फैलने वाली घातक बीमारी अथवा मरी को दर्शाता है; ‘महामारी’ आधुनिक पाठक के लिए स्पष्ट है।
theological_decisions:
- issue: अदोनाय और चतुरक्षरीय दिव्य नाम אֲדֹנָי יְהוִה का अनुवाद
  choice: प्रभु यहोवा
  alternative: प्रभु याहवे / प्रभु परमेश्वर
  rationale: मूल में उपाधि और व्यक्तिगत दिव्य नाम दोनों उपस्थित हैं। ‘प्रभु यहोवा’ दोनों को अलग-अलग सुरक्षित रखता है और हिन्दी बाइबलीय प्रयोग में परिचित है।
- issue: ईश्वरीय शपथ חַי אָנִי אִם לֹא
  choice: मेरे जीवन की शपथ
  alternative: मेरे जीवित रहने की शपथ, निश्चय ही
  rationale: शाब्दिक शर्त-जैसी रचना को हिन्दी में वास्तविक शपथ-सूत्र के रूप में प्रस्तुत किया गया है, बिना उसके न्याय-संबंधी निश्चय को कम किए।
- issue: एकवचन נְתַתִּיו לְאָכְלוֹ का संदर्भ
  choice: जो कोई ... उसे
  alternative: उन्हें ... आहार होने के लिए
  rationale: हिब्रू के व्याकरणिक एकवचन को सुरक्षित रखते हुए उसे प्रत्येक व्यक्ति पर लागू वितरणात्मक कथन के रूप में पढ़ा गया है; सामूहिक बहुवचन भी संभव है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण भविष्यद्वाणी-शैली रखी गई है। संबोधन का एकवचन ‘तू’ हिब्रू व्याकरण और यहेजकेल को दिए गए सीधे आदेश के अनुरूप है। ‘मेरे जीवन की शपथ’ शपथ-सूत्र को मुहावरेदार हिन्दी में व्यक्त करता है।
