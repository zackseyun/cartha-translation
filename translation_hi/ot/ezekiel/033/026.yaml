  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: עֲמַדְתֶּ֤ם עַֽל חַרְבְּ/כֶם֙ עֲשִׂיתֶ֣ן תּוֹעֵבָ֔ה וְ/אִ֛ישׁ אֶת אֵ֥שֶׁת רֵעֵ֖/הוּ טִמֵּאתֶ֑ם וְ/הָ/אָ֖רֶץ תִּירָֽשׁוּ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/033/026.yaml
  text: You stand on your sword[a], you commit abominations, and each of you defiles his neighbor’s wife[b]. Shall you then possess the land?
translation:
  language: hi
  text: तुम अपनी तलवार के भरोसे खड़े हो[a], घृणित काम करते हो, और तुममें से हर एक अपने पड़ोसी की पत्नी को अपवित्र करता है। तो क्या तुम इस देश पर अधिकार करोगे?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “तुम अपनी तलवार पर खड़े हो।” इसका आशय संभवतः हिंसा या हथियार की शक्ति पर भरोसा करना है।
    reason: lexical_alternative
  - marker: b
    text: इसका अनुवाद “और तुम इस देश पर अधिकार करोगे” अथवा “क्या तुम इस देश को विरासत में पाओगे?” भी हो सकता है। इब्रानी में प्रश्नसूचक शब्द नहीं है, पर संदर्भ इसे अलंकारिक प्रश्न के रूप में लेने का समर्थन करता है।
    reason: textual_ambiguity
lexical_decisions:
- source_word: עֲמַדְתֶּם עַל חַרְבְּכֶם
  choice: तुम अपनी तलवार के भरोसे खड़े हो
  rationale: इब्रानी का शाब्दिक बिंब ‘अपनी तलवार पर खड़े होना’ है। हिंदी में ‘तलवार के भरोसे खड़े हो’ उस बिंब को बनाए रखते हुए हिंसक शक्ति पर निर्भरता का संभावित भाव स्पष्ट करता है।
- source_word: חַרְבְּכֶם
  choice: अपनी तलवार
  rationale: חֶרֶב विशेष रूप से ‘तलवार’ है; सामान्य ‘हथियार’ कहने के बजाय ठोस हिंसक बिंब सुरक्षित रखा गया है।
- source_word: עֲשִׂיתֶן תּוֹעֵבָה
  choice: घिनौने काम करते हो
  rationale: एकवचन सामूहिक תּוֹעֵבָה यहाँ निंदनीय आचरण को दर्शाता है। ‘घिनौने काम’ आधुनिक हिंदी में स्वाभाविक है और बार-बार किए जाने वाले आचरण का भाव देता है।
- source_word: וְאִישׁ אֶת אֵשֶׁת רֵעֵהוּ
  choice: और तुममें से हर एक अपने पड़ोसी की पत्नी को
  rationale: אִישׁ का प्रयोग वितरणात्मक है—समूह में ‘हर एक’। רֵעֵהוּ के लिए ‘अपने पड़ोसी’ सामाजिक निकटता और दूसरे पुरुष से संबंध दोनों बनाए रखता है।
- source_word: טִמֵּאתֶם
  choice: अशुद्ध करता है
  rationale: טמא के पिअेल रूप का मूल अर्थ ‘अशुद्ध करना’ है। यह लैंगिक पाप के साथ जुड़ी नैतिक और धार्मिक अशुद्धता दोनों की भाषा को सुरक्षित रखता है।
- source_word: וְהָאָרֶץ תִּירָשׁוּ
  choice: तो क्या तुम इस देश के अधिकारी होगे?
  rationale: ירש में अधिकार पाना, अपने अधीन लेना या विरासत में पाना—ये अर्थ संभव हैं। संदर्भ में ‘देश के अधिकारी होना’ भूमि पर वैध अधिकार के दावे को व्यक्त करता है; प्रश्नवाचक रूप भविष्यद्वक्ता की चुनौती को दर्शाता है।
theological_decisions:
- issue: अंतिम उपवाक्य का प्रश्नवाचक बल
  choice: तो क्या तुम इस देश के अधिकारी होगे?
  alternative: और तुम इस देश के अधिकारी होगे।
  rationale: इब्रानी में स्पष्ट प्रश्नसूचक अव्यय नहीं है, इसलिए व्याकरणतः कथन संभव है; फिर भी व्यापक संदर्भ में यह उनके भूमि-अधिकार के दावे पर रोषपूर्ण अलंकारिक प्रश्न है। अनिश्चितता पादटिप्पणी में बताई गई है।
- issue: अशुद्धता की धार्मिक और नैतिक भाषा
  choice: अपने पड़ोसी की पत्नी को अशुद्ध करता है
  alternative: अपने पड़ोसी की पत्नी के साथ व्यभिचार करता है
  rationale: ‘व्यभिचार’ आशय स्पष्ट करता, पर मूल क्रिया טמא ‘अशुद्ध करना’ कहती है। मूल धार्मिक-नैतिक तनाव को व्याख्यात्मक रूप से सीमित न करते हुए वही शब्दावली रखी गई है।
- issue: वितरणात्मक पुल्लिंग संदर्भ
  choice: तुममें से हर एक अपने पड़ोसी की पत्नी
  alternative: तुममें से प्रत्येक दूसरे व्यक्ति के जीवनसाथी
  rationale: मूल पाठ में אִישׁ तथा ‘उसके पड़ोसी की पत्नी’ स्पष्ट पुल्लिंग-वितरणात्मक रचना है। प्रसंग की विशिष्टता को लिंग-निरपेक्ष बनाकर धुंधला नहीं किया गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य हिंदी पाठक के लिए सुबोध रखी गई है। ‘देश’ यहाँ אֶרֶץ की वाचा-संबंधी भूमि को दर्शाता है। ‘अधिकारी होना’ वैध अधिकार/कब्जे और ‘विरासत पाना’—दोनों अर्थक्षेत्रों के बीच स्वाभाविक हिंदी संतुलन देता है।
