  text: וְ/אַתָּ֣ה בֶן אָדָ֔ם בְּנֵ֣י עַמְּ/ךָ֗ הַ/נִּדְבָּרִ֤ים בְּ/ךָ֙ אֵ֣צֶל הַ/קִּיר֔וֹת וּ/בְ/פִתְחֵ֖י הַ/בָּתִּ֑ים וְ/דִבֶּר חַ֣ד אֶת אַחַ֗ד אִ֤ישׁ אֶת אָחִי/ו֙ לֵ/אמֹ֔ר בֹּֽאוּ נָ֣א וְ/שִׁמְע֔וּ מָ֣ה הַ/דָּבָ֔ר הַ/יּוֹצֵ֖א מֵ/אֵ֥ת יְהוָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/033/030.yaml
  text: And you[a], son of man, the sons of your people who talk about you beside the walls and in the doorways of the houses, each one speaking with another, each man with his brother, saying[b], ‘Come now and hear what the word is that comes from Yahweh.’
translation:
  language: hi
  text: और हे मनुष्य के पुत्र, तुम्हारी प्रजा के लोग दीवारों के पास और घरों के द्वारों पर तुम्हारे विषय में बातें करते हैं[a]। वे आपस में, हर एक अपने भाई से, यह कहते हैं, ‘आओ, सुनो कि वह कौन-सा वचन है जो यहोवा से निकलता है[b]।’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इसका अनुवाद ‘तुमसे बातें करते हैं’ भी हो सकता है; पर प्रसंग में अधिक सम्भावना है कि वे आपस में यहेजकेल के विषय में बातें कर रहे हैं।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, ‘जो यहोवा से निकलता है’; अर्थात वह भविष्यसूचक वचन जो उससे निकलता है।
    reason: lexical_clarification
lexical_decisions:
- source_word: בֶן אָדָם
  choice: मनुष्य के पुत्र
  rationale: यहेजकेल के लिए प्रयुक्त परमेश्वर का नियमित संबोधन है; हिन्दी का स्थापित और स्रोत-सन्निकट रूप इसकी अलंकारिक शक्ति बनाए रखता है।
- source_word: בְּנֵי עַמְּךָ
  choice: तुम्हारे लोगों के बेटे
  rationale: इब्रानी की ठोस, पुल्लिंग अभिव्यक्ति को बनाए रखा गया है, यद्यपि भाव व्यापक रूप से उसके अपने लोगों का है।
- source_word: הַנִּדְבָּרִים בְּךָ
  choice: तुम्हारे विषय में बातें करते हैं
  rationale: דבר के साथ ב यहाँ प्रसंगानुसार यहेजकेल के बारे में आपसी चर्चा को अधिक स्वाभाविक रूप से दर्शाता है; वैकल्पिक अर्थ ‘तुमसे बातें करते हैं’ पादटिप्पणी में रखा गया है।
- source_word: אֵצֶל הַקִּירוֹת וּבְפִתְחֵי הַבָּתִּים
  choice: दीवारों के पास और घरों के द्वारों पर
  rationale: निकटता और घरों के प्रवेश-स्थानों का स्वाभाविक आधुनिक हिन्दी चित्र प्रस्तुत करता है।
- source_word: וְדִבֶּר חַד אֶת אַחַד אִישׁ אֶת אָחִיו
  choice: वे एक-दूसरे से, हर एक अपने भाई से कहते हैं
  rationale: दो समानांतर पारस्परिक वाक्यांशों को स्पष्ट हिन्दी में रखा गया है और ‘भाई’ द्वारा स्रोत की पारिवारिक-सामुदायिक भाषा संरक्षित है।
- source_word: בֹּאוּ נָא וְשִׁמְעוּ
  choice: आओ, अब सुनें
  rationale: נָא के आग्रह/निमंत्रण को ‘अब’ से व्यक्त किया गया है; हिन्दी में प्रत्यक्ष कथन के भीतर समावेशी ‘सुनें’ स्वाभाविक है।
- source_word: מָה הַדָּבָר
  choice: वह कौन-सा वचन है
  rationale: דבר को भविष्यद्वाणी के ‘वचन’ के रूप में रखा गया है, जिससे स्रोत का भविष्यसूचक धार्मिक रजिस्टर बना रहता है।
- source_word: הַיּוֹצֵא מֵאֵת יְהוָה
  choice: जो यहोवा की ओर से निकलता है
  rationale: יצא की गतिशील छवि ‘निकलता है’ से और מאת का उद्गम ‘की ओर से’ द्वारा व्यक्त होता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिन्दी में प्रचलित व्यक्तिगत नाम-रूप द्वारा चतुराक्षरी ईश-नाम को उपाधि से प्रतिस्थापित किए बिना प्रस्तुत किया गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल में व्यक्तिगत वाचा-नाम है। आधुनिक हिन्दी बाइबलीय प्रयोग में व्यापक रूप से पहचाने जाने वाले ‘यहोवा’ को चुना गया; इसे ‘प्रभु’ जैसी उपाधि से नहीं बदला गया।
- issue: הַנִּדְבָּרִים בְּךָ में ב का अर्थ
  choice: तुम्हारे विषय में बातें करते हैं
  alternative: तुमसे बातें करते हैं
  rationale: आगे लोगों की आपसी बातचीत का वर्णन होने के कारण ‘तुम्हारे विषय में’ अधिक संभावित है, पर व्याकरणगत विकल्प पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और बोलचाल में समझने योग्य रखी गई है। इब्रानी की पुनरुक्ति को पूर्णतः हटाए बिना वाक्य-विन्यास हिन्दी के अनुरूप किया गया है। सभी पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित हैं।
