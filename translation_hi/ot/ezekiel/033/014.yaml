  text: और जब मैं दुष्ट मनुष्य से कहता हूँ, ‘तू निश्चय ही मरेगा,’ और वह अपने पाप से फिरकर न्याय और धार्मिकता का आचरण करता है[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “और वह अपने पाप से फिरकर वही करता है जो न्यायसंगत और सही है।”
    reason: מִשְׁפָּט וּצְדָקָה को ‘न्याय और धार्मिकता’ के बजाय ‘जो न्यायसंगत और सही है’ के रूप में भी व्यक्त किया जा सकता है।
lexical_decisions:
- source_word: וּבְאָמְרִי
  choice: और जब मैं ... कहता हूँ
  rationale: בְּ के साथ क्रियार्थक संज्ञा और प्रथम पुरुष प्रत्यय यहाँ कालवाचक अर्थ देते हैं; इसलिए आधुनिक हिन्दी में ‘जब मैं ... कहता हूँ’ स्वाभाविक और सटीक है।
- source_word: לָרָשָׁע
  choice: दुष्ट मनुष्य से
  rationale: רָשָׁע यहाँ एक दुष्ट व्यक्ति के लिए पुल्लिंग एकवचन है। ‘दुष्ट मनुष्य’ उसके प्रतिनिधिक और व्याकरणिक रूप को बनाए रखता है।
- source_word: מוֹת תָּמוּת
  choice: तू निश्चय ही मरेगा
  rationale: क्रियार्थक निरपेक्ष रूप के साथ सीमित क्रिया मृत्यु की निश्चितता पर बल देती है; ‘निश्चय ही’ उस बल को सहज हिन्दी में व्यक्त करता है।
- source_word: וְשָׁב
  choice: और वह ... से फिरकर
  rationale: וְ का सीधा अर्थ ‘और’ रखा गया है। שׁוּב यहाँ शारीरिक वापसी नहीं, बल्कि पाप से मुड़ने का भाव देता है; संयुक्त क्रिया ‘फिरकर’ अगले कार्य से स्वाभाविक रूप से जुड़ती है।
- source_word: מֵחַטָּאתוֹ
  choice: अपने पाप से
  rationale: एकवचन संज्ञा और तृतीय पुरुष एकवचन प्रत्यय का सीधा, स्वाभाविक हिन्दी रूप ‘अपने पाप से’ है।
- source_word: וְעָשָׂה
  choice: काम करता है
  rationale: עשה का सामान्य अर्थ ‘करना’ है। संज्ञात्मक नैतिक युग्म के साथ हिन्दी में ‘... के काम करता है’ अर्थ को स्पष्ट और स्वाभाविक रखता है।
- source_word: מִשְׁפָּט
  choice: न्याय
  rationale: इस नैतिक प्रसंग में शब्द न्यायपूर्ण आचरण को सूचित करता है, केवल न्यायिक निर्णय को नहीं।
- source_word: וּצְדָקָה
  choice: धार्मिकता
  rationale: यह शब्द सही और धर्मसम्मत आचरण का अर्थ रखता है। ‘धार्मिकता’ इसे מִשְׁפָּט से अलग रखते हुए उसके नैतिक-धर्मवैचारिक भार को सुरक्षित रखता है।
theological_decisions:
- issue: दुष्ट व्यक्ति के लिए प्रतिनिधिक पुल्लिंग एकवचन
  choice: दुष्ट मनुष्य
  alternative: दुष्ट व्यक्ति
  rationale: इब्रानी रूप पुल्लिंग एकवचन है और एक प्रतिनिधिक व्यक्ति को संबोधित करता है; अतः हिन्दी में पुल्लिंग रूप बनाए रखा गया है।
- issue: מִשְׁפָּט וּצְדָקָה के नैतिक युग्म को अलग-अलग व्यक्त करना
  choice: न्याय और धार्मिकता
  alternative: जो न्यायसंगत और सही है
  rationale: दोनों इब्रानी संज्ञाओं का अपना अर्थगत और धर्मवैचारिक स्वर है। उन्हें दो अलग हिन्दी पदों में रखना मूल की बनावट और तनाव को बेहतर सुरक्षित करता है।
- issue: וְשָׁב में संयोजक का संबंध
  choice: और वह ... फिरकर
  alternative: परन्तु वह ... से फिरता है
  rationale: इब्रानी में सामान्य संयोजक וְ है। प्रसंग में विरोध का भाव समझा जा सकता है, पर मूल में उसे स्पष्ट रूप से ‘परन्तु’ नहीं कहा गया; इसलिए ‘और’ रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। प्रत्यक्ष संबोधन में ‘तू’ इब्रानी एकवचन की सीधाई और गंभीर चेतावनी को बनाए रखता है। पद अगले वाक्यांश में जारी रहता है, इसलिए अंत में अल्पविराम रखा गया है। फुटनोट चिह्न उस पूरे वैकल्पिक वाक्यांश के अंत में रखा गया है जिससे वह संबंधित है।
