  text: בְּ/שׁוּב צַדִּ֥יק מִ/צִּדְקָת֖/וֹ וְ/עָ֣שָׂה עָ֑וֶל וּ/מֵ֖ת בָּ/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/033/018.yaml
  text: When a righteous man turns from his righteousness and does injustice[b][a], he shall die because of them.
translation:
  language: hi
  text: जब कोई धर्मी मनुष्य अपनी धार्मिकता से फिरकर अन्याय[a] करता है, तो वह उन कामों के कारण मर जाएगा।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “बुराई,” “कुटिलता,” अथवा “अधर्म”।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से “उनमें”; भाव यह है कि वह उन अन्यायपूर्ण कामों के कारण मरता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּשׁוּב
  choice: जब ... फिरकर
  rationale: בְּ के साथ שוב का infinitive construct समयसूचक परिस्थिति व्यक्त करता है—‘जब वह फिरता है।’ ‘जब ... फिरकर’ आधुनिक हिन्दी में स्वाभाविक है और किसी पूर्व मार्ग से मुड़ जाने का भाव बनाए रखता है।
- source_word: צַדִּיק
  choice: कोई धर्मी मनुष्य
  rationale: यह पुल्लिंग एकवचन विशेषण संज्ञा के रूप में प्रयुक्त है और एक धर्मी पुरुष को दर्शाता है। ‘कोई’ कथन के सामान्य, नीतिवचन-सदृश स्वर को स्पष्ट करता है।
- source_word: מִצִּדְקָתוֹ
  choice: अपनी धार्मिकता से
  rationale: צְדָקָה यहाँ उस मनुष्य की धार्मिक दशा और आचरण को सूचित करता है। ‘धार्मिकता’ मूल शब्द से निकटता रखते हुए नैतिक अर्थ को सुरक्षित रखती है।
- source_word: וְעָשָׂה עָוֶל
  choice: अन्याय करता है
  rationale: עשה और עָוֶל का मेल गलत या अन्यायपूर्ण काम करने को व्यक्त करता है। ‘अन्याय करता है’ सुबोध है और ‘धार्मिकता’ के साथ नैतिक विरोध को बनाए रखता है।
- source_word: וּמֵת
  choice: तो ... मर जाएगा
  rationale: इस सामान्य शर्त-परिणाम वाले कथन में रूप परिणाम को व्यक्त करता है। ‘तो ... मर जाएगा’ हिन्दी में उस निश्चित परिणाम को स्वाभाविक और गंभीर ढंग से प्रस्तुत करता है।
- source_word: בָּהֶם
  choice: उन्हीं कामों के कारण
  rationale: शाब्दिक रूप ‘उनमें’ है, पर सन्दर्भ में बहुवचन सर्वनाम अन्यायपूर्ण कामों की ओर संकेत करता है और कारणात्मक भाव देता है। ‘उन्हीं कामों के कारण’ हिन्दी में अभिप्राय स्पष्ट करता है; शाब्दिक रूप पादटिप्पणी में रखा गया है।
theological_decisions:
- issue: क्या यह पद उद्धार खोने की बात करता है या वाचा के भीतर सांसारिक न्याय और मृत्यु की
  choice: 'अनुवाद केवल पद के कथन को रखता है: धर्मी मनुष्य धार्मिकता से फिरकर अन्याय करे, तो उन कामों के कारण मरेगा।'
  alternative: इसे या तो उद्धार से पतन का निर्णायक सिद्धान्त, या केवल सांसारिक मृत्यु और वाचागत दण्ड का कथन माना जा सकता है।
  rationale: इब्रानी पाठ नैतिक पलटाव और उसके फलस्वरूप मृत्यु बताता है, पर बाद की धर्मवैज्ञानिक श्रेणियों में उसका स्वरूप निश्चित नहीं करता। इसलिए अस्पष्टता और धर्मवैज्ञानिक तनाव को अनसुलझा रखा गया है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘धर्मी मनुष्य’ मूल के पुल्लिंग एकवचन को बनाए रखता है; ‘उन्हीं कामों’ से בָּהֶם का बहुवचन सन्दर्भ स्पष्ट होता है।
