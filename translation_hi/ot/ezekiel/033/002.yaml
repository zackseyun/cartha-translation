source:
  edition: WLC
  text: בֶּן אָדָ֗ם דַּבֵּ֤ר אֶל בְּנֵֽי עַמְּ/ךָ֙ וְ/אָמַרְתָּ֣ אֲלֵי/הֶ֔ם אֶ֕רֶץ כִּֽי אָבִ֥יא עָלֶ֖י/הָ חָ֑רֶב וְ/לָקְח֨וּ עַם הָ/אָ֜רֶץ אִ֤ישׁ אֶחָד֙ מִ/קְצֵי/הֶ֔ם וְ/נָתְנ֥וּ אֹת֛/וֹ לָ/הֶ֖ם לְ/צֹפֶֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/033/002.yaml
  text: Son of man[a], speak to the sons of your people and say to them, ‘If I bring a sword upon a land, and the people of the land take one man from among them and appoint him as their watchman,’
translation:
  language: hi
  text: “हे मनुष्य के पुत्र, अपने लोगों से बोल और उनसे कह, ‘यदि मैं किसी देश पर तलवार[a] ले आऊँ, और उस देश के लोग अपने बीच में से एक पुरुष को चुनकर उसे अपना पहरेदार ठहराएँ,’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात् युद्ध या दंड की तलवार। इब्रानी में ‘तलवार’ युद्ध अथवा न्याय-दंड का प्रचलित बिंब है।
    reason: रूपक के संभावित अर्थ को स्पष्ट करना, जबकि मुख्य पाठ में स्रोत का ठोस बिंब सुरक्षित रखना।
lexical_decisions:
- source_word: בֶּן אָדָם
  choice: हे मनुष्य के पुत्र
  rationale: यहेजकेल को दिए जाने वाले इस विशिष्ट संबोधन के परिचित रूप और साहित्यिक कार्य को बनाए रखता है; यहाँ यह सीधे एक व्यक्ति, अर्थात् नबी, को संबोधित करता है।
- source_word: בְּנֵי עַמְּךָ
  choice: अपने लोगों से
  rationale: शाब्दिक ‘अपने लोगों के पुत्रों से’ आधुनिक हिन्दी में अस्वाभाविक और वास्तविक वंशजों का भ्रामक संकेत दे सकता है। इब्रानी मुहावरे का सामूहिक अर्थ स्वाभाविक हिन्दी में व्यक्त किया गया है।
- source_word: אֶרֶץ
  choice: किसी देश
  rationale: निर्दिष्ट देश के बजाय एक सामान्य काल्पनिक परिस्थिति प्रस्तुत की गई है; ‘किसी देश’ हिन्दी में इस अनिश्चित अर्थ को स्पष्ट करता है।
- source_word: כִּי
  choice: यदि
  rationale: यहाँ כִּי कारण नहीं, बल्कि एक काल्पनिक परिस्थिति आरम्भ करता है; इसलिए ‘यदि’ उपयुक्त है।
- source_word: חָרֶב
  choice: तलवार
  rationale: ठोस इब्रानी बिंब को बनाए रखा गया है। प्रसंग में यह युद्ध या दंड का संकेत हो सकता है, पर मुख्य पाठ में उसकी व्याख्या करके ‘युद्ध’ नहीं किया गया।
- source_word: עַם הָאָרֶץ
  choice: उस देश के लोग
  rationale: यहाँ अभिव्यक्ति सामान्य जनसमुदाय के अर्थ में है, किसी तकनीकी पदवी के रूप में नहीं।
- source_word: אִישׁ אֶחָד
  choice: एक पुरुष
  rationale: इब्रानी पद स्पष्ट रूप से पुल्लिंग एकवचन है; ‘पुरुष’ स्रोत के लिंग-संकेत को सुरक्षित रखता है।
- source_word: מִקְצֵיהֶם
  choice: अपने बीच में से
  rationale: इस मुहावरे का आशय उन्हीं के समूह में से किसी को चुनना है; शाब्दिक ‘उनके सिरों में से’ हिन्दी में अर्थपूर्ण नहीं होगा।
- source_word: וְנָתְנוּ אֹתוֹ לָהֶם לְצֹפֶה
  choice: उसे अपना पहरेदार ठहराएँ
  rationale: शाब्दिक रूप ‘उसे अपने लिए पहरेदार के रूप में रखें’ का संस्थागत आशय स्वाभाविक हिन्दी में व्यक्त होता है और צֹפֶה की महत्त्वपूर्ण भूमिका ‘पहरेदार’ के रूप में बनी रहती है।
theological_decisions:
- issue: लिंग-सूचक प्रतिनिधिक भाषा
  choice: אִישׁ אֶחָד के लिए ‘एक पुरुष’ रखा गया, पर בְּנֵי עַמְּךָ को अर्थानुसार ‘अपने लोगों’ किया गया।
  alternative: दोनों को शाब्दिक रूप से ‘अपने लोगों के पुत्रों’ और ‘एक पुरुष’ करना।
  rationale: אִישׁ यहाँ सचमुच एक पुरुष पहरेदार को सूचित करता है, जबकि בְּנֵי עַמְּךָ एक सामूहिक इब्रानी मुहावरा है। हिन्दी में ‘लोगों के पुत्र’ वास्तविक पुत्रों का गलत बोध देगा; इसलिए जहाँ लिंग अर्थगत है वहाँ उसे रखा गया और जहाँ मुहावरेगत है वहाँ सामूहिक अर्थ दिया गया।
- issue: तलवार का अर्थ
  choice: मुख्य पाठ में ‘तलवार’ का बिंब बनाए रखा गया।
  alternative: इसे व्याख्यात्मक रूप से ‘युद्ध’ या ‘दंड’ कहना।
  rationale: प्रसंग युद्ध अथवा परमेश्वर के दंड की ओर संकेत कर सकता है, पर स्रोत का ठोस बिंब दोनों अर्थों की गुंजाइश रखता है; अनुवाद उस तनाव को पहले से तय नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। परमेश्वर से नबी के संबोधन में पारंपरिक एकवचन शैली (‘बोल’, ‘कह’) और ‘मनुष्य के पुत्र’ का परिचित बाइबिलीय पद रखा गया है। वाक्य अगले पद में जारी रहने वाली काल्पनिक परिस्थिति है, इसलिए अंत में अल्पविराम रखा गया है।
