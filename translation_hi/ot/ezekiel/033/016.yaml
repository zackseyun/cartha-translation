base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/033/016.yaml
  text: None of the sins that he committed will be remembered against him[a]; he has done justice and righteousness; he shall surely live.
translation:
  language: hi
  text: उसने जो पाप किए थे, उनमें से कोई भी उसके विरुद्ध स्मरण नहीं किया जाएगा[a]; उसने न्याय और धार्मिकता का आचरण किया है; वह निश्चय ही जीवित रहेगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसके लेखे नहीं गिना जाएगा।” इब्रानी में शाब्दिक रूप से “उसके लिए स्मरण नहीं किया जाएगा” है, जिसका इस प्रसंग में न्यायिक भाव है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל חטאתו אֲשֶׁר חָטָא
  choice: उसने जो पाप किए थे, उनमें से कोई भी
  rationale: כָּל के साथ सामूहिक एकवचन חטאתו और बहुवचन क्रिया का भाव वितरणात्मक है। हिन्दी में यह रचना प्रत्येक पूर्व पाप के निषेध को स्वाभाविक और स्पष्ट ढंग से व्यक्त करती है।
- source_word: לֹא תִזָּכַרְנָה לוֹ
  choice: उसके विरुद्ध स्मरण नहीं किया जाएगा
  rationale: זכר के निफ़अल रूप और לוֹ का यहाँ न्यायिक संदर्भ है। ‘उसके विरुद्ध’ यह दिखाता है कि वे पाप उसके दोष के रूप में सामने नहीं रखे जाएँगे, जबकि ‘स्मरण’ मूल क्रिया की छवि को बनाए रखता है।
- source_word: מִשְׁפָּט וּצְדָקָה
  choice: न्याय और धार्मिकता
  rationale: यह प्रचलित भविष्यद्वक्ताई युग्म न्यायपूर्ण और सही आचरण को व्यक्त करता है। ये पद दोनों संज्ञाओं का नैतिक और धर्मवैचारिक भार सुरक्षित रखते हैं।
- source_word: עָשָׂה
  choice: के काम किए हैं
  rationale: इस प्रसंग में עשה का अर्थ नैतिक आचरण करना है। ‘काम किए हैं’ मूल के निकट रहते हुए हिन्दी में संज्ञा-युग्म के साथ स्वाभाविक अभिव्यक्ति देता है।
- source_word: חָיוֹ יִחְיֶה
  choice: वह निश्चय ही जीवित रहेगा
  rationale: क्रिया के साथ infinitive absolute उसके अर्थ पर बल देकर जीवन की निश्चितता व्यक्त करता है; ‘निश्चय ही’ उस बल को सहज आधुनिक हिन्दी में सुरक्षित रखता है।
theological_decisions:
- issue: पापों को स्मरण न किए जाने का न्यायिक भाव
  choice: उसके विरुद्ध स्मरण नहीं किया जाएगा
  alternative: उसके लेखे नहीं गिना जाएगा
  rationale: चुना हुआ पाठ पूर्व पापों को उस व्यक्ति के विरुद्ध न रखने का न्यायिक आशय व्यक्त करता है और साथ ही मूल की ‘स्मरण’ संबंधी भाषा को बनाए रखता है। वैकल्पिक पाठ न्यायिक परिणाम को अधिक प्रत्यक्ष बनाता है, पर मूल रूपक को छोड़ देता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, स्पष्ट शैली रखी गई है। ‘स्मरण’ मूल इब्रानी रूपक को सुरक्षित रखता है, जबकि ‘उसके विरुद्ध’ प्रसंग के न्यायिक अर्थ को स्पष्ट करता है।
