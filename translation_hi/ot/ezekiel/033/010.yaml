base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/033/010.yaml
  text: 'And you[a], son of man, say to the house of Israel, ‘Thus you have said: “Surely our transgressions and our sins are upon us, and in them we are wasting away; so how can we live?”’'
translation:
  language: hi
  text: 'और हे मनुष्य के पुत्र, इस्राएल के घराने से कहो, ‘तुम यों कहते हो: “निश्चय ही हमारे अपराध और हमारे पाप हम पर हैं, और उन्हीं में हम क्षीण होते जा रहे हैं[a]; फिर हम कैसे जीवित रह सकते हैं?”’'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “गलते जा रहे हैं,” “सड़ते जा रहे हैं,” अथवा “मुरझाते जा रहे हैं।” इब्रानी क्रिया दोष और न्याय के बोझ तले क्षय होने, गलने या दुर्बल पड़ते जाने का भाव दे सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶן אָדָם
  choice: मनुष्य के पुत्र
  rationale: यहेजकेल में प्रयुक्त स्थिर भविष्यद्वाणी-संबंधी संबोधन को बनाए रखता है; इसका भाव मनुष्य या नश्वर जन है, पर परिचित इब्रानी रूपक को सुरक्षित रखा गया है।
- source_word: בֵּית יִשְׂרָאֵל
  choice: इस्राएल का घराना
  rationale: सामूहिक वाचा-संबंधी अभिव्यक्ति और ‘घर’ की इब्रानी छवि को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: כֵּן אֲמַרְתֶּם
  choice: तुम लोग यह कहते आए हो
  rationale: कथन की विषयवस्तु का परिचय देता है और पूर्ण क्रिया को ऐसे वर्तमान तक चले आ रहे कथन के रूप में व्यक्त करता है; केवल ‘यों कहा है’ की अपेक्षा आधुनिक हिन्दी में अधिक सहज है।
- source_word: פְשָׁעֵינוּ
  choice: हमारे अपराध
  rationale: जानबूझकर किए गए उल्लंघन अथवा विद्रोह की नैतिक गंभीरता व्यक्त करता है, जबकि साथ आने वाले ‘पाप’ से भेद भी बनाए रखता है।
- source_word: חַטֹּאתֵינוּ
  choice: हमारे पाप
  rationale: इब्रानी युग्म को समेटने के बजाय उसके दूसरे पद का सीधा और सामान्य धार्मिक-नैतिक अर्थ सुरक्षित रखता है।
- source_word: עָלֵינוּ
  choice: हम पर हैं
  rationale: दोष और उसके परिणाम के बोझ के वक्ताओं पर होने की मूल स्थानिक छवि बनाए रखता है।
- source_word: וּבָם
  choice: उन्हीं में
  rationale: ב के मूल ‘में’ अर्थ और उस दशा अथवा क्षेत्र की अस्पष्टता को सुरक्षित रखता है; ‘उनके कारण’ कहकर कारणात्मक अर्थ को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: נְמַקִּים
  choice: गलते जा रहे हैं
  rationale: निरंतर क्षय, गलने और दुर्बल होते जाने की तीव्र छवि व्यक्त करता है; वैकल्पिक अर्थ फुटनोट में दिया गया है।
- source_word: וְאֵיךְ נִחְיֶה
  choice: फिर हम कैसे जीवित रहें?
  rationale: दोष और क्षय से निकलने वाले निराशापूर्ण निष्कर्ष को स्वाभाविक हिन्दी में व्यक्त करता है, और जीवित बचने की संभावना पर प्रश्न बनाए रखता है।
theological_decisions:
- issue: लोगों का कथन केवल पाप-स्वीकार है या न्याय के अधीन निराशा भी
  choice: इसे दोष की स्वीकृति और उसके परिणामों के बीच निराशापूर्ण पुकार—‘फिर हम कैसे जीवित रहें?’—दोनों के रूप में रखा गया है।
  alternative: इसे आशाहीनता पर बल दिए बिना केवल अंगीकार के रूप में प्रस्तुत करना।
  rationale: ‘गलते जा रहे हैं’ और अंतिम प्रश्न दिखाते हैं कि कथन साधारण अंगीकार से अधिक है। पद स्वयं जिस तनाव को रखता है, अनुवाद उसे क्षमा या मन-फिराव के विषय में आगे का निष्कर्ष जोड़कर हल नहीं करता।
