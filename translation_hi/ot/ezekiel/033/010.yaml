  register: आधुनिक मानक हिन्दी में गरिमापूर्ण भविष्यद्वाणी-संबंधी शैली रखी गई है। ‘मनुष्य के पुत्र’ और ‘इस्राएल का घराना’ मूल की स्थापित छवियाँ बचाते हैं; ‘तुम लोग’ बहुवचन को स्पष्ट करता है। मुख्य पाठ का [a] चिह्न संबंधित शब्दसमूह के ठीक बाद रखा गया है।
