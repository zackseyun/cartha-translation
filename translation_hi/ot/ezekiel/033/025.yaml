base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/033/025.yaml
  text: 'Therefore say to them[a], ‘Thus says the Lord GOD: You eat with the blood, and you lift up your eyes to your idols, and you shed blood[c][b]; shall you then possess the land?’'
translation:
  language: hi
  text: 'इसलिए उनसे कहो, ‘प्रभु यहोवा यों कहता है: तुम लहू समेत खाते हो[a], अपनी मूर्तियों की ओर आँखें उठाते हो[b] और लहू बहाते हो; तो क्या तुम इस देश के अधिकारी बनोगे[c]?’'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “तुम लहू पर/लहू के साथ खाते हो”; सम्भवतः आशय ऐसा मांस खाने से है जिसमें लहू रह गया हो।
    reason: lexical_alternative
  - marker: b
    text: यहाँ “मूर्तियों” के लिए प्रयुक्त इब्रानी शब्द तिरस्कार और घृणा का भाव रखता है।
    reason: cultural_note
  - marker: c
    text: या, “और क्या तुम इस देश के अधिकारी बनोगे?” अंतिम वाक्यांश एक रोषपूर्ण आलंकारिक चुनौती के रूप में समझा जा सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: לָכֵן
  choice: इसलिए
  rationale: यह पिछले कथन से निष्कर्ष निकालने वाला सामान्य संबंधबोधक है।
- source_word: אֱמֹר אֲלֵיהֶם
  choice: उनसे कहो
  rationale: यह नबी को दिया गया सीधा वचनादेश है और इब्रानी वाक्य-विन्यास को स्वाभाविक हिन्दी में रखता है।
- source_word: כֹּה אָמַר אֲדֹנָי יְהוִה
  choice: प्रभु यहोवा यों कहता है
  rationale: यह भविष्यद्वाणी का पारंपरिक संदेशवाहक सूत्र है; אֲדֹנָי को ‘प्रभु’ और परमेश्वर के नाम יהוה को ‘यहोवा’ से व्यक्त किया गया है।
- source_word: עַל הַדָּם תֹּאכֵלוּ
  choice: तुम लहू समेत मांस खाते हो
  rationale: शाब्दिक ‘लहू पर/साथ खाते हो’ हिन्दी में अस्पष्ट होगा। प्रसंग सम्भवतः उस मांस को खाने का है जिसमें लहू बना हुआ है; ‘मांस’ अर्थ में निहित वस्तु को स्पष्ट करता है, जबकि पादटिप्पणी मूल अभिव्यक्ति बचाती है।
- source_word: וְעֵינֵיכֶם תִּשְׂאוּ אֶל גִּלּוּלֵיכֶם
  choice: अपनी मूर्तियों की ओर आँखें उठाते हो
  rationale: आँखें उठाने की इब्रानी छवि को सुरक्षित रखते हुए यह उपासना या आशा से उनकी ओर देखने का भाव व्यक्त करता है।
- source_word: גִּלּוּלֵיכֶם
  choice: अपनी मूर्तियों
  rationale: यहेजकेल का शब्द तिरस्कारपूर्ण है। मुख्य पाठ में स्वाभाविक ‘मूर्तियाँ’ रखा गया है और उसका अपमानसूचक भाव पादटिप्पणी में बताया गया है।
- source_word: וְדָם תִּשְׁפֹּכוּ
  choice: और लहू बहाते हो
  rationale: यह हिंसा और हत्या के लिए प्रयुक्त सामान्य इब्रानी मुहावरे का स्वाभाविक हिन्दी समतुल्य है।
- source_word: וְהָאָרֶץ תִּירָשׁוּ
  choice: तो क्या तुम इस देश के अधिकारी बने रहोगे?
  rationale: संदर्भ में अपूर्ण क्रिया एक रोषपूर्ण आलंकारिक प्रश्न है। ‘अधिकारी बने रहोगे’ ירש के भूमि पर अधिकार रखने/पाने के भाव और वर्तमान दावे दोनों को व्यक्त करता है।
theological_decisions:
- issue: अदोनाय और יהוה के संयुक्त संबोधन का अनुवाद
  choice: प्रभु यहोवा
  alternative: प्रभु याहवे / परमेश्वर यहोवा
  rationale: ‘प्रभु’ אֲדֹנָי को और ‘यहोवा’ चार-अक्षरीय व्यक्तिगत नाम יהוה को अलग-अलग दर्शाता है; किसी संप्रदायगत व्याख्या को नहीं जोड़ा गया।
- issue: अंतिम उपवाक्य का वाक्य-बल
  choice: आलंकारिक प्रश्न—‘तो क्या तुम इस देश के अधिकारी बने रहोगे?’
  alternative: कथन—‘और तुम इस देश के अधिकारी बनोगे’
  rationale: व्याकरणतः संयोजक और अपूर्ण क्रिया है, पर निकट संदर्भ में उनके पाप और भूमि पर उनके दावे का विरोध एक रोषपूर्ण चुनौती बनाता है। प्रश्नरूप इसी प्रवचन-बल को स्पष्ट करता है, जबकि पादटिप्पणी औपचारिक विकल्प बताती है।
- issue: ירש में अधिकार पाने या बनाए रखने का भाव
  choice: अधिकारी बने रहोगे
  alternative: अधिकारी बनोगे / देश को विरासत में पाओगे
  rationale: भूमि में रह रहे श्रोताओं के दावे के संदर्भ में ‘बने रहोगे’ स्वाभाविक है, पर इब्रानी क्रिया स्वयं अधिकार पाने या रखने—दोनों की गुंजाइश देती है; यह तनाव पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सीधी भविष्यद्वाणी शैली रखी गई है। ‘लहू’ बाइबलीय-साहित्यिक प्रसंग में सहज और ‘खून’ से अधिक गरिमापूर्ण है। ‘देश’ הָאָרֶץ के यहाँ प्रतिज्ञात भूभाग के संदर्भ को स्वाभाविक ढंग से व्यक्त करता है। सभी पादटिप्पणी चिह्न मुख्य पाठ में उपस्थित हैं।
