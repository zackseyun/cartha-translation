source:
  edition: WLC
  text: חֲבֹ֨ל יָשִׁ֤יב רָשָׁע֙ גְּזֵלָ֣ה יְשַׁלֵּ֔ם בְּ/חֻקּ֤וֹת הַֽ/חַיִּים֙ הָלַ֔ךְ לְ/בִלְתִּ֖י עֲשׂ֣וֹת עָ֑וֶל חָי֥וֹ יִֽחְיֶ֖ה לֹ֥א יָמֽוּת׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/033/015.yaml
  text: if the wicked man restores the pledge[a], repays what he has stolen, walks in the statutes of life without doing injustice, he shall surely live[b]; he shall not die.
translation:
  language: hi
  text: यदि दुष्ट व्यक्ति ऋण की जमानत के रूप में ली हुई वस्तु लौटा दे[a], जो उसने लूटा है उसकी भरपाई करे, और अन्याय किए बिना जीवन की विधियों के अनुसार चले, तो वह निश्चय ही जीवित रहेगा[b]; वह नहीं मरेगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “गिरवी ली गई वस्तु लौटा दे।” इब्रानी में आशय उस वस्तु से है जो ऋण की जमानत के रूप में ली गई थी।
    reason: lexical_alternative
  - marker: b
    text: “जीवन की विधियाँ” का अनुवाद “जीवन देने वाली विधियाँ” या “वे विधियाँ जो जीवन की ओर ले जाती हैं” भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: חֲבֹל
  choice: गिरवी रखी वस्तु
  rationale: यह शब्द ऋण की जमानत के रूप में रखी गई वस्तु को दर्शाता है। यह चयन कानूनी-आर्थिक अर्थ को आधुनिक और सहज हिन्दी में स्पष्ट करता है।
- source_word: יָשִׁיב
  choice: लौटा दे
  rationale: गिरवी की वस्तु उसके अधिकारी को वापस करने के भाव के लिए यह स्वाभाविक हिन्दी है।
- source_word: רָשָׁע
  choice: दुष्ट जन
  rationale: मूल में विशेषण संज्ञा के रूप में एकवचन प्रतिनिधि व्यक्ति के लिए आया है; ‘दुष्ट जन’ इस रूप और गरिमापूर्ण आधुनिक शैली को बनाए रखता है।
- source_word: גְּזֵלָה יְשַׁלֵּם
  choice: जो उसने लूटा है उसकी भरपाई करे
  rationale: संज्ञा लूट से ली गई वस्तु को और पिएल क्रिया प्रतिपूर्ति को व्यक्त करती है। ‘भरपाई करे’ केवल वस्तु लौटाने की अपेक्षा प्रतिपूर्ति के व्यापक भाव को सुरक्षित रखता है।
- source_word: בְּחֻקּוֹת הַחַיִּים
  choice: जीवन की विधियों पर
  rationale: 'सम्बन्धवाचक पदबंध की वास्तविक अस्पष्टता बनाए रखी गई है: ये जीवन से सम्बद्ध, जीवन की ओर ले जाने वाली, अथवा जीवन देने वाली विधियाँ हो सकती हैं। ‘पर चले’ हिन्दी में आचरण के मार्ग की छवि को स्वाभाविक बनाता है।'
- source_word: הָלַךְ
  choice: चले
  rationale: चलने की बाइबलीय रूपक-छवि को रखते हुए जीवन-आचरण का अर्थ व्यक्त किया गया है।
- source_word: לְבִלְתִּי עֲשׂוֹת עָוֶל
  choice: अन्याय किए बिना
  rationale: यह निषेधात्मक infinitival construction गलत अथवा अन्यायपूर्ण काम से बचे रहने को दर्शाता है; कानूनी-पुनर्स्थापन प्रसंग में ‘अन्याय’ उपयुक्त है।
- source_word: חָיוֹ יִחְיֶה
  choice: निश्चय जीवित रहेगा
  rationale: क्रिया के साथ infinitive absolute की प्रबल निश्चितता को ‘निश्चय’ द्वारा व्यक्त किया गया है।
- source_word: לֹא יָמוּת
  choice: वह नहीं मरेगा
  rationale: निषेधात्मक अपूर्ण क्रिया का सीधा और स्वाभाविक भविष्यकालीन अनुवाद है।
theological_decisions:
- issue: प्रतिज्ञा में ‘जीवित रहने’ और ‘न मरने’ का आशय
  choice: ‘वह निश्चय जीवित रहेगा; वह नहीं मरेगा’ के सीधे कथन को बनाए रखना
  alternative: इसे केवल शारीरिक जीवन, वाचा में पुनर्स्थापना, या युगांतकालीन जीवन के रूप में स्पष्ट करना
  rationale: इब्रानी कथन जीवन के आयाम को सीमित नहीं करता। अनुवाद किसी एक धर्मवैज्ञानिक अर्थ को थोपे बिना उसकी वाचागत और अस्तित्वगत सम्भावनाओं सहित तनाव को सुरक्षित रखता है।
- issue: ‘जीवन की विधियों’ में सम्बन्ध का अर्थ
  choice: सम्बन्धवाचक पदबंध को अपेक्षाकृत औपचारिक रूप में रखना
  alternative: ‘जीवन देने वाली विधियाँ’ अथवा ‘वे विधियाँ जो जीवन की ओर ले जाती हैं’
  rationale: मूल यह स्पष्ट नहीं करता कि विधियाँ जीवन की विशेषता रखती हैं, जीवन प्रदान करती हैं, या जीवन की ओर ले जाती हैं; मुख्य पाठ इस अस्पष्टता को नहीं सुलझाता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज और कानूनी-भविष्यद्वाणीपरक शैली रखी गई है। ‘चलना’ जीवन-आचरण की मूल रूपक-छवि को बचाता है। सभी सर्वनाम मूल के प्रतिनिधि पुल्लिंग एकवचन के अनुरूप हैं।
