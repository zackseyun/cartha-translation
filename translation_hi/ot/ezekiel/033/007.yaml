source:
  edition: WLC
  text: וְ/אַתָּ֣ה בֶן אָדָ֔ם צֹפֶ֥ה נְתַתִּ֖י/ךָ לְ/בֵ֣ית יִשְׂרָאֵ֑ל וְ/שָׁמַעְתָּ֤ מִ/פִּ/י֙ דָּבָ֔ר וְ/הִזְהַרְתָּ֥ אֹתָ֖/ם מִמֶּֽ/נִּי־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/033/007.yaml
  text: And you[a], son of man, I have made you a watchman for the house of Israel[b]; when you hear a word from my mouth, you shall warn them from me.
translation:
  language: hi
  text: और तुम, हे मनुष्य के पुत्र[a], मैंने तुम्हें इस्राएल के घराने के लिए पहरेदार ठहराया है[b]; जब तुम मेरे मुँह से कोई वचन सुनो, तो मेरी ओर से उन्हें चेतावनी देना।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘मनुष्य के पुत्र’ यहेजकेल के लिए बार-बार प्रयुक्त संबोधन है; इसका अर्थ ‘नश्वर मनुष्य’ या ‘हे मानव’ भी व्यक्त किया जा सकता है।
    reason: lexical_alternative
  - marker: b
    text: या, “मैंने तुम्हें इस्राएल के घराने के लिए पहरेदार नियुक्त किया है।”
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶן אָדָם
  choice: मनुष्य के पुत्र
  rationale: यह इब्रानी पदबंध का निकट और परंपरागत रूप है तथा यहेजकेल को बार-बार किए गए इसी संबोधन की साहित्यिक प्रतिध्वनि बनाए रखता है।
- source_word: צֹפֶה
  choice: पहरेदार
  rationale: यह ऐसे व्यक्ति को व्यक्त करता है जो निगरानी रखता और खतरे की चेतावनी देता है; अध्याय का भविष्यद्वक्तीय रूपक भी सुरक्षित रहता है।
- source_word: נְתַתִּיךָ
  choice: मैंने तुम्हें ... ठहराया है
  rationale: क्रिया का मूल अर्थ ‘देना’ है, पर विधेय संज्ञा ‘पहरेदार’ के साथ यहाँ किसी भूमिका में नियुक्त या स्थापित करना अभिप्रेत है। ‘ठहराया है’ स्वाभाविक हिन्दी में यह अर्थ देता है।
- source_word: לְבֵית יִשְׂרָאֵל
  choice: इस्राएल के घराने के लिए
  rationale: לְ यहाँ दायित्व और संबंध प्रकट करता है; ‘के लिए’ पहरेदार के रूप में इस्राएल के प्रति सौंपे गए कार्य को स्पष्ट करता है।
- source_word: וְשָׁמַעְתָּ
  choice: जब तुम ... सुनो
  rationale: वाव-संयुक्त पूर्ण क्रिया यहाँ अगले दायित्व की परिस्थिति बताती है। हिन्दी में ‘जब ... सुनो, तो ...’ क्रम और अपेक्षित कार्य को स्वाभाविक रूप से व्यक्त करता है।
- source_word: מִפִּי
  choice: मेरे मुँह से
  rationale: सजीव, प्रत्यक्ष इब्रानी अभिव्यक्ति को बनाए रखता है और संदेश के ईश्वरीय स्रोत पर बल देता है।
- source_word: דָּבָר
  choice: कोई वचन
  rationale: भविष्यद्वक्तीय संदर्भ में ‘वचन’ दैवी कथन को स्वाभाविक रूप से व्यक्त करता है; ‘कोई’ अनिश्चित पद का हिन्दी समतुल्य है।
- source_word: וְהִזְהַרְתָּ
  choice: चेतावनी देना
  rationale: हिफ़ील रूप दूसरों को सावधान करने का अर्थ देता है। इस निर्देशात्मक वाक्य में यह स्पष्ट और स्वाभाविक है।
- source_word: מִמֶּנִּי
  choice: मेरी ओर से
  rationale: चेतावनी का स्रोत परमेश्वर है। शाब्दिक ‘मुझसे’ की अपेक्षा ‘मेरी ओर से’ हिन्दी में दूत के द्वारा दी जाने वाली चेतावनी का संबंध अधिक स्वाभाविक ढंग से व्यक्त करता है।
theological_decisions:
- issue: यहेजकेल के लिए बार-बार प्रयुक्त संबोधन בֶן אָדָם
  choice: मनुष्य के पुत्र
  alternative: नश्वर मनुष्य / हे मानव
  rationale: शाब्दिक और परिचित संबोधन बनाए रखने से पुस्तक का आवर्ती साहित्यिक ढाँचा तथा उसका धार्मिक तनाव सुरक्षित रहता है; अर्थ को केवल ‘नश्वर’ तक सीमित नहीं किया गया।
- issue: भविष्यद्वक्ता के दायित्व का क्रियात्मक क्रम
  choice: जब तुम ... सुनो, तो ... चेतावनी देना
  alternative: और तुम ... सुनोगे और ... चेतावनी दोगे
  rationale: इब्रानी वाव-पूर्ण रूपों को संदर्भानुसार निर्देशात्मक-कालिक संबंध के रूप में पढ़ा गया है। हिन्दी का ‘जब ... तो’ संदेश सुनने और चेतावनी देने के संबंध को स्पष्ट करता है, बिना उसे केवल भविष्यवाणी में बदलने के।
- issue: מִמֶּנִּי में चेतावनी का स्रोत
  choice: मेरी ओर से
  alternative: मुझसे
  rationale: यह अनुवाद चेतावनी को परमेश्वर से उद्भूत और भविष्यद्वक्ता द्वारा पहुँचाई गई बात के रूप में रखता है; इसमें भविष्यद्वक्ता का स्वतंत्र संदेश निहित नहीं किया गया।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध हिन्दी अपनाई गई है। एकवचन संबोधन के लिए अत्यधिक पुरातन ‘तू/तुझे’ के बजाय ‘तुम/तुम्हें’ रखा गया है। ‘इस्राएल का घराना’, ‘वचन’ और ‘पहरेदार’ जैसे परिचित बाइबलीय पद संदर्भ की साहित्यिक पहचान बनाए रखते हैं। फुटनोट-चिह्न संबंधित पदों के तुरंत बाद रखे गए हैं।
