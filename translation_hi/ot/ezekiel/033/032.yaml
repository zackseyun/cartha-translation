language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/הִנְּ/ךָ֤ לָ/הֶם֙ כְּ/שִׁ֣יר עֲגָבִ֔ים יְפֵ֥ה ק֖וֹל וּ/מֵטִ֣ב נַגֵּ֑ן וְ/שָֽׁמְעוּ֙ אֶת דְּבָרֶ֔י/ךָ וְ/עֹשִׂ֥ים אֵינָ֖/ם אוֹתָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/033/032.yaml
  text: Look[a], you are to them like a sensual song, with a beautiful voice and skillful playing; they hear your words, but they do not do them.
translation:
  language: hi
  text: और देखो, तुम उनके लिए एक ऐसे कामुक प्रेम-गीत[a] के समान हो, जिसे मधुर स्वर वाला और कुशलता से वाद्य बजाने वाला व्यक्ति गाता है। वे तुम्हारे वचन सुनते तो हैं, पर उनका पालन नहीं करते।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “प्रेम-गीत।” इब्रानी अभिव्यक्ति प्रबल, भावपूर्ण या कामुक प्रेम/इच्छा को सूचित कर सकती है। आशय यह है कि वे भविष्यद्वक्ता के संदेश को मनभावन मनोरंजन की तरह लेते हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנְּךָ
  choice: और देखो, तुम
  rationale: הִנֵּה ध्यान आकर्षित करता है; ‘देखो’ आधुनिक हिन्दी में उसके संकेतात्मक बल को स्वाभाविक रूप से रखता है।
- source_word: לָהֶם
  choice: उनके लिए
  rationale: ל यहाँ श्रोताओं की दृष्टि से संबंध बताता है—यहेजकेल उन्हें किसके समान प्रतीत होता है।
- source_word: כְּשִׁיר עֲגָבִים
  choice: कामुक प्रेम-गीत के समान
  rationale: עֲגָבִים भावावेगपूर्ण, इन्द्रियपरक या कामुक प्रेम/लालसा को सूचित कर सकता है। ‘कामुक प्रेम-गीत’ आकर्षण और संदिग्ध नैतिक छाया दोनों को रखता है; वैकल्पिक अर्थ पादटिप्पणी में दिया गया है।
- source_word: יְפֵה קוֹל
  choice: मधुर स्वर
  rationale: शाब्दिक भाव ‘स्वर में सुन्दर’ है; ‘मधुर स्वर’ स्वाभाविक हिन्दी में आवाज़ की मनोहरता व्यक्त करता है।
- source_word: וּמֵטִב נַגֵּן
  choice: कुशल वादन
  rationale: यह पदबंध वाद्य बजाने में निपुणता को दर्शाता है; ‘कुशल वादन’ संक्षिप्त और स्वाभाविक है।
- source_word: וְשָׁמְעוּ אֶת־דְּבָרֶיךָ
  choice: वे तुम्हारे वचन सुनते तो हैं
  rationale: ‘सुनते तो हैं’ अगले विरोध के साथ श्रवण और आचरण के बीच का तनाव स्पष्ट करता है, बिना ‘सुनना’ को पहले ही ‘मानना’ बना देने के।
- source_word: וְעֹשִׂים אֵינָם אוֹתָם
  choice: पर उन पर चलते नहीं
  rationale: हिब्रू का शाब्दिक अर्थ ‘उन्हें करते नहीं’ है। आधुनिक हिन्दी में वचनों को व्यवहार में न लाने के लिए ‘उन पर चलते नहीं’ अधिक स्वाभाविक है और सुनने तथा पालन करने का विरोध बनाए रखता है।
theological_decisions:
- issue: עֲגָבִים की नैतिक और भावात्मक छाया
  choice: कामुक प्रेम-गीत
  alternative: प्रेम-गीत; वासनापूर्ण गीत
  rationale: संदर्भ में लोग भविष्यद्वक्ता के संदेश को आज्ञापालन योग्य वचन के बजाय आकर्षक मनोरंजन मानते हैं। यह चयन इन्द्रियपरक आकर्षण और नकारात्मक छाया को रखता है, पर शब्द को अत्यधिक स्पष्ट या अश्लील नहीं बनाता।
- issue: सुनने और करने का विरोध
  choice: सुनते तो हैं, पर उन पर चलते नहीं
  alternative: सुनते हैं, पर उन्हें करते नहीं
  rationale: मूल का नैतिक तनाव इस बात में है कि वास्तविक श्रवण के बावजूद पालन नहीं होता। स्वाभाविक हिन्दी में ‘उन पर चलते नहीं’ इसी क्रियात्मक विफलता को व्यक्त करता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘कामुक’ मूल की नैतिक छाया को बचाता है, जबकि पादटिप्पणी कम तीव्र ‘प्रेम-गीत’ विकल्प देती है। मुख्य पाठ में पादटिप्पणी चिह्न [a] उपस्थित है।
