  text: וְ/נָתַתִּ֤י אֶת הָ/אָ֨רֶץ֙ שְׁמָמָ֣ה וּ/מְשַׁמָּ֔ה וְ/נִשְׁבַּ֖ת גְּא֣וֹן עֻזָּ֑/הּ וְ/שָֽׁמְמ֛וּ הָרֵ֥י יִשְׂרָאֵ֖ל מֵ/אֵ֥ין עוֹבֵֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/033/028.yaml
  text: And I will make the land a desolation and a waste[a], and the pride of its strength will cease, and the mountains of Israel will be desolate[b], with no one passing through.
translation:
  language: hi
  text: मैं इस देश को उजाड़ और बरबाद[a] कर दूँगा। उसके बल का घमंड[b] समाप्त हो जाएगा, और इस्राएल के पहाड़ उजाड़ हो जाएँगे; वहाँ से कोई नहीं गुज़रेगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “भयावह वीरानी।” इब्रानी शब्द ऐसी बरबादी का भाव भी दे सकता है जिसे देखकर लोग भयभीत या स्तब्ध रह जाएँ।
    reason: lexical_alternative
  - marker: b
    text: या, “उसके बल का वैभव।” इब्रानी शब्द का अर्थ ‘घमंड’ या ‘वैभव’ दोनों हो सकता है; यहाँ न्याय के प्रसंग में ‘घमंड’ अधिक उपयुक्त है।
    reason: alternative_reading
lexical_decisions:
- source_word: וְנָתַתִּי
  choice: मैं ... कर दूँगा
  rationale: यद्यपि क्रिया का मूल अर्थ ‘देना/ठहराना’ है, इस वाक्य-विन्यास में भूमि को एक दशा में ले आने का भाव है; इसलिए आधुनिक हिन्दी में ‘कर दूँगा’ स्वाभाविक और अर्थसंगत है।
- source_word: הָאָרֶץ
  choice: इस देश
  rationale: संदर्भ इस्राएल के भूभाग का है, सारी पृथ्वी का नहीं। हिन्दी में ‘इस देश’ उस संदर्भ को स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
- source_word: שְׁמָמָה וּמְשַׁמָּה
  choice: उजाड़ और बरबाद
  rationale: दोनों निकटार्थी संज्ञाएँ पूर्ण विनाश और वीरानी को तीव्र करती हैं। हिन्दी में यह युग्म उस समानांतरता को सहज रूप में बनाए रखता है; दूसरे शब्द में भय या स्तब्धता उत्पन्न करने की छाया भी संभव है, जिसे पादटिप्पणी में रखा गया है।
- source_word: וְנִשְׁבַּת
  choice: मिट जाएगा
  rationale: क्रिया किसी बात के रुक जाने या समाप्त हो जाने को बताती है। ‘मिट जाएगा’ यहाँ घमंड के अंत को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: גְּאוֹן עֻזָּהּ
  choice: उसके बल का घमंड
  rationale: גְּאוֹן का अर्थ ‘घमंड’ या ‘वैभव’ हो सकता है। न्याय के इस प्रसंग में अपने बल पर गर्व करने का नकारात्मक भाव प्रमुख प्रतीत होता है, जबकि वैकल्पिक तटस्थ अर्थ पादटिप्पणी में सुरक्षित है। स्त्रीलिंग प्रत्यय भूमि/देश की ओर संकेत करता है।
- source_word: וְשָׁמְמוּ הָרֵי יִשְׂרָאֵל
  choice: इस्राएल के पहाड़ ... उजाड़ हो जाएँगे
  rationale: भौगोलिक विनाश के संदर्भ में שׁמם का अर्थ ‘उजाड़ होना’ उपयुक्त है; ‘इस्राएल के पहाड़’ यहेजकेल में बार-बार आने वाली अभिव्यक्ति है और इसे लगभग शाब्दिक रखा गया है।
- source_word: מֵאֵין עוֹבֵר
  choice: वहाँ से कोई नहीं गुज़रेगा
  rationale: यह वाक्यांश निर्जनता और आवागमन के पूर्ण अभाव को व्यक्त करता है। यह हिन्दी रूप परिणामसूचक भाव को बिना अनावश्यक व्याख्या के स्पष्ट करता है।
theological_decisions:
- issue: न्याय के प्रसंग में גְּאוֹן का भाव
  choice: घमंड
  alternative: वैभव
  rationale: भविष्यवाणी देश के विनाश और उसके भरोसे के अंत की घोषणा करती है, इसलिए नकारात्मक ‘घमंड’ प्रसंग के अनुरूप है। फिर भी मूल शब्द का तटस्थ ‘वैभव’ अर्थ संभव है और उसे पादटिप्पणी में दिया गया है, ताकि मूल की अर्थगत व्यापकता बनी रहे।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, साधारण पाठक के लिए स्पष्ट किंतु भविष्यवाणी की गंभीरता के अनुरूप गरिमापूर्ण रखी गई है। ‘उजाड़ और बरबाद’ मूल की तीव्र समानांतर अभिव्यक्ति को सहज हिन्दी में बनाए रखता है।
