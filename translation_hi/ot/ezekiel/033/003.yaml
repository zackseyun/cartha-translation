lexical_decisions:
- source_word: וְרָאָה
  choice: और वह … आते देखकर
  rationale: सशर्त प्रसंग में यह रूप किसी सामान्य संभावित स्थिति को व्यक्त करता है। हिंदी का कृदंत-विन्यास अगली कार्रवाइयों से स्वाभाविक रूप से जोड़ते हुए देखने की क्रिया को बनाए रखता है।
- source_word: הַחֶרֶב
  choice: तलवार
  rationale: मूल ठोस बिंब को रखा गया है। यहाँ तलवार हमलावर युद्ध या न्याय का द्योतक हो सकती है, पर मुख्य पाठ में उसका अर्थ खोलकर ‘युद्ध’ नहीं किया गया।
- source_word: בָּאָה עַל הָאָרֶץ
  choice: देश पर आते
  rationale: בוא + עַל में किसी भूभाग की ओर आने और उस पर चढ़ आने का धमकीपूर्ण भाव है। ‘देश पर आते’ आधुनिक हिंदी में स्वाभाविक है और आक्रमण का संकेत सुरक्षित रखता है।
- source_word: הָאָרֶץ
  choice: देश
  rationale: इस प्रसंग में आशय समूची पृथ्वी नहीं, बल्कि खतरे में पड़े क्षेत्र या देश से है। हिंदी में ‘देश’ इस संदर्भ को ‘भूमि’ से अधिक सहजता से व्यक्त करता है।
- source_word: וְתָקַע בַּשּׁוֹפָר
  choice: नरसिंगा फूँके
  rationale: यह चेतावनी का संकेत देने के लिए शोफ़ार बजाने की प्रचलित क्रिया है। ‘फूँके’ वाद्य और क्रिया, दोनों के ठोस बिंब को बनाए रखता है।
- source_word: שׁוֹפָר
  choice: नरसिंगा
  rationale: शोफ़ार सींग से बना संकेत-वाद्य है। ‘नरसिंगा’ हिंदी बाइबलीय प्रयोग में परिचित और प्रसंगानुकूल है; अन्य संभावित शब्द पादटिप्पणी में दिए गए हैं।
- source_word: וְהִזְהִיר
  choice: चेतावनी दे
  rationale: हिफ़ील रूप का अर्थ यहाँ लोगों को सावधान करना या चेतावनी देना है। यह अभिव्यक्ति स्पष्ट और स्वाभाविक आधुनिक हिंदी है।
- source_word: הָעָם
  choice: लोगों
  rationale: यह उस सामूहिक जनसमुदाय को सूचित करता है जिसे पहरेदार चेताता है; ‘लोगों’ सहज और सटीक है।
theological_decisions:
- issue: भविष्यद्वाणी की चेतावनी में ‘तलवार’ का लाक्षणिक बल
  choice: मुख्य पाठ में ठोस बिंब ‘तलवार’ रखा गया है, ताकि प्रसंग से हमलावर युद्ध या न्याय का संकेत समझा जा सके।
  alternative: इसे व्याख्यात्मक रूप से ‘युद्ध’ या ‘आक्रमणकारी सेना’ कहना।
  rationale: इब्रानी में חֶרֶב स्पष्ट रूप से ‘तलवार’ है। इसे बनाए रखना भविष्यद्वाणी की चित्रात्मकता और न्याय की गंभीरता को सुरक्षित रखता है तथा अनावश्यक रूप से किसी एक व्याख्या को पाठ में नहीं मिलाता।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। पद पिछले सशर्त वाक्य का अंश है, इसलिए ‘देखकर … फूँके … चेतावनी दे’ का विध्यर्थक क्रम चुना गया है।
