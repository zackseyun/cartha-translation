reference: Ezekiel 33:8
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: בְּ/אָמְרִ֣/י לָ/רָשָׁ֗ע רָשָׁע֙ מ֣וֹת תָּמ֔וּת וְ/לֹ֣א דִבַּ֔רְתָּ לְ/הַזְהִ֥יר רָשָׁ֖ע מִ/דַּרְכּ֑/וֹ ה֤וּא רָשָׁע֙ בַּ/עֲוֺנ֣/וֹ יָמ֔וּת וְ/דָמ֖/וֹ מִ/יָּדְ/ךָ֥ אֲבַקֵּֽשׁ׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/033/008.yaml
  text: When I say to the wicked[a], ‘Wicked one, you shall surely die,’ and you do not speak to warn the wicked from his way, that wicked man shall die in his iniquity, but I will require his blood from your hand.
translation:
  language: hi
  text: जब मैं दुष्ट से कहूँ, ‘हे दुष्ट, तू निश्चय मर जाएगा,’ और तू उस दुष्ट को उसके मार्ग से फिरने की चेतावनी देने के लिए न बोले, तो वह दुष्ट अपने अधर्म में मरेगा; पर उसके खून का हिसाब मैं तुझसे लूँगा।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शब्दशः: “उसका खून मैं तेरे हाथ से माँगूँगा।”'
    reason: इब्रानी न्यायिक मुहावरे और ‘हाथ’ की मूल छवि को दर्ज करना।
lexical_decisions:
- source_word: בְּאָמְרִי
  choice: जब मैं ... कहूँ
  rationale: בְּ के साथ यह रूप समय-सूचक उपवाक्य बनाता है; हिन्दी में ‘जब मैं ... कहूँ’ प्रसंग की शर्त-सदृश समयगत शक्ति को स्वाभाविक रूप से व्यक्त करता है।
- source_word: לָרָשָׁע / רָשָׁע
  choice: दुष्ट / हे दुष्ट
  rationale: רָשָׁע यहाँ नैतिक रूप से दुष्ट व्यक्ति को सूचित करता है; दूसरी बार यह संबोधन है, इसलिए ‘हे दुष्ट’ उसकी प्रत्यक्ष और गंभीर पुकार बनाए रखता है।
- source_word: מוֹת תָּמוּת
  choice: तू निश्चय मर जाएगा
  rationale: क्रियार्थक संज्ञा और अपूर्ण क्रिया का संयोजन मृत्यु की निश्चितता पर बल देता है; ‘निश्चय’ उस तीव्रता को स्पष्ट और गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: וְלֹא דִבַּרְתָּ לְהַזְהִיר
  choice: और तू ... चेतावनी देने के लिए कुछ न कहे
  rationale: ‘कुछ न कहे’ דִבַּרְתָּ के बोलने के अर्थ को बनाए रखता है, जबकि ‘चेतावनी देने’ से हिफ़ील לְהַזְהִיר का प्रयोजन स्पष्ट होता है।
- source_word: מִדַּרְכּוֹ
  choice: उसके मार्ग से फिरने
  rationale: מִן किसी जीवन-पथ से हटाने की चेतावनी का भाव देता है। ‘मार्ग’ बाइबिल के आचरण/जीवन-पद्धति वाले रूपक को रखता है; ‘फिरने’ से हिन्दी में अभिप्रेत दिशा स्वाभाविक होती है।
- source_word: הוּא רָשָׁע
  choice: वह दुष्ट
  rationale: सर्वनाम और संज्ञा की पुनरुक्ति को ‘वह दुष्ट’ द्वारा बनाए रखा गया है, जिससे व्यक्ति की अपनी नैतिक स्थिति पर बल बना रहता है।
- source_word: בַּעֲוֺנוֹ
  choice: अपने अधर्म में
  rationale: עָוֹן अधर्म और उससे जुड़ी दोषावस्था दोनों को सूचित कर सकता है। ‘अपने अधर्म में’ मूल पूर्वसर्गीय रचना और उसकी अर्थगत व्यापकता को सुरक्षित रखता है।
- source_word: וְדָמוֹ מִיָּדְךָ אֲבַקֵּשׁ
  choice: पर उसके खून का हिसाब मैं तुझसे लूँगा
  rationale: यह हिन्दी में उत्तरदायित्व का स्वाभाविक मुहावरा है और דָּם ‘खून’ की जीवन तथा मृत्यु से जुड़ी छवि को भी रखता है। अधिक शब्दशः हस्त-रूपक पादटिप्पणी में दिया गया है।
theological_decisions:
- issue: पहरेदार की चेतावनी न देने पर परमेश्वर के सामने उत्तरदायित्व
  choice: दुष्ट अपने अधर्म में मरता है, और चेतावनी न देने वाले से भी उसके खून का हिसाब लिया जाता है।
  alternative: चेतावनी देने वाला दुष्ट का दोष उसके स्थान पर उठा लेता है, अथवा उत्तरदायित्व की बात केवल अलंकार है।
  rationale: 'इब्रानी पाठ दोनों कथनों को साथ रखता है: दुष्ट अपने ही अधर्म में मरता है, फिर भी चेतावनी न देने वाला उसके खून के विषय में उत्तरदायी ठहरता है। अनुवाद इस तनाव को बिना मिटाए बनाए रखता है।'
translation_notes:
  register: आधुनिक मानक हिन्दी में गंभीर, प्रत्यक्ष और सामान्य पाठक के लिए सुबोध शैली। ‘तू/तुझसे’ का प्रयोग एकवचन संबोधन और भविष्यद्वक्ता से परमेश्वर के सीधे कथन को सुरक्षित रखता है।
