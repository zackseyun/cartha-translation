  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/יָדְע֖וּ כִּֽי אֲנִ֣י יְהוָ֑ה בְּ/תִתִּ֤/י אֶת הָ/אָ֨רֶץ֙ שְׁמָמָ֣ה וּ/מְשַׁמָּ֔ה עַ֥ל כָּל תּוֹעֲבֹתָ֖/ם אֲשֶׁ֥ר עָשֽׂוּ־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/033/029.yaml
  text: Then they will know that I am Yahweh[b][a], when I make the land a desolation and a waste because of all the abominations that they have committed.
translation:
  language: hi
  text: तब[a] वे जानेंगे कि मैं याहवे हूँ, जब मैं उनके किए हुए सभी घृणित कामों के कारण उस देश को उजाड़ और वीरान[b] कर दूँगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “और वे जानेंगे।” इब्रानी संयोजक का सामान्य अर्थ “और” है, पर यहाँ प्रसंग में परिणाम का भाव संभावित है।
    reason: lexical_alternative
  - marker: b
    text: या, “उजाड़ और भयावह दशा में।” दूसरे इब्रानी शब्द में विनाश के साथ उससे उत्पन्न स्तब्धता या भय का भाव भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָדְעוּ
  choice: तब वे जानेंगे
  rationale: पूर्ववर्ती प्रसंग में वाव परिणाम की ओर संकेत करता है; ‘तब’ इस परिणामी भाव को स्वाभाविक हिन्दी में व्यक्त करता है, जबकि मूल का साधारण ‘और’ भी संभव है।
- source_word: כִּי
  choice: कि
  rationale: यहाँ כִּי उस बात का विषय प्रस्तुत करता है जिसे वे जानेंगे, इसलिए ‘कि’ उपयुक्त है।
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिवाचक वाचा-नाम को उपाधि से बदलने के बजाय देवनागरी में लिप्यंतरित किया गया है।
- source_word: בְּתִתִּי
  choice: जब मैं ... कर दूँगा
  rationale: בְּ के साथ infinitive construct यहाँ समयसूचक परिस्थिति बताता है; נתן और विधेय संज्ञाओं का भाव भूमि को उस दशा में पहुँचा देना है।
- source_word: הָאָרֶץ
  choice: उस देश
  rationale: इस न्याय-संदर्भ में संकेत इस्राएल/यहूदा के देश की ओर है, संपूर्ण पृथ्वी की ओर नहीं। ‘उस’ हिन्दी में संदर्भित भूभाग को स्वाभाविक ढंग से स्पष्ट करता है।
- source_word: שְׁמָמָה וּמְשַׁמָּה
  choice: उजाड़ और वीरान
  rationale: दो निकटार्थी शब्द विनाश की पूर्णता को तीव्र करते हैं। यह सहज हिन्दी है; दूसरे शब्द में भयावह या स्तब्ध कर देने वाली दशा का अर्थ भी संभव है।
- source_word: עַל כָּל תּוֹעֲבֹתָם
  choice: उनके ... सभी घृणित कामों के कारण
  rationale: עַל यहाँ न्याय का कारण बताता है। תּוֹעֵבָה को केवल भाववाचक ‘घृणा’ के बजाय निंदित कर्मों के रूप में व्यक्त किया गया है।
- source_word: אֲשֶׁר עָשׂוּ
  choice: उनके किए हुए
  rationale: संबंधवाचक उपवाक्य को स्वाभाविक हिन्दी कृदंत-रचना में रखा गया है, और उसका संबंध ‘घृणित कामों’ से स्पष्ट बना रहता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में व्यक्तिवाचक चतुरक्षरीय नाम है। ‘याहवे’ उसका व्यापक रूप से स्वीकृत आधुनिक लिप्यंतरण है और इसे किसी उपाधि से प्रतिस्थापित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण और सर्वसुलभ रूप अपनाया गया है। निकटार्थी इब्रानी संज्ञाओं की तीव्रता ‘उजाड़ और वीरान’ से रखी गई है; संभावित भयावहता को पादटिप्पणी में सुरक्षित किया गया है।
