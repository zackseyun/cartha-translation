source:
  edition: WLC
  text: בְּ/אָמְרִ֤/י לַ/צַּדִּיק֙ חָיֹ֣ה יִֽחְיֶ֔ה וְ/הֽוּא בָטַ֥ח עַל צִדְקָת֖/וֹ וְ/עָ֣שָׂה עָ֑וֶל כָּל צדקת/ו לֹ֣א תִזָּכַ֔רְנָה וּ/בְ/עַוְל֥/וֹ אֲשֶׁר עָשָׂ֖ה בּ֥/וֹ יָמֽוּת־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/033/013.yaml
  text: When I say to the righteous man[a], ‘He shall surely live,’ and he trusts in his righteousness and does injustice, none of his righteous deeds will be remembered[b], but by the injustice that he has done he shall die.
translation:
  language: hi
  text: जब मैं धर्मी से कहूँ, ‘तू निश्चय ही जीवित रहेगा,’ और वह अपनी धार्मिकता पर भरोसा करके अन्याय करे, तो उसके किए हुए धर्मी कामों में से कोई भी याद नहीं किया जाएगा[a]; उसने जो अन्याय किया है, उसी के कारण वह मरेगा[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसकी सारी धार्मिकता याद नहीं की जाएगी।” इब्रानी अभिव्यक्ति उसके धर्मी कामों को सामूहिक रूप से भी दर्शा सकती है।
    reason: lexical_alternative
  - marker: b
    text: या, “उसी में वह मरेगा” अथवा “उसके कारण वह मरेगा”; संकेत उसके किए हुए अन्याय की ओर है।
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּאָמְרִי
  choice: जब मैं ... कहूँ
  rationale: בְּ के साथ यह रूप समयसूचक उपवाक्य बनाता है। हिंदी में ‘जब मैं ... कहूँ’ स्वाभाविक है और परमेश्वर के प्रथम-पुरुष कथन को बनाए रखता है।
- source_word: לַצַּדִּיק
  choice: धर्मी से
  rationale: צַדִּיק किसी धर्मी व्यक्ति को दर्शाता है। ‘धर्मी’ संक्षिप्त, प्रचलित और संदर्भ में प्रतिनिधिक पुल्लिंग एकवचन को सुरक्षित रखता है।
- source_word: חָיֹה יִחְיֶה
  choice: तू निश्चय ही जीवित रहेगा
  rationale: क्रिया का infinitive absolute के साथ प्रयोग दृढ़ बल देता है। प्रत्यक्ष संबोधन में ‘तू’ हिंदी में स्वाभाविक है, और ‘निश्चय ही’ उस बल को व्यक्त करता है।
- source_word: בָטַח עַל צִדְקָתוֹ
  choice: अपनी धार्मिकता पर भरोसा करके
  rationale: בָטַח עַל किसी वस्तु पर निर्भर होने या भरोसा रखने का भाव देता है। ‘धार्मिकता’ व्यक्ति की अपनी सही स्थिति या आचरण—दोनों की संभावित व्यापकता को खुला रखती है।
- source_word: וְעָשָׂה עָוֶל
  choice: अन्याय करे
  rationale: עָוֶל का अर्थ अन्याय, अधर्म या गलत काम हो सकता है। ‘अन्याय’ पद के नैतिक और न्यायिक स्वर को बनाए रखता है तथा आगे उसी शब्द की पुनरावृत्ति संभव करता है।
- source_word: כָּל צִדְקֹתָו
  choice: उसके धर्म के कामों में से कोई भी
  rationale: नकार के साथ यह अभिव्यक्ति उसके सभी धार्मिक कामों में से एक भी याद न किए जाने का अर्थ स्पष्ट करती है। सामूहिक ‘धार्मिकता’ वाला अधिक रूपगत विकल्प पादटिप्पणी में दिया गया है।
- source_word: לֹא תִזָּכַרְנָה
  choice: याद नहीं किया जाएगा
  rationale: זכר का निफ़अल रूप ‘याद किया जाना’ व्यक्त करता है। यह न्यायिक संदर्भ को बनाए रखता है, पर इसे स्पष्ट रूप से ‘हिसाब में लेना’ कहकर आवश्यकता से अधिक व्याख्यायित नहीं करता।
- source_word: וּבְעַוְלוֹ אֲשֶׁר עָשָׂה בּוֹ
  choice: उसने जो अन्याय किया है, उसी के कारण
  rationale: בְּ और בּוֹ यहाँ उस अन्याय को मृत्यु का क्षेत्र, आधार या कारण बताते हैं। मुख्य पाठ में स्वाभाविक कारणसूचक हिंदी अपनाई गई है; अधिक रूपगत संभावनाएँ पादटिप्पणी में सुरक्षित हैं।
- source_word: יָמוּת
  choice: वह मरेगा
  rationale: सरल अपूर्ण क्रिया यहाँ गंभीर न्यायिक परिणाम बताती है। ‘वह मरेगा’ हिंदी में सीधा और स्वाभाविक है।
theological_decisions:
- issue: क्या यह चेतावनी धीरज, धर्मत्याग या उद्धार की किसी विशिष्ट व्यवस्थित धर्मशास्त्रीय धारणा के अनुसार समझाई जाए
  choice: धर्मी व्यक्ति के अपनी धार्मिकता पर भरोसा करके अन्याय करने पर मिलने वाले वास्तविक न्यायिक परिणाम के रूप में चेतावनी को सीधे प्रस्तुत करना
  alternative: इसे केवल काल्पनिक चेतावनी मानना, या इसे किसी विशेष संप्रदायगत व्यवस्था में ‘स्थिति खोने’ की तकनीकी भाषा से बाँधना
  rationale: इब्रानी पाठ पूर्व धार्मिक कामों, वर्तमान अन्याय और मृत्यु के बीच गंभीर संबंध रखता है। अनुवाद उसी तनाव को बनाए रखता है और बाद की धर्मशास्त्रीय बहसों का निर्णय पाठ में नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण किंतु सामान्य पाठकों के लिए स्पष्ट भाषा रखी गई है। प्रत्यक्ष संबोधन में ‘तू’ बाइबिलीय हिंदी के अनुरूप है और यहाँ अपमानसूचक नहीं, बल्कि एकवचन सीधा संबोधन है। ‘धार्मिकता’ और ‘अन्याय’ की पुनरावृत्ति मूल पाठ के नैतिक-न्यायिक विरोध को सुरक्षित रखती है।
