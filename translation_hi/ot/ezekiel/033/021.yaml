- source_word: מִירוּשָׁלַם
  choice: यरूशलेम से
  rationale: स्थाननाम और स्रोतसूचक संबंध का सीधा अनुवाद है।
- source_word: לֵאמֹר
  choice: और उसने कहा
  rationale: प्रत्यक्ष कथन का परिचय आधुनिक हिन्दी में स्वाभाविक ढंग से दिया गया है।
- source_word: הֻכְּתָה הָעִיר
  choice: नगर को मार गिराया गया है
  rationale: नכה के होफल रूप की कर्मवाच्य शक्ति और ‘प्रहार करके गिराने’ की छवि को बनाए रखता है; ‘नगर गिर गया है’ अधिक मुहावरेदार पर कुछ कम शाब्दिक विकल्प है।
