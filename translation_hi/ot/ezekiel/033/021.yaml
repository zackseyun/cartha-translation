  text: And it happened in the twelfth year[a], in the tenth month, on the fifth day of the month of our exile, that the fugitive from Jerusalem came to me, saying[b], “The city has been struck down.”
translation:
  language: hi
  text: तब ऐसा हुआ कि हमारे निर्वासन के बारहवें वर्ष के दसवें महीने के पाँचवें दिन, यरूशलेम से बचकर आया व्यक्ति[a] मेरे पास आया और उसने कहा, “नगर को मार गिराया गया है।”[b]
  philosophy: optimal-equivalence
  footnotes:
