id: EZK.33.5
reference: Ezekiel 33:5
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: אֵת֩ ק֨וֹל הַ/שּׁוֹפָ֤ר שָׁמַע֙ וְ/לֹ֣א נִזְהָ֔ר דָּמ֖/וֹ בּ֣/וֹ יִֽהְיֶ֑ה וְ/ה֥וּא נִזְהָ֖ר נַפְשׁ֥/וֹ מִלֵּֽט׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/033/005.yaml
  text: He heard the sound of the trumpet and did not take warning[a]; his blood will be upon himself. But if he takes warning[b], he will save his life.
translation:
  language: hi
  text: उसने तुरही की आवाज़ सुनी, पर चेतावनी पर ध्यान नहीं दिया; उसका खून उसी पर होगा[a]। लेकिन यदि वह चेतावनी पर ध्यान दे, तो वह अपना जीवन बचा लेगा[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “उसका खून उसी पर होगा।” यह हिब्रू मुहावरा बताता है कि अपनी मृत्यु की जिम्मेदारी उसी की होगी।
    reason: idiom_explanation
  - marker: b
    text: या, “वह अपने प्राणों को छुड़ा लेगा” अथवा “अपने आपको बचा लेगा।” यहाँ प्रसंग में “जीवन” आसन्न मृत्यु से बचने को दर्शाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: קוֹל הַשּׁוֹפָר
  choice: तुरही की आवाज़
  rationale: קוֹל का अर्थ ‘आवाज़’ और שׁוֹפָר का अर्थ चेतावनी देने के लिए बजाया जाने वाला सींग अथवा तुरही है। ‘तुरही की आवाज़’ आधुनिक हिन्दी में स्वाभाविक है और चौकीदार के प्रसंग में चेतावनी-संकेत को स्पष्ट रखता है।
- source_word: שָׁמַע
  choice: सुनी
  rationale: यहाँ क्रिया चेतावनी-संकेत को कानों से सुनने को बताती है; इसलिए सामान्य अर्थ ‘सुनी’ उपयुक्त है।
- source_word: נִזְהָר
  choice: चेतावनी पर ध्यान दिया
  rationale: זהר के निफ़अल रूप का यहाँ अर्थ चेताया जाना और उस चेतावनी को ग्रहण करना है। ‘चेतावनी पर ध्यान देना’ दोनों occurrences में व्यक्ति की उत्तरदायी प्रतिक्रिया को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: דָּמוֹ בּוֹ יִהְיֶה
  choice: उसका खून उसी पर होगा
  rationale: हिब्रू का रक्त-दोष संबंधी रूपक ज्यों का त्यों रखा गया है। यह अपनी मृत्यु के लिए उसी व्यक्ति की जिम्मेदारी प्रकट करता है, जिसे पादटिप्पणी स्पष्ट करती है।
- source_word: נַפְשׁוֹ
  choice: अपना जीवन
  rationale: נֶפֶשׁ के अर्थ ‘प्राण, जीवन, स्वयं’ हो सकते हैं। यहाँ आने वाली शारीरिक मृत्यु से बचने का प्रसंग है, इसलिए ‘जीवन’ सर्वाधिक उपयुक्त है।
- source_word: מִלֵּט
  choice: बचा लेगा
  rationale: पिअल रूप किसी को बच निकलने देना या छुड़ाना व्यक्त करता है। ‘अपना जीवन बचा लेगा’ हिन्दी में सहज है और सफलतापूर्वक मृत्यु से बचने का भाव देता है।
- source_word: וְהוּא נִזְהָר
  choice: लेकिन यदि वह चेतावनी पर ध्यान दे
  rationale: शाब्दिक संयोजन ‘और वह चेताया गया’ है, पर पिछले व्यक्ति के विपरीत चेतावनी ग्रहण करने वाले की स्थिति यहाँ निहित शर्त के रूप में सामने आती है। ‘लेकिन यदि’ इस विरोध और शर्त को स्वाभाविक हिन्दी में स्पष्ट करता है।
theological_decisions:
- issue: न्याय के प्रसंग में रक्त-दोष और व्यक्तिगत उत्तरदायित्व
  choice: उसका खून उसी पर होगा
  alternative: वह अपनी मृत्यु के लिए स्वयं जिम्मेदार होगा
  rationale: मुख्य पाठ में हिब्रू का न्यायिक और नैतिक रूपक सुरक्षित रखा गया है, जबकि पादटिप्पणी उसका आशय बताती है। इससे रूपक को केवल व्याख्यात्मक कथन में बदलकर उसकी धार्मिक-नैतिक तीव्रता कम नहीं होती।
- issue: נֶפֶשׁ का प्रसंगानुसार अर्थ
  choice: अपना जीवन
  alternative: अपने प्राण / अपने आपको
  rationale: इस प्रसंग में चेतावनी मानने से शारीरिक मृत्यु टलती है। इसलिए ‘जीवन’ उपयुक्त है, फिर भी पादटिप्पणी मूल शब्द की व्यापक अर्थ-सीमा को सुरक्षित रखती है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘तुरही’ सामान्य पाठक के लिए ‘नरसिंगा’ से अधिक तुरंत समझ में आने वाला शब्द है। समानान्तर वाक्यों में ‘चेतावनी पर ध्यान देना’ दोहराकर मूल की संरचना और व्यक्तिगत उत्तरदायित्व पर बल सुरक्षित रखा गया है।
