source:
  edition: WLC
  text: וְ֠/אַתָּה כִּֽי הִזְהַ֨רְתָּ רָשָׁ֤ע מִ/דַּרְכּ/וֹ֙ לָ/שׁ֣וּב מִמֶּ֔/נָּה וְ/לֹא שָׁ֖ב מִ/דַּרְכּ֑/וֹ ה֚וּא בַּ/עֲוֺנ֣/וֹ יָמ֔וּת וְ/אַתָּ֖ה נַפְשְׁ/ךָ֥ הִצַּֽלְתָּ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/033/009.yaml
  text: But if you warn a wicked man to turn from his way[a], and he does not turn from his way, he will die in his iniquity[b]; but you will have delivered your soul.
translation:
  language: hi
  text: पर यदि तू दुष्ट को चेतावनी दे कि वह अपने मार्ग से फिर जाए, और वह अपने मार्ग से न फिरे, तो वह अपने अधर्म में मरेगा[a]; पर तूने अपना प्राण बचा लिया है[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “अपने अधर्म में मरेगा” का अर्थ “अपने अधर्म के कारण मरेगा” भी हो सकता है।
    reason: alternative_reading
  - marker: b
    text: शाब्दिक रूप से, “तूने अपना प्राण बचा लिया है।” यहाँ “प्राण” के लिए प्रयुक्त इब्रानी शब्द נֶפֶשׁ व्यक्ति के जीवन या स्वयं व्यक्ति को सूचित कर सकता है; इसका अर्थ अनिवार्य रूप से देह से अलग अमूर्त आत्मा नहीं है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הִזְהַרְתָּ
  choice: चेतावनी दे
  rationale: זהר के हिफ़ील रूप का अर्थ यहाँ खतरे और उत्तरदायित्व से सावधान करना है; ‘चेतावनी देना’ पहरेदार के प्रसंग में स्वाभाविक और स्पष्ट है।
- source_word: רָשָׁע
  choice: दुष्ट
  rationale: एकवचन विशेषण यहाँ संज्ञा की तरह प्रयुक्त है। ‘दुष्ट’ नैतिक अर्थ को बनाए रखता है और हिन्दी में किसी व्यक्ति के लिए स्वाभाविक है।
- source_word: מִדַּרְכּוֹ ... לָשׁוּב מִמֶּנָּה
  choice: कि वह अपने मार्ग से फिर जाए
  rationale: ‘मार्ग’ आचरण का नैतिक रूपक बनाए रखता है, और ‘फिर जाए’ שׁוב की दिशा-परिवर्तन की भावना व्यक्त करता है।
- source_word: וְלֹא שָׁב מִדַּרְכּוֹ
  choice: और वह अपने मार्ग से न फिरे
  rationale: मूल पाठ की पुनरावृत्ति बनाए रखी गई है; सर्वनाम से बदलने के बजाय ‘अपने मार्ग से’ दोहराने पर नैतिक आचरण स्पष्ट रहता है।
- source_word: בַּעֲוֺנוֹ
  choice: अपने अधर्म में
  rationale: בְּ का क्षेत्रगत अर्थ सुरक्षित रहता है, जबकि प्रसंग में कारण का भाव भी संभव है। ‘अधर्म’ עָוֹן के दोषपूर्ण और नैतिक अर्थ को व्यक्त करता है।
- source_word: נַפְשְׁךָ הִצַּלְתָּ
  choice: तू अपना प्राण बचा लेगा
  rationale: נֶפֶשׁ यहाँ व्यक्ति के जीवन अथवा स्वयं व्यक्ति को सूचित करता है; ‘प्राण’ हिन्दी में इस व्यापकता को कुछ हद तक बनाए रखता है और इसे केवल देह से अलग अमूर्त आत्मा तक सीमित नहीं करता। शर्तीय वाक्य में भविष्यकालीन परिणाम हिन्दी में स्वाभाविक है।
- source_word: וְאַתָּה ... וְאַתָּה
  choice: पर यदि तू ... पर तू
  rationale: दोहराए गए सर्वनाम का जोर और दुष्ट के परिणाम तथा पहरेदार के उत्तरदायित्व के बीच विरोध ‘पर’ से स्पष्ट किया गया है।
theological_decisions:
- issue: नַפְשְׁךָ का अर्थ
  choice: ‘अपना प्राण’—अर्थात अपना जीवन अथवा स्वयं को बचाना
  alternative: ‘अपनी आत्मा’
  rationale: प्रसंग पहरेदार की रक्त-दोष से जुड़ी जवाबदेही और जीवन की रक्षा का है। ‘आत्मा’ कहने से बाद की शरीर-आत्मा संबंधी धारणा अनावश्यक रूप से पाठ में आ सकती है।
- issue: ‘अपने अधर्म में मरेगा’ में मृत्यु और दोष का संबंध
  choice: मूल के क्षेत्रगत वाक्यांश को बनाए रखते हुए उसके कारणगत संकेत को खुला रखना
  alternative: ‘अपने अधर्म के कारण मरेगा’
  rationale: हिब्रू בְּ दोनों भावों की अनुमति देता है। मुख्य पाठ मूल की संक्षिप्तता और अस्पष्टता रखता है; पादटिप्पणी कारणगत समझ बताती है।
- issue: पहरेदार और दुष्ट की व्यक्तिगत जवाबदेही
  choice: दुष्ट अपने अधर्म में मरता है, पर चेतावनी देने वाला अपना प्राण बचाता है
  alternative: इस कथन को किसी विस्तृत उद्धार-सिद्धांत अथवा कर्म-सिद्धांत के रूप में खोलना
  rationale: अनुवाद केवल इस प्रसंग में दी गई जिम्मेदारी और परिणाम को व्यक्त करता है, उससे आगे कोई सांप्रदायिक निष्कर्ष नहीं जोड़ता।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध हिन्दी। परमेश्वर द्वारा नबी को एकवचन प्रत्यक्ष संबोधन होने के कारण ‘तू’ रखा गया है। ‘मार्ग’ का भविष्यद्वक्ताई नैतिक रूपक और मूल की पुनरावृत्ति सुरक्षित रखी गई है।
