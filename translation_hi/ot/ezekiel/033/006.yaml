source:
  edition: WLC
  text: וְ֠/הַ/צֹּפֶה כִּֽי יִרְאֶ֨ה אֶת הַ/חֶ֜רֶב בָּאָ֗ה וְ/לֹֽא תָקַ֤ע בַּ/שּׁוֹפָר֙ וְ/הָ/עָ֣ם לֹֽא נִזְהָ֔ר וַ/תָּב֣וֹא חֶ֔רֶב וַ/תִּקַּ֥ח מֵ/הֶ֖ם נָ֑פֶשׁ ה֚וּא בַּ/עֲוֺנ֣/וֹ נִלְקָ֔ח וְ/דָמ֖/וֹ מִ/יַּֽד הַ/צֹּפֶ֥ה אֶדְרֹֽשׁ־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/033/006.yaml
  text: But if the watchman sees the sword coming and does not blow the trumpet[a], and the people are not warned, and the sword comes and takes a life from among them, that one is taken away in his iniquity[b], but I will require his blood from the watchman's hand.
translation:
  language: hi
  text: परन्तु यदि पहरेदार तलवार को आते देखकर तुरही न फूँके, और लोगों को चेतावनी न मिले[a], और तलवार आकर उनमें से किसी का प्राण ले ले, तो वह अपने अधर्म के कारण मारा जाएगा; पर उसका रक्त मैं पहरेदार के हाथ से माँगूँगा[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “लोग चेतावनी न मानें।” इब्रानी का अर्थ या तो चेतावनी न मिलना या चेतावनी पर ध्यान न देना हो सकता है। मुख्य पाठ पहरेदार द्वारा तुरही न फूँकने से उत्पन्न स्थिति पर बल देता है।
    reason: lexical_alternative
  - marker: b
    text: “उसका रक्त ... पहरेदार के हाथ से माँगूँगा” किसी की मृत्यु के लिए जवाबदेही ठहराने का कानूनी मुहावरा है।
    reason: cultural_note
lexical_decisions:
- source_word: הַצֹּפֶה
  choice: पहरेदार
  rationale: यह शब्द निगरानी करने या चौकसी पर नियुक्त व्यक्ति को दर्शाता है। ‘पहरेदार’ आधुनिक हिन्दी में स्वाभाविक है और यहेजकेल के रूपक को बनाए रखता है।
- source_word: כִּי יִרְאֶה
  choice: यदि ... देखकर
  rationale: यहाँ כִּי एक शर्ताधारित स्थिति प्रस्तुत करता है; ‘यदि’ उत्तरदायित्व से जुड़े इस उदाहरण की तर्क-रचना को स्पष्ट करता है।
- source_word: הַחֶרֶב בָּאָה
  choice: तलवार को आते
  rationale: ‘तलवार’ आक्रमण या हिंसक न्याय का लक्षणार्थक चित्र है; अनुवाद उस ठोस मूल चित्र को सुरक्षित रखता है।
- source_word: תָקַע בַּשּׁוֹפָר
  choice: तुरही न फूँके
  rationale: שׁוֹפָר चेतावनी देने के लिए फूँका जाने वाला सींग था। ‘तुरही फूँकना’ आधुनिक हिन्दी में सहज है और चेतावनी-संकेत का भाव स्पष्ट रखता है।
- source_word: וְהָעָם לֹא נִזְהָר
  choice: लोगों को चेतावनी न मिले
  rationale: זהר का निफ़अल रूप ‘चेतावनी दी जाना’ या ‘चेतावनी पर ध्यान देना’ दोनों अर्थ दे सकता है। पहरेदार के तुरही न फूँकने पर बल होने के कारण मुख्य पाठ निष्क्रिय अर्थ अपनाता है, जबकि दूसरा अर्थ पादटिप्पणी में सुरक्षित है।
- source_word: וַתִּקַּח מֵהֶם נָפֶשׁ
  choice: उनमें से किसी का प्राण ले ले
  rationale: נֶפֶשׁ यहाँ किसी व्यक्ति या उसके जीवन को दर्शाता है। यह हिन्दी अभिव्यक्ति मृत्यु का आशय स्वाभाविक ढंग से व्यक्त करती है।
- source_word: בַּעֲוֺנוֹ נִלְקָח
  choice: अपने अधर्म में ही उठा लिया जाएगा
  rationale: עָוֹן अधर्म, दोष या दोष के परिणाम को सूचित कर सकता है। ‘अपने अधर्म में’ मूल की संक्षिप्त नैतिक अभिव्यक्ति और उत्तरदायित्व को बनाए रखता है; ‘ही’ पहरेदार के उत्तरदायित्व के साथ मौजूद तनाव को स्पष्ट करता है, उसे मिटाता नहीं।
- source_word: דָמוֹ
  choice: उसका खून
  rationale: ‘खून’ मृत्यु के लिए कानूनी-नैतिक उत्तरदायित्व का संकेत है। मूल बिंब को मुख्य पाठ में रखा गया है और पादटिप्पणी में समझाया गया है।
- source_word: מִיַּד הַצֹּפֶה אֶדְרֹשׁ
  choice: मैं पहरेदार के हाथ से माँगूँगा
  rationale: דרשׁ के साथ מִיַּד उत्तरदायित्व की माँग का कानूनी मुहावरा है। ‘हाथ से माँगूँगा’ मूल की न्यायिक और चित्रात्मक भाषा को सुरक्षित रखता है।
theological_decisions:
- issue: पहरेदार और मारे गए व्यक्ति का उत्तरदायित्व
  choice: मारा गया व्यक्ति अपने अधर्म में उठाया जाता है, फिर भी चेतावनी न देने के कारण परमेश्वर पहरेदार से उसके खून का हिसाब माँगता है।
  alternative: या तो पहरेदार मारे गए व्यक्ति का दोष अपने ऊपर लेता है, अथवा उस व्यक्ति की मृत्यु केवल पहरेदार की विफलता के कारण होती है।
  rationale: 'इब्रानी पाठ दोनों कथनों को साथ रखता है: व्यक्ति अपने अधर्म में उठाया जाता है और उसके खून के लिए पहरेदार से जवाब माँगा जाता है। अनुवाद दोष-स्थानांतरण या केवल प्रक्रियागत लापरवाही में से किसी एक को आरोपित नहीं करता।'
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सुबोध रखी गई है। ‘पहरेदार,’ ‘तुरही,’ ‘अधर्म’ और ‘खून ... हाथ से माँगना’ मूल के भविष्यद्वक्तात्मक तथा न्यायिक बिंबों को सुरक्षित रखते हैं।
