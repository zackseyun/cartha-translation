base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/013/003.yaml
  text: 'Thus says the Lord GOD: Woe to the foolish prophets[a], who follow their own spirit and have seen nothing.'
translation:
  language: hi
  text: 'प्रभु याहवे यों कहते हैं: “उन मूर्ख भविष्यद्वक्ताओं पर हाय, जो अपनी ही आत्मा के पीछे चलते हैं[a] और जिन्होंने कुछ भी नहीं देखा है।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “अपनी ही आत्मा के पीछे जाते हैं”; यह इब्रानी मुहावरा किसी का अनुसरण करने के अर्थ में है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה אָמַר
  choice: यों कहते हैं
  rationale: यह भविष्यवाणी में प्रयुक्त संदेशवाहक-सूत्र का स्वाभाविक और गरिमापूर्ण हिन्दी रूप है।
- source_word: אֲדֹנָי יְהוִה
  choice: प्रभु याहवे
  rationale: אֲדֹנָי को ‘प्रभु’ और परमेश्वर के व्यक्तिगत नाम יהוה को लिप्यंतरित रूप ‘याहवे’ से व्यक्त किया गया है, जिससे उपाधि और नाम दोनों बने रहते हैं।
- source_word: הוֹי עַל
  choice: … पर हाय
  rationale: यह केवल दुःख की अभिव्यक्ति नहीं, बल्कि भविष्यद्वाणी में न्याय और धिक्कार की घोषणा है।
- source_word: הַנְּבִיאִים הַנְּבָלִים
  choice: मूर्ख भविष्यद्वक्ताओं
  rationale: ‘मूर्ख’ यहाँ केवल बौद्धिक कमी नहीं, बल्कि नैतिक और आत्मिक विवेकहीनता प्रकट करता है।
- source_word: הֹלְכִים אַחַר רוּחָם
  choice: अपनी ही आत्मा के पीछे चलते हैं
  rationale: इस अपेक्षाकृत शाब्दिक रूप से ‘पीछे चलने’ का इब्रानी मुहावरा और רוּחַ की ‘आत्मा’ वाली अर्थ-छाया दोनों सुरक्षित रहते हैं; आशय अपने भीतर की प्रेरणा का अनुसरण करना है।
- source_word: וּלְבִלְתִּי רָאוּ
  choice: और जिन्होंने कुछ भी नहीं देखा
  rationale: यह रूप संयोजक ‘और’ तथा भविष्यद्वक्ताओं के वास्तविक दर्शन न पाने की बात को सीधे रखता है, बिना कारण या विरोध का संबंध अतिरिक्त रूप से जोड़ने के।
theological_decisions:
- issue: संयुक्त पदवी אֲדֹנָי יְהוִה में परमेश्वर के नाम का अनुवाद
  choice: प्रभु याहवे
  alternative: प्रभु परमेश्वर
  rationale: मूल पाठ में उपाधि אֲדֹנָי के साथ वाचा का व्यक्तिगत नाम יהוה भी स्पष्ट है। ‘प्रभु याहवे’ दोनों को अलग-अलग व्यक्त करता है और नाम को सामान्य पदवी में विलीन नहीं करता।
- issue: भविष्यद्वक्ताओं की רוּחַ का आशय
  choice: अपनी ही आत्मा
  alternative: अपनी ही प्रेरणा / अपनी ही हवा
  rationale: ‘आत्मा’ मूल शब्द की अर्थगत व्यापकता और सच्चे दिव्य दर्शन के विपरीत उनकी स्वयं-उत्पन्न प्रेरणा का तनाव बनाए रखता है; ‘हवा’ यहाँ अनावश्यक रूप से अस्पष्ट और ‘प्रेरणा’ अधिक व्याख्यात्मक होती।
- issue: וּלְבִלְתִּי רָאוּ में संबंध
  choice: और जिन्होंने कुछ भी नहीं देखा
  alternative: जबकि उन्होंने कुछ भी नहीं देखा / बिना कुछ देखे
  rationale: इब्रानी में संयोजन और निषेधात्मक अभिव्यक्ति संक्षिप्त है। मुख्य पाठ में ‘और’ रखने से कारणात्मक या विरोधात्मक संबंध को निश्चित मानकर नहीं जोड़ा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में भविष्यद्वाणी की गरिमा बनाए रखने के लिए ‘यों कहते हैं’ और ‘पर हाय’ का प्रयोग किया गया है। वाक्य साधारण पाठकों के लिए स्पष्ट है, जबकि ‘अपनी ही आत्मा के पीछे चलते हैं’ मूल रूपक को सुरक्षित रखता है।
