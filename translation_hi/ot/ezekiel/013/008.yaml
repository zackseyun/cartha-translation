reference: Ezekiel 13:8
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: לָ/כֵ֗ן כֹּ֤ה אָמַר֙ אֲדֹנָ֣/י יְהוִ֔ה יַ֚עַן דַּבֶּרְ/כֶ֣ם שָׁ֔וְא וַ/חֲזִיתֶ֖ם כָּזָ֑ב לָ/כֵן֙ הִנְ/נִ֣י אֲלֵי/כֶ֔ם נְאֻ֖ם אֲדֹנָ֥/י יְהוִֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/013/008.yaml
  text: 'Therefore thus says the Lord GOD: Because you have spoken falsehood and seen a lie[a], therefore behold, I am against you, declares the Lord GOD.'
translation:
  language: hi
  text: 'इसलिए प्रभु यहोवा यों कहता है: “क्योंकि तुमने झूठी बातें कही हैं और झूठा दर्शन देखा है, इसलिए देखो, मैं तुम्हारे विरुद्ध हूँ—यह प्रभु यहोवा की घोषणा है।”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לָכֵן
  choice: इसलिए
  rationale: दोनों occurrences में कारण और परिणाम का स्पष्ट संबंध बनाए रखता है और आधुनिक हिन्दी में स्वाभाविक है।
- source_word: כֹּה אָמַר
  choice: यों कहता है
  rationale: भविष्यद्वक्ताओं के मानक संदेशवाहक-सूत्र का गरिमापूर्ण और सहज हिन्दी रूप है।
- source_word: אֲדֹנָי יְהוִה
  choice: प्रभु यहोवा
  rationale: אֲדֹנָי को उपाधि ‘प्रभु’ और יהוה को व्यक्तिवाचक ईश्वरीय नाम ‘यहोवा’ के रूप में अलग-अलग प्रकट करता है।
- source_word: יַעַן
  choice: क्योंकि
  rationale: आने वाले न्याय का आधार स्पष्ट रूप से बताता है।
- source_word: דַּבֶּרְכֶם שָׁוְא
  choice: तुमने झूठी बातें कही हैं
  rationale: שָׁוְא यहाँ धोखे और असत्य से भरे कथनों को सूचित करता है; हिन्दी बहुवचन ‘बातें’ वाक्यांश को स्वाभाविक बनाता है।
- source_word: וַחֲזִיתֶם כָּזָב
  choice: और झूठा दर्शन देखा है
  rationale: חזה की दर्शनीय/भविष्यद्वक्ताई अर्थछाया बनाए रखता है, जबकि כָּזָב को दर्शन की झूठी प्रकृति के रूप में व्यक्त करता है; इसे सीधे ‘भविष्यवाणी की’ कहकर अधिक व्याख्यायित नहीं करता।
- source_word: הִנְנִי אֲלֵיכֶם
  choice: देखो, मैं तुम्हारे विरुद्ध हूँ
  rationale: दैवी विरोध की गंभीर चेतावनी को स्पष्ट करता है और הִנְנִי के ध्यानाकर्षक बल को बनाए रखता है।
- source_word: נְאֻם
  choice: की यह घोषणा है
  rationale: भविष्यद्वक्ताई प्रमाणीकरण-सूत्र के अधिकारपूर्ण स्वर को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: संयुक्त पद אֲדֹנָי יְהוִה में ईश्वरीय नाम का अनुवाद
  choice: प्रभु यहोवा
  alternative: प्रभु परमेश्वर
  rationale: मूल में उपाधि אֲדֹנָי और वाचा का नाम יהוה दोनों उपस्थित हैं। ‘प्रभु यहोवा’ इस भेद को बनाए रखता है, जबकि ‘प्रभु परमेश्वर’ नाम को सामान्य उपाधि से बदल देता।
- issue: וַחֲזִיתֶם כָּזָב का भविष्यद्वक्ताई आशय
  choice: झूठा दर्शन देखा है
  alternative: झूठी भविष्यवाणी की है
  rationale: मूल क्रिया का शाब्दिक दर्शनीय रूप और आरोप दोनों सुरक्षित रहते हैं; ‘भविष्यवाणी की’ उस क्रिया की व्याख्या को पाठ में अधिक निश्चित कर देता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘यों कहता है’ और ‘यह घोषणा है’ भविष्यद्वक्ताई सूत्रों का औपचारिक स्वर बनाए रखते हैं; ‘देखो’ चेतावनी की तात्कालिकता व्यक्त करता है।
