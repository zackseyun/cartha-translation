reference: Ezekiel 13:17
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/אַתָּ֣ה בֶן אָדָ֗ם שִׂ֤ים פָּנֶ֨י/ךָ֙ אֶל בְּנ֣וֹת עַמְּ/ךָ֔ הַ/מִּֽתְנַבְּא֖וֹת מִֽ/לִּבְּ/הֶ֑ן וְ/הִנָּבֵ֖א עֲלֵי/הֶֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/013/017.yaml
  text: And you[a], son of man, set your face against the daughters of your people who prophesy out of their own hearts[b], and prophesy against them.
translation:
  language: hi
  text: और हे मनुष्य के पुत्र, अपनी प्रजा की उन बेटियों[a] के विरुद्ध अपना मुख कर, जो अपने ही हृदय से भविष्यवाणी करती हैं[b], और उनके विरुद्ध भविष्यवाणी कर।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से ‘अपनी प्रजा की बेटियाँ’ है; आशय ‘अपनी प्रजा की स्त्रियाँ’ भी समझा जा सकता है। विशिष्ट मूल अभिव्यक्ति मुख्य पाठ में रखी गई है।
    reason: lexical_alternative
  - marker: b
    text: ‘अपने ही हृदय से’ का अर्थ है कि उनका भविष्यवाणी का संदेश यहोवा से नहीं, बल्कि उन्हीं के भीतर से उत्पन्न होता है।
    reason: cultural_note
lexical_decisions:
- source_word: בֶן אָדָם
  choice: मनुष्य के पुत्र
  rationale: यह यहेजकेल के लिए परमेश्वर का बार-बार आने वाला संबोधन है। शाब्दिक मुहावरे को बनाए रखने से पुस्तक में इसकी पुनरावृत्ति और आलंकारिक प्रभाव सुरक्षित रहते हैं।
- source_word: שִׂים פָּנֶיךָ אֶל
  choice: के विरुद्ध अपना मुख कर
  rationale: शाब्दिक रूप से यह किसी की ओर मुख करने का मुहावरा है, पर न्याय-संदर्भ और अगले आदेश के कारण यहाँ विरोध का भाव है। हिंदी में ‘के विरुद्ध’ इस भाव को स्पष्ट रखता है।
- source_word: בְּנוֹת עַמְּךָ
  choice: अपनी प्रजा की उन बेटियों
  rationale: इब्रानी में सामान्यतः ‘स्त्रियाँ’ नहीं, बल्कि ‘बेटियाँ’ है। सामुदायिक और पारिवारिक अभिव्यक्ति को मुख्य पाठ में सुरक्षित रखा गया है।
- source_word: הַמִּתְנַבְּאוֹת
  choice: जो ... भविष्यवाणी करती हैं
  rationale: स्त्रीलिंग बहुवचन कृदंत निरंतर या विशेषतापूर्ण भविष्यवाणी की गतिविधि बताता है। इसमें ‘झूठी’ जैसा शब्द नहीं जोड़ा गया।
- source_word: מִלִּבְּהֶן
  choice: अपने ही हृदय से
  rationale: לֵב आंतरिक व्यक्ति, विचार और अभिप्राय को सूचित कर सकता है। ‘हृदय’ मूल रूपक बनाए रखता है और ‘अपने ही’ यह स्पष्ट करता है कि संदेश उन्हीं से निकलता है।
- source_word: וְהִנָּבֵא עֲלֵיהֶן
  choice: और उनके विरुद्ध भविष्यवाणी कर
  rationale: आज्ञार्थक क्रिया को सीधे रखा गया है; न्याय के प्रसंग में עַל का विरोधात्मक अर्थ ‘विरुद्ध’ से व्यक्त होता है।
theological_decisions:
- issue: इन स्त्रियों की भविष्यवाणी का स्वरूप
  choice: ‘भविष्यवाणी करती हैं’ कहा गया है; मुख्य पाठ में ‘झूठी’ नहीं जोड़ा गया।
  alternative: ‘झूठी भविष्यवाणी करती हैं’ या ‘भविष्यवाणी करने का ढोंग करती हैं’।
  rationale: व्यापक प्रसंग उनकी निंदा करता है, पर इस पद में उनके संदेश का अपने हृदय से निकलना कहा गया है। ‘झूठी’ जोड़ने के बजाय मूल पाठ को अपना आरोप स्वयं व्यक्त करने दिया गया है।
- issue: ‘हृदय’ का आशय
  choice: मूल रूपक ‘हृदय’ रखा गया और टिप्पणी में उसके आशय को स्पष्ट किया गया।
  alternative: ‘अपने मन से’ या ‘अपनी कल्पना से’।
  rationale: ‘मन’ अधिक सहज हो सकता है, किंतु वह मूल शारीरिक रूपक को समतल कर देता है; ‘हृदय’ विचार, इच्छा और भीतरी स्रोत की अर्थ-व्याप्ति बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक मानक हिंदी में, स्पष्ट किंतु गरिमापूर्ण रखी गई है। ‘मनुष्य के पुत्र’, ‘मुख करना’ और ‘हृदय’ जैसे मूल-पाठ के प्रमुख रूपक सुरक्षित हैं; वाक्य-विन्यास हिंदी में स्वाभाविक बनाने के लिए सीमित पुनर्संयोजन किया गया है।
