- from: क्या तुमने झूठा दर्शन नहीं देखा और झूठी शकुन-वाणी[a] नहीं कही? तुम कहते हो, ‘यह याहवे की घोषणा है,’ जबकि मैंने कुछ नहीं कहा।
  to: क्या तुमने झूठा दर्शन नहीं देखा और झूठी शकुन-वाणी नहीं कही? तुम कहते हो, ‘यह याहवे की घोषणा है,’ पर मैंने नहीं कहा।
  rationale: The revision retains the draft’s strong, natural rendering of the verse while removing the added “कुछ” from the divine denial. The footnote is adjusted to preserve the distinction between divination and ordinary prophecy, while retaining the viable lexical nuance of שָׁוְא.
