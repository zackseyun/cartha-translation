id: EZK.13.7
reference: Ezekiel 13:7
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: הֲ/ל֤וֹא מַֽחֲזֵה שָׁוְא֙ חֲזִיתֶ֔ם וּ/מִקְסַ֥ם כָּזָ֖ב אֲמַרְתֶּ֑ם וְ/אֹֽמְרִים֙ נְאֻם יְהוָ֔ה וַ/אֲנִ֖י לֹ֥א דִבַּֽרְתִּי־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/013/007.yaml
  text: Have you not seen a false vision and spoken a lying divination[a], when you say, ‘Declares Yahweh,’ though I have not spoken?
translation:
  language: hi
  text: क्या तुमने झूठा दर्शन नहीं देखा और झूठी शकुन-वाणी नहीं कही? तुम कहते हो, ‘यह याहवे की घोषणा है,’ पर मैंने नहीं कहा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הֲלֹוא
  choice: क्या ... नहीं
  rationale: यह अलंकारिक प्रश्न है, जिसका अपेक्षित उत्तर ‘हाँ’ है; हिन्दी में ‘क्या ... नहीं’ इसकी प्रश्नात्मक तीव्रता बनाए रखता है।
- source_word: מַחֲזֵה שָׁוְא
  choice: झूठा दर्शन
  rationale: מַחֲזֶה भविष्यदर्शी दर्शन को और שָׁוְא यहाँ मिथ्यापन तथा खोखलेपन को व्यक्त करता है; प्रसंग में ‘झूठा दर्शन’ स्वाभाविक और स्पष्ट है।
- source_word: חֲזִיתֶם
  choice: देखा
  rationale: काल पूर्ण क्रिया, द्वितीय पुरुष बहुवचन है; ‘दर्शन देखा’ हिन्दी में स्वाभाविक प्रयोग है।
- source_word: וּמִקְסַם כָּזָב
  choice: और झूठी शकुन-वाणी
  rationale: מִקְסָם दैवी संकेत जानने के दावे पर आधारित शकुन अथवा भविष्य-कथन है और כָּזָב उसका झूठापन बताता है। ‘शकुन-वाणी’ वाणीगत संदर्भ तथा अनुचित दिव्यज्ञान-दावे दोनों को रखता है।
- source_word: אֲמַרְתֶּם
  choice: नहीं कही
  rationale: यह क्रिया पहले दर्शन देखने के समानांतर दूसरे आरोप को पूरा करती है; हिन्दी में ‘शकुन-वाणी कही’ स्पष्ट और संक्षिप्त है।
- source_word: וְאֹמְרִים
  choice: तुम कहते हो
  rationale: कृदन्त निरंतर अथवा साथ-साथ चल रही क्रिया दर्शाता है; वर्तमानकालीन ‘कहते हो’ उस जारी दावे को व्यक्त करता है।
- source_word: נְאֻם יְהוָה
  choice: यह याहवे की घोषणा है
  rationale: נְאֻם भविष्यवाणी में अधिकारपूर्ण ईश्वरीय उच्चारण का सूत्र है; यह रूप हिन्दी में उद्धृत दावे के रूप में स्पष्ट है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी व्यक्तिगत दिव्य नाम को शीर्षक से बदलने के बजाय हिन्दी लिप्यंतरण में रखा गया है।
- source_word: וַאֲנִי לֹא דִבַּרְתִּי
  choice: जबकि मैंने कुछ नहीं कहा
  rationale: וַאֲנִי आरोपित ईश्वरीय घोषणा और परमेश्वर के वास्तविक न बोलने के बीच तीखा विरोध रखता है। हिन्दी में निषेध स्वाभाविक बनाने के लिए ‘कुछ’ जोड़ा गया है।
theological_decisions:
- issue: दिव्य नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा / प्रभु
  rationale: मूल पाठ में व्यक्तिगत दिव्य नाम सीधे आया है। ‘याहवे’ उसे नाम के रूप में सुरक्षित रखता है, बिना उसे किसी उपाधि से बदलने के।
- issue: झूठे भविष्यदर्शियों के अनुभव की प्रकृति
  choice: झूठा दर्शन
  alternative: व्यर्थ दर्शन / खोखला दर्शन
  rationale: שָׁוְא में असत्य और निष्फलता दोनों संभव हैं। इस प्रसंग में परमेश्वर के न बोलने के स्पष्ट विरोध के कारण मुख्य पाठ में ‘झूठा’ उपयुक्त है, जबकि अन्य अर्थ पादटिप्पणी में सुरक्षित हैं।
translation_notes:
  register: आधुनिक मानक हिन्दी; स्वर गंभीर और आरोपात्मक है, पर वाक्य सामान्य पाठक के लिए सीधा रखा गया है। बहुवचन ‘तुम’ मूल के द्वितीय पुरुष बहुवचन को व्यक्त करता है।
