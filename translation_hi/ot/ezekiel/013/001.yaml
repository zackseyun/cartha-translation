  text: וַ/יְהִ֥י דְבַר יְהוָ֖ה אֵלַ֥/י לֵ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/013/001.yaml
  text: And the word of Yahweh came to me[a], saying,
translation:
  language: hi
  text: 'और यहोवा का वचन मेरे पास पहुँचा[a]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में YHWH; परंपरागत रूप से ‘प्रभु’ अनूदित; ‘याहवे’ भी लिप्यंतरित किया जाता है।
    reason: दिव्य नाम के पारंपरिक अनुवाद और वैकल्पिक लिप्यंतरण को दर्ज करना।
lexical_decisions:
- source_word: וַיְהִי
  choice: और ... पहुँचा
  rationale: यहाँ वाव-क्रमिक के साथ היה भविष्यसूचक वृत्तांत का प्रचलित आरंभ है। हिंदी में इसे ‘वचन ... पहुँचा’ में समाहित करना स्वाभाविक है और क्रमसूचक ‘और’ को बनाए रखता है।
- source_word: דְבַר
  choice: वचन
  rationale: भविष्यसूचक सूत्र דְבַר יְהוָה में ‘वचन’ दैवी वाणी का ठोस और परंपरागत अर्थ बनाए रखता है; ‘संदेश’ अपेक्षाकृत व्याख्यात्मक होता।
- source_word: יְהוָה
  choice: यहोवा
  rationale: इब्रानी चतुरक्षरीय दिव्य नाम को हिंदी में प्रचलित नामरूप ‘यहोवा’ से व्यक्त किया गया है; यह उसे केवल उपाधि ‘प्रभु’ से बदलने के बजाय व्यक्तिगत नाम के रूप में सुरक्षित रखता है।
- source_word: אֵלַי
  choice: मेरे पास
  rationale: इस भविष्यसूचक सूत्र में दिशा दर्शाने वाले אֶל और प्रथम पुरुष प्रत्यय का स्वाभाविक हिंदी रूप ‘मेरे पास’ है।
- source_word: לֵאמֹר
  choice: ':'
  rationale: यह क्रियार्थक संज्ञा आगामी प्रत्यक्ष वचन का परिचय देती है। हिंदी में द्विबिंदु उसी कार्य को अधिक स्वाभाविक ढंग से निभाता है; ‘यह कहते हुए’ इस छोटे सूत्र में अनावश्यक रूप से भारी होता।
theological_decisions:
- issue: दिव्य नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: मूल पाठ में व्यक्तिगत दिव्य नाम सीधे आया है। हिंदी के सामान्य बाइबलीय प्रयोग में ‘यहोवा’ पहचानने योग्य लिप्यंतरण है; ‘प्रभु’ नाम को उपाधि में बदल देता, जबकि ‘याहवे’ मूल उच्चारण के आधुनिक पुनर्निर्माण के अधिक निकट वैकल्पिक रूप है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिंदी। भविष्यसूचक सूत्र को संक्षिप्त रखा गया है; आगामी प्रत्यक्ष वाणी का संकेत देने के लिए ‘कहते हुए’ के स्थान पर द्विबिंदु प्रयुक्त है।
