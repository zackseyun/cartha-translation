id: EZK.13.18
reference: Ezekiel 13:18
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/אָמַרְתָּ֞ כֹּה אָמַ֣ר אֲדֹנָ֣/י יְהוִ֗ה הוֹי֩ לִֽ/מְתַפְּר֨וֹת כְּסָת֜וֹת עַ֣ל כָּל אַצִּילֵ֣י יָדַ֗/י וְ/עֹשׂ֧וֹת הַ/מִּסְפָּח֛וֹת עַל רֹ֥אשׁ כָּל קוֹמָ֖ה לְ/צוֹדֵ֣ד נְפָשׁ֑וֹת הַ/נְּפָשׁוֹת֙ תְּצוֹדֵ֣דְנָה לְ/עַמִּ֔/י וּ/נְפָשׁ֖וֹת לָ/כֶ֥נָה תְחַיֶּֽינָה־׀׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/013/018.yaml
  text: 'And say, ‘Thus says the Lord GOD: Woe to the women who sew magic bands on every wrist and make veils for the head of persons of every height, to hunt souls! Will you hunt the souls of my people and keep your own souls alive?'
translation:
  language: hi
  text: 'और कह, ‘प्रभु यहोवा यों कहता है: धिक्कार है उन स्त्रियों पर, जो प्राणों का शिकार करने के लिए हर कलाई पर जादुई पट्टियाँ सिलती और हर कद के लोगों के सिरों के लिए सिर ढकने के वस्त्र बनाती हैं! क्या तुम मेरी प्रजा के प्राणों का शिकार करोगी और अपने प्राणों को जीवित रखोगी?’'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כְּסָתוֹת
  choice: जादुई पट्टियाँ
  rationale: यह दुर्लभ शब्द बाँह/कलाई पर बाँधी जाने वाली किसी वस्तु को सूचित करता है; प्रसंग जादू-टोने का है, इसलिए ‘जादुई’ उसका कार्य स्पष्ट करता है, जबकि ‘पट्टियाँ’ वस्तु की अनिश्चित बनावट को पर्याप्त रूप से खुला रखता है।
- source_word: עַל כָּל אַצִּילֵי יָדַי
  choice: हर कलाई पर
  rationale: शाब्दिक संरचना ‘मेरे हाथ की हर जोड़/बगल’ कठिन और विवादित है। यहाँ शरीर के उस भाग का आशय है जहाँ पट्टी बाँधी जाती थी; सहज हिन्दी में ‘हर कलाई पर’ प्रसंगानुकूल है।
- source_word: הַמִּסְפָּחוֹת
  choice: घूँघट
  rationale: दुर्लभ संज्ञा सिर पर डाली या बाँधी जाने वाली आवरण-वस्तु को दर्शाती है। ‘घूँघट’ सिर ढकने वाले वस्त्र का स्वाभाविक हिन्दी रूप है, बिना उसकी सटीक जादुई बनावट तय किए।
- source_word: כָּל קוֹמָה
  choice: हर कद के व्यक्ति
  rationale: शाब्दिक अर्थ ‘हर ऊँचाई/कद’ है। व्यक्ति का उल्लेख निहित है; यह अलग-अलग कद के लोगों के लिए सिर के आवरण बनाने का बोध देता है।
- source_word: לְצוֹדֵד נְפָשׁוֹת
  choice: प्राणों का शिकार करने के लिए
  rationale: נפשׁ यहाँ व्यक्ति के जीवन/प्राण को सूचित कर सकता है। ‘प्राण’ मूल की जान और व्यक्ति दोनों से जुड़ी अर्थ-व्याप्ति तथा अगले वाक्य में जीवित रखने की शब्द-क्रीड़ा को बनाए रखता है।
- source_word: וּנְפָשׁוֹת לָכֶנָה תְחַיֶּינָה
  choice: अपने प्राणों को जीवित रखोगी
  rationale: मूल का असामान्य वाक्यांश स्त्रियों द्वारा अपने जीवन को बचाए रखने अथवा अपने लाभ के लिए जीवन बचाने के बीच कुछ तनाव रखता है। मुख्य पाठ में अंग्रेज़ी परामर्श-पाठ के अनुरूप आत्म-संरक्षण का अर्थ रखा गया है।
theological_decisions:
- issue: जादू-टोने का संकेत
  choice: ‘जादुई पट्टियाँ’ द्वारा प्रसंगगत जादुई कार्य को स्पष्ट किया
  alternative: केवल ‘पट्टियाँ’
  rationale: आसपास का कथन प्राणों को फँसाने और झूठी भविष्यवाणी के अनुष्ठान की निंदा करता है। फिर भी किसी विशेष ऐतिहासिक तांत्रिक पद्धति का नाम नहीं जोड़ा गया।
- issue: נפשׁ का अनुवाद
  choice: प्राण
  alternative: आत्माएँ / लोग / जीवन
  rationale: ‘प्राण’ शिकार किए जाने वाले व्यक्तियों और जीवित रखे जाने वाले जीवन—दोनों अर्थों को जोड़ता है तथा मनुष्य की संरचना पर कोई संप्रदायगत निष्कर्ष नहीं थोपता।
- issue: अंतिम प्रश्न का कर्ता और लाभार्थी
  choice: स्त्रियाँ अपने प्राण जीवित रखती हैं
  alternative: वे दूसरों के प्राण अपने लाभ के लिए जीवित रखती हैं
  rationale: हिब्रू वाक्यविन्यास संक्षिप्त और कुछ अस्पष्ट है। सर्वनाम לָכֶנָה को आत्म-हित/आत्म-संरक्षण के रूप में ग्रहण किया गया, पर किसी व्यापक धर्मवैज्ञानिक सिद्धांत में नहीं बदला गया।
translation_notes:
  register: आधुनिक मानक हिन्दी, भविष्यद्वाणी के गंभीर और अभियोगात्मक स्वर के अनुरूप। ‘प्रभु यहोवा’ नाम और उपाधि का भेद बनाए रखता है; ‘धिक्कार’ הוֹי की शोकपूर्ण चेतावनी व्यक्त करता है। स्त्रीलिंग बहुवचन क्रियाएँ मूल संबोधन को स्पष्ट रखती हैं।
