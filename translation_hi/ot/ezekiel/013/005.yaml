base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/013/005.yaml
  text: You have not gone up into the breaches or built up a wall for the house of Israel[a], so that it might stand in the battle on the day of Yahweh.
translation:
  language: hi
  text: तुम दीवार की सेंधों[a] पर नहीं चढ़े और न इस्राएल के घराने के लिए दीवार खड़ी की, ताकि वह याहवे के दिन युद्ध में खड़ा रह सके।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “दीवार के टूटे स्थानों पर।” इब्रानी शब्द दीवार में पड़ी सेंधों या टूटे स्थानों को दर्शाता है; यहाँ रक्षा-व्यवस्था का रूपक जारी रहता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲלִיתֶם
  choice: तुम … में नहीं चढ़े
  rationale: עלה का मूल अर्थ ‘चढ़ना’ है; यहाँ रक्षात्मक दीवार के टूटे स्थानों पर जाकर मोर्चा सँभालने का ठोस चित्र सुरक्षित रखा गया है।
- source_word: בַּפְּרָצוֹת
  choice: दीवार की दरारों
  rationale: פְּרָצוֹת दीवार या सुरक्षा-घेरे में पड़ी सेंधों अथवा टूटे स्थानों को दर्शाता है। ‘दीवार की दरारों’ आधुनिक हिन्दी में स्वाभाविक है और सैन्य-रक्षा का बिंब बनाए रखता है।
- source_word: וַתִּגְדְּרוּ גָדֵר
  choice: दीवार खड़ी की
  rationale: एक ही मूल के क्रिया और संज्ञा का प्रयोग दीवार या घेरा बनाने की क्रिया पर बल देता है। ‘दीवार खड़ी की’ इस बल और रक्षात्मक बिंब को सहज हिन्दी में व्यक्त करता है।
- source_word: עַל בֵּית יִשְׂרָאֵל
  choice: इस्राएल के घराने के लिए
  rationale: עַל यहाँ इस्राएल के घराने की ओर से या उसकी रक्षा के लिए किए जाने वाले कार्य को व्यक्त करता है; ‘के लिए’ स्थानगत अर्थ को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: לַעֲמֹד
  choice: ताकि वह … खड़ा रह सके
  rationale: उद्देश्यसूचक infinitive को ‘ताकि’ से स्पष्ट किया गया है। एकवचन ‘वह’ सामूहिक संज्ञा ‘इस्राएल के घराने’ को संदर्भित करता है और עמד का खड़े रहने वाला चित्र बनाए रखता है।
- source_word: בַּמִּלְחָמָה
  choice: युद्ध में
  rationale: यह आने वाले संघर्ष में टिके रहने की सैन्य छवि को सीधे और स्वाभाविक रूप से व्यक्त करता है।
- source_word: בְּיוֹם יְהוָה
  choice: याहवे के दिन
  rationale: भविष्यद्वाणी में प्रयुक्त न्याय के विशिष्ट ‘दिन’ को बनाए रखते हुए पूर्वसर्ग का स्वाभाविक हिन्दी रूप दिया गया है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को उपाधि से बदलने के बजाय आधुनिक हिन्दी लिप्यंतरण में प्रस्तुत किया गया है।
theological_decisions:
- issue: भविष्यद्वक्ताओं की जिम्मेदारी के लिए प्रयुक्त सैन्य और दुर्ग-रक्षा का रूपक
  choice: दरारों, दीवार, युद्ध और याहवे के दिन के ठोस बिंबों को बनाए रखा गया है।
  alternative: इसे केवल ‘तुमने इस्राएल की रक्षा नहीं की’ जैसे व्याख्यात्मक कथन में बदलना।
  rationale: मूल पाठ झूठे भविष्यद्वक्ताओं की विफलता को दीवार की मरम्मत और युद्ध की तैयारी के रूपक द्वारा प्रकट करता है; ठोस भाषा पाठक को रूपक का आशय समझने देती है, पर अनुवाद में व्याख्या आरोपित नहीं करती।
- issue: इस्राएल के घराने का युद्ध में खड़ा रहना
  choice: सामूहिक ‘घराने’ के लिए एकवचन ‘वह’ और संभाव्यता ‘खड़ा रह सके’ रखी गई है।
  alternative: व्याख्यात्मक रूप से ‘इस्राएली बच सकें’ कहना।
  rationale: मूल में בֵּית יִשְׂרָאֵל सामूहिक एकक है और לַעֲמֹד उद्देश्य व्यक्त करता है; अनुवाद इस व्याकरणिक और धार्मिक तनाव को सुरक्षित रखता है।
- issue: ईश्वरीय नाम יְהוָה का रूप
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: व्यक्तिगत नाम को नाम के रूप में बनाए रखना मूल इब्रानी साक्ष्य के सबसे निकट है और उसे किसी उपाधि में नहीं बदलता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य हिन्दी पाठक के लिए सुबोध रखी गई है। ‘इस्राएल का घराना’ बाइबलीय सामूहिक पदावली को बनाए रखता है, जबकि वाक्य-विन्यास स्वाभाविक हिन्दी का है।
