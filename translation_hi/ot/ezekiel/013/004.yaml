  yaml_path: translation/ot/ezekiel/013/004.yaml
  text: Your prophets, O Israel, have been like foxes[a] among ruins.
translation:
  language: hi
  text: हे इस्राएल, तुम्हारे नबी खंडहरों के बीच लोमड़ियों[a] जैसे रहे हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘सियारों।’ इब्रानी शब्द का अर्थ लोमड़ियों जैसे जंगली कुत्ते-कुल के किसी प्राणी के लिए अधिक व्यापक रूप से भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּשֻׁעָלִים
  choice: लोमड़ियों जैसे
  rationale: שֻׁעָלִים लोमड़ियों अथवा उनसे मिलते-जुलते जंगली कुत्ताकुल के प्राणियों को सूचित कर सकता है। मुख्य पाठ में प्रचलित अर्थ ‘लोमड़ियाँ’ रखा गया है और वैकल्पिक पहचान पादटिप्पणी में दी गई है।
- source_word: בָּחֳרָבוֹת
  choice: खंडहरों के बीच
  rationale: बहुवचन संज्ञा उजड़े या नष्ट हुए स्थानों को दर्शाती है। ‘खंडहरों के बीच’ दृश्य को स्पष्ट रखते हुए स्वाभाविक हिन्दी देता है।
- source_word: נְבִיאֶיךָ
  choice: तुम्हारे नबी
  rationale: यह ‘नबी’ का बहुवचन रूप है, जिसके साथ द्वितीय पुरुष एकवचन स्वत्वसूचक प्रत्यय लगा है। इस्राएल को सामूहिक रूप से संबोधित करते हुए आधुनिक हिन्दी में ‘तुम्हारे नबी’ स्वाभाविक है और उन्हें परमेश्वर के सच्चे नबी कहकर मान्यता नहीं देता।
- source_word: יִשְׂרָאֵל
  choice: हे इस्राएल
  rationale: यह सीधा संबोधन है। ‘हे’ संबोधन की भविष्यद्वक्ताई गंभीरता और स्पष्टता बनाए रखता है।
- source_word: הָיוּ
  choice: रहे हैं
  rationale: पूर्ण क्रिया आरोप में नबियों की स्थापित दशा या आचरण को व्यक्त करती है। ‘रहे हैं’ इस निरंतर/स्थापित समानता को हिन्दी में स्वाभाविक ढंग से रखता है, बिना ‘हो गए’ जैसा परिवर्तन का अतिरिक्त भाव जोड़े।
theological_decisions:
- issue: क्या नबियों को मुख्य पाठ में स्पष्ट रूप से ‘झूठे नबी’ कहा जाए
  choice: इब्रानी के अनुसार केवल ‘तुम्हारे नबी’
  alternative: तुम्हारे झूठे नबी
  rationale: संदर्भ इन नबियों की निंदा करता है, पर इस पद में ‘झूठे’ शब्द नहीं है। उसे जोड़ना संदर्भगत निष्कर्ष को मूल पाठ में मिला देगा।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘हे इस्राएल’ प्रत्यक्ष भविष्यद्वक्ताई संबोधन को स्पष्ट करता है; वाक्यक्रम हिन्दी के स्वाभाविक प्रयोग के अनुरूप है।
