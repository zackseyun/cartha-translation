source:
  edition: WLC
  text: וְ/הִנֵּ֖ה נָפַ֣ל הַ/קִּ֑יר הֲ/לוֹא֙ יֵאָמֵ֣ר אֲלֵי/כֶ֔ם אַיֵּ֥ה הַ/טִּ֖יחַ אֲשֶׁ֥ר טַחְתֶּֽם׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/013/012.yaml
  text: And look[a], when the wall falls, will it not be said to you, ‘Where is the plaster with which you plastered it?’
translation:
  language: hi
  text: और देखो, जब वह दीवार गिर जाएगी, तब क्या तुमसे यह नहीं कहा जाएगा, “वह लेप कहाँ है, जो तुमने उस पर लगाया था?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘लेप’ के स्थान पर ‘सफ़ेदी’ या ‘पलस्तर’ भी हो सकता है। मूल शब्द दीवार पर लगाई गई परत को सूचित करता है; इस अध्याय में यह छवि छलपूर्ण बाहरी आवरण का भाव भी लिए हुए है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  choice: और देखो
  rationale: यह अभिव्यक्ति आने वाले दृश्य की ओर जीवंत ढंग से ध्यान खींचती है; आधुनिक हिन्दी में ‘और देखो’ स्वाभाविक और गरिमापूर्ण है।
- source_word: נָפַל הַקִּיר
  choice: जब वह दीवार गिर जाएगी
  rationale: נָפַל रूप की दृष्टि से पूर्णकाल है, पर प्रसंग में भावी परिस्थिति प्रस्तुत करता है; हिन्दी का भावी रूप इस संदर्भगत अर्थ को स्पष्ट रखता है।
- source_word: הֲלוֹא יֵאָמֵר אֲלֵיכֶם
  choice: तब क्या तुमसे यह नहीं कहा जाएगा
  rationale: हिब्रू की प्रश्नवाचक संरचना सकारात्मक उत्तर की अपेक्षा करती है और निफ़अल का अवैयक्तिक कर्मवाच्य हिन्दी में स्वाभाविक रूप से सुरक्षित रहता है।
- source_word: הַטִּיחַ
  choice: लेप
  rationale: यह शब्द दीवार पर लगाई जाने वाली परत या पलस्तर को सूचित करता है। ‘लेप’ साधारण हिन्दी में समझने योग्य है और पदार्थ की सटीक प्रकृति को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: אֲשֶׁר טַחְתֶּם
  choice: जो तुमने उस पर लगाया था
  rationale: हिब्रू क्रिया और संज्ञा के शब्द-संबंध को हिन्दी में अनावश्यक पुनरुक्ति के बिना स्वाभाविक बनाया गया है; ‘उस पर’ का संकेत दीवार की ओर है।
theological_decisions:
- issue: दीवार के लेप की छवि में छल का निहितार्थ
  choice: मुख्य पाठ में तटस्थ ‘लेप’ रखकर छवि को यथावत प्रस्तुत किया गया है।
  alternative: ‘सफ़ेदी’ या ‘दिखावटी लेप’ कहकर छल का भाव प्रत्यक्ष करना।
  rationale: इस पद का मूल शब्द दीवार की परत को बताता है, जबकि छलपूर्ण दिखावे का अर्थ व्यापक प्रसंग से उभरता है; मुख्य पाठ में उसे जोड़ने से व्याख्या मूल शब्द पर आरोपित हो सकती है।
translation_notes:
  register: आधुनिक मानक हिन्दी; वाक्य विन्यास बोलचाल में समझने योग्य, पर भविष्यवाणी के अनुरूप गरिमापूर्ण है। ‘तुम’ बहुवचन संबोधन को दर्शाता है।
