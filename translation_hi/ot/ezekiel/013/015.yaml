base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/013/015.yaml
  text: So I will spend my wrath against the wall and against those who plastered it with whitewash[a], and I will say to you, ‘The wall is no more, and those who plastered it are no more,’
translation:
  language: hi
  text: इसलिए मैं दीवार पर और उस पर सफेदी[a] पोतनेवालों पर अपना क्रोध पूरी तरह उतारूँगा; और मैं तुमसे कहूँगा, ‘न तो दीवार रही और न उसे पोतनेवाले,’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “कच्चे गारे से।” इब्रानी शब्द सतही या घटिया लेप का संकेत दे सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִלֵּיתִי
  choice: इसलिए ... पूरी तरह उतारूँगा
  rationale: पिएल रूप यहाँ किसी कार्य को पूरा करने या अंत तक पहुँचाने का भाव देता है। ‘अपना क्रोध पूरी तरह उतारूँगा’ आधुनिक हिन्दी में स्वाभाविक है और क्रोध के पूर्ण निष्पादन को व्यक्त करता है।
- source_word: חֲמָתִי
  choice: अपना क्रोध
  rationale: यह शब्द तीव्र दैवी रोष को दर्शाता है; ‘क्रोध’ सामान्य पाठक के लिए स्पष्ट और न्याय-संदर्भ के अनुकूल है।
- source_word: בַּקִּיר
  choice: दीवार पर
  rationale: ב लक्ष्य को सूचित करता है। हिन्दी में ‘दीवार पर अपना क्रोध उतारना’ लक्ष्य-वाचक और स्वाभाविक है।
- source_word: וּבַטָּחִים אֹתוֹ תָּפֵל
  choice: और उस पर सफेदी पोतनेवालों पर
  rationale: טוח का अर्थ पोतना/लेप करना है। यह वाक्य दीवार और उसे भ्रामक बाहरी लेप देनेवालों—दोनों को न्याय का लक्ष्य बनाए रखता है।
- source_word: תָּפֵל
  choice: सफेदी
  rationale: संदर्भ में यह कमजोर दीवार को ढकनेवाले सतही या घटिया लेप का बिंब है। ‘सफेदी’ हिन्दी में इस बिंब को संक्षेप और स्वाभाविक रूप से रखती है; वैकल्पिक अर्थ पादटिप्पणी में सुरक्षित है।
- source_word: וְאֹמַר לָכֶם
  choice: और मैं तुमसे कहूँगा
  rationale: मूल की सीधी भविष्यकालीन घोषणा को निकटता से रखता है।
- source_word: אֵין הַקִּיר וְאֵין הַטָּחִים אֹתוֹ
  choice: न तो दीवार रही और न उसे पोतनेवाले
  rationale: אֵין के अनस्तित्व के भाव और दोनों खंडों की समानांतर रचना को स्वाभाविक हिन्दी में सुरक्षित रखता है।
theological_decisions:
- issue: दीवार और सफेदी के रूपक का अर्थ
  choice: मुख्य पाठ में ठोस रूपक को बिना व्याख्यात्मक विस्तार के बनाए रखना
  alternative: इस पद में ही दीवार और पोतनेवालों को झूठे भविष्यद्वक्ताओं और उनके भ्रामक आश्वासनों के रूप में स्पष्ट करना
  rationale: आसपास का संदर्भ रूपक की व्याख्या करता है, पर इस पद का मूल पाठ न्याय को चित्रात्मक भाषा में व्यक्त करता है। रूपक को बनाए रखने से अनकही व्याख्या पाठ में नहीं जोड़ी जाती।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और भविष्यद्वाणी के न्यायपूर्ण स्वर के अनुरूप। ‘पोतनेवालों’ को संयुक्त रूप में लिखा गया है और मूल की दीवार/लेप की ठोस छवि सुरक्षित रखी गई है।
