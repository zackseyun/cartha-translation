  yaml_path: translation/ot/ezekiel/013/016.yaml
  text: the prophets of Israel who prophesy concerning Jerusalem and who see for her a vision of peace[a], when there is no peace, declares the Lord GOD.
translation:
  language: hi
  text: इस्राएल के वे भविष्यद्वक्ता, जो यरूशलेम के विषय में भविष्यवाणी करते और उसके लिए शान्ति का दर्शन देखते हैं[a], जबकि शान्ति है ही नहीं—प्रभु यहोवा की यही वाणी है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘कुशल-क्षेम का दर्शन’; इब्रानी शब्द शालोम में शान्ति, सम्पूर्णता और कल्याण के भाव शामिल हो सकते हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: נְבִיאֵי יִשְׂרָאֵל
  choice: इस्राएल के वे भविष्यद्वक्ता
  rationale: सम्बन्धसूचक रचना को स्वाभाविक हिन्दी में व्यक्त किया गया है; ‘वे’ आगे आने वाले विशेषणात्मक उपवाक्यों से संज्ञा को सुगमता से जोड़ता है।
- source_word: הַנִּבְּאִים אֶל יְרוּשָׁלַםִ
  choice: जो यरूशलेम के विषय में भविष्यवाणी करते
  rationale: कृदन्त उनकी चलती/विशिष्ट गतिविधि बताता है। אֶל का मूल दिशात्मक भाव है, पर נבא के साथ इस सन्दर्भ में यरूशलेम भविष्यवाणी का विषय/लक्ष्य है; हिन्दी में ‘के विषय में’ अस्पष्टता घटाते हुए सन्दर्भ के अनुकूल है।
- source_word: וְהַחֹזִים לָהּ
  choice: और उसके लिए ... दर्शन देखते हैं
  rationale: स्त्रीलिंग प्रत्यय यरूशलेम की ओर लौटता है। ‘उसके लिए’ दत्तिव/हितार्थक भाव और ‘दर्शन देखते’ חזה की दर्शनीय भाषा को सुरक्षित रखता है।
- source_word: חֲזוֹן שָׁלוֹם
  choice: शान्ति का दर्शन
  rationale: ‘दर्शन’ और ‘शान्ति’ दोनों मूल पदों को सीधे व्यक्त करता है तथा अगले विरोधी कथन में ‘शान्ति’ की पुनरावृत्ति बनाए रखता है।
- source_word: וְאֵין שָׁלוֹם
  choice: जबकि शान्ति है ही नहीं
  rationale: וְ यहाँ विरोधी/परिस्थितिजन्य सम्बन्ध व्यक्त करता है। ‘है ही नहीं’ झूठे दर्शन और वास्तविकता के तीखे विरोध को स्वाभाविक हिन्दी में उभारता है।
- source_word: נְאֻם
  choice: यही वाणी है
  rationale: यह भविष्यवाणी-सूत्र को गरिमापूर्ण और प्रचलित हिन्दी बाइबलीय शैली में व्यक्त करता है।
- source_word: אֲדֹנָי יְהוִה
  choice: प्रभु यहोवा
  rationale: संयुक्त उपाधि में אֲדֹנָי को ‘प्रभु’ और व्यक्तिगत दिव्य नाम יהוה को हिन्दी में प्रचलित रूप ‘यहोवा’ से अलग-अलग सुरक्षित रखा गया है।
theological_decisions:
- issue: אֲדֹנָי יְהוִה में दिव्य नाम का अनुवाद
  choice: प्रभु यहोवा
  alternative: प्रभु परमेश्वर
  rationale: मूल पाठ में सामान्य उपाधि के बाद चतुरक्षरी व्यक्तिगत नाम आता है। ‘प्रभु यहोवा’ इस भेद को बनाए रखता है और नाम को सामान्य पद ‘परमेश्वर’ में विलीन नहीं करता।
- issue: שָׁלוֹם का अर्थ-क्षेत्र
  choice: मुख्य पाठ में ‘शान्ति’, पादटिप्पणी में व्यापक अर्थ
  alternative: कुशल-क्षेम
  rationale: इसी पद की तुरन्त पुनरावृत्ति से बना अलंकारिक विरोध ‘शान्ति’ द्वारा स्पष्ट रहता है, जबकि पादटिप्पणी सम्पूर्णता और कल्याण का व्यापक अर्थ सुरक्षित रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किन्तु सहज शैली अपनाई गई है। वाक्य की भविष्यवाणी-संबंधी लय, ‘शान्ति’ की जानबूझकर की गई पुनरावृत्ति और अन्तिम दिव्य वाणी-सूत्र बनाए रखे गए हैं।
