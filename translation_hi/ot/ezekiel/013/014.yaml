id: EZK.13.14
reference: Ezekiel 13:14
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/הָ֨רַסְתִּ֜י אֶת הַ/קִּ֨יר אֲשֶׁר טַחְתֶּ֥ם תָּפֵ֛ל וְ/הִגַּעְתִּ֥י/הוּ אֶל הָ/אָ֖רֶץ וְ/נִגְלָ֣ה יְסֹד֑/וֹ וְ/נָֽפְלָה֙ וּ/כְלִיתֶ֣ם בְּ/תוֹכָ֔/הּ וִֽ/ידַעְתֶּ֖ם כִּֽי אֲנִ֥י יְהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/013/014.yaml
  text: I will tear down the wall that you plastered with whitewash[a], and bring it down to the ground, so that its foundation is laid bare. It will fall, and you will perish within it. Then you will know that I am Yahweh.
translation:
  language: hi
  text: जिस दीवार पर तुमने सफेदी[a] पोती है, उसे मैं ढा दूँगा और धरती पर गिरा दूँगा, जिससे उसकी नींव खुल जाएगी। वह गिर पड़ेगी, और तुम उसके भीतर नष्ट हो जाओगे। तब तुम जानोगे कि मैं याहवे हूँ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तुमने उस पर घटिया गारा पोता है।” इब्रानी शब्द सफेदी जैसे ऊपरी लेप या कमजोर, अनुपयुक्त गारे का संकेत दे सकता है; इस प्रसंग में दोनों ही भ्रामक और अस्थिर आवरण का भाव देते हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָרַסְתִּי
  choice: मैं ढा दूँगा
  rationale: הרס किसी संरचना को तोड़कर गिरा देने का बोध देता है; ‘ढा दूँगा’ हिंदी में स्वाभाविक और चित्रात्मक है।
- source_word: הַקִּיר
  choice: दीवार
  rationale: קִיר का ठोस अर्थ ‘दीवार’ है; भविष्यवाणी के रूपक को स्पष्ट किए बिना उसी रूप में रखा गया है।
- source_word: טַחְתֶּם תָּפֵל
  choice: तुमने सफेदी पोती है
  rationale: תָּפֵל संदर्भ में भ्रामक, ऊपरी लेप का संकेत दे सकता है। ‘सफेदी पोती’ इस चित्र को स्वाभाविक हिंदी में व्यक्त करती है, जबकि घटिया गारे की संभावित व्याख्या पादटिप्पणी में सुरक्षित है।
- source_word: וְהִגַּעְתִּיהוּ אֶל־הָאָרֶץ
  choice: और भूमि पर गिरा दूँगा
  rationale: हिफ़ील रूप दीवार को भूमि तक पहुँचा देने, अर्थात पूरी तरह गिरा देने, का परिणाम व्यक्त करता है।
- source_word: וְנִגְלָה יְסֹדוֹ
  choice: जिससे उसकी नींव खुल जाएगी
  rationale: निफ़अल रूप नींव के अनावृत हो जाने को दर्शाता है; ‘खुल जाएगी’ सरल और स्वाभाविक है।
- source_word: וְנָפְלָה
  choice: वह गिर पड़ेगी
  rationale: स्त्रीलिंग एकवचन क्रिया दीवार की ओर लौटती है; ‘गिर पड़ेगी’ उसके ढहने को स्पष्ट करती है।
- source_word: וּכְלִיתֶם בְּתוֹכָהּ
  choice: तुम उसके भीतर नष्ट हो जाओगे
  rationale: כלה यहाँ विनाश या अंत को और בְּתוֹכָהּ उसके अंदर होने को व्यक्त करता है; अनावश्यक रूप से यह तय नहीं किया गया कि विनाश ठीक किस प्रकार होगा।
- source_word: וִידַעְתֶּם כִּי אֲנִי יְהוָה
  choice: तब तुम जानोगे कि मैं यहोवा हूँ
  rationale: यहेजकेल की परिचित पहचान-सूक्ति को सीधे रखा गया है और יהוה को व्यक्तिगत दिव्य नाम ‘यहोवा’ के रूप में लिप्यंतरित किया गया है।
theological_decisions:
- issue: दिव्य नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: मूल पाठ में चार-अक्षरीय व्यक्तिगत नाम सीधे आया है। हिंदी में व्यापक रूप से पहचाना जाने वाला लिप्यंतरण ‘यहोवा’ नाम की विशिष्टता बनाए रखता है; इसे उपाधि ‘प्रभु’ से नहीं बदला गया।
- issue: दीवार और उस पर किए गए लेप का रूपक
  choice: ठोस चित्र को बिना व्याख्यात्मक विस्तार के बनाए रखा गया
  alternative: दीवार को सीधे झूठी भविष्यवाणी और लेप को छल घोषित करना
  rationale: पद स्वयं न्याय का चित्र प्रस्तुत करता है; उसकी धार्मिक व्याख्या को मुख्य पाठ में जोड़ना मूल की अर्थगत गुंजाइश को अनावश्यक रूप से सीमित करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य हिंदी पाठक के लिए सहज रखी गई है। ‘ढा दूँगा’, ‘नींव खुल जाएगी’ और ‘भीतर नष्ट हो जाओगे’ मूल चित्र और क्रम को निकटता से बनाए रखते हैं।
