id: EZK.13.23
reference: Ezekiel 13:23
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: לָ/כֵ֗ן שָׁ֚וְא לֹ֣א תֶחֱזֶ֔ינָה וְ/קֶ֖סֶם לֹא תִקְסַ֣מְנָה ע֑וֹד וְ/הִצַּלְתִּ֤י אֶת עַמִּ/י֙ מִ/יֶּדְ/כֶ֔ן וִֽ/ידַעְתֶּ֖ן כִּֽי אֲנִ֥י יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/013/023.yaml
  text: Therefore you will no longer see false visions or practice divination anymore, and I will deliver my people from your hand. Then you will know that I am the LORD.
translation:
  language: hi
  text: इसलिए तुम अब झूठे दर्शन नहीं देखोगी और फिर कभी शकुन-विचार नहीं करोगी। मैं अपनी प्रजा को तुम्हारे हाथ से छुड़ाऊँगा; तब तुम जानोगी कि मैं यहोवा हूँ।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שָׁוְא
  choice: झूठे
  rationale: यहाँ स्त्री भविष्यद्वक्ताओं के भ्रामक दर्शनों के लिए प्रयुक्त शब्द को सहज और प्रसंगानुकूल रूप से व्यक्त करता है।
- source_word: קֶסֶם / תִקְסַמְנָה
  choice: शकुन-विचार करोगी
  rationale: मूल संज्ञा और उसी धातु की क्रिया निषिद्ध भावी-ज्ञान या शकुन बताने की क्रिया दर्शाती हैं; ‘शकुन-विचार’ आधुनिक पाठक के लिए स्पष्ट है और इसे सामान्य भविष्यवाणी से अलग रखता है।
- source_word: וְהִצַּלְתִּי
  choice: छुड़ाऊँगा
  rationale: हाथ से बचाने या मुक्त कराने के भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: मूल पाठ में आए परमेश्वर के विशिष्ट नाम को उपाधि में बदलने के बजाय हिन्दी में प्रचलित लिप्यंतरण द्वारा रखा गया है।
theological_decisions:
- issue: दिव्य नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: प्रभु
  rationale: यह पद पहचान-सूत्र ‘मैं ही יהוה हूँ’ का प्रयोग करता है; विशिष्ट नाम बनाए रखने से मूल की पहचान और बल सुरक्षित रहते हैं।
- issue: स्त्रीलिंग बहुवचन संबोधन
  choice: तुम…देखोगी / करोगी; तुम्हारे हाथ
  alternative: लिंग-निरपेक्ष बहुवचन रूप
  rationale: इब्रानी क्रियाएँ स्पष्ट रूप से स्त्रीलिंग बहुवचन हैं और निकटवर्ती प्रसंग उन स्त्रियों को संबोधित करता है जो भविष्यवाणी करती थीं; हिन्दी के रूपों में इसे बनाए रखा गया है।
- issue: וִידַעְתֶּן का संबंध
  choice: और तब तुम जानोगी
  alternative: और तुम जानोगी
  rationale: ‘तब’ परिणामात्मक संबंध को स्पष्ट करता है, पर ज्ञान के स्वरूप या प्रतिक्रिया को मूल से आगे जाकर निर्धारित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। स्त्रीलिंग बहुवचन रूप मूल इब्रानी के प्रत्यक्ष संबोधन को सुरक्षित रखते हैं।
