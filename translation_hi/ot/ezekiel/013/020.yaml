base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/013/020.yaml
  text: 'Therefore thus says the Lord GOD: Behold[a], I am against your magic bands with which you hunt the lives there like birds, and I will tear them from your arms[c][b], and I will let the lives go free—the ones you hunt like birds.'
translation:
  language: hi
  text: 'इसलिए प्रभु यहोवा यों कहता है: देखो, मैं तुम्हारे उन जादुई पट्टों[a] के विरुद्ध हूँ, जिनसे तुम वहाँ लोगों[b] का ऐसे शिकार करती हो मानो वे पक्षी हों[c]। मैं उन पट्टों को तुम्हारी बाँहों से फाड़कर अलग कर दूँगा और उन लोगों को मुक्त कर दूँगा—उन्हीं को, जिनका तुम पक्षियों की तरह शिकार करती हो।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी शब्द दुर्लभ है और उसका सटीक अर्थ अनिश्चित है; इसका अनुवाद ‘गद्दियाँ’, ‘ताबीज’ या ‘बाँहों के पट्टे’ भी किया गया है। संभवतः ये भविष्यद्वक्त्रियों की कोई अनुष्ठानिक वस्तुएँ थीं।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में ‘प्राणों’ या ‘जीवों’; यहाँ आशय जीवित व्यक्तियों से है।
    reason: lexical_alternative
  - marker: c
    text: शाब्दिक रूप से ‘उड़ने के लिए’ या ‘उड़नेवाले’। इब्रानी वाक्यरचना कठिन है और संभवतः लोगों को पक्षियों की तरह फँसाने की छवि प्रस्तुत करती है।
    reason: textual_ambiguity
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  choice: प्रभु यहोवा
  rationale: अֲדֹנָי को पदवी ‘प्रभु’ और יהוה को परमेश्वर के व्यक्तिगत नाम ‘यहोवा’ के रूप में अलग-अलग बनाए रखा गया है।
- source_word: הִנְנִי אֶל
  choice: देखो, मैं ... के विरुद्ध हूँ
  rationale: यह मुहावरा ध्यान आकर्षित करने के साथ परमेश्वर के सक्रिय विरोध को व्यक्त करता है।
- source_word: כִּסְּתוֹתֵיכֶנָה
  choice: तुम्हारे ... जादुई पट्टों
  rationale: इस दुर्लभ शब्द का सटीक संकेत अनिश्चित है; प्रसंग में ये झूठी भविष्यद्वक्त्रियों द्वारा बाँहों पर इस्तेमाल की जाने वाली अनुष्ठानिक वस्तुएँ प्रतीत होती हैं। ‘जादुई पट्टे’ संभावित कार्य को स्पष्ट करता है, जबकि पादटिप्पणी अनिश्चितता बचाए रखती है।
- source_word: מְצֹדְדוֹת
  choice: शिकार करती हो
  rationale: मूल क्रिया शिकार करने या फँसाने की छवि रखती है; स्त्रीलिंग बहुवचन रूप को हिंदी में भी व्यक्त किया गया है।
- source_word: הַנְּפָשׁוֹת / נְפָשִׁים
  choice: लोगों
  rationale: נֶפֶשׁ यहाँ अमूर्त या केवल देहरहित ‘आत्मा’ नहीं, बल्कि संकट में पड़े जीवित व्यक्तियों को सूचित करता है। सहज हिंदी के लिए ‘लोगों’ चुना गया और शाब्दिक विकल्प पादटिप्पणी में दिया गया है।
- source_word: לְפֹרְחוֹת / לְפֹרְחֹת
  choice: मानो वे पक्षी हों / पक्षियों की तरह
  rationale: פרח में उड़ने या फड़फड़ाने का भाव है। कठिन और संक्षिप्त इब्रानी वाक्यरचना को पक्षी-शिकार की उपमा के रूप में व्यक्त किया गया है, किंतु पादटिप्पणी में अधिक शाब्दिक अर्थ सुरक्षित है।
- source_word: וְקָרַעְתִּי אֹתָם מֵעַל זְרוֹעֹתֵיכֶם
  choice: मैं उन पट्टों को तुम्हारी बाँहों से फाड़कर अलग कर दूँगा
  rationale: यह परमेश्वर द्वारा उन अनुष्ठानिक वस्तुओं को बलपूर्वक हटाने की न्याय-संबंधी छवि को स्पष्ट और स्वाभाविक हिंदी में रखता है।
- source_word: וְשִׁלַּחְתִּי
  choice: छोड़ दूँगा
  rationale: प्रसंग में क्रिया फँसे हुए लोगों को मुक्त करने का अर्थ देती है; ‘छोड़ दूँगा’ इस मुक्ति को सहजता से व्यक्त करता है।
- source_word: שָׁם
  choice: वहाँ
  rationale: इब्रानी क्रियाविशेषण को बनाए रखा गया है, यद्यपि उसका सटीक वाक्यगत संबंध अस्पष्ट है।
theological_decisions:
- issue: गुप्त-अनुष्ठानिक शिकार के प्रसंग में נֶפֶשׁ का अनुवाद
  choice: लोगों
  alternative: प्राणों / जीवों / आत्माओं
  rationale: यह पद व्यक्तियों को जीवित प्राणियों के रूप में शिकार बनाए जाने और छुड़ाए जाने की बात करता है। ‘लोगों’ किसी विशिष्ट आत्मा-देह सिद्धांत को आरोपित किए बिना आशय देता है; मूल की व्यापकता पादटिप्पणी में सुरक्षित है।
- issue: प्रतीकात्मक वस्तुओं की प्रकृति
  choice: जादुई पट्टे
  alternative: गद्दियाँ / ताबीज / बाजूबंद
  rationale: प्रसंग इनके अनुष्ठानिक और हानिकारक उपयोग का संकेत देता है, पर उनकी ठीक बनावट निश्चित नहीं है। मुख्य पाठ संभावित कार्य बताता है और पादटिप्पणी वस्तु की पहचान को खुला रखती है।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण किंतु सरल शैली रखी गई है। संबोधन स्त्रीलिंग बहुवचन (‘करती हो’) है, क्योंकि इब्रानी क्रिया झूठी भविष्यद्वक्त्रियों को संबोधित करती है। ‘यों कहता है’ भविष्यवाणी-सूत्र की औपचारिकता बनाए रखता है; दुर्लभ वस्तु और पक्षी-छवि की वास्तविक अनिश्चितताएँ पादटिप्पणियों में स्पष्ट की गई हैं।
