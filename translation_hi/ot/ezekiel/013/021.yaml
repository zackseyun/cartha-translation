source:
  edition: WLC
  text: וְ/קָרַעְתִּ֞י אֶת מִסְפְּחֹֽתֵי/כֶ֗ם וְ/הִצַּלְתִּ֤י אֶת עַמִּ/י֙ מִ/יֶּדְ/כֶ֔ן וְ/לֹֽא יִהְי֥וּ ע֛וֹד בְּ/יֶדְ/כֶ֖ן לִ/מְצוּדָ֑ה וִֽ/ידַעְתֶּ֖ן כִּֽי אֲנִ֥י יְהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/013/021.yaml
  text: I will tear off your magic bands[a], and I will deliver my people from your hand, and they will no longer be in your hand as prey[b]; then you will know that I am Yahweh.
translation:
  language: hi
  text: मैं तुम्हारी जादुई पट्टियाँ[a] फाड़ डालूँगा और अपनी प्रजा को तुम्हारे हाथ से छुड़ाऊँगा। वे फिर कभी शिकार के लिए तुम्हारे हाथ में नहीं होंगे। तब तुम जानोगी कि मैं याहवे हूँ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “पट्टियाँ,” “ताबीज़,” अथवा संभवतः “घूँघट/आवरण”; इब्रानी शब्द दुर्लभ है और वह ठीक किस वस्तु को दर्शाता है, यह निश्चित नहीं है।
    reason: lexical_alternative
lexical_decisions:
- source_word: קָרַעְתִּי
  choice: फाड़ डालूँगा
  rationale: קרע का मूल अर्थ ‘फाड़ना’ या ‘चीरना’ है। यहाँ वस्तुओं को निष्प्रभावी करके हटाने की प्रबल क्रिया व्यक्त होती है।
- source_word: מִסְפְּחֹתֵיכֶם
  choice: जादुई पट्टियाँ
  rationale: यह एक दुर्लभ शब्द है और वस्तु का ठीक स्वरूप अनिश्चित है। निकटवर्ती प्रसंग में इन वस्तुओं का प्रयोग छलपूर्ण जादुई क्रियाओं में होता है; इसलिए ‘जादुई पट्टियाँ’ भौतिक वस्तु और उसके कार्य दोनों को संकेतित करता है, जबकि अनिश्चितता पादटिप्पणी में सुरक्षित है।
- source_word: הִצַּלְתִּי
  choice: छुड़ाऊँगा
  rationale: נצל यहाँ किसी के अधिकार या पकड़ से बचा निकालने का अर्थ देता है। ‘छुड़ाऊँगा’ आधुनिक हिन्दी में इस ठोस मुक्ति को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: עַמִּי
  choice: अपनी प्रजा
  rationale: यह परमेश्वर और इस्राएल के संबंध का मानक वाचक है। हिन्दी में कर्ता के साथ ‘अपनी प्रजा’ स्वाभाविक और स्पष्ट है।
- source_word: מִיֶּדְכֶן / בְּיֶדְכֶן
  choice: तुम्हारे हाथ से / तुम्हारे हाथ में
  rationale: ‘हाथ’ अधिकार और नियंत्रण का रूपक है। उसे बनाए रखने से मूल की पुनरावृत्ति और चित्रात्मकता दोनों सुरक्षित रहती हैं।
- source_word: לִמְצוּדָה
  choice: शिकार
  rationale: מצודה जाल, पकड़ने या शिकार करने के भाव से संबंधित हो सकता है। इस वाक्य में ‘शिकार’ लोगों की असहाय, पकड़ी हुई दशा को स्पष्ट करता है, पर वैकल्पिक अर्थ पादटिप्पणी में दिया गया है।
- source_word: וִידַעְתֶּן
  choice: तब तुम जानोगी
  rationale: स्त्रीलिंग बहुवचन संबोधन को हिन्दी के ‘तुम ... जानोगी’ से बनाए रखा गया है। ‘तब’ न्याय और पहचान के बीच परिणाम-संबंध को स्पष्ट करता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: मूल में परमेश्वर का व्यक्तिगत नाम है, कोई उपाधि नहीं। ‘याहवे’ उसका हिन्दी लिप्यंतरण है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में चतुरक्षरीय व्यक्तिगत नाम सीधे आया है। उपाधि से बदलने के बजाय ‘याहवे’ नाम को सुरक्षित रखता है।
- issue: स्त्रियों द्वारा प्रयुक्त वस्तुओं का स्वरूप
  choice: जादुई पट्टियाँ
  alternative: पट्टियाँ; ताबीज़; घूँघट या आवरण
  rationale: प्रसंग इन वस्तुओं को जादुई और छलपूर्ण गतिविधि से जोड़ता है, किंतु दुर्लभ इब्रानी शब्द उनके ठीक भौतिक स्वरूप को निश्चित नहीं करता। मुख्य पाठ में प्रसंगगत कार्य बताया गया है और पादटिप्पणी में वास्तविक शब्दगत अनिश्चितता रखी गई है।
- issue: לִמְצוּדָה में पकड़ या शिकार का बिंब
  choice: शिकार
  alternative: पकड़े जाने के लिए; शिकार किए जाने के लिए
  rationale: ‘शिकार’ स्त्रियों के नियंत्रण में पड़ी प्रजा की दशा को संक्षेप और स्वाभाविक हिन्दी में व्यक्त करता है, बिना यह निश्चित किए कि मूल संज्ञा किसी जाल, शिकार या पकड़ने की क्रिया को दर्शाती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। स्त्रीलिंग बहुवचन संबोधन ‘जानोगी’ से प्रकट किया गया है। ‘हाथ’ का इब्रानी रूपक और उसकी पुनरावृत्ति जानबूझकर सुरक्षित रखी गई है।
