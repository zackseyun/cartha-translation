source:
  edition: WLC
  text: וַ/תְּחַלֶּלְ֨נָה אֹתִ֜/י אֶל עַמִּ֗/י בְּ/שַׁעֲלֵ֣י שְׂעֹרִים֮ וּ/בִ/פְת֣וֹתֵי לֶחֶם֒ לְ/הָמִ֤ית נְפָשׁוֹת֙ אֲשֶׁ֣ר לֹֽא תְמוּתֶ֔נָה וּ/לְ/חַיּ֥וֹת נְפָשׁ֖וֹת אֲשֶׁ֣ר לֹא תִֽחְיֶ֑ינָה בְּ/כַ֨זֶּבְ/כֶ֔ם לְ/עַמִּ֖/י שֹׁמְעֵ֥י כָזָֽב־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/013/019.yaml
  text: And you have profaned me among my people for handfuls of barley and for pieces of bread[a], putting to death persons who should not die and keeping alive persons who should not live, by your lying to my people[b], who listen to lies.
translation:
  language: hi
  text: और तुम मुट्ठी भर जौ और रोटी के टुकड़ों[a] के लिए मेरी प्रजा के बीच मुझे अपवित्र करती हो। तुम उन लोगों[b] को मार डालती हो जिन्हें मरना नहीं चाहिए, और उन लोगों को जीवित रखती हो जिन्हें जीवित नहीं रहना चाहिए; तुम मेरी प्रजा से झूठ बोलकर ऐसा करती हो—उस प्रजा से जो झूठ सुनती है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘रोटी के कौरों।’ हिब्रू में टूटे हुए छोटे टुकड़े या छोटी मात्राएँ अभिप्रेत हैं; इससे उस तुच्छ भुगतान पर जोर पड़ता है जिसके लिए वे ऐसा करती थीं।
    reason: lexical_alternative
  - marker: b
    text: हिब्रू में दोनों उपवाक्यों में शाब्दिक रूप से ‘प्राणों’ या ‘जीवनों’ का शब्द है; यहाँ यह मनुष्यों के लिए प्रयुक्त हिब्रू मुहावरा है, इसलिए अनुवाद ‘लोगों’ किया गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתְּחַלֶּלְנָה
  choice: तुम ... मुझे अपवित्र करती हो
  rationale: पिएल रूप यहाँ परमेश्वर की पवित्रता को साधारण या दूषित ठहराने का धार्मिक अर्थ रखता है। स्त्रीलिंग बहुवचन का संकेत ‘करती हो’ में बना रहता है।
- source_word: אֹתִי אֶל־עַמִּי
  choice: मेरी प्रजा के बीच मुझे
  rationale: אֶל का संदर्भगत अर्थ यहाँ प्रजा के बीच या उनकी दृष्टि में है; ‘के बीच’ स्वाभाविक हिन्दी में सामाजिक परिवेश को व्यक्त करता है।
- source_word: בְּשַׁעֲלֵי שְׂעֹרִים
  choice: मुट्ठी भर जौ के लिए
  rationale: यह पद थोड़ी मात्रा, अर्थात मामूली भुगतान, को दर्शाता है। ‘के लिए’ लेन-देन का भाव स्पष्ट करता है।
- source_word: וּבִפְתוֹתֵי לֶחֶם
  choice: और रोटी के टुकड़ों के लिए
  rationale: פְּתֹתֵי टूटे हुए छोटे टुकड़ों या कौरों को दर्शाता है; ‘टुकड़ों’ का प्रयोग आधुनिक हिन्दी में स्पष्ट और सहज है।
- source_word: לְהָמִית נְפָשׁוֹת
  choice: उन लोगों को मार डालती हो
  rationale: नֶפֶשׁ यहाँ अमूर्त आत्मा नहीं, बल्कि जीवित मनुष्य को सूचित करता है। ‘लोगों’ से वही हिब्रू मुहावरा स्वाभाविक हिन्दी में आता है।
- source_word: אֲשֶׁר לֹא תְמוּתֶנָה
  choice: जिन्हें मरना नहीं चाहिए
  rationale: यह झूठे न्याय-वचन द्वारा उचित परिणाम उलटने का नैतिक और न्यायिक भाव रखता है; ‘नहीं चाहिए’ इसे केवल भविष्यवाणी नहीं बनाता।
- source_word: וּלְחַיּוֹת נְפָשׁוֹת
  choice: और उन लोगों को जीवित रखती हो
  rationale: हिफ़ील क्रिया का सकर्मक अर्थ ‘जीवित रखना’ है और यह ‘मार डालना’ के समानांतर विरोध को स्पष्ट रखता है।
- source_word: אֲשֶׁר לֹא תִחְיֶינָה
  choice: जिन्हें जीवित नहीं रहना चाहिए
  rationale: पिछले उपवाक्य के समानांतर न्यायिक-नैतिक तनाव को बनाए रखा गया है, बिना पूर्वनियति जैसी अतिरिक्त व्याख्या जोड़े।
- source_word: בְּכַזֶּבְכֶם
  choice: तुम मेरी प्रजा से झूठ बोलकर ऐसा करती हो
  rationale: בְּ साधन का बोध देता है। ‘झूठ बोलकर’ उस क्रिया को स्पष्ट करता है जिसके द्वारा ये उलटे परिणाम उत्पन्न किए जाते हैं।
- source_word: שֹׁמְעֵי כָזָב
  choice: जो झूठ सुनती है
  rationale: सहभागी रूप प्रजा को झूठ ग्रहण करने वाली बताता है। ‘सुनती है’ मूल की संक्षिप्तता रखता है और संदर्भ में ग्रहणशीलता भी सूचित करता है।
theological_decisions:
- issue: नְפָשׁוֹת का न्याय-संदर्भ में अर्थ
  choice: लोगों
  alternative: प्राणों / जीवों
  rationale: यहाँ शब्द संपूर्ण मनुष्यों या उनके जीवन को सूचित करता है। ‘आत्माओं’ से शरीर-आत्मा द्वैत का ऐसा अर्थ आ सकता है जो हिब्रू में आवश्यक नहीं है; ‘लोगों’ से ठोस मानवीय संदर्भ स्पष्ट रहता है।
- issue: मरने और जीवित रहने वाले उपवाक्यों का बल
  choice: 'न्यायिक-नैतिक: ‘मरना नहीं चाहिए’ / ‘जीवित नहीं रहना चाहिए’'
  alternative: 'केवल भविष्यसूचक: ‘नहीं मरेंगे’ / ‘जीवित नहीं रहेंगे’'
  rationale: संदर्भ झूठे भविष्यवचनों द्वारा उचित न्यायिक परिणामों को उलटने का है। ‘चाहिए’ नैतिक और न्यायिक बल बचाता है, पर किसी विस्तृत धर्मवैज्ञानिक व्यवस्था को पाठ में नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। स्त्रीलिंग ‘करती हो’ संबोधित स्त्रियों को दर्शाता है। दूसरे वाक्य में ‘ऐसा’ जोड़कर साधनवाचक अंतिम पद को स्पष्ट हिन्दी वाक्य-संरचना से जोड़ा गया है, जबकि मूल का आरोप और उसका न्यायिक तनाव सुरक्षित है।
