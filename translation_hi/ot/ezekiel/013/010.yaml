source:
  edition: WLC
  text: יַ֣עַן וּ/בְ/יַ֜עַן הִטְע֧וּ אֶת עַמִּ֛/י לֵ/אמֹ֥ר שָׁל֖וֹם וְ/אֵ֣ין שָׁל֑וֹם וְ/הוּא֙ בֹּ֣נֶה חַ֔יִץ וְ/הִנָּ֛/ם טָחִ֥ים אֹת֖/וֹ תָּפֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/013/010.yaml
  text: Because[a], yes, because they have led my people astray, saying, ‘Peace,’ when there is no peace, and when someone builds a wall, behold, they plaster it with whitewash.
translation:
  language: hi
  text: क्योंकि—हाँ, क्योंकि उन्होंने मेरी प्रजा को यह कहकर भटका दिया है, ‘शांति है,’ जबकि शांति है ही नहीं; और जब कोई दीवार बनाता है, तो देखो, वे उस पर सफेदी पोतते हैं।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उस पर कच्चा गारा लगा देते हैं।” इब्रानी शब्द सतही लेप या ठीक से तैयार न किए गए गारे की ओर संकेत कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: יַעַן / וּבְיַעַן
  choice: क्योंकि—हाँ, इसलिए कि
  rationale: दोहराए गए कारणसूचक पद की बलात्मकता को बनाए रखा गया है। हिन्दी में ‘हाँ’ उस पुष्टि और जोर को स्वाभाविक रूप से व्यक्त करता है।
- source_word: הִטְעוּ
  choice: भटका दिया है
  rationale: यह क्रिया किसी को मार्ग से भटका देने का भाव रखती है; यह केवल सूचना की भूल नहीं, बल्कि नैतिक और आत्मिक गुमराही भी व्यक्त करती है।
- source_word: עַמִּי
  choice: मेरी प्रजा
  rationale: यह वाचा-संबंधी अभिव्यक्ति का सीधा और प्रतिष्ठित हिन्दी रूप है।
- source_word: לֵאמֹר שָׁלוֹם וְאֵין שָׁלוֹם
  choice: यह कहकर, ‘शान्ति है,’ जबकि शान्ति है ही नहीं
  rationale: שָׁלוֹם को ‘शान्ति’ रखा गया है, जिसमें सुरक्षा और कुशल का व्यापक भाव बना रहता है। ‘है ही नहीं’ झूठे आश्वासन और वास्तविकता के तीखे विरोध को व्यक्त करता है।
- source_word: וְהוּא בֹּנֶה
  choice: और जब कोई ... बनाता है
  rationale: एकवचन कर्ता यहाँ सामान्य या प्रतिनिधिक अर्थ में समझा जा सकता है; ‘कोई’ हिन्दी में किसी विशिष्ट व्यक्ति को अनावश्यक रूप से चिन्हित किए बिना यह अर्थ देता है।
- source_word: חַיִץ
  choice: दीवार
  rationale: शब्द का सामान्य अर्थ दीवार या विभाजक दीवार है। मुख्य पाठ में ‘कमज़ोर’ या ‘कच्ची’ जोड़कर रूपक की व्याख्या पहले से नहीं की गई।
- source_word: וְהִנָּם
  choice: तो देखो, वे
  rationale: ‘देखो’ दृश्य की ओर अचानक ध्यान खींचने वाला भविष्यद्वक्ताई बल बनाए रखता है और आधुनिक हिन्दी में भी स्वाभाविक है।
- source_word: טָחִים אֹתוֹ תָּפֵל
  choice: उस पर सफेदी पोत देते हैं
  rationale: क्रिया दीवार पर लेप चढ़ाने या पोतने को दर्शाती है। ‘सफेदी पोतना’ सतही आवरण की ठोस छवि को आधुनिक हिन्दी में स्पष्ट रखता है; पदार्थ की वैकल्पिक समझ को पादटिप्पणी में दिया गया है।
theological_decisions:
- issue: भविष्यद्वक्ताई निन्दा में दीवार और उस पर लेप के रूपक का अर्थ
  choice: दीवार बनाने और उस पर सफेदी पोतने की ठोस छवि को बिना व्याख्यात्मक विस्तार के बनाए रखना
  alternative: ‘कमज़ोर दीवार’ या ‘झूठ से दोष ढकना’ जैसे अर्थ को मुख्य पाठ में स्पष्ट कर देना
  rationale: इब्रानी पाठ इस स्थान पर पहले रूपक प्रस्तुत करता है, उसकी व्याख्या मुख्य पाठ में नहीं मिलाता। ठोस छवि को बनाए रखना उसकी अलंकारिक शक्ति और धर्मवैचारिक तनाव दोनों की रक्षा करता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘प्रजा’ वाचा-संबंधी संबोधन के लिए और ‘देखो’ मूल की जीवंत भविष्यद्वक्ताई शैली के लिए चुना गया है। कारणसूचक आरम्भ का दोहराव जानबूझकर रखा गया है, क्योंकि पद पिछले कथन से जुड़ा हुआ कारण प्रस्तुत करता है।
