base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/013/022.yaml
  text: Because you have disheartened the heart of the righteous with falsehood[a], though I had not caused him grief, and because you have strengthened the hands of the wicked so that he does not turn from his evil way to preserve his life[b],
translation:
  language: hi
  text: क्योंकि तुमने झूठ से धर्मी के हृदय को दुःख पहुँचाया[a], जबकि मैंने उसे दुःख नहीं पहुँचाया था, और तुमने दुष्ट के हाथों को बल दिया, जिससे वह अपने बुरे मार्ग से न फिरे और अपना जीवन न बचाए[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “झूठी बातों से।” हिब्रू शब्द का अर्थ अमूर्त रूप में “झूठ” अथवा ठोस रूप में “झूठी बातें” हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: शब्दशः, “उसे जीवित रखने के लिए।” पद का अर्थ यह है कि दुष्ट को अपने बुरे मार्ग से फिरकर जीवन पाने से रोका जाता है। वैकल्पिक रूप से, “ताकि वह जीवित रहे” या “और जीवित रहे” भी अनुवादित किया जा सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: יַעַן
  choice: क्योंकि
  rationale: यह आगे आने वाले न्याय का कारण प्रस्तुत करता है; ‘क्योंकि’ आधुनिक हिन्दी में स्वाभाविक और स्पष्ट है।
- source_word: הַכְאוֹת לֵב צַדִּיק
  choice: तुमने धर्मी के मन को निराश किया
  rationale: हिफ़ील रूप से उत्पन्न मानसिक पीड़ा या हतोत्साह का भाव आता है। ‘मन को निराश किया’ हिन्दी में स्वाभाविक है और ‘हृदय को दुःख पहुँचाया’ की अपेक्षा इस प्रसंग में प्रभाव को अधिक स्पष्ट करता है।
- source_word: שֶׁקֶר
  choice: झूठ से
  rationale: संज्ञा का साधनात्मक प्रयोग है; ‘झूठ से’ अमूर्त असत्य और झूठी बातों, दोनों को समेट सकता है।
- source_word: וַאֲנִי לֹא הִכְאַבְתִּיו
  choice: जबकि मैंने उसे दुःख नहीं दिया था
  rationale: कर्ता द्वारा दुःख उत्पन्न करने का हिफ़ील भाव सुरक्षित है और झूठी भविष्यद्वक्त्रियों के कार्य के साथ विरोध स्पष्ट होता है।
- source_word: וּלְחַזֵּק יְדֵי רָשָׁע
  choice: और तुमने दुष्ट के हाथों को बल दिया
  rationale: हिब्रू मुहावरे का चित्र बनाए रखता है, जिसका आशय दुष्ट को प्रोत्साहित या निर्भीक करना है।
- source_word: לְבִלְתִּי שׁוּב מִדַּרְכּוֹ הָרָע
  choice: ताकि वह अपने बुरे मार्ग से न फिरे
  rationale: उद्देश्य या परिणाम की संरचना तथा नैतिक अर्थ में ‘मार्ग से फिरना’ दोनों सुरक्षित हैं।
- source_word: לְהַחֲיֹתוֹ
  choice: और जीवित रहे
  rationale: अंतिम हिफ़ील infinitive को अत्यधिक व्याख्यायित किए बिना जीवन के परिणाम के रूप में प्रस्तुत करता है; यह लौकिक या अनन्त जीवन का निर्णय नहीं करता।
theological_decisions:
- issue: अंतिम पदबंध לְהַחֲיֹתוֹ का अर्थ
  choice: और जीवित रहे
  alternative: उसका जीवन बचा रहे / ताकि वह जीवित रहे
  rationale: हिब्रू जीवन की ओर ले जाने वाले परिणाम या उद्देश्य की अनुमति देता है। सरल शब्दावली वाचा-संबंधी न्याय, शारीरिक जीवन और व्यापक धार्मिक अर्थ के बीच मौजूद तनाव को खुला रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सहज रूप अपनाया गया है। ‘धर्मी’, ‘दुष्ट’, ‘मार्ग से फिरना’ और ‘हाथों को बल देना’ भविष्यद्वाणी-साहित्य की प्रमुख छवियों को बनाए रखते हैं। पद अगले वाक्य में जारी रहता है, इसलिए अंत में अल्पविराम रखा गया है।
