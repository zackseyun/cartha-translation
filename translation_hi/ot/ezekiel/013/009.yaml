source:
  edition: WLC
  text: וְ/הָיְתָ֣ה יָדִ֗/י אֶֽל הַ/נְּבִיאִ֞ים הַ/חֹזִ֣ים שָׁוְא֮ וְ/הַ/קֹּסְמִ֣ים כָּזָב֒ בְּ/ס֧וֹד עַמִּ֣/י לֹֽא יִהְי֗וּ וּ/בִ/כְתָ֤ב בֵּֽית יִשְׂרָאֵל֙ לֹ֣א יִכָּתֵ֔בוּ וְ/אֶל אַדְמַ֥ת יִשְׂרָאֵ֖ל לֹ֣א יָבֹ֑אוּ וִ/ידַעְתֶּ֕ם כִּ֥י אֲנִ֖י אֲדֹנָ֥/י יְהוִֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/013/009.yaml
  text: And my hand will be against the prophets who see falsehood and who practice lying divination[a]. They will not be in the council of my people, nor will they be written in the register of the house of Israel, nor will they enter the land of Israel[c][b]. Then you will know that I am the Lord Yahweh.
translation:
  language: hi
  text: और मेरा हाथ उन भविष्यद्वक्ताओं के विरुद्ध होगा, जो मिथ्या दर्शन देखते और झूठी शकुन-विद्या का अभ्यास करते हैं। वे मेरी प्रजा की सभा[a] में न होंगे, न इस्राएल के घराने की नामावली[b] में उनके नाम लिखे जाएँगे, और न वे इस्राएल की भूमि में प्रवेश करेंगे। तब तुम जानोगे कि मैं प्रभु याहवे[c] हूँ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘मेरी प्रजा की परिषद्’ अथवा ‘मेरी प्रजा की अंतरंग मंडली’।
    reason: lexical_alternative
  - marker: b
    text: या ‘अभिलेख’ अथवा ‘लिखित सूची’।
    reason: lexical_alternative
  - marker: c
    text: इब्रानी में אֲדֹנָי יְהוִה (अदोनाय याहवे); इसका पारंपरिक अनुवाद ‘प्रभु परमेश्वर’ भी किया जाता है।
    reason: alternative_reading
lexical_decisions:
- source_word: וְהָיְתָה יָדִי אֶל
  choice: मेरा हाथ ... के विरुद्ध होगा
  rationale: यह इब्रानी मुहावरा सक्रिय विरोध और दण्ड को व्यक्त करता है; ‘के विरुद्ध’ दिशा मात्र के बजाय यही भाव स्पष्ट करता है।
- source_word: הַחֹזִים שָׁוְא
  choice: जो मिथ्या दर्शन देखते हैं
  rationale: ‘दर्शन देखते’ मूल की दर्शनीय/भविष्यदर्शी भाषा को बनाए रखता है, और ‘मिथ्या’ שָׁוְא के झूठ तथा निरर्थकता के अर्थ-क्षेत्र को संक्षेप में व्यक्त करता है।
- source_word: וְהַקֹּסְמִים כָּזָב
  choice: और झूठे शकुन बताते हैं
  rationale: קסם को सामान्य भविष्यवाणी में मिलाने के बजाय ‘शकुन’ अनधिकृत दिव्य-ज्ञान जानने की क्रिया को अलग रखता है; ‘बताते हैं’ आधुनिक हिन्दी में सहज है।
- source_word: בְּסוֹד עַמִּי
  choice: मेरी प्रजा की सभा में
  rationale: סוֹד परिषद्, अंतरंग मंडली या सभा का बोध करा सकता है। ‘सभा’ सामुदायिक सदस्यता के प्रसंग में स्वाभाविक है, जबकि वैकल्पिक सूक्ष्म अर्थ पादटिप्पणी में सुरक्षित हैं।
- source_word: וּבִכְתָב בֵּית יִשְׂרָאֵל לֹא יִכָּתֵבוּ
  choice: इस्राएल के घराने की नामावली में उनके नाम नहीं लिखे जाएँगे
  rationale: כְּתָב यहाँ आधिकारिक लिखित सूची या अभिलेख का संकेत देता है। ‘नामावली’ और निष्क्रिय ‘लिखे जाएँगे’ प्रशासनिक अर्थ तथा निफ़अल रूप दोनों को स्पष्ट रखते हैं।
- source_word: וְאֶל אַדְמַת יִשְׂרָאֵל לֹא יָבֹאוּ
  choice: न वे इस्राएल की भूमि में प्रवेश करेंगे
  rationale: अक्षरशः ‘इस्राएल की भूमि/मिट्टी की ओर नहीं आएँगे’; निर्वासन और वापसी के प्रसंग में ‘भूमि में प्रवेश’ स्वाभाविक हिन्दी है।
- source_word: וִידַעְתֶּם
  choice: तब तुम जानोगे
  rationale: ‘तब’ घोषित न्याय के परिणाम को व्यक्त करता है; बहुवचन ‘तुम’ इब्रानी रूप को बनाए रखता है।
- source_word: אֲנִי אֲדֹנָי יְהוִה
  choice: मैं प्रभु याहवे हूँ
  rationale: אֲדֹנָי को ‘प्रभु’ और परमेश्वर के व्यक्तिगत वाचा-नाम יהוה को लिप्यंतरित ‘याहवे’ के रूप में रखा गया है, जिससे दोनों पद अलग और प्रत्यक्ष रहते हैं।
theological_decisions:
- issue: אֲדֹנָי יְהוִה में परमेश्वर के नाम का अनुवाद
  choice: प्रभु याहवे
  alternative: प्रभु परमेश्वर
  rationale: मूल में उपाधि אֲדֹנָי और वाचा-नाम יהוה दोनों हैं। ‘प्रभु याहवे’ दोनों को सुरक्षित रखता है और एक को दूसरे में विलीन नहीं करता; प्रचलित प्रतिस्थापन पादटिप्पणी में दिया गया है।
- issue: दण्ड की तीन बहिष्करण-वाणियों का संबंध
  choice: सभा, नामावली और भूमि—तीनों को अलग समानांतर निषेध के रूप में रखा गया
  alternative: तीनों को केवल एक ही प्रकार की नागरिक सदस्यता की व्याख्या मानना
  rationale: मूल तीन समांतर कथन देता है, पर उनके सटीक संस्थागत या अन्तकालिक संबंध की व्याख्या नहीं करता; अनुवाद उस तनाव को खुला रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सार्वजनिक पाठ के योग्य रखी गई है। ‘मिथ्या दर्शन’, ‘शकुन’, ‘सभा’ और ‘नामावली’ सामान्य पाठक के लिए बोधगम्य रहते हुए मूल की समानांतर न्याय-वाणी और आधिकारिक बहिष्कार के भाव को बनाए रखते हैं।
