source:
  edition: WLC
  text: אֱמֹ֛ר אֶל טָחֵ֥י תָפֵ֖ל וְ/יִפֹּ֑ל הָיָ֣ה גֶּ֣שֶׁם שׁוֹטֵ֗ף וְ/אַתֵּ֜נָה אַבְנֵ֤י אֶלְגָּבִישׁ֙ תִּפֹּ֔לְנָה וְ/ר֥וּחַ סְעָר֖וֹת תְּבַקֵּֽעַ־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/013/011.yaml
  text: Tell those who plaster it with whitewash that it will fall[a]. There will be a flooding rain, and you, O hailstones, will fall[b], and a windstorm will break it open.
translation:
  language: hi
  text: जो लोग उस पर सफेदी पोतते हैं, उनसे कह, ‘वह दीवार गिर जाएगी। मूसलाधार वर्षा होगी; और हे ओलो, तुम गिरोगे[a]; और आँधी उसे चीर डालेगी।’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'मूल इब्रानी में ओलों को सीधे संबोधित किया गया है: “हे ओलो, तुम गिरोगे।”'
    reason: मूल पाठ के सजीव काव्यात्मक संबोधन को स्पष्ट करना।
lexical_decisions:
- source_word: טָחֵי תָפֵל
  choice: जो लोग उस पर कच्चा गारा पोतते हैं
  rationale: טוח का अर्थ पोतना या पलस्तर करना है। תָפֵל ऐसे घटिया या अनुपयुक्त लेप को सूचित करता है जो दीवार को वास्तव में मजबूत नहीं करता। प्रसंग में ‘कच्चा गारा’ स्वाभाविक हिन्दी है और केवल सजावटी ‘सफेदी’ की अपेक्षा कमजोर निर्माण-सामग्री का भाव अधिक स्पष्ट रखता है।
- source_word: וְיִפֹּל
  choice: वह दीवार गिर जाएगी
  rationale: क्रिया का निहित कर्ता पिछले प्रसंग की दीवार है। हिन्दी में अस्पष्ट सर्वनाम के बजाय ‘वह दीवार’ कहना संदर्भ को स्वाभाविक रूप से स्पष्ट करता है।
- source_word: גֶּשֶׁם שׁוֹטֵף
  choice: मूसलाधार वर्षा
  rationale: שׁוֹטֵף बहते, उमड़ते और विनाशकारी वेग का बोध देता है। ‘मूसलाधार वर्षा’ आधुनिक हिन्दी में तीव्र, लगातार बरसने वाली वर्षा के लिए सहज अभिव्यक्ति है।
- source_word: וְאַתֵּנָה אַבְנֵי אֶלְגָּבִישׁ תִּפֹּלְנָה
  choice: और हे ओलो, तुम गिरोगे
  rationale: स्वतंत्र स्त्रीलिंग बहुवचन सर्वनाम אַתֵּנָה ओलों को सीधे संबोधित करता है। इस सजीव काव्यात्मक संबोधन को सामान्य कथन ‘ओले गिरेंगे’ बनाकर सपाट नहीं किया गया।
- source_word: וְרוּחַ סְעָרוֹת
  choice: और आँधी
  rationale: यह पद प्रचंड तूफानी हवा को दर्शाता है। ‘आँधी’ संक्षिप्त, वर्तमान और स्वाभाविक हिन्दी है।
- source_word: תְּבַקֵּעַ
  choice: उसे चीर डालेगी
  rationale: पिएल रूप में בקע का अर्थ फाड़ना या चीर देना है। ‘चीर डालेगी’ दीवार के बलपूर्वक टूट जाने का प्रबल भाव बनाए रखता है।
