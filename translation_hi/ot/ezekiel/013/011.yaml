translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और श्रवण में सहज रखी गई है। एकवचन आज्ञा ‘कह’ यहेजकेल से प्रत्यक्ष संबोधन को बनाए रखती है। ‘कच्चा गारा’ कमजोर और भ्रामक पलस्तर के प्रसंगानुकूल अर्थ को व्यक्त करता है; ‘हे ओलो’ असामान्य किंतु जानबूझकर रखा गया काव्यात्मक संबोधन है।
