base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/013/002.yaml
  text: Son of man[a], prophesy against the prophets of Israel who are prophesying, and say to those who prophesy from their own hearts, ‘Hear the word of Yahweh.’
translation:
  language: hi
  text: “हे मनुष्य-पुत्र, इस्राएल के उन नबियों के विरुद्ध भविष्यवाणी कर जो भविष्यवाणी कर रहे हैं, और अपने ही मन से[a] भविष्यवाणी करनेवाले नबियों से कह, ‘याहवे का वचन सुनो।’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक शब्दशः: “अपने मन के नबियों से।” इब्रानी मुहावरे का अर्थ है कि वे याहवे से प्राप्त संदेश नहीं, बल्कि अपनी ओर से बोलते हैं।'
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן אָדָם
  choice: हे मनुष्य के पुत्र
  rationale: यहेजकेल के लिए प्रयुक्त इस नियमित संबोधन की इब्रानी उपमा और पुस्तक भर की साहित्यिक निरंतरता को बनाए रखता है।
- source_word: הִנָּבֵא אֶל
  choice: के विरुद्ध भविष्यवाणी कर
  rationale: निंदा और न्याय के इस प्रसंग में אֶל का लक्ष्य-विरोधी भाव है; ‘विरुद्ध’ हिन्दी में आशय स्पष्ट करता है।
- source_word: נְבִיאֵי יִשְׂרָאֵל הַנִּבָּאִים
  choice: इस्राएल के उन नबियों ... जो भविष्यवाणी कर रहे हैं
  rationale: सहभागी रूप की जारी गतिविधि को दर्शाता है और नबी/भविष्यवाणी की मूल शब्द-पुनरावृत्ति बनाए रखता है।
- source_word: לִנְבִיאֵי מִלִּבָּם
  choice: जो अपने ही मन से भविष्यवाणी करते हैं
  rationale: इब्रानी ‘अपने हृदय/मन से’ का अर्थ है कि संदेश याहवे से नहीं, उन्हीं के भीतर से उपजता है। आधुनिक हिन्दी में ‘मन’ विचार, कल्पना और आंतरिक स्रोत को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: שִׁמְעוּ דְּבַר יְהוָה
  choice: याहवे का वचन सुनो
  rationale: बहुवचन आज्ञार्थक का सीधा रूप है; ‘वचन’ मानक भविष्यसूचक सूत्र की निरंतरता रखता है और יְהוָה को व्यक्तिगत नाम ‘याहवे’ के रूप में प्रस्तुत करता है।
theological_decisions:
- issue: न्याय के प्रसंग में אֶל का बल
  choice: ‘के विरुद्ध’
  alternative: ‘से’ अथवा ‘की ओर’
  rationale: आगे आने वाला संदेश झूठे नबियों की निंदा है; ‘विरुद्ध’ प्रसंगगत विरोधी बल को बिना नया आरोप जोड़े व्यक्त करता है।
- issue: झूठे नबियों के संदेश का स्रोत
  choice: ‘अपने ही मन से भविष्यवाणी करते हैं’
  alternative: 'अधिक शब्दशः: ‘अपने मन के नबी’'
  rationale: यह स्पष्ट करता है कि कथन स्वयं उनकी अंतरात्मा/सोच से उत्पन्न हैं, याहवे से नहीं; साथ ही ‘मन’ का मूल रूपक सुरक्षित रहता है।
- issue: יְהוָה का प्रतिपादन
  choice: ‘याहवे’
  alternative: ‘यहोवा’ अथवा ‘प्रभु’
  rationale: इब्रानी पाठ में आए परमेश्वर के व्यक्तिगत नाम को लिप्यंतरित करके नाम और उपाधि के बीच का भेद बनाए रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और मौखिक पाठ के अनुकूल रखी गई है। एकवचन आदेश ‘कर/कह’ यहेजकेल को संबोधित है, जबकि उद्धरण में बहुवचन ‘सुनो’ नबियों को संबोधित करता है।
