source:
  edition: WLC
  text: לָ/כֵ֗ן כֹּ֤ה אָמַר֙ אֲדֹנָ֣/י יְהוִ֔ה וּ/בִקַּעְתִּ֥י רֽוּחַ סְעָר֖וֹת בַּֽ/חֲמָתִ֑/י וְ/גֶ֤שֶׁם שֹׁטֵף֙ בְּ/אַפִּ֣/י יִֽהְיֶ֔ה וְ/אַבְנֵ֥י אֶלְגָּבִ֖ישׁ בְּ/חֵמָ֥ה לְ/כָלָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/013/013.yaml
  text: 'Therefore thus says the Lord GOD: I will unleash a storm wind in my wrath[a], and there will be a flooding rain in my anger, and hailstones in fury to bring complete destruction.'
translation:
  language: hi
  text: 'इसलिए प्रभु याहवे यों कहता है: मैं अपने प्रकोप में प्रचंड आँधी चला दूँगा[a]; मेरे क्रोध में मूसलाधार वर्षा होगी, और अपने प्रचंड रोष में पूरी तरह नष्ट करने के लिए ओले बरसाऊँगा।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “मैं आँधियों की हवा को फाड़कर खोलूँगा”; आशय है कि परमेश्वर प्रचंड आँधी को फूट पड़ने दूँगा।
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  choice: प्रभु याहवे
  rationale: אֲדֹנָי को ‘प्रभु’ और परमेश्वर के व्यक्तिगत नाम יהוה को ‘याहवे’ रखा गया है, जिससे संयुक्त उपाधि और नाम दोनों स्पष्ट रहते हैं।
- source_word: וּבִקַּעְתִּי רוּחַ סְעָרוֹת
  choice: मैं ... प्रचंड आँधी चला दूँगा
  rationale: בקע का मूल अर्थ चीरना या फाड़कर खोलना है, पर आँधी के साथ इसका आशय उसे प्रबलता से फूट पड़ने देना है। स्वाभाविक हिन्दी में ‘चला दूँगा’ परमेश्वर की प्रत्यक्ष क्रिया को बनाए रखता है; शाब्दिक चित्र पादटिप्पणी में दिया गया है।
- source_word: בַּחֲמָתִי
  choice: अपनी जलजलाहट में
  rationale: חֵמָה उग्र, दहकते क्रोध को व्यक्त करता है। ‘जलजलाहट’ भविष्यद्वाणी के न्याय-संबंधी गंभीर भाव को व्यक्त करती है।
- source_word: גֶּשֶׁם שֹׁטֵף
  choice: मूसलाधार वर्षा
  rationale: शब्द-समूह का अर्थ बहा ले जाने वाली अथवा बाढ़ लाने वाली प्रबल वर्षा है। ‘मूसलाधार वर्षा’ आधुनिक हिन्दी में स्वाभाविक और सजीव है।
- source_word: בְּאַפִּי
  choice: मेरे क्रोध में
  rationale: אַף का शाब्दिक अर्थ नाक है, पर यहाँ इसका प्रचलित भावार्थ ‘क्रोध’ स्पष्ट रूप से अभिप्रेत है।
- source_word: אַבְנֵי אֶלְגָּבִישׁ
  choice: ओले
  rationale: यह इब्रानी पद ओलों या ओला-पत्थरों को दर्शाता है; हिन्दी में ‘ओले’ सबसे स्वाभाविक रूप है।
- source_word: בְּחֵמָה
  choice: मेरे प्रचंड रोष में
  rationale: חֵמָה की पुनरावृत्ति उग्र दैवी न्याय पर बल देती है। ‘प्रचंड रोष’ उस तीव्रता को बनाए रखते हुए हिन्दी में अनावश्यक शब्द-पुनरावृत्ति से बचाता है।
- source_word: לְכָלָה
  choice: पूरी तरह नष्ट करने के लिए
  rationale: כָּלָה यहाँ अंत तक पहुँचाने या संपूर्ण विनाश का भाव देता है; לְ उद्देश्य को सूचित करता है। यह अनुवाद उस उद्देश्य और पूर्णता दोनों को स्पष्ट करता है।
theological_decisions:
- issue: संयुक्त पद אֲדֹנָי יְהוִה में परमेश्वर के नाम का अनुवाद
  choice: प्रभु याहवे
  alternative: प्रभु परमेश्वर
  rationale: मूल पाठ में יהוה व्यक्तिगत वाचा-नाम है। ‘याहवे’ उस नाम को सामान्य उपाधि में बदलने के बजाय स्पष्ट रखता है, जबकि אֲדֹנָי का अर्थ ‘प्रभु’ दिया गया है।
- issue: लְכָלָה में न्याय की संपूर्णता
  choice: पूरी तरह नष्ट करने के लिए
  alternative: अंत कर देने के लिए
  rationale: मूल पद पूर्ण अंत या संपूर्ण विनाश का कठोर भाव रखता है। अनुवाद उस तीव्रता को बनाए रखता है, पर यह निर्धारित नहीं करता कि विनाश का दायरा दीवार, झूठे भविष्यद्वक्ताओं या व्यापक समुदाय में से किस तक है; उसका निर्धारण प्रसंग पर छोड़ा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘यों कहता है’ भविष्यद्वाणी की घोषणात्मक शैली बनाए रखता है। ‘जलजलाहट’, ‘क्रोध’ और ‘प्रचंड रोष’ मूल में प्रयुक्त निकटार्थी क्रोध-सूचक शब्दों की तीव्रता और अलंकारिक विविधता को व्यक्त करते हैं।
