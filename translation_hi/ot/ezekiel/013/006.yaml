  text: חָ֤זוּ שָׁוְא֙ וְ/קֶ֣סֶם כָּזָ֔ב הָ/אֹֽמְרִים֙ נְאֻם יְהוָ֔ה וַֽ/יהוָ֖ה לֹ֣א שְׁלָחָ֑/ם וְ/יִֽחֲל֖וּ לְ/קַיֵּ֥ם דָּבָֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/013/006.yaml
  text: They have seen falsehood and lying divination[a], those who say, ‘Declaration of Yahweh,’ though Yahweh has not sent them[b]; yet they hope for the fulfillment of the word.
translation:
  language: hi
  text: उन्होंने मिथ्या दर्शन और झूठे शकुन देखे हैं। वे कहते हैं, ‘याहवे की घोषणा है,’[a] जबकि याहवे ने उन्हें भेजा ही नहीं; फिर भी वे वचन के पूरा होने की आशा रखते हैं।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “याहवे की वाणी है” अथवा “याहवे का कथन है।”
    reason: lexical_alternative
  - marker: b
    text: या “वे वचन के सिद्ध होने की प्रतीक्षा करते हैं” अथवा “वे अपेक्षा करते हैं कि वचन प्रमाणित होगा।”
    reason: lexical_alternative
lexical_decisions:
- source_word: חָזוּ שָׁוְא
  choice: मिथ्या दर्शन देखे हैं
  rationale: חזה भविष्यदर्शी ढंग से देखने का क्रियापद है और שָׁוְא यहाँ असत्य या खोखलेपन को दर्शाता है। ‘मिथ्या दर्शन’ भविष्यसूचक संदर्भ और उसके झूठे स्वरूप दोनों को बनाए रखता है।
- source_word: קֶסֶם כָּזָב
  choice: झूठी शकुन-वाणी
  rationale: קֶסֶם दैवी संकेत जानने या शकुन-विचार से निकली वाणी को और כָּזָב उसके झूठे स्वरूप को बताता है। ‘शकुन-वाणी’ इसे सामान्य भविष्यवाणी में विलीन किए बिना आधुनिक पाठक के लिए समझने योग्य बनाती है।
- source_word: הָאֹמְרִים
  choice: वे कहते हैं
  rationale: संज्ञार्थक कृदंत इन झूठे भविष्यद्वक्ताओं की निरंतर विशेषता बताता है। हिन्दी में स्वतंत्र वाक्य के रूप में ‘वे कहते हैं’ अधिक स्वाभाविक है।
- source_word: נְאֻם יְהוָה
  choice: याहवे की वाणी है
  rationale: यह भविष्यसूचक घोषणा का स्थिर सूत्र है। ‘वाणी’ उसकी गंभीरता और परमेश्वर से आने का दावा बनाए रखती है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को उपाधि से बदलने के बजाय लिप्यंतरित किया गया है।
- source_word: לֹא שְׁלָחָם
  choice: उन्हें भेजा ही नहीं
  rationale: नकारात्मक पूर्ण क्रिया और कर्म-प्रत्यय का सीधा अर्थ रखा गया है; ‘ही’ उनके झूठे दैवी अधिकार-दावे से विरोध को स्वाभाविक हिन्दी में उभारता है।
- source_word: וְיִחֲלוּ
  choice: फिर भी … आशा करते हैं
  rationale: יחל में प्रतीक्षा और आशा दोनों का भाव संभव है। प्रसंग में उनका अपनी बात के सिद्ध होने की अपेक्षा करना प्रमुख है; ‘फिर भी’ साधारण वाव के प्रसंगगत विरोध को व्यक्त करता है।
- source_word: לְקַיֵּם דָּבָר
  choice: उस वचन के पूरा होने
  rationale: यह पद किसी बात या वचन को स्थिर, प्रमाणित अथवा पूरा होने देने का भाव रखता है। मुख्य पाठ में ‘पूरा होने’ को चुना गया है और ‘सिद्ध होने’ का विकल्प पादटिप्पणी में सुरक्षित है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा
  rationale: मूल पाठ व्यक्तिगत वाचा-नाम का उपयोग करता है; इसलिए उसे ‘प्रभु’ जैसी उपाधि से प्रतिस्थापित नहीं किया गया।
- issue: झूठे भविष्यद्वक्ताओं द्वारा נְאֻם יְהוָה सूत्र का प्रयोग
  choice: ‘याहवे की वाणी है’
  alternative: ‘याहवे की घोषणा है’
  rationale: दावे को सूत्रात्मक रूप में रखा गया है ताकि यह तनाव स्पष्ट रहे कि वे याहवे के नाम से बोलते हैं, यद्यपि उसने उन्हें भेजा नहीं।
- issue: अंतिम पद में आशा, प्रतीक्षा और पुष्टि की अर्थ-सीमा
  choice: वचन के पूरा होने की आशा
  alternative: वचन के सिद्ध होने की प्रतीक्षा
  rationale: मूल में अपेक्षा/प्रतीक्षा और वचन के स्थिर या प्रमाणित होने दोनों की गुंजाइश है। मुख्य पाठ स्वाभाविक हिन्दी देता है और विकल्प पादटिप्पणी में सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सहज रजिस्टर अपनाया गया है। ‘मिथ्या दर्शन,’ ‘शकुन-वाणी’ और ‘वचन’ भविष्यसूचक संदर्भ की गंभीरता रखते हैं, जबकि वाक्य-विन्यास सामान्य पाठक के लिए सीधा है।
