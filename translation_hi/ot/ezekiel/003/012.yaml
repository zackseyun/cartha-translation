source:
  edition: WLC
  text: וַ/תִּשָּׂאֵ֣/נִי ר֔וּחַ וָ/אֶשְׁמַ֣ע אַחֲרַ֔/י ק֖וֹל רַ֣עַשׁ גָּד֑וֹל בָּר֥וּךְ כְּבוֹד יְהוָ֖ה מִ/מְּקוֹמֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/003/012.yaml
  text: 'Then the Spirit lifted me up, and I heard behind me a sound of a great rumbling: “Blessed be the glory of the LORD from his place.”'
translation:
  language: hi
  text: 'तब आत्मा ने मुझे उठा लिया, और मैंने अपने पीछे एक बड़ी गड़गड़ाहट की आवाज़ सुनी: “यहोवा की महिमा उसके स्थान से धन्य हो!”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या: “यहोवा की महिमा उसके स्थान से धन्य है।” हिब्रू बָּרוּךְ को आशीर्वचन अथवा वर्णनात्मक कथन—दोनों रूपों में समझा जा सकता है।'
    reason: बָּרוּךְ के वास्तविक व्याकरणिक अनुवाद-विकल्प को दर्ज करता है, जबकि מִמְּקוֹמוֹ के तीसरे-पुरुष प्रत्यय को अनावश्यक रूप से विवादित नहीं बताता।
lexical_decisions:
- source_word: רוּחַ
  choice: आत्मा
  rationale: संदर्भ में यह शक्ति यहेजकेल को उठा लेती है; ‘आत्मा’ मूल शब्द के व्यक्तिपरक और अलौकिक आशय को बनाए रखता है, यद्यपि हिब्रू शब्द का अर्थ ‘वायु’ भी हो सकता है।
- source_word: קוֹל רַעַשׁ גָּדוֹל
  choice: एक बड़ी गड़गड़ाहट की आवाज़
  rationale: קוֹל को ‘आवाज़’ और רַעַשׁ को तीव्र गूँजते या हिलानेवाले शब्द के रूप में व्यक्त किया गया है; यह वाक्यांश मूल की श्रव्य तीव्रता बनाए रखता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: मूल पाठ में परमेश्वर का विशिष्ट वाचा-नाम है; उसका नाम सामान्य उपाधि में बदलने के बजाय हिन्दी में प्रचलित रूप ‘यहोवा’ रखा गया है।
- source_word: מִמְּקוֹמוֹ
  choice: अपने स्थान से
  rationale: מִן का सामान्य अर्थ ‘से’ है और प्रत्यय ‘उसका/अपना’ दर्शाता है; हिन्दी में कर्ता की ओर लौटते संबंध को स्वाभाविक बनाने के लिए ‘अपने’ चुना गया है।
theological_decisions:
- issue: क्या רוּחַ को स्पष्ट रूप से परमेश्वर का पवित्र आत्मा कहा जाए
  choice: केवल ‘आत्मा’
  alternative: ‘परमेश्वर का आत्मा’ या ‘पवित्र आत्मा’
  rationale: हिब्रू पाठ यहाँ केवल רוּחַ कहता है। संदर्भ दिव्य सक्रियता का संकेत देता है, पर अधिक स्पष्ट पदवी जोड़ना मूल की अंतर्निहित अस्पष्टता को मिटा देगा।
- issue: महिमा के विषय में कथन का व्याकरणिक बल
  choice: 'आशीर्वचन/उद्घोष: ‘धन्य हो!’'
  alternative: 'वर्णनात्मक कथन: ‘धन्य है’'
  rationale: בָּרוּךְ का रूप दोनों प्रकार से समझा जा सकता है; इस दर्शन के स्तुतिपरक संदर्भ में उद्घोष स्वाभाविक है, पर मूल की संक्षिप्तता और तनाव बनाए रखने के लिए अतिरिक्त व्याख्या नहीं जोड़ी गई।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और मौखिक पाठ के लिए सहज रखी गई है। ‘गड़गड़ाहट’ दर्शन की प्रचंड ध्वनि को सामान्य पाठक के लिए स्पष्ट करती है; वाक्य में अनावश्यक धार्मिक पारिभाषिक शब्द नहीं जोड़े गए।
