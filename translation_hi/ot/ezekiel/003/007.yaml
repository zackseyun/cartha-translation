source:
  edition: WLC
  text: וּ/בֵ֣ית יִשְׂרָאֵ֗ל לֹ֤א יֹאבוּ֙ לִ/שְׁמֹ֣עַ אֵלֶ֔י/ךָ כִּֽי אֵינָ֥/ם אֹבִ֖ים לִ/שְׁמֹ֣עַ אֵלָ֑/י כִּ֚י כָּל בֵּ֣ית יִשְׂרָאֵ֔ל חִזְקֵי מֵ֥צַח וּ/קְשֵׁי לֵ֖ב הֵֽמָּה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/003/007.yaml
  text: But the house of Israel will not be willing to listen to you[a], because they are not willing to listen to me[b]; for all the house of Israel are hard of forehead and stubborn of heart.
translation:
  language: hi
  text: लेकिन इस्राएल का घराना तुम्हारी बात सुनने को तैयार नहीं होगा, क्योंकि वे मेरी बात सुनने को तैयार नहीं हैं; क्योंकि इस्राएल का सारा घराना कठोर माथे वाला[a] और हठी मन वाला[b] है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “कठोर माथे वाला”; यह इब्रानी मुहावरा निर्लज्ज हठ या उद्दंडता का चित्र खींचता है। इसे “ढीठ” भी कहा जा सकता है।
    reason: lexical_alternative
  - marker: b
    text: इसे “कठोर हृदय वाला” भी कहा जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבֵית יִשְׂרָאֵל
  choice: लेकिन इस्राएल का घराना
  rationale: ו को पिछले संदर्भ के विपरीत भाव के कारण ‘लेकिन’ किया गया है। ‘इस्राएल का घराना’ मूल की सामूहिक और वाचागत अभिव्यक्ति को बनाए रखता है।
- source_word: לֹא יֹאבוּ / אֵינָם אֹבִים
  choice: सुनने को तैयार नहीं होगा / सुनने को तैयार नहीं हैं
  rationale: אָבָה में इच्छा या सहमति का भाव है। ‘तैयार नहीं’ इस स्वैच्छिक अनिच्छा को ‘नहीं सुनेगा’ की अपेक्षा अधिक स्पष्ट रूप से व्यक्त करता है और दोनों क्रियारूपों का कालगत अंतर भी बनाए रखता है।
- source_word: לִשְׁמֹעַ אֵלֶיךָ / לִשְׁמֹעַ אֵלָי
  choice: तुम्हारी सुनने / मेरी सुनने
  rationale: שׁמע אֶל का अर्थ यहाँ ध्यान देकर सुनना है। ‘तुम्हारी/मेरी सुनना’ स्वाभाविक हिन्दी है और सुनने तथा आज्ञापालन के बीच मूल में उपस्थित अर्थगत विस्तार को अनावश्यक रूप से सीमित नहीं करता।
- source_word: כִּי
  choice: क्योंकि
  rationale: दोनों स्थानों पर कारण अथवा आधार बताया गया है; ‘क्योंकि’ इस संबंध को आधुनिक हिन्दी में स्पष्ट रखता है।
- source_word: כָּל בֵּית יִשְׂרָאֵל
  choice: इस्राएल का सारा घराना
  rationale: כָּל की व्यापकता और בֵּית יִשְׂרָאֵל की सामूहिक अभिव्यक्ति दोनों सुरक्षित रखी गई हैं।
- source_word: חִזְקֵי מֵצַח
  choice: कठोर माथे वाला
  rationale: मूल का सजीव शारीरिक रूपक सुरक्षित रखा गया है। यह मुहावरा निर्लज्ज हठ और उद्दंडता का चित्र प्रस्तुत करता है।
- source_word: וּקְשֵׁי לֵב
  choice: हठीले मन वाला
  rationale: לֵב को प्रसंगानुसार इच्छा और आंतरिक वृत्ति के केंद्र के रूप में ‘मन’ कहा गया है; ‘हठीला’ קְשֵׁי के प्रतिरोधी भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: הֵמָּה
  choice: है
  rationale: सामूहिक संज्ञा ‘घराना’ के साथ हिन्दी में एकवचन क्रिया स्वाभाविक है। मूल का जोर गुणसूचक पदों के क्रम और व्यापक कथन में बना रहता है।
theological_decisions:
- issue: इस्राएल का सामूहिक चरित्रांकन
  choice: ‘इस्राएल का सारा घराना’ कहकर मूल के व्यापक सामूहिक कथन को बनाए रखा गया है।
  alternative: ‘इस्राएल के बहुत-से लोग’ या ‘इस्राएल के अगुवे’
  rationale: इब्रानी पाठ पूरे घराने को संबोधित करता है। किसी अनुल्लिखित उपसमूह तक कथन को सीमित करना मूल की तीव्रता और उसमें उपस्थित धर्मवैचारिक तनाव को घटा देता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘घराना’ सामूहिक बाइबलीय अभिव्यक्ति को सुरक्षित रखता है, जबकि ‘कठोर माथे वाला’ मूल इब्रानी के असामान्य किंतु प्रभावशाली रूपक को जानबूझकर बनाए रखता है।
