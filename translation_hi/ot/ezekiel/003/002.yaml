  rationale: The revision restores the proximal force of ‘this’ and replaces the non-idiomatic compound with ‘स्क्रॉल.’ ‘खिलाया’ retains the Hebrew causative sense without adding interpretation.
  reviewer_model: gpt-5.6-terra
