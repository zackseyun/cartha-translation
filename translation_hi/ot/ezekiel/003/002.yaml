  text: So I opened my mouth[a], and he fed me this scroll.
translation:
  language: hi
  text: तब मैंने अपना मुँह खोला, और उसने मुझे यह स्क्रॉल खिलाया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וָאֶפְתַּח
  choice: तब मैंने खोला
  rationale: פתח का क़ाल क्रमवाची रूप कथा में अगली क्रिया बताता है; ‘तब’ आधुनिक हिन्दी में इस क्रम को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: אֶת־פִּי
  choice: अपना मुँह
  rationale: प्रत्यक्ष कर्म-सूचक אֶת के साथ ‘मेरा मुँह’ हिन्दी में स्वाभाविक रूप से ‘अपना मुँह’ होता है, क्योंकि कर्ता वही है।
- source_word: וַיַּאֲכִלֵנִי
  choice: और उसने मुझे ... खिला दी
  rationale: אכל का हिफ़ईल रूप प्रथम पुरुष एकवचन कर्म-प्रत्यय के साथ ‘उसने मुझे खाने दिया/खिलाया’ का कारक अर्थ रखता है। ‘खिला दी’ इस कारकता को सहज हिन्दी में सुरक्षित रखता है।
- source_word: אֵת־הַמְּגִלָּה הַזֹּאת
  choice: वह पुस्तक-लपेट
  rationale: מְגִלָּה प्राचीन लिखित स्क्रॉल को दर्शाता है। ‘पुस्तक-लपेट’ सामान्य पाठक को वस्तु के लपेटे हुए लिखित रूप का संकेत देता है; הַזֹּאת का अर्थ निकट संकेतवाचक ‘यह/इस’ है, पर पूर्ववर्ती संदर्भ में हिन्दी वाक्य-प्रवाह हेतु ‘वह’ चुना गया है।
