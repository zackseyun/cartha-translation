source:
  edition: WLC
  text: וְ/אַתָּ֣ה בֶן אָדָ֗ם הִנֵּ֨ה נָתְנ֤וּ עָלֶ֨י/ךָ֙ עֲבוֹתִ֔ים וַ/אֲסָר֖וּ/ךָ בָּ/הֶ֑ם וְ/לֹ֥א תֵצֵ֖א בְּ/תוֹכָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/003/025.yaml
  text: But you[a], son of man, behold, they will put ropes on you and bind you with them[b], so that you will not go out among them.
translation:
  language: hi
  text: परन्तु हे मनुष्य के पुत्र, देख, वे तुझ पर रस्सियाँ[a] डालेंगे और उनसे तुझे बाँधेंगे, जिससे तू उनके बीच जाने के लिए बाहर नहीं निकल सकेगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “डोरियाँ” अथवा “बंधन।”
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶן אָדָם
  choice: मनुष्य के पुत्र
  rationale: यहेजकेल के लिए बार-बार प्रयुक्त इस संबोधन के हिब्रू मुहावरे और पुस्तक में उसकी साहित्यिक एकरूपता को बनाए रखता है।
- source_word: הִנֵּה
  choice: देख
  rationale: यह ध्यान आकर्षित करने वाला भविष्यद्वाणी-सूचक शब्द है; आधुनिक हिन्दी में ‘देख’ स्वाभाविक रहते हुए उसका बल बनाए रखता है।
- source_word: נָתְנוּ
  choice: वे डालेंगे
  rationale: रूप की दृष्टि से यह पूर्ण क्रिया है, पर भविष्यद्वाणी के प्रसंग में भावी घटना बताती है। अनिर्दिष्ट बहुवचन कर्ता को ‘वे’ ही रहने दिया गया है।
- source_word: עֲבוֹתִים
  choice: रस्सियाँ
  rationale: यह बाँधने के साधनों को सूचित करता है। ‘रस्सियाँ’ स्पष्ट और सामान्य आधुनिक हिन्दी है।
- source_word: וַאֲסָרוּךָ
  choice: तुझे बाँधेंगे
  rationale: अर्थ को सीधे व्यक्त करता है और ‘कैद करेंगे’ जैसा अधिक व्याख्यात्मक अर्थ नहीं जोड़ता।
- source_word: בָּהֶם
  choice: उनसे
  rationale: 'यहाँ संबंध साधनवाचक है: उन्हीं रस्सियों से बाँधा जाएगा।'
- source_word: וְלֹא תֵצֵא בְּתוֹכָם
  choice: ताकि तू बाहर निकलकर उनके बीच न जा सके
  rationale: बाँधने के परिणाम अथवा प्रयोजन को स्वाभाविक हिन्दी में व्यक्त करता है और गति की दिशा लोगों के बीच जाने की ओर रखता है।
theological_decisions:
- issue: अनिर्दिष्ट बहुवचन कर्ता की पहचान
  choice: ‘वे’ कहकर कर्ता को अनिर्दिष्ट रखा गया है।
  alternative: उन्हें परमेश्वर के दूत, लोग, अथवा निर्वैयक्तिक कर्ता मानना।
  rationale: हिब्रू पाठ बाँधने वालों की पहचान स्पष्ट नहीं करता; अनुवाद इस अस्पष्टता को किसी विशेष मानवीय या ईश्वरीय कर्तृत्व के पक्ष में हल नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘तू/तुझे’ भविष्यद्वाणी-संबंधी प्रत्यक्ष संबोधन की निकटता और एकवचन को बनाए रखते हैं; ‘देख’ प्राचीनता का अनावश्यक भार डाले बिना ध्यानसूचक बल देता है।
