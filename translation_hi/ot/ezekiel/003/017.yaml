  text: בֶּן אָדָ֕ם צֹפֶ֥ה נְתַתִּ֖י/ךָ לְ/בֵ֣ית יִשְׂרָאֵ֑ל וְ/שָׁמַעְתָּ֤ מִ/פִּ/י֙ דָּבָ֔ר וְ/הִזְהַרְתָּ֥ אוֹתָ֖/ם מִמֶּֽ/נִּי־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/003/017.yaml
  text: Son of man[a], I have made you a watchman for the house of Israel[b]; and you shall hear a word from my mouth and warn them from me.
translation:
  language: hi
  text: “हे मनुष्य के पुत्र[a], मैंने तुझे इस्राएल के घराने के लिए पहरेदार ठहराया है। तू मेरे मुँह से वचन सुनेगा और मेरी ओर से उन्हें चेतावनी देगा।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “हे नश्वर मनुष्य” अथवा “हे मानव।” इब्रानी मुहावरा यहेजकेल के लिए बार-बार प्रयुक्त संबोधन है।
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן אָדָם
  choice: हे मनुष्य के पुत्र
  rationale: इब्रानी संबोधन का सीधा और गरिमापूर्ण रूप; यह यहेजकेल के लिए बार-बार प्रयुक्त विशिष्ट संबोधन को बनाए रखता है।
- source_word: צֹפֶה
  choice: पहरेदार
  rationale: ऐसे व्यक्ति का बोध कराता है जो निगरानी रखता और संकट की चेतावनी देता है; निकटवर्ती प्रसंग में दोनों पक्ष महत्त्वपूर्ण हैं।
- source_word: נְתַתִּיךָ
  choice: मैंने तुझे ... ठहराया है
  rationale: शाब्दिक अर्थ ‘मैंने तुझे दिया है’ है, पर विधेय संज्ञा के साथ यहाँ नियुक्ति/स्थापन का परिणामसूचक भाव है।
- source_word: לְבֵית יִשְׂרָאֵל
  choice: इस्राएल के घराने के लिए
  rationale: 'לְ को दायित्व-संबंधी अर्थ में लिया गया है: यहेजकेल की पहरेदारी इस्राएल के घराने के संबंध में और उसके लिए है।'
- source_word: וְשָׁמַעְתָּ
  choice: तू ... सुनेगा
  rationale: संयोजक वाव और पूर्ण क्रिया के अनुक्रम को सीधे समन्वयी/भावी रूप में रखा गया है, बिना अनिवार्य रूप से ‘जब’ का कालवाचक अर्थ जोड़ने के।
- source_word: מִפִּי דָּבָר
  choice: मेरे मुँह से वचन
  rationale: मूल के ठोस दैवी-वाणी वाले बिंब और דָּבָר के व्यापक ‘वचन’ अर्थ को सुरक्षित रखता है।
- source_word: וְהִזְהַרְתָּ אוֹתָם
  choice: उन्हें चेतावनी देगा
  rationale: हिफ़ील क्रिया का चेताने/सावधान करने वाला अर्थ और इस्राएल के घराने की ओर संकेत करने वाला बहुवचन सर्वनाम सुरक्षित है।
- source_word: מִמֶּנִּי
  choice: मेरी ओर से
  rationale: चेतावनी का स्रोत और अधिकार परमेश्वर है; स्वाभाविक हिन्दी में यह सीधा भाव व्यक्त होता है।
theological_decisions:
- issue: आज्ञा के अनुक्रम में कालवाचक या समन्वयी अर्थ
  choice: तू मेरे मुँह से वचन सुनेगा और ... चेतावनी देगा
  alternative: जब तू मेरे मुँह से वचन सुने, तब ... चेतावनी देना
  rationale: इब्रानी में दोनों क्रियाएँ वाव से जुड़ी हैं। समन्वयी रूप मूल की संरचना और उसकी वास्तविक अस्पष्टता को बनाए रखता है; कालवाचक विकल्प प्रसंग में संभव है, पर पाठ में अनिवार्य नहीं।
- issue: בֶּן אָדָם संबोधन का रूप
  choice: हे मनुष्य के पुत्र
  alternative: हे नश्वर मनुष्य / हे मानव
  rationale: परंपरागत किन्तु बोधगम्य संबोधन इब्रानी मुहावरे और यहेजकेल में उसकी पुनरावृत्ति को बनाए रखता है, जबकि विकल्प उसके नश्वरता-संबंधी आशय को अधिक स्पष्ट कर सकते हैं।
- issue: מִמֶּנִּי में चेतावनी का स्रोत
  choice: मेरी ओर से
  alternative: मुझसे / मेरी दी हुई चेतावनी के अनुसार
  rationale: यह रूप नबी को परमेश्वर की चेतावनी का वाहक दिखाता है, पर कोई अतिरिक्त सैद्धांतिक व्याख्या नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण भविष्यवाणी-संबंधी शैली रखी गई है। दैवी संबोधन में एकवचन ‘तू/तुझे’ मूल के निकट और हिन्दी बाइबलीय शैली में स्वाभाविक है। ‘घराना,’ ‘पहरेदार’ और ‘वचन’ सामान्य पाठक के लिए बोधगम्य रहते हुए मूल के प्रमुख बिंबों को सुरक्षित रखते हैं।
