source:
  edition: WLC
  text: וַ/יֹּ֖אמֶר אֵלָ֑/י בֶּן אָדָ֕ם אֶת כָּל דְּבָרַ/י֙ אֲשֶׁ֣ר אֲדַבֵּ֣ר אֵלֶ֔י/ךָ קַ֥ח בִּֽ/לְבָבְ/ךָ֖ וּ/בְ/אָזְנֶ֥י/ךָ שְׁמָֽע־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/003/010.yaml
  text: Then he said to me[a], “Son of man, receive in your heart all my words that I speak to you, and hear with your ears.”
translation:
  language: hi
  text: फिर उसने मुझसे कहा, “हे मनुष्य-पुत्र, मेरे वे सब वचन जो मैं तुझसे कहूँ, अपने हृदय में ग्रहण कर[a] और अपने कानों से सुन।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अपने हृदय में ले”; हिब्रू क्रिया का शाब्दिक अर्थ “ले” है और यहाँ वह परमेश्वर के वचनों को भीतर स्वीकार करने का भाव देती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן אָדָם
  choice: हे मनुष्य के पुत्र
  rationale: यहेजकेल में यह संबोधन बार-बार आता है। यह हिब्रू अभिव्यक्ति के रूप और उसके प्रतिनिधि पुल्लिंग को बनाए रखता है, जबकि ‘नश्वर मनुष्य’ जैसे अर्थपरक विकल्प से बचता है।
- source_word: אֶת כָּל דְּבָרַי
  choice: मेरे वे सब वचन
  rationale: ‘वचन’ दैवी कथनों के ठोस मौखिक स्वरूप को बनाए रखता है; ‘वे’ आगे आने वाले संबंधवाचक उपवाक्य से इसे स्वाभाविक रूप से जोड़ता है।
- source_word: אֲדַבֵּר אֵלֶיךָ
  choice: जो मैं तुझसे कहूँगा
  rationale: अपूर्ण क्रिया यहाँ आगामी और जारी रहने वाले दैवी वचनों की ओर संकेत कर सकती है। प्रसंग में हिंदी का भविष्यकाल स्वाभाविक है और स्रोत की भावी संभावना को सुरक्षित रखता है।
- source_word: קַח בִּלְבָבְךָ
  choice: अपने हृदय में ग्रहण कर
  rationale: קַח का शाब्दिक अर्थ ‘ले’ है, पर हृदय के साथ यह भीतर स्वीकार करने का भाव देता है। ‘ग्रहण कर’ हिंदी में इस आंतरिक स्वीकार को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: וּבְאָזְנֶיךָ שְׁמָע
  choice: और अपने कानों से सुन
  rationale: यह अनुवाद हिब्रू की शारीरिक और बलात्मक अभिव्यक्ति को बनाए रखता है; इसे केवल ‘ध्यान से सुन’ कहकर कानों के स्पष्ट उल्लेख को हटाया नहीं गया।
theological_decisions:
- issue: בֶּן אָדָם में אָדָם का अनुवाद
  choice: मनुष्य के पुत्र
  alternative: नश्वर मनुष्य / मानव-पुत्र
  rationale: यह चुनाव यहेजकेल के विशिष्ट और आवर्ती संबोधन को स्रोत के निकट रखता है। इससे न तो मानवीय नश्वरता की व्याख्या को मूल पाठ में जोड़ा जाता है, न बाद की मसीही उपाधि का दावा इस पद पर थोपा जाता है।
- issue: אֲדַבֵּר का कालगत बल
  choice: मैं तुझसे कहूँगा
  alternative: मैं तुझसे कहता हूँ
  rationale: हिब्रू अपूर्ण क्रिया वर्तमान या भविष्यगत बल रख सकती है। निकट प्रसंग में भविष्यगत अनुवाद आगामी प्रकाशन के अनुकूल है, किंतु इसे किसी विशेष धर्मसैद्धांतिक निष्कर्ष के रूप में नहीं लिया गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। परमेश्वर द्वारा नबी को एकवचन निकट संबोधन के कारण ‘तुझसे/कर/सुन’ प्रयुक्त हुए हैं। ‘हृदय’ बाइबलीय आंतरिक व्यक्ति—विचार, इच्छा और स्वीकार—की व्यापक धारणा बनाए रखता है।
