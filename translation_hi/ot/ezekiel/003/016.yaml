lexical_decisions:
- source_word: וַיְהִי מִקְצֵה שִׁבְעַת יָמִים
  choice: सात दिन बीतने पर
  rationale: यह अभिव्यक्ति सात दिनों की अवधि पूरी होने पर अगली घटना होने को दर्शाती है। हिन्दी में यह स्वाभाविक है और कथानक की प्रगति बनाए रखती है।
- source_word: דְבַר יְהוָה
  choice: यहोवा का वचन
  rationale: रचनात्मक संबंध को बनाए रखते हुए प्रचलित भविष्यद्वाणी-सूत्र का स्पष्ट और स्वाभाविक हिन्दी रूप दिया गया है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: मूल में आए परमेश्वर के व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय हिन्दी में प्रचलित लिप्यंतरण से प्रस्तुत किया गया है।
- source_word: אֵלַי
  choice: मेरे पास
  rationale: वचन के किसी व्यक्ति के पास आने के हिन्दी मुहावरे में यह स्वाभाविक रूप है।
- source_word: לֵאמֹר
  choice: ':'
  rationale: यह रूप आगे आने वाली प्रत्यक्ष वाणी का परिचय देता है; हिन्दी में पद के अंत में द्विबिंदु उसी कार्य को अधिक स्वाभाविक ढंग से पूरा करता है।
theological_decisions:
- issue: परमेश्वर के नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ के व्यक्तिगत नाम को सुरक्षित रखते हुए आधुनिक हिन्दी बाइबलीय प्रयोग में व्यापक रूप से पहचाना जाने वाला रूप चुना गया है; इसे ‘प्रभु’ जैसी उपाधि से प्रतिस्थापित नहीं किया गया।
- issue: דְבַר יְהוָה की निश्चितता
  choice: यहोवा का वचन
  alternative: यहोवा की ओर से एक वचन
  rationale: इब्रानी रचनात्मक पदबंध का औपचारिक संबंध सुरक्षित रखा गया है, जबकि वैकल्पिक अनिश्चित अर्थ को पादटिप्पणी में दर्ज किया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी; संक्षिप्त, गरिमापूर्ण और कथात्मक। ‘सात दिन बीतने पर’ इब्रानी काल-सूत्र को सहज हिन्दी में व्यक्त करता है। आगे की ईश्वरीय वाणी शुरू होने के कारण ‘कहते हुए’ की जगह द्विबिंदु रखा गया है।
