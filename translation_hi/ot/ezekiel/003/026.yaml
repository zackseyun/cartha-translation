source:
  edition: WLC
  text: וּ/לְשֽׁוֹנְ/ךָ֙ אַדְבִּ֣יק אֶל חִכֶּ֔/ךָ וְ/נֶֽאֱלַ֔מְתָּ וְ/לֹא תִֽהְיֶ֥ה לָ/הֶ֖ם לְ/אִ֣ישׁ מוֹכִ֑יחַ כִּ֛י בֵּ֥ית מְרִ֖י הֵֽמָּה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/003/026.yaml
  text: And I will make your tongue cling to the roof of your mouth[a], and you will be mute and will not be for them a man who rebukes[d][c][b], for they are a rebellious house.
translation:
  language: hi
  text: और मैं तुम्हारी जीभ को तुम्हारे तालू से चिपका दूँगा[a]; तुम बोल नहीं सकोगे[b] और उनके लिए उन्हें फटकारनेवाले नहीं रहोगे[c], क्योंकि वे विद्रोही घराना हैं[d]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “तुम्हारे मुँह के ऊपरी भाग से।”
    reason: lexical_alternative
  - marker: b
    text: या “तुम्हें चुप करा दिया जाएगा” अथवा “तुम वाणीहीन हो जाओगे।”
    reason: lexical_alternative
  - marker: c
    text: इब्रानी में “फटकारनेवाला मनुष्य”; अर्थात उन्हें फटकारने या सुधारनेवाला।
    reason: lexical_alternative
  - marker: d
    text: इब्रानी में “विद्रोही घर”; यहेजकेल में यह विद्रोह करनेवाली प्रजा को एक सामूहिक घराने के रूप में बताने वाली प्रचलित अभिव्यक्ति है।
    reason: cultural_note
lexical_decisions:
- source_word: אַדְבִּיק
  choice: चिपका दूँगा
  rationale: 'हिफ़िल रूप का कारणवाचक बल सुरक्षित है: परमेश्वर यह कराता है कि यहेजकेल की जीभ तालू से चिपक जाए।'
- source_word: לְשׁוֹנְךָ
  choice: तुम्हारी जीभ
  rationale: थोपी गई वाणीहीनता के ठोस शारीरिक बिंब को ज्यों का त्यों रखा गया है।
- source_word: אֶל חִכֶּךָ
  choice: तुम्हारे तालू से
  rationale: חֵךְ के लिए ‘तालू’ आधुनिक हिन्दी में सटीक, सहज और शारीरिक रूप से स्पष्ट है।
- source_word: וְנֶאֱלַמְתָּ
  choice: तब तुम गूँगे हो जाओगे
  rationale: निफ़ाल रूप बोलने में असमर्थ हो जाने की परिणामी अवस्था बताता है; ‘गूँगे हो जाओगे’ कारणवाचक पिछले खंड के साथ स्वाभाविक है।
- source_word: וְלֹא תִהְיֶה לָהֶם
  choice: और उनके लिए ... नहीं रहोगे
  rationale: इब्रानी के संबंधसूचक अस्तित्व-वाक्य को हिन्दी में स्वाभाविक रूप दिया गया है, बिना भूमिका को अनावश्यक रूप से विस्तृत किए।
- source_word: לְאִישׁ מוֹכִיחַ
  choice: डाँटनेवाले मनुष्य
  rationale: אִישׁ का पुरुषवाचक संदर्भ यहेजकेल से है और מוֹכִיחַ की भर्त्सना/सुधार की भविष्यद्वक्तीय धार को ‘डाँटनेवाले’ स्पष्ट रूप से व्यक्त करता है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यह यहेजकेल की वाणी रोके जाने का कारण प्रस्तुत करता है।
- source_word: בֵּית מְרִי
  choice: विद्रोही घराना
  rationale: यहेजकेल की विशिष्ट सामूहिक ‘घर’ वाली उपमा को ‘घराना’ सुरक्षित रखता है और आधुनिक हिन्दी में स्वाभाविक भी है।
theological_decisions:
- issue: यहेजकेल की बोलने की असमर्थता का स्वरूप
  choice: परमेश्वर द्वारा थोपी गई वाणीहीनता, जिसे जीभ के तालू से चिपकने के शारीरिक बिंब में व्यक्त किया गया है
  alternative: केवल रूपकात्मक चुप्पी या लोगों को प्रभावित न कर पाने की सामाजिक असमर्थता
  rationale: मूल पाठ ठोस शारीरिक भाषा का प्रयोग करता है। अनुवाद उसी को सुरक्षित रखता है, पर इस पद से आगे उसका स्वरूप नहीं समझाता।
- issue: בֵּית מְרִי का अनुवाद
  choice: विद्रोही घराना
  alternative: विद्रोही लोग
  rationale: ‘घराना’ समुदाय को एक सामूहिक परिवार/घर के रूप में दिखाने वाली यहेजकेल की अभिव्यक्ति को बनाए रखता है; ‘लोग’ इस बिंब को समतल कर देता।
- issue: לְאִישׁ में पुरुषवाचक भाषा
  choice: मनुष्य
  alternative: व्यक्ति या कोई
  rationale: यह शब्द विशेष रूप से पुरुष भविष्यद्वक्ता यहेजकेल को सूचित करता है, इसलिए संदर्भानुकूल पुरुषवाचकता बनाए रखी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सामान्य पाठकों के लिए बोधगम्य रूप। शारीरिक बिंब, कारणवाचक क्रिया और ‘विद्रोही घर’ की सामूहिक उपमा सुरक्षित रखी गई है।
