  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: לֹ֣א אֶל עַמִּ֣ים רַבִּ֗ים עִמְקֵ֤י שָׂפָה֙ וְ/כִבְדֵ֣י לָשׁ֔וֹן אֲשֶׁ֥ר לֹֽא תִשְׁמַ֖ע דִּבְרֵי/הֶ֑ם אִם לֹ֤א אֲלֵי/הֶם֙ שְׁלַחְתִּ֔י/ךָ הֵ֖מָּה יִשְׁמְע֥וּ אֵלֶֽי/ךָ׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/003/006.yaml
  text: not to many peoples of obscure speech and difficult language[a], whose words you cannot understand; surely, if I had sent you to them, they would listen to you.
translation:
  language: hi
  text: न अनेक लोगों के पास, जिनकी बोली दुर्बोध और भाषा कठिन है[a], जिनकी बातें तुम समझ नहीं सकते; निश्चय ही, यदि मैंने तुम्हें उनके पास भेजा होता, तो वे तुम्हारी बात सुनते।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से, “गहरे होंठ वाले और भारी जीभ वाले”; यह ऐसी बोली या भाषा के लिए मुहावरा है जिसे समझना कठिन हो।
    reason: lexical_alternative
lexical_decisions:
- source_word: עַמִּים רַבִּים
  choice: बहुत-से लोग
  rationale: बहुवचन עַמִּים अलग-अलग जातीय या राष्ट्रीय समुदायों की ओर संकेत करता है। वर्तमान वाक्य-संदर्भ में ‘बहुत-से लोग’ स्वाभाविक है और अनेक समुदायों का भाव बनाए रखता है।
- source_word: עִמְקֵי שָׂפָה
  choice: जिनकी बोली गूढ़
  rationale: शाब्दिक अर्थ ‘होंठ के गहरे’ है; यह ऐसी बोली का मुहावरा है जिसे समझना कठिन हो। ‘गूढ़ बोली’ उस कठिन-बोध्यता को संक्षेप और गरिमा से व्यक्त करती है।
- source_word: וְכִבְדֵי לָשׁוֹן
  choice: और भाषा कठिन
  rationale: शाब्दिक रूप ‘जीभ के भारी’ है। यहाँ आशय बोलने की शारीरिक कठिनाई नहीं, बल्कि श्रोता के लिए कठिन भाषा से है।
- source_word: אֲשֶׁר לֹא תִשְׁמַע דִּבְרֵיהֶם
  choice: जिनकी बातें तुम समझ नहीं सकते
  rationale: इस विदेशी-भाषा वाले संदर्भ में שׁמע का अर्थ केवल सुनना नहीं, समझना है।
- source_word: אִם לֹא
  choice: निश्चय ही, यदि
  rationale: यहाँ पदबंध कथन को दृढ़ करने वाली शर्त प्रस्तुत करता है; ‘निश्चय ही, यदि’ उसके बल और काल्पनिक स्थिति दोनों को रखता है।
- source_word: שְׁלַחְתִּיךָ
  choice: मैंने तुम्हें ... भेजा होता
  rationale: पूर्ण क्रिया इस शर्तीय संदर्भ में एक काल्पनिक, जो घटित नहीं हुई स्थिति व्यक्त करती है।
- source_word: הֵמָּה יִשְׁמְעוּ אֵלֶיךָ
  choice: वे तुम्हारी सुनते
  rationale: שׁמע אֶל का अर्थ किसी की बात ध्यान से या सकारात्मक रूप से सुनना है। ‘तुम्हारी सुनते’ संभावित प्रत्युत्तर को व्यक्त करता है, पर इसे स्पष्ट रूप से ‘आज्ञा मानते’ नहीं बनाता।
theological_decisions:
- issue: विदेशी लोगों के प्रत्युत्तर की प्रकृति
  choice: वे तुम्हारी सुनते
  alternative: वे तुम्हारी आज्ञा मानते
  rationale: इब्रानी में सुनने और अनुकूल प्रत्युत्तर देने दोनों की छाया संभव है। ‘तुम्हारी सुनते’ इस अर्थ-विस्तार को खुला रखता है और आज्ञाकारिता को अनावश्यक रूप से निश्चित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण और सहज शैली अपनाई गई है। ‘गूढ़ बोली’ और ‘कठिन भाषा’ मूल के समानांतर मुहावरों को अर्थपूर्ण हिन्दी में रखते हैं; पादटिप्पणी उनके शाब्दिक रूप को सुरक्षित करती है।
