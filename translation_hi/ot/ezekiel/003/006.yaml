  to: न अनेक लोगों के पास, जिनकी बोली दुर्बोध और भाषा कठिन है[a], जिनकी बातें तुम समझ नहीं सकते; निश्चय ही, यदि मैंने तुम्हें उनके पास भेजा होता, तो वे तुम्हारी बात सुनते।
