  text: וְ/לֵ֨ךְ בֹּ֤א אֶל הַ/גּוֹלָה֙ אֶל בְּנֵ֣י עַמֶּ֔/ךָ וְ/דִבַּרְתָּ֤ אֲלֵי/הֶם֙ וְ/אָמַרְתָּ֣ אֲלֵי/הֶ֔ם כֹּ֥ה אָמַ֖ר אֲדֹנָ֣/י יְהֹוִ֑ה אִֽם יִשְׁמְע֖וּ וְ/אִם יֶחְדָּֽלוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/003/011.yaml
  text: And go[a], come to the exiles, to the sons of your people, and speak to them and say to them[b], ‘Thus says the Lord GOD,’ whether they hear or whether they refuse.
translation:
  language: hi
  text: और जा और निर्वासितों के पास, अपनी प्रजा के लोगों के पास पहुँच; उनसे बात कर और उनसे कह, ‘प्रभु यहोवा यों कहता है,’ चाहे वे सुनें, चाहे सुनने से इनकार करें।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'दूसरा सम्भव अनुवाद: “चाहे वे सुनें, चाहे बाज़ रहें।” यहाँ इब्रानी में शाब्दिक विरोध ‘सुनने’ और ‘रुकने/बाज़ रहने’ के बीच है; प्रसंग में दूसरा पद सुनने या मानने से इनकार का भाव देता है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלֵךְ בֹּא
  choice: और जा ... पहुँच
  rationale: दोनों आज्ञार्थक गति-क्रियाओं को रखा गया है; हिन्दी में ‘जा ... पहुँच’ गन्तव्य की ओर जाने और वहाँ आने/पहुँचने का स्वाभाविक क्रम व्यक्त करता है।
- source_word: הַגּוֹלָה
  choice: निर्वासितों
  rationale: यह अमूर्त निर्वासन नहीं, देश से निकाले गए समुदाय का सामूहिक उल्लेख है।
- source_word: בְּנֵי עַמֶּךָ
  choice: अपनी प्रजा के लोगों
  rationale: शाब्दिक रूप ‘तेरी प्रजा के पुत्र’ है, पर यह प्रतिनिधिक संबंध-सूचक मुहावरा पूरे समुदाय के लोगों को दर्शाता है; आधुनिक हिन्दी में यह रूप स्वाभाविक और अर्थ-सटीक है।
- source_word: וְדִבַּרְתָּ אֲלֵיהֶם וְאָמַרְתָּ אֲלֵיהֶם
  choice: उनसे बात कर। उनसे कह
  rationale: मूल की दोहराई हुई दोनों वाणी-क्रियाओं को अलग-अलग रखा गया है और आज्ञार्थक क्रम बनाए रखा गया है।
- source_word: כֹּה אָמַר
  choice: यों कहता है
  rationale: यह भविष्यद्वक्ता का मानक संदेशवाहक-सूत्र है; ‘यों कहता है’ औपचारिक और सुबोध हिन्दी है।
- source_word: אֲדֹנָי יְהוִה
  choice: प्रभु यहोवा
  rationale: אֲדֹנָי को उपाधि ‘प्रभु’ और יהוה को वाचा-संबंधी नाम ‘यहोवा’ के रूप में अलग रखा गया है।
- source_word: אִם יִשְׁמְעוּ וְאִם יֶחְדָּלוּ
  choice: चाहे वे सुनें, चाहे सुनने से इनकार करें
  rationale: दोनों אִם मिलकर वैकल्पिक संरचना बनाते हैं। ‘सुनें’ मूल क्रिया को रखता है; חדל का शाब्दिक अर्थ रुकना/बाज़ आना है, पर इस विरोध में आशय बात मानने से इनकार करना है।
theological_decisions:
- issue: אֲדֹנָי יְהוִה में परमेश्वर के नाम का अनुवाद
  choice: प्रभु यहोवा
  alternative: प्रभु याहवे; प्रभु परमेश्वर
  rationale: मूल में उपाधि और विशिष्ट दिव्य नाम दोनों हैं। ‘प्रभु यहोवा’ हिन्दी बाइबलीय प्रयोग में परिचित रहते हुए इस भेद को सुरक्षित रखता है।
- issue: בְּנֵי עַמֶּךָ का प्रतिनिधिक लिंग-सूचक मुहावरा
  choice: अपनी प्रजा के लोगों
  alternative: अपनी प्रजा के पुत्रों
  rationale: ‘पुत्र’ मूल का शाब्दिक पुल्लिंग बहुवचन है, किन्तु यहाँ समुदाय के सदस्यों के लिए संबंध-सूचक सामूहिक अभिव्यक्ति है। ‘लोगों’ से उसके प्रतिनिधिक विस्तार को बिना केवल पुरुषों तक सीमित किए व्यक्त किया गया है।
- issue: יִשְׁמְעוּ और יֶחְדָּלוּ का विरोध
  choice: सुनें ... सुनने से इनकार करें
  alternative: सुनें ... बाज़ रहें
  rationale: ‘सुनना’ आज्ञापालन का अर्थ भी ग्रहण कर सकता है, जबकि חדל सामान्यतः रुकने या बाज़ रहने को कहता है। मुख्य पाठ प्रसंगगत विरोध स्पष्ट करता है और पादटिप्पणी शाब्दिक तनाव सुरक्षित रखती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और आज्ञात्मक है। मूल की क्रमिक आज्ञाएँ तथा ‘बात कर/कह’ की पुनरुक्ति सुरक्षित रखी गई है। सम्बोधन में एकवचन अनौपचारिक ‘जा/कर/कह’ चुना गया है, क्योंकि यह परमेश्वर द्वारा भविष्यद्वक्ता को सीधी आज्ञा है; इससे अनादर अभिप्रेत नहीं।
