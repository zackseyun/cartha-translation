id: EZK.3.19
reference: Ezekiel 3:19
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/אַתָּה֙ כִּֽי הִזְהַ֣רְתָּ רָשָׁ֔ע וְ/לֹא שָׁב֙ מֵֽ/רִשְׁע֔/וֹ וּ/מִ/דַּרְכּ֖/וֹ הָ/רְשָׁעָ֑ה ה֚וּא בַּ/עֲוֺנ֣/וֹ יָמ֔וּת וְ/אַתָּ֖ה אֶֽת נַפְשְׁ/ךָ֥ הִצַּֽלְתָּ־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/003/019.yaml
  text: But if you warn a wicked man and he does not turn from his wickedness or from his wicked way[a], he will die in his iniquity[b], but you will have delivered your life.
translation:
  language: hi
  text: परन्तु यदि तू दुष्ट को चेतावनी दे और वह अपनी दुष्टता और अपने बुरे मार्ग से न फिरे, तो वह अपने अधर्म में मरेगा; पर तूने अपना जीवन बचा लिया होगा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִזְהַרְתָּ
  choice: चेतावनी दे
  rationale: हिफ़ील रूप यहाँ सावधान करने या चेतावनी देने का अर्थ रखता है; यह पहरेदार के प्रसंग में स्वाभाविक और स्पष्ट है।
- source_word: רָשָׁע
  choice: दुष्ट
  rationale: यह एकवचन विशेषण संज्ञा के रूप में प्रयुक्त है और किसी दुष्ट व्यक्ति को सूचित करता है; हिन्दी में ‘दुष्ट’ स्वाभाविक रूप से व्यक्ति के लिए प्रयुक्त हो सकता है।
- source_word: שָׁב
  choice: फिरे
  rationale: मूल अर्थ ‘मुड़ना/लौटना’ है। ‘फिरे’ नैतिक दिशा बदलने की इब्रानी छवि को बनाए रखता है और ‘पश्चाताप करे’ जैसी अधिक व्याख्यात्मक अभिव्यक्ति से बचता है।
- source_word: מֵרִשְׁעוֹ
  choice: अपनी दुष्टता से
  rationale: רֶשַׁע नैतिक बुराई या दुष्ट आचरण को दर्शाता है; ‘दुष्टता’ इसका सीधा और गरिमापूर्ण हिन्दी रूप है।
- source_word: וּמִדַּרְכּוֹ הָרְשָׁעָה
  choice: और अपने बुरे मार्ग से
  rationale: דֶּרֶךְ जीवन-चाल या आचरण के रूपक के रूप में है। ‘मार्ग’ रूपक को सुरक्षित रखता है और ‘बुरे’ से הָרְשָׁעָה का सहज हिन्दी अनुवाद होता है।
- source_word: בַּעֲוֺנוֹ
  choice: अपने अधर्म में
  rationale: בְּ के साथ עָוֹן उस दोषपूर्ण अवस्था को व्यक्त कर सकता है जिसमें मृत्यु होती है। ‘अधर्म में’ कारण को आवश्यकता से अधिक निश्चित किए बिना नैतिक-दोष का भार बनाए रखता है।
- source_word: הִצַּלְתָּ אֶת־נַפְשְׁךָ
  choice: तूने अपना जीवन बचा लिया होगा
  rationale: נֶפֶשׁ यहाँ व्यक्ति के जीवन या स्वयं को दर्शाता है। ‘जीवन’ आधुनिक हिन्दी में स्पष्ट है और ‘आत्मा’ से उत्पन्न संकुचित दार्शनिक अर्थ से बचता है; पूर्ण क्रिया को प्रसंगानुसार भविष्य-पूर्ण भाव में व्यक्त किया गया है।
theological_decisions:
- issue: क्या दुष्ट की मृत्यु अनन्त दण्ड है या तात्कालिक न्यायिक मृत्यु
  choice: ‘अपने अधर्म में मरेगा’ कहकर इब्रानी कथन को उसके अपने शब्दों में रखा गया है।
  alternative: ‘अपने पाप के कारण मरेगा’ अथवा इसे स्पष्ट रूप से अनन्त दण्ड बताना।
  rationale: पद मृत्यु का उल्लेख करता है, पर उसके सम्पूर्ण धर्मवैज्ञानिक दायरे को परिभाषित नहीं करता; इसलिए अनुवाद इस तनाव को खुला रखता है।
- issue: נַפְשְׁךָ का अर्थ ‘आत्मा’, ‘जीवन’ या ‘स्वयं’
  choice: ‘अपना जीवन’
  alternative: ‘अपनी आत्मा’ या ‘अपने आपको’
  rationale: इस प्रसंग में शब्द यहेजकेल के जीवन या व्यक्ति को उसकी जवाबदेही के सम्बन्ध में सूचित करता है। ‘जीवन’ स्पष्ट है और अनिवार्य रूप से अमूर्त आत्मा अथवा अनन्त उद्धार का अर्थ आरोपित नहीं करता।
- issue: וּמִדַּרְכּוֹ में संयोजक का सम्बन्ध
  choice: ‘और अपने बुरे मार्ग से’
  alternative: ‘या अपने बुरे मार्ग से’
  rationale: इब्रानी וְ का औपचारिक मूल्य ‘और’ है। दोनों पद दुष्टता और दुष्ट जीवन-मार्ग के निकट सम्बद्ध वर्णन हैं; हिन्दी में ‘और’ मूल समन्वय को सुरक्षित रखता है, यद्यपि प्रसंगगत अर्थ में ‘या’ सम्भव समझा जा सकता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, स्पष्ट बाइबलीय शैली रखी गई है। परमेश्वर द्वारा नबी को एकवचन सम्बोधन के कारण ‘तू’ का प्रयोग किया गया है। ‘मार्ग’, ‘अधर्म’ और ‘फिरना’ मूल रूपकों तथा नैतिक भाषा को बनाए रखते हैं, पर वाक्य-संरचना सामान्य पाठक के लिए सहज रखी गई है।
