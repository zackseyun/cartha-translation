id: EZK.3.22
reference: Ezekiel 3:22
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/תְּהִ֥י עָלַ֛/י שָׁ֖ם יַד יְהוָ֑ה וַ/יֹּ֣אמֶר אֵלַ֗/י ק֥וּם צֵא֙ אֶל הַ/בִּקְעָ֔ה וְ/שָׁ֖ם אֲדַבֵּ֥ר אוֹתָֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/003/022.yaml
  text: And there the hand of Yahweh was upon me[a], and he said to me, “Rise, go out to the valley[b], and there I will speak with you.”
translation:
  language: hi
  text: वहाँ याहवे का हाथ मुझ पर था। उसने मुझसे कहा, “उठ, निकलकर घाटी[a] में जा; वहाँ मैं तुझसे बात करूँगा[b]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “मैदान।”
    reason: lexical_alternative
  - marker: b
    text: या “मैं तुझसे बोलूँगा।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתְּהִי עָלַי שָׁם
  choice: वहाँ … मुझ पर था
  rationale: היה + על की अभिव्यक्ति भविष्यद्वक्ता पर ईश्वरीय प्रभाव या सामर्थ्य के विद्यमान होने का चित्र रखती है। ‘था’ मूल के स्थितिपरक भाव को बनाए रखता है और अनावश्यक रूप से ‘आया’ का आरंभिक भाव नहीं जोड़ता।
- source_word: יַד יְהוָה
  choice: याहवे का हाथ
  rationale: ठोस इब्रानी रूपक को ‘सामर्थ्य’ कहकर व्याख्यायित करने के बजाय सुरक्षित रखा गया है।
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत वाचा-नाम को किसी उपाधि से बदलने के बजाय आधुनिक देवनागरी में लिप्यंतरित किया गया है।
- source_word: קוּם צֵא
  choice: उठ, निकलकर … जा
  rationale: दोनों आज्ञार्थक क्रियाओं—उठने और बाहर जाने—को स्वाभाविक आधुनिक हिन्दी में स्पष्ट रखा गया है।
- source_word: הַבִּקְעָה
  choice: घाटी
  rationale: בִּקְעָה किसी चौड़ी घाटी या समतल निचले भूभाग को सूचित कर सकता है। मुख्य पाठ में संदर्भानुकूल और सहज ‘घाटी’ रखा गया है; ‘मैदान’ को पादटिप्पणी में दिया गया है।
- source_word: אֲדַבֵּר אוֹתָךְ
  choice: मैं तुझसे बात करूँगा
  rationale: דבר + את के ‘किसी से बात करना’ वाले भाव को स्वाभाविक हिन्दी में व्यक्त करता है और संवाद-संबंधी संभावित अर्थ को बनाए रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में चतुरक्षरीय व्यक्तिगत नाम सीधे आया है। ‘याहवे’ उसका निकटतर आधुनिक लिप्यंतरण है और उसे उपाधि से नहीं बदलता।
- issue: ‘याहवे का हाथ’ रूपक
  choice: रूपक को ज्यों का त्यों रखना
  alternative: याहवे की शक्ति मुझ पर थी
  rationale: मूल की भविष्यद्वक्तात्मक अभिव्यक्ति ईश्वरीय सामर्थ्य और प्रभाव की ओर संकेत करती है, पर पद स्वयं इसे केवल अमूर्त ‘शक्ति’ नहीं कहता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सहज रखी गई है। प्रत्यक्ष संबोधन में एकवचन ‘तू’ के आदरसूचक/प्राचीन क्रियारूपों के बजाय मूल के निकट, संक्षिप्त आज्ञार्थक रूप ‘उठ’ और ‘जा’ प्रयुक्त हैं। दोनों पादटिप्पणी-चिह्न मुख्य पाठ में संबंधित शब्दों के ठीक बाद रखे गए हैं।
