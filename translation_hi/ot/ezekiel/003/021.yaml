source:
  edition: WLC
  text: וְ/אַתָּ֞ה כִּ֧י הִזְהַרְתּ֣/וֹ צַדִּ֗יק לְ/בִלְתִּ֥י חֲטֹ֛א צַדִּ֖יק וְ/ה֣וּא לֹא חָטָ֑א חָי֤וֹ יִֽחְיֶה֙ כִּ֣י נִזְהָ֔ר וְ/אַתָּ֖ה אֶֽת נַפְשְׁ/ךָ֥ הִצַּֽלְתָּ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/003/021.yaml
  text: But if you warn a righteous man not to sin[a], and he does not sin, he will surely live because he took warning, and you will have delivered your life.
translation:
  language: hi
  text: पर यदि तू किसी धर्मी को चेतावनी दे कि वह पाप न करे, और वह पाप न करे, तो वह निश्चय जीवित रहेगा, क्योंकि वह चेताया गया था[a]; और तूने अपना जीवन बचा लिया होगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “क्योंकि उसने चेतावनी मानी” अथवा “क्योंकि उसने चेतावनी पर ध्यान दिया।” इब्रानी क्रिया चेतावनी पाने या उस पर ध्यान देने—दोनों में से किसी पर बल दे सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: यदि
  rationale: וְאַתָּה के बाद यह शर्त की भूमिका प्रस्तुत करता है और पिछले प्रसंग के समानांतर है।
- source_word: הִזְהַרְתּוֹ
  choice: तू ... चेतावनी दे
  rationale: זהר का हिफ़ील किसी को सावधान करने या चेतावनी देने का अर्थ रखता है; शर्तसूचक वाक्य में सामान्य वर्तमानार्थ स्वाभाविक है।
- source_word: צַדִּיק
  choice: किसी धर्मी
  rationale: यह पुल्लिंग एकवचन विशेषण संज्ञा के रूप में प्रयुक्त है। हिंदी में ‘धर्मी’ व्यक्ति को स्वाभाविक रूप से व्यक्त करता है, और ‘किसी’ अनिश्चित शर्तसूचक उदाहरण स्पष्ट करता है।
- source_word: לְבִלְתִּי חֲטֹא
  choice: कि वह पाप न करे
  rationale: यह रचना निषेधात्मक उद्देश्य व्यक्त करती है—चेतावनी इस उद्देश्य से दी जाती है कि वह पाप न करे।
- source_word: וְהוּא לֹא חָטָא
  choice: और वह पाप न करे
  rationale: इब्रानी पूर्ण क्रिया यहाँ शर्त और परिणाम वाले सामान्य सिद्धांत में आती है; हिंदी में संभाव्य रूप शर्त के साथ सहज बैठता है।
- source_word: חָיוֹ יִחְיֶה
  choice: वह निश्चय जीवित रहेगा
  rationale: धातु के infinitive absolute और imperfect का मेल क्रिया पर बल देता है; ‘निश्चय’ उस प्रबलता को स्पष्ट करता है।
- source_word: נִזְהָר
  choice: उसने चेतावनी ग्रहण की
  rationale: זהר का निफ़ाल चेतावनी पाने और उससे सावधान होने—दोनों की ओर संकेत कर सकता है। ‘चेतावनी ग्रहण की’ इस अस्पष्टता को काफी हद तक बनाए रखता है; पादटिप्पणी विकल्प बताती है।
- source_word: נַפְשְׁךָ
  choice: अपना जीवन
  rationale: इस पहरेदार-संदर्भ में נֶפֶשׁ व्यक्ति के जीवन को सूचित करता है, न कि आवश्यक रूप से देह से पृथक आत्मा को।
- source_word: הִצַּלְתָּ
  choice: बचा लिया होगा
  rationale: נצל का हिफ़ील बचाने या छुड़ाने का अर्थ देता है। हिंदी का पूर्ण भविष्य शर्त पूरी होने के परिणामी पक्ष को स्वाभाविक ढंग से व्यक्त करता है।
theological_decisions:
- issue: ‘अपना जीवन बचा लिया’ का पहरेदार-संदर्भ में अर्थ
  choice: वाक्यांश को बिना व्याख्यात्मक विस्तार के रखा गया है, ताकि भविष्यद्वक्ता की परमेश्वर के सामने जवाबदेही और रक्तदोष से बचने का संदर्भ बना रहे।
  alternative: इसे आत्म-प्रयास से आध्यात्मिक उद्धार या केवल शारीरिक जीवन की रक्षा के रूप में स्पष्ट कर देना।
  rationale: यहेजकेल के पहरेदार-वचनों में चेतावनी देने की जिम्मेदारी न्यायिक और वाचागत जवाबदेही से जुड़ी है। अनुवाद को इस गंभीरता को बनाए रखना चाहिए, पर मूल पाठ से आगे बढ़कर उद्धार-सिद्धांत निर्धारित नहीं करना चाहिए।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण और सहज शैली रखी गई है। संदर्भ में परमेश्वर द्वारा यहेजकेल को एकवचन संबोधन होने के कारण ‘तू’ रखा गया है। ‘धर्मी’ सामान्य पाठक के लिए परिचित बाइबलीय शब्द है। पादटिप्पणी का [a] चिह्न मुख्य पाठ में संबंधित पदबंध के तुरंत बाद दिया गया है।
