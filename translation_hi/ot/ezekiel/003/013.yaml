- source_word: לְעֻמָּתָם
  choice: उनके पास के
  rationale: यह जीवित प्राणियों के सापेक्ष पहियों की स्थानिक स्थिति बताता है; ‘पास’ स्वाभाविक है, जबकि ‘उनके सामने’ भी सम्भव है।
- source_word: רַעַשׁ גָּדוֹל
  choice: एक बड़े गड़गड़ाहट
  rationale: रַעַשׁ हिलने, खड़खड़ाने या प्रचंड कोलाहल की ध्वनि व्यक्त कर सकता है; ‘गड़गड़ाहट’ उसकी भारी, शक्तिशाली ध्वनि को बिना भूकम्प निश्चित किए व्यक्त करती है।
