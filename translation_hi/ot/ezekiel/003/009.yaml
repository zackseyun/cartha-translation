  yaml_path: translation/ot/ezekiel/003/009.yaml
  text: Like diamond[a], harder than flint, I have made your forehead. Do not fear them, and do not be dismayed before them, for they are a rebellious house.
translation:
  language: hi
  text: मैंने तुम्हारा माथा हीरे[a] की तरह, चकमक पत्थर से भी कठोर बना दिया है। उनसे मत डरना और उनके सामने भयभीत मत होना, क्योंकि वे विद्रोही घराना हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “अडामैंट”; इब्रानी शब्द שָׁמִיר किसी अत्यंत कठोर पत्थर या पदार्थ को सूचित कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁמִיר
  choice: हीरा
  rationale: चकमक पत्थर से अधिक कठोरता की तुलना वाले इस संदर्भ में यह किसी अत्यंत कठोर पत्थर या पदार्थ को दर्शाता है। आधुनिक हिन्दी में ‘हीरा’ इस बिंब को स्वाभाविक रूप से व्यक्त करता है; शब्द की सटीक पहचान अनिश्चित होने के कारण पादटिप्पणी दी गई है।
- source_word: חָזָק מִצֹּר
  choice: चकमक पत्थर से भी कठोर
  rationale: מִן के साथ חָזָק यहाँ तुलनात्मक अर्थ देता है। कठोर पदार्थों और माथे के बिंब के संदर्भ में ‘कठोर’ सामान्य ‘मज़बूत’ से अधिक सटीक है।
- source_word: מִצְחֶךָ
  choice: तुम्हारे माथे को
  rationale: यह शब्द सीधे माथे को दर्शाता है और दृढ़ता के शारीरिक रूपक को बनाए रखता है।
- source_word: לֹא תִירָא אוֹתָם
  choice: उनसे मत डरना
  rationale: आज्ञा और आश्वासन से युक्त इस नियुक्ति-प्रसंग में निषेधात्मक आग्रह को सहज आधुनिक हिन्दी में व्यक्त किया गया है।
- source_word: וְלֹא תֵחַת מִפְּנֵיהֶם
  choice: और उनके सामने भयभीत मत होना
  rationale: חתת का निफ़अल रूप टूट जाने, हतोत्साहित या आतंकित होने का भाव दे सकता है। ‘भयभीत मत होना’ समानांतर निषेध को स्पष्ट रखता है, जबकि ‘उनके सामने’ उपस्थिति-संबंधी מִפְּנֵיהֶם को सुरक्षित रखता है।
- source_word: בֵּית מְרִי
  choice: विद्रोही घराना
  rationale: ‘घराना’ सामूहिक और पारिवारिक बिंब को बनाए रखते हुए आधुनिक हिन्दी में ‘विद्रोही घर’ की अपेक्षा अधिक स्वाभाविक है।
theological_decisions:
- issue: भविष्यद्वाणी की फटकार में इस्राएल के लिए सामूहिक संबोधन
  choice: विद्रोही घराना
  alternative: विद्रोही लोग
  rationale: इब्रानी पाठ में ‘घर’ का पारिवारिक और वाचाई सामूहिक बिंब है। ‘घराना’ उस बिंब को बनाए रखता है और इसे केवल सामान्य ‘लोग’ में समतल नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘चकमक पत्थर’ स्पष्टता के लिए प्रयुक्त हुआ है; ‘घराना’ यहेजकेल की आवर्ती सामूहिक उपमा को स्वाभाविक हिन्दी में सुरक्षित रखता है।
