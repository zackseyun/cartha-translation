    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אֵלַי
  choice: तब उसने मुझसे कहा
  rationale: वाव-क्रमवाचक कथा को आगे बढ़ाता है; ‘तब’ आधुनिक हिन्दी में घटनाक्रम को स्वाभाविक रूप से व्यक्त करता है।
- source_word: בֶּן אָדָם
  choice: हे मनुष्य के पुत्र
  rationale: यह यहेजकेल के लिए बार-बार प्रयुक्त सम्बोधन है। ‘मनुष्य के पुत्र’ मूल इब्रानी मुहावरे और उसके साहित्यिक स्वर को बनाए रखता है; ‘हे’ हिन्दी में प्रत्यक्ष सम्बोधन स्पष्ट करता है।
- source_word: לֶךְ בֹּא
  choice: पास जा
  rationale: दोनों इब्रानी आज्ञार्थक क्रियाएँ मिलकर गंतव्य की ओर जाने का एक संयुक्त आदेश देती हैं। हिन्दी में दोनों को शाब्दिक रूप से ‘जा, आ’ कहना भ्रमकारी होगा; ‘के पास जा’ उनका स्वाभाविक अर्थ देता है।
- source_word: אֶל בֵּית יִשְׂרָאֵל
  choice: इस्राएल के घराने के पास
  rationale: ‘इस्राएल का घराना’ भविष्यद्वक्ताओं की प्रचलित सामूहिक अभिव्यक्ति है और लोगों तथा वाचा-समुदाय, दोनों का भाव सुरक्षित रखती है।
- source_word: וְדִבַּרְתָּ בִדְבָרַי
  choice: और ... मेरे वचन कह
  rationale: वाव से जुड़ा क्रियारूप पहले आदेश के परिणामस्वरूप अगला आदेश देता है। ‘मेरे वचन कह’ मूल के बहुवचन और सीधेपन को बनाए रखता है।
- source_word: אֲלֵיהֶם
  choice: उनसे
  rationale: सर्वनाम का संदर्भ इस्राएल के घराने के लोगों से है; हिन्दी में ‘उनसे ... कह’ स्वाभाविक प्रयोग है।
theological_decisions:
- issue: सम्बोधन בֶּן אָדָם में אָדָם का अनुवाद
  choice: मनुष्य के पुत्र
  alternative: नश्वर मनुष्य; मानव
  rationale: यह रूप इब्रानी सम्बोधन की बनावट और यहेजकेल में उसकी आवृत्ति को सुरक्षित रखता है। इसे बाद के मसीही पदनाम के अर्थ में निर्णायक रूप से नहीं पढ़ा गया है, और वैकल्पिक अर्थ पादटिप्पणी में दिए गए हैं।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘इस्राएल का घराना’ भविष्यद्वक्ताओं की विशिष्ट अभिव्यक्ति के रूप में सुरक्षित है, जबकि לֶךְ בֹּא को हिन्दी में भ्रामक शाब्दिक पुनरावृत्ति के बजाय स्वाभाविक संयुक्त आदेश के रूप में व्यक्त किया गया है।
