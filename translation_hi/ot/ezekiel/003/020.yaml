  yaml_path: translation/ot/ezekiel/003/020.yaml
  text: And when a righteous man turns from his righteousness and does injustice[a], and I place a stumbling block before him, he will die. Because you did not warn him, he will die in his sin, and his righteous deeds that he did will not be remembered[d][c][b]; and I will require his blood from your hand.
translation:
  language: hi
  text: और जब कोई धर्मी अपने धर्मी चाल-चलन से फिरकर अन्याय करता है, और मैं उसके सामने ठोकर का पत्थर रखता हूँ,[a] तो वह मर जाएगा। वह अपने पाप में मर जाएगा, क्योंकि तुमने उसे चेतावनी नहीं दी; उसके जो धर्मी काम उसने किए हैं वे स्मरण नहीं किए जाएँगे, और उसके खून का हिसाब मैं तुमसे लूँगा।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसके सामने एक बाधा रखता हूँ।” इब्रानी में शाब्दिक रूप से “ठोकर का पत्थर” है।
    reason: lexical_alternative
  - marker: b
    text: अर्थात परमेश्वर उस व्यक्ति की मृत्यु के लिए पहरेदार को जवाबदेह ठहराएगा।
    reason: cultural_note
lexical_decisions:
- source_word: וּבְשׁוּב צַדִּיק מִצִּדְקוֹ
  choice: और जब कोई धर्मी अपने धर्ममय आचरण से फिरकर
  rationale: בְּ + infinitive construct को कालगत-शर्तात्मक “जब” से व्यक्त किया गया है। צִדְקוֹ यहाँ केवल अमूर्त या न्यायालयीय स्थिति नहीं, बल्कि धर्मी चाल-चलन भी सूचित करता है; इसलिए स्वाभाविक हिन्दी में “धर्ममय आचरण” चुना गया।
- source_word: וְעָשָׂה עָוֶל
  choice: अन्याय करता है
  rationale: עָוֶל में गलत काम, अधर्म और अन्याय का नैतिक-न्यायिक भाव है; “अन्याय” इसे संक्षेप और वर्तमान हिन्दी में रखता है।
- source_word: וְנָתַתִּי מִכְשׁוֹל לְפָנָיו
  choice: और मैं उसके सामने ठोकर का कारण रखता हूँ
  rationale: मूल पाठ परमेश्वर की प्रत्यक्ष कर्तृता और מִכְשׁוֹל की ठोकर वाली उपमा दोनों बनाए रखता है। “ठोकर का कारण” हिन्दी में अर्थगम्य रहते हुए रूपक को सुरक्षित रखता है।
- source_word: הוּא יָמוּת
  choice: तो वह मर जाएगा
  rationale: स्पष्ट परिणाम को सामान्य आधुनिक हिन्दी भविष्यत् रूप में व्यक्त किया गया है।
- source_word: כִּי לֹא הִזְהַרְתּוֹ בְּחַטָּאתוֹ יָמוּת
  choice: क्योंकि तुमने उसे चेतावनी नहीं दी, इसलिए वह अपने पाप में मर जाएगा
  rationale: כִּי का कारणसूचक बल “क्योंकि” से और परिणाम का संबंध “इसलिए” से स्पष्ट किया गया है; “अपने पाप में” בְּחַטָּאתוֹ की मूल छवि बनाए रखता है।
- source_word: וְלֹא תִזָּכַרְןָ צִדְקֹתָיו אֲשֶׁר עָשָׂה
  choice: उसके किए हुए धर्म के काम स्मरण नहीं किए जाएँगे
  rationale: बहुवचन צִדְקֹתָיו को ठोस धार्मिक/धर्मी कर्मों के रूप में प्रस्तुत किया गया है। निष्क्रिय “स्मरण नहीं किए जाएँगे” मूल की अभिव्यक्ति और उसकी खुली कर्तृता बनाए रखता है।
- source_word: וְדָמוֹ מִיָּדְךָ אֲבַקֵּשׁ
  choice: और उसके खून का हिसाब मैं तुमसे लूँगा
  rationale: शाब्दिक “तेरे हाथ से उसका खून माँगूँगा” हिन्दी में अस्वाभाविक हो सकता है। “खून का हिसाब ... लूँगा” रक्त-दोष और पहरेदार की जवाबदेही की न्यायिक उपमा को स्वाभाविक ढंग से सुरक्षित रखता है।
theological_decisions:
- issue: परमेश्वर द्वारा धर्मी व्यक्ति के सामने מִכְשׁוֹל रखने का अर्थ
  choice: परमेश्वर की कर्तृता को स्पष्ट रखते हुए “मैं ... ठोकर का कारण रखता हूँ”
  alternative: इसे केवल स्वाभाविक परिणाम या निष्क्रिय अनुमति के रूप में समझाकर अनुवाद करना
  rationale: इब्रानी पाठ यह कार्य सीधे परमेश्वर से जोड़ता है। अनुवाद कारणता और नैतिक उत्तरदायित्व के तनाव को बिना सुलझाए बनाए रखता है।
- issue: धर्म से फिरने के बाद पहले के धर्म के कामों का स्मरण न होना
  choice: न्याय के इस प्रसंग में पूर्व धर्म के काम “स्मरण नहीं किए जाएँगे”
  alternative: इसे किसी विशिष्ट मत के अनुसार उद्धार खोने या केवल आलंकारिक चेतावनी के रूप में स्पष्ट करना
  rationale: पद पूर्व धर्मी कर्मों के न गिने जाने की चेतावनी देता है, पर व्यवस्थित धर्मशास्त्र का पूरा निष्कर्ष नहीं बताता; अतः किसी साम्प्रदायिक निष्कर्ष को नहीं जोड़ा गया।
- issue: पहरेदार की रक्त-दोष संबंधी जवाबदेही
  choice: “उसके खून का हिसाब मैं तुमसे लूँगा”
  alternative: केवल सामान्य रूप से “मैं तुम्हें जिम्मेदार ठहराऊँगा”
  rationale: चुना गया रूप जवाबदेही को स्पष्ट करता है, पर मूल की रक्त-संबंधी न्यायिक भाषा को भी बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी, आदरपूर्ण किंतु सामान्य पाठक के लिए सुबोध। “धर्मी,” “पाप,” और “स्मरण” जैसे परिचित बाइबिलीय शब्द रखे गए हैं; अत्यधिक संस्कृतनिष्ठ “अधर्म/रक्त” के स्थान पर प्रसंगानुकूल “अन्याय/खून” प्रयुक्त हुए हैं। सभी पाद-टिप्पणी चिह्न मुख्य पाठ में उपस्थित हैं।
