  text: הִנֵּ֨ה נָתַ֧תִּי אֶת פָּנֶ֛י/ךָ חֲזָקִ֖ים לְ/עֻמַּ֣ת פְּנֵי/הֶ֑ם וְ/אֶֽת מִצְחֲ/ךָ֥ חָזָ֖ק לְ/עֻמַּ֥ת מִצְחָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/003/008.yaml
  text: Behold[a], I have made your face strong against their faces, and your forehead strong against their foreheads.
translation:
  language: hi
  text: देखो,[a] मैंने तुम्हारे चेहरे को उनके चेहरों के मुकाबले दृढ़ बनाया है, और तुम्हारे माथे को उनके माथों के मुकाबले दृढ़ बनाया है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “कठोर”; दोनों उपवाक्यों में प्रयुक्त इब्रानी शब्द विरोध के सामने दृढ़ता या कठोरता का भाव दे सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: देखो
  rationale: यह शब्द परमेश्वर की गंभीर और बलपूर्ण घोषणा की ओर ध्यान खींचता है; आधुनिक हिन्दी में ‘देखो’ इसका स्वाभाविक और गरिमापूर्ण रूप है।
- source_word: נָתַתִּי
  choice: मैंने ... कर दिया है
  rationale: शाब्दिक अर्थ ‘मैंने दिया है’ है, पर शरीर के अंग और विशेषण के साथ यह रचना किसी गुण से युक्त करने का भाव देती है।
- source_word: פָּנֶיךָ / פְּנֵיהֶם
  choice: तुम्हारा चेहरा / उनके चेहरों
  rationale: ठोस शारीरिक बिंब और दोनों पक्षों के आमने-सामने होने की समानांतर संरचना सुरक्षित रहती है।
- source_word: חֲזָקִים / חָזָק
  choice: दृढ़
  rationale: यहाँ शब्द सामर्थ्य, कठोरता या अडिगता व्यक्त करता है। ‘दृढ़’ विरोध का सामना करने के लिए परमेश्वर से मिली स्थिरता बताता है, बिना नकारात्मक ‘हठी’ भाव जोड़े।
- source_word: לְעֻמַּת
  choice: के सामने
  rationale: मूल पूर्वसर्ग आमने-सामने या मुकाबले में स्थित होने का भाव रखता है। ‘के सामने’ शारीरिक बिंब और प्रसंगगत विरोध—दोनों को बनाए रखता है।
- source_word: מִצְחֲךָ / מִצְחָם
  choice: तुम्हारा माथा / उनके माथों
  rationale: मूल का ठोस शारीरिक रूपक और पद का संतुलित समानांतर विन्यास सुरक्षित रखा गया है।
theological_decisions:
- issue: परमेश्वर द्वारा चेहरे और माथे को दृढ़ किए जाने का रूपक
  choice: चेहरे और माथे के ठोस बिंब को बनाए रखते हुए परमेश्वर से मिली दृढ़ता व्यक्त की गई है।
  alternative: ‘मैंने तुम्हें उनके विरुद्ध हठी बना दिया है’ जैसा अमूर्त रूपांतर।
  rationale: मूल पाठ शरीर-संबंधी बिंब द्वारा भविष्यद्वक्ता को विरोध का सामना करने की सामर्थ्य देता है। इसे ‘हठी’ कहना यहेजकेल पर अनावश्यक नकारात्मक नैतिक अर्थ आरोपित कर सकता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सीधी, गरिमापूर्ण भाषा रखी गई है। मूल की दो समानांतर पंक्तियों, शारीरिक बिंबों और शब्द-पुनरावृत्ति को यथासंभव सुरक्षित रखा गया है।
