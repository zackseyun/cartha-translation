  yaml_path: translation/ot/ezekiel/003/001.yaml
  text: Then he said to me[a], “Son of man, eat what you find; eat this scroll, and go, speak to the house of Israel.”
translation:
  language: hi
  text: तब उसने मुझसे कहा, “हे मनुष्य के पुत्र, जो तुझे मिले, उसे खा[a]; इस स्क्रॉल को खा, और जाकर इस्राएल के घराने से बात कर।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जो कुछ तुझे मिले, खा।” इब्रानी अभिव्यक्ति का अनुवाद दोनों प्रकार से किया जा सकता है; आशय यह है कि यहेजकेल अपने सामने रखी वस्तु को खाए।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אֵלַי
  choice: तब उसने मुझसे कहा
  rationale: वाव-क्रमिक रूप कथा को आगे बढ़ाता है; ‘तब’ आधुनिक हिन्दी में क्रम को स्वाभाविक रूप से व्यक्त करता है।
- source_word: בֶּן אָדָם
  choice: हे मनुष्य के पुत्र
  rationale: यहेजकेल में प्रयुक्त इब्रानी संबोधन की प्रत्यक्ष छवि और प्रतिनिधि मानवीय अर्थ को बनाए रखता है; ‘हे’ हिन्दी में प्रत्यक्ष संबोधन को स्पष्ट करता है।
- source_word: אֵת אֲשֶׁר תִּמְצָא
  choice: जो तुझे मिले, उसे
  rationale: इब्रानी संबंधवाचक अभिव्यक्ति का स्वाभाविक हिन्दी रूप है और सामने रखी हुई वस्तु को ग्रहण करने का भाव बनाए रखता है।
- source_word: אֱכֹל אֱכוֹל
  choice: उसे खा; इस पुस्तक-पत्र को खा
  rationale: दोहराए गए आदेश को हिन्दी में भी दो बार ‘खा’ कहकर सुरक्षित रखा गया है; इसे केवल एक आदेश में समेटा नहीं गया।
- source_word: מְגִלָּה
  choice: पुस्तक-पत्र
  rationale: यह प्राचीन लिखित स्क्रॉल के लिए संक्षिप्त और गरिमापूर्ण हिन्दी पद है; केवल ‘पुस्तक’ कहने की अपेक्षा मूल वस्तु के पत्र/लिखित माध्यम का संकेत अधिक स्पष्ट रखता है।
- source_word: וְלֵךְ
  choice: और जाकर
  rationale: आदेशों के क्रम को स्वाभाविक हिन्दी संयुक्त क्रिया में व्यक्त करता है।
- source_word: דַּבֵּר
  choice: बोल
  rationale: मूल क्रिया का सीधा समतुल्य है और ‘घोषणा कर’ जैसी अतिरिक्त व्याख्यात्मक शक्ति नहीं जोड़ता।
- source_word: בֵּית יִשְׂרָאֵל
  choice: इस्राएल का घराना
  rationale: इब्रानी की सामूहिक और वाचागत ‘घर’ की अभिव्यक्ति को हिन्दी में प्रचलित ‘घराना’ द्वारा सुरक्षित रखता है।
theological_decisions:
- issue: בֶּן אָדָם में אָדָם का अनुवाद
  choice: मनुष्य
  alternative: मानव
  rationale: ‘मनुष्य के पुत्र’ मूल संबोधन की शाब्दिक छवि को सुरक्षित रखता है और यहेजकेल को उसकी मानवीय स्थिति में संबोधित करने का भाव बनाए रखता है; इसे किसी विशिष्ट मसीही उपाधि के रूप में व्याख्यायित नहीं किया गया।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, सीधे संबोधन और आदेशात्मक लय के साथ रखी गई है। ‘तुझे’ दिव्य वक्ता के एकवचन प्रत्यक्ष संबोधन को स्वाभाविक रूप देता है। ‘पुस्तक-पत्र’ प्राचीन स्क्रॉल के लिए गरिमापूर्ण किंतु अपेक्षाकृत पारदर्शी पद चुना गया है।
