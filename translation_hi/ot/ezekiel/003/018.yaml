  text: בְּ/אָמְרִ֤/י לָֽ/רָשָׁע֙ מ֣וֹת תָּמ֔וּת וְ/לֹ֣א הִזְהַרְתּ֗/וֹ וְ/לֹ֥א דִבַּ֛רְתָּ לְ/הַזְהִ֥יר רָשָׁ֛ע מִ/דַּרְכּ֥/וֹ הָ/רְשָׁעָ֖ה לְ/חַיֹּת֑/וֹ ה֤וּא רָשָׁע֙ בַּ/עֲוֺנ֣/וֹ יָמ֔וּת וְ/דָמ֖/וֹ מִ/יָּדְ/ךָ֥ אֲבַקֵּֽשׁ׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/003/018.yaml
  text: When I say to the wicked man[a], ‘You shall surely die,’ and you do not warn him, and you do not speak to warn the wicked man from his wicked way so that he may live, that wicked man shall die in his iniquity[b], but I will require his blood from your hand.
translation:
  language: hi
  text: जब मैं दुष्ट से कहूँ, ‘तू निश्चय ही मर जाएगा,’ और तू उसे चेतावनी न दे, और उस दुष्ट को उसके दुष्ट मार्ग से सावधान करने के लिए कुछ न कहे, ताकि वह जीवित रहे, तो वह दुष्ट अपने अधर्म में[a] मर जाएगा; पर उसका खून मैं तेरे हाथ से माँगूँगा।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘अपने अधर्म में’ का अनुवाद ‘अपने अधर्म के कारण’ या ‘अपने पाप के कारण’ भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: अर्थात, ‘उसके खून के लिए मैं तुझे उत्तरदायी ठहराऊँगा।’ इब्रानी में अधिक शाब्दिक रूप से है, ‘उसका खून मैं तेरे हाथ से माँगूँगा,’ जो जवाबदेही का न्यायिक मुहावरा है।
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּאָמְרִי
  choice: जब मैं ... कहूँ
  rationale: ב के साथ यह रूप काल-सूचक उपवाक्य बनाता है; आधुनिक हिन्दी में ‘जब मैं ... कहूँ’ स्वाभाविक है और प्रसंग की काल-सापेक्षता बनाए रखता है।
- source_word: לָרָשָׁע / רָשָׁע
  choice: दुष्ट
  rationale: רָשָׁע किसी दुष्ट या दोषी व्यक्ति को सूचित करता है। ‘दुष्ट’ हिन्दी में संज्ञा की तरह स्वाभाविक है और पद में इसकी महत्त्वपूर्ण पुनरावृत्ति को सुरक्षित रखता है।
- source_word: מוֹת תָּמוּת
  choice: तू निश्चय मर जाएगा
  rationale: धातु के infinitive absolute और अपूर्ण क्रिया का संयोजन मृत्यु की निश्चितता पर बल देता है; ‘निश्चय’ उसी बल को सहज हिन्दी में व्यक्त करता है।
- source_word: הִזְהַרְתּוֹ / לְהַזְהִיר
  choice: उसे सावधान न करे / सावधान करने के लिए
  rationale: זהר का हिफ़ील रूप यहाँ किसी को आने वाले परिणाम के विषय में चेताना है। ‘सावधान करना’ स्पष्ट और वर्तमान हिन्दी में स्वाभाविक है; दोनों इब्रानी रूपों की पुनरावृत्ति भी बनी रहती है।
- source_word: מִדַּרְכּוֹ הָרְשָׁעָה
  choice: उसके दुष्ट मार्ग से
  rationale: דֶּרֶךְ आचरण का रूपक है। ‘मार्ग’ मूल बिंब बनाए रखता है और ‘दुष्ट’ רשע शब्द-समूह की पुनरावृत्ति को दर्शाता है।
- source_word: לְחַיֹּתוֹ
  choice: ताकि वह जीवित रहे
  rationale: यह उद्देश्य अथवा परिणाम व्यक्त करता है। अनुवाद जीवन को केवल शारीरिक या केवल आत्मिक अर्थ तक सीमित नहीं करता।
- source_word: בַּעֲוֺנוֹ
  choice: अपने अधर्म में
  rationale: ב परिस्थिति, अवस्था या कारण का बोध करा सकता है। ‘अपने अधर्म में’ मूल संरचना और उसकी अस्पष्टता सुरक्षित रखता है; कारणवाचक सम्भावना पादटिप्पणी में दी गई है।
- source_word: דָמוֹ
  choice: उसके खून
  rationale: ‘खून’ मूल के ठोस न्यायिक बिंब को बनाए रखता है; केवल ‘उसकी मृत्यु की ज़िम्मेदारी’ कहना रूपक को समतल कर देता।
- source_word: מִיָּדְךָ אֲבַקֵּשׁ
  choice: हिसाब मैं तेरे हाथ से माँगूँगा
  rationale: यह जवाबदेही का न्यायिक मुहावरा है। ‘तेरे हाथ से माँगूँगा’ मूल बिंब रखता है, जबकि ‘हिसाब’ हिन्दी पाठक के लिए मुहावरे का आशय स्पष्ट करता है।
theological_decisions:
- issue: मृत्यु और जीवन की प्रकृति
  choice: ‘मर जाएगा’ और ‘जीवित रहे’ को बिना अतिरिक्त व्याख्या के रखा गया है।
  alternative: इन्हें केवल शारीरिक मृत्यु/जीवन या केवल आत्मिक मृत्यु/जीवन कहना।
  rationale: इब्रानी पाठ स्वयं इस आयाम को सीमित नहीं करता; सीधा अनुवाद वाचा-संबंधी और नैतिक तनाव को सुरक्षित रखता है।
- issue: רָשָׁע का लिंग और व्यक्तिवाचक अर्थ
  choice: ‘दुष्ट’ के साथ एकवचन पुरुषवाचक क्रिया और सर्वनाम रखे गए हैं।
  alternative: ‘दुष्ट व्यक्ति’ जैसे लिंग-निरपेक्ष विस्तार का प्रयोग।
  rationale: मूल पाठ व्याकरणिक रूप से पुल्लिंग एकवचन है और एक व्यक्ति का उदाहरण प्रस्तुत करता है; हिन्दी का संज्ञात्मक ‘दुष्ट’ इसे स्वाभाविक ढंग से व्यक्त करता है।
- issue: पहरेदार की जवाबदेही
  choice: खून का हिसाब ‘तेरे हाथ से’ माँगने का न्यायिक बिंब बनाए रखा गया है।
  alternative: ‘मैं तुझे उसकी मृत्यु का दोषी ठहराऊँगा।’
  rationale: व्याख्यात्मक विकल्प अर्थ स्पष्ट करता है, पर मूल के रक्त और हाथ के रूपकों को मिटा देता है; इसलिए उसे पादटिप्पणी में रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। परमेश्वर और यहेजकेल के बीच एकवचन संबोधन के अनुरूप ‘तू/तेरे’ रखा गया है। ‘दुष्ट’, ‘अधर्म’, ‘मार्ग’ और ‘खून’ मूल के नैतिक तथा न्यायिक बिंबों को बनाए रखते हैं; वाक्य को हिन्दी में पठनीय बनाने के लिए सीमित रूप से ‘कुछ’ और ‘हिसाब’ जोड़े गए हैं।
