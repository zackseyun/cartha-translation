source:
  edition: WLC
  text: וּֽ/בְ/דַבְּרִ֤/י אֽוֹתְ/ךָ֙ אֶפְתַּ֣ח אֶת פִּ֔י/ךָ וְ/אָמַרְתָּ֣ אֲלֵי/הֶ֔ם כֹּ֥ה אָמַ֖ר אֲדֹנָ֣/י יְהֹוִ֑ה הַ/שֹּׁמֵ֤עַ יִשְׁמָע֙ וְ/הֶ/חָדֵ֣ל יֶחְדָּ֔ל כִּ֛י בֵּ֥ית מְרִ֖י הֵֽמָּה־׀׀׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/003/027.yaml
  text: 'But when I speak with you[a], I will open your mouth, and you shall say to them, ‘Thus says the Lord GOD: The one who hears, let him hear; and the one who refrains, let him refrain[b], for they are a rebellious house.’'
translation:
  language: hi
  text: 'परन्तु जब मैं तुमसे बात करूँगा, तब मैं तुम्हारा मुँह खोल दूँगा, और तुम उनसे कहना, ‘प्रभु याहवे यों कहता है: जो सुनता है, वह सुने; और जो विरत रहता है, वह विरत रहे[a], क्योंकि वे विद्रोही घराने के लोग हैं[b]।’'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जो सुनता है, वह सुनेगा; और जो विरत रहता है, वह विरत रहेगा।” इब्रानी क्रियारूप अनुमतिपरक/इच्छार्थक अथवा भविष्यसूचक—दोनों अर्थ दे सकते हैं।
    reason: alternative_reading
  - marker: b
    text: शाब्दिक रूप से, “वे विद्रोह का घराना हैं।” यह इस्राएल की हठीली बगावत के लिए यहेजकेल में बार-बार आने वाली अभिव्यक्ति है।
    reason: cultural_note
lexical_decisions:
- source_word: וּבְדַבְּרִי אוֹתְךָ
  choice: परन्तु जब मैं तुमसे बात करूँगा
  rationale: בְּ के साथ infinitive construct को कालवाचक ‘जब’ के रूप में लिया गया है। וּ को पिछले पद में लगाए गए मौन के विपरीत स्थिति दिखाने के लिए ‘परन्तु’ किया गया; אֹתְךָ के लिए स्वाभाविक हिन्दी ‘तुमसे’ है।
- source_word: אֶפְתַּח אֶת־פִּיךָ
  choice: मैं तुम्हारा मुँह खोल दूँगा
  rationale: यह परमेश्वर द्वारा यहेजकेल को फिर से बोलने योग्य बनाने की प्रत्यक्ष और स्वाभाविक अभिव्यक्ति है।
- source_word: וְאָמַרְתָּ אֲלֵיהֶם
  choice: और तुम उनसे कहना
  rationale: पूर्ववर्ती भविष्यकालीन क्रिया के बाद यह आदेशात्मक/नियुक्ति का भाव रखता है; हिन्दी में ‘कहना’ भविष्यसूचक और आज्ञार्थक दोनों प्रवाह को स्वाभाविक रूप से व्यक्त करता है।
- source_word: כֹּה אָמַר אֲדֹנָי יְהוִה
  choice: प्रभु यहोवा यों कहता है
  rationale: मानक भविष्यद्वाणी-सूत्र की औपचारिकता रखी गई है और दोनों दिव्य पदों—אֲדֹנָי तथा יהוה—को स्पष्ट रूप से दर्शाया गया है।
- source_word: הַשֹּׁמֵעַ יִשְׁמָע
  choice: जो सुनता है, वह सुने
  rationale: participle और imperfect की समानधातुक संरचना तथा उसके अनुमतिपरक/इच्छार्थक बल को हिन्दी में निकटता से सुरक्षित रखा गया है।
- source_word: וְהֶחָדֵל יֶחְדָּל
  choice: और जो नहीं सुनता, वह न सुने
  rationale: חדל का मूल भाव रुकने या विरत रहने का है; प्रसंग में यह संदेश सुनने से विरत रहने को सूचित करता है। हिन्दी में शाब्दिक ‘जो रुकता है, वह रुके’ अस्पष्ट होता, इसलिए समानांतर वाक्य के निहित कर्म ‘सुनना’ को सामने लाया गया है।
- source_word: כִּי בֵּית מְרִי הֵמָּה
  choice: क्योंकि वे विद्रोही घराने के लोग हैं
  rationale: यहेजकेल में बार-बार आने वाले ‘विद्रोही घराने’ के रूपक को रखा गया है, जबकि ‘के लोग’ जोड़कर आधुनिक हिन्दी में यह स्पष्ट किया गया है कि संकेत समुदाय के सदस्यों की ओर है।
theological_decisions:
- issue: אֲדֹנָי יְהוִה में परमेश्वर के नाम का अनुवाद
  choice: प्रभु यहोवा
  alternative: प्रभु परमेश्वर / प्रभु याहवे
  rationale: ‘प्रभु’ אֲדֹנָי को और प्रचलित हिन्दी बाइबलीय रूप ‘यहोवा’ יהוה को अलग-अलग सुरक्षित रखता है; इससे दोनों पद एक में नहीं मिलते।
- issue: יִשְׁמָע और יֶחְדָּל का भाव
  choice: वह सुने ... वह न सुने
  alternative: वह सुनेगा ... वह नहीं सुनेगा
  rationale: दोनों imperfect रूप अनुमतिपरक/इच्छार्थक अथवा भविष्यसूचक समझे जा सकते हैं। मुख्य पाठ में समानांतर आज्ञार्थक-अनुमतिपरक बल रखा गया है और भविष्यसूचक संभावना को पादटिप्पणी में दिया गया है।
- issue: ‘न सुने’ से उत्पन्न नैतिक तनाव
  choice: पाठ की कठोर अनुमतिपरक भाषा को बनाए रखा
  alternative: जो सुनना नहीं चाहता, वह न सुने
  rationale: ‘नहीं चाहता’ जोड़ने से इच्छा का ऐसा तत्व आता जो इब्रानी में प्रत्यक्ष नहीं है। वचन सुनने और उससे विरत रहने के बीच मूल तनाव को बिना व्याख्यात्मक नरमी के रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण भविष्यद्वाणी-शैली अपनाई गई है। ‘यों कहता है’ और ‘विद्रोही घराना’ जैसे परिचित बाइबलीय पद रखे गए हैं, पर अत्यधिक पुरातन क्रियारूपों से बचा गया है। सभी पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित हैं।
