reference: Ezekiel 3:14
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/ר֥וּחַ נְשָׂאַ֖תְ/נִי וַ/תִּקָּחֵ֑/נִי וָ/אֵלֵ֥ךְ מַר֙ בַּ/חֲמַ֣ת רוּחִ֔/י וְ/יַד יְהוָ֥ה עָלַ֖/י חָזָֽקָה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/003/014.yaml
  text: And the Spirit lifted me up and took me away[a], and I went in bitterness, in the heat of my spirit[b], while the hand of Yahweh was strong upon me.
translation:
  language: hi
  text: और आत्मा ने मुझे ऊपर उठाया और ले गई[a]। मैं कड़वाहट में, अपनी आत्मा की तपिश में चला गया[b], और याहवे का हाथ मुझ पर प्रबल था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “किसी आत्मा ने मुझे ऊपर उठाया”; जिस इब्रानी शब्द का अनुवाद “आत्मा” किया गया है, उसका अर्थ “हवा” भी हो सकता है।
    reason: alternative_reading
  - marker: b
    text: “अपनी आत्मा की तपिश में” का अर्थ “अपनी आत्मा के रोष में” या “अपनी आत्मा के क्रोध में” भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרוּחַ
  choice: आत्मा
  rationale: रूअख का अर्थ ‘आत्मा’, ‘कोई आत्मा’ या ‘हवा’ हो सकता है। निकटवर्ती दर्शनीय और भविष्यसूचक संदर्भ में परमेश्वर के आत्मा का संकेत सबसे संगत है; फिर भी मूल की अस्पष्टता पादटिप्पणी में रखी गई है।
- source_word: נְשָׂאַתְנִי
  choice: मुझे ऊपर उठाया
  rationale: नसा में उठाने और ले चलने दोनों का भाव हो सकता है। यहाँ ठोस दर्शनीय गति को बनाए रखने के लिए ‘ऊपर उठाया’ स्वाभाविक है।
- source_word: וַתִּקָּחֵנִי
  choice: वहाँ से ले गया
  rationale: लाक़ख का मूल अर्थ ‘लेना’ है। पिछले क्रियापद के साथ यह स्थानांतरण बताता है; ‘वहाँ से’ हिन्दी में गमन का भाव स्पष्ट करता है, बिना ‘झपट लिया’ जैसी अनावश्यक कठोरता जोड़े।
- source_word: וָאֵלֵךְ
  choice: मैं ... चला गया
  rationale: हालख के सामान्य अर्थ ‘जाना/चलना’ को हिन्दी कथात्मक प्रवाह में स्वाभाविक रूप से व्यक्त करता है।
- source_word: מַר
  choice: अपने मन की कड़वाहट में
  rationale: यह विशेषण यहाँ भावावस्था को क्रियाविशेषणवत व्यक्त करता है। ‘कड़वाहट’ मूल बिंब को बनाए रखती है; ‘मन की’ हिन्दी में इसे भावात्मक अवस्था के रूप में स्पष्ट करती है।
- source_word: בַּחֲמַת רוּחִי
  choice: अपनी आत्मा की तीव्र उत्तेजना में
  rationale: खेमाह में गरमी, क्रोध, रोष या तीव्र आवेग का भाव है। ‘तीव्र उत्तेजना’ आंतरिक उथल-पुथल को स्वाभाविक हिन्दी में रखती है, जबकि क्रोध की संभावित धारणा पादटिप्पणी में सुरक्षित है।
- source_word: רוּחִי
  choice: अपनी आत्मा
  rationale: ‘मेरी आत्मा’ यहेजकेल की भीतरी दशा को सूचित करती है और पहले आए रूअख के साथ शब्दगत पुनरावृत्ति को बनाए रखती है।
- source_word: וְיַד יְהוָה עָלַי חָזָקָה
  choice: और यहोवा का हाथ मुझ पर प्रबल था
  rationale: ‘यहोवा का हाथ’ भविष्यसूचक सामर्थ्य या बाध्यकारी प्रभाव का पारंपरिक बिंब है और इसे परिभाषित करने के बजाय ज्यों का त्यों रखा गया है। ‘प्रबल था’ חָזָקָה की शक्ति व्यक्त करता है।
theological_decisions:
- issue: आरंभिक רוּחַ का संदर्भ
  choice: परमेश्वर का आत्मा, मुख्य पाठ में ‘आत्मा’
  alternative: कोई आत्मा; हवा
  rationale: आसपास का संदर्भ दर्शनीय ढंग से भविष्यद्वक्ता को उठाकर ले जाए जाने का है, इसलिए दैवी आत्मा सबसे संगत है। हिन्दी में ‘आत्मा’ को आदरसूचक/निश्चित प्रयोग के रूप में रखा गया है, पर अन्य वास्तविक संभावनाएँ पादटिप्पणी में दी गई हैं।
- issue: יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: मूल में निजी वाचा-नाम है। आधुनिक हिन्दी बाइबलीय पाठकों के लिए परिचित लिप्यंतरण ‘यहोवा’ चुना गया है, न कि उसे उपाधि ‘प्रभु’ से बदलना।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य रखी गई है। ‘आत्मा’ की पुनरावृत्ति और ‘यहोवा का हाथ’ जैसे मूल बिंब सुरक्षित हैं। भावात्मक पदबंध को हिन्दी में स्वाभाविक बनाने के लिए ‘मन की कड़वाहट’ और ‘तीव्र उत्तेजना’ प्रयुक्त हुए हैं; संभावित क्रोधार्थ पादटिप्पणी में दिया गया है।
