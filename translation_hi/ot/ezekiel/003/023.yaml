  register: आधुनिक मानक हिन्दी, गरिमापूर्ण पर सहज कथात्मक शैली। ‘और देखो’ ने भविष्यद्वाणी-वृत्तांत की सजीवता बनाए रखी है। छोटे वाक्यों और विराम-चिह्नों से दृश्य का क्रम स्पष्ट किया गया है।
