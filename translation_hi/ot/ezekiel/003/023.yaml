- source_word: וָאֶפֹּל עַל פָּנָי
  choice: तब मैं मुँह के बल गिर पड़ा
  rationale: मूल शारीरिक मुद्रा और दिव्य महिमा के सामने दंडवत् होने का भाव, बिना अतिरिक्त व्याख्या के, सुरक्षित रहता है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल में ईश्वरीय व्यक्तिगत नाम सीधे आया है। उसे ‘प्रभु’ जैसी उपाधि से बदलने के बजाय हिन्दी पाठकों के लिए परिचित नामरूप ‘यहोवा’ रखा गया है; ‘याहवे’ भी संभावित लिप्यंतरण है।
- issue: כְּבוֹד יְהוָה का आशय
  choice: यहोवा की महिमा
  alternative: यहोवा का तेज
  rationale: ‘महिमा’ כָּבוֹד के धार्मिक और दर्शनीय भार को बनाए रखती है, जबकि ‘तेज’ अर्थ को केवल प्रकाशमान रूप की ओर संकुचित कर सकता है। पाठ यह स्पष्ट नहीं करता कि महिमा किस दृश्य रूप में खड़ी थी, इसलिए उस तनाव को अनसुलझा रखा गया है।
