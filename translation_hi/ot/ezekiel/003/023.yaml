base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/003/023.yaml
  text: So I arose and went out to the valley[a], and behold, the glory of Yahweh was standing there, like the glory that I had seen by the Kebar River; and I fell on my face.
translation:
  language: hi
  text: तब मैं उठा और निकलकर घाटी[a] में गया। और देखो, वहाँ याहवे की महिमा खड़ी थी—वैसी ही महिमा, जैसी मैंने कबार नदी के पास देखी थी। तब मैं मुँह के बल गिर पड़ा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘मैदान’ अथवा ‘समतल घाटी’; इब्रानी शब्द בִּקְעָה एक चौड़ी समतल निम्नभूमि को भी सूचित कर सकता है।
