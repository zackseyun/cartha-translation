base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/003/024.yaml
  text: Then the Spirit entered into me and set me on my feet[a], and he spoke to me and said to me, “Go[b], shut yourself inside your house.”
translation:
  language: hi
  text: तब आत्मा[a] मुझमें आया और उसने मुझे मेरे पैरों पर खड़ा कर दिया। फिर उसने मुझसे बात की और कहा, “जाओ[b], अपने घर के भीतर अपने आपको बंद कर लो।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “एक आत्मा मुझमें आया।”
    reason: alternative_reading
  - marker: b
    text: इब्रानी में शाब्दिक अर्थ “आओ” है। इस प्रसंग में हिन्दी में “जाओ” अधिक स्वाभाविक है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ר֔וּחַ
  choice: आत्मा
  rationale: यहेजकेल में नबी को सामर्थ्य देकर खड़ा करने के प्रसंग में यह शब्द परमेश्वर के आत्मा की ओर संकेत करता है। फिर भी इब्रानी में उपपद न होने के कारण ‘एक आत्मा’ की संभावना पाद-टिप्पणी में रखी गई है।
- source_word: וַ/תָּבֹא בִ֣/י
  choice: मुझमें आया
  rationale: בוא के साथ ב और व्यक्ति-वाचक कर्म भीतर प्रवेश करने का भाव देते हैं; यह अनुवाद इब्रानी अभिव्यक्ति को सीधे और स्वाभाविक ढंग से रखता है।
- source_word: וַ/תַּעֲמִדֵ֖/נִי עַל רַגְלָ֑/י
  choice: मुझे मेरे पैरों पर खड़ा कर दिया
  rationale: עמד का हिफ़ील रूप कारणवाचक है; यह हिन्दी में उसके अर्थ को स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
- source_word: וַ/יְדַבֵּ֤ר אֹתִ/י֙
  choice: उसने मुझसे बात की
  rationale: असामान्य אֵת-संरचना को ध्यान में रखते हुए ‘मुझसे बात की’ व्यक्तिगत संवाद का भाव बचाता है और आधुनिक हिन्दी में सहज है। इसके बाद का ‘कहा’ प्रत्यक्ष वचन का स्वाभाविक परिचय देता है।
- source_word: בֹּ֥א
  choice: जाओ
  rationale: शाब्दिक अर्थ ‘आओ’ है, पर यहाँ अपने घर के भीतर जाने की आज्ञा में हिन्दी प्रसंगानुसार ‘जाओ’ अधिक स्वाभाविक है; शाब्दिक विकल्प पाद-टिप्पणी में दिया गया है।
- source_word: הִסָּגֵ֖ר
  choice: अपने आपको बंद कर लो
  rationale: निफ़अल आज्ञार्थक रूप यहाँ आत्मवाचक/भाववाचक अर्थ रखता है और स्वयं को भीतर बंद कर लेने की आज्ञा देता है।
- source_word: בְּ/ת֥וֹךְ בֵּיתֶֽ/ךָ
  choice: अपने घर के भीतर
  rationale: בְּתוֹךְ का स्थानवाचक अर्थ यहाँ घर के अंदर रहना है; ‘घर के भीतर’ सटीक और सहज हिन्दी है।
theological_decisions:
- issue: רוּחַ की पहचान
  choice: ‘आत्मा’ को प्रसंग में परमेश्वर का आत्मा समझना
  alternative: ‘एक आत्मा’
  rationale: निकटवर्ती प्रसंग में आत्मा यहेजकेल को नबूवत की सेवा के लिए सामर्थ्य देकर खड़ा करता है, इसलिए निश्चित संदर्भ अधिक उपयुक्त है। फिर भी मूल में उपपद नहीं है, अतः वैकल्पिक समझ को दबाया नहीं गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सरल शैली रखी गई है। ‘मेरे पैरों पर खड़ा कर दिया’ कारणवाचक मूल को स्पष्ट करता है, और आज्ञा के लिए आदरसूचक बहुवचन के बजाय सामान्य एकवचन ‘जाओ/कर लो’ मूल के एकवचन संबोधन के अनुरूप है।
