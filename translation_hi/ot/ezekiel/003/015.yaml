  text: וָ/אָב֨וֹא אֶל הַ/גּוֹלָ֜ה תֵּ֣ל אָ֠בִיב הַ/יֹּשְׁבִ֤ים אֶֽל נְהַר כְּבָר֙ ו/אשר הֵ֖מָּה יוֹשְׁבִ֣ים שָׁ֑ם וָ/אֵשֵׁ֥ב שָׁ֛ם שִׁבְעַ֥ת יָמִ֖ים מַשְׁמִ֥ים בְּ/תוֹכָֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/003/015.yaml
  text: Then I came to the exiles at Tel-abib[a], who were living by the Kebar River, where they were living; and I sat there among them for seven days, appalled.
translation:
  language: hi
  text: तब मैं तेल-अबीब में रहनेवाले निर्वासितों के पास आया, जो केबार नदी के किनारे बसे हुए थे—वहीं जहाँ वे रहते थे। और मैं वहाँ, उनके बीच, सात दिन तक स्तब्ध[a] बैठा रहा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘सन्न’ अथवा ‘व्यथित’। इब्रानी शब्द गहरे आघात या उजाड़ देने वाली घटना से उत्पन्न स्तब्धता की दशा व्यक्त करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הַגּוֹלָה
  choice: निर्वासित लोग
  rationale: यह अमूर्त निर्वासन की अवस्था नहीं, बल्कि निर्वासन में रह रहे समुदाय को सूचित करता है। ‘निर्वासित लोग’ आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: תֵּל אָבִיב
  choice: तेल-अबीब
  rationale: प्राचीन स्थान-नाम का लिप्यंतरण किया गया है। ‘अबीब’ आधुनिक तेल अवीव नगर से भेद बनाए रखता है।
- source_word: הַיֹּשְׁבִים אֶל נְהַר כְּבָר
  choice: जो कबार नदी के किनारे बसे हुए थे
  rationale: יֹשְׁבִים यहाँ स्थायी निवास का बोध देता है; ‘बसे हुए थे’ हिन्दी में इस अर्थ को सहजता से व्यक्त करता है। אֶל का स्थानीय अर्थ ‘किनारे’ से दिया गया है।
- source_word: ו/אשר הֵמָּה יוֹשְׁבִים שָׁם
  choice: वहीं जहाँ वे रहते थे
  rationale: इब्रानी वाक्यांश की कठिन, पुनरुक्त संरचना को मिटाए बिना हिन्दी में बोधगम्य बनाया गया है। पाठ में न होने के कारण ‘मैंने देखा’ जैसा अर्थ नहीं जोड़ा गया।
- source_word: וָאֵשֵׁב שָׁם
  choice: मैं ... बैठा रहा
  rationale: मूल क्रिया का ठोस अर्थ ‘बैठना’ सुरक्षित है, जबकि ‘रहा’ सात दिनों की अवधि को स्वाभाविक हिन्दी में जोड़ता है।
- source_word: שִׁבְעַת יָמִים
  choice: सात दिन तक
  rationale: अवधि व्यक्त करने का सहज आधुनिक हिन्दी रूप।
- source_word: מַשְׁמִים
  choice: स्तब्ध
  rationale: यह शब्द आघात, उजाड़पन या भयावह अनुभव से उत्पन्न अवाक् और सुन्न दशा दर्शा सकता है। ‘स्तब्ध’ इस संदर्भ में भावात्मक आघात और मौन दोनों को संक्षेप में व्यक्त करता है।
- source_word: בְּתוֹכָם
  choice: उनके बीच
  rationale: समुदाय के मध्य शारीरिक उपस्थिति को व्यक्त करने वाला स्वाभाविक हिन्दी प्रयोग।
