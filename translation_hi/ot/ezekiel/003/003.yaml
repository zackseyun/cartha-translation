  text: And he said to me[a], “Son of man, feed your belly and fill your inward parts with this scroll that I am giving you.” So I ate it, and it was in my mouth as sweet as honey.
translation:
  language: hi
  text: तब उसने मुझसे कहा, “हे मनुष्य के पुत्र,[a] इस लपेटी हुई पुस्तक को खा, जो मैं तुझे दे रहा हूँ; और अपने पेट और अपने भीतर को इससे भर ले।” तब मैंने उसे खाया, और वह मेरे मुँह में शहद के समान मीठी थी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “मानव-पुत्र।” इब्रानी मुहावरे “मनुष्य के पुत्र” को यहाँ बनाए रखा गया है, क्योंकि यह यहेजकेल के लिए बार-बार प्रयुक्त संबोधन है।
    reason: lexical_alternative
