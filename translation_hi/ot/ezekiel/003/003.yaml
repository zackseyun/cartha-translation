- source_word: וַתְּהִי בְּפִי
  choice: वह मेरे मुँह में ... था
  rationale: मूल पाठ की स्वाद-संबंधी देहगत अनुभूति और वाक्य-संरचना को सहज हिन्दी में रखता है।
- source_word: כִּדְבַשׁ לְמָתוֹק
  choice: शहद के समान मीठा
  rationale: ‘मिठास के लिए शहद के समान’ का स्वाभाविक हिन्दी मुहावरेदार समतुल्य है।
