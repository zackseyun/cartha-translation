  yaml_path: translation/ot/ezekiel/019/011.yaml
  text: And she had strong branches for rulers’ scepters[a], and its stature rose high among the thick boughs; it was seen in its height, in the abundance of its branches.
translation:
  language: hi
  text: और उसमें मजबूत डालियाँ थीं, जो शासकों के राजदंडों के योग्य थीं; उसकी ऊँचाई घनी डालियों के बीच ऊँची उठी[a], और वह अपनी ऊँचाई और अपनी शाखाओं की बहुतायत में दिखाई देती थी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “बादलों के ऊपर।” इब्रानी शब्द का अर्थ घनी डालियाँ या घनी वृद्धि हो सकता है; बेल के रूपक में यह अर्थ अधिक उपयुक्त प्रतीत होता है, यद्यपि पारंपरिक “बादलों” वाला अर्थ भी संभव है।
    reason: lexical_alternative
lexical_decisions:
- source_word: מַטּוֹת עֹז
  choice: मजबूत डालियाँ
  rationale: מַטּוֹת का अर्थ छड़ें, दंड या डालियाँ हो सकता है। अंगूर की बेल के रूपक में ‘डालियाँ’ वनस्पति-चित्र को बनाए रखता है, और עֹז उनकी शक्ति व्यक्त करता है।
- source_word: אֶל שִׁבְטֵי מֹשְׁלִים
  choice: जो शासकों के राजदंड बनने योग्य थीं
  rationale: שִׁבְטֵי यहाँ शासकों के संदर्भ में राजकीय ‘राजदंड’ को सूचित करता है। אֶל को इस काव्यात्मक प्रयोग में योग्यता या प्रयोजन के अर्थ में स्वाभाविक हिन्दी में व्यक्त किया गया है।
- source_word: וַתִּגְבַּהּ קוֹמָתוֹ
  choice: उसकी ऊँचाई ... बहुत बढ़ गई
  rationale: यह वाक्यांश बेल के ऊँचे उठने को व्यक्त करता है। हिन्दी में ‘ऊँचाई बहुत बढ़ गई’ स्पष्ट और स्वाभाविक है तथा किसी अधिक विशिष्ट वनस्पति-अर्थ को आरोपित नहीं करता।
- source_word: עַל בֵּין עֲבֹתִים
  choice: घनी डालियों के बीच
  rationale: עֲבֹתִים घनी वृद्धि, पत्तियों या मोटी डालियों को सूचित कर सकता है। बेल के निकट संदर्भ में ‘घनी डालियों’ का अर्थ बादलों की अपेक्षा अधिक संगत है; पाठ में עַל בֵּין की असामान्य संरचना को सहज हिन्दी में ‘के बीच’ कहा गया है।
- source_word: וַיֵּרָא
  choice: दूर से दिखाई देती थी
  rationale: निफ़अल रूप का मूल भाव ‘दिखाई देना’ है। ऊँचाई और शाखाओं की बहुतायत के कारण उसकी विशिष्ट दृश्यता स्पष्ट करने के लिए ‘दूर से’ प्रयोग किया गया है।
- source_word: בְגָבְהוֹ
  choice: अपनी ऊँचाई ... के कारण
  rationale: यहाँ בְ को कारण या दृश्यता की विशेषता बताने वाला माना गया है; ‘के कारण’ स्वाभाविक हिन्दी में संबंध स्पष्ट करता है।
- source_word: בְּרֹב דָּלִיֹּתָיו
  choice: अपनी बहुत-सी शाखाओं के कारण
  rationale: רֹב बहुतायत और דָּלִיּוֹת फैली या लटकती शाखाओं को व्यक्त करता है। ‘बहुत-सी शाखाएँ’ आधुनिक हिन्दी में स्पष्ट है और बेल के रूपक को बनाए रखता है।
