source:
  edition: WLC
  text: וַ/תַּ֛עַל אֶחָ֥ד מִ/גֻּרֶ֖י/הָ כְּפִ֣יר הָיָ֑ה וַ/יִּלְמַ֥ד לִ/טְרָף טֶ֖רֶף אָדָ֥ם אָכָֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/019/003.yaml
  text: She brought up one of her cubs; he became a young lion[a], and he learned to tear prey; he devoured people.
translation:
  language: hi
  text: उसने अपने शावकों में से एक को पाला; वह जवान सिंह बन गया। उसने शिकार को फाड़ना सीखा; वह मनुष्यों[a] को खा गया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में यहाँ “मनुष्य” एकवचन है; इसका अनुवाद “वह मनुष्य को खा गया” भी हो सकता है।
    reason: मूल के व्याकरणिक एकवचन और उसके संभावित सामान्य अथवा व्यक्तिगत अर्थ को सुरक्षित रखना।
lexical_decisions:
- source_word: וַתַּעַל
  choice: उसने ... पाला
  rationale: עלה के हिफ़ील रूप का मूल भाव ‘ऊपर लाना/बड़ा करना’ है। सिंहनी और शावक के प्रसंग में ‘पाला’ स्वाभाविक हिन्दी में उसके बड़ा किए जाने का भाव व्यक्त करता है।
- source_word: אֶחָד מִגֻּרֶיהָ
  choice: अपने शावकों में से एक को
  rationale: גּוּר यहाँ सिंह के बच्चे को दर्शाता है; ‘शावक’ प्रसंगानुकूल और आधुनिक मानक हिन्दी में स्पष्ट है। ‘में से एक’ मूल के अंशवाचक निर्माण को सुरक्षित रखता है।
- source_word: כְּפִיר
  choice: जवान सिंह
  rationale: כְּפִיר ऐसे युवा सिंह को दर्शाता है जो अब शिकार करने की अवस्था में है; इसलिए केवल ‘शावक’ या सामान्य ‘सिंह’ की अपेक्षा ‘जवान सिंह’ अधिक सटीक है।
- source_word: הָיָה
  choice: बन गया
  rationale: विकासक्रम में पहले शावक और फिर जवान सिंह होने का भाव है; ‘बन गया’ इस प्रगति को स्वाभाविक रूप से व्यक्त करता है।
- source_word: וַיִּלְמַד לִטְרָף טֶרֶף
  choice: उसने शिकार को फाड़ना सीखा
  rationale: मूल में एक ही धातु से बने क्रिया और संज्ञा का प्रयोग शिकारी हिंसा पर बल देता है। ‘शिकार को फाड़ना’ इस चित्र को स्पष्ट और सजीव रखता है।
- source_word: אָדָם
  choice: मनुष्यों
  rationale: मूल में אָדָם व्याकरण की दृष्टि से एकवचन है, पर यहाँ मनुष्य जाति के सदस्यों को सामान्य रूप से दर्शाता है। स्वाभाविक हिन्दी में बहुवचन ‘मनुष्यों’ व्यापक अर्थ को स्पष्ट करता है; एकवचन रूप की सूचना पादटिप्पणी में दी गई है।
- source_word: אָכָל
  choice: खा गया
  rationale: सिंह के हिंसक भक्षण के प्रसंग में ‘खा गया’ स्वाभाविक और प्रबल हिन्दी अभिव्यक्ति है; यह मूल क्रिया के सीधे अर्थ को बनाए रखता है।
theological_decisions:
- issue: सामान्य अर्थ में प्रयुक्त एकवचन אָדָם का अनुवाद
  choice: मनुष्यों
  alternative: मनुष्य
  rationale: אָדָם एकवचन होते हुए भी यहाँ किसी एक निर्दिष्ट पुरुष के बजाय मनुष्यों को शिकार बनाने का व्यापक भाव दे सकता है। मुख्य पाठ में स्वाभाविक हिन्दी बहुवचन रखा गया है, जबकि मूल का एकवचन पादटिप्पणी में बताया गया है ताकि संभावित अर्थगत तनाव न मिटे।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘शावक’ से ‘जवान सिंह’ तक का विकासक्रम और शिकार का हिंसक चित्र स्पष्ट रखा गया है; अनावश्यक तकनीकी या सांप्रदायिक शब्दावली से बचा गया है।
