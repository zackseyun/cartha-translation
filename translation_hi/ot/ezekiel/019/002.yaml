base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/019/002.yaml
  text: and say[a], ‘What was your mother? A lioness. Among lions she lay down[b]; in the midst of young lions she reared her cubs.’
translation:
  language: hi
  text: और कहना, “तुम्हारी माँ क्या थी? एक सिंहनी! वह सिंहों[a] के बीच लेटी थी; जवान सिंहों के बीच उसने अपने शावकों को पाला-पोसा[b]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “सिंहनियों के बीच।” इब्रानी बहुवचन को सामान्य रूप से “सिंहों” के अर्थ में समझा जा सकता है, पर सिंहनी की स्त्रीलिंग छवि के अनुसार “सिंहनियों” भी अनुवाद किया जा सकता है।
    reason: lexical_alternative
  - marker: b
    text: या “बड़ा किया” अथवा “बढ़ाया।” इब्रानी क्रिया में बढ़ने या बढ़ाने का भाव हो सकता है, पर इस प्रसंग में संभवतः शावकों की परवरिश करना अभिप्रेत है।
    reason: lexical_alternative
lexical_decisions:
- source_word: מָה
