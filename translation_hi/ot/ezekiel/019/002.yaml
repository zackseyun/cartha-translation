  rationale: यहाँ प्रश्नवाचक बल को बनाए रखते हुए माँ की पहचान और प्रकृति के विषय में विलापपूर्ण अलंकारिक प्रश्न व्यक्त किया गया है।
- source_word: אִמְּךָ
  choice: तेरी माँ
  rationale: दूसरे पुरुष एकवचन के प्रत्यय को स्पष्ट रखा गया है; ‘माँ’ आधुनिक, स्वाभाविक और गरिमापूर्ण हिन्दी है।
- source_word: לְבִיָּא
  choice: एक सिंहनी
  rationale: इब्रानी संज्ञा स्त्रीलिंग है और मातृत्व के रूपक के लिए ‘सिंहनी’ आवश्यक है। ‘एक’ हिन्दी में उत्तर को स्वाभाविक बनाता है।
- source_word: בֵּין אֲרָיוֹת
  choice: सिंहों के बीच
  rationale: बहुवचन को सामान्य अर्थ में ‘सिंहों’ के रूप में रखा गया है; स्त्रीलिंग प्रसंग के कारण ‘सिंहनियों’ भी संभव है, जिसे पादटिप्पणी में दिया गया है।
- source_word: רָבָצָה
  choice: लेटी थी
  rationale: पशु के लेटने या दुबककर बैठने की मूल छवि को बिना अतिरिक्त भाव जोड़े सहज हिन्दी में व्यक्त करता है।
- source_word: בְּתוֹךְ כְּפִרִים
  choice: जवान सिंहों के बीच
  rationale: כְּפִיר दूध-पीते शावक के बजाय प्रायः युवा और बलवान सिंह को दर्शाता है; ‘जवान सिंह’ आधुनिक हिन्दी में स्पष्ट है।
- source_word: רִבְּתָה
  choice: पाला-पोसा
  rationale: अपने शावकों के साथ प्रयुक्त क्रिया यहाँ उनकी परवरिश करने का भाव देती है। ‘पाला-पोसा’ सहज हिन्दी में इस मातृ-संदर्भ को स्पष्ट करता है, जबकि वृद्धि कराने का अर्थ भी संभावित है।
- source_word: גוּרֶיהָ
  choice: अपने शावकों
  rationale: यह सिंहनी के बच्चों को दर्शाता है; ‘शावक’ सटीक और प्रचलित आधुनिक हिन्दी शब्द है। ‘अपने’ हिन्दी में कर्ता से संबंध स्वाभाविक रूप से व्यक्त करता है।
