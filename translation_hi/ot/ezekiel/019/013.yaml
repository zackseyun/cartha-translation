- source_word: וְעַתָּה
  choice: और अब
  rationale: संयोजक और कालवाचक क्रियाविशेषण पिछले वर्णन से वर्तमान दशा की ओर संक्रमण दिखाते हैं; ‘और अब’ इस प्रवाह को बनाए रखता है।
- source_word: שְׁתוּלָה
  choice: रोपी हुई है
  rationale: स्त्रीलिंग कर्मवाच्य कृदंत दाखलता के नए स्थान में रोपे होने की वर्तमान दशा बताता है। संदर्भ में स्थानांतरण निहित हो सकता है, पर रूप स्वयं सीधे ‘रोपी हुई’ कहता है।
- source_word: בַמִּדְבָּר
  choice: निर्जन प्रदेश में
  rationale: מִדְבָּר केवल रेतीले रेगिस्तान तक सीमित नहीं, बल्कि उजाड़ अथवा निर्जन भूभाग भी दर्शाता है; यह चयन निर्वासन और वीरानी की छवि को स्वाभाविक हिन्दी में रखता है।
- source_word: בְּאֶרֶץ
  choice: भूमि में
  rationale: यह स्थान का और अधिक वर्णन प्रस्तुत करता है। हिन्दी में ‘सूखी और प्यासी भूमि में’ स्वाभाविक है और अनिश्चित अर्थ को अनावश्यक रूप से निश्चित नहीं बनाता।
- source_word: צִיָּה
  choice: सूखी
  rationale: शब्द सूखे या जलहीन दशा को व्यक्त करता है; ‘सूखी’ स्पष्ट, आधुनिक और अगले विशेषण के साथ सहज है।
- source_word: וְצָמָא
  choice: और प्यासी
  rationale: मूल में ‘प्यास’ का संज्ञात्मक भाव है, पर भूमि के लिए ‘प्यासी’ उसका सजीव और संक्षिप्त रूपक सुरक्षित रखता है।
