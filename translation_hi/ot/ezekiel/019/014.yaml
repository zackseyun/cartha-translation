base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/019/014.yaml
  text: And fire went out from a branch of its limbs[a]; it consumed its fruit, and there was not in it a strong branch, a scepter to rule. This is a lamentation[b], and it has become a lamentation.
translation:
  language: hi
  text: 'और उसकी डालियों में से डाली[a] से आग निकली;

    उसने उसका फल भस्म कर दिया।


    उसमें कोई मज़बूत डाली न रही—

    शासन के लिए राजदंड बनने योग्य।


    यह विलापगीत है,

    और विलापगीत बन गया है।[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी शब्द מַטֶּה का अर्थ ‘डाली/शाखा’, ‘छड़ी’ या ‘दंड’ हो सकता है। यहाँ मुख्य पाठ बेल के चित्र के अनुसार ‘डाली’ कहता है, जबकि आगे ‘राजदंड’ उसके राजकीय अर्थ को सामने लाता है।
    reason: lexical_alternative
  - marker: b
    text: 'शाब्दिक रूप से: “यह विलाप है, और विलाप हो गया है।” अंतिम वाक्य विलापगीत को, या उसमें वर्णित दशा को, विलाप का विषय बता सकता है।'
    reason: ambiguity
lexical_decisions:
- source_word: וַתֵּצֵא אֵשׁ
  choice: आग निकली
  rationale: यह इब्रानी की सजीव क्रियात्मक प्रगति और ठोस अग्नि-चित्र को सहज आधुनिक हिन्दी में बनाए रखता है।
- source_word: מִמַּטֵּה בַדֶּיהָ
  choice: उसकी डालियों में से एक शाखा से
  rationale: बेल के रूपक में מַטֶּה को ‘शाखा’ और בַּדִּים को ‘डालियाँ’ कहना दोनों निकटवर्ती शब्दों में अंतर रखते हुए वनस्पति-चित्र स्पष्ट करता है। ‘एक’ हिन्दी में ‘में से’ की संरचना को स्वाभाविक बनाता है, यद्यपि इब्रानी में अनिश्चितता पृथक उपपद से व्यक्त नहीं है।
- source_word: פִּרְיָהּ אָכָלָה
  choice: उसने उसका फल भस्म कर दिया
  rationale: स्त्रीलिंग क्रिया का कर्ता ‘आग’ है। ‘भस्म कर दिया’ हिन्दी में आग द्वारा पूरी तरह नष्ट किए जाने का स्वाभाविक और प्रबल वर्णन है।
- source_word: מַטֵּה עֹז
  choice: कोई मज़बूत शाखा
  rationale: बेल के प्रसंग में वनस्पति-संबंधी अर्थ प्रमुख है, पर साथ आने वाला ‘राजदंड’ राजकीय अर्थ को सामने लाता है।
- source_word: שֵׁבֶט לִמְשׁוֹל
  choice: शासन करने के लिए कोई राजदंड
  rationale: שֵׁבֶט यहाँ शासन-अधिकार का चिह्न है। यह अनुवाद राजकीय संकेत को स्पष्ट रखते हुए उद्देश्यसूचक לִמְשׁוֹל को भी व्यक्त करता है।
- source_word: קִינָה הִיא וַתְּהִי לְקִינָה
  choice: यह विलापगीत है, और विलापगीत बन गया है
  rationale: दोनों खंडों की पुनरावृत्ति और परिणामसूचक तनाव को बनाए रखा गया है; पहला रचना की विधा बताता है, जबकि दूसरा उसके वास्तविक विलाप बन जाने की परिणति को खुला रखता है।
theological_decisions:
- issue: बेल के रूपक में राजकीय अर्थ
  choice: מַטֶּה को बेल के प्रसंग में ‘शाखा’ और שֵׁבֶט को ‘राजदंड’ अनूदित किया गया है।
  alternative: दोनों को ‘छड़ी/दंड’ कहकर केवल राजकीय अर्थ उभारना, या दोनों को ‘शाखा’ कहकर केवल बेल का रूपक उभारना।
  rationale: मूल पाठ वनस्पति और राजसत्ता के चित्रों को जानबूझकर मिलाता है। चुना हुआ रूप दाऊदी शासक-वंश के संकेत को किसी एक रूपक में सीमित नहीं करता।
- issue: विलाप के अंतिम कथन का संदर्भ
  choice: ‘यह विलापगीत है, और विलापगीत बन गया है’ कहकर काव्य और उसकी विषय-वस्तु के बीच की संभावित द्विअर्थता खुली रखी गई है।
  alternative: स्पष्ट रूप से केवल ‘यह कविता विलापगीत है’ या केवल ‘उसकी दशा विलाप का विषय बन गई’ कहना।
  rationale: इब्रानी में अंतिम स्त्रीलिंग कर्ता स्पष्ट रूप से दोहराया नहीं गया; इसलिए अनुवाद उस साहित्यिक और ऐतिहासिक तनाव को निर्णायक ढंग से नहीं सुलझाता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और काव्यात्मक रखी गई है। पंक्ति-विन्यास मूल विलाप की समानांतर संरचना दिखाता है। ‘विलापगीत’ साधारण पाठक के लिए ‘विलाप’ की साहित्यिक विधा स्पष्ट करता है; ‘राजदंड’ राजकीय संकेत को बिना अतिरिक्त व्याख्या के संप्रेषित करता है।
