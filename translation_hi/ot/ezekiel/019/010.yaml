  text: אִמְּ/ךָ֥ כַ/גֶּ֛פֶן בְּ/דָמְ/ךָ֖ עַל מַ֣יִם שְׁתוּלָ֑ה פֹּֽרִיָּה֙ וַֽ/עֲנֵפָ֔ה הָיְתָ֖ה מִ/מַּ֥יִם רַבִּֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/019/010.yaml
  text: Your mother was like a vine in your vineyard[a], planted by waters; she was fruitful and full of branches because of abundant waters.
translation:
  language: hi
  text: तेरी माँ तेरे रक्त में[a], जल के पास रोपी हुई दाखलता के समान थी; वह बहुत जल के कारण फलवती और शाखाओं से भरी हुई थी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक अर्थ “तेरे रक्त में” है; यह वाक्यांश कठिन है। कुछ इसे “तेरी समानता में” या पाठ-संशोधन के आधार पर “तेरी दाखबारी में” समझते हैं।
    reason: alternative_reading
lexical_decisions:
- source_word: אִמְּךָ
  choice: तेरी माँ
  rationale: मूल पाठ के सीधे संबंधसूचक रूप को रखा गया है। संदर्भ में माँ राजघराने या राष्ट्र की काव्यात्मक छवि हो सकती है, पर मुख्य पाठ में उसका अर्थ खोलकर नहीं जोड़ा गया।
- source_word: כַגֶּפֶן
  choice: दाखलता के समान
  rationale: כ तुलना सूचित करता है और גפן अंगूर की बेल है; यह पद हिंदी में काव्यात्मक उपमा को स्वाभाविक रूप से बनाए रखता है।
- source_word: בְּדָמְךָ
  choice: तेरे रक्त में
  rationale: मसोरेटी व्यंजन-पाठ का सबसे सीधा अर्थ यही है। वाक्यांश कठिन और अस्पष्ट है, इसलिए उसे मुख्य पाठ में बनाए रखते हुए अन्य प्रस्तावित पाठ पादटिप्पणी में दिए गए हैं।
- source_word: עַל מַיִם שְׁתוּלָה
  choice: जल के पास रोपी हुई
  rationale: चित्र एक ऐसे स्थान का है जहाँ बेल को जलस्रोत के निकट रोपा गया है। हिंदी में एकवचन सामूहिक 'जल' स्वाभाविक है।
- source_word: פֹּרִיָּה
  choice: फलवन्त
  rationale: विशेषण बेल की फल उत्पन्न करने की भरपूरी व्यक्त करता है; 'फलवन्त' संक्षिप्त, प्रतिष्ठित और स्पष्ट है।
- source_word: וַעֲנֵפָה
  choice: शाखाओं से भरी हुई
  rationale: हिंदी में स्रोत के विशेषण का सहज एक-शब्दीय समानार्थक नहीं है; यह वाक्यांश शाखाओं की बहुतायत स्पष्ट करता है।
- source_word: מִמַּיִם רַבִּים
  choice: बहुत जल के कारण
  rationale: 'מן को यहाँ स्रोत अथवा कारण के अर्थ में समझा गया है: भरपूर जल के कारण बेल फलवन्त और शाखायुक्त हुई।'
theological_decisions:
- issue: दुर्बोध वाक्यांश בְּדָמְךָ का निर्वाह
  choice: मुख्य पाठ में 'तेरे रक्त में' रखकर कठिन मसोरेटी पाठ को सुरक्षित रखा गया।
  alternative: '''तेरी समानता में'' या ''तेरी दाखबारी में'' पढ़ना।'
  rationale: यह मुख्यतः पाठालोचन और शब्दार्थ की समस्या है, कोई सिद्धान्तगत प्रश्न नहीं। अस्पष्टता को चुपचाप सुधारने के बजाय मूल पाठ का तनाव रखा गया और विकल्प पादटिप्पणी में बताए गए।
translation_notes:
  register: आधुनिक मानक हिंदी में काव्यात्मक और गरिमापूर्ण शैली रखी गई है। एकवचन संबोधन के लिए 'तेरी' प्रयुक्त है, जो इब्रानी के एकवचन रूप को स्पष्ट करता है। दुर्बोध मूल वाक्यांश को सहज बनाने के लिए मुख्य पाठ में बदला नहीं गया।
