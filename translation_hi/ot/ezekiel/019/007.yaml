base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/019/007.yaml
  text: He knew their widows[a], and he laid waste their cities; the land and its fullness was desolated by the sound of his roaring.
translation:
  language: hi
  text: उसने उनकी विधवाओं को जाना[a] और उनके नगर उजाड़ दिए; उसकी दहाड़ से देश और उसमें जो कुछ था, उजड़ गया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शब्दशः, ‘उसने उसकी विधवाओं को जाना।’ यहाँ ‘जाना’ में शत्रुतापूर्ण या यौन आशय हो सकता है; इसलिए कुछ व्याख्याकार इसे स्त्रियों के साथ दुर्व्यवहार के अर्थ में समझते हैं। एक वैकल्पिक पाठ के अनुसार अनुवाद हो सकता है, ‘उसने उनके महल नष्ट किए।’
    reason: कठिन इब्रानी पदबंध की शब्दार्थगत और पाठालोचनात्मक अस्पष्टता स्पष्ट करना।
lexical_decisions:
- source_word: וַיֵּדַע
  choice: जाना
  rationale: ידע का सामान्य अर्थ ‘जानना’ है, पर यह यौन संबंध का शिष्टोक्तिपूर्ण संकेत भी हो सकता है। हिंसक सिंह-रूपक में वाक्य कठिन है; ‘जाना’ मूल शब्दावली और उसकी अस्पष्टता को बनाए रखता है।
- source_word: אַלְמְנוֹתָיו
  choice: उनकी विधवाओं
  rationale: मसोरेटिक पाठ का प्रत्यय शब्दशः ‘उसकी विधवाओं’ है, किंतु अगले पदबंध ‘उनके नगर’ और पीड़ितों के संदर्भ के कारण यहाँ ‘उनकी विधवाओं’ अर्थानुकूल है। पाठ की कठिनाई और ‘महलों’ वाले वैकल्पिक पाठ को पादटिप्पणी में रखा गया है।
- source_word: וְעָרֵיהֶם הֶחֱרִיב
  choice: और उनके नगर उजाड़ दिए
  rationale: החריב नगरों को नष्ट या उजाड़ देने का बोध कराता है; ‘उजाड़ दिए’ काव्यात्मक विलाप और विनाश के दृश्य, दोनों के अनुकूल है।
- source_word: וַתֵּשַׁם
  choice: उजड़ गया
  rationale: שמם यहाँ उजाड़ हो जाने की परिणति व्यक्त करता है। हिंदी में संयुक्त भाव ‘देश और उसमें जो कुछ था’ के साथ एक समग्र इकाई मानकर एकवचन स्वाभाविक है।
- source_word: אֶרֶץ וּמְלֹאָהּ
  choice: देश और उसमें जो कुछ था
  rationale: यह मुहावरा देश और उसकी समस्त सामग्री या निवासियों को समेटता है। यह हिंदी रूप मूल अर्थ को सामान्य पाठक के लिए स्पष्ट करता है।
- source_word: מִקּוֹל שַׁאֲגָתוֹ
  choice: उसकी दहाड़ की आवाज़ से
  rationale: מן यहाँ कारण या स्रोत बताता है; यह रूप सिंह की दहाड़ के विनाशकारी प्रभाव को सीधे व्यक्त करता है।
theological_decisions:
- issue: रूपकात्मक न्याय-वाणी में कठिन पदबंध אַלְמְנוֹתָיו का अनुवाद
  choice: मुख्य पाठ में ‘विधवाओं’ को बनाए रखते हुए संदर्भानुसार ‘उनकी’ कहना और अस्पष्टता पादटिप्पणी में बताना
  alternative: ‘उसकी विधवाओं’ अथवा वैकल्पिक पाठ के आधार पर ‘उसके महलों’
  rationale: यह मुख्यतः शब्दार्थ और पाठालोचन की समस्या है, कोई सांप्रदायिक सिद्धांत नहीं। मुख्य पाठ मसोरेटिक ‘विधवाओं’ से जुड़ा रहता है, जबकि सर्वनाम की शाब्दिक कठिनाई और ‘महलों’ वाला वैकल्पिक पाठ पारदर्शी रूप से दर्ज किए जाते हैं।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘जाना’ जानबूझकर कुछ असामान्य है ताकि मूल इब्रानी की वास्तविक अस्पष्टता मिटे नहीं; पादटिप्पणी पाठक को संभावित अर्थ समझाती है।
