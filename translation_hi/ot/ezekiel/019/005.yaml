  text: וַ/תֵּ֨רֶא֙ כִּ֣י נֽוֹחֲלָ֔ה אָבְדָ֖ה תִּקְוָתָ֑/הּ וַ/תִּקַּ֛ח אֶחָ֥ד מִ/גֻּרֶ֖י/הָ כְּפִ֥יר שָׂמָֽתְ/הוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/019/005.yaml
  text: When she saw that she had waited in vain[a], that her hope was lost, she took one of her cubs and made him a young lion.
translation:
  language: hi
  text: जब उसने देखा कि उसकी प्रतीक्षा व्यर्थ गई[a] और उसकी आशा मिट गई, तब उसने अपने शावकों में से एक को लिया और उसे जवान सिंह बनाया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “वह निर्बल हो गई” अथवा “वह निराश हो गई।” इब्रानी शब्द कठिन है; मुख्य पाठ संदर्भ के अनुसार निष्फल प्रतीक्षा का भाव व्यक्त करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּרֶא כִּי
  choice: जब उसने देखा कि
  rationale: वाव-क्रम कथा को आगे बढ़ाता है और כִּי यहाँ देखी गई बात की विषय-वस्तु प्रस्तुत करता है; इसलिए यह सहज कालवाचक और आशयवाचक अनुवाद है।
- source_word: נוֹחֲלָה
  choice: उसकी प्रतीक्षा व्यर्थ गई
  rationale: यह इब्रानी रूप कठिन और अर्थ की दृष्टि से अनिश्चित है। अगले वाक्यांश ‘उसकी आशा मिट गई’ के संदर्भ में निष्फल प्रतीक्षा का भाव सबसे उपयुक्त है, जबकि वैकल्पिक अर्थ पाद-टिप्पणी में सुरक्षित रखे गए हैं।
- source_word: אָבְדָה תִּקְוָתָהּ
  choice: उसकी आशा मिट गई
  rationale: यह आशा के समाप्त हो जाने का स्वाभाविक और भावपूर्ण हिन्दी रूप है।
- source_word: וַתִּקַּח אֶחָד מִגֻּרֶיהָ
  choice: उसने अपने शावकों में से एक को लिया
  rationale: גּוּר सिंहनी के रूपक में सिंह-शावक को दर्शाता है; ‘शावक’ आधुनिक हिन्दी में स्पष्ट और सटीक है।
- source_word: כְּפִיר
  choice: जवान सिंह
  rationale: כְּפִיר सामान्य सिंह नहीं, बल्कि युवा सिंह को सूचित करता है; ‘जवान सिंह’ यह भेद बनाए रखता है।
- source_word: שָׂמָתְהוּ
  choice: उसे ... बनाया
  rationale: ‘रखना/स्थापित करना’ अर्थ वाला यह क्रियापद यहाँ किसी को जवान सिंह के रूप में तैयार या स्थापित करने का मुहावरेदार भाव देता है।
