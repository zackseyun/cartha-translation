base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/019/008.yaml
  text: Then nations from the provinces set themselves against him all around[a], and they spread their net over him[b]; he was caught in their pit.
translation:
  language: hi
  text: तब चारों ओर के प्रान्तों से राष्ट्र उसके विरुद्ध आ खड़े हुए[a]। उन्होंने उस पर अपना जाल फैलाया, और वह उनके गड्ढे[b] में पकड़ा गया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तब प्रान्तों से आए राष्ट्र चारों ओर से उसके विरुद्ध आ खड़े हुए।” इब्रानी में “चारों ओर” का संबंध “राष्ट्रों” अथवा उनके विरुद्ध आने की कार्रवाई से हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: यह सम्भवतः शिकार को फँसाने के लिए बनाया गया गड्ढा था।
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּתְּנוּ עָלָיו
  choice: उसके विरुद्ध आ खड़े हुए
  rationale: यह इब्रानी मुहावरा किसी के विरुद्ध होकर उस पर चढ़ आने की शत्रुतापूर्ण कार्रवाई व्यक्त करता है। यह हिन्दी में स्वाभाविक है और शाब्दिक रूप से अस्पष्ट ‘उस पर रखा’ से बचता है।
- source_word: גּוֹיִם
  choice: राष्ट्र
  rationale: यहाँ विदेशी राजनीतिक शक्तियाँ अभिप्रेत हैं। ‘राष्ट्र’ आधुनिक हिन्दी में उपयुक्त है और अनावश्यक इस्राएली/गैर-इस्राएली धार्मिक भेद नहीं जोड़ता।
- source_word: סָבִיב מִמְּדִינוֹת
  choice: आस-पास के प्रान्तों से
  rationale: यह अनुवाद घेरे जाने की छवि और प्रशासनिक क्षेत्रों से आने का भाव दोनों रखता है। इब्रानी में ‘चारों ओर’ का संबंध क्रिया से भी समझा जा सकता है; इसे पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: וַיִּפְרְשׂוּ עָלָיו רִשְׁתָּם
  choice: उन्होंने उस पर अपना जाल फैलाया
  rationale: ‘फैलाया’ क्रिया और ‘जाल’ संज्ञा सिंह के शिकार का रूपक सीधे और सजीव रूप में बनाए रखते हैं।
- source_word: בְּשַׁחְתָּם
  choice: उनके गड्ढे में
  rationale: שַׁחַת गड्ढे को दर्शाता है, जो इस प्रसंग में शिकार फँसाने के लिए बनाया गया गड्ढा है। मुख्य पाठ में संक्षिप्त और स्वाभाविक शब्द रखा गया है।
- source_word: נִתְפָּשׂ
  choice: पकड़ा गया
  rationale: यह निष्क्रिय क्रिया शिकार के पकड़े जाने का भाव देती है और रूपक के अनुकूल है।
