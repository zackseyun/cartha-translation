  text: וַ/יִּתְהַלֵּ֥ךְ בְּ/תוֹךְ אֲרָי֖וֹת כְּפִ֣יר הָיָ֑ה וַ/יִּלְמַ֥ד לִ/טְרָף טֶ֖רֶף אָדָ֥ם אָכָֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/019/006.yaml
  text: He prowled among the lions; he became a young lion[a]. He learned to tear prey; he devoured men.
translation:
  language: hi
  text: 'वह सिंहों के बीच घूमता-फिरता रहा;

    वह एक जवान सिंह बन गया।

    उसने शिकार को फाड़ना सीखा;

    वह मनुष्यों को खा गया।[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से ‘मनुष्य’ एकवचन है; यहाँ उसका अर्थ सामूहिक रूप से ‘मनुष्यों’ या ‘लोगों’ से हो सकता है।
    reason: אָדָם के व्याकरणिक एकवचन और सन्दर्भगत सामूहिक अर्थ को सुरक्षित रखना।
lexical_decisions:
- source_word: וַיִּתְהַלֵּךְ
  choice: घूमता-फिरता रहा
  rationale: हित्पएल रूप यहाँ सिंहों के बीच लगातार या बार-बार घूमने का भाव देता है। यह अनुवाद मूल की गति को स्वाभाविक हिन्दी में व्यक्त करता है, बिना चुपके चलने का अतिरिक्त भाव जोड़े।
- source_word: בְּתוֹךְ אֲרָיוֹת
  choice: सिंहों के बीच
  rationale: בְּתוֹךְ का अर्थ ‘बीच में/के बीच’ है; यह रूपक को स्पष्ट और सहज रखता है।
- source_word: כְּפִיר
  choice: जवान सिंह
  rationale: यह शब्द छोटे शावक के बजाय बलवान, युवा सिंह को सूचित करता है।
- source_word: הָיָה
  choice: बन गया
  rationale: काव्यात्मक क्रम में यह विकास या अवस्था-परिवर्तन को दर्शाता है, इसलिए केवल ‘था’ की अपेक्षा ‘बन गया’ उपयुक्त है।
- source_word: וַיִּלְמַד
  choice: उसने ... सीखा
  rationale: क्रिया का सीधा अर्थ ‘सीखना’ है; मूल पाठ किसी बाहरी प्रशिक्षक का उल्लेख नहीं करता।
- source_word: לִטְרָף טֶרֶף
  choice: शिकार को फाड़ना
  rationale: धातु और उसी मूल से बने संज्ञा-पद का मेल हिंसक शिकारी क्रिया पर बल देता है; हिन्दी में यह सिंह-रूपक की तीव्रता बनाए रखता है।
- source_word: אָדָם
  choice: मनुष्यों
  rationale: इब्रानी में एकवचन रूप यहाँ सामूहिक अर्थ में प्रयुक्त हो सकता है। सन्दर्भ में बहुवचन हिन्दी अधिक स्वाभाविक है और अनेक लोगों को भक्ष्य बनाने का आशय स्पष्ट करता है।
- source_word: אָכָל
  choice: खा गया
  rationale: क्रिया का मूल अर्थ ‘खाना’ है। सिंह के रूपक में ‘खा गया’ स्वाभाविक और पर्याप्त रूप से प्रबल है तथा मूल से अधिक अलंकरण नहीं जोड़ता।
theological_decisions:
- issue: शिकारी रूपक में אָדָם का वचन और दायरा
  choice: मनुष्यों को
  alternative: मनुष्य को / मानवजाति को
  rationale: यहाँ कोई मानवशास्त्रीय सिद्धान्त निर्धारित नहीं किया जा रहा, बल्कि शासक की हिंसा को सिंह के रूपक में दिखाया गया है। सामूहिक अर्थ के कारण बहुवचन स्वाभाविक है, जबकि इब्रानी एकवचन की जानकारी पादटिप्पणी में सुरक्षित रखी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण भविष्यद्वाणी-काव्य शैली रखी गई है। पंक्ति-विभाजन इब्रानी पद के समानांतर वाक्यांशों और तीव्र होती हिंसा को उभारता है।
