review_pass:
  verdict: revise
  source_fidelity: The imperative and the object of lament are represented, but “राजकुमारों” normally denotes princes in the sense of sons of a king in modern Hindi. נְשִׂיאֵי denotes prominent leaders/rulers and should not be narrowed to royal sons. “विलापगीत उठा” is an overly literal and unnatural rendering of the Hebrew idiom.
  naturalness: “विलाप-गीत आरम्भ कर” is clear, idiomatic modern Hindi and retains the formal prophetic register without asserting that the lament must be sung. “प्रधानों” is natural in this register.
  terminology: “प्रधानों” retains the elevated leadership/rulership sense of נְשִׂיאֵי without importing the more specific Hindi sense of “राजकुमार.” “विलाप-गीत” appropriately renders קִינָה.
  issues:
  - severity: medium
    issue: “राजकुमारों” is too narrow for נְשִׂיאֵי.
    rationale: In standard Hindi, राजकुमार principally means a king’s son. The Hebrew term can refer more broadly to prominent rulers or leaders; even in this royal-context lament, the text does not say “sons of the king.”
  - severity: low
    issue: “विलापगीत उठा” is not idiomatic Hindi.
    rationale: It mechanically mirrors the literal ‘lift up’ imagery, whereas the Hebrew construction is an idiom for commencing or delivering a lament. A natural Hindi imperative is preferable.
  revised_text: और तू इस्राएल के प्रधानों[b] के विषय में एक विलाप-गीत आरम्भ कर[a]।
