  text: וְ/אַתָּה֙ שָׂ֣א קִינָ֔ה אֶל נְשִׂיאֵ֖י יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/019/001.yaml
  text: And you[b][a], raise a lamentation over the princes of Israel.
translation:
  language: hi
  text: और तू इस्राएल के प्रधानों[b] के विषय में एक विलाप-गीत आरम्भ कर[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “विलाप-गीत छेड़,” अथवा “विलाप उठा।”
    reason: lexical_alternative
  - marker: b
    text: “प्रधानों” से यहाँ विशेष रूप से यहूदा/इस्राएल के राजवंशीय शासक अभिप्रेत हो सकते हैं, न कि सामान्य रूप से सभी अगुए।
    reason: alternative_reading
lexical_decisions:
- source_word: וְ/אַתָּה
  choice: और तू
  rationale: संयोजक के साथ स्वतंत्र सर्वनाम यहेजकेल को सीधे संबोधित करते हुए हल्का बल देता है; ‘और तू’ पूर्ववर्ती कथन से संबंध और संबोधन दोनों बनाए रखता है।
- source_word: שָׂא
  choice: उठा
  rationale: मूल क्रिया का अर्थ ‘उठाना/लेना’ है और קִינָה के साथ यह विलाप आरम्भ करने या सुनाने का मुहावरा है। ‘विलापगीत उठा’ मूल रूपक को सुरक्षित रखता है।
- source_word: קִינָה
  choice: विलापगीत
  rationale: यह शब्द विशेष रूप से शोकपूर्ण गीत अथवा मृत्यु-विलाप को दर्शाता है। ‘विलापगीत’ आधुनिक हिन्दी में अर्थ स्पष्ट रखते हुए गंभीर भविष्यद्वाणीपरक शैली बनाए रखता है।
- source_word: אֶל
  choice: के विषय में
  rationale: विलाप के प्रसंग में यह संबंधसूचक अव्यय उस व्यक्ति या समूह को बताता है जिसके विषय में विलाप है। ‘के विषय में’ अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है, बिना यह निश्चित किए कि विलाप केवल ‘पर’ है या ‘विरुद्ध’।
- source_word: נְשִׂיאֵי
  choice: राजकुमारों
  rationale: शब्द ऊँचे पद वाले शासकों या प्रधानों को दर्शाता है। अध्याय के राजवंशीय संदर्भ में ‘राजकुमारों’ से राजनीतिक-वंशगत भाव सुरक्षित रहता है, पर इसे सीधे ‘राजा’ नहीं बनाया गया।
- source_word: יִשְׂרָאֵל
  choice: इस्राएल
  rationale: व्यक्तिवाचक नाम का प्रचलित हिन्दी बाइबलीय रूप।
theological_decisions:
- issue: ‘इस्राएल के राजकुमारों’ का अभिप्राय
  choice: मुख्य पाठ में व्यापक राजवंशीय-राजनीतिक पद ‘राजकुमारों’ रखा गया।
  alternative: ‘इस्राएल के राजाओं’ अथवा ‘इस्राएल के अगुओं’
  rationale: इब्रानी में ‘राजाओं’ का विशिष्ट शब्द नहीं, बल्कि נְשִׂיאֵי है। आगे का संदर्भ राजकीय व्यक्तियों की ओर संकेत करता है, फिर भी अनुवाद स्रोत से अधिक विशिष्ट होकर पहचान निश्चित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गंभीर, काव्यात्मक और भविष्यद्वाणीपरक लहजा रखा गया है। एकवचन प्रत्यक्ष संबोधन के लिए ‘तू’ मूल की निकटता और आदेशात्मक तीव्रता को व्यक्त करता है। दोनों पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित हैं।
