reference: Ezekiel 19:9
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַֽ/יִּתְּנֻ֤/הוּ בַ/סּוּגַר֙ בַּֽ/חַחִ֔ים וַ/יְבִאֻ֖/הוּ אֶל מֶ֣לֶךְ בָּבֶ֑ל יְבִאֻ֨/הוּ֙ בַּ/מְּצֹד֔וֹת לְמַ֗עַן לֹא יִשָּׁמַ֥ע קוֹל֛/וֹ ע֖וֹד אֶל הָרֵ֥י יִשְׂרָאֵֽל־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/019/009.yaml
  text: They put him in a cage with hooks[a], and brought him to the king of Babylon; they brought him into strongholds[b], so that his voice might no longer be heard on the mountains of Israel.
translation:
  language: hi
  text: 'उन्होंने उसे हुकों के साथ पिंजरे[a] में रखा

    और बाबेल के राजा के पास ले गए।

    वे उसे गढ़ों[b] में ले गए,

    ताकि इस्राएल के पहाड़ों पर

    फिर उसकी आवाज़[c] सुनाई न दे।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘बंदीगृह में,’ ‘बंद घेरे में,’ अथवा संभवतः ‘घेराबंदी के स्थान में।’ इब्रानी शब्द किसी बंद स्थान, पिंजरे, या बंदी रखने से जुड़े स्थान को सूचित कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: या ‘किलों में,’ ‘बंदीगृह में,’ अथवा संभवतः ‘घेराबंदी की जगहों में।’ इब्रानी शब्द गढ़ों या पकड़ने और बंद रखने से जुड़े स्थानों के लिए प्रयुक्त हो सकता है।
    reason: lexical_alternative
  - marker: c
    text: या ‘उसकी दहाड़।’ इब्रानी में शाब्दिक रूप से ‘उसकी आवाज़’ है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְּנֻהוּ בַסּוּגַר
  choice: उन्होंने उसे…पिंजरे में डाल दिया
  rationale: סוּגַר यहाँ पकड़े गए सिंह के लिए बंद घेरे या पिंजरे को दर्शाता है। ‘पिंजरा’ विलाप के सिंह-रूपक को बनाए रखता है और आधुनिक हिन्दी में स्वाभाविक है।
- source_word: בַּחַחִים
  choice: अंकुश लगाकर
  rationale: חַחִים पकड़े गए पशु या बंदी को नियंत्रित करने वाले काँटे अथवा अंकुश हैं। ‘अंकुश लगाकर’ साधन का भाव स्वाभाविक हिन्दी में देता है, पर नाक या जबड़े जैसी ऐसी जगह नहीं जोड़ता जो इस पद में स्पष्ट नहीं है।
- source_word: וַיְבִאֻהוּ אֶל מֶלֶךְ בָּבֶל
  choice: और बाबेल के राजा के पास ले गए
  rationale: बोली जाने वाली आधुनिक हिन्दी में ‘के पास ले गए’ हिफ़ील रूप के ‘लाए/ले गए’ अर्थ और אֶל की दिशा को सहज ढंग से व्यक्त करता है।
- source_word: יְבִאֻהוּ בַּמְּצֹדוֹת
  choice: वे उसे गढ़ों में ले गए
  rationale: מְצֹדוֹת का अर्थ गढ़, किला या बंदी रखने से जुड़ा सुरक्षित स्थान हो सकता है। ‘गढ़ों’ मूल के बहुवचन और उसकी वास्तविक शाब्दिक अनिश्चितता को बनाए रखता है।
- source_word: לְמַעַן לֹא יִשָּׁמַע קוֹלוֹ עוֹד
  choice: ताकि…फिर उसकी आवाज़ सुनाई न दे
  rationale: קוֹל का सीधा अर्थ ‘आवाज़/स्वर’ है। ‘आवाज़’ सिंह और उसके द्वारा चित्रित शासक—दोनों स्तरों पर अर्थपूर्ण रहता है; ‘दहाड़’ केवल पशु-रूपक को स्पष्ट कर देती।
- source_word: אֶל הָרֵי יִשְׂרָאֵל
  choice: इस्राएल के पहाड़ों पर
  rationale: यहेजकेल में ‘इस्राएल के पहाड़’ देश के पर्वतीय भूभाग के लिए प्रचलित अभिव्यक्ति है। ध्वनि सुनाई देने के प्रसंग में אֶל को ‘पर’ कहना स्वाभाविक हिन्दी है।
theological_decisions:
- issue: पकड़े गए सिंह और यहूदा के शासक का रूपक
  choice: मुख्य पाठ में पकड़, बंदीकरण और उसकी आवाज़ दबाए जाने का सिंह-रूपक बनाए रखा गया है; किसी ऐतिहासिक राजा का नाम नहीं जोड़ा गया।
  alternative: मुख्य पाठ में इसे यहोयाकीन या यहूदा के किसी अन्य विशिष्ट राजा के रूप में स्पष्ट करना।
  rationale: आस-पास का विलाप यहूदा के शासकों को सिंहों के रूप में चित्रित करता है, पर इस पद का इब्रानी पाठ उस शासक का नाम नहीं बताता। किसी एक पहचान को पाठ में जोड़ना वास्तविक ऐतिहासिक अनिश्चितता को अनावश्यक रूप से समाप्त कर देता।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। काव्यात्मक पंक्ति-विन्यास विलाप के स्वर को सहारा देता है। ‘बाबेल’ मूल नाम בָּבֶל के निकट और हिन्दी बाइबलीय प्रयोग में पहचाना हुआ रूप है।
