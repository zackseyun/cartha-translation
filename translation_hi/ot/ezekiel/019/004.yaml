base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/019/004.yaml
  text: The nations heard of him[a]; he was caught in their pit[c][b], and they brought him with hooks to the land of Egypt.
translation:
  language: hi
  text: राष्ट्रों ने उसके बारे में सुना[a]; वह उनके गड्ढे[b] में पकड़ा गया, और वे उसे हुकों[c] से मिस्र देश में ले गए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसकी बात सुनी।” इब्रानी मुहावरा उसके विषय में समाचार सुनने अथवा उसकी बात सीधे सुनने—दोनों अर्थ दे सकता है।
    reason: lexical_alternative
  - marker: b
    text: या, “उनके फंदे में।” यहाँ शिकार को पकड़ने के लिए बनाए गए गड्ढे का बिंब है।
    reason: lexical_alternative
  - marker: c
    text: “हुक” बंदी पशुओं या कैदियों को काबू में रखने के लिए लगाए जाने वाले हुक या छल्ले हो सकते हैं।
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּשְׁמְעוּ אֵלָיו
  choice: उसके बारे में सुना
  rationale: यहाँ שׁמע אל का अर्थ सीधे उसकी आवाज़ सुनना नहीं, बल्कि उसके विषय में समाचार सुनना हो सकता है; सिंह के रूपक और राष्ट्रों की प्रतिक्रिया के संदर्भ में यही अधिक स्वाभाविक है।
- source_word: גּוֹיִם
  choice: राष्ट्रों
  rationale: यह शब्द यहाँ विदेशी जातियों या राष्ट्रों को सूचित करता है। ‘राष्ट्र’ आधुनिक हिन्दी में स्पष्ट है और बाद की धार्मिक शब्दावली आरोपित नहीं करता।
- source_word: בְּשַׁחְתָּם
  choice: उनके गड्ढे में
  rationale: शब्द का मूल ठोस अर्थ ‘गड्ढा’ है और यहाँ सिंह पकड़ने के लिए बनाए गए शिकारी गड्ढे का बिंब उपयुक्त है।
- source_word: נִתְפָּשׂ
  choice: पकड़ा गया
  rationale: निफ़अल रूप का कर्मवाच्य अर्थ है; ‘पकड़ा गया’ शिकार के प्रसंग को स्वाभाविक रूप से व्यक्त करता है।
- source_word: וַיְבִאֻהוּ
  choice: वे उसे ... ले गए
  rationale: हिफ़ील क्रिया का अर्थ ‘लाना/ले जाना’ है। मिस्र की ओर गति को हिन्दी में ‘ले गए’ अधिक स्वाभाविक ढंग से व्यक्त करता है।
- source_word: בַחַחִים
  choice: अंकुशों से
  rationale: חַחִים बंदी पशुओं या मनुष्यों को नियंत्रित करने वाले काँटेदार हुक या छल्लों को दर्शाता है। ‘अंकुश’ नियंत्रण के साधन को गरिमापूर्ण और बोधगम्य हिन्दी में व्यक्त करता है, जबकि ठीक स्वरूप अनिश्चित रहता है।
- source_word: אֶל אֶרֶץ מִצְרָיִם
  choice: मिस्र देश में
  rationale: यह इब्रानी के औपचारिक भौगोलिक पद ‘मिस्र देश’ को बनाए रखता है; गंतव्य के कारण हिन्दी में ‘में ले गए’ स्वाभाविक है।
