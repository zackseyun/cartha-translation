base_translation:
  language: en
  yaml_path: translation/ot/ezekiel/019/012.yaml
  text: But she was uprooted in wrath; she was thrown down to the ground[a]. And the east wind dried up her fruit; her strong branch was torn off and withered; fire consumed it.
translation:
  language: hi
  text: परन्तु वह रोष में जड़ से उखाड़ दी गई और भूमि पर पटक दी गई। पूर्वी हवा ने उसके फल को सुखा दिया। उसकी शक्तिशाली डाल[a] टूटकर अलग हो गई और सूख गई; आग ने उसे भस्म कर दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उसका शक्तिशाली राजदंड” अथवा “उसकी शक्ति का दंड”; इब्रानी शब्द यहाँ डाल के बिंब के साथ राजकीय शासन का संकेत भी दे सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֻּתַּשׁ
  choice: जड़ से उखाड़ दी गई
  rationale: निष्क्रिय क्रिया और दाखलता के बिंब को स्पष्ट तथा स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: בְּחֵמָה
  choice: रोष में
  rationale: חֵמָה के तीव्र क्रोध के भाव को संक्षिप्त, गरिमापूर्ण भाषा में रखता है और कर्ता को अनावश्यक रूप से स्पष्ट नहीं करता।
- source_word: לָאָרֶץ הֻשְׁלָכָה
  choice: भूमि पर पटक दी गई
  rationale: हिंसक ढंग से नीचे फेंके जाने और अपमानित किए जाने—दोनों भावों को स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: רוּחַ הַקָּדִים
  choice: पूर्वी हवा
  rationale: विनाशकारी पूर्वी पवन के मानक इब्रानी पद का सीधा और सहज अनुवाद है।
- source_word: הוֹבִישׁ פִּרְיָהּ
  choice: उसके फल को सुखा दिया
  rationale: 'हिफ़ील रूप के कारणात्मक अर्थ को बनाए रखता है: हवा ने फल को सूखा दिया।'
- source_word: הִתְפָּרְקוּ וְיָבֵשׁוּ
  choice: टूटकर अलग हो गई और सूख गई
  rationale: टूटने के साथ अलग हो जाने की हिंसक प्रक्रिया और उसके बाद सूखने को क्रमशः व्यक्त करता है; हिंदी में निकटवर्ती एकवचन डाल के अनुरूप वचन रखा गया है।
- source_word: מַטֵּה עֻזָּהּ
  choice: उसकी शक्तिशाली डाल
  rationale: तात्कालिक दाखलता-बिंब को मुख्य पाठ में बनाए रखता है, जबकि מַטֶּה में निहित राजदंड और शासन-सामर्थ्य का संकेत पादटिप्पणी में सुरक्षित है।
- source_word: אֵשׁ אֲכָלָתְהוּ
  choice: आग ने उसे भस्म कर दिया
  rationale: आग द्वारा डाल को पूर्णतः नष्ट किए जाने का सशक्त और स्वाभाविक हिंदी रूप है।
theological_decisions:
- issue: राजकीय-दाखलता विलाप में מַטֵּה עֻזָּהּ का रूपक
  choice: मुख्य पाठ में “उसकी शक्तिशाली डाल”
  alternative: “उसका शक्तिशाली राजदंड” अथवा “उसकी शक्ति का दंड”
  rationale: निकटवर्ती संदर्भ में दाखलता, फल, सूखना और आग के वनस्पतिक बिंब प्रमुख हैं; फिर भी पद 11 की राजकीय पृष्ठभूमि के कारण राजदंड का संकेत वास्तविक है। मुख्य पाठ और पादटिप्पणी दोनों अर्थ-स्तरों को बिना एक को मिटाए सुरक्षित रखते हैं।
translation_notes:
  register: आधुनिक मानक हिंदी का गरिमापूर्ण किंतु सहज स्तर रखा गया है। स्त्रीलिंग सर्वनाम और क्रियाएँ पिछले पदों की माता-दाखलता को जारी रखती हैं। निष्क्रिय वाक्य में विनाश करने वाले कर्ता को नहीं जोड़ा गया, क्योंकि इब्रानी पाठ उसे व्यक्त नहीं करता।
