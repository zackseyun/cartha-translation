  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। कटनी के बाद के अभाव का काव्यात्मक बिंब सुरक्षित है। ‘मेरी जान’ मूल के נֶפֶשׁ को प्रत्यक्ष रखता है, जबकि पादटिप्पणियाँ वास्तविक शब्दार्थगत अनिश्चितता बताती हैं।
