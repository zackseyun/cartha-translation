source:
  edition: WLC
  text: אַ֣לְלַי לִ֗/י כִּ֤י הָיִ֨יתִי֙ כְּ/אָסְפֵּי קַ֔יִץ כְּ/עֹלְלֹ֖ת בָּצִ֑יר אֵין אֶשְׁכּ֣וֹל לֶ/אֱכ֔וֹל בִּכּוּרָ֖ה אִוְּתָ֥ה נַפְשִֽׁ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/007/001.yaml
  text: 'Woe is me! For I have become like the gatherers of summer fruit[a], like the gleanings of the grape harvest: there is no cluster to eat[b], no first-ripe fig that my soul desires.'
translation:
  language: hi
  text: हाय, मेरी क्या दुर्दशा है! क्योंकि मैं गर्मियों के फल बटोरने के बाद बचे हुए फलों के समान, अंगूर की कटाई के बाद बीनने के लिए बचे हुए फलों के समान हो गया हूँ। खाने के लिए अंगूर का कोई गुच्छा नहीं, और न पहले पका अंजीर[b], जिसके लिए मेरा मन तरसता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: इब्रानी में “पहले पका फल”; संभवतः विशेष रूप से बहुमूल्य आरम्भिक अंजीर अभिप्रेत है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אַלְלַי לִי
  choice: हाय, मेरी दुर्दशा!
  rationale: यह तीव्र शोक और संकट की पुकार है। यह अभिव्यक्ति आधुनिक हिन्दी में स्वाभाविक रहते हुए मूल की भावात्मक तीव्रता बनाए रखती है।
- source_word: כִּי הָיִיתִי
  choice: क्योंकि मैं ... हो गया हूँ
  rationale: पूर्ण क्रिया यहाँ ऐसी अवस्था में पहुँच जाने और उसके वर्तमान परिणाम को व्यक्त करती है; इसलिए केवल ‘था’ या ‘हूँ’ की अपेक्षा ‘हो गया हूँ’ उपयुक्त है।
- source_word: כְאָסְפֵי קַיִץ
  choice: गरमी के फलों के संग्रह के समान
  rationale: אָסְפֵי का रूप संग्रह/बटोरने की क्रिया या उसके परिणाम की ओर संकेत कर सकता है। समानांतर पंक्ति और आगे वर्णित अभाव को देखते हुए मुख्य पाठ में कटाई के बाद की विरल दशा का बिंब रखा गया है, जबकि कर्तृवाचक संभावना पादटिप्पणी में दी गई है।
- source_word: כְעֹלְלֹת בָּצִיר
  choice: अंगूर की कटनी के बाद बची हुई उपज के समान
  rationale: עֹלְלֹת कटनी के बाद बीनने के लिए बचे थोड़े फल को दर्शाता है। ‘बची हुई उपज’ साधारण हिन्दी में अर्थ स्पष्ट करती है और अंगूर की कटनी का संदर्भ बनाए रखती है।
- source_word: אֵין אֶשְׁכּוֹל לֶאֱכוֹל
  choice: खाने के लिए अंगूर का कोई गुच्छा नहीं
  rationale: אֶשְׁכּוֹל विशेषतः अंगूर का गुच्छा है। हिन्दी में ‘अंगूर’ स्पष्ट करने से कृषि-बिंब तुरंत समझ में आता है।
- source_word: בִּכּוּרָה
  choice: पहले पका ... अंजीर
  rationale: शब्द का शाब्दिक अर्थ ‘पहले पका फल’ है, और इस संदर्भ में बहुधा अत्यंत प्रिय आरम्भिक अंजीर अभिप्रेत है। मुख्य पाठ में संभावित फल स्पष्ट किया गया है और व्यापक शाब्दिक अर्थ पादटिप्पणी में सुरक्षित है।
- source_word: אִוְּתָה נַפְשִׁי
  choice: जिसकी मेरी जान लालसा करती है
  rationale: נֶפֶשׁ यहाँ व्यक्ति की गहरी भूख अथवा इच्छा व्यक्त करता है। ‘मेरी जान लालसा करती है’ मूल की देह-मन संबंधी अभिव्यक्ति को बनाए रखते हुए हिन्दी में समझने योग्य है।
