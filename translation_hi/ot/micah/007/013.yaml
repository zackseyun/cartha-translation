  text: וְ/הָיְתָ֥ה הָ/אָ֛רֶץ לִ/שְׁמָמָ֖ה עַל יֹֽשְׁבֶ֑י/הָ מִ/פְּרִ֖י מַֽעַלְלֵי/הֶֽם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/micah/007/013.yaml
  text: But the land will become a desolation because of its inhabitants[b][a], because of the fruit of their deeds.
translation:
  language: hi
  text: परन्तु देश[a] अपने निवासियों के कारण उजाड़ हो जाएगा—उनके कामों के फल के कारण[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “पृथ्वी उजाड़ हो जाएगी।” इब्रानी शब्द אֶרֶץ का अर्थ “देश/भूमि” या “पृथ्वी” हो सकता है; यहाँ निकटवर्ती न्याय-संदर्भ में “देश” अधिक उपयुक्त है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “उनके कामों के फल से।” यह उनके किए हुए कामों से उत्पन्न परिणाम को दर्शाने वाली इब्रानी अभिव्यक्ति है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיְתָה
  choice: परन्तु ... हो जाएगा
  rationale: संयोजक वाव के साथ पूर्ण क्रिया यहाँ भविष्यसूचक संदर्भ में भावी परिणाम बताती है। पिछले आशापूर्ण कथन के विपरीत न्याय की बात आने के कारण वाव को स्वाभाविक हिन्दी में ‘परन्तु’ से व्यक्त किया गया है; ‘हो जाएगा’ उजाड़ अवस्था में परिवर्तन को दर्शाता है।
- source_word: הָאָרֶץ
  choice: देश
  rationale: אֶרֶץ का अर्थ ‘देश/भूमि’ या ‘पृथ्वी’ हो सकता है। निकटवर्ती न्याय-संदर्भ में किसी क्षेत्र और उसके निवासियों का संबंध होने से ‘देश’ मुख्य पाठ में अधिक उपयुक्त है, जबकि वास्तविक वैकल्पिक अर्थ पादटिप्पणी में रखा गया है।
- source_word: לִשְׁמָמָה
  choice: उजाड़
  rationale: संज्ञा שְׁמָמָה घोर वीरानी और विनाश की दशा बताती है। हिन्दी में ‘उजाड़ हो जाएगा’ स्वाभाविक है और मूल की गंभीरता बनाए रखता है।
- source_word: עַל יֹשְׁבֶיהָ
  choice: अपने निवासियों के कारण
  rationale: עַל यहाँ स्थान नहीं बल्कि कारण बताता है। स्त्रीलिंगी एकवचन प्रत्यय का संबंध ‘देश’ से है; ‘अपने निवासियों’ इसे स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: מִפְּרִי מַעַלְלֵיהֶם
  choice: उनके कामों के फल के कारण
  rationale: מִן स्रोत अथवा कारण दर्शाता है और ‘फल’ का रूपक मनुष्यों के कामों से निकलने वाले परिणाम को व्यक्त करता है। इसे बनाए रखना मूल की नैतिक-कारणात्मक भाषा को सुरक्षित रखता है।
theological_decisions:
- issue: न्याय की कारणात्मक संरचना
  choice: देश का उजाड़ होना उसके निवासियों और उनके कामों के फल से उत्पन्न परिणाम के रूप में प्रस्तुत किया गया है।
  alternative: 'दोनों वाक्यांशों को अधिक शाब्दिक रूप में रखा जा सकता है: ‘अपने निवासियों के कारण, उनके कामों के फल से।’'
  rationale: इब्रानी में कारण बताने वाले दो जुड़े हुए पदबंध हैं। हिन्दी में दोनों के साथ ‘के कारण’ रखने से संबंध स्पष्ट होता है, जबकि निवासियों और उनके कर्मों के परिणाम के बीच मूल तनाव और संबंध बना रहता है।
translation_notes:
  register: आधुनिक मानक हिन्दी, सरल किंतु गरिमापूर्ण। ‘परन्तु’ पिछले संदर्भ से विरोध को व्यक्त करता है; ‘उजाड़’ सामान्य पाठक के लिए बोधगम्य रहते हुए भविष्यसूचक न्याय की गंभीरता बनाए रखता है। सभी पादटिप्पणी चिह्न मुख्य पाठ में संबद्ध पदों के बाद दिए गए हैं।
