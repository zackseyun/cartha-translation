base_translation:
  language: en
  yaml_path: translation/ot/micah/007/005.yaml
  text: Do not trust in a neighbor[a]; do not put confidence in a close companion. From the woman who lies in your bosom[d][c][b], guard the doors of your mouth.
translation:
  language: hi
  text: पड़ोसी[a] पर विश्वास मत करो; घनिष्ठ साथी[b] पर भरोसा मत रखो। जो स्त्री तुम्हारी बाँहों में लेटी हुई है[c], उससे भी अपने मुँह के द्वारों की रक्षा करो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘मित्र’; רֵעַ निकट सामाजिक संबंध वाले व्यक्ति के लिए प्रयुक्त हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या, ‘अंतरंग मित्र।’
    reason: lexical_alternative
  - marker: c
    text: 'शाब्दिक अर्थ: ‘तुम्हारी गोद/छाती में लेटी हुई स्त्री’; अर्थात अत्यंत निकट संगिनी, सम्भवतः पत्नी।'
    reason: cultural_note
lexical_decisions:
- source_word: רֵעַ
  choice: पड़ोसी
  rationale: यह शब्द मित्र से लेकर पड़ोसी तक निकट सामाजिक संबंध वाले व्यक्ति को दर्शा सकता है। ‘पड़ोसी’ इसका व्यापक अर्थ और पद की बढ़ती हुई निकटता बनाए रखता है।
- source_word: אַלּוּף
  choice: घनिष्ठ साथी
  rationale: यहाँ अर्थ किसी परिचित और निकट सहयोगी का है, न कि प्रधान या सेनानायक का। ‘घनिष्ठ साथी’ पहले पद के ‘पड़ोसी’ से अधिक निकट संबंध व्यक्त करता है।
- source_word: תַּאֲמִינוּ
  choice: विश्वास मत करो
  rationale: हिफ़ील रूप के साथ ב किसी व्यक्ति पर भरोसा रखने का भाव देता है; हिन्दी में ‘विश्वास करना’ स्वाभाविक है।
- source_word: תִּבְטְחוּ
  choice: भरोसा मत रखो
  rationale: בטח निर्भरता और सुरक्षा का भरोसा व्यक्त करता है। अलग अभिव्यक्ति समानांतरता को बनाए रखते हुए अनावश्यक शब्दशः पुनरावृत्ति से बचाती है।
- source_word: מִשֹּׁכֶבֶת חֵיקֶךָ
  choice: जो स्त्री तुम्हारी गोद में लेटती है, उससे भी
  rationale: वाक्यांश अत्यंत निकट घरेलू संबंध की स्त्री को चित्रित करता है, सम्भवतः पत्नी को। ‘गोद में लेटती है’ हिब्रू बिंब को बनाए रखता है, और ‘से भी’ מִן के पृथक्करण तथा चरम चेतावनी के भाव को स्पष्ट करता है।
- source_word: חֵיק
  choice: गोद
  rationale: ‘गोद’ आधुनिक हिन्दी में חֵיק का स्वाभाविक और बोधगम्य समतुल्य है तथा शारीरिक निकटता के बिंब को सुरक्षित रखता है।
- source_word: שְׁמֹר
  choice: रखवाली करो
  rationale: आज्ञार्थक क्रिया सावधानी से सुरक्षित रखने का निर्देश देती है। ‘रखवाली करो’ चेतावनी के बल को बनाए रखती है।
- source_word: פִּתְחֵי פִיךָ
  choice: अपने मुँह के द्वारों
  rationale: हिब्रू का सजीव रूपक शाब्दिक रूप से मुँह के ‘द्वारों/खुलने के स्थानों’ का है। इसे बनाए रखने से वाणी को रोककर रखने की छवि बनी रहती है।
