reference: Micah 7:9
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: זַ֤עַף יְהוָה֙ אֶשָּׂ֔א כִּ֥י חָטָ֖אתִי ל֑/וֹ עַד֩ אֲשֶׁ֨ר יָרִ֤יב רִיבִ/י֙ וְ/עָשָׂ֣ה מִשְׁפָּטִ֔/י יוֹצִיאֵ֣/נִי לָ/א֔וֹר אֶרְאֶ֖ה בְּ/צִדְקָתֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/007/009.yaml
  text: I will bear the indignation of Yahweh[a], because I have sinned against him, until he pleads my case and executes justice for me. He will bring me out to the light; I will look upon his righteousness.
translation:
  language: hi
  text: मैं यहोवा का रोष सहूँगा, क्योंकि मैंने उसके विरुद्ध पाप किया है—जब तक कि वह मेरा मुक़दमा लड़े और मुझे न्याय दिलाए। वह मुझे निकालकर उजियाले में लाएगा; मैं उसकी धार्मिकता[a] देखूँगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उसका न्याय।” इस न्यायिक संदर्भ में इब्रानी शब्द धार्मिकता और न्याय—दोनों का अर्थ दे सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: זַעַף יְהוָה
  choice: यहोवा का रोष
  rationale: זַעַף तीव्र, न्यायोचित क्रोध को व्यक्त करता है; ‘रोष’ आधुनिक और गरिमापूर्ण है। יְהוָה को व्यक्तिगत वाचा-नाम ‘यहोवा’ के रूप में रखा गया है।
- source_word: אֶשָּׂא
  choice: मैं ... सहूँगा
  rationale: נשא यहाँ दंड या उसके बोझ को सहने के अर्थ में प्रयुक्त है; हिंदी में ‘सहना’ स्वाभाविक है और भावी क्रिया को बनाए रखता है।
- source_word: כִּי חָטָאתִי לוֹ
  choice: क्योंकि मैंने उसके विरुद्ध पाप किया है
  rationale: כִּי कारण बताता है और חטא के साथ ל अपराध के लक्ष्य को सूचित करता है।
- source_word: יָרִיב רִיבִי
  choice: वह मेरा मुक़दमा ... लड़े
  rationale: सजातीय क्रिया और संज्ञा का यह प्रयोग कानूनी मुहावरा है; ‘मुक़दमा लड़ना’ हिंदी में स्पष्ट और स्वाभाविक है।
- source_word: וְעָשָׂה מִשְׁפָּטִי
  choice: मुझे न्याय दिलाए
  rationale: यहाँ מִשְׁפָּט अनुकूल न्यायिक निर्णय या पक्ष-समर्थन को दर्शाता है, न कि केवल अमूर्त न्याय को।
- source_word: יוֹצִיאֵנִי לָאוֹר
  choice: वह मुझे निकालकर उजियाले में लाएगा
  rationale: हिफ़ील रूप कारणवाचक ‘बाहर निकालना’ व्यक्त करता है; ‘उजियाले में’ अंधकार से न्यायोचित पुनर्स्थापन की काव्यात्मक छवि रखता है।
- source_word: אֶרְאֶה בְּצִדְקָתוֹ
  choice: मैं उसकी धार्मिकता देखूँगा
  rationale: ראה का सीधा अर्थ ‘देखना’ है। בְּצִדְקָתוֹ में धार्मिकता और न्याय दोनों की अर्थ-सीमा है; मुख्य पाठ में पारंपरिक व्यापक पद रखा गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: इब्रानी पाठ में वाचा का व्यक्तिगत नाम है। हिंदी बाइबलीय प्रयोग में व्यापक रूप से पहचाना जाने वाला ‘यहोवा’ नाम को उपाधि में बदले बिना संप्रेषित करता है।
- issue: בְּצִדְקָתוֹ का अर्थ
  choice: उसकी धार्मिकता
  alternative: उसका न्याय
  rationale: कानूनी पक्ष-समर्थन के संदर्भ में शब्द न्याय का भाव रखता है, पर उसका अर्थ केवल न्याय तक सीमित नहीं है। मुख्य पाठ में व्यापक ‘धार्मिकता’ और पादटिप्पणी में ‘न्याय’ रखकर अर्थगत तनाव सुरक्षित किया गया है।
translation_notes:
  register: आधुनिक मानक हिंदी; काव्यात्मक गरिमा के साथ सामान्य पाठक के लिए सहज वाक्य-विन्यास। कानूनी रूपक को ‘मुक़दमा’ और ‘न्याय दिलाए’ द्वारा स्पष्ट रखा गया है।
