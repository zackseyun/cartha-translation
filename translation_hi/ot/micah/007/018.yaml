source:
  edition: WLC
  text: מִי אֵ֣ל כָּמ֗וֹ/ךָ נֹשֵׂ֤א עָוֺן֙ וְ/עֹבֵ֣ר עַל פֶּ֔שַׁע לִ/שְׁאֵרִ֖ית נַחֲלָת֑/וֹ לֹא הֶחֱזִ֤יק לָ/עַד֙ אַפּ֔/וֹ כִּֽי חָפֵ֥ץ חֶ֖סֶד הֽוּא־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/007/018.yaml
  text: Who is a God like you[a], bearing iniquity and passing over transgression for the remnant of his inheritance? He does not retain his anger forever[b], because he delights in steadfast love.
translation:
  language: hi
  text: आपके समान परमेश्वर कौन है, जो अपनी विरासत के बचे हुए लोगों का अधर्म उठा लेता है[a] और उनके अपराध को अनदेखा करता है? वह अपना क्रोध सदा तक बनाए नहीं रखता, क्योंकि वह अटल प्रेम में प्रसन्न होता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “अधर्म उठा लेता” का अर्थ यहाँ अधर्म को दूर करके क्षमा करना है; इसी प्रकार “अपराध को अनदेखा करता है” का अर्थ उसे छोड़ देना या क्षमा करना है।
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי אֵל כָּמוֹךָ
  choice: आपके समान परमेश्वर कौन है
  rationale: अलंकारिक प्रश्न परमेश्वर की अतुलनीयता व्यक्त करता है और सम्भवतः मीका के नाम की प्रतिध्वनि भी है। हिंदी में यह स्वाभाविक और गरिमापूर्ण है।
- source_word: נֹשֵׂא עָוֹן
  choice: अधर्म उठा लेता
  rationale: נשא के उठाने/ढोने के बिंब को बनाए रखते हुए प्रसंगगत अर्थ—दोष को दूर करना अथवा क्षमा करना—व्यक्त किया गया है।
- source_word: עָוֹן
  choice: अधर्म
  rationale: यह शब्द कुटिल आचरण और उससे उत्पन्न दोष दोनों का संकेत दे सकता है; 'अधर्म' अगले פֶּשַׁע से शब्दगत भेद बनाए रखता है।
- source_word: וְעֹבֵר עַל פֶּשַׁע
  choice: अपराध को अनदेखा करता है
  rationale: עָבַר עַל का शाब्दिक बिंब 'पार निकलना' है, पर इस मुहावरे में अपराध को छोड़ देना या क्षमा करना अभिप्रेत है; 'अनदेखा करता है' आधुनिक हिंदी में स्पष्ट है।
- source_word: לִשְׁאֵרִית נַחֲלָתוֹ
  choice: अपने निज भाग के बचे हुओं का
  rationale: שְׁאֵרִית के भविष्यद्वक्ताई 'बचे हुए' भाव और נַחֲלָה के उस प्रजा-संबंधी भाव को रखा गया है जिसे परमेश्वर अपना भाग मानता है।
- source_word: לֹא הֶחֱזִיק לָעַד אַפּוֹ
  choice: वह अपना क्रोध सदा बनाए नहीं रखता
  rationale: החזיק का अर्थ थामे रखना/कायम रखना और אַף का मुहावरेदार अर्थ क्रोध है; यह हिंदी में स्रोत के निकट और सहज है।
- source_word: כִּי חָפֵץ חֶסֶד הוּא
  choice: क्योंकि वह अटल प्रेम से प्रसन्न होता है
  rationale: חפץ आनंद या प्रसन्नता दर्शाता है। חֶסֶד में दया, निष्ठा और वाचा-संबंधी स्थिर प्रेम के आयाम हैं; 'अटल प्रेम' इनका संतुलित हिंदी रूप है।
theological_decisions:
- issue: חֶסֶד का अनुवाद
  choice: अटल प्रेम
  alternative: दया; करुणा; वाचा का प्रेम
  rationale: यह चयन केवल भावुक प्रेम तक अर्थ को सीमित नहीं करता, बल्कि परमेश्वर की स्थिर दया और निष्ठा को साथ रखता है; किसी विशिष्ट सम्प्रदायगत व्याख्या को आरोपित नहीं करता।
- issue: עָוֹן और פֶּשַׁע के बीच भेद
  choice: अधर्म ... अपराध
  alternative: पाप ... विद्रोह
  rationale: मूल के दो अलग शब्दों को हिंदी में भी अलग रखा गया है, पर उनके बीच ऐसी कठोर धर्मशास्त्रीय श्रेणी नहीं बनाई गई जो पाठ स्वयं निश्चित नहीं करता।
- issue: נֹשֵׂא का बिंब
  choice: उठा लेता
  alternative: क्षमा करता
  rationale: मूल का वहन/हटा देने का बिंब सुरक्षित रखा गया है, जबकि पादटिप्पणी पाठक को मुहावरे का स्पष्ट क्षमासंबंधी अर्थ बताती है।
translation_notes:
  register: आधुनिक मानक हिंदी, आदरसूचक संबोधन और गरिमापूर्ण काव्यात्मक लय का प्रयोग किया गया है। 'निज भाग' सामान्य 'विरासत' की अपेक्षा परमेश्वर की अपनी प्रजा के अर्थ को अधिक स्वाभाविक हिंदी में व्यक्त करता है।
