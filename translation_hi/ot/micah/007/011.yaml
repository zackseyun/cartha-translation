  text: A day for building your walls—on that day the boundary will be far removed[a].
translation:
  language: hi
  text: तेरी दीवारों के निर्माण का दिन—उस दिन सीमा बहुत दूर तक होगी।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “विधि/नियम दूर हो जाएगा।” इब्रानी शब्द का अर्थ “सीमा/हद” या “विधि/नियम” हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: י֖וֹם
  choice: एक दिन आएगा
  rationale: इब्रानी में संक्षिप्त, क्रियारहित भविष्यसूचक घोषणा है। सहज हिन्दी के लिए ‘आएगा’ जोड़ा गया है, जबकि ‘एक दिन’ उसकी अनिश्चित और घोषणात्मक प्रकृति बनाए रखता है।
- source_word: לִ/בְנ֣וֹת
  choice: बनाने का
  rationale: ל के साथ בנה के infinitive construct का स्वाभाविक अर्थ ‘बनाने का/बनाने के लिए’ है। ‘फिर से बनाने’ का भाव प्रसंग में सम्भव है, पर क्रिया में स्पष्ट नहीं।
- source_word: גְּדֵרָ֑יִ/ךְ
  choice: तेरी दीवारों
  rationale: גדר की बहुवचन-सप्रत्यय रूपरेखा घेरने वाली दीवारों या अवरोधों को दर्शाती है। पुनर्स्थापना के प्रसंग में ‘दीवारों’ सहज है; ‘बाड़ों’ से अपेक्षाकृत कमजोर और ‘किलेबंदियों’ से कम विशिष्ट है।
- source_word: י֥וֹם הַ/ה֖וּא
  choice: उस दिन
  rationale: यह सामान्य भविष्यसूचक काल-वाक्यांश उसी घोषित भावी समय की ओर संकेत करता है।
- source_word: יִרְחַק
  choice: दूर तक बढ़ जाएगी
  rationale: רחק का अर्थ दूर होना या दूर जाना है। सीमा के साथ हिन्दी में ‘दूर तक बढ़ जाएगी’ स्थानिक विस्तार का स्वाभाविक बोध कराता है, यद्यपि शाब्दिक रूप से ‘दूर हो जाएगी’ भी सम्भव है।
- source_word: חֹֽק
  choice: सीमा
  rationale: חֹק का अर्थ सीमा/हद अथवा विधि/आदेश हो सकता है। दीवारों और पुनर्स्थापना की निकटवर्ती छवि के कारण मुख्य पाठ में स्थानिक ‘सीमा’ चुना गया है; वैकल्पिक अर्थ पादटिप्पणी में रखा गया है।
theological_decisions:
- issue: अंतिम खंड में חֹק का अर्थ
  choice: स्थानिक सीमा या हद
  alternative: आदेश या विधि
  rationale: दीवारें बनाने की वास्तु और क्षेत्रीय छवि के साथ ‘सीमा’ अधिक सुसंगत है और विस्तार का संकेत देती है। फिर भी ‘आदेश/विधि’ शब्दार्थ की दृष्टि से वास्तविक सम्भावना है, इसलिए अस्पष्टता पादटिप्पणी में सुरक्षित रखी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण भविष्यसूचक शैली रखी गई है। ‘तेरी’ एकवचन स्त्रीलिंग सम्बोधन को सुरक्षित रखता है, जो सिय्योन/नगर की ओर संकेत करता है। मुख्य पाठ में स्थानिक विस्तार को स्वाभाविक हिन्दी में व्यक्त किया गया है और वास्तविक शब्दार्थगत अस्पष्टता पादटिप्पणी में दी गई है।
