source:
  edition: WLC
  text: י֥וֹם הוּא֙ וְ/עָדֶ֣י/ךָ יָב֔וֹא לְ/מִנִּ֥י אַשּׁ֖וּר וְ/עָרֵ֣י מָצ֑וֹר וּ/לְ/מִנִּ֤י מָצוֹר֙ וְ/עַד נָהָ֔ר וְ/יָ֥ם מִ/יָּ֖ם וְ/הַ֥ר הָ/הָֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/007/012.yaml
  text: That day—they will come to you from Assyria and the cities of Egypt[a], and from Egypt to the River, from sea to sea[b], and from mountain to mountain.
translation:
  language: hi
  text: उस दिन वे अश्शूर और मिस्र के नगरों[a] से तुम्हारे पास आएँगे—मिस्र से नदी[b] तक, समुद्र से समुद्र तक और पर्वत से पर्वत तक।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी מָצוֹר को यहाँ “मिस्र” के बजाय “गढ़,” “घेराबंदी” या “किलाबंद नगर/नगरों” के अर्थ में भी समझा जा सकता है।
    reason: lexical_alternative
  - marker: b
    text: “नदी” से संभवतः फरात नदी का आशय है।
    reason: cross_reference
lexical_decisions:
- source_word: י֥וֹם הוּא֙
  choice: उस दिन
  rationale: यह भविष्यवाणी में प्रयुक्त स्वाभाविक काल-सूचक अभिव्यक्ति है और आधुनिक हिन्दी में सहज है।
- source_word: וְעָדֶיךָ יָבוֹא
  choice: वे तुम्हारे पास आएँगे
  rationale: क्रिया रूप की दृष्टि से एकवचन है, पर अनेक क्षेत्रों की सूची सामूहिक कर्ता का संकेत देती है; हिन्दी में बहुवचन इस सामूहिक अर्थ को स्वाभाविक रूप से व्यक्त करता है। 'तुम्हारे' में मूल का पुल्लिंग एकवचन संबोधन बना रहता है।
- source_word: לְמִנִּי אַשּׁוּר
  choice: अश्शूर से
  rationale: यह उद्गम-स्थान बताता है; אַשּׁוּר के लिए प्रचलित हिन्दी बाइबलीय नाम 'अश्शूर' रखा गया है।
- source_word: וְעָרֵי מָצוֹר
  choice: और मिस्र के नगरों से
  rationale: भौगोलिक समानांतरता में מָצוֹר को मिस्र का नाम समझना सबसे संगत है। फिर भी 'गढ़/किलाबंद नगर' का वास्तविक शब्दार्थ पादटिप्पणी में सुरक्षित है।
- source_word: וּלְמִנִּי מָצוֹר
  choice: मिस्र से
  rationale: अश्शूर और नदी के साथ भौगोलिक क्रम होने के कारण यहाँ भी מָצוֹר को मिस्र माना गया है।
- source_word: וְעַד נָהָר
  choice: महानद तक
  rationale: इस भू-राजनीतिक संदर्भ में निरपेक्ष रूप से प्रयुक्त 'नदी' संभवतः फरात है। हिन्दी में 'महानद' पारंपरिक संक्षिप्तता बनाए रखता है; संभावित पहचान पादटिप्पणी में दी गई है।
- source_word: וְיָם מִיָּם
  choice: एक समुद्र से दूसरे समुद्र तक
  rationale: यह व्यापक भौगोलिक विस्तार बताने वाला स्वाभाविक हिन्दी मुहावरा है।
- source_word: וְהַר הָהָר
  choice: एक पर्वत से दूसरे पर्वत तक
  rationale: पिछले वाक्यांश के समान व्यापक विस्तार व्यक्त करता है; हिन्दी में आवश्यक संबंधसूचक शब्द जोड़कर समानांतरता स्पष्ट की गई है।
theological_decisions:
- issue: अनेक उद्गम-स्थानों के संदर्भ में एकवचन क्रिया יָבוֹא का कर्ता
  choice: 'सामूहिक बहुवचन: ''वे तुम्हारे पास आएँगे'''
  alternative: 'एकवचन: ''वह तुम्हारे पास आएगा'', जो किसी व्यक्ति या एकवचन रूप में चित्रित बिखरे समुदाय को सूचित कर सकता है'
  rationale: अनेक देशों और सीमाओं की सूची लौटने या इकट्ठा होने वाले लोगों के सामूहिक अर्थ की ओर संकेत करती है। हिन्दी बहुवचन अर्थ स्पष्ट करता है, यद्यपि मूल की व्याकरणिक एकवचनता में कुछ अस्पष्टता बनी हुई है।
- issue: इस पद में מָצוֹר का अर्थ
  choice: मिस्र का भौगोलिक नाम
  alternative: '''गढ़'', ''घेराबंदी'' या ''किलाबंद नगर/नगरों'' का सामान्य संज्ञा-अर्थ'
  rationale: अश्शूर, नदी, समुद्र और पर्वतों के साथ समानांतर भौगोलिक सूची स्थान-नाम वाले अर्थ का समर्थन करती है। वास्तविक शब्दार्थगत अस्पष्टता पादटिप्पणी में रखी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज शैली रखी गई है। भौगोलिक विस्तार की समानांतर संरचना को स्पष्ट करने के लिए दीर्घ विराम और 'एक...से दूसरे...तक' का प्रयोग किया गया है।
