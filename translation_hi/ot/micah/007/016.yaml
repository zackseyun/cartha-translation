base_translation:
  language: en
  yaml_path: translation/ot/micah/007/016.yaml
  text: Nations will see and be ashamed of all their might[a]; they will put their hand over their mouth[c][b]; their ears will become deaf.
translation:
  language: hi
  text: राष्ट्र यह देखेंगे और अपने सारे पराक्रम पर लज्जित होंगे[a]। वे अपने मुँह पर हाथ रखेंगे[b]; उनके कान बहरे हो जाएँगे[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “अपने सारे पराक्रम के कारण लज्जित होंगे।” हिब्रू वाक्यांश उनके पराक्रम के कारण होने वाली लज्जा या उसके संबंध में होने वाली लज्जा—दोनों अर्थ दे सकता है।
    reason: lexical_alternative
  - marker: b
    text: “मुँह पर हाथ रखना” मौन, विस्मय या अधीनता का संकेत देने वाला मुहावरा है।
    reason: cultural_note
  - marker: c
    text: या “उनके कान बंद हो जाएँगे” अथवा “उनके कान सुनने में सुस्त हो जाएँगे।”
    reason: lexical_alternative
lexical_decisions:
- source_word: יִרְאוּ
  choice: देखेंगे
  rationale: रָאָה का क़ाल अपूर्ण, तृतीय पुरुष बहुवचन रूप देखने या अनुभव करने को व्यक्त करता है; भविष्यकाल भविष्यवाणी के प्रसंग के अनुकूल है।
- source_word: גוֹיִם
  choice: राष्ट्र
  rationale: यहाँ גּוֹיִם से राजनीतिक-सामुदायिक राष्ट्र अभिप्रेत हैं; ‘अन्यजातियाँ’ अनावश्यक रूप से यहूदी-अन्यजाति भेद को प्रमुख बना सकता है।
- source_word: וְיֵבֹשׁוּ
  choice: लज्जित होंगे
  rationale: בוש का क़ाल रूप लज्जा या अपमान की दशा बताता है। यह आधुनिक हिन्दी में स्वाभाविक है और कर्मवाच्य को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: מִכֹּל גְּבוּרָתָם
  choice: अपने सारे पराक्रम के कारण
  rationale: מִן यहाँ कारण अथवा संबंध सूचित कर सकता है। मुख्य पाठ में कारण का स्वाभाविक हिन्दी रूप लिया गया है, जबकि पादटिप्पणी संबंधवाची विकल्प देकर मूल की अस्पष्टता सुरक्षित रखती है। גְּבוּרָה के लिए ‘पराक्रम’ सामर्थ्य और वीरतापूर्ण शक्ति दोनों का भाव देता है।
- source_word: יָשִׂימוּ יָד עַל־פֶּה
  choice: वे अपने मुँह पर हाथ रखेंगे
  rationale: हिब्रू मुहावरे की ठोस छवि सुरक्षित रखी गई है; यह स्तब्ध मौन, विस्मय या अधीनता का संकेत हो सकता है।
- source_word: אָזְנֵיהֶם תֶּחֱרַשְׁנָה
  choice: उनके कान बहरे हो जाएँगे
  rationale: कानों के साथ חרשׁ का यह रूप न सुन सकने या बहरा हो जाने की दशा व्यक्त करता है; अनुवाद मूल रूपक को स्पष्ट और सीधा रखता है।
