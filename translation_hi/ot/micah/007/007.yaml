- from: परन्तु मैं याहवे की ओर दृष्टि लगाए रहूँगा; मैं अपने उद्धार के परमेश्वर की प्रतीक्षा करूँगा[a]। मेरा परमेश्वर मेरी सुनेगा।
  to: परन्तु मैं याहवे की ओर दृष्टि लगाए रहूँगा; मैं अपने उद्धार के परमेश्वर की प्रतीक्षा करूँगा[a]। मेरा परमेश्वर मुझे सुनेगा।
