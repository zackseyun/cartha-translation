  verdict: revise
  source_fidelity: The draft accurately reflects the contrastive first-person opening, expectant watching toward Yahweh, waiting for the God of the speaker’s salvation, and the final assurance that God will hear the speaker. The divine name is appropriately transliterated as “याहवे,” and the footnote preserves the hope nuance of אוֹחִילָה without making it exclusive.
  naturalness: “दृष्टि लगाए रहूँगा” is dignified, understandable modern Hindi and suitably conveys sustained expectant looking. However, “मेरा परमेश्वर मेरी सुनेगा” is less direct and can idiomatically imply ‘will heed what I say’; “मुझे सुनेगा” directly represents the Hebrew object suffix ‘me’ and is more natural. “मेरे उद्धार के परमेश्वर” is also more explicitly faithful than reflexive “अपने उद्धार के परमेश्वर.”
  terminology: “याहवे,” “परमेश्वर,” and “उद्धार” are appropriate, established terms in a modern, elevated Bible register. The lexical-alternative footnote is accurately anchored to “प्रतीक्षा करूँगा.”
  issues:
  - severity: low
    issue: The final clause uses “मेरी सुनेगा.”
    rationale: Although idiomatic in some contexts, it can imply listening to or heeding the speaker’s words rather than directly hearing the speaker. The Hebrew יִשְׁמָעֵנִי has ‘me’ as its object; “मुझे सुनेगा” is more direct and natural.
  - severity: low
    issue: “अपने उद्धार के परमेश्वर” slightly obscures the explicitly first-person possessive form.
    rationale: The Hebrew phrase is ‘the God of my salvation.’ In this first-person confession, “मेरे उद्धार के परमेश्वर” retains that personal possessive explicitly and remains natural Hindi.
  revised_text: परन्तु मैं याहवे की ओर दृष्टि लगाए रहूँगा; मैं अपने उद्धार के परमेश्वर की प्रतीक्षा करूँगा[a]। मेरा परमेश्वर मुझे सुनेगा।
