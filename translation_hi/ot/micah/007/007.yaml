  text: וַ/אֲנִי֙ בַּ/יהוָ֣ה אֲצַפֶּ֔ה אוֹחִ֖ילָה לֵ/אלֹהֵ֣י יִשְׁעִ֑/י יִשְׁמָעֵ֖/נִי אֱלֹהָֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/007/007.yaml
  text: But as for me[a], I will watch for Yahweh; I will wait for the God of my salvation. My God will hear me.
translation:
  language: hi
  text: परन्तु मैं याहवे की ओर दृष्टि लगाए रहूँगा; मैं अपने उद्धार के परमेश्वर की प्रतीक्षा करूँगा[a]। मेरा परमेश्वर मुझे सुनेगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मैं अपने उद्धार के परमेश्वर पर आशा रखूँगा।” इब्रानी क्रिया आशाभरी प्रतीक्षा का भाव भी व्यक्त कर सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי
  choice: परन्तु मैं
  rationale: स्वतंत्र सर्वनाम और संयोजक पिछले प्रसंग की अविश्वसनीयता के विपरीत मीका के व्यक्तिगत निश्चय पर बल देते हैं।
- source_word: בַּיהוָה אֲצַפֶּה
  choice: मैं याहवे की ओर दृष्टि लगाए रहूँगा
  rationale: צפה में चौकसी और अपेक्षापूर्ण दृष्टि का भाव है; यह अनुवाद उस चित्रात्मकता को बनाए रखते हुए हिन्दी में स्वाभाविक है।
- source_word: אוֹחִילָה
  choice: मैं ... प्रतीक्षा करूँगा
  rationale: יחל प्रतीक्षा और आशा, दोनों का भाव व्यक्त कर सकता है। मुख्य पाठ में ‘प्रतीक्षा’ समानांतर पंक्ति को स्पष्ट रखती है, जबकि आशा का भाव पादटिप्पणी में सुरक्षित है।
- source_word: לֵאלֹהֵי יִשְׁעִי
  choice: अपने उद्धार के परमेश्वर की
  rationale: यह रचना इब्रानी संबंधवाचक पदबंध ‘मेरे उद्धार के परमेश्वर’ का धार्मिक और काव्यात्मक भार बनाए रखती है। हिन्दी में कर्ता के अनुसार ‘अपने’ अधिक स्वाभाविक है।
- source_word: יִשְׁמָעֵנִי אֱלֹהָי
  choice: मेरा परमेश्वर मेरी सुनेगा
  rationale: שׁמע का मूल अर्थ सुनना है। ‘मेरी सुनेगा’ प्रार्थना के प्रसंग में स्वाभाविक है और ‘उत्तर देगा’ कहकर निहितार्थ को अनावश्यक रूप से स्पष्ट नहीं करता।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: याहवे
  alternative: यहोवा
  rationale: मूल पाठ में उपाधि नहीं, चार अक्षरों वाला व्यक्तिगत ईश्वरीय नाम है; इसलिए उसे ‘प्रभु’ से बदलने के बजाय लिप्यंतरित किया गया है।
- issue: אוֹחִילָה में निहित प्रतीक्षा और आशा
  choice: मुख्य पाठ में ‘प्रतीक्षा करूँगा’
  alternative: ‘आशा रखूँगा’
  rationale: क्रिया में दोनों भाव संभव हैं। पहली पंक्ति पहले ही अपेक्षापूर्ण दृष्टि व्यक्त करती है; अतः मुख्य पाठ में प्रतीक्षा और पादटिप्पणी में आशा का वैकल्पिक भाव रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘दृष्टि लगाए रहूँगा’ मूल की पहरेदार-जैसी अपेक्षापूर्ण दृष्टि को और ‘मेरी सुनेगा’ प्रार्थना में विश्वास को बिना ‘उत्तर देगा’ का अतिरिक्त अर्थ जोड़े व्यक्त करता है।
