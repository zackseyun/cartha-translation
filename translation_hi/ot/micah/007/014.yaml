  text: רְעֵ֧ה עַמְּ/ךָ֣ בְ/שִׁבְטֶ֗/ךָ צֹ֚אן נַֽחֲלָתֶ֔/ךָ שֹׁכְנִ֣י לְ/בָדָ֔ד יַ֖עַר בְּ/ת֣וֹךְ כַּרְמֶ֑ל יִרְע֥וּ בָשָׁ֛ן וְ/גִלְעָ֖ד כִּ/ימֵ֥י עוֹלָֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/007/014.yaml
  text: Shepherd your people with your staff[a], the flock of your inheritance, dwelling alone in a forest in the midst of Carmel; let them graze in Bashan and Gilead as in days of old.
translation:
  language: hi
  text: अपनी लाठी से अपनी प्रजा की चरवाही कर—अपनी विरासत के उस झुंड की जो करमेल[a] के बीच वन में अकेला बसा हुआ है। वे बाशान और गिलाद में चरें, जैसे प्राचीन दिनों में।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उपजाऊ भूमि के बीच।” इब्रानी ‘करमेल’ किसी स्थान का नाम भी हो सकता है और फलवती या चरागाह वाली भूमि को भी सूचित कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: רְעֵה
  choice: चरवाही कर
  rationale: आज्ञार्थक क्रिया परमेश्वर को संबोधित है। ‘चरवाही कर’ रक्षा, मार्गदर्शन और चराने—तीनों को समेटते हुए चरवाहे का रूपक बनाए रखता है।
- source_word: בְשִׁבְטֶךָ
  choice: अपनी लाठी से
  rationale: चरवाही के संदर्भ में שֵׁבֶט का अर्थ चरवाहे की लाठी स्वाभाविक है; इससे अनावश्यक दंडात्मक बलाघात नहीं आता।
- source_word: צֹאן נַחֲלָתֶךָ
  choice: अपनी विरासत के झुंड की
  rationale: ‘झुंड’ सामूहिक पशुपालकीय बिंब और ‘विरासत’ परमेश्वर के अधिकार तथा वाचा-संबंधी भाषा को सुरक्षित रखते हैं।
- source_word: שֹׁכְנִי לְבָדָד
  choice: जो ... अकेला रहता है
  rationale: यह स्थायी निवास और अलगाव की स्थिति को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: יַעַר
  choice: वन में
  rationale: मूल का वन अथवा दुर्गम भूभाग का बिंब सीधे बनाए रखा गया है।
- source_word: בְּתוֹךְ כַּרְמֶל
  choice: करमेल के बीच
  rationale: बाशान और गिलाद जैसे अगले भौगोलिक नामों के साथ करमेल को स्थान-नाम मानना काव्यात्मक भूगोल को सुरक्षित रखता है; सामान्य संज्ञा वाला अर्थ पादटिप्पणी में दिया गया है।
- source_word: יִרְעוּ
  choice: वे ... चरें
  rationale: अपूर्ण क्रिया का यहाँ प्रार्थनात्मक/इच्छार्थक बल है; ‘चरें’ उसे संक्षेप में व्यक्त करता और पशुपालकीय बिंब बनाए रखता है।
- source_word: בָשָׁן וְגִלְעָד
  choice: बाशान और गिलाद में
  rationale: उपजाऊ चरागाहों के लिए प्रसिद्ध दोनों क्षेत्रों के नाम लिप्यंतरित किए गए हैं।
- source_word: כִּימֵי עוֹלָם
  choice: जैसे प्राचीन दिनों में
  rationale: यहाँ עוֹלָם अनंतता नहीं, बहुत पुराने समय को बताता है; ‘प्राचीन दिनों में’ ऐतिहासिक अर्थ को स्पष्ट रखता है।
theological_decisions:
- issue: שֵׁבֶט में ईश्वरीय देखभाल और अनुशासन का बिंब
  choice: चरवाहे की ‘लाठी’
  alternative: ‘छड़ी’ या ‘दंड’, जिससे अधिकार अथवा अनुशासन पर अधिक बल पड़ सकता है
  rationale: निकट संदर्भ प्रजा की चरवाही और उसके लिए चरागाह की प्रार्थना है। ‘लाठी’ संगत चरवाहा-बिंब बनाए रखती है, जबकि मूल में न उभरे दंडात्मक अर्थ को प्रमुख नहीं करती।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और प्रार्थनात्मक रखी गई है। ‘चरवाही कर’ तथा ‘चरें’ से मूल का विस्तृत पशुपालकीय रूपक सुरक्षित रहता है। ‘करमेल’ की वास्तविक द्व्यर्थता मुख्य पाठ और पादटिप्पणी के संयोजन से संरक्षित है।
