  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: כִּֽי בֵן֙ מְנַבֵּ֣ל אָ֔ב בַּ֚ת קָמָ֣ה בְ/אִמָּ֔/הּ כַּלָּ֖ה בַּ/חֲמֹתָ֑/הּ אֹיְבֵ֥י אִ֖ישׁ אַנְשֵׁ֥י בֵיתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/007/006.yaml
  text: For a son treats his father with contempt[a]; a daughter rises up against her mother; a daughter-in-law against her mother-in-law[b]; a man's enemies are the men of his own house.
translation:
  language: hi
  text: क्योंकि बेटा अपने पिता का अपमान करता है[a]; बेटी अपनी माँ के विरुद्ध उठ खड़ी होती है, और बहू अपनी सास के विरुद्ध; मनुष्य के शत्रु उसी के घर के लोग हैं[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अपने पिता को तुच्छ समझता है।” इब्रानी क्रिया किसी के साथ अपमानजनक या तिरस्कारपूर्ण व्यवहार करने का भाव दे सकती है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “उसी के घर के पुरुष।” यह पदबंध मुहावरे के रूप में घराने के लोगों को व्यापक अर्थ में भी सूचित कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पद पिछले विलाप का कारण या स्पष्टीकरण देता है; इसलिए आधुनिक हिन्दी में ‘क्योंकि’ स्वाभाविक है।
- source_word: בֵן מְנַבֵּל אָב
  choice: बेटा अपने पिता का अपमान करता है
  rationale: נבל का पिएल रूप पिता के साथ तिरस्कारपूर्ण और लज्जाजनक व्यवहार को व्यक्त करता है। ‘अपमान करता है’ अर्थ की गंभीरता को सहज हिन्दी में रखता है।
- source_word: בַּת קָמָה בְאִמָּהּ
  choice: बेटी अपनी माँ के विरुद्ध उठ खड़ी होती है
  rationale: קום यहाँ विरोधी भाव में प्रयुक्त है। ‘विरुद्ध उठ खड़ी होती है’ मूल बिंब और शत्रुतापूर्ण संबंध दोनों को बनाए रखता है।
- source_word: כַּלָּה בַּחֲמֹתָהּ
  choice: बहू अपनी सास के विरुद्ध
  rationale: इस पारिवारिक संदर्भ में כַּלָּה का अर्थ ‘बहू’ और חמות का अर्थ ‘सास’ है; पिछले खंड की क्रिया यहाँ अध्याहृत है।
- source_word: אֹיְבֵי אִישׁ
  choice: मनुष्य के शत्रु
  rationale: אִישׁ का एकवचन यहाँ प्रतिनिधिक है। ‘मनुष्य’ हिन्दी में पुरुषवाचक मूल रूप को रखते हुए सामान्य कथन के रूप में स्वाभाविक है।
- source_word: אַנְשֵׁי בֵיתוֹ
  choice: उसी के घर के लोग
  rationale: शाब्दिक रूप ‘उसके घर के पुरुष’ है, पर यह इब्रानी पदबंध व्यापक रूप से घराने या परिवार के लोगों को भी सूचित कर सकता है। ‘उसी के’ निकट संबंधों से विश्वासघात की तीव्रता उभारता है।
theological_decisions:
- issue: घराने के लिए प्रयुक्त पुरुषवाचक इब्रानी पदबंध
  choice: मुख्य पाठ में ‘उसी के घर के लोग’
  alternative: ‘उसी के घर के पुरुष’
  rationale: אַנְשֵׁי का रूप पुरुषवाचक है, किंतु construct पदबंध אַנְשֵׁי בֵיתוֹ घराने के सदस्यों के लिए मुहावरेदार ढंग से प्रयुक्त हो सकता है। संदर्भ में बेटी, माँ, बहू और सास भी स्पष्टतः सम्मिलित हैं; इसलिए ‘लोग’ अर्थ-सीमा को अनावश्यक रूप से संकुचित नहीं करता। पादटिप्पणी शाब्दिक रूप सुरक्षित रखती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सहज रखी गई है। पारिवारिक संबंधों के सामान्य हिन्दी शब्द—पिता, माँ, बहू और सास—प्रयुक्त हुए हैं। समानांतर खंडों की लय तथा अंतिम कथन की तीव्रता बनाए रखी गई है।
