  text: אָבַ֤ד חָסִיד֙ מִן הָ/אָ֔רֶץ וְ/יָשָׁ֥ר בָּ/אָדָ֖ם אָ֑יִן כֻּלָּ/ם֙ לְ/דָמִ֣ים יֶאֱרֹ֔בוּ אִ֥ישׁ אֶת אָחִ֖י/הוּ יָצ֥וּדוּ חֵֽרֶם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/007/002.yaml
  text: The faithful has perished from the land[a], and there is no upright one among mankind. All of them lie in wait for blood[c][b]; each hunts his brother with a net.
translation:
  language: hi
  text: देश से निष्ठावान जन मिट गया है[a], और मनुष्यों में एक भी सीधा-सच्चा जन नहीं है। वे सब खून बहाने के लिए घात लगाते हैं; हर कोई जाल[c] से अपने भाई[b] का शिकार करता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “पृथ्वी से।”
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में “अपने भाई”; यह शब्द सगे भाई के अलावा समुदाय के किसी साथी सदस्य के लिए भी प्रयुक्त हो सकता है।
    reason: lexical_alternative
  - marker: c
    text: या, “फंदे से।”
    reason: lexical_alternative
lexical_decisions:
- source_word: אָבַד
  choice: मिट गया है
  rationale: काल पूर्ण हो चुकी हानि को व्यक्त करता है; यह चयन विलाप की तीव्रता बनाए रखता है।
- source_word: חָסִיד
  choice: विश्वासयोग्य जन
  rationale: यह वाचा-संबंधी निष्ठा और भक्ति से युक्त व्यक्ति को दर्शाता है; प्रतिनिधिक एकवचन को बनाए रखा गया है।
- source_word: מִן הָאָרֶץ
  choice: देश से
  rationale: मीका की सामाजिक आलोचना के इस्राएली संदर्भ में ‘देश’ अधिक ठोस है; व्यापक अर्थ ‘पृथ्वी से’ पादटिप्पणी में दिया गया है।
- source_word: וְיָשָׁר
  choice: सीधा-सच्चा जन
  rationale: नैतिक खरेपन का स्वाभाविक आधुनिक हिन्दी रूप है।
- source_word: בָּאָדָם
  choice: मनुष्यों में
  rationale: אָדָם यहाँ समस्त मानव समुदाय के लिए सामान्य अर्थ में प्रयुक्त है, केवल पुरुषों के लिए नहीं।
- source_word: אָיִן
  choice: एक भी ... नहीं है
  rationale: अस्तित्व के पूर्ण निषेध को सहज हिन्दी में व्यक्त करता है।
- source_word: כֻּלָּם
  choice: वे सब
  rationale: समूह की समग्रता को स्पष्ट रूप से बनाए रखता है।
- source_word: לְדָמִים
  choice: खून बहाने के लिए
  rationale: शाब्दिक ‘खून के लिए’ के हिंसक आशय को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: יֶאֱרֹבוּ
  choice: घात लगाते हैं
  rationale: छिपकर हिंसक अवसर की प्रतीक्षा करने का भाव ठीक से व्यक्त होता है।
- source_word: אִישׁ
  choice: हर कोई
  rationale: वितरणात्मक एकवचन और प्रत्येक व्यक्ति की जिम्मेदारी को सहज रूप से व्यक्त करता है।
- source_word: אָחִיהוּ
  choice: अपने भाई
  rationale: शाब्दिक संबंध को बनाए रखने से समुदाय के भीतर विश्वासघात की भयावहता उभरती है।
- source_word: יָצוּדוּ חֵרֶם
  choice: जाल से शिकार करता है
  rationale: शिकार करने की क्रिया और जाल के साधन—दोनों को संक्षिप्त रूप में सुरक्षित रखता है।
theological_decisions:
- issue: אָדָם का सामान्य मानववाचक अर्थ
  choice: मनुष्यों में
  alternative: लोगों में
  rationale: इब्रानी शब्द यहाँ मानवजाति या मानव समुदाय के लिए सामान्य रूप से प्रयुक्त है; हिन्दी अनुवाद अनावश्यक रूप से इसे केवल पुरुषों तक सीमित नहीं करता।
- issue: חָסִיד में निष्ठा और भक्ति का संबंध
  choice: विश्वासयोग्य जन
  alternative: भक्त जन
  rationale: ‘विश्वासयोग्य’ वाचा-संबंधी निष्ठा को प्रमुखता देता है, जबकि धार्मिक समर्पण का भाव भी संदर्भ में बना रहता है; किसी विशिष्ट सम्प्रदायगत अर्थ को नहीं जोड़ा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सामान्य-पाठक-सुलभ रूप अपनाया गया है। पद की विलापपूर्ण संक्षिप्तता, प्रतिनिधिक एकवचन और सामाजिक विश्वासघात की तीक्ष्णता को यथासंभव बनाए रखा गया है।
