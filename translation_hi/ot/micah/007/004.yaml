source:
  edition: WLC
  text: טוֹבָ֣/ם כְּ/חֵ֔דֶק יָשָׁ֖ר מִ/מְּסוּכָ֑ה י֤וֹם מְצַפֶּ֨י/ךָ֙ פְּקֻדָּתְ/ךָ֣ בָ֔אָה עַתָּ֥ה תִהְיֶ֖ה מְבוּכָתָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/007/004.yaml
  text: The best of them is like a brier; the upright is worse than a thorn hedge. The day of your watchmen[a], your punishment, has come; now their confusion will be.
translation:
  language: hi
  text: 'उनमें सबसे भला व्यक्ति कँटीली झाड़ी के समान है;

    जो सीधा है, वह काँटों की बाड़ से भी बुरा है।

    तुम्हारे पहरेदारों द्वारा घोषित दिन—तुम्हारे दण्ड का दिन—आ पहुँचा है;

    अब वे भ्रम में पड़ेंगे।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: טוֹבָם
  choice: उनमें सबसे भला व्यक्ति
  rationale: प्रत्यय सहित טוֹב यहाँ पहले वर्णित लोगों में तुलनात्मक रूप से सबसे अच्छे व्यक्ति को सूचित करता है। यह हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: כְּחֵדֶק
  choice: कँटीली झाड़ी के समान
  rationale: חֵדֶק किसी काँटेदार पौधे को दर्शाता है। यह रूपक की हानिकारक और चुभनेवाली छवि को बनाए रखता है।
- source_word: יָשָׁר
  choice: सबसे सीधा व्यक्ति
  rationale: विशेषण यहाँ संज्ञा के रूप में प्रयुक्त है और नैतिक रूप से सीधे माने जानेवाले व्यक्ति की ओर संकेत करता है। प्रसंग में पहले पद के सर्वोत्तम व्यक्ति के समानांतर होने के कारण 'सबसे' निहित तुलना को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: מִמְּסוּכָה
  choice: काँटों की बाड़ से भी बुरा
  rationale: तुलनात्मक מִן को 'से भी' से व्यक्त किया गया है। מְסוּכָה बाड़ या घेरा है और आस-पास की काँटेदार छवि के कारण 'काँटों की बाड़' उपयुक्त है; 'बुरा' मूल में निहित प्रतिकूल तुलना को स्पष्ट करता है।
- source_word: מְצַפֶּיךָ
  choice: तुम्हारे पहरेदारों
  rationale: צפה से बना यह रूप निगरानी करनेवालों, सम्भवतः आनेवाले न्याय की घोषणा करनेवाले भविष्यद्वक्ताओं, को दर्शाता है। 'पहरेदार' मूल पद की भूमिका को बिना अधिक व्याख्या जोड़े बनाए रखता है।
- source_word: פְּקֻדָּתְךָ
  choice: तुम्हारे दण्ड
  rationale: פְּקֻדָּה निरीक्षण, लेखा लेने के लिए आगमन, या दण्ड का बोध करा सकता है। इस न्याय-संदर्भ में 'दण्ड' मुख्य आशय को स्पष्ट करता है, जबकि व्यापक अर्थ पाद-टिप्पणी में सुरक्षित है।
- source_word: בָאָה
  choice: आ पहुँचा है
  rationale: पूर्ण क्रिया घोषित घटना के निश्चित रूप से आ जाने को व्यक्त करती है। 'आ पहुँचा है' हिन्दी में उसकी तात्कालिकता और पूर्णता दोनों बताता है।
- source_word: עַתָּה תִהְיֶה מְבוּכָתָם
  choice: अब वे घोर उलझन में पड़ेंगे
  rationale: शाब्दिक संज्ञात्मक वाक्य 'अब उनकी उलझन होगी' हिन्दी में अस्वाभाविक है। चुना हुआ रूप מְבוּכָה के भ्रम, घबराहट और दिशाहीनता के भाव को सहज हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: न्याय-वाणी में פְּקֻדָּתְךָ का अर्थ
  choice: तुम्हारे दण्ड
  alternative: तुमसे लेखा लेने के लिए आगमन / तुम्हारी सुधि लेने का समय
  rationale: सामाजिक भ्रष्टता की भर्त्सना के बाद आनेवाली विपत्ति की घोषणा होने के कारण यहाँ न्यायात्मक अर्थ प्रमुख है। फिर भी मूल शब्द का अर्थ-क्षेत्र केवल दण्ड तक सीमित नहीं है, इसलिए वैकल्पिक अर्थ पाद-टिप्पणी में दिया गया है।
- issue: מְצַפֶּיךָ की पहचान
  choice: तुम्हारे पहरेदार
  alternative: तुम्हारी बाट जोहनेवाले / भविष्यद्वक्ता
  rationale: पद की भूमिका को सामान्य रूप में रखना मूल की सम्भावित अस्पष्टता बचाता है। इसे सीधे 'भविष्यद्वक्ता' कहना प्रसंगानुकूल हो सकता है, पर मूल शब्द से अधिक विशिष्ट होगा।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, गरिमापूर्ण पर सामान्य पाठक के लिए सहज रखी गई है। काव्यात्मक समानांतरता बनाए रखने के लिए पंक्ति-विन्यास किया गया है। 'सीधा व्यक्ति' नैतिक अर्थ रखता है और किसी विशेष सम्प्रदाय की पारिभाषिक शब्दावली से बचता है।
