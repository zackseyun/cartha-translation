lexical_decisions:
- source_word: כִּימֵי
  choice: जैसे उन दिनों में
  rationale: כְּ की तुलनात्मक शक्ति और יְמֵי के काल-संदर्भ को स्वाभाविक आधुनिक हिन्दी में बनाए रखता है।
- source_word: צֵאתְךָ
  choice: जब तू ... निकला था
  rationale: द्वितीय पुरुष एकवचन प्रत्यय सहित infinitive construct को स्पष्ट कालवाचक उपवाक्य के रूप में प्रस्तुत करता है; ‘तू’ इब्रानी के एकवचन संबोधन को सुरक्षित रखता है।
- source_word: מֵאֶרֶץ מִצְרָיִם
  choice: मिस्र देश से
  rationale: ‘देश’ मूल के אֶרֶץ को व्यक्त करता है और निर्गमन-संबंधी पारंपरिक गरिमा बनाए रखता है।
- source_word: אַרְאֶנּוּ
  choice: मैं उसे ... दिखाऊँगा
  rationale: ראה के हिफ़ील रूप का अर्थ ‘दिखाना’ है और 3ms प्रत्यय को ‘उसे’ के रूप में व्याकरणिक एकवचन रखा गया है।
- source_word: נִפְלָאוֹת
  choice: अद्भुत काम
  rationale: असाधारण, विस्मय उत्पन्न करने वाले कार्यों का व्यापक अर्थ व्यक्त करता है और इसे केवल ‘चमत्कारों’ तक सीमित नहीं करता।
theological_decisions:
- issue: אַרְאֶנּוּ में तृतीय पुरुष पुल्लिंग एकवचन प्रत्यय का संदर्भ
  choice: मुख्य पाठ में व्याकरणिक एकवचन ‘उसे’ रखा गया है, जिसे प्रसंग में सामूहिक रूप से इस्राएल/याकूब का संकेत समझा जा सकता है।
  alternative: लोगों को सामूहिक बहुवचन मानते हुए ‘उन्हें’ अनुवाद करना।
  rationale: इब्रानी रूप एकवचन है; उसे बनाए रखने से स्रोत की व्याकरणिक और व्याख्यात्मक अस्पष्टता सुरक्षित रहती है, जबकि पादटिप्पणी सामूहिक बहुवचन की सम्भावना बताती है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण बाइबलीय गद्य। एकवचन संबोधन और प्रत्यय को मूल इब्रानी के अनुरूप रखा गया है; ‘अद्भुत काम’ व्यापक और सहज अभिव्यक्ति है।
