  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/תֵרֶ֤א אֹיַ֨בְתִּ/י֙ וּ/תְכַסֶּ֣/הָ בוּשָׁ֔ה הָ/אֹמְרָ֣ה אֵלַ֔/י אַיּ֖/וֹ יְהוָ֣ה אֱלֹהָ֑יִ/ךְ עֵינַ/י֙ תִּרְאֶ֣ינָּה בָּ֔/הּ עַתָּ֛ה תִּֽהְיֶ֥ה לְ/מִרְמָ֖ס כְּ/טִ֥יט חוּצֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/007/010.yaml
  text: Then my enemy will see[a], and shame will cover her—the one who said to me, “Where is Yahweh your God?” My eyes will look on her[b]; now she will be trampled down like mud in the streets.
translation:
  language: hi
  text: तब मेरी शत्रु देखेगी, और जिसने मुझसे कहा था, “तुम्हारा परमेश्वर याहवे कहाँ है?” उसे लज्जा ढक लेगी। मेरी आँखें उसे देखेंगी; अब वह गलियों में कीचड़ की तरह रौंदी जाएगी।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְתֵרֶא
  choice: तब ... देखेगी
  rationale: वाव सहित कालगत रूप पिछले पद से घटनाक्रम को आगे बढ़ाता है; प्रसंग में भविष्यकाल और ‘तब’ स्वाभाविक हैं।
- source_word: אֹיַבְתִּי
  choice: मेरी शत्रु
  rationale: संज्ञा और आगे के क्रियारूप स्त्रीलिंग एकवचन हैं; हिन्दी में ‘शत्रु’ के साथ स्त्रीलिंग क्रिया इस बात को स्पष्ट रखती है।
- source_word: וּתְכַסֶּהָ בוּשָׁה
  choice: लज्जा उसे ढक लेगी
  rationale: यह मूल रूपक को सीधे और स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: הָאֹמְרָה אֵלַי
  choice: उसी को, जिसने मुझसे कहा था
  rationale: संज्ञीकृत स्त्रीलिंग कृदंत शत्रु की पहचान उसके ताने से कराता है; ‘उसी को’ इस पहचान-सूचक बल को व्यक्त करता है।
- source_word: אַיּוֹ
  choice: कहाँ है
  rationale: प्रश्नवाचक पद उपहासपूर्ण प्रश्न बनाता है; अतिरिक्त बल जोड़े बिना सीधा अनुवाद उपयुक्त है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिन्दी में प्रचलित देवनागरी रूप ‘यहोवा’ परमेश्वर के व्यक्तिगत नाम को किसी उपाधि से प्रतिस्थापित किए बिना प्रस्तुत करता है।
- source_word: אֱלֹהָיִךְ
  choice: तुम्हारा परमेश्वर
  rationale: द्वितीय पुरुष स्त्रीलिंग एकवचन संबोधन को हिन्दी में प्रसंगानुसार ‘तुम्हारा’ से स्वाभाविक रूप मिलता है।
- source_word: עֵינַי תִּרְאֶינָּה בָּהּ
  choice: मेरी आँखें उसे देखेंगी
  rationale: स्पष्ट कर्ता ‘मेरी आँखें’ और देखने की क्रिया दोनों को निकटता से सुरक्षित रखा गया है।
- source_word: עַתָּה
  choice: अब
  rationale: मूल क्रियाविशेषण प्रतिशोधात्मक उलटाव के अगले चरण को सीधे चिह्नित करता है।
- source_word: תִּהְיֶה לְמִרְמָס
  choice: वह ... रौंदी जाएगी
  rationale: शाब्दिक ‘रौंदे जाने के लिए होगी’ की अपेक्षा यह आधुनिक हिन्दी में स्वाभाविक है और पैरों तले कुचले जाने का परिणाम स्पष्ट रखता है।
- source_word: כְּטִיט חוּצוֹת
  choice: गलियों की कीचड़ के समान
  rationale: ‘कीचड़’ और बहुवचन ‘गलियाँ’ मूल उपमा तथा सार्वजनिक मार्गों के बिंब को बनाए रखते हैं।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल में चार अक्षरों वाला व्यक्तिगत ईश्वरीय नाम है। हिन्दी पाठकों के लिए सुस्थापित देवनागरी रूप ‘यहोवा’ नाम को ‘प्रभु’ जैसी उपाधि से बदलने के बजाय नाम के रूप में ही रखता है; ‘याहवे’ निकटतर वैकल्पिक लिप्यंतरण है।
- issue: शत्रु पर न्याय को व्यक्त करने का ढंग
  choice: वह ... रौंदी जाएगी
  alternative: वह रौंदे जाने की वस्तु होगी
  rationale: לְמִרְמָס का परिणामात्मक अर्थ सुरक्षित रखते हुए निष्क्रिय क्रिया हिन्दी में अधिक स्वाभाविक है; न्याय करने वाले कर्ता को मूल की तरह अनिर्दिष्ट रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। स्त्रीलिंग शत्रु को क्रियारूपों से स्पष्ट किया गया है। मूल के लज्जा से ढकने और गलियों की कीचड़ की तरह रौंदे जाने वाले तीखे बिंब सुरक्षित हैं।
