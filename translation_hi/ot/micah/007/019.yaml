source:
  edition: WLC
  text: יָשׁ֣וּב יְרַֽחֲמֵ֔/נוּ יִכְבֹּ֖שׁ עֲוֺֽנֹתֵ֑י/נוּ וְ/תַשְׁלִ֛יךְ בִּ/מְצֻל֥וֹת יָ֖ם כָּל חַטֹּאותָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/007/019.yaml
  text: He will again have compassion on us[a]; he will subdue our iniquities[b]. He will cast all their sins into the depths of the sea.
translation:
  language: hi
  text: वह फिर हम पर करुणा करेगा[a]; वह हमारे अधर्मों को दबा देगा[b]। आप उनके सब पापों को समुद्र की गहराइयों में फेंक देंगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में आगे ‘वह करेगा’ से अचानक सीधे संबोधन ‘आप फेंक देंगे’ की ओर परिवर्तन होता है। कुछ प्राचीन साक्ष्य और अनुवाद इसे एकरूप करके ‘वह फेंक देगा’ करते हैं।
    reason: alternative_reading
  - marker: b
    text: इब्रानी में शब्दशः ‘उनके पाप’ है; पहले आए ‘हमारे अधर्मों’ के साथ सामंजस्य बैठाने के लिए अनेक अनुवाद ‘हमारे पाप’ करते हैं।
    reason: textual_variant
lexical_decisions:
- source_word: יָשׁוּב
  choice: फिर
  rationale: अगली क्रिया के साथ यह लौटने की अपेक्षा किसी कार्य के दोबारा होने का भाव देता है; ‘फिर’ स्वाभाविक हिन्दी में इस पुनरावृत्ति को व्यक्त करता है।
- source_word: יְרַחֲמֵנוּ
  choice: हम पर करुणा करेगा
  rationale: רחם गहरी दया और करुणा का भाव रखता है; यह पदबंध उसके भावात्मक बल को सहज, गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: יִכְבֹּשׁ
  choice: वश में करेगा
  rationale: כבש का मूल भाव अधीन करने या नियंत्रण में लाने का है। यहाँ अधर्मों को निर्णायक रूप से परास्त करने का चित्र सुरक्षित रहता है।
- source_word: עֲוֺנֹתֵינוּ
  choice: हमारे अधर्मों
  rationale: עון अधर्म और दोष का अर्थ रखता है। ‘अधर्म’ बाद में आए חטאת के लिए प्रयुक्त ‘पाप’ से शब्दगत भेद भी बनाए रखता है।
- source_word: וְתַשְׁלִיךְ
  choice: तू ... फेंक देगा
  rationale: मसोरेटिक रूप द्वितीय पुरुष एकवचन है और पहले के तृतीय पुरुष से सीधे संबोधन की ओर परिवर्तन करता है। ‘तू’ उस व्याकरणिक परिवर्तन और एकवचन को स्पष्ट रूप से सुरक्षित रखता है।
- source_word: בִּמְצֻלוֹת יָם
  choice: समुद्र की गहराइयों में
  rationale: यह वाक्यांश समुद्र के गहरे स्थानों का सजीव चित्र देता है और पापों को पूर्णतः दूर कर दिए जाने का भाव बनाए रखता है।
- source_word: כָּל חַטֹּאותָם
  choice: उनके सब पापों
  rationale: כָּל की समग्रता को ‘सब’ व्यक्त करता है, और प्राप्त इब्रानी पाठ का तृतीय पुरुष बहुवचन प्रत्यय ‘उनके’ के रूप में बिना सामंजस्य बैठाए सुरक्षित रखा गया है।
theological_decisions:
- issue: पद के भीतर पुरुष और सर्वनाम-प्रत्यय का परिवर्तन
  choice: पहले तृतीय पुरुष ‘वह’, फिर परमेश्वर से द्वितीय पुरुष एकवचन में सीधा संबोधन ‘तू’, और अंत में ‘उनके पाप’ रखा गया है।
  alternative: पूरे वाक्य को एकरूप करके ‘वह फिर हम पर करुणा करेगा... और हमारे सब पापों को... फेंक देगा’ किया जा सकता है।
  rationale: प्राप्त इब्रानी पाठ में ये परिवर्तन वास्तविक हैं। उन्हें मुख्य पाठ में बनाए रखने से पाठ की असामान्यता और सम्भावित धर्मवैचारिक तनाव पर अनुवादक की ओर से पर्दा नहीं पड़ता।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘तू’ यहाँ अनादर नहीं, बल्कि इब्रानी के द्वितीय पुरुष एकवचन और परमेश्वर से सीधे संबोधन को सुरक्षित रखने वाला पारंपरिक हिन्दी रूप है। असामान्य सर्वनाम-परिवर्तनों को मुख्य पाठ में रखा गया है और पादटिप्पणियों में समझाया गया है।
