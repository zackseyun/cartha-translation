  edition: WLC
  text: תִּתֵּ֤ן אֱמֶת֙ לְ/יַֽעֲקֹ֔ב חֶ֖סֶד לְ/אַבְרָהָ֑ם אֲשֶׁר נִשְׁבַּ֥עְתָּ לַ/אֲבֹתֵ֖י/נוּ מִ֥/ימֵי קֶֽדֶם־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/007/020.yaml
  text: You will show faithfulness to Jacob and steadfast love to Abraham, which you swore to our fathers from days of old.
translation:
  language: hi
  text: तू याकूब के प्रति निष्ठा और अब्राहम के प्रति अटल प्रेम दिखाएगा, जिनकी तूने प्राचीन काल में हमारे पूर्वजों से शपथ खाई थी।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֱמֶת
  choice: सच्चाई
  rationale: यहाँ शब्द परमेश्वर की वाचा के प्रति विश्वसनीयता और सत्यनिष्ठा को व्यक्त करता है; ‘सच्चाई’ इस व्यापक अर्थ को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: חֶסֶד
  choice: अटल प्रेम
  rationale: यह वाचा-निष्ठ, स्थिर और कृपालु प्रेम का बोध कराता है; ‘अटल प्रेम’ सामान्य पाठक के लिए स्पष्ट रहते हुए उसकी स्थायित्व-ध्वनि सुरक्षित रखता है।
- source_word: לַאֲבֹתֵינוּ
  choice: हमारे पूर्वजों से
  rationale: אָבוֹת का आशय पितृपुरुषों/पूर्वजों से है; आधुनिक सामान्य हिन्दी में ‘पूर्वजों’ अधिक सहज और समावेशी ऐतिहासिक पद है।
- source_word: מִימֵי קֶדֶם
  choice: प्राचीन काल में
  rationale: शाब्दिक अर्थ ‘पुराने दिनों से’ है; शपथ की प्राचीन ऐतिहासिक पृष्ठभूमि को हिन्दी में स्वाभाविक ढंग से व्यक्त किया गया है।
theological_decisions:
- issue: אֲשֶׁר का संबंध
  choice: ‘जिसकी’ को सच्चाई और अटल प्रेम—इस संयुक्त प्रतिज्ञात कृपा—से संबंधित रखा गया है।
  alternative: इसे केवल निकटतम पद ‘अटल प्रेम’ से जोड़ना, अथवा ‘जैसा कि’ कहना।
  rationale: हिब्रू संबंधवाचक पद में व्याकरणिक अस्पष्टता है। ‘जिसकी’ मूल की संबंधवाचक बनावट को बनाए रखता है और शपथ को पूरे पूर्ववर्ती वचन से जोड़कर पढ़ने की स्वाभाविक संभावना खुली रखता है।
- issue: याकूब और अब्राहम की पहचान
  choice: नामों को ऐतिहासिक पितृपुरुषों और उनसे संबद्ध वाचा-समुदाय—दोनों की संभावित ध्वनि सहित जस का तस रखा गया है।
  alternative: उन्हें स्पष्ट रूप से केवल इस्राएल राष्ट्र के रूपक के रूप में प्रस्तुत करना।
  rationale: मूल पाठ स्वयं इस द्विस्तरीय संकेत को स्पष्ट नहीं करता; इसलिए अनुवाद में उसे सीमित नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी, एकवचन निकट संबोधन ‘तू’ के साथ, क्योंकि संदर्भ परमेश्वर को सीधे संबोधित प्रार्थना/स्तुति है। भाषा गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज रखी गई है।
