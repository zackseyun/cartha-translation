id: MIC.7.8
reference: Micah 7:8
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: אַֽל תִּשְׂמְחִ֤י אֹיַ֨בְתִּ/י֙ לִ֔/י כִּ֥י נָפַ֖לְתִּי קָ֑מְתִּי כִּֽי אֵשֵׁ֣ב בַּ/חֹ֔שֶׁךְ יְהוָ֖ה א֥וֹר לִֽ/י־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/micah/007/008.yaml
  text: Do not rejoice over me[a], my enemy; though I have fallen, I will rise. Though I sit in darkness[b], Yahweh will be a light to me.
translation:
  language: hi
  text: हे मेरी शत्रु, मुझ पर आनन्द मत मना[a]। यद्यपि मैं गिर गई हूँ, फिर उठूँगी[b]। यद्यपि मैं अंधकार में बैठी हूँ, याहवे मेरे लिए प्रकाश होगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “हे मेरी शत्रु, मेरी दुर्दशा पर मत इतराना।” इब्रानी क्रिया का मूल अर्थ “आनन्दित होना” है; “इतराना” शत्रुतापूर्ण प्रसंग को अधिक स्पष्ट करता है, पर वह कुछ अधिक व्याख्यात्मक है।
    reason: lexical_alternative
  - marker: b
    text: यहाँ इब्रानी में दोनों क्रियाएँ पूर्ण रूप में हैं—शाब्दिक रूप से, “मैं गिर गई हूँ, मैं उठ गई हूँ।” काव्यात्मक प्रसंग में दूसरी क्रिया निश्चित पुनर्स्थापना व्यक्त करती है, इसलिए उसका अनुवाद प्रायः “मैं उठूँगी” किया जाता है।
    reason: grammatical_ambiguity
lexical_decisions:
- source_word: תִּשְׂמְחִי ... לִי
  choice: मुझ पर आनन्द मत मना
  rationale: שׂמח का मूल अर्थ ‘आनन्दित होना’ है और לִי यहाँ उस व्यक्ति को सूचित करता है जिसकी दुर्दशा पर शत्रु आनन्द मना रही है। यह अनुवाद मूल अर्थ को बनाए रखते हुए स्वाभाविक हिन्दी देता है।
- source_word: אֹיַבְתִּי
  choice: मेरी शत्रु
  rationale: इब्रानी संज्ञा स्त्रीलिंग एकवचन है और उस पर प्रथम पुरुष एकवचन प्रत्यय लगा है; इसलिए सीधे संबोधन में ‘मेरी शत्रु’ उपयुक्त है।
- source_word: כִּי נָפַלְתִּי קָמְתִּי
  choice: यद्यपि मैं गिर गई हूँ, फिर उठूँगी
  rationale: पहला כִּי प्रसंग में रियायती भाव देता है। दोनों क्रियाएँ इब्रानी पूर्ण रूप में हैं, पर काव्यात्मक विरोध वर्तमान पतन के बाद निश्चित पुनर्स्थापना व्यक्त करता है; हिन्दी में ‘उठूँगी’ यह आश्वस्त भाव स्पष्ट करता है। स्त्रीलिंग रूप संदर्भ में बोलती हुई व्यक्तिकृत सिय्योन/नगर के अनुरूप है।
- source_word: אֵשֵׁב בַּחֹשֶׁךְ
  choice: मैं अंधकार में बैठी हूँ
  rationale: ישׁב के ठोस चित्र ‘बैठना’ को रखा गया है और בַּחֹשֶׁךְ को विपत्ति तथा निराशा के काव्यात्मक बिंब ‘अंधकार’ के रूप में स्वाभाविक हिन्दी में व्यक्त किया गया है।
- source_word: יְהוָה
  choice: याहवे
  rationale: मूल पाठ में परमेश्वर का व्यक्तिगत नाम चतुरक्षर יהוה है; इसलिए किसी उपाधि से बदलने के बजाय उसका हिन्दी लिप्यंतरण किया गया है।
- source_word: אוֹר לִי
  choice: मेरे लिए प्रकाश
  rationale: אוֹר उद्धार, आशा और मार्गदर्शन का बिंब है। ‘मेरे लिए प्रकाश’ सम्बन्ध और हित व्यक्त करने वाले לִי को स्वाभाविक हिन्दी में दर्शाता है।
theological_decisions:
- issue: יהוה परमेश्वर के नाम का अनुवाद
  choice: याहवे
  alternative: प्रभु / यहोवा
  rationale: पद में व्यक्तिगत दिव्य नाम सीधे प्रयुक्त है। ‘याहवे’ मूल नाम को उपाधि से बदले बिना प्रस्तुत करता है।
- issue: काव्यात्मक पूर्ण क्रिया קָמְתִּי का काल
  choice: उठूँगी
  alternative: उठ गई हूँ
  rationale: रूप की दृष्टि से क्रिया पूर्ण है, पर पतन और पुनरुत्थान का विरोध भावी, निश्चित उलटाव दिखाता है। मुख्य पाठ में स्वाभाविक भावी अर्थ रखा गया है और रूपगत अस्पष्टता पादटिप्पणी में बताई गई है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। स्त्रीलिंग संबोधन और क्रियारूप व्यक्तिकृत नगर/सिय्योन की वाणी तथा स्त्रीलिंग इब्रानी ‘शत्रु’ के अनुरूप हैं। ‘आनन्द मत मना’ मूल शब्द के निकट है, जबकि अधिक व्याख्यात्मक ‘इतराना’ पादटिप्पणी में दिया गया है।
