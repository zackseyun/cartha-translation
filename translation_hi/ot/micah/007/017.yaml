  text: יְלַחֲכ֤וּ עָפָר֙ כַּ/נָּחָ֔שׁ כְּ/זֹחֲלֵ֣י אֶ֔רֶץ יִרְגְּז֖וּ מִ/מִּסְגְּרֹֽתֵי/הֶ֑ם אֶל יְהוָ֤ה אֱלֹהֵ֨י/נוּ֙ יִפְחָ֔דוּ וְ/יִֽרְא֖וּ מִמֶּֽ/ךָּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/007/017.yaml
  text: They will lick the dust like a snake[a]; like crawling things of the earth they will come trembling out of their strongholds. To Yahweh our God they will turn in dread[d][c][b], and they will be afraid because of you.
translation:
  language: hi
  text: 'वे साँप के समान धूल चाटेंगे;

    धरती के रेंगने वाले जीवों के समान

    वे अपने गढ़ों[a] से काँपते हुए निकलेंगे।

    वे याहवे, हमारे परमेश्वर, की ओर भय से आएँगे,

    और तुझसे डरेंगे[b]।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “गढ़ों” के स्थान पर “बंद स्थानों,” “घेरों” या “छिपने के ठिकानों” का अर्थ भी संभव है।
    reason: lexical_alternative
  - marker: b
    text: या “तेरा भय मानेंगे” अथवा “तेरे प्रति विस्मय से भरेंगे।” इब्रानी क्रिया डर का अर्थ दे सकती है और उसमें श्रद्धामिश्रित विस्मय की छाया भी हो सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: יְלַחֲכוּ עָפָר
  choice: धूल चाटेंगे
  rationale: क्रिया और उसके ठोस अपमानसूचक बिंब को सीधे रखा गया है; इसे केवल ‘दीन होंगे’ जैसे भावार्थ में नहीं बदला गया।
- source_word: כַּנָּחָשׁ
  choice: साँप के समान
  rationale: נָחָשׁ का सामान्य अर्थ ‘साँप’ है; आधुनिक हिन्दी में यह स्वाभाविक और स्पष्ट है।
- source_word: כְּזֹחֲלֵי אֶרֶץ
  choice: धरती पर रेंगनेवाले जीवों के समान
  rationale: यह प्राणिवैज्ञानिक श्रेणी को अनावश्यक रूप से सीमित किए बिना भूमि पर रेंगने का नीचा बिंब बनाए रखता है।
- source_word: יִרְגְּזוּ מִמִּסְגְּרֹתֵיהֶם
  choice: वे अपने गढ़ों से काँपते हुए निकलेंगे
  rationale: רגז काँपने या थरथराने का भाव देता है, और מן सुरक्षित बंद स्थानों से बाहर आने की दिशा सूचित करता है। ‘गढ़ों’ प्रसंगानुकूल है, पर मूल संज्ञा में बाड़े या बंद स्थान का व्यापक अर्थ भी संभव है।
- source_word: אֶל יְהוָה אֱלֹהֵינוּ יִפְחָדוּ
  choice: वे हमारे परमेश्वर याहवे की ओर भय से मुड़ेंगे
  rationale: אֶל की दिशात्मकता को ‘की ओर’ से सुरक्षित रखा गया है। פחד के भय/आतंक के भाव को ‘भय से’ व्यक्त किया गया है; ‘मुड़ेंगे’ हिन्दी में भयभीत होकर उसकी ओर आने का स्वाभाविक संकेत देता है, यद्यपि गति की क्रिया मूल में स्पष्ट रूप से नहीं है।
- source_word: וְיִרְאוּ מִמֶּךָּ
  choice: और तुझसे डरेंगे
  rationale: ירא यहाँ समानांतर פחד और पराजित जातियों के प्रसंग में मुख्यतः भय व्यक्त करता है। מן को हिन्दी के स्वाभाविक भय-निर्माण ‘तुझसे डरेंगे’ में रखा गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा / प्रभु
  rationale: व्यक्तिगत ईश्वरीय नाम को लिप्यंतरित करके उसकी विशिष्टता बनाए रखी गई है; उसे उपाधि में नहीं बदला गया।
- issue: अंतिम चरण में भय की प्रकृति
  choice: भय और डर
  alternative: श्रद्धामिश्रित विस्मय
  rationale: ירא में श्रद्धा या विस्मय की छाया संभव है, पर उसके साथ समानांतर פחד और दीन की गई जातियों का प्रसंग आतंकपूर्ण भय को प्रमुख बनाता है। फुटनोट वैकल्पिक छाया को खुला रखता है।
- issue: אֶל के साथ יִפְחָדוּ का संबंध
  choice: याहवे की ओर भय से मुड़ेंगे
  alternative: याहवे से डरेंगे
  rationale: दिशासूचक אֶל को बनाए रखने के लिए ‘की ओर’ रखा गया है। हिन्दी में पूर्ण कथन के लिए ‘मुड़ेंगे’ जोड़ा गया है, पर इसे मूल में प्रत्यक्ष गति-क्रिया मानकर अधिक नहीं खींचा गया।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध हिन्दी। काव्य-पंक्तियों में समानांतरता और रेंगने-काँपने के ठोस बिंब सुरक्षित रखे गए हैं। परमेश्वर को संबोधित एकवचन रूप के लिए काव्यात्मक और निकट ‘तुझसे’ चुना गया है।
