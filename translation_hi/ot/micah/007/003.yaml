reference: Micah 7:3
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: עַל הָ/רַ֤ע כַּפַּ֨יִם֙ לְ/הֵיטִ֔יב הַ/שַּׂ֣ר שֹׁאֵ֔ל וְ/הַ/שֹּׁפֵ֖ט בַּ/שִׁלּ֑וּם וְ/הַ/גָּד֗וֹל דֹּבֵ֨ר הַוַּ֥ת נַפְשׁ֛/וֹ ה֖וּא וַֽ/יְעַבְּתֽוּ/הָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/007/003.yaml
  text: 'Their hands are on evil[a], to do it well: the prince asks, and the judge is for a bribe, and the great man speaks the desire of his soul[c][b]; thus they weave it together.'
translation:
  language: hi
  text: बुराई करने के लिए उनके दोनों हाथ निपुण हैं:[a] अधिकारी माँग करता है, न्यायाधीश घूस के बदले न्याय करता है,[b] और प्रभावशाली व्यक्ति अपने मन की लालसा बताता है; और वे मिलकर उसे गूँथते हैं।[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक रूप के निकट: “बुराई पर दोनों हाथ हैं, ताकि उसे अच्छी तरह करें”; अर्थात वे पूरे मन और कुशलता से बुराई करते हैं।'
    reason: lexical_alternative
  - marker: b
    text: 'इब्रानी बहुत संक्षिप्त है: “न्यायाधीश भुगतान में/के लिए।” इसका अर्थ “न्यायाधीश घूस माँगता है” या “न्यायाधीश घूस के बदले न्याय करता है” हो सकता है।'
    reason: lexical_alternative
  - marker: c
    text: या, “वे मिलकर उसे ऐंठते/बुनते हैं।” चित्र भ्रष्ट योजना को आपस में गूँथने का है।
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל הָרַע כַּפַּיִם לְהֵיטִיב
  choice: बुराई करने के लिए उनके दोनों हाथ निपुण हैं
  rationale: כַּפַּיִם का द्विवचन ‘दोनों हाथ’ के रूप में स्वाभाविक है। לְהֵיטִיב का शाब्दिक भाव ‘अच्छी तरह करना’ है; संदर्भ में यह बुराई करने की दक्षता पर व्यंग्य करता है, जिसे ‘निपुण हैं’ सहज हिन्दी में व्यक्त करता है।
- source_word: הַשַּׂר שֹׁאֵל
  choice: अधिकारी माँग करता है
  rationale: שַׂר किसी शासक, प्रधान या उच्च अधिकारी को दर्शा सकता है। ‘अधिकारी’ आधुनिक हिन्दी में पद और सत्ता का भाव रखता है; שֹׁאֵל को अस्पष्ट रखते हुए ‘माँग करता है’ कहा गया है।
- source_word: וְהַשֹּׁפֵט בַּשִּׁלּוּם
  choice: न्यायी घूस के लिए तैयार रहता है
  rationale: इब्रानी पदबंध अत्यंत संक्षिप्त और क्रियारहित है। בַּשִּׁלּוּם यहाँ भ्रष्ट भुगतान/घूस का संकेत देता है। मुख्य पाठ अर्थ को पठनीय बनाता है, जबकि संभावित क्रियात्मक अर्थ पादटिप्पणी में सुरक्षित हैं।
- source_word: וְהַגָּדוֹל
  choice: प्रभावशाली व्यक्ति
  rationale: संज्ञा की तरह प्रयुक्त विशेषण सामाजिक रूप से बड़े, प्रमुख या शक्तिशाली व्यक्ति को बताता है। ‘प्रभावशाली व्यक्ति’ आधुनिक हिन्दी में इसी सामाजिक स्थिति को स्पष्ट करता है।
- source_word: דֹּבֵר הַוַּת נַפְשׁוֹ
  choice: अपने मन की लालसा बताता है
  rationale: הַוָּה इच्छा, लालसा, अनिष्ट या विनाशकारी अभिलाषा का संकेत दे सकता है। ‘लालसा’ संदर्भ की स्वार्थपूर्ण तीव्रता बनाए रखती है, पर किसी खास पाप को अनावश्यक रूप से नहीं जोड़ती; נֶפֶשׁ को मुहावरेदार हिन्दी में ‘मन’ कहा गया है।
- source_word: וַיְעַבְּתוּהָ
  choice: फिर वे मिलकर उसे बुनते हैं
  rationale: עבת में ऐंठने, गूँथने या परस्पर बुनने का बिंब है। ‘मिलकर ... बुनते हैं’ तीनों पक्षों की समन्वित भ्रष्ट योजना को व्यक्त करता है और स्त्रीलिंग प्रत्यय के अनिर्दिष्ट संदर्भ को ‘उसे’ से बनाए रखता है।
theological_decisions:
- issue: भ्रष्टाचार में विभिन्न शक्तिशाली पक्षों की सहभागिता
  choice: तीनों पात्रों के अलग-अलग कार्य और अंत में उनकी संयुक्त कार्रवाई बनाए रखी गई
  alternative: सभी को सामान्यतः ‘भ्रष्ट नेता’ कहकर समेट देना
  rationale: मूल पाठ अधिकारी, न्यायी और प्रभावशाली व्यक्ति के बीच तनावपूर्ण समानांतरता और मिलीभगत दिखाता है; इसे किसी खास शासन-पद्धति या धार्मिक मत से नहीं जोड़ा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सहज रूप रखा गया है। ‘अधिकारी’, ‘न्यायी’, ‘घूस’ और ‘प्रभावशाली व्यक्ति’ सामान्य पाठक के लिए स्पष्ट हैं। मूल इब्रानी की संक्षिप्तता और अस्पष्टता विशेषकर न्यायी की क्रिया तथा अंतिम स्त्रीलिंग कर्म-सर्वनाम में पादटिप्पणियों द्वारा सुरक्षित रखी गई है।
