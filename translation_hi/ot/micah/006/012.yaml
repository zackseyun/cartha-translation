source:
  edition: WLC
  text: אֲשֶׁ֤ר עֲשִׁירֶ֨י/הָ֙ מָלְא֣וּ חָמָ֔ס וְ/יֹשְׁבֶ֖י/הָ דִּבְּרוּ שָׁ֑קֶר וּ/לְשׁוֹנָ֖/ם רְמִיָּ֥ה בְּ/פִי/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/006/012.yaml
  text: whose rich men are full of violence[a], and her inhabitants speak lies; their tongue is deceitful in their mouth.
translation:
  language: hi
  text: जिसके धनवान लोग हिंसा से भरे हैं, और उसके निवासी झूठ बोलते हैं; उनकी जीभ उनके मुँह में छल से भरी है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֲשֶׁר
  choice: जिसके
  rationale: यह सम्बन्धवाचक अव्यय पिछले सन्दर्भ में उल्लिखित नगर से पद को जोड़ता है; आगे के स्त्रीलिंग एकवचन प्रत्ययों के साथ ‘जिसके’ स्वाभाविक सम्बन्ध व्यक्त करता है।
- source_word: עֲשִׁירֶיהָ
  choice: उसके धनवान लोग
  rationale: यह बहुवचन रूप नगर के धनवान वर्ग को सूचित करता है। ‘धनवान लोग’ आधुनिक हिन्दी में स्वाभाविक है और सामाजिक आरोप को स्पष्ट रखता है।
- source_word: מָלְאוּ חָמָס
  choice: हिंसा से भरे हैं
  rationale: यह परिणामसूचक अभिव्यक्ति है। חָמָס में हिंसा, अत्याचार और अन्यायपूर्ण उत्पीड़न का अर्थक्षेत्र है; ‘हिंसा’ उसका सीधा और सन्दर्भानुकूल अनुवाद है।
- source_word: וְיֹשְׁבֶיהָ
  choice: और उसके निवासी
  rationale: संज्ञा के रूप में प्रयुक्त कृदन्त नगर में रहने वालों के सामूहिक वर्ग को दर्शाता है; ‘निवासी’ संक्षिप्त और स्वाभाविक है।
- source_word: דִּבְּרוּ שָׁקֶר
  choice: झूठ बोलते हैं
  rationale: यद्यपि हिब्रू क्रिया पूर्ण रूप में है, यहाँ भविष्यद्वक्ता का आरोप उनके चारित्रिक आचरण को बताता है; हिन्दी का सामान्य वर्तमान काल यह भाव स्पष्ट करता है।
- source_word: וּלְשׁוֹנָם רְמִיָּה
  choice: उनकी जीभ ... छल से भरी है
  rationale: मूल में ‘उनकी जीभ छल है’ जैसा संज्ञात्मक विधान है। हिन्दी में ‘छल से भरी है’ उस तीव्र रूपक को स्वाभाविक ढंग से बनाए रखता है, बिना उसे केवल ‘छलपूर्ण’ कहकर कमजोर किए।
- source_word: בְּפִיהֶם
  choice: उनके मुँह में
  rationale: मूल में ‘मुँह’ एकवचन है और उस पर बहुवचन प्रत्यय लगा है; हिन्दी में ‘उनके मुँह में’ सामूहिक मुहावरे और ठोस बिम्ब दोनों को सुरक्षित रखता है।
theological_decisions: []
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। नगर के लिए हिन्दी में व्याकरणिक पुल्लिंग ‘उसके’ आया है, जबकि हिब्रू प्रत्यय स्त्रीलिंग एकवचन हैं; इससे आशय नहीं बदलता। समानान्तर काव्य-विन्यास और आरोप की तीक्ष्णता सुरक्षित रखी गई है।
