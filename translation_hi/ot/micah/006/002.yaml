source:
  edition: WLC
  text: שִׁמְע֤וּ הָרִים֙ אֶת רִ֣יב יְהוָ֔ה וְ/הָ/אֵתָנִ֖ים מֹ֣סְדֵי אָ֑רֶץ כִּ֣י רִ֤יב לַֽ/יהוָה֙ עִם עַמּ֔/וֹ וְ/עִם יִשְׂרָאֵ֖ל יִתְוַכָּֽח־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/006/002.yaml
  text: Hear[a], O mountains, the case of Yahweh, and you enduring foundations of the earth; for Yahweh has a case against his people[c][b], and he will contend with Israel.
translation:
  language: hi
  text: हे पहाड़ो, याहवे का मुकदमा[a] सुनो; और हे पृथ्वी की अटल[b] नींवो, तुम भी सुनो! क्योंकि याहवे का अपनी प्रजा के विरुद्ध[c] मुकदमा है, और वह इस्राएल से विवाद करेगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘मुकदमा’ के स्थान पर ‘विवाद’, ‘अभियोग’ या ‘कानूनी झगड़ा’ भी हो सकता है। इब्रानी רִיב प्रायः वाचा से जुड़े न्यायिक आरोप के लिए प्रयुक्त होता है।
    reason: lexical_alternative
  - marker: b
    text: ‘अटल’ के स्थान पर ‘दृढ़’, ‘स्थायी’ या ‘प्राचीन’ भी हो सकता है।
    reason: lexical_alternative
  - marker: c
    text: शाब्दिक रूप से ‘अपनी प्रजा के साथ’; इस न्यायिक संदर्भ में अर्थ ‘अपनी प्रजा के विरुद्ध’ है।
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁמְעוּ
  choice: सुनो
  rationale: बहुवचन आज्ञार्थक क्रिया है। यह पहाड़ों और पृथ्वी की नींवों को साक्षियों के रूप में सुनने के लिए बुलाती है।
- source_word: הָרִים
  choice: हे पहाड़ो
  rationale: यह सीधा संबोधन है; ‘हे’ हिन्दी में इसके काव्यात्मक और भविष्यद्वक्ताई स्वर को स्वाभाविक रूप से व्यक्त करता है।
- source_word: רִיב
  choice: मुकदमा
  rationale: यहाँ शब्द का अर्थ केवल झगड़ा नहीं, बल्कि वाचा-भंग से जुड़ा न्यायिक अभियोग या कानूनी विवाद है। ‘मुकदमा’ उस न्यायिक रूपक को स्पष्ट और सहज रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय हिन्दी में लिप्यंतरित किया गया है।
- source_word: הָאֵתָנִים
  choice: अटल
  rationale: यह शब्द दृढ़ता, स्थायित्व और चिरस्थायी सामर्थ्य का भाव रखता है। पृथ्वी की नींवों के साथ ‘अटल’ स्वाभाविक है और मूल बिंब को बनाए रखता है।
- source_word: מֹסְדֵי אָרֶץ
  choice: पृथ्वी की नींवो
  rationale: यह संबंधवाची पद पृथ्वी के आधारभूत भागों को दर्शाता है। संबोधन के कारण हिन्दी में ‘नींवो’ रूप रखा गया है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यह सुनने के आह्वान का कारण प्रस्तुत करता है।
- source_word: עִם עַמּוֹ
  choice: अपनी प्रजा के विरुद्ध
  rationale: עִם का मूल अर्थ ‘के साथ’ है, पर רִיב के न्यायिक संदर्भ में यह विरोधी पक्ष का संबंध व्यक्त करता है; इसलिए मुख्य पाठ में ‘के विरुद्ध’ स्वाभाविक है।
- source_word: יִתְוַכָּח
  choice: विवाद करेगा
  rationale: हित्पएल रूप न्यायिक बहस, प्रतिवाद या अपना पक्ष प्रस्तुत करने का अर्थ दे सकता है। ‘विवाद करेगा’ इस अर्थ-क्षेत्र को बिना अनावश्यक विस्तार के बनाए रखता है।
- source_word: יִשְׂרָאֵל
  choice: इस्राएल
  rationale: वाचा की प्रजा और नाम का प्रचलित हिन्दी लिप्यंतरण।
theological_decisions:
- issue: वाचा के नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: पाठ में परमेश्वर का व्यक्तिगत वाचा-नाम आया है। ‘याहवे’ उसे उपाधि से प्रतिस्थापित किए बिना और अपेक्षाकृत निकट लिप्यंतरण के साथ प्रस्तुत करता है।
- issue: रִיב की वाचा-न्यायालय संबंधी छवि
  choice: मुकदमा
  alternative: विवाद; अभियोग
  rationale: पद परमेश्वर और उसकी प्रजा के बीच साधारण मतभेद नहीं, बल्कि न्यायिक-वाचागत कार्रवाई का चित्र प्रस्तुत करता है। ‘मुकदमा’ इस तनाव को स्पष्ट रखता है, जबकि पादटिप्पणी अन्य संभावनाएँ बताती है।
- issue: עִם עַמּוֹ में संबंध का स्वरूप
  choice: अपनी प्रजा के विरुद्ध
  alternative: अपनी प्रजा के साथ
  rationale: इब्रानी पूर्वसर्ग शाब्दिक रूप से ‘साथ’ है, पर ‘मुकदमा’ के संदर्भ में प्रजा विरोधी पक्ष है। मुख्य पाठ प्रसंगगत अर्थ देता है और पादटिप्पणी शाब्दिक संरचना सुरक्षित रखती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सार्वजनिक पाठ के योग्य रखी गई है। दूसरे संबोधन में इब्रानी की लुप्त क्रिया को हिन्दी की स्पष्टता के लिए ‘तुम भी सुनो’ के रूप में दोहराया गया है। ‘मुकदमा’ और ‘विवाद’ की पुनरावृत्ति मूल के दो संबंधित न्यायिक शब्दों के तनाव को बनाए रखती है।
