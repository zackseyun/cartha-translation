source:
  edition: WLC
  text: אַתָּ֤ה תֹאכַל֙ וְ/לֹ֣א תִשְׂבָּ֔ע וְ/יֶשְׁחֲ/ךָ֖ בְּ/קִרְבֶּ֑/ךָ וְ/תַסֵּג֙ וְ/לֹ֣א תַפְלִ֔יט וַ/אֲשֶׁ֥ר תְּפַלֵּ֖ט לַ/חֶ֥רֶב אֶתֵּֽן׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/006/014.yaml
  text: You will eat[a], but you will not be satisfied, and your emptiness will remain within you; you will move away, but you will not rescue anything, and what you do rescue I will give to the sword.
translation:
  language: hi
  text: तुम खाओगे, पर तृप्त न होगे, और तुम्हारा खालीपन तुम्हारे भीतर बना रहेगा[a]; तुम हटाकर ले जाओगे, पर कुछ भी बचा न सकोगे, और जो कुछ तुम बचा भी लोगे, उसे मैं तलवार के हवाले कर दूँगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इस स्थान का इब्रानी वाक्यांश कठिन और अनिश्चित है। इसका अर्थ यह भी हो सकता है: “तुम्हारा अपमान तुम्हारे बीच होगा” या “तुम्हारा धँसना तुम्हारे भीतर होगा।”'
    reason: alternative_reading
lexical_decisions:
- source_word: תֹאכַל
  choice: तुम खाओगे
  rationale: אכל का काल 2ms रूप न्याय की भविष्यवाणी में सीधा भावी अर्थ देता है।
- source_word: תִשְׂבָּע
  choice: तृप्त न होगे
  rationale: שׂבע भोजन से भरने या संतुष्ट होने को दर्शाता है; ‘तृप्त’ खाने के संदर्भ में स्वाभाविक और गरिमापूर्ण है।
- source_word: יֶשְׁחֲךָ
  choice: तुम्हारा खालीपन ... बना रहेगा
  rationale: यह दुर्लभ और कठिन रूप है। निकट संदर्भ में अतृप्त भोजन के कारण ‘खालीपन’ उपयुक्त है, पर अनिश्चितता पादटिप्पणी में सुरक्षित रखी गई है।
- source_word: בְּקִרְבֶּךָ
  choice: तुम्हारे भीतर
  rationale: קֶרֶב यहाँ आंतरिक दशा का संकेत दे सकता है; ‘भीतर’ बिना अनावश्यक विशिष्टीकरण के इसे व्यक्त करता है।
- source_word: תַסֵּג
  choice: हटाकर ले जाने का प्रयत्न करोगे
  rationale: סוג का हिफ़ील रूप हटाने या पीछे ले जाने का अर्थ दे सकता है। आगामी ‘बचाने’ के साथ यह लोगों या वस्तुओं को संकट से निकाल ले जाने के प्रयास को संकेतित करता है, पर कर्म को अनिर्दिष्ट रखता है।
- source_word: תַפְלִיט / תְּפַלֵּט
  choice: बचा न सकोगे / बचा भी लोगे
  rationale: פלט के दोनों रूपों को ‘बचाना’ से अनूदित करके मूल की पुनरुक्ति और विफल उद्धार का क्रम सुरक्षित रखा गया है।
- source_word: לַחֶרֶב
  choice: तलवार के हवाले
  rationale: यह युद्ध में हिंसक विनाश का पारंपरिक रूपक है; हिंदी मुहावरा दिव्य न्याय और सौंपे जाने का भाव स्पष्ट करता है।
- source_word: אֶתֵּן
  choice: मैं ... हवाले कर दूँगा
  rationale: נתן का प्रथम पुरुष एकवचन रूप न्याय में वक्ता की प्रत्यक्ष क्रिया को बनाए रखता है; ‘हवाले कर दूँगा’ लक्ष्यसूचक ל के साथ स्वाभाविक हिंदी है।
theological_decisions:
- issue: दुर्बोध वाक्यांश וְיֶשְׁחֲךָ בְּקִרְבֶּךָ की व्याख्या
  choice: भीतर बने रहने वाला खालीपन या भूख
  alternative: तुम्हारा अपमान तुम्हारे बीच होगा; अथवा तुम्हारा धँसना/क्षीण होना तुम्हारे भीतर होगा
  rationale: आसपास का संदर्भ खाने पर भी तृप्त न होने और सब कुछ खोने का है, इसलिए ‘खालीपन’ समानांतरता में सर्वाधिक उपयुक्त है। फिर भी इब्रानी की वास्तविक शब्दगत कठिनाई को पादटिप्पणी में खुला रखा गया है।
translation_notes:
  register: आधुनिक मानक हिंदी में सरल किंतु भविष्यद्वक्तीय गरिमा वाला स्वर रखा गया है। ‘तुम’ एकवचन संबोधन को दर्शाता है। ‘तलवार के हवाले’ मूल के युद्ध-विनाश संबंधी रूपक को स्वाभाविक हिंदी में बनाए रखता है।
