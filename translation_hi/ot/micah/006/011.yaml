  text: הַ/אֶזְכֶּ֖ה בְּ/מֹ֣אזְנֵי רֶ֑שַׁע וּ/בְ/כִ֖יס אַבְנֵ֥י מִרְמָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/006/011.yaml
  text: Shall I acquit one with wicked scales and with a bag of deceptive weights?[a][b]
translation:
  language: hi
  text: क्या मैं अन्यायी तराज़ू और छल के बाटों की थैली रखने वाले को निर्दोष ठहराऊँ?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “क्या मैं अन्यायी तराज़ू और छल के बाटों की थैली के साथ शुद्ध हो सकता हूँ?” इब्रानी क्रिया का अर्थ “शुद्ध होना” अथवा “निर्दोष ठहराना/निर्दोष मानना” हो सकता है; प्रसंग न्यायिक अर्थ का समर्थन करता है।
    reason: alternative_reading
  - marker: b
    text: शाब्दिक रूप से, “छल के पत्थर”; व्यापार में पत्थरों को बाटों के रूप में इस्तेमाल किया जाता था।
    reason: lexical_alternative
lexical_decisions:
- source_word: הַ/אֶזְכֶּה
  choice: क्या मैं उसे निर्दोष ठहराऊँ
  rationale: זכה के प्रथम पुरुष एकवचन प्रश्नवाचक रूप को प्रसंग के न्यायिक अर्थ में लिया गया है। हिन्दी में कर्म ‘उसे’ जोड़ने से निहित व्यक्ति स्पष्ट होता है, बिना मूल आशय बदले।
- source_word: בְּ/מֹאזְנֵי
  choice: जिसके पास ... तराज़ू
  rationale: מֹאזְנַיִם व्यापार में तौलने के तराज़ू को दर्शाता है। संबंधसूचक हिन्दी वाक्य-रचना साधन रखने वाले व्यक्ति को स्वाभाविक ढंग से व्यक्त करती है।
- source_word: רֶשַׁע
  choice: दुष्टता के
  rationale: संज्ञात्मक संबंध ‘दुष्टता के तराज़ू’ मूल के नैतिक आरोप को बनाए रखता है; केवल ‘गलत’ या ‘बेईमान’ कहने की अपेक्षा यह רֶשַׁע की व्यापक नैतिक शक्ति को अधिक निकटता से रखता है।
- source_word: וּ/בְ/כִיס
  choice: और ... थैली
  rationale: כִּיס यहाँ व्यापारी द्वारा बाट रखने की थैली है; आधुनिक हिन्दी में ‘थैली’ स्पष्ट और सहज है।
- source_word: אַבְנֵי מִרְמָה
  choice: छल के बाटों
  rationale: शाब्दिक रूप ‘छल के पत्थर’ है, पर व्यापारिक संदर्भ में पत्थर बाटों के रूप में प्रयुक्त होते थे। ‘छल के बाट’ संदर्भगत अर्थ और मूल की संज्ञात्मक अभिव्यक्ति दोनों को सुरक्षित रखता है।
theological_decisions:
- issue: प्रश्न का कर्ता और न्यायिक आशय
  choice: वक्ता परमेश्वर है और पूछता है कि क्या वह बेईमान माप रखने वाले व्यक्ति को निर्दोष ठहरा सकता है।
  alternative: वक्ता पूछता है कि ऐसे अन्याय के रहते क्या वह स्वयं शुद्ध हो सकता है।
  rationale: मीका 6 के वाचा-विवाद और अभियोग के प्रसंग में प्रथम पुरुष को परमेश्वर की न्यायिक वाणी समझना अधिक संगत है। फिर भी זכה के ‘शुद्ध होना’ वाले संभावित अर्थ को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘निर्दोष ठहराऊँ’ न्यायिक स्वर को व्यक्त करता है; ‘तराज़ू’ और ‘बाट’ भारतीय हिन्दी में व्यापारिक तौल के स्वाभाविक शब्द हैं।
