source:
  edition: WLC
  text: וְ/יִשְׁתַּמֵּ֞ר חֻקּ֣וֹת עָמְרִ֗י וְ/כֹל֙ מַעֲשֵׂ֣ה בֵית אַחְאָ֔ב וַ/תֵּלְכ֖וּ בְּ/מֹֽעֲצוֹתָ֑/ם לְמַעַן֩ תִּתִּ֨/י אֹתְ/ךָ֜ לְ/שַׁמָּ֗ה וְ/יֹשְׁבֶ֨י/הָ֙ לִ/שְׁרֵקָ֔ה וְ/חֶרְפַּ֥ת עַמִּ֖/י תִּשָּֽׂאוּ־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/micah/006/016.yaml
  text: The statutes of Omri are kept[a], and all the works of the house of Ahab; and you walk in their counsels, so that I may make you a desolation, and her inhabitants an object of hissing[c][b], and you will bear the reproach of my people.
translation:
  language: hi
  text: ओम्री की विधियों का पालन किया जाता है, और अहाब के घराने के सारे कामों का भी; तुम उनकी सलाहों के अनुसार चलते हो, ताकि मैं तुम्हें उजाड़ कर दूँ और उसके निवासियों को सीटी बजाकर उपहास का विषय बना दूँ[a]; और तुम मेरी प्रजा की निन्दा सहोगे[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “सीटी बजाने के लिए”; अर्थात ऐसी वस्तु या स्थान जिसे देखकर लोग तिरस्कार में सीटी बजाएँ।
    reason: cultural_note
  - marker: b
    text: या “मेरी प्रजा के विरुद्ध निन्दा,” “मेरी प्रजा का अपमान,” अथवा “वह निन्दा जो मेरी प्रजा सहती है।” इब्रानी पद का संबंध संक्षिप्त है और एक से अधिक ढंग से समझा जा सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: וְיִשְׁתַּמֵּר
  choice: पालन किया जाता है
  rationale: निफ़ाल रूप को यहाँ कर्मवाच्य/निर्वैयक्तिक अर्थ में लेना स्वाभाविक है; यह विधियों के निरन्तर माने जाने का भाव रखता है।
- source_word: חֻקּוֹת עָמְרִי
  choice: ओम्री की विधियाँ
  rationale: חֻקּוֹת में निर्धारित नियमों या राजकीय विधानों का औपचारिक भाव है; आधुनिक हिन्दी में ‘विधियाँ’ इसे सहज रूप से व्यक्त करता है।
- source_word: מַעֲשֵׂה בֵית אַחְאָב
  choice: अहाब के घराने के सभी काम
  rationale: ‘काम’ कर्म और प्रचलित आचरण दोनों को समेटता है, जबकि ‘घराना’ वंशगत राजपरिवार का संकेत बनाए रखता है।
- source_word: וַתֵּלְכוּ בְּמֹעֲצוֹתָם
  choice: तुम उनकी सलाहों के अनुसार चलते हो
  rationale: चलने के आचरणात्मक रूपक को बनाए रखते हुए בְ को स्वाभाविक हिन्दी में ‘के अनुसार’ व्यक्त किया गया है।
- source_word: לְמַעַן תִּתִּי
  choice: इसलिए मैं ... दूँगा
  rationale: सन्दर्भ में לְמַעַן आचरण के परिणामस्वरूप आने वाले न्याय को जोड़ता है। हिन्दी में ‘इसलिए’ और भविष्यकाल घोषित परिणाम को स्वाभाविक बनाते हैं, यद्यपि उद्देश्यसूचक अर्थ भी सम्भव है।
- source_word: לְשַׁמָּה
  choice: उजाड़
  rationale: यह विनाश और निर्जनता दोनों का भाव संक्षेप में रखता है और आधुनिक हिन्दी में स्वाभाविक है।
- source_word: לִשְׁרֵקָה
  choice: उपहास की सीटी का विषय
  rationale: मूल के सीटी बजाकर तिरस्कार करने के ठोस सांस्कृतिक बिम्ब को केवल ‘उपहास’ कहकर खोया नहीं गया है।
- source_word: וְחֶרְפַּת עַמִּי תִּשָּׂאוּ
  choice: तुम मेरी प्रजा की निन्दा सहोगे
  rationale: נשא का ‘उठाना/ढोना/सहना’ भाव तथा חֶרְפַּת עַמִּי की संक्षिप्त रचना सुरक्षित रखी गई है; सम्बन्ध की अस्पष्टता पादटिप्पणी में बताई गई है।
theological_decisions:
- issue: ‘मेरी प्रजा की निन्दा’ का सम्बन्ध और आशय
  choice: मुख्य पाठ में ‘मेरी प्रजा की निन्दा’
  alternative: ‘मेरी प्रजा के विरुद्ध निन्दा’, ‘मेरी प्रजा का अपमान’, अथवा ‘वह निन्दा जो मेरी प्रजा सहती है’
  rationale: חֶרְפַּת עַמִּי एक संक्षिप्त संबंधकारक पद है और निन्दा की दिशा को स्पष्ट नहीं करता। मुख्य पाठ इसे किसी एक व्याख्या में सीमित नहीं करता।
- issue: לְמַעַן में उद्देश्य या परिणाम
  choice: ‘इसलिए’ द्वारा परिणामी न्याय
  alternative: ‘ताकि मैं तुम्हें उजाड़ कर दूँ’
  rationale: दोनों अर्थ व्याकरणतः सम्भव हैं। प्रसंग में लोगों के आचरण और घोषित दण्ड का परिणामी सम्बन्ध प्रमुख है; उद्देश्यसूचक सम्भावना पादटिप्पणी में दी गई है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध हिन्दी। समानान्तर वाक्यरचना और ‘चलते हो’ का नैतिक-आचरणात्मक रूपक रखा गया है। स्त्रीलिंग प्रत्यय को हिन्दी में स्वाभाविक बनाने के लिए ‘उसके निवासियों’ कहा गया है; इसका संकेत सम्बोधित नगर/स्थान की ओर है।
