review_pass:
  verdict: revise
  source_fidelity: The draft accurately preserves the causal connection, God's first-person actions, the collective singular address to Israel, the Exodus from Egypt, redemption/deliverance, and the three named leaders. ‘निकाल लाया’ is an idiomatic and contextually faithful Hindi rendering of the Exodus use of הֶעֱלִתִיךָ. ‘तुम्हारे आगे’ suitably retains the open sense of לְפָנֶיךָ.
  naturalness: The sentence is otherwise clear and appropriately dignified in modern standard Hindi. However, ‘दासों के घर’ naturally means a house belonging to slaves (or where slaves live), not the Hebrew idiom denoting the condition/place of enslavement.
  terminology: ‘दासता के घर’ is a clearer Hindi equivalent for בֵּית עֲבָדִים in this idiomatic Exodus formula. ‘छुड़ाया’ is natural and adequately conveys פדה here without adding an unstated payment mechanism. The established Hindi biblical forms मूसा, हारून, and मरियम are suitable.
  issues:
  - severity: medium
    issue: ‘दासों के घर से’ is semantically misleading in Hindi.
    rationale: The construct phrase בֵּית עֲבָדִים is an idiomatic designation of Israel’s enslaved condition/place of slavery. In Hindi, ‘दासों के घर’ most readily denotes the slaves’ own house, rather than a house of slavery. ‘दासता के घर’ communicates the intended sense naturally.
  revised_text: क्योंकि मैं तुम्हें मिस्र देश से निकाल लाया और दासता के घर से तुम्हें छुड़ाया; और मैंने तुम्हारे आगे मूसा, हारून और मरियम को भेजा।
  revised_footnotes: []
