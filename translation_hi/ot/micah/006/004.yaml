- from: क्योंकि मैं तुम्हें मिस्र देश से निकाल लाया और दासों के घर से तुम्हें छुड़ाया; और मैंने तुम्हारे आगे मूसा, हारून और मरियम को भेजा।
  to: क्योंकि मैं तुम्हें मिस्र देश से निकाल लाया और दासता के घर से तुम्हें छुड़ाया; और मैंने तुम्हारे आगे मूसा, हारून और मरियम को भेजा।
  rationale: A single lexical-idiomatic correction replaces ‘दासों के घर’ with ‘दासता के घर’ to prevent the possessive/home sense that the Hindi wording otherwise suggests. All other renderings are retained because they faithfully and naturally represent the Hebrew.
  reviewer_model: gpt-5.6-terra
