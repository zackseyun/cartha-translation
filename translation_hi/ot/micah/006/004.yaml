reference: Micah 6:4
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: כִּ֤י הֶעֱלִתִ֨י/ךָ֙ מֵ/אֶ֣רֶץ מִצְרַ֔יִם וּ/מִ/בֵּ֥ית עֲבָדִ֖ים פְּדִיתִ֑י/ךָ וָ/אֶשְׁלַ֣ח לְ/פָנֶ֔י/ךָ אֶת מֹשֶׁ֖ה אַהֲרֹ֥ן וּ/מִרְיָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/006/004.yaml
  text: For I brought you up from the land of Egypt[a], and from the house of slavery I redeemed you; and I sent before you Moses, Aaron, and Miriam.
translation:
  language: hi
  text: क्योंकि मैं तुम्हें मिस्र देश से निकाल लाया और दासता के घर से तुम्हें छुड़ाया; और मैंने तुम्हारे आगे मूसा, हारून और मरियम को भेजा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले कथन के आधार या स्पष्टीकरण को प्रस्तुत करता है और प्रसंग का तर्क-संबंध बनाए रखता है।
- source_word: הֶעֱלִתִיךָ
  choice: मैं तुम्हें ... से निकाल लाया
  rationale: हिफ़ील रूप का मूल भाव ‘ऊपर ले आना’ है, पर निर्गमन के संदर्भ में हिन्दी में ‘निकाल लाया’ स्वाभाविक है और गमन तथा उद्धार दोनों का भाव स्पष्ट करता है।
- source_word: מֵאֶרֶץ מִצְרַיִם
  choice: मिस्र देश से
  rationale: पूर्वसर्ग और स्थानवाचक पद का सीधा, स्वाभाविक हिन्दी रूप।
- source_word: מִבֵּית עֲבָדִים
  choice: दासों के घर से
  rationale: इब्रानी बहुवचन עֲבָדִים की ठोस सामाजिक स्थिति को बनाए रखते हुए ‘house’ की रूपकात्मक अभिव्यक्ति को भी सुरक्षित रखता है।
- source_word: פְּדִיתִיךָ
  choice: तुम्हें छुड़ाया
  rationale: פדה का अर्थ मूल्य देकर मुक्त करना अथवा बंधन से छुड़ाना हो सकता है। सामान्य आधुनिक हिन्दी में ‘छुड़ाया’ निर्गमन-संदर्भ को स्वाभाविक ढंग से व्यक्त करता है, बिना किसी बाद की सिद्धान्तगत विशिष्टता को आरोपित किए।
- source_word: וָאֶשְׁלַח
  choice: और मैंने ... भेजा
  rationale: सरल कथात्मक क्रिया का सीधा हिन्दी अनुवाद।
- source_word: לְפָנֶיךָ
  choice: तुम्हारे आगे
  rationale: स्थानिक ‘आगे’ और नेतृत्व में अग्रसर होने—दोनों संभावित भावों को खुला रखता है।
- source_word: אֶת מֹשֶׁה אַהֲרֹן וּמִרְיָם
  choice: मूसा, हारून और मरियम
  rationale: तीनों नामों को स्पष्ट रूप से सुरक्षित रखते हुए हिन्दी में प्रचलित बाइबलीय वर्तनी अपनाई गई है।
theological_decisions:
- issue: עֲבָדִים का निर्गमन-सूत्र में अनुवाद
  choice: दासों
  alternative: दासता
  rationale: ‘दासों’ मूल के ठोस बहुवचन और बंधुआ सामाजिक स्थिति को बनाए रखता है; ‘दासता का घर’ अधिक मुहावरेदार विकल्प है, पर मूल संज्ञा को अमूर्त बना देता है।
- issue: פדה का अनुवाद
  choice: छुड़ाया
  alternative: छुटकारा दिया / मोल लेकर छुड़ाया
  rationale: ‘छुड़ाया’ वास्तविक मुक्ति और उद्धार के भाव को व्यक्त करता है। ‘मोल लेकर छुड़ाया’ संभावित फिरौती-भाव को आवश्यकता से अधिक स्पष्ट कर सकता है, जबकि पद में कोई मूल्य या माध्यम नहीं बताया गया।
- issue: לְפָנֶיךָ में अगुवाई का भाव
  choice: तुम्हारे आगे
  alternative: तुम्हारे सामने
  rationale: ‘आगे’ इन व्यक्तियों के अग्रणी नेतृत्व का संभावित संकेत बनाए रखता है; ‘सामने’ केवल उपस्थिति का अर्थ दे सकता है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। एकवचन ‘तुम्हें/तुम्हारे’ मूल में इस्राएल को सामूहिक एकवचन के रूप में संबोधित किए जाने को दर्शाता है।
