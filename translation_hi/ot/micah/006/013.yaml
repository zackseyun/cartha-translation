    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם
  choice: इसलिए ... भी
  rationale: संदर्भ में यह पिछले आरोपों से दण्ड का निष्कर्ष जोड़ता है; ‘इसलिए’ निष्कर्षात्मक भाव और ‘भी’ גַם का बल बनाए रखता है।
- source_word: אֲנִי
  choice: मैंने
  rationale: मूल में स्पष्ट सर्वनाम वक्ता—यहोवा—के स्वयं न्याय करने पर बल देता है; हिन्दी क्रियारूप में प्रथम पुरुष स्पष्ट है।
- source_word: הֶחֱלֵיתִי
  choice: शुरू कर दिया है
  rationale: חלה के हिफ़ील रूप का अर्थ रोगी/निर्बल करना भी हो सकता है, पर अगले क्रियार्थक रूप ‘तुम्हें मारना’ के साथ आरम्भसूचक अर्थ वाक्य-विन्यास में स्वाभाविक है।
- source_word: הַכּוֹתֶךָ
  choice: तुम्हें मारना
  rationale: נכה के क्रियार्थक रूप और द्वितीय पुरुष एकवचन प्रत्यय को स्पष्ट, आधुनिक हिन्दी में व्यक्त करता है तथा दण्डात्मक प्रहार का भाव रखता है।
- source_word: הַשְׁמֵם
  choice: तुम्हें उजाड़ रहा हूँ
  rationale: שמם का हिफ़ील रूप विनाश और उजाड़ किए जाने का परिणाम बताता है; यह हिन्दी में स्वाभाविक और न्याय की तीव्रता के अनुरूप है।
- source_word: עַל
  choice: के कारण
  rationale: यहाँ עַל न्याय के आधार अथवा कारण को सूचित करता है।
- source_word: חַטֹּאתֶךָ
  choice: तुम्हारे पापों
  rationale: संदर्भ में पहले गिनाए गए अनेक वाचा-उल्लंघनों को देखते हुए बहुवचन अर्थ उपयुक्त है।
theological_decisions:
- issue: הֶחֱלֵיתִי הַכּוֹתֶךָ में परमेश्वर के न्याय का स्वरूप
  choice: ‘मैंने ... तुम्हें मारना शुरू कर दिया है’—आरम्भसूचक न्याय
  alternative: ‘मैंने तुम्हें मारकर रोगी/निर्बल कर दिया है’
  rationale: इब्रानी में दोनों संभावनाएँ हैं। क्रियार्थक रूप הַכּוֹתֶךָ के साथ आरम्भसूचक अर्थ अधिक स्वाभाविक है, पर रोगी या निर्बल करने का वास्तविक शाब्दिक विकल्प पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सीधा, गंभीर और गरिमापूर्ण न्याय-वचन। ‘मारना’ सामान्य पाठक के लिए स्पष्ट है, जबकि ‘उजाड़ रहा हूँ’ विनाश के परिणाम को स्वाभाविक ढंग से व्यक्त करता है।
