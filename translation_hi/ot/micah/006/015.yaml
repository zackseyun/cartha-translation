source:
  edition: WLC
  text: אַתָּ֥ה תִזְרַ֖ע וְ/לֹ֣א תִקְצ֑וֹר אַתָּ֤ה תִדְרֹֽךְ זַ֨יִת֙ וְ/לֹא תָס֣וּךְ שֶׁ֔מֶן וְ/תִיר֖וֹשׁ וְ/לֹ֥א תִשְׁתֶּה יָּֽיִן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/006/015.yaml
  text: You will sow[a], but you will not reap; you will tread olives, but you will not anoint yourself with oil; and you will tread out new wine, but you will not drink wine.
translation:
  language: hi
  text: तुम बोओगे, पर काटोगे नहीं; तुम जैतून रौंदोगे, पर अपने शरीर पर तेल नहीं लगाओगे; और नई दाखमदिरा के लिए अंगूर रौंदोगे[a], पर दाखमदिरा नहीं पीओगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से यहाँ “नई दाखमदिरा” है और इसके साथ अलग क्रिया नहीं दी गई; पिछले खंड की क्रिया “रौंदोगे” यहाँ भी लागू समझी जाती है। हिन्दी में आशय स्पष्ट करने के लिए “नई दाखमदिरा के लिए अंगूर रौंदोगे” कहा गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: תִזְרַע
  choice: बोओगे
  rationale: זרע का सामान्य अर्थ बीज बोना है; यह कृषि-बिंब को और आगे आने वाले 'काटोगे' के साथ उसके स्वाभाविक संबंध को बनाए रखता है।
- source_word: תִקְצוֹר
  choice: काटोगे नहीं
  rationale: קצר खड़ी फसल काटने का मानक क्रियापद है। आधुनिक हिन्दी में 'फसल काटना' स्वाभाविक है; संदर्भ से 'फसल' स्पष्ट होने के कारण संक्षिप्त रूप रखा गया है।
- source_word: תִדְרֹךְ זַיִת
  choice: जैतून रौंदोगे
  rationale: דרך का मूल अर्थ पैर से रौंदना है। यह जैतून से तेल निकालने के लिए उन्हें कुचलने का ठोस बिंब सुरक्षित रखता है।
- source_word: תָסוּךְ שֶׁמֶן
  choice: अपने शरीर पर तेल नहीं लगाओगे
  rationale: סוך शरीर पर तेल मलने या लगाने को व्यक्त करता है। 'तेल नहीं लगाओगे' आधुनिक हिन्दी में सहज है, और 'अपने शरीर पर' उपभोग के व्यक्तिगत अर्थ को स्पष्ट करता है।
- source_word: תִירוֹשׁ
  choice: अंगूर
  rationale: תירוש सामान्यतः नई दाखरस/ताज़ा अंगूरी उपज को दर्शाता है, पर דרך के लुप्त क्रियापद के साथ शाब्दिक 'नई दाखरस रौंदना' हिन्दी में अस्वाभाविक होगा। प्रक्रिया को स्पष्ट करने के लिए उत्पाद के स्रोत 'अंगूर' का प्रयोग किया गया है, जबकि पाद-टिप्पणी इब्रानी रूप बताती है।
- source_word: וְתִירוֹשׁ
  choice: और अंगूर रौंदोगे
  rationale: दूसरे खंड में क्रिया व्यक्त नहीं है; पिछले דרך ('रौंदोगे') को यहाँ आगे लागू समझा गया है। हिन्दी में वाक्य स्पष्ट करने के लिए क्रिया दोहराई गई है।
- source_word: תִשְׁתֶּה יָּיִן
  choice: दाखमधु नहीं पीओगे
  rationale: יין साधारण दाखमधु है। 'दाखमधु' गरिमापूर्ण और स्पष्ट हिन्दी शब्द है तथा अंगूरी उपज और अंतिम पेय के बीच संबंध बनाए रखता है।
- source_word: אַתָּה
  choice: तुम
  rationale: एकवचन प्रत्यक्ष संबोधन को 'तुम' से व्यक्त किया गया है। इब्रानी का दोहराया हुआ सर्वनाम हिन्दी में हर उपवाक्य में दोहराकर अनावश्यक बोझ नहीं बनाया गया, पर क्रियारूप संबोधन को निरंतर स्पष्ट रखते हैं।
theological_decisions:
- issue: न्याय के बिंब का स्वरूप
  choice: परिश्रम के निष्फल होने और उपज का आनंद न मिल पाने के रूप में न्याय
  alternative: केवल सामान्य दुर्भाग्य
  rationale: पद श्राप-जैसा क्रम प्रस्तुत करता है—बोना पर न काटना, उत्पादन करना पर उसका उपयोग न कर पाना। अनुवाद इस कठोर न्याय-बिंब को बनाए रखता है, पर 'वाचा' जैसे व्याख्यात्मक शब्द मूल पाठ में नहीं जोड़ता।
- issue: תירוש और יין का संबंध
  choice: पहले अंगूरी उपज/प्रक्रिया, फिर पीने योग्य दाखमधु
  alternative: दोनों को क्रमशः 'नई दाखरस' और 'दाखमधु' कहना
  rationale: मूल में शब्द अलग हैं और अर्थगत तनाव बना रहता है। हिन्दी की स्वाभाविकता के लिए रौंदने की वस्तु को 'अंगूर' कहा गया है, जबकि पाद-टिप्पणी मूल की अधिक शाब्दिक संरचना सुरक्षित रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण और प्रत्यक्ष भविष्यकाल रखा गया है। कृषि-न्याय की समानांतर संरचना सुरक्षित है। 'रौंदोगे' मूल बिंब को बनाए रखता है; 'अपने शरीर पर तेल लगाना' आज के पाठक के लिए סוך का आशय स्पष्ट करता है।
