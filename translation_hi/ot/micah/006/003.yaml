id: MIC.6.3
reference: Micah 6:3
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: עַמִּ֛/י מֶה עָשִׂ֥יתִי לְ/ךָ֖ וּ/מָ֣ה הֶלְאֵתִ֑י/ךָ עֲנֵ֥ה בִּֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/006/003.yaml
  text: My people[b][a], what have I done to you? How have I wearied you? Answer me.
translation:
  language: hi
  text: हे मेरी प्रजा, मैंने तुम्हारे साथ क्या किया है? मैंने किस तरह तुम्हें थका दिया है?[a] मुझे उत्तर दो।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मैंने किस तरह तुम पर बोझ डाला है?”
    reason: lexical_alternative
  - marker: b
    text: या, “मेरे विरुद्ध उत्तर दो” अथवा “मेरे विरुद्ध गवाही दो”; यह इस अंश की सम्भावित न्यायालयीन पृष्ठभूमि को दर्शाता है।
    reason: alternative_reading
lexical_decisions:
- source_word: עַמִּי
  choice: हे मेरी प्रजा
  rationale: यह प्रथम पुरुष एकवचन प्रत्यय के साथ संबोधन है। ‘हे मेरी प्रजा’ भविष्यद्वाणी के गरिमापूर्ण, प्रत्यक्ष और वाचागत संबोधन को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: מֶה עָשִׂיתִי לְךָ
  choice: मैंने तुम्हारे साथ क्या किया है?
  rationale: עשה के पूर्ण रूप और לְךָ से श्रोता की ओर निर्देशित कार्य का प्रश्न बनता है। हिन्दी में ‘तुम्हारे साथ क्या किया है’ आरोप के उत्तर में परमेश्वर की आलंकारिक चुनौती को स्वाभाविक रूप से रखता है।
- source_word: וּמָה הֶלְאֵתִיךָ
  choice: मैंने किस तरह तुम्हें थका दिया है?
  rationale: לאה का हिफ़ील रूप कारणवाचक अर्थ, ‘थका देना,’ रखता है। प्रश्नसूचक מָה यहाँ रीति या प्रकार पूछता है, इसलिए ‘किस तरह’ सहज है।
- source_word: עֲנֵה בִּי
  choice: मुझे उत्तर दो
  rationale: ענה का आज्ञार्थक रूप सीधे उत्तर देने को कहता है। בִּי को यहाँ स्वाभाविक हिन्दी में कर्म-संबंधी ‘मुझे’ से व्यक्त किया गया है; न्यायालयीन प्रसंग में ‘मेरे विरुद्ध गवाही दो’ की सम्भावना पादटिप्पणी में सुरक्षित है।
theological_decisions:
- issue: वाचा-संबंधी न्यायालयीन स्वर
  choice: 'मुख्य पाठ में परमेश्वर की सीधी, व्यक्तिगत चुनौती रखी गई है: ‘मुझे उत्तर दो।’'
  alternative: ‘मेरे विरुद्ध उत्तर दो’ अथवा ‘मेरे विरुद्ध गवाही दो।’
  rationale: आसपास का प्रसंग वाचा-विवाद या न्यायालयीन दृश्य सुझाता है, पर इस पद का इब्रानी वाक्यांश अनिवार्य रूप से विरोधात्मक अर्थ नहीं माँगता। पादटिप्पणी सम्भावित न्यायालयीन अर्थ को बनाए रखती है।
- issue: הֶלְאֵתִיךָ का कारणवाचक अर्थ
  choice: ‘तुम्हें थका दिया है’
  alternative: ‘तुम पर बोझ डाला है’
  rationale: मूल धातु का प्राथमिक कारणवाचक भाव थकाने का है; ‘बोझ डालना’ सन्दर्भगत सम्भावना है, इसलिए उसे पादटिप्पणी में रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण और प्रत्यक्ष भविष्यद्वाणी-संबोधन। एकवचन सामूहिक श्रोता के लिए ‘तुम्हारे/तुम्हें’ रखा गया है। प्रश्नों की तीक्ष्णता और मूल पाठ की सम्भावित न्यायालयीन अस्पष्टता दोनों सुरक्षित हैं।
