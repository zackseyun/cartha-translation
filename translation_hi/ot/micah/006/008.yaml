source:
  edition: WLC
  text: הִגִּ֥יד לְ/ךָ֛ אָדָ֖ם מַה טּ֑וֹב וּ/מָֽה יְהוָ֞ה דּוֹרֵ֣שׁ מִמְּ/ךָ֗ כִּ֣י אִם עֲשׂ֤וֹת מִשְׁפָּט֙ וְ/אַ֣הֲבַת חֶ֔סֶד וְ/הַצְנֵ֥עַ לֶ֖כֶת עִם אֱלֹהֶֽי/ךָ־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/micah/006/008.yaml
  text: He has told you[a], O man, what is good; and what does Yahweh require of you but to do justice, and to love steadfast love[b], and to walk humbly with your God?
translation:
  language: hi
  text: हे मनुष्य, उसने तुझे बता दिया है कि क्या भला है; और यहोवा तुझसे इसके सिवा और क्या अपेक्षा करता है कि तू न्याय करे, अटल प्रेम[a] से प्रेम रखे, और अपने परमेश्वर के साथ नम्रता से चले?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “अटल प्रेम” के लिए हिब्रू शब्द חֶסֶד है; इसका अनुवाद “दया,” “कृपा,” “निष्ठावान प्रेम,” या “वाचा की निष्ठा” भी किया जा सकता है।
    reason: lexical_alternative
  - marker: b
    text: “हे मनुष्य” मूल पाठ में एकवचन सम्बोधन है, जो प्रतिनिधि रूप में मानव को संबोधित करता है। “नम्रता से” का अर्थ “विनयपूर्वक” या संभवतः “सावधानी से” भी हो सकता है।
    reason: cultural_and_lexical_note
lexical_decisions:
- source_word: הִגִּיד לְךָ
  choice: उसने तुझे बता दिया है
  rationale: हिफ़ील रूप का अर्थ ‘ज्ञात कराना/बताना’ है। ‘बता दिया है’ पहले किए गए प्रकाशन और उसकी वर्तमान प्रासंगिकता दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: אָדָם
  choice: हे मनुष्य
  rationale: एकवचन सम्बोधन को बनाए रखते हुए यह सामान्य मानव प्रतिनिधि को संबोधित करता है; आधुनिक हिन्दी में गरिमापूर्ण और स्पष्ट है।
- source_word: מַה טּוֹב
  choice: कि भला क्या है
  rationale: טוֹב के व्यापक नैतिक अर्थ को ‘भला’ बनाए रखता है और उसे केवल ‘उचित’ या ‘लाभदायक’ तक सीमित नहीं करता।
- source_word: יְהוָה
  choice: यहोवा
  rationale: व्यक्तिगत दिव्य नाम को उपाधि ‘प्रभु’ में बदलने के बजाय प्रचलित हिन्दी लिप्यंतरण से सुरक्षित रखा गया है।
- source_word: דּוֹרֵשׁ מִמְּךָ
  choice: तुझसे ... चाहता है
  rationale: इस प्रसंग में דרש अपेक्षा या मांग को व्यक्त करता है। ‘चाहता है’ सहज हिन्दी है और प्रश्न की नैतिक शक्ति रखता है, बिना अनावश्यक कठोरता जोड़े।
- source_word: כִּי אִם
  choice: इसके सिवा और क्या
  rationale: प्रश्न में प्रयुक्त अपवादसूचक बल को स्वाभाविक हिन्दी वाक्य-विन्यास में व्यक्त करता है।
- source_word: עֲשׂוֹת מִשְׁפָּט
  choice: न्याय करे
  rationale: עשה की सक्रिय क्रिया और מִשְׁפָּט के नैतिक अर्थ ‘न्याय’ दोनों को संक्षेप और स्पष्टता से रखता है।
- source_word: אַהֲבַת חֶסֶד
  choice: अटल प्रेम से प्रेम रखे
  rationale: חֶסֶד के स्थायी, निष्ठावान और संबंधपरक प्रेम के आयाम को बनाए रखता है तथा हिब्रू में ‘प्रेम करना—प्रेम’ की अभिव्यक्ति को पूरी तरह मिटाता नहीं है।
- source_word: הַצְנֵעַ לֶכֶת
  choice: नम्रता से चले
  rationale: अव्ययी भाव को आचरण की नम्र मुद्रा के रूप में स्वाभाविक हिन्दी में व्यक्त करता है; ‘चलना’ जीवन-व्यवहार के रूपक को सुरक्षित रखता है।
- source_word: עִם אֱלֹהֶיךָ
  choice: अपने परमेश्वर के साथ
  rationale: עִם का सीधा अर्थ ‘साथ’ रखकर परमेश्वर के साथ संबंधपरक जीवन को व्यक्त करता है; इसे अधिक व्याख्यात्मक ‘सम्मुख’ नहीं बनाया गया।
theological_decisions:
- issue: חֶסֶד का अनुवाद
  choice: अटल प्रेम
  alternative: दया; कृपा; निष्ठावान प्रेम; वाचा की निष्ठा
  rationale: यह शब्द केवल करुणा नहीं, बल्कि स्थायी और निष्ठावान संबंधपरक प्रेम भी व्यक्त कर सकता है। ‘अटल प्रेम’ उस व्यापकता को पठनीय हिन्दी में रखता है; अन्य संभावनाएं पादटिप्पणी में दी गई हैं।
- issue: אָדָם का प्रतिनिधिक एकवचन सम्बोधन
  choice: हे मनुष्य
  alternative: हे मानव; मानवजाति
  rationale: मूल का एकवचन सम्बोधन सुरक्षित रखा गया है, पर इसका आशय केवल किसी एक पुरुष तक सीमित नहीं समझा गया। पादटिप्पणी प्रतिनिधिक प्रयोग स्पष्ट करती है।
- issue: הַצְנֵעַ की अर्थ-सीमा
  choice: नम्रता से
  alternative: सावधानी से; विनयपूर्वक
  rationale: शब्द दुर्लभ है और नम्र/संयत अथवा सावधान चाल का भाव दे सकता है। मुख्य पाठ में परिचित ‘नम्रता से’ रखा गया है और संभावित अर्थ-सीमा पादटिप्पणी में बताई गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी, एकवचन ‘तू/तेरा’ शैली में, क्योंकि मूल हिब्रू में सम्बोधन एकवचन है। भाषा गरिमापूर्ण पर सामान्य पाठक के लिए सहज रखी गई है। ‘यहोवा’ से दिव्य नाम को नाम के रूप में सुरक्षित रखा गया है।
