id: MIC.6.7
reference: Micah 6:7
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: הֲ/יִרְצֶ֤ה יְהוָה֙ בְּ/אַלְפֵ֣י אֵילִ֔ים בְּ/רִֽבְב֖וֹת נַֽחֲלֵי שָׁ֑מֶן הַ/אֶתֵּ֤ן בְּכוֹרִ/י֙ פִּשְׁעִ֔/י פְּרִ֥י בִטְנִ֖/י חַטַּ֥את נַפְשִֽׁ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/006/007.yaml
  text: Will Yahweh be pleased with thousands of rams[a], with ten thousands of streams of oil? Shall I give my firstborn for my transgression[c][b], the fruit of my body for the sin of my soul?
translation:
  language: hi
  text: क्या यहोवा हज़ारों मेढ़ों से, तेल की दसियों हज़ार धाराओं से प्रसन्न होगा?[a] क्या मैं अपने अपराध के लिए अपने पहलौठे को, अपने प्राण के पाप के लिए अपनी देह के फल को दे दूँ?[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “तेल की दसियों हज़ार नदियों/जलधाराओं से।” यह अभिव्यक्ति तेल की अपार मात्रा बताने वाली अतिशयोक्ति है।
    reason: lexical_alternative
  - marker: b
    text: “अपनी देह का फल” अपनी संतान के लिए प्रयुक्त इब्रानी मुहावरा है; इसका अनुवाद “अपनी कोख का फल” भी हो सकता है।
    reason: lexical_alternative
  - marker: c
    text: “अपने प्राण के पाप” का अनुवाद “अपने प्राण/जीवन की पापबलि” भी संभव है, यद्यपि यहाँ “अपने अपराध” के समानांतर “पाप” अधिक स्वाभाविक है।
    reason: alternative_reading
lexical_decisions:
- source_word: הֲיִרְצֶה
  choice: क्या ... प्रसन्न होगा?
  rationale: रצה यहाँ भेंट से प्रसन्न होने या उसे स्वीकार करने का भाव रखता है; प्रश्नवाचक रूप वाक्य की आलंकारिक चुनौती बनाए रखता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: इब्रानी चतुरक्षरीय निज नाम को प्रचलित हिन्दी लिप्यंतरण में रखा गया है, किसी उपाधि से प्रतिस्थापित नहीं किया गया।
- source_word: בְּאַלְפֵי אֵילִים
  choice: हज़ारों मेढ़ों से
  rationale: बलिदान-संदर्भ में אֵילִים का अर्थ मेढ़े है; संबंधसूचक ב को स्वाभाविक हिन्दी में ‘से’ द्वारा व्यक्त किया गया है।
- source_word: בְּרִבְבוֹת נַחֲלֵי שָׁמֶן
  choice: तेल की लाखों धाराओं से
  rationale: רִבְבוֹת अत्यंत विशाल संख्या और נַחֲלֵי जलधाराओं/नदियों का बिंब देता है। ‘लाखों धाराएँ’ हिन्दी में अतिशयोक्तिपूर्ण विपुलता और काव्यात्मक चित्र दोनों बचाता है।
- source_word: הַאֶתֵּן
  choice: क्या मैं ... दे दूँ?
  rationale: यह दूसरा आलंकारिक प्रश्न है; ‘दे दूँ’ प्रस्तावित चरम बलिदान की गंभीरता को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: בְּכוֹרִי
  choice: अपने पहलौठे को
  rationale: मूल में ‘पुत्र’ स्पष्टतः नहीं है; ‘पहलौठा’ प्रथम जन्मे संतान का अर्थ पाठ की सीमा में रहकर देता है।
- source_word: פִּשְׁעִי
  choice: अपने अपराध के लिए
  rationale: פשע उल्लंघन या विद्रोह का भार रखता है; ‘अपराध’ सामान्य पाठक के लिए स्पष्ट और प्रसंग में पर्याप्त गंभीर है।
- source_word: פְּרִי בִטְנִי
  choice: अपनी देह के फल को
  rationale: शाब्दिक देहगत बिंब को रखते हुए यह मुहावरा संतान की ओर संकेत करता है और वक्ता का लिंग अनावश्यक रूप से निश्चित नहीं करता।
- source_word: חַטַּאת נַפְשִׁי
  choice: अपने प्राण के पाप के लिए
  rationale: חַטָּאת यहाँ समानांतर ‘अपराध’ के कारण मुख्य पाठ में ‘पाप’ है; נֶפֶשׁ को ‘प्राण’ कहना व्यक्ति/जीवन की गहन संलग्नता को बनाए रखता है।
theological_decisions:
- issue: חַטַּאת का अर्थ ‘पाप’ हो या ‘पापबलि’
  choice: पाप
  alternative: पापबलि
  rationale: ‘अपने अपराध के लिए’ के समानांतर अमूर्त नैतिक अर्थ अधिक स्वाभाविक है, पर संज्ञा का बलिदान-संबंधी अर्थ संभव होने के कारण उसे पादटिप्पणी में रखा गया है।
- issue: क्या पद अत्यधिक भेंट या संतान-बलि को ईश्वरीय स्वीकृति देता है
  choice: आलंकारिक प्रश्नों के रूप में अनुवाद, स्वीकृति का संकेत दिए बिना
  alternative: इसे स्वीकार्य बलिदानों की सूची की तरह पढ़ना
  rationale: क्रमशः बढ़ती अतिशयोक्ति अंततः पहलौठे तक पहुँचती है। प्रश्नवाचक संरचना इस चौंकाने वाले प्रस्ताव को बिना नरम किए रखती है, पर यह नहीं कहती कि यहोवा ऐसी बलि चाहता है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध हिन्दी। दोनों आलंकारिक प्रश्न, मूल की बढ़ती हुई अतिशयोक्ति और संतान के लिए ठोस देहगत बिंब सुरक्षित रखे गए हैं। ‘यहोवा’ निज नाम के रूप में और ‘प्राण’ काव्यात्मक-व्यक्तिगत अर्थ के लिए चुना गया है।
