id: MIC.6.1
reference: Micah 6:1
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: שִׁמְעוּ נָ֕א אֵ֥ת אֲשֶׁר יְהוָ֖ה אֹמֵ֑ר ק֚וּם רִ֣יב אֶת הֶ/הָרִ֔ים וְ/תִשְׁמַ֥עְנָה הַ/גְּבָע֖וֹת קוֹלֶֽ/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/006/001.yaml
  text: 'Hear now what Yahweh says: Arise[a], contend before the mountains, and let the hills hear your voice.'
translation:
  language: hi
  text: 'अब सुनो कि याहवे क्या कहता है: “उठ, पहाड़ों के सामने अपना मुकदमा पेश कर[a], और पहाड़ियाँ तेरी आवाज़ सुनें।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “पहाड़ों से वाद-विवाद कर” अथवा “पहाड़ों के विरुद्ध मुकदमा ला।” इब्रानी क्रिया में कानूनी विवाद का भाव है; यहाँ पहाड़ सम्भवतः याहवे की वाचा-संबंधी न्याय-कार्यवाही में साक्षी के रूप में बुलाए गए हैं।
    reason: इब्रानी רִיב אֶת की विधिक अर्थछाया और ‘सामने/से/विरुद्ध’ की वास्तविक व्याकरणिक अस्पष्टता को सुरक्षित रखना।
lexical_decisions:
- source_word: שִׁמְעוּ נָא
  choice: अब सुनो
  rationale: बहुवचन आज्ञार्थक שִׁמְעוּ ध्यान से सुनने का आह्वान करता है और נָא आग्रह अथवा तात्कालिकता जोड़ता है; ‘अब सुनो’ आधुनिक हिन्दी में स्वाभाविक और भविष्यद्वक्ताई शैली के अनुकूल है।
- source_word: יְהוָה
  choice: याहवे
  rationale: मूल पाठ में प्रयुक्त परमेश्वर के व्यक्तिगत वाचा-नाम को किसी उपाधि से बदलने के बजाय हिन्दी में लिप्यंतरित किया गया है।
- source_word: אֹמֵר
  choice: कहता है
  rationale: यह कृदन्त यहाँ वर्तमान वचन-परिचय का काम करता है; ‘कहता है’ इसका सहज हिन्दी रूप है।
- source_word: קוּם
  choice: उठ
  rationale: यह पुल्लिंग एकवचन आज्ञार्थक है। ‘उठ’ मूल पाठ में बहुवचन श्रोताओं से एकवचन संबोधन की ओर होने वाले परिवर्तन को बनाए रखता है।
- source_word: רִיב
  choice: अपना मुकदमा पेश कर
  rationale: ריב में विवाद करने के साथ न्यायिक कार्यवाही का भाव भी है। ‘अपना मुकदमा पेश कर’ विधिक परिप्रेक्ष्य को स्पष्ट, सहज हिन्दी में व्यक्त करता है।
- source_word: אֶת הֶהָרִים
  choice: पहाड़ों के सामने
  rationale: ריב के साथ אֶת विवाद में सम्मिलित पक्ष को सूचित कर सकता है। प्रसंग में पहाड़ संभवतः प्रतिपक्षी नहीं, बल्कि वाचा के मुकदमे के साक्षी हैं; इसलिए मुख्य पाठ में ‘के सामने’ चुना गया, जबकि अन्य सम्भावनाएँ पादटिप्पणी में रखी गई हैं।
- source_word: וְתִשְׁמַעְנָה
  choice: और ... सुनें
  rationale: आज्ञार्थकों के बाद संयोजक सहित अपूर्ण क्रिया यहाँ इच्छार्थक भाव रखती है; ‘और ... सुनें’ उस भाव को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: הַגְּבָעוֹת
  choice: पहाड़ियाँ
  rationale: यह ‘पहाड़ों’ के समानांतर प्रयुक्त सामान्य भौगोलिक शब्द है; ‘पहाड़ियाँ’ काव्यात्मक समानांतरता बनाए रखता है।
- source_word: קוֹלֶךָ
  choice: तेरी आवाज़
  rationale: קוֹל का यहाँ सीधा अर्थ ‘आवाज़’ है और प्रत्यय पुल्लिंग एकवचन है; ‘तेरी’ एकवचन संबोधन को सुरक्षित रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: यह पद चतुरक्षरीय व्यक्तिगत नाम का सीधे प्रयोग करता है। ‘याहवे’ मूल वाचा-नाम को उपाधि से प्रतिस्थापित किए बिना प्रस्तुत करता है।
- issue: वाचा के मुकदमे में पहाड़ों की भूमिका
  choice: पहाड़ों के सामने
  alternative: पहाड़ों से; पहाड़ों के विरुद्ध
  rationale: अगली पंक्ति में पहाड़ियों को सुनने के लिए बुलाया गया है, इसलिए पहाड़ों को साक्षी मानना प्रसंगानुकूल है। फिर भी אֶת के कारण उन्हें विवाद में सम्मिलित पक्ष समझना व्याकरणतः सम्भव है; उस अस्पष्टता को पादटिप्पणी में रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और श्रव्य पाठ के लिए सहज रखी गई है। आरम्भिक बहुवचन ‘सुनो’ के बाद मूल इब्रानी में आए एकवचन ‘उठ…कर…तेरी’ को जानबूझकर सुरक्षित रखा गया है।
