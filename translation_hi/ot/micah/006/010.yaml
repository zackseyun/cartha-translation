base_translation:
  language: en
  yaml_path: translation/ot/micah/006/010.yaml
  text: Are there still in the house of the wicked treasures of wickedness[b][a], and a scant measure that is accursed?
translation:
  language: hi
  text: क्या दुष्ट के घर में अब भी दुष्टता के खजाने और शापित कम नाप[a][b] हैं?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में “एपा”; सूखी वस्तुओं का एक मानक माप। यहाँ इससे व्यापारी का नापने वाला पात्र भी अभिप्रेत हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या, “एक शापित घटा हुआ एपा।”
    reason: alternative_reading
lexical_decisions:
- source_word: עוֹד
  choice: अब भी
  rationale: यह निरंतरता बताता है और प्रश्न करता है कि क्या अन्यायपूर्ण व्यवहार अब तक जारी है।
- source_word: הַאִשׁ
  choice: क्या ... हैं
  rationale: पाठ कठिन है, पर संदर्भ में इसे प्रश्नवाचक रूप में समझना सबसे उपयुक्त है; हिन्दी में स्वाभाविक आलंकारिक प्रश्न बनाया गया है।
- source_word: בֵּית רָשָׁע
  choice: दुष्ट के घर में
  rationale: इब्रानी रचना किसी दुष्ट व्यक्ति के घर या गृहस्थी को दर्शाती है; हिन्दी में लिंग को अनावश्यक रूप से स्पष्ट किए बिना अर्थ सुरक्षित रहता है।
- source_word: אֹצְרוֹת רֶשַׁע
  choice: दुष्टता के खजाने
  rationale: शाब्दिक नैतिक और ठोस दोनों अर्थ बनाए रखता है; अन्याय से बटोरे धन का संकेत है, पर उसे मुख्य पाठ में व्याख्यात्मक रूप से नहीं खोला गया।
- source_word: אֵיפַת
  choice: नाप
  rationale: एपा सूखी वस्तुओं का मानक परिमाण और नापने का पात्र था; प्रसंग में व्यापारिक नाप अभिप्रेत है। साधारण पाठक के लिए 'नाप' स्वाभाविक है।
- source_word: רָזוֹן
  choice: घटता
  rationale: यह कम, अधूरा या मानक से छोटा नाप बताता है। 'घटता नाप' व्यापार में जानबूझकर कम देने का भाव व्यक्त करता है।
- source_word: זְעוּמָה
  choice: शापित
  rationale: यह तीव्र निंदा या शाप के अधीन होने का अर्थ रखता है; 'शापित' मूल की प्रबल नैतिक धार को बनाए रखता है।
theological_decisions:
- issue: कठिन आरंभिक पदबंध को प्रश्नवाचक मानना
  choice: 'आलंकारिक प्रश्न: ''क्या अब भी ... हैं?'''
  alternative: यह घोषणात्मक कथन कि दुष्ट के घर में अन्याय से पाया धन अब भी मौजूद है
  rationale: मीका 6 के निकटवर्ती संदर्भ में आरोप प्रश्नों के रूप में आते हैं; इसलिए प्रश्नवाचक पाठ प्रवाह के अनुकूल है, जबकि पाठ की कठिनाई को पादटिप्पणी में स्वीकार किया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज शैली रखी गई है। 'दुष्टता के खजाने' मूल की जानबूझकर सघन अभिव्यक्ति को सुरक्षित रखता है। 'घटता नाप' व्यापारिक बेईमानी को सामान्य पाठक के लिए समझने योग्य बनाता है। सभी पादटिप्पणी-चिह्न मुख्य पाठ में दिए गए हैं।
