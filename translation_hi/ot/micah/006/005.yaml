source:
  edition: WLC
  text: עַמִּ֗/י זְכָר נָא֙ מַה יָּעַ֗ץ בָּלָק֙ מֶ֣לֶךְ מוֹאָ֔ב וּ/מֶה עָנָ֥ה אֹת֖/וֹ בִּלְעָ֣ם בֶּן בְּע֑וֹר מִן הַ/שִּׁטִּים֙ עַד הַ/גִּלְגָּ֔ל לְמַ֕עַן דַּ֖עַת צִדְק֥וֹת יְהוָֽה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/006/005.yaml
  text: My people[a], please remember what Balak king of Moab planned[c][b], and what Balaam son of Beor answered him—from Shittim to Gilgal—so that you may know the righteous acts of Yahweh.
translation:
  language: hi
  text: हे मेरी प्रजा, कृपया याद करो कि मोआब के राजा बालाक ने क्या योजना बनाई[a], और बओर के पुत्र बिलाम ने उसे क्या उत्तर दिया—शित्तीम से गिलगाल तक[b]—ताकि तुम याहवे के न्यायपूर्ण कार्यों[c] को जान सको।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “क्या युक्ति की” अथवा “क्या षड्यंत्र रचा।”
    reason: יעץ के अर्थ-क्षेत्र में योजना, युक्ति और परामर्श सम्मिलित हैं; प्रसंग में विरोधी मंशा निहित है।
  - marker: b
    text: शित्तीम और गिलगाल स्थानों के नाम हैं। वे मोआब के मैदानों से देश में इस्राएल की यात्रा की याद दिलाते हैं।
    reason: इन स्थाननामों का ऐतिहासिक और भौगोलिक संकेत आधुनिक पाठक के लिए स्पष्ट करना उपयोगी है।
  - marker: c
    text: या, “याहवे के उद्धारकारी कार्यों” अथवा “याहवे की धार्मिकता के कार्यों।”
    reason: צִדְקוֹת न्यायपूर्ण, वाचा-निष्ठ और उद्धारकारी कामों का व्यापक अर्थ रख सकता है।
lexical_decisions:
- source_word: עַמִּי
  choice: हे मेरी प्रजा
  rationale: यह परमेश्वर द्वारा इस्राएल को किया गया संबंधपरक संबोधन है। ‘मेरी प्रजा’ वाचा के संबंध को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: זְכָר נָא
  choice: कृपया याद करो
  rationale: आज्ञार्थक क्रिया के साथ נָא आग्रह को कोमल बनाता है; ‘कृपया’ इस विनतीपूर्ण बल को बिना पुरातन भाषा के व्यक्त करता है।
- source_word: מַה יָּעַץ
  choice: क्या योजना बनाई
  rationale: यहाँ יעץ बालाक की इस्राएल-विरोधी युक्ति या योजना को सूचित करता है। ‘योजना बनाई’ सामान्य पाठक के लिए स्पष्ट है, जबकि ‘क्या परामर्श दिया’ इस प्रसंग में भ्रमित कर सकता है।
- source_word: בָּלָק מֶלֶךְ מוֹאָב
  choice: मोआब के राजा बालाक
  rationale: हिन्दी की स्वाभाविक पद-रचना में राजकीय उपाधि और नाम प्रस्तुत किए गए हैं।
- source_word: וּמֶה עָנָה אֹתוֹ
  choice: और ... ने उसे क्या उत्तर दिया
  rationale: मूल पाठ के ‘क्या’ और ענה के सीधे अर्थ ‘उत्तर देना’ को बनाए रखा गया है; उत्तर की प्रकृति की व्याख्या नहीं जोड़ी गई।
- source_word: בִּלְעָם בֶּן בְּעוֹר
  choice: बओर के पुत्र बिलाम
  rationale: व्यक्तिनामों का प्रचलित लिप्यंतरण करते हुए मूल की पितृनाम-संरचना सुरक्षित रखी गई है।
- source_word: מִן הַשִּׁטִּים עַד הַגִּלְגָּל
  choice: शित्तीम से गिलगाल तक
  rationale: दोनों स्थाननाम लिप्यंतरित किए गए हैं। डैश मूल वाक्य में इस पदबंध के ढीले और कुछ हद तक अस्पष्ट संबंध को बनाए रखते हैं, उसे केवल बिलाम के उत्तर से नहीं बाँधते।
- source_word: לְמַעַן דַּעַת
  choice: ताकि तुम ... जान सको
  rationale: उद्देश्यवाचक उपवाक्य को स्पष्ट आधुनिक हिन्दी में रखा गया है। प्रत्यक्ष संबोधन से निहित द्वितीय पुरुष कर्ता ‘तुम’ स्वाभाविक रूप से पूरा किया गया है।
- source_word: צִדְקוֹת
  choice: धर्ममय कार्यों
  rationale: बहुवचन शब्द परमेश्वर के न्यायपूर्ण, वाचा-निष्ठ और उद्धारकारी ऐतिहासिक कार्यों को समेट सकता है। ‘धर्ममय कार्य’ इस व्यापकता को ‘उद्धार के काम’ की अपेक्षा अधिक सुरक्षित रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: चार अक्षरों वाले परमेश्वर के व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय हिन्दी में लिप्यंतरित किया गया है।
theological_decisions:
- issue: צִדְקוֹת יְהוָה का अर्थ
  choice: याहवे के धर्ममय कार्य
  alternative: याहवे के उद्धारकारी कार्य; याहवे की धार्मिकता के कार्य
  rationale: पदबंध परमेश्वर के न्याय, वाचा-निष्ठा और इस्राएल के पक्ष में किए गए उद्धारकारी कामों को एक साथ सूचित कर सकता है। मुख्य पाठ में व्यापक अभिव्यक्ति रखी गई है और अधिक विशिष्ट संभावनाएँ पादटिप्पणी में दी गई हैं।
- issue: מִן הַשִּׁטִּים עַד הַגִּלְגָּל का वाक्यगत संबंध
  choice: डैशों के बीच स्वतंत्र स्मरण-सूचक पदबंध
  alternative: इसे केवल बिलाम के उत्तर से जोड़ना, या ‘शित्तीम से गिलगाल तक जो हुआ’ स्पष्ट रूप से जोड़ना
  rationale: इब्रानी में इस पदबंध का संबंध संक्षिप्त और अस्पष्ट है। विराम-चिह्न उसकी व्यापक ऐतिहासिक गूँज को बनाए रखते हैं और अनुपस्थित क्रिया जोड़कर अर्थ को अनावश्यक रूप से निश्चित नहीं करते।
translation_notes:
  register: भाषा आधुनिक, आदरपूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘हे’ संबोधन की गंभीरता बनाए रखता है, जबकि ‘कृपया याद करो’ आग्रह को स्वाभाविक हिन्दी में व्यक्त करता है। स्थाननाम और ‘याहवे’ लिप्यंतरित हैं; धर्मवैज्ञानिक अस्पष्टताओं को मुख्य पाठ और पादटिप्पणियों में सुरक्षित रखा गया है।
