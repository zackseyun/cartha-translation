  yaml_path: translation/ot/micah/006/009.yaml
  text: 'The voice of the LORD cries out to the city—and sound wisdom fears your name: hear the rod and him who appointed it.'
translation:
  language: hi
  text: यहोवा की वाणी नगर को पुकारती है—तेरे नाम को पहचानना सच्ची बुद्धिमानी है। छड़ी की सुनो, और उसकी भी जिसने उसे ठहराया है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ק֤וֹל יְהוָה֙
  choice: यहोवा की वाणी
  rationale: קול का सीधा अर्थ ‘वाणी/आवाज़’ है। परमेश्वर के व्यक्तिगत नाम יהוה को ‘यहोवा’ से दर्शाया गया है।
- source_word: וְתוּשִׁיָּ֖ה יִרְאֶ֣ה שְׁמֶ֑ךָ
  choice: और बुद्धिमानी इसी में है कि तेरे नाम का भय माना जाए
  rationale: MT का शाब्दिक विन्यास कठिन है। תושיה ‘खरी/व्यावहारिक बुद्धि’ और יראה, जैसा स्वरित पाठ है, ‘वह देखेगा’ हो सकता है; किंतु प्राचीन संस्करण और संदर्भ ‘भय मानना’ अर्थ का समर्थन करते हैं। हिन्दी में इस भाव को स्वाभाविक रखते हुए पाठ की धर्मवैचारिक धार सुरक्षित की गई है।
- source_word: שִׁמְע֥וּ מַטֶּ֖ה
  choice: छड़ी की सुनो
  rationale: מטה यहाँ दंड देने वाली छड़ी, अर्थात आने वाली ताड़ना, का बिंब है। असामान्य ‘छड़ी की सुनो’ को बनाए रखने से मूल रूपक सपाट नहीं होता।
- source_word: וּמִ֥י יְעָדָֽהּ
  choice: और उसकी भी जिसने उसे नियुक्त किया है
  rationale: יעד का अर्थ ‘नियुक्त/ठहराना’ लिया गया है; स्त्रीलिंग प्रत्यय छड़ी की ओर संकेत करता है। מי को कर्ता के रूप में रखकर मूल की संक्षिप्तता और हल्की अस्पष्टता बचाई गई है।
theological_decisions:
- issue: יִרְאֶה का अर्थ
  choice: तेरे नाम का भय माना जाए
  alternative: तेरा नाम देखेगा/पहचानेगा
  rationale: WLC की स्वर-रचना ‘देखेगा’ की अनुमति देती है, लेकिन प्राचीन पाठ-साक्ष्य, सामान्य हिब्रू अभिव्यक्ति ‘नाम का भय मानना’, और वाक्य का ज्ञान-संबंधी आशय ‘भय’ का मजबूत समर्थन करते हैं। इसे निर्विवाद पाठ-संशोधन की तरह नहीं, अर्थपूर्ण हिन्दी संरचना में प्रस्तुत किया गया है।
- issue: छड़ी को नियुक्त करने वाला
  choice: जिसने उसे नियुक्त किया है
  alternative: जिसने उसे ठहराया है / उसके लिए किसे नियुक्त किया गया है
  rationale: दंड के पीछे परमेश्वर की व्यवस्था का संकेत है, पर कर्ता का नाम जोड़कर मूल से अधिक स्पष्ट नहीं किया गया।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सार्वजनिक पाठ के अनुकूल हिन्दी। ‘यहोवा’ व्यक्तिगत नाम को स्पष्ट रखता है; ‘छड़ी की सुनो’ मूल के सजीव और जानबूझकर असामान्य रूपक को बनाए रखता है।
