source:
  edition: WLC
  text: בַּ/מָּה֙ אֲקַדֵּ֣ם יְהוָ֔ה אִכַּ֖ף לֵ/אלֹהֵ֣י מָר֑וֹם הַ/אֲקַדְּמֶ֣/נּוּ בְ/עוֹל֔וֹת בַּ/עֲגָלִ֖ים בְּנֵ֥י שָׁנָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/006/006.yaml
  text: With what shall I come before Yahweh[a], and bow myself before God on high? Shall I come before him with burnt offerings, with year-old calves?
translation:
  language: hi
  text: मैं क्या लेकर याहवे के सामने आऊँ और ऊँचाई पर स्थित परमेश्वर[a] के आगे झुकूँ? क्या मैं होमबलियाँ और एक वर्ष के बछड़े लेकर उसके सामने आऊँ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “परमप्रधान परमेश्वर।” इब्रानी वाक्यांश का शाब्दिक अर्थ “ऊँचाई का परमेश्वर” है।
    reason: मָרוֹם को वर्णनात्मक वाक्यांश अथवा महिमा-सूचक उपाधि के रूप में समझा जा सकता है।
lexical_decisions:
- source_word: בַּמָּה
  choice: मैं क्या लेकर
  rationale: प्रश्नवाचक पद में साधन या भेंट का भाव है; ‘क्या लेकर’ आधुनिक हिन्दी में स्वाभाविक रहते हुए इस भाव को स्पष्ट करता है।
- source_word: אֲקַדֵּם / הַאֲקַדְּמֶנּוּ
  choice: के सामने आऊँ / उसके सामने आऊँ
  rationale: קדם यहाँ किसी के सम्मुख आने या उससे मिलने के अर्थ में है। दोनों प्रयोगों में ‘सामने आऊँ’ रखकर मूल की पुनरावृत्ति और आराधना-संदर्भ सुरक्षित रखा गया है।
- source_word: יְהוָה
  choice: याहवे
  rationale: यह इब्रानी व्यक्तिवाचक दिव्य नाम का हिन्दी लिप्यंतरण है, न कि उसके स्थान पर प्रयुक्त कोई उपाधि।
- source_word: אִכַּף
  choice: के आगे झुकूँ
  rationale: निफ़अल रूप आदरपूर्वक शरीर झुकाने का संकेत देता है; यह अनावश्यक रूप से केवल भीतरी नम्रता का अर्थ नहीं जोड़ता।
- source_word: לֵאלֹהֵי מָרוֹם
  choice: ऊँचाई पर विराजमान परमेश्वर
  rationale: यह स्वाभाविक और गरिमापूर्ण हिन्दी में परमेश्वर की ऊँची, महान स्थिति का चित्र बनाए रखता है। इसे निश्चित उपाधि ‘परमप्रधान’ मानना संभव है, पर अनिवार्य नहीं; इसलिए विकल्प पाद-टिप्पणी में दिया गया है।
- source_word: בְעוֹלוֹת
  choice: होमबलियाँ लेकर
  rationale: עוֹלָה उस बलिदान का प्रचलित शब्द है जो वेदी पर पूर्णतः जलाया जाता था; बहुवचन को सुरक्षित रखा गया है।
- source_word: בַּעֲגָלִים בְּנֵי שָׁנָה
  choice: एक वर्ष के बछड़े लेकर
  rationale: वाक्यांश बछड़ों की आयु बताता है। ‘एक वर्ष के बछड़े’ हिन्दी में संक्षिप्त और स्पष्ट है।
theological_decisions:
- issue: दिव्य नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में चार अक्षरों वाला व्यक्तिवाचक दिव्य नाम सीधे आया है। उसका लिप्यंतरण नाम और उपाधि का भेद बनाए रखता है।
- issue: מָרוֹם को निश्चित उपाधि मानना या वर्णनात्मक वाक्यांश
  choice: ऊँचाई पर विराजमान परमेश्वर
  alternative: परमप्रधान परमेश्वर
  rationale: מָרוֹם का मूल अर्थ ऊँचाई या ऊँचा स्थान है और यह यहाँ वर्णनात्मक भी हो सकता है। मुख्य पाठ उस स्थानिक तथा महिमा-सूचक बिंब को रखता है; उपाधि के रूप में सम्भव पाठ पाद-टिप्पणी में सुरक्षित है।
translation_notes:
  register: भाषा आधुनिक, सहज और आराधना-संदर्भ के अनुरूप गरिमापूर्ण रखी गई है। प्रश्नों की समानांतर रचना तथा קדם की पुनरावृत्ति हिन्दी में यथासंभव सुरक्षित है।
