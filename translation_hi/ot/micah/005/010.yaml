  text: וְ/הִכְרַתִּ֖י עָרֵ֣י אַרְצֶ֑/ךָ וְ/הָרַסְתִּ֖י כָּל מִבְצָרֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/005/010.yaml
  text: And I will cut off the cities of your land, and I will tear down all your strongholds.
translation:
  language: hi
  text: और मैं तुम्हारे देश के नगरों को मिटा दूँगा और तुम्हारे सभी गढ़ों को ढा दूँगा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהִכְרַתִּי
  choice: और मैं ... मिटा दूँगा
  rationale: हिफ़ील रूप का अर्थ किसी वस्तु को काटकर अलग कर देना, हटा देना या समाप्त कर देना हो सकता है। नगरों के संदर्भ में ‘मिटा दूँगा’ स्वाभाविक हिन्दी में उनके उन्मूलन का भाव व्यक्त करता है, जबकि शाब्दिक ‘काट दूँगा’ अस्पष्ट होता।
- source_word: עָרֵי
  choice: नगरों
  rationale: עִיר का सामान्य अर्थ नगर या शहर है। ‘नगर’ आधुनिक, गरिमापूर्ण और इस भविष्यवाणी के साहित्यिक स्तर के अनुकूल है।
- source_word: אַרְצֶךָ
  choice: तुम्हारे देश के
  rationale: אֶרֶץ यहाँ उस भूभाग या देश को सूचित करता है जिसके नगर संबोधित समुदाय के हैं। हिन्दी में ‘तुम्हारे देश के नगर’ सहज और स्पष्ट है।
- source_word: וְהָרַסְתִּי
  choice: और ... ढा दूँगा
  rationale: הרס का ठोस अर्थ किसी निर्मित या किलेबंद वस्तु को गिराना या ढहा देना है। ‘ढा दूँगा’ गढ़ों के विध्वंस की भौतिक छवि बनाए रखता है।
- source_word: כָּל
  choice: सभी
  rationale: बहुवचन संज्ञा के साथ כָּל की समग्रता को ‘सभी’ स्वाभाविक रूप से व्यक्त करता है।
- source_word: מִבְצָרֶיךָ
  choice: तुम्हारे ... गढ़ों
  rationale: מִבְצָר किलेबंद स्थान या दुर्ग को दर्शाता है। ‘गढ़’ संक्षिप्त, समझने योग्य और सैन्य सुरक्षा का भाव रखने वाला हिन्दी शब्द है।
theological_decisions:
- issue: विनाशकारी क्रियाओं का कर्ता
  choice: प्रथम पुरुष ‘मैं’ को स्पष्ट रखा गया है
  alternative: कर्ता को कर्मवाच्य या अस्पष्ट रूप में प्रस्तुत करना
  rationale: इब्रानी पाठ में दोनों क्रियाओं का कर्ता स्पष्ट प्रथम पुरुष एकवचन है; संदर्भ में यह दिव्य वक्ता है। अनुवाद उस धर्मवैचारिक तनाव को नरम किए बिना बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; संक्षिप्त, भविष्यवाणी-सुलभ और गरिमापूर्ण शैली। ‘मिटा दूँगा’ तथा ‘ढा दूँगा’ के माध्यम से दोनों इब्रानी क्रियाओं का भेद रखा गया है।
