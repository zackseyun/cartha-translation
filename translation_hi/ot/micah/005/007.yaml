id: MIC.5.7
reference: Micah 5:7
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/הָיָה֩ שְׁאֵרִ֨ית יַעֲקֹ֜ב בַּ/גּוֹיִ֗ם בְּ/קֶ֨רֶב֙ עַמִּ֣ים רַבִּ֔ים כְּ/אַרְיֵה֙ בְּ/בַהֲמ֣וֹת יַ֔עַר כִּ/כְפִ֖יר בְּ/עֶדְרֵי צֹ֑אן אֲשֶׁ֧ר אִם עָבַ֛ר וְ/רָמַ֥ס וְ/טָרַ֖ף וְ/אֵ֥ין מַצִּֽיל׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/005/007.yaml
  text: And the remnant of Jacob will be among the nations[a], in the midst of many peoples, like a lion among the beasts of the forest, like a young lion among flocks of sheep, which, if it passes through, tramples and tears[b], and there is none to rescue.
translation:
  language: hi
  text: और याकूब का बचा हुआ भाग राष्ट्रों के बीच, बहुत-से लोगों के मध्य ऐसा होगा, जैसे जंगल के पशुओं के बीच सिंह, और भेड़ों के झुंडों के बीच जवान सिंह; वह यदि उनके बीच से गुज़रे, तो उन्हें रौंदता और फाड़ डालता है[a], और बचाने वाला कोई नहीं होता।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “रौंदता और टुकड़े-टुकड़े कर देता है।”
    reason: טרף की शिकारी-संदर्भ वाली तीव्रता को अधिक स्पष्ट करने वाला वैकल्पिक अनुवाद।
lexical_decisions:
- source_word: וְהָיָה
  choice: और ... ऐसा होगा
  rationale: भविष्यसूचक कथन के परिणामसूचक भाव को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है; ‘ऐसा’ आगे आने वाली उपमाओं से कथन को जोड़ता है।
- source_word: שְׁאֵרִית יַעֲקֹב
  choice: याकूब का बचा हुआ भाग
  rationale: שְׁאֵרִית के बचे हुए समुदाय के अर्थ को सामान्य पाठक के लिए स्पष्ट रखता है; केवल ‘शेष’ की अपेक्षा यह अधिक स्वाभाविक हिन्दी है।
- source_word: בַּגּוֹיִם
  choice: राष्ट्रों के बीच
  rationale: גּוֹיִם का व्यापक और कम व्याख्यात्मक अर्थ ‘राष्ट्र’ है; ‘गैर-यहूदी’ बाद की धार्मिक श्रेणी को अनावश्यक रूप से आयात कर सकता है।
- source_word: בְּקֶרֶב עַמִּים רַבִּים
  choice: बहुत-से लोगों के मध्य
  rationale: בְּקֶרֶב के ‘मध्य’ भाव और पहले पदांश के साथ काव्यात्मक समानांतरता को बनाए रखता है।
- source_word: כְּאַרְיֵה בְּבַהֲמוֹת יַעַר
  choice: जंगल के पशुओं के बीच सिंह
  rationale: בְּהֵמוֹת को सुलभ आधुनिक हिन्दी में ‘पशु’ कहा गया है और वन्य परिवेश की उपमा अक्षुण्ण रखी गई है।
- source_word: כִּכְפִיר
  choice: जवान सिंह
  rationale: כְּפִיר एक युवा और शक्तिशाली सिंह को सूचित करता है; ‘जवान सिंह’ हिन्दी में सजीव और स्वाभाविक है।
- source_word: בְּעֶדְרֵי צֹאן
  choice: भेड़ों के झुंडों के बीच
  rationale: עֶדְרֵי צֹאן का स्पष्ट सामूहिक अर्थ और शिकारी-शिकार की छवि दोनों सुरक्षित रहते हैं।
- source_word: אֲשֶׁר אִם עָבַר
  choice: वह यदि उनके बीच से गुज़रे
  rationale: אִם की वास्तविक शर्तसूचक अस्पष्टता को ‘यदि’ द्वारा बनाए रखा गया है; ‘जब’ निश्चितता बढ़ा देता। ‘उनके बीच से’ हिन्दी में क्रिया का संबंध स्पष्ट करता है।
- source_word: וְרָמַס וְטָרַף
  choice: उन्हें रौंदता और फाड़ डालता है
  rationale: दोनों हिंसक क्रियाओं का क्रम और शिकारी की छवि सजीव रहती है; ‘फाड़ डालता’ हिन्दी में טרף का स्वाभाविक अर्थ देता है।
- source_word: וְאֵין מַצִּיל
  choice: और बचाने वाला कोई नहीं होता
  rationale: मूल के बचावकर्ता के पूर्ण अभाव को सीधे व्यक्त करता है और अनावश्यक रूप से अधिक धर्मशास्त्रीय शब्दावली से बचता है।
theological_decisions:
- issue: राष्ट्रों के बीच बचे हुए याकूब की सिंह के रूप में उपमा
  choice: उपमा को प्रबलता और अप्रतिरोध्य सामर्थ्य के चित्र के रूप में यथावत रखा गया है, पर उसके साधन या पूर्ति को निश्चित नहीं किया गया।
  alternative: इसे विशेष रूप से सैनिक विजय, राजनीतिक प्रभुत्व या किसी निश्चित युगांत-संबंधी योजना के रूप में समझाना।
  rationale: इब्रानी पाठ हिंसक और प्रभुत्वपूर्ण सिंह-उपमा देता है, किंतु यह स्पष्ट नहीं करता कि इसकी पूर्ति सैनिक, राजनीतिक या किसी अन्य प्रकार की होगी; अनुवाद उस तनाव को खुला रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, काव्यात्मक और सामान्य पाठक के लिए सुलभ शैली अपनाई गई है। ‘बचा हुआ भाग’ समुदायगत अवशेष का अर्थ स्पष्ट करता है; सिंह की हिंसक उपमा को नरम या संकीर्ण धर्मशास्त्रीय अर्थ में सीमित नहीं किया गया।
