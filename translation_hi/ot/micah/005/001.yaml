source:
  edition: WLC
  text: וְ/אַתָּ֞ה בֵּֽית לֶ֣חֶם אֶפְרָ֗תָה צָעִיר֙ לִֽ/הְיוֹת֙ בְּ/אַלְפֵ֣י יְהוּדָ֔ה מִמְּ/ךָ֙ לִ֣/י יֵצֵ֔א לִֽ/הְי֥וֹת מוֹשֵׁ֖ל בְּ/יִשְׂרָאֵ֑ל וּ/מוֹצָאֹתָ֥י/ו מִ/קֶּ֖דֶם מִ/ימֵ֥י עוֹלָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/005/001.yaml
  text: But you[a], Bethlehem Ephrathah, too small to be among the clans of Judah, from you one will come out for me to be ruler in Israel, whose goings forth are from of old[b], from the days of eternity.
translation:
  language: hi
  text: पर तू, हे बेतलेहेम एप्राता, यहूदा के कुलों[a] में शामिल होने के लिए बहुत छोटा है; फिर भी तुझमें से मेरे लिए एक जन निकलेगा, जो इस्राएल में शासक होगा। उसके निकलने प्राचीन समय से, अनन्त काल के दिनों से हैं[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “यहूदा के हजारों में।” यहाँ “हजार” किसी कुल या कुल-आधारित प्रशासनिक इकाई को सूचित कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: या, “उसके उद्गम प्राचीन समय से, पुराने दिनों से हैं।” इब्रानी को अधिक प्रबल अर्थ में “अनन्तकाल से” भी समझा जा सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: בֵּית לֶחֶם אֶפְרָתָה
  choice: बेतलेहेम एप्राता
  rationale: दोनों स्थान-सूचक नामों का लिप्यंतरण करके इस बेतलेहेम की विशिष्ट पहचान सुरक्षित रखी गई है।
- source_word: צָעִיר לִהְיוֹת בְּאַלְפֵי יְהוּדָה
  choice: यहूदा के कुलों में गिने जाने लायक बहुत छोटा
  rationale: צָעִיר और उद्देश्य/परिणामसूचक infinitive का भाव स्वाभाविक हिन्दी में व्यक्त किया गया है। אַלְפֵי का प्रशासनिक-सामाजिक अर्थ यहाँ ‘कुल’ है; उसका शाब्दिक अर्थ पादटिप्पणी में दिया गया है।
- source_word: מִמְּךָ לִי יֵצֵא
  choice: तुझमें से मेरे लिए एक जन निकलेगा
  rationale: ‘तुझमें से’ नगर से आने वाले व्यक्ति को दर्शाता है और לִי को बिना अतिरिक्त धार्मिक व्याख्या के ‘मेरे लिए’ रखा गया है। कर्ता को हिन्दी में स्पष्ट करने के लिए ‘एक जन’ जोड़ा गया है।
- source_word: לִהְיוֹת מוֹשֵׁל בְּיִשְׂרָאֵל
  choice: जो इस्राएल में शासक होगा
  rationale: מוֹשֵׁל के शासन-संबंधी अर्थ और בְּ के निकट अर्थ ‘में’—दोनों को स्वाभाविक हिन्दी में रखा गया है।
- source_word: מוֹצָאֹתָיו
  choice: उसका निकलना
  rationale: शब्द के יצא (‘निकलना’) से संबंध को बनाए रखकर ‘उद्गम’ जैसे अधिक निर्णायक अर्थ को मुख्य पाठ में आरोपित नहीं किया गया। हिन्दी में भाववाचक एकवचन अधिक स्वाभाविक है; वैकल्पिक ‘मूल/उद्गम’ पादटिप्पणी में स्पष्ट है।
- source_word: מִקֶּדֶם מִימֵי עוֹלָם
  choice: प्राचीनकाल से, अनादिकाल के दिनों से
  rationale: קֶדֶם के प्राचीन समय और עוֹלָם के दीर्घ, असीम अथवा शाश्वत काल—दोनों संकेतों को बनाए रखने के लिए यह गंभीर किंतु बोधगम्य अभिव्यक्ति चुनी गई है।
theological_decisions:
- issue: अंतिम उपवाक्य प्राचीन ऐतिहासिक उद्गम बताता है या अनन्त पूर्व-अस्तित्व
  choice: ‘उसका निकलना प्राचीनकाल से, अनादिकाल के दिनों से है’
  alternative: ‘उसका मूल प्राचीन समय से, पुराने दिनों से है’ अथवा अधिक प्रबल रूप में ‘अनन्तकाल से है’
  rationale: इब्रानी מוֹצָאֹתָיו और עוֹלָם प्राचीन उद्गम से लेकर अधिक प्रबल अनादि-अस्तित्व तक अर्थ-संभावना रखते हैं। मुख्य पाठ इस धर्मवैज्ञानिक तनाव को खुला रखता है और पादटिप्पणी अधिक सामान्य ऐतिहासिक पठन बताती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में आदरपूर्ण, भविष्यवाणी-संगत शैली रखी गई है। ‘हे’ और ‘एक जन’ पाठ को स्पष्ट और गरिमामय बनाते हैं; शब्दावली किसी विशिष्ट सम्प्रदाय की मसीही व्याख्या को सीधे पाठ में आरोपित नहीं करती।
