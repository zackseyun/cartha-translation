source:
  edition: WLC
  text: וְ/עָמַ֗ד וְ/רָעָה֙ בְּ/עֹ֣ז יְהוָ֔ה בִּ/גְא֕וֹן שֵׁ֖ם יְהוָ֣ה אֱלֹהָ֑י/ו וְ/יָשָׁ֕בוּ כִּֽי עַתָּ֥ה יִגְדַּ֖ל עַד אַפְסֵי אָֽרֶץ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/005/003.yaml
  text: And he will stand and shepherd in the strength of Yahweh[a], in the majesty of the name of Yahweh his God. And they will dwell secure[b], for now he will be great to the ends of the earth.
translation:
  language: hi
  text: और वह खड़ा होगा और याहवे की सामर्थ्य में, अपने परमेश्वर याहवे के नाम के प्रताप में चरवाही करेगा। और वे निश्चिंत होकर बसेंगे[a], क्योंकि अब[b] वह पृथ्वी के छोरों तक महान होगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से ‘वे बसेंगे’ या ‘वे रहेंगे’; प्रसंग में सुरक्षा और निश्चिंतता का भाव निहित है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में ‘अब’ है। भविष्यसूचक क्रम को सहज बनाने के लिए कुछ अनुवाद इसे ‘तब’ कहते हैं।
    reason: alternative_reading
lexical_decisions:
- source_word: וְעָמַד
  choice: और वह खड़ा होकर
  rationale: עמד का मूल अर्थ ‘खड़ा होना’ है। यह भावी शासक के अपने स्थान पर दृढ़ होकर कार्य करने की ठोस छवि को बनाए रखता है।
- source_word: וְרָעָה
  choice: चरवाही करेगा
  rationale: רעה का अर्थ पशु चराना, देखभाल करना या चरवाही करना है। शासक-संबंधी प्रसंग में ‘चरवाही करेगा’ ग्रामीण और राजकीय दोनों भावों को सुरक्षित रखता है।
- source_word: בְּעֹז יְהוָה
  choice: याहवे की सामर्थ्य में
  rationale: עֹז शक्ति या सामर्थ्य को दर्शाता है और ב यहाँ उस सामर्थ्य के आधार अथवा क्षेत्र को व्यक्त करता है। ‘में’ मूल संरचना के निकट रहते हुए स्वाभाविक हिन्दी देता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत नाम יהוה को उपाधि से बदलने के बजाय हिन्दी लिप्यंतरण ‘याहवे’ से व्यक्त किया गया है।
- source_word: בִּגְאוֹן שֵׁם יְהוָה אֱלֹהָיו
  choice: अपने परमेश्वर याहवे के नाम के प्रताप में
  rationale: גאון यहाँ महिमा, वैभव या प्रताप का बोध कराता है। ‘प्रताप’ राजकीय संदर्भ में स्वाभाविक है और ‘अपने परमेश्वर’ मूल के אֱלֹהָיו को स्पष्ट रूप से सुरक्षित रखता है।
- source_word: וְיָשָׁבוּ
  choice: और वे निश्चिंत होकर बसेंगे
  rationale: ישב का मूल अर्थ बैठना, रहना या बसना है। प्रसंग में सुरक्षा निहित है; ‘निश्चिंत होकर बसेंगे’ मूल क्रिया और प्रसंगगत सुरक्षा दोनों को सहज हिन्दी में व्यक्त करता है।
- source_word: כִּי עַתָּה
  choice: क्योंकि अब
  rationale: כִּי कारण प्रस्तुत करता है और עַתָּה का सामान्य अर्थ ‘अब’ है। भविष्यसूचक क्रम को सहज बनाने के लिए इसे ‘तब’ नहीं किया गया।
- source_word: יִגְדַּל
  choice: वह ... महान होगा
  rationale: גדל यहाँ महानता या उत्कर्ष व्यक्त करता है। ‘महान होगा’ विकास की अनावश्यक धारणा जोड़े बिना भाव को सीधा रखता है।
- source_word: עַד אַפְסֵי אָרֶץ
  choice: पृथ्वी के छोरों तक
  rationale: यह मुहावरा पृथ्वी के सबसे दूरस्थ भागों को दर्शाता है; ‘पृथ्वी के छोरों तक’ सटीक और प्रचलित हिन्दी अभिव्यक्ति है।
theological_decisions:
- issue: एकवचन क्रियाओं का कर्ता
  choice: पूर्ववर्ती प्रसंग के आने वाले शासक को केवल ‘वह’ कहा गया है।
  alternative: अनुवाद में सीधे ‘मसीह’ या ‘राजा’ जोड़ना।
  rationale: इस पद में केवल तीसरे पुरुष की एकवचन क्रियाएँ हैं। इसलिए संभावित मसीही अभिप्राय को न नकारते हुए भी ऐसा पदनाम नहीं जोड़ा गया जो इब्रानी पाठ में नहीं है।
- issue: शासक के संबंध में אֱלֹהָיו
  choice: ‘अपने परमेश्वर’ को यथावत रखा गया है।
  alternative: मसीह-विज्ञान से जुड़ा तनाव कम करने के लिए इसे पुनर्लिखित या अस्पष्ट करना।
  rationale: इब्रानी स्पष्ट रूप से ‘उसका/अपने परमेश्वर’ कहता है। अनुवाद इस अभिव्यक्ति को बिना धार्मिक समायोजन के बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘चरवाही करेगा’ ने пастoral और राजकीय दोनों छवियाँ सुरक्षित रखी हैं; ‘याहवे’ को व्यक्तिगत नाम के रूप में लिप्यंतरित किया गया है।
