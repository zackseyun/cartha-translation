  text: תָּרֹ֥ם יָדְ/ךָ֖ עַל צָרֶ֑י/ךָ וְ/כָל אֹיְבֶ֖י/ךָ יִכָּרֵֽתוּ־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/micah/005/008.yaml
  text: May your hand be lifted up over your adversaries[a], and may all your enemies be cut off.
translation:
  language: hi
  text: तेरा हाथ तेरे विरोधियों के ऊपर ऊँचा उठे, और तेरे सभी शत्रु मिटा दिए जाएँ।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या: “तेरा हाथ तेरे विरोधियों के ऊपर ऊँचा उठेगा, और तेरे सभी शत्रु मिटा दिए जाएँगे।” इब्रानी की अपूर्ण क्रियाओं को भविष्यकालीन कथन के रूप में भी समझा जा सकता है।'
    reason: alternative_reading
lexical_decisions:
- source_word: תָּרֹם
  choice: ऊँचा उठे
  rationale: रूּם के क़ाल अपूर्ण रूप का अनुवाद है। स्त्रीलिंग कर्ता ‘हाथ’ के साथ यह विजय और प्रभुत्व का ठोस चित्र प्रस्तुत करता है; इसलिए अधिक अमूर्त ‘महिमामंडित हो’ की अपेक्षा ‘ऊँचा उठे’ चुना गया।
- source_word: יָדְךָ
  choice: तेरा हाथ
  rationale: मूल बिंब को यथावत रखा गया है। यहाँ ‘हाथ’ सामर्थ्य और विजय का द्योतक है, और यह प्रयोग हिन्दी में भी सहज है।
- source_word: עַל
  choice: के ऊपर
  rationale: यह विरोधियों पर श्रेष्ठता और विजय का स्थानिक बिंब बनाए रखता है; ‘के विरुद्ध’ सम्भव है, पर उससे ऊँचा उठने का दृश्यात्मक पक्ष कम हो जाता है।
- source_word: צָרֶיךָ
  choice: तेरे विरोधियों
  rationale: צַר शत्रुतापूर्ण प्रतिद्वंद्वियों को दर्शाता है। ‘विरोधियों’ से अगले खंड के אֹיְבֶיךָ (‘शत्रु’) के साथ हल्का शब्दगत भेद भी बना रहता है।
- source_word: וְכָל
  choice: और ... सभी
  rationale: समस्तता के भाव को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: אֹיְבֶיךָ
  choice: तेरे सभी शत्रु
  rationale: אֹיֵב का सामान्य और स्पष्ट हिन्दी प्रतिशब्द ‘शत्रु’ है; यह पहले खंड के ‘विरोधियों’ से समानांतरता रखते हुए अनावश्यक पुनरुक्ति से बचता है।
- source_word: יִכָּרֵתוּ
  choice: मिटा दिए जाएँ
  rationale: כרת के निफ़अल रूप का मूल अर्थ ‘काट दिए जाएँ/अलग कर दिए जाएँ’ है। व्यक्तियों के नाश के प्रसंग में ‘मिटा दिए जाएँ’ आधुनिक हिन्दी में स्वाभाविक है और निष्क्रिय भाव को बनाए रखता है, यद्यपि काटे जाने का ठोस रूपक कुछ नरम हो जाता है।
theological_decisions:
- issue: भविष्यसूचक प्रसंग में दोनों अपूर्ण क्रियाओं का भाव
  choice: 'इच्छा अथवा प्रार्थना-सदृश भाव: ‘ऊँचा उठे ... मिटा दिए जाएँ’'
  alternative: 'भविष्यवाणी: ‘ऊँचा उठेगा ... मिटा दिए जाएँगे’'
  rationale: इब्रानी अपूर्ण रूप यहाँ इच्छासूचक भाव में समझे जा सकते हैं, पर साधारण भविष्य का अर्थ भी व्याकरणतः सम्भव है। मुख्य पाठ इच्छासूचक तनाव को रखता है और पादटिप्पणी भविष्यसूचक पाठ को सुरक्षित करती है।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। एकवचन ‘तेरा’ मूल पाठ के द्वितीय पुरुष एकवचन को सुरक्षित रखता है; संबोधन सामूहिक समुदाय से होने पर भी उसे बहुवचन में नहीं बदला गया।
