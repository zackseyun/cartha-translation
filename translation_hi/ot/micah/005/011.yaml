source:
  edition: WLC
  text: וְ/הִכְרַתִּ֥י כְשָׁפִ֖ים מִ/יָּדֶ֑/ךָ וּֽ/מְעוֹנְנִ֖ים לֹ֥א יִֽהְיוּ לָֽ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/005/011.yaml
  text: And I will cut off sorceries from your hand[b][a], and you will have no soothsayers.
translation:
  language: hi
  text: और मैं तेरे हाथ से जादू-टोने[a] हटा दूँगा, और तेरे बीच शकुन देखने वाले[b] नहीं रहेंगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘टोने-टोटके’।
    reason: lexical_alternative
  - marker: b
    text: या ‘भविष्य बताने वाले’।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִכְרַתִּי
  choice: और मैं ... मिटा दूँगा
  rationale: हिफ़ील रूप का अर्थ काटकर अलग करना, हटा देना या समाप्त कर देना है। यहाँ प्रथाओं के उन्मूलन के लिए सहज आधुनिक हिन्दी में ‘मिटा दूँगा’ उपयुक्त है।
- source_word: כְשָׁפִים
  choice: जादू-टोने
  rationale: बहुवचन संज्ञा जादुई अथवा तांत्रिक क्रियाओं को सूचित करती है। ‘जादू-टोने’ सामान्य पाठक के लिए स्पष्ट है और किसी अत्यधिक संकीर्ण विधि को निर्दिष्ट नहीं करता।
- source_word: מִיָּדֶךָ
  choice: तेरे हाथ से
  rationale: हिब्रू बिंब को सीधे बनाए रखता है; ‘हाथ’ अधिकार, साधन या व्यवहार में होने का भाव दे सकता है।
- source_word: וּמְעוֹנְנִים
  choice: शकुन-विचारने वाले
  rationale: यह रूप शकुन अथवा संकेतों से भविष्य जानने का दावा करने वाले व्यक्तियों को दर्शाता है। यह ‘जादू-टोने’ से कर्ता और क्रिया का भेद भी बनाए रखता है।
- source_word: לֹא יִהְיוּ לָךְ
  choice: तेरे बीच ... नहीं रहेंगे
  rationale: शाब्दिक अर्थ ‘तेरे लिए/तेरे पास नहीं होंगे’ है। सन्दर्भ में हिन्दी का यह प्रयोग ऐसे लोगों के समुदाय में न रहने का आशय स्वाभाविक रूप से व्यक्त करता है।
theological_decisions:
- issue: निन्दित प्रथाओं की प्रकृति
  choice: पद को जादुई प्रथाओं और शकुन देखकर भविष्य बताने वाले उनके साधकों को परमेश्वर द्वारा अपने लोगों में से हटाने की घोषणा के रूप में रखा गया है।
  alternative: מְעוֹנְנִים को व्यापक रूप से ‘भविष्य बताने वाले’ या ‘ज्योतिषी’ कहा जा सकता है।
  rationale: हिब्रू शब्द शकुन अथवा संकेत-आधारित भविष्य-कथन की ओर संकेत करता है, पर उसकी ठीक विधि निश्चित नहीं करता; इसलिए मुख्य पाठ स्पष्ट रहते हुए अनावश्यक तकनीकी विशिष्टता से बचता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज शैली। एकवचन सम्बोधन के कारण ‘तेरे’ रखा गया है। ‘तेरे हाथ से’ मूल बिंब को सुरक्षित रखता है, जबकि ‘तेरे बीच’ अन्तिम हिब्रू वाक्यांश का सन्दर्भानुकूल स्वाभाविक रूप है।
