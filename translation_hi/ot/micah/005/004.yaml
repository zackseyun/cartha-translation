source:
  edition: WLC
  text: וְ/הָיָ֥ה זֶ֖ה שָׁל֑וֹם אַשּׁ֣וּר כִּֽי יָב֣וֹא בְ/אַרְצֵ֗/נוּ וְ/כִ֤י יִדְרֹךְ֙ בְּ/אַרְמְנֹתֵ֔י/נוּ וַ/הֲקֵמֹ֤נוּ עָלָי/ו֙ שִׁבְעָ֣ה רֹעִ֔ים וּ/שְׁמֹנָ֖ה נְסִיכֵ֥י אָדָֽם׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/005/004.yaml
  text: And he will be peace[a]. When Assyria comes into our land and treads in our citadels[c][b], then we will raise up against him seven shepherds and eight princes of men.
translation:
  language: hi
  text: और वही शान्ति होगा। जब अश्शूर[a] हमारे देश में आएगा और हमारे गढ़ों[b] में कदम रखेगा, तब हम उसके विरुद्ध सात चरवाहे और मनुष्यों के आठ प्रधान[c] खड़े करेंगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘अश्शूर’ का अर्थ देश अश्शूर भी हो सकता है और व्यक्तिरूप में ‘अश्शूरी आक्रमणकारी’ भी।
    reason: alternative_reading
  - marker: b
    text: या ‘महलों’; इब्रानी शब्द राजमहलों अथवा किलाबन्द गढ़ों के लिए प्रयुक्त हो सकता है।
    reason: lexical_alternative
  - marker: c
    text: ‘सात ... और आठ’ इब्रानी में ऐसी संख्या-अभिव्यक्ति है जो पर्याप्त या प्रचुर संख्या का संकेत दे सकती है।
    reason: cultural_note
lexical_decisions:
- source_word: וְהָיָה זֶה
  choice: और वही ... होगा
  rationale: भविष्यसूचक सन्दर्भ में क्रिया का भावी अर्थ है, और संकेतवाचक זֶה पिछले पदों के आने वाले शासक की ओर लौटता है। ‘वही’ हिन्दी में इस अनाफोरिक बल को स्वाभाविक रूप से व्यक्त करता है।
- source_word: שָׁלוֹם
  choice: शान्ति
  rationale: यह शब्द शान्ति के साथ कुशलता और सम्पूर्ण भलाई का भी भाव रखता है; ‘शान्ति’ संक्षिप्त, प्रचलित और प्रसंगानुकूल है।
- source_word: אַשּׁוּר
  choice: अश्शूर
  rationale: इब्रानी रूप देश अश्शूर अथवा व्यक्तिरूप में अश्शूरी आक्रमणकारी को सूचित कर सकता है। मुख्य पाठ में भौगोलिक नाम रखा गया है और वैकल्पिक अर्थ पादटिप्पणी में सुरक्षित है।
- source_word: כִּי יָבוֹא בְאַרְצֵנוּ
  choice: जब ... हमारे देश में आएगा
  rationale: यहाँ כִּי आक्रमण की परिस्थिति को कालवाचक रूप में प्रस्तुत करता है। गति की क्रिया के साथ ‘देश में आएगा’ स्वाभाविक हिन्दी है।
- source_word: וְכִי יִדְרֹךְ
  choice: और ... पाँव रखेगा
  rationale: דרך का मूल चित्र पैर रखने या रौंदने का है। ‘पाँव रखेगा’ ठोस बिम्ब को बचाता है और अनावश्यक रूप से ‘रौंदेगा’ या ‘कूच करेगा’ निर्धारित नहीं करता।
- source_word: בְאַרְמְנֹתֵינוּ
  choice: हमारे गढ़ों में
  rationale: אַרְמוֹן राजमहल अथवा किलाबन्द दृढ़ स्थान हो सकता है। आक्रमण के प्रसंग में ‘गढ़’ उपयुक्त है; ‘महल’ को पादटिप्पणी में रखा गया है।
- source_word: וַהֲקֵמֹנוּ עָלָיו
  choice: तब हम उसके विरुद्ध ... खड़े करेंगे
  rationale: קום का हिफ़ील रूप यहाँ अगुवों को खड़ा करने या नियुक्त करने का अर्थ देता है। ‘तब’ घटनाक्रम स्पष्ट करता है, जबकि ‘उसके विरुद्ध’ एकवचन आक्रमणकारी के व्यक्तिरूप संकेत को बनाए रखता है।
- source_word: שִׁבְעָה רֹעִים
  choice: सात चरवाहे
  rationale: शब्द का शाब्दिक अर्थ ‘चरवाहे’ है और यह शासकों के लिए रूपक भी है; मुख्य पाठ में रूपक सुरक्षित रखा गया है।
- source_word: וּשְׁמֹנָה נְסִיכֵי אָדָם
  choice: और आठ मानव-प्रधान
  rationale: נְסִיכִים प्रधानों, सरदारों या प्रतिष्ठित शासकों को दर्शाता है और אָדָם यहाँ मानव/मनुष्यजाति का सामान्य बोध देता है। ‘मानव-प्रधान’ इब्रानी सम्बन्ध को संक्षिप्त रूप में सुरक्षित रखता है।
theological_decisions:
- issue: ‘वही शान्ति होगा’ में कर्ता की पहचान
  choice: कर्ता को पिछले प्रसंग के आने वाले शासक की ओर संकेत करने वाला माना गया और ‘वही’ से व्यक्त किया गया।
  alternative: अधिक शब्दशः ‘यह शान्ति होगा’ या ‘यह जन शान्ति होगा’।
  rationale: मीका 5 का निकट प्रसंग बेतलेहेम से आने वाले शासक की बात करता है। ‘वही’ पाठ-प्रवाह को व्यक्त करता है, पर खण्ड में उससे आगे कोई अतिरिक्त सिद्धान्तगत पहचान नहीं जोड़ता।
- issue: ‘अश्शूर’ का देश अथवा व्यक्तिगत आक्रमणकारी होना
  choice: मुख्य पाठ में देश का नाम ‘अश्शूर’ रखा गया, जबकि आगे एकवचन सर्वनाम द्वारा शत्रु को व्यक्तिरूप में देखा गया है।
  alternative: ‘अश्शूरी’ अर्थात व्यक्तिगत अश्शूरी आक्रमणकारी।
  rationale: मूल शब्द दोनों अर्थों की अनुमति देता है; पादटिप्पणी इस वास्तविक अस्पष्टता को सुरक्षित रखती है।
- issue: ‘सात ... और आठ’ संख्या-युग्म का अर्थ
  choice: संख्याएँ अक्षरशः रखी गईं और उनकी पर्याप्त अथवा प्रचुर संख्या सूचित करने वाली इब्रानी अभिव्यक्ति का भाव पादटिप्पणी में बताया गया।
  alternative: इसे केवल ठीक सात और ठीक आठ की गणना मानना।
  rationale: मुख्य पाठ मूल रूप को नहीं मिटाता, और टिप्पणी उसके सम्भावित मुहावरेदार बल को बिना निर्णायक परिभाषा थोपे स्पष्ट करती है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की है, पर भविष्यवाणी की गरिमा बनाए रखती है। ‘शान्ति होगा’ सामान्य बोलचाल की अपेक्षा कुछ ऊँचा और जानबूझकर मूल के विधेय-संज्ञा विधान के निकट है। ‘चरवाहे’ का शासकीय रूपक अनूदित नहीं बल्कि सुरक्षित रखा गया है; ‘मानव-प्रधान’ संक्षिप्त और औपचारिक है, पर ‘मनुष्यों के प्रधान’ की अपेक्षा अधिक स्वाभाविक संयुक्त पद देता है।
