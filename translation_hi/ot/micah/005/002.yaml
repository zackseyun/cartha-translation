source:
  edition: WLC
  text: לָ/כֵ֣ן יִתְּנֵ֔/ם עַד עֵ֥ת יוֹלֵדָ֖ה יָלָ֑דָה וְ/יֶ֣תֶר אֶחָ֔י/ו יְשׁוּב֖וּ/ן עַל בְּנֵ֥י יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/005/002.yaml
  text: Therefore he will give them up until the time when she who is in labor has given birth[c][b][a]; then the rest of his brothers will return to the sons of Israel.
translation:
  language: hi
  text: इसलिए वह उन्हें उस समय तक छोड़ देगा[a], जब तक प्रसव करने वाली स्त्री[b] जन्म न दे; तब उसके शेष भाई इस्राएल के पुत्रों[c] के पास लौट आएँगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “वह उन्हें सौंप देगा” अथवा “वह उन्हें त्याग देगा।”
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में “प्रसव करने वाली स्त्री” की पहचान स्पष्ट नहीं है। इसे सिय्योन/यहूदा के मानवीकरण, प्रतिज्ञात शासक की माता, या किसी अन्य व्यक्ति के रूप में समझा गया है।
    reason: alternative_reading
  - marker: c
    text: या “इस्राएल की सन्तान” अथवा “इस्राएल के लोग।” इब्रानी में शाब्दिक रूप से “इस्राएल के पुत्र” है।
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: इसलिए
  rationale: यह पिछले संदर्भ से निकलने वाले परिणाम को स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: יִתְּנֵם
  choice: वह उन्हें ... छोड़ देगा
  rationale: यहाँ נתן का अर्थ किसी को सौंप देना या कुछ समय के लिए त्याग देना हो सकता है। ‘छोड़ देगा’ न्याय अथवा अनुशासन के भाव को रखता है, पर पूर्ण और स्थायी परित्याग का अर्थ अनिवार्य नहीं बनाता।
- source_word: עַד עֵת
  choice: उस समय तक
  rationale: यह इब्रानी पदबंध की समय-संबंधी पूर्णता को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: יוֹלֵדָה
  choice: प्रसव-पीड़ा में पड़ी स्त्री
  rationale: कृदन्त रूप जन्म देने वाली अथवा प्रसव में लगी स्त्री का संकेत करता है; यह अनुवाद उसकी पहचान निर्धारित किए बिना उस अवस्था को स्पष्ट करता है।
- source_word: יָלָדָה
  choice: जन्म न दे दे
  rationale: ‘जब तक’ के साथ यह हिन्दी में उस पूर्ण घटना को स्वाभाविक रूप से व्यक्त करता है जिसके घटने पर प्रतीक्षा की अवधि समाप्त होती है।
- source_word: וְיֶתֶר
  choice: तब ... शेष
  rationale: यह बचे हुए लोगों को सूचित करता है। ‘शेष’ स्रोत के निकट है और अपने आप में किसी विशिष्ट धर्मवैज्ञानिक तकनीकी अर्थ को नहीं थोपता।
- source_word: אֶחָיו
  choice: उसके ... भाई
  rationale: पुल्लिंग बहुवचन संबंधवाचक पद को सीधे रखा गया है, जिससे पारिवारिक और व्यापक जातीय—दोनों संभावित संबंध खुले रहते हैं।
- source_word: יְשׁוּבוּן
  choice: लौट आएँगे
  rationale: שוב के स्थानिक वापसी और व्यापक पुनर्मिलन—दोनों संभावित भावों को बनाए रखता है।
- source_word: עַל
  choice: के पास
  rationale: שוב के साथ यह लोगों के पास लौटने अथवा उनसे फिर जुड़ने का स्वाभाविक हिन्दी रूप है; शाब्दिक ‘पर’ यहाँ अस्पष्ट होता।
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: इस्राएल के पुत्रों
  rationale: यह इब्रानी के शाब्दिक लिंग और पारंपरिक जातीय पदबंध को सुरक्षित रखता है; अर्थ स्पष्ट करने के लिए पादटिप्पणी में ‘इस्राएल की सन्तान’ दिया गया है।
theological_decisions:
- issue: प्रसव-पीड़ा में पड़ी स्त्री की पहचान
  choice: मुख्य पाठ में पहचान अनिर्दिष्ट रखी गई
  alternative: सिय्योन/यहूदा का मानवीकरण; प्रतिज्ञात शासक की माता; या कोई निकट ऐतिहासिक व्यक्ति
  rationale: इब्रानी पाठ स्त्री की स्पष्ट पहचान नहीं करता। उसे अनिर्दिष्ट रखने से वास्तविक व्याख्यात्मक और धर्मवैज्ञानिक तनाव सुरक्षित रहता है।
- issue: ‘उसके भाइयों’ का आशय
  choice: पारिवारिक पद को बिना विस्तार के रखा गया
  alternative: साथी इस्राएली; आने वाले शासक के जाति-भाई; या फिर से एक होने वाले विभाजित राष्ट्र के सदस्य
  rationale: निकट संदर्भ इसका संबंध शासक से सुझाता है, पर इस पद में संबंध की सीमा स्पष्ट नहीं की गई है। इसलिए अनुवाद उसे निर्धारित नहीं करता।
- issue: ‘इस्राएल के पुत्रों’ का विस्तार
  choice: शाब्दिक जातीय पदबंध रखा गया
  alternative: इस्राएल की सन्तान; इस्राएल के लोग
  rationale: शाब्दिक रूप स्रोत की अभिव्यक्ति को बचाता है, जबकि पादटिप्पणी सामान्य सामूहिक अर्थ बताती है और इसे केवल पुरुषों तक सीमित नहीं करती।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सामान्य पाठकों के लिए सुबोध रूप अपनाया गया है। वाक्य की भविष्यकालीन गति, अनिर्दिष्ट स्त्री, ‘उसके भाई’ और वापसी के बहुअर्थी भाव को बनाए रखा गया है। सभी पादटिप्पणी चिह्न संबंधित पदों के तुरंत बाद मुख्य पाठ में दिए गए हैं।
