source:
  edition: WLC
  text: וְ/הָיָ֣ה שְׁאֵרִ֣ית יַעֲקֹ֗ב בְּ/קֶ֨רֶב֙ עַמִּ֣ים רַבִּ֔ים כְּ/טַל֙ מֵ/אֵ֣ת יְהוָ֔ה כִּ/רְבִיבִ֖ים עֲלֵי עֵ֑שֶׂב אֲשֶׁ֤ר לֹֽא יְקַוֶּה֙ לְ/אִ֔ישׁ וְ/לֹ֥א יְיַחֵ֖ל לִ/בְנֵ֥י אָדָֽם׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/005/006.yaml
  text: And the remnant of Jacob will be among many peoples like dew from Yahweh[a], like showers upon the grass[b], which do not wait for a man or delay for the sons of man.
translation:
  language: hi
  text: और याकूब के बचे हुए लोग अनेक जातियों के बीच याहवे की ओर से आनेवाली ओस के समान, और घास पर पड़ने वाली वर्षा की बौछारों के समान होंगे। ये न किसी मनुष्य की बाट जोहती हैं, न मानवों[a] की प्रतीक्षा करती हैं[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: मूल इब्रानी में शाब्दिक अभिव्यक्ति ‘मनुष्य की संतानें’ है, जिसका अर्थ यहाँ मनुष्य या मानवजाति है।
    reason: lexical_alternative
  - marker: b
    text: ‘बाट जोहना’ और ‘प्रतीक्षा करना’ अनूदित दोनों इब्रानी क्रियाओं में ‘आशा रखना’ का भाव भी हो सकता है। इस अंतिम कथन को ओस और वर्षा की बौछारों के बजाय याकूब के बचे हुए लोगों से संबंधित समझना भी संभव है।
    reason: ambiguity
lexical_decisions:
- source_word: וְהָיָה
  choice: और ... होंगे
  rationale: भविष्यसूचक कथन को आधुनिक हिन्दी में स्वाभाविक रूप से व्यक्त करता है; बहुवचन क्रिया ‘बचे हुए लोग’ के अनुरूप है।
- source_word: שְׁאֵרִית יַעֲקֹב
  choice: याकूब के बचे हुए लोग
  rationale: शेष बचे समुदाय के भाव को सामान्य पाठक के लिए स्पष्ट रखता है और ‘याकूब’ नाम को मूल के अनुसार बनाए रखता है।
- source_word: בְּקֶרֶב עַמִּים רַבִּים
  choice: बहुत-से लोगों के बीच
  rationale: בקרב का अर्थ ‘बीच में’ और עמים का अर्थ यहाँ अनेक जनसमूह है; यह हिन्दी में सहज और सटीक है।
- source_word: כְּטַל מֵאֵת יְהוָה
  choice: याहवे की ओर से आनेवाली ओस के समान
  rationale: מֵאֵת स्रोत को दर्शाता है; ‘की ओर से आनेवाली’ स्पष्ट करता है कि ओस का स्रोत याहवे है। परमेश्वर का व्यक्तिगत नाम मूल के अनुरूप ‘याहवे’ रखा गया है।
- source_word: כִּרְבִיבִים עֲלֵי עֵשֶׂב
  choice: घास पर पड़ने वाली वर्षा की झड़ियों के समान
  rationale: רְבִיבִים वर्षा की झड़ियों को और עֵשֶׂב घास/हरियाली को दर्शाता है; ठोस कृषि-बिंब सुरक्षित रहता है।
- source_word: לֹא יְקַוֶּה לְאִישׁ
  choice: न किसी मनुष्य की बाट जोहती हैं
  rationale: קוה में प्रतीक्षा और आशा दोनों अर्थ संभव हैं; मौसम के बिंब में ‘बाट जोहना’ मानव क्रिया पर निर्भर न होने का भाव स्वाभाविक ढंग से देता है।
- source_word: וְלֹא יְיַחֵל לִבְנֵי אָדָם
  choice: न मानवों की प्रतीक्षा करती हैं
  rationale: יחל भी प्रतीक्षा/आशा का अर्थ दे सकता है। समानांतरता को रखते हुए हिन्दी में अनावश्यक शब्द-पुनरावृत्ति से बचाया गया है।
- source_word: בְנֵי אָדָם
  choice: मानवों
  rationale: शाब्दिक मुहावरा ‘आदम की संतान’ यहाँ सामान्यतः मनुष्यों को सूचित करता है; ‘मानवों’ आधुनिक हिन्दी में वही सामूहिक अर्थ देता है।
theological_decisions:
- issue: सम्बन्धवाचक कथन ‘जो प्रतीक्षा नहीं करतीं’ का संदर्भ
  choice: मुख्य पाठ में इसे ओस और वर्षा की झड़ियों से जोड़ा गया है।
  alternative: इसे व्यापक रूप से याकूब के बचे हुए लोगों से संबंधित समझा जा सकता है।
  rationale: निकटतम संदर्भ ओस और वर्षा का बिंब है, और उनका मानव प्रयास से स्वतंत्र होकर याहवे की ओर से आना कृषि-बिंब के अनुकूल है। फिर भी मूल व्याकरण दूसरे संबंध की संभावना को पूरी तरह बंद नहीं करता, इसलिए उसे पादटिप्पणी में सुरक्षित रखा गया है।
- issue: יְהוָה का रूपांतरण
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल में चार-अक्षरीय व्यक्तिगत नाम स्पष्ट रूप से उपस्थित है; ‘याहवे’ उसे उपाधि में बदले बिना प्रस्तुत करता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण स्तर रखा गया है। ‘बाट जोहना’ परिचित साहित्यिक प्रयोग है, जबकि वाक्य-विन्यास सामान्य पाठकों के लिए सरल रखा गया है। रूपक को स्पष्ट करने के लिए लम्बे इब्रानी वाक्य को दो वाक्यों में बाँटा गया है; ‘ये’ ओस और वर्षा की झड़ियों की ओर संकेत करता है।
