source:
  edition: WLC
  text: וְ/נָתַשְׁתִּ֥י אֲשֵׁירֶ֖י/ךָ מִ/קִּרְבֶּ֑/ךָ וְ/הִשְׁמַדְתִּ֖י עָרֶֽי/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/005/013.yaml
  text: And I will uproot your Asherah poles from your midst[a], and I will destroy your cities.
translation:
  language: hi
  text: मैं तुम्हारे बीच में से तुम्हारे अशेरा-खंभों को उखाड़ दूँगा, और तुम्हारे नगरों को नष्ट कर दूँगा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְנָתַשְׁתִּי
  choice: उखाड़ दूँगा
  rationale: נתשׁ किसी गड़ी, रोपी या स्थापित वस्तु को जड़ से निकालने अथवा उखाड़ने का भाव देता है; यहाँ उपासना से जुड़ी वस्तुओं को हटाने के संदर्भ में यह स्वाभाविक और सशक्त है।
- source_word: אֲשֵׁירֶיךָ
  choice: अशेरा के खंभों
  rationale: बहुवचन रूप यहाँ अशेरा-उपासना से जुड़ी ठोस पूजावस्तुओं की ओर संकेत करता है। ‘अशेरा के खंभे’ विशिष्ट धार्मिक संदर्भ को बनाए रखता है और इसे सामान्य ‘मूर्तियों’ में नहीं बदलता।
- source_word: מִקִּרְבֶּךָ
  choice: तुम्हारे बीच से
  rationale: यह मूल वाक्यांश के ‘तुम्हारे मध्य से’ अर्थ को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: וְהִשְׁמַדְתִּי
  choice: नष्ट कर दूँगा
  rationale: שׁמד का हिफ़ील रूप विनाश करने का प्रबल अर्थ देता है; ‘नष्ट कर दूँगा’ स्पष्ट है और अर्थ को अनावश्यक रूप से नहीं बढ़ाता।
- source_word: עָרֶיךָ
  choice: तुम्हारे नगरों
  rationale: עִיר का सामान्य अर्थ ‘नगर’ है; बहुवचन और द्वितीय पुरुष एकवचन संबंधसूचक रूप दोनों सुरक्षित हैं।
theological_decisions:
- issue: אֲשֵׁירֶיךָ का अभिप्राय
  choice: अशेरा-उपासना से जुड़े खंभे
  alternative: ‘तुम्हारी अशेराएँ’ अथवा सामान्य रूप से ‘तुम्हारे पूजा-खंभे’
  rationale: निकटवर्ती संदर्भ मूर्तिपूजा से जुड़ी वस्तुओं को हटाने का है, इसलिए ठोस पूजावस्तु सबसे संभावित अर्थ है। फिर भी इब्रानी पद देवी अशेरा अथवा उससे जुड़ी पवित्र वस्तु का बोध करा सकता है, इसलिए विकल्प पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और सामान्य पाठक के लिए सहज शैली। ‘अशेरा’ का लिप्यंतरण विशिष्ट प्राचीन धार्मिक संदर्भ को बनाए रखता है; पादटिप्पणी मूल शब्द की वास्तविक अर्थगत व्यापकता बताती है।
