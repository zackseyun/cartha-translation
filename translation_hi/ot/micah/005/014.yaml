base_translation:
  language: en
  yaml_path: translation/ot/micah/005/014.yaml
  text: And I will execute vengeance in anger and wrath on the nations that have not listened[a].
translation:
  language: hi
  text: और मैं क्रोध और रोष में उन राष्ट्रों से बदला लूँगा जिन्होंने नहीं सुना[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “ध्यान नहीं दिया” अथवा “आज्ञा नहीं मानी।” इब्रानी क्रिया का अर्थ “सुनना” और सुनकर आज्ञा मानना, दोनों हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשִׂיתִי
  choice: और मैं ... बदला लूँगा
  rationale: עשה के साथ נָקָם का प्रयोग बदला लेने या प्रतिशोध करने का मुहावरा है। हिन्दी में ‘बदला लूँगा’ स्वाभाविक है और प्रतिशोध का भाव बनाए रखता है।
- source_word: בְּאַף וּבְחֵמָה
  choice: क्रोध और प्रचण्ड रोष में
  rationale: אַף और חֵמָה दोनों क्रोध सूचित करते हैं; ‘क्रोध’ और ‘प्रचण्ड रोष’ उनकी समानता तथा दूसरे पद की तीव्रता को व्यक्त करते हैं।
- source_word: נָקָם
  choice: बदला
  rationale: נָקָם दण्ड मात्र नहीं, बल्कि किए गए अपराध के प्रत्युत्तर में प्रतिशोध को दर्शाता है; इसलिए ‘बदला’ सीधा और सामान्य आधुनिक हिन्दी विकल्प है।
- source_word: אֶת הַגּוֹיִם
  choice: उन राष्ट्रों से
  rationale: हिन्दी मुहावरे ‘किसी से बदला लेना’ के अनुसार कर्म को ‘से’ के साथ रखा गया है।
- source_word: אֲשֶׁר לֹא שָׁמֵעוּ
  choice: जिन्होंने नहीं सुना
  rationale: שׁמע सुनने के साथ ध्यान देने और आज्ञा मानने का अर्थ भी दे सकता है। मुख्य पाठ में ‘नहीं सुना’ मूल शब्द की व्यापकता और संदर्भगत अस्पष्टता बनाए रखता है।
theological_decisions:
- issue: न्याय पाए राष्ट्रों के संबंध में שָׁמֵעוּ का अर्थ
  choice: नहीं सुना
  alternative: ध्यान नहीं दिया; आज्ञा नहीं मानी
  rationale: इब्रानी क्रिया वास्तविक सुनने और आज्ञाकारी प्रत्युत्तर, दोनों को सूचित कर सकती है। मुख्य पाठ में ‘नहीं सुना’ रखने और वैकल्पिक अर्थों को पाद-टिप्पणी में देने से इस अर्थगत तथा धर्मवैचारिक तनाव को अनावश्यक रूप से हल नहीं किया जाता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘प्रचण्ड रोष’ भविष्यद्वाणी के गंभीर न्यायात्मक स्वर को व्यक्त करता है, जबकि ‘बदला लूँगा’ हिन्दी में स्वाभाविक मुहावरा है।
