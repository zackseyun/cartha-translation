source:
  edition: WLC
  text: וְ/הָיָ֤ה בַ/יּוֹם הַ/הוּא֙ נְאֻם יְהוָ֔ה וְ/הִכְרַתִּ֥י סוּסֶ֖י/ךָ מִ/קִּרְבֶּ֑/ךָ וְ/הַאֲבַדְתִּ֖י מַרְכְּבֹתֶֽי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/005/009.yaml
  text: And in that day[a], declares Yahweh, I will cut off your horses from among you, and I will destroy your chariots.
translation:
  language: hi
  text: उस दिन ऐसा होगा—याहवे की यह घोषणा है—मैं तेरे बीच से[a] तेरे घोड़ों को मिटा दूँगा और तेरे रथों को नष्ट कर दूँगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तेरे भीतर से।”
    reason: מִקִּרְבֶּךָ के अधिक शाब्दिक स्थानवाचक विकल्प को सुरक्षित रखना।
lexical_decisions:
- source_word: וְהָיָה בַיּוֹם הַהוּא
  choice: उस दिन ऐसा होगा
  rationale: भविष्यसूचक काल-सूत्र को स्वाभाविक हिन्दी में व्यक्त करता है और וְהָיָה की भावी घटना की भूमिका को भी बनाए रखता है।
- source_word: נְאֻם יְהוָה
  choice: याहवे की यह घोषणा है
  rationale: भविष्यद्वाणी में ईश्वरीय वचन को चिह्नित करने वाले गंभीर घोषणा-सूत्र को स्पष्ट और गरिमापूर्ण हिन्दी में रखता है।
- source_word: וְהִכְרַתִּי
  choice: मैं ... मिटा दूँगा
  rationale: हिफ़ील रूप यहाँ निर्णायक रूप से दूर करने या समाप्त कर देने का भाव देता है; घोड़ों के संदर्भ में शाब्दिक ‘काट दूँगा’ की अपेक्षा ‘मिटा दूँगा’ अधिक स्वाभाविक है।
- source_word: סוּסֶיךָ
  choice: तेरे घोड़ों को
  rationale: द्वितीय पुरुष पुल्लिंग एकवचन प्रत्यय सहित बहुवचन संज्ञा का सीधा अनुवाद; संबोधन समुदाय को सामूहिक एकवचन में है।
- source_word: מִקִּרְבֶּךָ
  choice: तेरे बीच से
  rationale: शाब्दिक अर्थ ‘तेरे मध्य/भीतर से’ है; ‘तेरे बीच से’ आधुनिक हिन्दी में स्वाभाविक रहते हुए समुदाय के भीतर से हटाने का भाव सुरक्षित रखता है।
- source_word: וְהַאֲבַדְתִּי
  choice: मैं ... नष्ट कर दूँगा
  rationale: אבד के हिफ़ील का कारणात्मक अर्थ ‘नाश कर देना’ है; यह पहले क्रिया-पद से भेद भी बनाए रखता है।
- source_word: מַרְכְּבֹתֶיךָ
  choice: तेरे रथों को
  rationale: द्वितीय पुरुष एकवचन प्रत्यय सहित बहुवचन संज्ञा का सीधा और प्रसंगानुकूल अनुवाद।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में प्रयुक्त चतुरक्षरीय वाचा-नाम को उपाधि से बदलने के बजाय हिन्दी लिप्यंतरण में प्रस्तुत किया गया है।
- issue: घोड़ों और रथों को हटाने का आशय
  choice: सैन्य साधनों को मिटाने और नष्ट करने का ठोस कथन
  alternative: सैन्य शक्ति पर भरोसे की स्पष्ट निन्दा; युद्ध से शुद्धीकरण
  rationale: व्यापक प्रसंग ऐसे धर्मवैचारिक निहितार्थ सुझा सकता है, पर इस पद में कही गई ठोस कार्रवाई से आगे की व्याख्या मुख्य पाठ में नहीं जोड़ी गई।
translation_notes:
  register: आधुनिक मानक हिन्दी; भविष्यसूचक घोषणा की गरिमा के लिए डैश का प्रयोग। सामूहिक एकवचन संबोधन को ‘तेरे’ से बनाए रखा गया है।
