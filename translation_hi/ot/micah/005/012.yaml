  text: וְ/הִכְרַתִּ֧י פְסִילֶ֛י/ךָ וּ/מַצֵּבוֹתֶ֖י/ךָ מִ/קִּרְבֶּ֑/ךָ וְ/לֹֽא תִשְׁתַּחֲוֶ֥ה ע֖וֹד לְ/מַעֲשֵׂ֥ה יָדֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/005/012.yaml
  text: And I will cut off your carved images and your pillars from your midst[b][a], and you will no longer bow down to the work of your hands.
translation:
  language: hi
  text: मैं तुम्हारे बीच से तुम्हारी तराशी हुई मूर्तियों और तुम्हारे पत्थर-स्तंभों[a] को नाश कर दूँगा, और तुम फिर कभी अपने हाथों की बनाई हुई वस्तुओं के आगे दण्डवत न करोगे[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘तुम्हारे पवित्र स्तंभों’ अथवा ‘तुम्हारे खड़े किए हुए पत्थरों।’ इब्रानी शब्द उन सीधे खड़े किए गए पत्थरों को दर्शाता है जिनका उपयोग उपासना में होता था।
    reason: lexical_alternative
  - marker: b
    text: या ‘तुम फिर कभी अपने हाथों की बनाई हुई वस्तुओं की उपासना नहीं करोगे।’ इब्रानी में अधिक शाब्दिक रूप से उपासना में दण्डवत करने की शारीरिक क्रिया कही गई है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִכְרַתִּי
  choice: मैं ... नाश कर दूँगा
  rationale: हिफ़ील रूप यहाँ हटाकर समाप्त कर देने का भाव देता है। शाब्दिक ‘काट डालूँगा’ की अपेक्षा ‘नाश कर दूँगा’ आधुनिक हिन्दी में अधिक स्वाभाविक है और क्रिया की प्रबलता बनाए रखता है।
- source_word: פְסִילֶיךָ
  choice: तुम्हारी खुदी हुई मूर्तियों
  rationale: פֶּסֶל गढ़ी या खोदी गई उपासना-मूर्ति को दर्शाता है। यह अनुवाद व्यापक शब्द ‘मूर्तियों’ की तुलना में निर्माण की विधि को भी व्यक्त करता है।
- source_word: וּמַצֵּבוֹתֶיךָ
  choice: पूजा के पत्थर-स्तंभों
  rationale: מַצֵּבָה उपासना-संदर्भ में खड़े किए गए पत्थर या स्तंभ को दर्शाता है। ‘पूजा के पत्थर-स्तंभ’ उसके आकार और धार्मिक प्रयोग दोनों को स्पष्ट करता है।
- source_word: מִקִּרְבֶּךָ
  choice: तुम्हारे बीच से
  rationale: यह मूल के ‘तुम्हारे मध्य से’ वाले स्थानिक भाव को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: וְלֹא תִשְׁתַּחֲוֶה עוֹד
  choice: तुम फिर कभी ... दण्डवत नहीं करोगे
  rationale: यह क्रिया उपासना में झुकने या भूमि पर गिरकर प्रणाम करने को दर्शाती है। ‘दण्डवत करना’ शारीरिक क्रिया और धार्मिक आशय दोनों को सुरक्षित रखता है।
- source_word: לְמַעֲשֵׂה יָדֶיךָ
  choice: अपने हाथों की बनाई हुई वस्तुओं के आगे
  rationale: यह मनुष्य द्वारा बनाई गई उपासना-वस्तुओं के लिए प्रयुक्त इब्रानी मुहावरे का स्वाभाविक हिन्दी रूप है और उसकी व्यंग्यात्मक धार बनाए रखता है।
theological_decisions:
- issue: मूर्तिपूजा से जुड़ी अलग-अलग वस्तुओं का अनुवाद
  choice: ‘खुदी हुई मूर्तियों’ और ‘पूजा के पत्थर-स्तंभों’ के रूप में दोनों इब्रानी संज्ञाओं का भेद बनाए रखा गया है।
  alternative: दोनों को सामान्य रूप से ‘मूर्तियाँ’ या ‘देव-मूर्तियाँ’ कहना।
  rationale: मूल पाठ निषिद्ध उपासना की दो विशिष्ट प्रकार की वस्तुओं का उल्लेख करता है; उन्हें एक ही सामान्य श्रेणी में मिला देना मूल की ठोस शब्दावली को खो देगा।
- issue: अंतिम उपवाक्य में शारीरिक और धार्मिक अर्थ
  choice: ‘दण्डवत नहीं करोगे’
  alternative: ‘पूजा नहीं करोगे’
  rationale: इब्रानी क्रिया शरीर झुकाने की क्रिया को सीधे व्यक्त करती है, जबकि संदर्भ उसे उपासना का अर्थ देता है। चुना हुआ रूप दोनों पहलुओं को बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। ‘पूजा के पत्थर-स्तंभ’ सामान्य पाठक के लिए सांस्कृतिक वस्तु को स्पष्ट करता है, जबकि पादटिप्पणी निकटतर विकल्प देती है। ‘दण्डवत’ धार्मिक संदर्भ में परिचित हिन्दी शब्द है और मूल की देहगत क्रिया को सुरक्षित रखता है।
