source:
  edition: WLC
  text: וְ/רָע֞וּ אֶת אֶ֤רֶץ אַשּׁוּר֙ בַּ/חֶ֔רֶב וְ/אֶת אֶ֥רֶץ נִמְרֹ֖ד בִּ/פְתָחֶ֑י/הָ וְ/הִצִּיל֙ מֵֽ/אַשּׁ֔וּר כִּֽי יָב֣וֹא בְ/אַרְצֵ֔/נוּ וְ/כִ֥י יִדְרֹ֖ךְ בִּ/גְבוּלֵֽ/נוּ־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/micah/005/005.yaml
  text: They will shepherd the land of Assyria with the sword[a], and the land of Nimrod at its entrances; and he will deliver us from Assyria when he comes into our land[b], and when he treads within our border.
translation:
  language: hi
  text: वे तलवार से अश्शूर देश की चरवाही करेंगे, और निम्रोद के देश की उसके प्रवेश-स्थानों पर[b] चरवाही करेंगे। और वह हमें अश्शूर से[a] छुड़ाएगा, जब वह हमारे देश में आएगा और जब वह हमारी सीमा के भीतर पाँव रखेगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘अश्शूरी से’; हिब्रू में अश्शूर को आक्रमणकारी शत्रु के रूप में मानवीकृत समझा जा सकता है।
    reason: alternative_reading
  - marker: b
    text: या ‘उसके फाटकों में’; हिब्रू का शाब्दिक भाव ‘उसके प्रवेश-स्थानों/खुले स्थानों पर’ है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרָעוּ
  choice: चरवाही करेंगे
  rationale: רעה का मूल अर्थ ‘चराना/चरवाही करना’ है। तलवार के प्रसंग में इसमें विजय द्वारा अधीन करने का भाव है, फिर भी ‘चरवाही करेंगे’ निकटवर्ती चरवाहे-शासक की छवि और मूल रूपक को सुरक्षित रखता है।
- source_word: אֶרֶץ אַשּׁוּר
  choice: अश्शूर देश
  rationale: यह चुनाव אֶרֶץ की भौगोलिक-क्षेत्रीय धारणा को बनाए रखता है और आधुनिक हिन्दी में स्वाभाविक है।
- source_word: בַּחֶרֶב
  choice: तलवार से
  rationale: साधनवाचक בּ को हिन्दी में स्वाभाविक ‘से’ द्वारा व्यक्त किया गया है; सैन्य विजय की ठोस छवि बनी रहती है।
- source_word: אֶרֶץ נִמְרֹד
  choice: निम्रोद का देश
  rationale: मूल में आए नाम और क्षेत्र-संबंध को सीधे तथा स्वाभाविक ढंग से व्यक्त करता है।
- source_word: בִּפְתָחֶיהָ
  choice: उसके प्रवेश-स्थानों पर
  rationale: פתח का सामान्य अर्थ ‘खुला स्थान/प्रवेश-स्थान’ है; यहाँ सामान्य ‘फाटक’ वाले हिब्रू शब्द שׁער का प्रयोग नहीं हुआ है। स्त्रीलिंग प्रत्यय का संबंध ‘देश’ से माना गया है।
- source_word: וְהִצִּיל
  choice: और वह हमें छुड़ाएगा
  rationale: נצל के हिफ़ील का अर्थ ‘छुड़ाना/बचाना’ है। एकवचन कर्ता को बनाए रखा गया है, ताकि बहुवचन से एकवचन में मूल पाठ का बदलाव न मिटे।
- source_word: מֵאַשּׁוּר
  choice: अश्शूर से
  rationale: पहले आए क्षेत्रीय उल्लेख के अनुरूप राष्ट्र/राज्य का नाम मुख्य पाठ में रखा गया है; शत्रु के मानवीकरण की संभावना पादटिप्पणी में दी गई है।
- source_word: כִּי יָבוֹא בְאַרְצֵנוּ
  choice: जब वह हमारे देश में आएगा
  rationale: 'प्रसंग में כִּי को कालवाचक मानना सबसे संगत है: छुटकारा आक्रमण के समय होगा।'
- source_word: וְכִי יִדְרֹךְ בִּגְבוּלֵנוּ
  choice: और जब वह हमारी सीमा के भीतर पाँव रखेगा
  rationale: דרך की ठोस ‘पाँव रखने/रौंदने’ की छवि रखी गई है और בִּגְבוּלֵנוּ को सीमाबद्ध भूभाग में प्रवेश के रूप में स्वाभाविक हिन्दी में व्यक्त किया गया है।
theological_decisions:
- issue: पद में बहुवचन कर्ता से एकवचन कर्ता की ओर बदलाव
  choice: ‘वे ... चरवाही करेंगे ... और वह हमें छुड़ाएगा’ के रूप में बदलाव सुरक्षित रखा गया है।
  alternative: पूरे पद में बहुवचन रखना (‘वे हमें छुड़ाएँगे’) या पूरे पद को एकवचन शाही कर्ता से जोड़ना।
  rationale: हिब्रू पाठ पहले बहुवचन क्रिया और फिर एकवचन क्रिया देता है। संभव है कि बहुवचन पिछले प्रसंग के अगुओं/चरवाहों की ओर और एकवचन शासक की ओर संकेत करे, पर अनुवाद इस तनाव को निश्चित व्याख्या द्वारा नहीं मिटाता।
- issue: अंतिम खंड में אַשּׁוּר का आशय
  choice: मुख्य पाठ में ‘अश्शूर’ रखा गया है।
  alternative: ‘अश्शूरी’ अथवा मानवीकृत ‘अश्शूरी शत्रु’।
  rationale: शब्द राष्ट्र, राज्य या मानवीकृत आक्रमणकारी शक्ति को सूचित कर सकता है। पहले के क्षेत्रीय संदर्भ के कारण मुख्य पाठ में ‘अश्शूर’ उचित है, जबकि वैकल्पिक मानवीकरण पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य रखी गई है। ‘चरवाही करेंगे’ जानबूझकर कुछ असामान्य है, क्योंकि तलवार के साथ प्रयुक्त मूल चरवाहा-रूपक को केवल ‘शासन करेंगे’ या ‘उजाड़ेंगे’ कहकर समतल नहीं किया गया। सभी पादटिप्पणी-चिह्न संबंधित शब्दों के पास मुख्य पाठ में दिए गए हैं।
