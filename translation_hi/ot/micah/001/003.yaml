  text: כִּֽי הִנֵּ֥ה יְהוָ֖ה יֹצֵ֣א מִ/מְּקוֹמ֑/וֹ וְ/יָרַ֥ד וְ/דָרַ֖ךְ עַל במותי אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/001/003.yaml
  text: For look, the LORD is coming out from his place; he will come down and tread on the high places of the earth.
translation:
  language: hi
  text: क्योंकि देखो, यहोवा अपने स्थान से निकल रहा है; वह नीचे उतरेगा और पृथ्वी के ऊँचे स्थानों पर पाँव रखेगा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי הִנֵּה
  choice: क्योंकि देखो
  rationale: כִּי पिछले कथन का कारण प्रस्तुत करता है और הִנֵּה ध्यान आकृष्ट करता है; यह संयोजन मूल की तात्कालिकता बनाए रखता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: व्यक्तिगत ईश्वरीय नाम को पदवी में बदलने के बजाय हिन्दी में प्रचलित लिप्यंतरण से व्यक्त किया गया है।
- source_word: יֹצֵא מִמְּקוֹמוֹ
  choice: अपने स्थान से निकल रहा है
  rationale: हिब्रू कृदंत आसन्न और सजीव क्रिया दर्शाता है; वर्तमान प्रगतिशील रूप इसे स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: וְיָרַד
  choice: वह उतरकर
  rationale: आगे की क्रमिक क्रिया को सहज हिन्दी में जोड़ता है, बिना उसके अर्थ को विस्तृत किए।
- source_word: וְדָרַךְ עַל בָּמֳתֵי אָרֶץ
  choice: पृथ्वी के ऊँचे स्थानों पर चलेगा
  rationale: דרך על का अर्थ पाँव रखकर चलना/रौंदना हो सकता है; 'चलेगा' मूल की प्रतिमा रखता है और अनिवार्यतः विनाशकारी अर्थ आरोपित नहीं करता। בָּמֳתֵי की भौगोलिक-धार्मिक संभाव्यता 'ऊँचे स्थानों' में बनी रहती है।
theological_decisions:
- issue: यहोवा का अपने स्थान से निकलना और उतरना
  choice: मानवरूपी स्थानिक भाषा को ज्यों का त्यों रखा गया
  alternative: इसे केवल परमेश्वर के न्याय के प्रकट होने के रूप में व्याख्यायित करना
  rationale: पद स्वयं सजीव अवतरण-चित्र प्रस्तुत करता है; अनुवाद को उसकी धर्मवैचारिक व्याख्या पहले से तय नहीं करनी चाहिए।
- issue: ऊँचे स्थानों पर चलना
  choice: भौगोलिक और संभव धार्मिक संकेत—दोनों के लिए खुला रखा गया
  alternative: '''पहाड़ों की चोटियों'' या ''पूजा के ऊँचे स्थानों'' के रूप में सीमित करना'
  rationale: במותי ארץ संदर्भ में पृथ्वी की ऊँचाइयों को सूचित करता है, पर 'ऊँचे स्थान' धार्मिक प्रतिध्वनि भी रख सकता है; मूल की यह संभाव्यता संरक्षित है।
translation_notes:
  register: आधुनिक मानक हिन्दी; वाक्य dignified किंतु साधारण पाठक के लिए सीधा है। 'देखो' भविष्यद्वाणी की उद्घोषणात्मक तात्कालिकता रखता है, और अर्धविराम दो क्रमिक क्रियाओं को स्पष्ट करता है।
