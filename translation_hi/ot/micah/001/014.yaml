id: MIC.1.14
reference: Micah 1:14
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: לָ/כֵן֙ תִּתְּנִ֣י שִׁלּוּחִ֔ים עַ֖ל מוֹרֶ֣שֶׁת גַּ֑ת בָּתֵּ֤י אַכְזִיב֙ לְ/אַכְזָ֔ב לְ/מַלְכֵ֖י יִשְׂרָאֵֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/001/014.yaml
  text: Therefore you will give parting gifts for Moresheth-gath[b][a]; the houses of Achzib will prove deceptive to the kings of Israel.
translation:
  language: hi
  text: इसलिए तुम मोरेशेत-गत के लिए विदाई की भेंटें दोगी[a]; अकज़ीब के घर इस्राएल के राजाओं के लिए छलावा सिद्ध होंगे[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “विदा करने की भेंटें।” हिब्रू पद किसी को विदा करते समय दी जाने वाली भेंटों का अर्थ रख सकता है और इसमें संभवतः विवाह-विच्छेद की हल्की प्रतिध्वनि भी है।
    reason: lexical_alternative
  - marker: b
    text: '“अकज़ीब” नाम हिब्रू में “छलावे,” “धोखे” या “निराशा” के अर्थ वाले शब्द जैसा सुनाई देता है। इस कारण यहाँ शब्द-क्रीड़ा है: अकज़ीब के घर इस्राएल के राजाओं के लिए छलावा सिद्ध होंगे।'
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: इसलिए
  rationale: यह निष्कर्षसूचक अव्यय पिछले न्याय-वचनों के परिणाम का परिचय देता है।
- source_word: תִּתְּנִי
  choice: तुम ... दोगी
  rationale: यह נתן का काल अपूर्ण, द्वितीय पुरुष स्त्रीलिंग एकवचन रूप है। स्त्रीलिंग क्रिया को स्पष्ट रखते हुए संबोधित पात्र की पहचान को अनिर्दिष्ट छोड़ा गया है।
- source_word: שִׁלּוּחִים
  choice: विदाई की भेंटें
  rationale: שלח से बना यह बहुवचन संज्ञा-रूप किसी को विदा करते समय दी जाने वाली वस्तुओं या भेंटों का भाव रखता है। यह अनुवाद संभावित विवाह-विच्छेद संबंधी प्रतिध्वनि को मुख्य पाठ में निश्चित अर्थ नहीं बनाता।
- source_word: עַל
  choice: के लिए
  rationale: भेंट देने के इस प्रसंग में संबंध या प्रयोजन व्यक्त करने के लिए हिन्दी में ‘के लिए’ स्वाभाविक है और प्रसंगानुसार ‘को’ से अधिक उपयुक्त है।
- source_word: מוֹרֶשֶׁת גַּת
  choice: मोरेशेत-गत
  rationale: संयुक्त स्थान-नाम को उसके हिब्रू रूप के निकट देवनागरी में लिप्यंतरित किया गया है।
- source_word: בָּתֵּי אַכְזִיב
  choice: अकज़ीब के घर
  rationale: रचना का शाब्दिक अर्थ ‘अकज़ीब के घर’ है। ‘घर’ परिवारों या बस्ती के भवनों को सूचित कर सकता है; मूल की व्यापकता बनाए रखी गई है।
- source_word: לְאַכְזָב
  choice: छलावा सिद्ध होंगे
  rationale: אַכְזָב का अर्थ धोखा, झूठ या निराश करने वाली वस्तु हो सकता है। ‘छलावा सिद्ध होंगे’ हिन्दी में विधेय को स्वाभाविक बनाता है और अकज़ीब नाम के साथ मूल शब्द-क्रीड़ा की ओर संकेत करता है।
- source_word: לְמַלְכֵי יִשְׂרָאֵל
  choice: इस्राएल के राजाओं के लिए
  rationale: यह संबंधवाचक प्रयोग बताता है कि अकज़ीब के घर इस्राएल के राजाओं के लिए छलावा या निराशा का कारण सिद्ध होंगे।
theological_decisions:
- issue: स्त्रीलिंग एकवचन क्रिया का संबोधित पात्र
  choice: मुख्य पाठ में स्त्रीलिंग ‘दोगी’ रखा गया, पर संबोधित पात्र का नाम नहीं जोड़ा गया।
  alternative: इसे स्त्री के रूप में मानवीकृत यहूदा, यरूशलेम/सिय्योन, या स्वयं मोरेशेत-गत के स्पष्ट संबोधन के रूप में अनूदित करना।
  rationale: हिब्रू क्रिया स्त्रीलिंग एकवचन संबोधन को निश्चित करती है, पर इस पद में उसका संदर्भ स्पष्ट नाम से नहीं दिया गया। इसलिए व्याकरणिक सूचना सुरक्षित रखते हुए वास्तविक संदर्भ की अस्पष्टता बनाए रखी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण भाषा रखी गई है। ‘दोगी’ मूल के स्त्रीलिंग एकवचन संबोधन को सुरक्षित रखता है; स्थान-नामों को देवनागरी में लिप्यंतरित किया गया है। ‘छलावा सिद्ध होंगे’ काव्यात्मक भविष्यवाणी और मूल शब्द-क्रीड़ा दोनों को यथासंभव संप्रेषित करता है।
