  text: שִׁמְעוּ֙ עַמִּ֣ים כֻּלָּ֔/ם הַקְשִׁ֖יבִי אֶ֣רֶץ וּ/מְלֹאָ֑/הּ וִ/יהִי֩ אֲדֹנָ֨/י יְהוִ֤ה בָּ/כֶם֙ לְ/עֵ֔ד אֲדֹנָ֖/י מֵ/הֵיכַ֥ל קָדְשֽׁ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/001/002.yaml
  text: Hear[a], all you peoples; pay attention, O earth, and all that fills it. And let the Lord GOD be a witness against you[d][c][b], the Lord from his holy temple.
translation:
  language: hi
  text: 'हे सभी लोगों[a], सुनो;


    हे पृथ्वी, और जो कुछ तुझ में है, ध्यान दे।


    प्रभु याहवे[b] तुम्हारे विरुद्ध[c] साक्षी हो—


    प्रभु अपने पवित्र मंदिर[d] से।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “हे सब जातियों।”
    reason: lexical_alternative
  - marker: b
    text: हिब्रू में “अदोनाय याहवे”; यहाँ अदोनाय का अनुवाद “प्रभु” किया गया है।
    reason: lexical_alternative
  - marker: c
    text: या, “तुम्हारे बीच साक्षी हो”; प्रसंग में न्यायिक अर्थ “तुम्हारे विरुद्ध” अधिक संभावित है।
    reason: alternative_reading
  - marker: d
    text: या, “पवित्र राजमहल” अथवा “पवित्र धाम।”
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁמְעוּ
  choice: सुनो
  rationale: बहुवचन आज्ञार्थक रूप एक गंभीर भविष्यद्वक्ताई और न्यायिक आह्वान है। ‘सुनो’ स्वाभाविक हिन्दी में ध्यानपूर्वक सुनने की अपेक्षा व्यक्त करता है।
- source_word: עַמִּים כֻּלָּם
  choice: हे सब जातियों के लोगो
  rationale: עַמִּים अनेक जनसमुदायों को सीधे सम्बोधित करता है। यह प्रयोग बहुवचन और प्रत्यक्ष सम्बोधन दोनों को बनाए रखता है; ‘राष्ट्रों’ से उत्पन्न आधुनिक राजनीतिक अर्थ से भी बचता है।
- source_word: הַקְשִׁיבִי
  choice: ध्यान दे
  rationale: यह पृथ्वी को सम्बोधित स्त्रीलिंग एकवचन आज्ञार्थक रूप है। ‘ध्यान दे’ आधुनिक, स्पष्ट और औपचारिक आह्वान के अनुकूल है।
- source_word: אֶרֶץ וּמְלֹאָהּ
  choice: हे पृथ्वी और जो कुछ तुझमें है
  rationale: सभी जनसमुदायों के समानान्तर אֶרֶץ का विश्वव्यापी अर्थ ‘पृथ्वी’ उपयुक्त है। दूसरा पद पृथ्वी में समाई हर वस्तु और प्राणी को समाविष्ट करता है।
- source_word: וִיהִי
  choice: साक्षी हो
  rationale: यह היה का इच्छा अथवा आदेशसूचक रूप है। हिन्दी का ‘हो’ उसके गंभीर विध्यर्थक बल को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: אֲדֹנָי יְהוִה
  choice: प्रभु याहवे
  rationale: 'संयुक्त उपाधि के दोनों हिब्रू तत्व सुरक्षित रखे गए हैं: אֲדֹנָי के लिए ‘प्रभु’ और परमेश्वर के व्यक्तिगत नाम יהוה के लिए ‘याहवे’।'
- source_word: בָּכֶם לְעֵד
  choice: तुम्हारे विरुद्ध साक्षी
  rationale: עֵד न्यायालय का शब्द है। प्रसंग में בָּכֶם का न्यायिक, प्रतिकूल भाव सम्भावित है, इसलिए ‘तुम्हारे विरुद्ध’ मुख्य पाठ में रखा गया है; ‘तुम्हारे बीच’ की वास्तविक व्याकरणिक सम्भावना टिप्पणी में सुरक्षित है।
- source_word: מֵהֵיכַל קָדְשׁוֹ
  choice: अपने पवित्र मन्दिर से
  rationale: הֵיכָל का अर्थ मन्दिर अथवा राजमहल हो सकता है। परमेश्वर के पवित्र निवास के लिए ‘मन्दिर’ सबसे सहज है, जबकि अन्य सम्भव अर्थ टिप्पणी में दिए गए हैं।
theological_decisions:
- issue: संयुक्त ईश्वरीय उपाधि אֲדֹנָי יְהוִה का अनुवाद
  choice: प्रभु याहवे
  alternative: प्रभु यहोवा; परमप्रधान प्रभु
  rationale: यह रूप אֲדֹנָי और יהוה दोनों को अलग-अलग प्रकट करता तथा वाचा के व्यक्तिगत नाम को सामान्य उपाधि में विलीन नहीं करता।
- issue: אֶרֶץ का दायरा
  choice: पृथ्वी
  alternative: देश; भूमि
  rationale: ‘सब जातियों’ और पृथ्वी में मौजूद सब कुछ के समानान्तर प्रयोग से यहाँ विश्वव्यापी न्यायिक आह्वान अधिक सम्भावित है, यद्यपि शब्द अपने आप में ‘देश’ या ‘भूमि’ भी कह सकता है।
- issue: בָּכֶם का न्यायिक सम्बन्ध
  choice: तुम्हारे विरुद्ध
  alternative: तुम्हारे बीच
  rationale: ‘साक्षी’ के साथ भविष्यद्वक्ताई अभियोग का प्रसंग प्रतिकूल अर्थ का समर्थन करता है, पर पूर्वसर्ग की व्यापक अर्थ-सीमा के कारण वैकल्पिक पाठ टिप्पणी में रखा गया है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में गंभीर, काव्यात्मक और सार्वजनिक उद्घोषणा के योग्य रखी गई है। पृथ्वी को सीधे सम्बोधित करने के लिए ‘तुझमें’ और स्त्रीलिंग ‘ध्यान दे’ का प्रयोग मूल हिब्रू की व्यक्ति-कल्पना तथा व्याकरणिक एकवचन को बनाए रखता है।
