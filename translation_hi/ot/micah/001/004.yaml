  yaml_path: translation/ot/micah/001/004.yaml
  text: And the mountains will melt beneath him, and the valleys will split open, like wax before the fire, like waters poured down a slope.
translation:
  language: hi
  text: 'और उसके नीचे पहाड़ पिघल जाएँगे,

    और घाटियाँ फटकर खुल जाएँगी—

    जैसे आग के सामने मोम पिघलता है,

    जैसे ढलान पर पानी बहाया जाता है।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְנָמַסּוּ
  choice: पिघल जाएँगे
  rationale: क्रिया נמס का सामान्य अर्थ पिघलना या घुलना है। आगे मोम की उपमा के कारण यहाँ ‘पिघल जाएँगे’ सबसे स्वाभाविक और चित्रात्मक है।
- source_word: הֶהָרִים
  choice: पहाड़
  rationale: निश्चित बहुवचन संज्ञा का सहज हिन्दी रूप; हिन्दी में प्रसंग और वाक्य-रचना से निश्चितता स्पष्ट है।
- source_word: תַּחְתָּיו
  choice: उसके नीचे
  rationale: पूर्ववर्ती पद में आए यहोवा की ओर संकेत करने वाले तीसरे पुरुष एकवचन प्रत्यय को दोहराए बिना सुरक्षित रखता है।
- source_word: וְהָעֲמָקִים
  choice: घाटियाँ
  rationale: עֲמָקִים गहरे स्थानों या घाटियों को दर्शाता है; ‘घाटियाँ’ पहाड़ों के साथ स्वाभाविक काव्यात्मक जोड़ी बनाता है।
- source_word: יִתְבַּקָּעוּ
  choice: फट जाएँगी
  rationale: हित्पअेल रूप के फटने, चिरने या अलग हो जाने के तीव्र बिंब को संक्षिप्त और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: כַּדּוֹנַג
  choice: जैसे ... मोम
  rationale: דּוֹנַג का सीधा अर्थ मोम है; उपमा को स्पष्ट रखा गया है।
- source_word: מִפְּנֵי הָאֵשׁ
  choice: आग के सामने
  rationale: शाब्दिक भाव ‘आग की उपस्थिति के सामने’ है; यह रूप आग के प्रभाव को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: כְּמַיִם
  choice: जैसे ... पानी
  rationale: हिब्रू में מַיִם रूपतः बहुवचन है, पर आधुनिक हिन्दी में इस द्रव्य के लिए ‘पानी’ ही स्वाभाविक सामूहिक संज्ञा है।
- source_word: מֻגָּרִים
  choice: उँडेला हुआ
  rationale: נגר के हॉफअल कृदंत में बहाए या उँडेले जाने का निष्क्रिय भाव है; ‘उँडेला हुआ’ कारणगत प्रवाह को स्पष्ट करता है।
- source_word: בְּמוֹרָד
  choice: ढलान पर
  rationale: מוֹרָד उतराई या ढलान को दर्शाता है। पानी के संदर्भ में ‘ढलान पर’ नीचे की ओर बहने का भाव स्वाभाविक रूप से देता है।
theological_decisions:
- issue: ‘उसके नीचे’ में सर्वनाम का संदर्भ
  choice: सर्वनाम पिछले पद में वर्णित यहोवा की ओर संकेत करता है और सृष्टि पर उसके आगमन का प्रभाव दिखाता है।
  alternative: नाम को स्पष्ट करते हुए ‘यहोवा के नीचे’ कहा जा सकता था।
  rationale: हिब्रू पाठ स्वयं नाम दोहराने के बजाय तीसरे पुरुष का प्रत्यय रखता है। ‘उसके नीचे’ इस पाठीय संबद्धता को बचाता है, जबकि संदर्भ से संकेत स्पष्ट रहता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और काव्यात्मक रखी गई है। समानांतर पंक्तियाँ और दोनों उपमाएँ हिब्रू काव्य की गति बनाए रखती हैं; कठिन या पुरातन शब्दावली से बचा गया है।
