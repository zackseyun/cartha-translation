source:
  edition: WLC
  text: בְּ/פֶ֤שַׁע יַֽעֲקֹב֙ כָּל זֹ֔את וּ/בְ/חַטֹּ֖אות בֵּ֣ית יִשְׂרָאֵ֑ל מִֽי פֶ֣שַׁע יַעֲקֹ֗ב הֲ/לוֹא֙ שֹֽׁמְר֔וֹן וּ/מִי֙ בָּמ֣וֹת יְהוּדָ֔ה הֲ/ל֖וֹא יְרוּשָׁלִָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/001/005.yaml
  text: All this is because of Jacob’s transgression[a], and because of the sins of the house of Israel[b]. What is Jacob’s transgression? Is it not Samaria? And what are the high places of Judah? Are they not Jerusalem?
translation:
  language: hi
  text: यह सब याकूब के अपराध[a] के कारण और इस्राएल के घराने के पापों के कारण है। याकूब का अपराध क्या है? क्या वह सामरिया नहीं? और यहूदा के ऊँचे स्थान[b] कौन-से हैं? क्या वे यरूशलेम नहीं?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘अपराध’ के स्थान पर दोनों जगह ‘विद्रोह’ भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: ‘ऊँचे स्थान’ पूजा के लिए बने ऊँचे स्थलों को कहते हैं; वे प्रायः अनधिकृत या मूर्तिपूजक आराधना से जुड़े होते थे।
    reason: cultural_note
lexical_decisions:
- source_word: בְּ/פֶשַׁע
  choice: अपराध के कारण
  rationale: यहाँ בְּ कारणसूचक है और आने वाले न्याय का कारण बताता है। פֶשַׁע परमेश्वर के विरुद्ध अपराध या विद्रोह को दर्शाता है; ‘अपराध’ आधुनिक हिन्दी में स्वाभाविक है और नैतिक गंभीरता बनाए रखता है।
- source_word: יַעֲקֹב
  choice: याकूब
  rationale: इब्रानी में आए नाम को यथावत रखा गया है, क्योंकि आगे ‘इस्राएल का घराना’ अलग पदबंध के रूप में आता है और इस प्रकार काव्यात्मक समानता बनी रहती है।
- source_word: כָּל זֹאת
  choice: यह सब
  rationale: यह पदबंध पिछले पदों में वर्णित घटनाओं की ओर संकेत करता है। ‘यह सब’ बिना कोई व्याख्यात्मक संज्ञा जोड़े उसके व्यापक संकेत को बनाए रखता है।
- source_word: וּ/בְ/חַטֹּאות
  choice: और ... पापों के कारण
  rationale: पूर्ववर्ती पदबंध के समान यहाँ भी पूर्वसर्ग कारणसूचक है। प्रसंग में חַטֹּאות का अर्थ ‘पाप’ है, पापबलि नहीं।
- source_word: בֵּית יִשְׂרָאֵל
  choice: इस्राएल का घराना
  rationale: यह औपचारिक वाचा-संबंधी राष्ट्रीय अभिव्यक्ति और ‘याकूब’ के साथ उसकी समानांतरता को सुरक्षित रखता है।
- source_word: מִי פֶשַׁע יַעֲקֹב
  choice: याकूब का अपराध क्या है?
  rationale: מִי का मूल रूप ‘कौन?’ है, पर यहाँ वह अपराध के प्रतिनिधि केंद्र की पहचान कराने वाला आलंकारिक प्रश्न है। हिन्दी में ‘क्या है?’ अर्थ को स्वाभाविक रूप से व्यक्त करता है।
- source_word: שֹׁמְרוֹן
  choice: सामरिया
  rationale: स्थान-नाम का प्रचलित हिन्दी रूप; यहाँ उत्तरी राज्य की राजधानी उसके अपराध के प्रतिनिधि केंद्र के रूप में आती है।
- source_word: בָּמוֹת
  choice: ऊँचे स्थान
  rationale: यह शब्द पूजा के ऊँचे स्थलों को सूचित करता है, जो प्रायः अनधिकृत या मूर्तिपूजक आराधना से जुड़े थे। ‘ऊँचे स्थान’ स्थलाकृतिक और बाइबिलीय प्रतिध्वनि बनाए रखता है।
- source_word: הֲ/לוֹא
  choice: क्या ... नहीं?
  rationale: यह प्रश्नवाचक पद सकारात्मक उत्तर की अपेक्षा करता है। हिन्दी का नकारात्मक आलंकारिक प्रश्न उसी बल को स्वाभाविक रूप से बनाए रखता है।
- source_word: יְרוּשָׁלִָם
  choice: यरूशलेम
  rationale: स्थान-नाम का प्रचलित हिन्दी रूप; इसे यहूदा के बहुवचन ‘ऊँचे स्थानों’ के उत्तर में रखकर मूल की व्याकरणिक और आलंकारिक तनावपूर्ण संरचना सुरक्षित रखी गई है।
theological_decisions:
- issue: ‘याकूब के अपराध’ और ‘यहूदा के ऊँचे स्थानों’ के साथ सामरिया और यरूशलेम का संबंध
  choice: दोनों राजधानी-नगरों को लोगों के अपराध और दूषित आराधना के प्रतिनिधि केंद्रों के रूप में आलंकारिक प्रश्नों के उत्तर में रखा गया है।
  alternative: इसे अधिक अमूर्त ढंग से ऐसा भी समझा जा सकता है कि सामरिया स्वयं याकूब का अपराध और यरूशलेम स्वयं यहूदा के ऊँचे स्थान हैं; कुछ अनुवाद दूसरे बहुवचन को एकवचन बनाकर सरल करते हैं।
  rationale: इब्रानी पाठ बहुवचन בָּמוֹת और एकवचन नगर-नाम יְרוּשָׁלִָם के बीच तनाव को बनाए रखता है। मुख्य पाठ इस संरचना को समझाकर समाप्त करने या एकवचन में बदलने के बजाय सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और मौखिक पठन के अनुकूल शैली अपनाई गई है। ‘घराना’, ‘अपराध’ और ‘ऊँचे स्थान’ जैसे पद मूल की वाचा-संबंधी, नैतिक और सांस्कृतिक विशेषताओं को बनाए रखते हैं। [b] को ‘ऊँचे स्थान’ के साथ रखा गया है, क्योंकि टिप्पणी उसी पद की व्याख्या करती है।
