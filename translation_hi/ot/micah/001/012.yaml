source:
  edition: WLC
  text: כִּֽי חָ֥לָֽה לְ/ט֖וֹב יוֹשֶׁ֣בֶת מָר֑וֹת כִּֽי יָ֤רַד רָע֙ מֵ/אֵ֣ת יְהוָ֔ה לְ/שַׁ֖עַר יְרוּשָׁלִָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/001/012.yaml
  text: For the inhabitant of Maroth writhes for good, because disaster has come down from the LORD to the gate of Jerusalem.
translation:
  language: hi
  text: क्योंकि मारोत की निवासिनी भलाई के लिए तड़पती है; क्योंकि विपत्ति यहोवा की ओर से यरूशलेम के फाटक तक उतर आई है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חָלָה לְטוֹב
  choice: भलाई के लिए तड़पती है
  rationale: חלה का मूल अर्थ दुर्बल या व्याकुल होना है; यहाँ स्त्रीलिंग कर्ता के साथ यह तीव्र पीड़ा और व्याकुल आकांक्षा व्यक्त करता है। 'तड़पती है' इस तनाव को बनाए रखता है, जबकि לְטוֹב को स्वाभाविक रूप से 'भलाई के लिए' रखा गया है।
- source_word: יוֹשֶׁבֶת מָרוֹת
  choice: मारोत की निवासिनी
  rationale: स्त्रीलिंग एकवचन participle को नगर की सामूहिक स्त्री-छवि अथवा उसकी निवासी के रूप में अनुवादित किया गया है; एकवचन और स्त्रीलिंग दोनों सुरक्षित हैं।
- source_word: רָע
  choice: विपत्ति
  rationale: संदर्भ में यह नैतिक बुराई नहीं, यहोवा की ओर से आने वाली विपदा या न्यायजनित संकट है; 'विपत्ति' अर्थ को स्पष्ट किए बिना उपयुक्त रूप से व्यक्त करता है।
- source_word: מֵאֵת יְהוָה
  choice: यहोवा की ओर से
  rationale: מֵאֵת स्रोत या प्रेषण को दर्शाता है। परमेश्वर के निज नाम יהוה को हिन्दी में प्रचलित रूप 'यहोवा' से दिया गया है।
- source_word: לְשַׁעַר יְרוּשָׁלָם
  choice: यरूशलेम के फाटक तक
  rationale: לְ यहाँ गंतव्य या सीमा को दर्शाता है; 'तक' विपत्ति के नगर-द्वार तक पहुँचने का भाव स्पष्ट करता है।
theological_decisions:
- issue: विपत्ति का यहोवा की ओर से आना
  choice: विपत्ति यहोवा की ओर से ... उतर आई है
  alternative: विपत्ति यहोवा की अनुमति से आई है
  rationale: मूल पाठ सीधे מֵאֵת יְהוָה कहता है। केवल 'अनुमति' कहना पाठ के प्रत्यक्ष दैवी स्रोत/न्याय के कथन को नरम कर देता; इसलिए उसकी धार्मिक तनावपूर्ण स्पष्टता सुरक्षित रखी गई है।
- issue: חָלָה की अस्पष्ट भाव-छाया
  choice: तड़पती है
  alternative: भलाई की आशा में व्याकुल होकर प्रतीक्षा करती है
  rationale: मूल क्रिया पीड़ा, दुर्बलता या व्याकुलता व्यक्त करती है, पर स्वयं 'प्रतीक्षा' नहीं कहती। 'तड़पती है' शारीरिक-भावात्मक तीव्रता को बनाए रखते हुए अनावश्यक व्याख्या से बचता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, काव्यात्मक और गरिमापूर्ण शैली। 'मारोत की निवासिनी' मूल के स्त्रीलिंग एकवचन नगर-व्यक्तिकरण को सुरक्षित रखता है; समानांतर उपवाक्यों में दो बार 'क्योंकि' रखकर हिब्रू संरचना और कारणात्मक जोर बनाए गए हैं।
