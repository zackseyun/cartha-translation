  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: עֹ֗ד הַ/יֹּרֵשׁ֙ אָ֣בִי לָ֔/ךְ יוֹשֶׁ֖בֶת מָֽרֵשָׁ֑ה עַד עֲדֻּלָּ֥ם יָב֖וֹא כְּב֥וֹד יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/001/015.yaml
  text: I will yet bring an heir against you[a], inhabitant of Mareshah[b]; the glory of Israel will come as far as Adullam.
translation:
  language: hi
  text: मैं फिर तेरे विरुद्ध एक अधिकार करनेवाला लाऊँगा[a], हे मारेशा में बसनेवाली; इस्राएल का गौरव[b] अदुल्लाम तक आएगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “एक वारिस,” “अधिकार पानेवाला,” अथवा “विजेता।” हिब्रू में संभवतः “मारेशा” नाम के साथ शब्द-क्रीड़ा है।
    reason: lexical_alternative
  - marker: b
    text: “इस्राएल का गौरव” का अर्थ “इस्राएल के प्रतिष्ठित जन” अथवा “इस्राएल की संपदा या शोभा” भी हो सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: עֹד
  choice: फिर
  rationale: यह न्याय की आगामी, अतिरिक्त कार्रवाई का संकेत देता है; आधुनिक हिन्दी में यहाँ ‘फिर’ स्वाभाविक है।
- source_word: הַיֹּרֵשׁ
  choice: एक अधिकारी
  rationale: यह ירשׁ से बना है, जिसका अर्थ उत्तराधिकार पाना, अधिकार करना या बेदखल करके कब्ज़ा लेना हो सकता है। ‘अधिकारी’ यहाँ कब्ज़ा करने वाले के अर्थ को रखता है, यद्यपि मारेशा के साथ हिब्रू शब्द-क्रीड़ा हिन्दी में पूरी तरह नहीं आती।
- source_word: אָבִי לָךְ
  choice: मैं तेरे विरुद्ध ... लाऊँगा
  rationale: हिफ़ील रूप और ל संदर्भ में किसी शत्रुतापूर्ण व्यक्ति को नगर के विरुद्ध लाने का भाव देते हैं।
- source_word: יוֹשֶׁבֶת מָרֵשָׁה
  choice: हे मारेशा की निवासिनी
  rationale: स्त्रीलिंग एकवचन संबोधन नगर को स्त्री के रूप में सम्बोधित करता है; यह रूप उस काव्यात्मक व्यक्तिकरण को बनाए रखता है।
- source_word: עַד עֲדֻּלָּם יָבוֹא
  choice: अदुल्लाम तक आएगा
  rationale: עַד यहाँ स्थानगत सीमा दर्शाता है और יָבוֹא गति के सामान्य अर्थ को बनाए रखता है।
- source_word: כְּבוֹד יִשְׂרָאֵל
  choice: इस्राएल का वैभव
  rationale: כבוד के महिमा, गौरव, वैभव, प्रतिष्ठित जन अथवा संपदा जैसे अर्थ हो सकते हैं। ‘वैभव’ व्यापकता और संदर्भगत अस्पष्टता को पर्याप्त रूप से बनाए रखता है।
theological_decisions:
- issue: ‘इस्राएल का वैभव’ का अभिप्रेत संदर्भ
  choice: मुख्य पाठ में व्यापक और अस्पष्ट ‘इस्राएल का वैभव’ रखा गया।
  alternative: इस्राएल के प्रतिष्ठित जन; इस्राएल की संपदा/शोभा
  rationale: हिब्रू पदबंध यह निश्चित नहीं करता कि संकेत कुलीन लोगों, राष्ट्रीय गौरव या संपदा की ओर है; इसलिए मुख्य पाठ इसे संकीर्ण नहीं करता और विकल्प पादटिप्पणी में दिए गए हैं।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण भविष्यद्वाणी-संबंधी काव्यात्मक गद्य। ‘तेरे’ और ‘हे ... निवासिनी’ से नगर के स्त्रीलिंग एकवचन व्यक्तिकरण को सुरक्षित रखा गया है।
