source:
  edition: WLC
  text: וְ/כָל פְּסִילֶ֣י/הָ יֻכַּ֗תּוּ וְ/כָל אֶתְנַנֶּ֨י/הָ֙ יִשָּׂרְפ֣וּ בָ/אֵ֔שׁ וְ/כָל עֲצַבֶּ֖י/הָ אָשִׂ֣ים שְׁמָמָ֑ה כִּ֠י מֵ/אֶתְנַ֤ן זוֹנָה֙ קִבָּ֔צָה וְ/עַד אֶתְנַ֥ן זוֹנָ֖ה יָשֽׁוּבוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/001/007.yaml
  text: All her carved images will be smashed[a], and all her prostitute’s wages will be burned with fire; all her idols I will make desolate. For from the wages of a prostitute she gathered them[c][b], and to the wages of a prostitute they will return.
translation:
  language: hi
  text: उसकी सभी तराशी हुई मूर्तियाँ चकनाचूर कर दी जाएँगी[a], और उसकी वेश्यावृत्ति की सारी कमाई आग में जला दी जाएगी। उसकी सभी देवमूर्तियों को मैं उजाड़ में बदल दूँगा। क्योंकि उसने उन्हें वेश्या की कमाई से इकट्ठा किया था[b], और वे वेश्या की कमाई में लौट जाएँगी[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘खोदी हुई प्रतिमाएँ।’
    reason: lexical_alternative
  - marker: b
    text: ‘वेश्या की कमाई’ यहाँ मूर्तिपूजा रूपी विश्वासघात से प्राप्त धन-संपत्ति का रूपक है।
    reason: cultural_note
  - marker: c
    text: या ‘वे फिर वेश्या की कमाई बन जाएँगी।’
    reason: alternative_reading
lexical_decisions:
- source_word: פְּסִילֶיהָ
  choice: उसकी सभी खुदी हुई मूर्तियाँ
  rationale: פֶּסֶל किसी तराशी या खोदकर बनाई गई प्रतिमा, विशेषतः देवप्रतिमा, को दर्शाता है। ‘खुदी हुई मूर्तियाँ’ उसके ठोस निर्माण-संबंधी अर्थ को सहज आधुनिक हिन्दी में बनाए रखता है।
- source_word: יֻכַּתּוּ
  choice: चकनाचूर कर दी जाएँगी
  rationale: पुअल रूप हिंसक और पूर्ण विनाश व्यक्त करता है; यह पदबंध हिन्दी में उस तीव्रता को स्वाभाविक ढंग से प्रकट करता है।
- source_word: אֶתְנַנֶּיהָ
  choice: उसकी वेश्यावृत्ति की सारी कमाई
  rationale: אֶתְנַן वेश्यावृत्ति के बदले मिले भुगतान को सूचित करता है। ‘वेश्यावृत्ति की कमाई’ स्पष्ट है और मूल के यौन तथा धार्मिक रूपक को बनाए रखता है।
- source_word: יִשָּׂרְפוּ בָאֵשׁ
  choice: आग में जला दी जाएगी
  rationale: मूल में आग का स्पष्ट उल्लेख है; हिन्दी में ‘आग में जला दी जाएगी’ स्वाभाविक और अर्थनिष्ठ है।
- source_word: עֲצַבֶּיהָ
  choice: उसकी सभी देवमूर्तियों
  rationale: यहाँ עָצָב पूजित प्रतिमाओं को सूचित करता है। पहले प्रयुक्त ‘खुदी हुई मूर्तियाँ’ से अर्थगत संबंध रखते हुए ‘देवमूर्तियाँ’ पठनीय भिन्नता देता है।
- source_word: אָשִׂים שְׁמָמָה
  choice: मैं उजाड़ दूँगा
  rationale: यह अभिव्यक्ति किसी वस्तु को निर्जन अथवा विनष्ट दशा में पहुँचा देने का अर्थ देती है। ‘उजाड़ दूँगा’ संक्षिप्त, स्वाभाविक और गंभीर है।
- source_word: מֵאֶתְנַן זוֹנָה קִבָּצָה
  choice: उसने उन्हें वेश्या की कमाई से इकट्ठा किया था
  rationale: स्त्रीलिंग कर्ता सामरिया है, जिसे स्त्री के रूप में व्यक्त किया गया है। ‘उन्हें’ पिछले संदर्भ की मूर्तियों और धन-संपदा की ओर संकेत करता है, जबकि रूपक को यथावत रखता है।
- source_word: וְעַד אֶתְנַן זוֹנָה יָשׁוּבוּ
  choice: और वे फिर वेश्या की कमाई बन जाएँगी
  rationale: ל/עד संबंध और שוב के इस संदर्भगत परिणाम को हिन्दी में ‘फिर ... बन जाएँगी’ स्वाभाविक रूप से व्यक्त करता है। ‘वेश्या की कमाई के पास लौटेंगी’ अधिक शाब्दिक पर अस्पष्ट होगा; वैकल्पिक समझ पादटिप्पणी में दी गई है।
theological_decisions:
- issue: 'वेश्यावृत्ति का रूपक: मूर्तिपूजा और उससे अर्जित संपत्ति'
  choice: मुख्य पाठ में ‘वेश्यावृत्ति’ और ‘वेश्या की कमाई’ स्पष्ट रूप से रखना
  alternative: इसे ‘अनैतिक कमाई’ या ‘मूर्तिपूजा से अर्जित धन’ कहकर नरम अथवा व्याख्यायित करना
  rationale: इब्रानी पाठ אֶתְנַן और זוֹנָה को दोहराकर जानबूझकर तीखा रूपक रचता है। उसे नरम करने से भविष्यद्वाणी की शक्ति और धार्मिक विश्वासघात का बिंब घट जाएगा।
- issue: स्त्रीलिंग रूपों का संकेत
  choice: सामरिया को स्त्रीरूप में निहित रखना और ‘उसकी/उसने’ कहना
  alternative: नगर के लिए निरपेक्ष ‘उसके/उसने’ की ऐसी रचना करना जिसमें स्त्री-व्यक्तिकरण लुप्त हो जाए
  rationale: इब्रानी के स्त्रीलिंग रूप सामरिया नगर के स्त्री-व्यक्तिकरण और वेश्यावृत्ति के रूपक से अभिन्न हैं। हिन्दी में स्त्रीलिंग सर्वनाम इसे सुरक्षित रखते हैं।
- issue: अंतिम उपवाक्य का संबंध
  choice: ‘वे फिर वेश्या की कमाई बन जाएँगी’
  alternative: ‘वे वेश्या की कमाई के पास लौट जाएँगी’
  rationale: 'मूल अभिव्यक्ति में कुछ अर्थगत तनाव है: लूटी हुई वस्तुएँ फिर उसी प्रकार की कमाई बन सकती हैं, अथवा वेश्याओं की कमाई के क्षेत्र में लौट सकती हैं। मुख्य पाठ में सहज संभावित अर्थ लिया गया है और वैकल्पिक अधिक शाब्दिक अर्थ पादटिप्पणी में सुरक्षित है।'
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। भविष्यद्वाणी की तीखी वेश्यावृत्ति-संबंधी उपमा को नरम नहीं किया गया। ‘चकनाचूर’, ‘आग में जला’, और ‘उजाड़’ न्याय-वचन की प्रबलता बनाए रखते हैं। सभी पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित हैं।
