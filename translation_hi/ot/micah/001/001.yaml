id: MIC.1.1
reference: Micah 1:1
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: דְּבַר יְהוָ֣ה אֲשֶׁ֣ר הָיָ֗ה אֶל מִיכָה֙ הַ/מֹּ֣רַשְׁתִּ֔י בִּ/ימֵ֥י יוֹתָ֛ם אָחָ֥ז יְחִזְקִיָּ֖ה מַלְכֵ֣י יְהוּדָ֑ה אֲשֶׁר חָזָ֥ה עַל שֹׁמְר֖וֹן וִ/ירֽוּשָׁלִָֽם־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/001/001.yaml
  text: The word of Yahweh that came to Micah the Morashtite in the days of Jotham[a], Ahaz, and Hezekiah, kings of Judah[b], which he saw concerning Samaria and Jerusalem.
translation:
  language: hi
  text: यहूदा के राजा योताम, आहाज़ और हिज़किय्याह के दिनों में याहवे का वचन मोरेशेतवासी[a] मीका के पास आया, जिसे उसने सामरिया और यरूशलेम के विषय में[b] देखा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात् मोरेशेत नगर का रहनेवाला।
    reason: cultural_note
  - marker: b
    text: या, “सामरिया और यरूशलेम के विरुद्ध।” इब्रानी पूर्वसर्ग विषय भी बता सकता है और इस प्रसंग में विरोध या न्याय का भाव भी दे सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: דְּבַר יְהוָה
  choice: याहवे का वचन
  rationale: यह नबूवत की भूमिका में प्रयुक्त स्थापित सूत्र है। ‘वचन’ दैवी संदेश का भाव रखता है, और याहवे परमेश्वर के व्यक्तिगत नाम को दर्शाता है।
- source_word: אֲשֶׁר הָיָה אֶל
  choice: के पास आया
  rationale: इब्रानी मुहावरे को स्वाभाविक हिन्दी में व्यक्त करता है और बताता है कि मीका ने दैवी प्रकाशन प्राप्त किया।
- source_word: הַמֹּרַשְׁתִּי
  choice: मोरेशेतवासी
  rationale: यह संबंधवाचक रूप मीका के मूल स्थान को बताता है; ‘मोरेशेतवासी’ हिन्दी में संक्षिप्त और स्पष्ट है।
- source_word: בִּימֵי
  choice: के दिनों में
  rationale: इब्रानी राजकाल-सूचक अभिव्यक्ति का निकट और स्वाभाविक हिन्दी रूप।
- source_word: אֲשֶׁר חָזָה
  choice: जिसे उसने ... देखा
  rationale: ‘देखना’ नबी को मिले दर्शन का शब्दचित्र सुरक्षित रखता है और ‘वचन’ को केवल ‘सुनने’ तक सीमित नहीं करता।
- source_word: עַל
  choice: के विषय में
  rationale: यह व्यापक अर्थ विषय-संबंध को व्यक्त करता है, जबकि न्याय के प्रसंग में ‘के विरुद्ध’ अर्थ की संभावना को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: שֹׁמְרוֹן וִירוּשָׁלָם
  choice: सामरिया और यरूशलेम
  rationale: मूल पाठ नगरों का नाम लेता है; इसलिए उनके द्वारा सूचित राज्यों को अनुवाद में स्पष्ट रूप से जोड़ना उचित नहीं है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में चार अक्षरों वाला व्यक्तिगत ईश्वरीय नाम है। ‘याहवे’ उसका प्रचलित विद्वत्तापूर्ण लिप्यंतरण है और उसे किसी उपाधि से नहीं बदलता।
- issue: עַל का संबंधात्मक या विरोधात्मक अर्थ
  choice: के विषय में
  alternative: के विरुद्ध
  rationale: भूमिका में यह पूर्वसर्ग दर्शन की विषयवस्तु बता सकता है, पर आने वाले न्याय-संदेश के कारण विरोधात्मक अर्थ भी संभव है; मुख्य पाठ व्यापक अर्थ रखता है और विकल्प पादटिप्पणी में दिया गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। राजाओं के नाम मानक हिन्दी बाइबलीय रूपों में हैं। वाक्यक्रम को हिन्दी के अनुरूप बनाया गया है, पर ‘वचन’ को ‘देखने’ की मूल नबूवती अभिव्यक्ति और עַל की अर्थगत खुली संभावना सुरक्षित रखी गई है।
