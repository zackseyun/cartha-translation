source:
  edition: WLC
  text: רְתֹ֧ם הַ/מֶּרְכָּבָ֛ה לָ/רֶ֖כֶשׁ יוֹשֶׁ֣בֶת לָכִ֑ישׁ רֵאשִׁ֨ית חַטָּ֥את הִיא֙ לְ/בַת צִיּ֔וֹן כִּי בָ֥/ךְ נִמְצְא֖וּ פִּשְׁעֵ֥י יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/001/013.yaml
  text: Harness the chariot to the swift horse[a], inhabitant of Lachish; she was the beginning of sin to daughter Zion[d][c][b], for in you were found the transgressions of Israel.
translation:
  language: hi
  text: रथ को तेज़ घोड़े[a] से जोत, हे लाकीश में बसनेवाली[b]; सिय्योन की बेटी[d] के लिए पाप का आरम्भ लाकीश ही थी[c], क्योंकि इस्राएल के विद्रोह[e] तुझमें पाए गए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘तेज़ दौड़नेवाले घोड़े’ अथवा ‘घोड़ों की टोली’। इब्रानी शब्द किसी तेज़ सवारी के पशु या घोड़े के लिए प्रयुक्त हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में स्त्रीलिंग एकवचन रूप है; लाकीश नगर को एक स्त्री के रूप में संबोधित किया गया है।
    reason: cultural_note
  - marker: c
    text: या ‘लाकीश ही पाप का पहला कारण थी’। वाक्य लाकीश को उस आरम्भिक स्थान के रूप में दिखा सकता है जहाँ से यह पाप यहूदा में फैला।
    reason: alternative_reading
  - marker: d
    text: ‘सिय्योन की बेटी’ सिय्योन या यरूशलेम को स्त्री के रूप में प्रस्तुत करने वाली इब्रानी काव्यात्मक अभिव्यक्ति है।
    reason: cultural_note
  - marker: e
    text: या ‘अपराध’। इब्रानी शब्द जानबूझकर की गई बगावत या अवज्ञा पर बल दे सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: רְתֹם הַמֶּרְכָּבָה לָרֶכֶשׁ
  choice: तेज़ घोड़े को रथ में जोत
  rationale: रְתֹם एकवचन आज्ञार्थक है और पशु को वाहन में जोतने का आदेश देता है। מֶרְכָּבָה को ‘रथ’ तथा רֶכֶשׁ को गति के भाव सहित ‘तेज़ घोड़ा’ कहा गया है। हिंदी में ‘रथ में जोत’ स्वाभाविक है।
- source_word: יוֹשֶׁבֶת לָכִישׁ
  choice: हे लाकीश में बसनेवाली
  rationale: स्त्रीलिंग एकवचन कृदन्त नगर को स्त्री के रूप में संबोधित करता है। यह रूप उस मानवीकरण को बनाए रखते हुए आधुनिक हिंदी में बोधगम्य है।
- source_word: רֵאשִׁית חַטָּאת הִיא
  choice: पाप का आरम्भ वही थी
  rationale: רֵאשִׁית का मूल अर्थ आरम्भ/पहला भाग और חַטָּאת का यहाँ नैतिक अर्थ ‘पाप’ है। ‘वही’ स्त्रीलिंग नगर लाकीश की ओर संकेत स्पष्ट करता है, पर ऐतिहासिक प्रक्रिया को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: לְבַת צִיּוֹן
  choice: सिय्योन की बेटी के लिए
  rationale: לְ को प्रसंगानुसार ‘के लिए’ और पारंपरिक काव्यात्मक मानवीकरण בַת־צִיּוֹן को ‘सिय्योन की बेटी’ रखा गया है।
- source_word: בָךְ נִמְצְאוּ
  choice: तुझमें पाए गए
  rationale: स्त्रीलिंग एकवचन संबोधन को ‘तुझमें’ से सुरक्षित रखा गया है और निफ़अल रूप का सीधा निष्क्रिय अर्थ ‘पाए गए’ दिया गया है।
- source_word: פִּשְׁעֵי יִשְׂרָאֵל
  choice: इस्राएल के विद्रोह
  rationale: פֶּשַׁע जानबूझकर किए गए उल्लंघन या बगावत का भाव रखता है; ‘विद्रोह’ इसकी गंभीरता को सामान्य ‘गलतियों’ से बेहतर व्यक्त करता है।
theological_decisions:
- issue: भविष्यद्वाणी के आरोप में חַטָּאת का अर्थ
  choice: पाप
  alternative: पापबलि
  rationale: लाकीश और सिय्योन पर नैतिक आरोप तथा आगे इस्राएल के विद्रोहों का उल्लेख बलिदान के बजाय पाप को स्पष्ट करता है।
- issue: רֵאשִׁית חַטָּאת का बल
  choice: लाकीश सिय्योन की बेटी के लिए पाप का आरम्भ थी
  alternative: लाकीश पाप का पहला कारण थी; अथवा उसका प्रमुख पाप थी
  rationale: शब्दावली लाकीश को पाप के आरम्भ या उद्गम-बिंदु के रूप में प्रस्तुत करती है। मुख्य पाठ ‘आरम्भ’ रखकर यह तनाव सुरक्षित रखता है कि कथन कालक्रम, स्रोत या प्रभाव में से किस पहलू पर विशेष बल देता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और मौखिक पठन के योग्य रखी गई है। ‘लाकीश में बसनेवाली’ तथा ‘तुझमें’ नगर के स्त्री-मानवीकरण को बनाए रखते हैं। ‘सिय्योन की बेटी’ मूल काव्यात्मक बिंब को सपाट किए बिना हिंदी पाठकों के लिए टिप्पणी सहित प्रस्तुत करती है।
