base_translation:
  language: en
  yaml_path: translation/ot/micah/001/006.yaml
  text: So I will make Samaria a heap in the open country[a], a place for planting vineyards[b]; I will pour her stones down into the valley and uncover her foundations.
translation:
  language: hi
  text: और मैं सामरिया को खुले मैदान में मलबे का ढेर[a] और दाख की बारियाँ लगाने की जगह बना दूँगा। मैं उसके पत्थरों को घाटी में उँडेल दूँगा[b] और उसकी नींवों को उघाड़ दूँगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘खेत में खंडहर का ढेर।’ इब्रानी पदबंध संक्षिप्त है और इसका अधिक शाब्दिक अनुवाद इस प्रकार किया जा सकता है।
    reason: lexical_alternative
  - marker: b
    text: या ‘उसके पत्थरों को खड्ड में लुढ़का दूँगा।’ क्रिया का शाब्दिक भाव किसी चीज़ को बहाने या नीचे उँडेलने का है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשַׂמְתִּי
  choice: इसलिए मैं … बना दूँगा
  rationale: संयोजक वाव सहित पूर्ण क्रिया भविष्यसूचक घोषणा में भविष्य का भाव देती है। ‘बना दूँगा’ שׂוּם का सीधा अर्थ रखता है और ‘इसलिए’ पूर्ववर्ती न्याय-घोषणा से स्वाभाविक संबंध दिखाता है।
- source_word: שֹׁמְרוֹן
  choice: सामरिया
  rationale: इस स्थान-नाम का हिन्दी में प्रचलित बाइबलीय रूप।
- source_word: לְעִי הַשָּׂדֶה
  choice: खुले मैदान में मलबे का ढेर
  rationale: עִי उजड़े हुए स्थान के मलबे या खंडहर के ढेर को दर्शाता है और הַשָּׂדֶה नगर के विपरीत खुले खेत या मैदान की छवि देता है। यह अनुवाद विनाश और स्थान, दोनों को स्पष्ट रखता है।
- source_word: לְמַטָּעֵי כָרֶם
  choice: दाख की बारियाँ लगाने की जगह
  rationale: 'यह पदबंध परिणाम या प्रयोजन बताता है: नगर का स्थान दाख की बारियाँ लगाने योग्य हो जाएगा। बहुवचन अर्थ और कृषि-बिंब दोनों सुरक्षित हैं।'
- source_word: וְהִגַּרְתִּי
  choice: उँडेल दूँगा
  rationale: נגר के हिफ़ील रूप में किसी वस्तु को बहाने या उँडेलने का कारक भाव है। पत्थरों के साथ यह जानबूझकर प्रयुक्त सजीव रूपक है, जिसे सामान्य ‘फेंक दूँगा’ से समतल नहीं किया गया।
- source_word: לַגַּי
  choice: घाटी में
  rationale: גַּי घाटी अथवा सँकरी खड्ड को सूचित कर सकता है। ‘घाटी’ सामान्य पाठक के लिए सहज है और मूल की भौगोलिक व्यापकता बनाए रखता है।
- source_word: אֲבָנֶיהָ
  choice: उसके पत्थरों
  rationale: स्त्रीलिंग एकवचन प्रत्यय सामरिया नगर की ओर संकेत करता है। हिन्दी में ‘उसके’ स्वाभाविक है और संदर्भ को स्पष्ट रखता है।
- source_word: וִיסֹדֶיהָ אֲגַלֶּה
  choice: उसकी नींवों को उघाड़ दूँगा
  rationale: बहुवचन ‘नींवों’ को बनाए रखा गया है और पिएल אֲגַלֶּה का ‘उघाड़ना/अनावृत करना’ वाला अर्थ पूर्ण विध्वंस की छवि सुरक्षित रखता है।
theological_decisions:
- issue: सामरिया के लिए स्त्रीलिंग प्रत्ययों का निरूपण
  choice: हिन्दी में स्वाभाविक नगर-संदर्भ के अनुसार ‘उसके/उसकी’
  alternative: नगर का मानवीकरण अधिक प्रत्यक्ष करने के लिए ‘उस स्त्री के/उसकी’ जैसी अभिव्यक्ति
  rationale: मूल में स्त्रीलिंग प्रत्यय व्याकरणतः नगर सामरिया से मेल खाते हैं और मानवीकरण का रंग भी दे सकते हैं। हिन्दी में ‘उसके/उसकी’ लिंग-चिह्नित नहीं हैं, पर वे मूल संदर्भ को बिना कृत्रिम विस्तार के स्वाभाविक रूप से व्यक्त करते हैं।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘मलबे का ढेर’, ‘दाख की बारियाँ’ और ‘नींवों को उघाड़ दूँगा’ विनाश की ठोस भविष्यसूचक छवियाँ बनाए रखते हैं; ‘उँडेल दूँगा’ मूल के असामान्य किंतु सजीव रूपक को सुरक्षित रखता है।
