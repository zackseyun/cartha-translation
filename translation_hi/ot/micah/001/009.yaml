source:
  edition: WLC
  text: כִּ֥י אֲנוּשָׁ֖ה מַכּוֹתֶ֑י/הָ כִּי בָ֨אָה֙ עַד יְהוּדָ֔ה נָגַ֛ע עַד שַׁ֥עַר עַמִּ֖/י עַד יְרוּשָׁלִָֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/001/009.yaml
  text: For her wound is incurable[a], for it has come as far as Judah; it has reached to the gate of my people[b], to Jerusalem.
translation:
  language: hi
  text: क्योंकि उसके घाव असाध्य हैं[a]; विपत्ति यहूदा तक आ पहुँची है। वह मेरी प्रजा के फाटक तक—यरूशलेम तक—पहुँच गई है[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उसका घाव असाध्य है”; इब्रानी में “घाव” बहुवचन है, पर उसका भाव सामूहिक भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या “उसने मेरी प्रजा के फाटक को छू लिया है।”
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲנוּשָׁה
  choice: असाध्य
  rationale: यह विशेषण ऐसी गंभीर दशा बताता है जिसका उपचार संभव नहीं; घाव के साथ ‘असाध्य’ स्वाभाविक और संदर्भानुकूल है।
- source_word: מַכּוֹתֶיהָ
  choice: उसके घाव
  rationale: मूल रूप बहुवचन है और स्त्रीलिंग प्रत्यय संदर्भ में मानवीकृत नगर/देश की ओर संकेत करता है; हिन्दी में बहुवचन रखने से मूल की व्याकरणिक संख्या सुरक्षित रहती है।
- source_word: בָאָה
  choice: विपत्ति ... आ पहुँची है
  rationale: स्त्रीलिंग एकवचन क्रिया के निहित विषय को हिन्दी में ‘विपत्ति’ से स्पष्ट किया गया है; इससे आगे बढ़ते न्याय का भाव आता है, जबकि संदर्भगत अस्पष्टता पूरी तरह किसी एक नगर तक सीमित नहीं होती।
- source_word: עַד יְהוּדָה
  choice: यहूदा तक
  rationale: עַד विस्तार की सीमा बताता है; ‘तक’ इसका सीधा और स्वाभाविक हिन्दी रूप है।
- source_word: נָגַע
  choice: पहुँच गई है
  rationale: क्रिया का अर्थ ‘छूना, पहुँचना, प्रहार करना’ हो सकता है; बढ़ती हुई विपत्ति के संदर्भ में ‘पहुँचना’ उपयुक्त है, जबकि वैकल्पिक ‘छूना’ पादटिप्पणी में रखा गया है।
- source_word: שַׁעַר
  choice: फाटक
  rationale: नगर के प्रवेश-द्वार की ठोस छवि को बनाए रखने के लिए ‘फाटक’ चुना गया है।
- source_word: עַמִּי
  choice: मेरी प्रजा
  rationale: ‘मेरी प्रजा’ प्रथम पुरुष प्रत्यय और वाचा-संबंधी भविष्यवाणी के गरिमापूर्ण स्वर को बनाए रखता है।
- source_word: יְרוּשָׁלִָם
  choice: यरूशलेम
  rationale: स्थान-नाम का प्रचलित मानक हिन्दी रूप।
theological_decisions:
- issue: स्त्रीलिंग प्रत्यय और क्रियाओं का संदर्भ
  choice: ‘उसके घाव’ में मानवीकृत नगर/देश का स्त्रीलिंग संकेत रखा गया है, और आगे बढ़ते न्याय को ‘विपत्ति’ कहा गया है।
  alternative: पूरे कथन को सामरिया स्वयं विषय मानकर ‘वह यहूदा तक आ पहुँची’ कहा जा सकता है; अथवा विषय को केवल घाव/दंड माना जा सकता है।
  rationale: इब्रानी में मानवीकरण और विपत्ति/न्याय को विषय बनाने के बीच व्याकरणिक बदलाव है। हिन्दी अनुवाद मूल तनाव को ‘उसके घाव’ और ‘विपत्ति’ के मेल से बनाए रखता है, बिना किसी एक व्याख्या को अत्यधिक निश्चित किए।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, स्पष्ट भविष्यवाणी-वाणी। ‘असाध्य’, ‘विपत्ति’, ‘प्रजा’ और ‘फाटक’ सामान्य पाठक के लिए बोधगम्य रहते हुए मूल की गंभीरता और ठोस बिंब को बनाए रखते हैं।
