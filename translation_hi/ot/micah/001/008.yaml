  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। पद की काव्यात्मक समानांतरता को चार पंक्तियों में उभारा गया है। कठिन इब्रानी शब्द שילל की अनिश्चितता पादटिप्पणी में सुरक्षित रखी गई है।
