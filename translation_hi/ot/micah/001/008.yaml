reference: Micah 1:8
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: עַל זֹאת֙ אֶסְפְּדָ֣ה וְ/אֵילִ֔ילָה אֵילְכָ֥ה שילל וְ/עָר֑וֹם אֶעֱשֶׂ֤ה מִסְפֵּד֙ כַּ/תַּנִּ֔ים וְ/אֵ֖בֶל כִּ/בְנ֥וֹת יַעֲנָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/001/008.yaml
  text: Because of this I will lament and wail[a]; I will go stripped and naked. I will make a lament like the jackals[b], and mourning like the daughters of the ostrich.
translation:
  language: hi
  text: 'इस कारण मैं विलाप और हाहाकार करूँगा;

    मैं नंगे पाँव[a] और निर्वस्त्र होकर चलूँगा।

    मैं सियारों के समान विलाप करूँगा,

    और शुतुरमुर्ग की बेटियों[b] के समान शोक मनाऊँगा।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘वस्त्र उतारे हुए’। यहाँ प्रयुक्त इब्रानी शब्द कठिन है और संभवतः शोक तथा अपमान के चिह्न के रूप में नंगे पाँव चलने को दर्शाता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक अर्थ ‘शुतुरमुर्ग की बेटियाँ’ है; यह शुतुरमुर्गों या मादा शुतुरमुर्गों के लिए प्रयुक्त इब्रानी काव्यात्मक अभिव्यक्ति है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶסְפְּדָה וְאֵילִילָה
  choice: मैं विलाप और हाहाकार करूँगा
  rationale: ספד शोकपूर्ण विलाप को और ילל ऊँचे, तीखे रोने को व्यक्त करता है। ‘विलाप’ और ‘हाहाकार’ समानांतर क्रियाओं की तीव्रता और भिन्नता दोनों बनाए रखते हैं।
- source_word: אֵילְכָה שילל וְעָרוֹם
  choice: मैं नंगे पाँव और निर्वस्त्र होकर चलूँगा
  rationale: עָרוֹם का अर्थ स्पष्टतः ‘निर्वस्त्र’ है, जबकि שילל कठिन शब्द है और शोक तथा अपमान के प्रसंग में प्रायः ‘नंगे पाँव’ समझा जाता है। मुख्य पाठ में यह स्वाभाविक अर्थ रखा गया है और ‘वस्त्र उतारे हुए’ की संभावना पादटिप्पणी में सुरक्षित है।
- source_word: מִסְפֵּד
  choice: विलाप
  rationale: यह संज्ञा शोक की मुखर अभिव्यक्ति को बताती है। हिन्दी में ‘विलाप करना’ स्वाभाविक है और अगले ‘शोक मनाना’ से हल्का अर्थभेद बनाए रखता है।
- source_word: כַּתַּנִּים
  choice: सियारों के समान
  rationale: भविष्यद्वाणी के काव्य में תנים प्रायः उजाड़ स्थानों में पुकारने वाले सियारों को दर्शाता है; ‘सियार’ आधुनिक हिन्दी में स्पष्ट zoological अर्थ देता है।
- source_word: וְאֵבֶל
  choice: शोक मनाऊँगा
  rationale: אֵבֶל शोक की अवस्था या क्रिया को दर्शाता है। ‘शोक मनाना’ सहज हिन्दी है और पहले आए ‘विलाप’ से अर्थगत भिन्नता रखता है।
- source_word: כִּבְנוֹת יַעֲנָה
  choice: शुतुरमुर्ग की बेटियों के समान
  rationale: इब्रानी का शाब्दिक रूप ‘शुतुरमुर्ग की बेटियाँ’ है। इसे बनाए रखने से काव्यात्मक चित्र और मूल अभिव्यक्ति सुरक्षित रहते हैं; इसका साधारण प्राणिवाचक अर्थ पादटिप्पणी में स्पष्ट किया गया है।
