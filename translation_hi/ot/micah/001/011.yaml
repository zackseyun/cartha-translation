source:
  edition: WLC
  text: עִבְרִ֥י לָ/כֶ֛ם יוֹשֶׁ֥בֶת שָׁפִ֖יר עֶרְיָה בֹ֑שֶׁת לֹ֤א יָֽצְאָה֙ יוֹשֶׁ֣בֶת צַֽאֲנָ֔ן מִסְפַּד֙ בֵּ֣ית הָאֵ֔צֶל יִקַּ֥ח מִ/כֶּ֖ם עֶמְדָּתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/001/011.yaml
  text: Pass on[a], naked and in shame, inhabitant of Shaphir. The inhabitant of Zaanan has not come out[c][b]. The lamentation of Beth-ezel will take away from you its support.
translation:
  language: hi
  text: हे शाफीर की रहनेवाली, नंगी और लज्जित होकर आगे बढ़ जा[a][b]। सानान की रहनेवाली बाहर नहीं निकली। बेथ-एसेल का विलाप तुमसे उसका सहारा छीन लेगा[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाफीर, सानान और बेथ-एसेल स्थानों के नाम हैं। मीका संभवतः इनके उच्चारण या अर्थों के सहारे शब्दालंकार करता है: शाफीर का संबंध ‘सुंदर’ से हो सकता है, सानान की ध्वनि ‘बाहर निकलना’ से मिलती है, और बेथ-एसेल का अर्थ ‘पास का घर’ या ‘बगल का स्थान’ हो सकता है।'
    reason: cultural_note
  - marker: b
    text: या “गुज़र जा।” इस आज्ञा में निर्वासन के लिए चले जाने का संकेत हो सकता है।
    reason: lexical_alternative
  - marker: c
    text: या “बेथ-एसेल का विलाप तुमसे उसके खड़े रहने का स्थान छीन लेगा।” अंतिम उपवाक्य का हिब्रू कठिन है; इसका संकेत पास के सहारे या शरण के खो जाने की ओर हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: עִבְרִי לָכֶם
  choice: आगे बढ़ जा
  rationale: עבר के स्त्रीलिंग एकवचन आज्ञार्थक रूप को नगर की स्त्रीरूप में कल्पित रहनेवाली से संबोधित किया गया है। इस प्रसंग में यह निर्वासन के लिए आगे जाने का भाव दे सकता है। कठिन לָכֶם का भाव आज्ञा में समाहित रखा गया है।
- source_word: יוֹשֶׁבֶת שָׁפִיר
  choice: शाफीर की रहनेवाली
  rationale: स्त्रीलिंग एकवचन कृदंत नगर का स्त्रीरूप में मानवीकरण करता है; हिन्दी में ‘रहनेवाली’ इसे स्वाभाविक ढंग से बनाए रखता है।
- source_word: עֶרְיָה בֹשֶׁת
  choice: नंगी और लज्जित होकर
  rationale: यह पदबंध शारीरिक अनावरण और उससे जुड़ा सार्वजनिक अपमान, दोनों व्यक्त करता है।
- source_word: לֹא יָצְאָה
  choice: बाहर नहीं निकली
  rationale: शाब्दिक अभिव्यक्ति इस अस्पष्टता को सुरक्षित रखती है कि वह युद्ध, सहायता या शोक मनाने के लिए बाहर नहीं निकली।
- source_word: מִסְפַּד בֵּית הָאֵצֶל
  choice: बेथ-एसेल का विलाप
  rationale: מִסְפַּד शोक-विलाप को दर्शाता है। संबंधवाचक रचना जानबूझकर यह खुला छोड़ती है कि विलाप नगर में हो रहा है या उसके लिए।
- source_word: יִקַּח מִכֶּם עֶמְדָּתוֹ
  choice: तुमसे उसका सहारा छीन लेगा
  rationale: לקח עם מן यहाँ हटाने या वंचित करने का भाव देता है। עֶמְדָּתוֹ का मूल अर्थ खड़े रहने की जगह या टिकाव है; प्रसंग में ‘सहारा’ पास के आश्रय अथवा समर्थन के खोने का भाव स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: बेथ-एसेल के विलाप और ‘उसके सहारे’ का संबंध
  choice: वाक्य को निकटवर्ती सहारे के छिन जाने के रूप में रखा गया है।
  alternative: ‘बेथ-एसेल का विलाप तुमसे उसके खड़े रहने का स्थान ले लेगा।’
  rationale: हिब्रू की अंतिम पंक्ति कठिन है और सर्वनाम का संकेत तथा עֶמְדָּה का आशय निश्चित नहीं है। मुख्य पाठ अर्थ-संगत हिन्दी देता है, जबकि पादटिप्पणी अधिक शाब्दिक संभावना सुरक्षित रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और काव्यात्मक चेतावनी का स्वर रखा गया है। नगरों के स्त्रीरूप मानवीकरण के कारण स्त्रीलिंग एकवचन रूप प्रयुक्त हुए हैं। कठिन अंतिम उपवाक्य को मुख्य पाठ में सुबोध बनाया गया है, पर उसकी वास्तविक अनिश्चितता पादटिप्पणी में सुरक्षित है।
