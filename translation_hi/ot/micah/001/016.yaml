  text: קָרְחִ֣י וָ/גֹ֔זִּי עַל בְּנֵ֖י תַּעֲנוּגָ֑יִ/ךְ הַרְחִ֤בִי קָרְחָתֵ/ךְ֙ כַּ/נֶּ֔שֶׁר כִּ֥י גָל֖וּ מִמֵּֽ/ךְ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/micah/001/016.yaml
  text: Make yourself bald and shave your head for the children of your delight; enlarge your baldness like the eagle[a], for they have gone from you into exile.
translation:
  language: hi
  text: 'अपना सिर गंजा कर ले और अपने बाल मुंडा डाल,

    अपने दुलारे बच्चों के कारण;

    अपना गंजापन उकाब[a] के समान बढ़ा ले,

    क्योंकि वे तुझसे दूर निर्वासन में चले गए हैं।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘गिद्ध’। इब्रानी शब्द נֶשֶׁר किसी बड़े शवभक्षी पक्षी को सूचित कर सकता है, न कि अनिवार्य रूप से केवल उकाब को; यहाँ तुलना उसके स्पष्ट दिखाई देने वाले गंजेपन से है।
    reason: lexical_alternative
lexical_decisions:
- source_word: קָרְחִי
  choice: अपने सिर को गंजा कर
  rationale: स्त्रीलिंग एकवचन आज्ञार्थक रूप को सीधे रखा गया है। यह शोक के चिह्न के रूप में सिर गंजा करने की क्रिया बताता है और संबोधित नगर/समुदाय के स्त्रीलिंग मानवीकरण के अनुरूप है।
- source_word: וָגֹזִּי
  choice: और अपने बाल मुंडा डाल
  rationale: גזז का मूल अर्थ काटना या मूंडना है। समानांतर पद और शोक के प्रसंग में ‘बाल मुंडा डाल’ आधुनिक हिन्दी में क्रिया को स्पष्ट और प्रभावपूर्ण बनाता है।
- source_word: עַל בְּנֵי תַּעֲנוּגָיִךְ
  choice: अपने दुलारे बच्चों के कारण
  rationale: עַל यहां शोक का कारण बताता है। בְּנֵי को केवल पुत्रों तक सीमित न करके ‘बच्चों’ और תַּעֲנוּגָיִךְ को स्वाभाविक हिन्दी में ‘दुलारे’ कहा गया है।
- source_word: הַרְחִבִי קָרְחָתֵךְ
  choice: अपना गंजापन ... बढ़ा ले
  rationale: शाब्दिक रूप से गंजे भाग को चौड़ा करने की आज्ञा है। ‘गंजापन बढ़ा ले’ काव्यात्मक तीव्रता बनाए रखते हुए हिन्दी में समझने योग्य है।
- source_word: כַּנֶּשֶׁר
  choice: उकाब के समान
  rationale: נֶשֶׁר का परंपरागत अर्थ उकाब है, पर यह किसी बड़े गिद्ध-सदृश शवभक्षी पक्षी को भी सूचित कर सकता है। मुख्य पाठ में परिचित बाइबलीय पद ‘उकाब’ रखा और विकल्प पादटिप्पणी में दिया गया है।
- source_word: כִּי גָלוּ מִמֵּךְ
  choice: क्योंकि वे तुझसे दूर बंधुआई में चले गए हैं
  rationale: גלה के निर्वासन-संबंधी अर्थ को ‘बंधुआई में चले गए’ से स्पष्ट किया गया है; מִמֵּךְ की अलगाव की भावना ‘तुझसे दूर’ में व्यक्त होती है। पूर्ण क्रिया का भाव ‘चले गए हैं’ से सुरक्षित है।
