  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। काव्यात्मक पंक्ति-विन्यास, संक्षिप्त निषेध और स्थान-नाम से जुड़ी शब्द-क्रीड़ा का संकेत सुरक्षित है। मुख्य पाठ WLC के मसोरेटिक स्वरांकन को प्राथमिकता देता है और ‘अक्को’ वाले संभावित पाठ को पादटिप्पणी में रखता है।
