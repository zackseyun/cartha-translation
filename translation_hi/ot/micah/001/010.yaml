base_translation:
  language: en
  yaml_path: translation/ot/micah/001/010.yaml
  text: In Gath[a], do not tell it; in Acco, do not weep.[b] In Beth-leaphrah[c], roll yourself in the dust.
translation:
  language: hi
  text: 'गत में इसका समाचार मत सुनाओ;

    तनिक भी मत रोओ।[a]

    बेत-लेअफ़रा[b] में धूल में लोटो।[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी शब्दों का अधिक शाब्दिक रूप है, “रोओ—मत रोओ,” अर्थात “बिलकुल मत रोओ।” कुछ व्याख्याकार पहले शब्द को स्थान-नाम मानकर अनुवाद करते हैं, “अक्को में मत रोओ।”
    reason: alternative_reading
  - marker: b
    text: “बेत-लेअफ़रा” नाम सुनने में “धूल का घर” जैसा लगता है; इसके बाद आने वाला शब्द भी “धूल” है।
    reason: cultural_note
  - marker: c
    text: 'व्यंजनात्मक इब्रानी पाठ में क्रिया प्रथम पुरुष में लिखी है: “मैं धूल में लोटा हूँ।” प्रसंग और पारंपरिक पठन इसे स्त्रीलिंग एकवचन आज्ञा, “धूल में लोटो,” समझते हैं, मानो नगर को एक स्त्री के रूप में संबोधित किया गया हो।'
    reason: textual_variant
lexical_decisions:
- source_word: בְּגַת
  choice: गत में
  rationale: स्थान-नाम को हिन्दी लिपि में रखा गया है; यहाँ בְּ का स्वाभाविक अर्थ ‘में’ है।
- source_word: אַל תַּגִּידוּ
  choice: इसका समाचार मत सुनाओ
  rationale: हिफ़ील रूप का अर्थ ‘बताना/समाचार देना’ है। निहित कर्म को ‘इसका समाचार’ कहने से हिन्दी स्पष्ट रहती है और वाक्य अनावश्यक रूप से नहीं फैलता।
- source_word: בָּכוֹ אַל תִּבְכּוּ
  choice: तनिक भी मत रोओ
  rationale: मसोरेटिक स्वरांकन इसे בכה धातु के infinitive absolute और निषेधात्मक imperfect के रूप में प्रस्तुत करता है, जो निषेध पर बल देता है। ‘तनिक भी’ आधुनिक हिन्दी में उस बल को स्वाभाविक ढंग से व्यक्त करता है। ‘अक्को में मत रोओ’ वाली स्थान-नाम की संभावित शब्द-क्रीड़ा को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: בְּבֵית לְעַפְרָה
  choice: बेत-लेअफ़रा में
  rationale: स्थान-नाम का लिप्यंतरण किया गया है, अनुवाद नहीं; इसके ‘धूल का घर’ जैसे सुनाई देने वाले अर्थ और अगले शब्द के साथ शब्द-क्रीड़ा को पादटिप्पणी में समझाया गया है।
- source_word: עָפָר
  choice: धूल
  rationale: यह सामान्य और प्रसंगानुकूल अर्थ है तथा बेत-लेअफ़रा के नाम के साथ शब्द-क्रीड़ा बनाए रखता है।
- source_word: התפלשתי
  choice: लोटो
  rationale: शोक और अपमान के प्रसंग में ‘धूल में लोटना’ स्वाभाविक हिन्दी अभिव्यक्ति है। संदर्भ में आज्ञार्थक पाठ उपयुक्त है, जबकि व्यंजनात्मक लिखित रूप के प्रथम पुरुष पाठ को पादटिप्पणी में रखा गया है।
