  edition: WLC
  text: כֹּ֚ה אָמַ֣ר יְהוָ֔ה עַל הַ/נְּבִיאִ֖ים הַ/מַּתְעִ֣ים אֶת עַמִּ֑/י הַ/נֹּשְׁכִ֤ים בְּ/שִׁנֵּי/הֶם֙ וְ/קָרְא֣וּ שָׁל֔וֹם וַ/אֲשֶׁר֙ לֹא יִתֵּ֣ן עַל פִּי/הֶ֔ם וְ/קִדְּשׁ֥וּ עָלָ֖י/ו מִלְחָמָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/003/005.yaml
  text: Thus says Yahweh concerning the prophets who lead my people astray[a], who bite with their teeth and cry, “Peace,” but against anyone who does not put something into their mouths[d][c][b], they consecrate war.
translation:
  language: hi
  text: यहोवा उन भविष्यद्वक्ताओं के विषय में यह कहता है, जो मेरी प्रजा को भटका देते हैं—जो अपने दाँतों से काटते हैं और पुकारते हैं, “शांति!”[a] पर जो उनके मुँह में कुछ नहीं डालता, उसके विरुद्ध वे युद्ध को पवित्र ठहराते हैं।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “जो अपने दाँतों से काटते हैं।” यह चित्र सम्भवतः उन भविष्यद्वक्ताओं का है जो भोजन या लाभ मिलने पर कुशल-क्षेम का सन्देश देते हैं।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “जो उनके मुँह में नहीं डालता।” इसका आशय उन्हें भोजन या लाभ/भुगतान न देना हो सकता है। “युद्ध को पवित्र ठहराते हैं” में धार्मिक भाषा प्रयुक्त हुई है; इसका अर्थ “उसके विरुद्ध पवित्र युद्ध की घोषणा करते हैं” या “युद्ध की तैयारी करते हैं” भी हो सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: यहोवा
  rationale: इब्रानी वाचा-नाम का हिन्दी में प्रचलित सीधा रूप; इसे सामान्य उपाधि ‘प्रभु’ से प्रतिस्थापित नहीं किया गया।
- source_word: עַל הַנְּבִיאִים
  choice: उन भविष्यद्वक्ताओं के विषय में
  rationale: עַל यहाँ वचन के विषय को प्रस्तुत करता है; न्याय का विरोधी स्वर आगे के कथन से स्पष्ट होता है।
- source_word: הַמַּתְעִים אֶת עַמִּי
  choice: जो मेरी प्रजा को भटका देते हैं
  rationale: 'हिफ़ील कृदन्त का कारणवाचक भाव सुरक्षित है: वे स्वयं केवल भटकते नहीं, प्रजा को भटकाते हैं।'
- source_word: הַנֹּשְׁכִים בְּשִׁנֵּיהֶם
  choice: जब उनके दाँतों को खाने को मिलता है
  rationale: मूल का शाब्दिक चित्र ‘अपने दाँतों से काटने वाले’ है। निकटवर्ती ‘मुँह में डालने’ के समानान्तर इसे भोजन या लाभ मिलने पर अनुकूल भविष्यवाणी करने के अर्थ में स्वाभाविक हिन्दी में व्यक्त किया गया, जबकि पादटिप्पणी में ठोस रूप सुरक्षित है।
- source_word: וְקָרְאוּ שָׁלוֹם
  choice: तब वे पुकारते हैं, “शान्ति!”
  rationale: קרא की उद्घोषणात्मक शक्ति और שָׁלוֹם का कुशल-क्षेम/सुरक्षा का संदेश दोनों बनाए गए हैं।
- source_word: וַאֲשֶׁר לֹא יִתֵּן עַל פִּיהֶם
  choice: पर जो उनके मुँह में कुछ नहीं डालता
  rationale: मूल की असामान्य और आरोपात्मक मुख-छवि को रखा गया है; ‘कुछ’ निहित वस्तु को हिन्दी में स्पष्ट करता है, बिना उसे केवल धन तक सीमित किए।
- source_word: וְקִדְּשׁוּ עָלָיו מִלְחָמָה
  choice: उसके विरुद्ध वे युद्ध को पवित्र ठहराते हैं
  rationale: קדשׁ के धार्मिक/अनुष्ठानिक रंग को सामान्य ‘युद्ध छेड़ते हैं’ में विलीन नहीं किया गया; हिन्दी पदबंध मूल की चौंकाने वाली विडम्बना को बचाता है।
theological_decisions:
- issue: भविष्यद्वक्ताओं के आर्थिक शोषण और पक्षपाती सन्देश का चित्रण
  choice: भोजन मिलने पर ‘शान्ति’ कहने और न मिलने पर युद्ध को पवित्र ठहराने के परस्पर-विरोधी चित्र बनाए रखे गए।
  alternative: सभी रूपकों को खोलकर ‘रिश्वत मिलने पर आशीष और न मिलने पर शत्रुता’ कहना।
  rationale: मूल रिश्वत या भुगतान की सम्भावना दिखाता है, पर उसे केवल आधुनिक आर्थिक श्रेणी तक सीमित नहीं करता। ठोस मुख, भोजन और पवित्र युद्ध की भाषा भविष्यवाणी की नैतिक तथा धार्मिक विकृति दोनों को उभारती है।
- issue: קדשׁ מלחמה का धार्मिक आशय
  choice: ‘युद्ध को पवित्र ठहराते हैं’
  alternative: ‘पवित्र युद्ध की घोषणा करते हैं’ अथवा ‘युद्ध की तैयारी करते हैं’
  rationale: चुना गया रूप धार्मिक भाषा को सुरक्षित रखता है और यह पूर्वनिर्णय नहीं करता कि पद केवल औपचारिक घोषणा या केवल तैयारी को सूचित करता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सार्वजनिक-पाठ योग्य रूप। ‘भविष्यद्वक्ता’, ‘प्रजा’ और ‘पवित्र ठहराना’ बाइबलीय अर्थक्षेत्र को बनाए रखते हैं, पर वाक्य-संरचना सामान्य पाठक के लिए सहज रखी गई है। मुख्य पाठ में दो पादटिप्पणी-चिह्न [a] और [b] उपस्थित हैं।
