  choice: यरूशलेम खंडहरों का ढेर हो जाएगा
  rationale: עִיִּין उजड़ी हुई जगह अथवा मलबे के ढेर का चित्र प्रस्तुत करता है; यह अनुवाद विनाश और परिवर्तन दोनों को स्पष्ट करता है।
