  yaml_path: translation/ot/micah/003/012.yaml
  text: Therefore[a], because of you, Zion will be plowed like a field, and Jerusalem will become ruins[b], and the mountain of the house will become wooded heights.
translation:
  language: hi
  text: इसलिए तुम्हारे कारण सिय्योन खेत की तरह जोता जाएगा, यरूशलेम खंडहरों का ढेर हो जाएगा, और भवन का पर्वत[a] जंगल से ढकी ऊँचाइयाँ[b] बन जाएगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात मंदिर का पर्वत; इसे “मंदिर-पर्वत” भी कहा जा सकता है। इब्रानी में शाब्दिक रूप से “भवन का पर्वत।”
    reason: lexical_alternative
  - marker: b
    text: या “जंगल के ऊँचे स्थानों।” यह पदबंध मंदिर-पर्वत के उजड़कर जंगली पेड़-पौधों से भर जाने का चित्र प्रस्तुत करता है।
    reason: lexical_alternative
