  choice: मुख्य पाठ में ‘भवन का पर्वत’
  alternative: ‘मंदिर-पर्वत’ या ‘मंदिर का पर्वत’
  rationale: मूल पाठ में ‘भवन’ है, जो मंदिर का प्रचलित संकेत है। शाब्दिक शब्दावली रखने से भविष्यवाणी की मूल अभिव्यक्ति सुरक्षित रहती है और पाद-टिप्पणी सन्दर्भ स्पष्ट करती है।
- issue: לְבָמוֹת में उपासना-स्थलों का अर्थ लेना या स्थलाकृतिक उजाड़ का चित्र
  choice: ‘जंगल से ढकी ऊँचाइयों’ के रूप में स्थलाकृतिक उजाड़
  alternative: ‘जंगल के ऊँचे स्थान’
  rationale: न्याय के इस सन्दर्भ में साथ आया יָעַר मंदिर-पर्वत के उजड़कर जंगली और वनाच्छादित हो जाने का चित्र देता है; यहाँ मूर्तिपूजक पूजा-स्थलों का अर्थ अनिवार्य नहीं है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और भविष्यवाणी के न्यायोचित स्वर के अनुरूप भाषा रखी गई है। ‘सिय्योन’ और ‘यरूशलेम’ के प्रचलित हिन्दी बाइबलीय रूप अपनाए गए हैं। पाद-टिप्पणी चिह्न उन्हीं पदबंधों के तुरन्त बाद रखे गए हैं जिनकी वे व्याख्या करते हैं।
