id: MIC.3.2
reference: Micah 3:2
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: שֹׂ֥נְאֵי ט֖וֹב וְ/אֹ֣הֲבֵי רעה גֹּזְלֵ֤י עוֹרָ/ם֙ מֵֽ/עֲלֵי/הֶ֔ם וּ/שְׁאֵרָ֖/ם מֵ/עַ֥ל עַצְמוֹתָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/003/002.yaml
  text: you who hate good and love evil[a], who strip their skin from off them and their flesh from off their bones—
translation:
  language: hi
  text: तुम जो भलाई से घृणा और बुराई से प्रेम करते हो, जो उनकी त्वचा उन पर से और उनका मांस उनकी हड्डियों पर से नोच लेते हो[a]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “छीन लेते हो।”
    reason: גזל का मूल अर्थ बलपूर्वक छीनना है; इस शारीरिक रूपक में ‘नोचना’ या ‘उधेड़ना’ भी संभव है।
lexical_decisions:
- source_word: שֹׂנְאֵי טוֹב
  choice: भलाई से घृणा करते हो
  rationale: बहुवचन कृदंत पिछले पद के संबोधन को आगे बढ़ाते हैं। ‘भलाई’ संक्षिप्त नैतिक अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וְאֹהֲבֵי רעה
  choice: और बुराई से प्रेम करते हो
  rationale: यह पहले वाक्यांश के समानांतर है और भलाई-बुराई के तीखे नैतिक विरोध को बनाए रखता है।
- source_word: גֹּזְלֵי
  choice: नोच लेते हो
  rationale: גזל में बलपूर्वक छीनने या उखाड़ लेने का भाव हो सकता है। त्वचा, मांस और हड्डियों के इस चित्र में ‘नोच लेते हो’ हिंसक रूपक की शक्ति को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: עוֹרָם מֵעֲלֵיהֶם
  choice: उनकी त्वचा उन पर से
  rationale: ‘त्वचा’ मानव शरीर के अंग का स्पष्ट और गरिमापूर्ण शब्द है; ‘उन पर से’ मूल के स्थानवाचक बल को सुरक्षित रखता है।
- source_word: וּשְׁאֵרָם מֵעַל עַצְמוֹתָם
  choice: और उनका मांस उनकी हड्डियों पर से
  rationale: त्वचा और हड्डियों के साथ שְׁאֵר का शारीरिक अर्थ ‘मांस’ उपयुक्त है। ‘हड्डियों पर से’ मूल चित्र और समानांतर रचना को बनाए रखता है।
theological_decisions:
- issue: भ्रष्ट शासकों के अत्याचार के लिए हिंसक शारीरिक रूपक
  choice: त्वचा नोचने और हड्डियों पर से मांस उतारने का सजीव चित्र बनाए रखा गया है।
  alternative: इसे सामान्य रूप से ‘तुम उनका पूरी तरह शोषण करते हो’ कहना।
  rationale: इब्रानी पाठ नेतृत्व की क्रूरता दिखाने के लिए जानबूझकर चौंकाने वाला कसाईखाने जैसा रूपक इस्तेमाल करता है। इसे अमूर्त भाषा में नरम करना मूल की शक्ति और तनाव घटा देता।
translation_notes:
  register: आधुनिक मानक हिन्दी में सीधा संबोधन और काव्यात्मक समानांतरता रखी गई है। भाषा स्पष्ट तथा गरिमापूर्ण है, जबकि मूल के जानबूझकर कठोर और वीभत्स रूपक को नरम नहीं किया गया।
