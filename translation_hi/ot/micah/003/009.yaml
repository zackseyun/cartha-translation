  text: שִׁמְעוּ נָ֣א זֹ֗את רָאשֵׁי֙ בֵּ֣ית יַעֲקֹ֔ב וּ/קְצִינֵ֖י בֵּ֣ית יִשְׂרָאֵ֑ל הַֽ/מֲתַעֲבִ֣ים מִשְׁפָּ֔ט וְ/אֵ֥ת כָּל הַ/יְשָׁרָ֖ה יְעַקֵּֽשׁוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/003/009.yaml
  text: 'Hear this[a], please, heads of the house of Jacob and rulers of the house of Israel[b], who detest justice and make crooked all that is straight:'
translation:
  language: hi
  text: 'हे याकूब के घराने के मुखियाओ और इस्राएल के घराने के शासको, जो न्याय से घृणा करते और जो कुछ सीधा है, उसे टेढ़ा कर देते हो, अब यह सुनो[a]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “कृपया यह सुनो।” इब्रानी कण נָא आग्रह या विनती—दोनों का भाव व्यक्त कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁמְעוּ נָא זֹאת
  choice: अब यह सुनो
  rationale: बहुवचन आज्ञार्थक שִׁמְעוּ को ‘सुनो’ से व्यक्त किया गया है। נָא यहाँ विनती अथवा आग्रह/तात्कालिकता जता सकता है; ‘अब’ इस भविष्यद्वक्तीय पुकार की तत्परता को स्वाभाविक हिन्दी में रखता है, जबकि זֹאת का सीधा अर्थ ‘यह’ है।
- source_word: רָאשֵׁי בֵּית יַעֲקֹב
  choice: याकूब के घराने के मुखियाओ
  rationale: רָאשֵׁי का शाब्दिक रूपक ‘सिर’ हिन्दी में पदवी के रूप में अस्वाभाविक होता; ‘मुखिया’ नेतृत्व का अर्थ और समानांतर संरचना दोनों स्पष्ट रखता है। ‘घराना’ בֵּית के सामुदायिक अर्थ को व्यक्त करता है।
- source_word: וּקְצִינֵי בֵּית יִשְׂרָאֵל
  choice: और इस्राएल के घराने के शासको
  rationale: קְצִינֵי नागरिक और न्यायिक अधिकार रखने वाले अगुओं/शासकों को सूचित करता है। संदर्भ में ‘शासक’ स्पष्ट और आधुनिक है।
- source_word: הַמֲתַעֲבִים מִשְׁפָּט
  choice: जो न्याय से घृणा करते
  rationale: מִשְׁפָּט यहाँ सामाजिक-न्यायिक न्याय है। הַמֲתַעֲבִים उनकी प्रबल विमुखता बताता है, जिसे ‘घृणा करते’ सहज और तीखे ढंग से व्यक्त करता है।
- source_word: וְאֵת כָּל הַיְשָׁרָה יְעַקֵּשׁוּ
  choice: और हर सीधी बात को टेढ़ा कर देते हो
  rationale: ‘सीधी’ और ‘टेढ़ा’ से ישר और עקשׁ का जानबूझकर रखा गया रूपकीय विरोध सुरक्षित रहता है। ‘बात’ हिन्दी में विशेषण के संज्ञात्मक प्रयोग को स्वाभाविक बनाती है, बिना उसे केवल नैतिक ‘सही’ तक सीमित किए।
theological_decisions:
- issue: वाचा-समुदाय के नामों का अनुवाद
  choice: याकूब का घराना ... इस्राएल का घराना
  alternative: याकूब ... इस्राएल; याकूब के लोग ... इस्राएल के लोग
  rationale: दोनों पदों में בֵּית की पुनरावृत्ति मूल की काव्यात्मक समानता और सामुदायिक पहचान को बनाए रखती है; ‘घराना’ आधुनिक हिन्दी में इस भाव को स्वाभाविक रूप से प्रकट करता है।
- issue: सीधे और टेढ़े का रूपक
  choice: हर सीधी बात को टेढ़ा कर देते हो
  alternative: हर सही बात को बिगाड़ देते हो; सारी खराई को विकृत करते हो
  rationale: मूल पाठ न्याय के भ्रष्टाचार को ‘सीधा’ और ‘टेढ़ा’ के सजीव विरोध से कहता है। उसी तनाव को बनाए रखा गया है, न कि केवल उसका व्याख्यात्मक नैतिक अर्थ दिया गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सार्वजनिक भविष्यद्वक्तीय संबोधन के अनुकूल है। सम्बोधन में ‘मुखियाओ’ और ‘शासको’ तथा आगे ‘करते ... हो’ बहुवचन को स्पष्ट रखते हैं। वाक्य का क्रम हिन्दी की स्वाभाविकता के लिए बदला गया है, पर मूल के सभी अर्थ-घटक और सीधा/टेढ़ा रूपक सुरक्षित हैं।
