  text: וָ/אֹמַ֗ר שִׁמְעוּ נָא֙ רָאשֵׁ֣י יַעֲקֹ֔ב וּ/קְצִינֵ֖י בֵּ֣ית יִשְׂרָאֵ֑ל הֲ/ל֣וֹא לָ/כֶ֔ם לָ/דַ֖עַת אֶת הַ/מִּשְׁפָּֽט־־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/003/001.yaml
  text: 'And I said[a], “Hear now, heads of Jacob and rulers of the house of Israel: is it not for you to know justice?”'
translation:
  language: hi
  text: और मैंने कहा, “हे याकूब के अगुओं और इस्राएल के घराने के शासकों, अब सुनो! क्या न्याय को जानना तुम्हारा दायित्व नहीं है?[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “न्यायिक निर्णय।” इब्रानी शब्द मिश्पाट का अर्थ न्याय, न्यायिक निर्णय या जो उचित है, हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֹמַר
  choice: तब मैंने कहा
  rationale: वाव-परिणामी कथन को आगे बढ़ाता है। हिन्दी में ‘तब मैंने कहा’ स्वाभाविक कथात्मक संबंध व्यक्त करता है, बिना अनावश्यक व्याख्या जोड़े।
- source_word: שִׁמְעוּ נָא
  choice: अब सुनो
  rationale: आज्ञार्थक שׁמע के साथ נָא यहाँ विनम्र ‘कृपया’ से अधिक तात्कालिकता और आग्रह प्रकट करता है; ‘अब सुनो’ भविष्यद्वक्ताई संबोधन में उसका बल बनाए रखता है।
- source_word: רָאשֵׁי יַעֲקֹב
  choice: याकूब के अगुओ
  rationale: רֹאשׁ का शाब्दिक अर्थ ‘सिर’ है, पर यहाँ यह नेतृत्व का प्रचलित रूपक है। आधुनिक हिन्दी में ‘अगुए’ अर्थ को स्पष्ट और गरिमापूर्ण ढंग से व्यक्त करता है; ‘याकूब’ वाचाई सामुदायिक नाम के रूप में सुरक्षित है।
- source_word: וּקְצִינֵי בֵּית יִשְׂרָאֵל
  choice: और इस्राएल के घराने के शासको
  rationale: קָצִין नागरिक अथवा न्यायिक अधिकार रखने वाले नेता या शासक को सूचित करता है। ‘शासक’ प्रसंग के अनुकूल है और ‘इस्राएल का घराना’ मूल की राष्ट्रीय-वाचाई अभिव्यक्ति को बनाए रखता है।
- source_word: הֲלוֹא לָכֶם
  choice: क्या ... तुम्हारा दायित्व नहीं है?
  rationale: הֲלוֹא ऐसा अलंकारिक प्रश्न प्रस्तुत करता है जिसका अपेक्षित उत्तर हाँ है। לָכֶם यहाँ उचित जिम्मेदारी या कर्तव्य बताता है; ‘तुम्हारा दायित्व’ इस आशय को स्वाभाविक हिन्दी में स्पष्ट करता है।
- source_word: לָדַעַת
  choice: जानना
  rationale: ידע का मूल अर्थ ‘जानना’ है। इस प्रसंग में इसमें शासकों से अपेक्षित व्यावहारिक पहचान और समझ भी शामिल है; ‘जानना’ इस व्यापकता को सुरक्षित रखता है।
- source_word: הַמִּשְׁפָּט
  choice: न्याय
  rationale: מִשְׁפָּט न्याय, न्यायिक निर्णय अथवा उचित बात को सूचित कर सकता है। भ्रष्ट नेतृत्व की भर्त्सना के इस प्रसंग में ‘न्याय’ उसके सार्वजनिक, नैतिक और न्यायिक आयाम को सबसे स्वाभाविक रूप से व्यक्त करता है।
theological_decisions:
- issue: नेतृत्व और न्यायिक उत्तरदायित्व के प्रसंग में מִשְׁפָּט का अनुवाद
  choice: न्याय
  alternative: न्यायिक निर्णय
  rationale: पद इस्राएल के नेताओं को सही शासन और न्याय के उनके दायित्व के विषय में धिक्कारता है। ‘न्याय’ सार्वजनिक नैतिकता और न्यायिक उत्तरदायित्व दोनों को समेटता है, जबकि ‘न्यायिक निर्णय’ अर्थ को अधिक संकीर्ण कर सकता है। विकल्प को पादटिप्पणी में देकर मूल की अर्थ-व्याप्ति सुरक्षित रखी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, प्रत्यक्ष भविष्यद्वक्ताई संबोधन अपनाया गया है। संबोधन के बहुवचन रूप ‘अगुओ’ और ‘शासको’ सामान्य पाठक के लिए स्पष्ट हैं। अलंकारिक प्रश्न की उत्तर-अपेक्षा और מִשְׁפָּט की अर्थगत व्यापकता बनाए रखी गई है।
