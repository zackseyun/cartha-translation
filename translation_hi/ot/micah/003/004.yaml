language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: אָ֚ז יִזְעֲק֣וּ אֶל יְהוָ֔ה וְ/לֹ֥א יַעֲנֶ֖ה אוֹתָ֑/ם וְ/יַסְתֵּ֨ר פָּנָ֤י/ו מֵ/הֶם֙ בָּ/עֵ֣ת הַ/הִ֔יא כַּ/אֲשֶׁ֥ר הֵרֵ֖עוּ מַעַלְלֵי/הֶֽם־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/micah/003/004.yaml
  text: Then they will cry out to Yahweh[a], but he will not answer them; he will hide his face from them at that time, because they made their deeds evil.
translation:
  language: hi
  text: तब वे यहोवा को पुकारेंगे, पर वह उन्हें उत्तर नहीं देगा। उस समय वह उनसे अपना मुख छिपा लेगा, क्योंकि उन्होंने अपने कामों को बुरा कर दिया था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אָז
  choice: तब
  rationale: यह कालवाचक क्रियाविशेषण पिछले अभियोग के फलस्वरूप आने वाले न्याय की ओर संकेत करता है।
- source_word: יִזְעֲקוּ אֶל־יְהוָה
  choice: वे यहोवा को पुकारेंगे
  rationale: זעק संकट में सहायता के लिए तीव्र पुकार को व्यक्त करता है; हिंदी में ‘पुकारेंगे’ स्वाभाविक और पर्याप्त रूप से प्रबल है। परमेश्वर का व्यक्तिगत नाम יהוה ‘यहोवा’ रखा गया है।
- source_word: וְלֹא יַעֲנֶה אוֹתָם
  choice: पर वह उन्हें उत्तर नहीं देगा
  rationale: 'वाव का प्रसंगगत विरोधार्थ ‘पर’ से स्पष्ट होता है: वे पुकारेंगे, फिर भी उत्तर नहीं मिलेगा।'
- source_word: וְיַסְתֵּר פָּנָיו מֵהֶם
  choice: वह उनसे अपना मुख छिपा लेगा
  rationale: मूल का सजीव वाच्यार्थ और परमेश्वर के अनुग्रहपूर्ण ध्यान को हटा लेने का वाचिक चित्र सुरक्षित रखा गया है।
- source_word: בָּעֵת הַהִיא
  choice: उस समय
  rationale: यह न्याय के निश्चित अवसर को सूचित करने वाला स्वाभाविक आधुनिक हिंदी रूप है।
- source_word: כַּאֲשֶׁר הֵרֵעוּ מַעַלְלֵיהֶם
  choice: क्योंकि उन्होंने अपने कामों को बुरा बनाया था
  rationale: כַּאֲשֶׁר का कारणवाचक अर्थ और הֵרֵעוּ के हिफ़ील रूप की कारणात्मक छाया, साथ ही מַעַלְלֵיהֶם का स्पष्ट कर्म, सुरक्षित रखे गए हैं।
theological_decisions:
- issue: परमेश्वर द्वारा मुख छिपाने का मानवरूपी वाचिक चित्र
  choice: ‘वह उनसे अपना मुख छिपा लेगा’ को मुख्य पाठ में बनाए रखना
  alternative: ‘वह उनसे विमुख हो जाएगा’ या ‘वह उन पर अनुग्रह नहीं करेगा’
  rationale: इब्रानी का वाचा-संबंधी न्याय का चित्र अर्थ को केवल व्याख्या में बदलने के बजाय उसकी धार्मिक और काव्यात्मक गहनता बनाए रखता है।
- issue: अंतिम उपवाक्य का कारणात्मक और नैतिक बल
  choice: ‘क्योंकि उन्होंने अपने कामों को बुरा बनाया था’
  alternative: ‘क्योंकि उन्होंने अपने कामों में दुष्टता की थी’
  rationale: मुख्य पाठ कारणात्मक हिफ़ील और व्यक्त कर्म दोनों को निकटता से व्यक्त करता है; अधिक मुहावरेदार विकल्प मूल की कारणात्मक छाया को कुछ कम कर देता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘मुख छिपाना’ जैसे मूल बाइबलीय वाचिक चित्र को जानबूझकर सुरक्षित रखा गया है।
