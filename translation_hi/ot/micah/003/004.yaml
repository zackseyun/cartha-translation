review_pass:
  verdict: revise
  source_fidelity: The draft accurately represents the temporal sequence, urgent appeal to Yahweh, refusal to answer, and the idiom of hiding the face. The final clause correctly recognizes the Hiphil force of הֵרֵעוּ and its object מַעַלְלֵיהֶם, but its current Hindi wording is overly literal and unnatural.
  naturalness: ‘उन्होंने अपने कामों को बुरा बनाया था’ is not idiomatic modern standard Hindi. ‘उन्होंने अपने कामों को बुरा कर दिया था’ is natural while retaining the causative/resultative sense. The remaining wording is clear, dignified, and suitable for the passage.
  terminology: ‘यहोवा,’ ‘उत्तर नहीं देगा,’ and ‘अपना मुख छिपा लेगा’ are appropriate. Retaining ‘मुख छिपा लेगा’ preserves the Hebrew biblical idiom without imposing an explanatory theological paraphrase.
  issues:
  - severity: medium
    issue: The final causal clause is unnatural in Hindi.
    rationale: Hindi does not normally express morally corrupt conduct as ‘कामों को बुरा बनाया.’ ‘कामों को बुरा कर दिया’ preserves the Hebrew causative construction and explicit object while reading naturally.
  revised_text: तब वे यहोवा को पुकारेंगे, पर वह उन्हें उत्तर नहीं देगा। उस समय वह उनसे अपना मुख छिपा लेगा, क्योंकि उन्होंने अपने कामों को बुरा कर दिया था।
  revised_footnotes:
  - marker: a
    text: या, “क्योंकि उन्होंने अपने कामों में बुराई की थी।”
    reason: The Hebrew Hiphil verb can be rendered more idiomatically as acting wickedly, though the main text retains its causative relation to ‘their deeds.’
  revision_rationale: The revision changes only the final Hindi expression, replacing a calqued phrase with an idiomatic equivalent that retains the causal force of הֵרֵעוּ and the stated object, ‘their deeds.’ A footnote supplies the smoother alternative without weakening the main text’s close representation of the Hebrew.
