lexical_decisions:
- source_word: בֹּנֶה
  choice: जो ... बनाते हैं
  rationale: इब्रानी पुल्लिंग एकवचन कृदंत पिछले पद में संबोधित अगुवों का वर्णन करता है। हिन्दी में आदरसूचक/सामूहिक संबोधन के अनुरूप बहुवचन क्रिया स्वाभाविक है और सापेक्ष उपवाक्य कृदंत का संबंध बनाए रखता है।
- source_word: צִיּוֹן
  choice: सिय्योन
  rationale: स्थान-नाम का प्रचलित हिन्दी बाइबलीय लिप्यंतरण।
- source_word: בְּדָמִים
  choice: रक्तपात से
  rationale: इब्रानी बहुवचन ‘रक्तों’ का प्रयोग यहाँ हत्या, हिंसा या रक्त-दोष के अर्थ में है; ‘रक्तपात से’ हिंसक साधनों द्वारा नगर स्थापित करने का आरोप स्पष्ट करता है।
- source_word: וִירוּשָׁלִַם
  choice: और यरूशलेम
  rationale: संयोजक को स्पष्ट रखा गया है और स्थान-नाम का प्रचलित हिन्दी रूप अपनाया गया है।
- source_word: בְּעַוְלָה
  choice: अन्याय से
  rationale: עַוְלָה अन्याय, गलत काम या अधर्म को सूचित करता है। मीका 3 के सामाजिक और न्यायिक संदर्भ में ‘अन्याय’ सटीक और सहज है।
theological_decisions:
- issue: भविष्यवाणी के आरोप का स्वरूप
  choice: नगर के अगुवों पर सिय्योन और यरूशलेम को रक्तपात और अन्याय के द्वारा स्थापित करने का आरोप है।
  alternative: शाब्दिक रूप से ‘रक्त से’ कहा जा सकता है।
  rationale: इब्रानी ‘रक्तों’ यहाँ सामान्यतः रक्तपात अथवा रक्त-दोष का मुहावरा है। भावार्थ देने से इसे वास्तविक निर्माण-सामग्री समझने की भ्रांति टलती है, जबकि भविष्यवाणी का हिंसा-संबंधी आरोप बना रहता है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सहज हिन्दी। यह पद पिछले वाक्य से जुड़ा हुआ है, इसलिए ‘जो’ से आरम्भ किया गया है। मूल का समानांतर ढाँचा—सिय्योन/यरूशलेम और रक्तपात/अन्याय—सुरक्षित रखा गया है।
