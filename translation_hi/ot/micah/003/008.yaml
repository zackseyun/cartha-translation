  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सार्वजनिक भविष्यवाणी के अनुकूल रूप अपनाया गया है। 'सामर्थ्य', 'न्याय' और 'पराक्रम' अर्थगत भेद बनाए रखते हैं; वाक्य साधारण पाठक के लिए सुबोध है। सभी फुटनोट चिह्न मुख्य पाठ में उपस्थित हैं।
