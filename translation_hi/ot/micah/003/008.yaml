  text: וְ/אוּלָ֗ם אָנֹכִ֞י מָלֵ֤אתִי כֹ֨חַ֙ אֶת ר֣וּחַ יְהוָ֔ה וּ/מִשְׁפָּ֖ט וּ/גְבוּרָ֑ה לְ/הַגִּ֤יד לְ/יַֽעֲקֹב֙ פִּשְׁע֔/וֹ וּ/לְ/יִשְׂרָאֵ֖ל חַטָּאתֽ/וֹ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/micah/003/008.yaml
  text: But as for me[a], I am filled with power, with the Spirit of Yahweh, and with justice and might[b], to declare to Jacob his transgression and to Israel his sin.
translation:
  language: hi
  text: परन्तु मैं[a] सामर्थ्य से, याहवे की आत्मा से, और न्याय तथा पराक्रम से भरपूर हूँ, ताकि याकूब को उसका अपराध[b] और इस्राएल को उसका पाप बता दूँ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “परन्तु मैं याहवे की आत्मा के द्वारा सामर्थ्य, न्याय और पराक्रम से भरपूर हूँ।” इब्रानी शब्दक्रम में ‘याहवे की आत्मा’ को भरने वाली बातों में से एक या सामर्थ्य का स्रोत—दोनों रूपों में समझा जा सकता है।
    reason: alternative_reading
  - marker: b
    text: “अपराध” का अनुवाद “विद्रोह” भी हो सकता है; यह शब्द परमेश्वर के विरुद्ध जान-बूझकर अवज्ञा करने पर बल दे सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאוּלָם אָנֹכִי
  choice: परन्तु मैं
  rationale: यह पिछले पदों के भ्रष्ट भविष्यद्वक्ताओं के साथ प्रबल विरोध दिखाता है और אָנֹכִי के बलाघात को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: מָלֵאתִי
  choice: भरपूर हूँ
  rationale: इब्रानी पूर्ण क्रिया यहाँ प्राप्त और वर्तमान अवस्था व्यक्त करती है; यह प्रयोग उस परिणामात्मक अर्थ को सहज हिन्दी में व्यक्त करता है।
- source_word: כֹחַ
  choice: सामर्थ्य
  rationale: यह भविष्यवाणी के लिए मिले सशक्तीकरण को गरिमापूर्ण और स्पष्ट ढंग से व्यक्त करता है।
- source_word: אֶת רוּחַ יְהוָה
  choice: याहवे के आत्मा से
  rationale: अक्षरशः क्रम को सूची के एक अंग के रूप में रखते हुए परमेश्वर के आत्मा का संकेत देता है; 'याहवे' मूल में उपस्थित निज नाम को सुरक्षित रखता है।
- source_word: וּמִשְׁפָּט
  choice: न्याय
  rationale: संदर्भ में नैतिक और न्यायिक विवेक का भाव है, इसलिए 'न्याय' स्वाभाविक है।
- source_word: וּגְבוּרָה
  choice: पराक्रम
  rationale: यह साहसी और प्रभावी भविष्यवाणी के लिए आवश्यक बल को व्यक्त करता है तथा 'सामर्थ्य' की केवल पुनरावृत्ति नहीं करता।
- source_word: לְהַגִּיד
  choice: बता दूँ
  rationale: उद्देश्यसूचक रूप के साथ यह सार्वजनिक रूप से स्पष्ट कर देने का भाव सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: פִּשְׁעוֹ
  choice: उसका अपराध
  rationale: פֶּשַׁע उल्लंघन और विद्रोह दोनों का भाव रख सकता है; मुख्य पाठ में 'अपराध' सुबोध है और वैकल्पिक बल फुटनोट में सुरक्षित है।
- source_word: חַטָּאתוֹ
  choice: उसका पाप
  rationale: यह सामान्य इब्रानी पद के धार्मिक और नैतिक अर्थ को सीधे तथा स्पष्ट रूप से व्यक्त करता है।
theological_decisions:
- issue: כֹחַ אֶת רוּחַ יְהוָה וּמִשְׁפָּט וּגְבוּרָה की वाक्यगत संरचना
  choice: सामर्थ्य, याहवे का आत्मा, न्याय और पराक्रम—इन सबको भरने वाली वस्तुओं की समांतर सूची के रूप में रखना
  alternative: याहवे के आत्मा को सामर्थ्य से भरने वाला कर्ता या साधन मानना
  rationale: इब्रानी अनुक्रम दोनों संबंधों की अनुमति देता है। मुख्य पाठ निकटतम औपचारिक संरचना रखता है, जबकि दूसरी वास्तविक संभावना फुटनोट में दी गई है।
- issue: רוּחַ יְהוָה का आशय
  choice: याहवे का आत्मा
  alternative: याहवे की ओर से आया कोई सामान्य आवेग या मनोभाव
  rationale: भविष्यवाणी के सशक्तीकरण के संदर्भ में यह स्वाभाविक रूप से परमेश्वर के आत्मा को सूचित करता है, किसी मात्र मानवीय मनोदशा को नहीं।
- issue: יְהוָה का निरूपण
  choice: याहवे
  alternative: प्रभु
  rationale: मूल इब्रानी में परमेश्वर का निज नाम है; लिप्यंतरण उसे उपाधि से प्रतिस्थापित किए बिना सुरक्षित रखता है।
