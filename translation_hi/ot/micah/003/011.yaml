source:
  edition: WLC
  text: רָאשֶׁ֣י/הָ בְּ/שֹׁ֣חַד יִשְׁפֹּ֗טוּ וְ/כֹהֲנֶ֨י/הָ֙ בִּ/מְחִ֣יר יוֹר֔וּ וּ/נְבִיאֶ֖י/הָ בְּ/כֶ֣סֶף יִקְסֹ֑מוּ וְ/עַל יְהוָה֙ יִשָּׁעֵ֣נוּ לֵ/אמֹ֔ר הֲ/ל֤וֹא יְהוָה֙ בְּ/קִרְבֵּ֔/נוּ לֹֽא תָב֥וֹא עָלֵ֖י/נוּ רָעָֽה׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/003/011.yaml
  text: Her leaders judge for a bribe[a], and her priests teach for a price, and her prophets practice divination for silver; yet they lean on Yahweh, saying[b], “Is not Yahweh in our midst? No disaster will come upon us.”
translation:
  language: hi
  text: 'उसके प्रधान रिश्वत लेकर न्याय करते हैं,

    उसके याजक दाम लेकर शिक्षा देते हैं,

    और उसके भविष्यद्वक्ता चाँदी के लिए शकुन-विचार करते हैं;

    फिर भी वे याहवे पर आश्रित होकर कहते हैं,

    “क्या याहवे हमारे बीच नहीं है?

    हम पर कोई विपत्ति नहीं आएगी।”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: רָאשֶׁיהָ
  choice: उसके अगुए
  rationale: רֹאשׁ का बहुवचन यहाँ नगर/समाज के शासकीय प्रमुखों को दर्शाता है; ‘अगुए’ अधिकार और नेतृत्व दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: בְּשֹׁחַד יִשְׁפֹּטוּ
  choice: रिश्वत लेकर न्याय करते हैं
  rationale: בְּשֹׁחַד न्याय के पीछे भ्रष्ट प्रलोभन को व्यक्त करता है; ‘रिश्वत लेकर’ हिन्दी में स्पष्ट और मुहावरेदार है।
- source_word: בִּמְחִיר יוֹרוּ
  choice: दाम लेकर शिक्षा देते हैं
  rationale: מְחִיר भुगतान/दाम है और יוֹרוּ याजकीय व्यवस्था में शिक्षा देने को सूचित करता है; यह अनुवाद वाणिज्यीकृत धार्मिक शिक्षा को स्पष्ट रखता है।
- source_word: בְּכֶסֶף יִקְסֹמוּ
  choice: चाँदी के लिए शकुन-विचार करते हैं
  rationale: כֶּסֶף की ठोस छवि ‘चाँदी’ से बनी रहती है और קסם निषिद्ध प्रकार के भावी संकेत जानने की क्रिया है; ‘शकुन-विचार’ सामान्य पाठक के लिए बोधगम्य है।
- source_word: וְעַל־יְהוָה יִשָּׁעֵנוּ
  choice: फिर भी वे यहोवा पर भरोसा रखते हैं
  rationale: שׁען का मूल बिंब सहारे के लिए टिकने का है; ‘भरोसा रखना’ उसका स्वाभाविक हिन्दी अर्थ देता है, जबकि ‘फिर भी’ उनके भ्रष्ट आचरण और धार्मिक दावे का व्यंग्यपूर्ण विरोध उभारता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिन्दी में प्रचलित व्यक्तिगत नाम ‘यहोवा’ चतुरक्षरीय ईश-नाम को किसी उपाधि से प्रतिस्थापित किए बिना प्रस्तुत करता है।
- source_word: רָעָה
  choice: विपत्ति
  rationale: इस प्रसंग में רָעָה नैतिक बुराई नहीं, आने वाले विनाशकारी न्याय को दर्शाता है; ‘विपत्ति’ इस अर्थ को स्वाभाविक रूप से व्यक्त करती है।
theological_decisions:
- issue: ईश-नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ व्यक्तिगत वाचा-नाम का प्रयोग करता है। हिन्दी पाठकों में सुस्थापित रूप ‘यहोवा’ नाम को नाम के रूप में बनाए रखता है, न कि ‘प्रभु’ जैसी उपाधि में बदलता है।
- issue: וְעַל־יְהוָה יִשָּׁעֵנוּ में भरोसे का स्वरूप
  choice: भरोसा रखते हैं
  alternative: सहारे के लिए यहोवा पर टिकते हैं
  rationale: मूल क्रिया में टिकने/आश्रित होने का बिंब है। मुख्य पाठ में स्वाभाविक हिन्दी चुनी गई है, पर इसका आशय सच्चे विश्वास की पुष्टि नहीं, भ्रष्ट अगुओं के आत्मविश्वासी धार्मिक दावे का चित्रण है।
- issue: अंतिम רָעָה का आशय
  choice: विपत्ति
  alternative: बुराई
  rationale: वक्ता अपने ऊपर आने वाले दंड या विनाश से इनकार कर रहे हैं। इसलिए प्रसंगगत अर्थ ‘विपत्ति’ है; इससे नैतिक बुराई का अनपेक्षित अर्थ आरोपित नहीं होता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सार्वजनिक पाठ के अनुकूल शैली। तीन भ्रष्ट पदों की समानांतर संरचना और अंतिम झूठे आत्मविश्वास का विरोध सुरक्षित रखा गया है। ‘अगुए’, ‘याजक’ और ‘भविष्यद्वक्ता’ परिचित बाइबलीय शब्दावली हैं; वाक्य-विन्यास सामान्य पाठकों के लिए सीधा रखा गया है।
