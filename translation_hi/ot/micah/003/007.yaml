id: MIC.3.7
reference: Micah 3:7
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וּ/בֹ֣שׁוּ הַ/חֹזִ֗ים וְ/חָֽפְרוּ֙ הַ/קֹּ֣סְמִ֔ים וְ/עָט֥וּ עַל שָׂפָ֖ם כֻּלָּ֑/ם כִּ֛י אֵ֥ין מַעֲנֵ֖ה אֱלֹהִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/003/007.yaml
  text: The seers will be put to shame[a], and the diviners will be disgraced; all of them will cover their lips, because there is no answer from God.
translation:
  language: hi
  text: 'दर्शी लज्जित होंगे,

    और शकुन बतानेवाले अपमानित होंगे।

    वे सब अपने होंठ ढक लेंगे[a],

    क्योंकि परमेश्वर की ओर से कोई उत्तर नहीं मिलेगा।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से “ऊपरी होंठ ढक लेंगे” या “मूँछ ढक लेंगे”; संभवतः यह लज्जा, शोक या अशुद्धता का संकेत था।
    reason: इब्रानी मुहावरे के शाब्दिक शारीरिक अर्थ और संकेत के संभावित सांस्कृतिक आशय को सुरक्षित रखना।
lexical_decisions:
- source_word: וּבֹשׁוּ
  choice: लज्जित होंगे
  rationale: यह क्रिया लज्जा में पड़ने या लज्जित होने का परिणाम व्यक्त करती है। संदर्भ में सरल भविष्यकालीन रूप स्वाभाविक है और आंतरिक लज्जा तथा सार्वजनिक निरादर—दोनों की संभावना खुली रखता है।
- source_word: הַחֹזִים
  choice: दर्शी
  rationale: यह दर्शन पाने या देखने का दावा करनेवाले धार्मिक व्यक्तियों के लिए प्रयुक्त पारिभाषिक शब्द है। ‘दर्शी’ संक्षिप्त है और भविष्यवक्ता से इसकी शब्दगत भिन्नता बनाए रखता है।
- source_word: וְחָפְרוּ
  choice: अपमानित होंगे
  rationale: इस क्रिया में लज्जित या निरादरित होने का भाव है। ‘अपमानित’ पहले खंड के समानांतर सार्वजनिक बेइज्जती के पहलू को स्पष्ट करता है।
- source_word: הַקֹּסְמִים
  choice: शकुन बतानेवाले
  rationale: קֹסְמִים उन लोगों को सूचित करता है जो दैवज्ञता या शकुन-विचार द्वारा ज्ञान पाने का दावा करते हैं। यह रूप आधुनिक हिन्दी में समझने योग्य है और सामान्य भविष्यवाणी से अलग अवैध दैवज्ञता का संकेत देता है।
- source_word: וְעָטוּ עַל שָׂפָם
  choice: अपने होंठ ढक लेंगे
  rationale: इब्रानी मुहावरा होंठ, ऊपरी होंठ या मूँछ के भाग को ढकने की क्रिया दिखाता है। मुख्य पाठ इब्रानी चित्र को बनाए रखता है, जबकि शारीरिक स्थान और संकेत का संभावित अर्थ पादटिप्पणी में दिया गया है।
- source_word: כֻּלָּם
  choice: वे सब
  rationale: सर्वनाम-प्रत्यय सहित यह पद पूरे समूह पर बल देता है; ‘वे सब’ इस समग्रता को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यहाँ यह उनकी लज्जा और अपमान का कारण बताता है।
- source_word: אֵין מַעֲנֵה אֱלֹהִים
  choice: परमेश्वर की ओर से कोई उत्तर नहीं मिलेगा
  rationale: नामवाचक इब्रानी वाक्यांश को स्वाभाविक हिन्दी में स्रोत-सूचक ‘की ओर से’ के साथ रखा गया है। इससे न तो उत्तर के स्वरूप को अतिरिक्त रूप से परिभाषित किया गया है, न मौन के कारण को।
- source_word: אֱלֹהִים
  choice: परमेश्वर
  rationale: संदर्भ में यह रूप एकवचन अर्थ में सच्चे परमेश्वर को सूचित करता है। ‘परमेश्वर’ आधुनिक हिन्दी बाइबलीय भाषा में स्वाभाविक और सम्मानपूर्ण है।
theological_decisions:
- issue: अंतिम खंड को परमेश्वर के मौन के रूप में प्रस्तुत किया जाए या किसी प्रामाणिक ईश्वरीय संदेश के अभाव के रूप में
  choice: परमेश्वर की ओर से कोई उत्तर नहीं मिलेगा
  alternative: परमेश्वर कोई उत्तर नहीं देगा; कोई ईश्वरीय उत्तर नहीं होगा
  rationale: इब्रानी में संज्ञात्मक कथन दोनों पहलुओं को समेट सकता है। चुना हुआ अनुवाद यह मूल बात सुरक्षित रखता है कि इन लोगों को परमेश्वर से कोई वास्तविक प्रत्युत्तर नहीं मिलता, पर यह नहीं तय करता कि इसका तात्पर्य केवल मौन है या वैध संदेश का अभाव।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। काव्यात्मक समानांतरता के लिए पंक्ति-विन्यास बनाए रखा गया है। ‘दर्शी’ और ‘शकुन बतानेवाले’ दो अलग धार्मिक भूमिकाओं का भेद रखते हैं; अस्पष्ट सांस्कृतिक संकेत को मुख्य पाठ में खोलने के बजाय पादटिप्पणी में समझाया गया है।
