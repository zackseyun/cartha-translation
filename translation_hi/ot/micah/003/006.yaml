base_translation:
  language: en
  yaml_path: translation/ot/micah/003/006.yaml
  text: Therefore it will be night for you[a], without vision, and darkness for you, without divination; the sun will go down on the prophets[b], and the day will grow dark over them.
translation:
  language: hi
  text: इसलिए तुम्हारे लिए ऐसी रात होगी कि दर्शन न होगा,[a] और ऐसा अँधेरा कि शकुन-विचार न होगा। भविष्यद्वक्ताओं पर सूर्य अस्त हो जाएगा,[b] और उनके ऊपर दिन अँधेरा हो जाएगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, अधिक शाब्दिक रूप से, “दर्शन से” और “शकुन-विचार से।” इब्रानी संबंधबोधक शब्द का ऐसा अनुवाद संभव है, पर यहाँ भाव संभवतः दर्शन और शकुन-विचार से वंचित होने का है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक अर्थ, “भविष्यद्वक्ताओं पर सूर्य आ जाएगा”; सूर्य के साथ प्रयुक्त यह अभिव्यक्ति यहाँ उसके अस्त होने का भाव देती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: इसलिए
  rationale: यह पिछले पदों में लगाए गए आरोप के परिणामस्वरूप आने वाले न्याय को दर्शाता है।
- source_word: לַיְלָה לָכֶם מֵחָזוֹן
  choice: तुम्हारे लिए ऐसी रात होगी जिसमें कोई दर्शन न होगा
  rationale: क्रियारहित इब्रानी वाक्यांश को न्याय के भावी परिणाम के रूप में व्यक्त किया गया है; מִן को यहाँ वंचना के अर्थ में लिया गया है।
- source_word: וְחָשְׁכָה לָכֶם מִקְּסֹם
  choice: ऐसा अँधेरा होगा जिसमें तुम शकुन न बता सकोगे
  rationale: यह पहले खंड के समानांतर है। קסם भविष्य जानने के लिए शकुन-विचार या शकुन बताने को दर्शाता है; हिंदी में क्रियात्मक रूप सहज और स्पष्ट है।
- source_word: וּבָאָה הַשֶּׁמֶשׁ עַל הַנְּבִיאִים
  choice: भविष्यद्वक्ताओं पर सूर्य अस्त हो जाएगा
  rationale: בוא का मूल अर्थ 'आना' है, पर सूर्य के साथ इसका प्रसंगगत मुहावरेदार अर्थ सूर्यास्त होना है।
- source_word: וְקָדַר עֲלֵיהֶם הַיּוֹם
  choice: उनके ऊपर दिन अँधेरा हो जाएगा
  rationale: קדר अँधेरा या उदास हो जाने का भाव देता है और दिन के प्रकाश के न्यायस्वरूप उलट जाने की काव्यात्मक छवि बनाए रखता है।
theological_decisions:
- issue: न्याय के अँधकार का स्वरूप
  choice: रात, अँधेरा, सूर्यास्त और अँधेरे दिन की छवियाँ भ्रष्ट भविष्यद्वक्ताओं से दर्शन और शकुन बताने की क्षमता छिन जाने को व्यक्त करती हैं।
  alternative: इसे केवल सामाजिक अपमान या शाब्दिक खगोलीय घटना मानना।
  rationale: निकटवर्ती संदर्भ दर्शन, शकुन और भविष्यद्वक्ताओं का है; अतः मुख्य आशय प्रकाशन से वंचित किए जाने का न्याय है, यद्यपि काव्यात्मक छवि की व्यापक गंभीरता को सीमित नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण, सामान्य पाठक के लिए स्पष्ट शैली। 'भविष्यद्वक्ता' संदर्भगत נביא और 'शकुन बताना' קסם की निंदित भविष्य-कथन क्रिया को व्यक्त करता है। काव्यात्मक समानांतरता और न्याय की क्रमशः गहराती अँधकार-छवि सुरक्षित रखी गई है।
