source:
  edition: WLC
  text: ק֣וּמוּ וּ/לְכ֔וּ כִּ֥י לֹא זֹ֖את הַ/מְּנוּחָ֑ה בַּ/עֲב֥וּר טָמְאָ֛ה תְּחַבֵּ֖ל וְ/חֶ֥בֶל נִמְרָֽץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/002/010.yaml
  text: Rise and go[a], for this is not the resting place; because of uncleanness it brings destruction[b], even grievous destruction.
translation:
  language: hi
  text: उठो और चले जाओ, क्योंकि यह विश्राम-स्थान नहीं है; अशुद्धता के कारण यह नाश करता है[a]—हाँ, घोर नाश।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “यह नष्ट करता है—और वह भी घोर नाश के साथ।” हिब्रू में एक ही मूल की क्रिया और संज्ञा साथ रखकर बात पर जोर दिया गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ק֣וּמוּ וּ/לְכ֔וּ
  choice: उठो और चले जाओ
  rationale: दोनों बहुवचन आज्ञार्थकों का स्वाभाविक और स्पष्ट हिन्दी रूप; प्रसंग में स्थान छोड़ने की आज्ञा व्यक्त होती है।
- source_word: הַ/מְּנוּחָ֑ה
  choice: विश्राम-स्थान
  rationale: מְנוּחָה यहाँ केवल अमूर्त ‘विश्राम’ ही नहीं, बसने और चैन पाने के स्थान का अर्थ भी दे सकता है; ‘विश्राम-स्थान’ उस ठोस भाव को सुरक्षित रखता है।
- source_word: בַּ/עֲב֥וּר טָמְאָ֛ה
  choice: अशुद्धता के कारण
  rationale: यह रूप किसी निहित कर्ता को अनावश्यक रूप से निश्चित किए बिना नैतिक-विधिक अशुद्धता और कारण-संबंध दोनों को व्यक्त करता है।
- source_word: תְּחַבֵּ֖ל וְ/חֶ֥בֶל נִמְרָֽץ
  choice: यह नाश कर डालता है—हाँ, घोर नाश
  rationale: क्रिया और उसी मूल की संज्ञा की हिब्रू पुनरुक्ति को हिन्दी में दोहरे ‘नाश’ से बनाए रखा गया है; ‘घोर’ נִמְרָץ की तीव्रता व्यक्त करता है।
theological_decisions:
- issue: अशुद्धता तथा विनाशकारी क्रिया का संदर्भ
  choice: ‘अशुद्धता के कारण यह नाश कर डालता है’ कहकर ‘यह’ को प्रसंगगत स्थान/देश से जुड़ने दिया गया है, पर अशुद्धता का व्याकरणिक कर्ता स्पष्ट रूप से नहीं जोड़ा गया।
  alternative: ‘क्योंकि यह अशुद्ध हो गया है, यह तुम्हें नाश कर देगा’ या ‘अशुद्धता तुम्हारा नाश करेगी।’
  rationale: स्त्रीलिंग रूप מְנוּחָה अथवा निहित भूमि से संबंधित हो सकते हैं, किंतु वाक्य-संरचना कठिन है। अनुवाद वास्तविक अस्पष्टता बनाए रखता है और ‘तुम्हें’ जैसा अप्रकट कर्म नहीं जोड़ता।
- issue: וְחבל נמרץ का बल
  choice: ‘हाँ, घोर नाश’ को पहले विनाशकारी कथन की तीव्र पुनर्पुष्टि माना गया है।
  alternative: ‘और कठोर विनाश’ या ‘पीड़ादायक विनाश के साथ।’
  rationale: सजातीय क्रिया-संज्ञा का प्रयोग अलंकारिक जोर देता है; हिन्दी में पुनरुक्ति और ‘हाँ’ इस वृद्धि को स्वाभाविक ढंग से दर्शाते हैं।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज आज्ञात्मक और भविष्यसूचक लहजा। ‘विश्राम-स्थान’, ‘अशुद्धता’ और ‘घोर नाश’ स्रोत के धार्मिक तथा काव्यात्मक भार को बिना सांप्रदायिक व्याख्या जोड़े बनाए रखते हैं।
