language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: לָ/כֵ֗ן כֹּ֚ה אָמַ֣ר יְהוָ֔ה הִנְ/נִ֥י חֹשֵׁ֛ב עַל הַ/מִּשְׁפָּחָ֥ה הַ/זֹּ֖את רָעָ֑ה אֲ֠שֶׁר לֹֽא תָמִ֨ישׁוּ מִ/שָּׁ֜ם צַוְּארֹֽתֵי/כֶ֗ם וְ/לֹ֤א תֵֽלְכוּ֙ רוֹמָ֔ה כִּ֛י עֵ֥ת רָעָ֖ה הִֽיא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/002/003.yaml
  text: 'Therefore[a], this is what Yahweh says: Look, I am planning disaster against this family, from which you will not remove your necks, and you will not walk haughtily[d][c][b], for it is an evil time.'
translation:
  language: hi
  text: 'इसलिए यहोवा यों कहता है: “देखो, मैं इस कुल[a] पर विपत्ति लाने की योजना बना रहा हूँ, जिससे तुम अपनी गर्दनें नहीं निकाल सकोगे[b]। तुम अकड़कर नहीं चलोगे[c], क्योंकि वह विपत्ति का समय होगा[d]।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: हिब्रू शब्द का अर्थ “परिवार,” “वंश” या किसी बड़े कुल-समुदाय से भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “वहाँ से अपनी गर्दनें नहीं हटा सकोगे।” यह संभवतः ऐसे थोपे गए जुए या बोझ की छवि है जिससे बचना असंभव होगा।
    reason: cultural_note
  - marker: c
    text: या “घमंड से नहीं चलोगे” अथवा “सिर ऊँचा करके नहीं चलोगे।”
    reason: lexical_alternative
  - marker: d
    text: यहाँ वही हिब्रू शब्द फिर आया है जिसका अनुवाद पहले “विपत्ति” किया गया है; यह घोषित न्याय और आने वाले समय के बीच शब्दगत संबंध बनाता है।
    reason: literary_note
lexical_decisions:
- source_word: לָכֵן
  choice: इसलिए
  rationale: यह पिछले पदों में वर्णित अन्याय के परिणामस्वरूप यहोवा के उत्तर का परिचय देता है।
- source_word: כֹּה אָמַר יְהוָה
  choice: यहोवा यों कहता है
  rationale: भविष्यद्वक्ताओं का प्रचलित संदेश-सूत्र स्वाभाविक और गरिमापूर्ण हिन्दी में रखा गया है; परमेश्वर के निज नाम को ‘यहोवा’ लिखा गया है।
- source_word: הִנְנִי
  choice: देखो, मैं
  rationale: यह आने वाली ईश्वरीय घोषणा पर बल देता है और प्राचीनतावादी भाषा के बिना हिब्रू की ध्यानाकर्षक शक्ति बनाए रखता है।
- source_word: חֹשֵׁב
  choice: योजना बना रहा हूँ
  rationale: यह क्रिया पिछले संदर्भ में दुष्टों द्वारा बुराई की योजना बनाने वाली समान धातु को प्रतिध्वनित करती है और यहाँ न्याय की सोची-समझी तैयारी व्यक्त करती है।
- source_word: עַל הַמִּשְׁפָּחָה הַזֹּאת
  choice: इस कुल पर
  rationale: מִשְׁפָּחָה एक परिवार, वंश या व्यापक कुल-समुदाय को सूचित कर सकता है। यहाँ सामूहिक अर्थ के लिए ‘कुल’ उपयुक्त है, जबकि पादटिप्पणी में इसकी व्यापकता सुरक्षित रखी गई है।
- source_word: רָעָה
  choice: विपत्ति
  rationale: दोनों occurrences में एक ही हिन्दी शब्द रखकर हिब्रू की पुनरुक्ति सुरक्षित की गई है। इस न्याय-संदर्भ में अर्थ नैतिक बुराई नहीं, बल्कि आने वाली आपदा है।
- source_word: אֲשֶׁר לֹא תָמִישׁוּ מִשָּׁם צַוְּארֹתֵיכֶם
  choice: जिससे तुम अपनी गर्दनें नहीं निकाल सकोगे
  rationale: मूल की गर्दन वाली सजीव छवि बनाए रखते हुए हिन्दी में यह स्पष्ट किया गया है कि वे थोपे गए बोझ या जुए से बच नहीं पाएँगे; जुए को मुख्य पाठ में जोड़कर अस्पष्टता समाप्त नहीं की गई।
- source_word: וְלֹא תֵלְכוּ רוֹמָה
  choice: तुम अकड़कर नहीं चलोगे
  rationale: רוֹמָה की ऊँचाई या उन्नत चाल की छवि यहाँ घमंडी आचरण बताती है। ‘अकड़कर’ आधुनिक हिन्दी में इस शारीरिक और नैतिक भाव को संक्षेप में व्यक्त करता है।
- source_word: כִּי עֵת רָעָה הִיא
  choice: क्योंकि वह विपत्ति का समय होगा
  rationale: आने वाले न्याय-काल का अर्थ स्पष्ट रहता है और पहले आए רָעָה के साथ शब्दगत संबंध भी सुरक्षित रहता है।
theological_decisions:
- issue: ईश्वरीय कार्य के संबंध में רָעָה का अनुवाद
  choice: दोनों स्थानों पर ‘विपत्ति’
  alternative: पहले ‘विपत्ति’ और अंत में ‘बुरा समय’; अथवा दोनों स्थानों पर ‘बुराई’
  rationale: संदर्भ में यहोवा नैतिक बुराई नहीं करता, बल्कि न्यायस्वरूप आपदा लाता है। ‘विपत्ति’ दोनों जगह रखने से परमेश्वर पर नैतिक बुराई आरोपित किए बिना हिब्रू की जानबूझकर की गई पुनरुक्ति भी बचती है।
- issue: गर्दन निकालने की छवि
  choice: जुए या बोझ को मुख्य पाठ में स्पष्ट रूप से न जोड़कर मूल रूपक बनाए रखना
  alternative: ‘तुम उसके जुए से अपनी गर्दनें नहीं छुड़ा सकोगे’
  rationale: हिब्रू में जुए का नाम प्रत्यक्ष रूप से नहीं है। रूपक की संभावित व्याख्या पादटिप्पणी में दी गई है ताकि पाठ की वास्तविक सांकेतिकता सुरक्षित रहे।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण भविष्यद्वाणी शैली और सामान्य पाठक के लिए स्पष्ट वाक्य-विन्यास अपनाया गया है। ‘यों कहता है’ संदेश-सूत्र की औपचारिकता बनाए रखता है; ‘देखो’ घोषणा पर स्वाभाविक बल देता है। मूल के रूपकों और रָעָה की पुनरुक्ति को यथासंभव सुरक्षित रखा गया है।
