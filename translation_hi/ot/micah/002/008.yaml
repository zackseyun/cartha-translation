source:
  edition: WLC
  text: וְ/אֶתְמ֗וּל עַמִּ/י֙ לְ/אוֹיֵ֣ב יְקוֹמֵ֔ם מִ/מּ֣וּל שַׂלְמָ֔ה אֶ֖דֶר תַּפְשִׁט֑וּ/ן מֵ/עֹבְרִ֣ים בֶּ֔טַח שׁוּבֵ֖י מִלְחָמָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/002/008.yaml
  text: But lately my people have risen up as an enemy; from off the garment you strip the robe from those who pass by securely[a], those returning from war.
translation:
  language: hi
  text: परन्तु हाल ही में मेरी प्रजा शत्रु के समान उठ खड़ी हुई है; तुम निश्चिन्त राह चलते लोगों के वस्त्र पर से उनका ऊपरी वस्त्र उतार लेते हो—उनका, जो युद्ध से लौट रहे हैं[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जो युद्ध से दूर रहते हैं,” अथवा “जो लड़ाई से मुड़ गए हैं।” अन्तिम इब्रानी पदबंध कठिन है और सम्भव है कि वह युद्ध से लौटते लोगों के बजाय शांतिप्रिय असैनिकों का वर्णन करता हो।
    reason: alternative_reading
lexical_decisions:
- source_word: וְאֶתְמוּל
  choice: परन्तु हाल ही में
  rationale: शाब्दिक अर्थ ‘कल’ है, पर भविष्यद्वाणी के इस प्रसंग में यह निकट अतीत, अर्थात् ‘हाल ही में’, को दर्शाता है; वाव का विरोधसूचक भाव ‘परन्तु’ से रखा गया है।
- source_word: עַמִּי
  choice: मेरी प्रजा
  rationale: सम्बन्धवाचक रचना और वाचा-सम्बन्धी सामूहिक भाव को स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: לְאוֹיֵב יְקוֹמֵם
  choice: शत्रु के समान उठ खड़ी हुई है
  rationale: לְ को तुलनात्मक/विधेयात्मक अर्थ में लिया गया है और קום के विरोधपूर्ण ‘उठ खड़े होने’ के भाव को रखा गया है। स्त्रीलिंग क्रिया ‘प्रजा’ के अनुरूप है।
- source_word: מִמּוּל שַׂלְמָה אֶדֶר תַּפְשִׁטוּן
  choice: वस्त्र पर से चादर उतार लेते हो
  rationale: कठिन वस्त्र-युग्म में מִמּוּל का ‘पर से’ और פשט का कपड़ा उतार लेने का सजीव भाव सुरक्षित है; ‘वस्त्र’ और ‘चादर’ दो अलग पदों को दर्शाते हैं, यद्यपि उनका ठीक तकनीकी भेद अनिश्चित है।
- source_word: מֵעֹבְרִים בֶּטַח
  choice: निडर होकर राह चलते लोगों
  rationale: עבר के कृदन्त को ‘राह चलते लोगों’ और בֶּטַח की सुरक्षा अथवा भयहीनता को ‘निडर होकर’ से सहज आधुनिक हिन्दी में व्यक्त किया गया है।
- source_word: שׁוּבֵי מִלְחָמָה
  choice: जो युद्ध से लौट रहे हैं
  rationale: שוב का सामान्य अर्थ ‘लौटना’ लेकर कठिन पदबंध का सीधा पाठ दिया गया है; वैकल्पिक सम्भावना पादटिप्पणी में सुरक्षित है।
theological_decisions:
- issue: שׁוּבֵי מִלְחָמָה का कठिन अर्थ
  choice: जो युद्ध से लौट रहे हैं
  alternative: जो युद्ध से दूर रहते हैं / जो लड़ाई से मुड़ गए हैं
  rationale: मुख्य पाठ שוב के सामान्य ‘लौटना’ अर्थ का अनुसरण करता है, पर इब्रानी पदबंध की वास्तविक व्याख्यात्मक अनिश्चितता को पादटिप्पणी में रखा गया है; इससे शांतिप्रिय असैनिकों की सम्भावना चुपचाप समाप्त नहीं होती।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किन्तु सरल रूप अपनाया गया है। ‘प्रजा’, ‘शत्रु’, ‘वस्त्र’ और ‘चादर’ सामान्य पाठक के लिए बोधगम्य हैं। वाक्य की आरोपात्मक तीव्रता और मूल की कठिन अन्तिम अभिव्यक्ति दोनों सुरक्षित रखी गई हैं।
