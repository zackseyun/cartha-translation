source:
  edition: WLC
  text: אָסֹ֨ף אֶאֱסֹ֜ף יַעֲקֹ֣ב כֻּלָּ֗/ךְ קַבֵּ֤ץ אֲקַבֵּץ֙ שְׁאֵרִ֣ית יִשְׂרָאֵ֔ל יַ֥חַד אֲשִׂימֶ֖/נּוּ כְּ/צֹ֣אן בָּצְרָ֑ה כְּ/עֵ֨דֶר֙ בְּ/ת֣וֹךְ הַ/דָּֽבְר֔/וֹ תְּהִימֶ֖נָה מֵ/אָדָֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/002/012.yaml
  text: I will surely gather all of you[a], Jacob; I will surely collect the remnant of Israel. Together I will set them like the sheep of Bozrah, like a flock in the midst of its pasture[c][b]; they will be noisy with men.
translation:
  language: hi
  text: '“हे याकूब, मैं निश्चय ही तुम सबको इकट्ठा करूँगा;

    मैं निश्चय ही इस्राएल के बचे हुओं को एकत्र करूँगा।

    मैं उन्हें एक साथ बोस्रा की भेड़ों[a] के समान,

    अपने चरागाह के बीच में झुंड के समान रखूँगा;

    वहाँ लोगों की भीड़ से कोलाहल होगा[b]।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “भेड़शाला की भेड़ों के समान।” हिब्रू בָּצְרָה को परंपरागत रूप से स्थान-नाम “बोस्रा” पढ़ा जाता है, पर कुछ लोग इसे बाड़े या भेड़शाला के अर्थ वाले शब्द से संबंधित मानते हैं।
    reason: lexical_alternative
  - marker: b
    text: या, “वे लोगों के कारण शोर करेंगे,” अथवा “वहाँ लोगों की भीड़ उमड़ेगी।” हिब्रू अभिव्यक्ति कठिन है; हिब्रू אָדָם यहाँ सामान्यतः लोगों/मनुष्यों के अर्थ में है।
    reason: alternative_reading
lexical_decisions:
- source_word: אָסֹף אֶאֱסֹף
  choice: मैं निश्चय ही ... इकट्ठा करूँगा
  rationale: क्रिया के साथ प्रयुक्त infinitive absolute कार्य की निश्चितता और प्रबलता व्यक्त करता है; ‘निश्चय ही’ इस बल को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: יַעֲקֹב כֻּלָּךְ
  choice: हे याकूब, ... तुझे पूरा का पूरा
  rationale: एकवचन प्रत्यय याकूब को सामूहिक रूप से संबोधित करता है। यह अनुवाद सीधे संबोधन और संपूर्ण समुदाय—दोनों भावों को सुरक्षित रखता है।
- source_word: קַבֵּץ אֲקַבֵּץ
  choice: मैं निश्चय ही ... एकत्र करूँगा
  rationale: दूसरी emphatic verbal construction पहली के समान निश्चितता व्यक्त करती है; ‘एकत्र’ समानांतरता रखते हुए अनावश्यक शब्द-पुनरावृत्ति से बचाता है।
- source_word: שְׁאֵרִית יִשְׂרָאֵל
  choice: इस्राएल के बचे हुओं
  rationale: यह भविष्यद्वाणी में बचे हुए अथवा शेष समुदाय को दर्शाता है। सामान्य पाठक के लिए ‘बचे हुए’ स्वाभाविक है और ‘remnant’ का आशय बनाए रखता है।
- source_word: יַחַד אֲשִׂימֶנּוּ
  choice: मैं उन्हें एक साथ ... रखूँगा
  rationale: सामूहिक एकवचन रूप का संदर्भ इस्राएल के बचे हुए लोग हैं; इसलिए हिन्दी में बहुवचन ‘उन्हें’ स्पष्ट और स्वाभाविक है।
- source_word: כְּצֹאן בָּצְרָה
  choice: बोस्रा की भेड़ों के समान
  rationale: मसोरेटी पाठ के स्वरांकन के अनुसार בָּצְרָה स्थान-नाम ‘बोस्रा’ है। संभावित ‘भेड़शाला’ अर्थ को पाद-टिप्पणी में रखा गया है।
- source_word: כְּעֵדֶר בְּתוֹךְ הַדָּבְרוֹ
  choice: चरागाह के बीच के झुंड के समान
  rationale: यहाँ דָּבְרוֹ को पशुपालन-संबंधी अर्थ ‘उसका चरागाह/खुला चराई-स्थान’ में लेना भेड़ों की समानांतर उपमा के अनुकूल है।
- source_word: תְּהִימֶנָה מֵאָדָם
  choice: वहाँ मनुष्यों का कोलाहल होगा
  rationale: क्रिया भीड़ की ऊँची गूँज या हलचल दर्शाती है और מֵאָדָם उस कोलाहल का मानवीय स्रोत सूचित करता है। कठिन हिब्रू अभिव्यक्ति को अत्यधिक निश्चित किए बिना हिन्दी में स्वाभाविक रूप दिया गया है।
theological_decisions:
- issue: याकूब/इस्राएल के पुनः एकत्र किए जाने की प्रतिज्ञा
  choice: पद को याकूब/इस्राएल और उसके बचे हुओं को एकत्र करने की दिव्य प्रतिज्ञा के रूप में रखा गया है।
  alternative: इसे केवल आत्मिक रूपक या केवल इतिहास से अलग अंतिम समय की भविष्यद्वाणी के रूप में स्पष्ट करना।
  rationale: हिब्रू पाठ सीधे याकूब और इस्राएल का नाम लेता है, पर पूर्ति का समय या स्वरूप यहाँ निर्धारित नहीं करता; अनुवाद इस तनाव को खुला रखता है।
- issue: בָּצְרָה का अर्थ
  choice: मुख्य पाठ में स्थान-नाम ‘बोस्रा’
  alternative: ‘भेड़शाला’ अथवा ‘बाड़े में भेड़ें’
  rationale: मसोरेटी स्वरांकन स्थान-नाम का समर्थन करता है, जबकि शब्द-संबंधी वैकल्पिक अर्थ वास्तविक संभावना है और इसलिए पाद-टिप्पणी में सुरक्षित है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सार्वजनिक पाठ के योग्य रखी गई है। ‘तुझे पूरा का पूरा’ सामूहिक याकूब को संबोधित करने वाले हिब्रू एकवचन को दर्शाता है। काव्यात्मक समानांतरता और दोनों emphatic verbal constructions को बनाए रखा गया है; कठिन अंतिम वाक्य के विकल्प पाद-टिप्पणी में दिए गए हैं।
