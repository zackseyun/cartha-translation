language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: הֶ/אָמ֣וּר בֵּֽית יַעֲקֹ֗ב הֲ/קָצַר֙ ר֣וּחַ יְהוָ֔ה אִם אֵ֖לֶּה מַעֲלָלָ֑י/ו הֲ/ל֤וֹא דְבָרַ֨/י יֵיטִ֔יבוּ עִ֖ם הַ/יָּשָׁ֥ר הוֹלֵֽךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/002/007.yaml
  text: Should it be said[a], O house of Jacob, “Is the Spirit of Yahweh impatient? Are these his deeds?” Do not my words do good to the one who walks uprightly?
translation:
  language: hi
  text: 'हे याकूब के घराने, क्या यह कहा जाना चाहिए: “क्या याहवे की आत्मा अधीर है[a]? क्या ये उसके काम हैं?” क्या मेरे वचन उस व्यक्ति का भला नहीं करते जो सीधाई से चलता है?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “क्या याहवे की आत्मा छोटी हो गई है?” यह इब्रानी मुहावरा यह भी सुझा सकता है, “क्या याहवे का धैर्य कम है?”
    reason: इब्रानी मुहावरे के शाब्दिक चित्र तथा अधीरता/कम धैर्य के अर्थ को सुरक्षित रखता है।
lexical_decisions:
- source_word: הֶאָמ֣וּר
  choice: क्या यह कहा जाना चाहिए
  rationale: यह रूप किसी कही जा रही बात को प्रश्न के रूप में सामने लाता है। भाववाच्य प्रश्न मूल के अलंकारिक चुनौती-भाव को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: בֵּית יַעֲקֹב
  choice: हे याकूब के घराने
  rationale: इसे प्रत्यक्ष सम्बोधन के रूप में लिया गया है; ‘घराना’ यहाँ याकूब के वंश और समुदाय को दर्शाता है।
- source_word: הֲקָצַר רוּחַ יְהוָה
  choice: क्या याहवे का आत्मा अधीर है
  rationale: קצר רוח का शाब्दिक चित्र ‘आत्मा का छोटा होना’ है, जो अधीरता या सीमित सहनशीलता का मुहावरा हो सकता है। मुख्य पाठ में स्वाभाविक अर्थ दिया गया है, जबकि ‘आत्मा’ को बनाए रखकर רוּחַ की सम्भावित व्यक्तिगत और स्वभावगत दोनों छायाओं को अनावश्यक रूप से समाप्त नहीं किया गया।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी व्यक्तिवाचक वाचा-नाम को उपाधि से बदलने के बजाय लिप्यंतरित किया गया है।
- source_word: אִם אֵלֶּה מַעֲלָלָיו
  choice: क्या ये उसके काम हैं
  rationale: מַעֲלָלִים कार्यों या कर्मों को सूचित करता है। समानान्तर अलंकारिक प्रश्न और परमेश्वर की ओर संकेत करने वाला सर्वनाम दोनों सुरक्षित रखे गए हैं।
- source_word: דְבָרַי
  choice: मेरे वचन
  rationale: इब्रानी बहुवचन को बनाए रखा गया है; यह याहवे द्वारा कहे गए सन्देशों को दर्शाता है।
- source_word: יֵיטִיבוּ
  choice: भला नहीं करते
  rationale: יטב के हिफ़ील रूप का अर्थ यहाँ भलाई करना या लाभ पहुँचाना है। प्रश्नवाचक הֲלוֹא को हिन्दी की नकारात्मक अलंकारिक प्रश्न-रचना में व्यक्त किया गया है।
- source_word: עִם הַיָּשָׁר הוֹלֵךְ
  choice: उसका ... जो सीधाई से चलता है
  rationale: चलने के रूपक और लगातार जीवन-आचरण सूचित करने वाले कृदन्त को रखा गया है; ‘सीधाई से’ नैतिक खराई को व्यक्त करता है।
theological_decisions:
- issue: רוּחַ יְהוָה को ‘याहवे का आत्मा’ कहा जाए या ‘याहवे का धैर्य/स्वभाव’
  choice: याहवे का आत्मा
  alternative: याहवे का धैर्य
  rationale: रचना में רוּחַ स्पष्ट रूप से उपस्थित है, इसलिए मुख्य पाठ में ‘आत्मा’ रखा गया है। साथ ही קצר רוח की मुहावरेदार अधीरता को विशेषण और पादटिप्पणी द्वारा दर्शाया गया है, ताकि व्यक्तिगत ‘आत्मा’ और स्वभाव/धैर्य की अर्थ-छाया के बीच वास्तविक तनाव बना रहे।
- issue: הֲלוֹא से अपेक्षित सहमति का स्वर
  choice: क्या मेरे वचन ... भला नहीं करते?
  alternative: निश्चय ही मेरे वचन ... भला करते हैं
  rationale: नकारात्मक अलंकारिक प्रश्न मूल की प्रश्नात्मक शक्ति को बनाए रखता है और कथन में बदलकर जोर को अधिक निश्चित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज भविष्यद्वक्ताई शैली रखी गई है। ‘हे याकूब के घराने’ औपचारिक प्रत्यक्ष सम्बोधन है; शेष वाक्य सामान्य पाठक के लिए स्पष्ट अलंकारिक प्रश्नों में हैं।
