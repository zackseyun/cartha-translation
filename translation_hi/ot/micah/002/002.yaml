- from: वे खेतों का लालच करते हैं और उन्हें छीन लेते हैं[a]; वे घरों को भी उठा ले जाते हैं[b]। वे एक पुरुष और उसके घर पर[c], एक मनुष्य और उसकी विरासत पर अत्याचार करते हैं[d]।
  to: वे खेतों का लालच करते हैं और उन्हें छीन लेते हैं[a]; वे घरों को ले लेते हैं[b]। वे एक आदमी और उसके घर को, एक आदमी और उसकी विरासत को दबाते हैं[c][d]।
  rationale: The revision retains the Hebrew’s progression and parallelism while replacing an overly literal expression for taking houses and clarifying that oppression is directed at each man together with his house or inheritance. The masculine singular representative nouns are retained with idiomatic modern Hindi.
