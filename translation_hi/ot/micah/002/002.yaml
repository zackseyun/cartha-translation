review_pass:
  verdict: revise
  source_fidelity: 'The draft accurately reflects the sequence and force of the Hebrew: wrongful desire for fields, their seizure, the taking of houses, and oppression of a man/house and a man/inheritance. However, the final Hindi clause uses ‘...पर अत्याचार करते हैं,’ which shifts the Hebrew’s direct-object construction and makes the paired objects less clear. ‘घरों को उठा ले जाते हैं’ is overly literal and unnatural for houses in Hindi.'
  naturalness: ‘लालच करते हैं’ is acceptable, but ‘घरों को उठा ले जाते हैं’ evokes physically lifting buildings. Also, ‘एक पुरुष ... एक मनुष्य’ is stylistically stiff and the alternating terms do not read naturally in modern Hindi. A direct construction with ‘को दबाते हैं’ more naturally expresses oppression while retaining the Hebrew parallelism.
  terminology: ‘खेत,’ ‘छीन लेते हैं,’ and ‘विरासत’ are appropriate. ‘विरासत’ properly retains the possibility of inherited land/patrimony, which should remain explained in a note. ‘घर’ should retain its potential sense of both house and household through a footnote.
  issues:
  - severity: medium
    issue: ‘घरों को भी उठा ले जाते हैं’ is unnatural and misleading in Hindi.
    rationale: Although נשׂא can mean carry off/take away, literally ‘lifting and carrying houses’ is not idiomatic Hindi and can distract from the intended dispossession. ‘घरों को ले लेते हैं’ preserves the source wording without specifying a method.
  - severity: medium
    issue: The final clause’s syntax obscures the Hebrew direct objects.
    rationale: ‘एक पुरुष और उसके घर पर ... अत्याचार करते हैं’ is grammatically possible, but it is less direct than the source and can blur the paired structure. ‘एक आदमी और उसके घर को ... दबाते हैं’ preserves the two parallel victim-property pairs.
  - severity: low
    issue: The contrast ‘एक पुरुष ... एक मनुष्य’ is unnecessarily formal and stylistically uneven.
    rationale: The Hebrew employs two masculine singular terms in parallel, but the lexical distinction need not be artificially reproduced in Hindi. Repeating ‘आदमी’ is natural and maintains masculine singular representative reference.
