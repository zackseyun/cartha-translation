base_translation:
  language: en
  yaml_path: translation/ot/micah/002/002.yaml
  text: They covet fields and seize them[a], and houses and take them away; they oppress a man and his house[c][b], a man and his inheritance.
translation:
  language: hi
  text: वे खेतों का लालच करते हैं और उन्हें छीन लेते हैं[a]; वे घरों को ले लेते हैं[b]। वे एक आदमी और उसके घर को, एक आदमी और उसकी विरासत को दबाते हैं[c][d]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘उन्हें लूट लेते हैं’ अथवा ‘बलपूर्वक ले लेते हैं’।
    reason: lexical_alternative
  - marker: b
    text: या, ‘उन्हें उठा ले जाते हैं’ अथवा ‘ले जाते हैं’। यहाँ भाव घरों पर अधिकार कर लेने या उनके मालिकों को उनसे वंचित करने का है।
    reason: lexical_alternative
  - marker: c
    text: ‘घर’ का अर्थ यहाँ मकान भी हो सकता है और घराना या परिवार भी।
    reason: ambiguity_note
  - marker: d
    text: ‘विरासत’ से विशेष रूप से पैतृक अथवा विरासत में मिली भूमि का आशय हो सकता है, केवल सामान्य संपत्ति का नहीं।
    reason: cultural_note
lexical_decisions:
- source_word: חָמְדוּ
  choice: लालच करते हैं
  rationale: क्रिया किसी दूसरे की वस्तु पाने की अनुचित इच्छा व्यक्त करती है; ‘लालच करना’ इस नैतिक भार को स्वाभाविक आधुनिक हिन्दी में बनाए रखता है।
- source_word: שָׂדוֹת
  choice: खेतों
  rationale: बहुवचन संज्ञा खेती की भूमि के ठोस भूखंडों को बताती है; ‘खेत’ सीधा और सहज समतुल्य है।
- source_word: גָזָלוּ
  choice: छीन लेते हैं
  rationale: क्रिया बलपूर्वक या अन्यायपूर्वक ले लेने का अर्थ देती है। ‘छीन लेना’ भूमि से बेदखल करने की कठोरता को स्पष्ट करता है।
- source_word: בָתִּים
  choice: घरों
  rationale: यह भौतिक मकानों के लिए सामान्य बहुवचन है और पद के संपत्ति-संबंधी संदर्भ के अनुकूल है।
- source_word: נָשָׂאוּ
  choice: उठा ले जाते हैं
  rationale: इस संदर्भ में क्रिया किसी वस्तु को ले जाने या हटा देने का बोध कराती है; घरों के विषय में यह स्वामित्व छीन लेने का सजीव रूपक भी हो सकता है।
- source_word: עָשְׁקוּ
  choice: अत्याचार करते हैं
  rationale: क्रिया सामाजिक-आर्थिक उत्पीड़न, शोषण या अधिकार छीनने को समेटती है। ‘अत्याचार करना’ इसके व्यापक अन्यायी बल को बनाए रखता है।
- source_word: גֶּבֶר
  choice: एक पुरुष
  rationale: यह पुल्लिंग एकवचन पीड़ित को दर्शाता है और समानांतर אִישׁ से हल्का शब्दगत भेद बनाए रखता है।
- source_word: בֵיתוֹ
  choice: उसके घर
  rationale: בַּיִת भौतिक घर और घराने—दोनों का अर्थ दे सकता है। मुख्य पाठ में ‘घर’ इस द्विअर्थकता को काफी हद तक बनाए रखता है।
- source_word: אִישׁ
  choice: एक मनुष्य
  rationale: पुल्लिंग एकवचन को बनाए रखते हुए ‘मनुष्य’ समानांतर पंक्ति में प्रतिनिधि व्यक्ति को व्यक्त करता है।
- source_word: נַחֲלָתוֹ
  choice: उसकी विरासत
  rationale: נַחֲלָה केवल सामान्य संपत्ति नहीं, बल्कि विशेष रूप से पैतृक या विरासत में मिली भूमि का संकेत दे सकती है; ‘विरासत’ उसके कानूनी और सांस्कृतिक अर्थ को सुरक्षित रखती है।
theological_decisions:
- issue: גֶּבֶר और אִישׁ के पुल्लिंग एकवचन रूप
  choice: एक पुरुष ... एक मनुष्य
  alternative: एक व्यक्ति ... एक व्यक्ति / लोग ... उनकी विरासत
  rationale: इब्रानी पाठ प्रतिनिधि समानांतरता में दो पुल्लिंग एकवचन संज्ञाएँ रखता है। अनावश्यक रूप से लिंग-निरपेक्ष या बहुवचन बनाए बिना इस संरचना को हिन्दी में सुरक्षित रखा गया है।
- issue: בֵיתוֹ का अर्थ-क्षेत्र
  choice: उसके घर
  alternative: उसके घराने / उसके परिवार
  rationale: संदर्भ में भौतिक संपत्ति प्रमुख है, पर इब्रानी शब्द परिवार या घराने को भी दर्शा सकता है। ‘घर’ और पाद-टिप्पणी दोनों संभावनाओं को खुला रखते हैं।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, संक्षिप्त और गरिमापूर्ण रखी गई है। समानांतर इब्रानी संरचना और संपत्ति-हरण से सामाजिक उत्पीड़न तक की गति को बनाए रखा गया है; जहाँ मूल में घर/घराने और विरासत/पैतृक भूमि की अर्थगत व्यापकता है, वहाँ पाद-टिप्पणियों द्वारा उसे स्पष्ट किया गया है।
