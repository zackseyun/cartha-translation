  text: עָלָ֤ה הַ/פֹּרֵץ֙ לִ/פְנֵי/הֶ֔ם פָּֽרְצוּ֙ וַֽ/יַּעֲבֹ֔רוּ שַׁ֖עַר וַ/יֵּ֣צְאוּ ב֑/וֹ וַ/יַּעֲבֹ֤ר מַלְכָּ/ם֙ לִ/פְנֵי/הֶ֔ם וַ/יהוָ֖ה בְּ/רֹאשָֽׁ/ם׃פ
base_translation:
  language: en
  yaml_path: translation/ot/micah/002/013.yaml
  text: The one who breaks through has gone up before them[a]; they have broken through and passed through the gate, and gone out by it. Their king passes on before them[c][b], and Yahweh is at their head.
translation:
  language: hi
  text: बाधा तोड़नेवाला[a][b] उनके आगे चढ़ गया है। उन्होंने बाधा तोड़ी और फाटक से होकर गए, और उससे बाहर निकल गए। उनका राजा उनके आगे बढ़ता है, और यहोवा उनके सबसे आगे है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “सेंध लगानेवाला।” हिब्रू कृदंत ऐसे व्यक्ति के लिए पदनाम की तरह प्रयुक्त हो सकता है जो किसी बाधा को तोड़ता या रास्ता खोलता है।
    reason: lexical_alternative
  - marker: b
    text: “बाधा तोड़नेवाले” की पहचान विवादित है। कुछ इसे किसी सैनिक अगुआ, कुछ राजा, और कुछ स्वयं यहोवा के रूप में समझते हैं। हिब्रू पाठ इनके संबंध को स्पष्ट नहीं करता।
    reason: alternative_reading
lexical_decisions:
- source_word: הַפֹּרֵץ
  choice: मार्ग तोड़कर खोलनेवाला
  rationale: פרץ के मार्ग में पड़ी रुकावट को तोड़कर आगे निकलने के बिंब और निश्चित कृदंत के पदनाम-सदृश प्रयोग को स्वाभाविक हिन्दी में व्यक्त करता है; किसी विशिष्ट व्यक्ति की पहचान तय नहीं करता।
- source_word: עָלָה
  choice: चढ़ गया है
  rationale: काल पूर्ण क्रिया के रूप को बनाए रखता है; भविष्यसूचक वर्णन में यह निश्चित अथवा सजीव रूप से प्रस्तुत कार्य हो सकता है।
- source_word: לִפְנֵיהֶם
  choice: उनके आगे
  rationale: स्थान और नेतृत्व—दोनों के लिए उपयुक्त सामान्य हिन्दी अभिव्यक्ति है और पद में इसकी पुनरावृत्ति बनाए रखती है।
- source_word: פָּרְצוּ
  choice: उन्होंने मार्ग तोड़कर
  rationale: הַפֹּרֵץ के साथ פרץ मूल की शब्दगत कड़ी बनाए रखता है।
- source_word: שַׁעַר
  choice: फाटक
  rationale: नगर या घेरे के प्रवेश-द्वार के लिए सहज और ठोस हिन्दी शब्द है।
- source_word: וַיֵּצְאוּ בוֹ
  choice: उसमें से बाहर निकल गए
  rationale: בוֹ को पूर्वोक्त फाटक से जोड़ते हुए יצא की बाहर निकलने की गति स्पष्ट करता है।
- source_word: מַלְכָּם
  choice: उनका राजा
  rationale: राजकीय अर्थ को सीधे बनाए रखता है; इसे सामान्य 'शासक' कहकर कमजोर नहीं करता।
- source_word: יהוה
  choice: यहोवा
  rationale: हिब्रू दैवी नाम YHWH को हिन्दी में प्रचलित लिप्यंतरण से प्रस्तुत करता है।
- source_word: בְּרֹאשָׁם
  choice: उनके आगे-आगे
  rationale: शाब्दिक 'उनके सिर पर/शीर्ष पर' के बजाय नेतृत्वकारी अग्रस्थान का स्वाभाविक हिन्दी रूप है, बिना राजा और यहोवा को एक ही व्यक्ति ठहराए।
theological_decisions:
- issue: הַפֹּרֵץ की पहचान
  choice: मुख्य पाठ में वर्णनात्मक रूप रखा गया और उसकी पहचान निश्चित नहीं की गई।
  alternative: उसे सेनापति, राजा/मसीही शासक, अथवा स्वयं यहोवा के रूप में स्पष्ट करना।
  rationale: हिब्रू पाठ मार्ग खोलनेवाले, राजा और यहोवा के संबंध को स्पष्ट रूप से परिभाषित नहीं करता; अनुवाद उस वास्तविक अस्पष्टता को बनाए रखता है।
- issue: ‘उनका राजा’ और ‘यहोवा’ का परस्पर संबंध
  choice: दोनों पदों को अलग अभिव्यक्तियों के रूप में रखा गया।
  alternative: उन्हें समानाधिकरण मानकर एक ही व्यक्ति के रूप में अनूदित करना।
  rationale: हिब्रू में दोनों क्रम से अलग अभिव्यक्तियों के रूप में आते हैं; संभावित धर्मवैचारिक संबंध को अनुवाद में तय नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण और दृश्यात्मक रूप अपनाया गया है। פרץ मूल की पुनरावृत्ति को ‘मार्ग तोड़कर’ से यथासंभव बचाया गया है। दैवी नाम को ‘यहोवा’ लिखा गया है।
