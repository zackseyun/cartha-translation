source:
  edition: WLC
  text: נְשֵׁ֤י עַמִּ/י֙ תְּגָ֣רְשׁ֔וּ/ן מִ/בֵּ֖ית תַּֽעֲנֻגֶ֑י/הָ מֵ/עַל֙ עֹֽלָלֶ֔י/הָ תִּקְח֥וּ הֲדָרִ֖/י לְ/עוֹלָֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/002/009.yaml
  text: You drive the women of my people out from their delightful houses[b][a]; from their children you take away my splendor forever.
translation:
  language: hi
  text: मेरी प्रजा की स्त्रियों[a] को तुम उनके सुखद घरों से निकाल देते हो; उनके छोटे बच्चों से तुम मेरी शोभा[b] सदा के लिए छीन लेते हो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘मेरी प्रजा की पत्नियों।’ इब्रानी शब्द सामान्य रूप से स्त्रियों या विशेष रूप से पत्नियों—दोनों को दर्शा सकता है।
    reason: lexical_alternative
  - marker: b
    text: या ‘मेरा गौरव।’ इब्रानी शब्द शोभा, गौरव, प्रताप या सम्मान को दर्शा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: נְשֵׁי עַמִּי
  choice: मेरी प्रजा की स्त्रियों
  rationale: נְשֵׁי, אִשָּׁה का संबंधवाचक बहुवचन रूप है और इसका अर्थ ‘स्त्रियाँ’ या ‘पत्नियाँ’ हो सकता है। प्रसंग में असुरक्षित स्त्रियों के व्यापक समूह का संकेत संभव है, इसलिए मुख्य पाठ में ‘स्त्रियों’ रखा गया है और दूसरा अर्थ पादटिप्पणी में दिया गया है।
- source_word: תְּגָרְשׁוּן
  choice: निकाल देते हो
  rationale: גרשׁ के पिएल रूप में बलपूर्वक बाहर करने या बेदखल करने का भाव है। ‘निकाल देते हो’ आधुनिक हिन्दी में स्वाभाविक है और प्रसंग में इसकी कठोरता स्पष्ट रहती है।
- source_word: מִבֵּית תַּעֲנֻגֶיהָ
  choice: उनके सुखद घरों से
  rationale: בַּיִת का अर्थ घर और תַּעֲנֻגִים का अर्थ सुख, आनंद या सुखद वस्तुएँ है। स्त्रियों के सामूहिक उल्लेख के कारण स्त्रीलिंग एकवचन प्रत्यय को हिन्दी में स्वाभाविक सामूहिक बहुवचन से व्यक्त किया गया है।
- source_word: מֵעַל עֹלָלֶיהָ
  choice: उनके छोटे बच्चों से
  rationale: עוֹלָל छोटे बच्चे या शिशु को दर्शाता है। מֵעַל का अक्षरशः अर्थ ‘ऊपर से’ हो सकता है, पर यहाँ वंचित किए जाने के संबंध को ‘से’ द्वारा स्वाभाविक हिन्दी में व्यक्त किया गया है।
- source_word: תִּקְחוּ
  choice: छीन लेते हो
  rationale: לקח का मूल अर्थ ‘लेना’ है, किंतु बेदखली और वंचना के इस प्रसंग में ‘छीन लेते हो’ हानिकारक और बलपूर्ण क्रिया को स्पष्ट रूप से व्यक्त करता है।
- source_word: הֲדָרִי
  choice: मेरी शोभा
  rationale: הָדָר में शोभा, गौरव, प्रताप या महिमा का अर्थ हो सकता है। ‘शोभा’ ऊँची शैली बनाए रखती है और किसी एक धर्मवैज्ञानिक अर्थ को अनावश्यक रूप से निश्चित नहीं करती; ‘गौरव’ को पादटिप्पणी में रखा गया है।
- source_word: לְעוֹלָם
  choice: सदा के लिए
  rationale: עוֹלָם यहाँ दीर्घस्थायी या अनिश्चितकालीन अवधि प्रकट करता है। ‘सदा के लिए’ आधुनिक हिन्दी में स्वाभाविक और भविष्यवाणी की भर्त्सना के अनुरूप है।
theological_decisions:
- issue: ‘मेरी प्रजा’ और ‘मेरी शोभा’ में ‘मेरी’ का संदर्भ
  choice: वक्ता यहोवा है, इसलिए दोनों स्थानों पर ईश्वरीय प्रथम पुरुष ‘मेरी’ को बनाए रखा गया है।
  alternative: ‘मेरी शोभा’ को सीधे परमेश्वर की शोभा के बजाय बच्चों को परमेश्वर से मिला गौरव या सम्मान समझना।
  rationale: मीका के आसपास के भविष्यवाणी-वचन में ईश्वरीय प्रथम पुरुष सक्रिय है। बिना व्याख्यात्मक विस्तार के ‘मेरी’ बनाए रखने से यह तनाव सुरक्षित रहता है कि वाक्यांश परमेश्वर की अपनी शोभा को अथवा बच्चों को उसकी ओर से मिली गरिमा को सूचित कर सकता है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज रखी गई है। समानांतर आरोपों की काव्यात्मक संरचना अर्धविराम से सुरक्षित है। ‘छीन लेते हो’ प्रसंग की हिंसक वंचना को स्वाभाविक हिन्दी में व्यक्त करता है।
