source:
  edition: WLC
  text: אַל תַּטִּ֖פוּ יַטִּיפ֑וּ/ן לֹֽא יַטִּ֣פוּ לָ/אֵ֔לֶּה לֹ֥א יִסַּ֖ג כְּלִמּֽוֹת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/002/006.yaml
  text: “Do not preach,” they preach. “One should not preach about these things; disgrace will not overtake us.”
translation:
  language: hi
  text: “भविष्यवाणी मत करो,” वे भविष्यवाणी करते हैं। “इन बातों के विषय में भविष्यवाणी नहीं करनी चाहिए; अपमान हम पर नहीं आएगा।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תַּטִּיפוּ / יַטִּיפוּן / יַטִּיפוּ
  choice: उपदेश देना
  rationale: मूल क्रिया का शाब्दिक अर्थ ‘टपकाना’ है, पर भविष्यद्वाणी के संदर्भ में इसका प्रचलित अर्थ संदेश सुनाना या उपदेश देना है। एक ही हिन्दी पद को दोहराकर मूल की शब्द-क्रीड़ा और विरोधाभास बनाए रखा गया है।
- source_word: לָאֵלֶּה
  choice: इन बातों के बारे में
  rationale: सर्वनाम का संकेत निकटवर्ती विषयों की ओर है; हिन्दी में यह स्वाभाविक है और मूल की संदर्भगत खुली प्रकृति को बनाए रखता है।
- source_word: יִסַּג
  choice: आएगा
  rationale: यह क्रिया पहुँचने या आ घेरने का भाव रखती है; ‘हम पर आएगा’ सरल हिन्दी में उसी आशय को व्यक्त करता है।
- source_word: כְּלִמּוֹת
  choice: अपमान
  rationale: बहुवचन रूप लज्जा, निंदा या अपमानजनक दशाओं को सूचित कर सकता है। सामूहिक हिन्दी संज्ञा ‘अपमान’ प्रसंग में स्वाभाविक है।
theological_decisions:
- issue: अंतिम वाक्य के वक्ता और भाव
  choice: 'झूठे आश्वासन के रूप में सीधा कथन: “अपमान हम पर नहीं आएगा।”'
  alternative: भविष्यद्वक्ता का कथन कि अपमान दूर नहीं होगा
  rationale: वाक्य-विन्यास और उद्धृत निषेध की धारा इसे उन लोगों की वाणी के रूप में पढ़ने का समर्थन करती है जो अप्रिय भविष्यद्वाणी रोकना चाहते हैं। फिर भी पद की अत्यंत संक्षिप्त इब्रानी रचना में कुछ व्याख्यात्मक तनाव है।
- issue: לֹא יַטִּפוּ का अवैयक्तिक या बहुवचन अनुवाद
  choice: “उपदेश नहीं देना चाहिए”
  alternative: “वे उपदेश न दें”
  rationale: अव्यक्तिक हिन्दी रचना मूल के अस्पष्ट कर्ता को अनावश्यक रूप से निश्चित नहीं करती।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी। उद्धरण-रचना से विरोधियों की आवाज़ स्पष्ट की गई है; मूल में बार-बार आने वाली भविष्यद्वाणी/उपदेश की क्रिया को एक ही शब्द से सुरक्षित रखा गया है।
