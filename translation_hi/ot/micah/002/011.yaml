id: MIC.2.11
reference: Micah 2:11
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: לוּ אִ֞ישׁ הֹלֵ֥ךְ ר֨וּחַ֙ וָ/שֶׁ֣קֶר כִּזֵּ֔ב אַטִּ֣ף לְ/ךָ֔ לַ/יַּ֖יִן וְ/לַ/שֵּׁכָ֑ר וְ/הָיָ֥ה מַטִּ֖יף הָ/עָ֥ם הַ/זֶּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/002/011.yaml
  text: If a man should go about with wind and falsehood[a], lying, ‘I will preach to you of wine and strong drink,’ he would be the preacher of this people.
translation:
  language: hi
  text: यदि कोई व्यक्ति हवा[a] और झूठ के साथ चलता-फिरता हो और झूठ बोलकर कहे, “मैं तुम्हें दाखमधु और मादक पेय के विषय में उपदेश दूँगा,”[b] तो वही इस प्रजा का उपदेशक होगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: हिब्रू शब्द का अर्थ “हवा,” “साँस” या “आत्मा” हो सकता है। यहाँ “हवा” खोखली या निराधार बात का भाव दे सकती है।
    reason: lexical_ambiguity
  - marker: b
    text: 'अधिक औपचारिक रूप से: “मैं तुम्हें दाखमधु और मादक पेय के विषय में भविष्यवाणी करूँगा … तो वही इस प्रजा का भविष्यवक्ता होगा।” दोनों जगह हिब्रू में एक ही क्रिया है, जो प्रायः भविष्यवाणी-संबंधी वाणी के लिए आती है; यहाँ उसका प्रयोग तीखे व्यंग्य में हुआ है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: לוּ
  choice: यदि
  rationale: यह काल्पनिक शर्त प्रस्तुत करता है; व्यंग्य को बनाए रखने के लिए सरल शर्तसूचक रूप स्वाभाविक है।
- source_word: אִישׁ
  choice: कोई व्यक्ति
  rationale: हिब्रू का एकवचन यहाँ अनिश्चित व्यक्ति को दिखाता है। आधुनिक हिन्दी में यह रूप स्वाभाविक है और कथन का सामान्य आशय स्पष्ट रखता है।
- source_word: הֹלֵךְ רוּחַ וָשֶׁקֶר
  choice: हवा और झूठ के साथ घूमता हुआ
  rationale: यह कठिन मुहावरा हवा की खोखली या निराधार बात और छल—दोनों चित्रों को बिना अत्यधिक व्याख्या के बनाए रखता है। רוּחַ की अर्थगत व्यापकता पादटिप्पणी में दी गई है।
- source_word: כִּזֵּב
  choice: यह झूठ बोले
  rationale: क्रिया का स्पष्ट अर्थ झूठ बोलना या धोखा देना है; यह अगली उद्धृत बात का परिचय भी सहज रूप से कराता है।
- source_word: אַטִּף
  choice: मैं … उपदेश दूँगा
  rationale: נטף यहाँ सार्वजनिक, भविष्यवाणी-सदृश वाणी के लिए व्यंग्यात्मक रूप से प्रयुक्त है। ‘उपदेश दूँगा’ सामान्य पाठक के लिए सुबोध है, और तकनीकी विकल्प पादटिप्पणी में सुरक्षित है।
- source_word: לַיַּיִן וְלַשֵּׁכָר
  choice: दाखमधु और मदिरा के विषय में
  rationale: יַיִן को दाखमधु और שֵׁכָר को व्यापक अर्थ वाली नशीली मदिरा के रूप में अलग रखा गया है; पूर्वसर्ग संदेश के विषय को सूचित करता है।
- source_word: וְהָיָה מַטִּיף
  choice: तो वही … उपदेशक होगा
  rationale: पहले प्रयुक्त क्रिया से शब्दगत संबंध बनाए रखते हुए काल्पनिक परिणाम और तीखा व्यंग्य व्यक्त किया गया है।
- source_word: הָעָם הַזֶּה
  choice: इस प्रजा
  rationale: एकवचन सामूहिक संज्ञा और भविष्यद्वक्ताओं की फटकार वाला गरिमापूर्ण लहजा सुरक्षित रहता है।
theological_decisions:
- issue: व्यंग्यात्मक निन्दा में भविष्यवाणी-संबंधी נטף का अनुवाद
  choice: उपदेश दूँगा / उपदेशक
  alternative: भविष्यवाणी करूँगा / भविष्यवक्ता
  rationale: पद उस धार्मिक वक्ता का उपहास करता है जिसे यह प्रजा पसंद करेगी। मुख्य पाठ का रूप सहज सार्वजनिक धार्मिक वाणी बताता है, पर उसे सच्चा भविष्यवक्ता घोषित नहीं करता; हिब्रू के भविष्यवाणी-संबंधी प्रयोग को पादटिप्पणी में रखा गया है।
- issue: רוּחַ का अर्थ
  choice: हवा
  alternative: आत्मा या सांस
  rationale: इस प्रसंग में ‘हवा’ खोखलेपन और निराधार वाणी की छवि को सबसे सीधे बनाए रखती है, फिर भी मूल शब्द की बहुअर्थकता पादटिप्पणी में स्पष्ट की गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सुबोध, गरिमापूर्ण और भविष्यद्वक्ताओं की फटकार के अनुरूप व्यंग्यात्मक लहजा रखा गया है। ‘दाखमधु’ और ‘मदिरा’ के भेद तथा ‘उपदेश दूँगा/उपदेशक’ की पुनरावृत्ति से मूल की शब्द-संगति सुरक्षित है।
