source:
  edition: WLC
  text: בַּ/יּ֨וֹם הַ/ה֜וּא יִשָּׂ֧א עֲלֵי/כֶ֣ם מָשָׁ֗ל וְ/נָהָ֨ה נְהִ֤י נִֽהְיָה֙ אָמַר֙ שָׁד֣וֹד נְשַׁדֻּ֔נוּ חֵ֥לֶק עַמִּ֖/י יָמִ֑יר אֵ֚יךְ יָמִ֣ישׁ לִ֔/י לְ/שׁוֹבֵ֥ב שָׂדֵ֖י/נוּ יְחַלֵּֽק׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/002/004.yaml
  text: On that day one will take up a taunt against you and lament a lament[a], saying, “We are utterly ruined! He changes the portion of my people[b]. How he removes it from me! To the one who turns away he divides our fields.”
translation:
  language: hi
  text: 'उस दिन कोई तुम्हारे विरुद्ध ताने की उक्ति कहेगा और विलाप-भरा शोकगीत गाएगा[a]। वह कहेगा,


    “हम पूरी तरह उजाड़ दिए गए हैं!


    वह मेरे लोगों का भाग बदल देता है।


    कैसे वह उसे मुझसे दूर कर देता है!


    वह हमारे खेत मुँह मोड़नेवाले[b] को बाँट देता है।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में एक ही शब्द-मूल से जुड़े शोकसूचक शब्दों की पुनरावृत्ति है; इसका अनुवाद “विलाप पर विलाप करेगा” या “रोते हुए मातम का गीत गाएगा” भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी शब्द कठिन है। इसका अर्थ “विद्रोही” या “धर्मत्यागी” भी हो सकता है; एक अन्य, कम सम्भावित समझ “बन्दी बनानेवाला” अथवा “वापस मुड़नेवाला” है।
    reason: alternative_reading
lexical_decisions:
- source_word: יִשָּׂא ... מָשָׁל
  choice: ताना देनेवाली उक्ति छेड़ेगा
  rationale: यह इब्रानी मुहावरा किसी कहावत, दृष्टान्त, उपहासपूर्ण उक्ति या ताने को आरम्भ करने के लिए प्रयुक्त होता है। न्याय और सार्वजनिक उपहास के इस प्रसंग में यह अनुवाद ताने के भाव तथा ‘छेड़ने’ के मुहावरे—दोनों को स्वाभाविक हिन्दी में रखता है।
- source_word: וְנָהָה נְהִי נִהְיָה
  choice: विलाप करते हुए शोकगीत गाएगा
  rationale: मूल में एक ही शब्द-मूल से जुड़े शोकसूचक पदों की पुनरावृत्ति है। हिन्दी में शाब्दिक पुनरावृत्ति अस्वाभाविक होती, इसलिए ‘विलाप’ और ‘शोकगीत’ से उसकी गहन शोकध्वनि रखी गई है; पुनरावृत्ति की जानकारी पाद-टिप्पणी में दी गई है।
- source_word: שָׁדוֹד נְשַׁדֻּנוּ
  choice: हम पूरी तरह उजाड़ दिए गए हैं
  rationale: क्रियारूपों की पुनरावृत्ति विनाश की पूर्णता पर बल देती है। निष्क्रिय वाक्य-विन्यास और ‘पूरी तरह’ मूल के प्रबल अर्थ को रखते हैं, जबकि ‘उजाड़ दिए गए’ भूमि और सम्पत्ति छिनने के प्रसंग के अनुकूल है।
- source_word: חֵלֶק עַמִּי
  choice: मेरी प्रजा का हिस्सा
  rationale: חֵלֶק का सीधा अर्थ हिस्सा या भाग है और यहाँ भूमि के आवंटित भाग का संकेत है। ‘विरासत’ कहने से अधिक विशिष्ट धार्मिक-वैधानिक अर्थ जुड़ सकता था, इसलिए व्यापक ‘हिस्सा’ रखा गया है।
- source_word: יָמִיר
  choice: बदल देता है
  rationale: मूल क्रिया बदलने या अदला-बदली करने का अर्थ दे सकती है। ‘बदल देता है’ मूल की व्यापकता बनाए रखता है और हस्तांतरण की ठीक प्रक्रिया को अनावश्यक रूप से निर्धारित नहीं करता।
- source_word: אֵיךְ יָמִישׁ לִי
  choice: कैसे वह उसे मुझसे दूर कर देता है
  rationale: אֵיךְ विस्मय और व्यथित शिकायत प्रकट करता है। ‘उसे’ पिछले ‘हिस्से’ की ओर संकेत करता है, और ‘दूर कर देता है’ कारणवाचक हटाने के भाव को बिना ‘छीनने’ की अतिरिक्त तीव्रता जोड़े व्यक्त करता है।
- source_word: לְשׁוֹבֵב
  choice: मुँह मोड़नेवाले को
  rationale: यह कठिन और विवादित रूप שובב से ‘मुड़ जानेवाला’ या ‘मुँह मोड़नेवाला’ समझा जा सकता है। यह अनुवाद ‘धर्मत्यागी’ की अपेक्षा अधिक पारदर्शी और कम व्याख्यात्मक है; अन्य सम्भावनाएँ पाद-टिप्पणी में सुरक्षित हैं।
- source_word: שָׂדֵינוּ יְחַלֵּק
  choice: वह हमारे खेत ... को बाँट देता है
  rationale: क्रिया का अर्थ बाँटना या हिस्सा लगाना है। ‘खेत बाँट देता है’ भूमि के विभाजन और बेदखली का दृश्य स्पष्ट, सरल हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: לְשׁוֹבֵב का कठिन अर्थ
  choice: मुँह मोड़नेवाले को
  alternative: विद्रोही/धर्मत्यागी को; अथवा, कम सम्भावित रूप से, बन्दी बनानेवाले या वापस मुड़नेवाले को
  rationale: इब्रानी रूप शब्दार्थ और वाक्य-विन्यास दोनों की दृष्टि से अनिश्चित है। मुख्य पाठ में שובב से निकला पारदर्शी अर्थ रखा गया है, पर उसे विशिष्ट धार्मिक पद ‘धर्मत्यागी’ बनाकर तनाव को समाप्त नहीं किया गया; वैकल्पिक पाठ पाद-टिप्पणी में दिए गए हैं।
- issue: भूमि बदलने और बाँटनेवाले ‘वह’ की पहचान
  choice: सर्वनाम ‘वह’ को बिना स्पष्ट पहचान के रखा गया
  alternative: परमेश्वर या विजेता को स्पष्ट कर्ता बनाना
  rationale: मूल पाठ कर्ता का नाम स्पष्ट नहीं करता। उसे परमेश्वर अथवा किसी मानवीय विजेता के रूप में निश्चित करना व्याख्यात्मक अति होती, इसलिए मूल की अस्पष्टता बनाए रखी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी का काव्यात्मक किन्तु सहज और गरिमापूर्ण स्तर रखा गया है। ‘ताना देनेवाली उक्ति’ और ‘शोकगीत’ भविष्यद्वाणी की सार्वजनिक, काव्यात्मक वाणी को व्यक्त करते हैं। कठिन इब्रानी वाक्यांशों को अत्यधिक धार्मिक पारिभाषिक शब्दों से निर्णीत नहीं किया गया।
