reference: Micah 2:1
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: ה֧וֹי חֹֽשְׁבֵי אָ֛וֶן וּ/פֹ֥עֲלֵי רָ֖ע עַל מִשְׁכְּבוֹתָ֑/ם בְּ/א֤וֹר הַ/בֹּ֨קֶר֙ יַעֲשׂ֔וּ/הָ כִּ֥י יֶשׁ לְ/אֵ֖ל יָדָֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/002/001.yaml
  text: Woe to those who devise wickedness and work out evil on their beds! At the light of morning they do it[a], because it is in the power of their hand.
translation:
  language: hi
  text: हाय उन पर जो अपने बिछौनों पर दुष्टता की योजनाएँ बनाते और बुराई रचते हैं! भोर होते ही वे उसे कर डालते हैं, क्योंकि उनके हाथ में ऐसा करने की सामर्थ्य है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “क्योंकि उनका हाथ उनका देवता है।”
    reason: 'वैकल्पिक पाठ: אֵל का अर्थ ‘सामर्थ्य’ के बजाय ‘देवता’ लेकर इस खंड को आलंकारिक रूप से समझा जा सकता है।'
lexical_decisions:
- source_word: הוֹי
  choice: हाय उन पर
  rationale: यह भविष्यद्वक्ताओं की धिक्कार और आने वाले न्याय की घोषणा का स्वाभाविक हिन्दी रूप है; केवल ‘हाय’ की अपेक्षा लक्षित लोगों पर विपत्ति का भाव अधिक स्पष्ट करता है।
- source_word: חֹשְׁבֵי אָוֶן
  choice: दुष्टता की योजनाएँ बनाते
  rationale: חשב का कृदंत जानबूझकर योजना बनाने का भाव रखता है, और אָוֶן यहाँ नैतिक दुष्टता को सूचित करता है।
- source_word: וּפֹעֲלֵי רָע
  choice: और बुराई रचते हैं
  rationale: פעל योजना को आकार देने या तैयार करने की प्रगति दिखाता है; ‘बुराई करते’ कहने से अगली पंक्ति के יַעֲשׂוּהָ के साथ अनावश्यक पुनरावृत्ति होती।
- source_word: עַל מִשְׁכְּבוֹתָם
  choice: अपने बिछौनों पर
  rationale: मूल स्थान-बिंब को निकटता से सुरक्षित रखता है और रात में षड्यंत्र रचने का दृश्य व्यक्त करता है।
- source_word: בְּאוֹר הַבֹּקֶר
  choice: भोर होते ही
  rationale: शाब्दिक ‘भोर के उजाले में’ की तात्कालिकता और प्रथम प्रकाश का भाव स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: יַעֲשׂוּהָ
  choice: वे उसे कर डालते हैं
  rationale: स्त्रीलिंग प्रत्यय पहले सोची गई दुष्टता अथवा बुराई की ओर लौटता है; ‘कर डालते’ योजना के तत्काल क्रियान्वयन को दर्शाता है, पर वस्तु को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: כִּי יֶשׁ לְאֵל יָדָם
  choice: क्योंकि ऐसा करना उनके हाथ की सामर्थ्य में है
  rationale: אֵל को यहाँ ‘सामर्थ्य’ मानने वाला मुहावरेदार अर्थ प्रसंग में सबसे स्वाभाविक है। ‘हाथ’ का मूल बिंब भी सुरक्षित रखा गया है।
theological_decisions:
- issue: अंतिम उपवाक्य में לְאֵל का अर्थ
  choice: मुहावरेदार अर्थ ‘सामर्थ्य’
  alternative: ‘क्योंकि उनका हाथ ही उनका देवता है’
  rationale: मुख्य पाठ में यह कारण बताता है कि वे भोर में अपनी योजना क्यों पूरी करते हैं—उनके पास उसे करने की शक्ति है। फिर भी אֵל को ‘देवता’ समझने वाला आत्म-उत्थान का आलंकारिक पाठ संभव है, इसलिए उसे पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी। भविष्यद्वाणी की धिक्कार, रात की योजनाबंदी और भोर में उसके क्रियान्वयन की गति सुरक्षित रखी गई है।
