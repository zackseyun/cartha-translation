source:
  edition: WLC
  text: לָ/כֵן֙ לֹֽא יִֽהְיֶ֣ה לְ/ךָ֔ מַשְׁלִ֥יךְ חֶ֖בֶל בְּ/גוֹרָ֑ל בִּ/קְהַ֖ל יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/002/005.yaml
  text: Therefore you will have no one to cast the measuring line by lot in the assembly of Yahweh[a][b].
translation:
  language: hi
  text: इसलिए तुम्हारे लिए कोई न होगा जो यहोवा की सभा में चिट्ठी के अनुसार नापने की डोरी[a] खींचेगा[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “डोरी,” “रस्सी,” अथवा “भाग नापने की डोरी।” इब्रानी शब्द उस डोरी को सूचित कर सकता है जिससे विरासत की भूमि नापी जाती थी।
    reason: lexical_alternative
  - marker: b
    text: अर्थात जब एकत्रित वाचा-समुदाय में भूमि चिट्ठी द्वारा बाँटी जाए।
    reason: cultural_note
lexical_decisions:
- source_word: לָכֵן
  choice: इसलिए
  rationale: यह शब्द पिछले आरोप और दंड से निकलने वाले परिणाम को स्पष्ट करता है और भविष्यद्वाणी के निष्कर्षात्मक बल को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: לֹא יִהְיֶה לְךָ
  choice: तुम्हारे लिए कोई न होगा
  rationale: इब्रानी की अस्तित्ववाचक रचना और पुल्लिंग एकवचन संबोधन, दोनों को अपेक्षाकृत निकटता से सुरक्षित रखता है।
- source_word: מַשְׁלִיךְ
  choice: डालेगा
  rationale: कृदंत यहाँ कार्य करने वाले व्यक्ति के अर्थ में है; ‘कोई ... जो ... डालेगा’ हिन्दी में व्यक्ति और क्रिया दोनों को स्पष्ट करता है।
- source_word: חֶבֶל
  choice: नापने की डोरी
  rationale: भूमि-विभाजन के प्रसंग में यह नापने या सीमा निर्धारित करने की डोरी है; यह चयन ठोस चित्र को बनाए रखता है।
- source_word: בְּגוֹרָל
  choice: चिट्ठी डालकर
  rationale: भूमि का भाग चिट्ठी द्वारा ठहराने की प्राचीन रीति को स्वाभाविक हिन्दी में व्यक्त करता है, बिना इसे केवल सामान्य ‘बँटवारे’ में बदलने के।
- source_word: בִּקְהַל יְהוָה
  choice: यहोवा की सभा में
  rationale: קהל जुटे हुए वाचा-समुदाय को सूचित करता है; ‘सभा’ आधुनिक, गरिमापूर्ण और व्यापक हिन्दी शब्द है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: मूल पाठ में आए परमेश्वर के व्यक्तिगत नाम को हिन्दी में प्रचलित लिप्यंतरण से प्रस्तुत करता है, उपाधि से प्रतिस्थापित नहीं करता।
theological_decisions:
- issue: एकवचन ‘तुम्हारे’ का संदर्भ
  choice: न्याय के अधीन व्यक्ति या समूह को एकवचन में सीधा संबोधन बनाए रखा गया है।
  alternative: इसे स्पष्ट रूप से ‘तुम लोगों में से’ कहकर सामूहिक बनाया जा सकता था, या इसे विशेष रूप से झूठे भविष्यद्वक्ताओं अथवा अगुओं पर लागू किया जा सकता था।
  rationale: मूल पाठ पुल्लिंग एकवचन का प्रयोग करता है, जबकि निकट संदर्भ भूमि हड़पने वालों के समुदाय की ओर संकेत कर सकता है। अनुवाद अस्पष्टता को अतिरिक्त पहचान जोड़कर समाप्त नहीं करता।
- issue: भूमि-विभाजन और सभा का संबंध
  choice: वाक्य को यहोवा की सभा में चिट्ठी द्वारा भूमि नापने/बाँटने की भावी क्रिया से संबंधित रखा गया है।
  alternative: इसे सामान्य रूप से समुदाय से निष्कासन या केवल सीमा खींचने की क्रिया माना जा सकता है।
  rationale: חבל और גורל का संयुक्त प्रयोग विरासत की भूमि के नाप और आवंटन की ओर दृढ़ संकेत करता है, पर मुख्य पाठ उस अर्थ को अत्यधिक विस्तार से नहीं समझाता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण भविष्यद्वाणी-शैली रखी गई है। ‘तुम्हारे’ मूल के एकवचन संबोधन को सुरक्षित रखता है। ‘चिट्ठी डालकर ... डोरी डालेगा’ में मूल के दोहरे ‘डालने’ के बिंब को बनाए रखा गया है, यद्यपि हिन्दी में इसकी पुनरावृत्ति जानबूझकर ठोस आवंटन-दृश्य प्रस्तुत करती है।
