  text: וְ/שָׁפַ֗ט בֵּ֚ין עַמִּ֣ים רַבִּ֔ים וְ/הוֹכִ֛יחַ לְ/גוֹיִ֥ם עֲצֻמִ֖ים עַד רָח֑וֹק וְ/כִתְּת֨וּ חַרְבֹתֵי/הֶ֜ם לְ/אִתִּ֗ים וַ/חֲנִיתֹֽתֵי/הֶם֙ לְ/מַזְמֵר֔וֹת לֹֽא יִשְׂא֞וּ גּ֤וֹי אֶל גּוֹי֙ חֶ֔רֶב וְ/לֹא יִלְמְד֥וּ/ן ע֖וֹד מִלְחָמָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/004/003.yaml
  text: And he will judge between many peoples[a], and will arbitrate for strong nations far away; and they will beat their swords into plowshares and their spears into pruning hooks. Nation will not lift up sword against nation[c][b], nor will they learn war anymore.
translation:
  language: hi
  text: वह अनेक जनसमुदायों के बीच न्याय करेगा और दूर के शक्तिशाली राष्ट्रों के विवादों का निर्णय करेगा[a]। वे अपनी तलवारों को पीटकर हल के फाल[b] और अपने भालों को छँटाई के हँसुए बनाएँगे। कोई राष्ट्र दूसरे राष्ट्र के विरुद्ध तलवार नहीं उठाएगा, और वे फिर कभी युद्ध करना नहीं सीखेंगे[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘दूर के शक्तिशाली राष्ट्रों को ताड़ना देगा।’ हिब्रू क्रिया का अर्थ ‘मध्यस्थता करना’ भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: अर्थात हल के लोहे के फाल; हिब्रू शब्द किसी जुताई के औज़ार को भी सूचित कर सकता है।
    reason: lexical_alternative
  - marker: c
    text: ‘युद्ध करना सीखेंगे’ का अर्थ ‘युद्ध का प्रशिक्षण लेंगे’ भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁפַט בֵּין עַמִּים רַבִּים
  choice: वह अनेक जनसमुदायों के बीच न्याय करेगा
  rationale: שׁפט के न्यायिक अर्थ और בֵּין के ‘बीच’ अर्थ को बनाए रखा गया है। עַמִּים को आधुनिक राष्ट्र-राज्य तक सीमित न करके ‘जनसमुदायों’ से व्यक्त किया गया है।
- source_word: וְהוֹכִיחַ
  choice: विवादों का निर्णय करेगा
  rationale: हिफ़ील रूप यहाँ न्यायिक समानांतरता में निर्णय करने या विवाद निपटाने का अर्थ देता है; हिंदी में यह स्वाभाविक है, जबकि सुधारने या डाँटने की संभावित अर्थछाया पादटिप्पणी में सुरक्षित है।
- source_word: לְגוֹיִם עֲצֻמִים עַד רָחוֹק
  choice: दूर-दूर के शक्तिशाली राष्ट्रों के
  rationale: גּוֹיִם को ‘राष्ट्र’, עֲצֻמִים को ‘शक्तिशाली’ और दूरी की व्यापकता को ‘दूर-दूर के’ से व्यक्त किया गया है।
- source_word: וְכִתְּתוּ חַרְבֹתֵיהֶם לְאִתִּים
  choice: वे अपनी तलवारों को पीटकर हल के फाल बनाएँगे
  rationale: כתת के पीटकर नया आकार देने के चित्र को बनाए रखा गया है; אִתִּים के लिए प्रचलित कृषि-शब्द ‘हल के फाल’ चुना गया है।
- source_word: וַחֲנִיתֹתֵיהֶם לְמַזְמֵרוֹת
  choice: अपने भालों को छँटाई की हँसियाँ बनाएँगे
  rationale: भालों से बेलों या डालियों की छँटाई के औज़ार बनाए जाने का ठोस कृषि-चित्र सुरक्षित रखा गया है।
- source_word: לֹא יִשְׂאוּ גּוֹי אֶל גּוֹי חֶרֶב
  choice: कोई राष्ट्र दूसरे राष्ट्र के विरुद्ध तलवार नहीं उठाएगा
  rationale: हिब्रू के एकवचन वितरणात्मक प्रयोग को स्वाभाविक आधुनिक हिंदी में व्यक्त किया गया है और ‘तलवार उठाना’ मुहावरे को बनाए रखा गया है।
- source_word: וְלֹא יִלְמְדוּן עוֹד מִלְחָמָה
  choice: वे फिर कभी युद्ध करना नहीं सीखेंगे
  rationale: ‘युद्ध सीखना’ की हिब्रू अभिव्यक्ति को निकट और समझने योग्य हिंदी में रखा गया है; ‘युद्ध का प्रशिक्षण लेना’ पादटिप्पणी में वैकल्पिक अर्थ है।
theological_decisions:
- issue: आरंभिक एकवचन क्रियाओं का कर्ता
  choice: ‘वह’ रखा गया, पर उसकी पहचान इस पद में स्पष्ट नहीं की गई।
  alternative: ‘यहोवा’, मसीही शासक, अथवा सिय्योन/यरूशलेम का मानवीकरण
  rationale: हिब्रू में कर्ता अंतर्निहित एकवचन है और इस पंक्ति में उसका नाम नहीं दिया गया। इसलिए संदर्भ से किसी एक धर्मवैज्ञानिक पहचान को अनिवार्य नहीं बनाया गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सार्वजनिक पाठ के योग्य रखी गई है। ‘जनसमुदाय’ और ‘राष्ट्र’ का भेद עַמִּים तथा גּוֹיִם के अलग-अलग शब्दों को प्रतिबिंबित करता है। हथियारों से खेती के औज़ार बनाने का काव्यात्मक समानांतर चित्र स्पष्ट रखा गया है।
