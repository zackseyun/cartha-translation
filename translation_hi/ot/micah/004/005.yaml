language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: כִּ֚י כָּל הָ֣/עַמִּ֔ים יֵלְכ֕וּ אִ֖ישׁ בְּ/שֵׁ֣ם אֱלֹהָ֑י/ו וַ/אֲנַ֗חְנוּ נֵלֵ֛ךְ בְּ/שֵׁם יְהוָ֥ה אֱלֹהֵ֖י/נוּ לְ/עוֹלָ֥ם וָ/עֶֽד־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/micah/004/005.yaml
  text: For all the peoples walk[a], each in the name of his god[c][b], but we will walk in the name of Yahweh our God forever and ever.
translation:
  language: hi
  text: क्योंकि सब राष्ट्र अपने-अपने देवता के नाम पर चलेंगे, परन्तु हम अपने परमेश्वर यहोवा के नाम पर सदा-सर्वदा चलेंगे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह अव्यय पिछले कथन से इस पद का व्याख्यात्मक या आधारसूचक संबंध जोड़ता है; आधुनिक हिन्दी में ‘क्योंकि’ इस संबंध को स्वाभाविक रूप से व्यक्त करता है।
- source_word: כָּל הָעַמִּים
  choice: सब जातियाँ
  rationale: עַמִּים अलग-अलग जनसमुदायों या राष्ट्रों को दर्शा सकता है। ‘जातियाँ’ बाइबिलीय प्रसंग में बहुवचन जनसमुदायों का अर्थ बनाए रखता है।
- source_word: יֵלְכוּ / נֵלֵךְ
  choice: चलती हैं / चलते रहेंगे
  rationale: הלך यहाँ केवल भौतिक गति नहीं, बल्कि धार्मिक निष्ठा और जीवन-आचरण को सूचित करता है। ‘चलना’ मूल रूपक और दोनों खंडों का समानांतर भाव बनाए रखता है; दूसरे खंड में ‘रहेंगे’ संकल्प और निरंतरता स्पष्ट करता है।
- source_word: אִישׁ בְּשֵׁם אֱלֹהָיו
  choice: अपने-अपने देवता के नाम पर
  rationale: אִישׁ यहाँ ‘सब जातियाँ’ के साथ वितरणात्मक है। ‘अपने-अपने’ प्रत्येक जनसमुदाय की अलग निष्ठा को स्वाभाविक हिन्दी में व्यक्त करता है, जबकि אֱלֹהָיו के एकवचन को ‘देवता’ बनाए रखता है।
- source_word: בְּשֵׁם
  choice: के नाम पर
  rationale: यह पदबंध निष्ठा, अधिकार या आह्वान का भाव रखता है। दोनों अर्धपदों में ‘के नाम पर’ की पुनरावृत्ति इब्रानी समानांतरता को सुरक्षित रखती है।
- source_word: וַאֲנַחְנוּ
  choice: परन्तु हम
  rationale: वाव औपचारिक रूप से संयोजक है, पर यहाँ अन्य जातियों और वक्ता-समुदाय के बीच स्पष्ट विरोध है; ‘परन्तु’ उस विरोध को व्यक्त करता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: यह व्यक्तिगत ईश्वरीय नाम YHWH का हिन्दी में प्रचलित लिप्यंतरण है; इसे किसी उपाधि से प्रतिस्थापित नहीं किया गया।
- source_word: אֱלֹהֵינוּ
  choice: अपने परमेश्वर
  rationale: पहले पुरुष बहुवचन संबंध को हिन्दी में ‘हम अपने परमेश्वर’ स्वाभाविक ढंग से व्यक्त करता है और वाचा-संबंध का भाव बनाए रखता है।
- source_word: לְעוֹלָם וָעֶד
  choice: सदा-सर्वदा
  rationale: यह युग्म अनंत और स्थायी अवधि पर बल देता है; ‘सदा-सर्वदा’ उसका गरिमापूर्ण और सहज हिन्दी समतुल्य है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का रूप
  choice: यहोवा
  alternative: याहवे
  rationale: मूल में उपाधि नहीं, चतुरक्षरीय व्यक्तिगत नाम है। हिन्दी के साधारण बाइबिल पाठकों के लिए परिचित ‘यहोवा’ नामत्व को स्पष्ट रखता है; ‘याहवे’ संभावित वैकल्पिक लिप्यंतरण है।
- issue: जातियों के वर्तमान आचरण और इस्राएल के संकल्प/भविष्य का कालगत अंतर
  choice: चलती हैं … चलते रहेंगे
  alternative: चलें … चलेंगे
  rationale: पहला अपूर्ण क्रिया-रूप प्रचलित आचरण को और दूसरा संकल्प या भावी निरंतरता को व्यक्त कर सकता है। अनुवाद इस तनाव को वर्तमान आदत और स्थायी प्रतिबद्धता के रूप में रखता है, उसे सार्वभौमिक धार्मिक अनुमोदन में नहीं बदलता।
- issue: אִישׁ का वितरणात्मक और व्याकरणतः पुल्लिंग रूप
  choice: अपने-अपने
  alternative: हर एक
  rationale: यहाँ אִישׁ केवल पुरुष व्यक्तियों को नहीं, ‘सब जातियाँ’ में से प्रत्येक को वितरणात्मक रूप से सूचित करता है। ‘अपने-अपने’ वही अर्थ बिना अनावश्यक पुरुष-विशेष संकेत के देता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘चलना’ का बाइबिलीय रूपक तथा दोनों अर्धपदों की समानांतरता सुरक्षित है। ‘जातियाँ’ को आधुनिक सामाजिक ‘जाति’ व्यवस्था के अर्थ में नहीं, अलग-अलग जनसमुदायों के अर्थ में पढ़ा जाना चाहिए।
