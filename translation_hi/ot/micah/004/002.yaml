source:
  edition: WLC
  text: וְֽ/הָלְכ֞וּ גּוֹיִ֣ם רַבִּ֗ים וְ/אָֽמְרוּ֙ לְכ֣וּ וְ/נַעֲלֶ֣ה אֶל הַר יְהוָ֗ה וְ/אֶל בֵּית֙ אֱלֹהֵ֣י יַעֲקֹ֔ב וְ/יוֹרֵ֨/נוּ֙ מִ/דְּרָכָ֔י/ו וְ/נֵלְכָ֖ה בְּ/אֹֽרְחֹתָ֑י/ו כִּ֤י מִ/צִּיּוֹן֙ תֵּצֵ֣א תוֹרָ֔ה וּ/דְבַר יְהוָ֖ה מִ/ירוּשָׁלִָֽם׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/004/002.yaml
  text: And many nations will come and say[a], “Come, let us go up to the mountain of Yahweh, to the house of the God of Jacob, that he may teach us his ways and that we may walk in his paths.” For from Zion Torah will go out, and the word of Yahweh from Jerusalem.
translation:
  language: hi
  text: और बहुत-सी जातियाँ आएँगी और कहेंगी, “आओ, हम याहवे के पर्वत पर, याकूब के परमेश्वर के भवन में चढ़ चलें, ताकि वह हमें अपने मार्गों की शिक्षा दे और हम उसके पथों पर चलें।” क्योंकि सिय्योन से तोराह[a] निकलेगी, और यरूशलेम से याहवे का वचन निकलेगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “व्यवस्था” अथवा “शिक्षा”।
    reason: תּוֹרָה के वैकल्पिक अर्थों को स्पष्ट करना।
lexical_decisions:
- source_word: וְהָלְכוּ
  choice: आएँगी
  rationale: मूल क्रिया का सामान्य अर्थ ‘जाना/चलना’ है, पर जातियाँ सिय्योन की ओर बढ़ रही हैं; गंतव्य के दृष्टिकोण से आधुनिक हिन्दी में ‘आएँगी’ स्वाभाविक है।
- source_word: גּוֹיִם רַבִּים
  choice: बहुत-सी जातियाँ
  rationale: यह पद अनेक राष्ट्रीय समुदायों को दर्शाता है; ‘जातियाँ’ हिन्दी बाइबलीय प्रयोग में इस अंतरराष्ट्रीय विस्तार को स्पष्ट रखता है।
- source_word: לְכוּ וְנַעֲלֶה
  choice: आओ, हम ... चढ़ चलें
  rationale: आज्ञार्थक और संकल्पसूचक रूप सामूहिक निमंत्रण व्यक्त करते हैं; ‘चढ़ चलें’ यरूशलेम की ओर आरोहण की छवि बनाए रखता है।
- source_word: הַר יְהוָה
  choice: याहवे का पर्वत
  rationale: הַר का सीधा अर्थ ‘पर्वत’ है और יהוה को उसके व्यक्तिगत नाम ‘याहवे’ के रूप में लिप्यंतरित किया गया है।
- source_word: בֵּית אֱלֹהֵי יַעֲקֹב
  choice: याकूब के परमेश्वर का भवन
  rationale: ‘भवन’ मूल के ‘घर’ संबंधी शब्द को बनाए रखता है और ‘मन्दिर’ कहकर आशय को अनावश्यक रूप से सीमित नहीं करता।
- source_word: וְיוֹרֵנוּ מִדְּרָכָיו
  choice: ताकि वह हमें अपने मार्गों की शिक्षा दे
  rationale: यहाँ क्रिया उद्देश्य और अपेक्षित परिणाम बताती है। מן सहित मुहावरे का सहज हिन्दी अर्थ मार्गों के विषय में शिक्षा देना है।
- source_word: וְנֵלְכָה בְּאֹרְחֹתָיו
  choice: और हम उसके पथों पर चलें
  rationale: ‘चलें’ आचरण की बाइबलीय रूपक-छवि तथा ‘पथों’ के साथ काव्यात्मक समानांतरता को सुरक्षित रखता है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यह जातियों के सिय्योन जाकर शिक्षा पाने की इच्छा का कारण प्रस्तुत करता है।
- source_word: תּוֹרָה
  choice: तोराह
  rationale: ‘तोराह’ वैधानिक नियम से व्यापक, परमेश्वर की वाचा-संबंधी शिक्षा का भाव सुरक्षित रखता है; हिन्दी विकल्प पादटिप्पणी में दिए गए हैं।
- source_word: דְבַר יְהוָה
  choice: याहवे का वचन
  rationale: ‘वचन’ दैवी घोषणा के अर्थ को गरिमापूर्ण और परिचित हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: याहवे
  alternative: यहोवा अथवा ‘प्रभु’
  rationale: मूल पाठ व्यक्तिगत वाचा-नाम का प्रयोग करता है; ‘याहवे’ उसका सीधा लिप्यंतरण है और उसे किसी उपाधि से प्रतिस्थापित नहीं करता।
- issue: भविष्यसूचक सिय्योन प्रसंग में תּוֹרָה
  choice: तोराह
  alternative: व्यवस्था अथवा शिक्षा
  rationale: इस प्रसंग में शब्द केवल विधि-संहिता नहीं, सिय्योन से निकलने वाली दैवी शिक्षा भी दर्शाता है। लिप्यंतरण इस व्यापक और वाचा-संबंधी अर्थ को खुला रखता है, जबकि पादटिप्पणी सामान्य हिन्दी अर्थ देती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘चढ़ चलें’, ‘मार्गों’ और ‘पथों’ से मूल की तीर्थयात्रा तथा आचरण-संबंधी काव्यात्मक छवियाँ बनी रहती हैं। पादटिप्पणी-चिह्न उसी शब्द ‘तोराह’ के बाद रखा गया है जिससे वह संबंधित है।
