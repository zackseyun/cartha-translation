  text: בַּ/יּ֨וֹם הַ/ה֜וּא נְאֻם יְהוָ֗ה אֹֽסְפָה֙ הַ/צֹּ֣לֵעָ֔ה וְ/הַ/נִּדָּחָ֖ה אֲקַבֵּ֑צָה וַ/אֲשֶׁ֖ר הֲרֵעֹֽתִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/004/006.yaml
  text: In that day[a], declares Yahweh, I will gather the lame, and I will assemble the outcast[c][b], even those whom I have afflicted.
translation:
  language: hi
  text: 'याहवे की यह घोषणा है: “उस दिन मैं लँगड़े लोगों[a] को इकट्ठा करूँगा; दूर भगा दिए गए लोगों[b] को, और जिन्हें मैंने दुःख दिया है[c], एकत्र करूँगा।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, ‘लँगड़ानेवाली।’ हिब्रू में स्त्रीलिंग एकवचन कृदंत पूरे समूह के लिए प्रयुक्त हुआ है।
    reason: lexical_alternative
  - marker: b
    text: इसका अनुवाद ‘खदेड़े गए’ या ‘निर्वासित किए गए’ भी हो सकता है।
    reason: lexical_alternative
  - marker: c
    text: इसका अनुवाद ‘जिन पर मैंने विपत्ति डाली है’ भी हो सकता है। हिब्रू में याहवे को उस पहले के दुःख का कर्ता स्पष्ट रूप से बताया गया है।
    reason: alternative_reading
lexical_decisions:
- source_word: בַּיּוֹם הַהוּא
  choice: उस दिन
  rationale: यह भविष्यद्वाणी में प्रयुक्त मानक काल-सूचक वाक्यांश है; ‘उस दिन’ उसका स्वाभाविक और गरिमापूर्ण हिन्दी रूप है।
- source_word: נְאֻם יְהוָה
  choice: याहवे की यह घोषणा है
  rationale: נְאֻם भविष्यद्वक्ता के माध्यम से दी गई गंभीर ईश्वरीय घोषणा का सूत्र है; यह रूप उसकी औपचारिकता बनाए रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: हिब्रू के व्यक्तिगत ईश्वरीय नाम को उपाधि से बदलने के बजाय देवनागरी में लिप्यंतरित किया गया है।
- source_word: אֹסְפָה
  choice: मैं ... इकट्ठा करूँगा
  rationale: אָסַף का सामान्य अर्थ बिखरे या अलग हुए लोगों को इकट्ठा करना है और यहाँ पुनर्स्थापना के प्रसंग में उपयुक्त है।
- source_word: הַצֹּלֵעָה
  choice: लँगड़ानेवालों
  rationale: हिब्रू स्त्रीलिंग एकवचन कृदंत का यहाँ सामूहिक बल है; हिन्दी बहुवचन समूह को स्वाभाविक ढंग से व्यक्त करता है और क्रिया की सक्रिय अवस्था भी बनाए रखता है।
- source_word: וְהַנִּדָּחָה
  choice: जिन्हें दूर भगा दिया गया है
  rationale: נדח का निष्क्रिय भाव केवल बिखरने का नहीं, बल्कि दूर खदेड़े या निर्वासित किए जाने का है; यह अनुवाद उस बल को स्पष्ट रखता है।
- source_word: אֲקַבֵּצָה
  choice: उन्हें मैं एकत्र करूँगा
  rationale: קבץ भी एक साथ लाने को व्यक्त करता है; ‘एकत्र’ पहले प्रयुक्त ‘इकट्ठा’ से हल्का शब्दगत भेद बनाए रखता है।
- source_word: וַאֲשֶׁר
  choice: और जिन्हें
  rationale: यह पिछले समूह के साथ एक और पीड़ित समूह को जोड़ता है; हिन्दी में संबंधवाचक संरचना मूल की खुली समन्वयी बनावट बनाए रखती है।
- source_word: הֲרֵעֹתִי
  choice: मैंने दुःख दिया है
  rationale: רעע के हिफ़ील रूप में विपत्ति या क्लेश पहुँचाने का कारक अर्थ और प्रथम पुरुष में ईश्वरीय कर्तृत्व स्पष्ट है; यह रूप उसे नरम किए बिना हिन्दी में स्वाभाविक है।
theological_decisions:
- issue: ‘जिन्हें मैंने दुःख दिया है’ में ईश्वरीय कर्तृत्व
  choice: 'प्रथम पुरुष में स्पष्ट कर्तृत्व बनाए रखा गया: ‘जिन्हें मैंने दुःख दिया है।’'
  alternative: ‘जिन्हें दुःख उठाना पड़ा है’ या ‘जिन्हें मैंने दुःख में पड़ने दिया है।’
  rationale: हिब्रू का प्रथम पुरुष एकवचन हिफ़ील रूप स्वयं याहवे को पूर्व क्लेश का कर्ता बताता है। न्याय के बाद पुनर्स्थापना की इस धर्मवैज्ञानिक कसक को अनुवाद में नरम नहीं किया गया।
- issue: अंतिम संबंधवाचक खंड का संबंध
  choice: ‘और जिन्हें मैंने दुःख दिया है’ को जोड़े गए समूह के रूप में खुला रखा गया है।
  alternative: इसे केवल ‘दूर भगाए गए’ लोगों का वर्णन मानना।
  rationale: וַאֲשֶׁר की समन्वयी-संबंधवाचक रचना एक अतिरिक्त समूह अथवा पिछले समूह का विस्तृत वर्णन—दोनों की गुंजाइश रख सकती है; हिन्दी वाक्य मूल की इस सीमा को अनावश्यक रूप से निश्चित नहीं करता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, भविष्यद्वाणी की गरिमा बनाए रखते हुए रखी गई है। समूहों के लिए स्वाभाविक बहुवचन प्रयोग हुआ है, जबकि पादटिप्पणी मूल के सामूहिक स्त्रीलिंग एकवचन को बताती है। ‘इकट्ठा’ और ‘एकत्र’ मूल की दो निकटार्थी क्रियाओं के बीच हल्का भेद सुरक्षित रखते हैं।
