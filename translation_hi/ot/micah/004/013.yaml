  text: ק֧וּמִי וָ/ד֣וֹשִׁי בַת צִיּ֗וֹן כִּֽי קַרְנֵ֞/ךְ אָשִׂ֤ים בַּרְזֶל֙ וּ/פַרְסֹתַ֨יִ/ךְ֙ אָשִׂ֣ים נְחוּשָׁ֔ה וַ/הֲדִקּ֖וֹת עַמִּ֣ים רַבִּ֑ים וְ/הַחֲרַמְתִּ֤י לַֽ/יהוָה֙ בִּצְעָ֔/ם וְ/חֵילָ֖/ם לַ/אֲד֥וֹן כָּל הָ/אָֽרֶץ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/004/013.yaml
  text: Rise and thresh[a], daughter Zion, for I will make your horn iron, and I will make your hooves bronze; you will crush many peoples, and I will devote their gain to Yahweh[b], and their wealth to the Lord of all the earth.
translation:
  language: hi
  text: हे सिय्योन की बेटी, उठ और दाँव[a], क्योंकि मैं तेरे सींग को लोहे का और तेरे खुरों को काँसे का कर दूँगा। तू बहुत-से लोगों को चूर कर देगी; मैं उनके लाभ[b] को यहोवा के लिए और उनकी संपत्ति को सारी पृथ्वी के प्रभु के लिए अर्पित[c] कर दूँगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात अनाज को खलिहान में पैरों से रौंदकर दाँवने के समान; इसका अर्थ ‘रौंद’ भी हो सकता है।
    reason: metaphor_clarification
  - marker: b
    text: या “उनकी लूट” अथवा “उनकी अनुचित कमाई”; इब्रानी शब्द लाभ को सूचित करता है और कभी लोभ या अन्याय से पाए लाभ की छाया रखता है।
    reason: lexical_alternative
  - marker: c
    text: या “प्रतिबंध के अधीन कर दूँगा”; इब्रानी क्रिया का अर्थ किसी वस्तु को परमेश्वर के लिए समर्पित करना है, और कई संदर्भों में उसमें विनाश के लिए अलग कर देने का भाव भी होता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ק֧וּמִי וָד֣וֹשִׁי
  choice: उठ और दाँव
  rationale: दोनों स्त्रीलिंग एकवचन आज्ञार्थक रूप सिय्योन को संबोधित करते हैं। ‘दाँव’ अनाज को पैरों से रौंदकर अलग करने की मूल कृषि-उपमा को बनाए रखता है।
- source_word: בַת צִיּ֗וֹן
  choice: हे सिय्योन की बेटी
  rationale: सिय्योन/यरूशलेम का मानवीकरण है; ‘हे’ संबोधन को हिंदी में स्पष्ट और स्वाभाविक बनाता है।
- source_word: קַרְנֵ֞ךְ
  choice: तेरे सींग
  rationale: सींग शक्ति और आक्रमण-सामर्थ्य का बाइबलीय रूपक है; इसे ‘शक्ति’ कहकर व्याख्यायित नहीं किया गया।
- source_word: בַּרְזֶל֙ ... נְחוּשָׁ֔ה
  choice: लोहे का ... काँसे का
  rationale: मजबूती और विजय की धातु-संबंधी छवि को सीधे बनाए रखता है; נְחוּשָׁה के लिए संदर्भानुकूल ‘काँसा’ चुना गया।
- source_word: וּפַרְסֹתַ֨יִךְ֙
  choice: तेरे खुरों
  rationale: रौंदकर दाँवने वाले पशु की छवि को सुरक्षित रखता है और ‘सींग’ के पशु-रूपक से संगत है।
- source_word: וַהֲדִקּ֖וֹת
  choice: चूर कर देगी
  rationale: क्रिया कुचलने अथवा टुकड़े-टुकड़े करने का प्रबल अर्थ देती है; यह दाँवने की उपमा के अनुरूप है।
- source_word: עַמִּ֣ים רַבִּ֑ים
  choice: बहुत-से लोगों
  rationale: עַמִּים बहुवचन जनसमुदायों को सूचित करता है; आधुनिक हिंदी में यह ‘बहुत-सी जातियों’ की अपेक्षा अधिक सहज है, यद्यपि सामूहिक अर्थ बना रहता है।
- source_word: וְהַחֲרַמְתִּ֤י
  choice: अर्पित कर दूँगा
  rationale: यहाँ वस्तुएँ लाभ और संपत्ति हैं; अतः प्रभु के लिए अलग कर समर्पित करने का भाव मुख्य पाठ में व्यक्त किया गया, जबकि विनाशार्थक ‘प्रतिबंध’ की संभावना पादटिप्पणी में रखी गई है।
- source_word: בִּצְעָ֔ם
  choice: उनके लाभ
  rationale: בצע लाभ, कमाई या लूट का अर्थ दे सकता है और कभी लोभ-अन्याय की नकारात्मक छाया रखता है। मूल की अस्पष्टता बचाने के लिए मुख्य पाठ में तटस्थ ‘लाभ’ रखा गया है।
- source_word: וְחֵילָ֖ם
  choice: उनकी संपत्ति
  rationale: חיל सामर्थ्य, संसाधन अथवा धन-संपत्ति हो सकता है। ‘लाभ’ के समानांतर और अर्पण के प्रसंग में ‘संपत्ति’ सर्वाधिक उपयुक्त है।
- source_word: לַֽיהוָה֙ ... לַאֲד֥וֹן כָּל־הָאָֽרֶץ
  choice: यहोवा के लिए ... सारी पृथ्वी के प्रभु के लिए
  rationale: दिव्य नाम יהוה को ‘यहोवा’ और אדון को ‘प्रभु’ देकर मूल में उपस्थित नाम और उपाधि का भेद बनाए रखा गया है।
theological_decisions:
- issue: युद्ध-विजय के संदर्भ में חרם का अर्थ
  choice: मैं ... अर्पित कर दूँगा
  alternative: मैं ... प्रतिबंध के अधीन कर दूँगा / पूर्णतः नष्ट कर दूँगा
  rationale: क्रिया में परमेश्वर के लिए अलग करने का अर्थ है, जिसमें कई प्रसंगों में विनाश भी निहित होता है। यहाँ प्रत्यक्ष कर्म लोगों के बजाय उनका लाभ और संपत्ति हैं, इसलिए मुख्य पाठ में समर्पण का अर्थ उपयुक्त है; कठोर तकनीकी अर्थ पादटिप्पणी में सुरक्षित है।
- issue: בצע की नैतिक छाया
  choice: उनके लाभ
  alternative: उनकी अनुचित कमाई / उनकी लूट
  rationale: शब्द में लोभ या अन्याय से पाए लाभ का अर्थ हो सकता है, पर इस पद में यह विशेषण स्पष्ट रूप से नहीं दिया गया। इसलिए नैतिक निष्कर्ष को मुख्य पाठ पर आरोपित न करके विकल्प पादटिप्पणी में रखा गया है।
- issue: क्रियाओं के कर्ता में परिवर्तन
  choice: तू लोगों को चूर करेगी; मैं उनकी संपत्ति अर्पित कर दूँगा
  alternative: तू लोगों को चूर करेगी और उनकी संपत्ति अर्पित करेगी
  rationale: 'मसोरेटिक पाठ में וַהֲדִקּוֹת स्त्रीलिंग द्वितीय पुरुष है, जबकि וְהַחֲרַמְתִּי प्रथम पुरुष है। इस तनाव को ज्यों का त्यों रखा गया है: विजय सिय्योन करती है, अर्पण वक्ता परमेश्वर करता है।'
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और मौखिक पाठ के अनुकूल रखी गई है। ‘तेरे/तू’ का प्रयोग स्त्रीरूप सिय्योन के एकवचन संबोधन को स्पष्ट करता है। मुख्य पाठ में कृषि और पशु-संबंधी संयुक्त रूपक—दाँवना, सींग और खुर—सुरक्षित रखा गया है।
