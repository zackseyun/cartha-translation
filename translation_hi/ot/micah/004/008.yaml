source:
  edition: WLC
  text: וְ/אַתָּ֣ה מִגְדַּל עֵ֗דֶר עֹ֛פֶל בַּת צִיּ֖וֹן עָדֶ֣י/ךָ תֵּאתֶ֑ה וּ/בָאָ֗ה הַ/מֶּמְשָׁלָה֙ הָ/רִ֣אשֹׁנָ֔ה מַמְלֶ֖כֶת לְ/בַ֥ת יְרוּשָׁלִָֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/004/008.yaml
  text: And you[a], tower of the flock, hill of daughter Zion—to you it will come, yes, the former dominion will come[c][b], the kingdom of the daughter of Jerusalem.
translation:
  language: hi
  text: और तू, हे झुंड की मीनार[a], हे सिय्योन की बेटी की पहाड़ी[b], तेरे पास वह आएगी; हाँ, पहले की राजसत्ता आएगी[c]—यरूशलेम की बेटी के लिए राज्य।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मिग्दल-एदेर” (एक स्थान-नाम); संभवतः “झुंड की निगरानी-मीनार” भी।
    reason: alternative_reading
  - marker: b
    text: या, “सिय्योन की बेटी का ओपेल,” यदि ‘ओपेल’ को सामान्य संज्ञा ‘पहाड़ी’ के बजाय स्थान-नाम माना जाए।
    reason: alternative_reading
  - marker: c
    text: “पहले की राजसत्ता” संभवतः यरूशलेम की पुरानी राजसत्ता की पुनर्स्थापना की ओर संकेत करती है।
    reason: cross_reference
lexical_decisions:
- source_word: מִגְדַּל עֵדֶר
  choice: झुंड का गुम्मट
  rationale: इब्रानी रचना का शाब्दिक अर्थ झुंड का गुम्मट है। ‘गुम्मट’ ऊँची निगरानी-मीनार का भाव देता है और भविष्यद्वाणी के स्थलात्मक बिंब को बनाए रखता है; संभावित स्थान-नाम पादटिप्पणी में रखा गया है।
- source_word: עֹפֶל
  choice: पहाड़ी
  rationale: यह शब्द उभरी हुई पहाड़ी या टीले को सूचित कर सकता है और यरूशलेम में ‘ओपेल’ स्थान-नाम भी हो सकता है। मुख्य पाठ में सहज स्थलात्मक अर्थ रखा गया है।
- source_word: בַּת צִיּוֹן
  choice: सिय्योन की बेटी
  rationale: नगर के स्त्रीरूप मानवीकरण को बनाए रखने के लिए ‘बेटी’ रूपक सुरक्षित रखा गया है।
- source_word: עָדֶיךָ
  choice: तेरे पास
  rationale: दिशा और गंतव्य का भाव स्वाभाविक हिन्दी में ‘तेरे पास’ से व्यक्त होता है।
- source_word: תֵּאתֶה
  choice: वह आएगा
  rationale: क्रिया स्त्रीलिंग एकवचन है और आगे आने वाले ‘प्रभुत्व’ को पूर्वसूचित करती है। हिन्दी में ‘प्रभुत्व’ पुल्लिंग होने के कारण व्याकरणानुसार ‘वह आएगा’ रखा गया है।
- source_word: הַמֶּמְשָׁלָה הָרִאשֹׁנָה
  choice: पहले का प्रभुत्व
  rationale: ממשלה शासन या प्रभुत्व है और הראשונה यहाँ कालगत अर्थ में पहले का या पूर्वकालीन है। यह अनुवाद ‘प्रथम’ जैसे क्रमसूचक अर्थ को थोपे बिना पुराने शासन की पुनर्स्थापना का संकेत देता है।
- source_word: מַמְלֶכֶת לְבַת יְרוּשָׁלִָם
  choice: यरूशलेम की बेटी का राज्य
  rationale: खंड ‘प्रभुत्व’ के समानाधिकरण में राज्य/राजसत्ता को स्पष्ट करता है। ‘यरूशलेम की बेटी’ का मानवीकरण सुरक्षित रखा गया है; לְ का संबंध यहाँ स्वामित्व अथवा हित—दोनों की छाया रख सकता है।
theological_decisions:
- issue: आरम्भिक पदों को सामान्य स्थलात्मक उपाधियाँ माना जाए या निश्चित स्थान-नाम
  choice: मुख्य पाठ में ‘झुंड के गुम्मट’ और ‘सिय्योन की बेटी की पहाड़ी’
  alternative: ‘मिग्दल-एदेर’ और/या ‘सिय्योन की बेटी का ओपेल’
  rationale: इब्रानी शब्द सामान्य संज्ञाओं के रूप में स्पष्ट अर्थ रखते हैं, पर स्थान-नाम होने की वास्तविक संभावना भी है। अतः मुख्य पाठ में अर्थ और पादटिप्पणी में नाम सुरक्षित रखा गया है।
- issue: ‘पहले का प्रभुत्व’ को स्पष्टतः दाऊदी राजतंत्र कहना
  choice: मुख्य पाठ में केवल राजनीतिक-पुनर्स्थापनात्मक भाषा
  alternative: ‘पहले का दाऊदी प्रभुत्व’
  rationale: संदर्भ यरूशलेम की पुरानी राजसत्ता की बहाली की ओर संकेत करता है, पर इस पद में दाऊद का नाम नहीं है; इसलिए व्याख्यात्मक पहचान को पाठ में नहीं जोड़ा गया।
- issue: מַמְלֶכֶת לְבַת יְרוּשָׁלִָם में לְ का संबंध
  choice: ‘यरूशलेम की बेटी का राज्य’
  alternative: ‘यरूशलेम की बेटी के लिए राज्य’ अथवा ‘यरूशलेम की बेटी के पास राज्य’
  rationale: वाक्य में यह ‘पहले का प्रभुत्व’ का समानाधिकरण है। हिन्दी में ‘का राज्य’ संक्षिप्त और स्वाभाविक है, जबकि मूल के हित अथवा गंतव्य के भाव की संभावना को निर्णयपूर्वक समाप्त नहीं करता।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और काव्यात्मक हिन्दी। ‘हे’ संबोधन और एकवचन ‘तेरे’ से मूल का प्रत्यक्ष संबोधन बना रहता है। ‘गुम्मट’ निगरानी-मीनार के प्राचीन बिंब को संक्षेप में व्यक्त करता है। सभी वैकल्पिक स्थान-नाम पादटिप्पणियों में सुरक्षित हैं।
