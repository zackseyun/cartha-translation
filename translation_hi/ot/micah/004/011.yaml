id: MIC.4.11
reference: Micah 4:11
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/עַתָּ֛ה נֶאֶסְפ֥וּ עָלַ֖יִ/ךְ גּוֹיִ֣ם רַבִּ֑ים הָ/אֹמְרִ֣ים תֶּחֱנָ֔ף וְ/תַ֥חַז בְּ/צִיּ֖וֹן עֵינֵֽי/נוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/004/011.yaml
  text: And now many nations have gathered against you[a], saying, “Let her be defiled[b], and let our eyes look on Zion.”
translation:
  language: hi
  text: और अब बहुत-सी जातियाँ तेरे विरुद्ध इकट्ठी हो गई हैं। वे कहती हैं, “वह अशुद्ध हो जाए[a], और हमारी आँखें सिय्योन को देखें[b]!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “वह अपवित्र हो जाए।” इब्रानी क्रिया नैतिक अथवा धार्मिक रूप से अशुद्ध होने का अर्थ दे सकती है।
    reason: lexical_alternative
  - marker: b
    text: या “हमारी आँखें सिय्योन को निहारें।” इस कथन में जातियों की यह शत्रुतापूर्ण इच्छा व्यक्त होती है कि वे सिय्योन का अपमान देखें।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: और अब
  rationale: संयोजक ו और कालसूचक עַתָּה दोनों को रखते हुए प्रसंग में आए मोड़ को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: נֶאֶסְפוּ עָלַיִךְ
  choice: तेरे विरुद्ध इकट्ठी हो गई हैं
  rationale: निफ़अल पूर्ण क्रिया ऐसे एकत्र होने को बताती है जिसका परिणाम वर्तमान में सामने है; शत्रुतापूर्ण प्रसंग में עַל का अर्थ ‘विरुद्ध’ है।
- source_word: גּוֹיִם רַבִּים
  choice: बहुत-सी जातियाँ
  rationale: यहाँ גּוֹיִם अनेक राजनीतिक-जातीय समुदायों को सूचित करता है; ‘जातियाँ’ परिचित बाइबलीय हिन्दी है और ‘बहुत-सी’ स्त्रीलिंग सामंजस्य रखता है।
- source_word: תֶּחֱנָף
  choice: वह अशुद्ध हो जाए
  rationale: חנף का यह रूप नैतिक या धार्मिक अशुद्धता/अपवित्रीकरण का भाव दे सकता है। स्त्रीलिंग ‘वह’ सिय्योन/यरूशलेम की ओर संकेत करता और मूल के पुरुष-वचन से स्त्रीलिंग तृतीय-पुरुष कथन के बदलाव को बचाता है।
- source_word: וְתַחַז בְּצִיּוֹן עֵינֵינוּ
  choice: और हमारी आँखें सिय्योन को देखें
  rationale: शरीर-अंग वाले मूल मुहावरे ‘हमारी आँखें’ को बनाए रखता है। חזה यहाँ देखने को बताता है, जबकि संदर्भ इसे सिय्योन के अपमान को देखने की शत्रुतापूर्ण इच्छा बनाता है।
theological_decisions:
- issue: उद्धृत वचन में स्त्रीलिंग एकवचन का संदर्भ
  choice: ‘वह’ रखकर सिय्योन/यरूशलेम को स्त्रीलिंग तृतीय पुरुष में संदर्भित किया गया है
  alternative: प्रत्यक्ष संबोधन की एकरूपता के लिए ‘तू’ कहना
  rationale: इब्रानी में पहले नगर को स्त्रीलिंग ‘तू’ कहकर संबोधित किया गया है, पर जातियों के कथन में स्त्रीलिंग तृतीय-पुरुष क्रिया आती है। इस तनाव को समतल नहीं किया गया।
- issue: חנף में अशुद्धता का स्वरूप
  choice: ‘अशुद्ध हो जाए’
  alternative: ‘अपवित्र हो जाए’
  rationale: मूल क्रिया नैतिक अथवा धार्मिक अशुद्धता दोनों का भाव दे सकती है। ‘अशुद्ध’ इस व्यापकता को अपेक्षाकृत सुरक्षित रखता है, जबकि पादटिप्पणी विकल्प स्पष्ट करती है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध हिन्दी। सिय्योन के लिए पारंपरिक वर्तनी रखी गई है। मुख्य वाक्य में ‘तेरे’ का प्रयोग नगर के एकवचन स्त्रीलिंग संबोधन को बनाए रखता है; उद्धरण में ‘वह’ मूल के दृष्टिकोण-परिवर्तन को दर्शाता है।
