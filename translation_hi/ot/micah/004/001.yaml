source:
  edition: WLC
  text: וְ/הָיָ֣ה בְּ/אַחֲרִ֣ית הַ/יָּמִ֗ים יִ֠הְיֶה הַ֣ר בֵּית יְהוָ֤ה נָכוֹן֙ בְּ/רֹ֣אשׁ הֶ/הָרִ֔ים וְ/נִשָּׂ֥א ה֖וּא מִ/גְּבָע֑וֹת וְ/נָהֲר֥וּ עָלָ֖י/ו עַמִּֽים׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/004/001.yaml
  text: And it will happen in the latter days that the mountain of the house of Yahweh will be established as the chief of the mountains[a], and it will be lifted up above the hills[c][b], and peoples will stream to it.
translation:
  language: hi
  text: और आने वाले दिनों में ऐसा होगा कि यहोवा के भवन का पर्वत, पर्वतों के शिखर पर दृढ़ता से स्थापित होगा[a]; वह पहाड़ियों से ऊँचा उठाया जाएगा, और विभिन्न जातियों के लोग धारा के समान उसकी ओर उमड़ेंगे[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “अंतिम दिनों में।” “पर्वतों के शिखर पर” का अर्थ पर्वतों में सर्वोच्च स्थान या प्रमुखता भी हो सकता है।
    reason: alternative_reading
  - marker: b
    text: मूल भाषा की क्रिया लोगों के नदी की धारा की तरह बहकर आने का चित्र प्रस्तुत करती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: और ... ऐसा होगा
  rationale: यह भविष्य की भविष्यवाणी संबंधी परिस्थिति का स्वाभाविक और गरिमापूर्ण परिचय देता है।
- source_word: בְּאַחֲרִית הַיָּמִים
  choice: आने वाले दिनों में
  rationale: इब्रानी पदबंध भविष्य के दिनों अथवा अंतिम दिनों की ओर संकेत कर सकता है; यह चुनाव किसी विशिष्ट युगांत-सिद्धांत को आरोपित किए बिना उसके खुले अर्थ को बनाए रखता है।
- source_word: הַר בֵּית יְהוָה
  choice: यहोवा के भवन का पर्वत
  rationale: यह इब्रानी संबंध-रचना को स्पष्ट रूप से व्यक्त करता और पर्वत को यहोवा के भवन से संबद्ध रखता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: परमेश्वर के विशिष्ट इब्रानी नाम को हिन्दी में प्रचलित रूप से लिप्यंतरित किया गया है।
- source_word: נָכוֹן
  choice: दृढ़ता से स्थापित होगा
  rationale: यह शब्द स्थिर, सुरक्षित और प्रतिष्ठित किए जाने का भाव देता है।
- source_word: בְּרֹאשׁ הֶהָרִים
  choice: पर्वतों के शिखर पर
  rationale: शाब्दिक स्थान-संबंधी बिंब को सुरक्षित रखता है; समानांतर पंक्ति के कारण इसमें सर्वोच्च प्रतिष्ठा का भाव भी बना रहता है।
- source_word: וְנִשָּׂא הוּא מִגְּבָעוֹת
  choice: वह पहाड़ियों से ऊँचा उठाया जाएगा
  rationale: निष्क्रिय रूप और पर्वत के ऊँचे किए जाने के स्थानिक तथा सम्मानसूचक दोनों आयाम सुरक्षित रहते हैं।
- source_word: וְנָהֲרוּ
  choice: धारा के समान ... उमड़ेंगे
  rationale: क्रिया लोगों के नदी की तरह बहने का असामान्य और सजीव बिंब प्रस्तुत करती है; हिन्दी में यह अभिव्यक्ति अर्थ और चित्र दोनों स्पष्ट करती है।
- source_word: עַמִּים
  choice: देश-देश के लोग
  rationale: यह अनेक जनसमूहों का संकेत देता है और केवल आधुनिक राजनीतिक राष्ट्रों तक अर्थ को सीमित नहीं करता।
- source_word: עָלָיו
  choice: उसकी ओर
  rationale: संदर्भ में सर्वनाम पर्वत को सूचित करता है और गति के साथ हिन्दी में 'उसकी ओर' स्वाभाविक है।
theological_decisions:
- issue: भविष्यसूचक काल-वाक्यांश का युगांत-संबंधी अर्थ
  choice: आने वाले दिनों में
  alternative: अंतिम दिनों में
  rationale: मूल वाक्यांश भविष्य के दिनों और चरम अंतिम काल—दोनों अर्थच्छायाएँ रख सकता है। मुख्य पाठ किसी विशिष्ट युगांत-व्यवस्था को निश्चित नहीं करता; वैकल्पिक अर्थ पादटिप्पणी में दिया गया है।
- issue: पर्वत के ऊँचे किए जाने का स्वरूप
  choice: स्थानिक और प्रतिष्ठासूचक बिंब दोनों को खुला रखा गया है
  alternative: केवल भौतिक ऊँचाई अथवा केवल प्रतीकात्मक सर्वोच्चता
  rationale: मूल कविता भौगोलिक ऊँचाई और प्रमुखता के अर्थों को साथ रख सकती है; अनुवाद इनमें से किसी एक को निर्णायक नहीं बनाता।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण भविष्यसूचक शैली अपनाई गई है। काव्यात्मक बिंबों को स्पष्ट रखते हुए अत्यधिक संस्कृतनिष्ठ या सांप्रदायिक शब्दावली से बचा गया है।
