reference: Micah 4:4
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/יָשְׁב֗וּ אִ֣ישׁ תַּ֧חַת גַּפְנ֛/וֹ וְ/תַ֥חַת תְּאֵנָת֖/וֹ וְ/אֵ֣ין מַחֲרִ֑יד כִּי פִ֛י יְהוָ֥ה צְבָא֖וֹת דִּבֵּֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/004/004.yaml
  text: And each will sit under his vine and under his fig tree[a], and there will be no one to make them afraid[b], for the mouth of Yahweh of Armies has spoken.
translation:
  language: hi
  text: हर एक जन अपनी दाखलता और अपने अंजीर के पेड़ के नीचे बैठेगा,[a] और कोई उन्हें भयभीत न करेगा, क्योंकि सेनाओं का यहोवा के मुख ने कहा है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप में, “हर एक पुरुष अपनी दाखलता और अपने अंजीर के पेड़ के नीचे बैठेगा।” हिब्रू में पुल्लिंग एकवचन शब्द वितरक अर्थ में प्रयुक्त हुआ है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָשְׁבוּ
  choice: बैठेगा
  rationale: ישׁב का ठोस अर्थ ‘बैठना’ है; यहाँ यह शांति और निश्चिंत बसेरे का चित्र प्रस्तुत करता है। एकवचन हिंदी क्रिया वितरक ‘हर एक जन’ के अनुरूप है।
- source_word: אִישׁ
  choice: हर एक जन
  rationale: एकवचन אִישׁ बहुवचन क्रिया के साथ वितरक अर्थ देता है। ‘हर एक जन’ इस अर्थ को स्वाभाविक हिंदी में व्यक्त करता है, जबकि मूल के व्यक्ति-दर-व्यक्ति बल को बनाए रखता है।
- source_word: תַּחַת גַּפְנוֹ וְתַחַת תְּאֵנָתוֹ
  choice: अपनी दाखलता और अपने अंजीर के पेड़ के नीचे
  rationale: शाब्दिक कृषि-बिंब सुरक्षित रखा गया है; यह निजी सुरक्षा, शांति और समृद्धि का पारंपरिक चित्र है।
- source_word: וְאֵין מַחֲרִיד
  choice: और कोई उन्हें भयभीत न करेगा
  rationale: מַחֲרִיד भय या कंपकंपी उत्पन्न करने वाले व्यक्ति को सूचित करता है। ‘उन्हें’ वितरक समूह की ओर संकेत करता है और हिंदी में सहज है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यह प्रतिज्ञा के आधार और उसकी निश्चितता का कारण प्रस्तुत करता है।
- source_word: פִּי יְהוָה צְבָאוֹת
  choice: सेनाओं के यहोवा के मुख
  rationale: פִּי का ‘मुख’ बनाए रखने से ईश्वरीय वचन की निश्चितता वाला हिब्रू मुहावरा सुरक्षित रहता है। יְהוָה को ‘यहोवा’ और צְבָאוֹת को पारदर्शी रूप से ‘सेनाओं के’ अनूदित किया गया है।
- source_word: דִּבֵּר
  choice: यह कहा है
  rationale: हिब्रू सिद्ध क्रिया घोषणा की पूर्णता और निश्चितता व्यक्त करती है। हिंदी में ‘कहा है’ गंभीर और स्वाभाविक है; ‘यह’ कथन की पूर्ववर्ती प्रतिज्ञा से कड़ी स्पष्ट करता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का रूप
  choice: यहोवा
  alternative: याहवे
  rationale: मूल में वाचा का व्यक्तिगत नाम सीधे आया है। हिंदी बाइबलीय प्रयोग में सुविदित ‘यहोवा’ नाम को पदवी ‘प्रभु’ से बदलने के बजाय नाम के रूप में सुरक्षित रखता है।
- issue: צְבָאוֹת का अर्थ
  choice: सेनाओं के
  alternative: सेनाओं का यहोवा / सर्वशक्तिमान यहोवा
  rationale: ‘सेनाओं के यहोवा’ हिब्रू संबंध-वाक्यांश को निकटता से रखता है और ‘सर्वशक्तिमान’ जैसी व्याख्यात्मक समानता से बचता है।
- issue: אִישׁ का प्रतिनिधिक लिंग
  choice: हर एक जन
  alternative: हर पुरुष
  rationale: इस संदर्भ में אִישׁ वितरक रूप से समुदाय के प्रत्येक व्यक्ति को सूचित करता है। ‘हर एक जन’ व्याकरणिक पुल्लिंग को अनावश्यक रूप से जैविक पुरुषों तक सीमित किए बिना मूल का व्यक्ति-दर-व्यक्ति अर्थ रखता है।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण किंतु सहज शैली रखी गई है। ‘दाखलता’ और ‘अंजीर का पेड़’ मूल के ठोस शांति-बिंब को सुरक्षित रखते हैं। वाक्य-विन्यास भविष्यसूचक आश्वासन की गंभीरता व्यक्त करता है।
