id: MIC.4.12
reference: Micah 4:12
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/הֵ֗מָּה לֹ֤א יָֽדְעוּ֙ מַחְשְׁב֣וֹת יְהוָ֔ה וְ/לֹ֥א הֵבִ֖ינוּ עֲצָת֑/וֹ כִּ֥י קִבְּצָ֖/ם כֶּ/עָמִ֥יר גֹּֽרְנָ/ה׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/004/012.yaml
  text: But they do not know the thoughts of Yahweh[a], and they do not understand his plan[b], for he has gathered them like sheaves to the threshing floor.
translation:
  language: hi
  text: पर वे याहवे के विचारों को नहीं जानते और न ही उसकी योजना[a] समझते हैं, क्योंकि उसने उन्हें पूलों के समान खलिहान में इकट्ठा किया है।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उसकी सलाह” अथवा “उसका उद्देश्य”।
    reason: lexical_alternative
  - marker: b
    text: मूल इब्रानी में “पूलों के समान खलिहान में” है—यह दँवाई के लिए फसल इकट्ठी करने का बिंब है और प्रसंग में न्याय की ओर संकेत करता है।
    reason: cultural_note
lexical_decisions:
- source_word: וְהֵמָּה
  choice: पर वे
  rationale: 'संदर्भ में विरोध का भाव है: राष्ट्र अपनी मंशा से इकट्ठे हुए हैं, पर वे याहवे की मंशा नहीं जानते। ‘पर वे’ इस भाव को स्वाभाविक हिन्दी में व्यक्त करता है।'
- source_word: יָדְעוּ
  choice: नहीं जानते
  rationale: इब्रानी पूर्ण रूप यहाँ उनकी वर्तमान अज्ञानता बताता है; इसलिए वर्तमानकालीन हिन्दी उपयुक्त है।
- source_word: מַחְשְׁבוֹת
  choice: विचारों
  rationale: यह शब्द विचार, इरादे या योजनाएँ दर्शा सकता है। ‘विचारों’ से इसके मूल अर्थ और अगले शब्द עֲצָה से भेद दोनों बने रहते हैं।
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत नाम को उपाधि से बदलने के बजाय हिन्दी में लिप्यंतरित किया गया है।
- source_word: הֵבִינוּ
  choice: समझते हैं
  rationale: यह क्रिया समझने या बूझने का भाव देती है; ‘समझते हैं’ आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: עֲצָתוֹ
  choice: उसकी योजना
  rationale: עֵצָה का अर्थ सलाह, योजना या उद्देश्य हो सकता है। यहाँ राष्ट्रों को इकट्ठा करने की ईश्वरीय मंशा के संदर्भ में ‘योजना’ सहज है, जबकि विकल्प पाद-टिप्पणी में सुरक्षित हैं।
- source_word: כִּי
  choice: क्योंकि
  rationale: यह आगे दिए गए कारण को प्रस्तुत करता है कि राष्ट्र याहवे की योजना को नहीं समझते।
- source_word: קִבְּצָם
  choice: उसने उन्हें ... इकट्ठा किया है
  rationale: एकवचन कर्ता संदर्भानुसार याहवे है और कर्म-प्रत्यय शत्रु राष्ट्रों को दर्शाता है। पूर्ण क्रिया को वर्तमान परिणाम वाले रूप में व्यक्त किया गया है।
- source_word: כֶּעָמִיר
  choice: पूलों के समान
  rationale: עָמִיר कटी हुई फसल के पूले या ढेर को दर्शाता है। ‘पूलों’ से खलिहान और दँवाई का कृषि-बिंब स्पष्ट रहता है।
- source_word: גֹּרְנָה
  choice: खलिहान में
  rationale: दिशासूचक रूप खलिहान की ओर ले जाकर वहाँ इकट्ठा करने का भाव देता है। हिन्दी में ‘खलिहान में इकट्ठा किया’ इस गंतव्य को स्वाभाविक ढंग से व्यक्त करता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में चतुरक्षरीय व्यक्तिगत नाम सीधे आया है। ‘याहवे’ उसका लिप्यंतरण है और उसे किसी उपाधि से नहीं बदलता।
- issue: ‘उसने उन्हें इकट्ठा किया’ के निहित कर्ता की पहचान
  choice: संदर्भानुसार कर्ता याहवे है
  alternative: कर्ता अनिर्दिष्ट है; सिय्योन कर्ता है
  rationale: निकटतम और प्रसंगानुकूल कर्ता याहवे है, जिसके विचार और योजना राष्ट्र नहीं समझते। फिर भी हिन्दी में केवल ‘उसने’ रखा गया है, जिससे मूल की व्याकरणिक संक्षिप्तता बनी रहती है।
- issue: खलिहान के बिंब में न्याय का भाव
  choice: मुख्य पाठ में केवल कृषि-बिंब रखा गया; न्याय का प्रसंगगत संकेत पाद-टिप्पणी में दिया गया
  alternative: मुख्य पाठ में ‘न्याय के लिए’ जोड़ना
  rationale: दँवाई और न्याय का संबंध प्रसंग से स्पष्ट होता है, पर ‘न्याय’ इस पद में प्रत्यक्ष शब्द नहीं है; इसलिए उसे मुख्य पाठ में जोड़ना मूल से अधिक स्पष्ट करना होता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सुबोध रखी गई है। ‘पूल’ और ‘खलिहान’ कृषि-बिंब को संक्षिप्त रूप से बनाए रखते हैं। परामर्श-पाठ में पाद-टिप्पणी चिह्नों का स्थान असंगत जान पड़ता था; स्रोत शब्दों के अनुसार [a] को ‘योजना’ और [b] को खलिहान के बिंब के बाद रखा गया है।
