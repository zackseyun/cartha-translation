base_translation:
  language: en
  yaml_path: translation/ot/micah/004/014.yaml
  text: Now muster yourself in troops[a], daughter of troops; a siege is set against us[c][b]. With a rod they strike the judge of Israel on the cheek.
translation:
  language: hi
  text: अब दलों में इकट्ठी हो[a], हे दलों की बेटी; हमारे विरुद्ध घेराबंदी कर दी गई है। वे छड़ी से इस्राएल के न्यायाधीश[c] के गाल पर मारते हैं[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अपने को घायल कर” अथवा “अपने शरीर पर चीरे लगा”; इब्रानी क्रिया का अर्थ दलों में जुटना या स्वयं को काटना—दोनों हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या, “वे मारेंगे”; इब्रानी अपूर्ण क्रिया को भविष्यसूचक संदर्भ में भविष्यकाल के रूप में भी समझा जा सकता है।
    reason: lexical_alternative
  - marker: c
    text: “इस्राएल का न्यायाधीश” सामान्य रूप से इस्राएल के शासक या अगुआ को सूचित कर सकता है; संदर्भ में कुछ व्याख्याकार इसमें मसीही पूर्वसंकेत भी देखते हैं।
    reason: alternative_reading
lexical_decisions:
- source_word: תִּתְגֹּדְדִי
  choice: दल बाँधकर इकट्ठी हो
  rationale: हित्पोलेल रूप के आत्मवाचक भाव और सैनिक संदर्भ—‘दल की बेटी’ तथा घेराबंदी—को ध्यान में रखते हुए सेना या दलों में जुटने का अर्थ मुख्य पाठ में लिया गया है। स्वयं को घायल करने का वैकल्पिक अर्थ पादटिप्पणी में सुरक्षित है।
- source_word: בַת גְּדוּד
  choice: दल की बेटी
  rationale: इब्रानी की ‘X की बेटी’ वाली सामुदायिक या नगरीय मानवीकरण-शैली को बनाए रखा गया है और גְּדוּד को सैनिक ‘दल’ के अर्थ में लिया गया है।
- source_word: מָצוֹר
  choice: घेरा
  rationale: यहाँ शब्द किसी नगर के विरुद्ध घेराबंदी की स्थिति को दर्शाता है; ‘घेरा’ सहज आधुनिक हिन्दी में वही सैनिक दबाव व्यक्त करता है, बिना घेराबंदी के साधनों को अनावश्यक रूप से विशिष्ट किए।
- source_word: שָׂם עָלֵינוּ
  choice: हमारे विरुद्ध ... डाल दिया गया है
  rationale: इब्रानी में क्रिया का कर्ता अनिर्दिष्ट है। हिन्दी का कर्मवाच्य उस अनिर्दिष्टता को बनाए रखता है।
- source_word: בַּשֵּׁבֶט
  choice: छड़ी से
  rationale: प्रहार के संदर्भ में שֵׁבֶט का ‘छड़ी’ अर्थ स्वाभाविक है। ‘राजदंड’ कहने से राजकीय प्रतीकवाद मूल पाठ की अपेक्षा अधिक उभर आता।
- source_word: יַכּוּ
  choice: मारते हैं
  rationale: अपूर्ण क्रिया को भविष्यसूचक वर्णन के सजीव वर्तमान के रूप में प्रस्तुत किया गया है। भविष्यकाल की वास्तविक संभावना पादटिप्पणी में दी गई है।
- source_word: עַל הַלְּחִי
  choice: गाल पर
  rationale: לְחִי का अर्थ गाल या जबड़ा हो सकता है; ‘गाल’ शासक के सार्वजनिक अपमान का भाव अधिक स्वाभाविक ढंग से व्यक्त करता है।
- source_word: שֹׁפֵט יִשְׂרָאֵל
  choice: इस्राएल का न्यायी
  rationale: שׁפט से बने पद का निकट और गैर-व्याख्यात्मक अनुवाद ‘न्यायी’ है। संदर्भ में यह व्यापक रूप से शासक या अगुआ को सूचित कर सकता है, पर मुख्य पाठ उस अर्थ को निर्णायक नहीं बनाता।
theological_decisions:
- issue: ‘इस्राएल के न्यायी’ का संभावित मसीही महत्त्व
  choice: मुख्य पाठ में गैर-व्याख्यात्मक ‘इस्राएल का न्यायी’ रखा गया है।
  alternative: इसे यहूदा के तत्कालीन राजा या शासक के रूप में स्पष्ट करना, अथवा आने वाले मसीह का संकेत मानकर अनुवाद करना।
  rationale: तात्कालिक प्रसंग इस्राएल/यहूदा के अगुआ की घेराबंदी और अपमान की बात करता है। अगले पद के कारण कुछ पाठक इसमें मसीही पूर्वसंकेत देखते हैं, पर यह पद स्वयं उस पहचान को स्पष्ट नहीं करता। इसलिए अनुवाद धर्मवैज्ञानिक तनाव को खुला रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘दल की बेटी’ जैसे इब्रानी मानवीकरण तथा ‘न्यायी’ जैसे निकट स्रोतगत पद को जानबूझकर सुरक्षित रखा गया है; वाक्य की सैनिक शब्द-क्रीड़ा बनाए रखने के लिए ‘दल बाँधकर’ और ‘दल की बेटी’ साथ रखे गए हैं।
