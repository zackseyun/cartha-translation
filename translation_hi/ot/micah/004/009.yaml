language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: עַתָּ֕ה לָ֥/מָּה תָרִ֖יעִי רֵ֑עַ הֲ/מֶ֣לֶךְ אֵֽין בָּ֗/ךְ אִֽם יוֹעֲצֵ/ךְ֙ אָבָ֔ד כִּֽי הֶחֱזִיקֵ֥/ךְ חִ֖יל כַּ/יּוֹלֵדָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/004/009.yaml
  text: Why do you cry out so loudly? Is there no king in you? Has your counselor perished[c][b][a], that labor pains have seized you like a woman giving birth?
translation:
  language: hi
  text: अब तू क्यों इतनी ज़ोर से पुकार रही है?[a] क्या तुझमें कोई राजा नहीं है?[b] क्या तेरा सलाहकार नष्ट हो गया है कि प्रसव-पीड़ा ने तुझे प्रसव करती स्त्री की तरह जकड़ लिया है?[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “ऊँची आवाज़ में चिल्ला रही है?” इब्रानी अभिव्यक्ति ज़ोरदार पुकार या चीत्कार का बोध करा सकती है; यहाँ संदर्भ दुःखभरी पुकार की ओर संकेत करता है।
    reason: lexical_alternative
  - marker: b
    text: 'शाब्दिक रूप के निकट: “क्या तुझमें राजा नहीं है?” इसका अर्थ “क्या तेरा कोई राजा नहीं है?” भी समझा जा सकता है।'
    reason: lexical_alternative
  - marker: c
    text: या, “पकड़ लिया है” अथवा “अपनी गिरफ्त में ले लिया है।”
    reason: lexical_alternative
lexical_decisions:
- source_word: עַתָּה לָמָּה
  choice: अब ... क्यों
  rationale: עַתָּה स्पष्ट कालवाचक/संक्रमणसूचक शब्द है; ‘अब’ उसे बनाए रखता है, और לָמָּה का प्रश्नार्थक बल ‘क्यों’ से व्यक्त होता है।
- source_word: תָרִיעִי רֵעַ
  choice: इतनी ज़ोर से पुकार रही है
  rationale: क्रिया और उसके साथ प्रयुक्त संज्ञा ऊँची, तीव्र पुकार का भाव देते हैं। स्त्रीलिंग ‘रही है’ सिय्योन/यरूशलेम को स्त्री के रूप में संबोधित किए जाने को बिना उसका नाम जोड़े सुरक्षित रखता है।
- source_word: הֲמֶלֶךְ אֵין בָּךְ
  choice: क्या तुझमें कोई राजा नहीं है?
  rationale: ‘तुझमें’ मूल के בָּךְ को बनाए रखता है और वाक्य को केवल स्वामित्व के अर्थ में बदलने से बचाता है।
- source_word: יוֹעֲצֵךְ
  choice: तेरा सलाहकार
  rationale: יעץ से बना रूप सलाह देनेवाले व्यक्ति को दर्शाता है; आधुनिक हिन्दी में ‘सलाहकार’ सीधा और सहज है।
- source_word: אָבָד
  choice: नष्ट हो गया है
  rationale: यह क्रिया खो जाने, मिट जाने या नष्ट हो जाने का बोध करा सकती है। ‘नष्ट हो गया’ उसके तीखे भाव को रखता है, पर मृत्यु की विधि नहीं जोड़ता।
- source_word: חִיל
  choice: प्रसव-पीड़ा
  rationale: जननेवाली स्त्री से की गई अगली तुलना के कारण यहाँ सामान्य व्यथा नहीं, प्रसव की पीड़ा अभिप्रेत है।
- source_word: הֶחֱזִיקֵךְ
  choice: तुझे ... जकड़ लिया है
  rationale: हिफ़ील रूप बलपूर्वक पकड़ लेने का भाव देता है; ‘जकड़ लिया’ पीड़ा की तीव्रता को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: כַּיּוֹלֵדָה
  choice: जननेवाली स्त्री के समान
  rationale: कृदंत उस स्त्री को दर्शाता है जो बच्चे को जन्म दे रही है; यह अनुवाद मूल बिंब को स्पष्ट रूप से सुरक्षित रखता है।
theological_decisions:
- issue: सिय्योन/यरूशलेम का स्त्री के रूप में मानवीकरण
  choice: स्त्रीलिंग क्रिया और प्रसव के बिंब द्वारा संकेत को सुरक्षित रखा गया, पर संबोधित स्त्री की पहचान पद में अलग से नहीं जोड़ी गई।
  alternative: मुख्य पाठ में ‘सिय्योन की बेटी’ या ‘यरूशलेम’ जोड़ना।
  rationale: मूल पद संबोधित पात्र का नाम नहीं देता, यद्यपि स्त्रीलिंग रूप और संदर्भ उसकी ओर संकेत करते हैं। नाम जोड़ने से निहित पहचान स्पष्ट व्याख्या में बदल जाती।
- issue: ‘तुझमें राजा’ वाक्यांश का अर्थ
  choice: असामान्य स्थानगत अभिव्यक्ति ‘तुझमें’ को बनाए रखा गया।
  alternative: ‘क्या तेरा कोई राजा नहीं है?’
  rationale: मूल भाषा स्वामित्व मात्र नहीं, ‘तेरे भीतर/बीच’ का रूप रखती है। इसे बनाए रखने से राजकीय उपस्थिति और नगर के सामुदायिक व्यक्तित्व के बीच की अर्थ-समृद्धि सुरक्षित रहती है।
- issue: כִּי द्वारा जुड़े अंतिम प्रश्न का संबंध
  choice: ‘जो’ के द्वारा पिछली आलंकारिक पूछताछ से जोड़ा गया।
  alternative: ‘क्योंकि’ से कारणसूचक कथन बनाना, अथवा नया स्वतंत्र प्रश्न बनाना।
  rationale: यहाँ כִּי उस परिस्थिति को सामने लाता है जिससे प्रसव-पीड़ा जैसी दशा उत्पन्न हुई; ‘जो’ हिन्दी में प्रश्नों की परस्पर संबद्धता और मूल की संभावित कारणात्मक छाया दोनों को बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘तू/तेरा/तुझे’ एकवचन स्त्रीरूप में मानवीकृत नगर को संबोधन व्यक्त करते हैं; यहाँ यह अनादर नहीं, काव्यात्मक प्रत्यक्ष संबोधन है। ‘अब’ को עַתָּה के स्पष्ट स्रोत-साक्ष्य के कारण रखा गया है।
