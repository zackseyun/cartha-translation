  text: ח֧וּלִי וָ/גֹ֛חִי בַּת צִיּ֖וֹן כַּ/יּֽוֹלֵדָ֑ה כִּֽי עַתָּה֩ תֵצְאִ֨י מִ/קִּרְיָ֜ה וְ/שָׁכַ֣נְתְּ בַּ/שָּׂדֶ֗ה וּ/בָ֤את עַד בָּבֶל֙ שָׁ֣ם תִּנָּצֵ֔לִי שָׁ֚ם יִגְאָלֵ֣/ךְ יְהוָ֔ה מִ/כַּ֖ף אֹיְבָֽיִ/ךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/micah/004/010.yaml
  text: Writhe and groan[a], daughter Zion, like a woman giving birth; for now you will go out from the city and dwell in the field, and you will go as far as Babylon. There you will be rescued[b]; there Yahweh will redeem you from the hand of your enemies.
translation:
  language: hi
  text: तड़प और कराह[a], हे सिय्योन की बेटी, प्रसव करती स्त्री के समान; क्योंकि अब तू नगर से निकलकर मैदान में रहेगी और बाबेल तक जाएगी। वहीं तू बचाई जाएगी[b]; वहीं याहवे तुझे तेरे शत्रुओं के हाथ से छुड़ाएगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘चिल्ला उठ।’ हिब्रू क्रिया पीड़ा में निकली पुकार भी व्यक्त कर सकती है, जो प्रसव के बिंब के अनुकूल है।
    reason: lexical_alternative
  - marker: b
    text: या ‘वहीं तेरा छुटकारा होगा।’
    reason: lexical_alternative
lexical_decisions:
- source_word: ח֧וּלִי
  choice: तड़प
  rationale: स्त्रीलिंग एकवचन आज्ञार्थक क्रिया प्रसव के संदर्भ में शारीरिक ऐंठन और पीड़ा व्यक्त करती है; ‘तड़प’ आधुनिक हिन्दी में इस बिंब को स्वाभाविक रूप से रखता है।
- source_word: וָ/גֹ֛חִי
  choice: और कराह
  rationale: यह पीड़ा में निकली आवाज़ का सूचक है। ‘कराह’ प्रसव के बिंब के अनुकूल है, जबकि ‘चिल्ला उठ’ को पादटिप्पणी में वास्तविक वैकल्पिक अर्थ के रूप में रखा गया है।
- source_word: בַּת צִיּוֹן
  choice: हे सिय्योन की बेटी
  rationale: यह सिय्योन/यरूशलेम का मानवीकरण है। सम्बोधनसूचक ‘हे’ हिन्दी में आज्ञाओं को स्पष्ट और गरिमापूर्ण बनाता है।
- source_word: כַּ/יּֽוֹלֵדָה
  choice: प्रसव करती स्त्री के समान
  rationale: हिब्रू उपमा स्पष्ट रूप से जन्म देती हुई स्त्री की है; अनुवाद उसी प्रसव-बिंब को बनाए रखता है।
- source_word: מִ/קִּרְיָה
  choice: नगर से
  rationale: संदर्भ में निश्चित नगर सिय्योन/यरूशलेम है; ‘नगर’ गरिमापूर्ण और सामान्य आधुनिक हिन्दी है।
- source_word: וְ/שָׁכַ֣נְתְּ בַּ/שָּׂדֶ֗ה
  choice: मैदान में बसेगी
  rationale: שׁכן रहने या बसने और שׂדה खुले ग्रामीण क्षेत्र/मैदान को दर्शाता है। ‘खुले’ जैसा अतिरिक्त विशेषण जोड़े बिना मूल अर्थ रखा गया है।
- source_word: וּ/בָ֤את עַד בָּבֶל֙
  choice: और बाबेल तक जाएगी
  rationale: עַד गंतव्य की सीमा पर बल देता है; ‘तक जाएगी’ उसी बल और गति को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: שָׁ֣ם תִּנָּצֵ֔לִי
  choice: वहीं तू बचाई जाएगी
  rationale: נצל का निफ़अल रूप संकट से निष्क्रिय रूप में बचाए जाने को व्यक्त करता है। यह आगे आने वाले גאל से शब्दगत भेद भी बनाए रखता है।
- source_word: יִגְאָלֵ֣/ךְ
  choice: तुझे ... छुड़ाएगा
  rationale: גאל निकट संबंधी द्वारा छुड़ाने, वापस पाने और उद्धार करने का गहरा अर्थ रखता है। ‘छुड़ाएगा’ शत्रुओं के हाथ से मुक्त करने के संदर्भ में स्वाभाविक है और ‘बचाई जाएगी’ से अलग रहता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: मूल में परमेश्वर का व्यक्तिगत वाचा-नाम है; हिन्दी लिप्यंतरण ‘याहवे’ किसी पदवी से उसे प्रतिस्थापित नहीं करता।
- source_word: מִ/כַּ֖ף אֹיְבָֽיִ/ךְ
  choice: तेरे शत्रुओं के हाथ से
  rationale: ‘हाथ’ अधिकार और नियंत्रण का हिब्रू रूपक है और हिन्दी में भी सहज एवं बोधगम्य है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: प्रभु / यहोवा
  rationale: मूल पाठ में चतुरक्षरी व्यक्तिगत नाम सीधे प्रयुक्त है। ‘याहवे’ उसका लिप्यंतरण करके नाम और पदवी का भेद सुरक्षित रखता है।
- issue: निर्वासन और पुनर्स्थापना के संदर्भ में גאל का बल
  choice: छुड़ाएगा
  alternative: उद्धार करेगा / वापस लेगा / मोल लेकर छुड़ाएगा
  rationale: पद पहले נצל द्वारा बचाए जाने और फिर גאל द्वारा छुड़ाए जाने की बात करता है। अलग हिन्दी क्रियाएँ रखने से दोनों हिब्रू क्रियाएँ एक ही अर्थ में विलीन नहीं होतीं; साथ ही ‘छुड़ाएगा’ संबंधपरक और पुनर्स्थापनात्मक भाव के लिए खुला रहता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण भविष्यद्वाणी-शैली रखी गई है। सिय्योन को सम्बोधित करने के कारण एकवचन ‘तू/तेरे’ का प्रयोग अपमानसूचक नहीं, बल्कि हिब्रू के प्रत्यक्ष और निकट सम्बोधन को बनाए रखने के लिए है। अर्धविराम पद के कारण-परिणाम और दोहराए गए ‘वहीं’ की काव्यात्मक संरचना को स्पष्ट करता है।
