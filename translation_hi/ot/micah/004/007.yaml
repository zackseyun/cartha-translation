source:
  edition: WLC
  text: וְ/שַׂמְתִּ֤י אֶת הַ/צֹּֽלֵעָה֙ לִ/שְׁאֵרִ֔ית וְ/הַ/נַּהֲלָאָ֖ה לְ/ג֣וֹי עָצ֑וּם וּ/מָלַ֨ךְ יְהוָ֤ה עֲלֵי/הֶם֙ בְּ/הַ֣ר צִיּ֔וֹן מֵ/עַתָּ֖ה וְ/עַד עוֹלָֽם־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/micah/004/007.yaml
  text: And I will make the lame a remnant[a], and the outcast a strong nation[b]; and Yahweh will reign over them on Mount Zion from now and forever.
translation:
  language: hi
  text: और मैं लँगड़ी को बचा हुआ अंश बनाऊँगा, और दूर हटा दी गई को एक शक्तिशाली जाति; और यहोवा सिय्योन पर्वत पर उन पर अब से सदा तक राज्य करेगा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְשַׂמְתִּי
  choice: और मैं ... बनाऊँगा
  rationale: לְ के साथ यह प्रयोग किसी को किसी रूप में बनाने का परिणाम व्यक्त करता है; आधुनिक हिन्दी में ‘बनाऊँगा’ स्वाभाविक है।
- source_word: הַצֹּלֵעָה
  choice: लँगड़ी
  rationale: स्त्रीलिंग एकवचन को बनाए रखता है और पीड़ित समुदाय के मानवीकरण को बहुवचन में बदलकर स्पष्ट नहीं करता।
- source_word: לִשְׁאֵרִית
  choice: बचा हुआ समुदाय
  rationale: शाब्दिक ‘शेष’ की तुलना में यह भविष्यद्वक्ताओं में न्याय के बाद बचे लोगों के सामुदायिक अर्थ को सामान्य हिन्दी में अधिक स्पष्टता से व्यक्त करता है।
- source_word: הַנַּהֲלָאָה
  choice: दूर हटा दी गई
  rationale: यह कारक स्त्रीलिंग रूप किसी को हटाए या चले जाने के लिए विवश किए जाने को दर्शाता है; निर्वासन का संकेत बनाए रखते हुए ‘बहिष्कृत’ के संभावित सामाजिक-धार्मिक अर्थ से बचता है।
- source_word: לְגוֹי עָצוּם
  choice: एक सामर्थी जाति
  rationale: גּוֹי का सामूहिक-राजनीतिक भाव ‘जाति’ और עָצוּם का बल ‘सामर्थी’ से व्यक्त होता है।
- source_word: וּמָלַךְ יְהוָה
  choice: और यहोवा ... राज्य करेगा
  rationale: מלך राजकीय शासन को व्यक्त करता है और יְהוָה को उसके व्यक्तिगत नाम ‘यहोवा’ से प्रस्तुत किया गया है।
- source_word: עֲלֵיהֶם
  choice: उन पर
  rationale: מלך के साथ עַל प्रजा पर शासन का संबंध बताता है।
- source_word: בְּהַר צִיּוֹן
  choice: सिय्योन पर्वत पर
  rationale: स्थान-सूचक वाक्यांश का स्वाभाविक हिन्दी रूप।
- source_word: מֵעַתָּה וְעַד עוֹלָם
  choice: अब से सदा तक
  rationale: आरंभ के वर्तमान बिंदु और अनिश्चित-अनंत भविष्य की अवधि, दोनों को संक्षिप्त और सहज हिन्दी में सुरक्षित रखता है।
theological_decisions:
- issue: पुनर्स्थापित लोगों को एकवचन मानवीकरण या स्पष्ट बहुवचन के रूप में प्रस्तुत करना
  choice: ‘लँगड़ी’ और ‘दूर हटा दी गई’ स्त्रीलिंग एकवचन में रखे गए हैं।
  alternative: ‘लँगड़े लोगों’ और ‘दूर हटाए गए लोगों’ जैसे बहुवचन प्रयोग।
  rationale: इब्रानी स्त्रीलिंग एकवचन रूप सम्भवतः सिय्योन के पीड़ित समुदाय का मानवीकरण करते हैं। एकवचन बनाए रखने से मूल की साहित्यिक और धर्मवैचारिक बहुअर्थता सुरक्षित रहती है।
- issue: הַנַּהֲלָאָה में निर्वासन या सामान्य बहिष्कार का भाव
  choice: ‘दूर हटा दी गई’
  alternative: ‘बहिष्कृत’ अथवा ‘निकाली गई’
  rationale: चुना हुआ रूप हटाए जाने की क्रिया और निर्वासन-संदर्भ को खुला रखता है, बिना यह तय किए कि कारण औपचारिक बहिष्कार था।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सामान्य-पाठक के लिए बोधगम्य शैली। स्त्रीलिंग एकवचन मानवीकरण जानबूझकर सुरक्षित रखा गया है। ‘बचा हुआ समुदाय’ भविष्यद्वाणी-संबंधी שְׁאֵרִית का अर्थ स्पष्ट करता है; ‘यहोवा’ ईश्वरीय नाम को शीर्षक से प्रतिस्थापित नहीं करता।
