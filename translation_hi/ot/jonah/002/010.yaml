source:
  edition: WLC
  text: וַ/אֲנִ֗י בְּ/ק֤וֹל תּוֹדָה֙ אֶזְבְּחָה לָּ֔/ךְ אֲשֶׁ֥ר נָדַ֖רְתִּי אֲשַׁלֵּ֑מָה יְשׁוּעָ֖תָ/ה לַ/יהוָֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jonah/002/010.yaml
  text: But as for me[a], with the voice of thanksgiving I will sacrifice to you; what I have vowed I will pay. Salvation belongs to Yahweh.
translation:
  language: hi
  text: परन्तु मैं तो धन्यवाद के स्वर में तुझे बलिदान चढ़ाऊँगा; जो मन्नत मैंने मानी है, उसे पूरा करूँगा। उद्धार याहवे का है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इसका अनुवाद ‘छुटकारा याहवे की ओर से है’ या ‘उद्धार याहवे से मिलता है’ भी हो सकता है। इब्रानी יְשׁוּעָה इस प्रसंग में बचाव या छुटकारे को दर्शा सकता है, और साथ ही व्यापक अर्थ में उद्धार को भी।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי
  choice: परन्तु मैं तो
  rationale: स्वतंत्र सर्वनाम אֲנִי और संयोजक वाव पिछले कथन के विपरीत योना के संकल्प पर बल देते हैं; हिन्दी का ‘मैं तो’ इस विरोध और बल को स्वाभाविक रूप से व्यक्त करता है।
- source_word: בְּקוֹל תּוֹדָה
  choice: धन्यवाद के स्वर में
  rationale: קוֹל की ‘आवाज़/स्वर’ की छवि बनाए रखते हुए यह पदबंध सुनाई देने वाले धन्यवाद को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: אֶזְבְּחָה לָּךְ
  choice: तुझे बलिदान चढ़ाऊँगा
  rationale: זבח बलिदान अर्पित करने को और לָּךְ परमेश्वर को उसके प्राप्तकर्ता के रूप में दर्शाता है। ‘बलिदान चढ़ाना’ हिन्दी में स्पष्ट और प्रचलित धार्मिक अभिव्यक्ति है।
- source_word: אֲשֶׁר נָדַרְתִּי אֲשַׁלֵּמָה
  choice: जो मन्नत मैंने मानी है, उसे पूरा करूँगा
  rationale: נדר मन्नत मानना और पिएल שלם मन्नत को निभाना या पूरा करना है। हिन्दी में ‘मन्नत मानना’ और ‘उसे पूरा करना’ अर्थ को स्वाभाविक ढंग से व्यक्त करते हैं।
- source_word: יְשׁוּעָתָה לַיהוָה
  choice: उद्धार याहवे ही का है
  rationale: יְשׁוּעָה प्रसंग में तत्काल बचाव के साथ व्यापक उद्धार का अर्थ भी रखता है। לַיהוָה को संबंध/अधिकार के अर्थ में लिया गया है और ‘ही’ इस संक्षिप्त घोषणात्मक वाक्य के बल को व्यक्त करता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय वाचा-नाम को पदवी से बदलने के बजाय हिन्दी लिप्यंतरण में रखा गया है।
theological_decisions:
- issue: יְשׁוּעָתָה לַיהוָה में उद्धार और याहवे के संबंध का स्वरूप
  choice: उद्धार याहवे ही का है
  alternative: उद्धार याहवे ही से मिलता है / छुटकारा याहवे ही की ओर से है
  rationale: लामेद अधिकार, संबंध या स्रोत का भाव दे सकता है। मुख्य पाठ संक्षिप्त इब्रानी उद्घोषणा के निकट रहकर अधिकार का भाव रखता है, जबकि पादटिप्पणी स्रोत और प्रसंगगत छुटकारे की सम्भावना सुरक्षित रखती है।
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा / प्रभु
  rationale: मूल पाठ में व्यक्तिगत वाचा-नाम सीधे आया है; ‘याहवे’ उसका निकट हिन्दी लिप्यंतरण है और उसे किसी उपाधि में नहीं बदलता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और बोलचाल में समझ आने योग्य रखी गई है। परमेश्वर को सीधे संबोधन में ‘तुझे’ मूल के एकवचन निकट संबोधन को बनाए रखता है; ‘धन्यवाद के स्वर में’ शाब्दिक छवि और स्वाभाविक हिन्दी के बीच संतुलन रखता है।
