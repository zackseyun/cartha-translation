  text: מְשַׁמְּרִ֖ים הַבְלֵי שָׁ֑וְא חַסְדָּ֖/ם יַעֲזֹֽבוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/jonah/002/009.yaml
  text: Those who cling to worthless idols forsake their own mercy[a].
translation:
  language: hi
  text: जो व्यर्थ मूर्तियों से चिपके रहते हैं, वे अपनी ही करुणा को त्याग देते हैं[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जो व्यर्थ मूर्तियों को पकड़े रहते हैं, वे अपनी अटल निष्ठा को त्याग देते हैं।” इसका अर्थ यह भी हो सकता है कि वे परमेश्वर से मिलनेवाली करुणा या अटल प्रेम को खो देते हैं।
    reason: חַסְדָּם में ‘करुणा,’ ‘अटल प्रेम,’ और ‘निष्ठा’ के अर्थ संभव हैं; यह भी अस्पष्ट है कि यह उनकी निष्ठा को सूचित करता है या परमेश्वर से उपलब्ध करुणा/अटल प्रेम को।
lexical_decisions:
- source_word: מְשַׁמְּרִים
  choice: लिपटे रहते हैं
  rationale: שמר का मूल अर्थ ‘रखना/पालना/रक्षा करना’ है, पर इस वाक्यांश में यह निरंतर लगाव और निष्ठा व्यक्त करता है। ‘लिपटे रहते हैं’ आधुनिक हिन्दी में इसी भाव को स्वाभाविक रूप से प्रकट करता है।
- source_word: הַבְלֵי שָׁוְא
  choice: व्यर्थ मूर्तियों
  rationale: הבל और שוא मिलकर खोखलेपन, मिथ्यापन और निष्फलता का भाव देते हैं। भविष्यद्वक्ताओं की भाषा में इसका संकेत मूर्तियों की ओर है; इसलिए ‘व्यर्थ मूर्तियों’ से आशय स्पष्ट होता है और उनका निष्फल स्वरूप भी बना रहता है।
- source_word: חַסְדָּם
  choice: अपनी करुणा
  rationale: חסד में करुणा, अटल प्रेम और संबंधगत निष्ठा के अर्थ संभव हैं; 3 बहुवचन प्रत्यय को ‘अपनी’ से सुरक्षित रखा गया है। संक्षिप्त मुख्य पाठ मूल की अर्थगत अस्पष्टता को पूरी तरह समाप्त नहीं करता, और वैकल्पिक समझ पादटिप्पणी में दी गई है।
- source_word: יַעֲזֹבוּ
  choice: त्याग देते हैं
  rationale: עזב का अर्थ छोड़ना या त्यागना है। ‘त्याग देते हैं’ इस काव्यात्मक और गंभीर कथन के अनुकूल है।
theological_decisions:
- issue: חַסְדָּם का संबंध मूर्तिपूजकों और परमेश्वर से
  choice: मुख्य पाठ में संक्षिप्त ‘अपनी करुणा’ रखा गया है, जिससे मूल का अधिकारसूचक रूप और उसकी अर्थगत खुलावट बनी रहती है।
  alternative: इसे परमेश्वर से मिलनेवाली करुणा या अटल प्रेम, अथवा उनकी अपनी संबंधगत निष्ठा के रूप में समझा जा सकता है।
  rationale: חסד का अर्थ करुणा, अटल प्रेम या निष्ठा हो सकता है, और ‘उनकी’ संबंधगत रूप से अलग-अलग ढंग से समझा जा सकता है। इसलिए किसी एक धर्मवैचारिक अर्थ को निर्णायक रूप से मुख्य पाठ में नहीं थोपा गया।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘लिपटे रहते हैं’ निरंतर मूर्तिपरक लगाव को व्यक्त करता है; ‘करुणा’ सामान्य पाठक के लिए सुबोध है, जबकि पादटिप्पणी חסד की संबंधगत और धर्मवैचारिक व्यापकता को सुरक्षित रखती है।
