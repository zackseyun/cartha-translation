  terminology: Use ‘याहवे’ rather than ‘यहवे’ for the Tetragrammaton, in alignment with the project’s ‘Yahweh’ rendering and standard Hindi phonetic representation. ‘योना,’ ‘मछली,’ and ‘सूखी भूमि’ are appropriate.
