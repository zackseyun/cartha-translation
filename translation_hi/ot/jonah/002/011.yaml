base_translation:
  language: en
  yaml_path: translation/ot/jonah/002/011.yaml
  text: Then Yahweh spoke to the fish[a], and it vomited Jonah onto the dry land.
translation:
  language: hi
  text: तब याहवे ने मछली से कहा[a], और उसने योना को सूखी भूमि पर उगल दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मछली से बोला।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: कहा
  rationale: אמר का मूल अर्थ ‘कहना’ है। ‘मछली से कहा’ हिन्दी में स्वाभाविक है और इसे अधिक प्रबल ‘आज्ञा दी’ बनाकर संदर्भ की निहित बात को शब्द में नहीं जोड़ता।
- source_word: יְהוָה
  choice: यहवे
  rationale: परमेश्वर के व्यक्तिगत नाम יהוה को उपाधि से बदलने के बजाय हिन्दी में प्रचलित निकट लिप्यंतरण ‘यहवे’ के रूप में रखा गया है।
- source_word: לַדָּג
  choice: मछली से
  rationale: דג का अर्थ यहाँ केवल ‘मछली’ है; इस पद में ‘बड़ी’ विशेषण नहीं है। हिन्दी में कहना क्रिया के साथ ‘से’ स्वाभाविक है।
- source_word: וַיָּקֵא
  choice: उगल दिया
  rationale: קיא वमन करने को दर्शाता है। ‘उगल दिया’ आधुनिक हिन्दी में प्रत्यक्ष, स्वाभाविक और बल को बनाए रखने वाला रूप है।
- source_word: אֶת יוֹנָה
  choice: योना को
  rationale: אֵת निश्चित कर्म का चिह्न है; हिन्दी में इसे ‘को’ द्वारा स्वाभाविक रूप से व्यक्त किया गया है।
- source_word: אֶל הַיַּבָּשָׁה
  choice: सूखी भूमि पर
  rationale: יַבָּשָׁה समुद्र के विपरीत सूखी भूमि को दर्शाता है। गति के परिणाम को हिन्दी में ‘पर’ स्वाभाविक रूप से व्यक्त करता है।
- source_word: וַ
  choice: तब
  rationale: आरंभिक वाव कथा को अगले क्रमिक घटनाक्रम में बढ़ाता है; ‘तब’ आधुनिक हिन्दी में इस अनुक्रम को स्पष्ट और सहज ढंग से व्यक्त करता है।
theological_decisions:
- issue: परमेश्वर के नाम יהוה का अनुवाद
  choice: यहवे
  alternative: यहोवा
  rationale: मूल पाठ के व्यक्तिगत नाम को किसी उपाधि से प्रतिस्थापित किए बिना निकट लिप्यंतरण में रखा गया है। ‘यहोवा’ एक पारंपरिक वैकल्पिक रूप है, पर ‘यहवे’ स्रोत-नाम के संभावित उच्चारण के अधिक निकट है।
- issue: मछली से परमेश्वर के कथन की शक्ति
  choice: कहा
  alternative: आज्ञा दी
  rationale: संदर्भ में ईश्वरीय अधिकार और मछली की तत्काल प्रतिक्रिया स्पष्ट हैं, फिर भी אמר स्वयं ‘कहा’ है। ‘आज्ञा दी’ अर्थ को अधिक स्पष्ट करके मूल की अभिव्यक्ति को संकीर्ण कर देता।
translation_notes:
  register: भाषा आधुनिक, सरल और गरिमापूर्ण रखी गई है। ‘उगल दिया’ मूल क्रिया की तीव्रता को बिना अनावश्यक शिष्टोक्ति के व्यक्त करता है; वाक्य-क्रम हिब्रू कथात्मक अनुक्रम का अनुसरण करते हुए स्वाभाविक हिन्दी में है।
