  text: וַ/יְמַ֤ן יְהוָה֙ דָּ֣ג גָּד֔וֹל לִ/בְלֹ֖עַ אֶת יוֹנָ֑ה וַ/יְהִ֤י יוֹנָה֙ בִּ/מְעֵ֣י הַ/דָּ֔ג שְׁלֹשָׁ֥ה יָמִ֖ים וּ/שְׁלֹשָׁ֥ה לֵילֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/jonah/002/001.yaml
  text: And Yahweh appointed a great fish to swallow Jonah[d][c][b][a], and Jonah was in the belly of the fish three days and three nights.
translation:
  language: hi
  text: और याहवे ने योना को निगलने के लिए एक बड़ी मछली नियुक्त की[a][b], और योना उस मछली के पेट में तीन दिन और तीन रात रहा[c][d]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘नियुक्त की’ का अनुवाद ‘तैयार की’ या ‘उपलब्ध कराई’ भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी पाठ ‘बड़ी मछली’ कहता है, विशेष रूप से ‘व्हेल’ नहीं।
    reason: alternative_reading
  - marker: c
    text: शाब्दिक रूप से, ‘मछली के भीतरी भागों में’; यहाँ स्वाभाविक हिन्दी में ‘पेट में’ कहा गया है।
    reason: lexical_alternative
  - marker: d
    text: ‘तीन दिन और तीन रात’ को मूल पाठ के अनुसार ही रखा गया है; यहाँ समावेशी दिन-गणना के प्रश्न का समाधान नहीं किया गया है।
    reason: cross_reference
lexical_decisions:
- source_word: וַיְמַן
  choice: ठहराई
  rationale: यह क्रिया यहाँ यहोवा द्वारा जानबूझकर नियुक्त या नियत किए जाने का भाव व्यक्त करती है; ‘ठहराई’ आधुनिक हिन्दी में इस दैवी व्यवस्था को स्वाभाविक ढंग से बताती है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: इब्रानी चतुरक्षरीय निजी नाम को किसी उपाधि से बदलने के बजाय हिन्दी में प्रचलित नामरूप ‘यहोवा’ से व्यक्त किया गया है।
- source_word: דָּג גָּדוֹל
  choice: एक बड़ी मछली
  rationale: דָּג सामान्यतः ‘मछली’ है और גָּדוֹל उसके बड़े आकार को बताता है; मूल पाठ किसी विशेष जीव, जैसे व्हेल, का नाम नहीं देता।
- source_word: לִבְלֹעַ
  choice: निगलने के लिए
  rationale: यह infinitive क्रिया के सीधे अर्थ ‘निगलना’ को स्पष्ट और सहज हिन्दी में व्यक्त करता है।
- source_word: בִּמְעֵי הַדָּג
  choice: मछली के पेट में
  rationale: מֵעֶה का शाब्दिक भाव भीतरी अंग या अंदरूनी भाग है; इस प्रसंग में ‘पेट’ सामान्य हिन्दी का स्वाभाविक समतुल्य है।
- source_word: שְׁלֹשָׁה יָמִים וּשְׁלֹשָׁה לֵילוֹת
  choice: तीन दिन और तीन रात
  rationale: इब्रानी समय-वाक्यांश को बिना व्याख्यात्मक सामंजस्य बैठाए यथावत रखा गया है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: प्रभु
  rationale: पाठ में निजी वाचा-नाम है; उसे सामान्य उपाधि ‘प्रभु’ से प्रतिस्थापित नहीं किया गया। हिन्दी पाठकों के लिए स्थापित लिप्यंतरण ‘यहोवा’ अपनाया गया है।
- issue: समुद्री जीव की विशिष्ट पहचान
  choice: बड़ी मछली
  alternative: व्हेल
  rationale: इब्रानी मूल केवल ‘मछली’ कहता है, इसलिए किसी अधिक विशिष्ट प्राणी की पहचान आरोपित नहीं की गई।
- issue: ‘तीन दिन और तीन रात’ का काल-वाक्यांश
  choice: तीन दिन और तीन रात
  alternative: तीन दिनों के कुछ भाग
  rationale: मुख्य पाठ मूल अभिव्यक्ति को सुरक्षित रखता है और समावेशी दिन-गणना से जुड़े बाद के प्रश्न को अनुवाद में हल नहीं करता।
translation_notes:
  register: भाषा आधुनिक, सरल और गरिमापूर्ण रखी गई है। वाक्य की इब्रानी क्रमबद्धता को पर्याप्त रूप से सुरक्षित रखते हुए हिन्दी में स्वाभाविक पदक्रम अपनाया गया है। सभी पाठालोचनात्मक और अर्थगत सावधानियाँ पादटिप्पणियों में स्पष्ट की गई हैं।
