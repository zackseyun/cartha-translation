id: JON.2.5
reference: Jonah 2:5
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/אֲנִ֣י אָמַ֔רְתִּי נִגְרַ֖שְׁתִּי מִ/נֶּ֣גֶד עֵינֶ֑י/ךָ אַ֚ךְ אוֹסִ֣יף לְ/הַבִּ֔יט אֶל הֵיכַ֖ל קָדְשֶֽׁ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/jonah/002/005.yaml
  text: And I said[a], ‘I have been driven out from before your eyes; yet I will again look toward your holy temple.’
translation:
  language: hi
  text: और मैंने कहा, “मैं तेरी आँखों के सामने से[a] निकाल दिया गया हूँ; फिर भी मैं तेरे पवित्र मन्दिर की ओर फिर से[b] देखूँगा।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तेरी दृष्टि से” अथवा “तेरी उपस्थिति से।”
    reason: lexical_alternative
  - marker: b
    text: या, “देखता रहूँगा।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי אָמַרְתִּי
  choice: और मैंने कहा
  rationale: संयोजक के साथ आया सर्वनाम वक्ता पर हल्का बल देते हुए पिछले कथन को आगे बढ़ाता है। ‘और मैंने कहा’ इब्रानी की सरल कड़ी और אָמַרְתִּי के सामान्य अर्थ को बनाए रखता है; प्रसंग में यह मन में कही बात भी हो सकती है।
- source_word: נִגְרַשְׁתִּי
  choice: मैं ... निकाल दिया गया हूँ
  rationale: גרש का निफ़अल रूप किसी के द्वारा दूर किए या निकाल दिए जाने का भाव देता है। यह चयन कर्मवाच्य अर्थ को स्पष्ट रखता है और निर्वासन जैसी कोई अतिरिक्त विशिष्ट धारणा नहीं जोड़ता।
- source_word: מִנֶּגֶד עֵינֶיךָ
  choice: तेरी आँखों के सामने से
  rationale: यह इब्रानी की ठोस छवि को निकटता से सुरक्षित रखता है। मुहावरे का अर्थ परमेश्वर की दृष्टि या उपस्थिति से दूर होना भी हो सकता है, जिसे पादटिप्पणी में रखा गया है।
- source_word: אַךְ
  choice: फिर भी
  rationale: यहाँ यह निराशा से आशा की ओर प्रबल विरोधात्मक मोड़ दिखाता है।
- source_word: אוֹסִיף
  choice: फिर से
  rationale: יסף का हिफ़ईल रूप किसी कार्य को दोबारा करने या करते रहने का अर्थ दे सकता है। अस्वीकृति के अनुभव के बाद आशा लौटने के प्रसंग में ‘फिर से’ स्वाभाविक है, जबकि दूसरा संभव अर्थ पादटिप्पणी में सुरक्षित है।
- source_word: לְהַבִּיט אֶל
  choice: की ओर ... देखूँगा
  rationale: क्रिया और אֶל मिलकर किसी दिशा में ध्यान लगाकर देखने का भाव देते हैं; हिन्दी में ‘की ओर देखना’ इसे स्वाभाविक रूप से व्यक्त करता है।
- source_word: הֵיכַל קָדְשֶׁךָ
  choice: तेरे पवित्र मन्दिर
  rationale: परमेश्वर के संदर्भ में הֵיכָל का अर्थ ‘मन्दिर’ है। शाब्दिक ‘तेरी पवित्रता का मन्दिर’ को हिन्दी में स्वाभाविक विशेषणात्मक रूप ‘तेरा पवित्र मन्दिर’ दिया गया है।
theological_decisions:
- issue: क्या מִנֶּגֶד עֵינֶיךָ को स्थान-संबंधी दृश्य बिम्ब के रूप में रखा जाए या सीधे परमेश्वर की उपस्थिति से बहिष्कार के रूप में समझाया जाए
  choice: तेरी आँखों के सामने से
  alternative: तेरी दृष्टि से; तेरी उपस्थिति से
  rationale: मूल पाठ परमेश्वर की ‘आँखों’ की ठोस छवि रखता है, जिसमें दृष्टि, अनुग्रह और उपस्थिति के अर्थ निहित हो सकते हैं। मुख्य पाठ इस तनाव को व्याख्यात्मक रूप से सीमित नहीं करता; संभावित अर्थ पादटिप्पणी में दिए गए हैं।
- issue: אוֹסִיף को पुनः किए जाने वाले कार्य के रूप में समझा जाए या जारी रहने वाले कार्य के रूप में
  choice: फिर से देखूँगा
  alternative: देखता रहूँगा
  rationale: दोनों अर्थ व्याकरणतः संभव हैं। संदर्भ में निराशा से नई आशा की ओर मोड़ ‘फिर से’ का समर्थन करता है, पर निरंतरता का अर्थ पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और काव्यात्मक प्रार्थना-भाषा रखी गई है। परमेश्वर के लिए एकवचन निकट संबोधन ‘तेरी/तेरे’ मूल इब्रानी के एकवचन संबोधन और हिन्दी बाइबलीय शैली के अनुरूप है। ‘मन्दिर’ की वर्तनी मानक हिन्दी रूप में रखी गई है।
