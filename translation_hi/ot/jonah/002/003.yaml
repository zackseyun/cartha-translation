  text: וַ/יֹּ֗אמֶר קָ֠רָאתִי מִ/צָּ֥רָה לִ֛/י אֶל יְהוָ֖ה וַֽ/יַּעֲנֵ֑/נִי מִ/בֶּ֧טֶן שְׁא֛וֹל שִׁוַּ֖עְתִּי שָׁמַ֥עְתָּ קוֹלִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/jonah/002/003.yaml
  text: And he said[a], “I called to Yahweh out of my distress, and he answered me. From the belly of Sheol I cried out[b]; you heard my voice.”
translation:
  language: hi
  text: और उसने कहा, “अपने संकट में मैंने याहवे को पुकारा, और उसने मुझे उत्तर दिया। शिओल[a] के पेट[b] से मैंने सहायता के लिए पुकारा; तूने मेरी आवाज़ सुनी।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शिओल मृतकों के लोक के लिए प्रयुक्त हिब्रू शब्द है; अधिक व्याख्यात्मक अनुवाद में इसे ‘मृतकों का लोक’ या ‘कब्र’ कहा जा सकता है।
    reason: alternative_reading
  - marker: b
    text: हिब्रू शब्द का अर्थ ‘पेट’ या ‘गर्भ’ हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: और उसने कहा
  rationale: हिब्रू कथात्मक क्रमसूचक को सरल और स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: קָרָאתִי מִצָּרָה לִי אֶל־יְהוָה
  choice: अपने संकट में मैंने याहवे को पुकारा
  rationale: צָרָה को ‘संकट’ और प्रार्थना की दिशा को ‘याहवे को पुकारा’ से व्यक्त किया गया है; वाक्य-विन्यास आधुनिक हिन्दी के अनुरूप है।
- source_word: וַיַּעֲנֵנִי
  choice: और उसने मुझे उत्तर दिया
  rationale: क्रिया और प्रथम पुरुष कर्म-प्रत्यय, दोनों को स्पष्ट रूप से व्यक्त करता है।
- source_word: מִבֶּטֶן שְׁאוֹל
  choice: शिओल के पेट से
  rationale: שְׁאוֹל का लिप्यंतरण उसके व्यापक प्राचीन अर्थ को सुरक्षित रखता है, जबकि בֶּטֶן की सजीव काव्यात्मक छवि को ‘पेट’ से बनाए रखा गया है।
- source_word: שִׁוַּעְתִּי
  choice: मैंने सहायता के लिए पुकारा
  rationale: यह क्रिया केवल ऊँची आवाज़ में बोलने के बजाय सहायता की गुहार का भाव रखती है; हिन्दी अभिव्यक्ति उसी अर्थ को स्पष्ट करती है।
- source_word: שָׁמַעְתָּ קוֹלִי
  choice: तूने मेरी आवाज़ सुनी
  rationale: हिब्रू में परमेश्वर को सीधे संबोधित करने के लिए आए दूसरे पुरुष एकवचन और ‘मेरी आवाज़’ की ठोस अभिव्यक्ति को सुरक्षित रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: प्रभु / यहोवा
  rationale: मूल पाठ में आए व्यक्तिगत वाचा-नाम को उपाधि में बदलने के बजाय हिन्दी लिप्यंतरण में सुरक्षित रखा गया है।
- issue: שְׁאוֹל का अर्थ
  choice: शिओल
  alternative: मृतकों का लोक / कब्र
  rationale: ‘शिओल’ मूल अवधारणा की व्यापकता और अस्पष्टता बनाए रखता है तथा इसे केवल व्यक्तिगत कब्र या बाद की ‘नरक’ संबंधी धारणा तक सीमित नहीं करता।
- issue: योना की स्थिति की काव्यात्मक भाषा
  choice: शिओल के पेट से
  alternative: शिओल के गर्भ से
  rationale: मूल रूपक को वास्तविक मृत्यु के बारे में किसी निश्चित धर्मवैज्ञानिक निष्कर्ष में बदले बिना ज्यों का त्यों रखा गया है।
translation_notes:
  register: भाषा आधुनिक, सहज और काव्यात्मक गरिमा वाली रखी गई है। परमेश्वर के सीधे संबोधन में ‘तू’ हिब्रू के दूसरे पुरुष एकवचन को सुरक्षित रखता है और हिन्दी बाइबलीय-काव्य परंपरा के अनुरूप है।
