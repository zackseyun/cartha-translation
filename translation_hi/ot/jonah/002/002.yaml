lexical_decisions:
- source_word: וַיִּתְפַּלֵּל
  choice: तब ... ने ... प्रार्थना की
  rationale: वय्यिक्तोल रूप कथा को आगे बढ़ाता है। आधुनिक हिन्दी में “तब” उसके क्रमिक भाव को स्वाभाविक ढंग से व्यक्त करता है; התפלל का अर्थ यहाँ “प्रार्थना करना” है।
- source_word: יוֹנָה
  choice: योना
  rationale: व्यक्तिनाम का प्रचलित हिन्दी लिप्यंतरण।
- source_word: אֶל
  choice: से
  rationale: हिन्दी में “किसी से प्रार्थना करना” स्वाभाविक प्रयोग है। यह इब्रानी संबंधसूचक אֶל का प्रसंगानुकूल समतुल्य है।
- source_word: יְהוָה
  choice: याहवे
  rationale: चतुर्वर्णीय ईश्वरीय नाम का हिन्दी लिप्यंतरण किया गया है, ताकि मूल में प्रयुक्त व्यक्तिगत नाम को किसी उपाधि से न बदला जाए।
- source_word: אֱלֹהָיו
  choice: अपने परमेश्वर
  rationale: तृतीय पुरुष एकवचन प्रत्यय का संबंधवाचक अर्थ सुरक्षित है। कर्ता योना होने के कारण हिन्दी में “अपने परमेश्वर” अधिक स्वाभाविक और स्पष्ट है।
- source_word: מִמְּעֵי
  choice: पेट से
  rationale: מֵעֶה का अर्थ भीतरी अंग, पेट या गर्भ हो सकता है। मछली द्वारा योना को निगले जाने के प्रसंग में “पेट” स्पष्ट और स्वाभाविक हिन्दी है।
- source_word: הַדָּגָה
  choice: मछली
  rationale: मूल पाठ में निश्चित उपपद सहित केवल “मछली” है; इस पद में “बड़ी” जोड़ना उचित नहीं। इब्रानी शब्द का व्याकरणिक स्त्रीलिंग हिन्दी अनुवाद में कोई अतिरिक्त अर्थ नहीं जोड़ता।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पद में चतुर्वर्णीय व्यक्तिगत नाम सीधे प्रयुक्त है। “याहवे” उसका लिप्यंतरण करके नाम और उपाधि के भेद को बनाए रखता है।
translation_notes:
