  text: לְ/קִצְבֵ֤י הָרִים֙ יָרַ֔דְתִּי הָ/אָ֛רֶץ בְּרִחֶ֥י/הָ בַעֲדִ֖/י לְ/עוֹלָ֑ם וַ/תַּ֧עַל מִ/שַּׁ֛חַת חַיַּ֖/י יְהוָ֥ה אֱלֹהָֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/jonah/002/007.yaml
  text: I went down to the roots of the mountains[a]; the earth with its bars was around me forever, but you brought up my life from the pit[c][b], O Yahweh my God.
translation:
  language: hi
  text: मैं पहाड़ों की जड़ों तक उतर गया[a]; पृथ्वी की सलाखें सदा के लिए मेरे चारों ओर थीं[b]। परन्तु हे याहवे, मेरे परमेश्वर, तूने गड्ढे से मेरा जीवन ऊपर उठाया[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘पहाड़ों के छोरों तक’ अथवा ‘पहाड़ों की नींव तक’।
    reason: lexical_alternative
  - marker: b
    text: या ‘पृथ्वी की सलाखें मेरे पीछे सदा के लिए बंद हो गई थीं।’ इब्रानी में पृथ्वी की अर्गलाओं या रोकने वाली छड़ों से कैद हो जाने की छवि है।
    reason: lexical_alternative
  - marker: c
    text: ‘गड्ढे’ के लिए ‘कब्र’ या ‘विनाश’ भी सम्भव है।
    reason: lexical_alternative
lexical_decisions:
- source_word: לְקִצְבֵי הָרִים
  choice: पहाड़ों की जड़ों तक
  rationale: קִצְבֵי का अर्थ छोर, सीमा या सबसे निचला भाग हो सकता है। पहाड़ों के साथ और नीचे उतरने के प्रसंग में ‘जड़ों’ से उनकी गहरी नींव या तल की काव्यात्मक छवि स्वाभाविक रूप से व्यक्त होती है।
- source_word: יָרַדְתִּי
  choice: मैं ... उतर गया
  rationale: Qal पूर्ण, प्रथम पुरुष एकवचन; यह नीचे की ओर गति को सहज आधुनिक हिन्दी में बनाए रखता है।
- source_word: הָאָרֶץ
  choice: पृथ्वी
  rationale: यहाँ पहाड़ों, सलाखों और गड्ढे से जुड़ी मृत्यु-सदृश विश्वात्मक छवि के कारण ‘भूमि’ की अपेक्षा ‘पृथ्वी’ उपयुक्त है।
- source_word: בְּרִחֶיהָ בַעֲדִי
  choice: उसकी सलाखें मेरे चारों ओर थीं
  rationale: בְּרִיחַ किसी रोकने वाली छड़ या अर्गला को दर्शाता है और בַעֲדִי यहाँ घिर जाने की छवि देता है। ‘सलाखें’ कारावास का बिंब स्पष्ट रखती हैं, जबकि ‘मेरे चारों ओर’ सम्बन्धबोधक पद की सम्भावित घेराबंदी की भावना को बिना फाटकों को जोड़ने के व्यक्त करता है।
- source_word: לְעוֹלָם
  choice: सदा के लिए
  rationale: यह वक्ता को अनुभव होने वाली मृत्यु की अंतिमता और स्थायित्व को व्यक्त करता है; इसे केवल दीर्घ समय कहकर उसका काव्यात्मक बल कम नहीं किया गया।
- source_word: וַתַּעַל
  choice: तूने ... ऊपर निकाला
  rationale: עלה का Hiphil रूप किसी को ऊपर लाने या निकालने का कारण बनने को दर्शाता है। ‘ऊपर निकाला’ नीचे उतरने की पूर्ववर्ती छवि के साथ स्पष्ट विरोध बनाता है।
- source_word: מִשַּׁחַת
  choice: गड्ढे से
  rationale: שַׁחַת का अर्थ गड्ढा, कब्र या विनाश हो सकता है। ‘गड्ढा’ ठोस काव्यात्मक बिंब को बनाए रखते हुए मृत्यु का निहितार्थ खुला रखता है।
- source_word: חַיַּי
  choice: मेरे प्राण को
  rationale: शाब्दिक अर्थ ‘मेरे जीवन’ है, पर हिन्दी में ‘मेरे प्राण को ... निकाला’ व्यक्ति के जीवन को मृत्यु से बचाने का स्वाभाविक और काव्यात्मक रूप है।
- source_word: יְהוָה אֱלֹהָי
  choice: हे याहवे, मेरे परमेश्वर
  rationale: व्यक्तिगत दिव्य नाम को उपाधि से प्रतिस्थापित न करके ‘याहवे’ के रूप में लिप्यंतरित किया गया है; אֱלֹהָי का स्वाभाविक अर्थ ‘मेरे परमेश्वर’ रखा गया है।
theological_decisions:
- issue: יְהוָה दिव्य नाम का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में चतुरक्षरी व्यक्तिगत नाम सीधे उपस्थित है। ‘याहवे’ उसका लिप्यंतरण करता है और उसे किसी उपाधि से नहीं बदलता।
- issue: मृत्यु की प्रार्थना में לְעוֹלָם का आशय
  choice: सदा के लिए
  alternative: बहुत समय तक; युग भर के लिए
  rationale: यह योना की अनुभूति में मृत्यु की अंतिमता को व्यक्त करता है। ‘सदा के लिए’ उस तनाव को बनाए रखता है, पर इसे अधोलोक में अंतहीन अवधि के व्यवस्थित धर्मसैद्धान्तिक कथन के रूप में स्पष्ट नहीं करता।
- issue: שַׁחַת की मृत्यु-संबंधी छवि
  choice: गड्ढा
  alternative: कब्र; विनाश
  rationale: ठोस अवरोहण-उद्धार की छवि को प्राथमिकता दी गई है, जबकि पादटिप्पणी मृत्यु और विनाश के सम्भव अर्थों को सुरक्षित रखती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और काव्यात्मक रखी गई है। ‘सलाखें’ साधारण पाठक के लिए ‘अर्गलाएँ’ से अधिक बोधगम्य है, जबकि पादटिप्पणी मूल कारावास-बिंब को स्पष्ट करती है। परमेश्वर के सीधे संबोधन में एकवचन ‘तू’ निकटता और इब्रानी संबोधन का भाव बनाए रखता है।
