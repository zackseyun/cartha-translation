  text: וַ/תַּשְׁלִיכֵ֤/נִי מְצוּלָה֙ בִּ/לְבַ֣ב יַמִּ֔ים וְ/נָהָ֖ר יְסֹבְבֵ֑/נִי כָּל מִשְׁבָּרֶ֥י/ךָ וְ/גַלֶּ֖י/ךָ עָלַ֥/י עָבָֽרוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/jonah/002/004.yaml
  text: You cast me into the deep[a], into the heart of the seas, and the current surrounded me; all your breakers and your waves passed over me.
translation:
  language: hi
  text: तूने मुझे गहराई में, समुद्रों के हृदय में फेंक दिया; जलधारा[a] ने मुझे चारों ओर से घेर लिया। तेरे सारे थपेड़े और लहरें मुझ पर से होकर गुज़र गए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “नदी”; נָהָר का सामान्य अर्थ “नदी” है, पर यहाँ समुद्री काव्य-संदर्भ में संभवतः जल का प्रवाह या धारा अभिप्रेत है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּשְׁלִיכֵנִי
  choice: तूने मुझे ... फेंक दिया
  rationale: क्रिया שלך का मूल अर्थ ‘फेंकना/डालना’ है। एकवचन प्रत्यक्ष संबोधन ‘तूने’ परमेश्वर को कर्ता के रूप में स्पष्ट रखता है।
- source_word: מְצוּלָה
  choice: गहरे जल में
  rationale: यह समुद्र की गहराई अथवा गहरे पानी को सूचित करता है; ‘गहरे जल’ आधुनिक हिन्दी में स्वाभाविक रहते हुए जलीय संकट का चित्र बनाए रखता है।
- source_word: בִּלְבַב יַמִּים
  choice: समुद्रों के हृदय में
  rationale: לְבַב के ‘हृदय/मध्य’ रूपक और יַמִּים के बहुवचन को यथासंभव सुरक्षित रखा गया है।
- source_word: וְנָהָר
  choice: जलधारा
  rationale: נָהָר का सामान्य अर्थ ‘नदी’ है, पर समुद्री काव्य-संदर्भ में बहते जल या प्रवाह का अर्थ संभावित है। ‘जलधारा’ इस संदर्भ में स्वाभाविक है और पादटिप्पणी में शाब्दिक विकल्प दिया गया है।
- source_word: יְסֹבְבֵנִי
  choice: ने मुझे चारों ओर से घेर लिया
  rationale: סבב के घेरने/चारों ओर होने के अर्थ को स्पष्ट, आधुनिक हिन्दी में व्यक्त करता है।
- source_word: מִשְׁבָּרֶיךָ
  choice: तेरी सारी प्रचंड लहरें
  rationale: מִשְׁבָּר टूटकर उमड़ने वाली लहरों को दर्शाता है। हिन्दी में ‘प्रचंड लहरें’ उनकी शक्ति को स्वाभाविक ढंग से व्यक्त करता है, यद्यपि ‘टूटती लहरें’ अधिक रूपात्मक विकल्प है।
- source_word: וְגַלֶּיךָ
  choice: और तेरी तरंगें
  rationale: גַּלִּים का अर्थ लहरें/तरंगें है। पहले समुद्री पद से भेद बनाए रखने के लिए ‘तरंगें’ चुना गया है और द्वितीय पुरुष संबंधसूचक रूप सुरक्षित है।
- source_word: עָלַי עָבָרוּ
  choice: मेरे ऊपर से गुजर गईं
  rationale: इब्रानी अभिव्यक्ति के निकट रहते हुए जल के वक्ता के ऊपर से निकल जाने का बिंब बनाए रखता है; ‘मुझे बहा ले गईं’ अनावश्यक रूप से अधिक व्याख्यात्मक होता।
theological_decisions:
- issue: योना के समुद्र में डाले जाने में परमेश्वर की भूमिका
  choice: 'परमेश्वर से सीधे एकवचन संबोधन रखा गया है: ‘तूने मुझे ... फेंक दिया’ और ‘तेरी ... लहरें’।'
  alternative: नाविकों को निहित कर्ता मानकर परमेश्वर की प्रत्यक्ष भूमिका को नरम करना।
  rationale: इब्रानी पाठ में द्वितीय पुरुष एकवचन क्रिया और संबंधसूचक प्रत्यय स्पष्ट हैं। कथानक में नाविक मानवीय माध्यम हैं, फिर भी प्रार्थना घटना को परमेश्वर के अधीन कार्य के रूप में कहती है; अनुवाद इस तनाव को बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और काव्यात्मक रखी गई है। परमेश्वर के लिए ‘तू/तेरी’ का प्रयोग मूल इब्रानी के निकट, आत्मीय प्रत्यक्ष संबोधन के रूप में है, अनादर के अर्थ में नहीं।
