id: JON.2.8
reference: Jonah 2:8
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: בְּ/הִתְעַטֵּ֤ף עָלַ/י֙ נַפְשִׁ֔/י אֶת יְהוָ֖ה זָכָ֑רְתִּי וַ/תָּב֤וֹא אֵלֶ֨י/ךָ֙ תְּפִלָּתִ֔/י אֶל הֵיכַ֖ל קָדְשֶֽׁ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jonah/002/008.yaml
  text: When my life was fainting away within me[a], I remembered Yahweh, and my prayer came to you[b], into your holy temple.
translation:
  language: hi
  text: जब मेरा जीवन मेरे भीतर क्षीण होता जा रहा था[a], तब मैंने याहवे को स्मरण किया; और मेरी प्रार्थना तेरे पास, तेरे पवित्र मन्दिर में पहुँची[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जब मेरे प्राण मेरे भीतर मूर्छित हो रहे थे।” इब्रानी नֶפֶשׁ का अर्थ प्रसंग के अनुसार “जीवन,” “प्राण,” “आत्मा” या “स्वयं” हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या, “तेरे पवित्र राजमहल/पवित्रस्थान में।” इब्रानी शब्द का अर्थ राजमहल या मन्दिर हो सकता है; यहाँ प्रार्थना के प्रसंग में “मन्दिर” उपयुक्त है।
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּהִתְעַטֵּף עָלַי נַפְשִׁי
  choice: जब मेरा जीवन मेरे भीतर क्षीण होता जा रहा था
  rationale: בְּ के साथ हित्पएल क्रियारूप एक कालवाचक उपवाक्य बनाता है। עטף संकट में धीरे-धीरे निर्बल या मूर्छित होने का भाव दे सकता है, और נֶפֶשׁ यहाँ मृत्यु-सन्निकट प्रसंग में ‘जीवन’ के अर्थ में स्वाभाविक है। ‘होता जा रहा था’ क्रमिक क्षीणता को व्यक्त करता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को उपाधि से बदलने के बजाय हिन्दी में लिप्यन्तरित किया गया है।
- source_word: זָכָרְתִּי
  choice: मैंने ... स्मरण किया
  rationale: काल रूप का सीधा अर्थ ‘स्मरण किया’ है; इसे ‘पुकारा’ बनाकर अगले प्रार्थना-वाक्य का अर्थ इसमें नहीं मिलाया गया।
- source_word: וַתָּבוֹא אֵלֶיךָ תְּפִלָּתִי
  choice: मेरी प्रार्थना तेरे पास ... पहुँची
  rationale: בוא का मूल भाव ‘आना’ है। हिन्दी में प्रार्थना के सम्बोधनकर्ता तक आने की बात ‘तेरे पास पहुँची’ से सहज और अर्थनिष्ठ रूप में व्यक्त होती है।
- source_word: אֶל הֵיכַל קָדְשֶׁךָ
  choice: तेरे पवित्र मन्दिर में
  rationale: אֶל दिशा और प्रवेश का भाव दे सकता है। הֵיכָל का अर्थ राजमहल या मन्दिर हो सकता है; इस प्रार्थना-सन्दर्भ में ‘मन्दिर’ सबसे स्वाभाविक है, जबकि इससे पृथ्वी के मन्दिर और परमेश्वर के स्वर्गीय निवास के बीच निर्णय अनावश्यक रूप से नहीं थोपा जाता।
theological_decisions:
- issue: नֶפֶשׁ का मानव-स्वरूप सम्बन्धी अर्थ
  choice: मेरा जीवन
  alternative: मेरे प्राण / मेरी आत्मा
  rationale: योना की मृत्यु-सन्निकट दशा में ‘जीवन’ ठोस प्रसंग से मेल खाता है और पद पर किसी बाद की तकनीकी आत्मा-सम्बन्धी परिभाषा को आरोपित नहीं करता। पादटिप्पणी मूल शब्द की व्यापकता बनाए रखती है।
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा / प्रभु
  rationale: मूल पाठ व्यक्तिगत वाचा-नाम का प्रयोग करता है; ‘याहवे’ उसे उपाधि में बदले बिना स्पष्ट रूप से प्रस्तुत करता है।
- issue: पवित्र הֵיכָל का संकेत
  choice: पवित्र मन्दिर
  alternative: पवित्र राजमहल / पवित्रस्थान
  rationale: प्रार्थना के प्रसंग में ‘मन्दिर’ उपयुक्त है, पर यह अभिव्यक्ति अपने आप यह निश्चित नहीं करती कि केवल पार्थिव मन्दिर अभिप्रेत है या परमेश्वर का स्वर्गीय निवास।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण और प्रार्थना-काव्य के अनुकूल रखी गई है। परमेश्वर के लिए निकट, एकवचन सम्बोधन ‘तेरे’ मूल के द्वितीय पुरुष एकवचन को दर्शाता है। अर्धविराम स्मरण और प्रार्थना के अगले, सम्बद्ध चरणों को स्पष्ट करता है।
