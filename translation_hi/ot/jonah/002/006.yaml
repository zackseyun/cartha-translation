    issue: Footnote a begins by repeating the translated phrase as though it were an alternative.
    rationale: The note should identify the lexical, more literal alternative (‘आत्मा’) and then explain that the contextual sense is life/self.
  - severity: low
    issue: ‘मेरे सिर से लिपटी हुई थी’ does not fully express the Hebrew image of vegetation bound around/about the head.
    rationale: Adding ‘के चारों ओर’ makes the spatial relation explicit without adding interpretation.
  - severity: low
    issue: ‘गहरे जल’ is a valid contextual sense but is less direct than the noun ‘गहराई’ for תְּהוֹם.
    rationale: ‘गहराई’ preserves the source’s concentrated poetic noun and avoids unnecessary repetition of ‘जल’.
