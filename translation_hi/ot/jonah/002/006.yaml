  text: אֲפָפ֤וּ/נִי מַ֨יִם֙ עַד נֶ֔פֶשׁ תְּה֖וֹם יְסֹבְבֵ֑/נִי ס֖וּף חָב֥וּשׁ לְ/רֹאשִֽׁ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/jonah/002/006.yaml
  text: Waters closed in around me to my very life[a]; the deep surrounded me[b]; seaweed was wrapped around my head.
translation:
  language: hi
  text: जल ने मुझे चारों ओर से घेर लिया, मेरे प्राण तक[a]; गहराई ने मुझे घेर लिया; समुद्री वनस्पति[b] मेरे सिर के चारों ओर लिपटी हुई थी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “मेरी आत्मा तक”; यहाँ अर्थ “मेरे जीवन तक” या “मेरे अपने अस्तित्व तक” है।
    reason: lexical_alternative
  - marker: b
    text: “समुद्री वनस्पति” का अनुवाद “सरकंडे” या “नरकट” भी हो सकता है; पर समुद्र में डूबे हुए योना का प्रसंग समुद्री वनस्पति के अर्थ का समर्थन करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲפָפוּנִי
  choice: मुझे चारों ओर से घेर लिया
  rationale: क्रिया चारों ओर से घेरने और संकट में जकड़ लेने का भाव व्यक्त करती है; यह हिन्दी में स्वाभाविक और काव्यात्मक है।
- source_word: מַיִם
  choice: जल
  rationale: हिब्रू बहुवचन यहाँ जलराशि के लिए मुहावरेदार है; हिन्दी में सामूहिक अर्थ वाला ‘जल’ अधिक स्वाभाविक है।
- source_word: עַד נֶפֶשׁ
  choice: मेरे प्राण तक
  rationale: נֶפֶשׁ यहाँ अमूर्त आत्मा की अपेक्षा जीवन या स्वयं व्यक्ति को सूचित करता है। ‘मेरे प्राण तक’ मूल की संक्षिप्तता और जीवन पर आए संकट—दोनों को बनाए रखता है।
- source_word: תְּהוֹם
  choice: गहरे जल
  rationale: यह समुद्र की अथाह गहराई या गहन जलराशि को दर्शाता है। ‘गहरे जल’ आधुनिक हिन्दी में स्पष्ट है और ‘अथाह कुंड’ जैसे अनावश्यक परलोक-संबंधी अर्थ से बचता है।
- source_word: יְסֹבְבֵנִי
  choice: मुझे घेर लिया
  rationale: क्रिया का सीधा अर्थ चारों ओर से घेरना है और यह पहले खंड के समानांतर भाव को सुरक्षित रखता है।
- source_word: סוּף
  choice: समुद्री वनस्पति
  rationale: शब्द सरकंडे या नरकट भी सूचित कर सकता है, पर समुद्र में डूबे योना के प्रसंग में पानी के भीतर उगने वाली वनस्पति अधिक उपयुक्त है। ‘समुद्री वनस्पति’ हिन्दी में ‘समुद्री घास’ की अपेक्षा अधिक व्यापक रहते हुए संदर्भ स्पष्ट करती है।
- source_word: חָבוּשׁ
  choice: लिपटी हुई थी
  rationale: निष्क्रिय कृदंत बँधे या लिपटे होने की दशा बताता है; ‘लिपटी हुई थी’ प्राकृतिक और सजीव हिन्दी है।
- source_word: לְרֹאשִׁי
  choice: मेरे सिर से
  rationale: לְ यहाँ सिर के चारों ओर लगने या लिपटने का संबंध व्यक्त करता है; हिन्दी में ‘मेरे सिर से लिपटी’ स्वाभाविक है।
