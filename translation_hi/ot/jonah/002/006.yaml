  terminology: ‘प्राण’ appropriately conveys נֶפֶשׁ here as life rather than imposing an immaterial-soul sense. ‘समुद्री वनस्पति’ is a suitably broad contextual rendering of סוּף, with the reed/rush alternative retained in a note.
