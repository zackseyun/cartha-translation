  register: भाषा आधुनिक मानक हिंदी की, गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज रखी गई है। संबोधन में ‘आप’ परमेश्वर के प्रति आदर व्यक्त करता है। ‘भाग निकला था’ बोलचाल में समझ आने वाला है, पर इतना अनौपचारिक नहीं कि भविष्यद्वाणी-वृत्तांत की गरिमा घटे।
