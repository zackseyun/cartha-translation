  text: וַ/יִּתְפַּלֵּ֨ל אֶל יְהוָ֜ה וַ/יֹּאמַ֗ר אָנָּ֤ה יְהוָה֙ הֲ/לוֹא זֶ֣ה דְבָרִ֗/י עַד הֱיוֹתִ/י֙ עַל אַדְמָתִ֔/י עַל כֵּ֥ן קִדַּ֖מְתִּי לִ/בְרֹ֣חַ תַּרְשִׁ֑ישָׁ/ה כִּ֣י יָדַ֗עְתִּי כִּ֤י אַתָּה֙ אֵֽל חַנּ֣וּן וְ/רַח֔וּם אֶ֤רֶךְ אַפַּ֨יִם֙ וְ/רַב חֶ֔סֶד וְ/נִחָ֖ם עַל הָ/רָעָֽה־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jonah/004/002.yaml
  text: And he prayed to Yahweh and said[a], “Please, Yahweh, was this not what I said while I was still in my own land? That is why I acted first to flee to Tarshish, because I knew that you are a gracious and compassionate God, slow to anger and abundant in steadfast love[c][b], and relenting concerning the disaster.”
translation:
  language: hi
  text: तब उसने याहवे से प्रार्थना की और कहा, “आह, हे याहवे! जब मैं अपने देश में ही था, तब क्या मैंने यही बात नहीं कही थी? इसीलिए मैं पहले ही तरशीश भाग गया था[a], क्योंकि मैं जानता था कि आप कृपालु और करुणामय परमेश्वर हैं[b], क्रोध करने में धीमे और अटल प्रेम से भरपूर हैं, और विपत्ति के विषय में मन फेर लेते हैं[c]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मैंने पहले से ही तरशीश भाग जाने की कोशिश की थी,” अथवा “मैंने शीघ्रता से तरशीश भागने का उपाय किया था।” इब्रानी क्रिया में पहले से कदम उठाने या आगे बढ़कर काम करने का भाव है।
    reason: lexical_alternative
  - marker: b
    text: “करुणामय” का अनुवाद “दयालु” भी हो सकता है। यह वर्णन निर्गमन 34:6 की प्रतिध्वनि है।
    reason: cross_reference
  - marker: c
    text: या, “विपत्ति लाने से पीछे हट जाते हैं।” इब्रानी में शाब्दिक रूप से “उस बुराई/विपत्ति के विषय में” है; यहाँ आशय घोषित दंड से है, परमेश्वर की किसी नैतिक बुराई से नहीं।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְפַּלֵּל
  choice: प्रार्थना करके कहा
  rationale: हित्पएल रूप का सामान्य अर्थ ‘प्रार्थना करना’ है। योना की वाणी शिकायतपूर्ण होने पर भी वह परमेश्वर को संबोधित प्रार्थना ही है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय हिंदी में लिप्यंतरित किया गया है।
- source_word: אָנָּה
  choice: हे याहवे!
  rationale: यह विनती अथवा भावपूर्ण उद्गार का सूचक अव्यय है। हिंदी का संबोधन यहाँ योना की तीव्र भावावस्था को स्वाभाविक रूप से व्यक्त करता है, बिना उसके कथन को विनम्र अनुरोध मात्र बना देने के।
- source_word: הֲלוֹא זֶה דְבָרִי
  choice: क्या मैंने यही बात नहीं कही थी?
  rationale: हֲלוֹא सहमति की अपेक्षा रखने वाला आलंकारिक प्रश्न है और דְבָרִי का प्रसंगानुकूल अर्थ ‘मेरी कही हुई बात’ है।
- source_word: עַד הֱיוֹתִי עַל אַדְמָתִי
  choice: जब मैं अपने देश में ही था
  rationale: वाक्यांश योना के अपने देश में रहने के समय की ओर संकेत करता है; ‘ही’ उसके तब तक वहीं होने पर बल देता है।
- source_word: קִדַּמְתִּי לִבְרֹחַ
  choice: मैं पहले ही ... भाग निकला था
  rationale: קדם के इस रूप में पहले से अथवा आगे बढ़कर कार्य करने का भाव है। यह अनुवाद योना के पूर्वानुमान के आधार पर किए गए पलायन को सहज हिंदी में व्यक्त करता है।
- source_word: חַנּוּן וְרַחוּם
  choice: अनुग्रहकारी और करुणामय
  rationale: दोनों विशेषण क्रमशः कृपा दिखाने और गहरी करुणा रखने के अर्थ देते हैं तथा निर्गमन 34:6 की प्रतिध्वनि बनाए रखते हैं।
- source_word: אֶרֶךְ אַפַּיִם
  choice: क्रोध करने में धीरजवन्त
  rationale: इब्रानी मुहावरे का अर्थ क्रोध में विलंब और संयम है; यह हिंदी रूप अर्थ और गरिमा दोनों बनाए रखता है।
- source_word: רַב חֶסֶד
  choice: अटल प्रेम से भरपूर
  rationale: חֶסֶד में प्रेम, निष्ठा और कृपालुता का संयुक्त भाव है। ‘अटल प्रेम’ उसकी स्थिर और विश्वसनीय प्रकृति को सामने लाता है।
- source_word: וְנִחָם עַל הָרָעָה
  choice: विपत्ति के विषय में मन फेर लेते हैं
  rationale: נחם यहाँ घोषित दंड से फिरने का भाव रखता है और רָעָה इस प्रसंग में नैतिक बुराई नहीं, आने वाली विपत्ति है। ‘मन फेर लेते हैं’ पाठ की मानवीय ढंग से कही गई भाषा और उसके धर्मवैज्ञानिक तनाव को बनाए रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: प्रभु
  rationale: मूल पाठ व्यक्तिगत वाचा-नाम का प्रयोग करता है; लिप्यंतरण उसे उपाधि में बदलने से बचाता है।
- issue: וְנִחָם में परमेश्वर के मन फेरने की भाषा
  choice: विपत्ति के विषय में मन फेर लेते हैं
  alternative: विपत्ति नहीं लाते हैं
  rationale: चुना हुआ रूप मूल की मानव-सदृश अभिव्यक्ति को सुरक्षित रखता है। अधिक व्याख्यात्मक विकल्प तनाव को मिटाकर केवल परिणाम बताता।
- issue: הָרָעָה का अर्थ
  choice: विपत्ति
  alternative: बुराई
  rationale: यहाँ शब्द नीनवे पर घोषित विनाशकारी न्याय को सूचित करता है, परमेश्वर में नैतिक बुराई को नहीं।
