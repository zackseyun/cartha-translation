source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר יְהוָ֔ה אַתָּ֥ה חַ֨סְתָּ֙ עַל הַ/קִּ֣יקָי֔וֹן אֲשֶׁ֛ר לֹא עָמַ֥לְתָּ בּ֖/וֹ וְ/לֹ֣א גִדַּלְתּ֑/וֹ שֶׁ/בִּן לַ֥יְלָה הָיָ֖ה וּ/בִן לַ֥יְלָה אָבָֽד־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jonah/004/010.yaml
  text: Then Yahweh said[a], "You had compassion on the plant, for which you did not labor and which you did not make grow, which came up in a night and perished in a night."
translation:
  language: hi
  text: तब याहवे ने कहा, “तुमने उस पौधे[a] पर तरस खाया, जिसके लिए तुमने परिश्रम नहीं किया और जिसे तुमने उगाया नहीं, जो एक रात में उग आया और एक रात में नष्ट हो गया।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इब्रानी: ‘किकायोन’; इस पौधे की सटीक प्रजाति निश्चित नहीं है। कुछ इसे अरंडी का पौधा या बेल मानते हैं।'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत नाम יהוה का देवनागरी लिप्यंतरण किया गया है; इसे किसी उपाधि से प्रतिस्थापित नहीं किया गया।
- source_word: חַסְתָּ עַל
  choice: पर तरस खाया
  rationale: यह प्रयोग दया, करुणा अथवा किसी को बचाए रखने की चिंता व्यक्त करता है। ‘तरस खाया’ आधुनिक हिन्दी में स्वाभाविक है और अगले पद में नीनवे के प्रति याहवे की करुणा के साथ समानांतरता बनाए रखता है।
- source_word: הַקִּיקָיוֹן
  choice: उस पौधे[a]
  rationale: קִיקָיוֹן की सटीक वनस्पति-प्रजाति अनिश्चित है। ‘पौधा’ अर्थ को स्पष्ट रखते हुए किसी विवादित पहचान को निश्चित नहीं करता; निश्चित लेख को प्रसंगानुकूल ‘उस’ से व्यक्त किया गया है।
- source_word: אֲשֶׁר לֹא עָמַלְתָּ בּוֹ
  choice: जिसके लिए तुमने परिश्रम नहीं किया
  rationale: עמל श्रम या कठिन परिश्रम को दर्शाता है। यह वाक्यांश इस बात पर बल देता है कि योना ने उस पौधे के लिए कोई श्रम नहीं किया था।
- source_word: וְלֹא גִדַּלְתּוֹ
  choice: और जिसे तुमने बढ़ाया नहीं
  rationale: גדל का पिअल रूप यहाँ किसी को बढ़ाने या उगाने का कारण बनने का अर्थ देता है। यह अनुवाद पौधे की वृद्धि में योना की कोई भूमिका न होने को सुरक्षित रखता है।
- source_word: שֶׁבִּן לַיְלָה הָיָה
  choice: वह एक ही रात में हुआ
  rationale: शाब्दिक मुहावरा ‘एक रात का पुत्र’ अत्यल्प समय में अस्तित्व में आने को बताता है। ‘एक ही रात में हुआ’ היה के व्यापक अर्थ को बनाए रखता है और अनावश्यक रूप से अंकुरित होने की विशेष क्रिया नहीं जोड़ता।
- source_word: וּבִן לַיְלָה אָבָד
  choice: और एक ही रात में नष्ट हो गया
  rationale: אבד का अर्थ नष्ट होना, मिट जाना या खो जाना हो सकता है। ‘नष्ट हो गया’ पौधे के अंत को स्पष्ट करता है और पहले खंड के साथ संक्षिप्त समानांतरता बनाए रखता है।
- source_word: וַיֹּאמֶר
  choice: तब ... ने कहा
  rationale: वाव-क्रमागत कथा को आगे बढ़ाता है; ‘तब’ हिन्दी में घटनाक्रम की स्वाभाविक प्रगति व्यक्त करता है।
theological_decisions:
- issue: परमेश्वर के नाम का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: יהוה को व्यक्तिगत वाचा-नाम के रूप में लिप्यंतरित किया गया है। इससे मूल का नाम सुरक्षित रहता है और उसे किसी उपाधि से बदला नहीं जाता।
- issue: योना की पौधे के प्रति भावना
  choice: तरस खाया
  alternative: दया की; उसकी चिंता की
  rationale: חוס में दया, करुणा और बचाए रखने की चिंता के अर्थ समाहित हो सकते हैं। ‘तरस खाया’ अर्थ को किसी विशेष धर्मवैज्ञानिक व्याख्या तक सीमित किए बिना अगले पद की अपेक्षित समानांतरता बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘एक ही रात में’ की पुनरावृत्ति मूल इब्रानी की संतुलित, तीखी तुलना को बनाए रखती है। पादटिप्पणी-चिह्न पौधे के तुरंत बाद रखा गया है, क्योंकि टिप्पणी उसी अनिश्चित वनस्पति-संज्ञा से संबंधित है।
