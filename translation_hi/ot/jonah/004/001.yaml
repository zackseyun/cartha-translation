lexical_decisions:
- source_word: וַיֵּרַע אֶל־יוֹנָה רָעָה גְדוֹלָה
  choice: यह योना को बहुत बुरा लगा
  rationale: यह स्वाभाविक हिन्दी में उस इब्रानी मुहावरे का भाव व्यक्त करता है जिसके अनुसार पिछली घटना योना को अत्यन्त अनुचित या अप्रिय लगी। ‘बुरा’ चुनने से רעע/רָעָה की पुनरुक्ति की कुछ प्रतिध्वनि बनी रहती है, जबकि कथाकार की ओर से परमेश्वर के कार्य को वस्तुगत रूप से ‘बुराई’ कहने का भ्रामक अर्थ नहीं निकलता।
- source_word: יוֹנָה
  choice: योना
  rationale: व्यक्तिवाचक नाम का प्रचलित हिन्दी बाइबलीय लिप्यंतरण।
- source_word: וַיִּחַר לוֹ
  choice: वह क्रोधित हो उठा
  rationale: यह ‘उसके लिए जल उठा’ जैसे शाब्दिक इब्रानी मुहावरे को सहज आधुनिक हिन्दी में व्यक्त करता है और क्रोध के आरम्भ तथा तीव्र प्रतिक्रिया—दोनों का संकेत देता है।
- source_word: וַ
  choice: पर ... और
  rationale: पहला संयोजक पिछले पद में परमेश्वर के दया करने और यहाँ योना की विपरीत प्रतिक्रिया के बीच तीखा विरोध दिखाता है; दूसरा घटनाक्रम को आगे बढ़ाता है।
theological_decisions:
- issue: क्या רָעָה को वस्तुगत नैतिक निर्णय ‘बुराई’ के रूप में प्रस्तुत किया जाए या योना की प्रतिक्रिया के रूप में
  choice: 'योना की व्यक्तिनिष्ठ प्रतिक्रिया: ‘यह योना को बहुत बुरा लगा’'
  alternative: ‘यह योना के लिए एक बड़ी बुराई थी’
  rationale: संदर्भ में कथाकार परमेश्वर की दया को बुराई घोषित नहीं कर रहा, बल्कि उसके प्रति योना की प्रतिक्रिया बता रहा है। चुना हुआ पाठ उस भेद को स्पष्ट रखता है, जबकि पादटिप्पणी इब्रानी की तीखी शब्दावली और शब्दालंकार को सुरक्षित रखती है।
