  text: Then God said to Jonah[a], “Is it right for you to be angry about the plant?” And he said, “It is right for me to be angry, even to death.”
translation:
  language: hi
  text: तब परमेश्वर ने योना से कहा, “क्या उस पौधे[a] के बारे में तुम्हारा क्रोधित होना उचित है?” उसने कहा, “मेरा क्रोधित होना उचित है—मृत्यु तक।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी शब्द קִיקָיוֹן (कीकायोन) किस प्रजाति के पौधे को दर्शाता है, यह निश्चित नहीं है। परंपरागत अनुवादों में इसे ‘लौकी’ या ‘बेल’ कहा गया है; कुछ लोग इसे अरंडी का पौधा मानते हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: הַהֵיטֵב חָרָה לְךָ
  choice: क्या तुम्हारा क्रोधित होना उचित है
  rationale: यह इब्रानी मुहावरा योना के क्रोध के औचित्य पर प्रश्न करता है। यह हिन्दी रूप अर्थ को स्वाभाविक ढंग से व्यक्त करता है और प्रश्न की नैतिक धार बनाए रखता है।
- source_word: עַל הַקִּיקָיוֹן
  choice: उस पौधे के कारण
  rationale: עַל यहाँ क्रोध के कारण या विषय को बताता है। קִיקָיוֹן की प्रजाति अनिश्चित है, इसलिए मुख्य पाठ में सामान्य शब्द ‘पौधा’ अनावश्यक वनस्पति-सटीकता से बचता है।
- source_word: הֵיטֵב חָרָה לִי
  choice: मेरा क्रोधित होना उचित है
  rationale: उत्तर में योना परमेश्वर के प्रश्न की भाषा दोहराकर अपने क्रोध को उचित ठहराता है; समान हिन्दी संरचना इस समानांतरता को सुरक्षित रखती है।
- source_word: עַד מָוֶת
  choice: यहाँ तक कि मर जाने की हद तक
  rationale: वाक्यांश क्रोध की चरम तीव्रता व्यक्त करता है। यह रूप इस अस्पष्टता को पूरी तरह समाप्त नहीं करता कि योना मृत्यु तक क्रोधित होने की बात कहता है या मरने जितना क्रोधित होने की।
- source_word: וַיֹּאמֶר
  choice: तब ... कहा / उसने कहा
  rationale: पहला रूप कथा को आगे बढ़ाता है; दूसरे में निकटवर्ती कर्ता योना संदर्भ से स्पष्ट है, इसलिए स्वाभाविक सर्वनाम रखा गया है।
theological_decisions:
- issue: परमेश्वर के प्रश्न और योना के उत्तर में क्रोध का नैतिक मूल्यांकन
  choice: ‘उचित’ के द्वारा क्रोध के औचित्य को व्यक्त करना
  alternative: ‘क्या क्रोधित होकर तुम अच्छा करते हो?’ जैसा अधिक शब्दशः रूप
  rationale: הַהֵיטֵב חָרָה का आशय केवल क्रोध के अस्तित्व से नहीं, बल्कि उसके उचित या न्यायसंगत होने से है। ‘उचित’ कथा के नैतिक टकराव को बिना अतिरिक्त व्याख्या के स्पष्ट करता है।
- issue: קִיקָיוֹן की पहचान
  choice: मुख्य पाठ में ‘पौधा’
  alternative: लौकी, बेल, अरंडी का पौधा, या ‘कीकायोन’
  rationale: वनस्पति की सटीक पहचान अनिश्चित है। सामान्य शब्द मूल की अनिश्चितता बनाए रखता है और किसी विशिष्ट पहचान को सिद्ध तथ्य नहीं बनाता।
- issue: עַד מָוֶת का अर्थ
  choice: ‘यहाँ तक कि मर जाने की हद तक’
  alternative: ‘मृत्यु तक’ या ‘मैं इतना क्रोधित हूँ कि मरना चाहता हूँ’
  rationale: मूल तीव्रता तो स्पष्ट करता है, पर यह निश्चित नहीं करता कि योना मृत्यु की इच्छा स्पष्ट रूप से जता रहा है। चुना हुआ रूप इस तनाव को बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण और सामान्य पाठकों के लिए बोधगम्य शैली। ‘परमेश्वर’ कथात्मक संदर्भ के अनुरूप है। मुख्य पाठ में वनस्पति की अनिश्चित पहचान को सामान्य शब्द से रखा गया है और विकल्प पाद-टिप्पणी में दिए गए हैं।
