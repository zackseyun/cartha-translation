    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: तब ... ने कहा
  rationale: वाव-क्रमागत कथानक को आगे बढ़ाता है; आधुनिक हिन्दी कथन में “तब” स्वाभाविक रूप से इस प्रगति को व्यक्त करता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: परमेश्वर के व्यक्तिगत नाम को उपाधि से बदलने के बजाय हिन्दी में प्रचलित लिप्यंतरण “यहोवा” रखा गया है।
- source_word: הֲהֵיטֵב
  choice: क्या ... उचित है
  rationale: प्रश्नवाचक कण के साथ יטב का हिफ़ील infinitive absolute यहाँ औचित्य या उचितता का मूल्यांकन करता है; “उचित है” इस भाव को साफ़ और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: חָרָה
  choice: क्रोधित होना
  rationale: मूल क्रिया में जलने या भड़कने का रूपक है, पर इस मुहावरे में इसका अर्थ क्रोध करना है; मुख्य पाठ में मुहावरे का आशय दिया गया है।
- source_word: לָךְ
  choice: तुम्हारा
  rationale: ל के साथ द्वितीय पुरुष प्रत्यय सम्बद्ध व्यक्ति को सूचित करता है। “तुम्हारा क्रोधित होना” हिन्दी में प्रश्न को स्वाभाविक बनाता है और योना को सीधे संबोधित किए जाने का भाव बनाए रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवेह
  rationale: व्यक्तिगत ईश्वरीय नाम को “प्रभु” जैसी उपाधि से प्रतिस्थापित नहीं किया गया। “यहोवा” आधुनिक हिन्दी बाइबल-पाठकों में व्यापक रूप से पहचाना जाने वाला रूप है।
- issue: הֲהֵיטֵב חָרָה לָךְ प्रश्न का आशय
  choice: “क्या तुम्हारा क्रोधित होना उचित है?”—क्रोध के औचित्य पर प्रश्न
  alternative: “क्या क्रोधित होकर तुम अच्छा करते हो?”
  rationale: इब्रानी प्रश्न केवल योना के क्रोधित होने की स्थिति नहीं पूछता, बल्कि उसके क्रोध की उचितता को चुनौती देता है। चुना हुआ पाठ इस ताड़नापूर्ण मूल्यांकन को बिना अतिरिक्त व्याख्या जोड़े सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक, सरल और गरिमापूर्ण रखी गई है। प्रश्न का संक्षिप्त ताड़नापूर्ण स्वर सुरक्षित है; अधिक शब्दशः इब्रानी अभिव्यक्ति पादटिप्पणी में दी गई है।
