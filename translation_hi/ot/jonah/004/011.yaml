source:
  edition: WLC
  text: וַֽ/אֲנִי֙ לֹ֣א אָח֔וּס עַל נִינְוֵ֖ה הָ/עִ֣יר הַ/גְּדוֹלָ֑ה אֲשֶׁ֣ר יֶשׁ בָּ֡/הּ הַרְבֵּה֩ מִֽ/שְׁתֵּים עֶשְׂרֵ֨ה רִבּ֜וֹ אָדָ֗ם אֲשֶׁ֤ר לֹֽא יָדַע֙ בֵּין יְמִינ֣/וֹ לִ/שְׂמֹאל֔/וֹ וּ/בְהֵמָ֖ה רַבָּֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jonah/004/011.yaml
  text: And should I not have compassion on Nineveh[a], the great city, in which there are more than one hundred twenty thousand people who do not know their right hand from their left[b], and many animals?
translation:
  language: hi
  text: और क्या मैं नीनवे[a] पर तरस न खाऊँ—उस बड़े नगर पर, जिसमें एक लाख बीस हज़ार से अधिक ऐसे मनुष्य हैं जो अपने दाएँ और बाएँ का भेद नहीं जानते[b], और बहुत-से पशु भी हैं?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “क्या मैं नीनवे को बख्श न दूँ?”
    reason: lexical_alternative
  - marker: b
    text: “अपने दाएँ और बाएँ का भेद नहीं जानते” से विशेष रूप से छोटे बच्चों का, या अधिक सामान्य रूप से विवेक की कमी वाले लोगों का संकेत हो सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: אָחוּס
  choice: तरस खाऊँ
  rationale: חוּס में दया करने, तरस खाने और विनाश से बचाने—इन अर्थों का क्षेत्र है। संदर्भ में परमेश्वर की करुणामय चिंता प्रमुख है; ‘तरस खाऊँ’ स्वाभाविक हिन्दी में इसे व्यक्त करता है, जबकि ‘बचा छोड़ूँ’ की वैध संभावना पादटिप्पणी में रखी गई है।
- source_word: הָעִיר הַגְּדוֹלָה
  choice: उस बड़े नगर
  rationale: यह हिब्रू के निश्चित पदबंध को स्वाभाविक हिन्दी में प्रस्तुत करता और योना की पुस्तक में नीनवे के बार-बार ‘बड़ा नगर’ कहे जाने की साहित्यिक प्रतिध्वनि बनाए रखता है।
- source_word: הַרְבֵּה מִשְׁתֵּים עֶשְׂרֵה רִבּוֹ
  choice: एक लाख बीस हज़ार से अधिक
  rationale: हिब्रू का शाब्दिक संख्यात्मक रूप ‘बारह दस-हज़ार से अधिक’ है। चुना गया रूप आधुनिक हिन्दी में स्पष्ट और ठीक समतुल्य है।
- source_word: אָדָם
  choice: मनुष्य
  rationale: यह नीनवे की गिनी हुई मानव जनसंख्या को दर्शाता है और लिंग-विशेष तक अर्थ को सीमित नहीं करता।
- source_word: אֲשֶׁר לֹא יָדַע בֵּין יְמִינוֹ לִשְׂמֹאלוֹ
  choice: जो अपने दाएँ और बाएँ का भेद नहीं जानते
  rationale: यह मूल बिंब को बनाए रखते हुए हिन्दी का स्वाभाविक मुहावरेदार रूप है और यह तय नहीं करता कि संकेत छोटे बच्चों की ओर है या व्यापक विवेकहीनता की ओर।
- source_word: וּבְהֵמָה רַבָּה
  choice: और बहुत-से पशु भी
  rationale: בְּהֵמָה सामान्यतः पशुओं, विशेषकर पालतू पशुओं, को सूचित कर सकता है। ‘पशु’ अनावश्यक रूप से इसे केवल मवेशियों तक सीमित नहीं करता; ‘भी’ मनुष्यों के साथ उनके आश्चर्यजनक समावेश को स्वाभाविक हिन्दी में स्पष्ट करता है।
theological_decisions:
- issue: ‘अपने दाएँ और बाएँ का भेद नहीं जानते’ का संदर्भ
  choice: अभिव्यक्ति को बिना किसी एक व्याख्या तक सीमित किए बनाए रखा गया है।
  alternative: इसे विशेषतः छोटे बच्चे समझना, अथवा सामान्य रूप से नैतिक या आत्मिक विवेक से रहित निवासी समझना।
  rationale: हिब्रू दोनों समझों की अनुमति देता है। मुख्य पाठ मूल की वास्तविक अस्पष्टता को सुरक्षित रखता है और पादटिप्पणी पाठक को दोनों प्रमुख संभावनाओं से अवगत कराती है।
- issue: אָחוּס में व्यक्त परमेश्वर का भाव
  choice: करुणामय चिंता को ‘तरस खाऊँ’ से व्यक्त किया गया है।
  alternative: ‘नीनवे को बचा छोड़ूँ।’
  rationale: पौधे के लिए योना की चिंता और नीनवे के लिए परमेश्वर की चिंता के विरोध में करुणा का भाव प्रमुख है। फिर भी क्रिया में विनाश से बख्श देने का अर्थ भी संभव है, इसलिए उसे पादटिप्पणी में रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और मौखिक रूप से सहज वाक्य-विन्यास अपनाया गया है। आरंभिक ‘और’ हिब्रू के कथात्मक संबंध को बनाए रखता है। प्रश्नवाचक संरचना और डैश नीनवे के बाद आने वाली व्याख्यात्मक सामग्री को स्पष्ट करते हैं; मूल की अंतिम, खुली हुई दैवी चुनौती को किसी अतिरिक्त निष्कर्ष से नहीं भरा गया है।
