  text: וַ/יְהִ֣י כִּ/זְרֹ֣חַ הַ/שֶּׁ֗מֶשׁ וַ/יְמַ֨ן אֱלֹהִ֜ים ר֤וּחַ קָדִים֙ חֲרִישִׁ֔ית וַ/תַּ֥ךְ הַ/שֶּׁ֛מֶשׁ עַל רֹ֥אשׁ יוֹנָ֖ה וַ/יִּתְעַלָּ֑ף וַ/יִּשְׁאַ֤ל אֶת נַפְשׁ/וֹ֙ לָ/מ֔וּת וַ/יֹּ֕אמֶר ט֥וֹב מוֹתִ֖/י מֵ/חַיָּֽ/י׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jonah/004/008.yaml
  text: When the sun rose[a], God appointed a scorching east wind, and the sun beat down on Jonah’s head so that he grew faint. And he asked that he might die, and said[b], “My death is better than my life.”
translation:
  language: hi
  text: जब सूरज उगा, तब परमेश्वर ने झुलसाने वाली[a] पूर्वी हवा भेजी। सूरज योना के सिर पर ऐसा तपा कि वह निढाल हो गया। उसने मर जाने की विनती की और कहा, “मेरे लिए जीने से मरना अच्छा है।”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उमस भरी पूर्वी हवा” या “प्रचंड पूर्वी हवा।” इब्रानी विशेषण दुर्लभ है और उसका अर्थ निश्चित नहीं है; यहाँ प्रसंग की दमनकारी गर्मी के कारण “झुलसाने वाली” चुना गया है।
    reason: lexical_alternative
  - marker: b
    text: शब्दशः, “मेरी मृत्यु मेरे जीवन से अच्छी है।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כִּזְרֹחַ הַשֶּׁמֶשׁ
  choice: जब सूरज निकला
  rationale: यह स्वाभाविक हिन्दी में इब्रानी कथात्मक समय-संबंध को स्पष्ट रूप से व्यक्त करता है।
- source_word: וַיְמַן
  choice: भेजी
  rationale: यहाँ क्रिया परमेश्वर द्वारा प्राकृतिक साधन को किसी उद्देश्य से नियोजित करने का भाव रखती है। हवा के साथ ‘भेजी’ सहज हिन्दी है और परमेश्वर की सक्रिय व्यवस्था को बनाए रखती है।
- source_word: רוּחַ קָדִים
  choice: पूर्वी हवा
  rationale: यह वाक्यांश पूर्व दिशा से आनेवाली हवा को दर्शाता है; ‘पूर्वी हवा’ आधुनिक मानक हिन्दी में स्पष्ट और सहज है।
- source_word: חֲרִישִׁית
  choice: झुलसानेवाली
  rationale: यह दुर्लभ और कठिन विशेषण है। प्रसंग में हवा और धूप के कारण योना के निढाल होने पर बल है, इसलिए ‘झुलसानेवाली’ दमनकारी गर्मी का भाव व्यक्त करता है, जबकि अन्य सम्भव अर्थ पादटिप्पणी में सुरक्षित रखे गए हैं।
- source_word: וַתַּךְ הַשֶּׁמֶשׁ עַל רֹאשׁ יוֹנָה
  choice: सूरज योना के सिर पर इतनी तेज़ी से तपने लगा
  rationale: मूल में प्रहार करने का सजीव बिंब है। हिन्दी में यह अभिव्यक्ति सिर पर पड़ती तीखी धूप के शारीरिक प्रभाव को स्वाभाविक ढंग से व्यक्त करती है।
- source_word: וַיִּתְעַלָּף
  choice: वह निढाल हो गया
  rationale: क्रिया निर्बल या अचेत-सा हो जाने का भाव देती है। ‘निढाल’ तीव्र गर्मी से शक्ति चुकने को व्यक्त करता है, पर पूर्ण बेहोशी को अनिवार्य नहीं बनाता।
- source_word: וַיִּשְׁאַל אֶת נַפְשׁוֹ לָמוּת
  choice: उसने मर जाने की विनती की
  rationale: इब्रानी मुहावरे का आशय अपने लिए मृत्यु माँगना है। यह हिन्दी रूप उस आशय को बिना कृत्रिम शब्दशः संरचना के व्यक्त करता है।
- source_word: טוֹב מוֹתִי מֵחַיָּי
  choice: मेरे लिए जीने से मरना अच्छा है
  rationale: यह हिन्दी में स्वाभाविक तुलनात्मक कथन है और योना की संक्षिप्त, तीखी घोषणा को बनाए रखता है; मूल की अधिक शब्दशः संरचना पादटिप्पणी में दी गई है।
theological_decisions:
- issue: וַיְמַן אֱלֹהִים में परमेश्वर की सक्रिय भूमिका
  choice: परमेश्वर ने ... पूर्वी हवा भेजी
  alternative: परमेश्वर ने ... पूर्वी हवा नियुक्त की / तैयार की
  rationale: पाठ परमेश्वर को प्राकृतिक साधन को उद्देश्यपूर्वक निर्देशित करते हुए प्रस्तुत करता है। ‘भेजी’ आधुनिक हिन्दी में सहज रहते हुए इस सक्रिय दैवी व्यवस्था को व्यक्त करता है और पाठ से परे कोई व्यापक धर्मसैद्धान्तिक दावा नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण कथात्मक स्वर रखा गया है। ‘निढाल’ सामान्य पाठक के लिए स्पष्ट है और पूर्ण बेहोशी का अनावश्यक निष्कर्ष नहीं निकालता। कठिन इब्रानी विशेषण की वास्तविक अनिश्चितता पादटिप्पणी में सुरक्षित है।
