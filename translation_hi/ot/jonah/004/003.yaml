id: JON.4.3
reference: Jonah 4:3
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/עַתָּ֣ה יְהוָ֔ה קַח נָ֥א אֶת נַפְשִׁ֖/י מִמֶּ֑/נִּי כִּ֛י ט֥וֹב מוֹתִ֖/י מֵ/חַיָּֽ/י־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jonah/004/003.yaml
  text: And now[a], Yahweh, please take my life from me, for my dying is better than my living.
translation:
  language: hi
  text: और अब, हे याहवे, कृपा करके मेरा जीवन मुझसे ले ले, क्योंकि मेरा मरना मेरे जीने से अच्छा है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक मुहावरेदार ढंग से: “क्योंकि मेरे लिए मरना जीने से अच्छा है।”'
    reason: मुख्य पाठ में मूल के ‘मेरा मरना/मेरा जीना’ वाले संज्ञात्मक समानांतर रूप को रखा गया है; टिप्पणी अधिक सहज हिंदी विकल्प देती है।
lexical_decisions:
- source_word: וְעַתָּה
  choice: और अब
  rationale: संयोजक וְ और कालवाचक עַתָּה—दोनों को रखते हुए यह योना की प्रार्थना को पिछली बात से जोड़ता और उसकी तात्कालिकता व्यक्त करता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: मूल पाठ में आए परमेश्वर के व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय देवनागरी में लिप्यंतरित किया गया है।
- source_word: קַח נָא
  choice: कृपा करके ... ले ले
  rationale: आज्ञार्थक קַח के साथ נָא विनती का भाव जोड़ता है। यह हिंदी में आग्रहपूर्ण किंतु स्वाभाविक अभिव्यक्ति है।
- source_word: אֶת נַפְשִׁי
  choice: मेरा जीवन
  rationale: इस प्रसंग में נֶפֶשׁ किसी अमूर्त आत्मिक तत्त्व के बजाय योना के जीवित जीवन को सूचित करता है।
- source_word: מִמֶּנִּי
  choice: मुझसे
  rationale: 'מִן अलग किए जाने का भाव व्यक्त करता है: योना चाहता है कि उसका जीवन उससे ले लिया जाए।'
- source_word: כִּי
  choice: क्योंकि
  rationale: यह योना की विनती का कारण प्रस्तुत करता है।
- source_word: טוֹב ... מִן
  choice: '... से ... अच्छा है'
  rationale: हिब्रू में טוֹב के साथ तुलनात्मक מִן है; हिंदी की ‘से ... अच्छा’ रचना उसी तुलना को स्वाभाविक रूप से व्यक्त करती है।
- source_word: מוֹתִי
  choice: मेरा मरना
  rationale: प्रथम पुरुष प्रत्यययुक्त संज्ञात्मक रूप को रखा गया है और इसे समानांतर ‘मेरा जीना’ के अनुरूप बनाया गया है।
- source_word: מֵחַיָּי
  choice: मेरे जीने से
  rationale: तुलनात्मक מִן और प्रथम पुरुष प्रत्यययुक्त ‘जीवन’ का अर्थ रखते हुए यह ‘मेरा मरना’ के साथ मूल की संज्ञात्मक समानांतरता बनाए रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: प्रभु
  rationale: यहाँ मूल पाठ व्यक्तिगत ईश्वरीय नाम का स्पष्ट प्रयोग करता है; ‘याहवे’ उस नाम को सुरक्षित रखता है, जबकि ‘प्रभु’ उसे एक उपाधि से बदल देता।
- issue: נֶפֶשׁ का आशय
  choice: जीवन
  alternative: प्राण / आत्मा
  rationale: मृत्यु की माँग वाले इस संदर्भ में शब्द का आशय योना का जीवन है; ‘आत्मा’ यहाँ अनावश्यक रूप से शरीर और अमूर्त आत्मा के बीच दार्शनिक भेद ला सकता है।
translation_notes:
  register: भाषा आधुनिक, सम्मानपूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। ‘हे याहवे’ संबोधन की गंभीरता को व्यक्त करता है; ‘कृपा करके’ נָא की विनती को स्वाभाविक हिंदी देता है। अंतिम वाक्यांश में सामान्य बोलचाल की अपेक्षा थोड़ा अधिक औपचारिक समानांतर ढाँचा जानबूझकर रखा गया है ताकि हिब्रू के מוֹתִי / חַיָּי का तनाव और संरचना सुरक्षित रहे।
