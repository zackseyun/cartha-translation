- source_word: תַּחְתֶּיהָ בַּצֵּל
  choice: उसके नीचे छाया में
  rationale: यह अनुवाद आश्रय के नीचे होने और धूप से मिलने वाली छाया—दोनों बातों को बनाए रखता है।
- source_word: עַד אֲשֶׁר יִרְאֶה
  choice: तब तक ... जब तक वह यह न देख ले
  rationale: यह रचना योना के प्रतीक्षा करने और भावी परिणाम देखने की मंशा को स्वाभाविक हिन्दी में व्यक्त करती है।
- source_word: מַה יִּהְיֶה בָּעִיר
  choice: नगर का क्या होगा
  rationale: शाब्दिक अर्थ ‘नगर में क्या होगा’ हो सकता है, पर प्रसंग में नगर के परिणाम या दशा का प्रश्न प्रमुख है; हिन्दी में ‘नगर का क्या होगा’ इस संभावित व्यापक अर्थ को संक्षेप में बनाए रखता है।
