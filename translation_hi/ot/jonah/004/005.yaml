  text: Then Jonah went out from the city and sat east of the city[b][a]. There he made himself a shelter and sat under it in the shade until he would see what would happen in the city.
translation:
  language: hi
  text: तब योना नगर से बाहर निकला और नगर के पूर्व में जा बैठा। वहाँ उसने अपने लिए एक अस्थायी आश्रय[a] बनाया और उसके नीचे छाया में तब तक बैठा रहा, जब तक वह यह न देख ले कि नगर का क्या होगा[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘झोंपड़ी’ या ‘मंडप’। इब्रानी शब्द प्रायः शाखाओं आदि से बनाए गए अस्थायी आश्रय को दर्शाता है।
    reason: lexical_alternative
  - marker: b
    text: या ‘नगर में क्या होगा’।
    reason: lexical_alternative
