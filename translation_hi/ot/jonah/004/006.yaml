base_translation:
  language: en
  yaml_path: translation/ot/jonah/004/006.yaml
  text: And Yahweh God appointed a qiqayon plant[a], and it grew up over Jonah to be a shade over his head, to deliver him from his discomfort. And Jonah rejoiced over the qiqayon plant with great joy.
translation:
  language: hi
  text: तब याहवे परमेश्वर ने एक किकायोन पौधा[a] ठहराया, और वह योना के ऊपर उग आया, ताकि वह योना के सिर पर छाया करे और उसे उसके कष्ट से बचाए। योना उस किकायोन पौधे से बहुत आनन्दित हुआ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इब्रानी: किकायोन। इस पौधे की ठीक-ठीक पहचान अनिश्चित है; परंपरागत रूप से इसे ‘लता’ कहा गया है और कभी-कभी इसे अरंडी का पौधा माना जाता है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְמַן
  choice: ठहराया
  rationale: यह क्रिया योना की पुस्तक में मछली, पौधे, कीड़े और पुरवाई पर परमेश्वर के उद्देश्यपूर्ण अधिकार और व्यवस्था को व्यक्त करती है। ‘ठहराया’ उस भाव को सुरक्षित रखता है।
- source_word: יְהוָה אֱלֹהִים
  choice: याहवे परमेश्वर
  rationale: याहवे वाचा के विशिष्ट ईश्वरीय नाम को सीधे प्रस्तुत करता है, और אֱלֹהִים के लिए स्वाभाविक हिन्दी रूप ‘परमेश्वर’ है।
- source_word: קִיקָיוֹן
  choice: किकायोन का पौधा
  rationale: इस वनस्पति की पहचान अनिश्चित है। लिप्यंतरण मूल शब्द की विशिष्टता और अनिश्चितता दोनों बनाए रखता है; ‘पौधा’ अर्थ स्पष्ट करता है।
- source_word: וַיַּעַל מֵעַל לְיוֹנָה
  choice: वह योना के ऊपर उग आया
  rationale: वनस्पति के संदर्भ में עלה के ऊपर आने अथवा बढ़ने के भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: לִהְיוֹת צֵל עַל רֹאשׁוֹ
  choice: ताकि उसके सिर पर छाया हो
  rationale: उद्देश्यसूचक रचना और צֵל के सीधे अर्थ ‘छाया’ को सुरक्षित रखता है।
- source_word: לְהַצִּיל לוֹ מֵרָעָתוֹ
  choice: उसे उसके कष्ट से बचाए
  rationale: רָעָה का अर्थ बुराई, विपत्ति, परेशानी या कष्ट हो सकता है। यहाँ छाया के प्रसंग में ‘कष्ट’ शारीरिक दुर्दशा को स्वाभाविक रूप से व्यक्त करता है, जबकि ‘बचाए’ הציל की शक्ति बनाए रखता है।
- source_word: וַיִּשְׂמַח ... שִׂמְחָה גְדוֹלָה
  choice: बहुत ही आनन्दित हुआ
  rationale: मूल के सजातीय कर्म द्वारा दिए गए प्रबल बलाघात को सहज आधुनिक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा / प्रभु
  rationale: मूल पाठ में वाचा का विशिष्ट नाम सीधे आया है। ‘याहवे’ उसे किसी उपाधि में बदले बिना प्रस्तुत करता है।
- issue: רָעָתוֹ में नैतिक या परिस्थितिजन्य अर्थ
  choice: उसके कष्ट
  alternative: उसकी बुराई / उसकी विपत्ति
  rationale: पौधे की छाया और तत्काल शारीरिक परिस्थिति के कारण यहाँ परिस्थितिजन्य कष्ट प्रमुख है; फिर भी ‘कष्ट’ इतना व्यापक है कि पद की भावात्मक तीव्रता नष्ट नहीं होती।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। ‘ठहराया’ पुस्तक में बार-बार आने वाली परमेश्वर की उद्देश्यपूर्ण व्यवस्था की भाषा को बनाए रखता है; वनस्पति की अनिश्चित पहचान फुटनोट में स्पष्ट की गई है।
