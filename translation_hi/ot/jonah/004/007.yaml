id: JON.4.7
reference: Jonah 4:7
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יְמַ֤ן הָֽ/אֱלֹהִים֙ תּוֹלַ֔עַת בַּ/עֲל֥וֹת הַ/שַּׁ֖חַר לַֽ/מָּחֳרָ֑ת וַ/תַּ֥ךְ אֶת הַ/קִּֽיקָי֖וֹן וַ/יִּיבָֽשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/jonah/004/007.yaml
  text: But God appointed a worm at the rising of dawn the next day[a], and it struck the plant so that it withered.
translation:
  language: hi
  text: परन्तु अगले दिन भोर होते समय परमेश्वर ने एक कीड़ा ठहराया। और कीड़े ने उस पौधे[a] पर ऐसा आघात किया कि पौधा सूख गया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘अरंडी का पौधा’। इब्रानी शब्द ‘क़ीकायोन’ किसी विशेष पौधे को सूचित करता है, पर उसकी ठीक-ठीक पहचान अनिश्चित है।
    reason: वनस्पति-संबंधी शब्द की सटीक पहचान अनिश्चित होने के कारण पारंपरिक सम्भावना दी गई है।
lexical_decisions:
- source_word: וַיְמַן
  choice: ठहराया
  rationale: यह क्रिया परमेश्वर द्वारा किसी साधन को जानबूझकर नियुक्त करने का भाव रखती है। ‘ठहराया’ दैवी उद्देश्य को बनाए रखता है और केवल अनुमति देने का अर्थ नहीं देता।
- source_word: הָאֱלֹהִים
  choice: परमेश्वर
  rationale: मूल पाठ में אֱלֹהִים है, न कि יהוה; आधुनिक गरिमापूर्ण हिन्दी में ‘परमेश्वर’ इसका स्वाभाविक अनुवाद है।
- source_word: תּוֹלַעַת
  choice: एक कीड़ा
  rationale: यह शब्द सामान्य रूप से कृमि या कीड़े जैसे जीव को दर्शाता है; प्रजाति को अनावश्यक रूप से निश्चित नहीं किया गया।
- source_word: בַּעֲלוֹת הַשַּׁחַר לַמָּחֳרָת
  choice: अगले दिन भोर होते समय
  rationale: यह मूल के ‘अगले दिन भोर के उदय होने पर’ वाले समय-संबंध को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וַתַּךְ
  choice: उस पर ऐसा आघात किया
  rationale: नכה का मूल अर्थ ‘मारना/प्रहार करना’ है। ‘आघात किया’ उस सशक्त क्रिया को बनाए रखता है, जबकि परिणामवाचक रचना पौधे की क्षति स्पष्ट करती है।
- source_word: הַקִּיקָיוֹן
  choice: उस पौधे
  rationale: קִיקָיוֹן की सटीक वनस्पति-पहचान अनिश्चित है। ‘पौधा’ झूठी निश्चितता से बचता है और प्रसंग से इसका संबंध स्पष्ट रखता है।
- source_word: וַיִּיבָשׁ
  choice: वह सूख गया
  rationale: यह क्रिया सूखने या मुरझाने को दर्शाती है। ‘सूख गया’ मूल अर्थ का सीधा और स्वाभाविक हिन्दी रूप है।
theological_decisions:
- issue: योना की परिस्थितियों में परमेश्वर की सक्रिय भूमिका
  choice: परमेश्वर ने कीड़े को उद्देश्यपूर्वक ठहराया
  alternative: परमेश्वर ने केवल कीड़े को आने दिया
  rationale: וַיְמַן सक्रिय दैवी नियुक्ति व्यक्त करता है और योना 4 में पौधे, कीड़े और हवा को ठहराने की आवर्ती शैली के अनुरूप है; इसलिए अनुवाद इसे केवल दैवी अनुमति तक सीमित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। दो वाक्यों में विभाजन हिन्दी में कर्ता-संदर्भ स्पष्ट करता है। पाद-टिप्पणी का चिह्न उसी शब्द ‘पौधे’ पर रखा गया है जिसकी पहचान पर टिप्पणी लागू होती है।
