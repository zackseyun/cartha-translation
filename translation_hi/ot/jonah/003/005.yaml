id: JON.3.5
reference: Jonah 3:5
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַֽ/יַּאֲמִ֛ינוּ אַנְשֵׁ֥י נִֽינְוֵ֖ה בֵּֽ/אלֹהִ֑ים וַ/יִּקְרְאוּ צוֹם֙ וַ/יִּלְבְּשׁ֣וּ שַׂקִּ֔ים מִ/גְּדוֹלָ֖/ם וְ/עַד קְטַנָּֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jonah/003/005.yaml
  text: And the people of Nineveh believed God[a], and they proclaimed a fast and put on sackcloth, from their greatest to their least.
translation:
  language: hi
  text: और नीनवे के लोगों ने परमेश्वर पर विश्वास किया[a]। उन्होंने उपवास की घोषणा की और छोटे से लेकर बड़े तक सबने टाट ओढ़ लिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “परमेश्वर की बात पर विश्वास किया।” इब्रानी रचना परमेश्वर पर भरोसा करने के साथ-साथ उनकी बात को सच मानने का भाव भी व्यक्त कर सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּאֲמִינוּ ... בֵּאלֹהִים
  choice: परमेश्वर पर विश्वास किया
  rationale: हिफ़ील אמן के साथ ב किसी पर विश्वास करने या भरोसा रखने का भाव व्यक्त कर सकता है। हिंदी में ‘परमेश्वर पर विश्वास किया’ स्वाभाविक है और मूल की अर्थगत व्यापकता को बनाए रखता है।
- source_word: אַנְשֵׁי נִינְוֵה
  choice: नीनवे के लोगों
  rationale: शाब्दिक रूप ‘नीनवे के पुरुष’ है, पर प्रसंग में यह नगरवासियों का सामूहिक उल्लेख है; अंतिम पदबंध भी पूरे समुदाय की भागीदारी दिखाता है।
- source_word: וַיִּקְרְאוּ צוֹם
  choice: उपवास की घोषणा की
  rationale: קרא + צום सामुदायिक उपवास को सार्वजनिक रूप से घोषित करने का संकेत देता है।
- source_word: וַיִּלְבְּשׁוּ שַׂקִּים
  choice: टाट ओढ़ लिया
  rationale: שַׂקִּים शोक या दीनता के चिह्न के रूप में पहने जाने वाले खुरदरे टाट के वस्त्र हैं। ‘टाट ओढ़ लिया’ हिंदी बाइबलीय प्रयोग में स्पष्ट और स्वाभाविक है।
- source_word: מִגְּדוֹלָם וְעַד קְטַנָּם
  choice: छोटे से लेकर बड़े तक सबने
  rationale: यह विपरीत सिरों द्वारा समग्रता व्यक्त करने वाला पदबंध है। हिंदी का प्रचलित क्रम ‘छोटे से लेकर बड़े तक’ पूरे समुदाय की भागीदारी स्पष्ट करता है, और ‘सबने’ निहित समग्रता को स्वाभाविक रूप से व्यक्त करता है।
theological_decisions:
- issue: नीनवे के लोगों की प्रतिक्रिया का स्वरूप
  choice: ‘परमेश्वर पर विश्वास किया’ कहा गया है; इसे पश्चाताप, मन-परिवर्तन या उद्धारकारी विश्वास के रूप में विस्तृत नहीं किया गया।
  alternative: ‘परमेश्वर के सामने पश्चाताप किया’ या ‘परमेश्वर में उद्धारकारी विश्वास किया’
  rationale: पद स्वयं विश्वास, उपवास और टाट पहनने का वर्णन करता है। व्यापक कथा में पश्चाताप का भाव है, पर अनुवाद को इस पद के कथन से आगे धर्मवैज्ञानिक निष्कर्ष नहीं जोड़ना चाहिए।
translation_notes:
  register: आधुनिक मानक हिंदी में सरल, गरिमापूर्ण और सार्वजनिक पाठ के योग्य शैली रखी गई है। ‘टाट’ सांस्कृतिक रूप से स्थापित बाइबलीय शब्द है; क्रिया के साथ उसका अर्थ सहज रूप से स्पष्ट होता है।
