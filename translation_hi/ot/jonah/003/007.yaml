base_translation:
  language: en
  yaml_path: translation/ot/jonah/003/007.yaml
  text: 'And he proclaimed and said in Nineveh[a], by decree of the king and his nobles: “Let neither man nor beast, herd nor flock, taste anything. Let them not graze[b], and let them not drink water.”'
translation:
  language: hi
  text: 'उसने नीनवे में घोषणा की और कहा, “राजा और उसके सरदारों[a] के आदेश से: कोई मनुष्य[b] या पशु, गाय-बैल या भेड़-बकरी, कुछ भी न चखे। पशु न चरें और पानी न पिएँ।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक अर्थ, ‘राजा और उसके बड़े लोगों’; इसके अनुवाद ‘राजा और उसके अधिकारियों’ या ‘राजा और उसके कुलीनों’ भी हो सकते हैं।
    reason: lexical_alternative
  - marker: b
    text: यहाँ ‘मनुष्य’ इब्रानी आदाम का सामूहिक प्रयोग है, जिसका अर्थ सभी मनुष्य हैं और जिसका विरोध पशुओं से है।
    reason: lexical_clarification
lexical_decisions:
- source_word: וַיַּזְעֵק וַיֹּאמֶר
  choice: उसने ... यह घोषणा करवाई और कहलवाया
  rationale: हिफ़ईल रूप सार्वजनिक घोषणा करवाने का भाव देता है; साथ का וַיֹּאמֶר भी अलग रखा गया है, ताकि इब्रानी की दोहरी क्रिया पूरी तरह लुप्त न हो।
- source_word: מִטַּעַם
  choice: का आदेश है
  rationale: राजकीय-प्रशासनिक संदर्भ में यह शब्द अधिकृत निर्णय या आदेश को दर्शाता है; यह हिंदी में उद्घोषणा की स्वाभाविक शैली है।
- source_word: הַמֶּלֶךְ וּגְדֹלָיו
  choice: राजा और उसके सरदारों
  rationale: גְדֹלָיו का शाब्दिक अर्थ ‘उसके बड़े लोग’ है, पर संदर्भ में राजा के प्रमुख पदाधिकारी या कुलीन जन अभिप्रेत हैं; ‘सरदार’ अर्थ और गरिमा दोनों को स्वाभाविक हिंदी में रखता है।
- source_word: הָאָדָם וְהַבְּהֵמָה
  choice: कोई मनुष्य या पशु
  rationale: אָדָם यहाँ सामूहिक रूप से मानव जाति का प्रतिनिधि है और पशुओं से उसका विरोध है; ‘मनुष्य’ आधुनिक हिंदी में इस सामूहिक अर्थ को स्पष्ट रखता है।
- source_word: הַבָּקָר וְהַצֹּאן
  choice: गाय-बैल या भेड़-बकरी
  rationale: दोनों इब्रानी शब्द घरेलू पशुओं की व्यापक श्रेणियाँ हैं—बड़े मवेशी और छोटे पशु; हिंदी के युग्म इन्हें साधारण पाठक के लिए स्पष्ट करते हैं।
- source_word: אַל יִטְעֲמוּ מְאוּמָה
  choice: कुछ भी न चखे
  rationale: ‘चखना’ मूल क्रिया טעם को बनाए रखता है और इस संदर्भ में पूर्ण उपवास का प्रबल निषेध व्यक्त करता है।
- source_word: אַל יִרְעוּ וּמַיִם אַל יִשְׁתּוּ
  choice: वे न चरें और न पानी पिएँ
  rationale: רעה पशुओं के चरने के लिए सटीक है, और ‘पानी’ को मूल पाठ की तरह स्पष्ट रूप से रखा गया है।
theological_decisions:
- issue: אָדָם का सामूहिक मानव-अर्थ
  choice: मनुष्य
  alternative: मानवजाति / लोग
  rationale: एकवचन सामूहिक संज्ञा का मानव-पशु विरोध सुरक्षित रहता है, जबकि हिंदी में अनावश्यक रूप से केवल पुरुषों का अर्थ उत्पन्न नहीं होता।
- issue: राजा के साथ גְדֹלָיו की भूमिका
  choice: उसके सरदारों
  alternative: उसके बड़े लोगों / उसके अधिकारियों / उसके कुलीनों
  rationale: मूल शब्द उनकी प्रतिष्ठित और प्रमुख स्थिति बताता है, पर उनका सटीक प्रशासनिक पद निर्धारित नहीं करता; ‘सरदार’ उस हल्की अनिश्चितता को पर्याप्त रूप से बनाए रखता है।
translation_notes:
  register: भाषा राजकीय घोषणा के अनुरूप गरिमापूर्ण, किंतु आधुनिक और सहज रखी गई है। निषेधों की संक्षिप्त लय मूल आदेश की कठोरता को बनाए रखती है।
