reference: Jonah 3:3
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יָּ֣קָם יוֹנָ֗ה וַ/יֵּ֛לֶךְ אֶל נִֽינְוֶ֖ה כִּ/דְבַ֣ר יְהוָ֑ה וְ/נִֽינְוֵ֗ה הָיְתָ֤ה עִיר גְּדוֹלָה֙ לֵֽ/אלֹהִ֔ים מַהֲלַ֖ךְ שְׁלֹ֥שֶׁת יָמִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jonah/003/003.yaml
  text: So Jonah arose and went to Nineveh[a], according to the word of Yahweh. Now Nineveh was an exceedingly great city before God[b], a journey of three days.
translation:
  language: hi
  text: तब योना उठा और यहोवा के वचन के अनुसार नीनवे को गया। नीनवे परमेश्वर की दृष्टि में एक बहुत बड़ा नगर था[a]—तीन दिन की यात्रा के बराबर[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “एक अत्यन्त बड़ा नगर।” इब्रानी में शाब्दिक रूप से “परमेश्वर के लिए/परमेश्वर की दृष्टि में ‘एक बड़ा नगर’” है; यह अत्यधिक महानता या विशालता बताने वाला मुहावरा हो सकता है।
    reason: alternative_reading
  - marker: b
    text: इब्रानी वाक्यांश का अर्थ “तीन दिन की यात्रा” भी हो सकता है। इससे नगर को पार करने में लगने वाला समय या उसमें पूरा भ्रमण करने की अवधि अभिप्रेत हो सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  choice: उठा
  rationale: קום का यह कथात्मक रूप योना की आज्ञाकारी प्रतिक्रिया आरम्भ करता है; ‘उठा’ सरल है और 1:3 तथा 3:2–3 की पुनरावृत्ति बनाए रखता है।
- source_word: וַיֵּלֶךְ אֶל נִינְוֶה
  choice: नीनवे को गया
  rationale: הלך सामान्यतः ‘जाना/चलना’ है; यहाँ गंतव्य के साथ सीधा और स्वाभाविक हिन्दी रूप चुना गया है।
- source_word: כִּדְבַר יְהוָה
  choice: यहोवा के वचन के अनुसार
  rationale: यह रूप ‘यहोवा के वचन के अनुरूप’ का निकट अनुवाद है और आज्ञा के प्रति योना की अनुरूपता को स्पष्ट रखता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को हिन्दी में प्रचलित लिप्यंतरण ‘यहोवा’ से व्यक्त किया गया है, किसी उपाधि से प्रतिस्थापित नहीं किया गया।
- source_word: עִיר גְּדוֹלָה לֵאלֹהִים
  choice: परमेश्वर की दृष्टि में एक बहुत बड़ा नगर
  rationale: לֵאלֹהִים का शाब्दिक ईश्वर-संबंध बनाए रखते हुए वाक्यांश की संभावित अत्युत्तमता को ‘बहुत बड़ा’ से स्वाभाविक हिन्दी में व्यक्त किया गया है; वैकल्पिक मुहावरेदार अर्थ पादटिप्पणी में दिया गया है।
- source_word: מַהֲלַךְ שְׁלֹשֶׁת יָמִים
  choice: तीन दिन की यात्रा जितना
  rationale: מהלך यात्रा, चलने की दूरी या यात्रा-अवधि दर्शा सकता है। यह अनुवाद माप को बनाए रखता है, पर यह तय नहीं करता कि बात नगर को पार करने, उसके चारों ओर जाने या उसका पूरा दौरा करने की है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: प्रभु
  rationale: मूल पाठ में व्यक्तिगत नाम स्पष्ट रूप से आया है; इसलिए उसे उपाधि में बदलने के बजाय हिन्दी के परिचित लिप्यंतरण से रखा गया है।
- issue: עִיר גְּדוֹלָה לֵאלֹהִים में לֵאלֹהִים का अर्थ
  choice: परमेश्वर की दृष्टि में एक बहुत बड़ा नगर
  alternative: एक अत्यन्त बड़ा नगर
  rationale: इब्रानी में ‘परमेश्वर’ स्पष्ट है, जबकि वाक्यांश अत्युत्तमता का मुहावरा भी हो सकता है। मुख्य पाठ ईश्वर-संदर्भ और तीव्रता दोनों रखता है; पादटिप्पणी वैकल्पिक समझ बताती है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण कथात्मक रूप। ‘उठा और…गया’ से इब्रानी क्रिया-क्रम सुरक्षित है। कठिन ईश्वर-संबंधी मुहावरे और तीन दिन की यात्रा के भौगोलिक/कालिक आशय को अनावश्यक रूप से निश्चित नहीं किया गया।
