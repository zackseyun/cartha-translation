lexical_decisions:
- source_word: וַיְהִי
  choice: तब ... आया
  rationale: यह कथात्मक क्रम को आगे बढ़ाने वाला रूप है। शाब्दिक ‘और ऐसा हुआ’ की अपेक्षा ‘तब ... आया’ स्वाभाविक हिन्दी में क्रम और घटना दोनों व्यक्त करता है।
- source_word: דְבַר יְהוָה
  choice: यहोवा का वचन
  rationale: यह नबूवत संबंधी प्रचलित सूत्र है। ‘वचन’ मूल के शब्द और उसके धार्मिक-साहित्यिक अर्थ को ‘संदेश’ से अधिक निकटता से सुरक्षित रखता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: मूल में प्रयुक्त परमेश्वर के निज नाम को किसी उपाधि से बदलने के बजाय हिन्दी में प्रचलित रूप ‘यहोवा’ से व्यक्त किया गया है।
- source_word: אֶל יוֹנָה
  choice: योना के पास
  rationale: यहाँ אֶל उस व्यक्ति को सूचित करता है जिसे दिव्य वचन मिला। ‘योना के पास’ इस सूत्र का स्वाभाविक हिन्दी रूप है।
- source_word: שֵׁנִית
  choice: दूसरी बार
  rationale: यह क्रिया-विशेषण पहले दिए गए आदेश की पुनरावृत्ति को स्पष्ट करता है; ‘दूसरी बार’ उसकी सटीकता और कथात्मक बल बनाए रखता है।
- source_word: לֵאמֹר
  choice: ':'
  rationale: यह अगले पद में आने वाले कथन का परिचय देता है। हिन्दी में उद्धरणपूर्वक द्विबिंदु ‘यह कहते हुए’ की तुलना में अधिक स्वाभाविक है और वही कार्य करता है।
theological_decisions:
- issue: परमेश्वर के नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: मूल पाठ में निज नाम स्पष्ट रूप से आया है। ‘यहोवा’ आधुनिक हिन्दी बाइबलीय प्रयोग में पहचाना जाने वाला लिप्यंतरण है और इसे ‘प्रभु’ जैसी उपाधि से नहीं बदलता।
translation_notes:
  register: भाषा आधुनिक, सरल और गरिमापूर्ण रखी गई है। ‘वचन’ नबूवत संबंधी सूत्र को सुरक्षित रखता है, जबकि वाक्य-विन्यास स्वाभाविक हिन्दी के अनुरूप है।
