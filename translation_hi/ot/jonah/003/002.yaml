  text: ק֛וּם לֵ֥ךְ אֶל נִֽינְוֵ֖ה הָ/עִ֣יר הַ/גְּדוֹלָ֑ה וִּ/קְרָ֤א אֵלֶ֨י/הָ֙ אֶת הַ/קְּרִיאָ֔ה אֲשֶׁ֥ר אָנֹכִ֖י דֹּבֵ֥ר אֵלֶֽי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jonah/003/002.yaml
  text: Arise[a], go to Nineveh, the great city, and proclaim to it the proclamation that I speak to you.
translation:
  language: hi
  text: उठ, उस बड़े नगर नीनवे को जा, और उसे वह घोषणा सुना[a] जो मैं तुझसे कह रहा हूँ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसके विरुद्ध पुकार कर।” योना 1:2 में “के विरुद्ध” है, पर यहाँ इब्रानी पाठ में “उसे/उसकी ओर” कहा गया है; इसलिए मुख्य पाठ इस पद की शब्दावली को बनाए रखता है।
    reason: alternative_reading
lexical_decisions:
- source_word: ק֛וּם
  choice: उठ
  rationale: आज्ञार्थक क्रिया קום का स्वाभाविक और तात्कालिक हिन्दी रूप; यह आदेश की तत्परता बनाए रखता है।
- source_word: לֵ֥ךְ
  choice: जा
  rationale: गति-सूचक आज्ञा के लिए सीधा और स्वाभाविक हिन्दी समतुल्य।
- source_word: נִֽינְוֵ֖ה
  choice: नीनवे
  rationale: इब्रानी स्थान-नाम का हिन्दी में प्रचलित लिप्यंतरण।
- source_word: הָעִיר הַגְּדוֹלָה
  choice: उस बड़े नगर
  rationale: גדול के आकार और महत्त्व—दोनों संभावित भावों को ‘बड़ा’ खुला रखता है और पुस्तक की साहित्यिक पुनरावृत्ति को सुरक्षित रखता है।
- source_word: וּקְרָא אֵלֶיהָ
  choice: और उसे ... सुना
  rationale: אֶל का अर्थ यहाँ ‘को/की ओर’ है, ‘के विरुद्ध’ नहीं। ‘उसे ... सुना’ हिन्दी में संबोधित घोषणा को स्वाभाविक रूप से व्यक्त करता है।
- source_word: אֶת הַקְּרִיאָה
  choice: वह घोषणा
  rationale: קְרִיאָה किसी घोषित पुकार या उद्घोषणा को दर्शाता है; ‘घोषणा’ औपचारिक आशय को बनाए रखता है, जबकि ‘वह’ निश्चित पद को व्यक्त करता है।
- source_word: אֲשֶׁר אָנֹכִי דֹבֵר אֵלֶיךָ
  choice: जो मैं तुझसे कह रहा हूँ
  rationale: दिव्य वचन में एकवचन संबोधन को ‘तुझसे’ बनाए रखा गया है। कृदन्त דֹבֵר के वर्तमान/अपूर्णतात्मक भाव को ‘कह रहा हूँ’ स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
theological_decisions:
- issue: योना के संदेश का नीनवे से संबंध
  choice: उसे वह घोषणा सुना
  alternative: उसके विरुद्ध पुकार
  rationale: इस पद में इब्रानी पूर्वसर्ग אֶל (‘को/की ओर’) है, जबकि योना 1:2 में עַל (‘के विरुद्ध’) है। मुख्य पाठ इस अंतर को बनाए रखता है और संदेश के न्याय-संबंधी स्वरूप को पूर्वसर्ग में अनावश्यक रूप से नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और सहज शैली रखी गई है। परमेश्वर का योना से एकवचन प्रत्यक्ष संबोधन ‘तू’ के रूपों (‘जा’, ‘तुझसे’) द्वारा सुरक्षित है।
