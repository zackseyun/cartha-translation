id: JON.3.8
reference: Jonah 3:8
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/יִתְכַּסּ֣וּ שַׂקִּ֗ים הָֽ/אָדָם֙ וְ/הַ/בְּהֵמָ֔ה וְ/יִקְרְא֥וּ אֶל אֱלֹהִ֖ים בְּ/חָזְקָ֑ה וְ/יָשֻׁ֗בוּ אִ֚ישׁ מִ/דַּרְכּ֣/וֹ הָֽ/רָעָ֔ה וּ/מִן הֶ/חָמָ֖ס אֲשֶׁ֥ר בְּ/כַפֵּי/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jonah/003/008.yaml
  text: Let both man and beast be covered with sackcloth[a], and let them call out mightily to God[c][b], and let each man turn from his evil way and from the violence that is in their hands.
translation:
  language: hi
  text: मनुष्य और पशु दोनों टाट ओढ़ें[a] और पूरे बल से[b] परमेश्वर को पुकारें। हर व्यक्ति[c] अपने बुरे मार्ग से और उस हिंसा से फिरे जो उनके हाथों में है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अपने को टाट से ढकें।”
    reason: हित्पएल क्रिया आत्मवाचक अथवा मध्यवाचक रूप में समझी जा सकती है।
  - marker: b
    text: 'शाब्दिक अर्थ के निकट: “बलपूर्वक”; आशय तीव्र और आग्रहपूर्ण पुकार से है।'
    reason: בְּחָזְקָה पुकार की शक्ति या तीव्रता को व्यक्त करता है।
  - marker: c
    text: इब्रानी में “हर एक मनुष्य”; यह समुदाय के प्रत्येक व्यक्ति को अलग-अलग सूचित करता है।
    reason: אִישׁ एकवचन होते हुए यहाँ वितरणात्मक प्रयोग में है।
lexical_decisions:
- source_word: וְיִתְכַּסּוּ שַׂקִּים
  choice: टाट ओढ़ें
  rationale: हित्पएल रूप आत्मवाचक अथवा मध्यवाचक अर्थ दे सकता है। ‘टाट ओढ़ें’ शोक और पश्चात्ताप के वस्त्र का भाव स्वाभाविक हिन्दी में व्यक्त करता है और आदेशात्मक बल बनाए रखता है।
- source_word: הָאָדָם וְהַבְּהֵמָה
  choice: मनुष्य और पशु दोनों
  rationale: दोनों वर्गों का स्पष्ट विरोध सुरक्षित है; यहाँ בְּהֵמָה मुख्यतः पालतू पशुओं को सूचित करता है, पर सामान्य ‘पशु’ प्रसंग में पर्याप्त और स्वाभाविक है।
- source_word: וְיִקְרְאוּ אֶל־אֱלֹהִים בְּחָזְקָה
  choice: पूरे बल से परमेश्वर को पुकारें
  rationale: קרא אל विनतीपूर्वक पुकारने का भाव देता है और בְּחָזְקָה उसकी तीव्रता बताता है। यह अनुवाद प्रार्थनापूर्ण पुकार और उसके जोर—दोनों को रखता है।
- source_word: וְיָשֻׁבוּ
  choice: फिरे
  rationale: שׁוב का मूल रूपक ‘फिरना/लौटना’ है। नैतिक पश्चात्ताप निहित है, पर ‘पश्चात्ताप करे’ कहकर रूपक को व्याख्यात्मक धार्मिक पद में नहीं बदला गया।
- source_word: אִישׁ
  choice: हर व्यक्ति
  rationale: एकवचन אִישׁ यहाँ वितरणात्मक है—समुदाय का प्रत्येक मनुष्य। आधुनिक हिन्दी में ‘हर व्यक्ति’ इस अर्थ को स्पष्ट और स्वाभाविक ढंग से देता है।
- source_word: מִדַּרְכּוֹ הָרָעָה
  choice: अपने बुरे मार्ग से
  rationale: ‘मार्ग’ आचरण और जीवन-पद्धति का इब्रानी नैतिक रूपक सुरक्षित रखता है; ‘बुरा’ רָעָה का सीधा अनुवाद है।
- source_word: וּמִן־הֶחָמָס אֲשֶׁר בְּכַפֵּיהֶם
  choice: और उस हिंसा से ... जो उनके हाथों में है
  rationale: חָמָס के हिंसक अन्याय का सीधा अर्थ ‘हिंसा’ से व्यक्त होता है। ‘हाथों में’ मूल बिंब और बहुवचन प्रत्यय—समुदाय के सामूहिक कर्म—दोनों को सुरक्षित रखता है।
theological_decisions:
- issue: שׁוב में पश्चात्ताप का भाव
  choice: ‘फिरे’
  alternative: ‘पश्चात्ताप करे’ अथवा ‘लौटे’
  rationale: यहाँ नैतिक परिवर्तन स्पष्ट है, फिर भी मूल क्रिया का ठोस ‘फिरने’ वाला रूपक रखना अधिक स्रोत-संगत है और किसी विकसित पारिभाषिक धर्मशास्त्रीय अर्थ को मुख्य पाठ में नहीं थोपता।
- issue: הָאָדָם और אִישׁ का प्रतिनिधिक मानवीय संदर्भ
  choice: ‘मनुष्य’ और ‘हर व्यक्ति’
  alternative: ‘लोग’ और ‘हर पुरुष’
  rationale: הָאָדָם पशुओं के विपरीत मानव-वर्ग को सूचित करता है। אִישׁ वितरणात्मक रूप से प्रत्येक व्यक्ति को सूचित करता है; हिन्दी में ‘हर व्यक्ति’ इस वास्तविक संदर्भ को बिना अर्थ-संकुचन के स्पष्ट करता है।
- issue: मनुष्य और पशु—दोनों का परमेश्वर को पुकारना
  choice: संयुक्त बहुवचन कर्ता को पुकारने की क्रिया के साथ बनाए रखा
  alternative: पुकार को केवल मनुष्यों तक सीमित करना
  rationale: इब्रानी वाक्य में नया कर्ता नहीं आता; इसलिए व्याकरणतः मनुष्य और पशु दोनों अगली बहुवचन क्रिया के कर्ता बने रहते हैं। असामान्य धार्मिक चित्र को चुपचाप सामान्य नहीं किया गया।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। राजकीय घोषणा का आदेशात्मक स्वर ‘ओढ़ें’, ‘पुकारें’ और ‘फिरे’ से व्यक्त हुआ है। ‘टाट’, ‘मार्ग’ और ‘हाथों में’ जैसे बाइबलीय बिंब बनाए गए हैं, क्योंकि वे हिन्दी में समझने योग्य हैं और मूल पाठ की सांस्कृतिक तथा नैतिक छवि को सुरक्षित रखते हैं।
