  choice: परमेश्वर ... पछताए
  alternative: परमेश्वर अपना मन बदल दे; परमेश्वर दण्ड देने से रुक जाए
  rationale: वचन घोषित न्याय के प्रति परमेश्वर की वास्तविक प्रत्युत्तरशीलता की मानवीय आशा प्रस्तुत करता है। ‘पछताए’ इस तनाव को मिटाता नहीं, जबकि पादटिप्पणी यह बताती है कि यहाँ बात घोषित दण्ड को रोकने की है, न कि परमेश्वर द्वारा किसी नैतिक भूल को स्वीकार करने की।
