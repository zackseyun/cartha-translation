- source_word: מֵחֲרוֹן אַפּוֹ
  choice: अपने धधकते क्रोध से
  rationale: यह इब्रानी मुहावरा तीव्र क्रोध के साथ ताप या जलने का चित्र प्रस्तुत करता है। ‘धधकते क्रोध’ उस चित्र को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: וְלֹא נֹאבֵד
  choice: ताकि हम नाश न हों
  rationale: यह परमेश्वर के फिरने और दण्ड रोकने के आशान्वित परिणाम को स्वाभाविक हिन्दी में व्यक्त करता है तथा प्रथम पुरुष बहुवचन को सुरक्षित रखता है।
theological_decisions:
