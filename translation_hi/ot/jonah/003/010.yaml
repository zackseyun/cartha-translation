base_translation:
  language: en
  yaml_path: translation/ot/jonah/003/010.yaml
  text: When God saw their deeds[a], that they had turned from their evil way, God relented concerning the disaster that he had spoken to bring on them[b], and he did not do it.
translation:
  language: hi
  text: जब परमेश्वर ने उनके कामों को देखा कि वे अपने बुरे मार्ग से मुड़ गए थे, तब परमेश्वर ने उस विपत्ति[b] के विषय में अपना मन बदल लिया[a], जिसे उन पर लाने की बात उसने कही थी, और उसने ऐसा नहीं किया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘विपत्ति लाने से रुक गया’ या ‘ढील दी।’ इब्रानी क्रिया नीनवे के मन-फिराव के उत्तर में परमेश्वर द्वारा घोषित दण्ड न लाने का वर्णन करती है; इससे परमेश्वर में किसी नैतिक दोष का अर्थ नहीं निकलता।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में ‘बुरे मार्ग’ के ‘बुरे’ और यहाँ ‘विपत्ति’ के लिए एक ही शब्द आया है। पहले स्थान पर उसका अर्थ नैतिक बुराई है, और दूसरे पर विपत्ति या दण्ड।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא
  choice: देखा
  rationale: साधारण कथात्मक क्रिया ‘देखा’ मूल की सीधी और संक्षिप्त अभिव्यक्ति को बनाए रखती है।
- source_word: מַעֲשֵׂיהֶם
  choice: उनके कामों
  rationale: यह उनके वास्तविक आचरण को सूचित करता है और आधुनिक हिन्दी में सहज है; ‘कर्मों’ की अपेक्षा इसमें अनावश्यक पारिभाषिक या धार्मिक अर्थछाया कम है।
- source_word: כִּי שָׁבוּ
  choice: कि वे ... फिर गए हैं
  rationale: כִּי यहाँ परमेश्वर ने उनके कामों में जो देखा, उसकी विषयवस्तु बताता है; שׁוּב का मुड़ने/लौटने का भाव ‘फिर गए’ में सुरक्षित है। हिन्दी में पूर्ण क्रिया का वर्तमान-परिणामी रूप संदर्भ के अनुरूप है।
- source_word: מִדַּרְכָּם הָרָעָה
  choice: अपने बुरे मार्ग से
  rationale: एकवचन ‘मार्ग’ मूल के नैतिक जीवन-पथ वाले रूपक और वचन को बनाए रखता है; यहाँ רָעָה नैतिक बुराई को दर्शाता है।
- source_word: וַיִּנָּחֶם
  choice: अपना मन बदल लिया
  rationale: नחם यहाँ घोषित दण्ड को न करने की ओर परमेश्वर की वास्तविक प्रतिक्रिया दर्शाता है। हिन्दी में ‘अपना मन बदल लिया’ यह तनाव स्पष्ट रखता है; इसे केवल बाहरी परिणाम ‘टाल दिया’ में सीमित नहीं करता। फुटनोट वैकल्पिक ‘विपत्ति लाने से रुक गया’ देता है और नैतिक दोष का अर्थ निषिद्ध करता है।
- source_word: עַל הָרָעָה
  choice: उस विपत्ति के विषय में
  rationale: दूसरी बार רָעָה नैतिक बुराई नहीं, बल्कि आने वाली विपत्ति या दण्ड है। ‘के विषय में’ עַל का निकट और स्वाभाविक अनुवाद है।
- source_word: אֲשֶׁר דִּבֶּר לַעֲשׂוֹת לָהֶם
  choice: जिसे लाने की बात उसने उनसे कही थी
  rationale: ‘विपत्ति लाना’ हिन्दी में स्वाभाविक है और לַעֲשׂוֹת לָהֶם के आशय को व्यक्त करता है; ‘बात कही थी’ मूल के דִּבֶּר को बनाए रखता है।
- source_word: וְלֹא עָשָׂה
  choice: और उसने उसे नहीं किया
  rationale: मूल का वाक्य जानबूझकर संक्षिप्त और सीधा है। थोड़ी असामान्य किन्तु स्पष्ट हिन्दी उसी पुनरुक्ति और बल को सुरक्षित रखती है।
- source_word: הָאֱלֹהִים
  choice: परमेश्वर
  rationale: इस्राएल के परमेश्वर के लिए मानक, गरिमापूर्ण और सामान्य हिन्दी पद।
theological_decisions:
- issue: וַיִּנָּחֶם में परमेश्वर की मानवीय भाषा में वर्णित प्रतिक्रिया
  choice: ‘परमेश्वर ने ... अपना मन बदल लिया’—घोषित विपत्ति को न करने की उसकी वास्तविक प्रतिक्रिया को स्पष्ट रूप से रखा गया है।
  alternative: ‘परमेश्वर विपत्ति लाने से रुक गया’ अथवा ‘परमेश्वर ने विपत्ति टाल दी।’
  rationale: मूल पाठ परमेश्वर की घोषित कार्यवाही में वास्तविक परिवर्तन का वर्णन करता है। अनुवाद को यह तनाव बनाए रखना चाहिए, पर यह निष्कर्ष नहीं जोड़ना चाहिए कि परमेश्वर ने कोई पाप या भूल की थी अथवा उसे नई जानकारी मिली थी।
- issue: רָעָה के दो निकटवर्ती प्रयोग
  choice: पहले प्रयोग को नैतिक अर्थ में ‘बुरा’ और दूसरे को दण्डात्मक अर्थ में ‘विपत्ति’ कहा गया है।
  alternative: दोनों स्थानों पर ‘बुराई’ कहना।
  rationale: 'एक ही इब्रानी शब्द का अर्थ संदर्भ के अनुसार भिन्न है: नीनवे के लोग नैतिक बुराई से फिरते हैं, जबकि परमेश्वर घोषित विपत्ति नहीं लाता। दोनों को ‘बुराई’ कहना हिन्दी में परमेश्वर के कार्य को नैतिक बुराई समझे जाने का भ्रम पैदा करेगा।'
