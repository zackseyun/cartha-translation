base_translation:
  language: en
  yaml_path: translation/ot/jonah/003/004.yaml
  text: Jonah began to go into the city a day's journey[a], and he cried out and said, “Yet forty days[b], and Nineveh will be overturned.”
translation:
  language: hi
  text: योना नगर में प्रवेश करने लगा और एक दिन की यात्रा जितनी दूरी तक गया[a]। उसने पुकारकर कहा, “अब चालीस दिन और[b], और नीनवे उलट दी जाएगी[c]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, ‘एक दिन का रास्ता।’ यह वाक्यांश उस दूरी को दर्शाता है जो एक दिन में तय की जाती है।
    reason: lexical_alternative
  - marker: b
    text: या, ‘चालीस दिन बाद।’ इब्रानी अभिव्यक्ति घोषित घटना से पहले बचा हुआ समय बताती है।
    reason: lexical_alternative
  - marker: c
    text: या, ‘उखाड़ फेंकी जाएगी’ अथवा ‘नष्ट कर दी जाएगी।’ इब्रानी क्रिया उलट दिए जाने और विनाशकारी परिवर्तन—दोनों का भाव दे सकती है।
    reason: alternative_reading
lexical_decisions:
- source_word: וַיָּחֶל
  choice: प्रवेश करने लगा
  rationale: हिफ़ील रूप यहाँ לָבוֹא के साथ किसी कार्य के आरम्भ को व्यक्त करता है। ‘करने लगा’ आधुनिक हिन्दी में इस आरम्भिक पक्ष को स्वाभाविक ढंग से दर्शाता है।
- source_word: לָבוֹא בָעִיר
  choice: नगर में प्रवेश करने
  rationale: בוא के साथ ב नगर के भीतर जाने की गति बताता है। ‘नगर में प्रवेश करना’ अर्थ को स्पष्ट और गरिमापूर्ण हिन्दी में रखता है।
- source_word: מַהֲלַךְ יוֹם אֶחָד
  choice: एक दिन की यात्रा जितनी दूर
  rationale: यह रचना एक दिन में तय की जाने वाली दूरी को सूचित करती है। चुना हुआ रूप इसे केवल यात्रा की अवधि मान लेने के बजाय उसके स्थानिक अर्थ को बनाए रखता है।
- source_word: וַיִּקְרָא וַיֹּאמַר
  choice: उसने पुकारकर कहा
  rationale: ‘पुकारकर कहा’ दोनों इब्रानी क्रियाओं के सार्वजनिक और श्रव्य स्वर को बनाए रखते हुए हिन्दी में अनावश्यक दोहराव से बचता है।
- source_word: עוֹד אַרְבָּעִים יוֹם
  choice: अब चालीस दिन और
  rationale: עוֹד घोषित घटना से पहले बची हुई अवधि का भाव देता है। ‘अब चालीस दिन और’ चेतावनी की उलटी गिनती को सहज हिन्दी में व्यक्त करता है।
- source_word: נֶהְפָּכֶת
  choice: उलट दिया जाएगा
  rationale: הפך का निफ़ाल रूप उलटने, तख्ता पलटने या विनाशकारी रूप से बदल देने का अर्थ दे सकता है। ‘उलट दिया जाएगा’ इस शब्द की व्यापकता को ‘नष्ट कर दिया जाएगा’ की अपेक्षा अधिक सुरक्षित रखता है।
theological_decisions:
- issue: योना की चेतावनी में נֶהְפָּכֶת का अर्थ
  choice: उलट दिया जाएगा
  alternative: नष्ट कर दिया जाएगा / उसका तख्ता पलट दिया जाएगा
  rationale: इब्रानी क्रिया विनाशकारी उलटाव को सूचित कर सकती है, पर पुस्तक के व्यापक साहित्यिक संदर्भ में परिवर्तन या स्थिति के पलटने की प्रतिध्वनि भी रहने देती है। इसलिए अनुवाद केवल पूर्ण विनाश का अर्थ निश्चित नहीं करता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, सार्वजनिक पाठ के योग्य और सामान्य पाठकों के लिए सहज रखी गई है। ‘नगर’ और ‘प्रवेश’ गरिमापूर्ण किंतु प्रचलित शब्द हैं। भविष्यवाणी की संक्षिप्तता और नाटकीय तनाव को बनाए रखा गया है।
