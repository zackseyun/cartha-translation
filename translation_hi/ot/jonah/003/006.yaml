  text: וַ/יִּגַּ֤ע הַ/דָּבָר֙ אֶל מֶ֣לֶך נִֽינְוֵ֔ה וַ/יָּ֨קָם֙ מִ/כִּסְא֔/וֹ וַ/יַּעֲבֵ֥ר אַדַּרְתּ֖/וֹ מֵֽ/עָלָ֑י/ו וַ/יְכַ֣ס שַׂ֔ק וַ/יֵּ֖שֶׁב עַל הָ/אֵֽפֶר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jonah/003/006.yaml
  text: When the message reached the king of Nineveh[a], he rose from his throne, removed his robe, covered himself with sackcloth[c][b], and sat in the ashes.
translation:
  language: hi
  text: जब यह संदेश नीनवे के राजा तक पहुँचा[a], तो वह अपने सिंहासन से उठा, अपना चोगा उतारा[b], टाट ओढ़ लिया और राख पर बैठ गया[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “बात” अथवा “समाचार” नीनवे के राजा तक पहुँचा।
    reason: הַדָּבָר का अर्थ प्रसंग के अनुसार ‘संदेश,’ ‘बात’ या ‘समाचार’ हो सकता है।
  - marker: b
    text: या, “अपना विशिष्ट बाहरी वस्त्र उतारा।”
    reason: אַדֶּרֶת किसी विशिष्ट या प्रतिष्ठित बाहरी वस्त्र को दर्शा सकता है।
  - marker: c
    text: शाब्दिक रूप में, “राख पर बैठ गया।”
    reason: इब्रानी עַל הָאֵפֶר में पूर्वसर्ग का सामान्य अर्थ ‘पर’ है; कुछ अनुवाद इसे ‘राख में’ कहते हैं।
lexical_decisions:
- source_word: וַיִּגַּע הַדָּבָר
  choice: यह संदेश ... तक पहुँचा
  rationale: נגע के साथ דבר और אֶל का प्रयोग यहाँ किसी बात या समाचार के राजा तक पहुँचने का भाव देता है। प्रसंग में यह योना की घोषणा का संदेश है; ‘पहुँचा’ स्वाभाविक और स्रोत के निकट है।
- source_word: מֶלֶךְ נִינְוֵה
  choice: नीनवे के राजा
  rationale: इब्रानी रचना का सीधा और स्वाभाविक हिन्दी रूप।
- source_word: וַיָּקָם מִכִּסְאוֹ
  choice: वह अपने सिंहासन से उठा
  rationale: כִּסֵּא का अर्थ आसन भी हो सकता है, पर राजा के प्रसंग में ‘सिंहासन’ राजकीय स्थिति और उसके दीन होने के दृश्य को ठीक व्यक्त करता है।
- source_word: וַיַּעֲבֵר אַדַּרְתּוֹ מֵעָלָיו
  choice: अपना राजकीय चोगा उतारा
  rationale: हिफ़ईल क्रिया यहाँ शरीर पर से वस्त्र हटा देने का अर्थ देती है। אַדֶּרֶת विशिष्ट बाहरी वस्त्र है; ‘राजकीय चोगा’ प्रसंग में स्पष्ट और आधुनिक हिन्दी है।
- source_word: וַיְכַס שַׂק
  choice: टाट ओढ़ लिया
  rationale: शाब्दिक रूप में उसने स्वयं को שַׂק से ढका। शोक और दीनता के इस वस्त्र के लिए ‘टाट’ प्रचलित बाइबलीय हिन्दी है, और ‘ओढ़ लिया’ כסה के ढकने के भाव को स्वाभाविक रूप से व्यक्त करता है।
- source_word: וַיֵּשֶׁב עַל הָאֵפֶר
  choice: राख पर बैठ गया
  rationale: עַל का सामान्य अर्थ ‘पर’ है और אֵפֶר सामूहिक एकवचन में राख को दर्शाता है। यह रूप मूल दृश्य को बिना अनावश्यक व्याख्या के बनाए रखता है।
theological_decisions:
- issue: राजा के दीन होने और पश्चाताप से जुड़े संकेत
  choice: केवल उसके प्रतीकात्मक कार्यों का वर्णन किया गया है
  alternative: मुख्य पाठ में इन कार्यों को स्पष्ट रूप से ‘पश्चाताप’ कहना
  rationale: सिंहासन छोड़ना, राजकीय वस्त्र उतारना, टाट ओढ़ना और राख पर बैठना शोक तथा दीनता से जुड़े कार्य हैं, पर पद स्वयं उनका धर्मवैज्ञानिक अर्थ स्पष्ट शब्दों में नहीं बताता। अनुवाद उस तनाव और चित्रात्मकता को बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और कथात्मक रखी गई है। ‘राजकीय चोगा’ सामान्य पाठक के लिए वस्त्र की प्रतिष्ठित प्रकृति स्पष्ट करता है; ‘टाट’ शोक और दीनता के पारंपरिक दृश्य को संक्षेप में बनाए रखता है।
