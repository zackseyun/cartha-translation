id: JON.1.10
reference: Jonah 1:10
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יִּֽירְא֤וּ הָֽ/אֲנָשִׁים֙ יִרְאָ֣ה גְדוֹלָ֔ה וַ/יֹּאמְר֥וּ אֵלָ֖י/ו מַה זֹּ֣את עָשִׂ֑יתָ כִּֽי יָדְע֣וּ הָ/אֲנָשִׁ֗ים כִּֽי מִ/לִּ/פְנֵ֤י יְהוָה֙ ה֣וּא בֹרֵ֔חַ כִּ֥י הִגִּ֖יד לָ/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jonah/001/010.yaml
  text: Then the men were greatly afraid[a], and they said to him, “What is this that you have done?” For the men knew that he was fleeing from the presence of Yahweh, because he had told them.
translation:
  language: hi
  text: तब वे पुरुष बहुत डर गए[a] और उससे बोले, “यह तुमने क्या किया?” क्योंकि वे पुरुष जानते थे कि वह याहवे की उपस्थिति से भाग रहा था, इसलिए कि उसने उन्हें यह बताया था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अधिक शाब्दिक रूप में, “वे पुरुष बड़े भय से डर गए।”
    reason: इब्रानी की सजातीय कर्म-रचना और उसके जोर को दिखाने वाला शाब्दिक विकल्प।
lexical_decisions:
- source_word: וַיִּירְאוּ ... יִרְאָה גְדוֹלָה
  choice: बहुत डर गए
  rationale: इब्रानी में सजातीय कर्म के द्वारा भय की तीव्रता व्यक्त हुई है। ‘बहुत डर गए’ उसी बल को स्वाभाविक आधुनिक हिन्दी में रखता है।
- source_word: הָאֲנָשִׁים
  choice: वे पुरुष
  rationale: मूल शब्द सामान्य रूप से ‘पुरुष’ कहता है; संदर्भ से वे नाविक हैं, पर अनुवाद में मूल की सामान्य संज्ञा रखी गई है।
- source_word: מַה זֹּאת עָשִׂיתָ
  choice: यह तुमने क्या किया?
  rationale: यह अभिव्यक्ति זֹאת के संकेतवाचक बल को बनाए रखते हुए हिन्दी में स्वाभाविक और तीखा प्रश्न है।
- source_word: מִלִּפְנֵי יְהוָה
  choice: यहोवा की उपस्थिति से
  rationale: यह पदबंध शाब्दिक रूप से किसी के सामने अथवा उपस्थिति से दूर होने को व्यक्त करता है और परमेश्वर से भागने की कथात्मक विडंबना बनाए रखता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: चार अक्षरों वाले व्यक्तिगत ईश्वरीय नाम को हिन्दी में प्रचलित प्रतिलेखन ‘यहोवा’ से प्रस्तुत किया गया है, किसी उपाधि से नहीं बदला गया।
- source_word: בֹרֵחַ
  choice: भाग रहा था
  rationale: इब्रानी कृदंत जारी क्रिया को दर्शाता है; हिन्दी का अपूर्ण भूतकाल उस पक्ष को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: כִּי ... כִּי
  choice: क्योंकि ... उसने स्वयं
  rationale: पहला כִּי कथाकार की व्याख्या आरम्भ करता है। दूसरा उनके जानने का आधार बताता है; हिन्दी में अटपटी पुनरावृत्ति से बचते हुए ‘स्वयं’ के बल और ‘यह बात’ से कारण-संबंध स्पष्ट किया गया है।
- source_word: הִגִּיד לָהֶם
  choice: उसने स्वयं उन्हें यह बात बताई थी
  rationale: पूर्ण क्रिया पुरुषों के जानने से पहले दी गई सूचना की ओर संकेत करती है; ‘बताई थी’ पूर्वकालिकता और ‘स्वयं’ निहित बल को स्पष्ट करता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल में व्यक्तिगत वाचा-नाम सीधे प्रयुक्त है। हिन्दी पाठकों में व्यापक रूप से पहचाने जाने वाले ‘यहोवा’ को नाम के रूप में रखा गया है, ‘प्रभु’ जैसी उपाधि से प्रतिस्थापित नहीं किया गया।
translation_notes:
  register: भाषा आधुनिक, सरल और गरिमापूर्ण रखी गई है। ‘वे पुरुष’ मूल की पुनरावृत्ति को सुरक्षित रखता है; ‘उपस्थिति’ धार्मिक आशय और कथात्मक विडंबना दोनों को बनाए रखती है।
