source:
  edition: WLC
  text: ק֠וּם לֵ֧ךְ אֶל נִֽינְוֵ֛ה הָ/עִ֥יר הַ/גְּדוֹלָ֖ה וּ/קְרָ֣א עָלֶ֑י/הָ כִּֽי עָלְתָ֥ה רָעָתָ֖/ם לְ/פָנָֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jonah/001/002.yaml
  text: Arise[a], go to Nineveh, the great city, and cry out against it[b], because their evil has come up before me.
translation:
  language: hi
  text: “उठ, उस बड़े नगर नीनवे में जा और उसके विरुद्ध पुकार कर[a], क्योंकि उनकी बुराई[b] मेरे सामने आ पहुँची है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसके विषय में घोषणा कर।” इब्रानी पदबंध का अर्थ अधिक सामान्य हो सकता है, पर इस प्रसंग में नीनवे के विरुद्ध न्याय की घोषणा का भाव प्रबल है।
    reason: lexical_alternative
  - marker: b
    text: या, “दुष्टता।”
    reason: lexical_alternative
lexical_decisions:
- source_word: ק֠וּם
  choice: उठ
  rationale: यह קום का आज्ञार्थक रूप है। ‘उठ’ भविष्यद्वक्ता को दिए गए अचानक और सीधे आदेश की शक्ति बनाए रखता है तथा अगले आदेश ‘जा’ के साथ स्वाभाविक लगता है।
- source_word: לֵ֧ךְ
  choice: जा
  rationale: הלך के आज्ञार्थक रूप का सरल और स्वाभाविक हिन्दी समतुल्य।
- source_word: אֶל נִֽינְוֵ֛ה
  choice: नीनवे में जा
  rationale: אֶל गंतव्य की ओर गति बताता है। नगर के साथ आधुनिक हिन्दी में ‘में जा’ स्वाभाविक है और नीनवे को लक्ष्य-स्थान के रूप में स्पष्ट करता है।
- source_word: הָעִ֥יר הַגְּדוֹלָ֖ה
  choice: उस बड़े नगर
  rationale: ‘बड़ा’ आकार और महत्त्व—दोनों की संभावित छाया बनाए रखता है; ‘उस’ इब्रानी के निश्चित पदबंध को सहज हिन्दी में व्यक्त करता है।
- source_word: וּקְרָ֣א
  choice: पुकारकर घोषणा कर
  rationale: קרא यहाँ सार्वजनिक और श्रव्य घोषणा का बोध देता है। यह अभिव्यक्ति पुकार की तीव्रता तथा भविष्यद्वाणी-संबंधी घोषणा, दोनों को स्वाभाविक हिन्दी में रखती है।
- source_word: עָלֶ֑יהָ
  choice: उसके विरुद्ध
  rationale: קרא के साथ על और आगे आने वाले दुष्टता के कारण-वाक्य से यहाँ विरोधात्मक, न्याय-सूचक अर्थ प्रबल है।
- source_word: כִּֽי
  choice: क्योंकि
  rationale: यह योना को भेजे जाने का कारण प्रस्तुत करता है; आधुनिक हिन्दी में स्पष्ट कारण-सूचक संयोजक।
- source_word: עָלְתָ֥ה
  choice: आ पहुँची है
  rationale: עלה की पूर्ण क्रिया यहाँ परमेश्वर की उपस्थिति तक पहुँचने का रूपक है। ‘आ पहुँची है’ उस गति और पूर्णता को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: רָעָתָ֖ם
  choice: उनकी बुराई
  rationale: बहुवचन संबंधसूचक प्रत्यय नगर के निवासियों की ओर संकेत करता है। प्रसंग में רעה नैतिक बुराई है, विपत्ति नहीं।
- source_word: לְפָנָֽי
  choice: मेरे सामने
  rationale: यह परमेश्वर की उपस्थिति और ध्यान में आने का मुहावरा है; ‘मेरे सामने’ चित्रात्मकता और न्याय-संबंधी भाव दोनों बनाए रखता है।
theological_decisions:
- issue: וּקְרָא עָלֶיהָ में भविष्यद्वाणी-संबंधी आदेश का आशय
  choice: नीनवे के विरुद्ध न्याय-सूचक घोषणा
  alternative: नीनवे के विषय में सामान्य घोषणा
  rationale: קרא के साथ על तथा उसके बाद नीनवे की बुराई का परमेश्वर के सामने पहुँचने का कारण दिए जाने से विरोधात्मक अर्थ प्रबल है। फिर भी पदबंध की व्यापक शाब्दिक संभावना को पादटिप्पणी में सुरक्षित रखा गया है।
- issue: רָעָתָם का नैतिक या विपत्ति-संबंधी अर्थ
  choice: उनकी बुराई
  alternative: उनकी दुष्टता; उनकी विपत्ति
  rationale: यह नीनवे के विरुद्ध परमेश्वर की कार्रवाई का कारण है, इसलिए यहाँ नैतिक बुराई अभिप्रेत है। ‘बुराई’ मूल शब्द की अपेक्षाकृत व्यापक नैतिक अर्थ-सीमा को बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की है, पर भविष्यद्वाणी-संबंधी आदेश की संक्षिप्तता और गरिमा बनाए रखी गई है। ‘पुकारकर घोषणा कर’ सार्वजनिक उद्घोषणा की तीव्रता को साधारण पाठक के लिए स्पष्ट करता है। सर्वनाम ‘उनकी’ इब्रानी के बहुवचन प्रत्यय के अनुसार नीनवे के निवासियों की ओर संकेत करता है।
