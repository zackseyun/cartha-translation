translation:
  language: hi
  text: तब उन्होंने योना को उठाकर समुद्र में फेंक दिया, और समुद्र का उफान थम गया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׂאוּ
  choice: उठाकर
  rationale: נשׂא यहाँ योना को शारीरिक रूप से उठाने के ठोस अर्थ में है; ‘उठाकर’ स्वाभाविक हिन्दी में अगली क्रिया से भी सहजता से जुड़ता है।
- source_word: וַיְטִלֻהוּ
  choice: उसे फेंक दिया
  rationale: טול का सामान्य अर्थ फेंकना या डालना है। ‘फेंक दिया’ स्पष्ट और वर्तमान हिन्दी है तथा मूल से अधिक बल आरोपित नहीं करता।
- source_word: אֶל הַיָּם
  choice: समुद्र में
  rationale: אֶל दिशा बताता है, पर फेंकने की क्रिया के साथ हिन्दी में परिणामी गति को स्वाभाविक रूप से ‘समुद्र में’ कहा जाता है।
- source_word: וַיַּעֲמֹד הַיָּם
  choice: समुद्र का ... होना थम गया
  rationale: עמד का मूल अर्थ ‘खड़ा होना’ है, पर यहाँ समुद्र की उग्र गतिविधि के रुक जाने का भाव है; ‘थम गया’ इस प्रसंग में स्वाभाविक और अर्थसंगत है।
- source_word: מִזַּעְפּוֹ
  choice: उसका प्रचण्ड होना
  rationale: זעף रोष, प्रकोप अथवा उग्र हलचल व्यक्त करता है। समुद्र के लिए ‘प्रचण्ड होना’ उसके उग्र रूप को बनाए रखता है और अनावश्यक मानवीकरण से बचता है।
theological_decisions:
- issue: समुद्र की उग्र गति का मानवीकरण
  choice: ‘समुद्र का प्रचण्ड होना थम गया’
  alternative: ‘समुद्र अपने प्रकोप से शांत हो गया’
  rationale: यह रूप समुद्र की זעף वाली उग्रता और उसके रुकने—दोनों को व्यक्त करता है, लेकिन इसे केवल मौसम का सपाट वर्णन नहीं बनाता और न अतिरिक्त धर्मवैज्ञानिक अर्थ जोड़ता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण कथात्मक शैली। मूल वाक्य की क्रमिक क्रियाएँ और समुद्र की उग्रता के अचानक थमने का प्रभाव सुरक्षित रखा गया है।
