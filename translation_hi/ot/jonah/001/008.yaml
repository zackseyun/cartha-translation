language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יֹּאמְר֣וּ אֵלָ֔י/ו הַגִּידָ/ה נָּ֣א לָ֔/נוּ בַּ/אֲשֶׁ֛ר לְ/מִי הָ/רָעָ֥ה הַ/זֹּ֖את לָ֑/נוּ מַה מְּלַאכְתְּ/ךָ֙ וּ/מֵ/אַ֣יִן תָּב֔וֹא מָ֣ה אַרְצֶ֔/ךָ וְ/אֵֽי מִ/זֶּ֥ה עַ֖ם אָֽתָּה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jonah/001/008.yaml
  text: Then they said to him[a], “Please tell us on whose account this trouble has come upon us. What is your occupation, and where do you come from? What is your land[b], and from what people are you?”
translation:
  language: hi
  text: तब उन्होंने उससे कहा, “कृपया हमें बताओ कि किसके कारण यह विपत्ति हम पर आई है। तुम क्या काम करते हो, और तुम कहाँ से आए हो? तुम्हारा देश कौन-सा है, और तुम किस लोगों में से हो?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַגִּידָה נָּא
  choice: कृपया हमें बताओ
  rationale: הַגִּידָה का अर्थ बताना या प्रकट करना है और נָּא विनम्र आग्रह जोड़ता है; यह रूप आधुनिक हिन्दी में स्वाभाविक है।
- source_word: בַּאֲשֶׁר לְמִי הָרָעָה הַזֹּאת לָנוּ
  choice: किसके कारण यह विपत्ति हम पर आई है
  rationale: वाक्य विपत्ति के लिए उत्तरदायी व्यक्ति के विषय में पूछता है। רָעָה यहाँ नैतिक बुराई के बजाय नाविकों पर आई विनाशकारी परिस्थिति को दर्शाता है, इसलिए ‘विपत्ति’ उपयुक्त है।
- source_word: מַה מְּלַאכְתְּךָ
  choice: तुम्हारा काम-धंधा क्या है
  rationale: מְלָאכָה काम या पेशे को सूचित करता है। ‘काम-धंधा’ साधारण आधुनिक हिन्दी में व्यक्ति के व्यवसाय के विषय में स्वाभाविक प्रश्न है।
- source_word: וּמֵאַיִן תָּבוֹא
  choice: और तुम कहाँ से आए हो
  rationale: מֵאַיִן उद्गम या आने के स्थान के विषय में पूछता है; चुना हुआ वाक्यांश हिन्दी में सहज है।
- source_word: מָה אַרְצֶךָ
  choice: तुम्हारा देश कौन-सा है
  rationale: אֶרֶץ का अर्थ भूमि या देश हो सकता है। यहाँ व्यक्ति के भौगोलिक मूल की पूछताछ में ‘देश’ सामान्य पाठक के लिए अधिक स्वाभाविक है और आधुनिक राष्ट्र-राज्य तक अर्थ को अनावश्यक रूप से सीमित नहीं करता।
- source_word: וְאֵי מִזֶּה עַם אָתָּה
  choice: और तुम किस जाति के हो
  rationale: עַם यहाँ लोगों के समुदाय अथवा जनसमूह को दर्शाता है। इस पहचान-संबंधी प्रश्न में ‘जाति’ जातीय/राष्ट्रीय समुदाय का संक्षिप्त और पारंपरिक हिन्दी बाइबलीय निरूपण है, न कि अनिवार्य रूप से भारतीय वर्ण या उपजाति।
- source_word: וַיֹּאמְרוּ אֵלָיו
  choice: तब उन्होंने उससे कहा
  rationale: वाव-क्रम कथा को आगे बढ़ाता है; ‘तब’ घटनाक्रम को स्वाभाविक हिन्दी में व्यक्त करता है।
