review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the sailors’ request for disclosure, the causal question concerning the disaster, and the successive questions about occupation, origin, land, and people. ‘विपत्ति’ appropriately renders רָעָה in this storm context without implying moral evil. However, ‘जाति’ in present-day Hindi commonly evokes caste and can therefore misrepresent עַם, which here denotes a people-group.
  naturalness: The dialogue is generally fluent and suitably direct. ‘तुम क्या काम करते हो?’ is more idiomatic modern Hindi than ‘तुम्हारा काम-धंधा क्या है’ while retaining the occupational question. ‘तुम किस लोगों में से हो?’ naturally asks the intended people-group identity without caste implications.
  terminology: ‘विपत्ति’ is contextually apt. ‘देश’ is an acceptable rendering of אֶרֶץ here. Replacing ‘जाति’ with ‘लोगों’ avoids importing a specifically Indian caste sense into the biblical reference to a people-group.
  issues:
  - severity: medium
    issue: ‘जाति’ for עַם may be understood as caste.
    rationale: Although the draft note explains the intended broader meaning, the translation itself should not readily suggest a caste or subcaste category. The Hebrew asks about Jonah’s people or ethnic/national group.
  - severity: low
    issue: ‘काम-धंधा’ is somewhat colloquial for the passage’s otherwise neutral, dignified register.
    rationale: The Hebrew asks simply about his work or occupation. ‘तुम क्या काम करते हो?’ is natural modern standard Hindi and avoids the informal commercial nuance that ‘धंधा’ can carry.
