translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और संवाद के अनुरूप रखी गई है। ‘विपत्ति’ से רָעָה का प्रसंगगत आपदा-संबंधी अर्थ व्यक्त होता है, नैतिक बुराई नहीं। ‘जाति’ को עַם के अर्थ में व्यापक जनसमुदाय के लिए पढ़ा जाना चाहिए।
