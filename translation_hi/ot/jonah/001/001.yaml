  text: וַֽ/יְהִי֙ דְּבַר יְהוָ֔ה אֶל יוֹנָ֥ה בֶן אֲמִתַּ֖י לֵ/אמֹֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jonah/001/001.yaml
  text: The word of Yahweh came to Jonah son of Amittai[a], saying[b],
translation:
  language: hi
  text: यहोवा का वचन अमित्तै के पुत्र योना के पास पहुँचा[a]:[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक रूप से: “और ऐसा हुआ कि यहोवा का वचन ... पहुँचा।” यह इब्रानी में कथा आरंभ करने का एक सामान्य ढंग है।'
    reason: lexical_alternative
  - marker: b
    text: 'या: “यह कहते हुए,”; यह पद अगले पद में आने वाले यहोवा के कथन का परिचय देता है।'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְהִי
  choice: पहुँचा
  rationale: यह सामान्य इब्रानी कथात्मक आरंभ है। अलग से शाब्दिक ‘और ऐसा हुआ’ जोड़ने के बजाय मुख्य कथन ‘वचन ... पहुँचा’ में इसकी भूमिका स्वाभाविक हिन्दी में व्यक्त होती है।
- source_word: דְּבַר
  choice: वचन
  rationale: ‘यहोवा का वचन’ मानक भविष्यवाणी-सूत्र है; ‘वचन’ मूल शब्द के ठोस अर्थ और उसके अंतरपाठीय महत्व को बनाए रखता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: मूल में परमेश्वर का व्यक्तिगत नाम टेट्राग्रामटन है; हिन्दी में प्रचलित नामरूप ‘यहोवा’ शीर्षक से प्रतिस्थापित किए बिना इसे व्यक्त करता है।
- source_word: אֶל
  choice: के पास
  rationale: यह प्रकाशना के प्राप्तकर्ता की ओर दिशा बताता है; ‘के पास पहुँचा’ आधुनिक हिन्दी में स्वाभाविक है।
- source_word: יוֹנָה
  choice: योना
  rationale: व्यक्तिनाम का मानक हिन्दी बाइबलीय रूप।
- source_word: בֶן אֲמִתַּי
  choice: अमित्तै के पुत्र
  rationale: यह पितृनाम-सूचक पद योना की पहचान बताता है और मूल की संरचना को स्पष्ट हिन्दी में रखता है।
- source_word: לֵאמֹר
  choice: ':'
  rationale: यह अगले पद में आने वाली प्रत्यक्ष वाणी का परिचय देता है। हिन्दी में द्विबिंदु ‘यह कहते हुए’ की अपेक्षा अधिक स्वाभाविक ढंग से उसी संबंध को व्यक्त करता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ व्यक्तिगत ईश्वरीय नाम का प्रयोग करता है। हिन्दी पाठकों के लिए स्थापित नामरूप ‘यहोवा’ उसे किसी उपाधि, जैसे ‘प्रभु’, से बदले बिना प्रस्तुत करता है; ‘याहवे’ ध्वन्यात्मक विकल्प है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सहज मानक हिन्दी। भविष्यवाणी-सूत्र ‘यहोवा का वचन’ सुरक्षित रखा गया है; कथात्मक आरंभ को हिन्दी में अनावश्यक रूप से बोझिल नहीं बनाया गया।
