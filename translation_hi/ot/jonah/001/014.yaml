reference: Jonah 1:14
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יִּקְרְא֨וּ אֶל יְהוָ֜ה וַ/יֹּאמְר֗וּ אָנָּ֤ה יְהוָה֙ אַל נָ֣א נֹאבְדָ֗ה בְּ/נֶ֨פֶשׁ֙ הָ/אִ֣ישׁ הַ/זֶּ֔ה וְ/אַל תִּתֵּ֥ן עָלֵ֖י/נוּ דָּ֣ם נָקִ֑יא כִּֽי אַתָּ֣ה יְהוָ֔ה כַּ/אֲשֶׁ֥ר חָפַ֖צְתָּ עָשִֽׂיתָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jonah/001/014.yaml
  text: Then they cried out to Yahweh and said[a], “Please, Yahweh, do not let us perish on account of this man's life, and do not put innocent blood on us, for you, Yahweh[b], have done as you pleased.”
translation:
  language: hi
  text: तब उन्होंने यहवे को पुकारकर कहा, “हे यहवे, कृपा करके इस मनुष्य के प्राण के कारण हमें नष्ट न होने दे, और हमें निर्दोष रक्त का दोषी न ठहरा; क्योंकि, हे यहवे, जैसा तूने चाहा, तूने वैसा ही किया है।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקְרְאוּ אֶל־יְהוָה
  choice: उन्होंने यहवे को पुकारकर कहा
  rationale: קרא אל संकट में परमेश्वर से की गई व्याकुल पुकार को व्यक्त करता है। ‘पुकारकर’ इसकी तीव्रता बनाए रखता है और आधुनिक हिन्दी में स्वाभाविक है।
- source_word: יְהוָה
  choice: यहवे
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय हिन्दी में ‘यहवे’ लिप्यंतरित किया गया है।
- source_word: אָנָּה ... אַל נָא נֹאבְדָה
  choice: कृपा करके ... हमें नाश न होने दे
  rationale: אָנָּה और נָא विनती की तीव्रता प्रकट करते हैं; नकारात्मक सहमति-वाचक रूप को हिन्दी में स्वाभाविक प्रार्थना के रूप में रखा गया है, बिना कारणता को आवश्यकता से अधिक निश्चित किए।
- source_word: בְּנֶפֶשׁ הָאִישׁ הַזֶּה
  choice: इस मनुष्य के प्राण के कारण
  rationale: נֶפֶשׁ यहाँ उसके जीवन/प्राण को सूचित करता है। यह अनुवाद इब्रानी वाक्यांश की संभावित व्यापकता बनाए रखता है—अर्थ इस मनुष्य के कारण अथवा उसके प्राण लेने के कारण भी समझा जा सकता है।
- source_word: וְאַל־תִּתֵּן עָלֵינוּ דָּם נָקִיא
  choice: हम पर निर्दोष रक्त का दोष न लगा
  rationale: शाब्दिक मुहावरा ‘हम पर निर्दोष रक्त न रख’ हिन्दी में अस्पष्ट होता; ‘दोष न लगा’ रक्तपात के दायित्व का अर्थ स्पष्ट करता है और कानूनी-नैतिक भाव सुरक्षित रखता है।
- source_word: כַּאֲשֶׁר חָפַצְתָּ עָשִׂיתָ
  choice: तूने वही किया है जो तुझे अच्छा लगा
  rationale: חפץ इच्छा, प्रसन्नता या पसंद को सूचित करता है। यह रूप परमेश्वर की स्वतंत्र इच्छा का भाव रखता है, पर बाद की व्यवस्थित धर्मवैज्ञानिक शब्दावली नहीं जोड़ता।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ व्यक्तिगत ईश्वरीय नाम का प्रयोग करता है। ‘यहवे’ उसे उपाधि में बदले बिना आधुनिक हिन्दी लिपि में प्रस्तुत करता है।
- issue: निर्दोष रक्त के मुहावरे को कितना स्पष्ट किया जाए
  choice: हम पर निर्दोष रक्त का दोष न लगा
  alternative: हम पर निर्दोष रक्त न रख
  rationale: मुख्य पाठ में अर्थबोध के लिए रक्त-दोष को स्पष्ट किया गया है, जबकि स्रोत के कानूनी और नैतिक आशय को बनाए रखा गया है।
- issue: בְּנֶפֶשׁ הָאִישׁ הַזֶּה की अर्थगत अनिश्चितता
  choice: इस मनुष्य के प्राण के कारण
  alternative: इस मनुष्य को मारने के कारण; इस मनुष्य के कारण
  rationale: मुख्य पाठ נֶפֶשׁ के ‘प्राण/जीवन’ अर्थ को बनाए रखता है और यह पूरी तरह तय नहीं करता कि नाविक योना के कारण मरने की बात कर रहे हैं या उसके प्राण लेने के कारण दोषी होने की।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की है; शैली प्रार्थनापूर्ण, गंभीर और सामान्य पाठक के लिए सुबोध रखी गई है। ईश्वरीय संबोधन में आदरपूर्ण किंतु बाइबिलीय एकवचन ‘तू’ का प्रयोग किया गया है।
