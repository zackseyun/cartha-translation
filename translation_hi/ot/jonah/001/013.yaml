base_translation:
  language: en
  yaml_path: translation/ot/jonah/001/013.yaml
  text: But the men rowed hard to return to the dry land[a], but they could not[c][b], because the sea kept growing more and more stormy against them.
translation:
  language: hi
  text: लेकिन उन आदमियों ने सूखी भूमि की ओर लौटने के लिए पूरी ताकत लगाकर चप्पू चलाए[a], फिर भी वे ऐसा न कर सके, क्योंकि समुद्र उनके विरुद्ध और भी प्रचण्ड होता जा रहा था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी क्रिया का शाब्दिक अर्थ ‘खोदना’ है; इस समुद्री प्रसंग में इसका अर्थ बहुत जोर लगाकर चप्पू चलाना है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּחְתְּרוּ
  choice: जी-जान से चप्पू चलाए
  rationale: क्रिया का मूल अर्थ ‘खोदना’ है, पर यहाँ समुद्री प्रसंग में यह अत्यन्त परिश्रम से चप्पू चलाने को दर्शाती है। यह हिन्दी अभिव्यक्ति क्रिया और तीव्र प्रयास दोनों को स्वाभाविक ढंग से व्यक्त करती है।
- source_word: הָאֲנָשִׁים
  choice: उन आदमियों
  rationale: इब्रानी में सामान्य शब्द ‘आदमी/पुरुष’ है, नाविकों के लिए विशेष संज्ञा नहीं। ‘उन आदमियों’ से स्रोत की शब्दावली और पूर्ववर्ती प्रसंग का संबंध बना रहता है।
- source_word: לְהָשִׁיב אֶל הַיַּבָּשָׁה
  choice: सूखी भूमि पर लौटने के लिए
  rationale: हिफ़ील रूप गमन को वापस मोड़ने या लौटाने का भाव देता है। ‘सूखी भूमि’ इब्रानी के स्थल-समुद्र विरोध को सुरक्षित रखती है, जबकि हिन्दी में पूरा वाक्य स्वाभाविक रहता है।
- source_word: וְלֹא יָכֹלוּ
  choice: पर वे ऐसा न कर सके
  rationale: यह उनकी असमर्थता और पिछले प्रयत्न के विफल होने को सीधे तथा स्वाभाविक रूप में व्यक्त करता है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यहाँ संयोजक उनके असफल होने का कारण प्रस्तुत करता है।
- source_word: הוֹלֵךְ וְסֹעֵר
  choice: और भी प्रचण्ड होता जा रहा था
  rationale: הוֹלֵךְ के साथ कृदन्त बढ़ती हुई या निरन्तर तीव्र होती अवस्था बताता है। यह अनुवाद समुद्र के क्रमशः अधिक उग्र होने का भाव रखता है।
- source_word: עֲלֵיהֶם
  choice: उनके विरुद्ध
  rationale: प्रसंग में पूर्वसर्ग समुद्र की मानो शत्रुतापूर्ण, उनकी ओर निर्देशित शक्ति को व्यक्त करता है।
