  text: וַ/יִּֽירְא֣וּ הַ/מַּלָּחִ֗ים וַֽ/יִּזְעֲקוּ֮ אִ֣ישׁ אֶל אֱלֹהָי/ו֒ וַ/יָּטִ֨לוּ אֶת הַ/כֵּלִ֜ים אֲשֶׁ֤ר בָּֽ/אֳנִיָּה֙ אֶל הַ/יָּ֔ם לְ/הָקֵ֖ל מֵֽ/עֲלֵי/הֶ֑ם וְ/יוֹנָ֗ה יָרַד֙ אֶל יַרְכְּתֵ֣י הַ/סְּפִינָ֔ה וַ/יִּשְׁכַּ֖ב וַ/יֵּרָדַֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jonah/001/005.yaml
  text: Then the sailors were afraid[a], and each cried out to his god. They threw the cargo that was in the ship into the sea to lighten it for themselves. But Yonah had gone down into the innermost parts of the vessel[b], and he lay down and fell fast asleep.
translation:
  language: hi
  text: तब नाविक डर गए, और हर एक ने अपने देवता को पुकारा। उन्होंने जहाज़ में रखा सामान[a] समुद्र में फेंक दिया, ताकि जहाज़ का भार हल्का हो जाए। पर योना जहाज़ के सबसे भीतरी भाग[b] में उतर गया था; वहाँ वह लेट गया और गहरी नींद में सो गया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “जहाज़ के उपकरण” अथवा “वस्तुएँ।” इब्रानी शब्द का अर्थ व्यापक है; इस प्रसंग में इससे जहाज़ को हल्का करने के लिए समुद्र में फेंका गया माल या सामान अभिप्रेत हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या “जहाज़ के भीतरी हिस्से” अथवा “जहाज़ का निचला भीतरी भाग।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּירְאוּ הַמַּלָּחִים
  choice: नाविक डर गए
  rationale: יִרא यहाँ तूफ़ान से उत्पन्न भय बताता है; ‘डर गए’ स्वाभाविक आधुनिक हिन्दी है। מַלָּחִים समुद्री जहाज़ के चालक-दल को दर्शाता है।
- source_word: וַיִּזְעֲקוּ אִישׁ אֶל אֱלֹהָיו
  choice: हर एक अपने देवता को पुकारने लगा
  rationale: זעק संकट में ऊँची और व्याकुल पुकार को व्यक्त करता है। אִישׁ का प्रयोग वितरणात्मक है और एकवचन प्रत्यय बताता है कि प्रत्येक नाविक ने अपने देवता को पुकारा।
- source_word: הַכֵּלִים
  choice: सामान
  rationale: כֵּלִים व्यापक शब्द है, जिसका अर्थ वस्तुएँ, उपकरण या माल हो सकता है। ‘सामान’ इस व्यापकता को हिन्दी में बनाए रखता है और प्रसंग में जहाज़ से फेंकी गई चीज़ों के लिए स्वाभाविक है।
- source_word: לְהָקֵל מֵעֲלֵיהֶם
  choice: ताकि जहाज़ का भार हल्का हो जाए
  rationale: शाब्दिक संरचना ‘उनके ऊपर से हल्का करने’ की है, पर आशय जहाज़ का बोझ घटाना है। हिन्दी में यह रूप स्पष्ट और स्वाभाविक है तथा नाविकों के लाभार्थ भाव को प्रसंग से समझने देता है।
- source_word: יָרַד אֶל יַרְכְּתֵי הַסְּפִינָה
  choice: जहाज़ के सबसे भीतरी भाग में उतर गया था
  rationale: ירד नीचे जाने को और יַרְכְּתֵי दूरस्थ अथवा अंदरूनी हिस्सों को दर्शाता है। ‘सबसे भीतरी भाग’ तकनीकी ‘तलघर’ थोपे बिना स्थानगत चित्र बनाए रखता है। भूतपूर्व रूप पहले हो चुकी क्रिया को स्पष्ट करता है।
- source_word: וַיִּשְׁכַּב וַיֵּרָדַם
  choice: वह लेट गया और गहरी नींद में सो गया
  rationale: שכב का अर्थ लेटना है और רדם सामान्य नींद से अधिक गहरी नींद में पड़ना दर्शाता है।
theological_decisions:
- issue: אֱלֹהָיו में अन्यजातीय देवता का उल्लेख
  choice: अपने देवता को
  alternative: अपने देवताओं को
  rationale: אִישׁ के वितरणात्मक प्रयोग और एकवचन संबंधसूचक प्रत्यय के कारण प्रत्येक नाविक का अपना देवता अभिप्रेत है। ‘देवता’ इसे इस्राएल के परमेश्वर के साथ एकरूप नहीं करता।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘योना’ प्रचलित मानक हिन्दी बाइबलीय नाम है। दोनों पाद-टिप्पणी चिह्न मुख्य पाठ में दिए गए हैं; समुद्री तकनीकी शब्दावली को अनावश्यक रूप से निश्चित नहीं किया गया।
