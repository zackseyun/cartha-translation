base_translation:
  language: en
  yaml_path: translation/ot/jonah/001/006.yaml
  text: So the captain came near to him and said to him[a], “What do you mean, sleeper? Get up, call on your god. Perhaps the god will give thought to us[c][b], so that we may not perish.”
translation:
  language: hi
  text: तब जहाज़ का कप्तान[a] उसके पास आया और उससे कहा, “तुम कैसे सो रहे हो?[b] उठो, अपने देवता को पुकारो। शायद वह देवता हमारी सुधि ले[c], और हम नाश न हों।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “नाविकों का प्रधान” अथवा “जहाज़ का मुखिया।”
    reason: lexical_alternative
  - marker: b
    text: इब्रानी फटकार बहुत संक्षिप्त है; उसका शाब्दिक रूप लगभग “तुझे क्या हुआ, सोनेवाले?” है। आशय है, “तुम इस समय कैसे सो सकते हो?”
    reason: lexical_alternative
  - marker: c
    text: इस दुर्लभ इब्रानी क्रिया का अर्थ “हमारी ओर ध्यान दे,” “हमारे विषय में सोचे,” या “हमारी चिंता करे” भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: רַב הַחֹבֵל
  choice: जहाज़ का कप्तान
  rationale: यह पदबंध शाब्दिक रूप से नाविकों के प्रधान को दर्शाता है। आधुनिक हिन्दी में ‘जहाज़ का कप्तान’ उसके नेतृत्वकारी पद को स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: וַיִּקְרַב אֵלָיו
  choice: उसके पास आया
  rationale: קָרַב में निकट आने का भाव है; यह चयन कथा की भौतिक गतिविधि को सहज हिन्दी में बनाए रखता है।
- source_word: מַה לְּךָ נִרְדָּם
  choice: तुम कैसे सो रहे हो?
  rationale: इब्रानी वाक्य अत्यंत संक्षिप्त और फटकारपूर्ण है। हिन्दी का यह प्रश्न कप्तान के विस्मय और झिड़की को व्यक्त करता है, जबकि शाब्दिक बनावट को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: קוּם
  choice: उठो
  rationale: आज्ञार्थक रूप की तात्कालिकता को संक्षिप्त, वर्तमान हिन्दी में व्यक्त करता है।
- source_word: קְרָא אֶל אֱלֹהֶיךָ
  choice: अपने देवता को पुकारो
  rationale: קרא אל यहाँ प्रार्थना या सहायता के लिए देवता को पुकारने का भाव रखता है।
- source_word: אוּלַי
  choice: शायद
  rationale: यह शब्द संभावना और अनिश्चित आशा दोनों को व्यक्त करता है।
- source_word: יִתְעַשֵּׁת
  choice: हमारी सुधि ले
  rationale: यह दुर्लभ क्रिया ध्यान देने, विचार करने या चिंता करने का अर्थ दे सकती है। ‘हमारी सुधि ले’ प्रसंग में स्वाभाविक है और प्रतिक्रिया को निश्चित रूप से बचाव के रूप में नहीं बताता।
- source_word: הָאֱלֹהִים
  choice: वह देवता
  rationale: निश्चित उपपद के साथ यह पहले उल्लिखित योना के देवता की ओर संकेत करता है। ‘वह देवता’ कप्तान के सीमित दृष्टिकोण को बनाए रखता है और यहाँ यहोवा की स्पष्ट पहचान आरोपित नहीं करता।
- source_word: וְלֹא נֹאבֵד
  choice: और हम नाश न हों
  rationale: यह अनिश्चित आशा के अपेक्षित परिणाम को हिन्दी के संभावनार्थक रूप में व्यक्त करता है।
theological_decisions:
- issue: मूर्तिपूजक कप्तान के कथन में אֱלֹהֶיךָ और הָאֱלֹהִים का संदर्भ
  choice: ‘अपने देवता’ और फिर ‘वह देवता’
  alternative: ‘अपने परमेश्वर’ और ‘परमेश्वर’
  rationale: कप्तान योना से उसके अपने देवता को पुकारने को कहता है; इस पद में वह इस देवता को इस्राएल के वाचा-परमेश्वर के रूप में स्पष्टतः नहीं पहचानता। चुना हुआ रूप इस कथात्मक अस्पष्टता और विडंबना को बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण कथात्मक स्तर रखा गया है। कप्तान की फटकार और आज्ञाएँ संक्षिप्त हैं। ‘देवता’ का प्रयोग वक्ता के मूर्तिपूजक दृष्टिकोण को दर्शाता है, जबकि ‘हमारी सुधि ले’ दुर्लभ क्रिया की अर्थ-व्याप्ति को बिना अनावश्यक सिद्धान्तगत निष्कर्ष के व्यक्त करता है।
