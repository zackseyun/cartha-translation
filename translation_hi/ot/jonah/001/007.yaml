  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יֹּאמְר֞וּ אִ֣ישׁ אֶל רֵעֵ֗/הוּ לְכוּ֙ וְ/נַפִּ֣ילָה גֽוֹרָל֔וֹת וְ/נֵ֣דְעָ֔ה בְּ/שֶׁ/לְּ/מִ֛י הָ/רָעָ֥ה הַ/זֹּ֖את לָ֑/נוּ וַ/יַּפִּ֨לוּ֙ גּֽוֹרָל֔וֹת וַ/יִּפֹּ֥ל הַ/גּוֹרָ֖ל עַל יוֹנָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jonah/001/007.yaml
  text: And they said[a], each man to his companion, “Come, let us cast lots, so that we may know on whose account this evil has come upon us.” So they cast lots, and the lot fell on Jonah.
translation:
  language: hi
  text: उन्होंने एक-दूसरे से कहा, “आओ, हम चिट्ठियाँ डालें, ताकि जान लें कि यह विपत्ति[a] हम पर किसके कारण आई है।” तब उन्होंने चिट्ठियाँ डालीं, और चिट्ठी योना के नाम निकली।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “यह अनिष्ट” अथवा “यह आपदा।” इब्रानी शब्द प्रसंग के अनुसार बुराई, हानि या विपत्ति का अर्थ दे सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ אֶל רֵעֵהוּ
  choice: एक-दूसरे से
  rationale: यह इब्रानी मुहावरा जहाज़ पर मौजूद पुरुषों के परस्पर बोलने को व्यक्त करता है। आधुनिक हिन्दी में ‘एक-दूसरे से’ स्वाभाविक और सटीक है।
- source_word: לְכוּ
  choice: आओ
  rationale: शाब्दिक अर्थ ‘चलो/जाओ’ हो सकता है, पर यहाँ यह साझा कार्य का प्रस्ताव रखने वाला आग्रह है; इसलिए ‘आओ’ स्वाभाविक है।
- source_word: וְנַפִּילָה גוֹרָלוֹת
  choice: हम चिट्ठियाँ डालें
  rationale: सहभागी संकल्प को ‘हम ... डालें’ से व्यक्त किया गया है। ‘चिट्ठियाँ डालना’ निर्णय या पहचान के लिए पर्ची डालने की प्राचीन रीति का प्रचलित हिन्दी रूप है।
- source_word: וְנֵדְעָה
  choice: ताकि जान लें
  rationale: यहाँ संयोजन और इच्छार्थक क्रिया पिछले प्रस्ताव का उद्देश्य बताते हैं।
- source_word: בְּשֶׁלְּמִי
  choice: किसके कारण
  rationale: यह अभिव्यक्ति विपत्ति के लिए उत्तरदायी व्यक्ति की पहचान पूछती है, पर नैतिक दोष को मूल से अधिक स्पष्ट नहीं करती।
- source_word: הָרָעָה הַזֹּאת
  choice: यह विपत्ति
  rationale: समुद्री तूफ़ान के संदर्भ में רָעָה हानिकारक घटना या आपदा को दर्शाता है। ‘विपत्ति’ सन्दर्भानुकूल है, जबकि पाद-टिप्पणी शब्द की व्यापक अर्थ-सीमा सुरक्षित रखती है।
- source_word: לָנוּ
  choice: हम पर ... आई है
  rationale: इब्रानी में स्पष्ट क्रिया नहीं है; हिन्दी में भाव को स्वाभाविक बनाने के लिए ‘हम पर आई है’ जोड़ा गया है।
- source_word: וַיַּפִּלוּ גוֹרָלוֹת
  choice: तब उन्होंने चिट्ठियाँ डालीं
  rationale: कथात्मक क्रिया प्रस्ताव के बाद हुई अगली घटना को आगे बढ़ाती है; ‘तब’ क्रम को स्पष्ट करता है।
- source_word: וַיִּפֹּל הַגּוֹרָל עַל יוֹנָה
  choice: चिट्ठी योना के नाम निकली
  rationale: यह हिन्दी में चिट्ठी डालने के परिणाम को बताने वाला स्वाभाविक मुहावरा है और स्पष्ट करता है कि चयन योना का हुआ।
theological_decisions:
- issue: दैवी व्यवस्था से जुड़ी विपत्ति के प्रसंग में רָעָה का अनुवाद
  choice: यह विपत्ति
  alternative: यह बुराई / यह अनिष्ट / यह आपदा
  rationale: यहाँ नाविक उस संकट की बात कर रहे हैं जो उन पर आया है, न कि उनके द्वारा किए गए किसी नैतिक पाप की। ‘विपत्ति’ प्रसंग को स्पष्ट रखती है; पाद-टिप्पणी मूल शब्द में निहित ‘बुराई, हानि या आपदा’ की व्यापकता को बनाए रखती है और परमेश्वर के नैतिक चरित्र के विषय में अनावश्यक निष्कर्ष नहीं जोड़ती।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण कथात्मक रूप अपनाया गया है। ‘चिट्ठियाँ डालना’ और ‘चिट्ठी ... के नाम निकलना’ सामान्य पाठक के लिए स्वाभाविक हैं; मूल की अर्थगत व्यापकता पाद-टिप्पणी में सुरक्षित रखी गई है।
