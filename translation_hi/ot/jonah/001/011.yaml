base_translation:
  language: en
  yaml_path: translation/ot/jonah/001/011.yaml
  text: Then they said to him[b][a], “What should we do to you so that the sea may quiet down for us?” For the sea was growing more and more stormy.
translation:
  language: hi
  text: तब उन्होंने उससे कहा, “हम तुम्हारे साथ क्या करें, ताकि समुद्र हमसे दूर शांत हो जाए[a]?” क्योंकि समुद्र और भी प्रचण्ड होता जा रहा था[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “हमारे ऊपर से शांत हो जाए”; यह समुद्र के संकट को उन पर छाए हुए खतरे के रूप में चित्रित करता है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में शाब्दिक रूप से, “समुद्र जा रहा था और तूफ़ानी हो रहा था”; यह एक इब्रानी मुहावरा है, जिसका अर्थ है कि वह लगातार अधिक प्रचण्ड होता जा रहा था।
    reason: lexical_alternative
lexical_decisions:
- source_word: מַה נַּעֲשֶׂה לָּךְ
  choice: हम तुम्हारे साथ क्या करें
  rationale: यह नाविकों के विचार-विमर्श वाले प्रश्न को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है। इब्रानी में शाब्दिक रूप से ‘तुम्हारे लिए/तुम्हें क्या करें’ है, पर इस प्रसंग में ‘तुम्हारे साथ क्या करें’ आशय को स्पष्ट और सहज रखता है।
- source_word: וְיִשְׁתֹּק
  choice: ताकि ... शांत हो जाए
  rationale: שׁתק का अर्थ ‘शांत/स्थिर होना’ है। संयोजक वाव को यहाँ प्रसंगानुसार उद्देश्य के रूप में ‘ताकि’ कहना प्रश्न और अपेक्षित परिणाम का संबंध स्पष्ट करता है।
- source_word: הַיָּם
  choice: समुद्र
  rationale: יָם का इस कथा-प्रसंग में मानक और स्वाभाविक हिन्दी रूप ‘समुद्र’ है।
- source_word: מֵעָלֵינוּ
  choice: हमारे लिए
  rationale: मुख्य पाठ में यह सहज हिन्दी देता है कि समुद्र का संकट उनसे दूर होकर उनके लिए शांत हो जाए। मूल अभिव्यक्ति ‘हमारे ऊपर से’ की सजीव छवि को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यह उनकी तत्काल चिंता का कारण बताने वाला व्याख्यात्मक उपवाक्य आरम्भ करता है।
- source_word: הוֹלֵךְ וְסֹעֵר
  choice: और भी प्रचण्ड होता जा रहा था
  rationale: הוֹלֵךְ के साथ कृदन्त बढ़ती हुई निरंतरता दर्शाता है। ‘होता जा रहा था’ इस प्रगतिशील तीव्रता को स्वाभाविक हिन्दी में व्यक्त करता है।
