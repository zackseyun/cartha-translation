source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר אֲלֵי/הֶ֗ם שָׂא֨וּ/נִי֙ וַ/הֲטִילֻ֣/נִי אֶל הַ/יָּ֔ם וְ/יִשְׁתֹּ֥ק הַ/יָּ֖ם מֵֽ/עֲלֵי/כֶ֑ם כִּ֚י יוֹדֵ֣עַ אָ֔נִי כִּ֣י בְ/שֶׁ/לִּ֔/י הַ/סַּ֧עַר הַ/גָּד֛וֹל הַ/זֶּ֖ה עֲלֵי/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/jonah/001/012.yaml
  text: And he said to them[a], “Pick me up and throw me into the sea, and the sea will become calm for you[c][b], for I know that this great storm is upon you because of me.”
translation:
  language: hi
  text: उसने उनसे कहा, “मुझे उठाकर समुद्र में फेंक दो, और समुद्र तुम्हारे लिए शांत हो जाएगा; क्योंकि मैं जानता हूँ कि यह बड़ा तूफ़ान मेरे कारण तुम पर आया है।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שָׂאוּנִי
  choice: मुझे उठाकर
  rationale: נשא यहाँ योना को शारीरिक रूप से उठाने की क्रिया बताता है, ताकि उसे समुद्र में फेंका जा सके। ‘मुझे उठाकर’ सहज और ठोस है।
- source_word: וַהֲטִילֻנִי
  choice: फेंक दो
  rationale: טול के हिफ़ील रूप का अर्थ फेंकना या डालना है। ‘फेंक दो’ आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: וְיִשְׁתֹּק הַיָּם
  choice: समुद्र ... शांत हो जाएगा
  rationale: שתק का मूल भाव चुप या स्थिर हो जाना है; तूफ़ानी समुद्र के संदर्भ में ‘शांत हो जाएगा’ आशय को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: מֵעֲלֵיכֶם
  choice: तुम्हारे लिए
  rationale: इब्रानी मुहावरा शाब्दिक रूप से ‘तुम्हारे ऊपर से’ है और नाविकों पर पड़े समुद्री संकट के हटने को दर्शाता है। मुख्य पाठ में ‘तुम्हारे लिए’ स्वाभाविक हिन्दी देता है, जबकि शाब्दिक बिंब पादटिप्पणी में सुरक्षित है।
- source_word: בְשֶׁלִּי
  choice: मेरे ही कारण
  rationale: यह पद कारण और व्यक्तिगत उत्तरदायित्व दर्शाता है। ‘ही’ योना की स्पष्ट आत्म-स्वीकृति को बिना बढ़ा-चढ़ाकर सामने लाता है।
- source_word: הַסַּעַר הַגָּדוֹל הַזֶּה
  choice: यह बड़ा तूफ़ान
  rationale: यह अनुवाद संकेतवाचक, विशेषण और संज्ञा—तीनों को सीधे और समकालीन हिन्दी में सुरक्षित रखता है।
- source_word: עֲלֵיכֶם
  choice: तुम पर आया है
  rationale: इब्रानी में ‘तुम पर’ का बिंब है। हिन्दी में ‘आया है’ जोड़ने से वही भाव स्वाभाविक रूप से व्यक्त होता है, बिना कारण-संबंध बदले।
theological_decisions:
- issue: तूफ़ान के लिए योना की दोष-स्वीकृति
  choice: योना स्पष्ट रूप से स्वीकार करता है कि तूफ़ान उसके कारण नाविकों पर आया है।
  alternative: योना केवल तूफ़ान से अपना संबंध बताता है, प्रत्यक्ष उत्तरदायित्व नहीं।
  rationale: בְשֶׁלִּי कारण अथवा उत्तरदायित्व को स्पष्ट करता है; इसलिए अनुवाद में योना की स्वीकारोक्ति को नरम नहीं किया गया।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। प्रत्यक्ष कथन में छोटे वाक्यों का प्रयोग मौखिक तात्कालिकता बनाए रखता है; किसी सांप्रदायिक या अतिरिक्त व्याख्यात्मक तत्व को नहीं जोड़ा गया।
