reference: Jonah 1:4
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַֽ/יהוָ֗ה הֵטִ֤יל רֽוּחַ גְּדוֹלָה֙ אֶל הַ/יָּ֔ם וַ/יְהִ֥י סַֽעַר גָּד֖וֹל בַּ/יָּ֑ם וְ/הָ֣/אֳנִיָּ֔ה חִשְּׁבָ֖ה לְ/הִשָּׁבֵֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jonah/001/004.yaml
  text: But Yahweh hurled a great wind onto the sea[a], and there was a great storm on the sea[b], so that the ship seemed about to be broken up.
translation:
  language: hi
  text: पर[a] याहवे ने समुद्र पर एक प्रचंड हवा फेंक दी, और समुद्र में एक प्रचंड तूफ़ान उठा। जहाज़ मानो टूटने ही वाला था[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “और याहवे ने…” इब्रानी वाव का साधारण अर्थ “और” भी हो सकता है; यहाँ “पर” योना के भागने के बाद कथा में आए विरोध को व्यक्त करता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “जहाज़ ने टूट जाने का सोचा।” यह इब्रानी व्यक्तिकरण बताता है कि जहाज़ टूटने के निकट था।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיהוָה
  choice: पर याहवे
  rationale: संदर्भ में वाव कथा को आगे बढ़ाते हुए योना के भागने और याहवे की कार्रवाई के बीच हल्का विरोध दिखाता है। परमेश्वर के विशिष्ट नाम יהוה को ‘याहवे’ रूप में रखा गया है।
- source_word: הֵטִיל
  choice: फेंकी
  rationale: यह क्रिया बलपूर्वक फेंकने का जीवंत बोध देती है; केवल ‘भेजी’ कहना इसकी तीव्रता को कम कर देता।
- source_word: רוּחַ גְּדוֹלָה
  choice: प्रचंड हवा
  rationale: समुद्री संदर्भ में רוּחַ का अर्थ स्पष्टतः ‘हवा’ है। ‘प्रचंड’ גָּדוֹל की तीव्रता को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: אֶל הַיָּם
  choice: समुद्र पर
  rationale: אֶל यहाँ फेंकने की दिशा और लक्ष्य बताता है; ‘समुद्र पर’ हिन्दी में उस दिशात्मक भाव को संक्षेप में बनाए रखता है।
- source_word: וַיְהִי סַעַר גָּדוֹל
  choice: और समुद्र में प्रचंड तूफ़ान उठा
  rationale: וַיְהִי के घटनात्मक भाव के लिए ‘उठा’ स्वाभाविक है। दोनों स्थानों पर גָּדוֹל के दोहराव को ‘प्रचंड’ दोहराकर सुरक्षित रखा गया है।
- source_word: חִשְּׁבָה לְהִשָּׁבֵר
  choice: जहाज़ मानो टूटने ही वाला था
  rationale: इब्रानी में जहाज़ को मानवीय ढंग से ‘सोचता’ हुआ दिखाया गया है। ‘मानो’ उस व्यक्तिकरण की झलक रखता है, और ‘टूटने ही वाला’ आसन्न विनाश का भाव स्पष्ट करता है।
theological_decisions:
- issue: परमेश्वर के नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में चार अक्षरों वाला विशिष्ट वाचा-नाम सीधे आया है। ‘याहवे’ उसे उपाधि ‘प्रभु’ से बदलने के बजाय नाम के रूप में प्रस्तुत करता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘प्रचंड’ की पुनरावृत्ति मूल के גָּדוֹל/גְּדוֹלָה की साहित्यिक पुनरावृत्ति को बनाए रखती है; ‘मानो’ जहाज़ के व्यक्तिकरण को पूरी तरह मिटने नहीं देता।
