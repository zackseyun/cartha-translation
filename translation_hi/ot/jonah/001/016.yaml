source:
  edition: WLC
  text: וַ/יִּֽירְא֧וּ הָ/אֲנָשִׁ֛ים יִרְאָ֥ה גְדוֹלָ֖ה אֶת יְהוָ֑ה וַ/יִּֽזְבְּחוּ זֶ֨בַח֙ לַֽ/יהוָ֔ה וַֽ/יִּדְּר֖וּ נְדָרִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jonah/001/016.yaml
  text: Then the men feared Yahweh with great fear[a], and they offered a sacrifice to Yahweh and made vows.
translation:
  language: hi
  text: तब उन पुरुषों ने यहोवा का बहुत भय माना, और उन्होंने यहोवा को बलिदान चढ़ाया और मन्नतें मानीं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּירְאוּ ... יִרְאָה גְדוֹלָה
  choice: बड़े भय के साथ ... भय माना
  rationale: क्रिया ירא और उसी मूल की संज्ञा יִרְאָה के बलाघाती प्रयोग को बनाए रखता है। यह वाक्यांश आतंक और श्रद्धामय विस्मय, दोनों की संभावना को खुला रखता है।
- source_word: הָאֲנָשִׁים
  choice: उन पुरुषों
  rationale: मूल पाठ सामान्य संज्ञा 'पुरुषों' का प्रयोग करता है; प्रसंगानुसार 'नाविकों' कहना संभव है, पर वह यहाँ मूल से अधिक विशिष्ट होगा। हिंदी में 'उन' पूर्वोक्त पुरुषों की ओर स्वाभाविक संकेत करता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को पारंपरिक और व्यापक रूप से पहचाने जाने वाले हिंदी रूप 'यहोवा' में व्यक्त किया गया है, किसी उपाधि से प्रतिस्थापित नहीं किया गया।
- source_word: וַיִּזְבְּחוּ זֶבַח
  choice: बलि चढ़ाई
  rationale: क्रिया-संज्ञा के इब्रानी मुहावरे का स्वाभाविक हिंदी धार्मिक समतुल्य है और बलिदान के अर्पण का भाव स्पष्ट रखता है।
- source_word: וַיִּדְּרוּ נְדָרִים
  choice: मन्नतें मानीं
  rationale: औपचारिक धार्मिक प्रतिज्ञाओं के लिए सहज आधुनिक हिंदी अभिव्यक्ति है; बहुवचन נְדָרִים भी सुरक्षित रहता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: मूल में व्यक्तिगत ईश्वरीय नाम है। हिंदी पाठकों के बीच स्थापित नामरूप 'यहोवा' इसे उपाधि में बदले बिना सुरक्षित रखता है।
- issue: यहोवा के प्रति भय का स्वरूप
  choice: बड़े भय के साथ यहोवा का भय माना
  alternative: यहोवा से बहुत डर गए; यहोवा का बहुत आदर किया
  rationale: इब्रानी कथन भय, विस्मय और श्रद्धा के बीच अंतर को स्पष्ट रूप से सीमित नहीं करता। चुना गया रूप इस तनाव को बनाए रखता है, विशेषकर इसके बाद आने वाली बलि और मन्नतों के संदर्भ में।
translation_notes:
  register: आधुनिक मानक हिंदी का सहज, गरिमापूर्ण बाइबलीय गद्य। 'भय माना' जानबूझकर रखा गया है ताकि इब्रानी मूल की पुनरुक्ति और भय तथा श्रद्धा की संयुक्त संभावना सुरक्षित रहे।
