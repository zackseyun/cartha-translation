  text: וַ/יֹּ֥אמֶר אֲלֵי/הֶ֖ם עִבְרִ֣י אָנֹ֑כִי וְ/אֶת יְהוָ֞ה אֱלֹהֵ֤י הַ/שָּׁמַ֨יִם֙ אֲנִ֣י יָרֵ֔א אֲשֶׁר עָשָׂ֥ה אֶת הַ/יָּ֖ם וְ/אֶת הַ/יַּבָּשָֽׁה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jonah/001/009.yaml
  text: He said to them[a], “I am a Hebrew, and I fear Yahweh, the God of heaven[b], who made the sea and the dry land.”
translation:
  language: hi
  text: उसने उनसे कहा, “मैं इब्री हूँ। मैं याहवे[a], स्वर्ग के परमेश्वर का भय मानता हूँ[b], जिसने समुद्र और सूखी भूमि को बनाया है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: हिब्रू में परमेश्वर का व्यक्तिगत नाम “YHWH” है; यहाँ उसका लिप्यंतरण “याहवे” किया गया है।
    reason: divine_name
  - marker: b
    text: या “श्रद्धा करता हूँ” अथवा “उपासना करता हूँ।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אֲלֵיהֶם
  choice: उसने उनसे कहा
  rationale: हिब्रू कथात्मक वाक्य का स्वाभाविक आधुनिक हिन्दी रूप; आरम्भिक वाव को अलग से ‘और’ कहना यहाँ आवश्यक नहीं है।
- source_word: עִבְרִי
  choice: इब्री
  rationale: योना की जातीय पहचान के लिए प्रचलित और स्रोत के निकट हिन्दी शब्द।
- source_word: יְהוָה
  choice: याहवे
  rationale: चतुरक्षरीय व्यक्तिगत ईश्वरीय नाम का हिन्दी लिप्यंतरण; इसे किसी उपाधि से प्रतिस्थापित नहीं किया गया है।
- source_word: אֱלֹהֵי הַשָּׁמַיִם
  choice: स्वर्ग के परमेश्वर
  rationale: हिब्रू संबंधवाचक पदबंध का स्वाभाविक हिन्दी रूप; ‘स्वर्ग’ इस उपाधि में הַשָּׁמַיִם का मुहावरेदार एकवचन अनुवाद है।
- source_word: יָרֵא
  choice: भय मानता हूँ
  rationale: यह परमेश्वर के प्रति श्रद्धापूर्ण भय व्यक्त कर सकता है। सीधा अर्थ बनाए रखने से योना के कथन और उसके आचरण के बीच की विडंबनापूर्ण धार्मिक कसावट बनी रहती है।
- source_word: עָשָׂה
  choice: बनाया है
  rationale: सामान्य क्रिया का सीधा रूप; ‘सृष्टि की’ की अपेक्षा स्रोत की साधारण क्रिया के अधिक निकट है।
- source_word: הַיָּם
  choice: समुद्र
  rationale: समुद्री प्रसंग में इसका सामान्य और सटीक हिन्दी पर्याय।
- source_word: הַיַּבָּשָׁה
  choice: सूखी भूमि
  rationale: समुद्र के विपरीत जलरहित स्थल का स्पष्ट अर्थ सुरक्षित रखता है।
- source_word: אָנֹכִי ... אֲנִי
  choice: मैं ... हूँ। मैं ... भय मानता हूँ
  rationale: दोनों स्पष्ट प्रथम-पुरुष सर्वनामों को स्वाभाविक हिन्दी में दो वाक्यों के द्वारा उभारा गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: प्रभु
  rationale: मूल पाठ में व्यक्तिगत नाम सीधे आया है; लिप्यंतरण उसे किसी उपाधि में बदलने से बचाता है।
- issue: योना के आत्मवर्णन में יָרֵא का अर्थ
  choice: भय मानता हूँ
  alternative: श्रद्धा करता हूँ / उपासना करता हूँ
  rationale: सीधा शब्दार्थ योना के विश्वास के दावे और उसके भागने के बीच की धार्मिक एवं साहित्यिक कसावट को बिना हल किए सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। ‘भय मानता हूँ’ सामान्य हिन्दी में श्रद्धापूर्ण भय को व्यक्त करता है, जबकि मूल की अर्थगत व्यापकता और प्रसंग की विडंबना भी बनाए रखता है।
