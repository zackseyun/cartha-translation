source:
  edition: WLC
  text: וַ/יָּ֤קָם יוֹנָה֙ לִ/בְרֹ֣חַ תַּרְשִׁ֔ישָׁ/ה מִ/לִּ/פְנֵ֖י יְהוָ֑ה וַ/יֵּ֨רֶד יָפ֜וֹ וַ/יִּמְצָ֥א אָנִיָּ֣ה בָּאָ֣ה תַרְשִׁ֗ישׁ וַ/יִּתֵּ֨ן שְׂכָרָ֜/הּ וַ/יֵּ֤רֶד בָּ/הּ֙ לָ/ב֤וֹא עִמָּ/הֶם֙ תַּרְשִׁ֔ישָׁ/ה מִ/לִּ/פְנֵ֖י יְהוָֽה׀׃
base_translation:
  language: en
  yaml_path: translation/ot/jonah/001/003.yaml
  text: But Jonah rose to flee to Tarshish from the presence of Yahweh[a]. He went down to Joppa and found a ship going to Tarshish. He paid its fare and went down into it to go with them to Tarshish[c][b], away from the presence of Yahweh.
translation:
  language: hi
  text: लेकिन योना याहवे की उपस्थिति से दूर[a] तर्शीश भाग जाने के लिए उठा। वह याफ़ा उतर गया और उसे तर्शीश जाने वाला[b] एक जहाज़ मिला। उसने उसका किराया चुकाया और उनके साथ तर्शीश जाने के लिए उसमें उतर गया[c]—याहवे की उपस्थिति से दूर।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “याहवे के सामने से।” इसका अर्थ “याहवे से दूर” भी समझा जा सकता है।
    reason: lexical_alternative
  - marker: b
    text: या, “तर्शीश के लिए रवाना होने वाला।” इब्रानी अभिव्यक्ति शाब्दिक रूप से “तर्शीश आने/जाने वाला जहाज़” है।
    reason: lexical_alternative
  - marker: c
    text: इब्रानी में यहाँ फिर “उतर गया” कहा गया है। इस अध्याय में यह पुनरावृत्ति कथा की नीचे की ओर बढ़ती गति को उभारती है।
    reason: literary_feature
lexical_decisions:
- source_word: וַיָּקָם
  choice: उठा
  rationale: यह मूल क्रिया के ‘उठने’ के अर्थ और इब्रानी कथात्मक क्रम, दोनों को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: לִבְרֹחַ
  choice: भाग जाने के लिए
  rationale: ברח का आशय पलायन करना है; यह रूप योना के जानबूझकर बच निकलने के प्रयास को स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: תַּרְשִׁישָׁה
  choice: तर्शीश
  rationale: स्थान-नाम के साथ लगा दिशासूचक ה उस ओर गति बताता है; हिन्दी में ‘तर्शीश (जाने)’ से यह दिशा व्यक्त होती है।
- source_word: מִלִּפְנֵי יְהוָה
  choice: याहवे की उपस्थिति से दूर
  rationale: לִפְנֵי में मुख/सम्मुखता से विकसित ‘उपस्थिति’ का भाव है। ‘उपस्थिति से दूर’ मूल बिंब और परमेश्वर से बच निकलने के प्रयास की विडंबना को सुरक्षित रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: चतुरक्षरीय वाचा-नाम को उपाधि से बदलने के बजाय हिन्दी लिपि में नाम के रूप में प्रस्तुत किया गया है।
- source_word: יָפוֹ
  choice: याफ़ा
  rationale: यह प्राचीन बंदरगाह के नाम का हिन्दी में प्रचलित और मूल उच्चारण के निकट रूप है।
- source_word: אָנִיָּה
  choice: जहाज़
  rationale: यह समुद्री यात्रा करने वाले बड़े जलयान के लिए सहज और पर्याप्त रूप से विशिष्ट आधुनिक हिन्दी शब्द है।
- source_word: בָּאָה תַרְשִׁישׁ
  choice: तर्शीश जाने वाला
  rationale: בוא सामान्यतः ‘आना’ है, पर गंतव्य के साथ यहाँ तर्शीश की ओर जाने का अर्थ देता है; हिन्दी में यह सबसे स्वाभाविक यात्रा-वर्णन है।
- source_word: שְׂכָרָהּ
  choice: उसका किराया
  rationale: שׂכר यहाँ भाड़े, किराये या यात्रा-शुल्क को सूचित कर सकता है। ‘उसका किराया’ मूल के स्त्रीलिंग प्रत्यय को जहाज़ की ओर संदर्भित करते हुए अर्थ को अनावश्यक रूप से सीमित नहीं करता।
- source_word: וַיֵּרֶד בָּהּ
  choice: उसमें उतर गया
  rationale: ‘जहाज़ पर चढ़ गया’ अधिक सामान्य हिन्दी होती, पर मूल में ירד (‘नीचे उतरना’) की पुनरावृत्ति कथा की नीचे की ओर गति को उभारती है; इसलिए उसे सुरक्षित रखा गया है।
- source_word: לָבוֹא עִמָּהֶם
  choice: उनके साथ … जाने के लिए
  rationale: संदर्भगत दृष्टिकोण से हिन्दी में ‘उनके साथ जाने’ का प्रयोग ‘उनके साथ आने’ से अधिक स्वाभाविक है और मूल आशय को बनाए रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में वाचा का विशिष्ट नाम है। उसे ‘प्रभु’ जैसी उपाधि से प्रतिस्थापित न करके लिप्यंतरित किया गया है; ‘याहवे’ उपलब्ध भाषिक साक्ष्य के निकट रूप है।
- issue: מִלִּפְנֵי יְהוָה में योना के प्रयत्न का अर्थ
  choice: याहवे की उपस्थिति से दूर
  alternative: याहवे के सामने से; याहवे से दूर
  rationale: अनुवाद मूल के ‘मुख/उपस्थिति’ संबंधी ठोस मुहावरे को बनाए रखता है, पर यह दावा नहीं करता कि योना वास्तव में परमेश्वर की सर्वव्यापी उपस्थिति से बच सकता था। दोनों बार इसकी पुनरावृत्ति जानबूझकर रखी गई है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘उतर गया’ जैसे कुछ कम अपेक्षित प्रयोग मूल की साहित्यिक पुनरावृत्ति बचाने के लिए जानबूझकर रखे गए हैं। स्थान-नाम ‘तर्शीश’ और ‘याफ़ा’ तथा ईश्वरीय नाम ‘याहवे’ देवनागरी में लिप्यंतरित हैं।
