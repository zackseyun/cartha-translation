source:
  edition: WLC
  text: קָר֤וֹב יוֹם יְהוָה֙ הַ/גָּד֔וֹל קָר֖וֹב וּ/מַהֵ֣ר מְאֹ֑ד ק֚וֹל י֣וֹם יְהוָ֔ה מַ֥ר צֹרֵ֖חַ שָׁ֥ם גִּבּֽוֹר־׃
base_translation:
  language: en
  yaml_path: translation/ot/zephaniah/001/014.yaml
  text: 'The great day of Yahweh is near—near and coming very quickly. The sound of the day of Yahweh: there the warrior cries out bitterly.'
translation:
  language: hi
  text: याहवेह का महान दिन निकट है—निकट, और बहुत तेज़ी से आ रहा है। याहवेह के दिन की ध्वनि![a] वहाँ योद्धा कड़वाहट से चिल्लाता है।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “याहवेह के दिन की आवाज़!”; इब्रानी शब्द का अर्थ “ध्वनि,” “आवाज़” या “कोलाहल” हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या “वहाँ वीर पुरुष कड़वाहट से पुकारता है।”
    reason: alternative_reading
lexical_decisions:
- source_word: קָרוֹב
  choice: निकट है
  rationale: विधेय विशेषण आसन्नता व्यक्त करता है; इसकी पुनरावृत्ति मूल पाठ के बलाघात को सुरक्षित रखती है।
- source_word: יוֹם יְהוָה
  choice: याहवेह का दिन
  rationale: यह नबी-साहित्य में परमेश्वर के निर्णायक हस्तक्षेप और न्याय का स्थापित पदबंध है; संबंधकारक रचना को स्वाभाविक हिन्दी में रखा गया है।
- source_word: יְהוָה
  choice: याहवेह
  rationale: मूल पाठ में आए परमेश्वर के व्यक्तिगत नाम को उपाधि से प्रतिस्थापित करने के बजाय लिप्यंतरित किया गया है।
- source_word: הַגָּדוֹל
  choice: महान
  rationale: विशेषण का सीधा अर्थ ‘महान’ है; मूल में न आए ‘भयानक’ जैसे विस्तार को नहीं जोड़ा गया।
- source_word: וּמַהֵר מְאֹד
  choice: और बहुत तेज़ी से आ रहा है
  rationale: यह अभिव्यक्ति दिन की निकटता के साथ उसके शीघ्र आने पर भी बल देती है; हिन्दी में क्रियात्मक रूप आशय को स्पष्ट और स्वाभाविक बनाता है।
- source_word: קוֹל
  choice: ध्वनि
  rationale: यह शब्द ध्वनि, आवाज़ या कोलाहल का अर्थ दे सकता है; ‘ध्वनि’ व्यापक है और किसी विशिष्ट वक्ता को अनावश्यक रूप से निर्धारित नहीं करती।
- source_word: מַר
  choice: फूट-फूटकर
  rationale: यहाँ शब्द तीखी, पीड़ाभरी रीति से पुकारने का भाव देता है; हिन्दी मुहावरा करुण तीव्रता व्यक्त करता है।
- source_word: צֹרֵחַ
  choice: चिल्लाता है
  rationale: कृदंत एक ऊँची और तीव्र पुकार का चित्र देता है; वर्तमानकालीन रूप मूल की सजीवता बनाए रखता है।
- source_word: שָׁם
  choice: वहाँ
  rationale: स्थानवाचक क्रियाविशेषण को उसके सामान्य अर्थ में रखा गया है और उसे कालवाचक ‘तब’ नहीं बनाया गया।
- source_word: גִּבּוֹר
  choice: योद्धा
  rationale: शब्द बलवान युद्ध-पुरुष या वीर को सूचित करता है; न्याय के प्रसंग में ‘योद्धा’ स्पष्ट और स्वाभाविक है।
theological_decisions:
- issue: परमेश्वर के नाम יְהוָה का अनुवाद
  choice: याहवेह
  alternative: यहोवा; प्रभु
  rationale: मूल में चतुरक्षरी व्यक्तिगत नाम सीधे प्रयुक्त है; उसे व्यक्तिगत नाम के रूप में रखने से पाठ की वाचा-संबंधी विशिष्टता सुरक्षित रहती है, जबकि किसी उपाधि को आरोपित नहीं किया जाता।
- issue: अंतिम उपवाक्य में גִּבּוֹר की पहचान
  choice: योद्धा फूट-फूटकर चिल्लाता है
  alternative: वीर पुरुष कड़वाहट से पुकारता है
  rationale: ‘योद्धा’ युद्ध-संबंधी चित्र को सुरक्षित रखता है और यह अर्थ नहीं जोड़ता कि वह कोई विशिष्ट अलौकिक या मसीही पात्र है।
- issue: קוֹל יוֹם יְהוָה की वाक्यगत भूमिका
  choice: याहवेह के दिन की ध्वनि!
  alternative: याहवेह के दिन की आवाज़
  rationale: इब्रानी पदबंध अचानक और संक्षिप्त है; विस्मयादिबोधक वाक्य उसकी नाटकीयता रखता है, पर ‘ध्वनि’ और ‘आवाज़’ की वास्तविक शब्दार्थगत अस्पष्टता पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सहज स्तर रखा गया है। मूल की पुनरावृत्ति, आसन्नता, अचानक श्रव्य चित्र और अंतिम उपवाक्य की तीव्रता को बनाए रखा गया है। ‘याहवेह’ नामरूप है; विराम-चिह्न मूल की संक्षिप्त, उद्घोषणात्मक बनावट को हिन्दी में दर्शाते हैं।
