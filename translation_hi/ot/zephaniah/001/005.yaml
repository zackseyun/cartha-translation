base_translation:
  language: en
  yaml_path: translation/ot/zephaniah/001/005.yaml
  text: those who bow down on the rooftops to the host of heaven[a], and those who bow down, who swear by Yahweh and swear by Milcom.
translation:
  language: hi
  text: जो छतों पर आकाश की सेना को दण्डवत करते हैं, और जो दण्डवत करते हैं, जो याहवे की शपथ खाते हैं और मिल्कोम की भी शपथ खाते हैं[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उनके राजा की”; कुछ लोग यहाँ के नाम को “मोलेक” समझते हैं।
    reason: इब्रानी מַלְכָּם को मिल्कोम नाम के अतिरिक्त ‘उनके राजा’ समझा जा सकता है, और कुछ व्याख्याएँ इसे मोलेक से जोड़ती हैं।
lexical_decisions:
- source_word: הַמִּשְׁתַּחֲוִים
  choice: दण्डवत करते हैं
  rationale: यह क्रिया आराधना में झुकने या भूमि तक झुकने की शारीरिक क्रिया व्यक्त करती है। ‘दण्डवत करना’ उस क्रिया और उसके आराधनात्मक अर्थ दोनों को बनाए रखता है।
- source_word: עַל הַגַּגּוֹת
  choice: छतों पर
  rationale: यह सीधा स्थानवाचक अनुवाद है और प्राचीन घरों की समतल छतों पर की जाने वाली आराधना का सांस्कृतिक संदर्भ बनाए रखता है।
- source_word: לִצְבָא הַשָּׁמָיִם
  choice: आकाश की सेना के आगे
  rationale: यह अभिव्यक्ति आकाशीय पिंडों के पूरे समूह को एक संगठित सेना के रूपक में प्रस्तुत करती है। ‘तारों’ कहना अर्थ को अनावश्यक रूप से सीमित करता, जबकि ‘स्वर्गीय सेना’ से आधुनिक पाठक स्वर्गदूत समझ सकते हैं।
- source_word: הַנִּשְׁבָּעִים לַיהוָה
  choice: याहवे की शपथ खाते हैं
  rationale: यहाँ शपथ में याहवे के नाम और उसके प्रति निष्ठा का आह्वान है। अगली समानांतर अभिव्यक्ति के साथ ‘की शपथ खाना’ स्वाभाविक हिन्दी है।
- source_word: לַיהוָה
  choice: याहवे
  rationale: इब्रानी परमेश्वर-नाम יהוה को नाम के रूप में स्पष्ट और सीधे ढंग से प्रस्तुत किया गया है।
- source_word: בְּמַלְכָּם
  choice: मिल्कोम की
  rationale: व्यंजनात्मक रूप और मूर्तिपूजा-विरोधी संदर्भ अम्मोनी देवता मिल्कोम की ओर संकेत करते हैं। फिर भी ‘अपने राजा’ और ‘मोलेक’ संभव पाठ-समझ हैं, इसलिए उन्हें पादटिप्पणी में रखा गया है।
theological_decisions:
- issue: מַלְכָּם की पहचान
  choice: मुख्य पाठ में विदेशी देवता ‘मिल्कोम’
  alternative: ‘अपने राजा की’; अथवा ‘मोलेक’
  rationale: पद याहवे और दूसरे आराध्य के नाम की शपथ खाने वाली मिली-जुली निष्ठा की निन्दा करता है। ‘मिल्कोम’ समानांतरता और मूर्तिपूजा-विरोधी संदर्भ के अनुकूल है, पर इब्रानी रूप की वास्तविक अस्पष्टता पादटिप्पणी में सुरक्षित रखी गई है।
- issue: याहवे और मिल्कोम दोनों की शपथ
  choice: दोनों शपथों को एक ही आराधक समूह की मिली-जुली निष्ठा के रूप में व्यक्त किया गया
  alternative: दो अलग-अलग शपथ खाने वाले समूह
  rationale: दोनों participles पर समान निश्चित उपपद और संयोजक संरचना सबसे स्वाभाविक रूप से उन लोगों का वर्णन करती है जो याहवे और मिल्कोम दोनों की शपथ खाते हैं; इसी धर्म-मिश्रण की निन्दा पद का तनाव है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य हिन्दी। ‘दण्डवत करना’ आराधना में झुकने की मूर्त क्रिया बनाए रखता है; ‘आकाश की सेना’ मूल रूपक को बिना उसे केवल तारों या स्वर्गदूतों तक सीमित किए सुरक्षित रखता है।
