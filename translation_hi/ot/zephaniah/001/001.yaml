base_translation:
  language: en
  yaml_path: translation/ot/zephaniah/001/001.yaml
  text: 'The word of Yahweh that came to Zephaniah son of Cushi[a], son of Gedaliah, son of Amariah, son of Hezekiah, in the days of Josiah son of Amon[b], king of Judah:'
translation:
  language: hi
  text: 'याहवे का वह वचन जो सपन्याह के पास आया—सपन्याह कूशी[a] का पुत्र, कूशी गदल्याह का पुत्र, गदल्याह अमर्याह का पुत्र, और अमर्याह हिजकिय्याह[b] का पुत्र था—यहूदा के राजा, आमोन के पुत्र योशिय्याह के दिनों में:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘कूशी’ का अर्थ ‘कूशवासी’ भी हो सकता है, पर यहाँ वंशावली में इसे व्यक्तिनाम के रूप में प्रस्तुत किया गया है।
    reason: lexical_alternative
  - marker: b
    text: यह हिजकिय्याह संभवतः राजा हिजकिय्याह हो सकता है, जिससे सपन्याह राजवंश का वंशज ठहरेगा; लेकिन पाठ स्वयं उसे राजा के रूप में स्पष्टतः नहीं पहचानता।
    reason: cross_reference
lexical_decisions:
- source_word: דְּבַר יְהוָה
  choice: याहवे का वह वचन
  rationale: भविष्यवाणी की मानक आरंभिक अभिव्यक्ति को बनाए रखते हुए דְּבַר का अनुवाद ‘वचन’ और परमेश्वर के व्यक्तिगत नाम יהוה का लिप्यंतरण ‘याहवे’ किया गया है।
- source_word: אֲשֶׁר הָיָה אֶל
  choice: जो … के पास आया
  rationale: यह भविष्यवाणी-संबंधी प्रचलित इब्रानी मुहावरा है; हिन्दी में ‘के पास आया’ स्वाभाविक ढंग से उसके आशय को व्यक्त करता है।
- source_word: צְפַנְיָה
  choice: सपन्याह
  rationale: व्यक्तिनाम का हिन्दी बाइबलीय परंपरा के अनुरूप लिप्यंतरण।
- source_word: בֶּן
  choice: पुत्र
  rationale: वंशावली में बार-बार आए एकवचन संबंधसूचक पद को प्रत्यक्ष रूप से रखा गया है; पाठ स्वयं पीढ़ियों के लोप का संकेत नहीं देता।
- source_word: כּוּשִׁי
  choice: कूशी
  rationale: वंशावली में यह व्यक्तिनाम के रूप में प्रयुक्त जान पड़ता है; जातीय अर्थ ‘कूशवासी’ को मुख्य पाठ में थोपने के बजाय पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: גְּדַלְיָה / אֲמַרְיָה / חִזְקִיָּה
  choice: गदल्याह / अमर्याह / हिजकिय्याह
  rationale: व्यक्तिनामों के स्पष्ट और प्रचलित हिन्दी लिप्यंतरण।
- source_word: בִּימֵי
  choice: के दिनों की बात है
  rationale: शाब्दिक ‘के दिनों में’ का काल-संबंधी अर्थ स्वाभाविक आधुनिक हिन्दी में व्यक्त किया गया है, बिना इसे स्पष्ट रूप से ‘शासनकाल’ बना देने के।
- source_word: יֹאשִׁיָּהוּ בֶן אָמוֹן מֶלֶךְ יְהוּדָה
  choice: यहूदा के राजा आमोन के पुत्र योशिय्याह
  rationale: राजकीय उपाधि और पिता-पुत्र संबंध दोनों को मूल पाठ के अनुसार सुरक्षित रखा गया है।
theological_decisions:
- issue: हिजकिय्याह की पहचान राजा हिजकिय्याह के रूप में होने की संभावना
  choice: मुख्य पाठ में केवल ‘हिजकिय्याह’ रखा गया है।
  alternative: ‘राजा हिजकिय्याह’ लिखकर सपन्याह के राजवंशीय संबंध को स्पष्ट करना।
  rationale: मूल पाठ इस पूर्वज को ‘राजा’ नहीं कहता। संभावित ऐतिहासिक पहचान को पादटिप्पणी में रखा गया है, ताकि अनिश्चितता बनी रहे।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। लंबी इब्रानी वंशावली को स्पष्टता के लिए छोटे वाक्यों में खोला गया है, जबकि भविष्यवाणी की शीर्षक-सदृश समाप्ति दिखाने हेतु अंत में द्विबिंदु रखा गया है। सभी पादटिप्पणी चिह्न संबंधित शब्दों पर लगाए गए हैं।
