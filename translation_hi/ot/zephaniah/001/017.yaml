id: ZEP.1.17
reference: Zephaniah 1:17
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/הֲצֵרֹ֣תִי לָ/אָדָ֗ם וְ/הָֽלְכוּ֙ כַּֽ/עִוְרִ֔ים כִּ֥י לַֽ/יהוָ֖ה חָטָ֑אוּ וְ/שֻׁפַּ֤ךְ דָּמָ/ם֙ כֶּֽ/עָפָ֔ר וּ/לְחֻמָ֖/ם כַּ/גְּלָלִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/zephaniah/001/017.yaml
  text: And I will bring distress on mankind[a], and they will walk like the blind, because they have sinned against Yahweh; their blood will be poured out like dust[b], and their flesh like dung.
translation:
  language: hi
  text: मैं मनुष्यों पर संकट लाऊँगा[a], और वे अंधों के समान चलेंगे, क्योंकि उन्होंने यहोवा के विरुद्ध पाप किया है। उनका लहू धूल के समान उँडेला जाएगा, और उनका मांस[b] गोबर के समान।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में ‘मनुष्य’ एकवचन है, पर यहाँ उसका अर्थ सामूहिक है; अनुवाद ‘मनुष्यजाति’ भी संभव है।
    reason: lexical_alternative
  - marker: b
    text: इस दुर्लभ इब्रानी शब्द का अर्थ ‘अंतड़ियाँ’ या ‘भीतरी अंग’ भी समझा गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַהֲצֵרֹתִי
  choice: मैं ... संकट लाऊँगा
  rationale: हिफ़ील रूप किसी पर तंगी या संकट लाने की क्रिया व्यक्त करता है; यह चयन दैवी कर्तृत्व और न्याय के भाव को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: לָאָדָם
  choice: मनुष्यों पर
  rationale: אָדָם व्याकरणतः एकवचन होते हुए यहाँ सामूहिक अर्थ रखता है। हिन्दी में ‘मनुष्यों’ से वही व्यापक मानवीय संदर्भ स्वाभाविक रूप से व्यक्त होता है।
- source_word: וְהָלְכוּ כַּעִוְרִים
  choice: वे अंधों के समान चलेंगे
  rationale: शाब्दिक चलने की छवि और अंधों जैसी दिशाहीनता—दोनों को सुरक्षित रखा गया है।
- source_word: כִּי לַיהוָה חָטָאוּ
  choice: क्योंकि उन्होंने यहोवा के विरुद्ध पाप किया है
  rationale: כִּי कारण बताता है और חטא के साथ ל अपराध के लक्ष्य को दर्शाता है; इसलिए ‘के विरुद्ध’ स्पष्ट और सटीक है।
- source_word: וְשֻׁפַּךְ דָּמָם כֶּעָפָר
  choice: उनका लहू धूल के समान उँडेला जाएगा
  rationale: निष्क्रिय क्रिया और हिंसक न्याय की छवि सुरक्षित है; ‘लहू’ काव्यात्मक-भविष्यद्वाणी के गरिमामय स्तर के अनुकूल है।
- source_word: וּלְחֻמָם
  choice: उनका मांस
  rationale: दुर्लभ और विवादित संज्ञा को समानांतर पद ‘लहू’ के साथ व्यापक शारीरिक अर्थ में प्रस्तुत किया गया है; अधिक विशिष्ट संभावनाएँ पादटिप्पणी में दी गई हैं।
- source_word: כַּגְּלָלִים
  choice: गोबर के समान
  rationale: גללים मल या गोबर को दर्शाता है। ‘गोबर’ सीधा, सामान्य और मूल की कठोर अपमानजनक छवि को बिना नरम किए व्यक्त करता है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का रूपांतरण
  choice: यहोवा
  alternative: याहवे
  rationale: मूल में वाचा का विशिष्ट नाम है, इसलिए उसे उपाधि ‘प्रभु’ से नहीं बदला गया। आधुनिक हिन्दी बाइबलीय प्रयोग में ‘यहोवा’ व्यापक रूप से पहचाना जाता है; ‘याहवे’ अधिक संभावित विद्वत्तापरक उच्चारण है।
- issue: אָדָם का सामूहिक अर्थ
  choice: मनुष्यों
  alternative: मनुष्यजाति
  rationale: यहाँ एक व्यक्ति नहीं बल्कि मानव समुदाय अभिप्रेत है। बहुवचन ‘मनुष्यों’ अगले बहुवचन क्रियापद के साथ स्वाभाविक है और अनावश्यक रूप से अर्थ को समस्त मानवजाति तक निश्चित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमामय भविष्यद्वाणी शैली रखी गई है। वाक्य सरल और मौखिक रूप से सुबोध है; ‘लहू’ तथा ‘के समान’ पाठ को हल्का शास्त्रीय रंग देते हैं, जबकि अस्पष्ट וּלְחֻמָם को मुख्य पाठ में व्यापक अर्थ और पादटिप्पणी में वैकल्पिक अर्थों के साथ सुरक्षित रखा गया है।
