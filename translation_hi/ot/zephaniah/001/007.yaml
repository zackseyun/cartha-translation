id: ZEP.1.7
reference: Zephaniah 1:7
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: הַ֕ס מִ/פְּנֵ֖י אֲדֹנָ֣/י יְהוִ֑ה כִּ֤י קָרוֹב֙ י֣וֹם יְהוָ֔ה כִּֽי הֵכִ֧ין יְהוָ֛ה זֶ֖בַח הִקְדִּ֥ישׁ קְרֻאָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/zephaniah/001/007.yaml
  text: Be silent before the Lord GOD[a], for the day of Yahweh is near; for Yahweh has prepared a sacrifice; he has consecrated his invited ones.
translation:
  language: hi
  text: 'प्रभु याहवे के सामने चुप रहो,

    क्योंकि याहवे का दिन निकट है;

    क्योंकि याहवे ने एक बलिदान तैयार किया है,

    उसने अपने बुलाए हुए लोगों[a] को पवित्र किया है।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘अपने निमंत्रित जनों,’ ‘अपने अतिथियों,’ अथवा ‘अपने बुलाए गए जनों।’ इस प्रसंग में संभवतः वे लोग अभिप्रेत हैं जिन्हें याहवे ने बलिदान-सदृश न्याय के लिए बुलाया है।
    reason: कְרֻאָיו के अर्थ-क्षेत्र और प्रसंगगत अस्पष्टता को दिखाना।
lexical_decisions:
- source_word: הַס
  choice: चुप रहो
  rationale: यह मौन रहने की गंभीर और तात्कालिक आज्ञा है। ‘चुप रहो’ आधुनिक हिन्दी में स्वाभाविक है और केवल शारीरिक स्थिरता का अर्थ नहीं देता।
- source_word: מִפְּנֵי
  choice: के सामने
  rationale: इस प्रसंग में इसका अर्थ प्रभु की उपस्थिति में आदरपूर्वक मौन रहना है। ‘के सामने’ संक्षिप्त और स्वाभाविक है।
- source_word: אֲדֹנָי יְהוִה
  choice: प्रभु याहवे
  rationale: यह संयुक्त उपाधि אֲדֹנָי और परमेश्वर के निज नाम יְהוָה, दोनों को बनाए रखती है।
- source_word: קָרוֹב
  choice: निकट है
  rationale: यह आने वाले दिन की आसन्नता व्यक्त करता है और भविष्यद्वाणी की तात्कालिकता बनाए रखता है।
- source_word: יוֹם יְהוָה
  choice: याहवे का दिन
  rationale: यह न्याय से जुड़ी स्थापित भविष्यद्वाणी-अभिव्यक्ति को सीधे और स्पष्ट रूप में प्रस्तुत करता है।
- source_word: הֵכִין
  choice: तैयार किया है
  rationale: पूर्ण क्रिया तैयारी को संपन्न और निश्चित रूप में दिखाती है; यह बलिदान की उपमा के साथ स्वाभाविक है।
- source_word: זֶבַח
  choice: एक बलिदान
  rationale: मूल शब्द का सामान्य धार्मिक अर्थ रखा गया है, जबकि न्याय और वध की भयावह अंतर्ध्वनि को बिना व्याख्यात्मक विस्तार के बने रहने दिया गया है।
- source_word: הִקְדִּישׁ
  choice: पवित्र किया है
  rationale: यह क्रिया किसी को पवित्र उद्देश्य के लिए अलग करने को व्यक्त करती है और बलिदान-संबंधी भाषा को बनाए रखती है।
- source_word: קְרֻאָיו
  choice: अपने बुलाए हुओं
  rationale: यह कर्मवाच्य रूप ‘बुलाए गए’ अथवा ‘निमंत्रित किए गए’ लोगों को सूचित करता है। ‘बुलाए हुओं’ अतिथि, सहभागी या न्याय के लिए बुलाए गए जनों की पहचान को समय से पहले निश्चित नहीं करता।
theological_decisions:
- issue: परमेश्वर के निज नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में निज नाम सीधे आया है। ‘याहवे’ उसका लिप्यंतरण करते हुए वाचा-संबंधी नाम को सामान्य उपाधि से अलग रखता है। संयुक्त אֲדֹנָי יְהוִה को ‘प्रभु याहवे’ कहा गया है।
- issue: बलिदान की उपमा और बुलाए हुओं की पहचान
  choice: बलिदान और बुलाए हुओं की भाषा को बिना स्पष्ट पहचान बताए बनाए रखना
  alternative: बलिदान को सीधे यहूदा का वध कहना, या बुलाए हुओं को विदेशी आक्रमणकारी अथवा बलिदान के शिकार बताना
  rationale: पद स्वयं संक्षिप्त और अर्थगर्भित उपमा देता है। मुख्य पाठ में किसी एक ऐतिहासिक या धार्मिक पहचान को जोड़ना मूल की वास्तविक अस्पष्टता और तनाव को समाप्त कर देता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सार्वजनिक पाठ के अनुकूल रखी गई है। समानांतर पंक्तियाँ और दो बार आया ‘क्योंकि’ मूल की गंभीर भविष्यद्वाणी-लय तथा तर्क-क्रम को बनाए रखते हैं।
