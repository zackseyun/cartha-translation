  text: גַּם כַּסְפָּ֨/ם גַּם זְהָבָ֜/ם לֹֽא יוּכַ֣ל לְ/הַצִּילָ֗/ם בְּ/יוֹם֙ עֶבְרַ֣ת יְהוָ֔ה וּ/בְ/אֵשׁ֙ קִנְאָת֔/וֹ תֵּאָכֵ֖ל כָּל הָ/אָ֑רֶץ כִּֽי כָלָ֤ה אַךְ נִבְהָלָה֙ יַֽעֲשֶׂ֔ה אֵ֥ת כָּל יֹשְׁבֵ֖י הָ/אָֽרֶץ־־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/zephaniah/001/018.yaml
  text: Neither their silver nor their gold will be able to deliver them on the day of Yahweh’s wrath[a], and in the fire of his jealousy all the earth will be consumed; for he will make a complete, indeed sudden[c][b], end of all the inhabitants of the earth.
translation:
  language: hi
  text: न तो उनकी चाँदी और न ही उनका सोना याहवे के प्रकोप के दिन उन्हें बचा सकेगा। उसकी ईर्ष्या[b] की आग में सारी पृथ्वी[a] भस्म हो जाएगी, क्योंकि वह पृथ्वी के सभी निवासियों का पूरी तरह और अचानक[c] नाश कर देगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी אֶרֶץ का अर्थ ‘पृथ्वी’ या ‘भूमि/देश’ हो सकता है। अतः यहाँ ‘सारी भूमि’ और आगे ‘भूमि के सभी निवासी’ भी सम्भव है।
    reason: alternative_reading
  - marker: b
    text: या ‘उसके उत्साह की आग में।’ इब्रानी शब्द ‘ईर्ष्या’ और ‘उत्साह’—दोनों भाव व्यक्त कर सकता है।
    reason: lexical_alternative
  - marker: c
    text: यह इब्रानी पदबंध कठिन है। इसका अनुवाद ‘पूर्ण और भयावह अंत’ या ‘सम्पूर्ण अंत—हाँ, एक भयंकर अंत’ भी किया जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם ... גַּם ... לֹא
  choice: न तो ... और न ही ...
  rationale: नकार के साथ आए इस युग्म का स्वाभाविक हिन्दी रूप दोनों साधनों—चाँदी और सोने—की असमर्थता पर समान बल देता है।
- source_word: כַּסְפָּם ... זְהָבָם
  choice: उनकी चाँदी ... उनका सोना
  rationale: सोने के साथ आने के कारण כֶּסֶף का भौतिक अर्थ ‘चाँदी’ यहाँ ‘धन’ या ‘पैसे’ से अधिक उपयुक्त है; दोनों मिलकर सम्पत्ति को दर्शाते हैं।
- source_word: יוּכַל לְהַצִּילָם
  choice: उन्हें बचा सकेगा
  rationale: यह रूप सामर्थ्य के अभाव को व्यक्त करता है; ‘बचा सकेगा’ आधुनिक हिन्दी में स्वाभाविक रहते हुए संकट से छुड़ाने का ठोस अर्थ बनाए रखता है।
- source_word: בְּיוֹם עֶבְרַת יְהוָה
  choice: याहवे के प्रकोप के दिन
  rationale: עֶבְרָה तीव्र क्रोध या प्रकोप को सूचित करता है। ‘प्रकोप’ भविष्यद्वाणी के न्याय-संदर्भ के अनुकूल है, और יְהוָה को व्यक्तिगत नाम ‘याहवे’ के रूप में रखा गया है।
- source_word: וּבְאֵשׁ קִנְאָתוֹ
  choice: उसकी ईर्ष्या की आग में
  rationale: קִנְאָה में ‘ईर्ष्या’ और ‘उत्साह’ दोनों अर्थ सम्भव हैं। मुख्य पाठ में ‘ईर्ष्या’ वाचा-संबंधी अनन्यता और सम्बन्धपरक तनाव को बनाए रखती है।
- source_word: תֵּאָכֵל
  choice: भस्म हो जाएगी
  rationale: निफ़अल रूप आग द्वारा पूरी तरह निगल लिए जाने का निष्क्रिय परिणाम बताता है; ‘भस्म हो जाएगी’ हिन्दी में आग की छवि को सजीव और स्वाभाविक रखता है।
- source_word: כָּל הָאָרֶץ
  choice: सारी पृथ्वी
  rationale: אֶרֶץ का अर्थ ‘भूमि/देश’ या ‘पृथ्वी’ हो सकता है। इस पद की व्यापक न्याय-भाषा के कारण मुख्य पाठ में विस्तृत अर्थ चुना गया है, जबकि सीमित अर्थ को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: כִּי כָלָה אַךְ נִבְהָלָה
  choice: क्योंकि ... पूर्णतः, और वह भी अचानक, अंत कर देगा
  rationale: कठिन इब्रानी पदबंध में כָּלָה पूर्णता, אַךְ बल, और נִבְהָלָה आकस्मिकता अथवा भयावहता व्यक्त कर सकता है। यह हिन्दी रूप वाक्य को स्वाभाविक रखते हुए पूर्ण और आकस्मिक अंत पर बल देता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का रूप
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में चार-अक्षरीय व्यक्तिगत नाम सीधे आया है। ‘याहवे’ उसका प्रचलित विद्वतापूर्ण लिप्यंतरण है और उसे किसी उपाधि से नहीं बदलता।
- issue: הָאָרֶץ का भौगोलिक विस्तार
  choice: पृथ्वी—सार्वभौमिक विस्तार
  alternative: भूमि/देश—यहूदा या निकटवर्ती क्षेत्र
  rationale: शब्द दोनों अर्थ रखता है। ‘सारी’ और ‘सभी निवासियों’ वाली व्यापक न्याय-भाषा मुख्य पाठ में ‘पृथ्वी’ का समर्थन करती है, पर क्षेत्रीय अर्थ को पादटिप्पणी में स्पष्ट रखा गया है।
- issue: परमेश्वर के लिए קִנְאָה
  choice: ईर्ष्या
  alternative: उत्साह
  rationale: ‘ईर्ष्या’ वाचा में अपेक्षित अनन्य निष्ठा के सम्बन्धपरक पक्ष को बनाए रखती है; ‘उत्साह’ भी वैध है और पादटिप्पणी में दिया गया है, ताकि शब्द के अर्थ-क्षेत्र को संकीर्ण न किया जाए।
- issue: כלה אך נבהלה का कठिन अर्थ
  choice: पूर्णतः, और वह भी अचानक, अंत
  alternative: पूर्ण और भयावह अंत
  rationale: נִבְהָלָה आकस्मिकता, घबराहट या भयावहता से जुड़ सकता है। मुख्य पाठ एक सम्भावित अर्थ चुनता है, जबकि वैकल्पिक अर्थ पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की है—सरल, गरिमापूर्ण और सार्वजनिक पाठ के योग्य। ‘प्रकोप’, ‘भस्म’ और ‘निवासी’ भविष्यद्वाणी के गंभीर स्वर को रखते हैं, पर वाक्य-संरचना सामान्य पाठक के लिए सुबोध है। कठिन या बहुअर्थी इब्रानी पदों को मुख्य पाठ में अत्यधिक व्याख्यायित नहीं किया गया; वास्तविक विकल्प पादटिप्पणियों में दिए गए हैं।
