  text: וְ/הָיָה֩ בַ/יּ֨וֹם הַ/ה֜וּא נְאֻם יְהוָ֗ה ק֤וֹל צְעָקָה֙ מִ/שַּׁ֣עַר הַ/דָּגִ֔ים וִֽ/ילָלָ֖ה מִן הַ/מִּשְׁנֶ֑ה וְ/שֶׁ֥בֶר גָּד֖וֹל מֵ/הַ/גְּבָעֽוֹת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zephaniah/001/010.yaml
  text: And on that day[a], declares Yahweh, there will be the sound of a cry from the Fish Gate, and a wail from the Second Quarter[c][b], and a great crash from the hills.
translation:
  language: hi
  text: “उस दिन ऐसा होगा”—यह याहवे की घोषणा है—“कि मछली फाटक से पुकार की आवाज़[a], दूसरे मुहल्ले[b] से विलाप, और पहाड़ियों से भारी धमाका[c] सुनाई देगा।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “चीत्कार की आवाज़।”
    reason: lexical_alternative
  - marker: b
    text: ‘दूसरा मुहल्ला’ सम्भवतः यरूशलेम का एक भाग था; हिब्रू में ‘मिश्ने’।
    reason: cultural_note
  - marker: c
    text: या, “भारी विनाश” अथवा “बड़ी टूट-फूट।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: ऐसा होगा
  rationale: यह भविष्य में घटने वाली बात का परिचय देने वाला हिब्रू मुहावरा है। ‘ऐसा होगा’ स्वाभाविक हिन्दी है और आगे आने वाली संज्ञात्मक शृंखला से ठीक जुड़ता है।
- source_word: בַיּוֹם הַהוּא
  choice: उस दिन
  rationale: भविष्यद्वाणी में न्याय के निश्चित समय को सूचित करने वाला प्रचलित पदबंध है।
- source_word: נְאֻם יְהוָה
  choice: यह याहवे की घोषणा है
  rationale: भविष्यद्वक्ता के कथन को परमेश्वर के अधिकारपूर्ण वचन के रूप में चिह्नित करने वाले सूत्र को स्पष्ट और गरिमापूर्ण हिन्दी में रखा गया है।
- source_word: יְהוָה
  choice: याहवे
  rationale: हिब्रू चतुरक्षरीय व्यक्तिगत नाम को उपाधि से बदलने के बजाय हिन्दी लिप्यंतरण में सुरक्षित रखा गया है।
- source_word: קוֹל צְעָקָה
  choice: पुकार की आवाज़
  rationale: קוֹל और צְעָקָה दोनों को व्यक्त करके मूल के ‘पुकार का स्वर/शब्द’ को सुरक्षित रखा गया है; ‘पुकार’ संकट या सहायता के लिए उठी चीख दोनों अर्थों की गुंजाइश रखती है।
- source_word: מִשַּׁעַר הַדָּגִים
  choice: मछली फाटक से
  rationale: यह यरूशलेम के एक ज्ञात द्वार का स्थान-नाम है; ‘मछली फाटक’ हिन्दी में संक्षिप्त और स्वाभाविक है।
- source_word: וִילָלָה
  choice: विलाप
  rationale: यह शब्द संकट और शोक की ऊँची पुकार को दर्शाता है; ‘विलाप’ आधुनिक हिन्दी में गरिमापूर्ण और बोधगम्य है।
- source_word: מִן הַמִּשְׁנֶה
  choice: दूसरे मुहल्ले से
  rationale: מִּשְׁנֶה सम्भवतः यरूशलेम के ‘दूसरे’ नामक भाग या मुहल्ले को सूचित करता है। अर्थ का अनुवाद पाठक को स्थान-सन्दर्भ समझने देता है, जबकि पादटिप्पणी मूल नाम बताती है।
- source_word: וְשֶׁבֶר גָּדוֹל
  choice: भारी धमाका
  rationale: שֶׁבֶר टूटने, विनाश या टूटने से उठी प्रचण्ड ध्वनि का बोध करा सकता है। आसपास की श्रव्य शृंखला—आवाज़ और विलाप—के कारण मुख्य पाठ में ‘धमाका’ चुना गया, और व्यापक अर्थ पादटिप्पणी में सुरक्षित है।
- source_word: מֵהַגְּבָעוֹת
  choice: पहाड़ियों से
  rationale: גְּבָעוֹת का सामान्य अर्थ ‘पहाड़ियाँ’ है; सम्भवतः नगर के ऊँचे भाग या निकट की पहाड़ियों की ओर संकेत है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में परमेश्वर का व्यक्तिगत वाचा-नाम सीधे आया है। उसे ‘प्रभु’ जैसी उपाधि से बदलने के बजाय ‘याहवे’ रूप में रखा गया है; इससे मूल का विशिष्ट नाम सुरक्षित रहता है।
- issue: न्याय के दृश्य में שֶׁבֶר का आशय
  choice: श्रव्य अर्थ को मुख्य पाठ में ‘भारी धमाका’ से व्यक्त करना
  alternative: भारी विनाश; बड़ी टूट-फूट
  rationale: पद में पुकार की आवाज़ और विलाप के साथ समानांतर क्रम होने से ध्वनि का अर्थ प्रमुख प्रतीत होता है, पर शब्द में वास्तविक टूटने और विनाश की धारणा भी है; इसलिए उसे पादटिप्पणी में बनाए रखा गया है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, सहज किन्तु भविष्यद्वाणी के अनुरूप गरिमापूर्ण रखी गई है। स्थान-नामों को स्पष्ट किया गया है, और शोर तथा विनाश के बीच हिब्रू की अर्थगत अनिश्चितता को मुख्य पाठ और पादटिप्पणी के संयोजन से सुरक्षित रखा गया है।
