  text: וּ/פָקַדְתִּ֗י עַ֧ל כָּל הַ/דּוֹלֵ֛ג עַל הַ/מִּפְתָּ֖ן בַּ/יּ֣וֹם הַ/ה֑וּא הַֽ/מְמַלְאִ֛ים בֵּ֥ית אֲדֹנֵי/הֶ֖ם חָמָ֥ס וּ/מִרְמָֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/zephaniah/001/009.yaml
  text: And on that day I will punish all who leap over the threshold[b][a], who fill their masters’ house with violence and deceit.
translation:
  language: hi
  text: उस दिन मैं उन सबको दण्ड दूँगा, जो दहलीज़ के ऊपर से कूदते हैं[a] और अपने मालिकों का घर[b] हिंसा और छल से भरते हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जो दहलीज़ लाँघते हैं।” यह पदबंध किसी ज्ञात धार्मिक या अंधविश्वासी प्रथा की ओर संकेत कर सकता है, संभवतः 1 शमूएल 5:5 में वर्णित दहलीज़ से जुड़ी मनाही की प्रतिध्वनि; कुछ इसे बलपूर्वक घुसनेवालों का रूपक मानते हैं।
    reason: alternative_reading
  - marker: b
    text: शाब्दिक रूप से, “अपने मालिकों का घर”; कुछ अनुवाद “अपने स्वामी का घर” या “अपने प्रभु का घर” करते हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: וּפָקַדְתִּי
  choice: मैं ... दण्ड दूँगा
  rationale: भविष्यद्वाणी में न्याय के प्रसंग में פקד का अर्थ अपराध का लेखा लेकर दण्ड देना है; यह हिन्दी में उसके न्यायिक बल को स्वाभाविक रूप से व्यक्त करता है।
- source_word: הַדּוֹלֵג עַל הַמִּפְתָּן
  choice: जो दहलीज़ के ऊपर से कूदते हैं
  rationale: דָּלַג कूदने या छलाँग लगाने का बोध देता है। मूल का ठोस, किंतु सांस्कृतिक रूप से अस्पष्ट चित्र बिना किसी विशेष रीति की व्याख्या थोपे सुरक्षित रखा गया है।
- source_word: הַמִּפְתָּן
  choice: दहलीज़
  rationale: מִפְתָּן द्वार की चौखट के निचले भाग या देहरी को दर्शाता है; आधुनिक हिन्दी में ‘दहलीज़’ स्पष्ट और प्रचलित समतुल्य है।
- source_word: בַּיּוֹם הַהוּא
  choice: उस दिन
  rationale: यह भविष्यद्वाणी में न्याय के समय को सूचित करने वाला सूत्र है; ‘उस दिन’ स्वाभाविक हिन्दी है और मूल की संदर्भसूचकता बनाए रखता है।
- source_word: הַמְמַלְאִים
  choice: और ... भरते हैं
  rationale: संज्ञावत् प्रयुक्त कृदन्त उन्हीं लोगों की विशेषता बताता है। हिन्दी में संयुक्त संबंधवाचक उपवाक्य निरंतर या चारित्रिक कर्म का भाव सहज रूप से देता है।
- source_word: בֵּית אֲדֹנֵיהֶם
  choice: अपने मालिकों का घर
  rationale: אֲדֹנֵיהֶם बहुवचन स्वामियों या मालिकों की ओर संकेत करता है, जबकि בֵּית एकवचन है। ‘मालिकों’ सामाजिक वरिष्ठों का अर्थ स्वाभाविक रूप से देता है और इसे अनावश्यक रूप से परमेश्वर का पदनाम नहीं बनाता।
- source_word: חָמָס
  choice: हिंसा
  rationale: חָמָס हिंसक अन्याय या निर्दयी दुष्कर्म को व्यक्त करता है; ‘हिंसा’ उसका सीधा और व्यापक हिन्दी समतुल्य है।
- source_word: מִרְמָה
  choice: छल
  rationale: מִרְמָה धोखे, कपट या छल को सूचित करता है; ‘छल’ संक्षिप्त, प्रतिष्ठित और ‘हिंसा’ के साथ स्वाभाविक युग्म बनाता है।
theological_decisions:
- issue: ‘दहलीज़ के ऊपर से कूदते हैं’ का आशय
  choice: मुख्य पाठ में ठोस क्रिया को यथावत रखना
  alternative: इसे किसी अंधविश्वासी या उपासना-संबंधी रीति, अथवा हिंसक घुसपैठ का स्पष्ट संकेत मानना
  rationale: इब्रानी पदबंध सजीव है, पर स्वयं पाठ उस प्रथा की व्याख्या नहीं करता। इसलिए किसी एक ऐतिहासिक या रूपक अर्थ को मुख्य पाठ में निश्चित नहीं किया गया।
- issue: ‘अपने मालिकों का घर’ का संदर्भ
  choice: बहुवचन रूप के अनुसार ‘मालिकों’ कहना
  alternative: ‘अपने स्वामी का घर’ या ‘अपने प्रभु का घर’
  rationale: इब्रानी रूप बहुवचन स्वामियों के साथ तृतीय पुरुष बहुवचन प्रत्यय रखता है। पाठ किसी दिव्य संदर्भ को स्पष्ट नहीं करता, इसलिए अनुवाद में ऐसा संकेत नहीं जोड़ा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज किंतु गरिमापूर्ण स्तर रखा गया है। ‘दण्ड दूँगा’, ‘दहलीज़’, ‘हिंसा’ और ‘छल’ सामान्य पाठक के लिए बोधगम्य हैं। मूल की सांस्कृतिक अस्पष्टता को मुख्य पाठ में नहीं सुलझाया गया और दोनों आवश्यक पाद-टिप्पणी चिह्न उचित स्थान पर दिए गए हैं।
