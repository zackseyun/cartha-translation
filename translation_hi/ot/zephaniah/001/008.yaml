id: ZEP.1.8
reference: Zephaniah 1:8
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/הָיָ֗ה בְּ/יוֹם֙ זֶ֣בַח יְהוָ֔ה וּ/פָקַדְתִּ֥י עַל הַ/שָּׂרִ֖ים וְ/עַל בְּנֵ֣י הַ/מֶּ֑לֶךְ וְ/עַ֥ל כָּל הַ/לֹּבְשִׁ֖ים מַלְבּ֥וּשׁ נָכְרִֽי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zephaniah/001/008.yaml
  text: And on the day of Yahweh’s sacrifice[a], I will punish the officials, the king’s sons[c][b], and all who wear foreign clothing.
translation:
  language: hi
  text: और ऐसा होगा कि याहवे के बलिदान[a] के दिन मैं अधिकारियों[b], राजा के पुत्रों और उन सभी को दण्ड दूँगा जो विदेशी पहनावा[c] पहनते हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “याहवे का बलिदान।” यह पदबंध न्याय के लिए याहवे द्वारा तैयार किए गए बलिदानी भोज की छवि भी जगा सकता है (देखें सपन्याह 1:7)।
    reason: lexical_alternative
  - marker: b
    text: “अधिकारियों” का अनुवाद “प्रधानों” या “शासकों” के रूप में भी किया जा सकता है।
    reason: lexical_alternative
  - marker: c
    text: अर्थात विदेशी जातियों से जुड़ी वेशभूषा। यह अभिव्यक्ति केवल विदेश में बने वस्त्रों को नहीं, बल्कि विदेशी रीति-रिवाजों या निष्ठाओं को अपनाने की ओर भी संकेत कर सकती है।
    reason: cultural_note
lexical_decisions:
- source_word: וְהָיָה
  choice: और ऐसा होगा कि
  rationale: यह भविष्य में घटने वाली घटना का सूत्र है; हिन्दी में यह रूप भविष्यकाल और अगले कालवाचक वाक्यांश से इसका संबंध दोनों स्पष्ट रखता है।
- source_word: בְּיוֹם
  choice: के दिन
  rationale: यह सामान्य कालवाचक प्रयोग है और भविष्यसूचक समय-संकेत को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: זֶבַח יְהוָה
  choice: याहवे के बलिदान
  rationale: सम्बन्धसूचक इब्रानी रचना का सीधा अनुवाद है। सन्दर्भ में यह न्याय के उस दृश्य से जुड़ा है जिसमें याहवे ने बलिदान तैयार किया है; ‘बलिदानी भोज’ सम्भव अर्थ है, पर अधिक व्याख्यात्मक है।
- source_word: יְהוָה
  choice: याहवे
  rationale: चार अक्षरों वाले परमेश्वर के व्यक्तिगत नाम का लिप्यंतरण किया गया है, उसे किसी उपाधि से नहीं बदला गया।
- source_word: וּפָקַדְתִּי עַל
  choice: मैं ... दण्ड दूँगा
  rationale: न्याय के प्रसंग में פקד על दण्डात्मक लेखा लेने या दण्ड देने का भाव रखता है; यह चयन आधुनिक हिन्दी में उस न्यायिक बल को स्पष्ट करता है।
- source_word: הַשָּׂרִים
  choice: अधिकारियों
  rationale: यह उच्च पदस्थ शासकीय नेताओं को सूचित करता है। ‘अधिकारी’ राजवंशीय अर्थ जोड़े बिना प्रशासनिक पद को व्यक्त करता है।
- source_word: בְּנֵי הַמֶּלֶךְ
  choice: राजा के पुत्रों
  rationale: सम्बन्धसूचक पदबंध का सीधा अनुवाद है और मूल के पुल्लिंग पारिवारिक संकेत को सुरक्षित रखता है।
- source_word: כָּל הַלֹּבְשִׁים
  choice: उन सभी को ... जो ... पहनते हैं
  rationale: इब्रानी कृदन्त पदबंध को स्वाभाविक हिन्दी सम्बन्धवाचक उपवाक्य के रूप में व्यक्त किया गया है।
- source_word: מַלְבּוּשׁ נָכְרִי
  choice: विदेशी पहनावा
  rationale: यह विदेशी लोगों से जुड़ी वेशभूषा को सूचित करता है। ‘पहनावा’ आधुनिक हिन्दी में स्वाभाविक है और इसे केवल कपड़े के विदेशी मूल तक सीमित नहीं करता।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में परमेश्वर का व्यक्तिगत नाम सीधे आया है। ‘याहवे’ उसका निकट लिप्यंतरण है और नाम को उपाधि में नहीं बदलता।
- issue: זֶבַח יְהוָה में कर्तृत्व और न्याय-भोज की छवि
  choice: याहवे के बलिदान
  alternative: याहवे द्वारा तैयार किया गया बलिदानी भोज
  rationale: सम्बन्धसूचक पदबंध में स्वामित्व, सम्बन्ध या कर्तृत्व की कुछ गुंजाइश है। मुख्य पाठ सीधी और संक्षिप्त रचना रखता है, जबकि न्याय के लिए तैयार भोज की सम्भावित छवि पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, गरिमापूर्ण पर सामान्य पाठक के लिए सहज रखी गई है। वाक्य में मूल की भविष्यसूचक उद्घोषणा सुरक्षित है। ‘दण्ड दूँगा’ न्याय-सन्दर्भ को स्पष्ट करता है, जबकि बलिदान और विदेशी पहनावे से जुड़ी सम्भावित अर्थ-छायाएँ पादटिप्पणियों में दी गई हैं।
