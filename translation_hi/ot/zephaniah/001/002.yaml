base_translation:
  language: en
  yaml_path: translation/ot/zephaniah/001/002.yaml
  text: I will utterly sweep away everything from the face of the earth[a], declares Yahweh.
translation:
  language: hi
  text: “मैं धरती के ऊपर से सब कुछ पूरी तरह हटा दूँगा[a],” यहोवा की घोषणा है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “मैं भूमि के ऊपर से सब कुछ पूरी तरह हटा दूँगा।” इब्रानी में बल देने वाली क्रिया-रचना है; शाब्दिक रूप से, “निश्चय ही मैं सब कुछ समेट लूँगा।” ‘धरती’ के लिए प्रयुक्त शब्द का अर्थ ‘भूमि’ या ‘जमीन’ भी हो सकता है।
    reason: क्रिया की बलात्मक इब्रानी रचना तथा אֲדָמָה के अर्थ-विकल्पों को सुरक्षित रखना।
lexical_decisions:
- source_word: אָסֹף אָסֵף
  choice: पूरी तरह मिटा दूँगा
  rationale: इनफिनिटिव एब्सोल्यूट और सीमित क्रिया का संयोजन कथन को प्रबल और निश्चित बनाता है। न्याय के इस संदर्भ में אסף केवल इकट्ठा करने के बजाय पूरी तरह हटा देने का भाव रखता है; ‘पूरी तरह मिटा दूँगा’ इसे सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: כֹּל
  choice: सब कुछ
  rationale: यहाँ शब्द निरपेक्ष और व्यापक है; ‘सब कुछ’ उसके समग्र दायरे को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: מֵעַל פְּנֵי
  choice: के ऊपर से
  rationale: यह इब्रानी मुहावरा किसी भू-सतह से हटा देने को दर्शाता है। ‘के ऊपर से’ हिन्दी में स्वाभाविक है और मूल बिंब को पर्याप्त रूप से सुरक्षित रखता है।
- source_word: הָאֲדָמָה
  choice: धरती
  rationale: אֲדָמָה का अर्थ भूमि, मिट्टी या धरती हो सकता है। इस व्यापक न्याय-घोषणा में ‘धरती’ उपयुक्त है, जबकि पादटिप्पणी वास्तविक वैकल्पिक अर्थों को सुरक्षित रखती है।
- source_word: נְאֻם יְהוָה
  choice: यहोवा की घोषणा है
  rationale: यह नबूवत में प्रयुक्त गंभीर और अधिकारपूर्ण ईश्वरीय कथन-सूत्र है। ‘घोषणा है’ उसके औपचारिक बल को स्पष्ट हिन्दी में बनाए रखता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: टेट्राग्रामटन को किसी उपाधि से बदलने के बजाय परमेश्वर के व्यक्तिगत नाम के प्रचलित हिन्दी लिप्यंतरण ‘यहोवा’ से प्रस्तुत किया गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ में ईश्वरीय नाम सीधे आया है। हिन्दी पाठकों के बीच प्रचलित और पहचाना हुआ नामरूप ‘यहोवा’ रखा गया है; ‘याहवे’ अधिक शैक्षणिक लिप्यंतरण का विकल्प है।
- issue: न्याय के दायरे में הָאֲדָמָה
  choice: धरती
  alternative: भूमि
  rationale: ‘सब कुछ’ के साथ आरंभिक घोषणा व्यापक दायरा सुझाती है, इसलिए ‘धरती’ मुख्य पाठ में है; फिर भी इब्रानी शब्द स्थानीय भूमि या जमीन को भी सूचित कर सकता है, जिसे पादटिप्पणी में रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। ‘मिटा दूँगा’ न्याय की तीव्रता व्यक्त करता है, जबकि पादटिप्पणी मूल क्रिया ‘समेटना/हटा देना’ और ‘धरती/भूमि’ की अर्थगत अस्पष्टता को बनाए रखती है।
