language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: י֥וֹם עֶבְרָ֖ה הַ/יּ֣וֹם הַ/ה֑וּא י֧וֹם צָרָ֣ה וּ/מְצוּקָ֗ה י֤וֹם שֹׁאָה֙ וּ/מְשׁוֹאָ֔ה י֥וֹם חֹ֨שֶׁךְ֙ וַ/אֲפֵלָ֔ה י֥וֹם עָנָ֖ן וַ/עֲרָפֶֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/zephaniah/001/015.yaml
  text: That day is a day of wrath[a], a day of distress and anguish, a day of ruin and devastation, a day of darkness and gloom[c][b], a day of clouds and thick darkness.
translation:
  language: hi
  text: 'वह दिन कोप का दिन होगा,[a]

    संकट और संताप का दिन,

    विनाश और विध्वंस का दिन,[b]

    अंधकार और कालिमा का दिन,

    बादल और घने अंधकार का दिन।[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘प्रचंड क्रोध का दिन’।
    reason: lexical_alternative
  - marker: b
    text: ‘विनाश और विध्वंस’ का अनुवाद ‘उजाड़ और बरबादी’ भी हो सकता है।
    reason: lexical_alternative
  - marker: c
    text: या ‘घने बादल और गहरी कालिमा का दिन’। इब्रानी में काव्यात्मक क्रम के भीतर संज्ञाएँ एकवचन में हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: י֥וֹם עֶבְרָ֖ה
  choice: कोप का दिन
  rationale: עֶבְרָה प्रबल, उमड़ते हुए क्रोध को व्यक्त करता है। ‘कोप’ भविष्यद्वाणी के न्याय-संदर्भ में गंभीर और स्वाभाविक है तथा किसी अतिरिक्त व्याख्या को नहीं जोड़ता।
- source_word: הַ/יּ֣וֹם הַ/ה֑וּא
  choice: वह दिन
  rationale: दोहरा निश्चित संकेत पहले से चर्चा में आए विशिष्ट दिन पर बल देता है; हिन्दी में ‘वह दिन’ इसका सहज समतुल्य है।
- source_word: צָרָ֣ה
  choice: संकट
  rationale: צָרָה दबाव, मुसीबत या संकट की अवस्था बताता है। ‘संकट’ आधुनिक हिन्दी में स्पष्ट है और अगले समानांतर पद से अलग भी रहता है।
- source_word: וּ/מְצוּקָ֗ה
  choice: संताप
  rationale: מְצוּקָה तंगी, दबाव और उनसे उपजी गहरी व्यथा को दर्शाता है। ‘संताप’ उस अनुभवात्मक तीव्रता को गंभीर काव्यात्मक भाषा में व्यक्त करता है।
- source_word: שֹׁאָה֙
  choice: विनाश
  rationale: שֹׁאָה अचानक आई बरबादी या विनाश को सूचित करता है। ‘विनाश’ संक्षिप्त, स्पष्ट और इस न्याय-वर्णन के अनुकूल है।
- source_word: וּ/מְשׁוֹאָ֔ה
  choice: विध्वंस
  rationale: מְשׁוֹאָה पहले शब्द का निकटार्थी है और व्यापक बरबादी की तस्वीर को तीव्र करता है। ‘विध्वंस’ निकटार्थी पुनरुक्ति को मिटाए बिना इस बढ़ते प्रभाव को बनाए रखता है।
- source_word: חֹ֨שֶׁךְ֙
  choice: अंधकार
  rationale: חֹשֶׁךְ का सीधा अर्थ ‘अंधकार’ है, इसलिए इसे सरल और शाब्दिक रूप में रखा गया है।
- source_word: וַ/אֲפֵלָ֔ה
  choice: कालिमा
  rationale: אֲפֵלָה गहन अँधेरे या धुँधली कालिमा को दर्शाता है। ‘कालिमा’ पहले पद ‘अंधकार’ से भिन्न रहते हुए समानांतर काव्यात्मक तीव्रता बनाए रखती है।
- source_word: עָנָ֖ן
  choice: बादल
  rationale: עָנָן व्याकरणतः एकवचन है, पर हिन्दी में ‘बादल’ रूप प्रसंगानुसार सामूहिक अर्थ भी सहजता से देता है।
- source_word: וַ/עֲרָפֶֽל
  choice: घना अंधकार
  rationale: עֲרָפֶל घने अँधेरे अथवा अंधकारमय घने बादल का बोध करा सकता है। ‘घना अंधकार’ अर्थ की व्यापकता और पंक्ति का चरम भार सुरक्षित रखता है।
theological_decisions:
- issue: भविष्यद्वाणी में ‘उस दिन’ का स्वरूप
  choice: बार-बार आने वाली ‘... का दिन’ रचना को बनाए रखते हुए इसे न्याय के दिन का वर्णन रहने दिया गया है; उसका कालगत संदर्भ सीमित नहीं किया गया।
  alternative: इसे केवल यहूदा पर आए ऐतिहासिक न्याय अथवा केवल अंतिम युगांतकारी न्याय के रूप में स्पष्ट कर देना।
  rationale: इब्रानी पाठ स्वयं यह तय नहीं करता कि संकेत निकट ऐतिहासिक घटना, व्यापक प्रतिरूप, या अंतिम न्याय में से केवल किसकी ओर है। अनुवाद में इस धार्मिक तनाव को खुला रखना स्रोत के प्रति अधिक निष्ठावान है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की है, पर भविष्यद्वाणी की गंभीर और काव्यात्मक गरिमा के लिए ‘कोप’, ‘संताप’ और ‘कालिमा’ जैसे सर्वबोध्य साहित्यिक शब्द चुने गए हैं। इब्रानी की पाँच बार दोहराई गई ‘दिन’ वाली समानांतर संरचना सुरक्षित रखी गई है। ‘होगा’ हिन्दी वाक्य को स्वाभाविक बनाने के लिए पहले पद में जोड़ा गया है और शेष पंक्तियों में अध्याहृत है।
