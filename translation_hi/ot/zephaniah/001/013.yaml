base_translation:
  language: en
  yaml_path: translation/ot/zephaniah/001/013.yaml
  text: Their wealth will become plunder[a], and their houses a desolation; they will build houses but not inhabit them[b], and plant vineyards but not drink their wine.
translation:
  language: hi
  text: उनकी संपत्ति लूट का माल हो जाएगी[a], और उनके घर उजाड़ हो जाएँगे; वे घर बनाएँगे, पर उनमें नहीं बसेंगे, और अंगूर के बाग लगाएँगे, पर अपनी दाखमधु नहीं पीएँगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उनका माल-असबाब”; इस प्रसंग में “उनकी शक्ति” या “उनकी सेना” की संभावना कम है।
    reason: lexical_alternative
lexical_decisions:
- source_word: חֵילָם
  choice: उनकी संपत्ति
  rationale: חַיִל के अर्थों में सामर्थ्य, धन-संपत्ति, साधन और सेना शामिल हैं। घरों और अंगूर के बागों के समानांतर भौतिक न्याय के इस संदर्भ में ‘संपत्ति’ सबसे उपयुक्त है।
- source_word: לִמְשִׁסָּה
  choice: लूट का माल
  rationale: यह संज्ञा लूटपाट में छीनी गई वस्तु को दर्शाती है। ‘लूट का माल’ आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: וּבָתֵּיהֶם לִשְׁמָמָה
  choice: और उनके घर उजाड़ हो जाएँगे
  rationale: यहाँ ל परिणाम बताता है। हिन्दी में क्रियात्मक रूप मूल इब्रानी की संक्षिप्त संज्ञात्मक अभिव्यक्ति का आशय स्वाभाविक ढंग से देता है।
- source_word: וּבָנוּ בָתִּים וְלֹא יֵשֵׁבוּ
  choice: वे घर बनाएँगे, पर उनमें बस नहीं पाएँगे
  rationale: भविष्यसूचक संदर्भ में रूपों को भविष्यकाल में लिया गया है। ‘बसना’ ישׁב के निवास करने वाले अर्थ को संक्षिप्त और गरिमापूर्ण हिन्दी में व्यक्त करता है; ‘नहीं पाएँगे’ न्याय के फलस्वरूप वंचित रहने का आशय स्पष्ट करता है।
- source_word: וְנָטְעוּ כְרָמִים
  choice: और अंगूर के बाग लगाएँगे
  rationale: כֶּרֶם के लिए ‘अंगूर का बाग’ सामान्य आधुनिक हिन्दी में स्पष्ट है और कृषि-संपन्नता की छवि बनाए रखता है।
- source_word: וְלֹא יִשְׁתּוּ אֶת יֵינָם
  choice: पर उनकी दाखमधु नहीं पी पाएँगे
  rationale: ‘उनकी दाखमधु’ मूल के अधिकारवाचक प्रत्यय को सुरक्षित रखता है। ‘दाखमधु’ गरिमापूर्ण और बाइबलीय संदर्भ में सुबोध शब्द है।
