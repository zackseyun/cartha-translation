  verdict: revise
  source_fidelity: The rendering correctly understands חֵילָם as material wealth/resources, לִמְשִׁסָּה as plunder, the resultative force of the houses becoming desolate, and the prophetic future sequence. However, “नहीं पाएँगे” adds an ability/attainment nuance not explicitly expressed by the simple negated verb יֵשֵׁבוּ (“they will not dwell/settle”).
  naturalness: The sentence is clear and suitably formal for modern standard Hindi. “नहीं बसेंगे” is more direct and idiomatic here than “बस नहीं पाएँगे.” “दाखमधु” is an established elevated biblical term and is acceptable in this register.
  terminology: “संपत्ति,” “लूट का माल,” “उजाड़,” and “अंगूर के बाग” accurately convey the relevant terms. “अपनी दाखमधु” preserves the possessive suffix on יֵינָם without forcing an overly explicit paraphrase.
  issues:
  - severity: low
    issue: “पर उनमें बस नहीं पाएँगे” introduces an additional nuance of inability.
    rationale: The Hebrew states simply that they will not dwell/settle in the houses. Replacing it with “पर उनमें नहीं बसेंगे” preserves the negation without adding a modal implication.
