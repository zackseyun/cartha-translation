  yaml_path: translation/ot/zephaniah/001/004.yaml
  text: And I will stretch out my hand against Judah and against all the inhabitants of Jerusalem[a], and I will cut off from this place the remnant of Baal, the name of the idolatrous priests along with the priests[b],
translation:
  language: hi
  text: “मैं यहूदा और यरूशलेम के सभी निवासियों के विरुद्ध अपना हाथ बढ़ाऊँगा और इस स्थान से बाल का बचा हुआ अंश, मूर्तिपूजक पुरोहितों का नाम याजकों सहित, मिटा दूँगा।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְנָטִיתִי יָדִי
  choice: अपना हाथ बढ़ाऊँगा
  rationale: यह न्याय के लिए निर्णायक कार्रवाई का इब्रानी बिंब है। भविष्यकाल भविष्यद्वाणी के संदर्भ के अनुकूल है और मूल चित्र को बनाए रखता है।
- source_word: עַל יְהוּדָה וְעַל כָּל יוֹשְׁבֵי יְרוּשָׁלָם
  choice: यहूदा और यरूशलेम के सभी निवासियों के विरुद्ध
  rationale: यहाँ עַל विरोध और दंड की दिशा बताता है; इसलिए ‘के विरुद्ध’ स्वाभाविक और सटीक है।
- source_word: וְהִכְרַתִּי
  choice: मिटा दूँगा
  rationale: हिफ़ील रूप का अर्थ पूरी तरह समाप्त कर देना है। ‘मिटा दूँगा’ बाल के अवशेष, नाम और पुरोहितों—सभी के साथ स्वाभाविक रूप से प्रयुक्त हो सकता है, जबकि शाब्दिक ‘काट डालूँगा’ ‘नाम’ के साथ असहज होता।
- source_word: מִן הַמָּקוֹם הַזֶּה
  choice: इस स्थान से
  rationale: यह संकेतसूचक अभिव्यक्ति को बनाए रखता है और स्थान को पाठ की अपेक्षा अधिक संकीर्ण रूप से परिभाषित नहीं करता।
- source_word: שְׁאָר הַבַּעַל
  choice: बाल के बचे हुए अंश
  rationale: यह שְׁאָר की ‘शेष/बचा हुआ भाग’ की धारणा को रखता है और मूल की संक्षिप्त अस्पष्टता—बाल से जुड़ी बची हुई उपस्थिति या उपासना—को अनावश्यक रूप से नहीं खोलता।
- source_word: שֵׁם הַכְּמָרִים
  choice: मूर्तिपूजक पुरोहितों के नाम
  rationale: כְּמָרִים गैर-याहवेवादी या मिश्रित उपासना से जुड़े पुरोहितों के लिए विशिष्ट पद है। ‘नाम’ मूल मुहावरे और पूर्ण उन्मूलन के बिंब को सुरक्षित रखता है।
- source_word: עִם הַכֹּהֲנִים
  choice: याजकों समेत
  rationale: यह עִם का सहज अनुवाद है और כְּמָרִים से अलग सामान्य כֹּהֲנִים वर्ग को ‘याजक’ कहकर दोनों पदों का अंतर बनाए रखता है।
theological_decisions:
- issue: כְּמָרִים और כֹּהֲנִים के बीच भेद
  choice: כְּמָרִים के लिए ‘मूर्तिपूजक पुरोहित’ और כֹּהֲנִים के लिए ‘याजक’
  alternative: दोनों को केवल ‘याजक’ कहना, अथवा पहले पद को ‘कमारिम’ लिप्यंतरित करना
  rationale: मूल पाठ जानबूझकर दो पदों का प्रयोग करता है। अलग हिंदी शब्द इस विरोध को सुलभ रूप में बनाए रखते हैं, बिना किसी विशेष संप्रदायगत पहचान को पाठ में जोड़ने के।
- issue: ‘नाम’ का मुहावरेदार अर्थ
  choice: मुख्य पाठ में ‘नाम’ बनाए रखना और पादटिप्पणी में ‘स्मृति/नामोनिशान’ स्पष्ट करना
  alternative: मुख्य पाठ में सीधे ‘स्मृति’ या ‘नामोनिशान’ कहना
  rationale: ‘नाम’ मूल बिंब को सुरक्षित रखता है, जबकि टिप्पणी आधुनिक पाठक के लिए पूर्ण उन्मूलन का आशय स्पष्ट करती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सार्वजनिक पाठ के योग्य रखी गई है। ‘पुरोहित’ और ‘याजक’ का चयन दो अलग इब्रानी पदों का भेद स्पष्ट करता है। वाक्य को दो हिंदी वाक्यों में बाँटा गया है ताकि लंबी समन्वित इब्रानी रचना सामान्य पाठक के लिए सहज रहे।
