base_translation:
  language: en
  yaml_path: translation/ot/zephaniah/001/006.yaml
  text: and those who turn back from following Yahweh[c][b][a], and who do not seek Yahweh or inquire of him.
translation:
  language: hi
  text: और जो याहवे[a] का अनुसरण करना छोड़कर मुड़ गए हैं[b], और जिन्होंने न तो याहवे को खोजा है, न उससे परामर्श लिया है[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में परमेश्वर का व्यक्तिगत नाम יהוה (YHWH) है; यहाँ उसका रूप ‘याहवे’ दिया गया है।
    reason: alternative_reading
  - marker: b
    text: या, “जो याहवे के पीछे चलने से पीछे हट गए हैं।”
    reason: lexical_alternative
  - marker: c
    text: अंतिम क्रिया का अनुवाद “न उसकी खोज की है” या “न उससे मार्गदर्शन माँगा है” भी किया जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנְּסוֹגִים
  choice: जो ... मुड़ गए हैं
  rationale: यह प्रयोग पीछे लौटने या हट जाने की छवि को बनाए रखता है और यहाँ याहवे का अनुसरण छोड़ देने का भाव स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: מֵאַחֲרֵי יְהוָה
  choice: याहवे के पीछे चलने से
  rationale: इब्रानी मुहावरे का आशय याहवे का अनुसरण करना है; यह अनुवाद मूल की ‘पीछे चलने’ वाली छवि भी बनाए रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत नाम יהוה को किसी उपाधि से बदलने के बजाय देवनागरी में लिप्यंतरित किया गया है।
- source_word: בִקְשׁוּ
  choice: खोजा
  rationale: בקש का सामान्य अर्थ ‘खोजना’ है और यहाँ याहवे की ओर मन लगाकर आने का वाचाई भाव बना रहता है।
- source_word: דְרָשֻׁהוּ
  choice: उससे पूछा
  rationale: דרש में खोजने के साथ पूछने, परामर्श लेने या मार्गदर्शन चाहने का भाव हो सकता है। पहले आए בקש से इसे अलग शब्द में व्यक्त करने से दोनों क्रियाओं की समानता और भिन्नता दोनों बनी रहती हैं।
- source_word: וַאֲשֶׁר לֹא... וְלֹא
  choice: और जिन्होंने न तो... न
  rationale: यह रचना इब्रानी के समन्वित संबंधवाचक उपवाक्य और दोनों नकारों को स्वाभाविक हिन्दी में स्पष्ट रखती है।
theological_decisions:
- issue: परमेश्वर के नाम יהוה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में व्यक्तिगत वाचाई नाम है। ‘याहवे’ उसे उपाधि से प्रतिस्थापित किए बिना प्रस्तुत करता है।
- issue: ‘खोजना’ और ‘पूछना’ का संबंध
  choice: בקש को ‘खोजना’ और דרש को ‘उससे पूछना’
  alternative: दोनों क्रियाओं के लिए ‘खोजना’
  rationale: दोनों क्रियाओं के अर्थ आपस में मिलते हैं, फिर भी अलग शब्द उनका आलंकारिक विस्तार बनाए रखते हैं और उनके बीच आवश्यकता से अधिक कठोर धार्मिक भेद भी नहीं बनाते।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘पीछे चलने’ की मूल छवि सुरक्षित है, जबकि ‘न तो... न’ दोनों नकारात्मक क्रियाओं को स्पष्ट करता है। पद अपने पूर्ववर्ती वाक्य की सूची को आगे बढ़ाता है, इसलिए आरम्भिक ‘और’ बनाए रखा गया है।
