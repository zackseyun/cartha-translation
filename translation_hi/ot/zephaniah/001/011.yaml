source:
  edition: WLC
  text: הֵילִ֖ילוּ יֹשְׁבֵ֣י הַ/מַּכְתֵּ֑שׁ כִּ֤י נִדְמָה֙ כָּל עַ֣ם כְּנַ֔עַן נִכְרְת֖וּ כָּל נְטִ֥ילֵי כָֽסֶף־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zephaniah/001/011.yaml
  text: Wail[a], inhabitants of the Mortar, for all the merchant people are destroyed[b]; all who weigh out silver are cut off.
translation:
  language: hi
  text: मक्तेश[a] के निवासियो, विलाप करो! क्योंकि सारा व्यापारी समुदाय मिट गया है[b]; चाँदी तौलनेवाले सब काट डाले गए हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी ‘मक्तेश’ का शाब्दिक अर्थ ‘ओखली’ है। संभवतः यह यरूशलेम के किसी बाज़ार-मुहल्ले का नाम था, जिसे शायद उसकी कटोरे जैसी बनावट या वहाँ होनेवाले व्यापार के कारण यह नाम मिला था।
    reason: alternative_reading
  - marker: b
    text: या, ‘कनान के सब लोग मिट गए हैं।’ यहाँ ‘कनान’ का अर्थ संभवतः ‘व्यापारी’ या ‘व्यापारियों’ से है; इब्रानी में व्यापारिक संदर्भों में इसका ऐसा प्रयोग मिलता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵילִילוּ
  choice: विलाप करो
  rationale: यह ילל धातु का बहुवचन आज्ञार्थक रूप है और विपत्ति के कारण ऊँचे स्वर में शोक करने का आह्वान करता है। ‘विलाप करो’ आधुनिक हिन्दी में स्वाभाविक और भविष्यद्वाणी के गंभीर प्रसंग के अनुकूल है।
- source_word: יֹשְׁבֵי
  choice: के निवासियो
  rationale: ישב का कृदन्त यहाँ संज्ञा के रूप में किसी स्थान के रहनेवालों को सामूहिक संबोधन देता है।
- source_word: הַמַּכְתֵּשׁ
  choice: ओखली
  rationale: शब्द का शाब्दिक अर्थ कूटने की ‘ओखली’ है, पर यहाँ संभवतः यरूशलेम के कटोरे जैसे निचले भाग में स्थित व्यापारिक मुहल्ले का नाम है। अर्थपूर्ण स्थान-नाम को मुख्य पाठ में रखा और अनिश्चित पहचान को टिप्पणी में बताया गया है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पहले आदेश का कारण प्रस्तुत करता है; हिन्दी में ‘क्योंकि’ इस संबंध को स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
- source_word: נִדְמָה
  choice: मिट गया है
  rationale: דמה का निफ़अल रूप यहाँ न्याय के कारण समाप्त या नष्ट हो जाने का भाव देता है। एकवचन क्रिया को सामूहिक एकवचन ‘समुदाय’ के साथ बनाए रखा गया है।
- source_word: כָּל עַם כְּנַעַן
  choice: सारा व्यापारी समुदाय
  rationale: व्यापार और चाँदी के निकट संदर्भ में כְּנַעַן का ‘व्यापारी’ अर्थ संभव है, जबकि עַם की सामूहिकता ‘समुदाय’ से सुरक्षित रहती है। शाब्दिक ‘कनान के सब लोग’ को टिप्पणी में रखा गया है ताकि वास्तविक द्विअर्थता बनी रहे।
- source_word: נִכְרְתוּ
  choice: काट डाले गए हैं
  rationale: כרת के निफ़अल का सामान्य न्याय-संबंधी भाव ‘काट दिया जाना’ या समुदाय से पूर्णतः हटा दिया जाना है; हिन्दी वाक्यांश मूल बिंब को बनाए रखता है।
- source_word: כָּל נְטִילֵי כָסֶף
  choice: चाँदी तौलनेवाले सभी
  rationale: व्यापारिक संदर्भ में यह उन लोगों के लिए है जो लेन-देन में चाँदी तौलते थे। यह अनुवाद अस्पष्ट ‘चाँदी उठानेवाले’ की अपेक्षा प्रसंगगत अर्थ स्पष्ट करता है।
theological_decisions:
- issue: כְּנַעַן का अर्थ
  choice: मुख्य पाठ में ‘व्यापारी समुदाय’
  alternative: ‘कनान के सब लोग’
  rationale: चाँदी तौलनेवालों का समानांतर उल्लेख व्यापारिक अर्थ का समर्थन करता है, पर ‘कनान’ भौगोलिक-जातीय नाम के रूप में भी पढ़ा जा सकता है; इसलिए वैकल्पिक पाठ टिप्पणी में सुरक्षित है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की है, पर भविष्यद्वाणी के न्याय-संदेश के अनुरूप गरिमामय और तीखी रखी गई है। ‘ओखली’ मूल स्थान-नाम के अर्थ को सामने रखता है; ‘मक्तेश’ और स्थान की संभावित पहचान पाद-टिप्पणी में दी गई है। ‘मिट गया है’ और ‘काट डाले गए हैं’ समानांतर विनाश-वाक्यों के अलग-अलग मूल बिंबों को सुरक्षित रखते हैं।
