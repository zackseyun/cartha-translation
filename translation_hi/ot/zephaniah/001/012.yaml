source:
  edition: WLC
  text: וְ/הָיָה֙ בָּ/עֵ֣ת הַ/הִ֔יא אֲחַפֵּ֥שׂ אֶת יְרוּשָׁלִַ֖ם בַּ/נֵּר֑וֹת וּ/פָקַדְתִּ֣י עַל הָ/אֲנָשִׁ֗ים הַ/קֹּֽפְאִים֙ עַל שִׁמְרֵי/הֶ֔ם הָ/אֹֽמְרִים֙ בִּ/לְבָבָ֔/ם לֹֽא יֵיטִ֥יב יְהוָ֖ה וְ/לֹ֥א יָרֵֽעַ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zephaniah/001/012.yaml
  text: 'And it will happen at that time: I will search Jerusalem with lamps, and I will punish the men who have grown thick on their dregs, who say in their hearts, ''The LORD will not do good, nor will he do harm.'''
translation:
  language: hi
  text: उस समय ऐसा होगा कि मैं दीपकों से यरूशलेम की तलाशी लूँगा और उन लोगों को दंड दूँगा जो अपनी तलछट पर जमे हुए हैं[a] और अपने मन में कहते हैं, “यहोवा न तो भला करेगा, न बुरा।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक चित्र दाखमधु का है जो अपनी तलछट पर पड़ा रहकर जम गया हो; यह उन लोगों की ओर संकेत करता है जो आत्मसंतुष्ट और निष्क्रिय हो गए हैं।
    reason: हिब्रू दाखमधु-उपमा को बनाए रखते हुए उसका संकेत स्पष्ट करता है।
lexical_decisions:
- source_word: אֲחַפֵּשׂ
  choice: खोज करूँगा
  rationale: यह गहन और सावधानीपूर्वक खोज का बोध देता है; दीपकों का उल्लेख उसकी सूक्ष्मता को स्पष्ट करता है।
- source_word: בַּנֵּרוֹת
  choice: दीपक लेकर
  rationale: शाब्दिक अर्थ ‘दीपकों के साथ/द्वारा’ है; हिन्दी में यह स्वाभाविक रूप से खोज के साधन को व्यक्त करता है।
- source_word: וּפָקַדְתִּי עַל
  choice: दण्ड दूँगा
  rationale: इस न्याय-संदर्भ में פקד על का अर्थ लेखा लेना और दण्ड देना है।
- source_word: הַקֹּפְאִים עַל שִׁמְרֵיהֶם
  choice: जो अपनी तलछट पर गाढ़े हो गए हैं
  rationale: दाखमधु की वह सजीव उपमा बनाए रखता है जो तलछट पर पड़े रहने से गाढ़ा या जमा हो जाता है; यह आत्मसंतुष्ट जड़ता की ओर संकेत करती है।
- source_word: בִּלְבָבָם
  choice: अपने मन में
  rationale: हिब्रू ‘हृदय’ यहाँ आन्तरिक विचार और धारणा का केंद्र है; आधुनिक हिन्दी में ‘मन में’ स्वाभाविक है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: व्यक्तिगत ईश्वरीय नाम को सामान्य उपाधि में बदलने के बजाय हिन्दी में प्रचलित लिप्यंतरण द्वारा सुरक्षित रखा गया है।
- source_word: לֹא יֵיטִיב ... וְלֹא יָרֵעַ
  choice: न तो भला करेगा, न बुरा
  rationale: मूल के समानांतर और संक्षिप्त कथन को बनाए रखता है; इसका आशय यह है कि वक्ता यहोवा को निष्क्रिय मानते हैं।
theological_decisions:
- issue: लोगों के कथन में ईश्वर की निष्क्रियता
  choice: “यहोवा न तो भला करेगा, न बुरा”
  alternative: “यहोवा न तो उपकार करेगा, न विपत्ति लाएगा”
  rationale: मूल की व्यापक और तनावपूर्ण भला/बुरा शब्दावली को सुरक्षित रखा गया है, उसे केवल आशीष और न्याय तक सीमित नहीं किया गया।
- issue: तलछट की उपमा का अर्थ
  choice: उपमा को मुख्य पाठ में बनाए रखा गया
  alternative: “जो निश्चिन्त और जड़ हो गए हैं”
  rationale: व्याख्यात्मक अर्थ आरोपित करने के बजाय मूल काव्य-चित्र सुरक्षित है; संक्षिप्त स्पष्टीकरण पादटिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, स्पष्ट भविष्यद्वाणी-शैली। ‘अपनी तलछट पर गाढ़े हो गए’ जानबूझकर चित्रात्मक रखा गया है और पादटिप्पणी से स्पष्ट किया गया है।
