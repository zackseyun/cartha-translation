source:
  edition: WLC
  text: אָסֵ֨ף אָדָ֜ם וּ/בְהֵמָ֗ה אָסֵ֤ף עוֹף הַ/שָּׁמַ֨יִם֙ וּ/דְגֵ֣י הַ/יָּ֔ם וְ/הַ/מַּכְשֵׁל֖וֹת אֶת הָ/רְשָׁעִ֑ים וְ/הִכְרַתִּ֣י אֶת הָ/אָדָ֗ם מֵ/עַ֛ל פְּנֵ֥י הָ/אֲדָמָ֖ה נְאֻם יְהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zephaniah/001/003.yaml
  text: I will sweep away man and beast[a]; I will sweep away the birds of the heavens and the fish of the sea, and the stumbling blocks with the wicked[d][c][b]. And I will cut off man from the face of the ground,” declares Yahweh.
translation:
  language: hi
  text: “मैं मनुष्य और पशु दोनों को पूरी तरह मिटा दूँगा; मैं आकाश के पक्षियों, समुद्र की मछलियों, और दुष्टों समेत ठोकर के कारणों को भी पूरी तरह मिटा दूँगा। मैं भूमि के ऊपर से मनुष्य को काट डालूँगा,” यह याहवे की वाणी है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אָסֵף
  choice: पूरी तरह मिटा दूँगा
  rationale: न्याय के इस प्रसंग में हिफ़ील रूप का अर्थ केवल इकट्ठा करना नहीं, बल्कि व्यापक रूप से हटा देना है। हिन्दी में यह वाक्यांश उस प्रबल और समग्र विनाश को स्वाभाविक ढंग से व्यक्त करता है; पुनरावृत्ति भी सुरक्षित रखी गई है।
- source_word: אָדָם
  choice: मनुष्य
  rationale: यहाँ शब्द सामूहिक अर्थ में मानवजाति को दर्शाता है। ‘मनुष्य’ आधुनिक मानक हिन्दी में स्वाभाविक है और मूल की एकवचन-सामूहिक अभिव्यक्ति को बनाए रखता है।
- source_word: בְהֵמָה
  choice: पशु
  rationale: सृष्टि के प्राणियों की व्यापक सूची में यह सामान्य और गरिमापूर्ण हिन्दी वर्ग-संज्ञा है।
- source_word: עוֹף הַשָּׁמַיִם
  choice: आकाश के पक्षी
  rationale: यह मूल संबंधवाचक संरचना और सृष्टि-वर्णन की प्रतिध्वनि को सहज हिन्दी में सुरक्षित रखता है।
- source_word: דְגֵי הַיָּם
  choice: समुद्र की मछलियाँ
  rationale: मूल पदबंध का सीधा और स्वाभाविक अनुवाद, जो स्थल–आकाश–समुद्र की व्यापकता को बनाए रखता है।
- source_word: הַמַּכְשֵׁלוֹת
  choice: ठोकर के कारण
  rationale: शब्द उन वस्तुओं या बातों को सूचित कर सकता है जो गिरने या अपराध का कारण बनती हैं। ‘ठोकर के कारण’ अर्थ को स्पष्ट करता है, जबकि उनकी ठीक पहचान अनिर्धारित छोड़ता है।
- source_word: אֶת הָרְשָׁעִים
  choice: दुष्टों के साथ
  rationale: संक्षिप्त और कुछ हद तक अस्पष्ट इब्रानी संरचना में दुष्टों तथा ठोकर के कारणों—दोनों को न्याय के दायरे में रखा गया है, बिना उनके पारस्परिक संबंध को अधिक निश्चित किए।
- source_word: וְהִכְרַתִּי
  choice: नामोनिशान मिटा दूँगा
  rationale: हिफ़ील में כרת न्याय के द्वारा पूरी तरह काट दिए जाने का भाव देता है। हिन्दी मुहावरा उस निर्णायक उन्मूलन को प्रभावी रूप से व्यक्त करता है।
- source_word: מֵעַל פְּנֵי הָאֲדָמָה
  choice: धरती के ऊपर से
  rationale: यह मूल मुहावरे का स्वाभाविक हिन्दी रूप है। ‘धरती’ भूमि/मिट्टी और व्यापक पृथ्वी—दोनों की संभावित प्रतिध्वनि को कुछ हद तक बनाए रखती है।
- source_word: נְאֻם יְהוָה
  choice: यह याहवे की वाणी है
  rationale: यह गंभीर भविष्यद्वक्तापरक घोषणा-सूत्र को स्वाभाविक हिन्दी में व्यक्त करता है और प्रकट किए गए व्यक्तिगत नाम याहवे को सुरक्षित रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में चतुरक्षरीय व्यक्तिगत नाम उपस्थित है। ‘याहवे’ उसे किसी उपाधि से बदलने के बजाय नाम के रूप में प्रस्तुत करता है।
- issue: אָדָם का सामूहिक प्रतिनिधिक अर्थ
  choice: मनुष्य
  alternative: मानवजाति
  rationale: ‘मनुष्य’ मूल की एकवचन-सामूहिक शैली और सृष्टि/न्याय संबंधी प्रतिध्वनि को बनाए रखता है; प्रसंग से स्पष्ट है कि आशय समस्त मानवता से है।
- issue: הַמַּכְשֵׁלוֹת אֶת הָרְשָׁעִים की संकुचित संरचना
  choice: दुष्टों के साथ ठोकर के कारणों को
  alternative: दुष्टों—इन ठोकर के कारणों—को; दुष्टों के खंडहरों को
  rationale: मूल में ‘ठोकर के कारणों’ और ‘दुष्टों’ का संबंध पूर्णतः स्पष्ट नहीं है। चुना हुआ पाठ दोनों को न्याय में सम्मिलित करता है, पर दुष्टों को ही ठोकर के कारण बताने जैसी व्याख्या आरोपित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी का गंभीर भविष्यद्वक्तापरक स्वर अपनाया गया है। समानांतरता और ‘मिटा दूँगा’ की पुनरावृत्ति से मूल की लय रखी गई है। अत्यधिक संस्कृतनिष्ठ शब्दावली से बचते हुए ‘याहवे की वाणी’ जैसे गरिमापूर्ण सूत्र का प्रयोग किया गया है।
