source:
  edition: WLC
  text: זֹ֥את לָ/הֶ֖ם תַּ֣חַת גְּאוֹנָ֑/ם כִּ֤י חֵֽרְפוּ֙ וַ/יַּגְדִּ֔לוּ עַל עַ֖ם יְהוָ֥ה צְבָאֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/zephaniah/002/010.yaml
  text: This will be their lot in return for their pride[a], because they taunted and magnified themselves against the people of Yahweh of Armies.
translation:
  language: hi
  text: यह उनके घमंड का प्रतिफल होगा, क्योंकि उन्होंने सेनाओं के यहोवा की प्रजा का उपहास किया और उसके विरुद्ध अपने को बड़ा ठहराया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: זֹאת לָהֶם
  choice: यह उनके ... का बदला होगा
  rationale: इब्रानी में क्रिया निहित है; हिन्दी में भविष्यसूचक परिणाम को स्वाभाविक रूप से व्यक्त करने के लिए ‘होगा’ जोड़ा गया है।
- source_word: תַּחַת גְּאוֹנָם
  choice: उनके घमंड का बदला
  rationale: תַּחַת यहाँ प्रतिफल या दंडात्मक प्रत्युत्तर का भाव देता है; גָּאוֹן इस संदर्भ में अभिमानी घमंड है।
- source_word: חֵרְפוּ
  choice: उपहास किया
  rationale: क्रिया तिरस्कारपूर्ण निंदा या ठट्ठे को व्यक्त करती है; ‘उपहास किया’ आधुनिक और गरिमापूर्ण हिन्दी है।
- source_word: וַיַּגְדִּילוּ עַל
  choice: उसके विरुद्ध अपने आपको बड़ा ठहराया
  rationale: हिफ़ील रूप और עַל मिलकर किसी के विरुद्ध स्वयं को बड़ा करने या अहंकार दिखाने का भाव देते हैं; यह अनुवाद मूल बिंब को बनाए रखता है।
- source_word: עַם יְהוָה צְבָאוֹת
  choice: सेनाओं के यहोवा की प्रजा
  rationale: עַם को वाचा-संबंधी ‘प्रजा’, יְהוָה को व्यक्तिगत नाम ‘यहोवा’, और צְבָאוֹת को उसके पारदर्शी अर्थ ‘सेनाओं के’ से व्यक्त किया गया है।
theological_decisions:
- issue: יְהוָה צְבָאוֹת का अनुवाद
  choice: सेनाओं के यहोवा
  alternative: सेनाओं का यहोवा; सेनाओं का प्रभु
  rationale: व्यक्तिगत दिव्य नाम को उपाधि से बदलने के बजाय ‘यहोवा’ रखा गया है। हिन्दी संबंध-विन्यास में ‘सेनाओं के यहोवा’ मूल पदवी के अर्थ को स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है।
- issue: וַיַּגְדִּילוּ עַל में निहित आत्म-महिमामंडन
  choice: उसके विरुद्ध अपने आपको बड़ा ठहराया
  alternative: उसकी प्रजा के विरुद्ध डींग मारी
  rationale: ‘अपने आपको बड़ा ठहराया’ मूल גדל के बिंब और आत्म-उन्नयन के भाव को सुरक्षित रखता है; ‘डींग मारी’ अधिक मुहावरेदार पर कुछ संकीर्ण है। सर्वनाम ‘उसके’ निकटवर्ती ‘प्रजा’ की ओर संकेत करता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और भविष्यद्वाणी-संगत स्वर रखा गया है। ‘घमंड’, ‘उपहास’ और ‘अपने आपको बड़ा ठहराया’ सामान्य पाठक के लिए बोधगम्य हैं और मूल इब्रानी की दंड, तिरस्कार तथा आत्म-उन्नयन की धारणा को बनाए रखते हैं।
