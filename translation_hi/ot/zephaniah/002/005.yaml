id: ZEP.2.5
reference: Zephaniah 2:5
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: ה֗וֹי יֹֽשְׁבֵ֛י חֶ֥בֶל הַ/יָּ֖ם גּ֣וֹי כְּרֵתִ֑ים דְּבַר יְהוָ֣ה עֲלֵי/כֶ֗ם כְּנַ֨עַן֙ אֶ֣רֶץ פְּלִשְׁתִּ֔ים וְ/הַאֲבַדְתִּ֖י/ךְ מֵ/אֵ֥ין יוֹשֵֽׁב־׃
base_translation:
  language: en
  yaml_path: translation/ot/zephaniah/002/005.yaml
  text: Woe[a], inhabitants of the seacoast, nation of the Cherethites! The word of Yahweh is against you, Canaan, land of the Philistines; and I will destroy you until no inhabitant remains.
translation:
  language: hi
  text: 'हाय, समुद्र-तट के निवासियो,

    करेतियों की जाति[a]!

    याहवे का वचन तुम्हारे विरुद्ध है।

    हे कनान, पलिश्तियों के देश,

    मैं तुझे ऐसा नष्ट कर दूँगा

    कि कोई निवासी न बचे।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘करेती’ इब्रानी जातिनाम כְּרֵתִים का लिप्यंतरण है; इसे ‘केरेती’ भी लिखा जा सकता है।
    reason: जातिनाम के सम्भव लिप्यंतरण को दर्ज करना।
lexical_decisions:
- source_word: הוֹי
  choice: हाय
  rationale: यह न्याय की घोषणा आरम्भ करने वाला भविष्यद्वक्ताओं का उद्गार है। ‘हाय’ शोक और आसन्न विपत्ति—दोनों का भाव स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: יֹשְׁבֵי חֶבֶל הַיָּם
  choice: समुद्र-तट के निवासियो
  rationale: חֶבֶל הַיָּם समुद्र से लगे तटीय भूभाग को सूचित करता है; सम्बोधन रूप ‘निवासियो’ मूल के वाच्यार्थ और वाक्यगत भूमिका दोनों को रखता है।
- source_word: גּוֹי כְּרֵתִים
  choice: करेतियों की जाति
  rationale: גּוֹי यहाँ सम्बोधित जनसमुदाय है और כְּרֵתִים एक जातिनाम। हिन्दी में बहुवचन जातिनाम के साथ ‘की जाति’ स्पष्ट और स्वाभाविक है।
- source_word: דְּבַר יְהוָה עֲלֵיכֶם
  choice: याहवे का वचन तुम्हारे विरुद्ध है
  rationale: न्याय के प्रसंग में עַל विरोधी दिशा व्यक्त करता है। יְהוָה को उसके व्यक्तिवाचक वाचा-नाम के रूप में ‘याहवे’ लिखा गया है।
- source_word: כְּנַעַן אֶרֶץ פְּלִשְׁתִּים
  choice: हे कनान, पलिश्तियों के देश
  rationale: 'यह समानाधिकरण वाला प्रत्यक्ष सम्बोधन है: कनान को पलिश्तियों के देश के रूप में पहचाना गया है। ‘हे’ हिन्दी में सम्बोधन को स्पष्ट करता है।'
- source_word: וְהַאֲבַדְתִּיךְ מֵאֵין יוֹשֵׁב
  choice: मैं तुझे ऐसा नष्ट कर दूँगा कि कोई निवासी न बचे
  rationale: स्त्रीलिंग एकवचन प्रत्यय सम्बोधित भूमि ‘कनान’ की ओर लौटता है। परिणामसूचक हिन्दी रचना पूर्ण जनशून्यता का अर्थ स्वाभाविक ढंग से व्यक्त करती है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में चार अक्षरों वाला ईश्वरीय व्यक्तिवाचक नाम सीधे आया है। ‘याहवे’ उसका निकट हिन्दी लिप्यंतरण है और इसे सामान्य उपाधि में नहीं बदलता।
- issue: कनान को किया गया एकवचन स्त्रीलिंग सम्बोधन
  choice: हे कनान… मैं तुझे
  alternative: हे कनानियों… मैं तुम्हें
  rationale: मूल में विनाश वाली क्रिया का कर्म-प्रत्यय स्त्रीलिंग एकवचन है, इसलिए सम्बोधित भूभाग/देश को बनाए रखा गया है; इसे लोगों के बहुवचन में बदलना मूल की व्याकरणिक छवि मिटा देता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सार्वजनिक पाठ के अनुकूल रखी गई है। काव्य-पंक्तियाँ मूल के क्रम और न्याय-घोषणा की तीव्रता को सामने लाती हैं; अनावश्यक व्याख्या मुख्य पाठ में नहीं जोड़ी गई।
