- source_word: עֲזוּבָה תִהְיֶה
  choice: उजाड़ दी जाएगी
  rationale: यह त्यागे जाने और फलतः निर्जन हो जाने का भाव व्यक्त करता है। हिन्दी में इससे न्याय के परिणाम का स्वर स्वाभाविक रहता है; गाज़ा के नाम के साथ हिब्रू की ध्वनि-समानता पादटिप्पणी में दी गई है।
- source_word: אַשְׁקְלוֹן לִשְׁמָמָה
