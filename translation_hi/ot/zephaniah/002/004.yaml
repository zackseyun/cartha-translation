  yaml_path: translation/ot/zephaniah/002/004.yaml
  text: For Gaza will be abandoned[a], and Ashkelon a desolation; Ashdod—they will drive her out at noon[b], and Ekron will be uprooted.
translation:
  language: hi
  text: क्योंकि गाज़ा को त्याग दिया जाएगा[a], और अश्कलोन उजाड़ हो जाएगा; अशदोद को दोपहर में[b] निकाल बाहर किया जाएगा, और एक्रोन जड़ से उखाड़ दिया जाएगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'हिब्रू में संभवतः शब्दालंकार है: ‘गाज़ा’ (अज़्ज़ाह) और ‘त्याग दिया जाएगा’ (अज़ूवाह) की ध्वनियाँ मिलती-जुलती हैं।'
    reason: lexical_alternative
  - marker: b
    text: या, “दोपहर के समय।” यह वाक्यांश बताता है कि अशदोद का निष्कासन रात के अँधेरे में नहीं, बल्कि दिन के उजाले में होगा।
    reason: cultural_note
