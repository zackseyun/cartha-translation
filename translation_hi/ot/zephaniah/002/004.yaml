- source_word: בַּצָּהֳרַיִם
  choice: दोपहर के समय
  rationale: मूल वाक्यांश का सीधा अर्थ ‘दोपहर में’ है और यह घटना के खुले दिन में घटने की सजीवता बनाए रखता है।
- source_word: יְגָרְשׁוּהָ
  choice: निकाल दिया जाएगा
  rationale: मूल क्रिया का अर्थ निकालना या खदेड़ना है। हिब्रू का स्त्रीलिंग प्रत्यय नगर की ओर संकेत करता है; हिन्दी में कर्मवाच्य प्रयोग अर्थ को स्पष्ट रखते हुए अनावश्यक स्त्री-मानवीकरण से बचाता है।
- source_word: וְעֶקְרוֹן תֵּעָקֵר
  choice: और एक्रोन जड़ से उखाड़ दिया जाएगा
  rationale: נפעל रूप का कर्मवाच्य अर्थ और עקר की जड़ से उखाड़ने की उपमा दोनों सुरक्षित रखे गए हैं।
