  yaml_path: translation/ot/zephaniah/002/001.yaml
  text: Gather yourselves together[a], yes, gather, O shameless nation,
translation:
  language: hi
  text: इकट्ठे हो जाओ, हाँ, इकट्ठे हो जाओ, हे निर्लज्ज राष्ट्र[a]!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, अधिक शाब्दिक रूप में, “हे राष्ट्र, जिसकी चाह नहीं की जाती,” अथवा “हे राष्ट्र, जो लालसा नहीं रखता।” इब्रानी अभिव्यक्ति कठिन है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הִתְקוֹשְׁשׁוּ
  choice: इकट्ठे हो जाओ
  rationale: קשׁשׁ का यह आत्मवाचक बहुवचन आज्ञार्थक रूप यहाँ लोगों को स्वयं एकत्र होने का आह्वान करता है। मूल धातु का शाब्दिक अर्थ भूसा या ठूँठ बटोरना भी हो सकता है, पर समानांतर आज्ञार्थक रूप के कारण प्रसंग में सामूहिक एकत्रीकरण स्वाभाविक है।
- source_word: וָקֹשּׁוּ
  choice: हाँ, इकट्ठे हो जाओ
  rationale: दूसरी आज्ञा पहली को दोहराकर प्रबल बनाती है। ‘हाँ’ वाव के बलात्मक प्रभाव को स्वाभाविक हिन्दी में व्यक्त करता है और पुनरुक्ति को बनाए रखता है।
- source_word: הַגּוֹי
  choice: राष्ट्र
  rationale: גּוֹי किसी सामूहिक जन या राष्ट्र को सूचित करता है; भविष्यद्वक्ताई संबोधन का सामुदायिक स्वर ‘राष्ट्र’ से सुरक्षित रहता है।
- source_word: לֹא נִכְסָף
  choice: निर्लज्ज
  rationale: यह कठिन इब्रानी पद अधिक शाब्दिक रूप में ‘जिसकी चाह नहीं की जाती’ या ‘जिसमें लालसा नहीं’ हो सकता है। प्रसंग में ‘निर्लज्ज’ भविष्यद्वक्ताई फटकार को सहज हिन्दी में व्यक्त करता है, जबकि शाब्दिक अनिश्चितता पादटिप्पणी में सुरक्षित है।
theological_decisions:
- issue: לֹא נִכְסָף का नैतिक या शाब्दिक अर्थ
  choice: मुख्य पाठ में ‘निर्लज्ज’
  alternative: ‘जिसकी चाह नहीं की जाती’ अथवा ‘जिसमें लालसा नहीं’
  rationale: मुख्य पाठ प्रसंगगत नैतिक फटकार को प्रस्तुत करता है, पर कठिन इब्रानी की वास्तविक बहुअर्थकता को पादटिप्पणी में स्पष्ट रूप से बनाए रखता है; इससे किसी विशिष्ट धर्मवैचारिक व्याख्या को निर्णायक नहीं बनाया जाता।
translation_notes:
  register: आधुनिक मानक हिन्दी में सीधा, गरिमापूर्ण भविष्यद्वक्ताई संबोधन। ‘इकट्ठे हो जाओ’ सामान्य पाठक के लिए स्वाभाविक है; दोहराव और ‘हाँ’ मूल की आग्रहपूर्ण तीव्रता बनाए रखते हैं।
