source:
  edition: WLC
  text: שָׁמַ֨עְתִּי֙ חֶרְפַּ֣ת מוֹאָ֔ב וְ/גִדּוּפֵ֖י בְּנֵ֣י עַמּ֑וֹן אֲשֶׁ֤ר חֵֽרְפוּ֙ אֶת עַמִּ֔/י וַ/יַּגְדִּ֖ילוּ עַל גְּבוּלָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zephaniah/002/008.yaml
  text: I have heard the reproach of Moab and the insults of the sons of Ammon[b][a], with which they reproached my people and magnified themselves against their border.
translation:
  language: hi
  text: “मैंने मोआब के तानों और अम्मोनियों[a] के अपमानजनक वचनों को सुना है, जिनके द्वारा उन्होंने मेरी प्रजा का अपमान किया और उनकी सीमा के विरुद्ध अपनी बड़ाई की[b] है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक अर्थ: “अम्मोन के पुत्रों।”'
    reason: मूल इब्रानी जातिसूचक अभिव्यक्ति का अधिक शाब्दिक विकल्प।
  - marker: b
    text: या “उनकी सीमा के विरुद्ध अपने आपको बड़ा ठहराया”; अथवा “उनकी सीमा के विरुद्ध डींगें मारीं।” इब्रानी में ‘उनकी’ का सन्दर्भ संक्षिप्त है; सम्भवतः यह ‘मेरी प्रजा’ की सीमा/भूमि को सूचित करता है।
    reason: क्रिया में आत्म-बड़ाई का भाव तथा सीमा से जुड़े बहुवचन सर्वनाम की सम्भावित अस्पष्टता सुरक्षित रखना।
lexical_decisions:
- source_word: שָׁמַעְתִּי
  choice: मैंने ... सुना है
  rationale: इब्रानी पूर्ण क्रिया को वर्तमान प्रासंगिकता सहित पूर्ण कार्य के रूप में व्यक्त करता है; परमेश्वर द्वारा अपराध का संज्ञान लेने की तात्कालिकता बनी रहती है।
- source_word: חֶרְפַּת מוֹאָב
  choice: मोआब के तानों
  rationale: חֶרְפָּה यहाँ किसी पर किए गए तिरस्कार या उपहास को सूचित करता है। 'तानें' आधुनिक हिन्दी में स्पष्ट है और अगले समानांतर पदबंध से अलग छाया बनाए रखता है।
- source_word: גִדּוּפֵי בְּנֵי עַמּוֹן
  choice: अम्मोनियों के अपमानजनक वचन
  rationale: גִדּוּפִים कटु और अपमानकारी कथनों को सूचित करता है। 'निन्दा' ईश्वर-विरोधी भाषण का अनावश्यक संकेत दे सकती है; यहाँ भाषण का लक्ष्य आगे 'मेरी प्रजा' है। בְּנֵי עַמּוֹן का स्वाभाविक हिन्दी जातिनाम 'अम्मोनी' है।
- source_word: אֲשֶׁר חֵרְפוּ אֶת עַמִּי
  choice: जिनसे उन्होंने मेरी प्रजा को ताना मारा
  rationale: सम्बन्धवाचक खण्ड को पहले उल्लिखित तानों और अपमानजनक वचनों से जोड़ा गया है, जो मेरी प्रजा का उपहास करने के साधन थे।
- source_word: וַיַּגְדִּילוּ
  choice: अपने आपको बड़ा ठहराया
  rationale: גדל के हिफ़ील रूप में आत्म-बड़ाई और अहंकारी उन्नयन का रूपक सुरक्षित रहता है; इसे केवल 'घमण्ड किया' कहकर अर्थ को पूरी तरह व्याख्यायित नहीं किया गया।
- source_word: עַל גְּבוּלָם
  choice: उसकी सीमा के विरुद्ध
  rationale: עַל यहाँ विरोधी या आक्रामक भाव रखता है। बहुवचन प्रत्यय का सम्भावित निकटतम सन्दर्भ सामूहिक संज्ञा 'मेरी प्रजा' है; स्वाभाविक हिन्दी में उसके लिए एकवचन 'उसकी' प्रयुक्त हुआ है।
theological_decisions:
- issue: גְּבוּלָם में तृतीय पुरुष बहुवचन प्रत्यय का सन्दर्भ
  choice: '''उसकी सीमा'' को अभी-अभी उल्लिखित ''मेरी प्रजा'' की सीमा समझना'
  alternative: '''उनकी अपनी सीमा'' अथवा सामान्य रूप से सीमावर्ती भूभाग'
  rationale: '''मेरी प्रजा'' निकटतम सन्दर्भ है और प्रसंग यहूदा के विरुद्ध मोआबी-अम्मोनी शत्रुता से मेल खाता है। फिर भी मूल की संक्षिप्तता के कारण वैकल्पिक समझ को पादटिप्पणी में रखा गया है।'
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज भविष्यद्वक्तात्मक शैली। 'अम्मोनियों' स्वाभाविक जातिनाम है; शाब्दिक रूप पादटिप्पणी में है। मुख्य पाठ आत्म-बड़ाई के इब्रानी रूपक को बनाए रखता है और सीमा-वाक्यांश की अस्पष्टता को पादटिप्पणी में दर्ज करता है।
