language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: בְּ/טֶ֨רֶם֙ לֶ֣דֶת חֹ֔ק כְּ/מֹ֖ץ עָ֣בַר י֑וֹם בְּ/טֶ֣רֶם לֹא יָב֣וֹא עֲלֵי/כֶ֗ם חֲרוֹן֙ אַף יְהוָ֔ה בְּ/טֶ֨רֶם֙ לֹא יָב֣וֹא עֲלֵי/כֶ֔ם י֖וֹם אַף יְהוָֽה׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zephaniah/002/002.yaml
  text: before the decree gives birth—before the day passes away like chaff—before the burning anger of Yahweh comes upon you[c][b][a], before the day of Yahweh’s anger comes upon you.
translation:
  language: hi
  text: इससे पहले कि आदेश जन्म दे[a]—इससे पहले कि दिन भूसी के समान बीत जाए[b]—इससे पहले कि याहवे का धधकता क्रोध तुम पर आ पड़े[c], इससे पहले कि याहवे के क्रोध का दिन तुम पर आ पड़े।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “इससे पहले कि आदेश प्रभावी हो।” इब्रानी में शाब्दिक रूप से “आदेश जन्म दे” है; यह आदेश के प्रकट होने या लागू किए जाने के लिए जन्म की छवि का प्रयोग करता है।
    reason: lexical_alternative
  - marker: b
    text: या, “इससे पहले कि दिन बीत जाए, जैसे भूसी उड़ जाती है।” इब्रानी पंक्ति संक्षिप्त और काव्यात्मक है, इसलिए “दिन” और “भूसी के समान” के बीच का ठीक संबंध एक से अधिक प्रकार से समझा जा सकता है।
    reason: alternative_reading
  - marker: c
    text: इब्रानी में यहाँ “याहवे का धधकता क्रोध” और अगली पंक्ति में “याहवे के क्रोध का दिन” है।
    reason: cross_reference
lexical_decisions:
- source_word: בְּטֶרֶם
  choice: इससे पहले कि
  rationale: तीन बार दोहराए गए कालवाचक पद की चेतावनी और काव्यात्मक आवृत्ति को स्वाभाविक आधुनिक हिन्दी में बनाए रखता है।
- source_word: לֶדֶת חֹק
  choice: आदेश जन्म दे
  rationale: ילד की स्पष्ट जन्म-छवि को अमूर्त ‘लागू हो’ में बदलने के बजाय सुरक्षित रखा गया है; חֹק यहाँ न्याय के संदर्भ में ठहराए हुए आदेश को सूचित करता है।
- source_word: כְּמֹץ
  choice: भूसी के समान
  rationale: מֹץ हवा में उड़ जाने वाली अनाज की भूसी का बिंब है; यह दिन के शीघ्र बीत जाने की उपमा को बनाए रखता है।
- source_word: עָבַר יוֹם
  choice: दिन ... बीत जाए
  rationale: काव्यात्मक चेतावनी में दिन के निकल जाने या हाथ से चले जाने का स्वाभाविक हिन्दी रूप है।
- source_word: חֲרוֹן אַף
  choice: धधकता क्रोध
  rationale: इब्रानी मुहावरे में क्रोध की जलती हुई तीव्रता है; ‘धधकता’ ताप और प्रचंडता दोनों को व्यक्त करता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: ईश्वरीय व्यक्तिगत नाम को उपाधि से बदलने के बजाय हिन्दी लिपि में लिप्यंतरित किया गया है।
- source_word: יָבוֹא עֲלֵיכֶם
  choice: तुम पर आ पड़े
  rationale: न्याय के किसी पर आ पहुँचने की तीव्रता और על की दिशात्मक शक्ति को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: יוֹם אַף יְהוָה
  choice: याहवे के क्रोध का दिन
  rationale: सम्बन्धवाचक इब्रानी पद-समूह का सीधा अनुवाद है और इसे अधिक विस्तृत पारिभाषिक वाक्यांश में नहीं बदलता।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: प्रभु; यहोवा
  rationale: मूल पाठ के व्यक्तिगत नाम को स्पष्ट रखता है और उसके स्थान पर कोई उपाधि नहीं रखता।
- issue: חֹק לֶדֶת में जन्म की रूपक-छवि
  choice: आदेश जन्म दे
  alternative: आदेश लागू हो; निर्णय पूरा किया जाए
  rationale: इब्रानी की असामान्य लेकिन सजीव जन्म-छवि और उसकी व्याख्यात्मक खुली प्रकृति को बनाए रखता है।
- issue: כְּמֹץ עָבַר יוֹם की काव्यात्मक संबद्धता
  choice: दिन भूसी के समान बीत जाए
  alternative: दिन बीत जाए, जैसे भूसी उड़ जाती है
  rationale: संक्षिप्त इब्रानी में ‘भूसी के समान’ का ठीक संबंध कुछ हद तक खुला है; मुख्य पाठ निकटतम सरल संबद्धता देता है और पादटिप्पणी विकल्प बताती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और चेतावनी की काव्यात्मक तात्कालिकता के अनुरूप है। तीनों ‘इससे पहले कि’ संरचनाएँ मूल की आवृत्ति को सुरक्षित रखती हैं। ‘आदेश जन्म दे’ जानबूझकर असामान्य रखा गया है, क्योंकि मूल इब्रानी का रूपक भी असामान्य और अर्थगर्भित है।
