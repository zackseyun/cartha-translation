base_translation:
  language: en
  yaml_path: translation/ot/zephaniah/002/007.yaml
  text: And the coastland shall belong to the remnant of the house of Judah; on it they shall pasture. In the houses of Ashkelon they shall lie down at evening, for Yahweh their God will attend to them and restore their fortunes.
translation:
  language: hi
  text: और समुद्र-तटीय प्रदेश यहूदा के घराने के बचे हुए लोगों का होगा; वे वहीं अपने पशु चराएँगे। वे संध्या के समय अश्कलोन के घरों में लेटेंगे, क्योंकि याहवे उनका परमेश्वर उनकी सुधि लेगा[a] और उनकी दशा बहाल करेगा[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उनकी देखभाल करेगा” अथवा “उनसे भेंट करेगा।” हिब्रू क्रिया का अर्थ ध्यान देकर हस्तक्षेप करना हो सकता है—आशीष या न्याय के लिए; यहाँ प्रसंग कृपापूर्ण पुनर्स्थापना की ओर संकेत करता है।
    reason: lexical_alternative
  - marker: b
    text: या “उनके बंदियों को लौटा लाएगा।” हिब्रू मुहावरा प्रायः किसी जाति की पूर्व दशा या समृद्धि बहाल करने के अर्थ में प्रयुक्त होता है।
    reason: alternative_reading
lexical_decisions:
- source_word: חֶבֶל
  choice: समुद्र-तटीय प्रदेश
  rationale: मूल शब्द का अर्थ भूभाग या क्षेत्र है; पद 5–6 के पलिश्ती समुद्र-तट के संदर्भ में यह अनुवाद भौगोलिक अर्थ को स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
- source_word: שְׁאֵרִית בֵּית יְהוּדָה
  choice: यहूदा के घराने के बचे हुए लोग
  rationale: यह अभिव्यक्ति विनाश के बाद सुरक्षित बचे समुदाय को दर्शाती है और भविष्यद्वाणी में निहित ‘शेष’ की धारणा को सहज आधुनिक हिन्दी में रखती है।
- source_word: עֲלֵיהֶם יִרְעוּן
  choice: वे वहीं अपने पशु चराएँगे
  rationale: רעה यहाँ चराने या चरने से संबंधित है। मानवीय कर्ता और निवास-भूमि के संदर्भ में ‘अपने पशु चराएँगे’ आशय स्पष्ट करता है; ‘वहीं’ पूर्वोक्त क्षेत्र की ओर संकेत करता है और हिब्रू सर्वनाम की सामूहिक संदर्भगत शक्ति बनाए रखता है।
- source_word: בְּבָתֵּי אַשְׁקְלוֹן
  choice: अश्कलोन के घरों में
  rationale: यह सीधा स्थानवाचक अनुवाद न्याय के बाद फिर से बसने और सुरक्षित निवास की छवि बनाए रखता है।
- source_word: בָּעֶרֶב יִרְבָּצוּן
  choice: संध्या के समय ... लेटेंगे
  rationale: רבץ प्रायः पशुओं के बैठने या लेटने का ठोस चित्र देता है; ‘लेटेंगे’ उस चरवाही-संबंधी बिंब को अमूर्त ‘विश्राम करेंगे’ की अपेक्षा अधिक निकटता से सुरक्षित रखता है।
- source_word: יִפְקְדֵם
  choice: उनकी सुधि लेगा
  rationale: פקד ध्यान देने, देखभाल करने, हस्तक्षेप करने अथवा दंड देने तक की व्यापक अर्थ-सीमा रखता है। यहाँ पुनर्स्थापना का संदर्भ कृपापूर्ण ध्यान की ओर संकेत करता है; ‘सुधि लेगा’ अर्थ को अनावश्यक रूप से संकीर्ण नहीं करता।
- source_word: יְהוָה
  choice: याहवे
  rationale: मूल में परमेश्वर का व्यक्तिगत वाचा-नाम है; इसलिए किसी उपाधि से बदलने के बजाय उसका हिन्दी लिप्यंतरण किया गया है।
- source_word: וְשָׁב שְׁבוּתָם
  choice: उनकी दशा बहाल करेगा
  rationale: यह हिब्रू मुहावरा केवल बंदियों की वापसी नहीं, बल्कि किसी समुदाय की दुर्दशा को पलटकर उसकी पूर्व दशा लौटाने का व्यापक अर्थ भी देता है। यह अनुवाद उसी व्यापक पुनर्स्थापना को सहज हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: וְשָׁב שְׁבוּתָם में पुनर्स्थापना का स्वरूप
  choice: उनकी दशा बहाल करेगा
  alternative: उनके बंदियों को लौटा लाएगा
  rationale: मूल मुहावरा दोनों प्रकार से समझा जा सकता है, पर इस पद में भूमि, चराई और सुरक्षित निवास की बहाली व्यापक दशा-पलट को प्रमुख बनाती है। वैकल्पिक अधिक शाब्दिक अर्थ को पादटिप्पणी में रखा गया है।
- issue: יִפְקְדֵם में परमेश्वर के हस्तक्षेप का अर्थ
  choice: उनकी सुधि लेगा
  alternative: उनसे भेंट करेगा / उनकी देखभाल करेगा
  rationale: פקד का अर्थ प्रसंग के अनुसार अनुग्रह या न्याय के लिए ध्यान देना और हस्तक्षेप करना हो सकता है। यहाँ आगामी बहाली अनुग्रहपूर्ण अर्थ को समर्थित करती है, फिर भी पादटिप्पणी मूल की अर्थ-व्याप्ति बताती है।
- issue: יְהוָה का निरूपण
  choice: याहवे
  alternative: यहोवा / प्रभु
  rationale: पद में वाचा-नाम स्वयं उपस्थित है। उसका लिप्यंतरण मूल की व्यक्तिगत नाम-सूचना को सुरक्षित रखता है और उसे किसी सामान्य उपाधि से प्रतिस्थापित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सहज रूप अपनाया गया है। ‘समुद्र-तटीय प्रदेश’, ‘अपने पशु चराएँगे’ और ‘सुधि लेगा’ जैसे पद मूल के भूगोल, चरवाही-बिंब और अर्थगत व्यापकता को सामान्य पाठक के लिए स्पष्ट रखते हैं।
