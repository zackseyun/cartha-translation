source:
  edition: WLC
  text: לָ/כֵ֣ן חַי אָ֡נִי נְאֻם֩ יְהוָ֨ה צְבָא֜וֹת אֱלֹהֵ֣י יִשְׂרָאֵ֗ל כִּֽי מוֹאָ֞ב כִּ/סְדֹ֤ם תִּֽהְיֶה֙ וּ/בְנֵ֤י עַמּוֹן֙ כַּֽ/עֲמֹרָ֔ה מִמְשַׁ֥ק חָר֛וּל וּ/מִכְרֵה מֶ֥לַח וּ/שְׁמָמָ֖ה עַד עוֹלָ֑ם שְׁאֵרִ֤ית עַמִּ/י֙ יְבָזּ֔וּ/ם וְ/יֶ֥תֶר גוי יִנְחָלֽוּ/ם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zephaniah/002/009.yaml
  text: Therefore[a], as I live, declares Yahweh of hosts, the God of Israel, Moab will surely become like Sodom, and the sons of Ammon like Gomorrah—a place overgrown with weeds, a salt pit, and a perpetual desolation. The remnant of my people will plunder them[b], and the remainder of my nation will inherit them.
translation:
  language: hi
  text: 'इसलिए, सेनाओं के याहवे, इस्राएल के परमेश्वर की यह घोषणा है: “मेरे जीवन की शपथ, मोआब सदोम के समान और अम्मोन के वंशज अमोरा के समान हो जाएँगे—बिच्छू-बूटियों का स्थान, नमक का गड्ढा और सदा के लिए उजाड़। मेरी प्रजा के बचे हुए लोग उन्हें लूटेंगे, और मेरे राष्ट्र के शेष लोग उन्हें अपना अधिकार बनाएँगे।”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לָכֵן
  choice: इसलिए
  rationale: पिछले दोषारोपण से निकलने वाले न्याय के निष्कर्ष को स्वाभाविक और स्पष्ट रूप से व्यक्त करता है।
- source_word: חַי אָנִי
  choice: मेरे जीवन की शपथ
  rationale: ईश्वर की गंभीर आत्म-शपथ को हिन्दी के स्वाभाविक मुहावरे में सुरक्षित रखता है।
- source_word: נְאֻם יְהוָה צְבָאוֹת אֱלֹהֵי יִשְׂרָאֵל
  choice: सेनाओं के यहोवा, इस्राएल के परमेश्वर की यह घोषणा है
  rationale: נְאֻם को भविष्यद्वाणी की औपचारिक घोषणा और יהוה को उसके व्यक्तिवाचक वाचा-नाम के रूप में प्रस्तुत करता है; צְבָאוֹת के लिए प्रचलित और अर्थसंगत ‘सेनाओं के’ रखा गया है।
- source_word: כִּי
  choice: निश्चयार्थक शपथ-वाक्य में अंतर्निहित
  rationale: हिन्दी में ‘मेरे जीवन की शपथ’ के बाद आने वाला निश्चित भविष्य कथन כִּי के बल को स्वाभाविक रूप से व्यक्त करता है; अलग से ‘निश्चय ही’ जोड़ना अनावश्यक पुनरुक्ति होता।
- source_word: וּבְנֵי עַמּוֹן
  choice: अम्मोन के वंशज
  rationale: शाब्दिक ‘अम्मोन के पुत्र’ की जातीय अभिव्यक्ति को आधुनिक हिन्दी में स्पष्ट रखते हुए मूल की वंश-संबंधी छवि बचाता है।
- source_word: מִמְשַׁק חָרוּל
  choice: बिच्छू-बूटियों से ढका स्थान
  rationale: कठिन हिब्रू पदबंध में उजड़ी भूमि पर फैली काँटेदार या नेटल-जैसी वनस्पति की छवि को व्यक्त करता है, पर מִמְשַׁק का अत्यधिक निश्चित अर्थ नहीं ठहराता।
- source_word: וּמִכְרֵה מֶלַח
  choice: नमक के गड्ढे
  rationale: מִכְרֵה संभवतः खुदे हुए स्थान या गड्ढों का बोध देता है और हिब्रू रूप को सामूहिक/बहुवचन अर्थ में पढ़ना उजाड़ लवणीय भूभाग की छवि के अनुकूल है।
- source_word: וּשְׁמָמָה עַד עוֹלָם
  choice: सदा के लिए उजाड़
  rationale: स्थायी विनाश की अवधि और दशा दोनों को संक्षिप्त, स्वाभाविक हिन्दी में रखता है।
- source_word: שְׁאֵרִית עַמִּי
  choice: मेरी प्रजा के बचे हुए लोग
  rationale: भविष्यद्वाणी-साहित्य के ‘शेष’ विचार को साधारण पाठक के लिए स्पष्ट करता है और व्यक्तियों के समूह का अर्थ बनाए रखता है।
- source_word: וְיֶתֶר גוי יִנְחָלוּם
  choice: मेरे राष्ट्र के शेष लोग उनकी भूमि के अधिकारी होंगे
  rationale: ינחלום के विरासत/अधिकार ग्रहण करने के भाव को व्यक्त करता है। ‘उनकी भूमि’ प्रसंग से निहित वस्तु को स्पष्ट करती है और हिन्दी में लोगों को ‘विरासत में पाने’ जैसी संभावित गलत समझ से बचाती है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल में आए वाचा-नाम को सामान्य पदवी ‘प्रभु’ से नहीं बदला गया। आधुनिक हिन्दी बाइबल-पाठकों में पहचाने जाने वाले रूप ‘यहोवा’ को रखा गया, जबकि ‘याहवे’ अधिक संभावित विद्वत् उच्चारण है।
- issue: עַד עוֹלָם में न्याय की अवधि
  choice: सदा के लिए
  alternative: बहुत लंबे समय तक
  rationale: हिब्रू की तीव्र और अनिश्चित-अवधि वाली स्थायित्व-अभिव्यक्ति को कमजोर किए बिना सीधे रखा गया; इससे व्यापक व्यवस्थित धर्मशास्त्रीय निष्कर्ष नहीं जोड़ा गया।
- issue: יִנְחָלוּם का आशय
  choice: उनकी भूमि के अधिकारी होंगे
  alternative: उन्हें अपने अधिकार में लेंगे
  rationale: क्रिया के विरासत/अधिकार संबंधी अर्थ और भू-न्याय के प्रसंग को प्राथमिकता दी गई, जबकि सर्वनाम के शाब्दिक संदर्भ की संभावित व्यापकता को स्वीकार किया गया।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, गंभीर भविष्यद्वाणी शैली और सामान्य पाठक की समझ के बीच संतुलित है। नामों के रूप ‘मोआब’, ‘अम्मोन’, ‘सदोम’ और ‘अमोरा’ हिन्दी बाइबिल परंपरा के अनुकूल हैं। कठिन מִמְשַׁק חָרוּל को अतिशय शाब्दिक बनाने के बजाय दृश्यात्मक रूप से व्यक्त किया गया है। कोई पादटिप्पणी नहीं दी गई, इसलिए मुख्य पाठ में पादटिप्पणी-चिह्न भी नहीं हैं।
