lexical_decisions:
- source_word: חֶבֶל הַיָּם
  choice: समुद्रतट का प्रदेश
  rationale: חֶבֶל यहाँ केवल तटरेखा नहीं, समुद्र से लगा भू-भाग या प्रदेश दर्शाता है; इसलिए ‘प्रदेश’ जोड़कर अर्थ स्पष्ट किया गया है।
- source_word: נְוֹת
  choice: चरागाह
