- source_word: כְּרֹת
  choice: कुएँ
  rationale: दुर्लभ और अनिश्चित रूप को खोदी हुई जगहों, विशेषतः जलस्रोतों, के रूप में समझा गया है; पाठ की अनिश्चितता पादटिप्पणी में सुरक्षित रखी गई है।
- source_word: גִדְרוֹת צֹאן
  choice: भेड़-बकरियों के लिए बाड़े
  rationale: शाब्दिक अर्थ ‘झुंड के बाड़े’ है। हिन्दी में צֹאן के छोटे पालतू पशुओं के सामूहिक भाव को ‘भेड़-बकरियाँ’ स्पष्ट करता है।
