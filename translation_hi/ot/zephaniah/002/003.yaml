source:
  edition: WLC
  text: בַּקְּשׁ֤וּ אֶת יְהוָה֙ כָּל עַנְוֵ֣י הָ/אָ֔רֶץ אֲשֶׁ֥ר מִשְׁפָּט֖/וֹ פָּעָ֑לוּ בַּקְּשׁוּ צֶ֨דֶק֙ בַּקְּשׁ֣וּ עֲנָוָ֔ה אוּלַי֙ תִּסָּ֣תְר֔וּ בְּ/י֖וֹם אַף יְהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zephaniah/002/003.yaml
  text: Seek Yahweh[a], all you humble of the land, who have carried out his justice; seek righteousness, seek humility[d][c][b]; perhaps you will be hidden in the day of Yahweh’s anger.
translation:
  language: hi
  text: हे देश के सब नम्र लोगो, जो उसके न्याय को पूरा करते आए हो,[a] यहोवा को खोजो; धार्मिकता को खोजो,[b] नम्रता को खोजो। संभव है कि यहोवा के क्रोध के दिन तुम छिपे रहो।[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “पृथ्वी के सब नम्र लोगो”; अथवा, “जो उसके विधान को पूरा करते आए हो।”
    reason: הָאָרֶץ का अर्थ ‘देश’ या ‘पृथ्वी’ हो सकता है, और מִשְׁפָּטוֹ פָּעָלוּ का अर्थ ‘उसके विधान को पूरा करना’ भी हो सकता है।
  - marker: b
    text: “धार्मिकता” का अनुवाद “न्याय” भी किया जा सकता है।
    reason: צֶדֶק की नैतिक और न्यायिक अर्थ-सीमा को सुरक्षित रखने के लिए।
  - marker: c
    text: या, “संभव है कि तुम्हें छिपा लिया जाए,” अथवा “संभव है कि तुम शरण पाओ।”
    reason: תִּסָּתְרוּ के कर्मवाच्य/मध्यवाच्य भाव और संभव आश्रय-सूचक अर्थ को दर्शाने के लिए।
lexical_decisions:
- source_word: בַּקְּשׁוּ
  choice: खोजो
  rationale: बहुवचन आज्ञार्थक क्रिया का सीधा और स्वाभाविक अनुवाद; मूल में इसकी तीन बार की पुनरावृत्ति भी बनाए रखी गई है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: परमेश्वर के व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय हिन्दी में प्रचलित लिप्यन्तरण द्वारा प्रस्तुत किया गया है।
- source_word: עַנְוֵי הָאָרֶץ
  choice: देश के सब नम्र लोगो
  rationale: עַנְוֵי का अर्थ नम्र, दीन या विनीत हो सकता है। आगे आए עֲנָוָה के साथ शब्दगत सम्बन्ध बनाए रखने के लिए 'नम्र' चुना गया। सन्दर्भ में הָאָרֶץ के लिए 'देश' उपयुक्त है, यद्यपि 'पृथ्वी' भी सम्भव है।
- source_word: אֲשֶׁר מִשְׁפָּטוֹ פָּעָלוּ
  choice: जो उसके न्याय पर चलते हो
  rationale: शाब्दिक अर्थ 'जो उसका न्याय करते/पूरा करते हो' है। हिन्दी में 'उसके न्याय पर चलते हो' आज्ञाकारिता और व्यवहार—दोनों को स्वाभाविक रूप से व्यक्त करता है, जबकि विकल्प पादटिप्पणी में दिया गया है।
- source_word: צֶדֶק
  choice: धार्मिकता
  rationale: यहाँ नैतिक रूप से सही आचरण की खोज अभिप्रेत है। शब्द का 'न्याय' अर्थ भी सम्भव है और पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: עֲנָוָה
  choice: नम्रता
  rationale: यह संज्ञा नम्रता, दीनता या विनम्रता दर्शाती है। 'नम्रता' पहले आए 'नम्र लोगो' से मूल का सम्बन्ध बनाए रखती है।
- source_word: אוּלַי
  choice: सम्भव है
  rationale: यह शब्द निश्चित आश्वासन नहीं, बल्कि सम्भावना व्यक्त करता है; अतः भविष्यवाणी की अनिश्चितता सुरक्षित रखी गई है।
- source_word: תִּסָּתְרוּ
  choice: तुम छिपाए जाओगे
  rationale: निफ़अल रूप का मूल भाव छिपाया या गुप्त रखा जाना है। 'सम्भव है' पहले ही अनिश्चितता प्रकट करता है; 'शरण पाओगे' सम्भव पर अधिक व्याख्यात्मक विकल्प है।
- source_word: בְּיוֹם אַף יְהוָה
  choice: यहोवा के क्रोध के दिन
  rationale: אַף यहाँ तीव्र क्रोध दर्शाता है। हिन्दी में यह वाक्यांश स्वाभाविक है और मूल का न्याय-दिवस सम्बन्धी बल बनाए रखता है।
theological_decisions:
- issue: क्या नम्र लोगों की रक्षा निश्चित है या केवल सम्भावित
  choice: '''सम्भव है कि ... तुम छिपाए जाओगे''—रक्षा को सम्भावना के रूप में रखा गया है।'
  alternative: इसे धर्मी बचे हुए लोगों के लिए निश्चित छुटकारे की प्रतिज्ञा माना जा सकता है।
  rationale: मूल का אוּלַי स्पष्ट रूप से सम्भावना बताता है। इसलिए अनुवाद इस तनाव को निश्चित प्रतिज्ञा में नहीं बदलता।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किन्तु सहज भविष्यवाणी-संबंधी स्वर रखा गया है। सम्बोधन में आदरसूचक बहुवचन और तीनों आज्ञाओं की मूल पुनरावृत्ति सुरक्षित है।
