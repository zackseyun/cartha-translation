source:
  edition: WLC
  text: נוֹרָ֤א יְהוָה֙ עֲלֵי/הֶ֔ם כִּ֣י רָזָ֔ה אֵ֖ת כָּל אֱלֹהֵ֣י הָ/אָ֑רֶץ וְ/יִשְׁתַּֽחֲווּ ל/וֹ֙ אִ֣ישׁ מִ/מְּקוֹמ֔/וֹ כֹּ֖ל אִיֵּ֥י הַ/גּוֹיִֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zephaniah/002/011.yaml
  text: Yahweh will be fearsome against them[a], for he will make all the gods of the earth waste away; and they will bow down to him, each from his own place[b], all the coastlands of the nations.
translation:
  language: hi
  text: याहवे उनके विरुद्ध भयप्रद ठहरेगा, क्योंकि वह पृथ्वी के सब देवताओं को क्षीण कर देगा[a]; और वे—अर्थात् राष्ट्रों के सब समुद्र-तटीय प्रदेशों के लोग—अपने-अपने स्थान से उसके आगे दण्डवत् करेंगे[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “दुबला कर देगा” या “भूखा कर देगा।” इब्रानी क्रिया कृश या क्षीण होने की ओर संकेत करती है।
    reason: lexical_alternative
  - marker: b
    text: या, “राष्ट्रों के सब द्वीप।” इब्रानी पद दूरस्थ द्वीपों, समुद्र-तटीय प्रदेशों, अथवा काव्यात्मक रूप से वहाँ के लोगों का द्योतक हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: נוֹרָא
  choice: भयावह
  rationale: यह विशेषण याहवे से उत्पन्न भय और विस्मय को व्यक्त करता है; आधुनिक हिन्दी में ‘भयावह’ उसके प्रबल, सक्रिय प्रभाव को सहज रूप से बताता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत नाम को उपाधि से बदलने के बजाय देवनागरी लिप्यंतरण में रखा गया है।
- source_word: עֲלֵיהֶם
  choice: उनके विरुद्ध
  rationale: आसपास के न्याय-संदर्भ में עַל स्थानसूचक नहीं, विरोधात्मक अर्थ देता है।
- source_word: רָזָה
  choice: क्षीण कर देगा
  rationale: क्रिया दुबला या कृश होने की छवि रखती है। ‘क्षीण कर देगा’ देवताओं के सामर्थ्य और उपासना के घट जाने की रूपकात्मक भाषा को बिना अतिरिक्त व्याख्या के बनाए रखता है।
- source_word: אֵת כָּל אֱלֹהֵי הָאָרֶץ
  choice: पृथ्वी के सब देवताओं को
  rationale: मूल पाठ के बहुवचन ‘देवताओं’ और इस पद के विश्वव्यापी विस्तार को सीधे सुरक्षित रखा गया है।
- source_word: וְיִשְׁתַּחֲווּ לוֹ
  choice: उसके आगे दण्डवत् करेंगे
  rationale: यह क्रिया झुकने या भूमि पर गिरकर आदर और उपासना करने का शारीरिक तथा धार्मिक भाव रखती है।
- source_word: אִישׁ מִמְּקוֹמוֹ
  choice: अपने-अपने स्थान से
  rationale: वितरणात्मक אִישׁ और ‘से’ अर्थ देने वाले מִן को स्वाभाविक हिन्दी में व्यक्त करता है तथा विभिन्न स्थानों से होने वाली उपासना की तस्वीर बनाए रखता है।
- source_word: כֹּל אִיֵּי הַגּוֹיִם
  choice: राष्ट्रों के सब समुद्र-तटवासी
  rationale: אִיִּים द्वीपों या समुद्र-तटीय क्षेत्रों तथा उनसे संबद्ध दूरस्थ लोगों का द्योतक हो सकता है। यहाँ क्रिया के मानवीय कर्ता के अनुरूप ‘समुद्र-तटवासी’ स्वाभाविक है, जबकि वैकल्पिक भौगोलिक अर्थ पादटिप्पणी में रखा गया है।
theological_decisions:
- issue: ‘पृथ्वी के सब देवताओं’ पर न्याय को कैसे व्यक्त किया जाए
  choice: मूल पाठ की देवताओं संबंधी विवादात्मक भाषा को सीधे रखते हुए कहा गया कि याहवे उन्हें ‘क्षीण कर देगा’।
  alternative: ‘मूर्तियों’ कहना या ‘झूठे धर्म को नष्ट कर देगा’ जैसी व्याख्यात्मक भाषा अपनाना।
  rationale: इब्रानी पाठ स्पष्ट रूप से ‘देवताओं’ कहता है। सीधा अनुवाद याहवे की सर्वोच्चता को बनाए रखता है, पर देवताओं के अस्तित्व या स्वरूप पर पाठ से परे कोई तात्त्विक निष्कर्ष नहीं जोड़ता।
- issue: अंतिम खंड में स्थानीय या केंद्रीकृत उपासना
  choice: ‘अपने-अपने स्थान से’ द्वारा विभिन्न स्थानों से याहवे को दण्डवत् करने का भाव सुरक्षित रखा गया है।
  alternative: ‘अपने-अपने स्थान में’ कहना या इसे सिय्योन की तीर्थयात्रा के रूप में स्पष्ट करना।
  rationale: מִן का सामान्य अर्थ ‘से’ है; इसलिए अनुवाद बिखरे हुए राष्ट्रों द्वारा अपने स्थानों से उपासना करने की संभावित तस्वीर को बिना संकीर्ण व्याख्या के रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमामय और सामान्य पाठकों के लिए सुबोध स्तर रखा गया है। ‘दण्डवत्’ बाइबिलीय उपासना-संदर्भ में परिचित है और झुकने की शारीरिक छवि भी बचाता है। अंतिम इब्रानी पद की भौगोलिक और मानवीय अस्पष्टता मुख्य पाठ तथा पादटिप्पणी के संयोजन से सुरक्षित रखी गई है।
