id: ZEP.2.12
reference: Zephaniah 2:12
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: גַּם אַתֶּ֣ם כּוּשִׁ֔ים חַֽלְלֵ֥י חַרְבִּ֖/י הֵֽמָּה־׃
base_translation:
  language: en
  yaml_path: translation/ot/zephaniah/002/012.yaml
  text: You Cushites also will be slain by my sword[a][b].
translation:
  language: hi
  text: हे कूशियो, तुम भी मेरी तलवार से मारे जाओगे।[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक शाब्दिक रूप: “हे कूशियो, तुम भी—वे मेरी तलवार से मारे हुए लोग हैं।”'
    reason: मूल इब्रानी की क्रियारहित, संज्ञात्मक रचना और स्वतंत्र सर्वनाम के बल को दिखाने के लिए।
  - marker: b
    text: “कूशी” का अनुवाद “इथियोपियाई” भी किया जाता है; यहाँ प्राचीन कूश देश के लोग अभिप्रेत हैं, जिन्हें आधुनिक राष्ट्र इथियोपिया से पूरी तरह समान नहीं मानना चाहिए।
    reason: प्राचीन जातिनाम का वैकल्पिक पारंपरिक अनुवाद और उसका भौगोलिक संदर्भ स्पष्ट करने के लिए।
lexical_decisions:
- source_word: גַּם
  choice: भी
  rationale: यह आसपास की जातियों के साथ कूशियों को भी न्याय के दायरे में शामिल करने वाला योगात्मक भाव स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: אַתֶּם
  choice: तुम
  rationale: द्वितीय पुरुष बहुवचन का सीधा संबोधन है; हिन्दी में जाति-समूह को संबोधित करने के लिए ‘तुम’ स्पष्ट और स्वाभाविक है।
- source_word: כּוּשִׁים
  choice: कूशियो
  rationale: मूल जातिनाम ‘कूश’ को आधुनिक ‘इथियोपिया’ से पूरी तरह समान मानने की भ्रामक संभावना से बचाते हुए लिप्यंतरित किया गया है; संबोधन के कारण ‘कूशियो’ रूप रखा गया है।
- source_word: חַֽלְלֵי
  choice: मारे जाओगे
  rationale: संज्ञात्मक पद ‘मारे हुए लोग’ को भविष्यसूचक संदर्भ में स्वाभाविक हिन्दी निष्क्रिय क्रिया के रूप में व्यक्त किया गया है, जबकि हिंसक मृत्यु का अर्थ बना रहता है।
- source_word: חַרְבִּי
  choice: मेरी तलवार से
  rationale: प्रथम पुरुष एकवचन संबंध और तलवार की ठोस न्याय-छवि दोनों सुरक्षित हैं; हिन्दी में करण-संबंध के लिए ‘से’ स्वाभाविक है।
- source_word: הֵמָּה
  choice: जाओगे
  rationale: मूल की क्रियारहित विधेयात्मक रचना को भविष्यसूचक प्रसंग के अनुसार हिन्दी भविष्यकाल में व्यक्त किया गया है; अधिक शाब्दिक वर्तमान-सदृश रूप पादटिप्पणी में सुरक्षित है।
theological_decisions:
- issue: क्रियारहित उपवाक्य में निहित काल
  choice: 'भविष्यसूचक अर्थ: ‘मारे जाओगे’'
  alternative: 'अधिक शाब्दिक वर्तमान-सदृश अर्थ: ‘वे मेरी तलवार से मारे हुए हैं’'
  rationale: इब्रानी भविष्यवाणी में क्रियारहित वाक्य आगामी न्याय की घोषणा कर सकता है। हिन्दी भविष्यकाल उस शक्ति को स्पष्ट करता है, पर मूल की व्याकरणिक अस्पष्टता पादटिप्पणी में रखी गई है।
- issue: ‘मेरी’ का वक्ता
  choice: पाठ में वक्ता को बिना अतिरिक्त पहचान जोड़े प्रथम पुरुष में रहने दिया गया है
  alternative: ‘यहोवा की तलवार’ जैसे स्पष्टकारी विस्तार
  rationale: पद में केवल प्रथम पुरुष प्रत्यय है। प्रसंग वक्ता की पहचान देता है, इसलिए इस पद में कोई व्याख्यात्मक नाम जोड़ना मूल से आगे जाना होता।
translation_notes:
  register: भाषा आधुनिक, सीधी और गरिमापूर्ण रखी गई है। ‘हे कूशियो’ प्रत्यक्ष जातीय संबोधन को स्वाभाविक हिन्दी में व्यक्त करता है। मुख्य पाठ में भविष्यसूचक न्याय स्पष्ट है, जबकि मूल की अधिक शाब्दिक रचना और जातिनाम का विकल्प पादटिप्पणियों में सुरक्षित हैं।
