base_translation:
  language: en
  yaml_path: translation/ot/zephaniah/002/014.yaml
  text: Herds will lie down in her midst[a], every beast of the nations; both the desert owl and the hedgehog will spend the night among her capitals. A voice will sing in the window; devastation will be on the threshold[c][b], for her cedarwork has been laid bare.
translation:
  language: hi
  text: उसके भीतर हर प्रकार के पशुओं के झुंड लेटेंगे[c]। मरुस्थलीय उल्लू[a] और साही[b], दोनों उसके स्तंभ-शीर्षों के बीच रात बिताएँगे। खिड़की में एक आवाज़ गाएगी; देहरी पर उजाड़ होगा, क्योंकि उसकी देवदार की सजावट उघाड़ दी गई है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इस इब्रानी प्राणी-नाम की पहचान निश्चित नहीं है; इसका अनुवाद ‘हवासील’ भी किया जाता है।
    reason: lexical_alternative
  - marker: b
    text: इस इब्रानी शब्द से अभिप्रेत प्रजाति विवादित है; संभवतः ‘हेजहॉग’ या कोई अन्य काँटेदार छोटा जीव।
    reason: lexical_alternative
  - marker: c
    text: इब्रानी पदबंध का शाब्दिक रूप लगभग ‘किसी जाति/राष्ट्र का हर पशु’ है और उसका अर्थ कठिन है; संभवतः आशय ‘हर प्रकार के पशु’ है।
    reason: alternative_reading
lexical_decisions:
- source_word: וְרָבְצוּ
  choice: लेटेंगे
  rationale: רבץ पशुओं के बैठने, लेटने या विश्राम करने को दर्शाता है; यहाँ उजड़े नगर में पशुओं के बसने का दृश्य है।
- source_word: עֲדָרִים
  choice: झुंड
  rationale: यह शब्द पशुओं के समूहों के लिए प्रयुक्त हो सकता है; ‘झुंड’ भेड़ों तक सीमित नहीं है और हिंदी में स्वाभाविक है।
- source_word: בְתוֹכָהּ
  choice: उसके भीतर
  rationale: स्त्रीलिंग प्रत्यय नगर की ओर संकेत करता है; हिंदी में ‘उसके भीतर’ इस संदर्भ को स्वाभाविक ढंग से बनाए रखता है।
- source_word: כָּל חַיְתוֹ גוֹי
  choice: हर जाति के वन-पशु
  rationale: इब्रानी पदबंध व्याकरण और अर्थ की दृष्टि से कठिन है। यह अनुवाद उसके ‘जाति/राष्ट्र’ संबंधी रूप को मिटाए बिना संभावित व्यापक अर्थ देता है; अनिश्चितता पादटिप्पणी में रखी गई है।
- source_word: קָאַת
  choice: मरुस्थलीय उल्लू
  rationale: प्राणी की सटीक पहचान अनिश्चित है। उजाड़ स्थान में रहने वाले पक्षी की छवि के लिए यह सुबोध चयन है; ‘हवासील’ विकल्प पादटिप्पणी में दिया गया है।
- source_word: קִפֹּד
  choice: साही
  rationale: प्रजाति की पहचान विवादित है। ‘साही’ आधुनिक हिंदी में परिचित वन्य जीव का नाम है; ‘हेजहॉग’ की संभावना पादटिप्पणी में सुरक्षित है।
- source_word: בְכַפְתֹּרֶיהָ
  choice: उसके स्तंभ-शीर्षों के बीच
  rationale: כפתור यहाँ संभवतः स्तंभों के अलंकृत शीर्ष या घुंडीदार वास्तु-भाग हैं। यह रूप उजड़े भवन की वास्तु-छवि स्पष्ट करता है।
- source_word: יָלִינוּ
  choice: रात बिताएँगे
  rationale: לין का मूल अर्थ रात ठहरना या रात बिताना है।
- source_word: קוֹל יְשׁוֹרֵר
  choice: एक आवाज़ गाएगी
  rationale: यह जानबूझकर असामान्य काव्यात्मक अभिव्यक्ति ‘आवाज़’ और שׁיר, ‘गाना’, दोनों को सुरक्षित रखती है; इसे ‘पुकारेगी’ बनाकर तनाव को हल नहीं किया गया।
- source_word: בַחַלּוֹן
  choice: खिड़की में
  rationale: सीधा स्थानवाचक अनुवाद उजड़े भवन की खिड़की से आती रहस्यमय आवाज़ का चित्र बनाए रखता है।
- source_word: חֹרֶב
  choice: उजाड़
  rationale: संदर्भ में यह शब्द सूखेपन से उत्पन्न वीरानी अथवा विनाश की दशा बताता है; ‘उजाड़’ संक्षिप्त, स्वाभाविक और दृश्यात्मक है।
- source_word: בַסַּף
  choice: देहरी पर
  rationale: סף द्वार की देहरी या चौखट के निचले भाग को दर्शाता है; ‘देहरी’ वास्तु-संबंधी ठोस छवि बनाए रखती है।
- source_word: כִּי אַרְזָה עֵרָה
  choice: क्योंकि उसकी देवदार की सजावट उघाड़ दी गई है
  rationale: पदबंध देवदार के लकड़ी-पट्टों या सजावटी काम के खुल जाने/नंगा कर दिए जाने की ओर संकेत करता है। ‘सजावट’ हिंदी में वास्तु-संदर्भ स्पष्ट करती है, जबकि ‘उघाड़ दी गई’ विनाश के परिणाम को रखता है।
