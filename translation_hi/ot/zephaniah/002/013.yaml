base_translation:
  language: en
  yaml_path: translation/ot/zephaniah/002/013.yaml
  text: And he will stretch out his hand against the north and destroy Assyria[a], and he will make Nineveh a desolation, dry like the wilderness.
translation:
  language: hi
  text: वह उत्तर के विरुद्ध अपना हाथ बढ़ाएगा और अश्शूर का नाश करेगा; वह नीनवे को निर्जन प्रदेश[a] के समान सूखा उजाड़ स्थान बना देगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “रेगिस्तान।” इब्रानी शब्द मिदबार प्रसंग के अनुसार निर्जन प्रदेश, चरागाही वन्य क्षेत्र या रेगिस्तान-जैसी उजाड़ भूमि को दर्शा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֵט יָדוֹ
  choice: अपना हाथ बढ़ाएगा
  rationale: נטה के साथ 'हाथ' सक्रिय न्याय की ठोस छवि देता है; हिन्दी में 'हाथ बढ़ाना' इस रूपक को स्वाभाविक रूप से बनाए रखता है।
- source_word: עַל צָפוֹן
  choice: उत्तर की ओर
  rationale: עַל यहाँ दिशा और शत्रुतापूर्ण कार्रवाई दोनों का संकेत दे सकता है। अगले खंड में अश्शूर के विनाश से विरोध का भाव स्पष्ट हो जाता है, जबकि 'की ओर' स्थानगत अभिमुखता को सुरक्षित रखता है।
- source_word: וִיאַבֵּד אֶת אַשּׁוּר
  choice: अश्शूर का नाश करेगा
  rationale: אבד का हिफ़ील रूप किसी का विनाश कर देने का अर्थ देता है; אַשּׁוּר यहाँ साम्राज्य अथवा देश का नाम है।
- source_word: וְיָשֵׂם אֶת נִינְוֵה לִשְׁמָמָה
  choice: वह नीनवे को उजाड़ देगा
  rationale: שׂים ... לִשְׁמָמָה का परिणामसूचक अर्थ है कि नगर को उजड़ी दशा में कर दिया जाएगा। 'उजाड़ देगा' आधुनिक हिन्दी में संक्षिप्त और स्वाभाविक है।
- source_word: צִיָּה
  choice: सूखा
  rationale: यह शब्द शुष्क अथवा जलहीन दशा बताता है; यहाँ नीनवे की होने वाली उजड़ी अवस्था का वर्णन करता है।
- source_word: כַּמִּדְבָּר
  choice: निर्जन प्रदेश के समान
  rationale: מִדְבָּר का अर्थ केवल रेगिस्तान नहीं, बल्कि निर्जन वन्य अथवा चरागाही क्षेत्र भी हो सकता है। 'निर्जन प्रदेश' इस व्यापकता को बनाए रखता है।
theological_decisions:
- issue: ईश्वरीय न्याय का मानवरूपी चित्रण
  choice: '''अपना हाथ बढ़ाएगा'' की ठोस छवि बनाए रखी गई'
  alternative: '''उत्तर के विरुद्ध कार्रवाई करेगा'''
  rationale: इब्रानी पाठ परमेश्वर के न्यायपूर्ण हस्तक्षेप को हाथ बढ़ाने की शारीरिक छवि में व्यक्त करता है। इसे अमूर्त करना भविष्यवाणी की अलंकारिक शक्ति को घटा देता।
- issue: עַל צָפוֹן में दिशा अथवा विरोध
  choice: उत्तर की ओर
  alternative: उत्तर के विरुद्ध
  rationale: पूर्वसर्ग עַל दोनों अर्थछायाएँ ग्रहण कर सकता है। 'की ओर' भौगोलिक दिशा सुरक्षित रखता है; अश्शूर के नाश का अगला वाक्य विरोध और न्याय का भाव स्वयं स्पष्ट करता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सामान्य-पाठक-सुलभ रूप। 'अश्शूर' और 'नीनवे' प्रचलित हिन्दी बाइबलीय नाम-रूप हैं। अर्धविराम और डैश समानांतर भविष्यवाणी-वाक्यों तथा अंतिम परिणाम-वर्णन को स्पष्ट करते हैं।
