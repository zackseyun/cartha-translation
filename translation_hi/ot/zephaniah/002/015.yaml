base_translation:
  language: en
  yaml_path: translation/ot/zephaniah/002/015.yaml
  text: This is the exultant city that lived securely[a], that said in her heart, ‘I am, and there is none besides me.’ How she has become a desolation[b], a resting place for wild animals! Everyone who passes by her will hiss and wave his hand.
translation:
  language: hi
  text: यह वह उल्लसित नगरी है, जो निश्चिंत होकर बसी थी और अपने मन में कहती थी, “मैं ही हूँ, और मेरे सिवा कोई नहीं।” वह कैसी उजाड़[a] हो गई है—जंगली पशुओं के लेटने की जगह! जो कोई उसके पास से गुज़रेगा, वह सीटी बजाएगा[b] और अपना हाथ हिलाएगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “भयावह दृश्य।” इब्रानी शब्द केवल भौतिक उजाड़ ही नहीं, बल्कि आतंक उत्पन्न करनेवाले विनाश का भाव भी व्यक्त कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: या, “फुफकारेगा।” इब्रानी क्रिया आश्चर्य या उपहास प्रकट करनेवाली तीखी ध्वनि को सूचित कर सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הָעִיר הָעַלִּיזָה
  choice: उल्लसित नगरी
  rationale: ‘नगरी’ शहर के स्त्रीलिंग मानवीकरण को बनाए रखती है और ‘उल्लसित’ आनन्द तथा आत्मतुष्ट उत्सव के भाव को स्वाभाविक, गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: הַיּוֹשֶׁבֶת לָבֶטַח
  choice: निश्चिंत होकर बसी थी
  rationale: यह निरंतर सुरक्षित और बेफिक्र होकर बसे रहने की अवस्था को आधुनिक हिन्दी में व्यक्त करता है।
- source_word: הָאֹמְרָה בִּלְבָבָהּ
  choice: अपने मन में कहती थी
  rationale: यह भीतरी आत्मसंवाद का स्वाभाविक हिन्दी रूप है और नगरी के मानवीकरण को बनाए रखता है।
- source_word: אֲנִי וְאַפְסִי עוֹד
  choice: मैं ही हूँ, और मेरे सिवा कोई नहीं
  rationale: ‘ही’ नगर के अनन्य और अहंकारी आत्म-दावे को उभारता है तथा इब्रानी में अन्यत्र मिलने वाली अनन्यता की भाषा की विडंबनापूर्ण प्रतिध्वनि बनाए रखता है।
- source_word: לְשַׁמָּה
  choice: उजाड़
  rationale: यह विनाश और निर्जनता का व्यापक अर्थ स्पष्ट रूप से देता है; भयावह दृश्य या आतंक का संभावित भाव पादटिप्पणी में रखा गया है।
- source_word: מַרְבֵּץ לַחַיָּה
  choice: जंगली पशुओं के लेटने की जगह
  rationale: यह पशुओं के पड़े रहने या विश्राम करने के स्थान का ठोस अर्थ देता है, बिना उसे विशेष रूप से मांद ठहराए।
- source_word: יִשְׁרֹק
  choice: सीटी बजाएगा
  rationale: यह इब्रानी क्रिया से व्यक्त तीखी ध्वनि का स्वाभाविक हिन्दी रूप है; आश्चर्य या उपहास का सटीक भाव संदर्भ से आता है, जबकि ‘फुफकारेगा’ पादटिप्पणी में संरक्षित है।
- source_word: יָנִיעַ יָדוֹ
  choice: अपना हाथ हिलाएगा
  rationale: यह तिरस्कार या विस्मय की दृश्य मुद्रा को बनाए रखता है और संकेत की सटीक आकृति को आवश्यकता से अधिक निश्चित नहीं करता।
theological_decisions:
- issue: नगरी के दावे אֲנִי וְאַפְסִי עוֹד का अनुवाद
  choice: मैं ही हूँ, और मेरे सिवा कोई नहीं
  alternative: मैं हूँ, और मेरे अतिरिक्त कुछ भी नहीं
  rationale: चुना हुआ रूप परमेश्वर की अनन्यता के लिए अन्यत्र प्रयुक्त भाषा की जानबूझकर की गई प्रतिध्वनि को सुरक्षित रखता है, जिसे यहाँ घमंडी नगरी अपने लिए बोलती है; इस साहित्यिक और धर्मवैचारिक तनाव को स्पष्ट व्याख्या जोड़कर समाप्त नहीं किया गया।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की है। ‘नगरी’ और स्त्रीलिंग क्रियाओं से मूल का मानवीकरण सुरक्षित रखा गया है। शैली गरिमापूर्ण किंतु सहज है; दुर्लभ ‘सुसकारना’ जैसे पुराने शब्दों से बचा गया है।
