source:
  edition: WLC
  text: וְ/הִשְׁאַרְתִּ֣י בְ/קִרְבֵּ֔/ךְ עַ֥ם עָנִ֖י וָ/דָ֑ל וְ/חָס֖וּ בְּ/שֵׁ֥ם יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/zephaniah/003/012.yaml
  text: But I will leave in your midst a people humble and lowly[a], and they will take refuge in the name of Yahweh.
translation:
  language: hi
  text: परन्तु मैं तेरे बीच एक दीन और निर्धन[a] प्रजा को शेष रखूँगा, और वे यहोवा के नाम में शरण लेंगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “नम्र और दीन,” अथवा “पीड़ित और गरीब।” इब्रानी शब्द सामाजिक पीड़ा और गरीबी के साथ-साथ नम्रता, निर्बलता और निम्न दशा पर भी बल दे सकते हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִשְׁאַרְתִּי
  choice: परन्तु मैं...शेष रखूँगा
  rationale: हिफ़ील रूप किसी को बचे रहने देने या शेष रखने का भाव देता है। वाव मूलतः ‘और’ है, पर पिछले प्रसंग से विरोध दिखाने के लिए ‘परन्तु’ स्वाभाविक है।
- source_word: בְקִרְבֵּךְ
  choice: तेरे बीच
  rationale: स्त्रीलिंग एकवचन में संबोधित सिय्योन/यरूशलेम के भीतर या उसके समुदाय के बीच होने का स्थानबोध सुरक्षित रहता है।
- source_word: עַם
  choice: एक...प्रजा
  rationale: यहाँ शब्द राजनीतिक राष्ट्र से अधिक यहोवा से संबंधित सामूहिक समुदाय को दर्शाता है; ‘प्रजा’ इस भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: עָנִי וָדָל
  choice: दीन और निर्धन
  rationale: दोनों शब्द सामाजिक कष्ट, गरीबी, दुर्बलता और विनम्र निम्न दशा की परस्पर जुड़ी अर्थ-छायाएँ रखते हैं। ‘दीन और निर्धन’ मूल की ठोस सामाजिक स्थिति को बनाए रखता है और ‘दीन’ में विनम्रता/असहायता का भाव भी संभव रहने देता है।
- source_word: וְחָסוּ
  choice: और वे...शरण लेंगे
  rationale: חסה भरोसा करने के साथ सुरक्षा के लिए आश्रय लेने का रूपक व्यक्त करता है; ‘शरण लेंगे’ उस चित्र को बनाए रखता है।
- source_word: בְּשֵׁם
  choice: के नाम में
  rationale: यह अभिव्यक्ति परमेश्वर के प्रकट चरित्र और अधिकार पर आश्रित होने को बताती है और मूल पूर्वसर्ग के निकट रहती है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिन्दी में प्रचलित व्यक्तिगत नाम ‘यहोवा’ चतुरक्षरीय दिव्य नाम को किसी उपाधि से बदलने के बजाय नाम के रूप में प्रस्तुत करता है।
theological_decisions:
- issue: शेष प्रजा के लिए עָנִי וָדָל का अर्थ
  choice: ‘दीन और निर्धन’ रखा गया, साथ में वैकल्पिक अर्थों की पादटिप्पणी।
  alternative: ‘नम्र और दीन’ अथवा ‘पीड़ित और गरीब’।
  rationale: मूल शब्द सामाजिक पीड़ा और गरीबी के साथ नम्र, निर्बल तथा आश्रित दशा भी सूचित कर सकते हैं। अगला खंड यहोवा में शरण लेने की मुद्रा दिखाता है, पर उससे आर्थिक-सामाजिक अर्थ को मिटाना उचित नहीं; पादटिप्पणी वास्तविक बहुअर्थकता सुरक्षित रखती है।
- issue: יְהוָה का हिन्दी रूप
  choice: यहोवा
  alternative: याहवे अथवा ‘प्रभु’।
  rationale: ‘यहोवा’ आधुनिक हिन्दी बाइबलीय प्रयोग में व्यापक रूप से पहचाना जाने वाला नाम-रूप है और मूल में उपस्थित व्यक्तिगत दिव्य नाम को उपाधि से प्रतिस्थापित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण बाइबलीय गद्य अपनाया गया है। सिय्योन/यरूशलेम को स्त्रीलिंग एकवचन संबोधन के कारण ‘तेरे’ रखा गया है। ‘शेष रखूँगा’ अवशेष-विषयक भाव और दिव्य कर्तृत्व दोनों को स्पष्ट करता है।
