  text: יְהוָ֤ה צַדִּיק֙ בְּ/קִרְבָּ֔/הּ לֹ֥א יַעֲשֶׂ֖ה עַוְלָ֑ה בַּ/בֹּ֨קֶר בַּ/בֹּ֜קֶר מִשְׁפָּט֨/וֹ יִתֵּ֤ן לָ/אוֹר֙ לֹ֣א נֶעְדָּ֔ר וְ/לֹֽא יוֹדֵ֥עַ עַוָּ֖ל בֹּֽשֶׁת־׃
base_translation:
  language: en
  yaml_path: translation/ot/zephaniah/003/005.yaml
  text: Yahweh is righteous in her midst; he does no injustice[a]. Morning by morning he brings his justice to light; it does not fail. But the unjust knows no shame.
translation:
  language: hi
  text: याहवे उसके बीच में धर्मी है; वह कोई अन्याय नहीं करता। हर सुबह वह अपना न्याय उजाले में लाता है[a]; उसमें कोई कमी नहीं होती। फिर भी अन्यायी लज्जा नहीं जानता।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अपना निर्णय उजाले में लाता है।”
    reason: מִשְׁפָּטוֹ के ‘न्याय’ और ‘निर्णय’ दोनों अर्थ संभव हैं।
lexical_decisions:
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के प्रकट किए हुए व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय देवनागरी में लिप्यंतरित किया गया है।
- source_word: צַדִּיק
  choice: धर्मी
  rationale: यह विधेयात्मक विशेषण याहवे के नैतिक और न्यायपूर्ण चरित्र को व्यक्त करता है; ‘धर्मी’ इसके व्यापक अर्थ को बनाए रखता है।
- source_word: בְּקִרְבָּהּ
  choice: उसके बीच में
  rationale: स्त्रीलिंग प्रत्यय नगर, अर्थात व्यक्तिरूप में प्रस्तुत यरूशलेम, की ओर संकेत करता है; हिन्दी में ‘उसके’ स्वाभाविक है, यद्यपि व्याकरणिक लिंग स्पष्ट नहीं करता।
- source_word: לֹא יַעֲשֶׂה עַוְלָה
  choice: वह कोई अन्याय नहीं करता
  rationale: यह वाक्यांश याहवे के कार्यों में अन्याय के पूर्ण अभाव को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: בַּבֹּקֶר בַּבֹּקֶר
  choice: हर सुबह
  rationale: इब्रानी पुनरुक्ति नियमित और निरंतर घटने वाली क्रिया बताती है; ‘हर सुबह’ हिन्दी का सहज वितरणात्मक प्रयोग है।
- source_word: מִשְׁפָּטוֹ
  choice: अपना न्याय
  rationale: संदर्भ में यह याहवे की न्यायपूर्ण न्यायिक कार्रवाई है और धर्म तथा अन्याय के बीच पद के विरोध को बनाए रखती है; ‘निर्णय’ भी संभव है।
- source_word: יִתֵּן לָאוֹר
  choice: उजाले में लाता है
  rationale: शाब्दिक रूप से ‘उजाले को देता है’; यह किसी बात को प्रकट करने का चित्रात्मक मुहावरा है, जिसे हिन्दी में इसी बिंब के साथ व्यक्त किया गया है।
- source_word: לֹא נֶעְדָּר
  choice: वह कभी अनुपस्थित नहीं होता
  rationale: निफ़अल रूप का मूल भाव ‘अनुपस्थित या नदारद होना’ है। यह अनुवाद न्याय के प्रतिदिन प्रकट होने में किसी चूक या अभाव को दर्शाता है।
- source_word: וְלֹא יוֹדֵעַ עַוָּל בֹּשֶׁת
  choice: फिर भी अन्यायी लज्जा नहीं जानता
  rationale: संयोजक को संदर्भगत विरोध के रूप में व्यक्त किया गया है; ‘लज्जा नहीं जानता’ इब्रानी मुहावरे और उसकी तीक्ष्णता को बनाए रखता है।
theological_decisions:
- issue: בְּקִרְבָּהּ के स्त्रीलिंग प्रत्यय का संदर्भ
  choice: ‘उसके बीच में’, जहाँ संदर्भ व्यक्तिरूप में प्रस्तुत नगर यरूशलेम का है
  alternative: ‘उस नगर के बीच में’
  rationale: मूल पाठ स्त्रीलिंग नगर की ओर लौटता है। हिन्दी सर्वनाम में लिंग दिखाई नहीं देता, पर ‘उसके बीच में’ संदर्भगत व्यक्तिरूपण को यथासंभव स्वाभाविक ढंग से बनाए रखता है।
- issue: מִשְׁפָּטוֹ का अर्थ
  choice: अपना न्याय
  alternative: अपना निर्णय
  rationale: पद याहवे की धार्मिकता और अन्याय न करने पर बल देता है, इसलिए ‘न्याय’ विषयगत विरोध को अधिक अच्छी तरह बनाए रखता है; न्यायिक ‘निर्णय’ एक वास्तविक वैकल्पिक अर्थ है और पादटिप्पणी में दिया गया है।
- issue: לֹא נֶעְדָּר का कर्ता
  choice: याहवे का न्याय कभी अनुपस्थित नहीं होता
  alternative: वह अर्थात याहवे कभी चूकता नहीं
  rationale: निकटतम व्याकरणिक और अर्थगत संदर्भ ‘उसका न्याय’ है, किंतु इब्रानी में निहित कर्ता के स्तर पर कुछ संक्षिप्तता बनी हुई है। चुना गया पाठ न्याय के प्रतिदिन प्रकट होने को केंद्र में रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण पर सामान्य पाठक के लिए सुबोध। ‘याहवे’ नाम को सुरक्षित रखा गया है। इब्रानी पुनरुक्ति को सहज हिन्दी ‘हर सुबह’ से व्यक्त किया गया है और पद के न्याय/अन्याय संबंधी शब्द-संबंध को बनाए रखा गया है।
