source:
  edition: WLC
  text: שְׁאֵרִ֨ית יִשְׂרָאֵ֜ל לֹֽא יַעֲשׂ֤וּ עַוְלָה֙ וְ/לֹא יְדַבְּר֣וּ כָזָ֔ב וְ/לֹֽא יִמָּצֵ֥א בְּ/פִי/הֶ֖ם לְשׁ֣וֹן תַּרְמִ֑ית כִּֽי הֵ֛מָּה יִרְע֥וּ וְ/רָבְצ֖וּ וְ/אֵ֥ין מַחֲרִֽיד־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/zephaniah/003/013.yaml
  text: The remnant of Israel will do no wrong and speak no lies[a], and no deceitful tongue will be found in their mouth; for they will graze and lie down[b], with no one to make them afraid.
translation:
  language: hi
  text: इस्राएल के बचे हुए लोग न तो अन्याय करेंगे, न झूठ बोलेंगे, और न उनके मुँह में छल भरी वाणी पाई जाएगी[a]; क्योंकि वे चरेंगे और लेटेंगे[b], और उन्हें डराने वाला कोई न होगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “उनके मुँह में छल की जीभ नहीं पाई जाएगी।” यह कपटपूर्ण वाणी के लिए एक इब्रानी मुहावरा है।
    reason: मूल के ठोस मुहावरे और उसके निषेध को सुरक्षित रखते हुए मुख्य पाठ की स्वाभाविक हिन्दी को स्पष्ट करता है।
  - marker: b
    text: 'यह चरवाही का बिंब है: वे ऐसे झुंड के समान चरेंगे और लेटेंगे जो पूरी सुरक्षा में रहता है।'
    reason: मूल की पशुपालक-सांस्कृतिक छवि और सुरक्षा के निहित भाव को स्पष्ट करता है।
lexical_decisions:
- source_word: שְׁאֵרִית יִשְׂרָאֵל
  choice: इस्राएल के बचे हुए लोग
  rationale: यह पदबंध भविष्यद्वक्ताओं में सुरक्षित बचे हुए समुदाय को दर्शाता है। यह अनुवाद ‘शेष’ की धारणा को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: יַעֲשׂוּ עַוְלָה
  choice: अन्याय करेंगे
  rationale: עַוְלָה में गलत काम, अधर्म और अन्याय का व्यापक नैतिक भाव है। ‘अन्याय’ संक्षिप्त और गरिमापूर्ण है तथा अर्थ को केवल किसी विशेष अपराध तक सीमित नहीं करता।
- source_word: יְדַבְּרוּ כָזָב
  choice: झूठ बोलेंगे
  rationale: כזב का सीधा अर्थ झूठ या मिथ्या है; ‘झूठ बोलना’ हिन्दी में सहज और स्पष्ट अभिव्यक्ति है।
- source_word: לְשׁוֹן תַּרְמִית
  choice: छल की कोई बात
  rationale: शाब्दिक ‘छल की जीभ’ कपटपूर्ण वाणी का इब्रानी मुहावरा है। मुख्य पाठ में इसका स्वाभाविक अर्थ दिया गया है, जबकि पाद-टिप्पणी मूल बिंब को सुरक्षित रखती है।
- source_word: יִרְעוּ וְרָבְצוּ
  choice: चरेंगे और लेटेंगे
  rationale: दोनों क्रियाएँ झुंड का चरवाही-संबंधी बिंब बनाती हैं। इन्हें अमूर्त ‘शान्ति से रहेंगे’ में बदलने के बजाय मूल दृश्य बनाए रखा गया है।
- source_word: אֵין מַחֲרִיד
  choice: उन्हें डराने वाला कोई न होगा
  rationale: मूल में भय उत्पन्न करने वाले कर्ता का अभाव बताया गया है। यह हिन्दी अभिव्यक्ति उसी आशय को स्वाभाविक ढंग से देती है।
theological_decisions:
- issue: चरवाही का बिंब
  choice: ‘चरेंगे और लेटेंगे’ के रूप में ठोस बिंब बनाए रखा गया।
  alternative: ‘वे चैन से खाएँगे और विश्राम करेंगे’ अथवा ‘वे सुरक्षित रहेंगे।’
  rationale: इब्रानी क्रियाएँ पशुओं, विशेषकर झुंड, के चरने और लेटने का दृश्य उपस्थित करती हैं। यही बिंब सुरक्षा और वाचा-सम्बन्धी शान्ति का संकेत देता है; इसे बनाए रखने से पाठ में कोई अतिरिक्त सैद्धान्तिक निष्कर्ष नहीं जोड़ा जाता।
- issue: ‘बचे हुए’ समुदाय की पहचान
  choice: שְׁאֵרִית को ‘बचे हुए लोग’ कहा गया।
  alternative: ‘शेष भाग’ अथवा ‘जीवित बचे लोग।’
  rationale: मूल शब्द इस्राएल के उस समुदाय को दर्शाता है जो बचा रहता है। ‘बचे हुए लोग’ स्थापित भविष्यद्वाणी-संबंधी अर्थ को सहज हिन्दी में रखता है, बिना यह तय किए कि बाद की किसी धार्मिक व्याख्या में इस समुदाय की पहचान क्या है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, सरल किन्तु गरिमापूर्ण रखी गई है। समानान्तर नकारात्मक खंडों के लिए ‘न तो…न…और न…’ का प्रयोग किया गया है। ‘चरेंगे और लेटेंगे’ कुछ ठोस सुनाई देता है, पर मूल के जानबूझकर प्रयुक्त चरवाही-बिंब को सुरक्षित रखने के लिए इसे बनाए रखा गया है।
