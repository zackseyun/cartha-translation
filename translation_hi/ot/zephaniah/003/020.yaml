base_translation:
  language: en
  yaml_path: translation/ot/zephaniah/003/020.yaml
  text: At that time I will bring you in[a], and at that time I will gather you; for I will make you a name and a praise among all the peoples of the earth, when I restore your fortunes before your eyes, says Yahweh.
translation:
  language: hi
  text: उस समय मैं तुम्हें ले आऊँगा, और उस समय मैं तुम्हें इकट्ठा करूँगा; क्योंकि जब मैं तुम्हारी आँखों के सामने तुम्हारी दशा बहाल करूँगा, तब मैं पृथ्वी के सभी लोगों के बीच तुम्हें यश और प्रशंसा दिलाऊँगा—याहवे कहता है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בָּעֵת הַהִיא
  choice: उस समय
  rationale: भविष्य में परमेश्वर के प्रतिज्ञात कार्य का समय बताने वाला स्वाभाविक और निकट हिंदी रूप।
- source_word: אָבִיא אֶתְכֶם
  choice: मैं तुम्हें ले आऊँगा
  rationale: हिफ़ील रूप के ‘ले आना’ अर्थ को सुरक्षित रखता है; गंतव्य मूल पाठ में व्यक्त नहीं है, इसलिए उसे जोड़ा नहीं गया।
- source_word: וּבָעֵת קַבְּצִי אֶתְכֶם
  choice: और उस समय मैं तुम्हें इकट्ठा करूँगा
  rationale: दोहराए गए समय-सूचक वाक्यांश और परमेश्वर द्वारा एकत्र किए जाने की प्रतिज्ञा को सहज हिंदी में रखता है।
- source_word: כִּי
  choice: क्योंकि
  rationale: आगे के कथन को पहले की प्रतिज्ञा के आधार अथवा स्पष्टीकरण के रूप में प्रस्तुत करता है।
- source_word: אֶתֵּן אֶתְכֶם לְשֵׁם וְלִתְהִלָּה
  choice: तुम्हें यश और प्रशंसा दिलाऊँगा
  rationale: शाब्दिक ‘नाम और प्रशंसा के लिए दूँगा’ का स्वाभाविक हिंदी भाव है और प्रदत्त प्रतिष्ठा तथा सम्मान दोनों को व्यक्त करता है।
- source_word: בְּכֹל עַמֵּי הָאָרֶץ
  choice: पृथ्वी के सब लोगों के बीच
  rationale: עמים के बहुवचन और विश्वव्यापी संदर्भ को बनाए रखता है; ‘के बीच’ प्रतिष्ठा के सामाजिक संदर्भ के अनुकूल है।
- source_word: בְּשׁוּבִי אֶת שְׁבוּתֵיכֶם
  choice: जब मैं तुम्हारी दशा बहाल करूँगा
  rationale: हिब्रू पुनर्स्थापना-सूत्र का व्यापक अर्थ देता है, जिसमें निर्वासन या विपत्ति से उद्धार सम्मिलित हो सकता है, पर उसे केवल एक अर्थ तक सीमित नहीं करता।
- source_word: לְעֵינֵיכֶם
  choice: तुम्हारी आँखों के सामने
  rationale: प्रत्यक्ष और खुले रूप से देखी जाने वाली बहाली की जीवंत हिब्रू अभिव्यक्ति को सुरक्षित रखता है।
- source_word: אָמַר יְהוָה
  choice: यह याहवे का वचन है
  rationale: भविष्यवाणी के दैवी कथन-सूत्र को गरिमापूर्ण आधुनिक हिंदी में व्यक्त करता है और दिव्य नाम को नाम के रूप में रखता है।
theological_decisions:
- issue: दिव्य नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में वाचा का विशिष्ट दिव्य नाम है; लिप्यंतरण उसे सामान्य उपाधि में बदलने से बचाता है।
- issue: שׁוּב שְׁבוּת पुनर्स्थापना-सूत्र
  choice: तुम्हारी दशा बहाल करूँगा
  alternative: तुम्हारी बंधुआई लौटा दूँगा; तुम्हारे बंदियों को वापस ले आऊँगा
  rationale: हिब्रू पदबंध व्यापक पुनर्स्थापना, निर्वासन से वापसी या विपत्ति के पलटने का संकेत दे सकता है। मुख्य पाठ में सहज व्यापक अर्थ रखा गया और वास्तविक शाब्दिक विकल्प पादटिप्पणी में दिए गए।
translation_notes:
  register: आधुनिक मानक हिंदी, गरिमापूर्ण भविष्यवाणी-शैली और सामान्य पाठक के लिए सहज शब्दावली। एकवचन सामूहिक संबोधन के लिए ‘तुम’ के रूप रखे गए हैं। वाक्य-विन्यास हिब्रू समानांतरता को यथासंभव बनाए रखते हुए हिंदी में स्वाभाविक किया गया है।
