id: ZEP.3.6
reference: Zephaniah 3:6
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: הִכְרַ֣תִּי גוֹיִ֗ם נָשַׁ֨מּוּ֙ פִּנּוֹתָ֔/ם הֶחֱרַ֥בְתִּי חֽוּצוֹתָ֖/ם מִ/בְּלִ֣י עוֹבֵ֑ר נִצְדּ֧וּ עָרֵי/הֶ֛ם מִ/בְּלִי אִ֖ישׁ מֵ/אֵ֥ין יוֹשֵֽׁב־׃
base_translation:
  language: en
  yaml_path: translation/ot/zephaniah/003/006.yaml
  text: I have cut off nations[a]; their corner towers are laid waste. I have made their streets desolate, with no one passing through. Their cities are devastated, without a man[c][b], with no inhabitant.
translation:
  language: hi
  text: मैंने राष्ट्रों को नाश कर दिया है; उनके कोने के बुर्ज[a] उजाड़ पड़े हैं। मैंने उनकी सड़कों[b] को ऐसा वीरान कर दिया है कि वहाँ से कोई नहीं गुजरता। उनके नगर उजड़ गए हैं—न कोई मनुष्य[c], न कोई निवासी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक अर्थ “उनके कोने”; संभवतः नगर की कोनेवाली किलेबंदी या बुर्ज।
    reason: lexical_alternative
  - marker: b
    text: या “उनके चौक” अथवा “उनके खुले सार्वजनिक स्थान।”
    reason: lexical_alternative
  - marker: c
    text: इब्रानी में शाब्दिक रूप से “कोई पुरुष नहीं”; यहाँ यह पूर्ण निर्जनता बताने वाली अभिव्यक्ति है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הִכְרַתִּי
  choice: मैंने ... नाश कर दिया है
  rationale: हिफ़ईल रूप यहाँ राष्ट्रों को मिटा देने या नष्ट करने का भाव देता है। हिंदी में “नाश कर दिया है” स्वाभाविक है और पूर्ण क्रिया के वर्तमान परिणाम को व्यक्त करता है।
- source_word: גוֹיִם
  choice: राष्ट्रों
  rationale: यह शब्द राजनीतिक-सामुदायिक इकाइयों के अर्थ में आया है; “राष्ट्र” आधुनिक मानक हिंदी में उपयुक्त है।
- source_word: נָשַׁמּוּ פִּנּוֹתָם
  choice: उनके कोने के बुर्ज उजाड़ पड़े हैं
  rationale: נָשַׁמּוּ उजाड़ होने की परिणामी अवस्था बताता है। פִּנּוֹתָם का शाब्दिक अर्थ “उनके कोने” है, पर नगर-विनाश के प्रसंग में कोने की किलेबंदी या बुर्ज संभावित है; इस अनिश्चितता को पादटिप्पणी में रखा गया है।
- source_word: הֶחֱרַבְתִּי חוּצוֹתָם
  choice: मैंने उनकी सड़कों को ... वीरान कर दिया है
  rationale: הֶחֱרַבְתִּי उजाड़ या निर्जन कर देने को और חוּצוֹתָם नगर के बाहरी सार्वजनिक स्थानों, गलियों या सड़कों को सूचित करता है। मुख्य पाठ में “सड़कें” सर्वाधिक सहज है।
- source_word: מִבְּלִי עוֹבֵר
  choice: कि वहाँ से कोई नहीं गुजरता
  rationale: यह निरंतर मानवीय आवागमन के पूर्ण अभाव को स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: נִצְדּוּ עָרֵיהֶם
  choice: उनके नगर उजड़ गए हैं
  rationale: दुर्लभ क्रिया נִצְדּוּ का संदर्भगत अर्थ नगरों की बरबादी या उजाड़ अवस्था है। “उजड़ गए हैं” अनावश्यक झूठी सटीकता से बचता है।
- source_word: מִבְּלִי אִישׁ
  choice: न कोई मनुष्य
  rationale: אִישׁ व्याकरणतः पुल्लिंग एकवचन है, किंतु इस निर्जनीकरण-सूत्र में किसी भी मानव की अनुपस्थिति बताता है। “मनुष्य” मूल संज्ञा का मानवीय बोध रखता है और हिंदी में पूरे आशय को स्पष्ट करता है।
- source_word: מֵאֵין יוֹשֵׁב
  choice: न कोई निवासी
  rationale: यह पिछली अभिव्यक्ति को तीव्र करते हुए बताता है कि वहाँ रहने वाला कोई भी नहीं बचा।
theological_decisions:
- issue: निर्जनीकरण-सूत्र में אִישׁ का लिंग और व्यापक आशय
  choice: न कोई मनुष्य
  alternative: न कोई पुरुष / वहाँ कोई नहीं
  rationale: शब्द पुल्लिंग एकवचन है, पर समानांतर “न कोई निवासी” से स्पष्ट है कि आशय केवल पुरुषों का अभाव नहीं, बल्कि पूर्ण निर्जनता है। “मनुष्य” रूप और प्रसंग दोनों के बीच संतुलन रखता है; पादटिप्पणी शाब्दिक रूप बताती है।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण, स्पष्ट और काव्यात्मक गद्य रखा गया है। समानांतर वाक्यरचना और क्रमशः बढ़ती निर्जनता को सुरक्षित रखा गया है। “कोने के बुर्ज” और “सड़कें” मुख्य पाठ में पठनीय विकल्प हैं, जबकि वास्तविक शाब्दिक अनिश्चितताएँ पादटिप्पणियों में दी गई हैं।
