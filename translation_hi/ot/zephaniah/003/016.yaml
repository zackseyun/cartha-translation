  text: בַּ/יּ֣וֹם הַ/ה֔וּא יֵאָמֵ֥ר לִ/ירֽוּשָׁלִַ֖ם אַל תִּירָ֑אִי צִיּ֖וֹן אַל יִרְפּ֥וּ יָדָֽיִ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zephaniah/003/016.yaml
  text: On that day it will be said to Jerusalem[a], “Do not fear”; to Zion, “Do not let your hands grow weak.”
translation:
  language: hi
  text: उस दिन यरूशलेम से कहा जाएगा, “मत डर!” और सिय्योन से, “तेरे हाथ ढीले न पड़ें।”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तेरे हाथ लटक न जाएँ” अथवा “तेरे हाथ शिथिल न हों।” यह इब्रानी मुहावरा शक्ति, संकल्प या साहस खो देने की ओर संकेत करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיּוֹם הַהוּא
  choice: उस दिन
  rationale: यह भविष्यसूचक समय-संदर्भ का स्वाभाविक और सीधा आधुनिक हिन्दी रूप है।
- source_word: יֵאָמֵר
  choice: कहा जाएगा
  rationale: निफ़अल अपूर्ण रूप के अनिर्दिष्ट वक्ता को निष्क्रिय प्रयोग द्वारा सुरक्षित रखा गया है।
- source_word: לִירוּשָׁלִַם
  choice: यरूशलेम से
  rationale: ל यहाँ कथन की सम्बोधित इकाई को दर्शाता है; हिन्दी में ‘यरूशलेम से कहा जाएगा’ स्वाभाविक है और नगर को प्रत्यक्ष सम्बोधन बनाए रखता है।
- source_word: אַל תִּירָאִי
  choice: मत डर
  rationale: स्त्रीलिंग एकवचन सम्बोधन की निषेधात्मक आज्ञा को संक्षिप्त और स्वाभाविक रूप में रखा गया है।
- source_word: צִיּוֹן
  choice: और सिय्योन से
  rationale: मूल में स्पष्ट पूर्वसर्ग नहीं है, पर समानांतर रचना में सिय्योन भी सम्बोधित है। ‘और ... से’ हिन्दी में यह सम्बन्ध स्पष्ट करता है।
- source_word: אַל יִרְפּוּ יָדָיִךְ
  choice: तेरे हाथ ढीले न पड़ें
  rationale: हाथों के ढीले पड़ने की इब्रानी छवि और साहस, शक्ति या संकल्प खोने का मुहावरेदार भाव—दोनों सुरक्षित रहते हैं।
theological_decisions:
- issue: यरूशलेम और सिय्योन का स्त्रीलिंग एकवचन में मानवीकरण
  choice: नगरों को सीधे सम्बोधित करते हुए मानवीकरण बनाए रखा गया है।
  alternative: इसे ‘यरूशलेम/सिय्योन के लोगों’ के लिए स्पष्ट करके लिखा जा सकता था।
  rationale: मूल पाठ स्वयं नगरों को स्त्रीलिंग एकवचन में सम्बोधित करता है; ‘लोगों’ को जोड़ना अनावश्यक व्याख्यात्मक विस्तार होता।
- issue: ढीले हाथों की छवि का अर्थ
  choice: शारीरिक छवि को रखते हुए ‘तेरे हाथ ढीले न पड़ें’ कहा गया है।
  alternative: अर्थ को खोलकर ‘हिम्मत मत हार’ या ‘तेरा साहस कम न हो’ कहा जा सकता था।
  rationale: मूल रूपक को बनाए रखने से शक्ति, संकल्प और साहस—इन सभी सम्भावित अर्थ-छटाओं का तनाव सुरक्षित रहता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और प्रत्यक्ष भविष्यसूचक सम्बोधन। ‘मत डर’ तथा ‘तेरे हाथ’ नगरों के स्त्रीलिंग एकवचन मानवीकरण को स्वाभाविक हिन्दी में बनाए रखते हैं।
