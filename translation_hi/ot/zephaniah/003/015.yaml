source:
  edition: WLC
  text: הֵסִ֤יר יְהוָה֙ מִשְׁפָּטַ֔יִ/ךְ פִּנָּ֖ה אֹֽיְבֵ֑/ךְ מֶ֣לֶךְ יִשְׂרָאֵ֤ל יְהוָה֙ בְּ/קִרְבֵּ֔/ךְ לֹא תִֽירְאִ֥י רָ֖ע עֽוֹד׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/zephaniah/003/015.yaml
  text: Yahweh has taken away your judgments[a]; he has turned away your enemy. The King of Israel, Yahweh, is in your midst[b]; you will fear evil no more.
translation:
  language: hi
  text: 'याहवे ने तेरे न्याय-निर्णयों[a] को हटा दिया है;

    उसने तेरे शत्रु को दूर कर दिया है।


    इस्राएल का राजा याहवे तेरे बीच में है;

    अब तू फिर किसी बुराई[b] से नहीं डरेगी।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “तेरे न्याय-निर्णयों”; प्रसंग में इसका अर्थ “तेरे विरुद्ध दिए गए निर्णय” या “तेरा दण्डादेश” हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: यहाँ “बुराई” का अर्थ “विपत्ति,” “अनिष्ट” या “संकट” भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵסִיר
  choice: हटा दिया है
  rationale: सूर के हिफ़ील रूप का अर्थ किसी वस्तु को दूर करना या हटा देना है। पूर्ण हो चुकी उद्धारकारी कार्रवाई की भविष्यद्वाणी-संबंधी घोषणा को हिन्दी में पूर्ण वर्तमान से स्वाभाविक रूप से व्यक्त किया गया है।
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत वाचा-नाम को किसी उपाधि से बदलने के बजाय देवनागरी में लिप्यंतरित किया गया है।
- source_word: מִשְׁפָּטַיִךְ
  choice: तेरे विरुद्ध के न्याय-निर्णयों
  rationale: מִשְׁפָּט न्याय, न्यायिक निर्णय या दण्डादेश का बोध करा सकता है। सिय्योन की पुनर्स्थापना के प्रसंग में ये उसके विरुद्ध ठहरे न्यायिक निर्णय हैं; यह रूप हिन्दी में अभिप्राय स्पष्ट करता है, जबकि पादटिप्पणी अधिक संक्षिप्त विकल्प देती है।
- source_word: פִּנָּה
  choice: दूर कर दिया है
  rationale: क्रिया मोड़ देने, हटा देने या मार्ग से साफ़ कर देने का भाव रखती है। शत्रु के संबंध में ‘दूर कर दिया’ स्वाभाविक और प्रसंगानुकूल है।
- source_word: אֹיְבֵךְ
  choice: तेरे शत्रु
  rationale: इब्रानी पाठ में संज्ञा एकवचन है; वह सामूहिक अर्थ रख सकती है, फिर भी अनुवाद में एकवचन बनाए रखा गया है।
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: इस्राएल का राजा
  rationale: सम्बन्धवाचक पदबंध को परमेश्वर की राजकीय उपाधि के रूप में सीधे और स्वाभाविक ढंग से प्रस्तुत किया गया है।
- source_word: בְּקִרְבֵּךְ
  choice: तेरे बीच में
  rationale: यह वाचा-संबंधी उपस्थिति का परिचित स्थानवाचक कथन है और हिन्दी में ‘तेरे बीच में’ उसका स्थानीय तथा धार्मिक दोनों भाव बनाए रखता है।
- source_word: לֹא תִירְאִי
  choice: तू ... नहीं डरेगी
  rationale: द्वितीय पुरुष स्त्रीलिंग एकवचन को सुरक्षित रखा गया है, क्योंकि संबोधन सिय्योन से है। अपूर्ण क्रिया को इस घोषणा के परिणामस्वरूप भविष्यकाल में व्यक्त किया गया है।
- source_word: רָע
  choice: बुराई
  rationale: רָע नैतिक बुराई के साथ हानि, अनिष्ट या विपत्ति भी दर्शा सकता है। मुख्य पाठ में व्यापक शब्द रखा गया है और प्रसंगानुकूल अर्थ पादटिप्पणी में दिया गया है।
- source_word: עוֹד
  choice: अब ... फिर
  rationale: निषेध के साथ עוֹד का अर्थ ‘अब फिर नहीं’ या ‘अब और नहीं’ है; चुना हुआ रूप आधुनिक हिन्दी में सहज है।
theological_decisions:
- issue: परमेश्वर के नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा
  rationale: पाठ में वाचा-नाम सीधे आया है। किसी सामान्य उपाधि से उसे बदलने के बजाय ‘याहवे’ उसके नाम को सुरक्षित रखता है।
- issue: उद्धार की घोषणा में מִשְׁפָּטַיִךְ का आशय
  choice: तेरे विरुद्ध के न्याय-निर्णयों
  alternative: तेरे न्याय-निर्णयों; तेरा दण्डादेश
  rationale: संज्ञा का अर्थ केवल दण्ड नहीं, न्यायिक निर्णय भी हो सकता है; फिर भी प्रसंग में सिय्योन के विरुद्ध निर्णयों का हटाया जाना अभिप्रेत है। अनुवाद इस संबंध को स्पष्ट करता है, और पादटिप्पणी शाब्दिक तथा न्यायिक विकल्प सुरक्षित रखती है।
- issue: अंतिम उपवाक्य में רָע का अर्थ
  choice: बुराई
  alternative: विपत्ति; अनिष्ट; संकट
  rationale: इब्रानी शब्द नैतिक बुराई और अनुभव की जाने वाली विपत्ति—दोनों अर्थों की गुंजाइश रखता है। व्यापक अर्थ मुख्य पाठ में रखा गया है और संभावित प्रसंगानुकूल अर्थ पादटिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सहज रूप अपनाया गया है। मूल संबोधन स्त्रीलिंग एकवचन है, इसलिए ‘तेरे’ और ‘डरेगी’ रखा गया है। समानांतर काव्य-पंक्तियों और पूर्ण हो चुकी उद्धारकारी कार्रवाइयों की घोषणा को बनाए रखा गया है।
