base_translation:
  language: en
  yaml_path: translation/ot/zephaniah/003/002.yaml
  text: She did not obey the voice[a]; she did not accept correction. She did not trust in Yahweh[d][c][b]; she did not draw near to her God.
translation:
  language: hi
  text: उसने वाणी नहीं मानी[a]; उसने सुधार स्वीकार नहीं किया[b]। उसने याहवे[c] पर भरोसा नहीं रखा; वह अपने परमेश्वर के निकट नहीं आई[d]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उसने वाणी नहीं सुनी” अथवा “उसने वाणी पर ध्यान नहीं दिया।” इब्रानी मुहावरे में आज्ञापूर्वक सुनने का भाव हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या “उसने अनुशासन ग्रहण नहीं किया” अथवा “उसने शिक्षा स्वीकार नहीं की।”
    reason: lexical_alternative
  - marker: c
    text: इब्रानी में YHWH, अर्थात परमेश्वर का व्यक्तिगत नाम; यहाँ इसे “याहवे” रूप में प्रस्तुत किया गया है।
    reason: alternative_reading
  - marker: d
    text: या “वह अपने परमेश्वर के पास नहीं आई।” “निकट आना” संबंध और उपासना—दोनों की ओर संकेत कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁמְעָה בְּקוֹל
  choice: वाणी नहीं मानी
  rationale: שׁמע בְּקוֹל केवल सुनने नहीं, बल्कि आज्ञापूर्वक ध्यान देने का भाव रखता है। ‘वाणी नहीं मानी’ इस मुहावरे का स्वाभाविक हिन्दी रूप है और वक्ता को अनावश्यक रूप से स्पष्ट नहीं करता।
- source_word: לָקְחָה מוּסָר
  choice: सुधार स्वीकार नहीं किया
  rationale: यह पदबंध अनुशासनात्मक शिक्षा या सुधार को ग्रहण करने का अर्थ देता है। ‘सुधार स्वीकार करना’ आधुनिक हिन्दी में स्पष्ट है और नैतिक ताड़ना के प्रसंग के अनुकूल है।
- source_word: בַּיהוָה לֹא בָטָחָה
  choice: यहोवा पर भरोसा नहीं रखा
  rationale: בטח विश्वास और निर्भरता व्यक्त करता है; בְּ भरोसे के आश्रय को चिह्नित करता है। ‘पर भरोसा रखना’ स्वाभाविक हिन्दी है। दिव्य नाम को व्यक्तिवाचक नाम ‘यहोवा’ के रूप में रखा गया है।
- source_word: אֱלֹהֶיהָ
  choice: अपने परमेश्वर
  rationale: यहाँ אֱלֹהִים का रूप संदर्भ और एकवचन संबंधसूचक प्रत्यय के साथ इस्राएल/यरूशलेम के परमेश्वर को सूचित करता है; ‘अपने’ हिन्दी में कर्ता के साथ संबंध को स्वाभाविक रूप से व्यक्त करता है।
- source_word: קָרֵבָה
  choice: निकट नहीं आई
  rationale: קרב पास आने या पहुँचने का अर्थ देता है और यहाँ परमेश्वर से संबंध तथा उपासना—दोनों की छाया हो सकती है। ‘निकट आना’ इस व्यापकता को बनाए रखता है।
theological_decisions:
- issue: स्त्रीलिंग एकवचन कर्ता का संदर्भ
  choice: ‘उसने/वह’ रखकर इस पद में पूर्वपद का नाम स्पष्ट नहीं किया गया।
  alternative: ‘यरूशलेम ने’ या ‘नगर ने’ जोड़ना।
  rationale: इब्रानी क्रियाएँ स्त्रीलिंग एकवचन हैं और पिछले संदर्भ के नगर की ओर संकेत करती हैं। सर्वनाम साहित्यिक मानवीकरण को बनाए रखता है और इस पद में अनुपस्थित संज्ञा नहीं जोड़ता।
- issue: दिव्य नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: याहवे या प्रभु
  rationale: मूल पाठ में चार-अक्षरीय दिव्य नाम सीधे आया है। ‘यहोवा’ आधुनिक हिन्दी बाइबलीय प्रयोग में व्यापक रूप से पहचाना जाने वाला नामरूप है; पादटिप्पणी मूल व्यंजन YHWH और वैकल्पिक उच्चारण ‘याहवे’ बताती है।
- issue: परमेश्वर के निकट आने का आशय
  choice: ऐसी अभिव्यक्ति रखी गई जो संबंधपरक और उपासनात्मक दोनों आशयों को खुला छोड़ती है।
  alternative: इसे केवल ‘उसने उपासना नहीं की’ या केवल ‘उसने संबंध नहीं रखा’ कहना।
  rationale: קרב का संदर्भ दोनों प्रकार की छाया दे सकता है; किसी एक आशय तक सीमित करना मूल की सार्थक अस्पष्टता मिटा देता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। चार समानांतर नकारात्मक कथनों की भविष्यद्वक्ताई लय बनाए रखी गई है। स्त्रीलिंग नगर-मानवीकरण को ‘उसने/वह’ से सुरक्षित रखा गया है।
