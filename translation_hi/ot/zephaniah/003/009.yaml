source:
  edition: WLC
  text: כִּֽי אָ֛ז אֶהְפֹּ֥ךְ אֶל עַמִּ֖ים שָׂפָ֣ה בְרוּרָ֑ה לִ/קְרֹ֤א כֻלָּ/ם֙ בְּ/שֵׁ֣ם יְהוָ֔ה לְ/עָבְד֖/וֹ שְׁכֶ֥ם אֶחָֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zephaniah/003/009.yaml
  text: For then I will change the speech of the peoples to a pure speech[c][b][a], so that all of them may call on the name of Yahweh and serve him with one accord.
translation:
  language: hi
  text: क्योंकि तब मैं लोगों की वाणी को शुद्ध कर दूँगा,[a] ताकि वे सब याहवे[b] का नाम पुकारें और एकजुट होकर[c] उसकी सेवा करें।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से, “मैं लोगों को एक शुद्ध होंठ दूँगा/फेर दूँगा।” इसका अर्थ लोगों की वाणी या होंठ शुद्ध करना अथवा उन्हें शुद्ध भाषा देना हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: “याहवे” इब्रानी के ईश्वरीय नाम יהוה (YHWH) का लिप्यंतरण है; परंपरागत रूप से “यहोवा” भी कहा गया है।
    reason: alternative_reading
  - marker: c
    text: इब्रानी में शाब्दिक रूप से, “एक कंधे से”; अर्थात मिलकर या कंधे से कंधा मिलाकर।
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶהְפֹּךְ
  choice: बदलकर ... कर दूँगा
  rationale: הפך का मूल अर्थ पलटना या बदलना है। इस प्रसंग में यह वाणी को एक नई, शुद्ध दशा में लाने की परमेश्वर की क्रिया बताता है; इसका अर्थ विनाश या लोगों का आंतरिक धर्म-परिवर्तन मानना आवश्यक नहीं है।
- source_word: עַמִּים
  choice: लोगों
  rationale: बहुवचन עמים अनेक जनसमूहों को समेटता है। हिन्दी में ‘लोगों’ स्वाभाविक है और ‘राष्ट्रों’ की अपेक्षा राजनीतिक अर्थ को अनावश्यक रूप से प्रमुख नहीं बनाता।
- source_word: שָׂפָה בְרוּרָה
  choice: वाणी ... शुद्ध
  rationale: שׂפה का शाब्दिक अर्थ ‘होंठ’ है, पर यहाँ वह वाणी या भाषा का लक्षणार्थक संकेत है। ברורה शुद्ध या निर्मल होने का भाव देता है। ‘शुद्ध वाणी’ उपासना से जुड़े नैतिक-धार्मिक भाव को बनाए रखती है, जबकि केवल किसी एक ऐतिहासिक भाषा की पुनर्स्थापना का दावा नहीं करती।
- source_word: לִקְרֹא ... בְּשֵׁם יְהוָה
  choice: याहवे का नाम पुकारें
  rationale: नाम के साथ קרא का अर्थ सहायता या उपासना में नाम लेना अथवा पुकारना है। ‘नाम पुकारना’ हिन्दी में इस बाइबलीय भाव को सहज रूप से व्यक्त करता है।
- source_word: לְעָבְדוֹ
  choice: उसकी सेवा करें
  rationale: עבד में सेवा और उपासना दोनों का भाव हो सकता है। ‘सेवा करें’ इसके व्यापक वाचाई अर्थ को रखता है और इसे केवल धार्मिक अनुष्ठान तक सीमित नहीं करता।
- source_word: שְׁכֶם אֶחָד
  choice: एकजुट होकर
  rationale: इसका शाब्दिक रूप ‘एक कंधे से’ है और यह मिलकर, एक उद्देश्य से सेवा करने का मुहावरा है। ‘एकजुट होकर’ आधुनिक हिन्दी में आशय स्पष्ट करता है; मूल चित्र पाद-टिप्पणी में सुरक्षित है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का रूप
  choice: याहवे
  alternative: यहोवा; अथवा ‘यहोवा/प्रभु’ जैसी परंपरागत प्रतिस्थापन-प्रणाली
  rationale: मूल पाठ में सामान्य उपाधि नहीं, चार अक्षरों वाला विशिष्ट ईश्वरीय नाम יהוה है। ‘याहवे’ उसके व्यापक रूप से स्वीकृत उच्चारण का निकट हिन्दी लिप्यंतरण है; परंपरागत ‘यहोवा’ पाद-टिप्पणी में बताया गया है।
- issue: प्रतिज्ञात परिवर्तन का स्वरूप
  choice: लोगों की वाणी बदलकर शुद्ध करना
  alternative: लोगों के होंठ शुद्ध करना; लोगों को फिर से एक शुद्ध भाषा देना
  rationale: इब्रानी पदबंध शाब्दिक रूप से ‘शुद्ध होंठ’ कहता है और वाणी, होंठ या भाषा पर बल दे सकता है। मुख्य पाठ उपासना के लिए वाणी की शुद्धि व्यक्त करता है, पर किसी एक आदिम भाषा की बहाली निश्चित नहीं करता; अन्य संभावनाएँ पाद-टिप्पणी में रखी गई हैं।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। वाक्य में उद्देश्यसूचक ‘ताकि’ दोनों क्रियाओं—नाम पुकारने और सेवा करने—पर लागू होता है। ‘एकजुट होकर’ सामूहिक एकता को स्वाभाविक हिन्दी में व्यक्त करता है, और मूल ‘कंधे’ का चित्र पाद-टिप्पणी में सुरक्षित है।
