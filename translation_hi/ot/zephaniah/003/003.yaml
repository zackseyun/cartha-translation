base_translation:
  language: en
  yaml_path: translation/ot/zephaniah/003/003.yaml
  text: Her officials within her are roaring lions[a]; her judges are evening wolves that leave nothing for the morning.
translation:
  language: hi
  text: उसके भीतर के अधिकारी गरजते हुए सिंह हैं; उसके न्यायाधीश सांझ के भेड़िए हैं, जो भोर होने तक कुछ भी नहीं छोड़ते।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, अधिक शाब्दिक रूप में, “वे भोर तक एक हड्डी भी नहीं छोड़ते।” हिब्रू मुहावरा भूख से सब कुछ पूरी तरह चट कर जाने का चित्र प्रस्तुत करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׂרֶיהָ
  choice: उसके अधिकारी
  rationale: שַׂר शासक, प्रधान, राजकुमार या अधिकारी का बोध करा सकता है। यहाँ नगर के शासन-तंत्र की निंदा में ‘अधिकारी’ स्वाभाविक आधुनिक हिन्दी है और इसे केवल राजवंश के पुत्रों तक सीमित नहीं करता।
- source_word: בְקִרְבָּהּ
  choice: उसके भीतर
  rationale: यह पद नगर के मध्य या अंदर कार्यरत भ्रष्ट नेतृत्व को दर्शाता है; ‘उसके भीतर’ मूल स्थान-बोध को सहज हिन्दी में बनाए रखता है।
- source_word: אֲרָיוֹת שֹׁאֲגִים
  choice: गरजते हुए सिंह
  rationale: विशेषणात्मक कृदंत שֹׁאֲגִים सिंहों की सक्रिय, हिंसक और भयावह प्रकृति व्यक्त करता है; ‘गरजते हुए’ इस चित्र को प्रत्यक्ष रखता है।
- source_word: שֹׁפְטֶיהָ
  choice: उसके न्यायी
  rationale: שֹׁפֵט न्याय करने वाले पदाधिकारी को सीधे सूचित करता है। ‘न्यायी’ बाइबलीय गरिमा के साथ संक्षिप्त और स्पष्ट है।
- source_word: זְאֵבֵי עֶרֶב
  choice: सांझ के भेड़िए
  rationale: शाब्दिक संरचना ‘सांझ के भेड़िए’ है, जो रात के समय शिकार पर निकलने वाले हिंसक पशुओं का रूपक सुरक्षित रखती है।
- source_word: לֹא גָרְמוּ לַבֹּקֶר
  choice: जो भोर के लिए कुछ भी नहीं छोड़ते
  rationale: दुर्बोध हिब्रू मुहावरा हड्डियों को कुतरने और शिकार को पूरी तरह खा जाने का चित्र देता है। मुख्य पाठ में इसका आशय स्वाभाविक हिन्दी में दिया गया है और अधिक शाब्दिक विकल्प पादटिप्पणी में रखा गया है।
