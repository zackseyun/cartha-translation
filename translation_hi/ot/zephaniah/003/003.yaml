  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। नगर को स्त्रीलिंग मानने वाले प्रसंग के अनुरूप ‘उसके’ का प्रयोग किया गया है। समानांतर काव्य-पंक्तियों और हिंसक पशुओं के दोनों रूपकों को बनाए रखा गया है।
