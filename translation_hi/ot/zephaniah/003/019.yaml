  edition: WLC
  text: הִנְ/נִ֥י עֹשֶׂ֛ה אֶת כָּל מְעַנַּ֖יִ/ךְ בָּ/עֵ֣ת הַ/הִ֑יא וְ/הוֹשַׁעְתִּ֣י אֶת הַ/צֹּלֵעָ֗ה וְ/הַ/נִּדָּחָה֙ אֲקַבֵּ֔ץ וְ/שַׂמְתִּי/ם֙ לִ/תְהִלָּ֣ה וּ/לְ/שֵׁ֔ם בְּ/כָל הָ/אָ֖רֶץ בָּשְׁתָּֽ/ם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zephaniah/003/019.yaml
  text: Behold[a], at that time I will deal with all your oppressors, and I will save the lame and gather the outcast[d][c][b], and I will make them a praise and a name in every land where they were put to shame.
translation:
  language: hi
  text: देखो, उस समय मैं तुम्हारे सब अत्याचारियों से निपटूँगा[a]; मैं लँगड़ी को बचाऊँगा और दूर भगा दी गई को इकट्ठा करूँगा[b]। जिन-जिन देशों में उन्हें लज्जित किया गया था, वहाँ मैं उन्हें प्रशंसा और यश का पात्र बनाऊँगा[c][d]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तुम्हें दुःख देने वालों से निपटूँगा।” इब्रानी क्रिया दुःख देने, अत्याचार करने या दीन करने का अर्थ दे सकती है।
    reason: lexical_alternative
  - marker: b
    text: मूल में “लँगड़ाने वाली” और “दूर भगा दी गई” स्त्रीलिंग एकवचन में हैं; सम्भवतः इनके द्वारा पीड़ित समुदाय का मानवीकरण किया गया है।
    reason: lexical_alternative
  - marker: c
    text: या, “सारी धरती पर।”
    reason: lexical_alternative
  - marker: d
    text: अन्तिम इब्रानी वाक्यांश कठिन है; अधिक शाब्दिक रूप से इसका अर्थ “उनकी लज्जा में” भी हो सकता है। यहाँ सन्दर्भानुसार “जहाँ उन्हें लज्जित किया गया था” लिया गया है।
    reason: textual_difficulty
lexical_decisions:
- source_word: הִנְנִי
  choice: देखो
  rationale: यह एक गंभीर ईश्वरीय घोषणा का संकेत है; आधुनिक हिन्दी में ‘देखो’ स्वाभाविक रहते हुए भविष्यवाणी की ओर ध्यान खींचता है।
- source_word: עֹשֶׂה אֶת כָּל מְעַנַּיִךְ
  choice: तुम्हारे सब अत्याचारियों से निपटूँगा
  rationale: शाब्दिक ‘कर रहा हूँ’ यहाँ विरोधियों के विरुद्ध निर्णायक कार्रवाई का मुहावरा है; ‘से निपटूँगा’ कार्रवाई का भाव रखता है, पर दण्ड की विधि को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: בָּעֵת הַהִיא
  choice: उस समय
  rationale: यह इब्रानी काल-सूचक पद का सीधा और स्वाभाविक हिन्दी रूप है; यहाँ ‘उस दिन’ कहना मूल से भिन्न सूत्र ले आता।
- source_word: וְהוֹשַׁעְתִּי
  choice: मैं ... बचाऊँगा
  rationale: ישׁע उद्धार अथवा बचाने को दर्शाता है; ‘बचाऊँगा’ सामान्य पाठक के लिए स्पष्ट है और पुनर्स्थापना का भाव रखता है।
- source_word: הַצֹּלֵעָה
  choice: लँगड़ी
  rationale: मूल में स्त्रीलिंग एकवचन ‘लँगड़ाने वाली’ है, जो सम्भवतः पीड़ित समुदाय का मानवीकरण करती है; ठोस बिम्ब को बनाए रखने के लिए स्त्रीलिंग एकवचन रखा गया है।
- source_word: הַנִּדָּחָה
  choice: दूर भगा दी गई
  rationale: נדח में भगा दिए जाने अथवा तितर-बितर किए जाने का भाव है; यह अनुवाद निष्कासन की क्रिया और मूल के स्त्रीलिंग एकवचन दोनों को सुरक्षित रखता है।
- source_word: אֲקַבֵּץ
  choice: इकट्ठा करूँगा
  rationale: यह बिखरे हुए लोगों को फिर साथ लाने की पुनर्स्थापना-संबंधी क्रिया है; ‘इकट्ठा करूँगा’ आधुनिक हिन्दी में स्पष्ट है।
- source_word: וְשַׂמְתִּים לִתְהִלָּה וּלְשֵׁם
  choice: उन्हें प्रशंसा और यश का पात्र बनाऊँगा
  rationale: शाब्दिक ‘प्रशंसा और नाम के लिए बनाऊँगा’ हिन्दी में अस्वाभाविक है; ‘प्रशंसा और यश का पात्र’ बदली हुई सार्वजनिक प्रतिष्ठा को स्पष्ट करता है और ‘नाम’ के प्रतिष्ठा-संबंधी मुहावरे को व्यक्त करता है।
- source_word: בְּכָל הָאָרֶץ
  choice: जिन-जिन देशों में
  rationale: הָאָרֶץ का अर्थ ‘धरती’ या ‘देश/भूमि’ हो सकता है। निर्वासन और अपमान के सन्दर्भ में बहुवितरणात्मक ‘जिन-जिन देशों में’ स्वाभाविक है, जबकि वैकल्पिक व्यापक अर्थ पादटिप्पणी में सुरक्षित है।
- source_word: בָּשְׁתָּם
  choice: उन्हें लज्जित किया गया था
  rationale: अन्तिम इब्रानी पद कठिन और संक्षिप्त है। सन्दर्भ के अनुसार यह उन स्थानों में हुए अपमान को दर्शाता है; अधिक शाब्दिक ‘उनकी लज्जा में’ पादटिप्पणी में दिया गया है।
theological_decisions:
- issue: पीड़ित बचे हुए समुदाय के लिए पुनर्स्थापना की भाषा
  choice: लँगड़ी ... दूर भगा दी गई
  alternative: लँगड़ाने वालों ... निकाले गए लोगों
  rationale: स्त्रीलिंग एकवचन रूप सम्भवतः सिय्योन की बेटी अथवा पूरे पीड़ित समुदाय का मानवीकरण करते हैं। अनुवाद सामुदायिक अर्थ को बहुवचन बनाकर निश्चित करने के बजाय मूल के व्यक्ति-बिम्ब और व्याकरणिक तनाव को बनाए रखता है।
- issue: प्रशंसा और नाम का आशय
  choice: प्रशंसा और यश का पात्र
  alternative: प्रशंसा और नाम
  rationale: ‘नाम’ प्रतिष्ठा या ख्याति का इब्रानी मुहावरा है। हिन्दी में ‘यश’ उसका अर्थ स्पष्ट करता है, पर यह तय नहीं करता कि प्रशंसा सीधे उनकी होगी या उनके कारण परमेश्वर की।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘देखो’ भविष्यवाणी की गंभीर उद्घोषणा को व्यक्त करता है। स्त्रीलिंग एकवचन बिम्ब जानबूझकर सुरक्षित रखे गए हैं; कठिन अन्तिम पद और הָאָרֶץ की अर्थ-सम्भावना पादटिप्पणियों में दी गई है।
