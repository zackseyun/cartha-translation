base_translation:
  language: en
  yaml_path: translation/ot/zephaniah/003/018.yaml
  text: I have gathered those grieving over the appointed festival from you[a]; they were a reproach upon her[c][b], a burden.
translation:
  language: hi
  text: नियत पर्व के कारण शोक करनेवालों[a] को मैंने तुझ से इकट्ठा किया है[b]; वे उस पर[c] निंदा का बोझ थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “नियत सभा से दूर किए गए पीड़ितों”; इब्रानी वाक्यांश कठिन है। इसका संकेत या तो पर्व से वंचित होने के कारण शोक करनेवालों की ओर, या पर्वीय सभा से दूर किए गए लोगों की ओर हो सकता है।
    reason: alternative_reading
  - marker: b
    text: या “इकट्ठा किया”; भविष्यसूचक संदर्भ में “इकट्ठा करूँगा” भी संभव है।
    reason: lexical_alternative
  - marker: c
    text: “उस” का संकेत संभवतः सिय्योन या यरूशलेम की ओर है।
    reason: cross_reference
lexical_decisions:
- source_word: נוּגֵי
  choice: शोक करनेवालों
  rationale: यह रूप शोक या दुःख की दशा में पड़े लोगों को सूचित करता है। यह अनुवाद व्यक्ति-संदर्भ और भावात्मक बल को बनाए रखता है, पर शोक का कारण अनावश्यक रूप से निश्चित नहीं करता।
- source_word: מִמּוֹעֵד
  choice: नियत पर्व के कारण
  rationale: מוֹעֵד यहाँ धार्मिक संदर्भ में नियत पर्व या पर्वीय सभा को सूचित करता है। מִן संबंध, कारण या अलगाव व्यक्त कर सकता है; मुख्य पाठ में पर्व से वंचित होने के कारण उत्पन्न शोक का संभावित अर्थ लिया गया है और दूसरा अर्थ पादटिप्पणी में रखा गया है।
- source_word: אָסַפְתִּי
  choice: मैंने ... इकट्ठा किया है
  rationale: प्रथम पुरुष एकवचन क़ातल रूप का पूर्णतावाचक बल सुरक्षित रखा गया है। भविष्यसूचक संदर्भ में इसका भावी अर्थ भी संभव है, जिसे पादटिप्पणी में दिया गया है।
- source_word: מִמֵּךְ
  choice: तुझमें से
  rationale: स्त्रीलिंग एकवचन संबोधित पात्र, संभवतः सिय्योन या यरूशलेम, से निकलने या अलग होने का भाव सीधे ढंग से व्यक्त होता है।
- source_word: מַשְׂאֵת
  choice: बोझ
  rationale: यहाँ संज्ञा का अर्थ उठाया जानेवाला भार या बोझ है, न कि भविष्यवाणी अथवा वाणी।
- source_word: עָלֶיהָ
  choice: उस पर
  rationale: स्त्रीलिंग एकवचन सर्वनाम को स्पष्ट पहचान दिए बिना सुरक्षित रखा गया है; उसका संभावित संदर्भ पादटिप्पणी में बताया गया है।
- source_word: חֶרְפָּה
  choice: निंदा
  rationale: यह शब्द सार्वजनिक अपमान, तिरस्कार और लांछन का भाव रखता है; ‘निंदा’ आधुनिक हिन्दी में इन सामाजिक और वाचिक पक्षों को संक्षेप में व्यक्त करती है।
theological_decisions:
- issue: पद की संक्षिप्त और कठिन वाक्य-रचना तथा सर्वनामों के संदर्भ
  choice: पद को उन लोगों के इकट्ठा किए जाने के रूप में रखा गया है जो नियत पर्व के कारण शोक करते हैं; वे स्त्रीलिंग पात्र पर निंदा का बोझ थे।
  alternative: इसका अर्थ पर्वीय सभा से निकाले गए पीड़ितों को इकट्ठा करना, या सिय्योन से उनके साथ जुड़ी निंदा हटाना भी हो सकता है; अंतिम खंड का संबंध भी भिन्न प्रकार से जोड़ा जा सकता है।
  rationale: इब्रानी पाठ अत्यंत संक्षिप्त है। अनुवाद मुख्य क्रिया और स्त्रीलिंग सर्वनाम को बनाए रखता है, पर ‘उस’ को सीधे सिय्योन या यरूशलेम कहकर अस्पष्टता समाप्त नहीं करता।
- issue: אָסַפְתִּי का कालगत बल
  choice: पूर्णतावाचक ‘मैंने ... इकट्ठा किया है’
  alternative: ‘मैंने इकट्ठा किया’ अथवा भविष्यसूचक संदर्भ में ‘मैं इकट्ठा करूँगा’
  rationale: मुख्य पाठ इब्रानी क़ातल रूप के औपचारिक पूर्णतावाचक बल को दर्शाता है, जबकि पुनर्स्थापना की भविष्यसूचक पृष्ठभूमि में भावी अर्थ की संभावना पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। स्त्रीलिंग संबोधन के लिए ‘तुझमें से’ मूल पाठ की व्याकरणिक विशेषता को बचाता है। कठिन अंतिम खंड को स्वाभाविक हिन्दी में रखा गया है, जबकि मूल की संदर्भगत अस्पष्टता सर्वनाम और पादटिप्पणियों द्वारा सुरक्षित है।
