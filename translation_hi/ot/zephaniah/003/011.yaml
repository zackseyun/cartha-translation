  text: בַּ/יּ֣וֹם הַ/ה֗וּא לֹ֤א תֵב֨וֹשִׁי֙ מִ/כֹּ֣ל עֲלִילֹתַ֔יִ/ךְ אֲשֶׁ֥ר פָּשַׁ֖עַתְּ בִּ֑/י כִּי אָ֣ז אָסִ֣יר מִ/קִּרְבֵּ֗/ךְ עַלִּיזֵי֙ גַּאֲוָתֵ֔/ךְ וְ/לֹֽא תוֹסִ֧פִי לְ/גָבְהָ֛ה ע֖וֹד בְּ/הַ֥ר קָדְשִֽׁ/י־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/zephaniah/003/011.yaml
  text: On that day you will not be put to shame because of all your deeds by which you rebelled against me[a], for then I will remove from your midst those who exult in your pride[b], and you will no longer be haughty on my holy mountain.
translation:
  language: hi
  text: उस दिन तू अपने उन सब कामों के कारण लज्जित नहीं होगी, जिनसे तूने मेरे विरुद्ध विद्रोह किया; क्योंकि तब मैं तेरे बीच से तेरे घमंड में मग्न होकर इतराने वालों को हटा दूँगा, और तू फिर कभी मेरे पवित्र पर्वत पर गर्व से नहीं फूलेगी[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “तू फिर कभी मेरे पवित्र पर्वत पर घमंडी नहीं होगी।” इब्रानी पद का अर्थ है कि तू फिर से अहंकारपूर्ण ढंग से अपने को ऊँचा नहीं करेगी।
    reason: lexical_alternative
lexical_decisions:
- source_word: תֵבוֹשִׁי
  choice: तुझे लज्जित नहीं होना पड़ेगा
  rationale: यह रूप लज्जा की अवस्था और अपमानित होने के परिणाम—दोनों के लिए जगह रखता है तथा पुनर्स्थापित सिय्योन के संदर्भ में स्वाभाविक हिन्दी है।
- source_word: מִכֹּל עֲלִילֹתַיִךְ
  choice: अपने उन सब कामों के कारण
  rationale: בושׁ के साथ מִן कारण बताता है; עֲלִילָה को व्यापक नैतिक अर्थ में ‘काम’ कहना सहज है। ‘उन’ आगे आने वाले संबंधवाचक उपवाक्य से स्वाभाविक रूप से जुड़ता है।
- source_word: פָּשַׁעַתְּ בִּי
  choice: जिनसे तूने मेरे विरुद्ध विद्रोह किया था
  rationale: פשע सामान्य पाप से अधिक विद्रोह और निष्ठा-भंग का भाव रखता है; ‘मेरे विरुद्ध’ בִּי के संबंधपरक बल को व्यक्त करता है।
- source_word: אָסִיר מִקִּרְבֵּךְ
  choice: मैं तेरे बीच से ... दूर कर दूँगा
  rationale: हिफ़ील रूप का कारणात्मक अर्थ हटाने का है; ‘तेरे बीच से’ नगर/समुदाय के भीतर से हटाए जाने का सामुदायिक भाव बनाए रखता है।
- source_word: עַלִּיזֵי גַּאֲוָתֵךְ
  choice: जो तेरे घमंड पर इतराते हैं
  rationale: עַלִּיזֵי उल्लसित या इतराने वाले लोगों को दर्शाता है और संदर्भ में גַּאֲוָה नकारात्मक घमंड है। यह अनुवाद संबंध को स्वाभाविक रखता है, जबकि वैकल्पिक संरचना पादटिप्पणी में दी गई है।
- source_word: וְלֹא תוֹסִפִי לְגָבְהָה עוֹד
  choice: तू फिर कभी ... घमंड नहीं करेगी
  rationale: ‘फिर न करना’ वाली इब्रानी पदावली को सहज हिन्दी में ‘फिर कभी नहीं’ कहा गया है; גבה यहाँ शारीरिक ऊँचाई नहीं, अहंकार सूचित करता है।
- source_word: בְּהַר קָדְשִׁי
  choice: मेरे पवित्र पर्वत पर
  rationale: यह सिय्योन को यहोवा के पवित्र पर्वत के रूप में दर्शाने वाली स्थानवाचक अभिव्यक्ति है; हिन्दी में ‘पर’ स्वाभाविक है।
theological_decisions:
- issue: आरंभिक प्रतिज्ञा का अर्थ केवल भीतर लज्जा अनुभव न करना है या पिछले विद्रोह के कारण अपमानित अवस्था से मुक्ति पाना।
  choice: ‘तुझे लज्जित नहीं होना पड़ेगा’ द्वारा वास्तविक पुराने विद्रोह और परमेश्वर द्वारा उसके अपमानकारी परिणाम को दूर करने—दोनों को बनाए रखा गया है।
  alternative: ‘तू लज्जित नहीं होगी’ केवल आंतरिक अनुभूति पर अधिक बल दे सकता है; ‘तुझे अपमानित नहीं किया जाएगा’ बाहरी अपमान पर अधिक बल दे सकता है।
  rationale: अगला उपवाक्य उन कामों को वास्तविक विद्रोह बताता है, जबकि ‘क्योंकि तब मैं ... दूर कर दूँगा’ पुनर्स्थापना को परमेश्वर की शुद्ध करने वाली कार्रवाई से जोड़ता है। इसलिए अनुवाद न तो पुराने अपराध को नकारता है, न लज्जा के अंत को केवल भावनात्मक परिवर्तन बनाता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज शैली रखी गई है। स्त्रीलिंग एकवचन ‘तू/तेरे/करेगी’ मूल पाठ में संबोधित सिय्योन/नगर के स्त्रीलिंग रूप को सुरक्षित रखता है। ‘तू’ यहाँ बाइबलीय प्रत्यक्ष संबोधन है, असम्मानसूचक प्रयोग नहीं।
