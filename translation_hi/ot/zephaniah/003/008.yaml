  choice: सारी पृथ्वी
  rationale: जातियों और राज्यों के व्यापक संदर्भ में ‘पृथ्वी’ उपयुक्त है, जबकि ‘देश/भूमि’ की संभाव्यता पादटिप्पणी में सुरक्षित है।
theological_decisions:
