- source_word: לְיוֹם קוּמִי
  choice: उस दिन तक, जब मैं ... उठ खड़ा होऊँगा
  rationale: भावी दिन और ईश्वरीय उठ खड़े होने की क्रिया को स्वाभाविक हिन्दी में व्यक्त करता है।
