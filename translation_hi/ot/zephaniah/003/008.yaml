- issue: קִנְאָה में ईश्वरीय भाव
  choice: जलन
  alternative: जोश / उत्साह
  rationale: ‘जलन’ संबंधपरक विशिष्टता और न्याय की तीव्रता को बचाती है, किन्तु शब्द का ‘जोश’ अर्थ भी सम्भव है और पादटिप्पणी में दिया गया है।
