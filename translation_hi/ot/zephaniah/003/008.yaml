  choice: गवाही देने के लिए
  rationale: WLC के स्वरांकन के अनुसार इसका प्रत्यक्ष अर्थ ‘गवाह/गवाही के लिए’ है और निकटवर्ती न्यायिक भाषा से मेल खाता है; कठिन वैकल्पिक अर्थ पादटिप्पणी में रखा गया है।
- source_word: מִשְׁפָּטִי
