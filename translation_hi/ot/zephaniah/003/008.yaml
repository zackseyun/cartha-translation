base_translation:
  language: en
  yaml_path: translation/ot/zephaniah/003/008.yaml
  text: Therefore wait for me[a], declares Yahweh, for the day when I rise up for plunder; for my judgment is to gather nations, to assemble kingdoms, to pour out on them my indignation, all my burning anger[c][b]; for in the fire of my jealousy all the earth will be consumed.
translation:
  language: hi
  text: 'इसलिए मेरी प्रतीक्षा करो—याहवे की यह घोषणा है—उस दिन के लिए जब मैं गवाह के रूप में उठ खड़ा होऊँगा[a]। क्योंकि मेरा निर्णय है: जातियों को एकत्र करना, राज्यों को इकट्ठा करना, और उन पर अपना रोष—अपना सारा धधकता क्रोध—उँडेलना; क्योंकि मेरी ईर्ष्या[b] की आग में सारी पृथ्वी[c] भस्म हो जाएगी।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “गवाह के रूप में” के पीछे का हिब्रू पद कठिन है। इसे “लूट के लिए” या “शिकार के लिए” भी समझा गया है।
    reason: alternative_reading
  - marker: b
    text: “ईर्ष्या” का अनुवाद “जोश” भी हो सकता है।
    reason: lexical_alternative
  - marker: c
    text: “पृथ्वी” का अनुवाद “देश” या “भूमि” भी हो सकता है; यहाँ जातियों और राज्यों का व्यापक संदर्भ “पृथ्वी” का समर्थन करता है।
    reason: lexical_alternative
