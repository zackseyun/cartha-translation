source:
  edition: WLC
  text: אָמַ֜רְתִּי אַךְ תִּירְאִ֤י אוֹתִ/י֙ תִּקְחִ֣י מוּסָ֔ר וְ/לֹֽא יִכָּרֵ֣ת מְעוֹנָ֔/הּ כֹּ֥ל אֲשֶׁר פָּקַ֖דְתִּי עָלֶ֑י/הָ אָכֵן֙ הִשְׁכִּ֣ימוּ הִשְׁחִ֔יתוּ כֹּ֖ל עֲלִילוֹתָֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zephaniah/003/007.yaml
  text: I said[a], ‘Surely you will fear me; you will accept correction. Then her dwelling would not be cut off, according to all that I had appointed against her.’ But instead, they rose early[b]; they corrupted all their deeds.
translation:
  language: hi
  text: मैंने कहा, “निश्चय ही तू मेरा भय मानेगी और सुधार स्वीकार करेगी। तब उसका निवास नष्ट न किया जाता, उस सब के अनुसार जो मैंने उसके विरुद्ध ठहराया था।”[a] परन्तु वे बड़े सवेरे उठे[b] और उन्होंने अपने सारे काम भ्रष्ट कर दिए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या सम्भवतः, “तब उसका निवास नष्ट न किया जाता—उस सब के बावजूद जो मैंने उसके विरुद्ध ठहराया था।”
    reason: alternative_reading
  - marker: b
    text: “बड़े सवेरे उठना” इब्रानी मुहावरा है, जो किसी काम को उत्सुकता या लगातार तत्परता से करने का भाव दे सकता है।
    reason: cultural_note
lexical_decisions:
- source_word: אָמַרְתִּי
  choice: मैंने कहा
  rationale: אמר के प्रथम पुरुष पूर्ण रूप का सीधा अर्थ रखा गया है; यह परमेश्वर के प्रत्यक्ष कथन की रूपरेखा को बनाए रखता है।
- source_word: אַךְ
  choice: निश्चय ही
  rationale: यहाँ यह सीमा नहीं, बल्कि अपेक्षा और दृढ़ आशा व्यक्त करता है।
- source_word: תִּירְאִי אוֹתִי
  choice: तू मेरा भय मानेगी
  rationale: परमेश्वर के संदर्भ में ירא भय और श्रद्धा दोनों का भाव रखता है; ‘भय मानेगी’ हिन्दी में इस द्वैध को स्वाभाविक रूप से बचाता है।
- source_word: תִּקְחִי מוּסָר
  choice: सुधार स्वीकार करेगी
  rationale: לקח + מוסר का आशय अनुशासन अथवा सुधार को ग्रहण करना है; चुना हुआ वाक्यांश नैतिक-सुधारात्मक भाव स्पष्ट करता है।
- source_word: וְלֹא יִכָּרֵת
  choice: न काटा जाता
  rationale: כרת के निफ़अल का मूल बिंब ‘काट दिया जाना’ है; प्रसंग में यह अपेक्षित परन्तु असफल हुई शर्त का परिणाम है।
- source_word: מְעוֹנָהּ
  choice: उसका निवास
  rationale: स्त्रीलिंग प्रत्यय को ज्यों का त्यों रखा गया है, जो स्त्रीरूप में संबोधित नगर की ओर संकेत करता है।
- source_word: כֹּל אֲשֶׁר פָּקַדְתִּי עָלֶיהָ
  choice: उस सब के अनुसार ... जो मैंने उसके विरुद्ध ठहराया था
  rationale: פקד के ‘नियुक्त/ठहराना’ और न्याय-संबंधी अर्थ को रखा गया है, बिना यह मान लिए कि दण्ड पहले ही पूरा हो चुका था।
- source_word: אָכֵן
  choice: परन्तु
  rationale: यह अपेक्षित पश्चात्ताप और वास्तविक भ्रष्ट आचरण के बीच तीखा विरोध प्रकट करता है।
- source_word: הִשְׁכִּימוּ
  choice: बड़े सवेरे उठकर
  rationale: इब्रानी का शाब्दिक मुहावरा सुरक्षित है; इसके तत्परता अथवा निरन्तरता के संकेत को पादटिप्पणी स्पष्ट करती है।
- source_word: הִשְׁחִיתוּ כֹּל עֲלִילוֹתָם
  choice: अपने सभी कामों को बिगाड़ने में लग गए
  rationale: שׁחת का सकर्मक ‘बिगाड़ना/भ्रष्ट करना’ भाव और עלילות का ‘काम’ अर्थ स्वाभाविक आधुनिक हिन्दी में व्यक्त किया गया है।
theological_decisions:
- issue: स्त्रीलिंग एकवचन और बाद के बहुवचन का संदर्भ
  choice: ‘तू/उसका’ से स्त्रीरूप में यरूशलेम को संबोधित किया गया है, जबकि ‘वे’ उसके निवासियों को सामूहिक रूप से दर्शाता है।
  alternative: स्त्रीलिंग को व्यापक रूप से राष्ट्र अथवा नगर-राज्य का व्याकरणिक संदर्भ माना जा सकता है।
  rationale: मूल पाठ का एकवचन से बहुवचन में परिवर्तन जानबूझकर सुरक्षित रखा गया है; उसे एकरूप करके व्याख्यात्मक तनाव हटाया नहीं गया।
- issue: ठहराए गए न्याय-वाक्य की वाक्यगत भूमिका
  choice: इसे उस अवास्तविक परिणाम से जोड़ा गया है कि भय मानने और सुधार ग्रहण करने पर उसका निवास ठहराए गए न्याय के अनुसार न काटा जाता।
  alternative: 'इसे रियायती अर्थ में पढ़ा जा सकता है: ‘उस सब के बावजूद जो मैंने उसके विरुद्ध ठहराया था।’'
  rationale: इब्रानी वाक्य संक्षिप्त और विवादित है। मुख्य पाठ अपेक्षा से इनकार तक के प्रवाह को रखता है, जबकि वैकल्पिक अर्थ पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सहज स्तर रखा गया है। स्त्रीलिंग संबोधन और बहुवचन कर्ता का मूल परिवर्तन सुरक्षित है। दोनों पादटिप्पणी-चिह्न मुख्य पाठ में दिए गए हैं।
