base_translation:
  language: en
  yaml_path: translation/ot/zephaniah/003/004.yaml
  text: Her prophets are reckless[a], treacherous men; her priests have profaned the holy[b]; they have done violence to the law.
translation:
  language: hi
  text: उसके भविष्यद्वक्ता उच्छृंखल, विश्वासघाती पुरुष हैं; उसके याजकों ने जो पवित्र है उसे अपवित्र किया है[a]; उन्होंने व्यवस्था पर हिंसा की है[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “पवित्रस्थान” अथवा “पवित्र वस्तुओं” को।
    reason: lexical_alternative
  - marker: b
    text: 'या “शिक्षा”; हिब्रू: तोराह।'
    reason: lexical_alternative
lexical_decisions:
- source_word: נְבִיאֶיהָ
  choice: उसके भविष्यद्वक्ता
  rationale: नगर के स्त्रीलिंग मानवीकरण की ओर संकेत करने वाले 3 स्त्रीलिंग एकवचन प्रत्यय सहित बहुवचन संबंध को स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: פֹּחֲזִים
  choice: उतावले
  rationale: यह शब्द जल्दबाज़, असंयमित और नैतिक रूप से अस्थिर आचरण बताता है; ‘उतावले’ आधुनिक हिन्दी में इस व्यवहारगत बल को सहजता से व्यक्त करता है।
- source_word: אַנְשֵׁי בֹּגְדוֹת
  choice: विश्वासघाती पुरुष
  rationale: शाब्दिक भाव ‘विश्वासघातों के पुरुष’ है; यह चयन आदतन विश्वासघात का चरित्र सुरक्षित रखता है और स्पष्ट पुल्लिंग संज्ञा का प्रतिनिधित्व करता है।
- source_word: כֹּהֲנֶיהָ
  choice: उसके याजकों
  rationale: 3 स्त्रीलिंग एकवचन प्रत्यय सहित बहुवचन संबंध को भविष्यद्वक्ताओं के समानांतर स्पष्ट करता है।
- source_word: חִלְּלוּ
  choice: अपवित्र किया है
  rationale: पिएल रूप का उपासना-संबंधी अर्थ किसी पवित्र वस्तु को साधारण या अपवित्र ठहराना है; यह हिन्दी में सीधा और गरिमापूर्ण है।
- source_word: קֹדֶשׁ
  choice: पवित्र वस्तु
  rationale: हिब्रू संज्ञा पवित्रता, पवित्र वस्तु या पवित्रस्थान का संकेत कर सकती है। ‘पवित्र वस्तु’ किसी एक विशिष्ट पवित्रस्थान को अनावश्यक रूप से निश्चित किए बिना संज्ञात्मक रूप को बनाए रखता है।
- source_word: חָמְסוּ
  choice: के साथ हिंसा की है
  rationale: क्रिया में हिंसा, अन्याय और उल्लंघन का सजीव भाव है; यह अभिव्यक्ति व्यवस्था को विकृत या प्रताड़ित करने वाले रूपक को बनाए रखती है।
- source_word: תּוֹרָה
  choice: व्यवस्था
  rationale: याजकीय प्रसंग में यह वाचा-संबंधी व्यवस्था का उपयुक्त हिन्दी पद है, जबकि ‘शिक्षा’ की व्यापक संभावना पादटिप्पणी में सुरक्षित है।
theological_decisions:
- issue: קֹדֶשׁ का दायरा
  choice: पवित्र वस्तु
  alternative: पवित्रस्थान; पवित्र चीज़ें
  rationale: मूल पाठ मंदिर-भवन को स्पष्ट रूप से निर्दिष्ट नहीं करता। इसलिए अनुवाद उस व्यापकता को सुरक्षित रखता है और आरोप को केवल पवित्रस्थान तक सीमित नहीं करता।
- issue: תּוֹרָה का अर्थक्षेत्र
  choice: व्यवस्था
  alternative: शिक्षा
  rationale: याजकों और पवित्रता के समानांतर प्रसंग में ‘व्यवस्था’ वाचा और संस्थागत उत्तरदायित्व को स्पष्ट करता है, किंतु मूल शब्द की ‘शिक्षा’ वाली व्यापकता पादटिप्पणी में दी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण भविष्यद्वाणी-संबंधी शैली रखी गई है। ‘याजक’, ‘व्यवस्था’ और ‘अपवित्र’ जैसे परिचित बाइबलीय पद साधारण पाठकों के लिए बोधगम्य हैं। समानांतर उपवाक्यों और मूल के तीखे आरोप को बनाए रखा गया है।
