source:
  edition: WLC
  text: רָנִּי֙ בַּת צִיּ֔וֹן הָרִ֖יעוּ יִשְׂרָאֵ֑ל שִׂמְחִ֤י וְ/עָלְזִי֙ בְּ/כָל לֵ֔ב בַּ֖ת יְרוּשָׁלִָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zephaniah/003/014.yaml
  text: Sing for joy[a], daughter Zion; shout aloud, Israel! Rejoice and exult with all your heart, daughter Jerusalem!
translation:
  language: hi
  text: सिय्योन की बेटी[a], आनन्द से गा; इस्राएल, जयजयकार करो! यरूशलेम की बेटी, अपने पूरे मन से आनन्द मना और उल्लसित हो!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘सिय्योन की बेटी’ और ‘यरूशलेम की बेटी’ इब्रानी के काव्यात्मक संबोधन हैं, जिनमें नगर और उसके निवासियों को एक स्त्री के रूप में प्रस्तुत किया गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: רָנִּי
  choice: आनन्द से गा
  rationale: स्त्रीलिंग एकवचन आज्ञार्थक क्रिया में उल्लासपूर्ण स्वर से गाने का भाव है; यह अनुवाद गायन और आनन्द दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: בַּת צִיּוֹן
  choice: सिय्योन की बेटी
  rationale: इब्रानी का यह काव्यात्मक संबोधन सिय्योन नगर और उसके निवासियों का स्त्री-रूप में मानवीकरण करता है; हिन्दी में संबंधवाचक रचना मूल बिंब को बनाए रखती है।
- source_word: הָרִיעוּ
  choice: जयजयकार करो
  rationale: हिफ़ील बहुवचन आज्ञार्थक क्रिया ऊँची, उल्लासपूर्ण पुकार को व्यक्त करती है; ‘जयजयकार करो’ सार्वजनिक उत्सव और ऊँचे स्वर का भाव समेटता है।
- source_word: יִשְׂרָאֵל
  choice: इस्राएल
  rationale: व्यक्तिवाचक नाम का प्रचलित हिन्दी लिप्यंतरण रखा गया है; यहाँ यह संबोधन के रूप में प्रयुक्त है।
- source_word: שִׂמְחִי
  choice: आनन्द मना
  rationale: यह स्त्रीलिंग एकवचन आज्ञार्थक क्रिया प्रसन्न होने और आनन्द मनाने का आह्वान करती है; वर्तमान हिन्दी में यह सहज और उत्सवी है।
- source_word: וְעָלְזִי
  choice: और उल्लसित हो
  rationale: यह क्रिया उमंग से भरपूर प्रबल आनन्द बताती है; ‘उल्लसित हो’ पिछली क्रिया से अर्थगत भेद बनाए रखती है।
- source_word: בְּכָל לֵב
  choice: अपने पूरे मन से
  rationale: इब्रानी मुहावरा संपूर्ण अंतःकरण से अनुभव करने का भाव देता है; ‘अपने पूरे मन से’ सामान्य आधुनिक हिन्दी में स्वाभाविक है और एकवचन संबोधन से मेल खाता है।
- source_word: בַּת יְרוּשָׁלִָם
  choice: यरूशलेम की बेटी
  rationale: यह ‘सिय्योन की बेटी’ के समानांतर नगर का मानवीकृत संबोधन है; समान रचना रखने से पद की काव्यात्मक समरूपता बनी रहती है।
