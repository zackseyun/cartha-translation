lexical_decisions:
- source_word: הוֹי
  choice: हाय
  rationale: यह भविष्यद्वाणी में शोक और न्याय की कठोर घोषणा का उद्गार है; आधुनिक हिन्दी में ‘हाय’ इसकी संक्षिप्त और गंभीर शक्ति बनाए रखता है।
- source_word: מֹרְאָה
  choice: विद्रोही
  rationale: यह מרה (‘विद्रोह करना’) से संबंधित रूप है और सुधार तथा अधिकार का विरोध करने वाले नगर का नैतिक चरित्र बताता है।
- source_word: וְנִגְאָלָה
  choice: और अशुद्ध
  rationale: इस संदर्भ में निफ़अल स्त्रीलिंग रूप का अर्थ ‘दूषित/अपवित्र’ समझा जाता है। ‘अशुद्ध’ नैतिक और धार्मिक मलिनता दोनों व्यक्त कर सकता है; ‘दूषित’ को वास्तविक विकल्प के रूप में पादटिप्पणी में रखा गया है।
- source_word: הָעִיר
  choice: नगर
  rationale: עִיר का स्वाभाविक और गरिमापूर्ण आधुनिक हिन्दी अनुवाद।
- source_word: הַיּוֹנָה
  choice: अत्याचारी नगर
  rationale: संदर्भ में इसे उत्पीड़न करने वाले नगर का विशेषणात्मक वर्णन समझना न्यायोचित है। हिन्दी में ‘नगर’ दोहराने से संबंध स्पष्ट और स्वाभाविक रहता है; शाब्दिक ‘कबूतरी’ की संभावना पादटिप्पणी में सुरक्षित है।
theological_decisions:
- issue: הַיּוֹנָה की संदिग्ध व्युत्पत्ति और अर्थ
  choice: संदर्भानुसार ‘अत्याचारी नगर’
  alternative: शाब्दिक रूप से ‘कबूतरी’
  rationale: न्याय-घोषणा और समानांतर नैतिक आरोपों के बीच ‘अत्याचारी’ अधिक संगत है, पर हिब्रू रूप को ‘कबूतरी’ भी पढ़ा जा सकता है; इसलिए इस वास्तविक अस्पष्टता को पादटिप्पणी में रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी, संक्षिप्त भविष्यद्वाणी-संबंधी उद्गार और गरिमापूर्ण आरोपात्मक लहजा। ‘शहर’ के बजाय ‘नगर’ काव्यात्मक-धार्मिक प्रसंग में सहज गंभीरता देता है; वाक्य में नगर की पुनरावृत्ति हिब्रू के अंतिम विशेषणात्मक पद का संबंध स्पष्ट करती है।
