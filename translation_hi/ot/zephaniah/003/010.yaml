source:
  edition: WLC
  text: מֵ/עֵ֖בֶר לְ/נַֽהֲרֵי כ֑וּשׁ עֲתָרַ/י֙ בַּת פוּצַ֔/י יוֹבִל֖וּ/ן מִנְחָתִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zephaniah/003/010.yaml
  text: From beyond the rivers of Cush, my worshipers, the daughter of my dispersed ones, will bring my offering.
translation:
  language: hi
  text: कूश[a] की नदियों के पार से मुझसे विनती करनेवाले[b]—मेरे बिखरे हुओं की बेटी[c]—मेरी भेंट लाएँगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘कूश’ मिस्र के दक्षिण में स्थित प्राचीन क्षेत्र का नाम है; यह आधुनिक इथियोपिया के ठीक समान नहीं था।
    reason: cultural_note
  - marker: b
    text: या ‘मेरे उपासक’। इब्रानी शब्द मुख्यतः प्रार्थना या विनती करनेवालों को सूचित करता है और विस्तार से उपासना करनेवालों के लिए भी प्रयुक्त हो सकता है।
    reason: lexical_alternative
  - marker: c
    text: या ‘मेरे तितर-बितर किए हुओं की बेटी’। यह इब्रानी अभिव्यक्ति अत्यंत संक्षिप्त है और किसी बिखरे हुए समुदाय के काव्यात्मक नाम के रूप में काम कर सकती है।
    reason: alternative_reading
lexical_decisions:
- source_word: מֵעֵבֶר
  choice: के पार से
  rationale: यह स्थान-सीमा के दूसरी ओर से उद्गम या आगमन का भाव व्यक्त करता है और हिन्दी में स्वाभाविक है।
- source_word: לְנַהֲרֵי כוּשׁ
  choice: कूश की नदियों
  rationale: बहुवचन construct का सीधा अर्थ रखा गया है। प्राचीन स्थान-नाम כוּשׁ को आधुनिक राष्ट्र ‘इथियोपिया’ से समान ठहराने के बजाय ‘कूश’ रखा गया है।
- source_word: עֲתָרַי
  choice: मुझसे विनती करनेवाले
  rationale: यह עתר से निकला रूप प्रार्थना या विनती करनेवालों को सूचित करता है। यह अनुवाद ‘उपासक’ की अपेक्षा मूल क्रिया का विशिष्ट भाव अधिक स्पष्ट रखता है, जबकि व्यापक उपासना-संबंधी अर्थ पादटिप्पणी में दिया गया है।
- source_word: בַּת
  choice: बेटी
  rationale: मूल की सामूहिक और मानवीकृत काव्यात्मक छवि को सपाट करके ‘समुदाय’ नहीं किया गया है।
- source_word: פוּצַי
  choice: मेरे बिखरे हुओं
  rationale: פוץ के बिखराव के भाव और प्रथम पुरुष संबंध दोनों को रखा गया है; यह जानबूझकर तय नहीं करता कि वे केवल वक्ता के अपने लोग हैं या उसी के द्वारा बिखेरे गए लोग।
- source_word: יוֹבִלוּן
  choice: लाएँगे
  rationale: हिफ़ील रूप भेंट को किसी के पास ले आने का भाव देता है; हिन्दी में ‘भेंट लाएँगे’ स्वाभाविक और संदर्भानुकूल है।
- source_word: מִנְחָתִי
  choice: मेरी भेंट
  rationale: מִנְחָה धार्मिक अर्पण या अधिपति को दी जानेवाली भेंट दोनों का संकेत कर सकता है। ‘भेंट’ इस अर्थ-विस्तार को किसी खास बलिदान तक सीमित नहीं करती।
theological_decisions:
- issue: עֲתָרַי בַּת פוּצַי की संक्षिप्त और कठिन वाक्य-रचना
  choice: ‘मुझसे विनती करनेवाले—मेरे बिखरे हुओं की बेटी—’ को काव्यात्मक समानाधिकरण के रूप में रखा गया है।
  alternative: इसे दो अलग समूह माना जा सकता है, अथवा ‘बेटी’ को मेरे बिखरे लोगों के समुदाय के अर्थ में खोला जा सकता है।
  rationale: मूल पाठ की व्याकरणिक संक्षिप्तता और सामूहिक स्त्रीलिंग छवि को बनाए रखते हुए किसी एक व्याख्या को विस्तार से आरोपित नहीं किया गया। एकवचन ‘बेटी’ और बहुवचन क्रिया का तनाव भी सुरक्षित है।
- issue: עֲתָרַי का धार्मिक आशय
  choice: ‘मुझसे विनती करनेवाले’
  alternative: ‘मेरे उपासक’
  rationale: चुना हुआ पाठ प्रार्थना/याचना के निकट अर्थ को सामने रखता है, पर पादटिप्पणी स्वीकार करती है कि संदर्भ में यह उपासना करनेवालों के व्यापक अर्थ में भी समझा जा सकता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण भविष्यद्वाणी-काव्य का स्वर रखा गया है। ‘विनती करनेवाले’ सामान्य पाठक के लिए बोधगम्य है; डैश कठिन समानाधिकरण को दिखाते हैं, पर उसकी वास्तविक अस्पष्टता को मिटाते नहीं।
