base_translation:
  language: en
  yaml_path: translation/ot/zephaniah/003/017.yaml
  text: Yahweh your God is in your midst[a], a mighty one who saves; he will rejoice over you with gladness; he will be quiet in his love; he will exult over you with singing.
translation:
  language: hi
  text: याहवे तुम्हारा परमेश्वर तुम्हारे बीच में है—वह शक्तिशाली है और उद्धार करता है। वह तुम्हें लेकर आनन्द से मगन होगा; वह अपने प्रेम में चुप रहेगा[a]; वह तुम्हें लेकर गीत गाते हुए उल्लसित होगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वह अपने प्रेम से तुम्हें शांत करेगा।” एक और, किंतु कम सम्भावित व्याख्यात्मक अनुवाद है, “वह अपने प्रेम में तुम्हें नया कर देगा।”
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय उसका देवनागरी लिप्यंतरण रखा गया है।
- source_word: אֱלֹהַיִךְ
  choice: तुम्हारा परमेश्वर
  rationale: द्वितीय पुरुष स्त्रीलिंग एकवचन प्रत्यय सिय्योन/यरूशलेम को सामूहिक रूप से सम्बोधित करता है; हिन्दी में ‘तुम्हारा परमेश्वर’ स्वाभाविक वाचा-संबंधी संबोधन है।
- source_word: בְּקִרְבֵּךְ
  choice: तुम्हारे बीच में
  rationale: यह समुदाय के मध्य में याहवे की उपस्थिति व्यक्त करता है और हिन्दी में सहज स्थानवाचक अभिव्यक्ति है।
- source_word: גִּבּוֹר יוֹשִׁיעַ
  choice: वह ऐसा वीर है जो बचाता है
  rationale: ‘वीर’ संज्ञात्मक रूप में शक्ति और योद्धा-सदृश सामर्थ्य को बनाए रखता है, जबकि ‘जो बचाता है’ क्रिया के वर्णनात्मक बल को सुरक्षित रखता है।
- source_word: יָשִׂישׂ עָלַיִךְ בְּשִׂמְחָה
  choice: वह तुम्हारे कारण बड़े आनन्द से आनन्दित होगा
  rationale: यह अभिव्यक्ति प्रबल हर्ष को दर्शाती है; ‘तुम्हारे कारण’ हिन्दी में עָלַיִךְ का प्रसंगानुकूल और स्वाभाविक भाव देता है।
- source_word: יַחֲרִישׁ בְּאַהֲבָתוֹ
  choice: वह अपने प्रेम में चुप रहेगा
  rationale: हिब्रू में ‘चुप रहना’ क्रिया का कोई स्पष्ट कर्म नहीं है। यह अनुवाद मूल पाठ के सीधे अर्थ और उसकी अर्थगत जटिलता को बनाए रखता है।
- source_word: יָגִיל עָלַיִךְ בְּרִנָּה
  choice: वह तुम्हारे कारण गीत गाकर उल्लसित होगा
  rationale: ‘उल्लसित होगा’ पहले आनन्द-सूचक क्रिया से शब्दगत भेद बनाए रखता है, और ‘गीत गाकर’ רִנָּה के हर्षपूर्ण गान या ऊँची आनन्द-ध्वनि को प्रसंग में स्पष्ट करता है।
theological_decisions:
- issue: יַחֲרִישׁ בְּאַהֲבָתוֹ का अर्थ
  choice: वह अपने प्रेम में चुप रहेगा
  alternative: वह अपने प्रेम से तुम्हें शांत करेगा; वह अपने प्रेम में तुम्हें नया कर देगा
  rationale: व्यंजन-पाठ और वाक्य-विन्यास में ‘तुम्हें’ जैसा कोई स्पष्ट कर्म नहीं है, इसलिए मुख्य पाठ में अकर्मक अर्थ रखा गया है। प्रसिद्ध वैकल्पिक अर्थों को उनकी व्याख्यात्मक और धार्मिक महत्ता के कारण पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण और सार्वजनिक पाठ के योग्य रूप अपनाया गया है। ‘याहवे’ में व्यक्तिगत ईश्वरीय नाम सुरक्षित है। स्त्रीलिंग एकवचन संबोधन का लक्ष्य सिय्योन/यरूशलेम है, पर हिन्दी के ‘तुम’ और सम्बन्धवाचक रूपों में यह भेद प्रत्यक्ष नहीं दिखता। समानार्थी आनन्द-सूचक हिब्रू क्रियाओं के लिए ‘आनन्दित’ और ‘उल्लसित’ का भेद रखा गया है।
