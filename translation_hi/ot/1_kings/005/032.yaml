  text: וַֽ/יִּפְסְל֞וּ בֹּנֵ֧י שְׁלֹמֹ֛ה וּ/בֹנֵ֥י חִיר֖וֹם וְ/הַ/גִּבְלִ֑ים וַ/יָּכִ֛ינוּ הָ/עֵצִ֥ים וְ/הָ/אֲבָנִ֖ים לִ/בְנ֥וֹת הַ/בָּֽיִת׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/005/032.yaml
  text: So Solomon’s builders[a], Hiram’s builders[b], and the men of Gebal cut and prepared the timber and the stones to build the house.
translation:
  language: hi
  text: तब सुलैमान के कारीगरों, हीराम के कारीगरों और गबाल के लोगों[a] ने भवन[b] बनाने के लिए लकड़ी और पत्थरों को काटा और तैयार किया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात गबाल (बिब्लोस) नगर के लोग।
    reason: lexical_alternative
  - marker: b
    text: अर्थात यहोवा का भवन—मंदिर।
    reason: cross_reference
lexical_decisions:
- source_word: וַיִּפְסְלוּ
  choice: काट-छाँटकर
  rationale: פסל यहाँ निर्माण-सामग्री को काटने और आकार देने का बोध कराता है। ‘काट-छाँटकर’ लकड़ी और पत्थर दोनों के संदर्भ में स्वाभाविक है और केवल पत्थर तराशने तक अर्थ को सीमित नहीं करता।
- source_word: בֹּנֵי שְׁלֹמֹה וּבֹנֵי חִירוֹם
  choice: सुलैमान और हीराम के कारीगरों
  rationale: दोनों समानांतर पद उनके निर्माण-कार्य करनेवालों को दर्शाते हैं। ‘कारीगर’ आधुनिक हिंदी में स्वाभाविक है और लकड़ी तथा पत्थर, दोनों पर काम करनेवालों को समेटता है।
- source_word: וְהַגִּבְלִים
  choice: गबालियों[a]
  rationale: यह गबाल (बिब्लोस) के लोगों के लिए प्रयुक्त जातिवाचक नाम है। लिप्यंतरण स्रोत की भौगोलिक पहचान बनाए रखता है; पादटिप्पणी इसे स्पष्ट करती है।
- source_word: וַיָּכִינוּ
  choice: तैयार किया
  rationale: हिफ़ील रूप का सामान्य अर्थ ‘तैयार करना’ या ‘तैयार रखना’ है, जो निर्माण के इस प्रसंग में स्पष्ट और सहज है।
- source_word: הָעֵצִים
  choice: लकड़ी
  rationale: निर्माण के प्रसंग में बहुवचन संज्ञा लकड़ी की निर्माण-सामग्री को दर्शाती है। ‘लकड़ी’ सामान्य आधुनिक हिंदी में ‘इमारती लकड़ी’ से अधिक सहज है और अर्थ को पर्याप्त रूप से व्यक्त करती है।
- source_word: וְהָאֲבָנִים
  choice: पत्थरों
  rationale: मूल पाठ केवल ‘पत्थर’ कहता है; ‘शिलाखंड’ या ‘पत्थर के खंड’ जोड़ना अनावश्यक विशिष्टीकरण होता।
- source_word: לִבְנוֹת הַבָּיִת
  choice: भवन[b] बनाने के लिए
  rationale: בַּיִת का मूल अर्थ ‘घर/भवन’ है, यद्यपि यहाँ संदर्भ यहोवा के मंदिर का है। ‘भवन’ स्रोत के रूपक और प्रसंग की गरिमा को बनाए रखता है; पादटिप्पणी संदर्भ स्पष्ट करती है।
theological_decisions:
- issue: הַבָּיִת को सीधे ‘मंदिर’ कहा जाए या उसके मूल अर्थ को रखा जाए
  choice: मुख्य पाठ में ‘भवन’ और पादटिप्पणी में मंदिर की पहचान
  alternative: मुख्य पाठ में ‘मंदिर’
  rationale: यहाँ संदर्भ निस्संदेह यहोवा के मंदिर का है, पर इब्रानी में सामान्य शब्द ‘घर/भवन’ आया है। मुख्य पाठ में ‘भवन’ रखने से मूल अभिव्यक्ति सुरक्षित रहती है और पादटिप्पणी पाठक को संदर्भ बताती है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। दो समानांतर कर्ता-पदों को हिंदी में संयुक्त करके अनावश्यक पुनरावृत्ति से बचाया गया है। ‘काट-छाँटकर … तैयार किया’ इब्रानी की दोनों क्रियाओं को स्वाभाविक हिंदी क्रम में व्यक्त करता है।
