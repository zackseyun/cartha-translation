    text: या, “सारे इस्राएल में से एक श्रमिक-दल जुटाया।”
    reason: lexical_alternative
  - marker: b
    text: इब्रानी शब्द מַס यहाँ मुख्यतः धन के कर को नहीं, बल्कि अनिवार्य श्रम-सेवा को दर्शाता है।
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּעַל
  choice: भर्ती किया
  rationale: हिफ़िल रूप, מַס के साथ, अनिवार्य श्रम के लिए लोगों को जुटाने अथवा उनकी भरती करने का प्रशासनिक अर्थ देता है।
- source_word: מַס
  choice: बेगार / बेगार-दल
  rationale: यहाँ शब्द का आशय मुख्यतः धन-कर नहीं, बल्कि राज्य द्वारा अनिवार्य की गई श्रम-सेवा और उसके लिए जुटाए गए लोगों से है। ‘बेगार’ आधुनिक हिन्दी में इसे संक्षेप और स्पष्टता से व्यक्त करता है।
- source_word: מִכָּל יִשְׂרָאֵל
  choice: सारे इस्राएल में से
  rationale: מִן स्रोत-समुदाय को सूचित करता है, और כֹּל इस भर्ती की व्यापकता को बनाए रखता है।
- source_word: וַיְהִי הַמַּס
  choice: और उस बेगार-दल में ... थे
  rationale: इब्रानी का शाब्दिक ‘और बेगार था’ हिन्दी में अस्वाभाविक है; यह रूप दल की कुल संख्या को सहज ढंग से बताता है।
- source_word: שְׁלֹשִׁים אֶלֶף אִישׁ
  choice: तीस हज़ार पुरुष
  rationale: אִישׁ यहाँ वयस्क पुरुष श्रमिकों की गणना करता है; इसलिए लिंग-विशिष्ट अर्थ सुरक्षित रखा गया है।
