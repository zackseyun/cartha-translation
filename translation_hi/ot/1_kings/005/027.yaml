  text: राजा सुलैमान ने सारे इस्राएल में से बेगार के लिए लोगों को भरती किया[a][b]; और बेगार के लिए भरती किए गए पुरुषों की संख्या तीस हज़ार थी।
  philosophy: optimal-equivalence
  footnotes:
