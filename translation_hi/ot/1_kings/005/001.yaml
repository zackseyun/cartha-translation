translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘पलिश्ती’ प्रचलित बाइबलीय जातिनाम है। भौगोलिक विस्तार को स्पष्ट करने के लिए ‘से लेकर ... तक’ का प्रयोग किया गया है।
