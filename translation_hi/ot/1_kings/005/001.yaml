revisions:
- from: और सुलैमान नदी[a] से लेकर पलिश्तियों के देश और मिस्र की सीमा तक के सभी राज्यों पर शासन करता था। वे सुलैमान को कर[b] चढ़ाते और जीवन भर उसकी सेवा करते रहे।
  to: और सुलैमान नदी[a] से पलिश्तियों के देश तक, और मिस्र की सीमा तक के सभी राज्यों पर शासन करता था। वे सुलैमान को कर देते थे और सुलैमान के जीवन भर उसकी सेवा करते थे।
  rationale: The revision removes the cultic-sounding expression for tribute, makes the paired geographical limits easier to parse, and renders both ongoing actions in parallel Hindi while retaining the Hebrew ambiguity of ‘the River’ and the lexical alternative for מִנְחָה.
