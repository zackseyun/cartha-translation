    text: या ‘भेंट’। इब्रानी शब्द מִנְחָה का अर्थ भेंट, अर्पण या कर हो सकता है; यहाँ राजनीतिक संदर्भ ‘कर’ के पक्ष में है।
    reason: lexical_alternative
  revision_rationale: The revision removes the cultic-sounding expression for tribute, makes the paired geographical limits easier to parse, and renders both ongoing actions in parallel Hindi while retaining the Hebrew ambiguity of ‘the River’ and the lexical alternative for מִנְחָה.
