source:
  edition: WLC
  text: וּ/שְׁלֹמֹ֗ה הָיָ֤ה מוֹשֵׁל֙ בְּ/כָל הַ/מַּמְלָכ֔וֹת מִן הַ/נָּהָר֙ אֶ֣רֶץ פְּלִשְׁתִּ֔ים וְ/עַ֖ד גְּב֣וּל מִצְרָ֑יִם מַגִּשִׁ֥ים מִנְחָ֛ה וְ/עֹבְדִ֥ים אֶת שְׁלֹמֹ֖ה כָּל יְמֵ֥י חַיָּֽי/ו־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/005/001.yaml
  text: And Solomon was ruling over all the kingdoms from the River to the land of the Philistines and as far as the border of Egypt[b][a]. They were bringing tribute and serving Solomon all the days of his life.
translation:
  language: hi
  text: और सुलैमान नदी[a] से पलिश्तियों के देश तक, और मिस्र की सीमा तक के सभी राज्यों पर शासन करता था। वे सुलैमान को कर देते थे और सुलैमान के जीवन भर उसकी सेवा करते थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात् फरात नदी।
    reason: cross_reference
lexical_decisions:
- source_word: מוֹשֵׁל
  choice: शासन करता था
  rationale: היה के साथ कृदंत अतीत में जारी शासन को व्यक्त करता है; यह हिंदी प्रयोग उस कालगत निरंतरता को स्वाभाविक रूप से बनाए रखता है।
- source_word: בְּכָל הַמַּמְלָכוֹת
  choice: सभी राज्यों पर
  rationale: מָשַׁל के साथ בְּ यहाँ अधीन राज्यों पर प्रभुत्व दर्शाता है; बहुवचन को बनाए रखा गया है।
- source_word: מִן הַנָּהָר
  choice: नदी से
  rationale: मूल पाठ के निश्चित पद ‘नदी’ को मुख्य पाठ में रखा गया है; इस भू-राजनीतिक संदर्भ में इसका संकेत फरात नदी की ओर है, जिसे पादटिप्पणी स्पष्ट करती है।
- source_word: אֶרֶץ פְּלִשְׁתִּים
  choice: पलिश्तियों के देश
  rationale: यह इब्रानी संबंधवाचक पदबंध का पारदर्शी और सामान्य हिंदी रूप है।
- source_word: וְעַד גְּבוּל מִצְרָיִם
  choice: और मिस्र की सीमा तक
  rationale: यह राज्याधिकार के भौगोलिक विस्तार की अंतिम सीमा को सीधे व्यक्त करता है।
- source_word: מַגִּשִׁים מִנְחָה
  choice: कर चढ़ाते
  rationale: מִנְחָה का अर्थ भेंट, अर्पण या कर हो सकता है; अधीन राज्यों के राजनीतिक संदर्भ में ‘कर’ सर्वाधिक उपयुक्त है, जबकि ‘चढ़ाते’ प्रस्तुत करने की क्रिया को व्यक्त करता है।
- source_word: וְעֹבְדִים אֶת שְׁלֹמֹה
  choice: सुलैमान की सेवा करते रहे
  rationale: עבד किसी शासक के प्रति सेवा या अधीनता को दर्शा सकता है; यह रूप राजनीतिक आशय को बनाए रखता है, पर जबरन श्रम का अतिरिक्त अर्थ नहीं जोड़ता।
- source_word: כָּל יְמֵי חַיָּיו
  choice: जीवन भर
  rationale: यह इब्रानी मुहावरे ‘उसके जीवन के सभी दिनों’ का स्वाभाविक आधुनिक हिंदी समतुल्य है।
