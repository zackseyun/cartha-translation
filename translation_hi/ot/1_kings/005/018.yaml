source:
  edition: WLC
  text: וְ/עַתָּ֕ה הֵנִ֨יחַ יְהוָ֧ה אֱלֹהַ֛/י לִ֖/י מִ/סָּבִ֑יב אֵ֣ין שָׂטָ֔ן וְ/אֵ֖ין פֶּ֥גַע רָֽע׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/005/018.yaml
  text: But now Yahweh my God has given me rest on every side[b][a]; there is neither adversary nor evil occurrence.
translation:
  language: hi
  text: परन्तु अब यहोवा, मेरे परमेश्वर ने मुझे चारों ओर से विश्राम दिया है; न कोई विरोधी है[a], न कोई अनिष्ट घटना[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “प्रतिद्वंद्वी।” यहाँ इब्रानी शब्द שָׂטָן सामान्य संज्ञा है; इसका अर्थ अनिवार्य रूप से व्यक्तिवाचक नाम “शैतान” नहीं है।
    reason: lexical_alternative
  - marker: b
    text: या “विपत्ति,” “संकट” अथवा “आपदा।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: परन्तु अब
  rationale: प्रसंग में पिछली परिस्थितियों के विपरीत वर्तमान स्थिति की ओर संक्रमण है; यह पदबंध उस विरोध को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: הֵנִיחַ ... לִי
  choice: मुझे ... विश्राम दिया है
  rationale: हिफ़ील रूप का कारक भाव सुरक्षित रहता है और हिन्दी में यह सहज अभिव्यक्ति है।
- source_word: יְהוָה אֱלֹהַי
  choice: मेरे परमेश्वर यहोवा
  rationale: व्यक्तिगत संबंधसूचक प्रत्यय को स्पष्ट रखते हुए दिव्य नाम को नाम के रूप में प्रस्तुत किया गया है।
- source_word: מִסָּבִיב
  choice: चारों ओर से
  rationale: आस-पास के सभी ओर से शत्रुता या दबाव से मिली राहत का स्थानिक भाव स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: אֵין שָׂטָן
  choice: न कोई विरोधी है
  rationale: यहाँ שָׂטָן सामान्य संज्ञा है और राजनीतिक या सैन्य प्रसंग में विरोध करने वाले व्यक्ति को दर्शाती है, न कि अनिवार्यतः 'शैतान' नामक सत्ता को।
- source_word: וְאֵין פֶּגַע רָע
  choice: न कोई बुरी विपत्ति
  rationale: פֶּגַע किसी हानिकारक घटना, आघात या विपत्ति को और רָע उसके बुरे अथवा अनिष्टकारी स्वरूप को बताता है; यह अनुवाद नैतिक बुराई या केवल प्राकृतिक आपदा तक अर्थ को सीमित नहीं करता।
theological_decisions:
- issue: दिव्य नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: इब्रानी चतुरक्षरीय दिव्य नाम को सामान्य उपाधि 'प्रभु' से बदलने के बजाय व्यक्तिवाचक नाम के रूप में रखा गया है; हिन्दी बाइबल-परंपरा में 'यहोवा' व्यापक रूप से पहचाना जाता है।
- issue: שָׂטָן को व्यक्तिवाचक नाम मानना या सामान्य संज्ञा
  choice: विरोधी
  alternative: शैतान
  rationale: निकटवर्ती प्रसंग राज्य के चारों ओर शांति और मानवीय विरोध के अभाव की बात करता है। इसलिए सामान्य संज्ञा वाला अर्थ रखा गया और पाठ में किसी दुष्ट आत्मिक व्यक्ति की पहचान आरोपित नहीं की गई।
- issue: פֶּגַע רָע की अर्थ-सीमा
  choice: बुरी विपत्ति
  alternative: अनिष्ट घटना
  rationale: मूल पदबंध हानिकारक घटना, आघात, संकट या विपत्ति की कुछ व्यापक अर्थ-सीमा रखता है; मुख्य पाठ में सहज हिन्दी दी गई है और पादटिप्पणी में विकल्प सुरक्षित हैं।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण और सामान्य पाठक के लिए सुबोध शैली। 'विश्राम दिया है' मूल के कारक भाव को रखता है। दोनों पादटिप्पणी-चिह्न संबंधित शब्दों के तुरंत बाद मुख्य पाठ में दिए गए हैं।
