  yaml_path: translation/ot/1_kings/005/022.yaml
  text: Then Hiram sent to Solomon[a], saying, “I have heard what you sent to me[b]. I will do all your desire concerning cedar timber and cypress timber.”
translation:
  language: hi
  text: तब हीराम ने सुलैमान को कहला भेजा, “तुमने मेरे पास जो भेजा है, वह मैंने सुन लिया है। देवदार और सरो[a] की लकड़ी के विषय में मैं तुम्हारी सारी इच्छा पूरी करूँगा।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी शब्द בְּרוֹשִׁים से अभिप्रेत वृक्ष की ठीक जाति निश्चित नहीं है; इसका अनुवाद ‘सनोबर’ या ‘फर’ भी किया जाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: तब ... यह संदेश भेजा
  rationale: वाव-क्रमागत कथा को आगे बढ़ाता है। हिन्दी में ‘तब’ घटनाक्रम को स्वाभाविक बनाता है; भेजी गई बात के संदर्भ से ‘संदेश’ स्पष्ट होता है।
- source_word: חִירָם
  choice: हीराम
  rationale: व्यक्तिनाम का प्रचलित हिन्दी लिप्यंतरण।
- source_word: אֶל שְׁלֹמֹה
  choice: सुलैमान के पास
  rationale: गंतव्य सूचक אֶל का स्वाभाविक हिन्दी रूप; सुलैमान नाम का प्रचलित हिन्दी रूप रखा गया है।
- source_word: לֵאמֹר
  choice: 'यह संदेश ... :'
  rationale: प्रत्यक्ष कथन का परिचय हिन्दी में स्वाभाविक विराम-चिह्न और ‘यह संदेश’ से दिया गया है; अलग से ‘कहते हुए’ कहना अनावश्यक और कृत्रिम होता।
- source_word: שָׁמַעְתִּי אֵת אֲשֶׁר שָׁלַחְתָּ אֵלָי
  choice: जो कुछ तुमने मेरे पास भेजा था, मैंने सुन लिया है
  rationale: हिब्रू की ‘जो तुमने मेरे पास भेजा’ वाली अभिव्यक्ति को बिना उसे सीधे ‘निवेदन’ मान लेने के सुरक्षित रखा गया है। ‘सुन लिया है’ संदेश ग्रहण और समझ लिए जाने का वर्तमान परिणाम व्यक्त करता है।
- source_word: אֲנִי אֶעֱשֶׂה אֶת כָּל חֶפְצְךָ
  choice: मैं तुम्हारी सारी इच्छा पूरी करूँगा
  rationale: शाब्दिक ‘तुम्हारी सारी इच्छा करूँगा’ हिन्दी में अस्वाभाविक है; ‘इच्छा पूरी करना’ अर्थ को स्पष्ट और सामान्य ढंग से व्यक्त करता है।
- source_word: בַּעֲצֵי אֲרָזִים
  choice: देवदार ... की लकड़ी के विषय में
  rationale: ב यहाँ कार्य-क्षेत्र या विषय बताता है। निर्माण-संदर्भ में עֵצִים को केवल पेड़ नहीं, लकड़ी के रूप में प्रस्तुत करना उपयुक्त है।
- source_word: וּבַעֲצֵי בְרוֹשִׁים
  choice: और सरो[a] की लकड़ी
  rationale: בְּרוֹשׁ की ठीक वनस्पति-जाति अनिश्चित है। मुख्य पाठ में परिचित सम्भावित समतुल्य ‘सरो’ रखा गया और अनिश्चितता पादटिप्पणी में बताई गई है।
