  yaml_path: translation/ot/1_kings/005/015.yaml
  text: Then Hiram king of Tyre sent his servants to Solomon[a], because he had heard that they had anointed him king in place of his father, for Hiram had always loved David.
translation:
  language: hi
  text: तब सोर के राजा हीराम ने अपने सेवकों को सुलैमान के पास भेजा, क्योंकि उसने सुना था कि उसके पिता के स्थान पर उसका राजा के रूप में अभिषेक किया गया था; क्योंकि हीराम दाऊद से सदा प्रेम करता था।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “क्योंकि हीराम जीवन भर दाऊद का मित्र रहा था।” इब्रानी में शाब्दिक भाव है, “क्योंकि हीराम सब दिनों दाऊद से प्रेम करता था,” जो निरंतर अनुकूल संबंध को व्यक्त करता है।
    reason: lexical_alternative
