- source_word: תַּחַת אָבִיהוּ
  choice: उसके पिता के स्थान पर
  rationale: उत्तराधिकार और प्रतिस्थापन दोनों का मूल भाव सुरक्षित रहता है।
- source_word: כִּי אֹהֵב הָיָה חִירָם לְדָוִד כָּל הַיָּמִים
  choice: दरअसल हीराम दाऊद से सदा प्रेम रखता था
  rationale: दूसरे כִּי को पृष्ठभूमि-व्याख्या के रूप में और אֹהֵב הָיָה की निरंतर प्रवृत्ति को ‘प्रेम रखता था’ से व्यक्त किया गया है।
