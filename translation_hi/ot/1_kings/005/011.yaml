base_translation:
  language: en
  yaml_path: translation/ot/1_kings/005/011.yaml
  text: He was wiser than every man—than Ethan the Ezrahite[a], and Heman, Kalkol, and Darda[c][b], the sons of Mahol—and his name was in all the surrounding nations.
translation:
  language: hi
  text: वह हर मनुष्य[a] से अधिक बुद्धिमान था—माहोल के पुत्र एतान एज्राही[b], हेमान, कलकोल और दर्दा से भी—और आस-पास के सब राष्ट्रों में उसका नाम था[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “समस्त मानवजाति से।” हिब्रू शब्द אָדָם किसी मनुष्य अथवा पूरी मानवजाति, दोनों को सूचित कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: “एज्राही” संभवतः किसी कुल या जातीय संबंध को सूचित करता है; कुछ लोग इसे “जेरही” से जोड़ते हैं।
    reason: lexical_alternative
  - marker: c
    text: या, “आस-पास के सब राष्ट्रों में उसकी ख्याति थी।” हिब्रू में शाब्दिक रूप से “उसका नाम था” है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֶּחְכַּם
  choice: अधिक बुद्धिमान था
  rationale: מִן के साथ क्रिया यहाँ बुद्धि में तुलनात्मक श्रेष्ठता व्यक्त करती है; इसलिए केवल ‘बुद्धिमान हुआ’ के बजाय ‘अधिक बुद्धिमान था’ स्वाभाविक और स्रोतनिष्ठ है।
- source_word: מִכָּל הָאָדָם
  choice: हर मनुष्य से
  rationale: אָדָם का अर्थ किसी व्यक्ति अथवा समस्त मानवजाति से हो सकता है। इसके बाद पुरुष ज्ञानियों के नाम आने के कारण मुख्य पाठ में ‘हर मनुष्य’ उपयुक्त है, जबकि व्यापक अर्थ पादटिप्पणी में रखा गया है।
- source_word: מֵאֵיתָן הָאֶזְרָחִי
  choice: एतान एज्राही से
  rationale: व्यक्तिनाम और अनिश्चित कुल अथवा जाति-सूचक पद को लिप्यंतरित किया गया है, ताकि उसे बिना पर्याप्त आधार ‘जेरही’ या ‘देशज’ न बनाया जाए।
- source_word: וְהֵימָן וְכַלְכֹּל וְדַרְדַּע
  choice: हेमान, कलकोल और दर्दा
  rationale: इन व्यक्तिनामों को हिब्रू उच्चारण के निकट देवनागरी में लिप्यंतरित किया गया है।
- source_word: בְּנֵי מָחוֹל
  choice: माहोल के पुत्र
  rationale: नामों की सूची में यह पद सबसे स्वाभाविक रूप से पितृनाम अथवा परिवार-सूचक वाक्यांश है; ‘नृत्य के पुत्र’ जैसी व्याख्या अनावश्यक रूप से अर्थ निश्चित करेगी।
- source_word: וַיְהִי שְׁמוֹ
  choice: उसका नाम था
  rationale: हिब्रू मुहावरे का शाब्दिक रूप रखा गया है; संदर्भ में इसका आशय ख्याति से हो सकता है, जिसे पादटिप्पणी स्पष्ट करती है।
- source_word: בְּכָל הַגּוֹיִם סָבִיב
  choice: आस-पास के सब राष्ट्रों में
  rationale: यहाँ גּוֹיִם निकटवर्ती जातियों या राष्ट्रों को दर्शाता है, न कि बाद का धर्मवैचारिक पद ‘अन्यजाति’; ‘आस-पास के सब राष्ट्र’ भौगोलिक भाव स्पष्ट रखता है।
theological_decisions:
- issue: तुलनात्मक कथन में אָדָם का अर्थ
  choice: हर मनुष्य
  alternative: समस्त मानवजाति
  rationale: पुरुष ज्ञानियों की आगामी सूची के संदर्भ में एकवचन सामूहिक पद को ‘हर मनुष्य’ कहना उपयुक्त है; फिर भी उसके व्यापक मानवजातीय अर्थ को पादटिप्पणी में सुरक्षित रखा गया है।
- issue: שֵׁם के मुहावरे का अर्थ
  choice: उसका नाम था
  alternative: उसकी ख्याति फैली हुई थी
  rationale: मुख्य पाठ में स्रोत का ठोस मुहावरा रखा गया है और ‘ख्याति’ के अर्थ को पादटिप्पणी में दिया गया है, ताकि निहित अर्थ को अनिवार्य अर्थ न बनाया जाए।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की, सहज किंतु गरिमापूर्ण रखी गई है। तुलनात्मक संरचना स्पष्ट है; व्यक्तिनाम स्रोत के निकट लिप्यंतरित हैं। ‘उसका नाम था’ जानबूझकर हल्का हिब्रू मुहावरा बनाए रखता है, जबकि पादटिप्पणी सामान्य हिन्दी अर्थ बताती है।
