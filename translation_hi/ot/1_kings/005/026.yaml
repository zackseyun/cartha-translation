reference: 1 Kings 5:26
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יהוָ֗ה נָתַ֤ן חָכְמָה֙ לִ/שְׁלֹמֹ֔ה כַּ/אֲשֶׁ֖ר דִּבֶּר ל֑/וֹ וַ/יְהִ֣י שָׁלֹ֗ם בֵּ֤ין חִירָם֙ וּ/בֵ֣ין שְׁלֹמֹ֔ה וַ/יִּכְרְת֥וּ בְרִ֖ית שְׁנֵי/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/005/026.yaml
  text: And Yahweh gave wisdom to Solomon[a], just as he had spoken to him. And there was peace between Hiram and Solomon[b], and the two of them made a covenant.
translation:
  language: hi
  text: याहवे ने सुलैमान को बुद्धि दी, ठीक वैसे ही जैसे उसने उससे कहा था।[a] हीराम और सुलैमान के बीच शांति थी, और उन दोनों ने वाचा बाँधी।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “ठीक वैसे ही जैसे उसने उससे प्रतिज्ञा की थी।” इब्रानी क्रिया का शाब्दिक अर्थ “कहा” है, पर यहाँ उसका संकेत याहवे के पहले दिए हुए वचन की ओर हो सकता है।
    reason: alternative_reading
  - marker: b
    text: इब्रानी में शाब्दिक रूप से “वाचा काटी”; यह वाचा बाँधने या स्थापित करने का मुहावरा है।
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत नाम को उपाधि से बदलने के बजाय उसके प्रचलित लिप्यंतरण से प्रस्तुत किया गया है।
- source_word: נָתַן חָכְמָה
  choice: बुद्धि दी
  rationale: यह मूल क्रिया और संज्ञा का सीधा, स्वाभाविक हिन्दी रूप है तथा सुलैमान को दी गई व्यावहारिक और राजकीय बुद्धि को व्यक्त करता है।
- source_word: כַּאֲשֶׁר דִּבֶּר לוֹ
  choice: ठीक वैसे ही जैसे उसने उससे कहा था
  rationale: דִּבֶּר का मूल अर्थ ‘कहा/बोला’ सुरक्षित रखा गया है; संदर्भ में ‘प्रतिज्ञा की थी’ सम्भव है, इसलिए उसे पादटिप्पणी में दिया गया है।
- source_word: וַיְהִי שָׁלֹם
  choice: शांति थी
  rationale: यह हीराम और सुलैमान के बीच शांतिपूर्ण संबंधों को स्वाभाविक हिन्दी में व्यक्त करता है, बिना इसे अधिक व्याख्यात्मक ‘मित्रता’ बनाने के।
- source_word: וַיִּכְרְתוּ בְרִית
  choice: वाचा बाँधी
  rationale: ‘वाचा’ प्रमुख इब्रानी शब्द בְרִית की शब्दावली को बनाए रखता है; ‘बाँधी’ आधुनिक हिन्दी में वाचा स्थापित करने की स्वाभाविक अभिव्यक्ति है।
- source_word: שְׁנֵיהֶם
  choice: उन दोनों ने
  rationale: यह दोनों पक्षों की पारस्परिक भागीदारी को स्पष्ट और संक्षिप्त रूप से व्यक्त करता है।
theological_decisions:
- issue: परमेश्वर के नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ के व्यक्तिगत नाम को बनाए रखा गया है; ‘प्रभु’ नाम के स्थान पर उपाधि रख देता, जबकि ‘यहोवा’ एक वैकल्पिक पारंपरिक रूप है।
- issue: בְרִית को वाचागत शब्दावली में रखना या राजनीतिक ‘संधि’ कहना
  choice: वाचा बाँधी
  alternative: संधि की
  rationale: संदर्भ राजनीतिक होने पर भी मूल में सामान्य वाचा-संबंधी शब्द בְרִית है। ‘वाचा’ उसके व्यापक बाइबलीय प्रयोग से शब्दगत संबंध बनाए रखता है।
- issue: דִּבֶּר को सामान्य कथन या प्रतिज्ञा के रूप में प्रस्तुत करना
  choice: कहा था
  alternative: प्रतिज्ञा की थी
  rationale: क्रिया का शाब्दिक अर्थ ‘कहा/बोला’ है। पूर्व दिव्य वचन के संदर्भ में प्रतिज्ञा का भाव सम्भव है, पर मुख्य पाठ में उसे निश्चित करके मूल की गुंजाइश समाप्त नहीं की गई।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, सहज और गरिमापूर्ण रखी गई है। सर्वनामों की मूल संरचना को बनाए रखते हुए वाक्य को स्वाभाविक बनाया गया है। ‘वाचा’ जैसे प्रमुख बाइबलीय शब्द को संरक्षित किया गया है, जबकि इब्रानी मुहावरे की जानकारी पादटिप्पणी में दी गई है।
