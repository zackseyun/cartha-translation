lexical_decisions:
- source_word: וַיְהִי ... נֹתֵן
  choice: देता रहा
  rationale: היה के साथ कृदंत बीते हुए वृत्तांत में जारी अथवा नियमित क्रिया का भाव देता है; ‘देता रहा’ इसे सहज हिन्दी में बनाए रखता है। आरम्भ का וַ कथा की निरन्तरता के लिए ‘और’ से व्यक्त किया गया है।
- source_word: חִירוֹם
  choice: हीराम
  rationale: व्यक्तिनाम का प्रचलित हिन्दी बाइबलीय लिप्यंतरण।
- source_word: לִשְׁלֹמֹה
  choice: सुलैमान को
  rationale: לְ का प्राप्तकर्ता-सूचक अर्थ ‘को’ से स्पष्ट किया गया है; नाम का प्रचलित हिन्दी रूप रखा गया है।
- source_word: עֲצֵי אֲרָזִים
  choice: देवदार की लकड़ी
  rationale: निर्माण-सामग्री के प्रसंग में עֵץ को जीवित पेड़ों के बजाय लकड़ी के रूप में व्यक्त करना स्वाभाविक है; אֶרֶז के लिए ‘देवदार’ प्रचलित विकल्प है।
- source_word: וַעֲצֵי בְרוֹשִׁים
  choice: और सरो की लकड़ी[a]
  rationale: בְּרוֹשׁ किसी निर्माणोपयोगी शंकुधारी वृक्ष को सूचित करता है, पर उसकी ठीक प्रजाति अनिश्चित है। मुख्य पाठ में ‘सरो’ रखा और विकल्प पादटिप्पणी में दिए गए हैं।
- source_word: כָּל חֶפְצוֹ
  choice: उसकी इच्छा के अनुसार
  rationale: यह वाक्यांश सुलैमान की पूरी चाह या माँग के अनुरूप आपूर्ति का भाव देता है। ‘उसकी इच्छा के अनुसार’ मूल के संबंधसूचक भाव को गरिमापूर्ण और सहज हिन्दी में व्यक्त करता है।
