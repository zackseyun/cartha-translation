  text: לְ֠/בַד מִ/שָּׂרֵ֨י הַ/נִּצָּבִ֤ים לִ/שְׁלֹמֹה֙ אֲשֶׁ֣ר עַל הַ/מְּלָאכָ֔ה שְׁלֹ֥שֶׁת אֲלָפִ֖ים וּ/שְׁלֹ֣שׁ מֵא֑וֹת הָ/רֹדִ֣ים בָּ/עָ֔ם הָ/עֹשִׂ֖ים בַּ/מְּלָאכָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/005/030.yaml
  text: besides Solomon’s chief deputies who were over the work[a], three thousand three hundred[c][b], who ruled over the people doing the work.
translation:
  language: hi
  text: इनके अतिरिक्त सुलैमान के तीन हज़ार तीन सौ प्रधान अधिकारी[a] थे, जो काम के प्रभारी थे और काम करनेवाले लोगों[b] पर अधिकार रखते थे[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘प्रधान निरीक्षक’। इब्रानी प्रशासनिक पदों में पदक्रम और निगरानी, दोनों के भाव हैं।
    reason: lexical_alternative
  - marker: b
    text: मूल भाषा में ‘लोगों’; यहाँ आशय परियोजना में काम करनेवाले श्रमिकों से है।
    reason: lexical_alternative
  - marker: c
    text: ‘अधिकार रखते थे’ के लिए प्रयुक्त इब्रानी क्रिया शासन या प्रभुत्व करने का भाव भी व्यक्त कर सकती है; यहाँ यह श्रमिकों पर अधिकारपूर्वक निगरानी को दर्शाती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: לְבַד
  choice: इनके अतिरिक्त
  rationale: यह पद पहले बताए गए लोगों की संख्या से अलग एक अतिरिक्त प्रशासनिक समूह का उल्लेख करता है। संदर्भ से जुड़ने के लिए ‘इनके’ जोड़ा गया है।
- source_word: שָּׂרֵי הַנִּצָּבִים
  choice: प्रधान अधिकारी
  rationale: दोनों इब्रानी प्रशासनिक पद मिलकर ऊँचे पद और नियुक्त निगरानी की धारणा व्यक्त करते हैं। ‘प्रधान अधिकारी’ आधुनिक हिंदी में स्वाभाविक है और अनावश्यक पुनरुक्ति से बचता है।
- source_word: לִשְׁלֹמֹה
  choice: सुलैमान के
  rationale: यहाँ ל संबंध अथवा अधिकार को दर्शाता है; हिंदी संबंधकारक इसका सहज रूप है।
- source_word: אֲשֶׁר עַל הַמְּלָאכָה
  choice: जो काम के प्रभारी थे
  rationale: עַל यहाँ काम पर प्रशासनिक उत्तरदायित्व व्यक्त करता है। ‘प्रभारी’ शाब्दिक संबंध और स्वाभाविक हिंदी, दोनों को बनाए रखता है।
- source_word: שְׁלֹשֶׁת אֲלָפִים וּשְׁלֹשׁ מֵאוֹת
  choice: तीन हज़ार तीन सौ
  rationale: संख्या को साहित्यिक पाठ के अनुरूप शब्दों में रखा गया है।
- source_word: הָרֹדִים
  choice: अधिकार रखते थे
  rationale: רדה शासन या अधिकार चलाने का प्रबल भाव रखता है। श्रम-प्रशासन के संदर्भ में यह पर्यवेक्षण से अधिक अधिकारपूर्ण भूमिका बताता है।
- source_word: בָּעָם
  choice: लोगों
  rationale: मूल पाठ में ‘लोग’ है; संदर्भ उन्हें काम में लगे श्रमिकों के रूप में पहचानता है, पर मुख्य पाठ में व्यापक मूल शब्द सुरक्षित रखा गया है।
- source_word: הָעֹשִׂים בַּמְּלָאכָה
  choice: काम करनेवाले
  rationale: यह कृदंत वाक्यांश उन लोगों को काम में लगे हुए व्यक्तियों के रूप में स्पष्ट करता है।
