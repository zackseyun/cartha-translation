source:
  edition: WLC
  text: וַ/יֵּשֶׁב֩ יְהוּדָ֨ה וְ/יִשְׂרָאֵ֜ל לָ/בֶ֗טַח אִ֣ישׁ תַּ֤חַת גַּפְנ/וֹ֙ וְ/תַ֣חַת תְּאֵֽנָת֔/וֹ מִ/דָּ֖ן וְ/עַד בְּאֵ֣ר שָׁ֑בַע כֹּ֖ל יְמֵ֥י שְׁלֹמֹֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/005/005.yaml
  text: And Judah and Israel lived in safety[a], each man under his vine and under his fig tree, from Dan to Beer-sheba[b], all the days of Solomon.
translation:
  language: hi
  text: और यहूदा और इस्राएल सुरक्षित रहते थे—हर पुरुष[a] अपनी दाखलता और अपने अंजीर के पेड़ के नीचे[b]—दान से लेकर बेर्शेबा तक, सुलैमान के जीवन भर।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से ‘हर पुरुष’ है; यहाँ पुल्लिंग एकवचन का प्रयोग प्रत्येक जन के लिए वितरणात्मक अर्थ में हुआ है।
    reason: lexical_alternative
  - marker: b
    text: ‘अपनी दाखलता और अपने अंजीर के पेड़ के नीचे’ देश में शान्ति, सुरक्षा और समृद्धि की पारंपरिक छवि है।
    reason: cultural_note
lexical_decisions:
- source_word: וַיֵּשֶׁב
  choice: रहते थे
  rationale: यहाँ क्रिया का शाब्दिक अर्थ ‘बैठना/बसना’ हो सकता है, पर सामूहिक कर्ता और सुरक्षा-सूचक पद के साथ यह स्थिर रूप से रहने का भाव देती है।
- source_word: יְהוּדָה וְיִשְׂרָאֵל
  choice: यहूदा और इस्राएल
  rationale: मूल पाठ में नामित दोनों राजनीतिक-सामुदायिक इकाइयों को सामान्यीकृत किए बिना ज्यों का त्यों रखा गया है।
- source_word: לָבֶטַח
  choice: सुरक्षित
  rationale: यह पद भय और खतरे से मुक्त, सुरक्षित जीवन को व्यक्त करता है; ‘सुरक्षित रहते थे’ आधुनिक हिन्दी में स्वाभाविक है।
- source_word: אִישׁ
  choice: हर पुरुष
  rationale: इब्रानी में पुल्लिंग एकवचन संज्ञा का वितरणात्मक प्रयोग है। ‘हर पुरुष’ मूल रूप को बनाए रखता है, जबकि पादटिप्पणी इसके व्यापक वितरणात्मक आशय को स्पष्ट करती है।
- source_word: תַּחַת גַּפְנוֹ וְתַחַת תְּאֵנָתוֹ
  choice: अपनी दाखलता और अपने अंजीर के पेड़ के नीचे
  rationale: शान्ति, सुरक्षा और समृद्धि की पारंपरिक छवि को व्याख्यात्मक भावानुवाद में बदलने के बजाय सुरक्षित रखा गया है।
- source_word: מִדָּן וְעַד בְּאֵר שָׁבַע
  choice: दान से लेकर बेर्शेबा तक
  rationale: यह पूरे देश की उत्तर से दक्षिण तक की सीमा बताने वाला भौगोलिक युग्म है; हिन्दी में प्रचलित स्थान-नाम रखे गए हैं।
- source_word: כֹּל יְמֵי שְׁלֹמֹה
  choice: सुलैमान के जीवन भर
  rationale: इससे सुलैमान के दिनों के दौरान इस स्थिति की निरन्तरता व्यक्त होती है; हिन्दी मुहावरे में यह स्वाभाविक और अर्थ-संगत है।
theological_decisions:
- issue: वितरणात्मक पुल्लिंग אִישׁ का अनुवाद
  choice: हर पुरुष
  alternative: हर व्यक्ति / हर कोई
  rationale: मुख्य पाठ इब्रानी के पुल्लिंग एकवचन रूप को सुरक्षित रखता है; पादटिप्पणी बताती है कि इसका प्रयोग वितरणात्मक है।
- issue: ‘अपनी दाखलता और अपने अंजीर के पेड़ के नीचे’ वाली समृद्धि की छवि
  choice: मुख्य पाठ में शाब्दिक छवि को बनाए रखना
  alternative: शान्ति और समृद्धि में रहना
  rationale: यह छवि शान्ति, सुरक्षा और अपनी भूमि के निर्भय उपभोग का साहित्यिक संकेत है; इसे बनाए रखने से पाठ का रूपक और अन्तर्पाठीय प्रभाव सुरक्षित रहता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण कथात्मक रूप अपनाया गया है। ‘दाखलता’ बाइबलीय-साहित्यिक छवि को स्पष्ट रखती है, जबकि वाक्य-विन्यास को सहज बनाने के लिए दीर्घांशों को डैश से अलग किया गया है।
