  text: He sent them to Lebanon[a], ten thousand a month in shifts; they would be in Lebanon one month and two months at home[c][b], and Adoniram was over the forced labor.
translation:
  language: hi
  text: उसने उन्हें लेबानोन भेजा—हर महीने दस हज़ार को बारी-बारी से। वे एक महीना लेबानोन में और दो महीने अपने घरों में रहते थे। अदोनीराम बेगार का प्रभारी था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁלָחֵם
  choice: वह उन्हें भेजता था
  rationale: प्रत्यय सहित क्रिया का अर्थ सीधे ‘उसने उन्हें भेजा’ है; प्रसंग में नियमित मासिक क्रम होने के कारण हिन्दी में अपूर्ण भूतकाल ‘भेजता था’ स्वाभाविक है।
- source_word: לְבָנוֹנָה
  choice: लेबानोन
  rationale: दिशासूचक प्रत्यय गति को लेबानोन की ओर बताता है; हिन्दी में ‘लेबानोन भेजता था’ पर्याप्त और स्वाभाविक है।
- source_word: עֲשֶׂרֶת אֲלָפִים בַּחֹדֶשׁ
  choice: हर महीने दस हज़ार
  rationale: मज़दूरों के आवर्तन के संदर्भ में בַּחֹדֶשׁ का वितरणात्मक अर्थ है—प्रति माह दस हज़ार।
- source_word: חֲלִיפוֹת
  choice: बारी-बारी से दलों में
  rationale: यह संज्ञा क्रमिक अदला-बदली या आवर्तन दर्शाती है; यह हिन्दी पदबंध कार्य-दलों की पाली स्पष्ट करता है।
- source_word: חֹדֶשׁ יִהְיוּ בַלְּבָנוֹן
  choice: वे एक महीना लेबानोन में रहते थे
  rationale: एकवचन חֹדֶשׁ अवधि बताता है; अगले ‘दो महीने’ के समानांतर हिन्दी में ‘एक’ स्पष्ट करना आवश्यक और स्वाभाविक है।
- source_word: שְׁנַיִם חֳדָשִׁים בְּבֵיתוֹ
  choice: दो महीने अपने घर पर रहते थे
  rationale: शाब्दिक रूप ‘उसके घर में’ है, पर एकवचन प्रत्यय समूह के प्रत्येक मज़दूर पर लागू होता है; ‘अपने घर पर’ हिन्दी में यह सामूहिक-वितरणात्मक भाव सहजता से व्यक्त करता है।
- source_word: וַאֲדֹנִירָם
  choice: अदोनीराम
  rationale: व्यक्तिनाम का देवनागरी लिप्यंतरण किया गया है।
- source_word: עַל הַמַּס
  choice: उस बेगार का अधिकारी था
  rationale: מַס राज्य द्वारा अनिवार्य श्रम-सेवा को दर्शाता है। ‘बेगार’ आधुनिक हिन्दी में बाध्यकारी श्रम का संक्षिप्त और सटीक शब्द है; ‘अधिकारी था’ עַל के प्रभारी होने के भाव को व्यक्त करता है।
