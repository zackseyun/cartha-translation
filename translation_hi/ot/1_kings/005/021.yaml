  to: जब हीराम ने सुलैमान की बातें सुनीं, तो वह बहुत आनन्दित हुआ और उसने कहा, “आज यहोवा धन्य हो, जिसने दाऊद को इस बड़ी प्रजा पर शासन करने के लिए एक बुद्धिमान पुत्र दिया है।”
  rationale: The sole revision changes “धन्य है” to “धन्य हो” so that Hiram’s utterance retains the force of a Hebrew blessing/acclamation. The remaining wording faithfully preserves the source’s meaning and is natural in a dignified modern Hindi biblical register.
