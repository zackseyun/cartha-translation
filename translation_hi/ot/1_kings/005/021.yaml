id: 1KI.5.21
reference: 1 Kings 5:21
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יְהִ֞י כִּ/שְׁמֹ֧עַ חִירָ֛ם אֶת דִּבְרֵ֥י שְׁלֹמֹ֖ה וַ/יִּשְׂמַ֣ח מְאֹ֑ד וַ/יֹּ֗אמֶר בָּר֤וּךְ יְהוָה֙ הַ/יּ֔וֹם אֲשֶׁ֨ר נָתַ֤ן לְ/דָוִד֙ בֵּ֣ן חָכָ֔ם עַל הָ/עָ֥ם הָ/רָ֖ב הַ/זֶּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/005/021.yaml
  text: And when Hiram heard the words of Solomon, he rejoiced greatly and said, “Blessed be the LORD today, who has given David a wise son over this great people.”
translation:
  language: hi
  text: जब हीराम ने सुलैमान की बातें सुनीं, तो वह बहुत आनन्दित हुआ और उसने कहा, “आज यहोवा धन्य हो, जिसने दाऊद को इस बड़ी प्रजा पर शासन करने के लिए एक बुद्धिमान पुत्र दिया है।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: דִּבְרֵי שְׁלֹמֹה
  choice: सुलैमान की बातें
  rationale: דברים यहाँ संदेश या कही गई बातों को सूचित करता है; सहज हिन्दी में बहुवचन ‘बातें’ मूल के निकट है।
- source_word: וַיִּשְׂמַח מְאֹד
  choice: वह बहुत आनन्दित हुआ
  rationale: क्रिया שמח और तीव्रतासूचक מְאֹד दोनों को स्पष्ट और dignified आधुनिक हिन्दी में व्यक्त करता है।
- source_word: בָּרוּךְ יְהוָה הַיּוֹם
  choice: आज यहोवा धन्य है
  rationale: ‘आज’ को मूल स्थानिक बल के निकट रखा गया है; יהוה को हिन्दी बाइबलीय परंपरा में प्रचलित ‘यहोवा’ से व्यक्त किया गया है।
- source_word: עַל הָעָם הָרָב הַזֶּה
  choice: इस बड़ी प्रजा पर शासन करने के लिए
  rationale: עַל का शाब्दिक अर्थ ‘पर’ है, पर राजपुत्र के संदर्भ में निहित शासकीय भूमिका को हिन्दी में स्वाभाविक बनाने के लिए ‘शासन करने के लिए’ स्पष्ट किया गया है; הָרָב का अर्थ यहाँ संख्या में बड़ी/बहुसंख्य प्रजा है।
theological_decisions:
- issue: हीराम द्वारा इस्राएल के परमेश्वर के नाम का उच्चारण
  choice: यहोवा
  alternative: प्रभु
  rationale: मूल में स्पष्ट रूप से दिव्य नाम יהוה है। ‘यहोवा’ नाम को प्रत्यक्ष रखता है और कथन को सामान्य उपाधि में नहीं बदलता।
- issue: ‘दाऊद को पुत्र दिया’ और राजकीय नियुक्ति का संबंध
  choice: जिसने दाऊद को इस बड़ी प्रजा पर शासन करने के लिए एक बुद्धिमान पुत्र दिया है
  alternative: जिसने इस बड़ी प्रजा के ऊपर दाऊद को एक बुद्धिमान पुत्र दिया है
  rationale: मूल की व्याकरणिक संरचना सुरक्षित रखते हुए हिन्दी में यह स्पष्ट किया गया है कि पुत्र प्रजा के ऊपर शासक के रूप में दिया गया; इससे कोई अतिरिक्त वंशगत या दैवी-पुत्रत्व सिद्धांत नहीं जोड़ा जाता।
translation_notes:
  register: आधुनिक मानक हिन्दी; गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। वाक्य की कथात्मक गति और हीराम के हर्षपूर्ण आशीर्वचन को बनाए रखा गया है।
