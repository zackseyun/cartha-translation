base_translation:
  language: en
  yaml_path: translation/ot/1_kings/005/009.yaml
  text: And God gave Solomon wisdom and very great understanding[a], and breadth of heart like the sand that is on the seashore.
translation:
  language: hi
  text: और परमेश्वर ने सुलैमान को बुद्धि, बहुत ही अधिक समझ और समुद्र के तट की रेत के समान मन की व्यापकता[a] दी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “हृदय की व्यापकता” या “हृदय का विस्तार।” इब्रानी में “हृदय” मन, बुद्धि या समझ की आंतरिक क्षमता को भी दर्शा सकता है।
    reason: मूल मुहावरे का शाब्दिक रूप और उसकी अर्थ-सीमा सुरक्षित रखना।
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: ने … दी
  rationale: נתן का सीधा अर्थ ‘देना’ है; हिन्दी में संयुक्त कर्मों के साथ वाक्य के अंत में ‘दी’ स्वाभाविक है।
- source_word: אֱלֹהִים
  choice: परमेश्वर
  rationale: यहाँ यह शब्द एकवचन क्रिया के साथ इस्राएल के परमेश्वर के लिए प्रयुक्त है।
- source_word: חָכְמָה
  choice: बुद्धि
  rationale: सुलैमान के प्रसंग में यह व्यावहारिक और राजकीय प्रज्ञा का सामान्य हिन्दी प्रतिशब्द है।
- source_word: לִשְׁלֹמֹה
  choice: सुलैमान को
  rationale: व्यक्तिनाम का प्रचलित हिन्दी बाइबलीय रूप रखा गया है और לִ उपसर्ग को ‘को’ से व्यक्त किया गया है।
- source_word: וּתְבוּנָה הַרְבֵּה מְאֹד
  choice: बहुत ही अधिक समझ
  rationale: תְבוּנָה की व्यापक अर्थ-सीमा को ‘समझ’ व्यक्त करता है, जबकि הַרְבֵּה מְאֹד की तीव्रता ‘बहुत ही अधिक’ से सुरक्षित रहती है।
- source_word: וְרֹחַב לֵב
  choice: मन की व्यापकता
  rationale: शाब्दिक रूप ‘हृदय की व्यापकता’ है, पर इब्रानी לֵב यहाँ बौद्धिक आंतरिक क्षमता को सूचित करता है। आधुनिक हिन्दी में ‘मन की व्यापकता’ भाव को स्पष्ट रखते हुए विस्तार का रूपक भी बचाती है।
- source_word: כַּחוֹל אֲשֶׁר עַל שְׂפַת הַיָּם
  choice: समुद्र के तट की रेत के समान
  rationale: इब्रानी उपमा को स्वाभाविक हिन्दी शब्दक्रम में रखा गया है; שְׂפַת הַיָּם का आशय समुद्र का तट है।
theological_decisions:
- issue: וְרֹחַב לֵב में मानव-अंतरंग का इब्रानी मुहावरा
  choice: मुख्य पाठ में ‘मन की व्यापकता’
  alternative: ‘हृदय की व्यापकता’ या ‘हृदय का विस्तार’
  rationale: לֵב केवल भावनाओं का केंद्र नहीं, बल्कि विचार, समझ और आंतरिक क्षमता का भी द्योतक हो सकता है। ‘हृदय’ आधुनिक हिन्दी में उदारता या भावना का अर्थ अधिक जगा सकता है; इसलिए अर्थ को अनावश्यक रूप से भावनात्मक बनाए बिना मूल विस्तार-रूपक को ‘मन की व्यापकता’ में रखा गया है और शाब्दिक रूप पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सहज हिन्दी में है। ‘बुद्धि’ और ‘समझ’ के निकट अर्थों को अलग रखा गया है, तीव्रता को ‘बहुत ही अधिक’ से व्यक्त किया गया है, और मूल के विस्तार-वाले रूपक को ‘मन की व्यापकता’ में बनाए रखा गया है।
