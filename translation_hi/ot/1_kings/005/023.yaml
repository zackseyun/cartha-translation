base_translation:
  language: en
  yaml_path: translation/ot/1_kings/005/023.yaml
  text: My servants will bring them down from Lebanon to the sea[a], and I will make them into rafts on the sea to the place that you direct me, and I will break them apart there, and you will carry them away[b]. And you shall do what I desire by giving food for my household.
translation:
  language: hi
  text: मेरे सेवक उन्हें लबानोन से समुद्र तक नीचे ले आएँगे, और मैं उन्हें समुद्र में बेड़े बनाकर उस स्थान तक पहुँचाऊँगा जिसका तुम मुझे निर्देश दोगे। वहाँ मैं उन्हें खोल दूँगा, और तुम उन्हें ले जाओगे। और तुम मेरे घराने के लिए भोजन देकर मेरी इच्छा पूरी करोगे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עֲבָדַי
  choice: मेरे सेवक
  rationale: राजकीय और प्रशासनिक संदर्भ में यह हीराम के अधीन काम करने वालों को सूचित करता है; उनकी बंधुआ स्थिति पर बल नहीं है।
- source_word: יֹרִדוּ
  choice: नीचे ले आएँगे
  rationale: हिफ़ील रूप का कारक अर्थ सुरक्षित रहता है और लबानोन से समुद्र की ओर लकड़ी उतारने की क्रिया स्वाभाविक हिन्दी में व्यक्त होती है।
- source_word: יָמָּה
  choice: समुद्र तक
  rationale: रूप का अर्थ ‘समुद्र की ओर’ भी हो सकता है, पर समुद्री परिवहन के प्रसंग में समुद्र गंतव्य है।
- source_word: דֹּבְרוֹת
  choice: बेड़े
  rationale: यह तैराकर ले जाने के लिए साथ बाँधी गई लकड़ियों के बेड़ों को सूचित करता है; संक्षिप्त मुख्य पाठ के साथ अधिक स्पष्ट विकल्प पादटिप्पणी में दिया गया है।
- source_word: עַד הַמָּקוֹם אֲשֶׁר תִּשְׁלַח אֵלַי
  choice: उस स्थान तक ... जिसके बारे में तुम मुझे संदेश भेजोगे
  rationale: मूल में ‘मेरे पास भेजना’ है और भेजी जाने वाली वस्तु व्यक्त नहीं की गई; हिन्दी में ‘संदेश’ जोड़ना व्यावहारिक आशय स्पष्ट करता है, पर किसी औपचारिक नियुक्ति का अर्थ आरोपित नहीं करता।
- source_word: וְנִפַּצְתִּים
  choice: मैं उन्हें खोल दूँगा
  rationale: इस प्रसंग में क्रिया बेड़ों को गंतव्य पर अलग करने या विखंडित करने को सूचित करती है; ‘खोल दूँगा’ लकड़ी के बेड़ों के लिए स्वाभाविक हिन्दी है।
- source_word: תִשָּׂא
  choice: तुम उन्हें ले जाना
  rationale: נשא का व्यापक अर्थ उठाना, ढोना या ले जाना है; यहाँ अलग की गई लकड़ियों को आगे ले जाने का आशय है।
- source_word: חֶפְצִי
  choice: मेरी इच्छा
  rationale: यह संज्ञा इच्छा, चाह या प्रसन्नता को सूचित करती है; ‘मेरी इच्छा पूरी करना’ वर्तमान हिन्दी में स्वाभाविक है।
- source_word: לָתֵת לֶחֶם בֵּיתִי
  choice: मेरे घराने के लिए भोजन देकर
  rationale: ‘रोटी’ यहाँ समस्त भोजन या रसद के लिए लाक्षणिक प्रयोग है; ‘घराना’ राजकीय गृहस्थी और उसके लोगों को समेटता है।
