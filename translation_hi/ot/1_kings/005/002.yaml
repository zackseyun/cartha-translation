lexical_decisions:
- source_word: וַיְהִי
  choice: थी
  rationale: वाव-क्रमयुक्त היה कथात्मक क्रम में यह विवरण प्रस्तुत करता है। हिंदी में वाक्य के अंत का ‘थी’ स्वाभाविक रूप से अस्तित्व/स्थिति व्यक्त करता है; किसी अतिरिक्त ‘अब’ या पुरातन ‘ऐसा हुआ’ की आवश्यकता नहीं है।
- source_word: לֶחֶם שְׁלֹמֹה
  choice: सुलैमान के लिए ... भोजन-सामग्री
  rationale: לֶחֶם का मूल अर्थ ‘रोटी’ है, पर राजकीय प्रशासन के इस संदर्भ में यह सुलैमान के घराने के दैनिक खाद्य-प्रबंध को व्यापक रूप से दर्शाता है। ‘भोजन-सामग्री’ मापे गए मैदे और आटे के संदर्भ में स्पष्ट और स्वाभाविक है।
- source_word: לְיוֹם אֶחָד
  choice: प्रतिदिन की
  rationale: शाब्दिक अर्थ ‘एक दिन के लिए’ है; यहाँ आशय एक दिन की नियमित खपत से है। ‘प्रतिदिन की’ आधुनिक हिंदी में संक्षिप्त और स्वाभाविक है।
- source_word: שְׁלֹשִׁים כֹּר / שִׁשִּׁים כֹּר
  choice: तीस कोर / साठ कोर
  rationale: प्राचीन माप כֹּר को अनुमानित आधुनिक मात्रा में बदलने के बजाय लिप्यंतरित किया गया है, जिससे मूल पाठ की विशिष्टता बनी रहती है।
- source_word: סֹלֶת
  choice: मैदा
  rationale: यह बारीक पिसे हुए उत्तम आटे को दर्शाता है। ‘मैदा’ साधारण हिंदी पाठक के लिए बारीक आटे का स्पष्ट नाम है और अगले קָמַח से भेद बनाए रखता है।
- source_word: קָמַח
  choice: आटा
  rationale: यह सामान्य पिसे हुए अनाज/आटे को दर्शाता है। ‘आटा’ पहले आए बारीक ‘मैदा’ से सहज भेद प्रकट करता है।
