  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। मुहावरे בְּנֵי קֶדֶם को शाब्दिक ‘पूर्व के पुत्र’ के बजाय अर्थ-स्पष्ट ‘पूर्व के लोग’ किया गया है; इससे किसी अनावश्यक फुटनोट के बिना सामान्य पाठक के लिए आशय स्पष्ट रहता है।
