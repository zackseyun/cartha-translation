source:
  edition: WLC
  text: וַ/תֵּ֨רֶב֙ חָכְמַ֣ת שְׁלֹמֹ֔ה מֵֽ/חָכְמַ֖ת כָּל בְּנֵי קֶ֑דֶם וּ/מִ/כֹּ֖ל חָכְמַ֥ת מִצְרָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/005/010.yaml
  text: And Solomon’s wisdom surpassed the wisdom of all the people of the east and all the wisdom of Egypt[a].
translation:
  language: hi
  text: और सुलैमान की बुद्धि पूर्व के सभी लोगों की बुद्धि और मिस्र की सारी बुद्धि से बढ़कर थी।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתֵּרֶב
  choice: बढ़कर थी
  rationale: רבה के साथ तुलनात्मक מן यहाँ मात्रा में केवल वृद्धि नहीं, बल्कि श्रेष्ठता व्यक्त करता है। हिंदी में ‘से बढ़कर थी’ इस तुलना को स्वाभाविक और स्पष्ट रूप से व्यक्त करता है।
- source_word: חָכְמַת
  choice: बुद्धि
  rationale: इस प्रसंग में חָכְמָה व्यापक रूप से विवेक, ज्ञान और बौद्धिक उत्कृष्टता को दर्शाता है; ‘बुद्धि’ मानक और संदर्भानुकूल हिंदी शब्द है।
- source_word: שְׁלֹמֹה
  choice: सुलैमान
  rationale: व्यक्तिनाम का हिंदी बाइबल परंपरा में प्रचलित रूप।
- source_word: כָּל בְּנֵי קֶדֶם
  choice: पूर्व के सभी लोगों
  rationale: शाब्दिक रूप ‘पूर्व के पुत्र’ है, किंतु यह एक मुहावरेदार जातीय-भौगोलिक पद है। ‘पूर्व के सभी लोगों’ आधुनिक हिंदी में इसका अर्थ स्वाभाविक ढंग से देता है और כָּל की समग्रता बनाए रखता है।
- source_word: וּמִכֹּל חָכְמַת מִצְרָיִם
  choice: और मिस्र की सारी बुद्धि से
  rationale: दूसरा तुलनात्मक पद उसी क्रिया पर निर्भर है। ‘सारी’ כָּל की व्यापकता रखता है और ‘से’ तुलनात्मक מן को व्यक्त करता है।
- source_word: מִצְרָיִם
  choice: मिस्र
  rationale: स्थाननाम का मानक हिंदी रूप।
theological_decisions: []
