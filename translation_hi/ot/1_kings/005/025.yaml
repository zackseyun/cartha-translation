  text: וּ/שְׁלֹמֹה֩ נָתַ֨ן לְ/חִירָ֜ם עֶשְׂרִים֩ אֶ֨לֶף כֹּ֤ר חִטִּים֙ מַכֹּ֣לֶת לְ/בֵית֔/וֹ וְ/עֶשְׂרִ֥ים כֹּ֖ר שֶׁ֣מֶן כָּתִ֑ית כֹּֽה יִתֵּ֧ן שְׁלֹמֹ֛ה לְ/חִירָ֖ם שָׁנָ֥ה בְ/שָׁנָֽה־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/005/025.yaml
  text: And Solomon gave Hiram twenty thousand cors of wheat as food for his household[a], and twenty cors of beaten oil[b]. Thus Solomon would give to Hiram year by year.
translation:
  language: hi
  text: सुलैमान ने हीराम को उसके घराने के भोजन के लिए बीस हज़ार कोर गेहूँ और बीस कोर कूटा हुआ तेल[a] दिया। सुलैमान हीराम को प्रति वर्ष इतना ही देता था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “कूटा हुआ तेल” उच्च कोटि का तेल था, जिसे जैतूनों को कूटकर या कुचलकर निकाला जाता था, न कि बाद की दबाव वाली प्रक्रिया से।
    reason: cultural_note
lexical_decisions:
- source_word: נָתַן / יִתֵּן
  choice: दिया / देता था
  rationale: पहला क्रियारूप पूर्ण हुई व्यवस्था बताता है, जबकि כֹּה और שָׁנָה בְשָׁנָה के साथ दूसरा क्रियारूप भूतकाल में नियमित रूप से दिए जाने को व्यक्त करता है।
- source_word: כֹּר
  choice: कोर
  rationale: यह प्राचीन परिमाण की विशिष्ट इकाई है; लिप्यंतरण मूल की सटीकता बनाए रखता है, जबकि केवल ‘माप’ कहना अस्पष्ट होता।
- source_word: חִטִּים
  choice: गेहूँ
  rationale: यह शब्द सामान्य अनाज नहीं, विशेष रूप से गेहूँ को दर्शाता है।
- source_word: מַכֹּלֶת לְבֵיתוֹ
  choice: उसके घराने के भोजन के लिए
  rationale: מַכֹּלֶת भोजन अथवा रसद है और לְבֵיתוֹ यहाँ हीराम के राजकीय घराने को सूचित करता है; यह अनुवाद अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: שֶׁמֶן כָּתִית
  choice: कूटा हुआ तेल
  rationale: כָּתִית उस उत्तम तेल को दर्शाता है जो जैतूनों को कूटकर निकाला जाता था; मूल में ‘जैतून’ स्पष्ट रूप से नहीं है, इसलिए उसे मुख्य पाठ में नहीं जोड़ा गया।
- source_word: כֹּה
  choice: इतना ही
  rationale: यह पहले बताई गई मात्रा और व्यवस्था की ओर संकेत करके उसके वार्षिक दोहराव को जोड़ता है।
- source_word: שָׁנָה בְשָׁנָה
  choice: प्रति वर्ष
  rationale: यह इब्रानी मुहावरा नियमित वार्षिक पुनरावृत्ति व्यक्त करता है; ‘प्रति वर्ष’ आधुनिक हिन्दी में सहज है।
