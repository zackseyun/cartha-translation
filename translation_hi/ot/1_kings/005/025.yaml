  register: आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण शैली रखी गई है। प्राचीन इकाई ‘कोर’ को लिप्यंतरित किया गया है। ‘घराना’ यहाँ केवल भवन नहीं, हीराम के राजकीय परिवार और आश्रितों के व्यापक अर्थ को व्यक्त करता है।
