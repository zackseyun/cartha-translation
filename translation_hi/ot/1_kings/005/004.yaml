  text: כִּי ה֞וּא רֹדֶ֣ה בְּ/כָל עֵ֣בֶר הַ/נָּהָ֗ר מִ/תִּפְסַח֙ וְ/עַד עַזָּ֔ה בְּ/כָל מַלְכֵ֖י עֵ֣בֶר הַ/נָּהָ֑ר וְ/שָׁל֗וֹם הָ֥יָה ל֛/וֹ מִ/כָּל עֲבָרָ֖י/ו מִ/סָּבִֽיב־׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/005/004.yaml
  text: For he was ruling over all the region beyond the River[a], from Tiphsah to Gaza, over all the kings beyond the River[b]; and he had peace on all sides around him.
translation:
  language: hi
  text: क्योंकि वह नदी[a] के पार के सारे प्रदेश पर—तिप्सह से लेकर गाज़ा तक—और नदी के पार के सभी राजाओं पर शासन करता था; और उसके चारों ओर हर तरफ शांति थी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात् फरात नदी।
    reason: cultural_note
lexical_decisions:
- source_word: רֹדֶה
  choice: शासन करता था
  rationale: इब्रानी कृदन्त निरन्तर शासन या प्रभुत्व को व्यक्त करता है; ‘शासन करता था’ आधुनिक हिन्दी में उसके जारी रहने का भाव स्वाभाविक रूप से देता है।
- source_word: בְּכָל עֵבֶר הַנָּהָר
  choice: महानद के पार के सारे प्रदेश पर
  rationale: עֵבֶר הַנָּהָר एक भौगोलिक अभिव्यक्ति है। ‘प्रदेश’ जोड़ने से क्षेत्रगत अर्थ स्पष्ट और हिन्दी में स्वाभाविक होता है; הַנָּהָר को उसके पारम्परिक सन्दर्भ के अनुरूप ‘महानद’ कहा गया है।
- source_word: הַנָּהָר
  choice: महानद
  rationale: मूल में निश्चित साधारण संज्ञा ‘नदी’ है, जो यहाँ फरात का रूढ़ संकेत है। ‘महानद’ इस संकेत को मुख्य पाठ में संक्षिप्त और गरिमापूर्ण ढंग से रखता है, जबकि पादटिप्पणी वास्तविक नदी स्पष्ट करती है।
- source_word: מִתִּפְסַח וְעַד עַזָּה
  choice: तिप्सह से लेकर गाज़ा तक
  rationale: यह सुलैमान के शासन की भौगोलिक सीमा बताता है। स्थान-नामों का निकट देवनागरी लिप्यन्तरण किया गया है।
- source_word: בְּכָל מַלְכֵי עֵבֶר הַנָּהָר
  choice: महानद के पार के सभी राजाओं पर
  rationale: पूर्वसर्ग और प्रसंग उन राजाओं पर सुलैमान के राजनीतिक प्रभुत्व को व्यक्त करते हैं; ‘राजाओं पर’ इसे बिना अतिरिक्त व्याख्या के सुरक्षित रखता है।
- source_word: וְשָׁלוֹם הָיָה לוֹ
  choice: उसके लिए शान्ति थी
  rationale: शाब्दिक संरचना ‘उसके लिए शान्ति थी’ है। हिन्दी मुख्य पाठ में आसपास के क्षेत्रों से मिलने वाली राजनीतिक शान्ति और सुरक्षा का भाव स्वाभाविक वाक्य-विन्यास में रखा गया है।
- source_word: מִכָּל עֲבָרָיו מִסָּבִיב
  choice: उसके चारों ओर हर ओर
  rationale: यह मुहावरा सभी आसपास की दिशाओं या क्षेत्रों से शान्ति का बोध देता है। ‘चारों ओर हर ओर’ व्यापकता बनाए रखता है और עֲבָרָיו को अनावश्यक रूप से ‘पड़ोसी’ नहीं बनाता।
