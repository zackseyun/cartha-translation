source:
  edition: WLC
  text: וַ/יָּבֹ֨אוּ֙ מִ/כָּל הָ֣/עַמִּ֔ים לִ/שְׁמֹ֕עַ אֵ֖ת חָכְמַ֣ת שְׁלֹמֹ֑ה מֵ/אֵת֙ כָּל מַלְכֵ֣י הָ/אָ֔רֶץ אֲשֶׁ֥ר שָׁמְע֖וּ אֶת חָכְמָתֽ/וֹ־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/005/014.yaml
  text: And people from all the peoples came to hear the wisdom of Solomon[b][a], from all the kings of the earth who had heard of his wisdom.
translation:
  language: hi
  text: सब जातियों में से लोग सुलैमान की बुद्धि सुनने आए[a]—पृथ्वी के उन सभी राजाओं के पास से जिन्होंने उसकी बुद्धि के विषय में सुना था[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “सब राष्ट्रों में से लोग।” इब्रानी עַमִּים बहुवचन है और ‘जातियों’ या ‘राष्ट्रों’ के अर्थ में हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “पृथ्वी के सभी राजाओं से।” इब्रानी वाक्यांश संक्षिप्त है; इसका अर्थ यह हो सकता है कि ये लोग उन राजाओं के यहाँ से आए थे, या उनके द्वारा भेजे गए थे, जिन्होंने सुलैमान की बुद्धि की ख्याति सुनी थी।
    reason: cultural_note
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: आते थे
  rationale: पूर्ववर्ती ख्याति-वर्णन के संदर्भ में यह एक बार की घटना के बजाय लोगों के निरंतर आने का स्वाभाविक हिन्दी वर्णन है; इब्रानी कथात्मक रूप को संदर्भानुसार अपूर्ण भूतकाल से व्यक्त किया गया है।
- source_word: מִכָּל הָעַמִּים
  choice: सब जातियों में से
  rationale: बहुवचन עַמִּים अलग-अलग जनसमूहों या राष्ट्रों को सूचित करता है। ‘जातियों’ से बहुवचन और सामूहिक अर्थ दोनों सुरक्षित रहते हैं।
- source_word: לִשְׁמֹעַ
  choice: सुनने
  rationale: आने का उद्देश्य बताने वाले infinitive का सीधा और स्वाभाविक हिन्दी अनुवाद।
- source_word: חָכְמַת שְׁלֹמֹה
  choice: सुलैमान की बुद्धि
  rationale: इब्रानी संबंध-रचना का स्पष्ट, संक्षिप्त और स्वाभाविक हिन्दी रूप।
- source_word: מֵאֵת כָּל מַלְכֵי הָאָרֶץ
  choice: पृथ्वी के उन सभी राजाओं की ओर से
  rationale: מֵאֵת यहाँ स्रोत अथवा प्रतिनिधित्व का संकेत दे सकता है। ‘की ओर से’ संक्षिप्त इब्रानी वाक्यांश को बोधगम्य बनाता है, जबकि पादटिप्पणी में अधिक शाब्दिक संभावना रखी गई है।
- source_word: אֲשֶׁר שָׁמְעוּ אֶת חָכְמָתוֹ
  choice: जिन्होंने उसकी बुद्धि के विषय में सुना था
  rationale: यहाँ सुनना प्रत्यक्ष वचन सुनने के बजाय सुलैमान की बुद्धि की ख्याति सुनने के अर्थ में है; ‘के विषय में’ हिन्दी में यह अर्थ स्पष्ट करता है।
