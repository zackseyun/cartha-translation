  text: ten fattened cattle[a], and twenty pasture-fed cattle, and a hundred sheep[c][b], besides deer and gazelles and roebucks and fattened fowl.
translation:
  language: hi
  text: दस मोटे किए हुए गाय-बैल, चरागाह में पाले गए बीस गाय-बैल, और सौ भेड़-बकरियाँ; इनके अलावा हिरन, चिकारे, यख़मूर[a] और मोटे किए हुए पक्षी[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘यख़मूर’ की ठीक पहचान अनिश्चित है; संभवतः यह हिरन की कोई जाति थी, जैसे रो डियर या फ़ैलो डियर।
    reason: lexical_alternative
  - marker: b
    text: या, ‘मोटे किए हुए हंस’; בַרְבֻּרִים से अभिप्रेत पक्षी की ठीक जाति अनिश्चित है।
    reason: lexical_alternative
lexical_decisions:
- source_word: בָקָר בְּרִאִים
  choice: मोटे किए हुए गाय-बैल
  rationale: בָקָר मवेशियों के लिए सामूहिक संज्ञा है और בְּרִאִים यहाँ मोटे अथवा अच्छी तरह खिलाए गए पशुओं को दर्शाता है। ‘गाय-बैल’ सामान्य पाठक के लिए इस सामूहिक अर्थ को स्पष्ट करता है।
- source_word: בָּקָר רְעִי
  choice: चरागाह में पाले गए गाय-बैल
  rationale: רְעִי चरने या चरागाह से जुड़ा है; यह पद पहले बताए गए विशेष रूप से मोटे किए हुए मवेशियों से पशुपालन का भेद बनाए रखता है।
- source_word: צֹאן
  choice: भेड़-बकरियाँ
  rationale: צֹאן छोटे पालतू पशुओं के झुंड, विशेषकर भेड़ और बकरियों, दोनों को समेट सकता है। हिंदी में ‘भेड़-बकरियाँ’ मूल की व्यापकता को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: לְבַד
  choice: इनके अलावा
  rationale: यह पहले गिनाई गई दैनिक सामग्री के अतिरिक्त वस्तुओं का परिचय देता है।
- source_word: אַיָּל
  choice: हिरन
  rationale: यह हिरन, संभवतः नर हिरन, को सूचित करता है; ‘हिरन’ आधुनिक हिंदी का सुबोध व्यापक शब्द है।
- source_word: צְבִי
  choice: चिकारे
  rationale: צְבִי सामान्यतः gazelle को दर्शाता है; भारतीय हिंदी में ‘चिकारा’ एक सहज और निकट प्राणी-संज्ञा है। सूची के सामूहिक भाव के अनुसार बहुवचन रखा गया है।
- source_word: יַחְמוּר
  choice: यख़मूर
  rationale: प्राणी की सटीक पहचान अनिश्चित है। किसी एक आधुनिक जाति को निश्चित ठहराने के बजाय स्रोत-शब्द का लिप्यंतरण मूल की अनिश्चितता बचाता है, और पादटिप्पणी संभावित अर्थ देती है।
- source_word: בַרְבֻּרִים אֲבוּסִים
  choice: मोटे किए हुए पक्षी
  rationale: पक्षी की ठीक जाति अनिश्चित है, जबकि אֲבוּסִים उनके खिलाकर मोटा किए जाने का भाव देता है। व्यापक अनुवाद अनुचित अति-विशिष्टता से बचता है।
