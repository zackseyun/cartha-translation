source:
  edition: WLC
  text: וַ/יְצַ֣ו הַ/מֶּ֡לֶךְ וַ/יַּסִּעוּ֩ אֲבָנִ֨ים גְּדֹל֜וֹת אֲבָנִ֧ים יְקָר֛וֹת לְ/יַסֵּ֥ד הַ/בָּ֖יִת אַבְנֵ֥י גָזִֽית׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/005/031.yaml
  text: Then the king commanded[a], and they quarried great stones, costly stones, cut stones[b], to lay the foundation of the house.
translation:
  language: hi
  text: तब राजा ने आज्ञा दी, और उन्होंने भवन[b] की नींव डालने के लिए बड़े, बहुमूल्य, तराशे हुए पत्थर[a] निकलवाए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘काटकर तैयार किए हुए पत्थर।’
    reason: lexical_alternative
  - marker: b
    text: अर्थात् मंदिर; इब्रानी में ‘घर’ है।
    reason: cross_reference
lexical_decisions:
- source_word: וַיְצַו
  choice: तब ... ने आज्ञा दी
  rationale: वय्यिक्तोल कथानक में अगली क्रिया को आगे बढ़ाता है; ‘तब’ क्रम को स्वाभाविक हिन्दी में व्यक्त करता है और ‘आज्ञा दी’ צוה का सीधा अर्थ देता है।
- source_word: וַיַּסִּעוּ
  choice: उन्होंने ... खदान से निकलवाए
  rationale: נסע के हिफ़ील रूप का मूल भाव हटाने या निकलवाने का है। निर्माण के प्रसंग में पत्थरों को खदान से निकलवाना अभिप्रेत है; यह अनुवाद प्रसंगगत अर्थ और कारक रूप दोनों को व्यक्त करता है।
- source_word: אֲבָנִים גְּדֹלוֹת
  choice: बड़े-बड़े ... पत्थर
  rationale: यह हिन्दी में बड़े आकार पर स्वाभाविक बल देता है और मूल के संज्ञा-विशेषण संबंध को बनाए रखता है।
- source_word: אֲבָנִים יְקָרוֹת
  choice: बहुमूल्य पत्थर
  rationale: יקר यहाँ रत्नों की अपेक्षा मूल्यवान या महँगी निर्माण-सामग्री का संकेत देता है। ‘बहुमूल्य’ गरिमापूर्ण है और उच्च मूल्य या गुणवत्ता दोनों को समेट सकता है।
- source_word: לְיַסֵּד
  choice: नींव डालने के लिए
  rationale: निर्माण के प्रसंग में יסד का यही स्वाभाविक और स्पष्ट हिन्दी मुहावरा है।
- source_word: הַבָּיִת
  choice: भवन
  rationale: मूल शब्द का शाब्दिक अर्थ ‘घर/भवन’ है। यहाँ ‘भवन’ गरिमापूर्ण हिन्दी में उपयुक्त है, जबकि प्रसंग में उससे मंदिर अभिप्रेत है।
- source_word: אַבְנֵי גָזִית
  choice: तराशे हुए पत्थर
  rationale: גזית काटकर या गढ़कर तैयार किए गए पत्थरों को दर्शाता है। ‘तराशे हुए पत्थर’ आधुनिक पाठक के लिए स्पष्ट है और इसे पहले उल्लिखित पत्थरों के समानाधिकरणात्मक वर्णन के रूप में रखा गया है।
