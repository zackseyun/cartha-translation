base_translation:
  language: en
  yaml_path: translation/ot/1_kings/005/013.yaml
  text: He spoke about the trees[a], from the cedar that is in Lebanon to the hyssop that grows out of the wall; he also spoke about the animals and the birds and the creeping things and the fish.
translation:
  language: hi
  text: उसने वृक्षों के विषय में बात की—लेबानोन के देवदार से लेकर उस जूफ़े[a] तक, जो दीवार में उगता है। उसने पशुओं, पक्षियों, रेंगने वाले जीवों और मछलियों के विषय में भी बात की।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या संभवतः “कोई छोटा सुगंधित पौधा”; इब्रानी אֵזוֹב की ठीक वनस्पतिक पहचान अनिश्चित है, यद्यपि परंपरागत रूप से इसका अनुवाद “जूफ़ा” किया जाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר עַל
  choice: के विषय में बताया
  rationale: דבר עם על का अर्थ किसी विषय के बारे में बोलना है। संदर्भ में सुलैमान के व्यापक ज्ञान का वर्णन है; ‘बताया’ स्वाभाविक हिन्दी में इस अर्थ को व्यक्त करता है, बिना इसे तकनीकी शिक्षा या वैज्ञानिक वर्गीकरण बना देने के।
- source_word: הָעֵצִים
  choice: पेड़-पौधों
  rationale: עֵצִים का मूल अर्थ ‘पेड़/काष्ठीय पौधे’ है, पर यहाँ देवदार से लेकर छोटे जूफ़े तक का विस्तार है। ‘पेड़-पौधों’ से इस वनस्पतिक व्यापकता को स्वाभाविक हिन्दी में व्यक्त किया गया है।
- source_word: הָאֶרֶז אֲשֶׁר בַּלְּבָנוֹן
  choice: लेबानोन के देवदार
  rationale: אֶרֶז लेबानोन से प्रसिद्ध देवदार को सूचित करता है। हिन्दी में संबंधसूचक ‘लेबानोन के’ स्थानवाचक इब्रानी पद का सहज रूप है।
- source_word: מִן ... וְעַד
  choice: से लेकर ... तक
  rationale: यह युग्म दो छोरों द्वारा पूरे विस्तार को दिखाता है। ‘से लेकर ... तक’ हिन्दी में इस संरचना को स्पष्ट और स्वाभाविक रूप से बनाए रखता है।
- source_word: הָאֵזוֹב
  choice: जूफ़े
  rationale: परंपरागत रूप से इसे ‘hyssop’ समझा जाता है, जिसका प्रचलित हिन्दी रूप ‘जूफ़ा’ है; विभक्ति के कारण पाठ में ‘जूफ़े’ रखा गया है। वनस्पति की ठीक पहचान अनिश्चित होने के कारण पादटिप्पणी दी गई है।
- source_word: יֹצֵא בַּקִּיר
  choice: दीवार में उगने वाले
  rationale: शाब्दिक भाव ‘दीवार में से निकलता है’ है। वनस्पतिक संदर्भ में ‘दीवार में उगने वाले’ स्पष्ट है और मूल बिंब को बनाए रखता है।
- source_word: הַבְּהֵמָה
  choice: पशुओं
  rationale: यहाँ शब्द व्यापक प्राणी-वर्ग का द्योतक है; ‘पशुओं’ का अर्थ ‘मवेशियों’ से अधिक व्यापक और सूची के संदर्भ के अनुकूल है।
- source_word: הָעוֹף
  choice: पक्षियों
  rationale: עוֹף उड़ने वाले जीवों को सूचित कर सकता है, पर इस वर्ग-सूची में ‘पक्षियों’ सबसे स्वाभाविक अर्थ है।
- source_word: הָרֶמֶשׂ
  choice: रेंगने वाले जीवों
  rationale: רֶמֶשׂ केवल आधुनिक वर्ग ‘सरीसृप’ तक सीमित नहीं है, इसलिए व्यापक अभिव्यक्ति चुनी गई है।
- source_word: הַדָּגִים
  choice: मछलियों
  rationale: सामान्य प्राणी-वर्ग के रूप में דגים का सीधा और स्वाभाविक हिन्दी रूप ‘मछलियाँ’ है।
