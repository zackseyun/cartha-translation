  yaml_path: translation/ot/1_kings/005/007.yaml
  text: These deputies provided for King Solomon and for all who came near the table of King Solomon[a], each in his month[b]; they lacked nothing.
translation:
  language: hi
  text: इन नियुक्त अधिकारियों[a] ने राजा सुलैमान और उन सबके लिए जो राजा सुलैमान की मेज़ के पास आते थे[b], आवश्यक सामग्री उपलब्ध कराई। हर एक ने अपने महीने में ऐसा किया; उन्होंने किसी चीज़ की कमी नहीं होने दी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “पदाधिकारी” अथवा “प्रशासक।” हिब्रू शब्द जिलों पर नियुक्त प्रशासनिक अधिकारियों को दर्शाता है।
    reason: lexical_alternative
  - marker: b
    text: 'शाब्दिक अर्थ: “जो राजा सुलैमान की मेज़ के निकट आते थे।” यह अभिव्यक्ति उन लोगों को दर्शाती है जिन्हें राजकीय मेज़ तक पहुँच प्राप्त थी।'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִלְכְּלוּ
  choice: भोजन-सामग्री जुटाई
  rationale: पिएल रूप यहाँ राजकीय व्यवस्था के लिए आवश्यक सामग्री, विशेषतः भोजन, उपलब्ध कराने का अर्थ देता है। यह चयन प्रसंग को स्पष्ट करता है, पर आपूर्ति की विधि को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: הַנִּצָּבִים הָאֵלֶּה
  choice: इन नियुक्त अधिकारियों
  rationale: נצב इस प्रशासनिक प्रसंग में जिलों पर नियुक्त प्रतिनिधि अधिकारियों को दर्शाता है। ‘नियुक्त अधिकारी’ आधुनिक हिन्दी में स्वाभाविक है और आधुनिक राजनीतिक ‘राज्यपाल’ जैसे भ्रामक अर्थ से बचता है।
- source_word: אֶת הַמֶּלֶךְ שְׁלֹמֹה
  choice: राजा सुलैमान
  rationale: हिब्रू के पदवी और नाम वाले पदबंध का स्वाभाविक हिन्दी रूप।
- source_word: וְאֵת כָּל הַקָּרֵב אֶל שֻׁלְחַן הַמֶּלֶךְ שְׁלֹמֹה
  choice: और उन सबके लिए, जो राजा सुलैमान की मेज़ के निकट आते थे
  rationale: ‘निकट आने’ की मूल हिब्रू छवि सुरक्षित रखी गई है; प्रसंग में यह राजकीय मेज़ तक पहुँच रखने या वहाँ भोजन करने वालों को सूचित करता है।
- source_word: אִישׁ חָדְשׁוֹ
  choice: हर एक ने अपने निर्धारित महीने में
  rationale: यह वितरणात्मक मुहावरा अधिकारियों की मासिक बारी बताता है। ‘निर्धारित’ जोड़ने से बारी का आशय सहज हिन्दी में स्पष्ट होता है।
- source_word: לֹא יְעַדְּרוּ דָּבָר
  choice: उन्होंने किसी वस्तु की कमी न होने दी
  rationale: यह अभिव्यक्ति बताती है कि आवश्यक आपूर्ति में कुछ भी अनुपस्थित नहीं था। हिन्दी रूप अधिकारियों की आपूर्ति-संबंधी जिम्मेदारी और उसके परिणाम दोनों को स्वाभाविक ढंग से व्यक्त करता है।
