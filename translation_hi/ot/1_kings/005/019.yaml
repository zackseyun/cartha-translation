base_translation:
  language: en
  yaml_path: translation/ot/1_kings/005/019.yaml
  text: And behold[a], I intend to build a house for the name of Yahweh my God, just as Yahweh spoke to David my father, saying, ‘Your son, whom I will set in your place on your throne[c][b], he will build the house for my name.’
translation:
  language: hi
  text: और अब मैं अपने परमेश्वर यहोवा के नाम के लिए एक भवन[a] बनाने का निश्चय करता हूँ, ठीक वैसे ही जैसे यहोवा ने मेरे पिता दाऊद से कहा था, ‘तेरा पुत्र, जिसे मैं तेरे स्थान पर तेरे सिंहासन पर बैठाऊँगा[b], वही मेरे नाम के लिए यह भवन बनाएगा।’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “एक मन्दिर”; इब्रानी में शाब्दिक अर्थ “एक घर” है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में शाब्दिक रूप से “जिसे मैं तेरे स्थान पर दूँगा/रखूँगा”; आशय राजकीय उत्तराधिकारी नियुक्त करने से है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנְנִי אֹמֵר
  choice: और अब मैं ... बनवाने का निश्चय करता हूँ
  rationale: הִנְנִי ध्यान आकर्षित कर वर्तमान घोषणा की ओर संकेत करता है; आधुनिक हिन्दी में ‘और अब’ स्वाभाविक है। אֹמֵר के साथ निर्माणार्थक infinitive यहाँ संकल्प या अभिप्राय व्यक्त करता है। राजा के संदर्भ में ‘बनवाने’ से उसके द्वारा कार्य कराए जाने का स्वाभाविक भाव आता है।
- source_word: לִבְנוֹת בַּיִת
  choice: एक भवन बनवाने
  rationale: בַּיִת का मूल अर्थ ‘घर/भवन’ है। ‘भवन’ हिन्दी में गरिमापूर्ण और सहज है तथा सीधे ‘मन्दिर’ कहकर मूल रूपक को समाप्त नहीं करता।
- source_word: לְשֵׁם יְהוָה אֱלֹהָי
  choice: अपने परमेश्वर यहोवा के नाम के लिए
  rationale: ‘नाम के लिए’ की इब्रानी मन्दिर-संबंधी अभिव्यक्ति को बनाए रखा गया है; इसे केवल ‘सम्मान के लिए’ कहकर संकुचित नहीं किया गया।
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिन्दी बाइबल परंपरा में प्रचलित और पहचाना जाने वाला व्यक्तिगत नाम ‘यहोवा’ प्रयुक्त है, न कि उपाधि ‘प्रभु’।
- source_word: כַּאֲשֶׁר דִּבֶּר
  choice: ठीक वैसे ही जैसे ... कहा था
  rationale: यह अनुवाद सुलैमान के संकल्प और पहले दिए गए ईश्वरीय वचन के बीच स्पष्ट अनुरूपता बनाए रखता है।
- source_word: אֲשֶׁר אֶתֵּן תַּחְתֶּיךָ עַל כִּסְאֶךָ
  choice: जिसे मैं तेरे स्थान पर तेरे सिंहासन पर बैठाऊँगा
  rationale: शाब्दिक ‘दूँगा/रखूँगा’ का राजकीय उत्तराधिकार-संबंधी आशय स्वाभाविक हिन्दी में व्यक्त किया गया है; ‘तेरे स्थान पर’ और ‘तेरे सिंहासन पर’ दोनों तत्व सुरक्षित हैं।
- source_word: הוּא יִבְנֶה
  choice: वही ... बनाएगा
  rationale: स्वतंत्र सर्वनाम הוּא का बल ‘वही’ द्वारा सुरक्षित रखा गया है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का रूप
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: मूल में व्यक्तिगत चतुरक्षरीय नाम है। हिन्दी पाठकों के लिए स्थापित रूप ‘यहोवा’ व्यक्तिगत नाम को सुरक्षित रखता है और उसे ‘प्रभु’ जैसी उपाधि से प्रतिस्थापित नहीं करता।
- issue: ‘यहोवा के नाम के लिए’ मन्दिर-सूत्र
  choice: नाम के लिए
  alternative: यहोवा के सम्मान के लिए
  rationale: मूल अभिव्यक्ति नाम, उपस्थिति और समर्पण से जुड़ा व्यापक धर्मवैज्ञानिक तनाव रखती है; केवल ‘सम्मान’ कहना इसे अनावश्यक रूप से सीमित करता।
- issue: निर्दिष्ट पुत्र पर बल
  choice: वही ... बनाएगा
  alternative: वह ... बनाएगा
  rationale: इब्रानी הוּא के स्पष्ट बल को बनाए रखने से ईश्वरीय प्रतिज्ञा में निर्दिष्ट उत्तराधिकारी की भूमिका उभरती है, बिना उसकी पहचान से आगे कोई व्याख्या जोड़े।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सहज शैली। प्रत्यक्ष उद्धरण में बाइबिलीय प्रसंगानुकूल ‘तेरा/तेरे’ रखा गया है। ‘भवन’ मूल ‘घर’ और प्रसंगगत ‘मन्दिर’ के बीच संतुलन रखता है; आवश्यक विकल्प पादटिप्पणी में दिया गया है।
