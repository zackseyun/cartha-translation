source:
  edition: WLC
  text: וַ/יְהִ֧י לִ/שְׁלֹמֹ֛ה שִׁבְעִ֥ים אֶ֖לֶף נֹשֵׂ֣א סַבָּ֑ל וּ/שְׁמֹנִ֥ים אֶ֖לֶף חֹצֵ֥ב בָּ/הָֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/005/029.yaml
  text: And Solomon had seventy thousand burden-bearers[a], and eighty thousand stonecutters in the mountains.
translation:
  language: hi
  text: सुलैमान के पास सत्तर हज़ार बोझ ढोनेवाले और अस्सी हज़ार पहाड़ी क्षेत्र में पत्थर काटनेवाले[a] थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से “पहाड़ में काटनेवाले” है; संभवतः आशय पहाड़ी क्षेत्र की खदानों में पत्थर काटनेवाले मजदूरों से है।
    reason: मूल पद में काटी जानेवाली वस्तु स्पष्ट नहीं कही गई है और ‘पहाड़’ एकवचन में है; टिप्पणी शाब्दिक रूप तथा संदर्भगत अर्थ दोनों सुरक्षित रखती है।
lexical_decisions:
- source_word: וַיְהִי לִשְׁלֹמֹה
  choice: सुलैमान के पास … थे
  rationale: היה + ל possession/existence व्यक्त करता है। यह हिंदी में स्वाभाविक ढंग से सुलैमान के अधीन उपलब्ध श्रमिकों की संख्या बताता है।
- source_word: שִׁבְעִים אֶלֶף
  choice: सत्तर हज़ार
  rationale: मूल संख्या का सीधा और स्वाभाविक अनुवाद।
- source_word: נֹשֵׂא סַבָּל
  choice: बोझ ढोनेवाले
  rationale: נֹשֵׂא और סַבָּל का संयुक्त अर्थ भारी बोझ उठाकर ले जाने के काम में लगे लोगों से है; यह अभिव्यक्ति आधुनिक हिंदी में स्पष्ट और सहज है।
- source_word: וּשְׁמֹנִים אֶלֶף
  choice: और अस्सी हज़ार
  rationale: मूल संख्या और उसके संयोजक का सीधा अनुवाद।
- source_word: חֹצֵב
  choice: पत्थर काटनेवाले
  rationale: חצב का अर्थ काटकर निकालना या तराशना है और भवन-निर्माण के इस संदर्भ में इसका निहित कर्म पत्थर है। चुना हुआ रूप कार्य को सामान्य पाठक के लिए स्पष्ट करता है।
- source_word: בָּהָר
  choice: पहाड़ी क्षेत्र में
  rationale: एकवचन הַר यहाँ स्थलरूप को सामूहिक अथवा क्षेत्रीय अर्थ में बता सकता है। यह अनुवाद हिंदी में स्वाभाविक है और किसी एक निश्चित पहाड़ का अनावश्यक संकेत नहीं देता।
theological_decisions: []
translation_notes:
  register: आधुनिक मानक हिंदी में सरल, गरिमापूर्ण और श्रम-संबंधी शब्दावली अपनाई गई है। वाक्य-संरचना स्वाभाविक हिंदी के अनुरूप है, जबकि मूल की दोनों संख्याएँ और दोनों कार्य-श्रेणियाँ स्पष्ट रखी गई हैं।
