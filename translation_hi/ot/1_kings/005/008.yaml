  text: And the barley and the straw for the horses and the steeds were brought to the place where each man was[b][a], according to his duty.
translation:
  language: hi
  text: जौ और पुआल घोड़ों और सवारी के पशुओं[a] के लिए उस स्थान पर पहुँचाया जाता था जहाँ प्रत्येक व्यक्ति[b] होता था, प्रत्येक व्यक्ति की निर्धारित व्यवस्था के अनुसार।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी शब्द विशेष सवारी-पशुओं के लिए हो सकता है; संभवतः इसमें खच्चर या रथ के घोड़े भी हो सकते हैं।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से ‘हर एक पुरुष’; यहाँ इसका प्रयोग प्रत्येक उत्तरदायी व्यक्ति के लिए वितरणात्मक अर्थ में हुआ है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַשְּׂעֹרִים
  choice: जौ
  rationale: यहाँ जौ पशुओं के चारे अथवा रसद के रूप में है; आधुनिक हिन्दी में ‘जौ’ स्वाभाविक और सटीक है।
- source_word: וְהַתֶּבֶן
  choice: भूसा
  rationale: תֶּבֶן पशुओं के चारे में प्रयुक्त सूखे डंठल या पुआल को सूचित करता है; इस प्रसंग में ‘भूसा’ सामान्य हिन्दी पाठक के लिए सहज है।
- source_word: לַסּוּסִים
  choice: घोड़ों के लिए
  rationale: इब्रानी पूर्वसर्ग और संज्ञा का सीधा, स्वाभाविक अनुवाद।
- source_word: וְלָרָכֶשׁ
  choice: तथा सवारी के पशुओं
  rationale: רֶכֶשׁ का ठीक पशु-वर्ग अनिश्चित है; यह विशेष सवारी-पशुओं, खच्चरों या रथ के घोड़ों की ओर संकेत कर सकता है। व्यापक अनुवाद मूल की अनिश्चितता बनाए रखता है।
- source_word: יָבִיאוּ
  choice: पहुँचाया जाता था
  rationale: रूप सक्रिय बहुवचन ‘वे पहुँचाते थे’ है, पर कर्ता अनिर्दिष्ट है और प्रसंग नियमित प्रशासनिक आपूर्ति का है; हिन्दी का कर्मवाच्य इस आशय को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: אֶל־הַמָּקוֹם
  choice: उस स्थान पर
  rationale: मानक स्थानवाचक अभिव्यक्ति; ‘उस स्थान पर’ हिन्दी वाक्य-विन्यास में सहज है।
- source_word: אֲשֶׁר יִהְיֶה שָּׁם אִישׁ
  choice: जहाँ हर एक व्यक्ति तैनात था
  rationale: אִישׁ यहाँ वितरणात्मक अर्थ में है—प्रत्येक उत्तरदायी व्यक्ति। ‘तैनात था’ स्थान पर उसकी नियुक्त उपस्थिति को स्पष्ट करता है, बिना किसी विशिष्ट पद को जोड़ने के।
- source_word: כְּמִשְׁפָּטוֹ
  choice: उसके निर्धारित दायित्व के अनुसार
  rationale: यहाँ מִשְׁפָּט न्यायिक निर्णय नहीं, बल्कि निर्धारित व्यवस्था, हिस्सा या कर्तव्य बताता है; यह अनुवाद प्रशासनिक संदर्भ को स्पष्ट रखता है।
