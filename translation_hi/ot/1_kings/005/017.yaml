  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: אַתָּ֨ה יָדַ֜עְתָּ אֶת דָּוִ֣ד אָבִ֗/י כִּ֣י לֹ֤א יָכֹל֙ לִ/בְנ֣וֹת בַּ֗יִת לְ/שֵׁם֙ יְהוָ֣ה אֱלֹהָ֔י/ו מִ/פְּנֵ֥י הַ/מִּלְחָמָ֖ה אֲשֶׁ֣ר סְבָבֻ֑/הוּ עַ֤ד תֵּת יְהוָה֙ אֹתָ֔/ם תַּ֖חַת כַּפּ֥וֹת רגל/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/005/017.yaml
  text: You know that David my father could not build a house for the name of Yahweh his God because of the warfare that surrounded him[a], until Yahweh put them under the soles of his feet.
translation:
  language: hi
  text: तुम जानते हो कि मेरे पिता दाऊद युद्ध के कारण, जो उन्हें चारों ओर से घेरे हुए था, अपने परमेश्वर याहवे के नाम के लिए एक भवन नहीं बना सके, जब तक याहवे ने उन्हें उनके पैरों के तलवों के नीचे नहीं कर दिया।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उनके पैरों के नीचे।” इब्रानी में अधिक पूर्ण रूप से “उनके पैरों के तलवों के नीचे” है—यह अधीन कर देने की छवि है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אַתָּה יָדַעְתָּ
  choice: तुम जानते हो
  rationale: प्रत्यक्ष संबोधन में पूर्ण क्रिया यहाँ वर्तमान ज्ञान व्यक्त करती है। अलग सर्वनाम के बल को स्वाभाविक हिन्दी संबोधन में बनाए रखा गया है।
- source_word: בַּיִת
  choice: एक भवन
  rationale: यह मन्दिर की ओर संकेत करता है, पर मूल शब्द सामान्यतः ‘घर/भवन’ है; ‘भवन’ इस प्रसंग में गरिमापूर्ण और स्वाभाविक है तथा समय से पहले ‘मन्दिर’ कहकर अर्थ नहीं खोलता।
- source_word: לְשֵׁם יְהוָה אֱלֹהָיו
  choice: अपने परमेश्वर यहोवा के नाम के लिए
  rationale: ‘नाम के लिए’ की वाचाई अभिव्यक्ति को ‘सम्मान के लिए’ जैसे व्याख्यात्मक रूप में बदले बिना सुरक्षित रखा गया है। ‘अपने’ का संदर्भ दाऊद से है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को हिन्दी में प्रचलित नामरूप ‘यहोवा’ से व्यक्त किया गया है, किसी उपाधि से प्रतिस्थापित नहीं किया गया।
- source_word: מִפְּנֵי הַמִּלְחָמָה אֲשֶׁר סְבָבֻהוּ
  choice: उन युद्धों के कारण, जो उन्हें चारों ओर से घेरे हुए थे
  rationale: एकवचन सामूहिक संज्ञा और बहुवचन क्रिया का आशय लगातार तथा अनेक ओर से चल रहे युद्ध-संघर्ष से है। हिन्दी बहुवचन इस सामूहिक भाव और घेराव की छवि को स्वाभाविक रूप देता है।
- source_word: עַד תֵּת יְהוָה אֹתָם
  choice: जब तक यहोवा ने उन्हें ... नहीं कर दिया
  rationale: ‘जब तक ... नहीं’ हिन्दी में सीमा-बिंदु को स्वाभाविक ढंग से व्यक्त करता है। ‘उन्हें’ मूल के बहुवचन सर्वनाम की संदर्भगत खुलावट को बनाए रखता है और ‘शत्रुओं’ को स्पष्ट रूप से जोड़ता नहीं।
- source_word: תַּחַת כַּפּוֹת רַגְלוֹ
  choice: उनके पैरों के तलवों के नीचे
  rationale: כַּפּוֹת का विशिष्ट अर्थ ‘तलवे’ है; पूरा रूप अधीनता और विजय की मूल छवि को सुरक्षित रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: प्रभु
  rationale: मूल पाठ में व्यक्तिगत वाचाई नाम सीधे आया है। हिन्दी का परिचित लिप्यंतरण ‘यहोवा’ नाम को सुरक्षित रखता है, जबकि ‘प्रभु’ उसे एक उपाधि से बदल देता।
- issue: अंतिम बहुवचन सर्वनाम אֹתָם का संदर्भ
  choice: उन्हें
  alternative: उनके शत्रुओं को
  rationale: संदर्भ में शत्रुओं का आशय सम्भावित है, पर वे इस वाक्य में स्पष्ट संज्ञा के रूप में नहीं आए। सर्वनाम रखने से मूल की संक्षिप्तता और हल्की संदर्भगत अस्पष्टता बनी रहती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में आदरपूर्ण किन्तु सहज शैली अपनाई गई है। दाऊद के लिए एकवचन आदरसूचक ‘उन्हें/उनके’ प्रयोग हुआ है। वाक्य की ऐतिहासिक-राजकीय गरिमा बनाए रखते हुए अनावश्यक धर्मवैधानिक शब्दावली से बचा गया है।
