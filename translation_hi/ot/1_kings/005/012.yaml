base_translation:
  language: en
  yaml_path: translation/ot/1_kings/005/012.yaml
  text: He spoke three thousand proverbs[a], and his songs were one thousand and five.
translation:
  language: hi
  text: उसने तीन हज़ार नीतिवचन[a] कहे, और उसके गीतों की संख्या एक हज़ार पाँच थी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “तीन हज़ार कथन” अथवा “तीन हज़ार दृष्टांत”; इब्रानी शब्द מָשָׁל का अर्थ केवल “नीतिवचन” से अधिक व्यापक हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: उसने ... कहे
  rationale: पिएल रूप का सीधा अर्थ ‘बोलना/कहना’ है। प्रसंग में रचना करना निहित हो सकता है, पर इब्रानी क्रिया स्वयं स्पष्ट रूप से ‘रचना करना’ नहीं कहती।
- source_word: שְׁלֹשֶׁת אֲלָפִים
  choice: तीन हज़ार
  rationale: संख्या का स्वाभाविक और सटीक हिन्दी रूप।
- source_word: מָשָׁל
  choice: नीतिवचन
  rationale: संख्या के बाद एकवचन रूप गणनीय सामूहिक अर्थ रखता है। सुलैमान की ज्ञान-परंपरा के प्रसंग में ‘नीतिवचन’ उपयुक्त है, जबकि शब्द की व्यापक अर्थ-सीमा को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: וַיְהִי
  choice: की संख्या ... थी
  rationale: यहाँ היה कुल संख्या बताने वाला संयोजक/अस्तित्वसूचक रूप है; ‘की संख्या ... थी’ आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: שִׁירוֹ
  choice: उसके गीतों
  rationale: यद्यपि इब्रानी संज्ञा प्रत्यय सहित एकवचन रूप में है, संख्या के साथ इसका सामूहिक अर्थ है; हिन्दी में बहुवचन स्वाभाविक है।
- source_word: חֲמִשָּׁה וָאָלֶף
  choice: एक हज़ार पाँच
  rationale: इब्रानी क्रम शाब्दिक रूप से ‘पाँच और एक हज़ार’ है; हिन्दी संख्या-क्रम में इसे ‘एक हज़ार पाँच’ कहना सटीक और स्वाभाविक है।
