base_translation:
  language: en
  yaml_path: translation/ot/1_kings/005/020.yaml
  text: Now command that cedars from Lebanon be cut for me[a], and let my servants be with your servants, and I will give you the wages of your servants according to all that you say[b]; for you know that among us there is no man who knows how to cut timber like the Sidonians.
translation:
  language: hi
  text: अब आज्ञा दे कि वे मेरे लिए लबानोन से देवदार के पेड़ काटें। मेरे सेवक तेरे सेवकों के साथ रहें, और तेरे सेवकों की मज़दूरी मैं तुझे जो कुछ तू कहे उसके अनुसार दूँगा; क्योंकि तू जानता है कि हमारे यहाँ कोई ऐसा व्यक्ति नहीं है[a] जो सीदोनियों की तरह लकड़ी काटना जानता हो[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से, ‘हममें कोई पुरुष नहीं।’ यहाँ आशय यह है कि उनके बीच इस काम में वैसा कुशल कोई व्यक्ति नहीं था; यह आवश्यक रूप से स्त्रियों के बारे में कोई सामान्य सामाजिक दावा नहीं है।
    reason: lexical_alternative
  - marker: b
    text: या, ‘पेड़ काटना।’ इब्रानी में शाब्दिक रूप से ‘पेड़/लकड़ियाँ काटना’ है; प्रसंग इमारती लकड़ी के लिए पेड़ काटने का है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: इसलिए अब
  rationale: यह पद पिछले कथन से अनुरोध की ओर बढ़ता है। ‘अब’ समय/विमर्श-संकेत को और ‘इसलिए’ प्रसंगगत परिणति को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: צַוֵּה וְיִכְרְתוּ לִי
  choice: आज्ञा दे कि वे मेरे लिए ... काटें
  rationale: आज्ञार्थक क्रिया और उसके बाद के निवेदनात्मक रूप को सक्रिय वाक्य में रखा गया है; इससे उन कामगारों की निहित उपस्थिति भी बनी रहती है जिन्हें आदेश दिया जाना है।
- source_word: אֲרָזִים מִן הַלְּבָנוֹן
  choice: लबानोन से देवदार के पेड़
  rationale: אֲרָזִים को स्पष्ट, प्रचलित हिन्दी में ‘देवदार के पेड़’ कहा गया है और स्रोत-स्थान को ‘लबानोन से’ रखा गया है।
- source_word: וַעֲבָדַי יִהְיוּ עִם עֲבָדֶיךָ
  choice: मेरे सेवक तेरे सेवकों के साथ रहेंगे
  rationale: עבד की पुनरावृत्ति को ‘सेवक’ के रूप में बनाए रखते हुए भावी व्यवस्था का सीधा कथन किया गया है।
- source_word: וּשְׂכַר עֲבָדֶיךָ אֶתֵּן לְךָ
  choice: तेरे सेवकों की मज़दूरी मैं तुझे ... दूँगा
  rationale: שׂכר यहाँ श्रम के भुगतान को दर्शाता है; ‘मज़दूरी’ सामान्य पाठक के लिए स्पष्ट और प्रसंगानुकूल है।
- source_word: כְּכֹל אֲשֶׁר תֹּאמֵר
  choice: तेरे कहे के अनुसार
  rationale: यह हिराम द्वारा निर्धारित शर्तों के अनुसार भुगतान करने की व्यापक प्रतिज्ञा को संक्षिप्त और स्वाभाविक हिन्दी में रखता है।
- source_word: כִּי אַתָּה יָדַעְתָּ
  choice: क्योंकि तू जानता है
  rationale: कारणसूचक संबंध तथा दूसरे पुरुष एकवचन का प्रत्यक्ष संबोधन सुरक्षित रखा गया है।
- source_word: אֵין בָּנוּ אִישׁ
  choice: हमारे यहाँ कोई ऐसा व्यक्ति नहीं है
  rationale: शाब्दिक ‘हममें कोई पुरुष नहीं’ के स्थान पर हिन्दी का स्वाभाविक अस्तित्ववाचक प्रयोग चुना गया है। ‘व्यक्ति’ इस मुहावरे के आशय को व्यक्त करता है, जबकि पादटिप्पणी में אִישׁ की शाब्दिकता बताई गई है।
- source_word: יֹדֵעַ לִכְרָת עֵצִים
  choice: लकड़ी काटना जानता हो
  rationale: यह कौशल के अर्थ और इमारती लकड़ी तैयार करने के प्रसंग, दोनों को व्यक्त करता है; शाब्दिक ‘पेड़ काटना’ पादटिप्पणी में दिया गया है।
- source_word: כַּצִּדֹנִים
  choice: सीदोनियों की तरह
  rationale: सीदोन के लोगों के लकड़ी काटने के तुलनात्मक कौशल को सीधे बनाए रखा गया है।
