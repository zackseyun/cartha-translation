lexical_decisions:
- source_word: וַתֵּרֶא
  choice: जब ... ने ... देखा
  rationale: वाव-क्रमिक कथा को आगे बढ़ाता है, और यह पद अगले पद में जारी रहने वाले वाक्य का आरम्भ है; इसलिए हिंदी में ‘जब’ स्वाभाविक है।
- source_word: מַלְכַּת שְׁבָא
  choice: शीबा की रानी
  rationale: यह संबंधसूचक रचना शीबा की शासिका को पहचानती है; आधुनिक हिंदी में यही स्वाभाविक रूप है।
- source_word: אֵת
  choice: '[प्रत्यक्ष कर्म-चिह्न, अलग से अनूदित नहीं]'
  rationale: यह निश्चित प्रत्यक्ष कर्म को चिह्नित करता है और हिंदी में इसके लिए अलग शब्द आवश्यक नहीं है।
- source_word: כָּל חָכְמַת שְׁלֹמֹה
  choice: सुलैमान की सारी बुद्धि
  rationale: כָּל संपूर्णता व्यक्त करता है और संबंधसूचक रचना को सहज हिंदी में सुरक्षित रखा गया है।
- source_word: וְהַבַּיִת
  choice: और ... भवन
  rationale: בַּיִת का मूल अर्थ ‘घर/भवन’ है। राजकीय संदर्भ में यह महल हो सकता है, पर मुख्य पाठ में व्यापक और पाठ-समीपी ‘भवन’ रखा गया है।
- source_word: אֲשֶׁר בָּנָה
  choice: उसके बनाए हुए
  rationale: संबंधवाचक उपवाक्य उस भवन का वर्णन करता है जिसे सुलैमान पहले बना चुका था; हिंदी कृदंत-रचना संक्षिप्त और स्वाभाविक है।
