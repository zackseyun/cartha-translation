base_translation:
  language: en
  yaml_path: translation/ot/1_kings/010/009.yaml
  text: Blessed be Yahweh your God[a], who delighted in you to set you on the throne of Israel. Because Yahweh loved Israel forever, he has made you king to administer justice and righteousness.
translation:
  language: hi
  text: तुम्हारे परमेश्वर यहोवा धन्य हों, जिन्होंने तुमसे प्रसन्न होकर तुम्हें इस्राएल के सिंहासन पर बैठाया। इस्राएल के प्रति यहोवा के सदा के प्रेम के कारण[क] उन्होंने तुम्हें न्याय और धार्मिकता करने के लिए राजा बनाया है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: क
    text: या, “क्योंकि यहोवा इस्राएल से सदा प्रेम करते हैं।” हिब्रू वाक्यांश में ‘प्रेम’ संज्ञा के रूप में है।
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהִי ... בָּרוּךְ
  choice: धन्य हैं
  rationale: हिब्रू आशीर्वाद-सूचक अभिव्यक्ति को स्वाभाविक और गरिमापूर्ण हिन्दी में व्यक्त करता है; हिन्दी में ‘धन्य हों’ भी संभव है, पर यहाँ प्रशंसात्मक उद्घोष के रूप में ‘धन्य हैं’ अधिक सहज है।
- source_word: יְהוָה אֱלֹהֶיךָ
  choice: तुम्हारे परमेश्वर यहोवा
  rationale: दिव्य व्यक्तिगत नाम और द्वितीय पुरुष एकवचन संबंध—दोनों को स्पष्ट रूप से सुरक्षित रखता है।
- source_word: אֲשֶׁר חָפֵץ בְּךָ
  choice: जिन्होंने तुमसे प्रसन्न होकर
  rationale: חפץ ב किसी व्यक्ति में प्रसन्नता और अनुग्रह का भाव देता है; यह अनुवाद उसी भाव को स्वाभाविक हिन्दी में रखता है।
- source_word: לְתִתְּךָ עַל כִּסֵּא יִשְׂרָאֵל
  choice: तुम्हें इस्राएल के सिंहासन पर बैठाया
  rationale: राजकीय नियुक्ति और सिंहासनारोहण की छवि दोनों को सहज हिन्दी में व्यक्त करता है।
- source_word: בְּאַהֲבַת יְהוָה אֶת יִשְׂרָאֵל לְעֹלָם
  choice: इस्राएल के प्रति यहोवा के सदा के प्रेम के कारण
  rationale: בְּ को प्रसंगानुसार कारणवाचक और אַהֲבָה को संज्ञा ‘प्रेम’ के रूप में रखता है; לְעֹלָם को ‘सदा के’ से व्यक्त किया गया है।
- source_word: וַיְשִׂימְךָ לְמֶלֶךְ
  choice: उन्होंने तुम्हें ... राजा बनाया है
  rationale: राजा के रूप में नियुक्त किए जाने की पूर्ण घटना और उसका वर्तमान परिणाम व्यक्त करता है।
- source_word: לַעֲשׂוֹת מִשְׁפָּט וּצְדָקָה
  choice: न्याय और धार्मिकता करने के लिए
  rationale: עשה के सामान्य अर्थ ‘करना’ को बनाए रखते हुए राजकीय शासन के नैतिक दायित्व को व्यक्त करता है; משפט और צדקה की विशिष्ट युग्मावली भी सुरक्षित रहती है।
theological_decisions:
- issue: दिव्य नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: हिब्रू व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय हिन्दी में प्रचलित नामरूप ‘यहोवा’ द्वारा प्रस्तुत किया गया है।
- issue: בְּאַהֲבַת יְהוָה की व्याख्या
  choice: यहोवा के सदा के प्रेम के कारण
  alternative: क्योंकि यहोवा इस्राएल से सदा प्रेम करते हैं
  rationale: कारणवाचक संबंध स्पष्ट रखते हुए हिब्रू की संज्ञात्मक रचना ‘प्रेम’ को सुरक्षित रखा गया है और उसे अनावश्यक रूप से किसी विशेष काल वाले क्रियापद में नहीं बदला गया।
- issue: מִשְׁפָּט וּצְדָקָה का संबंध
  choice: न्याय और धार्मिकता
  alternative: न्याय और सही काम
  rationale: दोनों हिब्रू नैतिक-राजकीय संकल्पनाओं का भेद और पारंपरिक अर्थ-विस्तार सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी, सम्मानसूचक बहुवचन के साथ। शैली गरिमापूर्ण किंतु सामान्य पाठक के लिए स्पष्ट रखी गई है; वाक्यरचना मूल के कारणात्मक और राजकीय संबंधों को स्वाभाविक हिन्दी में व्यक्त करती है।
