  yaml_path: translation/ot/1_kings/010/016.yaml
  text: King Solomon made two hundred large shields of beaten gold[b][a]; six hundred shekels of gold went onto each shield.
translation:
  language: hi
  text: राजा सुलैमान ने पीटकर पतला किए हुए सोने की दो सौ बड़ी ढालें[a] बनाईं। हर एक ढाल पर छह सौ शेकेल[b] सोना लगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ प्रयुक्त इब्रानी शब्द बड़ी ढाल को दर्शाता है; अगले पद में छोटी ढाल के लिए दूसरा शब्द आया है।
    reason: lexical_alternative
  - marker: b
    text: मूल में शाब्दिक रूप से, “छह सौ सोना एक ढाल पर चढ़ता था” है; भार की इकाई “शेकेल” निहित है।
    reason: lexical_alternative
