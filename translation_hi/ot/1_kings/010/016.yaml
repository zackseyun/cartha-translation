- source_word: יַעֲלֶה עַל
  choice: पर ... लगा
  rationale: शाब्दिक अर्थ 'पर चढ़ा' है; सोने से ढाल मढ़ने के संदर्भ में 'लगा' स्वाभाविक हिन्दी है और दिशा-संबंधी बिंब बनाए रखता है।
- source_word: הַצִּנָּה הָאֶחָת
  choice: हर एक ढाल
  rationale: शाब्दिक 'एक ढाल' का यहाँ वितरणात्मक अर्थ है, जिसे हिन्दी में 'हर एक ढाल' स्पष्ट रूप से व्यक्त करता है।
