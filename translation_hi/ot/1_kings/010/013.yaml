  yaml_path: translation/ot/1_kings/010/013.yaml
  text: And King Solomon gave the queen of Sheba all that she desired[a], whatever she asked, besides what he gave her according to the hand of King Solomon. Then she turned and went to her own land, she and her servants.
translation:
  language: hi
  text: और राजा सुलैमान ने शीबा की रानी को उसकी इच्छा की हर वस्तु दी—जो कुछ उसने माँगा था—इसके अतिरिक्त भी उसने उसे राजा सुलैमान की सामर्थ्य के अनुसार[a] दिया। तब वह अपने सेवकों के साथ मुड़ी और अपने देश को चली गई।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक: “राजा सुलैमान के हाथ के अनुसार।” यह एक मुहावरा है, जिसका अर्थ उसकी सामर्थ्य, साधनों या उदारता के अनुसार है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: נָתַן
  choice: दिया
  rationale: सामान्य क्रिया ‘देना’ दोनों प्रयोगों का सीधा और स्वाभाविक हिन्दी समतुल्य है।
- source_word: מַלְכַּת שְׁבָא
  choice: शीबा की रानी
  rationale: रचनात्मक संबंध को स्वाभाविक हिन्दी में व्यक्त करते हुए स्थान-नाम का प्रचलित लिप्यंतरण रखा गया है।
- source_word: כָּל חֶפְצָהּ
  choice: उसकी इच्छा की हर वस्तु
  rationale: यह पद उसकी समस्त अभिलाषित वस्तुओं को सूचित करता है; यह अनुवाद अर्थ की व्यापकता बनाए रखता है।
- source_word: אֲשֶׁר שָׁאָלָה
  choice: जो कुछ उसने माँगा था
  rationale: שׁאל यहाँ अनुरोध करने या माँगने के अर्थ में है; ‘जो कुछ’ व्यापकता को सहज ढंग से व्यक्त करता है।
- source_word: מִלְּבַד
  choice: इसके अतिरिक्त भी
  rationale: यह पहले बताई गई वस्तुओं के अलावा और दिए गए उपहारों को दर्शाता है।
- source_word: כְּיַד הַמֶּלֶךְ שְׁלֹמֹה
  choice: अपनी राजसी उदारता के अनुसार
  rationale: शाब्दिक ‘राजा सुलैमान के हाथ के अनुसार’ सामर्थ्य, साधन या उदारता का मुहावरा है। चुना हुआ रूप हिन्दी में उसका प्रसंगगत भाव व्यक्त करता है और राजकीय हैसियत का संकेत बनाए रखता है।
- source_word: וַתֵּפֶן
  choice: मुड़ी
  rationale: मूल क्रिया के ‘मुड़ना’ अर्थ को अगली गति-सूचक क्रिया से अलग रखा गया है।
- source_word: וַתֵּלֶךְ לְאַרְצָהּ
  choice: अपने देश को चली गई
  rationale: यह उसके देश की ओर प्रस्थान को स्वाभाविक हिन्दी में व्यक्त करता है; मूल में वापसी का आशय संदर्भ से है, पर ‘लौटी’ स्पष्ट रूप से नहीं कहा गया।
- source_word: הִיא וַעֲבָדֶיהָ
  choice: वह अपने सेवकों के साथ
  rationale: עֲבָדִים का सीधा अर्थ ‘सेवक’ है; हिन्दी वाक्य-विन्यास में ‘के साथ’ स्वाभाविक रूप से साथ गए दल को व्यक्त करता है।
theological_decisions:
- issue: כְּיַד הַמֶּלֶךְ שְׁלֹמֹה मुहावरे का अनुवाद
  choice: अपनी राजसी उदारता के अनुसार
  alternative: राजा सुलैमान के हाथ के अनुसार / राजा सुलैमान की सामर्थ्य के अनुसार
  rationale: मुहावरा सुलैमान के साधनों, सामर्थ्य या उदारता के अनुरूप दिए गए अतिरिक्त उपहारों का बोध कराता है। मुख्य पाठ में अर्थ स्पष्ट किया गया है, जबकि किसी संकीर्ण व्याख्या को सिद्धांत के रूप में नहीं थोपा गया।
- issue: עֲבָדֶיהָ का सामाजिक अर्थ
  choice: उसके सेवक
  alternative: उसके परिचारक / उसके दास
  rationale: राजकीय संदर्भ में शब्द साथ के सेवकवर्ग को व्यापक रूप से बता सकता है। ‘सेवक’ मूल का सीधा समतुल्य है और दासता या केवल दरबारी परिचर होने का अनावश्यक निर्धारण नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सरल और कथात्मक शैली रखी गई है। दो निकटवर्ती देने-संबंधी खंडों को डैश से स्पष्ट किया गया है। ‘मुड़ी और…चली गई’ द्वारा मूल की क्रमिक दो क्रियाएँ सुरक्षित हैं।
