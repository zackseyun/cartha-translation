  yaml_path: translation/ot/1_kings/010/019.yaml
  text: The throne had six steps[a], and the throne had a rounded top at its back, and armrests on this side and on that beside the seat[b], and two lions standing beside the armrests.
translation:
  language: hi
  text: सिंहासन की छह सीढ़ियाँ थीं। सिंहासन के पीछे का ऊपरी भाग गोल था[a]। आसन[b] के दोनों ओर बाँह टिकाने के हत्थे थे, और उन हत्थों के पास दो सिंह खड़े थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “सिंहासन के पीछे एक गोल शीर्ष था।”
    reason: मूल इब्रानी में רֹאשׁ עָגֹל (‘गोल सिर/शीर्ष’) की संक्षिप्त स्थापत्य-अभिव्यक्ति है; इसका संबंध सिंहासन के पिछले भाग से है।
  - marker: b
    text: शाब्दिक रूप में, “बैठने की जगह।”
    reason: מְקוֹם הַשָּׁבֶת का स्वाभाविक हिन्दी रूप ‘आसन’ है।
lexical_decisions:
- source_word: מַעֲלוֹת
  choice: सीढ़ियाँ
  rationale: सिंहासन की संरचना के संदर्भ में यह संज्ञा ऊपर चढ़ने के चरणों को दर्शाती है; ‘सीढ़ियाँ’ आधुनिक हिन्दी में स्वाभाविक और स्पष्ट है।
- source_word: לַכִּסֵּה
  choice: सिंहासन की
  rationale: यहाँ उपसर्ग ל स्थापत्य-वर्णन में संबंध सूचित करता है; ‘सिंहासन की छह सीढ़ियाँ’ हिन्दी में स्वाभाविक है और मूल अर्थ बनाए रखता है।
- source_word: רֹאשׁ עָגֹל
  choice: ऊपरी हिस्सा गोल
  rationale: शाब्दिक अर्थ ‘गोल सिर/शीर्ष’ है। फर्नीचर के संदर्भ में यह सिंहासन के ऊपरी भाग को बताता है; ‘सिरहाना’ कहना मूल से अधिक विशिष्ट होता।
- source_word: מֵאַחֲרָיו
  choice: उसके पीछे
  rationale: यह गोल ऊपरी हिस्से का सिंहासन के पिछले भाग में होना दर्शाता है।
- source_word: יָדֹת
  choice: बाजू रखने के हत्थे
  rationale: शब्द मूलतः ‘हाथों’ से संबंधित है, पर सिंहासन के संदर्भ में सीट के दोनों ओर बने हत्थों को दर्शाता है।
- source_word: מִזֶּה וּמִזֶּה
  choice: दोनों ओर
  rationale: यह अभिव्यक्ति एक ओर और दूसरी ओर की समानांतर स्थिति बताती है; ‘दोनों ओर’ इसका सहज हिन्दी रूप है।
- source_word: אֶל מְקוֹם הַשָּׁבֶת
  choice: आसन के दोनों ओर
  rationale: शाब्दिक रूप ‘बैठने की जगह की ओर/पास’ है। प्रसंग में यह हत्थों की स्थिति बैठने के स्थान के दोनों ओर बताता है।
- source_word: אֲרָיוֹת
  choice: सिंह
  rationale: यह ‘सिंह’ का बहुवचन है; मूल यह स्पष्ट नहीं करता कि वे मूर्तियाँ थीं, इसलिए अनावश्यक विशिष्टीकरण नहीं किया गया।
- source_word: עֹמְדִים
  choice: खड़े थे
  rationale: कृदंत सिंहों की स्थिर, सीधी स्थिति का दृश्य वर्णन करता है।
- source_word: אֵצֶל הַיָּדוֹת
  choice: हत्थों के पास
  rationale: यह दोनों सिंहों को सिंहासन के हत्थों के निकट स्थित बताता है और पहले प्रयुक्त शब्दावली से संगति रखता है।
