lexical_decisions:
- source_word: וַיְהִי
  choice: था
  rationale: यहाँ क्रिया नया विवरण प्रस्तुत करती है; हिंदी में वाक्य के अंत का ‘था’ बिना किसी अनावश्यक आरंभिक संयोजक के इसे स्वाभाविक रूप से व्यक्त करता है।
- source_word: מִשְׁקַל
  choice: वजन
  rationale: यह संज्ञा भार या तौल को दर्शाती है; हिसाब-किताब के इस संदर्भ में ‘वजन’ सीधा और सर्वसुलभ शब्द है।
- source_word: הַזָּהָב ... זָהָב
  choice: सोना ... किक्कार
  rationale: पहले प्रयोग में धातु की स्पष्ट पहचान ‘सोना’ से होती है। हिंदी वाक्य में ‘किक्कार सोना’ की पुनरुक्ति अस्वाभाविक होती, इसलिए माप के बाद दूसरी बार ‘सोना’ न दोहराने पर भी अर्थ स्पष्ट रहता है।
- source_word: אֲשֶׁר בָּא לִשְׁלֹמֹה
  choice: जो सोना सुलैमान के पास आया
  rationale: ‘आया’ स्रोत की क्रिया और उसकी अनिर्दिष्ट कर्तृवाच्यता को बनाए रखता है; ‘लाया गया’ कहने से ऐसे कर्ता या माध्यम का संकेत जुड़ जाता जिसे मूल पाठ स्पष्ट नहीं करता।
- source_word: בְּשָׁנָה אֶחָת
  choice: एक वर्ष में
  rationale: यह उसी अवधि के भीतर प्राप्त मात्रा को निकट और स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: שֵׁשׁ מֵאוֹת שִׁשִּׁים וָשֵׁשׁ
  choice: छः सौ छियासठ
  rationale: यह मूल संख्या का सीधा आधुनिक हिंदी रूप है।
- source_word: כִּכַּר
  choice: किक्कार
  rationale: यह प्राचीन भार-इकाई का लिप्यंतरण है। आधुनिक इकाई में अनुमानित रूपांतरण करने के बजाय मूल सांस्कृतिक माप को रखा गया है और पादटिप्पणी में समझाया गया है।
