  text: וְ֠/כֹל כְּלֵ֞י מַשְׁקֵ֨ה הַ/מֶּ֤לֶךְ שְׁלֹמֹה֙ זָהָ֔ב וְ/כֹ֗ל כְּלֵ֛י בֵּֽית יַ֥עַר הַ/לְּבָנ֖וֹן זָהָ֣ב סָג֑וּר אֵ֣ין כֶּ֗סֶף לֹ֥א נֶחְשָׁ֛ב בִּ/ימֵ֥י שְׁלֹמֹ֖ה לִ/מְאֽוּמָה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/010/021.yaml
  text: All King Solomon’s drinking vessels were gold[a], and all the vessels of the House of the Forest of Lebanon were pure gold[b]. Silver was not considered anything in the days of Solomon.
translation:
  language: hi
  text: राजा सुलैमान के पीने के सभी पात्र सोने के थे, और लबानोन के वन भवन के सभी पात्र खरे सोने के थे। सुलैमान के दिनों में चाँदी का कोई मोल नहीं समझा जाता था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כְּלֵי מַשְׁקֵה
  choice: पीने के पात्र
  rationale: כְּלֵי व्यापक रूप से पात्रों या वस्तुओं को और מַשְׁקֵה पीने के उपयोग को सूचित करता है। ‘पीने के पात्र’ अर्थ को ‘प्यालों’ तक अनावश्यक रूप से सीमित नहीं करता।
- source_word: זָהָב
  choice: सोना / सोने के
  rationale: यह सामग्री के लिए सामान्य शब्द है; हिन्दी वाक्य में ‘सोने के थे’ स्वाभाविक रूप से वस्तुओं की सामग्री बताता है।
- source_word: בֵּית יַעַר הַלְּבָנוֹן
  choice: लबानोन-वन भवन
  rationale: यह एक विशिष्ट राजकीय भवन का नाम-सदृश पद है। ‘भवन’ בֵּית को सुरक्षित रखता है और ‘लबानोन-वन’ यַעַר הַלְּבָנוֹן की संरचना को संक्षिप्त, समझने योग्य हिन्दी में व्यक्त करता है।
- source_word: זָהָב סָגוּר
  choice: खरा सोना
  rationale: संदर्भ में यह उच्च कोटि के शुद्ध या परिष्कृत सोने को दर्शाता है। ‘खरा सोना’ आधुनिक हिन्दी में स्वाभाविक है और ‘ठोस सोना’ जैसी संरचनागत अतिशयोक्ति से बचता है।
- source_word: לֹא נֶחְשָׁב ... לִמְאוּמָה
  choice: कोई मोल नहीं समझा जाता था
  rationale: נחשב मूल्यांकन या महत्व दिए जाने का भाव रखता है और לִמְאוּמָה ‘कुछ भी/किसी मूल्य का’ अर्थ देता है। संयुक्त हिन्दी रूप संदर्भगत आशय स्पष्ट करता है कि चाँदी अनुपस्थित नहीं, बल्कि नगण्य मूल्य की मानी जाती थी।
- source_word: בִּימֵי שְׁלֹמֹה
  choice: सुलैमान के दिनों में
  rationale: यह मूल कालवाचक अभिव्यक्ति का निकट और गरिमापूर्ण हिन्दी रूप है।
theological_decisions: []
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, कथात्मक और गरिमापूर्ण रखी गई है। भवन के पारंपरिक नाम को अत्यधिक व्याख्यात्मक ‘महल’ में नहीं बदला गया। इस पद में ऐसी वास्तविक अस्पष्टता नहीं है जिसके लिए प्रकाशन-पाठ में अनिवार्य पादटिप्पणी चाहिए।
