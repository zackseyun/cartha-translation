reference: 1 Kings 10:1
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וּ/מַֽלְכַּת שְׁבָ֗א שֹׁמַ֛עַת אֶת שֵׁ֥מַע שְׁלֹמֹ֖ה לְ/שֵׁ֣ם יְהוָ֑ה וַ/תָּבֹ֥א לְ/נַסֹּת֖/וֹ בְּ/חִידֽוֹת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/010/001.yaml
  text: The queen of Sheba heard of Solomon’s fame concerning the name of Yahweh[b][a], and she came to test him with riddles.
translation:
  language: hi
  text: शेबा की रानी ने सुलैमान की कीर्ति, याहवे के नाम के संबंध में, सुनी[a], और वह पहेलियों[b] से उसकी परीक्षा लेने आई।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “याहवे के नाम के संबंध में सुलैमान के विषय में सुनी गई चर्चा।” इब्रानी पदबंध संक्षिप्त है और यह संकेत कर सकता है कि सुलैमान की कीर्ति याहवे के नाम या प्रतिष्ठा से जुड़ी थी।
    reason: lexical_alternative
  - marker: b
    text: या, “कठिन प्रश्नों।” इब्रानी शब्द का अधिक शाब्दिक अर्थ “पहेलियाँ” या “गूढ़ बातें” है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמַלְכַּת שְׁבָא
  choice: शेबा की रानी
  rationale: रचना-संबंधी रूप ‘शेबा की रानी’ को सीधे व्यक्त करता है। आरंभिक वाव कथा की निरंतरता दिखाता है; हिंदी में अलग संयोजक जोड़े बिना वाक्य स्वाभाविक रहता है।
- source_word: שֹׁמַעַת
  choice: सुनी
  rationale: कथा-संदर्भ में कृदंत पृष्ठभूमि की पूर्ण घटना बताता है; ‘सुनी’ आधुनिक हिंदी में सहज है।
- source_word: אֶת שֵׁמַע שְׁלֹמֹה
  choice: सुलैमान की कीर्ति
  rationale: שֵׁמַע का अर्थ समाचार, चर्चा या कीर्ति हो सकता है। दूर देश तक पहुँची ख्याति और उसके सत्यापन के लिए रानी के आने के संदर्भ में ‘कीर्ति’ संक्षिप्त और स्वाभाविक है।
- source_word: לְשֵׁם יְהוָה
  choice: याहवे के नाम के संबंध में
  rationale: संक्षिप्त इब्रानी पदबंध में לְ संबंध या संदर्भ बता सकता है। यह अनुवाद कारण अथवा उद्देश्य को निश्चित किए बिना सुलैमान की कीर्ति और याहवे के नाम का संबंध बनाए रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय हिंदी लिप्यंतरण में रखा गया है।
- source_word: וַתָּבֹא לְנַסֹּתוֹ
  choice: और वह उसकी परीक्षा लेने आई
  rationale: वाव-क्रमिक क्रिया कथा को आगे बढ़ाती है और נסה यहाँ किसी की योग्यता या बुद्धि परखने के अर्थ में है।
- source_word: בְּחִידוֹת
  choice: पहेलियों से
  rationale: חִידוֹת का सीधा अर्थ पहेलियाँ अथवा गूढ़ कथन है। ‘कठिन प्रश्नों’ की तुलना में ‘पहेलियों’ से मूल की विशिष्ट छवि बनी रहती है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में व्यक्तिगत ईश्वरीय नाम है। ‘याहवे’ उसका प्रचलित विद्वत्तापूर्ण लिप्यंतरण है और उसे उपाधि में नहीं बदलता।
- issue: सुलैमान की कीर्ति और याहवे के नाम के बीच संबंध
  choice: याहवे के नाम के संबंध में सुलैमान की कीर्ति
  alternative: याहवे के नाम के कारण सुलैमान की कीर्ति
  rationale: לְשֵׁם का संबंध संक्षिप्त और अर्थगत रूप से खुला है। ‘के संबंध में’ कारण, उद्देश्य या धार्मिक आशय को अनावश्यक रूप से निश्चित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सहज रखी गई है। ‘कीर्ति’ औपचारिक होते हुए भी प्रचलित है; ‘पहेलियों से परीक्षा लेना’ मूल की बौद्धिक चुनौती को स्पष्ट रूप से व्यक्त करता है।
