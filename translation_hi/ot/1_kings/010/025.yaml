  text: וְ/הֵ֣מָּה מְבִאִ֣ים אִ֣ישׁ מִנְחָת֡/וֹ כְּלֵ֣י כֶסֶף֩ וּ/כְלֵ֨י זָהָ֤ב וּ/שְׂלָמוֹת֙ וְ/נֵ֣שֶׁק וּ/בְשָׂמִ֔ים סוּסִ֖ים וּ/פְרָדִ֑ים דְּבַר שָׁנָ֖ה בְּ/שָׁנָֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/010/025.yaml
  text: 'And they were bringing[a], each man his tribute: articles of silver, articles of gold, garments, weapons, spices, horses, and mules[c][b], year by year.'
translation:
  language: hi
  text: और हर व्यक्ति अपना नज़राना[a] लाता था—चाँदी की वस्तुएँ, सोने की वस्तुएँ, वस्त्र[b], हथियार[c], सुगंध-द्रव्य, घोड़े और खच्चर—साल-दर-साल।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “अपनी भेंट” अथवा “अपना उपहार”; इब्रानी शब्द מִנְחָה भेंट, उपहार या कर के रूप में दी गई भेंट को दर्शा सकता है। यहाँ राजकीय संदर्भ में “नज़राना” चुना गया है।
    reason: lexical_alternative
  - marker: b
    text: या “चोगे” अथवा “लबादे।”
    reason: lexical_alternative
  - marker: c
    text: या “कवच”; इब्रानी शब्द व्यापक रूप से सैन्य साज-सामान को दर्शा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: מְבִאִים
  choice: लाता था
  rationale: הֵמָּה के साथ कृदंत यहाँ बार-बार होने वाली प्रथागत क्रिया बताता है; एकवचन ‘हर एक’ के अनुरूप ‘लाता था’ स्वाभाविक हिन्दी है।
- source_word: אִישׁ מִנְחָתוֹ
  choice: हर एक अपनी भेंट
  rationale: אִישׁ का प्रयोग वितरणात्मक है। מִנְחָה राजकीय संदर्भ में भेंट, उपहार या नज़राना हो सकता है; ‘भेंट’ अर्थ की व्यापकता और गरिमामय स्वर दोनों बनाए रखता है।
- source_word: כְּלֵי כֶסֶף
  choice: चाँदी की वस्तुएँ
  rationale: כְּלִי का अर्थ व्यापक है—वस्तु, पात्र या उपकरण; ‘वस्तुएँ’ किसी अनिर्दिष्ट प्रकार को अनावश्यक रूप से सीमित नहीं करता।
- source_word: וּכְלֵי זָהָב
  choice: सोने की वस्तुएँ
  rationale: כְּלֵי כֶסֶף के समानांतर व्यापक अर्थ और सूची की समरूपता बनाए रखी गई है।
- source_word: שְׂלָמוֹת
  choice: वस्त्र
  rationale: यह शब्द संभवतः बाहरी वस्त्रों या चोगों को दर्शाता है; ‘वस्त्र’ सहज हिन्दी में पर्याप्त व्यापक है।
- source_word: נֵשֶׁק
  choice: हथियार
  rationale: यहाँ सैन्य साज-सामान अभिप्रेत है। ‘हथियार’ आधुनिक पाठक के लिए स्पष्ट है, जबकि ‘कवच’ एक संभव किंतु संकरा अर्थ है।
- source_word: בְשָׂמִים
  choice: सुगंध-द्रव्य
  rationale: व्यापार या भेंट की सूची में यह सुगंधित मसालों अथवा अन्य सुगंधित पदार्थों को दर्शा सकता है; ‘सुगंध-द्रव्य’ इस विस्तार को सुरक्षित रखता है।
- source_word: סוּסִים
  choice: घोड़े
  rationale: शब्द का सामान्य और सीधा अर्थ।
- source_word: פְרָדִים
  choice: खच्चर
  rationale: शब्द का सामान्य और सीधा अर्थ।
- source_word: דְּבַר שָׁנָה בְּשָׁנָה
  choice: साल-दर-साल
  rationale: यह मुहावरा नियमित वार्षिक पुनरावृत्ति व्यक्त करता है; हिन्दी मुहावरा मूल की पुनरुक्ति और प्रथागत भाव दोनों रखता है।
