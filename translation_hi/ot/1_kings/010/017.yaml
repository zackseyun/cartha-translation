  text: וּ/שְׁלֹשׁ מֵא֤וֹת מָֽגִנִּים֙ זָהָ֣ב שָׁח֔וּט שְׁלֹ֤שֶׁת מָנִים֙ זָהָ֔ב יַעֲלֶ֖ה עַל הַ/מָּגֵ֣ן הָ/אֶחָ֑ת וַ/יִּתְּנֵ֣/ם הַ/מֶּ֔לֶךְ בֵּ֖ית יַ֥עַר הַ/לְּבָנֽוֹן־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/010/017.yaml
  text: and three hundred shields of beaten gold[a]; three minas of gold went onto each shield[c][b]. And the king put them in the House of the Forest of Lebanon.
translation:
  language: hi
  text: और उसने पीटकर पतला किए हुए सोने की तीन सौ ढालें बनवाईं[a]; हर ढाल पर तीन माने सोना चढ़ाया गया[b]। राजा ने उन्हें लबानोन के वन के भवन में रख दिया[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘हथौड़े से पीटकर पतला किया हुआ सोना।’
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में शाब्दिक रूप से, ‘तीन माने सोना एक ढाल पर ऊपर चढ़ता था’; अर्थात हर ढाल पर तीन माने सोना लगाया जाता था।
    reason: lexical_alternative
  - marker: c
    text: ‘लबानोन के वन का भवन’ सुलैमान के राजमहल-परिसर से जुड़ी एक नामित राजकीय इमारत थी, और संभवतः शस्त्रागार के रूप में भी प्रयुक्त होती थी (देखें 1 राजा 7:2)।
    reason: cross_reference
lexical_decisions:
- source_word: מָגִנִּים
  choice: ढालें
  rationale: מָגֵן बड़ी रक्षात्मक ढाल को दर्शाता है और पिछले पद की छोटी ढालों से भिन्न है; आधुनिक हिन्दी में ‘ढालें’ स्वाभाविक और स्पष्ट है।
- source_word: זָהָב שָׁחוּט
  choice: पीटा हुआ सोना
  rationale: שָׁחוּט यहाँ सोने को पीटकर अथवा हथौड़े से पतला करने की प्रक्रिया बताता है; ‘पीटा हुआ सोना’ निर्माण की इस धारणा को सीधे व्यक्त करता है।
- source_word: שְׁלֹשֶׁת מָנִים
  choice: तीन माने
  rationale: מָנֶה भार की प्राचीन इकाई है। हिन्दी बाइबलीय प्रयोग के अनुरूप ‘माने’ लिप्यंतरण रखा गया है, ताकि अनिश्चित आधुनिक भार-समानता न थोपी जाए।
- source_word: יַעֲלֶה עַל
  choice: पर ... चढ़ाया गया
  rationale: शाब्दिक चित्र ‘ऊपर चढ़ना’ है और आशय हर ढाल पर लगाए गए सोने की मात्रा से है; हिन्दी में ‘चढ़ाया गया’ उस ठोस चित्र और अनुप्रयोग दोनों को स्वाभाविक रूप से रखता है।
- source_word: הַמָּגֵן הָאֶחָת
  choice: हर ढाल
  rationale: रूपतः ‘एक ढाल’ है, पर यहाँ प्रयोग वितरणात्मक है; ‘हर ढाल’ प्रत्येक ढाल के लिए समान मात्रा का आशय स्पष्ट करता है।
- source_word: וַיִּתְּנֵם
  choice: उन्हें ... रख दिया
  rationale: נתן स्थान पर रखने के अर्थ में प्रयुक्त है; ‘रख दिया’ सामान्य आधुनिक हिन्दी में स्वाभाविक है।
- source_word: בֵּית יַעַר הַלְּבָנוֹן
  choice: लबानोन-वन भवन
  rationale: यह सुलैमान के राजमहल-परिसर की एक नामित इमारत है। ‘भवन’ בֵּית का प्रसंगानुकूल अर्थ देता है और संयुक्त नाम को संक्षिप्त, बोधगम्य हिन्दी में रखता है।
