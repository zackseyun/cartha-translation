base_translation:
  language: en
  yaml_path: translation/ot/1_kings/010/007.yaml
  text: But I did not believe the reports until I came and my own eyes saw it; and behold[a], not even half was told to me. You have surpassed the report that I heard in wisdom and prosperity.
translation:
  language: hi
  text: परन्तु जब तक मैंने स्वयं आकर अपनी आँखों से नहीं देख लिया, तब तक मैंने उन बातों पर विश्वास नहीं किया। और देखिए, मुझे तो आधा भी नहीं बताया गया था! आप बुद्धि और समृद्धि[a] में उस समाचार से कहीं बढ़कर हैं जो मैंने सुना था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘आप बुद्धि और वैभव में उस समाचार से कहीं बढ़कर हैं जो मैंने सुना था।’ इब्रानी शब्द טוֹב का अर्थ व्यापक कुशलता या सम्पन्नता हो सकता है और इस प्रसंग में सुलैमान का धन-वैभव भी इसमें सम्मिलित हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶאֱמַנְתִּי
  choice: मैंने ... विश्वास नहीं किया
  rationale: हिफ़ील रूप यहाँ सुनी हुई बातों को सत्य या विश्वसनीय मानने का अर्थ देता है; ‘विश्वास नहीं किया’ इसे स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: לַדְּבָרִים
  choice: उन बातों पर
  rationale: शाब्दिक अर्थ ‘बातों/शब्दों’ का है, पर सन्दर्भ में इससे सुलैमान के विषय में सुनी हुई बातें अभिप्रेत हैं।
- source_word: וַתִּרְאֶינָה עֵינַי
  choice: अपनी आँखों से नहीं देख लिया
  rationale: इब्रानी मुहावरे ‘मेरी आँखों ने देखा’ का प्रत्यक्ष, निजी अनुभव वाला बल सहज हिन्दी में सुरक्षित रखा गया है।
- source_word: וְהִנֵּה
  choice: और देखिए
  rationale: यह विस्मय और ध्यान आकर्षित करने वाला संवाद-सूचक है; ‘देखिए’ आधुनिक हिन्दी में उसके आलंकारिक बल को बनाए रखता है।
- source_word: לֹא הֻגַּד לִי הַחֵצִי
  choice: मुझे तो आधा भी नहीं बताया गया था
  rationale: ‘तो’ और ‘भी’ मूल कथन की विस्मयपूर्ण न्यूनोक्ति और जोर को स्वाभाविक हिन्दी में प्रकट करते हैं।
- source_word: הוֹסַפְתָּ
  choice: कहीं बढ़कर हैं
  rationale: इस तुलनात्मक रचना में יסף का अर्थ केवल जोड़ना नहीं, बल्कि सुनी हुई सूचना से अधिक सिद्ध होना है। परिणामी वर्तमान स्थिति हिन्दी में ‘बढ़कर हैं’ से स्पष्ट होती है।
- source_word: חָכְמָה וָטוֹב
  choice: बुद्धि और समृद्धि
  rationale: חָכְמָה का अर्थ ‘बुद्धि’ है। राजकीय वैभव और सफलता के प्रसंग में טוֹב व्यापक कुशलता, सम्पन्नता या समृद्धि को सूचित करता है, केवल नैतिक भलाई को नहीं।
- source_word: אֶל הַשְּׁמוּעָה אֲשֶׁר שָׁמָעְתִּי
  choice: उस समाचार से ... जो मैंने सुना था
  rationale: שְׁמוּעָה किसी के विषय में सुनी गई सूचना या समाचार है; ‘समाचार’ औपचारिक प्रसंग में तटस्थ और स्वाभाविक है।
