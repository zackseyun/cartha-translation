base_translation:
  language: en
  yaml_path: translation/ot/1_kings/010/029.yaml
  text: And a chariot was imported from Egypt for six hundred shekels of silver[a], and a horse for a hundred and fifty[c][b]; and so they exported them to all the kings of the Hittites and to the kings of Aram by their hand.
translation:
  language: hi
  text: मिस्र से एक रथ छह सौ शेकेल चाँदी के बदले और एक घोड़ा डेढ़ सौ शेकेल चाँदी के बदले मँगाया जाता था। इसी प्रकार वे उन्हें हित्तियों के सभी राजाओं और अराम के राजाओं को उनके माध्यम से भेजते थे।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से, “उनके हाथ से”; अर्थात् “उनके माध्यम से” या “उनके प्रतिनिधियों के माध्यम से।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּעֲלֶה וַתֵּצֵא
  choice: मिस्र से ... मँगाया जाता था
  rationale: दोनों गति-सूचक क्रियाएँ व्यापार के संदर्भ में मिस्र से माल लाने का संकेत देती हैं। हिन्दी में एक स्वाभाविक व्यापारिक अभिव्यक्ति अनावश्यक पुनरुक्ति से बचती है; अपूर्ण भूतकाल नियमित व्यापार को व्यक्त करता है।
- source_word: מֶרְכָּבָה
  choice: एक रथ
  rationale: एकवचन रूप प्रति इकाई मूल्य बताता है; 'रथ' सामान्य और सटीक हिन्दी शब्द है।
- source_word: בְּשֵׁשׁ מֵאוֹת כֶּסֶף
  choice: छः सौ शेकेल चाँदी में
  rationale: मूल में शाब्दिक रूप से 'छः सौ चाँदी' है; प्राचीन भार-मुद्रा की निहित इकाई 'शेकेल' स्पष्ट की गई है और चाँदी का उल्लेख सुरक्षित रखा गया है।
- source_word: וְסוּס בַּחֲמִשִּׁים וּמֵאָה
  choice: और एक घोड़ा डेढ़ सौ शेकेल चाँदी में
  rationale: '''घोड़ा'' मूल के सामान्य अर्थ को रखता है, उसे विशेष रूप से युद्ध-घोड़ा नहीं बनाता। दूसरे मूल्य में निहित शेकेल और चाँदी को हिन्दी में स्पष्टता के लिए दोहराया गया है।'
- source_word: וְכֵן
  choice: इसी प्रकार
  rationale: यह आगे होने वाले समान व्यापारिक व्यवहार को पिछले मूल्य-विवरण से जोड़ता है।
- source_word: לְכָל מַלְכֵי הַחִתִּים
  choice: हित्तियों के सभी राजाओं ... के लिए
  rationale: लामेद प्राप्तकर्ताओं अथवा ग्राहकों को सूचित करता है; 'के लिए' मूल की संभावित प्राप्तकर्ता-दिशा को सुरक्षित रखता है।
- source_word: וּלְמַלְכֵי אֲרָם
  choice: और अराम के राजाओं
  rationale: मूल स्थान-नाम अराम को रखा गया है; व्याख्यात्मक पारंपरिक नाम 'सीरिया' नहीं अपनाया गया।
- source_word: בְּיָדָם
  choice: अपने व्यापारियों के माध्यम से
  rationale: शाब्दिक अर्थ 'उनके हाथ से' है। निकटवर्ती प्रसंग में सुलैमान के व्यापारी अभिप्रेत प्रतीत होते हैं; मुख्य पाठ में हिन्दी का स्वाभाविक माध्यम-सूचक वाक्यांश दिया गया है और अनिश्चितता पादटिप्पणी में रखी गई है।
- source_word: יֹצִאוּ
  choice: बाहर ले जाते थे
  rationale: हिफ़िल रूप का अर्थ 'बाहर निकलवाना/ले जाना' है। यह निर्यात का भाव देता है, पर हिन्दी में गति-क्रिया रखकर मूल की शब्दावली भी सुनाई देती है।
