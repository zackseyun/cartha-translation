  yaml_path: translation/ot/1_kings/010/002.yaml
  text: She came to Jerusalem with a very great retinue[a], with camels carrying spices and very much gold and precious stones. She came to Solomon and spoke with him about all that was in her heart.
translation:
  language: hi
  text: वह एक बहुत बड़े दल[a] के साथ यरूशलेम आई। उसके ऊँट मसाले, बहुत अधिक सोना और बहुमूल्य पत्थर लादे हुए थे। वह सुलैमान के पास आई और उससे अपने मन की सारी बातें कहीं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “एक बहुत बड़े लाव-लश्कर के साथ”; हिब्रू शब्द חַיִל का अर्थ धन-संपत्ति, सामर्थ्य या बड़ा साथ चलने वाला दल हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּחַיִל כָּבֵד מְאֹד
  choice: एक बहुत बड़े लाव-लश्कर के साथ
  rationale: חַיִל धन-संपत्ति, सामर्थ्य या बड़े साथ चलने वाले दल को सूचित कर सकता है। राजकीय यात्रा के इस संदर्भ में ‘लाव-लश्कर’ प्रभावशाली बड़े दल और उसके वैभव—दोनों का स्वाभाविक संकेत देता है, बिना इसे केवल सेना मानने के। अस्पष्टता को पादटिप्पणी में रखा गया है।
- source_word: גְּמַלִּים נֹשְׂאִים בְּשָׂמִים
  choice: उसके ऊँट मसाले ... लादे हुए थे
  rationale: सहभागी क्रिया נֹשְׂאִים का दृश्यात्मक, जारी वर्णन आधुनिक हिन्दी में ‘लादे हुए थे’ से स्वाभाविक रूप में व्यक्त होता है।
- source_word: וְזָהָב רַב מְאֹד
  choice: बहुत अधिक सोना
  rationale: רַב מְאֹד की परिमाण-सूचक तीव्रता को सीधे और सहज हिन्दी में सुरक्षित रखा गया है।
- source_word: וְאֶבֶן יְקָרָה
  choice: बहुमूल्य पत्थर
  rationale: एकवचन אֶבֶן यहाँ समूहवाचक हो सकता है; हिन्दी में ‘बहुमूल्य पत्थर’ भी स्वाभाविक रूप से सामूहिक अर्थ देता है।
- source_word: וַתָּבֹא אֶל שְׁלֹמֹה
  choice: वह सुलैमान के पास आई
  rationale: दूसरे וַתָּבֹא से आगमन का अगला चरण—सुलैमान तक पहुँचना—दिखता है; पुनरावृत्ति को बनाए रखा गया है।
- source_word: וַתְּדַבֵּר אֵלָיו
  choice: वह सब उससे कहा
  rationale: אֶל के साथ דבר यहाँ अपने मन की सारी बात सुलैमान के सामने कहने का भाव देता है। ‘उससे कहा’ स्वाभाविक है और अनावश्यक रूप से द्विपक्षीय संवाद का दावा नहीं करता।
- source_word: אֵת כָּל אֲשֶׁר הָיָה עִם לְבָבָהּ
  choice: जो कुछ उसके मन में था
  rationale: हिब्रू मुहावरा भीतर के विचारों, प्रश्नों या चिंताओं को दर्शाता है। आधुनिक हिन्दी में ‘मन में था’ अर्थ को स्पष्ट और गरिमापूर्ण ढंग से देता है।
