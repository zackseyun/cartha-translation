  text: And all the earth sought the presence of Solomon[a], to hear his wisdom that God had put in his heart.
translation:
  language: hi
  text: और सारी पृथ्वी के लोग सुलैमान से भेंट करने का प्रयत्न करते थे,[a] ताकि उसकी वह बुद्धि सुनें जो परमेश्वर ने उसके हृदय में रखी थी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक अर्थ: “सुलैमान का मुख खोजते थे”; यह उससे मिलने या उसके सामने उपस्थित होने की इच्छा के लिए प्रयुक्त एक मुहावरा है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכָל הָאָרֶץ
  choice: और सारी पृथ्वी के लोग
  rationale: शाब्दिक रूप से ‘और सारी पृथ्वी’; राजकीय संदर्भ में यह ज्ञात संसार के लोगों के लिए व्यापक, अतिशयोक्तिपूर्ण सामूहिक अभिव्यक्ति है। हिंदी में ‘के लोग’ जोड़ने से आशय स्वाभाविक और स्पष्ट होता है।
- source_word: מְבַקְשִׁים
  choice: इच्छा रखते थे
  rationale: हिब्रू कृदंत निरंतर अथवा प्रचलित क्रिया बताता है; यह रूप उस customary sense को सहज हिंदी में व्यक्त करता है।
- source_word: אֶת־פְּנֵי שְׁלֹמֹה
  choice: सुलैमान से मिलने की
  rationale: शाब्दिक ‘सुलैमान का मुख खोजते थे’ एक मुहावरा है, जिसका अर्थ उसकी उपस्थिति में आने या उससे भेंट पाने का प्रयत्न करना है। मुख्य पाठ में स्वाभाविक अर्थ दिया गया और मूल बिंब पादटिप्पणी में रखा गया है।
- source_word: לִשְׁמֹעַ אֶת־חָכְמָתוֹ
  choice: ताकि उसकी ... बुद्धि सुनें
  rationale: लामेदयुक्त infinitive उद्देश्य व्यक्त करता है। ‘बुद्धि सुनना’ मूल अभिव्यक्ति को बनाए रखता है और संदर्भ में उसकी बुद्धिमत्तापूर्ण बातें सुनने का अर्थ देता है।
- source_word: אֲשֶׁר נָתַן אֱלֹהִים בְּלִבּוֹ
  choice: जो परमेश्वर ने उसके हृदय में रखी थी
  rationale: נָתַן का मूल अर्थ ‘दिया’ है, पर ‘हृदय में देना’ को हिंदी में ‘हृदय में रखना’ अधिक स्वाभाविक ढंग से व्यक्त करता है। ‘हृदय’ हिब्रू में बुद्धि, इच्छा और भीतरी व्यक्तित्व के व्यापक भाव को सुरक्षित रखता है।
theological_decisions:
- issue: אֱלֹהִים का अनुवाद
  choice: परमेश्वर
  alternative: यहोवा / प्रभु
  rationale: मूल पाठ में אֱלֹהִים है, वाचा-नाम YHWH नहीं; इसलिए दोनों के बीच का शब्दगत भेद बनाए रखा गया है।
- issue: ‘हृदय’ का मानवशास्त्रीय आशय
  choice: हृदय
  alternative: मन
  rationale: हिब्रू לֵב केवल भावनाओं का नहीं, बल्कि बुद्धि, इच्छा और भीतरी व्यक्ति का भी द्योतक है। ‘मन’ कहने से इसका अर्थ अनावश्यक रूप से केवल संज्ञान तक सीमित हो सकता है।
translation_notes:
  register: आधुनिक मानक हिंदी में सहज, गरिमापूर्ण शैली अपनाई गई है। ‘सारी पृथ्वी के लोग’ प्राचीन राजकीय अतिशयोक्ति का व्यापक आशय स्पष्ट करता है; ‘सुलैमान से मिलने’ से हिब्रू मुहावरे का स्वाभाविक अर्थ मिलता है, जबकि पादटिप्पणी मूल बिंब सुरक्षित रखती है।
