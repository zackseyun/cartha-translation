base_translation:
  language: en
  yaml_path: translation/ot/1_kings/010/023.yaml
  text: So King Solomon surpassed all the kings of the earth in wealth and wisdom[a].
translation:
  language: hi
  text: इस प्रकार राजा सुलैमान धन और बुद्धि में पृथ्वी के सभी राजाओं से बढ़कर हो गया।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक शाब्दिक रूप में: “और राजा सुलैमान धन और बुद्धि में पृथ्वी के सभी राजाओं से अधिक महान हो गया।”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּגְדַּל
  choice: बढ़कर हो गया
  rationale: גדל का यह रूप מן के साथ तुलना व्यक्त करता है और सुलैमान के अन्य राजाओं से अधिक महान हो जाने का भाव देता है। ‘बढ़कर हो गया’ इस गतिशील तथा तुलनात्मक अर्थ को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: הַמֶּלֶךְ שְׁלֹמֹה
  choice: राजा सुलैमान
  rationale: हिन्दी में उपाधि और नाम का स्वाभाविक क्रम यही है; इससे निश्चित राजकीय उपाधि और व्यक्ति का नाम दोनों स्पष्ट रहते हैं।
- source_word: מִכֹּל מַלְכֵי הָאָרֶץ
  choice: पृथ्वी के सभी राजाओं से
  rationale: אֶרֶץ का अर्थ ‘देश/भूमि’ या ‘पृथ्वी’ हो सकता है। अंतरराष्ट्रीय राजाओं की इस व्यापक तुलना में ‘पृथ्वी’ उपयुक्त है, जबकि स्रोत की व्यापक अभिव्यक्ति को सीमित नहीं करता।
- source_word: לְעֹשֶׁר
  choice: धन में
  rationale: עֹשֶׁר भौतिक संपन्नता को दर्शाता है। ‘धन’ सामान्य आधुनिक हिन्दी में संक्षिप्त, स्पष्ट और गरिमापूर्ण है।
- source_word: וּלְחָכְמָה
  choice: और बुद्धि में
  rationale: חָכְמָה का सामान्य अर्थ ‘बुद्धि’ है। हिन्दी में विभक्ति ‘में’ को दोनों समन्वित संज्ञाओं के साथ रखना तुलना को स्पष्ट और स्वाभाविक बनाता है।
- source_word: וַ
  choice: इस प्रकार
  rationale: आरंभिक waw कथानक को आगे बढ़ाते हुए यहाँ सारात्मक या परिणामसूचक संबंध रख सकता है। ‘इस प्रकार’ उस प्रवाह को स्वाभाविक हिन्दी में व्यक्त करता है; अधिक औपचारिक विकल्प ‘और’ है।
theological_decisions: []
