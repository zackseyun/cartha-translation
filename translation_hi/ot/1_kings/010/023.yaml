  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और कथात्मक शैली रखी गई है। ‘बढ़कर हो गया’ मूल क्रिया के तुलनात्मक और विकाससूचक पहलुओं को साथ रखता है; अधिक शाब्दिक रूप पादटिप्पणी में दिया गया है।
