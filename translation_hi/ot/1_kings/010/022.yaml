  yaml_path: translation/ot/1_kings/010/022.yaml
  text: For the king had ships of Tarshish at sea with Hiram’s ships. Once every three years the ships of Tarshish would come, carrying gold and silver, ivory, apes, and peacocks.
translation:
  language: hi
  text: क्योंकि समुद्र में राजा के पास हीराम के जहाज़ों के साथ तर्शीश के जहाज़ थे। हर तीन वर्ष में एक बार तर्शीश के जहाज़ सोना, चाँदी, हाथीदाँत, बंदर और मोर लेकर आते थे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֳנִי תַרְשִׁישׁ
  choice: तर्शीश के जहाज़
  rationale: इब्रानी संबंध-वाचक पदबंध का सीधा और स्वाभाविक अनुवाद; यह अनावश्यक रूप से ‘बेड़ा’ या किसी निश्चित जहाज़-प्रकार का अर्थ नहीं जोड़ता।
- source_word: שֶׁנְהַבִּים
  choice: हाथीदाँत
  rationale: संदर्भ में व्यापार-वस्तु के रूप में स्वीकृत अर्थ।
- source_word: קֹפִים
  choice: बंदर
  rationale: शब्द का सामान्य और व्यापक रूप से मान्य अर्थ।
- source_word: תֻכִּיִּים
  choice: मोर
  rationale: परंपरागत और संदर्भ-संगत अर्थ, यद्यपि इस दुर्लभ शब्द की सटीक पहचान पूर्णतः निश्चित नहीं है।
theological_decisions:
- issue: ‘तर्शीश के जहाज़’ का आशय
  choice: तर्शीश के जहाज़
  alternative: तर्शीश जाने वाले जहाज़ / तर्शीश-प्रकार के जहाज़
  rationale: मूल पदबंध की भौगोलिक अथवा वर्ग-सूचक अस्पष्टता को मुख्य पाठ में बनाए रखा गया है।
- issue: חירם के जहाज़ों से संबंध
  choice: हीराम के जहाज़ों के साथ
  alternative: हीराम के बेड़े के साथ
  rationale: मूल में ‘जहाज़’ है; ‘बेड़ा’ जोड़ने से संगठनात्मक अर्थ अधिक निश्चित हो जाता।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और मूल की पुनरुक्ति को यथासंभव सुरक्षित रखने वाला रूप। ‘हर तीन वर्ष में एक बार’ सामान्य पाठक के लिए स्वाभाविक है।
