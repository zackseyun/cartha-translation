  to: और वहाँ छह सीढ़ियों पर, इस ओर और उस ओर, बारह सिंह खड़े थे; ऐसा किसी भी राज्य में नहीं बनाया गया था।
  rationale: The revision preserves the Hebrew descriptive participle and symmetrical placement while improving Hindi syntax. It also renders the final negative comparison idiomatically as “किसी भी राज्य में,” corresponding to the sense conveyed by the English audit trail’s “in any kingdom.”
