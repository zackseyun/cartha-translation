  yaml_path: translation/ot/1_kings/010/020.yaml
  text: And twelve lions were standing there on the six steps[a], on this side and on that side[b]; nothing like it had been made in any kingdom.
translation:
  language: hi
  text: और वहाँ छह सीढ़ियों पर, इस ओर और उस ओर, बारह सिंह खड़े थे; ऐसा किसी भी राज्य में नहीं बनाया गया था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/שְׁנֵים עָשָׂר אֲרָיִים
  choice: और बारह सिंह
  rationale: संख्या और बहुवचन संज्ञा का सीधा, स्वाभाविक अनुवाद; संदर्भ में ये सिंहों की आकृतियाँ हैं।
- source_word: עֹמְדִים שָׁם
  choice: वहाँ ... खड़े थे
  rationale: बहुवचन कृदंत दृश्य की वर्णनात्मक, स्थितिमूलक प्रकृति व्यक्त करता है।
- source_word: עַל שֵׁשׁ הַמַּעֲלוֹת
  choice: उन छह सीढ़ियों पर
  rationale: מַעֲלוֹת सिंहासन तक जाने वाली सीढ़ियों को दर्शाता है और עַל का सामान्य स्थानवाचक अर्थ 'पर' है।
- source_word: מִ/זֶּה וּ/מִ/זֶּה
  choice: इस ओर और उस ओर
  rationale: यह सममित स्थान-वितरण का मुहावरा है और दोनों ओर रखे सिंहों का चित्र सुरक्षित रखता है।
- source_word: לֹא נַעֲשָׂה כֵן
  choice: ऐसा ... नहीं बनाया गया था
  rationale: निफ़अल पूर्ण रूप और כֵן को निकटता से रखते हुए हिंदी में स्वाभाविक निष्क्रिय वाक्य बनाया गया है।
- source_word: לְ/כָל מַמְלָכוֹת
  choice: किसी भी राज्य के लिए
  rationale: नकारात्मक संदर्भ में לְכָל का वितरणात्मक अर्थ 'किसी भी ... के लिए' है; यह हिब्रू के 'के लिए' संबंध को 'में' से अधिक स्पष्ट रूप से बचाता है।
