source:
  edition: WLC
  text: וַ/יַּ֣עַשׂ הַ֠/מֶּלֶךְ אֶת עֲצֵ֨י הָ/אַלְמֻגִּ֜ים מִסְעָ֤ד לְ/בֵית יְהוָה֙ וּ/לְ/בֵ֣ית הַ/מֶּ֔לֶךְ וְ/כִנֹּר֥וֹת וּ/נְבָלִ֖ים לַ/שָּׁרִ֑ים לֹ֣א בָֽא כֵ֞ן עֲצֵ֤י אַלְמֻגִּים֙ וְ/לֹ֣א נִרְאָ֔ה עַ֖ד הַ/יּ֥וֹם הַ/זֶּֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/010/012.yaml
  text: The king made the almug wood into supports for the house of Yahweh and for the king’s house[a], and lyres and harps for the singers. Never before had such almug wood come[b], nor has any been seen to this day.
translation:
  language: hi
  text: राजा ने अलमुग की लकड़ी से याहवे के भवन और राजभवन के लिए सहारे बनवाए, और गायकों के लिए वीणाएँ और सारंगियाँ बनवाईं। ऐसी अलमुग की लकड़ी इससे पहले कभी नहीं आई थी, और न आज के दिन तक देखी गई है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עֲצֵי הָאַלְמֻגִּים
  choice: अलमुग की लकड़ी
  rationale: यह किसी बहुमूल्य आयातित लकड़ी का अनिश्चित प्रजाति-नाम है; आधुनिक वनस्पति की अटकल लगाने के बजाय इब्रानी नाम का लिप्यंतरण रखा गया है।
- source_word: מִסְעָד
  choice: सहारे
  rationale: यह दुर्लभ और अनिश्चित वास्तुशिल्पीय शब्द है। ‘सहारे’ व्यापक और सावधान अनुवाद है; सीढ़ियाँ या रेलिंग भी संभव हैं।
- source_word: לְבֵית יְהוָה
  choice: यहोवा के भवन के लिए
  rationale: ‘भवन’ इब्रानी ‘घर’ के धार्मिक-वास्तुशिल्पीय प्रयोग को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: व्यक्तिगत दिव्य नाम को हिन्दी में प्रचलित रूप ‘यहोवा’ से व्यक्त किया गया है।
- source_word: וּלְבֵית הַמֶּלֶךְ
  choice: और राजभवन के लिए
  rationale: राजा के ‘घर’ के आशय को आधुनिक हिन्दी में स्पष्ट और सहज रूप से व्यक्त करता है।
- source_word: וְכִנֹּרוֹת וּנְבָלִים
  choice: वीणाएँ और सारंगियाँ
  rationale: दो अलग प्रकार के तारवाद्यों का भेद बनाए रखा गया है; उनकी सटीक आधुनिक पहचान अनिश्चित है।
- source_word: לַשָּׁרִים
  choice: गायकों के लिए
  rationale: यह שׁיר, ‘गाना’, से बना रूप है और सीधे गायकों को सूचित करता है।
- source_word: לֹא בָא כֵן
  choice: ऐसी ... फिर कभी नहीं आई
  rationale: अभिव्यक्ति उस लकड़ी के आगमन की अद्वितीयता बताती है; हिन्दी में इसे स्वाभाविक ढंग से प्रस्तुत किया गया है।
- source_word: וְלֹא נִרְאָה עַד הַיּוֹם הַזֶּה
  choice: और न आज के दिन तक देखी गई है
  rationale: वृत्तांतकार के समय तक जारी स्थिति को बनाए रखता है।
theological_decisions:
- issue: दिव्य नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल में चतुरक्षरी व्यक्तिगत नाम सीधे आया है। हिन्दी पाठकों के लिए प्रतिष्ठित और सुबोध लिप्यंतरण ‘यहोवा’ रखा गया है, उपाधि ‘प्रभु’ से प्रतिस्थापित नहीं किया गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। दुर्लभ लकड़ी के नाम को लिप्यंतरित किया गया और अनिश्चित वास्तुशिल्पीय शब्द को पादटिप्पणी में स्पष्ट किया गया है।
