  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या, इस कठिन इब्रानी शब्द के एक अन्य अर्थ के अनुसार: “और एक झुंड से; राजा के व्यापारी दाम देकर एक झुंड प्राप्त करते थे।”'
    reason: lexical_alternative
  - marker: b
    text: इस पद में प्रयुक्त इब्रानी शब्द מִקְוֶה/מִקְוֵה का अर्थ अनिश्चित है। यह किसी स्थान का नाम—कूए, संभवतः किलिकिया में स्थित—हो सकता है, या “झुंड” अथवा “संग्रह” जैसी कोई सामान्य संज्ञा।
    reason: cultural_note
