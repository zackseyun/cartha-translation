translation:
  language: hi
  text: यह यात्रा करने वाले व्यापारियों[a] से, व्यापारियों के व्यापार से होने वाली आय से, तथा अरब के सब राजाओं[b] और देश के राज्यपालों[c] से मिलने वाले सोने के अतिरिक्त था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “यात्रा करने वाले लोगों से”; इब्रानी पदबंध कठिन है और अधिक सामान्य रूप से घूमने-फिरने वाले व्यापारियों की ओर संकेत कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: या “मिश्रित जातियों के सब राजाओं से”; कुछ संदर्भों में इब्रानी עֶרֶב का यह अर्थ हो सकता है, यद्यपि यहाँ “अरब” अधिक उपयुक्त है।
    reason: alternative_reading
  - marker: c
    text: या “प्रांतीय राज्यपालों” अथवा “क्षत्रपों” से।
    reason: lexical_alternative
