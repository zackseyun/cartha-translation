- source_word: וּפַחוֹת הָאָרֶץ
  choice: और देश के राज्यपालों से
  rationale: פַחוֹת अधीनस्थ प्रादेशिक शासकों या अधिकारियों के लिए प्रयुक्त है; ‘राज्यपाल’ आधुनिक हिंदी में स्पष्ट है और अनावश्यक रूप से फ़ारसी-कालीन ‘क्षत्रप’ नहीं थोपता।
