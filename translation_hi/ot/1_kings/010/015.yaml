  rationale: दुर्बोध इब्रानी पदबंध में תָּרִים घूमने या यात्रा करने वालों को सूचित करता है; व्यापारिक संदर्भ में घुमंतू व्यापारियों का भाव सबसे उपयुक्त है, पर वैकल्पिक अर्थ पाद-टिप्पणी में रखा गया है।
- source_word: וּמִסְחַר הָרֹכְלִים
  choice: और व्यापारियों के व्यापार से
