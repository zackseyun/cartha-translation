- source_word: דְּבָרֶיהָ
  choice: उसके सभी प्रश्नों
  rationale: דבר का अर्थ व्यापक रूप से ‘बात/विषय/शब्द’ हो सकता है। पद 1 के संदर्भ में ये रानी की जिज्ञासाएँ और कठिन प्रश्न हैं, इसलिए प्रसंगानुसार ‘प्रश्नों’ चुना गया है।
- source_word: לֹא הָיָה דָּבָר נֶעְלָם
  choice: ऐसी कोई बात ... छिपी न थी
  rationale: यह हिन्दी में स्वाभाविक रहते हुए इस भाव को बनाए रखता है कि कोई विषय राजा की समझ या ज्ञान से परे नहीं रहा।
- source_word: מִן־הַמֶּלֶךְ
  choice: राजा से
  rationale: מן को निष्क्रिय ‘छिपी’ के साथ ‘से’ कहना इब्रानी संरचना और राजकीय संबोधन दोनों को सुरक्षित रखता है।
- source_word: אֲשֶׁר לֹא הִגִּיד לָהּ
  choice: जिसे उसने उसे न बताया हो
  rationale: यह संबंधवाचक उपवाक्य मूल पाठ के इस कथन को सीधे रखता है कि राजा ने हर बात उसे बता दी।
