- source_word: בְּאַרְצִי
  choice: अपने देश में
  rationale: אֶרֶץ और प्रथम-पुरुष प्रत्यय को प्रसंगानुकूल, स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: עַל־דְּבָרֶיךָ
  choice: आपके कथनों
  rationale: דְּבָרִים का मूल अर्थ ‘बातें/वचन’ है; ‘कथनों’ से शाब्दिक निकटता रहती है, जबकि व्यापक ‘कार्यों/मामलों’ की सम्भावना पादटिप्पणी में सुरक्षित है।
- source_word: וְעַל־חָכְמָתֶךָ
  choice: और आपकी बुद्धि
  rationale: समन्वयी संरचना और प्रसंग का केंद्रीय भाव सीधे बनाए रखता है।
