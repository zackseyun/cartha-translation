  register: आधुनिक मानक हिन्दी में गरिमापूर्ण और सहज शैली रखी गई है। ‘बहुतायत से उपलब्ध कर दिया’ इब्रानी נתן के प्रचुरता-सूचक मुहावरे को स्पष्ट करता है। भौगोलिक नाम ‘शफेला’ को बनाए रखते हुए पादटिप्पणी में उसका अर्थ दिया गया है; सभी पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित हैं।
