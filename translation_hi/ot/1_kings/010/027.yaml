source:
  edition: WLC
  text: וַ/יִּתֵּ֨ן הַ/מֶּ֧לֶךְ אֶת הַ/כֶּ֛סֶף בִּ/ירוּשָׁלִַ֖ם כָּ/אֲבָנִ֑ים וְ/אֵ֣ת הָ/אֲרָזִ֗ים נָתַ֛ן כַּ/שִּׁקְמִ֥ים אֲשֶׁר בַּ/שְּׁפֵלָ֖ה לָ/רֹֽב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/010/027.yaml
  text: The king made silver as common in Jerusalem as stones[b][a], and he made cedars as plentiful as the sycamore trees that are in the Shephelah.
translation:
  language: hi
  text: राजा ने यरूशलेम में चाँदी को पत्थरों के समान सामान्य कर दिया, और देवदारों को शफेला[a] में बहुतायत से पाए जाने वाले गूलर-अंजीर के पेड़ों[b] के समान प्रचुर कर दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “निचले पहाड़ी प्रदेश में।” “शफेला” यहूदा के पहाड़ी देश और तटीय मैदान के बीच स्थित तलहटी वाले क्षेत्र का नाम है।
    reason: cultural_note
  - marker: b
    text: इब्रानी “शिक्मिम,” जिससे गूलर-अंजीर (sycamore fig) के पेड़ अभिप्रेत हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֵּן / נָתַן
  choice: बहुतायत से उपलब्ध कर दिया
  rationale: यहाँ נתן का शाब्दिक अर्थ ‘दिया/रखा’ है, पर तुलनात्मक मुहावरे में आशय किसी वस्तु को अत्यन्त प्रचुर और सहज उपलब्ध कर देना है।
- source_word: הַמֶּלֶךְ
  choice: राजा
  rationale: इब्रानी पाठ में ‘राजा’ ही है; संदर्भ में सुलैमान होने पर भी पद में नाम नहीं जोड़ा गया।
- source_word: הַכֶּסֶף
  choice: चाँदी
  rationale: यहाँ यह धातु अथवा संपदा के रूप में चाँदी का सामान्य उल्लेख है।
- source_word: בִּירוּשָׁלִַם
  choice: यरूशलेम में
  rationale: स्थानवाचक रूप का सीधा और स्वाभाविक हिन्दी अनुवाद।
- source_word: כָּאֲבָנִים
  choice: पत्थरों के समान
  rationale: उपसर्ग כ तुलना व्यक्त करता है; यह अभिव्यक्ति चाँदी की अत्यधिक प्रचुरता बताती है।
- source_word: הָאֲרָזִים
  choice: देवदारों
  rationale: बहुवचन संज्ञा को उसके सामान्य वृक्षार्थ में रखा गया है; संदर्भ में लकड़ी भी निहित हो सकती है, पर मूल पाठ उस अर्थ को स्पष्ट नहीं करता।
- source_word: כַּשִּׁקְמִים
  choice: गूलर-अंजीर के पेड़ों के समान
  rationale: שקמים से आशय लेवांत में पाए जाने वाले sycamore fig वृक्षों से है; ‘गूलर-अंजीर’ इसे सामान्य अंजीर या अंग्रेज़ी sycamore से अलग पहचान देता है।
- source_word: אֲשֶׁר בַּשְּׁפֵלָה
  choice: शफेला में पाए जाने वाले
  rationale: שפלה यहूदा के पहाड़ी देश और तटीय मैदान के बीच का विशिष्ट भौगोलिक क्षेत्र है; नाम को लिप्यंतरित करके टिप्पणी में समझाया गया है।
- source_word: לָרֹב
  choice: बहुतायत से
  rationale: यह पदबंध बड़ी मात्रा या प्रचुरता व्यक्त करता है और दोनों तुलनाओं का आशय स्वाभाविक हिन्दी में स्पष्ट करता है।
