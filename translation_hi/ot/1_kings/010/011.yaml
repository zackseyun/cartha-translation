- source_word: אֲשֶׁר נָשָׂא זָהָב
  choice: जो … सोना लाता था
  rationale: नָשָׂא का मूल अर्थ उठाना/ढोना है; समुद्री व्यापार के इस प्रसंग में ‘लाता था’ स्वाभाविक हिन्दी है और अपूर्णतासूचक रूप नियमित परिवहन का संकेत देता है।
- source_word: מֵאוֹפִיר
  choice: ओपीर से
  rationale: स्थान-नाम और उसके साथ लगे ‘से’ संबंध को सीधे सुरक्षित रखा गया है।
- source_word: הֵבִיא
  choice: लाया
  rationale: हिफ़ील रूप का सामान्य अर्थ ‘ले आया’ है; हिन्दी में ‘लाया’ स्पष्ट और स्वाभाविक है।
- source_word: עֲצֵי אַלְמֻגִּים
  choice: अलगूम की लकड़ी
  rationale: लकड़ी की ठीक वनस्पति-जाति अनिश्चित है; इसलिए किसी निश्चित जाति, जैसे चंदन, को आरोपित करने के बजाय हिब्रू-आधारित नाम रखा गया है।
- source_word: הַרְבֵּה מְאֹד
  choice: बहुत बड़ी मात्रा में
  rationale: यह पदबंध अत्यधिक प्रचुरता पर बल देता है; यह हिन्दी अभिव्यक्ति उस तीव्रता को स्वाभाविक रूप से दर्शाती है।
- source_word: וְאֶבֶן יְקָרָה
  choice: और बहुमूल्य पत्थर
  rationale: हिब्रू एकवचन सामूहिक अर्थ दे सकता है; हिन्दी में ‘पत्थर’ का यही रूप एकवचन और बहुवचन दोनों के लिए स्वाभाविक है।
