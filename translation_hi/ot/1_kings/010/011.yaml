  yaml_path: translation/ot/1_kings/010/011.yaml
  text: Also[a], Hiram’s fleet, which carried gold from Ophir[b], brought from Ophir a very great quantity of almug wood and precious stones.
translation:
  language: hi
  text: इसके अलावा, हीराम का जहाज़ी बेड़ा[a], जो ओपीर से सोना लाया था, ओपीर से अलमुग की लकड़ी[b] बहुत ही बड़ी मात्रा में और बहुमूल्य पत्थर भी लाया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “हीराम का जहाज़”; हिब्रू संज्ञा एकवचन है, पर वह हीराम के समुद्री उद्यम के लिए सामूहिक अर्थ में प्रयुक्त हो सकती है।
    reason: lexical_alternative
  - marker: b
    text: “अलमुग की लकड़ी” को “अलगूम की लकड़ी” भी कहा जा सकता है; इसकी ठीक वनस्पति-जाति निश्चित नहीं है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם
  choice: इसके अलावा … भी
  rationale: यह पद पिछले वृत्तांत में अतिरिक्त जानकारी जोड़ता है; हिन्दी में विभाजित रचना ‘इसके अलावा … भी’ इसके योगात्मक बल को स्वाभाविक ढंग से व्यक्त करती है।
