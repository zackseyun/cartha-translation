  text: तब राजा ने हाथीदाँत का एक विशाल सिंहासन बनाया और उसे उत्तम सोने से मढ़ा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: तब ... बनवाया
  rationale: वय्यिक्तोल कथा को आगे बढ़ाता है, इसलिए ‘तब’ क्रमिकता व्यक्त करता है। राजकीय संदर्भ में राजा द्वारा कारीगरों से काम कराने का स्वाभाविक हिन्दी प्रयोग ‘बनवाया’ है।
- source_word: הַמֶּלֶךְ
  choice: राजा
  rationale: संदर्भ में निश्चित रूप से सुलैमान की ओर संकेत है; हिन्दी में यहाँ ‘राजा’ स्वाभाविक और स्पष्ट है।
- source_word: כִּסֵּא
  choice: सिंहासन
  rationale: राजकीय संदर्भ में सामान्य ‘आसन’ की अपेक्षा ‘सिंहासन’ सटीक है।
- source_word: שֵׁן
  choice: हाथीदाँत
  rationale: शाब्दिक अर्थ ‘दाँत’ है, पर सामग्री के रूप में यह हाथीदाँत को सूचित करता है।
- source_word: גָּדוֹל
  choice: विशाल
  rationale: यह आकार और राजसी भव्यता दोनों का भाव देता है; केवल ‘बड़ा’ की तुलना में प्रसंगानुकूल है।
- source_word: וַיְצַפֵּהוּ
  choice: उस पर ... मढ़वाया
  rationale: צפה का अर्थ किसी वस्तु पर धातु की परत चढ़ाना है। ‘मढ़वाया’ शिल्पकारी और राजकीय कर्तृता दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: זָהָב
  choice: सोना
  rationale: सामग्री का सीधा और असंदिग्ध नाम।
- source_word: מוּפָז
  choice: उत्तम
  rationale: यह उच्च कोटि के सोने का द्योतक है, पर इसका ठीक तकनीकी आशय अनिश्चित है। ‘उत्तम’ गुणवत्ता बनाए रखता है और ‘शुद्ध’ अथवा ‘परिष्कृत’ में से किसी एक अर्थ को अनावश्यक रूप से निश्चित नहीं करता।
