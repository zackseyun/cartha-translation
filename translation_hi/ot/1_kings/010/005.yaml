base_translation:
  language: en
  yaml_path: translation/ot/1_kings/010/005.yaml
  text: the food of his table[a], the seating of his servants, the attendance of his ministers, their clothing, his cupbearers, and his burnt offering that he offered at the house of Yahweh, there was no more breath in her.
translation:
  language: hi
  text: उसकी मेज़ का भोजन, उसके सेवकों के बैठने की व्यवस्था, उसके परिचारकों का खड़ा रहना, उनके वस्त्र, उसके पेय परोसनेवाले, और वह होमबलि जिसे वह याहवे के भवन में चढ़ाता था[a]—इन सबको देखकर रानी की साँस थम-सी गई।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “याहवे के भवन तक उसका ऊपर जाना,” संभवतः उस सीढ़ी, मार्ग या जुलूस के विषय में जिससे वह ऊपर जाता था।
    reason: alternative_reading
lexical_decisions:
- source_word: מַאֲכַל שֻׁלְחָנוֹ
  choice: उसकी मेज़ का भोजन
  rationale: यह ठोस इब्रानी बिंब को स्वाभाविक आधुनिक हिन्दी में बनाए रखता है।
- source_word: מוֹשַׁב עֲבָדָיו
  choice: उसके सेवकों के बैठने की व्यवस्था
  rationale: दरबार में सेवकों के क्रमबद्ध स्थान या बैठने की रीति को व्यक्त करता है और מוֹשָׁב की प्रसंगगत व्यापकता बनाए रखता है।
- source_word: מַעֲמַד מְשָׁרְתָיו
  choice: उसके परिचारकों का खड़ा रहना
  rationale: מַעֲמָד के 'खड़े होने/नियत स्थान पर उपस्थित रहने' के ठोस अर्थ को सुरक्षित रखता है तथा परिचारकों को सामान्य सेवकों से अलग करता है।
- source_word: מַלְבֻּשֵׁיהֶם
  choice: उनके वस्त्र
  rationale: गरिमापूर्ण, स्पष्ट और मूल संज्ञा का सीधा अनुवाद है।
- source_word: מַשְׁקָיו
  choice: उसके पिलानेवाले
  rationale: राजदरबार में पेय परोसनेवाले अधिकारियों का संकेत देता है; हिन्दी में अर्थ स्पष्ट रखते हुए पद की क्रिया-आधारित प्रकृति बचाता है।
- source_word: עֹלָתוֹ אֲשֶׁר יַעֲלֶה בֵּית יְהוָה
  choice: वह होमबलि जो वह यहोवा के भवन में चढ़ाता था
  rationale: मुख्य पाठ में मसोरा-प्रदत्त स्वरांकन עֹלָה ('होमबलि') का अनुसरण किया गया है; 'चढ़ाता था' יַעֲלֶה के बलि चढ़ाने वाले अर्थ को स्वाभाविक हिन्दी में देता है। वैकल्पिक 'चढ़ाई/मार्ग' पादटिप्पणी में सुरक्षित है।
- source_word: בֵּית יְהוָה
  choice: यहोवा का भवन
  rationale: בֵּית का 'भवन/घर' बिंब और יְהוָה का व्यक्तिगत वाचा-नाम दोनों सुरक्षित रहते हैं।
- source_word: וְלֹא הָיָה בָּהּ עוֹד רוּחַ
  choice: उसकी साँस थम-सी गई
  rationale: רוּחַ के 'साँस' बिंब को रखते हुए विस्मय से अभिभूत होने की इब्रानी मुहावरेदार शक्ति को सहज हिन्दी में व्यक्त करता है; 'थम-सी' इसे शाब्दिक मृत्यु के कथन के रूप में पढ़े जाने से बचाता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल में आए वाचा-नाम को 'प्रभु' जैसे पदनाम से नहीं बदला गया। आधुनिक हिन्दी बाइबलीय प्रयोग में पहचाने जाने योग्य 'यहोवा' रखा गया, यद्यपि 'याहवे' अधिक संभावित विद्वतापरक उच्चारण है।
- issue: עֹלָתוֹ की व्याख्या
  choice: उसका होमबलि
  alternative: यहोवा के भवन तक उसकी चढ़ाई अथवा वह मार्ग/सीढ़ी जिससे वह ऊपर जाता था
  rationale: WLC का मसोरा स्वरांकन 'होमबलि' का समर्थन करता है। व्यंजनात्मक पाठ से जुड़ी वास्तविक वैकल्पिक समझ को मुख्य पाठ में निर्णायक ढंग से मिटाने के बजाय पादटिप्पणी में रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। दरबारी सूची की ठोस समानांतर संरचना बचाई गई है। अंतिम मुहावरे को अत्यधिक शाब्दिक न बनाते हुए 'साँस' का मूल बिंब सुरक्षित रखा गया है।
