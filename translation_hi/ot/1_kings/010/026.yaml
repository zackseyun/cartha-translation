base_translation:
  language: en
  yaml_path: translation/ot/1_kings/010/026.yaml
  text: Solomon gathered chariots and horsemen[a], and he had 1,400 chariots and 12,000 horsemen, and he stationed them in the chariot cities and with the king in Jerusalem.
translation:
  language: hi
  text: सुलैमान ने रथ और घुड़सवार[a] इकट्ठे किए। उसके पास 1,400 रथ और 12,000 घुड़सवार थे। उसने उन्हें रथ-नगरों में और यरूशलेम में राजा के पास तैनात किया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “अश्वारोही सेना”; इब्रानी शब्द अधिक शाब्दिक रूप से घोड़ों पर सवार लोगों को सूचित करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֶּאֱסֹף
  choice: इकट्ठे किए
  rationale: אסף यहाँ सैन्य संसाधनों को एकत्र करने का बोध देता है; यह सहज और अर्थनिष्ठ हिन्दी है।
- source_word: רֶכֶב
  choice: रथ
  rationale: एकवचन रूप यहाँ सामूहिक अर्थ में है, जबकि संख्या के साथ हिन्दी में भी ‘रथ’ का रूप स्वाभाविक रहता है।
- source_word: פָרָשִׁים
  choice: घुड़सवार
  rationale: यह शब्द घोड़ों के बजाय उन पर सवार योद्धाओं को सूचित करता है; ‘घुड़सवार’ शाब्दिक अर्थ और सैन्य संदर्भ दोनों को बनाए रखता है।
- source_word: וַיְהִי לוֹ
  choice: उसके पास ... थे
  rationale: यह इब्रानी मुहावरा स्वामित्व प्रकट करता है; हिन्दी में यह इसका स्वाभाविक समतुल्य है।
- source_word: אֶלֶף וְאַרְבַּע מֵאוֹת רֶכֶב
  choice: 1,400 रथ
  rationale: संख्या और संज्ञा को आधुनिक हिन्दी में सीधे और स्पष्ट रूप से प्रस्तुत किया गया है।
- source_word: וּשְׁנֵים עָשָׂר אֶלֶף פָּרָשִׁים
  choice: 12,000 घुड़सवार
  rationale: संख्या का सीधा अनुवाद है और פָרָשִׁים के लिए वही अर्थनिष्ठ शब्द रखा गया है।
- source_word: וַיַּנְחֵם
  choice: उसने उन्हें ... तैनात किया
  rationale: नूह के हिफ़ील रूप का अर्थ यहाँ किसी सैन्य बल को नियत स्थान पर रखना है; ‘तैनात किया’ संदर्भ को स्पष्ट करता है।
- source_word: בְּעָרֵי הָרֶכֶב
  choice: रथों के लिए ठहराए गए नगरों में
  rationale: शाब्दिक ‘रथ-नगरों’ की अपेक्षा यह हिन्दी में अधिक स्वाभाविक है और ऐसे नियत सैन्य नगरों का आशय सुरक्षित रखता है।
- source_word: וְעִם הַמֶּלֶךְ בִּירוּשָׁלָם
  choice: और अपने पास यरूशलेम में
  rationale: इब्रानी में ‘राजा के साथ’ है; संदर्भ में राजा सुलैमान ही है, इसलिए हिन्दी में ‘अपने पास’ अनावश्यक पुनरुक्ति से बचते हुए स्थान-विभाजन स्पष्ट करता है।
