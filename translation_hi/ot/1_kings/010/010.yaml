base_translation:
  language: en
  yaml_path: translation/ot/1_kings/010/010.yaml
  text: And she gave the king one hundred and twenty talents of gold[a], and a very great quantity of spices, and precious stones. Never again did such an abundance of spices come as those that the queen of Sheba gave to King Solomon.
translation:
  language: hi
  text: उसने राजा को एक सौ बीस किक्कार सोना,[a] बहुत बड़ी मात्रा में सुगंध-द्रव्य और बहुमूल्य रत्न दिए। फिर कभी इतनी बहुतायत में सुगंध-द्रव्य नहीं आए, जितने शीबा की रानी ने राजा सुलैमान को दिए थे।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “किक्कार” प्राचीन भार-माप था। इसका ठीक वजन समय और स्थान के अनुसार भिन्न हो सकता था।
    reason: ancient_measure
  - marker: b
    text: इब्रानी में तुलना वाले वाक्यांश में “सुगंध-द्रव्य” एकवचन है, पर वह सामूहिक अर्थ में प्रयुक्त प्रतीत होता है; इसलिए यहाँ बहुवचन/सामूहिक अर्थ रखा गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּתֵּן
  choice: उसने ... दिए
  rationale: वय्यिक्तोल कथा को आगे बढ़ाता है; हिंदी में पूर्ववर्ती संदर्भ से जुड़ा स्वाभाविक कथात्मक क्रम रखा गया है।
- source_word: מֵאָה וְעֶשְׂרִים כִּכַּר זָהָב
  choice: एक सौ बीस किक्कार सोना
  rationale: כִּכָּר प्राचीन भार-माप है। आधुनिक वजन में अनुमानित रूपांतरण करने के बजाय पारदर्शिता हेतु पारंपरिक इकाई रखी गई है और पादटिप्पणी में समझाई गई है।
- source_word: וּבְשָׂמִים הַרְבֵּה מְאֹד
  choice: बहुत बड़ी मात्रा में सुगंध-द्रव्य
  rationale: בְּשָׂמִים सुगंधित मसालों अथवा बालसम-जैसी वस्तुओं का सामूहिक बोध देता है; 'सुगंध-द्रव्य' हिंदी में इस व्यापक अर्थ को बनाए रखता है।
- source_word: וְאֶבֶן יְקָרָה
  choice: बहुमूल्य रत्न
  rationale: एकवचन אֶבֶן यहाँ सूची में सामूहिक अर्थ रख सकता है; हिंदी बहुवचन-सदृश सामूहिक 'रत्न' स्वाभाविक है।
- source_word: לֹא בָא ... עוֹד לָרֹב
  choice: उतनी मात्रा में फिर कभी नहीं आए
  rationale: בוא का अर्थ यहाँ वस्तुओं का आना अथवा लाया जाना है; कर्मवाच्य जोड़ने के बजाय स्रोत की अभिव्यक्ति बनाए रखी गई है।
- source_word: כַבֹּשֶׂם הַהוּא
  choice: उतनी मात्रा में सुगंध-द्रव्य
  rationale: एकवचन בֹּשֶׂם को सामूहिक माना गया है और לָרֹב की मात्रात्मक तुलना को स्वाभाविक हिंदी में स्पष्ट किया गया है।
- source_word: מַלְכַּת שְׁבָא
  choice: शीबा की रानी
  rationale: स्थान-नाम שְׁבָא का निकट लिप्यंतरण 'शीबा' रखा गया है।
- source_word: לַמֶּלֶךְ שְׁלֹמֹה
  choice: राजा सुलैमान को
  rationale: उपाधि और नाम का संबंध हिंदी की स्वाभाविक पद-रचना में व्यक्त किया गया है।
