  text: אַשְׁרֵ֣י אֲנָשֶׁ֔י/ךָ אַשְׁרֵ֖י עֲבָדֶ֣י/ךָ אֵ֑לֶּה הָֽ/עֹמְדִ֤ים לְ/פָנֶ֨י/ךָ֙ תָּמִ֔יד הַ/שֹּׁמְעִ֖ים אֶת חָכְמָתֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/010/008.yaml
  text: Blessed are your men; blessed are these your servants, who stand before you continually and hear your wisdom.
translation:
  language: hi
  text: धन्य हैं आपके पुरुष! धन्य हैं आपके ये सेवक, जो निरन्तर आपके सामने खड़े रहते और आपकी बुद्धि सुनते हैं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַשְׁרֵי
  choice: धन्य हैं
  rationale: यह विस्मयादिबोधक रूप ऐसी कल्याणमय और ईर्ष्या योग्य दशा व्यक्त करता है; ‘धन्य हैं’ इसकी गरिमापूर्ण और आशीर्वचन-सदृश शक्ति बनाए रखता है।
- source_word: אֲנָשֶׁיךָ
  choice: आपके पुरुष
  rationale: संज्ञा पुल्लिंग बहुवचन है और यहाँ राजा के दरबार के पुरुषों की ओर संकेत करती है; ‘लोग’ कहने से स्रोत का लिंग-सूचक रूप धुँधला पड़ता।
- source_word: עֲבָדֶיךָ
  choice: आपके ये सेवक
  rationale: राजदरबार के प्रसंग में עֶבֶד राजा की सेवा में रहने वाले सेवकों या अधिकारियों को दर्शा सकता है; यहाँ दासत्व पर बल नहीं है।
- source_word: הָעֹמְדִים לְפָנֶיךָ
  choice: जो निरन्तर आपके सामने खड़े रहते
  rationale: अनुवाद राजकीय उपस्थिति और सेवा के ठोस बिंब को बनाए रखता है, साथ ही हिन्दी में स्वाभाविक है।
- source_word: תָּמִיד
  choice: निरन्तर
  rationale: यह नियमित और लगातार उपस्थिति का भाव देता है, बिना अनिवार्य रूप से हर क्षण का निरपेक्ष दावा किए।
- source_word: הַשֹּׁמְעִים אֶת חָכְמָתֶךָ
  choice: और आपकी बुद्धि सुनते हैं
  rationale: स्रोत सीधे ‘आपकी बुद्धि’ सुनने की बात करता है; ‘बुद्धि की बातें’ जैसा विस्तार अर्थ को स्पष्ट तो करता, पर मूल में शब्दशः उपस्थित नहीं है।
theological_decisions: []
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सहज राजदरबारी स्वर रखा गया है। रानी द्वारा सुलैमान को संबोधन के लिए आदरसूचक ‘आप’ प्रयुक्त है; पहले विस्मयवाचक वाक्य के बाद उद्गार-चिह्न मूल कथन की प्रशंसात्मक तीव्रता व्यक्त करता है।
