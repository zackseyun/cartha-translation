  text: וַ/יֹּ֣אמֶר אֵלָ֡י/ו הֶ/עָרִ֣ים אֲשֶׁר לָֽקַח אָבִ/י֩ מֵ/אֵ֨ת אָבִ֜י/ךָ אָשִׁ֗יב וְ֠/חוּצוֹת תָּשִׂ֨ים לְ/ךָ֤ בְ/דַמֶּ֨שֶׂק֙ כַּ/אֲשֶׁר שָׂ֤ם אָבִ/י֙ בְּ/שֹׁ֣מְר֔וֹן וַ/אֲנִ֖י בַּ/בְּרִ֣ית אֲשַׁלְּחֶ֑/ךָּ וַ/יִּכְרָת ל֥/וֹ בְרִ֖ית וַֽ/יְשַׁלְּחֵֽ/הוּ־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/034.yaml
  text: Then he said to him[a], “The cities that my father took from your father I will restore, and you may establish streets for yourself in Damascus, as my father established them in Samaria.” And I, in the treaty[c][b], will let you go.” So he made a treaty with him and let him go.
translation:
  language: hi
  text: तब उसने उससे कहा, “जिन नगरों को मेरे पिता ने तुम्हारे पिता से ले लिया था, उन्हें मैं लौटा दूँगा। तुम दमिश्क में अपने लिए गलियाँ[a] बना सकते हो, जैसे मेरे पिता ने शोमरोन में बनाई थीं।” “और मैं इस संधि[b] के आधार पर तुम्हें जाने दूँगा।” तब उसने उसके साथ संधि की[c] और उसे जाने दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “बाज़ार” अथवा “मोहल्ले।” हिब्रू शब्द का मूल अर्थ “गलियाँ/खुले स्थान” है; यहाँ संधि द्वारा दिए गए व्यापारिक क्षेत्रों का उल्लेख हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या “इस वाचा के द्वारा” अथवा “इस वाचा के साथ।” यहाँ हिब्रू शब्द राजनीतिक संधि को दर्शाता है।
    reason: alternative_reading
  - marker: c
    text: हिब्रू में शाब्दिक मुहावरा “संधि/वाचा काटी” है, जिसका अर्थ औपचारिक और बाध्यकारी समझौता करना है।
    reason: cultural_note
lexical_decisions:
- source_word: הֶעָרִים
  choice: नगरों
  rationale: עִיר नगर या शहर को दर्शाता है; राजाओं के बीच क्षेत्रीय वापसी के प्रसंग में ‘नगर’ स्वाभाविक और सटीक है।
- source_word: לָקַח ... אָשִׁיב
  choice: ले लिया था ... लौटा दूँगा
  rationale: यह शब्द-युग्म अधिकार छीनने और फिर उसे वापस करने को व्यक्त करता है; आधुनिक हिन्दी में यह सहज है।
- source_word: וְחוּצוֹת
  choice: गलियाँ
  rationale: חוּצוֹת का मूल अर्थ गलियाँ या खुले सार्वजनिक स्थान है। संधि के प्रसंग में इससे व्यापारिक क्षेत्र या मोहल्ले भी अभिप्रेत हो सकते हैं; इस अर्थ-संभावना को पादटिप्पणी में रखा गया है।
- source_word: תָּשִׂים לְךָ בְדַמֶּשֶׂק
  choice: तुम दमिश्क में अपने लिए ... स्थापित कर सकते हो
  rationale: שׂים यहाँ मान्य शहरी या व्यापारिक ठिकाने बनाने अथवा कायम करने का भाव देता है। ‘स्थापित’ राजनयिक संदर्भ को स्पष्ट करता है, और ‘कर सकते हो’ दी गई अनुमति को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: כַּאֲשֶׁר שָׂם אָבִי בְּשֹׁמְרוֹן
  choice: जैसे मेरे पिता ने शोमरोन में की थीं
  rationale: हिब्रू में कर्म पहले आए חוּצוֹת से समझा जाता है; हिन्दी में स्त्रीलिंग बहुवचन क्रिया उसी की ओर संकेत करती है।
- source_word: בַּבְּרִית
  choice: इस संधि के आधार पर
  rationale: בְּרִית यहाँ दो राजाओं के बीच राजनीतिक समझौता है। ‘संधि’ प्रसंगानुकूल है, जबकि ‘वाचा’ की शाब्दिक संभावना पादटिप्पणी में सुरक्षित है।
- source_word: אֲשַׁלְּחֶךָּ
  choice: तुम्हें जाने दूँगा
  rationale: इस प्रसंग में क्रिया बंदी राजा को समझौते के बाद छोड़ देने का भाव व्यक्त करती है।
- source_word: וַיִּכְרָת לוֹ בְרִית
  choice: उसने उसके साथ संधि की
  rationale: כרת ברית का शाब्दिक रूप ‘वाचा काटना’ है, पर हिन्दी में किसी बाध्यकारी समझौते के लिए ‘संधि करना’ स्वाभाविक मुहावरा है।
- source_word: וַיְשַׁלְּחֵהוּ
  choice: उसे जाने दिया
  rationale: यह पहले कही गई रिहाई को पूरा किए जाने का वर्णन करता है और उसी अभिव्यक्ति की पुनरावृत्ति बनाए रखता है।
theological_decisions:
- issue: राजनीतिक प्रसंग में בְּרִית का अनुवाद
  choice: संधि
  alternative: वाचा
  rationale: यहाँ दो मानवीय राजाओं के बीच किया गया राजनीतिक समझौता अभिप्रेत है, इसलिए ‘संधि’ सामान्य पाठक को प्रसंग स्पष्ट करता है। फिर भी मूल शब्द की व्यापक ‘वाचा’ संबंधी अर्थ-सीमा पादटिप्पणी में दी गई है।
- issue: וַאֲנִי से आरम्भ होने वाले कथन का वक्ता
  choice: इसे अलग प्रत्यक्ष कथन के रूप में रखा गया, पर वक्ता का नाम नहीं जोड़ा गया
  alternative: स्पष्ट रूप से ‘अहाब ने कहा’ जोड़ना, या इसे पहले वक्ता के कथन में मिला देना
  rationale: प्रसंग में यह अहाब की प्रत्युत्तर-वाणी समझी जाती है, पर हिब्रू पाठ यहाँ नया कथन-सूचक क्रियापद या वक्ता का नाम नहीं देता। अलग उद्धरण प्रवाह को दर्शाता है और अनकही पहचान को मुख्य पाठ में निश्चित नहीं बनाता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। राजनयिक संदर्भ के कारण ‘संधि’ और ‘स्थापित’ चुने गए हैं। जहाँ मूल पाठ नए वक्ता का नाम स्पष्ट नहीं करता, वहाँ हिन्दी में भी नाम नहीं जोड़ा गया।
