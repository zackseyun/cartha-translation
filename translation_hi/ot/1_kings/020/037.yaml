  text: Then he found another man and said[a], “Please strike me.” So the man struck him and wounded him.
translation:
  language: hi
  text: फिर उसने एक और आदमी को पाया और कहा, “कृपया मुझे मारो।” तब उस आदमी ने उसे मारा और उसे घायल कर दिया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּמְצָא
  choice: फिर उसने ... पाया
  rationale: वाव-युक्त कथात्मक क्रिया घटनाक्रम को आगे बढ़ाती है; ‘फिर’ आधुनिक हिन्दी में स्वाभाविक क्रम व्यक्त करता है।
- source_word: אִישׁ אַחֵר
  choice: एक और आदमी
  rationale: इश का पुल्लिंग एकवचन अर्थ ‘आदमी’ है और अखेर का अर्थ ‘और/दूसरा’; यह सीधा और स्वाभाविक अनुवाद है।
- source_word: הַכֵּינִי נָא
  choice: कृपया मुझे मारो
  rationale: नכה के आदेशात्मक रूप और प्रथम पुरुष कर्म-प्रत्यय का अर्थ ‘मुझे मारो’ है; נא की विनय ‘कृपया’ से व्यक्त होती है। प्रसंग में ‘मारो’ का अर्थ प्रहार करना है, न कि जान से मार डालना।
- source_word: וַיַּכֵּהוּ הָאִישׁ
  choice: तब उस आदमी ने उसे ... मारा
  rationale: कर्म-प्रत्यय ‘उसे’ और स्पष्ट कर्ता ‘उस आदमी’ को बनाए रखा गया है; ‘तब’ अनुरोध के बाद हुई क्रिया को स्वाभाविक कथात्मक हिन्दी में जोड़ता है।
- source_word: הַכֵּה וּפָצֹעַ
  choice: ऐसा मारा कि वह घायल हो गया
  rationale: हिब्रू की दोहरावयुक्त क्रिया-रचना प्रहार की प्रभावशीलता और उसके परिणाम—घायल होना—को व्यक्त करती है। हिन्दी में यह रूप अर्थ को स्वाभाविक ढंग से सुरक्षित रखता है।
