base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/011.yaml
  text: And the king of Israel answered and said[a], “Tell him, ‘Let not the one who girds on his armor boast like the one who takes it off.’”
translation:
  language: hi
  text: इस्राएल के राजा ने उत्तर दिया, “उससे कहो, ‘जो युद्ध का साज-सामान पहनता है, वह उस व्यक्ति के समान डींग न मारे जो उसे उतारता है।’”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से, “कमर कसनेवाला कमर खोलनेवाले के समान डींग न मारे।” यह कहावत युद्ध की तैयारी करनेवाले व्यक्ति की तुलना उस व्यक्ति से करती है जो युद्ध-साज खोल रहा है; विजय का अर्थ संदर्भ से निहित है, पर मूल में स्पष्ट नहीं कहा गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן מֶלֶךְ יִשְׂרָאֵל וַיֹּאמֶר
  choice: इस्राएल के राजा ने उत्तर दिया
  rationale: हिब्रू संवाद-सूत्र ‘उत्तर दिया और कहा’ को स्वाभाविक आधुनिक हिन्दी में संक्षिप्त किया गया है; अर्थ और वक्ता की पहचान सुरक्षित हैं।
- source_word: דַּבְּרוּ
  choice: उससे कहो
  rationale: बहुवचन आज्ञार्थक क्रिया संदेशवाहकों को संबोधित है; प्रसंग से निहित प्राप्तकर्ता को ‘उससे’ द्वारा स्पष्ट किया गया है।
- source_word: אַל יִתְהַלֵּל
  choice: डींग न मारे
  rationale: हित्पएल रूप यहाँ अपने विषय में शेखी बघारने का अर्थ देता है; ‘डींग मारना’ सामान्य आधुनिक हिन्दी में स्वाभाविक और सटीक है।
- source_word: חֹגֵר
  choice: जो हथियार बाँधता है
  rationale: शाब्दिक अर्थ ‘बाँधनेवाला/कमर कसनेवाला’ है। युद्ध-संदर्भ में बाँधे जाने वाले युद्ध-साज को ‘हथियार’ कहने से कहावत का सैनिक बिंब स्पष्ट रहता है।
- source_word: כִּמְפַתֵּחַ
  choice: उस व्यक्ति के समान ... जो उन्हें खोलता है
  rationale: פתח का अर्थ यहाँ बँधे हुए युद्ध-साज को खोलना है। बहुवचन सर्वनाम ‘उन्हें’ पहले आए ‘हथियार’ की ओर संकेत करता है और आरंभ तथा समापन का विरोध बनाए रखता है।
theological_decisions:
- issue: कहावत में युद्ध के परिणाम का निहित अर्थ
  choice: मुख्य पाठ में केवल बाँधने और खोलने का विरोध रखा गया
  alternative: ‘विजय के बाद हथियार खोलनेवाला’ कहना
  rationale: हिब्रू में विजय स्पष्ट रूप से नहीं कही गई; इसलिए व्याख्यात्मक निष्कर्ष को मुख्य पाठ में जोड़ने के बजाय पादटिप्पणी में बताया गया है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। कहावत की संक्षिप्तता और युद्ध-संबंधी रूपक सुरक्षित हैं; ‘उत्तर दिया और कहा’ जैसे इब्रानी पुनरुक्त संवाद-सूत्र को स्वाभाविक हिन्दी में ‘उत्तर दिया’ किया गया है।
