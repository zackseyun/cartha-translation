  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। उद्धरण के भीतर उद्धरण से स्पष्ट होता है कि वक्ता बेन-हदद का संदेश सुना रहा है। ‘जो उत्तम हैं’ मूल के पश्चवर्ती विशेषण और उसकी वास्तविक अस्पष्टता को यथासम्भव सुरक्षित रखता है।
