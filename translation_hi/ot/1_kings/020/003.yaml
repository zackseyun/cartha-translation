  language: en
  yaml_path: translation/ot/1_kings/020/003.yaml
  text: 'And he said to him[a], “Thus says Ben-hadad: Your silver and your gold are mine; your wives and your sons, the best, are mine.”'
translation:
  language: hi
  text: उसने उससे कहा, “बेन-हदद कहता है, ‘तुम्हारी चाँदी और तुम्हारा सोना मेरे हैं; तुम्हारी पत्नियाँ और तुम्हारे उत्तम पुत्र मेरे हैं।’”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר לוֹ
  choice: उसने उससे कहा
  rationale: इब्रानी कथात्मक क्रिया और अप्रत्यक्ष कर्म का सीधा, स्वाभाविक हिन्दी रूप।
- source_word: כֹּה אָמַר
  choice: यह कहता है
  rationale: राजकीय दूत-सूत्र की औपचारिकता बनाए रखते हुए आधुनिक हिन्दी में स्वाभाविक अभिव्यक्ति।
- source_word: בֶּן הֲדַד
  choice: बेन-हदद
  rationale: व्यक्तिनाम का प्रचलित देवनागरी लिप्यंतरण।
- source_word: כַּסְפְּךָ וּזְהָבְךָ
  choice: तुम्हारी चाँदी और तुम्हारा सोना
  rationale: मूल में उल्लिखित ठोस बहुमूल्य पदार्थों को सामान्य ‘धन’ में नहीं बदला गया।
- source_word: לִי הוּא
  choice: मेरा है
  rationale: संयुक्त वस्तुओं के बाद भी इब्रानी में एकवचन सर्वनाम है; हिन्दी में निकटतम एकवचन ‘सोना’ के अनुरूप यह स्वाभाविक है और स्वामित्व का दावा स्पष्ट रखता है।
- source_word: וְנָשֶׁיךָ
  choice: तुम्हारी पत्नियाँ
  rationale: पारिवारिक और राजकीय संदर्भ में נָשִׁים का अर्थ यहाँ ‘पत्नियाँ’ है।
- source_word: וּבָנֶיךָ
  choice: तुम्हारे पुत्र
  rationale: בָּנִים के पुरुष-संतान संबंधी अर्थ को बनाए रखा गया है।
- source_word: הַטּוֹבִים
  choice: जो उत्तम हैं
  rationale: ‘उत्तम’ नैतिक अच्छाई तक सीमित नहीं है और ‘अच्छे/श्रेष्ठ/चुने हुए’ की प्रसंगगत व्यापकता बनाए रखता है; इब्रानी पदक्रम को संकेतित करने के लिए इसे पश्चवर्ती वर्णन बनाया गया।
- source_word: לִי הֵם
  choice: मेरे हैं
  rationale: स्वामित्व के दोहराए गए दावे और मूल की समानांतर रचना को सुरक्षित रखा गया।
theological_decisions: []
