base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/027.yaml
  text: And the sons of Israel were mustered and supplied[a], and they went to meet them. The sons of Israel camped opposite them like two little flocks of goats[c][b], but Aram filled the land.
translation:
  language: hi
  text: इस्राएलियों को युद्ध के लिए इकट्ठा किया गया और उन्हें रसद दी गई[a]; फिर वे उनका सामना करने निकले। इस्राएलियों ने उनके सामने बकरियों के दो छोटे झुंडों की तरह छावनी डाली[b], लेकिन अरामी सेना ने सारा देश भर दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘उनके लिए प्रबन्ध किया गया।’ यहाँ प्रयुक्त क्रिया संभवतः युद्ध-अभियान के लिए आवश्यक रसद उपलब्ध कराने की ओर संकेत करती है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में ‘बकरियों के दो חֲשִׂפֵי जैसे’ है। חֲשִׂפֵי एक दुर्लभ शब्द है; इसका आशय संभवतः दो बहुत छोटे, अलग-अलग झुंडों या दलों से है।
    reason: textual_ambiguity
lexical_decisions:
- source_word: הָתְפָּקְדוּ
  choice: युद्ध के लिए इकट्ठा किया गया
  rationale: हित्पाअेल रूप यहाँ सैनिकों की गिनती या निरीक्षण मात्र के बजाय युद्ध के लिए उनकी जमावट का संकेत देता है। संदर्भ स्पष्ट करने के लिए ‘युद्ध के लिए’ जोड़ा गया है।
- source_word: וְכָלְכְּלוּ
  choice: उन्हें रसद दी गई
  rationale: כלכל यहाँ अभियान के लिए आवश्यक सामग्री या भोजन उपलब्ध कराने के अर्थ में है। ‘रसद दी गई’ आधुनिक हिन्दी में सैन्य संदर्भ को स्वाभाविक और स्पष्ट रूप से व्यक्त करता है।
- source_word: לִקְרָאתָם
  choice: उनका सामना करने निकले
  rationale: इस संरचना का मूल अर्थ उनकी ओर मिलने के लिए जाना है, पर युद्ध-संदर्भ में यह विरोधी का सामना करने निकलने को दर्शाता है।
- source_word: נֶגְדָּם
  choice: उनके सामने
  rationale: נגד आमने-सामने या सामने की स्थिति बताता है; यह दोनों सेनाओं की परस्पर विरोधी छावनियों का स्थान स्पष्ट करता है।
- source_word: כִּשְׁנֵי חֲשִׂפֵי עִזִּים
  choice: बकरियों के दो छोटे-से झुंडों जैसे
  rationale: दुर्लभ शब्द חֲשִׂפֵי का सटीक बिंब अनिश्चित है, पर उपमा इस्राएली दलों की अत्यल्प संख्या को विशाल अरामी सेना के विपरीत दिखाती है। ‘छोटे-से झुंड’ हिन्दी में यह प्रभाव सहजता से देता है।
- source_word: וַאֲרָם מִלְאוּ אֶת־הָאָרֶץ
  choice: लेकिन अरामी सेना से सारा देश भरा हुआ था
  rationale: ‘अराम’ यहाँ उसकी सेना या लोगों के लिए प्रयुक्त है और बहुवचन क्रिया इसी सामूहिक अर्थ का समर्थन करती है। हिन्दी वाक्य मूल के ‘देश भर देने’ वाले बिंब और तीखे विरोध दोनों को बनाए रखता है।
- source_word: בְנֵי יִשְׂרָאֵל
  choice: इस्राएली
  rationale: शाब्दिक ‘इस्राएल के पुत्र’ के स्थान पर ‘इस्राएली’ आधुनिक हिन्दी में उसी सामूहिक जन-पदनाम का स्वाभाविक रूप है।
