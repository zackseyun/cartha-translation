  text: तब नबी गया और मार्ग पर राजा की प्रतीक्षा करने लगा। उसने अपनी आँखों पर पट्टी[a] बाँधकर अपना भेष बदल लिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इब्रानी शब्द का सामान्य अर्थ “राख” है: “उसने अपनी आँखों पर राख लगाकर/रखकर अपना भेष बदला।” फिर भी, इस प्रसंग में यह भेष बदलने के लिए आँखों पर रखी या बाँधी गई पट्टी अथवा आवरण का संकेत भी हो सकता है।'
    reason: lexical_alternative
