  rationale: निश्चित संज्ञा को पूर्वपरिचित पात्र के रूप में स्वाभाविक हिन्दी में व्यक्त किया गया है।
- source_word: וַיַּעֲמֹד לַמֶּלֶךְ
  choice: राजा की प्रतीक्षा में ... खड़ा हो गया
  rationale: शाब्दिक ‘राजा के लिए खड़ा हुआ’ हिन्दी में अस्पष्ट होता; प्रसंग में नबी राजा को रोकने के उद्देश्य से उसके मार्ग पर खड़ा है।
- source_word: עַל הַדָּרֶךְ
  choice: सड़क के किनारे
  rationale: यह मार्ग पर राजा की प्रतीक्षा करने की स्थिति को सहज हिन्दी में दर्शाता है।
- source_word: וַיִּתְחַפֵּשׂ
  choice: अपना भेष बदल लिया
  rationale: हित्पएल रूप स्वयं को पहचान में न आने योग्य बनाने, अर्थात भेष बदलने, का अर्थ देता है।
- source_word: בָּאֲפֵר
  choice: पट्टी
  rationale: אֵפֶר का सामान्य अर्थ ‘राख’ है, पर आँखों पर रखी जाने वाली वस्तु और भेष बदलने के प्रसंग में ‘पट्टी’ संभव अर्थ है; मूल की अनिश्चितता पादटिप्पणी में सुरक्षित रखी गई है।
- source_word: עַל עֵינָיו
  choice: अपनी आँखों पर
  rationale: मूल स्थान-संबंध को सीधे और स्वाभाविक हिन्दी में व्यक्त करता है।
