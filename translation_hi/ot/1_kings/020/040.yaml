base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/040.yaml
  text: And as your servant was busy here and there[a], he was gone. Then the king of Israel said to him, “So shall your judgment be[c][b]; you yourself have decided it.”
translation:
  language: hi
  text: जब आपका सेवक इधर-उधर कामों में लगा हुआ था[a], तब वह वहाँ नहीं था[b]।” इस्राएल के राजा ने उससे कहा, “तेरा न्याय ऐसा ही होगा[c]; तूने स्वयं ही इसका निर्णय किया है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “यह-वह करने में लगा हुआ था।” इब्रानी मुहावरे का अर्थ अलग-अलग दिशाओं या कामों में व्यस्त होना है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक अर्थ “और वह नहीं था” है, अर्थात पहरे में रखा हुआ व्यक्ति अब वहाँ उपस्थित नहीं था।
    reason: lexical_alternative
  - marker: c
    text: या “तेरा दण्डादेश ऐसा ही होगा” अथवा “तेरा फैसला ऐसा ही होगा।” राजा उसी व्यक्ति के बताए हुए न्याय-मानदंड को उसी पर लागू करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: עַבְדְּךָ
  choice: आपका सेवक
  rationale: राजा के सामने वक्ता का यह विनम्र आत्म-संबोधन है; यहाँ ‘सेवक’ सामाजिक अधीनता और आदर को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: עֹשֵׂה הֵנָּה וָהֵנָּה
  choice: इधर-उधर कामों में लगा हुआ था
  rationale: यह इब्रानी मुहावरा विभिन्न दिशाओं या कामों में व्यस्त होने का भाव देता है; यह रूप अर्थ और बहाने-जैसे स्वर, दोनों को बनाए रखता है।
- source_word: וְהוּא אֵינֶנּוּ
  choice: वह वहाँ नहीं रहा
  rationale: शाब्दिक भाव ‘वह नहीं था’ है। प्रसंग में पहरे में रखा व्यक्ति गायब हो गया, पर अनुवाद उसके भागने को अनावश्यक रूप से स्पष्ट नहीं करता।
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: इस्राएल का राजा
  rationale: उपाधि-संबंधी इब्रानी रचना का सीधा और मानक हिन्दी रूप।
- source_word: כֵּן מִשְׁפָּטֶךָ
  choice: तेरा न्याय यही होगा
  rationale: כֵּן राजा के न्यायिक निष्कर्ष को प्रस्तुत करता है और מִשְׁפָּט यहाँ लागू होने वाले न्याय-निर्णय या दण्डादेश को सूचित करता है।
- source_word: אַתָּה חָרָצְתָּ
  choice: तूने स्वयं ही इसका निर्णय किया है
  rationale: स्पष्ट सर्वनाम אַתָּה के बलाघात को ‘स्वयं ही’ से रखा गया है; חרץ का न्यायिक संदर्भ में अर्थ निर्णय करना है।
