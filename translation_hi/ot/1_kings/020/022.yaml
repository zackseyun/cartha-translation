base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/022.yaml
  text: Then the prophet came near to the king of Israel and said to him[a], “Go, strengthen yourself, and know and see what you should do[c][b], because at the turn of the year the king of Aram will come up against you.”
translation:
  language: hi
  text: तब भविष्यद्वक्ता इस्राएल के राजा के पास आया और उससे कहा, “जा, अपने आप को दृढ़ कर, और जान और देख कि तुझे क्या करना चाहिए[a], क्योंकि वर्ष के लौटने के समय[b] अराम का राजा तुझ पर चढ़ाई करेगा[c]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “कि तू क्या करेगा।” इब्रानी क्रिया का रूप शाब्दिक रूप से भविष्यकालीन है, पर यहाँ उसका भाव सम्भवतः यह है कि राजा विचार करे कि तैयारी के लिए उसे क्या करना चाहिए।
    reason: lexical_alternative
  - marker: b
    text: “वर्ष के लौटने के समय” एक इब्रानी मुहावरा है। यह प्रायः उस ऋतु की ओर संकेत करता है जब सैन्य अभियान फिर आरम्भ होते थे; इसलिए कुछ अनुवाद “अगले वसंत में” कहते हैं।
    reason: cultural_note
  - marker: c
    text: परंपरागत अनुवाद “सीरिया का राजा” है; इब्रानी में “अराम” है।
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּגַּשׁ
  choice: पास आया
  rationale: नגשׁ निकट आने या पास जाने को व्यक्त करता है; हिन्दी कथा में “पास आया” स्वाभाविक रहते हुए गति के ठोस भाव को बनाए रखता है।
- source_word: הַנָּבִיא
  choice: भविष्यद्वक्ता
  rationale: संज्ञा निश्चित है और कथा में पहले से ज्ञात नबी की ओर संकेत करती है; “भविष्यद्वक्ता” आधुनिक हिन्दी बाइबलीय प्रयोग में प्रतिष्ठित और बोधगम्य है।
- source_word: הִתְחַזַּק
  choice: अपने आप को दृढ़ कर
  rationale: हित्पएल आज्ञार्थक का आत्मवाची भाव सुरक्षित है और आने वाले युद्ध के लिए स्वयं को सुदृढ़ तथा तैयार करने का संकेत देता है।
- source_word: וְדַע וּרְאֵה
  choice: समझ-बूझकर देख
  rationale: शाब्दिक युग्म “जान और देख” हिन्दी में असहज है; यह रूप दोनों क्रियाओं के विचारपूर्ण निरीक्षण और विवेकपूर्ण आकलन के संयुक्त बल को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: אֵת אֲשֶׁר תַּעֲשֶׂה
  choice: कि तुझे क्या करना चाहिए
  rationale: रूप शाब्दिक रूप से भविष्यसूचक “तू क्या करेगा” हो सकता है, पर प्रसंग में तैयारी हेतु उचित कार्य पर विचार करने की व्यावहारिक प्रेरणा है; वैकल्पिक अर्थ पादटिप्पणी में रखा गया है।
- source_word: לִתְשׁוּבַת הַשָּׁנָה
  choice: वर्ष के लौटने के समय
  rationale: यह चुनाव इब्रानी मुहावरे में वर्ष के लौटने/चक्र पूरा होने की छवि सुरक्षित रखता है; सैन्य अभियान फिर आरम्भ होने के मौसमी संकेत को पादटिप्पणी स्पष्ट करती है।
- source_word: מֶלֶךְ אֲרָם
  choice: अराम का राजा
  rationale: “अराम” मूल इब्रानी स्थान-नाम को सीधे सुरक्षित रखता है; पारंपरिक “सीरिया” बाद की भौगोलिक पदावली है।
- source_word: עֹלֶה עָלֶיךָ
  choice: तुझ पर चढ़ाई करेगा
  rationale: सैन्य प्रसंग में עלה על का अर्थ किसी के विरुद्ध चढ़ आने या आक्रमण करने से है। हिन्दी में “चढ़ाई करेगा” युद्धगत छवि और भावी चेतावनी दोनों स्पष्ट करता है।
theological_decisions:
- issue: אֲשֶׁר תַּעֲשֶׂה में भविष्यसूचक और दायित्वसूचक अर्थ की सम्भावना
  choice: तुझे क्या करना चाहिए
  alternative: तू क्या करेगा
  rationale: भविष्यद्वक्ता राजा को आने वाले आक्रमण की तैयारी पर विचार करने की आज्ञा देता है, इसलिए दायित्वसूचक हिन्दी प्रसंगानुकूल है; मूल रूप की वास्तविक अस्पष्टता पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण कथात्मक शैली रखी गई है। राजा को एकवचन निकट संबोधन “तू” दिया गया है, जो इब्रानी के एकवचन रूपों और प्रत्यक्ष आज्ञाओं को स्पष्ट रखता है। “समझ-बूझकर देख” मूल के दोहरे आग्रह को हिन्दी में स्वाभाविक बनाता है, और “चढ़ाई करेगा” सैन्य अर्थ को सामान्य पाठक के लिए स्पष्ट करता है।
