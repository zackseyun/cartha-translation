lexical_decisions:
- source_word: וְאֵלֶּה
  choice: और ये
  rationale: समुच्चयबोधक וְ और पिछले पद में गिने गए दल की ओर संकेत करने वाले बहुवचन सर्वनाम—दोनों को स्पष्ट रखा गया है।
- source_word: יָצְאוּ מִן־הָעִיר
  choice: नगर से निकले
  rationale: प्रस्थान का सीधा और स्वाभाविक हिन्दी रूप; क्रिया में अनावश्यक रूप से ‘कूच’ का सैनिक भाव नहीं जोड़ा गया।
- source_word: נַעֲרֵי
  choice: जवान सेवक
  rationale: נַעַר यहाँ आयु में जवान पुरुष अथवा निजी सेवक/परिचर, दोनों का बोध करा सकता है। ‘जवान सेवक’ प्रसंग में दोनों अर्थ-छायाओं को यथासंभव साथ रखता है; विकल्प पादटिप्पणी में दिया गया है।
- source_word: שָׂרֵי הַמְּדִינוֹת
  choice: प्रान्तों के हाकिमों
  rationale: इब्रानी संबंधसूचक रचना को बनाए रखा गया है। שַׂר का अर्थ शासक, अधिकारी या सेनापति हो सकता है; यहाँ प्रशासनिक-सैनिक प्रसंग में ‘हाकिम’ सहज और पर्याप्त व्यापक है।
- source_word: וְהַחַיִל
  choice: और ... सेना
  rationale: इस युद्ध-वर्णन में חַיִל सैन्य बल को दर्शाता है; ‘सेना’ सामान्य आधुनिक हिन्दी में स्पष्ट है।
- source_word: אֲשֶׁר אַחֲרֵיהֶם
  choice: उनके पीछे की
  rationale: दल की पीछे वाली स्थिति अथवा उसके पीछे आने का भाव संक्षिप्त रूप में सुरक्षित रहता है, बिना यह तय किए कि वह केवल स्थान है या गति।
