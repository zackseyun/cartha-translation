  yaml_path: translation/ot/1_kings/020/017.yaml
  text: Then the young men of the commanders of the provinces went out first[a], and Ben-hadad sent, and they reported to him, saying, “Men have come out from Samaria.”
translation:
  language: hi
  text: तब प्रान्तों के अधिकारियों के युवक पहले बाहर निकले। बेन-हदद ने भेजा,[a] और उन्होंने उसे सूचना दी, “सामरिया से लोग बाहर निकले हैं।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में केवल “भेजा” है; किसे भेजा गया, यह स्पष्ट नहीं कहा गया है। अगले वाक्य में उनके द्वारा दी गई सूचना से इतना संकेत मिलता है कि भेजे गए लोग सूचना लेकर लौटे।
    reason: lexical_alternative
lexical_decisions:
- source_word: נַעֲרֵי
  choice: जवान
  rationale: यह शब्द युवक, सेवक या परिचारक का अर्थ दे सकता है। युद्ध के प्रसंग में ‘जवान’ मूल के आयु-संबंधी भाव को रखते हुए इनके सैनिक स्वरूप के अनुकूल है।
- source_word: שָׂרֵי הַמְּדִינוֹת
  choice: प्रान्तों के अधिकारी
  rationale: שָׂרִים शासक, अधिकारी या सेनानायक हो सकते हैं और מְדִינוֹת प्रशासनिक प्रान्त हैं। यहाँ ‘अधिकारी’ पद को अनावश्यक रूप से केवल सैन्य अर्थ तक सीमित नहीं करता।
- source_word: בָּרִאשֹׁנָה
  choice: पहले
  rationale: यह क्रम में प्राथमिकता बताता है; ‘पहले’ स्वाभाविक है और ‘पहली टुकड़ी’ जैसा अतिरिक्त सैन्य विवरण नहीं जोड़ता।
- source_word: וַיִּשְׁלַח
  choice: पता लगाने के लिए लोगों को भेजा
  rationale: इब्रानी में केवल ‘भेजा’ है और कर्म व्यक्त नहीं किया गया, पर अगली सूचना से लोगों को जाँच-पड़ताल के लिए भेजना निहित है। हिंदी में यह अंतर्निहित आशय स्पष्ट और स्वाभाविक किया गया है।
- source_word: וַיַּגִּידוּ לוֹ לֵאמֹר
  choice: उन्होंने उसे सूचना दी
  rationale: हिफ़ील रूप का अर्थ बताना या सूचना देना है। प्रत्यक्ष कथन के पहले हिंदी में अलग से ‘कहते हुए’ रखना आवश्यक नहीं।
- source_word: אֲנָשִׁים
  choice: कुछ आदमी
  rationale: अनिश्चित बहुवचन को हिंदी में ‘कुछ आदमी’ स्वाभाविक रूप से व्यक्त करता है और संदर्भ में पुरुषों का संकेत बनाए रखता है।
- source_word: יָצְאוּ מִשֹּׁמְרוֹן
  choice: सामरिया से बाहर निकले हैं
  rationale: पूर्ण हो चुकी हाल की गतिविधि की सूचना के लिए ‘बाहर निकले हैं’ उपयुक्त है; सामरिया नगर का प्रचलित हिंदी नाम है।
- source_word: בֶּן הֲדַד
  choice: बेन-हदद
  rationale: नाम को प्रचलित बाइबलीय हिंदी लिप्यंतरण में रखा गया है।
