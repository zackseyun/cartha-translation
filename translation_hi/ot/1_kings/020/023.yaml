source:
  edition: WLC
  text: וְ/עַבְדֵ֨י מֶֽלֶךְ אֲרָ֜ם אָמְר֣וּ אֵלָ֗י/ו אֱלֹהֵ֤י הָרִים֙ אֱלֹ֣הֵי/הֶ֔ם עַל כֵּ֖ן חָזְק֣וּ מִמֶּ֑/נּוּ וְ/אוּלָ֗ם נִלָּחֵ֤ם אִתָּ/ם֙ בַּ/מִּישׁ֔וֹר אִם לֹ֥א נֶחֱזַ֖ק מֵ/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/023.yaml
  text: And the servants of the king of Aram said to him[a], “Their gods are gods of the hills; therefore they were stronger than we were. But if we fight against them on the plain, surely we will be stronger than they are.”
translation:
  language: hi
  text: और अराम के राजा के सेवकों ने उससे कहा,[a] “उनके देवता पहाड़ों के देवता हैं; इसी कारण वे हमसे अधिक शक्तिशाली निकले। परन्तु यदि हम उनसे मैदान में लड़ें, तो निश्चय ही हम उनसे अधिक शक्तिशाली होंगे।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उनका परमेश्वर पहाड़ों का देवता है…” इब्रानी में बहुवचन रूप (“देवता”) प्रयुक्त हुए हैं, जो इस्राएल के परमेश्वर के विषय में अरामियों की बहुदेववादी रीति से कही गई बात को दर्शाते हैं।
    reason: वैकल्पिक पठन और इब्रानी बहुवचन की धर्मवैज्ञानिक अस्पष्टता स्पष्ट करना।
lexical_decisions:
- source_word: עַבְדֵי
  choice: सेवकों
  rationale: राजदरबार के संदर्भ में यह शब्द सेवकों या अधिकारियों को सूचित कर सकता है; ‘सेवकों’ मूल शब्द का सीधा और स्वाभाविक रूप है।
- source_word: אֲרָם
  choice: अराम
  rationale: मूल भौगोलिक नाम को बनाए रखा गया है; बाद का नाम ‘सीरिया’ नहीं अपनाया गया।
- source_word: אֱלֹהֵי הָרִים אֱלֹהֵיהֶם
  choice: उनके देवता पहाड़ों के देवता हैं
  rationale: बहुवचन रूप अरामियों की बहुदेववादी धारणा को व्यक्त करता है; इसे कथावाचक का धर्मवैज्ञानिक कथन नहीं माना गया।
- source_word: עַל כֵּן
  choice: इसी कारण
  rationale: कारण और परिणाम के संबंध को वर्तमान, गरिमापूर्ण हिन्दी में स्पष्ट करता है।
- source_word: חָזְקוּ מִמֶּנּוּ
  choice: वे हमसे अधिक शक्तिशाली निकले
  rationale: חזק के साथ מן तुलनात्मक बल व्यक्त करता है; ‘निकले’ पिछली लड़ाई में प्रकट हुए परिणाम को स्वाभाविक हिन्दी में बताता है।
- source_word: וְאוּלָם
  choice: परन्तु
  rationale: पिछली व्याख्या और प्रस्तावित नई रणनीति के बीच स्पष्ट विरोध दर्शाता है।
- source_word: נִלָּחֵם אִתָּם
  choice: यदि हम उनसे ... लड़ें
  rationale: संदर्भ में प्रस्तावित युद्धनीति को सशर्त वाक्य के रूप में स्वाभाविक ढंग से व्यक्त करता है।
- source_word: בַּמִּישׁוֹר
  choice: मैदान में
  rationale: समतल भूभाग को दर्शाता है और पहाड़ों के साथ अपेक्षित विरोध बनाए रखता है।
- source_word: אִם לֹא
  choice: निश्चय ही
  rationale: यहाँ पदबंध दृढ़ आश्वासन या दावे का मुहावरेदार बल रखता है, न कि साधारण नकारात्मक शर्त।
- source_word: נֶחֱזַק מֵהֶם
  choice: हम उनसे अधिक शक्तिशाली होंगे
  rationale: पहले आए חזק מן की तुलनात्मक अभिव्यक्ति को दोहराकर मूल की शब्दगत संगति बनाए रखता है।
theological_decisions:
- issue: अरामियों द्वारा इस्राएल के परमेश्वर का वर्णन
  choice: उनके देवता पहाड़ों के देवता हैं
  alternative: उनका परमेश्वर पहाड़ों का देवता है
  rationale: यह अरामियों की कही हुई बात है और इब्रानी में बहुवचन रूप हैं। बहुवचन रखने से उनकी बहुदेववादी गलतफहमी तथा कथा की विडंबना सुरक्षित रहती है; इसे इस्राएल के विश्वास के अनुरूप चुपचाप नहीं बदला गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में स्वाभाविक, गरिमापूर्ण कथात्मक शैली रखी गई है। ‘परन्तु’ और ‘निश्चय ही’ औपचारिकता बनाए रखते हैं, जबकि वाक्य सामान्य पाठक के लिए सहज है।
