translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सहज रखी गई है। राजकीय संवाद में आदरसूचक बहुवचन ‘आपने’ तथा अधीनता-सूचक ‘अपने सेवक’ रखा गया है। आरंभिक कर्ता संदर्भ से इस्राएल का राजा है, इसलिए स्रोत की तरह नाम जोड़े बिना ‘उसने’ रखा गया है।
