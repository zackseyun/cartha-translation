base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/009.yaml
  text: So he said to the messengers of Ben-hadad[a], “Say to my lord the king, ‘All that you sent to your servant the first time, I will do; but this thing I cannot do.’” And the messengers went and brought back word to him.
translation:
  language: hi
  text: तब उसने बेन-हदद के दूतों से कहा, “मेरे स्वामी राजा से कहना, ‘जो कुछ आपने पहले अपने सेवक को भेजा था, वह सब मैं करूँगा; पर यह बात[a] मैं नहीं कर सकता।’” तब दूत चले गए और उसके पास उत्तर लेकर लौटे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “यह विषय” अथवा “यह मामला”; इब्रानी דָּבָר का अर्थ प्रसंग के अनुसार “बात,” “विषय,” “वस्तु” या “वचन/संदेश” हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: מַלְאֲכֵי
  choice: दूतों
  rationale: राजनीतिक संदर्भ में यह शब्द राजकीय संदेशवाहकों या प्रतिनिधियों को सूचित करता है, अलौकिक प्राणियों को नहीं।
- source_word: בֶן הֲדַד
  choice: बेन-हदद
  rationale: इब्रानी व्यक्तिगत नाम का देवनागरी में प्रचलित और स्रोत-सन्निकट लिप्यंतरण।
- source_word: לַאדֹנִי הַמֶּלֶךְ
  choice: मेरे स्वामी राजा से
  rationale: यह राजकीय आदर और अधीनता की औपचारिक भाषा है; यहाँ ‘स्वामी’ देवत्व का संकेत नहीं देता।
- source_word: כֹּל אֲשֶׁר שָׁלַחְתָּ אֶל עַבְדְּךָ
  choice: जो कुछ आपने ... अपने सेवक से कहलवाया था
  rationale: שׁלח का मूल अर्थ ‘भेजना’ है, पर यहाँ भेजी गई वस्तु पिछला संदेश या माँग है। स्वाभाविक हिन्दी में ‘कहलवाया’ संदेश भेजने का आशय स्पष्ट रखता है।
- source_word: בָרִאשֹׁנָה
  choice: पहले
  rationale: यह बेन-हदद के पहले संदेश की ओर संकेत करता है; आधुनिक हिन्दी में ‘पहले’ सहज और स्पष्ट है।
- source_word: אֶעֱשֶׂה
  choice: मैं करूँगा
  rationale: क्रिया का सीधा भाव रखा गया है; संदर्भ में सहमति या अनुपालन निहित है।
- source_word: וְהַדָּבָר הַזֶּה
  choice: पर यह बात
  rationale: דָּבָר यहाँ नई माँग या विषय को सूचित करता है। ‘बात’ स्रोत की अर्थ-व्याप्ति बचाती है और ‘माँग’ की अपेक्षा कम व्याख्यात्मक है।
- source_word: לֹא אוּכַל לַעֲשׂוֹת
  choice: मैं नहीं कर सकता
  rationale: יכל और infinitive का असमर्थता-सूचक अर्थ स्वाभाविक आधुनिक हिन्दी में सीधे व्यक्त किया गया है।
- source_word: וַיְשִׁבֻהוּ דָּבָר
  choice: उन्होंने उसे यह उत्तर पहुँचा दिया
  rationale: इब्रानी मुहावरा किसी के पास जवाब या संदेश वापस पहुँचाने को सूचित करता है; ‘उत्तर पहुँचा दिया’ हिन्दी में स्वाभाविक है और प्रसंगगत आशय रखता है।
