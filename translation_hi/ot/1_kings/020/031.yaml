  text: וַ/יֹּאמְר֣וּ אֵלָי/ו֮ עֲבָדָי/ו֒ הִנֵּֽה נָ֣א שָׁמַ֔עְנוּ כִּ֗י מַלְכֵי֙ בֵּ֣ית יִשְׂרָאֵ֔ל כִּֽי מַלְכֵ֥י חֶ֖סֶד הֵ֑ם נָשִׂ֣ימָה נָּא֩ שַׂקִּ֨ים בְּ/מָתְנֵ֜י/נוּ וַ/חֲבָלִ֣ים בְּ/רֹאשֵׁ֗/נוּ וְ/נֵצֵא֙ אֶל מֶ֣לֶךְ יִשְׂרָאֵ֔ל אוּלַ֖י יְחַיֶּ֥ה אֶת נַפְשֶֽׁ/ךָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/031.yaml
  text: And his servants said to him, “Look, please, we have heard that the kings of the house of Israel are merciful kings. Please let us put sackcloth around our waists and ropes on our heads, and let us go out to the king of Israel; perhaps he will let you live.”
translation:
  language: hi
  text: तब उसके सेवकों ने उससे कहा, “देखिए, कृपया, हमने सुना है कि इस्राएल के घराने के राजा दयालु राजा होते हैं। कृपया हमें अपनी कमर पर टाट लपेट लेने और अपने सिर पर रस्सियाँ रख लेने दीजिए, और हम इस्राएल के राजा के पास जाएँ। शायद वह आपके प्राण बचा दे।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מַלְכֵי חֶסֶד
  choice: दयालु राजा
  rationale: חֶסֶד यहाँ राजाओं की दया अथवा कृपालुता का वर्णन करता है; सहज हिंदी में ‘दयालु राजा’ मूल भाव को स्पष्ट रूप से व्यक्त करता है।
- source_word: שַׂקִּים בְּמָתְנֵינוּ
  choice: अपनी कमर पर टाट
  rationale: शोक, दीनता और आत्मसमर्पण के संकेत के रूप में कमर पर टाट बाँधने की ठोस छवि सुरक्षित रखी गई है।
- source_word: חֲבָלִים בְּרֹאשֵׁנוּ
  choice: अपने सिर पर रस्सियाँ
  rationale: मूल पाठ की असामान्य पर स्पष्ट आत्मसमर्पण-संबंधी छवि को बिना व्याख्यात्मक विस्तार के बनाए रखा गया है।
- source_word: יְחַיֶּה אֶת נַפְשֶׁךָ
  choice: आपके प्राण बचा दे
  rationale: मुहावरे का आशय बेन-हदद को जीवित छोड़ना है; ‘प्राण बचा दे’ प्राकृतिक और गरिमापूर्ण हिंदी है।
theological_decisions:
- issue: חֶסֶד का अर्थ-क्षेत्र
  choice: दयालु
  alternative: करुणामय / कृपालु
  rationale: इस प्रसंग में कोई विशेष वाचागत अर्थ आरोपित न करके मानवीय दया और जीवनदान की आशा व्यक्त की गई है।
- issue: राजा के जीवनदान की अनिश्चितता
  choice: शायद वह आपके प्राण बचा दे
  alternative: हो सकता है कि वह आपको जीवित छोड़ दे
  rationale: אוּלַי की वास्तविक अनिश्चितता को स्पष्ट रूप से बनाए रखा गया है।
translation_notes:
  register: आधुनिक मानक हिंदी में सहज, गरिमापूर्ण संवाद। ‘देखिए’ निवेदनपूर्ण הִנֵּה נָא को स्वाभाविक रूप देता है; बार-बार आए נָא को हिंदी में अनावश्यक पुनरुक्ति से बचाते हुए ‘इसलिए…जाने दीजिए’ में विनम्र आग्रह के रूप में व्यक्त किया गया है।
