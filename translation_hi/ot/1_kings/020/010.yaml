base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/010.yaml
  text: Ben-hadad sent to him and said[a], “May the gods do so to me, and more also, if the dust of Samaria will be enough for handfuls for all the people who are at my feet.”
translation:
  language: hi
  text: बेन-हदद ने उसके पास संदेश भेजकर कहा, “देवता मेरे साथ ऐसा ही करें, और इससे भी अधिक करें, यदि शोमरोन की धूल मेरे पैरों के पास रहनेवाले सभी लोगों के लिए मुट्ठी भरने के लिए पर्याप्त हो।”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “यदि शोमरोन की धूल मेरे पैरों पर रहनेवाले सभी लोगों के लिए मुट्ठियाँ भरने के लिए पर्याप्त हो।” “मेरे पैरों पर रहनेवाले” उसके अधीन अथवा उसके साथ आए लोगों का मुहावरा है। बेन-हदद डींग मारता है कि उसके लोग इतने अधिक हैं कि शोमरोन की धूल भी हर एक के लिए एक मुट्ठी भरने को पर्याप्त नहीं होगी।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח אֵלָיו
  choice: उसके पास यह संदेश भेजा
  rationale: शाब्दिक रूप से ‘उसके पास भेजा’; राजनयिक संवाद के प्रसंग में हिन्दी में संदेश निहित है और अगली उक्ति इसे स्पष्ट करती है।
- source_word: בֶּן הֲדַד
  choice: बेन-हदद
  rationale: व्यक्तिनाम का मानक हिन्दी लिप्यंतरण।
- source_word: כֹּה יַעֲשׂוּן לִי אֱלֹהִים וְכֹה יוֹסִפוּ
  choice: देवता मेरे साथ ऐसा ही, वरन् इससे भी अधिक करें
  rationale: शपथ और आत्म-शाप के सूत्र को स्वाभाविक किंतु गरिमापूर्ण हिन्दी में रखा गया है; बहुवचन क्रिया और अरामी राजा के संदर्भ के कारण ‘देवता’ उपयुक्त है।
- source_word: אִם
  choice: यदि
  rationale: शपथ में प्रयुक्त शर्तसूचक रूप को बनाए रखता है; प्रतिज्ञा का बल पूरे आत्म-शाप सूत्र से स्पष्ट होता है।
- source_word: יִשְׂפֹּק
  choice: पर्याप्त हो
  rationale: क्रिया के ‘काफी होना/पर्याप्त होना’ अर्थ को सीधे व्यक्त करता है।
- source_word: עֲפַר שֹׁמְרוֹן
  choice: शोमरोन की धूल
  rationale: इब्रानी संबंधसूचक संरचना का सहज हिन्दी रूप।
- source_word: לִשְׁעָלִים
  choice: एक-एक मुट्ठी भर
  rationale: यहाँ आशय हथेली की खोखल/मुट्ठी भर मात्रा से है; ‘एक-एक’ प्रत्येक सैनिक को मिलने वाली मात्रा और अतिशयोक्ति को स्पष्ट करता है।
- source_word: לְכָל הָעָם אֲשֶׁר בְּרַגְלָי
  choice: मेरे पीछे चलनेवाले सारे लोगों के लिए
  rationale: शाब्दिक ‘मेरे पैरों पर/पास’ उस सैन्य दल को दर्शाता है जो राजा के अधीन उसके साथ चलता है; हिन्दी में यह अर्थ स्वाभाविक रूप से संप्रेषित होता है।
theological_decisions:
- issue: एक गैर-इस्राएली राजा की शपथ में אֱלֹהִים का अर्थ
  choice: देवता
  alternative: परमेश्वर
  rationale: वक्ता अरामी राजा बेन-हदद है और इब्रानी क्रिया बहुवचन है; इसलिए यहाँ उसके देवताओं का बहुवचन संदर्भ सबसे स्वाभाविक है।
translation_notes:
  register: आधुनिक मानक हिन्दी; राजकीय धमकी और शपथ का गरिमापूर्ण स्वर सुरक्षित रखा गया है। कठिन इब्रानी मुहावरों को मुख्य पाठ में अर्थ-स्पष्ट रूप दिया गया और शाब्दिक रूप पादटिप्पणी में रखा गया है।
