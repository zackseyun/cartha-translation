lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: तब उसने भेजा
  rationale: वय्यिक्तोल रूप कथा को आगे बढ़ाता है; ‘तब’ स्वाभाविक आधुनिक हिन्दी में उसके क्रमिक कथात्मक बल को व्यक्त करता है।
- source_word: מַלְאָכִים
  choice: दूतों
  rationale: राजनीतिक-सैनिक प्रसंग में यह शब्द संदेश लेकर जाने वाले मानवीय प्रतिनिधियों को सूचित करता है, स्वर्गदूतों को नहीं।
- source_word: אֶל אַחְאָב
  choice: अहाब के पास
  rationale: यहाँ אֶל भेजे जाने के मानवीय गंतव्य को चिह्नित करता है; हिन्दी में ‘के पास’ स्वाभाविक है।
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: इस्राएल के राजा
  rationale: सम्बन्ध-संरचना अहाब के राजकीय पद को बताती है; हिन्दी में नाम से पहले पद रखना सहज और स्पष्ट है।
- source_word: הָעִירָה
  choice: नगर में
  rationale: ‘नगर’ पर दिशासूचक हे नगर की ओर अथवा उसके भीतर गति दर्शाता है; इस संदर्भ में ‘नगर में’ स्वाभाविक है, जबकि ‘नगर की ओर’ वास्तविक प्रवेश को अनिर्धारित छोड़ता है।
