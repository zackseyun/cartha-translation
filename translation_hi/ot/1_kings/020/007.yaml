source:
  edition: WLC
  text: וַ/יִּקְרָ֤א מֶֽלֶךְ יִשְׂרָאֵל֙ לְ/כָל זִקְנֵ֣י הָ/אָ֔רֶץ וַ/יֹּ֨אמֶר֙ דְּעֽוּ נָ֣א וּ/רְא֔וּ כִּ֥י רָעָ֖ה זֶ֣ה מְבַקֵּ֑שׁ כִּֽי שָׁלַ֨ח אֵלַ֜/י לְ/נָשַׁ֤/י וּ/לְ/בָנַ/י֙ וּ/לְ/כַסְפִּ֣/י וְ/לִ/זְהָבִ֔/י וְ/לֹ֥א מָנַ֖עְתִּי מִמֶּֽ/נּוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/007.yaml
  text: Then the king of Israel called all the elders of the land and said, “Please know and see that this man is seeking trouble, for he sent to me for my wives, my sons, my silver, and my gold, and I did not withhold them from him.”
translation:
  language: hi
  text: तब इस्राएल के राजा ने देश के सभी पुरनियों को बुलाकर कहा, “ज़रा समझो और देखो कि यह आदमी अनिष्ट करने पर तुला है[a]। क्योंकि उसने मेरी पत्नियों, मेरे पुत्रों, मेरी चाँदी और मेरे सोने की माँग करते हुए मेरे पास संदेश भेजा था, और मैंने उन्हें उसे देने से मना नहीं किया।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “बुराई चाहता है” अथवा “मुसीबत खड़ी करना चाहता है।”
    reason: इब्रानी רָעָה नैतिक बुराई, हानि, विपत्ति या मुसीबत का संकेत दे सकता है; प्रसंग एक से अधिक छायार्थों की अनुमति देता है।
lexical_decisions:
- source_word: זִקְנֵי הָאָרֶץ
  choice: देश के सभी पुरनियों
  rationale: ‘पुरनिये’ यहाँ आयु मात्र नहीं, बल्कि देश के मान्य अगुओं की परिषद को सूचित करता है; प्रचलित बाइबलीय हिन्दी में यह संक्षिप्त और गरिमापूर्ण है।
- source_word: דְּעוּ נָא וּרְאוּ
  choice: ज़रा समझो और देखो
  rationale: दोनों आज्ञार्थक क्रियाओं को बनाए रखते हुए נָא की विनयपूर्ण/आग्रहसूचक शक्ति को ‘ज़रा’ से व्यक्त किया गया है।
- source_word: רָעָה זֶה מְבַקֵּשׁ
  choice: यह आदमी अनिष्ट करने पर तुला है
  rationale: רָעָה यहाँ नैतिक बुराई, हानि या मुसीबत की व्यापक धारणा रखता है; ‘अनिष्ट’ उस विस्तार को बनाए रखता है और ‘पर तुला है’ מְבַקֵּשׁ के दृढ़ इरादे को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וְלֹא מָנַעְתִּי מִמֶּנּוּ
  choice: मैंने उसे देने से इनकार नहीं किया
  rationale: शाब्दिक अर्थ ‘मैंने उससे नहीं रोका’ है। यह हिन्दी रूप राजा की पूर्व सहमति को स्पष्ट करता है, पर यह दावा नहीं करता कि वस्तुएँ पहले ही वास्तव में सौंप दी गई थीं।
theological_decisions:
- issue: रָעָה को नैतिक ‘बुराई’ या व्यावहारिक ‘मुसीबत/हानि’ के रूप में समझना
  choice: मुख्य पाठ में ‘अनिष्ट’
  alternative: ‘बुराई’ या ‘मुसीबत’
  rationale: प्रसंग में बेन-हदद की दुर्भावनापूर्ण और हानिकारक मंशा दोनों सम्मिलित हो सकती हैं; ‘अनिष्ट’ किसी एक पक्ष तक अर्थ को सीमित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, कथात्मक शैली रखी गई है। ‘पुरनियों’ पारंपरिक बाइबलीय प्रशासनिक पद के रूप में प्रयुक्त है; शेष वाक्यरचना साधारण पाठक के लिए सहज रखी गई है।
