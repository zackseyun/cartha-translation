base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/016.yaml
  text: They went out at noon[a], while Ben-hadad was drinking himself drunk in the booths, he and the thirty-two kings who were helping him.
translation:
  language: hi
  text: वे दोपहर को निकले। उस समय बेन-हदद छप्परों[a] में मतवाला होकर पी रहा था, वह और वे बत्तीस राजा जो उसकी सहायता कर रहे थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “आश्रयों” अथवा “मंडपों” में। इब्रानी में शब्दशः “छप्परों” में है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצְאוּ
  choice: वे ... निकले
  rationale: יצא का सामान्य कथात्मक अर्थ रखा गया है; प्रसंग में नगर से सैन्य दल के निकलने का संकेत है, पर मूल से अधिक रंग नहीं जोड़ा गया।
- source_word: בַּצָּהֳרָיִם
  choice: दोपहर को
  rationale: यह दिन के मध्य का स्पष्ट समय बताता है; आधुनिक हिन्दी में सहज और सटीक है।
- source_word: וּבֶן הֲדַד
  choice: उस समय बेन-हदद
  rationale: वाव को परिस्थितिसूचक रूप में समझा गया है, क्योंकि आगे का खंड पहले कार्य के साथ-साथ चल रही स्थिति बताता है।
- source_word: שֹׁתֶה שִׁכּוֹר
  choice: पीकर मतवाला हो रहा था
  rationale: कृदंत जारी क्रिया बताता है और שִׁכּוֹר नशे की परिणामी अवस्था; हिन्दी वाक्यांश दोनों भावों को स्वाभाविक रूप से व्यक्त करता है। पेय का प्रकार मूल में नहीं है, इसलिए 'दाखमधु' नहीं जोड़ा गया।
- source_word: בַּסֻּכּוֹת
  choice: छप्परों
  rationale: סֻכּוֹת अस्थायी छाई हुई संरचनाओं या आश्रयों को दर्शाता है। 'छप्पर' ठोस चित्र बनाए रखता है, जबकि अर्थगत विकल्प पाद-टिप्पणी में दिए गए हैं।
- source_word: הוּא וְהַמְּלָכִים שְׁלֹשִׁים וּשְׁנַיִם
  choice: अपने सहायक बत्तीस राजाओं के साथ
  rationale: हिन्दी की स्वाभाविक रचना में बेन-हदद और बत्तीस राजाओं की संयुक्त उपस्थिति स्पष्ट रहती है।
- source_word: עֹזֵר אֹתוֹ
  choice: अपने सहायक
  rationale: עזר का कृदंत उन राजाओं की जारी सहायता को बताता है; संक्षिप्त विशेषणात्मक हिन्दी इसे स्वाभाविक रूप से व्यक्त करती है।
