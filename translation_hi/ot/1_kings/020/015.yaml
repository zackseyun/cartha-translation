  yaml_path: translation/ot/1_kings/020/015.yaml
  text: So he mustered the young men of the provincial commanders[a], and they were two hundred and thirty-two; and after them he mustered all the people, all the sons of Israel, seven thousand.
translation:
  language: hi
  text: तब उसने प्रान्तों के अधिकारियों के युवकों की गिनती करके उन्हें इकट्ठा किया; वे दो सौ बत्तीस थे। उनके बाद उसने सारी प्रजा को, अर्थात इस्राएल के सब पुत्रों को, गिनती करके इकट्ठा किया; वे सात हज़ार थे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּפְקֹד / פָּקַד
  choice: गिनती करके इकट्ठा किया
  rationale: सैनिक प्रसंग में क्रिया का अर्थ केवल संख्या गिनना नहीं, बल्कि तैनाती के लिए लोगों की गणना और संगठन करना है; संयुक्त पदबंध दोनों पहलुओं को व्यक्त करता है।
- source_word: נַעֲרֵי
  choice: जवानों
  rationale: נַעַר युवक, सेवक या परिचारक को सूचित कर सकता है। यहाँ सामाजिक पद को अनावश्यक रूप से निश्चित किए बिना आयु-संबंधी सामान्य अर्थ रखा गया है।
- source_word: שָׂרֵי הַמְּדִינוֹת
  choice: प्रान्तों के अधिकारियों
  rationale: שַׂר व्यापक रूप से शासक या अधिकारी है और מְדִינָה प्रशासनिक प्रान्त है। केवल ‘सेनापति’ कहना पद को मूल से अधिक संकीर्ण कर देता; ‘अधिकारी’ प्रसंगानुकूल और स्रोत-संगत है।
- source_word: מָאתַיִם שְׁנַיִם וּשְׁלֹשִׁים
  choice: दो सौ बत्तीस
  rationale: संख्या का सीधा और स्वाभाविक हिन्दी रूप।
- source_word: וְאַחֲרֵיהֶם
  choice: उनके बाद
  rationale: पहले दल के पश्चात दूसरे दल की गणना किए जाने का क्रम स्पष्ट रखते हुए इब्रानी की ठोस अभिव्यक्ति सुरक्षित रखी गई है।
- source_word: כָּל הָעָם
  choice: सारी प्रजा
  rationale: मूल में ‘सारी प्रजा’ है, केवल ‘सेना’ या ‘सैनिक’ नहीं; इसलिए सैन्य प्रसंग के बावजूद व्यापक संज्ञा बनाए रखी गई है।
- source_word: כָּל בְּנֵי יִשְׂרָאֵל
  choice: इस्राएल के सब पुत्रों
  rationale: मूल की पुरुषवाची पारिवारिक अभिव्यक्ति को पारदर्शी रूप से सुरक्षित रखा गया है। ‘अर्थात’ से यह स्पष्ट होता है कि यह ‘सारी प्रजा’ का समानाधिकरण है, कोई तीसरा अलग दल नहीं।
- source_word: שִׁבְעַת אֲלָפִים
  choice: सात हज़ार
  rationale: संख्या का सीधा और स्वाभाविक हिन्दी रूप।
