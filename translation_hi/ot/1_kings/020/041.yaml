  text: Then he quickly removed the bandage from over his eyes[a], and the king of Israel recognized him, that he was one of the prophets.
translation:
  language: hi
  text: तब उसने तुरंत अपनी आँखों पर से पट्टी[a] हटा दी, और इस्राएल के राजा ने उसे पहचान लिया कि वह नबियों में से एक था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी शब्द הָאֲפֵר का अर्थ परंपरागत रूप से कुछ लोग “राख” मानते हैं, पर इस संदर्भ में इसका आशय संभवतः आँखों पर छद्मावरण के लिए रखी गई पट्टी या किसी आवरण से है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְמַהֵר
  choice: तब उसने फुर्ती से
  rationale: क्रिया מהר शीघ्रता का भाव देती है; ‘फुर्ती से’ स्वाभाविक हिन्दी में तत्काल की गई कार्रवाई व्यक्त करता है, और ‘तब’ कथात्मक क्रम को दर्शाता है।
- source_word: וַיָּסַר
  choice: हटा दी
  rationale: यहाँ रूप का अर्थ किसी वस्तु को उतारना या दूर करना है; ‘हटा दी’ पट्टी के संदर्भ में सहज है।
- source_word: הָאֲפֵר
  choice: पट्टी
  rationale: यद्यपि אֵפֶר का सामान्य अर्थ ‘राख’ है, 1 राजा 20:38–41 के संदर्भ में यह आँखों पर रखे गए छद्मावरण को सूचित करता है। ‘पट्टी’ उस वस्तु के कार्य को स्पष्ट और स्वाभाविक ढंग से व्यक्त करती है; शाब्दिक विकल्प पादटिप्पणी में सुरक्षित है।
- source_word: מֵעַל עֵינָיו
  choice: अपनी आँखों पर की
  rationale: מן־על का स्थानिक अर्थ ‘ऊपर से’ है; हिन्दी में ‘आँखों पर की पट्टी हटा दी’ इसी संबंध को स्वाभाविक रूप से व्यक्त करता है।
- source_word: וַיַּכֵּר אֹתוֹ
  choice: उसे पहचान लिया
  rationale: हिफ़इल में נכר का यहाँ अर्थ पहचानना है; ‘पहचान लिया’ कथात्मक प्रसंग में उपयुक्त है।
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: इस्राएल के राजा
  rationale: रचनात्मक संबंध का सीधा और मानक हिन्दी अनुवाद।
- source_word: כִּי
  choice: कि
  rationale: यहाँ כִּי पहचान की विषय-वस्तु प्रस्तुत करता है, कारण नहीं; इसलिए ‘कि’ उपयुक्त है।
- source_word: מֵהַנְּבִאִים
  choice: नबियों में से एक
  rationale: מן यहाँ अंशवाचक है और किसी समूह की सदस्यता बताता है; यह हिन्दी प्रयोग अर्थ को स्पष्ट रखता है।
- source_word: הוּא
  choice: वह ... था
  rationale: इब्रानी का क्रियारहित उपवाक्य हिन्दी में भूतकालीन संयोजक क्रिया के साथ स्वाभाविक बनता है।
