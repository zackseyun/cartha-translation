source:
  edition: WLC
  text: וַ/יַּחְגְּרוּ֩ שַׂקִּ֨ים בְּ/מָתְנֵי/הֶ֜ם וַ/חֲבָלִ֣ים בְּ/רָאשֵׁי/הֶ֗ם וַ/יָּבֹ֨אוּ֙ אֶל מֶ֣לֶךְ יִשְׂרָאֵ֔ל וַ/יֹּ֣אמְר֔וּ עַבְדְּ/ךָ֧ בֶן הֲדַ֛ד אָמַ֖ר תְּחִֽי נָ֣א נַפְשִׁ֑/י וַ/יֹּ֛אמֶר הַ/עוֹדֶ֥/נּוּ חַ֖י אָחִ֥/י הֽוּא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/032.yaml
  text: So they tied sackcloth around their waists and ropes on their heads[a], and they came to the king of Israel and said, “Your servant Ben-hadad says, ‘Please let me live.’” And he said[b], “Is he still alive? He is my brother.”
translation:
  language: hi
  text: तब उन्होंने अपनी कमर पर टाट और अपने सिर पर रस्सियाँ बाँध लीं। वे इस्राएल के राजा के पास आकर बोले, “आपका सेवक बेन-हदद कहता है, ‘कृपया मुझे जीवित रहने दें[a]।’” उसने कहा, “क्या वह अभी भी जीवित है? वह मेरा भाई है।”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक अर्थ: “कृपया मेरा प्राण जीवित रहे।” इसका भाव यह भी हो सकता है: “कृपया मेरे प्राण बख्श दें।”'
    reason: lexical_alternative
  - marker: b
    text: “मेरा भाई” यहाँ संभवतः सगे संबंध के बजाय राजनीतिक या संधि-आधारित भाईचारे को प्रकट करता है।
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּחְגְּרוּ
  choice: बाँध लीं
  rationale: חגר का मूल अर्थ कमर कसना या किसी वस्तु को शरीर पर बाँधना है। यहाँ यही क्रिया टाट और रस्सियों, दोनों के साथ स्वाभाविक हिन्दी में प्रयुक्त हुई है।
- source_word: שַׂקִּים
  choice: टाट
  rationale: שַׂקִּים शोक, दीनता या अपमान प्रकट करने वाले मोटे वस्त्र को दर्शाता है। ‘टाट’ आधुनिक हिन्दी में इस सांस्कृतिक संकेत को संक्षेप और स्पष्ट रूप से व्यक्त करता है।
- source_word: בְּמָתְנֵיהֶם
  choice: अपनी कमर पर
  rationale: מָתְנַיִם कमर या कटि को दर्शाता है। ‘कमर’ साधारण आधुनिक हिन्दी में अधिक सहज है।
- source_word: וַחֲבָלִים בְּרָאשֵׁיהֶם
  choice: अपने सिरों पर रस्सियाँ
  rationale: यह अनुवाद रस्सियों को सिरों पर रखने या बाँधने की ठोस छवि बनाए रखता है और उनकी सही बनावट या व्यवस्था के बारे में पाठ से अधिक नहीं कहता।
- source_word: עַבְדְּךָ
  choice: आपका सेवक
  rationale: राजकीय विनय की इस भाषा में עבד आत्म-दीनता प्रकट करता है; ‘सेवक’ यहाँ ‘दास’ की अपेक्षा प्रसंगानुकूल है।
- source_word: בֶן הֲדַד
  choice: बेन-हदद
  rationale: व्यक्तिनाम का हिन्दी लिप्यंतरण किया गया है।
- source_word: תְּחִי נָא נַפְשִׁי
  choice: कृपया मुझे जीवित रहने दें
  rationale: इस इब्रानी मुहावरे का शाब्दिक रूप ‘कृपया मेरा प्राण जीवित रहे’ है। चुना गया रूप जीवन बख्शने की विनती को स्वाभाविक हिन्दी में व्यक्त करता है; शाब्दिक रूप पादटिप्पणी में रखा गया है।
- source_word: הַעוֹדֶנּוּ חַי
  choice: क्या वह अभी भी जीवित है?
  rationale: प्रश्न यह जानना चाहता है कि बेन-हदद अब तक जीवित है या नहीं। ‘अभी भी जीवित’ आधुनिक हिन्दी में स्वाभाविक है।
- source_word: אָחִי הוּא
  choice: वह मेरा भाई है
  rationale: प्रत्यक्ष अनुवाद वास्तविक भाई और राजनीतिक या वाचागत भाईचारे के बीच मूल पाठ की अर्थगत गुंजाइश को बनाए रखता है।
theological_decisions:
- issue: अहाब द्वारा बेन-हदद को ‘भाई’ कहने का अर्थ
  choice: ‘वह मेरा भाई है’—रिश्ते के शब्द को ज्यों का त्यों रखा गया है।
  alternative: ‘वह मेरा मित्र-राजा है’ या ‘वह मेरे लिए भाई के समान है।’
  rationale: प्रसंग में यह संभवतः राजनीतिक या वाचागत भाईचारे को व्यक्त करता है, न कि सगा संबंध; फिर भी इब्रानी पाठ सामान्य संबंध-सूचक शब्द אָחִי का प्रयोग करता है। प्रत्यक्ष रूप मूल की अस्पष्टता और कथात्मक तनाव को सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। राजकीय विनय के लिए ‘आपका सेवक’ और समर्पण की ठोस छवि के लिए ‘टाट’ तथा ‘रस्सियाँ’ बनाए रखे गए हैं। सभी पादटिप्पणी-चिह्न संबंधित वाक्यांशों के तुरंत बाद रखे गए हैं।
