source:
  edition: WLC
  text: וַ/יְהִ֗י כִּ/שְׁמֹ֨עַ֙ אֶת הַ/דָּבָ֣ר הַ/זֶּ֔ה וְ/ה֥וּא שֹׁתֶ֛ה ה֥וּא וְ/הַ/מְּלָכִ֖ים בַּ/סֻּכּ֑וֹת וַ/יֹּ֤אמֶר אֶל עֲבָדָי/ו֙ שִׂ֔ימוּ וַ/יָּשִׂ֖ימוּ עַל הָ/עִֽיר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/012.yaml
  text: And when he heard this word[a], while he and the kings were drinking in the booths, he said to his servants[c][b], “Take your positions.” So they took their positions against the city.
translation:
  language: hi
  text: जब उसने यह संदेश[a] सुना, उस समय वह और वे राजा अस्थायी छप्परों[b] में पी रहे थे। उसने अपने सेवकों से कहा, “तैनात हो जाओ!”[c] तब वे नगर के विरुद्ध तैनात हो गए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “यह बात” अथवा “यह विषय।”
    reason: lexical_alternative
  - marker: b
    text: या “आश्रयों में”; परंपरागत रूप से “मंडपों में।”
    reason: lexical_alternative
  - marker: c
    text: इब्रानी आदेश का शाब्दिक रूप केवल “लगाओ!” या “रखो!” है। यह संभवतः नगर के विरुद्ध मोर्चा लेने का संक्षिप्त सैनिक आदेश है।
    reason: cultural_note
lexical_decisions:
- source_word: הַדָּבָר הַזֶּה
  choice: यह संदेश
  rationale: דָּבָר का अर्थ ‘वचन’, ‘बात’, ‘विषय’ या ‘संदेश’ हो सकता है। यहाँ राजा अहाब के उत्तर को सुनने की बात है, इसलिए ‘संदेश’ प्रसंग में स्वाभाविक है; विकल्प पादटिप्पणी में रखा गया है।
- source_word: שֹׁתֶה הוּא וְהַמְּלָכִים
  choice: वह और वे राजा ... पी रहे थे
  rationale: इब्रानी कृदंत उस समय जारी क्रिया दर्शाता है। स्रोत की असामान्य एकवचन-से-समूह रचना को स्वाभाविक हिन्दी बहुवचन में व्यक्त किया गया है। पेय का प्रकार स्रोत में नहीं बताया गया, इसलिए ‘मदिरा’ नहीं जोड़ा गया।
- source_word: בַּסֻּכּוֹת
  choice: अस्थायी छप्परों में
  rationale: סֻכּוֹת अस्थायी, छप्परदार आश्रयों को सूचित करता है। यह चयन सैन्य पड़ाव के दृश्य को स्पष्ट करता है, जबकि ‘मंडपों’ जैसे परंपरागत विकल्प को पादटिप्पणी में रखा गया है।
- source_word: שִׂימוּ
  choice: तैनात हो जाओ
  rationale: שׂים का मूल अर्थ ‘रखना/लगाना’ है, पर यहाँ यह संक्षिप्त सैनिक आदेश है। ‘तैनात हो जाओ’ सैन्य भाव को स्पष्ट करता है और आक्रमण की ऐसी विधि नहीं जोड़ता जिसका स्रोत में उल्लेख नहीं है।
- source_word: וַיָּשִׂימוּ עַל הָעִיר
  choice: वे नगर के विरुद्ध तैनात हो गए
  rationale: इब्रानी वाक्यांश संक्षिप्त है; עַל यहाँ नगर के विरुद्ध शत्रुतापूर्ण स्थिति लेने को दर्शाता है। हिन्दी में वही क्रिया दोहराने से आदेश और उसके पालन का स्रोत-संबंध बना रहता है।
theological_decisions: []
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सहज हिन्दी अपनाई गई है। स्रोत के संक्षिप्त सैनिक आदेश को प्राकृतिक हिन्दी में व्यक्त किया गया है। कर्ता का नाम संदर्भ से स्पष्ट होने के कारण मूल के समान सर्वनाम रखा गया है, और पेय का प्रकार अनिर्दिष्ट छोड़ा गया है।
