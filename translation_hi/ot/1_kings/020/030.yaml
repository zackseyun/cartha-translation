base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/030.yaml
  text: The survivors fled to Aphek[a], into the city, and the wall fell on twenty-seven thousand of the remaining men. Ben-hadad also fled and entered the city, into an inner room.
translation:
  language: hi
  text: बचे हुए लोग अपेक नगर में भाग गए। तब दीवार बचे हुए सत्ताईस हज़ार पुरुषों पर गिर पड़ी। बेन-हदद भी भाग गया और नगर में एक भीतरी कक्ष में गया।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक रूप से: “एक कक्ष के भीतर एक कक्ष”; यह एक अंदरूनी, संभवतः सबसे भीतरी, कक्ष का मुहावरेदार वर्णन है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנּוֹתָרִים
  choice: बचे हुए लोग
  rationale: यह युद्ध के बाद जीवित बचे लोगों को दर्शाता है; आधुनिक हिन्दी में यह स्वाभाविक और स्पष्ट है।
- source_word: אֲפֵקָה
  choice: अपेक
  rationale: स्थान-नाम का लिप्यंतरण किया गया है; दिशासूचक रूप का भाव 'अपेक भागकर' में व्यक्त है।
- source_word: הָעִיר
  choice: नगर
  rationale: עיר का सीधा, गरिमापूर्ण हिन्दी रूप; दोनों प्रसंगों में कथानक की गति बनाए रखने के लिए रखा गया है।
- source_word: וַתִּפֹּל הַחוֹמָה
  choice: तब नगर की दीवार ... गिर पड़ी
  rationale: हिब्रू में दीवार निश्चित है। हिन्दी में संदर्भ स्पष्ट करने के लिए 'नगर की दीवार' कहा गया, बिना यह तय किए कि पूरी दीवार गिरी या उसका कोई भाग।
- source_word: עַל עֶשְׂרִים וְשִׁבְעָה אֶלֶף אִישׁ
  choice: सत्ताईस हज़ार पुरुषों पर
  rationale: संख्या को स्वाभाविक हिन्दी में और איש को सैनिक संदर्भ के अनुसार 'पुरुषों' के रूप में व्यक्त किया गया है।
- source_word: הַנּוֹתָרִים
  choice: बाकी बचे
  rationale: दूसरी आवृत्ति को बनाए रखते हुए अनावश्यक शब्दगत कठोरता से बचने के लिए प्रसंगानुकूल रूप चुना गया है।
- source_word: וּבֶן הֲדַד
  choice: बेन-हदद भी
  rationale: वाव यहाँ समानांतर घटना जोड़ता है; 'भी' हिन्दी में यह संबंध स्वाभाविक रूप से दिखाता है।
- source_word: נָס
  choice: भागकर
  rationale: आरंभिक क्रिया के समान मूल का संबंध बनाए रखता है और पराजय के बाद पलायन का भाव देता है।
- source_word: חֶדֶר בְּחָדֶר
  choice: एक भीतरी कोठरी में जा छिपा
  rationale: शाब्दिक रूप 'कोठरी के भीतर कोठरी' है। प्रसंग में यह अधिक अंदर की सुरक्षित या छिपी जगह में जाने का संकेत देता है; मूल अभिव्यक्ति पादटिप्पणी में दी गई है।
