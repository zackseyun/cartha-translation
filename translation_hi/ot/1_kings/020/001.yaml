  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। सैन्य वर्णन में सामान्य हिन्दी शब्दावली अपनाई गई है और मूल पाठ के क्रमिक कथानक को ‘फिर’ से व्यक्त किया गया है।
