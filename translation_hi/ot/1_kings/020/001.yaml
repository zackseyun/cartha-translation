source:
  edition: WLC
  text: וּ/בֶן הֲדַ֣ד מֶֽלֶךְ אֲרָ֗ם קָבַץ֙ אֶת כָּל חֵיל֔/וֹ וּ/שְׁלֹשִׁ֨ים וּ/שְׁנַ֥יִם מֶ֛לֶךְ אִתּ֖/וֹ וְ/ס֣וּס וָ/רָ֑כֶב וַ/יַּ֗עַל וַ/יָּ֨צַר֙ עַל שֹׁ֣מְר֔וֹן וַ/יִּלָּ֖חֶם בָּֽ/הּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/001.yaml
  text: Ben-hadad king of Aram gathered all his army[a], and thirty-two kings with him, and horses and chariots[b]; then he went up and besieged Samaria and fought against it.
translation:
  language: hi
  text: अराम[b] का राजा बेन-हदद[a] अपनी सारी सेना इकट्ठी कर लाया। उसके साथ बत्तीस राजा तथा घोड़े और रथ भी थे। फिर वह चढ़ आया, सामरिया को घेर लिया और उसके विरुद्ध युद्ध किया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “और अराम का राजा बेन-हदद...” आरम्भिक संयोजक का अधिक औपचारिक अनुवाद “और” किया जा सकता है।
    reason: lexical_alternative
  - marker: b
    text: “अराम” इब्रानी स्थाननाम है; परम्परागत रूप से “सीरिया”।
    reason: alternative_reading
lexical_decisions:
- source_word: וּ/בֶן הֲדַד
  choice: बेन-हदद
  rationale: व्यक्तिनाम का ध्वन्यात्मक लिप्यंतरण किया गया है। आरम्भिक וּ का संयोजक बल हिन्दी में प्रसंग और वाक्य-प्रवाह से स्पष्ट है; उसके अधिक औपचारिक अनुवाद को पादटिप्पणी में रखा गया है।
- source_word: מֶלֶךְ אֲרָם
  choice: अराम के राजा
  rationale: अֲרָם को उसके इब्रानी स्थाननाम के अनुसार ‘अराम’ रखा गया है, न कि परम्परागत ‘सीरिया’।
- source_word: קָבַץ אֶת כָּל חֵילוֹ
  choice: अपनी सारी सेना इकट्ठी की
  rationale: קבץ का अर्थ इकट्ठा या एकत्र करना है और חַיִל इस सैनिक प्रसंग में सामूहिक रूप से सेना को दर्शाता है।
- source_word: וּשְׁלֹשִׁים וּשְׁנַיִם מֶלֶךְ אִתּוֹ
  choice: उसके साथ बत्तीस राजा ... भी थे
  rationale: यह पदबंध बेन-हदद के साथ आए सहयोगी राजाओं को दर्शाता है। हिन्दी में अलग वाक्य से संबंध स्वाभाविक और स्पष्ट बनता है।
- source_word: וְסוּס וָרָכֶב
  choice: तथा घोड़े और रथ
  rationale: इब्रानी में एकवचन सामूहिक संज्ञाएँ हैं; हिन्दी में सैन्य साधनों के लिए बहुवचन अधिक स्वाभाविक है।
- source_word: וַיַּעַל
  choice: फिर उसने चढ़ाई की
  rationale: עלה यहाँ सेना के साथ ऊपर बढ़ने या आक्रमण के लिए चढ़ आने का भाव रखता है; ‘चढ़ाई की’ सैन्य प्रसंग और क्रम दोनों को स्वाभाविक रूप से व्यक्त करता है।
- source_word: וַיָּצַר עַל שֹׁמְרוֹן
  choice: सामरिया को घेर लिया
  rationale: צור על सैन्य प्रसंग में किसी नगर को घेरकर उसकी नाकाबंदी करने को दर्शाता है।
- source_word: וַיִּלָּחֶם בָּהּ
  choice: उसके विरुद्ध युद्ध किया
  rationale: לחם के साथ בּ लक्ष्य के विरुद्ध युद्ध करने का अर्थ देता है; स्त्रीलिंग सर्वनाम का संकेत सामरिया नगर की ओर है।
