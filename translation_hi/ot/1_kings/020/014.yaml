base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/014.yaml
  text: 'And Ahab said[a], “By whom?” And he said, “Thus says Yahweh: By the young men of the provincial officials.” Then he said, “Who will begin the battle?” And he said, “You.”'
translation:
  language: hi
  text: 'तब अहाब ने पूछा, “किसके द्वारा?” उसने उत्तर दिया, “याहवे यों कहता है: ‘प्रान्तों के अधिकारियों के नौजवानों[a] द्वारा।’” फिर अहाब ने पूछा, “लड़ाई का आरम्भ कौन करेगा?” उसने उत्तर दिया, “आप।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “सेवकों” अथवा “सहायकों।” यहाँ “नौजवानों” के लिए प्रयुक्त इब्रानी शब्द अधिकारियों की सेवा में लगे अनुचरों या सहायकों को भी दर्शा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּמִי
  choice: किसके द्वारा?
  rationale: בְּ यहाँ कर्ता अथवा माध्यम पूछता है; यह हिंदी में संक्षिप्त और स्वाभाविक रूप से उसी प्रश्न को व्यक्त करता है।
- source_word: כֹּה אָמַר יְהוָה
  choice: याहवे यों कहता है
  rationale: यह नबी-संदेश का पारंपरिक सूत्र है; ‘यों कहता है’ उसकी औपचारिक गरिमा बनाए रखता है और יְהוָה को व्यक्तिगत नाम ‘याहवे’ के रूप में प्रस्तुत करता है।
- source_word: בְּנַעֲרֵי
  choice: नौजवानों द्वारा
  rationale: נַעַר का मूल अर्थ युवक है, पर यह किसी अधिकारी की सेवा में लगे सेवक, सहायक या अनुचर को भी दर्शा सकता है। मुख्य पाठ मूल शब्द का सामान्य अर्थ रखता है और कार्यगत अर्थ पादटिप्पणी में देता है।
- source_word: שָׂרֵי הַמְּדִינוֹת
  choice: प्रान्तों के अधिकारियों
  rationale: שָׂרֵי शासकीय अधिकारियों को और מְדִינוֹת प्रशासनिक प्रान्तों या जिलों को सूचित करता है; यह अनुवाद पद या सैनिक दर्जे को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: מִי יֶאְסֹר הַמִּלְחָמָה
  choice: लड़ाई का आरम्भ कौन करेगा?
  rationale: אָסַר का शाब्दिक अर्थ ‘बाँधना’ है, लेकिन מִלְחָמָה के साथ यह युद्ध छेड़ने या आरम्भ करने का मुहावरा है।
- source_word: אָתָּה
  choice: आप
  rationale: स्पष्ट और बलयुक्त द्वितीय पुरुष एकवचन उत्तर को सुरक्षित रखते हुए राजा को संबोधित करने की स्वाभाविक आधुनिक हिंदी अपनाई गई है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में चार अक्षरों वाला व्यक्तिगत ईश्वरीय नाम सीधे प्रयुक्त है। ‘याहवे’ उसका लिप्यंतरण करता है और उसे किसी उपाधि से नहीं बदलता।
- issue: नबी के उत्तर में वक्ता की पहचान
  choice: उसने उत्तर दिया
  alternative: नबी ने उत्तर दिया
  rationale: इब्रानी पाठ बार-बार केवल ‘उसने कहा’ कहता है। संदर्भ में वह नबी है, पर मुख्य पाठ मूल की सर्वनामगत अभिव्यक्ति को सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। प्रश्नोत्तर की संक्षिप्तता तथा नबी-संदेश की औपचारिक शैली सुरक्षित है। राजा के लिए ‘आप’ आधुनिक हिंदी के स्वाभाविक सम्मानसूचक संबोधन के रूप में प्रयुक्त हुआ है।
