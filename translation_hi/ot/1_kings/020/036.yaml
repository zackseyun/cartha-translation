  text: Then he said to him, “Because you have not listened to the voice of the LORD, look, when you depart from me, the lion will strike you down.” And when he departed from him, the lion found him and struck him down.
translation:
  language: hi
  text: तब उसने उससे कहा, “तूने यहोवा की वाणी नहीं मानी; इसलिए देख, जब तू मेरे पास से चला जाएगा, सिंह तुझे मार डालेगा।” जब वह उसके पास से चला गया, तो सिंह ने उसे पाया और मार डाला।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שָׁמַעְתָּ בְּקוֹל
  choice: वाणी नहीं मानी
  rationale: इब्रानी मुहावरे में केवल सुनना नहीं, बल्कि आज्ञा मानना भी निहित है; आधुनिक हिंदी में यह अर्थ स्वाभाविक रूप से व्यक्त होता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: व्यक्तिगत ईश्वरीय नाम को उपाधि में बदलने के बजाय हिंदी में प्रचलित लिप्यंतरण रखा गया है।
- source_word: הִנְּךָ
  choice: देख
  rationale: यहाँ ध्यान खींचने और निकट भविष्य की घोषणा पर बल देने वाला सूचक है।
- source_word: הִכְּךָ / וַיַּכֵּהוּ
  choice: मार डालेगा / मार डाला
  rationale: संदर्भ में सिंह का प्रहार घातक है; भविष्यवाणी और उसकी पूर्ति के समानांतर को बनाए रखा गया है।
- source_word: הָאַרְיֵה
  choice: सिंह
  rationale: मूल के निश्चित एकवचन संज्ञा का सीधा और गरिमापूर्ण हिंदी रूप।
theological_decisions:
- issue: यहोवा की वाणी न मानने और दंड के बीच संबंध
  choice: 'कारणसूचक संबंध को स्पष्ट रखा गया: “इसलिए”'
  alternative: केवल दो स्वतंत्र कथनों के रूप में प्रस्तुत करना
  rationale: יַעַן אֲשֶׁר स्पष्ट रूप से अवज्ञा को घोषित दंड का कारण बताता है; अनुवाद इसमें न तो अतिरिक्त व्याख्या जोड़ता है, न इस संबंध को कमजोर करता है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिंदी; प्रत्यक्ष कथन की तीव्रता तथा भविष्यवाणी और पूर्ति की समानांतर संरचना सुरक्षित रखी गई है।
