source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר אֵלָ֗י/ו כֹּ֚ה אָמַ֣ר יְהוָ֔ה יַ֛עַן שִׁלַּ֥חְתָּ אֶת אִישׁ חֶרְמִ֖/י מִ/יָּ֑ד וְ/הָיְתָ֤ה נַפְשְׁ/ךָ֙ תַּ֣חַת נַפְשׁ֔/וֹ וְ/עַמְּ/ךָ֖ תַּ֥חַת עַמּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/042.yaml
  text: 'And he said to him[a], “Thus says Yahweh: Because you have let go from your hand the man I had devoted to destruction, your life shall be for his life, and your people for his people.”'
translation:
  language: hi
  text: 'उसने उससे कहा, “याहवे यों कहता है: क्योंकि तूने उस मनुष्य को अपने हाथ से जाने दिया, जिसे मैंने विनाश के लिए ठहराया था,[a] इसलिए तेरा प्राण उसके प्राण के बदले जाएगा, और तेरी प्रजा उसकी प्रजा के बदले जाएगी।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वह मनुष्य जो मेरे विनाश के लिए ठहराया हुआ था।” इब्रानी में חֵרֶם शब्दावली उस व्यक्ति के लिए प्रयुक्त हुई है जिसे परमेश्वर के न्याय के अंतर्गत विनाश के लिए ठहराया गया हो।
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के वाचा-नाम को शीर्षक से बदलने के बजाय लिप्यंतरित किया गया है।
- source_word: יַעַן
  choice: क्योंकि
  rationale: यह आने वाले न्याय का कारण स्वाभाविक और संक्षिप्त रूप से प्रस्तुत करता है।
- source_word: שִׁלַּחְתָּ ... מִיָּד
  choice: तूने ... अपने हाथ से जाने दिया
  rationale: शाब्दिक बिंब ‘हाथ से’ अभिरक्षा या अधिकार को व्यक्त करता है; ‘जाने दिया’ क्रिया में ऐसा कोई अतिरिक्त अर्थ नहीं जोड़ता कि वह भाग निकला।
- source_word: אִישׁ חֶרְמִי
  choice: उस मनुष्य को ... जिसे मैंने विनाश के लिए अर्पित ठहराया था
  rationale: प्रथम पुरुष प्रत्यय को ‘मैंने’ द्वारा स्पष्ट रखा गया है और חֵרֶם के ईश्वरीय न्याय तथा विनाश हेतु समर्पण के भाव को व्यक्त किया गया है।
- source_word: נַפְשְׁךָ תַּחַת נַפְשׁוֹ
  choice: तेरे प्राण उसके प्राणों के बदले
  rationale: यहाँ נֶפֶשׁ का अर्थ जीवन/प्राण है; ‘के बदले’ תַּחַת के प्रतिस्थापन और न्याय के भाव को बनाए रखता है।
- source_word: וְעַמְּךָ תַּחַת עַמּוֹ
  choice: तेरी प्रजा उसकी प्रजा के बदले
  rationale: पहले खंड के समानांतर न्याय-वचन को सुरक्षित रखता है।
- source_word: כֹּה אָמַר
  choice: यह कहता है
  rationale: हिन्दी में स्वाभाविक रहते हुए मानक भविष्यद्वक्तीय संदेश-सूत्र को व्यक्त करता है।
theological_decisions:
- issue: חֵרֶם न्याय-शब्दावली का अनुवाद
  choice: जिसे मैंने विनाश के लिए अर्पित ठहराया था
  alternative: जो मेरे विनाश-विधान के अधीन था
  rationale: मुख्य पाठ में ईश्वरीय निर्धारण और विनाश का गंभीर भाव स्पष्ट किया गया है, जबकि अस्पष्ट तकनीकी शब्दावली से बचा गया है; वैकल्पिक अर्थ पादटिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण भविष्यद्वक्तीय शैली रखी गई है। राजा को संबोधन होने पर भी मूल इब्रानी के एकवचन द्वितीय पुरुष की सीधाई बनाए रखने के लिए ‘तू/तेरे’ का प्रयोग किया गया है। ‘प्राण ... प्राणों’ और ‘प्रजा ... प्रजा’ का समानांतर विन्यास मूल न्याय-वचन की लय और प्रतिस्थापन के भाव को सुरक्षित रखता है।
