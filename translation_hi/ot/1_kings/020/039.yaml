base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/039.yaml
  text: As the king was passing by[a], he cried out to the king and said, “Your servant went out into the midst of the battle, and behold, a man turned aside and brought a man to me and said, ‘Guard this man. If he is ever missing, then your life shall be for his life[b], or you shall weigh out a talent of silver.’”
translation:
  language: hi
  text: जब राजा वहाँ से जा रहा था, तब एक आदमी ने राजा को पुकारकर कहा, “आपका सेवक लड़ाई के बीचोंबीच गया था। तभी एक आदमी हटकर आया और एक दूसरे आदमी को मेरे पास लाकर बोला, ‘इस आदमी की रखवाली करना। यदि यह किसी भी तरह गायब हो जाए[a], तो तेरी जान उसकी जान के बदले होगी[b], या तुझे एक किक्कार चाँदी[c] तौलनी होगी।’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “यदि वह निश्चय ही गायब पाया जाए।” इब्रानी में एक ही क्रिया के दो रूप साथ रखकर बात पर जोर दिया गया है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “तेरी जान उसकी जान के स्थान पर”—यह प्रतिस्थापन का कानूनी सूत्र है।
    reason: lexical_alternative
  - marker: c
    text: “किक्कार” प्राचीन भार की एक बड़ी इकाई थी, जिसे प्रायः “टैलेंट” भी कहा जाता है। उसका ठीक भार अलग-अलग समय और स्थान में बदलता था।
    reason: historical_measure
