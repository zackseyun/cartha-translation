source:
  edition: WLC
  text: וְ/אִ֨ישׁ אֶחָ֜ד מִ/בְּנֵ֣י הַ/נְּבִיאִ֗ים אָמַ֧ר אֶל רֵעֵ֛/הוּ בִּ/דְבַ֥ר יְהוָ֖ה הַכֵּ֣י/נִי נָ֑א וַ/יְמָאֵ֥ן הָ/אִ֖ישׁ לְ/הַכֹּתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/035.yaml
  text: A certain man from the sons of the prophets said to his companion by the word of Yahweh[b][a], “Please strike me.” But the man refused to strike him.
translation:
  language: hi
  text: नबियों के पुत्रों[a] में से एक व्यक्ति ने याहवे के वचन के अनुसार[b] अपने साथी से कहा, “कृपया मुझ पर प्रहार करो।” लेकिन उस व्यक्ति ने उस पर प्रहार करने से इनकार कर दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “नबियों के समुदाय” अथवा “नबियों के शिष्यों” में से। इब्रानी में शाब्दिक रूप से “नबियों के पुत्रों” है—यह किसी नबी-समूह के लिए प्रचलित अभिव्यक्ति थी।
    reason: lexical_alternative
  - marker: b
    text: या “याहवे के वचन पर” अथवा “याहवे के आदेश से।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִישׁ אֶחָד
  choice: एक व्यक्ति
  rationale: यह कथात्मक प्रयोग किसी एक अनिर्दिष्ट व्यक्ति का परिचय देता है। हिंदी में ‘एक व्यक्ति’ स्वाभाविक है; आरंभिक וְ के लिए अनावश्यक कालसूचक ‘अब’ या ‘तब’ नहीं जोड़ा गया।
- source_word: מִבְּנֵי הַנְּבִיאִים
  choice: नबियों के पुत्रों में से
  rationale: मुख्य पाठ में इब्रानी अभिव्यक्ति को पारदर्शी रूप से रखा गया है। यह संभवतः किसी नबी-समुदाय या नबियों के शिष्यों के समूह के लिए प्रचलित पद था; इसे पादटिप्पणी में स्पष्ट किया गया है।
- source_word: רֵעֵהוּ
  choice: अपने साथी से
  rationale: רֵעַ साथी, संगी या निकटवर्ती व्यक्ति को सूचित कर सकता है। ‘साथी’ भावनात्मक घनिष्ठता को अनावश्यक रूप से नहीं बढ़ाता।
- source_word: בִּדְבַר יְהוָה
  choice: याहवे के वचन पर
  rationale: यह पद बताता है कि कथन याहवे से मिले वचन के अधिकार अथवा आदेश के आधार पर किया गया। ‘वचन पर’ इब्रानी मुहावरे को बनाए रखते हुए हिंदी में संक्षिप्त है।
- source_word: יְהוָה
  choice: याहवे
  rationale: मूल पाठ में परमेश्वर का निजी नाम टेट्राग्रामटन है; इसलिए किसी उपाधि से बदलने के बजाय उसका हिंदी लिप्यंतरण ‘याहवे’ रखा गया है।
- source_word: הַכֵּינִי נָא
  choice: कृपया मुझ पर प्रहार करो
  rationale: נכה का सामान्य अर्थ प्रहार करना है। अगले पद में चोट लगना परिणाम है, पर यहाँ उसे पहले से जोड़ना उचित नहीं। נָא को ‘कृपया’ से व्यक्त किया गया है।
- source_word: וַיְמָאֵן
  choice: इनकार कर दिया
  rationale: क्रिया केवल हिचकिचाहट नहीं बल्कि स्पष्ट अस्वीकृति बताती है।
- source_word: לְהַכֹּתוֹ
  choice: उस पर प्रहार करने
  rationale: पहले आए נכה के साथ शब्दगत संगति रखी गई है और ‘घायल करना’ जैसा परिणाम समय से पहले नहीं जोड़ा गया।
theological_decisions:
- issue: परमेश्वर के नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: यहाँ मूल पाठ सीधे वाचा-संबंधी निजी नाम का प्रयोग करता है। ‘याहवे’ उस नाम का प्रचलित विद्वत्तापूर्ण लिप्यंतरण है और उसे किसी उपाधि से नहीं बदलता।
- issue: בְּנֵי הַנְּבִיאִים की सामाजिक पहचान
  choice: नबियों के पुत्रों
  alternative: नबियों का समुदाय; नबियों के शिष्य
  rationale: अभिव्यक्ति संभवतः किसी नबी-समूह को सूचित करती है, पर उसकी सटीक संस्थागत संरचना स्पष्ट नहीं है। इसलिए मुख्य पाठ मूल रूपक बचाता है और व्याख्यात्मक विकल्प पादटिप्पणी में देता है।
- issue: בִּדְבַר יְהוָה में अधिकार अथवा आदेश का भाव
  choice: याहवे के वचन पर
  alternative: याहवे के आदेश से; याहवे के वचन के अनुसार
  rationale: मूल पद वचन के माध्यम से मिले अधिकार और आदेश—दोनों भाव ग्रहण कर सकता है। मुख्य पाठ इब्रानी की व्यापकता बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिंदी में स्वाभाविक किंतु गरिमापूर्ण शैली रखी गई है। ‘प्रहार करना’ ने ‘मारना’ की संभावित ‘हत्या करना’ वाली अस्पष्टता से बचते हुए נכה का अर्थ सुरक्षित रखा है। मूल की वास्तविक व्याख्यात्मक खुलावट पादटिप्पणियों में बनाए रखी गई है।
