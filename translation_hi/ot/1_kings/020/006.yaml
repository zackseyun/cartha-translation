base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/006.yaml
  text: No[a], but about this time tomorrow I will send my servants to you, and they will search your house and the houses of your servants; and whatever is desirable in your eyes[b], they will put into their hands and take away.
translation:
  language: hi
  text: नहीं, बल्कि कल लगभग इसी समय मैं अपने सेवकों को तेरे पास भेजूँगा। वे तेरे घर और तेरे सेवकों के घरों की तलाशी लेंगे; और जो कुछ तेरी आँखों में बहुमूल्य है[a], उसे अपने हाथ में लेकर ले जाएँगे।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात वह सब जो तुझे बहुत प्रिय है या जिसे तू बहुत मूल्यवान समझता है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में शाब्दिक रूप से, “अपने हाथ में रखेंगे और ले लेंगे”; यहाँ आशय उसे अपने अधिकार में करके ले जाने से है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי אִם
  choice: नहीं, बल्कि
  rationale: संदर्भ में यह पिछले प्रस्ताव की सीमा को अस्वीकार करके धमकी को और बढ़ाता है; यह अनुवाद उस सुधारात्मक और विरोधसूचक बल को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: כָּעֵת מָחָר
  choice: कल लगभग इसी समय
  rationale: यह अगले दिन के लगभग इसी समय को बताने वाला मुहावरेदार काल-वाक्यांश है।
- source_word: עֲבָדַי
  choice: मेरे सेवकों
  rationale: यहाँ राजा के भेजे हुए प्रतिनिधि या परिचारक अभिप्रेत हैं; उनके दासत्व पर बल नहीं है।
- source_word: וְחִפְּשׂוּ
  choice: तलाशी लेंगे
  rationale: क्रिया ध्यानपूर्वक या पूरी तरह खोजने की क्रिया व्यक्त करती है; ‘तलाशी लेंगे’ प्रसंगानुकूल है और अनावश्यक रूप से हिंसा नहीं जोड़ता।
- source_word: בֵּיתְךָ ... בָּתֵּי עֲבָדֶיךָ
  choice: तेरे घर और तेरे सेवकों के घरों
  rationale: בַּיִת का अर्थ ‘घर’ या राजकीय संदर्भ में ‘महल’ हो सकता है। ‘घर’ मूल समानांतरता को बनाए रखता और अर्थ को अनावश्यक रूप से सीमित नहीं करता।
- source_word: כָּל מַחְמַד עֵינֶיךָ
  choice: जो कुछ तेरी आँखों में बहुमूल्य है
  rationale: यह इब्रानी मुहावरा उस सबको दर्शाता है जो किसी को प्रिय, मनभावना या अत्यंत मूल्यवान हो; हिन्दी में मूल बिंब भी बना रहता है।
- source_word: יָשִׂימוּ בְיָדָם וְלָקָחוּ
  choice: उसे अपने हाथ में लेकर ले जाएँगे
  rationale: यह मूल की ‘अपने हाथ में रखना और लेना’ वाली क्रमिक अभिव्यक्ति को सुबोध हिन्दी में रखता है और जब्त करके ले जाने का भाव प्रकट करता है।
