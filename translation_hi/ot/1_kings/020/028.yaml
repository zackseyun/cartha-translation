  text: וַ/יִּגַּ֞שׁ אִ֣ישׁ הָ/אֱלֹהִ֗ים וַ/יֹּאמֶר֮ אֶל מֶ֣לֶךְ יִשְׂרָאֵל֒ וַ/יֹּ֜אמֶר כֹּֽה אָמַ֣ר יְהוָ֗ה יַ֠עַן אֲשֶׁ֨ר אָמְר֤וּ אֲרָם֙ אֱלֹהֵ֤י הָרִים֙ יְהוָ֔ה וְ/לֹֽא אֱלֹהֵ֥י עֲמָקִ֖ים ה֑וּא וְ֠/נָתַתִּי אֶת כָּל הֶ/הָמ֨וֹן הַ/גָּ֤דוֹל הַ/זֶּה֙ בְּ/יָדֶ֔/ךָ וִֽ/ידַעְתֶּ֖ם כִּֽי אֲנִ֥י יְהוָֽה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/028.yaml
  text: 'Then the man of God came near and said to the king of Israel[a], “Thus says Yahweh: Because Aram has said, ‘Yahweh is a god of the mountains, but he is not a god of the valleys,’ I will give all this great multitude into your hand[c][b], and you shall know that I am Yahweh.”'
translation:
  language: hi
  text: "तब परमेश्वर का जन पास आया और इस्राएल के राजा से कहा, “याहवे यों कहता है, ‘क्योंकि अराम[a] ने कहा है, “याहवे पहाड़ों का देवता है, घाटियों का देवता नहीं[b],” इसलिए मैं इस सारी बड़ी भीड़ को तेरे हाथ में दे दूँगा; और तुम सब[c] जान लोगे कि मैं याहवे हूँ।’”\n\n[a] इब्रानी में “अराम”; कुछ परंपरागत अनुवादों में “सीरिया।” \n\n[b] “पहाड़ों ... घाटियों” का अनुवाद “पहाड़ियों ... मैदानों” भी हो सकता है। इब्रानी में ऊँचे भूभाग और निचले भूभाग का विरोध है।\n\n[c] “तुम सब जान लोगे” के लिए इब्रानी क्रिया बहुवचन है। वचन राजा से कहा गया है, पर इसका परिणाम सामूहिक रूप से इस्राएल तक पहुँचता है।"
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में “अराम”; कुछ परंपरागत अनुवादों में “सीरिया।”
    reason: alternative_reading
  - marker: b
    text: “पहाड़ों ... घाटियों” का अनुवाद “पहाड़ियों ... मैदानों” भी हो सकता है। इब्रानी में ऊँचे भूभाग और निचले भूभाग का विरोध है।
    reason: lexical_alternative
  - marker: c
    text: “तुम सब जान लोगे” के लिए इब्रानी क्रिया बहुवचन है। वचन राजा से कहा गया है, पर इसका परिणाम सामूहिक रूप से इस्राएल तक पहुँचता है।
    reason: grammatical_number
lexical_decisions:
- source_word: אִישׁ הָאֱלֹהִים
  choice: परमेश्वर का जन
  rationale: यह निश्चित, पहचाने हुए भविष्यद्वक्ता के लिए प्रयुक्त पदवी है; हिन्दी बाइबलीय प्रयोग में यह स्वाभाविक और गरिमापूर्ण है।
- source_word: וַיִּגַּשׁ
  choice: पास आया
  rationale: क्रिया के निकट आने के ठोस अर्थ को सहज आधुनिक हिन्दी में रखता है।
- source_word: כֹּה אָמַר יְהוָה
  choice: याहवे यों कहता है
  rationale: भविष्यद्वक्ताओं का मानक संदेशवाहक सूत्र है और वर्तमान हिन्दी में स्पष्ट है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी व्यक्तिगत दिव्य नाम का लिप्यंतरण किया गया है, उसे किसी उपाधि से नहीं बदला गया।
- source_word: אֲרָם
  choice: अराम
  rationale: मूल भौगोलिक-जातीय नाम को रखा गया है; बाद का नाम “सीरिया” मुख्य पाठ में नहीं लाया गया।
- source_word: אֱלֹהֵי הָרִים ... אֱלֹהֵי עֲמָקִים
  choice: पहाड़ों का देवता ... घाटियों का देवता
  rationale: यह अराम की उस गलत धारणा को व्यक्त करता है जिसमें याहवे को सीमित भूभाग का एक देवता माना गया है; भू-आकृतिक विरोध को सीधे रखा गया है।
- source_word: כָּל הֶהָמוֹן הַגָּדוֹל הַזֶּה
  choice: इस सारी विशाल सेना
  rationale: הָמוֹן का अर्थ बड़ी भीड़ या जनसमूह हो सकता है, पर युद्ध के इस प्रसंग में “विशाल सेना” सबसे स्पष्ट और स्वाभाविक है।
- source_word: בְּיָדֶךָ
  choice: तेरे हाथ में
  rationale: विजय अथवा अधिकार में सौंपने की इब्रानी उपमा को सुरक्षित रखता है और हिन्दी में समझने योग्य है।
- source_word: וִידַעְתֶּם
  choice: तुम सब जान लोगे
  rationale: इब्रानी क्रिया द्वितीय पुरुष पुल्लिंग बहुवचन है; “तुम सब” राजा से आगे पूरे इस्राएल की ओर संकेत स्पष्ट करता है।
- source_word: כִּי אֲנִי יְהוָה
  choice: कि मैं याहवे हूँ
  rationale: दिव्य आत्म-परिचय के सूत्र और व्यक्तिगत नाम दोनों को सीधे सुरक्षित रखता है।
theological_decisions:
- issue: दिव्य नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ व्यक्तिगत दिव्य नाम का प्रयोग करता है; लिप्यंतरण उस नाम को उपाधि में बदलने से बचाता है।
- issue: अराम की स्थानीयकृत देवता-संबंधी धारणा
  choice: याहवे पहाड़ों का देवता है, घाटियों का देवता नहीं
  alternative: याहवे पहाड़ों का परमेश्वर है, मैदानों का परमेश्वर नहीं
  rationale: “देवता” अरामियों की बहुदेववादी और भूभाग-सीमित समझ को स्वाभाविक हिन्दी में सामने लाता है, जबकि कथावाचक उसे सत्य के रूप में अनुमोदित नहीं करता।
- issue: וִידַעְתֶּם में संबोधित लोगों की संख्या
  choice: बहुवचन “तुम सब जान लोगे”
  alternative: एकवचन “तू जान लेगा” केवल राजा के लिए
  rationale: राजा प्रत्यक्ष श्रोता है, लेकिन इब्रानी क्रिया स्पष्ट रूप से बहुवचन है; इसलिए ज्ञान का परिणाम सामूहिक इस्राएल तक विस्तृत रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी, देवनागरी, गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। राजा के लिए एकवचन “तेरे” और फिर इस्राएल के लिए बहुवचन “तुम सब” का जानबूझकर किया गया परिवर्तन मूल इब्रानी के संख्या-परिवर्तन को प्रत्यक्ष बनाता है।
