  text: וַֽ/יַּחֲנ֧וּ אֵ֦לֶּה נֹ֥כַח אֵ֖לֶּה שִׁבְעַ֣ת יָמִ֑ים וַ/יְהִ֣י בַּ/יּ֣וֹם הַ/שְּׁבִיעִ֗י וַ/תִּקְרַב֙ הַ/מִּלְחָמָ֔ה וַ/יַּכּ֨וּ בְנֵֽי יִשְׂרָאֵ֧ל אֶת אֲרָ֛ם מֵאָה אֶ֥לֶף רַגְלִ֖י בְּ/י֥וֹם אֶחָֽד׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/029.yaml
  text: And these camped opposite those for seven days[a]. Then on the seventh day the battle drew near[c][b], and the sons of Israel struck down Aram—one hundred thousand foot soldiers in one day.
translation:
  language: hi
  text: दोनों पक्ष सात दिन तक आमने-सामने डेरा डाले रहे। फिर सातवें दिन युद्ध निकट आ पहुँचा, और इस्राएल के पुत्रों[a] ने अराम[b] के एक लाख पैदल सैनिकों[c] को एक ही दिन में मार गिराया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “इस्राएलियों ने।” इब्रानी में शाब्दिक रूप से “इस्राएल के पुत्र” है।
    reason: lexical_alternative
  - marker: b
    text: या “अरामियों को।” इब्रानी “अराम” से अरामी राज्य या उसके लोग अभिप्रेत हो सकते हैं।
    reason: lexical_alternative
  - marker: c
    text: या “पैदल सेना को।” इब्रानी में शाब्दिक रूप से पैदल चलकर लड़ने वाले सैनिकों का उल्लेख है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּחֲנוּ
  choice: डेरा डाले रहे
  rationale: חנה का अर्थ शिविर लगाना या डेरा डालना है। अवधि के साथ ‘डेरा डाले रहे’ स्वाभाविक हिन्दी है।
- source_word: אֵלֶּה נֹכַח אֵלֶּה
  choice: दोनों पक्ष ... आमने-सामने
  rationale: इब्रानी की संक्षिप्त अभिव्यक्ति ‘ये उनके सामने’ दो विरोधी दलों को सूचित करती है। ‘दोनों पक्ष आमने-सामने’ उसी स्थानिक विरोध को सहज हिन्दी में व्यक्त करता है।
- source_word: שִׁבְעַת יָמִים
  choice: सात दिन तक
  rationale: ‘तक’ अवधि को स्वाभाविक हिन्दी में स्पष्ट करता है।
- source_word: וַיְהִי בַּיּוֹם הַשְּׁבִיעִי
  choice: फिर सातवें दिन
  rationale: इब्रानी कथात्मक सूत्र को अनावश्यक प्राचीनता के बिना सहज कालक्रम के रूप में प्रस्तुत किया गया है।
- source_word: וַתִּקְרַב הַמִּלְחָמָה
  choice: युद्ध छिड़ गया
  rationale: शाब्दिक अर्थ ‘युद्ध निकट आया’ है; इस प्रसंग में यह सेनाओं के युद्ध में भिड़ने और लड़ाई आरम्भ होने का मुहावरा है। ‘युद्ध छिड़ गया’ आधुनिक हिन्दी में वही भाव देता है।
- source_word: וַיַּכּוּ
  choice: मार गिराया
  rationale: נכה युद्ध में प्रहार करने या धराशायी करने को दर्शाता है और यहाँ परिणाम घातक है। ‘मार गिराया’ इस युद्ध-संदर्भ के बल को बनाए रखता है।
- source_word: בְנֵי יִשְׂרָאֵל
  choice: इस्राएल के पुत्रों
  rationale: यह स्रोत की पुल्लिंग सामूहिक अभिव्यक्ति का निकट रूप है और इस प्रसंग में इस्राएल के योद्धाओं को सूचित करता है। अधिक प्रचलित विकल्प ‘इस्राएली’ पादटिप्पणी में दिया गया है।
- source_word: אֲרָם
  choice: अराम
  rationale: मूल पाठ में जातिवाचक रूप के बजाय देश अथवा प्रजा का नाम ‘अराम’ है। वाक्य की स्पष्टता के लिए इसे ‘अराम के ... सैनिकों’ के रूप में रखा गया है।
- source_word: מֵאָה אֶלֶף
  choice: एक लाख
  rationale: आधुनिक हिन्दी में 100,000 की स्वाभाविक संख्या-अभिव्यक्ति।
- source_word: רַגְלִי
  choice: पैदल सैनिकों
  rationale: सैन्य प्रसंग में यह पैदल लड़ने वाले सैनिकों को दर्शाता है। यह ‘पैदल सेना’ से अधिक सीधे व्यक्तियों को सूचित करता है।
- source_word: בְּיוֹם אֶחָד
  choice: एक ही दिन में
  rationale: ‘ही’ इस बात पर उचित बल देता है कि यह संख्या एक दिन की अवधि के भीतर मारी गई।
theological_decisions:
- issue: בְנֵי יִשְׂרָאֵל में पुल्लिंग सामूहिक भाषा
  choice: इस्राएल के पुत्रों
  alternative: इस्राएलियों
  rationale: स्रोत की शाब्दिक पुल्लिंग अभिव्यक्ति को सैन्य प्रसंग में सुरक्षित रखा गया है; पादटिप्पणी अधिक स्वाभाविक सामूहिक विकल्प बताती है।
- issue: אֲרָם को व्यक्तिनाम/देश-नाम या जातिवाचक रूप में प्रस्तुत करना
  choice: अराम
  alternative: अरामी लोग
  rationale: मूल में अराम का नाम है, जिसे बाद के भू-राजनीतिक नाम से नहीं बदला गया। हिन्दी वाक्य में ‘अराम के ... सैनिक’ स्पष्ट करता है कि यहाँ उसकी सेना/प्रजा अभिप्रेत है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और कथात्मक है। ‘दोनों पक्ष’ और ‘युद्ध छिड़ गया’ शाब्दिक इब्रानी संरचना को हिन्दी में असहज बनाए बिना उसके प्रसंगगत अर्थ को व्यक्त करते हैं; नाम ‘अराम’ और स्रोत की ‘इस्राएल के पुत्र’ अभिव्यक्ति सुरक्षित रखी गई है।
