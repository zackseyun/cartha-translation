  edition: WLC
  text: וַ/יֹּ֛אמֶר אִם לְ/שָׁל֥וֹם יָצָ֖אוּ תִּפְשׂ֣וּ/ם חַיִּ֑ים וְ/אִ֧ם לְ/מִלְחָמָ֛ה יָצָ֖אוּ חַיִּ֥ים תִּפְשֽׂוּ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/018.yaml
  text: And he said[a], “If they have come out for peace, seize them alive; and if they have come out for battle, seize them alive.”
translation:
  language: hi
  text: उसने कहा, “यदि वे शान्ति के लिए निकले हैं, तो उन्हें जीवित पकड़ लो; और यदि वे युद्ध के लिए निकले हैं, तो उन्हें जीवित पकड़ लो।”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “यदि वे शान्तिपूर्वक निकले हैं … यदि वे युद्ध करने निकले हैं।”
    reason: לְשָׁלוֹם और לְמִלְחָמָה उद्देश्य (‘के लिए’) अथवा ढंग/इरादा (‘शान्तिपूर्वक’, ‘युद्ध करने’) व्यक्त कर सकते हैं; पादटिप्पणी इस वास्तविक शाब्दिक सम्भावना को सुरक्षित रखती है।
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: उसने कहा
  rationale: यह אמר का सामान्य कथात्मक रूप है। हिन्दी में ‘उसने कहा’ स्वाभाविक है और प्रसंग में कोई अतिरिक्त कालक्रम नहीं जोड़ता।
- source_word: אִם
  choice: यदि
  rationale: यह दोनों संभावित स्थितियों को प्रस्तुत करने वाला शर्तसूचक अव्यय है; ‘यदि’ सटीक और गरिमापूर्ण आधुनिक हिन्दी है।
- source_word: לְשָׁלוֹם
  choice: शान्ति के लिए
  rationale: לְ उपसर्ग के साथ שָׁלוֹם यहाँ शान्तिपूर्ण उद्देश्य को दर्शाता है। यह रूप मूल की संरचना को बनाए रखता है, जबकि ‘शान्तिपूर्वक’ की सम्भावना पादटिप्पणी में दी गई है।
- source_word: יָצָאוּ
  choice: निकले हैं
  rationale: 'पूर्ण क्रिया को वर्तमान-परिणामी अर्थ में रखा गया है: वे अब बाहर निकल चुके हैं। ‘निकले हैं’ हिन्दी में प्रसंगानुकूल है और दिशा को अनावश्यक रूप से नहीं बढ़ाता।'
- source_word: תִּפְשׂוּם
  choice: उन्हें पकड़ लो
  rationale: תפשׂ का सैन्य प्रसंग में अर्थ पकड़ना या बन्दी बनाना है। ‘पकड़ लो’ आज्ञा की तत्परता और बल को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: חַיִּים
  choice: जीवित
  rationale: यह बताता है कि पकड़े जाते समय वे जीवित रहें; ‘जीवित पकड़ लो’ हिन्दी का स्वाभाविक सैन्य प्रयोग है।
- source_word: וְאִם
  choice: और यदि
  rationale: सरल संयोजक וְ को ‘और’ से रखा गया है; ‘लेकिन’ जोड़ने से मूल से अधिक विरोधाभास उत्पन्न होता।
- source_word: לְמִלְחָמָה
  choice: युद्ध के लिए
  rationale: מִלְחָמָה युद्ध या लड़ाई को सूचित करता है। ‘युद्ध के लिए’ पहले पद ‘शान्ति के लिए’ के समानान्तर है।
- source_word: חַיִּים תִּפְשׂוּם
  choice: उन्हें जीवित पकड़ लो
  rationale: दूसरे खण्ड में हिब्रू शब्दक्रम ‘जीवित’ पर बल देता है, पर हिन्दी में स्वाभाविक आज्ञार्थक क्रम अपनाया गया है। मूल की प्रभावपूर्ण पुनरावृत्ति हटाई नहीं गई।
