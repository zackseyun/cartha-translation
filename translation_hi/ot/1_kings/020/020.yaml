  text: And each man struck down his man[a], and Aram fled, and Israel pursued them[b]. But Ben-hadad king of Aram escaped on a horse with horsemen.
translation:
  language: hi
  text: और हर एक ने अपने सामने वाले को मार गिराया[a]। अरामी भाग गए, और इस्राएल ने उनका पीछा किया। लेकिन अराम का राजा बेन-हदद एक घोड़े पर सवार होकर घुड़सवारों के साथ बच निकला[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से, “हर एक ने अपने व्यक्ति को मारा।” यह मुहावरा हर एक के अपने सामने वाले प्रतिद्वंद्वी को मारने का अर्थ देता है।
    reason: lexical_alternative
  - marker: b
    text: या, “घोड़े पर और घुड़सवारों के साथ बच निकला।” इब्रानी वाक्यांश बेन-हदद के घोड़े पर भागने और घुड़सवारों के साथ होने का वर्णन करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּכּוּ
  choice: मार गिराया
  rationale: युद्ध के प्रसंग में נכה केवल प्रहार करने से अधिक, विरोधी को परास्त कर गिराने का भाव देता है; ‘मार गिराया’ मृत्यु को अनिवार्य रूप से स्पष्ट किए बिना इस बल को व्यक्त करता है।
- source_word: אִישׁ אִישׁוֹ
  choice: हर एक ने अपने सामने के सैनिक को
  rationale: शाब्दिक इब्रानी ‘हर पुरुष ने अपने पुरुष को’ है। हिन्दी में शाब्दिक रूप अस्वाभाविक और अस्पष्ट होता, इसलिए युद्ध में प्रत्येक के सामने खड़े प्रतिद्वंद्वी का आशय स्पष्ट किया गया है।
- source_word: אֲרָם
  choice: अरामी
  rationale: यहाँ ‘अराम’ उस देश की युद्धरत सेना/लोगों के लिए सामूहिक रूप से प्रयुक्त है। ‘अरामी’ आधुनिक हिन्दी में स्वाभाविक है और ‘सीरिया’ जैसे बाद के भौगोलिक नाम से बचता है।
- source_word: וַיָּנֻסוּ
  choice: भाग गए
  rationale: यह युद्धभूमि से पलायन का सीधा और स्वाभाविक हिन्दी वर्णन है।
- source_word: וַיִּרְדְּפֵם
  choice: उनका पीछा किया
  rationale: רדף युद्ध के प्रसंग में पीछा करने को दर्शाता है; हिन्दी में यही प्रचलित समतुल्य है।
- source_word: וַיִּמָּלֵט
  choice: बच निकला
  rationale: युद्ध के संकट से निकल भागने का भाव व्यक्त करता है और किसी अतिरिक्त धर्मवैचारिक अभिप्राय को नहीं जोड़ता।
- source_word: בֶּן הֲדַד
  choice: बेन-हदद
  rationale: व्यक्तिनाम का देवनागरी लिप्यंतरण किया गया है।
- source_word: עַל סוּס וּפָרָשִׁים
  choice: एक घोड़े पर सवार होकर घुड़सवारों के साथ
  rationale: סוּס के एकवचन को ‘एक घोड़े’ और פָרָשִׁים को ‘घुड़सवारों’ से व्यक्त किया गया है। संयोजन को साथ आए सवारों के अर्थ में लिया गया है, जबकि सम्भव वैकल्पिक संरचना पादटिप्पणी में रखी गई है।
