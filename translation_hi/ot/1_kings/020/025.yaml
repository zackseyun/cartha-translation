source:
  edition: WLC
  text: וְ/אַתָּ֣ה תִֽמְנֶה לְ/ךָ֣ חַ֡יִל כַּ/חַיִל֩ הַ/נֹּפֵ֨ל מֵ/אוֹתָ֜/ךְ וְ/ס֣וּס כַּ/סּ֣וּס וְ/רֶ֣כֶב כָּ/רֶ֗כֶב וְ/נִֽלָּחֲמָ֤ה אוֹתָ/ם֙ בַּ/מִּישׁ֔וֹר אִם לֹ֥א נֶחֱזַ֖ק מֵ/הֶ֑ם וַ/יִּשְׁמַ֥ע לְ/קֹלָ֖/ם וַ/יַּ֥עַשׂ כֵּֽן־׀׀־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/025.yaml
  text: And you, muster for yourself an army like the army that fell from you, and horse for horse and chariot for chariot; then let us fight against them on the plain. Surely we will be stronger than they are.” So he listened to their voice and did so.
translation:
  language: hi
  text: और तू अपने लिए उतनी ही सेना फिर से जुटा, जितनी सेना तुझ से नष्ट हो गई है—घोड़े के बदले घोड़ा और रथ के बदले रथ। तब हम मैदान में उनसे युद्ध करेंगे। निश्चय ही हम उनसे अधिक शक्तिशाली होंगे।” उसने उनकी बात मानी और वैसा ही किया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תִמְנֶה לְךָ חַיִל
  choice: अपने लिए ... सेना फिर से जुटा
  rationale: תמנה का मूल भाव गिनना अथवा नियुक्त करना है, पर इस सैन्य संदर्भ में पराजित सेना के बराबर नया सैन्य बल तैयार करने के लिए ‘सेना जुटा’ स्वाभाविक है। ‘फिर से’ पुनःपूर्ति के आशय को स्पष्ट करता है।
- source_word: כַחַיִל הַנֹּפֵל מֵאוֹתָךְ
  choice: उतनी ही सेना ... जितनी सेना तेरी नष्ट हो गई थी
  rationale: तुलना और हानि दोनों को सहज हिन्दी में व्यक्त किया गया है। נפל का शाब्दिक अर्थ ‘गिरना’ है, किंतु सेना के विषय में यहाँ युद्ध में नष्ट हो जाने का भाव है।
- source_word: סוּס כַּסּוּס וְרֶכֶב כָּרֶכֶב
  choice: घोड़े के बदले घोड़ा और रथ के बदले रथ
  rationale: प्रतिस्थापन की समान मात्रा बताने वाले इब्रानी मुहावरे की समानांतर संरचना सुरक्षित रखी गई है।
- source_word: בַּמִּישׁוֹר
  choice: मैदान में
  rationale: מישור यहाँ समतल खुले भूभाग को दर्शाता है; ‘मैदान’ सामान्य हिन्दी में स्वाभाविक है और पहाड़ी क्षेत्र के साथ निहित विरोध बनाए रखता है।
- source_word: אִם לֹא נֶחֱזַק מֵהֶם
  choice: निश्चय ही हम उन पर प्रबल होंगे
  rationale: אִם לֹא यहाँ शपथात्मक/दृढ़ कथन है, साधारण शर्त नहीं। ‘प्रबल होंगे’ חזק מן के तुलनात्मक सामर्थ्य और विजय-विश्वास को व्यक्त करता है।
- source_word: וַיִּשְׁמַע לְקוֹלָם
  choice: उसने उनकी बात मानी
  rationale: शाब्दिक ‘उनकी आवाज़ सुनी’ के बजाय इस मुहावरे का आज्ञा/सलाह स्वीकार करने वाला अर्थ दिया गया है।
theological_decisions:
- issue: ‘मैदान’ में युद्ध करने की सलाह और सामर्थ्य का दावा
  choice: सलाहकारों के आत्मविश्वासी दावे के रूप में ही प्रस्तुत
  alternative: इसे परमेश्वर की ओर से निश्चित विजय या धार्मिक सत्य के रूप में प्रस्तुत करना
  rationale: वक्ता अराम के राजा के सेवक हैं; पद उनके दावे को उद्धृत करता है, उसकी सत्यता की पुष्टि नहीं करता।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी; राजा को संबोधन होने पर भी मूल इब्रानी के एकवचन रूप के अनुरूप ‘तू/तेरी’ रखा गया है। सैन्य समानांतरता और उद्धरण का दृढ़ स्वर सुरक्षित है।
