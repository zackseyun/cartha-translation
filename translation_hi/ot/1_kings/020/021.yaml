base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/021.yaml
  text: Then the king of Israel went out and struck the horses and the chariots[a], and inflicted a great blow on Aram.
translation:
  language: hi
  text: तब इस्राएल का राजा बाहर निकला और उसने घोड़ों और रथों पर प्रहार किया, और अराम पर बड़ा प्रहार किया।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “अरामियों पर।” इब्रानी “अराम” से राज्य अथवा उसकी सेना—दोनों का बोध हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: बाहर निकला
  rationale: יצא के सामान्य कथात्मक अर्थ को स्वाभाविक हिन्दी में रखता है; सैन्य संदर्भ से अनुमानित ‘कूच किया’ जैसी अतिरिक्त विशिष्टता नहीं जोड़ता।
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: इस्राएल का राजा
  rationale: सम्बन्ध-सूचक इब्रानी पदबंध का सीधा और स्वाभाविक हिन्दी रूप।
- source_word: וַיַּךְ
  choice: आक्रमण किया
  rationale: נכה का अर्थ ‘मारना/प्रहार करना’ हो सकता है; घोड़ों और रथों को सामूहिक सैन्य लक्ष्य मानते हुए ‘आक्रमण किया’ आधुनिक हिन्दी में स्वाभाविक है और पूर्ण विनाश का दावा नहीं करता।
- source_word: הַסּוּס
  choice: घोड़ों
  rationale: रूपतः एकवचन होने पर भी सैन्य प्रसंग में यह सामूहिक अर्थ रखता है; हिन्दी बहुवचन आशय स्पष्ट करता है।
- source_word: הָרָכֶב
  choice: रथों
  rationale: रכב यहाँ सामूहिक रूप से रथ-दल को सूचित करता है; ‘रथों’ सरल और स्वाभाविक हिन्दी है।
- source_word: בַאֲרָם
  choice: अराम को
  rationale: मूल नाम ‘अराम’ सुरक्षित रखा गया है; हिन्दी में ‘को’ नכה के साथ लक्ष्य को स्वाभाविक ढंग से व्यक्त करता है और राज्य अथवा उसकी सेना—दोनों सम्भावनाएँ खुली रखता है।
- source_word: מַכָּה גְדוֹלָה
  choice: भारी चोट
  rationale: शाब्दिक ‘बड़ी चोट/मार’ का स्वाभाविक हिन्दी रूप है; यह ‘नरसंहार’ या निर्णायक ‘पराजय’ जैसी अतिरिक्त विशिष्टता नहीं जोड़ता।
theological_decisions:
- issue: בַאֲרָם में ‘अराम’ राज्य को सूचित करता है या अरामी सेना को
  choice: मुख्य पाठ में ‘अराम’
  alternative: ‘अरामियों’
  rationale: व्यक्तिवाचक नाम को मूल के अनुसार बनाए रखने और राज्य तथा उसकी सेना के बीच वास्तविक अर्थगत अस्पष्टता को न मिटाने के लिए ‘अराम’ रखा गया है; वैकल्पिक सामूहिक अर्थ पादटिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी, सरल किंतु गरिमापूर्ण कथात्मक शैली। ‘इस्राएल’ और ‘अराम’ मूल ऐतिहासिक नामों के निकट रखे गए हैं। पादटिप्पणी-चिह्न सम्बद्ध वाक्य के अंत में रखा गया है।
