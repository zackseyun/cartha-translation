base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/004.yaml
  text: The king of Israel answered and said[a], “According to your word, my lord the king, I am yours, and all that is mine.”
translation:
  language: hi
  text: इस्राएल के राजा ने उत्तर दिया, “हे मेरे स्वामी राजा, आपके वचन के अनुसार, मैं आपका हूँ और मेरा सब कुछ भी आपका है।”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जैसा आप कहते हैं, हे मेरे स्वामी राजा, मैं आपका हूँ, और जो कुछ मेरे पास है वह सब भी आपका है।”
    reason: כִּדְבָרְךָ (‘आपके वचन के अनुसार’) और וְכָל אֲשֶׁר לִי (‘मेरा सब कुछ’) के अधिक मुहावरेदार वैकल्पिक अनुवाद को दर्शाता है।
lexical_decisions:
- source_word: וַיַּעַן ... וַיֹּאמֶר
  choice: ने उत्तर दिया
  rationale: दोनों इब्रानी क्रियाएँ मिलकर संवाद का औपचारिक परिचय देती हैं; हिन्दी में ‘उत्तर दिया’ स्वाभाविक है और अनावश्यक पुनरुक्ति से बचाता है।
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: इस्राएल के राजा
  rationale: सम्बन्धसूचक रचना का सीधा, स्पष्ट और स्वाभाविक हिन्दी रूप।
- source_word: כִּדְבָרְךָ
  choice: आपके वचन के अनुसार
  rationale: כִּ और דָּבָר की औपचारिक, अधीनतापूर्ण अभिव्यक्ति को निकटता से सुरक्षित रखता है।
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: हे मेरे स्वामी राजा
  rationale: यहाँ אֲדֹנִי किसी मानवीय राजा के लिए आदरसूचक सम्बोधन है; ‘स्वामी’ सामाजिक अधीनता व्यक्त करता है, दिव्य उपाधि नहीं।
- source_word: לְךָ אֲנִי
  choice: मैं ... आपका है
  rationale: सम्प्रदानसूचक לְךָ यहाँ स्वामित्व अथवा अधीनता बताता है; संयुक्त हिन्दी वाक्य में ‘मैं और ... सब आपका है’ संक्षिप्त और स्वाभाविक है।
- source_word: וְכָל אֲשֶׁר לִי
  choice: और जो कुछ मेरा है, सब
  rationale: मूल की व्यापकता और संक्षिप्तता बनाए रखता है तथा व्यक्ति और सम्पत्ति दोनों के पूर्ण समर्पण को व्यक्त करता है।
theological_decisions:
- issue: मानवीय राजा के सम्बोधन में אֲדֹנִי का अर्थ
  choice: मेरे स्वामी
  alternative: मेरे प्रभु
  rationale: सन्दर्भ में सम्बोधित व्यक्ति बेन-हदद नामक मानवीय राजा है। ‘स्वामी’ दरबारी सम्मान और अधीनता को स्पष्ट करता है तथा अनावश्यक दिव्य संकेत से बचता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; राजदरबार के प्रसंग के अनुरूप गरिमापूर्ण और विनम्र शैली। ‘आप’ और ‘स्वामी’ अधीनतापूर्ण सम्मान व्यक्त करते हैं।
