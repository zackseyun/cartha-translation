  text: So the king of Israel went to his house sullen and angry[a], and he came to Samaria.
translation:
  language: hi
  text: तब इस्राएल का राजा खिन्न और क्रोधित होकर अपने घर चला गया, और वह सामरिया पहुँचा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: चला गया
  rationale: यह הלך का सामान्य कथात्मक रूप है; ‘चला गया’ आधुनिक हिन्दी में प्रस्थान और गमन दोनों को स्वाभाविक रूप से व्यक्त करता है।
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: इस्राएल का राजा
  rationale: सम्बन्धसूचक इब्रानी पदबंध का स्पष्ट और प्रचलित हिन्दी रूप।
- source_word: עַל בֵּיתוֹ
  choice: अपने घर
  rationale: गति-सूचक क्रिया के साथ עַל यहाँ गन्तव्य का बोध कराता है। ‘घर’ मूल बिंब को सुरक्षित रखता है और अनावश्यक रूप से ‘महल’ नहीं जोड़ता।
- source_word: סַר
  choice: उदास
  rationale: וְזָעֵף के साथ यह भीतर ही भीतर अप्रसन्न और खिन्न मनोदशा दिखाता है; ‘उदास’ सामान्य पाठक के लिए सहज है, यद्यपि इसमें रूठे या खिन्न होने की छाया भी है।
- source_word: וְזָעֵף
  choice: क्रोधित
  rationale: यह शब्द झुँझलाहट, रोष या कड़वी अप्रसन्नता व्यक्त करता है; ‘क्रोधित’ गरिमापूर्ण और स्पष्ट हिन्दी है।
- source_word: וַיָּבֹא
  choice: पहुँचा
  rationale: בוא के कथात्मक प्रयोग को गन्तव्य के साथ हिन्दी में ‘पहुँचा’ अधिक स्वाभाविक ढंग से व्यक्त करता है।
- source_word: שֹׁמְרוֹנָה
  choice: सामरिया
  rationale: दिशासूचक ה सामरिया की ओर गति बताता है; ‘पहुँचा’ के साथ हिन्दी में अलग ‘को’ की आवश्यकता नहीं है।
