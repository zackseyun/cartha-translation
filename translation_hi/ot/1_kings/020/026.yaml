  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सामान्य-पाठक-सुलभ कथात्मक रूप। ‘अराम,’ ‘बेन-हदद,’ ‘इस्राएल’ और ‘अफेक’ जैसे पारंपरिक बाइबिलीय नाम रखे गए हैं। मूल की वास्तविक शाब्दिक और संदर्भगत संभावनाएँ पादटिप्पणियों में सुरक्षित हैं।
