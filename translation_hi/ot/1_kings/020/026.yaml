base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/026.yaml
  text: At the turn of the year[c][b][a], Ben-hadad mustered Aram and went up to Aphek for battle with Israel.
translation:
  language: hi
  text: वर्ष के फिर आने पर[a], बेन-हदद ने अराम की सेना[b] को इकट्ठा किया और इस्राएल से[c] युद्ध करने के लिए अफेक की ओर चढ़ गया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक अर्थ है, “वर्ष के लौटने के समय,” अर्थात जब वार्षिक चक्र फिर उसी समय पर आया; कुछ अनुवाद इसे “वसन्त ऋतु में” कहते हैं।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में “अराम” है। इसका संकेत अराम राज्य, अरामी लोगों या यहाँ उनकी सेना की ओर हो सकता है।
    reason: lexical_alternative
  - marker: c
    text: या, “इस्राएल के साथ।” इब्रानी संबंधबोधक का शाब्दिक अर्थ “के साथ” है, पर यहाँ प्रसंग युद्ध का है।
    reason: lexical_alternative
lexical_decisions:
- source_word: לִתְשׁוּבַת הַשָּׁנָה
  choice: वर्ष के फिर लौटने के समय
  rationale: यह इब्रानी मुहावरे के शाब्दिक चित्र—वर्ष के लौटने—को बनाए रखते हुए वार्षिक चक्र के दोबारा आने का स्वाभाविक हिन्दी अर्थ देता है; इसे अनिवार्य रूप से ‘वसन्त’ नहीं मानता।
- source_word: וַיִּפְקֹד ... אֶת אֲרָם
  choice: अराम की सेना को इकट्ठा किया
  rationale: सैनिक प्रसंग में פקד का अर्थ सेना को गिनना, निरीक्षण करना या युद्ध के लिए जुटाना हो सकता है। हिन्दी में ‘सेना को इकट्ठा किया’ संदर्भगत अर्थ स्पष्ट करता है, जबकि पादटिप्पणी ‘अराम’ की सामूहिक अस्पष्टता सुरक्षित रखती है।
- source_word: אֲרָם
  choice: अराम
  rationale: मूल पाठ के राज्य/जनसमुदाय के नाम को ‘सीरिया’ जैसे बाद के भौगोलिक नाम से नहीं बदला गया।
- source_word: וַיַּעַל
  choice: चढ़ाई की
  rationale: עלה का मूल भाव ‘ऊपर जाना/चढ़ना’ है; युद्ध-संदर्भ में ‘चढ़ाई की’ सैन्य गति को स्वाभाविक हिन्दी में व्यक्त करता है, यद्यपि इसमें आक्रमण का हल्का संदर्भगत भाव आता है।
- source_word: אֲפֵקָה
  choice: अफेक को
  rationale: स्थान-नाम पर दिशासूचक ה अफेक की ओर गति दर्शाता है; ‘अफेक को’ इसे संक्षेप में व्यक्त करता है।
- source_word: לַמִּלְחָמָה
  choice: युद्ध करने के लिए
  rationale: यह तत्काल सैन्य उद्देश्य को साधारण और स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: עִם יִשְׂרָאֵל
  choice: इस्राएल से
  rationale: עִם का शाब्दिक अर्थ ‘के साथ’ है, पर युद्ध के प्रसंग में हिन्दी ‘से युद्ध करना’ स्वाभाविक है; शाब्दिक विकल्प पादटिप्पणी में दिया गया है।
