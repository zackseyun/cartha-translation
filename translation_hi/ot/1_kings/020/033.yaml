base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/033.yaml
  text: The men were watching for an omen[a], and they quickly seized on it from him and said, “Ben-hadad is your brother.” And he said, “Come, take him.” Then Ben-hadad came out to him[c][b], and he had him come up into the chariot.
translation:
  language: hi
  text: वे लोग शकुन की ताक में थे[a], और उन्होंने झट से उसके मुँह से निकली बात लपक ली[b] और कहा, “बेन-हदद आपका भाई है।” अहाब ने कहा, “आओ, उसे ले आओ।” तब बेन-हदद निकलकर उसके पास आया, और अहाब ने उसे रथ पर चढ़वाया[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “शकुन देख रहे थे” अथवा “इसे शुभ संकेत मानने को तैयार थे।” इब्रानी क्रिया शकुन देखने का अर्थ दे सकती है; यहाँ सम्भवतः वे अहाब के शब्दों में अपने पक्ष का कोई अनुकूल संकेत खोज रहे थे।
    reason: lexical_alternative
  - marker: b
    text: यह इब्रानी अभिव्यक्ति कठिन है। आशय सम्भवतः यह है कि उन्होंने अहाब के शब्द को तुरन्त लपककर अपने पक्ष में अनुकूल स्वीकृति मान लिया।
    reason: lexical_alternative
  - marker: c
    text: 'या “उसे रथ पर चढ़ाया।” इब्रानी क्रिया कारणवाचक है: अहाब ने बेन-हदद को रथ पर चढ़वाया।'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְנַחֲשׁוּ
  choice: किसी शकुन की ताक में थे
  rationale: पिएल क्रिया शकुन देखने या अनुकूल संकेत खोजने का भाव रखती है। प्रसंग में दूत अहाब के शब्दों में लाभदायक संकेत खोज रहे हैं; यह अभिव्यक्ति उस अर्थ को स्वाभाविक हिन्दी में बनाए रखती है।
- source_word: וַיְמַהֲרוּ
  choice: झट से
  rationale: उनकी तुरंत प्रतिक्रिया और अवसर लपकने की तत्परता को सहज हिन्दी में व्यक्त करता है।
- source_word: וַיַּחְלְטוּ הֲמִמֶּנּוּ
  choice: उसके मुँह की बात पकड़ ली
  rationale: इब्रानी पद कठिन है, पर सम्भावित भाव यह है कि उन्होंने अहाब के कथन को तुरन्त पकड़कर अपने पक्ष में निर्णायक मान लिया।
- source_word: אָחִיךָ
  choice: आपका भाई
  rationale: शाब्दिक संबंध-संज्ञा को बनाए रखता है और दूतों द्वारा अहाब की कूटनीतिक शिष्टोक्ति का लाभ उठाना स्पष्ट करता है।
- source_word: בֹּאוּ קָחֻהוּ
  choice: जाओ, उसे ले आओ
  rationale: प्रसंग में आज्ञा का व्यावहारिक अर्थ बेन-हदद को अहाब के पास लाना है। इब्रानी בֹּאוּ का रूप पाठगत रूप से ‘आओ’ है, पर हिन्दी में अहाब से दूतों को दी गई आज्ञा के रूप में ‘जाओ’ अधिक स्वाभाविक है।
- source_word: וַיַּעֲלֵהוּ עַל הַמֶּרְכָּבָה
  choice: अहाब ने उसे रथ पर चढ़ा लिया
  rationale: हिफ़ील का कारणवाचक भाव सुरक्षित है; ‘चढ़ा लिया’ शारीरिक रूप से उठाने का अनावश्यक संकेत दिए बिना उसे अपने रथ पर स्थान देने का अर्थ बताता है।
- source_word: הַמֶּרְכָּבָה
  choice: रथ
  rationale: निश्चित उपपद वाले इब्रानी शब्द का स्वाभाविक हिन्दी रूप; प्रसंग से यह अहाब का रथ समझ में आता है।
