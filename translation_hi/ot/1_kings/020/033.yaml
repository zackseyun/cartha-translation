  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सहज कथात्मक रूप। अहाब का नाम दूसरी बार स्पष्टता के लिए रखा गया है, क्योंकि लगातार आने वाले पुल्लिंग सर्वनाम हिन्दी में कर्ता को अस्पष्ट कर सकते हैं। राजकीय संबोधन में ‘आपका’ प्रयुक्त है। सभी पादटिप्पणी-चिह्न मुख्य पाठ में क्रम से उपस्थित हैं।
