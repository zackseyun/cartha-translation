  register: आधुनिक मानक हिन्दी में आदरसूचक आज्ञार्थक रूप रखा गया है, क्योंकि प्रजा और पुरनिये राजा से बोल रहे हैं। ‘पुरनिये’ प्रशासनिक/सामुदायिक अगुओं के लिए परिचित बाइबलीय पद है।
