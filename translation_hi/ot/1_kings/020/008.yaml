  yaml_path: translation/ot/1_kings/020/008.yaml
  text: Then all the elders and all the people said to him[a], “Do not listen, and do not consent.”
translation:
  language: hi
  text: तब सभी बुज़ुर्गों और सभी लोगों ने उससे कहा, “मत सुनिए और सहमत मत होइए।”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मत मानिए और राज़ी मत होइए।” इब्रानी क्रियाओं का अर्थ सुनना/मानना (שׁמע) और इच्छुक होना/राज़ी होना (אבה) हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: तब ... ने ... कहा
  rationale: वय्यिक्तोल कथानक को आगे बढ़ाता है; ‘तब’ क्रमिक भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: אֵלָיו
  choice: उससे
  rationale: इब्रानी पाठ में सर्वनाम है, नाम नहीं; इसलिए पद की अभिव्यक्ति को बनाए रखा गया है।
- source_word: כָּל הַזְּקֵנִים
  choice: सभी पुरनियों
  rationale: यहाँ זְקֵנִים केवल वृद्ध पुरुषों के बजाय समुदाय के अगुओं को दर्शाता है; ‘पुरनिये’ बाइबलीय हिन्दी में इस पद का परिचित और गरिमापूर्ण रूप है।
- source_word: וְכָל הָעָם
  choice: और सभी लोगों
  rationale: עָם पुरनियों के साथ व्यापक जनसमुदाय को सूचित करता है।
- source_word: אַל תִּשְׁמַע
  choice: उसकी बात मत सुनिए
  rationale: שׁמע का अर्थ सुनना, बात मानना या आज्ञा मानना हो सकता है। प्रसंग में ‘बात सुनना’ इस अर्थ-विस्तार को हिन्दी में काफी हद तक सुरक्षित रखता है; ‘उसकी’ प्रसंग से स्पष्ट मांगकर्ता को इंगित करता है।
- source_word: וְלֹא תֹאבֶה
  choice: और सहमति मत दीजिए
  rationale: אבה इच्छा रखने, राज़ी होने अथवा सहमति देने का भाव रखता है; राजनीतिक मांग के प्रसंग में ‘सहमति देना’ स्वाभाविक है।
