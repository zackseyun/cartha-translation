base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/013.yaml
  text: 'And behold[a], a certain prophet came near to Ahab king of Israel and said, “Thus says Yahweh: Have you seen all this great multitude? Behold, I am giving it into your hand today, and you shall know that I am Yahweh.”'
translation:
  language: hi
  text: और देखो, एक नबी इस्राएल के राजा अहाब के पास आया और बोला, “याहवे यों कहते हैं, ‘क्या तुमने इस सारी विशाल सेना[a] को देखा है? देखो, आज मैं इसे तुम्हारे हाथ में सौंप रहा हूँ, और तुम जान जाओगे कि मैं याहवे हूँ।’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “इस सारे विशाल जनसमूह को” अथवा “इस विशाल दल को”; हिब्रू शब्द किसी बड़ी भीड़ या समूह को दर्शा सकता है और यहाँ शत्रु-सेना के लिए प्रयुक्त हुआ है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  choice: तभी देखो
  rationale: कथानक में अचानक घटित घटना और हिब्रू संकेतक की जीवंतता दोनों को सहज आधुनिक हिन्दी में रखता है।
- source_word: נָבִיא אֶחָד
  choice: एक नबी
  rationale: शाब्दिक अर्थ और किसी अनिर्दिष्ट व्यक्ति के कथात्मक परिचय—दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: נִגַּשׁ אֶל
  choice: के पास आया
  rationale: निकट आने के अर्थ को सामान्य और स्पष्ट हिन्दी में व्यक्त करता है।
- source_word: כֹּה אָמַר יְהוָה
  choice: याहवे यह कहते हैं
  rationale: मानक नबूवत-संदेश सूत्र को वर्तमानकालीन, गरिमापूर्ण और सुबोध हिन्दी में रखता है।
- source_word: הֲרָאִיתָ
  choice: क्या तुमने ... देखा है?
  rationale: प्रश्नवाचक पूर्ण क्रिया उस सामने उपस्थित सैन्य संकट को इंगित करती है जिसे अहाब देख चुका है।
- source_word: כָּל הֶהָמוֹן הַגָּדוֹל הַזֶּה
  choice: इस सारी विशाल सेना
  rationale: הָמוֹן का व्यापक अर्थ जनसमूह या विशाल दल है; प्रसंग में यह शत्रु-सेना है, इसलिए मुख्य पाठ में स्वाभाविक अर्थ रखा गया और व्यापक शब्दार्थ पादटिप्पणी में सुरक्षित किया गया।
- source_word: הִנְנִי נֹתְנוֹ
  choice: देखो, ... मैं इसे ... सौंप रहा हूँ
  rationale: हिब्रू की बलाघातपूर्ण तात्कालिकता और निश्चित आसन्न कार्य को बनाए रखता है।
- source_word: בְיָדְךָ
  choice: तुम्हारे हाथ में
  rationale: अधिकार या वश में कर देने के परिचित हिब्रू रूपक को हिन्दी में भी स्पष्ट रूप से बनाए रखता है।
- source_word: וְיָדַעְתָּ כִּי אֲנִי יְהוָה
  choice: और तुम जान जाओगे कि मैं याहवे हूँ
  rationale: दैवी कार्य के फलस्वरूप पहचान होने की परिणामात्मक शक्ति को बिना अतिरिक्त व्याख्या के व्यक्त करता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में व्यक्तिगत वाचा-नाम सीधे प्रयुक्त है; लिप्यंतरण उसे सामान्य पदवी में बदले बिना सुरक्षित रखता है।
- issue: וְיָדַעְתָּ כִּי אֲנִי יְהוָה में ‘जानने’ का आशय
  choice: तुम जान जाओगे कि मैं याहवे हूँ
  alternative: तुम याहवे की प्रभुता का अनुभव करके उसे स्वीकार करोगे
  rationale: मूल कथन पहचान, अनुभव और स्वीकार की संभावित गहराई रखता है; मुख्य पाठ इसे संक्षिप्त रखकर तनाव को व्याख्यात्मक विस्तार से नहीं सुलझाता।
translation_notes:
  register: आधुनिक मानक हिन्दी; कथन गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध है। ‘नबी’, ‘याहवे’ और ‘तुम्हारे हाथ में’ मूल पाठ की धार्मिक एवं रूपकात्मक बनावट को बनाए रखते हैं।
