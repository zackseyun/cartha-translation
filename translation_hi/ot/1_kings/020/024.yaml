lexical_decisions:
- source_word: וְאֶת הַדָּבָר הַזֶּה עֲשֵׂה
  choice: और यह काम कर
  rationale: अग्रस्थ कर्म और आज्ञार्थक क्रिया को स्वाभाविक हिन्दी में रखते हुए דָּבָר का अर्थ यहाँ कथन नहीं, काम या कार्रवाई लिया गया है।
- source_word: הָסֵר
  choice: हटा दे
  rationale: हिफ़ील आज्ञार्थक रूप किसी को उसके स्थान या दायित्व से हटाने का भाव देता है; यह अनुवाद पदच्युति की सीमा के बारे में अनावश्यक निर्णय नहीं करता।
- source_word: הַמְּלָכִים אִישׁ מִמְּקֹמוֹ
  choice: राजाओं को, हर एक को उसके स्थान से
  rationale: बहुवचन ‘राजाओं’ के बाद אִישׁ का वितरणात्मक अर्थ ‘हर एक’ से स्पष्ट होता है। ‘स्थान’ מָקוֹם के स्थान और नियुक्त पद—दोनों सम्भव भावों को खुला रखता है।
- source_word: וְשִׂים
  choice: और ... नियुक्त कर
  rationale: שׂים का मूल अर्थ ‘रखना’ है, पर अधिकारियों को प्रतिस्थापन के रूप में रखने के प्रशासनिक सन्दर्भ में ‘नियुक्त कर’ अधिक स्वाभाविक और स्पष्ट हिन्दी है।
- source_word: פַּחוֹת
  choice: राज्यपाल
  rationale: यह शब्द नियुक्त प्रशासनिक या प्रान्तीय अधिकारियों के लिए प्रयुक्त होता है। ‘राज्यपाल’ सामान्य पाठक के लिए स्पष्ट है और इसे केवल सैन्य पद तक सीमित नहीं करता।
- source_word: תַּחְתֵּיהֶם
  choice: उनकी जगह
  rationale: शाब्दिक रूप से ‘उनके नीचे’ सम्भव है, किन्तु यहाँ मुहावरे का आशय उनके बदले प्रतिस्थापन नियुक्त करना है।
