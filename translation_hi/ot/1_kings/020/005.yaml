base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/005.yaml
  text: 'The messengers returned and said[a], “Thus says Ben-hadad: ‘Though I sent to you, saying, “You shall give me your silver and your gold and your wives and your sons,”’”'
translation:
  language: hi
  text: 'तब दूत लौटकर आए और बोले, “बेन-हदद यह कहता है: ‘यद्यपि[a] मैंने तुम्हारे पास यह कहला भेजा था, “तुम अपनी चाँदी और अपना सोना, अपनी पत्नियाँ और अपने पुत्र मुझे दोगे,”’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “क्योंकि।” इब्रानी अव्यय כִּי के कई अर्थ हो सकते हैं; अगले पद में माँग के और कठोर हो जाने को ध्यान में रखकर यहाँ इसका अर्थ “यद्यपि” लिया गया है।
    reason: lexical_alternative
