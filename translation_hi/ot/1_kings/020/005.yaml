- source_word: לִי תִתֵּן
  choice: मुझे दे दोगे
  rationale: माँग/अनिवार्यता का भाव व्यक्त करता है और उद्धृत राजकीय आदेश के भीतर आधुनिक हिन्दी में स्वाभाविक है।
