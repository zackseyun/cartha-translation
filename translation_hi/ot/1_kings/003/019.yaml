  text: And this woman's son died in the night[b][a], because she lay on him.
translation:
  language: hi
  text: और इस स्त्री का बेटा रात में मर गया, क्योंकि वह उसके ऊपर लेट गई थी।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּמָת
  choice: मर गया
  rationale: मूּת का वय्यिक्तोल रूप कथा में बीती हुई घटना बताता है; हिंदी में ‘मर गया’ स्वाभाविक और सटीक है।
- source_word: בֶּן הָאִשָּׁה הַזֹּאת
  choice: इस स्त्री का बेटा
  rationale: इब्रानी पदबंध स्पष्ट रूप से ‘इस स्त्री का बेटा’ कहता है; लिंग-विशिष्ट ‘बेटा’ को बनाए रखा गया है।
- source_word: לָיְלָה
  choice: रात में
  rationale: यह समयसूचक प्रयोग है और मृत्यु कब हुई, यह बताता है; ‘रात में’ आधुनिक हिंदी में सहज है।
- source_word: אֲשֶׁר
  choice: क्योंकि
  rationale: संदर्भ में यह अगली क्रिया को बच्चे की मृत्यु का कारण बताने वाले उपवाक्य के रूप में जोड़ता है।
- source_word: שָׁכְבָה עָלָיו
  choice: वह उसके ऊपर लेट गई थी
  rationale: שׁכב के साथ עַל यहाँ बच्चे के ऊपर शारीरिक रूप से लेटने को व्यक्त करता है; पूर्वपूर्ण ‘लेट गई थी’ मृत्यु से पहले हुई क्रिया को स्वाभाविक हिंदी में स्पष्ट करता है।
