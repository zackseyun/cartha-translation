translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज कथात्मक शैली। इब्रानी में ‘सुबह’ और הִנֵּה की पुनरावृत्ति का प्रभाव यथासंभव रखा गया है। अनावश्यक पाद-टिप्पणी नहीं जोड़ी गई, क्योंकि प्रमुख अर्थगत सूक्ष्मताएँ मुख्य पाठ में स्वाभाविक रूप से व्यक्त हो जाती हैं।
