id: 1KI.3.21
reference: 1 Kings 3:21
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וָ/אָקֻ֥ם בַּ/בֹּ֛קֶר לְ/הֵינִ֥יק אֶת בְּנִ֖/י וְ/הִנֵּה מֵ֑ת וָ/אֶתְבּוֹנֵ֤ן אֵלָי/ו֙ בַּ/בֹּ֔קֶר וְ/הִנֵּ֛ה לֹֽא הָיָ֥ה בְנִ֖/י אֲשֶׁ֥ר יָלָֽדְתִּי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/003/021.yaml
  text: When I got up in the morning to nurse my son[a], behold, he was dead. But when I looked closely at him in the morning, behold, he was not my son[b], whom I had borne.
translation:
  language: hi
  text: मैं सुबह अपने बेटे को दूध पिलाने के लिए उठी, तो देखा कि वह मरा हुआ था। फिर सुबह जब मैंने उसे ध्यान से देखा, तो पाया कि वह मेरा वह बेटा नहीं था जिसे मैंने जन्म दिया था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וָאָקֻם
  choice: मैं ... उठी
  rationale: קום के प्रथम पुरुष एकवचन रूप को स्त्री वक्ता के अनुसार स्वाभाविक हिन्दी में व्यक्त किया गया है।
- source_word: בַּבֹּקֶר
  choice: सुबह
  rationale: इब्रानी में यह समय-सूचक पद दो बार आया है; कथा की गति और जोर बनाए रखने के लिए दोनों बार रखा गया है।
- source_word: לְהֵינִיק
  choice: दूध पिलाने के लिए
  rationale: ינק के हिफ़ील रूप का संदर्भगत अर्थ शिशु को स्तनपान कराना है; सामान्य आधुनिक हिन्दी में ‘दूध पिलाना’ सहज और स्पष्ट है।
- source_word: אֶת־בְּנִי
  choice: अपने बेटे को
  rationale: בֵּן के साथ प्रथम पुरुष प्रत्यय का विशिष्ट अर्थ ‘मेरा बेटा’ है; हिन्दी वाक्य-विन्यास में ‘अपने बेटे’ स्वाभाविक है।
- source_word: וְהִנֵּה
  choice: तो देखा कि / तो पाया कि
  rationale: הִנֵּה अचानक प्रत्यक्ष होने या बोध होने पर जोर देता है। दोनों occurrences को प्रसंगानुसार स्वाभाविक हिन्दी में अलग किंतु समान प्रभाव वाले पदों से व्यक्त किया गया है।
- source_word: מֵת
  choice: वह मरा हुआ था
  rationale: यह बालक की उस समय की अवस्था बताता है; ‘मरा हुआ था’ स्पष्ट और स्वाभाविक है।
- source_word: וָאֶתְבּוֹנֵן אֵלָיו
  choice: मैंने उसे ध्यान से देखा
  rationale: התבונן यहाँ सावधानी से देखने और पहचानने के लिए निरीक्षण करने का भाव रखता है।
- source_word: לֹא הָיָה בְנִי
  choice: वह मेरा ... बेटा नहीं था
  rationale: इब्रानी की व्यक्तिगत पुल्लिंग अभिव्यक्ति को बनाए रखा गया है, न कि बालक के लिए निर्जीव संकेत का प्रयोग किया गया है।
- source_word: אֲשֶׁר יָלָדְתִּי
  choice: जिसे मैंने जन्म दिया था
  rationale: ילד का प्रथम पुरुष रूप स्त्री द्वारा बच्चे को जन्म देने को दर्शाता है; पूर्ण पूर्वकाल उस घटना को पहचान के क्षण से पहले रखता है।
