  yaml_path: translation/ot/1_kings/003/013.yaml
  text: And I have also given you what you did not ask for[a], both riches and honor, so that there has been no man like you among the kings all your days.
translation:
  language: hi
  text: और जो तूने नहीं माँगा, वह भी मैंने तुझे दिया है—धन और सम्मान—ऐसा कि तेरे जीवन भर राजाओं में तेरे समान कोई पुरुष न हो।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “ऐसा कि तेरे जीवन भर राजाओं में तेरे समान कोई पुरुष नहीं हुआ।”
    reason: हिब्रू पूर्ण क्रिया לֹא הָיָה को प्रतिज्ञात्मक/भावी अर्थ के बजाय अधिक प्रत्यक्ष पूर्ण या भूत अर्थ में भी समझा जा सकता है।
