source:
  edition: WLC
  text: וַ/יֶּאֱהַ֤ב שְׁלֹמֹה֙ אֶת יְהוָ֔ה לָ/לֶ֕כֶת בְּ/חֻקּ֖וֹת דָּוִ֣ד אָבִ֑י/ו רַ֚ק בַּ/בָּמ֔וֹת ה֥וּא מְזַבֵּ֖חַ וּ/מַקְטִֽיר־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/003/003.yaml
  text: Solomon loved Yahweh[a], walking in the statutes of David his father; only[b], he was sacrificing and burning incense at the high places.
translation:
  language: hi
  text: सुलैमान यहवे से प्रेम करता था और अपने पिता दाऊद की विधियों के अनुसार चलता था; केवल[a] यही था कि वह ऊँचे स्थानों[b] पर बलि चढ़ाता और धूप जलाता था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “परन्तु वह ऊँचे स्थानों पर बलि चढ़ाता और धूप जलाता था।”
    reason: רַק को पूर्ववर्ती प्रशंसा पर सीमा लगाने वाले विरोधसूचक वाक्यांश के रूप में भी व्यक्त किया जा सकता है।
  - marker: b
    text: “ऊँचे स्थान” स्थानीय उपासना-स्थलों को कहते हैं, जो प्रायः ऊँची जगहों पर होते थे।
    reason: प्राचीन इस्राएली उपासना से जुड़ी सांस्कृतिक अभिव्यक्ति का अर्थ स्पष्ट करना।
lexical_decisions:
- source_word: וַיֶּאֱהַב
  choice: प्रेम करता था
  rationale: אהב का सीधा अर्थ प्रेम करना है। अपूर्ण भूतकालीन हिंदी अभिव्यक्ति यहाँ सुलैमान के स्थायी रुझान को स्वाभाविक ढंग से व्यक्त करती है।
- source_word: יְהוָה
  choice: यहवे
  rationale: परमेश्वर के व्यक्तिगत नाम יהוה को किसी उपाधि से बदलने के बजाय देवनागरी में लिप्यंतरित किया गया है।
- source_word: לָלֶכֶת בְּחֻקּוֹת
  choice: विधियों पर चलता था
  rationale: ‘चलना’ आचरण का बाइबलीय रूपक बनाए रखता है, और ‘विधियाँ’ חֻקּוֹת के निर्धारित नियमों के भाव को व्यक्त करता है। हिंदी में ‘विधियों पर चलना’ स्वाभाविक है।
- source_word: דָּוִד אָבִיו
  choice: अपने पिता दाऊद की
  rationale: यह हिंदी की स्वाभाविक संबंध-संरचना है और दाऊद को सुलैमान का पिता स्पष्ट रखती है।
- source_word: רַק
  choice: केवल
  rationale: רַק पहले दिए गए सकारात्मक मूल्यांकन पर सीमा लगाता है। ‘केवल’ उस तनाव को बनाए रखता है, बिना इसे पूर्ण निंदा या अनुमोदन में बदलने के।
- source_word: בַּבָּמוֹת
  choice: ऊँचे स्थानों पर
  rationale: במות स्थानीय उपासना-स्थलों के लिए प्रयुक्त पारिभाषिक अभिव्यक्ति है। शाब्दिक रूप के साथ सांस्कृतिक अर्थ पादटिप्पणी में स्पष्ट किया गया है।
- source_word: מְזַבֵּחַ
  choice: बलि चढ़ाता
  rationale: कृदंत आदतन या जारी क्रिया दिखाता है; ‘चढ़ाता’ हिंदी में उस पुनरावृत्त उपासना-क्रिया को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: וּמַקְטִיר
  choice: और धूप जलाता था
  rationale: उपासना के संदर्भ में קטר का हिफ़ील रूप धूप अथवा सुगंधित अर्पण जलाने को सूचित कर सकता है। ‘धूप जलाता’ स्पष्ट और प्रचलित हिंदी है, जबकि संदर्भगत व्यापकता को अनावश्यक रूप से नहीं बढ़ाता।
theological_decisions:
- issue: सुलैमान की उपासना का कथात्मक मूल्यांकन
  choice: वचन पहले यहवे के प्रति सुलैमान के प्रेम का सकारात्मक कथन करता है, फिर ऊँचे स्थानों पर उसकी उपासना से उस कथन को सीमित करता है।
  alternative: आरंभिक प्रशंसा को व्यंग्य या लगभग पूर्ण निंदा मानना; अथवा इस समय ऊँचे स्थानों की उपासना को पूरी तरह अनुमोदित मानना।
  rationale: वाक्य-संरचना में पहले प्रशंसा है और फिर רַק द्वारा सीमा लगाई गई है। अनुवाद इस वास्तविक धार्मिक तनाव को हल किए बिना सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिंदी का सरल, गरिमापूर्ण और सामान्य पाठकों के लिए बोधगम्य रूप अपनाया गया है। ‘यहवे’, ‘विधियाँ’, ‘बलि चढ़ाना’ और ‘धूप जलाना’ जैसे शब्द मूल के धार्मिक-सांस्कृतिक स्वर को बनाए रखते हैं। अर्धविराम प्रशंसा और उसके बाद आने वाली सीमा के निकट संबंध को दिखाता है।
