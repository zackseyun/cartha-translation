id: 1KI.3.11
reference: 1 Kings 3:11
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר אֱלֹהִ֜ים אֵלָ֗י/ו יַעַן֩ אֲשֶׁ֨ר שָׁאַ֜לְתָּ אֶת הַ/דָּבָ֣ר הַ/זֶּ֗ה וְ/לֹֽא שָׁאַ֨לְתָּ לְּ/ךָ֜ יָמִ֣ים רַבִּ֗ים וְ/לֹֽא שָׁאַ֤לְתָּ לְּ/ךָ֙ עֹ֔שֶׁר וְ/לֹ֥א שָׁאַ֖לְתָּ נֶ֣פֶשׁ אֹיְבֶ֑י/ךָ וְ/שָׁאַ֧לְתָּ לְּ/ךָ֛ הָבִ֖ין לִ/שְׁמֹ֥עַ מִשְׁפָּֽט־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/003/011.yaml
  text: And God said to him, “Because you have asked for this thing, and have not asked for yourself many days, nor have asked for yourself riches, nor have asked for the life of your enemies, but have asked for yourself understanding to hear justice,”
translation:
  language: hi
  text: तब परमेश्वर ने उससे कहा, “क्योंकि तूने यह बात माँगी है—अपने लिए न तो लंबी आयु माँगी, न धन माँगा, न अपने शत्रुओं के प्राण माँगे, बल्कि न्याय सुनने के लिए विवेक माँगा है—”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יָמִים רַבִּים
  choice: लंबी आयु
  rationale: शाब्दिक अर्थ ‘बहुत दिन’ है, पर इस संदर्भ में स्वाभाविक हिन्दी अर्थ दीर्घ जीवन या लंबी आयु है।
- source_word: נֶפֶשׁ אֹיְבֶיךָ
  choice: अपने शत्रुओं का प्राण
  rationale: נֶפֶשׁ यहाँ शत्रुओं के जीवन/प्राण को दर्शाता है; ‘प्राण’ मूल अभिव्यक्ति की ठोसता बनाए रखता है।
- source_word: הָבִין
  choice: विवेक
  rationale: यहाँ शब्द समझने और भेद करने की क्षमता की ओर संकेत करता है; ‘विवेक’ राजकीय न्याय के संदर्भ में स्वाभाविक है।
- source_word: לִשְׁמֹעַ מִשְׁפָּט
  choice: न्याय को समझने के लिए
  rationale: שׁמע का मूल अर्थ ‘सुनना’ है, पर न्यायिक प्रसंग में ध्यान देकर समझना और सही निर्णय करना अभिप्रेत है; हिन्दी में यह रूप अर्थ को स्पष्ट और स्वाभाविक रखता है।
theological_decisions:
- issue: מִשְׁפָּט का अर्थ
  choice: न्याय
  alternative: निर्णय / मुकदमा
  rationale: यह पद सुलैमान की न्याय करने की क्षमता से संबंधित है। ‘न्याय’ मूल शब्द के व्यापक नैतिक और न्यायिक अर्थ को बनाए रखता है, बिना इसे केवल किसी एक फैसले तक सीमित किए।
- issue: परमेश्वर के उत्तर का अधूरा वाक्य-विन्यास
  choice: अंत में दीर्घ डैश रखा गया
  alternative: वाक्य को स्वतंत्र रूप से पूर्ण कर देना
  rationale: इब्रानी वाक्य अगले पद में परमेश्वर की प्रतिज्ञा के साथ पूरा होता है; इसलिए पद 11 की निर्भर संरचना और तनाव को सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज और प्रत्यक्ष शैली। परमेश्वर द्वारा सुलैमान को संबोधन के अनुरूप एकवचन ‘तू’ रखा गया है। समानांतर निषेधों को ‘न तो… न… न… बल्कि’ से स्वाभाविक हिन्दी में व्यक्त किया गया है।
