base_translation:
  language: en
  yaml_path: translation/ot/1_kings/003/028.yaml
  text: And all Israel heard of the judgment that the king had rendered[a], and they feared the king[b], because they saw that the wisdom of God was within him to administer justice.
translation:
  language: hi
  text: और समस्त इस्राएल ने उस न्याय-निर्णय के विषय में सुना जो राजा ने दिया था, और वे राजा का भय मानने लगे[a], क्योंकि उन्होंने देखा कि न्याय करने के लिए[b] परमेश्वर की बुद्धि उसके भीतर थी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वे राजा का आदर करने लगे” अथवा “वे राजा के प्रति श्रद्धामिश्रित विस्मय से भर गए।” इब्रानी शब्द यहाँ भय, श्रद्धा या अधिकार को पहचानकर उत्पन्न विस्मय व्यक्त कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: या, “न्याय-निर्णय देने के लिए।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמְעוּ כָל יִשְׂרָאֵל
  choice: जब समस्त इस्राएल ने ... सुना
  rationale: सामूहिक राष्ट्रीय अभिव्यक्ति को बनाए रखते हुए हिन्दी में घटनाक्रम स्वाभाविक बनाया गया है।
- source_word: הַמִּשְׁפָּט אֲשֶׁר שָׁפַט הַמֶּלֶךְ
  choice: उस न्याय-निर्णय ... जो राजा ने दिया था
  rationale: मִשְׁפָּט और שׁפט की कानूनी अर्थवत्ता को स्पष्ट, स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וַיִּרְאוּ מִפְּנֵי הַמֶּלֶךְ
  choice: वे राजा से भय मानने लगे
  rationale: यह ירא का मूल भयार्थ बनाए रखता है, जबकि हिन्दी का ‘भय मानना’ प्रसंगानुसार श्रद्धामिश्रित भय या विस्मय के लिए भी खुला रहता है।
- source_word: חָכְמַת אֱלֹהִים בְּקִרְבּוֹ
  choice: परमेश्वर की बुद्धि उसके भीतर थी
  rationale: परमेश्वर का स्पष्ट उल्लेख और सुलैमान में विद्यमान बुद्धि की आंतरिकता—दोनों सुरक्षित रहते हैं।
- source_word: לַעֲשׂוֹת מִשְׁפָּט
  choice: न्याय करने के लिए
  rationale: इब्रानी की उद्देश्यसूचक रचना और व्यापक न्यायिक कार्य को निकटता से व्यक्त करता है।
theological_decisions:
- issue: חָכְמַת אֱלֹהִים में אֱלֹהִים का अनुवाद
  choice: परमेश्वर की बुद्धि
  alternative: ईश्वरीय बुद्धि
  rationale: मूल पाठ परमेश्वर का स्पष्ट संज्ञात्मक उल्लेख करता है; विशेषण में बदलने से यह प्रत्यक्ष संबंध धुंधला पड़ सकता है।
- issue: राजा के प्रति ירא की भाव-सीमा
  choice: भय मानने लगे
  alternative: राजा के प्रति श्रद्धामिश्रित विस्मय से भर गए
  rationale: मूल में भय, श्रद्धा और विस्मय की संभावित अर्थ-सीमा है। मुख्य पाठ निकट अर्थ रखता है और पादटिप्पणी इस वास्तविक अस्पष्टता को सुरक्षित करती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण कथात्मक शैली रखी गई है। ‘समस्त इस्राएल’, ‘न्याय-निर्णय’ और ‘परमेश्वर की बुद्धि’ मूल की सामूहिक, न्यायिक और धार्मिक भाषा को स्पष्ट रखते हैं; पादटिप्पणियाँ वास्तविक शाब्दिक विकल्प सुरक्षित करती हैं।
