base_translation:
  language: en
  yaml_path: translation/ot/1_kings/003/020.yaml
  text: She got up in the middle of the night and took my son from beside me while your servant was sleeping[a], and she laid him in her bosom, and laid her dead son in my bosom.
translation:
  language: hi
  text: वह आधी रात को उठी और जब आपकी दासी सो रही थी, तब मेरे बेटे को मेरे पास से उठा लिया। उसने उसे अपनी गोद[a] में लिटा दिया और अपने मरे हुए बेटे को मेरी गोद में लिटा दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘अपने वक्ष/छाती से लगे स्थान में’। इब्रानी शब्द חֵיק गोद अथवा वक्ष से लगे स्थान, दोनों को सूचित कर सकता है; यही शब्द आगे ‘मेरी गोद’ के लिए भी आया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּתוֹךְ הַלַּיְלָה
  choice: आधी रात को
  rationale: यह रात के मध्य भाग को व्यक्त करने वाला स्वाभाविक आधुनिक हिन्दी मुहावरा है।
- source_word: מֵאֶצְלִי
  choice: मेरे पास से
  rationale: אֵצֶל यहाँ सोती हुई स्त्री के निकट या बगल में होने का भाव देता है; ‘मेरे पास से’ सहज और संदर्भानुकूल है।
- source_word: וַאֲמָתְךָ
  choice: आपकी दासी
  rationale: राजा के सामने स्त्री का आत्मविनयी संबोधन है; स्त्रीलिंग और दरबारी विनम्रता दोनों सुरक्षित रहते हैं।
- source_word: יְשֵׁנָה
  choice: सो रही थी
  rationale: यह उस समय जारी पृष्ठभूमिगत अवस्था को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וַתַּשְׁכִּיבֵהוּ / הִשְׁכִּיבָה
  choice: लिटा लिया / लिटा दिया
  rationale: שׁכב के हिफ़ील रूप का मूल भाव किसी को लिटाना है; हिन्दी में प्रसंग के अनुसार ‘लिटा लिया’ और ‘लिटा दिया’ गंतव्य तथा क्रिया का परिणाम स्पष्ट करते हैं।
- source_word: בְּחֵיקָהּ / בְחֵיקִי
  choice: अपनी गोद में / मेरी गोद में
  rationale: חֵיק गोद या वक्ष से लगे निकट स्थान को सूचित कर सकता है। ‘गोद’ आधुनिक हिन्दी में स्वाभाविक है और बच्चे को अपने शरीर के निकट रखने का मातृ-संदर्भ बनाए रखता है।
- source_word: בְּנָהּ הַמֵּת
  choice: अपने मरे हुए बेटे
  rationale: הַמֵּת यहाँ ‘बेटे’ का विशेषण है; ‘मरा हुआ बेटा’ अर्थ को सीधे और स्वाभाविक रूप से व्यक्त करता है।
