source:
  edition: WLC
  text: וַ/תֹּ֣אמֶר הָ/אִשָּׁה֩ אֲשֶׁר בְּנָ֨/הּ הַ/חַ֜י אֶל הַ/מֶּ֗לֶךְ כִּֽי נִכְמְר֣וּ רַחֲמֶי/הָ֮ עַל בְּנָ/הּ֒ וַ/תֹּ֣אמֶר בִּ֣י אֲדֹנִ֗/י תְּנוּ לָ/הּ֙ אֶת הַ/יָּל֣וּד הַ/חַ֔י וְ/הָמֵ֖ת אַל תְּמִיתֻ֑/הוּ וְ/זֹ֣את אֹמֶ֗רֶת גַּם לִ֥/י גַם לָ֛/ךְ לֹ֥א יִהְיֶ֖ה גְּזֹֽרוּ־־־־׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/003/026.yaml
  text: Then the woman whose son was alive said to the king[a], because her compassion was stirred for her son, and she said, "Please, my lord, give her the living child, and do not put him to death." But the other said, "It shall be neither mine nor yours[b]; cut him in two."
translation:
  language: hi
  text: तब जिस स्त्री का बेटा जीवित था, उसने राजा से कहा—क्योंकि अपने बेटे के लिए उसकी ममता उमड़ पड़ी थी[a]—“हे मेरे स्वामी, कृपा करके जीवित बच्चे को उसी को दे दीजिए; उसे किसी भी हाल में मत मारिए।” पर दूसरी स्त्री ने कहा, “वह न मेरा होगा, न तुम्हारा; उसके दो टुकड़े कर दीजिए।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इब्रानी मुहावरा: “अपने बेटे के लिए उसकी करुणा गर्म हो उठी”; यह तीव्र मातृ-ममता और दया व्यक्त करता है।'
    reason: cultural_note
lexical_decisions:
- source_word: נִכְמְרוּ רַחֲמֶיהָ
  choice: उसकी ममता उमड़ पड़ी थी
  rationale: यह इब्रानी मुहावरा भीतर से जाग उठी तीव्र करुणा और मातृ-स्नेह को व्यक्त करता है। आधुनिक हिन्दी में यह चयन भाव की तीव्रता को स्वाभाविक ढंग से रखता है।
- source_word: בִּי אֲדֹנִי
  choice: हे मेरे स्वामी, कृपा करके
  rationale: בִּי विनती का उद्गार है; यह रूप स्त्री की आदरपूर्ण और अत्यावश्यक प्रार्थना को सहज हिन्दी में व्यक्त करता है।
- source_word: הַיָּלוּד הַחַי
  choice: जीवित बच्चे
  rationale: יַלוּד का आशय जन्मा हुआ बच्चा है। ‘बच्चा’ आयु को अनावश्यक रूप से अधिक निश्चित किए बिना प्रसंगानुकूल और सहज है।
- source_word: וְהָמֵת אַל תְּמִיתֻהוּ
  choice: उसे किसी भी हाल में मत मरवाइए
  rationale: क्रिया की इब्रानी रचना निषेध पर विशेष बल देती है। ‘किसी भी हाल में’ उस तीव्र निषेध को दर्शाता है, और कारक रूप राजा द्वारा दंड दिलाए जाने के प्रसंग के अनुकूल है।
- source_word: וְזֹאת אֹמֶרֶת
  choice: पर दूसरी स्त्री ने कहा
  rationale: शाब्दिक ‘और यह कह रही थी’ के स्थान पर यह रूप दोनों स्त्रियों के बीच स्पष्ट विरोध को स्वाभाविक हिन्दी में दिखाता है।
- source_word: גַּם לִי גַם לָךְ לֹא יִהְיֶה
  choice: वह न मेरा होगा, न तुम्हारा
  rationale: निहित कर्ता जीवित लड़का है; पुल्लिंग ‘वह’ और ‘होगा’ इब्रानी के आशय तथा स्वामित्व के विवाद को बनाए रखते हैं।
- source_word: גְּזֹרוּ
  choice: उसके दो टुकड़े कर दो
  rationale: आज्ञा संक्षिप्त और क्रूर है। पिछले पद में दिए गए संदर्भ के आधार पर ‘दो टुकड़े’ स्पष्ट करना हिन्दी में अर्थपूर्ण है।
