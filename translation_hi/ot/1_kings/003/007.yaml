source:
  edition: WLC
  text: וְ/עַתָּה֙ יְהוָ֣ה אֱלֹהָ֔/י אַתָּה֙ הִמְלַ֣כְתָּ אֶֽת עַבְדְּ/ךָ֔ תַּ֖חַת דָּוִ֣ד אָבִ֑/י וְ/אָֽנֹכִי֙ נַ֣עַר קָטֹ֔ן לֹ֥א אֵדַ֖ע צֵ֥את וָ/בֹֽא־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/003/007.yaml
  text: And now[a], O Yahweh my God, you have made your servant king in place of David my father, though I am a little child[b]; I do not know how to go out or come in.
translation:
  language: hi
  text: और अब, हे याहवे मेरे परमेश्वर, तूने अपने दास को मेरे पिता दाऊद के स्थान पर राजा बनाया है; पर मैं तो छोटा बालक[a] हूँ और नहीं जानता कि कैसे बाहर जाऊँ और भीतर आऊँ।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “कम उम्र का युवक”; यह इब्रानी अभिव्यक्ति विनम्र आत्म-वर्णन है, जो सुलैमान की युवावस्था और अनुभवहीनता पर बल देती है।
    reason: lexical_alternative
  - marker: b
    text: “बाहर जाना और भीतर आना” एक इब्रानी मुहावरा है, जिसका आशय अपने दायित्व निभाने से है—यहाँ विशेष रूप से सार्वजनिक नेतृत्व और शासन के दायित्वों से।
    reason: cultural_note
lexical_decisions:
- source_word: יְהוָה
  choice: यहोवा
  rationale: परमेश्वर के व्यक्तिगत वाचा-नाम को सामान्य आधुनिक हिन्दी में प्रचलित लिप्यंतरण ‘यहोवा’ से व्यक्त किया गया है, न कि उपाधि से प्रतिस्थापित किया गया।
- source_word: הִמְלַכְתָּ אֶת־עַבְדְּךָ
  choice: तूने अपने दास को ... राजा बनाया है
  rationale: हिफ़ील रूप के कारणवाचक अर्थ को स्वाभाविक हिन्दी में स्पष्ट रखता है; ‘दास’ प्रार्थना में सुलैमान की विनम्र आत्म-पहचान को बनाए रखता है।
- source_word: תַּחַת דָּוִד אָבִי
  choice: मेरे पिता दाऊद के स्थान पर
  rationale: תַּחַת यहाँ राजकीय उत्तराधिकार सूचित करता है; ‘के स्थान पर’ इसका सीधा और स्वाभाविक हिन्दी रूप है।
- source_word: נַעַר קָטֹן
  choice: छोटा बालक
  rationale: यह विनम्र आत्म-वर्णन आयु और अनुभवहीनता पर बल देता है। ‘बालक’ मूल की व्यापक अर्थ-सीमा को पूरी तरह निश्चित नहीं करता, इसलिए विकल्प पादटिप्पणी में दिया गया है।
- source_word: לֹא אֵדַע צֵאת וָבֹא
  choice: नहीं जानता कि कैसे बाहर जाऊँ और भीतर आऊँ
  rationale: मूल मुहावरे की ठोस भाषा को मुख्य पाठ में रखा गया है और उसके शासकीय कर्तव्यों से जुड़े भाव को पादटिप्पणी में समझाया गया है। וָ का संयोजक अर्थ ‘और’ से व्यक्त किया गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: मूल पाठ में व्यक्तिगत ईश्वरीय नाम है। हिन्दी पाठकों के बीच पहचाने जाने वाले ‘यहोवा’ से नाम को नाम के रूप में रखा गया है; उसे केवल ‘प्रभु’ उपाधि में नहीं बदला गया।
- issue: सुलैमान के आत्म-वर्णन की आयु-संबंधी अस्पष्टता
  choice: छोटा बालक, साथ में पादटिप्पणी
  alternative: युवा; बहुत कम उम्र का
  rationale: נַעַר קָטֹן शाब्दिक बाल्यावस्था का दावा भी लग सकता है, पर प्रसंग में विनम्रता और अनुभवहीनता प्रमुख हैं। मुख्य पाठ मूल बिंब रखता है और पादटिप्पणी अर्थ-सीमा बताती है।
- issue: ‘बाहर जाना और भीतर आना’ का अर्थ
  choice: मुहावरे को मुख्य पाठ में बनाए रखना
  alternative: शासन करना; अपने कर्तव्य निभाना; लोगों का नेतृत्व करना
  rationale: मूल इब्रानी स्पष्ट रूप से ‘नेतृत्व’ क्रिया नहीं कहता। इसलिए व्याख्यात्मक अर्थ को मुख्य पाठ में डालने के बजाय पादटिप्पणी में रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और प्रार्थना-सुलभ रखी गई है। परमेश्वर को संबोधित करते हुए ‘तू’ का प्रयोग निकटता और पारंपरिक बाइबलीय हिन्दी के अनुरूप है। मुख्य पाठ में मूल इब्रानी मुहावरा सुरक्षित है; आवश्यक व्याख्या पादटिप्पणियों में दी गई है।
