translation:
  language: hi
  text: तब दो वेश्याएँ राजा के पास आईं और उसके सामने खड़ी हुईं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אָז
  choice: तब
  rationale: यह कालसूचक कथात्मक चिह्न अगले प्रसंग को आरम्भ करता है और घटनाक्रम की क्रमिकता बनाए रखता है।
- source_word: תָּבֹאנָה
  choice: आईं
  rationale: בוא का स्त्रीलिंग बहुवचन रूप यहाँ बीते कथानक में राजा की ओर आने की क्रिया बताता है।
- source_word: שְׁתַּיִם נָשִׁים זֹנוֹת
  choice: दो वेश्याएँ
  rationale: हिब्रू में זֹנוֹת स्त्रियों का सीधा विशेषणात्मक/संज्ञात्मक वर्णन है; आधुनिक हिन्दी में ‘दो वेश्याएँ’ संक्षिप्त, स्वाभाविक और अर्थतः स्पष्ट है।
- source_word: אֶל הַמֶּלֶךְ
  choice: राजा के पास
  rationale: אֶל राजा की ओर गति दर्शाता है; ‘के पास’ हिन्दी में उस दिशात्मक अर्थ को स्वाभाविक रूप से व्यक्त करता है।
- source_word: וַתַּעֲמֹדְנָה
  choice: और ... खड़ी हुईं
  rationale: עמד की सामान्य क्रिया को बिना अदालती अर्थ बढ़ाए कथात्मक क्रम में प्रस्तुत किया गया है।
- source_word: לְפָנָיו
  choice: उसके सामने
  rationale: यह प्रचलित हिब्रू मुहावरा किसी अधिकारी या न्यायाधीश की उपस्थिति में खड़े होने को दर्शाता है; ‘उसके सामने’ सीधा और स्वाभाविक है।
