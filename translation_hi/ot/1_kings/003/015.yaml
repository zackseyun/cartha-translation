  edition: WLC
  text: וַ/יִּקַ֥ץ שְׁלֹמֹ֖ה וְ/הִנֵּ֣ה חֲל֑וֹם וַ/יָּב֨וֹא יְרוּשָׁלִַ֜ם וַֽ/יַּעֲמֹ֣ד לִ/פְנֵ֣י אֲר֣וֹן בְּרִית אֲדֹנָ֗/י וַ/יַּ֤עַל עֹלוֹת֙ וַ/יַּ֣עַשׂ שְׁלָמִ֔ים וַ/יַּ֥עַשׂ מִשְׁתֶּ֖ה לְ/כָל עֲבָדָֽי/ו׀׀־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/003/015.yaml
  text: Then Solomon awoke[a], and behold, it was a dream. And he came to Jerusalem and stood before the ark of the covenant of the LORD, and offered up burnt offerings and made peace offerings, and made a feast for all his servants.
translation:
  language: hi
  text: तब सुलैमान जाग उठा, और देखो, वह एक स्वप्न था। फिर वह यरूशलेम आया और प्रभु की वाचा के संदूक के सामने खड़ा हुआ। उसने होमबलियाँ चढ़ाईं, मेलबलियाँ[a] अर्पित कीं और अपने सभी सेवकों के लिए भोज दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “शांति-बलियाँ”; संभवतः यह बलि के सहभागी भोज में साझा संगति पर बल देता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַץ
  choice: जाग उठा
  rationale: यह क्रिया नींद से जागने को व्यक्त करती है; ‘जाग उठा’ हिंदी कथात्मक शैली में स्वाभाविक है।
- source_word: וְהִנֵּה חֲלוֹם
  choice: और देखा कि यह एक स्वप्न था
  rationale: הִנֵּה अचानक हुए बोध की ओर ध्यान खींचता है। हिंदी में ‘देखा कि’ उस अनुभूति को स्वाभाविक ढंग से व्यक्त करता है, जबकि ‘यह एक स्वप्न था’ संक्षिप्त इब्रानी वाक्य का स्पष्ट रूप है।
- source_word: וַיָּבוֹא יְרוּשָׁלִַם
  choice: वह यरूशलेम आया
  rationale: בוא का सीधा अर्थ ‘आना/प्रवेश करना’ है। ‘लौटा’ प्रसंग से संभव है, पर मूल पाठ में स्पष्ट रूप से नहीं कहा गया।
- source_word: וַיַּעֲמֹד לִפְנֵי
  choice: के सामने खड़ा हुआ
  rationale: यह पदबंध किसी की उपस्थिति में खड़े होने का सामान्य इब्रानी मुहावरा है; हिंदी रूप सीधा और स्वाभाविक है।
- source_word: אֲרוֹן בְּרִית אֲדֹנָי
  choice: प्रभु की वाचा का संदूक
  rationale: यह रूप संबंधसूचक इब्रानी पद-श्रृंखला को स्पष्ट हिंदी में रखता है; दिए गए स्रोत में אֲדֹנָי के लिए ‘प्रभु’ उपयुक्त शीर्षक है।
- source_word: עֹלוֹת
  choice: होमबलियाँ
  rationale: यह उन बलियों का स्थापित हिंदी नाम है जो वेदी पर पूर्णतः जलाई जाती थीं।
- source_word: וַיַּעַל
  choice: चढ़ाईं
  rationale: עלה के हिफ़ील रूप का बलि-संदर्भ में अर्थ वेदी पर अर्पित करना है; ‘चढ़ाईं’ हिंदी में प्रचलित और संक्षिप्त है।
- source_word: שְׁלָמִים
  choice: मेलबलियाँ
  rationale: यह बलि-श्रेणी शांति, संपूर्णता और सहभागी संगति से जुड़ी है। ‘मेलबलियाँ’ हिंदी में अर्थपूर्ण है, पर वैकल्पिक ‘शांति-बलियाँ’ को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: מִשְׁתֶּה
  choice: भोज
  rationale: यह शब्द उत्सवी दावत अथवा पीने-खाने के भोज को दर्शाता है; ‘भोज’ वर्तमान हिंदी में स्वाभाविक है।
- source_word: לְכָל עֲבָדָיו
  choice: अपने सभी सेवकों के लिए
  rationale: עֲבָדִים व्यापक रूप से राजा की सेवा में रहने वालों को दर्शा सकता है। ‘सेवक’ सीधा अर्थ रखता है और इसे केवल अधिकारियों तक सीमित नहीं करता।
theological_decisions:
- issue: אֲדֹנָי में ईश्वरीय उपाधि का अनुवाद
  choice: प्रभु
  alternative: यहोवा / परमप्रभु
  rationale: प्रदान किए गए इब्रानी स्रोत में स्वरूप אֲדֹנָי है, इसलिए उसे उपाधि ‘प्रभु’ के रूप में अनूदित किया गया है; यहाँ יהוה को मानकर उसका विशिष्ट नाम आरोपित नहीं किया गया।
- issue: שְׁלָמִים की बलि-श्रेणी
  choice: मेलबलियाँ
  alternative: शांति-बलियाँ
  rationale: ‘मेलबलि’ इस बलि से जुड़े संबंध और सहभागी भोज के भाव को सहज हिंदी में व्यक्त करती है, जबकि ‘शांति-बलि’ उसके शब्द-संबंध को अधिक निकटता से दिखाती है; विकल्प पादटिप्पणी में दिया गया है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। बलि-संबंधी स्थापित शब्दावली का प्रयोग किया गया है और कथात्मक क्रियाक्रम को छोटे, स्पष्ट वाक्यों में प्रस्तुत किया गया है।
