base_translation:
  language: en
  yaml_path: translation/ot/1_kings/003/004.yaml
  text: And the king went to Gibeon to sacrifice there[a], for that was the great high place. Solomon offered a thousand burnt offerings on that altar.
translation:
  language: hi
  text: और राजा गिबोन में बलि चढ़ाने गया, क्योंकि वह प्रमुख ऊँचा स्थान[a] था। सुलैमान ने उस वेदी पर एक हज़ार होमबलियाँ चढ़ाईं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “बड़ा ऊँचा स्थान।” इब्रानी विशेषण आकार में बड़ा या महत्त्व में प्रमुख—दोनों अर्थ दे सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ הַמֶּלֶךְ
  choice: और राजा ... गया
  rationale: सामान्य इब्रानी कथात्मक रूप है; आधुनिक हिन्दी में साधारण भूतकाल स्वाभाविक है।
- source_word: גִּבְעֹנָה
  choice: गिबोन
  rationale: स्थान-नाम पर दिशासूचक ה गति को प्रकट करता है; हिन्दी में ‘गिबोन गया’ वही अर्थ देता है।
- source_word: לִזְבֹּחַ
  choice: बलि चढ़ाने के लिए
  rationale: זבח सामान्य रूप से बलिदान करने की क्रिया बताता है; यह अभिव्यक्ति सहज और सटीक हिन्दी है।
- source_word: הַבָּמָה הַגְּדוֹלָה
  choice: प्रमुख ऊँचा स्थान
  rationale: במה के पारंपरिक ऐतिहासिक-धार्मिक अर्थ को ‘ऊँचा स्थान’ सुरक्षित रखता है। גדולה आकार में बड़ा या महत्त्व में प्रमुख हो सकता है; संदर्भ में प्रमुखता अधिक स्वाभाविक है, और विकल्प पाद-टिप्पणी में दिया गया है।
- source_word: אֶלֶף עֹלוֹת
  choice: एक हज़ार होमबलियाँ
  rationale: עֹלוֹת विशेष रूप से पूरी तरह जलाई जाने वाली भेंटों को दर्शाता है; हिन्दी बाइबलीय शब्द ‘होमबलि’ इस भेद को बनाए रखता है।
- source_word: יַעֲלֶה שְׁלֹמֹה
  choice: सुलैमान ने ... चढ़ाईं
  rationale: עלה का हिफ़ील होमबलियों के साथ ‘चढ़ाना’ अर्थ देता है। इस कथात्मक संदर्भ में अपूर्ण रूप को साधारण भूतकाल मानना अनावश्यक अभ्यस्त अर्थ जोड़ने से बचाता है।
- source_word: עַל הַמִּזְבֵּחַ הַהוּא
  choice: उस वेदी पर
  rationale: संबंधबोधक और संकेतवाचक दोनों को स्वाभाविक आधुनिक हिन्दी में सुरक्षित रखता है।
theological_decisions:
- issue: मन्दिर-निर्माण से पहले की उपासना के संदर्भ में בָּמָה का अनुवाद
  choice: ऊँचा स्थान
  alternative: पूजा-स्थल
  rationale: ‘ऊँचा स्थान’ इस विशिष्ट धार्मिक स्थल के ऐतिहासिक अर्थ और ऐसे स्थलों पर उपासना से जुड़ा शास्त्रीय तनाव बनाए रखता है; सामान्य ‘पूजा-स्थल’ उस तनाव को नरम कर देगा।
- issue: הַגְּדוֹלָה में आकार और प्रतिष्ठा की अस्पष्टता
  choice: प्रमुख
  alternative: बड़ा
  rationale: गिबोन की धार्मिक प्रतिष्ठा संदर्भ में ‘प्रमुख’ का समर्थन करती है, पर विशेषण आकार की महानता भी बता सकता है; इसलिए उस संभावना को पाद-टिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सुबोध रखी गई है। ‘ऊँचा स्थान’, ‘वेदी’ और ‘होमबलि’ जैसे स्थापित धार्मिक शब्द मूल पाठ के विशिष्ट अर्थ को बनाए रखते हैं।
