source:
  edition: WLC
  text: וַ/יֹּ֥אמֶר הַ/מֶּ֖לֶךְ קְח֣וּ לִ/י חָ֑רֶב וַ/יָּבִ֥אוּ הַ/חֶ֖רֶב לִ/פְנֵ֥י הַ/מֶּֽלֶךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/003/024.yaml
  text: Then the king said, “Bring me a sword.” So they brought the sword before the king.
translation:
  language: hi
  text: तब राजा ने कहा, “मेरे लिए एक तलवार लाओ।” तब वे तलवार राजा के सामने ले आए।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: तब ... ने कहा
  rationale: वाव-क्रमिक कथा को आगे बढ़ाता है; ‘तब’ उसके क्रमिक बल को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: הַמֶּלֶךְ
  choice: राजा
  rationale: निश्चित संज्ञा का हिन्दी में प्रसंगानुकूल और स्वाभाविक रूप; हिन्दी में यहाँ अलग निश्चित उपपद आवश्यक नहीं है।
- source_word: קְחוּ לִי
  choice: मेरे लिए ... लाओ
  rationale: לקח का मूल अर्थ ‘लेना’ है, पर इस प्रसंग में आज्ञा का आशय किसी वस्तु को मँगाकर वक्ता के पास लाना है। ‘मेरे लिए ... लाओ’ לִי को भी स्पष्ट रखता है।
- source_word: חָרֶב
  choice: एक तलवार
  rationale: पहली बार यह संज्ञा बिना निश्चित उपपद के आई है; ‘एक तलवार’ उसकी अनिश्चितता को स्वाभाविक हिन्दी में दर्शाता है।
- source_word: וַיָּבִאוּ
  choice: तब वे ... ले आए
  rationale: बहुवचन क्रिया और कथा की अगली कार्रवाई को व्यक्त करता है। ‘वे’ मूल में निहित बहुवचन कर्ता को बनाए रखता है, जिसकी पहचान नहीं बताई गई।
- source_word: הַחֶרֶב
  choice: तलवार
  rationale: दूसरी बार निश्चित रूप पहले माँगी गई तलवार की ओर लौटता है; हिन्दी में पुनरुक्त ‘तलवार’ स्वयं उस संदर्भ को स्वाभाविक रूप से निश्चित बनाती है।
- source_word: לִפְנֵי הַמֶּלֶךְ
  choice: राजा के सामने
  rationale: राजदरबारी कथानक में לִפְנֵי का सीधा, स्वाभाविक और गरिमापूर्ण हिन्दी रूप।
