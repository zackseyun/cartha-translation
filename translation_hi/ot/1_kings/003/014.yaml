revisions:
- from: और यदि तुम मेरे मार्गों पर चलोगे, और मेरी विधियों और आज्ञाओं का पालन करोगे, जैसे तुम्हारे पिता दाऊद चले थे, तो मैं तुम्हारी आयु बढ़ाऊँगा।
  to: और यदि तुम मेरे मार्गों पर चलोगे, मेरी विधियों और आज्ञाओं का पालन करते हुए, जैसे तुम्हारे पिता दाऊद चलते थे, तो मैं तुम्हारी आयु बढ़ाऊँगा।
  rationale: 'The revision preserves the Hebrew conditional promise and its ethical metaphor while making the relation of obedience to walking explicit in natural modern Hindi. No footnote is required: “आयु बढ़ाऊँगा” clearly conveys the Hebrew idiom ‘lengthen your days.’'
