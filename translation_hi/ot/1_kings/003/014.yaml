reference: 1 Kings 3:14
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/אִ֣ם תֵּלֵ֣ךְ בִּ/דְרָכַ֗/י לִ/שְׁמֹ֤ר חֻקַּ/י֙ וּ/מִצְוֺתַ֔/י כַּ/אֲשֶׁ֥ר הָלַ֖ךְ דָּוִ֣יד אָבִ֑י/ךָ וְ/הַאַרַכְתִּ֖י אֶת יָמֶֽי/ךָ׀־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/003/014.yaml
  text: And if you walk in my ways[a], keeping my statutes and my commandments, as David your father walked, then I will lengthen your days.
translation:
  language: hi
  text: और यदि तुम मेरे मार्गों पर चलोगे, मेरी विधियों और आज्ञाओं का पालन करते हुए, जैसे तुम्हारे पिता दाऊद चलते थे, तो मैं तुम्हारी आयु बढ़ाऊँगा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאִם
  choice: और यदि
  rationale: संयोजक और शर्तसूचक अव्यय पिछले कथन से प्रवाह बनाए रखते हुए शर्त आरम्भ करते हैं।
- source_word: תֵּלֵךְ בִּדְרָכַי
  choice: तुम मेरे मार्गों पर चलोगे
  rationale: यह वाचा-संबंधी नैतिक रूपक है; ‘मार्गों पर चलना’ आधुनिक हिन्दी में समझने योग्य रहते हुए मूल रूपक को सुरक्षित रखता है।
- source_word: לִשְׁמֹר
  choice: पालन करोगे
  rationale: यह परमेश्वर के मार्गों पर चलने का व्यावहारिक आशय बताता है; हिन्दी में नियमों और आज्ञाओं के साथ ‘पालन करना’ स्वाभाविक है।
- source_word: חֻקַּי וּמִצְוֺתַי
  choice: मेरी विधियों और आज्ञाओं
  rationale: ‘विधियाँ’ और ‘आज्ञाएँ’ दोनों अलग वाचा-संबंधी कानूनी पदों का भेद बनाए रखते हैं।
- source_word: כַּאֲשֶׁר הָלַךְ
  choice: जैसे ... चले थे
  rationale: तुलना और पहले प्रयुक्त ‘चलना’ क्रिया की प्रतिध्वनि दोनों सुरक्षित रहती हैं।
- source_word: דָּוִיד אָבִיךָ
  choice: तुम्हारे पिता दाऊद
  rationale: यह आधुनिक हिन्दी का स्वाभाविक पदक्रम है और सम्बन्ध को स्पष्ट रखता है।
- source_word: וְהַאַרַכְתִּי אֶת יָמֶיךָ
  choice: तो मैं तुम्हारी आयु बढ़ाऊँगा
  rationale: शाब्दिक ‘तुम्हारे दिन लम्बे करूँगा’ का आशय जीवन की अवधि बढ़ाना है; ‘आयु बढ़ाऊँगा’ वर्तमान हिन्दी में स्वाभाविक और सटीक है।
theological_decisions:
- issue: वाचा की आज्ञाकारिता से जुड़ी दीर्घायु की सशर्त प्रतिज्ञा
  choice: शर्त और उसके परिणाम को सीधे रूप में प्रस्तुत किया गया है।
  alternative: इसे बिना शर्त राजवंशीय प्रतिज्ञा या केवल सामान्य आशीष के रूप में कहना।
  rationale: इब्रानी पाठ स्पष्टतः सुलैमान की आज्ञाकारिता पर आधारित शर्त रखता है और उसके परिणामस्वरूप बढ़ी हुई आयु की प्रतिज्ञा करता है; अनुवाद इस तनाव को न घटाता है, न बाद की धर्मवैज्ञानिक श्रेणियाँ जोड़ता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘मार्गों पर चलना’ मूल नैतिक रूपक को बनाए रखता है, जबकि ‘आयु बढ़ाऊँगा’ इब्रानी मुहावरे का स्वाभाविक हिन्दी रूप है।
