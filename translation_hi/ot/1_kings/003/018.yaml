  yaml_path: translation/ot/1_kings/003/018.yaml
  text: And on the third day after I gave birth[a], this woman also gave birth. And we were together; there was no stranger with us in the house, only the two of us were in the house.
translation:
  language: hi
  text: मेरे बच्चे को जन्म देने के तीसरे दिन, इस स्त्री ने भी बच्चे को जन्म दिया। हम साथ थीं; घर में हमारे साथ कोई बाहरी व्यक्ति[a] नहीं था। हम दोनों के सिवा घर में और कोई नहीं था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “कोई पराया व्यक्ति।” इब्रानी शब्द ऐसे व्यक्ति को सूचित कर सकता है जो उस समूह या घराने का सदस्य न हो।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בַּיּוֹם הַשְּׁלִישִׁי לְלִדְתִּי
  choice: मेरे बच्चा जनने के तीसरे दिन
  rationale: इब्रानी कथात्मक सूत्र को हिंदी में अनावश्यक रूप से ‘और ऐसा हुआ’ कहकर बोझिल न बनाते हुए समय-संबंध को स्वाभाविक ढंग से व्यक्त किया गया है। לְ के साथ infinitive construct और प्रथम पुरुष प्रत्यय यहाँ वक्ता के प्रसव को समय का आरंभ-बिंदु बनाते हैं।
- source_word: וַתֵּלֶד גַּם הָאִשָּׁה הַזֹּאת
  choice: इस स्त्री ने भी बच्चा जना
  rationale: הַזֹּאת के संकेतात्मक और न्यायालयीन संदर्भ में कुछ तीखे भाव को ‘इस स्त्री’ सुरक्षित रखता है; גַּם के लिए ‘भी’ रखा गया है।
- source_word: וַאֲנַחְנוּ יַחְדָּו
  choice: हम साथ-साथ थीं
  rationale: יַחְדָּו का सीधा अर्थ ‘साथ’ है। दोनों वक्ताओं के स्त्री होने के कारण हिंदी में स्त्रीलिंग ‘थीं’ स्वाभाविक है; अकेले होने की बात अगली पंक्ति स्पष्ट करती है।
- source_word: אֵין זָר אִתָּנוּ בַּבַּיִת
  choice: घर में हमारे साथ कोई पराया व्यक्ति नहीं था
  rationale: זָר केवल किसी भी तीसरे व्यक्ति को नहीं, बल्कि समूह या घराने से संबंध न रखने वाले व्यक्ति को सूचित कर सकता है। ‘पराया व्यक्ति’ इस अर्थ-बल को बनाए रखता है।
- source_word: זוּלָתִי שְׁתַּיִם אֲנַחְנוּ בַּבָּיִת
  choice: हम दोनों के सिवा घर में और कोई नहीं था
  rationale: זוּלָתִי अपवाद और विशिष्टता व्यक्त करता है। हिंदी वाक्य मूल की पुनरुक्ति को बनाए रखते हुए स्पष्ट करता है कि घर में केवल वे दोनों थीं।
