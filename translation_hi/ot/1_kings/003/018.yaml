translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। कानूनी गवाही के संदर्भ में ‘इस स्त्री’ का संकेतात्मक स्वर और घर में केवल दो स्त्रियों की उपस्थिति पर मूल का दोहरा बल सुरक्षित रखा गया है। पाद-टिप्पणी का चिह्न संबंधित इब्रानी शब्द זָר के अनुवाद के बाद रखा गया है।
