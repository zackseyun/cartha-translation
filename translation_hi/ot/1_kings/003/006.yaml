base_translation:
  language: en
  yaml_path: translation/ot/1_kings/003/006.yaml
  text: And Solomon said[a], “You have shown great covenant faithfulness to your servant David my father, because he walked before you in faithfulness, in righteousness, and in uprightness of heart with you; and you have kept for him this great covenant faithfulness and have given him a son sitting on his throne[c][b], as it is this day.”
translation:
  language: hi
  text: तब सुलैमान ने कहा, “आपने मेरे पिता दाऊद, अपने सेवक, के प्रति बड़ी वाचा-निष्ठा[a] दिखाई, क्योंकि वह आपके सामने सच्चाई[b], धार्मिकता और मन की सीधाई के साथ आपके साथ चलता रहा। आपने उसके लिए यह बड़ी वाचा-निष्ठा बनाए रखी और उसे एक पुत्र दिया, जो उसकी राजगद्दी पर बैठा है, जैसा कि आज स्पष्ट है[c]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “वाचा-निष्ठा” के लिए “अटल प्रेम” या “निष्ठावान प्रेम” भी सम्भव है।
    reason: lexical_alternative
  - marker: b
    text: “सच्चाई” का अर्थ यहाँ “निष्ठा से” या “खराई से” भी हो सकता है।
    reason: lexical_alternative
  - marker: c
    text: शाब्दिक रूप से “जैसा इस दिन”; यह इब्रानी मुहावरा वर्तमान दिखाई देने वाली स्थिति से पुष्टि का भाव देता है।
    reason: cultural_note
lexical_decisions:
- source_word: חֶסֶד
  choice: वाचा-निष्ठा
  rationale: राजवंशीय और प्रतिज्ञात्मक संदर्भ में यह शब्द केवल दया नहीं, बल्कि संबंध में अटल प्रेम और निष्ठा व्यक्त करता है; ‘वाचा-निष्ठा’ उस आयाम को स्पष्ट रखता है।
- source_word: עָשִׂיתָ עִם
  choice: के प्रति ... दिखाई
  rationale: חֶסֶד के साथ यह इब्रानी पदबंध किसी के प्रति निष्ठावान प्रेम दिखाने का अर्थ देता है और हिन्दी में स्वाभाविक है।
- source_word: עַבְדְּךָ
  choice: अपने सेवक
  rationale: राजकीय प्रार्थना में दाऊद की परमेश्वर के अधीन स्थिति व्यक्त करने के लिए ‘सेवक’ उपयुक्त है।
- source_word: כַּאֲשֶׁר
  choice: क्योंकि
  rationale: यहाँ अगला उपवाक्य परमेश्वर द्वारा दिखाई गई निष्ठा की पृष्ठभूमि या आधार बताता है; कारणार्थक भाव हिन्दी में स्पष्ट है।
- source_word: הָלַךְ לְפָנֶיךָ
  choice: आपके सामने ... चलता रहा
  rationale: जीवन-आचरण के इब्रानी रूपक को बनाए रखता है और आधुनिक हिन्दी में समझ में आता है।
- source_word: בֶּאֱמֶת
  choice: सच्चाई
  rationale: אֱמֶת की ‘सत्य, विश्वसनीयता, निष्ठा’ संबंधी अर्थ-व्याप्ति को पूरी तरह एक अर्थ में सीमित किए बिना मूल संज्ञात्मक रूप के निकट रहता है।
- source_word: בִּצְדָקָה
  choice: धार्मिकता
  rationale: यहाँ शब्द दाऊद के नैतिक रूप से उचित आचरण को दर्शाता है।
- source_word: וּבְיִשְׁרַת לֵבָב
  choice: मन की सीधाई
  rationale: मूल के ‘हृदय की सीधाई’ रूपक को सहज हिन्दी में सुरक्षित रखता है और आंतरिक निष्कपटता का भाव देता है।
- source_word: עִמָּךְ
  choice: आपके साथ
  rationale: मूल में प्रयुक्त ‘साथ’ के संबंधपरक भाव को ‘सामने’ में विलीन नहीं किया गया है।
- source_word: וַתִּשְׁמָר לוֹ
  choice: उसके लिए ... बनाए रखी
  rationale: यह पहले कही गई חֶסֶד को जारी और प्रभावी रखने का भाव व्यक्त करता है।
- source_word: בֵן יֹשֵׁב עַל כִּסְאוֹ
  choice: एक पुत्र ... जो उसकी राजगद्दी पर बैठा है
  rationale: वर्तमान कृदंत सुलैमान के उस समय वास्तव में राजगद्दी पर बैठे होने को चित्रित करता है।
- source_word: כַּיּוֹם הַזֶּה
  choice: जैसा आज है
  rationale: वर्तमान दृश्यमान परिस्थिति द्वारा कथन की पुष्टि करने वाले इब्रानी मुहावरे को संक्षिप्त, स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: राजकीय-वाचा के संदर्भ में חֶסֶד का अनुवाद
  choice: वाचा-निष्ठा
  alternative: अटल प्रेम; निष्ठावान प्रेम; करुणा
  rationale: दाऊद के प्रति परमेश्वर के संबंध और उसके पुत्र के राजगद्दी पर बैठने में प्रतिज्ञा की निरंतरता प्रमुख है। फिर भी पादटिप्पणी प्रेम और कृपा के अर्थ-रंगों को खुला रखती है।
- issue: दाऊद के आचरण और परमेश्वर की कृपा के बीच संबंध
  choice: כַּאֲשֶׁר को ‘क्योंकि’ अनूदित किया गया, बिना इससे सिद्धान्तगत योग्यता-अर्जन का निष्कर्ष जोड़े
  alternative: जिस प्रकार; जैसा कि
  rationale: संदर्भ कारण या आधार का संकेत दे सकता है, पर पद स्वयं अनुग्रह और मानवीय आचरण के संबंध की पूरी धर्मवैज्ञानिक व्याख्या नहीं करता।
- issue: בֶּאֱמֶת का अर्थ
  choice: सच्चाई
  alternative: निष्ठा से; खराई से
  rationale: मूल शब्द की सत्य और विश्वसनीयता दोनों से जुड़ी अर्थ-व्याप्ति को सुरक्षित रखने के लिए मुख्य पाठ में ‘सच्चाई’ और पादटिप्पणी में विकल्प दिए गए हैं।
translation_notes:
  register: आदरार्थी द्वितीय पुरुष ‘आप’ रखा गया है। भाषा आधुनिक और गरिमापूर्ण है। ‘चलता रहा’ जैसे परिचित बाइबलीय रूपक को बनाए रखते हुए वाक्य-विन्यास हिन्दी के अनुसार स्वाभाविक किया गया है। सभी पादटिप्पणी-चिह्न मुख्य पाठ में क्रम से उपस्थित हैं।
