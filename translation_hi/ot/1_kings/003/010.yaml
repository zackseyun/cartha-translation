  yaml_path: translation/ot/1_kings/003/010.yaml
  text: And the matter was good in the eyes of the Lord[a], because Solomon had asked this thing.
translation:
  language: hi
  text: यह बात प्रभु की दृष्टि में अच्छी लगी, क्योंकि सुलैमान ने यह बात माँगी थी।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּיטַב
  choice: अच्छी लगी
  rationale: यहाँ יטב प्रभु द्वारा सुलैमान की माँगी हुई बात को अनुकूल और प्रसन्नताजनक मानने को व्यक्त करता है। हिंदी में ‘अच्छी लगी’ स्वाभाविक है और ‘प्रसन्न हुए’ की अपेक्षा मूल वाक्य की विषय-रचना को अधिक निकटता से रखता है।
- source_word: הַדָּבָר
  choice: यह बात
  rationale: דבר का अर्थ ‘बात, विषय, वस्तु’ हो सकता है। पूर्ववर्ती माँग की ओर संकेत करते हुए ‘यह बात’ सहज हिंदी है और ‘निवेदन’ जैसी अधिक विशिष्ट व्याख्या नहीं जोड़ता।
- source_word: בְּעֵינֵי
  choice: की दृष्टि में
  rationale: यह इब्रानी का मूल्यांकन-सूचक मुहावरा है। ‘की दृष्टि में’ उसके रूपक को बनाए रखते हुए आधुनिक हिंदी में स्वाभाविक है।
- source_word: אֲדֹנָי
  choice: प्रभु
  rationale: मूल पाठ में אֲדֹנָי है, יהוה नहीं। इसलिए सामान्य दैवी उपाधि ‘प्रभु’ उपयुक्त है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यहाँ כִּי पिछली बात का कारण बताता है; ‘क्योंकि’ उसका स्पष्ट और स्वाभाविक हिंदी रूप है।
- source_word: שָׁאַל
  choice: माँगा था
  rationale: שׁאל यहाँ किसी वस्तु या वर को माँगने के अर्थ में है। हिंदी कथात्मक क्रम में ‘माँगा था’ पहले घट चुकी क्रिया को स्वाभाविक रूप से व्यक्त करता है।
- source_word: שְׁלֹמֹה
  choice: सुलैमान
  rationale: यह नाम का हिंदी बाइबलीय प्रचलित रूप है।
- source_word: אֶת הַדָּבָר הַזֶּה
  choice: यही
  rationale: प्रसंग में यह पदबंध सुलैमान की ठीक उसी माँग पर बल देता है। ‘यही’ पुनरुक्ति से बचते हुए संकेत और बल दोनों को स्वाभाविक हिंदी में व्यक्त करता है।
theological_decisions:
- issue: दैवी उपाधि אֲדֹנָי का अनुवाद
  choice: प्रभु
  alternative: यहोवा
  rationale: इस पद में אֲדֹנָי लिखा है, चतुरक्षरीय नाम יהוה नहीं; अतः ‘यहोवा’ कहना मूल की दो भिन्न अभिव्यक्तियों को मिला देगा।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘प्रभु की दृष्टि में अच्छी लगी’ मूल इब्रानी मुहावरे और स्वाभाविक हिंदी के बीच संतुलन रखता है।
