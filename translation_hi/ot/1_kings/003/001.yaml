source:
  edition: WLC
  text: וַ/יִּתְחַתֵּ֣ן שְׁלֹמֹ֔ה אֶת פַּרְעֹ֖ה מֶ֣לֶךְ מִצְרָ֑יִם וַ/יִּקַּ֣ח אֶת בַּת פַּרְעֹ֗ה וַ/יְבִיאֶ֨/הָ֙ אֶל עִ֣יר דָּוִ֔ד עַ֣ד כַּלֹּת֗/וֹ לִ/בְנ֤וֹת אֶת בֵּית/וֹ֙ וְ/אֶת בֵּ֣ית יְהוָ֔ה וְ/אֶת חוֹמַ֥ת יְרוּשָׁלִַ֖ם סָבִֽיב־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/003/001.yaml
  text: Solomon formed a marriage alliance with Pharaoh king of Egypt[a], and he took Pharaoh’s daughter and brought her into the city of David until he had finished building his own house, and the house of Yahweh[b], and the wall around Jerusalem.
translation:
  language: hi
  text: सुलैमान ने मिस्र के राजा फ़िरौन के साथ विवाह-संबंध स्थापित किया[a]। उसने फ़िरौन की बेटी से विवाह किया और उसे दाऊद के नगर में ले आया, जहाँ वह तब तक रही जब तक सुलैमान ने अपना घर, याहवे का भवन[b] और यरूशलेम के चारों ओर की शहरपनाह बनाना पूरा नहीं कर लिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “फ़िरौन का विवाह-संबंधी बन गया।” इब्रानी क्रिया विवाह के द्वारा संबंध में आने पर बल दे सकती है; यहाँ राजकीय गठबंधन का भाव भी सम्भवतः निहित है।
    reason: lexical_alternative
  - marker: b
    text: या, “याहवे का मन्दिर।” मूल इब्रानी में “याहवे का घर” है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְחַתֵּן
  choice: विवाह-संबंध स्थापित किया
  rationale: हित्पएल क्रिया किसी के साथ वैवाहिक नाता जोड़ने को व्यक्त करती है; राजकीय प्रसंग में इसके राजनीतिक गठबंधन के निहितार्थ भी हैं, जिन्हें यह स्वाभाविक हिन्दी अभिव्यक्ति सुरक्षित रखती है।
- source_word: אֶת פַּרְעֹה מֶלֶךְ מִצְרָיִם
  choice: मिस्र के राजा फ़िरौन के साथ
  rationale: यह पदबंध फ़िरौन की पहचान मिस्र के राजा के रूप में करता है; हिन्दी में यह क्रम स्पष्ट और स्वाभाविक है।
- source_word: וַיִּקַּח אֶת בַּת פַּרְעֹה
  choice: उसने फ़िरौन की बेटी से विवाह किया
  rationale: स्त्री के संदर्भ में לקח प्रचलित इब्रानी मुहावरा है जिसका अर्थ पत्नी के रूप में ग्रहण करना है। हिन्दी में शाब्दिक ‘ले लिया’ अनावश्यक अस्पष्टता पैदा करता, इसलिए वैवाहिक अर्थ स्पष्ट किया गया है।
- source_word: וַיְבִיאֶהָ אֶל עִיר דָּוִד
  choice: उसे दाऊद नगर में ले आया
  rationale: गति और गंतव्य दोनों को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: עַד כַּלֹּתוֹ לִבְנוֹת
  choice: वह तब तक वहीं रही, जब तक सुलैमान ने ... बनवाना पूरा नहीं कर लिया
  rationale: עַד समय की अंतिम सीमा बताता है। हिन्दी में स्पष्टता के लिए निहित निवास-स्थिति को ‘वह तब तक वहीं रही’ से खोला गया और राजकीय निर्माण के लिए ‘बनवाना’ स्वाभाविक है।
- source_word: אֶת בֵּיתוֹ
  choice: अपना महल
  rationale: בית का मूल अर्थ ‘घर/भवन’ है, पर राजकीय निर्माण-सूची में यह सुलैमान के राजमहल को सूचित करता है; ‘महल’ साधारण पाठक के लिए प्रसंग को स्पष्ट करता है।
- source_word: וְאֶת בֵּית יְהוָה
  choice: यहोवा का भवन
  rationale: ‘भवन’ स्रोत के ‘घर’ रूपक के निकट रहते हुए हिन्दी में उपासना-स्थल के लिए गरिमापूर्ण और बोधगम्य है; ‘मन्दिर’ वैकल्पिक अर्थ के रूप में पादटिप्पणी में दिया गया है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: चतुरक्षरीय व्यक्तिगत ईश्वरीय नाम को किसी उपाधि से बदलने के बजाय हिन्दी में प्रचलित नामरूप ‘यहोवा’ से दर्शाया गया है।
- source_word: וְאֶת חוֹמַת יְרוּשָׁלִַם סָבִיב
  choice: यरूशलेम के चारों ओर की शहरपनाह
  rationale: חוֹמָה नगर की रक्षात्मक दीवार है और סָבִיב उसके चारों ओर होने को दर्शाता है; ‘शहरपनाह’ इस आशय को संक्षेप और स्वाभाविक ढंग से व्यक्त करता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: मूल पाठ में व्यक्तिगत नाम है। हिन्दी पाठकों के बीच व्यापक रूप से पहचाने जाने वाले ‘यहोवा’ को रखा गया है, न कि नाम को ‘प्रभु’ जैसी उपाधि से प्रतिस्थापित किया गया।
- issue: בֵּית יְהוָה की अभिव्यक्ति
  choice: यहोवा का भवन
  alternative: यहोवा का मन्दिर
  rationale: ‘भवन’ इब्रानी ‘घर’ को औपचारिक निकटता से रखता है, जबकि प्रसंग में उसका मन्दिर होना स्पष्ट है; अधिक व्याख्यात्मक विकल्प पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण वर्णनात्मक गद्य। ‘फ़िरौन’, ‘दाऊद’, ‘यहोवा’ और ‘यरूशलेम’ जैसे परिचित बाइबलीय नामरूप रखे गए हैं। लम्बे इब्रानी वाक्य को स्पष्टता के लिए तीन हिन्दी वाक्यों में बाँटा गया है; अंतिम कालिक खंड में निहित निवास-भाव को स्पष्ट किया गया है।
