  text: בְּ/גִבְע֗וֹן נִרְאָ֧ה יְהֹוָ֛ה אֶל שְׁלֹמֹ֖ה בַּ/חֲל֣וֹם הַ/לָּ֑יְלָה וַ/יֹּ֣אמֶר אֱלֹהִ֔ים שְׁאַ֖ל מָ֥ה אֶתֶּן לָֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/003/005.yaml
  text: At Gibeon Yahweh appeared to Solomon in a dream at night[a], and God said, “Ask what I should give you.”
translation:
  language: hi
  text: गिबोन में यहवे रात के समय सुलैमान को स्वप्न में दिखाई दिए[a], और परमेश्वर ने कहा, “माँग, मैं तुझे क्या दूँ?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से, “रात के स्वप्न में”; अर्थात रात के समय आए एक स्वप्न में।
    reason: मूल इब्रानी की संबंधवाचक संरचना बताते हुए मुख्य पाठ की स्वाभाविक हिंदी को स्पष्ट करना।
lexical_decisions:
- source_word: בְּ/גִבְעוֹן
  choice: गिबोन में
  rationale: בְ स्थान सूचित करता है; हिंदी में नगर के नाम के साथ ‘में’ स्वाभाविक और सटीक है।
- source_word: נִרְאָה
  choice: दिखाई दिए
  rationale: ראה के निफ़अल रूप का यहाँ अर्थ दिव्य प्रकट होने से है। ‘दिखाई दिए’ इस भाव को स्वाभाविक हिंदी में व्यक्त करता है, बिना प्रकट होने की रीति को अतिरिक्त रूप से परिभाषित किए।
- source_word: יְהֹוָה
  choice: यहवे
  rationale: मूल पाठ में परमेश्वर का विशिष्ट नाम יהוה है; ‘यहवे’ उसे सामान्य उपाधि में बदले बिना नाम के रूप में प्रस्तुत करता है।
- source_word: אֶל שְׁלֹמֹה
  choice: सुलैमान को
  rationale: אֶל यहाँ उस व्यक्ति को सूचित करता है जिसके सामने दिव्य दर्शन हुआ; ‘सुलैमान को दिखाई दिए’ स्वाभाविक हिंदी प्रयोग है।
- source_word: בַּ/חֲלֹם הַ/לָּיְלָה
  choice: रात को स्वप्न में
  rationale: शाब्दिक संरचना ‘रात के स्वप्न में’ है। ‘रात को स्वप्न में’ रात्रिकालीन स्वप्न का अर्थ स्पष्ट और स्वाभाविक रखता है।
- source_word: וַ/יֹּאמֶר
  choice: और ... ने कहा
  rationale: वाव-क्रम कथा को आगे बढ़ाता है; ‘और’ मूल समन्वय को सरलता से बनाए रखता है।
- source_word: אֱלֹהִים
  choice: परमेश्वर
  rationale: यहाँ मूल पाठ יהוה के बाद אֱלֹהִים प्रयोग करता है। ‘परमेश्वर’ द्वारा इस शब्दगत बदलाव को बनाए रखा गया है।
- source_word: שְׁאַל
  choice: माँग
  rationale: एकवचन पुल्लिंग आज्ञार्थक रूप सीधा और खुला है। प्रसंग में ‘माँग’ हिंदी में ‘अपने लिए कुछ माँग’ का स्वाभाविक अर्थ देता है।
- source_word: מָה אֶתֶּן לָךְ
  choice: मैं तुझे क्या दूँ?
  rationale: हिब्रू में यह सीधा प्रश्न है, शाब्दिकतः ‘मैं तुझे क्या दूँ?’ हिंदी में इसी प्रश्नात्मक रूप को बनाए रखना सहज और स्रोत के अधिक निकट है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: यहवे
  alternative: यहोवा; प्रभु
  rationale: मूल में वाचा-संबंधी विशिष्ट नाम है। लिप्यंतरण उसे सामान्य उपाधि ‘प्रभु’ में बदलने से बचाता है; ‘यहवे’ आधुनिक विद्वत् पुनर्निर्माण के निकट प्रचलित हिंदी रूप है।
- issue: יהוה से אֱלֹהִים में शब्दगत बदलाव
  choice: ‘यहवे’ और फिर ‘परमेश्वर’
  alternative: दोनों स्थानों पर ‘परमेश्वर’ अथवा दोनों पर ‘यहवे’
  rationale: एक ही पद में प्रयुक्त दो अलग ईश्वरीय पदनामों को अलग-अलग प्रस्तुत करना मूल की शब्दगत बनावट और संभावित धर्मवैचारिक तनाव को सुरक्षित रखता है।
- issue: מָה אֶתֶּן לָךְ की वाक्यगत भूमिका
  choice: 'सीधा प्रश्न: ‘मैं तुझे क्या दूँ?’'
  alternative: 'अप्रत्यक्ष आशय: ‘जो मैं तुझे दूँ’'
  rationale: हिब्रू रूप को प्रश्न के रूप में समझना व्याकरणतः सहज है और आज्ञा के बाद खुली पेशकश का बल बनाए रखता है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिंदी। सुलैमान से एकवचन संबोधन के कारण ‘तुझे’ और ‘माँग’ रखा गया है। मुख्य पाठ में ईश्वरीय नाम और ‘परमेश्वर’ के बीच मूल का अंतर सुरक्षित है।
