translation_notes:
  register: आदरपूर्ण किन्तु सामान्य आधुनिक हिन्दी। राजा के लिए ‘मेरे स्वामी’ रखा गया है; इसे दिव्य उपाधि नहीं बनाया गया। मूल में ‘बच्चे’ के लिए अलग संज्ञा नहीं है, पर हिन्दी में ‘जन्म दिया’ को स्वाभाविक और स्पष्ट बनाने के लिए इसे निहित कर्म के रूप में जोड़ा गया है।
