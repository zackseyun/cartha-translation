translation:
  language: hi
  text: तब एक स्त्री ने कहा, “कृपया, मेरे स्वामी, मैं और यह स्त्री एक ही घर में रहती हैं, और मैंने उसी घर में, जब वह मेरे साथ थी, बच्चे को जन्म दिया।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בִּי אֲדֹנִי
  choice: हे मेरे स्वामी, मेरी बात सुनिए!
  rationale: निवेदन और सम्मान व्यक्त करने वाले इब्रानी संबोधन को आधुनिक, स्वाभाविक अदालती विनती के रूप में प्रस्तुत किया गया है; केवल शाब्दिक ‘मुझ पर, मेरे स्वामी’ हिन्दी में अस्पष्ट होता।
- source_word: יֹשְׁבֹת בְּבַיִת אֶחָד
  choice: एक ही घर में रहती हैं
  rationale: स्त्रीलिंग बहुवचन कृदंत साझा निवास की स्थिति बताता है; वर्तमानकालीन रूप मूल की अभिव्यक्ति और उपलब्ध परामर्श-पाठ दोनों के अनुरूप है।
- source_word: וָאֵלֵד עִמָּהּ בַּבָּיִת
  choice: घर में इसके साथ रहते हुए मैंने एक बच्चे को जन्म दिया
  rationale: עִמָּהּ का संबंध साझा उपस्थिति से है। हिन्दी में ‘इसके साथ रहते हुए’ यह स्पष्ट करता है कि दूसरी स्त्री घर में उपस्थित थी, बिना यह अर्थ निकाले कि दोनों ने साथ जन्म दिया।
