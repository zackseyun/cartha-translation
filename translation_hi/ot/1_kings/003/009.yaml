base_translation:
  language: en
  yaml_path: translation/ot/1_kings/003/009.yaml
  text: So give your servant a listening heart to judge your people[a], to discern between good and evil[b], for who is able to judge this great people of yours?
translation:
  language: hi
  text: इसलिए अपने दास को सुनने वाला हृदय[a] दे, ताकि वह तेरी प्रजा का न्याय करे और भले और बुरे के बीच भेद कर सके; क्योंकि तेरी इस महान[b] प्रजा का न्याय कौन कर सकता है?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘समझदार हृदय’; शाब्दिक रूप से, ‘सुनने वाला हृदय।’
    reason: lexical_alternative
  - marker: b
    text: ‘महान’ के लिए प्रयुक्त इब्रानी शब्द का शाब्दिक अर्थ ‘भारी’ या ‘वज़नी’ है; यहाँ यह प्रजा की महत्ता अथवा उस पर शासन करने के भार का संकेत दे सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתָּ
  choice: इसलिए ... दे
  rationale: पूर्ववर्ती प्रार्थना से निकलने वाली विनती को स्वाभाविक हिन्दी में व्यक्त करता है; वाव का प्रसंगगत परिणामसूचक भाव भी बना रहता है।
- source_word: לְעַבְדְּךָ
  choice: अपने दास को
  rationale: परमेश्वर के सामने सुलैमान का यह विनम्र राजकीय आत्म-परिचय है। ‘दास’ मूल शब्द की अधीनता और विनय को बनाए रखता है।
- source_word: לֵב שֹׁמֵעַ
  choice: सुननेवाला मन
  rationale: मूल इब्रानी बिंब ‘सुनने वाला मन’ है, जिसमें ग्रहणशीलता, ध्यान और आज्ञाकारी प्रत्युत्तर का भाव है। ‘मन’ आधुनिक हिन्दी में विचार, इच्छा और विवेक के केंद्र का स्वाभाविक संकेत देता है।
- source_word: לִשְׁפֹּט
  choice: न्याय करे
  rationale: שׁפט में शासन और न्याय, दोनों का क्षेत्र हो सकता है; यहाँ भले-बुरे का भेद करने के संदर्भ में ‘न्याय करे’ उसके मूल न्यायिक अर्थ को सुरक्षित रखता है।
- source_word: עַמְּךָ
  choice: तेरी प्रजा
  rationale: राजकीय संदर्भ में ‘प्रजा’ स्वाभाविक है और लोगों के परमेश्वर से संबंध को ‘तेरी’ स्पष्ट रखता है।
- source_word: לְהָבִין
  choice: भेद कर सके
  rationale: हिफ़ील रूप यहाँ विवेकपूर्वक अंतर पहचानने का भाव देता है; न्यायिक संदर्भ में ‘भेद करना’ स्वाभाविक और सटीक है।
- source_word: בֵּין טוֹב לְרָע
  choice: भले और बुरे के बीच
  rationale: मूल के नैतिक और मूल्यांकनात्मक शब्दों को सुरक्षित रखता है; इसे केवल ‘सही और गलत’ तक सीमित नहीं करता।
- source_word: כִּי מִי יוּכַל
  choice: क्योंकि ... कौन कर सकता है
  rationale: विनती का कारण बताने वाले आलंकारिक प्रश्न और कार्य के सामने मानवीय अपर्याप्तता, दोनों को बनाए रखता है।
- source_word: הַכָּבֵד
  choice: महान
  rationale: यहाँ मूल अर्थ ‘भारी/वज़नी’ से बढ़कर विशालता, महत्त्व और शासन के भार को सूचित करता है। मुख्य पाठ में ‘महान’ सहज है, जबकि शाब्दिक अर्थ पादटिप्पणी में रखा गया है।
theological_decisions:
- issue: सुलैमान की विनती में मनुष्य-विज्ञान संबंधी बिंब
  choice: सुननेवाला मन
  alternative: समझदार मन
  rationale: ‘मन’ को सुनने वाला बताने से इब्रानी बिंब और बुद्धि, इच्छा तथा ग्रहणशीलता की संयुक्त धारणा बनी रहती है। ‘समझदार मन’ अर्थ स्पष्ट करता है, पर सुनने के मूल बिंब को कम कर देता है।
- issue: राजकीय कार्य में न्याय और शासन का संबंध
  choice: न्याय करे
  alternative: शासन करे
  rationale: मूल क्रिया दोनों क्षेत्रों को समेट सकती है। भले और बुरे के बीच भेद करने का निकट संदर्भ न्यायिक अर्थ को प्रमुख बनाता है, पर व्यापक राजकीय कार्य को नकारता नहीं।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण प्रार्थना-शैली रखी गई है। परमेश्वर के लिए निकट और पारंपरिक एकवचन संबोधन ‘तेरी’ तथा सुलैमान के लिए विनम्र आत्म-संज्ञा ‘दास’ प्रयुक्त है। ‘सुननेवाला मन’ और ‘भले और बुरे’ जैसे मूल बिंब जानबूझकर सुरक्षित रखे गए हैं।
