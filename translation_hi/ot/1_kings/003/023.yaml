  yaml_path: translation/ot/1_kings/003/023.yaml
  text: Then the king said[a], “This one says, ‘This is my son, the living one, and your son is the dead one,’ and this one says, ‘No, for your son is the dead one, and my son is the living one.’”
translation:
  language: hi
  text: तब राजा ने कहा[a], “यह कहती है, ‘यह मेरा जीवित बेटा है, और तुम्हारा बेटा मरा हुआ है,’ और यह कहती है, ‘नहीं, तुम्हारा बेटा मरा हुआ है और मेरा बेटा जीवित है।’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक मुहावरेदार अनुवाद हो सकता है: “यह स्त्री कहती है ... और वह स्त्री कहती है ...।” इब्रानी में स्त्रीलिंग संकेतवाचक शब्द हैं, शाब्दिक रूप से “यह ... और यह,” जो दोनों स्त्रियों की ओर संकेत करते हैं।'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: तब ... ने कहा
  rationale: वाव-क्रमागत कथा को आगे बढ़ाता है; ‘तब’ स्वाभाविक हिन्दी में घटनाक्रम को स्पष्ट रखता है।
- source_word: הַמֶּלֶךְ
