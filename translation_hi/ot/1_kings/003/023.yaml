  rationale: इब्रानी में निश्चित उपाधि है; यहाँ नाम जोड़ना अनावश्यक होगा।
- source_word: זֹאת ... וְזֹאת
  choice: यह ... और यह
  rationale: स्त्रीलिंग संकेतवाचक शब्द पहले उल्लिखित दोनों स्त्रियों की ओर संकेत करते हैं। यह चयन मूल की संकेतात्मक और विरोधात्मक शैली को बनाए रखता है।
- source_word: אֹמֶרֶת
  choice: कहती है
  rationale: स्त्रीलिंग कृदंत राजा द्वारा दोनों दावों के सजीव वर्तमान-सारांश के रूप में प्रयुक्त है।
- source_word: זֶה בְּנִי הַחַי
  choice: यह मेरा बेटा है—जीवित वाला
  rationale: यह रचना संकेतवाचक पहचान के साथ הַחַי की विशेषणात्मक/संज्ञात्मक पुनःपहचान को बनाए रखती है और मूल क्रम के निकट है।
- source_word: בְּנִי / בְּנֵךְ
  choice: मेरा बेटा / तुम्हारा बेटा
  rationale: בֵּן का सामान्य अर्थ ‘बेटा’ है और प्रसंग पुरुष शिशु का है।
- source_word: הַחַי / הַמֵּת
  choice: जीवित वाला / मरा हुआ
  rationale: हिन्दी में स्वाभाविक भेद बनाए रखते हुए मूल के ‘जीवित’ और ‘मृत’ विरोध को स्पष्ट करता है; हर स्थान पर ‘वाला’ दोहराने से उत्पन्न कृत्रिमता से बचा गया है।
- source_word: לֹא כִי
  choice: नहीं
  rationale: यह संयोजन पहले दावे का जोरदार खंडन करके विपरीत दावा प्रस्तुत करता है; हिन्दी में ‘नहीं’ और उसके बाद का कथन यह कार्य स्वाभाविक रूप से करते हैं।
