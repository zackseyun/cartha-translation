source:
  edition: WLC
  text: הִנֵּ֥ה עָשִׂ֖יתִי כִּ/דְבָרֶ֑י/ךָ הִנֵּ֣ה נָתַ֣תִּי לְ/ךָ֗ לֵ֚ב חָכָ֣ם וְ/נָב֔וֹן אֲשֶׁ֤ר כָּמ֨וֹ/ךָ֙ לֹא הָיָ֣ה לְ/פָנֶ֔י/ךָ וְ/אַחֲרֶ֖י/ךָ לֹא יָק֥וּם כָּמֽוֹ/ךָ׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/003/012.yaml
  text: Behold[a], I have done according to your words. Behold, I have given you a wise and discerning heart, such that no one like you has been before you, and no one like you shall arise after you.
translation:
  language: hi
  text: देख, मैंने तेरी बातों के अनुसार किया है। देख, मैंने तुझे एक बुद्धिमान और विवेकशील हृदय[a] दिया है, ऐसा कि तुझसे पहले तेरे समान कोई नहीं हुआ और तेरे बाद तेरे समान कोई नहीं उठेगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘हृदय’ यहाँ केवल भावनाओं का केंद्र नहीं, बल्कि सोचने, निर्णय करने और विवेक से परखने की भीतरी क्षमता भी है। इसका अनुवाद ‘समझदार मन’ भी किया जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: देख
  rationale: ध्यान आकर्षित करने वाले इस अव्यय को छोड़ा नहीं गया है। ‘देख’ आधुनिक हिन्दी में उसके गंभीर, घोषणात्मक बल को स्वाभाविक रूप से व्यक्त करता है।
- source_word: עָשִׂיתִי כִּדְבָרֶיךָ
  choice: मैंने तेरे वचनों के अनुसार किया है
  rationale: पूर्ण हुई दिव्य कार्रवाई को व्यक्त करते हुए ‘वचनों’ से मूल के דְבָרֶיךָ को बनाए रखा गया है; ‘विनती’ संदर्भानुकूल है, पर मूल से अधिक व्याख्यात्मक होता।
- source_word: נָתַתִּי לְךָ
  choice: मैंने तुझे ... दिया है
  rationale: पूर्ण क्रिया को पहले ही प्रदान किए गए वरदान के रूप में रखा गया है और נתן का सीधा अर्थ ‘देना’ सुरक्षित है।
- source_word: לֵב
  choice: हृदय
  rationale: इब्रानी प्रयोग में हृदय भावना के साथ विचार, निर्णय और विवेक का भी केंद्र है; केवल ‘मन’ कहने से इसका अर्थ-संसार संकुचित हो जाता।
- source_word: חָכָם וְנָבוֹן
  choice: बुद्धिमान और समझ-बूझ वाला
  rationale: ‘बुद्धिमान’ חָכָם को और ‘समझ-बूझ वाला’ נָבוֹן की अंतर्दृष्टि तथा विवेकशीलता को सामान्य आधुनिक हिन्दी में अलग-अलग व्यक्त करता है।
- source_word: אֲשֶׁר כָּמוֹךָ לֹא הָיָה לְפָנֶיךָ
  choice: ऐसा कि न तो तुझसे पहले तेरे समान कोई हुआ
  rationale: אֲשֶׁר को उद्देश्य के बजाय परिणाम अथवा वर्णन के रूप में ‘ऐसा कि’ से व्यक्त किया गया है और तुलना का बल बनाए रखा गया है।
- source_word: וְאַחֲרֶיךָ לֹא יָקוּם כָּמוֹךָ
  choice: और न तेरे बाद तेरे समान कोई उठेगा
  rationale: ‘उठेगा’ יָקוּם की ऐतिहासिक रूप से किसी के प्रकट होने की छवि को संक्षेप और स्वाभाविक ढंग से बनाए रखता है।
theological_decisions:
- issue: सुलैमान की अनुपम स्थिति का आशय
  choice: तुलना को इसी संदर्भ में दिए गए बुद्धिमान और समझ-बूझ वाले हृदय से संबद्ध रहने दिया गया है।
  alternative: इसे हर प्रकार से सुलैमान की पूर्ण और सार्वकालिक श्रेष्ठता का दावा मानना।
  rationale: निकटवर्ती संदर्भ राजकीय न्याय के लिए दी गई बुद्धि और समझ-बूझ पर केंद्रित है। अनुवाद मूल की व्यापक तुलना को बनाए रखता है, पर उसमें ऐसा अतिरिक्त सार्वभौमिक दावा नहीं जोड़ता जो पद स्पष्ट रूप से नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गंभीर पर सुबोध शैली रखी गई है। परमेश्वर द्वारा सुलैमान को एकवचन संबोधन के कारण ‘तेरे/तुझे’ का प्रयोग किया गया है। दोनों הִנֵּה को ‘देख’ के रूप में बनाए रखकर दिव्य घोषणा का जोर सुरक्षित रखा गया है।
