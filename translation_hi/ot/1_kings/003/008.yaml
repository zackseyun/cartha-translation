  text: וְ/עַ֨בְדְּ/ךָ֔ בְּ/ת֥וֹךְ עַמְּ/ךָ֖ אֲשֶׁ֣ר בָּחָ֑רְתָּ עַם רָ֕ב אֲשֶׁ֧ר לֹֽא יִמָּנֶ֛ה וְ/לֹ֥א יִסָּפֵ֖ר מֵ/רֹֽב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/003/008.yaml
  text: And your servant is in the midst of your people whom you have chosen[a], a great people[b], too numerous to be counted or numbered.
translation:
  language: hi
  text: और आपका दास आपकी चुनी हुई प्रजा के बीच है—एक विशाल प्रजा[a], जिसे उसकी बहुतायत के कारण न गिना जा सकता है, न उसकी संख्या बताई जा सकती है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “बहुत बड़ी प्रजा।”
    reason: רָב का यहाँ आशय लोगों की बहुत बड़ी संख्या से है।
lexical_decisions:
- source_word: וְעַבְדְּךָ
  choice: और आपका दास
  rationale: दास सुलैमान की परमेश्वर के प्रति अधीनता और विनम्र आत्मपहचान को बनाए रखता है; आदरसूचक ‘आपका’ आधुनिक मानक हिन्दी में प्रार्थना के गरिमापूर्ण संबोधन के अनुकूल है।
- source_word: בְּתוֹךְ עַמְּךָ
  choice: आपकी प्रजा के बीच
  rationale: ‘बीच’ व्यक्ति के लोगों के मध्य स्थित होने का भाव स्वाभाविक हिन्दी में व्यक्त करता है; राजकीय संदर्भ में ‘प्रजा’ עַם के लिए उपयुक्त है।
- source_word: אֲשֶׁר בָּחָרְתָּ
  choice: आपकी चुनी हुई
  rationale: यह परमेश्वर द्वारा प्रजा के चुनाव को स्पष्ट रखता है और इब्रानी संबंधवाचक उपवाक्य को सहज हिन्दी विशेषण-रचना में व्यक्त करता है।
- source_word: עַם רָב
  choice: एक विशाल प्रजा
  rationale: רָב यहाँ मुख्यतः संख्या की विशालता बताता है। ‘विशाल’ स्वाभाविक है और अगला उपवाक्य उसके संख्यात्मक आशय को स्पष्ट करता है; वैकल्पिक स्पष्टार्थ फुटनोट में दिया गया है।
- source_word: לֹא יִמָּנֶה וְלֹא יִסָּפֵר מֵרֹב
  choice: जिसे उसकी बहुतायत के कारण न गिना जा सकता है, न उसकी संख्या बताई जा सकती है
  rationale: यह दोनों समानांतर क्रियाओं और מֵרֹב के कारणसूचक भाव को बनाए रखता है, बिना उन्हें केवल ‘अनगिनत’ में समेटे।
theological_decisions:
- issue: इस्राएल का परमेश्वर द्वारा चुनी हुई प्रजा होना
  choice: आपकी चुनी हुई प्रजा
  alternative: वह प्रजा जिसे आपने चुना है
  rationale: इब्रानी पाठ चुनाव को स्पष्ट रूप से परमेश्वर का कार्य बताता है। चुना हुआ रूप इस वाचाई भाषा को बनाए रखता है, पर बाद की किसी धर्मवैज्ञानिक व्याख्या को इसमें नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी में आदरसूचक ‘आप’ का प्रयोग किया गया है। शैली प्रार्थनापूर्ण और गरिमापूर्ण है, पर वाक्यरचना सामान्य पाठक के लिए सहज रखी गई है। ‘दास’ अधीनता का मूल भाव बनाए रखता है, जबकि ‘प्रजा’ राजकीय प्रसंग के अनुकूल है।
