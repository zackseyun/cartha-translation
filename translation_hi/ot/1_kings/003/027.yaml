  yaml_path: translation/ot/1_kings/003/027.yaml
  text: Then the king answered and said[a], “Give her the living child, and by no means put him to death; she is his mother.”
translation:
  language: hi
  text: तब राजा ने उत्तर दिया, “जीवित बच्चे को इस स्त्री को दे दो; उसे किसी भी दशा में मत मारना।”[a] वह उसकी माँ है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में निषेध अत्यंत बलपूर्ण है; शाब्दिक रूप से, “उसे मृत्यु न दो,” अर्थात “उसे किसी भी दशा में मत मारना।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן הַמֶּלֶךְ
  choice: तब राजा ने उत्तर दिया
  rationale: ענה का कथात्मक अर्थ ‘उत्तर देना’ है। अगले וַיֹּאמֶר को हिंदी में अलग से ‘और कहा’ कहना अनावश्यक और अस्वाभाविक पुनरुक्ति होती, इसलिए दोनों सूत्रों को स्वाभाविक ढंग से एक साथ व्यक्त किया गया है।
- source_word: תְּנוּ לָהּ
  choice: इस स्त्री को दे दो
  rationale: बहुवचन आज्ञार्थक रूप को हिंदी में संदर्भानुकूल ‘दे दो’ से व्यक्त किया गया है; ‘इस स्त्री’ से स्त्रीलिंग सर्वनाम का स्पष्ट संकेत मिलता है।
- source_word: הַיָּלוּד הַחַי
  choice: जीवित बच्चे
  rationale: יַלּוּד यहाँ जन्मे हुए छोटे बच्चे को सूचित करता है; ‘बच्चा’ आधुनिक हिंदी में स्वाभाविक है और הַחַי का सीधा अर्थ ‘जीवित’ है।
- source_word: וְהָמֵת לֹא תְמִיתֻהוּ
  choice: उसे किसी भी दशा में मत मारना
  rationale: मूल में מות का infinitive absolute और causative क्रिया मिलकर निषेध पर प्रबल बल देते हैं; ‘किसी भी दशा में मत’ उस emphatic prohibition को सहज हिंदी में बनाए रखता है।
- source_word: הִיא אִמּוֹ
  choice: यही उसकी माँ है
  rationale: सर्वनाम הִיא पहचान पर बल देता है। ‘यही’ उस बल को व्यक्त करता है, जबकि ‘उसकी माँ’ पुल्लिंग एकवचन प्रत्यय को स्वाभाविक हिंदी में दर्शाता है।
