  text: Then the king said[a], “Cut the living child in two, and give half to the one and half to the other.”
translation:
  language: hi
  text: तब राजा ने कहा, “जीवित बच्चे को दो भागों में काट दो और उसका आधा एक[a] को तथा आधा दूसरी को दे दो।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: हिब्रू में ‘एक को ... एक को’ दोनों स्त्रीलिंग रूप हैं, जो कथानक की दो स्त्रियों की ओर संकेत करते हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: तब ... ने कहा
  rationale: वाव-क्रमिक रूप कथा को आगे बढ़ाता है; ‘तब’ उसके स्वाभाविक क्रमिक भाव को व्यक्त करता है।
- source_word: הַמֶּלֶךְ
  choice: राजा
  rationale: निश्चित संज्ञा का हिन्दी में प्रसंगानुकूल और स्वाभाविक अनुवाद।
- source_word: גִּזְרוּ
  choice: काटकर ... कर दो
  rationale: बहुवचन आज्ञार्थक रूप यहाँ शारीरिक रूप से काटने का स्पष्ट आदेश देता है; संयुक्त हिन्दी रचना अगले पद ‘दो भाग’ के साथ स्वाभाविक है।
- source_word: הַיֶּלֶד הַחַי
  choice: जीवित बच्चे
  rationale: ‘जीवित’ इस बच्चे को कथानक के मृत बच्चे से अलग पहचानता है।
- source_word: לִשְׁנָיִם
  choice: दो भाग
  rationale: मूल पद का अर्थ दो हिस्सों में विभाजन है; हिन्दी में ‘दो भाग कर दो’ स्पष्ट और सहज है।
- source_word: וּתְנוּ
  choice: और ... दे दो
  rationale: दूसरी समन्वित बहुवचन आज्ञा को क्रम और आदेशात्मक बल सहित व्यक्त करता है।
- source_word: הַחֲצִי
  choice: आधा
  rationale: प्रत्येक को मिलने वाले आधे भाग का संक्षिप्त, स्वाभाविक हिन्दी रूप।
- source_word: לְאַחַת ... לְאֶחָת
  choice: एक को ... दूसरी को
  rationale: दोनों रूप स्त्रीलिंग एकवचन हैं और प्रसंग की दो स्त्रियों की ओर संकेत करते हैं; ‘एक ... दूसरी’ हिन्दी में इस स्त्रीलिंग भेद और वितरण को स्वाभाविक रूप से सुरक्षित रखता है।
