source:
  edition: WLC
  text: רַ֣ק הָ/עָ֔ם מְזַבְּחִ֖ים בַּ/בָּמ֑וֹת כִּ֠י לֹא נִבְנָ֥ה בַ֨יִת֙ לְ/שֵׁ֣ם יְהוָ֔ה עַ֖ד הַ/יָּמִ֥ים הָ/הֵֽם־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/003/002.yaml
  text: Only the people were sacrificing at the high places[a], because no house had yet been built for the name of Yahweh in those days.
translation:
  language: hi
  text: केवल लोग ही ऊँचे स्थानों[a] पर बलिदान चढ़ाते थे, क्योंकि उस समय तक यहोवा के नाम के लिये कोई भवन नहीं बनाया गया था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात स्थानीय उपासना-स्थल, जो प्रायः ऊँची जगहों पर होते थे। आगे का “भवन” यरूशलेम में यहोवा के नाम के लिये बनाए जानेवाले मन्दिर को सूचित करता है; इब्रानी में शाब्दिक अर्थ “घर” है।
    reason: सांस्कृतिक और शब्दार्थ-संबंधी स्पष्टीकरण
lexical_decisions:
- source_word: רַק
  choice: केवल
  rationale: यह पिछले कथन पर एक सीमा या अपवाद प्रकट करता है; ‘केवल’ उस अर्थ को स्वाभाविक रूप से व्यक्त करता है।
- source_word: הָעָם
  choice: लोग
  rationale: यह सामान्य रूप से प्रजा या लोगों को सूचित करता है; यहाँ किसी तकनीकी सामाजिक वर्ग का संकेत आवश्यक नहीं है।
- source_word: מְזַבְּחִים
  choice: बलि चढ़ाते थे
  rationale: प्रतिभागी रूप लगातार या प्रचलित क्रिया दिखाता है, जिसे हिन्दी में अभ्यस्त भूतकाल स्वाभाविक रूप से व्यक्त करता है।
- source_word: בַּבָּמוֹת
  choice: पूजा के ऊँचे स्थानों पर
  rationale: במות स्थानीय उपासना-स्थलों को सूचित करता है, जो प्रायः ऊँचे स्थानों पर होते थे; ‘पूजा के’ अर्थ को स्पष्ट करता है, पर इसे सीधे ‘मन्दिर’ नहीं बनाता।
- source_word: כִּי
  choice: क्योंकि
  rationale: संयोजक यहाँ लोगों द्वारा ऊँचे स्थानों पर बलि चढ़ाने का कारण बताता है।
- source_word: לֹא נִבְנָה בַיִת
  choice: कोई भवन नहीं बनाया गया था
  rationale: निफ़अल रूप निष्क्रिय पूर्ण क्रिया है। ‘भवन’ मूल ‘घर’ के अर्थ को रखता है और हिन्दी में पवित्र संरचना के संदर्भ में अधिक सहज है; ‘मन्दिर’ को पादटिप्पणी में स्पष्ट किया गया है।
- source_word: לְשֵׁם יְהוָה
  choice: यहोवा के नाम के लिए
  rationale: मूल की विशिष्ट मन्दिर-संबंधी अभिव्यक्ति को बनाए रखा गया है और इसे केवल ‘यहोवा के लिए’ कहकर सरल नहीं किया गया।
- source_word: יְהוָה
  choice: यहोवा
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को हिन्दी में प्रचलित ध्वन्यात्मक रूप ‘यहोवा’ से व्यक्त किया गया है।
- source_word: עַד הַיָּמִים הָהֵם
  choice: उन दिनों तक
  rationale: यह मूल कालवाचक अभिव्यक्ति को निकटता से सुरक्षित रखता है; सन्दर्भ में इसका आशय उस समय तक है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: प्रभु
  rationale: मूल पाठ व्यक्तिगत वाचा-नाम का प्रयोग करता है; ‘यहोवा’ उसे सामान्य उपाधि में बदलने के बजाय नाम के रूप में बनाए रखता है।
- issue: בַיִת को भवन या मन्दिर कहना
  choice: मुख्य पाठ में ‘भवन’, पादटिप्पणी में मन्दिर का अर्थ
  alternative: मन्दिर
  rationale: मूल शब्द का सामान्य अर्थ ‘घर/भवन’ है, जबकि ‘यहोवा के नाम के लिए’ वाक्यांश उसके मन्दिर होने का संकेत देता है। इस प्रकार मूल रूपक सुरक्षित रहता है और अर्थ भी स्पष्ट होता है।
- issue: ऊँचे स्थानों के प्रति पद का मूल्यांकन
  choice: वर्णनात्मक भाषा
  alternative: उन्हें सीधे अवैध या मूर्तिपूजक स्थल कहना
  rationale: इस पद में कारण दिया गया है कि मन्दिर अभी नहीं बना था; पाठ स्वयं यहाँ सभी ऊँचे स्थानों पर की गई उपासना का स्पष्ट नैतिक निर्णय नहीं सुनाता।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट शैली। अभ्यस्त क्रिया के लिए ‘बलि चढ़ाते थे’ और मन्दिर-संबंधी मूल अभिव्यक्ति के लिए ‘यहोवा के नाम के लिए’ रखा गया है।
