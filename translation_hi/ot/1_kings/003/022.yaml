  yaml_path: translation/ot/1_kings/003/022.yaml
  text: But the other woman said[a], “No! My son is the living one, and your son is the dead one.” And this one said, “No! Your son is the dead one, and my son is the living one.” So they spoke before the king.
translation:
  language: hi
  text: परन्तु दूसरी स्त्री ने कहा[a], “नहीं! मेरा बेटा जीवित है और तुम्हारा बेटा मरा हुआ है।” तब यह स्त्री बोली, “नहीं! तुम्हारा बेटा मरा हुआ है और मेरा बेटा जीवित है।” इस प्रकार वे राजा के सामने बोलती रहीं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, अधिक शाब्दिक ढंग से, “मेरा बेटा जीवित बच्चा है और तुम्हारा बेटा मृत बच्चा है ... तुम्हारा बेटा मृत बच्चा है और मेरा बेटा जीवित बच्चा है।” इब्रानी में “जीवित” और “मृत” के साथ निश्चित लेख दोनों पहचाने हुए बच्चों के विरोध को उभारता है; मुख्य पाठ इसे स्वाभाविक हिन्दी में व्यक्त करता है।
    reason: lexical_alternative
