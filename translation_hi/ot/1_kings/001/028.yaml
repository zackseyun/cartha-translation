- source_word: וַיֹּאמֶר
  choice: कहा
  rationale: אמר बोलने के लिए प्रयुक्त सामान्य क्रिया है; ‘कहा’ इसका सीधा और स्वाभाविक हिन्दी रूप है।
- source_word: קִרְאוּ לִי
  choice: मेरे पास बुलाओ
  rationale: קרא के साथ ל किसी व्यक्ति को बुलाने का भाव देता है। यह राजकीय आदेश की प्रत्यक्षता बनाए रखता है, बिना अनावश्यक रूप से औपचारिक हुए।
- source_word: לְבַת שָׁבַע
  choice: बतशेबा
  rationale: व्यक्तिवाचक नाम का प्रचलित हिन्दी लिप्यंतरण चुना गया है।
- source_word: וַתָּבֹא לִפְנֵי הַמֶּלֶךְ
  choice: वह राजा के सामने आई
  rationale: בוא + לפני राजा की उपस्थिति में आने का संकेत देता है; ‘सामने आई’ संक्षिप्त, स्वाभाविक और स्रोत के निकट है।
- source_word: וַתַּעֲמֹד לִפְנֵי הַמֶּלֶךְ
  choice: राजा के सामने खड़ी हुई
  rationale: עמד का मूल अर्थ ‘खड़ा होना’ है। ‘राजा के सामने’ की पुनरावृत्ति इब्रानी पाठ की दरबारी औपचारिकता को बनाए रखती है।
