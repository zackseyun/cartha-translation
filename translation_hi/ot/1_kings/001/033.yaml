  text: וַ/יֹּ֨אמֶר הַ/מֶּ֜לֶךְ לָ/הֶ֗ם קְח֤וּ עִמָּ/כֶם֙ אֶת עַבְדֵ֣י אֲדֹנֵי/כֶ֔ם וְ/הִרְכַּבְתֶּם֙ אֶת שְׁלֹמֹ֣ה בְנִ֔/י עַל הַ/פִּרְדָּ֖ה אֲשֶׁר לִ֑/י וְ/הוֹרַדְתֶּ֥ם אֹת֖/וֹ אֶל גִּחֽוֹן־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/033.yaml
  text: And the king said to them[a], “Take with you the servants of your lord, and have my son Solomon ride on the mule that is mine, and bring him down to Gihon.”
translation:
  language: hi
  text: तब राजा ने उनसे कहा, “अपने स्वामी के सेवकों को अपने साथ लो, और मेरे पुत्र सुलैमान को उस खच्चर पर सवार कराओ जो मेरा है; फिर उसे नीचे गीहोन तक ले जाओ।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עַבְדֵי
  choice: सेवकों
  rationale: राजदरबार के इस प्रसंग में यह शब्द राजा के अधीन सेवकों या अधिकारियों को सूचित करता है; ‘दासों’ से बंधुआ स्थिति अनावश्यक रूप से प्रमुख हो जाती।
- source_word: אֲדֹנֵיכֶם
  choice: अपने स्वामी के
  rationale: राजा अपने लिए सम्मानसूचक तृतीय पुरुष प्रयोग करता है। ‘स्वामी’ औपचारिक राजकीय भाव को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: וְהִרְכַּבְתֶּם
  choice: सवार कराओ
  rationale: हिफ़ील रूप का प्रेरणार्थक अर्थ स्पष्ट करता है कि संबोधित लोगों को सुलैमान को खच्चर पर चढ़वाना और सवारी करानी है।
- source_word: הַפִּרְדָּה
  choice: उस खच्चर पर
  rationale: פִּרְדָּה खच्चर को सूचित करता है। लिंग इस प्रसंग में अर्थ की दृष्टि से महत्त्वपूर्ण नहीं है; संकेतवाचक ‘उस’ आगे आने वाले संबंधवाचक उपवाक्य से स्वाभाविक रूप से जुड़ता है।
- source_word: אֲשֶׁר לִי
  choice: जो मेरा है
  rationale: स्रोत की संबंधवाचक संरचना और राजा के निजी स्वामित्व पर बल को सुरक्षित रखता है, जो राजकीय अधिकार का संकेत भी है।
- source_word: וְהוֹרַדְתֶּם
  choice: नीचे ... ले जाओ
  rationale: प्रेरणार्थक क्रिया और स्थलाकृतिक ‘नीचे’ जाने का भाव दोनों सुरक्षित रहते हैं।
- source_word: גִּחוֹן
  choice: गीहोन
  rationale: स्थान-नाम का हिन्दी लिप्यंतरण किया गया है।
- source_word: בְנִי
  choice: मेरे पुत्र
  rationale: स्पष्ट संबंध और उत्तराधिकार के प्रसंग में सुलैमान की पुत्रता दोनों बनाए रखे गए हैं।
- source_word: וַיֹּאמֶר הַמֶּלֶךְ
  choice: तब राजा ने ... कहा
  rationale: वाव-क्रमागत कथानक को आगे बढ़ाता है; आधुनिक हिन्दी कथा-प्रवाह में ‘तब’ स्वाभाविक है।
