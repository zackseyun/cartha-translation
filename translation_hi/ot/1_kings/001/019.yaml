source:
  edition: WLC
  text: וַ֠/יִּזְבַּח שׁ֥וֹר וּֽ/מְרִיא וְ/צֹאן֮ לָ/רֹב֒ וַ/יִּקְרָא֙ לְ/כָל בְּנֵ֣י הַ/מֶּ֔לֶךְ וּ/לְ/אֶבְיָתָר֙ הַ/כֹּהֵ֔ן וּ/לְ/יֹאָ֖ב שַׂ֣ר הַ/צָּבָ֑א וְ/לִ/שְׁלֹמֹ֥ה עַבְדְּ/ךָ֖ לֹ֥א קָרָֽא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/019.yaml
  text: And he sacrificed oxen[a], fattened cattle, and sheep in abundance, and he invited all the king’s sons, Abiathar the priest, and Joab the commander of the army[b]; but he did not invite Solomon your servant.
translation:
  language: hi
  text: उसने बहुत-से बैलों, मोटे किए हुए पशुओं और भेड़-बकरियों का बलिदान किया और राजा के सभी पुत्रों, अबियातार याजक और सेनापति योआब को निमंत्रित किया; परन्तु आपके सेवक सुलैमान को निमंत्रित नहीं किया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּזְבַּח
  choice: बलिदान किया
  rationale: זבח यहाँ साधारण वध नहीं, बलि के लिए पशु चढ़ाने को व्यक्त करता है।
- source_word: שׁוֹר
  choice: बैलों
  rationale: यह गोवंश के पशुओं का सामूहिक उल्लेख है; 'बैल' स्वाभाविक हिन्दी है और पशुओं के नर होने पर अनावश्यक ज़ोर नहीं डालता।
- source_word: מְרִיא
  choice: मोटे किए हुए पशुओं
  rationale: यह विशेष रूप से खिलाकर मोटे किए गए पशुधन को दर्शाता है; हिन्दी में यह अर्थ स्पष्ट और सहज है।
- source_word: צֹאן
  choice: भेड़-बकरियों
  rationale: हिब्रू शब्द छोटे पालतू झुंड-पशुओं की व्यापक श्रेणी है, जिसमें भेड़ और बकरियाँ दोनों आ सकती हैं; संयुक्त पद मूल की व्यापकता बचाता है।
- source_word: לָרֹב
  choice: बहुत-से
  rationale: यह बड़ी संख्या या प्रचुर मात्रा को व्यक्त करता है और पशुओं की पूरी सूची के साथ स्वाभाविक रूप से जुड़ता है।
- source_word: וַיִּקְרָא / לֹא קָרָא
  choice: निमंत्रित किया / निमंत्रित नहीं किया
  rationale: קרא का मूल अर्थ 'बुलाना' है, पर बलिदानी भोज में लोगों को उपस्थित होने के लिए बुलाने के संदर्भ में 'निमंत्रित करना' सबसे स्वाभाविक है; दोनों प्रयोगों में समानता रखी गई है।
- source_word: לְכָל בְּנֵי הַמֶּלֶךְ
  choice: राजा के सभी पुत्रों
  rationale: यह मूल के पुरुषवाचक और राजपरिवार-संबंधी अर्थ को सीधे बनाए रखता है।
- source_word: אֶבְיָתָר הַכֹּהֵן
  choice: अबियातार याजक
  rationale: व्यक्तिनाम का देवनागरी लिप्यंतरण और पदवी का प्रचलित बाइबलीय हिन्दी अनुवाद किया गया है।
- source_word: יֹאָב שַׂר הַצָּבָא
  choice: सेनापति योआब
  rationale: שַׂר הַצָּבָא सेना के सर्वोच्च अधिकारी को दर्शाता है; 'सेनापति' संक्षिप्त, प्रतिष्ठित और स्पष्ट आधुनिक हिन्दी है।
- source_word: וְלִשְׁלֹמֹה עַבְדְּךָ לֹא קָרָא
  choice: परन्तु आपके सेवक सुलैमान को निमंत्रित नहीं किया
  rationale: वाव यहाँ पूर्ववर्ती आमंत्रित व्यक्तियों के विपरीत सुलैमान के बहिष्कार को सामने लाता है; 'आपके सेवक' बतशेबा की दाऊद के प्रति आदरसूचक भाषा को सुरक्षित रखता है।
