  text: וַ/יֹּאמֶר֮ נָתָן֒ אֲדֹנִ֣/י הַ/מֶּ֔לֶךְ אַתָּ֣ה אָמַ֔רְתָּ אֲדֹנִיָּ֖הוּ יִמְלֹ֣ךְ אַחֲרָ֑/י וְ/ה֖וּא יֵשֵׁ֥ב עַל כִּסְאִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/024.yaml
  text: Then Nathan said[a], “My lord the king, have you said, ‘Adonijah will reign after me, and he will sit on my throne’?”
translation:
  language: hi
  text: तब नातान ने कहा,[a] “मेरे प्रभु महाराज, क्या आपने कहा है, ‘अदोनिय्याह मेरे बाद राजा होगा और वही मेरे सिंहासन पर बैठेगा’?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “क्या आपने कहा था।” इस प्रश्न में इब्रानी पूर्ण क्रिया का अनुवाद हिन्दी में पूर्ण वर्तमान या सामान्य भूतकाल—दोनों रूपों में किया जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: तब ... ने कहा
  rationale: वाव-क्रमिक कथा को आगे बढ़ाता है; आधुनिक हिन्दी में ‘तब’ घटनाक्रम को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: मेरे प्रभु महाराज
  rationale: यह दाऊद के लिए आदरसूचक राजकीय संबोधन है; यह अनुवाद स्वामित्वसूचक सम्मान और राजकीय पदवी दोनों को स्वाभाविक हिन्दी में रखता है।
- source_word: אַתָּה אָמַרְתָּ
  choice: क्या आपने कहा है
  rationale: प्रश्न में इब्रानी पूर्ण क्रिया यह पूछती है कि क्या राजा ने वास्तव में ऐसी घोषणा की है; हिन्दी का पूर्ण वर्तमान इस बल को व्यक्त करता है।
- source_word: אֲדֹנִיָּהוּ
  choice: अदोनिय्याह
  rationale: व्यक्तिनाम का प्रचलित हिन्दी बाइबलीय लिप्यंतरण।
- source_word: יִמְלֹךְ
  choice: राजा होगा
  rationale: उत्तराधिकार के संदर्भ में क्रिया का अर्थ ‘राज करना/राजा होना’ है; ‘राजा होगा’ साधारण आधुनिक हिन्दी में आशय स्पष्ट रखता है।
- source_word: אַחֲרָי
  choice: मेरे बाद
  rationale: यह संक्षेप में राजकीय उत्तराधिकार का क्रम बताता है और इब्रानी की अभिव्यक्ति को बिना विस्तार दिए सुरक्षित रखता है।
- source_word: וְהוּא יֵשֵׁב עַל־כִּסְאִי
  choice: और वही मेरे सिंहासन पर बैठेगा
  rationale: ‘सिंहासन पर बैठना’ राजकीय उत्तराधिकार का मूल बिंब सुरक्षित रखता है; स्वतंत्र सर्वनाम הוּא के बल को ‘वही’ व्यक्त करता है।
