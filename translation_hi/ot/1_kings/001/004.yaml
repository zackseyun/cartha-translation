  edition: WLC
  text: וְ/הַֽ/נַּעֲרָ֖ה יָפָ֣ה עַד מְאֹ֑ד וַ/תְּהִ֨י לַ/מֶּ֤לֶךְ סֹכֶ֨נֶת֙ וַ/תְּשָׁ֣רְתֵ֔/הוּ וְ/הַ/מֶּ֖לֶךְ לֹ֥א יְדָעָֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/004.yaml
  text: The young woman was very beautiful[a], and she became the king’s attendant and served him, but the king did not know her.
translation:
  language: hi
  text: वह युवती बहुत सुन्दर थी, और वह राजा की परिचारिका बनी और उसकी सेवा की; पर राजा ने उसके साथ यौन-सम्बन्ध नहीं बनाए[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक, ‘राजा ने उसे नहीं जाना।’ यहाँ इब्रानी ‘जानना’ यौन-सम्बन्ध के लिए प्रयुक्त शिष्टोक्ति है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנַּעֲרָה
  choice: वह युवती
  rationale: नַעֲרָה एक युवा स्त्री को सूचित करता है। ‘युवती’ आधुनिक, स्वाभाविक और गरिमापूर्ण हिन्दी है।
- source_word: יָפָה עַד מְאֹד
  choice: अत्यन्त सुन्दर थी
  rationale: यह पदबंध सौन्दर्य पर प्रबल बल देता है; ‘अत्यन्त सुन्दर’ उस तीव्रता को सहज हिन्दी में व्यक्त करता है।
- source_word: סֹכֶנֶת
  choice: परिचारिका
  rationale: यह शब्द राजा की व्यक्तिगत देखभाल और सहायता से जुड़ी भूमिका बताता है। ‘परिचारिका’ भूमिका को व्यापक रखता है और अनावश्यक रूप से चिकित्सकीय या रोमानी अर्थ नहीं जोड़ता।
- source_word: וַתְּשָׁרְתֵהוּ
  choice: उसकी सेवा करने लगी
  rationale: שרת का सामान्य अर्थ सेवा करना है। यह चयन कथा के प्रसंग में स्पष्ट और स्वाभाविक है।
- source_word: יְדָעָהּ
  choice: उसे नहीं जाना
  rationale: ידע यहाँ यौन-सम्बन्ध के लिए प्रयुक्त इब्रानी शिष्टोक्ति है। मुख्य पाठ में मूल रूपक रखा गया है और उसका आशय पादटिप्पणी में स्पष्ट किया गया है।
theological_decisions:
- issue: कथा में यौन-सम्बन्ध के लिए प्रयुक्त शिष्टोक्ति
  choice: मुख्य पाठ में ‘उसे नहीं जाना’ रखकर पादटिप्पणी में यौन अर्थ स्पष्ट किया गया है।
  alternative: ‘उसके साथ यौन-सम्बन्ध नहीं बनाए’ या ‘उसके साथ नहीं सोया।’
  rationale: यह मूल इब्रानी की साहित्यिक अभिव्यक्ति को सुरक्षित रखता है और साथ ही पाठक को उसका अभिप्रेत अर्थ स्पष्ट करता है। इससे न तो दाऊद और अबीशग के बीच यौन-सम्बन्ध का संकेत छिपता है, न मूल पाठ से अधिक कुछ कहा जाता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज किंतु गरिमापूर्ण कथात्मक रूप अपनाया गया है। ‘परिचारिका’ सेवा और व्यक्तिगत देखभाल, दोनों की सम्भावना खुली रखता है; ‘उसे नहीं जाना’ मूल शिष्टोक्ति को पादटिप्पणी सहित सुरक्षित रखता है।
