base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/041.yaml
  text: Adonijah and all the invited guests who were with him heard it as they finished eating[a]. And when Joab heard the sound of the trumpet, he said[b], “Why is the sound of the city in an uproar?”
translation:
  language: hi
  text: जब अदोनिय्याह और उसके साथ के सभी आमंत्रित अतिथि भोजन समाप्त ही कर रहे थे[a], तब उन्होंने वह आवाज़ सुनी। नरसिंगे[b] की आवाज़ सुनकर योआब ने पूछा, “नगर में यह कोलाहल क्यों मचा है?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “जब वे भोजन समाप्त कर चुके थे।” इब्रानी वाक्यांश का अर्थ या तो भोजन पूरा हो जाने का समय हो सकता है या वह क्षण जब वे उसे समाप्त ही कर रहे थे।
    reason: lexical_alternative
  - marker: b
    text: 'इब्रानी: शोफ़ार—सार्वजनिक संकेत देने के लिए बजाया जाने वाला सींग से बना फूँक-वाद्य।'
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: उन्होंने वह आवाज़ सुनी
  rationale: क्रिया का मूल अर्थ ‘सुना’ है। प्रसंग में निहित कर्म नगर से आती आवाज़ है, इसलिए स्वाभाविक हिन्दी के लिए ‘वह आवाज़’ स्पष्ट किया गया है।
- source_word: הַקְּרֻאִים
  choice: आमंत्रित अतिथि
  rationale: קרא का कर्मवाच्य कृदन्त भोज के लिए बुलाए गए लोगों को दर्शाता है; ‘आमंत्रित अतिथि’ आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: וְהֵם כִּלּוּ לֶאֱכֹל
  choice: भोजन समाप्त ही कर रहे थे
  rationale: यह उपवाक्य सुनने के समय को भोजन के अंत से जोड़ता है। इब्रानी में भोजन पूरा हो जाने अथवा उसी समय पूरा होने की सम्भावना है; मुख्य पाठ में निकट-समापन का भाव रखा गया और विकल्प पादटिप्पणी में दिया गया है।
- source_word: קוֹל הַשּׁוֹפָר
  choice: नरसिंगे की आवाज़
  rationale: שׁוֹפָר सार्वजनिक संकेत देने के लिए प्रयुक्त सींग का वाद्य था। ‘नरसिंगा’ हिन्दी में सींगनुमा फूँक-वाद्य का सुबोध सांस्कृतिक समतुल्य है; वस्तु की प्रकृति पादटिप्पणी में स्पष्ट की गई है।
- source_word: מַדּוּעַ
  choice: कैसा
  rationale: शाब्दिक अर्थ ‘क्यों’ है, पर קוֹל ... הוֹמָה के साथ हिन्दी में ‘यह कैसा कोलाहल’ कारण पूछने वाला स्वाभाविक प्रश्न है और आश्चर्य तथा पूछताछ दोनों को व्यक्त करता है।
- source_word: קוֹל הַקִּרְיָה הוֹמָה
  choice: नगर में यह कैसा कोलाहल मचा है
  rationale: शाब्दिक संरचना ‘नगर की आवाज़ कोलाहल कर रही है’ हिन्दी में असहज है। यह अनुवाद नगर के शोर और उसकी उथल-पुथल भरी तीव्रता को स्वाभाविक रूप में व्यक्त करता है।
- source_word: אֲדֹנִיָּהוּ
  choice: अदोनिय्याह
  rationale: व्यक्तिवाचक नाम का प्रचलित हिन्दी बाइबलीय लिप्यन्तरण।
- source_word: יוֹאָב
  choice: योआब
  rationale: व्यक्तिवाचक नाम का प्रचलित हिन्दी बाइबलीय लिप्यन्तरण।
