  text: וַ/יֻּגַּ֤ד לִ/שְׁלֹמֹה֙ לֵ/אמֹ֔ר הִנֵּה֙ אֲדֹ֣נִיָּ֔הוּ יָרֵ֖א אֶת הַ/מֶּ֣לֶךְ שְׁלֹמֹ֑ה וְ֠/הִנֵּה אָחַ֞ז בְּ/קַרְנ֤וֹת הַ/מִּזְבֵּ֨חַ֙ לֵ/אמֹ֔ר יִשָּֽׁבַֽע לִ֤/י כַ/יּוֹם֙ הַ/מֶּ֣לֶךְ שְׁלֹמֹ֔ה אִם יָמִ֥ית אֶת עַבְדּ֖/וֹ בֶּ/חָֽרֶב־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/051.yaml
  text: And it was reported to Solomon, saying, “Look, Adonijah fears King Solomon, and look, he has taken hold of the horns of the altar, saying, ‘Let King Solomon swear to me today that he will not put his servant to death with the sword.’”
translation:
  language: hi
  text: 'तब सुलैमान को यह समाचार दिया गया: “देखिए, अदोनिय्याह राजा सुलैमान से डर रहा है; और देखिए, उसने वेदी के सींगों को पकड़ रखा है और कह रहा है, ‘राजा सुलैमान आज मेरे लिए शपथ लें कि वे मुझे, अपने इस सेवक को, तलवार से मार न डालें।’”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֻּגַּד לִשְׁלֹמֹה
  choice: सुलैमान को यह समाचार दिया गया
  rationale: हिब्रू के अज्ञात कर्ता वाले निष्क्रिय रूप को स्वाभाविक हिंदी निष्क्रिय वाक्य में रखा गया है।
- source_word: הִנֵּה
  choice: देखिए
  rationale: यहाँ सूचना की ओर तत्काल ध्यान खींचने वाला भाव है; दोहराव को हिंदी में पहले 'देखिए' और फिर अगले स्वतंत्र वाक्य की प्रत्यक्षता से व्यक्त किया गया है।
- source_word: יָרֵא אֶת־הַמֶּלֶךְ שְׁלֹמֹה
  choice: राजा सुलैमान से डर रहा है
  rationale: יָרֵא का प्रसंगगत अर्थ भयभीत होना है, न कि श्रद्धापूर्वक भय मानना।
- source_word: קַרְנוֹת הַמִּזְבֵּחַ
  choice: वेदी के सींगों
  rationale: प्राचीन वेदी के कोनों पर बने सींग-जैसे उभारों के लिए पारंपरिक और रूप-संगत पदावली रखी गई है।
- source_word: כַיּוֹם
  choice: आज
  rationale: इस शपथ को उसी समय तुरंत लेने की माँग का सामान्य हिंदी रूप।
- source_word: אִם־יָמִית אֶת־עַבְדּוֹ בֶּחָרֶב
  choice: वह अपने सेवक को तलवार से मरवा नहीं डालेंगे
  rationale: शपथ-सूत्र में אִם निषेधात्मक आशय देता है; causative הֵמִית को 'मरवा डालना' से व्यक्त किया गया है।
theological_decisions:
- issue: वेदी के सींग पकड़ने का आशय
  choice: केवल ऐतिहासिक क्रिया का सीधा वर्णन
  alternative: इसे स्पष्ट रूप से शरण के स्थापित धार्मिक अधिकार की माँग कहना
  rationale: पद क्रिया का वर्णन करता है, पर उसके कानूनी या धार्मिक प्रभाव की व्याख्या नहीं करता; इसलिए पाठ से अधिक नहीं जोड़ा गया।
- issue: ‘अपने सेवक’ का अर्थ
  choice: अदोनिय्याह का सुलैमान के प्रति आत्म-विनम्र संबोधन
  alternative: औपचारिक पद या स्थायी दासता का संकेत
  rationale: यह राजकीय विनय का तृतीय-पुरुष आत्मसंदर्भ है; अनावश्यक संस्थागत अर्थ नहीं जोड़ा गया।
translation_notes:
  register: आधुनिक मानक हिंदी, सम्मानसूचक राजकीय संबोधन और सहज कथात्मक प्रवाह। हिब्रू के बार-बार आने वाले ‘कहते हुए/कह रहा है’ ढाँचे को अर्थ सुरक्षित रखते हुए स्वाभाविक प्रत्यक्ष कथन में बदला गया है।
