language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/אַתָּה֙ אֲדֹנִ֣/י הַ/מֶּ֔לֶךְ עֵינֵ֥י כָל יִשְׂרָאֵ֖ל עָלֶ֑י/ךָ לְ/הַגִּ֣יד לָ/הֶ֔ם מִ֗י יֵשֵׁ֛ב עַל כִּסֵּ֥א אֲדֹנִֽ/י הַ/מֶּ֖לֶךְ אַחֲרָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/020.yaml
  text: And you[a], my lord the king, the eyes of all Israel are on you[b], to tell them who will sit on the throne of my lord the king after him.
translation:
  language: hi
  text: और हे मेरे स्वामी राजा, सारे इस्राएल की आँखें आप पर लगी हैं कि आप उन्हें बताएँ कि मेरे स्वामी राजा के सिंहासन पर उनके बाद कौन बैठेगा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: हे मेरे स्वामी राजा
  rationale: यह आदरपूर्ण राजकीय संबोधन है। ‘हे’ संबोधन को स्पष्ट करता है, जबकि ‘मेरे स्वामी राजा’ मूल के स्वामित्वसूचक आदर और राजकीय पदवी दोनों को बनाए रखता है।
- source_word: עֵינֵי כָל יִשְׂרָאֵל עָלֶיךָ
  choice: सारे इस्राएल की आँखें आप पर लगी हैं
  rationale: यह चयन मूल की आँखों वाली सजीव उपमा को बनाए रखते हुए आधुनिक हिन्दी में अपेक्षा और ध्यान का स्वाभाविक भाव व्यक्त करता है।
- source_word: לְהַגִּיד לָהֶם
  choice: कि आप उन्हें बताएँ
  rationale: हिफ़ील रूप यहाँ सूचना प्रकट करने या बताने का अर्थ देता है। हिन्दी में उद्देश्यसूचक रचना के लिए ‘कि आप उन्हें बताएँ’ सहज है।
- source_word: מִי יֵשֵׁב
  choice: कौन बैठेगा
  rationale: राजसिंहासन के संदर्भ में यह भावी उत्तराधिकार को सूचित करता है; ‘बैठेगा’ मूल क्रिया का चित्र भी बनाए रखता है।
- source_word: עַל כִּסֵּא
  choice: सिंहासन पर
  rationale: כִּסֵּא का सीधा अर्थ ‘सिंहासन’ और עַל का अर्थ ‘पर’ है; यह राजकीय संदर्भ में स्वाभाविक हिन्दी है।
- source_word: אַחֲרָיו
  choice: उनके बाद
  rationale: तीसरे पुरुष पुल्लिंग एकवचन प्रत्यय का संदर्भ राजा दाऊद से है। आदरसूचक हिन्दी में ‘उनके बाद’ व्यक्ति-संदर्भ और उत्तराधिकार का भाव दोनों सुरक्षित रखता है।
theological_decisions:
- issue: אַחֲרָיו में सर्वनाम का संदर्भ
  choice: ‘उनके बाद’—अर्थात राजा दाऊद के बाद
  alternative: ‘इसके बाद’ या केवल ‘बाद में’
  rationale: इब्रानी में पुरुषवाचक एकवचन प्रत्यय है और निकटतम संदर्भ संबोधित राजा है। इसलिए इसे केवल कालसूचक बनाना मूल के स्पष्ट व्यक्ति-संदर्भ को कमजोर कर देगा।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और दरबारी आदर के अनुरूप रखी गई है। ‘सारे इस्राएल की आँखें आप पर लगी हैं’ मूल इब्रानी मुहावरे की छवि को स्वाभाविक हिन्दी में सुरक्षित रखता है।
