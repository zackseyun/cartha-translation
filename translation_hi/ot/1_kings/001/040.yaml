  text: וַ/יַּעֲל֤וּ כָל הָ/עָם֙ אַֽחֲרָ֔י/ו וְ/הָ/עָם֙ מְחַלְּלִ֣ים בַּ/חֲלִלִ֔ים וּ/שְׂמֵחִ֖ים שִׂמְחָ֣ה גְדוֹלָ֑ה וַ/תִּבָּקַ֥ע הָ/אָ֖רֶץ בְּ/קוֹלָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/040.yaml
  text: And all the people went up after him[a], and the people were playing flutes and rejoicing with great joy[b], and the earth split apart at their sound.
translation:
  language: hi
  text: और सभी लोग उसके पीछे ऊपर गए। लोग बाँसुरियाँ[a] बजा रहे थे और बहुत आनन्द मना रहे थे, और उनकी ध्वनि से धरती फट गई[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “बाँसुरी जैसे वायु-वाद्य”; इब्रानी शब्द नली के आकार वाले वायु-वाद्यों के लिए व्यापक रूप से प्रयुक्त हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: “धरती फट गई” सम्भवतः अतिशयोक्ति है, जो उत्सव की अत्यन्त प्रबल ध्वनि का वर्णन करती है।
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּעֲלוּ
  choice: ऊपर गई
  rationale: क्रिया עלה का मूल अर्थ ‘ऊपर जाना/चढ़ना’ है। प्रसंग में यह जुलूस की ऊपर की ओर गति को दर्शाता है; इसलिए ठोस स्थानिक भाव बनाए रखा गया है।
- source_word: כָל הָעָם
  choice: सारी प्रजा
  rationale: सामूहिक संज्ञा עָם और כָל का स्वाभाविक हिन्दी रूप; राजकीय और सार्वजनिक प्रसंग में ‘प्रजा’ उपयुक्त है।
- source_word: אַחֲרָיו
  choice: उसके पीछे
  rationale: यह जुलूस में किसी के पीछे चलने का अर्थ देता है और हिन्दी में स्पष्ट तथा स्वाभाविक है।
- source_word: מְחַלְּלִים בַּחֲלִלִים
  choice: बाँसुरियाँ बजा रहे थे
  rationale: यहाँ क्रिया और संज्ञा बाँसुरी जैसे वायु-वाद्य बजाने को सूचित करते हैं। ‘बाँसुरियाँ बजाना’ सहज हिन्दी है; व्यापक वाद्य-अर्थ को पाद-टिप्पणी में रखा गया है।
- source_word: וּשְׂמֵחִים שִׂמְחָה גְדוֹלָה
  choice: बड़े आनन्द के साथ आनन्द मना रहे थे
  rationale: इब्रानी में एक ही मूल से बनी क्रिया और संज्ञा का बलात्मक प्रयोग है। हिन्दी में हल्की पुनरुक्ति रखकर उसके जोर और उत्सवपूर्ण भाव को संरक्षित किया गया है।
- source_word: וַתִּבָּקַע הָאָרֶץ
  choice: धरती फट गई
  rationale: בקע का अर्थ ‘फटना/चिर जाना’ है। यह रूप मूल की सजीव अतिशयोक्तिपूर्ण छवि को बिना शाब्दिक भूगर्भीय व्याख्या थोपे बनाए रखता है।
- source_word: בְּקוֹלָם
  choice: उनकी आवाज़ से
  rationale: קוֹל आवाज़, ध्वनि या शोर का अर्थ दे सकता है। यहाँ लोगों और वाद्यों की सम्मिलित ध्वनि अभिप्रेत है; ‘आवाज़’ सामान्य पाठक के लिए स्वाभाविक और पर्याप्त व्यापक है।
