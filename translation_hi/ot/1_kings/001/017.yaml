base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/017.yaml
  text: She said to him, “My lord, you swore by the LORD your God to your female servant, ‘Surely Solomon your son will reign after me, and he will sit on my throne.’”
translation:
  language: hi
  text: उसने उससे कहा, “मेरे प्रभु, आपने अपनी दासी से अपने परमेश्वर यहोवा की शपथ खाकर कहा था, ‘निश्चय ही तुम्हारा पुत्र सुलैमान मेरे बाद राजा होगा और वही मेरे सिंहासन पर बैठेगा।’”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֲדֹנִי
  choice: मेरे प्रभु
  rationale: राजा को संबोधित आदरसूचक पद का स्वाभाविक और गरिमापूर्ण हिन्दी रूप।
- source_word: בַיהוָה אֱלֹהֶיךָ
  choice: अपने परमेश्वर यहोवा की शपथ खाकर
  rationale: दिव्य नाम को ‘यहोवा’ के रूप में रखते हुए शपथ-सूचक हिब्रू प्रयोग को स्पष्ट हिन्दी में व्यक्त करता है।
- source_word: לַאֲמָתֶךָ
  choice: अपनी दासी से
  rationale: वक्ता की विनम्र आत्म-संज्ञा को सुरक्षित रखता है; शाब्दिक स्त्रीलिंग अर्थ भी बना रहता है।
- source_word: כִּי
  choice: निश्चय ही
  rationale: प्रत्यक्ष कथन के आरंभ में प्रयुक्त कण की आश्वासनात्मक/प्रबलता दर्शाने वाली सम्भावना को व्यक्त करता है।
- source_word: יִמְלֹךְ
  choice: राजा होगा
  rationale: राज्य करने के अर्थ को साधारण आधुनिक हिन्दी में स्वाभाविक रूप से व्यक्त करता है।
- source_word: וְהוּא
  choice: और वही
  rationale: स्वतंत्र सर्वनाम के संभावित बल को हिन्दी में ‘वही’ द्वारा सुरक्षित रखता है।
theological_decisions:
- issue: प्रतिज्ञा में כִּי का बल
  choice: ‘निश्चय ही’ के रूप में व्यक्त किया
  alternative: इसे केवल कथन-परिचायक मानकर अनूदित न करना
  rationale: यहाँ शपथ के भीतर उत्तराधिकार की दृढ़ प्रतिज्ञा है; ‘निश्चय ही’ उस बल को दिखाता है, पर कोई अतिरिक्त धार्मिक निष्कर्ष नहीं जोड़ता।
- issue: दिव्य नाम יהוה का निरूपण
  choice: यहोवा
  alternative: प्रभु
  rationale: मूल में व्यक्तिगत दिव्य नाम है; ‘यहोवा’ उसे उपाधि ‘प्रभु’ से अलग और पाठ में प्रत्यक्ष बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; राजदरबार के संदर्भ के अनुरूप आदरपूर्ण किंतु सामान्य पाठकों के लिए सहज भाषा। ‘आपने’ और ‘अपनी दासी’ से संबोधन का सामाजिक स्तर तथा वक्ता की विनम्रता सुरक्षित है।
