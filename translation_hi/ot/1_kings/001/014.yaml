  yaml_path: translation/ot/1_kings/001/014.yaml
  text: Look[a], while you are still speaking there with the king, I will come in after you and confirm your words.
translation:
  language: hi
  text: देखो, जब तुम वहाँ राजा से अभी भी बात कर रही होगी, तब मैं तुम्हारे बाद भीतर आऊँगा और तुम्हारी बात की पुष्टि करूँगा।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “तुम्हारी बात पूरी करूँगा” अथवा “तुम्हारी कही बात में और जोड़ूँगा”; इब्रानी मुहावरे का अर्थ किसी की बात में समर्थन देने वाला विवरण जोड़कर उसकी पुष्टि करना भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: देख
  rationale: यह अव्यय आगे बताई जा रही योजना और उसके समय की ओर तुरंत ध्यान खींचता है; आधुनिक हिंदी में ‘देख’ स्वाभाविक और सजीव है।
- source_word: עוֹדָךְ מְדַבֶּרֶת
  choice: जब तू ... बात कर ही रही होगी
  rationale: स्त्रीलिंग एकवचन संबोधन के साथ जारी क्रिया और उसी दौरान होने वाली अगली कार्रवाई को व्यक्त करता है; ‘ही रही होगी’ निरंतरता और समय-संबंध दोनों स्पष्ट करता है।
- source_word: שָׁם עִם הַמֶּלֶךְ
  choice: वहाँ राजा से
  rationale: שָׁם को ‘वहाँ’ के रूप में बनाए रखा गया है। עִם का मूल भाव ‘साथ’ है, पर हिंदी में किसी से बात करने के लिए ‘राजा से बात’ अधिक स्वाभाविक है।
- source_word: וַאֲנִי אָבוֹא אַחֲרַיִךְ
  choice: तब मैं तेरे पीछे भीतर आऊँगा
  rationale: महल के प्रसंग में בוא राजा की उपस्थिति में प्रवेश का संकेत देता है; ‘भीतर’ इसे स्वाभाविक रूप से व्यक्त करता है, और ‘तेरे पीछे’ क्रम को सुरक्षित रखता है।
- source_word: וּמִלֵּאתִי אֶת דְּבָרָיִךְ
  choice: तेरी बात की पुष्टि करूँगा
  rationale: यह इब्रानी मुहावरा किसी की कही बात को पूरा करने, उसमें समर्थनकारी विवरण जोड़ने या उसकी पुष्टि करने का अर्थ दे सकता है। प्रसंग में नातान बतशेबा की बात का समर्थन करेगा, इसलिए मुख्य पाठ में ‘पुष्टि’ उपयुक्त है; व्यापक अर्थ-पट्टी पाद-टिप्पणी में रखी गई है।
