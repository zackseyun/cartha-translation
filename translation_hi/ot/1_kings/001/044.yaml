base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/044.yaml
  text: And the king sent with him Zadok the priest[a], Nathan the prophet, Benaiah son of Jehoiada, and the Cherethites and the Pelethites; and they mounted him on the king’s mule.
translation:
  language: hi
  text: राजा ने उसके साथ सादोक याजक, नातान भविष्यद्वक्ता, यहोयादा के पुत्र बनायाह, और करेतीयों तथा पलेतीयों को भेजा; और उन्होंने उसे राजा की खच्चरी पर सवार कराया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁלַח אִתּוֹ הַמֶּלֶךְ
  choice: राजा ने उसके साथ ... को भेजा
  rationale: इब्रानी वाक्य में राजा कर्ता है और אִתּוֹ साथ होने का भाव देता है। यह हिंदी में सीधा और स्वाभाविक कथात्मक रूप है।
- source_word: צָדוֹק הַכֹּהֵן
  choice: सादोक याजक
  rationale: व्यक्तिनाम का प्रचलित हिंदी लिप्यंतरण रखा गया है और כֹּהֵן के लिए प्रतिष्ठित बाइबलीय हिंदी शब्द ‘याजक’ चुना गया है।
- source_word: נָתָן הַנָּבִיא
  choice: नातान भविष्यद्वक्ता
  rationale: नाम को लिप्यंतरित किया गया है और נָבִיא का सामान्य तथा सटीक हिंदी रूप ‘भविष्यद्वक्ता’ रखा गया है।
- source_word: בְּנָיָהוּ בֶּן יְהוֹיָדָע
  choice: यहोयादा के पुत्र बनायाह
  rationale: इब्रानी वंशसूचक रचना को स्वाभाविक हिंदी क्रम में रखा गया है।
- source_word: הַכְּרֵתִי וְהַפְּלֵתִי
  choice: करेती तथा पलेती अंगरक्षकों
  rationale: समूहों के नाम लिप्यंतरित रखे गए हैं। संदर्भ में ये राजा के विशिष्ट सुरक्षादल हैं; ‘अंगरक्षकों’ से सामान्य पाठक को उनकी भूमिका स्पष्ट होती है, जबकि जातीय या व्युत्पत्तिगत पहचान पर अनावश्यक दावा नहीं किया जाता।
- source_word: וַיַּרְכִּבוּ אֹתוֹ
  choice: उन्होंने उसे ... पर सवार कराया
  rationale: हिफ़ील रूप का कारणवाचक अर्थ हिंदी के ‘सवार कराया’ से स्पष्ट रूप से व्यक्त होता है।
- source_word: עַל פִּרְדַּת הַמֶּלֶךְ
  choice: राजा की खच्चरी पर
  rationale: פִּרְדָּה मादा खच्चर को सूचित करती है। हिंदी ‘खच्चरी’ इस अर्थ को संक्षेप और स्वाभाविक ढंग से व्यक्त करती है।
theological_decisions: []
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और कथात्मक रखी गई है। नामों के लिए प्रचलित हिंदी बाइबलीय रूप अपनाए गए हैं। ‘खच्चरी’ मूल इब्रानी के स्त्रीलिंग पशु-सूचक शब्द को सीधे व्यक्त करती है, इसलिए अलग पादटिप्पणी आवश्यक नहीं मानी गई।
