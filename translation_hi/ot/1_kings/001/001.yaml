base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/001.yaml
  text: King David was old[a], advanced in days; and they covered him with garments, but he could not get warm.
translation:
  language: hi
  text: राजा दाऊद बूढ़े हो गए थे और उनकी आयु बहुत अधिक हो गई थी[a]। वे उन्हें वस्त्रों से ढकते थे, पर उन्हें गरमी नहीं मिलती थी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से, ‘दिनों में आ गए थे’; यह बहुत अधिक आयु हो जाने का मुहावरा है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/הַ/מֶּלֶךְ דָּוִד
  choice: राजा दाऊद
  rationale: מֶלֶךְ का सीधा अर्थ ‘राजा’ है और दाऊद के साथ यह उपाधि के रूप में स्वाभाविक है। आरंभिक וְ को हिंदी में अलग संयोजक से व्यक्त नहीं किया गया, क्योंकि नए दृश्य के आरंभ में ऐसा करना अधिक स्वाभाविक है और मूल में कोई स्पष्ट कालवाचक ‘अब’ नहीं है।
- source_word: זָקֵן
  choice: बूढ़े हो गए थे
  rationale: यह दाऊद की वृद्धावस्था को सीधे व्यक्त करता है। बहुवचन आदरसूचक क्रिया आधुनिक मानक हिंदी में स्वाभाविक है।
- source_word: בָּא בַּ/יָּמִים
  choice: उनकी आयु बहुत बढ़ गई थी
  rationale: शाब्दिक अर्थ ‘दिनों में आ पहुँचा’ है; यह इब्रानी मुहावरा बहुत अधिक आयु हो जाने को दर्शाता है। हिंदी रूप अर्थ को स्पष्ट रखते हुए मुहावरे की वृद्धावस्था-संबंधी शक्ति बनाए रखता है।
- source_word: וַ/יְכַסֻּ/הוּ
  choice: उन्हें … ढका जाता था
  rationale: मूल में कर्ता अनिर्दिष्ट बहुवचन है। हिंदी में अनिर्दिष्ट ‘वे’ या अतिरिक्त ‘लोग’ जोड़ने के बजाय कर्मवाच्य प्रयोग स्वाभाविक है और चल रहे देखभाल के प्रयास को व्यक्त करता है।
- source_word: בַּ/בְּגָדִים
  choice: वस्त्रों से
  rationale: בְּגָדִים का सामान्य अर्थ कपड़े या वस्त्र है। ‘वस्त्र’ गरिमापूर्ण और सटीक है; ‘कंबल’ कहना मूल से अधिक व्याख्यात्मक होता।
- source_word: וְ/לֹא יִחַם ל/וֹ
  choice: पर उन्हें गरमी नहीं मिलती थी
  rationale: חם यहाँ गरम होने या गरमी पाने को व्यक्त करता है। यह हिंदी वाक्यांश निरंतर असफल परिणाम को स्वाभाविक ढंग से बताता है; ‘पर’ पूर्व प्रयास और उसके निष्फल परिणाम के बीच स्पष्ट संदर्भगत विरोध दिखाता है।
