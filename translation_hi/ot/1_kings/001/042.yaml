  rationale: इस बहुअर्थी पद में वीरता, सामर्थ्य, प्रतिष्ठा या योग्यता निहित हो सकती है। यहाँ विश्वसनीय समाचारवाहक के संदर्भ में ‘योग्य व्यक्ति’ उपयुक्त है और विकल्प पादटिप्पणी में सुरक्षित हैं।
- source_word: וְטוֹב תְּבַשֵּׂר
  choice: और शुभ समाचार लाते हो
  rationale: वक्ता की यह अपेक्षा व्यक्त होती है कि योनातान अनुकूल समाचार लेकर आया है; वर्तमानकालीन हिन्दी प्रत्यक्ष कथन में स्वाभाविक है।
