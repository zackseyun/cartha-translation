  yaml_path: translation/ot/1_kings/001/042.yaml
  text: While he was still speaking[a], behold, Jonathan son of Abiathar the priest came. And Adonijah said, “Come in, for you are a worthy man and bring good news.”
translation:
  language: hi
  text: वह अभी बोल ही रहा था कि देखो, याजक अबियातार का पुत्र योनातान आ पहुँचा। अदोनिय्याह ने कहा, “भीतर आओ, क्योंकि तुम एक योग्य व्यक्ति हो[a] और शुभ समाचार लाते हो।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “वीर पुरुष,” “सामर्थी/कुशल व्यक्ति,” अथवा “प्रतिष्ठित व्यक्ति।” इब्रानी पद אִישׁ חַיִל प्रसंग के अनुसार वीरता, योग्यता, सामर्थ्य या सामाजिक प्रतिष्ठा का बोध करा सकता है।
    reason: lexical_alternative
