source:
  edition: WLC
  text: וַ/יְבַקְשׁוּ֙ נַעֲרָ֣ה יָפָ֔ה בְּ/כֹ֖ל גְּב֣וּל יִשְׂרָאֵ֑ל וַֽ/יִּמְצְא֗וּ אֶת אֲבִישַׁג֙ הַ/שּׁ֣וּנַמִּ֔ית וַ/יָּבִ֥אוּ אֹתָ֖/הּ לַ/מֶּֽלֶךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/003.yaml
  text: So they searched throughout all the territory of Israel for a beautiful young woman[b][a], and they found Abishag the Shunammite and brought her to the king.
translation:
  language: hi
  text: इसलिए उन्होंने इस्राएल के पूरे प्रदेश में एक सुन्दर युवती की खोज की। उन्हें शूनेम की रहनेवाली अबीशग मिली और वे उसे राजा के पास ले आए।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְבַקְשׁוּ
  choice: उन्होंने…खोज की
  rationale: בקשׁ यहाँ किसी उपयुक्त व्यक्ति को ढूँढ़ने के लिए की गई सक्रिय खोज बताता है; आधुनिक हिन्दी में ‘खोज की’ स्वाभाविक और स्पष्ट है।
- source_word: נַעֲרָה יָפָה
  choice: एक सुन्दर युवती
  rationale: נַעֲרָה विवाह-योग्य आयु की युवा स्त्री को सूचित कर सकता है; ‘युवती’ न तो अनावश्यक रूप से कम आयु बताता है, न पुरातन शैली अपनाता है। יָפָה का सीधा अर्थ ‘सुन्दर’ है।
- source_word: בְּכֹל גְּבוּל יִשְׂרָאֵל
  choice: इस्राएल के पूरे प्रदेश में
  rationale: גְּבוּל यहाँ केवल सीमा-रेखा नहीं, इस्राएल के समूचे भू-क्षेत्र को सूचित करता है।
- source_word: וַיִּמְצְאוּ
  choice: उन्हें…मिली
  rationale: हिन्दी की स्वाभाविक वाक्य-रचना में खोजनेवालों के लिए ‘उन्हें’ और स्त्रीलिंग कर्ता अबीशग के साथ ‘मिली’ सरल कथात्मक समतुल्य है।
- source_word: אֲבִישַׁג הַשּׁוּנַמִּית
  choice: शूनेम की रहनेवाली अबीशग
  rationale: הַשּׁוּנַמִּית स्थान-सूचक पद है, अर्थात शूनेम की स्त्री। अर्थ को सीधे व्यक्त करना आधुनिक हिन्दी पाठक के लिए ‘शूनेमी’ जैसे अपरिचित जातिवाचक रूप से अधिक स्पष्ट है।
- source_word: וַיָּבִאוּ אֹתָהּ לַמֶּלֶךְ
  choice: वे उसे राजा के पास ले आए
  rationale: हिफ़ील रूप का अर्थ ‘लाना/ले आना’ है और לַמֶּלֶךְ गंतव्य, अर्थात राजा के पास, बताता है।
theological_decisions: []
