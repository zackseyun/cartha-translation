  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। इब्रानी कथात्मक क्रम को स्पष्ट हिन्दी वाक्यों में व्यक्त किया गया है; कोई व्याख्यात्मक या सम्प्रदायगत तत्व नहीं जोड़ा गया।
