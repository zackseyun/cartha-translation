source:
  edition: WLC
  text: וַ/תִּקֹּ֨ד בַּת שֶׁ֤בַע אַפַּ֨יִם֙ אֶ֔רֶץ וַ/תִּשְׁתַּ֖חוּ לַ/מֶּ֑לֶךְ וַ/תֹּ֕אמֶר יְחִ֗י אֲדֹנִ֛/י הַ/מֶּ֥לֶךְ דָּוִ֖ד לְ/עֹלָֽם־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/031.yaml
  text: Then Bathsheba bowed with her face to the ground and prostrated herself before the king[a], and said, “May my lord King David live forever.”
translation:
  language: hi
  text: तब बतशेबा ने भूमि तक सिर झुकाकर राजा के सामने दण्डवत किया और कहा, “मेरे स्वामी राजा दाऊद सदा जीवित रहें।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתִּקֹּד
  choice: सिर झुकाकर
  rationale: क़ादद का अर्थ आदर में झुकना है; ‘सिर झुकाकर’ स्वाभाविक हिन्दी में इस शारीरिक मुद्रा को व्यक्त करता है और अगले अधिक प्रबल क्रियापद से भेद बनाए रखता है।
- source_word: אַפַּיִם אֶרֶץ
  choice: भूमि तक
  rationale: शाब्दिक बिंब ‘मुख/नाक भूमि की ओर’ गहरे झुकने को दर्शाता है। ‘भूमि तक सिर झुकाकर’ हिन्दी में स्पष्ट और स्वाभाविक रूप से वही भाव देता है।
- source_word: וַתִּשְׁתַּחוּ
  choice: दण्डवत किया
  rationale: यह क्रिया श्रद्धा और अधीनता में पूरी तरह झुकने या भूमि पर गिरने का संकेत देती है। ‘दण्डवत किया’ आधुनिक पाठकों के लिए परिचित है और पहली क्रिया की तुलना में अधिक गहन मुद्रा को सुरक्षित रखता है।
- source_word: לַמֶּלֶךְ
  choice: राजा के सामने
  rationale: इब्रानी पूर्वसर्ग शाब्दिक रूप से ‘राजा को/के लिए’ है, पर दण्डवत की मुद्रा के साथ हिन्दी में ‘राजा के सामने’ स्वाभाविक है।
- source_word: יְחִי
  choice: जीवित रहें
  rationale: इच्छार्थक रूप आशीष या राजकीय अभिनंदन व्यक्त करता है; आदरसूचक बहुवचन के साथ ‘जीवित रहें’ हिन्दी में उचित है।
- source_word: אֲדֹנִי
  choice: मेरे स्वामी
  rationale: राजकीय संबोधन में यह आदर और अधीनता का पद है; ‘मेरे स्वामी’ बिना अतिरिक्त धार्मिक अर्थ जोड़े इसे सुरक्षित रखता है।
- source_word: הַמֶּלֶךְ דָּוִד
  choice: राजा दाऊद
  rationale: उपाधि और नाम का यह संयोजन स्वाभाविक मानक हिन्दी है और दोनों इब्रानी तत्वों को बनाए रखता है।
- source_word: לְעֹלָם
  choice: सदा
  rationale: यहाँ शब्द राजकीय शुभकामना की दीर्घकालिकता व्यक्त करता है; ‘सदा’ संक्षिप्त, गरिमापूर्ण और स्वाभाविक है।
theological_decisions: []
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण राजदरबारी रजिस्टर अपनाया गया है। दो अलग इब्रानी क्रियाओं को क्रमशः ‘सिर झुकाकर’ और ‘दण्डवत किया’ से अलग रखा गया है। ‘मेरे स्वामी’ और ‘रहें’ सम्मानसूचक संबोधन को बनाए रखते हैं।
