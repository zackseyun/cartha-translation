source:
  edition: WLC
  text: וַ/אֲדֹ֣נִיָּ֔הוּ יָרֵ֖א מִ/פְּנֵ֣י שְׁלֹמֹ֑ה וַ/יָּ֣קָם וַ/יֵּ֔לֶךְ וַֽ/יַּחֲזֵ֖ק בְּ/קַרְנ֥וֹת הַ/מִּזְבֵּֽחַ׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/050.yaml
  text: And Adonijah was afraid because of Solomon[a], so he arose and went and took hold of the horns of the altar.
translation:
  language: hi
  text: और अदोनिय्याह सुलैमान से डर गया। इसलिए वह उठा, गया और उसने वेदी के सींगों को पकड़ लिया।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: वेदी के सींगों को पकड़ना पवित्रस्थान में शरण या दया माँगने का संकेत था।
    reason: cultural_note
lexical_decisions:
- source_word: יָרֵא מִפְּנֵי
  choice: से डर गया
  rationale: हिंदी में ‘फलाँ से डरना’ भय के व्यक्ति अथवा कारण को स्वाभाविक और सीधे ढंग से व्यक्त करता है; इससे इब्रानी पदबंध का अर्थ सुरक्षित रहता है।
- source_word: וַיָּקָם
  choice: वह उठा
  rationale: यह इब्रानी कथात्मक क्रम का सीधा और आधुनिक हिंदी में स्वाभाविक अनुवाद है।
- source_word: וַיֵּלֶךְ
  choice: गया
  rationale: साधारण गति-सूचक क्रिया का संक्षिप्त और सीधा समतुल्य।
- source_word: וַיַּחֲזֵק
  choice: पकड़ लिया
  rationale: यहाँ क्रिया वेदी के सींगों को थामने की क्रिया बताती है; ‘पकड़ लिया’ हिंसक बल का अनावश्यक भाव जोड़े बिना अर्थ व्यक्त करता है।
- source_word: קַרְנוֹת
  choice: सींगों
  rationale: वेदी के उभरे हुए कोनों के लिए मूल पाठ का साकार, पारंपरिक उपासना-संबंधी रूपक बनाए रखा गया है।
- source_word: הַמִּזְבֵּחַ
  choice: वेदी
  rationale: बलिदान और उपासना के प्रसंग में यह מזבח का प्रचलित और सटीक हिंदी समतुल्य है।
- source_word: וַאֲדֹנִיָּהוּ
  choice: और अदोनिय्याह
  rationale: व्यक्तिनाम का मानक देवनागरी लिप्यंतरण किया गया है और आरंभिक वाव को कथात्मक प्रवाह बनाए रखने के लिए ‘और’ से व्यक्त किया गया है।
theological_decisions:
- issue: वेदी के सींग पकड़कर शरण या दया माँगने का सांस्कृतिक संकेत
  choice: मुख्य पाठ में शारीरिक क्रिया को ज्यों का त्यों रखा गया और उसका सांस्कृतिक आशय पादटिप्पणी में बताया गया।
  alternative: मुख्य पाठ में विस्तार करके ‘शरण लेने के लिए वेदी के पास भाग गया’ कहना।
  rationale: इब्रानी पाठ स्पष्ट रूप से वेदी के सींग पकड़ने की क्रिया कहता है, जबकि शरण या दया की याचना उसका प्रसंगगत सांस्कृतिक आशय है। मुख्य पाठ में उस आशय को जोड़ना मूल कथन से आगे जाना होता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सहज कथात्मक हिंदी है। छोटे क्रमिक क्रियापद इब्रानी कथा की गति को बनाए रखते हैं; ‘वेदी के सींग’ जैसे उपासना-संबंधी ठोस शब्द को सरल व्याख्या से बदला नहीं गया है।
