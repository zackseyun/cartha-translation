  text: So Bathsheba went in to the king in the chamber[a]. Now the king was very old[b], and Abishag the Shunammite was attending the king.
translation:
  language: hi
  text: तब बतशेबा राजा के कक्ष में उसके पास गई। राजा बहुत बूढ़ा था, और शूनेम की अबीशग राजा की सेवा कर रही थी।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתָּבֹא
  choice: तब ... गई
  rationale: बोअ के वय्यिक्तोल रूप से कथा आगे बढ़ती है; हिन्दी में ‘तब ... गई’ प्रसंगानुकूल और स्वाभाविक है।
- source_word: בַת שֶׁבַע
  choice: बतशेबा
  rationale: व्यक्तिनाम का प्रचलित हिन्दी लिप्यंतरण।
- source_word: אֶל הַמֶּלֶךְ הַחַדְרָה
  choice: राजा के पास भीतरी कमरे में
  rationale: אֶל गति को राजा की ओर और दिशासूचक ה वाला הַחַדְרָה कमरे के भीतर जाने को व्यक्त करता है; ‘भीतरी कमरा’ निजी राजकीय कक्ष का भाव देता है।
- source_word: וְהַמֶּלֶךְ זָקֵן מְאֹד
  choice: राजा बहुत बूढ़ा हो चुका था
  rationale: यह वाक्यांश पृष्ठभूमि बताता है। ‘हो चुका था’ राजा की अत्यधिक वृद्धावस्था की मौजूदा दशा को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וַאֲבִישַׁג הַשּׁוּנַמִּית
  choice: और शूनेम की अबीशग
  rationale: व्यक्तिनाम का लिप्यंतरण किया गया है और स्त्रीवाचक स्थान-संबंधी उपाधि को सहज हिन्दी ‘शूनेम की’ से व्यक्त किया गया है।
- source_word: מְשָׁרַת אֶת הַמֶּלֶךְ
  choice: राजा की सेवा कर रही थी
  rationale: पुंलिंग/स्त्रीलिंग एकवचन कृदंत यहाँ चल रही सेवा को दर्शाता है; ‘सेवा कर रही थी’ देखभाल और राजकीय परिचर्या दोनों के लिए स्वाभाविक तथा पर्याप्त व्यापक है।
