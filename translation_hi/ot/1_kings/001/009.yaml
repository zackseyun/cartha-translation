  text: וַ/יִּזְבַּ֣ח אֲדֹנִיָּ֗הוּ צֹ֤אן וּ/בָקָר֙ וּ/מְרִ֔יא עִ֚ם אֶ֣בֶן הַזֹּחֶ֔לֶת אֲשֶׁר אֵ֖צֶל עֵ֣ין רֹגֵ֑ל וַ/יִּקְרָ֗א אֶת כָּל אֶחָי/ו֙ בְּנֵ֣י הַ/מֶּ֔לֶךְ וּ/לְ/כָל אַנְשֵׁ֥י יְהוּדָ֖ה עַבְדֵ֥י הַ/מֶּֽלֶךְ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/009.yaml
  text: Adonijah sacrificed sheep[a], cattle, and fattened animals by the stone of Zoheleth, which is beside En-rogel, and he invited all his brothers, the king’s sons, and all the men of Judah[e][d][c][b], the king’s servants.
translation:
  language: hi
  text: अदोनिय्याह ने एन-रोगेल के पास स्थित ज़ोहेलेत नामक पत्थर[a] के निकट भेड़-बकरियों, गाय-बैलों और मोटे किए हुए पशुओं की बलि चढ़ाई। उसने अपने सभी भाइयों—राजा के पुत्रों—और यहूदा के सभी पुरुषों—राजा के सेवकों[b]—को बुलाया[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ज़ोहेलेत एक स्थान-नाम है; इसके ठीक अर्थ के बारे में निश्चित जानकारी नहीं है।
    reason: cultural_note
  - marker: b
    text: ‘राजा के सेवकों’ का अर्थ राजा के परिचारक या अधिकारी भी हो सकता है।
    reason: lexical_alternative
  - marker: c
    text: या, “निमंत्रित किया।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּזְבַּח
  choice: बलि चढ़ाई
  rationale: זבח यहाँ बलिदानी भोज के लिए अनुष्ठानिक वध को सूचित करता है; इसलिए केवल ‘काटा’ या ‘वध किया’ की अपेक्षा ‘बलि चढ़ाई’ धार्मिक और राजनीतिक संदर्भ को बेहतर सुरक्षित रखता है।
- source_word: צֹאן
  choice: भेड़-बकरियों
  rationale: צֹאן छोटे पालतू पशुओं, मुख्यतः भेड़ों और बकरियों, का सामूहिक पद है। हिन्दी में ‘भेड़-बकरियाँ’ इसकी व्यापकता को स्वाभाविक रूप से व्यक्त करता है।
- source_word: בָקָר
  choice: गाय-बैलों
  rationale: בקר गोवंश का सामूहिक पद है; ‘गाय-बैल’ हिन्दी में केवल नर पशुओं तक अर्थ सीमित किए बिना इसे स्पष्ट करता है।
- source_word: מְרִיא
  choice: पाले-पोसे मोटे पशुओं
  rationale: यह विशेष भोजन के लिए मोटे किए गए पशुओं को दर्शाता है, लेकिन केवल बछड़ों तक सीमित नहीं है। यह रूप उस व्यापकता को बनाए रखता है।
- source_word: עִם אֶבֶן הַזֹּחֶלֶת
  choice: ज़ोहेलेत नामक पत्थर के निकट
  rationale: עִם यहाँ स्थानवाचक अर्थ में है। זֹחֶלֶת को अनिश्चित अर्थ के कारण अनूदित करने के बजाय स्थान-नाम के रूप में लिप्यंतरित किया गया है।
- source_word: עֵין רֹגֵל
  choice: एन-रोगेल
  rationale: यह भौगोलिक स्थान-नाम है, इसलिए इसका लिप्यंतरण किया गया है।
- source_word: וַיִּקְרָא
  choice: बुलाया
  rationale: भोज के प्रसंग में क्रिया आमंत्रित करने का भाव रख सकती है, पर मूल शब्द का सामान्य ‘बुलाना’ अर्थ भी सुरक्षित रहता है और हिन्दी में प्रसंगानुकूल है।
- source_word: אֶת כָּל אֶחָיו בְּנֵי הַמֶּלֶךְ
  choice: अपने सभी भाइयों—राजा के पुत्रों—
  rationale: डैश द्वारा समानाधिकरण स्पष्ट होता है कि वे भाई राजा के पुत्र थे, और मूल की दोनों अभिव्यक्तियाँ सुरक्षित रहती हैं।
- source_word: אַנְשֵׁי יְהוּדָה עַבְדֵי הַמֶּלֶךְ
  choice: राजा की सेवा में लगे यहूदा के सभी पुरुषों
  rationale: मूल में ‘राजा के सेवक’ ‘यहूदा के पुरुषों’ को सीमित करता है; वाक्य-विन्यास यह स्पष्ट करता है कि सभी यहूदावासी नहीं, बल्कि राजा की सेवा में लगे पुरुष बुलाए गए थे।
theological_decisions:
- issue: אַנְשֵׁי יְהוּדָה में लिंग-सूचक भाषा
  choice: यहूदा के सभी पुरुषों
  alternative: यहूदा के सभी लोगों को
  rationale: इब्रानी में ‘पुरुष’ स्पष्ट रूप से पुल्लिंग बहुवचन है। इसे बनाए रखना मूल के सामाजिक और राजनीतिक संदर्भ को अनावश्यक रूप से व्यापक करने से बचाता है।
- issue: עַבְדֵי הַמֶּלֶךְ का सामाजिक पद
  choice: राजा की सेवा में लगे
  alternative: राजा के सेवक / राजा के अधिकारी
  rationale: עבד राजकीय परिचारकों या अधिकारियों दोनों के लिए प्रयुक्त हो सकता है। चुना हुआ रूप किसी निश्चित प्रशासनिक पद का दावा किए बिना इस संबंध को व्यक्त करता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज शैली अपनाई गई है। पशु-समूहों के लिए स्वाभाविक हिन्दी युग्म प्रयुक्त किए गए हैं; स्थान-नाम लिप्यंतरित हैं और समानाधिकरण को डैश से स्पष्ट किया गया है।
