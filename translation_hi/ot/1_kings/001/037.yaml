source:
  edition: WLC
  text: כַּ/אֲשֶׁ֨ר הָיָ֤ה יְהוָה֙ עִם אֲדֹנִ֣/י הַ/מֶּ֔לֶךְ כֵּ֖ן יהי עִם שְׁלֹמֹ֑ה וִֽ/יגַדֵּל֙ אֶת כִּסְא֔/וֹ מִ֨/כִּסֵּ֔א אֲדֹנִ֖/י הַ/מֶּ֥לֶךְ דָּוִֽד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/037.yaml
  text: Just as Yahweh has been with my lord the king[a], so may he be with Solomon and make his throne greater than the throne of my lord King David.
translation:
  language: hi
  text: जैसे याहवे मेरे स्वामी, राजा, के साथ रहे हैं, वैसे ही वह सुलैमान के साथ रहें[a] और उसके सिंहासन को मेरे स्वामी, राजा दाऊद के सिंहासन से अधिक महान करें।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वैसे ही याहवे सुलैमान के साथ रहें।” इब्रानी इच्छार्थक क्रिया में कर्ता व्यक्त नहीं है; वह पिछले उपवाक्य में आए याहवे की ओर संकेत करता है।
    reason: अंतर्निहित कर्ता को स्पष्ट करने वाला वैकल्पिक अनुवाद
lexical_decisions:
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत नाम को उपाधि से बदलने के बजाय देवनागरी में उसके प्रचलित लिप्यंतरण द्वारा व्यक्त किया गया है।
- source_word: כַּאֲשֶׁר ... כֵּן
  choice: जैसे ... वैसे ही
  rationale: यह सहसंबंधी रचना दाऊद के साथ याहवे की उपस्थिति और सुलैमान के लिए व्यक्त कामना के बीच तुलना को स्वाभाविक हिन्दी में बनाए रखती है।
- source_word: הָיָה ... עִם
  choice: के साथ रहे हैं
  rationale: पूर्ण क्रिया पीछे मुड़कर याहवे की सतत संगति की ओर संकेत करती है; हिन्दी का पूर्ण वर्तमान इस भाव को सहज रूप से व्यक्त करता है।
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: मेरे स्वामी राजा
  rationale: दरबारी सम्मानसूचक संबोधन में संबंधसूचक ‘मेरे’, आदरसूचक ‘स्वामी’ और राजकीय पदवी तीनों सुरक्षित रखे गए हैं।
- source_word: יהי
  choice: वह ... रहें
  rationale: इब्रानी इच्छार्थक रूप आशीष या कामना व्यक्त करता है। कर्ता पिछले उपवाक्य के याहवे से समझा जाता है; हिन्दी में आदरसूचक क्रिया-रूप प्रयुक्त है।
- source_word: וִיגַדֵּל
  choice: महान करें
  rationale: हिफ़ील रूप का कारणवाचक अर्थ ‘महान बनाना’ है; सिंहासन के संदर्भ में ‘महान करें’ स्वाभाविक और संक्षिप्त है।
- source_word: כִּסְאוֹ
  choice: उसके सिंहासन
  rationale: मूल के ठोस ‘सिंहासन’ रूपक को ‘राज्य’ या ‘राजसत्ता’ में व्याख्यात्मक रूप से नहीं बदला गया।
- source_word: מִכִּסֵּא
  choice: सिंहासन से भी महान
  rationale: מן यहाँ तुलना सूचित करता है; ‘से भी महान’ हिन्दी में तुलनात्मक बल को स्पष्ट करता है।
- source_word: אֲדֹנִי הַמֶּלֶךְ דָּוִד
  choice: मेरे स्वामी राजा दाऊद
  rationale: यह रूप दाऊद के प्रति बनायाह के सम्मान और उनकी राजकीय पदवी दोनों को बनाए रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में चार अक्षरों वाला व्यक्तिगत ईश्वरीय नाम सीधे आया है। ‘याहवे’ उसे किसी उपाधि से प्रतिस्थापित किए बिना प्रस्तुत करता है।
- issue: יהי का अंतर्निहित कर्ता
  choice: ‘वह’—पिछले उपवाक्य में उल्लिखित याहवे
  alternative: ‘याहवे’ को दोबारा स्पष्ट रूप से कहना
  rationale: इब्रानी इच्छार्थक क्रिया में कर्ता प्रकट नहीं है, पर संदर्भ उसे याहवे से जोड़ता है। सर्वनाम मूल की प्रवाहशीलता और अंतर्निहित कर्ता दोनों को सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। परमेश्वर के लिए आदरसूचक बहुवचन क्रिया-रूप ‘रहें/करें’ प्रयुक्त हुए हैं। दरबारी संबोधन को अत्यधिक संस्कृतनिष्ठ बनाए बिना मूल सम्मानभाव सुरक्षित रखा गया है।
