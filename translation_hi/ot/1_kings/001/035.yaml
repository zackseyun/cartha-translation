source:
  edition: WLC
  text: וַ/עֲלִיתֶ֣ם אַחֲרָ֗י/ו וּ/בָא֙ וְ/יָשַׁ֣ב עַל כִּסְאִ֔/י וְ/ה֥וּא יִמְלֹ֖ךְ תַּחְתָּ֑/י וְ/אֹת֤/וֹ צִוִּ֨יתִי֙ לִֽ/הְי֣וֹת נָגִ֔יד עַל יִשְׂרָאֵ֖ל וְ/עַל יְהוּדָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/035.yaml
  text: Then you shall go up after him[a], and he shall come and sit on my throne, and he shall reign in my place; and I have appointed him to be ruler over Israel and over Judah.
translation:
  language: hi
  text: फिर तुम उसके पीछे-पीछे ऊपर जाना। वह आकर मेरे सिंहासन पर बैठेगा और मेरे स्थान पर राज्य करेगा। मैंने उसी को[a] इस्राएल और यहूदा पर शासक होने के लिए नियुक्त किया है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मैंने उसी को इस्राएल और यहूदा पर प्रधान होने की आज्ञा दी है।” इब्रानी क्रिया का सामान्य अर्थ “आज्ञा देना” है, और “शासक” के लिए प्रयुक्त शब्द का अनुवाद “प्रधान” या “अगुआ” भी हो सकता है।
    reason: צִוִּיתִי और נָגִיד की वास्तविक शाब्दिक वैकल्पिकताओं को सुरक्षित रखना।
lexical_decisions:
- source_word: וַעֲלִיתֶם אַחֲרָיו
  choice: तुम उसके पीछे-पीछे ऊपर आना
  rationale: עלה का दिशात्मक अर्थ ‘ऊपर जाना/आना’ और אַחֲרָיו का जुलूस में उसके पीछे चलना—दोनों सुरक्षित रखे गए हैं। आज्ञाओं के क्रम को हिन्दी में स्वाभाविक आदेशात्मक रूप दिया गया है।
- source_word: וּבָא
  choice: वह आकर
  rationale: בוא का सामान्य अर्थ ‘आना’ है। कृदन्तीय ‘आकर’ अगले कार्य से स्वाभाविक रूप से जोड़ता है और घटनाओं का क्रम बनाए रखता है।
- source_word: וְיָשַׁב עַל־כִּסְאִי
  choice: मेरे सिंहासन पर बैठेगा
  rationale: यह राजसिंहासन ग्रहण करने की भाषा है; सीधा अनुवाद राजकीय उत्तराधिकार की छवि को बनाए रखता है।
- source_word: וְהוּא יִמְלֹךְ תַּחְתָּי
  choice: और मेरे स्थान पर राज्य करेगा
  rationale: תַּחְתָּי यहाँ पद में स्थान लेने का भाव देता है। ‘मेरे स्थान पर’ उत्तराधिकार और प्रतिस्थापन दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וְאֹתוֹ צִוִּיתִי
  choice: मैंने उसी को नियुक्त किया है
  rationale: אֹתוֹ के बल को ‘उसी को’ से व्यक्त किया गया है। צוה का मूल अर्थ प्रायः ‘आज्ञा देना’ है, पर इस राजकीय संदर्भ में यह पद के लिए नामित या नियुक्त करने का कार्य करता है; मूल शाब्दिक संभावना पादटिप्पणी में रखी गई है।
- source_word: לִהְיוֹת נָגִיד
  choice: शासक होने के लिए
  rationale: נָגִיד किसी नियुक्त प्रधान, अगुए या शासक को सूचित करता है। ‘शासक’ सामान्य पाठक के लिए स्पष्ट है और יִמְלֹךְ (‘राज्य करेगा’) से शब्दगत भेद भी बनाए रखता है।
- source_word: עַל־יִשְׂרָאֵל וְעַל־יְהוּדָה
  choice: इस्राएल और यहूदा पर
  rationale: दोनों राजनीतिक समुदायों पर अधिकार का भाव स्पष्ट है। हिन्दी में ‘पर’ को एक बार रखना स्वाभाविक है और अर्थ में कोई कमी नहीं करता।
theological_decisions:
- issue: नָגִיד और राजत्व-सूचक מלך के बीच भेद
  choice: נָגִיד को ‘शासक’ और מלך को ‘राज्य करेगा’ कहा गया है।
  alternative: נָגִיד के लिए ‘प्रधान’, ‘अगुआ’ या ‘राजकुमार’
  rationale: मूल पद में राज करने और नियुक्त शासक होने के लिए अलग शब्द हैं। हिन्दी में यह भेद रखना राजकीय अधिकार के चित्रण को बिना किसी संप्रदायगत निष्कर्ष के सुरक्षित रखता है।
- issue: צִוִּיתִי का नियुक्ति अथवा आज्ञा का भाव
  choice: मुख्य पाठ में ‘नियुक्त किया है’
  alternative: ‘आज्ञा दी है’
  rationale: संदर्भ दाऊद द्वारा सुलैमान को पद के लिए ठहराने का है, इसलिए ‘नियुक्त’ प्रसंगगत क्रियाशक्ति को स्पष्ट करता है; फिर भी क्रिया का सामान्य अर्थ ‘आज्ञा देना’ है, जिसे पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सहज रखी गई है। ‘सिंहासन’, ‘राज्य करेगा’ और ‘शासक’ राजकीय प्रसंग को स्पष्ट रखते हैं; ‘पीछे-पीछे ऊपर आना’ जुलूस और दिशा—दोनों का भाव देता है।
