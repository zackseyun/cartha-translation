id: 1KI.1.29
reference: 1 Kings 1:29
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יִּשָּׁבַ֥ע הַ/מֶּ֖לֶךְ וַ/יֹּאמַ֑ר חַי יְהוָ֕ה אֲשֶׁר פָּדָ֥ה אֶת נַפְשִׁ֖/י מִ/כָּל צָרָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/029.yaml
  text: And the king swore and said[a], “As Yahweh lives, who has redeemed my life from every distress,”
translation:
  language: hi
  text: तब राजा ने शपथ खाकर कहा, “जीवित याहवे की शपथ, जिसने मेरे जीवन[a] को हर संकट से छुड़ाया है,”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “मेरे प्राण।” इब्रानी शब्द नेफ़ेश का अर्थ प्राण, स्वयं व्यक्ति या जीवन हो सकता है; यहाँ सबसे स्वाभाविक अर्थ संकट से बचाया गया दाऊद का जीवन है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשָּׁבַע
  choice: शपथ खाकर
  rationale: निफ़अल रूप यहाँ शपथ लेने को व्यक्त करता है। ‘शपथ खाकर कहा’ आधुनिक हिन्दी में स्वाभाविक है और इब्रानी के दोनों क्रियापदों को बनाए रखता है।
- source_word: הַמֶּלֶךְ
  choice: राजा
  rationale: इब्रानी में निश्चित पदवी है; प्रसंग दाऊद की पहचान कराता है, पर मूल पाठ की तरह यहाँ व्यक्तिगत नाम के बजाय पदवी रखी गई है।
- source_word: חַי יְהוָה
  choice: जीवित याहवे की शपथ
  rationale: यह प्रचलित इब्रानी शपथ-सूत्र है। हिन्दी रूप उसके शपथ-संबंधी अर्थ को स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत वाचा-नाम का लिप्यंतरण किया गया है; उसे किसी पदवी से प्रतिस्थापित नहीं किया गया।
- source_word: פָּדָה
  choice: छुड़ाया है
  rationale: यहाँ क्रिया संकटों से किए गए पूर्ण उद्धार की ओर संकेत करती है। ‘छुड़ाया है’ हिन्दी में स्वाभाविक है और बचाव तथा मुक्ति, दोनों भाव रखता है।
- source_word: נַפְשִׁי
  choice: मेरे जीवन
  rationale: इस प्रसंग में נֶפֶשׁ दाऊद के संकटों से सुरक्षित रखे गए जीवन या स्वयं व्यक्ति को दर्शाता है, न कि अनिवार्य रूप से देह से अलग आत्मा को।
- source_word: מִכָּל צָרָה
  choice: हर संकट से
  rationale: यह पदबंध सभी प्रकार के क्लेश या विपत्ति से बचाए जाने का व्यापक अर्थ देता है। ‘हर संकट से’ स्पष्ट और वर्तमान हिन्दी है।
theological_decisions:
- issue: परमेश्वर के नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: प्रभु / यहोवा
  rationale: मूल पाठ में वाचा-नाम सीधे प्रयुक्त है। ‘याहवे’ उसका हिन्दी लिप्यंतरण है और नाम को पदवी में नहीं बदलता।
- issue: נַפְשִׁי का प्रसंगानुसार अर्थ
  choice: मेरे जीवन
  alternative: मेरे प्राण / मेरी आत्मा / मुझे
  rationale: वक्ता उन संकटों से बचाए जाने की बात कर रहा है जिनमें उसका जीवन खतरे में था। ‘जीवन’ अनावश्यक देह-आत्मा द्वैत को आरोपित किए बिना प्रसंग का अर्थ व्यक्त करता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और कथात्मक रखी गई है। पद अगले पद में जारी शपथ-वचन का आरंभ है, इसलिए अंत में अल्पविराम रखा गया है।
