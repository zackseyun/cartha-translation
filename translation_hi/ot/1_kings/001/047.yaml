source:
  edition: WLC
  text: וְ/גַם בָּ֜אוּ עַבְדֵ֣י הַ/מֶּ֗לֶךְ לְ֠/בָרֵךְ אֶת אֲדֹנֵ֜י/נוּ הַ/מֶּ֣לֶךְ דָּוִד֮ לֵ/אמֹר֒ יֵיטֵ֨ב אלהי/ך אֶת שֵׁ֤ם שְׁלֹמֹה֙ מִ/שְּׁמֶ֔/ךָ וִֽ/יגַדֵּ֥ל אֶת כִּסְא֖/וֹ מִ/כִּסְאֶ֑/ךָ וַ/יִּשְׁתַּ֥חוּ הַ/מֶּ֖לֶךְ עַל הַ/מִּשְׁכָּֽב־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/047.yaml
  text: And the king’s servants also came to bless our lord King David[a], saying, ‘May your God make Solomon’s name better than your name[b], and may he make his throne greater than your throne.’ And the king bowed himself on the bed.
translation:
  language: hi
  text: राजा के सेवक भी हमारे स्वामी राजा दाऊद को आशीर्वाद देने आए। उन्होंने कहा, “आपका परमेश्वर सुलैमान के नाम को आपके नाम से श्रेष्ठ करे[a] और उसके सिंहासन को आपके सिंहासन से बड़ा करे।” और राजा ने बिछौने पर झुककर प्रणाम किया[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ “नाम” का अर्थ प्रतिष्ठा या यश भी है।
    reason: lexical_alternative
  - marker: b
    text: या, “राजा ने बिछौने पर आराधना की।” इब्रानी क्रिया का अर्थ प्रसंग के अनुसार झुककर प्रणाम करना या आराधना करना हो सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: וְגַם בָּאוּ
  choice: भी ... आए
  rationale: संयोजक और योगसूचक बल को स्वाभाविक हिन्दी में ‘भी’ द्वारा व्यक्त किया गया है; प्रसंग में यह पिछली सूचना से जुड़ी एक और बात है।
- source_word: עַבְדֵי הַמֶּלֶךְ
  choice: राजा के सेवक
  rationale: दरबारी प्रसंग में यह पद राजकीय सेवकों अथवा अधिकारियों को सूचित कर सकता है। ‘सेवक’ व्यापक अर्थ बनाए रखता है और अनावश्यक रूप से उनकी कानूनी हैसियत तय नहीं करता।
- source_word: לְבָרֵךְ
  choice: आशीर्वाद देने
  rationale: यह औपचारिक शुभाशीष है; ‘बधाई देने’ की अपेक्षा ‘आशीर्वाद देने’ मूल क्रिया का धार्मिक और शाब्दिक बल बेहतर बनाए रखता है।
- source_word: אֲדֹנֵינוּ הַמֶּלֶךְ דָּוִד
  choice: हमारे स्वामी राजा दाऊद
  rationale: राजकीय सम्मानसूचक संबोधन को बनाए रखते हुए आधुनिक हिन्दी में स्वाभाविक अभिव्यक्ति दी गई है।
- source_word: יֵיטֵב ... אֶת שֵׁם שְׁלֹמֹה מִשְּׁמֶךָ
  choice: सुलैमान के नाम को आपके नाम से बढ़कर करे
  rationale: कारक रूप और तुलना दोनों सुरक्षित हैं। ‘नाम’ मूल बिंब को बनाए रखता है, जबकि यहाँ उसका आशय प्रतिष्ठा और यश से है।
- source_word: וִיגַדֵּל אֶת כִּסְאוֹ מִכִּסְאֶךָ
  choice: उसके सिंहासन को आपके सिंहासन से भी महान करे
  rationale: ‘सिंहासन’ राजकीय शासन और वंशगत अधिकार का मूल बिंब बनाए रखता है; ‘महान करे’ हिफ़ील के कारक अर्थ को व्यक्त करता है।
- source_word: וַיִּשְׁתַּחוּ
  choice: झुककर प्रणाम किया
  rationale: क्रिया झुकने/दण्डवत करने अथवा आराधना करने का अर्थ दे सकती है। मुख्य पाठ शारीरिक भाव को व्यक्त करता है, पर आराधना का सम्भव अर्थ पादटिप्पणी में सुरक्षित है।
- source_word: עַל הַמִּשְׁכָּב
  choice: बिछौने पर
  rationale: मूल पाठ के निश्चित पदबंध का सीधा और प्रसंगानुकूल अनुवाद है; ‘अपने’ मूल में स्पष्ट नहीं है।
theological_decisions:
- issue: וַיִּשְׁתַּחוּ को स्पष्ट आराधना मानना या शारीरिक रूप से झुकना
  choice: राजा ने बिछौने पर झुककर प्रणाम किया
  alternative: राजा ने बिछौने पर आराधना की
  rationale: इब्रानी क्रिया दोनों अर्थ दे सकती है और इस उपवाक्य में कर्म स्पष्ट नहीं है। इसलिए मुख्य पाठ में दृश्य शारीरिक क्रिया रखी गई है, जबकि परमेश्वर की आराधना का सम्भव अर्थ पादटिप्पणी में दिया गया है; इस प्रकार पाठ की वास्तविक अस्पष्टता बनी रहती है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। राजदरबार की सम्मानसूचक शैली ‘हमारे स्वामी राजा दाऊद’ में सुरक्षित है। ‘बिछौना’ शय्या के लिए सहज किन्तु गरिमापूर्ण शब्द है।
