base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/002.yaml
  text: So his servants said to him[a], “Let them seek for my lord the king a young virgin woman, and let her attend the king and be his caregiver, and let her lie in your bosom[c][b], so that my lord the king may be warm.”
translation:
  language: hi
  text: तब उसके सेवकों ने उससे कहा, “मेरे स्वामी राजा के लिए एक कुँवारी युवती खोजी जाए। वह राजा की सेवा में उपस्थित रहे[a] और उसकी परिचारिका[b] बने। वह आपकी गोद में लेटे[c], ताकि मेरे स्वामी राजा गरम हो सकें।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक अर्थ, “राजा के सामने खड़ी रहे”; यह हिब्रू मुहावरा किसी की सेवा में उपस्थित रहने का अर्थ भी दे सकता है।
    reason: lexical_alternative
  - marker: b
    text: इस दुर्लभ हिब्रू शब्द का अनुवाद “सेविका” या “देखभाल करने वाली” भी हो सकता है।
    reason: lexical_alternative
  - marker: c
    text: हिब्रू शब्द का अर्थ “गोद” या “वक्षस्थल” है।
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲבָדָיו
  choice: उसके सेवकों
  rationale: राजदरबार के प्रसंग में यह पद राजा की सेवा करने वाले सेवकों अथवा परिचारकों को सूचित करता है; ‘सेवक’ स्वाभाविक और पर्याप्त व्यापक है।
- source_word: יְבַקְשׁוּ
  choice: खोजी जाए
  rationale: हिब्रू में सक्रिय बहुवचन का प्रस्तावसूचक प्रयोग है। हिन्दी में अनिर्दिष्ट कर्ता के साथ कर्मवाच्य प्रस्ताव अधिक स्वाभाविक है और किसी विशेष खोजकर्ता को अनावश्यक रूप से नहीं जोड़ता।
- source_word: לַאדֹנִי הַמֶּלֶךְ
  choice: हमारे स्वामी राजा के लिए
  rationale: वक्ता सेवकों का समूह है, इसलिए हिन्दी संवाद में ‘हमारे स्वामी’ सम्मानसूचक राजदरबारी संबोधन को स्वाभाविक ढंग से व्यक्त करता है; हिब्रू का रूप शाब्दिक रूप से ‘मेरे स्वामी राजा’ है।
- source_word: נַעֲרָה בְתוּלָה
  choice: एक कुँवारी युवती
  rationale: ‘युवती’ נַעֲרָה की आयु-सूचना और ‘कुँवारी’ בְתוּלָה की स्पष्ट विशेषता—दोनों को सुरक्षित रखता है।
- source_word: וְעָמְדָה לִפְנֵי הַמֶּלֶךְ
  choice: वह राजा की सेवा में उपस्थित रहे
  rationale: शाब्दिक अर्थ ‘राजा के सामने खड़ी रहे’ है, पर राजदरबारी मुहावरे में इसका आशय सेवा के लिए उपस्थित रहना है। यह अनुवाद चित्र और कार्य दोनों को संतुलित करता है।
- source_word: סֹכֶנֶת
  choice: परिचारिका
  rationale: यह दुर्लभ पद किसी की देखभाल अथवा सेवा करने वाली स्त्री को सूचित करता है। ‘परिचारिका’ प्रसंगानुकूल है और शब्द में निहित न होने वाला यौन अर्थ नहीं जोड़ता।
- source_word: וְשָׁכְבָה בְחֵיקֶךָ
  choice: वह आपकी गोद में लेटे
  rationale: חֵיק का ठोस अर्थ गोद, वक्षस्थल अथवा आलिंगन का निकट स्थान हो सकता है। ‘गोद में’ हिन्दी में मूल शारीरिक निकटता को स्पष्ट और स्वाभाविक रूप से रखता है।
- source_word: וְחַם
  choice: ताकि हमारे स्वामी राजा को गरमी मिले
  rationale: यहाँ वाक्यांश अभिप्रेत परिणाम बताता है; ‘ताकि’ उस उद्देश्य को स्पष्ट करता है।
