  text: וַ/יֹּ֣אמֶר הַ/מֶּ֣לֶךְ דָּוִ֗ד קִרְאוּ לִ֞/י לְ/צָד֤וֹק הַ/כֹּהֵן֙ וּ/לְ/נָתָ֣ן הַ/נָּבִ֔יא וְ/לִ/בְנָיָ֖הוּ בֶּן יְהוֹיָדָ֑ע וַ/יָּבֹ֖אוּ לִ/פְנֵ֥י הַ/מֶּֽלֶךְ׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/032.yaml
  text: Then King David said, “Call Zadok the priest, Nathan the prophet, and Benaiah son of Jehoiada to me.” And they came before the king.
translation:
  language: hi
  text: तब राजा दाऊद ने कहा, “सादोक याजक, नातान नबी और यहोयादा के पुत्र बनायाह को मेरे पास बुलाओ।” तब वे राजा के सामने आए।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: तब ... ने कहा
  rationale: वाव-क्रमिक कथा को आगे बढ़ाता है; ‘तब’ आधुनिक हिन्दी में घटनाक्रम को स्वाभाविक रूप से व्यक्त करता है।
- source_word: הַמֶּלֶךְ דָּוִד
  choice: राजा दाऊद
  rationale: राजकीय उपाधि और नाम के इस संबंध का हिन्दी में स्वाभाविक रूप ‘राजा दाऊद’ है।
- source_word: קִרְאוּ לִי
  choice: मेरे पास बुलाओ
  rationale: बहुवचन आज्ञार्थक क्रिया और לִי मिलकर व्यक्तियों को वक्ता की उपस्थिति में बुलाने की आज्ञा देते हैं।
- source_word: לְצָדוֹק הַכֹּהֵן
  choice: सादोक याजक
  rationale: व्यक्तिनाम का लिप्यंतरण किया गया है और כֹּהֵן के लिए मानक बाइबलीय हिन्दी पद ‘याजक’ रखा गया है।
- source_word: וּלְנָתָן הַנָּבִיא
  choice: नातान नबी
  rationale: नाम का लिप्यंतरण और נָבִיא का सीधा, प्रचलित हिन्दी समतुल्य ‘नबी’ है।
- source_word: וְלִבְנָיָהוּ בֶּן יְהוֹיָדָע
  choice: और यहोयादा के पुत्र बनायाह
  rationale: בֶּן का वंशसूचक संबंध स्वाभाविक हिन्दी शब्दक्रम में व्यक्त किया गया है; नामों का लिप्यंतरण किया गया है।
- source_word: וַיָּבֹאוּ
  choice: तब वे ... आए
  rationale: बहुवचन क्रिया और कथात्मक क्रम को स्पष्ट और स्वाभाविक हिन्दी में रखा गया है।
- source_word: לִפְנֵי הַמֶּלֶךְ
  choice: राजा के सामने
  rationale: לִפְנֵי यहाँ राजा की उपस्थिति में आने को दर्शाता है; ‘सामने’ इसका सहज और निकट हिन्दी रूप है।
