  yaml_path: translation/ot/1_kings/001/010.yaml
  text: But he did not invite Nathan the prophet[a], Benaiah, the mighty men, or Solomon his brother.
translation:
  language: hi
  text: पर उसने नातान नबी[a], बनायाह, वीर योद्धाओं और अपने भाई सुलैमान को आमंत्रित नहीं किया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “और उसने नातान नबी, बनायाह, वीर योद्धाओं और अपने भाई सुलैमान को नहीं बुलाया।” इब्रानी क्रिया का शाब्दिक अर्थ “बुलाना” है; यहाँ आशय अदोनिय्याह के भोज में आमंत्रित करने या बुलवाने से है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֶת
  choice: पर ... को
  rationale: संयोजक पिछले पद की सूची को आगे बढ़ाता है, पर यहाँ बुलाए गए और न बुलाए गए लोगों के बीच निहित विरोध है; इसलिए आधुनिक हिन्दी में ‘पर’ स्वाभाविक है। אֶת कर्म-चिह्न का निर्वाह ‘को’ से किया गया है।
- source_word: נָתָן הַנָּבִיא
  choice: नातान नबी
  rationale: व्यक्तिनाम का प्रचलित हिन्दी लिप्यंतरण किया गया है और נָבִיא का सीधा, स्वाभाविक अनुवाद ‘नबी’ है।
- source_word: וּבְנָיָהוּ
  choice: बनायाह
  rationale: इब्रानी व्यक्तिनाम का स्रोतानुकूल हिन्दी लिप्यंतरण; उपसर्ग-संयोजक को हिन्दी सूची की संरचना में समाहित किया गया है।
- source_word: הַגִּבּוֹרִים
  choice: वीर योद्धाओं
  rationale: राजकीय-सैनिक प्रसंग में גִּבּוֹרִים सामर्थी अथवा वीर लड़ाकों के समूह को दर्शाता है। ‘वीर योद्धा’ साधारण पाठक के लिए स्पष्ट है और दाऊद के विशिष्ट सैनिकों का भाव बनाए रखता है।
- source_word: שְׁלֹמֹה אָחִיו
  choice: अपने भाई सुलैमान
  rationale: प्रत्यय ‘उसका’ प्रसंग में अदोनिय्याह की ओर संकेत करता है। हिन्दी में ‘अपने भाई सुलैमान’ अधिक स्वाभाविक है, यद्यपि यह इब्रानी शब्दक्रम को सहज हिन्दी क्रम में रखता है।
- source_word: לֹא קָרָא
  choice: आमंत्रित नहीं किया
  rationale: קרא का मूल अर्थ ‘बुलाना’ है, लेकिन पद 9–10 के भोज-संदर्भ में इसका आशय न्योता देना है; ‘आमंत्रित नहीं किया’ उस प्रसंगगत अर्थ को स्पष्ट और गरिमापूर्ण हिन्दी में व्यक्त करता है।
