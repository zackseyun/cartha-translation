  text: And they told the king, saying, “Look, Nathan the prophet is here.” And he came before the king and bowed down to the king with his face to the ground.
translation:
  language: hi
  text: तब उन्होंने राजा को बताया, “देखिए, नातान नबी यहाँ हैं।” नातान राजा के सामने आए और उन्होंने भूमि पर मुँह के बल झुककर राजा को दण्डवत किया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִנֵּה
  choice: देखिए
  rationale: यह आगमन की ओर तुरंत ध्यान खींचने वाला उद्गार है; आधुनिक आदरसूचक हिंदी में “देखिए” स्वाभाविक है।
- source_word: נָתָן הַנָּבִיא
  choice: नातान नबी
  rationale: व्यक्तिनाम और पदवी को संक्षिप्त तथा स्वाभाविक हिंदी क्रम में रखा गया है।
- source_word: וַיִּשְׁתַּחוּ
  choice: दण्डवत किया
  rationale: राजा के प्रति गहरे सम्मान में शरीर झुकाने की क्रिया व्यक्त करता है; अगला वाक्यांश इसकी शारीरिक मुद्रा स्पष्ट करता है।
- source_word: עַל־אַפָּיו אָרְצָה
  choice: मुँह के बल भूमि पर झुककर
  rationale: मूल में चेहरे/मुख को भूमि की ओर करने वाली पूर्ण प्रणति का ठोस चित्र सुरक्षित रखा गया है।
