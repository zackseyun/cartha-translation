  source_fidelity: The passive opening, “राजा को बताया गया,” omits the explicit plural agent in וַיַּגִּידוּ (“they told”). The remainder conveys Nathan’s arrival, his appearance before the king, and his face-to-the-ground obeisance accurately.
  naturalness: The draft is generally understandable, but “राजा को दण्डवत किया” is less idiomatic than using “राजा को ... दण्डवत किया” with the posture placed directly before it; retaining the pronoun for Nathan also avoids an unnecessary repeated name while preserving the singular subject.
  terminology: “नातान नबी” is suitable. “दण्डवत” appropriately renders the profound prostration, and “मुँह के बल भूमि पर” preserves the concrete bodily posture.
  issues:
