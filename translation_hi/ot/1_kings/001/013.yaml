source:
  edition: WLC
  text: לְכִ֞י וּ/בֹ֣אִי אֶל הַ/מֶּ֣לֶךְ דָּוִ֗ד וְ/אָמַ֤רְתְּ אֵלָי/ו֙ הֲ/לֹֽא אַתָּ֞ה אֲדֹנִ֣/י הַ/מֶּ֗לֶךְ נִשְׁבַּ֤עְתָּ לַ/אֲמָֽתְ/ךָ֙ לֵ/אמֹ֔ר כִּֽי שְׁלֹמֹ֤ה בְנֵ/ךְ֙ יִמְלֹ֣ךְ אַחֲרַ֔/י וְ/ה֖וּא יֵשֵׁ֣ב עַל כִּסְאִ֑/י וּ/מַדּ֖וּעַ מָלַ֥ךְ אֲדֹנִיָֽהוּ׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/013.yaml
  text: Please go in to King David and say to him[a], ‘My lord the king, did you not swear to your servant, saying, “Solomon your son shall reign after me, and he shall sit on my throne”? Why then has Adonijah become king?’
translation:
  language: hi
  text: राजा दाऊद के पास जाकर उनसे कहो, ‘हे मेरे स्वामी, महाराज, क्या आपने अपनी दासी से शपथ खाकर यह नहीं कहा था, “तुम्हारा पुत्र सुलैमान मेरे बाद राज करेगा और वह मेरे सिंहासन पर बैठेगा”? फिर अदोनिय्याह राजा क्यों बन गया है?’
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְכִי וּבֹאִי
  choice: के पास जाकर
  rationale: दोनों स्त्रीलिंग एकवचन आज्ञार्थक क्रियाओं का आशय ‘जाओ, भीतर प्रवेश करो’ है; प्रसंग में ‘के पास जाकर’ स्वाभाविक हिन्दी में गंतव्य और प्रवेश दोनों का पर्याप्त बोध कराता है।
- source_word: אֶל הַמֶּלֶךְ דָּוִד
  choice: राजा दाऊद के पास
  rationale: उपाधि और नाम का यह क्रम आधुनिक हिन्दी में स्वाभाविक है।
- source_word: וְאָמַרְתְּ אֵלָיו
  choice: उनसे कहो
  rationale: इब्रानी क्रमागत रूप यहाँ आज्ञा को आगे बढ़ाता है; आदरसूचक ‘उनसे’ राजकीय संबोधन के अनुरूप है।
- source_word: הֲלֹא
  choice: क्या ... नहीं
  rationale: यह सहमति की अपेक्षा रखने वाला आलंकारिक प्रश्न है।
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: हे मेरे स्वामी, महाराज
  rationale: यह दाऊद के लिए मानवीय राजकीय आदरसूचक संबोधन है, परमेश्वर का नाम नहीं।
- source_word: נִשְׁבַּעְתָּ
  choice: शपथ खाकर
  rationale: क्रिया औपचारिक शपथ का अर्थ देती है, केवल सामान्य वचन का नहीं।
- source_word: לַאֲמָתְךָ
  choice: अपनी दासी से
  rationale: मूल संज्ञा विशेष रूप से स्त्रीलिंग है और बतशेबा का अपने लिए विनम्र राजदरबारी उल्लेख है; हिन्दी में इसे स्पष्ट रूप से सुरक्षित रखा गया है।
- source_word: לֵאמֹר כִּי
  choice: यह ... कहा था
  rationale: यह शपथ की विषयवस्तु प्रस्तुत करता है; כִּי को अनावश्यक बल दिए बिना स्वाभाविक हिन्दी कथन में व्यक्त किया गया है।
- source_word: שְׁלֹמֹה בְנֵךְ
  choice: तुम्हारा पुत्र सुलैमान
  rationale: प्रत्यक्ष उद्धरण में दाऊद का बतशेबा से संबोधन है; यह हिन्दी क्रम स्पष्ट और स्वाभाविक है।
- source_word: יִמְלֹךְ אַחֲרַי
  choice: मेरे बाद राज करेगा
  rationale: यह उत्तराधिकार और राजकीय शासन, दोनों को सीधे व्यक्त करता है।
- source_word: וְהוּא יֵשֵׁב עַל כִּסְאִי
  choice: और वही मेरे सिंहासन पर बैठेगा
  rationale: अलग व्यक्तिवाचक सर्वनाम הוּא का बल ‘वही’ से सुरक्षित है और सिंहासनारोहण की छवि ज्यों की त्यों रहती है।
- source_word: וּמַדּוּעַ מָלַךְ אֲדֹנִיָּהוּ
  choice: फिर अदोनिय्याह राजा क्यों बन गया है?
  rationale: ‘फिर’ पूर्व शपथ से निकलने वाले विरोधाभास को दिखाता है; पूर्ण क्रिया वर्तमान स्थिति—अदोनिय्याह के राजा बन जाने—को व्यक्त करती है।
