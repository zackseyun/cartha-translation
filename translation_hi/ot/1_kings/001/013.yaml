  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज राजदरबारी भाषा रखी गई है। ‘दासी’ से मूल का स्त्रीलिंग आत्म-संदर्भ स्पष्ट रूप से सुरक्षित है, इसलिए अंग्रेज़ी की तरह वैकल्पिक पादटिप्पणी आवश्यक नहीं। प्रत्यक्ष उद्धरण की परतें हिन्दी विराम-चिह्नों से स्पष्ट की गई हैं।
