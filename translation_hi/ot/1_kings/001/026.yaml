  yaml_path: translation/ot/1_kings/001/026.yaml
  text: But me—your servant—and Zadok the priest[a], and Benaiah son of Jehoiada, and Solomon your servant, he did not call.
translation:
  language: hi
  text: परन्तु मुझे—आपके सेवक को—और सादोक याजक को, यहोयादा के पुत्र बनायाह को और आपके सेवक सुलैमान को उसने नहीं बुलाया।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उसने निमंत्रित नहीं किया।” इब्रानी क्रिया का अर्थ बुलाना, अपने पास आने को कहना या निमंत्रित करना हो सकता है; यहाँ अदोनिय्याह के बलिदानी भोज के सन्दर्भ में “निमंत्रित करना” उपयुक्त है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלִי אֲנִי עַבְדֶּךָ
  choice: परन्तु मुझे—आपके सेवक को—
  rationale: वाक्य के आरम्भ में आए पदों का बल और पिछले सन्दर्भ से उनका विरोध बनाए रखा गया है। विराम-चिह्न द्वारा אֲנִי עַבְדֶּךָ को ‘मुझे’ की सम्मानसूचक व्याख्या के रूप में स्वाभाविक हिन्दी में रखा गया है।
- source_word: צָדֹק הַכֹּהֵן
  choice: सादोक याजक
  rationale: व्यक्तिनाम का प्रचलित हिन्दी रूप और निश्चित पदवी दोनों सुरक्षित रखे गए हैं।
- source_word: בְנָיָהוּ בֶן יְהוֹיָדָע
  choice: यहोयादा के पुत्र बनायाह
  rationale: इब्रानी पितृनाम-संरचना को स्वाभाविक हिन्दी क्रम में व्यक्त किया गया है।
- source_word: שְׁלֹמֹה עַבְדְּךָ
  choice: आपके सेवक सुलैमान
  rationale: राजा के प्रति दरबारी सम्मान दर्शाने वाली עַבְדְּךָ की पुनरावृत्ति बनाए रखी गई है।
- source_word: לֹא קָרָא
  choice: उसने नहीं बुलाया
  rationale: קרא का मूल अर्थ ‘बुलाना’ है और हिन्दी में यह भोज या समारोह में आमंत्रित करने का भाव भी स्वाभाविक रूप से दे सकता है; इससे मूल की अर्थ-व्याप्ति बनी रहती है।
