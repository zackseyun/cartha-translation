    reason: lexical_alternative
lexical_decisions:
- source_word: דְבָרָיו עִם
  choice: उसने ... से सलाह-मशविरा किया
  rationale: शाब्दिक रूप से ‘उसकी बातें ... के साथ थीं’; राजनीतिक प्रसंग में यह इब्रानी मुहावरा परामर्श या गुप्त विचार-विमर्श को व्यक्त करता है। हिंदी में ‘सलाह-मशविरा किया’ स्वाभाविक और अर्थसंगत है।
- source_word: יוֹאָב בֶּן צְרוּיָה
  choice: सरूयाह के पुत्र योआब
  rationale: व्यक्तिनामों का प्रचलित हिंदी लिप्यंतरण और संबंधसूचक संरचना रखी गई है।
- source_word: אֶבְיָתָר הַכֹּהֵן
  choice: एब्यातार याजक
  rationale: הַכֹּהֵן एब्यातार के पद को सूचित करता है; हिंदी में ‘याजक’ इसका सामान्य बाइबलीय पदनाम है।
- source_word: וַיַּעְזְרוּ אַחֲרֵי
  choice: उन्होंने ... का साथ दिया
  rationale: עזר का मूल भाव सहायता देना है और אַחֲרֵי शाब्दिक रूप से ‘पीछे’ है। साथ आने पर प्रसंगानुसार किसी के पक्ष में होकर उसका समर्थन करने का अर्थ निकलता है; ‘का साथ दिया’ इस राजनीतिक निष्ठा को स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: אֲדֹנִיָּה
  choice: अदोनिय्याह
  rationale: इब्रानी व्यक्तिनाम का प्रचलित हिंदी बाइबलीय लिप्यंतरण।
