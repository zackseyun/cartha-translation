source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר שְׁלֹמֹ֔ה אִ֚ם יִהְיֶ֣ה לְ/בֶן חַ֔יִל לֹֽא יִפֹּ֥ל מִ/שַּׂעֲרָת֖/וֹ אָ֑רְצָ/ה וְ/אִם רָעָ֥ה תִמָּצֵא ב֖/וֹ וָ/מֵֽת־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/052.yaml
  text: And Solomon said[a], “If he proves to be a worthy man, not one of his hairs will fall to the ground; but if evil is found in him[b], he shall die.”
translation:
  language: hi
  text: सुलैमान ने कहा, “यदि वह अपने को योग्य व्यक्ति[a] सिद्ध करे, तो उसका एक बाल भी भूमि पर नहीं गिरेगा[b]; परन्तु यदि उसमें कोई बुराई पाई जाए, तो वह मरेगा।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “सामर्थ्य/वीरता का पुत्र।” यह इब्रानी मुहावरा प्रसंग के अनुसार योग्य, समर्थ या वीर व्यक्ति को सूचित कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: “उसका एक बाल भी भूमि पर नहीं गिरेगा” एक मुहावरा है, जिसका अर्थ है कि उसे कोई हानि नहीं होगी।
    reason: idiom_explanation
lexical_decisions:
- source_word: בֶן־חַיִל
  choice: योग्य मनुष्य
  rationale: इस इब्रानी मुहावरे का शाब्दिक अर्थ ‘सामर्थ्य/वीरता का पुत्र’ है। यहाँ प्रसंग सैन्य वीरता से अधिक आदोनिय्याह के चरित्र और आचरण की योग्यता का है, इसलिए ‘योग्य मनुष्य’ स्वाभाविक और संदर्भानुकूल है।
- source_word: יִהְיֶה
  choice: बनकर दिखाए
  rationale: मूल अर्थ ‘होगा/बनेगा’ है, पर शर्त भावी आचरण से उसके चरित्र के प्रमाणित होने की बात करती है। ‘बनकर दिखाए’ इस व्यावहारिक अर्थ को सहज हिन्दी में व्यक्त करता है।
- source_word: לֹא יִפֹּל מִשַּׂעֲרָתוֹ אָרְצָה
  choice: उसका एक बाल भी भूमि पर नहीं गिरेगा
  rationale: यह पूर्ण सुरक्षा का इब्रानी मुहावरा है। हिन्दी में निकट शाब्दिक रूप रखते हुए इसका आशय समझ में आता है कि उसे कोई हानि नहीं होगी।
- source_word: רָעָה
  choice: बुराई
  rationale: यह शब्द नैतिक बुराई, दुष्टता या अपराधपूर्ण आचरण को व्यापक रूप से व्यक्त करता है; ‘बुराई’ मूल की व्यापकता को अनावश्यक रूप से सीमित नहीं करती।
- source_word: תִמָּצֵא בוֹ
  choice: उसमें ... पाई गई
  rationale: यह निष्क्रिय रचना उस बुराई के उसमें विद्यमान या उससे संबंधित पाए जाने को व्यक्त करती है और इब्रानी संरचना के निकट है।
- source_word: וָמֵת
  choice: तो वह मरेगा
  rationale: इब्रानी में शाब्दिक रूप से ‘और/तब वह मरेगा’ है। यह अनुवाद परिणाम की न्यायिक गंभीरता बनाए रखता है, पर मृत्यु कराने वाले कर्ता को वहाँ स्पष्ट नहीं करता जहाँ मूल भी उसे स्पष्ट नहीं करता।
theological_decisions:
- issue: וָמֵת में भविष्यवाणी और न्यायिक दंडादेश के बीच संभावित अर्थ-तनाव
  choice: तो वह मरेगा
  alternative: तो उसे मार डाला जाएगा
  rationale: प्रसंग दंडादेश का संकेत देता है, लेकिन मूल क्रिया स्वयं अकर्मक है और मृत्यु कराने वाले कर्ता को व्यक्त नहीं करती। इसलिए अनुवाद ने न्यायिक गंभीरता रखते हुए उस अस्पष्टता को सुरक्षित रखा है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, सहज किंतु राजकीय और न्यायिक प्रसंग के अनुरूप गरिमापूर्ण रखी गई है। ‘भूमि’ ने वाक्य को हल्की औपचारिक गरिमा दी है, जबकि ‘बनकर दिखाए’ भावी आचरण द्वारा चरित्र प्रमाणित होने का स्वाभाविक हिन्दी रूप है।
