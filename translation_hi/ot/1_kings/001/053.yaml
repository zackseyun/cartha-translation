base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/053.yaml
  text: Then King Solomon sent[a], and they brought him down from the altar. And he came and bowed down to King Solomon, and Solomon said to him, “Go to your house.”
translation:
  language: hi
  text: तब राजा सुलैमान ने लोगों को भेजा, और वे उसे वेदी पर से उतार लाए। वह आया और राजा सुलैमान के सामने झुककर प्रणाम किया। तब सुलैमान ने उससे कहा, “अपने घर जाओ।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: लोगों को भेजा
  rationale: हिब्रू क्रिया का अर्थ ‘भेजा’ है; कर्म मूल पाठ में अनिर्दिष्ट है, पर अगली बहुवचन क्रिया के कारण हिन्दी में ‘लोगों को’ कहना स्वाभाविक और संदर्भानुकूल है।
- source_word: וַיֹּרִדֻהוּ
  choice: वे ... नीचे ले आए
  rationale: कारक अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है और अनाम बहुवचन कर्ताओं को बनाए रखता है।
- source_word: מֵעַל הַמִּזְבֵּחַ
  choice: वेदी के पास से
  rationale: מֵעַל का मूल अर्थ ‘ऊपर से/के ऊपर की ओर से’ है, पर पिछले संदर्भ में अदोनिय्याह वेदी के सींग पकड़े हुए था; इसलिए ‘वेदी के पास से’ भौतिक स्थिति को भ्रामक ढंग से वेदी के ऊपर खड़ा नहीं बताता।
- source_word: וַיָּבֹא
  choice: वह आया
  rationale: सामान्य गत्यर्थक क्रिया का सीधा और अनिर्दिष्ट अनुवाद है।
- source_word: וַיִּשְׁתַּחוּ
  choice: झुककर प्रणाम किया
  rationale: सम्मानसूचक झुकने की क्रिया को स्पष्ट करता है, पर पूर्ण दंडवत होने की सीमा को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: לַמֶּלֶךְ שְׁלֹמֹה
  choice: राजा सुलैमान के सामने
  rationale: यहाँ ל उस व्यक्ति को चिह्नित करता है जिसके प्रति सम्मान प्रकट किया गया; आधुनिक हिन्दी में ‘के सामने’ स्वाभाविक है।
- source_word: לֵךְ לְבֵיתֶךָ
  choice: अपने घर जाओ
  rationale: आज्ञार्थक वाक्य और गंतव्य दोनों को सहज, गरिमापूर्ण हिन्दी में सुरक्षित रखता है।
