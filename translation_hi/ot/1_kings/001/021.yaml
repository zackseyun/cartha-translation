base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/021.yaml
  text: And when my lord the king lies down with his fathers[a], I and my son Solomon will be counted as offenders.
translation:
  language: hi
  text: और जब मेरे स्वामी राजा अपने पुरखों के साथ विश्राम करेंगे, तब मैं और मेरा पुत्र सुलैमान अपराधी[a] ठहराए जाएँगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “पापी।” इब्रानी शब्द उन लोगों के लिए भी प्रयुक्त हो सकता है जिन्हें दोषी या दंड के योग्य माना जाए; यहाँ संदर्भ सामान्य नैतिक वर्णन के बजाय कानूनी-राजनीतिक स्थिति की ओर संकेत करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: तब ... ठहराए जाएँगे
  rationale: यह आगे आने वाले परिणाम को प्रस्तुत करता है; हिन्दी में ‘तब’ शर्त-परिणाम के संबंध को स्वाभाविक रूप से व्यक्त करता है।
- source_word: כִּשְׁכַב ... עִם אֲבֹתָיו
  choice: जब ... अपने पुरखों के साथ सो जाएँगे
  rationale: यह मृत्यु के लिए प्रयुक्त इब्रानी मुहावरा है। अनुवाद मूल बिंब को बनाए रखता है, जबकि ‘पुरखों के साथ’ उसका आशय स्पष्ट करता है।
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: मेरे स्वामी राजा
  rationale: यह दाऊद के प्रति बतशेबा का आदरपूर्ण राजदरबारी संबोधन है।
- source_word: וְהָיִיתִי אֲנִי וּבְנִי שְׁלֹמֹה
  choice: मैं और मेरा पुत्र सुलैमान ... ठहराए जाएँगे
  rationale: शाब्दिक ‘होंगे’ के स्थान पर ‘ठहराए जाएँगे’ उस सामाजिक-राजनीतिक आकलन को स्वाभाविक हिन्दी में व्यक्त करता है, जो संदर्भ में निहित है।
- source_word: חַטָּאִים
  choice: अपराधी
  rationale: यह शब्द पापी या दोषी व्यक्ति को सूचित कर सकता है; उत्तराधिकार के इस संदर्भ में ‘अपराधी’ दंडनीय अथवा दोषी समझे जाने की कानूनी-राजनीतिक स्थिति को व्यक्त करता है।
theological_decisions:
- issue: חַטָּאִים का नैतिक बनाम कानूनी-राजनीतिक अर्थ
  choice: मुख्य पाठ में ‘अपराधी’
  alternative: ‘पापी’ या ‘दोषी’
  rationale: उत्तराधिकार के संघर्ष में बतशेबा को भय है कि दाऊद की मृत्यु के बाद उसे और सुलैमान को सत्ता-विरोधी दोषी मानकर दंडित किया जाएगा। फिर भी शब्द का व्यापक नैतिक अर्थ संभव है, इसलिए उसे पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण और सहज शैली। राजदरबारी आदर के लिए ‘मेरे स्वामी राजा’ और मृत्यु के इब्रानी मुहावरे को बनाए रखने के लिए ‘अपने पुरखों के साथ सो जाएँगे’ चुना गया है।
