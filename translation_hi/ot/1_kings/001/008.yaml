source:
  edition: WLC
  text: וְ/צָד֣וֹק הַ֠/כֹּהֵן וּ/בְנָיָ֨הוּ בֶן יְהוֹיָדָ֜ע וְ/נָתָ֤ן הַ/נָּבִיא֙ וְ/שִׁמְעִ֣י וְ/רֵעִ֔י וְ/הַ/גִּבּוֹרִ֖ים אֲשֶׁ֣ר לְ/דָוִ֑ד לֹ֥א הָי֖וּ עִם אֲדֹנִיָּֽהוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/008.yaml
  text: But Zadok the priest[a], Benaiah son of Jehoiada, Nathan the prophet, Shimei, Rei, and the mighty men who belonged to David were not with Adonijah.
translation:
  language: hi
  text: परन्तु सादोक याजक, यहोयादा का पुत्र बनायाह, नातान भविष्यद्वक्ता, शिमी, रेई और दाऊद के वीर योद्धा[a] अदोनिय्याह के साथ नहीं थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “वे वीर पुरुष जो दाऊद के थे।” इसका अर्थ “दाऊद के वीर योद्धा” भी हो सकता है।
    reason: मूल इब्रानी संबंधवाचक वाक्यांश אֲשֶׁר לְדָוִד की शाब्दिक बनावट और स्वाभाविक अर्थ—दोनों को सुरक्षित रखना।
lexical_decisions:
- source_word: וְ/צָד֣וֹק הַ/כֹּהֵן
  choice: परन्तु सादोक याजक
  rationale: आरम्भिक וְ पिछले पद में अदोनिय्याह के समर्थकों की सूची के विपरीत समूह प्रस्तुत करता है, इसलिए हिन्दी में ‘परन्तु’ स्वाभाविक है। כֹּהֵן का मानक पदनाम ‘याजक’ रखा गया है।
- source_word: וּ/בְנָיָהוּ בֶן יְהוֹיָדָע
  choice: यहोयादा का पुत्र बनायाह
  rationale: हिब्रू वंशसूचक संबंध को स्पष्ट और स्वाभाविक हिन्दी क्रम में रखा गया है।
- source_word: וְ/נָתָן הַ/נָּבִיא
  choice: नातान भविष्यद्वक्ता
  rationale: נָבִיא का प्रचलित और सटीक हिन्दी अनुवाद ‘भविष्यद्वक्ता’ है; यह नातान के पद की समानाधिकरण पहचान है।
- source_word: וְ/שִׁמְעִי וְ/רֵעִי
  choice: शिमी, रेई
  rationale: व्यक्तिनामों का देवनागरी लिप्यंतरण किया गया है और सूची को स्वाभाविक हिन्दी विराम-चिह्नों के साथ प्रस्तुत किया गया है।
- source_word: וְ/הַ/גִּבּוֹרִים אֲשֶׁר לְ/דָוִד
  choice: और दाऊद के वीर योद्धा[a]
  rationale: גִּבּוֹרִים युद्धक पराक्रम वाले विशिष्ट पुरुषों को सूचित करता है, इसलिए ‘वीर योद्धा’ अर्थ को सहजता से व्यक्त करता है। אֲשֶׁר לְדָוִד का संबंध हिन्दी में ‘दाऊद के’ से संक्षेपित है; शाब्दिक संबंध पादटिप्पणी में सुरक्षित है।
- source_word: לֹא הָיוּ עִם
  choice: के साथ नहीं थे
  rationale: हिब्रू की संयत अभिव्यक्ति ‘साथ नहीं थे’ को बनाए रखा गया है; राजनीतिक समर्थन का आशय संदर्भ से स्पष्ट होता है, उसे पाठ में अधिक व्याख्यायित नहीं किया गया।
- source_word: אֲדֹנִיָּהוּ
  choice: अदोनिय्याह
  rationale: व्यक्तिनाम का प्रचलित हिन्दी बाइबलीय रूप रखा गया है।
