  text: Now come[a], please let me advise you[c][b], and save your life and the life of your son Solomon.
translation:
  language: hi
  text: अब आओ[a], मैं तुम्हें सलाह दूँ[b]; और अपनी जान[c] तथा अपने पुत्र सुलैमान की जान बचाओ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक अर्थ ‘जाओ’ है; यहाँ प्रत्यक्ष संबोधन में यह तत्काल बुलावे के मुहावरे के रूप में प्रयुक्त हुआ है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में ‘सलाह देना’ वाली क्रिया के साथ उसी मूल की संज्ञा भी है—एक बलवर्धक निर्माण जिसका अर्थ है, ‘तुम्हें सलाह देना।’
    reason: lexical_alternative
  - marker: c
    text: इब्रानी נֶפֶשׁ (नेफ़ेश) यहाँ ‘आत्मा’ नहीं, संकट में पड़ी ‘जान’ या ‘जीवन’ को दर्शाता है।
    reason: lexical_alternative
