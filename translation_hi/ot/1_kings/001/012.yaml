  rationale: मूल क्रिया का शाब्दिक अर्थ ‘जाओ/चलो’ है, पर प्रत्यक्ष संबोधन में यह किसी को तत्काल प्रस्ताव सुनने के लिए बुलाने वाला मुहावरा है; हिंदी में ‘आओ’ स्वाभाविक है।
- source_word: אִיעָצֵךְ נָא עֵצָה
  choice: मैं तुम्हें एक सलाह दूँ
  rationale: क्रिया और उसी धातु से बने संज्ञा-पद का स्रोत-भाषा में संयुक्त प्रयोग है। हिंदी में ‘सलाह दूँ’ अर्थ को सहज रूप में रखता है; निवेदन का भाव संदर्भ और संभावनार्थक ‘दूँ’ से व्यक्त होता है।
- source_word: וּמַלְּטִי
  choice: और तुम ... बचाओ
  rationale: स्त्रीलिंग एकवचन आज्ञार्थक रूप बतशेबा को स्वयं कदम उठाकर जीवन सुरक्षित करने के लिए कहता है; ‘बचाओ’ स्पष्ट और स्वाभाविक है।
- source_word: נַפְשֵׁךְ ... נֶפֶשׁ
  choice: अपने प्राण ... के प्राण
  rationale: यहाँ נֶפֶשׁ अमूर्त ‘आत्मा’ नहीं, संकट में पड़े जीवन को सूचित करता है। ‘प्राण’ हिंदी में जीवन की रक्षा के इस संदर्भ को गरिमापूर्ण ढंग से व्यक्त करता है।
- source_word: בְּנֵךְ שְׁלֹמֹה
  choice: अपने पुत्र सुलैमान
  rationale: संबंध और नाम दोनों को मूल पाठ के अनुसार स्पष्ट रखा गया है।
