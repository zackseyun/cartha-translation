base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/034.yaml
  text: There Zadok the priest and Nathan the prophet shall anoint him king over Israel[a], and you shall blow the trumpet and say, ‘Long live King Solomon!’
translation:
  language: hi
  text: वहाँ सादोक याजक और नातान भविष्यद्वक्ता उसका इस्राएल पर राजा के रूप में अभिषेक करें, और तुम नरसिंगा[a] फूँककर कहो, “राजा सुलैमान चिरायु हों!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इब्रानी: शोफ़ार—सार्वजनिक संकेत या घोषणा के लिए फूँका जाने वाला सींग का वाद्य, अक्सर मेढ़े के सींग का; परंपरागत रूप से इसका अनुवाद “तुरही” भी किया जाता है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמָשַׁח אֹתוֹ שָׁם
  choice: वहाँ ... उसका अभिषेक करके
  rationale: स्थानवाचक שָׁם को स्वाभाविक रूप से ‘वहाँ’ रखा गया है। निर्देशों की इस शृंखला में וּמָשַׁח का बल आज्ञार्थक है; संयुक्त क्रिया ‘अभिषेक करके’ अगले पद के साथ संबंध स्पष्ट करती है।
- source_word: צָדוֹק הַכֹּהֵן וְנָתָן הַנָּבִיא
  choice: सादोक याजक और नातान भविष्यद्वक्ता
  rationale: व्यक्तिनामों का प्रचलित हिन्दी लिप्यंतरण और पदवियों के लिए मानक, सहज हिन्दी शब्द रखे गए हैं।
- source_word: לְמֶלֶךְ עַל יִשְׂרָאֵל
  choice: उसे इस्राएल का राजा ठहराएँ
  rationale: לְמֶלֶךְ अभिषेक के परिणामस्वरूप प्राप्त राजकीय पद को सूचित करता है और עַל इस्राएल पर शासन का भाव देता है। हिन्दी में ‘इस्राएल का राजा ठहराएँ’ दोनों भावों को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: וּתְקַעְתֶּם בַּשּׁוֹפָר
  choice: तुम नरसिंगा फूँककर
  rationale: שׁוֹפָר संकेत या सार्वजनिक घोषणा के लिए फूँका जाने वाला सींग है। ‘नरसिंगा’ हिन्दी में ऐसे फूँक-वाद्य का परिचित बाइबलीय शब्द है; मूल वस्तु की अधिक सटीक जानकारी पादटिप्पणी में दी गई है।
- source_word: וַאֲמַרְתֶּם
  choice: कहना
  rationale: द्वितीय पुरुष बहुवचन निर्देश को हिन्दी के स्वाभाविक आज्ञार्थक रूप में व्यक्त किया गया है।
- source_word: יְחִי הַמֶּלֶךְ שְׁלֹמֹה
  choice: राजा सुलैमान चिरायु हों!
  rationale: יְחִי राजकीय जयघोष में प्रयुक्त जुस्सिव रूप है। ‘चिरायु हों’ उसका dignified और प्रचलित हिन्दी समतुल्य है।
