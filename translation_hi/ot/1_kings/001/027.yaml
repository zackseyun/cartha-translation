id: 1KI.1.27
reference: 1 Kings 1:27
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: אִ֗ם מֵ/אֵת֙ אֲדֹנִ֣/י הַ/מֶּ֔לֶךְ נִהְיָ֖ה הַ/דָּבָ֣ר הַ/זֶּ֑ה וְ/לֹ֤א הוֹדַ֨עְתָּ֙ אֶֽת עבדי/ך מִ֗י יֵשֵׁ֛ב עַל כִּסֵּ֥א אֲדֹנִֽ/י הַ/מֶּ֖לֶךְ אַחֲרָֽי/ו־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/027.yaml
  text: If this thing has come from my lord the king[a], have you not made known to your servants who will sit on the throne of my lord the king after him?
translation:
  language: hi
  text: यदि यह बात[a] मेरे प्रभु राजा की ओर से हुई है, तो क्या आपने अपने सेवकों को यह नहीं बताया कि मेरे प्रभु राजा के बाद उनके सिंहासन पर कौन बैठेगा?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘यह मामला’ अथवा ‘यह घटना’।
    reason: इब्रानी דָּבָר व्यापक अर्थ वाला शब्द है; यहाँ वह कथित राजकीय कार्य, निर्णय या घटनाक्रम को सूचित कर सकता है।
lexical_decisions:
- source_word: אִם
  choice: यदि ... तो क्या
  rationale: यहाँ אִם शर्त के रूप में एक तीखा आलंकारिक प्रश्न आरम्भ करता है। हिन्दी में ‘यदि ... तो क्या’ मूल की शर्त और प्रश्न—दोनों को स्वाभाविक ढंग से बनाए रखता है।
- source_word: מֵאֵת אֲדֹנִי הַמֶּלֶךְ נִהְיָה
  choice: मेरे प्रभु राजा की ओर से हुई है
  rationale: מֵאֵת स्रोत या राजकीय स्वीकृति का संकेत देता है और נִהְיָה बताता है कि बात घटित या आरम्भ हुई। यह रूप राजा से उत्पत्ति या अनुमति—दोनों की सम्भावना को खुला रखता है।
- source_word: הַדָּבָר הַזֶּה
  choice: यह बात
  rationale: דבר का अर्थ यहाँ व्यापक है और कथित राजकीय निर्णय या कार्य को सूचित करता है। ‘बात’ आधुनिक हिन्दी में सहज है; अन्य सम्भव अर्थ पादटिप्पणी में दिए गए हैं।
- source_word: וְלֹא הוֹדַעְתָּ
  choice: तो क्या आपने ... यह नहीं बताया
  rationale: ידע का हिफ़ील रूप ‘जानकारी देना/ज्ञात कराना’ है। ‘नहीं बताया’ वर्तमान हिन्दी में स्वाभाविक रहते हुए आलंकारिक प्रश्न का बल बनाए रखता है।
- source_word: עֲבָדֶיךָ
  choice: अपने सेवकों को
  rationale: राजदरबार में עבד अधिकारियों की विनम्र आत्म-पहचान है। हिन्दी में कर्ता ‘आपने’ के साथ ‘अपने सेवकों’ स्वाभाविक रूप से ‘आपके सेवकों’ का अर्थ देता है।
- source_word: מִי יֵשֵׁב עַל כִּסֵּא
  choice: सिंहासन पर कौन बैठेगा
  rationale: शाब्दिक सिंहासन-चित्र और भावी उत्तराधिकार दोनों सुरक्षित रखे गए हैं; इसे केवल ‘राज करेगा’ बनाकर बिंब को हटाया नहीं गया।
- source_word: אַחֲרָיו
  choice: उनके बाद
  rationale: यह वर्तमान राजा के बाद उत्तराधिकार को दर्शाता है। सम्मानसूचक बहुवचन हिन्दी के राजकीय सम्बोधन के अनुरूप है और ‘उनके स्थान पर’ जैसी अधिक व्याख्यात्मक अभिव्यक्ति से बचता है।
theological_decisions:
- issue: राजदरबार में עבד का अर्थ
  choice: अपने सेवकों को
  alternative: अपने दासों को
  rationale: इस प्रसंग में यह दरबारी अधीनता और विनम्र आत्म-संबोधन की प्रचलित अभिव्यक्ति है, न कि दासत्व की सामाजिक स्थिति पर विशेष बल। इसलिए ‘सेवक’ प्रसंग के आशय को अधिक ठीक व्यक्त करता है।
- issue: राजा से इस बात के होने का आशय
  choice: मेरे प्रभु राजा की ओर से हुई है
  alternative: मेरे प्रभु राजा ने इसका आदेश दिया है
  rationale: मूल पाठ स्रोत या स्वीकृति का संकेत देता है, पर स्पष्ट रूप से ‘आदेश’ नहीं कहता। चुना हुआ रूप जानबूझकर इस सम्भावित अस्पष्टता को बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, सम्मानपूर्ण और राजदरबार के प्रसंग के अनुरूप रखी गई है। ‘मेरे प्रभु राजा’ मूल के विनम्र संबोधन को सुरक्षित रखता है, जबकि ‘बताया’ अत्यधिक संस्कृतनिष्ठ ‘ज्ञात कराया’ की अपेक्षा सामान्य पाठक के लिए अधिक सहज है।
