lexical_decisions:
- source_word: וַיַּעַן וַיֹּאמֶר
  choice: उत्तर दिया
  rationale: दोनों इब्रानी क्रियाएँ मिलकर संवाद में उत्तर की भूमिका बताती हैं। आधुनिक हिन्दी में ‘उत्तर दिया’ स्वाभाविक है; ‘उत्तर देकर कहा’ मूल की दोहरी अभिव्यक्ति को अधिक शब्दशः रखता, पर यहाँ अनावश्यक रूप से भारी लगता।
- source_word: לַאֲדֹנִיָּהוּ
  choice: अदोनिय्याह को
  rationale: ל उपसर्ग को ‘को’ से व्यक्त किया गया है और व्यक्ति के नाम का प्रचलित हिन्दी लिप्यंतरण रखा गया है।
- source_word: אֲבָל
  choice: नहीं!
  rationale: यहाँ अव्यय अदोनिय्याह की धारणा का जोरदार खंडन करता है। ‘नहीं!’ आधुनिक हिन्दी में उस सुधारात्मक-विरोधी बल को स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: אֲדֹנֵינוּ הַמֶּלֶךְ דָּוִד
  choice: हमारे स्वामी राजा दाऊद
  rationale: राजदरबार के संदर्भ में אֲדֹנֵינוּ के लिए ‘हमारे स्वामी’ उपयुक्त है और הַמֶּלֶךְ דָּוִד को स्वाभाविक हिन्दी पदक्रम में ‘राजा दाऊद’ रखा गया है।
- source_word: הִמְלִיךְ אֶת שְׁלֹמֹה
  choice: सुलैमान को राजा बना दिया है
  rationale: מלך का हिफ़ील रूप किसी को राजा ठहराने या स्थापित करने का कारणवाचक अर्थ देता है। ‘राजा बना दिया है’ इस अर्थ को स्पष्ट रखता है; केवल ‘अभिषेक किया’ कहना मूल क्रिया से अधिक विशिष्ट होता।
