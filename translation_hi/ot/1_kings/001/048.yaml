  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय हिन्दी में उसके सुविदित लिप्यंतरण से व्यक्त किया गया है।
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: इस्राएल का परमेश्वर
  rationale: इब्रानी संबंध-संरचना का स्पष्ट और स्वाभाविक हिन्दी रूप।
- source_word: אֲשֶׁר נָתַן הַיּוֹם
