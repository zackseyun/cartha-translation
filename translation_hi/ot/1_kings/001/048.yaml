  rationale: נתן के सामान्य अर्थ ‘देना’ और पूर्ण कार्य की वर्तमान प्रासंगिकता को सुरक्षित रखता है।
- source_word: יֹשֵׁב עַל כִּסְאִי
  choice: मेरे सिंहासन पर बैठने के लिए एक व्यक्ति
  rationale: संज्ञात्मक कृदंत के अनिर्दिष्ट मानवीय कर्ता और सिंहासन पर बैठाए जाने के परिणामगत भाव को बिना नाम जोड़े व्यक्त करता है।
- source_word: וְעֵינַי רֹאוֹת
  choice: और मेरी आँखें यह देख रही हैं
  rationale: मूल के संयोजक ‘और’, बहुवचन ‘आँखें’ और वर्तमान कृदंत की प्रत्यक्ष, जारी अनुभूति को बनाए रखता है; ‘यह’ प्रसंग से पूरित कर्म है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल में व्यक्तिगत ईश्वरीय नाम है। हिन्दी पाठकों में स्थापित लिप्यंतरण ‘यहोवा’ उसे ‘प्रभु’ जैसी उपाधि से प्रतिस्थापित किए बिना स्पष्ट रूप से प्रस्तुत करता है।
- issue: सिंहासन पर बैठने वाले व्यक्ति की पहचान
  choice: एक व्यक्ति
  alternative: सुलैमान
  rationale: इस पद के इब्रानी पाठ में व्यक्ति का नाम नहीं है; इसलिए प्रसंग से सुलैमान का नाम जोड़ने के बजाय मूल की अनिर्दिष्टता रखी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी; कथात्मक भूमिका सरल रखी गई है और उद्धरण में गरिमापूर्ण स्तुतिपरक शैली अपनाई गई है। मूल की अनिर्दिष्टता तथा अंतिम क्रिया के अप्रकट कर्म को यथासंभव सुरक्षित रखा गया है।
