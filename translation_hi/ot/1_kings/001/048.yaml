base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/048.yaml
  text: 'And the king also said thus: ‘Blessed be Yahweh[a], the God of Israel, who today has given one to sit on my throne, and my eyes see it.’'
translation:
  language: hi
  text: और राजा ने यह भी कहा, “इस्राएल का परमेश्वर याहवे[a] धन्य है, जिसने आज किसी को मेरे सिंहासन पर बैठाया है, और मेरी आँखें इसे देख रही हैं।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ईश्वरीय नाम के लिए ‘यहोवा’ भी प्रचलित लिप्यंतरण है।
    reason: नाम के लिप्यंतरण का विकल्प बताना।
lexical_decisions:
