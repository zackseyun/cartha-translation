  choice: और राजा ने यह भी कहा
  rationale: यह स्वाभाविक आधुनिक हिन्दी में अतिरिक्त कथन का भाव और आगे आने वाले उद्धरण की भूमिका—दोनों व्यक्त करता है।
- source_word: בָּרוּךְ
