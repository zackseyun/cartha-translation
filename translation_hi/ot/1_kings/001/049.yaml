  text: Then all Adonijah’s invited guests trembled and rose[a], and each man went his way.
translation:
  language: hi
  text: तब अदोनिय्याह के सभी निमंत्रित अतिथि डर से काँप उठे और खड़े हो गए, और हर एक अपने रास्ते चला गया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֶּחֶרְדוּ
  choice: डर से काँप उठे
  rationale: חרד भय या घबराहट के कारण काँपने को व्यक्त करता है। यह अनुवाद शारीरिक और भावात्मक दोनों अर्थों को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: וַיָּקֻמוּ
  choice: खड़े हो गए
  rationale: קום का यहाँ अर्थ उठना या खड़ा होना है; भोज में बैठे अतिथियों की अचानक प्रतिक्रिया के लिए यह सहज हिन्दी है।
- source_word: כָּל הַקְּרֻאִים אֲשֶׁר לַאֲדֹנִיָּהוּ
  choice: अदोनिय्याह के सभी निमंत्रित अतिथि
  rationale: הַקְּרֻאִים का शाब्दिक अर्थ ‘बुलाए हुए लोग’ है। भोज के प्रसंग में ‘निमंत्रित अतिथि’ स्वाभाविक और सटीक है; לַאֲדֹנִיָּהוּ संबंध को दर्शाता है।
- source_word: וַיֵּלְכוּ
  choice: चला गया
  rationale: הלך सामान्यतः जाने या चलने का क्रियापद है। हिन्दी में आगे के एकवचन-वितरक पद ‘हर एक’ के अनुरूप एकवचन रखा गया है।
- source_word: אִישׁ לְדַרְכּוֹ
  choice: हर एक अपने-अपने रास्ते चला गया
  rationale: यह वितरक मुहावरा बताता है कि वे अलग-अलग चले गए। ‘हर एक’ मूल के אִישׁ की वितरक शक्ति को रखता है और ‘अपने-अपने रास्ते’ उस मुहावरे को स्वाभाविक हिन्दी में व्यक्त करता है।
