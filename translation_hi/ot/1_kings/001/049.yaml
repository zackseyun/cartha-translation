  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, स्पष्ट कथात्मक शैली अपनाई गई है। ‘डर से काँप उठे’ मूल की तीव्र प्रतिक्रिया को बनाए रखता है, जबकि ‘अपने-अपने रास्ते’ सामूहिक सभा के तत्काल बिखर जाने को स्वाभाविक ढंग से व्यक्त करता है।
