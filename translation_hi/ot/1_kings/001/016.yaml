lexical_decisions:
- source_word: וַתִּקֹּד
  choice: झुककर
  rationale: קָדַד शरीर को झुकाने का संकेत देता है। ‘झुककर’ पहले हावभाव को स्वाभाविक रूप से व्यक्त करता है और घुटने टेकने जैसी अतिरिक्त विशिष्टता नहीं जोड़ता।
- source_word: בַּת שֶׁבַע
  choice: बतशेबा
  rationale: हिब्रू नाम का प्रचलित आधुनिक हिन्दी लिप्यंतरण।
- source_word: וַתִּשְׁתַּחוּ
  choice: दण्डवत् किया
  rationale: שׁחה का यह रूप गहरे प्रणाम अथवा भूमि तक झुककर सम्मान प्रकट करने को दर्शाता है। यह पहले क्रियापद से भेद रखते हुए दोनों क्रियाओं की तीव्रता सुरक्षित रखता है।
- source_word: לַמֶּלֶךְ
  choice: राजा के सामने
  rationale: सम्मानसूचक शारीरिक मुद्रा के साथ ל का स्वाभाविक हिन्दी रूप ‘के सामने’ है।
- source_word: וַיֹּאמֶר הַמֶּלֶךְ
  choice: और राजा ने पूछा
  rationale: शाब्दिक अर्थ ‘और राजा ने कहा’ है, पर इसके बाद प्रश्न होने के कारण आधुनिक हिन्दी कथन में ‘पूछा’ अधिक स्वाभाविक है और संवाद का कार्य ठीक व्यक्त करता है।
- source_word: מַה לָּךְ
  choice: तुम क्या चाहती हो?
  rationale: मुहावरे का शाब्दिक रूप ‘तुम्हारे लिए क्या है?’ है; प्रसंग में राजा बतशेबा की विनती या चिंता पूछ रहा है। स्त्रीलिंग ‘चाहती’ संबोधित व्यक्ति के अनुसार स्वाभाविक हिन्दी है।
