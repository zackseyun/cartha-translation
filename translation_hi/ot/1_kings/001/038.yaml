base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/038.yaml
  text: So Zadok the priest[a], Nathan the prophet, Benaiah son of Jehoiada, and the Cherethites and the Pelethites went down and had Solomon ride on King David’s mule[c][b], and they brought him to Gihon.
translation:
  language: hi
  text: तब सादोक याजक, नातान भविष्यद्वक्ता, यहोयादा का पुत्र बनायाह, और करेती और पलेती लोग नीचे गए। उन्होंने सुलैमान को राजा दाऊद के खच्चर[a] पर सवार कराया और उसे गीहोन तक ले गए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी शब्द विशेष रूप से मादा खच्चर को सूचित करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּרֶד
  choice: नीचे गए
  rationale: क्रिया ירד की दिशासूचक भावना ‘नीचे जाना’ को स्वाभाविक हिन्दी में बनाए रखता है। एकवचन क्रिया संयुक्त कर्ताओं से पहले आई है, पर हिन्दी में अर्थानुसार बहुवचन रखा गया है।
- source_word: הַכֹּהֵן
  choice: याजक
  rationale: כהן का प्रचलित और गरिमापूर्ण हिन्दी बाइबलीय पर्याय।
- source_word: הַנָּבִיא
  choice: भविष्यद्वक्ता
  rationale: נביא के लिए मानक हिन्दी पद, जो नातान की उपाधि को सुरक्षित रखता है।
- source_word: הַכְּרֵתִי וְהַפְּלֵתִי
  choice: करेती और पलेती लोग
  rationale: मूल में आए समूह-नामों को उनके अनिश्चित जातीय अथवा पदगत अर्थ की व्याख्या किए बिना लिप्यंतरित किया गया है।
- source_word: וַיַּרְכִּבוּ
  choice: सवार कराया
  rationale: רכב के हिफ़ील रूप का प्रेरणार्थक अर्थ ‘सवारी कराना’ स्वाभाविक हिन्दी में व्यक्त होता है।
- source_word: פִּרְדַּת
  choice: खच्चरी
  rationale: संज्ञा स्त्रीलिंग पशु, अर्थात मादा खच्चर, को सूचित करती है; ‘खच्चरी’ इस सूचना को संक्षेप में सुरक्षित रखता है।
- source_word: הַמֶּלֶךְ דָּוִד
  choice: राजा दाऊद की
  rationale: सम्बन्धकारक पदबंध का स्वाभाविक हिन्दी रूप, जो पशु पर दाऊद के स्वामित्व और राजकीय सम्बन्ध को स्पष्ट रखता है।
- source_word: וַיֹּלִכוּ אֹתוֹ
  choice: उसे ... ले गए
  rationale: הלך के हिफ़ील का प्रेरणार्थक गति-अर्थ यहाँ ‘ले गए’ से स्वाभाविक रूप में व्यक्त होता है और यह अनावश्यक रूप से पैदल चलाने का संकेत नहीं देता।
- source_word: עַל גִּחוֹן
  choice: गीहोन तक
  rationale: गतिसूचक प्रसंग में על गन्तव्य को सूचित करता है; हिन्दी में ‘तक’ जुलूस की दिशा और गन्तव्य को सहजता से व्यक्त करता है।
