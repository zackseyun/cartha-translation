base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/018.yaml
  text: And now, look, Adonijah has become king, and now, my lord the king, you do not know it.
translation:
  language: hi
  text: और अब देखिए, अदोनिय्याह राजा हो गया है; और अब, मेरे स्वामी राजा, आपको यह मालूम नहीं है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִנֵּה
  choice: देखिए
  rationale: ध्यान आकर्षित करने वाले इस संकेतक को आधुनिक, सम्मानसूचक और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: מָלָךְ
  choice: राजा बन बैठा है
  rationale: यहाँ क्रिया अदोनिय्याह के राजसत्ता ग्रहण कर लेने को बताती है; ‘बन बैठा’ प्रसंग में अनधिकृत या चिंताजनक रूप से राजा बनने की ध्वनि को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: לֹא יָדָעְתָּ
  choice: आपको इसकी खबर तक नहीं है
  rationale: शाब्दिक ‘आपने नहीं जाना’ के आशय को वर्तमान स्थिति के संदर्भ में सहज हिन्दी में व्यक्त करता है; ‘तक’ बतशेबा के आश्चर्य और तात्कालिकता को उभारता है।
theological_decisions:
- issue: अदोनिय्याह के राजत्व की वैधता
  choice: ‘राजा बन बैठा है’ द्वारा घटना का कथन, वैध अभिषेक की पुष्टि नहीं
  alternative: ‘राजा हो गया है’
  rationale: मूल केवल מָלָךְ कहता है, पर प्रसंग विवादित सत्ता-ग्रहण का है। चुना हुआ वाक्यांश इस तनाव को रखता है और उसे वैध राजा घोषित नहीं करता।
translation_notes:
