source:
  edition: WLC
  text: וַ/אֲדֹנִיָּ֧ה בֶן חַגִּ֛ית מִתְנַשֵּׂ֥א לֵ/אמֹ֖ר אֲנִ֣י אֶמְלֹ֑ךְ וַ/יַּ֣עַשׂ ל֗/וֹ רֶ֚כֶב וּ/פָ֣רָשִׁ֔ים וַ/חֲמִשִּׁ֥ים אִ֖ישׁ רָצִ֥ים לְ/פָנָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/005.yaml
  text: Adonijah the son of Haggith exalted himself[a], saying, “I will reign.” So he made for himself a chariot, horsemen[b], and fifty men running before him.
translation:
  language: hi
  text: हग्गीत का पुत्र अदोनिय्याह अपने आपको ऊँचा उठाने लगा और कहने लगा, “मैं राज्य करूँगा[b]।” तब उसने अपने लिए एक रथ, घुड़सवार और उसके आगे दौड़नेवाले पचास आदमी तैयार किए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: या “मैं राजा बनूँगा।”
    reason: alternative_reading
lexical_decisions:
- source_word: מִתְנַשֵּׂא
  choice: अपने आपको ऊँचा उठाने लगा
  rationale: हित्पएल कृदंत आत्म-उत्थान और स्वयं को बड़ा बनाने की चेष्टा व्यक्त करता है। यह रूप उसकी बढ़ती हुई आत्म-महत्त्वाकांक्षा तथा पाठ में निहित नकारात्मक भाव को बिना अतिरिक्त नैतिक टिप्पणी के बनाए रखता है।
- source_word: לֵאמֹר אֲנִי אֶמְלֹךְ
  choice: उसने कहा, “मैं राज करूँगा।”
  rationale: उद्धरण अदोनिय्याह के राजसत्ता के दावे को सीधे व्यक्त करता है। ‘राज करूँगा’ מלך की क्रियात्मक शक्ति को सुरक्षित रखता है; ‘राजा बनूँगा’ भी प्रसंगानुकूल सम्भव अर्थ है।
- source_word: וַיַּעַשׂ לוֹ
  choice: फिर उसने अपने लिए ... तैयार किए
  rationale: עשה का मूल अर्थ ‘बनाना/करना’ है, पर रथ और अनुचरों के इस समूह के संदर्भ में ‘तैयार किए’ स्वाभाविक हिन्दी है और यह तय नहीं करता कि उसने उन्हें बनवाया, जुटाया या नियुक्त किया।
- source_word: רֶכֶב
  choice: एक रथ
  rationale: एकवचन संज्ञा को एकवचन रखा गया है और राजकीय प्रदर्शन के प्रसंग में इसे वाहन ‘रथ’ समझा गया है।
- source_word: פָרָשִׁים
  choice: घुड़सवार
  rationale: बहुवचन शब्द सवार अनुचरों को दर्शाता है। ‘घुड़सवार’ सामान्य, स्पष्ट और सैन्य-तकनीकी ‘अश्वारोही सेना’ से कम व्याख्यात्मक है।
- source_word: חֲמִשִּׁים אִישׁ
  choice: पचास आदमी
  rationale: इब्रानी में पुरुषवाचक אִישׁ है; इसलिए राजकीय जुलूस के पुरुष सेवकों को लिंग-तटस्थ रूप में नहीं बदला गया।
- source_word: רָצִים לְפָנָיו
  choice: अपने आगे दौड़नेवाले
  rationale: कृदंत उन व्यक्तियों की लगातार भूमिका बताता है—वे उसके आगे दौड़कर राजकीय जुलूस का हिस्सा बनते थे।
theological_decisions:
- issue: अदोनिय्याह के आचरण का चित्रण
  choice: ‘अपने आपको ऊँचा उठाने लगा’
  alternative: ‘अपने को राजा के रूप में स्थापित करने लगा’
  rationale: चुना हुआ रूप आत्म-उत्थान में निहित आलोचनात्मक भाव को बनाए रखता है, पर क्रिया में ‘राजा के रूप में’ जोड़कर अगले कथन को समय से पहले स्पष्ट नहीं करता।
- issue: राजसत्ता के दावे का स्वरूप
  choice: ‘मैं राज करूँगा’
  alternative: ‘मैं राजा बनूँगा’
  rationale: दोनों अर्थ सम्भव हैं। मुख्य पाठ क्रिया के रूप को अधिक निकटता से रखता है, जबकि पादटिप्पणी पद या स्थिति पर बल देने वाला स्वाभाविक विकल्प देती है।
- issue: राजकीय अनुचरों का लिंग
  choice: ‘पचास आदमी’
  alternative: ‘पचास लोग’ या केवल ‘पचास धावक’
  rationale: मूल पाठ का पुरुषवाचक शब्द सुरक्षित रखा गया है और उसे अनावश्यक रूप से लिंग-तटस्थ नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज किंतु गरिमापूर्ण कथात्मक शैली रखी गई है। आरम्भिक וַ के लिए अलग से ‘अब’ नहीं जोड़ा गया; घटनाक्रम का संबंध वाक्य-विन्यास और ‘फिर’ से स्पष्ट है। ‘दौड़नेवाले’ को संयुक्त रूप में लिखकर सामान्य आधुनिक वर्तनी अपनाई गई है।
