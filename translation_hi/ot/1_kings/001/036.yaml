source:
  edition: WLC
  text: וַ/יַּ֨עַן בְּנָיָ֧הוּ בֶן יְהֽוֹיָדָ֛ע אֶת הַ/מֶּ֖לֶךְ וַ/יֹּ֣אמֶר אָמֵ֑ן כֵּ֚ן יֹאמַ֣ר יְהוָ֔ה אֱלֹהֵ֖י אֲדֹנִ֥/י הַ/מֶּֽלֶךְ־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/036.yaml
  text: Benaiah son of Jehoiada answered the king and said[a], “Amen! May Yahweh, the God of my lord the king, say so.”
translation:
  language: hi
  text: यहोयादा के पुत्र बनायाह ने राजा को उत्तर दिया, “आमीन! याहवे, मेरे स्वामी राजा के परमेश्वर, ऐसा ही कहें।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַן
  choice: उत्तर दिया
  rationale: यहाँ ענה राजकीय संवाद में प्रत्युत्तर देने को सूचित करता है; ‘उत्तर दिया’ स्वाभाविक और सीधा हिन्दी रूप है।
- source_word: בְּנָיָהוּ בֶן יְהוֹיָדָע
  choice: यहोयादा के पुत्र बनायाह
  rationale: हिब्रू के पितृनाम-संबंध को स्वाभाविक हिन्दी क्रम में सुरक्षित रखा गया है।
- source_word: אֶת הַמֶּלֶךְ
  choice: राजा को
  rationale: हिब्रू कर्मचिह्न אֶת का हिन्दी में परसर्ग ‘को’ द्वारा स्वाभाविक निरूपण किया गया है।
- source_word: וַיֹּאמֶר
  choice: प्रत्यक्ष कथन में समाहित
  rationale: ‘उत्तर दिया’ के बाद अलग से ‘और कहा’ हिन्दी में अनावश्यक पुनरुक्ति होती; प्रत्यक्ष कथन आरम्भ करके आशय पूर्णतः सुरक्षित है।
- source_word: אָמֵן
  choice: आमीन!
  rationale: यह सहमति और अभिलाषा की जोरदार उद्घोषणा है; परिचित बाइबलीय रूप ‘आमीन’ इसके धार्मिक और भावात्मक बल को बनाए रखता है।
- source_word: כֵּן
  choice: ऐसा ही
  rationale: यह राजा द्वारा पहले कही गई बात की पुष्टि की ओर संकेत करता है; ‘ऐसा ही’ हिन्दी में स्पष्ट और संक्षिप्त है।
- source_word: יֹאמַר
  choice: कहें
  rationale: रूप व्याकरणतः अपूर्णकाल है, पर ‘आमीन’ के बाद प्रसंग में इच्छार्थक बल रखता है; आदरसूचक इच्छार्थक ‘कहें’ इसे व्यक्त करता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: चार-अक्षरीय ईश्वरीय नाम को हिन्दी बाइबल परंपरा में प्रचलित व्यक्तिगत नाम ‘यहोवा’ के रूप में दिया गया है, किसी उपाधि से प्रतिस्थापित नहीं किया गया।
- source_word: אֱלֹהֵי
  choice: परमेश्वर
  rationale: संबंधसूचक रचना ‘मेरे स्वामी राजा के परमेश्वर’ में construct संबंध स्वाभाविक हिन्दी द्वारा व्यक्त है।
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: मेरे स्वामी राजा
  rationale: दरबारी सम्मान, प्रथम पुरुष संबंध और राजकीय पद—तीनों को बिना अतिरिक्त व्याख्या के सुरक्षित रखा गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ में व्यक्तिगत ईश्वरीय नाम सीधे आया है। उसे ‘प्रभु’ जैसी उपाधि से बदलने के बजाय हिन्दी पाठकों में व्यापक रूप से पहचाने जाने वाले नामरूप ‘यहोवा’ से प्रस्तुत किया गया है।
- issue: יֹאמַר का भाव
  choice: इच्छार्थक ‘कहें’
  alternative: भविष्यसूचक ‘कहेंगे’
  rationale: ‘आमीन’ और प्रसंग इसे साधारण भविष्यवाणी नहीं, बल्कि राजा की इच्छा की परमेश्वर द्वारा पुष्टि की कामना बनाते हैं; इसलिए इच्छार्थकता बनाए रखी गई है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य हिन्दी पाठक के लिए सहज रखी गई है। ‘उत्तर दिया और कहा’ की हिब्रू पुनरुक्ति को स्वाभाविक हिन्दी में ‘उत्तर दिया’ के बाद सीधे कथन द्वारा व्यक्त किया गया है।
