base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/025.yaml
  text: For he has gone down today and sacrificed oxen[a], fattened calves, and sheep in abundance, and he has invited all the king’s sons, the commanders of the army, and Abiathar the priest. And look, they are eating and drinking before him, and they are saying[b], ‘Long live King Adonijah!’
translation:
  language: hi
  text: क्योंकि वह आज नीचे गया और उसने बहुतायत में बैलों, पुष्ट पशुओं और भेड़-बकरियों की बलि चढ़ाई। उसने राजा के सभी पुत्रों, सेना के अधिकारियों और एब्यातार याजक को बुलाया। और देखिए, वे उसके सामने खा-पी रहे हैं और कह रहे हैं, “राजा अदोनिय्याह चिरायु हों!”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: “राजा अदोनिय्याह चिरायु हों!” हिब्रू राजकीय जयघोष “राजा अदोनिय्याह जीवित रहें” का स्वाभाविक हिन्दी रूप है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले कथन का कारण या स्पष्टीकरण प्रस्तुत करता है; हिन्दी में ‘क्योंकि’ इस संबंध को स्वाभाविक रूप से व्यक्त करता है।
- source_word: יָרַד הַיּוֹם
  choice: आज नीचे गया
  rationale: יָרַד में निहित दिशात्मक अर्थ ‘नीचे जाना’ सुरक्षित रखा गया है।
- source_word: וַיִּזְבַּח
  choice: बलिदान किया है
  rationale: זבח यहाँ भोज से जुड़ी बलि के लिए है; ‘बलिदान किया’ केवल वध की अपेक्षा धार्मिक आशय को बेहतर बनाए रखता है।
- source_word: שׁוֹר
  choice: बैल
  rationale: सामूहिक एकवचन को हिन्दी में वर्गसूचक बहुवचन अर्थ के साथ ‘बैलों’ के रूप में व्यक्त किया गया है।
- source_word: מְרִיא
  choice: मोटे किए हुए पशु
  rationale: यह शब्द विशेष रूप से पाले-पोसे और मोटे किए गए पशुओं को दर्शाता है; केवल ‘बछड़े’ कहना आयु को अनावश्यक रूप से निश्चित कर देता।
- source_word: צֹאן
  choice: भेड़-बकरियाँ
  rationale: צֹאן छोटे पालतू पशुओं, विशेषतः भेड़ और बकरियों, का सामूहिक पद है; व्यापक अर्थ को बनाए रखने के लिए दोनों का उल्लेख किया गया है।
- source_word: לָרֹב
  choice: बहुत-से
  rationale: यह बलि किए गए पशुओं की बड़ी संख्या बताता है; आधुनिक हिन्दी में ‘बहुत-से’ सहज है।
- source_word: וַיִּקְרָא
  choice: बुलाया है
  rationale: קרא ל व्यक्तियों को बुलाने या आमंत्रित करने का भाव रखता है; ‘बुलाया’ दोनों संभावनाओं को स्वाभाविक रूप से समेटता है।
- source_word: שָׂרֵי הַצָּבָא
  choice: सेना के अधिकारी
  rationale: שָׂרֵי नेतृत्व या उच्च पद का संकेत देता है; बहुवचन के स्तर को अनावश्यक रूप से ‘सेनापति’ तक सीमित न करते हुए ‘अधिकारी’ चुना गया है।
- source_word: וְהִנָּם
  choice: देखिए
  rationale: यह वर्तमान दृश्य की ओर ध्यान खींचता है; ‘देखिए’ आधुनिक और सम्मानपूर्ण हिन्दी में वही संवादात्मक बल देता है।
- source_word: יְחִי הַמֶּלֶךְ אֲדֹנִיָּהוּ
  choice: राजा अदोनिय्याह चिरायु हों!
  rationale: हिब्रू राजकीय जयघोष का स्वाभाविक, संक्षिप्त और गरिमापूर्ण हिन्दी रूप।
