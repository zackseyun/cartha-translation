  terminology: ‘बलि चढ़ाई,’ ‘याजक,’ ‘एब्यातार,’ and ‘अदोनिय्याह’ are suitable. ‘भेड़-बकरियाँ’ appropriately retains the broad small-livestock sense of צֹאן. The royal acclamation ‘राजा अदोनिय्याह चिरायु हों!’ is an appropriately elevated idiomatic rendering.
