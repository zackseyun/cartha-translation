    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  choice: और देखो
  rationale: यह दृश्य में अचानक हुए नए घटनाक्रम की ओर ध्यान खींचने वाला कथात्मक संकेत है। ‘और देखो’ उसकी तात्कालिकता को बनाए रखता है।
- source_word: עוֹדֶנָּה מְדַבֶּרֶת
  choice: वह अभी…बात कर ही रही थी
  rationale: क्रियाविशेषण, स्त्रीलिंग प्रत्यय और कृदंत मिलकर बतलाते हैं कि स्त्री का बोलना उसी समय जारी था; ‘अभी…कर ही रही थी’ इस निरंतर और समकालिक क्रिया को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: עִם הַמֶּלֶךְ
  choice: राजा से
  rationale: यद्यपि עִם का मूल भाव ‘के साथ’ है, हिन्दी में किसी व्यक्ति से बातचीत के लिए ‘राजा से बात करना’ अधिक स्वाभाविक है और प्रत्यक्ष संवाद का भाव सुरक्षित रखता है।
- source_word: וְנָתָן הַנָּבִיא
  choice: नातान नबी
  rationale: व्यक्तिनाम נָתָן का प्रचलित हिन्दी लिप्यंतरण ‘नातान’ है; הַנָּבִיא को उसके पद की सीधी और परिचित संज्ञा ‘नबी’ से व्यक्त किया गया है।
- source_word: בָּא
  choice: भीतर आया
  rationale: क्रिया का अर्थ ‘आया/प्रवेश किया’ है। राजकीय भेंट के इस प्रसंग में ‘भीतर आया’ किसी कक्ष या राजा की उपस्थिति में प्रवेश को सहज रूप से व्यक्त करता है।
