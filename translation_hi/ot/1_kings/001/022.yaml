  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘नबी’ सामान्य हिन्दी बाइबलीय शब्दावली के अनुरूप है। ‘कि’ से दोनों समकालिक घटनाएँ स्वाभाविक ढंग से जुड़ती हैं और नातान के अचानक आने का प्रभाव बना रहता है।
