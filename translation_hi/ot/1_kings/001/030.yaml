reference: 1 Kings 1:30
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: כִּ֡י כַּ/אֲשֶׁר֩ נִשְׁבַּ֨עְתִּי לָ֜/ךְ בַּ/יהוָ֨ה אֱלֹהֵ֤י יִשְׂרָאֵל֙ לֵ/אמֹ֔ר כִּֽי שְׁלֹמֹ֤ה בְנֵ/ךְ֙ יִמְלֹ֣ךְ אַחֲרַ֔/י וְ/ה֛וּא יֵשֵׁ֥ב עַל כִּסְאִ֖/י תַּחְתָּ֑/י כִּ֛י כֵּ֥ן אֶעֱשֶׂ֖ה הַ/יּ֥וֹם הַ/זֶּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/030.yaml
  text: As I swore to you by Yahweh[a], the God of Israel, saying, ‘Surely Solomon your son will reign after me[b], and he will sit on my throne in my place,’ so I will do this today.
translation:
  language: hi
  text: जैसा मैंने इस्राएल के परमेश्वर यहोवा की शपथ खाकर तुमसे कहा था, ‘निश्चय ही तुम्हारा पुत्र सुलैमान मेरे बाद राजा होगा और मेरे स्थान पर मेरे सिंहासन पर बैठेगा,’ वैसा ही मैं आज करूँगा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי כַּאֲשֶׁר
  choice: जैसा
  rationale: यह आरंभिक तुलना आगे के ‘वैसा ही’ से पूरी होती है और शपथ तथा उसके पालन के संबंध को स्वाभाविक हिन्दी में व्यक्त करती है।
- source_word: נִשְׁבַּעְתִּי לָךְ בַּיהוָה
  choice: यहोवा की शपथ खाकर तुमसे कहा था
  rationale: हिब्रू में पूर्व में खाई गई शपथ है; हिन्दी में ‘शपथ खाकर ... कहा था’ शपथ की विषयवस्तु से सहज रूप से जुड़ता है।
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: इस्राएल के परमेश्वर
  rationale: सम्बन्धसूचक संरचना का सीधा और प्रचलित हिन्दी रूप।
- source_word: כִּי שְׁלֹמֹה בְנֵךְ יִמְלֹךְ אַחֲרַי
  choice: निश्चय ही तुम्हारा पुत्र सुलैमान मेरे बाद राजा होगा
  rationale: दूसरा כִּי शपथ की बात को दृढ़ता से प्रस्तुत करता है; יִמְלֹךְ का स्वाभाविक हिन्दी अर्थ ‘राजा होगा’ है और אַחֲרַי उत्तराधिकार का क्रम बताता है।
- source_word: וְהוּא יֵשֵׁב עַל כִּסְאִי תַּחְתָּי
  choice: और मेरे स्थान पर मेरे सिंहासन पर बैठेगा
  rationale: राजसिंहासन पर बैठना राज्यारोहण का बिंब है; תַּחְתָּי यहाँ दाऊद के स्थान पर उत्तराधिकारी होने का भाव देता है।
- source_word: כִּי כֵן אֶעֱשֶׂה הַיּוֹם הַזֶּה
  choice: वैसा ही मैं आज करूँगा
  rationale: यह आरंभिक ‘जैसा’ का उत्तर देता है और आज ही शपथ पूरी करने की तात्कालिकता बनाए रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का रूप
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ में विशिष्ट ईश्वरीय नाम है, न कि उपाधि ‘प्रभु’। हिन्दी के सामान्य पाठकों में पहचाने जाने वाले ‘यहोवा’ रूप से नाम को नाम के रूप में सुरक्षित रखा गया है।
- issue: תַּחְתָּי में उत्तराधिकार और प्रतिस्थापन का संबंध
  choice: मेरे स्थान पर
  alternative: मेरे बाद
  rationale: पहले ही ‘मेरे बाद’ से कालक्रम व्यक्त हो चुका है; यहाँ ‘मेरे स्थान पर’ राजकीय पद पर प्रतिस्थापन का अलग आयाम बनाए रखता है, बिना दाऊद के तत्काल अपदस्थ होने का दावा किए।
translation_notes:
  register: आधुनिक मानक हिन्दी; गरिमापूर्ण किंतु सहज कथात्मक शैली। प्रत्यक्ष कथन में शपथ की दृढ़ता और ‘जैसा...वैसा ही’ की संरचना सुरक्षित रखी गई है।
