base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/011.yaml
  text: Then Nathan said to Bathsheba[a], Solomon’s mother, “Have you not heard that Adonijah son of Haggith has become king, and our lord David does not know it?”
translation:
  language: hi
  text: तब नातान ने सुलैमान की माता बतशेबा से कहा, “क्या तुमने नहीं सुना कि हग्गीत का पुत्र अदोनिय्याह राजा बन गया है[a], और हमारे स्वामी दाऊद को इसका पता नहीं है?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “अपने आपको राजा बना लिया है।” हिब्रू में शाब्दिक अर्थ “राजा बन गया/राज्य करने लगा” है। प्रसंग में अपने आपको ऊँचा उठाने का भाव हो सकता है, पर यहाँ प्रयुक्त शब्द इसे स्पष्ट रूप से नहीं कहता।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: तब ... ने कहा
  rationale: वाव-क्रमिक कथा को आगे बढ़ाता है; ‘तब’ आधुनिक हिन्दी में घटनाक्रम को स्वाभाविक रूप से व्यक्त करता है।
- source_word: בַּת שֶׁבַע אֵם שְׁלֹמֹה
  choice: सुलैमान की माता बतशेबा
  rationale: सम्बन्धसूचक पदबंध को सहज हिन्दी क्रम में रखा गया है और पहचान स्पष्ट बनी रहती है।
- source_word: לֵאמֹר
  choice: प्रत्यक्ष रूप से अलग अनूदित नहीं
  rationale: हिब्रू का वाणी-परिचय सूत्र हिन्दी में ‘कहा’ और उद्धरण-चिह्नों से पर्याप्त रूप से व्यक्त हो जाता है।
- source_word: הֲלוֹא שָׁמַעַתְּ
  choice: क्या तुमने नहीं सुना
  rationale: यह पुष्टि की अपेक्षा रखने वाले आलंकारिक प्रश्न का सीधा और स्वाभाविक हिन्दी रूप है।
- source_word: מָלַךְ
  choice: राजा बन गया है
  rationale: क्रिया के राजा बनने अथवा राज्य करने के घटनात्मक अर्थ को व्यक्त करता है, पर यह अतिरिक्त दावा नहीं जोड़ता कि अदोनिय्याह ने स्वयं को राजा बनाया।
- source_word: אֲדֹנִיָּהוּ בֶן חַגִּית
  choice: हग्गीत का पुत्र अदोनिय्याह
  rationale: वंश-संबंध को हिन्दी के स्वाभाविक सम्बन्धसूचक क्रम में व्यक्त किया गया है।
- source_word: וַאֲדֹנֵינוּ דָוִד
  choice: और हमारे स्वामी दाऊद
  rationale: ‘स्वामी’ राजा के लिए प्रयुक्त मानवीय, दरबारी सम्मानसूचक पद को बनाए रखता है और इसे ईश्वरीय उपाधि से नहीं मिलाता।
- source_word: לֹא יָדָע
  choice: इसका पता नहीं है
  rationale: शाब्दिक ‘नहीं जानता’ की वर्तमान प्रासंगिकता को स्वाभाविक हिन्दी में व्यक्त करता है; ‘इसका’ पूर्ववर्ती समाचार की ओर संकेत करता है।
theological_decisions:
- issue: दाऊद के लिए אֲדֹנֵינוּ का अनुवाद
  choice: हमारे स्वामी दाऊद
  alternative: हमारे मालिक दाऊद
  rationale: यहाँ शब्द राजा के लिए मानवीय सम्मानसूचक पद है, कोई ईश्वरीय उपाधि नहीं। ‘स्वामी’ गरिमापूर्ण दरबारी भाव बनाए रखता है।
- issue: מָלַךְ में अदोनिय्याह की आत्म-पदोन्नति को स्पष्ट करना
  choice: राजा बन गया है
  alternative: अपने आपको राजा बना लिया है
  rationale: व्यापक प्रसंग आत्म-पदोन्नति का संकेत दे सकता है, पर इस पद की हिब्रू क्रिया स्वयं उस भाव को स्पष्ट रूप से नहीं कहती; इसलिए मुख्य पाठ में अस्पष्टता सुरक्षित रखी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण कथात्मक शैली अपनाई गई है। नामों के प्रचलित हिन्दी बाइबलीय रूप रखे गए हैं। फुटनोट-चिह्न को अंग्रेज़ी परामर्श पाठ में ‘बतशेबा’ के बाद दिए गए स्थान के बजाय उस वास्तविक शब्दसमूह के बाद रखा गया है जिससे फुटनोट सम्बद्ध है।
