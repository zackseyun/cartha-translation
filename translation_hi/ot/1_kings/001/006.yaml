source:
  edition: WLC
  text: וְ/לֹֽא עֲצָב֨/וֹ אָבִ֤י/ו מִ/יָּמָי/ו֙ לֵ/אמֹ֔ר מַדּ֖וּעַ כָּ֣כָה עָשִׂ֑יתָ וְ/גַם ה֤וּא טֽוֹב תֹּ֨אַר֙ מְאֹ֔ד וְ/אֹת֥/וֹ יָלְדָ֖ה אַחֲרֵ֥י אַבְשָׁלֽוֹם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/006.yaml
  text: His father had never displeased him at any time by saying[a], “Why have you done thus?” He was also very handsome[b], and his mother had borne him after Absalom.
translation:
  language: hi
  text: उसके पिता ने उसके जीवन में कभी भी उसे यह कहकर अप्रसन्न नहीं किया था[a], “तुमने ऐसा क्यों किया?” वह देखने में भी बहुत सुंदर था, और उसकी माँ ने उसे अबशालोम के बाद जन्म दिया था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इसका अनुवाद “उसे कभी दुःखी नहीं किया था” या “उसे कभी टोका नहीं था” भी हो सकता है। इब्रानी क्रिया किसी को पीड़ा या खिन्नता पहुँचाने का भाव दे सकती है; यहाँ प्रसंग दाऊद द्वारा अदोनिय्याह को न रोकने या उसका सामना न करने की ओर संकेत करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲצָבוֹ
  choice: उसे अप्रसन्न नहीं किया था
  rationale: क्रिया עצב किसी को दुःख, खेद या झुँझलाहट पहुँचाने का भाव दे सकती है। अगले प्रश्न के संदर्भ में यह दाऊद के अदोनिय्याह को रोकने या टोकने से बचने को दर्शाती है; ‘अप्रसन्न नहीं किया’ मूल की भावात्मक व्यापकता बनाए रखता है।
- source_word: מִיָּמָיו
  choice: उसके जीवन में कभी भी
  rationale: शाब्दिक अर्थ ‘उसके दिनों से’ है, पर यहाँ यह जीवन में किसी भी समय न होने का मुहावरा है।
- source_word: לֵאמֹר
  choice: यह कहकर
  rationale: यह उस सुधारात्मक बात की विषयवस्तु प्रस्तुत करता है जो पिता ने कभी नहीं कही।
- source_word: מַדּוּעַ כָּכָה עָשִׂיתָ
  choice: तुमने ऐसा क्यों किया?
  rationale: यह स्वाभाविक आधुनिक हिन्दी में सीधे पैतृक प्रश्न को व्यक्त करता है और ככה के ‘ऐसा’ भाव को बनाए रखता है।
- source_word: טוֹב תֹּאַר מְאֹד
  choice: देखने में भी बहुत सुंदर था
  rationale: यह पद शारीरिक रूप-सौंदर्य का वर्णन करता है; ‘देखने में बहुत सुंदर’ पुरुष के लिए स्पष्ट और स्वाभाविक हिन्दी है।
- source_word: וְאֹתוֹ יָלְדָה
  choice: उसकी माँ ने उसे ... जन्म दिया था
  rationale: हिब्रू क्रिया का स्त्रीलिंग कर्ता निहित है। हिन्दी में ‘उसकी माँ’ जोड़ना संदर्भगत अर्थ को स्पष्ट करता है, कोई नई सूचना नहीं जोड़ता।
- source_word: אַחֲרֵי אַבְשָׁלוֹם
  choice: अबशालोम के बाद
  rationale: यह सबसे स्वाभाविक रूप से जन्म-क्रम बताता है कि अदोनिय्याह का जन्म अबशालोम के बाद हुआ था।
theological_decisions:
- issue: दाऊद के व्यवहार को अनुशासन, दुःख पहुँचाने या अप्रसन्न करने के रूप में समझना
  choice: मुख्य पाठ में ‘अप्रसन्न नहीं किया’
  alternative: ‘दुःखी नहीं किया’ या ‘कभी टोका नहीं’
  rationale: मूल क्रिया में दुःख या खिन्नता पहुँचाने की व्यापकता है, जबकि प्रसंग में सामना करने और रोकने की कमी निहित है। मुख्य पाठ व्यापक अर्थ रखता है और पादटिप्पणी प्रसंगगत विकल्प बताती है।
translation_notes:
  register: आधुनिक मानक हिन्दी; भाषा सहज किंतु गरिमापूर्ण रखी गई है। ‘उसके जीवन में कभी भी’ इब्रानी मुहावरे को स्पष्ट करता है। अंग्रेज़ी परत में दूसरे पादटिप्पणी-चिह्न का स्थान असंगत था; सुंदरता के पद पर अलग पादटिप्पणी आवश्यक न होने के कारण केवल स्रोतगत रूप से सार्थक [a] रखा गया है।
