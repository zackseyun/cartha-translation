base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/045.yaml
  text: And Zadok the priest and Nathan the prophet have anointed him king at Gihon[a], and they have come up from there rejoicing, and the city is in an uproar. That is the sound that you heard.
translation:
  language: hi
  text: और सादोक याजक और नातान नबी ने गीहोन में उसे राजा के रूप में अभिषिक्त किया है, और वे वहाँ से आनंद मनाते हुए ऊपर आए हैं, और नगर में शोर मच गया है।[a] यही वह आवाज़ है जो तुमने सुनी थी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “नगर गूँज उठा” अथवा “नगर में हलचल मच गई”; इब्रानी क्रिया शोरभरी हलचल का भाव व्यक्त करती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּמְשְׁחוּ אֹתוֹ
  choice: उसका ... अभिषेक किया है
  rationale: राजकीय संदर्भ में משׁח पद पर नियुक्ति के लिए तेल से अभिषेक करने को दर्शाता है। हिन्दी पूर्ण पक्ष वर्तमान स्थिति से जुड़े हाल के कार्य को स्वाभाविक रूप से व्यक्त करता है।
- source_word: צָדוֹק הַכֹּהֵן
  choice: सादोक याजक
  rationale: व्यक्तिनाम का प्रचलित हिन्दी लिप्यंतरण और כֹּהֵן का मानक बाइबलीय पदनाम रखा गया है।
- source_word: וְנָתָן הַנָּבִיא
  choice: और नातान नबी
  rationale: व्यक्तिनाम का प्रचलित हिन्दी लिप्यंतरण किया गया है और נָבִיא का सहज, मानक अनुवाद 'नबी' रखा गया है।
- source_word: לְמֶלֶךְ
  choice: राजा के रूप में
  rationale: लְ उस पद को सूचित करता है जिसके लिए अभिषेक हुआ; 'राजा के रूप में' आधुनिक हिन्दी में अर्थ को स्पष्ट और स्वाभाविक रखता है।
- source_word: בְּגִחוֹן
  choice: गीहोन में
  rationale: स्थाननाम का लिप्यंतरण किया गया है; स्थल पर संपन्न कार्य के लिए 'में' स्वाभाविक है।
- source_word: וַיַּעֲלוּ מִשָּׁם
  choice: वे वहाँ से ... ऊपर आए हैं
  rationale: עלה की ऊपर की दिशा को सुरक्षित रखा गया है और कथावाचक के नगर-केंद्रित दृष्टिकोण के अनुसार 'आए' चुना गया है।
- source_word: שְׂמֵחִים
  choice: आनन्द मनाते हुए
  rationale: यह उनके ऊपर आने की उल्लासपूर्ण रीति बताता है; यह पदबंध वर्तमान हिन्दी में सजीव और सहज है।
- source_word: וַתֵּהֹם הַקִּרְיָה
  choice: नगर में शोर मच उठा है
  rationale: הום शोरभरी हलचल या गूँज को व्यक्त करता है। यह चयन अगले वाक्य के 'आवाज़' से संबंध बनाए रखता है, जबकि वैकल्पिक अर्थ पादटिप्पणी में सुरक्षित हैं।
- source_word: הוּא הַקּוֹל אֲשֶׁר שְׁמַעְתֶּם
  choice: यही वह आवाज़ है जो तुमने सुनी थी
  rationale: הוּא का निर्देशात्मक बल 'यही' से और קוֹל का व्यापक अर्थ 'आवाज़' से व्यक्त हुआ है; बहुवचन संबोधन के लिए आदर-निरपेक्ष 'तुमने' उपयुक्त है।
