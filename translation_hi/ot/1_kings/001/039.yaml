base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/039.yaml
  text: Then Zadok the priest took the horn of oil from the tent and anointed Solomon[a]. Then they blew the ram’s horn, and all the people said[b], “Long live King Solomon!”
translation:
  language: hi
  text: तब सादोक याजक ने तंबू में से तेल का सींग लिया और सुलैमान का अभिषेक किया। फिर उन्होंने मेंढ़े का सींग फूँका[a], और सब लोगों ने कहा, “राजा सुलैमान चिरंजीवी हों!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उन्होंने शोफार फूँका”; इब्रानी शोफार सींग से बना तुरही जैसा वाद्य था, प्रायः मेढ़े के सींग का।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: लिया
  rationale: לקח का सामान्य और स्वाभाविक हिन्दी समतुल्य; क्रमिक कथन को सरलता से आगे बढ़ाता है।
- source_word: צָדוֹק הַכֹּהֵן
  choice: सादोक याजक
  rationale: व्यक्तिनाम का प्रचलित हिन्दी लिप्यंतरण और उपाधि का सीधा अनुवाद।
- source_word: קֶרֶן הַשֶּׁמֶן
  choice: तेल का सींग
  rationale: कֶרֶן के ठोस, शाब्दिक चित्र को बनाए रखता है; यह तेल रखने के लिए प्रयुक्त सींग था, इसलिए ‘कुप्पी’ जैसे व्याख्यात्मक शब्द से बचा गया है।
- source_word: מִן הָאֹהֶל
  choice: तंबू में से
  rationale: אֹהֶל का सीधा अर्थ ‘तंबू’ है। मूल पाठ यहाँ तकनीकी रूप से ‘मिलापवाला तंबू’ नहीं कहता, इसलिए अनावश्यक विशिष्टता नहीं जोड़ी गई।
- source_word: וַיִּמְשַׁח
  choice: अभिषेक किया
  rationale: राजकीय और धार्मिक रीति में तेल लगाने के लिए משׁח का मानक, स्वाभाविक हिन्दी अनुवाद।
- source_word: וַיִּתְקְעוּ בַּשּׁוֹפָר
  choice: उन्होंने नरसिंगा फूँका
  rationale: שׁוֹפָר पशु के सींग से बना फूँक-वाद्य है; ‘नरसिंगा’ हिन्दी में इस ठोस वस्तु और ध्वनि-क्रिया को संक्षेप में व्यक्त करता है।
- source_word: כָּל הָעָם
  choice: सब लोगों
  rationale: सार्वजनिक और सामूहिक जयघोष को सीधे तथा सहज हिन्दी में व्यक्त करता है।
- source_word: יְחִי הַמֶּלֶךְ שְׁלֹמֹה
  choice: राजा सुलैमान चिरंजीवी हों!
  rationale: युस्सिव भाव वाले राजकीय जयघोष को गरिमापूर्ण और हिन्दी में परिचित सूत्र के रूप में व्यक्त करता है।
theological_decisions:
- issue: राजकीय अभिषेक के प्रसंग में הָאֹהֶל की विशिष्टता
  choice: तंबू
  alternative: मिलापवाला तंबू / पवित्र तंबू
  rationale: इब्रानी में निश्चित उपपद सहित सामान्य संज्ञा ‘तंबू’ है। प्रसंग किसी उपासना-स्थल की ओर संकेत कर सकता है, पर मुख्य पाठ में उससे अधिक विशिष्ट तकनीकी पद जोड़ना मूल की अभिव्यक्ति को अनावश्यक रूप से निश्चित कर देगा।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। कथात्मक क्रम के लिए ‘तब’ और ‘फिर’ का प्रयोग किया गया है। ‘तेल का सींग’ मूल के ठोस अनुष्ठानिक बिंब को सुरक्षित रखता है। अंग्रेज़ी परामर्श-पाठ में पादटिप्पणी-चिह्नों का स्थान विषयवस्तु से उलटा प्रतीत होता है; हिन्दी मसौदे में शोफार-संबंधी पादटिप्पणी उसी शब्द के बाद रखी गई है, जबकि ‘तंबू’ के लिए मुख्य पाठ पर्याप्त रूप से मूल की अस्पष्टता बनाए रखता है।
