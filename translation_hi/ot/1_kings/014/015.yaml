base_translation:
  language: en
  yaml_path: translation/ot/1_kings/014/015.yaml
  text: And Yahweh will strike Israel[a], as a reed sways in the water, and he will uproot Israel from this good land that he gave to their fathers, and scatter them beyond the River, because they made their Asherim[b], provoking Yahweh.
translation:
  language: hi
  text: याहवे इस्राएल को मारेगा; वह पानी में डोलते सरकंडे के समान हो जाएगा। वह इस्राएल को इस अच्छी भूमि में से उखाड़ देगा, जिसे उसने उनके पुरखाओं को दिया था, और उन्हें महानद[a] के पार तितर-बितर कर देगा, क्योंकि उन्होंने अपने अशेरीम[b] बनाए और याहवे को क्रोधित किया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात फ़रात नदी। इब्रानी में केवल “महानद” है।
    reason: cross_reference
  - marker: b
    text: इब्रानी में “उनके अशेरीम”; अर्थात अशेरा देवी से जुड़ी उपासना-वस्तुएँ, जिन्हें प्रायः लकड़ी के खंभे या प्रतिमाएँ समझा जाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִכָּה
  choice: मारेगा
  rationale: भविष्यवाणी के इस प्रसंग में क्रिया का भावी अर्थ है। “मारेगा” न्याय के प्रहार को स्पष्ट और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत वाचा-नाम को शीर्षक से बदलने के बजाय हिन्दी लिप्यंतरण में रखा गया है।
- source_word: כַּאֲשֶׁר יָנוּד הַקָּנֶה בַּמַּיִם
  choice: जैसे सरकंडा पानी में डोलता है
  rationale: यह अस्थिर गति का सजीव तुलनात्मक बिंब है; “डोलता है” आधुनिक हिन्दी में स्वाभाविक है और मूल की सक्रिय क्रिया को बनाए रखता है।
- source_word: וְנָתַשׁ
  choice: उखाड़ देगा
  rationale: क्रिया जड़ से खींच निकालने का बिंब रखती है और देश से हटाए जाने के न्याय के अनुकूल है।
- source_word: הָאֲדָמָה הַטּוֹבָה הַזֹּאת
  choice: इस अच्छी भूमि
  rationale: “भूमि” यहाँ पूर्वजों को दी गई वाचा की भूमि के लिए उपयुक्त है और विशेषण “अच्छी” को सीधे सुरक्षित रखता है।
- source_word: אֲשֶׁר נָתַן לַאֲבוֹתֵיהֶם
  choice: जिसे उसने उनके पुरखाओं को दिया था
  rationale: “पुरखाओं” आधुनिक हिन्दी में स्वाभाविक है और पिछली पीढ़ियों तथा वाचा की निरंतरता का अर्थ देता है।
- source_word: וְזֵרָם
  choice: उन्हें ... तितर-बितर कर देगा
  rationale: निर्वासन के प्रसंग में बिखेरने या छितराने का अर्थ स्पष्ट करता है, बिना अनावश्यक रूप से ओसाने का विशिष्ट कृषि-बिंब जोड़ने के।
- source_word: מֵעֵבֶר לַנָּהָר
  choice: महानद के पार
  rationale: मूल में निश्चित रूप से “नदी/महानद” है, जो इस प्रसंग में फ़रात को सूचित करता है। मुख्य पाठ स्रोत की अभिव्यक्ति रखता है और पाद-टिप्पणी संदर्भ स्पष्ट करती है।
- source_word: עָשׂוּ אֶת אֲשֵׁרֵיהֶם
  choice: अपने लिए अशेरा-चिह्न बनाए
  rationale: “चिह्न” अशेरा से जुड़ी उपासना-वस्तुओं को सुबोध ढंग से व्यक्त करता है, पर उन्हें निश्चित रूप से केवल खंभे या केवल प्रतिमाएँ मानकर मूल की अनिश्चितता को समाप्त नहीं करता।
- source_word: מַכְעִיסִים אֶת יְהוָה
  choice: इस प्रकार याहवे को क्रोधित किया
  rationale: 'हिफ़ील कृदंत का कारणात्मक अर्थ स्पष्ट करता है: उनकी मूर्तिपूजा ने याहवे को क्रोध दिलाया। “इस प्रकार” इसे पिछले कार्य के परिणाम से जोड़ता है।'
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: याहवे
  alternative: प्रभु / यहोवा
  rationale: मूल पाठ व्यक्तिगत वाचा-नाम का प्रयोग करता है; लिप्यंतरण उसे किसी उपाधि से प्रतिस्थापित नहीं करता।
- issue: הַנָּהָר का ऐतिहासिक संदर्भ
  choice: मुख्य पाठ में “महानद”, पाद-टिप्पणी में फ़रात की पहचान
  alternative: मुख्य पाठ में सीधे “फ़रात नदी”
  rationale: इस प्रसंग में संकेत फ़रात की ओर है, फिर भी मूल केवल निश्चित पद “नदी/महानद” कहता है; इसलिए मूल अभिव्यक्ति और पाठकीय स्पष्टता दोनों सुरक्षित रखी गई हैं।
- issue: אֲשֵׁרֵיהֶם की वस्तुगत पहचान
  choice: अशेरा-चिह्न
  alternative: अशेरा के खंभे / अशेरा-प्रतिमाएँ / अशेरीम
  rationale: ये अशेरा से संबद्ध उपासना-वस्तुएँ हैं, पर उनका सटीक भौतिक रूप हर प्रसंग में निश्चित नहीं है। व्यापक मुख्य-पाठ शब्द और अधिक विशिष्ट पाद-टिप्पणी वास्तविक अनिश्चितता को बनाए रखते हैं।
- issue: सरकंडे की उपमा का संबंध
  choice: मूल के क्रम के अनुसार याहवे के इस्राएल को मारने के साथ सीधी तुलना
  alternative: इस्राएल को प्रहार के परिणामस्वरूप सरकंडे की तरह डोलता हुआ स्पष्ट करना
  rationale: इब्रानी वाक्य उपमा को सीधे “मारेगा” के बाद रखता है। अनुवाद उसी तनावपूर्ण बिंब को रखता है और कारण-परिणाम की अतिरिक्त व्याख्या मुख्य पाठ में नहीं जोड़ता।
