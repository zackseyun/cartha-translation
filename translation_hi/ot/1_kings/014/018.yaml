id: 1KI.14.18
reference: 1 Kings 14:18
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יִּקְבְּר֥וּ אֹת֛/וֹ וַ/יִּסְפְּדוּ ל֖/וֹ כָּל יִשְׂרָאֵ֑ל כִּ/דְבַ֤ר יְהוָה֙ אֲשֶׁ֣ר דִּבֶּ֔ר בְּ/יַד עַבְדּ֖/וֹ אֲחִיָּ֥הוּ הַ/נָּבִֽיא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/014/018.yaml
  text: They buried him[a], and all Israel mourned for him, according to the word of Yahweh that he had spoken through his servant Ahijah the prophet.
translation:
  language: hi
  text: उन्होंने उसे दफना दिया, और सारे इस्राएल ने उसके लिए शोक मनाया—याहवे के उस वचन के अनुसार, जो उसने अपने सेवक अहिय्याह नबी के द्वारा[a] कहा था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “अपने सेवक अहिय्याह नबी के हाथ से”; यह इब्रानी मुहावरा “अपने सेवक अहिय्याह नबी के द्वारा” के अर्थ में है।
    reason: मूल इब्रानी मुहावरे के शाब्दिक रूप और प्रसंगगत अर्थ को दिखाना।
lexical_decisions:
- source_word: וַיִּקְבְּרוּ אֹתוֹ
  choice: उन्होंने उसे दफना दिया
  rationale: קבר का अर्थ मृतक को गाड़ना या दफनाना है। आधुनिक मानक हिन्दी में ‘दफना दिया’ स्वाभाविक और स्पष्ट है; आरम्भिक וַ का कथात्मक क्रम हिन्दी की वाक्य-रचना से व्यक्त होता है।
- source_word: וַיִּסְפְּדוּ לוֹ
  choice: उसके लिए शोक मनाया
  rationale: ספד मृत्यु के अवसर पर सार्वजनिक विलाप या शोक को दर्शाता है। ‘शोक मनाया’ अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है और अनिवार्य रूप से ऊँचे स्वर में रोने का भाव नहीं जोड़ता।
- source_word: כָּל יִשְׂרָאֵל
  choice: सारे इस्राएल
  rationale: यह लोगों या राष्ट्र के लिए सामूहिक अभिव्यक्ति है। ‘सारे इस्राएल’ मूल की व्यापकता और पारंपरिक नाम दोनों बनाए रखता है।
- source_word: כִּדְבַר יְהוָה
  choice: याहवे के उस वचन के अनुसार
  rationale: כְּ के साथ דָבָר पहले कहे गए वचन के अनुरूप घटना होने को व्यक्त करता है। ‘उस वचन’ आगामी संबंधवाचक उपवाक्य से स्वाभाविक रूप से जुड़ता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय दिव्य नाम को किसी उपाधि से बदलने के बजाय हिन्दी लिप्यंतरण में प्रस्तुत किया गया है।
- source_word: אֲשֶׁר דִּבֶּר
  choice: जो उसने ... कहा था
  rationale: संबंधवाचक उपवाक्य ‘वचन’ की ओर लौटता है। ‘कहा था’ यह स्पष्ट करता है कि भविष्यसूचक कथन दफन और शोक से पहले दिया गया था।
- source_word: בְּיַד עַבְדּוֹ
  choice: अपने सेवक ... के द्वारा
  rationale: शाब्दिक ‘अपने सेवक के हाथ से’ यहाँ माध्यम या अभिकरण का इब्रानी मुहावरा है। ‘के द्वारा’ आधुनिक हिन्दी में उसी अर्थ को स्पष्ट करता है।
- source_word: אֲחִיָּהוּ הַנָּבִיא
  choice: अहिय्याह नबी
  rationale: व्यक्तिनाम का हिन्दी लिप्यंतरण किया गया है और निश्चित पदवी הַנָּבִיא को स्वाभाविक हिन्दी में ‘नबी’ रखा गया है।
theological_decisions:
- issue: दिव्य नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: प्रभु / यहोवा
  rationale: मूल पाठ व्यक्तिगत दिव्य नाम का प्रयोग करता है। ‘याहवे’ उसे उपाधि से प्रतिस्थापित किए बिना सुरक्षित रखता है।
- issue: भविष्यसूचक मध्यस्थता का सूत्र בְּיַד עַבְדּוֹ
  choice: अपने सेवक ... के द्वारा
  alternative: अपने सेवक ... के हाथ से
  rationale: पाठ याहवे के वचन को अहिय्याह के माध्यम से कहा गया बताता है। ‘के द्वारा’ इस मध्यस्थता को स्पष्ट रखता है, पर प्रेरणा के स्वरूप के बारे में पाठ से अधिक कोई धर्मवैज्ञानिक दावा नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। कथात्मक प्रवाह के लिए पहले वाक्य में आरम्भिक ‘और’ नहीं जोड़ा गया, जबकि दोनों घटनाओं का क्रम और संबंध सुरक्षित है। दीर्घ विराम-चिह्न भविष्यवाणी की पूर्ति से जुड़े अंतिम पदांश को स्पष्ट रूप से जोड़ता है।
