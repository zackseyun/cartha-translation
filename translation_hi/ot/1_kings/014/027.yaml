  text: וַ/יַּ֨עַשׂ הַ/מֶּ֤לֶךְ רְחַבְעָם֙ תַּחְתָּ֔/ם מָגִנֵּ֖י נְחֹ֑שֶׁת וְ/הִפְקִ֗יד עַל יַד֙ שָׂרֵ֣י הָ/רָצִ֔ים הַ/שֹּׁ֣מְרִ֔ים פֶּ֖תַח בֵּ֥ית הַ/מֶּֽלֶךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/014/027.yaml
  text: So King Rehoboam made bronze shields in their place and committed them into the hand of the commanders of the runners[b][a], who guarded the entrance of the king’s house.
translation:
  language: hi
  text: तब राजा रहूबियाम ने उनकी जगह काँसे की ढालें बनाईं और उन्हें दौड़नेवालों[a] के सरदारों को सौंप दिया, जो राजमहल[b] के प्रवेश-द्वार पर पहरा देते थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक अर्थ-स्पष्ट अनुवाद: “अंगरक्षकों के सरदारों।” हिब्रू में शाब्दिक अर्थ “दौड़नेवालों के सरदार” है; संभवतः यह राजकीय अंगरक्षक या संदेशवाहक दल था।'
    reason: lexical_alternative
  - marker: b
    text: हिब्रू में शाब्दिक रूप से “राजा का घर,” अर्थात राजमहल।
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: बनवाईं
  rationale: 'राजा के विषय में प्रयुक्त होने पर हिन्दी में प्रेरणार्थक रूप स्वाभाविक है: उसने कारीगरों से ढालें बनवाईं। यह स्रोत के सामान्य अर्थ ‘बनाना’ को संदर्भानुकूल व्यक्त करता है।'
- source_word: תַּחְתָּם
  choice: उनकी जगह
  rationale: बहुवचन प्रत्यय पिछले पद में लूटी गई सोने की ढालों की ओर संकेत करता है; ‘उनकी जगह’ प्रतिस्थापन का भाव स्पष्ट रखता है।
- source_word: מָגִנֵּי נְחֹשֶׁת
  choice: काँसे की ढालें
  rationale: נְחֹשֶׁת ताँबा अथवा काँसा सूचित कर सकता है; प्राचीन हथियारों और धातुकर्म के इस संदर्भ में ‘काँसा’ उपयुक्त पारंपरिक अर्थ है।
- source_word: וְהִפְקִיד עַל יַד
  choice: उनके हाथ सौंप दिया
  rationale: यह किसी वस्तु को किसी की देखरेख या अधिकार में देने का मुहावरा है। हिन्दी वाक्यांश स्रोत की ‘हाथ’ वाली छवि रखते हुए स्वाभाविक है।
- source_word: שָׂרֵי הָרָצִים
  choice: दौड़नेवालों के सरदारों
  rationale: ‘दौड़नेवाले’ हिब्रू पद का सीधा अर्थ सुरक्षित रखता है; ये राजकीय अंगरक्षक अथवा संदेशवाहक दल रहे होंगे, पर मुख्य पाठ उस भूमिका को निश्चित नहीं करता।
- source_word: הַשֹּׁמְרִים
  choice: जो ... पहरा देते थे
  rationale: कृदंत उनकी नियमित अथवा निरंतर जिम्मेदारी बताता है; हिन्दी संबंधवाचक उपवाक्य इसे सहजता से व्यक्त करता है।
- source_word: פֶּתַח בֵּית הַמֶּלֶךְ
  choice: राजमहल के प्रवेश-द्वार
  rationale: शाब्दिक रूप ‘राजा का घर’ है, पर इस ऐतिहासिक संदर्भ में वह राजा के निवास अर्थात राजमहल को सूचित करता है; ‘प्रवेश-द्वार’ פֶּתַח का स्पष्ट और स्वाभाविक अनुवाद है।
