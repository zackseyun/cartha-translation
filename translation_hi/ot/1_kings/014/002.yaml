  text: וַ/יֹּ֨אמֶר יָרָבְעָ֜ם לְ/אִשְׁתּ֗/וֹ ק֤וּמִי נָא֙ וְ/הִשְׁתַּנִּ֔ית וְ/לֹ֣א יֵֽדְע֔וּ כִּי אתי אֵ֣שֶׁת יָרָבְעָ֑ם וְ/הָלַ֣כְתְּ שִׁלֹ֗ה הִנֵּה שָׁם֙ אֲחִיָּ֣ה הַ/נָּבִ֔יא הֽוּא דִבֶּ֥ר עָלַ֛/י לְ/מֶ֖לֶךְ עַל הָ/עָ֥ם הַ/זֶּֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/014/002.yaml
  text: Jeroboam said to his wife[a], “Please get up and disguise yourself, so that they will not know that you are the wife of Jeroboam, and go to Shiloh. Behold, Ahijah the prophet is there; he is the one who spoke concerning me[b], that I would be king over this people.”
translation:
  language: hi
  text: यारोबाम ने अपनी पत्नी से कहा, “कृपया उठो और अपना वेश बदल लो, ताकि वे न जानें[a] कि तुम यारोबाम की पत्नी हो। फिर शीलो जाओ। देखो, अहिय्याह नबी वहाँ है। उसी ने मेरे विषय में कहा था[b] कि मैं इस प्रजा का राजा बनूँगा।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अधिक शाब्दिक रूप से, “और वे नहीं जानेंगे”; इब्रानी में ‘वे’ किन लोगों को दर्शाता है, यह स्पष्ट नहीं किया गया है।
    reason: lexical_alternative
  - marker: b
    text: या, “उसी ने मेरे इस प्रजा का राजा बनने के बारे में कहा था।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר יָרָבְעָם לְאִשְׁתּוֹ
  choice: यारोबाम ने अपनी पत्नी से कहा
  rationale: सामान्य इब्रानी कथात्मक रूप और वैवाहिक संबंध को आधुनिक, स्वाभाविक हिन्दी में सीधे व्यक्त करता है।
- source_word: קוּמִי נָא
  choice: कृपया उठो
  rationale: आज्ञार्थक क्रिया और विनय-सूचक נָא दोनों सुरक्षित रहते हैं; भाषा आधुनिक है, पुरातन नहीं।
- source_word: וְהִשְׁתַּנִּית
  choice: अपना वेश बदल लो
  rationale: हित्पएल रूप यहाँ पहचान छिपाने के लिए अपना बाहरी रूप बदलने का भाव देता है; यह हिन्दी में स्वाभाविक और प्रसंगानुकूल है।
- source_word: וְלֹא יֵדְעוּ
  choice: ताकि वे न जानें
  rationale: पिछली आज्ञा के उद्देश्य को स्पष्ट करता है और इब्रानी के अनिश्चित बहुवचन कर्ता को ‘वे’ के रूप में अनिश्चित ही रहने देता है।
- source_word: וְהָלַכְתְּ שִׁלֹה
  choice: फिर शीलो जाओ
  rationale: आज्ञाओं के क्रम को सहज हिन्दी में व्यक्त करता है; स्त्रीलिंग संबोधन हिन्दी क्रिया-रूप में अलग चिह्नित करना आवश्यक नहीं।
- source_word: הִנֵּה שָׁם
  choice: देखो, ... वहाँ है
  rationale: הִנֵּה के ध्यान आकर्षित करने वाले भाव को आधुनिक हिन्दी में स्वाभाविक ढंग से रखता है।
- source_word: אֲחִיָּה הַנָּבִיא
  choice: अहिय्याह नबी
  rationale: व्यक्तिनाम का प्रचलित हिन्दी लिप्यंतरण और पदवी का स्पष्ट अनुवाद।
- source_word: הוּא דִבֶּר עָלַי
  choice: उसी ने मेरे विषय में कहा था
  rationale: स्वतंत्र सर्वनाम הוּא के बलाघात को ‘उसी ने’ से और עָלַי के ‘मेरे विषय में’ अर्थ को सुरक्षित रखता है।
- source_word: לְמֶלֶךְ עַל הָעָם הַזֶּה
  choice: कि मैं इस प्रजा का राजा बनूँगा
  rationale: לְמֶלֶךְ द्वारा सूचित राजपद/परिणाम को सहज हिन्दी में व्यक्त करता है और עַל का शासन-संबंध ‘इस प्रजा का राजा’ से स्पष्ट होता है।
theological_decisions:
- issue: עָלַי לְמֶלֶךְ का वाक्यगत संबंध
  choice: मेरे विषय में कहा था कि मैं इस प्रजा का राजा बनूँगा
  alternative: मुझसे कहा था कि मैं इस प्रजा का राजा बनूँगा / मुझे इस प्रजा पर राजा होने के विषय में कहा था
  rationale: עַל सामान्यतः यहाँ ‘मेरे विषय में’ समझा जा सकता है, पर לְמֶלֶךְ को उससे जोड़कर राजपद के विषय की अधिक संक्षिप्त रचना भी संभव है। मुख्य पाठ स्वाभाविक हिन्दी में प्रमुख अर्थ देता है और पादटिप्पणी वैकल्पिक संबंध को बनाए रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सम्मानपूर्ण किंतु सहज कथात्मक शैली। ‘कृपया उठो’, ‘अपना वेश बदल लो’ और ‘देखो’ जैसे प्रयोग सामान्य पाठकों के लिए स्पष्ट हैं। ‘प्रजा’ राजकीय संदर्भ को बनाए रखता है।
