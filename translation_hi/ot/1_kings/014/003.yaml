  text: וְ/לָקַ֣חַתְּ בְּ֠/יָדֵ/ךְ עֲשָׂרָ֨ה לֶ֧חֶם וְ/נִקֻּדִ֛ים וּ/בַקְבֻּ֥ק דְּבַ֖שׁ וּ/בָ֣את אֵלָ֑י/ו ה֚וּא יַגִּ֣יד לָ֔/ךְ מַה יִּֽהְיֶ֖ה לַ/נָּֽעַר־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/014/003.yaml
  text: And take in your hand ten loaves of bread, some cakes, and a jar of honey, and go to him. He will tell you what will happen to the boy.
translation:
  language: hi
  text: और अपने हाथ में दस रोटियाँ, कुछ टिकियाँ और शहद की एक कुप्पी लेकर उसके पास जाना। वह तुम्हें बताएगा कि लड़के का क्या होगा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עֲשָׂרָה לֶחֶם
  choice: दस रोटियाँ
  rationale: शाब्दिक रूप से ‘दस रोटी’; हिन्दी में संख्या के साथ स्वाभाविक बहुवचन ‘दस रोटियाँ’ है। לֶחֶם यहाँ गिनी जा सकने वाली रोटियों को दर्शाता है।
- source_word: נִקֻּדִים
  choice: कुछ टिकियाँ
  rationale: यह विरल शब्द संभवतः बिंदुदार या विशेष प्रकार की छोटी पकी हुई रोटियों/टिकियों के लिए है। ठीक संख्या मूल में नहीं दी गई, इसलिए सहज हिन्दी में अनिश्चित मात्रा के लिए ‘कुछ’ रखा गया।
- source_word: בַּקְבֻּק דְּבַשׁ
  choice: शहद की एक कुप्पी
  rationale: בַּקְבֻּק किसी छोटी बोतल या पात्र को दर्शाता है; ‘कुप्पी’ छोटे पात्र का संक्षिप्त और गरिमापूर्ण हिन्दी रूप है।
- source_word: הַנָּעַר
  choice: लड़के
  rationale: संदर्भ में यह यारोबाम के बीमार पुत्र को दर्शाता है; ‘लड़का’ आयु-संबंधी अस्पष्टता को काफी हद तक बनाए रखता है।
theological_decisions:
- issue: भविष्यवाणी के कथन की निश्चितता
  choice: वह तुम्हें बताएगा कि लड़के का क्या होगा
  alternative: वह तुम्हें बताएगा कि लड़के के साथ क्या होने वाला है
  rationale: מַה יִּהְיֶה לַנַּעַר का सीधा और स्वाभाविक अर्थ रखा गया है; नबी के ज्ञान के स्रोत या परिणाम को व्याख्यात्मक रूप से नहीं बढ़ाया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण कथन। स्त्रीलिंग आज्ञार्थक रूपों का हिन्दी में अलग चिह्न न होने पर भी संदर्भानुसार ‘लेकर…जाना’ स्वाभाविक है।
