base_translation:
  language: en
  yaml_path: translation/ot/1_kings/014/022.yaml
  text: And Judah did what was evil in the eyes of Yahweh[a], and they provoked him to jealousy more than all that their fathers had done, by the sins that they committed.
translation:
  language: hi
  text: यहूदा ने यहोवा की दृष्टि में बुरा किया। उन्होंने अपने किए हुए पापों के द्वारा उसे अपने पुरखाओं के किए हुए सब कामों से भी अधिक ईर्ष्या दिलाई[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उन्होंने उसकी ईर्ष्या भड़काई” अथवा “उसे ईर्ष्या करने के लिए उकसाया।” यहाँ इब्रानी में यहूदा की वाचा के प्रति बेवफाई के कारण यहोवा की प्रतिक्रिया के लिए वाचा-संबंधी ईर्ष्या की भाषा प्रयुक्त हुई है।
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוּדָה
  choice: यहूदा
  rationale: यह दक्षिणी राज्य और उसके लोगों का सामूहिक नाम है; इसी सामूहिक अर्थ के कारण आगे बहुवचन क्रिया स्वाभाविक है।
- source_word: הָרַע
  choice: बुरा किया
  rationale: עשה + הרע का स्वाभाविक हिन्दी रूप ‘बुरा किया’ है, जो नैतिक मूल्यांकन को स्पष्ट रखता है।
- source_word: בְּעֵינֵי יְהוָה
  choice: यहोवा की दृष्टि में
  rationale: यह इब्रानी मूल्यांकन-सूचक मुहावरे का स्वाभाविक और रूपक-संरक्षक हिन्दी रूप है।
- source_word: וַיְקַנְאוּ אֹתוֹ
  choice: उसे ईर्ष्या के लिए उकसाया
  rationale: यह वाचा-संबंधी बेवफाई पर यहोवा की ईर्ष्या भड़काने का भाव रखता है; ‘ईर्ष्या’ मूल धार्मिक भाषा को सुरक्षित रखती है।
- source_word: מִכֹּל אֲשֶׁר עָשׂוּ אֲבֹתָם
  choice: अपने पुरखाओं के सभी कामों से बढ़कर
  rationale: तुलनात्मक מִן और כֹּל दोनों को व्यक्त करता है; ‘पुरखाओं’ से पूर्वजों का अभिप्राय आधुनिक हिन्दी में स्पष्ट होता है।
- source_word: בְּחַטֹּאתָם אֲשֶׁר חָטָאוּ
  choice: अपने उन पापों से, जो उन्होंने किए
  rationale: संज्ञा और उसी मूल की क्रिया की इब्रानी पुनरुक्ति को यथासंभव बनाए रखते हुए साधनसूचक בְּ को ‘से’ द्वारा व्यक्त किया गया है।
theological_decisions:
- issue: परमेश्वर की ईर्ष्या की भाषा
  choice: उसे ईर्ष्या के लिए उकसाया
  alternative: उसकी ईर्ष्या भड़काई
  rationale: मूल पाठ यहूदा की वाचा-विरोधी बेवफाई के प्रति यहोवा की ईर्ष्या का वर्णन करता है। इसे केवल क्रोध या उत्साह बनाकर नरम नहीं किया गया, और पादटिप्पणी स्पष्ट करती है कि यहाँ पापमय डाह अभिप्रेत नहीं है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमामय, सामान्य पाठक के लिए स्पष्ट शैली। ‘यहोवा’ मूल नाम יהוה को प्रत्यक्ष रूप से दर्शाता है। सामूहिक ‘यहूदा’ के बाद बहुवचन ‘उन्होंने’ मूल पाठ के व्याकरणिक परिवर्तन को सुरक्षित रखता है।
