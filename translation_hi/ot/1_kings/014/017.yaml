  edition: WLC
  text: וַ/תָּ֨קָם֙ אֵ֣שֶׁת יָרָבְעָ֔ם וַ/תֵּ֖לֶךְ וַ/תָּבֹ֣א תִרְצָ֑תָ/ה הִ֛יא בָּאָ֥ה בְ/סַף הַ/בַּ֖יִת וְ/הַ/נַּ֥עַר מֵֽת־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/014/017.yaml
  text: Then Jeroboam’s wife arose and went and came to Tirzah. As she came to the threshold of the house[a], the boy died.
translation:
  language: hi
  text: तब यारोबाम की पत्नी उठी, चल दी और तिर्सा पहुँची। जब वह घर की दहलीज़ पर पहुँची[a], तब बालक मर गया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जब वह घर की दहलीज़ पर आ रही थी।”
    reason: הִיא בָּאָה की स्वतन्त्र सर्वनाम और कृदन्त वाली रचना को परिस्थितिजन्य, निरन्तर ‘आ रही थी’ के अर्थ में भी समझा जा सकता है।
lexical_decisions:
- source_word: וַתָּקָם
  choice: उठी
  rationale: קום का काल-वाचक कथात्मक रूप अगली क्रिया आरम्भ होने को दर्शाता है; ‘उठी’ इब्रानी कथाशैली को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: אֵשֶׁת יָרָבְעָם
  choice: यारोबाम की पत्नी
  rationale: सम्बन्धसूचक रचना वैवाहिक सम्बन्ध को सीधे व्यक्त करती है; यह आधुनिक हिन्दी का स्वाभाविक रूप है।
- source_word: וַתֵּלֶךְ
  choice: चल पड़ी
  rationale: הלך यहाँ यात्रा की अगली क्रिया बताता है। ‘चल पड़ी’ प्रस्थान का भाव स्वाभाविक रूप से देता है, बिना यात्रा के साधन या ढंग को जोड़ने के।
- source_word: וַתָּבֹא תִרְצָתָה
  choice: तिर्सा पहुँची
  rationale: בוא और दिशासूचक ה गन्तव्य की ओर जाकर वहाँ पहुँचने को दर्शाते हैं; ‘पहुँची’ हिन्दी में संक्षिप्त और स्वाभाविक है।
- source_word: הִיא בָּאָה
  choice: जैसे ही वह ... पहुँची
  rationale: स्वतन्त्र सर्वनाम और कृदन्त निर्णायक घटना के समय की परिस्थितिजन्य पृष्ठभूमि देते हैं। सन्दर्भ में भविष्यवाणी की तत्काल पूर्ति के कारण ‘जैसे ही’ उपयुक्त है, यद्यपि ‘जब’ भी सम्भव है।
- source_word: בְסַף הַבַּיִת
  choice: घर की दहलीज़ पर
  rationale: סַף का सटीक अर्थ दहलीज़ या चौखट का निचला भाग है। בְ को यहाँ उस स्थान पर पहुँचने के रूप में स्वाभाविक हिन्दी में व्यक्त किया गया है।
- source_word: וְהַנַּעַר
  choice: बालक
  rationale: נַעַר की अर्थ-सीमा बालक, लड़का या युवक तक हो सकती है; इस प्रसंग में यह यारोबाम के पुत्र के लिए है, इसलिए ‘बालक’ गरिमापूर्ण और सन्दर्भानुकूल है।
- source_word: מֵת
  choice: मर गया
  rationale: מות का पूर्ण रूप यहाँ उसी क्षण घटित मृत्यु को बताता है और पिछले पद की भविष्यवाणी पूरी करता है; ‘मर गया’ घटना का बल स्पष्ट रखता है।
