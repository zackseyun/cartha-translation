  text: There were also cult prostitutes in the land[a]. They did according to all the abominations of the nations that Yahweh had driven out before the sons of Israel.
translation:
  language: hi
  text: देश में पंथीय यौन-आचरण से जुड़े पुरुष भी थे[a]। उन्होंने उन जातियों की सारी घृणित प्रथाओं के अनुसार आचरण किया, जिन्हें याहवे ने इस्राएलियों के सामने से निकाल दिया था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “पुरुष पंथ-वेश्याकर्मी” या “मंदिर से जुड़ा पुरुष वेश्याकर्मी।” इब्रानी शब्द קָדֵשׁ निषिद्ध पंथीय यौन आचरण से जुड़े व्यक्ति के लिए प्रयुक्त होता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם קָדֵשׁ הָיָה בָאָרֶץ
  choice: देश में पुरुष देवदासी भी थे
  rationale: एकवचन קָדֵשׁ यहाँ अस्तित्वसूचक वाक्य में एक वर्ग को सामूहिक रूप से दर्शाता है। ‘पुरुष देवदासी’ उसके पुल्लिंग और निषिद्ध उपासना से जुड़े यौन आशय को संक्षेप में व्यक्त करता है; बहुवचन स्वाभाविक हिन्दी के लिए है।
- source_word: עָשׂוּ כְּכֹל הַתּוֹעֲבֹת
  choice: उन्होंने ... सब घिनौने कामों के अनुसार किया
  rationale: עָשׂוּ के सामान्य अर्थ को बनाए रखते हुए כְּכֹל का अनुरूपता-बोध और תּוֹעֲבוֹת का प्रबल नैतिक-धार्मिक मूल्यांकन सुरक्षित रखा गया है।
- source_word: הַגּוֹיִם
  choice: उन जातियों
  rationale: यहाँ कनान की गैर-इस्राएली जातियाँ अभिप्रेत हैं; ‘जातियाँ’ ऐतिहासिक संदर्भ में सहज है।
- source_word: אֲשֶׁר הוֹרִישׁ יְהוָה
  choice: जिन्हें यहोवा ने ... निकाल दिया था
  rationale: हिफ़ील הוֹרִישׁ पूर्व में किए गए निष्कासन को व्यक्त करता है; ‘निकाल दिया था’ सरल और स्वाभाविक हिन्दी है।
- source_word: מִפְּנֵי בְּנֵי יִשְׂרָאֵל
  choice: इस्राएलियों के सामने से
  rationale: מִפְּנֵי की स्थानिक विजय-सूत्र की भावना को रखा गया है। בְּנֵי יִשְׂרָאֵל एक जातिनाम है, इसलिए ‘इस्राएली’ हिन्दी में अर्थ को स्पष्ट और स्वाभाविक रूप से देता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिन्दी बाइबलीय प्रयोग में व्यापक रूप से पहचाना जाने वाला रूप, जो परमेश्वर के व्यक्तिगत वाचा-नाम को सामान्य उपाधि से अलग रखता है।
theological_decisions:
- issue: קָדֵשׁ की पहचान और लिंग
  choice: पुरुष देवदासी
  alternative: देवालय से जुड़े पुरुष वेश्यागामी सेवक / मंदिर के वेश्याकर्मी
  rationale: हिब्रू संज्ञा पुल्लिंग है और निषिद्ध पंथीय यौन आचरण से जुड़े व्यक्ति को सूचित करती है। अनिश्चित ऐतिहासिक विवरणों को बढ़ाए बिना लिंग और उपासना-संबंध दोनों प्रकट किए गए हैं; पारंपरिक किन्तु भ्रामक ‘सदोमी’ से बचा गया है।
- issue: בְּנֵי יִשְׂרָאֵל का रूप
  choice: इस्राएली
  alternative: इस्राएल के पुत्र
  rationale: यह स्थिर जातिवाचक अभिव्यक्ति है। ‘इस्राएली’ साधारण आधुनिक हिन्दी में पूरे समुदाय का स्पष्ट संकेत देता है और यहाँ कृत्रिम शाब्दिकता से बचाता है।
- issue: ईश्वरीय नाम יְהוָה
  choice: यहोवा
  alternative: याहवे
  rationale: व्यक्तिगत वाचा-नाम को नाम के रूप में ही रखा गया है; हिन्दी के परिचित रूप ‘यहोवा’ का उपयोग किया गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘पुरुष देवदासी’ कुछ असामान्य होते हुए भी मूल के पुल्लिंग और पंथीय संबंध को स्पष्ट करता है; पादटिप्पणी lexical ambiguity समझाती है।
