base_translation:
  language: en
  yaml_path: translation/ot/1_kings/014/004.yaml
  text: Jeroboam’s wife did so. She arose and went to Shiloh[a], and came to Ahijah’s house. Now Ahijah could not see, because his eyes were dim because of his old age.
translation:
  language: hi
  text: यारोबाम की पत्नी ने वैसा ही किया। वह उठकर शीलो गई और अहिय्याह के घर पहुँची। अहिय्याह देख नहीं सकता था, क्योंकि बुढ़ापे के कारण उसकी आँखें धुँधली हो गई थीं।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से, “उसकी आँखें खड़ी हो गई थीं”; यह बुढ़ापे के कारण दृष्टि क्षीण हो जाने का मुहावरा है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּעַשׂ כֵּן
  choice: वैसा ही किया
  rationale: यह इब्रानी कथात्मक अभिव्यक्ति बताती है कि उसने पहले दिए गए निर्देश के अनुसार काम किया; हिंदी में यह सहज और स्पष्ट है।
- source_word: וַתָּקָם וַתֵּלֶךְ שִׁלֹה
  choice: वह उठकर शीलो गई
  rationale: क्रमिक इब्रानी क्रियाओं को स्वाभाविक हिंदी में संयुक्त क्रिया के रूप में रखा गया है, जबकि उठने और जाने—दोनों भाव सुरक्षित हैं।
- source_word: וַתָּבֹא בֵּית אֲחִיָּה
  choice: अहिय्याह के घर पहुँची
  rationale: यह पद घर को गंतव्य के रूप में प्रस्तुत करता है; ‘पहुँची’ आगमन को व्यक्त करता है, बिना यह अनावश्यक रूप से तय किए कि वह भीतर दाखिल हुई थी।
- source_word: לֹא יָכֹל לִרְאוֹת
  choice: देख नहीं सकता था
  rationale: सामर्थ्य के अभाव और देखने की क्रिया का सीधा, स्वाभाविक हिंदी रूप।
- source_word: קָמוּ עֵינָיו
  choice: उसकी आँखें धुँधला गई थीं
  rationale: शाब्दिक रूप ‘उसकी आँखें खड़ी/स्थिर हो गई थीं’ है, पर संदर्भ में यह वृद्धावस्था के कारण दृष्टि-क्षीणता का मुहावरा है। मुख्य पाठ में अर्थ स्पष्ट किया गया है और शाब्दिक चित्र पादटिप्पणी में सुरक्षित है।
- source_word: מִשֵּׂיבוֹ
  choice: बुढ़ापे के कारण
  rationale: מִן यहाँ कारण या स्रोत दर्शाता है; यह हिंदी में उसका स्पष्ट और स्वाभाविक रूप है।
