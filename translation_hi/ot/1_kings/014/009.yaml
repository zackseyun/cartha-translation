source:
  edition: WLC
  text: וַ/תָּ֣רַע לַ/עֲשׂ֔וֹת מִ/כֹּ֖ל אֲשֶׁר הָי֣וּ לְ/פָנֶ֑י/ךָ וַ/תֵּ֡לֶךְ וַ/תַּעֲשֶׂה לְּ/ךָ֩ אֱלֹהִ֨ים אֲחֵרִ֤ים וּ/מַסֵּכוֹת֙ לְ/הַכְעִיסֵ֔/נִי וְ/אֹתִ֥/י הִשְׁלַ֖כְתָּ אַחֲרֵ֥י גַוֶּֽ/ךָ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/014/009.yaml
  text: and have done evil above all who were before you. You went and made for yourself other gods and molten images to provoke me to anger[a], and you have cast me behind your back.
translation:
  language: hi
  text: और तुमने उन सबसे बढ़कर बुराई की जो तुमसे पहले थे। तुमने जाकर अपने लिए दूसरे देवता और ढली हुई मूर्तियाँ बनाईं, मुझे क्रोध दिलाने के लिए[a]; और तुमने मुझे अपनी पीठ के पीछे फेंक दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मुझे क्रोधित करने के लिए।”
    reason: कारणवाचक इब्रानी क्रिया को हिन्दी में दो स्वाभाविक ढंगों से व्यक्त किया जा सकता है।
lexical_decisions:
- source_word: וַתָּרַע לַעֲשׂוֹת מִכֹּל
  choice: उन सबसे बढ़कर बुराई की
  rationale: यह रעה + לעשות के ‘बुराई करना’ अर्थ और מִכֹּל की स्पष्ट तुलना, दोनों को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: אֲשֶׁר הָיוּ לְפָנֶיךָ
  choice: जो तुमसे पहले थे
  rationale: לְפָנֶיךָ यहाँ स्थान नहीं, कालगत पूर्वता बताता है।
- source_word: וַתֵּלֶךְ וַתַּעֲשֶׂה לְּךָ
  choice: तुमने जाकर अपने लिए ... बनाईं
  rationale: क्रमसूचक וַתֵּלֶךְ और हितार्थक/आत्मवाचक לְּךָ, दोनों को सुरक्षित रखा गया है।
- source_word: אֱלֹהִים אֲחֵרִים
  choice: दूसरे देवता
  rationale: यह वाचा-संबंधी निषिद्ध देवताओं का सीधा उल्लेख है; ‘पराए’ कहने से अनावश्यक विदेशीपन जुड़ सकता है।
- source_word: וּמַסֵּכוֹת
  choice: ढली हुई मूर्तियाँ
  rationale: מַסֵּכָה ढलाई से बनाई गई प्रतिमा को दर्शाता है। हिन्दी में यह निर्माण-विधि और उपासना-वस्तु दोनों स्पष्ट करता है।
- source_word: לְהַכְעִיסֵנִי
  choice: ताकि मुझे क्रोध दिलाओ
  rationale: כעס के हिफ़ील रूप की कारणवाचक शक्ति और प्रथम पुरुष कर्म, दोनों व्यक्त होते हैं।
- source_word: וְאֹתִי הִשְׁלַכְתָּ אַחֲרֵי גַוֶּךָ
  choice: तुमने मुझे अपनी पीठ के पीछे फेंक दिया
  rationale: परमेश्वर को तिरस्कारपूर्वक ठुकराने वाला सजीव इब्रानी रूपक अमूर्त किए बिना सुरक्षित रखा गया है।
theological_decisions:
- issue: मूर्तिपूजा की वाचा-संबंधी गंभीरता
  choice: दूसरे देवता और ढली हुई मूर्तियाँ
  alternative: पराए देवता और मूर्तियाँ
  rationale: अनुवाद धार्मिक अपराध की श्रेणी और उसकी ठोस उपासना-वस्तुओं, दोनों को अलग-अलग बनाए रखता है।
- issue: परमेश्वर को ठुकराने के रूपक की तीव्रता
  choice: मुझे अपनी पीठ के पीछे फेंक दिया
  alternative: मेरी उपेक्षा की
  rationale: मूल पाठ का शारीरिक और तीखा रूपक बनाए रखा गया है; उसे केवल अमूर्त अर्थ में नहीं बदला गया।
translation_notes:
  register: आधुनिक मानक हिन्दी; सम्मानपूर्ण किंतु सीधा भविष्यद्वक्तीय अभियोग। ‘ढली हुई मूर्तियाँ’ तकनीकी अर्थ को सामान्य पाठक के लिए स्पष्ट रखता है, और ‘पीठ के पीछे फेंक दिया’ मूल रूपक की कठोरता बचाता है।
