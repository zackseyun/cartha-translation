source:
  edition: WLC
  text: לְכִ֞י אִמְרִ֣י לְ/יָרָבְעָ֗ם כֹּֽה אָמַ֤ר יְהוָה֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל יַ֛עַן אֲשֶׁ֥ר הֲרִימֹתִ֖י/ךָ מִ/תּ֣וֹךְ הָ/עָ֑ם וָ/אֶתֶּנְ/ךָ֣ נָגִ֔יד עַ֖ל עַמִּ֥/י יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/014/007.yaml
  text: 'Go and say to Jeroboam[a], ‘Thus says Yahweh[b], the God of Israel: Because I raised you up from among the people and made you ruler over my people Israel,’'
translation:
  language: hi
  text: 'जाकर यारोबाम से कहो, ‘इस्राएल का परमेश्वर याहवे यह कहता है: “चूँकि मैंने तुम्हें लोगों के बीच से ऊँचा उठाया[a] और तुम्हें अपनी प्रजा इस्राएल का शासक बनाया[b],'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “तुम्हें ऊँचा पद दिया।”
    reason: lexical_alternative
  - marker: b
    text: या “तुम्हें अपनी प्रजा इस्राएल पर अगुआ नियुक्त किया।” इब्रानी में शाब्दिक अर्थ है, “तुम्हें शासक के रूप में दिया।”
    reason: lexical_alternative
lexical_decisions:
- source_word: לְכִי אִמְרִי
  choice: जाकर ... कहो
  rationale: दोनों स्त्रीलिंग एकवचन आज्ञार्थक रूप संदेशवाहक को जाने और संदेश सुनाने का निर्देश देते हैं; आधुनिक हिंदी में ‘जाकर ... कहो’ स्वाभाविक और स्पष्ट है।
- source_word: לְיָרָבְעָם
  choice: यारोबाम से
  rationale: लामेद यहाँ संबोधित व्यक्ति को चिह्नित करता है; हिंदी में ‘से कहो’ स्वाभाविक प्रयोग है।
- source_word: כֹּה אָמַר
  choice: यह कहता है
  rationale: मानक भविष्यद्वक्ताई संदेश-सूत्र का स्वाभाविक आधुनिक हिंदी रूप, जो वक्ता और उसके संदेश को स्पष्ट रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: चार अक्षरों वाले व्यक्तिगत दिव्य नाम का लिप्यंतरण किया गया है, किसी उपाधि से प्रतिस्थापित नहीं।
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: इस्राएल का परमेश्वर
  rationale: सम्बन्धसूचक इब्रानी पदबंध का सीधा और स्वाभाविक हिंदी रूप।
- source_word: יַעַן אֲשֶׁר
  choice: चूँकि
  rationale: आगे आने वाले न्याय-वचन के आधार को बताने वाली कारणसूचक शक्ति बनाए रखता है।
- source_word: הֲרִימֹתִיךָ
  choice: मैंने तुम्हें ... ऊँचा उठाया
  rationale: रום के हिफ़ील रूप में शाब्दिक उठाने की छवि और पद-प्रतिष्ठा में उन्नत करने का अर्थ दोनों सुरक्षित रहते हैं।
- source_word: מִתּוֹךְ הָעָם
  choice: लोगों के बीच से
  rationale: जनसमुदाय के भीतर से चुनकर ऊपर उठाए जाने का भाव स्पष्ट और सहज हिंदी में व्यक्त होता है।
- source_word: וָאֶתֶּנְךָ נָגִיד
  choice: तुम्हें ... शासक बनाया
  rationale: शाब्दिक रूप ‘तुम्हें शासक के रूप में दिया’ है; हिंदी में नियुक्ति और अधिकार का आशय ‘शासक बनाया’ से स्वाभाविक ढंग से व्यक्त होता है।
- source_word: עַל עַמִּי יִשְׂרָאֵל
  choice: अपनी प्रजा इस्राएल का
  rationale: ईश्वर का स्वामित्व-संबंध ‘अपनी प्रजा’ में और शासन का विषय ‘इस्राएल’ में सुरक्षित है।
theological_decisions:
- issue: दिव्य नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा अथवा प्रभु
  rationale: मूल पाठ व्यक्तिगत वाचा-नाम का सीधे प्रयोग करता है; ‘याहवे’ उसका लिप्यंतरण करके नाम और उपाधि के भेद को बनाए रखता है।
- issue: נָגִיד का राजनैतिक अर्थ
  choice: शासक
  alternative: अगुआ अथवा प्रधान
  rationale: यहाँ शब्द ईश्वर द्वारा दिए गए आधिकारिक शासन-पद को दर्शाता है; ‘शासक’ अधिकार को स्पष्ट करता है और अनावश्यक वंशगत राजकुमार का भाव नहीं जोड़ता।
- issue: הֲרִימֹתִיךָ में उन्नयन की छवि
  choice: ऊँचा उठाया
  alternative: पद पर प्रतिष्ठित किया
  rationale: मुख्य पाठ में मूल रूपक और सामाजिक-राजनैतिक उन्नयन दोनों बने रहते हैं; वैकल्पिक अर्थ पादटिप्पणी में दिया गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘तुम्हें’ वर्तमान मानक हिंदी में स्पष्ट है और अत्यधिक पुरातन ‘तुझे’ से बचता है। पद का वाक्य अगले पद में जारी रहने के कारण अंत में अल्पविराम रखा गया है; उद्धरण भी जानबूझकर यहाँ पूर्ण नहीं किया गया।
