  text: The rest of the acts of Rehoboam[a], and all that he did, are they not written in the Book of the Chronicles of the Kings of Judah?
translation:
  language: hi
  text: रहूबियाम के बाकी काम और वह सब जो उसने किया, क्या वे ‘यहूदा के राजाओं के इतिहास-वृत्तांत की पुस्तक’[a] में लिखे हुए हैं?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘यहूदा के राजाओं के वार्षिक अभिलेख की पुस्तक।’ यहाँ अनूदित हिब्रू पदबंध राजकीय घटनाओं के लिखित अभिलेख को दर्शाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי רְחַבְעָם
  choice: रहूबियाम के बाकी काम
  rationale: יֶתֶר का अर्थ ‘बाकी/शेष’ है, और राजकीय अभिलेख के इस सूत्र में דִּבְרֵי केवल कथनों को नहीं, बल्कि राजा के कामों और मामलों को दर्शाता है।
- source_word: וְכָל אֲשֶׁר עָשָׂה
  choice: और उसने जो कुछ किया
  rationale: यह עשה के व्यापक अर्थ को बिना नैतिक मूल्यांकन या उपलब्धि का भाव जोड़े स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: הֲלֹא הֵמָּה כְתוּבִים
  choice: क्या वह सब … में नहीं लिखा है?
  rationale: हिब्रू का नकारात्मक आलंकारिक प्रश्न सुरक्षित रखा गया है; ‘वह सब’ पहले आए दोनों विषयों को स्वाभाविक हिंदी में समेटता है।
- source_word: עַל סֵפֶר
  choice: पुस्तक में
  rationale: शाब्दिक रूप से ‘पुस्तक/पुस्तिका पर’ है, पर किसी दस्तावेज़ में दर्ज होने के लिए हिंदी में ‘पुस्तक में’ स्वाभाविक है।
- source_word: סֵפֶר דִּבְרֵי הַיָּמִים לְמַלְכֵי יְהוּדָה
  choice: ‘यहूदा के राजाओं के इतिहास-वृत्तांत की पुस्तक’
  rationale: דִּבְרֵי הַיָּמִים यहाँ घटनाओं के राजकीय कालक्रमिक अभिलेख को सूचित करता है। ‘इतिहास-वृत्तांत’ इसे बाइबिल की ‘इतिहास’ नामक पुस्तक के साथ अनावश्यक रूप से एक न मानते हुए स्पष्ट करता है।
