  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וָ/אֶקְרַ֤ע אֶת הַ/מַּמְלָכָה֙ מִ/בֵּ֣ית דָּוִ֔ד וָ/אֶתְּנֶ֖/הָ לָ֑/ךְ וְ/לֹֽא הָיִ֜יתָ כְּ/עַבְדִּ֣/י דָוִ֗ד אֲשֶׁר֩ שָׁמַ֨ר מִצְוֺתַ֜/י וַ/אֲשֶׁר הָלַ֤ךְ אַחֲרַ/י֙ בְּ/כָל לְבָב֔/וֹ לַ/עֲשׂ֕וֹת רַ֖ק הַ/יָּשָׁ֥ר בְּ/עֵינָֽ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/014/008.yaml
  text: and I tore the kingdom away from the house of David and gave it to you[a]. But you have not been like my servant David, who kept my commandments and who walked after me with all his heart[b], to do only what was right in my eyes.
translation:
  language: hi
  text: और मैंने राज्य को दाऊद के घराने से छीन लिया और तुझे दे दिया। पर तू मेरे सेवक दाऊद के समान नहीं रहा, जिसने मेरी आज्ञाओं का पालन किया और जो अपने सारे हृदय से मेरे पीछे चला, केवल वही करने के लिए जो मेरी दृष्टि में सही था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וָאֶקְרַע
  choice: छीन लिया
  rationale: क्रिया का मूल बिंब ‘फाड़ना’ है, पर राज्य को किसी राजवंश से अलग करने के प्रसंग में ‘छीन लिया’ बलपूर्वक अलग किए जाने का अर्थ स्वाभाविक हिन्दी में स्पष्ट करता है।
- source_word: הַמַּמְלָכָה
  choice: राज्य
  rationale: यहाँ शब्द राजनीतिक राज्य अथवा राजसत्ता को सूचित करता है; ‘राज्य’ सहज और पर्याप्त रूप से सटीक है।
- source_word: מִבֵּית דָּוִד
  choice: दाऊद के घराने से
  rationale: ‘घराना’ इब्रानी ‘घर’ के राजवंशीय अर्थ को हिन्दी में स्वाभाविक रूप से व्यक्त करता है।
- source_word: וָאֶתְּנֶהָ לָךְ
  choice: तुझे दे दिया
  rationale: भूतकालीन कथात्मक क्रम और एकवचन अनौपचारिक संबोधन को बनाए रखता है; निहित कर्म ‘राज्य’ है।
- source_word: וְלֹא הָיִיתָ כְּעַבְדִּי דָוִד
  choice: पर तू मेरे सेवक दाऊद के समान नहीं रहा
  rationale: पूर्ण क्रिया वर्तमान आरोप तक बनी स्थिति व्यक्त करती है; ‘सेवक’ यहाँ परमेश्वर की सेवा का सम्मानसूचक वाचा-संबंधी पद है।
- source_word: שָׁמַר מִצְוֺתַי
  choice: मेरी आज्ञाओं का पालन किया
  rationale: आज्ञाओं के साथ שׁמר का अर्थ उन्हें मानना या उनका पालन करना है; यह आधुनिक हिन्दी में स्वाभाविक है।
- source_word: הָלַךְ אַחֲרַי
  choice: मेरे पीछे चला
  rationale: इब्रानी के शाब्दिक चलने वाले रूपक को सुरक्षित रखता है और निष्ठापूर्वक अनुसरण का अर्थ भी स्पष्ट है।
- source_word: בְּכָל לְבָבוֹ
  choice: अपने सारे हृदय से
  rationale: अविभाजित आंतरिक निष्ठा का प्रचलित इब्रानी मुहावरा हिन्दी में इसी रूप में स्वाभाविक है।
- source_word: לַעֲשׂוֹת רַק הַיָּשָׁר בְּעֵינָי
  choice: ताकि केवल वही करे जो मेरी दृष्टि में सही है
  rationale: उद्देश्यसूचक infinitive, ‘केवल’ के बल, और परमेश्वर के मूल्यांकन को व्यक्त करने वाले ‘मेरी दृष्टि में’ मुहावरे को बनाए रखता है।
theological_decisions:
- issue: दाऊद का आदर्श रूप में मूल्यांकन, जबकि अन्य स्थानों पर उसके पाप वर्णित हैं
  choice: पद के अपने निर्बाध सकारात्मक मूल्यांकन को ज्यों का त्यों रखा गया है।
  alternative: ‘सामान्यतः’ या ‘अधिकांशतः’ जैसे स्पष्टीकरण जोड़ना।
  rationale: यह पद यारोबाम के विपरीत दाऊद को आज्ञाकारी आदर्श के रूप में प्रस्तुत करता है। दूसरे प्रसंगों से सामंजस्य बैठाने के लिए यहाँ कोई योग्यता-सूचक शब्द जोड़ना मूल पाठ के तनाव को मिटा देगा।
- issue: לַעֲשׂוֹת का संबंध
  choice: इसे दाऊद के पूरे हृदय से परमेश्वर के पीछे चलने के उद्देश्य अथवा परिणामी आचरण के रूप में ‘ताकि...करे’ से व्यक्त किया गया है।
  alternative: ‘और केवल वही करता रहा’ या ‘केवल वही करते हुए’।
  rationale: इब्रानी infinitive उद्देश्य, परिणाम या ढंग के निकट संबंध की अनुमति देता है; हिन्दी में ‘ताकि’ स्रोत की infinitive संरचना को स्पष्ट रखते हुए स्वाभाविक है।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। परमेश्वर द्वारा राजा को संबोधन में एकवचन ‘तू/तुझे’ रखा गया है। ‘दाऊद का घराना’ राजवंशीय अभिव्यक्ति को स्वाभाविक हिन्दी में संप्रेषित करता है। कोई पादटिप्पणी आवश्यक नहीं मानी गई।
