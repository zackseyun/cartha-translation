source:
  edition: WLC
  text: לָ/כֵ֗ן הִנְ/נִ֨י מֵבִ֤יא רָעָה֙ אֶל בֵּ֣ית יָרָבְעָ֔ם וְ/הִכְרַתִּ֤י לְ/יָֽרָבְעָם֙ מַשְׁתִּ֣ין בְּ/קִ֔יר עָצ֥וּר וְ/עָז֖וּב בְּ/יִשְׂרָאֵ֑ל וּ/בִֽעַרְתִּי֙ אַחֲרֵ֣י בֵית יָרָבְעָ֔ם כַּ/אֲשֶׁ֛ר יְבַעֵ֥ר הַ/גָּלָ֖ל עַד תֻּמּֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/014/010.yaml
  text: Therefore[a], behold, I am bringing disaster on the house of Jeroboam, and I will cut off from Jeroboam every male, bond and free in Israel, and I will burn away after the house of Jeroboam[b], just as one burns away dung until it is all gone.
translation:
  language: hi
  text: इसलिए देखो, मैं यारोबाम के घराने पर विपत्ति लाऊँगा। मैं यारोबाम के वंश में से हर पुरुष[a] को—चाहे बँधा हुआ हो या छोड़ा हुआ[b], इस्राएल में—मिटा डालूँगा। मैं यारोबाम के घराने का ऐसा सफाया कर दूँगा, जैसे कोई गोबर को तब तक साफ करता है जब तक वह पूरी तरह हट न जाए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से, “दीवार पर पेशाब करनेवाला”—पुरुष के लिए प्रयुक्त एक भद्दा मुहावरा।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में शाब्दिक रूप से, “बँधा हुआ और छोड़ा हुआ।” इस सूत्र का सटीक अर्थ अनिश्चित है; सम्भवतः यह विपरीत वर्गों के द्वारा हर एक को सूचित करता है, और इसका अर्थ “दास और स्वतंत्र” भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: רָעָה
  choice: विपत्ति
  rationale: न्याय की इस भविष्यवाणी में यह नैतिक बुराई नहीं, बल्कि परमेश्वर द्वारा लाई जानेवाली घोर आपदा को दर्शाता है।
- source_word: וְהִכְרַתִּי
  choice: मिटा डालूँगा
  rationale: यहाँ כרת का आशय यारोबाम के पुरुष वंश को समाप्त करने से है; यह स्वाभाविक हिन्दी में न्याय की कठोरता बनाए रखता है।
- source_word: מַשְׁתִּין בְּקִיר
  choice: हर पुरुष
  rationale: शाब्दिक इब्रानी एक भद्दा मुहावरा है जिसका संकेत पुरुषों की ओर है; मुख्य पाठ में अर्थ स्पष्ट किया गया और शाब्दिक रूप पादटिप्पणी में रखा गया है।
- source_word: עָצוּר וְעָזוּב
  choice: बँधे हुए और खुले छोड़े हुए
  rationale: दुर्लभ सूत्र को बिना अनिश्चितता मिटाए अपेक्षाकृत औपचारिक रूप में रखा गया है; यह संभवतः दो विपरीत वर्गों के द्वारा सबको समेटता है।
- source_word: וּבִעַרְתִּי אַחֲרֵי בֵית יָרָבְעָם
  choice: यारोबाम के घराने को ऐसे पूरी तरह साफ कर दूँगा
  rationale: בער और אחר का संयुक्त भाव पीछे कुछ न छोड़ते हुए पूर्ण सफाई का है; अगले गोबर-वाले उपमान के कारण ‘साफ कर दूँगा’ हिन्दी में स्वाभाविक है।
- source_word: הַגָּלָל
  choice: गोबर
  rationale: यह जानबूझकर घृणास्पद और अपमानसूचक चित्र है; ‘गोबर’ उसकी तीक्ष्णता को बनाए रखता है।
- source_word: עַד תֻּמּוֹ
  choice: जब तक वह बिलकुल हट न जाए
  rationale: वाक्यांश पूर्ण निष्कासन को व्यक्त करता है और हिन्दी में उपमान को स्पष्ट रूप से पूरा करता है।
theological_decisions:
- issue: ईश्वरीय न्याय की कठोरता
  choice: ‘विपत्ति’, ‘मिटा डालूँगा’ और गोबर के स्पष्ट उपमान द्वारा कठोर भाषा बनाए रखना
  alternative: ‘मुसीबत’ या ‘हटा दूँगा’ जैसे नरम शब्द
  rationale: मूल इब्रानी घोषणा कठोर और तिरस्कारपूर्ण है; उसे शिष्ट बनाने से उसके धर्मवैचारिक और अलंकारिक बल में कमी आएगी।
- issue: עָצוּר וְעָזוּב की अनिश्चित व्याख्या
  choice: मुख्य पाठ में अपेक्षाकृत शाब्दिक जोड़ी रखना और पादटिप्पणी में संभावित अर्थ देना
  alternative: निश्चित रूप से ‘दास और स्वतंत्र’ कहना
  rationale: इस रूढ़ सूत्र का सटीक सामाजिक आशय विवादित है; सम्भावित समग्रता को बताते हुए वास्तविक अस्पष्टता सुरक्षित रखी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण लेकिन प्रबल न्याय-वाणी। ‘देख’ से הִנְנִי की तात्कालिकता रखी गई है। मुख्य पाठ सहज है, जबकि भद्दे मुहावरे और कठिन समष्टिसूचक सूत्र की जानकारी पादटिप्पणियों में सुरक्षित है।
