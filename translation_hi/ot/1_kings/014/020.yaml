  text: וְ/הַ/יָּמִים֙ אֲשֶׁ֣ר מָלַ֣ךְ יָרָבְעָ֔ם עֶשְׂרִ֥ים וּ/שְׁתַּ֖יִם שָׁנָ֑ה וַ/יִּשְׁכַּב֙ עִם אֲבֹתָ֔י/ו וַ/יִּמְלֹ֛ךְ נָדָ֥ב בְּנ֖/וֹ תַּחְתָּֽי/ו־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/014/020.yaml
  text: The days that Jeroboam reigned were twenty-two years. Then he lay down with his fathers[a], and Nadab his son became king in his place.
translation:
  language: hi
  text: यारोबाम ने बाईस वर्ष तक राज्य किया। फिर वह अपने पुरखाओं के साथ सो गया[a], और उसका पुत्र नादाब उसके स्थान पर राजा हुआ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात उसकी मृत्यु हो गई। यह इब्रानी में राजकीय उत्तराधिकार-वर्णन में मृत्यु के लिए प्रयुक्त एक पारंपरिक मुहावरा है।
    reason: मुहावरे का आशय स्पष्ट करना और उसे शाब्दिक नींद के कथन के रूप में पढ़े जाने से रोकना।
lexical_decisions:
- source_word: וְהַיָּמִים אֲשֶׁר מָלַךְ יָרָבְעָם
  choice: यारोबाम ने ... तक राज किया
  rationale: इब्रानी राजकीय-सारांश सूत्र को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है; आरम्भिक וְ को अलग से अनूदित करना आवश्यक नहीं, और ‘राज किया’ מָלַךְ का प्रसंगानुकूल अर्थ है।
- source_word: עֶשְׂרִים וּשְׁתַּיִם שָׁנָה
  choice: बाईस वर्ष
  rationale: इब्रानी संख्या-पदबंध का सहज और सटीक हिन्दी रूप।
- source_word: וַיִּשְׁכַּב עִם אֲבֹתָיו
  choice: वह अपने पुरखाओं के साथ सो गया
  rationale: मृत्यु के लिए प्रयुक्त इब्रानी राजकीय मुहावरे और उसके रूपक को बनाए रखता है; हिन्दी में ‘पुरखाओं’ से वंशगत पूर्वज स्पष्ट होते हैं।
- source_word: וַיִּמְלֹךְ נָדָב בְּנוֹ
  choice: उसका पुत्र नादाब ... राजा हुआ
  rationale: उत्तराधिकार के प्रसंग में וַיִּמְלֹךְ राजगद्दी सँभालने को सूचित करता है; ‘राजा हुआ’ इसे संक्षेप और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: תַּחְתָּיו
  choice: उसके स्थान पर
  rationale: राजकीय उत्तराधिकार में प्रतिस्थापन का मूल अर्थ स्पष्ट रूप से सुरक्षित रहता है।
theological_decisions:
- issue: राजकीय सूत्र में मृत्यु का मुहावरा
  choice: अपने पुरखाओं के साथ सो गया
  alternative: मर गया
  rationale: मूल इब्रानी मृत्यु को रूपकात्मक राजकीय सूत्र से व्यक्त करता है। केवल ‘मर गया’ कहना अर्थ तो देता, पर स्रोत की साहित्यिक बनावट मिटा देता; यह पद अपने आप में परलोक के विषय में कोई विकसित धर्मवैज्ञानिक दावा नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी, सरल किंतु गरिमापूर्ण राजकीय कथन। ‘पुरखाओं’ सामान्य पाठक के लिए स्वाभाविक है और אֲבֹתָיו के वंशगत अर्थ को व्यक्त करता है।
