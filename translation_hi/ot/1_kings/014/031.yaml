base_translation:
  language: en
  yaml_path: translation/ot/1_kings/014/031.yaml
  text: And Rehoboam slept with his fathers and was buried with his fathers in the city of David[a]. And his mother's name was Naamah the Ammonite[b]. And Abijam his son reigned in his place.
translation:
  language: hi
  text: रहूबियाम अपने पूर्वजों के साथ सो गया और दाऊद के नगर में अपने पूर्वजों के साथ दफनाया गया। उसकी माता का नाम नामा था; वह अम्मोनी थी[a]। उसका पुत्र अबियाम[b] उसके स्थान पर राजा हुआ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: हिब्रू में यहाँ जातिवाचक शब्द स्त्रीलिंग में है और नामा को स्पष्ट रूप से अम्मोनी स्त्री बताता है।
    reason: lexical_alternative
  - marker: b
    text: कुछ अन्य पदों में इसी राजा को ‘अबिय्याह’ कहा गया है; इस पद के हिब्रू पाठ में ‘अबियाम’ है।
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּשְׁכַּב
  choice: सो गया
  rationale: राजकीय मृत्यु-वृत्तांत में यह मृत्यु के लिए प्रयुक्त रूढ़ रूपक है। ‘सो गया’ मूल अभिव्यक्ति और उसकी औपचारिक शैली को बनाए रखता है।
- source_word: עִם אֲבֹתָיו
  choice: अपने पूर्वजों के साथ
  rationale: यह राजवंशीय मृत्यु-सूत्र है। आधुनिक हिन्दी में ‘पूर्वजों’ से आशय स्पष्ट और स्वाभाविक रहता है।
- source_word: וַיִּקָּבֵר
  choice: दफनाया गया
  rationale: यह קבר के कर्मवाच्य रूप का सीधा और स्वाभाविक हिन्दी अनुवाद है।
- source_word: בְּעִיר דָּוִד
  choice: दाऊद के नगर में
  rationale: यह स्थानवाचक पद का पारदर्शी अनुवाद है और राजकीय दफन-स्थान को स्पष्ट करता है।
- source_word: וְשֵׁם אִמּוֹ
  choice: उसकी माता का नाम ... था
  rationale: यह राजमाता की पहचान बताने वाले हिब्रू सूचना-सूत्र को सहज हिन्दी में व्यक्त करता है।
- source_word: נַעֲמָה הָעַמֹּנִית
  choice: नामा था; वह अम्मोनी थी
  rationale: हिब्रू का स्त्रीलिंग जातिवाचक रूप स्पष्ट रूप से बताता है कि नामा अम्मोन की स्त्री थी; अलग उपवाक्य हिन्दी में स्वाभाविक है।
- source_word: וַיִּמְלֹךְ
  choice: राजा हुआ
  rationale: उत्तराधिकार के इस प्रसंग में क्रिया राजपद ग्रहण करने को सूचित करती है; ‘राजा हुआ’ संक्षिप्त और स्वाभाविक है।
- source_word: אֲבִיָּם
  choice: अबियाम
  rationale: इस पद के विशिष्ट हिब्रू नाम-रूप אֲבִיָּם को दर्शाता है, जबकि अन्य स्थानों पर इसी राजा का नाम अबिय्याह मिलता है।
- source_word: תַּחְתָּיו
  choice: उसके स्थान पर
  rationale: यह राजकीय उत्तराधिकार और प्रतिस्थापन—दोनों भावों को मूल के निकट रखते हुए व्यक्त करता है।
theological_decisions:
- issue: ‘अपने पूर्वजों के साथ सो गया’ मृत्यु-सूत्र का अर्थ
  choice: मूल रूपक को पाठ में बनाए रखा गया
  alternative: ‘मर गया’
  rationale: यहाँ हिब्रू मृत्यु के लिए पारंपरिक राजकीय रूपक का प्रयोग करता है। इसे सीधे ‘मर गया’ कहने से सूत्रात्मक भाषा लुप्त हो जाती; पाठ स्वयं मृत्यु के बाद दफनाए जाने का उल्लेख करके अर्थ स्पष्ट करता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। राजकीय मृत्यु-सूत्र की मूल रूपकात्मकता बचाई गई है, जबकि ‘पूर्वजों’, ‘दाऊद के नगर’ और ‘राजा हुआ’ जैसे सहज आधुनिक पद चुने गए हैं।
