source:
  edition: WLC
  text: וְ/יִתֵּ֖ן אֶת יִשְׂרָאֵ֑ל בִּ/גְלַ֞ל חַטֹּ֤אות יָֽרָבְעָם֙ אֲשֶׁ֣ר חָטָ֔א וַ/אֲשֶׁ֥ר הֶחֱטִ֖יא אֶת יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/014/016.yaml
  text: And he will give up Israel because of the sins of Jeroboam[a], which he committed and by which he caused Israel to sin.
translation:
  language: hi
  text: और वह यारोबाम के उन पापों के कारण इस्राएल को विपत्ति के हवाले कर देगा[a], जो उसने किए और जिनके कारण उसने इस्राएल को पाप कराया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “इस्राएल को सौंप देगा” या “इस्राएल को दे देगा।” इब्रानी क्रिया का शाब्दिक अर्थ “देना” है, पर यहाँ न्याय के संदर्भ में इसका अर्थ किसी प्रजा को विपत्ति या शत्रुओं के हाथ सौंप देना है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיִתֵּן
  choice: और वह ... त्याग देगा
  rationale: נתן का मूल अर्थ ‘देना’ है, पर यहाँ न्याय के संदर्भ में किसी को विपत्ति के हवाले कर देने का भाव है। ‘त्याग देगा’ सहज हिंदी में इस न्यायसूचक अर्थ को व्यक्त करता है; वैकल्पिक अधिक शाब्दिक अर्थ पाद-टिप्पणी में दिया गया है।
- source_word: אֶת יִשְׂרָאֵל
  choice: इस्राएल को
  rationale: यह निश्चित कर्म के रूप में राष्ट्र अथवा उसके लोगों को सामूहिक रूप से दर्शाता है।
- source_word: בִּגְלַל
  choice: के कारण
  rationale: यह कारण अथवा आधार बताता है; ‘के कारण’ आधुनिक हिंदी में स्पष्ट और स्वाभाविक है।
- source_word: חַטֹּאות יָרָבְעָם
  choice: यारोबाम के उन पापों
  rationale: बहुवचन חַטֹּאות को ‘पापों’ और नाम יָרָבְעָם को प्रचलित हिंदी रूप ‘यारोबाम’ से व्यक्त किया गया है। ‘उन’ आगे आने वाले संबंधवाचक उपवाक्यों से स्वाभाविक संबंध बनाता है।
- source_word: אֲשֶׁר חָטָא
  choice: जो उसने स्वयं किए
  rationale: शाब्दिक रूप ‘जिनका उसने पाप किया’ हिंदी में अस्वाभाविक है। ‘पाप किए’ अर्थ को बनाए रखता है, और ‘स्वयं’ यारोबाम के निजी अपराध तथा अगले कारक उपवाक्य के बीच स्पष्ट अंतर करता है।
- source_word: וַאֲשֶׁר הֶחֱטִיא אֶת יִשְׂרָאֵל
  choice: और जिनके द्वारा उसने इस्राएल से पाप करवाया
  rationale: חטא के हिफ़ील रूप का कारक अर्थ ‘पाप करवाना/पाप का कारण बनना’ है। ‘जिनके द्वारा’ दोनों संबंधवाचक उपवाक्यों को पूर्वोक्त पापों से जोड़ता है।
theological_decisions:
- issue: ईश्वरीय न्याय में ‘देने’ का अर्थ
  choice: इस्राएल को त्याग देगा
  alternative: इस्राएल को विपत्ति के हवाले कर देगा
  rationale: कर्ता परमेश्वर है, किंतु इस पद में न्याय के ऐतिहासिक साधन का उल्लेख नहीं है। चुना हुआ रूप न्याय की गंभीरता रखता है और अनकहा साधन नहीं जोड़ता।
- issue: यारोबाम का अपना अपराध और इस्राएल को पाप कराने में उसकी भूमिका
  choice: जो उसने स्वयं किए और जिनके द्वारा उसने इस्राएल से पाप करवाया
  alternative: जिनका उसने पाप किया और जिनसे उसने इस्राएल को पाप कराया
  rationale: इब्रानी पाठ यारोबाम के निजी पाप और राष्ट्र पर उसके कारक प्रभाव—दोनों को प्रस्तुत करता है। अनुवाद दोनों पहलुओं को स्पष्ट रखते हुए हिफ़ील की कारक शक्ति को नहीं घटाता।
translation_notes:
  register: आधुनिक मानक हिंदी का सहज, गरिमापूर्ण और सामान्य पाठकों के लिए बोधगम्य रूप अपनाया गया है। ‘त्याग देगा’ मुख्य पाठ को संक्षिप्त रखता है, जबकि पाद-टिप्पणी इब्रानी मुहावरे के अधिक शाब्दिक न्यायसूचक विकल्प को सुरक्षित रखती है।
