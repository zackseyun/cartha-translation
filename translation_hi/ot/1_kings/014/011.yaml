  text: הַ/מֵּ֨ת לְ/יָֽרָבְעָ֤ם בָּ/עִיר֙ יֹאכְל֣וּ הַ/כְּלָבִ֔ים וְ/הַ/מֵּת֙ בַּ/שָּׂדֶ֔ה יֹאכְל֖וּ ע֣וֹף הַ/שָּׁמָ֑יִם כִּ֥י יְהוָ֖ה דִּבֵּֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/014/011.yaml
  text: Anyone belonging to Jeroboam who dies in the city[a], the dogs will eat; and anyone who dies in the field, the birds of the sky will eat[b], for Yahweh has spoken.
translation:
  language: hi
  text: यारोबाम के घराने का जो कोई नगर में मरेगा,[a] उसे कुत्ते खाएँगे; और जो कोई खेत में मरेगा, उसे आकाश के पक्षी खाएँगे,[b] क्योंकि यहोवा ने कहा है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “यारोबाम का मरा हुआ व्यक्ति”; आशय है, यारोबाम के घराने का कोई भी व्यक्ति जो मरे।
    reason: lexical_alternative
  - marker: b
    text: या, “स्वर्ग के पक्षी।”
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמֵּת לְיָרָבְעָם
  choice: यारोबाम के घराने का जो कोई ... मरेगा
  rationale: इब्रानी संबंधसूचक रचना यारोबाम से संबंधित व्यक्ति, अर्थात उसके घराने या वंश के सदस्य, को बाँटकर प्रत्येक पर लागू करती है। यह हिन्दी में अर्थ स्पष्ट करते हुए मूल संबंध को बनाए रखता है।
- source_word: בָּעִיר
  choice: नगर में
  rationale: यह निश्चित स्थानवाचक पद है; नगर और मैदान का विरोध हिन्दी में स्वाभाविक रूप से बना रहता है।
- source_word: יֹאכְלוּ הַכְּלָבִים
  choice: उसे कुत्ते खाएँगे
  rationale: क्रिया אָכַל का सीधा अर्थ ‘खाना’ है। ‘खा जाएँगे’ या ‘नोच खाएँगे’ की अपेक्षा यह मूल की कठोर छवि को बिना बढ़ाए रखता है। हिन्दी में कर्म ‘उसे’ जोड़ने से वाक्य स्पष्ट और स्वाभाविक होता है।
- source_word: וְהַמֵּת בַּשָּׂדֶה
  choice: और जो कोई मैदान में मरेगा
  rationale: पहले खंड के समान इसे प्रत्येक संबंधित व्यक्ति पर लागू करने वाले रूप में अनूदित किया गया है। שָׂדֶה के लिए ‘मैदान’ सीधा और नगर के विपरीत उपयुक्त है।
- source_word: עוֹף הַשָּׁמָיִם
  choice: आकाश के पक्षी
  rationale: עוֹף सामूहिक अर्थ में उड़ने वाले पक्षियों को दर्शाता है और שָׁמַיִם का सीधा अर्थ ‘आकाश’ है।
- source_word: כִּי יְהוָה דִּבֵּר
  choice: क्योंकि यहोवा ने कहा है
  rationale: כִּי न्याय-वचन का आधार और उसकी निश्चितता बताता है। पूर्ण क्रिया דִּבֵּר को ‘ने कहा है’ वर्तमान तक प्रभावी, निश्चित घोषणा के रूप में व्यक्त करती है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल में चार-अक्षरीय व्यक्तिगत ईश्वरीय नाम सीधे आया है। हिन्दी पाठकों के लिए प्रचलित और पहचाना जाने वाला रूप ‘यहोवा’ नाम को उपाधि में बदले बिना सुरक्षित रखता है; ‘याहवे’ संभावित विद्वतापरक उच्चारण है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट हिन्दी। समानांतर खंडों की संरचना बनाए रखी गई है और मृत्यु के बाद अपमानजनक न्याय की कठोरता को न नरम किया गया है, न बढ़ाया गया है।
