  text: וּ/רְחַבְעָם֙ בֶּן שְׁלֹמֹ֔ה מָלַ֖ךְ בִּֽ/יהוּדָ֑ה בֶּן אַרְבָּעִ֣ים וְ/אַחַ֣ת שָׁנָה֩ רְחַבְעָ֨ם בְּ/מָלְכ֜/וֹ וּֽ/שֲׁבַ֨ע עֶשְׂרֵ֥ה שָׁנָ֣ה מָלַ֣ךְ בִּ/ירוּשָׁלִַ֗ם הָ֠/עִיר אֲשֶׁר בָּחַ֨ר יְהוָ֜ה לָ/שׂ֨וּם אֶת שְׁמ֥/וֹ שָׁם֙ מִ/כֹּל֙ שִׁבְטֵ֣י יִשְׂרָאֵ֔ל וְ/שֵׁ֣ם אִמּ֔/וֹ נַעֲמָ֖ה הָ/עַמֹּנִֽית־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/014/021.yaml
  text: Rehoboam the son of Solomon reigned in Judah[a]. Rehoboam was forty-one years old when he became king, and he reigned seventeen years in Jerusalem, the city that Yahweh had chosen from all the tribes of Israel to put his name there[b]. And his mother’s name was Naamah the Ammonite woman.
translation:
  language: hi
  text: सुलैमान के पुत्र रहूबियाम ने यहूदा में[a] राज्य किया। राजा बनते समय रहूबियाम इकतालीस वर्ष का था, और उसने यरूशलेम में सत्रह वर्ष राज्य किया; यरूशलेम वह नगर था जिसे याहवे ने इस्राएल के सभी गोत्रों में से अपना नाम वहाँ रखने के लिए चुना था[b]। उसकी माता का नाम नामा था, जो अम्मोनी स्त्री थी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘यहूदा में’ का अनुवाद ‘यहूदा पर’ भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में शाब्दिक अर्थ है, “अपना नाम वहाँ रखने के लिए।” यह वाचा-संबंधी अभिव्यक्ति उस स्थान की ओर संकेत करती है जो विशेष रूप से याहवे की उपस्थिति और उपासना से जुड़ा था।
    reason: cultural_note
lexical_decisions:
- source_word: מָלַךְ
  choice: राज्य किया
  rationale: यह क्रिया राजकीय शासन को व्यक्त करती है। ‘राज्य किया’ आधुनिक हिन्दी में स्वाभाविक है और पद में आए दोनों प्रयोगों को ठीक प्रकार दर्शाती है।
- source_word: בִּיהוּדָה
  choice: यहूदा में
  rationale: पूर्वसर्ग ב का सामान्य अर्थ ‘में’ है। राजकीय संदर्भ में ‘यहूदा पर’ भी सम्भव है, पर ‘यहूदा में’ इब्रानी के अधिक निकट और हिन्दी में सुबोध है।
- source_word: בְּמָלְכוֹ
  choice: राजा बनते समय
  rationale: पूर्वसर्ग और प्रत्यययुक्त infinitive construct यहाँ राज्यारोहण का समय बताता है; यह अनुवाद आयु को शासनकाल की अवधि से स्पष्ट रूप से अलग रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: चार अक्षरों वाले परमेश्वर के व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय हिन्दी में लिप्यंतरित किया गया है।
- source_word: לָשׂוּם אֶת־שְׁמוֹ שָׁם
  choice: अपना नाम वहाँ रखने
  rationale: यह इब्रानी वाक्यांश के शाब्दिक रूप ‘वहाँ अपना नाम रखना’ को सुरक्षित रखता है और उसकी वाचा-संबंधी गहराई को व्याख्यात्मक विस्तार द्वारा सीमित नहीं करता।
- source_word: מִכֹּל שִׁבְטֵי יִשְׂרָאֵל
  choice: इस्राएल के सभी गोत्रों में से
  rationale: מִן यहाँ पूरे समूह में से चयन को दर्शाता है; ‘में से’ हिन्दी में इसी संबंध को स्पष्ट करता है।
- source_word: הָעַמֹּנִית
  choice: अम्मोनी स्त्री
  rationale: स्त्रीलिंग जातिवाचक शब्द नामा की जातीय पहचान बताता है। ‘अम्मोनी स्त्री’ स्पष्ट, वर्तमान और स्वाभाविक हिन्दी है।
theological_decisions:
- issue: परमेश्वर के नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में व्यक्तिगत वाचा-नाम सीधे आया है। ‘याहवे’ उसके प्रचलित विद्वत्तापूर्ण उच्चारण का देवनागरी लिप्यंतरण है और उसे किसी उपाधि से प्रतिस्थापित नहीं करता।
- issue: ‘अपना नाम वहाँ रखने’ का आशय
  choice: मूल रूपक को मुख्य पाठ में बनाए रखा गया
  alternative: वहाँ अपनी उपस्थिति स्थापित करने
  rationale: यह वाक्यांश चुने हुए उपासना-स्थान के साथ याहवे के नाम, उपस्थिति और अधिकार के संबंध को व्यक्त करता है। व्याख्यात्मक अर्थ को मुख्य पाठ में डालने के बजाय टिप्पणी में बताया गया है, जिससे मूल की धर्मवैज्ञानिक व्यापकता बनी रहती है।
translation_notes:
  register: 'भाषा आधुनिक मानक हिन्दी की है: सरल, गरिमापूर्ण और सार्वजनिक पाठ के अनुकूल। नामों के रूप ‘रहूबियाम’, ‘यरूशलेम’, ‘इस्राएल’, ‘नामा’ और ‘अम्मोनी’ रखे गए हैं। मूल पद की पुनरुक्ति और ‘अपना नाम वहाँ रखने’ की धर्मवैज्ञानिक अभिव्यक्ति को सुरक्षित रखा गया है।'
