  yaml_path: translation/ot/1_kings/014/012.yaml
  text: But as for you[a], arise, go to your house. When your feet enter the city, the child will die.
translation:
  language: hi
  text: पर तू उठ, अपने घर जा। जब तेरे पाँव नगर में प्रवेश करेंगे, बच्चा मर जाएगा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/אַתְּ
  choice: पर तू
  rationale: संयोजक और स्वतंत्र द्वितीय-पुरुष स्त्रीलिंग सर्वनाम संबोधित स्त्री की ओर विरोधात्मक और बलयुक्त मोड़ दिखाते हैं। ‘पर तू’ इसे संक्षिप्त और स्वाभाविक रूप में व्यक्त करता है।
- source_word: ק֖וּמִי
  choice: उठ
  rationale: קום का स्त्रीलिंग एकवचन आज्ञार्थक रूप; ‘उठ’ आधुनिक हिन्दी में स्वाभाविक रहते हुए आज्ञा की गंभीरता बनाए रखता है।
- source_word: לְכִ֣י
  choice: जा
  rationale: הלך का स्त्रीलिंग एकवचन आज्ञार्थक रूप; प्रसंग में सीधी गति-संबंधी आज्ञा है।
- source_word: לְ/בֵיתֵ֑/ךְ
  choice: अपने घर
  rationale: בַּיִת का मूल अर्थ ‘घर’ है; हिन्दी में ‘अपने घर जा’ संबंध और दिशा दोनों को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: בְּ/בֹאָ֥ה
  choice: जैसे ही ... प्रवेश करेंगे
  rationale: בְּ के साथ בוא का infinitive construct आगमन के समय को चिह्नित करता है। मृत्यु उसी आगमन पर होने के कारण ‘जैसे ही’ तात्कालिक समय-संबंध को स्पष्ट करता है।
- source_word: רַגְלַ֛יִ/ךְ
  choice: तेरे पाँव
  rationale: मूल में शरीर-अंग का ठोस बिंब है; उसे बनाए रखने से इब्रानी अभिव्यक्ति की जीवंतता सुरक्षित रहती है।
- source_word: הָ/עִ֖ירָ/ה
  choice: नगर में
  rationale: दिशासूचक ה गति को नगर के भीतर पहुँचने की ओर दिखाता है; ‘प्रवेश करेंगे’ के साथ ‘नगर में’ यह अर्थ स्वाभाविक हिन्दी में देता है।
- source_word: וּ/מֵ֥ת
  choice: मर जाएगा
  rationale: भविष्यसूचक प्रसंग में conjunction सहित perfect निश्चित आगामी परिणाम बताता है; ‘मर जाएगा’ समकालीन हिन्दी में स्पष्ट भविष्यवाणी है।
- source_word: הַ/יָּֽלֶד
  choice: बच्चा
  rationale: יֶלֶד यहाँ पहले से ज्ञात संतान को सूचित करता है; ‘बच्चा’ आयु और लिंग पर अनावश्यक बल दिए बिना सामान्य अर्थ देता है।
