  text: राजा रहूबियाम के शासन के पाँचवें वर्ष में मिस्र के राजा शीशक ने यरूशलेम पर चढ़ाई की[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इसे ‘यरूशलेम के विरुद्ध चढ़ आया’ भी अनूदित किया जा सकता है। इब्रानी मुहावरे में किसी प्रमुख नगर की ओर सैनिक रूप से बढ़ने के लिए ‘चढ़ना’ कहा जाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: मुख्य वाक्य में अलग से अनूदित नहीं
  rationale: यह कथानक में नई घटना आरम्भ करने वाला रूप है। आधुनिक हिन्दी में काल-सूचक वाक्यांश से आरम्भ करना स्वाभाविक है; ‘और ऐसा हुआ’ जोड़ना अनावश्यक और कृत्रिम होता।
- source_word: בַּשָּׁנָה הַחֲמִישִׁית לַמֶּלֶךְ רְחַבְעָם
  choice: राजा रहूबियाम के शासन के पाँचवें वर्ष में
  rationale: यह राजकीय वर्ष बताने की प्रचलित अभिव्यक्ति है। ‘के शासन’ निहित सम्बन्ध को हिन्दी में स्पष्ट और स्वाभाविक बनाता है।
- source_word: עָלָה ... עַל
  choice: पर चढ़ाई की
  rationale: यह सैनिक सन्दर्भ में किसी नगर के विरुद्ध आगे बढ़ने को व्यक्त करता है। ‘चढ़ाई की’ दिशात्मक और शत्रुतापूर्ण दोनों भावों को रखता है, पर वास्तविक आक्रमण के परिणाम को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: שושק
  choice: शीशक
  rationale: इब्रानी रूप का हिन्दी बाइबिल परम्परा में परिचित लिप्यन्तरण अपनाया गया है; मिस्री ऐतिहासिक पहचान के आधार पर नाम को बदलकर ‘शोशेंक’ नहीं किया गया।
- source_word: מֶלֶךְ מִצְרַיִם
  choice: मिस्र के राजा
  rationale: सम्बन्धसूचक पदबंध को शीशक की उपाधि के रूप में स्वाभाविक हिन्दी क्रम में रखा गया है।
- source_word: יְרוּשָׁלִָם
  choice: यरूशलेम
  rationale: नगर के नाम का आधुनिक हिन्दी बाइबिल प्रयोग में व्यापक रूप अपनाया गया है।
