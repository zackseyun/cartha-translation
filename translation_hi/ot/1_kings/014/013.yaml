base_translation:
  language: en
  yaml_path: translation/ot/1_kings/014/013.yaml
  text: All Israel will mourn for him and bury him[a], because he alone of Jeroboam’s house will come to the grave, since in him something good toward Yahweh, the God of Israel[c][b], has been found in the house of Jeroboam.
translation:
  language: hi
  text: सारा इस्राएल उसके लिए शोक मनाएँगे और उसे दफ़नाएँगे।[a] यारोबाम के घराने में से केवल वही कब्र में जाएगा, क्योंकि इस्राएल के परमेश्वर यहोवा के प्रति कुछ अच्छा यारोबाम के घराने में उसी में पाया गया है।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक रूप के निकट: “यारोबाम का केवल यही व्यक्ति कब्र में जाएगा”; आशय है कि उसके घराने में केवल इसी को दफ़नाया जाएगा।'
    reason: मूल इब्रानी की असामान्य रचना और उसके प्रसंगगत आशय को बताना।
  - marker: b
    text: “कुछ अच्छा” का अनुवाद “कोई अच्छी बात” भी हो सकता है। “यहोवा के प्रति” उस अच्छे की दिशा या यहोवा से उसके संबंध को बताता है; उसका ठीक स्वरूप स्पष्ट नहीं किया गया है।
    reason: דָּבָר טוֹב और אֶל की वास्तविक lexical ambiguity सुरक्षित रखना।
lexical_decisions:
- source_word: וְסָפְדוּ
  choice: शोक मनाएगा
  rationale: ספד मृतक के लिए विलाप या शोक करने को दर्शाता है। सामूहिक कर्ता ‘सारा इस्राएल’ के साथ एकवचन क्रिया स्वाभाविक हिन्दी व्याकरण के अनुरूप है।
- source_word: וְקָבְרוּ אֹתוֹ
  choice: और उसे दफ़नाएगा
  rationale: मूल पाठ का सीधा अर्थ ‘उसे दफ़नाना’ है; हिन्दी में पिछले सामूहिक कर्ता को सहज रूप से जारी रखा गया है।
- source_word: כִּי זֶה לְבַדּוֹ
  choice: केवल वही
  rationale: यह पदबंध यारोबाम के शेष घराने के विपरीत इस बालक की अनन्यता पर बल देता है।
- source_word: יָבֹא לְיָרָבְעָם אֶל קָבֶר
  choice: यारोबाम के घराने में से केवल वही कब्र में जाएगा
  rationale: शाब्दिक रचना कठिन है, पर प्रसंग में आशय है कि यारोबाम के वंश में केवल इसी व्यक्ति को विधिवत दफ़नाया जाएगा। ‘कब्र में जाएगा’ मूल रूपक को बनाए रखता है।
- source_word: נִמְצָא בוֹ
  choice: उसी में ... पाया गया है
  rationale: निफ़अल पूर्ण रूप किसी गुण के उसमें पाए जाने को व्यक्त करता है; हिन्दी पूर्ण पक्ष परिणाम की वर्तमान प्रासंगिकता बनाए रखता है।
- source_word: דָּבָר טוֹב
  choice: कुछ अच्छा
  rationale: अनिश्चित और व्यापक अभिव्यक्ति है; यह किसी विशिष्ट कर्म या गुण को अनावश्यक रूप से निश्चित नहीं करती।
- source_word: אֶל יְהוָה
  choice: यहोवा के प्रति
  rationale: אֶל की दिशात्मक अथवा संबंधपरक अस्पष्टता को ‘के प्रति’ स्वाभाविक हिन्दी में सुरक्षित रखता है, बिना इसे केवल आंतरिक प्रवृत्ति या परमेश्वर को प्रसन्न करनेवाली वस्तु मान लेने के।
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिन्दी बाइबलीय प्रयोग में प्रचलित रूप से चतुरक्षरीय दिव्य नाम को शीर्षक से अलग निजी नाम के रूप में प्रस्तुत करता है।
- source_word: בְּבֵית יָרָבְעָם
  choice: यारोबाम के घराने में
  rationale: यहाँ ‘घर’ परिवार और राजवंश दोनों को सूचित करता है; ‘घराना’ आधुनिक हिन्दी में इस वंशगत अर्थ को स्पष्ट रखता है।
theological_decisions:
- issue: יְהוָה दिव्य नाम का अनुवाद
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: मूल में निजी दिव्य नाम है। ‘यहोवा’ हिन्दी पाठकों में व्यापक रूप से पहचाना जाने वाला नामरूप है और इसे ‘प्रभु’ जैसे पद से नहीं बदलता।
- issue: דָּבָר טוֹב אֶל יְהוָה का अर्थ
  choice: यहोवा के प्रति कुछ अच्छा
  alternative: यहोवा को प्रसन्न करनेवाली कोई अच्छी बात; यहोवा की दृष्टि में कुछ अच्छा
  rationale: मूल का אֶל संबंध या दिशा बताता है, पर उस ‘अच्छे’ का ठीक स्वरूप नहीं खोलता। इसलिए अनुवाद इस धर्मवैचारिक तनाव और व्यापकता को सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सहज। ‘घराना’ वंशगत अर्थ देता है; ‘कब्र में जाएगा’ मूल चित्र को रखता है। वाक्य-विन्यास को हिन्दी में स्वाभाविक बनाने के लिए कारणवाचक उपवाक्य पुनर्गठित किया गया है, और अस्पष्ट धार्मिक आशय को स्पष्टवादी व्याख्या से नहीं भरा गया।
