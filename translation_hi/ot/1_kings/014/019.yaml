  yaml_path: translation/ot/1_kings/014/019.yaml
  text: The rest of the acts of Jeroboam[a], how he fought and how he reigned, behold[c][b], they are written in the Book of the Chronicles of the Kings of Israel.
translation:
  language: hi
  text: यराबाम के शेष कार्यों का विवरण—कि उसने कैसे युद्ध किए और कैसे राज्य किया—देखो, वे इस्राएल के राजाओं के इतिहास की पुस्तक[a] में लिखे हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यह इस्राएल के राजाओं का राजकीय वार्षिक अभिलेख या इतिहास-वृत्तांत था; इसका आशय बाइबल की 1–2 इतिहास पुस्तकों से नहीं है।
    reason: cross_reference
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי יָרָבְעָם
  choice: यराबाम के बाकी कामों का विवरण
  rationale: राजकीय सारांश के इस सूत्र में דִּבְרֵי का आशय केवल ‘बातें’ या ‘वचन’ नहीं, बल्कि राजा के कार्यों और मामलों के लिखित विवरण से है। हिंदी में ‘कामों का विवरण’ स्रोत का अर्थ स्वाभाविक ढंग से व्यक्त करता है।
- source_word: אֲשֶׁר נִלְחַם
  choice: उसने किस तरह युद्ध किए
  rationale: निफ़अल रूप נִלְחַם यहाँ लड़ने या युद्ध करने की गतिविधि बताता है। ‘किस तरह युद्ध किए’ आगे उल्लिखित राजकीय अभिलेख की विषयवस्तु को स्पष्ट करता है, बिना युद्धों के परिणाम या प्रकृति को जोड़े।
- source_word: וַאֲשֶׁר מָלָךְ
  choice: और किस तरह राज्य किया
  rationale: מָלָךְ का सामान्य अर्थ ‘राज्य करना’ है। समानांतर रचना में यह याराबाम के शासनकाल और राजकीय गतिविधियों की ओर संकेत करता है।
- source_word: הִנָּם כְּתוּבִים
  choice: लिखा हुआ है
  rationale: हिब्रू का शाब्दिक भाव ‘देखो, वे लिखे हुए हैं’ है। आधुनिक हिंदी में ‘लिखा हुआ है’ उसी अभिलेखीय निष्कर्ष को स्वाभाविक रूप से देता है; הִנָּם की ध्यान आकर्षित करने वाली शक्ति हिंदी वाक्य में अलग से ‘देखो’ रखने पर अस्वाभाविक लगती।
- source_word: עַל סֵפֶר דִּבְרֵי הַיָּמִים לְמַלְכֵי יִשְׂרָאֵל
  choice: इस्राएल के राजाओं के इतिहास की पुस्तक में
  rationale: यह पदबंध इस्राएली राजाओं के राजकीय वृत्तांत या अभिलेख का शीर्षक है। ‘इतिहास की पुस्तक’ साधारण पाठक के लिए स्पष्ट है और इसे बाइबल की इतिहास/इतिहास-वृत्तांत नामक किसी अन्य पुस्तक से अनावश्यक रूप से नहीं मिलाता।
theological_decisions:
- issue: उल्लिखित पुस्तक की पहचान
  choice: इसे इस्राएल के राजाओं के राजकीय ऐतिहासिक अभिलेख के रूप में प्रस्तुत किया गया है।
  alternative: इसे बाइबल की 1–2 इतिहास की पुस्तक समझना।
  rationale: हिब्रू राजकीय सारांश सूत्र एक स्रोत-अभिलेख की ओर संकेत करता है; यह बाद की बाइबलीय ‘इतिहास’ पुस्तकों का नाम नहीं है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सहज हिंदी। राजकीय सारांश की औपचारिकता बनाए रखते हुए अत्यधिक शाब्दिक ‘बाकी बातें’ और अस्वाभाविक ‘देखो, वे लिखी हुई हैं’ से बचा गया है। मुख्य पाठ का [a] चिह्न संबंधित टिप्पणी से मेल खाता है।
