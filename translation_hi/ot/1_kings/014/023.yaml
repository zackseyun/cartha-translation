source:
  edition: WLC
  text: וַ/יִּבְנ֨וּ גַם הֵ֧מָּה לָ/הֶ֛ם בָּמ֥וֹת וּ/מַצֵּב֖וֹת וַ/אֲשֵׁרִ֑ים עַ֚ל כָּל גִּבְעָ֣ה גְבֹהָ֔ה וְ/תַ֖חַת כָּל עֵ֥ץ רַעֲנָֽן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/014/023.yaml
  text: They too built for themselves high places[a], pillars, and Asherah poles on every high hill and under every green tree.
translation:
  language: hi
  text: उन्होंने भी अपने लिए हर ऊँची पहाड़ी पर और हर हरे-भरे पेड़ के नीचे ऊँचे पूजा-स्थान, पवित्र स्तंभ और अशेरा-चिह्न[a] बनाए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “अशेरीम” अथवा “अशेरा-खंभे”; इब्रानी शब्द अशेरा से जुड़ी उपासना-वस्तुओं के लिए प्रयुक्त हुआ है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּבְנוּ
  choice: बनाए
  rationale: בנה का सामान्य अर्थ ‘बनाना/निर्माण करना’ है। यहाँ यह पूजा-स्थानों और उनसे जुड़ी वस्तुओं की स्थापना को स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: גַם הֵמָּה
  choice: उन्होंने भी
  rationale: यह पिछले संदर्भ से निरंतरता और इस बात पर बल, दोनों बनाए रखता है कि यहूदा के लोगों ने भी ऐसे पाप किए।
- source_word: לָהֶם
  choice: अपने लिए
  rationale: यहाँ संबंधवाचक पूर्वसर्ग का भाव आत्मवाचक है—उन्होंने इन पूजा-स्थलों को अपने उपयोग के लिए बनाया।
- source_word: בָּמוֹת
  choice: ऊँचे पूजा-स्थान
  rationale: במות स्थानीय उपासना-स्थलों के लिए प्रयुक्त धार्मिक शब्द है। केवल ‘ऊँचे स्थान’ आधुनिक हिंदी में उसका धार्मिक आशय पर्याप्त स्पष्ट नहीं करता।
- source_word: מַצֵּבוֹת
  choice: पवित्र स्तंभ
  rationale: מצבות खड़े किए गए धार्मिक पत्थरों या स्तंभों को दर्शाता है। ‘पवित्र’ यहाँ उनके उपासना-संबंधी उपयोग को स्पष्ट करता है, उनका अनुमोदन नहीं।
- source_word: אֲשֵׁרִים
  choice: अशेरा-चिह्न
  rationale: बहुवचन शब्द अशेरा से जुड़ी उपासना-वस्तुओं को दर्शाता है। ‘चिह्न’ वस्तु का धार्मिक स्वरूप बताता है, पर उसके निश्चित रूप या सामग्री को अनावश्यक रूप से तय नहीं करता।
- source_word: עַל כָּל גִּבְעָה גְבֹהָה
  choice: हर ऊँची पहाड़ी पर
  rationale: यह स्थल-संबंधी अर्थ और मूल वाक्य की व्यापकता, दोनों को सहज हिंदी में बनाए रखता है।
- source_word: וְתַחַת כָּל עֵץ רַעֲנָן
  choice: और हर हरे-भरे पेड़ के नीचे
  rationale: רענן ताजगी, हरियाली और घने पत्तों का भाव देता है; ‘हरे-भरे’ से रूढ़ धार्मिक स्थल-वर्णन स्वाभाविक हिंदी में व्यक्त होता है।
theological_decisions:
- issue: क्या אֲשֵׁרִים देवी अशेरा को दर्शाता है या उससे जुड़ी उपासना-वस्तुओं को
  choice: अशेरा से जुड़ी उपासना-वस्तुएँ, जिन्हें ‘अशेरा-चिह्न’ कहा गया है
  alternative: अशेरा-खंभे; अशेरीम; अशेरा की प्रतिमाएँ
  rationale: ‘ऊँचे पूजा-स्थान’ और ‘पवित्र स्तंभ’ के साथ सूची में आने के कारण यहाँ भौतिक उपासना-वस्तुएँ अधिक स्वाभाविक अर्थ हैं। फिर भी उनका ठीक रूप और सामग्री निश्चित नहीं है, इसलिए मुख्य पाठ और पादटिप्पणी उस अस्पष्टता को बनाए रखते हैं।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘ऊँचे पूजा-स्थान’ धार्मिक अर्थ स्पष्ट करता है, जबकि ‘अशेरा-चिह्न’ मूल शब्द के आशय को बताए बिना वस्तु के सटीक आकार या सामग्री को निश्चित नहीं करता।
