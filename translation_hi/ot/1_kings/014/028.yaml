translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी। ‘जब-जब ... तब’ से नियमित राजकीय प्रथा स्पष्ट की गई है। ‘अंगरक्षक’ को शाब्दिक ‘दौड़नेवाले’ की अपेक्षा प्रसंगानुकूल कार्यात्मक अर्थ के रूप में चुना गया है।
