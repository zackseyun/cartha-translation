  text: וַ/יְהִ֛י מִ/דֵּי בֹ֥א הַ/מֶּ֖לֶךְ בֵּ֣ית יְהוָ֑ה יִשָּׂאוּ/ם֙ הָֽ/רָצִ֔ים וֶ/הֱשִׁיב֖וּ/ם אֶל תָּ֥א הָ/רָצִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/014/028.yaml
  text: And whenever the king entered the house of Yahweh[b][a], the guards would carry them and then return them to the guards’ chamber.
translation:
  language: hi
  text: जब-जब राजा यहोवा के भवन में जाता था, तब अंगरक्षक उन ढालों[a] को उठा ले जाते थे और फिर उन्हें अंगरक्षकों के कक्ष में वापस रख देते थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात् कांसे की वे ढालें, जिन्हें रहूबियाम ने उन सोने की ढालों के स्थान पर बनवाया था जिन्हें शीशक ले गया था (देखें 1 राजा 14:26–27)।
    reason: cross_reference
lexical_decisions:
- source_word: מִדֵּי בֹא
  choice: जब-जब ... जाता था
  rationale: यह रचना बार-बार होने वाली प्रथा व्यक्त करती है; ‘जब-जब’ और अपूर्ण भूतकाल मिलकर उसके आवर्ती भाव को स्वाभाविक हिन्दी में रखते हैं।
- source_word: בֵּית יְהוָה
  choice: यहोवा के भवन
  rationale: ‘भवन’ मूल के ‘घर’ रूपक को गरिमापूर्ण और स्पष्ट ढंग से रखता है तथा प्रसंग में मंदिर को सूचित करता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिन्दी में प्रचलित रूप से परमेश्वर के व्यक्तिगत नाम को शीर्षक से प्रतिस्थापित किए बिना प्रस्तुत करता है।
- source_word: יִשָּׂאוּם
  choice: उन ढालों को उठा ले जाते थे
  rationale: कर्म-प्रत्यय का संकेत पिछले पद की कांसे की ढालों की ओर है; स्पष्ट संज्ञा पाठक को संदर्भ समझने में सहायता देती है, और ‘ले जाते थे’ आवर्ती क्रिया दर्शाता है।
- source_word: הָרָצִים
  choice: अंगरक्षक
  rationale: शाब्दिक अर्थ ‘दौड़नेवाले’ है, पर राजकीय संदर्भ में ये राजा के साथ चलने वाले रक्षक थे; ‘अंगरक्षक’ उनका कार्य स्पष्ट करता है।
- source_word: וֶהֱשִׁיבוּם
  choice: फिर उन्हें ... वापस रख देते थे
  rationale: हिफ़ील रूप ‘लौटा देना’ व्यक्त करता है; किसी कक्ष में रखी वस्तुओं के लिए यह हिन्दी प्रयोग स्वाभाविक है।
- source_word: תָּא הָרָצִים
  choice: अंगरक्षकों के कक्ष
  rationale: תָּא का अर्थ कमरा या कक्ष है; यह चयन मूल संबंध को बनाए रखते हुए गरिमापूर्ण आधुनिक हिन्दी देता है।
