  text: וַ/יהוָ֞ה אָמַ֣ר אֶל אֲחִיָּ֗הוּ הִנֵּ֣ה אֵ֣שֶׁת יָרָבְעָ֡ם בָּאָ֣ה לִ/דְרֹשׁ֩ דָּבָ֨ר מֵ/עִמְּ/ךָ֤ אֶל בְּנָ/הּ֙ כִּֽי חֹלֶ֣ה ה֔וּא כָּ/זֹ֥ה וְ/כָ/זֶ֖ה תְּדַבֵּ֣ר אֵלֶ֑י/הָ וִ/יהִ֣י כְ/בֹאָ֔/הּ וְ/הִ֖יא מִתְנַכֵּרָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/014/005.yaml
  text: And Yahweh said to Ahijah[a], “Look, Jeroboam’s wife is coming to ask you about her son, because he is sick. You shall speak to her like this and like that. And when she comes[b], she will be disguising herself.”
translation:
  language: hi
  text: तब याहवे ने अहिय्याह से कहा, “देख, यारोबाम की पत्नी अपने बेटे के विषय में तुझसे पूछने आ रही है, क्योंकि वह बीमार है। तू उससे ऐसा-ऐसा कहना।[a] जब वह आएगी, तब वह भेष बदलकर आएगी।[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से ‘ऐसा और ऐसा’; यह एक इब्रानी मुहावरा है, जो ऐसे निश्चित संदेश की ओर संकेत करता है जिसकी बातें यहाँ अभी नहीं बताई गई हैं।
    reason: lexical_alternative
  - marker: b
    text: या ‘वह अपने को दूसरी स्त्री के रूप में प्रस्तुत कर रही होगी।’ इब्रानी क्रिया का भाव अपने को पहचान में न आने देना या भेष बदलना है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיהוָה
  choice: तब याहवे ने
  rationale: कथात्मक וַ को स्वाभाविक हिन्दी में ‘तब’ से व्यक्त किया गया है और परमेश्वर के व्यक्तिगत नाम יהוה को ‘याहवे’ लिप्यंतरित किया गया है।
- source_word: הִנֵּה
  choice: देख
  rationale: यह ध्यान आकर्षित करने वाला कथन है; ‘देख’ आधुनिक और सहज है तथा मूल की तात्कालिकता बनाए रखता है।
- source_word: לִדְרֹשׁ דָּבָר מֵעִמְּךָ אֶל בְּנָהּ
  choice: अपने बेटे के विषय में तुझसे पूछने
  rationale: यहाँ דרשׁ prophetic consultation में जानकारी या वचन जानने के लिए पूछने का भाव रखता है। यह अनुवाद उस भाव को सहज हिन्दी में व्यक्त करता है, बिना ‘भविष्यवाणी’ को स्पष्ट रूप से जोड़ने के।
- source_word: כִּי חֹלֶה הוּא
  choice: क्योंकि वह बीमार है
  rationale: कारणसूचक כִּי और विधेय חֹלֶה का सीधा, स्वाभाविक अनुवाद। संदर्भ से सर्वनाम पुत्र को सूचित करता है।
- source_word: כָּזֹה וְכָזֶה
  choice: ऐसा-ऐसा
  rationale: यह इब्रानी मुहावरा निश्चित किन्तु अभी न बताए गए संदेश की ओर संकेत करता है। ‘ऐसा-ऐसा’ हिन्दी में उसका संक्षिप्त और स्वाभाविक समकक्ष है।
- source_word: תְּדַבֵּר אֵלֶיהָ
  choice: तू उससे ... कहना
  rationale: दूसरे पुरुष एकवचन निर्देश को निकट संबोधन ‘तू’ और स्वाभाविक हिन्दी क्रिया ‘कहना’ से व्यक्त किया गया है।
- source_word: וִיהִי כְבֹאָהּ
  choice: जब वह आएगी, तब
  rationale: इब्रानी कथन-सूत्र को अनावश्यक शाब्दिक बोझ के बिना उसके कालगत अर्थ के अनुसार प्रस्तुत किया गया है।
- source_word: וְהִיא מִתְנַכֵּרָה
  choice: वह भेष बदले हुए होगी
  rationale: Hitpael रूप अपने को पहचान में न आने योग्य बनाने का भाव देता है। यह वाक्य उसके आगमन के समय की स्थिति व्यक्त करता है।
theological_decisions:
- issue: परमेश्वर के नाम יהוה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में आए व्यक्तिगत नाम को शीर्षक से बदलने के बजाय उसके प्रचलित विद्वत्तापूर्ण उच्चारण के निकट देवनागरी में लिप्यंतरित किया गया है।
- issue: לִדְרֹשׁ דָּבָר में भविष्यद्वक्ता से परामर्श का भाव
  choice: तुझसे पूछने
  alternative: तुझसे वचन जानने; तुझसे पूछताछ करने
  rationale: मूल में दैवी संदेश जानने का प्रसंग निहित हो सकता है, पर वाक्य उसे विस्तार से परिभाषित नहीं करता। इसलिए अनुवाद ने व्यापक अर्थ रखा और व्याख्यात्मक शब्द नहीं जोड़े।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और कथात्मक रखी गई है। अहिय्याह से परमेश्वर के सीधे एकवचन संबोधन के लिए ‘तू’ मूल के व्याकरणिक भेद को स्पष्ट करता है; इसे अनादर के अर्थ में नहीं लिया जाना चाहिए। ‘ऐसा-ऐसा’ मूल मुहावरे की अनिर्दिष्टता को बनाए रखता है।
