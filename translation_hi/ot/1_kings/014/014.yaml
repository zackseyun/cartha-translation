source:
  edition: WLC
  text: וְ/הֵקִים֩ יְהוָ֨ה ל֥/וֹ מֶ֨לֶךְ֙ עַל יִשְׂרָאֵ֔ל אֲשֶׁ֥ר יַכְרִ֛ית אֶת בֵּ֥ית יָרָבְעָ֖ם זֶ֣ה הַ/יּ֑וֹם וּ/מֶ֖ה גַּם עָֽתָּה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/014/014.yaml
  text: And Yahweh will raise up for himself a king over Israel who will cut off the house of Jeroboam this day[a]. But what? Even now.
translation:
  language: hi
  text: और यहोवा अपने लिए इस्राएल पर एक राजा खड़ा करेगा, जो यारोबाम के घराने का इस दिन अंत कर देगा। पर क्या? अभी भी![a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी पाठ का अंत आकस्मिक और कठिन है; शाब्दिक रूप से, “और/पर क्या? अभी भी!” कुछ इसे न्याय की तात्कालिकता पर बल देने वाला विस्मय मानते हैं, जैसे “और क्या? अभी ही!” या “और क्या बाकी है? अब भी।”
    reason: alternative_reading
lexical_decisions:
- source_word: וְהֵקִים
  choice: खड़ा करेगा
  rationale: हिफ़ील रूप का अर्थ किसी व्यक्ति को भूमिका में उठाना या सामने लाना है। ‘खड़ा करेगा’ परमेश्वर द्वारा राजा को उठाए जाने की इब्रानी अभिव्यक्ति को स्वाभाविक हिन्दी में रखता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: चतुर्वर्णीय ईश्वरीय नाम को किसी उपाधि से बदलने के बजाय हिन्दी में प्रचलित नामरूप ‘यहोवा’ से व्यक्त किया गया है।
- source_word: לּוֹ
  choice: अपने लिए
  rationale: सर्वनाम का संकेत सबसे स्वाभाविक रूप से कर्ता यहोवा की ओर लौटता है।
- source_word: מֶלֶךְ עַל יִשְׂרָאֵל
  choice: इस्राएल पर एक राजा
  rationale: עַל यहाँ राजकीय अधिकार को दर्शाता है; ‘पर’ शासन के संबंध को बनाए रखता है।
- source_word: אֲשֶׁר יַכְרִית
  choice: जो … अंत कर देगा
  rationale: כרת के हिफ़ील का अर्थ काट डालना, मिटा देना या समाप्त कर देना हो सकता है। वंश के संदर्भ में ‘अंत कर देगा’ स्पष्ट और स्वाभाविक है, जबकि निर्णायक न्याय का भाव बनाए रखता है।
- source_word: בֵּית יָרָבְעָם
  choice: यारोबाम के घराने
  rationale: ‘घराना’ परिवार के साथ राजवंशीय अर्थ भी व्यक्त करता है और आधुनिक हिन्दी में ‘घर’ से अधिक स्पष्ट है।
- source_word: זֶה הַיּוֹם
  choice: इस दिन
  rationale: यह शाब्दिक संरचना काल-संबंधी जोर को बनाए रखती है और कठिन अंतिम वाक्यांश से उसका संबंध अनावश्यक रूप से निश्चित नहीं करती।
- source_word: וּמֶה גַּם עָתָּה
  choice: पर क्या? अभी भी।
  rationale: इब्रानी समापन आकस्मिक, संक्षिप्त और कठिन है। यह अनुवाद उसकी टूटी हुई प्रश्नात्मक-बलाघाती संरचना को अर्थ-विस्तार के बिना सुरक्षित रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: प्रभु
  rationale: मूल पाठ में व्यक्तिगत ईश्वरीय नाम है; इसलिए उपाधि ‘प्रभु’ से प्रतिस्थापित न करके हिन्दी में प्रचलित नामरूप रखा गया है।
- issue: कठिन अंतिम पदबंध וּמֶה גַּם עָתָּה
  choice: इब्रानी की आकस्मिकता को ‘पर क्या? अभी भी।’ के रूप में बनाए रखना
  alternative: न्याय अभी से आरम्भ हो चुका है।
  rationale: वाक्य रचनात्मक रूप से अपूर्ण और अर्थ की दृष्टि से अनिश्चित है। व्याख्यात्मक विकल्प अर्थ को आवश्यकता से अधिक निश्चित कर देता, इसलिए मूल तनाव सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। राजवंशीय संदर्भ के लिए ‘घराना’ और राजा को सामने लाने के लिए ‘खड़ा करेगा’ चुना गया है। अंतिम खंड की असामान्यता जानबूझकर नहीं सँवारी गई है।
