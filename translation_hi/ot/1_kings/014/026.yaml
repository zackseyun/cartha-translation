source:
  edition: WLC
  text: וַ/יִּקַּ֞ח אֶת אֹצְר֣וֹת בֵּית יְהוָ֗ה וְ/אֶת אֽוֹצְרוֹת֙ בֵּ֣ית הַ/מֶּ֔לֶךְ וְ/אֶת הַ/כֹּ֖ל לָקָ֑ח וַ/יִּקַּח֙ אֶת כָּל מָגִנֵּ֣י הַ/זָּהָ֔ב אֲשֶׁ֥ר עָשָׂ֖ה שְׁלֹמֹֽה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/014/026.yaml
  text: He took the treasures of the house of Yahweh and the treasures of the king’s house; he took everything[a]. He also took all the gold shields that Solomon had made.
translation:
  language: hi
  text: वह याहवे के भवन के खज़ाने और राजमहल के खज़ाने ले गया—वह सब कुछ ले गया। वह सोने की वे सभी ढालें भी ले गया जिन्हें सुलैमान ने बनाई थीं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקַּח / לָקָח
  choice: ले गया
  rationale: मूल क्रिया का सामान्य अर्थ ‘लेना’ है; लूट के इस प्रसंग में हिन्दी का ‘ले गया’ स्वाभाविक है और ‘लूट लिया’ जैसी अतिरिक्त तीव्रता नहीं जोड़ता।
- source_word: אֹצְרוֹת
  choice: खज़ाने
  rationale: यहाँ भवनों या भंडार-कक्षों के बजाय उनमें रखी बहुमूल्य वस्तुएँ अभिप्रेत हैं।
- source_word: בֵּית יְהוָה
  choice: यहोवा का भवन
  rationale: इब्रानी के शाब्दिक रूप ‘यहोवा का घर/भवन’ को सुरक्षित रखता है; प्रसंग में यह मंदिर है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: परमेश्वर के व्यक्तिगत नाम יהוה को हिन्दी में प्रचलित लिप्यंतरण ‘यहोवा’ से व्यक्त किया गया है, किसी उपाधि से प्रतिस्थापित नहीं किया गया।
- source_word: בֵּית הַמֶּלֶךְ
  choice: राजमहल
  rationale: शाब्दिक ‘राजा का भवन’ का प्रसंगगत और आधुनिक हिन्दी में स्वाभाविक अर्थ ‘राजमहल’ है।
- source_word: וְאֶת הַכֹּל לָקָח
  choice: वह सब कुछ ले गया
  rationale: यह सारांशात्मक वाक्यांश लूट की संपूर्णता पर मूल का बल बनाए रखता है।
- source_word: מָגִנֵּי הַזָּהָב
  choice: सोने की ढालें
  rationale: यह रचना-संबंधी इब्रानी पदबंध का स्पष्ट और स्वाभाविक हिन्दी रूप है।
- source_word: אֲשֶׁר עָשָׂה שְׁלֹמֹה
  choice: जिन्हें सुलैमान ने बनवाया था
  rationale: राजा के विषय में हिन्दी का कारक रूप ‘बनवाया’ स्वाभाविक है और यह बताता है कि ढालें उसके आदेश या संरक्षण में बनी थीं; ‘था’ पूर्वकालिकता स्पष्ट करता है।
- source_word: וַיִּקַּח ... וַיִּקַּח
  choice: ले गया ... भी ले गया
  rationale: दूसरी पुनरावृत्ति में ‘भी’ जोड़कर मूल की योगात्मक संरचना और दोहराया हुआ बल स्वाभाविक हिन्दी में रखा गया है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल में व्यक्तिगत ईश्वरीय नाम है। हिन्दी पाठकों में पहचाने जाने वाले लिप्यंतरण ‘यहोवा’ का प्रयोग करके इसे ‘प्रभु’ जैसी उपाधि से नहीं बदला गया; ‘याहवे’ वैकल्पिक शैक्षिक लिप्यंतरण है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सहज मानक हिन्दी। ‘यहोवा का भवन’ मूल अभिव्यक्ति को सुरक्षित रखता है, जबकि ‘राजमहल’ अनावश्यक अस्पष्टता से बचाता है। मूल में कोई ऐसी पाठगत या अर्थगत कठिनाई नहीं है जिसके लिए पाद-टिप्पणी आवश्यक हो।
