base_translation:
  language: en
  yaml_path: translation/ot/1_kings/014/006.yaml
  text: And when Ahijah heard the sound of her feet as she came in at the doorway[a], he said, “Come in, wife of Jeroboam[b]. Why are you disguising yourself? For I am sent to you with a hard message.”
translation:
  language: hi
  text: जब अहिय्याह ने द्वार पर आते समय उसके पैरों की आहट सुनी, तो उसने कहा, “अन्दर आओ, यारोबाम की पत्नी! तुम भेष क्यों बनाए हुए हो?[a] मुझे तुम्हारे पास एक कठोर सन्देश के साथ भेजा गया है।[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तुम अपने को अपरिचित क्यों बना रही हो?”
    reason: מִתְנַכֵּרָה के उस अर्थ को दर्शाता है जिसमें व्यक्ति अपनी पहचान छिपाता या किसी दूसरे के समान प्रस्तुत होता है।
  - marker: b
    text: शाब्दिक रूप से, “मुझे तुम्हारे पास कठोर भेजा गया है”; इब्रानी में संज्ञा नहीं दी गई है। आशय कठोर सन्देश, वचन, या दुःखद समाचार हो सकता है।
    reason: קָשָׁה के साथ अध्याहृत संज्ञा और मूल पाठ की खुली अभिव्यक्ति स्पष्ट करना।
lexical_decisions:
- source_word: קוֹל רַגְלֶיהָ
  choice: उस स्त्री के पैरों की आहट
  rationale: शाब्दिक अर्थ ‘उसके पैरों की आवाज़’ है; प्रसंग में ‘पैरों की आहट’ स्वाभाविक हिन्दी है और इब्रानी बिम्ब को बनाए रखता है।
- source_word: בָּאָה בַפֶּתַח
  choice: द्वार में प्रवेश करती हुई
  rationale: פֶּתַח प्रवेश-द्वार या खुली चौखट को सूचित करता है; यह अनुवाद चल रही क्रिया और स्थान, दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: בֹּאִי
  choice: अन्दर आओ
  rationale: यह स्त्रीलिंग एकवचन आज्ञार्थक है। घरेलू प्रवेश के प्रसंग में ‘अन्दर आओ’ आधुनिक हिन्दी में ‘प्रवेश करो’ से अधिक सहज है।
- source_word: אֵשֶׁת יָרָבְעָם
  choice: यारोबाम की पत्नी
  rationale: इब्रानी संबंध-संरचना का स्पष्ट और स्वाभाविक हिन्दी रूप।
- source_word: לָמָּה זֶּה אַתְּ מִתְנַכֵּרָה
  choice: तुम अपना भेष क्यों बदल रही हो?
  rationale: התפעל रूप यहाँ स्वयं को पहचान में न आने योग्य बनाने या किसी और के रूप में प्रस्तुत करने को दर्शाता है; पूर्व प्रसंग के अनुसार ‘भेष बदलना’ सर्वाधिक स्वाभाविक है।
- source_word: שָׁלוּחַ אֵלַיִךְ
  choice: मुझे तुम्हारे पास ... भेजा गया है
  rationale: निष्क्रिय कृदन्त भेजे जाने से उत्पन्न वर्तमान स्थिति को दर्शाता है। हिन्दी का पूर्ण निष्क्रिय रूप इस भाव को सहजता से व्यक्त करता है और भेजने वाले को अनावश्यक रूप से स्पष्ट नहीं करता।
- source_word: קָשָׁה
  choice: एक कठोर सन्देश
  rationale: इब्रानी में केवल स्त्रीलिंग विशेषण ‘कठोर’ है और संज्ञा अध्याहृत है। हिन्दी में वाक्य पूरा करने के लिए ‘सन्देश’ जोड़ा गया है, जबकि पादटिप्पणी मूल की संक्षिप्तता और अस्पष्टता बताती है।
theological_decisions:
- issue: קָשָׁה के बाद अध्याहृत संज्ञा
  choice: मुख्य पाठ में ‘एक कठोर सन्देश’
  alternative: ‘एक अप्रिय समाचार’ या अधिक शाब्दिक ‘एक कठोर बात’
  rationale: भविष्यद्वक्ताई प्रसंग में किसी गंभीर वचन या समाचार का आशय है, पर इब्रानी संज्ञा को स्पष्ट नहीं करता। ‘सन्देश’ न्यूनतम और प्रसंगानुकूल पूर्ति है; पादटिप्पणी मूल की खुली संरचना सुरक्षित रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज किंतु गरिमापूर्ण कथात्मक रूप अपनाया गया है। ‘पैरों की आहट’ और ‘अन्दर आओ’ सामान्य पाठक के लिए स्वाभाविक हैं। पादटिप्पणी-चिह्न उन्हीं पदों के बाद रखे गए हैं जिनकी वैकल्पिक व्याख्या वे देते हैं।
