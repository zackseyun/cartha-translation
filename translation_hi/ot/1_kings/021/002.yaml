translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, सहज किंतु गरिमापूर्ण रखी गई है। अहाब और नाबोत के बीच प्राचीन एकवचन संबोधन के अनुरूप ‘तू/तुझे/तेरी’ रूप प्रयुक्त हुए हैं। ‘दाख की बारी’ और ‘चाँदी’ स्रोत-पाठ की कृषि तथा विनिमय-संबंधी ठोस शब्दावली को बनाए रखते हैं।
