source:
  edition: WLC
  text: וַ/יְדַבֵּ֣ר אַחְאָ֣ב אֶל נָב֣וֹת לֵ/אמֹר֩ תְּנָ/ה לִּ֨/י אֶֽת כַּרְמְ/ךָ֜ וִֽ/יהִי לִ֣/י לְ/גַן יָרָ֗ק כִּ֣י ה֤וּא קָרוֹב֙ אֵ֣צֶל בֵּיתִ֔/י וְ/אֶתְּנָ֤ה לְ/ךָ֙ תַּחְתָּ֔י/ו כֶּ֖רֶם ט֣וֹב מִמֶּ֑/נּוּ אִ֚ם ט֣וֹב בְּ/עֵינֶ֔י/ךָ אֶתְּנָה לְ/ךָ֥ כֶ֖סֶף מְחִ֥יר זֶֽה־׀׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/021/002.yaml
  text: And Ahab spoke to Naboth[a], saying, “Give me your vineyard, so that it may become a vegetable garden for me, because it is near my house; and in its place I will give you a better vineyard than it. Or, if it seems good in your eyes, I will give you its price in silver.”
translation:
  language: hi
  text: अहाब ने नाबोत से कहा, “अपनी दाख की बारी मुझे दे, ताकि मैं उसे सब्ज़ियों की बारी बना लूँ, क्योंकि वह मेरे घर के पास है। उसके बदले मैं तुझे उससे अच्छी दाख की बारी दूँगा; या यदि यह तेरी दृष्टि में अच्छा हो[a], तो मैं तुझे उसका मूल्य चाँदी में दूँगा।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक अर्थ: “यदि यह तेरी आँखों में अच्छा हो”; यह एक हिब्रू मुहावरा है, जिसका अर्थ है “यदि तुझे यह अच्छा लगे” या “यदि तू इसे स्वीकार करे।”'
    reason: हिब्रू मुहावरे का शाब्दिक रूप मुख्य पाठ में रखा गया है; फुटनोट उसका सामान्य आशय स्पष्ट करता है।
lexical_decisions:
- source_word: וַיְדַבֵּר אַחְאָב אֶל נָבוֹת לֵאמֹר
  choice: अहाब ने नाबोत से कहा
  rationale: דבר אל का अर्थ किसी को संबोधित करके बोलना है। हिन्दी कथा-शैली में ‘से कहा’ स्वाभाविक रूप से यही अर्थ व्यक्त करता है; לֵאמֹר को अलग से दोहराना आवश्यक नहीं।
- source_word: תְּנָה לִּי אֶת כַּרְמְךָ
  choice: अपनी दाख की बारी मुझे दे
  rationale: נתן का आज्ञार्थक रूप अनुरोध की सीधी प्रकृति बनाए रखता है। כֶּרֶם के लिए ‘दाख की बारी’ प्रचलित और स्पष्ट हिन्दी बाइबलीय पद है।
- source_word: וִיהִי לִי לְגַן יָרָק
  choice: ताकि मैं उसे सब्ज़ियों की बारी बना लूँ
  rationale: यहाँ היה का रूप अभिप्रेत परिणाम बताता है। ‘सब्ज़ियों की बारी’ גַן יָרָק का स्वाभाविक आधुनिक हिन्दी रूप है और अहाब का उद्देश्य स्पष्ट करता है।
- source_word: כִּי הוּא קָרוֹב אֵצֶל בֵּיתִי
  choice: क्योंकि वह मेरे घर के पास है
  rationale: כִּי कारण प्रस्तुत करता है और קָרוֹב אֵצֶל निकट स्थान को दर्शाता है; अनुवाद सरलता से दोनों अर्थ सुरक्षित रखता है।
- source_word: וְאֶתְּנָה לְךָ תַּחְתָּיו
  choice: उसके बदले मैं तुझे ... दूँगा
  rationale: תַּחְתָּיו यहाँ प्रतिस्थापन अथवा विनिमय का भाव रखता है, जिसे ‘उसके बदले’ ठीक और सहज रूप से व्यक्त करता है।
- source_word: כֶּרֶם טוֹב מִמֶּנּוּ
  choice: उससे अच्छी दाख की बारी
  rationale: טוֹב के साथ מן तुलनात्मक अर्थ देता है; ‘उससे अच्छी’ उस तुलना को सीधे बनाए रखता है।
- source_word: אִם טוֹב בְּעֵינֶיךָ
  choice: यदि यह तेरी दृष्टि में अच्छा हो
  rationale: हिब्रू मुहावरे की दृश्य-आधारित भाषा को बनाए रखा गया है, जबकि उसका आशय स्वीकृति या पसंद है; अर्थ को फुटनोट में स्पष्ट किया गया है।
- source_word: אֶתְּנָה לְךָ כֶסֶף מְחִיר זֶה
  choice: मैं तुझे उसका मूल्य चाँदी में दूँगा
  rationale: כֶּסֶף का ठोस अर्थ ‘चाँदी’ है और מְחִיר मूल्य को दर्शाता है। अनुवाद भुगतान के माध्यम और संपत्ति के मूल्य—दोनों को सुरक्षित रखता है।
