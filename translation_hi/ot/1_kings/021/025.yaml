id: 1KI.21.25
reference: 1 Kings 21:25
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: רַ֚ק לֹֽא הָיָ֣ה כְ/אַחְאָ֔ב אֲשֶׁ֣ר הִתְמַכֵּ֔ר לַ/עֲשׂ֥וֹת הָ/רַ֖ע בְּ/עֵינֵ֣י יְהוָ֑ה אֲשֶׁר הֵסַ֥תָּה אֹת֖/וֹ אִיזֶ֥בֶל אִשְׁתּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/021/025.yaml
  text: Surely there was no one like Ahab, who sold himself to do what was evil in the sight of Yahweh, because Jezebel his wife incited him.
translation:
  language: hi
  text: निश्चय ही अहाब के समान कोई नहीं हुआ, जिसने यहोवा की दृष्टि में बुरा करने के लिए अपने आपको बेच दिया था; उसकी पत्नी ईज़ेबेल ने उसे उकसाया था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: רַק
  choice: निश्चय ही
  rationale: यहाँ यह अव्यय कथन पर जोर देता है; ‘निश्चय ही’ उस बल को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: לֹא הָיָה כְאַחְאָב
  choice: अहाब के समान कोई नहीं हुआ
  rationale: यह इब्रानी मुहावरा अहाब की बुराई में अद्वितीयता व्यक्त करता है।
- source_word: הִתְמַכֵּר
  choice: अपने आपको बेच दिया था
  rationale: मूल में प्रयुक्त ‘बेचने’ का सजीव रूपक सुरक्षित रखा गया है, जो बुराई के प्रति स्वेच्छा से समर्पण दिखाता है।
- source_word: לַעֲשׂוֹת הָרַע
  choice: बुरा करने के लिए
  rationale: यह मूल अर्थ को स्पष्ट और स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: בְּעֵינֵי יְהוָה
  choice: यहोवा की दृष्टि में
  rationale: इब्रानी मूल्यांकनात्मक मुहावरे के रूपक और अर्थ दोनों को बनाए रखता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिन्दी में प्रचलित व्यक्तिगत नाम का रूप लेकर चतुरक्षरीय ईश-नाम को उपाधि से प्रतिस्थापित नहीं किया गया।
- source_word: הֵסַתָּה
  choice: उकसाया था
  rationale: हिफ़ील रूप किसी को अनुचित कार्य की ओर प्रेरित या भड़काने का अर्थ देता है; ‘उकसाया’ प्रसंगानुकूल और सामान्य हिन्दी है।
- source_word: אֲשֶׁר הֵסַתָּה אֹתוֹ אִיזֶבֶל אִשְׁתּוֹ
  choice: उसकी पत्नी ईज़ेबेल ने उसे उकसाया था
  rationale: संबंधवाचक खंड को स्पष्ट हिन्दी वाक्य-खंड में रखा गया है, बिना मूल में निहित संबंध को अनावश्यक रूप से केवल कारणसूचक बना देने के।
theological_decisions:
- issue: ईश-नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: व्यक्तिगत वाचा-नाम को ‘प्रभु’ जैसी उपाधि से बदलने के बजाय हिन्दी पाठकों में व्यापक रूप से पहचाने जाने वाले नाम-रूप ‘यहोवा’ से व्यक्त किया गया है।
- issue: अहाब की जिम्मेदारी और ईज़ेबेल के उकसावे का संबंध
  choice: अहाब ने स्वयं को बेच दिया; ईज़ेबेल ने उसे उकसाया
  alternative: ईज़ेबेल के उकसाने के कारण अहाब ने स्वयं को बेच दिया
  rationale: मूल पाठ अहाब की सक्रिय नैतिक जिम्मेदारी और पत्नी के उकसावे दोनों को साथ रखता है। स्पष्ट कारणसूचक ‘क्योंकि’ जोड़ने से संबंध आवश्यकता से अधिक निश्चित हो सकता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। ‘अपने आपको बेच दिया’ मूल के तीखे रूपक को सुरक्षित रखता है। अर्धविराम दो निकट जुड़े कथनों को स्पष्ट करता है।
