base_translation:
  language: en
  yaml_path: translation/ot/1_kings/021/028.yaml
  text: And the word of Yahweh came to Elijah the Tishbite[a], saying,
translation:
  language: hi
  text: 'तब यहोवा का वचन तिशबी एलिय्याह के पास पहुँचा:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: तब ... पहुँचा
  rationale: यहाँ यह रूप कथा को आगे बढ़ाते हुए प्रचलित भविष्यवाणी-सूत्र का आरम्भ करता है; हिंदी में ‘तब ... पहुँचा’ स्वाभाविक है।
- source_word: דְּבַר יְהוָה
  choice: यहोवा का वचन
  rationale: ‘वचन’ मूल דָּבָר का सीधा अर्थ और भविष्यवाणी-साहित्य की पारस्परिक गूँज बनाए रखता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिंदी बाइबलीय परंपरा में प्रचलित रूप से परमेश्वर के व्यक्तिगत नाम को शीर्षक से बदलने के बजाय नाम के रूप में प्रस्तुत करता है।
- source_word: אֶל
  choice: के पास
  rationale: प्रकाशना के प्राप्तकर्ता की ओर दिशा को स्वाभाविक आधुनिक हिंदी में व्यक्त करता है।
- source_word: אֵלִיָּהוּ
  choice: एलिय्याह
  rationale: हिब्रू व्यक्तिगत नाम का हिंदी में स्थापित बाइबलीय रूप।
- source_word: הַתִּשְׁבִּי
  choice: तिशबी
  rationale: मूल के जातिवाचक/स्थान-संबंधी विशेषण को संक्षेप में बनाए रखता है और एलिय्याह की पहचान बताता है।
- source_word: לֵאמֹר
  choice: (अगले कथन को आरम्भ करने वाला कोलन)
  rationale: यह कृदन्त अगले पद में आने वाली प्रत्यक्ष वाणी का परिचय देता है; हिंदी में कोलन इस कार्य को स्वाभाविक रूप से निभाता है और अनावश्यक ‘यह कहते हुए’ से बचाता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: मूल में व्यक्तिगत चार-अक्षरीय नाम है। ‘यहोवा’ आधुनिक हिंदी के सामान्य बाइबलीय पाठकों में पहचाना जाने वाला नामरूप है और इसे केवल उपाधि ‘प्रभु’ से प्रतिस्थापित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, संक्षिप्त और गरिमापूर्ण रखी गई है। मानक भविष्यवाणी-सूत्र को शब्दशः अस्वाभाविक बनाने के बजाय हिंदी वाक्य-विन्यास में प्रस्तुत किया गया है; कोलन अगले पद की ईश्वरीय वाणी से संबंध बनाए रखता है।
