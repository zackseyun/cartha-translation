base_translation:
  language: en
  yaml_path: translation/ot/1_kings/021/027.yaml
  text: And it happened[a], when Ahab heard these words, that he tore his clothes and put sackcloth on his flesh and fasted and lay in sackcloth and went about softly.
translation:
  language: hi
  text: जब अहाब ने ये वचन सुने, तब उसने अपने वस्त्र फाड़े, अपने शरीर पर टाट डाल लिया, उपवास किया, टाट में लेटा और धीमी चाल से चलता रहा।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “धीरे चलता रहा,” “शांत ढंग से चलता रहा,” अथवा “विनीत होकर चलता रहा।” हिब्रू शब्द धीमी, शांत या दबी हुई चाल का संकेत देता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כִשְׁמֹעַ
  choice: जब ... सुने, तब
  rationale: हिब्रू कथात्मक सूत्र और कालवाचक रचना का स्वाभाविक आधुनिक हिन्दी रूप; अलग से ‘ऐसा हुआ’ जोड़ना हिन्दी में अनावश्यक रूप से भारी होता।
- source_word: הַדְּבָרִים הָאֵלֶּה
  choice: ये वचन
  rationale: संदर्भ में एलिय्याह द्वारा सुनाया गया न्याय-संदेश है; ‘वचन’ कथित बातों का स्वरूप बनाए रखता है।
- source_word: וַיִּקְרַע בְּגָדָיו
  choice: उसने अपने वस्त्र फाड़े
  rationale: शोक और दीनता की प्रचलित शारीरिक अभिव्यक्ति को सीधे और गरिमापूर्ण ढंग से व्यक्त करता है।
- source_word: וַיָּשֶׂם שַׂק עַל בְּשָׂרוֹ
  choice: अपने शरीर पर टाट ओढ़ा
  rationale: שַׂק के लिए बाइबलीय हिन्दी में स्वाभाविक ‘टाट’ और בָּשָׂר के लिए स्पष्ट ‘शरीर’; ‘ओढ़ा’ पहनने/शरीर पर रखने की क्रिया को सहज रूप देता है, बिना यह निश्चित किए कि वह सीधे त्वचा पर था।
- source_word: וַיָּצֹם
  choice: उपवास किया
  rationale: क्रिया צום का सीधा और प्रचलित हिन्दी रूप।
- source_word: וַיִּשְׁכַּב בַּשָּׂק
  choice: टाट में लेटा
  rationale: लेटने की अवस्था को रखता है, पर सो जाने का अतिरिक्त अर्थ नहीं जोड़ता।
- source_word: וַיְהַלֵּךְ אַט
  choice: दबे पाँव चलने लगा
  rationale: אַט में निहित धीमी, शांत और दबी हुई चाल को मुहावरेदार हिन्दी में व्यक्त करता है; भीतर की मनोदशा को निश्चित रूप से ‘उदास’ या ‘पश्चातापी’ नहीं ठहराता।
theological_decisions:
- issue: अहाब की प्रतिक्रिया का स्वरूप
  choice: केवल उसके प्रकट शोक और दीनता के कार्यों का वर्णन
  alternative: इसे सच्चा पश्चाताप अथवा केवल दिखावटी शोक घोषित करना
  rationale: हिब्रू पद उसके कार्यों को बताता है, लेकिन उसकी आंतरिक निष्ठा पर स्वयं निर्णय नहीं देता; अनुवाद इस धार्मिक तनाव को खुला रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी, सरल किंतु गरिमापूर्ण बाइबलीय शैली। ‘टाट’ और ‘उपवास’ जैसे परिचित धार्मिक-सांस्कृतिक शब्द रखे गए हैं।
