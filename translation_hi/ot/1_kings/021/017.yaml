base_translation:
  language: en
  yaml_path: translation/ot/1_kings/021/017.yaml
  text: Then the word of Yahweh came to Elijah the Tishbite[a], saying,
translation:
  language: hi
  text: 'तब यहोवा का वचन तिशबी एलिय्याह के पास आया:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: तब ... आया
  rationale: वाव-क्रमिक कथानक में अगली घटना को आगे बढ़ाता है; आधुनिक हिन्दी में ‘तब’ इस क्रम को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: דְּבַר יְהוָה
  choice: यहोवा का वचन
  rationale: यह मानक भविष्यवाणी-सूत्र है; ‘वचन’ प्रकाशन के पारंपरिक और धर्मवैचारिक भार को बनाए रखता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिन्दी में प्रचलित व्यक्तिगत नाम-रूप ‘यहोवा’ चतुरक्षरीय ईश-नाम को उपाधि से बदलने के बजाय नाम के रूप में प्रस्तुत करता है।
- source_word: אֶל
  choice: के पास
  rationale: वचन के किसी व्यक्ति तक पहुँचने के हिन्दी मुहावरे में ‘के पास आया’ स्वाभाविक है।
- source_word: אֵלִיָּהוּ
  choice: एलिय्याह
  rationale: इब्रानी व्यक्तिगत नाम का हिन्दी बाइबलीय परंपरा में परिचित लिप्यंतरण।
- source_word: הַתִּשְׁבִּי
  choice: तिशबी
  rationale: संक्षिप्त इब्रानी निवासी-सूचक पद को बिना अनावश्यक विस्तार के सुरक्षित रखता है।
- source_word: לֵאמֹר
  choice: ':'
  rationale: यह क्रियारूप अगले पद में आने वाली वाणी का परिचय देता है; आधुनिक हिन्दी में कोलन वही कार्य अधिक स्वाभाविक रूप से करता है।
theological_decisions:
- issue: ईश-नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल में व्यक्तिगत चतुरक्षरीय नाम है। हिन्दी के सामान्य बाइबलीय प्रयोग में ‘यहोवा’ अधिक परिचित है और इसे ‘प्रभु’ जैसी उपाधि से प्रतिस्थापित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, संक्षिप्त और गरिमापूर्ण रखी गई है। इब्रानी कथानक-सूत्र का शाब्दिक ‘और ऐसा हुआ’ न देकर स्वाभाविक हिन्दी ‘तब’ अपनाया गया है; לֵאמֹר को अगले प्रत्यक्ष कथन की भूमिका बताने वाले कोलन से व्यक्त किया गया है।
