- source_word: אֶת נָבוֹת
  choice: नाबोत को
  rationale: אֶת निश्चित प्रत्यक्ष कर्म को चिह्नित करता है; नाम का हिन्दी लिप्यंतरण ‘नाबोत’ रखा गया है।
- source_word: בְּרֹאשׁ
  choice: सबसे प्रमुख स्थान पर
  rationale: शाब्दिक अर्थ ‘सिर/शीर्ष पर’ है; इस सार्वजनिक सभा के प्रसंग में यह लोगों के सामने या उनके बीच अग्रस्थान को सूचित करता है। मुख्य पाठ में स्वाभाविक हिन्दी रखते हुए विकल्प पाद-टिप्पणी में दिए गए हैं।
- source_word: הָעָם
  choice: लोगों के बीच
  rationale: עם यहाँ एकत्र जनसमुदाय को दर्शाता है; ‘लोगों’ मूल अर्थ को बनाए रखता है, जबकि विभक्ति-संबंध בְּרֹאשׁ के साथ मिलकर व्यक्त किया गया है।
