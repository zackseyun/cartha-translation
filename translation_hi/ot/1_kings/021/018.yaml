  text: ק֣וּם רֵ֗ד לִ/קְרַ֛את אַחְאָ֥ב מֶֽלֶךְ יִשְׂרָאֵ֖ל אֲשֶׁ֣ר בְּ/שֹׁמְר֑וֹן הִנֵּה֙ בְּ/כֶ֣רֶם נָב֔וֹת אֲשֶׁר יָ֥רַד שָׁ֖ם לְ/רִשְׁתּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/021/018.yaml
  text: Arise[a], go down to meet Ahab king of Israel, who is in Samaria. Look, he is in the vineyard of Naboth, where he has gone down to take possession of it.
translation:
  language: hi
  text: “उठ, इस्राएल के राजा अहाब से मिलने नीचे जा, जो सामरिया में है। देख, वह नाबोत की दाख की बारी में है, जहाँ वह उसे अपने अधिकार में लेने के लिए नीचे गया है[a]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसका स्वामी बनने के लिए।” इब्रानी क्रिया प्रसंग के अनुसार किसी वस्तु को अपने अधिकार में लेने, उसका स्वामी होने, या विरासत में पाने का अर्थ दे सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ק֣וּם
  choice: उठ
  rationale: एकवचन आज्ञार्थक रूप है। ‘उठ’ संक्षिप्त, स्वाभाविक और भविष्यद्वक्ता को दिए गए तत्पर आदेश का भाव बनाए रखता है।
- source_word: רֵד
  choice: नीचे जा
  rationale: ירד के दिशासूचक अर्थ को सरल आधुनिक हिन्दी में व्यक्त करता है; ‘उतर’ की तुलना में यहाँ ‘नीचे जा’ अगले उद्देश्यवाचक पद के साथ अधिक सहज है।
- source_word: לִקְרַאת
  choice: से मिलने
  rationale: मूल पद का सामान्य अर्थ किसी से मिलने या उसका सामना करने जाना है। ‘सामना करने’ से टकराव का भाव आवश्यकता से अधिक स्पष्ट हो जाता, इसलिए तटस्थ ‘से मिलने’ चुना गया।
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: इस्राएल के राजा
  rationale: राजकीय उपाधि का सीधा और स्वाभाविक हिन्दी रूप।
- source_word: אֲשֶׁר בְּשֹׁמְרוֹן
  choice: जो सामरिया में है
  rationale: मूल के क्रियारहित संबंधवाचक उपवाक्य को हिन्दी में आवश्यक ‘है’ जोड़कर निकटता से प्रस्तुत किया गया है।
- source_word: הִנֵּה
  choice: देख
  rationale: ध्यान आकृष्ट करने वाले कण की तात्कालिकता को आधुनिक, गरिमापूर्ण और अनार्काइक हिन्दी में बनाए रखता है।
- source_word: בְּכֶרֶם נָבוֹת
  choice: नाबोत की दाख की बारी में
  rationale: स्थानसूचक ב और संबंधसूचक रचना का सीधा अनुवाद; ‘दाख की बारी’ हिन्दी बाइबलीय प्रयोग में परिचित और सामान्य पाठक के लिए बोधगम्य है।
- source_word: אֲשֶׁר יָרַד שָׁם
  choice: जहाँ वह ... गया है
  rationale: संबंधवाचक वाक्य दाख की बारी की ओर संकेत करता है। हिन्दी पूर्ण वर्तमान उसकी पिछली गति और वर्तमान उपस्थिति को स्वाभाविक रूप से जोड़ता है; पहले आए ‘नीचे’ को अनावश्यक रूप से दोहराया नहीं गया।
- source_word: לְרִשְׁתּוֹ
  choice: उस पर अधिकार करने के लिए
  rationale: ירשׁ यहाँ बारी को अपने कब्जे/स्वामित्व में लेने का अर्थ देता है। यह चयन कानूनी-स्वामित्व का भाव रखता है, पर क्रिया में स्वयं स्पष्ट न होने वाली अतिरिक्त हिंसा नहीं जोड़ता।
theological_decisions:
- issue: ירשׁ में अधिकार लेने, रखने या विरासत में पाने की अर्थ-सीमा
  choice: उस पर अधिकार करने के लिए
  alternative: उसे अपने अधिकार में लेने के लिए; उसे पाने के लिए
  rationale: प्रसंग में अहाब नाबोत की मृत्यु के बाद दाख की बारी पर अपना स्वामित्व स्थापित करने गया है। अनुवाद इस नैतिक रूप से तनावपूर्ण प्रसंग को बनाए रखता है, पर मूल क्रिया से आगे बढ़कर ‘छीनने’ जैसा अधिक स्पष्ट हिंसक शब्द नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की है, जिसमें संक्षिप्त आज्ञाएँ और भविष्यद्वाणी-संदेश की गरिमा बनी रहती है। सर्वनाम और क्रियारूप एक व्यक्ति को संबोधित करने वाले इब्रानी एकवचन के अनुरूप हैं। पादटिप्पणी-चिह्न को उसी पद पर रखा गया है जहाँ ירשׁ की वास्तविक शब्दार्थगत विविधता आती है।
