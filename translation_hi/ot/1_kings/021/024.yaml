base_translation:
  language: en
  yaml_path: translation/ot/1_kings/021/024.yaml
  text: Anyone belonging to Ahab who dies in the city the dogs will eat[b][a], and anyone who dies in the field the birds of the sky will eat.
translation:
  language: hi
  text: अहाब के घराने का जो कोई नगर में मरेगा, उसे कुत्ते खाएँगे; और जो कोई खुले मैदान में मरेगा, उसे आकाश के पक्षी खाएँगे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַמֵּת לְאַחְאָב
  choice: अहाब के घराने का जो कोई ... मरेगा
  rationale: संज्ञीकृत कृदंत הַמֵּת यहाँ सामान्य अर्थ देता है, और לְאַחְאָב संबंध या अधिकार सूचित करता है। प्रसंग में आशय अहाब के घराने से संबंधित किसी भी व्यक्ति से है; इसलिए आधुनिक हिन्दी में यह स्पष्ट और स्वाभाविक रूप चुना गया।
- source_word: בָּעִיר
  choice: नगर में
  rationale: स्थानवाचक प्रयोग का सीधा अनुवाद; अगले खंड के खुले मैदान के साथ विरोध भी बना रहता है।
- source_word: יֹאכְלוּ הַכְּלָבִים
  choice: उसे कुत्ते खाएँगे
  rationale: אכל का मूल अर्थ 'खाना' है। 'नोच खाएँगे' या 'भक्षण करेंगे' की अपेक्षा यह स्रोत के अधिक निकट और सामान्य हिन्दी में स्पष्ट है। हिन्दी वाक्य-विन्यास के लिए कर्म 'उसे' स्पष्ट किया गया है।
- source_word: בַּשָּׂדֶה
  choice: खुले मैदान में
  rationale: שׂדה खेत, मैदान या खुले देहात को सूचित कर सकता है। यहाँ नगर के विपरीत खुला स्थान अभिप्रेत है; 'खुले मैदान' से यह विरोध स्वाभाविक हिन्दी में स्पष्ट होता है।
- source_word: עוֹף הַשָּׁמָיִם
  choice: आकाश के पक्षी
  rationale: शाब्दिक संबंध और प्रचलित बाइबिलीय बिंब दोनों सुरक्षित रहते हैं; 'स्वर्ग के पक्षी' सम्भव है, पर आधुनिक हिन्दी में यहाँ 'आकाश' अधिक स्वाभाविक है।
theological_decisions:
- issue: לְאַחְאָב से सूचित समूह की सीमा
  choice: अहाब के घराने का
  alternative: अहाब का / अहाब से संबंधित
  rationale: प्रसंग राजवंश और घराने पर आए न्याय का है। 'घराने' से संबंध स्पष्ट होता है, पर इसे किसी संकीर्ण वंशावली-सिद्धांत तक सीमित नहीं किया जाता।
translation_notes:
  register: भाषा आधुनिक, सरल और गरिमापूर्ण रखी गई है। दोनों समानांतर खंडों में 'जो कोई ... मरेगा, उसे ... खाएँगे' की संरचना दोहराकर इब्रानी समानांतरता और न्याय-वाणी की कठोरता सुरक्षित रखी गई है।
