source:
  edition: WLC
  text: הֲֽ/רָאִ֔יתָ כִּֽי נִכְנַ֥ע אַחְאָ֖ב מִ/לְּ/פָנָ֑/י יַ֜עַן כִּֽי נִכְנַ֣ע מִ/פָּנַ֗/י לֹֽא אבי הָֽ/רָעָה֙ בְּ/יָמָ֔י/ו בִּ/ימֵ֣י בְנ֔/וֹ אָבִ֥יא הָ/רָעָ֖ה עַל בֵּיתֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/021/029.yaml
  text: Have you seen that Ahab has humbled himself before me? Because he has humbled himself before me[a], I will not bring the disaster in his days[b]; in his son's days I will bring the disaster on his house.
translation:
  language: hi
  text: “क्या तूने देखा है कि अहाब ने मेरे सामने अपने आप को नम्र किया है? क्योंकि उसने मेरे सामने अपने आप को नम्र किया है, इसलिए मैं उसके जीवनकाल में वह विपत्ति[a] नहीं लाऊँगा; उसके बेटे के दिनों में मैं उसके घराने[b] पर वह विपत्ति लाऊँगा।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “आपदा”; इब्रानी में शाब्दिक अर्थ “बुराई/विपत्ति” है। न्याय के इस प्रसंग में इसका आशय दंडस्वरूप आने वाली विपत्ति है, नैतिक बुराई नहीं।
    reason: lexical_alternative
  - marker: b
    text: “घराना” उसके परिवार, राजघराने या राजवंश को सूचित कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲרָאִיתָ
  choice: क्या तूने देखा
  rationale: प्रत्यक्ष प्रश्न में प्रयुक्त पूर्ण क्रिया का स्वाभाविक हिन्दी रूप; यह बीते हुए अवलोकन की वर्तमान प्रासंगिकता बनाए रखता है।
- source_word: נִכְנַע
  choice: अपने आपको दीन किया है
  rationale: निफ़अल रूप यहाँ परमेश्वर के न्याय के सामने स्वयं को नम्र करने या झुकाने को व्यक्त करता है। यह 'पश्चाताप किया' कहकर मूल से अधिक अर्थ नहीं जोड़ता।
- source_word: מִלְּפָנַי / מִפָּנַי
  choice: मेरे सामने
  rationale: परमेश्वर की उपस्थिति में अहाब की मुद्रा को व्यक्त करने वाला स्वाभाविक हिन्दी मुहावरा।
- source_word: יַעַן כִּי
  choice: क्योंकि ... इसलिए
  rationale: अहाब के दीन होने और न्याय स्थगित होने के बीच कारण-परिणाम का संबंध हिन्दी में स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: לֹא אָבִיא
  choice: नहीं लाऊँगा
  rationale: हिफ़ील क्रिया का संक्षिप्त, सीधा और स्वाभाविक अनुवाद।
- source_word: הָרָעָה
  choice: वह विपत्ति
  rationale: न्याय के इस प्रसंग में शब्द नैतिक बुराई नहीं, दंडस्वरूप आने वाली आपदा को दर्शाता है। 'वह' पहले घोषित न्याय की ओर संकेत करता है।
- source_word: בְּיָמָיו
  choice: उसके जीवनकाल में
  rationale: हिब्रू के 'उसके दिनों में' का स्वाभाविक आधुनिक हिन्दी अर्थ स्पष्ट करता है और अगले वाक्यांश के साथ समयगत विरोध बनाए रखता है।
- source_word: בִּימֵי בְנוֹ
  choice: उसके बेटे के दिनों में
  rationale: मूल की समय-संबंधी अभिव्यक्ति और अहाब के जीवनकाल से उसका विरोध सुरक्षित रखता है।
- source_word: עַל בֵּיתוֹ
  choice: उसके घराने पर
  rationale: राजकीय संदर्भ में 'घर' परिवार, राजवंश या वंशगत घराने को सूचित कर सकता है। 'घराना' हिन्दी में इस सामूहिक और वंशगत अर्थ को स्वाभाविक रूप से वहन करता है।
theological_decisions:
- issue: अहाब की प्रतिक्रिया का स्वरूप
  choice: '''अपने आपको दीन किया है'''
  alternative: '''पश्चाताप किया है'' या ''अधीन हो गया है'''
  rationale: पद अहाब के स्वयं को दीन करने की बात कहता है, पर मानक पश्चाताप-वाचक शब्द का प्रयोग नहीं करता। इसलिए अनुवाद उसके कार्य को व्यक्त करता है, उसकी आध्यात्मिक दशा पर मूल से आगे जाकर निर्णय नहीं देता।
- issue: परमेश्वर द्वारा लाई जाने वाली רָעָה का अर्थ
  choice: '''विपत्ति'''
  alternative: '''बुराई'' या ''आपदा'''
  rationale: यहाँ संदर्भ दंडात्मक न्याय का है, नैतिक बुराई का नहीं। 'विपत्ति' उस न्यायिक आपदा को स्पष्ट करता है और परमेश्वर को नैतिक बुराई का कर्ता बताने की भ्रामक धारणा से बचाता है।
- issue: अहाब पर न्याय के समय का स्थगन
  choice: न्याय अहाब के जीवनकाल में नहीं, उसके बेटे के दिनों में आएगा
  alternative: न्याय पूर्णतः रद्द कर दिया गया
  rationale: मूल पाठ न्याय को रद्द नहीं करता, बल्कि अहाब के दीन होने के कारण उसके समय से आगे स्थगित करता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज शैली रखी गई है। परमेश्वर द्वारा एलिय्याह को एकवचन संबोधन के कारण 'तू' प्रयुक्त है। 'अपने आपको दीन किया' मूल के आत्म-नम्रीकरण को बचाता है; 'पश्चाताप' जैसा अधिक विशिष्ट धार्मिक निष्कर्ष नहीं जोड़ा गया। मुख्य पाठ में दोनों पाद-टिप्पणी चिह्न [a] और [b] संबंधित शब्दों के साथ दिए गए हैं।
