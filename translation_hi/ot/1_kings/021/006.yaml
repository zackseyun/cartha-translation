base_translation:
  language: en
  yaml_path: translation/ot/1_kings/021/006.yaml
  text: And he spoke to her, because I spoke to Naboth the Jezreelite and said to him, ‘Give me your vineyard for silver, or, if you prefer, I will give you a vineyard in place of it,’ but he said, ‘I will not give you my vineyard.’
translation:
  language: hi
  text: उसने उससे कहा, “मैंने यिज्रेलवासी नाबोत से कहा था, ‘अपनी दाख की बारी मुझे चाँदी के बदले दे दे; या यदि तू चाहे, तो मैं उसके बदले तुझे एक दाख की बारी दे दूँगा।’ पर उसने कहा, ‘मैं अपनी दाख की बारी तुझे नहीं दूँगा।’”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: इसलिए कि
  rationale: यह अहाब के उत्तर को उसके उदास होने के कारण से जोड़ता है और इब्रानी के कारणसूचक संबंध को बनाए रखता है।
- source_word: בְּכֶסֶף
  choice: चाँदी के बदले
  rationale: כֶּסֶף का ठोस अर्थ ‘चाँदी’ है; यहाँ वही खरीद की कीमत के रूप में प्रयुक्त है।
- source_word: חָפֵץ
  choice: चाहे
  rationale: संदर्भ में इसका अर्थ इच्छा या पसंद होना है; आधुनिक हिन्दी में ‘यदि तू चाहे’ स्वाभाविक है।
- source_word: כֶּרֶם
  choice: दाख की बारी
  rationale: यह अंगूर उगाने के स्थान को स्पष्ट और पारंपरिक, पर सामान्यतः बोधगम्य हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: नाबोत के इनकार का अहाब द्वारा संक्षिप्त वर्णन
  choice: अहाब के कथन में केवल ‘मैं अपनी दाख की बारी तुझे नहीं दूँगा’ रखा गया
  alternative: पिछले पद से नाबोत का पैतृक विरासत और यहोवा-संबंधी कारण जोड़ना
  rationale: इस पद का इब्रानी पाठ अहाब की पुनर्कथा में नाबोत के धार्मिक और पैतृक कारण को छोड़ देता है; अनुवाद ने उस कथात्मक तनाव को बिना विस्तार जोड़े सुरक्षित रखा है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण कथात्मक शैली रखी गई है। संबोधन में ‘तू’ मूल इब्रानी के एकवचन अनौपचारिक रूप के अनुरूप है और राजकीय संवाद में प्रत्यक्षता बनाए रखता है।
