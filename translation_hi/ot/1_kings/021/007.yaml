source:
  edition: WLC
  text: וַ/תֹּ֤אמֶר אֵלָי/ו֙ אִיזֶ֣בֶל אִשְׁתּ֔/וֹ אַתָּ֕ה עַתָּ֛ה תַּעֲשֶׂ֥ה מְלוּכָ֖ה עַל יִשְׂרָאֵ֑ל ק֤וּם אֱכָל לֶ֨חֶם֙ וְ/יִטַ֣ב לִבֶּ֔/ךָ אֲנִי֙ אֶתֵּ֣ן לְ/ךָ֔ אֶת כֶּ֖רֶם נָב֥וֹת הַ/יִּזְרְעֵאלִֽי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/021/007.yaml
  text: Then Jezebel his wife said to him[a], “Do you now govern Israel as king? Get up, eat bread, and let your heart be cheerful[b]; I will give you the vineyard of Naboth the Jezreelite.”
translation:
  language: hi
  text: तब उसकी पत्नी ईज़ेबेल ने उससे कहा[a], “क्या अब तुम इस्राएल पर राजा होकर शासन कर रहे हो? उठो, भोजन करो और अपना मन प्रसन्न रखो[b]; मैं तुम्हें यिज्रेली नाबोत की दाख की बारी दूँगी।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अब तुम इस्राएल पर राजसत्ता चला रहे हो।” इब्रानी वाक्य को प्रश्न के बजाय कथन अथवा ताने के रूप में भी समझा जा सकता है।
    reason: alternative_reading
  - marker: b
    text: इब्रानी में शाब्दिक रूप से “रोटी खाओ”; यह भोजन करने के लिए प्रयुक्त मुहावरा है।
    reason: cultural_note
lexical_decisions:
- source_word: וַתֹּאמֶר אֵלָיו
  choice: तब ... ने उससे कहा
  rationale: वाव-क्रमिक कथा को आगे बढ़ाता है; ‘तब’ आधुनिक हिन्दी में घटनाक्रम को स्वाभाविक रूप से व्यक्त करता है।
- source_word: אִיזֶבֶל אִשְׁתּוֹ
  choice: उसकी पत्नी ईज़ेबेल
  rationale: वक्ता की पहचान और अहाब के साथ उसका संबंध दोनों स्पष्ट रहते हैं; हिन्दी में यही पदक्रम अधिक स्वाभाविक है।
- source_word: אַתָּה עַתָּה תַּעֲשֶׂה מְלוּכָה עַל יִשְׂרָאֵל
  choice: क्या अब तुम इस्राएल पर राजा होकर शासन कर रहे हो?
  rationale: מְלוּכָה के साथ עשה का अर्थ राजसत्ता का प्रयोग करना या राजा की तरह शासन करना है। संदर्भ में इसे व्यंग्यपूर्ण आलंकारिक प्रश्न के रूप में रखा गया है।
- source_word: קוּם
  choice: उठो
  rationale: आज्ञार्थक रूप का सीधा और स्वाभाविक हिन्दी अनुवाद।
- source_word: אֱכָל לֶחֶם
  choice: भोजन करो
  rationale: शाब्दिक अर्थ ‘रोटी खाओ’ है, पर यह भोजन करने का इब्रानी मुहावरा है; मुख्य पाठ में स्वाभाविक हिन्दी अर्थ दिया गया है और मुहावरा पादटिप्पणी में बताया गया है।
- source_word: וְיִטַב לִבֶּךָ
  choice: और अपना मन प्रसन्न रखो
  rationale: शाब्दिक भाव ‘तुम्हारा हृदय अच्छा/प्रसन्न हो’ है। हिन्दी में ‘मन प्रसन्न रखो’ आंतरिक मनोदशा को सहजता से व्यक्त करता है।
- source_word: אֲנִי אֶתֵּן לְךָ
  choice: मैं तुम्हें ... दिला दूँगी
  rationale: स्पष्ट प्रथम-पुरुष सर्वनाम का बल ‘मैं’ से सुरक्षित है। संदर्भ में ईज़ेबेल स्वयं दाख की बारी का स्वामित्व नहीं दे रही, बल्कि उसे अहाब के अधिकार में लाने का आश्वासन देती है; इसलिए ‘दिला दूँगी’ स्वाभाविक है।
- source_word: כֶּרֶם נָבוֹת הַיִּזְרְעֵאלִי
  choice: यिज्रेली नाबोत की दाख की बारी
  rationale: रचना-संबंध को स्वाभाविक हिन्दी में व्यक्त किया गया है और הַיִּזְרְעֵאלִי को स्थान-सूचक विशेषण ‘यिज्रेली’ के रूप में रखा गया है।
theological_decisions:
- issue: ईज़ेबेल के आरंभिक कथन का बल
  choice: 'व्यंग्यपूर्ण आलंकारिक प्रश्न: ‘क्या अब तुम इस्राएल पर राजा होकर शासन कर रहे हो?’'
  alternative: 'कथन अथवा ताना: ‘अब तुम ही इस्राएल पर राजसत्ता चला रहे हो।’'
  rationale: इब्रानी में स्पष्ट प्रश्नवाचक चिह्नक नहीं है, इसलिए व्याकरणतः कथन भी संभव है। संदर्भ में ईज़ेबेल अहाब की निष्क्रियता पर ताना मारती है; मुख्य पाठ में आलंकारिक प्रश्न स्वाभाविक है, जबकि कथन की संभावना पादटिप्पणी में सुरक्षित रखी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी, सरल किंतु गरिमापूर्ण कथा-शैली। ‘दाख की बारी’ बाइबलीय संदर्भ में परिचित और अर्थ-स्पष्ट है। संबोधन में एकवचन अनौपचारिक ‘तुम’ वैवाहिक संवाद और ईज़ेबेल के तीखे स्वर के अनुरूप है।
