  yaml_path: translation/ot/1_kings/021/003.yaml
  text: But Naboth said to Ahab[a], “Far be it from me by Yahweh to give you the inheritance of my fathers.”
translation:
  language: hi
  text: परन्तु नाबोत ने अहाब से कहा, “याहवे न करे कि मैं अपने पुरखाओं की विरासत तुम्हें दे दूँ!”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: हिब्रू निषेध-मुहावरे का शाब्दिक ढाँचा ‘याहवे से/की ओर से यह मुझसे दूर हो’ जैसा है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: परन्तु ... ने कहा
  rationale: वाव-क्रम कथा को आगे बढ़ाता है, पर पिछले पद में अहाब के प्रस्ताव के प्रति विरोध दिखाने के लिए ‘परन्तु’ प्रसंगानुकूल है।
- source_word: נָבוֹת ... אַחְאָב
  choice: नाबोत ... अहाब
  rationale: व्यक्तिनामों का प्रचलित हिन्दी लिप्यंतरण रखा गया है।
- source_word: חָלִילָה לִּי מֵיְהוָה
  choice: याहवे के कारण यह मुझसे दूर रहे
  rationale: यह प्रबल अस्वीकार का सूत्र है। यह रूप मूल की संरचना और याहवे के साथ उसके संबंध को बनाए रखता है, यद्यपि हिन्दी में इसका अधिक मुहावरेदार रूप पाद-टिप्पणी में दिया गया है।
- source_word: מִתִּתִּי
  choice: कि मैं ... दे दूँ
  rationale: पूर्वसर्गयुक्त क्रियार्थक संज्ञा उस कार्य को व्यक्त करती है जिसे नाबोत दृढ़ता से अस्वीकार करता है; हिन्दी में उपवाक्य स्वाभाविक है।
- source_word: נַחֲלַת אֲבֹתַי
  choice: अपने पुरखाओं की विरासत
  rationale: נַחֲלָה पैतृक रूप से मिली पारिवारिक भूमि-संपत्ति है। ‘विरासत’ इसके कानूनी और पारिवारिक दोनों अर्थों को रखती है; ‘पुरखाओं’ से पुरुष पूर्वजों की वंशगत भावना सहज हिन्दी में आती है।
- source_word: לָךְ
  choice: तुम्हें
  rationale: ‘देना’ के साथ सम्प्रदान कारक का स्वाभाविक हिन्दी रूप है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा / प्रभु
  rationale: मूल में वाचा-संबंधी विशिष्ट नाम सीधे आया है; ‘याहवे’ उसका लिप्यंतरण करते हुए उसे सामान्य उपाधि में नहीं बदलता।
- issue: חָלִילָה לִּי מֵיְהוָה को मुहावरे में समेटना या संरचना बनाए रखना
  choice: मुख्य पाठ में ‘याहवे के कारण यह मुझसे दूर रहे’
  alternative: ‘याहवे न करे कि मैं...’
  rationale: मुख्य पाठ नाबोत के प्रबल अस्वीकार और מִן के संबंधपरक/कारणगत बल को खुला रखता है। अधिक सहज, पर कुछ अधिक व्याख्यात्मक मुहावरा पाद-टिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध हिन्दी। ‘यह मुझसे दूर रहे’ जानबूझकर कुछ औपचारिक है, क्योंकि यह मूल के प्रबल निषेध-सूत्र को सुरक्षित रखता है; पाद-टिप्पणी सहज हिन्दी विकल्प देती है।
