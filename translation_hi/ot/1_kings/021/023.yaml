source:
  edition: WLC
  text: וְ/גַ֨ם לְ/אִיזֶ֔בֶל דִּבֶּ֥ר יְהוָ֖ה לֵ/אמֹ֑ר הַ/כְּלָבִ֛ים יֹאכְל֥וּ אֶת אִיזֶ֖בֶל בְּ/חֵ֥ל יִזְרְעֶֽאל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/021/023.yaml
  text: And also concerning Jezebel[a], Yahweh spoke, saying, ‘The dogs will eat Jezebel in the territory of Jezreel.’
translation:
  language: hi
  text: और ईज़ेबेल के विषय में भी याहवे ने कहा, “यिज्रेल के क्षेत्र[a] में कुत्ते ईज़ेबेल को खा जाएँगे।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “यिज्रेल की शहरपनाह के पास।” यहाँ प्रयुक्त इब्रानी शब्द कठिन है और संभवतः नगर के बाहरी किलेबंद क्षेत्र को अधिक विशेष रूप से दर्शाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם
  choice: और ... भी
  rationale: संयोजक וְ और योगसूचक גַם—दोनों के बल को स्वाभाविक हिन्दी में बनाए रखता है और इस न्याय-वचन को पिछले कथन से जोड़ता है।
- source_word: לְאִיזֶבֶל
  choice: ईज़ेबेल के विषय में
  rationale: דבר के साथ לְ यहाँ उस व्यक्ति को सूचित कर सकता है जिसके विषय में वचन कहा गया है; प्रसंग यह नहीं बताता कि ईज़ेबेल स्वयं प्रत्यक्ष श्रोता थी।
- source_word: דִּבֶּר יְהוָה לֵאמֹר
  choice: याहवे ने कहा
  rationale: हिन्दी में ‘ने कहा’ उद्धरण का स्वाभाविक परिचय है; अलग से ‘यह कहते हुए’ जोड़ना अनावश्यक और बोझिल होता।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी व्यक्तिगत नाम का लिप्यंतरण किया गया है, उसे किसी उपाधि से प्रतिस्थापित नहीं किया गया।
- source_word: הַכְּלָבִים יֹאכְלוּ
  choice: कुत्ते ... खा जाएँगे
  rationale: भविष्यसूचक न्याय और אכל के सामान्य अर्थ को सीधी, स्वाभाविक हिन्दी में व्यक्त करता है; ‘नोच खाएँगे’ या ‘भक्षण करेंगे’ स्रोत से अधिक तीव्र अथवा संस्कृतनिष्ठ होते।
- source_word: בְּחֵל יִזְרְעֶאל
  choice: यिज्रेल के क्षेत्र में
  rationale: חֵל का यहाँ सटीक अर्थ अनिश्चित है। ‘क्षेत्र’ स्थान-संबंधी अर्थ को स्पष्ट रखता है, जबकि अधिक विशिष्ट स्थापत्य अर्थ को पादटिप्पणी में सुरक्षित रखा गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में चार-अक्षरी व्यक्तिगत नाम सीधे आया है। ‘याहवे’ उसका प्रचलित विद्वत्तापूर्ण लिप्यंतरण है और नाम को उपाधि में नहीं बदलता।
- issue: לְאִיזֶבֶל का संबंध
  choice: ईज़ेबेल के विषय में
  alternative: ईज़ेबेल से; ईज़ेबेल के विरुद्ध
  rationale: कथानक में एलिय्याह ईज़ेबेल के बारे में घोषित न्याय-वचन सुना रहा है; ‘से’ अनावश्यक रूप से उसे प्रत्यक्ष संबोधित व्यक्ति बना सकता है, और ‘विरुद्ध’ पूर्वसर्ग में अपेक्षा से अधिक अर्थ भर सकता है।
- issue: בְּחֵל יִזְרְעֶאל का अनिश्चित स्थान-सूचक अर्थ
  choice: यिज्रेल के क्षेत्र में
  alternative: यिज्रेल की शहरपनाह के पास
  rationale: मुख्य पाठ व्यापक स्थान-सूचक अर्थ देता है और कठिन संज्ञा को अत्यधिक निश्चित नहीं बनाता; संभावित दुर्ग-संबंधी अर्थ पादटिप्पणी में दिया गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। नामों के रूप ‘ईज़ेबेल’, ‘यिज्रेल’ और ‘याहवे’ आधुनिक देवनागरी लिप्यंतरण के अनुसार हैं।
