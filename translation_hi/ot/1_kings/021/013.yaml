  text: וַ֠/יָּבֹאוּ שְׁנֵ֨י הָ/אֲנָשִׁ֥ים בְּנֵֽי בְלִיַּעַל֮ וַ/יֵּשְׁב֣וּ נֶגְדּ/וֹ֒ וַ/יְעִדֻ/הוּ֩ אַנְשֵׁ֨י הַ/בְּלִיַּ֜עַל אֶת נָב֗וֹת נֶ֤גֶד הָ/עָם֙ לֵ/אמֹ֔ר בֵּרַ֥ךְ נָב֛וֹת אֱלֹהִ֖ים וָ/מֶ֑לֶךְ וַ/יֹּצִאֻ֨/הוּ֙ מִ/ח֣וּץ לָ/עִ֔יר וַ/יִּסְקְלֻ֥/הוּ בָ/אֲבָנִ֖ים וַ/יָּמֹֽת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/021/013.yaml
  text: Then the two worthless men came in and sat opposite him[a], and the worthless men testified against Naboth before the people, saying, “Naboth cursed God and the king.” So they brought him outside the city and stoned him with stones[b], and he died.
translation:
  language: hi
  text: तब वे दोनों दुष्ट आदमी आकर उसके आमने-सामने बैठ गए[a]। उन दुष्ट आदमियों ने लोगों के सामने नाबोत के विरुद्ध यह गवाही दी, “नाबोत ने परमेश्वर और राजा को शाप दिया है[b]।” तब वे उसे नगर के बाहर ले गए, पत्थरों से उसे मार डाला, और वह मर गया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से “बेलियाल के पुत्र” और आगे “बेलियाल के आदमी” है; यह दुष्ट या निकम्मे लोगों के लिए एक मुहावरा है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में शाब्दिक क्रिया “आशीष दी” है, जिसे यहाँ निन्दा के आरोप में “शाप दिया” कहने की श्रद्धापूर्ण व्यंजना के रूप में प्रयोग किया गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי בְלִיַּעַל / אַנְשֵׁי הַבְּלִיַּעַל
  choice: दुष्ट आदमी / दुष्ट आदमियों
  rationale: यह इब्रानी मुहावरा जैविक वंश नहीं, बल्कि नैतिक रूप से निकृष्ट और अधर्मी व्यक्तियों को दर्शाता है। आधुनिक हिन्दी में ‘दुष्ट आदमी’ सहज और स्पष्ट है; शाब्दिक रूप पादटिप्पणी में दिया गया है।
- source_word: נֶגְדּוֹ
  choice: उसके सामने
  rationale: यह नाबोत के आमने-सामने बैठने की स्थिति बताता है और न्यायिक प्रसंग में स्वाभाविक हिन्दी है।
- source_word: וַיְעִדֻהוּ
  choice: उसके विरुद्ध ... गवाही दी
  rationale: यहाँ हिफ़ील रूप विधिक गवाही को सूचित करता है; यह अनुवाद आरोप लगाने के बजाय औपचारिक साक्ष्य का भाव बनाए रखता है।
- source_word: נֶגֶד הָעָם
  choice: लोगों के सामने
  rationale: यह आरोप के सार्वजनिक रूप से लगाए जाने को स्पष्ट और संक्षिप्त ढंग से व्यक्त करता है।
- source_word: בֵּרַךְ
  choice: शाप दिया
  rationale: इस न्यायिक आरोप में ‘आशीष देना’ श्रद्धावश प्रयुक्त व्यंजना है जिसका अभिप्रेत अर्थ ‘शाप देना’ है। मुख्य पाठ में आशय और पादटिप्पणी में शाब्दिक रूप रखा गया है।
- source_word: אֱלֹהִים
  choice: परमेश्वर
  rationale: इस इस्राएली न्यायिक प्रसंग में संकेत इस्राएल के परमेश्वर की ओर है, अनेक देवताओं की ओर नहीं।
- source_word: וָמֶלֶךְ
  choice: और राजा
  rationale: संयोजक दोनों कथित अपराध-विषयों—परमेश्वर और राजा—को जोड़ता है।
- source_word: וַיֹּצִאֻהוּ מִחוּץ לָעִיר
  choice: वे उसे नगर के बाहर ले गए
  rationale: यह मृत्युदंड के लिए नाबोत को नगर से बाहर निकाले जाने को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וַיִּסְקְלֻהוּ בָאֲבָנִים
  choice: उस पर पत्थर बरसाकर उसे मार डाला
  rationale: इब्रानी में पत्थरों द्वारा पथराव का साधन स्पष्ट है। हिन्दी में यह प्रयोग क्रिया और साधन दोनों को स्वाभाविक रूप से व्यक्त करता है।
- source_word: וַיָּמֹת
  choice: उसे मार डाला
  rationale: इब्रानी का अंतिम परिणाम ‘और वह मर गया’ है। हिन्दी में पूर्ववर्ती पथराव के साथ संयुक्त यह रूप परिणाम को स्पष्ट और स्वाभाविक ढंग से बताता है।
theological_decisions:
- issue: निन्दा के आरोप में व्यंजनात्मक क्रिया בֵּרַךְ का अनुवाद
  choice: मुख्य पाठ में अभिप्रेत अर्थ ‘शाप दिया’
  alternative: शाब्दिक ‘आशीष दी’ लिखकर व्यंजना की व्याख्या करना
  rationale: इब्रानी श्रद्धावश ‘आशीष देना’ कहता है, पर आरोप का वास्तविक अर्थ परमेश्वर और राजा को शाप देना है। मुख्य पाठ में अर्थ देने और पादटिप्पणी में शाब्दिक व्यंजना बताने से स्पष्टता और स्रोत-पारदर्शिता दोनों बनी रहती हैं।
translation_notes:
  register: आधुनिक मानक हिन्दी, सहज पर गरिमापूर्ण कथात्मक शैली। विधिक प्रसंग के लिए ‘गवाही दी’ रखा गया है। दोनों पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित हैं; दूसरे चिह्न को आरोप-वाक्य के बजाय वध-वाक्य के अंत में रखने से बचते हुए यहाँ स्रोत-सूचना से मेल सुनिश्चित करने हेतु [b] मुख्य पाठ में है, यद्यपि उसका विषय ‘शाप दिया’ है।
