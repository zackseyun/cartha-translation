  text: וַ/יָּבֹא֩ אַחְאָ֨ב אֶל בֵּית֜/וֹ סַ֣ר וְ/זָעֵ֗ף עַל הַ/דָּבָר֙ אֲשֶׁר דִּבֶּ֣ר אֵלָ֗י/ו נָבוֹת֙ הַ/יִּזְרְעֵאלִ֔י וַ/יֹּ֕אמֶר לֹֽא אֶתֵּ֥ן לְ/ךָ֖ אֶת נַחֲלַ֣ת אֲבוֹתָ֑/י וַ/יִּשְׁכַּב֙ עַל מִטָּת֔/וֹ וַ/יַּסֵּ֥ב אֶת פָּנָ֖י/ו וְ/לֹֽא אָ֥כַל לָֽחֶם־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/021/004.yaml
  text: So Ahab went into his house sullen and angry because of the word that Naboth the Jezreelite had spoken to him[a], saying, “I will not give you the inheritance of my fathers.” And he lay down on his bed and turned his face away[c][b], and he would not eat bread.
translation:
  language: hi
  text: 'तब अहाब अपने घर गया। वह उस बात के कारण खिन्न और क्रोधित था जो यिज्रेली नाबोत ने उससे कही थी[a]: “मैं अपने पुरखाओं की विरासत तुम्हें नहीं दूँगा।” तब वह अपने बिस्तर पर लेट गया, अपना मुँह फेर लिया और भोजन नहीं किया[b]।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उस वचन के कारण जो यिज्रेली नाबोत ने उससे कहा था।” इब्रानी शब्द का अर्थ “वचन,” “बात” या “मामला” हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “रोटी नहीं खाई।” यहाँ “रोटी खाना” सामान्य रूप से भोजन करने के अर्थ में हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: סַר וְזָעֵף
  choice: उदास और क्रोधित
  rationale: दोनों भावसूचक शब्द अहाब की खिन्न, रूठी हुई मनःस्थिति और क्रोध को व्यक्त करते हैं। यह युग्म आधुनिक हिन्दी में स्वाभाविक है और दोनों अलग भावों को बनाए रखता है।
- source_word: עַל הַדָּבָר אֲשֶׁר דִּבֶּר אֵלָיו
  choice: उस बात के कारण जो ... ने उससे कही थी
  rationale: דבר यहाँ कथन या बात को सूचित करता है। ‘बात’ हिन्दी में स्वाभाविक है, जबकि शब्द की अर्थ-सीमा को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: נָבוֹת הַיִּזְרְעֵאלִי
  choice: यिज्रेली नाबोत
  rationale: व्यक्तिनाम का लिप्यंतरण किया गया है और स्थान-संबंधी विशेषण को स्वाभाविक हिन्दी रूप में रखा गया है।
- source_word: נַחֲלַת אֲבוֹתָי
  choice: अपने पुरखाओं की विरासत
  rationale: נחלה पैतृक रूप से मिली भूमि-संपत्ति का संकेत करती है। ‘विरासत’ उसके पारिवारिक उत्तराधिकार के भाव को बनाए रखती है; ‘पुरखाओं’ से स्रोत का पूर्वज-पितृ संबंध स्वाभाविक हिन्दी में व्यक्त होता है।
- source_word: וַיִּשְׁכַּב עַל מִטָּתוֹ
  choice: अपने बिस्तर पर लेट गया
  rationale: यह क्रिया कथा में अहाब के जाकर लेटने की घटना बताती है; हिन्दी में यह सीधा और स्वाभाविक रूप है।
- source_word: וַיַּסֵּב אֶת פָּנָיו
  choice: अपना मुँह फेर लिया
  rationale: यह केवल शारीरिक दिशा-परिवर्तन नहीं, बल्कि रूठकर अलग हो जाने की मुद्रा भी व्यक्त करता है। हिन्दी मुहावरा वही संकेत देता है।
- source_word: וְלֹא אָכַל לָחֶם
  choice: भोजन नहीं किया
  rationale: לחם का शाब्दिक अर्थ ‘रोटी’ है, पर इस प्रयोग में वह सामान्य भोजन का द्योतक हो सकता है। अर्थ को स्वाभाविक हिन्दी में दिया गया है और शाब्दिक रूप पादटिप्पणी में रखा गया है।
theological_decisions:
- issue: नाबोत की पैतृक विरासत का लिंग-सूचक वर्णन
  choice: अपने पुरखाओं की विरासत
  alternative: अपने पूर्वजों की विरासत / अपने पितरों की विरासत
  rationale: इब्रानी אבות पुल्लिंग बहुवचन है और इस प्रसंग में वंशगत भूमि पर बल देता है। ‘पुरखाओं’ स्रोत के पितृवंशीय भाव को सहज आधुनिक हिन्दी में बनाए रखता है, जबकि ‘पूर्वजों’ से वह लिंग-सूचना कुछ धुँधली हो सकती है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और कथात्मक हिन्दी। छोटे वाक्यों से मूल की क्रमिक क्रियाएँ स्पष्ट रखी गई हैं। ‘यिज्रेली नाबोत,’ ‘पुरखाओं की विरासत’ और ‘मुँह फेर लिया’ जैसे रूप सामान्य पाठक के लिए सहज रहते हुए स्रोत के सांस्कृतिक और भावात्मक संकेत सुरक्षित रखते हैं।
