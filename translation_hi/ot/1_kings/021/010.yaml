  text: וְ֠/הוֹשִׁיבוּ שְׁנַ֨יִם אֲנָשִׁ֥ים בְּנֵֽי בְלִיַּעַל֮ נֶגְדּ/וֹ֒ וִ/יעִדֻ֣/הוּ לֵ/אמֹ֔ר בֵּרַ֥כְתָּ אֱלֹהִ֖ים וָ/מֶ֑לֶךְ וְ/הוֹצִיאֻ֥/הוּ וְ/סִקְלֻ֖/הוּ וְ/יָמֹֽת־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/021/010.yaml
  text: And seat two worthless men opposite him[a], and let them testify against him, saying, ‘You have cursed God and the king.’ Then bring him out and stone him, so that he dies.
translation:
  language: hi
  text: और दो दुष्ट पुरुषों को उसके सामने बिठाओ, और वे उसके विरुद्ध यह गवाही दें, ‘तूने परमेश्वर और राजा को शाप दिया है।’[a] फिर उसे बाहर ले जाकर पत्थरों से मार डालो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: हिब्रानी में शाब्दिक अर्थ है, “तूने परमेश्वर और राजा को आशीष दी है।” यहाँ “आशीष देना” श्रद्धापूर्वक “शाप देना” कहने का परोक्ष रूप है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוֹשִׁיבוּ
  choice: बैठाओ
  rationale: हिफ़ील रूप का कारक अर्थ है ‘बैठाना’; आज की स्वाभाविक हिन्दी में आदेश का बल स्पष्ट रहता है।
- source_word: שְׁנַיִם אֲנָשִׁים בְּנֵי בְלִיַּעַל
  choice: दो निकम्मे आदमियों
  rationale: इब्रानी में दो पुरुषों का स्पष्ट उल्लेख है। ‘निकम्मे’ नैतिक रूप से भ्रष्ट और अधम व्यक्तियों का भाव देता है, बिना ‘बिलियाल’ को व्यक्तिवाचक नाम मानने के।
- source_word: נֶגְדּוֹ
  choice: उसके सामने
  rationale: यह आमने-सामने या सम्मुख बैठाने का संकेत देता है; ‘उसके सामने’ स्वाभाविक और प्रसंगानुकूल हिन्दी है।
- source_word: וִיעִדֻהוּ
  choice: उसके विरुद्ध ... गवाही दें
  rationale: न्यायिक प्रसंग में क्रिया का अर्थ किसी के विरुद्ध साक्ष्य देना है।
- source_word: בֵּרַכְתָּ
  choice: शाप दिया है
  rationale: मूल क्रिया सामान्यतः ‘आशीष देना’ है, पर यहाँ परमेश्वर के प्रति श्रद्धापूर्ण परोक्ष कथन के रूप में ‘शाप देना’ अभिप्रेत है; शाब्दिक रूप पादटिप्पणी में रखा गया है।
- source_word: אֱלֹהִים וָמֶלֶךְ
  choice: परमेश्वर और राजा
  rationale: आरोप धार्मिक और राजकीय, दोनों सत्ताओं के विरुद्ध अपराध का है; एकवचन संदर्भ बनाए रखा गया है।
- source_word: וְהוֹצִיאֻהוּ
  choice: उसे बाहर ले जाकर
  rationale: क्रिया बाहर निकालने या ले जाने को व्यक्त करती है और अगली क्रिया से सहज रूप में जुड़ती है।
- source_word: וְסִקְלֻהוּ וְיָמֹת
  choice: पत्थरों से मार डालो
  rationale: दोनों क्रियाओं को स्वाभाविक हिन्दी में मिलाकर पत्थरवाह द्वारा मृत्यु का आदेश स्पष्ट किया गया है; परिणाम ‘वह मर जाए’ इसी मुहावरे में निहित है।
theological_decisions:
- issue: परमेश्वर के लिए בֵּרַכְתָּ का व्यंजनापूर्ण प्रयोग
  choice: मुख्य पाठ में ‘शाप दिया है’
  alternative: ‘आशीष दी है’ का शाब्दिक अनुवाद
  rationale: कथा में गढ़ा गया आरोप मृत्युदंड योग्य निन्दा का है। मुख्य पाठ में ‘आशीष’ अर्थ को उलटा कर देगा, इसलिए आशय दिया गया और मूल की श्रद्धापूर्ण व्यंजना पादटिप्पणी में सुरक्षित रखी गई।
- issue: בְּנֵי בְלִיַּעַל का अर्थ
  choice: निकम्मे आदमी
  alternative: बिलियाल के पुत्र; दुष्ट आदमी
  rationale: यहाँ यह नैतिक रूप से अधम और बेईमान पुरुषों के लिए इब्रानी मुहावरा है, किसी दुष्ट आत्मा के व्यक्तिवाचक नाम का आवश्यक संदर्भ नहीं।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज किन्तु गरिमापूर्ण आदेशात्मक रूप अपनाया गया है। कानूनी प्रसंग के लिए ‘गवाही दें’ और निष्पादन के लिए परिचित ‘पत्थरों से मार डालो’ रखा गया है।
