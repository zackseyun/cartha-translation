  text: וַ/תִּכְתֹּ֤ב סְפָרִים֙ בְּ/שֵׁ֣ם אַחְאָ֔ב וַ/תַּחְתֹּ֖ם בְּ/חֹתָמ֑/וֹ וַ/תִּשְׁלַ֣ח ה/ספרים אֶל הַ/זְקֵנִ֤ים וְ/אֶל הַֽ/חֹרִים֙ אֲשֶׁ֣ר בְּ/עִיר֔/וֹ הַ/יֹּשְׁבִ֖ים אֶת נָבֽוֹת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/021/008.yaml
  text: So she wrote letters in Ahab’s name[a], sealed them with his seal, and sent the letters to the elders and to the nobles who were in his city, who were living with Naboth.
translation:
  language: hi
  text: तब उसने अहाब के नाम से पत्र लिखे, उन्हें अहाब की मुहर से मुहरबंद किया, और वे पत्र उन बुज़ुर्गों और कुलीन लोगों के पास भेजे, जो उसके नगर में[a] नाबोत के साथ रहते थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “उसके नगर” में “उसके” का संकेत नाबोत की ओर हो सकता है, या अहाब की ओर।
    reason: इब्रानी सर्वनामिक प्रत्यय का संदर्भ अस्पष्ट है।
lexical_decisions:
- source_word: וַתִּכְתֹּב
  choice: तब उसने लिखे
  rationale: वाव-क्रमिक कथा को आगे बढ़ाता है; स्त्रीलिंग कर्ता पिछले संदर्भ की ईज़ेबेल है। हिंदी में “तब” स्वाभाविक रूप से घटनाक्रम व्यक्त करता है।
- source_word: סְפָרִים / הַסְּפָרִים
  choice: पत्र / वे पत्र
  rationale: यहाँ סֵפֶר स्थानीय अगुओं को भेजे गए आधिकारिक लिखित संदेशों को दर्शाता है, इसलिए “पत्र” सबसे स्वाभाविक है।
- source_word: בְּשֵׁם אַחְאָב
  choice: अहाब के नाम से
  rationale: यह पदबंध अहाब के अधिकार या प्रतिनिधित्व में कार्य करने का भाव रखता है और हिंदी में प्रचलित रूप से व्यक्त होता है।
- source_word: וַתַּחְתֹּם בְּחֹתָמוֹ
  choice: उन पर उसकी मुहर लगाई
  rationale: क्रिया और संज्ञा का मेल आधिकारिक मुहर से दस्तावेज़ प्रमाणित करने को दर्शाता है; यह हिंदी में स्पष्ट और स्वाभाविक है।
- source_word: הַזְּקֵנִים
  choice: पुरनियों
  rationale: यह नगर के वरिष्ठ नागरिक अगुओं को सूचित करता है; “पुरनिये” हिंदी बाइबलीय प्रयोग में परिचित और पद की गरिमा के अनुकूल है।
- source_word: הַחֹרִים
  choice: कुलीन लोगों
  rationale: यह ऊँचे सामाजिक दर्जे और प्रभाव वाले व्यक्तियों को दर्शाता है; “कुलीन लोग” आधुनिक पाठक के लिए स्पष्ट है।
- source_word: אֲשֶׁר בְּעִירוֹ
  choice: जो उसके नगर में
  rationale: तीसरे पुरुष एकवचन प्रत्यय को “उसके” से रखा गया है, जिससे मूल की वास्तविक संदर्भगत अस्पष्टता बनी रहती है।
- source_word: הַיֹּשְׁבִים אֶת נָבוֹת
  choice: नाबोत के साथ रहते थे
  rationale: יָשַׁב के साथ אֵת यहाँ नाबोत के साथ अथवा उसी स्थान में रहने का स्थानीय-सहवासी भाव देता है; चुना हुआ रूप मूल के निकट और सहज है।
theological_decisions:
- issue: בְּעִירוֹ में सर्वनामिक प्रत्यय का संदर्भ
  choice: मुख्य पाठ में “उसके नगर” रखकर संदर्भ को खुला रखा गया
  alternative: इसे स्पष्ट रूप से “नाबोत के नगर” या “अहाब के नगर” कहना
  rationale: इब्रानी प्रत्यय व्याकरणतः नाबोत या अहाब में से किसी की ओर संकेत कर सकता है। निकटवर्ती स्थानीय संदर्भ नाबोत के पक्ष में है, पर अहाब का संदर्भ भी संभव है; इसलिए अनुवाद में तनाव को मिटाया नहीं गया।
translation_notes:
  register: आधुनिक मानक हिंदी में सहज किंतु गरिमापूर्ण कथात्मक शैली रखी गई है। “पुरनियों” से नागरिक अगुओं का पारंपरिक पद और “कुलीन लोगों” से उच्च सामाजिक प्रतिष्ठा स्पष्ट होती है।
