  choice: इन घटनाओं के बाद
  rationale: यह रूप नए कथात्मक प्रसंग का आरम्भ करता है; हिंदी में अलग से ‘और ऐसा हुआ’ जोड़ना अनावश्यक और कृत्रिम होगा।
