  text: After these things[a], Naboth the Jezreelite had a vineyard in Jezreel, beside the palace of Ahab king of Samaria.
translation:
  language: hi
  text: इन घटनाओं के बाद[a], यिज्रेली नाबोत की एक दाख की बारी यिज्रेल में थी। वह सामरिया के राजा अहाब के महल के पास थी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “इन घटनाओं के बाद यिज्रेली नाबोत की एक दाख की बारी थी।” इब्रानी में शाब्दिक रूप से, “नाबोत के लिए एक दाख की बारी थी”; यह रचना स्वामित्व का भाव व्यक्त करती है।
