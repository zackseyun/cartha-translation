source:
  edition: WLC
  text: וְ/דִבַּרְתָּ֨ אֵלָ֜י/ו לֵ/אמֹ֗ר כֹּ֚ה אָמַ֣ר יְהוָ֔ה הֲ/רָצַ֖חְתָּ וְ/גַם יָרָ֑שְׁתָּ וְ/דִבַּרְתָּ֨ אֵלָ֜י/ו לֵ/אמֹ֗ר כֹּ֚ה אָמַ֣ר יְהוָ֔ה בִּ/מְק֗וֹם אֲשֶׁ֨ר לָקְק֤וּ הַ/כְּלָבִים֙ אֶת דַּ֣ם נָב֔וֹת יָלֹ֧קּוּ הַ/כְּלָבִ֛ים אֶת דָּמְ/ךָ֖ גַּם אָֽתָּה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/021/019.yaml
  text: 'And you shall speak to him[a], saying, ‘Thus says Yahweh: Have you murdered and also taken possession?’ And you shall speak to him, saying, ‘Thus says Yahweh: In the place where the dogs licked the blood of Naboth[b], the dogs shall lick your blood—you also.’'
translation:
  language: hi
  text: 'और उससे यह कहना, “याहवे यों कहता है: ‘क्या तूने हत्या की और कब्ज़ा भी कर लिया?’” फिर उससे यह कहना, “याहवे यों कहता है: ‘जिस स्थान पर कुत्तों ने नाबोत का खून चाटा था, उसी स्थान पर कुत्ते तेरा खून चाटेंगे—तेरा भी।’”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְדִבַּרְתָּ אֵלָיו לֵאמֹר
  choice: और उससे यह कहना / फिर उससे यह कहना
  rationale: आज्ञार्थक संदर्भ में यह स्वाभाविक हिन्दी है और इब्रानी में दोहराए गए भविष्यद्वाणी-संबंधी निर्देश को भी बनाए रखता है।
- source_word: כֹּה אָמַר יְהוָה
  choice: याहवे यों कहता है
  rationale: मानक संदेशवाहक सूत्र की गरिमा और प्रत्यक्षता बनाए रखी गई है; יהוה को उसके व्यक्तिगत नाम ‘याहवे’ से लिखा गया है।
- source_word: הֲרָצַחְתָּ
  choice: क्या तूने हत्या की
  rationale: רצח सामान्यतः गैरकानूनी या दोषपूर्ण हत्या का बोध कराता है; ‘हत्या’ आरोप की नैतिक और न्यायिक तीव्रता को व्यक्त करता है।
- source_word: וְגַם יָרָשְׁתָּ
  choice: और कब्ज़ा भी कर लिया
  rationale: संदर्भ में अहाब ने नाबोत की दाख की बारी अपने अधिकार में ले ली थी। ‘कब्ज़ा कर लिया’ अनुचित अधिग्रहण का भाव देता है, पर मूल में न आए ‘विरासत’ जैसे विवरण नहीं जोड़ता।
- source_word: בִּמְקוֹם אֲשֶׁר
  choice: जिस स्थान पर ... उसी स्थान पर
  rationale: इब्रानी स्थानवाचक संबंध को स्पष्ट, स्वाभाविक हिन्दी में व्यक्त करता है और न्याय के उसी स्थान पर घटित होने का बल बनाए रखता है।
- source_word: לָקְקוּ ... יָלֹקּוּ
  choice: चाटा था ... चाटेंगे
  rationale: भूत और भविष्य दोनों में एक ही हिन्दी धातु दोहराकर मूल की अलंकारिक समानता और भयावह चित्र सुरक्षित रखा गया है।
- source_word: דַּם נָבוֹת
  choice: नाबोत का खून
  rationale: संरचना का सीधा और सामान्य हिन्दी रूप; ‘खून’ कुत्तों के चाटने की ठोस छवि में ‘रक्त’ से अधिक स्वाभाविक है।
- source_word: אֶת דָּמְךָ גַּם אָתָּה
  choice: तेरा खून भी ...—हाँ, तेरा ही
  rationale: גם אתה के अचानक, व्यक्तिगत बल को केवल ‘भी’ में समेटने के बजाय अंतिम पुष्टि से सुरक्षित रखा गया है।
theological_decisions:
- issue: הֲרָצַחְתָּ में अहाब पर लगाए गए आरोप की नैतिक शक्ति
  choice: ‘क्या तूने हत्या की’
  alternative: ‘क्या तूने मार डाला’
  rationale: רצח यहाँ केवल किसी को मारने की घटना नहीं, बल्कि नाबोत की दोषपूर्ण हत्या में अहाब की जवाबदेही पर भविष्यद्वाणी का अभियोग है। ‘हत्या’ इसी नैतिक-न्यायिक अर्थ को रखता है।
- issue: גם אתה का emphatic व्यक्तिगत प्रयोग
  choice: ‘तेरा खून भी चाटेंगे—हाँ, तेरा ही’
  alternative: ‘तेरा खून भी चाटेंगे’
  rationale: अंतिम स्वतंत्र सर्वनाम अहाब पर व्यक्तिगत रूप से आने वाले समान अपमान और दंड को रेखांकित करता है; ‘हाँ, तेरा ही’ इस अप्रत्याशित अंतिम बल को हिन्दी में बनाए रखता है।
- issue: अहाब को संबोधन का वचन और स्तर
  choice: एकवचन ‘तू/तेरा’
  alternative: आदरार्थी ‘तुम/तुम्हारा’ या ‘आप/आपका’
  rationale: भविष्यद्वाणी का आरोप तीखा और प्रत्यक्ष है तथा इब्रानी रूप स्पष्टतः पुल्लिंग एकवचन हैं। आधुनिक हिन्दी में ‘तू’ यहाँ अपमान जोड़ने के लिए नहीं, न्यायिक टकराव की सीधी तीव्रता दिखाने के लिए है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु प्रत्यक्ष भविष्यद्वाणी-शैली अपनाई गई है। मूल की दोनों ‘उससे कहना’ संरचनाएँ और समान क्रिया ‘चाटना’ की पुनरावृत्ति रखी गई है। इस पद के लिए कोई पादटिप्पणी आवश्यक नहीं समझी गई, क्योंकि ‘हत्या’ और अंतिम बल दोनों को मुख्य पाठ में स्वाभाविक रूप से व्यक्त किया जा सकता है।
