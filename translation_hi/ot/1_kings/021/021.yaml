  edition: WLC
  text: הִנְ/נִ֨י מבי אֵלֶ֨י/ךָ֙ רָעָ֔ה וּ/בִעַרְתִּ֖י אַחֲרֶ֑י/ךָ וְ/הִכְרַתִּ֤י לְ/אַחְאָב֙ מַשְׁתִּ֣ין בְּ/קִ֔יר וְ/עָצ֥וּר וְ/עָז֖וּב בְּ/יִשְׂרָאֵֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/021/021.yaml
  text: Behold[a], I am bringing disaster upon you, and I will sweep away after you, and I will cut off from Ahab every male, both bond and free in Israel.
translation:
  language: hi
  text: “देखो, मैं तुझ पर विपत्ति लाने वाला हूँ। मैं तेरे वंश[c] को मिटा दूँगा और इस्राएल में अहाब के प्रत्येक पुरुष[a] को—चाहे वह बंधुआ हो या स्वतंत्र[b]—नष्ट कर दूँगा।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से, “जो दीवार की ओर पेशाब करता है”—हर पुरुष के लिए प्रयुक्त एक रूखा मुहावरा।
    reason: शाब्दिक मुहावरे और उसके अशिष्ट स्वर को पाठक के लिए सुरक्षित रखना।
  - marker: b
    text: इब्रानी में शाब्दिक रूप से, “रोका हुआ और छोड़ा हुआ।” इस युग्म का सटीक अर्थ अनिश्चित है; यहाँ इसका आशय किसी भी पुरुष को अपवाद न बनाना है।
    reason: कठिन इब्रानी युग्म की वास्तविक अर्थगत अनिश्चितता को स्पष्ट करना।
  - marker: c
    text: इब्रानी में शाब्दिक रूप से, “तेरे पीछे।” इस न्याय-सूत्र में इसका आशय तेरे बाद आने वाले वंशजों से है।
    reason: मुहावरेदार इब्रानी अभिव्यक्ति के शाब्दिक रूप और उसके संदर्भगत अर्थ को स्पष्ट करना।
lexical_decisions:
- source_word: הִנְנִי
  choice: देख, मैं ... लाने वाला हूँ
  rationale: भविष्यद्वाणी की तात्कालिक और गंभीर घोषणा को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: מֵבִיא אֵלֶיךָ רָעָה
  choice: मैं तुझ पर विपत्ति लाने वाला हूँ
  rationale: न्याय के इस प्रसंग में רָעָה नैतिक बुराई के बजाय आने वाली विपत्ति या विनाशकारी संकट को दर्शाता है।
- source_word: וּבִעַרְתִּי אַחֲרֶיךָ
  choice: मैं तेरे पीछे का सब कुछ मिटा दूँगा
  rationale: ביער के पूरी तरह हटा देने के भाव और אַחֲרֶיךָ के ‘तेरे पीछे’ संबंध को बनाए रखता है, पर मुख्य पाठ में इसे केवल ‘वंश’ कहकर निहित वस्तु को अनावश्यक रूप से सीमित नहीं करता।
- source_word: וְהִכְרַתִּי לְאַחְאָב
  choice: अहाब के ... को नष्ट कर दूँगा
  rationale: כרת के न्याय-सूत्र में पूर्ण उच्छेद के अर्थ को सहज हिन्दी में व्यक्त करता है।
- source_word: מַשְׁתִּין בְּקִיר
  choice: हर पुरुष
  rationale: यह पुरुषों के लिए प्रयुक्त एक रूखा इब्रानी मुहावरा है; मुख्य पाठ में उसका स्पष्ट अर्थ दिया गया है और शाब्दिक रूप पादटिप्पणी में रखा गया है।
- source_word: וְעָצוּר וְעָזוּב
  choice: चाहे बंधुआ हो या स्वतंत्र
  rationale: इस विनाश-सूत्र में यह युग्म किसी अपवाद के बिना सभी को समेटता है। पारंपरिक अर्थ मुख्य पाठ में पठनीय है, जबकि मूल शब्दों की अनिश्चितता पादटिप्पणी में सुरक्षित है।
- source_word: בְּיִשְׂרָאֵל
  choice: इस्राएल में
  rationale: स्थानवाचक अर्थ का सीधा और स्वाभाविक हिन्दी रूप।
theological_decisions:
- issue: ईश्वरीय न्याय के संदर्भ में רָעָה का अनुवाद
  choice: विपत्ति
  alternative: बुराई
  rationale: यहाँ शब्द दंडस्वरूप आने वाली विपत्ति को सूचित करता है; ‘बुराई’ हिन्दी में नैतिक दुष्टता का अर्थ दे सकती है, जो इस प्रसंग में अपेक्षित नहीं है।
- issue: וּבִעַרְתִּי אַחֲרֶיךָ में निहित कर्म
  choice: तेरे पीछे का सब कुछ
  alternative: तेरा वंश
  rationale: प्रसंग अहाब के घराने के उच्छेद की ओर संकेत करता है, फिर भी इब्रानी में ‘वंश’ स्पष्ट संज्ञा के रूप में नहीं है; इसलिए अनुवाद उस संकेत को बनाए रखता है, पर उसे संकीर्ण रूप से निर्धारित नहीं करता।
- issue: וְעָצוּר וְעָזוּב युग्म का अर्थ
  choice: बंधुआ हो या स्वतंत्र
  alternative: रोका हुआ और छोड़ा हुआ
  rationale: युग्म का सटीक संकेत विवादित है, पर सूत्र में उसका कार्य सर्वसमावेशी है। पठनीय पारंपरिक अर्थ मुख्य पाठ में और शाब्दिक अनिश्चितता पादटिप्पणी में दी गई है।
translation_notes:
  register: आधुनिक, गंभीर और सामान्य पाठक के लिए सुबोध हिन्दी। एकवचन ‘तू’ के रूप (‘तुझ’, ‘तेरे’) मूल संबोधन की तीव्रता और राजकीय न्याय-वाणी की प्रत्यक्षता बनाए रखते हैं। रूखे मूल मुहावरे को मुख्य पाठ में शिष्ट अर्थ से और पादटिप्पणी में शाब्दिक रूप से प्रस्तुत किया गया है।
