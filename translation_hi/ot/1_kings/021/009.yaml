- source_word: קִרְאוּ צוֹם
  choice: उपवास की घोषणा करो
  rationale: बहुवचन आज्ञार्थक קרא सार्वजनिक रूप से सामुदायिक उपवास घोषित करने का भाव रखता है।
- source_word: וְהוֹשִׁיבוּ
  choice: बैठाओ
  rationale: हिफ़ील आज्ञार्थक का कारक भाव सुरक्षित है—नाबोत को बैठाने की व्यवस्था करने का आदेश।
- source_word: נָבוֹת
  choice: नाबोत
  rationale: व्यक्तिवाचक नाम का प्रचलित हिन्दी बाइबलीय लिप्यंतरण।
- source_word: בְּרֹאשׁ הָעָם
  choice: लोगों के प्रधान स्थान पर
  rationale: शाब्दिक ‘लोगों के सिर/मुख पर’ सभा में आगे, प्रमुख या सबको दिखाई देने वाले स्थान का संकेत दे सकता है; ‘प्रधान स्थान’ मूल बिंब के प्रमुखता-भाव को रखते हुए हिन्दी में बोधगम्य है।
