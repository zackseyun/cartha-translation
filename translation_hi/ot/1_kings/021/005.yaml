base_translation:
  language: en
  yaml_path: translation/ot/1_kings/021/005.yaml
  text: Then Jezebel his wife came to him and said to him[a], “Why is your spirit so sullen that you are not eating bread?”
translation:
  language: hi
  text: तब उसकी पत्नी ईज़ेबेल उसके पास आई और उससे बोली[a], “तुम्हारा मन इतना उदास क्यों है कि तुम खाना नहीं खा रहे?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इब्रानी में शाब्दिक रूप से: “यह क्या है—तुम्हारा मन उदास है—और तुम रोटी नहीं खा रहे?”'
    reason: मूल इब्रानी की खंडित प्रश्न-संरचना और ‘रोटी’ के शाब्दिक प्रयोग को सुरक्षित रखना।
lexical_decisions:
- source_word: וַתָּבֹא
  choice: तब ... आई
  rationale: वाव-क्रमिक कथा को आगे बढ़ाता है; ‘तब’ स्वाभाविक हिन्दी में घटनाक्रम का क्रम स्पष्ट करता है।
- source_word: אִיזֶבֶל
  choice: ईज़ेबेल
  rationale: व्यक्तिवाचक नाम का प्रचलित हिन्दी लिप्यंतरण।
- source_word: אִשְׁתּוֹ
  choice: उसकी पत्नी
  rationale: सम्बन्धवाचक प्रत्यय सहित संज्ञा का सीधा और स्वाभाविक अनुवाद।
- source_word: וַתְּדַבֵּר אֵלָיו
  choice: उससे बोली
  rationale: प्रत्यक्ष कथन की भूमिका में आधुनिक हिन्दी का स्वाभाविक प्रयोग।
- source_word: מַה זֶּה
  choice: क्यों
  rationale: शाब्दिक अर्थ ‘यह क्या है?’ है, पर यहाँ यह उसकी दशा का कारण पूछने वाला इब्रानी मुहावरा है।
- source_word: רוּחֲךָ
  choice: तुम्हारा मन
  rationale: यहाँ רוּחַ आन्तरिक मनोदशा या भाव को सूचित करता है; ‘मन’ आधुनिक हिन्दी में अर्थ को सहजता से व्यक्त करता है।
- source_word: סָרָה
  choice: इतना उदास
  rationale: शब्द यहाँ खिन्न, विमुख अथवा बुझी हुई मनोदशा दर्शाता है; ‘उदास’ प्रसंग में स्पष्ट और स्वाभाविक है, जबकि ‘इतना’ प्रश्न के बल को व्यक्त करता है।
- source_word: וְאֵינְךָ אֹכֵל לָחֶם
  choice: कि तुम खाना नहीं खा रहे
  rationale: ‘रोटी खाना’ भोजन करने का इब्रानी मुहावरा है; हिन्दी में ‘खाना नहीं खा रहे’ उसका स्वाभाविक अर्थ देता है और כי-विहीन संयुक्त प्रश्न को परिणामसूचक ढंग से जोड़ता है।
