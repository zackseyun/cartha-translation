base_translation:
  language: en
  yaml_path: translation/ot/1_kings/021/020.yaml
  text: Ahab said to Elijah[a], “Have you found me, O my enemy?” And he said, “I have found you, because you have sold yourself to do what is evil in the eyes of Yahweh.”
translation:
  language: hi
  text: अहाब ने एलिय्याह से कहा, “क्या तूने मुझे ढूँढ़ लिया है, हे मेरे शत्रु?” उसने कहा, “मैंने तुझे ढूँढ़ लिया है, क्योंकि तूने याहवे[a] की दृष्टि में बुराई करने के लिए अपने आपको बेच दिया है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'हिब्रू में: ‘YHWH’; इसका उच्चारण प्रायः ‘याहवे’ माना जाता है। हिंदी में इसे परंपरागत रूप से ‘यहोवा’ भी लिखा जाता है और अनुवाद में ‘प्रभु’ किया जाता है।'
    reason: ईश-नाम के लिप्यंतरण और पारंपरिक अनुवाद की जानकारी।
lexical_decisions:
- source_word: הַמְצָאתַנִי / מָצָאתִי
  choice: क्या तूने मुझे ढूँढ़ लिया? / मैंने तुझे ढूँढ़ लिया है
  rationale: दोनों रूपों में מצא की पुनरावृत्ति को समान हिंदी क्रिया से रखा गया है, जिससे संवाद का तीखा शाब्दिक प्रत्युत्तर बना रहता है।
- source_word: אֹיְבִי
  choice: हे मेरे शत्रु
  rationale: प्रथम पुरुष एकवचन प्रत्यय और संबोधन-भाव दोनों को स्पष्ट और गरिमापूर्ण हिंदी में व्यक्त करता है।
- source_word: יַעַן
  choice: क्योंकि
  rationale: यह एलिय्याह के कथन का कारण प्रस्तुत करता है; ‘क्योंकि’ आधुनिक हिंदी में स्वाभाविक है।
- source_word: הִתְמַכֶּרְךָ
  choice: तूने अपने आपको ... बेच दिया है
  rationale: हित्पएल रूप के आत्मवाची अर्थ और बुराई के हाथ स्वयं को बेच देने की सशक्त उपमा को सुरक्षित रखता है।
- source_word: לַעֲשׂוֹת הָרַע
  choice: बुरा काम करने के लिए
  rationale: यह हिंदी में सहज है और बुराई करने की नैतिक क्रिया को स्पष्ट रूप से व्यक्त करता है।
- source_word: בְּעֵינֵי יְהוָה
  choice: यहोवा की दृष्टि में
  rationale: हिब्रू मुहावरे की दिव्य मूल्यांकन की भावना को स्वाभाविक हिंदी में बनाए रखता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिंदी बाइबल-परंपरा में व्यापक रूप से पहचाना जाने वाला निजी नाम है और मूल के चतुरक्षरीय ईश-नाम को किसी उपाधि से प्रतिस्थापित नहीं करता।
theological_decisions:
- issue: ईश-नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: मूल पाठ में निजी ईश-नाम है। ‘यहोवा’ आधुनिक हिंदी पाठकों के लिए परिचित लिप्यंतरण है; पादटिप्पणी ‘याहवे’ और पारंपरिक ‘प्रभु’ को बताती है।
- issue: הִתְמַכֶּרְךָ की आत्म-समर्पण संबंधी उपमा
  choice: अपने आपको ... बेच दिया है
  alternative: अपने आपको ... सौंप दिया है
  rationale: शाब्दिक बिक्री/दासता की उपमा और अहाब की स्वेच्छापूर्ण नैतिक जवाबदेही को बनाए रखा गया है, बिना उसके दार्शनिक आशय को बढ़ाए।
translation_notes:
  register: संवाद में राजा अहाब और भविष्यद्वक्ता एलिय्याह के बीच तीखे, प्रत्यक्ष संबोधन को दिखाने के लिए ‘तू/तुझे’ रखा गया है। शैली आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध है; ‘हे मेरे शत्रु’ संबोधन-भाव को स्पष्ट करता है।
