source:
  edition: WLC
  text: וְ/נָתַתִּ֣י אֶת בֵּיתְ/ךָ֗ כְּ/בֵית֙ יָרָבְעָ֣ם בֶּן נְבָ֔ט וּ/כְ/בֵ֖ית בַּעְשָׁ֣א בֶן אֲחִיָּ֑ה אֶל הַ/כַּ֨עַס֙ אֲשֶׁ֣ר הִכְעַ֔סְתָּ וַֽ/תַּחֲטִ֖א אֶת יִשְׂרָאֵֽל־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/021/022.yaml
  text: And I will make your house like the house of Jeroboam son of Nebat and like the house of Baasha son of Ahijah[a], because of the provocation with which you have provoked me and caused Israel to sin.
translation:
  language: hi
  text: और मैं तेरे घराने[a] को नबात के पुत्र यारोबाम के घराने और अहिय्याह के पुत्र बाशा के घराने के समान कर दूँगा, क्योंकि तूने मुझे क्रोध दिलाया और इस्राएल से पाप करवाया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात् तेरा राजवंश। यहाँ ‘घराना’ अहाब के शाही वंश को सूचित करता है।
    reason: शाही संदर्भ में בַּיִת के वंशगत अर्थ को स्पष्ट करना।
lexical_decisions:
- source_word: וְנָתַתִּי
  choice: और मैं ... के समान कर दूँगा
  rationale: נתן का मूल अर्थ ‘देना’ है, पर इस न्याय-सूत्र में तुलना के साथ यह किसी घराने को पूर्व राजवंशों जैसी दशा में पहुँचा देने का भाव व्यक्त करता है; इसलिए हिंदी में ‘के समान कर दूँगा’ स्वाभाविक और सटीक है।
- source_word: בֵּיתְךָ
  choice: तेरे घराने[a]
  rationale: בַּיִת यहाँ भवन नहीं, अहाब के शाही कुल या राजवंश को सूचित करता है। ‘घराना’ मूल रूपक को बनाए रखते हुए आधुनिक हिंदी में वंशगत अर्थ स्पष्ट करता है।
- source_word: כְּבֵית ... וּכְבֵית
  choice: के घराने और ... के घराने के समान
  rationale: כְ तुलना को सूचित करता है। हिंदी वाक्य-विन्यास में दोनों पूर्व राजघरानों का उल्लेख करके अंत में ‘के समान’ रखना स्वाभाविक है।
- source_word: יָרָבְעָם בֶּן נְבָט
  choice: नबात के पुत्र यारोबाम
  rationale: इब्रानी वंशसूचक पदबंध को हिंदी के स्वाभाविक क्रम में रखा गया है और नामों का प्रचलित लिप्यंतरण अपनाया गया है।
- source_word: בַּעְשָׁא בֶן אֲחִיָּה
  choice: अहिय्याह के पुत्र बाशा
  rationale: वंशसूचक पदबंध का सीधा अनुवाद और नामों का प्रचलित हिंदी लिप्यंतरण किया गया है।
- source_word: אֶל הַכַּעַס אֲשֶׁר הִכְעַסְתָּ
  choice: क्योंकि तूने मुझे क्रोध दिलाया
  rationale: यह पदबंध न्याय का कारण बताता है और כעס के संज्ञा तथा हिफ़ील क्रिया-रूप में निहित ‘क्रोध भड़काने’ के भाव को व्यक्त करता है। हिंदी में संज्ञा और सजातीय क्रिया की पुनरावृत्ति से बचते हुए कारण और भाव दोनों सुरक्षित रखे गए हैं।
- source_word: וַתַּחֲטִא אֶת יִשְׂרָאֵל
  choice: और इस्राएल से पाप करवाया है
  rationale: חטא के हिफ़ील रूप का कारक अर्थ है—किसी से पाप कराना। ‘पाप करवाया’ इस कारणवाचक अर्थ को सीधे व्यक्त करता है।
theological_decisions:
- issue: ‘क्रोध दिलाने’ वाली क्रिया के अप्रकट ईश्वरीय कर्म का अनुवाद
  choice: ‘मुझे’ को स्पष्ट रूप से रखा गया
  alternative: ‘तूने क्रोध भड़काया’ कहकर कर्म को अप्रकट रखना
  rationale: इब्रानी में कर्म प्रत्यक्ष रूप से नहीं आया, पर वक्ता स्वयं यहोवा हैं और प्रसंग स्पष्ट रूप से उन्हीं को क्रोधित करने की बात कहता है। हिंदी में ‘मुझे’ जोड़ना अर्थ स्पष्ट करता है, कोई नया धर्मवैज्ञानिक दावा नहीं जोड़ता।
- issue: राजकीय न्याय-वाणी में בֵּית का अर्थ
  choice: मुख्य पाठ में ‘घराना’ और पादटिप्पणी में ‘राजवंश’ की व्याख्या
  alternative: मुख्य पाठ में सीधे ‘राजवंश’
  rationale: ‘घराना’ इब्रानी ‘घर’ के वंशगत रूपक को काफी हद तक बनाए रखता है, जबकि पादटिप्पणी स्पष्ट करती है कि यहाँ अहाब का शाही वंश अभिप्रेत है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। राजा से प्रत्यक्ष एकवचन संबोधन के कारण ‘तेरे/तूने’ प्रयुक्त है। वाक्य में मूल न्याय-वाणी की दृढ़ता तथा कारणवाचक संबंध सुरक्षित हैं।
