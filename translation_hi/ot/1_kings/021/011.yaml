  text: So the men of his city—the elders and the nobles who lived in his city—did as Jezebel had sent to them[a], as it was written in the letters that she had sent to them.
translation:
  language: hi
  text: तब उसके नगर के पुरुषों ने—अर्थात् उसके नगर में रहनेवाले पुरनियों और कुलीनों[a] ने—वैसा ही किया जैसा ईज़ेबेल ने उन्हें भेजा था, जैसा उन पत्रों में लिखा था जो उसने उन्हें भेजे थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “प्रतिष्ठित जन”; “कुलीनों” के लिए आया इब्रानी शब्द समाज में प्रतिष्ठित पुरुषों या ऊँचे पद के अधिकारियों को सूचित कर सकता है।
    reason: lexical_alternative
