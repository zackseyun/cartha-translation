- source_word: וַיַּעֲשׂוּ
  choice: के अनुसार किया
  rationale: यहाँ עשה ईज़ेबेल के भेजे संदेश का पालन करने को व्यक्त करता है; यह हिंदी में स्वाभाविक रहते हुए कथन की सीधी शक्ति बनाए रखता है।
- source_word: אַנְשֵׁי עִירוֹ
  choice: उसके नगर के पुरुषों
  rationale: शाब्दिक अर्थ ‘उसके नगर के पुरुष’ है, और आगे उल्लिखित पुरुष नागरिक अगुओं—पुरनियों और कुलीनों—के कारण लिंग-विशिष्ट रूप संदर्भानुकूल है।
- source_word: הַזְּקֵנִים
  choice: पुरनियों
  rationale: नागरिक संदर्भ में यह केवल वृद्ध पुरुषों को नहीं, बल्कि मान्य सामुदायिक अगुओं को दर्शाता है; ‘पुरनिये’ प्रचलित और संक्षिप्त बाइबलीय हिंदी पद है।
- source_word: הַחֹרִים
  choice: कुलीनों
  rationale: यहाँ यह ऊँची सामाजिक प्रतिष्ठा या पद वाले लोगों को सूचित करता है; ‘कुलीन’ नागरिक-न्यायिक संदर्भ में उपयुक्त है।
- source_word: הַיֹּשְׁבִים בְּעִירוֹ
  choice: उसके नगर में रहनेवाले
  rationale: ישב का यहाँ अर्थ निवास करना है; यह आधुनिक हिंदी में स्वाभाविक अभिव्यक्ति है।
- source_word: כַּאֲשֶׁר שָׁלְחָה אֲלֵיהֶם אִיזָבֶל
  choice: ईज़ेबेल के भेजे हुए संदेश के अनुसार
  rationale: मूल में भेजी गई वस्तु व्यक्त नहीं है, पर अगले खंड में पत्रों का उल्लेख उसे स्पष्ट करता है। हिंदी में आवश्यक निहित कर्म को ‘संदेश’ से व्यक्त किया गया है, बिना उसे विशिष्ट आदेशों में बदलने के।
- source_word: כָּתוּב בַּסְּפָרִים
  choice: उन पत्रों में लिखा था
  rationale: इस संदर्भ में סְפָרִים ईज़ेबेल की भेजी हुई लिखित चिट्ठियों को दर्शाता है; ‘पत्र’ ‘पुस्तक’ या ‘दस्तावेज़’ से अधिक सटीक है।
- source_word: אֲשֶׁר שָׁלְחָה אֲלֵיהֶם
  choice: जो उसने उनके पास भेजे थे
  rationale: संबंधवाचक उपवाक्य पत्रों की पहचान करता है और मूल की पुनरुक्ति को बनाए रखता है।
