source:
  edition: WLC
  text: וַֽ/יְהִי֙ כִּ/שְׁמֹ֣עַ אִיזֶ֔בֶל כִּֽי סֻקַּ֥ל נָב֖וֹת וַ/יָּמֹ֑ת וַ/תֹּ֨אמֶר אִיזֶ֜בֶל אֶל אַחְאָ֗ב ק֣וּם רֵ֞שׁ אֶת כֶּ֣רֶם נָב֣וֹת הַ/יִּזְרְעֵאלִ֗י אֲשֶׁ֤ר מֵאֵן֙ לָ/תֶת לְ/ךָ֣ בְ/כֶ֔סֶף כִּ֣י אֵ֥ין נָב֛וֹת חַ֖י כִּי מֵֽת־־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/021/015.yaml
  text: When Jezebel heard that Naboth had been stoned and had died[a], Jezebel said to Ahab, “Get up, take possession of the vineyard of Naboth the Jezreelite, which he refused to give you for silver, because Naboth is not alive; he is dead.”
translation:
  language: hi
  text: जब ईज़ेबेल ने सुना कि नाबोत को पत्थरों से मारा गया था और वह मर गया था, तब उसने अहाब से कहा, “उठो, यिज्रेली नाबोत की उस दाख की बारी पर अधिकार कर लो, जिसे उसने चाँदी के बदले तुम्हें देने से इनकार कर दिया था[a], क्योंकि नाबोत जीवित नहीं है; वह मर चुका है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जिसे उसने तुम्हें पैसों के बदले बेचने से इनकार कर दिया था।” इब्रानी में शाब्दिक रूप से है, “जिसे उसने चाँदी के बदले तुम्हें देने से इनकार किया था।”
    reason: मूल पदबंध का शाब्दिक अर्थ ‘चाँदी के बदले देना’ है, जबकि प्रसंग में संपत्ति बेचने का आशय है; टिप्पणी दोनों को स्पष्ट करती है।
lexical_decisions:
- source_word: וַיְהִי כִּשְׁמֹעַ
  choice: जब ... ने सुना ... तब
  rationale: इब्रानी कथात्मक सूत्र के काल-संबंध को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है, बिना ‘और ऐसा हुआ’ जैसे कृत्रिम पदबंध के।
- source_word: סֻקַּל
  choice: पत्थरों से मारा गया था
  rationale: सקל के निष्क्रिय रूप और पत्थर मारने की ठोस दंड-विधि को स्पष्ट, सामान्य हिन्दी में बनाए रखता है।
- source_word: וַיָּמֹת
  choice: और वह मर गया था
  rationale: यह पत्थर मारे जाने के बाद हुई मृत्यु को अलग घटना के रूप में रखता है और ईज़ेबेल के सुनने से पहले की घटना होने के कारण पूर्ण भूतकाल स्वाभाविक है।
- source_word: קוּם
  choice: उठो
  rationale: आज्ञार्थक क्रिया की तत्परता और सीधापन संक्षिप्त, वर्तमान हिन्दी में सुरक्षित रहता है।
- source_word: רֵשׁ
  choice: अधिकार कर लो
  rationale: ירש यहाँ संपत्ति को अपने अधिकार में लेने का भाव देता है; यह ‘विरासत में लो’ से कम व्याख्यात्मक और प्रसंगानुकूल है।
- source_word: כֶּרֶם
  choice: दाख की बारी
  rationale: अंगूर उगाने की भूमि के लिए प्रचलित बाइबलीय हिन्दी पद है और सामान्य पाठक के लिए समझने योग्य है।
- source_word: הַיִּזְרְעֵאלִי
  choice: यिज्रेली
  rationale: जातिवाचक विशेषण को सीधे रूप में रखकर नाबोत का यिज्रेल से संबंध व्यक्त करता है।
- source_word: מֵאֵן לָתֵת לְךָ בְכֶסֶף
  choice: जिसे उसने चाँदी के बदले तुम्हें देने से इनकार कर दिया था
  rationale: मूल के ‘चाँदी के बदले देना’ को मुख्य पाठ में सुरक्षित रखता है; ‘बेचना’ प्रसंगगत अर्थ है, पर मूल क्रिया का स्पष्ट शब्दार्थ नहीं।
- source_word: אֵין נָבוֹת חַי
  choice: नाबोत जीवित नहीं है
  rationale: अंतिम ‘वह मर चुका है’ से पहले मूल की दोहरी, कठोर घोषणा को ज्यों का त्यों बनाए रखता है।
- source_word: כִּי מֵת
  choice: वह मर चुका है
  rationale: ईज़ेबेल के कथन की अंतिम स्पष्टता और निर्णायक स्वर को व्यक्त करता है।
