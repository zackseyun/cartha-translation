base_translation:
  language: en
  yaml_path: translation/ot/1_kings/021/016.yaml
  text: And when Ahab heard that Naboth was dead[a], Ahab arose to go down to the vineyard of Naboth the Jezreelite[b], to take possession of it.
translation:
  language: hi
  text: जब अहाब ने सुना कि नाबोत मर गया था[a], तब अहाब उठा और यिज्रेली नाबोत की दाख की बारी को अपने अधिकार में लेने के लिए नीचे गया।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “मरा हुआ था।” इब्रानी को मृत्यु से उत्पन्न दशा या पूरी हो चुकी घटना—दोनों रूपों में समझा जा सकता है।
    reason: lexical_alternative
  - marker: b
    text: या “उस पर अधिकार करने के लिए” अथवा “उसे विरासत में लेने के लिए।” इब्रानी क्रिया प्रसंग के अनुसार अधिकार में लेना, अधिकार रखना या विरासत में पाना दर्शा सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כִּשְׁמֹעַ
  choice: जब ... ने सुना
  rationale: यह संरचना कथा में समय-संबंधी उपवाक्य प्रस्तुत करती है। आधुनिक हिन्दी में ‘जब ... ने सुना’ स्वाभाविक है और अनावश्यक प्राचीन शैली से बचती है।
- source_word: מֵת
  choice: मर चुका है
  rationale: यह रूप नाबोत की मृत्यु से उत्पन्न वर्तमान दशा को व्यक्त करता है, जैसा अहाब ने समाचार में सुना; हिन्दी की परोक्ष कथन-शैली में यह स्वाभाविक है।
- source_word: וַיָּקָם
  choice: उठा
  rationale: קום कथा में प्रायः किसी उद्देश्यपूर्ण कार्य या गति के आरम्भ को सूचित करता है। ‘उठा’ मूल क्रिया को संक्षेप और गरिमा के साथ रखता है।
- source_word: לָרֶדֶת
  choice: नीचे गया
  rationale: ירד की दिशात्मक बारीकी ‘नीचे जाना’ है; इसे हिन्दी में बनाए रखा गया है।
- source_word: כֶּרֶם
  choice: दाख की बारी
  rationale: यह आधुनिक हिन्दी बाइबलीय प्रयोग में vineyard का स्पष्ट और परिचित रूप है।
- source_word: הַיִּזְרְעֵאלִי
  choice: यिज्रेली
  rationale: जातिवाचक विशेषण नाबोत का यिज्रेल से संबंध बताता है; ‘यिज्रेली’ इसका सीधा हिन्दी रूप है।
- source_word: לְרִשְׁתּוֹ
  choice: उसे अपने अधिकार में लेने के लिए
  rationale: ירשׁ यहाँ दाख की बारी पर अधिकार ग्रहण करने को दर्शाता है। यह अनुवाद क्रिया की व्यापक अर्थ-सीमा को ध्यान में रखते हुए प्रसंग के अनुकूल है, पर स्वयं क्रिया में ‘छीनना’ जैसी अतिरिक्त तीव्रता नहीं जोड़ता।
