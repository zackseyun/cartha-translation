  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज कथात्मक हिन्दी। ‘पत्थरवाह’ बाइबलीय-न्यायिक प्रसंग में सटीक और प्रचलित है। स्रोत की दोनों पृथक क्रियाएँ—पत्थरवाह किया जाना और मरना—स्पष्ट रूप से रखी गई हैं।
