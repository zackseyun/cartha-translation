translation:
  language: hi
  text: 'तब उन्होंने ईज़ेबेल को संदेश भेजा: “नाबोत को पत्थरों से मारा गया और वह मर गया।”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁלְחוּ
  choice: तब उन्होंने ... संदेश भेजा
  rationale: वाव-क्रमिक कथा को आगे बढ़ाता है, इसलिए ‘तब’ स्वाभाविक है। प्रसंग में भेजी गई वस्तु संदेश है; हिन्दी में ‘संदेश भेजा’ सहज और स्पष्ट है।
- source_word: אֶל אִיזֶבֶל
  choice: ईज़ेबेल के पास
  rationale: אֶל दिशा अथवा प्राप्तकर्ता बताता है। व्यक्ति को संदेश भेजने के लिए आधुनिक हिन्दी में ‘के पास’ स्वाभाविक है; नाम का प्रचलित लिप्यंतरण ‘ईज़ेबेल’ रखा गया है।
- source_word: לֵאמֹר
  choice: 'यह संदेश ... :'
  rationale: इब्रानी का सामान्य कथन-परिचायक सूत्र है। हिन्दी में ‘यह संदेश भेजा:’ उसी कार्य को अधिक स्वाभाविक ढंग से व्यक्त करता है और अनावश्यक ‘यह कहते हुए’ से बचता है।
- source_word: סֻקַּל
  choice: पत्थरवाह किया गया
  rationale: पुअल रूप कर्मवाच्य है। ‘पत्थरवाह किया गया’ न्यायिक ढंग से पत्थर मारने का अर्थ और कर्मवाच्य दोनों सुरक्षित रखता है; मृत्यु को इसी क्रिया में नहीं जोड़ा गया, क्योंकि वह अगली क्रिया में स्पष्ट है।
- source_word: נָבוֹת
  choice: नाबोत
  rationale: व्यक्तिनाम का हिन्दी बाइबल-परंपरा के अनुरूप लिप्यंतरण।
- source_word: וַיָּמֹת
  choice: और वह मर गया
  rationale: क्रिया औपचारिक रूप से क्रमिक घटना ‘और वह मर गया’ बताती है। यह स्रोत की घटना-श्रृंखला को सीधे सुरक्षित रखती है, न कि उसे केवल परिणामी अवस्था ‘वह मर चुका है’ में बदलती है।
