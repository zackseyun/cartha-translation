  text: וַ/יַּתְעֵ֣ב מְאֹ֔ד לָ/לֶ֖כֶת אַחֲרֵ֣י הַ/גִּלֻּלִ֑ים כְּ/כֹל֙ אֲשֶׁ֣ר עָשׂ֣וּ הָ/אֱמֹרִ֔י אֲשֶׁר֙ הוֹרִ֣ישׁ יְהוָ֔ה מִ/פְּנֵ֖י בְּנֵ֥י יִשְׂרָאֵֽל׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/021/026.yaml
  text: He acted very abominably by going after idols[a], according to all that the Amorites had done[b], whom Yahweh drove out before the sons of Israel.
translation:
  language: hi
  text: उसने मूर्तियों[a] के पीछे चलकर अत्यन्त घृणित आचरण किया, उन सब बातों के अनुसार जो एमोरियों ने की थीं, जिन्हें याहवे ने इस्राएलियों[b] के सामने से निकाल दिया था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: मूल इब्रानी शब्द मूर्तियों के लिए अत्यंत तिरस्कारपूर्ण है; इसका भाव “घृणित मूर्तियाँ” या अधिक शाब्दिक रूप में “गोबर-मूर्तियाँ” हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: 'शाब्दिक अर्थ: “इस्राएल के पुत्रों।”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּתְעֵב מְאֹד
  choice: बहुत ही घिनौने काम करता रहा
  rationale: यह क्रियात्मक अनुवाद उसके आचरण पर लगाए गए तीव्र नैतिक मूल्यांकन को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: לָלֶכֶת אַחֲרֵי
  choice: के पीछे चलकर
  rationale: यह इब्रानी रूपक को बनाए रखता है और उपासना तथा निष्ठा में मूर्तियों का अनुसरण करने का भाव देता है।
- source_word: הַגִּלֻּלִים
  choice: मूर्तियों
  rationale: मुख्य पाठ में यह सबसे स्पष्ट और सहज शब्द है; मूल शब्द का अत्यंत तिरस्कारपूर्ण भाव पादटिप्पणी में स्पष्ट किया गया है।
- source_word: כְּכֹל אֲשֶׁר עָשׂוּ
  choice: ठीक उन सब कामों के अनुसार जो ... ने किए थे
  rationale: यह तुलना और सम्पूर्णता, दोनों को व्यक्त करते हुए इब्रानी संरचना के निकट रहता है।
- source_word: הָאֱמֹרִי
  choice: एमोरियों
  rationale: इब्रानी में रूप एकवचन होते हुए भी यहाँ सामूहिक अर्थ रखता है; हिन्दी में बहुवचन स्वाभाविक है।
- source_word: הוֹרִישׁ
  choice: निकाल दिया था
  rationale: यह भूमि से बेदखल कर बाहर करने के कारणवाचक अर्थ को सरल और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिन्दी बाइबलीय प्रयोग में व्यापक रूप से पहचाना जाने वाला दैवी नाम है और मूल में आए व्यक्तिगत नाम को शीर्षक से नहीं बदलता।
- source_word: מִפְּנֵי
  choice: के सामने से
  rationale: यह इस्राएल की उपस्थिति के आगे से उन जातियों को हटाने का स्थानिक भाव सुरक्षित रखता है।
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: इस्राएलियों
  rationale: यह आधुनिक हिन्दी में पूरे इस्राएली समुदाय के लिए स्वाभाविक सामूहिक अभिव्यक्ति है; इसका शाब्दिक रूप पादटिप्पणी में दिया गया है।
theological_decisions:
- issue: दैवी नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ में दैवी व्यक्तिगत नाम है। हिन्दी में प्रचलित और आसानी से पहचाने जाने वाले रूप ‘यहोवा’ द्वारा उसे नाम के रूप में ही रखा गया है; ‘याहवे’ अधिक अकादमिक लिप्यंतरण है।
- issue: בְּנֵי יִשְׂרָאֵל की सामूहिक अभिव्यक्ति
  choice: इस्राएलियों
  alternative: इस्राएल के पुत्रों
  rationale: सन्दर्भ पूरे वाचा-समुदाय का है, केवल पुरुष वंशजों का नहीं। ‘इस्राएलियों’ से सामूहिक अर्थ स्वाभाविक हिन्दी में आता है, जबकि शाब्दिक रूप पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट हिन्दी। ‘पीछे चलकर’ मूल के निष्ठा-अनुसरण वाले रूपक को बनाए रखता है; ‘घिनौने काम’ तीव्र नैतिक निन्दा को सहज भाषा में व्यक्त करता है।
