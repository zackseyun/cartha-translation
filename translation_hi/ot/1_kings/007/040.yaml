  text: וַ/יַּ֣עַשׂ חִיר֔וֹם אֶת הַ֨/כִּיֹּר֔וֹת וְ/אֶת הַ/יָּעִ֖ים וְ/אֶת הַ/מִּזְרָק֑וֹת וַ/יְכַ֣ל חִירָ֗ם לַֽ/עֲשׂוֹת֙ אֶת כָּל הַ/מְּלָאכָ֔ה אֲשֶׁ֥ר עָשָׂ֛ה לַ/מֶּ֥לֶךְ שְׁלֹמֹ֖ה בֵּ֥ית יְהוָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/040.yaml
  text: And Hiram made the basins[a], the shovels, and the bowls. So Hiram finished doing all the work that he did for King Solomon for the house of Yahweh.
translation:
  language: hi
  text: और हीराम ने धोने के पात्र, फावड़े और कटोरे[a] बनाए। इस प्रकार हीराम ने वह सारा काम पूरा किया जो उसने राजा सुलैमान के लिए याहवे के भवन हेतु किया था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “छिड़काव के कटोरे,” अर्थात बलि-संबंधी विधियों में प्रयुक्त कटोरे।
    reason: मूल हिब्रू מִזְרָקוֹת का व्यापक अर्थ ‘कटोरे’ है; इसका विशिष्ट अनुष्ठानिक अर्थ पादटिप्पणी में रखा गया है।
lexical_decisions:
- source_word: כִּיֹּרוֹת
  choice: हौद
  rationale: यह शब्द मंदिर में धुलाई के लिए रखे बड़े पात्रों को दर्शाता है; ‘हौद’ आकार और उपयोग दोनों को सहज रूप से व्यक्त करता है।
- source_word: יָּעִים
  choice: फावड़े
  rationale: यह राख या अंगारे हटाने के उपकरणों का सामान्य पद है; ‘फावड़े’ आधुनिक हिन्दी में स्वाभाविक और स्पष्ट है।
- source_word: מִּזְרָקוֹת
  choice: कटोरे
  rationale: यह बलि के रक्त या अन्य द्रव ग्रहण करने अथवा छिड़कने के पात्रों को दर्शाता है; मुख्य पाठ में ‘कटोरे’ सुबोध है, जबकि विशेष अनुष्ठानिक अर्थ पादटिप्पणी में रखा गया है।
- source_word: וַיְכַל
  choice: पूरा किया
  rationale: यह क्रिया सौंपे गए काम की समाप्ति या पूर्णता बताती है; ‘पूरा किया’ संक्षिप्त और स्वाभाविक है।
- source_word: כָּל הַמְּלָאכָה
  choice: सारा काम
  rationale: מְלָאכָה काम या कारीगरी का व्यापक अर्थ रखता है; ‘सारा काम’ बिना अनावश्यक विशिष्टीकरण के सारांश को व्यक्त करता है।
- source_word: בֵּית יְהוָה
  choice: यहोवा का भवन
  rationale: ‘भवन’ मूल के ‘घर’ वाले रूपक को बनाए रखते हुए मंदिर के संदर्भ में गरिमापूर्ण और स्पष्ट है; יהוה को व्यक्तिगत नाम ‘यहोवा’ के रूप में रखा गया है।
- source_word: חִירוֹם / חִירָם
  choice: हीराम
  rationale: मूल में नाम की वर्तनी बदलती है, पर दोनों रूप एक ही व्यक्ति के हैं; हिन्दी में प्रचलित एकरूप नाम ‘हीराम’ रखा गया है।
- source_word: עָשָׂה ... לַמֶּלֶךְ שְׁלֹמֹה
  choice: राजा सुलैमान का वह सारा काम ... जो उसने किया था
  rationale: पहले עשה को वस्तुओं के संदर्भ में ‘बनाए’ और सारांश में ‘काम ... किया’ कहना हिन्दी में स्वाभाविक है तथा मूल की पुनरावृत्ति का भाव भी पर्याप्त रूप से बचाता है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: याहवे / प्रभु
  rationale: मूल पाठ में चार अक्षरों वाला व्यक्तिगत ईश्वरीय नाम सीधे आया है। हिन्दी के सामान्य पाठकों के लिए परिचित रूप ‘यहोवा’ नाम की विशिष्टता बनाए रखता है और उसे केवल उपाधि ‘प्रभु’ से नहीं बदलता।
- issue: לַמֶּלֶךְ ... בֵּית יְהוָה के संबंध का निरूपण
  choice: यहोवा के भवन के लिए राजा सुलैमान का ... काम
  alternative: यहोवा के भवन में राजा सुलैमान के लिए ... काम
  rationale: यह रचना काम को राजा सुलैमान के लिए/उसके आदेश पर और यहोवा के भवन के निमित्त किए जाने से जोड़ती है। हिन्दी में ‘राजा सुलैमान का ... काम’ और ‘भवन के लिए’ स्थान की अपेक्षा प्रयोजन को अधिक ठीक व्यक्त करते हैं।
translation_notes:
  register: आधुनिक मानक हिन्दी, सरल किंतु गरिमापूर्ण शैली। मंदिर-सामग्री के लिए सुबोध शब्द चुने गए हैं और मूल के प्रयोजनसूचक ‘के लिए’ को बनाए रखा गया है।
