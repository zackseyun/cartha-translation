base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/003.yaml
  text: It was paneled with cedar above[a], over the side chambers that were on the pillars, forty-five in all, fifteen to a row.
translation:
  language: hi
  text: ऊपर से वह देवदार की लकड़ी से मढ़ा हुआ था[a], उन पार्श्व-कक्षों के ऊपर जो खंभों पर थे—कुल पैंतालीस, प्रत्येक पंक्ति में पंद्रह।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “ऊपर से वह देवदार की लकड़ी से ढका हुआ था, उन पार्श्व-संरचनाओं के ऊपर जो खंभों पर थीं।” यहाँ प्रयुक्त इब्रानी वास्तु-शब्द कठिन हैं; विशेषकर צלעות का अर्थ “पहलू,” “पसलियाँ,” “पार्श्व-कक्ष” या “पार्श्व-संरचनाएँ” हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְסָפֻן
  choice: मढ़ा हुआ था
  rationale: निष्क्रिय रूप किसी सतह को परिष्करण-सामग्री से ढकने का भाव देता है; वास्तु-संदर्भ में यह सामान्य ‘ढका’ से अधिक सटीक है, पर ‘छाया हुआ’ जितना संकीर्ण नहीं।
- source_word: בָּאֶרֶז
  choice: देवदार की लकड़ी से
  rationale: בְּ यहाँ निर्माण-सामग्री बताता है; हिंदी में ‘देवदार की लकड़ी से’ स्पष्ट और स्वाभाविक है।
- source_word: מִמַּעַל
  choice: ऊपर से
  rationale: यह संरचना के ऊपरी भाग की स्थानीय स्थिति बताता है; ‘ऊपर से’ इस वास्तु-वर्णन में सहज है।
- source_word: עַל הַצְּלָעֹת
  choice: पार्श्व-कक्षों के ऊपर
  rationale: צלעות का मूल अर्थ ‘पहलू/पसलियाँ’ है, किंतु वास्तु-संदर्भ में यह पार्श्व-कक्षों या पार्श्व-संरचनाओं को सूचित कर सकता है; मुख्य पाठ में संभावित वास्तु-अर्थ रखा गया है और अनिश्चितता पादटिप्पणी में बताई गई है।
- source_word: אֲשֶׁר עַל הָעַמּוּדִים
  choice: जो खंभों पर थे
  rationale: इब्रानी संबंधवाचक उपवाक्य और स्थान-संबंध को निकटता से बनाए रखता है, बिना यह अतिरिक्त रूप से तय किए कि वे खंभों पर किस प्रकार टिके थे।
- source_word: אַרְבָּעִים וַחֲמִשָּׁה
  choice: कुल पैंतालीस
  rationale: संख्या पूर्वोक्त वास्तु-तत्त्वों की कुल गिनती प्रतीत होती है; ‘कुल’ हिंदी में उसके सारांशात्मक भाव को स्पष्ट करता है।
- source_word: חֲמִשָּׁה עָשָׂר הַטּוּר
  choice: प्रत्येक पंक्ति में पंद्रह
  rationale: טור का अर्थ पंक्ति या कतार है; वाक्य कुल पैंतालीस को तीन पंक्तियों में पंद्रह-पंद्रह के रूप में वितरित बताता है।
