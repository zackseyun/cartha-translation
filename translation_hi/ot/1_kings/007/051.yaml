  text: וַ/תִּשְׁלַם֙ כָּל הַ/מְּלָאכָ֔ה אֲשֶׁ֥ר עָשָׂ֛ה הַ/מֶּ֥לֶךְ שְׁלֹמֹ֖ה בֵּ֣ית יְהוָ֑ה וַ/יָּבֵ֨א שְׁלֹמֹ֜ה אֶת קָדְשֵׁ֣י דָּוִ֣ד אָבִ֗י/ו אֶת הַ/כֶּ֤סֶף וְ/אֶת הַ/זָּהָב֙ וְ/אֶת הַ/כֵּלִ֔ים נָתַ֕ן בְּ/אֹצְר֖וֹת בֵּ֥ית יְהוָֽה־־׀־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/051.yaml
  text: So all the work that King Solomon did for the house of Yahweh was finished. And Solomon brought in the holy things of David his father—the silver[a], the gold, and the vessels—and put them in the treasuries of the house of Yahweh.
translation:
  language: hi
  text: इस प्रकार यहोवा के भवन का वह सारा काम, जो राजा सुलैमान ने किया था, पूरा हो गया। फिर सुलैमान अपने पिता दाऊद की पवित्र ठहराई हुई वस्तुएँ[a]—चाँदी, सोना और पात्र—भीतर लाया और उन्हें यहोवा के भवन के भंडारों में रख दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “अपने पिता दाऊद की समर्पित वस्तुएँ।” इब्रानी शब्द उन वस्तुओं को सूचित करता है जिन्हें यहोवा के लिए पवित्र करके अलग रखा गया था।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּשְׁלַם
  choice: पूरा हो गया
  rationale: שלם यहाँ पूर्ण होने का भाव देता है; स्त्रीलिंग क्रिया מְלָאכָה से मेल खाती है। हिंदी में परिणाम को स्वाभाविक रूप से व्यक्त करने के लिए यह रूप चुना गया।
- source_word: כָּל הַמְּלָאכָה
  choice: सारा काम
  rationale: मंदिर-निर्माण और उसकी सज्जा से जुड़े समूचे कार्य को सरल और व्यापक रूप से व्यक्त करता है।
- source_word: בֵּית יְהוָה
  choice: यहोवा का भवन
  rationale: בֵּית का औपचारिक अर्थ 'भवन/घर' सुरक्षित रखा गया है और יְהוָה को उसके व्यक्तिगत वाचा-नाम 'यहोवा' से प्रस्तुत किया गया है।
- source_word: וַיָּבֵא
  choice: भीतर लाया
  rationale: בוא के हिफ़ील रूप में किसी वस्तु को अंदर ले आने का दिशात्मक भाव है।
- source_word: קָדְשֵׁי דָּוִד אָבִיו
  choice: अपने पिता दाऊद की पवित्र ठहराई हुई वस्तुएँ
  rationale: קָדְשֵׁי उन वस्तुओं को सूचित करता है जिन्हें पवित्र प्रयोजन के लिए अलग या समर्पित किया गया था। यह अनुवाद पवित्रता और समर्पण दोनों भावों को सहज हिंदी में रखता है।
- source_word: הַכֶּסֶף ... הַזָּהָב ... הַכֵּלִים
  choice: चाँदी, सोना और पात्र
  rationale: כֵּלִים व्यापक रूप से उपकरणों या पात्रों को दर्शाता है; मंदिर के संदर्भ में 'पात्र' संक्षिप्त और उपयुक्त है।
- source_word: נָתַן
  choice: रख दिया
  rationale: נתן का मूल अर्थ देना/रखना है; भंडारों में सुरक्षित रखने के संदर्भ में 'रख दिया' स्वाभाविक है।
- source_word: בְּאֹצְרוֹת
  choice: भंडारों में
  rationale: बहुवचन रूप मंदिर के भंडार-कक्षों अथवा कोषागारों को दर्शाता है; 'भंडारों' से अर्थ स्पष्ट और सहज रहता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ में वाचा का व्यक्तिगत नाम सीधे आया है। हिंदी के सामान्य बाइबलीय प्रयोग में पहचाने जाने योग्य रूप 'यहोवा' रखा गया है, न कि उसे पदवी 'प्रभु' से बदल दिया गया है।
- issue: קָדְשֵׁי का आशय
  choice: पवित्र ठहराई हुई वस्तुएँ
  alternative: समर्पित वस्तुएँ
  rationale: पाठ वस्तुओं की पवित्रता अथवा पवित्र उपयोग के लिए अलग किए जाने का संकेत देता है। मुख्य पाठ में दोनों आयामों को समेटने वाला वाक्यांश रखा गया और वैकल्पिक संक्षिप्त अभिव्यक्ति पादटिप्पणी में दी गई।
translation_notes:
  register: आधुनिक मानक हिंदी में सहज, गरिमापूर्ण शैली अपनाई गई है। 'सारा काम कराया था' से राजा के संरक्षण और निर्देशन में हुए कार्य का भाव आता है, जबकि 'भवन', 'पात्र' और 'भंडार' मूल की ठोस शब्दावली को बनाए रखते हैं।
