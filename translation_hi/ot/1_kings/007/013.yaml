  language: hi
  text: तब राजा सुलैमान ने दूत भेजकर हीराम को सोर से बुलवा लिया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: दूत भेजकर
  rationale: इब्रानी क्रिया का शाब्दिक अर्थ ‘भेजा’ है; प्रसंग में किसी व्यक्ति को बुलाने के लिए संदेशवाहक भेजना निहित है।
- source_word: וַיִּקַּח
  choice: बुलवा लिया
  rationale: मूल क्रिया सामान्यतः ‘लिया’ है, पर भेजने और स्थान ‘सोर से’ के साथ यहाँ इसका भाव हीराम को अपने पास बुलाकर मँगवाने का है; ‘ले आया’ से यह भ्रम हो सकता है कि सुलैमान स्वयं गया था।
- source_word: חִירָם
  choice: हीराम
  rationale: व्यक्ति के इब्रानी नाम का प्रचलित हिन्दी लिप्यंतरण।
- source_word: מִצֹּר
  choice: सोर से
  rationale: צֹר नगर का प्रचलित बाइबलीय हिन्दी नाम ‘सोर’ है; מִן स्रोत या प्रस्थान-बिंदु दर्शाता है।
