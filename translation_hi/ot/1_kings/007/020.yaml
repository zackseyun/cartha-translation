  text: וְ/כֹתָרֹ֗ת עַל שְׁנֵי֙ הָֽ/עַמּוּדִ֔ים גַּם מִ/מַּ֨עַל֙ מִ/לְּ/עֻמַּ֣ת הַ/בֶּ֔טֶן אֲשֶׁ֖ר לְ/עֵ֣בֶר שבכה וְ/הָ/רִמּוֹנִ֤ים מָאתַ֨יִם֙ טֻרִ֣ים סָבִ֔יב עַ֖ל הַ/כֹּתֶ֥רֶת הַ/שֵּׁנִֽית־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/020.yaml
  text: And the capitals were on the two pillars[a], also above, opposite the bulge that was beside the latticework; and the pomegranates were two hundred, in rows all around[c][b], on the second capital.
translation:
  language: hi
  text: दोनों खंभों पर शीर्ष थे, और वे ऊपर, जाली[a] के पार स्थित उभार[b] के सामने भी थे; और दूसरे शीर्ष[c] पर चारों ओर पंक्तियों में अनार की दो सौ आकृतियाँ थीं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात् शीर्षों पर लगी सजावटी जाली या जालीनुमा बनावट।
    reason: cultural_note
  - marker: b
    text: इब्रानी में शाब्दिक अर्थ ‘पेट’ है; यहाँ संभवतः शीर्ष का गोल, फूला हुआ भाग अभिप्रेत है।
    reason: lexical_alternative
  - marker: c
    text: या ‘दूसरे वाले शीर्ष’। इब्रानी में ‘दूसरा’ संभवतः दूसरे खंभे के अनुरूप शीर्ष को अलग पहचान देता है।
    reason: alternative_reading
lexical_decisions:
- source_word: כֹתָרֹת / הַכֹּתֶרֶת
  choice: शीर्ष
  rationale: यहाँ शब्द खंभे के सबसे ऊपरी सजावटी भाग, अर्थात् वास्तुशिल्पीय capital, को दर्शाता है। सामान्य हिन्दी पाठक के लिए ‘शीर्ष’ स्वाभाविक और स्पष्ट है।
- source_word: עַל שְׁנֵי הָעַמּוּדִים
  choice: दोनों खंभों के शीर्ष
  rationale: वाक्य में शीर्षों का दोनों खंभों से संबंध स्पष्ट करने के लिए स्वाभाविक हिन्दी रचना अपनाई गई है।
- source_word: גַּם מִמַּעַל
  choice: ऊपर की ओर भी
  rationale: גַּם की योगात्मकता और מִמַּעַל की ऊर्ध्व स्थिति दोनों बनाए रखी गई हैं।
- source_word: מִלְעֻמַּת הַבֶּטֶן
  choice: उभार के सामने
  rationale: הַבֶּטֶן का शाब्दिक अर्थ ‘पेट’ है, पर वास्तु-वर्णन में यह शीर्ष के गोल उभरे भाग को सूचित करता है; ‘उभार’ आकार को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: אֲשֶׁר לְעֵבֶר שבכה
  choice: जाली के पार स्थित
  rationale: לְעֵבֶר का स्थान-संबंध ‘पार/दूसरी ओर’ हो सकता है। कठिन वास्तुशिल्पीय वाक्य-विन्यास की अनिश्चितता को अत्यधिक निश्चित किए बिना ‘जाली के पार स्थित’ चुना गया है।
- source_word: הָרִמּוֹנִים
  choice: अनार की आकृतियाँ
  rationale: संदर्भ में ये वास्तविक फल नहीं, बल्कि अनार के आकार की सजावटी आकृतियाँ हैं; इसे पाठ में स्पष्ट किया गया है।
- source_word: מָאתַיִם
  choice: दो सौ
  rationale: मूल संख्या का सीधा अनुवाद।
- source_word: טֻרִים סָבִיב
  choice: चारों ओर पंक्तियों में
  rationale: यह सजावटी आकृतियों की पंक्तिबद्ध और घेरेदार व्यवस्था दोनों व्यक्त करता है।
- source_word: עַל הַכֹּתֶרֶת הַשֵּׁנִית
  choice: दूसरे शीर्ष पर
  rationale: הַשֵּׁנִית का सीधा अर्थ ‘दूसरा’ है; जोड़ी के संदर्भ में ‘दूसरा’ या ‘दूसरा वाला’ दोनों संभव हैं।
