translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए बोधगम्य रखी गई है। स्थापत्य के अपेक्षाकृत तकनीकी शब्द ‘capital’ के लिए ‘शीर्ष-मुकुट’ चुना गया है, और वाक्य में दीर्घ विवरण को डैश के सहारे स्पष्ट किया गया है।
