base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/042.yaml
  text: and the four hundred pomegranates for the two latticeworks[a], two rows of pomegranates for each latticework[b], to cover the two bowl-shaped capitals that were on the tops of the pillars.
translation:
  language: hi
  text: और दोनों जालियों[a] के लिए चार सौ अनार—हर जाली पर अनारों की दो पंक्तियाँ—ताकि स्तंभों के ऊपर के दोनों कटोरेनुमा शीर्षों[b] को ढकें।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘जालीदार सजावटें’। इब्रानी शब्द शीर्षों पर बनी खुली, जालीनुमा सजावटी कारीगरी को दर्शाता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, ‘शीर्षों के दोनों कटोरे’।
    reason: lexical_alternative
lexical_decisions:
- source_word: רִמֹּנִים
  choice: अनार
  rationale: इब्रानी संज्ञा का सीधा अर्थ ‘अनार’ है। संदर्भ से ये सजावटी आकृतियाँ हैं, फिर भी मूल पाठ के ठोस शब्द को बनाए रखा गया है।
- source_word: שְׂבָכוֹת
  choice: जालियाँ
  rationale: यह शब्द शीर्ष-मुकुटों पर बनी जालीदार सजावटी कारीगरी को दर्शाता है। ‘जालियाँ’ आधुनिक हिन्दी में सहज और स्पष्ट है।
- source_word: טוּרִים
  choice: पंक्तियाँ
  rationale: यह व्यवस्थित कतारों को सूचित करता है; अनारों की सजावटी बनावट के लिए ‘पंक्तियाँ’ स्वाभाविक है।
- source_word: לַשְּׂבָכָה הָאֶחָת
  choice: हर जाली पर
  rationale: शाब्दिक रूप ‘एक जाली के लिए’ है, पर दो जालियों के संदर्भ में प्रयोग वितरणात्मक है; ‘हर जाली पर’ आशय को स्पष्ट रखता है।
- source_word: לְכַסּוֹת
  choice: ताकि ... ढकें
  rationale: क्रिया का यह रूप उद्देश्य व्यक्त करता है; ‘ढकें’ इसका सीधा और प्रसंगानुकूल अनुवाद है।
- source_word: גֻּלֹּת
  choice: कटोरे के आकार के
  rationale: संज्ञा गोल या कटोरे जैसी बनावट को दर्शाती है। हिन्दी में वास्तु-रूप को समझने योग्य बनाने के लिए आकार को स्पष्ट किया गया है।
- source_word: כֹּתָרֹת
  choice: शीर्ष-मुकुटों
  rationale: वास्तु-संदर्भ में यह खंभों के ऊपर के अलंकृत भागों, अर्थात capitals, को दर्शाता है। ‘शीर्ष-मुकुट’ तकनीकी अर्थ और मुकुट-बिंब दोनों को व्यक्त करता है।
- source_word: עַל פְּנֵי הָעַמּוּדִים
  choice: खंभों के ऊपर लगे
  rationale: शाब्दिक अभिव्यक्ति ‘खंभों के मुख/सामने पर’ है; वास्तु-संदर्भ में शीर्ष-मुकुटों की स्थिति खंभों के ऊपर है, जिसे सहज हिन्दी में व्यक्त किया गया है।
