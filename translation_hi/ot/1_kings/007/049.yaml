translation_notes:
  register: आधुनिक, गरिमापूर्ण और सहज हिंदी अपनाई गई है। पद पिछले वाक्य की सूची को आगे बढ़ाता है, इसलिए आरंभ में ‘और’ तथा सूचीबद्ध संरचना बनाए रखी गई है। सभी पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित हैं।
