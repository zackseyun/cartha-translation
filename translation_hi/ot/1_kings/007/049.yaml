  text: וְ/אֶת הַ֠/מְּנֹרוֹת חָמֵ֨שׁ מִ/יָּמִ֜ין וְ/חָמֵ֧שׁ מִ/שְּׂמֹ֛אול לִ/פְנֵ֥י הַ/דְּבִ֖יר זָהָ֣ב סָג֑וּר וְ/הַ/פֶּ֧רַח וְ/הַ/נֵּרֹ֛ת וְ/הַ/מֶּלְקַחַ֖יִם זָהָֽב־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/049.yaml
  text: and the lampstands[a], five on the right and five on the left, before the inner sanctuary, of pure gold; and the flowers, the lamps, and the tongs[c][b], of gold.
translation:
  language: hi
  text: और भीतरी पवित्रस्थान[a] के सामने शुद्ध सोने[b] की दीपदानियाँ—पाँच दाहिनी ओर और पाँच बाईं ओर—और सोने के फूल, दीपक और चिमटे[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “परमपवित्र स्थान।” इब्रानी דְּבִיר मंदिर के सबसे भीतरी कक्ष को सूचित करता है।
    reason: lexical_alternative
  - marker: b
    text: या “परिष्कृत सोने की।”
    reason: lexical_alternative
  - marker: c
    text: या “बाती सँवारने के औज़ार।”
    reason: lexical_alternative
lexical_decisions:
- source_word: מְּנֹרוֹת
  choice: दीपदानियाँ
  rationale: यह शब्द अलग-अलग दीपकों को नहीं, तेल के दीपक रखने वाले आधारों को सूचित करता है; ‘दीपदानी’ आधुनिक हिंदी में स्वाभाविक और सटीक है।
- source_word: מִיָּמִין ... מִשְּׂמֹאול
  choice: दाहिनी ओर ... बाईं ओर
  rationale: मूल पाठ सापेक्ष दिशाएँ देता है। मंदिर की दिशा के आधार पर ‘दक्षिण ... उत्तर’ संभव है, पर मुख्य पाठ में शाब्दिक स्थान-संबंध सुरक्षित रखा गया है।
- source_word: לִפְנֵי הַדְּבִיר
  choice: भीतरी पवित्रस्थान के सामने
  rationale: דְּבִיר मंदिर के सबसे भीतरी कक्ष को दर्शाता है। यह अनुवाद उसका स्थान और पवित्र उपयोग स्पष्ट करता है, जबकि वैकल्पिक पारंपरिक नाम पादटिप्पणी में दिया गया है।
- source_word: זָהָב סָגוּר
  choice: शुद्ध सोना
  rationale: यह पद उच्च गुणवत्ता के परिष्कृत सोने का संकेत देता है; ‘शुद्ध सोना’ हिंदी में संक्षिप्त और सहज समतुल्य है।
- source_word: הַפֶּרַח
  choice: फूल
  rationale: एकवचन रूप यहाँ संभवतः सामूहिक अर्थ में दीपदानियों की पुष्पाकार सजावट को बताता है; हिंदी में ‘फूल’ रूप दोनों वचनों में स्वाभाविक है।
- source_word: הַנֵּרֹת
  choice: दीपक
  rationale: ये दीपदानियों पर रखे जाने वाले अलग-अलग तेल के दीपक हैं।
- source_word: הַמֶּלְקַחַיִם
  choice: चिमटे
  rationale: यह दीपकों की देखभाल में प्रयुक्त पकड़ने या बाती सँवारने के औज़ार को दर्शाता है; ‘चिमटे’ सीधा शब्दार्थ है, जबकि अधिक कार्यपरक विकल्प पादटिप्पणी में है।
- source_word: זָהָב
  choice: सोने के
  rationale: अंतिम ‘सोना’ फूलों, दीपकों और चिमटों—तीनों पर लागू होता है; हिंदी में ‘सोने के’ सूची की शैली को स्वाभाविक रखता है।
