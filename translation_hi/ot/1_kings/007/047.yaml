source:
  edition: WLC
  text: וַ/יַּנַּ֤ח שְׁלֹמֹה֙ אֶת כָּל הַ/כֵּלִ֔ים מֵ/רֹ֖ב מְאֹ֣ד מְאֹ֑ד לֹ֥א נֶחְקַ֖ר מִשְׁקַ֥ל הַ/נְּחֹֽשֶׁת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/047.yaml
  text: And Solomon left all the vessels unweighed because they were exceedingly many[a]; the weight of the bronze was not determined.
translation:
  language: hi
  text: सुलैमान ने सब पात्रों को बिना तौले ही छोड़ दिया, क्योंकि वे बहुत बड़ी संख्या में थे[a]; कांसे का भार निर्धारित नहीं किया गया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “सुलैमान ने सब पात्रों को वैसे ही छोड़ दिया, क्योंकि वे बहुत बड़ी संख्या में थे; कांसे के भार की जाँच नहीं की गई।”
    reason: וַיַּנַּח का अधिक शाब्दिक अर्थ ‘छोड़ दिया’ हो सकता है और לֹא נֶחְקַר को ‘जाँच नहीं की गई’ भी अनूदित किया जा सकता है; मुख्य पाठ निकटवर्ती संदर्भ के आधार पर तौलने का निहित आशय स्पष्ट करता है।
lexical_decisions:
- source_word: וַיַּנַּח
  choice: बिना तौले ही छोड़ दिया
  rationale: क्रिया का मूल अर्थ ‘रख देना/छोड़ देना’ है। अगले वाक्यांश में कांसे का भार निर्धारित न किए जाने से स्पष्ट होता है कि सुलैमान ने तौलने की प्रक्रिया आगे नहीं बढ़ाई; इसलिए यह अनुवाद संदर्भगत आशय को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: כָּל הַכֵּלִים
  choice: उन सब पात्रों
  rationale: כֵּלִים उपकरणों या वस्तुओं के लिए व्यापक शब्द है; मन्दिर के साज-सामान के संदर्भ में ‘पात्र’ प्रचलित, ठोस और सहज विकल्प है।
- source_word: מֵרֹב מְאֹד מְאֹד
  choice: क्योंकि वे अत्यन्त अधिक थे
  rationale: מִן कारण बताता है और רֹב के साथ दोहरा מְאֹד अत्यधिक बहुतायत पर बल देता है। ‘अत्यन्त अधिक’ उस तीव्रता को संक्षिप्त, स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: לֹא נֶחְקַר
  choice: निर्धारित नहीं किया गया
  rationale: חקר का निफ़अल रूप यहाँ किसी मात्रा को जाँचकर सुनिश्चित या निर्धारित न किए जाने को दर्शाता है। भार के संदर्भ में ‘निर्धारित नहीं किया गया’ उपयुक्त है।
- source_word: מִשְׁקַל
  choice: भार
  rationale: यह संज्ञा वजन अथवा वजन के अनुसार मात्रा को दर्शाती है; ‘भार’ इसका सीधा और गरिमापूर्ण हिन्दी समतुल्य है।
- source_word: הַנְּחֹשֶׁת
  choice: कांसे
  rationale: मन्दिर के पात्रों के संदर्भ में נְחֹשֶׁת सामान्यतः कांसे को दर्शाता है, न कि अनिवार्य रूप से शुद्ध तांबे को।
theological_decisions: []
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण और सामान्य पाठकों के लिए बोधगम्य रूप। ‘बिना तौले’ संदर्भगत अर्थ स्पष्ट करता है, जबकि पादटिप्पणी अधिक शाब्दिक और वास्तविक वैकल्पिक पाठ सुरक्षित रखती है।
