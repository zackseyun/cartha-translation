  yaml_path: translation/ot/1_kings/007/030.yaml
  text: And the one stand had four bronze wheels and bronze axles[a], and its four corners had supports for them; beneath the basin the supports were cast[c][b], each beside wreathwork.
translation:
  language: hi
  text: हर एक आधार में काँसे के चार पहिए और काँसे की धुरियाँ थीं, और उसके चार पाँवों पर सहारे थे। हौदी के नीचे ये सहारे ढाले गए थे[a], और प्रत्येक सहारा माला-जैसी सजावट के पास था[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘सहारे’ का इब्रानी शब्द शाब्दिक रूप से ‘कंधे’ है; यहाँ उससे संभवतः हौदी को थामने वाले निकले हुए सहारे अभिप्रेत हैं।
    reason: lexical_alternative
  - marker: b
    text: इस दुर्लभ इब्रानी शब्द का अर्थ अनिश्चित है; संभवतः इससे मालाओं या झालरों जैसी सजावट अभिप्रेत है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אוֹפַנֵּי נְחֹשֶׁת
  choice: काँसे के पहिए
  rationale: אוֹפַנִּים का अर्थ पहिए है; मंदिर के धातु-कार्य के प्रसंग में נְחֹשֶׁת के लिए प्रचलित और उपयुक्त हिन्दी शब्द ‘काँसा’ है।
- source_word: לַמְּכוֹנָה הָאַחַת
  choice: हर एक आधार
  rationale: מְכוֹנָה यहाँ हौदी को थामने वाली पहिएदार संरचना है। הָאַחַת प्रत्येक अलग आधार का वर्णन करता है, इसलिए स्वाभाविक हिन्दी में ‘हर एक आधार’ रखा गया है।
- source_word: סַרְנֵי נְחֹשֶׁת
  choice: काँसे की धुरियाँ
  rationale: पहियों के प्रसंग में סַרְנִים यांत्रिक धुरी-अवयवों को दर्शाता है; ‘धुरियाँ’ हिन्दी में सटीक है।
- source_word: פַעֲמֹתָיו
  choice: उसके चारों कोनों पर
  rationale: शब्द मूलतः पाँव या निचले बिंदुओं से संबंधित हो सकता है, पर इस संरचनात्मक वर्णन में चार स्थानों/कोनों का भाव है। ‘कोनों पर’ स्थानगत संबंध को स्पष्ट करता है, यद्यपि शब्दगत अनिश्चितता बनी हुई है।
- source_word: כְּתֵפֹת
  choice: टेकें
  rationale: शाब्दिक अर्थ ‘कंधे’ है, पर यहाँ उभरे हुए भार-वहनकारी अवयव अभिप्रेत हैं। ‘टेकें’ उनका कार्य सहज हिन्दी में बताता है।
- source_word: מִתַּחַת לַכִּיֹּר
  choice: हौदी के नीचे
  rationale: כִּיּוֹר मंदिर-सामग्री के प्रसंग में पात्र या हौदी है; ‘हौदी’ आकार और कार्य को सामान्य हिन्दी में व्यक्त करता है।
- source_word: יְצֻקוֹת
  choice: ढाली गई थीं
  rationale: יצק का निष्क्रिय रूप धातु को साँचे में ढालने की प्रक्रिया बताता है।
- source_word: מֵעֵבֶר אִישׁ לֹיוֹת
  choice: हर एक के पास माला-जैसी सजावट
  rationale: מֵעֵבֶר אִישׁ का भाव वितरणात्मक स्थान-संबंध है। दुर्लभ לֹיוֹת संभवतः मालाओं या झालरों जैसे अलंकरण को दर्शाता है; अनिश्चितता को ‘माला-जैसी’ से सुरक्षित रखा गया है।
