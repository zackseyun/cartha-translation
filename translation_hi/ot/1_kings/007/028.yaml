translation:
  language: hi
  text: 'और उन आधारों की बनावट इस प्रकार थी: उनमें चौखटे[a] थे, और जोड़ने वाली पट्टियों[b] के बीच भी चौखटे थे।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘पट्ट’; इब्रानी शब्द चौखटे में बने खंडों या उन्हें घेरने वाले चौखटों को सूचित कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: इस इब्रानी वास्तुशिल्पीय पद का सटीक अर्थ अनिश्चित है; इसका अनुवाद ‘आड़ी पट्टियाँ’, ‘खड़े डंडे’ या ‘छड़ें’ भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְזֶה
  choice: और ... इस प्रकार थी
  rationale: संयोजक और संकेतवाचक पद वर्णन के अगले भाग का परिचय देते हैं; यह रूप इब्रानी प्रवाह को स्वाभाविक हिन्दी में रखता है।
- source_word: מַעֲשֵׂה
  choice: बनावट
  rationale: यहाँ शब्द निर्माण की रीति या संरचनात्मक रूप को बताता है; ‘बनावट’ सामान्य पाठक के लिए स्पष्ट और प्रसंगानुकूल है।
- source_word: הַמְּכוֹנָה
  choice: उस आधार
  rationale: इस प्रसंग में यह हौदी को थामने वाले चल आधार को सूचित करता है। ‘आधार’ हिन्दी में संक्षिप्त और वास्तु-संदर्भ के अनुकूल है।
- source_word: מִסְגְּרֹת
  choice: चौखटे
  rationale: शब्द घिरे अथवा चौखटे में जड़े संरचनात्मक खंडों को सूचित कर सकता है। ‘चौखटे’ मूल के रूपगत अर्थ को बनाए रखता है; ‘पट्ट’ भी सम्भव है।
- source_word: לָהֶם
  choice: उनमें ... थे
  rationale: לְ के साथ सर्वनामिक प्रत्यय यहाँ संबंध या अधिकार व्यक्त करता है; हिन्दी में ‘उनमें थे’ स्वाभाविक है और बहुवचन आधारों की ओर संकेत सुरक्षित रखता है।
- source_word: וּמִסְגְּרֹת
  choice: और ... भी चौखटे थे
  rationale: मूल में संज्ञा की पुनरावृत्ति को रखा गया है; ‘भी’ दूसरी स्थिति को स्पष्ट करता है।
- source_word: בֵּין
  choice: के बीच
  rationale: यह संरचनात्मक अवयवों के मध्य स्थान का सीधा स्थानवाचक अर्थ है।
- source_word: הַשְׁלַבִּים
  choice: जोड़ने वाली पट्टियों
  rationale: दुर्लभ वास्तुशिल्पीय पद परस्पर जोड़ने वाले सदस्यों को सूचित करता है। यह अनुवाद उनके संभावित कार्य को स्पष्ट करता है, जबकि सटीक आकार की अनिश्चितता पादटिप्पणी में रखी गई है।
