  text: and the ten stands[a], and the ten basins on the stands,
translation:
  language: hi
  text: और दस चौकियाँ[a], और उन चौकियों पर रखे दस हौद,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “आधार।”
    reason: מְכוֹנוֹת के लिए कार्यात्मक अर्थ ‘चौकियाँ’ है, जबकि ‘आधार’ एक निकट और अधिक शाब्दिक विकल्प है।
lexical_decisions:
- source_word: וְ/אֶת
  choice: और
  rationale: אֵת निश्चित कर्म का चिह्न है और हिंदी में अलग से अनूदित नहीं होता; וְ को ‘और’ से व्यक्त करके जारी सूची की जोड़ने वाली संरचना बनाए रखी गई है।
- source_word: הַ/מְּכֹנוֹת
  choice: चौकियाँ
  rationale: मंदिर के साज-सामान के इस प्रसंग में מְכוֹנוֹת उन पहिएदार आधार-संरचनाओं को दर्शाता है जिन पर हौद रखे थे। ‘चौकियाँ’ आधुनिक हिंदी में सहारा देने वाली संरचना का सहज बोध कराता है; ‘आधार’ भी संभव है।
- source_word: עָשֶׂר
  choice: दस
  rationale: स्त्रीलिंग संज्ञा מְכוֹנוֹת की सरल संख्या।
- source_word: הַ/כִּיֹּרֹת
  choice: हौद
  rationale: כִּיּוֹר धुलाई के लिए बने बड़े पात्र या जलाशय को दर्शाता है। मंदिर-संदर्भ में ‘हौद’ स्वाभाविक और स्पष्ट है।
- source_word: עֲשָׂרָה
  choice: दस
  rationale: כִּיּוֹרוֹת की सरल संख्या।
- source_word: עַל
  choice: पर रखे
  rationale: पूर्वसर्ग पात्रों के चौकियों के ऊपर स्थित होने को दर्शाता है; हिंदी में ‘पर रखे’ संबंध को सहज और स्पष्ट बनाता है।
- source_word: הַ/מְּכֹנוֹת
  choice: चौकियों
  rationale: पद में दोहराए गए इब्रानी शब्द के लिए वही हिंदी शब्द रखा गया है।
