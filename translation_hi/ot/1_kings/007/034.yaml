  text: And there were four supports at the four corners of the one stand; its supports were part of the stand itself.
translation:
  language: hi
  text: उस एक आधार के चारों कोनों पर चार सहारे थे; वे सहारे आधार के ही अंग थे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כְתֵפוֹת / כְתֵפֶיהָ
  choice: टेकें
  rationale: शाब्दिक अर्थ ‘कंधे’ है, पर इस स्थापत्य संदर्भ में ये आधार को सहारा देने वाले उभरे हुए अवयव हैं; ‘टेकें’ सामान्य हिन्दी में उनका कार्य स्पष्ट करती हैं।
- source_word: מְכֹנָה
  choice: आधार
  rationale: यह कांस्य हौदी को थामने वाली चलायमान संरचना/स्टैंड है; ‘आधार’ संक्षिप्त, स्वाभाविक और संदर्भानुकूल है।
- source_word: הָאֶחָת
  choice: उस एक
  rationale: हिब्रू के स्पष्ट ‘एक’ को बनाए रखा गया है और उसे ‘प्रत्येक’ में सामान्यीकृत नहीं किया गया, जिससे स्रोत की विशिष्ट अभिव्यक्ति सुरक्षित रहती है।
- source_word: מִן הַמְכֹנָה
  choice: उसी आधार का हिस्सा
  rationale: מִן यहाँ उद्गम अथवा एकीकृत निर्माण का भाव देता है; हिन्दी में यह बताता है कि टेकें अलग से जोड़ी हुई नहीं, बल्कि आधार की अपनी संरचना का भाग थीं।
