base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/031.yaml
  text: Its opening projected upward from within the capital by a cubit[a], and its opening was round, like the work of a pedestal, a cubit and a half; and also on its opening were carvings, and their panels were square[c][b], not round.
translation:
  language: hi
  text: उसका मुँह शीर्षभाग के भीतर से ऊपर की ओर एक हाथ निकला हुआ था[a]। उसका मुँह गोल और आधार की कारीगरी के समान डेढ़ हाथ का था[b]। उसके मुँह पर नक्काशीदार सजावट[c] भी थी; और उनके चौखटे चौकोर थे, गोल नहीं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उसका खुला भाग”; इब्रानी में खुले भाग के लिए वास्तु-रूपक के रूप में “मुँह” शब्द आया है।
    reason: lexical_alternative
  - marker: b
    text: “आधार की कारीगरी के समान” वाला इब्रानी पदबंध तकनीकी और कठिन है; इसके अन्य अर्थ “चौकी की बनावट का” या “आधार के समान बनाया हुआ” हो सकते हैं।
    reason: lexical_alternative
  - marker: c
    text: सजावट के इस इब्रानी शब्द का अनुवाद “खुदाई का काम,” “पुष्पहार” या “झालरें” भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: פִיהוּ / פִיהָ
  choice: मुँह
  rationale: इब्रानी में संरचना के खुले भाग के लिए शाब्दिक वास्तु-रूपक ‘मुँह’ आया है। हिन्दी में भी पात्र अथवा ढाँचे के खुले ऊपरी भाग के लिए यह स्वाभाविक है और मूल रूपक को बनाए रखता है।
- source_word: מִבֵּית לַכֹּתֶרֶת
  choice: शीर्षभाग के भीतर से
  rationale: यह पदबंध ऊपरी वास्तु-घटक के अंदरूनी भाग से स्थानिक संबंध बताता है। ‘शीर्षभाग’ आधुनिक पाठक के लिए स्पष्ट है और अनावश्यक रूप से राजमुकुट का बोध नहीं कराता।
- source_word: וָמַעְלָה בָּאַמָּה
  choice: ऊपर की ओर एक हाथ निकला हुआ था
  rationale: मूल में क्रिया निहित है; हिन्दी में माप सहित ऊपर उठे या निकले होने का भाव स्पष्ट करने के लिए यह स्वाभाविक वाक्य-विन्यास है।
- source_word: עָגֹל
  choice: गोल
  rationale: आकृति का सीधा और सामान्य हिन्दी वर्णन।
- source_word: מַעֲשֵׂה כֵן
  choice: आधार की कारीगरी के समान
  rationale: तकनीकी पदबंध कठिन है। यह अनुवाद מַעֲשֵׂה के ‘कारीगरी/बनावट’ और כֵן के ‘आधार/चौकी’ दोनों भावों को निकटता से रखता है, बिना किसी निश्चित संरचनात्मक व्याख्या को थोपे।
- source_word: אַמָּה וַחֲצִי הָאַמָּה
  choice: डेढ़ हाथ का
  rationale: मूल माप को संक्षेप में रखता है; आयाम की दिशा मूल में स्पष्ट नहीं, इसलिए ‘चौड़ा’ या ‘व्यास’ नहीं जोड़ा गया।
- source_word: מִקְלָעוֹת
  choice: नक्काशीदार सजावट
  rationale: शब्द सजावटी कारीगरी बताता है, पर उसकी ठीक आकृति अनिश्चित है। यह चयन सजावटी और उत्कीर्ण स्वरूप बताता है, पर माला अथवा झालर जैसी विशिष्ट आकृति निर्धारित नहीं करता।
- source_word: מִסְגְּרֹתֵיהֶם
  choice: उनके चौखटे
  rationale: मंदिर-सामग्री के इस वर्णन में यह शब्द घिरे हुए फ्रेम या पैनल को सूचित करता है। ‘चौखटे’ अगले आकार-विरोध के साथ स्वाभाविक बैठता है।
- source_word: מְרֻבָּעוֹת לֹא עֲגֻלּוֹת
  choice: चौकोर थे, गोल नहीं
  rationale: चार कोनों वाली और गोल आकृतियों के स्पष्ट विरोध को सीधे व्यक्त करता है।
