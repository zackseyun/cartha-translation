  text: וּ/שְׁתֵּ֨י כֹתָרֹ֜ת עָשָׂ֗ה לָ/תֵ֛ת עַל רָאשֵׁ֥י הָֽ/עַמּוּדִ֖ים מֻצַ֣ק נְחֹ֑שֶׁת חָמֵ֣שׁ אַמּ֗וֹת קוֹמַת֙ הַ/כֹּתֶ֣רֶת הָ/אֶחָ֔ת וְ/חָמֵ֣שׁ אַמּ֔וֹת קוֹמַ֖ת הַ/כֹּתֶ֥רֶת הַ/שֵּׁנִֽית־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/016.yaml
  text: He made two capitals of cast bronze to set on the tops of the pillars. The height of the one capital was five cubits[a], and the height of the second capital was five cubits.
translation:
  language: hi
  text: उसने खम्भों के ऊपरी सिरों पर स्थापित करने के लिए ढले हुए काँसे के दो शीर्ष बनाए। एक शीर्ष की ऊँचाई पाँच हाथ[a] और दूसरे शीर्ष की ऊँचाई भी पाँच हाथ थी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘हाथ’ लंबाई की एक प्राचीन माप-इकाई है; इसका सटीक आधुनिक मान निश्चित नहीं है।
    reason: प्राचीन माप की आधुनिक पाठक के लिए व्याख्या; विवादित या परिवर्तनीय आधुनिक रूपांतरण थोपने से बचाव।
lexical_decisions:
- source_word: כֹתָרֹת / הַכֹּתֶרֶת
  choice: शीर्ष
  rationale: खम्भे के ऊपरी सजावटी वास्तु-अंग के लिए ‘शीर्ष’ सहज और गरिमापूर्ण हिन्दी है; ‘मुकुट’ अधिक शाब्दिक होते हुए भी यहाँ भ्रामक हो सकता है।
- source_word: עָשָׂה
  choice: बनाए
  rationale: सामान्य क्रिया मूल के सीधे वर्णन को बिना अतिरिक्त शैलीगत अर्थ जोड़े व्यक्त करती है।
- source_word: לָתֵת
  choice: लगाने के लिए
  rationale: उद्देश्यसूचक infinitive को स्वाभाविक हिन्दी में व्यक्त करता है और वास्तु-अंग को खम्भों पर स्थापित करने का भाव देता है।
- source_word: רָאשֵׁי הָעַמּוּדִים
  choice: खम्भों के सिरों पर
  rationale: ‘सिरों’ से मूल के רָאשֵׁי का रूपक सुरक्षित रहता है और सन्दर्भ में खम्भों का ऊपरी भाग स्पष्ट है।
- source_word: מֻצַק נְחֹשֶׁת
  choice: ढले हुए काँसे के
  rationale: धातु और ढलाई की निर्माण-प्रक्रिया दोनों को स्पष्ट रूप से व्यक्त करता है।
- source_word: חָמֵשׁ אַמּוֹת
  choice: पाँच हाथ
  rationale: प्राचीन माप-इकाई को हिन्दी बाइबलीय परम्परा में प्रचलित और सामान्य पाठकों के लिए बोधगम्य समतुल्य से व्यक्त करता है।
- source_word: קוֹמַת
  choice: ऊँचाई
  rationale: वास्तु-माप के प्रसंग में यही स्वाभाविक और सटीक हिन्दी है।
- source_word: הָאֶחָת
  choice: एक
  rationale: मूल में ‘एक’ है, स्पष्टतः ‘पहला’ नहीं; इसलिए इस भेद को सुरक्षित रखा गया है।
- source_word: הַשֵּׁנִית
  choice: दूसरे
  rationale: जोड़ी के दूसरे शीर्ष को मूल के अनुसार स्पष्ट रूप से चिह्नित करता है।
theological_decisions: []
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण वास्तु-वर्णन। ‘शीर्ष’ तकनीकी अर्थ को पर्याप्त स्पष्टता से देता है, जबकि पदटिप्पणी केवल प्राचीन माप समझाती है।
