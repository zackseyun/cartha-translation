base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/038.yaml
  text: He made ten bronze basins[a]. Each basin held forty baths, and each basin was four cubits across[c][b]. One basin stood on each of the ten stands.
translation:
  language: hi
  text: उसने काँसे के दस हौद बनाए। हर हौद में चालीस बत[a] समाता था, और हर हौद चार हाथ चौड़ा[b] था। दसों आधारों में से प्रत्येक पर एक हौद था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘बत’ इब्रानियों का तरल पदार्थ नापने का एक माप था।
    reason: cultural_note
  - marker: b
    text: मूल इब्रानी में केवल ‘चार हाथ’ है; यहाँ ‘चौड़ा’ शब्द निहित माना गया है। इसे ‘व्यास में चार हाथ’ भी समझा जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כִיֹּרוֹת
  choice: हौद
  rationale: मंदिर के साज-सामान में यह बड़े धुलाई-पात्रों को दर्शाता है; ‘हौद’ आधुनिक हिन्दी में सहज और प्रसंगानुकूल है।
- source_word: נְחֹשֶׁת
  choice: काँसा
  rationale: मंदिर के उपकरणों के प्रसंग में धातु अथवा मिश्रधातु का पारंपरिक और स्वाभाविक हिन्दी रूप ‘काँसा’ है।
- source_word: בַּת
  choice: बत
  rationale: मूल इब्रानी द्रव-माप को झूठी आधुनिक सटीकता से बचने के लिए लिप्यंतरित रूप में रखा गया है।
- source_word: יָכִיל
  choice: समाता था
  rationale: क्रिया पात्र की धारिता बताती है; यह हिन्दी में स्वाभाविक रूप से उसकी क्षमता व्यक्त करता है।
- source_word: אַרְבַּע בָּאַמָּה
  choice: चार हाथ चौड़ा
  rationale: मूल में केवल ‘हाथ में चार’ है और माप की दिशा स्पष्ट नहीं; गोल पात्र के संदर्भ में चौड़ाई सम्भावित अर्थ को सहज रूप में बताती है, जबकि टिप्पणी मूल की अस्पष्टता सुरक्षित रखती है।
- source_word: מְכוֹנָה
  choice: आधार
  rationale: यह आस-पास के वर्णन में पात्रों को थामने वाली संरचनाओं के लिए है; ‘आधार’ उनके कार्य को स्पष्ट करता है, बिना इस पद में पहियों का विवरण जोड़े।
- source_word: כִּיּוֹר אֶחָד עַל הַמְּכוֹנָה הָאַחַת לְעֶשֶׂר הַמְּכֹנוֹת
  choice: दसों आधारों में से हर एक पर एक हौद रखा था
  rationale: इब्रानी का वितरणात्मक भाव—दस आधारों में प्रत्येक पर एक पात्र—स्वाभाविक हिन्दी में स्पष्ट किया गया है।
