  text: עֹמֵ֞ד עַל שְׁנֵ֧י עָשָׂ֣ר בָּקָ֗ר שְׁלֹשָׁ֣ה פֹנִ֣ים צָפ֡וֹנָ/ה וּ/שְׁלֹשָׁה֩ פֹנִ֨ים יָ֜מָּ/ה וּ/שְׁלֹשָׁ֣ה פֹּנִ֣ים נֶ֗גְבָּ/ה וּ/שְׁלֹשָׁה֙ פֹּנִ֣ים מִזְרָ֔חָ/ה וְ/הַ/יָּ֥ם עֲלֵי/הֶ֖ם מִ/לְ/מָ֑עְלָ/ה וְ/כָל אֲחֹֽרֵי/הֶ֖ם בָּֽיְתָ/ה־׀׀׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/025.yaml
  text: 'It stood on twelve oxen: three facing north[a], three facing west, three facing south, and three facing east; and the Sea was on them above[b], and all their rear parts were inward.'
translation:
  language: hi
  text: वह बारह बैलों पर खड़ा था—तीन बैल उत्तर की ओर मुख किए हुए थे, तीन पश्चिम की ओर[a], तीन दक्षिण की ओर, और तीन पूर्व की ओर। समुद्र उनके ऊपर था, और उन सबके पिछले भाग[b] भीतर की ओर थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘पश्चिम’ के लिए इब्रानी में शाब्दिक अभिव्यक्ति ‘समुद्र की ओर’ है; बाइबलीय इब्रानी में यह पश्चिम बताने का सामान्य ढंग है।
    reason: lexical_alternative
  - marker: b
    text: या, “उन सबके पुट्ठे भीतर की ओर थे।”
    reason: lexical_alternative
lexical_decisions:
- source_word: עֹמֵד
  choice: खड़ा था
  rationale: यह क़ाल कृदंत पिछले पद के समुद्र का वर्णन करता है; हिन्दी में वर्णनात्मक भूतकाल स्वाभाविक है।
- source_word: בָּקָר
  choice: बैल
  rationale: शब्द सामान्यतः गोवंश को सूचित कर सकता है, पर मन्दिर के इस स्थापत्य-वर्णन में सहारा देने वाली आकृतियों के लिए ‘बैल’ स्पष्ट और प्रचलित है।
- source_word: פֹנִים
  choice: मुख ... की ओर थे
  rationale: शाब्दिक अर्थ ‘मुख’ है और यहाँ चारों दिशाओं में आकृतियों का अभिमुख होना बताया गया है।
- source_word: יָמָּה
  choice: पश्चिम की ओर
  rationale: शाब्दिक रूप से ‘समुद्र की ओर’, पर चार दिशाओं की इस सूची में यह बाइबलीय इब्रानी का मानक पश्चिम-दिशा सूचक है।
- source_word: הַיָּם
  choice: समुद्र
  rationale: यह पिछले प्रसंग में वर्णित विशाल ढले हुए पात्र का विशिष्ट नाम है; मूल की उपमा और नाम को सुरक्षित रखा गया है।
- source_word: עֲלֵיהֶם מִלְמָעְלָה
  choice: उनके ऊपर था
  rationale: मूल पाठ केवल समुद्र के बैलों के ऊपर होने की बात कहता है; ‘रखा’ या ‘टिका’ जोड़कर क्रिया को अधिक विशिष्ट नहीं किया गया।
- source_word: אֲחֹרֵיהֶם
  choice: उन सबके पिछले भाग
  rationale: यह पशु-आकृतियों के पीछे के अंगों का तटस्थ और स्पष्ट वर्णन है; अधिक शारीरिक ‘पुट्ठे’ भी सम्भव है।
- source_word: בָּיְתָה
  choice: भीतर की ओर
  rationale: दिशासूचक रूप यहाँ केन्द्र की ओर अभिमुखता बताता है।
