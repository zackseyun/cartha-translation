  yaml_path: translation/ot/1_kings/007/009.yaml
  text: All these were costly stones[a], cut according to measure, sawed with a saw on the inside and on the outside, from the foundation to the coping[b], and on the outside as far as the great court.
translation:
  language: hi
  text: ये सब बहुमूल्य पत्थरों से बने थे, जिन्हें नाप के अनुसार तराशा गया था और भीतर तथा बाहर दोनों ओर आरे से काटा गया था, नींव से लेकर ऊपरी किनारे तक, और बाहर की ओर बड़े आँगन तक।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֲבָנִים יְקָרֹת
  choice: बहुमूल्य पत्थर
  rationale: यְקָרֹת का अर्थ मूल्यवान या महँगा हो सकता है। भवन-निर्माण के इस प्रसंग में इसका संकेत रत्नों की नहीं, बल्कि महँगे और उच्च-गुणवत्ता वाले निर्माण-पत्थरों की ओर है।
- source_word: כְּמִדֹּת גָּזִית
  choice: नाप के अनुसार तराशा गया
  rationale: यह पद निश्चित माप और तराशे हुए पत्थर—दोनों भाव व्यक्त करता है; हिंदी में यह रूप सटीक आकार देकर तैयार करने का आशय स्वाभाविक ढंग से देता है।
- source_word: מְגֹרָרוֹת בַּמְּגֵרָה
  choice: आरे से चीरा गया
  rationale: इब्रानी में क्रिया और उपकरण दोनों स्पष्ट हैं। हिंदी में ‘आरे से चीरा गया’ पत्थर पर किए गए कार्य को ठोस और स्वाभाविक रूप में व्यक्त करता है।
- source_word: מִבַּיִת וּמִחוּץ
  choice: भीतर तथा बाहर दोनों ओर
  rationale: यह अनुवाद स्थान या सतह के संबंध में इब्रानी की संभावित व्यापकता बनाए रखता है और अनावश्यक रूप से ‘फलकों’ का अर्थ नहीं जोड़ता।
- source_word: מִמַּסָּד
  choice: नींव से
  rationale: निर्माण-संदर्भ में מַסָּד भवन की नींव या आधार को दर्शाता है; ‘नींव’ सामान्य और सटीक वास्तुशिल्पीय शब्द है।
- source_word: עַד הַטְּפָחוֹת
  choice: ऊपरी किनारे तक
  rationale: הַטְּפָחוֹת का सटीक वास्तुशिल्पीय अर्थ अनिश्चित है। ‘ऊपरी किनारा’ किसी विशेष तकनीकी पहचान को निश्चित किए बिना भवन के ऊपरी समापन का संभावित भाव देता है।
- source_word: וּמִחוּץ עַד הֶחָצֵר הַגְּדוֹלָה
  choice: और बाहर बड़े आँगन तक
  rationale: यह वाक्यांश वर्णन को भवन के बाहर बड़े प्रांगण तक विस्तृत करता है। ‘बड़ा आँगन’ आधुनिक सामान्य हिंदी में חָצֵר הַגְּדוֹלָה का सहज रूप है।
