  yaml_path: translation/ot/1_kings/007/011.yaml
  text: And above were costly stones[a], cut according to measure, and cedar.
translation:
  language: hi
  text: और ऊपर बहुमूल्य पत्थर थे, जो नाप के अनुसार तराशे गए थे,[a] और देवदार की लकड़ी थी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तराशे हुए पत्थरों के नापों के अनुसार।”
    reason: כְּמִדּוֹת גָּזִית के व्याकरणिक संबंध की वास्तविक अस्पष्टता सुरक्षित रखने के लिए।
lexical_decisions:
- source_word: וּמִלְמַעְלָה
  choice: और ऊपर
  rationale: वास्तु-वर्णन में यह पिछले आधार-स्तरों से ऊपर के भाग की ओर स्वाभाविक संक्रमण दिखाता है।
- source_word: אֲבָנִים יְקָרוֹת
  choice: बहुमूल्य पत्थर
  rationale: יְקָרוֹת यहाँ रत्नों के बजाय उत्तम और महँगी निर्माण-सामग्री को सूचित करता है; ‘बहुमूल्य’ दोनों पहलुओं को समेटता है।
- source_word: כְּמִדּוֹת גָּזִית
  choice: जो नाप के अनुसार तराशे गए थे
  rationale: शाब्दिक संरचना ‘तराशे हुए पत्थर के नापों के अनुसार’ कुछ अस्पष्ट है। मुख्य पाठ का चयन निर्दिष्ट नाप के अनुसार तैयार किए गए पत्थरों का स्वाभाविक वास्तु-अर्थ देता है, जबकि वैकल्पिक विश्लेषण पादटिप्पणी में रखा गया है।
- source_word: וָאָרֶז
  choice: और देवदार की लकड़ी थी
  rationale: אָרֶז देवदार को दर्शाता है। हिंदी में निर्माण-सामग्री स्पष्ट करने के लिए ‘लकड़ी’ जोड़ा गया है और वाक्य की समानांतर रचना हेतु ‘थी’ की पूर्ति की गई है।
