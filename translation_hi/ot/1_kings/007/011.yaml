  register: आधुनिक मानक हिंदी की सहज, गरिमापूर्ण वास्तु-शब्दावली अपनाई गई है। मुख्य पाठ स्पष्ट और सामान्य पाठक के लिए बोधगम्य है; स्रोत की संक्षिप्तता तथा वैकल्पिक वाक्य-संबंध पादटिप्पणी में सुरक्षित हैं।
