  text: and the basins[a], the snuffers, the bowls, the cups, and the firepans, of pure gold; and the hinges for the doors of the inner house, for the Most Holy Place, and for the doors of the house, that is, the nave[d][c][b], of gold.
translation:
  language: hi
  text: और शुद्ध सोने की परातें[a], बाती काटने की कैंचियाँ, कटोरे[b], प्यालियाँ और अंगारदान; तथा भीतरी भवन, यानी परमपवित्र स्थान[c], के द्वारों की चूलें[d], और भवन, यानी मुख्य कक्ष[e], के द्वारों की चूलें सोने की थीं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इस शब्द का अर्थ ‘चौड़े कटोरे’ भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या, ‘छिड़काव के कटोरे’।
    reason: lexical_alternative
  - marker: c
    text: 'शाब्दिक पारम्परिक रूप: ‘पवित्रों का परमपवित्र’।'
    reason: lexical_alternative
  - marker: d
    text: इब्रानी शब्द सम्भवतः उन धुरी-आधारों या ऐसी ही जोड़-सामग्री को दर्शाता है जिन पर प्राचीन द्वार घूमते थे, न कि आधुनिक पट्टीदार कब्जों को।
    reason: cultural_note
