- source_word: הֵיכָל
  choice: मुख्य कक्ष
  rationale: यहाँ शब्द भीतरी परमपवित्र स्थान से अलग मन्दिर के मुख्य सभाकक्ष को दर्शाता है। ‘मुख्य कक्ष’ सामान्य पाठक के लिए वास्तु-सन्दर्भ स्पष्ट करता है।
