  choice: शुद्ध सोना
  rationale: यह पद उच्च कोटि के परिष्कृत सोने के लिए प्रयुक्त होता है; ‘शुद्ध सोना’ वर्तमान हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: הַפֹּתוֹת
  choice: चूलें
  rationale: सन्दर्भ द्वारों को घुमाने वाले जोड़ या धुरी-आधार का है। ‘चूलें’ आधुनिक पट्टीदार कब्जों की छवि थोपे बिना द्वार की घूर्णन-व्यवस्था व्यक्त करता है।
- source_word: הַבַּיִת הַפְּנִימִי
  choice: भीतरी भवन
  rationale: यह अनुवाद בַּיִת की भवन-छवि बनाए रखता है, जबकि अगला पद उस भाग को परमपवित्र स्थान के रूप में स्पष्ट करता है।
