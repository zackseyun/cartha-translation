translation:
  language: hi
  text: 'और नींव बहुमूल्य पत्थरों से रखी गई थी—बड़े पत्थरों से: दस हाथ के पत्थर और आठ हाथ के पत्थर।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּמְיֻסָּד
  choice: और नींव ... से बनी थी
  rationale: यह יסד का निष्क्रिय रूप है। वास्तु-संदर्भ में निहित विषय को ‘नींव’ के रूप में व्यक्त करना स्वाभाविक है और इब्रानी अर्थ को स्पष्ट रखता है।
- source_word: אֲבָנִים יְקָרוֹת
  choice: बहुमूल्य पत्थरों
  rationale: יְקָרוֹת पत्थरों के ऊँचे मूल्य अथवा उत्तम गुणवत्ता को बताता है। ‘बहुमूल्य’ इस निर्माण-संदर्भ में उपयुक्त है; पादटिप्पणी स्पष्ट करती है कि आशय रत्न होना आवश्यक नहीं।
- source_word: אֲבָנִים גְּדֹלוֹת
  choice: बड़े-बड़े पत्थरों
  rationale: यहाँ גְּדֹלוֹת भौतिक आकार को दर्शाता है। ‘बड़े-बड़े’ आधुनिक हिन्दी में सहज है और इब्रानी के बल को व्यक्त करता है।
- source_word: אַבְנֵי עֶשֶׂר אַמּוֹת
  choice: दस हाथ के पत्थर
  rationale: समास पत्थरों का माप बताता है, पर माप की दिशा निर्दिष्ट नहीं करता; इसलिए लंबाई, चौड़ाई या ऊँचाई नहीं जोड़ी गई।
- source_word: וְאַבְנֵי שְׁמֹנֶה אַמּוֹת
  choice: और आठ हाथ के पत्थर
  rationale: पहले माप के समानांतर संरचना रखी गई है और स्रोत की अनिर्दिष्ट माप-दिशा सुरक्षित है।
- source_word: אַמּוֹת
  choice: हाथ
  rationale: ‘हाथ’ हिन्दी बाइबल परंपरा में प्रचलित प्राचीन माप-इकाई है और यहाँ स्रोत की इकाई को आधुनिक माप में अनुमानतः बदलने से बचाता है।
