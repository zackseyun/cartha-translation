lexical_decisions:
- source_word: רֹאשׁ
  choice: शीर्ष
  rationale: स्थापत्य-संदर्भ में यह खम्भों के ऊपरी भाग को दर्शाता है; ‘शीर्ष’ स्वाभाविक है और तकनीकी अर्थ अनावश्यक रूप से नहीं जोड़ता।
- source_word: הָעַמּוּדִים
  choice: खम्भों
  rationale: मन्दिर-निर्माण के संदर्भ में עַמּוּדִים के लिए यह सामान्य और स्पष्ट हिन्दी शब्द है।
- source_word: מַעֲשֵׂה שׁוֹשָׁן
  choice: सोसन के फूलों जैसी नक्काशी
  rationale: यह पदबंध फूल के आकार की सजावटी कारीगरी को सूचित करता है। ‘नक्काशी’ हिन्दी में वास्तु-सज्जा का भाव स्पष्ट करती है, जबकि ‘सोसन’ पारंपरिक पुष्पनाम को बनाए रखता है।
- source_word: וַתִּתֹּם
  choice: पूरा हुआ
  rationale: תמם यहाँ कार्य के पूर्ण होने को व्यक्त करता है; हिन्दी में यह स्वाभाविक पूर्णतासूचक अभिव्यक्ति है।
- source_word: מְלֶאכֶת הָעַמּוּדִים
  choice: खम्भों का काम
  rationale: यह निकट और सहज अनुवाद है, जो निर्माण तथा सजावटी कारीगरी—दोनों की सम्भावना खुली रखता है।
