id: 1KI.7.48
reference: 1 Kings 7:48
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יַּ֣עַשׂ שְׁלֹמֹ֔ה אֵ֚ת כָּל הַ/כֵּלִ֔ים אֲשֶׁ֖ר בֵּ֣ית יְהוָ֑ה אֵ֚ת מִזְבַּ֣ח הַ/זָּהָ֔ב וְ/אֶת הַ/שֻּׁלְחָ֗ן אֲשֶׁ֥ר עָלָ֛י/ו לֶ֥חֶם הַ/פָּנִ֖ים זָהָֽב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/048.yaml
  text: 'And Solomon made all the vessels that were in the house of Yahweh: the golden altar[a], and the table on which was the bread of the Presence[b], of gold.'
translation:
  language: hi
  text: 'और सुलैमान ने यहोवा के भवन के सभी पात्र बनाए: सोने की वेदी और सोने की वह मेज़, जिस पर उपस्थिति की रोटी[a] थी।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “दर्शन की रोटी।” शाब्दिक अर्थ, “उपस्थिति की रोटी।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: बनाए
  rationale: עשה का सामान्य अर्थ ‘बनाना/करना’ है; मंदिर की वस्तुओं की सूची में ‘बनाए’ स्वाभाविक और पर्याप्त रूप से सटीक है।
- source_word: כָּל הַכֵּלִים
  choice: सभी पात्र
  rationale: כֵּלִים मंदिर में प्रयुक्त वस्तुओं या पात्रों को दर्शाता है; ‘पात्र’ संक्षिप्त, प्रतिष्ठित और इस उपासना-संबंधी प्रसंग के अनुकूल है।
- source_word: בֵּית יְהוָה
  choice: यहोवा का भवन
  rationale: यह इब्रानी पद का सीधा रूप है और ‘मंदिर’ की अपेक्षा मूल रूपक को सुरक्षित रखता है।
- source_word: מִזְבַּח הַזָּהָב
  choice: सोने की वेदी
  rationale: यह हिन्दी में स्वाभाविक विशेषणात्मक रचना है और मूल के अर्थ को स्पष्ट रखती है।
- source_word: הַשֻּׁלְחָן ... זָהָב
  choice: सोने की वह मेज़
  rationale: अंतिम זָהָב मेज़ का वर्णन करता है; हिन्दी में इसे संज्ञा से पहले रखना स्पष्ट और स्वाभाविक है।
- source_word: אֲשֶׁר עָלָיו
  choice: जिस पर ... रखी जाती थी
  rationale: शाब्दिक रूप ‘जिस पर ... थी’ है; पवित्र रोटी के नियमित रखे जाने का आशय हिन्दी में इस प्रकार अधिक स्वाभाविक ढंग से व्यक्त होता है।
- source_word: לֶחֶם הַפָּנִים
  choice: उपस्थिति की रोटी
  rationale: यह मूल पद के ‘मुख/उपस्थिति’ भाव को बनाए रखता है और पारंपरिक किंतु कम पारदर्शी शब्दावली से बचता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: मूल में वाचा-संबंधी व्यक्तिगत नाम सीधे आया है। हिन्दी पाठकों में प्रचलित नामरूप ‘यहोवा’ उस नाम को उपाधि ‘प्रभु’ में बदलने के बजाय स्पष्ट रूप से प्रस्तुत करता है।
- issue: לֶחֶם הַפָּנִים का धार्मिक अर्थ
  choice: उपस्थिति की रोटी
  alternative: भेंट की रोटी; दर्शन-रोटी
  rationale: मूल की अर्थगत विशेषता को सुरक्षित रखा गया है और यह नहीं जोड़ा गया कि ‘उपस्थिति’ का सटीक धार्मिक संबंध किससे या किस प्रकार है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज किंतु गरिमापूर्ण शैली अपनाई गई है। मूल की सूची-संरचना को बनाए रखते हुए अंतिम ‘सोना’ को स्पष्ट रूप से मेज़ से जोड़ा गया है।
