review_pass:
  verdict: revise
  source_fidelity: The draft accurately renders Solomon, the house of Yahweh, the vessels, the golden altar, and the gold table. However, “रखी जाती थी” introduces a habitual/passive action not expressed in the Hebrew, which simply states that the bread of the Presence was on the table.
  naturalness: The Hindi is clear, modern, and suitably dignified. Replacing the habitual construction with a simple locative clause is both more faithful and natural in this inventory statement.
  terminology: “यहोवा,” “भवन,” “पात्र,” “सोने की वेदी,” “मेज़,” and “उपस्थिति की रोटी” are appropriate. The footnote’s “भेंट की रोटी” is not a sufficiently direct equivalent of the traditional alternative “showbread”; “दर्शन की रोटी” is preferable as a recognized traditional-style alternative.
  issues:
  - severity: medium
    issue: “रखी जाती थी” adds habitual/passive aspect.
    rationale: אֲשֶׁר עָלָיו לֶחֶם הַפָּנִים is a nominal/locative expression, literally “on which [was] the bread of the Presence.” It does not state that the bread was regularly placed there.
  - severity: low
    issue: The footnote alternative “भेंट की रोटी” is imprecise.
    rationale: The English audit trail’s alternative is “showbread,” not bread offered as an offering. “दर्शन की रोटी” better supplies a traditional Hindi alternative while retaining the cultic designation.
  revised_text: 'और सुलैमान ने यहोवा के भवन के सभी पात्र बनाए: सोने की वेदी और सोने की वह मेज़, जिस पर उपस्थिति की रोटी[a] थी।'
  revised_footnotes:
