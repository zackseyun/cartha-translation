source:
  edition: WLC
  text: וְ/חָצֵ֨ר הַ/גְּדוֹלָ֜ה סָבִ֗יב שְׁלֹשָׁה֙ טוּרִ֣ים גָּזִ֔ית וְ/ט֖וּר כְּרֻתֹ֣ת אֲרָזִ֑ים וְ/לַ/חֲצַ֧ר בֵּית יְהוָ֛ה הַ/פְּנִימִ֖ית וּ/לְ/אֻלָ֥ם הַ/בָּֽיִת־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/012.yaml
  text: And the great court all around had three rows of cut stone and a row of cedar beams[c][b][a], like the inner court of the house of Yahweh and the vestibule of the house.
translation:
  language: hi
  text: और बड़े आँगन के चारों ओर तराशे हुए पत्थरों की तीन कतारें और देवदार के शहतीरों की एक कतार थी[b], जो याहवे के भवन के भीतरी आँगन और भवन के प्रवेश-मंडप[c] के समान थी[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “और याहवे के भवन के भीतरी आँगन और भवन के प्रवेश-मंडप के लिए भी।” हिब्रू का सम्बन्धसूचक उपसर्ग यहाँ तुलना अथवा सम्बन्ध—दोनों में समझा जा सकता है।
    reason: alternative_reading
  - marker: b
    text: या, “तराशे हुए पत्थरों की तीन परतें और देवदार के शहतीरों की एक परत।”
    reason: lexical_alternative
  - marker: c
    text: अर्थात् मन्दिर के मुख्य भवन का प्रवेश-भाग।
    reason: cultural_note
lexical_decisions:
- source_word: חָצֵר הַגְּדוֹלָה
  choice: बड़ा आँगन
  rationale: חָצֵר घिरे हुए आँगन को दर्शाता है; ‘आँगन’ आधुनिक हिन्दी में सहज और स्थापत्य-संदर्भ में स्पष्ट है।
- source_word: סָבִיב
  choice: चारों ओर
  rationale: यह शब्द घेरे या परिधि का बोध कराता है; ‘चारों ओर’ उसका स्वाभाविक हिन्दी रूप है।
- source_word: שְׁלֹשָׁה טוּרִים גָּזִית
  choice: तराशे हुए पत्थरों की तीन कतारें
  rationale: निर्माण-संदर्भ में טוּר पंक्ति अथवा चिनाई की परत और גָּזִית काटकर तैयार किए गए पत्थर को दर्शाता है। सरल पाठ के लिए ‘कतारें’ चुना गया है।
- source_word: וְטוּר כְּרֻתֹת אֲרָזִים
  choice: देवदार की कड़ियों की एक कतार
  rationale: כְּרֻתֹת का शाब्दिक अर्थ काटी हुई वस्तुएँ है; स्थापत्य-संदर्भ में देवदार की लकड़ी के संरचनात्मक टुकड़ों के लिए ‘कड़ियाँ’ स्वाभाविक और सटीक है।
- source_word: וְלַחֲצַר בֵּית יְהוָה הַפְּנִימִית וּלְאֻלָם הַבָּיִת
  choice: ठीक वैसी ही जैसी यहोवा के भवन के भीतरी आँगन और भवन के प्रवेश-मंडप में थी
  rationale: दोनों ל उपसर्गों को यहाँ अनुरूपता या तुलना सूचित करने वाला माना गया है। हिन्दी में तुलना को स्पष्ट करने के लिए दीर्घवृत्त वाक्यांश को स्वाभाविक रूप से पूरा किया गया है।
- source_word: אֻלָם
  choice: प्रवेश-मंडप
  rationale: यह बड़े भवन के सामने के बरामदे या प्रवेश-कक्ष को दर्शाता है; ‘प्रवेश-मंडप’ सामान्य पाठक के लिए स्पष्ट और गरिमापूर्ण है।
- source_word: הַבָּיִת
  choice: भवन
  rationale: בַּיִת यहाँ मन्दिर के मुख्य भवन के लिए है। ‘भवन’ मूल रूपक को बनाए रखता है और प्रसंग में अर्थ स्पष्ट है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ के व्यक्तिवाचक वाचा-नाम को सामान्य उपाधि से बदलने के बजाय नाम के रूप में रखा गया है। आधुनिक हिन्दी बाइबलीय प्रयोग में ‘यहोवा’ व्यापक रूप से पहचाना जाता है, जबकि ‘याहवे’ ध्वन्यात्मक विकल्प है।
- issue: ל उपसर्गों का वाक्यगत अर्थ
  choice: तुलनात्मक—‘ठीक वैसी ही जैसी’
  alternative: सम्बन्धसूचक—‘और ... के भीतरी आँगन तथा ... के प्रवेश-मंडप के लिए’
  rationale: निर्माण-विवरण के समानांतर विन्यास में तुलना प्रसंगानुकूल है, परन्तु हिब्रू में सम्बन्धसूचक अर्थ भी व्याकरणतः सम्भव है; इसलिए विकल्प पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। स्थापत्य के तकनीकी अर्थ को सामान्य पाठक तक पहुँचाने के लिए ‘कतार’ मुख्य पाठ में और ‘परत’ पादटिप्पणी में दिया गया है। तुलना को हिन्दी में पूर्ण वाक्य के रूप में व्यक्त किया गया है, जबकि हिब्रू की सम्भावित वैकल्पिक रचना पादटिप्पणी में सुरक्षित है।
