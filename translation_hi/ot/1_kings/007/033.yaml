  yaml_path: translation/ot/1_kings/007/033.yaml
  text: The workmanship of the wheels was like the workmanship of a chariot wheel[a]; their axles, their rims, their spokes[b], and their hubs were all cast metal.
translation:
  language: hi
  text: पहियों की बनावट रथ के पहिए की बनावट जैसी थी। उनकी धुरियाँ[a], उनके घेरे, उनकी तीलियाँ और उनकी नाभियाँ[b]—सब के सब धातु ढालकर बनाए गए थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘धुरियाँ’ के स्थान पर ‘हत्थे’ या ‘सहारे’ भी संभव हैं। इब्रानी शब्द יְדוֹתָם का शाब्दिक संबंध ‘हाथों’ से है, पर पहिए के इस संदर्भ में यह संभवतः धुरी से जुड़े भागों या सहारों को दर्शाता है।
    reason: lexical_alternative
  - marker: b
    text: ‘तीलियाँ’ के स्थान पर ‘पट्टियाँ’, और ‘नाभियाँ’ के स्थान पर ‘जोड़’ या ‘धुरी के खोल’ भी संभव हैं। दोनों इब्रानी शब्द दुर्लभ हैं और उनका ठीक तकनीकी अर्थ पहिए की बनावट के संदर्भ से अनुमानित है।
    reason: lexical_alternative
lexical_decisions:
- source_word: מַעֲשֵׂה
  choice: बनावट
  rationale: यह शब्द यहाँ कारीगरी से बने रूप और निर्माण-शैली, दोनों को सूचित करता है; ‘बनावट’ आधुनिक हिंदी में स्वाभाविक और स्पष्ट है।
- source_word: הָאֹפַנִּים / אוֹפַן
  choice: पहियों / पहिए
  rationale: इस स्थापत्य-वर्णन में इसका सामान्य अर्थ ‘पहिया’ है; तुलना में इब्रानी के एकवचन को हिंदी में भी रखा गया है।
- source_word: כְּמַעֲשֵׂה
  choice: की बनावट जैसी थी
  rationale: उपसर्ग כְּ की तुलनात्मक शक्ति को स्पष्ट और स्वाभाविक हिंदी में सुरक्षित रखता है।
- source_word: הַמֶּרְכָּבָה
  choice: रथ
  rationale: बाइबिलीय इब्रानी में इसका सामान्य अर्थ रथ है और प्राचीन परिवेश के अनुकूल है।
- source_word: יְדוֹתָם
  choice: धुरियाँ
  rationale: शाब्दिक संबंध ‘हाथों’ से है, पर पहिए के अंगों की इस सूची में धुरी या उससे जुड़े सहायक भाग का अर्थ सबसे संभावित है; अनिश्चितता पाद-टिप्पणी में रखी गई है।
- source_word: גַבֵּיהֶם
  choice: घेरे
  rationale: मूल अर्थ ‘पीठ/उभरा भाग’ से पहिए का बाहरी घेरा अभिप्रेत जान पड़ता है; ‘घेरा’ साधारण पाठक के लिए तकनीकी ‘परिधि-खंड’ से अधिक सुलभ है।
- source_word: חִשֻּׁקֵיהֶם
  choice: तीलियाँ
  rationale: पहिए के संदर्भ में इसे सामान्यतः बाहरी घेरे और मध्य भाग को जोड़ने वाले अंग समझा जाता है; शब्द दुर्लभ होने के कारण विकल्प पाद-टिप्पणी में दिया गया है।
- source_word: חִשֻּׁרֵיהֶם
  choice: नाभियाँ
  rationale: पहिए के अंगों की सूची में यह संभवतः उसका केंद्रीय भाग है; ‘नाभि’ आधुनिक हिंदी में पहिए के केंद्र के लिए मान्य और संक्षिप्त शब्द है।
- source_word: הַכֹּל
  choice: ये सभी
  rationale: यह सूची में बताए गए सभी अंगों का समाहार करता है।
- source_word: מוּצָק
  choice: ढली हुई धातु के
  rationale: יצק से बना यह रूप धातु ढालकर बनाए जाने को दर्शाता है; हिंदी रूप निर्माण-विधि और पदार्थ दोनों को स्पष्ट करता है, बिना किसी विशिष्ट धातु को जोड़ने के।
