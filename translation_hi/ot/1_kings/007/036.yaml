  text: On the panels of its supports and on its frames he engraved cherubim[a], lions, and palm trees, according to the space on each[b], with wreaths all around.
translation:
  language: hi
  text: उसने उसके सहारा देने वाले भागों के पटलों और उसके ढाँचों पर करूबों, सिंहों और खजूर के वृक्षों की आकृतियाँ उकेरीं, हर एक के लिए उपलब्ध स्थान के अनुसार[a], और चारों ओर मालाओं के साथ[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इब्रानी वाक्यांश कठिन है। इसका अनुवाद यह भी हो सकता है: “हर आकृति के लिए जहाँ जितनी जगह थी।” सम्भवतः आशय उपलब्ध स्थान के अनुसार नक्काशियों की व्यवस्था से है।'
    reason: lexical_alternative
  - marker: b
    text: “मालाओं” का अनुवाद “सजावटी झालरों” भी हो सकता है। इब्रानी शब्द सम्भवतः आकृतियों को घेरे हुए लटकते सजावटी अलंकरणों को दर्शाता है।
    reason: lexical_alternative
