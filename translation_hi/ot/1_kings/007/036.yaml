- source_word: לֹיֹת סָבִיב
  choice: चारों ओर मालाएँ
  rationale: לֹיֹת संभवतः घेरे हुए सजावटी हारों या झालरनुमा अलंकरणों को दर्शाता है; ‘मालाएँ’ सहज हिन्दी है और विकल्प पादटिप्पणी में दिया गया है।
