base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/039.yaml
  text: He placed five stands on the right side of the house and five on the left side of the house[a], and he placed the Sea on the southeast side of the house.
translation:
  language: hi
  text: उसने पाँच आधार भवन की दाहिनी ओर और पाँच भवन की बाईं ओर रखे; और उसने सागर भवन के दक्षिण-पूर्वी भाग में रखा।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इब्रानी में शाब्दिक रूप से: “भवन की दाहिनी ओर से, पूर्व की ओर, दक्षिण के सामने”—यह संक्षिप्त स्थान-वर्णन भवन के दक्षिण-पूर्वी भाग की ओर संकेत करता है।'
    reason: मूल इब्रानी की संक्षिप्त और कुछ असामान्य दिशात्मक अभिव्यक्ति को दिखाने के लिए।
lexical_decisions:
- source_word: הַמְּכֹנוֹת
  choice: आधार
  rationale: यह शब्द उन काँसे की पहिएदार संरचनाओं के लिए है जिन पर हौद रखे जाते थे। “आधार” उनके कार्य को सरल और स्वाभाविक हिन्दी में व्यक्त करता है, जबकि “गाड़ियाँ” उनकी गतिशीलता पर आवश्यकता से अधिक बल देता।
- source_word: כֶּתֶף
  choice: ओर
  rationale: शाब्दिक अर्थ “कंधा” है, पर स्थापत्य-संदर्भ में यह किसी भवन की बगल या ओर को दर्शाता है।
- source_word: הַבַּיִת
  choice: भवन
  rationale: इब्रानी में “घर/भवन” है और संदर्भ में इससे मन्दिर का मुख्य भवन अभिप्रेत है। “भवन” मूल स्थापत्य-भाव को बनाए रखते हुए आधुनिक हिन्दी में स्वाभाविक है।
- source_word: מִיָּמִין / מִשְּׂמֹאלוֹ
  choice: दाहिनी ओर / बाईं ओर
  rationale: मूल पाठ दिशा-सूचक उत्तर-दक्षिण के बजाय शरीर-सापेक्ष भाषा का प्रयोग करता है; इसलिए उसी रूप को रखा गया है।
- source_word: הַיָּם
  choice: सागर
  rationale: यह मन्दिर के विशाल ढले हुए हौद का विशेष नाम है। “सागर” उस नाम-सदृश प्रयोग को बनाए रखता है, न कि किसी प्राकृतिक जलराशि का संकेत देता है।
- source_word: הַיְמָנִית קֵדְמָה מִמּוּל נֶגֶב
  choice: दक्षिण-पूर्व की ओर
  rationale: इब्रानी की संक्षिप्त स्थान-वर्णनात्मक अभिव्यक्ति में दाहिनी ओर, पूर्व की दिशा और दक्षिण के सामने होने के संकेत मिलकर भवन के दक्षिण-पूर्वी भाग को दर्शाते हैं।
