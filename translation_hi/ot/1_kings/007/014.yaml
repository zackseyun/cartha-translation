  text: בֶּן אִשָּׁה֩ אַלְמָנָ֨ה ה֜וּא מִ/מַּטֵּ֣ה נַפְתָּלִ֗י וְ/אָבִ֣י/ו אִישׁ צֹרִי֮ חֹרֵ֣שׁ נְחֹשֶׁת֒ וַ֠/יִּמָּלֵא אֶת הַ/חָכְמָ֤ה וְ/אֶת הַ/תְּבוּנָה֙ וְ/אֶת הַ/דַּ֔עַת לַ/עֲשׂ֥וֹת כָּל מְלָאכָ֖ה בַּ/נְּחֹ֑שֶׁת וַ/יָּבוֹא֙ אֶל הַ/מֶּ֣לֶךְ שְׁלֹמֹ֔ה וַ/יַּ֖עַשׂ אֶת כָּל מְלַאכְתּֽ/וֹ־־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/014.yaml
  text: He was the son of a widow from the tribe of Naphtali[a], and his father was a man of Tyre, a worker in bronze. He was filled with wisdom, understanding, and knowledge to do every kind of work in bronze[b]. So he came to King Solomon and did all his work.
translation:
  language: hi
  text: वह नप्ताली के गोत्र की एक विधवा का पुत्र था। उसका पिता सोर का निवासी और काँसे का कारीगर था। वह काँसे का हर प्रकार का काम करने के लिए बुद्धि, समझ और ज्ञान से भरा हुआ था। वह राजा सुलैमान के पास आया और उसने अपना सारा काम किया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֶּן אִשָּׁה אַלְמָנָה
  choice: एक विधवा का पुत्र
  rationale: यह इब्रानी पदबंध माता की विधवा अवस्था पर बल देता है; यह रूप आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: מִמַּטֵּה נַפְתָּלִי
  choice: नप्ताली के गोत्र की
  rationale: वंशीय-सामाजिक प्रसंग में מַטֶּה का अर्थ ‘गोत्र’ है; स्त्री के साथ संबंध दिखाने के लिए ‘की’ रखा गया है।
- source_word: אִישׁ צֹרִי
  choice: सोरवासी
  rationale: צֹרִי सोर नगर के निवासी का जातिवाचक विशेषण है; ‘सोरवासी’ संक्षिप्त और स्वाभाविक हिन्दी है।
- source_word: חֹרֵשׁ נְחֹשֶׁת
  choice: काँसे का कारीगर
  rationale: חֹרֵשׁ कुशल शिल्पी को और נְחֹשֶׁת यहाँ धातु के काम को सूचित करता है; मंदिर की साज-सज्जा के प्रसंग में ‘काँसा’ उपयुक्त है।
- source_word: הַחָכְמָה וְאֶת הַתְּבוּנָה וְאֶת הַדַּעַת
  choice: बुद्धि, समझ और ज्ञान
  rationale: यह त्रिक शिल्प-कौशल के लिए आवश्यक व्यावहारिक बुद्धि, समझ और ज्ञान को दर्शाता है और स्रोत के तीनों अलग पदों को बनाए रखता है।
- source_word: וַיִּמָּלֵא
  choice: से भरपूर था
  rationale: यह इब्रानी के निष्क्रिय भाव को स्वाभाविक हिन्दी में व्यक्त करता है और भरने वाले कर्ता को अनकहा ही रहने देता है।
- source_word: לַעֲשׂוֹת כָּל מְלָאכָה בַּנְּחֹשֶׁת
  choice: काँसे का हर प्रकार का काम करने
  rationale: כָּל מְלָאכָה कार्य की पूरी व्यापकता बताता है; हिन्दी में ‘हर प्रकार का काम’ इसे स्पष्ट रूप से व्यक्त करता है।
- source_word: וַיַּעַשׂ אֶת כָּל מְלַאכְתּוֹ
  choice: उसने अपना सारा काम किया
  rationale: कर्ता वही कारीगर है और प्रत्यय उसके काम को सूचित करता है; ‘अपना’ हिन्दी में इस संबंध को सहजता से व्यक्त करता है, बिना ‘पूरा किया’ जैसा अतिरिक्त पूर्णताबोध जोड़े।
theological_decisions:
- issue: कारीगर को बुद्धि, समझ और ज्ञान से भरने वाला कर्ता स्रोत में स्पष्ट नहीं है
  choice: निष्क्रिय अभिव्यक्ति ‘से भरपूर था’ रखी गई
  alternative: ‘परमेश्वर ने उसे ... से भर दिया था’
  rationale: निकटवर्ती इब्रानी पाठ भरने वाले का नाम नहीं लेता; इसलिए किसी दैवी कर्ता को स्पष्ट रूप से जोड़ना पाठ से आगे जाना होता।
translation_notes:
  register: आधुनिक मानक हिन्दी, सरल किंतु गरिमापूर्ण कथात्मक शैली। ‘सोरवासी’, ‘कारीगर’ और ‘भरपूर’ जैसे सहज शब्द चुने गए हैं; धातुओं के आधुनिक भेद को ध्यान में रखते हुए ‘पीतल’ के बजाय ‘काँसा’ रखा गया है।
