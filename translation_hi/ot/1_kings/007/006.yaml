  text: וְ/אֵ֨ת אוּלָ֤ם הָֽ/עַמּוּדִים֙ עָשָׂ֔ה חֲמִשִּׁ֤ים אַמָּה֙ אָרְכּ֔/וֹ וּ/שְׁלֹשִׁ֥ים אַמָּ֖ה רָחְבּ֑/וֹ וְ/אוּלָם֙ עַל פְּנֵי/הֶ֔ם וְ/עַמֻּדִ֥ים וְ/עָ֖ב עַל פְּנֵי/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/006.yaml
  text: He made the Hall of Pillars fifty cubits long and thirty cubits wide[a], with a porch in front of them[b], and pillars and a threshold in front of them.
translation:
  language: hi
  text: उसने स्तंभों का मंडप[a] बनाया, जिसकी लंबाई पचास हाथ और चौड़ाई तीस हाथ थी। उनके सामने एक बरामदा था, और उनके सामने स्तंभ और एक छाजन[b] था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: हिब्रू में ‘मंडप’ और आगे ‘बरामदा’ के लिए एक ही शब्द אוּלָם आया है। दोनों स्थानों पर ‘मंडप’ या ‘द्वार-मंडप’ भी अनुवाद किया जा सकता है; दूसरी बार यह संभवतः स्तंभों के सामने जुड़े बरामदे-जैसे भाग को दर्शाता है।
    reason: lexical_alternative
  - marker: b
    text: यहाँ ‘छाजन’ के लिए आया हिब्रू शब्द עָב इस वास्तु-प्रसंग में अनिश्चित है; इसके अर्थ के रूप में ‘देहरी’, ‘मोटी शहतीर’ या कोई अन्य ढका हुआ संरचनात्मक भाग भी प्रस्तावित किया गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אוּלָם הָעַמּוּדִים
  choice: स्तंभों का सभागृह
  rationale: यह पदबंध स्तंभों से पहचाने जाने वाले एक बड़े वास्तु-भाग को सूचित करता है। ‘सभागृह’ उसके आकार और उपयोग की व्यापकता को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: עָשָׂה
  choice: बनाया
  rationale: सामान्य क्रिया עשה का सीधा और प्रसंगानुकूल हिन्दी रूप; ‘निर्माण कराया’ जैसी अतिरिक्त अर्थछाया नहीं जोड़ी गई।
- source_word: חֲמִשִּׁים אַמָּה אָרְכּוֹ וּשְׁלֹשִׁים אַמָּה רָחְבּוֹ
  choice: पचास हाथ लंबा और तीस हाथ चौड़ा
  rationale: मूल मापों को ठीक रखते हुए हिब्रू की माप-संबंधी अभिव्यक्ति को सहज आधुनिक हिन्दी में रखा गया है।
- source_word: וְאוּלָם עַל־פְּנֵיהֶם
  choice: उनके सामने एक बरामदा
  rationale: यहाँ दोबारा आया אוּלָם सामने जुड़े अपेक्षाकृत छोटे प्रवेश-भाग को सूचित करता प्रतीत होता है; ‘बरामदा’ इस स्थानिक संबंध को स्वाभाविक रूप से बताता है, जबकि पुनरावृत्त हिब्रू शब्द की जानकारी पादटिप्पणी में सुरक्षित है।
- source_word: וְעַמֻּדִים
  choice: और ... स्तंभ
  rationale: मूल की संक्षिप्त और कुछ कठिन समन्वयी रचना को मिटाए बिना स्तंभों का स्पष्ट उल्लेख बनाए रखा गया है।
- source_word: וְעָב
  choice: तथा एक छाजन
  rationale: इस वास्तु-प्रसंग में शब्द का अर्थ अनिश्चित है। ‘छाजन’ किसी सामने निकले ढके हुए संरचनात्मक भाग का बोध कराता है, पर विकल्पों को पादटिप्पणी में दिया गया है।
- source_word: עַל־פְּנֵיהֶם
  choice: उनके सामने
  rationale: बहुवचन प्रत्यय और स्थानिक संबंध को यथासंभव सुरक्षित रखा गया है; उसके संदर्भ की अस्पष्टता को एकवचन बनाकर नहीं सुलझाया गया।
