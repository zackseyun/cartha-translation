- source_word: לֹיוֹת
  choice: मालाएँ
  rationale: यह दुर्लभ शब्द संभवतः लड़ी, झालर या माला-जैसे अलंकरण को दर्शाता है; अनिश्चितता पादटिप्पणी में सुरक्षित रखी गई है।
- source_word: מַעֲשֵׂה מוֹרָד
  choice: लटकती हुई नक्काशी के रूप में
  rationale: कठिन पदबंध संभवतः नीचे उतरते या लटकते उभरे अलंकरण का वर्णन करता है; यह अनुवाद कलात्मक और स्थानगत दोनों भावों को सावधानी से व्यक्त करता है।
