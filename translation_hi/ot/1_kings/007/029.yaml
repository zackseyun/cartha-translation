  text: And on the panels that were between the frames were lions[a], oxen, and cherubim; and on the frames likewise above, and beneath the lions and the oxen were wreaths[b], a work of hanging relief.
translation:
  language: hi
  text: और उन पट्टियों पर, जो चौखटों के बीच थीं, सिंह, बैल और करूब बने हुए थे; और चौखटों पर ऊपर एक आधार था। सिंहों और बैलों के नीचे मालाएँ[a] थीं—लटकती हुई उभरी नक्काशी[b] का काम।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “झालरें” या “हार-जैसे अलंकरण।” यहाँ प्रयुक्त इब्रानी शब्द दुर्लभ है, और इस सजावट का ठीक रूप अनिश्चित है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी पदबंध कठिन है; इसका अर्थ नीचे लटकता, नीचे को उतरता, या ढलवाँ उभरा हुआ सजावटी काम हो सकता है।
    reason: lexical_alternative
