  text: וְ/אֶת בֵּית/וֹ֙ בָּנָ֣ה שְׁלֹמֹ֔ה שְׁלֹ֥שׁ עֶשְׂרֵ֖ה שָׁנָ֑ה וַ/יְכַ֖ל אֶת כָּל בֵּיתֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/001.yaml
  text: Solomon built his own house for thirteen years[a], and he finished all his house.
translation:
  language: hi
  text: सुलैमान ने अपना भवन बनाने में तेरह वर्ष लगाए[a], और उसने अपना पूरा भवन बनाकर तैयार कर लिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “अपना महल।” यहाँ इब्रानी शब्द “भवन/घर” राजा के निवास या महल-परिसर को भी दर्शा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּיתוֹ
  choice: अपना भवन
  rationale: בַּיִת का मूल अर्थ ‘घर’ है, पर राजकीय संदर्भ में यह राजा के निवास या महल-परिसर को भी दर्शा सकता है। ‘भवन’ इस संदर्भ में स्वाभाविक है और अर्थ को केवल एक साधारण घर तक सीमित नहीं करता; ‘अपना’ मंदिर के बाद सुलैमान के निजी राजकीय निवास की ओर विषय-परिवर्तन को व्यक्त करता है।
- source_word: בָּנָה
  choice: बनाने में ... वर्ष लगाए
  rationale: Qal पूर्ण रूप निर्माण की पूरी प्रक्रिया को बताता है। अवधि के साथ आधुनिक हिन्दी में ‘बनाने में तेरह वर्ष लगाए’ अधिक स्वाभाविक है और निर्माण के तेरह वर्ष चलने का अर्थ स्पष्ट रखता है।
- source_word: שְׁלֹשׁ עֶשְׂרֵה שָׁנָה
  choice: तेरह वर्ष
  rationale: यह पदबंध निर्माण-कार्य की अवधि बताता है; हिन्दी की वाक्य-रचना में ‘बनाने में ... वर्ष लगाए’ वही संबंध स्वाभाविक रूप से व्यक्त करती है।
- source_word: וַיְכַל
  choice: बनाकर तैयार कर लिया
  rationale: כלה का wayyiqtol कथानक को आगे बढ़ाते हुए काम की समाप्ति बताता है। ‘तैयार कर लिया’ पूर्णता का स्वाभाविक हिन्दी बोध देता है।
- source_word: כָּל בֵּיתוֹ
  choice: अपना पूरा भवन
  rationale: כָּל संपूर्णता पर बल देता है। ‘पूरा भवन’ पहले उल्लेखित राजकीय निवास अथवा भवन-परिसर की पूर्णता को दर्शाता है, न कि घराने के लोगों को।
- source_word: וְאֶת
  choice: '[वाक्य-आरंभ और ‘अपना’ द्वारा व्यक्त विषय-परिवर्तन]'
  rationale: संयोजक और कर्म-चिह्न मंदिर के वर्णन से जुड़े हुए, किंतु भिन्न विषय—सुलैमान के अपने निवास—की ओर मोड़ते हैं। हिन्दी में इसका पृथक शाब्दिक अनुवाद अस्वाभाविक होता; ‘अपना’ इस विरोधात्मक बल को व्यक्त करता है।
