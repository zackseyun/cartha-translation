  text: In the plain of the Jordan the king cast them[c][b][a], in the clay ground between Sukkoth and Zarethan.
translation:
  language: hi
  text: यरदन के मैदान[a] में राजा ने उन्हें सुक्कोत और सारतान के बीच चिकनी मिट्टी की भूमि में ढाला[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “यरदन की घाटी में।” हिब्रू में शाब्दिक रूप से यरदन के क्षेत्र या मैदान का उल्लेख है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से “भूमि की मोटाई में”; संभवतः आशय ढलाई के लिए उपयुक्त घनी, चिकनी मिट्टी से है।
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּכִכַּר הַיַּרְדֵּן
  choice: यरदन के मैदान में
  rationale: भौगोलिक संदर्भ में כִּכָּר यरदन के समतल क्षेत्र या मैदान को दर्शाता है। ‘मैदान’ मूल अभिव्यक्ति के निकट और सहज हिन्दी है; ‘यरदन घाटी’ भी संभव है।
- source_word: יְצָקָם
  choice: उन्हें ... ढलवाया
  rationale: יצק धातु को उँडेलकर ढालने के लिए प्रयुक्त होता है। कर्ता राजा है, इसलिए हिन्दी में प्रेरणार्थक ‘ढलवाया’ स्वाभाविक रूप से बताता है कि राजा ने यह काम करवाया। प्रत्यय ‘उन्हें’ पूर्वोक्त काँसे की वस्तुओं की ओर संकेत करता है।
- source_word: הַמֶּלֶךְ
  choice: राजा
  rationale: मूल पाठ में व्यक्तिगत नाम नहीं, बल्कि निश्चित सामान्य संज्ञा ‘राजा’ है; अतः सुलैमान नाम जोड़ना उचित नहीं।
- source_word: בְּמַעֲבֵה הָאֲדָמָה
  choice: चिकनी मिट्टी की भूमि में
  rationale: מַעֲבֶה का मूल भाव मोटाई या घनत्व है। इस धातु-ढलाई संदर्भ में आशय ऐसी घनी, चिकनी मिट्टी से है जिसमें साँचे बनाए जा सकते थे; यह अनुवाद प्रसंगगत अर्थ को स्वाभाविक हिन्दी में देता है।
- source_word: בֵּין סֻכּוֹת וּבֵין צָרְתָן
  choice: सुक्कोत और सारतान के बीच
  rationale: दोनों स्थान-नामों का हिब्रू उच्चारणानुसार देवनागरी लिप्यंतरण किया गया है। צָרְתָן के लिए ‘सारतान’ हिब्रू स्वर-व्यंजन रूप को पर्याप्त निकटता से व्यक्त करता है।
