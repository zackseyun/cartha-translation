source:
  edition: WLC
  text: וַ/יָּ֛צַר אֶת שְׁנֵ֥י הָ/עַמּוּדִ֖ים נְחֹ֑שֶׁת שְׁמֹנֶ֨ה עֶשְׂרֵ֜ה אַמָּ֗ה קוֹמַת֙ הָ/עַמּ֣וּד הָ/אֶחָ֔ד וְ/חוּט֙ שְׁתֵּים עֶשְׂרֵ֣ה אַמָּ֔ה יָסֹ֖ב אֶת הָ/עַמּ֥וּד הַ/שֵּׁנִֽי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/015.yaml
  text: He cast the two bronze pillars; the height of the one pillar was eighteen cubits[a], and a line of twelve cubits measured around it.
translation:
  language: hi
  text: उसने काँसे के दोनों खंभे ढाले। एक खंभे की ऊँचाई अठारह हाथ थी, और बारह हाथ लंबी एक डोरी दूसरे खंभे[a] को चारों ओर से घेरती थी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसे।”
    reason: वाक्य में पहले उल्लिखित खंभे के लिए सर्वनाम वाला अनुवाद संभव है, यद्यपि मासोरेटिक इब्रानी पाठ में “दूसरे खंभे” पढ़ा जाता है।
lexical_decisions:
- source_word: וַיָּצַר
  choice: ढाले
  rationale: काँसे की वास्तु-वस्तुओं के निर्माण के संदर्भ में धातु को साँचे में ढालने का अर्थ सबसे उपयुक्त है।
- source_word: שְׁנֵי הָעַמּוּדִים
  choice: दोनों खंभे
  rationale: मंदिर के विशाल वास्तु-स्तंभों के लिए आधुनिक सामान्य हिन्दी में ‘खंभे’ सहज और स्पष्ट है।
- source_word: נְחֹשֶׁת
  choice: काँसा
  rationale: इस प्राचीन वास्तु और धातुकर्म संदर्भ में यह शब्द ताँबे की अपेक्षा काँसे को सूचित करता है; ‘पीतल’ ऐतिहासिक रूप से कम उपयुक्त है।
- source_word: שְׁמֹנֶה עֶשְׂרֵה אַמָּה
  choice: अठारह हाथ
  rationale: प्राचीन माप इकाई को आधुनिक मीट्रिक मान में बदले बिना हिन्दी का परंपरागत और सुबोध समतुल्य ‘हाथ’ रखा गया है।
- source_word: קוֹמַת הָעַמּוּד הָאֶחָד
  choice: एक खंभे की ऊँचाई
  rationale: यह इब्रानी संज्ञात्मक रचना को स्पष्ट और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וְחוּט
  choice: एक डोरी
  rationale: חוּט का मूल अर्थ धागा या डोरी है; यहाँ खंभे की परिधि बताने के लिए प्रयुक्त मापने की डोरी अभिप्रेत है।
- source_word: שְׁתֵּים עֶשְׂרֵה אַמָּה
  choice: बारह हाथ लंबी
  rationale: संख्या और प्राचीन माप को सीधे रखते हुए हिन्दी वाक्य में डोरी की लंबाई स्वाभाविक ढंग से व्यक्त की गई है।
- source_word: יָסֹב
  choice: चारों ओर से घेरती थी
  rationale: क्रिया का मूल अर्थ ‘चारों ओर जाना/घेरना’ है; यह परिधि-मापन का भाव बिना अनावश्यक व्याख्या जोड़े बनाए रखता है।
- source_word: הָעַמּוּד הַשֵּׁנִי
  choice: दूसरे खंभे
  rationale: मासोरेटिक इब्रानी पाठ में स्पष्ट रूप से ‘दूसरा खंभा’ है, इसलिए मुख्य पाठ में उसी को रखा गया है।
