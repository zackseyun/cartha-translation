  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘हाथ’ प्राचीन ‘अम्माह’ का प्रचलित हिन्दी बाइबलीय माप है। मुख्य पाठ मासोरेटिक इब्रानी की ‘दूसरे खंभे’ वाली अभिव्यक्ति को बनाए रखता है और वैकल्पिक समझ को पादटिप्पणी में देता है।
