  text: וַ/יִּ֜בֶן אֶת בֵּ֣ית יַ֣עַר הַ/לְּבָנ֗וֹן מֵאָ֨ה אַמָּ֤ה אָרְכּ/וֹ֙ וַ/חֲמִשִּׁ֤ים אַמָּה֙ רָחְבּ֔/וֹ וּ/שְׁלֹשִׁ֥ים אַמָּ֖ה קוֹמָת֑/וֹ עַ֗ל אַרְבָּעָה֙ טוּרֵי֙ עַמּוּדֵ֣י אֲרָזִ֔ים וּ/כְרֻת֥וֹת אֲרָזִ֖ים עַל הָ/עַמּוּדִֽים־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/002.yaml
  text: He built the House of the Forest of Lebanon[a], one hundred cubits long, fifty cubits wide, and thirty cubits high, on four rows of cedar pillars[c][b], with cedar beams on the pillars.
translation:
  language: hi
  text: उसने लबानोन के वन का भवन बनाया। वह सौ हाथ लंबा, पचास हाथ चौड़ा और तीस हाथ ऊँचा था। वह देवदार के खंभों की चार पंक्तियों पर[a] बना था, और खंभों के ऊपर देवदार की कड़ियाँ[b] थीं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “देवदार के खंभों की चार पंक्तियों के साथ”; यहाँ प्रयुक्त संबंधसूचक शब्द सहारे (“पर”) या संरचनात्मक व्यवस्था (“के साथ”) को व्यक्त कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: जिस हिब्रू शब्द का अनुवाद “कड़ियाँ” किया गया है, उसका शाब्दिक अर्थ देवदार के “काटे हुए टुकड़े” है; इससे शहतीर, छत की कड़ियाँ या देवदार का कोई अन्य गढ़ा हुआ संरचनात्मक भाग अभिप्रेत हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּבֶן
  choice: उसने ... बनाया
  rationale: वाव-क्रमिक रूप कथा को आगे बढ़ाता है; आधुनिक हिन्दी में आरंभिक ‘और’ के बिना सामान्य भूतकाल स्वाभाविक है।
- source_word: בֵּית יַעַר הַלְּבָנוֹן
  choice: लबानोन के वन का भवन
  rationale: ‘भवन’ בֵּית का गरिमापूर्ण और कार्य की अनावश्यक व्याख्या से बचने वाला रूप है; पूरे पदबंध को इमारत के नाम के रूप में रखा गया है।
- source_word: מֵאָה אַמָּה אָרְכּוֹ ... וּשְׁלֹשִׁים אַמָּה קוֹמָתוֹ
  choice: सौ हाथ लंबा, पचास हाथ चौड़ा और तीस हाथ ऊँचा
  rationale: हिब्रू की तीन समानांतर माप-अभिव्यक्तियों को स्वाभाविक हिन्दी स्थापत्य-वर्णन में रखा गया है; אַמָּה के लिए पारंपरिक ‘हाथ’ प्राचीन माप को बनाए रखता है।
- source_word: עַל אַרְבָּעָה טוּרֵי עַמּוּדֵי אֲרָזִים
  choice: देवदार के खंभों की चार पंक्तियों पर
  rationale: טוּרֵי का अर्थ पंक्तियाँ और עַמּוּדֵי का अर्थ खंभे है। ‘पर’ עַל के स्थानिक अर्थ को बनाए रखता है, जबकि वैकल्पिक संरचनात्मक अर्थ पादटिप्पणी में दिया गया है।
- source_word: וּכְרֻתוֹת אֲרָזִים עַל הָעַמּוּדִים
  choice: खंभों के ऊपर देवदार की कड़ियाँ थीं
  rationale: כְרֻתוֹת मूलतः काटे या गढ़े हुए देवदार के संरचनात्मक टुकड़ों को सूचित करता है। स्थापत्य-संदर्भ में ‘कड़ियाँ’ स्पष्ट है, पर उसकी सटीक पहचान को पादटिप्पणी में खुला रखा गया है।
