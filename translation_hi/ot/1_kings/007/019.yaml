id: 1KI.7.19
reference: 1 Kings 7:19
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/כֹֽתָרֹ֗ת אֲשֶׁר֙ עַל רֹ֣אשׁ הָ/עַמּוּדִ֔ים מַעֲשֵׂ֖ה שׁוּשַׁ֣ן בָּֽ/אוּלָ֑ם אַרְבַּ֖ע אַמּֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/019.yaml
  text: And the capitals that were on the tops of the pillars were made like a lily blossom in the portico[c][b][a], four cubits.
translation:
  language: hi
  text: और स्तंभों के सिरों पर बने शीर्ष-मुकुट द्वारमंडप[c] में सोसन के फूल[b] के आकार के थे—चार हाथ[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में केवल ‘चार हाथ’ है। संभवतः यह शीर्ष-मुकुट के सोसन के फूल जैसे भाग की ऊँचाई बताता है।
    reason: मूल पाठ में माप का आयाम स्पष्ट नहीं है।
  - marker: b
    text: या ‘सोसन जैसा’। कुछ विद्वान यहाँ कमल के आकार की फूलदार सजावट समझते हैं।
    reason: שׁוּשַׁן की पुष्प-पहचान और स्थापत्य प्रयोग के वैकल्पिक अर्थ को सुरक्षित रखना।
  - marker: c
    text: या ‘प्रवेश-कक्ष में’ अथवा ‘बरामदे पर’। इब्रानी אוּלָם मंदिर के प्रवेश-मंडप को दर्शाता है।
    reason: स्थानवाचक स्थापत्य शब्द के सम्भव हिन्दी विकल्प बताना।
lexical_decisions:
- source_word: כֹתָרֹת
  choice: शीर्ष-मुकुट
  rationale: यह स्थापत्य में स्तंभ के सबसे ऊपरी सजावटी भाग को दर्शाता है। ‘शीर्ष-मुकुट’ सामान्य पाठक के लिए केवल तकनीकी ‘कैपिटल’ की अपेक्षा अधिक स्पष्ट है और मूल के ‘मुकुट’ संबंधी बिंब को भी बनाए रखता है।
- source_word: רֹאשׁ הָעַמּוּדִים
  choice: स्तंभों के सिरों पर
  rationale: रֹאשׁ का मूल अर्थ ‘सिर’ है; स्थापत्य संदर्भ में यह स्तंभों के ऊपरी सिरे को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: מַעֲשֵׂה שׁוּשַׁן
  choice: सोसन के फूल के आकार के
  rationale: शब्दसमूह का शाब्दिक भाव ‘सोसन का काम/कारीगरी’ है। यहाँ फूल-जैसी स्थापत्य आकृति अभिप्रेत है; चुना हुआ रूप आधुनिक हिन्दी में स्पष्ट है, जबकि ‘सोसन की कारीगरी’ अस्पष्ट हो सकता है।
- source_word: בָּאוּלָם
  choice: द्वारमंडप में
  rationale: אוּלָם मंदिर के प्रवेश-भाग या बरामदे जैसे मंडप को दर्शाता है। ‘द्वारमंडप’ मंदिर-स्थापत्य के संदर्भ में स्वाभाविक और गरिमापूर्ण है।
- source_word: אַרְבַּע אַמּוֹת
  choice: चार हाथ
  rationale: मूल में केवल माप दिया गया है, कोई आयाम-सूचक विशेषण नहीं। हिन्दी बाइबलीय प्रयोग में ‘हाथ’ प्राचीन ‘क्यूबिट’ का परिचित समतुल्य है; पाठ में ‘ऊँचे’ जोड़ने के बजाय संभावित आशय पादटिप्पणी में रखा गया है।
