translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सामान्य पाठक के लिए बोधगम्य शैली अपनाई गई है। वाक्य की संक्षिप्त, विवरणात्मक प्रकृति बनाए रखी गई है और मूल में अनुपस्थित ‘ऊँचे’ को मुख्य पाठ में नहीं जोड़ा गया।
