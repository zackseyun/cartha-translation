lexical_decisions:
- source_word: כָּזֹאת
  choice: इसी प्रकार
  rationale: यह पद पहले वर्णित बनावट और कारीगरी की ओर संकेत करते हुए सार प्रस्तुत करता है।
- source_word: עָשָׂה
  choice: उसने ... बनाईं
  rationale: कारीगरी के संदर्भ में सामान्य और स्वाभाविक हिंदी अभिव्यक्ति।
- source_word: עֶשֶׂר הַמְּכֹנוֹת
  choice: दसों चौकियाँ
  rationale: मंदिर के इन उपकरणों में מְכֹנוֹת हौदों को रखने वाली पहिएदार आधार-चौकियों को दर्शाता है; 'चौकियाँ' उनके सहारे के कार्य को सहज हिंदी में व्यक्त करता है।
- source_word: מוּצָק אֶחָד
  choice: ढलाई एक जैसी
  rationale: מוּצָק धातु को ढालकर बनाई गई वस्तु या ढलाई को दर्शाता है; यहाँ दसों चौकियों की निर्माण-विधि अथवा ढलाई की समानता पर बल है।
- source_word: מִדָּה אַחַת
  choice: नाप एक जैसा
  rationale: शाब्दिक समानांतरता रखते हुए एक ही आकार या माप का भाव स्पष्ट करता है।
- source_word: קֶצֶב אֶחָד
  choice: रूप एक जैसा
  rationale: दुर्लभ शब्द קֶצֶב यहाँ रूप, बनावट या अनुपात का अर्थ देता है; 'रूप' अर्थ को अनावश्यक रूप से सीमित नहीं करता।
- source_word: לְכֻלָּהְנָה
  choice: उन सबकी
  rationale: दसों चौकियों पर समान विनिर्देश लागू होने का सामूहिक भाव स्वाभाविक हिंदी में व्यक्त करता है।
