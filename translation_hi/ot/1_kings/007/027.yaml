base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/027.yaml
  text: He made ten bronze stands. The length of each stand was four cubits[a], its width four cubits, and its height three cubits.
translation:
  language: hi
  text: उसने काँसे की दस चौकियाँ[a] बनाईं। प्रत्येक चौकी की लंबाई चार हाथ, चौड़ाई चार हाथ और ऊँचाई तीन हाथ थी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘आधार।’ इब्रानी शब्द मन्दिर-परिसर में हौदों को थामने के लिए बनाए गए काँसे के सहारों को दर्शाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: उसने ... बनाईं
  rationale: वय्यिक़्तोल रूप कथा में अगली क्रिया बताता है। हिन्दी में साधारण भूतकाल स्वाभाविक रूप से क्रम को व्यक्त करता है; अलग से ‘तब’ जोड़ना आवश्यक नहीं।
- source_word: הַמְּכֹנוֹת
  choice: चौकियाँ
  rationale: इस मन्दिर-सामग्री के प्रसंग में यह शब्द हौदों को थामने वाली चलायमान काँस्य संरचनाओं के लिए है। ‘चौकियाँ’ उनके सहारा देने वाले ढाँचे को सामान्य हिन्दी में स्पष्ट करती हैं; वैकल्पिक अर्थ पादटिप्पणी में दिया गया है।
- source_word: עֶשֶׂר
  choice: दस
  rationale: यह ‘चौकियों’ की संख्या बताने वाली स्पष्ट गणनावाचक संख्या है।
- source_word: נְחֹשֶׁת
  choice: काँसे की
  rationale: मन्दिर की धातु-सामग्री के प्रसंग में यह शब्द प्रायः काँसे को सूचित करता है, यद्यपि इब्रानी शब्द ताँबे और काँसे दोनों के लिए व्यापक रूप से प्रयुक्त हो सकता है।
- source_word: הַמְּכוֹנָה הָאֶחָת
  choice: प्रत्येक चौकी
  rationale: शाब्दिक ‘एक चौकी’ यहाँ वितरणात्मक अर्थ रखता है; ‘प्रत्येक चौकी’ आधुनिक हिन्दी में आशय साफ़ करता है।
- source_word: אַמָּה
  choice: हाथ
  rationale: प्राचीन लंबाई की इकाई אַמָּה के लिए हिन्दी का पारंपरिक और सुबोध बाइबलीय समतुल्य ‘हाथ’ रखा गया है; आधुनिक माप में इसका मान अनुमानित होता।
- source_word: אֹרֶךְ ... רָחְבָּהּ ... קוֹמָתָהּ
  choice: लंबाई ... चौड़ाई ... ऊँचाई
  rationale: तीनों आयामों को स्वाभाविक हिन्दी क्रम और समानांतर वाक्य-रचना में व्यक्त किया गया है।
