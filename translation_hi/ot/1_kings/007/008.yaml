  text: His house where he was to live[a], in the other court farther back from the Hall, was of the same workmanship. He also made a house like this Hall for Pharaoh’s daughter[b], whom Solomon had taken as wife.
translation:
  language: hi
  text: उसका भवन, जिसमें वह रहने वाला था, दूसरे आँगन में, मंडप से भीतर की ओर, उसी कारीगरी से बना था[a]। सुलैमान ने फ़िरौन की बेटी के लिए भी, जिसे उसने ब्याह लिया था[b], इसी मंडप जैसा एक भवन बनवाया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसका भवन, जिसमें वह रहने वाला था, उस दूसरे आँगन में था जो मंडप के भीतर की ओर था।” स्थान बतानेवाला इब्रानी वाक्यांश कठिन है, इसलिए भवन की सही स्थिति के वर्णन में अनुवाद अलग-अलग हैं।
    reason: alternative_reading
  - marker: b
    text: इब्रानी में शाब्दिक अर्थ “जिसे सुलैमान ने लिया था” है; आशय है, विवाह में ग्रहण किया था।
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבֵיתוֹ
  choice: उसका अपना भवन
  rationale: प्रत्यययुक्त संज्ञा का अर्थ ‘उसका भवन’ है; ‘अपना’ हिन्दी में सुलैमान के निजी निवास का संकेत स्वाभाविक ढंग से स्पष्ट करता है।
- source_word: אֲשֶׁר יֵשֶׁב שָׁם
  choice: जिसमें वह रहनेवाला था
  rationale: יָשַׁב का यहाँ अर्थ निवास करना है। निर्माण-वर्णन में अपूर्ण क्रिया भावी अथवा निर्धारित उपयोग बताती है।
- source_word: חָצֵר הָאַחֶרֶת מִבֵּית לָאוּלָם
  choice: सभा-भवन से भीतर की ओर दूसरे आँगन में
  rationale: חָצֵר ‘आँगन’ है और מִבֵּית स्थान-संबंधी कठिन पद है। ‘भीतर की ओर’ सम्भावित स्थानिक अर्थ देता है, जबकि पादटिप्पणी अन्य सम्भव समझ को सुरक्षित रखती है।
- source_word: כַּמַּעֲשֶׂה הַזֶּה הָיָה
  choice: उसी कारीगरी से बना था
  rationale: מַעֲשֶׂה यहाँ कार्य की गुणवत्ता, शैली अथवा निर्माण-कला को सूचित करता है; ‘कारीगरी’ तुलना को सहज हिन्दी में व्यक्त करती है।
- source_word: וּבַיִת יַעֲשֶׂה
  choice: एक भवन बनवाया
  rationale: राजकीय निर्माण के प्रसंग में राजा द्वारा कार्य कराए जाने को हिन्दी का प्रेरणार्थक ‘बनवाया’ स्वाभाविक रूप से व्यक्त करता है; क्रिया यहाँ वर्णनात्मक भूतकाल में है।
- source_word: לְבַת פַּרְעֹה
  choice: फ़िरौन की बेटी के लिए
  rationale: सम्बन्धवाचक रचना का सीधा और आधुनिक हिन्दी रूप।
- source_word: אֲשֶׁר לָקַח שְׁלֹמֹה
  choice: जिसे उसने ब्याह लिया था
  rationale: स्त्री के संबंध में לָקַח प्रायः विवाह में ग्रहण करने का मुहावरा है; ‘ब्याह लिया’ अर्थ स्पष्ट करता है और मूल क्रिया की छवि भी बनाए रखता है।
- source_word: כָּאוּלָם הַזֶּה
  choice: इसी सभा-भवन जैसा
  rationale: אוּלָם राजकीय परिसर में बड़े मंडप या हॉल को दर्शाता है। ‘सभा-भवन’ आधुनिक पाठक के लिए गरिमापूर्ण और प्रसंगानुकूल है।
