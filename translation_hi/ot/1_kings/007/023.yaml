  yaml_path: translation/ot/1_kings/007/023.yaml
  text: Then he made the cast sea[a], ten cubits from brim to brim, round all around; its height was five cubits[c][b], and a line of thirty cubits went around it all around.
translation:
  language: hi
  text: फिर उसने ढला हुआ “सागर”[a] बनाया। वह एक किनारे से दूसरे किनारे तक दस हाथ चौड़ा था, चारों ओर से गोल था और उसकी ऊँचाई पाँच हाथ थी। तीस हाथ की एक डोरी[b][c] उसे चारों ओर से घेरती थी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “हौद।” इब्रानी में मंदिर के इस विशाल पात्र को औपचारिक रूप से “सागर” कहा गया है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “तीस हाथ की एक डोरी”; अर्थात उसकी परिधि तीस हाथ थी।
    reason: cultural_note
  - marker: c
    text: यहाँ लिखित इब्रानी रूप קוה है; पारंपरिक पठन इसे मापने की डोरी के अर्थ में समझता है। 2 इतिहास 4:2 में समानांतर वर्णन की तुलना करें।
    reason: textual_variant
lexical_decisions:
- source_word: הַיָּם
  choice: “सागर”
  rationale: इब्रानी में इस विशाल मंदिर-पात्र का औपचारिक नाम ‘सागर’ है। उद्धरण-चिह्न पाठक को संकेत देते हैं कि यहाँ वास्तविक समुद्र नहीं, एक विशेष पात्र अभिप्रेत है।
- source_word: מוּצָק
  choice: ढला हुआ
  rationale: यह रूप धातु को साँचे में ढालकर बनाई गई वस्तु को दर्शाता है; ‘ढला हुआ’ आधुनिक हिन्दी में स्वाभाविक और सटीक है।
- source_word: עֶשֶׂר בָּאַמָּה מִשְּׂפָתוֹ עַד שְׂפָתוֹ
  choice: एक किनारे से दूसरे किनारे तक दस हाथ चौड़ा
  rationale: माप पात्र के एक ऊपरी किनारे से सामने वाले किनारे तक है। ‘चौड़ा’ हिन्दी में इस व्यास-सदृश माप को स्वाभाविक ढंग से स्पष्ट करता है।
- source_word: שָׂפָה
  choice: किनारा
  rationale: पात्र के संदर्भ में שָׂפָה उसके ऊपरी किनारे या मुँडेर को दर्शाता है; ‘किनारा’ सामान्य पाठक के लिए सहज है।
- source_word: עָגֹל סָבִיב
  choice: चारों ओर गोल
  rationale: यह पात्र के पूर्णतः गोल आकार पर दिए गए इब्रानी बल को संक्षेप और स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: קוֹמָתוֹ
  choice: उसकी ऊँचाई
  rationale: निर्माण के माप के संदर्भ में ‘ऊँचाई’ सीधा और सटीक अर्थ है।
- source_word: וְקוה
  choice: एक डोरी
  rationale: संदर्भ में यह मापने के लिए चारों ओर लगाई गई रेखा या डोरी को दर्शाता है। ‘डोरी’ ठोस और सहज हिन्दी है, जबकि पाठगत रूप की सूचना पादटिप्पणी में दी गई है।
- source_word: יָסֹב אֹתוֹ סָבִיב
  choice: उसे चारों ओर घेरे हुए थी
  rationale: यह क्रिया और दोहराए गए סָבִיב का घेराव-संबंधी बल बनाए रखता है, पर हिन्दी में अनावश्यक रूप से बोझिल नहीं होता।
- source_word: אַמָּה
  choice: हाथ
  rationale: ‘हाथ’ प्राचीन cubit के लिए हिन्दी बाइबलीय परंपरा में प्रचलित और सामान्य पाठक के लिए समझने योग्य माप-शब्द है।
