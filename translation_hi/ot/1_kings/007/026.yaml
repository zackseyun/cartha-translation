- source_word: טֶפַח
  choice: एक हथेली
  rationale: टेफ़ह हाथ की चौड़ाई पर आधारित प्राचीन माप है; सामान्य हिंदी में ‘एक हथेली’ इसका सहज और ठोस रूप है।
