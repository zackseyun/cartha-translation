  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘बत’ को प्राचीन माप के रूप में सुरक्षित रखा गया है। तुलना की हिब्रू संरचना को पठनीय हिंदी में ढाला गया है, जबकि ‘किनारा/होंठ’ की वैकल्पिक छवि पादटिप्पणी में दी गई है।
