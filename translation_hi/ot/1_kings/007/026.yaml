  yaml_path: translation/ot/1_kings/007/026.yaml
  text: Its thickness was a handbreadth[a], and its rim was made like the rim of a cup, like a lily blossom[b]. It could hold two thousand baths.
translation:
  language: hi
  text: उसकी मोटाई एक हथेली की चौड़ाई[a] थी, और उसका किनारा प्याले के किनारे की तरह बना हुआ था, मानो सोसन का फूल हो[b]। वह दो हज़ार बत धारण कर सकता था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘एक हथेली की चौड़ाई’ हाथ की चौड़ाई पर आधारित प्राचीन लंबाई-माप थी। 2 इतिहास 4:5 के समानांतर वर्णन में इस पात्र की क्षमता तीन हज़ार बत बताई गई है। यह पाठ, प्रतिलिपि-परंपरा अथवा अधिकतम क्षमता और सामान्य भराव की व्याख्या में अंतर को दर्शा सकता है।
    reason: measurement_and_cross_reference
  - marker: b
    text: 'शाब्दिक रूप से: “उसका होंठ ... प्याले के होंठ की कारीगरी के समान।”'
    reason: lexical_alternative
lexical_decisions:
