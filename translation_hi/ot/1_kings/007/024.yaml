  text: उसके कगार के नीचे चारों ओर लौकी के आकार के उभार[a] थे, जो प्रति हाथ दस की संख्या में सागर को चारों ओर से घेरे हुए थे। वे उभार दो पंक्तियों में थे और सागर के साथ ही एक ही ढलाई में ढाले गए थे।
