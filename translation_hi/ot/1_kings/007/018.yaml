  text: He made the pillars[a], and two rows all around on the one latticework, to cover the capitals that were on top of the pomegranates[b]; and so he did for the second capital.
translation:
  language: hi
  text: उसने स्तंभ[a] बनाए और एक जाली के चारों ओर दो पंक्तियाँ बनाईं, ताकि अनारों के ऊपर स्थित स्तंभ-शीर्ष ढके जाएँ[b]; और उसने दूसरे स्तंभ-शीर्ष के लिए भी ऐसा ही किया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘अनार के आकार के अलंकरण।’ इब्रानी में शाब्दिक रूप से ‘स्तंभ’ है; इस कठिन प्रसंग में इसे स्तंभ-शीर्षों पर लगे सजावटी अनारों के रूप में भी समझा जाता है।
    reason: lexical_alternative
  - marker: b
    text: इस पद की इब्रानी वाक्य-रचना कठिन है। कुछ व्याख्याओं के अनुसार, हर स्तंभ-शीर्ष की जाली के चारों ओर अनार के आकार के अलंकरणों की दो पंक्तियाँ थीं।
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: उसने बनाए
  rationale: सामान्य कथात्मक क्रिया עשה का सीधा और स्वाभाविक हिन्दी रूप; वाक्य में दोनों कर्मों—खंभों और पंक्तियों—के साथ सहजता से प्रयुक्त है।
- source_word: הָעַמּוּדִים
  choice: खंभे
  rationale: मसोरेटिक पाठ का शाब्दिक अर्थ ‘खंभे’ है। प्रसंगगत कठिनाई को मिटाए बिना मुख्य पाठ में यही पाठ रखा गया है; वैकल्पिक पाठ-समझ फुटनोट में दी गई है।
- source_word: שְׁנֵי טוּרִים
  choice: दो पंक्तियाँ
  rationale: טוּר क्रम में सजाई गई पंक्ति को दर्शाता है; सजावटी संरचना के प्रसंग में ‘दो पंक्तियाँ’ स्पष्ट और स्वाभाविक है।
- source_word: סָבִיב
  choice: चारों ओर
  rationale: संरचना को घेरे हुए स्थान-विन्यास का स्वाभाविक हिन्दी निरूपण।
- source_word: הַשְּׂבָכָה
  choice: जालीदार काम
  rationale: खंभे के कंगूरे पर बने जाल-जैसे अलंकरण के लिए सामान्य पाठक को समझ आने वाला स्थापत्य-वर्णन।
- source_word: לְכַסּוֹת
  choice: ताकि ... ढक दें
  rationale: उद्देश्यसूचक infinitive को हिन्दी में स्पष्ट उद्देश्य-वाक्य के रूप में प्रस्तुत किया गया है।
- source_word: הַכֹּתָרֹת
  choice: कंगूरे
  rationale: כותרת खंभे के ऊपरी सजावटी शीर्ष, अर्थात capital, को दर्शाता है। ‘कंगूरा’ हिन्दी में अपेक्षाकृत परिचित स्थापत्य शब्द है, यद्यपि इसका अर्थ-क्षेत्र पूर्णतः समान नहीं है।
- source_word: הָרִמֹּנִים
  choice: अनारों
  rationale: शाब्दिक अर्थ ‘अनार’ रखा गया है; यहाँ अनार के आकार के सजावटी रूप अभिप्रेत हैं।
- source_word: וְכֵן עָשָׂה
  choice: भी वैसा ही किया
  rationale: दूसरी समान संरचना पर उसी काम की पुनरावृत्ति को संक्षिप्त और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: לַכֹּתֶרֶת הַשֵּׁנִית
  choice: दूसरे कंगूरे के लिए
  rationale: इब्रानी का सीधा रूप, जो दूसरे खंभे के अनुरूप शीर्ष-अलंकरण की ओर संकेत करता है।
