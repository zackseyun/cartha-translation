  yaml_path: translation/ot/1_kings/007/021.yaml
  text: He set up the pillars at the portico of the temple[a]. He set up the right pillar and called its name Jachin; then he set up the left pillar and called its name Boaz.
translation:
  language: hi
  text: उसने मंदिर के बरामदे पर खंभे खड़े किए। उसने दाहिना खंभा खड़ा किया और उसका नाम याकीन रखा; फिर उसने बायाँ खंभा खड़ा किया और उसका नाम बोअज़ रखा।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: याकीन और बोअज़ इन खंभों के इब्रानी नामों के लिप्यंतरण हैं; यहाँ उनके संभावित अर्थों का अनुवाद नहीं किया गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקֶם
  choice: खड़ा किया / खड़े किए
  rationale: हिफ़ील रूप का अर्थ किसी वस्तु को खड़ा करना या उसके स्थान पर स्थापित करना है; खम्भों के प्रसंग में यह स्वाभाविक हिन्दी है।
- source_word: הָעַמֻּדִים
  choice: खम्भे
  rationale: עַמּוּד मन्दिर के वास्तुशिल्प में स्तम्भ या खम्भे को दर्शाता है; साधारण आधुनिक हिन्दी में ‘खम्भे’ अधिक सहज है।
- source_word: לְאֻלָם הַהֵיכָל
  choice: मन्दिर के बरामदे पर
  rationale: אוּלָם मन्दिर के सामने के बरामदे या द्वारमण्डप को दर्शाता है; प्रसंग में לְ को स्थान-सूचक मानते हुए ‘पर’ चुना गया है।
- source_word: הָעַמּוּד הַיְמָנִי
  choice: दाहिना खम्भा
  rationale: יְמָנִי का सीधा अर्थ दाहिनी ओर का है; इसे दक्षिण दिशा मानकर अर्थ खोलना आवश्यक नहीं।
- source_word: וַיִּקְרָא אֶת שְׁמוֹ
  choice: उसका नाम ... रखा
  rationale: शाब्दिक इब्रानी मुहावरे ‘उसका नाम पुकारा’ का स्वाभाविक हिन्दी समतुल्य ‘उसका नाम ... रखा’ है।
- source_word: יָכִין
  choice: याकीन
  rationale: यह खम्भे का नाम है, इसलिए सम्भावित अर्थ का अनुवाद करने के बजाय इब्रानी उच्चारण के निकट लिप्यन्तरण किया गया है।
- source_word: הָעַמּוּד הַשְּׂמָאלִי
  choice: बायाँ खम्भा
  rationale: שְׂמָאלִי का अर्थ बाईं ओर का है और यह दाहिने खम्भे के समानान्तर स्वाभाविक अभिव्यक्ति है।
- source_word: בֹּעַז
  choice: बोअज़
  rationale: यह खम्भे का नाम है; ‘अ’ द्वारा व्यंजन-विच्छेद दिखाते हुए इब्रानी रूप के निकट हिन्दी लिप्यन्तरण रखा गया है।
