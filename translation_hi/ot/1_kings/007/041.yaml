  text: the two pillars[a], and the two bowls of the capitals that were on the tops of the pillars, and the two latticeworks to cover the two bowls of the capitals that were on the tops of the pillars[c][b];
translation:
  language: hi
  text: दो खंभे; खंभों के सिरों पर लगे शीर्षों के दो कटोरेनुमा भाग[a]; और खंभों के सिरों पर लगे शीर्षों के उन दो कटोरेनुमा भागों को ढकने के लिए दो जालियाँ[b]।
  philosophy: optimal-equivalence
