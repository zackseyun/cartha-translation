  language: hi
  text: और वह एक समुद्र[a], और समुद्र के नीचे बारह बैल;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “वह एक बड़ा हौद, और उस हौद के नीचे बारह बैल।” इब्रानी में इस बड़े जलाशय को “समुद्र” कहा गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הַיָּם
  choice: समुद्र
  rationale: मन्दिर के सामानों के इस संदर्भ में यह शब्द ढली हुई धातु के बड़े जलाशय का पारंपरिक नाम है; शाब्दिक रूप बनाए रखते हुए पादटिप्पणी उसका आशय स्पष्ट करती है।
- source_word: הָאֶחָד
  choice: वह एक
  rationale: निश्चित पद के साथ आया अंक इस अकेले समुद्र को आसपास वर्णित अनेक आधारों और हौदियों से अलग दिखाता है।
- source_word: הַבָּקָר
  choice: बैल
  rationale: यहाँ शब्द समुद्र को थामने वाली गोवंश-आकृतियों के लिए है; स्थापत्य-सूची में 'बैल' स्वाभाविक और सटीक है।
- source_word: שְׁנֵים עָשָׂר
  choice: बारह
  rationale: मूल पाठ की साधारण गणनात्मक संख्या का सीधा अनुवाद।
- source_word: תַּחַת
  choice: के नीचे
  rationale: यह बैलों की जलाशय के नीचे की भौतिक स्थिति बताता है।
- source_word: וְאֶת
  choice: और
  rationale: दोहराया गया संयोजक और कर्मचिह्न पिछली सूची को आगे बढ़ाते हैं; हिन्दी में कर्मचिह्न को अलग से व्यक्त करना आवश्यक नहीं है।
