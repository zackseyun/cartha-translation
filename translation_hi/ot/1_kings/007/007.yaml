source:
  edition: WLC
  text: וְ/אוּלָ֤ם הַ/כִּסֵּא֙ אֲשֶׁ֣ר יִשְׁפָּט שָׁ֔ם אֻלָ֥ם הַ/מִּשְׁפָּ֖ט עָשָׂ֑ה וְ/סָפ֣וּן בָּ/אֶ֔רֶז מֵ/הַ/קַּרְקַ֖ע עַד הַ/קַּרְקָֽע־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/007.yaml
  text: And he made the Hall of the Throne[a], where he was to judge—the Hall of Judgment—and it was paneled with cedar from floor to floor.
translation:
  language: hi
  text: और उसने सिंहासन-मंडप बनाया, जहाँ वह न्याय करता था—अर्थात न्याय-मंडप। वह देवदार की लकड़ी से फर्श से फर्श तक[a] मढ़ा हुआ था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, अर्थानुसार, “फर्श से छत तक।” हिब्रू में अक्षरशः “फर्श से फर्श तक” है।
    reason: मसोरेटिक पाठ की असामान्य पुनरुक्ति को मुख्य पाठ में सुरक्षित रखते हुए प्रचलित वास्तुशिल्पीय समझ बताना।
lexical_decisions:
- source_word: וְאוּלָם הַכִּסֵּא
  choice: और उसने सिंहासन-मंडप बनाया
  rationale: אוּלָם राजमहल के प्रसंग में एक बड़े मंडप या सभागार को दर्शाता है; ‘मंडप’ स्वाभाविक वास्तुशिल्पीय शब्द है। הַכִּסֵּא का राजकीय अर्थ ‘सिंहासन’ है। हिब्रू में עָשָׂה बाद में आता है, पर सहज हिन्दी वाक्य-विन्यास के लिए क्रिया को आरम्भिक खंड में रखा गया है।
- source_word: אֲשֶׁר יִשְׁפָּט שָׁם
  choice: जहाँ वह न्याय करता था
  rationale: अपूर्ण क्रिया यहाँ उस स्थान के नियमित राजकीय कार्य को व्यक्त कर सकती है। ‘न्याय करता था’ इस कार्यात्मक अर्थ को सहज हिन्दी में रखता है, बिना इसे केवल भावी अभिप्राय मानने के।
- source_word: אֻלָם הַמִּשְׁפָּט
  choice: अर्थात न्याय-मंडप
  rationale: यह उसी भवन का कार्यपरक नाम है। ‘अर्थात’ हिन्दी में इस पुनर्नामकरण को स्पष्ट करता है; ‘न्याय’ מִשְׁפָּט की अपेक्षा अधिक व्याख्यात्मक ‘न्यायशीलता’ जैसे शब्दों से बचता है।
- source_word: וְסָפוּן בָּאֶרֶז
  choice: देवदार की लकड़ी से ... मढ़ा हुआ था
  rationale: סָפוּן आवरण या लकड़ी की परत चढ़ाने का बोध देता है। ‘मढ़ा हुआ’ वास्तु-संदर्भ में संक्षिप्त और स्वाभाविक है; ‘देवदार की लकड़ी’ साधारण पाठक के लिए सामग्री स्पष्ट करती है।
- source_word: מֵהַקַּרְקַע עַד הַקַּרְקָע
  choice: फर्श से फर्श तक
  rationale: मसोरेटिक पाठ में קַרְקַע ‘फर्श/भूमि’ दोनों स्थानों पर दुहराया गया है। मुख्य पाठ इस कठिन और सम्भवतः संदिग्ध अभिव्यक्ति को सुधारे बिना सुरक्षित रखता है।
theological_decisions: []
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमामय किंतु सुबोध वास्तु-वर्णन। ‘सिंहासन-मंडप’ और ‘न्याय-मंडप’ समानांतर संरचना बनाए रखते हैं। कठिन अंतिम वाक्यांश की वास्तविक पाठगत अस्पष्टता को पादटिप्पणी सहित सुरक्षित रखा गया है।
