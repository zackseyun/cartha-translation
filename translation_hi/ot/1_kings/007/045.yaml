source:
  edition: WLC
  text: וְ/אֶת הַ/סִּיר֨וֹת וְ/אֶת הַ/יָּעִ֜ים וְ/אֶת הַ/מִּזְרָק֗וֹת וְ/אֵת֙ כָּל הַ/כֵּלִ֣ים ה/אהל אֲשֶׁ֨ר עָשָׂ֥ה חִירָ֛ם לַ/מֶּ֥לֶךְ שְׁלֹמֹ֖ה בֵּ֣ית יְהוָ֑ה נְחֹ֖שֶׁת מְמֹרָֽט־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/045.yaml
  text: and the pots[a], the shovels, the basins[c][b], and all these vessels that Hiram made for King Solomon for the house of Yahweh were of burnished bronze.
translation:
  language: hi
  text: और हाँड़ियाँ, बेलचे, कटोरे[a] और ये सभी पात्र, जिन्हें हीराम ने राजा सुलैमान के लिए याहवे के भवन हेतु बनाया था, चमकाए हुए काँसे के थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “कुण्ड।”
    reason: lexical_alternative
lexical_decisions:
- source_word: הַסִּירוֹת
  choice: हाँड़ियाँ
  rationale: यह शब्द सामान्यतः हाँड़ियों या बड़े पकाने वाले पात्रों को दर्शाता है। यहाँ व्यापक और सहज हिन्दी शब्द चुना गया है, बिना इनके विशेष उपयोग को अनावश्यक रूप से निर्धारित किए।
- source_word: הַיָּעִים
  choice: बेलचे
  rationale: ये वे औज़ार थे जिनसे वेदी की राख या अन्य सामग्री हटाई जाती थी; इस प्रसंग में ‘बेलचे’ स्वाभाविक और सटीक है।
- source_word: הַמִּזְרָקוֹת
  choice: कटोरे
  rationale: यह शब्द तरल पदार्थ ग्रहण करने या छिड़कने में प्रयुक्त पात्रों के लिए आता है। ‘कटोरे’ सामान्य पाठक के लिए स्पष्ट है, जबकि ‘कुण्ड’ भी सम्भव है।
- source_word: כָּל־הַכֵּלִים הָאֵלֶּה
  choice: ये सभी पात्र
  rationale: כֵּלִים यहाँ सूचीबद्ध वस्तुओं या पात्रों का व्यापक नाम है और הָאֵלֶּה पिछली सूची की ओर संकेत करता है।
- source_word: חִירָם
  choice: हीराम
  rationale: यह हिब्रू नाम חִירָם का प्रचलित हिन्दी लिप्यंतरण है।
- source_word: לַמֶּלֶךְ שְׁלֹמֹה
  choice: राजा सुलैमान के लिए
  rationale: लामेद यहाँ उस राजा को दर्शाता है जिसके लिए काम किया गया; ‘राजा सुलैमान के लिए’ स्वाभाविक हिन्दी है।
- source_word: בֵּית יְהוָה
  choice: याहवे के भवन
  rationale: ‘भवन’ मूल के ‘घर’ अर्थ को बनाए रखते हुए मंदिर-संदर्भ में सहज है; यְהוָה को व्यक्तिगत नाम ‘याहवे’ के रूप में रखा गया है।
- source_word: נְחֹשֶׁת מְמֹרָט
  choice: चमकाए हुए काँसे
  rationale: नְחֹשֶׁת यहाँ काँसे को और מְמֹרָט उसकी घिसकर चमकाई हुई सतह को दर्शाता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में चार अक्षरों वाला व्यक्तिगत ईश्वरीय नाम है। ‘याहवे’ उसका सीधा लिप्यंतरण है और उसे किसी उपाधि से नहीं बदलता।
- issue: अंतिम पदबंध נְחֹשֶׁת מְמֹרָט का वाक्यगत सम्बन्ध
  choice: 'पूरी सूची के लिए विधेय: ‘चमकाए हुए काँसे के थे’'
  alternative: केवल निकटतम ‘पात्रों’ के साथ विशेषणवत् जोड़ना
  rationale: हिब्रू की क्रियारहित उपवाक्य-रचना में अंतिम पदबंध सूचीबद्ध सभी वस्तुओं की सामग्री बताता है। हिन्दी में ‘थे’ जोड़ने से यही सम्बन्ध स्पष्ट और स्वाभाविक होता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल किंतु गरिमापूर्ण मंदिर-सूची शैली रखी गई है। ‘हेतु’ का प्रयोग लगातार दो बार ‘के लिए’ आने से बचाता है। सभी वस्तुओं को चमकाए हुए काँसे का बताने के लिए हिन्दी में निहित संयोजक क्रिया ‘थे’ स्पष्ट रूप से जोड़ी गई है।
