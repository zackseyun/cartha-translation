  text: And the four wheels were underneath the panels[a], and the axles of the wheels were on the stand[b]; and the height of each wheel was a cubit and a half.
translation:
  language: hi
  text: और चारों पहिए चौखटों[a] के नीचे थे, और पहियों की धुरियाँ आधार[b] में लगी थीं। हर पहिए की ऊँचाई डेढ़ हाथ थी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या “पट्टों” अथवा “किनारों”; इब्रानी: מִסְגְּרוֹת।'
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में शाब्दिक अर्थ “पहियों के हाथ” है; इस संदर्भ में संभवतः पहियों की धुरियाँ या उन्हें सहारा देने वाली छड़ें अभिप्रेत हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאֹפַנִּים / הָאוֹפַן
  choice: पहिए / पहिए
  rationale: यहाँ אוֹפַן काँसे के आधार से जुड़े वास्तविक पहियों को दर्शाता है; आधुनिक हिन्दी में ‘पहिया’ इसका सहज और स्पष्ट समानार्थी है।
- source_word: לְמִתַּחַת
  choice: के नीचे
  rationale: यह संयुक्त पूर्वसर्ग किसी वस्तु के नीचे स्थित होने का स्थानिक संबंध व्यक्त करता है।
- source_word: הַמִּסְגְּרוֹת
  choice: पट्टियों
  rationale: कारीगरी के इस वर्णन में מִסְגְּרוֹת आधार के चौखटे में जड़े या घिरे पार्श्व-भागों को दर्शाता है। ‘पट्टियाँ’ स्वाभाविक है, जबकि ‘चौखटे’ या ‘किनारे’ भी संभव हैं; इसलिए विकल्प पादटिप्पणी में दिए गए हैं।
- source_word: וִידוֹת
  choice: धुरियाँ
  rationale: शाब्दिक अर्थ ‘हाथ’ है, पर यांत्रिक संदर्भ में यह पहियों को आधार से जोड़ने या सहारा देने वाले निकले हुए भागों को दर्शाता है; ‘धुरियाँ’ कार्यगत अर्थ को स्पष्ट करता है।
- source_word: בַּמְּכוֹנָה
  choice: आधार में लगी थीं
  rationale: מְכוֹנָה यहाँ पहियों वाले काँसे के आधार को दर्शाता है। בְּ का संबंध ‘में’ या ‘पर’ दोनों रूपों में समझा जा सकता है; हिन्दी में धुरियों के जुड़ाव के लिए ‘आधार में लगी थीं’ स्वाभाविक है।
- source_word: קוֹמַת
  choice: ऊँचाई
  rationale: यहाँ קוֹמָה पहिए की खड़ी माप को व्यक्त करता है।
- source_word: הָאֶחָד
  choice: हर
  rationale: शाब्दिक ‘एक’ इस माप-वाक्य में वितरणात्मक अर्थ रखता है; हिन्दी में ‘हर पहिए’ वही अर्थ सहज ढंग से देता है।
- source_word: אַמָּה וַחֲצִי הָאַמָּה
  choice: डेढ़ हाथ
  rationale: אַמָּה प्राचीन लंबाई की इकाई ‘हाथ’ है। ‘डेढ़ हाथ’ आधुनिक हिन्दी पाठक के लिए स्वाभाविक है और मूल माप को बिना आधुनिक इकाई में बदले सुरक्षित रखता है।
