  text: וּ/בְ/רֹ֣אשׁ הַ/מְּכוֹנָ֗ה חֲצִ֧י הָ/אַמָּ֛ה קוֹמָ֖ה עָגֹ֣ל סָבִ֑יב וְ/עַ֨ל רֹ֤אשׁ הַ/מְּכֹנָה֙ יְדֹתֶ֔י/הָ וּ/מִסְגְּרֹתֶ֖י/הָ מִמֶּֽ/נָּה׀׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/035.yaml
  text: And on the top of the stand there was a round rim all around[a], half a cubit high[b]; and on the top of the stand its supports and its panels were of one piece with it.
translation:
  language: hi
  text: और आधार के ऊपरी भाग पर चारों ओर एक गोलाकार किनारा था, जो आधा हाथ ऊँचा था। आधार के ऊपरी भाग पर उसके सहारे[a] और उसकी चौखटें[b] उसी के साथ एक ही टुकड़े में बने थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “हत्थे”; इब्रानी शब्द का शाब्दिक अर्थ “उसके हाथ” है और इससे आधार के बाहर निकले हुए अंग भी अभिप्रेत हो सकते हैं।
    reason: lexical_alternative
  - marker: b
    text: या “उसके पटल।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְרֹאשׁ הַמְּכוֹנָה
  choice: आधार के ऊपरी भाग पर
  rationale: רֹאשׁ का स्थापत्य-संदर्भ में अर्थ ‘ऊपरी भाग’ है, और מְכוֹנָה यहाँ काँसे के चलायमान आधार को दर्शाता है।
- source_word: חֲצִי הָאַמָּה קוֹמָה
  choice: आधा हाथ ऊँचा
  rationale: यह पदबंध उस ऊपरी गोल संरचना की ऊँचाई बताता है; ‘हाथ’ प्राचीन नाप ‘अम्मा’ के लिए प्रचलित और सहज हिन्दी शब्द है।
- source_word: עָגֹל סָבִיב
  choice: चारों ओर ... एक गोल घेरा
  rationale: עָגֹל और סָבִיב मिलकर चारों ओर फैली गोलाकार बनावट बताते हैं। इब्रानी में संज्ञा निहित है; हिन्दी में स्पष्टता के लिए ‘घेरा’ जोड़ा गया है।
- source_word: יְדֹתֶיהָ
  choice: उसके सहारे
  rationale: יָד का शाब्दिक अर्थ ‘हाथ’ है, पर वस्तुओं के वर्णन में यह बाहर निकले हुए हत्थों, टेकों या सहारों को सूचित कर सकता है। स्थापत्य-संदर्भ में ‘सहारे’ उपयुक्त है, जबकि वैकल्पिक अर्थ पादटिप्पणी में रखा गया है।
- source_word: וּמִסְגְּרֹתֶיהָ
  choice: उसकी चौखटें
  rationale: מִסְגְּרוֹת से घिरे हुए ढाँचों, फ्रेमों या पैनलों का बोध होता है। ‘चौखटें’ मूल की संरचनात्मक छवि बनाए रखता है।
- source_word: מִמֶּנָּה
  choice: उसी के साथ एक ही टुकड़े में बने थे
  rationale: शाब्दिक अर्थ ‘उसी में से’ है; यहाँ आशय है कि ये अंग अलग से जोड़े हुए नहीं, बल्कि आधार के अभिन्न भाग थे।
