id: 1KI.2.12
reference: 1 Kings 2:12
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וּ/שְׁלֹמֹ֕ה יָשַׁ֕ב עַל כִּסֵּ֖א דָּוִ֣ד אָבִ֑י/ו וַ/תִּכֹּ֥ן מַלְכֻת֖/וֹ מְאֹֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/012.yaml
  text: And Solomon sat on the throne of David his father[a], and his kingdom was firmly established.
translation:
  language: hi
  text: और सुलैमान अपने पिता दाऊद के सिंहासन पर विराजमान हुआ, और उसका राज बहुत दृढ़ता से स्थापित हो गया।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उसका शासन बहुत सुरक्षित हो गया”; या “उसका राजत्व दृढ़ता से स्थापित हो गया।”
    reason: מַלְכוּת का अर्थ संदर्भ के अनुसार राज, शासन या राजत्व हो सकता है, और וַתִּכֹּן स्थिर या सुरक्षित हो जाने का भाव दे सकता है।
lexical_decisions:
- source_word: יָשַׁב
  choice: विराजमान हुआ
  rationale: राजसिंहासन के संदर्भ में यह क्रिया सिंहासन ग्रहण करने और उस पर राजा के रूप में बैठने का भाव देती है। ‘विराजमान हुआ’ हिंदी में स्वाभाविक और गरिमापूर्ण है तथा सिंहासन की मूल छवि बनाए रखता है।
- source_word: כִּסֵּא
  choice: सिंहासन
  rationale: दाऊद के राजकीय उत्तराधिकार के संदर्भ में सामान्य ‘आसन’ के बजाय ‘सिंहासन’ स्पष्ट अर्थ है।
- source_word: אָבִיו
  choice: अपने पिता
  rationale: यहाँ दाऊद सुलैमान का वास्तविक पिता है; इसलिए सीधा पारिवारिक अर्थ उपयुक्त है।
- source_word: וַתִּכֹּן
  choice: दृढ़ता से स्थापित हो गया
  rationale: निफ़अल रूप स्थापित, स्थिर या सुरक्षित हो जाने का परिणामसूचक भाव देता है।
- source_word: מַלְכֻתוֹ
  choice: उसका राज
  rationale: מַלְכוּת के अर्थक्षेत्र में राज्य, राजत्व और शासनकाल आते हैं। यहाँ ‘राज’ इस वास्तविक अस्पष्टता को स्वाभाविक हिंदी में व्यापक रूप से बनाए रखता है।
- source_word: מְאֹד
  choice: बहुत
  rationale: यह शब्द कथन को तीव्र करता है; ‘बहुत दृढ़ता से’ उसके बल को स्पष्ट और स्वाभाविक हिंदी में व्यक्त करता है।
theological_decisions:
- issue: दाऊद के सिंहासन से संबंधित राजकीय उत्तराधिकार
  choice: पद को सुलैमान के सिंहासन ग्रहण करने और उसके राज के स्थिर हो जाने का ऐतिहासिक कथन रखा गया है।
  alternative: वंशगत वैधता या बाद के मसीही अर्थ को अधिक स्पष्ट रूप से उभारना।
  rationale: मूल पद सुलैमान के उत्तराधिकार और उसके राज की स्थिरता बताता है, पर बाद के धर्मवैज्ञानिक निष्कर्षों को यहाँ प्रत्यक्ष रूप से व्यक्त नहीं करता।
translation_notes:
  register: आधुनिक मानक हिंदी में सरल, गरिमापूर्ण ऐतिहासिक शैली अपनाई गई है। ‘विराजमान हुआ’ राजकीय संदर्भ के अनुकूल है; ‘राज’ मूल शब्द के राज्य, शासन और राजत्व संबंधी अर्थ-विस्तार को संक्षेप में सुरक्षित रखता है।
