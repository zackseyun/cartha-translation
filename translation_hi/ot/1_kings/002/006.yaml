  text: Act according to your wisdom[b][a], and do not let his gray head go down to Sheol in peace.
translation:
  language: hi
  text: अपनी बुद्धि के अनुसार कार्य करो, और उसके सफेद सिर को शांति से शिओल[b] में उतरने मत देना[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसके सफेद सिर को शांति से शिओल में मत उतारना।”
    reason: lexical_alternative
  - marker: b
    text: “शिओल” मृतकों के लोक के लिए प्रयुक्त इब्रानी शब्द है; इसका अनुवाद “अधोलोक” या “कब्र” भी किया जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: कार्य करना
  rationale: עשה का अर्थ व्यापक रूप से ‘करना’ है। यहाँ दाऊद के निर्देश में इसका बल आज्ञार्थक है; ‘कार्य करना’ स्वाभाविक रहते हुए किसी अनकहे विशेष कार्य को जोड़ता नहीं।
- source_word: כְּחָכְמָתֶךָ
  choice: अपनी बुद्धि के अनुसार
  rationale: כְּ के साथ यह पद सुलैमान की समझ और विवेक के अनुरूप आचरण करने का भाव देता है।
- source_word: וְלֹא תוֹרֵד
  choice: उतरने न देना
  rationale: ירד का हिफ़ईल रूप कारणवाचक है—‘नीचे जाने देना/पहुँचाना’। मुख्य पाठ का यह रूप हिंदी में सहज है; अधिक प्रत्यक्ष कारणवाचक विकल्प पाद-टिप्पणी में रखा गया है।
- source_word: שֵׂיבָתוֹ
  choice: उसके पके बालों को
  rationale: שֵׂיבָה पके या सफेद बालों और लाक्षणिक रूप से वृद्धावस्था को दर्शाता है। ‘पके बाल’ मूल की सजीव देहात्मक छवि को बनाए रखता है।
- source_word: בְּשָׁלֹם
  choice: शांति से
  rationale: यहाँ שָׁלוֹם सुरक्षित और शांतिपूर्ण अंत की दशा बताता है; प्रसंग में आशय है कि वह दंड से बचकर शांतिपूर्वक न मरे।
- source_word: שְׁאֹל
  choice: शिओल
  rationale: लिप्यंतरण मूल इब्रानी धारणा को बनाए रखता है और इसे केवल भौतिक कब्र तक सीमित नहीं करता। अर्थ-सहायता पाद-टिप्पणी में दी गई है।
theological_decisions:
- issue: שְׁאֹל का अनुवाद
  choice: शिओल
  alternative: अधोलोक; मृतकों का लोक; कब्र
  rationale: ‘शिओल’ इब्रानी शब्द की व्यापक और कुछ हद तक अनिश्चित अर्थ-सीमा को सुरक्षित रखता है। ‘कब्र’ अर्थ को भौतिक दफ़न-स्थान तक संकुचित कर सकता है, जबकि ‘अधोलोक’ अधिक व्याख्यात्मक है।
- issue: दाऊद के निर्देश में मृत्यु और दंड का संकेत
  choice: मूल रूपक को स्पष्ट किए बिना बनाए रखना
  alternative: उसे शांतिपूर्वक मरने न देना
  rationale: ‘पके बालों को शिओल में उतरने’ की मूल अभिव्यक्ति मृत्यु की ओर संकेत करती है, पर अनुवाद में इसे सीधे ‘मार डालना’ कहना स्रोत से अधिक निश्चित और व्याख्यात्मक होता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य रखी गई है। ‘पके बाल’ मूल इब्रानी रूपक को सुरक्षित रखता है, और ‘शिओल’ के साथ पाद-टिप्पणी अपरिचित शब्द को स्पष्ट करती है।
