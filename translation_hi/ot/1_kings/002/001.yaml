  text: 'जब दाऊद की मृत्यु का समय निकट आया[a], तब उसने अपने पुत्र सुलैमान को यह आज्ञा दी:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “दाऊद के दिन मरने के लिए निकट आए”; यह इब्रानी मुहावरा बताता है कि दाऊद की मृत्यु का समय पास आ गया था।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרְבוּ יְמֵי דָוִד לָמוּת
  choice: जब दाऊद की मृत्यु का समय निकट आया
  rationale: इब्रानी में शाब्दिक रूप से ‘दाऊद के दिन मरने के लिए निकट आए’ है। आधुनिक हिन्दी में ‘मृत्यु का समय निकट आया’ उसी कालगत मुहावरे और निकटता के रूपक को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: וַיְצַו
  choice: आज्ञा दी
  rationale: צוה का अर्थ आदेश या गंभीर निर्देश देना है। अंतिम निर्देशों के प्रसंग में ‘आज्ञा दी’ इसकी शक्ति को स्पष्ट और गरिमापूर्ण हिन्दी में रखता है।
- source_word: אֶת־שְׁלֹמֹה בְנוֹ
  choice: अपने पुत्र सुलैमान को
  rationale: यह हिन्दी की स्वाभाविक पद-व्यवस्था है और בְנוֹ में निहित संबंध को स्पष्टतः सुरक्षित रखती है।
- source_word: לֵאמֹר
  choice: 'यह … दी:'
  rationale: प्रत्यक्ष कथन का परिचय देने वाले इब्रानी infinitive को हिन्दी में ‘यह’ और विसर्ग के द्वारा स्वाभाविक रूप से व्यक्त किया गया है; अलग से ‘कहते हुए’ जोड़ना अनावश्यक और असहज होता।
