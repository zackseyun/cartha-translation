base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/027.yaml
  text: So Solomon drove Abiathar out from being priest to Yahweh[b][a], fulfilling the word of Yahweh that he had spoken concerning the house of Eli in Shiloh.
translation:
  language: hi
  text: इस प्रकार सुलैमान ने एब्यातार को याहवे का याजक होने से निष्कासित कर दिया। इससे याहवे का वह वचन पूरा हुआ[a], जो उसने शीलो में रहनेवाले एली के घराने के विषय में कहा था।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “ताकि याहवे का वचन पूरा हो।” इब्रानी वाक्यांश उद्देश्य या परिणाम—दोनों व्यक्त कर सकता है।
    reason: alternative_reading
  - marker: b
    text: एली के घराने के विरुद्ध कही गई घोषणा के लिए 1 शमूएल 2:27–36; 3:11–14 देखें।
    reason: cross_reference
lexical_decisions:
- source_word: וַיְגָרֶשׁ
  choice: निकाल दिया
  rationale: גּרשׁ बलपूर्वक हटाने या निष्कासित करने का भाव रखता है। प्रसंग में एब्यातार को याजकीय पद से हटाया गया है, इसलिए यह अभिव्यक्ति स्वाभाविक और पर्याप्त रूप से सशक्त है।
- source_word: מִהְיוֹת כֹּהֵן לַיהוָה
  choice: याहवे के याजक के पद से
  rationale: מִן के साथ היה का infinitive किसी अवस्था या भूमिका से हटाए जाने को दर्शाता है। हिंदी में ‘याजक के पद से’ इसी अर्थ को स्वाभाविक ढंग से व्यक्त करता है। לַיהוָה याहवे से संबंध और उसकी सेवा को सूचित करता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: चार-अक्षरीय ईश्वरीय नाम को उपाधि से बदलने के बजाय हिंदी में उसके प्रचलित लिप्यंतरण ‘याहवे’ से व्यक्त किया गया है।
- source_word: לְמַלֵּא
  choice: इससे ... पूरा हुआ
  rationale: לְ के साथ infinitive यहाँ उद्देश्य या परिणाम दोनों व्यक्त कर सकता है। मुख्य पाठ में परिणाम का स्वाभाविक अर्थ दिया गया है और उद्देश्य की संभावना पादटिप्पणी में सुरक्षित रखी गई है।
- source_word: דְּבַר יְהוָה
  choice: याहवे का वह वचन
  rationale: דָּבָר यहाँ पहले कही गई ईश्वरीय घोषणा को दर्शाता है; ‘वचन’ इस प्रसंग में प्रतिष्ठित और उपयुक्त हिंदी शब्द है।
- source_word: אֲשֶׁר דִּבֶּר
  choice: जो उसने ... कहा था
  rationale: पूर्ण भूतकाल यह स्पष्ट करता है कि याहवे की घोषणा सुलैमान के इस कार्य से पहले हुई थी।
- source_word: עַל בֵּית עֵלִי
  choice: एली के घराने के विषय में
  rationale: עַל का व्यापक अर्थ ‘के विषय में’ है। यद्यपि संदर्भ न्याय की घोषणा का है, ‘के विरुद्ध’ चुनने से पूर्वसर्ग का अर्थ अनावश्यक रूप से संकीर्ण हो जाता।
- source_word: בְּשִׁלֹה
  choice: शीलो में
  rationale: स्थानवाचक בְּ का सीधा और स्वाभाविक हिंदी रूप ‘में’ है।
theological_decisions:
- issue: सुलैमान के कार्य और पहले की ईश्वरीय घोषणा का संबंध
  choice: मुख्य पाठ में सुलैमान के कार्य को उस वचन के पूरा होने के परिणाम के रूप में व्यक्त किया गया है।
  alternative: ‘ताकि याहवे का वचन पूरा हो’—अर्थात इसे सुलैमान के कार्य का उद्देश्य समझना।
  rationale: לְמַלֵּא उद्देश्य या परिणाम दोनों का संकेत दे सकता है। कथात्मक प्रवाह में परिणाम स्वाभाविक है, पर पाठ सुलैमान की मंशा स्पष्ट नहीं करता; इसलिए वैकल्पिक उद्देश्य-अर्थ पादटिप्पणी में रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘याजक के पद से निकाल दिया’ शाब्दिक संरचना की अपेक्षा हिंदी में भूमिका से हटाए जाने का अर्थ अधिक स्पष्ट करता है। ईश्वरीय नाम को ‘याहवे’ लिखा गया है।
