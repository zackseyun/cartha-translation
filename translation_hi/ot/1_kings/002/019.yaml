  text: וַ/תָּבֹ֤א בַת שֶׁ֨בַע֙ אֶל הַ/מֶּ֣לֶךְ שְׁלֹמֹ֔ה לְ/דַבֶּר ל֖/וֹ עַל אֲדֹנִיָּ֑הוּ וַ/יָּקָם֩ הַ/מֶּ֨לֶךְ לִ/קְרָאתָ֜/הּ וַ/יִּשְׁתַּ֣חוּ לָ֗/הּ וַ/יֵּ֨שֶׁב֙ עַל כִּסְא֔/וֹ וַ/יָּ֤שֶׂם כִּסֵּא֙ לְ/אֵ֣ם הַ/מֶּ֔לֶךְ וַ/תֵּ֖שֶׁב לִֽ/ימִינֽ/וֹ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/019.yaml
  text: So Bathsheba went to King Solomon to speak to him on behalf of Adonijah. The king rose to meet her and bowed down before her. Then he sat on his throne and had a throne placed for the king's mother, and she sat at his right hand.
translation:
  language: hi
  text: तब बतशेबा अदोनिय्याह की ओर से बात करने के लिए राजा सुलैमान के पास गई। राजा उससे मिलने के लिए उठा और उसके सामने झुका। फिर वह अपने सिंहासन पर बैठ गया और उसने राजा की माता के लिए एक सिंहासन रखवाया। वह राजा के दाहिने बैठ गई।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עַל אֲדֹנִיָּהוּ
  choice: अदोनिय्याह की ओर से
  rationale: यहाँ बतशेबा अदोनिय्याह का निवेदन लेकर मध्यस्थ के रूप में आती है; प्रसंग के अनुसार ‘की ओर से’ केवल ‘के विषय में’ की अपेक्षा आशय को अधिक स्पष्ट करता है।
- source_word: וַיִּשְׁתַּחוּ לָהּ
  choice: उसके सामने झुका
  rationale: क्रिया आदरपूर्वक झुकने को व्यक्त करती है; यह अनुवाद सम्मान की क्रिया को बनाए रखता है, बिना उसे उपासना के अर्थ तक सीमित किए।
- source_word: כִּסֵּא
  choice: सिंहासन
  rationale: राजकीय प्रसंग और उसी पद में सुलैमान के सिंहासन के उल्लेख के कारण ‘सिंहासन’ उपयुक्त है।
- source_word: לְאֵם הַמֶּלֶךְ
  choice: राजमाता
  rationale: शाब्दिक अर्थ ‘राजा की माता’ है; आधुनिक हिंदी में राजदरबार की इस प्रतिष्ठित भूमिका के लिए ‘राजमाता’ स्वाभाविक और संक्षिप्त है।
- source_word: לִימִינוֹ
  choice: उसके दाहिने हाथ की ओर
  rationale: मूल की स्थान-सूचक अभिव्यक्ति और सम्मानपूर्ण निकटता को स्पष्ट रूप से सुरक्षित रखता है।
theological_decisions:
- issue: सुलैमान का बतशेबा के सामने झुकना
  choice: उसके सामने झुका
  alternative: उसे दण्डवत किया
  rationale: मूल क्रिया सम्मान अथवा प्रणाम के लिए प्रयुक्त हो सकती है। ‘उसके सामने झुका’ वास्तविक शारीरिक सम्मान को व्यक्त करता है और अनावश्यक रूप से धार्मिक उपासना का अर्थ नहीं जोड़ता।
- issue: עַל का संबंध
  choice: अदोनिय्याह की ओर से
  alternative: अदोनिय्याह के विषय में
  rationale: दोनों अर्थ भाषिक रूप से संभव हैं, पर निकट प्रसंग में बतशेबा अदोनिय्याह का अनुरोध प्रस्तुत करने आई है; इसलिए प्रतिनिधिक अर्थ यहाँ अधिक उपयुक्त है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। लंबे इब्रानी समन्वित वाक्य को घटनाक्रम के अनुसार छोटे वाक्यों में बाँटा गया है, पर सभी क्रियाएँ और राजकीय सम्मान सुरक्षित हैं।
