  text: Then the king sent and called for Shimei and said to him[a], “Build yourself a house in Jerusalem and live there, and do not go out from there anywhere.”
translation:
  language: hi
  text: तब राजा ने शिमई को बुलवा भेजा और उससे कहा, “अपने लिए यरूशलेम में एक घर बना और वहीं रह। वहाँ से निकलकर कहीं भी[a] मत जाना।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “इधर-उधर”; अर्थात “कहीं भी।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח ... וַיִּקְרָא לְשִׁמְעִי
  choice: संदेश भेजकर शिमई को बुलाया
  rationale: दोनों इब्रानी क्रियाओं—‘भेजना’ और ‘बुलाना’—का अर्थ सुरक्षित रखते हुए यह राजकीय बुलावे को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: בְּנֵה לְךָ בַיִת
  choice: अपने लिए ... एक घर बना
  rationale: आज्ञार्थक ‘बना’ और हितसूचक לְךָ (‘अपने लिए’) दोनों को स्पष्ट रखता है; ‘घर’ यहाँ भौतिक निवास को दर्शाता है।
- source_word: וְיָשַׁבְתָּ שָׁם
  choice: और वहीं रह
  rationale: निवास की निरंतरता और स्थान-प्रतिबंध के संदर्भ में ‘वहीं रह’ सहज और सटीक है।
- source_word: וְלֹא תֵצֵא מִשָּׁם
  choice: वहाँ से निकलकर ... मत जाना
  rationale: יצא के ‘निकलना’ अर्थ को बनाए रखते हुए निषेध को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: אָנֶה וָאָנָה
  choice: कहीं भी
  rationale: इब्रानी का शाब्दिक वितरक मुहावरा ‘इधर-उधर’ इस निषेध में ‘कहीं भी’ के अर्थ में प्रयुक्त है; मुख्य पाठ में अर्थ स्पष्ट है और शाब्दिक रूप पादटिप्पणी में दिया गया है।
