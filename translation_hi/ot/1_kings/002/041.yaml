lexical_decisions:
- source_word: וַיֻּגַּד
  choice: समाचार दिया गया
  rationale: निष्क्रिय क्रिया सूचना दिए जाने को व्यक्त करती है, पर सूचना देने वाले का उल्लेख नहीं करती; यह हिंदी में स्वाभाविक रहते हुए उस निष्क्रिय भाव को सुरक्षित रखती है।
- source_word: לִשְׁלֹמֹה
  choice: सुलैमान को
  rationale: पूर्वसर्ग ל यहाँ सूचना पाने वाले अप्रत्यक्ष कर्म को चिह्नित करता है।
- source_word: כִּי
  choice: कि
  rationale: यह दिए गए समाचार की विषयवस्तु आरंभ करता है।
- source_word: הָלַךְ
  choice: गया था
  rationale: הלך जाने या यात्रा करने को दर्शाता है; सूचना दिए जाने से पहले पूरी हुई घटना के लिए हिंदी का पूर्ण भूतकाल उपयुक्त है।
- source_word: שִׁמְעִי
  choice: शिमई
  rationale: व्यक्तिनाम का प्रचलित हिंदी बाइबलीय लिप्यंतरण।
- source_word: מִירוּשָׁלִַם
  choice: यरूशलेम से
  rationale: מ स्थान से दूर जाने की गति को चिह्नित करता है।
- source_word: גַּת
  choice: गत
  rationale: यह बिना व्यक्त पूर्वसर्ग के भी जाने की मंज़िल है; हिंदी में ‘यरूशलेम से गत गया’ स्रोत की संक्षिप्त संरचना और आशय दोनों बनाए रखता है।
- source_word: וַיָּשֹׁב
  choice: और लौट आया था
  rationale: שׁוב वापस आने को दर्शाता है; ‘लौट आया था’ पूर्ण हुई वापसी को स्वाभाविक हिंदी में व्यक्त करता है।
