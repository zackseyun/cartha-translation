  text: And now[a], as Yahweh lives, who has established me and seated me on the throne of David my father, and who has made for me a house as he promised, surely Adonijah shall be put to death today.
translation:
  language: hi
  text: अब, यहोवा के जीवन की शपथ—जिसने मुझे स्थापित किया, मुझे मेरे पिता दाऊद के सिंहासन पर बैठाया, और जैसा उसने कहा था, मेरे लिए एक घराना[a] बनाया है—निश्चय ही अदोनिय्याह आज मार डाला जाएगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात, मेरे लिए एक राजवंश स्थापित किया है। यहाँ “घराना” संभवतः किसी भवन का नहीं, बल्कि स्थायी राजकीय वंश का बोध कराता है।
    reason: lexical_alternative
