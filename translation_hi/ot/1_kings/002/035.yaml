base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/035.yaml
  text: And the king appointed Benaiah son of Jehoiada in his place over the army[a], and the king appointed Zadok the priest in place of Abiathar.
translation:
  language: hi
  text: तब राजा ने यहोयादा के पुत्र बनायाह को उसकी जगह[a] सेना का प्रधान नियुक्त किया, और राजा ने सादोक याजक को एब्यातार की जगह नियुक्त किया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इब्रानी: “उसकी जगह”; निकटवर्ती प्रसंग में यह सर्वनाम पहले पद से हटाए गए सेनापति योआब की ओर संकेत करता है।'
    reason: cross_reference
lexical_decisions:
- source_word: וַיִּתֵּן / נָתַן
  choice: नियुक्त किया
  rationale: मूल अर्थ ‘रखना/देना’ है, पर यहाँ किसी पद पर स्थापित करने का प्रशासनिक भाव है; इसलिए ‘नियुक्त किया’ स्वाभाविक और सटीक है।
- source_word: בְּנָיָהוּ בֶן־יְהוֹיָדָע
  choice: यहोयादा के पुत्र बनायाह
  rationale: हिब्रू पितृनाम-संबंध को आधुनिक, स्वाभाविक हिन्दी में व्यक्त किया गया है और नामों का लिप्यंतरण किया गया है।
- source_word: תַּחְתָּיו
  choice: उसकी जगह
  rationale: प्रतिस्थापन का भाव सुरक्षित रहता है; सर्वनाम का संदर्भ निकटवर्ती प्रसंग में योआब से है।
- source_word: עַל־הַצָּבָא
  choice: सेना का प्रधान
  rationale: शाब्दिक ‘सेना के ऊपर’ हिन्दी में अस्वाभाविक है; यह पद सेना पर अधिकार/कमांड व्यक्त करता है।
- source_word: צָדוֹק הַכֹּהֵן
  choice: सादोक याजक
  rationale: व्यक्तिनाम का लिप्यंतरण और पदवी का सीधा, प्रचलित हिन्दी रूप रखा गया है।
- source_word: תַּחַת אֶבְיָתָר
  choice: एब्यातार की जगह
  rationale: यह पद में प्रतिस्थापन दर्शाता है, जिसे ‘की जगह’ स्पष्ट और सहज रूप से व्यक्त करता है।
