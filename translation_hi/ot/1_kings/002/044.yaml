  text: וַ/יֹּ֨אמֶר הַ/מֶּ֜לֶךְ אֶל שִׁמְעִ֗י אַתָּ֤ה יָדַ֨עְתָּ֙ אֵ֣ת כָּל הָ/רָעָ֗ה אֲשֶׁ֤ר יָדַע֙ לְבָ֣בְ/ךָ֔ אֲשֶׁ֥ר עָשִׂ֖יתָ לְ/דָוִ֣ד אָבִ֑/י וְ/הֵשִׁ֧יב יְהוָ֛ה אֶת רָעָתְ/ךָ֖ בְּ/רֹאשֶֽׁ/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/044.yaml
  text: Then the king said to Shimei[a], “You know all the evil that your heart knows, which you did to David my father[b]; and Yahweh has returned your evil on your own head.”
translation:
  language: hi
  text: तब राजा ने शिमई से कहा, “तुम अपने मन में उस सारी बुराई को जानते हो जो तुमने मेरे पिता दाऊद के विरुद्ध की थी; और याहवे ने तुम्हारी बुराई तुम्हारे ही सिर पर लौटा दी है।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר הַמֶּלֶךְ
  choice: तब राजा ने ... कहा
  rationale: वाव-क्रम कथा को आगे बढ़ाता है; ‘तब’ आधुनिक हिन्दी में स्वाभाविक क्रम व्यक्त करता है, और הַמֶּלֶךְ का निश्चित पद ‘राजा’ है।
- source_word: אַתָּה יָדַעְתָּ
  choice: तुम ... जानते हो
  rationale: स्पष्ट सर्वनाम אַתָּה बल देता है; हिन्दी में ‘तुम’ को बनाए रखने से यह बल स्वाभाविक रूप से व्यक्त होता है।
- source_word: כָּל הָרָעָה
  choice: वह सारी बुराई
  rationale: रָעָה यहाँ केवल हानि नहीं, नैतिक दुष्कर्म को सूचित करता है; ‘बुराई’ इसका नैतिक भार बनाए रखती है।
- source_word: אֲשֶׁר יָדַע לְבָבְךָ
  choice: जो तुम्हारा मन जानता है
  rationale: इब्रानी वाक्य हृदय को ज्ञान का कर्ता बनाता है और शिमई की भीतरी दोष-चेतना पर बल देता है। हिन्दी में ‘मन’ इस प्रसंग में आंतरिक नैतिक चेतना को ‘हृदय’ से अधिक सहजता से व्यक्त करता है, जबकि मूल रूपक भी बना रहता है।
- source_word: אֲשֶׁר עָשִׂיתָ לְדָוִד אָבִי
  choice: जो तुमने मेरे पिता दाऊद के साथ की थी
  rationale: यह सम्बन्धवाचक उपवाक्य रָעָה को स्पष्ट करता है। ‘के साथ की’ आधुनिक हिन्दी में स्वाभाविक है और दाऊद के विरुद्ध किए गए दुष्कर्म का भाव संदर्भ से स्पष्ट रहता है।
- source_word: וְהֵשִׁיב
  choice: और ... लौटा दी है
  rationale: שׁוב के हिफ़ील रूप में किसी वस्तु को वापस लौटाने का कारण बनना निहित है। ‘लौटा दी है’ प्रतिफल की मूल छवि बचाता है और ‘बदला चुकाया’ जैसी अधिक व्याख्यात्मक भाषा से बचता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: मूल पाठ में परमेश्वर का व्यक्तिगत नाम है; हिन्दी में प्रचलित सीधा नामरूप ‘यहोवा’ शीर्षक से प्रतिस्थापित किए बिना उसे व्यक्त करता है।
- source_word: אֶת רָעָתְךָ
  choice: तुम्हारी बुराई
  rationale: पहले आए רָעָה के साथ समान अनुवाद करने से किए गए दुष्कर्म और उसी के लौटने का शब्दगत संबंध स्पष्ट रहता है।
- source_word: בְּרֹאשֶׁךָ
  choice: तुम्हारे ही सिर पर
  rationale: यह अपराध या दण्ड के कर्ता पर लौटने का इब्रानी मुहावरा है। ‘ही’ आत्म-संबंधी बल को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे / प्रभु
  rationale: पद व्यक्तिगत ईश्वरीय नाम का सीधे प्रयोग करता है। हिन्दी पाठकों के लिए प्रतिष्ठित नामरूप ‘यहोवा’ मूल नाम को शीर्षक में बदले बिना सुरक्षित रखता है।
- issue: ईश्वरीय प्रतिफल में कर्तृत्व
  choice: यहोवा ने तुम्हारी बुराई तुम्हारे ही सिर पर लौटा दी है
  alternative: यहोवा ने तुम्हारी बुराई का बदला तुम्हें दिया है
  rationale: मूल पाठ प्रतिफल को स्पष्टतः यहोवा का कार्य बताता है और ‘लौटाने’ की छवि रखता है। चुना हुआ पाठ दोनों तत्वों को बनाए रखता है, पर उससे आगे कोई व्यवस्थित धर्मवैज्ञानिक निष्कर्ष नहीं जोड़ता।
- issue: שׁוב के हिफ़ील रूप का काल और अर्थ
  choice: लौटा दी है
  alternative: लौटा देगा / उसका फल तुम्हें दिया है
  rationale: पूर्ण क्रिया को वर्तमान परिणाम वाले पूर्ण कार्य के रूप में प्रस्तुत किया गया है। यह भविष्यवाणी में बदलने या ‘फल’ जोड़कर रूपक की व्याख्या करने से बचता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज कथात्मक शैली। मूल की भीतरी दोष-चेतना वाली असामान्य अभिव्यक्ति ‘जो तुम्हारा मन जानता है’ जानबूझकर रखी गई है। किसी पाद-टिप्पणी की आवश्यकता नहीं समझी गई, इसलिए मुख्य पाठ में कोई अनाथ संकेत नहीं है।
