    issue: ‘बना रहेगा’ for וְשָׁבוּ
    rationale: The Hebrew explicitly expresses return/coming back upon Joab and his offspring. ‘बना रहेगा’ conveys enduring liability but omits this key judicial metaphor and its movement back upon the guilty.
  - severity: low
    issue: Footnote wording can be more precise about the referent of ‘their blood.’
    rationale: In context the phrase refers to the blood of the murdered persons and idiomatically to responsibility for that blood; ‘उनके बहाए गए खून’ may be read less precisely in Hindi.
