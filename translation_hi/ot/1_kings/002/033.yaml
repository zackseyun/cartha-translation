source:
  edition: WLC
  text: וְ/שָׁ֤בוּ דְמֵי/הֶם֙ בְּ/רֹ֣אשׁ יוֹאָ֔ב וּ/בְ/רֹ֥אשׁ זַרְע֖/וֹ לְ/עֹלָ֑ם וּ/לְ/דָוִ֡ד וּ֠/לְ/זַרְע/וֹ וּ/לְ/בֵית֨/וֹ וּ/לְ/כִסְא֜/וֹ יִהְיֶ֥ה שָׁל֛וֹם עַד עוֹלָ֖ם מֵ/עִ֥ם יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/033.yaml
  text: So their blood shall return on the head of Joab and on the head of his offspring forever[a], but for David and for his offspring and for his house and for his throne, there shall be peace forever from Yahweh.
translation:
  language: hi
  text: इसलिए उनका खून योआब के सिर पर और उसके वंश के सिर पर सदा के लिए लौट आएगा[a]; पर दाऊद, उसके वंश, उसके घराने और उसके सिंहासन के लिए यहोवा की ओर से सदा शांति रहेगी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में ‘उनका खून’ उन लोगों के बहाए गए खून को सूचित करता है जिन्हें मारा गया था; यह मुहावरा उस खून के दोष और उत्तरदायित्व के हत्यारों पर आने का अर्थ भी रखता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁבוּ
  choice: बना रहेगा
  rationale: शाब्दिक अर्थ ‘लौटेगा’ है, पर खून का किसी के सिर पर लौटना उत्तरदायित्व और दण्ड उसी पर बने रहने का न्यायिक मुहावरा है। स्वाभाविक हिन्दी में ‘बना रहेगा’ इस भाव को स्पष्ट रखता है।
- source_word: דְמֵיהֶם
  choice: उनका खून
  rationale: मूल का ठोस रूपक सुरक्षित रखा गया है; यहाँ यह मारे गए लोगों के बहाए गए खून और उसके उत्तरदायित्व को सूचित करता है।
- source_word: בְּרֹאשׁ
  choice: के सिर पर
  rationale: दोष अथवा उसके परिणाम किसी पर आने का इब्रानी न्यायिक मुहावरा हिन्दी में भी समझ में आता है।
- source_word: זַרְעוֹ
  choice: उसके वंश
  rationale: सामूहिक भाव वाले זֶרַע के लिए ‘वंश’ स्वाभाविक और राजवंशीय सन्दर्भ के अनुकूल है।
- source_word: לְעֹלָם / עַד־עוֹלָם
  choice: सदा
  rationale: दोनों अभिव्यक्तियों की स्थायी अवधि को संक्षिप्त, गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: יִהְיֶה שָׁלוֹם
  choice: शान्ति रहेगी
  rationale: שָׁלוֹם की व्यापकता—शान्ति, कुशल और स्थिरता—को संकीर्ण किए बिना मुख्य अर्थ सुरक्षित रहता है।
- source_word: לְדָוִד וּלְזַרְעוֹ וּלְבֵיתוֹ וּלְכִסְאוֹ
  choice: दाऊद और उसके वंश, उसके घराने और उसके सिंहासन के लिए
  rationale: לְ का हित/सम्बन्धसूचक अर्थ ‘के लिए’ से व्यक्त किया गया है; ‘घराना’ राजवंशीय परिवार को और ‘सिंहासन’ शासन की निरन्तरता को बनाए रखता है।
- source_word: מֵעִם יְהוָה
  choice: यहोवा की ओर से
  rationale: यह शान्ति के स्रोत को स्पष्ट और स्वाभाविक हिन्दी में व्यक्त करता है; ईश्वरीय नाम को ‘यहोवा’ के रूप में लिप्यन्तरित किया गया है।
theological_decisions:
- issue: योआब के वंश पर न्याय और दाऊद के वंश पर शान्ति के बीच सम्बन्ध
  choice: ‘पर’ द्वारा विरोध स्पष्ट किया गया
  alternative: साधारण ‘और’ रखा जा सकता था
  rationale: इब्रानी ו औपचारिक रूप से ‘और’ है, किन्तु दोनों खण्डों में न्याय और शान्ति का स्पष्ट विरोध है; ‘पर’ कोई नई धर्मवैज्ञानिक व्याख्या जोड़े बिना प्रवाह स्पष्ट करता है।
- issue: שָׁלוֹם का राजवंशीय अर्थ
  choice: ‘शान्ति’
  alternative: ‘कुशल’ या ‘समृद्धि’
  rationale: ‘शान्ति’ शब्द कल्याण, सुरक्षा और स्थिरता के व्यापक अर्थ को खुला रखता है और इसे केवल आर्थिक समृद्धि तक सीमित नहीं करता।
- issue: योआब के वंश पर खून का बने रहना
  choice: वंश सम्बन्धी कथन को मूल की तरह यथावत रखा गया
  alternative: इसे केवल योआब के निजी अपराधबोध तक सीमित करना
  rationale: मूल पाठ स्पष्ट रूप से ‘उसके वंश के सिर पर’ कहता है। अनुवाद इस कठिन धर्मवैज्ञानिक तनाव को न तो हटाता है, न समझाकर हल करता है।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किन्तु सामान्य पाठक के लिए सहज। ‘खून’, ‘सिर पर’, ‘घराना’ और ‘सिंहासन’ जैसे मूल रूपकों तथा राजवंशीय भाषा को सुरक्षित रखा गया है।
