id: 1KI.2.32
reference: 1 Kings 2:32
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/הֵשִׁיב֩ יְהוָ֨ה אֶת דָּמ֜/וֹ עַל רֹאשׁ֗/וֹ אֲשֶׁ֣ר פָּגַ֣ע בִּ/שְׁנֵֽי אֲ֠נָשִׁים צַדִּקִ֨ים וְ/טֹבִ֤ים מִמֶּ֨/נּוּ֙ וַ/יַּהַרְגֵ֣/ם בַּ/חֶ֔רֶב וְ/אָבִ֥/י דָוִ֖ד לֹ֣א יָדָ֑ע אֶת אַבְנֵ֤ר בֶּן נֵר֙ שַׂר צְבָ֣א יִשְׂרָאֵ֔ל וְ/אֶת עֲמָשָׂ֥א בֶן יֶ֖תֶר שַׂר צְבָ֥א יְהוּדָֽה־־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/032.yaml
  text: 'And Yahweh will return his blood on his own head[a], because he struck down two men more righteous and better than he, and killed them with the sword while my father David did not know it: Abner son of Ner, commander of Israel’s army, and Amasa son of Jether, commander of Judah’s army.'
translation:
  language: hi
  text: याहवे उसके खून का दोष उसी के सिर पर लौटा देगा[a], क्योंकि उसने अपने से अधिक धर्मी और भले दो पुरुषों पर वार करके उन्हें तलवार से मार डाला था, और मेरे पिता दाऊद को इसका पता नहीं था। वे थे—नेर का पुत्र अब्नेर, इस्राएल की सेना का प्रधान, और येतेर का पुत्र अमासा, यहूदा की सेना का प्रधान।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “उसका खून उसी के सिर पर लौटा देगा।” इब्रानी मुहावरा रक्तपात की जिम्मेदारी और उसके प्रतिफल के दोषी व्यक्ति पर लौटने की बात करता है।
    reason: मूल मुहावरे और अर्थगत विकल्प को सुरक्षित रखना।
lexical_decisions:
- source_word: וְהֵשִׁיב
  choice: लौटा देगा
  rationale: हिफ़ील रूप यहाँ प्रतिफल या किए हुए रक्तपात का दोष अपराधी पर वापस आने का भाव देता है। ‘लौटा देगा’ इब्रानी बिंब को बनाए रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय आधुनिक हिन्दी में लिप्यंतरित किया गया है।
- source_word: דָּמוֹ ... עַל רֹאשׁוֹ
  choice: उसके खून का दोष उसी के सिर पर
  rationale: यह मुहावरा रक्तपात की जिम्मेदारी और उसके न्यायोचित प्रतिफल को व्यक्त करता है। ‘खून का दोष’ अर्थ स्पष्ट करता है और ‘सिर पर’ मूल बिंब बचाता है।
- source_word: פָּגַע
  choice: वार करके
  rationale: इस हिंसक प्रसंग में क्रिया शत्रुतापूर्ण प्रहार को दर्शाती है; इसके बाद हत्या का स्पष्ट उल्लेख है।
- source_word: צַדִּקִים וְטֹבִים מִמֶּנּוּ
  choice: अपने से अधिक धर्मी और भले
  rationale: दोनों तुलनात्मक विशेषणों—नैतिक/न्यायिक धार्मिकता और भलाई—को अलग-अलग सुरक्षित रखा गया है।
- source_word: וַיַּהַרְגֵם בַּחֶרֶב
  choice: उन्हें तलवार से मार डाला था
  rationale: हत्या और उसके साधन दोनों को सीधे, स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: וְאָבִי דָוִד לֹא יָדָע
  choice: और मेरे पिता दाऊद को इसका पता नहीं था
  rationale: यह स्पष्ट करता है कि दाऊद उन हत्याओं से अनजान थे; संयोजक को मूल के निकट रखते हुए हिन्दी में स्वाभाविक बनाया गया है।
- source_word: שַׂר צְבָא יִשְׂרָאֵל / שַׂר צְבָא יְהוּדָה
  choice: इस्राएल की सेना का प्रधान / यहूदा की सेना का प्रधान
  rationale: सैन्य पदवी का स्पष्ट और गरिमापूर्ण हिन्दी रूप, दोनों व्यक्तियों के लिए समान रूप से प्रयुक्त।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: प्रभु / यहोवा
  rationale: मूल पाठ में व्यक्तिगत वाचा-नाम है; ‘याहवे’ उसे उपाधि में बदले बिना लिप्यंतरित करता है।
- issue: ‘खून सिर पर लौटने’ के मुहावरे का अर्थ
  choice: रक्तपात का दोष और उसका प्रतिफल अपराधी पर लौटना
  alternative: उसका खून उसी के सिर पर लौटना
  rationale: मुख्य पाठ में ‘खून का दोष’ मुहावरे का आशय समझने योग्य बनाता है, जबकि ‘सिर पर लौटा देगा’ मूल इब्रानी बिंब और न्यायिक तनाव को बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज शैली रखी गई है। सैन्य पदवियों और नैतिक तुलना को स्पष्ट रखा गया है; रक्तपात वाले इब्रानी मुहावरे को मुख्य पाठ और पादटिप्पणी दोनों के माध्यम से प्रस्तुत किया गया है।
