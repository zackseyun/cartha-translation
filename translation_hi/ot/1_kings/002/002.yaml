  text: मैं सारी पृथ्वी के लोगों की राह पर जा रहा हूँ। इसलिए तू दृढ़ हो[a] और पुरुष बन।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अपने को पुरुष सिद्ध कर” या “पुरुषोचित बन।” इस इब्रानी अभिव्यक्ति में पुरुष होने के साथ साहस और उत्तरदायित्व से आचरण करने का भाव भी है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אָנֹכִי
  choice: मैं
  rationale: स्वतंत्र प्रथम पुरुष एकवचन सर्वनाम है; हिन्दी में सरल ‘मैं’ पर्याप्त और स्वाभाविक है।
- source_word: הֹלֵךְ
  choice: जा रहा हूँ
  rationale: सर्वनाम के साथ प्रयुक्त कालवाचक कृदन्त निकट आती मृत्यु की ओर जाने को व्यक्त करता है; ‘जा रहा हूँ’ इसकी गतिशील और आसन्न छाया बनाए रखता है।
- source_word: בְּדֶרֶךְ
  choice: राह पर
  rationale: ‘राह पर जाना’ मृत्यु के लिए प्रयुक्त मूल रूपक को बनाए रखता है और हिन्दी में समझने योग्य है।
- source_word: כָּל הָאָרֶץ
  choice: सारी पृथ्वी की
  rationale: शाब्दिक अर्थ ‘सारी पृथ्वी’ है; इस मुहावरे में आशय पृथ्वी के सभी मनुष्यों की समान मृत्यु-नियति से है, पर मुख्य पाठ रूपक को स्पष्ट व्याख्या में नहीं बदलता।
- source_word: וְחָזַקְתָּ
  choice: इसलिए तू दृढ़ हो
  rationale: सन्दर्भ में संयोजित पूर्ण क्रिया उपदेशात्मक आज्ञा का कार्य करती है। ‘इसलिए’ दाऊद की निकट मृत्यु और आगे दिए निर्देश का सम्बन्ध स्वाभाविक ढंग से दिखाता है।
- source_word: וְהָיִיתָ לְאִישׁ
  choice: और पुरुष बन
  rationale: ‘होना/बनना’ तथा ‘पुरुष’ दोनों को बनाए रखता है। सम्बोधन विशेष रूप से सुलैमान से है और अभिव्यक्ति साहस तथा उत्तरदायी परिपक्वता का संकेत देती है।
theological_decisions:
- issue: उपदेश में लिंग-विशिष्ट अभिव्यक्ति
  choice: पुरुष बन
  alternative: अपने को पुरुष सिद्ध कर; पुरुषोचित साहस दिखा
  rationale: इब्रानी अभिव्यक्ति व्याकरणतः पुल्लिंग है और सीधे सुलैमान को सम्बोधित है। ‘पुरुष बन’ मूल संज्ञा और पिता से पुत्र को दिए उपदेश का बल बनाए रखता है, जबकि पादटिप्पणी साहस और उत्तरदायित्व की प्रसंगगत छाया स्पष्ट करती है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सीधा और सामान्य पाठक के लिए सुबोध रूप। ‘तू’ पिता द्वारा पुत्र को किए गए एकवचन निकट सम्बोधन और आज्ञार्थक बल को सुरक्षित रखता है। मृत्यु को सीधे कहने के बजाय मूल इब्रानी के ‘सारी पृथ्वी की राह’ रूपक को बनाए रखा गया है।
