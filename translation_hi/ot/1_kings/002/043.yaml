base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/043.yaml
  text: Why then have you not kept the oath of Yahweh and the command that I commanded you?[a][b]
translation:
  language: hi
  text: फिर तुमने याहवे की शपथ क्यों नहीं निभाई और उस आज्ञा का पालन क्यों नहीं किया, जो मैंने तुम्हें दी थी?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात् याहवे के नाम पर या उनके अधिकार में खाई हुई शपथ।
    reason: lexical_alternative
  - marker: b
    text: 'इब्रानी में अधिक शाब्दिक रूप से: “वह आज्ञा, जो मैंने तुम पर रखी थी।”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמַדּוּעַ
  choice: फिर ... क्यों
  rationale: प्रश्नवाचक מַדּוּעַ का अर्थ ‘क्यों’ है; आरंभिक וּ को प्रसंग से जोड़ने के लिए स्वाभाविक हिन्दी में ‘फिर’ कहा गया है।
- source_word: שָׁמַרְתָּ
  choice: पालन ... नहीं किया
  rationale: שׁמר यहाँ शपथ और आज्ञा को मानने अथवा निभाने के अर्थ में है; ‘पालन करना’ दोनों के साथ स्पष्ट और स्वाभाविक है।
- source_word: שְׁבֻעַת יְהוָה
  choice: याहवे की शपथ
  rationale: सम्बन्ध-सूचक इब्रानी रचना को निकटता से रखा गया है। प्रसंग में इसका आशय याहवे के नाम पर या उनके सामने खाई गई शपथ है, न कि स्वयं याहवे द्वारा खाई गई शपथ; इस सम्भावित भ्रम को पादटिप्पणी में स्पष्ट किया गया है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी परमेश्वर-नाम יהוה का शीर्षक से प्रतिस्थापन करने के बजाय हिन्दी में लिप्यंतरण किया गया है।
- source_word: הַמִּצְוָה
  choice: आज्ञा
  rationale: מִצְוָה यहाँ दिए गए आदेश या बाध्यकारी निर्देश को दर्शाता है; ‘आज्ञा’ वर्तमान मानक हिन्दी में स्वाभाविक और गरिमापूर्ण है।
- source_word: אֲשֶׁר צִוִּיתִי עָלֶיךָ
  choice: जो मैंने तुम्हें दी थी
  rationale: צוה के साथ עַל का भाव किसी व्यक्ति पर आज्ञा लागू करने या उसे सौंपने का है। ‘आज्ञा ... दी थी’ हिन्दी में इस आशय को सहज रूप से व्यक्त करता है; अधिक शाब्दिक रूप पादटिप्पणी में दिया गया है।
theological_decisions:
- issue: שְׁבֻעַת יְהוָה में शपथ का सम्बन्ध
  choice: याहवे की शपथ
  alternative: याहवे के नाम पर खाई हुई शपथ / याहवे के सामने खाई हुई शपथ
  rationale: मूल की सम्बन्धवाचक रचना को मुख्य पाठ में सुरक्षित रखा गया है, जबकि प्रसंगगत आशय को पादटिप्पणी स्पष्ट करती है; इससे यह गलत निष्कर्ष नहीं निकाला गया कि शपथ स्वयं याहवे ने खाई थी।
- issue: परमेश्वर-नाम יְהוָה का रूप
  choice: याहवे
  alternative: यहोवा / प्रभु
  rationale: मूल पाठ में व्यक्तिगत परमेश्वर-नाम है; इसलिए उसे शीर्षक ‘प्रभु’ से बदलने के बजाय लिप्यंतरित किया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सीधा राजकीय प्रश्न रखा गया है। ‘तुम’ एकवचन सम्बोधन के अनुरूप है। भाषा सहज है, पर शपथ और आज्ञा की बाध्यकारी गंभीरता बनाए रखती है।
