id: 1KI.2.9
reference: 1 Kings 2:9
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/עַתָּה֙ אַל תְּנַקֵּ֔/הוּ כִּ֛י אִ֥ישׁ חָכָ֖ם אָ֑תָּה וְ/יָֽדַעְתָּ֙ אֵ֣ת אֲשֶׁ֣ר תַּֽעֲשֶׂה לּ֔/וֹ וְ/הוֹרַדְתָּ֧ אֶת שֵׂיבָת֛/וֹ בְּ/דָ֖ם שְׁאֽוֹל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/009.yaml
  text: But now[a], do not hold him guiltless, for you are a wise man, and you will know what you should do to him; and you shall bring his gray head down to Sheol with blood.
translation:
  language: hi
  text: पर अब उसे निर्दोष न ठहराना, क्योंकि तुम एक बुद्धिमान पुरुष हो; तुम जानोगे कि उसके साथ क्या करना चाहिए। और उसके सफेद बालों वाले सिर को लहू के साथ शिओल[a] में उतार देना।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “कब्र” अथवा “मृतकों का लोक।”
    reason: इब्रानी शिओल का अर्थ-क्षेत्र कब्र से लेकर मृतकों के लोक तक हो सकता है; लिप्यंतरण इस व्यापकता को सुरक्षित रखता है।
lexical_decisions:
- source_word: תְּנַקֵּהוּ
  choice: उसे निर्दोष न ठहराना
  rationale: पिएल रूप का न्यायिक भाव ‘निर्दोष ठहराना/दण्ड से मुक्त छोड़ना’ है। यह अनुवाद मूल की विधिक शक्ति को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: אִישׁ חָכָם
  choice: बुद्धिमान पुरुष
  rationale: सम्बोधन सुलैमान से है; इसलिए पुल्लिंग और व्यक्ति-विशेष का भाव सुरक्षित रखा गया है।
- source_word: וְיָדַעְתָּ אֵת אֲשֶׁר תַּעֲשֶׂה לוֹ
  choice: और जानते हो कि तुम्हें उसके साथ क्या करना चाहिए
  rationale: कथन सुलैमान के विवेक पर दाऊद के भरोसे को व्यक्त करता है। ‘क्या करना चाहिए’ राजकीय-न्यायिक प्रसंग में निहित उचित कार्रवाई को दर्शाता है।
- source_word: וְהוֹרַדְתָּ
  choice: उतार देना
  rationale: हिफ़ील का कारणवाचक अर्थ ‘नीचे उतारना’ है और प्रसंग में यह निर्देशात्मक बल रखता है।
- source_word: שֵׂיבָתוֹ
  choice: उसके पके बालों वाले सिर
  rationale: मूल में धवल/पके बालों की छवि वृद्धावस्था के लिए लक्षणा है। हिन्दी में ‘पके बालों वाला सिर’ उस ठोस इब्रानी बिम्ब को सुरक्षित रखता है।
- source_word: בְּדָם
  choice: लहू के साथ
  rationale: यह हिंसक, रक्तपातपूर्ण मृत्यु का कठोर भाव सुरक्षित रखता है, बिना उसे केवल ‘हत्या करके’ के रूप में व्याख्यायित किए।
- source_word: שְׁאוֹל
  choice: अधोलोक
  rationale: ‘अधोलोक’ मृतकों के लोक का व्यापक भाव देता है और इसे केवल भौतिक कब्र तक सीमित नहीं करता। पाठक के लिए ‘कब्र’ का विकल्प पादटिप्पणी में दिया गया है।
theological_decisions:
- issue: שְׁאוֹל का अनुवाद
  choice: अधोलोक
  alternative: कब्र; मृतकों का लोक; शिओल
  rationale: ‘अधोलोक’ इब्रानी धारणा की व्यापकता को बनाए रखता है और पद को केवल दफ़नाने की जगह या किसी बाद की व्यवस्थित परलोक-धारणा तक सीमित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सीधा और न्यायिक निर्देश के अनुरूप कठोर स्वर रखा गया है। ‘पके बालों वाले सिर’ और ‘लहू के साथ’ जैसे मूल बिम्ब जानबूझकर सुरक्षित हैं।
