  yaml_path: translation/ot/1_kings/002/013.yaml
  text: Then Adonijah son of Haggith came to Bathsheba[a], the mother of Solomon, and she said, “Do you come in peace?” And he said, “In peace.”
translation:
  language: hi
  text: तब हग्गीत का पुत्र अदोनिय्याह सुलैमान की माता बतशेबा के पास आया। उसने पूछा, “क्या तुम शांति से आए हो[a]?” अदोनिय्याह ने कहा, “शांति से।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, अधिक शाब्दिक रूप से, “क्या तुम्हारा आना शांति है?”
    reason: इब्रानी הֲשָׁלוֹם בֹּאֶךָ की संक्षिप्त संरचना को दर्शाता है; मुख्य पाठ में स्वाभाविक हिन्दी मुहावरा रखा गया है।
