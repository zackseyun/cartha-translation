- source_word: בֶן חַגֵּית
  choice: हग्गीत का पुत्र
  rationale: वंश-संबंध बताने वाली इब्रानी रचना को औपचारिक और सहज हिन्दी में रखा गया है।
- source_word: בַּת שֶׁבַע
  choice: बतशेबा
  rationale: इब्रानी व्यक्तिगत नाम का प्रचलित देवनागरी रूप।
- source_word: אֵם שְׁלֹמֹה
  choice: सुलैमान की माता
  rationale: यह समानाधिकरण बतशेबा की पहचान सुलैमान से उसके राजकीय पारिवारिक संबंध द्वारा कराता है।
- source_word: הֲשָׁלוֹם בֹּאֶךָ
  choice: क्या तुम्हारा आना शांतिपूर्ण है?
  rationale: शाब्दिक संरचना ‘क्या तुम्हारा आना शांति है?’ है; यहाँ שָׁלוֹם आने के शांतिपूर्ण उद्देश्य को सूचित करता है। चुना गया रूप मूल प्रश्न की संक्षिप्तता और आशंका दोनों बनाए रखता है।
- source_word: שָׁלוֹם
  choice: शांतिपूर्ण है
  rationale: उत्तर मूल में केवल ‘शांति’ है और पिछले प्रश्न के शब्द को दोहराता है; हिन्दी में संक्षिप्त विधेय जोड़कर उसी अर्थ और लघुता को स्वाभाविक बनाया गया है।
