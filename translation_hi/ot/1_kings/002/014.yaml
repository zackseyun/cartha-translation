- source_word: וַיֹּאמֶר
  choice: तब उसने कहा
  rationale: वय्यिक्तोल रूप कथा में अगली क्रिया को आगे बढ़ाता है; ‘तब’ क्रम को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: דָּבָר לִי אֵלָיִךְ
  choice: मुझे आपसे कुछ कहना है
  rationale: शाब्दिक संरचना ‘मेरे लिए/पास एक बात तुम्हारी ओर है’ एक इब्रानी मुहावरा है। हिन्दी में इसका स्वाभाविक और अर्थनिष्ठ रूप ‘मुझे आपसे कुछ कहना है’ है।
- source_word: וַתֹּאמֶר
  choice: उसने कहा
  rationale: स्त्रीलिंग वय्यिक्तोल रूप संवाद में बतशेबा की सीधी प्रतिक्रिया व्यक्त करता है; हिन्दी में सर्वनाम का लिंग क्रिया-रूप में प्रकट नहीं होता, पर संदर्भ वक्ता को स्पष्ट करता है।
- source_word: דַּבֵּר
  choice: कहो
  rationale: पुल्लिंग एकवचन आज्ञार्थक का संक्षिप्त और स्वाभाविक हिन्दी समतुल्य ‘कहो’ है; इससे मूल में निहित न होने वाला अतिरिक्त भाव नहीं जुड़ता।
