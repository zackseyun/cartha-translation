    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: और अब
  rationale: संवाद में अगले अनुरोध की ओर बढ़ने वाला संयोजक और कालसूचक पद; וְ और עַתָּה दोनों का स्वाभाविक हिन्दी रूप।
- source_word: שְׁאֵלָה אַחַת
  choice: एक विनती
  rationale: שְׁאֵלָה यहाँ याचना या अनुरोध को दर्शाता है; ‘एक विनती’ प्रसंगानुकूल, सहज और गरिमापूर्ण है।
- source_word: אָנֹכִי שֹׁאֵל מֵאִתָּךְ
  choice: मैं तुझसे ... करता हूँ
  rationale: स्वतंत्र सर्वनाम और कृदन्त वर्तमान में की जा रही विनती पर बल देते हैं; हिन्दी में ‘मैं तुझसे एक विनती करता हूँ’ स्वाभाविक है।
- source_word: אַל תָּשִׁבִי אֶת פָּנָי
  choice: मेरी बात न टालना
  rationale: शाब्दिक बिंब ‘मेरा मुँह न फेरना/लौटाना’ हिन्दी में अस्पष्ट हो सकता है। मुहावरे का आशय अनुरोध न ठुकराना है, जिसे ‘मेरी बात न टालना’ सहज रूप से व्यक्त करता है।
- source_word: וַתֹּאמֶר אֵלָיו
  choice: उसने उससे कहा
  rationale: स्त्रीलिंग क्रिया से बतशेबा वक्ता है; हिन्दी में सर्वनाम प्रसंग से स्पष्ट हैं।
- source_word: דַּבֵּר
  choice: कह
  rationale: पुल्लिंग एकवचन आज्ञार्थक रूप उसे अपनी विनती बताने का संक्षिप्त निमंत्रण देता है।
