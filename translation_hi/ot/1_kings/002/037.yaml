source:
  edition: WLC
  text: וְ/הָיָ֣ה בְּ/י֣וֹם צֵאתְ/ךָ֗ וְ/עָֽבַרְתָּ֙ אֶת נַ֣חַל קִדְר֔וֹן יָדֹ֥עַ תֵּדַ֖ע כִּ֣י מ֣וֹת תָּמ֑וּת דָּמְ/ךָ֖ יִהְיֶ֥ה בְ/רֹאשֶֽׁ/ךָ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/037.yaml
  text: For on the day you go out and cross the Kidron Valley[a], know for certain that you shall surely die[b]; your blood shall be on your own head.
translation:
  language: hi
  text: क्योंकि जिस दिन तुम बाहर निकलकर किद्रोन की घाटी[a] पार करोगे, उस दिन निश्चय जान लेना कि तुम अवश्य मरोगे; तुम्हारा खून तुम्हारे ही सिर पर होगा।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “किद्रोन की जलधारा।” इब्रानी शब्द נחל घाटी, वादी या मौसमी जलधारा के लिए प्रयुक्त हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: “तुम्हारा खून तुम्हारे ही सिर पर होगा” एक इब्रानी मुहावरा है, जिसका अर्थ है कि अपनी मृत्यु के लिए तुम स्वयं जिम्मेदार होगे।
    reason: cultural_note
lexical_decisions:
- source_word: וְהָיָה בְּיוֹם
  choice: क्योंकि जिस दिन … उस दिन
  rationale: संदर्भ में यह पहले दिए गए आदेश के उल्लंघन का परिणाम बताता है। ‘जिस दिन … उस दिन’ इब्रानी की समय-सूचक, गंभीर कानूनी शैली को स्वाभाविक हिन्दी में रखता है।
- source_word: צֵאתְךָ
  choice: तुम बाहर निकलकर
  rationale: यह शिमी के निर्धारित सीमा से बाहर जाने को व्यक्त करता है; क्रियात्मक और सहज हिन्दी चुनी गई है।
- source_word: וְעָבַרְתָּ אֶת נַחַל קִדְרוֹן
  choice: किद्रोन की घाटी पार करोगे
  rationale: נחל घाटी, वादी अथवा मौसमी जलधारा को सूचित कर सकता है। भौगोलिक संदर्भ में ‘घाटी’ सहज है, जबकि पादटिप्पणी में वैकल्पिक अर्थ सुरक्षित रखा गया है।
- source_word: יָדֹעַ תֵּדַע
  choice: यह निश्चय जान लेना
  rationale: इनफिनिटिव एब्सोल्यूट और सीमित क्रिया का संयोजन प्रबल बलाघात देता है; ‘निश्चय’ उस जोर को स्पष्ट हिन्दी में व्यक्त करता है।
- source_word: כִּי מוֹת תָּמוּת
  choice: कि तुम अवश्य मार डाले जाओगे
  rationale: यहाँ शाही दंड की चेतावनी है। इब्रानी की बलाघाती रचना मृत्यु की निश्चितता बताती है; ‘अवश्य’ उसे बनाए रखता है और प्रसंगानुसार दंड द्वारा मृत्यु को व्यक्त करता है।
- source_word: דָּמְךָ יִהְיֶה בְרֹאשֶׁךָ
  choice: तुम्हारा खून तुम्हारे ही सिर पर होगा
  rationale: मूल कानूनी-मुहावरे और उसकी सजीव छवि को बनाए रखते हुए ‘ही’ से स्वयं की जिम्मेदारी स्पष्ट की गई है।
theological_decisions:
- issue: मृत्युदंड और व्यक्तिगत उत्तरदायित्व का कानूनी मुहावरा
  choice: मुख्य पाठ में ‘तुम्हारा खून तुम्हारे ही सिर पर होगा’ रखा गया है।
  alternative: अपनी मृत्यु के लिए तुम स्वयं जिम्मेदार होगे।
  rationale: शाब्दिक मुहावरा न्यायिक चेतावनी और नैतिक उत्तरदायित्व दोनों को सुरक्षित रखता है; पादटिप्पणी उसका आशय स्पष्ट करती है, बिना मूल बिंब हटाए।
- issue: מוֹת תָּמוּת में मृत्यु की वाच्यता
  choice: तुम अवश्य मार डाले जाओगे
  alternative: तुम निश्चय मरोगे
  rationale: रूप अपने आप में केवल निश्चित मृत्यु कहता है, पर निकट प्रसंग इसे उल्लंघन पर राजा द्वारा दिए जाने वाले दंड की चेतावनी बनाता है। हिन्दी में कर्मवाच्य इस न्यायिक प्रसंग को स्वाभाविक रूप से व्यक्त करता है, जबकि बलाघात ‘अवश्य’ में सुरक्षित है।
translation_notes:
  register: आधुनिक मानक हिन्दी की गंभीर, राजकीय-कानूनी शैली अपनाई गई है। वाक्य सामान्य पाठक के लिए सहज रखा गया है, जबकि इब्रानी के दोहरे बलाघात और उत्तरदायित्व के मूल मुहावरे को संरक्षित किया गया है।
