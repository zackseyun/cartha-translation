- source_word: לְאִשָּׁה
  choice: पत्नी के रूप में
  rationale: यह रचना विवाह-संबंध में स्त्री को देने/लेने का अर्थ रखती है; चयन marital sense को स्पष्ट और संक्षिप्त रखता है।
