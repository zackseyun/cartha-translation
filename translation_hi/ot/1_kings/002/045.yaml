  text: But King Solomon will be blessed[a], and the throne of David will be established before Yahweh forever.
translation:
  language: hi
  text: परन्तु राजा सुलैमान धन्य होगा[a], और दाऊद का सिंहासन यहोवा के सामने सदा के लिए स्थिर रहेगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “राजा सुलैमान धन्य है।” हिब्रू की क्रियारहित विधेय रचना को वर्तमान घोषणा के रूप में भी समझा जा सकता है, यद्यपि प्रसंग मुख्य पाठ में दिए भविष्याभिमुख अनुवाद का भी समर्थन करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/הַ/מֶּלֶךְ
  choice: परन्तु राजा
  rationale: וְ यहाँ पिछले पद में शिमई पर आनेवाले दण्ड और सुलैमान की आशीष के बीच विरोध दर्शाता है; इसलिए स्वाभाविक हिन्दी में ‘परन्तु’ उपयुक्त है।
- source_word: שְׁלֹמֹה
  choice: सुलैमान
  rationale: व्यक्तिनाम का प्रचलित मानक हिन्दी बाइबलीय रूप।
- source_word: בָּרוּךְ
  choice: आशीष पाएगा
  rationale: यह रूप मूल के ‘धन्य/आशीषित’ होने का भाव देता है। निकटवर्ती भविष्यकालीन יִהְיֶה और न्यायिक घोषणा के प्रसंग के कारण मुख्य पाठ में भविष्याभिमुख अर्थ रखा गया है, जबकि वर्तमान अर्थ की वास्तविक सम्भावना पादटिप्पणी में सुरक्षित है।
- source_word: וְ/כִסֵּא דָוִד
  choice: और दाऊद का सिंहासन
  rationale: सम्बन्धवाचक हिब्रू रचना को सहज हिन्दी अधिकार-सूचक रचना में व्यक्त किया गया है।
- source_word: יִהְיֶה נָכוֹן
  choice: स्थिर रहेगा
  rationale: היה + נכון सिंहासन के दृढ़, सुरक्षित और स्थापित रहने को व्यक्त करता है। ‘स्थिर रहेगा’ राजवंशीय निरन्तरता का भाव स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: לִ/פְנֵי יְהוָה
  choice: यहोवा के सामने
  rationale: לִפְנֵי का निकट अर्थ ‘के सामने/की उपस्थिति में’ है; यहाँ संक्षिप्त और स्वाभाविक हिन्दी रूप चुना गया है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: मूल में आए परमेश्वर के विशिष्ट वाचक नाम को हिन्दी में प्रचलित ‘यहोवा’ रूप से प्रत्यक्ष रखा गया है।
- source_word: עַד עוֹלָם
  choice: सदा के लिए
  rationale: यह पदबंध अनिश्चित, निरन्तर भविष्य अर्थात ‘सदा’ का भाव देता है; ‘सदा के लिए’ आधुनिक हिन्दी में स्पष्ट है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल का विशिष्ट वाचक नाम सामान्य उपाधि में बदले बिना रखा गया है। ‘यहोवा’ हिन्दी पाठकों में व्यापक रूप से पहचाना जाने वाला रूप है; ‘याहवे’ अधिक निकट वैकल्पिक लिप्यन्तरण है।
- issue: בָּרוּךְ कथन का कालगत बल
  choice: भविष्याभिमुख ‘आशीष पाएगा’
  alternative: वर्तमान ‘आशीषित है’
  rationale: हिब्रू की क्रियारहित विधेय रचना वर्तमान घोषणा भी हो सकती है, पर अगले भविष्यकालीन कथन और प्रसंग की राजकीय घोषणा से भविष्याभिमुख पाठ समर्थित है। अस्पष्टता को पादटिप्पणी में स्पष्ट रखा गया है।
- issue: दाऊद के सिंहासन की स्थिरता
  choice: ‘सदा के लिए स्थिर रहेगा’
  alternative: ‘सदा के लिए स्थापित रहेगा’
  rationale: भाषा राजवंशीय दृढ़ता व्यक्त करती है, पर पद स्वयं उस प्रतिज्ञा की पूर्ति का कोई विशिष्ट बाद का धर्मवैज्ञानिक ढाँचा निर्धारित नहीं करता; इसलिए अनावश्यक व्याख्या नहीं जोड़ी गई।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और सार्वजनिक पाठ के योग्य रूप। ‘परन्तु’ से प्रसंगगत विरोध, ‘सिंहासन’ से राजकीय बिंब और ‘स्थिर रहेगा’ से मूल की राजवंशीय दृढ़ता सुरक्षित रखी गई है।
