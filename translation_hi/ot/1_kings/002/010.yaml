lexical_decisions:
- source_word: וַיִּשְׁכַּב
  choice: सो गया
  rationale: שׁכב का मूल अर्थ ‘लेटना/सोना’ है। राजकीय मृत्यु-वृत्तांत के इस प्रचलित मुहावरे में इसका आशय मरने से है; ‘सो गया’ मूल बिंब और साहित्यिक निरंतरता को बनाए रखता है।
- source_word: עִם אֲבֹתָיו
  choice: अपने पुरखाओं के साथ
  rationale: यह मृत्यु-सूचनाओं में प्रयुक्त मानक इब्रानी अभिव्यक्ति है। ‘पुरखाओं’ से वंशगत संबंध स्पष्ट होता है और आधुनिक हिन्दी में यह ‘पितरों’ की अपेक्षा अधिक सामान्य तथा गैर-सांप्रदायिक है।
- source_word: וַיִּקָּבֵר
  choice: उसे दफनाया गया
  rationale: निफ़अल रूप यहाँ कर्मवाच्य अर्थ देता है। यह हिन्दी में स्वाभाविक और अर्थ की दृष्टि से सीधा अनुवाद है।
- source_word: בְּעִיר דָּוִד
  choice: दाऊद के नगर में
  rationale: यह दाऊद से संबद्ध गढ़/स्थान का स्थापित नाम है। यह अनुवाद स्थाननाम की पारदर्शिता और मूल संरचना दोनों को बनाए रखता है।
- source_word: וַ
  choice: तब / और
  rationale: पहला वाव कथा को आगे बढ़ाता है, इसलिए ‘तब’ स्वाभाविक है; दूसरा संबद्ध घटना को जोड़ता है, इसलिए ‘और’ उपयुक्त है।
theological_decisions:
- issue: ‘अपने पुरखाओं के साथ सो गया’ का आशय
  choice: मृत्यु के पारंपरिक मुहावरे को मुख्य पाठ में बनाए रखा गया
  alternative: ‘मर गया’
  rationale: मूल इब्रानी मृत्यु को ‘सोने’ के मुहावरे से व्यक्त करता है। इसे सीधे ‘मर गया’ करने से मूल का साहित्यिक बिंब मिट जाता; पादटिप्पणी अर्थ स्पष्ट करती है, बिना परलोक के विषय में अतिरिक्त निष्कर्ष जोड़े।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण मानक हिन्दी। ‘पुरखाओं’ सामान्य पाठक के लिए स्पष्ट है; ‘दफनाया गया’ प्रचलित कर्मवाच्य अभिव्यक्ति है।
