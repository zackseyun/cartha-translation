  yaml_path: translation/ot/1_kings/002/021.yaml
  text: And she said, “Let Abishag the Shunammite be given to Adonijah your brother as a wife.”
translation:
  language: hi
  text: उसने कहा, “शूनेमवासी अबीशग तुम्हारे भाई अदोनिय्याह को पत्नी के रूप में दे दी जाए।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: उसने कहा
  rationale: वाव-क्रमिक कथा को आगे बढ़ाता है। हिंदी में प्रसंग के भीतर सरल ‘उसने कहा’ स्वाभाविक है; ‘और’ जोड़ना आवश्यक नहीं और इससे अर्थ नहीं बदलता।
- source_word: יֻתַּן
  choice: दे दी जाए
  rationale: निष्क्रिय जुस्सिव अनुरोध या प्रस्ताव व्यक्त करता है। ‘दे दी जाए’ आधुनिक हिंदी में इस इच्छार्थक भाव को स्वाभाविक रूप से बनाए रखता है।
- source_word: אֲבִישַׁג
  choice: अबीशग
  rationale: व्यक्तिनाम का स्रोतानुकूल देवनागरी लिप्यंतरण किया गया है।
- source_word: הַשֻּׁנַמִּית
  choice: शूनेमवासी
  rationale: यह संबोधन अबीशग के शूनेम नगर से होने की पहचान देता है। ‘शूनेमवासी’ संक्षिप्त, स्पष्ट और हिंदी में स्वाभाविक है।
- source_word: לַאֲדֹנִיָּהוּ
  choice: अदोनिय्याह को
  rationale: लामेद यहाँ विवाह में दिए जाने वाले व्यक्ति के प्राप्तकर्ता को चिह्नित करता है; हिंदी में ‘को’ इसका सीधा और स्वाभाविक रूप है।
- source_word: אָחִיךָ
  choice: तुम्हारे भाई
  rationale: द्वितीय पुरुष पुल्लिंग एकवचन प्रत्यय सीधे सुलैमान को संबोधित करता है और पारिवारिक संबंध को स्पष्ट रखता है।
- source_word: לְאִשָּׁה
  choice: पत्नी के रूप में
  rationale: विवाह-संदर्भ में यह पदबंध स्त्री को विवाह में पत्नी बनाए जाने का अर्थ देता है। यह अनुवाद औपचारिक वैवाहिक अर्थ को स्पष्ट रखता है।
