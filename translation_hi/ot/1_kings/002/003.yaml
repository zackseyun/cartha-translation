base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/003.yaml
  text: And keep the charge of Yahweh your God by walking in his ways and by keeping his statutes[a], his commandments, his judgments, and his testimonies, as it is written in the Law of Moses, so that you may act wisely in all that you do and wherever you turn.
translation:
  language: hi
  text: 'और अपने परमेश्वर यहोवा के प्रति अपना कर्तव्य निभाओ: उसके मार्गों पर चलो और उसकी विधियों, आज्ञाओं, न्याय-विधानों और साक्ष्य-विधानों का पालन करो, जैसा मूसा की व्यवस्था में लिखा है, ताकि तुम जो कुछ करो और जहाँ कहीं भी जाओ, उसमें बुद्धिमानी से काम करो[a]।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “सफल हो।” इब्रानी क्रिया बुद्धिमानी से काम करने पर या उससे मिलने वाली सफलता पर बल दे सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁמַרְתָּ אֶת־מִשְׁמֶרֶת
  choice: सौंपी हुई ज़िम्मेदारी पूरी करना
  rationale: מִשְׁמֶרֶת किसी सौंपे गए दायित्व या प्रभार को दर्शाता है। आधुनिक हिन्दी में यह वाक्यांश अर्थ को स्वाभाविक रूप से व्यक्त करता है; संयुक्त क्रिया पूर्ववर्ती उपदेश की आज्ञार्थक निरंतरता है।
- source_word: יְהוָה אֱלֹהֶיךָ
  choice: अपने परमेश्वर यहोवा
  rationale: यहोवा व्यक्तिगत ईश्वरीय नाम को प्रत्यक्ष रखता है और אֱלֹהֶיךָ के द्वितीय पुरुष एकवचन संबंध को 'अपने परमेश्वर' व्यक्त करता है।
- source_word: לָלֶכֶת בִּדְרָכָיו
  choice: उसके मार्गों पर चलना
  rationale: मूल इब्रानी के चाल-चलन संबंधी रूपक को सुरक्षित रखते हुए आधुनिक हिन्दी में सहज अभिव्यक्ति।
- source_word: חֻקֹּתָיו מִצְוֺתָיו וּמִשְׁפָּטָיו וְעֵדְוֺתָיו
  choice: उसकी विधियों, आज्ञाओं, न्याय-विधानों और साक्षियों
  rationale: कानूनी-वाचागत सूची के चार निकट किंतु अलग शब्दों का भेद यथासंभव बनाए रखा गया है। 'साक्षियाँ' औपचारिक है, पर עֵדְוֺת की साक्ष्य/वाचा-संबंधी छाया बचाता है।
- source_word: בְּתוֹרַת מֹשֶׁה
  choice: मूसा की व्यवस्था में
  rationale: इस लिखित, राजकीय-वाचागत संदर्भ में תּוֹרָה के लिए प्रचलित और स्पष्ट अनुवाद।
- source_word: לְמַעַן תַּשְׂכִּיל
  choice: ताकि ... बुद्धिमानी से काम करो
  rationale: שׂכל के हिफ़ील रूप में विवेकपूर्ण आचरण और उससे मिलने वाली सफलता दोनों की संभावना है। मुख्य पाठ में निकटतर क्रियात्मक अर्थ रखा गया और विकल्प पादटिप्पणी में दिया गया।
- source_word: וְאֵת כָּל־אֲשֶׁר תִּפְנֶה שָׁם
  choice: और जिधर कहीं मुड़ो
  rationale: दिशा बदलने के मूल रूपक को बचाता है और प्रसंग में हर कार्यक्षेत्र की व्यापकता व्यक्त करता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: प्रभु
  rationale: मूल पाठ में उपाधि नहीं बल्कि चतुरक्षरीय व्यक्तिगत नाम है। हिन्दी में व्यापक रूप से पहचाना जाने वाला नामरूप 'यहोवा' स्रोत की इस विशेषता को सुरक्षित रखता है।
- issue: תַּשְׂכִּיל में बुद्धिमानी और सफलता का संबंध
  choice: बुद्धिमानी से काम करो
  alternative: सफल हो / फलो-फूलो
  rationale: क्रिया विवेकपूर्ण आचरण अथवा उससे उत्पन्न सफलता को सूचित कर सकती है। मुख्य पाठ किसी समृद्धि-सिद्धांत को आरोपित किए बिना आचरण के पहलू को रखता है और वास्तविक अर्थ-विकल्प पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: आधुनिक मानक हिन्दी; गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध। कानूनी-वाचागत पदों का भेद बनाए रखने के कारण 'न्याय-विधान' और 'साक्षियाँ' अपेक्षाकृत औपचारिक रखे गए हैं।
