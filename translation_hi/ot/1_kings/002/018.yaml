  text: Bathsheba said[a], “Good; I will speak to the king for you.”
translation:
  language: hi
  text: बतशेबा ने कहा, “अच्छा, मैं तुम्हारे लिए[a] राजा से बात करूँगी।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “तुम्हारे विषय में” अथवा “तुम्हारी ओर से।” हिब्रू पदबंध किसी के विषय में बोलने का अर्थ दे सकता है; इस प्रसंग में संभवतः अदोनिय्याह के पक्ष में निवेदन करना अभिप्रेत है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: ने कहा
  rationale: यह אמר के सामान्य कथात्मक रूप का स्वाभाविक हिन्दी अनुवाद है और इसके बाद प्रत्यक्ष कथन आता है।
- source_word: בַּת שֶׁבַע
  choice: बतशेबा
  rationale: व्यक्तिवाचक नाम का हिन्दी में प्रचलित बाइबलीय लिप्यंतरण रखा गया है; नाम के शाब्दिक अर्थ का अनुवाद नहीं किया गया।
- source_word: טוֹב
  choice: अच्छा
  rationale: यहाँ यह संक्षिप्त स्वीकृतिसूचक उत्तर है। ‘अच्छा’ हिब्रू की संक्षिप्तता बनाए रखते हुए आधुनिक हिन्दी संवाद में स्वाभाविक है।
- source_word: אָנֹכִי
  choice: मैं
  rationale: स्वतंत्र सर्वनाम स्पष्ट कर्ता को व्यक्त करता है। हिन्दी में ‘मैं’ आवश्यक और स्वाभाविक है; अतिरिक्त बल जोड़ना जरूरी नहीं।
- source_word: אֲדַבֵּר
  choice: बात करूँगी
  rationale: דבר का अर्थ यहाँ राजा से बोलना या बात करना है। ‘बात करूँगी’ स्वाभाविक हिन्दी है और निहित निवेदन को अनावश्यक रूप से स्पष्ट नहीं करती।
- source_word: עָלֶיךָ
  choice: तुम्हारे लिए
  rationale: על के साथ דבר का अर्थ किसी के विषय में या उसकी ओर से बोलना हो सकता है। प्रसंग में अदोनिय्याह के पक्ष में मध्यस्थता संभावित है, इसलिए ‘तुम्हारे लिए’ मुख्य पाठ में स्वाभाविक है, जबकि अस्पष्टता पादटिप्पणी में सुरक्षित है।
- source_word: אֶל הַמֶּלֶךְ
  choice: राजा से
  rationale: हिन्दी में ‘किसी से बात करना’ लक्ष्य व्यक्ति को व्यक्त करने का स्वाभाविक ढंग है; यह हिब्रू ‘राजा की ओर/से’ के आशय को सही रूप से देता है।
