source:
  edition: WLC
  text: וַ/יֹּ֧אמֶר ל֣/וֹ הַ/מֶּ֗לֶךְ עֲשֵׂה֙ כַּ/אֲשֶׁ֣ר דִּבֶּ֔ר וּ/פְגַע בּ֖/וֹ וּ/קְבַרְתּ֑/וֹ וַ/הֲסִירֹ֣תָ דְּמֵ֣י חִנָּ֗ם אֲשֶׁר֙ שָׁפַ֣ךְ יוֹאָ֔ב מֵ/עָלַ֕/י וּ/מֵ/עַ֖ל בֵּ֥ית אָבִֽ/י־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/031.yaml
  text: Then the king said to him[a], “Do as he has said, and strike him down and bury him[b], and remove from me and from my father’s house the innocent blood that Joab shed.”
translation:
  language: hi
  text: तब राजा ने उससे कहा, “जैसा उसने कहा है, वैसा ही कर। उसे मार डाल[a] और दफ़ना दे; और उस निर्दोष रक्त को, जो योआब ने बहाया था, मुझ पर से और मेरे पिता के घराने पर से हटा दे[b]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से “उस पर टूट पड़”; इस प्रसंग में यह मुहावरा उसे प्राणदंड देकर मार डालने को दर्शाता है।
    reason: lexical_alternative
  - marker: b
    text: “निर्दोष रक्त” अन्यायपूर्वक किए गए रक्तपात के लिए हिब्रू का कानूनी और नैतिक मुहावरा है; इसमें उस रक्तपात से उत्पन्न दोष का भाव भी निहित है।
    reason: cultural_note
lexical_decisions:
- source_word: עֲשֵׂה כַּאֲשֶׁר דִּבֶּר
  choice: जैसा उसने कहा है, वैसा ही कर
  rationale: आज्ञा की सीधी शैली और अभी-अभी कही गई बात की ओर संकेत—दोनों को स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: וּפְגַע בּוֹ
  choice: उसे मार डाल
  rationale: פגע ב इस प्रसंग में प्राणदंड देने के अर्थ में है। शाब्दिक हिंसात्मक मुहावरे के बजाय उसका प्रसंगानुकूल घातक आशय मुख्य पाठ में दिया गया है और शाब्दिक रूप पादटिप्पणी में रखा गया है।
- source_word: וּקְבַרְתּוֹ
  choice: और दफ़ना दे
  rationale: क्रम में दी गई दूसरी प्रत्यक्ष आज्ञा का सरल और प्रचलित हिन्दी रूप।
- source_word: וַהֲסִירֹתָ
  choice: और ... हटा दे
  rationale: हिब्रू के समन्वय को सीधे बनाए रखता है। इसे केवल उद्देश्यवाचक बनाकर अर्थ को अनावश्यक रूप से सीमित नहीं किया गया।
- source_word: דְּמֵי חִנָּם
  choice: निर्दोष रक्त
  rationale: अन्यायपूर्वक बहाए गए रक्त और उससे जुड़े दोष का ठोस हिब्रू कानूनी-नैतिक मुहावरा सुरक्षित रहता है।
- source_word: מֵעָלַי וּמֵעַל בֵּית אָבִי
  choice: मुझ पर से और मेरे पिता के घराने पर से
  rationale: על से व्यक्त उस धारणा को बनाए रखता है कि रक्तपात का दोष किसी व्यक्ति और घराने पर ठहरा हुआ है।
theological_decisions:
- issue: योआब के रक्तपात के लिए राजा और राजघराने पर ठहरने वाला दोष
  choice: ‘निर्दोष रक्त’ को सुलैमान और उसके पिता के घराने ‘पर से’ हटाने की ठोस भाषा रखी गई है।
  alternative: इसे स्पष्ट करके ‘रक्तपात का दोष दूर कर दे’ कहना।
  rationale: मूल पाठ रक्त और दोष के संबंध को मुहावरे के भीतर रखता है। ठोस बिंब को बनाए रखने से कानूनी और धर्मवैचारिक तनाव सुरक्षित रहता है तथा व्याख्या मुख्य पाठ में नहीं मिलाई जाती।
- issue: וַהֲסִירֹתָ का आज्ञार्थक अथवा परिणाम/उद्देश्य संबंध
  choice: ‘और ... हटा दे’
  alternative: ‘ताकि तू ... हटा सके’ या ‘इस प्रकार ... हटा दे’
  rationale: व्याकरण आज्ञाओं के साथ जुड़े परिणाम या उद्देश्य का भाव ग्रहण कर सकता है, पर सीधा समन्वय भी संभव है। ‘और’ मूल की संरचनात्मक अनिश्चितता को अपेक्षाकृत अधिक सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी की गरिमापूर्ण किंतु सहज आज्ञार्थक शैली अपनाई गई है। सर्वनामों की मूल अस्पष्टता को अनावश्यक नाम जोड़कर समाप्त नहीं किया गया। ‘घराने’ से בֵּית का वंश/राजपरिवार संबंधी अर्थ व्यक्त होता है।
