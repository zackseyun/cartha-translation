base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/004.yaml
  text: so that Yahweh may establish his word that he spoke concerning me[a], saying, ‘If your sons keep their way by walking before me in truth with all their heart and with all their soul,’ saying[c][b], ‘A man of yours shall not be cut off from upon the throne of Israel.’
translation:
  language: hi
  text: 'ताकि यहोवा अपना वह वचन पूरा करे जो उसने मेरे विषय में यह कहकर कहा था[a]: ‘यदि तेरे पुत्र अपने चालचलन पर ध्यान रखें और अपने पूरे मन और पूरे प्राण से सच्चाई के साथ[b] मेरे सामने चलें, तो इस्राएल के सिंहासन पर से तेरे लिए कोई पुरुष काटा नहीं जाएगा।’[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या संभवतः, “जो उसने मुझसे कहा था।” इब्रानी में शाब्दिक अर्थ “मेरे विषय में कहा” है।
    reason: alternative_reading
  - marker: b
    text: “सच्चाई के साथ” का अनुवाद “विश्वासयोग्यता से” या “खराई से” भी हो सकता है।
    reason: lexical_alternative
  - marker: c
    text: 'इब्रानी में शाब्दिक रूप से: “इस्राएल के सिंहासन पर से तेरे लिए कोई पुरुष काटा नहीं जाएगा।” यह मुहावरा दाऊद के राजवंश से सिंहासन पर बैठनेवाले पुरुष की कमी न होने का अर्थ देता है।'
    reason: literal_rendering
lexical_decisions:
- source_word: לְמַעַן
  choice: ताकि
  rationale: यह उद्देश्य अथवा परिणाम का बोध कराता है और आधुनिक हिन्दी में स्वाभाविक है।
- source_word: יָקִים
  choice: पूरा करे
  rationale: קום के हिफ़ील रूप का मूल भाव किसी बात को स्थिर या सिद्ध करना है; प्रतिज्ञा के संदर्भ में ‘वचन पूरा करे’ सहज हिन्दी में आशय स्पष्ट करता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: परमेश्वर के व्यक्तिगत नाम को हिन्दी में प्रचलित लिप्यंतरण द्वारा रखा गया है, किसी उपाधि से नहीं बदला गया।
- source_word: דְּבָרוֹ
  choice: अपना वह वचन
  rationale: ‘वचन’ मूल संज्ञा की औपचारिकता और प्रतिज्ञात्मक संदर्भ दोनों को सुरक्षित रखता है।
- source_word: דִּבֶּר עָלַי
  choice: उसने मेरे विषय में कहा था
  rationale: עַל का सामान्य अर्थ यहाँ ‘मेरे विषय में’ है; संदर्भ के आधार पर इसे चुपचाप ‘मुझसे’ नहीं बनाया गया।
- source_word: יִשְׁמְרוּ ... אֶת דַּרְכָּם
  choice: अपने चालचलन पर ध्यान रखें
  rationale: ‘अपने मार्ग की रखवाली करना’ का हिन्दी में स्वाभाविक नैतिक अर्थ व्यक्त करता है, जबकि जीवन-व्यवहार की रूपकात्मक धारणा बनी रहती है।
- source_word: לָלֶכֶת לְפָנַי
  choice: मेरे सामने चलते रहें
  rationale: मूल के ‘चलने’ वाले वाचा-संबंधी रूपक को बनाए रखता है।
- source_word: בֶּאֱמֶת
  choice: सच्चाई के साथ
  rationale: אמת में सत्य, निष्ठा और खराई की अर्थ-छायाएँ हैं; मुख्य पाठ में निकट अर्थ रखा गया और विकल्प पादटिप्पणी में दिए गए।
- source_word: בְּכָל לְבָבָם וּבְכָל נַפְשָׁם
  choice: अपने सारे मन और सारे प्राण से
  rationale: सम्पूर्ण भीतरी समर्पण को व्यक्त करते हुए ‘मन’ और ‘प्राण’ की मूल समानांतरता सुरक्षित रखता है।
- source_word: לֹא יִכָּרֵת לְךָ אִישׁ מֵעַל כִּסֵּא יִשְׂרָאֵל
  choice: इस्राएल के सिंहासन पर बैठनेवाले तेरे वंश में किसी पुरुष की कभी कमी न होगी
  rationale: शाब्दिक निष्क्रिय मुहावरे ‘तेरे लिए कोई पुरुष काटा न जाएगा’ का स्वाभाविक हिन्दी अर्थ देता है और राजवंशीय पुरुष उत्तराधिकारी तथा सिंहासन, दोनों को स्पष्ट रखता है।
theological_decisions:
- issue: दाऊद से की गई प्रतिज्ञा की सशर्तता
  choice: ‘यदि’ वाली स्पष्ट शर्त को यथावत रखा गया है।
  alternative: शर्त को सामान्य उपदेश बनाकर प्रतिज्ञा को अनिवार्य या निरपेक्ष रूप देना।
  rationale: इब्रानी पाठ दाऊद के पुत्रों के आचरण को स्पष्ट शर्त के रूप में प्रस्तुत करता है; अन्य वाचा-पाठों के आधार पर इस तनाव का समाधान अनुवाद में नहीं किया गया।
- issue: דִּבֶּר עָלַי में सम्बोधन या विषय
  choice: ‘मेरे विषय में कहा था’
  alternative: ‘मुझसे कहा था’
  rationale: मूल में עַל सामान्यतः ‘के विषय में/के बारे में’ दर्शाता है; प्रासंगिक वैकल्पिक समझ पादटिप्पणी में दी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज शैली अपनाई गई है। दाऊद द्वारा सुलैमान को सीधे सम्बोधित किए जाने के कारण ‘तेरे/तेरे पुत्र’ रखा गया है। ‘चालचलन’, ‘मन’, ‘प्राण’ और ‘सिंहासन’ जैसे परिचित बाइबलीय शब्दों का प्रयोग किया गया है, पर अस्वाभाविक इब्रानी वाक्य-विन्यास को मुख्य पाठ में नहीं थोपा गया।
