  text: וְ/גַ֣ם אַתָּ֣ה יָדַ֡עְתָּ אֵת֩ אֲשֶׁר עָ֨שָׂה לִ֜/י יוֹאָ֣ב בֶּן צְרוּיָ֗ה אֲשֶׁ֣ר עָשָׂ֣ה לִ/שְׁנֵֽי שָׂרֵ֣י צִבְא֣וֹת יִ֠שְׂרָאֵל לְ/אַבְנֵ֨ר בֶּן נֵ֜ר וְ/לַ/עֲמָשָׂ֤א בֶן יֶ֨תֶר֙ וַ/יַּ֣הַרְגֵ֔/ם וַ/יָּ֥שֶׂם דְּמֵֽי מִלְחָמָ֖ה בְּ/שָׁלֹ֑ם וַ/יִּתֵּ֞ן דְּמֵ֣י מִלְחָמָ֗ה בַּ/חֲגֹֽרָת/וֹ֙ אֲשֶׁ֣ר בְּ/מָתְנָ֔י/ו וּֽ/בְ/נַעֲל֖/וֹ אֲשֶׁ֥ר בְּ/רַגְלָֽי/ו־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/005.yaml
  text: 'And you also know what Joab son of Zeruiah did to me[a], what he did to the two commanders of the armies of Israel, to Abner son of Ner and to Amasa son of Jether: he killed them and put the blood of war in peace[b], and put the blood of war on the belt that was around his waist and on the sandals that were on his feet.'
translation:
  language: hi
  text: और तुम भी जानते हो कि सरूयाह के पुत्र योआब ने मेरे साथ क्या किया—उसने इस्राएल की सेनाओं के दो सेनापतियों, नेर के पुत्र अब्नेर और येतेर के पुत्र अमासा, के साथ क्या किया। उसने उन दोनों को मार डाला और शांति के समय युद्ध का खून बहाया[a]। उसने युद्ध का खून अपनी कमर के कमरबंद और अपने पैरों की जूतियों पर लगा दिया[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अधिक शाब्दिक रूप में, “उसने शांति में युद्ध का खून रख दिया।” आशय यह है कि योआब ने शांति के समय ऐसा रक्तपात किया जैसा युद्ध में होता है।
    reason: lexical_alternative
  - marker: b
    text: कमरबंद और जूतियों पर लगा खून संभवतः इन हत्याओं के कारण योआब पर लगे रक्तदोष की सजीव छवि है।
    reason: cultural_note
lexical_decisions:
- source_word: וְגַם אַתָּה יָדַעְתָּ
  choice: और तुम यह भी जानते हो
  rationale: संयोजक और अतिरिक्त बल, दोनों को स्वाभाविक हिन्दी में रखते हुए सुलैमान को किए गए सीधे सम्बोधन को सुरक्षित रखता है।
- source_word: אֵת אֲשֶׁר עָשָׂה לִי
  choice: उसने मेरे साथ क्या किया
  rationale: לִי को प्रसंगानुसार हानि या विरोध सूचित करने वाला माना गया है; ‘मेरे साथ’ आधुनिक हिन्दी में स्वाभाविक है और भाव को अनावश्यक रूप से नहीं खोलता।
- source_word: לִשְׁנֵי שָׂרֵי צִבְאוֹת יִשְׂרָאֵל
  choice: इस्राएल की सेनाओं के दो सेनापतियों
  rationale: שָׂרֵי צִבְאוֹת सैन्य नेतृत्व को दर्शाता है और צִבְאוֹת के बहुवचन को भी बनाए रखता है।
- source_word: וַיַּהַרְגֵם
  choice: उसने उन दोनों को मार डाला
  rationale: क्रिया और उसके बहुवचन कर्म को स्पष्ट तथा सीधे ढंग से व्यक्त करता है।
- source_word: וַיָּשֶׂם דְּמֵי מִלְחָמָה בְּשָׁלֹם
  choice: शान्ति के समय युद्ध का खून बहाया
  rationale: शाब्दिक ‘युद्ध का खून शान्ति में रख दिया’ हिन्दी में अस्पष्ट होगा। यह रूप युद्धकालीन रक्तपात और शान्तिकाल के तीखे विरोध को सुरक्षित रखते हुए मुहावरे का आशय स्पष्ट करता है।
- source_word: וַיִּתֵּן דְּמֵי מִלְחָמָה בַּחֲגֹרָתוֹ ... וּבְנַעֲלוֹ
  choice: युद्ध का वह खून अपनी कमर के पटके और अपने पैरों की जूतियों पर लगा लिया
  rationale: योआब के वस्त्र और पादुकाओं पर रक्त की ठोस छवि को बनाए रखता है; ‘पटका’ कमर पर बाँधी जाने वाली חֲגֹרָה के लिए सहज हिन्दी है।
theological_decisions:
- issue: योआब के पटके और जूतियों पर युद्ध के खून की छवि
  choice: छवि को मूल पाठ की तरह ठोस और प्रत्यक्ष रखा गया है
  alternative: इसे केवल ‘उस पर हत्याओं का दोष आ पड़ा’ के रूप में अर्थानुवाद करना
  rationale: मूल पाठ रक्त लगे होने की मूर्त भाषा का प्रयोग करता है। उसका सम्भावित रक्तदोष-संबंधी अर्थ पादटिप्पणी में बताया गया है, मुख्य पाठ में उसकी व्याख्या थोपकर छवि को हटाया नहीं गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। नामों का प्रचलित हिन्दी बाइबलीय लिप्यन्तरण अपनाया गया है। ‘खून’ ने דְּמֵי की ठोस और आरोपात्मक छवि को ‘रक्तपात’ की अपेक्षा अधिक स्पष्ट रखा है, जबकि पहले वाक्यांश में स्वाभाविक हिन्दी के लिए ‘खून बहाया’ प्रयुक्त है।
