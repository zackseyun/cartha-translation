base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/008.yaml
  text: And behold[a], with you is Shimei son of Gera, the Benjaminite from Bahurim, and he cursed me with a grievous curse on the day I went to Mahanaim. But he came down to meet me at the Jordan, and I swore to him by Yahweh, saying, ‘I will not put you to death with the sword.’
translation:
  language: hi
  text: और देख, तेरे पास गेरा का पुत्र शिमी है, जो बहूरीम का निवासी और बिन्यामीन गोत्र का है। जिस दिन मैं महनैम गया था, उस दिन उसने मुझे घोर शाप दिया था। पर वह यरदन पर मुझसे मिलने नीचे आया, और मैंने याहवे की शपथ खाकर उससे कहा, ‘मैं तुझे तलवार से मार नहीं डालूँगा।’[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से, “यदि मैं तुझे तलवार से मार डालूँ।” यह एक अपूर्ण शपथ-सूत्र है, जिसका अर्थ है, “मैं तुझे तलवार से नहीं मार डालूँगा।”
    reason: शाब्दिक वैकल्पिक रूप और शपथ-सूत्र की व्याख्या
lexical_decisions:
- source_word: וְהִנֵּה
  choice: और देख
  rationale: ध्यान किसी महत्त्वपूर्ण व्यक्ति की ओर खींचने वाले हिब्रू संकेतक का स्वाभाविक आधुनिक हिन्दी रूप।
- source_word: עִמְּךָ
  choice: तेरे पास है
  rationale: शिमी के सुलैमान के अधिकार-क्षेत्र या निकटता में होने का भाव आधुनिक हिन्दी में स्पष्ट करता है।
- source_word: שִׁמְעִי בֶן גֵּרָא בֶן הַיְמִינִי מִבַּחֻרִים
  choice: बहूरीम का बिन्यामीनी, गेरा का पुत्र शिमी
  rationale: वंश, जातीय पहचान और मूल-स्थान की सारी सूचना स्वाभाविक हिन्दी क्रम में सुरक्षित रखता है।
- source_word: קִלְלַנִי קְלָלָה נִמְרֶצֶת
  choice: उसने मुझे बहुत कठोर शाप दिया
  rationale: सजातीय क्रिया-संज्ञा की तीव्रता को ‘बहुत’ से व्यक्त करते हुए נִמְרֶצֶת की गंभीरता को ‘कठोर’ द्वारा सुरक्षित रखता है।
- source_word: בְּיוֹם לֶכְתִּי מַחֲנָיִם
  choice: जिस दिन मैं महनैम जा रहा था
  rationale: काल और गमन की दिशा को सहज हिन्दी में व्यक्त करता है।
- source_word: יָרַד לִקְרָאתִי הַיַּרְדֵּן
  choice: वह यरदन पर मुझसे मिलने नीचे आया
  rationale: ירד की नीचे आने की गति और לקראתי के मिलने के उद्देश्य दोनों को बनाए रखता है।
- source_word: וָאֶשָּׁבַע לוֹ בַיהוָה
  choice: मैंने याहवे की शपथ खाकर उससे कहा
  rationale: शपथ-सूत्र को स्वाभाविक हिन्दी में और יהוה को उसके व्यक्तिगत नाम ‘याहवे’ के रूप में प्रस्तुत करता है।
- source_word: אִם אֲמִיתְךָ בֶּחָרֶב
  choice: मैं तुझे तलवार से नहीं मार डालूँगा
  rationale: अपूर्ण हिब्रू शपथ-सूत्र में निहित नकारात्मक प्रतिज्ञा का वास्तविक आशय स्पष्ट करता है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में परमेश्वर का विशिष्ट वाचा-नाम है; लिप्यंतरण नाम की विशिष्टता सुरक्षित रखता है।
- issue: אִם אֲמִיתְךָ בֶּחָרֶב शपथ-सूत्र का अर्थ
  choice: मुख्य पाठ में स्पष्ट नकारात्मक प्रतिज्ञा
  alternative: शाब्दिक ‘यदि मैं तुझे तलवार से मार डालूँ’
  rationale: यह एक अपूर्ण शपथ-सूत्र है जिसमें आत्म-शाप का परिणाम छोड़ दिया गया है; प्रसंग में इसका बल ‘मैं नहीं मारूँगा’ है। पादटिप्पणी शाब्दिक रूप को सुरक्षित रखती है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सुबोध हिन्दी। संबोधन एकवचन अनौपचारिक/निकट ‘तू’ रूप में है, जो पिता द्वारा पुत्र को दिए जा रहे निर्देश और मूल के 2ms रूपों के अनुरूप है।
