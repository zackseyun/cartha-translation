  text: וְ/הַ/יָּמִ֗ים אֲשֶׁ֨ר מָלַ֤ךְ דָּוִד֙ עַל יִשְׂרָאֵ֔ל אַרְבָּעִ֖ים שָׁנָ֑ה בְּ/חֶבְר֤וֹן מָלַךְ֙ שֶׁ֣בַע שָׁנִ֔ים וּ/בִ/ירוּשָׁלִַ֣ם מָלַ֔ךְ שְׁלֹשִׁ֥ים וְ/שָׁלֹ֖שׁ שָׁנִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/011.yaml
  text: The days that David reigned over Israel were forty years. In Hebron he reigned seven years, and in Jerusalem he reigned thirty-three years.
translation:
  language: hi
  text: दाऊद ने इस्राएल पर कुल चालीस वर्ष राज किया। उसने हेब्रोन में सात वर्ष और यरूशलेम में तैंतीस वर्ष राज किया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהַיָּמִים אֲשֶׁר מָלַךְ דָּוִד
  choice: दाऊद ने ... कुल ... वर्ष राज किया
  rationale: इब्रानी का शाब्दिक मुहावरा ‘वे दिन जिनमें दाऊद ने राज किया’ अवधि बताता है। आधुनिक स्वाभाविक हिन्दी में ‘कुल ... वर्ष राज किया’ वही अर्थ स्पष्ट और संक्षिप्त रूप से देता है।
- source_word: עַל יִשְׂרָאֵל
  choice: इस्राएल पर
  rationale: מָלַךְ के साथ עַל शासन के क्षेत्र या प्रजा को दर्शाता है; ‘इस्राएल पर राज किया’ मानक और स्वाभाविक हिन्दी है।
- source_word: אַרְבָּעִים שָׁנָה
  choice: चालीस वर्ष
  rationale: संख्या और कालावधि का सीधा आधुनिक हिन्दी रूप।
- source_word: בְּחֶבְרוֹן מָלַךְ שֶׁבַע שָׁנִים
  choice: उसने हेब्रोन में सात वर्ष ... राज किया
  rationale: בְּ का स्थानवाचक अर्थ ‘में’ से व्यक्त किया गया है और מָלַךְ को ‘राज किया’ रखा गया है।
- source_word: וּבִירוּשָׁלִַם מָלַךְ שְׁלֹשִׁים וְשָׁלֹשׁ שָׁנִים
  choice: और यरूशलेम में तैंतीस वर्ष राज किया
  rationale: संयोजक और स्थानवाचक संरचना सुरक्षित है; इब्रानी ‘तीस और तीन’ को आधुनिक हिन्दी संख्या ‘तैंतीस’ में व्यक्त किया गया है।
