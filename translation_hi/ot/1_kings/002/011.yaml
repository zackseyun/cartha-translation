  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और सार्वजनिक पाठ के अनुकूल। इब्रानी कालावधि-मुहावरे को अर्थानुसार स्वाभाविक हिन्दी में व्यक्त किया गया है, जबकि राजकीय सारांश और स्थानों का क्रम सुरक्षित रखा गया है।
