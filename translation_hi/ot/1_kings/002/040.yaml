source:
  edition: WLC
  text: וַ/יָּ֣קָם שִׁמְעִ֗י וַֽ/יַּחֲבֹשׁ֙ אֶת חֲמֹר֔/וֹ וַ/יֵּ֤לֶךְ גַּ֨תָ/ה֙ אֶל אָכִ֔ישׁ לְ/בַקֵּ֖שׁ אֶת עֲבָדָ֑י/ו וַ/יֵּ֣לֶךְ שִׁמְעִ֔י וַ/יָּבֵ֥א אֶת עֲבָדָ֖י/ו מִ/גַּֽת־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/040.yaml
  text: Then Shimei arose[a], saddled his donkey, and went to Gath, to Achish, to look for his servants. Shimei went and brought his servants back from Gath.
translation:
  language: hi
  text: तब शिमई उठा, अपने गधे पर काठी कसी और अपने दासों[a] को ढूँढ़ने के लिए गत में आकीश के पास गया। शिमई गया और अपने दासों को गत से वापस ले आया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘सेवकों’। इब्रानी शब्द עֲבָדָיו सेवकों या दासों, दोनों को सूचित कर सकता है; यहाँ प्रसंग उनके बंधित दर्जे और भागे हुओं को वापस लाने पर बल देता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  choice: उठा
  rationale: קום का सामान्य अर्थ ‘उठना’ है; यह कथानक की क्रमिक गति को स्वाभाविक आधुनिक हिन्दी में बनाए रखता है।
- source_word: וַיַּחֲבֹשׁ אֶת־חֲמֹרוֹ
  choice: अपने गधे पर काठी कसी
  rationale: यात्रा के प्रसंग में חבש पशु को सवारी के लिए काठी लगाने या तैयार करने को दर्शाता है; ‘काठी कसी’ सटीक और सहज हिन्दी है।
- source_word: גַּתָה
  choice: गत में
  rationale: स्थान-नाम के साथ लगा दिशासूचक ה गति को गत की ओर दर्शाता है। अगले पदबंध ‘आकीश के पास’ के साथ हिन्दी में ‘गत में’ अधिक स्वाभाविक है।
- source_word: אָכִישׁ
  choice: आकीश
  rationale: व्यक्तिवाचक नाम का देवनागरी में ध्वन्यात्मक लिप्यंतरण किया गया है।
- source_word: לְבַקֵּשׁ
  choice: ढूँढ़ने के लिए
  rationale: בקש यहाँ लापता व्यक्तियों की खोज करने के ठोस अर्थ में है; ‘ढूँढ़ने’ से भाव स्पष्ट और बोलचाल से ऊपर किंतु सहज रहता है।
- source_word: עֲבָדָיו
  choice: अपने दासों
  rationale: עבד का अर्थ सेवक या दास दोनों हो सकता है। निकटवर्ती प्रसंग में ये शिमई से भागे हुए और उसके द्वारा वापस लाए गए अधीनस्थ व्यक्ति हैं, इसलिए ‘दास’ बंधित स्थिति को बेहतर व्यक्त करता है; वैकल्पिक अर्थ पाद-टिप्पणी में सुरक्षित है।
- source_word: וַיָּבֵא אֶת־עֲבָדָיו מִגַּת
  choice: अपने दासों को गत से वापस ले आया
  rationale: हिफ़ील रूप וַיָּבֵא का अर्थ ‘ले आया’ है। खोजकर उन्हें लौटाने का प्रसंग हिन्दी में ‘वापस’ को स्वाभाविक बनाता है, यद्यपि इसके लिए इब्रानी में अलग शब्द नहीं है।
