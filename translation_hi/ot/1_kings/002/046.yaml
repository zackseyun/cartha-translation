base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/046.yaml
  text: Then the king commanded Benaiah son of Jehoiada[a], and he went out and struck him down, and he died. So the kingdom was established in the hand of Solomon.
translation:
  language: hi
  text: तब राजा ने यहोयादा के पुत्र बनायाह को आज्ञा दी। बनायाह बाहर गया और उसने शिमी पर प्रहार किया, और वह मर गया। इस प्रकार सुलैमान के हाथ में राज्य दृढ़ हुआ।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘सुलैमान के अधीन राज्य दृढ़ता से स्थापित हुआ।’ इब्रानी मुहावरा ‘हाथ में’ अधिकार या नियंत्रण को व्यक्त करता है।
    reason: मुहावरे का अर्थ स्पष्ट करने वाला वैकल्पिक अनुवाद
lexical_decisions:
- source_word: וַיְצַו הַמֶּלֶךְ
  choice: तब राजा ने ... आज्ञा दी
  rationale: צוה राजकीय आदेश देने को व्यक्त करता है। ‘आज्ञा दी’ आधुनिक, गरिमापूर्ण और प्रसंग के अनुकूल है; ‘तब’ कथानक के क्रम को स्वाभाविक रूप से जोड़ता है।
- source_word: בְּנָיָהוּ בֶן יְהוֹיָדָע
  choice: यहोयादा के पुत्र बनायाह
  rationale: इब्रानी संबंध-सूचक संरचना को स्वाभाविक हिन्दी क्रम में रखा गया है और नामों का मानक बाइबलीय लिप्यंतरण किया गया है।
- source_word: וַיֵּצֵא
  choice: उसने बाहर जाकर
  rationale: יצא का मूल अर्थ ‘बाहर जाना’ है। यह अनुवाद क्रियाओं का क्रम बनाए रखता है और हिन्दी में सहज है।
- source_word: וַיִּפְגַּע בּוֹ
  choice: उस पर वार किया
  rationale: פגע ב यहाँ प्रहार करने के अर्थ में है। ‘वार किया’ हिंसक कार्रवाई को व्यक्त करता है, जबकि अगला वाक्यांश मृत्यु के परिणाम को अलग से बनाए रखता है।
- source_word: וַיָּמֹת
  choice: और वह मर गया
  rationale: मूल पाठ की क्रिया और कथात्मक क्रम को सीधे रखा गया है; मृत्यु को पिछले प्रहार में समाहित नहीं किया गया।
- source_word: וְהַמַּמְלָכָה נָכוֹנָה
  choice: इस प्रकार राज्य ... दृढ़ता से स्थापित हो गया
  rationale: נכון Niphal में दृढ़ या स्थापित हो जाने का भाव देता है। ‘इस प्रकार’ पिछली घटना के परिणामसूचक संबंध को स्पष्ट करता है।
- source_word: בְּיַד שְׁלֹמֹה
  choice: सुलैमान के हाथ में
  rationale: इब्रानी मुहावरे की ‘हाथ में’ वाली छवि सुरक्षित रखी गई है; यहाँ इसका आशय अधिकार या नियंत्रण में होना है।
