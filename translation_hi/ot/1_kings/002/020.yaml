  text: She said, “I am asking one small request of you; do not turn away my face.” And the king said to her, “Ask, my mother, for I will not turn away your face.”
translation:
  language: hi
  text: उसने कहा, “मैं आपसे एक छोटी-सी विनती करती हूँ; मेरी विनती अस्वीकार न कीजिए।” राजा ने उससे कहा, “माँ, माँगिए, क्योंकि मैं आपकी विनती अस्वीकार नहीं करूँगा।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שְׁאֵלָה אַחַת קְטַנָּה
  choice: एक छोटी-सी विनती
  rationale: संज्ञा שְׁאֵלָה यहाँ किसी माँगी जाने वाली बात या निवेदन को दर्शाती है; प्रसंग में स्वाभाविक हिन्दी ‘विनती’ है। אַחַת קְטַנָּה के बल को ‘एक छोटी-सी’ से रखा गया है।
- source_word: אַל תָּשֶׁב אֶת פָּנָי
  choice: मेरी बात मत टालिए
  rationale: शाब्दिक रूप ‘मेरा मुँह न लौटा’ है, पर यह इब्रानी मुहावरा किसी निवेदन को अस्वीकार या अनसुना न करने का अर्थ देता है। हिन्दी में ‘मेरी बात मत टालिए’ उसी संबंधपरक भाव को स्वाभाविक रूप से व्यक्त करता है।
- source_word: שַׁאֲלִי אִמִּי
  choice: माँ, माँगिए
  rationale: स्त्रीलिंग आज्ञार्थक שַׁאֲלִי और संबोधन אִמִּי दोनों सुरक्षित हैं; आदरपूर्ण बहुवचन क्रिया राजमाता के प्रति उपयुक्त आधुनिक हिन्दी है।
- source_word: לֹא אָשִׁיב אֶת פָּנָיִךְ
  choice: मैं आपकी बात नहीं टालूँगा
  rationale: पहले मुहावरे की समानांतर पुनरावृत्ति को समान हिन्दी वाक्यांश से रखा गया है; पुरुष वक्ता के अनुसार ‘टालूँगा’ प्रयुक्त है।
theological_decisions: []
translation_notes:
  register: आधुनिक मानक हिन्दी, आदरपूर्ण और सहज संवाद। ‘मेरा/आपका मुँह न लौटाना’ का कृत्रिम शाब्दिक अनुवाद न करके इब्रानी मुहावरे का अर्थ दिया गया है, जबकि दोनों कथनों की समानांतर संरचना बनाए रखी गई है।
