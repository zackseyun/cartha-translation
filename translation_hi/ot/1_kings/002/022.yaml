base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/022.yaml
  text: King Solomon answered and said to his mother[a], “Why are you asking for Abishag the Shunammite for Adonijah? Ask for the kingship for him as well, since he is my older brother—and for him, for Abiathar the priest, and for Joab son of Zeruiah!”
translation:
  language: hi
  text: राजा सुलैमान ने अपनी माँ को उत्तर देकर कहा, “तुम अदोनिय्याह के लिए शूनेम की अबीशग को क्यों माँग रही हो? उसके लिए राजसत्ता भी माँग लो[a], क्योंकि वह मेरा बड़ा भाई है—और उसके लिए, याजक एब्यातार के लिए और सरूयाह के पुत्र योआब के लिए भी!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “राज्य” अथवा “सिंहासन।” हिब्रू शब्द व्यापक अर्थ में राजकीय शासन को भी सूचित कर सकता है; यहाँ “राजसत्ता” से सुलैमान का यह संकेत उभरता है कि अदोनिय्याह की माँग में राजवंशीय दावा निहित है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן הַמֶּלֶךְ שְׁלֹמֹה וַיֹּאמֶר לְאִמּוֹ
  choice: राजा सुलैमान ने अपनी माँ को उत्तर दिया
  rationale: हिब्रू का ‘उत्तर दिया और कहा’ एक प्रचलित कथात्मक युग्म है; स्वाभाविक आधुनिक हिन्दी में ‘उत्तर दिया’ दोनों क्रियाओं का आशय व्यक्त करता है, जबकि ‘अपनी माँ’ मूल की सीमा बनाए रखता है।
- source_word: וְלָמָה אַתְּ שֹׁאֶלֶת
  choice: तुम ... ही क्यों माँग रही हो?
  rationale: स्त्रीलिंग कृदन्त तत्काल चल रही विनती को दर्शाता है; ‘माँग रही हो’ इसे स्वाभाविक हिन्दी में रखता है। ‘ही’ सुलैमान के व्यंग्यपूर्ण विस्तार को उभारता है, बिना नया कथ्य जोड़े।
- source_word: אֲבִישַׁג הַשֻּנַמִּית
  choice: शूनेम की अबीशग
  rationale: जातिवाचक विशेषण का सरल, स्पष्ट हिन्दी रूप है और अबीशग का शूनेम से संबंध सुरक्षित रखता है।
- source_word: וְשַׁאֲלִי לוֹ אֶת הַמְּלוּכָה
  choice: उसके लिए राजसत्ता भी माँग लो
  rationale: आज्ञार्थक रूप और संयोजक की योगात्मक शक्ति सुरक्षित हैं। ‘राजसत्ता’ यहाँ भूभाग से अधिक राज करने के अधिकार और दावे को व्यक्त करती है।
- source_word: כִּי הוּא אָחִי הַגָּדוֹל מִמֶּנִּי
  choice: क्योंकि वह मेरा बड़ा भाई है
  rationale: जन्मक्रम पर बल देने वाला स्वाभाविक आधुनिक हिन्दी रूप।
- source_word: וְלוֹ וּלְאֶבְיָתָר הַכֹּהֵן וּלְיוֹאָב בֶּן צְרוּיָה
  choice: —हाँ, उसके लिए, एब्यातार याजक के लिए और सरूयाह के पुत्र योआब के लिए!
  rationale: मूल का वाक्यांश अपूर्ण और आकस्मिक रूप से बढ़ता हुआ है। दीर्घ विराम और ‘हाँ’ उस तीखे, चरमोत्कर्षपूर्ण जोड़ को पठनीय हिन्दी में बनाए रखते हैं; ‘के लिए’ का दोहराव संबंधित पक्षों को स्पष्ट करता है।
theological_decisions:
- issue: अबीशग की माँग का राजवंशीय और राजनीतिक निहितार्थ
  choice: הַמְּלוּכָה को ‘राजसत्ता’ अनूदित करके यह स्पष्ट रखा गया कि सुलैमान इस माँग को शासनाधिकार के दावे से जोड़ता है।
  alternative: ‘राज्य’ या ‘सिंहासन’
  rationale: ‘राज्य’ भूभाग भी सूचित कर सकता है और ‘सिंहासन’ रूपक को अधिक विशिष्ट बना देता है; ‘राजसत्ता’ मूल की व्यापक राजकीय शासन-अवधारणा को इस संदर्भ में अधिक ठीक व्यक्त करती है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट हिन्दी। संवाद में सुलैमान का व्यंग्य और रोष बनाए रखा गया है; नामों के लिए प्रचलित हिन्दी बाइबलीय वर्तनी अपनाई गई है।
