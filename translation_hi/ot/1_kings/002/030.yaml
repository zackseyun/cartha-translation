revisions:
- from: तब बनायाह यहोवा के तंबू में योआब के पास आया और उससे कहा, “राजा ने यह कहा है, ‘बाहर आ।’” पर उसने कहा, “नहीं, मैं यहीं मरूँगा।” तब बनायाह ने राजा के पास यह समाचार लौटाकर कहा, “योआब ने ऐसा कहा और मुझे ऐसा ही उत्तर दिया।”
  to: तब बनायाह याहवे के तंबू के पास आया और उससे कहा, “राजा ने यह कहा है, ‘बाहर आ।’” पर उसने कहा, “नहीं, मैं यहीं मरूँगा।” तब बनायाह राजा के पास लौटकर यह समाचार दिया, “योआब ने ऐसा कहा, और उसने मुझे ऐसा उत्तर दिया।”
  rationale: The revision corrects the directional sense of 'to the tent,' aligns the Hindi form of the divine name with the supplied Yahweh policy, and makes Benaiah’s return report idiomatic. It does not add an interpretation of Joab’s motive or the sanctuary’s legal significance.
