reference: 1 Kings 2:30
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יָּבֹ֨א בְנָיָ֜הוּ אֶל אֹ֣הֶל יְהוָ֗ה וַ/יֹּ֨אמֶר אֵלָ֜י/ו כֹּֽה אָמַ֤ר הַ/מֶּ֨לֶךְ֙ צֵ֔א וַ/יֹּ֥אמֶר לֹ֖א כִּ֣י פֹ֣ה אָמ֑וּת וַ/יָּ֨שֶׁב בְּנָיָ֤הוּ אֶת הַ/מֶּ֨לֶךְ֙ דָּבָ֣ר לֵ/אמֹ֔ר כֹּֽה דִבֶּ֥ר יוֹאָ֖ב וְ/כֹ֥ה עָנָֽ/נִי־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/030.yaml
  text: 'Then Benaiah came to the tent of Yahweh and said to him[a], “Thus says the king: ‘Come out.’” But he said, “No, for I will die here.” And Benaiah brought word back to the king, saying, “Thus Joab spoke, and thus he answered me.”'
translation:
  language: hi
  text: तब बनायाह याहवे के तंबू के पास आया और उससे कहा, “राजा ने यह कहा है, ‘बाहर आ।’” पर उसने कहा, “नहीं, मैं यहीं मरूँगा।” तब बनायाह राजा के पास लौटकर यह समाचार दिया, “योआब ने ऐसा कहा, और उसने मुझे ऐसा उत्तर दिया।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֹהֶל יְהוָה
  choice: यहोवा का तंबू
  rationale: אֹהֶל का सीधा अर्थ ‘तंबू’ है; यहाँ ‘निवास-तंबू’ संभव है, पर मूल की सामान्य संज्ञा और पवित्रस्थान के संदर्भ को ‘तंबू’ स्पष्ट रूप से बनाए रखता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिन्दी में परमेश्वर के व्यक्तिगत नाम की स्थापित और सहज पहचान बनाए रखने के लिए ‘यहोवा’ चुना गया है, न कि उसे केवल ‘प्रभु’ पदवी से बदला गया है।
- source_word: כֹּה אָמַר הַמֶּלֶךְ
  choice: राजा ने यह कहा है
  rationale: यह दूत-संदेश का सूत्र है। यह रूप आधुनिक हिन्दी में स्वाभाविक है और राजा के अधिकृत संदेश का बल बनाए रखता है।
- source_word: צֵא
  choice: बाहर आ
  rationale: अंदर उपस्थित व्यक्ति को संबोधित आज्ञा के रूप में हिन्दी में ‘बाहर आ’ सबसे स्वाभाविक है।
- source_word: לֹא כִּי פֹה אָמוּת
  choice: नहीं, मैं यहीं मरूँगा
  rationale: כִּי यहाँ दृढ़ प्रत्युत्तर अथवा स्पष्टीकरण देता है। हिन्दी में संयोजक को स्पष्ट न करना अधिक स्वाभाविक है, जबकि योआब का वहीं मरने का निश्चय सुरक्षित रहता है।
- source_word: וַיָּשֶׁב ... דָּבָר
  choice: यह समाचार लौटाकर कहा
  rationale: यह इब्रानी मुहावरा राजा के पास उत्तर-संदेश वापस पहुँचाने का भाव देता है; चुना हुआ रूप आधुनिक हिन्दी में प्रवाहपूर्ण है।
- source_word: כֹּה דִבֶּר יוֹאָב וְכֹה עָנָנִי
  choice: योआब ने ऐसा कहा और मुझे ऐसा ही उत्तर दिया
  rationale: दोहराए गए כֹּה को ‘ऐसा ... ऐसा ही’ से दर्शाया गया है, जिससे औपचारिक प्रतिवेदन और इब्रानी की पुनरावृत्ति दोनों बनी रहती हैं।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल में चार-अक्षरीय व्यक्तिगत नाम प्रत्यक्ष है। हिन्दी पाठकों के लिए प्रचलित नामरूप ‘यहोवा’ व्यक्तिगत नाम को पदवी ‘प्रभु’ से अलग रखते हुए सहज पहचान देता है।
- issue: पवित्रस्थान में मृत्यु चाहने के कथन का आशय
  choice: मैं यहीं मरूँगा
  alternative: मैं यहीं मरना चाहता हूँ
  rationale: मूल भविष्यवाची कथन करता है, इच्छा या धार्मिक वैधता को स्पष्ट नहीं करता। इसलिए अनुवाद योआब के कथन को दृढ़ता से रखता है, पर उसके उद्देश्य अथवा वेदी-शरण के धर्मशास्त्रीय प्रभाव को नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और कथात्मक रखी गई है। पात्रों के नाम ‘बनायाह’ और ‘योआब’ प्रचलित हिन्दी बाइबलीय रूपों के निकट हैं। दूत-सूत्र को अत्यधिक पुरातन ‘राजा यों कहता है’ के बजाय स्वाभाविक ‘राजा ने यह कहा है’ में व्यक्त किया गया है।
