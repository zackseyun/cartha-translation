base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/029.yaml
  text: And it was reported to King Solomon that Joab had fled to the tent of Yahweh[a], and behold, he was beside the altar. So Solomon sent Benaiah son of Jehoiada, saying, “Go[b], strike him down.”
translation:
  language: hi
  text: राजा सुलैमान को बताया गया कि योआब याहवे के तंबू[a] में भाग गया था और देखो, वह वेदी के पास था। तब सुलैमान ने यहोयादा के पुत्र बनायाह को यह कहकर भेजा, “जाओ, उस पर वार करो[b]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “याहवे के निवास-मंडप में।” इब्रानी में शाब्दिक रूप से “याहवे का तंबू” है।
    reason: lexical_alternative
  - marker: b
    text: या, “उस पर टूट पड़ो” अथवा “उस पर आक्रमण करो।” इब्रानी क्रिया वार करने या आक्रमण करने का अर्थ दे सकती है; इस प्रसंग में इसका परिणाम घातक है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֻּגַּד
  choice: बताया गया
  rationale: हुफ़अल निष्क्रिय रूप सूचना दिए जाने को व्यक्त करता है; ‘बताया गया’ स्वाभाविक हिन्दी में निष्क्रिय भाव बनाए रखता है।
- source_word: לַמֶּלֶךְ שְׁלֹמֹה
  choice: राजा सुलैमान को
  rationale: उपाधि और नाम को आधुनिक हिन्दी के स्वाभाविक क्रम में रखा गया है।
- source_word: נָס
  choice: भाग गया है
  rationale: योआब का भागना सूचना दिए जाने से पहले हुआ था; हिन्दी में अप्रत्यक्ष कथन के भीतर यह रूप उस पूर्व घटना को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: אֶל אֹהֶל יְהוָה
  choice: याहवे के तंबू में
  rationale: אֹהֶל का मूल अर्थ ‘तंबू’ है और אֶל यहाँ गंतव्य बताता है। יְהוָה को व्यक्तिगत वाचा-नाम ‘याहवे’ के रूप में रखा गया है।
- source_word: וְהִנֵּה
  choice: और देखो
  rationale: ध्यान आकर्षित करने वाले हिब्रू अव्यय की आकस्मिकता और सजीवता सुरक्षित रखी गई है।
- source_word: אֵצֶל הַמִּזְבֵּחַ
  choice: वह वेदी के पास है
  rationale: אֵצֶל निकटता दर्शाता है; ‘वेदी के पास’ स्पष्ट और स्वाभाविक है।
- source_word: וַיִּשְׁלַח
  choice: तब सुलैमान ने ... भेजा
  rationale: कथानक में सूचना के बाद हुई परिणामी कार्रवाई को ‘तब’ स्वाभाविक रूप से आगे बढ़ाता है।
- source_word: בְּנָיָהוּ בֶן יְהוֹיָדָע
  choice: यहोयादा के पुत्र बनायाह
  rationale: हिब्रू संरक्षक-नाम को हिन्दी की सामान्य संबंधसूचक रचना में व्यक्त किया गया है।
- source_word: לֵאמֹר
  choice: यह कहकर
  rationale: प्रत्यक्ष कथन का परिचय हिन्दी में सहज ढंग से देता है।
- source_word: לֵךְ
  choice: जाओ
  rationale: सरल आज्ञार्थक रूप का सीधा और स्वाभाविक अनुवाद है।
- source_word: פְּגַע בּוֹ
  choice: उस पर घातक वार करो
  rationale: פגע ב का अर्थ किसी पर टूट पड़ना, आक्रमण करना या वार करना हो सकता है। प्रसंग में मृत्यु-दंड अभिप्रेत है; ‘घातक वार’ उस आशय को स्पष्ट करता है, जबकि क्रिया की आक्रमणात्मक छवि भी बनाए रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में चार-अक्षरीय व्यक्तिगत नाम सीधे आया है। ‘याहवे’ उसे उपाधि से बदलने के बजाय वाचा-नाम के रूप में प्रस्तुत करता है।
- issue: वेदी के पास शरण लेने और वहीं दंड दिए जाने का तनाव
  choice: पाठ की घटनाओं को बिना धर्मशास्त्रीय स्पष्टीकरण जोड़े सीधे रखा गया है
  alternative: योआब के शरण-अधिकार या सुलैमान के आदेश की वैधता की व्याख्या जोड़ना
  rationale: इस पद में न तो शरण-दावे का स्पष्ट मूल्यांकन है, न आदेश पर टीका; इसलिए अनुवाद उस नैतिक और धर्मशास्त्रीय तनाव को खुला रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और कथात्मक रखी गई है। ‘देखो’ मूल के ध्यानाकर्षक अव्यय की सजीवता बचाता है। ‘निवास-मंडप’ को केवल पाद-टिप्पणी में विकल्प बनाया गया है, जबकि मुख्य पाठ मूल के अधिक निकट ‘तंबू’ रखता है।
