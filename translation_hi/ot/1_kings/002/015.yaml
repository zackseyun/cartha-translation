base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/015.yaml
  text: And he said[a], “You know that the kingdom was mine, and that all Israel had set their faces on me to reign; but the kingdom turned and became my brother’s[b], for it was his from Yahweh.”
translation:
  language: hi
  text: उसने कहा, “तुम जानती हो कि राजपद मेरा था और कि मैं राजा बनूँ, इसके लिए सारे इस्राएल की दृष्टि मुझ पर थी[a]। लेकिन राजपद पलटकर मेरे भाई का हो गया, क्योंकि वह यहोवा की ओर से मेरे भाई का था[b]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “सारे इस्राएल ने कि मैं राजा बनूँ, इसके लिए मेरी ओर अपने मुख किए थे।”
    reason: lexical_alternative
  - marker: b
    text: इसका अनुवाद यह भी हो सकता है, “क्योंकि वह उसे यहोवा की ओर से मिला था।”
    reason: alternative_reading
lexical_decisions:
- source_word: הַמְּלוּכָה
  choice: राजपद
  rationale: यहाँ शब्द राज्य-क्षेत्र से अधिक राजा के पद और शासनाधिकार को दर्शाता है; ‘राजपद’ उत्तराधिकार के प्रसंग में स्वाभाविक और सटीक है।
- source_word: וְעָלַי שָׂמוּ כָל־יִשְׂרָאֵל פְּנֵיהֶם
  choice: सारा इस्राएल मेरी ओर आशा लगाए हुए था
  rationale: इब्रानी मुहावरे ‘मेरी ओर अपने मुख किए थे’ का आशय अदोनिय्याह से राजत्व की अपेक्षा रखना है। मुख्य पाठ में अर्थ स्वाभाविक ढंग से दिया गया और शाब्दिक बिंब पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: לִמְלֹךְ
  choice: राजा बनने के लिए
  rationale: इस प्रसंग में क्रिया का आशय राजत्व ग्रहण करना है; यह आधुनिक हिन्दी में ‘राज्य करने के लिए’ की अपेक्षा अधिक स्पष्ट है।
- source_word: וַתִּסֹּב
  choice: पलटकर
  rationale: यह घटनाक्रम के उलट जाने या राजपद के दूसरी ओर मुड़ जाने का रूपक बनाए रखता है।
- source_word: וַתְּהִי לְאָחִי
  choice: मेरे भाई का हो गया
  rationale: यह לְ की स्वामित्व अथवा प्राप्ति की शक्ति को सहज हिन्दी में व्यक्त करता है।
- source_word: כִּי מֵיְהוָה הָיְתָה לּוֹ
  choice: क्योंकि यहोवा की ओर से वह उसी का था
  rationale: 'यह अस्पष्ट किंतु अर्थपूर्ण इब्रानी रचना को बनाए रखता है: राजपद भाई का था और उसका स्रोत अथवा निर्धारण यहोवा की ओर से था; ‘दिया’ जैसी अनुपस्थित क्रिया नहीं जोड़ी गई।'
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिन्दी में प्रचलित देवनागरी रूप द्वारा परमेश्वर का व्यक्तिगत वाचा-नाम व्यक्त किया गया है, किसी उपाधि से उसका स्थान नहीं लिया गया।
- source_word: אָחִי
  choice: मेरे भाई
  rationale: यह अदोनिय्याह की दृष्टि से सुलैमान के साथ सीधे पारिवारिक संबंध को व्यक्त करता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: प्रभु
  rationale: मूल पाठ में व्यक्तिगत नाम है; इसलिए हिन्दी में उसके प्रचलित लिप्यंतर को रखा गया, केवल उपाधि नहीं दी गई।
- issue: अंतिम उपवाक्य में ईश्वरीय निर्धारण की स्पष्टता
  choice: क्योंकि यहोवा की ओर से वह उसी का था
  alternative: क्योंकि वह उसे यहोवा से मिला था
  rationale: मूल में ‘देना’ या ‘मिलना’ की स्पष्ट क्रिया नहीं है। चुना हुआ रूप ईश्वरीय स्रोत अथवा निर्धारण को व्यक्त करते हुए मूल की संक्षिप्तता और संभावित तनाव बनाए रखता है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सहज मानक हिन्दी। ‘राजपद’ से राज्य-भूभाग के बजाय राजकीय पद स्पष्ट किया गया है। स्त्रीलिंग ‘जानती हो’ बतशेबा को संबोधन के अनुरूप है।
