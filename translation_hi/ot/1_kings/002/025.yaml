  text: So King Solomon sent Benaiah son of Jehoiada[a], and he struck him down, and he died.
translation:
  language: hi
  text: तब राजा सुलैमान ने यहोयादा के पुत्र बनायाह को भेजा[a]; उसने अदोनिय्याह पर वार किया, और वह मर गया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “यहोयादा के पुत्र बनायाह के हाथ से भेजा”; यह मुहावरा बताता है कि राजा ने उसे अपना प्रतिनिधि बनाकर यह काम कराया।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: ने ... भेजा
  rationale: शׁלח का सामान्य अर्थ ‘भेजना’ है; निष्पादन का आशय अगले खंड से स्पष्ट होता है, इसलिए यहाँ अधिक विशिष्ट ‘वध करने भेजा’ नहीं जोड़ा गया।
- source_word: הַמֶּלֶךְ שְׁלֹמֹה
  choice: राजा सुलैमान
  rationale: यह पदवी और नाम दोनों को स्वाभाविक आधुनिक हिन्दी में सुरक्षित रखता है।
- source_word: בְּיַד
  choice: बनायाह को भेजा
  rationale: शाब्दिक ‘बनायाह के हाथ से भेजा’ यहाँ माध्यम या प्रतिनिधि के द्वारा कार्य कराने का मुहावरा है। हिन्दी में बनायाह को ‘भेजा’ क्रिया का कर्म बनाना अर्थ को स्वाभाविक रूप से व्यक्त करता है; शाब्दिक रूप पादटिप्पणी में दिया गया है।
- source_word: בְּנָיָהוּ בֶן יְהוֹיָדָע
  choice: यहोयादा के पुत्र बनायाह
  rationale: हिब्रू पितृनाम-संबंध को स्पष्ट और स्वाभाविक हिन्दी में व्यक्त किया गया है।
- source_word: וַיִּפְגַּע בּוֹ
  choice: उसने अदोनिय्याह पर वार किया
  rationale: פגע ב के यहाँ शत्रुतापूर्ण प्रहार का अर्थ है। ‘वार किया’ घातक कार्रवाई को व्यक्त करता है, पर अगले स्वतंत्र कथन ‘वह मर गया’ को अनावश्यक रूप से क्रिया में नहीं समेटता। संदर्भ के आधार पर सर्वनाम का लक्ष्य अदोनिय्याह नाम से स्पष्ट किया गया है।
- source_word: וַיָּמֹת
  choice: और वह मर गया
  rationale: हिब्रू की क्रमिक कथन-रचना और मृत्यु के स्पष्ट, स्वतंत्र उल्लेख को बनाए रखा गया है।
