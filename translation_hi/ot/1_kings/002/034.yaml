  text: וַ/יַּ֗עַל בְּנָיָ֨הוּ֙ בֶּן יְה֣וֹיָדָ֔ע וַ/יִּפְגַּע בּ֖/וֹ וַ/יְמִתֵ֑/הוּ וַ/יִּקָּבֵ֥ר בְּ/בֵית֖/וֹ בַּ/מִּדְבָּֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/034.yaml
  text: Then Benaiah son of Jehoiada went up[a], struck him down, and put him to death[b]; and he was buried at his house in the wilderness.
translation:
  language: hi
  text: तब यहोयादा का पुत्र बनायाह ऊपर गया, उसने उस पर वार किया और उसे मार डाला[a]। और उसे निर्जन प्रदेश में उसके घर पर[b] दफ़नाया गया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में आक्रमण और मार डालने के लिए दो अलग क्रियाएँ हैं; इसका अनुवाद ‘उस पर टूट पड़ा और उसे मार डाला’ भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: ‘उसके घर पर’ का व्यापक अर्थ निर्जन प्रदेश में उसकी पारिवारिक भूमि या जायदाद पर भी हो सकता है।
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּעַל
  choice: ऊपर गया
  rationale: עלה का मूल अर्थ ‘ऊपर जाना/चढ़ना’ है। प्रसंग में यह राजा की आज्ञा पूरी करने के लिए आगे जाने का संकेत देता है, फिर भी अनुवाद स्थानगत और कथात्मक अर्थ को स्पष्ट किए बिना नहीं छोड़ता।
- source_word: וַיִּפְגַּע בּוֹ
  choice: उस पर वार किया
  rationale: פגע ב का अर्थ प्रसंगानुसार भिड़ना, आक्रमण करना या प्रहार करना हो सकता है। ‘उस पर वार किया’ शत्रुतापूर्ण क्रिया को स्वाभाविक हिंदी में व्यक्त करता है और अगले स्पष्ट हत्या-सूचक क्रियापद से इसे अलग रखता है।
- source_word: וַיְמִתֵהוּ
  choice: उसे मार डाला
  rationale: מות के हिफ़ील रूप का कारक अर्थ ‘मरवा देना/मार डालना’ है। यहाँ ‘मार डाला’ निष्पादन को स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
- source_word: וַיִּקָּבֵר
  choice: उसे दफ़नाया गया
  rationale: निफ़ाल रूप कर्मवाच्य है। हिंदी में ‘उसे दफ़नाया गया’ बनायाह की कार्रवाइयों से योआब के दफ़नाए जाने की ओर कर्ता-परिवर्तन को स्पष्ट करता है।
- source_word: בְּבֵיתוֹ
  choice: उसके घर के पास
  rationale: בית का अर्थ घर, परिवार या संपत्ति/जायदाद भी हो सकता है। दफ़नाने के संदर्भ में ‘घर के पास’ इस आशय को स्वाभाविक बनाता है कि कब्र उसके निवास या पारिवारिक भूमि पर थी, न कि आवश्यक रूप से भवन के भीतर।
- source_word: בַּמִּדְבָּר
  choice: निर्जन प्रदेश में
  rationale: מדבר बियाबान, जंगल या कम आबादी वाले खुले भूभाग को दर्शा सकता है। ‘निर्जन प्रदेश’ आधुनिक हिंदी में अर्थ स्पष्ट रखता है और भूभाग को अनावश्यक रूप से केवल रेगिस्तान नहीं ठहराता।
