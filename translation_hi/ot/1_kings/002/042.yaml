base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/042.yaml
  text: Then the king sent and called for Shimei and said to him[a], “Did I not make you swear by Yahweh and warn you, saying, ‘On the day you go out and go anywhere at all, know for certain that you shall surely die’? And you said to me, ‘The word is good[c][b]; I have heard.’”
translation:
  language: hi
  text: तब राजा ने भेजकर शिमई को बुलवाया और उससे कहा, “क्या मैंने तुझे यहोवा की शपथ नहीं दिलाई थी और तुझे चेतावनी देकर यह नहीं कहा था, ‘जिस दिन तू बाहर निकलकर कहीं भी जाएगा, उस दिन निश्चय जान लेना कि तू अवश्य मर जाएगा’? और तूने मुझसे कहा था, ‘यह बात ठीक है; मैंने सुन लिया है।’”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִשְׁבַּעְתִּיךָ בַיהוָה
  choice: तुझे यहोवा की शपथ दिलाई थी
  rationale: 'हिफ़ील रूप का कारक अर्थ सुरक्षित रहता है: राजा ने शिमई को यहोवा के नाम की शपथ खाने के लिए बाध्य किया था। यह आधुनिक हिन्दी में स्वाभाविक भी है।'
- source_word: בַיהוָה
  choice: यहोवा की
  rationale: शपथ-सूत्र में प्रत्यक्ष परमेश्वरीय नाम יהוה को हिन्दी में प्रचलित नामरूप ‘यहोवा’ से व्यक्त किया गया है।
- source_word: וָאָעִד בְּךָ
  choice: तुझे गंभीर चेतावनी देकर
  rationale: עוד के हिफ़ील में चेतावनी देने के साथ औपचारिक रूप से सावधान या आरोपित करने का भाव है; ‘गंभीर चेतावनी’ प्रसंग की कानूनी गंभीरता को सहज हिन्दी में व्यक्त करती है।
- source_word: וְהָלַכְתָּ אָנֶה וָאָנָה
  choice: कहीं भी जाएगा
  rationale: शाब्दिक ‘इधर या उधर’ यहाँ अनिश्चित किसी भी गंतव्य का मुहावरा है; ‘कहीं भी’ उसका स्वाभाविक हिन्दी समतुल्य है।
- source_word: יָדֹעַ תֵּדַע
  choice: यह निश्चय जान लेना
  rationale: क्रिया के साथ infinitive absolute द्वारा दिए गए बल और निश्चितता को ‘निश्चय’ से व्यक्त किया गया है।
- source_word: מוֹת תָּמוּת
  choice: तू अवश्य मर जाएगा
  rationale: infinitive absolute मृत्यु की निश्चितता पर बल देता है; ‘अवश्य’ इसे स्पष्ट और स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: טוֹב הַדָּבָר
  choice: यह बात ठीक है
  rationale: דבר का अर्थ ‘वचन’ या ‘बात/मामला’ हो सकता है। यहाँ शिमई राजा द्वारा रखी गई शर्त को स्वीकार करता है, इसलिए ‘यह बात ठीक है’ सहज और प्रसंगानुकूल है।
- source_word: שָׁמָעְתִּי
  choice: मैंने सुन लिया है
  rationale: मूल का प्रत्यक्ष अर्थ ‘मैंने सुना है’ सुरक्षित रखा गया है; प्रसंग में स्वीकृति निहित हो सकती है, पर अनुवाद उसे ‘मान लिया’ कहकर अधिक स्पष्ट नहीं करता।
theological_decisions:
- issue: परमेश्वर के नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ में चार-अक्षरीय व्यक्तिगत नाम प्रत्यक्ष है। हिन्दी बाइबलीय प्रयोग में व्यापक रूप से पहचाने जाने वाले ‘यहोवा’ को रखा गया है, न कि उसे उपाधि ‘प्रभु’ से बदला गया है।
- issue: שָׁמַע में निहित स्वीकृति या आज्ञापालन
  choice: मैंने सुन लिया है
  alternative: मैंने मान लिया है
  rationale: कानूनी प्रसंग में सुनना स्वीकृति का संकेत दे सकता है, फिर भी मूल क्रिया केवल ‘सुनना’ कहती है। अतः संभावित धार्मिक या नैतिक निष्कर्ष को अनुवाद में अनावश्यक रूप से दृढ़ नहीं किया गया।
translation_notes:
  register: राजकीय और कानूनी प्रसंग के अनुरूप गंभीर, गरिमापूर्ण, किंतु सामान्य आधुनिक हिन्दी रखी गई है। संबोधन में ‘तू’ मूल के एकवचन रूप और राजा द्वारा अधीनस्थ से कही गई बात को दर्शाता है। कोई पादटिप्पणी आवश्यक नहीं मानी गई, इसलिए मुख्य पाठ में भी कोई पादटिप्पणी-चिह्न नहीं है।
