  text: וְ/הַ/שְּׁמֻעָה֙ בָּ֣אָה עַד יוֹאָ֔ב כִּ֣י יוֹאָ֗ב נָטָה֙ אַחֲרֵ֣י אֲדֹנִיָּ֔ה וְ/אַחֲרֵ֥י אַבְשָׁל֖וֹם לֹ֣א נָטָ֑ה וַ/יָּ֤נָס יוֹאָב֙ אֶל אֹ֣הֶל יְהוָ֔ה וַֽ/יַּחֲזֵ֖ק בְּ/קַרְנ֥וֹת הַ/מִּזְבֵּֽחַ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/028.yaml
  text: And the report came to Joab[a], for Joab had turned after Adonijah, though he had not turned after Absalom[b]. So Joab fled to the tent of Yahweh and took hold of the horns of the altar.
translation:
  language: hi
  text: यह समाचार योआब तक पहुँचा, क्योंकि योआब अदोनिय्याह के पीछे हो लिया था, पर अबशालोम के पीछे नहीं हो लिया था।[a] तब योआब याहवे के तंबू में भाग गया और उसने वेदी के सींगों को पकड़ लिया।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात, योआब ने अदोनिय्याह का पक्ष लिया था, लेकिन अबशालोम का पक्ष नहीं लिया था। इब्रानी में दोनों जगह शाब्दिक भाव ‘के पीछे मुड़ना’ है।
    reason: lexical_alternative
  - marker: b
    text: ‘सींग’ वेदी के कोनों पर बने सींग-जैसे उभार थे। उन्हें पकड़ना शरण या दया की याचना का संकेत था।
    reason: cultural_note
lexical_decisions:
- source_word: הַשְּׁמֻעָה
  choice: यह समाचार
  rationale: संज्ञा किसी पहुँची हुई खबर या सूचना को दर्शाती है। यहाँ ‘समाचार’ कथात्मक संदर्भ में स्वाभाविक है और ‘अफ़वाह’ जैसी अनिश्चितता नहीं जोड़ता।
- source_word: בָּאָה עַד
  choice: तक पहुँचा
  rationale: इब्रानी मुहावरे का शाब्दिक भाव ‘किसी तक आना’ है; हिन्दी में ‘तक पहुँचा’ उसी गति-भाव को स्वाभाविक रूप से व्यक्त करता है।
- source_word: נָטָה אַחֲרֵי
  choice: के पीछे हो लिया
  rationale: यह राजनीतिक निष्ठा या पक्ष ग्रहण करने का मुहावरा है। यह चयन मूल के ‘पीछे मुड़ने/हो लेने’ के रूपक और दोनों उपवाक्यों में उसकी पुनरावृत्ति को बनाए रखता है।
- source_word: אֲדֹנִיָּה
  choice: अदोनिय्याह
  rationale: व्यक्तिवाचक नाम का मानक देवनागरी लिप्यंतरण।
- source_word: וְאַחֲרֵי אַבְשָׁלוֹם לֹא נָטָה
  choice: पर अबशालोम के पीछे नहीं हुआ था
  rationale: ‘पर’ विरोध को स्पष्ट करता है और पहले उपवाक्य के मुहावरे को दोहराता है, बिना यह तय किए कि कथाकार इस अंतर को प्रशंसा, विडंबना या केवल तथ्य के रूप में प्रस्तुत कर रहा है।
- source_word: וַיָּנָס
  choice: भाग गया
  rationale: क्रिया भय या संकट में तत्काल पलायन को दर्शाती है; ‘भाग गया’ आधुनिक हिन्दी में सहज कथात्मक रूप है।
- source_word: אֹהֶל יְהוָה
  choice: याहवे का तंबू
  rationale: मूल में सामान्य शब्द ‘तंबू’ है; ‘मिलापवाला तंबू’ या अन्य तकनीकी पद जोड़ना इस पद में निहित नहीं है।
- source_word: יְהוָה
  choice: याहवे
  rationale: चार-अक्षरीय ईश्वरीय नाम का देवनागरी लिप्यंतरण, उपाधि से उसका प्रतिस्थापन नहीं।
- source_word: וַיַּחֲזֵק בְּקַרְנוֹת הַמִּזְבֵּחַ
  choice: वेदी के सींगों को पकड़ लिया
  rationale: यह ठोस धार्मिक-सांस्कृतिक क्रिया को सीधे व्यक्त करता है और उसके कानूनी या प्रतीकात्मक अर्थ को मुख्य पाठ में जरूरत से अधिक नहीं समझाता।
- source_word: קַרְנוֹת הַמִּזְבֵּחַ
  choice: वेदी के सींग
  rationale: वेदी के कोनों पर बने सींग-जैसे उभारों के लिए मूल का सीधा रूप; आधुनिक पाठक के लिए विवरण पादटिप्पणी में दिया गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: पद में ईश्वर का व्यक्तिगत चार-अक्षरीय नाम आया है। ‘याहवे’ उसका निकट देवनागरी लिप्यंतरण है और उसे किसी उपाधि से प्रतिस्थापित नहीं करता।
- issue: נָטָה אַחֲרֵי के राजनीतिक मुहावरे को रूपक सहित रखना या अर्थ खोलकर कहना
  choice: के पीछे हो लिया
  alternative: का पक्ष लिया; का साथ दिया
  rationale: मूल में अदोनिय्याह और अबशालोम दोनों के संबंध में एक ही मुहावरा दोहराया गया है। रूपक को बनाए रखने से यह साहित्यिक समानता और संभावित अर्थ-तनाव सुरक्षित रहता है; अधिक स्पष्ट राजनीतिक अर्थ पादटिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण कथात्मक हिन्दी। वाक्य-रचना सरल रखी गई है; राजनीतिक मुहावरे की मूल रूपकात्मकता और उसकी पुनरावृत्ति सुरक्षित है। ईश्वरीय नाम को ‘याहवे’ लिखा गया है।
