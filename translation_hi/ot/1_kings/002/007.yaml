  text: וְ/לִ/בְנֵ֨י בַרְזִלַּ֤י הַ/גִּלְעָדִי֙ תַּֽעֲשֶׂה חֶ֔סֶד וְ/הָי֖וּ בְּ/אֹכְלֵ֣י שֻׁלְחָנֶ֑/ךָ כִּי כֵן֙ קָרְב֣וּ אֵלַ֔/י בְּ/בָרְחִ֕/י מִ/פְּנֵ֖י אַבְשָׁל֥וֹם אָחִֽי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/007.yaml
  text: But show kindness to the sons of Barzillai the Gileadite[a], and let them be among those who eat at your table[c][b], for this is how they came near to me when I fled from Absalom your brother.
translation:
  language: hi
  text: पर गिलादी बरज़िल्लै के पुत्रों के साथ भलाई करना[a], और उन्हें उन लोगों में रखना जो तुम्हारी मेज़ पर भोजन करते हैं[b], क्योंकि जब मैं तुम्हारे भाई अबशालोम से भाग रहा था, तब वे इसी प्रकार मेरे निकट आए थे[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “बरज़िल्लै के पुत्रों के साथ निष्ठापूर्वक भलाई करना”; इब्रानी अभिव्यक्ति में केवल भावुक दया नहीं, बल्कि निष्ठापूर्ण कृपा का भाव भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “वे तुम्हारी मेज़ के भोजन करनेवालों में हों”; यह निरंतर राजकीय भरण-पोषण और सम्मान का संकेत है।
    reason: cultural_note
  - marker: c
    text: या “वे मेरे पास आए थे” अथवा “उन्होंने मेरा साथ दिया था”; इब्रानी क्रिया का शाब्दिक अर्थ “निकट आए” है, जो यहाँ दाऊद के पलायन के समय सहायता देने का संकेत करती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלִבְנֵי
  choice: पर ... के पुत्रों पर
  rationale: संदर्भ में וְ पिछले कठोर निर्देश के बाद विरोधात्मक जोड़ व्यक्त करता है, इसलिए ‘पर’ स्वाभाविक है। בְּנֵי को पुरुष वंशजों के अर्थ में ‘पुत्रों’ से व्यक्त किया गया है।
- source_word: בַרְזִלַּי הַגִּלְעָדִי
  choice: गिलादी बरज़िल्लै
  rationale: व्यक्तिनाम का लिप्यंतरण किया गया और הַגִּלְעָדִי को स्थान-संबंधी विशेषण ‘गिलादी’ के रूप में रखा गया। हिंदी में विशेषण पहले रखना स्वाभाविक है।
- source_word: תַּעֲשֶׂה חֶסֶד
  choice: कृपा करना
  rationale: עשה חסד सक्रिय भलाई और निष्ठापूर्ण कृपा का मुहावरा है। ‘कृपा करना’ सहज हिंदी है; निष्ठा की संभावित अर्थछाया पादटिप्पणी में सुरक्षित है।
- source_word: וְהָיוּ
  choice: और वे ... रहें
  rationale: निर्देशात्मक संदर्भ में यह आज्ञार्थक/परिणामसूचक भाव रखता है। ‘रहें’ निरंतर राजकीय आतिथ्य में सम्मिलित रखने का आदेश व्यक्त करता है।
- source_word: בְּאֹכְלֵי שֻׁלְחָנֶךָ
  choice: उन लोगों में ... जो तुम्हारी मेज़ पर भोजन करते हैं
  rationale: मूल सहभागी रचना और मेज़ की छवि को बनाए रखते हुए सतत राजकीय भरण-पोषण और सम्मान का भाव स्वाभाविक हिंदी में व्यक्त किया गया है।
- source_word: כִּי כֵן
  choice: क्योंकि ... इसी प्रकार
  rationale: כִּי कारण बताता है और כֵן प्रत्युत्तर में वैसी ही भलाई की ओर संकेत कर सकता है। ‘इसी प्रकार’ इस संबंध को खुला रखता है।
- source_word: קָרְבוּ אֵלַי
  choice: वे ... मेरे निकट आए थे
  rationale: קרב का मूल अर्थ ‘निकट आना’ है। प्रसंग में समर्थन निहित है, पर मुख्य पाठ उस निहितार्थ को स्पष्ट व्याख्या में नहीं बदलता।
- source_word: בְּבָרְחִי מִפְּנֵי
  choice: जब मैं ... से भाग रहा था
  rationale: पूर्वसर्गयुक्त infinitive construct को स्वाभाविक कालवाचक उपवाक्य में व्यक्त किया गया है; מִפְּנֵי को इस पलायन-संदर्भ में ‘से’ कहना पर्याप्त है।
- source_word: אַבְשָׁלוֹם אָחִיךָ
  choice: तुम्हारे भाई अबशालोम
  rationale: नाम का लिप्यंतरण और रिश्ते का स्पष्ट उल्लेख दोनों सुरक्षित रखे गए हैं; हिंदी में संबंधसूचक पद नाम से पहले स्वाभाविक है।
