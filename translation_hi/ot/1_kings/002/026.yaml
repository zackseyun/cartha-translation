base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/026.yaml
  text: And to Abiathar the priest the king said[a], “Go to Anathoth, to your field, for you are a man deserving death; but on this day I will not put you to death, because you carried the ark of the Lord GOD before David my father, and because you shared in all the affliction with which my father was afflicted.”
translation:
  language: hi
  text: याजक एब्यातार से राजा ने कहा, “अनातोत में अपने खेत पर चले जाओ, क्योंकि तुम मृत्युदंड के योग्य हो[a]। फिर भी आज मैं तुम्हें मृत्युदंड नहीं दूँगा, क्योंकि तुम मेरे पिता दाऊद के सामने प्रभु याहवे का संदूक उठाकर ले गए थे, और क्योंकि मेरे पिता ने जितने दुःख सहे, उन सब में तुम भी दुःख सहते रहे।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक इब्रानी मुहावरा: “तुम मृत्यु के पुरुष हो,” अर्थात तुम मृत्युदंड के योग्य हो या तुम्हें मृत्युदंड दिया जा सकता है।'
    reason: इब्रानी मुहावरे का शाब्दिक रूप और उसका न्यायिक आशय स्पष्ट करना।
lexical_decisions:
- source_word: עֲנָתֹת
  choice: अनातोत
  rationale: स्थानवाचक नाम को उसके इब्रानी रूप के निकट देवनागरी में लिप्यंतरित किया गया है।
- source_word: עַל שָׂדֶיךָ
  choice: अपने खेत पर
  rationale: मूल का ठोस अर्थ ‘अपने खेत/भूमि पर’ है; प्रसंग में एब्यातार को अनातोत स्थित उसकी भूमि पर लौटने का आदेश दिया गया है।
- source_word: אִישׁ מָוֶת
  choice: मृत्युदंड के योग्य
  rationale: शाब्दिक इब्रानी मुहावरा ‘मृत्यु का पुरुष’ है, जिसका अर्थ मृत्युदंड का पात्र या फाँसी दिए जाने योग्य व्यक्ति है। स्वाभाविक हिन्दी में आशय मुख्य पाठ में और शाब्दिक रूप पादटिप्पणी में रखा गया है।
- source_word: אֲמִיתֶךָ
  choice: मैं तुम्हें मृत्युदंड नहीं दूँगा
  rationale: מות का हिफ़ील रूप यहाँ ‘मृत्यु देना/मरवा डालना’ बताता है; राजकीय न्याय के प्रसंग में ‘मृत्युदंड देना’ उपयुक्त है।
- source_word: נָשָׂאתָ אֶת אֲרוֹן אֲדֹנָי יְהוִה
  choice: तुम ... प्रभु याहवे का सन्दूक उठाकर चलते थे
  rationale: נשא सन्दूक को शारीरिक रूप से उठाकर ले जाने को सूचित करता है। אֲדֹנָי יְהוִה के दोनों पदों को ‘प्रभु याहवे’ के रूप में बनाए रखा गया है।
- source_word: לִפְנֵי דָוִד אָבִי
  choice: मेरे पिता दाऊद के सामने
  rationale: לִפְנֵי का स्थानिक/सम्बन्धपरक अर्थ ‘के सामने, की उपस्थिति में’ है; अनावश्यक व्याख्या जोड़े बिना इसे सुरक्षित रखा गया है।
- source_word: הִתְעַנִּיתָ ... הִתְעַנָּה
  choice: मेरे पिता ने जितने दुःख सहे, उन सब में तुम भी दुःख सहते रहे
  rationale: दोनों सम्बद्ध क्रियाओं की पुनरावृत्ति को ‘दुःख सहे/दुःख सहते रहे’ से बनाए रखते हुए एब्यातार की दाऊद के दुःखों में सहभागिता स्पष्ट की गई है।
- source_word: כִּי ... וְכִי
  choice: क्योंकि ... और क्योंकि
  rationale: दोनों उपवाक्य राजा द्वारा मृत्युदंड न दिए जाने के कारण बताते हैं; हिन्दी में उनकी समान कारणात्मक भूमिका सुरक्षित रखी गई है।
theological_decisions:
- issue: संयुक्त ईश्वरीय उपाधि אֲדֹנָי יְהוִה का अनुवाद
  choice: प्रभु याहवे
  alternative: प्रभु यहोवा; प्रभु परमेश्वर
  rationale: אֲדֹנָי को ‘प्रभु’ और चतुरक्षरीय निजी नाम יהוה को उसके प्रचलित विद्वत्तापूर्ण उच्चारण के निकट ‘याहवे’ दिया गया है। इससे दोनों इब्रानी तत्व बने रहते हैं और निजी नाम को सामान्य उपाधि में नहीं बदला जाता।
- issue: एब्यातार के दुःख की प्रकृति
  choice: दाऊद के दुःखों में सहभागी होकर दुःख सहना
  alternative: दाऊद के कारण दुःख उठाना
  rationale: मूल वाक्य एब्यातार की दाऊद के साथ विपत्ति में सहभागिता बताता है, पर यह स्पष्ट नहीं करता कि दाऊद स्वयं उन दुःखों का कारण था; अतः कारणात्मक अर्थ नहीं जोड़ा गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सहज हिन्दी में रखी गई है। राजकीय न्याय के प्रसंग में ‘मृत्युदंड’ और धार्मिक वस्तु के लिए परिचित शब्द ‘सन्दूक’ प्रयुक्त हैं। सम्बोधन में आदरार्थक बहुवचन के बजाय मूल के एकवचन आदेश के अनुरूप ‘तुम’ रखा गया है।
