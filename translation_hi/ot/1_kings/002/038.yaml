  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। राजदरबारी विनम्रता के लिए ‘मेरे प्रभु राजा’ और ‘आपका सेवक’ बनाए रखे गए हैं। ‘बात अच्छी है’ हिन्दी में अर्थ-संदिग्धता को पर्याप्त रूप से समेटता है, इसलिए अलग पादटिप्पणी आवश्यक नहीं समझी गई।
