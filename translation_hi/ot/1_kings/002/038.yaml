base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/038.yaml
  text: Shimei said to the king[a], “The word is good. Just as my lord the king has spoken, so your servant will do.” And Shimei lived in Jerusalem many days.
translation:
  language: hi
  text: शिमई ने राजा से कहा, “बात अच्छी है। जैसा मेरे प्रभु राजा ने कहा है, वैसा ही आपका सेवक करेगा।” और शिमई बहुत दिनों तक यरूशलेम में रहा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: טוֹב הַדָּבָר
  choice: बात अच्छी है
  rationale: דָּבָר का अर्थ ‘वचन’, ‘बात’ या ‘मामला’ हो सकता है। यहाँ शिमई राजा की कही हुई शर्त का उत्तर दे रहा है; ‘बात अच्छी है’ इस अर्थ-व्याप्ति को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: मेरे प्रभु राजा
  rationale: यह राजदरबार की आदरसूचक संबोधन-शैली है। ‘मेरे प्रभु राजा’ सम्मान और मूल की संरचना दोनों बनाए रखता है।
- source_word: כֵּן יַעֲשֶׂה עַבְדֶּךָ
  choice: वैसा ही आपका सेवक करेगा
  rationale: यहाँ ‘आपका सेवक’ राजा के सामने विनम्र आत्म-संदर्भ है, और अपूर्ण क्रिया आने वाले पालन की प्रतिज्ञा व्यक्त करती है।
- source_word: וַיֵּשֶׁב
  choice: रहा
  rationale: निवास के संदर्भ में יָשַׁב का अर्थ ‘रहना’ है; हिन्दी में ‘यरूशलेम में रहा’ सहज और स्पष्ट है।
- source_word: יָמִים רַבִּים
  choice: बहुत दिनों तक
  rationale: मूल का शाब्दिक मुहावरा ‘बहुत दिन’ अनिश्चित किंतु लंबी अवधि बताता है; ‘बहुत दिनों तक’ स्वाभाविक हिन्दी है।
- source_word: שִׁמְעִי
  choice: शिमई
  rationale: व्यक्तिनाम का प्रचलित हिन्दी लिप्यंतरण।
- source_word: בִּירוּשָׁלִַם
  choice: यरूशलेम में
  rationale: स्थाननाम का प्रचलित हिन्दी रूप और उपसर्ग בְּ का सीधा अनुवाद।
