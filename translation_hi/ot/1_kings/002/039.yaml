reference: 1 Kings 2:39
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יְהִ֗י מִ/קֵּץ֙ שָׁלֹ֣שׁ שָׁנִ֔ים וַ/יִּבְרְח֤וּ שְׁנֵֽי עֲבָדִים֙ לְ/שִׁמְעִ֔י אֶל אָכִ֥ישׁ בֶּֽן מַעֲכָ֖ה מֶ֣לֶךְ גַּ֑ת וַ/יַּגִּ֤ידוּ לְ/שִׁמְעִי֙ לֵ/אמֹ֔ר הִנֵּ֥ה עֲבָדֶ֖י/ךָ בְּ/גַֽת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/039.yaml
  text: At the end of three years[a], two servants of Shimei ran away to Achish son of Maacah, king of Gath. And they told Shimei, saying, “Look, your servants are in Gath.”
translation:
  language: hi
  text: तीन वर्ष पूरे होने पर[a], शिमी के दो दास भागकर गत के राजा, माका के पुत्र आकीश के पास चले गए। शिमी को बताया गया, “देखो, तुम्हारे दास गत में हैं।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तीन वर्ष के अंत में।”
    reason: मूल वाक्यांश तीन वर्ष की अवधि के अंतिम बिंदु को व्यक्त करता है; यह अधिक शाब्दिक विकल्प है।
lexical_decisions:
- source_word: מִקֵּץ שָׁלֹשׁ שָׁנִים
  choice: तीन वर्ष पूरे होने पर
  rationale: यह वाक्यांश तीन वर्ष की अवधि के अंतिम बिंदु को दर्शाता है; यह हिंदी में स्वाभाविक रहते हुए उस कालगत भाव को बनाए रखता है।
- source_word: וַיִּבְרְחוּ
  choice: भागकर ... चले गए
  rationale: ברח का अर्थ भाग जाना या पलायन करना है; यहाँ स्वामी को छोड़कर जाने के प्रसंग में यह सहज और स्पष्ट है।
- source_word: עֲבָדִים / עֲבָדֶיךָ
  choice: दास
  rationale: עבד का अर्थ सेवक या दास हो सकता है, पर यहाँ उनका अपने स्वामी से भागना उनकी बंधुआ स्थिति को प्रमुख बनाता है; इसलिए ‘दास’ चुना गया है।
- source_word: אֶל אָכִישׁ
  choice: आकीश के पास
  rationale: यह पूर्वसर्ग किसी व्यक्ति की ओर जाने को दर्शाता है; हिंदी में ‘के पास’ स्वाभाविक है।
- source_word: בֶּן מַעֲכָה מֶלֶךְ גַּת
  choice: गत के राजा, माका के पुत्र
  rationale: यह आकीश के पिता और राजकीय पद, दोनों की पहचान को स्पष्ट और स्वाभाविक हिंदी क्रम में रखता है।
- source_word: וַיַּגִּידוּ לְשִׁמְעִי לֵאמֹר
  choice: तब लोगों ने शिमी को बताया
  rationale: इब्रानी में कर्ता अनिर्दिष्ट बहुवचन है। ‘लोगों ने’ उस अनिर्दिष्टता को स्वाभाविक हिंदी में व्यक्त करता है; לֵאמֹר का कार्य आगे आने वाले सीधे कथन से स्पष्ट है।
- source_word: הִנֵּה
  choice: देखो
  rationale: यह ध्यान आकर्षित करने वाला संकेतक है; ‘देखो’ आधुनिक हिंदी में उसकी तात्कालिकता बनाए रखता है।
- source_word: בְּגַת
  choice: गत में
  rationale: ב यहाँ स्थान सूचित करता है; नगर के भीतर उपस्थिति के लिए ‘गत में’ सीधा अनुवाद है।
theological_decisions: []
translation_notes:
  register: आधुनिक मानक हिंदी में सरल, गरिमापूर्ण कथात्मक शैली रखी गई है। ‘दास’ प्रसंग में निहित बंधुआ स्थिति को स्पष्ट करता है, जबकि नामों का लिप्यंतरण प्रचलित बाइबलीय हिंदी रूपों के अनुरूप है।
