  text: וַ/יִּשָּׁבַע֙ הַ/מֶּ֣לֶךְ שְׁלֹמֹ֔ה בַּֽ/יהוָ֖ה לֵ/אמֹ֑ר כֹּ֣ה יַֽעֲשֶׂה לִּ֤/י אֱלֹהִים֙ וְ/כֹ֣ה יוֹסִ֔יף כִּ֣י בְ/נַפְשׁ֔/וֹ דִּבֶּר֙ אֲדֹ֣נִיָּ֔הוּ אֶת הַ/דָּבָ֖ר הַ/זֶּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/023.yaml
  text: Then King Solomon swore by Yahweh[a], saying, “May God do so to me, and more also[b], for Adonijah has spoken this word against his own life.”
translation:
  language: hi
  text: तब राजा सुलैमान ने याहवे[a] की शपथ खाकर कहा, “परमेश्वर मेरे साथ ऐसा ही करे, और इससे भी अधिक करे, क्योंकि अदोनिय्याह ने यह बात अपने ही प्राण के विरुद्ध कही है[b]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में परमेश्वर का विशिष्ट नाम יהוה (YHWH) है। इसे ‘याहवे’ पढ़ा जाता है; ‘यहोवा’ एक पारंपरिक वैकल्पिक रूप है।
    reason: ईश्वरीय नाम के स्रोत-रूप और वैकल्पिक पारंपरिक रूप को स्पष्ट करना।
  - marker: b
    text: इब्रानी मुहावरे का शाब्दिक भाव ‘अपने प्राण के साथ/विरुद्ध’ है; आशय है कि उसने ऐसी बात कही जिससे उसका जीवन संकट में पड़ गया या उसे अपने प्राणों की कीमत चुकानी पड़ सकती थी।
    reason: मूल मुहावरे की अस्पष्टता और उसके जीवन-जोखिम संबंधी अर्थ-क्षेत्र को सुरक्षित रखना।
lexical_decisions:
- source_word: וַיִּשָּׁבַע
  choice: शपथ खाकर कहा
  rationale: इब्रानी क्रिया का अर्थ शपथ खाना है; हिंदी कथात्मक प्रवाह में आगे आने वाले לֵאמֹר के साथ यह प्रयोग स्वाभाविक है।
- source_word: בַּיהוָה
  choice: यहोवा की शपथ
  rationale: בְּ उस सत्ता को सूचित करता है जिसके नाम पर शपथ खाई गई है; יְהוָה को उसके प्रचलित हिंदी नामरूप ‘यहोवा’ से व्यक्त किया गया है।
- source_word: כֹּה יַעֲשֶׂה לִּי אֱלֹהִים וְכֹה יוֹסִיף
  choice: परमेश्वर मेरे साथ ऐसा ही करे, और इससे भी अधिक करे
  rationale: यह आत्म-दंड का आह्वान करने वाला रूढ़ शपथ-वाक्य है। अनिर्दिष्ट दंड और उसकी तीव्रता दोनों को यथासंभव बनाए रखा गया है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यहाँ כִּי शपथ के आधार को कारणसूचक या दृढ़ कथन के रूप में प्रस्तुत करता है; प्रसंग में नकारात्मक शर्त जोड़ना स्रोत-पाठ से समर्थित नहीं है।
- source_word: בְנַפְשׁוֹ
  choice: अपने ही प्राण के विरुद्ध
  rationale: यह शाब्दिक निकटता रखते हुए उस भाव को सुरक्षित रखता है कि अदोनिय्याह की कही बात ने उसके जीवन को संकट में डाल दिया या उसके प्राणों का मूल्य माँगा।
- source_word: דִּבֶּר ... אֶת־הַדָּבָר הַזֶּה
  choice: यह बात ... कही है
  rationale: ‘यह बात कही’ आधुनिक हिंदी में स्वाभाविक है और इब्रानी के ‘इस वचन/बात को कहा’ का अर्थ स्पष्ट रखता है।
- source_word: אֲדֹנִיָּהוּ
  choice: अदोनिय्याह
  rationale: व्यक्तिनाम का प्रचलित हिंदी बाइबलीय लिप्यंतरण अपनाया गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का रूप
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ में सामान्य उपाधि नहीं, विशिष्ट ईश्वरीय नाम है। मुख्य पाठ में हिंदी पाठकों के बीच व्यापक रूप से पहचाना जाने वाला ‘यहोवा’ रखा गया है और स्रोत-नाम की जानकारी पादटिप्पणी में दी गई है।
- issue: अदोनिय्याह के कथन का जीवन-संबंधी परिणाम
  choice: अपने ही प्राण के विरुद्ध
  alternative: अपने प्राणों की कीमत पर
  rationale: मुख्य पाठ इब्रानी मुहावरे की न्यायिक और आत्म-विनाशकारी धार को बनाए रखता है, पर यह निश्चित करने से बचता है कि वाक्य केवल संकट या अनिवार्य मृत्यु में से किसे दर्शाता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और कथात्मक रखी गई है। शपथ-वाक्य का औपचारिक स्वर बनाए रखते हुए अत्यधिक पुरातन शब्दावली से बचा गया है।
