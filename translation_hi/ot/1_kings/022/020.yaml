  yaml_path: translation/ot/1_kings/022/020.yaml
  text: And Yahweh said[a], “Who will entice Ahab, so that he may go up and fall at Ramoth-gilead?” And this one said one thing, and that one said another.
translation:
  language: hi
  text: और याहवे ने कहा, “कौन अहाब को फुसलाएगा[a], ताकि वह रामोत-गिलाद पर चढ़ाई करे और वहाँ गिर पड़े?” और एक ने एक बात कही और दूसरे ने दूसरी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “राज़ी करेगा”; प्रसंग के अनुसार इस क्रिया का अर्थ “बहकाएगा” या “धोखा देगा” भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत नाम को उपाधि से बदलने के बजाय देवनागरी में लिप्यंतरित किया गया है।
- source_word: יְפַתֶּה
  choice: फुसलाएगा
  rationale: पिएल रूप में इस क्रिया के अर्थ-क्षेत्र में फुसलाना, राज़ी करना और धोखा देना शामिल हैं। ‘फुसलाना’ किसी को एक कार्य की ओर प्रेरित करने का भाव रखता है, पर मुख्य पाठ में सीधे ‘धोखा देना’ कहकर अर्थ को अनावश्यक रूप से सीमित नहीं करता।
- source_word: וְיַעַל
  choice: ताकि वह ... पर चढ़ाई करे
  rationale: संयोजक सहित अपूर्ण क्रिया यहाँ उद्देश्य अथवा अपेक्षित परिणाम बताती है। युद्ध के प्रसंग में ‘चढ़ाई करे’ स्वाभाविक हिन्दी है।
- source_word: וְיִפֹּל
  choice: और वहीं गिर पड़े
  rationale: मूल क्रिया נפל का आधारभूत अर्थ ‘गिरना’ है। युद्ध के प्रसंग में मृत्यु अथवा पराजय निहित है, लेकिन ‘गिर पड़े’ मूल की संक्षिप्तता और अर्थगत तनाव को बनाए रखता है।
- source_word: בְּרָמֹת גִּלְעָד
  choice: रामोत-गिलाद पर
  rationale: स्थान-नाम को देवनागरी में लिप्यंतरित किया गया है; ‘पर’ युद्धस्थल पर चढ़ाई करने के हिन्दी प्रयोग के अनुकूल है।
- source_word: זֶה בְּכֹה וְזֶה אֹמֵר בְּכֹה
  choice: तब एक ने कुछ कहा और दूसरे ने कुछ और
  rationale: यह मुहावरा अलग-अलग वक्ताओं के भिन्न प्रस्तावों को दर्शाता है। यह रूप आधुनिक हिन्दी में स्पष्ट है और मूल के विरोधात्मक समानांतर ढाँचे को बनाए रखता है।
theological_decisions:
- issue: अहाब के पतन में याहवे की भूमिका
  choice: याहवे के सीधे प्रश्न को बिना नरम किए रखा गया है कि अहाब को कौन फुसलाएगा।
  alternative: ईश्वरीय भूमिका को कम प्रत्यक्ष दिखाने के लिए ‘अहाब को कौन प्रभावित करेगा’ जैसा रूप।
  rationale: इब्रानी पाठ याहवे को स्वर्गीय सभा में यह प्रश्न आरंभ करते हुए सीधे प्रस्तुत करता है। अनुवाद इस कथन में निहित ईश्वरीय प्रभुसत्ता और न्याय के तनाव को समझाकर समाप्त या कम नहीं करता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, सहज किंतु गरिमापूर्ण रखी गई है। ‘चढ़ाई करे’ युद्ध-संदर्भ को स्पष्ट करता है, जबकि ‘गिर पड़े’ मूल क्रिया की चित्रात्मकता और मृत्यु/पराजय की अंतर्निहित अस्पष्टता को सुरक्षित रखता है।
