  text: And the battle intensified that day[a], and the king remained standing in the chariot facing Aram, and he died in the evening[c][b]; and the blood from the wound flowed into the bottom of the chariot.
translation:
  language: hi
  text: उस दिन युद्ध और भी प्रचंड हो गया[a]। राजा को रथ में अराम के सामने खड़ा रखा गया[b]। शाम को उसकी मृत्यु हो गई, और घाव से निकला खून रथ के निचले भाग में बह निकला[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उस दिन युद्ध बढ़ता गया”; अधिक शाब्दिक रूप से, “युद्ध ऊपर चढ़ा।”
    reason: lexical_alternative
  - marker: b
    text: या “राजा रथ में खड़ा रहा”; इब्रानी रूप यह संकेत दे सकता है कि उसे खड़ा रखा गया या खड़ा रहने दिया गया।
    reason: lexical_alternative
  - marker: c
    text: शाब्दिक रूप से, “रथ की गोद में,” अर्थात रथ के भीतरी या निचले भाग में।
    reason: lexical_alternative
