base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/031.yaml
  text: The king of Aram had commanded the thirty-two chariot commanders who belonged to him[a], saying, “Do not fight with either small or great[c][b], but only with the king of Israel alone.”
translation:
  language: hi
  text: 'अराम के राजा ने अपने बत्तीस रथ-दल के सेनापतियों को यह आज्ञा दी थी: “न छोटे[a] से लड़ना, न बड़े से—केवल इस्राएल के राजा से ही लड़ना।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “छोटे” और “बड़े” से आशय किसी भी पद या हैसियत के लोगों से है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמֶלֶךְ אֲרָם
  choice: अराम के राजा ने
  rationale: אֲרָם को मूल स्थान-नाम ‘अराम’ के रूप में रखा गया है; आरंभिक ו को हिंदी कथन-प्रवाह में अलग से व्यक्त करना आवश्यक नहीं है।
- source_word: צִוָּה
  choice: आज्ञा दी थी
  rationale: क्रिया आदेश देने को व्यक्त करती है; ‘दी थी’ आगामी युद्ध-दृश्य की पृष्ठभूमि में पहले दिए गए आदेश का स्वाभाविक संकेत है।
- source_word: שָׂרֵי הָרֶכֶב
  choice: रथ-दल के सेनापतियों
  rationale: यह पद रथ-सेना के अधिकारियों अथवा कमांडरों को दर्शाता है; ‘रथ-दल के सेनापति’ आधुनिक हिंदी में स्पष्ट सैन्य अर्थ देता है।
- source_word: אֲשֶׁר לוֹ
  choice: अपने
  rationale: इब्रानी संबंधवाचक वाक्यांश राजा से संबद्ध सेनापतियों को दर्शाता है; हिंदी में संबंधसूचक ‘अपने’ इसे संक्षेप और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: שְׁלֹשִׁים וּשְׁנַיִם
  choice: बत्तीस
  rationale: संख्या का सीधा अनुवाद।
- source_word: לֵאמֹר
  choice: 'यह ... दी थी:'
  rationale: प्रत्यक्ष कथन प्रस्तुत करने वाले सूत्र को हिंदी में ‘यह आज्ञा दी थी:’ द्वारा स्वाभाविक रूप से समाहित किया गया है।
- source_word: לֹא תִּלָּחֲמוּ
  choice: न ... लड़ना
  rationale: बहुवचन निषेधात्मक आदेश को हिंदी की स्वाभाविक आज्ञार्थक रचना में रखा गया है।
- source_word: אֶת קָטֹן וְאֶת גָּדוֹל
  choice: न छोटे से ... न बड़े से
  rationale: मूल के ‘छोटे और बड़े’ मुहावरे को बनाए रखता है, जो हर पद या हैसियत के व्यक्ति को समेटता है।
- source_word: כִּי אִם
  choice: केवल
  rationale: यह अपवाद और विशिष्टता का प्रबल बोध कराता है।
- source_word: אֶת מֶלֶךְ יִשְׂרָאֵל
  choice: इस्राएल के राजा से ... लड़ना
  rationale: लड़ाई के लक्ष्य को हिंदी में ‘से लड़ना’ द्वारा स्पष्ट और स्वाभाविक रूप से व्यक्त किया गया है।
- source_word: לְבַדּוֹ
  choice: ही
  rationale: यह इस्राएल के राजा को एकमात्र लक्ष्य ठहराने वाली विशिष्टता पर बल देता है; ‘केवल ... ही’ मूल के दोहरे जोर को बनाए रखता है।
