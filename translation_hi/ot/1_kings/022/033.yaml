source:
  edition: WLC
  text: וַ/יְהִ֗י כִּ/רְאוֹת֙ שָׂרֵ֣י הָ/רֶ֔כֶב כִּֽי לֹא מֶ֥לֶךְ יִשְׂרָאֵ֖ל ה֑וּא וַ/יָּשׁ֖וּבוּ מֵ/אַחֲרָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/033.yaml
  text: And it happened[a], when the commanders of the chariots saw that he was not the king of Israel, they turned back from pursuing him.
translation:
  language: hi
  text: जब रथों के सेनापतियों ने देखा कि वह इस्राएल का राजा नहीं था, तो वे उसका पीछा करना छोड़कर लौट गए।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: जब ... तो
  rationale: यह कथात्मक घटना-क्रम को आगे बढ़ाता है। हिन्दी में अलग से ‘और ऐसा हुआ’ जोड़ने के बजाय ‘जब ... तो’ की स्वाभाविक संरचना उसी प्रवाह को स्पष्ट रूप से व्यक्त करती है।
- source_word: כִּרְאוֹת
  choice: जब ... ने देखा
  rationale: כ के साथ infinitive construct यहाँ समय-संबंधी परिस्थिति बताता है; आधुनिक हिन्दी में ‘जब ... ने देखा’ स्वाभाविक और सटीक है।
- source_word: שָׂרֵי הָרֶכֶב
  choice: रथों के सेनापति
  rationale: שָׂרֵי सैन्य अधिकारियों को और הָרֶכֶב रथों अथवा रथ-दल को सूचित करता है। ‘रथों के सेनापति’ निकटवर्ती और सहज अनुवाद है।
- source_word: כִּי לֹא מֶלֶךְ יִשְׂרָאֵל הוּא
  choice: कि वह इस्राएल का राजा नहीं है
  rationale: यह उनके पहचान लेने की विषय-वस्तु है। הוּא पुल्लिंग एकवचन उस व्यक्ति की ओर संकेत करता है जिसका वे पीछा कर रहे थे। प्रत्यक्ष कथन में हिन्दी का वर्तमानकाल ‘नहीं है’ स्वाभाविक है।
- source_word: וַיָּשׁוּבוּ
  choice: उन्होंने ... छोड़ दिया
  rationale: שׁוּב का मूल अर्थ लौटना या पीछे हटना है; מֵאַחֲרָיו के साथ यह चल रहे पीछा को रोक देने का भाव देता है। संयुक्त हिन्दी अभिव्यक्ति प्रसंगगत अर्थ स्पष्ट करती है।
- source_word: מֵאַחֲרָיו
  choice: उसका पीछा करना
  rationale: शाब्दिक अर्थ ‘उसके पीछे से’ है, पर सैन्य प्रसंग में यह किसी का पीछा करने से हट जाने का हिब्रू मुहावरा है।
theological_decisions: []
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। हिब्रू के कथात्मक וַיְהִי को हिन्दी की ‘जब ... तो’ संरचना में समाहित किया गया है; कोई अनावश्यक व्याख्यात्मक या साम्प्रदायिक तत्व नहीं जोड़ा गया।
