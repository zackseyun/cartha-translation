base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/017.yaml
  text: And he said[a], “I saw all Israel scattered on the mountains, like sheep that have no shepherd. And Yahweh said, ‘These have no master[b]; let each man return to his house in peace.’”
translation:
  language: hi
  text: तब उसने कहा, “मैंने सारे इस्राएल को पहाड़ों पर तितर-बितर देखा, उन भेड़ों के समान जिनका कोई चरवाहा नहीं है। और याहवे ने कहा, ‘इनका कोई स्वामी नहीं है[a]; हर पुरुष अपने घर शांति से लौट जाए[b]।’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “इनके कोई स्वामी नहीं हैं”; हिब्रू शब्द बहुवचन में है, पर संदर्भ में आशय इस्राएल के शासकीय मुखिया से हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या, “हर एक अपने घर शांति से लौट जाए।”
    reason: lexical_alternative
lexical_decisions:
- source_word: נְפֹצִים
  choice: तितर-बितर
  rationale: यह कृदन्त लोगों के बिखरे या छितराए होने को व्यक्त करता है; ‘तितर-बितर’ पराजित और नेतृत्वहीन सेना का दृश्य स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: אֶל הֶהָרִים
  choice: पहाड़ों पर
  rationale: यद्यपि אֶל प्रायः दिशा बताता है, यहाँ बिखराव और दर्शन के स्थानिक संदर्भ में ‘पहाड़ों पर’ उपयुक्त है।
- source_word: כַּצֹּאן אֲשֶׁר אֵין לָהֶם רֹעֶה
  choice: उन भेड़ों के समान जिनका कोई चरवाहा न हो
  rationale: यह मूल उपमा और אֵין की अभाव-सूचक शक्ति को स्पष्ट तथा गरिमापूर्ण हिन्दी में सुरक्षित रखता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिन्दी बाइबल परंपरा में प्रचलित देवनागरी रूप ‘यहोवा’ मूल पाठ के व्यक्तिगत ईश्वरीय नाम को किसी उपाधि से प्रतिस्थापित नहीं करता।
- source_word: אֲדֹנִים
  choice: स्वामी
  rationale: हिब्रू रूप व्याकरणतः बहुवचन है, पर संदर्भ में सेना के शासकीय मुखिया—निकटतः राजा—का अभाव है। ‘स्वामी’ अधिकार का भाव रखते हुए हिन्दी में स्वाभाविक है; बहुवचन की संभावना पादटिप्पणी में दी गई है।
- source_word: יָשׁוּבוּ אִישׁ לְבֵיתוֹ
  choice: हर पुरुष अपने घर ... लौट जाए
  rationale: अपूर्ण क्रिया यहाँ आज्ञार्थक/इच्छार्थक बल रखती है। ‘हर पुरुष’ वितरक אִישׁ और उसके पुल्लिंग संदर्भ को बनाए रखता है।
- source_word: בְּשָׁלוֹם
  choice: कुशल से
  rationale: यह हिन्दी का स्वाभाविक बाइबलीय मुहावरा है, जो शांति और सुरक्षित लौटने—दोनों संभावित भावों को समेटता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल में परमेश्वर का व्यक्तिगत नाम है, इसलिए उसे ‘प्रभु’ जैसी उपाधि से नहीं बदला गया। आधुनिक हिन्दी पाठकों में पहचाने जाने वाले रूप ‘यहोवा’ को चुना गया।
- issue: אֲדֹנִים की संख्या और अर्थ
  choice: इनका कोई स्वामी नहीं है
  alternative: इनके कोई स्वामी नहीं हैं
  rationale: मूल संज्ञा बहुवचन रूप में है, किन्तु संदर्भ इस्राएल के शासकीय मुखिया के अभाव की ओर संकेत करता है। मुख्य पाठ में स्वाभाविक सामूहिक एकवचन रखा गया और वास्तविक बहुवचन रूप पादटिप्पणी में सुरक्षित किया गया।
- issue: वितरक אִישׁ का लिंग
  choice: हर पुरुष
  alternative: हर एक
  rationale: मूल का पुल्लिंग वितरक पद संभवतः युद्धरत पुरुषों को संदर्भित करता है; इसलिए उसे लिंग-निरपेक्ष नहीं बनाया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण और मौखिक रूप से स्पष्ट शैली अपनाई गई है। दर्शन की चरवाही-संबंधी उपमा अक्षुण्ण रखी गई है और अस्पष्ट बहुवचन אֲדֹנִים को पादटिप्पणी में स्पष्ट किया गया है।
