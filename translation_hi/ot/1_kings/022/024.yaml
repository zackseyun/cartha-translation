  text: וַ/יִּגַּשׁ֙ צִדְקִיָּ֣הוּ בֶֽן כְּנַעֲנָ֔ה וַ/יַּכֶּ֥ה אֶת מִיכָ֖יְהוּ עַל הַ/לֶּ֑חִי וַ/יֹּ֕אמֶר אֵי זֶ֨ה עָבַ֧ר רֽוּחַ יְהוָ֛ה מֵ/אִתִּ֖/י לְ/דַבֵּ֥ר אוֹתָֽ/ךְ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/024.yaml
  text: Then Zedekiah son of Chenaanah came near and struck Micaiah on the cheek and said[a], “Which way did the Spirit of Yahweh pass from me to speak to you?”
translation:
  language: hi
  text: तब कनानाह का पुत्र सिदकियाह निकट आया और उसने मीकायाह के गाल पर प्रहार किया। उसने कहा, “याहवेह की आत्मा मुझसे किस मार्ग से निकलकर तुझसे बात करने गई?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּגַּשׁ
  choice: पास आया
  rationale: नגשׁ के निकट आने के भौतिक भाव और प्रसंग के टकरावपूर्ण स्वर—दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: צִדְקִיָּהוּ בֶן כְּנַעֲנָה
  choice: कनाना का पुत्र सिदकियाह
  rationale: इब्रानी पितृनाम-संरचना को स्वाभाविक हिन्दी शब्दक्रम में रखा गया है और व्यक्तिनामों का लिप्यंतरण किया गया है।
- source_word: וַיַּכֶּה ... עַל הַלֶּחִי
  choice: मीकायाह के गाल पर मारा
  rationale: נכה व्यापक अर्थ में मारने को और לֶחִי सामान्यतः गाल को दर्शाता है; ‘थप्पड़ मारा’ प्रहार के ढंग को आवश्यकता से अधिक निश्चित करता।
- source_word: אֵי זֶה
  choice: किस मार्ग से
  rationale: यह पदबंध यहाँ उस मार्ग की व्यंग्यपूर्ण पूछताछ करता है जिससे आत्मा कथित रूप से सिदकियाह को छोड़कर मीकायाह तक गया।
- source_word: עָבַר
  choice: निकलकर ... गया
  rationale: עבר के गुजरने या एक स्थान से दूसरे स्थान जाने के भाव को हिन्दी में सहज रूप से व्यक्त करता है, साथ ही ‘मुझसे’ स्रोत को बनाए रखता है।
- source_word: רוּחַ יְהוָה
  choice: याहवेह का आत्मा
  rationale: भविष्यद्वाणी के प्रसंग में यह परमेश्वर के आत्मा को सूचित करता है; יְהוָה को व्यक्तिगत नाम के रूप में ‘याहवेह’ लिखा गया है।
- source_word: מֵאִתִּי
  choice: मुझसे
  rationale: पूर्वसर्ग स्रोत अथवा प्रस्थान-बिंदु बताता है; ‘मुझसे’ संक्षिप्त और स्वाभाविक है।
- source_word: לְדַבֵּר אֹתָךְ
  choice: तुझसे बात करने
  rationale: संक्षिप्त इब्रानी रचना का दिशात्मक अर्थ सुरक्षित रखते हुए इसे वर्तमान हिन्दी में स्वाभाविक बनाया गया है; प्रत्यक्ष संबोधन में ‘तुझसे’ मूल के एकवचन को रखता है।
theological_decisions:
- issue: רוּחַ יְהוָה का अर्थ और प्रस्तुति
  choice: याहवेह का आत्मा
  alternative: याहवेह की आत्मा; याहवेह की ओर से आया आत्मिक प्रभाव
  rationale: भविष्यद्वक्ताओं के विवाद में यह पदबंध दिव्य भविष्यद्वाणी कराने वाले आत्मा की ओर संकेत करता है। अनुवाद सिदकियाह के व्यंग्यपूर्ण दावे को प्रस्तुत करता है, पर यह निर्णय नहीं करता कि उसका दावा सत्य था।
- issue: प्रश्न אֵי זֶה עָבַר की व्याख्या
  choice: मुझसे निकलकर किस मार्ग से ... गया?
  alternative: कहाँ से ... गया?; किस तरह ... गया?
  rationale: ‘किस मार्ग से’ मूल के स्थानिक/मार्गसूचक व्यंग्य को बनाए रखता है, जबकि ‘निकलकर ... गया’ हिन्दी में प्रस्थान और गमन को स्पष्ट करता है। वैकल्पिक शाब्दिक विन्यास पादटिप्पणी में दिया गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। प्रत्यक्ष कटु संबोधन के कारण ‘तुझसे’ चुना गया है। ‘गाल पर मारा’ मूल की व्यापकता बचाता है और ‘थप्पड़’ जैसी अधिक विशिष्ट व्याख्या से बचता है।
