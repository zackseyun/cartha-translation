base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/049.yaml
  text: Jehoshaphat made ships of Tarshish to go to Ophir for gold[a], but they did not go[b], because the ships were wrecked at Ezion-geber.
translation:
  language: hi
  text: यहोशापात ने तर्शीश के जहाज़[a] बनवाए, ताकि वे सोना लाने ओपीर जाएँ; पर वे जा न सके, क्योंकि वे जहाज़ एस्योन-गेबेर में टूट गए[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “तर्शीशी जहाज़”; संभव है कि इसका अर्थ तर्शीश से संबद्ध जहाज़ न होकर बड़े समुद्री जहाज़ों की एक श्रेणी हो।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में “टूट गया” एकवचन है; यहाँ इसका सामूहिक अर्थ जहाज़ों या पूरे बेड़े से है।
    reason: lexical_alternative
lexical_decisions:
- source_word: עשר
  choice: बनवाए
  rationale: व्यंजनात्मक पाठ का रूप कठिन है, पर प्रसंग में इसे ‘बनाना/तैयार करना’ अर्थ वाले क्रियात्मक रूप के रूप में समझना सबसे उपयुक्त है। राजा के संदर्भ में ‘बनवाए’ स्वाभाविक हिन्दी है और उसके प्रत्यक्ष रूप से जहाज़ बनाने का अनावश्यक संकेत नहीं देता।
- source_word: אֳנִיּוֹת תַּרְשִׁישׁ
  choice: तर्शीश के जहाज़
  rationale: इब्रानी संबंध-संरचना को निकटता से सुरक्षित रखा गया है। यह पद तर्शीश से जुड़े जहाज़ों अथवा बड़े समुद्री जहाज़ों की एक श्रेणी को सूचित कर सकता है; इस अस्पष्टता को पादटिप्पणी में रखा गया है।
- source_word: לָלֶכֶת אוֹפִירָה
  choice: ओपीर जाएँ
  rationale: उद्देश्यसूचक infinitive और दिशासूचक स्थान-रूप गंतव्य की ओर जाने का भाव देते हैं। बहुवचन ‘जाएँ’ हिन्दी में जहाज़ों के सामूहिक संदर्भ को स्पष्ट करता है।
- source_word: לַזָּהָב
  choice: सोना लाने
  rationale: यहाँ ל उद्देश्य को दर्शाता है। ‘सोना लाने’ यात्रा का लक्ष्य साधारण आधुनिक हिन्दी में स्पष्ट और संक्षिप्त रूप से व्यक्त करता है।
- source_word: וְלֹא הָלָךְ
  choice: पर वे जा न सके
  rationale: इब्रानी क्रिया एकवचन है, पर प्रसंग में सामूहिक बेड़े/जहाज़ों की ओर संकेत करती है। ‘जा न सके’ यह स्पष्ट करता है कि नियोजित यात्रा आरम्भ या पूरी नहीं हो सकी; इसका अर्थ यहोशापात का स्वयं न जाना नहीं है।
- source_word: נשברה
  choice: टूट गए
  rationale: שבר के निफ़अल रूप का मूल भाव ‘टूट जाना’ है। समुद्री जहाज़ों के संदर्भ में यह उनके क्षतिग्रस्त या नष्ट हो जाने को स्वाभाविक रूप से व्यक्त करता है, जबकि मूल बिंब भी सुरक्षित रहता है।
- source_word: בְּעֶצְיוֹן גָּבֶר
  choice: एस्योन-गेबेर में
  rationale: स्थान के साथ ב को हिन्दी में स्वाभाविक रूप से ‘में’ कहा गया है और स्थाननाम का लिप्यंतरण किया गया है।
