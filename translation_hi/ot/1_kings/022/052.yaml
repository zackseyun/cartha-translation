  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण ऐतिहासिक-आख्यानात्मक रूप। राजकीय काल-निर्धारण और शासन-संबंधी शब्दावली को मूल इब्रानी के निकट रखते हुए स्वाभाविक हिन्दी वाक्यक्रम अपनाया गया है।
