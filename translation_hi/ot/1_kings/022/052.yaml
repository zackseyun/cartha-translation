id: 1KI.22.52
reference: 1 Kings 22:52
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: אֲחַזְיָ֣הוּ בֶן אַחְאָ֗ב מָלַ֤ךְ עַל יִשְׂרָאֵל֙ בְּ/שֹׁ֣מְר֔וֹן בִּ/שְׁנַת֙ שְׁבַ֣ע עֶשְׂרֵ֔ה לִ/יהוֹשָׁפָ֖ט מֶ֣לֶךְ יְהוּדָ֑ה וַ/יִּמְלֹ֥ךְ עַל יִשְׂרָאֵ֖ל שְׁנָתָֽיִם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/052.yaml
  text: Ahaziah son of Ahab became king over Israel in Samaria in the seventeenth year of Jehoshaphat king of Judah, and he reigned over Israel two years.
translation:
  language: hi
  text: अहाब का पुत्र अहज्याह, यहूदा के राजा यहोशापात के सत्रहवें वर्ष में सामरिया में इस्राएल का राजा बना, और उसने इस्राएल पर दो वर्ष राज्य किया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מָלַךְ
  choice: राजा बना
  rationale: यहाँ पूर्ण क्रिया राजगद्दी पर बैठने का संकेत देती है; ‘राजा बना’ आधुनिक हिन्दी में इस आरंभिक घटना को स्वाभाविक और स्पष्ट रूप से व्यक्त करता है।
- source_word: עַל יִשְׂרָאֵל
  choice: इस्राएल पर
  rationale: מָלַךְ के साथ עַל किसी प्रजा या क्षेत्र पर शासन को दर्शाता है; ‘इस्राएल पर’ इसका सटीक हिन्दी रूप है।
- source_word: בְּשֹׁמְרוֹן
  choice: सामरिया में
  rationale: בְּ यहाँ स्थान बताता है और सामरिया राजकीय राजधानी है; ‘में’ हिन्दी में स्वाभाविक है।
- source_word: בִּשְׁנַת שְׁבַע עֶשְׂרֵה
  choice: सत्रहवें वर्ष में
  rationale: यह राजकीय काल-निर्धारण का प्रचलित सूत्र है; क्रमवाचक रूप मूल अर्थ को स्पष्ट रखता है।
- source_word: לִיהוֹשָׁפָט
  choice: यहोशापात के
  rationale: इस राजकीय सूत्र में ל उस राजा को चिह्नित करता है जिसके शासन-वर्ष की गणना हो रही है; हिन्दी संबंधकारक ‘के’ उपयुक्त है।
- source_word: וַיִּמְלֹךְ
  choice: और उसने … राज्य किया
  rationale: राज्यारोहण की सूचना के बाद यह क्रिया शासन की अवधि बताती है; ‘राज्य किया’ पुनरुक्ति से बचते हुए कथानक का क्रम बनाए रखता है।
- source_word: שְׁנָתָיִם
  choice: दो वर्ष
  rationale: द्विवचन रूप ठीक दो वर्षों की अवधि बताता है; हिन्दी में क्रिया के साथ ‘दो वर्ष’ स्वाभाविक है।
- source_word: אֲחַזְיָהוּ בֶן אַחְאָב
  choice: अहाब का पुत्र अहज्याह
  rationale: वंश-संबंध को स्पष्ट रखते हुए हिन्दी की स्वाभाविक पद-रचना अपनाई गई है; दोनों व्यक्तिनाम लिप्यंतरित हैं।
- source_word: מֶלֶךְ יְהוּדָה
  choice: यहूदा के राजा
  rationale: यह पद यहोशापात की पहचान बताता है; हिन्दी में ‘यहूदा के राजा’ मानक और स्पष्ट रूप है।
