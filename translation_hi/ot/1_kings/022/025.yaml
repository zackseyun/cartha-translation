- source_word: בַּיּוֹם הַהוּא
  choice: उस दिन
  rationale: इब्रानी कालवाचक पद का सीधा और स्वाभाविक हिन्दी रूप।
- source_word: אֲשֶׁר תָּבֹא
  choice: जब तू ... जाएगा
