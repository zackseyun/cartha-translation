- source_word: חֶדֶר בְּחֶדֶר
  choice: एक भीतरी कोठरी में
  rationale: दोहराया गया ‘कोठरी’ भीतर की ओर हटकर किसी गुप्त स्थान में जाने का भाव देता है। मुख्य पाठ में अर्थ-स्पष्ट रूप रखा गया है और शाब्दिक/वैकल्पिक समझ पादटिप्पणी में सुरक्षित है।
- source_word: לְהֵחָבֵה
  choice: छिपने के लिए
  rationale: उद्देश्यवाचक अनन्त क्रिया का संक्षिप्त और स्वाभाविक हिन्दी अनुवाद; आत्मवाचक भाव हिन्दी में ‘छिपने’ से स्पष्ट है।
