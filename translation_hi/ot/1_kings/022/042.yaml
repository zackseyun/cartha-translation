base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/042.yaml
  text: Jehoshaphat was thirty-five years old when he began to reign, and he reigned twenty-five years in Jerusalem. And his mother’s name was Azubah daughter of Shilhi.
translation:
  language: hi
  text: यहोशापात पैंतीस वर्ष का था जब वह राजा बना, और उसने यरूशलेम में पच्चीस वर्ष राज्य किया। उसकी माता का नाम अजूबा था, जो शिल्ही की बेटी थी।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוֹשָׁפָט
  choice: यहोशापात
  rationale: व्यक्तिनाम का अर्थानुवाद न करके हिन्दी बाइबिल परंपरा के अनुरूप लिप्यंतरण किया गया है।
- source_word: בֶּן שְׁלֹשִׁים וְחָמֵשׁ שָׁנָה
  choice: पैंतीस वर्ष का था
  rationale: शाब्दिक इब्रानी मुहावरे ‘पैंतीस वर्षों का पुत्र’ का स्वाभाविक और अर्थ-सटीक हिन्दी रूप।
- source_word: בְּמָלְכוֹ
  choice: जब वह राजा बना
  rationale: यह रूप राजपद ग्रहण करने के समय को सूचित करता है; वर्तमान हिन्दी में यह स्पष्ट और सहज है।
- source_word: וְעֶשְׂרִים וְחָמֵשׁ שָׁנָה מָלַךְ
  choice: उसने ... पच्चीस वर्ष राज्य किया
  rationale: राज्यकाल की अवधि और מלך क्रिया, दोनों को स्वाभाविक हिन्दी राजकीय अभिव्यक्ति में रखा गया है।
- source_word: בִּירוּשָׁלִָם
  choice: यरूशलेम में
  rationale: स्थानवाचक उपसर्ग और स्थाननाम का मानक हिन्दी रूप।
- source_word: וְשֵׁם אִמּוֹ
  choice: उसकी माता का नाम ... था
  rationale: राजकीय वंश-सूचना के सूत्र को गरिमापूर्ण, किंतु सहज आधुनिक हिन्दी में व्यक्त किया गया है।
- source_word: עֲזוּבָה
  choice: अजूबा
  rationale: व्यक्तिनाम का हिन्दी ध्वनि-परंपरा के अनुसार लिप्यंतरण।
- source_word: בַּת שִׁלְחִי
  choice: शिल्ही की बेटी
  rationale: वंशसूचक संबंध का सीधा अनुवाद; शिल्ही व्यक्तिनाम का लिप्यंतरण है।
