base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/006.yaml
  text: Then the king of Israel gathered the prophets[a], about four hundred men, and said to them, “Should I go against Ramoth-gilead for battle, or should I refrain?” And they said, “Go up, and the Lord will give it into the hand of the king.”
translation:
  language: hi
  text: तब इस्राएल के राजा ने भविष्यद्वक्ताओं को, जो लगभग चार सौ पुरुष थे, इकट्ठा किया और उनसे पूछा, “क्या मैं युद्ध करने के लिए रामोत-गिलाद पर चढ़ाई करूँ, या रुक जाऊँ?” उन्होंने कहा, “चढ़ाई कीजिए; प्रभु[a] उसे राजा के हाथ में कर देगा।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: हिब्रू अֲדֹנָי का अर्थ कुछ प्रसंगों में “मेरे प्रभु” भी हो सकता है, यद्यपि यहाँ ईश्वरीय उपाधि “प्रभु” अधिक संभावित है।
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּקְבֹּץ
  choice: इकट्ठा किया
  rationale: קבץ का सामान्य अर्थ लोगों को एक स्थान पर एकत्र करना है; आधुनिक हिन्दी में यह स्वाभाविक और स्पष्ट है।
- source_word: הַנְּבִיאִים
  choice: भविष्यद्वक्ताओं
  rationale: नबीא का मानक, धर्मशास्त्रीय रूप से तटस्थ हिन्दी प्रतिशब्द।
- source_word: כְּאַרְבַּע מֵאוֹת אִישׁ
  choice: लगभग चार सौ पुरुष
  rationale: उपसर्ग כְּ संख्या को अनुमानित बनाता है; ‘लगभग’ इस भाव को सुरक्षित रखता है।
- source_word: הַאֵלֵךְ
  choice: क्या मैं … चढ़ाई करूँ
  rationale: प्रश्नवाचक प्रथम-पुरुष अपूर्ण क्रिया विचार-विमर्श का प्रश्न है; सैन्य प्रसंग में ‘चढ़ाई करूँ’ स्वाभाविक है।
- source_word: עַל רָמֹת גִּלְעָד לַמִּלְחָמָה
  choice: युद्ध करने के लिए रामोत-गिलाद पर चढ़ाई
  rationale: עַל लक्ष्य के विरुद्ध सैन्य गति और לַמִּלְחָמָה युद्ध का उद्देश्य व्यक्त करते हैं; हिन्दी वाक्यांश दोनों तत्व बनाए रखता है।
- source_word: אִם אֶחְדָּל
  choice: या रुक जाऊँ
  rationale: חדל का अर्थ रुकना या किसी कार्य से बाज आना है; यहाँ ‘रुक जाऊँ’ सहज deliberative विकल्प देता है।
- source_word: עֲלֵה
  choice: चढ़ाई कीजिए
  rationale: עלה का शाब्दिक भाव ‘ऊपर जाना’ है, पर सैन्य प्रसंग में हिन्दी ‘चढ़ाई करना’ उस मुहावरे को स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: אֲדֹנָי
  choice: प्रभु
  rationale: मसोरेटिक स्वरांकन इसे प्रायः ईश्वरीय उपाधि ‘प्रभु’ बताता है, न कि विशिष्ट नाम יהוה; संभावित ‘मेरे प्रभु’ पाठ को पादटिप्पणी में रखा गया है।
- source_word: בְּיַד הַמֶּלֶךְ
  choice: राजा के हाथ में
  rationale: हिब्रू मुहावरा किसी को दूसरे के अधिकार या विजय में सौंपने का अर्थ देता है; ‘हाथ में’ मूल बिंब सुरक्षित रखता है।
theological_decisions:
- issue: אֲדֹנָי का अभिप्राय
  choice: प्रभु
  alternative: मेरे प्रभु
  rationale: स्वरांकित पाठ और भविष्यवाणी-सदृश आश्वासन ईश्वरीय उपाधि के पक्ष में हैं। फिर भी यही रूप कुछ प्रसंगों में मानवीय संबोधन ‘मेरे प्रभु’ हो सकता है, इसलिए वास्तविक अस्पष्टता पादटिप्पणी में सुरक्षित है।
