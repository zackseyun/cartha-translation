  register: आधुनिक मानक हिन्दी; गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। सैन्य मुहावरे में ‘चढ़ाई करना’ और समर्पण-विजय के मुहावरे में ‘हाथ में’ रखा गया है।
