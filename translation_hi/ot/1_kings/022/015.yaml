base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/015.yaml
  text: So he came to the king[a], and the king said to him, “Micaiah, should we go to Ramoth-gilead for battle, or should we refrain?” And he said to him, “Go up and succeed, and Yahweh will give it into the hand of the king.”
translation:
  language: hi
  text: 'तब वह राजा के पास आया। राजा ने उससे कहा, “मीकायाह, क्या हम युद्ध करने के लिए रामोत-गिलाद जाएँ, या रुक जाएँ?” उसने राजा से कहा, “चढ़ाई कीजिए और सफल होइए; याहवे उसे राजा के हाथ में कर देगा।”[a]


    [a] प्रसंग से मीकायाह का यह उत्तर संभवतः व्यंग्यपूर्ण है, हालाँकि इब्रानी शब्दों में व्यंग्य का कोई स्पष्ट संकेत नहीं है।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: प्रसंग से मीकायाह का यह उत्तर संभवतः व्यंग्यपूर्ण है, हालाँकि इब्रानी शब्दों में व्यंग्य का कोई स्पष्ट संकेत नहीं है।
    reason: मीकायाह के कथन की संभावित विडंबना को बताए बिना उसे मुख्य पाठ में निश्चित रूप से आरोपित न करना।
lexical_decisions:
- source_word: וַיָּבוֹא
  choice: तब वह ... आया
  rationale: वय्यिक्तोल रूप कथा की अगली घटना को क्रम में आगे बढ़ाता है; ‘तब’ आधुनिक हिन्दी में इस प्रगति को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: מִיכָיְהוּ
  choice: मीकायाह
  rationale: व्यक्तिनाम का ऐसा देवनागरी लिप्यंतरण चुना गया है जो मूल नाम को पहचानने योग्य रखता है और हिन्दी बाइबलीय प्रयोग के अनुकूल है।
- source_word: הֲנֵלֵךְ
  choice: क्या हम ... जाएँ
  rationale: प्रश्नवाचक प्रथम पुरुष बहुवचन अपूर्ण क्रिया यहाँ विचार-विमर्श के लिए सलाह माँगती है; यह हिन्दी में सहज deliberative प्रश्न है।
- source_word: רָמֹת גִּלְעָד
  choice: रामोत-गिलाद
  rationale: स्थाननाम को मूल उच्चारण के निकट देवनागरी में रखा गया है और संयुक्त नाम को योजक-चिह्न से जोड़ा गया है।
- source_word: לַמִּלְחָמָה
  choice: युद्ध करने के लिए
  rationale: लामेद सहित संज्ञा अभियान का उद्देश्य बताती है; यह पदबंध उस प्रयोजन को स्पष्ट और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: אִם נֶחְדָּל
  choice: या रुक जाएँ
  rationale: यह जाने के विपरीत विकल्प, अर्थात अभियान से पीछे रहने, को संक्षिप्त और सामान्य आधुनिक हिन्दी में व्यक्त करता है।
- source_word: עֲלֵה
  choice: चढ़ाई कीजिए
  rationale: עלה का मूल भाव ऊपर जाने का है और सैन्य प्रसंग में अभियान के लिए आगे बढ़ना निहित है; ‘चढ़ाई कीजिए’ हिन्दी में इस सैन्य गति को स्वाभाविक रूप देता है।
- source_word: וְהַצְלַח
  choice: और सफल होइए
  rationale: צלח का हिफ़ील रूप यहाँ उपक्रम में सफलता का भाव देता है; अनुवाद अर्थ को सीधा रखता है और व्यंग्य को मुख्य पाठ में आरोपित नहीं करता।
- source_word: יְהוָה
  choice: याहवे
  rationale: चार-अक्षरीय ईश्वरीय नाम को किसी उपाधि से बदलने के बजाय हिन्दी में उसके प्रचलित निकट लिप्यंतरण से प्रस्तुत किया गया है।
- source_word: בְּיַד הַמֶּלֶךְ
  choice: राजा के हाथ में
  rationale: मूल मुहावरे को बनाए रखा गया है; यहाँ ‘हाथ में देना’ किसी को उसके अधिकार या वश में सौंपने का अर्थ रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: प्रभु / यहोवा
  rationale: मूल पाठ व्यक्तिगत ईश्वरीय नाम का प्रयोग करता है। ‘याहवे’ उसे उपाधि से प्रतिस्थापित किए बिना हिन्दी में लिप्यंतरित करता है।
- issue: मीकायाह के उत्तर का स्वर
  choice: मुख्य पाठ में शब्दों का सीधा अनुवाद; संभावित व्यंग्य की सूचना पादटिप्पणी में
  alternative: मुख्य पाठ में विस्मयादिबोधक चिह्न या व्यंग्यसूचक शब्द जोड़ना
  rationale: व्यापक प्रसंग उत्तर को व्यंग्यपूर्ण बनाता है, पर इब्रानी वाक्य स्वयं व्यंग्य को स्पष्ट रूप से चिह्नित नहीं करता। इसलिए कथात्मक और धर्मवैचारिक तनाव को सुरक्षित रखा गया है।
- issue: וְנָתַן का कालगत अर्थ
  choice: कर देगा
  alternative: कर दिया है
  rationale: आज्ञार्थक क्रियाओं के बाद वाव सहित पूर्ण क्रिया यहाँ अपेक्षित या आश्वस्त भविष्य परिणाम व्यक्त कर सकती है; हिन्दी भविष्यकाल प्रसंग में सबसे स्वाभाविक है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। दरबारी दृश्य के कारण ‘कीजिए/होइए’ का सम्मानसूचक रूप चुना गया है। पुनरुक्त सर्वनामों को हिन्दी की स्वाभाविकता के अनुसार सीमित किया गया, पर ‘राजा’ की औपचारिक भूमिका स्पष्ट रखी गई है।
