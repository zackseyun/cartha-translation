- source_word: יְהוֹשָׁפָט
  choice: यहोशापात
  rationale: हिब्रू व्यक्तिगत नाम का प्रचलित हिन्दी बाइबलीय लिप्यंतरण अपनाया गया है।
- source_word: מֶלֶךְ יְהוּדָה
  choice: यहूदा का राजा
  rationale: सम्बन्धवाचक रचना राजकीय पद को स्पष्ट और स्वाभाविक आधुनिक हिन्दी में व्यक्त करती है।
- source_word: אֶל מֶלֶךְ יִשְׂרָאֵל
  choice: इस्राएल के राजा के पास
  rationale: אֶל किसी व्यक्ति की ओर गति को दर्शाता है; ‘के पास’ हिन्दी में राजा से मिलने हेतु उसके स्थान तक जाने का स्वाभाविक और पारदर्शी रूप है।
