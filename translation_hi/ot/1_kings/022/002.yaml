  rationale: वय्यही यहाँ कथा में समय-सूचक भूमिका निभाता है; स्वाभाविक हिन्दी में अलग से ‘और ऐसा हुआ’ कहने के बजाय समय-वाक्यांश से आरम्भ करना उसका भाव पर्याप्त रूप से व्यक्त करता है।
