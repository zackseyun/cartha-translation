  text: וְ/כָל הַ/נְּבִאִ֔ים נִבְּאִ֥ים כֵּ֖ן לֵ/אמֹ֑ר עֲלֵ֞ה רָמֹ֤ת גִּלְעָד֙ וְ/הַצְלַ֔ח וְ/נָתַ֥ן יְהוָ֖ה בְּ/יַ֥ד הַ/מֶּֽלֶךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/012.yaml
  text: And all the prophets were prophesying thus[a], saying, “Go up to Ramoth-gilead and succeed, and Yahweh will give it into the hand of the king.”
translation:
  language: hi
  text: 'और सभी भविष्यद्वक्ता इसी प्रकार भविष्यवाणी कर रहे थे, यह कहते हुए: “रामोत-गिलाद पर चढ़ाई कर और सफल हो, और याहवे उसे राजा के हाथ में दे देगा।”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/כָל הַ/נְּבִאִים
  choice: और सभी भविष्यद्वक्ता
  rationale: संयोजक, समष्टिवाचक כָּל और निश्चित बहुवचन संज्ञा को सीधे और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: נִבְּאִים כֵּן
  choice: इसी प्रकार भविष्यवाणी कर रहे थे
  rationale: प्रतिभागी रूप की जारी क्रिया और כֵּן के रीति-सूचक अर्थ, दोनों को सुरक्षित रखता है।
- source_word: לֵ/אמֹר
  choice: प्रत्यक्ष कथन से पहले द्विबिंदु
  rationale: हिन्दी में ‘यह कहते हुए’ जोड़ने की अपेक्षा द्विबिंदु अधिक स्वाभाविक है और वही कथन-परिचायक कार्य करता है।
- source_word: עֲלֵה
  choice: चढ़ाई कर
  rationale: मूल अर्थ ‘ऊपर जा’ है, पर इस प्रसंग में सैन्य अभियान निहित है; ‘चढ़ाई कर’ उस संदर्भ को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: רָמֹת גִּלְעָד
  choice: रामोत-गिलाद
  rationale: स्थान-नाम का प्रचलित हिन्दी लिप्यंतरण।
- source_word: וְ/הַצְלַח
  choice: और सफल हो
  rationale: हिफ़ील रूप यहाँ सफलता पाने का भाव देता है; यह संक्षिप्त और प्रसंगानुकूल है।
- source_word: וְ/נָתַן יְהוָה
  choice: और यहोवा ... कर देगा
  rationale: वाव के समन्वयी रूप और आगामी आश्वासन को बनाए रखता है; पूर्ण क्रिया को हिन्दी में भविष्यसूचक कथन के रूप में व्यक्त किया गया है।
- source_word: בְּ/יַד הַ/מֶּלֶךְ
  choice: राजा के हाथ में
  rationale: अधिकार या नियंत्रण में सौंपने के सामान्य इब्रानी मुहावरे को हिन्दी में समझ में आने वाले निकट रूप से सुरक्षित रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ के व्यक्तिगत वाचा-नाम को उपाधि ‘प्रभु’ से प्रतिस्थापित नहीं किया गया; ‘यहोवा’ सामान्य हिन्दी बाइबलीय प्रयोग में पहचाना जाने वाला लिप्यंतरण है।
- issue: וְנָתַן में कथन का संबंध
  choice: और यहोवा ... कर देगा
  alternative: क्योंकि यहोवा ... कर देगा
  rationale: मूल वाव को समन्वयी ‘और’ से रखा गया है, ताकि कारणात्मक संबंध को अनिवार्य बनाकर मूल की संभावित व्यापकता न घटे।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण कथात्मक शैली। जारी भविष्यवाणी को ‘कर रहे थे’ से और सैन्य प्रसंग को ‘चढ़ाई कर’ से स्वाभाविक बनाया गया है।
