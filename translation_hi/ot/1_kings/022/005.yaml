theological_decisions:
- issue: दिव्य नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल में चतुराक्षरी व्यक्तिगत नाम है। हिन्दी पाठकों के लिए प्रतिष्ठित और सुबोध लिप्यंतरण “यहोवा” चुना गया, जबकि “याहवे” भी संभावित विद्वत्तापूर्ण पुनर्निर्माण है।
- issue: דְּרָשׁ ... דְּבַר יְהוָה में पूछताछ का लक्ष्य
  choice: यहोवा से उसका वचन पूछिए
  alternative: यहोवा के वचन की खोज कीजिए
  rationale: चयनित रूप भविष्यद्वक्ता के माध्यम से ईश्वरीय संदेश पूछने का प्रसंग स्पष्ट करता है, पर “वचन” को “इच्छा” या “परामर्श” बनाकर व्याख्यात्मक रूप से सीमित नहीं करता।
