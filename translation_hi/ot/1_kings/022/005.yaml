- source_word: יְהוֹשָׁפָט
  choice: यहोशापात
  rationale: व्यक्तिनाम का प्रचलित हिन्दी बाइबलीय लिप्यंतरण।
- source_word: אֶל מֶלֶךְ יִשְׂרָאֵל
  choice: इस्राएल के राजा से
  rationale: हिब्रू संबंधसूचक पदबंध का स्पष्ट और स्वाभाविक हिन्दी रूप।
- source_word: דְּרָשׁ נָא
  choice: कृपया ... पूछिए
  rationale: דָּרַשׁ यहाँ ईश्वरीय मार्गदर्शन जानने के लिए पूछने/परामर्श करने का अर्थ देता है, और נָא विनम्र अनुरोध प्रकट करता है।
- source_word: כַיּוֹם
  choice: आज ही
  rationale: समय की तात्कालिकता पर बल देते हुए आधुनिक हिन्दी में स्वाभाविक अभिव्यक्ति।
- source_word: אֶת דְּבַר יְהוָה
  choice: यहोवा से उसका वचन
  rationale: मूल का आशय यहोवा से संदेश प्राप्त करने के लिए पूछना है; “वचन” דָּבָר को बनाए रखता है और “उसका” हिन्दी में संबंध स्पष्ट करता है।
- source_word: יְהוָה
  choice: यहोवा
