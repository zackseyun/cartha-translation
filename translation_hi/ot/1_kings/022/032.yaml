base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/032.yaml
  text: And it happened[a], when the commanders of the chariots saw Jehoshaphat, that they said, “Surely he is the king of Israel.” So they turned aside against him to fight[b], but Jehoshaphat cried out.
translation:
  language: hi
  text: जब रथों के सेनापतियों ने यहोशापात को देखा, तो उन्होंने कहा, “निश्चय ही यही इस्राएल का राजा है।” तब वे उससे युद्ध करने के लिए उसकी ओर मुड़े[a], परन्तु यहोशापात पुकार उठा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उस पर आक्रमण करने के लिए उसकी ओर मुड़े।” हिब्रू क्रिया युद्ध में भिड़ने के उद्देश्य से किसी की ओर या उसके विरुद्ध मुड़ने का भाव दे सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: जब
  rationale: हिब्रू कथात्मक सूत्र को हिन्दी में अलग से ‘और ऐसा हुआ’ कहने के बजाय अगले कालवाचक उपवाक्य के साथ स्वाभाविक रूप से व्यक्त किया गया है।
- source_word: כִּרְאוֹת
  choice: जब ... देखा
  rationale: כְּ के साथ infinitive construct यहाँ समय का बोध कराता है; ‘जब ... देखा’ सहज और सटीक हिन्दी है।
- source_word: שָׂרֵי הָרֶכֶב
  choice: रथों के सेनापति
  rationale: שָׂרֵי सैन्य अधिकारियों और הָרֶכֶב रथों अथवा रथ-सेना को दर्शाता है; यह पद निकट और पठनीय अनुवाद है।
- source_word: אַךְ
  choice: निश्चय ही
  rationale: यहाँ शब्द प्रतिबंध नहीं, बल्कि दृढ़ किंतु गलत पहचान व्यक्त करता है।
- source_word: מֶלֶךְ יִשְׂרָאֵל הוּא
  choice: यही इस्राएल का राजा है
  rationale: हिब्रू का पुरुषवाचक सर्वनाम पहचान पर बल देता है; ‘यही’ हिन्दी में उस दृढ़ पहचान को स्वाभाविक रूप से व्यक्त करता है।
- source_word: וַיָּסֻרוּ עָלָיו
  choice: वे ... उसकी ओर मुड़े
  rationale: סור के साथ עַל यहाँ किसी की ओर युद्ध के उद्देश्य से मुड़ने का अर्थ देता है; अगला पद शत्रुतापूर्ण आशय स्पष्ट करता है।
- source_word: לְהִלָּחֵם
  choice: युद्ध करने के लिए
  rationale: לחם का निफ़अल infinitive यहाँ युद्ध में भिड़ने को सूचित करता है।
- source_word: וַיִּזְעַק
  choice: पुकार उठा
  rationale: זעק संकट में ऊँची आवाज़ से पुकारने को व्यक्त करता है; ‘पुकार उठा’ तात्कालिकता रखता है और पुकार की अनकही विषयवस्तु नहीं जोड़ता।
