base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/013.yaml
  text: And the messenger who had gone to summon Micaiah spoke to him[a], saying, “Look now, the words of the prophets are with one mouth favorable to the king. Please let your word be like the word of one of them, and speak favorably.”
translation:
  language: hi
  text: मीकायाह को बुलाने गया दूत उससे बोला, “देखिए, भविष्यद्वक्ताओं के वचन एक स्वर में[a] राजा के पक्ष में हैं। कृपया आपका वचन भी उनमें से किसी एक के वचन जैसा हो, और आप भी राजा के पक्ष में बोलिए।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक अर्थ “एक मुँह से” है; यह सर्वसम्मति से बोलने का मुहावरा है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמַּלְאָךְ
  choice: दूत
  rationale: प्रसंग में यह मीकायाह को बुलाने भेजा गया मनुष्य है, कोई स्वर्गदूत नहीं। ‘दूत’ संक्षिप्त, स्वाभाविक और प्रसंगानुकूल है।
- source_word: לִקְרֹא
  choice: बुलाने
  rationale: राजा के सामने आने के लिए मीकायाह को बुलाया जा रहा है। ‘बुलाने’ मूल क्रिया का सामान्य अर्थ बनाए रखता है और हिन्दी में स्वाभाविक है।
- source_word: הִנֵּה נָא
  choice: देखिए
  rationale: यह सामने की स्थिति की ओर ध्यान खींचते हुए विनम्र आग्रह की भूमिका बाँधता है। आदरसूचक ‘देखिए’ आधुनिक हिन्दी में दोनों भावों को सहज रूप से व्यक्त करता है।
- source_word: דִּבְרֵי הַנְּבִיאִים
  choice: भविष्यद्वक्ताओं के वचन
  rationale: यह मूल पदबंध के ‘वचनों’ को बनाए रखता है और उसे पहले से औपचारिक भविष्यवाणी या संदेश मानकर सीमित नहीं करता।
- source_word: פֶּה אֶחָד
  choice: एक स्वर में
  rationale: शाब्दिक अर्थ ‘एक मुँह’ है, पर यह सर्वसम्मत वाणी का मुहावरा है। ‘एक स्वर में’ हिन्दी का निकट और स्वाभाविक मुहावरा है; शाब्दिक चित्र footnote में सुरक्षित है।
- source_word: טוֹב אֶל הַמֶּלֶךְ
  choice: राजा के पक्ष में
  rationale: यहाँ ‘अच्छा’ उस कथन को दर्शाता है जो राजा के अनुकूल है। ‘राजा के पक्ष में’ अपेक्षित अनुकूलता को स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: יְהִי נָא דבריך
  choice: कृपया आपका वचन भी … हो
  rationale: ‘कृपया’ आग्रह की विनम्रता को व्यक्त करता है और ‘वचन’ का एकवचन मीकायाह के समूचे संदेश के लिए सामूहिक रूप में रखा गया है।
- source_word: כִּדְבַר אַחַד מֵהֶם
  choice: उनमें से किसी एक के वचन जैसा
  rationale: यह इब्रानी के एकवचन ढाँचे के निकट रहता है और मीकायाह पर अन्य भविष्यद्वक्ताओं में से किसी के अनुकूल कथन के अनुरूप बोलने का दबाव दिखाता है।
- source_word: וְדִבַּרְתָּ טּוֹב
  choice: आप भी राजा के पक्ष में बोलिए
  rationale: यहाँ ‘अच्छा बोलना’ पिछले खंड के अनुसार राजा के अनुकूल बोलना है। हिन्दी में अर्थ स्पष्ट करने के लिए उस संदर्भ को दोहराया गया है।
