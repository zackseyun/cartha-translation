source:
  edition: WLC
  text: וְ/יֶ֨תֶר֙ הַ/קָּדֵ֔שׁ אֲשֶׁ֣ר נִשְׁאַ֔ר בִּ/ימֵ֖י אָסָ֣א אָבִ֑י/ו בִּעֵ֖ר מִן הָ/אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/047.yaml
  text: And he removed from the land the rest of the cult prostitutes who remained in the days of Asa his father[a].
translation:
  language: hi
  text: और उसने धार्मिक वेश्यावृत्ति से जुड़े उन लोगों को, जो उसके पिता आसा के दिनों में बचे रह गए थे, देश से निकाल दिया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְיֶתֶר
  choice: और ... बाकी
  rationale: יֶתֶר शेष बचे हुए लोगों को सूचित करता है; ‘बाकी’ आधुनिक हिन्दी में सहज है और शेषांश का भाव बनाए रखता है।
- source_word: הַקָּדֵשׁ
  choice: पूजा-पंथ के वेश्या
  rationale: इस प्रसंग में קָדֵשׁ निषिद्ध उपासना-पद्धति से जुड़े पुरुष यौन-कर्मी को सूचित करता है। यह अनुवाद धार्मिक-सांप्रदायिक संदर्भ और वेश्यावृत्ति—दोनों को व्यक्त करता है; पुल्लिंग की जानकारी पादटिप्पणी में स्पष्ट की गई है।
- source_word: אֲשֶׁר נִשְׁאַר
  choice: जो ... बचे रह गए थे
  rationale: यह प्रयोग पहले के समय से अब तक शेष रहने की परिणामात्मक स्थिति को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: בִּימֵי אָסָא אָבִיו
  choice: उसके पिता आसा के दिनों से
  rationale: यह पद उस पूर्व समय को बताता है जिससे ये लोग बचे रह गए थे। प्रसंगगत निरंतरता के कारण हिन्दी में ‘से’ स्वाभाविक और स्पष्ट है।
- source_word: בִּעֵר
  choice: उसने ... निकाल दिया
  rationale: यहाँ क्रिया देश से हटाने या दूर करने के अर्थ में है। ‘निकाल दिया’ विधि को अनावश्यक रूप से जलाने या मार डालने के रूप में निश्चित नहीं करता।
- source_word: מִן הָאָרֶץ
  choice: देश से
  rationale: प्रसंग में הָאָרֶץ समूची पृथ्वी नहीं, शासित भूभाग को सूचित करता है; इसलिए ‘देश से’ उपयुक्त है।
theological_decisions:
- issue: नैतिक और सांस्कृतिक रूप से संवेदनशील קָדֵשׁ का अनुवाद
  choice: पूजा-पंथ के वेश्या
  alternative: पुरुष पूजा-पंथी वेश्या; देवदास; सदोमी
  rationale: चुना हुआ रूप निषिद्ध उपासना और यौन-सेवा के संबंध को व्यक्त करता है, पर बाद की परंपरागत या साम्प्रदायिक शब्दावली आरोपित नहीं करता। इब्रानी शब्द का व्याकरणिक पुल्लिंग पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘पूजा-पंथ’ से अवैध धार्मिक उपासना का संदर्भ प्रकट होता है, जबकि ‘देश से निकाल दिया’ क्रिया की विधि के विषय में मूल पाठ से अधिक दावा नहीं करता।
