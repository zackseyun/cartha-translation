source:
  edition: WLC
  text: וַ/יֵּ֗לֶךְ בְּ/כָל דֶּ֛רֶךְ אָסָ֥א אָבִ֖י/ו לֹא סָ֣ר מִמֶּ֑/נּוּ לַ/עֲשׂ֥וֹת הַ/יָּשָׁ֖ר בְּ/עֵינֵ֥י יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/043.yaml
  text: He walked in all the ways of Asa his father[a]; he did not turn aside from them[b], doing what was right in the eyes of Yahweh.
translation:
  language: hi
  text: वह अपने पिता आसा के पूरे मार्ग पर चला[a]; वह उससे नहीं मुड़ा और वही करता था जो यहोवा की दृष्टि में ठीक था[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वह अपने पिता आसा के हर मार्ग पर चला” अथवा “उसने अपने पिता आसा के पूरे चाल-चलन का अनुसरण किया।”
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “यहोवा की आँखों में”; यह इब्रानी मुहावरा यहोवा की दृष्टि अथवा मूल्यांकन को दर्शाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: वह ... चला
  rationale: הלך का मूल अर्थ ‘चलना/जाना’ है; यहाँ राजकीय आचरण के रूपक में ‘चला’ मार्ग की छवि और जीवन-व्यवहार दोनों को बनाए रखता है।
- source_word: בְּכָל דֶּרֶךְ
  choice: पूरे मार्ग पर
  rationale: मसोराई पाठ में דֶּרֶךְ एकवचन है। ‘पूरे मार्ग पर’ हिंदी में स्वाभाविक रहते हुए आसा के संपूर्ण आचरण-पथ का भाव देता है।
- source_word: אָסָא אָבִיו
  choice: अपने पिता आसा के
  rationale: यह संबंध को स्पष्ट और आधुनिक हिंदी के स्वाभाविक शब्दक्रम में व्यक्त करता है।
- source_word: לֹא סָר מִמֶּנּוּ
  choice: वह उससे न मुड़ा
  rationale: סור के ‘मुड़ना/हटना’ अर्थ और पहले आए मार्ग-रूपक को सुरक्षित रखा गया है; एकवचन प्रत्यय को ‘उससे’ द्वारा उसी मार्ग से जोड़ा गया है।
- source_word: לַעֲשׂוֹת
  choice: करता रहा
  rationale: प्रसंग में यह आचरण की निरंतरता व्यक्त करता है। हिंदी वाक्य में ‘और ... करता रहा’ उद्देश्य/परिणाम संबंध को स्वाभाविक ढंग से प्रस्तुत करता है, बिना उसे आवश्यकता से अधिक निश्चित किए।
- source_word: הַיָּשָׁר
  choice: जो ... ठीक था
  rationale: עשה הישר का सामान्य अर्थ ‘जो ठीक/सही है उसे करना’ है; ‘ठीक’ साधारण पाठक के लिए सहज और मूल्यांकनात्मक भाव में सटीक है।
- source_word: בְּעֵינֵי יְהוָה
  choice: यहोवा की दृष्टि में
  rationale: शाब्दिक ‘यहोवा की आँखों में’ के स्थान पर प्रचलित हिंदी मुहावरा चुना गया है, जो परमेश्वर के मूल्यांकन का आशय स्पष्ट करता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: चार अक्षरों वाले इब्रानी दिव्य नाम को उपाधि से बदलने के बजाय हिंदी में प्रचलित नामरूप ‘यहोवा’ से व्यक्त किया गया है।
theological_decisions:
- issue: राजा के आचरण का मूल्यांकन
  choice: पद यह कहता है कि उसने अपने पिता आसा के आचरण-पथ का अनुसरण किया और वही किया जो यहोवा की दृष्टि में ठीक था।
  alternative: इसे सामान्य रूप से ‘वह एक विश्वासयोग्य राजा था’ कहकर व्याख्यात्मक ढंग से संक्षिप्त किया जा सकता था।
  rationale: मूल पाठ के मार्ग-रूपक और यहोवा द्वारा नैतिक मूल्यांकन को बनाए रखा गया है; पाठ में स्पष्ट न किए गए व्यापक धार्मिक निष्कर्ष नहीं जोड़े गए।
- issue: לַעֲשׂוֹת का वाक्यगत संबंध
  choice: इसे पिछले कथन से जुड़ी निरंतर क्रिया के रूप में ‘और ... करता रहा’ कहा गया है।
  alternative: इसे स्पष्ट उद्देश्य के रूप में ‘ताकि वह ... करे’ अनूदित किया जा सकता है।
  rationale: इब्रानी infinitive उद्देश्य अथवा परिणामी आचरण दोनों की छाया रख सकता है। चुना हुआ रूप हिंदी में सहज है और संबंध को अनावश्यक रूप से केवल उद्देश्य तक सीमित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘चला’ और ‘मुड़ा’ से मूल का मार्ग-रूपक सुरक्षित है। एकवचन ‘मार्ग’ और ‘उससे’ WLC के व्याकरण के अनुरूप हैं।
