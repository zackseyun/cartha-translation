source:
  edition: WLC
  text: וַ/יֹּ֗אמֶר אֵצֵא֙ וְ/הָיִ֨יתִי֙ ר֣וּחַ שֶׁ֔קֶר בְּ/פִ֖י כָּל נְבִיאָ֑י/ו וַ/יֹּ֗אמֶר תְּפַתֶּה֙ וְ/גַם תּוּכָ֔ל צֵ֖א וַ/עֲשֵׂה כֵֽן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/022.yaml
  text: And he said[a], ‘I will go out and be a lying spirit in the mouth of all his prophets.’ And he said, ‘You will entice him, and you will also prevail[b]. Go out and do so.’
translation:
  language: hi
  text: तब उसने कहा, “मैं निकलूँगा और उसके सभी नबियों के मुँह में झूठ की आत्मा[a] बनूँगा।” उसने कहा, “तू उसे बहकाएगा[b] और सफल भी होगा। जा और ऐसा ही कर।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “असत्य की आत्मा।”
    reason: lexical_alternative
  - marker: b
    text: “बहकाएगा” का अनुवाद “फुसलाएगा,” “धोखा देगा” या “मनाएगा” भी हो सकता है। इब्रानी क्रिया प्रसंग के अनुसार बहकाने, मनाने या धोखा देने का भाव व्यक्त कर सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵצֵא
  choice: मैं निकलकर
  rationale: יצא के प्रथम पुरुष एकवचन रूप में प्रस्तावित भावी कार्य है; ‘निकलकर’ स्वाभाविक हिन्दी में गति और अगले कार्य का संबंध बनाए रखता है।
- source_word: וְהָיִיתִי רוּחַ שֶׁקֶר
  choice: झूठ बोलने वाली आत्मा बनूँगा
  rationale: היה यहाँ भूमिका ग्रहण करने का भाव देता है और רוּחַ שֶׁקֶר झूठ से चरितार्थ आत्मा को सूचित करता है; यह हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: בְּפִי כָּל נְבִיאָיו
  choice: उसके सब नबियों के मुँह में
  rationale: मूल ‘मुँह में’ वाली वाणी-संबंधी इब्रानी उपमा को बनाए रखा गया है और प्रत्यय का संबंध ‘उसके’ से व्यक्त किया गया है।
- source_word: תְּפַתֶּה
  choice: तू उसे बहकाएगा
  rationale: פתה के पिएल रूप में फुसलाने, मनाने या धोखे से प्रेरित करने का अर्थ हो सकता है; विनाशकारी दिशा में ले जाने के इस प्रसंग में ‘बहकाना’ इस अर्थ-परास को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וְגַם תּוּכָל
  choice: और सफल भी होगा
  rationale: יכל यहाँ केवल क्षमता नहीं, प्रस्तावित कार्य को पूरा कर पाने और परिणाम पाने का आश्वासन देता है; ‘सफल भी होगा’ वर्तमान हिन्दी में इसे स्पष्ट करता है।
- source_word: צֵא וַעֲשֵׂה כֵן
  choice: जा और ऐसा ही कर
  rationale: दोनों आज्ञार्थक रूपों और כן के पूर्वकथित ढंग के संकेत को संक्षिप्त, प्रत्यक्ष हिन्दी में सुरक्षित रखा गया है।
theological_decisions:
- issue: छल से जुड़े स्वर्गीय संवाद में अनुमति या आदेश
  choice: आत्मा का प्रस्ताव और उसके बाद दिया गया प्रत्यक्ष आदेश ज्यों का त्यों रखा गया है।
  alternative: भाषा को नरम करके इसे केवल निष्क्रिय अनुमति के रूप में प्रस्तुत करना।
  rationale: इब्रानी पाठ में आत्मा प्रस्ताव रखती है और उसे ‘जा और ऐसा ही कर’ कहा जाता है। ईश्वरीय प्रभुता और माध्यमिक कर्तृत्व के तनाव को अनुवाद में सुलझाने या कम करने के बजाय सुरक्षित रखना चाहिए।
- issue: פתה का अर्थ-परास
  choice: मुख्य पाठ में ‘बहकाएगा’, और पादटिप्पणी में ‘फुसलाएगा’, ‘धोखा देगा’ तथा ‘मनाएगा’।
  alternative: केवल ‘धोखा देगा’ या केवल ‘मनाएगा’।
  rationale: क्रिया प्रसंगानुसार प्रलोभन, मनवाने या छल का अर्थ ले सकती है; मुख्य विकल्प प्रसंगानुकूल है, जबकि पादटिप्पणी वास्तविक शाब्दिक अस्पष्टता बनाए रखती है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, प्रत्यक्ष संवाद के अनुरूप सरल और गरिमापूर्ण रखी गई है। ‘मुँह में’ मूल इब्रानी बिंब को सुरक्षित रखता है। मुख्य पाठ में केवल वास्तविक पाठगत-शाब्दिक अस्पष्टता के लिए पादटिप्पणी दी गई है।
