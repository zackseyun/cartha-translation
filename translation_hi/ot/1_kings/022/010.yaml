  text: וּ/מֶ֣לֶךְ יִשְׂרָאֵ֡ל וִֽ/יהוֹשָׁפָ֣ט מֶֽלֶךְ יְהוּדָ֡ה יֹשְׁבִים֩ אִ֨ישׁ עַל כִּסְא֜/וֹ מְלֻבָּשִׁ֤ים בְּגָדִים֙ בְּ/גֹ֔רֶן פֶּ֖תַח שַׁ֣עַר שֹׁמְר֑וֹן וְ/כָ֨ל הַ/נְּבִיאִ֔ים מִֽתְנַבְּאִ֖ים לִ/פְנֵי/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/010.yaml
  text: The king of Israel and Jehoshaphat king of Judah were sitting[a], each on his throne, clothed in garments, at the threshing floor at the entrance of the gate of Samaria, and all the prophets were prophesying before them.
translation:
  language: hi
  text: इस्राएल का राजा और यहूदा का राजा यहोशापात, दोनों सामरिया के फाटक के प्रवेश-स्थान पर स्थित खलिहान में अपने-अपने सिंहासन पर वस्त्र पहने हुए[a] बैठे थे, और सभी भविष्यद्वक्ता उनके सामने भविष्यवाणी कर रहे थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “राजसी वस्त्र पहने हुए।” इब्रानी में केवल “वस्त्र पहने हुए” है; राजकीय परिवेश से विशेष या राजसी पोशाक का संकेत मिल सकता है, पर यह स्पष्ट रूप से नहीं कहा गया।
    reason: शाब्दिक अर्थ और संदर्भ से संभव अर्थ—दोनों को अलग रखते हुए अनावश्यक विशिष्टता से बचाना।
lexical_decisions:
- source_word: וּמֶלֶךְ יִשְׂרָאֵל
  choice: इस्राएल का राजा
  rationale: आरंभिक וְ का संयोजक बल हिंदी वाक्य की अगली संयुक्त संरचना में स्वाभाविक रूप से व्यक्त होता है; अलग से ‘और’ लगाना आवश्यक नहीं।
- source_word: וִיהוֹשָׁפָט מֶלֶךְ יְהוּדָה
  choice: और यहूदा का राजा यहोशापात
  rationale: नाम और राजकीय पदवी को आधुनिक हिंदी के स्वाभाविक क्रम में रखा गया है।
- source_word: יֹשְׁבִים אִישׁ עַל־כִּסְאוֹ
  choice: दोनों ... अपने-अपने सिंहासन पर ... बैठे थे
  rationale: बहुवचन कृदंत चल रही दृश्यात्मक अवस्था बताता है, और אִישׁ का वितरणात्मक अर्थ ‘अपने-अपने’ से स्पष्ट होता है; राजकीय संदर्भ में כִּסֵּא के लिए ‘सिंहासन’ उपयुक्त है।
- source_word: מְלֻבָּשִׁים בְּגָדִים
  choice: वस्त्र पहने हुए
  rationale: इब्रानी अभिव्यक्ति शाब्दिक रूप से वस्त्र पहने होने की बात कहती है और वस्त्रों को स्पष्टतः ‘राजसी’ नहीं कहती; इसलिए मुख्य पाठ में अतिरिक्त विशेषण नहीं जोड़ा गया।
- source_word: בְּגֹרֶן פֶּתַח שַׁעַר שֹׁמְרוֹן
  choice: सामरिया के फाटक के प्रवेश पर स्थित खलिहान में
  rationale: גֹּרֶן का सामान्य हिंदी समतुल्य ‘खलिहान’ है। स्थान-संबंध को स्पष्ट और स्वाभाविक हिंदी में व्यक्त करने के लिए ‘स्थित’ जोड़ा गया है।
- source_word: וְכָל־הַנְּבִיאִים מִתְנַבְּאִים לִפְנֵיהֶם
  choice: और सभी भविष्यद्वक्ता उनके सामने भविष्यवाणी कर रहे थे
  rationale: कृदंत से प्रकट जारी क्रिया को ‘कर रहे थे’ से और לִפְנֵיהֶם को राजकीय उपस्थिति के अर्थ में ‘उनके सामने’ से व्यक्त किया गया है।
