  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। दृश्य की जारी क्रियाओं के लिए ‘बैठे थे’ और ‘भविष्यवाणी कर रहे थे’ प्रयुक्त हुए हैं।
