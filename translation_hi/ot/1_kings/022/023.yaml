source:
  edition: WLC
  text: וְ/עַתָּ֗ה הִנֵּ֨ה נָתַ֤ן יְהוָה֙ ר֣וּחַ שֶׁ֔קֶר בְּ/פִ֖י כָּל נְבִיאֶ֣י/ךָ אֵ֑לֶּה וַֽ/יהוָ֔ה דִּבֶּ֥ר עָלֶ֖י/ךָ רָעָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/023.yaml
  text: And now[a], behold, Yahweh has put a lying spirit in the mouth of all these prophets of yours[b], and Yahweh has spoken disaster against you.
translation:
  language: hi
  text: और अब देख, याहवे ने तेरे इन सब भविष्यद्वक्ताओं के मुँह में झूठ बोलने वाली आत्मा[a] डाल दी है, और याहवे ने तेरे विरुद्ध विपत्ति[b] की बात कही है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अथवा, “झूठ की आत्मा।”
    reason: lexical_alternative
  - marker: b
    text: अथवा, “अनिष्ट।” इब्रानी शब्द न्याय के प्रसंग में विपत्ति, अनिष्ट या हानि का बोध करा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: और अब
  rationale: संयोजक और तात्कालिक संक्रमण—दोनों को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: הִנֵּה
  choice: देख
  rationale: श्रोता का ध्यान गंभीरतापूर्वक खींचता है और आधुनिक हिन्दी में सहज है।
- source_word: נָתַן
  choice: डाल दी है
  rationale: ‘मुँह में आत्मा’ के प्रसंग में यह נָתַן की सक्रिय कारकता को स्पष्ट और स्वाभाविक रूप से व्यक्त करता है; इसे केवल अनुमति देने के अर्थ में नरम नहीं करता।
- source_word: יְהוָה
  choice: याहवे
  rationale: ईश्वर के व्यक्तिगत नाम को नाम के रूप में प्रस्तुत करता है।
- source_word: רוּחַ שֶׁקֶר
  choice: झूठ बोलने वाली आत्मा
  rationale: छल करने वाले व्यक्तिगत कर्ता का भाव स्पष्ट करता है; संबंधवाचक वैकल्पिक अर्थ पादटिप्पणी में सुरक्षित है।
- source_word: בְּפִי
  choice: के मुँह में
  rationale: इब्रानी के एकवचन रूप को समूह के साथ वितरणात्मक मुहावरे के रूप में रखता है और वाणी के स्रोत का चित्र सुरक्षित करता है।
- source_word: כָּל נְבִיאֶיךָ אֵלֶּה
  choice: तेरे इन सब भविष्यद्वक्ताओं
  rationale: द्वितीय पुरुष संबंध, ‘इन’ का संकेतात्मक बल और ‘सब’ की व्यापकता—तीनों को बनाए रखता है।
- source_word: דִּבֶּר עָלֶיךָ רָעָה
  choice: तेरे विरुद्ध विपत्ति की बात कही है
  rationale: निर्णय के प्रसंग में רָעָה को नैतिक बुराई के बजाय आने वाली हानि या विपत्ति के अर्थ में व्यक्त करता है, साथ ही ‘कहा’ की मूल क्रिया को सुरक्षित रखता है।
theological_decisions:
- issue: याहवे की क्रिया और झूठ बोलने वाली आत्मा की कारकता
  choice: याहवे ने ... आत्मा डाल दी है
  alternative: याहवे ने ... आत्मा को आने दिया है
  rationale: मूल पाठ נָתַן द्वारा प्रत्यक्ष ईश्वरीय क्रिया बताता है। अनुवाद इसे केवल अनुमति में बदलकर पाठ के धर्मवैचारिक तनाव को कम नहीं करता।
- issue: याहवे द्वारा कही गई רָעָה का अर्थ
  choice: विपत्ति
  alternative: बुराई; अनिष्ट
  rationale: इस न्याय-संदर्भ में शब्द का आशय अहाब के विरुद्ध आने वाली हानि है, न कि याहवे में नैतिक बुराई ठहराना। ‘विपत्ति’ मूल की गंभीरता और प्रसंगगत अर्थ दोनों रखता है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध हिन्दी। ‘तेरे’ का प्रयोग राजा अहाब को किए गए एकवचन प्रत्यक्ष संबोधन और पद के तीखे, भविष्यद्वाणी-संबंधी स्वर को बनाए रखता है।
