base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/039.yaml
  text: The rest of the acts of Ahab[a], and all that he did, and the ivory house that he built[b], and all the cities that he built—are they not written in the Book of the Chronicles of the Kings of Israel?
translation:
  language: hi
  text: अहाब के बाकी काम, और उसने जो कुछ किया, और हाथीदाँत का भवन[a] जो उसने बनाया, और वे सभी नगर जो उसने बनाए—क्या ये सब ‘इस्राएल के राजाओं के इतिहास की पुस्तक’[b] में लिखे नहीं हैं?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “हाथीदाँत का घर।” सम्भवतः इसका अर्थ ऐसा राजकीय भवन है जिसे हाथीदाँत से सजाया गया था, न कि ऐसा भवन जो पूरी तरह हाथीदाँत से बना था।
    reason: lexical_alternative
  - marker: b
    text: ‘इस्राएल के राजाओं के इतिहास की पुस्तक’ राजाओं की पुस्तक में उद्धृत एक राजकीय अभिलेख-स्रोत है; यह आवश्यक नहीं कि यह बाइबल में शामिल इतिहास-वृत्तांत की पुस्तकों में से ही कोई पुस्तक हो।
    reason: cross_reference
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי אַחְאָב
  choice: अहाब के बाकी काम
  rationale: राजकीय सारांश के इस सूत्र में דִּבְרֵי का अर्थ केवल ‘बातें’ नहीं, बल्कि राजा के काम या कार्य हैं। ‘बाकी काम’ सरल और स्वाभाविक हिन्दी है।
- source_word: וְכָל אֲשֶׁר עָשָׂה
  choice: उसने जो कुछ किया
  rationale: यह עָשָׂה के व्यापक अर्थ को बिना अनावश्यक विशिष्टीकरण के व्यक्त करता है।
- source_word: וּבֵית הַשֵּׁן
  choice: हाथीदाँत का वह भवन
  rationale: यह इब्रानी पद की संरचना और उसकी वास्तविक अस्पष्टता को बनाए रखता है; सम्भवतः आशय हाथीदाँत से सजाए गए राजकीय भवन से है, न कि पूर्णतः हाथीदाँत से बने भवन से।
- source_word: וְכָל הֶעָרִים אֲשֶׁר בָּנָה
  choice: और वे सभी नगर जो उसने बनाए
  rationale: עָרִים का सामान्य अर्थ ‘नगर’ है और בָּנָה को सीधे ‘बनाए’ कहा गया है।
- source_word: הֲלוֹא הֵם כְּתוּבִים
  choice: क्या ये सब ... में लिखे नहीं हैं?
  rationale: הֲלוֹא सकारात्मक उत्तर की अपेक्षा रखने वाला आलंकारिक प्रश्न प्रस्तुत करता है; ‘ये सब’ सूची की सभी बातों को स्पष्ट रूप से समेटता है।
- source_word: סֵפֶר דִּבְרֵי הַיָּמִים לְמַלְכֵי יִשְׂרָאֵל
  choice: ‘इस्राएल के राजाओं के इतिहास की पुस्तक’
  rationale: यह राजकीय अभिलेख-स्रोत का स्वाभाविक हिन्दी शीर्षक है। ‘इतिहास’ דִּבְרֵי הַיָּמִים के वार्षिक या ऐतिहासिक वृत्तांत के भाव को व्यक्त करता है, जबकि पाद-टिप्पणी इसे बाइबल की ‘इतिहास’/‘इतिहास-वृत्त’ पुस्तक से स्वतः एक मान लेने से रोकती है।
