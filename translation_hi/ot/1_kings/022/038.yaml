source:
  edition: WLC
  text: וַ/יִּשְׁטֹ֨ף אֶת הָ/רֶ֜כֶב עַ֣ל בְּרֵכַ֣ת שֹׁמְר֗וֹן וַ/יָּלֹ֤קּוּ הַ/כְּלָבִים֙ אֶת דָּמ֔/וֹ וְ/הַ/זֹּנ֖וֹת רָחָ֑צוּ כִּ/דְבַ֥ר יְהוָ֖ה אֲשֶׁ֥ר דִּבֵּֽר־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/038.yaml
  text: And they washed the chariot at the pool of Samaria[a], and the dogs licked up his blood, and the prostitutes washed there, according to the word of Yahweh that he had spoken.
translation:
  language: hi
  text: रथ को सामरिया के तालाब के पास धोया गया। कुत्तों ने उसका खून चाट लिया, और वेश्याएँ वहाँ नहाईं[a], याहवे के उस वचन के अनुसार जो उसने कहा था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वेश्याओं ने अपने को धोया” अथवा “वहाँ धोया।” इब्रानी क्रिया का कर्म स्पष्ट नहीं किया गया है और उसका अर्थ ‘धोना’ या ‘नहाना’ हो सकता है।
    reason: मूल इब्रानी רָחָצוּ में कर्म अनुल्लिखित है। मुख्य पाठ में स्वाभाविक हिंदी ‘नहाईं’ है, जबकि पादटिप्पणी कर्मरहित ‘धोया’ और आत्मवाचक अर्थ की संभावनाएँ सुरक्षित रखती है।
lexical_decisions:
- source_word: וַיִּשְׁטֹף אֶת־הָרֶכֶב
  choice: रथ को धोया गया
  rationale: क्रिया व्याकरणतः एकवचन पुल्लिंग है, पर कर्ता अनिर्दिष्ट है। हिंदी का कर्मवाच्य अनाम धोने वालों का भाव स्वाभाविक रूप से व्यक्त करता है और किसी विशेष व्यक्ति को नहीं जोड़ता।
- source_word: עַל בְּרֵכַת שֹׁמְרוֹן
  choice: सामरिया के तालाब के पास
  rationale: यहाँ עַל स्थान-संबंध बताता है; ‘के पास’ दृश्य को स्वाभाविक आधुनिक हिंदी में व्यक्त करता है।
- source_word: וַיָּלֹקּוּ הַכְּלָבִים אֶת־דָּמוֹ
  choice: कुत्तों ने उसका खून चाट लिया
  rationale: לָקַק चाटने या चपचपाकर पीने को सूचित करता है। ‘चाट लिया’ पूर्ण हुई सजीव क्रिया को स्वाभाविक हिंदी में रखता है।
- source_word: וְהַזֹּנוֹת
  choice: और वेश्याओं ने
  rationale: זוֹנוֹת का आधुनिक और सीधा अर्थ ‘वेश्याएँ’ है; पुरातन या अपमान को अनावश्यक रूप से बढ़ाने वाले विकल्पों से बचा गया है।
- source_word: רָחָצוּ
  choice: वहाँ धोया
  rationale: मूल इब्रानी में क्रिया का कर्म व्यक्त नहीं है और उसका अर्थ ‘धोना’ या ‘नहाना’ हो सकता है। जानबूझकर संक्षिप्त हिंदी और पादटिप्पणी इस अस्पष्टता को बनाए रखते हैं।
- source_word: כִּדְבַר יְהוָה אֲשֶׁר דִּבֵּר
  choice: इस तरह याहवे का वह वचन पूरा हुआ जो उसने कहा था
  rationale: כִּדְבַר का फलितार्थ भविष्यवाणी के अनुरूप घटना का होना है। ‘वचन पूरा हुआ’ संबंध को स्पष्ट और स्वाभाविक बनाता है, जबकि ‘जो उसने कहा था’ पूर्व कथन को बनाए रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: प्रभु / यहोवा
  rationale: मूल पाठ में वाचा का व्यक्तिगत नाम है; उसका लिप्यंतरण नाम को सामान्य उपाधि में बदलने से बचाता है।
- issue: וְהַזֹּנוֹת רָחָצוּ की व्याख्या
  choice: वेश्याओं ने वहाँ धोया
  alternative: वेश्याएँ वहाँ नहाईं / वेश्याओं ने अपने को धोया
  rationale: इब्रानी में वेश्याएँ क्रिया की कर्ता हैं, पर कर्म नहीं दिया गया। मुख्य पाठ किसी कर्म को जोड़ता नहीं; पादटिप्पणी संभावित आत्मवाचक या स्नान संबंधी अर्थ बताती है।
- issue: भविष्यवाणी की पूर्ति का संबंध
  choice: इस तरह ... वचन पूरा हुआ
  alternative: याहवे के उस वचन के अनुसार जो उसने कहा था
  rationale: वाक्य घटना को पहले बोले गए ईश्वरीय वचन से जोड़ता है। स्वाभाविक हिंदी में पूर्ति स्पष्ट की गई है, बिना यह बदले कि वचन पहले याहवे ने कहा था।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। अनिर्दिष्ट कर्ता के लिए हिंदी कर्मवाच्य प्रयुक्त है। अंतिम कठिन उपवाक्य को अत्यधिक सहज बनाकर उसकी अस्पष्टता मिटाने के बजाय संक्षिप्त रखा गया और पादटिप्पणी से विकल्प दिए गए हैं।
