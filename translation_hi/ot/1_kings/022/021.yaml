  edition: WLC
  text: וַ/יֵּצֵ֣א הָ/ר֗וּחַ וַֽ/יַּעֲמֹד֙ לִ/פְנֵ֣י יְהוָ֔ה וַ/יֹּ֖אמֶר אֲנִ֣י אֲפַתֶּ֑/נּוּ וַ/יֹּ֧אמֶר יְהוָ֛ה אֵלָ֖י/ו בַּ/מָּֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/021.yaml
  text: Then the spirit came forward and stood before Yahweh and said[a], ‘I will entice him.’ And Yahweh said to him[b], ‘By what means?’
translation:
  language: hi
  text: तब वह आत्मिक प्राणी[a] आगे आया और यहोवा के सामने खड़ा होकर बोला, “मैं उसे बहकाऊँगा।” यहोवा ने उससे पूछा, “किस उपाय से?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से “वह आत्मा।” यहाँ संभवतः स्वर्गीय सभा के एक विशिष्ट आत्मिक प्राणी की बात है; इसका पवित्र आत्मा होना आवश्यक नहीं।
    reason: alternative_reading
lexical_decisions:
- source_word: הָרוּחַ
  choice: वह आत्मिक प्राणी
  rationale: संदर्भ में यह स्वर्गीय सभा का एक विशिष्ट आत्मिक व्यक्तित्व है। केवल ‘आत्मा’ से हिन्दी पाठक पवित्र आत्मा समझ सकता है; ‘आत्मिक प्राणी’ व्यक्तिगत सत्ता को स्पष्ट करता है, और ‘वह’ इब्रानी निश्चित पदबंध को दर्शाता है।
- source_word: וַיֵּצֵא
  choice: आगे आया
  rationale: सभा-जैसे दृश्य में क्रिया का आशय समूह में से निकलकर प्रस्ताव रखने के लिए आगे आने से है।
- source_word: וַיַּעֲמֹד לִפְנֵי
  choice: के सामने खड़ा होकर
  rationale: यह वरिष्ठ सत्ता की उपस्थिति में औपचारिक रूप से खड़े होने का स्वाभाविक और निकट हिन्दी रूप है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: इब्रानी व्यक्तिगत ईश्वरीय नाम को उपाधि से बदलने के बजाय हिन्दी में प्रचलित लिप्यंतरण से प्रस्तुत किया गया है।
- source_word: אֲפַתֶּנּוּ
  choice: मैं उसे बहकाऊँगा
  rationale: पिएल रूप यहाँ अहाब को विनाशकारी निर्णय की ओर फुसलाने या बहकाने का भाव रखता है। ‘बहकाऊँगा’ प्रेरण और छल की संभाव्यता को बनाए रखता है; अगला पद साधन स्पष्ट करता है।
- source_word: בַּמָּה
  choice: किस उपाय से?
  rationale: प्रश्न कार्य की रीति या साधन पूछता है; यह रूप स्वाभाविक हिन्दी में उस अर्थ को स्पष्ट रखता है।
theological_decisions:
- issue: स्वर्गीय सभा में הָרוּחַ की पहचान
  choice: एक विशिष्ट आत्मिक प्राणी, पर पवित्र आत्मा के रूप में निश्चित नहीं
  alternative: ‘आत्मा’ अथवा ‘एक आत्मा’
  rationale: वर्णन स्वर्गीय समूह के एक सदस्य को आगे आकर प्रस्ताव देते दिखाता है। ‘पवित्र आत्मा’ कहना मूल से अधिक निश्चित होगा, जबकि सर्वथा अनिश्चित ‘एक आत्मा’ निश्चित उपपद को कम कर देगा।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और कथात्मक रखी गई है। ‘आत्मिक प्राणी’ साधारण हिन्दी पाठक के लिए व्यक्तिगत स्वर्गीय सत्ता का भाव स्पष्ट करता है और ‘पवित्र आत्मा’ की अनावश्यक पहचान से बचाता है।
