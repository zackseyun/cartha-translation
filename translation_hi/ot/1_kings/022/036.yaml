  text: And a cry passed through the camp at sunset[a], saying, “Each man to his city[b], and each man to his land!”
translation:
  language: hi
  text: 'सूर्यास्त के समय छावनी में एक पुकार फैल गई[a]: “हर आदमी अपने नगर को और हर आदमी अपनी भूमि को जाए!”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “एक ऊँची पुकार” अथवा “एक घोषणा छावनी में फैल गई।” इब्रानी शब्द रिन्नाह ऊँची पुकार या गूँजते उद्घोष को दर्शा सकता है; यहाँ आशय पूरी छावनी में की गई घोषणा से है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “हर आदमी अपने नगर को और हर आदमी अपनी भूमि को!” इब्रानी में क्रियापद व्यक्त नहीं है; हिन्दी में वाक्य को स्वाभाविक बनाने के लिए ‘जाए’ जोड़ा गया है। यह युद्ध के बाद सेना को विदा करने का प्रचलित सूत्र है।
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּעֲבֹר
  choice: फैल गई
  rationale: עבר यहाँ पुकार के पूरी छावनी में पहुँचने को व्यक्त करता है; ‘फैल गई’ आधुनिक हिन्दी में स्वाभाविक रूप से इस गति और प्रसार दोनों को बताता है।
- source_word: הָרִנָּה
  choice: यह पुकार
  rationale: רִנָּה ऊँची पुकार या उद्घोष को सूचित कर सकता है। प्रसंग में यह आनन्द का जयघोष नहीं, बल्कि युद्ध समाप्त करने की छावनी-व्यापी घोषणा है; इसलिए ‘पुकार’ तटस्थ और उपयुक्त है।
- source_word: בַּמַּחֲנֶה
  choice: छावनी में
  rationale: पूर्वसर्ग का मूल अर्थ ‘में’ है; ‘फैल गई’ के साथ यह स्वाभाविक हिन्दी में पूरी छावनी में प्रसार का भाव देता है।
- source_word: כְּבֹא הַשֶּׁמֶשׁ
  choice: सूर्यास्त के समय
  rationale: ‘सूर्य के आने/प्रवेश करने पर’ का यह इब्रानी मुहावरा सूर्यास्त को सूचित करता है।
- source_word: לֵאמֹר
  choice: —उद्धरण द्वारा व्यक्त
  rationale: हिन्दी में पुकार के बाद सीधे उद्धरण देना ‘कहते हुए’ की अपेक्षा अधिक स्वाभाविक है और आशय को पूर्णतः सुरक्षित रखता है।
- source_word: אִישׁ ... וְאִישׁ
  choice: हर पुरुष ... और हर पुरुष
  rationale: दोहराया हुआ אִישׁ वितरणात्मक बल देता है। सैन्य प्रसंग में संबोधन युद्धरत पुरुषों से है, इसलिए लिंग-सटीक ‘पुरुष’ रखा गया है और समानांतरता भी बची है।
- source_word: אֶל עִירוֹ
  choice: अपने नगर को
  rationale: עִיר का सीधा अर्थ ‘नगर’ है; ‘अपने’ इब्रानी प्रत्यय ‘उसका/अपना’ को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וְאִישׁ אֶל אַרְצוֹ
  choice: और हर पुरुष अपने देश को
  rationale: אֶרֶץ यहाँ अपने गृह-प्रदेश या देश को सूचित करता है। ‘देश’ हिन्दी में इस वापसी-सूत्र के लिए स्वाभाविक है, यद्यपि ‘भूमि’ भी शाब्दिक विकल्प है।
- source_word: אֶל ... אֶל
  choice: लौट जाए
  rationale: मूल में केवल दिशासूचक ‘को/की ओर’ है, पर यह युद्ध के बाद विदा होकर घर लौटने का सूत्र है। हिन्दी में पूर्ण और स्वाभाविक आदेश के लिए ‘लौट जाए’ जोड़ा गया है।
