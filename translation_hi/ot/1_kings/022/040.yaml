base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/040.yaml
  text: And Ahab slept with his fathers[a], and Ahaziah his son became king in his place.
translation:
  language: hi
  text: अहाब अपने पुरखाओं के साथ सो गया[a], और उसका पुत्र अहज्याह उसके स्थान पर राजा हुआ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक रूप से: “अपने पुरखाओं के साथ सो गया”; यह राजाओं की मृत्यु बताने वाला एक प्रचलित इब्रानी वाक्यांश है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁכַּב
  choice: सो गया
  rationale: इब्रानी राजकीय मृत्यु-सूत्र की रूपकात्मक भाषा को बनाए रखता है; यहाँ इसका अर्थ मृत्यु है, जिसे पाद-टिप्पणी स्पष्ट करती है।
- source_word: עִם אֲבֹתָיו
  choice: अपने पुरखाओं के साथ
  rationale: मृत पूर्वजों से जुड़ने वाले मानक राजकीय सूत्र का वंशगत भाव सुरक्षित रखता है; आधुनिक हिन्दी में ‘पुरखाओं’ स्वाभाविक और गरिमापूर्ण है।
- source_word: וַיִּמְלֹךְ
  choice: राजा हुआ
  rationale: चल रहे शासन के बजाय राजसिंहासन पर उत्तराधिकार ग्रहण करने की घटना व्यक्त करता है।
- source_word: תַּחְתָּיו
  choice: उसके स्थान पर
  rationale: उसी राजकीय पद पर उत्तराधिकार का सीधा और स्वाभाविक हिन्दी रूप है।
- source_word: אַחְאָב
  choice: अहाब
  rationale: नाम का प्रचलित हिन्दी बाइबलीय लिप्यंतरण।
- source_word: אֲחַזְיָהוּ
  choice: अहज्याह
  rationale: इब्रानी नाम का प्रचलित हिन्दी बाइबलीय लिप्यंतरण।
- source_word: בְנוֹ
  choice: उसका पुत्र
  rationale: वंशगत उत्तराधिकार के स्पष्ट उल्लेख को सुरक्षित रखता है।
