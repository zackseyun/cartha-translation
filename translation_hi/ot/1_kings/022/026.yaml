base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/026.yaml
  text: Then the king of Israel said[a], “Take Micaiah and return him to Amon, the governor of the city, and to Joash the king’s son.”
translation:
  language: hi
  text: तब इस्राएल के राजा ने कहा, “मीकायाह को ले जाओ और उसे नगर के अधिकारी[a] आमोन और राजा के पुत्र योआश के पास वापस ले जाओ।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “नगर के प्रधान” या “नगर के सेनापति।” इब्रानी पद किसी प्रमुख नागरिक अथवा सैनिक अधिकारी को सूचित कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: तब ... ने कहा
  rationale: वाव-क्रमिक कथा को आगे बढ़ाता है; ‘तब’ आधुनिक हिन्दी में घटनाक्रम को स्वाभाविक रूप से व्यक्त करता है।
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: इस्राएल के राजा
  rationale: मूल पाठ व्यक्ति का नाम नहीं, उसकी पदवी देता है; इसलिए पदवी को ही रखा गया है।
- source_word: קַח
  choice: ले जाओ
  rationale: לקח का सामान्य अर्थ ‘लेना’ है; प्रसंग के अनुरूप हिन्दी में गंतव्य की ओर ले जाने के लिए ‘ले जाओ’ स्वाभाविक है, जबकि ‘पकड़ लो’ अनावश्यक रूप से बल-प्रयोग का भाव जोड़ता।
- source_word: מִיכָיְהוּ
  choice: मीकायाह
  rationale: इब्रानी व्यक्तिगत नाम का प्रचलित हिन्दी लिप्यंतरण।
- source_word: וַהֲשִׁיבֵהוּ
  choice: उसे ... वापस ले जाओ
  rationale: שׁוב के हिफ़ील रूप का अर्थ यहाँ किसी को लौटाना या वापस ले जाना है; यह अनुवाद उस कारक भाव को स्पष्ट रखता है।
- source_word: אָמֹן
  choice: आमोन
  rationale: इब्रानी व्यक्तिगत नाम का हिन्दी लिप्यंतरण।
- source_word: שַׂר הָעִיר
  choice: नगर के अधिकारी
  rationale: שַׂר किसी प्रमुख नागरिक, प्रशासनिक या सैनिक पदाधिकारी को सूचित कर सकता है। ‘अधिकारी’ अनिश्चित पद-स्वरूप को बनाए रखते हुए सामान्य पाठक के लिए सहज है।
- source_word: יוֹאָשׁ
  choice: योआश
  rationale: इब्रानी व्यक्तिगत नाम का प्रचलित हिन्दी लिप्यंतरण।
- source_word: בֶּן הַמֶּלֶךְ
  choice: राजा के पुत्र
  rationale: मूल संबंधवाचक पदबंध का सीधा और स्वाभाविक हिन्दी रूप; ‘राजकुमार’ कहने से एक औपचारिक पदवी जुड़ सकती थी जो मूल में स्पष्ट नहीं है।
