base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/018.yaml
  text: Then the king of Israel said to Jehoshaphat[a], “Did I not tell you that he would not prophesy good concerning me, but only evil?”
translation:
  language: hi
  text: तब इस्राएल के राजा ने यहोशापात से कहा, “क्या मैंने तुमसे नहीं कहा था कि वह मेरे विषय में भलाई की नहीं, बल्कि केवल बुराई[a] की भविष्यवाणी करेगा?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “विपत्ति की।” इब्रानी में शाब्दिक रूप से “भलाई ... केवल बुराई” है; यहाँ यह तीखा विरोध प्रतिकूल या विपत्तिपूर्ण भविष्यवाणी का संकेत दे सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: तब ... ने कहा
  rationale: वाव-क्रमवाचक कथा को आगे बढ़ाता है; आधुनिक हिन्दी में “तब” घटनाक्रम को स्वाभाविक रूप से व्यक्त करता है।
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: इस्राएल के राजा
  rationale: मूल के पदनाम को बनाए रखा गया है; वक्ता का नाम ‘अहाब’ पाठ में नहीं जोड़ा गया।
- source_word: אֶל יְהוֹשָׁפָט
  choice: यहोशापात से
  rationale: सम्बोधन को स्वाभाविक हिन्दी में व्यक्त करता है; मूल की तरह कोई अतिरिक्त राजकीय उपाधि नहीं जोड़ी गई।
- source_word: הֲלוֹא אָמַרְתִּי אֵלֶיךָ
  choice: क्या मैंने तुमसे नहीं कहा था
  rationale: नकारात्मक आलंकारिक प्रश्न और राजा के उलाहने के स्वर, दोनों को सहज हिन्दी में सुरक्षित रखता है।
- source_word: לֹא יִתְנַבֵּא
  choice: भविष्यवाणी करेगा
  rationale: पूर्व कथन के दृष्टिकोण से अपेक्षित भावी व्यवहार को दर्शाता है; हिन्दी में मुख्य नकार “भलाई की नहीं” के साथ स्वाभाविक रूप से जुड़ता है।
- source_word: עָלַי
  choice: मेरे विषय में
  rationale: भविष्यवाणी के विषय या सम्बन्ध को औपचारिक किंतु सुबोध हिन्दी में व्यक्त करता है।
- source_word: טוֹב
  choice: भलाई
  rationale: संज्ञात्मक रूप में प्रयुक्त विशेषण और רָע के साथ मूल विरोध को बनाए रखता है।
- source_word: כִּי אִם
  choice: केवल
  rationale: नकार के बाद अनन्य, तीखे विरोध को स्पष्ट करता है।
- source_word: רָע
  choice: बुराई
  rationale: “भलाई ... बुराई” के मूल शब्दगत विरोध को सीधे सुरक्षित रखता है; प्रसंग में ‘विपत्ति’ सम्भव अर्थ है, जिसे पादटिप्पणी में रखा गया है।
theological_decisions:
- issue: भविष्यवाणी के प्रसंग में רָע का अर्थ
  choice: बुराई
  alternative: विपत्ति
  rationale: “भलाई ... बुराई” मूल के तीखे विलोम को बनाए रखता है और अर्थ को चुपचाप केवल विपत्ति तक सीमित नहीं करता। चूँकि यहाँ प्रतिकूल या विनाशकारी भविष्यवाणी अभिप्रेत हो सकती है, उस सम्भावना को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी; गरिमापूर्ण, सहज कथात्मक शैली। ‘भलाई ... बुराई’ द्वारा इब्रानी का शब्दगत और धर्मवैचारिक तनाव सुरक्षित रखा गया है।
