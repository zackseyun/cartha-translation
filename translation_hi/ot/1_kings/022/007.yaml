reference: 1 Kings 22:7
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר֙ יְה֣וֹשָׁפָ֔ט הַ/אֵ֨ין פֹּ֥ה נָבִ֛יא לַ/יהוָ֖ה ע֑וֹד וְ/נִדְרְשָׁ֖ה מֵ/אוֹתֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/007.yaml
  text: But Jehoshaphat said[a], “Is there not still here a prophet of Yahweh, that we may inquire of him?”
translation:
  language: hi
  text: पर यहोशापात ने कहा, “क्या यहाँ अब भी यहोवा का कोई नबी नहीं है[a], जिससे हम पूछें?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “क्या यहाँ यहोवा का कोई और नबी नहीं है, जिससे हम पूछें?”
    reason: עוֹד का अर्थ ‘अब भी’ के साथ-साथ प्रसंग में पहले बुलाए गए नबियों से अतिरिक्त ‘कोई और’ भी समझा जा सकता है।
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: पर ... ने कहा
  rationale: वाव-क्रम कथा को आगे बढ़ाता है; पिछले प्रसंग में अन्य भविष्यद्वक्ताओं के उत्तर से यहोशापात की असंतुष्टि और विरोध स्पष्ट करने के लिए ‘पर’ स्वाभाविक है।
- source_word: יְהוֹשָׁפָט
  choice: यहोशापात
  rationale: इब्रानी व्यक्तिगत नाम का हिन्दी बाइबलीय परंपरा के अनुरूप लिप्यंतरण।
- source_word: הַאֵין
  choice: क्या ... नहीं है
  rationale: नकारात्मक प्रश्न की पुष्टि खोजने वाली शक्ति और गरिमापूर्ण, स्वाभाविक हिन्दी दोनों को बनाए रखता है।
- source_word: פֹּה
  choice: यहाँ
  rationale: स्थानवाचक क्रियाविशेषण का सीधा और स्वाभाविक अनुवाद।
- source_word: נָבִיא
  choice: कोई नबी
  rationale: इस संदर्भ में נָבִיא परमेश्वर की ओर से बोलने वाले व्यक्ति को दर्शाता है; नकारात्मक प्रश्न में ‘कोई नबी’ स्वाभाविक हिन्दी है।
- source_word: לַיהוָה
  choice: यहोवा का
  rationale: लामेद यहाँ संबंध या संबद्धता बताता है—यहोवा से संबंधित और उसकी ओर से बोलने वाला नबी।
- source_word: עוֹד
  choice: अब भी
  rationale: यह मुख्य पाठ में किसी नबी के अभी उपलब्ध होने का भाव रखता है; प्रसंगानुसार ‘कोई और’ भी संभव है, इसलिए उसे पादटिप्पणी में दिया गया है।
- source_word: וְנִדְרְשָׁה
  choice: हम पूछें
  rationale: प्रथम पुरुष बहुवचन कोहोर्टेटिव इच्छा या उद्देश्य व्यक्त करता है; हिन्दी में प्रश्न के बाद यह संक्षिप्त और स्वाभाविक है।
- source_word: מֵאוֹתוֹ
  choice: जिससे
  rationale: शाब्दिक भाव ‘उससे’ है। ‘जिससे हम पूछें’ नबी से उत्तर जानने या उसके माध्यम से दैवीय मार्गदर्शन लेने की बात को स्वाभाविक हिन्दी में व्यक्त करता है, बिना माध्यम की भूमिका को आवश्यकता से अधिक स्पष्ट किए।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ में चतुरक्षरीय व्यक्तिगत नाम सीधे आया है। ‘यहोवा’ आधुनिक हिन्दी बाइबलीय प्रयोग में व्यापक रूप से पहचाना जाने वाला नाम-रूप है और इसे सामान्य उपाधि ‘प्रभु’ से अलग रखता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘पर’ प्रसंगगत विरोध को व्यक्त करता है, जबकि प्रश्न की संरचना मूल इब्रानी की पुष्टि खोजने वाली ध्वनि को बनाए रखती है।
