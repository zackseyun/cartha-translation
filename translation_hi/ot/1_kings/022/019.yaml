  text: וַ/יֹּ֕אמֶר לָ/כֵ֖ן שְׁמַ֣ע דְּבַר יְהוָ֑ה רָאִ֤יתִי אֶת יְהוָה֙ יֹשֵׁ֣ב עַל כִּסְא֔/וֹ וְ/כָל צְבָ֤א הַ/שָּׁמַ֨יִם֙ עֹמֵ֣ד עָלָ֔י/ו מִ/ימִינ֖/וֹ וּ/מִ/שְּׂמֹאלֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/019.yaml
  text: 'Then he said[a], “Therefore hear the word of Yahweh: I saw Yahweh sitting on his throne, and all the host of heaven standing by him[b], on his right and on his left.”'
translation:
  language: hi
  text: 'तब उसने कहा, “इसलिए याहवे का वचन सुन: मैंने याहवे को अपने सिंहासन पर बैठे देखा, और स्वर्ग की सारी सेना[a] उसके पास—उसके दाहिने और बाएँ—खड़ी थी।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “संपूर्ण स्वर्गीय समुदाय” अथवा “स्वर्गीय सेना।”
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: इसलिए
  rationale: यह पिछले संवाद से निष्कर्षात्मक संबंध दिखाता है और भविष्यद्वाणी की गंभीरता बनाए रखता है।
- source_word: שְׁמַע
  choice: सुन
  rationale: एकवचन आज्ञार्थक रूप को सीधे और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: דְּבַר יְהוָה
  choice: याहवे का वचन
  rationale: मानक भविष्यद्वाणी-सूत्र को बनाए रखता है और יהוה को उसके व्यक्तिगत नाम ‘याहवे’ से प्रस्तुत करता है।
- source_word: רָאִיתִי
  choice: मैंने ... देखा
  rationale: दर्शन की घटना का सहज हिंदी भूतकालीन वर्णन है।
- source_word: יֹשֵׁב עַל כִּסְאוֹ
  choice: अपने सिंहासन पर बैठे
  rationale: इब्रानी कृदंत में निहित निरंतर राजसी मुद्रा को स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: כָל צְבָא הַשָּׁמַיִם
  choice: स्वर्ग की सारी सेना
  rationale: צָבָא की सामूहिक और संभावित सैन्य-दरबारी छवि को बनाए रखता है तथा इसे केवल स्वर्गदूतों तक सीमित नहीं करता।
- source_word: עֹמֵד עָלָיו
  choice: उसके पास ... खड़ी थी
  rationale: शाब्दिक ‘उसके ऊपर’ के बजाय सिंहासन-दरबार के संदर्भ में उपस्थित होकर पास खड़े रहने का भाव देता है; आगे का ‘दाहिने और बाएँ’ इसे स्पष्ट करता है।
- source_word: מִימִינוֹ וּמִשְּׂמֹאלוֹ
  choice: उसके दाहिने और बाएँ
  rationale: इब्रानी की स्थानगत समरूपता को संक्षिप्त और स्वाभाविक हिंदी में सुरक्षित रखता है।
theological_decisions:
- issue: दिव्य नाम יהוה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में प्रयुक्त परमेश्वर के व्यक्तिगत वाचा-नाम को शीर्षक से बदलने के बजाय लिप्यंतरित रूप में सुरक्षित रखा गया है।
- issue: כָל צְבָא הַשָּׁמַיִם की पहचान
  choice: स्वर्ग की सारी सेना
  alternative: स्वर्ग के सारे दूत; पूरा स्वर्गीय समुदाय
  rationale: मूल अभिव्यक्ति को केवल स्वर्गदूतों के रूप में सीमित न करके स्वर्गीय सभा/सेना की व्यापक और तनावपूर्ण छवि बनाए रखी गई है।
- issue: עָלָיו का स्थानगत अर्थ
  choice: उसके पास
  alternative: उसके ऊपर
  rationale: शाब्दिक स्थानगत संभावना को पादटिप्पणी में रखा गया है, जबकि मुख्य पाठ में सिंहासन के दोनों ओर उपस्थित सेवक-मंडल का संदर्भगत अर्थ व्यक्त किया गया है।
translation_notes:
  register: आधुनिक मानक हिंदी का गंभीर, किंतु सामान्य पाठक के लिए स्पष्ट भविष्यद्वाणी-संबंधी लहजा रखा गया है। ‘वचन’, ‘सिंहासन’ और ‘स्वर्ग की सेना’ जैसी स्थापित बाइबलीय अभिव्यक्तियाँ संरक्षित हैं; वाक्य-विन्यास को हिंदी में स्वाभाविक रखने के लिए ‘खड़ी थी’ को वाक्यांश के अंत में रखा गया है।
