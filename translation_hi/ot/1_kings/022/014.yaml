  edition: WLC
  text: וַ/יֹּ֖אמֶר מִיכָ֑יְהוּ חַי יְהוָ֕ה כִּ֠י אֶת אֲשֶׁ֨ר יֹאמַ֧ר יְהוָ֛ה אֵלַ֖/י אֹת֥/וֹ אֲדַבֵּֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/014.yaml
  text: And Micaiah said[a], “As Yahweh lives, whatever Yahweh says to me, that I will speak.”
translation:
  language: hi
  text: तब मीकायाह ने कहा, “याहवे के जीवन की शपथ[a], जो कुछ याहवे मुझसे कहेगा, वही मैं कहूँगा।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक रूप: “याहवे जीवित है।” यह एक हिब्रू शपथ-सूत्र है।'
    reason: मूल हिब्रू मुहावरे का शाब्दिक रूप और उसका कार्य स्पष्ट करना।
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: तब ... ने कहा
  rationale: हिब्रू वय्यिक्तोल कथानक को आगे बढ़ाता है; आधुनिक हिन्दी में ‘तब ... ने कहा’ प्रसंग का स्वाभाविक प्रवाह बनाए रखता है।
- source_word: מִיכָיְהוּ
  choice: मीकायाह
  rationale: हिब्रू नाम का देवनागरी में निकट और प्रचलित लिप्यंतरण।
- source_word: חַי יְהוָה
  choice: जीवित याहवे की शपथ
  rationale: यह प्रचलित हिब्रू शपथ-सूत्र है। हिन्दी रूप इसकी गंभीर शपथात्मक शक्ति को स्वाभाविक ढंग से व्यक्त करता है; शाब्दिक रूप पादटिप्पणी में दिया गया है।
- source_word: יְהוָה
  choice: याहवे
  rationale: टेट्राग्रामटन को किसी उपाधि से बदलने के बजाय परमेश्वर के व्यक्तिगत नाम के रूप में लिप्यंतरित किया गया है।
- source_word: אֵת אֲשֶׁר
  choice: जो कुछ
  rationale: कर्मसूचक चिह्न और सम्बन्धवाचक अव्यय की संयुक्त रचना का स्वाभाविक हिन्दी समतुल्य।
- source_word: יֹאמַר ... אֵלַי
  choice: मुझसे कहेगा
  rationale: अपूर्ण क्रिया यहाँ भविष्य-संदर्भ रखती है और אֶל वाणी की दिशा बताता है; हिन्दी में यह रूप स्वाभाविक है।
- source_word: אֹתוֹ אֲדַבֵּר
  choice: वही मैं कहूँगा
  rationale: אֹתוֹ पिछले सम्बन्धवाचक खंड की बात को फिर ग्रहण करता है; ‘वही’ इस बल को स्पष्ट रखता है, और אֲדַבֵּר का भाव भविष्यकालीन संकल्प है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में वाचा का व्यक्तिगत नाम सीधे प्रयुक्त है। ‘याहवे’ उसका निकट लिप्यंतरण है और उसे किसी उपाधि से प्रतिस्थापित नहीं करता।
- issue: חַי יְהוָה की शपथात्मक प्रकृति
  choice: जीवित याहवे की शपथ
  alternative: याहवे जीवित है
  rationale: प्रसंग में यह साधारण कथन नहीं, बल्कि भविष्यवक्ता की गंभीर शपथ है। मुख्य पाठ में उसके व्यावहारिक अर्थ को रखा गया है और शाब्दिक रूप पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘जीवित याहवे की शपथ’ सामान्य पाठक के लिए शपथ का आशय स्पष्ट करता है, जबकि पादटिप्पणी मूल अभिव्यक्ति को सुरक्षित रखती है।
