id: 1KI.22.44
reference: 1 Kings 22:44
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: אַ֥ךְ הַ/בָּמ֖וֹת לֹֽא סָ֑רוּ ע֥וֹד הָ/עָ֛ם מְזַבְּחִ֥ים וּֽ/מְקַטְּרִ֖ים בַּ/בָּמֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/044.yaml
  text: However[a], the high places were not removed[b]; the people still were sacrificing and burning incense on the high places.
translation:
  language: hi
  text: फिर भी ऊँचे स्थान[a] हटाए नहीं गए[b]; लोग अब भी उन ऊँचे स्थानों पर बलि चढ़ाते और धूप जलाते थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “स्थानीय उपासना-स्थल।” इब्रानी पद ऐसे धार्मिक स्थलों के लिए है जिन्हें परम्परागत रूप से “ऊँचे स्थान” कहा जाता है।
    reason: lexical_alternative
  - marker: b
    text: यह पद स्पष्ट नहीं करता कि ये बलियाँ यहोवा को अनधिकृत स्थानों पर चढ़ाई जाती थीं या वे व्यापक मूर्तिपूजक आचरण का भाग थीं।
    reason: cultural_note
lexical_decisions:
- source_word: אַךְ
  choice: फिर भी
  rationale: यह पिछले सकारात्मक वर्णन के विपरीत बनी हुई कमी को दर्शाता है और आधुनिक हिन्दी में स्वाभाविक विरोधसूचक अभिव्यक्ति है।
- source_word: הַבָּמוֹת
  choice: ऊँचे स्थान
  rationale: यह स्थानीय उपासना-स्थलों के लिए प्रयुक्त पारंपरिक पद है; इससे ऐतिहासिक-धार्मिक अर्थ सुरक्षित रहता है और केवल ‘मन्दिर’ या ‘देवस्थान’ जैसा अधिक व्याख्यात्मक अर्थ नहीं जुड़ता।
- source_word: לֹא סָרוּ
  choice: हटाए नहीं गए
  rationale: ऊँचे स्थान कर्ता होने पर इस मुहावरे का आशय है कि वे बने रहे और उनका उन्मूलन नहीं किया गया।
- source_word: עוֹד
  choice: अब भी
  rationale: सुधार के बावजूद जारी प्रथा को स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: הָעָם
  choice: लोग
  rationale: जनसमुदाय के सामूहिक उल्लेख का सीधा और सहज हिन्दी रूप।
- source_word: מְזַבְּחִים
  choice: बलि चढ़ाते थे
  rationale: कृदन्त रूप लगातार या प्रचलित रीति से किए जाने वाले कार्य को दर्शाता है; हिन्दी का अपूर्ण भूतकाल इस भाव को स्वाभाविक रूप से व्यक्त करता है।
- source_word: וּמְקַטְּרִים
  choice: और धूप जलाते थे
  rationale: उपासना-संदर्भ में यह क्रिया सामान्यतः धूप या सुगन्धित द्रव्य जलाने को व्यक्त करती है; समान क्रियात्मक प्रवाह के लिए साझा ‘थे’ रखा गया है।
- source_word: בַּבָּמוֹת
  choice: उन ऊँचे स्थानों पर
  rationale: उसी उपासना-स्थल को दोहराता है; ‘उन’ हिन्दी में पहले उल्लेखित स्थानों का स्वाभाविक संकेत देता है।
theological_decisions:
- issue: ऊँचे स्थानों पर की गई उपासना का स्वरूप
  choice: पद को वर्णनात्मक रखा गया है और यह नहीं बताया गया कि बलियाँ यहोवा को चढ़ाई जाती थीं या अन्य देवताओं को।
  alternative: इसे या तो यहोवा की अनधिकृत उपासना अथवा स्पष्ट मूर्तिपूजा के रूप में अनुवाद में निर्दिष्ट करना।
  rationale: इब्रानी पाठ केवल इतना कहता है कि लोग ऊँचे स्थानों पर बलि चढ़ाते और धूप जलाते थे। वह इन स्थानों के बने रहने की आलोचना करता है, पर इस पद में उपासना के लक्ष्य को स्पष्ट नहीं करता; इसलिए मूल की धर्मवैचारिक अस्पष्टता सुरक्षित रखी गई है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘बलि चढ़ाते और धूप जलाते थे’ जारी या प्रचलित क्रिया का भाव सुरक्षित रखता है। अर्धविराम पद के दो निकट सम्बद्ध कथनों को स्पष्ट रूप से जोड़ता है।
