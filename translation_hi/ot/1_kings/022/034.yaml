base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/034.yaml
  text: But a man drew his bow at random and struck the king of Israel between the scale armor and the breastplate[a]. So he said to his charioteer, “Turn your hand and take me out of the camp[d][c][b], for I am wounded.”
translation:
  language: hi
  text: परन्तु एक व्यक्ति ने बिना निशाना साधे[a] धनुष चलाया और इस्राएल के राजा को कवच के जोड़ों और बख्तर के बीच[b] जा लगा। तब राजा ने अपने सारथी से कहा, “रथ मोड़ो[c] और मुझे सेना के बीच से बाहर ले चलो, क्योंकि मैं घायल हो गया हूँ[d]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी पद का अर्थ “अपनी सरलता में,” “अनजाने में” या “बिना किसी खास लक्ष्य को निशाना बनाए” भी हो सकता है। यहाँ आशय सम्भवतः यह है कि धनुर्धर ने किसी निश्चित व्यक्ति को लक्ष्य नहीं बनाया था।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में दो दुर्लभ तकनीकी शब्द हैं, जो सम्भवतः कवच के अलग-अलग भागों के बीच की जगह बताते हैं; इन भागों का सटीक स्वरूप निश्चित नहीं है।
    reason: cultural_note
  - marker: c
    text: शाब्दिक रूप से, “अपना हाथ मोड़ो”; यह रथ को दूसरी ओर मोड़ने का मुहावरा है।
    reason: lexical_alternative
  - marker: d
    text: इब्रानी क्रिया का अर्थ “बीमार या अशक्त होना” भी हो सकता है; यहाँ तीर लगने के कारण इसका आशय घायल होना है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִישׁ
  choice: परन्तु एक व्यक्ति
  rationale: אִישׁ एक अनाम व्यक्ति को सूचित करता है। प्रसंग में וְ को ‘परन्तु’ कहना कथा के अचानक पलटाव को स्वाभाविक रूप से व्यक्त करता है।
- source_word: מָשַׁךְ בַּקֶּשֶׁת
  choice: धनुष चलाया
  rationale: शाब्दिक अर्थ धनुष खींचना है, पर युद्ध के इस प्रसंग में इसका आशय तीर चलाना है; आधुनिक हिन्दी में ‘धनुष चलाया’ स्वाभाविक और संक्षिप्त है।
- source_word: לְתֻמּוֹ
  choice: बिना निशाना साधे
  rationale: यहाँ शब्द नैतिक निर्दोषता से अधिक किसी निश्चित लक्ष्य को जानबूझकर निशाना न बनाने का भाव देता है। यह चयन घटना की विडम्बना को बनाए रखता है और ‘संयोग से’ की अपेक्षा क्रिया को अधिक स्पष्ट करता है।
- source_word: וַיַּכֶּה
  choice: जा मारा
  rationale: נכה का मूल भाव प्रहार करना या लगना है। ‘जा मारा’ हिन्दी में तीर के राजा को लगने को स्वाभाविक ढंग से व्यक्त करता है, जबकि घाव का उल्लेख आगे अलग से आता है।
- source_word: בֵּין הַדְּבָקִים וּבֵין הַשִּׁרְיָן
  choice: कवच की जुड़ी पट्टियों और झिलम के बीच
  rationale: दोनों तकनीकी संज्ञाओं का सटीक स्वरूप अनिश्चित है। דבקים में जुड़ी या चिपकी हुई कवच-पट्टियों का भाव है, और שׁריון शरीर पर पहने जाने वाले बख्तर या झिलम को सूचित करता है। अनुवाद दो कवच-भागों के बीच की असुरक्षित जगह को बनाए रखता है।
- source_word: לְרַכָּבוֹ
  choice: अपने सारथी से
  rationale: यह रूप रथ को हाँकने वाले व्यक्ति की ओर संकेत करता है; ‘सारथी’ इसका प्रचलित और सुबोध हिन्दी पर्याय है।
- source_word: הֲפֹךְ יָדְךָ
  choice: रथ मोड़ो
  rationale: इब्रानी में शाब्दिक रूप से ‘अपना हाथ मोड़’ है, जो हाथ से रथ को मोड़ने का मुहावरा है। लक्ष्य-भाषा में आशय को सीधे व्यक्त करना अधिक स्वाभाविक है, और शाब्दिक रूप पादटिप्पणी में सुरक्षित है।
- source_word: וְהוֹצִיאֵנִי מִן הַמַּחֲנֶה
  choice: मुझे सेना के बीच से बाहर ले चलो
  rationale: מַחֲנֶה का अर्थ छावनी, सैन्य-दल या सेना हो सकता है। चल रहे युद्ध में ‘सेना के बीच से’ प्रसंगानुकूल है और केवल स्थायी छावनी का भ्रामक बोध नहीं देता।
- source_word: כִּי הָחֳלֵיתִי
  choice: क्योंकि मैं घायल हो गया हूँ
  rationale: क्रिया सामान्यतः बीमार या अशक्त होने का भाव भी रखती है, पर तीर लगने के तत्काल प्रसंग में चोट लगने का अर्थ स्पष्ट है। स्रोत में न होने के कारण ‘बहुत’ या ‘बुरी तरह’ नहीं जोड़ा गया।
