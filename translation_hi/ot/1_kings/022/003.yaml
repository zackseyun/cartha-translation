  text: וַ/יֹּ֤אמֶר מֶֽלֶךְ יִשְׂרָאֵל֙ אֶל עֲבָדָ֔י/ו הַ/יְדַעְתֶּ֕ם כִּֽי לָ֖/נוּ רָמֹ֣ת גִּלְעָ֑ד וַ/אֲנַ֣חְנוּ מַחְשִׁ֔ים מִ/קַּ֣חַת אֹתָ֔/הּ מִ/יַּ֖ד מֶ֥לֶךְ אֲרָֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/003.yaml
  text: And the king of Israel said to his servants[a], “Do you know that Ramoth-gilead belongs to us[b], yet we are doing nothing to take it from the hand of the king of Aram?”
translation:
  language: hi
  text: इस्राएल के राजा ने अपने सेवकों से कहा, “क्या तुम जानते हो कि रामोत-गिलाद हमारा है, फिर भी हम उसे अराम के राजा के हाथ से लेने के लिए कुछ नहीं कर रहे हैं?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עֲבָדָיו
  choice: अपने सेवकों
  rationale: עבד का अर्थ सेवक या राजकीय अधिकारी हो सकता है। ‘सेवकों’ से मूल राजकीय संबोधन बना रहता है और पद को अनावश्यक रूप से विशिष्ट नहीं किया जाता।
- source_word: הַיְדַעְתֶּם
  choice: क्या तुम जानते हो
  rationale: यह साझा जानकारी की ओर संकेत करने वाला स्वाभाविक आलंकारिक प्रश्न है; इब्रानी में निषेध स्पष्ट नहीं है, इसलिए ‘क्या तुम नहीं जानते’ नहीं जोड़ा गया।
- source_word: כִּי לָנוּ רָמֹת גִּלְעָד
  choice: कि गिलाद का रामोत हमारा है
  rationale: לָנוּ यहाँ अधिकार या स्वामित्व का दावा व्यक्त करता है। ‘हमारा है’ संक्षिप्त, स्वाभाविक और मूल की अभिव्यक्ति के निकट है।
- source_word: רָמֹת גִּלְעָד
  choice: गिलाद का रामोत
  rationale: स्थान-नाम के दोनों अवयवों को देवनागरी में लिप्यंतरित करते हुए हिन्दी में स्वाभाविक संबंधसूचक रूप अपनाया गया है।
- source_word: מַחְשִׁים
  choice: कुछ नहीं कर रहे
  rationale: मूल क्रिया का शाब्दिक संबंध चुप रहने से है, पर इस संदर्भ में वह दोषपूर्ण निष्क्रियता बताती है। यह हिन्दी प्रयोग उस प्रसंगगत अर्थ को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: מִקַּחַת אֹתָהּ
  choice: उसे ... लेने के लिए
  rationale: यह उस उपेक्षित कार्रवाई को व्यक्त करता है जो राजा के अनुसार की जानी चाहिए थी; ‘लेने’ में मूल की तटस्थता रहती है और ‘छीनने’ जैसी अतिरिक्त तीव्रता नहीं आती।
- source_word: מִיַּד
  choice: के हाथ से
  rationale: मूल इब्रानी मुहावरे को सुरक्षित रखा गया है; हिन्दी में भी यह किसी के अधिकार या नियंत्रण से लेने के अर्थ में बोधगम्य है।
- source_word: אֲרָם
  choice: अराम
  rationale: मूल जाति-प्रदेश नाम का लिप्यंतरण किया गया है; बाद के भौगोलिक नाम ‘सीरिया’ को प्रतिस्थापित नहीं किया गया।
