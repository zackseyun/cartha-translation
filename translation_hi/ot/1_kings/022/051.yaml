  text: וַ/יִּשְׁכַּ֤ב יְהֽוֹשָׁפָט֙ עִם אֲבֹתָ֔י/ו וַ/יִּקָּבֵר֙ עִם אֲבֹתָ֔י/ו בְּ/עִ֖יר דָּוִ֣ד אָבִ֑י/ו וַ/יִּמְלֹ֛ךְ יְהוֹרָ֥ם בְּנ֖/וֹ תַּחְתָּֽי/ו־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/051.yaml
  text: And Jehoshaphat slept with his fathers and was buried with his fathers in the city of David his father[b][a], and Jehoram his son became king in his place.
translation:
  language: hi
  text: यहोशापात अपने पुरखों के साथ सो गया[a], और उसे अपने पुरखों के साथ उसके पिता[b] दाऊद के नगर में दफ़नाया गया। तब उसका पुत्र यहोराम उसकी जगह राजा बना।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “अपने पुरखों के साथ सो गया”; यह मृत्यु के लिए प्रयुक्त एक परंपरागत इब्रानी अभिव्यक्ति है।
    reason: lexical_alternative
  - marker: b
    text: यहाँ “पिता” वंशावली-संबंधी इब्रानी प्रयोग है, जिसका अर्थ “पूर्वज” या “पुरखा” भी हो सकता है।
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּשְׁכַּב
  choice: सो गया
  rationale: राजकीय मृत्यु-विवरण में यह क्रिया ‘अपने पुरखों के साथ’ के साथ मिलकर मृत्यु का परंपरागत मुहावरा है। ‘मर गया’ अर्थ स्पष्ट करता, पर मूल की साहित्यिक अभिव्यक्ति को खो देता।
- source_word: עִם אֲבֹתָיו
  choice: अपने पुरखों के साथ
  rationale: ‘पुरखे’ आधुनिक हिन्दी में वंशगत पूर्वजों को स्वाभाविक रूप से व्यक्त करता है और राजवंशीय सूत्र का भाव बनाए रखता है।
- source_word: וַיִּקָּבֵר
  choice: उसे ... दफ़नाया गया
  rationale: निफ़अल रूप का कर्मवाच्य अर्थ ठीक प्रकार से व्यक्त होता है; मूल पाठ कब्र या समाधि के प्रकार के बारे में अधिक विशिष्ट नहीं है।
- source_word: בְּעִיר דָּוִד
  choice: दाऊद के नगर में
  rationale: यह स्थापित स्थानवाचक पद है और इब्रानी संबंध-रचना को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: אָבִיו
  choice: उसके पिता
  rationale: मूल में ‘पिता’ का शब्द है, यद्यपि यहाँ दाऊद निकट जैविक पिता नहीं बल्कि वंशपूर्वज हैं। मुख्य पाठ मूल की वंशावली-संबंधी भाषा रखता है और पादटिप्पणी उसका व्यापक अर्थ स्पष्ट करती है।
- source_word: וַיִּמְלֹךְ
  choice: राजा बना
  rationale: यहाँ क्रिया शासन की पूरी अवधि से अधिक राजसिंहासन पर उत्तराधिकार ग्रहण करने को दर्शाती है।
- source_word: תַּחְתָּיו
  choice: उसकी जगह
  rationale: यह पद राजकीय पद पर उत्तराधिकार और स्थान लेने का अर्थ स्वाभाविक हिन्दी में व्यक्त करता है।
