base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/004.yaml
  text: And he said to Jehoshaphat[a], “Will you go with me to battle at Ramoth-gilead?” And Jehoshaphat said to the king of Israel, “I am as you are, my people as your people, my horses as your horses.”
translation:
  language: hi
  text: उसने यहोशापात से कहा, “क्या तुम मेरे साथ रामोत-गिलाद में युद्ध करने चलोगे?” यहोशापात ने इस्राएल के राजा से कहा, “मैं तुम्हारे जैसा हूँ; मेरे लोग तुम्हारे लोगों जैसे हैं, और मेरे घोड़े तुम्हारे घोड़ों जैसे हैं।”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इब्रानी में यह एक संक्षिप्त, क्रियारहित अभिव्यक्ति है: “मेरे लोग तुम्हारे लोगों जैसे, और मेरे घोड़े तुम्हारे घोड़ों जैसे।” यह एकजुटता और गठबंधन का भाव प्रकट करती है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲתֵלֵךְ אִתִּי
  choice: क्या तुम मेरे साथ ... चलोगे?
  rationale: प्रश्नवाचक הֲ और अपूर्ण क्रिया תֵלֵךְ को सीधे भविष्याभिमुख प्रश्न के रूप में रखा गया है; אִתִּי का स्वाभाविक अर्थ ‘मेरे साथ’ है।
- source_word: לַמִּלְחָמָה
  choice: युद्ध करने
  rationale: הלך के साथ यह पद युद्ध में जाने या युद्ध करने के लिए जाने का भाव देता है। आधुनिक हिन्दी में ‘युद्ध करने चलोगे’ स्वाभाविक है और सैन्य आशय स्पष्ट रखता है।
- source_word: רָמֹת גִּלְעָד
  choice: रामोत-गिलाद
  rationale: स्थान-नाम का प्रचलित हिन्दी लिप्यंतरण; योजक-चिह्न संयुक्त स्थान-नाम को स्पष्ट करता है।
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: इस्राएल के राजा
  rationale: इब्रानी संबंधसूचक पदबंध का सीधा और स्वाभाविक हिन्दी रूप।
- source_word: כָּמוֹנִי כָמוֹךָ
  choice: जैसा मैं, वैसे तुम
  rationale: यह संक्षिप्त, क्रियारहित तुलनात्मक अभिव्यक्ति एकता और गठबंधन की घोषणा करती है। हिन्दी में क्रिया जोड़े बिना मूल की संक्षिप्त समानांतरता सुरक्षित रहती है।
- source_word: כְּעַמִּי כְעַמֶּךָ
  choice: जैसे मेरे लोग, वैसे तुम्हारे लोग
  rationale: मूल की क्रियारहित तुलनात्मक रचना और समानांतर लय को सुरक्षित रखा गया है।
- source_word: כְּסוּסַי כְּסוּסֶיךָ
  choice: जैसे मेरे घोड़े, वैसे तुम्हारे घोड़े
  rationale: סוּס का ठोस अर्थ ‘घोड़ा’ रखा गया है; ‘घुड़सवार सेना’ कहना सैन्य आशय की व्याख्या तो करता, पर मूल शब्द से आगे जाता।
theological_decisions:
- issue: यहोशापात की एकजुटता की घोषणा का आशय
  choice: मूल की संक्षिप्त तुलनात्मक पंक्तियाँ रखी गईं
  alternative: ‘मैं तुम्हारे साथ हूँ; मेरे लोग और मेरे घोड़े भी तुम्हारे हैं’
  rationale: वैकल्पिक रूप गठबंधन का भाव स्पष्ट करता है, लेकिन स्वामित्व या पूर्ण समर्पण का अर्थ अधिक दृढ़ता से जोड़ सकता है। मूल पाठ समानता/एकजुटता की संक्षिप्त अभिव्यक्ति है, इसलिए उसका तनाव और खुलापन बनाए रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण और सहज शैली अपनाई गई है। संवाद को सीधा रखा गया है और अंतिम कथन में मूल इब्रानी की संक्षिप्त समानांतर रचना बचाई गई है।
