id: 1KI.22.53
reference: 1 Kings 22:53
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יַּ֥עַשׂ הָ/רַ֖ע בְּ/עֵינֵ֣י יְהוָ֑ה וַ/יֵּ֗לֶךְ בְּ/דֶ֤רֶךְ אָבִי/ו֙ וּ/בְ/דֶ֣רֶךְ אִמּ֔/וֹ וּ/בְ/דֶ֨רֶךְ֙ יָרָבְעָ֣ם בֶּן נְבָ֔ט אֲשֶׁ֥ר הֶחֱטִ֖יא אֶת יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/053.yaml
  text: And he did what was evil in the eyes of Yahweh and walked in the way of his father, and in the way of his mother, and in the way of Jeroboam son of Nebat, who caused Israel to sin.
translation:
  language: hi
  text: उसने वह किया जो याहवे की दृष्टि में बुरा था। वह अपने पिता के मार्ग पर, अपनी माता के मार्ग पर और नबात के पुत्र यारोबाम के मार्ग पर चला, जिसने इस्राएल को पाप कराया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַשׂ הָרַע
  choice: उसने वह किया जो...बुरा था
  rationale: यह स्वाभाविक हिन्दी में עשה + הרע की नैतिक अर्थवत्ता को स्पष्ट रखता है।
- source_word: בְּעֵינֵי יְהוָה
  choice: यहोवा की दृष्टि में
  rationale: इब्रानी मूल्यांकन-सूत्र का निकट और स्वाभाविक हिन्दी रूप; दिव्य नाम को शीर्षक से नहीं बदला गया।
- source_word: וַיֵּלֶךְ בְּדֶרֶךְ
  choice: मार्ग पर चला
  rationale: आचरण के लिए प्रयुक्त ‘चलने’ और ‘मार्ग’ के मूल रूपक को बनाए रखता है।
- source_word: אָבִיו...אִמּוֹ
  choice: अपने पिता...अपनी माता
  rationale: दोनों पारिवारिक संदर्भों और उनकी समानांतर पुनरावृत्ति को स्पष्ट रूप से सुरक्षित रखता है।
- source_word: יָרָבְעָם בֶּן נְבָט
  choice: नबात के पुत्र यारोबाम
  rationale: इब्रानी नाम और पितृनाम का प्रचलित हिन्दी बाइबलीय रूप।
- source_word: הֶחֱטִיא אֶת יִשְׂרָאֵל
  choice: जिसने इस्राएल से पाप करवाया था
  rationale: हिफ़ील रूप की कारक शक्ति को सीधे व्यक्त करता है और यह नहीं कहता कि यारोबाम ने केवल उदाहरण दिया था।
theological_decisions:
- issue: दिव्य नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: मूल पाठ के व्यक्तिगत दिव्य नाम को हिन्दी में व्यापक रूप से पहचाने जाने वाले लिप्यंतरण से प्रस्तुत किया गया है; उसे केवल उपाधि ‘प्रभु’ से नहीं बदला गया।
- issue: הֶחֱטִיא की कारकता
  choice: इस्राएल से पाप करवाया
  alternative: इस्राएल को पाप में लगाया; इस्राएल को पाप की ओर ले गया
  rationale: मूल क्रिया की कारकता को बनाए रखते हुए किसी अतिरिक्त मनोवैज्ञानिक या धर्मवैज्ञानिक व्याख्या को नहीं जोड़ा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी; गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। इब्रानी की त्रिस्तरीय ‘मार्ग’ पुनरावृत्ति और आचरण-संबंधी रूपक सुरक्षित रखे गए हैं।
