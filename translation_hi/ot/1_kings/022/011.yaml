source:
  edition: WLC
  text: וַ/יַּ֥עַשׂ ל֛/וֹ צִדְקִיָּ֥ה בֶֽן כְּנַעֲנָ֖ה קַרְנֵ֣י בַרְזֶ֑ל וַ/יֹּ֨אמֶר֙ כֹּֽה אָמַ֣ר יְהוָ֔ה בְּ/אֵ֛לֶּה תְּנַגַּ֥ח אֶת אֲרָ֖ם עַד כַּלֹּתָֽ/ם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/011.yaml
  text: 'Then Zedekiah son of Chenaanah made for himself horns of iron and said, “Thus says the LORD: With these you will gore Aram until you have finished them off.”'
translation:
  language: hi
  text: 'तब कनाना के पुत्र सिदकिय्याह ने अपने लिए लोहे के सींग बनाए और कहा, “यहोवा यों कहता है: ‘इनसे तू अराम को सींग मारेगा, जब तक तू उनका अन्त न कर दे।’”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: קַרְנֵי בַרְזֶל
  choice: लोहे के सींग
  rationale: इब्रानी रूपक और सिदकिय्याह द्वारा बनाई गई प्रतीकात्मक वस्तुओं को सीधे बनाए रखता है।
- source_word: תְּנַגַּח
  choice: सींग मारेगा
  rationale: क्रिया का शाब्दिक अर्थ सींग से मारना है; यह बनाए गए लोहे के सींगों के साथ स्पष्ट शब्द-संबंध रखता है।
- source_word: אֲרָם
  choice: अराम
  rationale: मूल पाठ के प्राचीन भौगोलिक-राजनीतिक नाम को सुरक्षित रखता है।
- source_word: עַד כַּלֹּתָם
  choice: जब तक उसका सर्वनाश न कर दे
  rationale: प्रत्यय अराम के लोगों/सेना की ओर सामूहिक रूप से संकेत करता है; हिन्दी में एकवचन सामूहिक ‘उसका’ स्वाभाविक है और पूर्ण विनाश का भाव व्यक्त करता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: व्यक्तिगत ईश्वरीय नाम को सामान्य उपाधि में बदलने के बजाय हिन्दी में प्रचलित लिप्यंतरण से प्रस्तुत किया गया है।
theological_decisions:
- issue: भविष्यद्वाणी के दावे की प्रस्तुति
  choice: “यहोवा यों कहता है” को सीधे उद्धृत किया गया
  alternative: ‘उसने दावा किया कि यहोवा कहता है’ जैसी व्याख्यात्मक दूरी
  rationale: पद सिदकिय्याह के कथन को भविष्यद्वाणी-सूत्र के रूप में देता है; कथावाचक यहाँ तत्काल उसकी सत्यता पर टिप्पणी नहीं करता।
- issue: עַד כַּלֹּתָם में विनाश का कर्ता
  choice: “तू… सर्वनाश न कर दे”
  alternative: “जब तक वे समाप्त न हो जाएँ”
  rationale: क्रिया के दूसरे पुरुष संदर्भ और अंग्रेज़ी परामर्श पाठ के सक्रिय भाव के अनुरूप अहाब को कर्ता रखा गया, जबकि अराम को सामूहिक लक्ष्य माना गया।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सहज हिन्दी। भविष्यद्वाणी के भीतर ‘तू’ रखा गया है, क्योंकि संबोधन राजा से है और इससे मूल के एकवचन दूसरे पुरुष का रूप सुरक्षित रहता है।
