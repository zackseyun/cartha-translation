  to: 'तब कनाना के पुत्र सिदकिय्याह ने अपने लिए लोहे के सींग बनाए और कहा, “यहोवा यों कहता है: ‘इनसे तू अराम को सींग मारेगा, जब तक तू उनका अन्त न कर दे।’”'
