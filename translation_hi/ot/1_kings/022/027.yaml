base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/027.yaml
  text: 'and say[a], ‘Thus says the king: Put this man in the prison, and feed him with bread of affliction and water of affliction until I come in peace.’'
translation:
  language: hi
  text: 'और कहना, ‘राजा यह कहता है: इस आदमी को बन्दीगृह में डाल दो और जब तक मैं सकुशल लौट न आऊँ, तब तक इसे क्लेश की रोटी और क्लेश का पानी[a] देना।’'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “संकट की रोटी और संकट का पानी”; सम्भवतः इसका अर्थ जेल में दिया जाने वाला कठोर या बहुत कम मात्रा का भोजन और पानी है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה אָמַר הַמֶּלֶךְ
  choice: राजा यह कहता है
  rationale: इब्रानी राजकीय सन्देश-सूत्र को स्वाभाविक, गरिमापूर्ण आधुनिक हिन्दी में व्यक्त करता है।
- source_word: שִׂימוּ אֶת זֶה
  choice: इस आदमी को ... डाल दो
  rationale: सन्दर्भ में संकेतवाचक शब्द मीकायाह के लिए है; ‘इस आदमी’ हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: בֵּית הַכֶּלֶא
  choice: बन्दीगृह में
  rationale: शाब्दिक अर्थ ‘बन्दी रखने का घर’ है; ‘बन्दीगृह’ ठोस स्थान और औपचारिक शैली दोनों बनाए रखता है।
- source_word: וְהַאֲכִילֻהוּ
  choice: इसे ... देते रहना
  rationale: रोटी और पानी दोनों के साथ स्वाभाविक हिन्दी प्रयोग है और कारावास की अवधि भर जारी अल्प आहार का भाव व्यक्त करता है।
- source_word: לֶחֶם לַחַץ
  choice: दुःख की रोटी
  rationale: लַחַץ के कष्ट, दबाव या तंगी के भाव को बिना केवल ‘कम मात्रा’ तक सीमित किए सुरक्षित रखता है।
- source_word: וּמַיִם לַחַץ
  choice: दुःख का पानी
  rationale: रोटी के समानान्तर इब्रानी संरचना और कठोर कारावासी आहार की छवि बनाए रखता है।
- source_word: עַד בֹּאִי בְשָׁלוֹם
  choice: जब तक मैं सकुशल लौट न आऊँ
  rationale: בוא का सन्दर्भानुकूल अर्थ लौटना और בְשָׁלוֹם का सुरक्षित, अहानिकर आगमन है; यह हिन्दी में स्वाभाविक रहते हुए राजा के आत्मविश्वास और कथात्मक विडम्बना को रखता है।
theological_decisions:
- issue: अहाब के कथन में בְשָׁלוֹם का आशय
  choice: सकुशल
  alternative: शान्ति से
  rationale: यहाँ शब्द सुरक्षित और अहानिकर लौटने का भाव दे सकता है। ‘सकुशल’ उसी अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है और राजा के दावे की कथात्मक विडम्बना को मिटाता नहीं।
translation_notes:
  register: आधुनिक मानक हिन्दी; राजकीय आदेश के अनुरूप औपचारिक किन्तु सामान्य पाठक के लिए सहज शैली। ‘दुःख की रोटी और दुःख का पानी’ स्रोत की समानान्तर अभिव्यक्ति को बनाए रखता है, जबकि पादटिप्पणी सम्भावित व्यावहारिक अर्थ स्पष्ट करती है।
