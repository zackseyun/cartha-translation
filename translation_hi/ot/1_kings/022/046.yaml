  text: וְ/יֶ֨תֶר דִּבְרֵ֧י יְהוֹשָׁפָ֛ט וּ/גְבוּרָת֥/וֹ אֲשֶׁר עָשָׂ֖ה וַ/אֲשֶׁ֣ר נִלְחָ֑ם הֲ/לֹֽא הֵ֣ם כְּתוּבִ֗ים עַל סֵ֛פֶר דִּבְרֵ֥י הַ/יָּמִ֖ים לְ/מַלְכֵ֥י יְהוּדָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/046.yaml
  text: The rest of the acts of Jehoshaphat[a], and his might that he showed, and how he fought—are they not written in the Book of the Chronicles of the Kings of Judah?
translation:
  language: hi
  text: यहोशापात के बाकी काम, उसका पराक्रम जो उसने दिखाया,[a] और जिस प्रकार उसने युद्ध किया—क्या ये सब यहूदा के राजाओं के इतिहास की पुस्तक में लिखे नहीं हैं?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “और उसका पराक्रम जो उसने किया।” इब्रानी में “उसका पराक्रम” और “जो उसने किया” साथ आते हैं; यह व्यवहार में दिखाई गई वीरता या सामर्थ्य के लिए प्रयुक्त मुहावरा है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי יְהוֹשָׁפָט
  choice: यहोशापात के बाकी कामों का वर्णन
  rationale: राजकीय सारांश के इस प्रचलित सूत्र में דִּבְרֵי का आशय केवल ‘बातें/शब्द’ नहीं, बल्कि राजा के कामों या कार्यों से है। ‘का वर्णन’ आगे आने वाले बहुवचन सर्वनाम ‘ये सब’ और लिखित अभिलेख के संदर्भ को हिंदी में स्वाभाविक बनाता है।
- source_word: וּגְבוּרָתוֹ אֲשֶׁר עָשָׂה
  choice: उसके पराक्रम का वर्णन जो उसने दिखाया
  rationale: גְּבוּרָה शक्ति, वीरता या पराक्रम को व्यक्त करता है; עָשָׂה के साथ यह व्यवहार में प्रकट पराक्रम का मुहावरा है। ‘पराक्रम ... दिखाया’ मूल संज्ञा और उसके प्रदर्शन—दोनों को सुरक्षित रखता है।
- source_word: וַאֲשֶׁר נִלְחָם
  choice: और इस बात का वर्णन कि उसने कैसे युद्ध किए
  rationale: निफ़अल रूप נִלְחָם यहाँ ‘लड़ा/युद्ध किया’ के अर्थ में है। ‘कैसे युद्ध किए’ ऐतिहासिक गतिविधि का सार स्वाभाविक हिंदी में देता है, बिना किसी विशेष युद्ध का नाम जोड़े।
- source_word: הֲלֹא הֵם כְּתוּבִים
  choice: क्या ये सब ... नहीं लिखे हैं?
  rationale: मूल का आलंकारिक प्रश्न और बहुवचन संकेत दोनों बनाए रखे गए हैं।
- source_word: עַל סֵפֶר דִּבְרֵי הַיָּמִים לְמַלְכֵי יְהוּדָה
  choice: यहूदा के राजाओं के इतिहास की पुस्तक में
  rationale: दिवसों की घटनाओं के अभिलेख के लिए प्रयुक्त सूत्र को आधुनिक पाठक के लिए ‘इतिहास की पुस्तक’ के रूप में दिया गया है; यह संदर्भित राजकीय अभिलेख है, बाइबल की ‘इतिहास’ नामक किसी आधुनिक पुस्तक-उपाधि का दावा नहीं।
