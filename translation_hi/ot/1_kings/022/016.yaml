base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/016.yaml
  text: Then the king said to him[a], “How many times must I make you swear that you tell me nothing but the truth in the name of Yahweh?”
translation:
  language: hi
  text: तब राजा ने उससे कहा, “मैं तुम्हें कितनी बार शपथ दिलाऊँ[a] कि तुम याहवे के नाम से मुझसे केवल सत्य ही बोलो?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मैं तुम्हें कितनी बार शपथ के अधीन करूँ...?” इब्रानी क्रिया का अर्थ किसी को शपथ दिलाना या शपथ के अधीन करना है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אֵלָיו הַמֶּלֶךְ
  choice: तब राजा ने उससे कहा
  rationale: वाव-क्रमिक कथा को आगे बढ़ाता है; ‘तब’ स्वाभाविक हिन्दी में क्रम को व्यक्त करता है। मूल में उपाधि ‘राजा’ ही है, इसलिए उसका नाम नहीं जोड़ा गया।
- source_word: עַד כַּמֶּה פְעָמִים
  choice: कितनी बार
  rationale: यह बार-बार की स्थिति पर झुँझलाहट व्यक्त करने वाला स्वाभाविक प्रश्न है; शब्दशः ‘कब तक कितनी बार’ हिन्दी में असहज होगा।
- source_word: מַשְׁבִּעֶךָ
  choice: मैं तुझे ... शपथ दिलाऊँ
  rationale: שׁבע का हिफ़ील रूप किसी को शपथ खिलाने या शपथ के अधीन करने का अर्थ रखता है। ‘शपथ दिलाऊँ’ आधुनिक, स्पष्ट और मूल के कारक भाव के निकट है।
- source_word: אֲשֶׁר לֹא תְדַבֵּר אֵלַי רַק אֱמֶת
  choice: कि तू ... मुझसे केवल सत्य ही बोले
  rationale: निषेध और רַק मिलकर ‘सत्य के सिवा कुछ न’ का अर्थ देते हैं। ‘केवल सत्य ही बोले’ हिन्दी में स्वाभाविक रहते हुए דּבר के ‘बोलना’ भाव को बनाए रखता है।
- source_word: בְּשֵׁם יְהוָה
  choice: याहवे के नाम से
  rationale: בְּשֵׁם अधिकार अथवा नाम के आह्वान के आधार पर बोलने को सूचित करता है। יְהוָה को उसके व्यक्तिगत वाचा-नाम ‘याहवे’ के रूप में लिप्यंतरित किया गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: प्रभु / यहोवा
  rationale: इब्रानी पाठ में चार-अक्षरी व्यक्तिगत नाम सीधे उपस्थित है। ‘याहवे’ उसका प्रचलित विद्वत्तापूर्ण लिप्यंतरण है और उसे उपाधि में नहीं बदलता।
translation_notes:
  register: आधुनिक मानक हिन्दी; सम्मानपूर्ण लेकिन संवाद की तीव्रता बनाए रखने के लिए राजा द्वारा मीका को संबोधित एकवचन ‘तू/तुझे’ रखा गया है। वाक्य संक्षिप्त, मौखिक और कथात्मक है।
