- source_word: וּ/מֶלֶךְ
  choice: और ... राजा
  rationale: वाव कथात्मक क्रम को जोड़ता है, और מֶלֶךְ का सामान्य अर्थ ‘राजा’ है।
- source_word: אֵין
  choice: कोई ... नहीं था
  rationale: यह अस्तित्व के अभाव को व्यक्त करता है; ऐतिहासिक प्रसंग के कारण भूतकाल स्वाभाविक है।
- source_word: בֶּ/אֱדוֹם
  choice: एदोम में
