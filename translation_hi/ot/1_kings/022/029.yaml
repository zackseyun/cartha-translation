  text: So the king of Israel and Jehoshaphat king of Judah went up to Ramoth-gilead.
translation:
  language: hi
  text: तब इस्राएल का राजा और यहूदा का राजा यहोशापात रामोत-गिलाद की ओर चढ़ गए।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַל
  choice: चढ़ गए
  rationale: עלה का मूल अर्थ ‘ऊपर जाना/चढ़ना’ है। गंतव्य के साथ ‘चढ़ गए’ इब्रानी दिशासूचक भाव को बनाए रखता है और प्रसंग सैन्य होने पर भी क्रिया में ‘युद्ध करने’ का अतिरिक्त अर्थ नहीं जोड़ता।
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: इस्राएल का राजा
  rationale: मूल पाठ अहाब का व्यक्तिगत नाम न देकर पदवी का प्रयोग करता है; वही कथात्मक रूप सुरक्षित रखा गया है।
- source_word: וִיהוֹשָׁפָט
  choice: और ... यहोशापात
  rationale: व्यक्तिगत नाम का प्रचलित हिन्दी लिप्यंतरण रखा गया है।
- source_word: מֶלֶךְ יְהוּדָה
  choice: यहूदा का राजा
  rationale: यहोशापात के साथ आए समानाधिकरण पद को स्वाभाविक हिन्दी क्रम में रखा गया है।
- source_word: רָמֹת גִּלְעָד
  choice: गिलाद के रामोत
  rationale: संयुक्त स्थान-नाम को हिन्दी बाइबलीय परंपरा के अनुरूप व्यक्त किया गया है; यह गिलाद क्षेत्र के रामोत नगर को सूचित करता है।
