base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/030.yaml
  text: Then the king of Israel said to Jehoshaphat[a], “Disguise yourself and go into the battle, but you, put on your robes.” So the king of Israel disguised himself and went into the battle.
translation:
  language: hi
  text: इस्राएल के राजा ने यहोशापात से कहा, “मैं भेष बदलकर युद्ध में जाऊँगा[a], पर तुम अपने वस्त्र पहन लो।” तब इस्राएल का राजा भेष बदलकर युद्ध में गया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: हिब्रू रूप का अर्थ “भेष बदलकर युद्ध में जाओ” भी लिया जा सकता है; लेकिन इसके बाद कहा गया है कि इस्राएल के राजा ने भेष बदला, इसलिए यहाँ “मैं भेष बदलकर युद्ध में जाऊँगा” अधिक संभावित है।
    reason: alternative_reading
lexical_decisions:
- source_word: הִתְחַפֵּשׂ
  choice: मैं भेष बदलकर
  rationale: यह रूप अपने-आप में आज्ञार्थक भी समझा जा सकता है, पर इसके बाद आया कथन कि इस्राएल के राजा ने भेष बदला, यहाँ वक्ता की अपनी योजना का अर्थ प्रबल करता है। हिंदी में प्रथम पुरुष इस संदर्भगत अर्थ को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: וָבֹא
  choice: युद्ध में जाऊँगा
  rationale: पूर्ववर्ती क्रिया के साथ यह राजा की प्रस्तावित कार्रवाई को आगे बढ़ाता है। בוא का युद्ध की स्थिति में प्रवेश करने का भाव हिंदी के ‘युद्ध में जाना’ से स्वाभाविक रूप में व्यक्त होता है।
- source_word: בַמִּלְחָמָה
  choice: युद्ध में
  rationale: यहाँ संज्ञा युद्ध में प्रवेश और भाग लेने की परिस्थिति बताती है; ‘युद्ध में’ सामान्य आधुनिक हिंदी में स्पष्ट और संक्षिप्त है।
- source_word: וְאַתָּה
  choice: पर तुम
  rationale: स्वतंत्र सर्वनाम אַתָּה दोनों राजाओं की वेशभूषा के बीच स्पष्ट विरोध स्थापित करता है; इसलिए संयोजक को विरोधसूचक ‘पर’ से व्यक्त किया गया है।
- source_word: לְבַשׁ בְּגָדֶיךָ
  choice: अपने राजसी वस्त्र पहन लो
  rationale: בְּגָדִים का मूल अर्थ वस्त्र है। युद्ध में दो राजाओं और भेष बदलने के विरोध के संदर्भ में पहचान में आने वाले राजकीय वस्त्र अभिप्रेत हैं; ‘राजसी वस्त्र’ इस निहित संदर्भ को स्पष्ट करता है, जबकि ‘पहन लो’ आज्ञा को सहज हिंदी में रखता है।
- source_word: וַיִּתְחַפֵּשׂ
  choice: भेष बदलकर
  rationale: यह कथात्मक क्रिया स्पष्ट करती है कि इस्राएल के राजा ने स्वयं भेष बदला; हिंदी में संयुक्त क्रिया अगले कार्य के साथ स्वाभाविक रूप से जुड़ती है।
- source_word: וַיָּבֹא בַּמִּלְחָמָה
  choice: युद्ध में गया
  rationale: यह राजा के कार्य का सीधा कथात्मक परिणाम है और पहले कही गई योजना की शब्दगत पुनरावृत्ति को पर्याप्त रूप से बनाए रखता है।
theological_decisions:
- issue: הִתְחַפֵּשׂ की पुरुष-वचन संबंधी संदर्भगत अस्पष्टता
  choice: 'मुख्य पाठ में प्रथम पुरुष: ‘मैं भेष बदलकर युद्ध में जाऊँगा’'
  alternative: 'द्वितीय पुरुष आज्ञा: ‘भेष बदलकर युद्ध में जाओ’'
  rationale: व्यंजनात्मक/रूपात्मक स्तर पर आज्ञार्थक पाठ संभव है, किंतु तुरंत बाद राजा द्वारा स्वयं भेष बदलने का वर्णन और וְאַתָּה का विरोधात्मक बल प्रथम पुरुष अभिप्राय का प्रबल समर्थन करते हैं। अस्पष्टता को मिटाने के बजाय पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिंदी का सरल, गरिमापूर्ण कथात्मक रूप अपनाया गया है। ‘भेष बदलना’, ‘युद्ध में जाना’ और ‘राजसी वस्त्र’ सामान्य पाठक के लिए सहज हैं। मुख्य पाठ में संदर्भ से अधिक संभावित प्रथम-पुरुष अर्थ रखा गया है और वास्तविक हिब्रू अस्पष्टता पादटिप्पणी में दी गई है।
