  text: So the king died and was brought to Samaria[a], and they buried the king in Samaria.
translation:
  language: hi
  text: इस प्रकार राजा मर गया और उसे सामरिया लाया गया[a]; फिर उन्होंने राजा को सामरिया में दफ़नाया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से, “और राजा मर गया, और वह सामरिया आया।” आशय यह है कि उसकी मृत्यु के बाद राजा का शव सामरिया लाया गया।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּמָת
  choice: मर गया
  rationale: मूल क्रिया कथा के क्रम में मृत्यु की घटना बताती है; आधुनिक हिन्दी में ‘मर गया’ इसका सीधा और स्वाभाविक रूप है।
- source_word: הַמֶּלֶךְ
  choice: राजा
  rationale: निश्चित संज्ञा प्रसंग में पहले से ज्ञात राजा अहाब की ओर संकेत करती है; मूल की तरह पदवी रखी गई है, नाम नहीं जोड़ा गया।
- source_word: וַיָּבֹא שֹׁמְרוֹן
  choice: उसे सामरिया लाया गया
  rationale: इब्रानी रूप शाब्दिक रूप से एकवचन सक्रिय ‘वह सामरिया आया’ है, पर राजा की मृत्यु के बाद प्रसंग उसके शव को सामरिया लाए जाने का अर्थ देता है। हिन्दी में कर्मवाच्य इस निहित अर्थ को स्वाभाविक रूप से व्यक्त करता है।
- source_word: שֹׁמְרוֹן
  choice: सामरिया
  rationale: स्थान-नाम का हिन्दी में प्रचलित बाइबलीय रूप।
- source_word: וַיִּקְבְּרוּ
  choice: उन्होंने ... दफ़नाया
  rationale: तीसरे पुरुष बहुवचन के अनिर्दिष्ट कर्ता को ‘उन्होंने’ से बनाए रखा गया है।
- source_word: אֶת הַמֶּלֶךְ
  choice: राजा को
  rationale: मूल में संज्ञा की पुनरावृत्ति है; ‘उसे’ करने के बजाय ‘राजा को’ रखकर वही स्पष्टता और बल सुरक्षित रखा गया है।
- source_word: בְּשֹׁמְרוֹן
  choice: सामरिया में
  rationale: यहाँ पूर्वसर्ग दफ़नाने का स्थान बताता है; ‘में’ सीधा हिन्दी समतुल्य है।
