base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/009.yaml
  text: Then the king of Israel called one officer and said[a], “Bring Micaiah son of Imlah quickly.”
translation:
  language: hi
  text: तब इस्राएल के राजा ने एक राज-अधिकारी[a] को बुलाकर कहा, “यिम्ला के पुत्र मीकायाह को जल्दी ले आओ।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी शब्द ‘सारीस’ का अर्थ ‘खोजा’ भी हो सकता है और व्यापक अर्थ में ‘दरबारी या राजकीय अधिकारी’ भी। यहाँ दूसरा अर्थ अधिक संभावित है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: बुलाकर
  rationale: कרא का अर्थ इस प्रसंग में किसी को बुलाना है; संयुक्त क्रिया ‘बुलाकर कहा’ इब्रानी कथात्मक क्रम को स्वाभाविक हिन्दी में व्यक्त करती है।
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: इस्राएल के राजा
  rationale: यह सीधा संबंधसूचक पदबंध है और कथानक में निश्चित राजा को दर्शाता है।
- source_word: אֶל סָרִיס אֶחָד
  choice: एक राज-अधिकारी
  rationale: סָרִיס का अर्थ शाब्दिक रूप से ‘खोजा’ अथवा व्यापक रूप से राजकीय/दरबारी अधिकारी हो सकता है। यहाँ व्यक्ति की प्रशासनिक भूमिका प्रमुख लगती है; दूसरी संभावना पादटिप्पणी में सुरक्षित है।
- source_word: מַהֲרָה
  choice: जल्दी ले आओ
  rationale: מהר आग्रह और तात्कालिकता व्यक्त करता है। मूल में लाने की क्रिया प्रसंग से निहित है; हिन्दी में आदेश को स्पष्ट और स्वाभाविक बनाने के लिए ‘ले आओ’ जोड़ा गया है।
- source_word: מִיכָיְהוּ
  choice: मीकायाह
  rationale: व्यक्तिनाम का हिन्दी बाइबलीय परंपरा के अनुरूप लिप्यंतरण किया गया है, जिसमें मूल नाम की याहु-समाप्ति का मान्य संक्षिप्त रूप बना रहता है।
- source_word: בֶן יִמְלָה
  choice: यिम्ला के पुत्र
  rationale: मानक पितृनामसूचक रचना को औपचारिक और सहज हिन्दी में प्रस्तुत किया गया है।
