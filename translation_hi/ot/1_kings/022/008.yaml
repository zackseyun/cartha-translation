source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר מֶֽלֶךְ יִשְׂרָאֵ֣ל אֶֽל יְהוֹשָׁפָ֡ט ע֣וֹד אִישׁ אֶחָ֡ד לִ/דְרֹשׁ֩ אֶת יְהוָ֨ה מֵ/אֹת֜/וֹ וַ/אֲנִ֣י שְׂנֵאתִ֗י/ו כִּ֠י לֹֽא יִתְנַבֵּ֨א עָלַ֥/י טוֹב֙ כִּ֣י אִם רָ֔ע מִיכָ֖יְהוּ בֶּן יִמְלָ֑ה וַ/יֹּ֨אמֶר֙ יְה֣וֹשָׁפָ֔ט אַל יֹאמַ֥ר הַ/מֶּ֖לֶךְ כֵּֽן־׀־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/008.yaml
  text: 'And the king of Israel said to Jehoshaphat[a], “There is still one more man through whom to inquire of Yahweh, but I hate him, because he does not prophesy good concerning me, but only evil: Micaiah son of Imlah.” And Jehoshaphat said, “Let not the king say so.”'
translation:
  language: hi
  text: इस्राएल के राजा ने यहोशापात से कहा, “एक और व्यक्ति है, जिसके माध्यम से यहोवा से पूछा जा सकता है; पर मैं उससे घृणा करता हूँ, क्योंकि वह मेरे विषय में भलाई की नहीं, केवल बुराई की भविष्यवाणी करता है—मीकायाह, यिम्ला का पुत्र।” यहोशापात ने कहा, “राजा ऐसा न कहे।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עוֹד אִישׁ אֶחָד
  choice: एक और व्यक्ति है
  rationale: עוֹד और אֶחָד के योग में एक अतिरिक्त व्यक्ति का भाव है; यह हिंदी में सहज और स्पष्ट है।
- source_word: לִדְרֹשׁ אֶת־יְהוָה מֵאֹתוֹ
  choice: जिसके द्वारा हम यहोवा से पूछ सकते हैं
  rationale: דָּרַשׁ यहाँ भविष्यद्वक्ता के माध्यम से परमेश्वर की इच्छा जानने के लिए पूछने का अर्थ देता है, और מֵאֹתוֹ उस व्यक्ति की मध्यस्थ भूमिका बताता है। संदर्भानुसार निहित बहुवचन कर्ता को हिंदी में स्वाभाविकता के लिए व्यक्त किया गया है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिंदी में परमेश्वर के व्यक्तिगत वाचा-नाम की स्थापित और व्यापक रूप से पहचानी जाने वाली वर्तनी रखी गई है।
- source_word: שְׂנֵאתִיו
  choice: मैं उससे घृणा करता हूँ
  rationale: पूर्ण क्रिया यहाँ राजा की स्थिर वर्तमान मनोवृत्ति व्यक्त करती है; हिंदी का सामान्य वर्तमान काल इसे स्वाभाविक ढंग से देता है।
- source_word: לֹא יִתְנַבֵּא עָלַי טוֹב כִּי אִם רָע
  choice: वह मेरे विषय में भलाई की नहीं, केवल बुराई की भविष्यवाणी करता है
  rationale: नकार और כִּי אִם का अपवादात्मक बल ‘नहीं, केवल’ से सुरक्षित रहता है। טוֹב और רָע की व्यापक नैतिक अथवा परिस्थितिजन्य अस्पष्टता ‘भलाई’ और ‘बुराई’ में बनी रहती है।
- source_word: מִיכָיְהוּ בֶּן־יִמְלָה
  choice: यिम्ला का पुत्र मीकायाह
  rationale: हिंदी बाइबिलीय नाम-परंपरा के अनुरूप लिप्यंतरण और स्वाभाविक वंशसूचक संरचना अपनाई गई है।
- source_word: אַל יֹאמַר הַמֶּלֶךְ כֵּן
  choice: राजा ऐसा न कहे
  rationale: אַל और जुसिव का निषेधात्मक भाव तथा यहोशापात की सम्मानपूर्ण दरबारी भाषा दोनों सुरक्षित रहते हैं।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: मूल पाठ में टेट्राग्रामटन सीधे आया है। शीर्षक से बदलने के बजाय व्यक्तिगत नाम रखा गया है; ‘यहोवा’ आधुनिक हिंदी बाइबिल पाठकों के लिए स्थापित रूप है।
- issue: טוֹב और רָע का आशय
  choice: भलाई और बुराई
  alternative: शुभ और अशुभ; कल्याण और विपत्ति
  rationale: राजा के कथन में ये शब्द नैतिक मूल्यांकन अथवा अनुकूल-प्रतिकूल परिणाम दोनों की ओर संकेत कर सकते हैं। व्यापक शब्दावली इस तनाव को बिना संकुचित किए बनाए रखती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सहज हिंदी में रखी गई है। ‘व्यक्ति’ सामान्य पाठक के लिए स्वाभाविक है, जबकि ‘राजा ऐसा न कहे’ मूल की सम्मानपूर्ण दरबारी शैली को बनाए रखता है। कोई पादटिप्पणी आवश्यक नहीं मानी गई।
