base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/041.yaml
  text: And Jehoshaphat son of Asa became king over Judah in the fourth year of Ahab king of Israel.
translation:
  language: hi
  text: और इस्राएल के राजा अहाब के शासन के चौथे वर्ष में आसा का पुत्र यहोशापात यहूदा का राजा बना।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וִ/יהֽוֹשָׁפָט
  choice: और ... यहोशापात
  rationale: वाव कथानक को पिछले प्रसंग से जोड़ता है, इसलिए ‘और’ रखा गया है; नाम का प्रचलित हिन्दी लिप्यंतरण ‘यहोशापात’ है।
- source_word: בֶּן אָסָא
  choice: आसा का पुत्र
  rationale: सम्बन्धवाचक रचना वंश-परिचय देती है; यह आधुनिक हिन्दी में स्वाभाविक और स्पष्ट है।
- source_word: מָלַךְ
  choice: राजा बना
  rationale: यहाँ क्रिया राजत्व आरम्भ होने, अर्थात् सिंहासनारोहण, को सूचित करती है; ‘राज्य करता था’ की अपेक्षा ‘राजा बना’ इस आरम्भिक भाव को अधिक ठीक व्यक्त करता है।
- source_word: עַל יְהוּדָה
  choice: यहूदा का राजा
  rationale: מָלַךְ के साथ עַל शासन के क्षेत्र को दर्शाता है। हिन्दी में ‘यहूदा पर राजा बना’ की अपेक्षा ‘यहूदा का राजा बना’ अधिक स्वाभाविक है और वही राजकीय अधिकार व्यक्त करता है।
- source_word: בִּ/שְׁנַת אַרְבַּע
  choice: चौथे वर्ष में
  rationale: यह राजकीय काल-निर्धारण का मानक सूत्र है; क्रमवाचक रूप हिन्दी में सहज है।
- source_word: לְ/אַחְאָב
  choice: अहाब के शासन के
  rationale: इस काल-निर्धारण सूत्र में לְ अहाब के राज्यकाल के सापेक्ष वर्ष बताता है। हिन्दी में अस्पष्टता से बचने के लिए ‘शासन’ स्पष्ट किया गया है।
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: इस्राएल के राजा
  rationale: यह अहाब की पदवी और शासन-क्षेत्र बताने वाला समानाधिकरण पद है; यह हिन्दी का स्वाभाविक रूप है।
theological_decisions: []
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण ऐतिहासिक शैली अपनाई गई है। मूल इब्रानी का कथात्मक संयोजक बनाए रखा गया है और वाक्य-विन्यास को हिन्दी की स्वाभाविक काल-सूचना के अनुसार व्यवस्थित किया गया है।
