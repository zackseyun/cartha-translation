  yaml_path: translation/ot/1_kings/022/054.yaml
  text: He served Baal and bowed down to him[a], and he provoked Yahweh, the God of Israel, just as his father had done.
translation:
  language: hi
  text: उसने बाल की सेवा की और उसे दण्डवत् किया[a]। इस प्रकार उसने इस्राएल के परमेश्वर यहोवा को क्रोधित किया, हर उस बात में जैसा उसके पिता ने किया था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उसकी उपासना की”; इब्रानी क्रिया का शाब्दिक अर्थ झुकना या भूमि पर गिरकर प्रणाम करना है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲבֹד
  choice: सेवा की
  rationale: עבד का मूल अर्थ ‘सेवा करना’ है और मूर्तिपूजक संदर्भ में यह उपासना-संबंधी सेवा को दर्शाता है; अगली क्रिया उपासना की ठोस मुद्रा बताती है।
- source_word: הַבַּעַל
  choice: बाल
  rationale: यहाँ यह कनानी देवता के प्रचलित नाम/उपाधि के रूप में प्रयुक्त है; हिन्दी में निश्चयवाचक उपपद अलग से देना अस्वाभाविक होगा।
- source_word: וַיִּשְׁתַּחֲוֶה לוֹ
  choice: उसके सामने दण्डवत् किया
  rationale: שׁחה झुकने या भूमि पर गिरकर प्रणाम करने की ठोस क्रिया बताता है और इस संदर्भ में उपासना का कार्य है; ‘दण्डवत् किया’ इस क्रिया को ‘सेवा की’ में विलीन नहीं करता।
- source_word: וַיַּכְעֵס
  choice: क्रोधित किया
  rationale: כעס का हिफ़ईल रूप किसी को क्रोध दिलाने का कारण बनना व्यक्त करता है; आधुनिक हिन्दी में ‘क्रोधित किया’ स्वाभाविक और स्पष्ट है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: व्यक्तिगत ईश्वरीय नाम को हिन्दी में प्रचलित लिप्यंतरण ‘यहोवा’ से प्रस्तुत किया गया है, न कि किसी उपाधि से बदला गया है।
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: इस्राएल के परमेश्वर
  rationale: यह संबंधवाचक पदबंध का सीधा और स्वाभाविक हिन्दी रूप है।
- source_word: כְּכֹל אֲשֶׁר עָשָׂה אָבִיו
  choice: ठीक वैसे ही जैसे उसके पिता ने किया था
  rationale: यह मूल के तुलनात्मक भाव ‘उस सब के अनुसार जो उसके पिता ने किया’ को सहज आधुनिक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल में इस्राएल के परमेश्वर का व्यक्तिगत नाम बाल के विपरीत रखा गया है। हिन्दी पाठकों में परिचित ‘यहोवा’ नामत्व को सुरक्षित रखता है; ‘याहवे’ अधिक प्रत्यक्ष शैक्षिक लिप्यंतरण है, पर सामान्य हिन्दी में कम परिचित है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य हिन्दी पाठक के लिए सहज रखी गई है। ‘सेवा की’ और ‘दण्डवत् किया’ दोनों रखकर मूल की दो अलग क्रियाओं तथा उपासना के ठोस संकेत को सुरक्षित रखा गया है।
