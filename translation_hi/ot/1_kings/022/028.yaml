  text: וַ/יֹּ֣אמֶר מִיכָ֔יְהוּ אִם שׁ֤וֹב תָּשׁוּב֙ בְּ/שָׁל֔וֹם לֹֽא דִבֶּ֥ר יְהוָ֖ה בִּ֑/י וַ/יֹּ֕אמֶר שִׁמְע֖וּ עַמִּ֥ים כֻּלָּֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/028.yaml
  text: And Micaiah said[a], “If you indeed return in peace, Yahweh has not spoken by me.” And he said, “Hear[b], all you peoples!”
translation:
  language: hi
  text: और मीकायाह ने कहा, “यदि तू सचमुच सकुशल लौट आए, तो यहोवा ने मेरे द्वारा बात नहीं की है।” फिर उसने कहा, “हे सब जातियों, सुनो!”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: मूल इब्रानी में “जातियों” बहुवचन है; यह पुकार केवल एक समूह को नहीं, बल्कि व्यापक रूप से सब जनसमूहों को संबोधित करती है।
    reason: cultural_note
lexical_decisions:
- source_word: מִיכָיְהוּ
  choice: मीकायाह
  rationale: इब्रानी नाम का प्रचलित और स्रोत के निकट देवनागरी लिप्यंतरण।
- source_word: אִם שׁוֹב תָּשׁוּב
  choice: यदि तू सचमुच ... लौट आए
  rationale: धातु के infinitive absolute और imperfect के मेल से उत्पन्न बल को स्वाभाविक आधुनिक हिन्दी में “सचमुच” से व्यक्त किया गया है।
- source_word: בְּשָׁלוֹם
  choice: सकुशल
  rationale: इस प्रसंग में अर्थ युद्ध से सुरक्षित और अहानिकर लौटना है; “सकुशल” हिन्दी में इसे संक्षेप और स्वाभाविक रूप से व्यक्त करता है।
- source_word: לֹא דִבֶּר יְהוָה בִּי
  choice: यहोवा ने मेरे द्वारा नहीं कहा है
  rationale: בִּי का भविष्यद्वक्तात्मक भाव वक्ता को ईश्वरीय वचन के माध्यम के रूप में दिखाता है; “मेरे द्वारा” उस भाव को स्पष्ट रखता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: चार-अक्षरीय ईश्वरीय नाम को उपाधि से बदलने के बजाय हिन्दी में परिचित नामरूप “यहोवा” से प्रस्तुत किया गया है।
- source_word: שִׁמְעוּ
  choice: सुनो
  rationale: बहुवचन आज्ञार्थक का सीधा, वर्तमान और सार्वजनिक आह्वान हिन्दी में “सुनो” है।
- source_word: עַמִּים כֻּלָּם
  choice: हे सब जातियो
  rationale: עַמִּים बहुवचन है और व्यापक जनसमूहों को संबोधित करता है; “जातियो” इस बहुवचन संबोधन को बनाए रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ के व्यक्तिगत ईश्वरीय नाम को “प्रभु” जैसी उपाधि से नहीं बदला गया। हिन्दी पाठकों में अधिक परिचित लिप्यंतरण “यहोवा” चुना गया, जबकि उच्चारण-पुनर्निर्माण “याहवे” भी संभव है।
- issue: अंतिम וַיֹּאמֶר का वक्ता
  choice: मीकायाह ही वक्ता बना रहता है—“फिर उसने कहा”
  alternative: इसे संपादकीय टिप्पणी या किसी अन्य वक्ता का कथन मानना
  rationale: निकटतम और व्याकरणतः सहज पूर्ववर्ती कर्ता मीकायाह है; पाठ बिना किसी नए कर्ता का संकेत दिए उसी की सार्वजनिक पुकार जारी रखता है।
- issue: भविष्यद्वक्तात्मक माध्यम בִּי
  choice: “मेरे द्वारा”
  alternative: “मुझमें” या “मेरे माध्यम से”
  rationale: “मेरे द्वारा” मूल पूर्वसर्ग की माध्यमवाचक शक्ति को स्वाभाविक हिन्दी में रखता है, बिना भविष्यवाणी की प्रक्रिया को आवश्यकता से अधिक समझाए।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सार्वजनिक भविष्यद्वक्तात्मक स्वर रखा गया है। राजा को संबोधन होने पर भी मूल का द्वितीय पुरुष एकवचन हिन्दी में “तू” से सुरक्षित रखा गया है। “सकुशल” प्रसंगगत अर्थ को स्वाभाविक बनाता है, और अंतिम पुकार में बहुवचन “जातियो” को जानबूझकर बनाए रखा गया है।
