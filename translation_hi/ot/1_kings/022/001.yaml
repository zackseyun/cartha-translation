base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/001.yaml
  text: For three years they remained without war between Aram and Israel[a][b].
translation:
  language: hi
  text: अराम और इस्राएल के बीच तीन वर्ष तक युद्ध नहीं हुआ।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वे तीन वर्ष तक बिना युद्ध के रहे।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּשְׁבוּ
  choice: …तक … नहीं हुआ
  rationale: ישׁב का मूल अर्थ ‘बैठना/रहना’ है, पर अवधि के साथ यह किसी स्थिति के बने रहने को व्यक्त करता है। स्वाभाविक हिन्दी में इसे ‘तीन वर्ष तक युद्ध नहीं हुआ’ के रूप में व्यक्त किया गया है।
- source_word: שָׁלֹשׁ שָׁנִים
  choice: तीन वर्ष तक
  rationale: यह समयावधि बताने वाला पद है; ‘तक’ हिन्दी में अवधि को स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
- source_word: אֵין מִלְחָמָה
  choice: युद्ध नहीं हुआ
  rationale: हिब्रू का भाव ‘युद्ध नहीं है’ है। ऐतिहासिक वर्णन और तीन वर्ष की अवधि के संदर्भ में ‘युद्ध नहीं हुआ’ सहज हिन्दी है।
- source_word: בֵּין ... וּבֵין
  choice: …के बीच
  rationale: दो पक्षों के पारस्परिक संबंध को आधुनिक हिन्दी में स्वाभाविक ढंग से व्यक्त करता है।
- source_word: אֲרָם
  choice: अराम
  rationale: हिब्रू जाति-राज्य के नाम का सीधा लिप्यंतरण रखा गया है; इसे बाद के भौगोलिक नाम ‘सीरिया’ से नहीं बदला गया।
- source_word: יִשְׂרָאֵל
  choice: इस्राएल
  rationale: हिब्रू नाम का हिन्दी में प्रचलित और स्रोत-सन्निकट लिप्यंतरण।
