  register: आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण कथात्मक शैली रखी गई है। राजाओं के बीच सम्बोधन में ‘आपके’ का प्रयोग स्वाभाविक सम्मानसूचक रूप में किया गया है; मूल इब्रानी में एकवचन द्वितीय पुरुष है।
