base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/050.yaml
  text: Then Ahaziah son of Ahab said to Jehoshaphat[b][a], “Let my servants go with your servants in the ships,” but Jehoshaphat was not willing.
translation:
  language: hi
  text: तब अहाब के पुत्र अहज्याह ने यहोशापात से कहा, “मेरे सेवक आपके सेवकों के साथ जहाज़ों पर जाएँ।” परन्तु यहोशापात राज़ी नहीं हुआ।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אָז
  choice: तब
  rationale: यह कालसूचक और क्रमसूचक पद अगले घटनाक्रम को आरम्भ करता है; ‘तब’ स्वाभाविक हिन्दी है।
- source_word: אֲחַזְיָהוּ בֶן אַחְאָב
  choice: अहाब के पुत्र अहज्याह
  rationale: नामों का प्रचलित हिन्दी लिप्यन्तरण किया गया है और בֶן का सम्बन्ध स्पष्ट रूप से व्यक्त किया गया है।
- source_word: יֵלְכוּ
  choice: जाएँ
  rationale: यहाँ क्रिया का रूप प्रस्ताव या विनम्र आग्रह प्रकट करता है; हिन्दी में संभावनार्थक ‘जाएँ’ वही भाव स्वाभाविक रूप से देता है।
- source_word: עֲבָדַי ... עֲבָדֶיךָ
  choice: मेरे सेवक ... आपके सेवकों
  rationale: עֶבֶד का अर्थ सेवक, दास या राजकीय कर्मचारी हो सकता है। समुद्री अभियान के प्रसंग में ‘सेवक’ व्यापक अर्थ और मूल की समानान्तर संरचना बनाए रखता है।
- source_word: בָּאֳנִיּוֹת
  choice: जहाज़ों पर
  rationale: בְּ का मूल अर्थ ‘में/पर’ है; हिन्दी में जहाज़ पर यात्रा करने के लिए ‘जहाज़ों पर’ अधिक स्वाभाविक है।
- source_word: וְלֹא אָבָה
  choice: परन्तु ... इसके लिए तैयार नहीं हुआ
  rationale: אָבָה इच्छा या सहमति व्यक्त करता है। यह अनुवाद ‘इन्कार किया’ की अपेक्षा मूल के ‘सहमत/इच्छुक न होने’ के भाव को निकटता से और स्वाभाविक हिन्दी में रखता है।
theological_decisions: []
