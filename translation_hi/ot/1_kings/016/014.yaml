  text: וְ/יֶ֛תֶר דִּבְרֵ֥י אֵלָ֖ה וְ/כָל אֲשֶׁ֣ר עָשָׂ֑ה הֲ/לֽוֹא הֵ֣ם כְּתוּבִ֗ים עַל סֵ֛פֶר דִּבְרֵ֥י הַ/יָּמִ֖ים לְ/מַלְכֵ֥י יִשְׂרָאֵֽל־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/014.yaml
  text: The rest of the acts of Elah[a], and all that he did—are they not written in the Book of the Chronicles of the Kings of Israel?
translation:
  language: hi
  text: एला के बाकी काम और उसने जो कुछ किया, क्या वह सब ‘इस्राएल के राजाओं के इतिहास की पुस्तक’[a] में नहीं लिखा है?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘इस्राएल के राजाओं के वृत्तांत में।’
    reason: दִּבְרֵי הַיָּמִים और סֵפֶר के संयुक्त पदबंध का अर्थ किसी आधिकारिक इतिहास-पुस्तक या राजकीय वृत्तांत से हो सकता है।
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי אֵלָה
  choice: एला के बाकी काम
  rationale: יֶתֶר का अर्थ ‘बाकी/शेष’ है और इस राजकीय सूत्र में דִּבְרֵי व्यक्ति के कामों या कार्यों को सूचित करता है। ‘बाकी काम’ आधुनिक हिन्दी में सहज और संक्षिप्त है।
- source_word: וְכָל אֲשֶׁר עָשָׂה
  choice: और उसने जो कुछ किया
  rationale: यह עָשָׂה के व्यापक अर्थ को बिना अनावश्यक विशिष्टीकरण के सीधे व्यक्त करता है।
- source_word: הֲלוֹא הֵם כְּתוּבִים
  choice: क्या वह सब ... नहीं लिखा है?
  rationale: הֲלוֹא सकारात्मक उत्तर की अपेक्षा रखने वाला आलंकारिक प्रश्न है। ‘वह सब’ पूर्ववर्ती दोनों पदों को समेटता है और हिन्दी में एकवचन सामूहिक क्रिया ‘लिखा है’ स्वाभाविक है।
- source_word: עַל סֵפֶר
  choice: पुस्तक में
  rationale: यद्यपि עַל का मूल अर्थ ‘पर’ है, लिखित सामग्री के किसी दस्तावेज़ में दर्ज होने के लिए हिन्दी में ‘पुस्तक में’ स्वाभाविक है।
- source_word: דִּבְרֵי הַיָּמִים לְמַלְכֵי יִשְׂרָאֵל
  choice: इस्राएल के राजाओं के इतिहास
  rationale: דִּבְרֵי הַיָּמִים यहाँ राजकीय अभिलेख या ऐतिहासिक वृत्तांत का शीर्षक है। ‘इतिहास’ सामान्य पाठक के लिए स्पष्ट है, जबकि ‘वृत्तांत’ को पादटिप्पणी में वास्तविक विकल्प के रूप में रखा गया है।
