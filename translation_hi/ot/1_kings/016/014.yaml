  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। मूल के राजकीय समापन-सूत्र और सकारात्मक उत्तर की अपेक्षा रखने वाले प्रश्न को सुरक्षित रखा गया है। पादटिप्पणी-चिह्न संबंधित पुस्तक-शीर्षक के बाद रखा गया है।
