  text: וְ/יֶ֨תֶר דִּבְרֵ֤י עָמְרִי֙ אֲשֶׁ֣ר עָשָׂ֔ה וּ/גְבוּרָת֖/וֹ אֲשֶׁ֣ר עָשָׂ֑ה הֲ/לֹֽא הֵ֣ם כְּתוּבִ֗ים עַל סֵ֛פֶר דִּבְרֵ֥י הַ/יָּמִ֖ים לְ/מַלְכֵ֥י יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/027.yaml
  text: The rest of the acts of Omri[a], what he did[b], and his might that he showed—are they not written in the Book of the Chronicles of the Kings of Israel?
translation:
  language: hi
  text: ओम्री के बाकी काम, जो उसने किए, और उसका पराक्रम[a], जो उसने दिखाया—क्या वे ‘इस्राएल के राजाओं के इतिहास की पुस्तक’[b] में लिखे नहीं हैं?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उसके पराक्रमी काम।” इब्रानी शब्द का अर्थ सामर्थ्य अथवा उस सामर्थ्य को प्रकट करने वाले काम—दोनों हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: यह इस्राएल के राजाओं के राजकीय वृत्तांतों के एक अभिलेख को दर्शाता है; यह बाइबल की इतिहास की पुस्तकों में से कोई पुस्तक नहीं है।
    reason: cultural_note
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי עָמְרִי
  choice: ओम्री के बाकी काम
  rationale: राजकीय सारांश के इस प्रचलित सूत्र में דִּבְרֵי का अर्थ केवल ‘बातें’ नहीं, बल्कि राजा के कामों या कार्यों का वृत्तांत है। ‘बाकी काम’ सहज हिन्दी में इसी भाव को व्यक्त करता है।
- source_word: אֲשֶׁר עָשָׂה
  choice: जो उसने किए
  rationale: यह सम्बन्धवाचक उपवाक्य ओम्री के कार्यों को स्पष्ट करता है; बहुवचन ‘काम’ के अनुरूप ‘किए’ स्वाभाविक है।
- source_word: וּגְבוּרָתוֹ
  choice: और उसका पराक्रम
  rationale: גְּבוּרָה शक्ति, वीरता अथवा उस शक्ति को प्रकट करने वाले महान कार्यों का बोध करा सकता है। ‘पराक्रम’ इस अर्थ-विस्तार को यथासम्भव बनाए रखता है।
- source_word: אֲשֶׁר עָשָׂה
  choice: जो उसने दिखाया
  rationale: पराक्रम के साथ शाब्दिक ‘जो उसने किया’ अस्वाभाविक होता; ‘जो उसने दिखाया’ मूल के क्रियात्मक भाव को स्पष्ट, स्वाभाविक हिन्दी में रखता है।
- source_word: הֲלֹא הֵם כְּתוּבִים
  choice: क्या वे ... लिखे नहीं हैं?
  rationale: यह सकारात्मक उत्तर की अपेक्षा रखने वाला आलंकारिक प्रश्न है। बहुवचन ‘वे’ मूल के הֵם को भी सुरक्षित रखता है।
- source_word: עַל סֵפֶר דִּבְרֵי הַיָּמִים לְמַלְכֵי יִשְׂרָאֵל
  choice: ‘इस्राएल के राजाओं के इतिहास की पुस्तक’ में
  rationale: यह राजाओं से सम्बन्धित वार्षिक अभिलेख या राजकीय वृत्तांत का शीर्षक है। ‘इतिहास की पुस्तक’ आधुनिक पाठक के लिए सुबोध है, और उद्धरण-चिह्न इसके शीर्षक-सदृश प्रयोग को दर्शाते हैं।
theological_decisions:
- issue: גְּבוּרָה का आशय अमूर्त शक्ति है या पराक्रम के कार्य
  choice: मुख्य पाठ में ‘पराक्रम’
  alternative: ‘पराक्रम के काम’ अथवा ‘शक्ति’
  rationale: मूल शब्द दोनों अर्थों की सम्भावना रखता है। ‘पराक्रम’ अमूर्त सामर्थ्य और उसके प्रदर्शन—दोनों की ओर संकेत कर सकता है; पादटिप्पणी वास्तविक शाब्दिक अस्पष्टता बताती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। मूल के राजकीय-सारांश सूत्र और आलंकारिक प्रश्न को सुरक्षित रखा गया है। पादटिप्पणी-चिह्न उन्हीं पदों पर लगाए गए हैं जिनसे उनकी व्याख्या सम्बन्धित है।
