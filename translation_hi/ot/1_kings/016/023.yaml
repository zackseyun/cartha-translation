  text: בִּ/שְׁנַת֩ שְׁלֹשִׁ֨ים וְ/אַחַ֜ת שָׁנָ֗ה לְ/אָסָא֙ מֶ֣לֶךְ יְהוּדָ֔ה מָלַ֤ךְ עָמְרִי֙ עַל יִשְׂרָאֵ֔ל שְׁתֵּ֥ים עֶשְׂרֵ֖ה שָׁנָ֑ה בְּ/תִרְצָ֖ה מָלַ֥ךְ שֵׁשׁ שָׁנִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/023.yaml
  text: In the thirty-first year of Asa king of Judah[a], Omri became king over Israel for twelve years; he reigned in Tirzah six years.
translation:
  language: hi
  text: यहूदा के राजा आसा के शासन के इकतीसवें वर्ष में, ओम्री इस्राएल का राजा बना और उसने बारह वर्ष शासन किया; इनमें से छह वर्ष उसने तिर्सा में शासन किया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בִּ/שְׁנַת ... שְׁלֹשִׁים וְ/אַחַת שָׁנָה
  choice: शासन के इकतीसवें वर्ष में
  rationale: यह इब्रानी राजकीय तिथि-सूत्र है। हिंदी में ‘शासन के इकतीसवें वर्ष में’ इसका स्वाभाविक और स्पष्ट रूप है।
- source_word: לְ/אָסָא מֶלֶךְ יְהוּדָה
  choice: यहूदा के राजा आसा के
  rationale: לְ यहाँ आसा के शासन-वर्ष के संदर्भ को चिह्नित करता है; हिंदी पदक्रम में राज्य और पद को नाम से पहले रखना स्वाभाविक है।
- source_word: מָלַךְ
  choice: राजा बना
  rationale: पहला प्रयोग राजपद ग्रहण करने का आरंभ बताता है, इसलिए केवल ‘शासन किया’ की अपेक्षा ‘राजा बना’ अधिक सटीक है।
- source_word: עַל יִשְׂרָאֵל
  choice: इस्राएल का राजा
  rationale: מלך के साथ עַל का अर्थ किसी प्रजा पर शासन करना है। हिंदी में ‘इस्राएल का राजा बना’ सहज रूप से यही संबंध व्यक्त करता है।
- source_word: שְׁתֵּים עֶשְׂרֵה שָׁנָה
  choice: बारह वर्ष
  rationale: यह ओम्री के शासन की कुल अवधि है।
- source_word: בְּ/תִרְצָה
  choice: तिर्सा में
  rationale: בְּ यहाँ स्थानवाचक है और उस नगर को बताता है जहाँ से उसने शासन किया।
- source_word: מָלַךְ שֵׁשׁ שָׁנִים
  choice: छह वर्ष उसने तिर्सा में शासन किया
  rationale: दूसरा प्रयोग किसी स्थान से किए गए शासन की अवधि बताता है। ‘इनमें से’ जोड़कर बारह वर्षों की कुल अवधि और तिर्सा के छह वर्षों का संबंध स्वाभाविक हिंदी में स्पष्ट किया गया है।
