source:
  edition: WLC
  text: וַ/יַּעֲשֶׂ֥ה עָמְרִ֛י הָ/רַ֖ע בְּ/עֵינֵ֣י יְהוָ֑ה וַ/יָּ֕רַע מִ/כֹּ֖ל אֲשֶׁ֥ר לְ/פָנָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/025.yaml
  text: Omri did what was evil in the eyes of Yahweh[a], and he did more evil than all who were before him.
translation:
  language: hi
  text: ओम्री ने वह किया जो याहवे की दृष्टि में बुरा था, और उसने उन सब से बढ़कर बुराई की जो उससे पहले थे।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “और वह उन सब से अधिक बुरा था जो उससे पहले थे।” इब्रानी क्रिया ओम्री के अपने चरित्र या उसके कामों का वर्णन कर सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲשֶׂה
  choice: ने…किया
  rationale: עשה के साथ הָרַע यहाँ किसी बुरे काम को करने का अर्थ देता है; ‘किया’ इस प्रचलित मूल्यांकन-सूत्र का स्वाभाविक हिन्दी रूप है।
- source_word: הָרַע
  choice: वह…जो…बुरा था
  rationale: संज्ञा की तरह प्रयुक्त הָרַע का आशय ‘जो बुरा था’ है; यह हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: בְּעֵינֵי
  choice: की दृष्टि में
  rationale: यह परमेश्वर के मूल्यांकन को व्यक्त करने वाला इब्रानी मुहावरा है। ‘की दृष्टि में’ मूल बिंब और अर्थ दोनों को बनाए रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय हिन्दी में ध्वन्यंतरित किया गया है।
- source_word: וַיָּרַע
  choice: उसने…से बढ़कर बुराई की
  rationale: संदर्भ में हिफ़ील क्रिया का तुलनात्मक मूल्यांकन है। यह अनुवाद पहली उपवाक्य की कर्म-संबंधी भाषा से निरंतरता रखता है, जबकि व्यक्ति के स्वयं अधिक बुरा होने की सम्भावना पादटिप्पणी में सुरक्षित है।
- source_word: מִכֹּל אֲשֶׁר לְפָנָיו
  choice: उन सब से…जो उससे पहले थे
  rationale: यह मूल की व्यापक और कुछ हद तक अनिर्दिष्ट अभिव्यक्ति को बनाए रखता है; ‘पहले के राजाओं’ कहना संदर्भतः उचित होता, पर ‘राजा’ इस पद में स्पष्ट रूप से नहीं है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा अथवा ‘प्रभु’
  rationale: मूल पाठ में व्यक्तिगत वाचा-नाम सीधे आया है; ‘याहवे’ उसे उपाधि से प्रतिस्थापित किए बिना प्रस्तुत करता है।
- issue: וַיָּרַע में कर्म या व्यक्ति पर बल
  choice: उसने…से बढ़कर बुराई की
  alternative: वह…से अधिक बुरा था
  rationale: इस राजकीय मूल्यांकन-सूत्र के संदर्भ में मुख्य पाठ कर्मों पर बल देता है, पर इब्रानी क्रिया ओम्री के चरित्र का वर्णन भी कर सकती है; इसलिए वैकल्पिक अर्थ पादटिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण कथन रखा गया है। ‘दृष्टि में’ मूल इब्रानी मुहावरे को स्वाभाविक हिन्दी में सुरक्षित रखता है। तुलना में ‘राजाओं’ जोड़ने से बचा गया है, क्योंकि वह इस पद में प्रत्यक्ष नहीं है।
