  text: וַ/יְהִ֨י בְ/מָלְכ֜/וֹ כְּ/שִׁבְתּ֣/וֹ עַל כִּסְא֗/וֹ הִכָּה֙ אֶת כָּל בֵּ֣ית בַּעְשָׁ֔א לֹֽא הִשְׁאִ֥יר ל֖/וֹ מַשְׁתִּ֣ין בְּ/קִ֑יר וְ/גֹאֲלָ֖י/ו וְ/רֵעֵֽ/הוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/011.yaml
  text: And it happened that when he became king[a], as soon as he sat on his throne, he struck down all the house of Baasha. He did not leave him a single male[b], or any of his kinsmen or his friends.
translation:
  language: hi
  text: और ऐसा हुआ कि जब वह राजा बना, तब सिंहासन पर बैठते ही उसने बाशा के पूरे घराने को मार डाला। उसने बाशा के लिए एक भी पुरुष[a] जीवित नहीं छोड़ा—न उसके किसी भी निकट संबंधी[b] को, न उसके किसी भी मित्र को।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: हिब्रू में शाब्दिक अर्थ है, “दीवार पर पेशाब करने वाला”—पुरुष के लिए प्रयुक्त एक अशिष्ट मुहावरा।
    reason: lexical_alternative
  - marker: b
    text: इस हिब्रू शब्द का अर्थ ऐसे निकट संबंधी हो सकता है जिस पर परिवार की ओर से बदला लेने या किसी व्यक्ति अथवा संपत्ति को छुड़ाने का दायित्व हो।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בְמָלְכוֹ
  choice: और जब वह राजा बना
  rationale: वाक्य को स्वाभाविक हिन्दी कथात्मक क्रम में रखते हुए וַיְהִי को 'और' से तथा בְמָלְכוֹ को राज्यारोहण के समय के रूप में व्यक्त किया गया है।
- source_word: כְשִׁבְתּוֹ עַל כִּסְאוֹ
  choice: सिंहासन पर बैठते ही
  rationale: כְּ के साथ क्रियार्थक संज्ञा यहाँ तत्काल समय-संबंध बताती है; 'बैठते ही' कार्रवाई की तत्परता को सहज हिन्दी में व्यक्त करता है।
- source_word: הִכָּה אֶת כָּל בֵּית בַּעְשָׁא
  choice: उसने बाशा के पूरे घराने को मार डाला
  rationale: संदर्भ में נכה घातक प्रहार है और בֵּית व्यक्ति के भौतिक मकान के बजाय उसके वंश/घराने को दर्शाता है।
- source_word: לֹא הִשְׁאִיר לוֹ
  choice: उसने बाशा के लिए ... जीवित नहीं छोड़ा
  rationale: לוֹ का संकेत स्पष्ट करने के लिए सर्वनाम के स्थान पर 'बाशा' रखा गया है; 'जीवित' प्रसंग में निहित अर्थ को स्पष्ट करता है।
- source_word: מַשְׁתִּין בְּקִיר
  choice: एक भी पुरुष
  rationale: यह शाब्दिक रूप से अशिष्ट हिब्रू मुहावरा है जिसका आशय पुरुष से है। मुख्य पाठ में अर्थ दिया गया और शाब्दिक रूप पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: וְגֹאֲלָיו
  choice: उसके किसी निकट संबंधी
  rationale: גֹּאֵל वह निकट संबंधी है जिस पर परिवार के उद्धार, संपत्ति छुड़ाने या रक्त का बदला लेने जैसे दायित्व हो सकते थे। हिन्दी में व्यापक पारिवारिक अर्थ रखा गया है।
- source_word: וְרֵעֵהוּ
  choice: किसी मित्र
  rationale: רֵעַ का सामान्य अर्थ मित्र या साथी है; यहाँ सरल और स्वाभाविक 'मित्र' उपयुक्त है।
theological_decisions:
- issue: גֹאֲלָיו की विशिष्ट भूमिका
  choice: निकट संबंधी
  alternative: बदला लेनेवाला / छुड़ानेवाला
  rationale: संदर्भ यह निश्चित नहीं करता कि संबंधी की कौन-सी पारिवारिक-कानूनी भूमिका प्रमुख है। इसलिए मुख्य पाठ में व्यापक अर्थ रखा गया और संभावित भूमिकाएँ पादटिप्पणी में दी गईं।
translation_notes:
  register: आधुनिक मानक हिन्दी; कथात्मक, गरिमापूर्ण और सामान्य पाठकों के लिए स्पष्ट। मूल की कठोर हिंसा को नरम नहीं किया गया, जबकि अशिष्ट मुहावरे का अर्थ मुख्य पाठ में और उसका शाब्दिक रूप पादटिप्पणी में दिया गया है।
