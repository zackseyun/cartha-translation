base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/003.yaml
  text: Behold[a], I am sweeping away Baasha and his house, and I will make your house like the house of Jeroboam son of Nebat.
translation:
  language: hi
  text: देख, मैं बाशा और उसके घराने को मिटाने वाला हूँ[a], और तेरे घराने को नबात के पुत्र यारोबाम के घराने के समान कर दूँगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक शाब्दिक रूप में: “मैं बाशा के पीछे और उसके घराने के पीछे जला रहा हूँ।” इब्रानी मुहावरे का आशय बाशा और उसके वंश को पूरी तरह मिटा देना है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנְנִי
  choice: देख, मैं
  rationale: यह पदबंध एक गंभीर ईश्वरीय घोषणा का संकेत देता है। आधुनिक हिन्दी में ‘देख’ उसकी भविष्यद्वाणी-संबंधी चेतावनी और बल को स्वाभाविक ढंग से बनाए रखता है।
- source_word: מַבְעִיר אַחֲרֵי
  choice: मिटा दूँगा
  rationale: हिफ़ील रूप और אַחֲרֵי के साथ बना मुहावरा बाशा के पीछे आनेवाले वंश सहित पूर्ण उन्मूलन का भाव देता है। शाब्दिक ‘पीछे जला रहा हूँ’ हिन्दी में अस्पष्ट और भ्रामक होगा।
- source_word: בֵיתוֹ / בֵיתְךָ
  choice: उसके घराने / तेरे घराने
  rationale: राजकीय संदर्भ में בַּיִת परिवार, वंश और राजवंश को समेटता है। ‘घराना’ हिन्दी में इस वंशगत अर्थ को स्पष्ट रखते हुए मूल बिंब भी बनाए रखता है।
- source_word: וְנָתַתִּי
  choice: कर दूँगा
  rationale: इस तुलनात्मक रचना में נתן का अर्थ किसी को किसी अन्य के समान दशा में पहुँचा देना है; इसलिए ‘कर दूँगा’ स्वाभाविक हिन्दी है।
- source_word: יָרָבְעָם בֶּן נְבָט
  choice: नबात के पुत्र यारोबाम
  rationale: व्यक्तिनाम और पितृनाम को आधुनिक मानक हिन्दी की स्वाभाविक रचना में प्रस्तुत किया गया है।
theological_decisions:
- issue: बाशा के वंश पर न्याय का स्वरूप
  choice: मुख्य पाठ में मुहावरे को पूरे घराने के उन्मूलन के रूप में व्यक्त किया गया है, बिना वास्तविक आग को न्याय का साधन ठहराए।
  alternative: ‘मैं बाशा के पीछे जला/भस्म कर रहा हूँ।’
  rationale: इब्रानी अभिव्यक्ति व्यापक वंशगत न्याय बताती है। अत्यधिक शाब्दिक अनुवाद हिन्दी में अस्पष्ट होगा और आग की विधि को अनावश्यक रूप से निश्चित कर सकता है।
translation_notes:
  register: भाषा आधुनिक, गंभीर और सामान्य पाठक के लिए सुबोध रखी गई है। ‘तेरे’ में सीधे ईश्वरीय संबोधन की एकवचन निकटता तथा न्यायसूचक दृढ़ता सुरक्षित है; ‘घराना’ राजवंशीय अर्थ को स्वाभाविक रूप से व्यक्त करता है।
