  yaml_path: translation/ot/1_kings/016/008.yaml
  text: In the twenty-sixth year of Asa king of Judah, Elah son of Baasha became king over Israel in Tirzah for two years.
translation:
  language: hi
  text: यहूदा के राजा आसा के शासन के छब्बीसवें वर्ष में बाशा का पुत्र एला तिर्सा में इस्राएल का राजा बना और उसने दो वर्ष तक राज्य किया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בִּשְׁנַת עֶשְׂרִים וָשֵׁשׁ שָׁנָה
  choice: शासन के छब्बीसवें वर्ष में
  rationale: यह इब्रानी राजकीय कालगणना का मुहावरा है। हिंदी में ‘शासन के छब्बीसवें वर्ष में’ काल-संदर्भ को स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
- source_word: לְאָסָא מֶלֶךְ יְהוּדָה
  choice: यहूदा के राजा आसा के
  rationale: לְ यहाँ आसा के राज्यकाल के संदर्भ को दर्शाता है। हिंदी पदक्रम में इसे पिछली काल-सूचक अभिव्यक्ति के साथ जोड़ना स्वाभाविक है।
- source_word: מָלַךְ
  choice: राजा बना और उसने ... राज्य किया
  rationale: इस राजारोहण-सूचना में क्रिया राजा बनने तथा उसके शासन—दोनों को समेटती है। अवधि को स्पष्ट रूप से क्रिया से जोड़ने के लिए हिंदी में दोनों पक्ष स्वाभाविक ढंग से व्यक्त किए गए हैं।
- source_word: אֵלָה
  choice: एला
  rationale: व्यक्तिवाचक नाम का प्रचलित हिंदी लिप्यंतरण।
- source_word: בֶן בַּעְשָׁא
  choice: बाशा का पुत्र
  rationale: इब्रानी संबंध-सूचक रचना का सीधा और गरिमापूर्ण हिंदी रूप।
- source_word: עַל יִשְׂרָאֵל
  choice: इस्राएल का राजा
  rationale: מלך על का अर्थ किसी जनसमुदाय या राज्य पर राज करना है। हिंदी में ‘इस्राएल का राजा बना’ स्वाभाविक है और कोई अतिरिक्त राज्य-संज्ञा नहीं जोड़ता।
- source_word: בְּתִרְצָה
  choice: तिर्सा में
  rationale: בְ यहाँ शासन के स्थान को सूचित करता है; ‘में’ इसका सहज हिंदी समतुल्य है।
- source_word: שְׁנָתָיִם
  choice: दो वर्ष तक
  rationale: द्विवचन रूप का अर्थ ‘दो वर्ष’ है; ‘तक’ शासन की अवधि को स्पष्ट और मुहावरेदार ढंग से व्यक्त करता है।
