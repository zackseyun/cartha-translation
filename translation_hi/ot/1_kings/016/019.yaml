  to: 'उसके उन पापों के कारण जो उसने किए थे: याहवे की दृष्टि में बुरा करना, यारोबाम के मार्ग पर चलना, और वह पाप करना जिसके द्वारा उसने इस्राएल को पाप कराया था।'
