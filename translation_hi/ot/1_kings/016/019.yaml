  text: עַל חטאת/ו אֲשֶׁ֣ר חָטָ֔א לַ/עֲשׂ֥וֹת הָ/רַ֖ע בְּ/עֵינֵ֣י יְהוָ֑ה לָ/לֶ֨כֶת֙ בְּ/דֶ֣רֶךְ יָרָבְעָ֔ם וּ/בְ/חַטָּאת/וֹ֙ אֲשֶׁ֣ר עָשָׂ֔ה לְ/הַחֲטִ֖יא אֶת יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/019.yaml
  text: because of his sins that he committed[a], doing what was evil in the eyes of Yahweh, walking in the way of Jeroboam and in the sin that he caused Israel to commit.
translation:
  language: hi
  text: 'उसके उन पापों के कारण जो उसने किए थे: याहवे की दृष्टि में बुरा करना, यारोबाम के मार्ग पर चलना, और वह पाप करना जिसके द्वारा उसने इस्राएल को पाप कराया था।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עַל חטאתו אֲשֶׁר חָטָא
  choice: उसके उन पापों के कारण जो उसने किए थे
  rationale: עַל यहाँ पिछले दंड/मृत्यु-वर्णन का कारण बताता है। संज्ञा और उसी मूल की क्रिया वाले इब्रानी प्रयोग को स्वाभाविक हिन्दी में बहुवचन ‘पापों... किए’ से व्यक्त किया गया है।
- source_word: לַעֲשׂוֹת הָרַע בְּעֵינֵי יְהוָה
  choice: याहवे की दृष्टि में बुरा करके
  rationale: यह वाक्यांश उसके पाप का स्वरूप स्पष्ट करता है; ‘दृष्टि में’ इब्रानी रूपक को सहज हिन्दी में सुरक्षित रखता है और יהוה को उसके व्यक्तिगत नाम ‘याहवे’ से प्रस्तुत करता है।
- source_word: לָלֶכֶת בְּדֶרֶךְ יָרָבְעָם
  choice: यारोबाम के मार्ग पर चलकर
  rationale: आचरण या जीवन-पद्धति के रूपक ‘मार्ग पर चलना’ को हिन्दी में बनाए रखा गया है।
- source_word: וּבְחַטָּאתוֹ אֲשֶׁר עָשָׂה לְהַחֲטִיא אֶת יִשְׂרָאֵל
  choice: और वह पाप करके जिसके द्वारा उसने इस्राएल से पाप करवाया
  rationale: हिफ़ील לְהַחֲטִיא का कारक अर्थ ‘पाप करवाना’ स्पष्ट रखा गया है। ‘जिसके द्वारा’ दूसरे पाप-वाक्यांश और इस्राएल को पाप कराने के बीच संबंध को बिना अस्वाभाविक दोहराव के व्यक्त करता है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: याहवे
  alternative: यहोवा / प्रभु
  rationale: मूल पाठ में चतुरक्षरी व्यक्तिगत नाम יהוה है; ‘याहवे’ उसे उपाधि से बदलने के बजाय नाम के रूप में प्रस्तुत करता है।
- issue: यारोबाम के पाप और इस्राएल को पाप कराने का संबंध
  choice: वह पाप जिसके द्वारा उसने इस्राएल से पाप करवाया
  alternative: उसका पाप जो उसने किया, इस्राएल को पाप कराते हुए
  rationale: यह प्रस्तुति मूल के कारक क्रियारूप को स्पष्ट करती है, पर पाप की सटीक प्रकृति के बारे में पाठ से अधिक धर्मवैज्ञानिक विवरण नहीं जोड़ती।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट हिन्दी। पद पिछले वाक्य पर आश्रित कारणसूचक खंड है, इसलिए पूर्ण विराम से पहले उसकी खंडात्मक संरचना बनाए रखी गई है।
