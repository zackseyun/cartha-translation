source:
  edition: WLC
  text: אָ֧ז יֵחָלֵ֛ק הָ/עָ֥ם יִשְׂרָאֵ֖ל לַ/חֵ֑צִי חֲצִ֨י הָ/עָ֜ם הָ֠יָה אַחֲרֵ֨י תִבְנִ֤י בֶן גִּינַת֙ לְ/הַמְלִיכ֔/וֹ וְ/הַ/חֲצִ֖י אַחֲרֵ֥י עָמְרִֽי־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/021.yaml
  text: 'Then the people of Israel were divided into two parts: half of the people followed Tibni son of Ginath[a], to make him king, and half followed Omri.'
translation:
  language: hi
  text: 'तब इस्राएल के लोग दो भागों में बँट गए: आधे लोग गीनत के पुत्र तिब्नी को राजा बनाने के लिए उसके पक्ष में थे, और आधे ओम्री के पक्ष में थे।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יֵחָלֵק
  choice: बँट गए
  rationale: निफ़अल रूप लोगों के विभाजित हो जाने को व्यक्त करता है; सामूहिक कर्ता के लिए आधुनिक हिन्दी में बहुवचन स्वाभाविक है।
- source_word: הָעָם יִשְׂרָאֵל
  choice: इस्राएल के लोग
  rationale: यह अभिव्यक्ति राष्ट्र के लोगों की पहचान कराती है और हिन्दी में सहज है।
- source_word: לַחֵצִי
  choice: दो भागों में
  rationale: पूर्वसर्ग सहित यह शब्द दो हिस्सों में विभाजन का अर्थ देता है; हिन्दी में यह स्पष्ट और स्वाभाविक है।
- source_word: חֲצִי הָעָם
  choice: आधे लोग
  rationale: दोनों दलों की समानांतरता और आधे-आधे विभाजन को संक्षेप तथा स्पष्टता से व्यक्त करता है।
- source_word: הָיָה אַחֲרֵי
  choice: के पक्ष में थे
  rationale: राजनीतिक उत्तराधिकार के इस संदर्भ में मुहावरे का अर्थ किसी दावेदार का समर्थन करना है; 'के पक्ष में' इस निष्ठा को 'पीछे चले' से अधिक स्पष्ट करता है।
- source_word: תִבְנִי בֶן גִּינַת
  choice: गीनत के पुत्र तिबनी
  rationale: नामों का देवनागरी लिप्यंतरण किया गया है और हिब्रू संबंध-रचना को स्वाभाविक हिन्दी क्रम में रखा गया है।
- source_word: לְהַמְלִיכוֹ
  choice: उसे राजा बनाना चाहते थे
  rationale: हिफ़ईल क्रिया का मूल अर्थ उसे राजा बनाना है; प्रसंग में उद्देश्य को सहज हिन्दी में व्यक्त करने के लिए 'चाहते थे' का प्रयोग किया गया है, बिना किसी राज्याभिषेक-विधि को जोड़े।
- source_word: וְהַחֲצִי אַחֲרֵי עָמְרִי
  choice: और आधे ओम्री के पक्ष में थे
  rationale: दूसरे अर्धवाक्य में क्रिया निहित है; समानांतर हिन्दी वाक्यांश उसे स्पष्ट रूप से पूरा करता है।
theological_decisions: []
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। राजनीतिक समर्थन के अर्थ को स्वाभाविक हिन्दी मुहावरे 'के पक्ष में' से व्यक्त किया गया है। मूल पाठ की संतुलित समानांतर रचना बनाए रखी गई है।
