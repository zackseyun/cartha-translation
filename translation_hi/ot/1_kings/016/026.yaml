source:
  edition: WLC
  text: וַ/יֵּ֗לֶךְ בְּ/כָל דֶּ֨רֶךְ֙ יָרָבְעָ֣ם בֶּן נְבָ֔ט ו/ב/חטאתי/ו אֲשֶׁ֥ר הֶחֱטִ֖יא אֶת יִשְׂרָאֵ֑ל לְ/הַכְעִ֗יס אֶת יְהוָ֛ה אֱלֹהֵ֥י יִשְׂרָאֵ֖ל בְּ/הַבְלֵי/הֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/026.yaml
  text: For he walked in all the way of Jeroboam son of Nebat[a], and in his sins by which he caused Israel to sin, provoking Yahweh, the God of Israel, with their idols.
translation:
  language: hi
  text: क्योंकि वह नबात के पुत्र यारोबाम के पूरे मार्ग पर चला और उसके उन पापों में चला, जिनके द्वारा उसने इस्राएल से पाप कराया, और उनकी मूर्तियों[a] के द्वारा इस्राएल के परमेश्वर याहवे को क्रोधित किया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “उनकी व्यर्थ वस्तुओं” या “उनकी निरर्थक चीज़ों”; यह मूर्तियों के लिए प्रयुक्त एक निंदात्मक शब्द है।
    reason: मूल इब्रानी रूपक और उसके वैकल्पिक शाब्दिक अर्थ को सुरक्षित रखना।
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: चलता रहा
  rationale: הלך यहाँ शारीरिक गति नहीं, बल्कि आचरण या जीवन-पद्धति को दर्शाता है। ‘चलता रहा’ इस बाइबिलीय रूपक और अपूर्ण भूतकालीन प्रवाह दोनों को स्वाभाविक हिन्दी में रखता है।
- source_word: בְּכָל דֶּרֶךְ
  choice: पूरे मार्ग पर
  rationale: एकवचन ‘मार्ग’ के साथ ‘पूरा’ यारोबाम के आचरण के नमूने का पूर्णतः अनुसरण करने का भाव देता है।
- source_word: יָרָבְעָם בֶּן נְבָט
  choice: नबात के पुत्र यारोबाम
  rationale: व्यक्तिनामों का मानक हिन्दी लिप्यंतरण और इब्रानी संबंध-संरचना का स्वाभाविक रूप।
- source_word: וּבְחַטֹּאתָיו
  choice: और उसके उन पापों में लगा रहा
  rationale: बहुवचन संज्ञा पर तृतीय पुरुष एकवचन प्रत्यय यारोबाम के पापों को सूचित करता है; ‘लगा रहा’ उसी आचरण में निरंतर संलग्नता स्पष्ट करता है।
- source_word: אֲשֶׁר הֶחֱטִיא אֶת־יִשְׂרָאֵל
  choice: जिनके द्वारा उसने इस्राएल से पाप कराया
  rationale: חטא का हिफ़ील रूप स्पष्ट रूप से कारक है; ‘पाप कराया’ उस कारणात्मक बल को बनाए रखता है।
- source_word: לְהַכְעִיס
  choice: इस प्रकार उसने ... को क्रोधित किया
  rationale: यह उद्देश्य या परिणाम का भाव दे सकता है। ‘इस प्रकार’ पूर्ववर्ती आचरण से परिणाम का संबंध स्वाभाविक हिन्दी में व्यक्त करता है, बिना किसी अतिरिक्त प्रेरणा को निश्चित किए।
- source_word: יְהוָה
  choice: याहवे
  rationale: टेट्राग्रामटन को किसी उपाधि से बदलने के बजाय परमेश्वर के व्यक्तिगत नाम के प्रचलित हिन्दी लिप्यंतरण से प्रस्तुत किया गया है।
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: इस्राएल के परमेश्वर
  rationale: यह संबंधवाचक पदबंध का सीधा और स्वाभाविक हिन्दी रूप है।
- source_word: בְּהַבְלֵיהֶם
  choice: उनकी मूर्तियों
  rationale: הבל का मूल अर्थ ‘वाष्प/व्यर्थता’ है, पर इस उपासना-संबंधी विवादात्मक संदर्भ में यह झूठे देवताओं या मूर्तियों को दर्शाता है। मुख्य पाठ में ‘मूर्तियों’ से संदर्भ स्पष्ट होता है और मूल रूपक पादटिप्पणी में सुरक्षित है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में व्यक्तिगत वाचा-नाम सीधे उपस्थित है। ‘याहवे’ उसे उपाधि से प्रतिस्थापित किए बिना प्रस्तुत करता है।
- issue: לְהַכְעִיס में उद्देश्य और परिणाम का संबंध
  choice: इस प्रकार उसने ... को क्रोधित किया
  alternative: ताकि वह ... को क्रोधित करे
  rationale: इब्रानी क्रियारूप उद्देश्य अथवा परिणाम दोनों का भाव ग्रहण कर सकता है। चुना हुआ रूप संबंध को बनाए रखता है, पर जानबूझकर किए गए उद्देश्य को अनावश्यक रूप से निश्चित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण कथात्मक स्तर रखा गया है। ‘मार्ग पर चलता रहा’ बाइबिलीय आचरण-रूपक को बचाता है, जबकि वाक्य-विभाजन से लंबी इब्रानी संरचना सामान्य पाठक के लिए स्पष्ट होती है।
