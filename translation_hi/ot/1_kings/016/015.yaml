  text: בִּ/שְׁנַת֩ עֶשְׂרִ֨ים וָ/שֶׁ֜בַע שָׁנָ֗ה לְ/אָסָא֙ מֶ֣לֶךְ יְהוּדָ֔ה מָלַ֥ךְ זִמְרִ֛י שִׁבְעַ֥ת יָמִ֖ים בְּ/תִרְצָ֑ה וְ/הָ/עָ֣ם חֹנִ֔ים עַֽל גִּבְּת֖וֹן אֲשֶׁ֥ר לַ/פְּלִשְׁתִּֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/015.yaml
  text: In the twenty-seventh year of Asa king of Judah[a], Zimri became king for seven days in Tirzah, while the people were camped against Gibbethon, which belonged to the Philistines.
translation:
  language: hi
  text: यहूदा के राजा आसा के शासन के सत्ताईसवें वर्ष में जिम्री ने तिर्सा में सात दिन राज्य किया। उस समय लोग गिब्बतोन के विरुद्ध[a] पड़ाव डाले हुए थे, जो पलिश्तियों का था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “गिब्बतोन में”; इस सैन्य संदर्भ में “गिब्बतोन के विरुद्ध” अधिक संभावित अर्थ है।
    reason: עַל स्थान (“में/पर”) या विरोध/आक्रमण की दिशा (“के विरुद्ध”) दोनों व्यक्त कर सकता है; पाठ की वास्तविक भाषिक संभावना सुरक्षित रखी गई है।
lexical_decisions:
- source_word: בִּשְׁנַת עֶשְׂרִים וָשֶׁבַע שָׁנָה לְאָסָא מֶלֶךְ יְהוּדָה
  choice: यहूदा के राजा आसा के शासन के सत्ताईसवें वर्ष में
  rationale: यह राजकीय कालगणना का मानक सूत्र है। हिंदी में ‘के शासन के ... वर्ष में’ संबंध और समय दोनों को स्पष्ट तथा स्वाभाविक रूप से व्यक्त करता है।
- source_word: מָלַךְ זִמְרִי שִׁבְעַת יָמִים
  choice: जिम्री ने ... सात दिन राज्य किया
  rationale: यहाँ מָלַךְ के साथ अवधि सीधे दी गई है, इसलिए ‘सात दिन राज्य किया’ मूल के व्याकरण और आशय को ‘सात दिनों के लिए राजा बना’ की अपेक्षा अधिक सीधे और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: בְּתִרְצָה
  choice: तिर्सा में
  rationale: सरल स्थानवाचक प्रयोग को प्रचलित हिंदी रूप में रखा गया है।
- source_word: וְהָעָם חֹנִים
  choice: उस समय लोग ... पड़ाव डाले हुए थे
  rationale: वाव से जुड़ी पृष्ठभूमि-परिस्थिति और वर्तमान कृदंत की जारी अवस्था को स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: עַל גִּבְּתוֹן
  choice: गिब्बतोन के विरुद्ध
  rationale: सैन्य संदर्भ में עַל नगर के प्रति विरोध या आक्रमण की दिशा सूचित कर सकता है। ‘के विरुद्ध’ यह अर्थ रखता है, पर ‘घेराबंदी कर रहे थे’ जैसी अधिक विशिष्ट बात नहीं जोड़ता।
- source_word: אֲשֶׁר לַפְּלִשְׁתִּים
  choice: पलिश्तियों के गिब्बतोन
  rationale: संबंधवाचक उपवाक्य को हिंदी की स्वाभाविक संबंध-संरचना में संक्षिप्त किया गया है; इससे यह स्पष्ट रहता है कि गिब्बतोन पलिश्तियों का था।
