  register: आधुनिक मानक हिंदी का सरल, गरिमापूर्ण ऐतिहासिक गद्य। ‘राज्य किया’ और ‘पड़ाव डाले हुए थे’ सामान्य पाठक के लिए सहज हैं, जबकि मूल की सैन्य और कालानुक्रमिक सूचना सुरक्षित रहती है।
