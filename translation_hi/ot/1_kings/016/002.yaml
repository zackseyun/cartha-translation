source:
  edition: WLC
  text: יַ֗עַן אֲשֶׁ֤ר הֲרִימֹתִ֨י/ךָ֙ מִן הֶ֣/עָפָ֔ר וָ/אֶתֶּנְ/ךָ֣ נָגִ֔יד עַ֖ל עַמִּ֣/י יִשְׂרָאֵ֑ל וַ/תֵּ֣לֶךְ בְּ/דֶ֣רֶךְ יָרָבְעָ֗ם וַֽ/תַּחֲטִא֙ אֶת עַמִּ֣/י יִשְׂרָאֵ֔ל לְ/הַכְעִיסֵ֖/נִי בְּ/חַטֹּאתָֽ/ם־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/002.yaml
  text: Because I raised you up from the dust and made you ruler over my people Israel[a], and you walked in the way of Jeroboam and caused my people Israel to sin, provoking me to anger by their sins,
translation:
  language: hi
  text: क्योंकि मैंने तुझे धूल से उठाकर अपनी प्रजा इस्राएल पर शासक बनाया, और तू यारोबाम की राह पर चला और मेरी प्रजा इस्राएल से पाप करवाया[a], और उनके पापों से मुझे क्रोधित किया,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मेरी प्रजा इस्राएल को पाप करने पर लगाया।” इब्रानी क्रिया कारणवाचक है।
    reason: हिफ़ील क्रिया के कारणवाचक अर्थ को एक स्वाभाविक वैकल्पिक हिन्दी अभिव्यक्ति में स्पष्ट करना।
lexical_decisions:
- source_word: יַעַן אֲשֶׁר
  choice: क्योंकि
  rationale: यह पद अगले पद में आने वाले न्याय का कारण बताता है। ‘क्योंकि’ आधुनिक हिन्दी में स्वाभाविक है और इब्रानी पदबंध की कारणसूचक शक्ति को बनाए रखता है।
- source_word: הֲרִימֹתִיךָ מִן הֶעָפָר
  choice: मैंने तुझे धूल में से उठाकर
  rationale: यह अनुवाद नीची दशा से ऊँचा किए जाने की मूल छवि और राजकीय उन्नति, दोनों को सुरक्षित रखता है।
- source_word: וָאֶתֶּנְךָ נָגִיד
  choice: शासक बनाया
  rationale: नָגִיד यहाँ नियुक्त अगुवे या शासक को सूचित करता है। ‘शासक’ वर्तमान हिन्दी में स्पष्ट है और राजकीय संदर्भ के अनुकूल है।
- source_word: עַל עַמִּי יִשְׂרָאֵל
  choice: अपनी प्रजा इस्राएल पर
  rationale: इससे परमेश्वर के स्वामित्व पर दिया गया बल और शासन का संबंध दोनों सुरक्षित रहते हैं।
- source_word: וַתֵּלֶךְ בְּדֶרֶךְ יָרָבְעָם
  choice: और तू यारोबाम की राह पर चला
  rationale: ‘राह पर चलना’ आचरण की पद्धति के लिए प्रयुक्त इब्रानी रूपक को स्वाभाविक हिन्दी में बनाए रखता है। ‘और’ मूल संयोजक का अनुसरण करता है और अनकहा विरोधसूचक भाव नहीं जोड़ता।
- source_word: וַתַּחֲטִא אֶת עַמִּי יִשְׂרָאֵל
  choice: और मेरी प्रजा इस्राएल से पाप करवाया
  rationale: 'हिफ़ील क्रिया का कारणवाचक अर्थ सीधे व्यक्त होता है: राजा ने लोगों को पाप करने के लिए प्रेरित किया या उसका कारण बना।'
- source_word: לְהַכְעִיסֵנִי
  choice: मुझे क्रोध दिलाया
  rationale: यह परिणाम अथवा उद्देश्य का भाव व्यक्त करते हुए परमेश्वर के विरुद्ध व्यक्तिगत अपराध को स्पष्ट रखता है।
- source_word: בְּחַטֹּאתָם
  choice: उनके पापों के द्वारा
  rationale: बहुवचन प्रत्यय को ‘उनके’ के रूप में सुरक्षित रखा गया है और בְ का साधनवाचक अर्थ ‘के द्वारा’ से व्यक्त हुआ है।
theological_decisions:
- issue: ‘उनके पापों’ में बहुवचन प्रत्यय का संदर्भ
  choice: इसे इस्राएल की प्रजा के पापों से संबंधित रखा गया है, जिन्हें बाशा ने पाप करवाया।
  alternative: इसे यारोबाम की राह से जुड़ी व्यापक पापमय प्रथाओं के रूप में समझा जा सकता है, जिनमें बाशा स्वयं भी सहभागी था।
  rationale: निकटतम पूर्वपद ‘मेरी प्रजा इस्राएल’ है; इसलिए बहुवचन प्रत्यय का सबसे स्वाभाविक संदर्भ प्रजा है। इससे राजा की अगुवाई की दोषिता और लोगों की अपनी पापपूर्ण भागीदारी दोनों बनी रहती हैं।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। ‘तुझे/तू’ एकवचन संबोधन और राजकीय भविष्यवाणी की सीधी गंभीरता को बनाए रखते हैं। पद अगले वाक्य में जारी रहता है, इसलिए अंत में अल्पविराम रखा गया है।
