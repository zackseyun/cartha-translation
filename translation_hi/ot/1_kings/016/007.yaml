base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/007.yaml
  text: And also through Jehu son of Hanani the prophet[a], the word of Yahweh came against Baasha and against his house, both because of all the evil that he did in the sight of Yahweh, provoking him to anger by the work of his hands, by becoming like the house of Jeroboam, and because he struck him down.
translation:
  language: hi
  text: और नबी हनानी के पुत्र येहू के द्वारा भी यहोवा का वचन बाशा और उसके घराने के विरुद्ध आया, उस सारी बुराई के कारण जो उसने यहोवा की दृष्टि में की थी—अपने हाथों के कामों से उसे क्रोधित करते हुए, यारोबाम के घराने के समान बनकर—और इसलिए भी कि उसने उसे[a] नष्ट कर दिया था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “उसे” यारोबाम स्वयं को या, इस प्रसंग में अधिक सम्भवतः, उसके घराने अथवा राजवंश को सामूहिक रूप में सूचित कर सकता है।
    reason: मूल हिब्रू का पुल्लिंग एकवचन प्रत्यय संदिग्ध है; सम्भव संदर्भों को सुरक्षित रखना आवश्यक है।
lexical_decisions:
- source_word: וְגַם
  choice: और ... भी
  rationale: यह पिछले न्याय-वर्णन से संबंध और अतिरिक्त बात दोनों व्यक्त करता है।
- source_word: בְּיַד
  choice: के द्वारा
  rationale: भविष्यद्वाणी के संदेश में माध्यम अथवा प्रतिनिधि का अर्थ देने वाला स्वाभाविक हिन्दी प्रयोग।
- source_word: דְּבַר יְהוָה
  choice: यहोवा का वचन
  rationale: मानक भविष्यद्वाणीय सूत्र को बनाए रखता है और יהוה को उसके व्यक्तिगत वाचा-नाम के रूप में प्रस्तुत करता है।
- source_word: אֶל ... וְאֶל
  choice: के विरुद्ध ... और ... के विरुद्ध
  rationale: न्याय की इस प्रसंगभूमि में संबंधसूचक पद का प्रतिकूल भाव है, केवल संदेश के प्राप्तकर्ता का नहीं।
- source_word: בֵּיתוֹ
  choice: उसके घराने
  rationale: यह परिवार के साथ-साथ राजवंश को भी समेट सकता है; इस संदर्भ में राजवंशीय अर्थ प्रमुख है।
- source_word: עַל כָּל הָרָעָה
  choice: क्योंकि उसने वे सब बुरे काम किए
  rationale: עַל यहाँ न्याय का कारण बताता है; हिन्दी में कारण स्पष्ट और स्वाभाविक ढंग से व्यक्त किया गया है।
- source_word: בְּעֵינֵי יְהוָה
  choice: यहोवा की दृष्टि में
  rationale: हिब्रू के प्रचलित मूल्यांकन-सूत्र और उसके दृष्टि-रूपक को बनाए रखता है।
- source_word: לְהַכְעִיסוֹ
  choice: उसे क्रोध दिलाया
  rationale: हिफ़ील क्रिया का कारणात्मक भाव संक्षिप्त और स्वाभाविक हिन्दी में व्यक्त होता है।
- source_word: בְּמַעֲשֵׂה יָדָיו
  choice: अपने हाथों के कामों से
  rationale: मूल का मूर्त मुहावरा सुरक्षित रहता है और उसके कार्यों, संभवतः मूर्तिपूजक कृतियों, की व्यापकता को अनावश्यक रूप से सीमित नहीं करता।
- source_word: לִהְיוֹת כְּבֵית יָרָבְעָם
  choice: वह यारोबाम के घराने के समान हो गया था
  rationale: परिणाम अथवा अवस्था का भाव स्पष्ट करता है और बाशा के घराने की यारोबाम के घराने से नैतिक-समानता बनाए रखता है।
- source_word: וְעַל אֲשֶׁר הִכָּה אֹתוֹ
  choice: यह वचन इसलिए भी आया क्योंकि उसने उसे नष्ट कर दिया था
  rationale: הכה का प्रसंगानुकूल विनाशकारी अर्थ व्यक्त करता है, जबकि पुल्लिंग एकवचन सर्वनाम की वास्तविक संदिग्धता को मुख्य पाठ में 'उसे' द्वारा सुरक्षित रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: व्यक्तिगत वाचा-नाम को उपाधि ‘प्रभु’ से प्रतिस्थापित नहीं किया गया; आधुनिक हिन्दी बाइबलीय परिचय में व्यापक रूप से पहचाना जाने वाला रूप ‘यहोवा’ चुना गया।
- issue: अंतिम पुल्लिंग एकवचन प्रत्यय אֹתוֹ का संदर्भ
  choice: उसे
  alternative: उस घराने को / यारोबाम को
  rationale: मूल व्याकरणिक रूप पुल्लिंग एकवचन है और उसका संदर्भ यारोबाम स्वयं अथवा उसके घराने/राजवंश को सामूहिक रूप में हो सकता है; अनुवाद इस तनाव को निर्णायक रूप से हल नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध। ‘घराना’ राजपरिवार और राजवंश दोनों का भाव देता है। मुख्य पाठ में [a] रखा गया है और पादटिप्पणी अंतिम सर्वनाम की संदिग्धता समझाती है।
