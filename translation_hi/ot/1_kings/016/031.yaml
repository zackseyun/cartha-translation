base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/031.yaml
  text: And as if it were a light thing for him to walk in the sins of Jeroboam son of Nebat[a], he took Jezebel daughter of Ethbaal, king of the Sidonians, as his wife, and went and served Baal and bowed down to him.
translation:
  language: hi
  text: और ऐसा हुआ कि नबात के पुत्र यारोबाम के पापों के मार्ग पर चलना मानो उसके लिए मामूली बात थी[a]; उसने सीदोनियों के राजा एतबाल की बेटी ईज़ेबेल को अपनी पत्नी बनाया, फिर जाकर बाल की सेवा की और उसके आगे दण्डवत किया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “क्या नबात के पुत्र यारोबाम के पापों के मार्ग पर चलना उसके लिए मामूली बात थी...?” इब्रानी आरम्भ को प्रश्न के रूप में भी समझा जा सकता है; यह व्यंग्यपूर्वक दिखाता है कि अहाब ने उन पापों को तुच्छ समझा।
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲנָקֵל
  choice: मानो ... उसके लिए मामूली बात थी
  rationale: यह इब्रानी मुहावरा प्रश्नात्मक भी समझा जा सकता है, पर संदर्भ में अहाब द्वारा यारोबाम के पापों को तुच्छ मानने और उनसे आगे बढ़ने की व्यंग्यात्मक तीव्रता व्यक्त करता है।
- source_word: לֶכְתּוֹ בְּחַטֹּאות
  choice: पापों पर चलना
  rationale: הלך के आचरण-संबंधी रूपक को बनाए रखते हुए यह किसी जीवन-पद्धति का अनुसरण व्यक्त करता है।
- source_word: וַיִּקַּח אִשָּׁה אֶת אִיזֶבֶל
  choice: ईज़ेबेल को अपनी पत्नी बनाया
  rationale: शाब्दिक अर्थ ‘पत्नी के रूप में लिया’ है; चुना हुआ रूप आधुनिक हिन्दी में स्वाभाविक है और विवाह का आशय स्पष्ट रखता है।
- source_word: אֶתְבַּעַל
  choice: एतबाल
  rationale: इब्रानी स्वरूप के निकट देवनागरी लिप्यंतरण।
- source_word: צִידֹנִים
  choice: सीदोनियों
  rationale: बहुवचन जातिवाचक संज्ञा को सीधे रूप में रखा गया है।
- source_word: וַיַּעֲבֹד אֶת הַבַּעַל
  choice: बाल की सेवा की
  rationale: उपासना-संदर्भ में עבד धार्मिक सेवा और निष्ठा बताता है; अगले क्रियापद ‘दण्डवत किया’ से इसका भेद भी बना रहता है।
- source_word: וַיִּשְׁתַּחוּ לוֹ
  choice: उसके आगे दण्डवत किया
  rationale: क्रिया का शारीरिक झुकने अथवा भूमि पर गिरकर प्रणाम करने का भाव सुरक्षित रहता है; इसे केवल सामान्य ‘आराधना की’ में नहीं मिलाया गया।
theological_decisions:
- issue: यारोबाम के पापों की तुलना में अहाब के धर्मत्याग की बढ़ती गंभीरता
  choice: 'आरम्भिक वाक्य को व्यंग्यात्मक कथन के रूप में रखा गया है: ‘मानो ... मामूली बात थी’।'
  alternative: 'इसे सीधे प्रश्न के रूप में पढ़ा जा सकता है: ‘क्या ... मामूली बात थी?’'
  rationale: दोनों संरचनाएँ इब्रानी הֲנָקֵל की संभावित शक्ति को दर्शाती हैं। मुख्य पाठ का रूप अहाब द्वारा पहले के पापों को तुच्छ समझकर बाल-सेवा की ओर आगे बढ़ने का कथात्मक उत्कर्ष स्पष्ट करता है, जबकि पादटिप्पणी वास्तविक व्याकरणिक अस्पष्टता बचाती है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य हिन्दी। ‘पापों पर चलना’, ‘सेवा की’ और ‘दण्डवत किया’ जैसे बाइबिलीय रूपक मूल की अलग-अलग क्रियाओं और धार्मिक आशय को सुरक्षित रखते हैं।
