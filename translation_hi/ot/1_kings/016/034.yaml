  text: בְּ/יָמָ֞י/ו בָּנָ֥ה חִיאֵ֛ל בֵּ֥ית הָאֱלִ֖י אֶת יְרִיחֹ֑ה בַּ/אֲבִירָ֨ם בְּכֹר֜/וֹ יִסְּדָ֗/הּ ו/ב/שגיב צְעִיר/וֹ֙ הִצִּ֣יב דְּלָתֶ֔י/הָ כִּ/דְבַ֣ר יְהוָ֔ה אֲשֶׁ֣ר דִּבֶּ֔ר בְּ/יַ֖ד יְהוֹשֻׁ֥עַ בִּן נֽוּן־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/034.yaml
  text: In his days Hiel of Bethel rebuilt Jericho[a]. At the cost of Abiram his firstborn he laid its foundation, and at the cost of Segub his youngest he set up its gates[b], according to the word of Yahweh that he had spoken through Joshua son of Nun.
translation:
  language: hi
  text: उसके दिनों में बेतेलवासी हीएल ने यरीहो को फिर से बनाया[a]। उसने अपने जेठे पुत्र अबीराम की कीमत पर उसकी नींव डाली और अपने सबसे छोटे पुत्र सगूब की कीमत पर उसके फाटक लगाए[b]। यह याहवे के उस वचन के अनुसार हुआ, जो उसने नून के पुत्र यहोशू के द्वारा कहा था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अधिक शाब्दिक रूप में, “यरीहो को बनाया।” “फिर से बनाया” इस संदर्भ को व्यक्त करता है कि यरीहो पहले नष्ट किया जा चुका था।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप में, “अबीराम, अपने जेठे पुत्र, में/के साथ ... और सगूब, अपने सबसे छोटे पुत्र, में/के साथ।” यहोशू 6:26 की पृष्ठभूमि में आशय यह है कि पुनर्निर्माण इन पुत्रों की हानि की कीमत पर हुआ।
    reason: alternative_reading
lexical_decisions:
- source_word: בְּיָמָיו
  choice: उसके दिनों में
  rationale: इब्रानी कालसूचक मुहावरे को निकटता से रखता है और पिछले संदर्भ में उल्लिखित राजा के समय की ओर संकेत करता है।
- source_word: בָּנָה
  choice: फिर से बनाया
  rationale: क्रिया का मूल अर्थ ‘बनाया’ है, पर यरीहो पहले नष्ट किया जा चुका था; इसलिए संदर्भगत अर्थ ‘फिर से बनाया’ मुख्य पाठ में स्वाभाविक है और शाब्दिक विकल्प पाद-टिप्पणी में दिया गया है।
- source_word: חִיאֵל בֵּית הָאֱלִי
  choice: बेतेलवासी हीएल
  rationale: यह पदबंध हीएल का बेतेल से संबंध या मूल स्थान बताता है; ‘बेतेलवासी’ संक्षिप्त और स्वाभाविक हिन्दी है।
- source_word: בַּאֲבִירָם בְּכֹרוֹ
  choice: अपने पहलौठे अबीराम की कीमत पर
  rationale: पूर्वसर्ग ב यहाँ यहोशू 6:26 की प्रतिध्वनि में निर्माण से जुड़ी पुत्र-हानि व्यक्त करता जान पड़ता है; ‘की कीमत पर’ अर्थ स्पष्ट करता है, पर मृत्यु की रीति जैसी कोई अतिरिक्त बात नहीं जोड़ता।
- source_word: יִסְּדָהּ
  choice: उसकी नींव डाली
  rationale: नगर-निर्माण के संदर्भ में יסד नींव डालने को दर्शाता है; स्त्रीलिंग प्रत्यय यरीहो की ओर संकेत करता है।
- source_word: וּבִשְׂגוּב צְעִירוֹ
  choice: अपने सबसे छोटे पुत्र सगूब की कीमत पर
  rationale: यह पहले पुत्र वाले समानांतर पदबंध के अनुरूप है; पारिवारिक जन्म-क्रम के संदर्भ में צעיר का अर्थ ‘सबसे छोटा’ है। स्पष्टता के लिए ‘पुत्र’ निहित संबंध को व्यक्त करता है।
- source_word: הִצִּיב דְּלָתֶיהָ
  choice: उसके फाटक खड़े किए
  rationale: नगर के संदर्भ में דלתות नगर-द्वारों के पल्लों अथवा फाटकों को सूचित करता है; ‘फाटक खड़े किए’ हिन्दी में निर्माण की अंतिम अवस्था को स्वाभाविक रूप से व्यक्त करता है।
- source_word: כִּדְבַר יְהוָה
  choice: याहवे के उस वचन के अनुसार
  rationale: वाचा-संबंधी सूत्र को स्पष्ट रखता है और יהוה के व्यक्तिगत नाम को ‘याहवे’ के रूप में प्रस्तुत करता है।
- source_word: אֲשֶׁר דִּבֶּר בְּיַד
  choice: जो उसने ... के द्वारा कहा था
  rationale: ביד यहाँ माध्यम या प्रतिनिधि को दर्शाने वाला प्रचलित इब्रानी प्रयोग है; ‘के द्वारा’ आधुनिक हिन्दी में स्वाभाविक है।
- source_word: יְהוֹשֻׁעַ בִּן נוּן
  choice: नून के पुत्र यहोशू
  rationale: इब्रानी पितृनाम-सूत्र का स्पष्ट और प्रचलित हिन्दी रूप।
theological_decisions:
- issue: हीएल के पुत्रों से संबंधित शाप-पूर्ति वाले कथन का आशय
  choice: मुख्य पाठ बताता है कि यरीहो का पुनर्निर्माण हीएल के पहलौठे और सबसे छोटे पुत्र की हानि की कीमत पर हुआ।
  alternative: अधिक शब्दशः रूप ‘अपने पहलौठे अबीराम के साथ/में उसने नींव डाली ... और अपने सबसे छोटे सगूब के साथ/में उसने फाटक खड़े किए’ निर्माण की अवस्थाओं और पुत्रों के बीच संबंध को कम स्पष्ट छोड़ता है।
  rationale: यह भाषा यहोशू 6:26 को प्रतिध्वनित करती है और स्वाभाविक रूप से शाप की पूर्ति में पुत्रों की मृत्यु की ओर संकेत करती है। फिर भी मुख्य पाठ मृत्यु की रीति या कारण नहीं जोड़ता, और पाद-टिप्पणी इब्रानी पूर्वसर्ग की शाब्दिक अस्पष्टता सुरक्षित रखती है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, सरल किंतु गरिमापूर्ण रखी गई है। ‘उसके दिनों में’ और ‘वचन के अनुसार’ जैसे वाक्यांश मूल की शैली बनाए रखते हैं। नामों के लिए प्रचलित हिन्दी बाइबलीय रूप—बेतेल, हीएल, यरीहो, अबीराम, सगूब, यहोशू और नून—अपनाए गए हैं।
