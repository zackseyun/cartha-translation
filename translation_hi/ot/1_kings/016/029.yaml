source:
  edition: WLC
  text: וְ/אַחְאָ֣ב בֶּן עָמְרִ֗י מָלַךְ֙ עַל יִשְׂרָאֵ֔ל בִּ/שְׁנַ֨ת שְׁלֹשִׁ֤ים וּ/שְׁמֹנֶה֙ שָׁנָ֔ה לְ/אָסָ֖א מֶ֣לֶךְ יְהוּדָ֑ה וַ֠/יִּמְלֹךְ אַחְאָ֨ב בֶּן עָמְרִ֤י עַל יִשְׂרָאֵל֙ בְּ/שֹׁ֣מְר֔וֹן עֶשְׂרִ֥ים וּ/שְׁתַּ֖יִם שָׁנָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/029.yaml
  text: And Ahab son of Omri became king over Israel in the thirty-eighth year of Asa king of Judah, and Ahab son of Omri reigned over Israel in Samaria twenty-two years.
translation:
  language: hi
  text: और यहूदा के राजा आसा के राज्य के अड़तीसवें वर्ष में ओम्री का पुत्र अहाब इस्राएल का राजा बना। ओम्री के पुत्र अहाब ने शोमरोन में इस्राएल पर बाईस वर्ष तक राज्य किया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מָלַךְ
  choice: राजा बना
  rationale: राजकीय कालक्रम-सूत्र में यह पूर्ण क्रिया अहाब के राजगद्दी संभालने को सूचित करती है; इससे आगे आए शासनकाल की अवधि वाले कथन से भेद बना रहता है।
- source_word: בִּשְׁנַת שְׁלֹשִׁים וּשְׁמֹנֶה שָׁנָה
  choice: शासन के अड़तीसवें वर्ष में
  rationale: इब्रानी तिथि-सूत्र का क्रमवाचक अर्थ स्वाभाविक हिन्दी में व्यक्त होता है और आसा के शासन के साथ काल-सामंजस्य सुरक्षित रहता है।
- source_word: לְאָסָא מֶלֶךְ יְהוּדָה
  choice: यहूदा के राजा आसा के शासन के
  rationale: לְ का काल-संदर्भ यहाँ आसा के राजकीय वर्ष से है; हिन्दी में ‘शासन के’ जोड़ना आशय स्पष्ट और सहज बनाता है।
- source_word: וַיִּמְלֹךְ
  choice: शासन किया
  rationale: इसके बाद बाईस वर्ष की अवधि दी गई है, इसलिए यह चयन राज्यारोहण के बजाय शासन की निरंतर अवधि व्यक्त करता है।
- source_word: בְּשֹׁמְרוֹן
  choice: शोमरोन में रहकर
  rationale: בְ स्थान सूचित करता है। ‘में रहकर’ इस अर्थ को स्पष्ट करता है कि शोमरोन अहाब की राजकीय राजधानी या शासन-केंद्र था, बिना यह कहे कि उसने शोमरोन पर शासन किया।
- source_word: עֶשְׂרִים וּשְׁתַּיִם שָׁנָה
  choice: बाईस वर्ष तक
  rationale: ‘तक’ हिन्दी में शासनकाल की अवधि को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: וְ
  choice: और
  rationale: यह संयोजक पिछले राजकीय वृत्तांत से कथानक की निरंतरता बनाए रखता है।
