  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण राजकीय वृत्तांत। प्रचलित बाइबिलीय नाम-रूप ‘आसा’, ‘ओम्री’, ‘अहाब’, ‘इस्राएल’ और ‘शोमरोन’ रखे गए हैं। कोई पादटिप्पणी आवश्यक नहीं है।
