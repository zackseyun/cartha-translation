base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/010.yaml
  text: Then Zimri came in, struck him down, and killed him, in the twenty-seventh year of Asa king of Judah; and he reigned in his place.
translation:
  language: hi
  text: तब जिम्री भीतर आया, उसने उस पर प्रहार किया और उसे मार डाला। यह यहूदा के राजा आसा के शासन के सत्ताईसवें वर्ष में हुआ। फिर जिम्री उसके स्थान पर राजा बना।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּבֹא
  choice: तब ... भीतर आया
  rationale: בוא का अर्थ ‘आना/प्रवेश करना’ है। हत्या के प्रसंग में ‘भीतर आया’ स्वाभाविक रूप से प्रवेश का भाव देता है, पर स्थान को अनावश्यक रूप से निश्चित नहीं करता। ‘तब’ कथात्मक क्रम को व्यक्त करता है।
- source_word: זִמְרִי
  choice: जिम्री
  rationale: व्यक्तिनाम का आधुनिक मानक हिन्दी में प्रचलित बाइबलीय लिप्यंतरण।
- source_word: וַיַּכֵּהוּ
  choice: उसने उसे मारा
  rationale: נכה का मूल अर्थ ‘मारना/प्रहार करना’ है। अगले क्रियापद में मृत्यु स्पष्ट होने के कारण यहाँ पहले हिंसक प्रहार को अलग रखा गया है।
- source_word: וַיְמִיתֵהוּ
  choice: उसकी हत्या कर दी
  rationale: מות के हिफ़ील रूप का अर्थ ‘मार डालना’ है। इस षड्यंत्रपूर्ण प्रसंग में ‘हत्या कर दी’ प्रत्यक्ष और स्वाभाविक है।
- source_word: בִּשְׁנַת עֶשְׂרִים וָשֶׁבַע
  choice: शासन के सत्ताईसवें वर्ष में
  rationale: यह राजकीय वर्ष बताने का सूत्र है; हिन्दी में राजा के नाम के साथ ‘शासन के ... वर्ष में’ अर्थ को स्पष्ट और सहज बनाता है।
- source_word: לְאָסָא מֶלֶךְ יְהוּדָה
  choice: यहूदा के राजा आसा के
  rationale: לְ यहाँ राजकीय काल-गणना का संदर्भ बताता है। हिन्दी की स्वाभाविक पद-रचना के अनुसार राज्य और उपाधि को नाम से पहले रखा गया है।
- source_word: וַיִּמְלֹךְ
  choice: राजा बना
  rationale: מלך का अर्थ ‘राज करना’ या ‘राजा बनना’ हो सकता है। תַּחְתָּיו के साथ यहाँ राजसिंहासन पर उत्तराधिकार ग्रहण करना प्रमुख है, इसलिए ‘राजा बना’ स्वाभाविक है।
- source_word: תַּחְתָּיו
  choice: उसके स्थान पर
  rationale: राजकीय उत्तराधिकार के प्रसंग में इसका अर्थ पूर्व राजा की जगह लेना है; ‘उसके स्थान पर’ मूल अभिव्यक्ति को पारदर्शी ढंग से रखता है।
