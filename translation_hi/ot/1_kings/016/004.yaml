  edition: WLC
  text: הַ/מֵּ֤ת לְ/בַעְשָׁא֙ בָּ/עִ֔יר יֹֽאכְל֖וּ הַ/כְּלָבִ֑ים וְ/הַ/מֵּ֥ת ל/וֹ֙ בַּ/שָּׂדֶ֔ה יֹאכְל֖וּ ע֥וֹף הַ/שָּׁמָֽיִם׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/004.yaml
  text: Whoever belonging to Baasha dies in the city[a], the dogs will eat; and whoever belonging to him dies in the field[b], the birds of the heavens will eat.
translation:
  language: hi
  text: बाशा से संबंधित[a] जो कोई नगर में मरेगा, उसे कुत्ते खाएँगे; और उससे संबंधित जो कोई खुले मैदान में मरेगा, उसे आकाश के पक्षी[b] खाएँगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “बाशा का” या “बाशा के लोगों में से।” इब्रानी में संबंध या अधिकार बताने वाली रचना है, जिसका आशय संभवतः उसके घराने या राजवंश के लोग हैं।
    reason: lexical_alternative
  - marker: b
    text: या “आसमान के पक्षी।”
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמֵּת לְבַעְשָׁא
  choice: बाशा का जो कोई ... मरेगा
  rationale: एकवचन कृदंत यहाँ सामान्य अर्थ में बाशा से संबंध रखने वाले किसी भी व्यक्ति को दर्शाता है। ‘जो कोई ... मरेगा’ स्वाभाविक हिन्दी है, और ‘बाशा का’ संबंध को बनाए रखता है, बिना उसे स्पष्ट रूप से परिवार या राजवंश तक सीमित किए।
- source_word: בָּעִיר
  choice: नगर में
  rationale: यह בְּ का सीधा स्थानवाचक प्रयोग है; ‘नगर’ अगले खंड के ‘मैदान’ के साथ स्पष्ट विरोध बनाता है।
- source_word: יֹאכְלוּ הַכְּלָבִים
  choice: उसे कुत्ते खाएँगे
  rationale: אָכַל का मूल अर्थ ‘खाना’ है। हिन्दी में कर्म ‘उसे’ जोड़ने से वाक्य स्वाभाविक और आशय स्पष्ट होता है।
- source_word: וְהַמֵּת לוֹ
  choice: और उसका जो कोई ... मरेगा
  rationale: सर्वनाम बाशा की ओर संकेत करता है और पहले खंड के समान संबंधसूचक रचना को बनाए रखता है।
- source_word: בַּשָּׂדֶה
  choice: मैदान में
  rationale: שׂדה खेत या खुले भूभाग को सूचित कर सकता है। ‘मैदान’ नगर के बाहर खुले क्षेत्र का भाव देता है और ‘नगर’ के साथ अपेक्षित विरोध बनाए रखता है।
- source_word: עוֹף הַשָּׁמָיִם
  choice: आकाश के पक्षी
  rationale: सामूहिक עוֹף को हिन्दी में बहुवचन ‘पक्षी’ से स्वाभाविक रूप से व्यक्त किया गया है; ‘आकाश के’ इब्रानी संबंधवाचक रचना को बनाए रखता है।
theological_decisions:
- issue: לְבַעְשָׁא / לוֹ से सूचित संबंध की सीमा
  choice: ‘बाशा का’ और ‘उसका’ कहकर संबंध को खुला रखा गया है।
  alternative: ‘बाशा के घराने/राजवंश का’
  rationale: संदर्भ घराने या राजवंश की ओर संकेत कर सकता है, पर इस पद की इब्रानी रचना स्वयं उसे स्पष्ट रूप से निर्दिष्ट नहीं करती; इसलिए अनुवाद में अधिक संकीर्ण अर्थ नहीं थोपा गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। समानांतर खंडों की संरचना तथा नगर/मैदान का विरोध सुरक्षित है।
