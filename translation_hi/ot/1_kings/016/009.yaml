source:
  edition: WLC
  text: וַ/יִּקְשֹׁ֤ר עָלָי/ו֙ עַבְדּ֣/וֹ זִמְרִ֔י שַׂ֖ר מַחֲצִ֣ית הָ/רָ֑כֶב וְ/ה֤וּא בְ/תִרְצָה֙ שֹׁתֶ֣ה שִׁכּ֔וֹר בֵּ֣ית אַרְצָ֔א אֲשֶׁ֥ר עַל הַ/בַּ֖יִת בְּ/תִרְצָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/009.yaml
  text: But his servant Zimri[a], commander of half the chariots, conspired against him while he was in Tirzah, drinking himself drunk in the house of Arza[b], who was over the household in Tirzah.
translation:
  language: hi
  text: परन्तु उसके सेवक जिम्री ने, जो आधे रथ-दल का सेनापति था, उसके विरुद्ध षड्यंत्र रचा। उस समय बाशा तिर्सा में अर्सा के घर में पीते-पीते नशे में धुत हो रहा था[a]। अर्सा तिर्सा में राजमहल का प्रबंधक था[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “नशे में धुत होने तक पी रहा था।” इब्रानी अभिव्यक्ति लगातार पीने और उसके परिणामस्वरूप होने वाले नशे को सजीव रूप में व्यक्त करती है।
    reason: lexical_alternative
  - marker: b
    text: “राजमहल का प्रबंधक” एक प्रशासनिक पद था; संभवतः यह राजकीय गृह या महल की व्यवस्था के प्रभारी अधिकारी को दर्शाता है।
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּקְשֹׁר עָלָיו
  choice: उसके विरुद्ध षड्यंत्र रचा
  rationale: קשר के साथ עַל राजकीय वृत्तांत में किसी शासक के विरुद्ध राजनीतिक षड्यंत्र का संकेत देता है; यह हिंदी में स्वाभाविक और अर्थ-सटीक है।
- source_word: עַבְדּוֹ
  choice: उसके सेवक
  rationale: עבד का मूल अर्थ ‘सेवक’ है; राजकीय संदर्भ में वह अधिकारी भी हो सकता है, किंतु मूल शब्दावली को बनाए रखने के लिए ‘सेवक’ रखा गया है।
- source_word: זִמְרִי
  choice: जिम्री
  rationale: व्यक्तिवाचक नाम का हिंदी लिप्यंतरण।
- source_word: שַׂר מַחֲצִית הָרָכֶב
  choice: आधे रथ-दल का सेनापति
  rationale: שַׂר नेतृत्व या सेनापति को और רכב यहाँ रथों की सैन्य टुकड़ी को दर्शाता है; ‘रथ-दल’ हिंदी में सामूहिक सैन्य अर्थ स्पष्ट करता है।
- source_word: וְהוּא בְתִרְצָה
  choice: उस समय वह तिर्सा में
  rationale: सर्वनाम प्रसंग की समकालिक परिस्थिति बताता है; ‘उस समय’ इस संबंध को स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: שֹׁתֶה שִׁכּוֹר
  choice: पीते-पीते मतवाला हो रहा था
  rationale: यह प्रयोग चल रही मदिरापान की क्रिया और उससे उत्पन्न नशे दोनों को सजीव ढंग से व्यक्त करता है, केवल स्थिर अवस्था ‘नशे में था’ नहीं।
- source_word: בֵּית אַרְצָא
  choice: अर्सा के घर में
  rationale: בית के साथ व्यक्तिवाचक नाम का सीधा और स्वाभाविक हिंदी रूप।
- source_word: אֲשֶׁר עַל הַבַּיִת
  choice: राजघराने का प्रबंधक था
  rationale: यह इब्रानी पद राजकीय गृह अथवा महल के प्रशासन के प्रभारी अधिकारी को सूचित करता है; ‘प्रबंधक’ उसके प्रशासनिक दायित्व को स्पष्ट करता है।
- source_word: בְּתִרְצָה
  choice: तिर्सा में
  rationale: अंत में स्थान की पुनरावृत्ति मूल इब्रानी के अनुरूप रखी गई है।
