translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और कथात्मक रखी गई है। मूल इब्रानी की पुनरावृत्ति और मदिरापान की सजीव प्रगतिशील क्रिया सुरक्षित रखी गई है; लंबे इब्रानी वाक्य को हिंदी में स्पष्टता के लिए तीन वाक्यों में बाँटा गया है।
