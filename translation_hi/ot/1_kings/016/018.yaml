  yaml_path: translation/ot/1_kings/016/018.yaml
  text: And when Zimri saw that the city had been captured[a], he went into the citadel of the king’s house and burned the king’s house over himself with fire[b], and died.
translation:
  language: hi
  text: जब जिम्री ने देखा कि नगर पर अधिकार कर लिया गया था, तब वह राजमहल के दुर्गनुमा भाग में गया और उसने राजभवन को अपने ऊपर आग लगाकर जला दिया, और वह मर गया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּ/רְאוֹת
  choice: जब ... ने देखा
  rationale: כ के साथ infinitive construct यहाँ समयसूचक है; यह हिंदी में स्वाभाविक रूप से अगले कार्यों की परिस्थिति बताता है।
- source_word: נִלְכְּדָה הָעִיר
  choice: नगर पर अधिकार कर लिया गया है
  rationale: לכד के निफ़अल रूप का अर्थ नगर का पकड़ लिया जाना या जीत लिया जाना है; प्रसंग में सैन्य अधिकार का भाव स्पष्ट है।
- source_word: אַרְמוֹן בֵּית הַמֶּלֶךְ
  choice: राजमहल के गढ़वाले भाग
  rationale: אַרְמוֹן किसी सुदृढ़ राजकीय भवन या दुर्गनुमा भीतरी भाग को सूचित कर सकता है। यह चयन उसके बाद आने वाले בֵּית מֶלֶךְ से भेद बनाए रखते हुए हिंदी में अर्थ स्पष्ट करता है।
- source_word: וַיִּשְׂרֹף עָלָיו אֶת בֵּית מֶלֶךְ בָּאֵשׁ
  choice: उसने राजभवन को अपने ऊपर आग लगा दी
  rationale: अनुवाद आग लगाने की क्रिया और अपने ही ऊपर भवन जलाने के आत्मविनाशकारी भाव को बनाए रखता है, बिना भवन के ढहने जैसी अतिरिक्त बात जोड़े।
- source_word: וַיָּמֹת
  choice: और वह मर गया
  rationale: यह हिब्रू कथा का सरल क्रमवर्ती कथन है और पूर्ववर्ती कार्य का परिणाम बताता है।
