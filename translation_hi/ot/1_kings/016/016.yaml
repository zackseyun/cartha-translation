  yaml_path: translation/ot/1_kings/016/016.yaml
  text: And the people who were camped there heard it said, “Zimri has conspired and has also struck down the king.” So all Israel made Omri, the commander of the army over Israel, king that day in the camp.
translation:
  language: hi
  text: छावनी में डेरा डाले हुए लोगों ने यह बात सुनी, “जिम्री ने षड्यंत्र किया है और राजा को भी मार डाला है।” तब उसी दिन छावनी में समस्त इस्राएल ने सेनापति ओम्री को इस्राएल का राजा बना दिया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָעָם הַחֹנִים
  choice: वहाँ छावनी डाले हुए लोगों
  rationale: यह पदबंध शिविर में ठहरे लोगों को दर्शाता है; प्रसंगानुसार ‘वहाँ’ हिंदी में संदर्भ स्पष्ट करता है।
- source_word: קָשַׁר
  choice: षड्यंत्र किया है
  rationale: राजा के विरुद्ध राजनीतिक साजिश या राजद्रोही योजना के अर्थ को स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: הִכָּה אֶת־הַמֶּלֶךְ
  choice: राजा को भी मार डाला है
  rationale: यहाँ נכה प्रसंग में राजा की हत्या को सूचित करता है, इसलिए केवल ‘प्रहार किया’ अपर्याप्त होगा।
- source_word: שַׂר צָבָא
  choice: सेनापति
  rationale: सैन्य बल के प्रधान अधिकारी के लिए संक्षिप्त और प्रचलित हिंदी पद।
- source_word: וַיַּמְלִכוּ ... אֶת־עָמְרִי
  choice: ओम्री को ... राजा बना दिया
  rationale: हिफ़ील रूप का राजपद पर स्थापित करने वाला कारक अर्थ स्पष्ट करता है।
theological_decisions:
- issue: ‘समस्त इस्राएल’ का विस्तार
  choice: समस्त इस्राएल
  alternative: सभी इस्राएलियों
  rationale: मूल के सामूहिक राजनीतिक पद כָל־יִשְׂרָאֵל को बनाए रखा गया है; इसे हर व्यक्ति के निरपेक्ष अर्थ में स्पष्ट नहीं किया गया।
- issue: ओम्री की सैन्य उपाधि और ‘इस्राएल’ का संबंध
  choice: सेनापति ओम्री को इस्राएल का राजा
  alternative: इस्राएल की सेना के सेनापति ओम्री को राजा
  rationale: मूल शब्दक्रम में עַל־יִשְׂרָאֵל का संबंध ओम्री को राजा बनाने से है; इसलिए उसे सैन्य उपाधि से जोड़कर अर्थ को अनावश्यक रूप से निश्चित नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिंदी; कथात्मक, गरिमापूर्ण और साधारण पाठकों के लिए स्पष्ट। नामों के रूप ‘जिम्री’ और ‘ओम्री’ रखे गए हैं।
