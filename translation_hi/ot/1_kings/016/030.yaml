  edition: WLC
  text: וַ/יַּ֨עַשׂ אַחְאָ֧ב בֶּן עָמְרִ֛י הָ/רַ֖ע בְּ/עֵינֵ֣י יְהוָ֑ה מִ/כֹּ֖ל אֲשֶׁ֥ר לְ/פָנָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/030.yaml
  text: Ahab son of Omri did what was evil in the sight of Yahweh[b][a], more than all who were before him.
translation:
  language: hi
  text: ओम्री के पुत्र अहाब ने यहोवा की दृष्टि में बुराई की, उससे पहले के सभी लोगों से भी बढ़कर।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: ने ... किया
  rationale: עשה का सामान्य अर्थ ‘करना’ है; ‘जो बुरा था’ के साथ यह इब्रानी मुहावरे को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: הָרַע
  choice: वह ... जो बुरा था
  rationale: निश्चित लेख के साथ विशेषण संज्ञा की तरह प्रयुक्त है; यह रूप ‘बुराई की’ अपेक्षा मूल संरचना और नैतिक मूल्यांकन दोनों को स्पष्ट रखता है।
- source_word: בְּעֵינֵי יְהוָה
  choice: यहोवा की दृष्टि में
  rationale: शाब्दिक ‘यहोवा की आँखों में’ के बजाय यह प्रचलित हिन्दी मुहावरा वही आशय देता है कि कार्य का मूल्यांकन यहोवा की दृष्टि से किया गया।
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिन्दी में दिव्य नाम के स्थापित लिप्यंतरण ‘यहोवा’ का प्रयोग व्यक्तिगत वाचा-नाम को किसी उपाधि से बदले बिना करता है।
- source_word: מִכֹּל אֲשֶׁר לְפָנָיו
  choice: उन सब से बढ़कर जो उससे पहले हुए थे
  rationale: तुलनात्मक מִן और कालवाचक לְפָנָיו को स्वाभाविक हिन्दी में व्यक्त करता है तथा पिछले सभी शासकों की तुलना बनाए रखता है।
theological_decisions:
- issue: दिव्य नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल में चतुरक्षरीय व्यक्तिगत नाम है। ‘यहोवा’ आधुनिक हिन्दी बाइबलीय प्रयोग में व्यापक और सहज रूप से पहचाना जाने वाला लिप्यंतरण है; इसे ‘प्रभु’ जैसी उपाधि से नहीं बदला गया।
- issue: तुलना का आशय
  choice: उन सब से बढ़कर जो उससे पहले हुए थे
  alternative: अपने सभी पूर्ववर्तियों से अधिक
  rationale: मूल पाठ केवल ‘उससे पहले’ वालों को कहता है; संदर्भ में वे पूर्ववर्ती राजा हैं, पर मुख्य पाठ में ‘राजा’ जोड़कर निहित अर्थ को अनावश्यक रूप से स्पष्ट नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और कथात्मक शैली। इब्रानी शब्दक्रम की कठोर नकल से बचते हुए मूल का नैतिक मूल्यांकन और तुलनात्मक बल सुरक्षित रखा गया है।
