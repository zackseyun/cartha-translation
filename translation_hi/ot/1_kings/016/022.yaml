  yaml_path: translation/ot/1_kings/016/022.yaml
  text: But the people who followed Omri prevailed over the people who followed Tibni son of Ginath. So Tibni died[a], and Omri became king.
translation:
  language: hi
  text: परन्तु जो लोग ओम्री के पक्ष में थे, वे गीनत के पुत्र तिब्नी के पक्ष के लोगों पर प्रबल हो गए[a]। तब तिब्नी मर गया और ओम्री राजा बन गया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उनसे अधिक शक्तिशाली हो गए।” इब्रानी क्रिया शक्ति बढ़ने या दूसरे पक्ष पर बढ़त पाने—दोनों का भाव दे सकती है; यहाँ ओम्री के दल ने संघर्ष में बढ़त पा ली।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֶּחֱזַק ... אֶת
  choice: पर प्रबल हो गए
  rationale: חזק के साथ אֶת यहाँ प्रतिद्वंद्वी दल पर शक्ति अथवा बढ़त प्राप्त करने का भाव देता है। ‘पर प्रबल हो गए’ राजनीतिक संघर्ष में एक पक्ष के हावी होने को स्वाभाविक और स्पष्ट हिन्दी में व्यक्त करता है।
- source_word: הָעָם אֲשֶׁר אַחֲרֵי עָמְרִי
  choice: जो लोग ओम्री के पक्ष में थे
  rationale: इस राजनीतिक संदर्भ में אַחֲרֵי किसी के पीछे चलने से अधिक उसका समर्थन करने या उसके दल में होने का अर्थ रखता है।
- source_word: הָעָם אֲשֶׁר אַחֲרֵי תִּבְנִי
  choice: तिब्नी के पक्ष के लोग
  rationale: यह समानांतर वाक्यांश तिब्नी का समर्थन करने वाले प्रतिद्वंद्वी दल को दर्शाता है; हिन्दी में अनावश्यक पुनरावृत्ति से बचते हुए समान राजनीतिक अर्थ रखा गया है।
- source_word: תִּבְנִי בֶן גִּינַת
  choice: गीनत का पुत्र तिब्नी
  rationale: בן को सामान्य वंश-सूचक ‘पुत्र’ से अनूदित किया गया है और नामों का देवनागरी लिप्यंतरण किया गया है।
- source_word: וַיָּמָת תִּבְנִי
  choice: तब तिब्नी मर गया
  rationale: वाव-क्रमिक कथा को आगे बढ़ाता है। ‘तब’ घटनाक्रम को दिखाता है, पर तिब्नी की मृत्यु का अनिर्दिष्ट कारण नहीं बताता।
- source_word: וַיִּמְלֹךְ עָמְרִי
  choice: ओम्री राजा बन गया
  rationale: यहाँ מלך प्रतिद्वंद्वी की मृत्यु के बाद ओम्री के राजपद ग्रहण करने को व्यक्त करता है; ‘राजा बन गया’ इस संदर्भ में केवल ‘राज्य किया’ से अधिक सटीक है।
