  text: וַ/יַּ֥עַשׂ אַחְאָ֖ב אֶת הָ/אֲשֵׁרָ֑ה וַ/יּ֨וֹסֶף אַחְאָ֜ב לַ/עֲשׂ֗וֹת לְ/הַכְעִיס֙ אֶת יְהֹוָה֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל מִ/כֹּ֨ל מַלְכֵ֣י יִשְׂרָאֵ֔ל אֲשֶׁ֥ר הָי֖וּ לְ/פָנָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/033.yaml
  text: Ahab also made the Asherah[a], and Ahab went on to do more to provoke Yahweh, the God of Israel, than all the kings of Israel who were before him.
translation:
  language: hi
  text: अहाब ने अशेरा[a] भी बनाया। अहाब इस्राएल के परमेश्वर यहोवा को क्रोधित करनेवाले काम करता गया, और उसने उससे पहले हुए इस्राएल के सभी राजाओं से बढ़कर ऐसा किया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “अशेरा-स्तंभ।” इब्रानी शब्द אֲשֵׁרָה देवी अशेरा या उससे संबद्ध उपासना-वस्तु को सूचित कर सकता है।
    reason: वैकल्पिक अर्थ और मूल शब्द की वास्तविक संदिग्धता स्पष्ट करना।
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: बनवाई
  rationale: עשה का मूल अर्थ ‘बनाना/करना’ है। राजकीय कर्ता और उपासना-वस्तु के संदर्भ में हिंदी का प्रेरणार्थक ‘बनवाई’ स्वाभाविक है और यह आवश्यक नहीं ठहराता कि अहाब ने उसे अपने हाथों से बनाया।
- source_word: הָאֲשֵׁרָה
  choice: अशेरा
  rationale: इब्रानी शब्द देवी अशेरा अथवा उससे जुड़ी उपासना-वस्तु, दोनों का संकेत दे सकता है। मुख्य पाठ में नाम का लिप्यंतरण इस संदिग्धता को बनाए रखता है।
- source_word: וַיּוֹסֶף ... לַעֲשׂוֹת
  choice: काम ... से बढ़कर किए
  rationale: יסף के साथ infinitive वृद्धि या आगे बढ़ने का भाव देता है। आगामी तुलनात्मक מִכֹּל को साथ लेकर यह वाक्यांश बताता है कि अहाब के काम पहले के सभी राजाओं से बढ़कर यहोवा को क्रोधित करनेवाले थे।
- source_word: לְהַכְעִיס
  choice: क्रोधित करनेवाले
  rationale: כעס का हिफ़ील रूप किसी को क्रोध दिलाने या भड़काने का कारणात्मक अर्थ देता है। यह हिंदी में स्पष्ट और सहज है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: व्यक्तिगत ईश्वरीय नाम को शीर्षक से बदलने के बजाय हिंदी में प्रचलित लिप्यंतरण ‘यहोवा’ से व्यक्त किया गया है।
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: इस्राएल के परमेश्वर
  rationale: यह सीधी संबंधवाचक रचना है, जो यहोवा की पहचान इस्राएल के परमेश्वर के रूप में करती है।
- source_word: מִכֹּל מַלְכֵי יִשְׂרָאֵל
  choice: उन सभी इस्राएली राजाओं से बढ़कर
  rationale: तुलनात्मक מִן को हिंदी में ‘से बढ़कर’ द्वारा स्वाभाविक और स्पष्ट रूप से व्यक्त किया गया है।
- source_word: אֲשֶׁר הָיוּ לְפָנָיו
  choice: जो उससे पहले हुए थे
  rationale: यह पदबंध अहाब से पहले शासन करनेवाले राजाओं की ओर संकेत करता है; हिंदी में यह निकट और स्पष्ट रूपांतरण है।
theological_decisions:
- issue: אֲשֵׁרָה का अभिप्राय
  choice: मुख्य पाठ में ‘अशेरा’ रखकर देवी और उससे जुड़ी उपासना-वस्तु के बीच निर्णय नहीं किया गया।
  alternative: ‘अशेरा-खंभा’ अथवा ‘देवी अशेरा’
  rationale: इस पद में इब्रानी शब्द का आशय स्वयं देवी भी हो सकता है और उसका उपासना-चिह्न भी। स्रोत जिस अर्थ को स्पष्ट नहीं करता, अनुवाद भी उसे चुपचाप निश्चित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिंदी, सरल किंतु गरिमापूर्ण शैली। ‘अशेरा’ जैसे अपरिचित सांस्कृतिक शब्द को मुख्य पाठ में सुरक्षित रखकर पादटिप्पणी में समझाया गया है।
