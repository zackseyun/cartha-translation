  text: And Omri slept with his fathers and was buried in Samaria[a], and Ahab his son reigned in his place.
translation:
  language: hi
  text: फिर ओम्री अपने पुरखों के साथ सो गया[a] और सामरिया में उसे दफ़नाया गया। उसकी जगह उसका पुत्र अहाब राजा हुआ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “अपने पुरखों के साथ सो गया” राजकीय वृत्तांतों में मृत्यु के लिए प्रयुक्त एक पारंपरिक इब्रानी अभिव्यक्ति है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁכַּב ... עִם אֲבֹתָיו
  choice: अपने पुरखों के साथ सो गया
  rationale: यह राजकीय वृत्तांतों में मृत्यु के लिए प्रयुक्त पारंपरिक इब्रानी मुहावरा है। शाब्दिक छवि और सूत्रात्मक शैली को बनाए रखते हुए अर्थ फुटनोट में स्पष्ट किया गया है।
- source_word: וַיִּקָּבֵר
  choice: उसे दफ़नाया गया
  rationale: निफ़अल रूप का स्वाभाविक हिन्दी निष्क्रिय अनुवाद है; यह आधुनिक पाठकों के लिए सहज है।
- source_word: בְּשֹׁמְרוֹן
  choice: सामरिया में
  rationale: पूर्वसर्ग ב यहाँ दफ़नाने के स्थान को सूचित करता है।
- source_word: וַיִּמְלֹךְ
  choice: राजा हुआ
  rationale: उत्तराधिकार के इस सूत्र में क्रिया का अर्थ राजसत्ता ग्रहण करना है; 'राजा हुआ' संक्षिप्त और स्वाभाविक हिन्दी है तथा अनावश्यक कालगत विस्तार नहीं जोड़ता।
- source_word: תַּחְתָּיו
  choice: उसकी जगह
  rationale: यह वंशगत उत्तराधिकार और पूर्व राजा के स्थान पर आने का भाव ठीक प्रकार व्यक्त करता है।
