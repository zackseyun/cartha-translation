  text: וַ/יִּ֜קֶן אֶת הָ/הָ֥ר שֹׁמְר֛וֹן מֵ֥/אֶת שֶׁ֖מֶר בְּ/כִכְּרַ֣יִם כָּ֑סֶף וַ/יִּ֨בֶן֙ אֶת הָ/הָ֔ר וַ/יִּקְרָ֗א אֶת שֵׁ֤ם הָ/עִיר֙ אֲשֶׁ֣ר בָּנָ֔ה עַ֣ל שֶׁם שֶׁ֔מֶר אֲדֹנֵ֖י הָ/הָ֥ר שֹׁמְרֽוֹן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/024.yaml
  text: He bought the hill of Samaria from Shemer for two talents of silver[a], built on the hill, and called the name of the city that he built Samaria, after the name of Shemer[b], the owner of the hill.
translation:
  language: hi
  text: उसने शोमरोन की पहाड़ी शेमेर से दो किक्कार चाँदी देकर खरीदी[a]। उसने उस पहाड़ी पर निर्माण किया और जिस नगर को उसने बनाया उसका नाम, उस पहाड़ी के मालिक शेमेर के नाम पर, शोमरोन रखा[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: किक्कार बहुमूल्य धातुओं को तौलने की एक प्राचीन और बड़ी भार-इकाई थी।
    reason: cultural_note
  - marker: b
    text: ‘शोमरोन’ नाम यहाँ पहाड़ी के मालिक ‘शेमेर’ के नाम से जोड़ा गया है।
    reason: name_explanation
lexical_decisions:
- source_word: וַיִּקֶן
  choice: खरीदा
  rationale: यहाँ קנה मूल्य देकर भूमि प्राप्त करने को दर्शाता है; आधुनिक हिन्दी में ‘खरीदा’ सबसे स्वाभाविक है।
- source_word: הָהָר
  choice: पहाड़ी
  rationale: הַר का अर्थ पहाड़ या पहाड़ी हो सकता है; नगर के स्थल के इस संदर्भ में ‘पहाड़ी’ अधिक स्वाभाविक है।
- source_word: שֹׁמְרוֹן
  choice: शोमरोन
  rationale: इब्रानी स्थान-नाम का निकट देवनागरी लिप्यंतरण है और शेमेर के साथ नाम-संबंध को बनाए रखता है।
- source_word: מֵאֵת שֶׁמֶר
  choice: शेमेर से
  rationale: पूर्वसर्ग उस व्यक्ति को दर्शाता है जिससे यह संपत्ति खरीदी गई।
- source_word: בְּכִכְּרַיִם כָּסֶף
  choice: दो किक्कार चाँदी में
  rationale: כִּכָּר बहुमूल्य धातु के भार की बड़ी प्राचीन इकाई है और द्विवचन रूप का अर्थ ‘दो किक्कार’ है। मूल सांस्कृतिक माप को पाठ में रखा गया है और पादटिप्पणी में समझाया गया है।
- source_word: וַיִּבֶן אֶת הָהָר
  choice: उस पहाड़ी पर निर्माण किया
  rationale: शाब्दिक रूप ‘पहाड़ी को बनाया’ हिन्दी में भ्रामक होगा; आशय पहाड़ी पर भवन अथवा नगर का निर्माण करना है, पर अनावश्यक विशिष्टता नहीं जोड़ी गई।
- source_word: וַיִּקְרָא אֶת שֵׁם הָעִיר
  choice: नगर का नाम … रखा
  rationale: यह इब्रानी नामकरण-वाक्यांश का स्वाभाविक आधुनिक हिन्दी रूप है।
- source_word: אֲשֶׁר בָּנָה
  choice: अपने बनाए हुए
  rationale: यह नगर के निर्माण को उसी कर्ता से जोड़ता है और हिन्दी में कथानक का क्रम स्पष्ट रखता है।
- source_word: עַל שֵׁם
  choice: के नाम पर
  rationale: यह किसी व्यक्ति के नाम के आधार पर नगर का नाम रखने का स्पष्ट और प्रचलित हिन्दी मुहावरा है।
- source_word: אֲדֹנֵי הָהָר
  choice: पहाड़ी के स्वामी
  rationale: यहाँ אֲדֹנֵי संपत्ति पर अधिकार रखने वाले व्यक्ति को दर्शाता है, न कि कोई ईश्वरीय उपाधि; ‘स्वामी’ इस संदर्भ में मालिकाना अर्थ व्यक्त करता है।
