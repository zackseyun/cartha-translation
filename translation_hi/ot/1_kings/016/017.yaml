  text: तब ओम्री और उसके साथ समस्त इस्राएल गिब्बतोन से चढ़कर गए और उन्होंने तिर्सा की घेराबंदी की।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעֲלֶה
  choice: चढ़कर ... आए
  rationale: עלה के सामान्य गमनार्थ ‘ऊपर जाना/चढ़ना’ को बनाए रखता है; इससे स्थलाकृति या सैनिक चढ़ाई में से किसी एक को अनावश्यक रूप से निश्चित नहीं किया गया।
- source_word: עָמְרִי
  choice: ओम्री
  rationale: हिब्रू व्यक्ति-नाम का प्रचलित हिन्दी लिप्यंतरण।
- source_word: וְכָל יִשְׂרָאֵל עִמּוֹ
  choice: और उसके साथ समस्त इस्राएल
  rationale: हिब्रू के सामूहिक राष्ट्रीय पद ‘इस्राएल’ को बनाए रखता है; संदर्भ में यह ओम्री के साथ के लोगों अथवा सेना को सूचित करता है, पर अनुवाद उसे अधिक स्पष्ट करके सीमित नहीं करता।
- source_word: מִגִּבְּתוֹן
  choice: गिब्बतोन से
  rationale: स्थान-नाम का हिन्दी लिप्यंतरण और מן का सीधा अर्थ ‘से’।
- source_word: וַיָּצֻרוּ
  choice: उन्होंने ... को घेर लिया
  rationale: צור के सैनिक अर्थ ‘घेराबंदी करना’ को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: עַל
  choice: को
  rationale: घेरने की क्रिया के साथ על लक्ष्य को चिह्नित करता है; हिन्दी में ‘तिर्सा को घेर लिया’ स्वाभाविक प्रयोग है।
- source_word: תִּרְצָה
  choice: तिर्सा
  rationale: हिब्रू स्थान-नाम का प्रचलित हिन्दी लिप्यंतरण।
