translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण कथात्मक शैली। ‘समस्त इस्राएल’ स्रोत के सामूहिक पद को सुरक्षित रखता है, जबकि ‘घेर लिया’ सैनिक संदर्भ को सहज रूप से व्यक्त करता है। अंग्रेज़ी परामर्श-पाठ की फुटनोट इस पद के बजाय मुख्य क्रिया के ही अधिक औपचारिक अंग्रेज़ी विकल्प से संबंधित प्रतीत होती है, इसलिए हिन्दी में अलग फुटनोट आवश्यक नहीं है।
