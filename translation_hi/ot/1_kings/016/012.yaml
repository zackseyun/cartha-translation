source:
  edition: WLC
  text: וַ/יַּשְׁמֵ֣ד זִמְרִ֔י אֵ֖ת כָּל בֵּ֣ית בַּעְשָׁ֑א כִּ/דְבַ֤ר יְהוָה֙ אֲשֶׁ֣ר דִּבֶּ֣ר אֶל בַּעְשָׁ֔א בְּ/יַ֖ד יֵה֥וּא הַ/נָּבִֽיא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/012.yaml
  text: So Zimri destroyed all the house of Baasha[b][a], according to the word of Yahweh that he had spoken against Baasha through Jehu the prophet.
translation:
  language: hi
  text: इस प्रकार जिम्री ने बाशा के पूरे घराने[b] को नष्ट कर दिया। यह यहोवा के उस वचन के अनुसार हुआ, जो उसने बाशा के विरुद्ध[a] येहू नबी के द्वारा कहा था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “बाशा को।” इब्रानी पूर्वसर्ग का शाब्दिक अर्थ “को/की ओर” है, पर यहाँ वह उसके विरुद्ध कही गई न्याय की घोषणा को प्रस्तुत करता है।
    reason: lexical_alternative
  - marker: b
    text: “बाशा का घराना” उसके केवल घरेलू परिवार को नहीं, बल्कि उसके शाही घराने या राजवंश को दर्शाता है।
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּשְׁמֵד
  choice: नष्ट कर दिया
  rationale: हिफ़ील रूप किसी को पूर्ण विनाश की ओर ले जाने का भाव देता है। ‘नष्ट कर दिया’ आधुनिक हिन्दी में स्पष्ट है और विनाश की विधि को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: כָּל בֵּית בַּעְשָׁא
  choice: बाशा के पूरे घराने
  rationale: राजकीय संदर्भ में בֵּית भौतिक घर मात्र नहीं, बल्कि राजवंश अथवा शाही घराना है। ‘पूरे घराने’ כָּל और वंशगत अर्थ दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: כִּדְבַר
  choice: वचन के अनुसार
  rationale: यह पदबंध पहले कही गई ईश्वरीय घोषणा के अनुरूप घटना घटने का भाव देता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिन्दी बाइबलीय प्रयोग में प्रचलित देवनागरी नाम-रूप ‘यहोवा’ चतुरक्षरीय दिव्य नाम को उपाधि से बदलने के बजाय नाम के रूप में प्रस्तुत करता है।
- source_word: אֲשֶׁר דִּבֶּר
  choice: जो उसने ... कहा था
  rationale: '‘कहा था’ पूर्वकालिकता स्पष्ट करता है: यह वचन जिम्री के कार्य से पहले कहा जा चुका था।'
- source_word: אֶל בַּעְשָׁא
  choice: बाशा के विरुद्ध
  rationale: אֶל का मूल अर्थ ‘की ओर/से’ है, पर यहाँ न्याय का संदेश बाशा को लक्ष्य करके उसके प्रतिकूल कहा गया है। ‘विरुद्ध’ संदर्भगत बल स्पष्ट करता है; अधिक शाब्दिक विकल्प पादटिप्पणी में रखा गया है।
- source_word: בְּיַד יֵהוּא הַנָּבִיא
  choice: येहू नबी के द्वारा
  rationale: ‘हाथ से’ वाला इब्रानी मुहावरा माध्यम अथवा प्रतिनिधि को सूचित करता है; आधुनिक हिन्दी में ‘के द्वारा’ इसका स्वाभाविक समतुल्य है।
theological_decisions:
- issue: दिव्य नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल में निजी दिव्य नाम है, इसलिए उसे ‘प्रभु’ जैसी उपाधि से नहीं बदला गया। हिन्दी पाठकों के लिए परिचित नाम-रूप ‘यहोवा’ चुना गया; ‘याहवे’ विद्वत्तापूर्ण पुनर्निर्मित उच्चारण का निकटतर रूप है।
- issue: אֶל בַּעְשָׁא में भविष्यवाणी का रुख
  choice: बाशा के विरुद्ध
  alternative: बाशा से / बाशा को
  rationale: संदर्भ न्याय की प्रतिकूल घोषणा है, इसलिए ‘विरुद्ध’ उसका आशय स्वाभाविक ढंग से प्रकट करता है। फिर भी इब्रानी पूर्वसर्ग की अधिक शाब्दिक संभावना पादटिप्पणी में सुरक्षित रखी गई है।
- issue: בֵּית בַּעְשָׁא का विस्तार
  choice: बाशा का घराना अर्थात राजवंश
  alternative: बाशा का परिवार अथवा घरेलू परिवार
  rationale: राजाओं के वृत्तांत में ‘घर’ प्रायः शासकीय वंश को दर्शाता है। पादटिप्पणी इस सांस्कृतिक अर्थ को स्पष्ट करती है, बिना मुख्य पाठ को भारी बनाए।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और कथात्मक रखी गई है। मुख्य वाक्य को हिन्दी में सहज पठनीय बनाने के लिए दो वाक्यों में विभाजित किया गया है। दोनों पादटिप्पणी-चिह्न संबंधित पदों के तुरंत बाद दिए गए हैं; क्रम स्रोत-सम्बद्ध विषयों के स्थान के अनुसार [b], फिर [a] है।
