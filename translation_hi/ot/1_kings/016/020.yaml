  text: The rest of the acts of Zimri[a], and his conspiracy that he carried out—are they not written in the Book of the Chronicles of the Kings of Israel?
translation:
  language: hi
  text: ज़िम्री के बाकी काम, और उसका वह षड्यंत्र जो उसने रचा था[a]—क्या वे इस्राएल के राजाओं के इतिहास की पुस्तक में लिखे नहीं हैं?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसका षड्यंत्र जो उसने षड्यंत्र रचा था।” इब्रानी में जोर देने के लिए एक ही मूल से बनी संज्ञा और क्रिया का प्रयोग है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי זִמְרִי
  choice: ज़िम्री के बाकी कामों
  rationale: राजकीय वृत्तांतों के इस प्रचलित सूत्र में דִּבְרֵי का अर्थ केवल ‘बातें’ नहीं, बल्कि राजा के काम और कार्यकलाप है; ‘बाकी कामों’ सहज और अर्थ-सटीक है।
- source_word: וְקִשְׁרוֹ אֲשֶׁר קָשָׁר
  choice: और उसके रचे हुए षड्यंत्र का वर्णन
  rationale: קֶשֶׁר राजनीतिक षड्यंत्र को सूचित करता है और 3 पुं. एक. प्रत्यय ‘उसके’ में सुरक्षित है। सजातीय संज्ञा-क्रिया की इब्रानी पुनरुक्ति को स्वाभाविक हिन्दी में ‘रचे हुए षड्यंत्र’ से व्यक्त किया गया है। ‘का वर्णन’ पहले पद के निहित अभिलेखीय भाव को दोनों विषयों से जोड़कर हिन्दी वाक्य को व्याकरणसम्मत बनाता है।
- source_word: הֲלוֹא הֵם כְּתוּבִים
  choice: क्या वह ... नहीं लिखा है?
  rationale: इब्रानी का अलंकारिक प्रश्न सुरक्षित रखा गया है। हिन्दी में संयुक्त विषय के वृत्तांत को एक समग्र ‘वर्णन’ मानकर एकवचन ‘वह ... लिखा है’ स्वाभाविक है।
- source_word: עַל סֵפֶר דִּבְרֵי הַיָּמִים לְמַלְכֵי יִשְׂרָאֵל
  choice: इस्राएल के राजाओं के इतिहास की पुस्तक में
  rationale: סֵפֶר अभिलेखीय पुस्तक है और דִּבְרֵי הַיָּמִים राजकीय इतिहास/वृत्तांत को दर्शाता है। ‘इतिहास की पुस्तक’ आधुनिक हिन्दी में स्पष्ट है और इसे बाइबल की ‘इतिहास’ नामक किसी अलग पुस्तक के रूप में अनावश्यक रूप से नहीं पहचानता।
