  yaml_path: translation/ot/1_kings/016/032.yaml
  text: He set up an altar for Baal in the house of Baal[a], which he had built in Samaria.
translation:
  language: hi
  text: उसने बाल के भवन में, जिसे उसने सामरिया में बनाया था, बाल के लिए एक वेदी स्थापित की।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּקֶם
  choice: स्थापित की
  rationale: हिफ़ील रूप यहाँ किसी वस्तु को खड़ा करने या स्थापित करने का भाव देता है। वेदी के संदर्भ में ‘स्थापित की’ स्वाभाविक और स्रोत के निकट है।
- source_word: מִזְבֵּחַ
  choice: एक वेदी
  rationale: बलि चढ़ाने की वेदी के लिए मानक और स्पष्ट हिन्दी शब्द।
- source_word: לַבָּעַל
  choice: बाल के लिए
  rationale: लामेद यहाँ समर्पण या उद्देश्य सूचित करता है; हिन्दी में ‘बाल के लिए’ स्वाभाविक रूप से बताता है कि वेदी बाल को समर्पित थी।
- source_word: בֵּית הַבַּעַל
  choice: बाल का भवन
  rationale: इब्रानी का शाब्दिक अर्थ ‘बाल का घर/भवन’ है। ‘भवन’ मूल रूपक को बनाए रखता है, जबकि पाद-टिप्पणी स्पष्ट करती है कि आशय मंदिर से है।
- source_word: אֲשֶׁר בָּנָה
  choice: यह भवन उसने ... बनवाया था
  rationale: सम्बन्धवाचक उपवाक्य ‘बाल के भवन’ को संदर्भित करता है। पूर्वकालिकता के लिए ‘था’ और राजकीय निर्माण के स्वाभाविक भाव के लिए ‘बनवाया’ प्रयुक्त है, यद्यपि मूल क्रिया सामान्यतः ‘बनाया’ है।
- source_word: בְּשֹׁמְרוֹן
  choice: सामरिया में
  rationale: स्थानवाचक בְ और שֹׁמְרוֹן का मानक हिन्दी रूप।
theological_decisions:
- issue: בֵּית הַבַּעַל का अनुवाद
  choice: बाल का भवन
  alternative: बाल का मंदिर
  rationale: ‘भवन’ इब्रानी ‘घर’ की शब्द-छवि को अपेक्षाकृत निकट रखता है; संदर्भ में यह उपासना-स्थल है, इसलिए ‘मंदिर’ को पाद-टिप्पणी में स्पष्ट किया गया है। इससे स्रोत की अभिव्यक्ति मिटाए बिना आधुनिक पाठक को अर्थ मिलता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण गद्य। ‘बाल’ बाअल देवता का प्रचलित बाइबलीय नाम है। अर्धविराम से यह स्पष्ट किया गया है कि सामरिया में बनाया गया भवन था, वेदी नहीं।
