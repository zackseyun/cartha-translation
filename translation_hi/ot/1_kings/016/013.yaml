source:
  edition: WLC
  text: אֶ֚ל כָּל חַטֹּ֣אות בַּעְשָׁ֔א וְ/חַטֹּ֖אות אֵלָ֣ה בְנ֑/וֹ אֲשֶׁ֣ר חָטְא֗וּ וַ/אֲשֶׁ֤ר הֶחֱטִ֨יאוּ֙ אֶת יִשְׂרָאֵ֔ל לְ/הַכְעִ֗יס אֶת יְהוָ֛ה אֱלֹהֵ֥י יִשְׂרָאֵ֖ל בְּ/הַבְלֵי/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/013.yaml
  text: because of all the sins of Baasha and the sins of Elah his son[a], which they committed and by which they caused Israel to sin, provoking Yahweh, the God of Israel, with their idols.
translation:
  language: hi
  text: यह सब बाशा के सभी पापों और उसके पुत्र एला के पापों के कारण हुआ—वे पाप जो उन्होंने किए और जिनके द्वारा उन्होंने इस्राएल से पाप करवाया और अपनी मूर्तियों[a] से इस्राएल के परमेश्वर याहवे को क्रोधित किया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक अर्थ “अपनी व्यर्थताओं” या “अपनी तुच्छ वस्तुओं से” है; यह मूर्तियों के लिए एक निंदात्मक अभिव्यक्ति है।
    reason: הֶבֶל के शाब्दिक, व्यंग्यात्मक अर्थ को सुरक्षित रखते हुए मुख्य पाठ में संदर्भगत अर्थ स्पष्ट किया गया है।
lexical_decisions:
- source_word: אֶל כָּל חַטֹּאות
  choice: यह सब ... के पापों ... के कारण हुआ
  rationale: אֶל यहाँ पिछले न्याय का कारण बताता है। पद को स्वतंत्र रूप से सुबोध रखने के लिए ‘यह सब ... के कारण हुआ’ कहा गया है, जबकि כָּל की व्यापकता ‘पापों’ के पूरे अभियोग में बनी रहती है।
- source_word: בַּעְשָׁא וְחַטֹּאות אֵלָה בְנוֹ
  choice: बाशा के पापों और उसके पुत्र एला के पापों
  rationale: नामों और पिता-पुत्र के संबंध को इब्रानी रचना के अनुसार स्पष्ट रखा गया है।
- source_word: אֲשֶׁר חָטְאוּ
  choice: वे पाप जो उन्होंने किए
  rationale: इब्रानी संबंधवाचक उपवाक्य का स्वाभाविक हिन्दी रूप; बहुवचन क्रिया दोनों राजाओं की ओर संकेत करती है।
- source_word: וַאֲשֶׁר הֶחֱטִיאוּ אֶת יִשְׂרָאֵל
  choice: और जिनके द्वारा उन्होंने इस्राएल से भी पाप करवाया
  rationale: חטא के हिफ़ील रूप की कारणवाचक शक्ति को ‘पाप करवाया’ से सीधे व्यक्त किया गया है; ‘जिनके द्वारा’ इसे पूर्वोक्त पापों से जोड़ता है।
- source_word: לְהַכְעִיס
  choice: क्रोधित किया
  rationale: इस प्रसंग में क्रिया का अर्थ यहोवा को जानबूझकर रोष दिलाने वाला आचरण है। हिन्दी में ‘क्रोधित किया’ स्वाभाविक और स्पष्ट है।
- source_word: יְהוָה אֱלֹהֵי יִשְׂרָאֵל
  choice: इस्राएल के परमेश्वर यहोवा
  rationale: इब्रानी विशेषण-संबंध को स्वाभाविक हिन्दी क्रम में रखा गया और יהוה को उसके व्यक्तिगत नाम ‘यहोवा’ से प्रस्तुत किया गया।
- source_word: בְּהַבְלֵיהֶם
  choice: अपनी व्यर्थ वस्तुओं से
  rationale: הֶבֶל का मूल भाव क्षणभंगुरता, खोखलेपन और व्यर्थता का है। प्रसंग मूर्तियों की ओर संकेत करता है, पर मुख्य पाठ में स्रोत का कटु रूपक सुरक्षित रखा गया है और अर्थ पाद-टिप्पणी में स्पष्ट किया गया है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का रूप
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ में उपाधि नहीं बल्कि चतुरक्षरीय व्यक्तिगत नाम है। आधुनिक हिन्दी बाइबल-पाठकों में परिचित नामरूप ‘यहोवा’ रखा गया है; इसे ‘प्रभु’ से प्रतिस्थापित नहीं किया गया।
- issue: בְּהַבְלֵיהֶם में मूर्तियों का स्पष्ट अथवा रूपकात्मक उल्लेख
  choice: व्यर्थ वस्तुओं
  alternative: मूर्तियों
  rationale: इब्रानी शब्द सीधे ‘मूर्तियाँ’ नहीं कहता, बल्कि उन्हें व्यर्थ/खोखली वस्तुएँ कहकर निंदात्मक संकेत करता है। मुख्य पाठ में यह धार्मिक तनाव और रूपक बचाया गया है; पाद-टिप्पणी संदर्भगत आशय बताती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण और सामान्य पाठक के लिए सुबोध शैली। कारणवाचक संबंध स्पष्ट किया गया है; लंबे इब्रानी वाक्य को पठनीयता के लिए दो वाक्यों में बाँटा गया है।
