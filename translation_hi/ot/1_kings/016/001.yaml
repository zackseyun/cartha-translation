  text: וַ/יְהִ֤י דְבַר יְהוָה֙ אֶל יֵה֣וּא בֶן חֲנָ֔נִי עַל בַּעְשָׁ֖א לֵ/אמֹֽר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/001.yaml
  text: Then the word of Yahweh came to Jehu son of Hanani against Baasha[a], saying,
translation:
  language: hi
  text: 'तब यहोवा का वचन हनानी के पुत्र येहू के पास बाशा के विरुद्ध[a] आया:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “बाशा के विषय में।” हिब्रू पूर्वसर्ग का अर्थ अधिक व्यापक हो सकता है, पर यहाँ यह न्याय की भविष्यवाणी का परिचय देता है; इसलिए “के विरुद्ध” को मुख्य पाठ में रखा गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: तब ... आया
  rationale: यह रूप कथा में अगली घटना आरम्भ करता है; आधुनिक हिन्दी में ‘तब’ क्रम को स्वाभाविक रूप से व्यक्त करता है।
- source_word: דְבַר יְהוָה
  choice: यहोवा का वचन
  rationale: भविष्यवाणी के इस प्रचलित सूत्र में ‘वचन’ ईश्वरीय प्रकाशन की औपचारिक और धर्मवैचारिक गूँज बनाए रखता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिन्दी बाइबलीय परंपरा में प्रचलित रूप द्वारा परमेश्वर के व्यक्तिगत वाचा-नाम को उपाधि से बदलने के बजाय नाम के रूप में रखा गया है।
- source_word: אֶל
  choice: के पास
  rationale: यहाँ पूर्वसर्ग ईश्वरीय वचन पाने वाले व्यक्ति को सूचित करता है; ‘के पास ... आया’ स्वाभाविक हिन्दी सूत्र है।
- source_word: יֵהוּא בֶן חֲנָנִי
  choice: हनानी के पुत्र येहू
  rationale: हिब्रू पुत्र-संबंध को स्पष्ट और स्वाभाविक हिन्दी क्रम में रखा गया है।
- source_word: עַל
  choice: के विरुद्ध
  rationale: आगे आने वाले न्याय-संदेश के संदर्भ में यह पूर्वसर्ग विरोधात्मक या न्यायिक दिशा बताता है, यद्यपि इसका अर्थ व्यापक रूप से ‘के विषय में’ भी हो सकता है।
- source_word: בַּעְשָׁא
  choice: बाशा
  rationale: व्यक्तिनाम का प्रचलित हिन्दी लिप्यंतरण।
- source_word: לֵאמֹר
  choice: ':'
  rationale: यह रूप अगले पद में आने वाले सीधे कथन का परिचय देता है; हिन्दी में द्विबिंदु इस अधूरे उद्धरण-सूत्र को ‘यह कहते हुए’ की अपेक्षा अधिक स्वाभाविक ढंग से व्यक्त करता है।
theological_decisions:
- issue: יהוה परमेश्वर के नाम का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल में चतुरक्षरीय व्यक्तिगत नाम है। हिन्दी पाठकों में व्यापक रूप से पहचाने जाने वाले ‘यहोवा’ से इसे नाम के रूप में सुरक्षित रखा गया है, न कि ‘प्रभु’ उपाधि से बदला गया है।
- issue: भविष्यवाणी के सूत्र में עַל का बल
  choice: बाशा के विरुद्ध
  alternative: बाशा के विषय में
  rationale: अगला संदेश बाशा पर न्याय की घोषणा है, इसलिए ‘विरुद्ध’ प्रसंग का न्यायिक बल व्यक्त करता है; पादटिप्पणी मूल पूर्वसर्ग की व्यापक संभावना बनाए रखती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य हिन्दी पाठक के लिए सहज रखी गई है। ‘वचन ... आया’ भविष्यवाणी-सूत्र की औपचारिकता बनाए रखता है, और अगले पद में कथन जारी होने के कारण अंत में द्विबिंदु लगाया गया है।
