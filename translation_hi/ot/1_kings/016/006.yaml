  text: Baasha slept with his fathers and was buried in Tirzah[a], and Elah his son reigned in his place.
translation:
  language: hi
  text: बाशा अपने पितरों के साथ सो गया[a] और उसे तिर्सा में दफ़नाया गया। उसका पुत्र एला उसकी जगह राजा हुआ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “अपने पूर्वजों के साथ।” “अपने पितरों के साथ सो गया” किसी राजा की मृत्यु बताने वाला पारंपरिक इब्रानी मुहावरा है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁכַּב
  choice: सो गया
  rationale: राजकीय मृत्यु-वृत्तांत के इस रूढ़ इब्रानी मुहावरे में क्रिया का शाब्दिक अर्थ ‘सोना’ है। ‘मर गया’ कहने के बजाय ‘सो गया’ मूल अभिव्यक्ति को सुरक्षित रखता है।
- source_word: עִם אֲבֹתָיו
  choice: अपने पितरों के साथ
  rationale: यह राजाओं की मृत्यु के लिए प्रयुक्त पारंपरिक सूत्र है। ‘पितरों’ से אֲבֹתָיו का औपचारिक अर्थ और आवर्ती मुहावरा दोनों बने रहते हैं; अधिक सामान्य विकल्प ‘पूर्वजों’ को पादटिप्पणी में दिया गया है।
- source_word: וַיִּקָּבֵר
  choice: उसे दफ़नाया गया
  rationale: निफ़ाल रूप यहाँ कर्मवाच्य अर्थ देता है। यह हिंदी में स्वाभाविक और स्पष्ट अभिव्यक्ति है।
- source_word: בְּתִרְצָה
  choice: तिर्सा में
  rationale: नगर के नाम के साथ בְּ का स्वाभाविक अर्थ ‘में’ है; תִרְצָה का लिप्यंतरण ‘तिर्सा’ किया गया है।
- source_word: וַיִּמְלֹךְ
  choice: राजा हुआ
  rationale: उत्तराधिकार के इस संदर्भ में क्रिया का आशय राजपद ग्रहण करना है। ‘राजा हुआ’ संक्षिप्त है और अगले पदबंध ‘उसकी जगह’ के साथ स्वाभाविक बैठता है।
- source_word: אֵלָה בְנוֹ
  choice: उसका पुत्र एला
  rationale: हिंदी की स्वाभाविक शब्दावली के अनुसार संबंध पहले रखा गया है, जबकि व्यक्ति और पुत्र-संबंध दोनों स्पष्ट रहते हैं।
- source_word: תַּחְתָּיו
  choice: उसकी जगह
  rationale: उत्तराधिकार के संदर्भ में תַּחְתָּיו प्रतिस्थापन का भाव रखता है। ‘उसकी जगह’ इसे ‘उसके बाद’ की अपेक्षा अधिक स्पष्टता से व्यक्त करता है।
theological_decisions:
- issue: ‘अपने पितरों के साथ सो गया’ मृत्यु का मुहावरा है या केवल दफ़न का वर्णन
  choice: मूल राजकीय मृत्यु-सूत्र को ज्यों का त्यों मुहावरे के रूप में रखा गया
  alternative: ‘मर गया’
  rationale: ‘मर गया’ अर्थ स्पष्ट करता, पर मूल की रूपकात्मक और सूत्रबद्ध अभिव्यक्ति को समाप्त कर देता। अनावश्यक रूप से परलोक-संबंधी कोई विशेष धार्मिक अर्थ भी नहीं जोड़ा गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। राजकीय मृत्यु और उत्तराधिकार के संक्षिप्त सूत्रात्मक स्वरूप को बनाए रखा गया है।
