source:
  edition: WLC
  text: וְ/יֶ֨תֶר דִּבְרֵ֥י בַעְשָׁ֛א וַ/אֲשֶׁ֥ר עָשָׂ֖ה וּ/גְבֽוּרָת֑/וֹ הֲ/לֹא הֵ֣ם כְּתוּבִ֗ים עַל סֵ֛פֶר דִּבְרֵ֥י הַ/יָּמִ֖ים לְ/מַלְכֵ֥י יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/005.yaml
  text: The rest of the acts of Baasha[a], and what he did, and his might—are they not written in the Book of the Chronicles of the Kings of Israel?
translation:
  language: hi
  text: बाशा के बाकी काम, जो उसने किया, और उसका पराक्रम—क्या वे इस्राएल के राजाओं के इतिहास की पुस्तक[a] में नहीं लिखे हैं?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “इस्राएल के राजाओं के वृत्तांतों की पुस्तक।”
    reason: मूल अभिव्यक्ति דִּבְרֵי הַיָּמִים के लिए “इतिहास” और “वृत्तांत” दोनों संभव हैं; दूसरा रूप अभिलेखीय वार्षिक विवरण के भाव को अधिक प्रत्यक्ष करता है।
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי בַעְשָׁא
  choice: बाशा के शेष काम
  rationale: राजकीय वृत्तांत के इस सूत्र में דִּבְרֵי का अर्थ केवल कथन नहीं, बल्कि राजा के कामों और उससे जुड़ी घटनाओं का विवरण है। 'शेष काम' आधुनिक हिन्दी में स्वाभाविक और संक्षिप्त है।
- source_word: וַאֲשֶׁר עָשָׂה
  choice: जो कुछ उसने किया
  rationale: यह सापेक्ष उपवाक्य मूल के सामान्य और व्यापक आशय को स्वाभाविक हिन्दी में रखता है; 'सब कुछ' जोड़कर अनावश्यक बल नहीं दिया गया।
- source_word: וּגְבוּרָתוֹ
  choice: और उसका पराक्रम
  rationale: גְּבוּרָה शक्ति, सामर्थ्य या वीरतापूर्ण उपलब्धि का बोध करा सकता है। 'पराक्रम' अमूर्त सामर्थ्य तथा उसके प्रदर्शित रूप—दोनों की गुंजाइश बनाए रखता है।
- source_word: הֲלֹא הֵם כְּתוּבִים
  choice: क्या वे ... नहीं लिखे हैं?
  rationale: मूल की मानक आलंकारिक प्रश्न-रचना को सुरक्षित रखा गया है, उसे सीधे कथन में नहीं बदला गया।
- source_word: עַל סֵפֶר
  choice: पुस्तक में
  rationale: लिखित अभिलेख के संदर्भ में עַל का हिन्दी मुहावरेदार रूप 'पुस्तक में' है।
- source_word: סֵפֶר דִּבְרֵי הַיָּמִים לְמַלְכֵי יִשְׂרָאֵל
  choice: इस्राएल के राजाओं के इतिहास की पुस्तक
  rationale: यह पद राजाओं से संबंधित आधिकारिक वार्षिक वृत्तांत या अभिलेख को दर्शाता है। 'इतिहास की पुस्तक' सामान्य पाठक के लिए स्पष्ट है, जबकि 'वृत्तांतों की पुस्तक' भी संभव है और पादटिप्पणी में दिया गया है।
