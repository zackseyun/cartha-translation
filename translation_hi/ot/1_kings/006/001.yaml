source:
  edition: WLC
  text: וַ/יְהִ֣י בִ/שְׁמוֹנִ֣ים שָׁנָ֣ה וְ/אַרְבַּ֣ע מֵא֣וֹת שָׁנָ֡ה לְ/צֵ֣את בְּנֵֽי יִשְׂרָאֵ֣ל מֵ/אֶֽרֶץ מִצְרַיִם֩ בַּ/שָּׁנָ֨ה הָ/רְבִיעִ֜ית בְּ/חֹ֣דֶשׁ זִ֗ו ה֚וּא הַ/חֹ֣דֶשׁ הַ/שֵּׁנִ֔י לִ/מְלֹ֥ךְ שְׁלֹמֹ֖ה עַל יִשְׂרָאֵ֑ל וַ/יִּ֥בֶן הַ/בַּ֖יִת לַ/יהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/006/001.yaml
  text: And it came about in the four hundred eightieth year after the sons of Israel came out from the land of Egypt[a], in the fourth year, in the month of Ziv (that is, the second month), of Solomon’s reign over Israel[c][b], that he built the house for Yahweh.
translation:
  language: hi
  text: इस्राएल के पुत्रों के मिस्र देश से निकलने के चार सौ अस्सीवें वर्ष में[a], इस्राएल पर सुलैमान के राज्य के चौथे वर्ष के ज़िव नामक महीने में—अर्थात् दूसरे महीने में[b]—उसने यहोवा के लिए भवन बनाया।[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: मूल इब्रानी में “इस्राएल के पुत्र”; इसका आशय सामूहिक रूप से इस्राएल की प्रजा है।
    reason: lexical_alternative
  - marker: b
    text: ज़िव इब्रानी पंचांग के दूसरे महीने का पुराना नाम था।
    reason: cultural_note
  - marker: c
    text: संदर्भ के अनुसार अनुवाद हो सकता है, “उसने यहोवा के लिए भवन बनाना आरम्भ किया”; मूल इब्रानी क्रिया केवल “बनाया” कहती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: '[मुख्य काल-वाक्य में समाहित]'
  rationale: यहाँ कथात्मक וַיְהִי एक काल-सूचना आरम्भ करता है। हिंदी में अलग से “और ऐसा हुआ” जोड़ने के बजाय “...वर्ष में” से आरम्भ करना अधिक स्वाभाविक है और अर्थ सुरक्षित रहता है।
- source_word: בִּשְׁמוֹנִים שָׁנָה וְאַרְבַּע מֵאוֹת שָׁנָה
  choice: चार सौ अस्सीवें वर्ष में
  rationale: इब्रानी पदबंध किसी ढीली अवधि के बजाय गिनती के विशिष्ट 480वें वर्ष को सूचित करता है।
- source_word: לְצֵאת בְּנֵי יִשְׂרָאֵל מֵאֶרֶץ מִצְרַיִם
  choice: इस्राएल के पुत्रों के मिस्र देश से निकलने के
  rationale: לְצֵאת को काल-संदर्भ के रूप में स्वाभाविक हिंदी में व्यक्त किया गया है; בְּנֵי יִשְׂרָאֵל की पारिवारिक अभिव्यक्ति और אֶרֶץ ‘देश’ दोनों रखे गए हैं।
- source_word: בַּשָּׁנָה הָרְבִיעִית ... לִמְלֹךְ שְׁלֹמֹה עַל יִשְׂרָאֵל
  choice: इस्राएल पर सुलैमान के राज्य के चौथे वर्ष
  rationale: यह राजकीय कालगणना है; यह हिंदी संरचना सुलैमान के शासन के चौथे वर्ष को स्पष्ट और संक्षिप्त ढंग से व्यक्त करती है।
- source_word: בְּחֹדֶשׁ זִו הוּא הַחֹדֶשׁ הַשֵּׁנִי
  choice: ज़िव नामक महीने में—अर्थात् दूसरे महीने में—
  rationale: ऐतिहासिक महीने का नाम बनाए रखते हुए मूल की व्याख्यात्मक समानाधिकरण रचना को स्वाभाविक हिंदी विराम-चिह्नों से दर्शाया गया है।
- source_word: וַיִּבֶן
  choice: उसने ... बनाया
  rationale: साधारण क्रिया ‘बनाया’ मूल के सीधे अर्थ को रखती है। संदर्भ से निर्माण के आरम्भ का आशय निकल सकता है, पर मूल क्रिया स्पष्ट रूप से ‘आरम्भ किया’ नहीं कहती।
- source_word: הַבַּיִת
  choice: भवन
  rationale: בַּיִת का मूल अर्थ ‘घर/भवन’ है। यहाँ यह यहोवा के उपासना-भवन का संकेत है; ‘भवन’ आधुनिक हिंदी में गरिमापूर्ण है और सीधे ‘मन्दिर’ कहकर निहितार्थ को अत्यधिक स्पष्ट नहीं करता।
- source_word: לַיהוָה
  choice: यहोवा के लिए
  rationale: व्यक्तिगत वाचा-नाम יהוה को हिंदी में प्रचलित लिप्यंतरण ‘यहोवा’ से प्रस्तुत किया गया है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: प्रभु
  rationale: मूल पाठ में सामान्य उपाधि नहीं, चतुरक्षरी व्यक्तिगत नाम है। ‘यहोवा’ हिंदी पाठकों में परिचित रूप है और नाम तथा उपाधि का भेद बनाए रखता है।
- issue: בְּנֵי יִשְׂרָאֵל की पारिवारिक अभिव्यक्ति
  choice: इस्राएल के पुत्र
  alternative: इस्राएली / इस्राएल के लोग
  rationale: स्रोत का शाब्दिक पारिवारिक रूप सुरक्षित रखा गया है, जबकि पादटिप्पणी स्पष्ट करती है कि इसका सामूहिक आशय इस्राएल की प्रजा है।
- issue: וַיִּבֶן में निर्माण के आरम्भ को स्पष्ट करना
  choice: बनाया
  alternative: बनाना आरम्भ किया
  rationale: आगे का संदर्भ निर्माण-कार्य के आरम्भ की ओर संकेत करता है, फिर भी क्रिया स्वयं केवल ‘बनाया’ कहती है। मुख्य पाठ स्रोत के निकट है और वैकल्पिक संदर्भगत अनुवाद पादटिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक मानक हिंदी, गरिमापूर्ण किंतु सहज शैली। काल-सूचना को हिंदी के स्वाभाविक क्रम में रखा गया है। ‘ज़िव’, ‘इस्राएल’ और ‘यहोवा’ जैसे ऐतिहासिक नाम सुरक्षित हैं; इब्रानी की वास्तविक अस्पष्टता को मुख्य पाठ और पादटिप्पणी में बनाए रखा गया है।
