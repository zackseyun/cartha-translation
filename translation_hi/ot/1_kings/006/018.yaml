  text: The cedar on the inside of the house was carved with gourds and open flowers[a]. Everything was cedar[b]; no stone was visible.
translation:
  language: hi
  text: भवन के भीतर की देवदार की लकड़ी पर लौकियों जैसी आकृतियाँ[a] और खिले हुए फूल[b] खुदे थे। सब कुछ देवदार की लकड़ी का था; कोई पत्थर दिखाई नहीं देता था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘कलियों जैसी आकृतियाँ’; इब्रानी शब्द गोल सजावटी रूपों को दर्शाता है और इस मंदिर-संदर्भ में संभवतः लौकी के आकार की नक्काशी के लिए प्रयुक्त हुआ है।
    reason: lexical_alternative
  - marker: b
    text: या ‘फूलों के प्रस्फुटित रूप’; इब्रानी अभिव्यक्ति संभवतः नक्काशीदार, खुले हुए पुष्पाकार रूपों को दर्शाती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶרֶז
  choice: देवदार की लकड़ी
  rationale: यह संज्ञा देवदार की इमारती लकड़ी अथवा उससे बने आवरण को दर्शाती है। हिंदी में केवल ‘देवदार’ की अपेक्षा ‘देवदार की लकड़ी’ सामग्री को अधिक स्पष्ट करता है।
- source_word: אֶל־הַבַּיִת פְּנִימָה
  choice: भवन के भीतर
  rationale: यह पद भवन के अंदरूनी भाग अथवा भीतरी सतह की ओर संकेत करता है। संदर्भ में देवदार से आंतरिक आवरण किया गया है।
- source_word: מִקְלַעַת
  choice: खुदे थे
  rationale: यह शब्द नक्काशी या उकेरे गए सजावटी काम को दर्शाता है। ‘खुदे थे’ सहज और आधुनिक हिंदी है।
- source_word: פְּקָעִים
  choice: लौकियों जैसी आकृतियाँ
  rationale: मंदिर-वर्णन में यह शब्द गोल, संभवतः लौकी के आकार के अलंकरणों को दर्शाता है। आकृति स्पष्ट करने के साथ ‘जैसी’ मूल शब्द की कुछ अनिश्चितता बनाए रखता है।
- source_word: וּפְטוּרֵי צִצִּים
  choice: और खिले हुए फूल
  rationale: यह अभिव्यक्ति पुष्पाकार अलंकरणों, संभवतः खुली हुई कलियों या फूलों, को दर्शाती है। ‘खिले हुए फूल’ स्वाभाविक हिंदी में दृश्य अर्थ व्यक्त करता है।
- source_word: הַכֹּל אֶרֶז
  choice: सब कुछ देवदार की लकड़ी से ढका था
  rationale: संदर्भ में सार यह है कि पूरा दिखाई देने वाला भीतरी भाग देवदार से आच्छादित था। यह अनुवाद अगली पंक्ति में पत्थर न दिखने के कारण को स्पष्ट करता है, बिना नई सामग्री जोड़े।
- source_word: אֵין אֶבֶן נִרְאָה
  choice: कोई पत्थर दिखाई नहीं देता था
  rationale: यह मूल के दृश्य निषेध और निष्क्रिय भाव को स्वाभाविक आधुनिक हिंदी में बनाए रखता है।
