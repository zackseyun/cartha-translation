  rationale: הֵיכָל यहाँ भीतरी पवित्रस्थान से अलग मंदिर के मुख्य कक्ष को दर्शाता है; ‘मुख्य कक्ष’ सामान्य पाठक के लिए ‘नेव’ से अधिक स्पष्ट है।
- source_word: מְזוּזוֹת
