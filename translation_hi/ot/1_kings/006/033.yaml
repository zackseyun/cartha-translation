- source_word: עֲצֵי שָׁמֶן
  choice: जैतून की लकड़ी
  rationale: यह रचनात्मक पदबंध का प्रचलित और प्रसंगानुकूल अर्थ है।
- source_word: מֵאֵת רְבִעִית
  choice: उसकी बनावट चार-पक्षीय थी
  rationale: कठिन वास्तु-वाक्यांश को संभावित आकृति-संबंधी अर्थ में प्रस्तुत करता है, पर ‘चौकोर’ कहकर अर्थ को अनावश्यक रूप से सीमित नहीं करता।
