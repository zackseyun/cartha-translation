  text: And so he made for the entrance of the nave doorposts of olivewood[a], four-sided.
translation:
  language: hi
  text: और इसी प्रकार उसने मंदिर के मुख्य कक्ष के प्रवेश-द्वार के लिए जैतून की लकड़ी की चौखट बनाई; उसकी बनावट चार-पक्षीय थी।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या संभवतः, “चार-पक्षीय चौखटे के साथ” अथवा “चौकोर।” इब्रानी वाक्यांश का शाब्दिक रूप “चौथे भाग से” है। वास्तु-संदर्भ में इसका अर्थ कठिन है और संभवतः प्रवेश-द्वार की आकृति का वर्णन करता है।
    reason: वैकल्पिक पाठ और मूल इब्रानी की वास्तु-संबंधी अस्पष्टता को सुरक्षित रखना।
