  rationale: वर्णनात्मक वाक्य में साधारण अस्तित्वसूचक क्रिया का सीधा और स्वाभाविक रूप।
- source_word: הַ/בָּיִת
  choice: भवन
  rationale: בַּיִת का मूल अर्थ ‘घर’ है और यहाँ यह मन्दिर-भवन के लिए प्रयुक्त है; ‘भवन’ आधुनिक हिन्दी में स्थापत्य-संदर्भ को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ה֖וּא
  choice: अर्थात
  rationale: सर्वनाम यहाँ व्याख्यात्मक समानाधिकरण में पहले पद को अधिक विशिष्ट रूप से पहचानता है।
- source_word: הַ/הֵיכָל
  choice: मुख्य कक्ष
  rationale: यहाँ הֵיכָל भीतरी पवित्रस्थान से अलग मन्दिर के प्रधान कक्ष को सूचित करता है; ‘मुख्य कक्ष’ साधारण पाठक के लिए स्पष्ट है और बाद की तकनीकी धार्मिक शब्दावली आरोपित नहीं करता।
- source_word: לִ/פְנָֽ/י
  choice: भीतरी पवित्रस्थान के सामने
  rationale: इसका अर्थ ‘के सामने/आगे’ है; पिछले पद के संदर्भ से निहित स्थान को स्पष्ट किया गया है, पर सम्बन्ध की मूल दिशा सुरक्षित है।
