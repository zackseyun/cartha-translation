lexical_decisions:
- source_word: וַיְהִי
  choice: तब … पहुँचा
  rationale: यहाँ वाव-क्रमिक रूप कथा को आगे बढ़ाता है। हिन्दी में ‘तब’ स्वाभाविक कथात्मक प्रवाह देता है; ‘और ऐसा हुआ’ मूल मुहावरे का अधिक शब्दशः, पर भारी अनुवाद होता।
- source_word: דְּבַר
  choice: वचन
  rationale: ‘याहवे का वचन’ ईश्वरीय संदेश के लिए प्रयुक्त पारंपरिक भविष्यवाणी-सूत्र को बनाए रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय पवित्र नाम का हिन्दी लिप्यंतरण किया गया है, न कि उसके स्थान पर कोई उपाधि रखी गई है।
- source_word: אֶל
  choice: के पास
  rationale: दिव्य वचन के प्राप्तकर्ता को दर्शाने के लिए आधुनिक हिन्दी में ‘के पास पहुँचा’ स्वाभाविक प्रयोग है।
- source_word: שְׁלֹמֹה
  choice: सुलैमान
  rationale: इस व्यक्तिगत नाम का प्रचलित हिन्दी बाइबलीय रूप अपनाया गया है।
- source_word: לֵאמֹר
  choice: ':'
  rationale: यह रूप अगले पद में आने वाले कथन का परिचय देता है। हिन्दी में उद्धरणसूचक विसर्ग इसकी भूमिका को स्वाभाविक और संक्षिप्त ढंग से व्यक्त करता है।
