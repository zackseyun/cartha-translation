  text: וַ/יִּבֶן֩ עַל קִ֨יר הַ/בַּ֤יִת יצוע סָבִ֔יב אֶת קִיר֤וֹת הַ/בַּ֨יִת֙ סָבִ֔יב לַֽ/הֵיכָ֖ל וְ/לַ/דְּבִ֑יר וַ/יַּ֥עַשׂ צְלָע֖וֹת סָבִֽיב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/006/005.yaml
  text: He built against the wall of the house a structure all around[a], against the walls of the house all around, around both the nave and the inner sanctuary[c][b]; and he made side rooms all around.
translation:
  language: hi
  text: उसने मंदिर-भवन की दीवार के सहारे, मंदिर-भवन की दीवारों के चारों ओर—मुख्य कक्ष[b] और भीतरी पवित्रस्थान[c], दोनों के चारों ओर—एक ढाँचा बनाया[a]; और उसने चारों ओर पार्श्व-कक्ष बनाए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: दुर्लभ हिब्रू शब्द יצוע का अनुवाद “चारों ओर बना सहायक भवन” भी हो सकता है। यह मंदिर की दीवारों के चारों ओर बनाए गए निर्माण को दर्शाता है।
    reason: lexical_alternative
  - marker: b
    text: हिब्रू הֵיכָל मंदिर के मुख्य कक्ष को दर्शाता है, जो भीतरी पवित्रस्थान से अलग था।
    reason: cultural_note
  - marker: c
    text: “भीतरी पवित्रस्थान” का अनुवाद “परमपवित्र स्थान” भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּבֶן
  choice: उसने … बनाया
  rationale: हिब्रू कथात्मक क्रिया को स्वाभाविक आधुनिक हिन्दी में सामान्य भूतकाल से व्यक्त किया गया है।
- source_word: עַל קִיר הַבַּיִת
  choice: भवन की दीवार से सटाकर
  rationale: इस स्थापत्य प्रसंग में עַל का आशय दीवार के ऊपर बनाना नहीं, बल्कि उससे लगा हुआ निर्माण करना है।
- source_word: יצוע
  choice: एक ढाँचा
  rationale: यह दुर्लभ स्थापत्य शब्द है। ‘ढाँचा’ उसके सामूहिक निर्माण-संबंधी अर्थ को रखता है, पर उसकी अनिश्चित बनावट का जरूरत से अधिक निर्धारण नहीं करता।
- source_word: סָבִיב
  choice: चारों ओर
  rationale: मूल में इसकी पुनरावृत्ति घेरे हुए निर्माण पर बल देती है; हिन्दी में भी उस पुनरावृत्ति को पर्याप्त रूप से सुरक्षित रखा गया है।
- source_word: אֶת קִירוֹת הַבַּיִת
  choice: भवन की दीवारों के चारों ओर
  rationale: मूल के बहुवचन ‘दीवारों’ और चारों ओर फैली व्यवस्था को स्पष्ट रखा गया है।
- source_word: לַהֵיכָל
  choice: मुख्य कक्ष
  rationale: यह मंदिर के मुख्य सभागार को भीतरी पवित्रस्थान से अलग बताता है और सामान्य हिन्दी पाठक के लिए ‘नैव’ जैसे तकनीकी शब्द से अधिक स्पष्ट है।
- source_word: וְלַדְּבִיר
  choice: भीतरी पवित्रस्थान
  rationale: यह मंदिर के सबसे अंदर के पवित्र कक्ष को व्यक्त करता है, साथ ही ‘परमपवित्र स्थान’ जैसी वैकल्पिक पारंपरिक अभिव्यक्ति को पादटिप्पणी में सुरक्षित रखता है।
- source_word: וַיַּעַשׂ צְלָעוֹת
  choice: उसने … बगल के कमरे भी बनाए
  rationale: צְלָעוֹת का मूल अर्थ ‘पहलू/बाजू’ हो सकता है, पर इस स्थापत्य संदर्भ में उससे मंदिर से लगे बगल के कमरे अभिप्रेत हैं। ‘भी’ हिन्दी में पूर्ववर्ती ढाँचे और इन कमरों के संबंध को स्वाभाविक बनाता है।
