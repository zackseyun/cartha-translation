  text: उसने उन पर करूबों, खजूर के पेड़ों और खिले हुए फूलों की आकृतियाँ उकेरीं, और उकेरी हुई कारीगरी पर सोना मढ़ा, जो नक्काशी के अनुरूप ठीक से बैठाया गया था।
