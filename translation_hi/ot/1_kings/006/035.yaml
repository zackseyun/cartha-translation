- source_word: מְיֻשָּׁר עַל הַמְּחֻקֶּה
  choice: उकेरी हुई आकृतियों पर ठीक से जड़ा हुआ
  rationale: מְיֻשָּׁר का आशय सोने को नक्काशी के अनुरूप समतल/ठीक से बैठाने से है; अनिश्चित तकनीकी बारीकी को अत्यधिक विशिष्ट बनाए बिना यह भाव व्यक्त किया गया है।
