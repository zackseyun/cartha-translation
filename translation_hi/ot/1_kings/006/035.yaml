  choice: करूब
  rationale: मंदिर की अलंकरणकारी स्वर्गीय आकृतियों के लिए प्रचलित बाइबलीय पद रखा गया है।
- source_word: תִמֹרוֹת
  choice: खजूर के पेड़
  rationale: यह बहुवचन संज्ञा खजूर/ताड़ के वृक्षों की सजावटी आकृतियों को सूचित करती है; सामान्य पाठक के लिए 'खजूर के पेड़' स्पष्ट है।
- source_word: פְטֻרֵי צִצִּים
  choice: खिले हुए फूल
