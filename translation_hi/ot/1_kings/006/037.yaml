  yaml_path: translation/ot/1_kings/006/037.yaml
  text: In the fourth year[a], the house of Yahweh was founded in the month of Ziv.
translation:
  language: hi
  text: चौथे वर्ष में, ज़िव के महीने में, याहवे के भवन की नींव रखी गई[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अथवा, “याहवे का भवन स्थापित किया गया।”
    reason: यֻסַּד का निष्क्रिय रूप भवन की नींव रखे जाने अथवा उसके स्थापित किए जाने का अर्थ दे सकता है।
lexical_decisions:
- source_word: בַּשָּׁנָה הָרְבִיעִית
  choice: चौथे वर्ष में
  rationale: इब्रानी में यह एक निश्चित काल-सूचक पदबंध है। संदर्भ से यह सुलैमान के शासन का चौथा वर्ष है, पर इस पद में वह बात दोहराई नहीं गई, इसलिए उसे मुख्य पाठ में नहीं जोड़ा गया।
- source_word: יֻסַּד
  choice: नींव रखी गई
  rationale: יסד के निष्क्रिय रूप का अर्थ किसी भवन की नींव डालना या उसे स्थापित करना है। निर्माण के इस संदर्भ में हिंदी का स्वाभाविक और सटीक प्रयोग ‘नींव रखी गई’ है।
- source_word: בֵּית יְהוָה
  choice: यहोवा के भवन
  rationale: בַּיִת का मूल अर्थ ‘घर/भवन’ है और यहाँ वह मंदिर को सूचित करता है। ‘भवन’ इब्रानी रूपक को बनाए रखते हुए आधुनिक हिंदी में गरिमापूर्ण और स्पष्ट है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: परियोजना की परंपरा के अनुरूप परमेश्वर के विशिष्ट वाचा-नाम को हिंदी में प्रचलित रूप ‘यहोवा’ से व्यक्त किया गया है।
- source_word: בְּיֶרַח זִו
  choice: ज़िव के महीने में
  rationale: יֶרַח का अर्थ ‘महीना’ और זִו उस महीने का नाम है। ‘दूसरा महीना’ इस पद में नहीं, बल्कि निकटवर्ती संदर्भ में मिलता है, इसलिए यहाँ नहीं जोड़ा गया।
theological_decisions:
- issue: परमेश्वर के नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ में टेट्राग्रामटन सीधे प्रयुक्त है। हिंदी बाइबल-पाठकों के लिए पहचाने जाने योग्य विशिष्ट नाम ‘यहोवा’ रखा गया; इसे सामान्य उपाधि ‘प्रभु’ से प्रतिस्थापित नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिंदी का संक्षिप्त, गरिमापूर्ण और सहज वाक्य। इब्रानी शब्द-क्रम को कठोरता से दोहराने के बजाय हिंदी के स्वाभाविक क्रम में समय-सूचक पद पहले और मुख्य कथन बाद में रखा गया है।
