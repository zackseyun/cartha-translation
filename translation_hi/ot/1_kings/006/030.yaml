lexical_decisions:
- source_word: קַרְקַע
  choice: फर्श
  rationale: मन्दिर-निर्माण के प्रसंग में यह भवन की फर्श-सतह को दर्शाता है; आधुनिक हिन्दी में ‘फर्श’ स्वाभाविक वास्तुशिल्पीय शब्द है।
- source_word: הַבַּיִת
  choice: भवन
  rationale: इब्रानी में शाब्दिक अर्थ ‘घर/भवन’ है और इस प्रसंग में संकेत मन्दिर की ओर है। ‘भवन’ स्रोत की अभिव्यक्ति को बनाए रखते हुए हिन्दी में गरिमापूर्ण और स्पष्ट है।
- source_word: צִפָּה
  choice: मढ़ा था
  rationale: यह क्रिया किसी सतह को धातु की परत से ढकने का बोध देती है; सोने के साथ ‘सोना मढ़ना’ आधुनिक हिन्दी का स्वाभाविक प्रयोग है।
- source_word: זָהָב
  choice: सोना
  rationale: यह सामग्री के लिए सामान्य और सीधा हिन्दी पर्याय है।
- source_word: לִפְנִימָה וְלַחִיצוֹן
  choice: भीतर से बाहर तक
  rationale: यह संक्षिप्त स्थानवाची युग्म भीतरी और बाहरी विस्तार का विरोध दिखाता है। ‘भीतर से बाहर तक’ पूरे फर्श पर आवरण होने का सम्भावित अर्थ सहज रूप से देता है, जबकि टिप्पणी में इसकी व्याख्यात्मक प्रकृति बताई गई है।
