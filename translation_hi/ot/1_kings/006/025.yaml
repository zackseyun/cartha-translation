  text: And the second cherub was ten cubits[a]; both cherubim had one measure and one form.
translation:
  language: hi
  text: दूसरा करूब भी दस हाथ का था; दोनों करूबों की माप और आकृति एक ही थी।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעֶשֶׂר בָּאַמָּה
  choice: दस हाथ का था
  rationale: इब्रानी वाक्यांश केवल माप बताता है और ऊँचाई को स्पष्ट रूप से निर्दिष्ट नहीं करता। प्रसंगानुसार हिन्दी में ‘था’ जोड़ना स्वाभाविक है; ‘ऊँचा’ जोड़ने से बचकर स्रोत की तटस्थता रखी गई है।
- source_word: הַכְּרוּב הַשֵּׁנִי
  choice: दूसरा करूब
  rationale: निश्चित संज्ञा और क्रमवाचक विशेषण का सीधा, स्वाभाविक हिन्दी रूप।
- source_word: מִדָּה אַחַת
  choice: माप ... एक ही थी
  rationale: מִדָּה का अर्थ माप या आयाम है। ‘एक ही’ दोनों करूबों पर लागू समानता को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וְקֶצֶב אֶחָד
  choice: और आकृति एक ही थी
  rationale: קֶצֶב यहाँ रूप, बनावट या अनुपात का बोध करा सकता है। ‘आकृति’ आधुनिक हिन्दी में स्पष्ट है और शब्द की व्यापक दृश्य अर्थ-सीमा को बनाए रखती है।
- source_word: לִשְׁנֵי הַכְּרֻבִים
  choice: दोनों करूबों की
  rationale: शाब्दिक ‘दो करूबों के लिए’ को हिन्दी मुहावरे के अनुसार संबंधसूचक रचना में बदला गया है, जिससे वही अर्थ स्पष्ट रहता है।
theological_decisions: []
