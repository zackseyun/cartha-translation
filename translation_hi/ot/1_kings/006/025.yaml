  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। माप की पारंपरिक बाइबलीय इकाई ‘हाथ’ अपनाई गई है। ‘भी’ पिछले पद में पहले करूब के समान दस हाथ होने के प्रसंगगत संबंध को स्पष्ट करता है।
