  text: וְ/הָ/אוּלָ֗ם עַל פְּנֵי֙ הֵיכַ֣ל הַ/בַּ֔יִת עֶשְׂרִ֣ים אַמָּה֙ אָרְכּ֔/וֹ עַל פְּנֵ֖י רֹ֣חַב הַ/בָּ֑יִת עֶ֧שֶׂר בָּ/אַמָּ֛ה רָחְבּ֖/וֹ עַל פְּנֵ֥י הַ/בָּֽיִת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/006/003.yaml
  text: The portico in front of the nave of the house was twenty cubits long[a], across the width of the house[c][b], and ten cubits deep in front of the house.
translation:
  language: hi
  text: भवन के मुख्य कक्ष के सामने का बरामदा[a] भवन की चौड़ाई के आर-पार बीस हाथ लंबा था;[b] भवन के सामने बरामदा दस हाथ गहरा था।[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इसके लिए ‘प्रवेश-मंडप’ या ‘ड्योढ़ी’ भी कहा जा सकता है।
    reason: lexical_alternative
  - marker: b
    text: अर्थात बरामदे की लंबाई मन्दिर-भवन के मुख्य कक्ष के सामने उसकी चौड़ाई के आर-पार थी।
    reason: clarification
  - marker: c
    text: इब्रानी में शाब्दिक रूप से ‘उसकी चौड़ाई’; यहाँ आशय भवन के सामने बाहर की ओर फैले बरामदे की गहराई से है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָאוּלָם
  choice: बरामदा
  rationale: मन्दिर की मुख्य सभा-स्थली के आगे स्थित प्रवेश-संरचना के लिए ‘बरामदा’ आधुनिक हिन्दी में सहज और वास्तु-संदर्भ में स्पष्ट है; विकल्पों को पादटिप्पणी में रखा गया है।
- source_word: עַל־פְּנֵי הֵיכַל הַבָּיִת
  choice: भवन के मुख्य कक्ष के सामने
  rationale: הֵיכַל यहाँ मन्दिर-भवन के मुख्य कक्ष को दर्शाता है, न कि सम्पूर्ण मन्दिर को; עַל־פְּנֵי का स्थान-संबंध ‘के सामने’ से स्वाभाविक रूप में व्यक्त होता है।
- source_word: הַבַּיִת
  choice: भवन
  rationale: בַּיִת का मूल अर्थ ‘घर/भवन’ है और इस संदर्भ में वह मन्दिर की इमारत को सूचित करता है। ‘भवन’ मूल रूपक को बनाए रखते हुए हिन्दी में मंदिर-वास्तु के लिए स्वाभाविक है।
- source_word: עֶשְׂרִים אַמָּה
  choice: बीस हाथ
  rationale: अम्मा प्राचीन माप ‘क्यूबिट’ है। हिन्दी बाइबलीय परंपरा में ‘हाथ’ इसका परिचित और सुबोध समतुल्य है; आधुनिक इकाई में अनुमानित परिवर्तन नहीं किया गया।
- source_word: עַל־פְּנֵי רֹחַב הַבָּיִת
  choice: भवन की पूरी चौड़ाई में
  rationale: वाक्यांश बताता है कि बरामदे की बीस हाथ की लंबाई भवन के सामने उसकी चौड़ाई के आर-पार थी। ‘पूरी चौड़ाई में’ इस वास्तु-संबंध को सहज हिन्दी में स्पष्ट करता है।
- source_word: עֶשֶׂר בָּאַמָּה
  choice: दस हाथ
  rationale: माप के साथ लगा בְּ यहाँ मुहावरेदार है; अर्थ साधारणतः ‘दस हाथ’ है।
- source_word: רָחְבּוֹ
  choice: उसकी गहराई
  rationale: शाब्दिक अर्थ ‘उसकी चौड़ाई’ है, पर सामने स्थित बरामदे के संदर्भ में यह भवन से बाहर की ओर जाने वाला आयाम है; हिन्दी में ‘गहराई’ वास्तु-स्थिति को भ्रमरहित बनाती है। शाब्दिक रूप पादटिप्पणी में सुरक्षित है।
- source_word: עַל־פְּנֵי הַבָּיִת
  choice: भवन के सामने बाहर की ओर
  rationale: अंतिम वाक्यांश दस हाथ के आयाम को भवन के आगे निकले हुए विस्तार के रूप में स्थित करता है; ‘बाहर की ओर’ जोड़ने से आयाम की दिशा स्पष्ट होती है।
