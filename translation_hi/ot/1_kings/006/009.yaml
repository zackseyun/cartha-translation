  text: इस प्रकार उसने भवन बनाकर पूरा किया और भवन को देवदार की कड़ियों और कतारों से ढक दिया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַבַּיִת
  choice: भवन
  rationale: संदर्भ में यह मंदिर-भवन है; ‘भवन’ आधुनिक हिन्दी में गरिमापूर्ण और स्वाभाविक है, जबकि पद में निहित सामान्य संज्ञा को अनावश्यक रूप से विशिष्ट नहीं करता।
- source_word: וַיְכַלֵּהוּ
  choice: पूरा किया
  rationale: क्रिया का अर्थ निर्माण को समाप्त अथवा पूर्ण करना है; ‘पूरा किया’ इसे सरल और प्रत्यक्ष रूप से व्यक्त करता है।
- source_word: גֵבִים
  choice: कड़ियों
  rationale: यह दुर्लभ स्थापत्य शब्द छत के लकड़ी के सहारों या बीमों की ओर संकेत करता है; ‘कड़ियाँ’ हिन्दी निर्माण-शब्दावली में उपयुक्त है।
- source_word: וּשְׂדֵרֹת
  choice: कतारों
  rationale: शब्द का मूल भाव पंक्तियों या क्रमबद्ध विन्यास का है; अस्पष्ट स्थापत्य विवरण को किसी अधिक निश्चित वस्तु के रूप में नहीं बाँधा गया।
- source_word: בָּאֲרָזִים
  choice: देवदार की
  rationale: यहाँ प्रयुक्त लकड़ी cedar है; हिन्दी बाइबलीय और सामान्य प्रयोग में ‘देवदार’ स्पष्ट है।
