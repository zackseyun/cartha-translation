  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सामान्य पाठक के लिए सुबोध वास्तु-शब्दावली रखी गई है। मूल इब्रानी के अंतिम पद की वास्तविक अस्पष्टता मुख्य पाठ और पादटिप्पणी के माध्यम से सुरक्षित है।
