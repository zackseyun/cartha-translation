  yaml_path: translation/ot/1_kings/006/031.yaml
  text: For the entrance of the inner sanctuary he made doors of olivewood[a]; the doorposts and jambs were five-sided.
translation:
  language: hi
  text: भीतरी पवित्रस्थान के प्रवेश के लिए उसने जैतून की लकड़ी के किवाड़ बनाए; चौखट और द्वार के पार्श्व-स्तम्भ पाँच-कोणीय थे।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “चौखट और द्वार के पार्श्व-स्तम्भ पाँचवाँ भाग बनाते थे।” अंतिम वाक्यांश का यह पारम्परिक अनुवाद सम्भव है, पर वास्तु की दृष्टि से इसका अर्थ अस्पष्ट है।
    reason: alternative_reading
lexical_decisions:
- source_word: פֶּתַח
  choice: प्रवेश
  rationale: यह शब्द किवाड़ों के बजाय प्रवेश के खुले स्थान को दर्शाता है और आगे आए דַּלְתוֹת से भेद बनाए रखता है।
- source_word: הַדְּבִיר
  choice: भीतरी पवित्रस्थान
  rationale: मन्दिर के प्रसंग में यह सबसे भीतर के पवित्र कक्ष को सूचित करता है; यह पद सहज है और बाद की विशिष्ट धार्मिक शब्दावली को अनावश्यक रूप से आरोपित नहीं करता।
- source_word: דַּלְתוֹת
  choice: किवाड़
  rationale: बहुवचन यहाँ द्वार के जोड़े वाले पल्लों को दर्शाता है; ‘किवाड़’ वर्तमान हिन्दी में वास्तु-संदर्भ के अनुकूल और सुबोध है।
- source_word: עֲצֵי שָׁמֶן
  choice: जैतून की लकड़ी
  rationale: शाब्दिक ‘तेल के पेड़ की लकड़ी’ का प्रसंगानुकूल अर्थ जैतून की लकड़ी है।
- source_word: הָאַיִל
  choice: चौखट
  rationale: वास्तु-संदर्भ में यह द्वार की सहायक संरचना या फ्रेम का बोध करा सकता है; ‘चौखट’ व्यापक फ्रेम-संरचना के लिए स्वाभाविक हिन्दी है।
- source_word: מְזוּזוֹת
  choice: द्वार के बाजू
  rationale: यह सामान्यतः द्वार के पार्श्व-खम्भों या जाम्बों को दर्शाता है; ‘द्वार के बाजू’ इसे चौखट से संबंधित पर अलग वास्तु-अंग के रूप में व्यक्त करता है।
- source_word: חֲמִשִׁית
  choice: पाँच-कोणीय थे
  rationale: इब्रानी पद अत्यन्त संक्षिप्त और वास्तु-दृष्टि से अस्पष्ट है। यह अनुवाद सम्भावित आकार का सहज बोध देता है, जबकि अनुपात-संबंधी पारम्परिक पाठ को पादटिप्पणी में सुरक्षित रखा गया है।
