  yaml_path: translation/ot/1_kings/006/008.yaml
  text: The entrance to the middle side chamber was on the right side of the house[a], and by winding stairs they went up to the middle story[b], and from the middle to the third.
translation:
  language: hi
  text: मध्य पार्श्व-कोठरी का प्रवेश-द्वार भवन के दाहिने पार्श्व में था। घुमावदार सीढ़ियों[a] से लोग मध्य मंज़िल पर चढ़ते थे, और मध्य मंज़िल से तीसरी मंज़िल पर।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “सर्पिल सीढ़ियों।” इब्रानी शब्द दुर्लभ है और सम्भवतः घुमावदार या सर्पिल सीढ़ियों को दर्शाता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “मध्य से तीसरी तक,” अर्थात मध्य मंज़िल से तीसरी मंज़िल तक।
    reason: lexical_alternative
lexical_decisions:
- source_word: פֶּתַח
  choice: प्रवेश-द्वार
  rationale: यह शब्द प्रवेश के खुले स्थान या द्वार को दर्शाता है; स्थापत्य-वर्णन में ‘प्रवेश-द्वार’ स्वाभाविक और स्पष्ट है।
- source_word: הַצֵּלָע הַתִּיכֹנָה
  choice: बीचवाली बगल की कोठरी
  rationale: मन्दिर के स्थापत्य-संदर्भ में צֵלָע किसी पसली के बजाय बगल की कोठरी या पार्श्व-कक्ष को सूचित करता है; स्त्रीलिंग एकवचन रूप बनाए रखा गया है।
- source_word: אֶל כֶּתֶף הַבַּיִת הַיְמָנִית
  choice: भवन के दाहिने पार्श्व में
  rationale: כֶּתֶף का शाब्दिक अर्थ ‘कंधा’ है, पर स्थापत्य-संदर्भ में ‘पार्श्व’ उपयुक्त है। יְמָנִית को बिना ‘दक्षिण’ मान लिए ‘दाहिना’ रखा गया है।
- source_word: וּבְלוּלִּים
  choice: घुमावदार सीढ़ियों से
  rationale: दुर्लभ इब्रानी पद को परंपरागत और संदर्भानुकूल अर्थ में घुमावदार अथवा सर्पिल सीढ़ियाँ समझा जाता है; पाठ में सहज हिन्दी रूप रखा गया है और विकल्प पादटिप्पणी में दिया गया है।
- source_word: יַעֲלוּ
  choice: लोग ... चढ़ते थे
  rationale: तृतीय पुरुष बहुवचन क्रिया यहाँ भवन में ऊपर जाने की सामान्य व्यवस्था बताती है; हिन्दी में अनिश्चित कर्ता ‘लोग’ स्वाभाविक है।
- source_word: עַל הַתִּיכֹנָה
  choice: बीचवाली मंज़िल पर
  rationale: तीन स्तरों के क्रम में यह पद मध्य स्तर या मंज़िल को दर्शाता है।
- source_word: וּמִן הַתִּיכֹנָה אֶל הַשְּׁלִשִׁים
  choice: और बीचवाली मंज़िल से तीसरी पर
  rationale: इब्रानी में ‘बीचवाली से तीसरी को’ है; हिन्दी में पहली बार ‘मंज़िल’ स्पष्ट करके अगली बार उसका लोप स्वाभाविक रूप से रखा गया है।
