base_translation:
  language: en
  yaml_path: translation/ot/1_kings/006/032.yaml
  text: Also[a], the two doors were of olivewood, and he carved on them engravings of cherubim and palm trees and open flowers, and overlaid them with gold[b]; and he spread the gold over the cherubim and over the palm trees.
translation:
  language: hi
  text: और जैतून की लकड़ी के दोनों किवाड़ों पर उसने करूबों, खजूर के पेड़ों और खिले हुए फूलों की नक्काशी[a] की और उन पर सोना मढ़ा। उसने करूबों और खजूर के पेड़ों पर सोना फैला दिया[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘करूबों, खजूर के पेड़ों और फूलों की उकेरी हुई आकृतियाँ।’
    reason: lexical_alternative
  - marker: b
    text: अंतिम खंड में प्रयुक्त इब्रानी क्रिया का शाब्दिक अर्थ ‘नीचे उतारा’ या ‘नीचे की ओर फैलाया’ है; यहाँ वह उकेरी हुई आकृतियों पर सोना लगाने का वर्णन करती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וּשְׁתֵּי דַּלְתוֹת עֲצֵי שֶׁמֶן
  choice: और जैतून की लकड़ी के दोनों किवाड़ों पर
  rationale: आरंभिक וּ पिछले वास्तु-विवरण से संबंध बनाए रखता है। דַּלְתוֹת यहाँ द्वार के किवाड़ हैं और עֲצֵי שֶׁמֶן जैतून की लकड़ी को दर्शाता है। हिंदी वाक्य को स्वाभाविक बनाने के लिए इसे अगले क्रियापद के साथ जोड़ा गया है।
- source_word: וְקָלַע ... מִקְלְעוֹת
  choice: उसने ... नक्काशी की
  rationale: मंदिर की सजावट के प्रसंग में यह लकड़ी पर आकृतियाँ खोदने या उकेरने का काम है। ‘नक्काशी की’ आधुनिक हिंदी में स्वाभाविक और ठोस अभिव्यक्ति है।
- source_word: כְּרוּבִים
  choice: करूबों
  rationale: यह मंदिर की प्रतीकात्मक स्वर्गीय आकृतियों के लिए प्रचलित बाइबलीय लिप्यंतरण है और किसी भिन्न प्रकार के प्राणी का अर्थ नहीं जोड़ता।
- source_word: תִמֹרוֹת
  choice: खजूर के पेड़ों
  rationale: मंदिर की सजावट में यह खजूर-वृक्ष की आकृतियों या अलंकरणों को दर्शाता है; ‘खजूर के पेड़’ सामान्य पाठक के लिए स्पष्ट है।
- source_word: פְּטוּרֵי צִצִּים
  choice: खिले हुए फूलों
  rationale: यह पुष्पाकार अलंकरण, संभवतः खुले हुए फूलों, को दर्शाता है। ‘खिले हुए फूल’ दृश्य अर्थ को बनाए रखता है, पर फूल की जाति निश्चित नहीं करता।
- source_word: וְצִפָּה זָהָב
  choice: उन पर सोना मढ़ा
  rationale: צפה धातु की परत चढ़ाने या मढ़ने को दर्शाता है। वास्तु और काष्ठ-सज्जा के इस प्रसंग में ‘सोना मढ़ा’ सटीक तथा स्वाभाविक है।
- source_word: וַיָּרֶד ... אֶת־הַזָּהָב
  choice: सोना फैला दिया
  rationale: इस असामान्य प्रयोग में ירד का मूल बिंब ‘नीचे उतारना’ है, पर प्रसंग नक्काशीदार आकृतियों पर सोना लगाने का है। ‘फैला दिया’ उस अनुप्रयोग को स्पष्ट करता है, जबकि पाद-टिप्पणी शाब्दिक बिंब सुरक्षित रखती है।
- source_word: עַל הַכְּרוּבִים וְעַל הַתִּמֹרוֹת
  choice: करूबों और खजूर के पेड़ों पर
  rationale: दोहराया गया עַל बताता है कि सोना विशेष रूप से इन उकेरी हुई आकृतियों पर लगाया गया था। हिंदी में एक ही ‘पर’ दोनों पदों को स्वाभाविक रूप से नियंत्रित करता है।
