- source_word: הַשְּׁלִישִׁית
  choice: तीसरी
  rationale: क्रम की तीसरी मंज़िल का सीधा संकेत।
- source_word: מִגְרָעוֹת
  choice: दीवार में कटावदार सहारे
  rationale: शब्द मंदिर की बाहरी दीवार में क्रमशः पीछे हटे हुए कटावों या कगारों को सूचित करता है, जिन पर पार्श्व भवन की कड़ियाँ टिक सकती थीं। केवल ‘कटाव’ उद्देश्य को पर्याप्त स्पष्ट नहीं करता, इसलिए ‘सहारे’ जोड़ा गया है।
