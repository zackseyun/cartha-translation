  choice: उसने भवन के चारों ओर बाहर की ओर ... बनाए थे
  rationale: शाब्दिक संरचना ‘भवन को चारों ओर बाहर’ का स्वाभाविक वास्तु-संदर्भित हिन्दी रूप। ‘भवन’ से मूल בית की पुनरावृत्ति बनी रहती है।
- source_word: לְבִלְתִּי אֲחֹז בְּקִירוֹת הַבָּיִת
  choice: ताकि कड़ियाँ भवन की दीवारों में न धँसाई जाएँ
  rationale: मूल में कर्ता/वस्तु निहित है। वास्तु-संदर्भ से कड़ियाँ अभिप्रेत समझी जाती हैं; ‘धँसाई जाएँ’ दीवार में पकड़ बनाने या जड़ने का भाव व्यक्त करता है।
