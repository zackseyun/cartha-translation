base_translation:
  language: en
  yaml_path: translation/ot/1_kings/006/006.yaml
  text: The lowest story was five cubits wide[a], the middle one six cubits wide, and the third seven cubits wide; for he made offsets around the outside of the temple[b], so that the beams would not be inserted into the walls of the temple.
translation:
  language: hi
  text: सबसे निचली मंज़िल पाँच हाथ चौड़ी थी, बीच की मंज़िल छह हाथ चौड़ी थी, और तीसरी सात हाथ चौड़ी थी; क्योंकि उसने भवन की बाहरी दीवार में चारों ओर कटाव[a] बनाए थे, ताकि कड़ियाँ भवन की दीवारों में न जड़ी जाएँ।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: मूल शब्द का अर्थ दीवार में बने पीछे हटे हुए भाग, कगारें, या अन्य वास्तु-ऑफ़सेट भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: 'शाब्दिक रूप से: “ताकि भवन की दीवारों में पकड़ न बनाई जाए।” वास्तु-संदर्भ में आशय है कि पार्श्व-संरचना की कड़ियाँ मंदिर-भवन की दीवारों में न जड़ी जाएँ।'
    reason: implicit_subject_clarification
