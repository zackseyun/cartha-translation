- source_word: שְׁקֻפִים
  choice: धँसे हुए चौखटों वाली
  rationale: यह दुर्लभ वास्तु-शब्द अनिश्चित है और संभवतः ढलवाँ, भीतर धँसे या क्रमशः सँकरे होते चौखट/किनारों का वर्णन करता है। चुना हुआ रूप पठनीय रहते हुए तकनीकी निश्चितता का दावा नहीं करता।
- source_word: אֲטֻמִים
