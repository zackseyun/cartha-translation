  rationale: אטם से बना यह निष्क्रिय कृदंत ‘बंद/जड़ा/अवरुद्ध’ का भाव दे सकता है, पर इस दुर्लभ संयुक्त वास्तु-वाक्यांश में इसका सटीक कार्य अनिश्चित है। अंग्रेज़ी परामर्श-पाठ की तरह मुख्य पाठ को संक्षिप्त रखा गया और अनिश्चितता टिप्पणी में स्पष्ट की गई है।
