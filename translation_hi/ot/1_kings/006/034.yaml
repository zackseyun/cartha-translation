translation:
  language: hi
  text: और सरू की लकड़ी के दो किवाड़[a] थे; एक किवाड़ के दो पल्ले तह होने वाले थे[b], और दूसरे किवाड़ के भी दो पल्ले तह होने वाले थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: परंपरागत अनुवाद ‘चीड़ की लकड़ी’ भी है; इब्रानी शब्द संभवतः सरू या उससे मिलते-जुलते किसी शंकुधारी वृक्ष को दर्शाता है।
    reason: lexical_alternative
  - marker: b
    text: या, ‘घूमने वाले’; यहाँ किवाड़ की बनावट बताने वाले इब्रानी शब्द दुर्लभ हैं। सामान्यतः आशय तह होने वाले दो पल्लों से समझा जाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: דַלְתוֹת
  choice: किवाड़
  rationale: यह बहुवचन मंदिर के प्रवेश के दो किवाड़ों को दर्शाता है। ‘किवाड़’ स्थापत्य-संदर्भ में स्वाभाविक है और आगे प्रत्येक किवाड़ के पल्लों से स्पष्ट रूप से अलग पहचाना जाता है।
- source_word: עֲצֵי בְרוֹשִׁים
  choice: सनोवर की लकड़ी
  rationale: בְּרוֹשׁ किसी सनोवर या उससे मिलते-जुलते शंकुधारी वृक्ष की लकड़ी का नाम है। ‘सनोवर’ आधुनिक हिन्दी में समझने योग्य है, पर वृक्ष की ठीक पहचान अनिश्चित होने के कारण विकल्प पादटिप्पणी में दिया गया है।
- source_word: צְלָעִים / קְלָעִים
  choice: पल्ले
  rationale: दोनों दुर्लभ स्थापत्य शब्द यहाँ प्रत्येक किवाड़ के दो चलायमान भागों के लिए प्रयुक्त प्रतीत होते हैं। हिन्दी में ‘पल्ले’ इस संरचना को सहज रूप से व्यक्त करता है।
- source_word: גְּלִילִים
  choice: मुड़कर खुलते थे
  rationale: शब्द में घूमने या लुढ़कने/मुड़ने का भाव है। किवाड़ के दो पल्लों के संदर्भ में यह अभिव्यक्ति उनके चलायमान, संभवतः तह होने वाले विन्यास को स्वाभाविक हिन्दी में बताती है, बिना यांत्रिकी को अत्यधिक निश्चित किए।
- source_word: הַדֶּלֶת הָאַחַת / הַדֶּלֶת הַשֵּׁנִית
  choice: पहले किवाड़ / दूसरे किवाड़
  rationale: यह चयन दोनों किवाड़ों के बीच इब्रानी पाठ के क्रमिक विरोध को स्पष्ट और स्वाभाविक हिन्दी में बनाए रखता है।
