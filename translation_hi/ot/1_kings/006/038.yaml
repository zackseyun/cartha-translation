  register: आधुनिक मानक हिन्दी; शैली गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध रखी गई है। ‘भवन’ से संदर्भित मंदिर की संरचना व्यक्त होती है, जबकि मूल के הבית को अनावश्यक रूप से किसी सांप्रदायिक पद से नहीं बदला गया।
