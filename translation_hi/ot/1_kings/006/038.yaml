  yaml_path: translation/ot/1_kings/006/038.yaml
  text: And in the eleventh year[a], in the month of Bul (that is, the eighth month), the house was finished in all its parts and according to all its specifications[b]. So he built it in seven years.
translation:
  language: hi
  text: और ग्यारहवें वर्ष में, बूल के महीने में—अर्थात आठवें महीने में[a]—भवन उसके सभी विवरणों और उसकी पूरी निर्धारित योजना के अनुसार पूरा हुआ[b]। इस प्रकार उसने उसे सात वर्ष में बनाया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: बूल इस्राएली पंचांग के आठवें महीने का पुराना नाम था।
    reason: cultural_note
  - marker: b
    text: या, “उसके सभी अंगों और उसके सभी निर्धारित विनिर्देशों के अनुसार।”
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּשָּׁנָה הָאַחַת עֶשְׂרֵה
  choice: ग्यारहवें वर्ष में
  rationale: हिब्रू क्रमसूचक काल-सूचना का स्वाभाविक और सटीक हिन्दी रूप।
- source_word: בְּיֶרַח בּוּל
  choice: बूल नामक महीने में
  rationale: יֶרַח का अर्थ यहाँ महीना है और בּוּל प्राचीन महीने का नाम है; लिप्यंतरण के साथ ‘नामक’ स्पष्टता देता है।
- source_word: הוּא הַחֹדֶשׁ הַשְּׁמִינִי
  choice: जो आठवाँ महीना है
  rationale: हिब्रू की व्याख्यात्मक समानाधिकरण संरचना को सहज हिन्दी में रखता है।
- source_word: כָּלָה הַבַּיִת
  choice: भवन ... बनकर पूरा हुआ
  rationale: כלה निर्माण की पूर्णता बताता है। संदर्भ में הבית मंदिर-भवन है; ‘भवन’ हिन्दी में संरचना का भाव स्वाभाविक रूप से व्यक्त करता है।
- source_word: לְכָל דְּבָרָיו
  choice: अपने सभी भागों
  rationale: निर्माण-संदर्भ में דְּבָרָיו भवन के समस्त ब्योरों, अंगों या घटकों को सूचित करता है; ‘भागों’ से अर्थ सामान्य पाठक के लिए स्पष्ट रहता है।
- source_word: וּלְכָל מִשְׁפָּטוֹ
  choice: अपने पूरे निर्धारित विधान के अनुसार
  rationale: מִשְׁפָּט यहाँ न्यायिक निर्णय नहीं, बल्कि निर्धारित रूप, नियम या योजना का बोध कराता है। ‘विधान’ मूल की व्यापकता बनाए रखता है।
- source_word: וַיִּבְנֵהוּ שֶׁבַע שָׁנִים
  choice: इस प्रकार उसने उसे सात वर्ष में बनाया
  rationale: वाक्य निर्माण-अवधि का सार देता है; ‘सात वर्ष में’ पूर्ण कार्य में लगी कुल अवधि को स्वाभाविक हिन्दी में व्यक्त करता है।
