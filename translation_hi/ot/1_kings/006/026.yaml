  register: भाषा आधुनिक, सरल और गरिमापूर्ण रखी गई है। ‘करूब’ को मन्दिर में बनी आकृति के रूप में संदर्भ से समझने दिया गया है; पाठ में व्याख्यात्मक शब्द नहीं जोड़े गए।
