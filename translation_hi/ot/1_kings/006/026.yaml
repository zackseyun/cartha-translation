  text: קוֹמַת֙ הַ/כְּר֣וּב הָֽ/אֶחָ֔ד עֶ֖שֶׂר בָּֽ/אַמָּ֑ה וְ/כֵ֖ן הַ/כְּר֥וּב הַ/שֵּׁנִֽי׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/006/026.yaml
  text: The height of the one cherub was ten cubits[a], and so it was with the second cherub.
translation:
  language: hi
  text: एक करूब की ऊँचाई दस हाथ[a] थी, और दूसरे करूब की भी उतनी ही थी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘हाथ’ प्राचीन समय में लंबाई की एक इकाई थी, जो लगभग कोहनी से उँगलियों के सिरे तक की दूरी के बराबर होती थी।
    reason: cultural_note
lexical_decisions:
- source_word: קוֹמַת
  choice: ऊँचाई
  rationale: मन्दिर की बनावट और करूबों के माप के संदर्भ में यह शब्द कद या ऊँचाई बताता है; यहाँ ‘ऊँचाई’ सबसे स्वाभाविक और सटीक है।
- source_word: הַכְּרוּב הָאֶחָד
  choice: एक करूब
  rationale: इब्रानी अभिव्यक्ति एक करूब को दूसरे से अलग करती है। आधुनिक हिन्दी में ‘एक करूब’ सहज है और अनावश्यक रूप से ‘पहला’ नहीं जोड़ता।
- source_word: עֶשֶׂר בָּאַמָּה
  choice: दस हाथ
  rationale: אַמָּה प्राचीन लंबाई की इकाई ‘हाथ’ (कोहनी से उँगलियों के सिरे तक की लगभग दूरी) है। हिन्दी बाइबल-परंपरा में ‘हाथ’ परिचित और प्रसंगानुकूल है।
- source_word: וְכֵן
  choice: भी उतनी ही थी
  rationale: यह दोनों करूबों की ऊँचाई की समानता व्यक्त करता है; हिन्दी में यह तुलना स्पष्ट और स्वाभाविक ढंग से आती है।
- source_word: הַכְּרוּב הַשֵּׁנִי
  choice: दूसरे करूब
  rationale: मूल पाठ स्पष्ट रूप से ‘दूसरे’ करूब का उल्लेख करता है, इसलिए इसी क्रमसूचक अर्थ को रखा गया है।
theological_decisions: []
