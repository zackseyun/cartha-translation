base_translation:
  language: en
  yaml_path: translation/ot/1_kings/006/007.yaml
  text: The house[a], when it was built, was built of finished stone quarried in advance; and no hammer or axe or any iron tool was heard in the house while it was being built.
translation:
  language: hi
  text: भवन का निर्माण खदान से पहले ही तैयार किए गए पत्थरों से हुआ था[a]; और उसके निर्माण के समय भवन में न हथौड़े की, न कुल्हाड़ी की, न लोहे के किसी भी औज़ार की आवाज़ सुनाई दी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “खदान में तैयार किए गए पत्थरों से।” इब्रानी शब्द מַסָּע एक विशिष्ट शब्द है और वह या तो खदान में पत्थर काटे जाने, या पत्थरों के खदान से पहले ही तैयार होकर लाए जाने की ओर संकेत कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הַבַּיִת
  choice: भवन
  rationale: मूल शब्द का अर्थ ‘घर/भवन’ है। यहाँ वह मंदिर की इमारत को सूचित करता है; ‘भवन’ प्रसंग में स्वाभाविक है और पद में अनुपस्थित ‘मंदिर’ शब्द को सीधे नहीं जोड़ता।
- source_word: בְּהִבָּנֹתוֹ
  choice: उसके निर्माण के समय
  rationale: ב prefixed infinitive construct समयगत परिस्थिति बताता है। हिंदी में यह वाक्यांश दोनों occurrences का durative अर्थ स्वाभाविक रूप से व्यक्त करता है।
- source_word: אֶבֶן שְׁלֵמָה
  choice: पूरी तरह तैयार किए गए पत्थर
  rationale: निर्माण-संदर्भ में שְׁלֵמָה पत्थर के संपूर्ण या पूर्णतः तैयार होने का भाव देता है; यह हिंदी में ‘साबुत पत्थर’ की संभावित अस्पष्टता से बचता है।
- source_word: מַסָּע
  choice: खदान में ही
  rationale: यह विशिष्ट शब्द संभवतः खदान, पत्थर काटने, या वहाँ से तैयार पत्थर लाए जाने की ओर संकेत करता है। मुख्य पाठ निर्माण-स्थल पर औज़ारों की आवाज़ न होने के अगले कथन के अनुरूप पत्थरों के खदान में पहले तैयार होने का अर्थ व्यक्त करता है, जबकि शब्दगत अनिश्चितता पादटिप्पणी में रखी गई है।
- source_word: נִבְנָה
  choice: निर्माण ... हुआ था
  rationale: निफ़अल पूर्ण क्रिया निर्माण की रीति बताती है; हिंदी का यह निष्क्रिय भाव स्वाभाविक और स्रोत-संगत है।
- source_word: מַקָּבוֹת
  choice: हथौड़े
  rationale: यद्यपि इब्रानी रूप बहुवचन है, औज़ारों की श्रेणी के रूप में हिंदी बहुवचन ‘हथौड़े’ स्पष्ट और स्वाभाविक है।
- source_word: הַגַּרְזֶן
  choice: कुल्हाड़ी
  rationale: यह शब्द सामान्यतः कुल्हाड़ी को सूचित करता है; ‘बसूला’ संभव है, पर कम निश्चित।
- source_word: כָּל כְּלִי בַרְזֶל
  choice: लोहे के किसी और औज़ार
  rationale: כָּל का वितरणात्मक अर्थ ‘किसी ... औज़ार’ से व्यक्त होता है। ‘और’ से स्पष्ट होता है कि पहले गिनाए औज़ार भी लोहे के औज़ारों की व्यापक श्रेणी में आते हैं।
- source_word: לֹא נִשְׁמַע
  choice: आवाज़ सुनाई नहीं दी
  rationale: שמע का निफ़अल रूप ‘सुना जाना’ बताता है। हिंदी में औज़ारों के साथ ‘आवाज़ सुनाई देना’ सबसे स्वाभाविक अभिव्यक्ति है।
