base_translation:
  language: en
  yaml_path: translation/ot/1_kings/006/002.yaml
  text: The house that King Solomon built for Yahweh was sixty cubits long[a], twenty cubits wide[c][b], and thirty cubits high.
translation:
  language: hi
  text: और[a] राजा सुलैमान ने याहवे[b] के लिए जो भवन बनाया था, वह साठ हाथ लंबा, बीस हाथ चौड़ा[c] और तीस हाथ ऊँचा था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी पाठ ‘और’ से आरंभ होता है; प्रसंगानुसार इसे हिंदी में छोड़ा भी जा सकता है।
    reason: lexical_alternative
  - marker: b
    text: ‘याहवे’ इब्रानी नाम YHWH (יהוה) को दर्शाता है; अन्य प्रचलित रूप ‘यहोवा’ है, और कई अनुवादों में इसके स्थान पर ‘प्रभु’ लिखा जाता है।
    reason: alternative_reading
  - marker: c
    text: शाब्दिक रूप में ‘उसकी चौड़ाई बीस’; यहाँ ‘हाथ’ पिछली माप से समझा जाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַבַּיִת
  choice: और ... भवन
  rationale: וְ को सामान्य संयोजक ‘और’ और בַּיִת को ‘भवन’ के रूप में प्रस्तुत किया गया है। मंदिर-निर्माण के संदर्भ में ‘भवन’ स्वाभाविक है, जबकि यह मूल के ‘घर/भवन’ रूपक को ‘मंदिर’ कहकर पूरी तरह स्पष्ट नहीं कर देता।
- source_word: אֲשֶׁר בָּנָה
  choice: जो ... बनाया था
  rationale: אֲשֶׁר संबंधवाचक उपवाक्य आरंभ करता है और Qal perfect בָּנָה पूर्ण निर्माण को बताता है; हिंदी में ‘जो ... बनाया था’ स्वाभाविक वर्णन है।
- source_word: הַמֶּלֶךְ שְׁלֹמֹה
  choice: राजा सुलैमान
  rationale: राजकीय उपाधि और नाम को मानक हिंदी क्रम में रखा गया है।
- source_word: לַיהוָה
  choice: याहवे के लिए
  rationale: ל यहाँ उद्देश्य अथवा समर्पण का भाव देता है; परमेश्वर के व्यक्तिगत नाम יהוה को लिप्यंतरित किया गया है।
- source_word: שִׁשִּׁים אַמָּה אָרְכּוֹ
  choice: साठ हाथ लंबा
  rationale: אַמָּה प्राचीन लंबाई की इकाई ‘हाथ’ है; हिंदी में माप को विशेषणात्मक ढंग से कहना स्वाभाविक है।
- source_word: וְעֶשְׂרִים רָחְבּוֹ
  choice: बीस हाथ चौड़ा
  rationale: इस खंड में אַמָּה दोहराया नहीं गया, पर समानांतर माप-क्रम से वही इकाई स्पष्टतः अभिप्रेत है; स्पष्ट और सहज हिंदी के लिए ‘हाथ’ जोड़ा गया है।
- source_word: וּשְׁלֹשִׁים אַמָּה קוֹמָתוֹ
  choice: तीस हाथ ऊँचा
  rationale: קוֹמָה यहाँ भवन की ऊँचाई बताता है; ‘तीस हाथ ऊँचा’ सटीक और स्वाभाविक हिंदी है।
theological_decisions:
- issue: परमेश्वर के नाम יהוה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में चार अक्षरों वाला व्यक्तिगत नाम יהוה है। ‘याहवे’ उसे नाम के रूप में बनाए रखता है; ‘प्रभु’ पारंपरिक प्रतिस्थापन है और ‘यहोवा’ एक प्रचलित वैकल्पिक लिप्यंतरण।
- issue: בַּיִת को मंदिर-संदर्भ में प्रस्तुत करना
  choice: भवन
  alternative: मंदिर; घर
  rationale: संदर्भ सुलैमान के मंदिर का है, पर मूल शब्द सामान्यतः ‘घर/भवन’ है। ‘भवन’ आधुनिक हिंदी में संरचना को स्पष्ट करता है और मूल की व्यापक शब्दावली को भी बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। वाक्य-विन्यास हिंदी की स्वाभाविक ‘जो ... वह ...’ संरचना अपनाता है। ‘हाथ’ को प्राचीन माप-इकाई के रूप में रखा गया है और आधुनिक मीट्रिक अनुमान नहीं जोड़ा गया, जिससे मूल की माप सुरक्षित रहती है।
