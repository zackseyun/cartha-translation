  yaml_path: translation/ot/1_kings/006/022.yaml
  text: He overlaid the whole house with gold[a], until the whole house was finished[b]; and he overlaid with gold the whole altar that belonged to the inner sanctuary.
translation:
  language: hi
  text: उसने पूरे भवन को सोने से मढ़ दिया, जब तक पूरे भवन का काम पूरा नहीं हो गया। और उसने भीतरी पवित्र स्थान[a] से सम्बद्ध पूरी वेदी को[b] सोने से मढ़ दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी दबीर; अर्थात् मन्दिर का सबसे भीतरी पवित्र कक्ष, जिसे परम्परागत रूप से “परमपवित्र स्थान” भी कहा जाता है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी पद वेदी का भीतरी पवित्र स्थान से सम्बन्ध बताता है; इसका अर्थ यह भी हो सकता है कि वह उसकी वेदी थी, उसमें थी, या उसके निकट स्थित थी।
    reason: source_ambiguity
lexical_decisions:
- source_word: הַבַּיִת
  choice: भवन
  rationale: शाब्दिक अर्थ ‘घर/भवन’ है; मन्दिर-निर्माण के प्रसंग में ‘भवन’ स्वाभाविक है और इब्रानी में यहोवा के ‘भवन’ की व्यापक शब्दावली को बनाए रखता है।
- source_word: צִפָּה
  choice: मढ़ दिया
  rationale: यहाँ क्रिया किसी सतह पर सोने की परत चढ़ाने को व्यक्त करती है; ‘मढ़ना’ हिन्दी में निर्माण और सज्जा के इस कार्य के लिए सटीक और सहज है।
- source_word: זָהָב
  choice: सोना
  rationale: धातु के लिए प्रचलित और सीधा अर्थ।
- source_word: עַד תֹּם
  choice: जब तक ... पूरा न हो गया
  rationale: वाक्यांश कार्य के पूर्ण होने की सीमा बताता है; यह हिन्दी में स्वाभाविक रूप से उसकी पूर्णता व्यक्त करता है।
- source_word: כָּל
  choice: पूरा / सारा / पूरी
  rationale: एकवचन संज्ञाओं के साथ समग्रता पर दिए गए इब्रानी बल को हिन्दी के लिंग और वाक्य-सन्दर्भ के अनुसार व्यक्त किया गया है।
- source_word: הַמִּזְבֵּחַ
  choice: वेदी
  rationale: मִזְבֵּחַ के लिए मानक, स्पष्ट हिन्दी धार्मिक-स्थापत्य शब्द।
- source_word: דְּבִיר
  choice: भीतरी पवित्रस्थान
  rationale: मन्दिर के सबसे भीतर के पवित्र कक्ष को स्पष्ट आधुनिक हिन्दी में व्यक्त करता है; ‘परमपवित्र स्थान’ पारम्परिक विकल्प है, पर मूल शब्द का तत्काल स्थापत्य अर्थ ‘भीतरी पवित्रस्थान’ से अधिक सीधे व्यक्त होता है।
- source_word: אֲשֶׁר לַדְּבִיר
  choice: जो भीतरी पवित्रस्थान से सम्बद्ध थी
  rationale: לְ सम्बन्ध, अधिकार अथवा स्थानगत निकटता बता सकता है। ‘से सम्बद्ध’ किसी एक स्थानगत व्याख्या को अनावश्यक रूप से निश्चित किए बिना मूल की अस्पष्टता बनाए रखता है।
theological_decisions:
- issue: वेदी और भीतरी पवित्रस्थान के सम्बन्ध का स्वरूप
  choice: से सम्बद्ध थी
  alternative: भीतरी पवित्रस्थान में थी / उसके सामने थी / उसकी वेदी थी
  rationale: इब्रानी לַדְּבִיר सम्बन्ध तो बताता है, पर ठीक-ठीक स्थान या स्वामित्व निश्चित नहीं करता; इसलिए अनुवाद उस तनाव को खुला रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। मूल की पुनरुक्ति—‘पूरा भवन ... सारा भवन’ और दो बार ‘सोने से मढ़ दिया’—को उसके बल और वाक्य-संरचना के कारण बनाए रखा गया है।
