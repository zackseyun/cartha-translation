source:
  edition: WLC
  text: וְ/שָׁ֣כַנְתִּ֔י בְּ/ת֖וֹךְ בְּנֵ֣י יִשְׂרָאֵ֑ל וְ/לֹ֥א אֶעֱזֹ֖ב אֶת עַמִּ֥/י יִשְׂרָאֵֽל־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/006/013.yaml
  text: And I will dwell among the children of Israel[a], and I will not forsake my people Israel.
translation:
  language: hi
  text: और मैं इस्राएलियों के बीच निवास करूँगा और अपनी प्रजा इस्राएल को नहीं त्यागूँगा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְשָׁכַנְתִּי
  choice: और मैं ... निवास करूँगा
  rationale: שׁכן परमेश्वर की अपनी प्रजा के बीच स्थायी उपस्थिति को व्यक्त करता है। ‘निवास करूँगा’ आधुनिक, गरिमापूर्ण और धर्मवैचारिक अर्थ से युक्त है।
- source_word: בְּתוֹךְ
  choice: के बीच
  rationale: बहुवचन समुदाय के संदर्भ में ‘के बीच’ स्वाभाविक रूप से समुदाय के मध्य उपस्थिति का भाव रखता है।
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: इस्राएलियों
  rationale: शाब्दिक रूप ‘इस्राएल की सन्तान’ है, पर यहाँ यह पूरे जातीय-वाचा समुदाय का पदनाम है; ‘इस्राएलियों’ आधुनिक हिन्दी में उसी अर्थ को स्पष्ट और सहज ढंग से व्यक्त करता है।
- source_word: וְלֹא אֶעֱזֹב
  choice: और ... नहीं त्यागूँगा
  rationale: עזב का यहाँ सम्बन्धपरक और वाचागत अर्थ है; ‘त्यागना’ केवल स्थान छोड़ने के बजाय साथ न छोड़ने की प्रतिज्ञा को बनाए रखता है।
- source_word: עַמִּי
  choice: अपनी प्रजा
  rationale: यह वाचागत सम्बन्ध का सीधा possessive सूत्र है। हिन्दी वाक्य में कर्ता के अनुरूप ‘अपनी प्रजा’ स्वाभाविक है।
- source_word: יִשְׂרָאֵל
  choice: इस्राएल
  rationale: व्यक्तिवाचक नाम का मानक हिन्दी लिप्यंतरण।
theological_decisions:
- issue: मन्दिर के संदर्भ में परमेश्वर के निवास की भाषा
  choice: ‘इस्राएलियों के बीच निवास करूँगा’
  alternative: ‘इस्राएलियों के मध्य रहूँगा’
  rationale: यह अनुवाद परमेश्वर की वाचागत उपस्थिति को व्यक्त करता है, पर उसे केवल मन्दिर के भवन में स्थानबद्ध नहीं करता। मूल वचन प्रजा के बीच उपस्थिति पर बल देता है; इस धर्मवैचारिक तनाव को खुला रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और सार्वजनिक पाठ के अनुकूल। ‘निवास’ धर्मवैचारिक गूँज बनाए रखता है, जबकि ‘इस्राएलियों’ सामान्य पाठक के लिए शाब्दिक ‘इस्राएल की सन्तान’ से अधिक सहज है।
