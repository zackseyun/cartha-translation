base_translation:
  language: en
  yaml_path: translation/ot/1_kings/006/015.yaml
  text: He built the walls of the house on the inside with cedar boards[a]; from the floor of the house to the walls of the ceiling he covered them with wood on the inside[b], and he overlaid the floor of the house with boards of cypress.
translation:
  language: hi
  text: उसने भवन की दीवारों की भीतरी ओर देवदार के तख्ते लगाए। भवन के फर्श से लेकर छत की दीवारों तक[a] उसने उन्हें भीतर से लकड़ी से मढ़ दिया, और भवन के फर्श पर सरो[b] के तख्ते लगाए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “छत की दीवारों तक” वाला इब्रानी वाक्यांश असामान्य है। सम्भवतः इसका अर्थ भीतर की छत या छत के अस्तर तक है।
    reason: textual_ambiguity
  - marker: b
    text: इब्रानी में प्रयुक्त वृक्ष का नाम अनिश्चित है; यह सरो, सनोबर या जुनिपर जैसा कोई शंकुधारी वृक्ष हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּבֶן
  choice: उसने ... बनाईं
  rationale: בנה निर्माण करने का सामान्य क्रियापद है। हिन्दी में प्रसंगगत क्रम स्वाभाविक रखने के लिए आरम्भिक וַ का अलग से अनुवाद नहीं किया गया।
- source_word: קִירוֹת הַבַּיִת מִבַּיְתָה
  choice: भवन की भीतरी दीवारें
  rationale: קִירוֹת का अर्थ ‘दीवारें’ है और מִבַּיְתָה भीतर की ओर किए गए काम को दर्शाता है। ‘भवन’ यहाँ मन्दिर-भवन को सूचित करता है, पर मूल के ‘घर/भवन’ शब्द को अनावश्यक रूप से ‘मन्दिर’ बनाकर स्पष्ट नहीं किया गया।
- source_word: בְּצַלְעוֹת אֲרָזִים
  choice: देवदार के तख्तों से
  rationale: צלעות यहाँ निर्माण में प्रयुक्त पट्टों या तख्तों को सूचित करता है; אֲרָזִים निश्चित रूप से देवदार की लकड़ी को दर्शाता है।
- source_word: מִקַּרְקַע הַבַּיִת
  choice: भवन के फर्श से
  rationale: קַרְקַע भवन के भीतर की निचली सतह अर्थात फर्श है।
- source_word: עַד קִירוֹת הַסִּפֻּן
  choice: छत की दीवारों तक
  rationale: मूल वाक्यांश असामान्य है और ऊपरी ढकी हुई संरचना तक पहुँचने का भाव देता है। अनुवाद उसकी कठिन संरचना को बनाए रखता है, जबकि पादटिप्पणी संभावित वास्तु-अर्थ बताती है।
- source_word: צִפָּה עֵץ מִבָּיִת
  choice: उसने भीतर लकड़ी से मढ़ दिया
  rationale: צפה का अर्थ किसी सतह को दूसरी सामग्री से ढकना या मढ़ना है। पूर्ववर्ती दीवारें इसका निहित कर्म हैं।
- source_word: וַיְצַף אֶת קַרְקַע הַבַּיִת
  choice: और भवन के फर्श को ... मढ़ा
  rationale: यहाँ צפה का स्पष्ट कर्म फर्श है; ‘मढ़ा’ उस पर लकड़ी की परत लगाने का भाव व्यक्त करता है।
- source_word: בְּצַלְעוֹת בְּרוֹשִׁים
  choice: सरो के तख्तों से
  rationale: צלעות पुनः तख्तों को दर्शाता है। בְּרוֹשִׁים किसी शंकुधारी वृक्ष का अनिश्चित नाम है; ‘सरो’ एक सम्भावित और प्रचलित आधुनिक समतुल्य है, तथा अन्य सम्भावनाएँ पादटिप्पणी में रखी गई हैं।
