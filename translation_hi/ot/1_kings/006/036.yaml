  choice: और उसने ... बनाया
  rationale: वय्यिक्तोल रूप कथा में अगली क्रिया को आगे बढ़ाता है; ‘और’ इब्रानी कथात्मक प्रवाह को स्वाभाविक हिन्दी में बनाए रखता है।
