- source_word: שְׁלֹשָׁה טוּרֵי
  choice: तीन कतारों
  rationale: טוּר निर्माण में पंक्ति अथवा परत को सूचित कर सकता है। ‘कतार’ सरल और सुबोध है, जबकि निर्माण-सन्दर्भ अर्थ को पर्याप्त रूप से स्पष्ट करता है।
- source_word: גָזִית
  choice: तराशे हुए पत्थरों
  rationale: גָזִית काटकर या तराशकर तैयार किए गए चिनाई के पत्थर को दर्शाता है; यह पद स्रोत के कार्यित पत्थर के भाव को व्यक्त करता है।
- source_word: וְטוּר
  choice: और ... एक कतार
  rationale: यद्यपि इब्रानी में ‘एक’ अंक स्पष्ट नहीं है, एकवचन טוּר तीन कतारों के अतिरिक्त एक कतार का स्वाभाविक संकेत देता है; हिन्दी में संख्या स्पष्ट करना सहज है।
- source_word: כְּרֻתֹת אֲרָזִים
  choice: देवदार की कड़ियों
  rationale: यह वाक्यांश काटकर तैयार की गई देवदार की लकड़ियों को बताता है। निर्माण-सन्दर्भ में ‘कड़ियाँ’ उनके वास्तु उपयोग को स्वाभाविक हिन्दी में व्यक्त करता है।
