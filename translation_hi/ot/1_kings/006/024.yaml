  text: And five cubits was the one wing of the cherub[a], and five cubits the second wing of the cherub; ten cubits from the end of its wings to the end of its wings.
translation:
  language: hi
  text: करूब के एक पंख की लंबाई पाँच हाथ थी, और उसके दूसरे पंख की लंबाई पाँच हाथ थी; उसके पंखों के एक सिरे से दूसरे सिरे तक दस हाथ थे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חָמֵשׁ אַמּוֹת
  choice: पाँच हाथ
  rationale: प्राचीन लंबाई की इकाई אַמָּה के लिए हिन्दी बाइबल-परंपरा में प्रचलित और सामान्य पाठकों के लिए सहज समतुल्य ‘हाथ’ चुना गया है।
- source_word: כְּנַף
  choice: पंख
  rationale: करूब की आकृति और मन्दिर के साज-सामान के इस प्रसंग में यह शब्द स्पष्ट रूप से पंख को दर्शाता है।
- source_word: הַכְּרוּב
  choice: करूब
  rationale: इब्रानी एकवचन संज्ञा का पारंपरिक हिन्दी लिप्यंतरण रखा गया है; यह प्रत्येक अलग स्वर्गीय प्राणी की आकृति को सूचित करता है।
- source_word: הָאֶחָת ... הַשֵּׁנִית
  choice: एक ... दूसरा
  rationale: ‘एक’ और ‘दूसरा’ स्रोत के क्रम और भेद को स्वाभाविक आधुनिक हिन्दी में बनाए रखते हैं।
- source_word: עֶשֶׂר אַמּוֹת
  choice: दस हाथ
  rationale: यह दोनों पंखों के पूरे फैलाव का सीधा माप है।
- source_word: מִקְצוֹת כְּנָפָיו וְעַד קְצוֹת כְּנָפָיו
  choice: दोनों पंखों की कुल चौड़ाई
  rationale: मुहावरे का आशय एक पंख के अंतिम सिरे से दूसरे पंख के अंतिम सिरे तक के पूरे फैलाव से है; मुख्य पाठ में इसे सहज वास्तु-वर्णन के रूप में दिया गया है और अधिक शाब्दिक रूप पादटिप्पणी में सुरक्षित है।
