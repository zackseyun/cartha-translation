  text: And he prepared the inner sanctuary within the house[a], to place there the ark of the covenant of Yahweh.
translation:
  language: hi
  text: उसने भवन के भीतर सबसे भीतर का पवित्रस्थान तैयार किया, ताकि वहाँ याहवे की वाचा का संदूक रखे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: דְבִיר
  choice: अंतरतम पवित्रस्थान
  rationale: मन्दिर के प्रसंग में यह शब्द उसके सबसे भीतरी कक्ष को दर्शाता है। ‘अंतरतम पवित्रस्थान’ स्थान और पवित्र उपयोग दोनों को स्वाभाविक हिन्दी में स्पष्ट करता है।
- source_word: בְּתוֹךְ הַבַּיִת
  choice: भवन के भीतर
  rationale: यह सीधा स्थानवाचक पद है। मूल के בַּיִת को ध्यान में रखते हुए ‘भवन’ रखा गया है; प्रसंग से स्पष्ट है कि यह मन्दिर-भवन है।
- source_word: מִפְּנִימָה
  choice: अंतरतम
  rationale: यह रूप भीतर की ओर या सबसे भीतरी स्थान पर बल देता है; हिन्दी में इसे ‘पवित्रस्थान’ के विशेषण के रूप में समाहित करना अधिक स्वाभाविक है।
- source_word: הֵכִין
  choice: तैयार किया
  rationale: क्रिया किसी वस्तु या स्थान को विशेष उद्देश्य के लिए तैयार करने का भाव देती है और आगे आने वाले प्रयोजनवाचक पद के साथ सहज बैठती है।
- source_word: לְתִתֵּן
  choice: ताकि … रखा जाए
  rationale: लामेद सहित धातुरूप उद्देश्य प्रकट करता है। हिन्दी का ‘ताकि … रखा जाए’ इस प्रयोजन को स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
- source_word: אֲרוֹן בְּרִית יְהוָה
  choice: याहवे की वाचा का संदूक
  rationale: यह रचना मूल के संबंधसूचक क्रम को स्पष्ट हिन्दी में व्यक्त करती है और संदूक का वाचा तथा याहवे से संबंध बनाए रखती है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय ईश्वरीय नाम को किसी उपाधि से बदलने के बजाय आधुनिक हिन्दी में उसके प्रचलित ध्वन्यात्मक रूप ‘याहवे’ से व्यक्त किया गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में व्यक्तिगत ईश्वरीय नाम सीधे प्रयुक्त है। ‘याहवे’ उसे उपाधि से बदले बिना और ‘यहोवा’ वाले अपेक्षाकृत बाद के स्वरूप से अलग रखते हुए प्रस्तुत करता है।
- issue: דְבִיר की पहचान
  choice: अंतरतम पवित्रस्थान
  alternative: भीतरी कक्ष; देववाणी-स्थान
  rationale: इस मन्दिर-निर्माण प्रसंग में शब्द सबसे भीतरी पवित्र कक्ष को सूचित करता है। अनिश्चित व्युत्पत्ति या पारम्परिक ‘देववाणी’ अर्थ को मुख्य पाठ में थोपे बिना स्थानगत अर्थ चुना गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘भवन’ मूल के ‘घर/भवन’ को सुरक्षित रखता है, जबकि प्रसंग उसके मन्दिर होने को स्पष्ट करता है।
