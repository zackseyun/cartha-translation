base_translation:
  language: en
  yaml_path: translation/ot/1_kings/006/012.yaml
  text: As for this house that you are building[a], if you walk in my statutes, carry out my judgments, and keep all my commandments by walking in them, then I will establish my word with you, which I spoke to David your father.
translation:
  language: hi
  text: “यह भवन, जिसे तुम बना रहे हो—यदि तुम मेरी विधियों के अनुसार चलोगे, मेरे न्याय-विधानों का पालन करोगे और मेरी सारी आज्ञाओं को मानोगे और उनके अनुसार चलोगे, तो मैं तुम्हारे साथ अपना वह वचन पूरा करूँगा[a], जो मैंने तुम्हारे पिता दाऊद से कहा था।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “मैं तुम्हारे साथ अपने वचन की पुष्टि करूँगा।” हिब्रू मुहावरे का शाब्दिक अर्थ ‘वचन को स्थिर करना’ है; इसका आशय पहले कहे गए वचन की पुष्टि करना या उसे पूरा करना है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הַבַּיִת הַזֶּה
  choice: यह भवन
  rationale: בַּיִת का मूल अर्थ ‘घर’ है, पर यहाँ संदर्भ मंदिर की इमारत का है। हिन्दी में ‘भवन’ मूल रूपक को काफी हद तक बनाए रखते हुए संरचना का अर्थ स्वाभाविक रूप से देता है।
- source_word: אֲשֶׁר אַתָּה בֹנֶה
  choice: जिसे तुम बना रहे हो
  rationale: कृदंत בֹנֶה चल रही निर्माण-क्रिया को व्यक्त करता है; वर्तमान प्रगतिशील हिन्दी इसे स्वाभाविक रूप से दर्शाती है।
- source_word: אִם תֵּלֵךְ בְּחֻקֹּתַי
  choice: यदि तुम मेरी विधियों पर चलोगे
  rationale: הלך यहाँ जीवन-आचरण का बिंब है। ‘चलोगे’ उस वाचा-संबंधी रूपक को बनाए रखता है, जबकि ‘विधियाँ’ חֻקּוֹת के नियत विधान का भाव देती है।
- source_word: מִשְׁפָּטַי תַּעֲשֶׂה
  choice: मेरे न्याय-विधानों का पालन करोगे
  rationale: מִשְׁפָּטִים में न्यायिक और विधिक दोनों बल हैं। ‘न्याय-विधान’ इस अर्थ-क्षेत्र को बनाए रखता है और ‘पालन करना’ हिन्दी में תעשה का स्वाभाविक निर्वाहात्मक अर्थ देता है।
- source_word: וְשָׁמַרְתָּ אֶת כָּל מִצְוֺתַי
  choice: मेरी सभी आज्ञाओं को मानकर
  rationale: שׁמר का आशय आज्ञाओं को सावधानी से मानना और उनका पालन करना है। ‘मानकर’ अगले उद्देश्य/रीति-वाचक वाक्यांश से सहज रूप से जुड़ता है।
- source_word: לָלֶכֶת בָּהֶם
  choice: उनके अनुसार चलोगे
  rationale: यह आज्ञाओं को व्यवहार में उतारने की रीति बताता है। ‘चलोगे’ पहले आए הלך के बिंब की पुनरावृत्ति रखता है, और ‘उनके अनुसार’ हिन्दी में अर्थ स्पष्ट करता है।
- source_word: וַהֲקִמֹתִי אֶת דְּבָרִי אִתָּךְ
  choice: तो मैं तुम्हारे साथ अपना वह वचन दृढ़ करूँगा
  rationale: הקים דבר पहले कहे गए वचन को स्थिर, प्रमाणित या पूरा करने का मुहावरा है। ‘वचन दृढ़ करूँगा’ हिब्रू अभिव्यक्ति और אִתָּךְ के ‘तुम्हारे साथ’ दोनों को सुरक्षित रखता है।
- source_word: דְּבָרִי
  choice: अपना वह वचन
  rationale: דבר का अर्थ ‘वचन’ भी है और संदर्भ में प्रतिज्ञा का भाव भी। ‘वचन’ अगले דִּבַּרְתִּי (‘कहा था’) से शब्दगत संबंध बनाए रखता है।
- source_word: אֲשֶׁר דִּבַּרְתִּי אֶל דָּוִד אָבִיךָ
  choice: जो मैंने तुम्हारे पिता दाऊद से कहा था
  rationale: यह דִּבַּרְתִּי का सीधा अर्थ रखता है और मुख्य पाठ में उसे स्पष्टतः ‘प्रतिज्ञा की थी’ बनाकर अर्थ को आवश्यकता से अधिक सीमित नहीं करता।
theological_decisions:
- issue: मंदिर-निर्माण, सुलैमान की आज्ञाकारिता और दाऊदी वचन का सशर्त संबंध
  choice: पद की स्पष्ट ‘यदि…तो’ संरचना रखी गई है, जिसमें सुलैमान के साथ परमेश्वर के वचन को दृढ़ करना उसकी वाचा-संबंधी आज्ञाकारिता से जुड़ा है।
  alternative: इसे केवल पूर्णतः निरपेक्ष दाऊदी वाचा की पुनर्पुष्टि मानना, या इसे ऐसा पूर्णतः सशर्त कथन मानना जो पहले के सभी निरपेक्ष पहलुओं को निरस्त कर देता है।
  rationale: हिब्रू वाक्य-विन्यास आज्ञाकारिता की शर्त स्पष्ट करता है, पर यह पद व्यापक दाऊदी वाचा के सशर्त और निरपेक्ष पहलुओं का व्यवस्थित समाधान नहीं देता। अनुवाद उसी तनाव को खुला रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य शैली अपनाई गई है। परमेश्वर द्वारा सुलैमान को संबोधन में ‘तुम’ रखा गया है; यह एकवचन संबोधन को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है। ‘विधियाँ,’ ‘न्याय-विधान’ और ‘आज्ञाएँ’ द्वारा तीन संबंधित हिब्रू विधिक शब्दों का भेद यथासंभव बनाए रखा गया है।
