base_translation:
  language: en
  yaml_path: translation/ot/1_kings/006/023.yaml
  text: In the inner sanctuary he made two cherubim of olivewood[b][a], each ten cubits high.
translation:
  language: hi
  text: उसने भीतरी पवित्रस्थान[a] में जैतून की लकड़ी के दो करूब बनाए; हर एक की ऊँचाई दस हाथ[b] थी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “परमपवित्र स्थान।”
    reason: lexical_alternative
  - marker: b
    text: एक हाथ लगभग 45 सेंटीमीटर था। इब्रानी में शाब्दिक रूप से, “उसकी ऊँचाई दस हाथ थी”; एकवचन को यहाँ दोनों करूबों में से हर एक के लिए समझा गया है।
    reason: measurement_and_grammatical_clarification
lexical_decisions:
- source_word: בַּדְּבִיר
  choice: भीतरी पवित्रस्थान
  rationale: यह शब्द मंदिर के सबसे भीतर के कक्ष को दर्शाता है। यह अनुवाद स्थान का अर्थ स्पष्ट करता है, जबकि ‘परमपवित्र स्थान’ को पाठ में अनिवार्य रूप से आरोपित नहीं करता।
- source_word: כְרוּבִים
  choice: करूब
  rationale: विशिष्ट बाइबलीय प्राणियों के लिए प्रचलित हिन्दी पारिभाषिक शब्द रखा गया है; हिन्दी में बहुवचन संख्या-सूचक पद से स्पष्ट है।
- source_word: עֲצֵי שָׁמֶן
  choice: जैतून की लकड़ी
  rationale: इस प्रसंग में वाक्यांश जैतून के पेड़ की लकड़ी को सूचित करता है और आधुनिक हिन्दी में स्वाभाविक है।
- source_word: עֶשֶׂר אַמּוֹת
  choice: दस हाथ
  rationale: अम्मा प्राचीन लंबाई की इकाई है, जिसे हिन्दी बाइबल परंपरा में सामान्यतः ‘हाथ’ कहा जाता है; माप की अनुमानित आधुनिक लंबाई पादटिप्पणी में दी गई है।
- source_word: קוֹמָתוֹ
  choice: हर एक की ऊँचाई ... थी
  rationale: इब्रानी में एकवचन ‘उसकी ऊँचाई’ है, पर दो करूबों के संदर्भ में इसे वितरणात्मक रूप से प्रत्येक के लिए समझना स्वाभाविक है।
- source_word: וַיַּעַשׂ
  choice: उसने ... बनाए
  rationale: सामान्य क्रिया ‘बनाना’ मूल के सीधे अर्थ और निर्माण-प्रसंग दोनों को सहज हिन्दी में व्यक्त करती है।
theological_decisions:
- issue: דְּבִיר के लिए तकनीकी धार्मिक पद
  choice: भीतरी पवित्रस्थान
  alternative: परमपवित्र स्थान
  rationale: मूल शब्द मंदिर के अंतरतम कक्ष को निर्दिष्ट करता है। मुख्य पाठ में स्थानगत अर्थ रखा गया है और अधिक पारंपरिक धार्मिक पद को पादटिप्पणी में विकल्प के रूप में दिया गया है।
