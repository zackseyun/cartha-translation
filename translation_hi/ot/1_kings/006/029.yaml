  text: וְ/אֵת֩ כָּל קִיר֨וֹת הַ/בַּ֜יִת מֵסַ֣ב קָלַ֗ע פִּתּוּחֵי֙ מִקְלְעוֹת֙ כְּרוּבִ֣ים וְ/תִֽמֹרֹ֔ת וּ/פְטוּרֵ֖י צִצִּ֑ים מִ/לִּ/פְנִ֖ים וְ/לַ/חִיצֽוֹן־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/006/029.yaml
  text: He carved all the walls of the house all around with engraved figures of cherubim[a], palm trees, and open flowers[c][b], on the inner and outer walls.
translation:
  language: hi
  text: उसने भवन[a] की सभी दीवारों पर चारों ओर करूबों, खजूर के पेड़ों और खिले हुए फूलों[b] की आकृतियाँ उकेरीं—भीतर और बाहर[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: मूल भाषा में ‘घर’; यहाँ यह मन्दिर-भवन के लिए प्रयुक्त है।
    reason: cultural_note
  - marker: b
    text: इसका अनुवाद ‘फूलों की कलियाँ’ या ‘खुलते हुए फूल’ भी हो सकता है; सजावटी पुष्प-आकृतियों का सटीक रूप निश्चित नहीं है।
    reason: lexical_alternative
  - marker: c
    text: इस अंतिम वाक्यांश का अर्थ अधिक सामान्य रूप से ‘अन्दर और बाहर’ भी हो सकता है; इस प्रसंग में सम्भवतः मन्दिर के भीतरी और बाहरी भाग अभिप्रेत हैं।
    reason: alternative_reading
lexical_decisions:
- source_word: קִירוֹת הַבַּיִת
  choice: भवन की ... सभी दीवारों
  rationale: בַּיִת का मूल अर्थ ‘घर’ है, पर मन्दिर-निर्माण के इस प्रसंग में ‘भवन’ स्वाभाविक है और मन्दिर की संरचना को सूचित करता है; ‘दीवारों’ मूल पाठ में स्पष्ट है।
- source_word: מֵסַב
  choice: चारों ओर की
  rationale: यह दीवारों के चारों ओर फैले होने और सजावट की व्यापकता को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: קָלַע פִּתּוּחֵי מִקְלְעוֹת
  choice: आकृतियाँ उकेरीं
  rationale: संबद्ध शब्द सजावटी नक्काशी और उत्कीर्ण आकृतियों का बोध कराते हैं। ‘आकृतियाँ उकेरीं’ स्वाभाविक हिन्दी में क्रिया और कलात्मक परिणाम दोनों व्यक्त करता है, बिना अनावश्यक तकनीकी विशिष्टता जोड़े।
- source_word: כְּרוּבִים
  choice: करूबों
  rationale: यह इन स्वर्गीय प्राणियों के लिए हिन्दी बाइबिलीय परम्परा में प्रचलित लिप्यंतरण है और बहुवचन को प्रसंगानुसार व्यक्त करता है।
- source_word: תִמֹרֹת
  choice: खजूर के पेड़ों
  rationale: यह सजावटी खजूर-वृक्ष आकृतियों का सीधा और सामान्य पाठक के लिए स्पष्ट अनुवाद है।
- source_word: פְטוּרֵי צִצִּים
  choice: खिले हुए फूलों
  rationale: पदबंध फूलों के खुलने या खिलने के रूप वाली सजावट बताता है; सटीक कलात्मक रूप अनिश्चित होने के कारण विकल्प पादटिप्पणी में रखा गया है।
- source_word: מִלִּפְנִים וְלַחִיצוֹן
  choice: भीतरी और बाहरी भागों में
  rationale: मन्दिर के प्रसंग में यह भीतरी और बाहरी क्षेत्रों/खंडों की ओर संकेत कर सकता है। ‘भागों’ जानबूझकर इतना व्यापक है कि इसे निश्चित रूप से कमरों या बाहरी मुखभाग तक सीमित न किया जाए।
