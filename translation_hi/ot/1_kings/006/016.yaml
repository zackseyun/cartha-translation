  yaml_path: translation/ot/1_kings/006/016.yaml
  text: He built twenty cubits at the rear of the house with cedar boards[a], from the floor to the walls, and he built it within as an inner sanctuary[c][b], as the Most Holy Place.
translation:
  language: hi
  text: उसने भवन के पिछले भाग में बीस हाथ का एक भाग देवदार के तख्तों से, फर्श से दीवारों तक[a], बनाया; और भवन के भीतर उसने एक भीतरी पवित्रस्थान[b], अर्थात् परमपवित्र स्थान[c], बनाया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “फर्श से कड़ियों/शहतीरों तक।” इब्रानी पाठ में “दीवारों तक” है, जिसे यहाँ रखा गया है।
    reason: alternative_reading
  - marker: b
    text: इब्रानी देबीर, मन्दिर का भीतरी पवित्र कक्ष।
    reason: cultural_note
  - marker: c
    text: 'परम्परागत अनुवाद: “पवित्रों का परमपवित्र।”'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִירְכְּתֵי הַבַּיִת
  choice: भवन के पिछले भाग में
  rationale: यह पदबंध भवन के दूरस्थ या पिछले हिस्से को सूचित करता है; यह हिन्दी में स्वाभाविक ढंग से स्थानिक अर्थ बनाए रखता है।
- source_word: בְּצַלְעוֹת אֲרָזִים
  choice: देवदार के तख्तों से
  rationale: צלעות का मूल अर्थ पसलियाँ या पार्श्व-संरचनाएँ हो सकता है, पर इस स्थापत्य प्रसंग में देवदार के तख्ते स्पष्ट और स्वाभाविक हैं।
- source_word: מִן הַקַּרְקַע עַד הַקִּירוֹת
  choice: फर्श से दीवारों तक
  rationale: मसोरेटी पाठ में स्पष्टतः 'दीवारों तक' है। स्थापत्य की दृष्टि से कठिन होने पर भी मुख्य पाठ में इसी को रखा गया है; 'कड़ियों/शहतीरों तक' वाला पाठांतर पादटिप्पणी में दिया गया है।
- source_word: וַיִּבֶן לוֹ מִבַּיִת
  choice: उसने उसके भीतर ... बनाया
  rationale: संक्षिप्त इब्रानी वाक्यांश भवन के अंदर एक अलग आंतरिक कक्ष के निर्माण का संकेत देता है।
- source_word: לִדְבִיר
  choice: एक भीतरी पवित्रस्थान
  rationale: דביר मन्दिर के सबसे अंदर के पवित्र कक्ष का तकनीकी नाम है; कार्यगत अर्थ का अनुवाद पाठक के लिए स्पष्ट है।
- source_word: לְקֹדֶשׁ הַקֳּדָשִׁים
  choice: परमपवित्र स्थान
  rationale: यह इब्रानी की परमोत्कृष्टता-सूचक रचना है और सबसे पवित्र आंतरिक कक्ष को दर्शाती है।
- source_word: אַמָּה
  choice: हाथ
  rationale: प्राचीन माप 'क्यूबिट' के लिए प्रचलित बाइबलीय हिन्दी 'हाथ' स्वाभाविक और समझने योग्य है; मूल इकाई को आधुनिक माप में बदला नहीं गया।
theological_decisions:
- issue: דביר और קֹדֶשׁ הַקֳּדָשִׁים का संबंध
  choice: एक ही आंतरिक कक्ष के लिए 'भीतरी पवित्रस्थान—परमपवित्र स्थान'
  alternative: 'दो अलग उद्देश्यसूचक पद: ''भीतरी पवित्रस्थान के लिए, परमपवित्र स्थान के लिए'''
  rationale: दोनों पद यहाँ निर्मित आंतरिक कक्ष को क्रमशः तकनीकी और पवित्रता-सूचक नाम देते हैं; डैश समानाधिकरण को स्पष्ट करता है, बिना किसी सांप्रदायिक व्याख्या के।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सामान्य पाठकों के लिए बोधगम्य स्थापत्य-वर्णन। 'भवन' प्रसंगगत रूप से मन्दिर को दर्शाता है और मूल के הַבַּיִת को औपचारिक रूप से सुरक्षित रखता है। सभी पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित हैं।
