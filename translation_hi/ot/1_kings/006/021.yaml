source:
  edition: WLC
  text: וַ/יְצַ֨ף שְׁלֹמֹ֧ה אֶת הַ/בַּ֛יִת מִ/פְּנִ֖ימָה זָהָ֣ב סָג֑וּר וַ/יְעַבֵּ֞ר ב/רתיקות זָהָב֙ לִ/פְנֵ֣י הַ/דְּבִ֔יר וַ/יְצַפֵּ֖/הוּ זָהָֽב־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/006/021.yaml
  text: Solomon overlaid the inside of the house with pure gold[a], and he drew gold chains across the front of the inner sanctuary[c][b], and overlaid it with gold.
translation:
  language: hi
  text: सुलैमान ने भवन को भीतर से शुद्ध सोने[a] से मढ़ा। उसने भीतरी पवित्रस्थान[c] के सामने सोने की जंजीरें फैला दीं[b] और उसे सोने से मढ़ दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘परिष्कृत सोना।’ इब्रानी वाक्यांश का शाब्दिक रूप ‘बंद किया हुआ सोना’ है; सम्भवतः यह उच्च कोटि के सोने के लिए प्रयुक्त मुहावरा है।
    reason: lexical_alternative
  - marker: b
    text: या, ‘भीतरी पवित्रस्थान के सामने सोने की जंजीरें लगाईं।’ इब्रानी पाठ यह बता सकता है कि जंजीरें उसके सामने रखी या फैलाई गई थीं; ‘फैला दीं’ क्रिया के ‘पार ले जाने’ वाले भाव को व्यक्त करता है।
    reason: alternative_reading
  - marker: c
    text: ‘भीतरी पवित्रस्थान’ इब्रानी ‘देबीर’ है—मंदिर का सबसे भीतर का कक्ष, जिसे बाद में ‘परमपवित्र स्थान’ कहा गया।
    reason: cultural_note
lexical_decisions:
- source_word: וַיְצַף
  choice: मढ़ा
  rationale: मन्दिर-निर्माण के प्रसंग में צפה किसी सतह को धातु की परत से ढकने का बोध देता है; ‘मढ़ा’ इसका स्वाभाविक और सटीक हिन्दी रूप है।
- source_word: הַבַּיִת
  choice: भवन
  rationale: मूल में शाब्दिक अर्थ ‘घर’ है, पर यहाँ संकेत मन्दिर की इमारत से है। ‘भवन’ स्रोत की स्थापत्य-संज्ञा को बनाए रखते हुए आधुनिक हिन्दी में स्पष्ट है।
- source_word: מִפְּנִימָה
  choice: भीतरी भाग
  rationale: यह रूप भवन के अंदरूनी हिस्से को सूचित करता है; ‘भीतरी भाग’ स्थानिक अर्थ को सहज रूप से व्यक्त करता है।
- source_word: זָהָב סָגוּר
  choice: शुद्ध सोना
  rationale: शाब्दिक रूप से यह वाक्यांश ‘बंद किया हुआ सोना’ है, किंतु सम्भवतः उच्च कोटि के परिष्कृत सोने का मुहावरा है। ‘शुद्ध सोना’ मुख्य अर्थ देता है और विकल्प पादटिप्पणी में रखा गया है।
- source_word: וַיְעַבֵּר
  choice: आर-पार लगाईं
  rationale: עבר का कारक रूप यहाँ जंजीरों को सामने से पार ले जाने या फैलाने का संकेत देता है। ‘आर-पार लगाईं’ सम्भावित व्यवस्था को स्पष्ट करता है, पर वैकल्पिक स्थानिक पाठ पादटिप्पणी में सुरक्षित है।
- source_word: בְרַתּוּקוֹת
  choice: जंजीरें
  rationale: यह दुर्लभ संज्ञा संदर्भ में सोने की जंजीरों या कड़ियों को सूचित करती है; ‘जंजीरें’ सर्वाधिक सम्भावित और सहज अर्थ है।
- source_word: לִפְנֵי הַדְּבִיר
  choice: भीतरी पवित्रस्थान के सामने
  rationale: לִפְנֵי का मूल स्थानिक अर्थ ‘के सामने’ है; क्रिया के साथ ‘आर-पार’ जोड़कर जंजीरों की सम्भावित स्थिति व्यक्त होती है।
- source_word: הַדְּבִיר
  choice: भीतरी पवित्रस्थान
  rationale: דְּבִיר मन्दिर के सबसे भीतर के कक्ष को दर्शाता है। यह अनुवाद अर्थ को स्पष्ट करता है और बाद की पारिभाषिक संज्ञा को मुख्य पाठ पर आरोपित नहीं करता।
- source_word: וַיְצַפֵּהוּ
  choice: उस पर सोना मढ़ा
  rationale: पुल्लिंग एकवचन प्रत्यय का सन्दर्भ सम्भवतः अभी उल्लिखित भीतरी पवित्रस्थान अथवा उसके सामने के भाग से है। ‘उस पर’ मूल की संदर्भगत अनिश्चितता बनाए रखता है।
