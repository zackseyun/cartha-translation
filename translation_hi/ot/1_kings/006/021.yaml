  to: सुलैमान ने भवन को भीतर से शुद्ध सोने[a] से मढ़ा। उसने भीतरी पवित्रस्थान[c] के सामने सोने की जंजीरें फैला दीं[b] और उसे सोने से मढ़ दिया।
