source:
  edition: WLC
  text: וְ/לִ/פְנֵ֣י הַ/דְּבִ֡יר עֶשְׂרִים֩ אַמָּ֨ה אֹ֜רֶךְ וְ/עֶשְׂרִ֧ים אַמָּ֣ה רֹ֗חַב וְ/עֶשְׂרִ֤ים אַמָּה֙ קֽוֹמָת֔/וֹ וַ/יְצַפֵּ֖/הוּ זָהָ֣ב סָג֑וּר וַ/יְצַ֥ף מִזְבֵּ֖חַ אָֽרֶז׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/006/020.yaml
  text: In front of the inner sanctuary was twenty cubits in length[a], twenty cubits in width, and twenty cubits in its height. He overlaid it with pure gold[b], and he overlaid the cedar altar.
translation:
  language: hi
  text: भीतरी पवित्रस्थान[a] बीस हाथ लंबा, बीस हाथ चौड़ा और बीस हाथ ऊँचा था। उसने उसे शुद्ध सोने[b] से मढ़ा और देवदार की वेदी[c] को मढ़ा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी का आरंभिक वाक्यांश शाब्दिक रूप से “भीतरी पवित्रस्थान के सामने” है; यहाँ वाक्य-विन्यास संक्षिप्त है और उसका सटीक संबंध अस्पष्ट है।
    reason: source_ambiguity
  - marker: b
    text: या, “उत्तम सोना।” इब्रानी पद उच्च गुणवत्ता के परिष्कृत सोने को दर्शाता है।
    reason: lexical_alternative
  - marker: c
    text: या, “देवदार की एक वेदी।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלִפְנֵי הַדְּבִיר
  choice: भीतरी पवित्रस्थान
  rationale: דְּבִיר मंदिर के सबसे भीतर के पवित्र कक्ष को दर्शाता है। आरंभिक לִפְנֵי के कारण वाक्य-विन्यास संक्षिप्त और अस्पष्ट है; मुख्य पाठ में स्वाभाविक हिन्दी रखी गई है और शाब्दिक संभावना पाद-टिप्पणी में दी गई है।
- source_word: עֶשְׂרִים אַמָּה ... אֹרֶךְ / רֹחַב / קוֹמָתוֹ
  choice: बीस हाथ लंबा, बीस हाथ चौड़ा और बीस हाथ ऊँचा
  rationale: आयामों की त्रिस्तरीय मूल संरचना सुरक्षित रखी गई है। אַמָּה के लिए प्रचलित बाइबिलीय हिन्दी माप ‘हाथ’ चुना गया है।
- source_word: וַיְצַפֵּהוּ
  choice: उसने उसे ... से मढ़ा
  rationale: צפה यहाँ किसी सतह पर धातु की परत चढ़ाने के अर्थ में है; ‘मढ़ा’ संक्षिप्त, स्वाभाविक और स्थापत्य-संदर्भ में सटीक है।
- source_word: זָהָב סָגוּר
  choice: शुद्ध सोना
  rationale: यह पद उच्च गुणवत्ता के परिष्कृत सोने को सूचित करता है। ‘शुद्ध सोना’ आधुनिक हिन्दी में स्पष्ट है; ‘उत्तम सोना’ पाद-टिप्पणी में दिया गया है।
- source_word: וַיְצַף מִזְבֵּחַ אָרֶז
  choice: देवदार की वेदी को भी मढ़ा
  rationale: מִזְבֵּחַ אָרֶז को देवदार की लकड़ी से बनी वेदी के रूप में समझना सहज है। समुच्चय का प्रवाह दिखाने के लिए हिन्दी में ‘भी’ जोड़ा गया है।
theological_decisions:
- issue: דְּבִיר के लिए स्थान-संज्ञा
  choice: भीतरी पवित्रस्थान
  alternative: परमपवित्र स्थान
  rationale: ‘भीतरी पवित्रस्थान’ मंदिर के आंतरिक कक्ष का संदर्भ स्पष्ट करता है, पर बाद की पारिभाषिक धार्मिक भाषा को अनावश्यक रूप से मूल में नहीं डालता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। मंदिर-वर्णन की तकनीकी सटीकता के लिए ‘मढ़ा’, ‘वेदी’ और पारंपरिक माप ‘हाथ’ का प्रयोग किया गया है; मूल के संक्षिप्त और अस्पष्ट आरंभ को पाद-टिप्पणी में सुरक्षित रखा गया है।
