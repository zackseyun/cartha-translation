- source_word: עַל כָּל הַבַּיִת
  choice: पूरे भवन से सटी हुई
  rationale: यहाँ עַל स्थानिक निकटता अथवा संलग्नता बताता है और כָּל का अर्थ “पूरे” से सुरक्षित रहता है।
- source_word: חָמֵשׁ אַמּוֹת קוֹמָתוֹ
  choice: उसकी ऊँचाई पाँच हाथ थी
