- source_word: וַיִּבֶן
  choice: उसने … बनाई
  rationale: בנה के कथात्मक भूतकाल को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है; आरम्भिक וַ को अलग से “और” कहना आवश्यक नहीं।
