- source_word: וַיֶּאֱחֹז
  choice: उसने … जोड़ दिया
  rationale: אחז का मूल भाव पकड़ना या थामना है; निर्माण-संदर्भ में यह संरचनात्मक रूप से जोड़ने का अर्थ देता है। कर्ता को “उसने” रखने से हिब्रू की सक्रिय क्रिया बनी रहती है।
- source_word: בַּעֲצֵי אֲרָזִים
  choice: देवदार की कड़ियों से
  rationale: निर्माण-संदर्भ में עֲצֵי אֲרָזִים संरचनात्मक देवदार की लकड़ी को दर्शाता है; “कड़ियाँ” हिन्दी स्थापत्य-भाषा में स्वाभाविक और पर्याप्त व्यापक है।
