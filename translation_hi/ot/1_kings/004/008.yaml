lexical_decisions:
- source_word: וְאֵלֶּה שְׁמוֹתָם
  choice: उनके नाम ये थे
  rationale: इब्रानी वाक्य क्रियारहित है, जिसका शाब्दिक अर्थ ‘और ये उनके नाम’ है। सूची के कथात्मक संदर्भ में ‘थे’ जोड़ना स्वाभाविक आधुनिक हिन्दी है; आरंभिक וְ को हिन्दी में अलग ‘और’ से व्यक्त करना आवश्यक नहीं है।
- source_word: בֶּן חוּר
  choice: बेन-हूर
  rationale: अधिकारियों की सूची में इसे व्यक्ति का नाम मानकर लिप्यंतरित किया गया है; फिर भी ‘हूर का पुत्र’ अर्थ संभव है, इसलिए विकल्प पादटिप्पणी में रखा गया है।
- source_word: בְּהַר אֶפְרָיִם
  choice: एप्रैम के पहाड़ी प्रदेश में
  rationale: इस क्षेत्रीय प्रयोग में הַר किसी एक पर्वत के बजाय पहाड़ी भूभाग को सूचित करता है। ‘पहाड़ी प्रदेश’ आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है।
