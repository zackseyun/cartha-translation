  rationale: व्यक्तिनाम का निकट देवनागरी लिप्यंतरण।
- source_word: הָיְתָה לּוֹ לְאִשָּׁה
  choice: उसकी पत्नी थी
  rationale: हिब्रू वैवाहिक संबंध का स्वाभाविक और सीधा हिन्दी रूप।
