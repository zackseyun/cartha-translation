base_translation:
  language: en
  yaml_path: translation/ot/1_kings/004/013.yaml
  text: 'Ben-geber[a], in Ramoth-gilead—to him belonged the villages of Jair son of Manasseh, which are in Gilead; to him belonged the region of Argob[b], which is in Bashan: sixty large cities with walls and bronze bars.'
translation:
  language: hi
  text: बेन-गेबेर, रामोत-गिलाद में; उसके अधीन मनश्शे के पुत्र याईर की बस्तियाँ[a] थीं, जो गिलाद में हैं। उसके अधीन अर्गोब का प्रदेश[b] भी था, जो बाशान में है—साठ बड़े नगर, जिनमें दीवारें और कांसे की सलाख़ें थीं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘याईर की डेरा-बस्तियाँ’; अथवा नाम का लिप्यंतरण, ‘हव्वोत-याईर’।
    reason: lexical_alternative
  - marker: b
    text: या ‘अर्गोब का जिला/भूभाग’।
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן גֶּבֶר
  choice: बेन-गेबेर
  rationale: प्रशासनिक अधिकारियों की इस सूची में यह पद नाम के समान प्रयुक्त होता है; इसलिए इसे किसी अनाम व्यक्ति के लिए ‘गेबेर का पुत्र’ बनाने के बजाय लिप्यंतरित किया गया है।
- source_word: בְּרָמֹת גִּלְעָד
  choice: रामोत-गिलाद में
  rationale: בְּ यहाँ स्थानसूचक है; संयुक्त स्थान-नाम को प्रचलित बाइबलीय हिन्दी रूप में रखा गया है।
- source_word: לֹו
  choice: उसके अधीन
  rationale: दो बार आया לֹו इस प्रशासनिक सूची में उस अधिकारी को सौंपे गए क्षेत्राधिकार को दर्शाता है। ‘उसके अधीन’ हिन्दी में स्वाभाविक है और मात्र निजी स्वामित्व का भ्रामक भाव नहीं देता।
- source_word: חַוֺּת יָאִיר
  choice: याईर की बस्तियाँ
  rationale: חַוּוֹת बस्तियों या डेरा-बस्तियों का द्योतक है। मुख्य पाठ में स्पष्ट आधुनिक शब्द रखा गया और अधिक शाब्दिक तथा लिप्यंतरित विकल्प पादटिप्पणी में दिए गए हैं।
- source_word: אֲשֶׁר בַּגִּלְעָד
  choice: जो गिलाद में हैं
  rationale: यह संबंधवाचक उपवाक्य याईर की बस्तियों की भौगोलिक स्थिति बताता है; भूगोल-वर्णन के लिए वर्तमान काल सुरक्षित रखा गया है।
- source_word: חֶבֶל אַרְגֹּב
  choice: अर्गोब का प्रदेश
  rationale: חֶבֶל यहाँ मापे या निर्धारित भूभाग, क्षेत्र अथवा जिले को सूचित करता है; ‘प्रदेश’ सहज और पर्याप्त व्यापक है।
- source_word: אֲשֶׁר בַּבָּשָׁן
  choice: जो बाशान में है
  rationale: यह अर्गोब के प्रदेश की भौगोलिक स्थिति बताने वाला संबंधवाचक उपवाक्य है।
- source_word: שִׁשִּׁים עָרִים גְּדֹלוֹת
  choice: साठ बड़े नगर
  rationale: גְּדֹלוֹת आकार या महत्त्व दोनों सूचित कर सकता है; दुर्गबंदी के संदर्भ में ‘बड़े’ सबसे सीधा आधुनिक हिन्दी रूप है।
- source_word: חוֹמָה
  choice: जिनके चारों ओर शहरपनाहें
  rationale: एकवचन सामूहिक रूप से साठ नगरों की परकोटेदार सुरक्षा का वर्णन करता है। ‘शहरपनाह’ साधारण दीवार के बजाय नगर की रक्षात्मक दीवार को स्पष्ट करता है।
- source_word: וּבְרִיחַ נְחֹשֶׁת
  choice: और कांसे के बेड़े
  rationale: בְּרִיחַ द्वार को बंद करने वाले आड़े बेड़े या सिटकनी को दर्शाता है, स्वयं फाटक को नहीं। ‘कांसे के बेड़े’ मूल बिंब को बनाए रखता है।
