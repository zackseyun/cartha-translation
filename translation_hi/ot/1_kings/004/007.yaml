  text: וְ/לִ/שְׁלֹמֹ֞ה שְׁנֵים עָשָׂ֤ר נִצָּבִים֙ עַל כָּל יִשְׂרָאֵ֔ל וְ/כִלְכְּל֥וּ אֶת הַ/מֶּ֖לֶךְ וְ/אֶת בֵּית֑/וֹ חֹ֧דֶשׁ בַּ/שָּׁנָ֛ה יִהְיֶ֥ה עַל אחד לְ/כַלְכֵּֽל־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/004/007.yaml
  text: And Solomon had twelve deputies over all Israel[a], and they provided for the king and his household; each one had to provide for one month in the year.
translation:
  language: hi
  text: सुलैमान के पास पूरे इस्राएल के लिए बारह अधिकारी थे। वे राजा और उसके घराने के लिए आवश्यक सामग्री उपलब्ध कराते थे। वर्ष में एक महीने के लिए यह सामग्री उपलब्ध कराने का दायित्व प्रत्येक पर होता था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְלִשְׁלֹמֹה
  choice: सुलैमान ने ... नियुक्त कर रखे थे
  rationale: इब्रानी לְ यहाँ अधिकार/संबंध का भाव देता है, शाब्दिक दिशा का नहीं। अधिकारी नियुक्त होने की बात अगले पदबंध נִצָּבִים में निहित है; हिंदी में इसे स्वाभाविक रूप से व्यक्त किया गया है।
- source_word: שְׁנֵים עָשָׂר
  choice: बारह
  rationale: मूल संख्या का सीधा और स्पष्ट अनुवाद।
- source_word: נִצָּבִים
  choice: अधिकारी
  rationale: यह शब्द नियुक्त प्रशासनिक व्यक्तियों के लिए व्यापक रूप से प्रयुक्त होता है। 'अधिकारी' आधुनिक हिंदी में स्वाभाविक है और 'राज्यपाल' जैसी अधिक विशिष्ट पदवी आरोपित नहीं करता।
- source_word: עַל כָּל יִשְׂרָאֵל
  choice: पूरे इस्राएल पर
  rationale: עַל यहाँ प्रशासनिक अधिकार अथवा दायित्व के क्षेत्र को दर्शाता है; 'पर' मूल की संरचना और अर्थ दोनों बनाए रखता है।
- source_word: וְכִלְכְּלוּ
  choice: भोजन-सामग्री जुटाते थे
  rationale: כלכל का संदर्भ राजा और राजपरिवार के भरण-पोषण हेतु आवश्यक रसद उपलब्ध कराने से है। 'भोजन-सामग्री जुटाना' केवल सामान्य देखभाल की अपेक्षा इस प्रशासनिक आपूर्ति को अधिक स्पष्ट करता है।
- source_word: אֶת הַמֶּלֶךְ וְאֶת בֵּיתוֹ
  choice: राजा और उसके घराने के लिए
  rationale: בֵּיתוֹ यहाँ भवन नहीं, राजा के घराने अथवा राजकीय गृहस्थी को सूचित करता है। हिंदी में 'के लिए' आपूर्ति के लक्ष्य को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: חֹדֶשׁ בַּשָּׁנָה
  choice: वर्ष में एक महीना
  rationale: यह पदबंध हर अधिकारी के वार्षिक दायित्व की एक महीने की अवधि बताता है।
- source_word: יִהְיֶה עַל אחד לְכַלְכֵּל
  choice: भोजन-सामग्री जुटाने की ज़िम्मेदारी हर एक की होती थी
  rationale: शाब्दिक भाव 'एक पर होता था' है, जो बारी-बारी से प्रत्येक अधिकारी पर पड़ने वाले दायित्व को दर्शाता है। हिंदी में दायित्व का भाव स्पष्ट और स्वाभाविक रूप से व्यक्त किया गया है।
