base_translation:
  language: en
  yaml_path: translation/ot/1_kings/004/004.yaml
  text: Benaiah son of Jehoiada was over the army[a], and Zadok and Abiathar were priests.
translation:
  language: hi
  text: यहोयादा का पुत्र बनायाह सेना का अधिकारी था, और सादोक तथा एब्यातार याजक[a] थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “प्रधान अधिकारी” अथवा “प्रमुख पदाधिकारी,” यदि यहाँ כֹּהֲנִים को राजदरबार के प्रशासन से जुड़े व्यापक अर्थ में समझा जाए।
    reason: alternative_reading
lexical_decisions:
- source_word: עַל הַצָּבָא
  choice: सेना का अधिकारी था
  rationale: עַל किसी कार्यक्षेत्र या पद के साथ अधिकार और देखरेख का भाव देता है। हिंदी में यह पदवी को अनावश्यक रूप से निश्चित किए बिना स्वाभाविक रूप से उस भाव को व्यक्त करता है।
- source_word: הַצָּבָא
  choice: सेना
  rationale: यहाँ צָבָא संगठित सैन्य बल को दर्शाता है, न कि स्वर्गीय सेना को।
- source_word: כֹּהֲנִים
  choice: याजक
  rationale: इस शब्द का सामान्य और प्राथमिक अर्थ याजक है; सादोक और एब्यातार भी अन्यत्र याजकीय व्यक्तियों के रूप में जाने जाते हैं।
- source_word: בְנָיָהוּ
  choice: बनायाह
  rationale: इब्रानी नाम का देवनागरी में स्रोत-सापेक्ष लिप्यंतरण।
- source_word: יְהוֹיָדָע
  choice: यहोयादा
  rationale: इब्रानी नाम का देवनागरी में प्रचलित, स्रोत-सापेक्ष लिप्यंतरण।
- source_word: צָדוֹק
  choice: सादोक
  rationale: इब्रानी नाम का देवनागरी में स्रोत-सापेक्ष लिप्यंतरण।
- source_word: אֶבְיָתָר
  choice: एब्यातार
  rationale: इब्रानी नाम का देवनागरी में स्रोत-सापेक्ष लिप्यंतरण।
theological_decisions:
- issue: राजकीय प्रशासनिक सूची के संदर्भ में כֹּהֲנִים का अर्थ याजक माना जाए या प्रधान अधिकारी।
  choice: याजक
  alternative: प्रधान अधिकारी या प्रमुख पदाधिकारी
  rationale: इब्रानी शब्द का सामान्य अर्थ याजक है और दोनों व्यक्ति अन्यत्र स्पष्ट रूप से याजक हैं। प्रशासनिक संदर्भ वैकल्पिक अर्थ को संभव बनाता है, पर उसे मुख्य पाठ में रखने के लिए पर्याप्त नहीं है; इसलिए उसे पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिंदी में सरल, गरिमापूर्ण और सहज वाक्य-विन्यास अपनाया गया है। ‘सेना का अधिकारी’ अधिकार के भाव को रखता है, पर ‘सेनापति’ जैसी अधिक निश्चित पदवी नहीं जोड़ता।
