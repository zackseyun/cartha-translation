base_translation:
  language: en
  yaml_path: translation/ot/1_kings/004/012.yaml
  text: 'Baana son of Ahilud: Taanach and Megiddo[a], and all Beth-shean, which is beside Zarethan below Jezreel, from Beth-shean to Abel-meholah, as far as beyond Jokmeam.'
translation:
  language: hi
  text: अहीलूद का पुत्र बाना—तानाक और मगिद्दो, और बेत-शान का पूरा क्षेत्र, जो सारतान के पास, यिज्रेल के नीचे है; बेत-शान से आबेल-महोला तक, और योकमाम के पार तक।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “योकमाम के पार के क्षेत्र तक।” इब्रानी में सीमा बताने वाला यह वाक्यांश संक्षिप्त और कुछ कठिन है।
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּֽעֲנָא֙ בֶּן אֲחִיל֔וּד
  choice: अहीलूद का पुत्र बाना
  rationale: व्यक्तिनामों का अर्थानुवाद न करके देवनागरी में लिप्यंतरण किया गया है; वंश-संबंध को स्वाभाविक हिन्दी क्रम में रखा गया है।
- source_word: תַּעְנַ֖ךְ וּמְגִדּוֹ
  choice: तानाक और मगिद्दो
  rationale: दोनों स्थान-नामों का स्रोत-रूप के निकट, हिन्दी-पाठक के लिए सहज लिप्यंतरण किया गया है।
- source_word: וְכָל בֵּית שְׁאָן
  choice: और बेत-शान का पूरा क्षेत्र
  rationale: यहाँ כָל के साथ स्थान-नाम केवल नगर नहीं, उससे संबद्ध पूरे प्रशासनिक भूभाग का संकेत देता है; इसलिए निहित क्षेत्रीय अर्थ स्पष्ट किया गया है।
- source_word: אֲשֶׁר אֵצֶל צָרְתַנָה
  choice: जो ... सारतान के पास है
  rationale: אֵצֶל का स्थानवाचक अर्थ ‘पास/निकट’ है; ‘के पास’ दूरी को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: מִתַּחַת לְיִזְרְעֶאל
  choice: यिज्रेल के नीचे
  rationale: मूल का स्थलाकृतिक ‘नीचे’ बनाए रखा गया है; इसे अनुमानपूर्वक ‘दक्षिण में’ नहीं किया गया।
- source_word: מִבֵּית שְׁאָן עַד אָבֵל מְחוֹלָה
  choice: बेत-शान से आबेल-महोला तक
  rationale: यह जिले की सीमा या विस्तार बताने वाली सीधी संरचना है; स्थान-नाम लिप्यंतरित हैं।
- source_word: עַד מֵעֵבֶר לְיָקְמֳעָם
  choice: और योकमाम के पार तक
  rationale: संक्षिप्त और कुछ कठिन इब्रानी सीमा-वाक्यांश के ‘पार/दूसरी ओर’ वाले स्थानिक भाव को सुरक्षित रखते हुए स्वाभाविक हिन्दी दी गई है।
