base_translation:
  language: en
  yaml_path: translation/ot/1_kings/004/005.yaml
  text: Azariahu son of Nathan was over the governors[a], and Zabud son of Nathan was priest and the king’s friend.
translation:
  language: hi
  text: और नातान का पुत्र अजर्याह प्रांतों के अधिकारियों का प्रभारी था; और नातान का पुत्र ज़ाबूद याजक[a] और राजा का मित्र था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या संभवतः, इस राजदरबारी संदर्भ में “प्रधान अधिकारी” अथवा “राजकीय सलाहकार।”
    reason: כֹּהֵן का सामान्य अर्थ “याजक” है, किंतु कुछ राजकीय संदर्भों में यह किसी उच्च दरबारी पद को भी सूचित कर सकता है।
lexical_decisions:
- source_word: עֲזַרְיָהוּ
  choice: अजर्याह
  rationale: इब्रानी नाम का प्रचलित और सहज हिन्दी लिप्यंतरण; मूल के -याहू घटक का प्रतिनिधित्व हिन्दी बाइबल-परंपरा में स्वाभाविक रूप से -याह द्वारा होता है।
- source_word: בֶן נָתָן
  choice: नातान का पुत्र
  rationale: वंश अथवा संबंध बताने वाली इब्रानी रचना का मानक, स्पष्ट हिन्दी रूप।
- source_word: עַל הַנִּצָּבִים
  choice: प्रांत-अधिकारियों का प्रभारी
  rationale: עַל यहाँ अधिकार या देखरेख व्यक्त करता है, जबकि נִצָּבִים सुलैमान की प्रशासनिक व्यवस्था में नियुक्त अधिकारियों को सूचित करता है। 'प्रांत-अधिकारी' उनके प्रशासनिक कार्य को साधारण पाठक के लिए स्पष्ट करता है।
- source_word: זָבוּד
  choice: जाबूद
  rationale: व्यक्तिनाम का इब्रानी उच्चारण के निकट हिन्दी लिप्यंतरण।
- source_word: כֹּהֵן
  choice: याजक
  rationale: शब्द का सामान्य और प्रत्यक्ष अर्थ 'याजक' है; राजदरबार के संदर्भ में संभावित उच्च अधिकारी अथवा राजकीय सलाहकार का अर्थ पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: רֵעֶה הַמֶּלֶךְ
  choice: राजा का मित्र
  rationale: मूल रचना का सीधा और स्वाभाविक अनुवाद, जो निकट राजकीय विश्वासपात्र होने का संकेत भी बनाए रखता है।
theological_decisions:
- issue: राजकीय प्रशासनिक संदर्भ में כֹּהֵן का अर्थ
  choice: मुख्य पाठ में 'याजक'
  alternative: प्रधान मंत्री, उच्च राजकीय अधिकारी अथवा राजकीय सलाहकार
  rationale: כֹּהֵן का सामान्य शाब्दिक अर्थ 'याजक' है। दरबारी सूची का संदर्भ विस्तृत पद-अर्थ की संभावना उत्पन्न करता है, पर उसे मुख्य पाठ में निश्चित कर देना मूल की अस्पष्टता को मिटा देगा; इसलिए विकल्प पादटिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी, संक्षिप्त प्रशासनिक सूची की शैली और गरिमापूर्ण बाइबलीय भाषा। नामों के लिए सहज हिन्दी बाइबल-रूप अपनाए गए हैं। अर्धविराम दोनों समानांतर पद-विवरणों को स्पष्ट रूप से अलग करता है।
