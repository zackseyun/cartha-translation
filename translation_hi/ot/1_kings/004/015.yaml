  text: नप्ताली में अहीमास[a]; उसने भी सुलैमान की बेटी बासमत को पत्नी के रूप में लिया[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इसका अनुवाद ‘नप्ताली पर’ या ‘नप्ताली के लिए’ भी हो सकता है; यहाँ इब्रानी संबंधबोधक शब्द उस क्षेत्र को सूचित कर सकता है जो अधिकारियों की इस सूची में अहीमास को सौंपा गया था।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, ‘सुलैमान की बेटी बासमत को पत्नी के रूप में लिया’; यह विवाह करने के लिए प्रयुक्त एक सामान्य इब्रानी मुहावरा है।
    reason: lexical_alternative
