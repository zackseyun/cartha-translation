- source_word: לָקַח ... לְאִשָּׁה
  choice: को पत्नी बनाया
  rationale: शाब्दिक रूप ‘पत्नी के लिए लिया’ हिंदी में अस्वाभाविक और संभावित रूप से भ्रामक है; यह मानक इब्रानी विवाह-वाक्यांश है, जिसे ‘पत्नी बनाया’ सहजता से व्यक्त करता है।
- source_word: בָּשְׂמַת
  choice: बासमत
  rationale: इब्रानी व्यक्ति-नाम का देवनागरी लिप्यंतरण।
- source_word: בַּת שְׁלֹמֹה
  choice: सुलैमान की बेटी
  rationale: इब्रानी संबंधवाचक संरचना का सीधा और स्वाभाविक हिंदी रूप।
