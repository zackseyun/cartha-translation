translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। स्थानों और व्यक्तियों के नाम हिब्रू के निकट लिप्यंतरित हैं। दोहराए गए ‘देश’ को मूल की भौगोलिक-समानाधिकरण संरचना दिखाने के लिए बनाए रखा गया है; डैश से उस संरचना को हिन्दी में पठनीय बनाया गया है।
