  text: גֶּ֥בֶר בֶּן אֻרִ֖י בְּ/אֶ֣רֶץ גִּלְעָ֑ד אֶ֜רֶץ סִיח֣וֹן מֶ֣לֶךְ הָ/אֱמֹרִ֗י וְ/עֹג֙ מֶ֣לֶךְ הַ/בָּשָׁ֔ן וּ/נְצִ֥יב אֶחָ֖ד אֲשֶׁ֥ר בָּ/אָֽרֶץ־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/004/019.yaml
  text: Geber son of Uri[a], in the land of Gilead, the land of Sihon king of the Amorites and of Og king of Bashan; and he was the only governor who was in the land.
translation:
  language: hi
  text: ऊरी का पुत्र गेबर गिलाद के देश में—अर्थात् एमोरियों के राजा सीहोन और बाशान के राजा ओग के देश में—था; और वह उस देश में एकमात्र प्रशासक था।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “और वह उस देश पर एकमात्र प्रशासक था।” हिब्रू में शाब्दिक रूप से “जो उस देश में था” है; कुछ लोग इसे प्रशासनिक अर्थ में “जो उस देश पर था” समझते हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: גֶּבֶר
  choice: गेबर
  rationale: यह व्यक्ति का नाम है; हिब्रू उच्चारण के निकट देवनागरी लिप्यंतरण किया गया है।
- source_word: בֶּן אֻרִי
  choice: ऊरी का पुत्र
  rationale: हिब्रू वंशसूचक रचना का स्वाभाविक और स्पष्ट हिन्दी रूप।
- source_word: בְּאֶרֶץ גִּלְעָד
  choice: गिलाद देश में
  rationale: אֶרֶץ को ‘देश’ के रूप में स्पष्ट रखा गया है, क्योंकि अगला समानाधिकरण पद उसी भूभाग का और परिचय देता है।
- source_word: אֶרֶץ סִיחוֹן מֶלֶךְ הָאֱמֹרִי וְעֹג מֶלֶךְ הַבָּשָׁן
  choice: एमोरियों के राजा सीहोन और बाशान के राजा ओग के देश में
  rationale: यह पद गिलाद की पहचान इन दोनों राजाओं के पूर्व भूभाग के रूप में कराता है; हिन्दी में संबंध स्पष्ट रखते हुए मूल की समानाधिकरण संरचना बचाई गई है।
- source_word: נְצִיב
  choice: प्रशासक
  rationale: इस अध्याय के प्रशासनिक संदर्भ में यह किसी नियुक्त प्रादेशिक अधिकारी को दर्शाता है। ‘प्रशासक’ आधुनिक हिन्दी में स्पष्ट है और ‘राज्यपाल’ से जुड़ी आधुनिक संवैधानिक ध्वनि से बचता है।
- source_word: אֶחָד
  choice: एकमात्र
  rationale: यहाँ संख्या एक उस भूभाग में अकेले प्रशासक होने पर बल देती प्रतीत होती है; ‘एकमात्र’ इसे स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: אֲשֶׁר בָּאָרֶץ
  choice: जो उस देश में था
  rationale: मुख्य पाठ में इसे स्वाभाविक रूप से ‘उस देश में ... था’ के रूप में समाहित किया गया है। ב का शाब्दिक स्थानीय अर्थ रखा गया है; सम्भावित प्रशासनिक अर्थ पादटिप्पणी में दिया गया है।
