  text: Judah and Israel were as numerous as the sand by the sea in multitude[a], eating and drinking and rejoicing.
translation:
  language: hi
  text: यहूदा और इस्राएल के लोग समुद्र के किनारे की रेत के समान बहुत बड़ी संख्या में थे[a]। वे खाते-पीते और आनन्दित रहते थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात, संख्या की बहुतायत में समुद्र के किनारे की रेत के समान; यह अत्यन्त बड़ी जनसंख्या के लिए प्रयुक्त एक सामान्य इब्रानी अभिव्यक्ति है।
    reason: मूल उपमा और לָרֹב के स्पष्ट संख्यात्मक बल को दर्शाने के लिए।
lexical_decisions:
- source_word: יְהוּדָה וְיִשְׂרָאֵל
  choice: यहूदा और इस्राएल के लोग
  rationale: दोनों नाम सामूहिक जनसमुदायों को सूचित करते हैं। हिन्दी में संख्या और मानवीय क्रियाओं के साथ स्वाभाविकता के लिए ‘के लोग’ स्पष्ट रूप से जोड़ा गया है।
- source_word: רַבִּים
  choice: असंख्य थे
  rationale: मूल अर्थ ‘बहुत/बहुसंख्य’ है; रेत की उपमा के संदर्भ में ‘असंख्य’ विशाल जनसंख्या का भाव स्वाभाविक और संक्षिप्त रूप से व्यक्त करता है।
- source_word: כַּחוֹל אֲשֶׁר עַל הַיָּם לָרֹב
  choice: समुद्र के किनारे की रेत के समान असंख्य
  rationale: यह इब्रानी की अत्यन्त बड़ी संख्या सूचित करने वाली प्रचलित उपमा है। ‘समुद्र के किनारे’ עַל הַיָּם का सन्दर्भानुकूल हिन्दी रूप है, और לָרֹב का संख्यात्मक बल ‘असंख्य’ में समाहित है।
- source_word: אֹכְלִים וְשֹׁתִים
  choice: खाते-पीते
  rationale: इब्रानी कृदन्त निरन्तर अथवा सामान्य दशा दर्शाते हैं। संयुक्त हिन्दी प्रयोग उसी वर्णनात्मक प्रवाह को बनाए रखता है।
- source_word: וּשְׂמֵחִים
  choice: और आनन्द मनाते थे
  rationale: यह रूप प्रसन्नता और उत्सवपूर्ण सुख-समृद्धि की दशा व्यक्त करता है; ‘आनन्द मनाते थे’ आधुनिक हिन्दी में स्वाभाविक है और पूर्ववर्ती क्रियाओं के साथ लय बनाए रखता है।
