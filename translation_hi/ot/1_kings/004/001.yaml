translation:
  language: hi
  text: राजा सुलैमान समूचे इस्राएल का राजा था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: था
  rationale: यहाँ וַיְהִי नए वर्णन-खंड की ओर संक्रमण कराता है और मुख्यतः स्थिति बताता है; हिंदी में अलग से ‘और ऐसा हुआ’ जोड़ना अस्वाभाविक और अनावश्यक होगा। वाक्य के अंत का ‘था’ विधेय को स्वाभाविक रूप से व्यक्त करता है।
- source_word: הַמֶּלֶךְ
  choice: राजा
  rationale: 'निश्चित संज्ञा यहाँ व्यक्तिनाम के साथ उपाधि के रूप में प्रयुक्त है: ‘राजा सुलैमान’।'
- source_word: שְׁלֹמֹה
  choice: सुलैमान
  rationale: यह हिंदी बाइबलीय परंपरा में इस व्यक्तिनाम का प्रचलित रूप है।
- source_word: מֶלֶךְ
  choice: राजा था
  rationale: दूसरा מֶלֶךְ विधेयात्मक संज्ञा है। ‘राजा था’ मूल की संज्ञात्मक रचना और ‘राजा’ की पुनरावृत्ति दोनों बनाए रखता है; ‘राज्य करता था’ की अपेक्षा यह स्रोत के अधिक निकट है।
- source_word: עַל
  choice: पर
  rationale: राजकीय अधिकार के संदर्भ में עַל किसी प्रजा या राष्ट्र पर शासनाधिकार व्यक्त करता है; हिंदी में ‘पर’ इसका स्वाभाविक समतुल्य है।
- source_word: כָּל
  choice: समूचे
  rationale: यह इस्राएल की संपूर्णता को व्यक्त करता है। ‘समूचे इस्राएल’ आधुनिक हिंदी में स्वाभाविक है और एकीकृत राष्ट्र पर बल बनाए रखता है।
- source_word: יִשְׂרָאֵל
  choice: इस्राएल
  rationale: राष्ट्रीय नाम का मानक हिंदी बाइबलीय रूप।
theological_decisions:
- issue: מֶלֶךְ की दोहरी अभिव्यक्ति
  choice: 'दोनों occurrences को ‘राजा’ के रूप में रखना: ‘राजा सुलैमान ... राजा था।’'
  alternative: ‘सुलैमान समूचे इस्राएल पर राजा था’ अथवा ‘राजा सुलैमान समूचे इस्राएल पर शासन करता था।’
  rationale: इब्रानी में पहला प्रयोग उपाधि और दूसरा विधेय है। दोनों को बनाए रखने से सुलैमान के समस्त इस्राएल पर स्थापित राजत्व का मूल बल सुरक्षित रहता है, बिना अतिरिक्त धार्मिक व्याख्या जोड़े।
translation_notes:
  register: सरल, आधुनिक और गरिमापूर्ण मानक हिंदी। मूल की जानबूझकर की गई ‘राजा’ पुनरावृत्ति सुरक्षित रखी गई है। कोई पादटिप्पणी आवश्यक नहीं।
