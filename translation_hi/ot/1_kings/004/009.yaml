    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן דֶּקֶר
  choice: बेन-देकेर
  rationale: इस प्रशासनिक सूची में यह रूप किसी अधिकारी के व्यक्तिगत नाम अथवा पदनाम के रूप में प्रयुक्त है। लिप्यंतरण इब्रानी नाम-रूप को सुरक्षित रखता है; शाब्दिक विकल्प पादटिप्पणी में दिया गया है।
- source_word: בְּ/מָקַץ
  choice: माकस में
  rationale: בְ स्थानसूचक है; इसलिए प्रशासनिक संदर्भ से 'का अधिकारी' या 'पर' जोड़ने के बजाय सीधे 'में' रखा गया है। צ को यहाँ हिंदी में प्रचलित निकटतम ध्वनि 'स' से दर्शाया गया है।
- source_word: וּ/בְ/שַׁעַלְבִים
  choice: शालबीम में
  rationale: संयोजक और स्थानसूचक पूर्वसर्ग को स्वाभाविक हिंदी क्रम में व्यक्त किया गया है तथा स्थान-नाम का लिप्यंतरण किया गया है।
- source_word: וּ/בֵית שָׁמֶשׁ
  choice: बेत-शेमेश में
  rationale: पूर्वसर्ग स्पष्ट रूप से दोहराया नहीं गया, पर सूची में पिछले स्थानसूचक בְ का प्रभाव जारी है। संयुक्त स्थान-नाम को अनूदित करने के बजाय लिप्यंतरित किया गया है।
- source_word: וְ/אֵילֹון בֵּית חָנָן
  choice: एलोन-बेत-हानान में
  rationale: इसे नगरों की सूची में एक संयुक्त स्थान-नाम माना गया है। हिंदी में पिछले पदों से चली आ रही स्थानसूचकता स्पष्ट करने के लिए 'में' रखा गया है।
