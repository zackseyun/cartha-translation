  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “इस्साकार पर”; अर्थात् वहाँ का अधिकारी।
    reason: हिब्रू पूर्वसर्ग का शाब्दिक अर्थ ‘में’ है, जबकि प्रशासनिक प्रसंग में ‘पर नियुक्त’ अथवा ‘का अधिकारी’ अभिप्रेत हो सकता है।
lexical_decisions:
- source_word: יְהוֹשָׁפָט
  choice: यहोशापात
  rationale: व्यक्तिवाचक नाम का प्रचलित हिन्दी बाइबलीय लिप्यंतरण।
- source_word: בֶּן
  choice: का पुत्र
  rationale: वंश अथवा पिता-पुत्र संबंध बताने वाला सामान्य पद; हिन्दी में स्वाभाविक क्रम के लिए पिता का नाम पहले रखा गया है।
- source_word: פָּרוּחַ
  choice: पारूह
  rationale: व्यक्तिवाचक नाम का हिब्रू उच्चारण के निकट देवनागरी लिप्यंतरण।
- source_word: בְּ/יִשָׂשכָר
  choice: इस्साकार में
  rationale: पूर्वसर्ग בְ का निकट अर्थ ‘में’ है। प्रशासनिक सूची के प्रसंग में यह उसके नियुक्त क्षेत्र को दर्शाता है, पर मुख्य पाठ में हिब्रू की संक्षिप्तता और अस्पष्टता सुरक्षित रखी गई है।
