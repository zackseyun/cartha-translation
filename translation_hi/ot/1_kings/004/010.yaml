lexical_decisions:
- source_word: בֶּן חֶסֶד
  choice: बेन-हेसेद
  rationale: इस प्रशासनिक सूची में यह पदबंध अधिकारी के नाम के रूप में काम करता है। लिप्यंतरण नामसूचक प्रयोग को बनाए रखता है, जबकि शाब्दिक अर्थ पादटिप्पणी में दिया गया है।
- source_word: בָּאֲרֻבּוֹת
  choice: अरुब्बोत में
  rationale: उपसर्ग ב यहाँ स्थानवाचक ‘में’ है; स्थान-नाम का देवनागरी में लिप्यंतरण किया गया है।
- source_word: לוֹ
  choice: उसके अधीन था
  rationale: जिलों की प्रशासनिक सूची के संदर्भ में यह पदबंध उस अधिकारी को सौंपे गए क्षेत्र को दर्शाता है। ‘उसके अधीन था’ आधुनिक हिन्दी में इस आशय को स्वाभाविक रूप से व्यक्त करता है।
- source_word: שֹׂכֹה
  choice: सोको
  rationale: यह स्थान-नाम है, इसलिए इसका अनुवाद न करके देवनागरी में लिप्यंतरण किया गया है।
- source_word: וְכָל אֶרֶץ חֵפֶר
  choice: और हेपेर का सारा प्रदेश
  rationale: यहाँ אֶרֶץ किसी भूभाग या प्रशासनिक क्षेत्र को सूचित करता है; ‘प्रदेश’ संदर्भानुकूल है और ‘सारा’ כָל को सुरक्षित रखता है।
