base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/058.yaml
  text: that he may incline our hearts to himself[a], to walk in all his ways and to keep his commandments, his statutes, and his judgments, which he commanded our fathers.
translation:
  language: hi
  text: ताकि वह हमारे हृदयों को अपनी ओर फेरे, कि हम उसके सब मार्गों पर चलें और उसकी आज्ञाओं, विधियों और न्याय-विधानों का पालन करें, जिनकी आज्ञा उसने हमारे पितरों[a] को दी थी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात् हमारे पूर्वजों। इब्रानी में शाब्दिक रूप से ‘हमारे पितरों’।
    reason: मूल इब्रानी के पुल्लिंग पारिवारिक पद को मुख्य पाठ में बनाए रखते हुए उसके व्यापक वंशगत संदर्भ को स्पष्ट करना।
lexical_decisions:
- source_word: לְהַטּוֹת לְבָבֵנוּ אֵלָיו
  choice: हमारे मनों को अपनी ओर फेरे
  rationale: हिफ़ील रूप दिशा देने या मोड़ने का भाव रखता है। हिन्दी में ‘मन को अपनी ओर फेरना’ भीतरी इच्छा, विचार और लगाव को परमेश्वर की ओर निर्देशित करने का स्वाभाविक रूप है।
- source_word: לָלֶכֶת בְּכָל דְּרָכָיו
  choice: उसके सभी मार्गों पर चलें
  rationale: यह वाचा-संबंधी आचरण का रूपक है; ‘मार्गों पर चलना’ मूल चित्र को बनाए रखते हुए हिन्दी में स्पष्ट है।
- source_word: וְלִשְׁמֹר
  choice: पालन करें
  rationale: आज्ञाओं के साथ שׁמר का अर्थ मानना या पालन करना है; आधुनिक हिन्दी में ‘पालन करना’ सर्वाधिक स्वाभाविक है।
- source_word: מִצְוֺתָיו
  choice: उसकी आज्ञाओं
  rationale: מִצְוָה आदेश के रूप में दिए गए दायित्व को सूचित करता है; ‘आज्ञा’ सटीक और परिचित धार्मिक-कानूनी शब्द है।
- source_word: וְחֻקָּיו
  choice: विधियों
  rationale: חֹק/חֻקָּה निर्धारित विधान को दर्शाता है; ‘विधि’ कानूनी भेद को संक्षेप में बनाए रखती है।
- source_word: וּמִשְׁפָּטָיו
  choice: न्याय-विधानों
  rationale: מִשְׁפָּט न्यायिक निर्णय, नियम या अध्यादेश को व्यक्त कर सकता है। ‘न्याय-विधान’ न्यायिक अर्थ बनाए रखता और ‘विधियों’ से इसका भेद दिखाता है।
- source_word: אֲשֶׁר צִוָּה
  choice: जिन्हें उसने ... दिया था
  rationale: हिन्दी में आज्ञाओं और विधानों के लिए ‘देना’ स्वाभाविक है और परमेश्वर द्वारा अधिकृत रूप से आदेश दिए जाने का आशय सुरक्षित रखता है।
- source_word: אֶת אֲבֹתֵינוּ
  choice: हमारे पूर्वजों
  rationale: אָבוֹתֵינוּ का शाब्दिक रूप ‘हमारे पितर’ है, पर सन्दर्भ में यह इस्राएल की पिछली पीढ़ियों को सूचित करता है। ‘पूर्वज’ आधुनिक हिन्दी में स्वाभाविक और अर्थ-सटीक है; शाब्दिक रूप पाद-टिप्पणी में दिया गया है।
theological_decisions:
- issue: वाचा-संबंधी व्यवस्था के तीन पदों का अनुवाद
  choice: आज्ञाओं, विधियों और न्याय-विधानों
  alternative: आदेशों, विधानों और नियमों
  rationale: मूल इब्रानी तीन अलग कानूनी शब्दों का प्रयोग करता है। चुना हुआ रूप उनके पारस्परिक भेद और वाचा-संबंधी कानूनी स्वर को यथासंभव बनाए रखता है।
- issue: मन को परमेश्वर की ओर फेरने में परमेश्वर की भूमिका
  choice: वह हमारे मनों को अपनी ओर फेरे
  alternative: हमारा मन उसकी ओर लगा रहे
  rationale: मूल पाठ स्पष्ट रूप से परमेश्वर को मन मोड़ने वाला कर्ता बताता है। इसे मानवीय आत्म-प्रेरणा में बदलना पाठ की धार्मिक धार को कम कर देता।
- issue: पूर्वजों के लिए लिंग-सूचक पारिवारिक पद
  choice: हमारे पूर्वजों
  alternative: हमारे पितरों
  rationale: इब्रानी शब्द व्याकरणतः पुल्लिंग है और शाब्दिक अर्थ ‘पिता/पितर’ है, किंतु यहाँ वह इस्राएल की पूर्ववर्ती पीढ़ियों के सामूहिक सन्दर्भ में है। मुख्य पाठ में सहज हिन्दी रखी गई है और शाब्दिक रूप पाद-टिप्पणी में सुरक्षित है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सार्वजनिक पाठ के योग्य रखी गई है। ‘मन’, ‘मार्गों पर चलना’ और कानूनी त्रय जैसे बाइबिलीय रूपकों को स्पष्ट हिन्दी में सुरक्षित रखा गया है।
