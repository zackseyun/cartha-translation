source:
  edition: WLC
  text: וַֽ/יַּעֲל֞וּ אֶת אֲר֤וֹן יְהוָה֙ וְ/אֶת אֹ֣הֶל מוֹעֵ֔ד וְ/אֶֽת כָּל כְּלֵ֥י הַ/קֹּ֖דֶשׁ אֲשֶׁ֣ר בָּ/אֹ֑הֶל וַ/יַּעֲל֣וּ אֹתָ֔/ם הַ/כֹּהֲנִ֖ים וְ/הַ/לְוִיִּֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/004.yaml
  text: They brought up the ark of Yahweh[a], the tent of meeting, and all the holy vessels that were in the tent[b]; the priests and the Levites brought them up.
translation:
  language: hi
  text: वे यहोवा[a] का सन्दूक, मिलापवाला तम्बू और सभी पवित्र वस्तुएँ जो तम्बू में थीं, ऊपर ले आए; याजक और लेवी उन्हें ऊपर ले आए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘यहोवा’ उस इब्रानी ईश्वरीय नाम का हिन्दी रूप है जिसे चार अक्षरों יהוה (YHWH) से लिखा जाता है।
    reason: divine_name
lexical_decisions:
- source_word: וַיַּעֲלוּ
  choice: ऊपर ले आए
  rationale: हिफ़िल रूप का अर्थ ‘ऊपर लाना/ले जाना’ है। मन्दिर की ओर होने वाली यात्रा की दिशात्मकता बचाते हुए यह हिन्दी में स्वाभाविक है; इससे उठाकर ले जाने की रीति अनावश्यक रूप से निश्चित नहीं होती।
- source_word: אֲרוֹן יְהוָה
  choice: यहोवा का सन्दूक
  rationale: אֲרוֹן यहाँ वाचा के पवित्र सन्दूक को सूचित करता है, और יְהוָה को उसके व्यक्तिगत नाम ‘यहोवा’ से प्रस्तुत किया गया है।
- source_word: אֹהֶל מוֹעֵד
  choice: मिलापवाला तम्बू
  rationale: यह इस्राएल के पवित्र मिलन-तम्बू का प्रचलित और अर्थपूर्ण हिन्दी नाम है तथा केवल सामान्य तम्बू का भाव नहीं देता।
- source_word: כָּל כְּלֵי הַקֹּדֶשׁ
  choice: सभी पवित्र वस्तुएँ
  rationale: כְּלֵי व्यापक शब्द है, जिसमें पात्र, उपकरण और अन्य सामान सम्मिलित हो सकते हैं। ‘वस्तुएँ’ इस व्यापकता को ‘पात्र’ की अपेक्षा बेहतर बनाए रखता है।
- source_word: אֲשֶׁר בָּאֹהֶל
  choice: तम्बू में रखी
  rationale: सम्बन्धवाचक उपवाक्य पवित्र वस्तुओं को विशेषित करता है। ‘रखी’ हिन्दी में स्वाभाविक है और उनके तम्बू में होने का अर्थ स्पष्ट करता है।
- source_word: וַיַּעֲלוּ אֹתָם
  choice: उन्हें ऊपर ले आए
  rationale: मूल पाठ में क्रिया की पुनरावृत्ति है; उसे हिन्दी में भी रखा गया है ताकि वाक्य की संरचना और बल सुरक्षित रहें।
- source_word: הַכֹּהֲנִים וְהַלְוִיִּם
  choice: याजक और लेवी
  rationale: इब्रानी पाठ दोनों समूहों को स्पष्ट रूप से नाम देता है। अनुवाद उन्हें ‘लेवीय याजक’ जैसे एक ही पद में नहीं मिलाता।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: प्रभु
  rationale: मूल पाठ में उपाधि नहीं, चतुरक्षरीय व्यक्तिगत नाम है। ‘यहोवा’ हिन्दी बाइबलीय परम्परा में पहचाना जाने वाला नामरूप है और नाम को उपाधि से प्रतिस्थापित नहीं करता।
- issue: परिवहन के कार्य में याजकों और लेवियों का सम्बन्ध
  choice: दोनों समूहों को स्पष्ट रूप से अलग-अलग नामित रखना
  alternative: लेवीय याजक
  rationale: הַכֹּהֲנִים וְהַלְוִיִּם का सीधा रूप ‘याजक और लेवी’ है। अन्य पाठों के साथ सामंजस्य बैठाने के लिए इसे एक समूह में समेटना मूल की सम्भावित व्याख्यात्मक और धार्मिक तनातनी को मिटा देगा।
- issue: वस्तुओं को ले जाने की विधि
  choice: ऊपर ले आए
  alternative: उठाकर ऊपर ले आए
  rationale: עלה का हिफ़िल रूप दिशात्मक गति बताता है, पर अपने आप यह निश्चित नहीं करता कि हर वस्तु किस तरह ढोई गई। मुख्य पाठ इस अस्पष्टता को बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और सार्वजनिक पाठ के योग्य शैली रखी गई है। ‘सन्दूक’, ‘मिलापवाला तम्बू’, ‘याजक’ और ‘लेवी’ जैसे परिचित बाइबलीय पद बनाए गए हैं। क्रिया की इब्रानी पुनरावृत्ति भी सुरक्षित रखी गई है।
