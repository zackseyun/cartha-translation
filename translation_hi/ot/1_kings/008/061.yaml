base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/061.yaml
  text: Let your heart therefore be wholly with Yahweh our God[a], to walk in his statutes and to keep his commandments[b], as at this day.
translation:
  language: hi
  text: इसलिए तुम्हारा हृदय याहवे, हमारे परमेश्वर, के प्रति पूरी तरह एकनिष्ठ रहे[a], कि तुम उसकी विधियों के अनुसार चलो और उसकी आज्ञाओं का पालन करो, जैसा आज के दिन करते हो[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “अविभाजित रहे”; शाब्दिक रूप से भाव है, “तुम्हारा हृदय हमारे परमेश्वर याहवे के साथ पूर्ण रहे।”
    reason: lexical_alternative
  - marker: b
    text: इब्रानी मुहावरा शाब्दिक रूप से “जैसा इस दिन” है; वर्तमान दिन ऐसी निष्ठा के उदाहरण या साक्षी के रूप में सामने रखा गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: रहे
  rationale: सन्दर्भ में यह साधारण भविष्यवाणी नहीं, बल्कि उपदेशात्मक कामना है; हिन्दी में “रहे” इस भाव को स्वाभाविक रूप से व्यक्त करता है।
- source_word: לְבַבְכֶם
  choice: तुम्हारा हृदय
  rationale: לֵבָב मनुष्य के भीतरी व्यक्तित्व, इच्छा और निष्ठा को दर्शाता है। एकवचन “हृदय” इब्रानी के सामूहिक प्रयोग को बनाए रखता है।
- source_word: שָׁלֵם
  choice: पूरी तरह एकनिष्ठ
  rationale: यहाँ शब्द का आशय वाचा के सम्बन्ध में पूर्ण और अविभाजित निष्ठा है, न कि पापरहित सिद्धता। इस हिन्दी अभिव्यक्ति से पूर्ण समर्पण का भाव स्पष्ट और स्वाभाविक रहता है।
- source_word: עִם יְהוָה אֱלֹהֵינוּ
  choice: हमारे परमेश्वर याहवे के प्रति
  rationale: शाब्दिक “के साथ” हिन्दी में इस वाक्य में अस्वाभाविक और अस्पष्ट होता; “के प्रति” सम्बन्धपरक वाचागत निष्ठा को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: दिव्य नाम יהוה को किसी उपाधि से बदलने के बजाय उसके प्रचलित लिप्यन्तरण के रूप में प्रस्तुत किया गया है।
- source_word: לָלֶכֶת בְּחֻקָּיו
  choice: उसकी विधियों पर चलो
  rationale: “चलना” जीवन-आचरण का इब्रानी रूपक बनाए रखता है; “विधियाँ” निर्धारित नियमों के अर्थ को व्यक्त करता है।
- source_word: וְלִשְׁמֹר מִצְוֺתָיו
  choice: और उसकी आज्ञाओं का पालन करो
  rationale: विधिक और वाचागत सन्दर्भ में שׁמר का अर्थ आज्ञाओं को मानना या उनका पालन करना है।
- source_word: כַּיּוֹם הַזֶּה
  choice: जैसा आज के दिन कर रहे हो
  rationale: इब्रानी मुहावरा वर्तमान दिन को ऐसी निष्ठा के उदाहरण या साक्षी के रूप में प्रस्तुत करता है। हिन्दी में निहित क्रिया को दोहराने से अर्थ स्वाभाविक बनता है।
theological_decisions:
- issue: दिव्य नाम יהוה का अनुवाद
  choice: याहवे
  alternative: प्रभु; यहोवा
  rationale: मूल पाठ में व्यक्तिगत वाचा-नाम है; “याहवे” उसे उपाधि से प्रतिस्थापित किए बिना सुरक्षित रखता है।
- issue: שָׁלֵם में पूर्णता का आशय
  choice: पूरी तरह एकनिष्ठ
  alternative: पूर्ण; अखण्ड; निष्कपट
  rationale: यह चुनाव सम्पूर्ण और अविभाजित वाचागत निष्ठा बताता है, पर इसे पापरहित सिद्धता के बाद के धर्मवैज्ञानिक अर्थ में नहीं बदलता।
