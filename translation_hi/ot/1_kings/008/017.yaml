base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/017.yaml
  text: It was in the heart of David my father to build a house for the name of Yahweh[a], the God of Israel.
translation:
  language: hi
  text: मेरे पिता दाऊद के मन में यह था कि वह याहवे[a], इस्राएल के परमेश्वर, के नाम के लिए एक भवन बनाए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘याहवे’ को ‘यहोवा’ भी लिखा जाता है। यहाँ भवन से आशय मंदिर है; इब्रानी में शाब्दिक अर्थ ‘घर’ है।
    reason: divine_name_and_lexical_alternative
lexical_decisions:
- source_word: וַיְהִי עִם לְבַב
  choice: के मन में यह था
  rationale: यह इब्रानी मुहावरा किसी के मन में उपस्थित इच्छा या संकल्प को व्यक्त करता है। यह अनुवाद हृदय/मन की मूल छवि को बनाए रखते हुए स्वाभाविक हिन्दी देता है।
- source_word: דָּוִד אָבִי
  choice: मेरे पिता दाऊद
  rationale: हिन्दी में यह शब्दक्रम स्वाभाविक है और वक्ता के साथ दाऊद का संबंध स्पष्ट करता है।
- source_word: לִבְנוֹת בַּיִת
  choice: एक भवन बनाए
  rationale: בַּיִת का मूल अर्थ घर/भवन है। यहाँ संदर्भ मंदिर का है, पर 'भवन' मूल रूपक को बनाए रखता है और हिन्दी में उपासना-स्थल के लिए भी उपयुक्त है।
- source_word: לְשֵׁם
  choice: के नाम के लिए
  rationale: मूल पाठ की समर्पण-संबंधी अभिव्यक्ति को बिना 'सम्मान' या 'कीर्ति' जैसा व्याख्यात्मक अर्थ जोड़े सुरक्षित रखता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिन्दी बाइबलीय प्रयोग में परमेश्वर के व्यक्तिगत वाचा-नाम की प्रचलित लिप्यंतरण-परंपरा को अपनाता है; इसे केवल उपाधि 'प्रभु' से नहीं बदलता।
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: इस्राएल के परमेश्वर
  rationale: सम्बन्धवाचक इब्रानी पदबंध का स्पष्ट और स्वाभाविक हिन्दी रूप।
theological_decisions:
- issue: יהוה परमेश्वर के नाम का अनुवाद
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: मूल पाठ में चार-अक्षरी व्यक्तिगत नाम सीधे प्रयुक्त है। हिन्दी पाठकों के लिए प्रचलित 'यहोवा' उस नाम को शीर्षक से बदलने के बजाय व्यक्तिगत नाम के रूप में सुरक्षित रखता है; पादटिप्पणी वैकल्पिक लिप्यंतरण बताती है।
- issue: בַּיִת को भवन या मंदिर कहना
  choice: भवन
  alternative: मंदिर
  rationale: इब्रानी में शाब्दिक रूप से 'घर/भवन' है। संदर्भ मंदिर का है, किंतु मुख्य पाठ में मूल घर-रूपक बचाया गया है और पादटिप्पणी में स्पष्ट संदर्भ दिया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध। 'मन में यह था' मूल मुहावरे की छवि बनाए रखता है, और 'भवन' मंदिर की ओर संकेत करते हुए भी इब्रानी के शाब्दिक घर-रूपक को सुरक्षित रखता है।
