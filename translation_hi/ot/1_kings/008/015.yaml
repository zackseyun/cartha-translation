  edition: WLC
  text: וַ/יֹּ֗אמֶר בָּר֤וּךְ יְהוָה֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל אֲשֶׁר֙ דִּבֶּ֣ר בְּ/פִ֔י/ו אֵ֖ת דָּוִ֣ד אָבִ֑/י וּ/בְ/יָד֥/וֹ מִלֵּ֖א לֵ/אמֹֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/015.yaml
  text: And he said[a], “Blessed be Yahweh, the God of Israel, who spoke with his mouth to David my father and has fulfilled it with his hand, saying,”
translation:
  language: hi
  text: और उसने कहा, “इस्राएल के परमेश्वर याहवे धन्य हों, जिन्होंने मेरे पिता दाऊद से अपने मुँह से कहा और अपने हाथ से उसे पूरा किया है, यह कहते हुए:”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בָּרוּךְ
  choice: धन्य हैं
  rationale: इब्रानी का कर्मवाच्य कृदन्त यहाँ आशीर्वाद/स्तुति के पारंपरिक सूत्र में है। ‘धन्य हैं’ उसके औपचारिक रूप को बनाए रखता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: चतुरक्षरीय व्यक्तिगत नाम को हिन्दी में प्रचलित लिप्यंतरण ‘यहोवा’ से व्यक्त किया गया है, किसी उपाधि से प्रतिस्थापित नहीं किया गया।
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: इस्राएल के परमेश्वर
  rationale: यह समास इस्राएल के साथ परमेश्वर के संबंध को सीधे व्यक्त करता है।
- source_word: אֲשֶׁר דִּבֶּר בְּפִיו
  choice: जिन्होंने अपने मुँह से ... बात की
  rationale: ‘अपने मुँह से’ को बनाए रखने से अगले वाक्यांश ‘अपने हाथ से’ के साथ मूल का वाणी और कार्य वाला समानांतर सुरक्षित रहता है।
- source_word: אֵת דָּוִד אָבִי
  choice: मेरे पिता दाऊद से
  rationale: דבר के साथ אֵת संबोधित व्यक्ति को सूचित कर सकता है; हिन्दी में ‘दाऊद से बात की’ स्वाभाविक है और मूल की संभावित ‘साथ’ की छाया को भी बनाए रखता है।
- source_word: וּבְיָדוֹ מִלֵּא
  choice: और अपने हाथ से उसे पूरा किया
  rationale: समझे हुए कर्म को ‘उसे’ से स्पष्ट किया गया है और हाथ का बिंब बनाए रखा गया है, ताकि कही हुई बात और किए हुए कार्य का संबंध प्रकट हो।
- source_word: לֵאמֹר
  choice: उन्होंने कहा था
  rationale: यह अगले पद में आने वाले प्रत्यक्ष कथन का परिचय देता है; हिन्दी में ‘उन्होंने कहा था’ इस प्रवाह को स्वाभाविक रूप से व्यक्त करता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल में व्यक्तिगत ईश्वरीय नाम है। हिन्दी पाठकों में सुविख्यात ‘यहोवा’ को नाम के रूप में रखा गया है, ‘प्रभु’ जैसी उपाधि से बदला नहीं गया।
- issue: בָּרוּךְ के स्तुतिपरक सूत्र का अर्थ
  choice: धन्य हैं
  alternative: स्तुति हो
  rationale: ‘धन्य हैं’ मूल सूत्र की व्याकरणिक और पारंपरिक आकृति को अधिक निकटता से सुरक्षित रखता है; ‘स्तुति हो’ उसका अर्थ खोलता, पर कुछ हद तक व्याख्यात्मक होता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण और सहज शैली अपनाई गई है। ‘अपने मुँह से’ और ‘अपने हाथ से’ जैसे इब्रानी शारीरिक बिंब जानबूझकर सुरक्षित रखे गए हैं। ईश्वर के लिए आदरसूचक बहुवचन क्रिया-रूप प्रयुक्त हुए हैं।
