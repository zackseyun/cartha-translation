  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/אַתָּה֙ תִּשְׁמַ֣ע הַ/שָּׁמַ֔יִם וְ/סָ֣לַחְתָּ֔ לְ/חַטַּ֖את עַמְּ/ךָ֣ יִשְׂרָאֵ֑ל וַ/הֲשֵֽׁבֹתָ/ם֙ אֶל הָ֣/אֲדָמָ֔ה אֲשֶׁ֥ר נָתַ֖תָּ לַ/אֲבוֹתָֽ/ם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/034.yaml
  text: then may you hear in heaven and forgive the sin of your people Israel[c][b][a], and bring them back to the land that you gave to their fathers.
translation:
  language: hi
  text: तब तू स्वर्ग में सुनना[a] और अपनी प्रजा इस्राएल का पाप क्षमा करना; और उन्हें उस भूमि में लौटा लाना[b] जो तूने उनके पुरखाओं[c] को दी थी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “स्वर्ग से सुनना।”
    reason: lexical_alternative
  - marker: b
    text: या, “उन्हें उस भूमि में फिर से स्थापित करना।”
    reason: lexical_alternative
  - marker: c
    text: शाब्दिक रूप से “उनके पिताओं”; अर्थात वे पुरखे जिन्हें परमेश्वर ने यह भूमि दी थी।
    reason: cultural_note
lexical_decisions:
- source_word: תִּשְׁמַע הַשָּׁמַיִם
  choice: स्वर्ग में सुनना
  rationale: इब्रानी में ‘सुनना’ और ‘स्वर्ग’ बिना किसी पूर्वसर्ग के साथ आते हैं। प्रसंग में स्वर्ग परमेश्वर का निवास-स्थान है; ‘स्वर्ग में सुनना’ इस संरचना और प्रार्थना के भाव दोनों को बनाए रखता है।
- source_word: וְסָלַחְתָּ לְחַטַּאת
  choice: और ... का पाप क्षमा करना
  rationale: סלח ईश्वरीय क्षमा को और חטאת यहाँ पाप या अपराध को दर्शाता है, पापबलि को नहीं। एकवचन ‘पाप’ इस्राएल के सामूहिक अपराध के लिए स्वाभाविक है।
- source_word: עַמְּךָ יִשְׂרָאֵל
  choice: अपनी प्रजा इस्राएल
  rationale: यह पदबंध इस्राएल को परमेश्वर की प्रजा के रूप में पहचानता है। ‘अपनी’ हिंदी में कर्ता ‘तू’ की ओर स्पष्ट और स्वाभाविक रूप से संकेत करता है।
- source_word: וַהֲשֵׁבֹתָם
  choice: उन्हें ... लौटा लाना
  rationale: שׁוב का हिफ़ील रूप किसी को वापस ले आने का कारणात्मक अर्थ देता है। यह निर्वासन या विस्थापन के बाद भूमि में वास्तविक वापसी को स्पष्ट करता है।
- source_word: אֶל הָאֲדָמָה
  choice: उस भूमि में
  rationale: אֲדָמָה का मूल अर्थ भूमि, धरती या मिट्टी हो सकता है; यहाँ प्रतिज्ञात क्षेत्र के प्रसंग में ‘भूमि’ उपयुक्त है। गंतव्य के लिए हिंदी में ‘भूमि में’ स्वाभाविक है।
- source_word: אֲשֶׁר נָתַתָּ לַאֲבוֹתָם
  choice: जो तूने उनके पुरखाओं को दी थी
  rationale: संबंधवाचक उपवाक्य उस भूमि की पैतृक प्रतिज्ञा को स्मरण कराता है। ‘पुरखाओं’ पुरुषवाची और वाचा-संबंधी संदर्भ को रखते हुए आधुनिक हिंदी में ‘पिताओं’ से अधिक स्वाभाविक है।
theological_decisions:
- issue: לַאֲבוֹתָם को वाचा और भूमि की प्रतिज्ञा के संदर्भ में व्यक्त करना
  choice: उनके पुरखाओं
  alternative: उनके पूर्वजों
  rationale: इब्रानी पद पुरुषवाची है और यहाँ उन पुरखाओं की ओर संकेत करता है जिन्हें भूमि दी गई थी। ‘पुरखाओं’ इस विशिष्टता को बनाए रखता है, जबकि ‘पूर्वजों’ संभव है पर लिंग-संबंधी संकेत को कम स्पष्ट करता है।
- issue: וַהֲשֵׁבֹתָם में पुनर्स्थापना का स्वरूप
  choice: उन्हें उस भूमि में लौटा लाना
  alternative: उन्हें उस भूमि में फिर से स्थापित करना
  rationale: पद ठोस भौगोलिक वापसी की बात करता है, केवल सामान्य या आत्मिक पुनर्स्थापना की नहीं। चुना हुआ रूप कारणात्मक और स्थानिक दोनों अर्थों को स्पष्ट रखता है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण प्रार्थना-शैली रखी गई है। परमेश्वर के लिए एकवचन आत्मीय संबोधन ‘तू’ और विनतीसूचक ‘सुनना/क्षमा करना/लौटा लाना’ हिंदी बाइबलीय प्रार्थना में स्वाभाविक हैं। अर्धविराम क्षमा और भूमि में वापसी के जुड़े हुए, फिर भी अलग कार्यों को स्पष्ट करता है।
