reference: 1 Kings 8:48
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/שָׁ֣בוּ אֵלֶ֗י/ךָ בְּ/כָל לְבָבָ/ם֙ וּ/בְ/כָל נַפְשָׁ֔/ם בְּ/אֶ֥רֶץ אֹיְבֵי/הֶ֖ם אֲשֶׁר שָׁב֣וּ אֹתָ֑/ם וְ/הִֽתְפַּֽלְל֣וּ אֵלֶ֗י/ךָ דֶּ֤רֶךְ אַרְצָ/ם֙ אֲשֶׁ֣ר נָתַ֣תָּה לַ/אֲבוֹתָ֔/ם הָ/עִיר֙ אֲשֶׁ֣ר בָּחַ֔רְתָּ וְ/הַ/בַּ֖יִת אֲשֶׁר בנית לִ/שְׁמֶֽ/ךָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/048.yaml
  text: and they return to you with all their heart and with all their soul in the land of their enemies who took them captive[a], and pray to you toward their land that you gave to their fathers, the city that you chose, and the house that I have built for your name[c][b],
translation:
  language: hi
  text: और यदि वे अपने उन शत्रुओं के देश में, जिन्होंने उन्हें बंदी बना लिया है, अपने पूरे मन और अपने पूरे प्राण से तेरी ओर लौटें[a], और अपने उस देश की ओर मुँह करके[b], जिसे तूने उनके पुरखाओं को दिया था, उस नगर की ओर जिसे तूने चुना है, और उस भवन की ओर जिसे मैंने तेरे नाम के लिए बनाया है[c], तुझसे प्रार्थना करें,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “तेरी ओर फिरें”; इस संदर्भ में इन शब्दों में पश्चाताप का भाव भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: 'शाब्दिक भाव: “अपने देश की दिशा में।” इब्रानी पदबंध वहाँ की ओर मुँह करके प्रार्थना करने को दर्शाता है।'
    reason: lexical_alternative
  - marker: c
    text: अर्थात वह भवन—मन्दिर—जो तेरे नाम को समर्पित है।
    reason: cultural_note
lexical_decisions:
- source_word: וְשָׁבוּ אֵלֶיךָ
  choice: तेरी ओर लौटें
  rationale: שׁוּב का मूल दिशात्मक अर्थ ‘लौटना/फिरना’ है। वाचा के इस संदर्भ में पश्चाताप निहित है, पर मुख्य पाठ में उसे स्पष्ट करके अर्थ को सीमित नहीं किया गया।
- source_word: בְּכָל לְבָבָם וּבְכָל נַפְשָׁם
  choice: अपने पूरे मन और अपने पूरे प्राण से
  rationale: यह समग्र निष्ठा का इब्रानी पदबंध है। ‘मन’ और ‘प्राण’ स्रोत की दोहरी छवि और अंतरपाठीय प्रतिध्वनि बनाए रखते हैं।
- source_word: בְּאֶרֶץ אֹיְבֵיהֶם
  choice: अपने उन शत्रुओं के देश में
  rationale: ‘देश’ निर्वासन के स्थान और आगे उल्लिखित उनके अपने देश के बीच का विरोध स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: אֲשֶׁר שָׁבוּ אֹתָם
  choice: जिन्होंने उन्हें बंदी बना लिया है
  rationale: שׁבה का अर्थ बलपूर्वक बंदी बनाना है; यह हिन्दी प्रयोग स्पष्ट और स्वाभाविक है।
- source_word: וְהִתְפַּלְלוּ אֵלֶיךָ
  choice: तुझसे प्रार्थना करें
  rationale: אֵלֶיךָ के लक्ष्यभाव को स्वाभाविक हिन्दी में ‘तुझसे’ द्वारा व्यक्त किया गया है।
- source_word: דֶּרֶךְ אַרְצָם
  choice: अपने उस देश की ओर मुँह करके
  rationale: דֶּרֶךְ यहाँ प्रार्थना की भौतिक दिशा बताता है। हिन्दी में ‘की ओर मुँह करके’ इस आशय को अस्पष्टता के बिना स्वाभाविक रूप से व्यक्त करता है।
- source_word: אֲשֶׁר נָתַתָּה לַאֲבוֹתָם
  choice: जिसे तूने उनके पुरखाओं को दिया था
  rationale: ‘पुरखाओं’ से वाचा-संबंधी पूर्वजों का संकेत बना रहता है और आधुनिक हिन्दी में सहजता आती है।
- source_word: הָעִיר אֲשֶׁר בָּחַרְתָּ
  choice: उस नगर की ओर जिसे तूने चुना है
  rationale: निर्दिष्ट नगर और परमेश्वर के चुनाव की भाषा दोनों सुरक्षित हैं; समानांतर दिशा-संरचना हिन्दी वाक्य को स्पष्ट करती है।
- source_word: וְהַבַּיִת אֲשֶׁר בנית לִשְׁמֶךָ
  choice: उस भवन की ओर जिसे मैंने तेरे नाम के लिए बनाया है
  rationale: व्यंजन-पाठ और सुलैमान के वक्तृत्व-संदर्भ के अनुसार प्रथम पुरुष एकवचन ‘मैंने’ रखा गया है। בַּיִת के लिए ‘भवन’ स्रोत की छवि को ‘मन्दिर’ बनाकर अधिक स्पष्ट किए बिना प्रतिष्ठित हिन्दी देता है।
theological_decisions:
- issue: שׁוּב में वाचा-संबंधी पश्चाताप
  choice: तेरी ओर लौटें
  alternative: तेरे सामने पश्चाताप करें
  rationale: इब्रानी में पश्चाताप का आशय हो सकता है, किंतु उसकी संबंधपरक और दिशात्मक भाषा को बनाए रखना अधिक स्रोत-संगत है।
- issue: בנित में भवन बनाने वाले का पुरुष
  choice: जिसे मैंने ... बनाया है
  alternative: जिसे बनाया गया है / जिसे उन्होंने बनाया है
  rationale: मसोरेटिक व्यंजन-पाठ और सुलैमान के भाषण का संदर्भ प्रथम पुरुष एकवचन का समर्थन करते हैं; इसे तटस्थ बनाना सार्थक पाठगत विवरण को मिटा देता।
- issue: ‘तेरे नाम के लिए’ का धार्मिक मुहावरा
  choice: तेरे नाम के लिए
  alternative: तुझे समर्पित
  rationale: लक्ष्य-पाठ स्रोत के ‘नाम’ संबंधी धार्मिक मुहावरे को सुरक्षित रखता है; अर्थ-स्पष्टीकरण पादटिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण प्रार्थना-शैली रखी गई है। परमेश्वर के लिए एकवचन आत्मीय-सम्मानसूचक ‘तू/तेरा’ प्रयोग किया गया है, जो बाइबिलीय प्रार्थना की प्रत्यक्षता बनाए रखता है। पद बड़े शर्तवाचक वाक्य का अंश है, इसलिए आरम्भ में ‘और यदि’ तथा अंत में अल्पविराम रखा गया है। सभी दिशात्मक पदों में ‘की ओर’ दोहराकर लक्ष्य-संबंध स्पष्ट किया गया है।
