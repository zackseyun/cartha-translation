  yaml_path: translation/ot/1_kings/008/013.yaml
  text: I have indeed built you an exalted house[b][a], a settled place for you to dwell forever.
translation:
  language: hi
  text: मैंने निश्चय ही तेरे लिए एक महिमामय भवन[a] बनाया है—तेरे सदा के निवास के लिए एक स्थिर स्थान[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘ऊँचा’ या ‘उदात्त निवास-भवन।’ इब्रानी शब्द זְבֻל ऊँचे या महिमामय निवास का बोध करा सकता है।
    reason: lexical_alternative
  - marker: b
    text: या, ‘तेरे निवास का एक स्थापित स्थान।’
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּנֹה בָנִיתִי
  choice: मैंने निश्चय ही ... बनाया है
  rationale: क्रिया से पहले आया infinitive absolute निर्माण के कथन पर बल देता है; ‘निश्चय ही’ इस बल को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: בֵּית זְבֻל
  choice: एक ऊँचा भवन
  rationale: בֵּית का मूल अर्थ ‘घर/भवन’ है और זְבֻל ऊँचे अथवा महिमामय निवास का बोध कराता है। ‘ऊँचा भवन’ मूल रूपक को बनाए रखते हुए हिन्दी में स्पष्ट है।
- source_word: לָךְ
  choice: तेरे लिए
  rationale: पूर्वसर्ग लाभ अथवा संबोधन की दिशा दर्शाता है; परमेश्वर से प्रत्यक्ष एकवचन संबोधन को बनाए रखा गया है।
- source_word: מָכוֹן
  choice: एक स्थिर स्थान
  rationale: यह शब्द स्थापित, दृढ़ या निश्चित स्थान का बोध देता है; ‘स्थिर स्थान’ उसकी टिकाऊ प्रकृति को व्यक्त करता है।
- source_word: לְשִׁבְתְּךָ
  choice: तेरे ... निवास करने के लिए
  rationale: ישׁב का अर्थ बैठना या निवास करना हो सकता है। मन्दिर और भवन के प्रसंग में ‘निवास करना’ सर्वाधिक स्वाभाविक है, जबकि सिंहासनारूढ़ होने की सम्भावित छाया को पाठ में अनावश्यक रूप से निश्चित नहीं किया गया।
- source_word: עוֹלָמִים
  choice: सदा
  rationale: बहुवचन रूप दीर्घ और निरन्तर अवधि पर बल देता है; ‘सदा’ आधुनिक हिन्दी में संक्षेप और स्वाभाविक ढंग से इसे व्यक्त करता है।
theological_decisions:
- issue: क्या मन्दिर को परमेश्वर का वास्तविक स्थायी निवास कहने वाली भाषा को व्याख्यात्मक रूप से सीमित किया जाए
  choice: निवास की मूल भाषा को बिना योग्यता जोड़े बनाए रखना
  alternative: ‘तेरे नाम के निवास का स्थान’ या ‘जहाँ तेरी आराधना हो’ कहना
  rationale: इब्रानी पाठ स्वयं परमेश्वर के लिए भवन और उसके निवास के स्थिर स्थान की बात करता है। व्यापक धर्मवैज्ञानिक सन्दर्भ से कोई स्पष्टीकरण इस पद में जोड़ना मूल की तनावपूर्ण भाषा को कम कर देगा।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, काव्यात्मक किन्तु सुबोध शैली अपनाई गई है। परमेश्वर से प्रत्यक्ष संबोधन के कारण ‘तेरे’ रखा गया है। ‘भवन’ मन्दिर के लिए मूल ‘घर’ की छवि को सुरक्षित रखता है और ‘निश्चय ही’ इब्रानी बलाघात को स्वाभाविक रूप देता है।
