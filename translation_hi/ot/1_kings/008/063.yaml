  text: וַ/יִּזְבַּ֣ח שְׁלֹמֹ֗ה אֵ֣ת זֶ֣בַח הַ/שְּׁלָמִים֮ אֲשֶׁ֣ר זָבַ֣ח לַ/יהוָה֒ בָּקָ֗ר עֶשְׂרִ֤ים וּ/שְׁנַ֨יִם֙ אֶ֔לֶף וְ/צֹ֕אן מֵאָ֥ה וְ/עֶשְׂרִ֖ים אָ֑לֶף וַֽ/יַּחְנְכוּ֙ אֶת בֵּ֣ית יְהוָ֔ה הַ/מֶּ֖לֶךְ וְ/כָל בְּנֵ֥י יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/063.yaml
  text: 'And Solomon sacrificed the sacrifice of peace offerings that he sacrificed to Yahweh: twenty-two thousand cattle and one hundred twenty thousand sheep[b][a]. So the king and all the sons of Israel dedicated the house of Yahweh.'
translation:
  language: hi
  text: 'सुलैमान ने यहोवा के लिए मेलबलि[b] का बलिदान चढ़ाया: बाईस हज़ार गाय-बैल और एक लाख बीस हज़ार भेड़-बकरियाँ। इस प्रकार राजा और सभी इस्राएलियों[a] ने यहोवा के भवन का समर्पण किया।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “इस्राएल के सभी पुत्र।”
    reason: lexical_alternative
  - marker: b
    text: वैकल्पिक रूप से, “संगति-बलि” या “कुशल-बलि।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּזְבַּח / זֶבַח הַשְּׁלָמִים
  choice: मेलबलि चढ़ाई
  rationale: यह स्वाभाविक हिन्दी में बलिदान की क्रिया और שְׁלָמִים के स्थापित धार्मिक अर्थ दोनों व्यक्त करता है; मूल की पुनरुक्ति को हिन्दी में अनावश्यक रूप से जटिल नहीं बनाया गया।
- source_word: לַיהוָה / בֵּית יְהוָה
  choice: यहोवा के लिए / यहोवा का भवन
  rationale: व्यक्तिगत दिव्य नाम को लिप्यंतरित करके रखा गया है और בֵּית का औपचारिक अर्थ ‘भवन’ सुरक्षित है।
- source_word: בָּקָר
  choice: गाय-बैल
  rationale: यह सामूहिक गोवंश को सामान्य आधुनिक हिन्दी में स्पष्ट करता है और केवल बधिया बैलों तक अर्थ सीमित नहीं करता।
- source_word: צֹאן
  choice: भेड़-बकरियाँ
  rationale: צֹאן छोटे पालतू पशुओं, विशेषतः भेड़ और बकरियों, का सामूहिक पद है; यह ‘भेड़’ से अधिक स्रोत-सटीक है।
- source_word: וַיַּחְנְכוּ
  choice: समर्पण किया
  rationale: मंदिर को पवित्र उपयोग के लिए विधिवत अर्पित करने के प्रसंग में यह सहज और सटीक हिन्दी है।
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: सभी इस्राएलियों
  rationale: यह मुहावरेदार जातीय-सामुदायिक अभिव्यक्ति है; शाब्दिक रूप ‘इस्राएल के पुत्र’ पादटिप्पणी में सुरक्षित है।
theological_decisions:
- issue: दिव्य नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: हिन्दी बाइबलीय प्रयोग में ‘यहोवा’ व्यापक रूप से पहचाना जाता है और मूल में आए व्यक्तिगत वाचा-नाम को ‘प्रभु’ बनाकर नहीं छिपाता।
- issue: זֶבַח הַשְּׁלָמִים का अर्थ
  choice: मेलबलि
  alternative: संगति-बलि / कुशल-बलि
  rationale: ‘मेलबलि’ परंपरागत और बोधगम्य है, पर यह पद शांति, कुशलता और सहभागिता से जुड़े अर्थ रख सकता है; किसी एक व्याख्यात्मक पहलू को पाठ में बढ़ाकर नहीं रखा गया।
- issue: בְּנֵי יִשְׂרָאֵל का सामुदायिक संदर्भ
  choice: सभी इस्राएलियों
  alternative: इस्राएल के सभी पुत्रों
  rationale: यहाँ पद पूरे इस्राएली समुदाय के लिए प्रचलित जातीय संबोधन है; स्वाभाविक हिन्दी मुख्य पाठ में दी गई है और शाब्दिक रूप पादटिप्पणी में।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सार्वजनिक पाठ के योग्य हिन्दी। बड़े पशु-वर्ग के लिए ‘गाय-बैल’ और छोटे पशु-वर्ग के लिए ‘भेड़-बकरियाँ’ स्रोत की सामूहिक संज्ञाओं को स्पष्ट करते हैं। मुख्य पाठ में केवल वही [a] संकेत रखा गया है जिसकी पादटिप्पणी दी गई है।
