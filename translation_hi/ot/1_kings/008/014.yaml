  text: Then the king turned around and blessed all the assembly of Israel[b][a], while all the assembly of Israel was standing.
translation:
  language: hi
  text: तब राजा ने मुड़कर इस्राएल की सारी सभा[a] को आशीर्वाद दिया, जबकि इस्राएल की सारी सभा खड़ी थी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “इस्राएल की सारी मण्डली।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּסֵּב ... אֶת־פָּנָיו
  choice: मुड़कर
  rationale: इब्रानी मुहावरे का शाब्दिक अर्थ ‘अपना मुख फेरा’ है। प्रसंग में ‘मुड़कर’ शारीरिक गति को स्वाभाविक आधुनिक हिन्दी में स्पष्ट करता है।
- source_word: וַיְבָרֶךְ
  choice: आशीर्वाद दिया
  rationale: ברך का इस सार्वजनिक राजकीय प्रसंग में मानक और स्वाभाविक हिन्दी अनुवाद।
- source_word: כָּל־קְהַל יִשְׂרָאֵל
  choice: इस्राएल की सारी सभा
  rationale: קהל एकत्रित जनसमुदाय को सूचित करता है। ‘सभा’ आधुनिक हिन्दी में स्पष्ट है और सामूहिक रूप से इकट्ठे लोगों का भाव बनाए रखता है।
- source_word: וְכָל־קְהַל יִשְׂרָאֵל עֹמֵד
  choice: जबकि इस्राएल की सारी सभा खड़ी थी
  rationale: कर्ता सामूहिक एकवचन है और עֹמֵד कृदंत उस समय जारी शारीरिक मुद्रा को पृष्ठभूमि के रूप में प्रस्तुत करता है; ‘खड़ी थी’ इसे स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions: []
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सहज मानक हिन्दी। मूल में ‘इस्राएल की सारी सभा’ की पुनरावृत्ति को बनाए रखा गया है। ‘अपना मुख फेरकर’ की अपेक्षा ‘मुड़कर’ अधिक स्वाभाविक है, जबकि मूल इब्रानी क्रिया का आशय सुरक्षित रहता है।
