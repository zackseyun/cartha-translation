base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/021.yaml
  text: And there I have set a place for the ark[b][a], in which is the covenant of Yahweh that he made with our fathers when he brought them out of the land of Egypt.
translation:
  language: hi
  text: और वहाँ मैंने सन्दूक के लिए एक स्थान ठहराया है, जिसमें यहोवा की वह वाचा है जो उसने हमारे पिताओं[a] के साथ बाँधी[b], जब वह उन्हें मिस्र देश से निकाल लाया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “हमारे पूर्वजों।” इब्रानी में शाब्दिक रूप से, “हमारे पिताओं।”
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में शाब्दिक रूप से, “वाचा काटी।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאָשִׂם שָׁם מָקוֹם
  choice: और वहाँ मैंने ... एक स्थान ठहराया है
  rationale: שׂוּם का मूल भाव रखना/स्थापित करना है। हिंदी में ‘स्थान ठहराया’ पूर्ण की गई व्यवस्था और मूल क्रिया—दोनों को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: לָאָרוֹן
  choice: सन्दूक के लिए
  rationale: אָרוֹן इस प्रसंग में वाचा के पवित्र सन्दूक को दर्शाता है; निकटवर्ती वाक्य इसकी पहचान स्पष्ट करता है, इसलिए मुख्य पाठ में अतिरिक्त ‘वाचा का’ जोड़ना आवश्यक नहीं।
- source_word: אֲשֶׁר שָׁם בְּרִית יְהוָה
  choice: उसमें यहोवा की वह वाचा है
  rationale: शाब्दिक स्थानवाचक रचना ‘जिसमें वहाँ’ को स्वाभाविक हिंदी में ‘उसमें’ किया गया है। बְּרִית יְהוָה को संबंधसूचक ‘यहोवा की ... वाचा’ के रूप में रखा गया है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को हिंदी में प्रचलित प्रतिलेखन ‘यहोवा’ से व्यक्त किया गया है, किसी उपाधि से प्रतिस्थापित नहीं किया गया।
- source_word: כָּרַת
  choice: बाँधी
  rationale: ‘वाचा काटना’ इब्रानी मुहावरा है; वर्तमान हिंदी में ‘वाचा बाँधना’ उसका स्वाभाविक और अर्थसंगत रूप है। शाब्दिक छवि पादटिप्पणी में सुरक्षित है।
- source_word: עִם אֲבֹתֵינוּ
  choice: हमारे पूर्वजों के साथ
  rationale: אָבוֹת का मूल अर्थ ‘पिता’ है, पर इस निर्गमन-संबंधी सामूहिक संदर्भ में यह पिछली पीढ़ियों/पूर्वजों को सूचित करता है। हिंदी में ‘पूर्वज’ लिंग मिटाए बिना वंशगत अर्थ स्वाभाविक रूप से देता है; शाब्दिक रूप पादटिप्पणी में दिया गया है।
- source_word: בְּהוֹצִיאוֹ אֹתָם מֵאֶרֶץ מִצְרָיִם
  choice: उस समय, जब वह उन्हें मिस्र देश से निकाल लाया
  rationale: בְּ सहित infinitive construct का कालवाचक अर्थ ‘जब’ है। हिफ़िल रूप को ‘निकाल लाया’ से व्यक्त किया गया है और מֵאֶרֶץ को ‘देश से’ से सुरक्षित रखा गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: प्रभु / याहवे
  rationale: मूल पाठ व्यक्तिगत वाचा-नाम का प्रयोग करता है। हिंदी पाठ में उसका परिचित नामरूप ‘यहोवा’ रखने से नाम और उपाधि का अंतर बना रहता है।
- issue: אֲבֹתֵינוּ की लिंग और वंश-संबंधी अभिव्यक्ति
  choice: हमारे पूर्वजों
  alternative: हमारे पिताओं
  rationale: इस प्रसंग में यह शब्द निर्गमन की पिछली पीढ़ी को सामूहिक रूप से दर्शाता है। ‘पूर्वजों’ आधुनिक हिंदी में स्वाभाविक है, जबकि मूल का शाब्दिक पुरुषवाची रूप पादटिप्पणी में स्पष्ट किया गया है।
- issue: כָּרַת בְּרִית की वाचा-संबंधी अभिव्यक्ति
  choice: वाचा बाँधी
  alternative: वाचा काटी / वाचा की
  rationale: ‘बाँधना’ हिंदी में वाचा स्थापित करने का सम्मानपूर्ण और स्वाभाविक मुहावरा है। इब्रानी की शाब्दिक ‘काटना’ वाली छवि को मुख्य पाठ में अस्वाभाविक बनाए बिना पादटिप्पणी में रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘सन्दूक’, ‘वाचा’ और ‘यहोवा’ जैसे बाइबिलीय शब्द संदर्भ की धार्मिक विशिष्टता बनाए रखते हैं; वाक्य-विन्यास को हिंदी के स्वाभाविक प्रवाह के अनुसार दो वाक्यों में रखा गया है।
