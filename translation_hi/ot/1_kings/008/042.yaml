- source_word: וּבָא
  choice: और वह आकर
  rationale: इब्रानी में यहाँ कर्ता बहुवचन से एकवचन हो जाता है; ‘वह’ उस परिवर्तन को स्पष्ट रूप से सुरक्षित रखता है।
- source_word: וְהִתְפַּלֵּל
  choice: प्रार्थना करेगा
  rationale: यह पूर्ववर्ती एकवचन क्रिया के साथ समन्वित है और भविष्य/सामान्य भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: אֶל הַבַּיִת הַזֶּה
  choice: इस भवन की ओर मुँह करके
  rationale: मन्दिर-प्रार्थना के संदर्भ में אֶל दिशा को सूचित करता है; यह अनुवाद भवन के भीतर प्रवेश का अनावश्यक अर्थ दिए बिना प्रार्थना की दिशा स्पष्ट करता है।
theological_decisions:
- issue: परमेश्वर के सामर्थ्य के लिए मानवरूपी भाषा
  choice: ‘हाथ’ और ‘भुजा’ को मुख्य पाठ में बनाए रखा गया
  alternative: ‘सामर्थ्य’ या ‘शक्ति’ जैसे अमूर्त शब्द
