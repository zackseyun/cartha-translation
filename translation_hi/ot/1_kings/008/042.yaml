lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले पद में परदेशी के आने की व्याख्या या कारण प्रस्तुत करता है; इसलिए कारणसूचक अर्थ रखा गया है।
- source_word: יִשְׁמְעוּן
  choice: वे ... सुनेंगे
  rationale: बहुवचन अपूर्ण क्रिया परदेशियों को एक वर्ग के रूप में भविष्य या सामान्य अर्थ में प्रस्तुत करती है।
- source_word: אֶת שִׁמְךָ הַגָּדוֹל
  choice: आपके महान नाम के विषय में
  rationale: שמע के साथ संदर्भानुसार ‘के विषय में सुनना’ स्वाभाविक है; ‘नाम’ परमेश्वर की ख्याति और प्रकट पहचान का ठोस बिंब बनाए रखता है।
- source_word: יָדְךָ הַחֲזָקָה
  choice: आपके शक्तिशाली हाथ
  rationale: यह परमेश्वर के सामर्थ्य का ठोस बाइबलीय बिंब सुरक्षित रखता है; ‘शक्तिशाली’ आधुनिक हिन्दी में सहज है।
- source_word: זְרֹעֲךָ הַנְּטוּיָה
  choice: आपकी बढ़ाई हुई भुजा
