translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण और प्रार्थनात्मक रजिस्टर। ‘आप’ से परमेश्वर को आदरसूचक संबोधन दिया गया है। ‘भवन’ मंदिर-संदर्भ में गरिमापूर्ण रहते हुए सामान्य पाठक के लिए बोधगम्य है।
