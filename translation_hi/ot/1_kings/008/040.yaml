source:
  edition: WLC
  text: לְמַ֨עַן֙ יִֽרָא֔וּ/ךָ כָּל הַ֨/יָּמִ֔ים אֲשֶׁר הֵ֥ם חַיִּ֖ים עַל פְּנֵ֣י הָ/אֲדָמָ֑ה אֲשֶׁ֥ר נָתַ֖תָּה לַ/אֲבֹתֵֽי/נוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/040.yaml
  text: so that they may fear you all the days that they live on the face of the land that you gave to our fathers[a][b][c].
translation:
  language: hi
  text: ताकि वे जितने दिन उस भूमि पर जीवित रहें, जिसे तूने हमारे पुरखों को दिया था, उतने दिन तेरा भय मानते रहें।[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘इस पृथ्वी पर।’ इब्रानी शब्द का अर्थ व्यापक रूप से ‘पृथ्वी’ भी हो सकता है, पर यहाँ पुरखों को दी गई भूमि का संदर्भ है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से ‘हमारे पिताओं को’; अर्थात हमारे पुरखों को।
    reason: lexical_alternative
lexical_decisions:
- source_word: לְמַעַן
  choice: ताकि
  rationale: यह शब्द सुलैमान की प्रार्थना में उद्देश्य अथवा अपेक्षित परिणाम प्रकट करता है; आधुनिक हिन्दी में ‘ताकि’ स्वाभाविक और स्पष्ट है।
- source_word: יִרָאוּךָ
  choice: तेरा भय मानते रहें
  rationale: यहाँ ירא परमेश्वर के प्रति भय, श्रद्धा और भक्तिपूर्ण आदर का बोध कराता है। ‘भय मानना’ बाइबलीय धार्मिक अर्थ की गंभीरता बनाए रखता है और इसे केवल सामान्य सम्मान तक सीमित नहीं करता।
- source_word: כָּל הַיָּמִים אֲשֶׁר הֵם חַיִּים
  choice: जितने दिन ... जीवित रहें, उतने दिन
  rationale: यह स्वाभाविक हिन्दी में इब्रानी के पूर्ण कालावधि वाले भाव को व्यक्त करता है—अर्थात उनके जीवन भर—और वाक्य की अवधि-संबंधी संरचना को स्पष्ट रखता है।
- source_word: עַל פְּנֵי הָאֲדָמָה
  choice: उस भूमि पर
  rationale: शाब्दिक मुहावरा ‘भूमि के मुख पर’ है, पर हिन्दी में ‘भूमि पर’ स्वाभाविक है। अगले उपवाक्य में पूर्वजों को दी गई भूमि का उल्लेख होने से यहाँ ‘भूमि’ संदर्भानुकूल है।
- source_word: אֲשֶׁר נָתַתָּה
  choice: जिसे तूने ... दिया था
  rationale: यह पूर्व में पूर्ण हुए परमेश्वर के दान को सहज हिन्दी में व्यक्त करता है।
- source_word: לַאֲבֹתֵינוּ
  choice: हमारे पुरखों को
  rationale: ‘पुरखे’ आधुनिक हिन्दी में पैतृक पूर्वजों के लिए स्वाभाविक है और इब्रानी ‘हमारे पिताओं’ के वंशगत तथा वाचा-संबंधी भाव को बनाए रखता है।
theological_decisions:
- issue: परमेश्वर के संबंध में ירא का अनुवाद
  choice: तेरा भय मानते रहें
  alternative: तेरा आदर करते रहें / तेरे प्रति श्रद्धा रखते रहें
  rationale: ‘भय मानना’ परमेश्वर के भय की बाइबलीय धर्मवैचारिक श्रेणी को सुरक्षित रखता है; केवल ‘आदर’ या ‘श्रद्धा’ मूल शब्द की गंभीरता को नरम कर सकते हैं।
- issue: הָאֲדָמָה का भौगोलिक दायरा
  choice: उस भूमि
  alternative: पृथ्वी
  rationale: तुरंत बाद का उपवाक्य इसे उस भूमि के रूप में पहचानता है जिसे परमेश्वर ने इस्राएल के पुरखों को दिया था; इसलिए संदर्भ में ‘भूमि’ अधिक उपयुक्त है, यद्यपि शब्द व्यापक अर्थ में ‘पृथ्वी’ भी हो सकता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। परमेश्वर को एकवचन आत्मीय-सम्मानसूचक ‘तू’ से संबोधित किया गया है, जो हिन्दी बाइबल की प्रार्थना-परंपरा और इब्रानी एकवचन रूप के अनुरूप है। ‘जितने दिन... उतने दिन’ मूल की अवधि को स्वाभाविक हिन्दी में व्यक्त करता है।
