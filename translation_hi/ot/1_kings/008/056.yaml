  text: בָּר֣וּךְ יְהוָ֗ה אֲשֶׁ֨ר נָתַ֤ן מְנוּחָה֙ לְ/עַמּ֣/וֹ יִשְׂרָאֵ֔ל כְּ/כֹ֖ל אֲשֶׁ֣ר דִּבֵּ֑ר לֹֽא נָפַ֞ל דָּבָ֣ר אֶחָ֗ד מִ/כֹּל֙ דְּבָר֣/וֹ הַ/טּ֔וֹב אֲשֶׁ֣ר דִּבֶּ֔ר בְּ/יַ֖ד מֹשֶׁ֥ה עַבְדּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/056.yaml
  text: Blessed be Yahweh[a], who has given rest to his people Israel, according to all that he spoke. Not one word has failed of all his good words that he spoke by the hand of Moses his servant.
translation:
  language: hi
  text: याहवे धन्य हों, जिन्होंने अपनी प्रजा इस्राएल को वैसा ही विश्राम दिया है जैसा उन्होंने कहा था। उनके सभी भले वचनों[a] में से एक भी विफल नहीं हुआ, जिन्हें उन्होंने अपने सेवक मूसा के द्वारा कहा था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '‘वचनों’ का अर्थ यहाँ कही हुई प्रतिज्ञाएँ भी हो सकता है; इसलिए इसे इस प्रकार भी समझा जा सकता है: “उनकी भली प्रतिज्ञाओं में से एक भी अपूर्ण नहीं रही।”'
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּרוּךְ
  choice: धन्य हैं
  rationale: यह विधेयात्मक विशेषण स्तुति और आशीर्वाद की उद्घोषणा है। आधुनिक हिन्दी में ‘धन्य हैं’ गरिमापूर्ण और स्वाभाविक है।
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत वाचा-नाम को उपाधि से बदलने के बजाय देवनागरी में लिप्यंतरित किया गया है।
- source_word: נָתַן מְנוּחָה
  choice: विश्राम दिया है
  rationale: यह शत्रुओं और अस्थिरता से प्राप्त स्थिर विश्राम को व्यक्त करता है, केवल आंतरिक शांति को नहीं।
- source_word: לְעַמּוֹ יִשְׂרָאֵל
  choice: अपनी प्रजा इस्राएल को
  rationale: यह वाचाई संबंध और ‘इस्राएल’ की समानाधिकरण भूमिका दोनों को स्वाभाविक हिन्दी में रखता है।
- source_word: כְּכֹל אֲשֶׁר דִּבֵּר
  choice: अपने कहे हुए सब वचनों के अनुसार
  rationale: मूल में ‘कहा’ है, प्रत्यक्षतः ‘प्रतिज्ञा की’ नहीं; हिन्दी में वचन-संबंध को स्पष्ट रखते हुए मूल अभिव्यक्ति संरक्षित है।
- source_word: לֹא נָפַל דָּבָר אֶחָד
  choice: एक भी विफल नहीं हुआ
  rationale: शाब्दिक ‘एक बात भी नहीं गिरी’ हिन्दी में भ्रामक होगा; मुहावरे का अर्थ है कि कोई वचन निष्फल या अपूर्ण नहीं रहा।
- source_word: מִכֹּל דְּבָרוֹ הַטּוֹב
  choice: उन सभी उत्तम वचनों में से
  rationale: एकवचन सामूहिक अर्थ रखता है; हिन्दी बहुवचन प्रसंग में अधिक स्वाभाविक है और पूर्ववर्ती ‘वचन’ से संबंध बनाए रखता है।
- source_word: בְּיַד מֹשֶׁה
  choice: मूसा के द्वारा
  rationale: हिब्रू का ‘हाथ के द्वारा’ अभिकरण-सूचक मुहावरा है; आधुनिक हिन्दी में ‘के द्वारा’ वही अर्थ स्पष्ट और गरिमापूर्ण ढंग से देता है।
- source_word: עַבְדּוֹ
  choice: अपने सेवक
  rationale: मूसा के लिए यह सम्मानसूचक और नियुक्त प्रतिनिधि का पद है; ‘सेवक’ प्रसंगानुकूल है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में व्यक्तिगत वाचा-नाम है। लिप्यंतरण नाम को सुरक्षित रखता है और उसे किसी उपाधि से प्रतिस्थापित नहीं करता।
- issue: דָּבָר / דְּבָרוֹ को ‘वचन’ या ‘प्रतिज्ञा’ कहना
  choice: वचन
  alternative: प्रतिज्ञा
  rationale: प्रसंग प्रतिज्ञाओं की पूर्ति का है, फिर भी हिब्रू बार-बार ‘वचन/बात’ कहता है। मुख्य पाठ में ‘वचन’ रखकर मूल की शब्दावली और निहित प्रतिज्ञात्मक अर्थ के बीच तनाव संरक्षित किया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी, देवनागरी; शैली गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज है। ‘धन्य हैं’ स्तुतिपरक उद्घोषणा रखता है, जबकि ‘मूसा के द्वारा’ कृत्रिम शाब्दिक मुहावरे से बचते हुए अभिकरण स्पष्ट करता है।
