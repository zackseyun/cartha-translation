base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/011.yaml
  text: and the priests were not able to stand to minister because of the cloud[b][a], for the glory of Yahweh filled the house of Yahweh.
translation:
  language: hi
  text: और बादल के कारण याजक सेवा करने के लिए खड़े नहीं हो सके, क्योंकि याहवे का तेज याहवे के भवन[a] में भर गया था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात मन्दिर।
    reason: lexical_alternative
lexical_decisions:
- source_word: יָכְלוּ
  choice: न रह सके
  rationale: निषेध के साथ यह योग्यता अथवा सामर्थ्य के अभाव को व्यक्त करता है; अगले पदबंध ‘खड़े’ के साथ ‘खड़े न रह सके’ स्वाभाविक हिन्दी है।
- source_word: הַכֹּהֲנִים
  choice: याजक
  rationale: मन्दिर में धार्मिक सेवा करने वाले पुरोहितों के लिए मानक और प्रसंगानुकूल हिन्दी शब्द।
- source_word: לַעֲמֹד לְשָׁרֵת
  choice: सेवा करने के लिए खड़े
  rationale: दोनों क्रियाओं—‘खड़ा होना/रहना’ और औपचारिक धार्मिक ‘सेवा करना’—को बनाए रखता है, बिना यह तय किए कि वे अपना स्थान ग्रहण नहीं कर सके या वहाँ टिके नहीं रह सके।
- source_word: מִפְּנֵי הֶעָנָן
  choice: बादल के कारण
  rationale: इस प्रसंग में מִפְּנֵי कारण बताता है; यह हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: כְבוֹד יְהוָה
  choice: याहवे का तेज
  rationale: כָּבוֹד के प्रकट दिव्य वैभव के अर्थ को ‘तेज’ स्वाभाविक बाइबलीय हिन्दी में व्यक्त करता है; इसे केवल ‘उपस्थिति’ कहकर व्याख्यायित नहीं किया गया।
- source_word: בֵּית יְהוָה
  choice: याहवे का भवन
  rationale: इब्रानी के शाब्दिक ‘याहवे का घर/भवन’ को सुरक्षित रखता है; प्रसंगगत अर्थ पादटिप्पणी में स्पष्ट किया गया है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी व्यक्तिगत दिव्य नाम का देवनागरी लिप्यंतरण है, किसी उपाधि से उसका स्थानापन्न नहीं करता।
- source_word: מָלֵא
  choice: भर गया था
  rationale: पूर्ण हुई उस घटना को व्यक्त करता है जो याजकों की असमर्थता का कारण बनी; हिन्दी कथन में पूर्वपूर्णता स्वाभाविक है।
theological_decisions:
- issue: दिव्य नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में व्यक्तिगत वाचा-नाम है; ‘याहवे’ उसका निकट लिप्यंतरण है और उसे उपाधि में नहीं बदलता।
- issue: כְבוֹד को कैसे व्यक्त किया जाए
  choice: तेज
  alternative: महिमा; प्रत्यक्ष उपस्थिति
  rationale: ‘तेज’ दिव्य वैभव की दृश्य और प्रभावशाली अभिव्यक्ति को बनाए रखता है, जबकि ‘प्रत्यक्ष उपस्थिति’ मूल बिंब की व्याख्या कर देती।
- issue: याजकों के खड़े न रह सकने का आशय
  choice: खड़े न रह सके
  alternative: खड़े होकर सेवा न कर सके
  rationale: यह अनुवाद क्षमता की कमी और खड़े रहने—दोनों को रखता है, पर यह अतिरिक्त रूप से निर्धारित नहीं करता कि समस्या केवल सेवा आरम्भ करने की थी या खड़े बने रहने की।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण कथात्मक शैली अपनाई गई है। ‘याजक’, ‘तेज’ और ‘भवन’ जैसे परिचित बाइबलीय शब्द रखे गए हैं; वाक्य को अनावश्यक धार्मिक पारिभाषिकता से नहीं भरा गया।
