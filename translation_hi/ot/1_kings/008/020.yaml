source:
  edition: WLC
  text: וַ/יָּ֣קֶם יְהוָ֔ה אֶת דְּבָר֖/וֹ אֲשֶׁ֣ר דִּבֵּ֑ר וָ/אָקֻ֡ם תַּחַת֩ דָּוִ֨ד אָבִ֜/י וָ/אֵשֵׁ֣ב עַל כִּסֵּ֣א יִשְׂרָאֵ֗ל כַּֽ/אֲשֶׁר֙ דִּבֶּ֣ר יְהוָ֔ה וָ/אֶבְנֶ֣ה הַ/בַּ֔יִת לְ/שֵׁ֥ם יְהוָ֖ה אֱלֹהֵ֥י יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/020.yaml
  text: And Yahweh has fulfilled his word that he spoke[a], and I have risen in the place of David my father and sit on the throne of Israel, just as Yahweh spoke, and I have built the house for the name of Yahweh[b], the God of Israel.
translation:
  language: hi
  text: और यहोवा ने अपना वह वचन पूरा किया है जो उसने कहा था[a]। मैं अपने पिता दाऊद के स्थान पर उत्तराधिकारी बना और इस्राएल के सिंहासन पर विराजमान हुआ, ठीक वैसा ही जैसा यहोवा ने कहा था; और मैंने इस्राएल के परमेश्वर यहोवा के नाम के लिए यह भवन बनाया है[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “अपने वचन को सिद्ध किया है” अथवा “अपने वचन को कार्यरूप दिया है।”
    reason: וַיָּקֶם के अर्थ-क्षेत्र में स्थापित करना, सिद्ध करना और पूरा करना सम्मिलित हैं।
  - marker: b
    text: मूल भाषा में “यह भवन”; अर्थात् मंदिर।
    reason: הַבַּיִת का शाब्दिक अर्थ भवन/घर है, पर इस प्रसंग में संकेत मंदिर की ओर है।
lexical_decisions:
- source_word: וַיָּקֶם
  choice: पूरा किया है
  rationale: हिफ़ील रूप में ‘वचन’ के साथ यह क्रिया कही हुई बात को सिद्ध या पूरा करने का अर्थ देती है; प्रसंग में परमेश्वर द्वारा अपना वचन कार्यरूप में पूरा करना अभिप्रेत है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: व्यक्तिगत दिव्य नाम יהוה को हिन्दी में प्रचलित लिप्यंतरण ‘यहोवा’ से रखा गया है, किसी उपाधि से प्रतिस्थापित नहीं किया गया।
- source_word: דְּבָרוֹ אֲשֶׁר דִּבֵּר
  choice: अपना वह वचन ... जो उसने कहा था
  rationale: मूल के ‘वचन’ और ‘कहा’ की पुनरुक्ति को बनाए रखता है तथा इसे स्पष्ट रूप से ‘प्रतिज्ञा’ कहकर अर्थ को अनावश्यक रूप से सीमित नहीं करता।
- source_word: וָאָקֻם תַּחַת דָּוִד אָבִי
  choice: मैं अपने पिता दाऊद के स्थान पर उठा
  rationale: ‘उठा’ पहले प्रयुक्त קום से शब्दगत संबंध बनाए रखता है, जबकि ‘के स्थान पर’ राजवंशीय उत्तराधिकार का भाव व्यक्त करता है।
- source_word: וָאֵשֵׁב עַל כִּסֵּא יִשְׂרָאֵל
  choice: इस्राएल के सिंहासन पर बैठा हूँ
  rationale: इब्रानी अभिव्यक्ति के निकट रहते हुए वर्तमान परिणामी अवस्था—सुलैमान का सिंहासन पर विराजमान होना—स्वाभाविक हिन्दी में व्यक्त होती है।
- source_word: כַּאֲשֶׁר דִּבֶּר יְהוָה
  choice: ठीक जैसा यहोवा ने कहा था
  rationale: דבר की पुनरावृत्ति को ‘कहा’ से बनाए रखा गया है और כַּאֲשֶׁר का अनुरूपता-बोध ‘ठीक जैसा’ से व्यक्त किया गया है।
- source_word: וָאֶבְנֶה הַבַּיִת
  choice: मैंने ... यह भवन बनाया है
  rationale: הַבַּיִת का मूल अर्थ ‘यह भवन/घर’ है और प्रसंग में यह मंदिर है; ‘भवन’ हिन्दी में गरिमापूर्ण तथा संदर्भानुकूल है, जबकि पादटिप्पणी पहचान स्पष्ट करती है।
- source_word: לְשֵׁם יְהוָה
  choice: यहोवा के नाम के लिए
  rationale: ‘नाम के लिए’ की महत्वपूर्ण बाइबिलीय अभिव्यक्ति को व्याख्यात्मक ‘सम्मान में’ से बदलने के बजाय सुरक्षित रखा गया है।
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: इस्राएल के परमेश्वर
  rationale: वाचा-संबंधी उपाधि का सीधा और स्वाभाविक हिन्दी रूप।
theological_decisions:
- issue: दिव्य नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल में व्यक्तिगत दिव्य नाम है। हिन्दी बाइबिलीय प्रयोग में व्यापक रूप से पहचाने जाने वाले ‘यहोवा’ को चुना गया, उपाधि ‘प्रभु’ नहीं, ताकि नाम का स्वरूप बना रहे।
- issue: הַבַּיִת को ‘भवन’ या ‘मंदिर’ कहना
  choice: भवन
  alternative: मंदिर
  rationale: मूल की ‘घर/भवन’ शब्दावली और उसके धर्मवैचारिक प्रतिध्वनि को बनाए रखा गया है; पादटिप्पणी स्पष्ट करती है कि यहाँ सन्दर्भ मंदिर का है।
- issue: קום की दोहरी उपस्थिति
  choice: ‘पूरा किया’ और ‘उठा’
  alternative: ‘स्थिर किया’ और ‘उत्तराधिकारी हुआ’
  rationale: पहली जगह प्रसंगगत अर्थ स्वाभाविक हिन्दी में दिया गया, जबकि दूसरी जगह ‘उठा’ रखकर मूल की शब्दगत कड़ी आंशिक रूप से बचाई गई; दोनों को एक ही हिन्दी क्रिया देना अस्वाभाविक और अस्पष्ट होता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सार्वजनिक पाठ के अनुकूल शैली। वाक्य को स्पष्टता के लिए दो मुख्य खंडों में रखा गया है; ‘वचन’, ‘सिंहासन’ और ‘नाम के लिए’ जैसी प्रमुख बाइबिलीय अभिव्यक्तियाँ सुरक्षित हैं।
