source:
  edition: WLC
  text: כִּ֚י הַֽ/אֻמְנָ֔ם יֵשֵׁ֥ב אֱלֹהִ֖ים עַל הָ/אָ֑רֶץ הִ֠נֵּה הַ/שָּׁמַ֜יִם וּ/שְׁמֵ֤י הַ/שָּׁמַ֨יִם֙ לֹ֣א יְכַלְכְּל֔וּ/ךָ אַ֕ף כִּֽי הַ/בַּ֥יִת הַ/זֶּ֖ה אֲשֶׁ֥ר בָּנִֽיתִי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/027.yaml
  text: For will God indeed dwell on the earth? Behold[a], the heavens, even the highest heavens, cannot contain you[c][b]; how much less this house that I have built!
translation:
  language: hi
  text: क्या सचमुच परमेश्वर पृथ्वी पर वास करेगा? देखो, आकाश, यहाँ तक कि सबसे ऊँचे आकाश भी[a], तुझे धारण नहीं कर सकते[b]; तो फिर यह भवन, जिसे मैंने बनाया है, तुझे कैसे धारण कर सकता है?[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “आकाश और आकाशों का आकाश”; यह सबसे ऊँचे आकाश के लिए इब्रानी अभिव्यक्ति है।
    reason: lexical_alternative
  - marker: b
    text: या “तुझे अपने भीतर नहीं रख सकते।”
    reason: lexical_alternative
  - marker: c
    text: “यह भवन” सुलैमान द्वारा बनाए गए मन्दिर को दर्शाता है।
    reason: cultural_note
lexical_decisions:
- source_word: כִּי הַאֻמְנָם
  choice: पर क्या...सचमुच
  rationale: यह पद पिछले संदर्भ से मुड़कर विस्मय और गंभीर आलंकारिक प्रश्न प्रकट करता है; आधुनिक हिन्दी में यह संयोजन दोनों भावों को स्वाभाविक रूप से रखता है।
- source_word: יֵשֵׁב
  choice: वास करेगा
  rationale: मूल क्रिया बैठने या रहने का भाव रखती है; मन्दिर में परमेश्वर की उपस्थिति के संदर्भ में ‘वास करना’ गरिमापूर्ण और सटीक है।
- source_word: עַל הָאָרֶץ
  choice: पृथ्वी पर
  rationale: यहाँ पृथ्वी का विरोध आकाश से है, इसलिए ‘देश में’ के बजाय व्यापक ब्रह्मांडीय अर्थ उपयुक्त है।
- source_word: הִנֵּה
  choice: देख
  rationale: आगे के कथन पर बलपूर्वक ध्यान खींचता है और ‘देखो’ की अपेक्षा एकवचन संबोधन के अनुरूप है।
- source_word: הַשָּׁמַיִם וּשְׁמֵי הַשָּׁמַיִם
  choice: आकाश—वरन् सबसे ऊँचा आकाश भी
  rationale: इब्रानी ‘आकाश और आकाशों का आकाश’ एक परमोत्कृष्टता-सूचक पदबंध है; अनुवाद उसका बढ़ता हुआ बल स्पष्ट और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: לֹא יְכַלְכְּלוּךָ
  choice: तुझे समा नहीं सकता
  rationale: क्रिया किसी को अपने भीतर धारण या समाहित कर सकने की क्षमता बताती है; ‘समा नहीं सकता’ स्थानगत असीमता को सहज हिन्दी में व्यक्त करता है।
- source_word: אַף כִּי
  choice: फिर...कैसे समा सकता है
  rationale: 'यह न्यूनतर संभावना की ओर जाने वाला तर्क है: जब सर्वोच्च आकाश भी परमेश्वर को नहीं समा सकता, तो बनाया हुआ भवन तो और भी नहीं।'
- source_word: הַבַּיִת הַזֶּה אֲשֶׁר בָּנִיתִי
  choice: यह भवन, जिसे मैंने बनाया है
  rationale: ‘भवन’ मूल ‘घर’ के स्थापत्य भाव को रखता है और यहाँ सुलैमान द्वारा बनाए गए मन्दिर के लिए स्वाभाविक हिन्दी है।
theological_decisions:
- issue: परमेश्वर की असीमता और मन्दिर में उसकी उपस्थिति
  choice: विस्मयपूर्ण प्रश्न और यह घोषणा रखी गई है कि सर्वोच्च आकाश भी परमेश्वर को अपने भीतर नहीं समा सकता।
  alternative: इसे सपाट निषेध बनाना कि परमेश्वर पृथ्वी पर वास ही नहीं करता, अथवा ऐसा संकेत देना कि मन्दिर उसे स्थानगत रूप से सीमित कर देता है।
  rationale: मूल पाठ परमेश्वर के पृथ्वी पर वास करने पर विस्मय व्यक्त करते हुए उसकी असीमता घोषित करता है; अनुवाद वास्तविक मन्दिर-उपस्थिति और दिव्य असीमता के तनाव को अनसुलझा रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण प्रार्थना-रजिस्टर अपनाया गया है। परमेश्वर के लिए निकट एकवचन ‘तू/तुझे’ का पारंपरिक भक्तिपरक संबोधन रखा गया है; शब्दावली सामान्य पाठक के लिए स्पष्ट है, जबकि इब्रानी आलंकारिक प्रश्न और आरोही ब्रह्मांडीय बल सुरक्षित हैं।
