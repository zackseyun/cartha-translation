  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: לִ/הְיוֹת֩ עֵינֶ֨/ךָ פְתֻח֜וֹת אֶל הַ/בַּ֤יִת הַ/זֶּה֙ לַ֣יְלָה וָ/י֔וֹם אֶל הַ֨/מָּק֔וֹם אֲשֶׁ֣ר אָמַ֔רְתָּ יִהְיֶ֥ה שְׁמִ֖/י שָׁ֑ם לִ/שְׁמֹ֨עַ֙ אֶל הַ/תְּפִלָּ֔ה אֲשֶׁ֣ר יִתְפַּלֵּ֣ל עַבְדְּ/ךָ֔ אֶל הַ/מָּק֖וֹם הַ/זֶּֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/029.yaml
  text: that your eyes may be open toward this house night and day[a], toward the place of which you said, ‘My name will be there,’ to hear the prayer that your servant prays toward this place.
translation:
  language: hi
  text: कि तेरी आँखें इस भवन की ओर रात-दिन खुली रहें—उस स्थान की ओर, जिसके विषय में तूने कहा था, ‘मेरा नाम वहाँ रहेगा’[a]—और तू उस प्रार्थना को सुने जो तेरा सेवक इस स्थान की ओर प्रार्थना करे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘मेरा नाम वहाँ रहेगा’ मन्दिर से जुड़ी वह भाषा है जो इस स्थान के साथ परमेश्वर के चुने हुए सम्बन्ध को व्यक्त करती है। इसमें उसकी वाचा-संबंधी उपस्थिति का संकेत है, पर इस वाक्यांश का अर्थ केवल इतना ही नहीं है।
    reason: शाब्दिक और धर्मवैचारिक अर्थ-सीमा स्पष्ट करना
lexical_decisions:
- source_word: לִהְיוֹת עֵינֶךָ פְתֻחוֹת
  choice: कि तेरी आँखें ... खुली रहें
  rationale: उद्देश्य/परिणाम सूचक रचना को स्वाभाविक हिन्दी उपवाक्य में व्यक्त किया गया है और परमेश्वर की सजग दृष्टि का मानवरूपी बिंब ज्यों का त्यों रखा गया है।
- source_word: אֶל הַבַּיִת הַזֶּה
  choice: इस भवन की ओर
  rationale: אֶל की दिशात्मकता को ‘की ओर’ से व्यक्त किया गया है। ‘भवन’ यहाँ मन्दिर के लिए प्रयुक्त ‘घर’ की अवधारणा को गरिमापूर्ण और सुबोध ढंग से रखता है।
- source_word: לַיְלָה וָיוֹם
  choice: रात-दिन
  rationale: यह स्वाभाविक हिन्दी युग्म मूल के निरन्तर ध्यान के भाव को उसके ठोस मुहावरे सहित सुरक्षित रखता है।
- source_word: אֶל הַמָּקוֹם
  choice: उस स्थान की ओर
  rationale: मूल में दोहराए गए स्थान और दिशा के भाव को बनाए रखा गया है।
- source_word: יִהְיֶה שְׁמִי שָׁם
  choice: मेरा नाम वहाँ रहेगा
  rationale: ‘नाम’ को ‘उपस्थिति’ या ‘निवास’ में व्याख्यात्मक रूप से नहीं बदला गया; भविष्यकालीन/स्थायी भाव के लिए ‘रहेगा’ स्वाभाविक है।
- source_word: לִשְׁמֹעַ אֶל הַתְּפִלָּה
  choice: उस प्रार्थना को सुने
  rationale: उद्देश्य सूचक infinitive को पिछले निवेदन से जोड़कर हिन्दी में स्वाभाविक रूप दिया गया है; ‘सुनना’ उत्तरदायी ध्यान की मूल प्रार्थना-भाषा को सुरक्षित रखता है।
- source_word: עַבְדְּךָ
  choice: तेरा सेवक
  rationale: राजकीय प्रार्थना में यह विनम्र अधीनता का संबोधन है; ‘सेवक’ आधुनिक हिन्दी में ‘दास’ की अपेक्षा अधिक सामान्य और यहाँ पर्याप्त रूप से गरिमापूर्ण है।
- source_word: יִתְפַּלֵּל ... אֶל הַמָּקוֹם הַזֶּה
  choice: इस स्थान की ओर प्रार्थना करे
  rationale: अपूर्ण क्रिया के संभाव्य/पुनरावृत्त अर्थ और प्रार्थना की दिशात्मकता दोनों को बिना अनावश्यक विस्तार के रखा गया है।
theological_decisions:
- issue: परमेश्वर की आँखें खुली रहने की मानवरूपी भाषा
  choice: ‘तेरी आँखें ... खुली रहें’ को अक्षरार्थ बिंब सहित रखा गया
  alternative: इस भवन पर तेरा ध्यान लगा रहे / इस भवन की रखवाली कर
  rationale: मूल का शारीरिक बिंब परमेश्वर के सजग ध्यान को काव्यात्मक रूप देता है; उसे अमूर्त व्याख्या में बदलना उचित नहीं।
- issue: ‘मेरा नाम वहाँ रहेगा’ का मन्दिर-विषयक अर्थ
  choice: मुख्य पाठ में ‘मेरा नाम वहाँ रहेगा’ रखा गया
  alternative: मैं वहाँ उपस्थित रहूँगा / मैं वहाँ निवास करूँगा
  rationale: ‘नाम’ की वाचा-संबंधी और मन्दिर-संबंधी भाषा को किसी एक व्याख्या में सीमित नहीं किया गया; संकेतित उपस्थिति को पादटिप्पणी में समझाया गया है।
translation_notes:
  register: आधुनिक, सुबोध और गरिमापूर्ण हिन्दी; प्रार्थना के एकवचन सम्बोधन को ‘तू/तेरी/तेरा’ से सुरक्षित रखा गया है। मूल की पुनरुक्ति, दिशात्मकता और मानवरूपी बिंब बनाए गए हैं।
