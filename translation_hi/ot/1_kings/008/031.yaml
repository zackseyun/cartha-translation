source:
  edition: WLC
  text: אֵת֩ אֲשֶׁ֨ר יֶחֱטָ֥א אִישׁ֙ לְ/רֵעֵ֔/הוּ וְ/נָֽשָׁא ב֥/וֹ אָלָ֖ה לְ/הַֽאֲלֹת֑/וֹ וּ/בָ֗א אָלָ֛ה לִ/פְנֵ֥י מִֽזְבַּחֲ/ךָ֖ בַּ/בַּ֥יִת הַ/זֶּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/031.yaml
  text: If a man sins against his neighbor[a], and an oath is laid on him to make him swear, and the oath comes before your altar in this house,
translation:
  language: hi
  text: यदि कोई पुरुष अपने पड़ोसी के विरुद्ध पाप करे, और उसे शपथ दिलाई जाए, और वह शपथ इस भवन में आपकी वेदी के सामने आए,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יֶחֱטָא
  choice: पाप करे
  rationale: यह न्यायिक प्रसंग में दूसरे व्यक्ति के विरुद्ध किए गए अपराध को व्यक्त करता है, साथ ही हिब्रू क्रिया के नैतिक और धार्मिक बल को बनाए रखता है।
- source_word: אִישׁ
  choice: कोई पुरुष
  rationale: हिब्रू में पुल्लिंग एकवचन का सामान्य प्रतिनिधिक प्रयोग है; यह रूप स्रोत की व्याकरणिक बनावट को स्पष्ट रूप से रखता है।
- source_word: לְרֵעֵהוּ
  choice: अपने पड़ोसी के विरुद्ध
  rationale: רֵעַ का अर्थ पड़ोसी, साथी या सहमनुष्य हो सकता है; ‘पड़ोसी’ स्वाभाविक है और बाइबिल के पारस्परिक नैतिक भाव को बनाए रखता है।
- source_word: וְנָשָׂא בוֹ אָלָה
  choice: उस पर शपथ रखी जाए
  rationale: यह न्यायिक रीति में किसी व्यक्ति को शपथ के अधीन करने का भाव देता है और हिब्रू की निष्क्रिय संरचना को यथासंभव सुरक्षित रखता है।
- source_word: לְהַאֲלֹתוֹ
  choice: उसे शपथ दिलाने के लिए
  rationale: אלה के हिफ़ील रूप का प्रेरणार्थक भाव है—किसी से शपथ कराना या उसे शपथ के अधीन करना।
- source_word: וּבָא אָלָה
  choice: और वह शपथ ... आए
  rationale: हिब्रू वाक्य में אָלָה सबसे स्वाभाविक रूप से कर्ता है; इसलिए शपथ के वेदी के सामने आने की न्यायिक छवि रखी गई है।
- source_word: לִפְנֵי מִזְבַּחֲךָ
  choice: आपकी वेदी के सामने
  rationale: यह स्थान और परमेश्वर के सम्मुख न्यायिक उपस्थिति—दोनों का सीधा और स्वाभाविक अनुवाद है।
- source_word: בַּבַּיִת הַזֶּה
  choice: इस भवन में
  rationale: בַּיִת का मूल अर्थ ‘घर/भवन’ है। यहाँ मंदिर अभिप्रेत है, पर ‘भवन’ स्रोत की शब्दावली और गरिमापूर्ण आधुनिक हिन्दी दोनों को बनाए रखता है।
theological_decisions:
- issue: मंदिर-संबंधी न्यायिक प्रसंग में אָלָה का अनुवाद
  choice: शपथ
  alternative: शाप
  rationale: यहाँ मुख्य भाव वेदी के सामने ली या दिलाई जाने वाली न्यायिक शपथ का है। फिर भी אָלָה में शपथ भंग करने पर आने वाले शाप का भाव भी हो सकता है; इस वास्तविक अर्थ-तनाव को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण न्यायिक-उपासना संबंधी शैली अपनाई गई है। ‘आपकी’ प्रार्थना में परमेश्वर को सीधे संबोधन के स्वाभाविक आदरसूचक रूप के रूप में प्रयुक्त है।
