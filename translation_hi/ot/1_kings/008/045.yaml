  yaml_path: translation/ot/1_kings/008/045.yaml
  text: then hear in heaven their prayer and their plea[b][a], and uphold their cause.
translation:
  language: hi
  text: तब तू स्वर्ग में उनकी प्रार्थना और उनकी विनती सुनना, और उन्हें न्याय दिलाना।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְשָׁמַעְתָּ
  choice: तब तू ... सुनना
  rationale: प्रार्थना के संदर्भ में पूर्ण क्रिया याचना का भाव रखती है। आरंभिक संयोजक पिछले सशर्त वाक्यों के परिणाम को आगे बढ़ाता है, इसलिए स्वाभाविक हिन्दी में ‘तब’ उपयुक्त है।
- source_word: הַשָּׁמַיִם
  choice: स्वर्ग में
  rationale: इब्रानी में शाब्दिक रूप ‘आकाशों’ है और कोई पूर्वसर्ग नहीं है; फिर भी इस प्रार्थना-सूत्र में स्थानवाचक अर्थ निहित है। ‘स्वर्ग में’ आधुनिक हिन्दी में स्वाभाविक है और ‘स्वर्ग से’ की अपेक्षा रूप के अधिक निकट है।
- source_word: תְּפִלָּתָם
  choice: उनकी प्रार्थना
  rationale: यह प्रार्थना का सामान्य शब्द है; एकवचन रूप और बहुवचन संबंधसूचक प्रत्यय को हिन्दी में सामूहिक अर्थ के साथ सहज रूप से रखा गया है।
- source_word: תְּחִנָּתָם
  choice: उनकी विनती
  rationale: यह कृपा या सहायता के लिए की गई गंभीर याचना को दर्शाता है। ‘विनती’ सामान्य पाठकों के लिए स्वाभाविक है और ‘प्रार्थना’ से इसका हल्का अर्थभेद बनाए रखता है।
- source_word: וְעָשִׂיתָ מִשְׁפָּטָם
  choice: और उन्हें न्याय दिलाना
  rationale: शाब्दिक अर्थ ‘उनका न्याय करना’ है। यह न्यायिक मुहावरा उनके पक्ष में न्याय करने या उनके मुकदमे का उचित निपटारा करने का भाव देता है; ‘उन्हें न्याय दिलाना’ इसे सहज आधुनिक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: परमेश्वर से की गई याचना में न्यायिक मुहावरा
  choice: उन्हें न्याय दिलाना
  alternative: उनका न्याय करना; उनके पक्ष का समर्थन करना
  rationale: यह अनुवाद लोगों के पक्ष में न्यायपूर्ण कार्यवाही का कानूनी-संबंधपरक भाव बनाए रखता है, पर यह पहले से तय नहीं करता कि वे हर बात में निर्दोष या सही हैं।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और प्रार्थनात्मक शैली। ‘तू’ संबोधन निकटवर्ती बाइबिलीय प्रार्थना-परंपरा और एकवचन इब्रानी संबोधन के अनुरूप रखा गया है।
