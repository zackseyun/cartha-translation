base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/008.yaml
  text: And the poles were so long that the ends of the poles were seen from the Holy Place before the inner sanctuary[a], but they could not be seen from outside; and they are there to this day.
translation:
  language: hi
  text: डंडे इतने लंबे थे कि उनके सिरे पवित्र स्थान से भीतरी पवित्रस्थान[a] के सामने दिखाई देते थे, पर वे बाहर से दिखाई नहीं देते थे; और वे आज के दिन तक वहीं हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “परमपवित्र स्थान।” इब्रानी शब्द मन्दिर के भीतरी पवित्र कक्ष को दर्शाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּאֲרִכוּ הַבַּדִּים
  choice: डंडे इतने लंबे थे
  rationale: संदर्भ में क्रिया डंडों की ऐसी लंबाई बताती है जिसके कारण उनके सिरे दिखाई देते थे; यह परिणामसूचक भाव स्वाभाविक हिन्दी में स्पष्ट है।
- source_word: וַיֵּרָאוּ רָאשֵׁי הַבַּדִּים
  choice: उनके सिरे ... दिखाई देते थे
  rationale: רָאשֵׁי का शाब्दिक अर्थ ‘सिर’ है, पर डंडों के लिए ‘सिरे’ स्वाभाविक है। निफ़अल रूप दृश्यता व्यक्त करता है।
- source_word: מִן הַקֹּדֶשׁ
  choice: पवित्र स्थान से
  rationale: यह मन्दिर के बाहरी कक्ष को दर्शाता है, जो भीतरी कक्ष से अलग था।
- source_word: עַל פְּנֵי הַדְּבִיר
  choice: भीतरी पवित्रस्थान के सामने
  rationale: דְּבִיר मन्दिर के भीतरी पवित्र कक्ष का नाम है; ‘के सामने’ עַל־פְּנֵי का स्वाभाविक स्थानगत अर्थ देता है।
- source_word: וְלֹא יֵרָאוּ הַחוּצָה
  choice: पर वे बाहर से दिखाई नहीं देते थे
  rationale: यह पवित्र स्थान से उनकी दृश्यता और बाहर से अदृश्यता के बीच का स्पष्ट विरोध बनाए रखता है।
- source_word: וַיִּהְיוּ שָׁם עַד הַיּוֹם הַזֶּה
  choice: और वे आज के दिन तक वहीं हैं
  rationale: यह कथाकार के समय तक बनी हुई स्थिति बताने वाला मानक इब्रानी मुहावरा है।
theological_decisions:
- issue: הַדְּבִיר का मन्दिर-संबंधी अर्थ
  choice: भीतरी पवित्रस्थान
  alternative: परमपवित्र स्थान
  rationale: मूल शब्द मन्दिर के भीतरी कक्ष को सूचित करता है। मुख्य पाठ में स्थानगत अर्थ रखा गया है और प्रचलित धार्मिक पद को पादटिप्पणी में विकल्प के रूप में दिया गया है, ताकि मूल से अधिक विशिष्टता आरोपित न हो।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध हिन्दी। ‘पवित्र स्थान’ और ‘भीतरी पवित्रस्थान’ के द्वारा मन्दिर के दोनों कक्षों का भेद बनाए रखा गया है।
