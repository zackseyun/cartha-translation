  text: וְ/אַתָּ֣ה תִּשְׁמַ֣ע הַ/שָּׁמַ֗יִם וְ/עָשִׂ֨יתָ֙ וְ/שָׁפַטְתָּ֣ אֶת עֲבָדֶ֔י/ךָ לְ/הַרְשִׁ֣יעַ רָשָׁ֔ע לָ/תֵ֥ת דַּרְכּ֖/וֹ בְּ/רֹאשׁ֑/וֹ וּ/לְ/הַצְדִּ֣יק צַדִּ֔יק לָ֥/תֶת ל֖/וֹ כְּ/צִדְקָתֽ/וֹ׀־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/032.yaml
  text: then hear in heaven and act[a], and judge your servants, condemning the wicked by bringing his way upon his own head[c][b], and justifying the righteous by giving to him according to his righteousness.
translation:
  language: hi
  text: तब तू स्वर्ग में सुन[a] और कार्रवाई कर; अपने सेवकों का न्याय कर—दुष्ट को दोषी ठहराकर उसके कर्मों का फल उसी के सिर पर डाल,[b] और धर्मी को निर्दोष ठहराकर[c] उसकी धार्मिकता के अनुसार उसे फल दे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “स्वर्ग से सुन।” इब्रानी में यहाँ ‘स्वर्ग/आकाशों’ का रूप आता है; इस प्रार्थना-सूत्र का अर्थ परमेश्वर का स्वर्ग में सुनना या स्वर्ग से सुनना समझा जा सकता है।
    reason: lexical_alternative
  - marker: b
    text: “उसके कर्मों का फल उसी के सिर पर डालना” एक इब्रानी मुहावरा है, जिसका अर्थ है किसी व्यक्ति को उसके आचरण के अनुसार प्रतिफल देना।
    reason: cultural_note
  - marker: c
    text: या “धर्मी के पक्ष में निर्णय देकर” अथवा “धर्मी को धर्मी ठहराकर।”
    reason: alternative_reading
lexical_decisions:
- source_word: תִּשְׁמַע הַשָּׁמַיִם
  choice: स्वर्ग में सुन
  rationale: इब्रानी प्रार्थना-सूत्र में ‘स्वर्ग’ स्थानवाचक रूप में समझा जाता है। ‘स्वर्ग में सुन’ मूल अभिव्यक्ति के निकट है और स्वाभाविक हिन्दी भी है; ‘स्वर्ग से सुन’ भी सम्भव है, इसलिए उसे पादटिप्पणी में रखा गया है।
- source_word: וְעָשִׂיתָ
  choice: और कार्य कर
  rationale: עשה का अर्थ व्यापक रूप से ‘करना/कार्य करना’ है। यहाँ यह प्रार्थना के उत्तर में परमेश्वर के हस्तक्षेप को सूचित करता है, पर ‘हस्तक्षेप कर’ से अधिक व्याख्या जोड़े बिना ‘कार्य कर’ मूल की व्यापकता बनाए रखता है।
- source_word: וְשָׁפַטְתָּ אֶת עֲבָדֶיךָ
  choice: अपने सेवकों का न्याय कर
  rationale: שׁפט यहाँ शपथ और विवाद के न्यायिक प्रसंग में निर्णय करने को दर्शाता है। यह अनुवाद अगले दोनों विपरीत निर्णयों को पहले से तय किए बिना कानूनी परिवेश सुरक्षित रखता है।
- source_word: לְהַרְשִׁיעַ רָשָׁע
  choice: दुष्ट को दोषी ठहराकर
  rationale: रשע का हिफ़ील कानूनी प्रयोग में किसी को दोषी घोषित करने का अर्थ देता है। ‘दोषी ठहराना’ हिन्दी में स्पष्ट न्यायिक अभिव्यक्ति है।
- source_word: לָתֵת דַּרְכּוֹ בְּרֹאשׁוֹ
  choice: उसके चालचलन का फल उसी के सिर पर डाल
  rationale: ‘मार्ग’ यहाँ व्यक्ति के आचरण का द्योतक है। ‘चालचलन का फल’ आशय स्पष्ट करता है, जबकि ‘उसी के सिर पर डालना’ मूल इब्रानी प्रतिफलात्मक बिंब को सुरक्षित रखता है।
- source_word: וּלְהַצְדִּיק צַדִּיק
  choice: धर्मी को निर्दोष ठहराकर
  rationale: צדק का हिफ़ील इस न्यायिक संदर्भ में धर्मी के पक्ष में निर्णय देने अथवा उसे निर्दोष घोषित करने को दर्शाता है। ‘निर्दोष ठहराना’ परिवर्तनकारी अर्थ जोड़ने के बजाय विधिक अर्थ स्पष्ट करता है।
- source_word: לָתֶת לוֹ כְּצִדְקָתוֹ
  choice: उसकी धार्मिकता के अनुसार उसे फल दे
  rationale: यह वाक्यांश धर्मी के खरे आचरण के अनुरूप प्रतिफल देने की बात करता है। हिन्दी में ‘फल देना’ प्रतिफल का भाव स्वाभाविक रूप से व्यक्त करता है, और ‘उसकी धार्मिकता के अनुसार’ मूल तुलना को बनाए रखता है।
theological_decisions:
- issue: न्यायिक क्रियाओं का विधिक अर्थ या नैतिक रूपान्तरण का अर्थ
  choice: ‘दोषी ठहराना’ और ‘निर्दोष ठहराना’—दोनों को न्यायालयीन निर्णय के रूप में अनूदित किया गया है।
  alternative: ‘दण्ड देना’ और ‘धर्मी ठहराना/उसका पक्ष सही सिद्ध करना।’
  rationale: शपथ और न्याय-निर्णय का प्रसंग तथा दोनों इब्रानी हिफ़ील क्रियाओं का समानान्तर प्रयोग विधिक अर्थ का समर्थन करता है। इससे पद में न कही गई नैतिक रूपान्तरण की धारणा नहीं जोड़ी जाती।
translation_notes:
  register: आधुनिक मानक हिन्दी में सीधी प्रार्थनात्मक आज्ञार्थक शैली रखी गई है। परमेश्वर के लिए ‘तू’ का प्रयोग निकट, गम्भीर और पारम्परिक प्रार्थना-रजिस्टर के अनुरूप है। न्यायिक समानान्तरता स्पष्ट रखी गई है और इब्रानी मुहावरे का बिंब पादटिप्पणी सहित सुरक्षित है।
