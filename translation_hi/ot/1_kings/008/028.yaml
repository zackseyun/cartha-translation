reference: 1 Kings 8:28
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וּ/פָנִ֜יתָ אֶל תְּפִלַּ֧ת עַבְדְּ/ךָ֛ וְ/אֶל תְּחִנָּת֖/וֹ יְהוָ֣ה אֱלֹהָ֑/י לִ/שְׁמֹ֤עַ אֶל הָֽ/רִנָּה֙ וְ/אֶל הַ/תְּפִלָּ֔ה אֲשֶׁ֧ר עַבְדְּ/ךָ֛ מִתְפַּלֵּ֥ל לְ/פָנֶ֖י/ךָ הַ/יּֽוֹם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/028.yaml
  text: Yet turn toward the prayer of your servant and to his plea for favor[a], O Yahweh my God[b], to hear the cry and the prayer that your servant is praying before you today.
translation:
  language: hi
  text: फिर भी, हे याहवे, मेरे परमेश्वर, तेरे दास की प्रार्थना और उसकी कृपा की विनती पर ध्यान दे, ताकि तू उस पुकार और प्रार्थना को सुने जो तेरा दास आज तेरे सामने कर रहा है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּפָנִיתָ
  choice: फिर भी ... की ओर फिर
  rationale: פנה का मूल चित्र किसी ओर मुड़ने का है। संदर्भ में यह परमेश्वर से प्रार्थना पर ध्यान देने का अनुरोध है; ‘की ओर फिर’ उस इब्रानी चित्र को बनाए रखता है, और ‘फिर भी’ पिछले पद में परमेश्वर की महानता के स्वीकार के बाद आने वाले हल्के विरोध को व्यक्त करता है।
- source_word: תְּפִלַּת
  choice: प्रार्थना
  rationale: תפלה का सीधा और प्रचलित हिन्दी समानार्थक ‘प्रार्थना’ है; पद में इसकी पुनरावृत्ति भी बनाए रखी गई है।
- source_word: עַבְדְּךָ
  choice: तेरा दास
  rationale: ईश्वर को संबोधित करते हुए עבד नम्र सेवा और अधीनता व्यक्त करता है। ‘दास’ इस राजकीय-प्रार्थनात्मक संदर्भ में उपयुक्त है और दोनों occurrences में समान रखा गया है।
- source_word: תְּחִנָּתוֹ
  choice: उसकी अनुग्रह की विनती
  rationale: תחנה दया या अनुग्रह पाने के लिए की गई गंभीर विनती को दर्शाता है। ‘अनुग्रह की विनती’ इस अर्थ-छाया को स्पष्ट करता है; तीसरे पुरुष का प्रत्यय सुलैमान को ‘तेरा दास’ कहकर संदर्भित करता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: यह परमेश्वर का व्यक्तिगत वाचा-नाम है; इसे किसी उपाधि से बदलने के बजाय हिन्दी लिप्यंतरण ‘याहवे’ दिया गया है।
- source_word: אֱלֹהָי
  choice: मेरे परमेश्वर
  rationale: प्रत्यक्ष संबोधन में प्रथम पुरुष एकवचन संबंधसूचक रूप का स्वाभाविक हिन्दी अनुवाद।
- source_word: לִשְׁמֹעַ
  choice: सुन
  rationale: שמע यहाँ प्रार्थना और पुकार को सुनने तथा ग्रहण करने के अनुरोध को व्यक्त करता है। हिन्दी में आज्ञार्थक वाक्य-संरचना स्रोत के उद्देश्यसूचक infinitive का स्वाभाविक रूप देती है।
- source_word: הָרִנָּה
  choice: पुकार
  rationale: רנה ऊँची या गूँजती पुकार का संकेत दे सकता है। प्रार्थना के समानांतर यहाँ ‘पुकार’ प्रसंगानुकूल है और इसे गीत या आनंद-ध्वनि के रूप में अनावश्यक रूप से सीमित नहीं करता।
- source_word: מִתְפַּלֵּל
  choice: कर रहा है
  rationale: हित्पएल participle जारी क्रिया को दर्शाता है; ‘प्रार्थना ... कर रहा है’ उसकी वर्तमान और निरंतर प्रकृति व्यक्त करता है।
- source_word: לְפָנֶיךָ
  choice: तेरे सामने
  rationale: यह स्रोत के स्थानिक मुहावरे का सीधा और स्वाभाविक हिन्दी रूप है।
- source_word: הַיּוֹם
  choice: आज
  rationale: आधुनिक हिन्दी में समय-संदर्भ का सीधा और सहज रूप।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: स्रोत में चार-अक्षरी व्यक्तिगत नाम सीधे प्रयुक्त है। ‘याहवे’ उसे उपाधि से प्रतिस्थापित किए बिना प्रस्तुत करता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘तेरा/तेरे’ का प्रयोग बाइबिलीय प्रार्थना में निकटता और एकवचन संबोधन को बनाए रखता है। इब्रानी समानांतरता तथा ‘प्रार्थना’ की पुनरावृत्ति जानबूझकर सुरक्षित रखी गई है।
