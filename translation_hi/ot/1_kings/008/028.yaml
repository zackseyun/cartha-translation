  to: फिर भी, हे याहवे, मेरे परमेश्वर, तेरे दास की प्रार्थना और उसकी कृपा की विनती पर ध्यान दे, ताकि तू उस पुकार और प्रार्थना को सुने जो तेरा दास आज तेरे सामने कर रहा है।
