source:
  edition: WLC
  text: וְ֠/אַתָּה תִּשְׁמַ֨ע הַ/שָּׁמַ֜יִם מְכ֤וֹן שִׁבְתֶּ֨/ךָ֙ וְ/סָלַחְתָּ֣ וְ/עָשִׂ֔יתָ וְ/נָתַתָּ֤ לָ/אִישׁ֙ כְּ/כָל דְּרָכָ֔י/ו אֲשֶׁ֥ר תֵּדַ֖ע אֶת לְבָב֑/וֹ כִּֽי אַתָּ֤ה יָדַ֨עְתָּ֙ לְ/בַדְּ/ךָ֔ אֶת לְבַ֖ב כָּל בְּנֵ֥י הָ/אָדָֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/039.yaml
  text: then may you hear in heaven[a], the place where you dwell, and forgive, and act, and give to each man according to all his ways, whose heart you know—for you alone know the heart of all the sons of man—
translation:
  language: hi
  text: तब तू स्वर्ग में, जो तेरा निवास-स्थान है, सुन; क्षमा कर, कार्यवाही कर, और प्रत्येक व्यक्ति को उसके सभी मार्गों के अनुसार दे, जिसका हृदय तू जानता है; क्योंकि केवल तू ही समस्त मनुष्यों के हृदयों को जानता है[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से “आदम/मनुष्य की सारी सन्तानें”; यह सभी मनुष्यों के लिए प्रयुक्त एक मुहावरा है।
    reason: मूल के मानववंशीय मुहावरे का शाब्दिक रूप और उसका सामूहिक अर्थ स्पष्ट करना।
lexical_decisions:
- source_word: תִּשְׁמַע
  choice: सुन
  rationale: प्रार्थना के प्रसंग में अपूर्ण क्रिया निवेदनात्मक अर्थ रखती है; हिन्दी में प्रत्यक्ष विनती के रूप में ‘सुन’ स्वाभाविक और स्पष्ट है।
- source_word: הַשָּׁמַיִם מְכוֹן שִׁבְתֶּךָ
  choice: स्वर्ग में, अपने निवास-स्थान में
  rationale: स्वर्ग को परमेश्वर के निवास-स्थान के रूप में बताने वाली मूल समानाधिकरण रचना को बनाए रखता है।
- source_word: וְסָלַחְתָּ וְעָשִׂיתָ
  choice: क्षमा कर और कार्य कर
  rationale: अनुक्रमिक क्रियाएँ उसी प्रार्थनात्मक निवेदन को आगे बढ़ाती हैं; ‘कार्य कर’ मूल क्रिया के व्यापक अर्थ को अनावश्यक रूप से विशिष्ट नहीं बनाता।
- source_word: וְנָתַתָּ לָאִישׁ כְּכָל דְּרָכָיו
  choice: प्रत्येक मनुष्य को उसके सारे चालचलन के अनुसार दे
  rationale: एकवचन का वितरणात्मक अर्थ ‘प्रत्येक मनुष्य’ से व्यक्त होता है। ‘चालचलन’ דֶּרֶךְ के नैतिक जीवन-व्यवहार संबंधी रूपक को स्वाभाविक हिन्दी में रखता है; क्रिया का अनिर्दिष्ट कर्म भी मूल की तरह अनिर्दिष्ट छोड़ा गया है।
- source_word: לְבָב / לְבָבוֹ
  choice: हृदय
  rationale: यह शब्द विचार, इच्छा और भीतरी व्यक्ति को समेटता है; ‘हृदय’ परिचित बाइबलीय रूपक और अर्थ-व्याप्ति को बनाए रखता है।
- source_word: לְבַדְּךָ
  choice: केवल तू ही
  rationale: परमेश्वर के अनन्य ज्ञान पर मूल के बल को स्पष्ट रूप से व्यक्त करता है।
- source_word: כָּל בְּנֵי הָאָדָם
  choice: मनुष्य की सभी सन्तानें
  rationale: मूल के शाब्दिक मानववंशीय मुहावरे को बनाए रखता है, जबकि पादटिप्पणी उसके समावेशी सामूहिक अर्थ को स्पष्ट करती है।
theological_decisions:
- issue: אֲשֶׁר תֵּדַע אֶת לְבָבוֹ का संबंध और भाव
  choice: क्योंकि तू उसके हृदय को जानता है
  alternative: जिसका हृदय तू जानता है
  rationale: सन्दर्भ में यह खण्ड परमेश्वर द्वारा प्रत्येक व्यक्ति को उसके चालचलन के अनुसार देने का आधार बताता है। ‘क्योंकि’ इस संभावित कारणात्मक संबंध को स्वाभाविक हिन्दी में व्यक्त करता है, बिना हृदय के दिव्य ज्ञान को मनुष्य के प्रतिफल से अलग किए।
- issue: כָּל בְּנֵי הָאָדָם में मानवजाति का वर्णन
  choice: मनुष्य की सभी सन्तानें
  alternative: सभी मनुष्य / समस्त मानवजाति
  rationale: मुख्य पाठ में मूल के ‘मनुष्य की सन्तानें’ मुहावरे और उसके वंशगत रूप को सुरक्षित रखा गया है; पादटिप्पणी स्पष्ट करती है कि आशय सभी मानव प्राणियों से है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण प्रार्थनात्मक शैली रखी गई है। परमेश्वर के लिए एकवचन निकट संबोधन ‘तू’ मूल इब्रानी के एकवचन संबोधन और पारंपरिक बाइबलीय प्रार्थना-भाषा के अनुरूप है।
