base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/010.yaml
  text: And when the priests came out from the holy place[a], the cloud filled the house of Yahweh.
translation:
  language: hi
  text: जब याजक पवित्र स्थान[a] से बाहर निकले, तब बादल ने याहवे के भवन को भर दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘पवित्रस्थान’ अथवा ‘पवित्र धाम’।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בְּצֵאת
  choice: जब ... बाहर निकले, तब
  rationale: וַיְהִי के साथ בְּצֵאת अगली घटना के लिए कालसूचक उपवाक्य बनाता है। हिंदी में ‘जब ... तब’ स्वाभाविक रूप से कथा का संक्रमण और क्रियाओं का संबंध व्यक्त करता है।
- source_word: הַכֹּהֲנִים
  choice: याजक
  rationale: निश्चित बहुवचन संज्ञा का प्रचलित और प्रसंगानुकूल हिंदी रूप।
- source_word: מִן הַקֹּדֶשׁ
  choice: पवित्र स्थान
  rationale: קֹדֶשׁ का मूल अर्थ पवित्र स्थान या पवित्र क्षेत्र है। ‘पवित्र स्थान’ मूल की सादगी बनाए रखता है; ‘पवित्रस्थान’ तथा ‘पवित्र धाम’ भी संदर्भानुसार संभव हैं।
- source_word: וְהֶעָנָן
  choice: बादल
  rationale: निश्चित संज्ञा; संदर्भ में यह वही दिव्य उपस्थिति दर्शाने वाला बादल है। हिंदी वाक्य-संरचना में संयोजक का अर्थ ‘तब’ के द्वारा स्वाभाविक रूप से व्यक्त हुआ है।
- source_word: מָלֵא
  choice: भर दिया
  rationale: Qal पूर्ण क्रिया में बादल कर्ता और भवन कर्म है। ‘भर दिया’ हिंदी में सकर्मक अर्थ को स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
- source_word: בֵּית יְהוָה
  choice: यहोवा का भवन
  rationale: בֵּית का ठोस अर्थ ‘भवन/घर’ सुरक्षित रखा गया है, और יהוה को उसके व्यक्तिगत वाचा-नाम ‘यहोवा’ से व्यक्त किया गया है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ में चार-अक्षरीय व्यक्तिगत नाम सीधे आया है। हिंदी पाठकों के लिए व्यापक रूप से पहचाना जाने वाला ‘यहोवा’ चुना गया है; ‘याहवे’ संभावित उच्चारण का अधिक समीपी वैकल्पिक रूप है।
- issue: הַקֹּדֶשׁ की स्थानगत विशिष्टता
  choice: पवित्र स्थान
  alternative: पवित्रस्थान / पवित्र धाम
  rationale: इब्रानी पद स्वयं किसी अधिक विशिष्ट तकनीकी विभाजन को अनिवार्य नहीं करता। इसलिए मुख्य पाठ में सामान्य अर्थ रखा गया है और विकल्प पादटिप्पणी में दिए गए हैं।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘याजक’, ‘पवित्र स्थान’ और ‘यहोवा का भवन’ जैसे रूप मूल की धार्मिक तथा स्थापत्य छवि को बिना अनावश्यक व्याख्या के सुरक्षित रखते हैं।
