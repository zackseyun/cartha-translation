  text: אָ֖ז אָמַ֣ר שְׁלֹמֹ֑ה יְהוָ֣ה אָמַ֔ר לִ/שְׁכֹּ֖ן בָּ/עֲרָפֶֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/012.yaml
  text: Then Solomon said[a], “Yahweh said that he would dwell in the thick darkness.”
translation:
  language: hi
  text: तब सुलैमान ने कहा, “याहवे ने कहा था कि वह घोर अंधकार में वास करेगा।”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “अंधकारमय बादल में।” इब्रानी शब्द עֲרָפֶל घने अंधकार या अंधकारमय बादल को सूचित कर सकता है, विशेषकर याहवे की प्रकट उपस्थिति के वर्णनों में।
    reason: lexical_alternative
lexical_decisions:
- source_word: אָז
  choice: तब
  rationale: यह कालवाचक कथात्मक संकेत है, जो सुलैमान के कथन को पिछली घटना से जोड़ता है।
- source_word: אָמַר
  choice: कहा / कहा था
  rationale: पहला प्रयोग प्रत्यक्ष कथन का सामान्य परिचय है; दूसरा पहले किए गए ईश्वरीय कथन को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: שְׁלֹמֹה
  choice: सुलैमान
  rationale: इस व्यक्तिगत नाम का हिन्दी बाइबल परंपरा में प्रचलित और सहज रूप।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी परमेश्वर-नाम के व्यंजनात्मक रूप को शीर्षक से प्रतिस्थापित करने के बजाय नाम के रूप में रखा गया है।
- source_word: לִשְׁכֹּן
  choice: वास करेगा
  rationale: ל के साथ infinitive construct यहाँ पूर्वकथित इच्छा/घोषणा की विषयवस्तु बताता है; ‘वास करेगा’ वर्तमान हिन्दी में स्वाभाविक और गरिमापूर्ण है।
- source_word: בָּעֲרָפֶל
  choice: घोर अंधकार में
  rationale: עֲרָפֶל घने अंधकार अथवा अंधकारमय बादल को सूचित कर सकता है; मुख्य पाठ में ‘घोर अंधकार’ ईश्वरीय उपस्थिति और अगोचरता के तनाव को बनाए रखता है।
theological_decisions:
- issue: עֲרָפֶל में याहवे के वास का चित्रण
  choice: वह घोर अंधकार में वास करेगा
  alternative: वह अंधकारमय बादल में वास करेगा
  rationale: मुख्य रूप उस विरोधाभासी ईश्वर-प्रकटन को सुरक्षित रखता है जिसमें ईश्वरीय उपस्थिति अंधकार और अगोचरता से जुड़ी है; वैकल्पिक बादल-चित्र को पादटिप्पणी में रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और सार्वजनिक पाठ के अनुकूल। ‘वास करना’ धार्मिक संदर्भ में सहज है, जबकि वाक्य-संरचना अनावश्यक रूप से संस्कृतनिष्ठ नहीं रखी गई।
