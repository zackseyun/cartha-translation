source:
  edition: WLC
  text: וְ/עַתָּ֞ה יְהוָ֣ה אֱלֹהֵ֣י יִשְׂרָאֵ֗ל שְׁ֠מֹר לְ/עַבְדְּ/ךָ֨ דָוִ֤ד אָבִ/י֙ אֵת֩ אֲשֶׁ֨ר דִּבַּ֤רְתָּ לּ/וֹ֙ לֵ/אמֹ֔ר לֹא יִכָּרֵ֨ת לְ/ךָ֥ אִישׁ֙ מִ/לְּ/פָנַ֔/י יֹשֵׁ֖ב עַל כִּסֵּ֣א יִשְׂרָאֵ֑ל רַ֠ק אִם יִשְׁמְר֨וּ בָנֶ֤י/ךָ אֶת דַּרְכָּ/ם֙ לָ/לֶ֣כֶת לְ/פָנַ֔/י כַּ/אֲשֶׁ֥ר הָלַ֖כְתָּ לְ/פָנָֽ/י׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/025.yaml
  text: And now[a], Yahweh, God of Israel, keep for your servant David my father what you spoke to him, saying, ‘A man shall not be cut off from before me for you, one sitting on the throne of Israel, if only your sons keep their way, by walking before me as you have walked before me.’
translation:
  language: hi
  text: 'और अब, हे याहवे, इस्राएल के परमेश्वर, अपने सेवक दाऊद, मेरे पिता, के लिए वह बात पूरी कर जो तूने उससे कही थी: ‘तुम्हें मेरे सामने इस्राएल के सिंहासन पर बैठने वाला कोई पुरुष कभी न घटेगा[a]—पर यह तभी होगा जब तुम्हारे पुत्र अपने आचरण का ध्यान रखें और मेरे सामने चलें, जैसे तुम मेरे सामने चले हो।’'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “तुम्हारे लिए मेरे सामने से इस्राएल के सिंहासन पर बैठने वाला कोई पुरुष काट न दिया जाएगा।” यह मुहावरा राजवंश में उत्तराधिकारी की निरंतरता को दर्शाता है।
    reason: मुख्य पाठ में हिब्रू मुहावरे का स्वाभाविक हिन्दी अर्थ दिया गया है; यह पादटिप्पणी ‘काट न दिया जाएगा,’ ‘तुम्हारे लिए,’ और सिंहासन पर बैठने वाले पुरुष के मूल पदों को सुरक्षित रखती है।
lexical_decisions:
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत नाम को उपाधि से बदलने के बजाय उसका प्रचलित हिन्दी लिप्यंतरण रखा गया है।
- source_word: שְׁמֹר
  choice: पूरी कर
  rationale: यहाँ क्रिया का कर्म दाऊद से कही गई प्रतिज्ञा है; हिन्दी में प्रतिज्ञा या कही हुई बात को ‘पूरा करना’ स्वाभाविक और प्रसंगानुकूल है।
- source_word: לְעַבְדְּךָ דָוִד אָבִי
  choice: अपने सेवक, मेरे पिता दाऊद
  rationale: ‘सेवक’ राजकीय और वाचागत विनम्रता को व्यक्त करता है; विराम-चिह्न से ‘मेरे पिता दाऊद’ का संबंध स्पष्ट होता है।
- source_word: אֵת אֲשֶׁר דִּבַּרְתָּ לוֹ
  choice: से कही हुई अपनी यह बात
  rationale: मूल के ‘जो तूने उससे कहा’ को बनाए रखते हुए आगामी उद्धरण से उसका आशय स्पष्ट किया गया है; ‘प्रतिज्ञा’ शब्द जोड़कर अर्थ को अनावश्यक रूप से निर्धारित नहीं किया गया।
- source_word: לֹא יִכָּרֵת לְךָ אִישׁ מִלְּפָנַי
  choice: मेरे सामने ... तुम्हारे वंश में पुरुष की कमी न होगी
  rationale: यह हिन्दी में वंशगत उत्तराधिकार के हिब्रू मुहावरे का स्वाभाविक रूप है। ‘तुम्हारे वंश में’ לְךָ के राजवंशीय आशय को स्पष्ट करता है; अधिक शाब्दिक रूप पादटिप्पणी में सुरक्षित है।
- source_word: יֹשֵׁב עַל כִּסֵּא יִשְׂרָאֵל
  choice: इस्राएल के सिंहासन पर बैठने के लिए
  rationale: कृदंत का प्रयोजनात्मक भाव हिन्दी में सहज ढंग से व्यक्त होता है और भावी राजकीय उत्तराधिकारी की ओर संकेत करता है।
- source_word: רַק אִם
  choice: पर यह तभी होगा जब
  rationale: यह पदबंध प्रतिज्ञा के साथ जुड़ी प्रबल शर्त को स्पष्ट और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: יִשְׁמְרוּ בָנֶיךָ אֶת דַּרְכָּם
  choice: तुम्हारे पुत्र अपने चालचलन पर ध्यान रखें
  rationale: ‘अपने मार्ग की रक्षा करें’ के हिब्रू मुहावरे को सामान्य हिन्दी में नैतिक आचरण की सावधानी के रूप में व्यक्त किया गया है।
- source_word: לָלֶכֶת לְפָנַי
  choice: मेरे सामने ... चलते रहें
  rationale: ‘चलना’ मूल रूपक को बनाए रखता है और परमेश्वर की उपस्थिति में जीवन बिताने के भाव को व्यक्त करता है।
- source_word: כַּאֲשֶׁר הָלַכְתָּ לְפָנָי
  choice: जैसे तुम मेरे सामने चलते रहे हो
  rationale: पूर्ण क्रिया दाऊद के अब तक के जीवन-क्रम को दर्शाती है; ‘चलते रहे हो’ हिन्दी में उस स्थापित ढंग को व्यक्त करता है।
theological_decisions:
- issue: दाऊद से की गई राजवंशीय प्रतिज्ञा की सशर्तता
  choice: राजवंश की निरंतरता को पुत्रों के चालचलन से जुड़ी स्पष्ट शर्त के साथ प्रस्तुत किया गया है।
  alternative: प्रतिज्ञा को पूर्णतः निरपेक्ष मानकर इस शर्त को केवल उसके अनुभव या आशीष तक सीमित समझना।
  rationale: רַק אִם के बाद पुत्रों के आचरण की शर्त सीधे दी गई है। अनुवाद इस पद के तनाव को बनाए रखता है और अन्य वाचा-पाठों के आधार पर यहाँ कोई व्यवस्थित धर्मवैज्ञानिक समाधान नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सार्वजनिक पाठ के योग्य रखी गई है। संबोधन में ‘हे’ और प्रार्थना की विनम्रता बनाए रखी गई है; उद्धरण के भीतर दाऊद के लिए स्वाभाविक ‘तुम’ रूप प्रयुक्त है। ‘चालचलन’ सामान्य पाठक के लिए ‘मार्ग’ के नैतिक मुहावरे को स्पष्ट करता है, जबकि ‘चलते रहे हो’ मूल रूपक को बचाए रखता है।
