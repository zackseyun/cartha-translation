  text: तब तू स्वर्ग में—अपने स्थिर निवास-स्थान में[a]—उनकी प्रार्थना और उनकी विनती सुनना, और उनके पक्ष में न्याय करना[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “अपने निवास-स्थान में।” इब्रानी अभिव्यक्ति एक स्थापित या निश्चित निवास-स्थान पर बल देती है।
    reason: lexical_alternative
  - marker: b
    text: या “उन्हें न्याय दिलाना” अथवा “उनके पक्ष का समर्थन करना।” इब्रानी में शाब्दिक रूप से “उनका न्याय करना” है—यह उनके न्यायिक पक्ष में कार्रवाई करने का मुहावरा है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁמַעְתָּ
  choice: तब तू ... सुनना
  rationale: यह क़ाल पूर्ण, द्वितीय पुरुष एकवचन रूप प्रार्थनात्मक क्रम में विनती या अनुरोध का भाव देता है। ‘तब’ पिछले सशर्त कथनों से इसका संबंध स्वाभाविक रूप से दिखाता है।
- source_word: הַשָּׁמַיִם
  choice: स्वर्ग में
  rationale: शाब्दिक रूप ‘आकाशों’ है, पर इस प्रार्थनात्मक प्रयोग में आशय परमेश्वर के स्वर्गीय क्षेत्र से है। यहाँ ‘में’ अर्थानुसार है; मूल में संबंध-सूचक शब्द स्पष्ट रूप से नहीं दिया गया।
- source_word: מְכוֹן שִׁבְתְּךָ
  choice: अपने स्थिर निवास-स्थान में
  rationale: מָכוֹן किसी स्थापित, दृढ़ या निश्चित स्थान का भाव रखता है। ‘स्थिर निवास-स्थान’ इस सूक्ष्म अर्थ को सामान्य हिन्दी में सुरक्षित रखता है।
- source_word: תְּפִלָּתָם
  choice: उनकी प्रार्थना
  rationale: תְּפִלָּה के सामान्य और स्वाभाविक अर्थ को व्यक्त करता है।
- source_word: תְּחִנָּתָם
  choice: उनकी विनती
  rationale: תְּחִנָּה अनुग्रह या दया के लिए की गई earnest plea को दर्शाता है; ‘विनती’ प्रार्थना से इसका हल्का अर्थभेद बनाए रखती है।
- source_word: וְעָשִׂיתָ מִשְׁפָּטָם
  choice: और उनके पक्ष में न्याय करना
  rationale: शाब्दिक रूप ‘उनका न्याय करना’ एक न्यायिक मुहावरा है, जिसका आशय उनके मामले में न्यायपूर्ण कार्रवाई करना या उनके पक्ष का समर्थन करना है। चुना हुआ रूप हिन्दी में स्वाभाविक रहते हुए इस विधिक भाव को रखता है।
theological_decisions:
- issue: परमेश्वर के स्वर्गीय निवास की स्थान-संबंधी भाषा
  choice: ‘स्वर्ग में—अपने स्थिर निवास-स्थान में’ की बाइबलीय छवि को बनाए रखा गया है।
  alternative: ‘अपने निवास-स्थान स्वर्ग से’
  rationale: मूल पद परमेश्वर के स्वर्गीय निवास की मन्दिर-प्रार्थना संबंधी भाषा का प्रयोग करता है। अनुवाद इस चित्रात्मक भाषा को बनाए रखता है, पर यह अतिरिक्त दावा नहीं जोड़ता कि परमेश्वर स्वर्ग में स्थानिक रूप से सीमित है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सहज हिन्दी अपनाई गई है। परमेश्वर को संबोधित करने के लिए एकवचन ‘तू’ रखा गया है, जो मूल के द्वितीय पुरुष एकवचन और हिन्दी बाइबल-प्रार्थना की प्रचलित शैली दोनों के अनुरूप है। युग्म ‘प्रार्थना और विनती’ मूल के दो निकट, किंतु भिन्न शब्दों को सुरक्षित रखता है।
