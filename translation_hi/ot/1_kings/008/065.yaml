source:
  edition: WLC
  text: וַ/יַּ֣עַשׂ שְׁלֹמֹ֣ה בָֽ/עֵת הַ/הִ֣יא אֶת הֶ/חָ֡ג וְ/כָל יִשְׂרָאֵ֣ל עִמּ/וֹ֩ קָהָ֨ל גָּד֜וֹל מִ/לְּב֥וֹא חֲמָ֣ת עַד נַ֣חַל מִצְרַ֗יִם לִ/פְנֵי֙ יְהוָ֣ה אֱלֹהֵ֔י/נוּ שִׁבְעַ֥ת יָמִ֖ים וְ/שִׁבְעַ֣ת יָמִ֑ים אַרְבָּעָ֥ה עָשָׂ֖ר יֽוֹם־׀־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/065.yaml
  text: At that time Solomon held the feast[a], and all Israel with him, a great assembly from Lebo-hamath to the Brook of Egypt, before Yahweh our God, seven days and seven days[b], fourteen days.
translation:
  language: hi
  text: उस समय सुलैमान ने पर्व मनाया, और उसके साथ समस्त इस्राएल था—लबो-हमात[a] से लेकर मिस्र के नाले[b] तक की एक विशाल सभा—हमारे परमेश्वर याहवे के सामने, सात दिन और सात दिन, कुल चौदह दिन।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘हमात के प्रवेश-स्थान से।’ इब्रानी को वर्णनात्मक सीमा-सूचक पदबंध अथवा ‘लबो-हमात’ स्थान-नाम के रूप में पढ़ा जा सकता है।
    reason: alternative_reading
  - marker: b
    text: या ‘मिस्र की वादी।’ इब्रानी शब्द प्रायः किसी बड़ी नदी के बजाय मौसमी जलधारा या उसके सूखे पाट को दर्शाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ ... אֶת הֶחָג
  choice: पर्व मनाया
  rationale: शाब्दिक रूप से क्रिया का अर्थ ‘किया/बनाया’ है, पर חָג के साथ यह पर्व का पालन या उत्सव मनाने का मुहावरा है। ‘पर्व मनाया’ आधुनिक हिन्दी में स्वाभाविक और अर्थ-सटीक है।
- source_word: הֶחָג
  choice: पर्व
  rationale: חָג तीर्थ-पर्व या धार्मिक उत्सव को सूचित करता है। ‘पर्व’ संक्षिप्त, गरिमापूर्ण और इस प्रसंग में सहज है।
- source_word: קָהָל גָּדוֹל
  choice: एक विशाल सभा
  rationale: קָהָל एकत्र समुदाय को दर्शाता है। ‘विशाल सभा’ इसके सामुदायिक और औपचारिक भाव को बनाए रखता है।
- source_word: מִלְּבוֹא חֲמָת
  choice: लबो-हमात से
  rationale: यह पदबंध स्थिर भौगोलिक नाम ‘लबो-हमात’ अथवा वर्णनात्मक ‘हमात के प्रवेश-स्थान’ के रूप में समझा जा सकता है। मुख्य पाठ में स्थान-नाम रखा गया और दूसरा पाठ फुटनोट में सुरक्षित है।
- source_word: נַחַל מִצְרַיִם
  choice: मिस्र के नाले
  rationale: נַחַל प्रायः मौसमी जलधारा, नाला या वादी को दर्शाता है, बड़ी नदी को नहीं। ‘नाला’ सामान्य हिन्दी पाठक के लिए स्पष्ट है और इसे नील नदी समझने की संभावना घटाता है।
- source_word: לִפְנֵי יְהוָה אֱלֹהֵינוּ
  choice: हमारे परमेश्वर याहवे के सामने
  rationale: לִפְנֵי का स्थानिक-संबंधपरक अर्थ ‘के सामने/उपस्थिति में’ है। शब्दक्रम को हिन्दी में स्वाभाविक रखते हुए वाचा का नाम स्पष्ट रखा गया है।
- source_word: יְהוָה
  choice: याहवे
  rationale: मूल पाठ में प्रयुक्त चतुरक्षरीय ईश-नाम को उपाधि से बदलने के बजाय हिन्दी में लिप्यंतरित किया गया है।
- source_word: שִׁבְעַת יָמִים וְשִׁבְעַת יָמִים
  choice: सात दिन और सात दिन
  rationale: मूल की जानबूझकर की गई पुनरावृत्ति दो लगातार सात-दिवसीय अवधियों को सामने रखती है। इसे केवल ‘चौदह दिन’ बनाकर समतल नहीं किया गया।
- source_word: אַרְבָּעָה עָשָׂר יוֹם
  choice: कुल चौदह दिन
  rationale: यह पूर्ववर्ती दो सात-दिवसीय अवधियों का सार है। ‘कुल’ हिन्दी में इसके सारात्मक संबंध को स्पष्ट करता है।
theological_decisions:
- issue: ईश-नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: प्रभु / यहोवा
  rationale: पद में वाचा का निजी नाम सीधे उपस्थित है; ‘याहवे’ उसका पारदर्शी हिन्दी लिप्यंतरण है और उसे किसी उपाधि में नहीं बदलता।
- issue: दो सात-दिवसीय अवधियों और कुल चौदह दिनों का संबंध
  choice: सात दिन और सात दिन, कुल चौदह दिन
  alternative: चौदह दिन
  rationale: पाठ दोनों सात-दिवसीय अवधियों को अलग-अलग कहकर फिर उनका कुल देता है। अनुवाद इस संरचना और संभावित धार्मिक कालक्रम को बिना अतिरिक्त व्याख्या के सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, गरिमापूर्ण और सार्वजनिक पाठ के अनुकूल रखी गई है। वाक्य-विन्यास को हिन्दी में सहज बनाने के लिए कर्ता-समूह को साथ रखा गया है, जबकि भौगोलिक विस्तार और ‘सात दिन और सात दिन’ की मूल पुनरावृत्ति सुरक्षित है। फुटनोट चिह्न उन्हीं शब्दों के बाद रखे गए हैं जिनसे उनके विकल्प संबंधित हैं।
