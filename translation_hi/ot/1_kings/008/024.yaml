  register: आधुनिक मानक हिन्दी; प्रार्थना के सीधे संबोधन में गरिमापूर्ण एकवचन ‘तू/तेरा’ रखा गया है। वाक्य को स्वाभाविक बनाने के साथ इब्रानी की ‘मुँह’ और ‘हाथ’ वाली समानांतर छवि सुरक्षित रखी गई है।
