  yaml_path: translation/ot/1_kings/008/024.yaml
  text: who have kept for your servant David my father what you spoke to him[a]; you spoke with your mouth, and with your hand you have fulfilled it[b], as it is this day.
translation:
  language: hi
  text: जिसने अपने सेवक, मेरे पिता दाऊद, के लिए जो कुछ तूने उससे कहा था, उसे निभाया[a]; तूने अपने मुँह से कहा और अपने हाथ से उसे पूरा किया[b], जैसा आज है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अपने सेवक, मेरे पिता दाऊद, के प्रति जो कुछ तूने उससे कहा था, उसे निभाया।”
    reason: lexical_alternative
  - marker: b
    text: मूल इब्रानी में शाब्दिक रूप से, “तूने अपने मुँह से कहा और अपने हाथ से उसे पूरा किया”—अर्थात परमेश्वर ने जो कहा, उसे कार्य में भी पूरा किया।
    reason: cultural_note
lexical_decisions:
- source_word: שָׁמַרְתָּ
  choice: पूरी की
  rationale: यहाँ क्रिया परमेश्वर के दाऊद से कही हुई बात को निभाने के अर्थ में है। स्वाभाविक हिन्दी में ‘बात पूरी की’ इस संदर्भ को स्पष्ट करता है; आगे מִלֵּאתָ के लिए ‘पूरा किया’ रखकर मूल की पुनरुक्ति और बल भी बना रहता है।
- source_word: לְעַבְדְּךָ
  choice: अपने सेवक के लिए
  rationale: לְ के ‘के लिए’ और ‘से’ दोनों संभावित संबंध हैं। मुख्य पाठ में वचन दाऊद के हित में निभाए जाने का अर्थ लिया गया है, जबकि दूसरा विकल्प पादटिप्पणी में रखा गया है।
- source_word: דָּוִד אָבִי
  choice: मेरे पिता दाऊद
  rationale: यह आधुनिक हिन्दी में स्वाभाविक है और वक्ता के दाऊद से संबंध को स्पष्ट रखता है।
- source_word: אֵת אֲשֶׁר דִּבַּרְתָּ לוֹ
  choice: वह बात जो तूने उससे कही थी
  rationale: ‘कही थी’ मूल के דִּבַּרְתָּ को सीधे व्यक्त करता है और इसे व्याख्यात्मक रूप से केवल ‘प्रतिज्ञा की थी’ नहीं बनाता।
- source_word: וַתְּדַבֵּר בְּפִיךָ
  choice: तूने अपने मुँह से कहा
  rationale: मूल की सजीव देहात्मक छवि तथा ‘मुँह’ और ‘हाथ’ का समानांतर विरोध सुरक्षित रखा गया है।
- source_word: וּבְיָדְךָ מִלֵּאתָ
  choice: अपने हाथ से उसे पूरा किया
  rationale: מִלֵּאתָ कही हुई बात को कार्यरूप में पूर्ण करने को दर्शाता है। ‘अपने हाथ से’ मूल की ठोस छवि बनाए रखता है।
- source_word: כַּיּוֹם הַזֶּה
  choice: जैसा आज दिखाई दे रहा है
  rationale: यह इब्रानी मुहावरा वर्तमान में प्रत्यक्ष सिद्ध हुई पूर्ति की ओर संकेत करता है; यह हिन्दी रूप उसका अर्थ स्वाभाविक ढंग से देता है।
theological_decisions:
- issue: परमेश्वर के लिए ‘मुँह’ और ‘हाथ’ की देहात्मक भाषा
  choice: मुख्य पाठ में दोनों ठोस अभिव्यक्तियाँ बनाए रखना
  alternative: ‘तूने कहा और उसे कर दिखाया’ जैसा अमूर्त भावानुवाद
  rationale: मूल पाठ परमेश्वर के कथन और कार्य को जानबूझकर ‘मुँह’ तथा ‘हाथ’ की समानांतर छवियों में रखता है। इन्हें बनाए रखने से पद का अलंकार और धार्मिक तनाव दोनों सुरक्षित रहते हैं।
