  to: और अपने दास और अपनी प्रजा इस्राएल की विनती सुनिए, जब वे इस स्थान की दिशा में प्रार्थना करें[a]। और स्वर्ग में, जो आपका निवास-स्थान है, सुनिए[b]; सुनिए और क्षमा कीजिए।
