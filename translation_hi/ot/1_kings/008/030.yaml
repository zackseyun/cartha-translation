id: 1KI.8.30
reference: 1 Kings 8:30
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/שָׁ֨מַעְתָּ֜ אֶל תְּחִנַּ֤ת עַבְדְּ/ךָ֙ וְ/עַמְּ/ךָ֣ יִשְׂרָאֵ֔ל אֲשֶׁ֥ר יִֽתְפַּֽלְל֖וּ אֶל הַ/מָּק֣וֹם הַ/זֶּ֑ה וְ֠/אַתָּה תִּשְׁמַ֞ע אֶל מְק֤וֹם שִׁבְתְּ/ךָ֙ אֶל הַ/שָּׁמַ֔יִם וְ/שָׁמַעְתָּ֖ וְ/סָלָֽחְתָּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/030.yaml
  text: And hear the plea of your servant and of your people Israel when they pray toward this place[a]. And hear in heaven, the place of your dwelling[b]; hear and forgive.
translation:
  language: hi
  text: और अपने दास और अपनी प्रजा इस्राएल की विनती सुनिए, जब वे इस स्थान की दिशा में प्रार्थना करें[a]। और स्वर्ग में, जो आपका निवास-स्थान है, सुनिए[b]; सुनिए और क्षमा कीजिए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “इस स्थान को लक्ष्य करके प्रार्थना करें।” इब्रानी पदबंध का अधिक शाब्दिक अर्थ “इस स्थान की ओर” है।
    reason: lexical_alternative
  - marker: b
    text: या, “स्वर्ग में स्थित अपने निवास-स्थान में सुनिए।”
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּחִנַּת
  choice: विनती
  rationale: यह शब्द कृपा या दया पाने के लिए की गई earnest याचना को व्यक्त करता है। ‘विनती’ आधुनिक हिन्दी में स्वाभाविक है और प्रार्थना की नम्र तथा आग्रहपूर्ण मुद्रा बनाए रखता है।
- source_word: עַבְדְּךָ
  choice: अपने दास
  rationale: राजकीय प्रार्थना में यह परमेश्वर के सामने अधीनता और नम्रता का आत्म-वर्णन है। ‘दास’ इस भाव और बाइबिलीय गरिमा दोनों को बनाए रखता है।
- source_word: עַמְּךָ יִשְׂרָאֵל
  choice: अपनी प्रजा इस्राएल
  rationale: यह इस्राएल को परमेश्वर की प्रजा के रूप में पहचानता है। ‘प्रजा’ सामूहिक और वाचा-संबंधी भाव को सहज हिन्दी में व्यक्त करता है।
- source_word: יִתְפַּלְלוּ
  choice: प्रार्थना करें
  rationale: हित्पएल रूप यहाँ प्रार्थना करने के सामान्य अर्थ में है; ‘प्रार्थना करें’ इसका स्पष्ट और स्वाभाविक हिन्दी रूप है।
- source_word: אֶל הַמָּקוֹם הַזֶּה
  choice: इस स्थान की ओर
  rationale: אֶל दिशात्मक संबंध प्रकट करता है। मन्दिर की दिशा में की जाने वाली प्रार्थना के प्रसंग में ‘इस स्थान की ओर’ अर्थ को बिना अनावश्यक विस्तार के सुरक्षित रखता है।
- source_word: מְקוֹם שִׁבְתְּךָ
  choice: अपने निवास-स्थान
  rationale: यह इब्रानी संबंध-पदबंध को संक्षिप्त, गरिमापूर्ण और सहज हिन्दी में व्यक्त करता है।
- source_word: אֶל הַשָּׁמַיִם
  choice: स्वर्ग में
  rationale: यद्यपि אֶל का मूल दिशात्मक अर्थ ‘की ओर’ है, यहाँ ‘सुनने’ और परमेश्वर के निवास-स्थान के साथ इसका भाव स्थानवाचक है। ‘स्वर्ग में’ हिन्दी में स्वाभाविक है।
- source_word: וְשָׁמַעְתָּ
  choice: सुनिए
  rationale: यह केवल ध्वनि सुनने का नहीं, प्रार्थना पर ध्यान देकर उत्तर देने का भाव रखता है। ‘सुनिए’ प्रार्थनात्मक आग्रह और मूल की पुनरावृत्ति दोनों बनाए रखता है।
- source_word: וְסָלָחְתָּ
  choice: क्षमा कीजिए
  rationale: סלח परमेश्वर द्वारा क्षमा किए जाने का मानक क्रियापद है। ‘क्षमा कीजिए’ इसका स्पष्ट और धर्मवैज्ञानिक रूप से पारदर्शी अनुवाद है।
theological_decisions:
- issue: मन्दिर की ओर प्रार्थना और स्वर्ग में परमेश्वर का निवास
  choice: मन्दिर को प्रार्थना की दिशा के रूप में और स्वर्ग को परमेश्वर के निवास-स्थान के रूप में साथ-साथ रखा गया है।
  alternative: इसे अधिक व्याख्यात्मक रूप से ‘जब वे इस मन्दिर में प्रार्थना करें’ या ‘स्वर्ग से सुनिए’ कहना।
  rationale: मूल पद पृथ्वी पर स्थित मन्दिर की ओर उन्मुख प्रार्थना और स्वर्ग में परमेश्वर के निवास के बीच का तनाव जानबूझकर बनाए रखता है। अनुवाद किसी एक पक्ष को घटाता या दोनों को मिला नहीं देता।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, प्रार्थनात्मक रूप अपनाया गया है। परमेश्वर के लिए आदरसूचक ‘आप’ और संबोधनात्मक क्रियाएँ प्रयोग हुई हैं। मूल में ‘सुनना’ की पुनरावृत्ति अर्थपूर्ण होने के कारण बनाए रखी गई है; वाक्यरचना को सामान्य पाठक के लिए सहज रखा गया है।
