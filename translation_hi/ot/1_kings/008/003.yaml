  rationale: निश्चित बहुवचन का सीधा और प्रचलित हिन्दी समतुल्य।
- source_word: וַיִּשְׂאוּ
  choice: उठाकर ले चले
  rationale: נשׂא में निहित उठाने और ढोकर ले जाने—दोनों भावों को यहाँ स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: אֶת הָאָרוֹן
  choice: सन्दूक
  rationale: मूल पद में केवल निश्चित संज्ञा 'सन्दूक' है; 'वाचा का सन्दूक' जोड़ना प्रसंगानुकूल होते हुए भी इस पद के शब्दों से अधिक होगा।
