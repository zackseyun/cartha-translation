reference: 1 Kings 8:53
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: כִּֽי אַתָּ֞ה הִבְדַּלְתָּ֤/ם לְ/ךָ֙ לְֽ/נַחֲלָ֔ה מִ/כֹּ֖ל עַמֵּ֣י הָ/אָ֑רֶץ כַּ/אֲשֶׁ֨ר דִּבַּ֜רְתָּ בְּ/יַ֣ד מֹשֶׁ֣ה עַבְדֶּ֗/ךָ בְּ/הוֹצִיאֲ/ךָ֧ אֶת אֲבֹתֵ֛י/נוּ מִ/מִּצְרַ֖יִם אֲדֹנָ֥/י יְהוִֽה־׀־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/053.yaml
  text: For you set them apart for yourself as an inheritance from all the peoples of the earth[a], just as you spoke by the hand of Moses your servant when you brought our fathers out from Egypt[c][b], Lord GOD.
translation:
  language: hi
  text: क्योंकि आपने उन्हें पृथ्वी की सब जातियों में से अपने लिए विरासत के रूप में अलग किया है, जैसा कि आपने अपने सेवक मूसा के द्वारा[a] कहा था, जब आप हमारे पुरखाओं[b] को मिस्र से निकाल लाए थे, हे प्रभु याहवे[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “अपने सेवक मूसा के हाथ से।”
    reason: इब्रानी अभिकरण-मुहावरे का शाब्दिक रूप बताने के लिए।
  - marker: b
    text: या “हमारे पूर्वजों।”
    reason: אָבוֹת के एक स्वाभाविक, अधिक समावेशी हिन्दी विकल्प को दर्ज करने के लिए।
  - marker: c
    text: 'इब्रानी: “अदोनाय याहवे”; यहाँ पहला शब्द उपाधि “प्रभु” है और दूसरा परमेश्वर का नाम है।'
    reason: मूल में साथ आए दिव्य उपाधि और दिव्य नाम दोनों को स्पष्ट करने के लिए।
lexical_decisions:
- source_word: הִבְדַּלְתָּם
  choice: उन्हें ... अलग करके
  rationale: हिफ़ील रूप का अर्थ ‘अलग करना’ है। यह चुनाव इस्राएल को अन्य लोगों से अलग किए जाने को स्पष्ट और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: לְךָ לְנַחֲלָה
  choice: अपने लिए विरासत बनाया है
  rationale: यह पदबंध परमेश्वर के अपने अधिकार में आए विरासती भाग या निज धन का भाव रखता है। ‘अपने लिए विरासत’ वाचा-संबंधी भाषा को बनाए रखता है, जबकि ‘बनाया है’ हिन्दी वाक्य को स्वाभाविक करता है।
- source_word: מִכֹּל עַמֵּי הָאָרֶץ
  choice: पृथ्वी के सब लोगों में से
  rationale: यहाँ הָאָרֶץ का आशय केवल किसी स्थानीय भूभाग से नहीं, बल्कि संसार के लोगों से व्यापक तुलना है। ‘में से’ अलग किए जाने के स्रोत-समूह को व्यक्त करता है।
- source_word: כַּאֲשֶׁר
  choice: ठीक वैसे ही जैसे
  rationale: यह परमेश्वर के कार्य और मूसा के द्वारा पहले कही गई बात के बीच अनुरूपता दर्शाता है।
- source_word: בְּיַד מֹשֶׁה עַבְדֶּךָ
  choice: अपने सेवक मूसा के द्वारा
  rationale: शाब्दिक ‘मूसा के हाथ से’ मध्यस्थता का इब्रानी मुहावरा है। ‘मूसा के द्वारा’ उसी अभिकरण को आधुनिक हिन्दी में स्वाभाविक रूप से व्यक्त करता है; ‘सेवक’ सम्मानसूचक संदर्भ के अनुकूल है।
- source_word: בְּהוֹצִיאֲךָ
  choice: उस समय ... जब आप ... निकाल लाए थे
  rationale: בְּ सहित क्रियार्थक संज्ञा यहाँ समयगत परिस्थिति बताती है। यह हिन्दी रूप उस समयगत संबंध को स्पष्ट करता है।
- source_word: אֶת אֲבֹתֵינוּ
  choice: हमारे पुरखाओं
  rationale: אָבוֹת पूर्व पीढ़ियों के पितृपुरुषों को सूचित करता है। ‘पुरखा’ आधुनिक हिन्दी में समझने योग्य है और मूल के पुल्लिंग रूप को बनाए रखता है।
- source_word: מִמִּצְרַיִם
  choice: मिस्र से
  rationale: ‘निकाल लाए’ के साथ ‘मिस्र से’ निर्गमन की दिशा और स्रोत को स्वाभाविक हिन्दी में पर्याप्त रूप से व्यक्त करता है।
- source_word: אֲדֹנָי יְהוִה
  choice: प्रभु यहोवा
  rationale: 'यह दोनों इब्रानी तत्वों को अलग-अलग दर्शाता है: אֲדֹנָי को ‘प्रभु’ और वाचा के नाम יהוה को प्रचलित हिन्दी रूप ‘यहोवा’ से।'
theological_decisions:
- issue: לְנַחֲלָה में परमेश्वर की ‘विरासत’ के रूप में लोगों का वर्णन
  choice: अपने लिए विरासत
  alternative: अपनी निज सम्पत्ति
  rationale: ‘विरासत’ נַחֲלָה की वाचा-संबंधी और आबंटित भाग वाली धारणा को सुरक्षित रखती है। केवल ‘सम्पत्ति’ कहना इस पारिभाषिक प्रतिध्वनि को कम कर सकता है।
- issue: अंतिम संबोधन אֲדֹנָי יְהוִה
  choice: प्रभु यहोवा
  alternative: प्रभु परमेश्वर
  rationale: मूल पाठ में सामान्य ‘परमेश्वर’ नहीं, बल्कि दिव्य नाम יהוה है। ‘प्रभु यहोवा’ दोनों पदों को सुरक्षित रखता है और उन्हें एक ही उपाधि में नहीं मिलाता।
- issue: परमेश्वर के लिए हिन्दी संबोधन
  choice: आपने/आप
  alternative: तूने/तू
  rationale: मूल में एकवचन द्वितीय पुरुष है, पर हिन्दी में ‘आप’ आदरपूर्ण एकवचन के रूप में वही संदर्भ निभाता है। यह आधुनिक, dignified प्रार्थना-भाषा में स्वाभाविक है और निकटता या अधिकार के किसी विशेष धर्मसैद्धांतिक अर्थ को आरोपित नहीं करता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, आदरपूर्ण और प्रार्थनात्मक रखी गई है। वाक्य की इब्रानी संरचना और वाचा-संबंधी ‘विरासत’ की छवि सुरक्षित रखते हुए कठिन अभिकरण-मुहावरे को मुख्य पाठ में स्वाभाविक हिन्दी बनाया गया है।
