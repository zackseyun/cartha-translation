  yaml_path: translation/ot/1_kings/008/060.yaml
  text: so that all the peoples of the earth may know that the LORD, he is God; there is no other.
translation:
  language: hi
  text: ताकि पृथ्वी के सभी लोग जान लें कि यहोवा ही परमेश्वर है; और कोई नहीं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כָּל עַמֵּי הָאָרֶץ
  choice: पृथ्वी के सभी लोग
  rationale: इब्रानी बहुवचन ‘पृथ्वी के सभी जनसमूहों/लोगों’ को सहज आधुनिक हिन्दी में व्यक्त करता है और कथन की सार्वभौमिकता बनाए रखता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: परमेश्वर के विशिष्ट इब्रानी नाम को हिन्दी में प्रचलित नामरूप से प्रस्तुत किया गया है, न कि उसे सामान्य उपाधि ‘प्रभु’ में बदलकर।
- source_word: הוּא הָאֱלֹהִים
  choice: ही परमेश्वर है
  rationale: स्वतंत्र सर्वनाम הוּא के बल को हिन्दी के निश्चयार्थक ‘ही’ से स्वाभाविक रूप में सुरक्षित रखा गया है।
- source_word: אֵין עוֹד
  choice: और कोई नहीं
  rationale: संक्षिप्त इब्रानी निषेध की संक्षिप्तता और प्रबल एकेश्वरवादी घोषणा को बनाए रखता है; संदर्भ से ‘कोई और परमेश्वर’ अभिप्रेत है।
theological_decisions:
- issue: यहोवा की परमेश्वर के रूप में अनन्यता
  choice: यहोवा ही परमेश्वर है; और कोई नहीं
  alternative: यहोवा परमेश्वर है; उसके सिवा कोई और परमेश्वर नहीं
  rationale: चुना हुआ पाठ इब्रानी के emphatic pronoun और संक्षिप्त אֵין עוֹד दोनों को बिना अनावश्यक विस्तार के सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। वाक्य की उद्देश्यसूचक संरचना ‘ताकि’ से और मूल की जोरदार, संक्षिप्त समाप्ति अर्धविराम के बाद सुरक्षित रखी गई है।
