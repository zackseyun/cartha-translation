  text: एतानीम के महीने में, अर्थात् सातवें महीने में, पर्व के समय इस्राएल के सब पुरुष राजा सुलैमान के सामने इकट्ठे हुए।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקָּהֲלוּ
  choice: इकट्ठे हुए
  rationale: निफ़अल क्रिया का स्वाभाविक और अर्थसंगत हिन्दी रूप; सभा के लिए एकत्र होने का भाव रखता है।
- source_word: כָּל אִישׁ יִשְׂרָאֵל
  choice: इस्राएल के सब पुरुष
  rationale: אִישׁ के पुरुषवाचक अर्थ को बनाए रखता है और इसे व्यापक 'लोग' में नहीं बदलता।
- source_word: בְּיֶרַח הָאֵתָנִים
  choice: एतानीम के महीने में
  rationale: प्राचीन महीने के नाम को लिप्यंतरित किया गया है; יֶרַח का अर्थ 'महीना' है।
- source_word: בֶּחָג
  choice: पर्व के समय
  rationale: निश्चित पर्व का संकेत देता है; इसी पद में उसका विशिष्ट नाम नहीं दिया गया, इसलिए अस्पष्टता सुरक्षित रखी गई है।
- source_word: אֶל הַמֶּלֶךְ שְׁלֹמֹה
  choice: राजा सुलैमान के सामने
  rationale: सभा के राजकीय उपस्थितिस्थल का स्वाभाविक हिन्दी निरूपण; अंग्रेज़ी परामर्श-पाठ के 'before' के अनुरूप, बिना केवल दिशा-सूचक 'की ओर' कहे।
