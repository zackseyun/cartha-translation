base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/018.yaml
  text: But Yahweh said to David my father[a], ‘Because it was in your heart to build a house for my name, you did well that it was in your heart.’
translation:
  language: hi
  text: परन्तु यहोवा ने मेरे पिता दाऊद से कहा, “क्योंकि तेरे मन में मेरे नाम के लिए एक घर[a] बनाने की इच्छा थी, तूने अच्छा किया कि तेरे मन में यह बात थी।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “मेरे नाम के लिए एक मन्दिर बनाने की इच्छा थी।” हिब्रू में शाब्दिक रूप से “मेरे नाम के लिए एक घर बनाने” है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: कहा
  rationale: אמר के सामान्य कथात्मक रूप के लिए आधुनिक हिन्दी में स्वाभाविक और सटीक क्रिया।
- source_word: יְהוָה
  choice: यहोवा
  rationale: परमेश्वर के व्यक्तिगत नाम को हिन्दी की प्रचलित बाइबलीय लिप्यंतरण-परम्परा में नाम के रूप में सुरक्षित रखता है, उपाधि से नहीं बदलता।
- source_word: אָבִי
  choice: मेरे पिता
  rationale: प्रथम पुरुष एकवचन प्रत्यय के अनुसार सुलैमान दाऊद को अपना पिता कहता है।
- source_word: יַעַן אֲשֶׁר
  choice: तेरे मन में ... इच्छा थी
  rationale: कारणसूचक संरचना को अगले अनुमोदन-वाक्य से स्वाभाविक हिन्दी में जोड़ा गया है; आशय कि भवन बनाना दाऊद का अंतःकरणगत संकल्प था।
- source_word: הָיָה עִם לְבָבְךָ
  choice: तेरे मन में ... इच्छा थी / यह बात तेरे मन में थी
  rationale: हिब्रू के ‘हृदय के साथ होना’ मुहावरे को समझने योग्य हिन्दी में व्यक्त करते हुए ‘मन’ का रूपक और पुनरुक्ति बनाए रखी गई है।
- source_word: לִבְנוֹת בַּיִת
  choice: एक भवन बनाने
  rationale: בַּיִת का मूल अर्थ ‘घर/भवन’ है; यहाँ सन्दर्भ मन्दिर का है। ‘भवन’ हिन्दी में परमेश्वर के लिए बनाए जाने वाले पवित्र गृह का अर्थ सहज देता है और मूल रूपक बचाता है।
- source_word: לִשְׁמִי
  choice: मेरे नाम के लिए
  rationale: परमेश्वर के नाम से सम्बद्ध पवित्रस्थान की वाचाई अभिव्यक्ति को व्याख्यात्मक विस्तार के बिना सुरक्षित रखता है।
- source_word: הֱטִיבֹתָ
  choice: तूने अच्छा किया
  rationale: יטב के हिफ़ील रूप में व्यक्त अनुमोदन का संक्षिप्त और स्वाभाविक हिन्दी अनुवाद।
- source_word: כִּי הָיָה עִם לְבָבֶךָ
  choice: कि यह बात तेरे मन में थी
  rationale: כִּי को यहाँ अनुमोदन की विषयवस्तु बताने वाले ‘कि’ के रूप में लिया गया है; इससे मूल की पुनरुक्ति और व्याख्यात्मक बल दोनों बने रहते हैं।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: नाम को ‘प्रभु’ जैसी उपाधि से प्रतिस्थापित न करके व्यक्तिगत ईश्वरीय नाम के रूप में रखा गया है; ‘यहोवा’ हिन्दी पाठकों में व्यापक रूप से पहचाना जाने वाला रूप है।
- issue: בַּיִת को शाब्दिक ‘भवन’ कहना या सन्दर्भानुसार ‘मन्दिर’
  choice: भवन
  alternative: मन्दिर
  rationale: मूल पाठ ‘घर/भवन’ कहता है। सन्दर्भ से मन्दिर स्पष्ट है, इसलिए मूल की धार्मिक अभिव्यक्ति को सुरक्षित रखा गया और विकल्प को पादटिप्पणी में बताया गया।
- issue: दाऊद की इच्छा पर ईश्वरीय अनुमोदन का स्वरूप
  choice: इच्छा/मन के संकल्प का अनुमोदन
  alternative: मानो दाऊद ने भवन बना ही दिया हो, ऐसा कर्म का अनुमोदन
  rationale: पद दो बार दाऊद के मन में बात होने पर बल देता है; अनुवाद इस तनाव को बनाए रखता है कि इच्छा अच्छी थी, यद्यपि निर्माण उसने नहीं किया।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सामान्य-पाठक-सुलभ रूप। दाऊद को सीधे सम्बोधन में ‘तेरे/तूने’ रखा गया है, जो हिब्रू के एकवचन सम्बोधन को स्पष्ट करता है। मुख्य पाठ में ‘भवन’ मूल के ‘घर’ और सन्दर्भगत ‘मन्दिर’ के बीच स्वाभाविक संतुलन देता है।
