  text: בַּ/יּ֤וֹם הַ/שְּׁמִינִי֙ שִׁלַּ֣ח אֶת הָ/עָ֔ם וַֽ/יְבָרֲכ֖וּ אֶת הַ/מֶּ֑לֶךְ וַ/יֵּלְכ֣וּ לְ/אָהֳלֵי/הֶ֗ם שְׂמֵחִים֙ וְ/ט֣וֹבֵי לֵ֔ב עַ֣ל כָּל הַ/טּוֹבָ֗ה אֲשֶׁ֨ר עָשָׂ֤ה יְהוָה֙ לְ/דָוִ֣ד עַבְדּ֔/וֹ וּ/לְ/יִשְׂרָאֵ֖ל עַמּֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/066.yaml
  text: On the eighth day he sent the people away[a], and they blessed the king and went to their tents, rejoicing and glad of heart because of all the good that Yahweh had done for David his servant and for Israel his people.
translation:
  language: hi
  text: आठवें दिन उसने लोगों को विदा किया। उन्होंने राजा को आशीर्वाद दिया और आनंदित व मन से प्रसन्न होकर अपने तंबुओं[a] की ओर चले गए, क्योंकि याहवे ने अपने सेवक दाऊद और अपनी प्रजा इस्राएल के लिए बहुत भलाई की थी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘अपने घरों को’; शाब्दिक अर्थ, ‘अपने तंबुओं की ओर।’
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיּוֹם הַשְּׁמִינִי
  choice: आठवें दिन
  rationale: काल-सूचक पद का सीधा अनुवाद किया गया है; ‘पर्व के’ संदर्भ से समझा जा सकता है, पर इस पद में स्पष्ट नहीं है।
- source_word: שִׁלַּח אֶת הָעָם
  choice: उसने लोगों को विदा किया
  rationale: पिएल रूप यहाँ लोगों को प्रस्थान करने की अनुमति देकर विदा करने का भाव देता है; यह आधुनिक हिन्दी में स्वाभाविक है।
- source_word: וַיְבָרֲכוּ אֶת הַמֶּלֶךְ
  choice: उन्होंने राजा को आशीर्वाद दिया
  rationale: ברך का मूल अर्थ ‘आशीर्वाद देना’ सुरक्षित रखा गया है; संदर्भ में विदाई की शुभकामना भी निहित हो सकती है।
- source_word: לְאָהֳלֵיהֶם
  choice: अपने तंबुओं को
  rationale: इब्रानी का शाब्दिक बिंब सुरक्षित रखा गया है; ‘अपने घरों को’ मुहावरेदार विकल्प के रूप में पादटिप्पणी में दिया गया है।
- source_word: שְׂמֵחִים וְטוֹבֵי לֵב
  choice: आनन्दित और मन से प्रसन्न
  rationale: पहला पद सक्रिय हर्ष और दूसरा भीतरी प्रसन्नता व्यक्त करता है; ‘मन’ द्वारा इब्रानी हृदय-वाची मुहावरे का स्वाभाविक हिन्दी रूप दिया गया है।
- source_word: עַל כָּל הַטּוֹבָה
  choice: उस सारी भलाई के कारण
  rationale: עַל यहाँ उनके आनन्द का कारण बताता है, और הַטּוֹבָה परमेश्वर के किए हुए समस्त हितकारी कार्य को व्यापक रूप में व्यक्त करता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिन्दी बाइबलीय परंपरा में प्रचलित व्यक्तिगत नाम ‘यहोवा’ द्वारा चतुराक्षरीय दिव्य नाम को उपाधि से प्रतिस्थापित किए बिना प्रस्तुत किया गया है।
- source_word: לְדָוִד עַבְדּוֹ
  choice: अपने सेवक दाऊद के लिए
  rationale: राजकीय-वाचागत संदर्भ में עבד के लिए ‘सेवक’ उपयुक्त है और अनावश्यक दासता-संबंधी अर्थछाया से बचाता है।
- source_word: וּלְיִשְׂרָאֵל עַמּוֹ
  choice: और अपनी प्रजा इस्राएल के लिए
  rationale: वाचागत संबंध को स्पष्ट और स्वाभाविक हिन्दी में रखा गया है।
theological_decisions:
- issue: दिव्य नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल में व्यक्तिगत दिव्य नाम है, इसलिए ‘प्रभु’ जैसी उपाधि नहीं रखी गई। ‘यहोवा’ आधुनिक हिन्दी पाठकों में अधिक पहचाना जाने वाला रूप है, जबकि ‘याहवे’ स्रोत-उच्चारण का निकटतर वैकल्पिक लिप्यंतरण है।
- issue: וַיְבָרֲכוּ में लोगों द्वारा राजा को आशीर्वाद देना
  choice: राजा को आशीर्वाद दिया
  alternative: राजा को विदाई की शुभकामना दी
  rationale: मूल क्रिया का सामान्य धार्मिक और सामाजिक अर्थ सुरक्षित रखा गया है; केवल विदाई-अभिवादन मानकर अर्थ को संकुचित नहीं किया गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। वाक्यों को हिन्दी की सहज लय के लिए विभाजित किया गया है, जबकि मूल के कारण-संबंध, हर्ष की दोहरी अभिव्यक्ति और वाचागत पदावली सुरक्षित हैं।
