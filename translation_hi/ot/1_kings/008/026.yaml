  text: And now[a], God of Israel[b], please let your word that you spoke to your servant David my father be confirmed.
translation:
  language: hi
  text: और अब, हे इस्राएल के परमेश्वर, कृपया आपके वे वचन[a] सत्य सिद्ध हों[b], जो आपने अपने सेवक, मेरे पिता दाऊद से कहे थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से “आपके वचन”; यहाँ बहुवचन उन बातों को सूचित करता है जो परमेश्वर ने दाऊद से कही थीं।
    reason: lexical_alternative
  - marker: b
    text: या “स्थिर हों,” “स्थापित हों,” अथवा अधिक भावार्थपूर्ण रूप में “पूरे हों।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: और अब
  rationale: संयोजक और कालवाचक क्रियाविशेषण दोनों को रखते हुए सुलैमान की प्रार्थना की निरंतरता प्रकट करता है।
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: हे इस्राएल के परमेश्वर
  rationale: रचना-संबंध को स्वाभाविक हिन्दी संबोधन में व्यक्त करता है; ‘हे’ प्रार्थना में स्पष्ट और गरिमापूर्ण है।
- source_word: יֵאָמֶן נָא
  choice: कृपया ... दृढ़ सिद्ध हों
  rationale: निफ़अल रूप में निहित दृढ़ता और सत्य प्रमाणित होने के भाव को, तथा נָא की विनती को सुरक्षित रखता है।
- source_word: דבריך
  choice: आपके वे वचन
  rationale: मसोरेटिक पाठ के बहुवचन को बनाए रखता है; ‘वे’ आगे आने वाले संबंधवाचक उपवाक्य से स्वाभाविक संबंध बनाता है।
- source_word: אֲשֶׁר דִּבַּרְתָּ
  choice: जो आपने ... कहे थे
  rationale: ‘बोलना/कहना’ के सामान्य अर्थ को सीधे व्यक्त करता है और ‘प्रतिज्ञा’ जोड़कर अर्थ को पहले से निर्धारित नहीं करता।
- source_word: לְעַבְדְּךָ
  choice: अपने सेवक ... से
  rationale: עבד के राजकीय और भक्तिपरक संबंध को प्रसंगानुकूल ‘सेवक’ व्यक्त करता है।
- source_word: דָּוִד אָבִי
  choice: मेरे पिता दाऊद
  rationale: आधुनिक हिन्दी में स्वाभाविक शब्दक्रम अपनाता है और पारिवारिक संबंध स्पष्ट रखता है।
theological_decisions:
- issue: दाऊद से कहे गए परमेश्वर के वचनों के विषय में विनती का स्वरूप
  choice: वचन ‘दृढ़ सिद्ध हों’
  alternative: वचन ‘पूरे हों’ या ‘सत्य प्रमाणित हों’
  rationale: यह चयन אמן धातु की दृढ़ता/विश्वसनीयता को बनाए रखते हुए पूर्ति का आशय खुला रखता है और पाठ में कोई अतिरिक्त धर्मसैद्धांतिक निष्कर्ष नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण प्रार्थना-रजिस्टर; परमेश्वर के लिए आदरसूचक ‘आप’ प्रयुक्त है। वाक्यरचना सहज रखी गई है, जबकि मूल के बहुवचन और אמן की अर्थ-व्याप्ति सुरक्षित हैं।
