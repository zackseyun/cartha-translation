base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/033.yaml
  text: When your people Israel are struck down before an enemy because they have sinned against you[a], and they turn back to you and confess your name and pray and plead with you in this house,
translation:
  language: hi
  text: जब आपकी प्रजा इस्राएल आपके विरुद्ध पाप करने के कारण किसी शत्रु के सामने पराजित हो जाए, और फिर आपकी ओर लौटे, आपके नाम का अंगीकार करे[a], और इस भवन में आपसे प्रार्थना और विनती करे,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “आपके नाम की स्तुति करे” या “आपके नाम का धन्यवाद करे।” इब्रानी क्रिया प्रसंग के अनुसार अंगीकार करने, स्तुति करने अथवा धन्यवाद देने का अर्थ दे सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּהִנָּגֵף
  choice: पराजित हो जाए
  rationale: निफ़अल रूप सैन्य प्रसंग में शत्रु के सामने हारने या परास्त होने को व्यक्त करता है; यह सहज आधुनिक हिन्दी में निष्क्रिय भाव बनाए रखता है।
- source_word: עַמְּךָ יִשְׂרָאֵל
  choice: आपकी प्रजा इस्राएल
  rationale: सम्बन्धसूचक भाव और इस्राएल के रूप में प्रजा की पहचान दोनों सुरक्षित रहते हैं।
- source_word: לִפְנֵי אוֹיֵב
  choice: किसी शत्रु के सामने
  rationale: לִפְנֵי का मूल स्थानगत भाव सुरक्षित है और बिना निश्चित उपपद वाले אוֹיֵב के लिए ‘किसी शत्रु’ स्वाभाविक है।
- source_word: אֲשֶׁר יֶחֶטְאוּ לָךְ
  choice: आपके विरुद्ध पाप करने के कारण
  rationale: यहाँ सम्बन्धवाचक खण्ड पराजय का कारण बताता है; לָךְ का प्रसंगगत अर्थ ‘आपके विरुद्ध’ है।
- source_word: וְשָׁבוּ אֵלֶיךָ
  choice: और फिर आपकी ओर लौटे
  rationale: שׁוּב के लौटने या मुड़ने के रूपक को रखता है, पर शब्द में स्पष्ट न किए गए अधिक विस्तृत धर्मवैज्ञानिक अर्थ को नहीं जोड़ता।
- source_word: וְהוֹדוּ אֶת שְׁמֶךָ
  choice: आपके नाम को माने
  rationale: ידה के हिफ़ील रूप में स्वीकार करना, स्तुति करना या धन्यवाद देना सम्भव है। पाप और वापसी के प्रसंग में ‘नाम को मानना’ परमेश्वर की पहचान और अधिकार की अंगीकारपूर्ण स्वीकृति को सहज हिन्दी में व्यक्त करता है; अन्य सम्भावनाएँ पादटिप्पणी में रखी गई हैं।
- source_word: וְהִתְפַּלְלוּ
  choice: प्रार्थना करे
  rationale: פלל के हित्पअेल रूप का प्रचलित और स्पष्ट हिन्दी अनुवाद है।
- source_word: וְהִתְחַנְּנוּ אֵלֶיךָ
  choice: आपसे ... विनती करे
  rationale: हित्पअेल रूप अनुग्रह के लिए गिड़गिड़ाने या आग्रहपूर्वक निवेदन करने का भाव देता है; ‘विनती’ संक्षिप्त, गरिमापूर्ण और स्वाभाविक है।
- source_word: בַּבַּיִת הַזֶּה
  choice: इस भवन में
  rationale: בְּ का स्पष्ट अर्थ ‘में’ है। ‘भवन’ मन्दिर-सन्दर्भ में सम्मानपूर्ण रहते हुए בַּיִת के ‘घर/भवन’ अर्थ को सुरक्षित रखता है।
theological_decisions:
- issue: पाप के बाद परमेश्वर की ओर लौटने की भाषा
  choice: आपकी ओर लौटे
  alternative: मन फिराकर आपकी ओर लौटे
  rationale: שׁוּב स्वयं लौटने या मुड़ने को कहता है। चुना हुआ पाठ वाचा-संबंधी वापसी का भाव रखता है, पर मूल में अलग से न आए ‘मन फिराना’ को नहीं जोड़ता।
- issue: וְהוֹדוּ אֶת שְׁמֶךָ का बहुअर्थी प्रयोग
  choice: आपके नाम को माने
  alternative: आपके नाम की स्तुति करे / आपके नाम का धन्यवाद करे
  rationale: पाप, पराजय और वापसी के प्रसंग में स्वीकार या अंगीकार का अर्थ उपयुक्त है, किन्तु क्रिया की स्तुति और धन्यवाद वाली वास्तविक अर्थ-सम्भावनाएँ पादटिप्पणी में सुरक्षित हैं।
translation_notes:
  register: आधुनिक मानक हिन्दी; परमेश्वर के लिए आदरसूचक ‘आप’ और प्रजा के सामूहिक एकवचन के अनुरूप क्रियाएँ रखी गई हैं। वाक्य अगले पद में जारी प्रार्थना की शर्त का भाग है, इसलिए अन्त में अल्पविराम रखा गया है।
