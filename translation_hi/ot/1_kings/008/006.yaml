id: 1KI.8.6
reference: 1 Kings 8:6
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יָּבִ֣אוּ הַ֠/כֹּהֲנִים אֶת אֲר֨וֹן בְּרִית יְהוָ֧ה אֶל מְקוֹמ֛/וֹ אֶל דְּבִ֥יר הַ/בַּ֖יִת אֶל קֹ֣דֶשׁ הַ/קֳּדָשִׁ֑ים אֶל תַּ֖חַת כַּנְפֵ֥י הַ/כְּרוּבִֽים־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/006.yaml
  text: Then the priests brought the ark of the covenant of Yahweh to its place[a], into the inner sanctuary of the house, into the Most Holy Place[b], under the wings of the cherubim.
translation:
  language: hi
  text: तब याजक याहवे की वाचा के संदूक को उसके स्थान पर ले आए—भवन[a] के भीतरी पवित्रस्थान में, अर्थात परमपवित्र स्थान[b] में, करूबों के पंखों के नीचे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात मन्दिर। इब्रानी में शाब्दिक रूप से ‘भवन’ या ‘घर’।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से ‘पवित्रों का पवित्र’।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבִאוּ
  choice: तब ... ले आए
  rationale: वय्यिक्तोल रूप कथा को आगे बढ़ाता है; ‘तब’ स्वाभाविक हिन्दी में क्रम व्यक्त करता है, और संदूक को किसी स्थान तक पहुँचाने के लिए ‘ले आए’ उपयुक्त है।
- source_word: הַכֹּהֲנִים
  choice: याजक
  rationale: मन्दिर-सेवा करने वाले निश्चित बहुवचन पद का प्रचलित और स्पष्ट हिन्दी रूप।
- source_word: אֲרוֹן בְּרִית יְהוָה
  choice: याहवे की वाचा का संदूक
  rationale: इब्रानी संबंध-श्रृंखला को स्वाभाविक हिन्दी में रखा गया है; संदूक का संबंध याहवे की वाचा से है।
- source_word: יְהוָה
  choice: याहवे
  rationale: दिव्य व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय देवनागरी लिप्यंतरण में सुरक्षित रखा गया है।
- source_word: מְקוֹמוֹ
  choice: उसके स्थान
  rationale: प्रत्यय का संदर्भ संदूक से है; ‘उसके स्थान’ मूल का सीधा अर्थ देता है और ‘निर्धारित’ जैसा अतिरिक्त अर्थ नहीं जोड़ता।
- source_word: דְּבִיר
  choice: भीतरी पवित्रस्थान
  rationale: मन्दिर के सबसे अंदर वाले कक्ष को दर्शाता है; यह रूप आधुनिक पाठक के लिए ‘दैववाणी-स्थान’ जैसे अपारदर्शी विकल्प से अधिक स्पष्ट है।
- source_word: הַבַּיִת
  choice: भवन
  rationale: मूल शब्द का अर्थ ‘घर/भवन’ है; प्रसंग में यह मन्दिर-भवन को सूचित करता है।
- source_word: קֹדֶשׁ הַקֳּדָשִׁים
  choice: परमपवित्र स्थान
  rationale: इब्रानी की महत्तम पवित्रता व्यक्त करने वाली रचना का स्पष्ट, स्वाभाविक और प्रचलित हिन्दी समतुल्य।
- source_word: תַּחַת
  choice: नीचे
  rationale: स्थान-संबंधी पूर्वसर्ग का सीधा और स्वाभाविक हिन्दी रूप।
- source_word: כַּנְפֵי הַכְּרוּבִים
  choice: करूबों के पंखों
  rationale: विशिष्ट मन्दिर-प्रतिमाओं के पारंपरिक नाम ‘करूब’ को रखते हुए बहुवचन और ‘पंख’ का शाब्दिक अर्थ सुरक्षित किया गया है।
theological_decisions:
- issue: दिव्य नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: पद में चतुरक्षरीय व्यक्तिगत नाम सीधे आया है। ‘याहवे’ उसे उपाधि से बदले बिना और किसी विशिष्ट साम्प्रदायिक व्याख्या को जोड़े बिना प्रस्तुत करता है।
- issue: קֹדֶשׁ הַקֳּדָשִׁים की अभिव्यक्ति
  choice: परमपवित्र स्थान
  alternative: पवित्रों का पवित्र; महापवित्र स्थान
  rationale: यह इब्रानी महत्तम अभिव्यक्ति है। चुना हुआ रूप स्थान की सर्वोच्च पवित्रता को सहज हिन्दी में व्यक्त करता है, जबकि वैकल्पिक अधिक शाब्दिक रूप पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। इब्रानी में आए क्रमिक ‘की ओर/में’ संबंधों को हिन्दी में डैश और ‘अर्थात’ द्वारा स्पष्ट किया गया है, जिससे भीतरी पवित्रस्थान और परमपवित्र स्थान को अलग कक्ष न समझा जाए।
