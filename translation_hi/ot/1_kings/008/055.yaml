reference: 1 Kings 8:55
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַֽ/יַּעְמֹ֕ד וַ/יְבָ֕רֶךְ אֵ֖ת כָּל קְהַ֣ל יִשְׂרָאֵ֑ל ק֥וֹל גָּד֖וֹל לֵ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/055.yaml
  text: 'And he stood and blessed all the assembly of Israel with a loud voice[b][a], saying:'
translation:
  language: hi
  text: 'तब वह खड़ा हुआ और उसने ऊँचे स्वर से इस्राएल की सारी सभा को आशीर्वाद देते हुए कहा:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעְמֹד
  choice: तब वह खड़ा हुआ
  rationale: वाव-क्रमिक रूप कथा की अगली क्रिया बताता है। עמד का यहाँ सीधा अर्थ ‘खड़ा होना’ है; ‘तब’ हिन्दी में घटनाक्रम को स्वाभाविक रूप से व्यक्त करता है।
- source_word: וַיְבָרֶךְ
  choice: उसने ... आशीर्वाद देते हुए कहा
  rationale: ברך यहाँ एकत्र लोगों के लिए सार्वजनिक रूप से आशीर्वचन कहने को सूचित करता है। हिन्दी वाक्य में ‘आशीर्वाद देते हुए कहा’ अगले पद में आने वाली वाणी से क्रिया का स्वाभाविक संबंध बनाए रखता है।
- source_word: כָּל קְהַל יִשְׂרָאֵל
  choice: इस्राएल की सारी सभा
  rationale: קהל एकत्र समुदाय को दर्शाता है; ‘सभा’ आधुनिक, स्पष्ट और सार्वजनिक-सामुदायिक भाव को सुरक्षित रखता है। כָּל को ‘सारी’ से व्यक्त किया गया है।
- source_word: קוֹל גָּדוֹל
  choice: ऊँचे स्वर से
  rationale: शाब्दिक रूप ‘बड़ा स्वर’ है, पर यह इब्रानी मुहावरा ध्वनि की प्रबलता बताता है। ‘ऊँचे स्वर से’ स्वाभाविक आधुनिक हिन्दी है।
- source_word: לֵאמֹר
  choice: 'कहा:'
  rationale: यह रूप आगे आने वाली वाणी का परिचय देता है। हिन्दी में ‘कहा:’ स्पष्ट और सहज रूप से अगले पद के कथन से जोड़ता है।
theological_decisions:
- issue: इस्राएल को ‘आशीर्वाद देने’ का स्वरूप
  choice: सुलैमान ने एकत्र लोगों के लिए आशीर्वचन कहा; पाठ यह नहीं कहता कि उसने अपने सामर्थ्य से दिव्य अनुग्रह प्रदान किया।
  alternative: ‘आशीर्वाद दिया’ को अधिक संस्कारात्मक या स्वयं प्रभाव उत्पन्न करने वाली क्रिया मानना।
  rationale: इस सार्वजनिक राजकीय-उपासना प्रसंग में ברך आशीर्वचन बोलने का अर्थ रख सकता है। अनुवाद मूल शब्द का भाव बनाए रखता है, पर पाठ से अधिक कोई विशिष्ट धर्मवैज्ञानिक तंत्र नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, गरिमापूर्ण और सामान्य पाठकों के लिए सहज रखी गई है। ‘इस्राएल की सारी सभा’ औपचारिक सामुदायिक प्रसंग को व्यक्त करता है; ‘ऊँचे स्वर से’ शाब्दिक इब्रानी मुहावरे का स्वाभाविक हिन्दी समतुल्य है।
