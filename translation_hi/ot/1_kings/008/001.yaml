id: 1KI.8.1
reference: 1 Kings 8:1
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: אָ֣ז יַקְהֵ֣ל שְׁלֹמֹ֣ה אֶת זִקְנֵ֣י יִשְׂרָאֵ֡ל אֶת כָּל רָאשֵׁ֣י הַ/מַּטּוֹת֩ נְשִׂיאֵ֨י הָ/אָב֜וֹת לִ/בְנֵ֧י יִשְׂרָאֵ֛ל אֶל הַ/מֶּ֥לֶךְ שְׁלֹמֹ֖ה יְרוּשָׁלִָ֑ם לְֽ/הַעֲל֞וֹת אֶת אֲר֧וֹן בְּרִית יְהוָ֛ה מֵ/עִ֥יר דָּוִ֖ד הִ֥יא צִיּֽוֹן־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/001.yaml
  text: Then Solomon assembled the elders of Israel[a], all the heads of the tribes, the leaders of the fathers’ houses of the sons of Israel, to King Solomon in Jerusalem, to bring up the ark of the covenant of Yahweh from the city of David, that is, Zion.
translation:
  language: hi
  text: तब सुलैमान ने इस्राएल के पुरनियों, गोत्रों के सभी मुखियाओं और इस्राएलियों के पितृकुलों के प्रधानों को यरूशलेम में अपने पास इकट्ठा किया, ताकि वे यहोवा की वाचा का संदूक दाऊद के नगर से, अर्थात् सिय्योन से, ऊपर ले आएँ।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אָז
  choice: तब
  rationale: यह काल-सूचक कथात्मक पद अगले घटनाक्रम को आरंभ करता है; ‘तब’ स्वाभाविक और संक्षिप्त है।
- source_word: יַקְהֵל
  choice: इकट्ठा किया
  rationale: קהל का हिफ़ील रूप किसी सभा को एकत्र करने या बुलाने का भाव देता है; यहाँ राजकीय आयोजन के संदर्भ में यह सहज है।
- source_word: זִקְנֵי יִשְׂרָאֵל
  choice: इस्राएल के पुरनियों
  rationale: यह मान्यता-प्राप्त वरिष्ठ सामुदायिक अगुओं के लिए स्थापित सामाजिक-राजनीतिक पद है।
- source_word: כָּל רָאשֵׁי הַמַּטּוֹת
  choice: गोत्रों के सभी मुखियाओं
  rationale: מַטּוֹת यहाँ शाब्दिक ‘लाठियों’ के बजाय इस्राएल के गोत्रों को सूचित करता है।
- source_word: נְשִׂיאֵי הָאָבוֹת לִבְנֵי יִשְׂרָאֵל
  choice: इस्राएलियों के पितृकुलों के प्रधानों
  rationale: הָאָבוֹת यहाँ पूर्वज-आधारित कुलों या घरानों को सूचित करता है। ‘इस्राएलियों’ से בני ישראל का सामूहिक राष्ट्रीय आशय स्वाभाविक हिन्दी में स्पष्ट होता है।
- source_word: אֶל הַמֶּלֶךְ שְׁלֹמֹה יְרוּשָׁלִָם
  choice: यरूशलेम में अपने पास
  rationale: सभा बुलाने वाला स्वयं सुलैमान है, इसलिए शाब्दिक ‘राजा सुलैमान के पास’ हिन्दी में अनावश्यक पुनरुक्ति होगी; ‘अपने पास’ वही संबंध सुरक्षित रखता है।
- source_word: לְהַעֲלוֹת
  choice: ऊपर ले आएँ
  rationale: עלה ऊँचाई की ओर ले जाने का भाव रखता है; यरूशलेम में संदूक लाने के लिए ‘ऊपर ले आएँ’ भौगोलिक और कथात्मक दोनों दिशा दर्शाता है।
- source_word: אֲרוֹן בְּרִית יְהוָה
  choice: यहोवा की वाचा का संदूक
  rationale: समास-शृंखला का स्वाभाविक हिन्दी रूप है और संदूक को यहोवा की वाचा से संबद्ध रखता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिन्दी में दिव्य नाम का सुविदित लिप्यंतरण ‘यहोवा’ है; यह नाम को किसी उपाधि से प्रतिस्थापित नहीं करता।
- source_word: מֵעִיר דָּוִד הִיא צִיּוֹן
  choice: दाऊदपुर से, अर्थात् सिय्योन से
  rationale: ‘दाऊदपुर’ हिन्दी बाइबलीय प्रयोग में ‘दाऊद का नगर’ का संक्षिप्त स्थाननाम है; הִיא צִיּוֹן उसकी पहचान सिय्योन के रूप में स्पष्ट करता है।
theological_decisions:
- issue: दिव्य नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल में व्यक्तिगत दिव्य नाम है, इसलिए ‘प्रभु’ जैसी उपाधि के बजाय नाम रखा गया। आधुनिक हिन्दी पाठकों में ‘यहोवा’ अधिक परिचित लिप्यंतरण है, जबकि ‘याहवे’ संभावित वैकल्पिक उच्चारण है।
- issue: לִבְנֵי יִשְׂרָאֵל का सामूहिक पारिवारिक-राष्ट्रीय अर्थ
  choice: इस्राएलियों के
  alternative: इस्राएल के पुत्रों के
  rationale: संदर्भ में यह पूरे राष्ट्रीय समुदाय के पूर्वज-आधारित कुलों का परिचायक है। ‘इस्राएलियों’ से सामूहिक आशय स्पष्ट रहता है और आधुनिक हिन्दी में कृत्रिम लैंगिक सीमाबद्धता नहीं आती।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज कथात्मक शैली। पद की लंबी सूची को स्पष्ट समन्वय के साथ रखा गया है; कर्ता ‘सुलैमान’ की पुनरावृत्ति को ‘अपने पास’ से स्वाभाविक बनाया गया है।
