  text: אֵ֚ין בָּֽ/אָר֔וֹן רַ֗ק שְׁנֵי֙ לֻח֣וֹת הָ/אֲבָנִ֔ים אֲשֶׁ֨ר הִנִּ֥חַ שָׁ֛ם מֹשֶׁ֖ה בְּ/חֹרֵ֑ב אֲשֶׁ֨ר כָּרַ֤ת יְהוָה֙ עִם בְּנֵ֣י יִשְׂרָאֵ֔ל בְּ/צֵאתָ֖/ם מֵ/אֶ֥רֶץ מִצְרָֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/009.yaml
  text: There was nothing in the ark except the two stone tablets that Moses had placed there at Horeb[c][b][a], where Yahweh made a covenant with the sons of Israel when they came out from the land of Egypt.
translation:
  language: hi
  text: सन्दूक में पत्थर की दो पटियाओं[a] के सिवा कुछ नहीं था, जिन्हें मूसा ने होरेब में रखी थीं। वहीं याहवे ने इस्राएल के पुत्रों[c] के साथ वाचा बाँधी[b] थी, जब वे मिस्र देश से निकले थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “पत्थरों की दो पटियाएँ।”
    reason: lexical_alternative
  - marker: b
    text: हिब्रू में शाब्दिक रूप से “वाचा काटी”; इस मुहावरे का अर्थ है “वाचा बाँधी” या “वाचा स्थापित की।”
    reason: lexical_alternative
  - marker: c
    text: या, “इस्राएली” अथवा “इस्राएल की सन्तान।”
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵין בָּאָרוֹן רַק
  choice: सन्दूक में ... के सिवा कुछ नहीं था
  rationale: नकारात्मक अस्तित्ववाचक אֵין और अपवादसूचक רַק को स्वाभाविक हिन्दी संरचना ‘के सिवा कुछ नहीं’ में व्यक्त किया गया है।
- source_word: שְׁנֵי לֻחֹת הָאֲבָנִים
  choice: पत्थर की वे दो पटियाएँ
  rationale: ‘पटियाएँ’ वाचा की शिलापट्टिकाओं के लिए स्पष्ट और प्रचलित हिन्दी है; ‘पत्थर की’ मूल सामग्री-संबंध को बनाए रखता है।
- source_word: אֲשֶׁר הִנִּיחַ שָׁם מֹשֶׁה
  choice: जिन्हें मूसा ने ... वहाँ रखा था
  rationale: הִנִּיחַ का अर्थ ‘रखना/स्थापित करना’ है; ‘रखा था’ वर्तमान वर्णन से पहले हुई क्रिया को सहज रूप से दिखाता है।
- source_word: בְּחֹרֵב
  choice: होरेब में
  rationale: स्थानवाचक उपसर्ग בְּ का स्वाभाविक हिन्दी रूप ‘में’ है और חֹרֵב का लिप्यंतरण ‘होरेब’ किया गया है।
- source_word: אֲשֶׁר כָּרַת יְהוָה עִם
  choice: वहीं याहवे ने ... के साथ ... वाचा बाँधी
  rationale: כרת का शाब्दिक अर्थ ‘काटना’ है, पर वाचा के साथ यह वाचा स्थापित करने का मुहावरा है। मूल में בְּרִית निहित है, इसलिए हिन्दी में ‘वाचा’ स्पष्ट रूप से जोड़ी गई है।
- source_word: יְהוָה
  choice: याहवे
  rationale: चतुरक्षरीय ईश्वरीय नाम को किसी उपाधि से बदलने के बजाय उसके प्रचलित विद्वत्तापूर्ण उच्चारण के निकट देवनागरी लिप्यंतरण में रखा गया है।
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: इस्राएल के पुत्र
  rationale: यह मूल के पारिवारिक पदबंध को सीधे बनाए रखता है; अधिक मुहावरेदार ‘इस्राएली’ को पादटिप्पणी में दिया गया है।
- source_word: בְּצֵאתָם מֵאֶרֶץ מִצְרָיִם
  choice: जब वे मिस्र देश से निकले थे
  rationale: पूर्वसर्गयुक्त क्रियार्थक संज्ञा को स्वाभाविक कालवाचक हिन्दी उपवाक्य में व्यक्त किया गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ व्यक्तिगत वाचा-नाम का प्रयोग करता है। ‘याहवे’ नाम को नाम के रूप में सुरक्षित रखता है, जबकि ‘प्रभु’ उसे उपाधि में बदल देता है।
- issue: בְּנֵי יִשְׂרָאֵל का स्वरूप
  choice: इस्राएल के पुत्र
  alternative: इस्राएली; इस्राएल की सन्तान
  rationale: मुख्य पाठ में मूल का पारिवारिक और व्याकरणिक रूप सुरक्षित रखा गया है, पर पादटिप्पणी सामान्य सामुदायिक अर्थ स्पष्ट करती है।
- issue: כָּרַת के वाचा-संबंधी मुहावरे का अर्थ
  choice: वाचा बाँधी
  alternative: वाचा काटी
  rationale: ‘वाचा काटना’ हिब्रू की शब्दशः अभिव्यक्ति है, पर हिन्दी में अर्थ अस्पष्ट होगा। ‘वाचा बाँधी’ मुहावरे का आशय स्पष्ट करते हुए वाचा की पारस्परिकता को बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘सन्दूक’, ‘वाचा’ और ‘पटियाएँ’ जैसे स्थापित बाइबलीय शब्द प्रसंगगत सटीकता के लिए बनाए रखे गए हैं। दूसरे वाक्य का ‘वहीं’ होरेब को वाचा बाँधने की घटना से जोड़ता है और हिब्रू संबंधवाचक संरचना को स्वाभाविक हिन्दी में व्यक्त करता है।
