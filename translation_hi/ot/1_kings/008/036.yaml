base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/036.yaml
  text: then may you hear in heaven and forgive the sin of your servants[a], your people Israel, when you teach them the good way in which they should walk. And may you give rain on your land[b], which you have given to your people as an inheritance.
translation:
  language: hi
  text: तब तू स्वर्ग में[a] सुन, और अपने सेवकों और अपनी प्रजा इस्राएल के पाप को क्षमा कर, जब तू उन्हें उस अच्छे मार्ग की शिक्षा दे जिस पर उन्हें चलना चाहिए; और अपनी भूमि पर वर्षा दे—उस भूमि पर जिसे तूने अपनी प्रजा को विरासत के रूप में दिया है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “स्वर्ग से।” इब्रानी में शाब्दिक अभिव्यक्ति “आकाशों/स्वर्ग को सुनना” है; प्रसंग के अनुसार “में” या “से” समझा जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּשְׁמַע הַשָּׁמַיִם
  choice: तू स्वर्ग में सुनना
  rationale: इब्रानी में शाब्दिक रूप से ‘आकाश/स्वर्ग सुनना’ है; प्रार्थना के प्रसंग में हिन्दी में स्थानसूचक ‘में’ जोड़ना स्वाभाविक है, जबकि स्रोत की असामान्य संक्षिप्तता को पादटिप्पणी में बताया गया है।
- source_word: וְסָלַחְתָּ לְחַטַּאת
  choice: पाप क्षमा करना
  rationale: यहाँ חַטָּאת बलिदान नहीं, क्षमा योग्य अपराध अथवा पाप को सूचित करता है।
- source_word: עֲבָדֶיךָ וְעַמְּךָ יִשְׂרָאֵל
  choice: अपने दासों, अपनी प्रजा इस्राएल
  rationale: עֶבֶד के लिए ‘दास’ परमेश्वर के अधीन सेवक और प्रजा का भाव रखता है। हिन्दी में अल्पविराम इस्राएल को दासों की पहचान बताने वाले समानाधिकरण के रूप में सहजता से प्रस्तुत करता है, बिना किसी अतिरिक्त समूह का आग्रह किए।
- source_word: כִּי תוֹרֵם
  choice: जब तू उन्हें ... शिक्षा दे
  rationale: כִּי के सम्भव कारणसूचक अर्थ को नकारे बिना, यहाँ ‘जब’ क्षमा, शिक्षा और पुनः वर्षा के प्रार्थनात्मक क्रम को स्वाभाविक रूप से व्यक्त करता है। ירה का हिफ़ील रूप ‘शिक्षा देना/मार्ग दिखाना’ है।
- source_word: הַדֶּרֶךְ הַטּוֹבָה אֲשֶׁר יֵלְכוּ בָהּ
  choice: उस अच्छे मार्ग ... जिस पर उन्हें चलना चाहिए
  rationale: ‘अच्छा मार्ग’ और उस पर ‘चलना’ जीवन-आचरण के मूल रूपक को बनाए रखते हैं; ‘चाहिए’ अपेक्षित आचरण का भाव स्पष्ट करता है।
- source_word: וְנָתַתָּה מָטָר עַל אַרְצְךָ
  choice: तब अपनी भूमि पर वर्षा देना
  rationale: נתן का सीधा अर्थ ‘देना’ रखा गया है। ‘अपनी भूमि’ परमेश्वर के स्वामित्व को स्पष्ट रूप से सुरक्षित रखता है।
- source_word: אֲשֶׁר נָתַתָּה לְעַמְּךָ לְנַחֲלָה
  choice: जिसे तूने अपनी प्रजा को विरासत के रूप में दिया है
  rationale: נַחֲלָה वाचा के अंतर्गत मिली पैतृक विरासत/अधिकार को दर्शाता है; ‘विरासत’ आधुनिक हिन्दी में स्पष्ट और धर्मवैचारिक रूप से पर्याप्त है।
theological_decisions:
- issue: भूमि पर परमेश्वर का स्वामित्व और इस्राएल को उसका दिया जाना
  choice: अपनी भूमि ... जिसे तूने अपनी प्रजा को विरासत के रूप में दिया है
  alternative: वह भूमि जिसे तूने अपनी प्रजा को उनकी विरासत के रूप में दिया है
  rationale: मूल पाठ भूमि पर द्वितीय पुरुष प्रत्यय लगाकर उसे परमेश्वर की भूमि कहता है और साथ ही उसे प्रजा की विरासत बताता है। चुना हुआ रूप इस वास्तविक तनाव को बनाए रखता है।
- issue: כִּי का सम्बन्ध
  choice: जब तू उन्हें ... शिक्षा दे
  alternative: क्योंकि तू उन्हें ... शिक्षा देता है
  rationale: दोनों अर्थ व्याकरणतः सम्भव हैं। प्रसंग में ‘जब’ पश्चात्तापी प्रजा को शिक्षा देने और वर्षा बहाल करने की परिस्थिति को व्यक्त करता है; वैकल्पिक कारणसूचक अर्थ पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण प्रार्थना-शैली रखी गई है। परमेश्वर को संबोधन में एकवचन ‘तू’ और संबंधित क्रियारूप प्रयुक्त हैं। ‘अच्छा मार्ग’ तथा ‘चलना’ जैसे मूल रूपक बनाए रखे गए हैं; अनावश्यक पुरातन शब्दावली से बचा गया है।
