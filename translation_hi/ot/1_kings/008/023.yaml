  text: וַ/יֹּאמַ֗ר יְהוָ֞ה אֱלֹהֵ֤י יִשְׂרָאֵל֙ אֵין כָּמ֣וֹ/ךָ אֱלֹהִ֔ים בַּ/שָּׁמַ֣יִם מִ/מַּ֔עַל וְ/עַל הָ/אָ֖רֶץ מִ/תָּ֑חַת שֹׁמֵ֤ר הַ/בְּרִית֙ וְֽ/הַ/חֶ֔סֶד לַ/עֲבָדֶ֕י/ךָ הַ/הֹלְכִ֥ים לְ/פָנֶ֖י/ךָ בְּ/כָל לִבָּֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/023.yaml
  text: And he said[a], “O Yahweh, God of Israel, there is no God like you in heaven above or on earth beneath[b], keeping the covenant and the steadfast love for your servants who walk before you with all their heart.”
translation:
  language: hi
  text: और उसने कहा, “हे याहवे, इस्राएल के परमेश्वर, ऊपर आकाश में और नीचे पृथ्वी पर[a] तेरे समान कोई परमेश्वर नहीं है। तू अपने उन सेवकों के लिए वाचा और अटल प्रेम[b] बनाए रखता है, जो अपने पूरे मन से तेरे सामने चलते हैं।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “ऊपर आकाशों में और नीचे पृथ्वी पर।”
    reason: इब्रानी שָׁמַיִם रूप की बहुवचन आकृति और अधिक शाब्दिक वाक्य-विन्यास को दर्शाने के लिए।
  - marker: b
    text: इब्रानी शब्द ख़ेसेद प्रायः वाचा-निष्ठा, विश्वासयोग्य प्रेम या अटल प्रेम का भाव व्यक्त करता है।
    reason: חֶסֶד की व्यापक और धर्मवैचारिक रूप से महत्त्वपूर्ण अर्थ-छाया को सुरक्षित रखने के लिए।
lexical_decisions:
- source_word: וַיֹּאמַר
  choice: और उसने कहा
  rationale: इब्रानी कथात्मक क्रम को स्वाभाविक हिन्दी में बनाए रखता है और वक्ता सुलैमान की ओर संकेत करता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत वाचा-नाम का हिन्दी लिप्यंतरण है; इसे किसी उपाधि से नहीं बदला गया।
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: इस्राएल के परमेश्वर
  rationale: सम्बोधन में प्रयुक्त इस रचना का स्वाभाविक और सटीक हिन्दी रूप।
- source_word: אֵין כָּמוֹךָ אֱלֹהִים
  choice: तेरे समान कोई परमेश्वर नहीं है
  rationale: याहवे की अतुलनीयता को व्यक्त करता है और אֱלֹהִים को प्रसंगानुसार एकवचन अर्थ में रखता है।
- source_word: בַּשָּׁמַיִם מִמַּעַל וְעַל הָאָרֶץ מִתָּחַת
  choice: ऊपर आकाश में और नीचे पृथ्वी पर
  rationale: समूची सृष्टि को समेटने वाले युग्म को स्पष्ट, स्वाभाविक हिन्दी में व्यक्त करता है; इब्रानी बहुवचन की जानकारी पादटिप्पणी में दी गई है।
- source_word: שֹׁמֵר הַבְּרִית
  choice: वाचा ... बनाए रखता है
  rationale: कृदन्त को परमेश्वर के निरंतर चरित्र और कार्य के वर्णन के रूप में स्वाभाविक हिन्दी वाक्य में प्रस्तुत करता है।
- source_word: וְהַחֶסֶד
  choice: और अटल प्रेम
  rationale: חֶסֶד में निहित स्थिर प्रेम और वाचा-संबंधी निष्ठा को संक्षेप में व्यक्त करता है।
- source_word: לַעֲבָדֶיךָ
  choice: अपने ... सेवकों के लिए
  rationale: इस प्रसंग में सम्बन्ध और समर्पण प्रमुख हैं, इसलिए ‘सेवक’ उपयुक्त है; ל को हिन्दी में ‘के लिए’ से व्यक्त किया गया है।
- source_word: הַהֹלְכִים לְפָנֶיךָ
  choice: जो ... तेरे सामने चलते हैं
  rationale: परमेश्वर की उपस्थिति में विश्वासयोग्य जीवन जीने के इब्रानी रूपक ‘चलना’ को सुरक्षित रखता है।
- source_word: בְּכָל לִבָּם
  choice: अपने पूरे मन से
  rationale: לֵב के भीतर के संपूर्ण संकल्प, निष्ठा और अभिमुखता के अर्थ को आधुनिक हिन्दी में स्वाभाविक रूप से व्यक्त करता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: प्रभु / यहोवा
  rationale: व्यक्तिगत वाचा-नाम को उपाधि से बदलने के बजाय उसका निकट हिन्दी लिप्यंतरण किया गया है।
- issue: אֵין כָּמוֹךָ אֱלֹהִים में אֱלֹהִים का अर्थ
  choice: तेरे समान कोई परमेश्वर नहीं है
  alternative: देवताओं में तेरे समान कोई नहीं
  rationale: प्रत्यक्ष सम्बोधन और स्वर्ग-पृथ्वी की व्यापक तुलना के प्रसंग में यह पाठ परमेश्वर की अतुलनीयता घोषित करता है; वैकल्पिक बहुवचन अर्थ को अनावश्यक रूप से आरोपित नहीं किया गया।
- issue: वाचा के प्रसंग में חֶסֶד का आशय
  choice: अटल प्रेम
  alternative: विश्वासयोग्य प्रेम / करुणा / वाचा-निष्ठा
  rationale: ‘अटल प्रेम’ स्नेह और स्थायी निष्ठा दोनों को बनाए रखता है, जबकि पादटिप्पणी इसकी व्यापक वाचा-संबंधी अर्थ-छाया स्पष्ट करती है।
