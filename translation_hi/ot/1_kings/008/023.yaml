  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। प्रार्थना का निकट और श्रद्धापूर्ण स्वर बनाए रखने के लिए एकवचन ‘तू/तेरे’ का प्रयोग किया गया है। ‘वाचा’, ‘अटल प्रेम’ और ‘तेरे सामने चलते हैं’ जैसे प्रमुख बाइबिलीय पद स्वाभाविक हिन्दी वाक्य-रचना में सुरक्षित रखे गए हैं।
