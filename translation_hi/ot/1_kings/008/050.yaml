  text: וְ/סָלַחְתָּ֤ לְ/עַמְּ/ךָ֙ אֲשֶׁ֣ר חָֽטְאוּ לָ֔/ךְ וּ/לְ/כָל פִּשְׁעֵי/הֶ֖ם אֲשֶׁ֣ר פָּשְׁעוּ בָ֑/ךְ וּ/נְתַתָּ֧/ם לְ/רַחֲמִ֛ים לִ/פְנֵ֥י שֹׁבֵי/הֶ֖ם וְ/רִֽחֲמֽוּ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/050.yaml
  text: and forgive your people who have sinned against you[a], and all their transgressions that they have committed against you, and grant them compassion before those who took them captive[b], so that they may have compassion on them.
translation:
  language: hi
  text: और अपनी प्रजा को, जिसने तेरे विरुद्ध पाप किया है, क्षमा कर; और उनके उन सब अपराधों[a] को भी क्षमा कर, जो उन्होंने तेरे विरुद्ध किए हैं। उन्हें उनके बंदी बनाने वालों की दृष्टि में दया का पात्र बना, ताकि वे उन पर दया करें।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “अपराधों” का अनुवाद “विद्रोहों” भी हो सकता है; यह शब्द परमेश्वर के विरुद्ध बगावत का भाव उभारता है।
    reason: शब्दार्थगत विकल्प
  - marker: b
    text: या, “और वे उन पर दया करेंगे।” अंतिम उपवाक्य उद्देश्य के साथ-साथ परिणाम भी व्यक्त कर सकता है।
    reason: वाक्यगत वैकल्पिक पाठ
lexical_decisions:
- source_word: וְסָלַחְתָּ
  choice: क्षमा कर
  rationale: प्रार्थना के प्रसंग में पूर्ण क्रिया निवेदन का भाव व्यक्त करती है; आधुनिक हिंदी में आज्ञार्थक रूप स्वाभाविक और स्पष्ट है।
- source_word: לְעַמְּךָ
  choice: अपनी प्रजा को
  rationale: עם यहाँ परमेश्वर की प्रजा को सूचित करता है; ‘प्रजा’ राजकीय-करारगत प्रसंग के अनुरूप और सामान्य हिंदी में बोधगम्य है।
- source_word: חָטְאוּ לָךְ
  choice: तेरे विरुद्ध पाप किया है
  rationale: לָךְ अपराध से प्रभावित पक्ष को चिह्नित करता है; ‘तेरे विरुद्ध’ इसका स्वाभाविक हिंदी रूप है।
- source_word: וּלְכָל פִּשְׁעֵיהֶם אֲשֶׁר פָּשְׁעוּ בָךְ
  choice: उनके उन सब अपराधों को भी ... जो उन्होंने तेरे विरुद्ध किए हैं
  rationale: פשע में अपराध और विद्रोह दोनों की छाया है। मुख्य पाठ में स्वाभाविकता के लिए ‘अपराध’ चुना गया है, जबकि विद्रोह का अर्थ-संकेत पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: וּנְתַתָּם לְרַחֲמִים
  choice: उन पर दया होने दे
  rationale: נתן + לְרַחֲמִים का मुहावरा उन्हें दया प्राप्त होने की स्थिति में रखने का भाव देता है; यह हिंदी अभिव्यक्ति परमेश्वर की भूमिका को बनाए रखते हुए कृत्रिम शब्दावली से बचती है।
- source_word: לִפְנֵי שֹׁבֵיהֶם
  choice: उन्हें बंदी बनानेवालों के सामने
  rationale: שֹׁבֵיהֶם सक्रिय कृदंत है और बंदी बनानेवालों को दर्शाता है; ‘के सामने’ לִפְנֵי के संबंधपरक भाव को बनाए रखता है।
- source_word: וְרִחֲמוּם
  choice: ताकि वे उन पर दया करें
  rationale: यह अंतिम क्रिया उद्देश्य अथवा परिणाम दोनों व्यक्त कर सकती है। मुख्य पाठ में उद्देश्यसूचक ‘ताकि’ लिया गया है और वैकल्पिक परिणामसूचक पाठ पादटिप्पणी में दिया गया है।
theological_decisions:
- issue: ईश्वरीय क्षमा और बंदी बनानेवालों की मानवीय दया का संबंध
  choice: पद को ऐसी प्रार्थना के रूप में रखा गया है जिसमें परमेश्वर से क्षमा और बंदी बनानेवालों के सामने दया दिलाने की विनती की जाती है।
  alternative: 'अंतिम उपवाक्य को निश्चित परिणाम के रूप में पढ़ा जा सकता है: ‘और वे उन पर दया करेंगे।’'
  rationale: इब्रानी वाक्यक्रम परमेश्वर से दया की परिस्थिति प्रदान करने और बंदी बनानेवालों के दयालु व्यवहार को जोड़ता है, पर अंतिम वाव-रूप उद्देश्य और परिणाम के बीच कुछ अस्पष्टता रखता है; इसे पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध हिंदी। सुलैमान की प्रत्यक्ष प्रार्थना के अनुरूप परमेश्वर के लिए एकवचन निकट संबोधन ‘तेरे’ रखा गया है। संज्ञा और सजातीय क्रिया की इब्रानी पुनरुक्ति को हिंदी में स्वाभाविक बनाने के लिए ‘अपराधों ... किए’ कहा गया है।
