  text: רַ֣ק אַתָּ֔ה לֹ֥א תִבְנֶ֖ה הַ/בָּ֑יִת כִּ֤י אִם בִּנְ/ךָ֙ הַ/יֹּצֵ֣א מֵ/חֲלָצֶ֔י/ךָ הֽוּא יִבְנֶ֥ה הַ/בַּ֖יִת לִ/שְׁמִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/019.yaml
  text: Nevertheless[a], you shall not build the house; rather, your son who comes from your own body, he shall build the house for my name.
translation:
  language: hi
  text: फिर भी, तू इस भवन को नहीं बनाएगा; बल्कि तेरा पुत्र, जो तेरी ही देह से उत्पन्न होगा[a], वही मेरे नाम के लिए इस भवन को बनाएगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “जो तेरी कमर से निकलेगा”; यह अपने शारीरिक वंशज के लिए प्रयुक्त मुहावरा है।
    reason: lexical_alternative
lexical_decisions:
- source_word: רַק
  choice: फिर भी
  rationale: यह शब्द दाऊद की अच्छी इच्छा की स्वीकृति पर एक सीमा लगाता है; ‘फिर भी’ उसके विरोधात्मक भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: לֹא תִבְנֶה
  choice: तू ... नहीं बनाएगा
  rationale: नकार के साथ अपूर्ण क्रिया यहाँ ईश्वरीय घोषणा है, जिसमें भविष्यवाणी और निषेध—दोनों की छाया बनी रहती है।
- source_word: הַבָּיִת
  choice: इस भवन
  rationale: मूल शब्द का अर्थ ‘घर/भवन’ है। प्रसंग में निर्दिष्ट पवित्र भवन स्पष्ट होने के कारण ‘इस भवन’ स्वाभाविक है और इसे सीधे ‘मन्दिर’ कहकर स्रोत के धार्मिक रूपक को समाप्त नहीं करता।
- source_word: כִּי אִם
  choice: बल्कि
  rationale: यह ‘तू नहीं, तेरा पुत्र’ का स्पष्ट विरोध और सुधार व्यक्त करता है।
- source_word: בִּנְךָ
  choice: तेरा पुत्र
  rationale: एकवचन और सम्बद्ध प्रत्यय किसी विशिष्ट पुत्र की ओर संकेत करते हैं।
- source_word: הַיֹּצֵא מֵחֲלָצֶיךָ
  choice: जो तेरी ही देह से उत्पन्न होगा
  rationale: यह जैविक वंश के लिए प्रयुक्त इब्रानी मुहावरा है; यह चयन आधुनिक हिन्दी में अर्थ स्पष्ट करता है और ‘ही’ प्रत्यक्ष शारीरिक वंश पर बल देता है।
- source_word: הוּא
  choice: वही
  rationale: स्वतंत्र सर्वनाम का बल सुरक्षित रखते हुए यह स्पष्ट करता है कि भवन दाऊद नहीं, उसका पुत्र बनाएगा।
- source_word: יִבְנֶה הַבַּיִת
  choice: इस भवन को बनाएगा
  rationale: मूल में ‘भवन बनाना’ दोहराया गया है; अनुवाद भी इस पुनरावृत्ति को बनाए रखता है।
- source_word: לִשְׁמִי
  choice: मेरे नाम के लिए
  rationale: यह यहोवा के नाम को समर्पित भवन का वाचाई धार्मिक मुहावरा है; इसे व्याख्यात्मक विस्तार के बिना सुरक्षित रखा गया है।
theological_decisions:
- issue: הַבָּיִת का अनुवाद सामान्य ‘भवन’ के रूप में किया जाए या व्याख्यात्मक ‘मन्दिर’ के रूप में
  choice: इस भवन
  alternative: मन्दिर
  rationale: यद्यपि प्रसंग मन्दिर का है, मूल पाठ ‘घर/भवन’ कहता है। ‘इस भवन’ संदर्भ को स्पष्ट रखते हुए मूल की धार्मिक अभिव्यक्ति को सुरक्षित रखता है।
- issue: לֹא תִבְנֶה को निषेध माना जाए या भविष्यसूचक घोषणा
  choice: तू ... नहीं बनाएगा
  alternative: तू ... न बनाना
  rationale: भविष्यकालीन रूप हिन्दी में ईश्वरीय निर्णय को व्यक्त करता है और मूल में उपस्थित निषेध तथा भविष्यवाणी के बीच का तनाव अनावश्यक रूप से नहीं मिटाता।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध हिन्दी। दाऊद को संबोधन में प्रसंगानुकूल एकवचन ‘तू’ रखा गया है। ‘भवन’ मूल के בַּיִת को ‘मन्दिर’ की अपेक्षा अधिक निकटता से दर्शाता है; ‘वही’ हिब्रानी सर्वनाम के बल को व्यक्त करता है।
