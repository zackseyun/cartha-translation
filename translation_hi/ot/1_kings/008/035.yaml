  text: בְּ/הֵעָצֵ֥ר שָׁמַ֛יִם וְ/לֹא יִהְיֶ֥ה מָטָ֖ר כִּ֣י יֶחֶטְאוּ לָ֑/ךְ וְ/הִֽתְפַּֽלְל֞וּ אֶל הַ/מָּק֤וֹם הַ/זֶּה֙ וְ/הוֹד֣וּ אֶת שְׁמֶ֔/ךָ וּ/מֵ/חַטָּאתָ֥/ם יְשׁוּב֖וּ/ן כִּ֥י תַעֲנֵֽ/ם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/035.yaml
  text: When the heavens are shut up and there is no rain because they have sinned against you[a], and they pray toward this place and give thanks to your name and turn from their sin because you afflict them[b],
translation:
  language: hi
  text: जब आकाश बन्द हो जाए और वर्षा न हो, क्योंकि उन्होंने तेरे विरुद्ध पाप किया है, और वे इस स्थान की ओर प्रार्थना करें, तेरे नाम की स्तुति करें[a] और अपने पाप से फिरें, क्योंकि तू उन्हें दुःख देता है[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “तेरे नाम का धन्यवाद करें” अथवा “तेरे नाम का सार्वजनिक स्वीकार करें।” इब्रानी क्रिया प्रसंग के अनुसार धन्यवाद, स्तुति या खुले स्वीकार का भाव दे सकती है।
    reason: lexical_alternative
  - marker: b
    text: या “तू उन्हें नम्र करता है।” कुछ लोग इसे “तू उन्हें उत्तर देता है” भी समझते हैं। इब्रानी रूप में ये अर्थ सम्भव हैं, पर सूखे को अनुशासन मानने वाला प्रसंग “दुःख देता है” या “नम्र करता है” के पक्ष में है।
    reason: alternative_reading
lexical_decisions:
- source_word: בְּהֵעָצֵר שָׁמַיִם
  choice: जब आकाश बन्द हो जाए
  rationale: בְּ के कालवाचक प्रयोग और עצר के निफ़अल रूप को स्वाभाविक हिन्दी में व्यक्त करता है। हिन्दी में ‘आकाश’ इस सामूहिक इब्रानी रूप का सामान्य और गरिमापूर्ण समतुल्य है।
- source_word: וְלֹא יִהְיֶה מָטָר
  choice: और वर्षा न हो
  rationale: वर्षा के अभाव को आरम्भिक कालवाचक उपवाक्य के साथ संक्षिप्त और स्वाभाविक रूप से जोड़ता है।
- source_word: כִּי יֶחֶטְאוּ לָךְ
  choice: क्योंकि उन्होंने तेरे विरुद्ध पाप किया है
  rationale: כִּי को कारणवाचक और לָךְ को इस प्रसंग में ‘तेरे विरुद्ध’ समझा गया है; पूर्ण वर्तमान उस पाप को सूखे की वर्तमान परिस्थिति का कारण दिखाता है।
- source_word: וְהִתְפַּלְלוּ אֶל הַמָּקוֹם הַזֶּה
  choice: और तब वे इस स्थान की ओर मुँह करके प्रार्थना करें
  rationale: אֶל यहाँ प्रार्थना की दिशा बताता है, न कि स्थान को प्रार्थना का सम्बोधित पात्र। ‘मुँह करके’ हिन्दी में दिशात्मक अर्थ स्पष्ट और स्वाभाविक बनाता है।
- source_word: וְהוֹדוּ אֶת שְׁמֶךָ
  choice: तेरे नाम की स्तुति करें
  rationale: ידה के हिफ़ईल रूप में धन्यवाद, स्तुति और खुले स्वीकार के परस्पर जुड़े अर्थ हो सकते हैं। ‘स्तुति करें’ हिन्दी में नाम के साथ स्वाभाविक है और मुख्य अर्थ को व्यक्त करता है; अन्य सम्भावनाएँ पादटिप्पणी में सुरक्षित हैं।
- source_word: וּמֵחַטָּאתָם יְשׁוּבוּן
  choice: और अपने पाप से फिरें
  rationale: שׁוב और מִן के संयोजन का पारदर्शी अनुवाद है; यह व्याख्यात्मक धार्मिक पद ‘मन फिराना’ थोपे बिना पाप से विमुख होने का भाव रखता है।
- source_word: כִּי תַעֲנֵם
  choice: क्योंकि तू उन्हें दीन करता है
  rationale: ענה का यह रूप प्रसंग में सुखाड़ के द्वारा अनुशासन या नम्र किए जाने को दर्शाता है। ‘दीन करता है’ दुःख देने और नम्र करने के अर्थ-क्षेत्र को समेटता है, जबकि ‘उत्तर देता है’ की सम्भावना पादटिप्पणी में दी गई है।
theological_decisions:
- issue: मन्दिर की ओर उन्मुख होकर प्रार्थना
  choice: इस स्थान की ओर मुँह करके प्रार्थना करें
  alternative: इस स्थान से प्रार्थना करें
  rationale: वचन प्रार्थना की दिशा बताता है; वह मन्दिर को प्रार्थना का पात्र नहीं बनाता। यह अनुवाद उस भेद को स्पष्ट रखते हुए इब्रानी पूर्वसर्ग का आशय सुरक्षित रखता है।
- issue: תַעֲנֵם का प्रसंगगत अर्थ
  choice: तू उन्हें दीन करता है
  alternative: तू उन्हें उत्तर देता है
  rationale: सुखाड़, पाप और उससे फिरने का क्रम इस खण्ड को परमेश्वर के अनुशासन या नम्र किए जाने के रूप में पढ़ने का समर्थन करता है। फिर भी ‘उत्तर देता है’ भाषिक रूप से सम्भव है, इसलिए उसे पादटिप्पणी में रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किन्तु सहज शैली रखी गई है। परमेश्वर के लिए एकवचन निकट सम्बोधन ‘तू/तेरे’ अपनाया गया है, जो सुलैमान की सीधी प्रार्थना के अनुरूप है। पद अगले वाक्य में जारी रहता है, इसलिए अन्त में अल्पविराम रखा गया है।
