  text: וְ/הַ/מֶּ֣לֶךְ שְׁלֹמֹ֗ה וְ/כָל עֲדַ֤ת יִשְׂרָאֵל֙ הַ/נּוֹעָדִ֣ים עָלָ֔י/ו אִתּ֖/וֹ לִ/פְנֵ֣י הָֽ/אָר֑וֹן מְזַבְּחִים֙ צֹ֣אן וּ/בָקָ֔ר אֲשֶׁ֧ר לֹֽא יִסָּפְר֛וּ וְ/לֹ֥א יִמָּנ֖וּ מֵ/רֹֽב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/005.yaml
  text: And King Solomon[a], and all the assembly of Israel who had assembled before him, were with him before the ark, sacrificing sheep and cattle that could not be counted or numbered because of their great number.
translation:
  language: hi
  text: राजा सुलैमान और इस्राएल की सारी सभा, जो उसके पास इकट्ठी हुई थी,[a] उसके साथ सन्दूक के सामने थे। वे भेड़-बकरियों और गाय-बैलों की बलि चढ़ा रहे थे, जिनकी संख्या इतनी अधिक थी कि उन्हें न तो गिना जा सकता था, न उनका हिसाब लगाया जा सकता था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जो उसके सामने एकत्र हुई थी।” हिब्रू अभिव्यक्ति सुलैमान के संबंध में लोगों के एकत्र होने पर बल दे सकती है।
    reason: हिब्रू הַנּוֹעָדִים עָלָיו के संबंधपरक और स्थानिक अर्थों की वास्तविक अस्पष्टता सुरक्षित रखना।
lexical_decisions:
- source_word: עֲדַת יִשְׂרָאֵל
  choice: इस्राएल की सारी सभा
  rationale: ‘सभा’ सार्वजनिक रूप से एकत्र हुए पूरे समुदाय को स्वाभाविक और गरिमापूर्ण ढंग से व्यक्त करता है तथा बाद की कलीसियाई शब्दावली आरोपित नहीं करता।
- source_word: הַנּוֹעָדִים עָלָיו
  choice: जो उसके पास इकट्ठी हुई थी
  rationale: निफ़अल कृदंत एकत्र होने का भाव देता है और עָלָיו यहाँ सुलैमान के संबंध में या उसकी ओर एकत्र होने को दर्शाता है। हिंदी में ‘उसके पास’ इस संबंध को स्वाभाविक रूप से रखता है; वैकल्पिक स्थानिक अर्थ पादटिप्पणी में सुरक्षित है।
- source_word: אִתּוֹ לִפְנֵי הָאָרוֹן
  choice: उसके साथ सन्दूक के सामने थे
  rationale: हिब्रू का क्रियारहित वाक्यांश हिंदी में ‘थे’ जोड़कर स्पष्ट किया गया है। ‘सन्दूक’ אָרוֹן का स्थापित संदर्भगत अर्थ है और לִפְנֵי का स्थानिक भाव ‘के सामने’ से व्यक्त होता है।
- source_word: מְזַבְּחִים
  choice: बलि चढ़ा रहे थे
  rationale: कृदंत चल रही अनुष्ठानिक क्रिया बताता है; ‘बलि चढ़ा रहे थे’ आधुनिक हिंदी में स्पष्ट और स्वाभाविक है।
- source_word: צֹאן וּבָקָר
  choice: भेड़-बकरियों और गाय-बैलों
  rationale: दोनों सामूहिक पशु-वर्गों को हिंदी में उनके सामान्य युग्मों द्वारा ठोस और सुबोध रूप से व्यक्त किया गया है।
- source_word: אֲשֶׁר לֹא יִסָּפְרוּ וְלֹא יִמָּנוּ מֵרֹב
  choice: इतनी अधिक ... कि उन्हें न तो गिना जा सकता था, न उनकी संख्या का हिसाब लगाया जा सकता था
  rationale: दो समानार्थी हिब्रू क्रियाओं की आलंकारिक पुनरुक्ति को दो हिंदी पदों में बनाए रखा गया है और מֵרֹב का कारणात्मक भाव ‘इतनी अधिक ... कि’ से स्वाभाविक ढंग से व्यक्त हुआ है।
theological_decisions:
- issue: ‘सन्दूक’ की पहचान
  choice: केवल ‘सन्दूक’
  alternative: ‘वाचा का सन्दूक’
  rationale: इस पद के हिब्रू पाठ में केवल הָאָרוֹן है। ‘वाचा का’ जोड़ना व्यापक संदर्भ की सूचना को मूल पद में प्रविष्ट कर देता।
- issue: הַנּוֹעָדִים עָלָיו में संबंध की दिशा
  choice: सुलैमान के पास इकट्ठी हुई सभा
  alternative: सुलैमान के सामने एकत्र हुई सभा
  rationale: עָלָיו सभा के सुलैमान की ओर या उसके संबंध में बुलाए जाने का भाव दे सकता है। मुख्य पाठ में संबंधपरक-दिशात्मक अर्थ चुना गया है, जबकि वास्तविक स्थानिक विकल्प पादटिप्पणी में रखा गया है।
translation_notes:
  register: भाषा आधुनिक मानक हिंदी में, सार्वजनिक पाठ के योग्य गरिमापूर्ण किंतु सहज रखी गई है। संयुक्त कर्ता के कारण बहुवचन ‘थे’ और ‘चढ़ा रहे थे’ प्रयुक्त हैं। ‘गिना’ और ‘संख्या का हिसाब’ मूल की दोहरी अभिव्यक्ति को बिना अत्यधिक कृत्रिमता के बनाए रखते हैं।
