  text: רָעָ֞ב כִּֽי יִהְיֶ֣ה בָ/אָ֗רֶץ דֶּ֣בֶר כִּֽי יִ֠הְיֶה שִׁדָּפ֨וֹן יֵרָק֜וֹן אַרְבֶּ֤ה חָסִיל֙ כִּ֣י יִהְיֶ֔ה כִּ֧י יָֽצַר ל֛/וֹ אֹיְב֖/וֹ בְּ/אֶ֣רֶץ שְׁעָרָ֑י/ו כָּל נֶ֖גַע כָּֽל מַחֲלָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/037.yaml
  text: If there is famine in the land[a], if there is pestilence, blight, mildew, locust, or caterpillar; if his enemy besieges him in the land of his gates; whatever plague[b], whatever sickness—
translation:
  language: hi
  text: यदि देश में अकाल हो, यदि महामारी फैले, फसलों में झुलसन या पीलापन हो, टिड्डियाँ या फसल-भक्षक कीट[a] हों; यदि उसका शत्रु उसके देश के नगरों में उसे घेर ले[b]; कोई भी विपत्ति, कोई भी बीमारी—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी शब्द से ठीक किस कीट का बोध होता है, यह निश्चित नहीं है; यह टिड्डी की किसी विशेष जाति या अवस्था, अथवा किसी अन्य फसल-भक्षक कीट के लिए हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “उसके फाटकों के देश में”; यहाँ “फाटक” नगरों या नगरों के द्वारों के लिए लाक्षणिक रूप से प्रयुक्त है।
    reason: lexical_alternative
lexical_decisions:
- source_word: רָעָב
  choice: अकाल
  rationale: आपदाओं की इस सूची में यह सामान्य भूख नहीं, बल्कि देशव्यापी खाद्य-संकट को सूचित करता है।
- source_word: דֶּבֶר
  choice: महामारी
  rationale: यह व्यापक रूप से फैलने वाले घातक रोग को सूचित करता है; आधुनिक हिन्दी में ‘महामारी’ स्वाभाविक और स्पष्ट है।
- source_word: שִׁדָּפוֹן
  choice: फसलों पर झुलसा
  rationale: यह गर्म या झुलसाने वाली हवा से होने वाली फसल की क्षति अथवा झुलसा रोग को सूचित करता है।
- source_word: יֵרָקוֹן
  choice: पीलापन
  rationale: कृषि-संदर्भ में यह फसल के पीले या मुरझाए पड़ने की दशा है; अनिश्चित रोग-नाम थोपने के बजाय दृश्य प्रभाव रखा गया है।
- source_word: אַרְבֶּה
  choice: टिड्डियाँ
  rationale: यह टिड्डी का सामान्य इब्रानी शब्द है; एकवचन रूप सामूहिक अर्थ रखता है, जिसे हिन्दी में बहुवचन से स्वाभाविक बनाया गया है।
- source_word: חָסִיל
  choice: भक्षक टिड्डियाँ
  rationale: शब्द फसल नष्ट करने वाले कीट, संभवतः टिड्डी की किसी जाति या अवस्था, को सूचित करता है; ‘भक्षक’ इसके मूल विनाशकारी भाव को रखता है।
- source_word: כִּי יָצַר לוֹ אֹיְבוֹ
  choice: यदि उसका शत्रु ... उसे घेर ले
  rationale: צור का हिफ़ील रूप सैन्य दृष्टि से घेरने या घेराबंदी करने का भाव देता है।
- source_word: בְּאֶרֶץ שְׁעָרָיו
  choice: उसके देश के नगरों में
  rationale: शाब्दिक ‘उसके फाटकों के देश में’ में फाटक नगरों के लिए लक्षणा है; मुख्य पाठ में स्वाभाविक हिन्दी दी गई और शाब्दिक चित्र पादटिप्पणी में रखा गया है।
- source_word: כָּל נֶגַע
  choice: कोई भी विपत्ति
  rationale: נֶגַע का अर्थ प्रहार, पीड़ा या विपत्ति तक व्यापक है; इसे केवल रोग तक सीमित नहीं किया गया।
- source_word: כָּל מַחֲלָה
  choice: कोई भी बीमारी
  rationale: यह बीमारी या रोग का सामान्य शब्द है और पिछले व्यापक נֶגַע से भेद बनाए रखता है।
theological_decisions:
- issue: एकवचन सर्वनामों का संदर्भ
  choice: ‘उसका ... उसे ... उसके’ के रूप में मूल एकवचन बनाए रखा
  alternative: स्पष्ट रूप से ‘इस्राएल’ या ‘तेरी प्रजा’ जोड़ना
  rationale: इस पद में संज्ञा दोहराई नहीं गई है; स्पष्ट पहचान जोड़ने से मूल की व्याकरणिक संदर्भ-निर्भरता अनावश्यक रूप से सुलझ जाती।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। कृषि-विपत्तियों को तकनीकी रोग-नामों के बजाय स्पष्ट दृश्य शब्दों में व्यक्त किया गया है। मूल की असंबद्ध आपदा-सूची को हिन्दी में ‘यदि’ और ‘या’ के सहारे स्वाभाविक बनाया गया है; अंतिम डैश वाक्य के अगले पद में जारी रहने को दिखाता है।
