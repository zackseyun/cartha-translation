base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/038.yaml
  text: whatever prayer[a], whatever plea, may be made by any man or by all your people Israel, each knowing the affliction of his own heart and spreading out his hands toward this house[c][b],
translation:
  language: hi
  text: हर वह प्रार्थना या विनती जो किसी व्यक्ति[a] या आपकी सारी प्रजा इस्राएल की ओर से की जाए, जब हर कोई अपने हृदय की पीड़ा[b] को जानता हो और इस भवन[c] की ओर अपने हाथ फैलाता हो—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘किसी व्यक्ति के लिए’; यहाँ इब्रानी पूर्वसर्ग का अर्थ दोनों प्रकार से समझा जा सकता है।
    reason: lexical_alternative
  - marker: b
    text: 'शाब्दिक अर्थ: ‘अपने हृदय का आघात।’'
    reason: lexical_alternative
  - marker: c
    text: अर्थात मन्दिर, जिसे यहाँ ‘यह भवन’ कहा गया है।
    reason: cultural_note
lexical_decisions:
- source_word: כָּל תְּפִלָּה כָל תְּחִנָּה
  choice: चाहे कोई भी प्रार्थना या विनती हो
  rationale: दोनों व्यापक כָּל पदों को स्वाभाविक हिन्दी में समावेशी ‘चाहे कोई भी’ से व्यक्त किया गया है; ‘विनती’ תְּחִנָּה की अनुग्रह माँगने वाली earnest plea का भाव रखती है।
- source_word: לְכָל הָאָדָם לְכֹל עַמְּךָ יִשְׂרָאֵל
  choice: जो किसी व्यक्ति या आपकी सारी प्रजा इस्राएल की ओर से की जाए
  rationale: לְ की यहाँ सम्भावित कर्तृ/सम्बन्धवाची भूमिका को ‘की ओर से’ से व्यक्त किया गया है। ‘व्यक्ति’ आधुनिक हिन्दी में אָדָם के प्रतिनिधिक मानवीय अर्थ को सहज रूप से पहुँचाता है।
- source_word: אֲשֶׁר יֵדְעוּן אִישׁ
  choice: जब हर व्यक्ति ... जानकर
  rationale: אִישׁ का वितरणात्मक बल ‘हर व्यक्ति’ से स्पष्ट होता है; कृदन्तीय ‘जानकर’ इसे आगे के प्रार्थना-भाव के साथ स्वाभाविक रूप से जोड़ता है।
- source_word: נֶגַע לְבָבוֹ
  choice: अपने हृदय की पीड़ा
  rationale: נֶגַע का मूल बिम्ब ‘आघात/महामारी’ तक जा सकता है, पर यहाँ अंतःकरण में जानी गई व्यक्तिगत व्यथा के लिए ‘पीड़ा’ स्पष्ट और गरिमापूर्ण है; शाब्दिक बिम्ब पादटिप्पणी में रखा गया है।
- source_word: וּפָרַשׂ כַּפָּיו
  choice: अपने हाथ फैलाए
  rationale: प्रार्थना में हथेलियाँ/हाथ फैलाने की मुद्रा को प्राकृतिक हिन्दी में व्यक्त करता है।
- source_word: אֶל הַבַּיִת הַזֶּה
  choice: इस भवन की ओर
  rationale: ‘भवन’ से בַּיִת का शब्दगत रूप बना रहता है, जबकि पादटिप्पणी स्पष्ट करती है कि संकेत मन्दिर की ओर है; אֶל की दिशा ‘की ओर’ से व्यक्त हुई है।
theological_decisions:
- issue: לְכָל הָאָדָם में לְ का सम्बन्ध
  choice: किसी व्यक्ति की ओर से
  alternative: किसी व्यक्ति के लिए
  rationale: अगले एकवचन कर्ता—जानने और हाथ फैलाने वाले व्यक्ति—के कारण प्रार्थना करने वाले का अर्थ अधिक सम्भावित है, पर इब्रानी पूर्वसर्ग की वास्तविक अस्पष्टता पादटिप्पणी में सुरक्षित रखी गई है।
- issue: הָאָדָם का प्रतिनिधिक एकवचन
  choice: व्यक्ति
  alternative: मनुष्य
  rationale: इब्रानी एकवचन और वितरणात्मक अर्थ सुरक्षित रहते हैं, जबकि आधुनिक हिन्दी में यह स्त्री और पुरुष दोनों को स्वाभाविक रूप से समेटता है; कोई सांप्रदायिक निष्कर्ष नहीं जोड़ा गया।
- issue: הַבַּיִת का अनुवाद
  choice: भवन
  alternative: मन्दिर
  rationale: मूल के ‘घर/भवन’ पद को मुख्य पाठ में बनाए रखते हुए उसके तत्काल ऐतिहासिक संकेत—मन्दिर—को पादटिप्पणी में स्पष्ट किया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी; भाषा सरल, गरिमापूर्ण और सार्वजनिक पाठ के योग्य रखी गई है। वाक्य अगले पद में जारी प्रार्थना का आश्रित खंड है, इसलिए अंत में डैश रखा गया है।
