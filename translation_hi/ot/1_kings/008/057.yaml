source:
  edition: WLC
  text: יְהִ֨י יְהוָ֤ה אֱלֹהֵ֨י/נוּ֙ עִמָּ֔/נוּ כַּ/אֲשֶׁ֥ר הָיָ֖ה עִם אֲבֹתֵ֑י/נוּ אַל יַעַזְבֵ֖/נוּ וְ/אַֽל יִטְּשֵֽׁ/נוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/057.yaml
  text: May Yahweh our God be with us[a], as he was with our fathers. May he not forsake us or abandon us.
translation:
  language: hi
  text: याहवे हमारा परमेश्वर हमारे साथ रहे, जैसे वह हमारे पुरखाओं के साथ था। वह न तो हमें छोड़े, न हमें त्यागे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהִי
  choice: रहे
  rationale: היה का जुस्सिव रूप यहाँ प्रार्थनापूर्ण कामना व्यक्त करता है; हिंदी में “रहे” इसे स्वाभाविक और संक्षिप्त ढंग से व्यक्त करता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: इब्रानी चतुराक्षरीय व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय हिंदी में प्रचलित नाम-रूप “यहोवा” से व्यक्त किया गया है।
- source_word: אֱלֹהֵינוּ
  choice: हमारा परमेश्वर
  rationale: एकवचन संज्ञा पर प्रथम पुरुष बहुवचन प्रत्यय का सीधा अर्थ है “हमारा परमेश्वर।”
- source_word: עִמָּנוּ
  choice: हमारे साथ
  rationale: עם यहाँ संगति और उपस्थिति दर्शाता है; “हमारे साथ” हिंदी में सटीक और स्वाभाविक है।
- source_word: כַּאֲשֶׁר
  choice: जैसे
  rationale: यह परमेश्वर की वर्तमान अपेक्षित उपस्थिति की तुलना पिछली पीढ़ियों के साथ उसकी उपस्थिति से करता है।
- source_word: הָיָה עִם אֲבֹתֵינוּ
  choice: वह हमारे पुरखाओं के साथ था
  rationale: “पुरखाओं” से אבותינו का पुरुषवाची और पूर्वज-संबंधी अर्थ सहज आधुनिक हिंदी में बना रहता है।
- source_word: אַל יַעַזְבֵנוּ
  choice: वह न तो हमें छोड़े
  rationale: निषेधात्मक जुस्सिव को प्रार्थनापूर्ण “न ... छोड़े” से व्यक्त किया गया है; इससे परमेश्वर के अपने लोगों से अलग न होने की विनती स्पष्ट रहती है।
- source_word: וְאַל יִטְּשֵׁנוּ
  choice: न हमें त्यागे
  rationale: נטש का अर्थ छोड़ देना या परित्याग करना है; “त्यागे” समानांतरता रखते हुए עזב के “छोड़े” से शब्दगत भेद भी बनाए रखता है।
theological_decisions:
- issue: יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ में परमेश्वर का व्यक्तिगत वाचा-नाम है। हिंदी बाइबल-पाठकों में पहचाने जाने वाले “यहोवा” रूप द्वारा नाम को उपाधि से प्रतिस्थापित नहीं किया गया।
- issue: אֲבֹתֵינוּ का अनुवाद
  choice: हमारे पुरखाओं
  alternative: हमारे पूर्वजों / हमारे पितरों
  rationale: मूल का पुरुषवाची बहुवचन और इस्राएल के पूर्वपुरुषों का संदर्भ सुरक्षित रखते हुए “पुरखाओं” को वर्तमान, सामान्य और गरिमापूर्ण हिंदी के लिए चुना गया।
- issue: עזב और נטש की समानांतर क्रियाएँ
  choice: छोड़े ... त्यागे
  alternative: त्यागे ... छोड़ दे
  rationale: दोनों निकटार्थी क्रियाओं को एक ही शब्द में समतल नहीं किया गया; इससे संचयी विनती और काव्यात्मक समानांतरता बनी रहती है।
translation_notes:
  register: आधुनिक मानक हिंदी, प्रार्थनापूर्ण और गरिमापूर्ण शैली। वाक्य-विन्यास सरल रखा गया है। “न तो ... न ...” दोनों निषेधात्मक जुस्सिवों को एक संयुक्त विनती के रूप में स्वाभाविक ढंग से प्रस्तुत करता है।
