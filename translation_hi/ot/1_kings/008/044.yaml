id: 1KI.8.44
reference: 1 Kings 8:44
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: כִּי יֵצֵ֨א עַמְּ/ךָ֤ לַ/מִּלְחָמָה֙ עַל אֹ֣יְב֔/וֹ בַּ/דֶּ֖רֶךְ אֲשֶׁ֣ר תִּשְׁלָחֵ֑/ם וְ/הִתְפַּֽלְל֣וּ אֶל יְהוָ֗ה דֶּ֤רֶךְ הָ/עִיר֙ אֲשֶׁ֣ר בָּחַ֣רְתָּ בָּ֔/הּ וְ/הַ/בַּ֖יִת אֲשֶׁר בָּנִ֥תִי לִ/שְׁמֶֽ/ךָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/044.yaml
  text: When your people go out to battle against their enemy by the way you send them[a], and they pray to Yahweh toward the city that you have chosen and the house that I have built for your name[b],
translation:
  language: hi
  text: जब तेरी प्रजा अपने शत्रु से युद्ध करने के लिए उस मार्ग से निकले जिस पर तू उन्हें भेजे, और वे तेरे चुने हुए नगर की ओर[a] तथा उस भवन[b] की ओर, जिसे मैंने तेरे नाम के लिए बनाया है, याहवे से प्रार्थना करें,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “नगर की दिशा में”; आशय प्रार्थना करते समय उस नगर की ओर उन्मुख होने से है।
    reason: lexical_alternative
  - marker: b
    text: अर्थात मंदिर; इब्रानी में “घर।”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: जब
  rationale: यहाँ כִּי प्रार्थना में एक संभावित परिस्थिति प्रस्तुत करता है। हिंदी में ‘जब’ इस क्रम के प्रवाह के अनुकूल है; संदर्भ में इसका भाव ‘यदि’ के निकट भी हो सकता है।
- source_word: יֵצֵא עַמְּךָ לַמִּלְחָמָה
  choice: तेरी प्रजा ... युद्ध करने के लिए ... निकले
  rationale: יֵצֵא का मूल अर्थ ‘निकले’ है और לַמִּלְחָמָה युद्ध के उद्देश्य को बताता है। यह रूप सैन्य प्रसंग को स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: עַל אֹיְבוֹ
  choice: अपने शत्रु से
  rationale: עַל यहाँ विरोध का संबंध व्यक्त करता है। सामूहिक संज्ञा ‘प्रजा’ के साथ एकवचन ‘अपने शत्रु’ मूल पाठ के एकवचन प्रत्यय को बनाए रखता है।
- source_word: בַּדֶּרֶךְ אֲשֶׁר תִּשְׁלָחֵם
  choice: उस मार्ग से ... जिस पर तू उन्हें भेजे
  rationale: דֶּרֶךְ के ठोस अर्थ ‘मार्ग’ को बनाए रखते हुए वाक्यांश यह बताता है कि अभियान की दिशा परमेश्वर द्वारा निर्धारित है।
- source_word: וְהִתְפַּלְלוּ אֶל יְהוָה
  choice: याहवे से प्रार्थना करें
  rationale: התפלל का सामान्य अर्थ ‘प्रार्थना करना’ है। יְהוָה को उसके व्यक्तिगत नाम के लिप्यंतरण ‘याहवे’ से व्यक्त किया गया है।
- source_word: דֶּרֶךְ הָעִיר
  choice: नगर की ओर
  rationale: यहाँ דֶּרֶךְ प्रार्थना करते समय दिशा या अभिमुखता बताता है; ‘की ओर’ हिंदी में इसका सहज रूप है।
- source_word: הָעִיר אֲשֶׁר בָּחַרְתָּ בָּהּ
  choice: तेरे चुने हुए नगर
  rationale: यह संक्षिप्त रूप मूल अर्थ को स्वाभाविक हिंदी में रखता है और नगर के चुने जाने का कोई अतिरिक्त उद्देश्य पाठ में नहीं जोड़ता।
- source_word: וְהַבַּיִת
  choice: तथा उस भवन
  rationale: בַּיִת का शाब्दिक अर्थ ‘घर/भवन’ है। यहाँ संदर्भ मंदिर का है, पर ‘भवन’ मूल की उपमा और गरिमा को बनाए रखते हुए हिंदी में अधिक सहज है।
- source_word: אֲשֶׁר בָּנִתִי לִשְׁמֶךָ
  choice: जिसे मैंने तेरे नाम के लिए बनाया है
  rationale: ‘तेरे नाम के लिए’ परमेश्वर के नाम, प्रतिष्ठा और प्रकट उपस्थिति से जुड़ी महत्वपूर्ण बाइबलीय अभिव्यक्ति को बिना विस्तार किए सुरक्षित रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में उपाधि नहीं, चार अक्षरों वाला व्यक्तिगत ईश्वरीय नाम है। ‘याहवे’ उसका प्रचलित विद्वत्तापूर्ण लिप्यंतरण है और नाम को शीर्षक से नहीं बदलता।
- issue: הַבַּיִת के लिए मंदिर-संबंधी शब्दावली
  choice: भवन
  alternative: मंदिर; घर
  rationale: संदर्भ में यह मंदिर है, किंतु इब्रानी पाठ सामान्य शब्द ‘घर’ का प्रयोग करता है। ‘भवन’ उस शब्द-चित्र को बनाए रखता है; पादटिप्पणी संदर्भ स्पष्ट करती है।
- issue: प्रार्थना की दिशा
  choice: नगर और भवन की ओर
  alternative: नगर और भवन का सामना करके
  rationale: דֶּרֶךְ दिशात्मक है, पर शरीर की निश्चित मुद्रा को स्पष्ट रूप से निर्धारित नहीं करता। ‘की ओर’ मूल की अर्थ-सीमा और संभावित व्यापकता को सुरक्षित रखता है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिंदी। परमेश्वर को संबोधन में ‘तू/तेरी’ रखा गया है, क्योंकि यह निकट और प्रत्यक्ष प्रार्थना-भाषा है। पद अगले वाक्य में जारी रहता है, इसलिए अंत में अल्पविराम रखा गया है।
