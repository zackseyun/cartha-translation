  yaml_path: translation/ot/1_kings/008/052.yaml
  text: that your eyes may be open to the plea of your servant and to the plea of your people Israel[b][a], to listen to them whenever they call to you.
translation:
  language: hi
  text: कि तेरी आँखें अपने सेवक की विनती[a] और अपनी प्रजा इस्राएल की विनती की ओर खुली रहें, ताकि जब-जब वे तुझे पुकारें, तू उनकी सुने[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘करुणा की याचना।’ इब्रानी शब्द कृपा या दया पाने के लिए की गई गंभीर विनती को दर्शाता है।
    reason: lexical_alternative
  - marker: b
    text: या ‘तू उनकी बात सुने।’ इब्रानी क्रिया का अर्थ संदर्भ के अनुसार ‘सुनना,’ ‘ध्यान से सुनना,’ या ‘ध्यान देना’ हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: לִהְיוֹת
  choice: कि ... खुली रहें
  rationale: लामेदयुक्त क्रियार्थक रूप पिछले संदर्भ में सुलैमान की प्रार्थना को आगे बढ़ाता है। हिंदी में ‘कि ... रहें’ विनती और अपेक्षित परिणाम का भाव स्वाभाविक रूप से व्यक्त करता है।
- source_word: עֵינֶיךָ פְתֻחוֹת
  choice: तेरी आँखें ... खुली रहें
  rationale: यह परमेश्वर की सचेत कृपा और प्रार्थना सुनने की तत्परता का मानवरूपी रूपक है; मूल बिंब को बिना व्याख्यात्मक विस्तार के बनाए रखा गया है।
- source_word: תְּחִנַּת
  choice: विनती
  rationale: यह शब्द कृपा या दया पाने के लिए की गई earnest याचना को सूचित करता है। ‘विनती’ आधुनिक हिंदी में स्वाभाविक, गरिमापूर्ण और प्रार्थना-संदर्भ के अनुकूल है।
- source_word: עַבְדְּךָ
  choice: अपने सेवक
  rationale: सुलैमान परमेश्वर के सामने स्वयं को सेवक कहता है। इस राजकीय प्रार्थना-संदर्भ में ‘सेवक’ अधिक उपयुक्त है; ‘दास’ यहाँ अनावश्यक रूप से बंधुआ स्थिति को प्रमुख कर सकता है।
- source_word: עַמְּךָ יִשְׂרָאֵל
  choice: अपनी प्रजा इस्राएल
  rationale: यह पद इस्राएल को परमेश्वर की प्रजा के रूप में पहचानता है। ‘प्रजा’ राजकीय संदर्भ में स्वाभाविक है और संबंधसूचक भाव को स्पष्ट रखता है।
- source_word: לִשְׁמֹעַ אֲלֵיהֶם
  choice: तू उनकी सुन ले
  rationale: שׁמע यहाँ केवल ध्वनि सुनने से अधिक ध्यानपूर्वक सुनने या स्वीकार करने का भाव रख सकता है। हिंदी मुहावरा ‘उनकी सुन ले’ उस सक्रिय प्रत्युत्तर के भाव को स्वाभाविक ढंग से व्यक्त करता है, जबकि विकल्प पादटिप्पणी में रखा गया है।
- source_word: בְּכֹל קָרְאָם אֵלֶיךָ
  choice: जब-जब वे तुझे पुकारें
  rationale: בְּכֹל के साथ यह रचना हर अवसर पर होने वाली क्रिया का कालवाचक अर्थ देती है। ‘जब-जब’ ‘हर बार/जब कभी’ का भाव स्पष्ट और सहज रूप से व्यक्त करता है।
theological_decisions:
- issue: परमेश्वर के लिए मानवरूपी भाषा—‘तेरी आँखें ... खुली रहें’
  choice: मुख्य पाठ में आँखों का मूल रूपक बनाए रखा गया
  alternative: ‘तू ध्यान देता रहे’ जैसे अर्थानुवाद से रूपक हटाना
  rationale: इब्रानी पाठ परमेश्वर की सजग कृपा को शारीरिक बिंब से व्यक्त करता है। मूल रूपक साहित्यिक और धर्मवैचारिक तनाव को सुरक्षित रखता है, बिना परमेश्वर की देहधारिता का निष्कर्ष जोड़े।
- issue: שׁמע में सुनने और ध्यान देने/स्वीकार करने का अर्थ-परास
  choice: ‘तू उनकी सुन ले’
  alternative: ‘तू उनकी बात सुन’
  rationale: प्रार्थना के संदर्भ में क्रिया केवल श्रवण नहीं, ध्यानपूर्वक सुनने या प्रत्युत्तर देने की ओर संकेत कर सकती है। चुना गया हिंदी मुहावरा इस अर्थ-परास को खुला रखता है।
translation_notes:
  register: आधुनिक मानक हिंदी, देवनागरी, प्रार्थनापूर्ण और गरिमापूर्ण शैली। परमेश्वर के लिए एकवचन आत्मीय संबोधन ‘तू/तेरी/तुझे’ रखा गया है, जो निकटवर्ती प्रार्थना-वाक्य के अनुरूप है। सभी पादटिप्पणी चिह्न मुख्य पाठ में उपस्थित हैं।
