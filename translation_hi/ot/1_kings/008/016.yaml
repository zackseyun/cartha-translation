  edition: WLC
  text: מִן הַ/יּ֗וֹם אֲשֶׁ֨ר הוֹצֵ֜אתִי אֶת עַמִּ֣/י אֶת יִשְׂרָאֵל֮ מִ/מִּצְרַיִם֒ לֹֽא בָחַ֣רְתִּי בְ/עִ֗יר מִ/כֹּל֙ שִׁבְטֵ֣י יִשְׂרָאֵ֔ל לִ/בְנ֣וֹת בַּ֔יִת לִ/הְי֥וֹת שְׁמִ֖/י שָׁ֑ם וָ/אֶבְחַ֣ר בְּ/דָוִ֔ד לִֽ/הְי֖וֹת עַל עַמִּ֥/י יִשְׂרָאֵֽל־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/016.yaml
  text: From the day that I brought my people Israel out of Egypt[a], I have not chosen a city from all the tribes of Israel to build a house for my name to be there[b], but I chose David to be over my people Israel.
translation:
  language: hi
  text: जिस दिन मैं अपनी प्रजा इस्राएल को मिस्र से निकाल लाया, उस दिन से मैंने इस्राएल के सभी गोत्रों में से किसी नगर को नहीं चुना कि उसमें मेरे नाम के वहाँ रहने के लिए एक भवन बनाया जाए[b]; परन्तु[a] मैंने दाऊद को चुना कि वह मेरी प्रजा इस्राएल का अगुआ हो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या, “और मैंने दाऊद को चुना।” इब्रानी संयोजक का अर्थ “और” भी हो सकता है, पर सन्दर्भ विरोध को अधिक सम्भावित बनाता है: कोई नगर नहीं चुना गया था, जबकि दाऊद चुना गया था।'
    reason: lexical_alternative
  - marker: b
    text: “मेरे नाम के वहाँ रहने के लिए एक भवन” इब्रानी अभिव्यक्ति है। इसका आशय उस पवित्रस्थान से है जो यहोवा के नाम और उसकी उपस्थिति से जुड़ा हो—अर्थात मन्दिर।
    reason: cultural_note
lexical_decisions:
- source_word: הוֹצֵאתִי
  choice: निकाल लाया
  rationale: हिफ़ील रूप का कारणवाचक अर्थ सुरक्षित रहता है और निर्गमन के लिए यह स्वाभाविक आधुनिक हिन्दी है।
- source_word: עַמִּי אֶת־יִשְׂרָאֵל
  choice: अपनी प्रजा इस्राएल
  rationale: यह समानाधिकरण की रचना है, जिसमें ‘इस्राएल’ ‘मेरी प्रजा’ की पहचान बताता है।
- source_word: בְעִיר מִכֹּל שִׁבְטֵי יִשְׂרָאֵל
  choice: इस्राएल के सभी गोत्रों में से किसी नगर को
  rationale: इब्रानी की संक्षिप्त रचना का अर्थ किसी भी गोत्र से सम्बद्ध नगर है; यह हिन्दी उस सम्बन्ध और निषेध दोनों को स्पष्ट रखती है।
- source_word: לִבְנוֹת בַּיִת
  choice: एक भवन बनाया जाए
  rationale: ‘भवन’ मूल शब्द के सामान्य अर्थ को बनाए रखता है; सीधे ‘मन्दिर’ कहने से निहितार्थ को मूल पाठ में जोड़ दिया जाता। कर्मवाच्य हिन्दी में अनिर्दिष्ट निर्माता को स्वाभाविक रूप से व्यक्त करता है।
- source_word: לִהְיוֹת שְׁמִי שָׁם
  choice: मेरा नाम वहाँ रहे
  rationale: मूल क्रिया ‘होना’ के निकट रहते हुए हिन्दी में ‘नाम’ के साथ ‘रहे’ स्वाभाविक है; ‘निवास करे’ अनावश्यक व्याख्या होती।
- source_word: וָאֶבְחַר בְּדָוִד
  choice: परन्तु मैंने दाऊद को चुना
  rationale: 'वाव को सन्दर्भगत विरोध के रूप में प्रस्तुत किया गया है: कोई नगर नहीं चुना गया, पर दाऊद चुना गया।'
- source_word: לִהְיוֹת עַל־עַמִּי יִשְׂרָאֵל
  choice: कि वह मेरी प्रजा इस्राएल के ऊपर रहे
  rationale: ‘ऊपर रहे’ मूल अभिव्यक्ति को सुरक्षित रखता है और अधिकार के स्वरूप को ‘राज करे’ जैसे अधिक स्पष्ट शब्द से सीमित नहीं करता।
theological_decisions:
- issue: ‘मेरे नाम के लिए भवन’ से जुड़ा मन्दिर-विषयक भाव
  choice: ‘एक भवन बनाया जाए और मेरा नाम वहाँ रहे’
  alternative: ‘मेरे नाम का मन्दिर बनाया जाए’ या ‘जहाँ मेरा नाम निवास करे’
  rationale: मूल पाठ की ‘नाम’ सम्बन्धी धर्मवैचारिक भाषा सुरक्षित रखी गई है, बिना ‘मन्दिर’ अथवा ‘निवास’ को स्पष्ट रूप से जोड़कर उसका अर्थ पहले से तय किए।
- issue: नगर के न चुने जाने और दाऊद के चुने जाने के बीच सम्बन्ध
  choice: वाव का अनुवाद ‘परन्तु’
  alternative: ‘और’
  rationale: सन्दर्भ दोनों कथनों में विरोध दिखाता है, किन्तु संयोजक पठन की वास्तविक सम्भावना पादटिप्पणी में रखी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किन्तु सहज शैली रखी गई है। ‘प्रजा’, ‘गोत्र’, ‘भवन’ और ‘ऊपर रहे’ मूल की वाचा-संबन्धी तथा राजकीय भाषा को बनाए रखते हैं; वाक्य-विन्यास को हिन्दी में बोधगम्य बनाने के लिए ‘उस दिन से’ दोहराया गया है।
