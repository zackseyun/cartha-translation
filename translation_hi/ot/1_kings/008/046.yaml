id: 1KI.8.46
reference: 1 Kings 8:46
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: כִּ֣י יֶֽחֶטְאוּ לָ֗/ךְ כִּ֣י אֵ֤ין אָדָם֙ אֲשֶׁ֣ר לֹא יֶחֱטָ֔א וְ/אָנַפְתָּ֣ בָ֔/ם וּ/נְתַתָּ֖/ם לִ/פְנֵ֣י אוֹיֵ֑ב וְ/שָׁב֤וּ/ם שֹֽׁבֵי/הֶם֙ אֶל אֶ֣רֶץ הָ/אוֹיֵ֔ב רְחוֹקָ֖ה א֥וֹ קְרוֹבָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/046.yaml
  text: When they sin against you—for there is no one who does not sin—and you become angry with them and give them over to an enemy[a], and their captors carry them away captive to the land of the enemy, whether far away or near,
translation:
  language: hi
  text: जब वे आपके विरुद्ध पाप करें—क्योंकि ऐसा कोई मनुष्य नहीं जो पाप न करता हो—और आप उन पर क्रोधित होकर उन्हें किसी शत्रु के हाथ में कर दें, और उनके बंदी बनाने वाले उन्हें बंदी बनाकर शत्रु के देश में ले जाएँ, चाहे वह दूर हो या पास,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי יֶחֶטְאוּ לָךְ
  choice: जब वे आपके विरुद्ध पाप करें
  rationale: आरम्भिक כִּי प्रार्थना के भीतर संभावित परिस्थिति प्रस्तुत करता है; संदर्भ में पाप की सार्वभौमिकता के कारण ‘जब’ स्वाभाविक है, जबकि ‘करें’ शर्त-सदृश भाव बनाए रखता है। חטא + ל का संबंधपरक अपराध ‘आपके विरुद्ध पाप’ से स्पष्ट होता है।
- source_word: אֵין אָדָם אֲשֶׁר לֹא יֶחֱטָא
  choice: ऐसा कोई मनुष्य नहीं जो पाप न करता हो
  rationale: אָדָם यहाँ समस्त मानवजाति के लिए एकवचन जातिवाचक रूप में है। ‘कोई मनुष्य’ आधुनिक हिन्दी में समावेशी, स्पष्ट और स्रोत के मानव-संदर्भ के निकट है।
- source_word: וְאָנַפְתָּ בָם
  choice: और आप उन पर क्रोधित होकर
  rationale: אָנַף ईश्वरीय क्रोध व्यक्त करता है। ‘क्रोधित होकर’ अगले परिणाम से स्वाभाविक रूप से जुड़ता है और तीव्रता को अनावश्यक रूप से नहीं बढ़ाता।
- source_word: וּנְתַתָּם לִפְנֵי אוֹיֵב
  choice: उन्हें किसी शत्रु के हाथ में कर दें
  rationale: נתן + לפני यहाँ शत्रु के अधिकार में सौंपे जाने का भाव देता है। अनिश्चित, लेखरहित singular אוֹיֵב के लिए ‘किसी शत्रु’ उपयुक्त है।
- source_word: וְשָׁבוּם שֹׁבֵיהֶם
  choice: उन्हें बंदी बनानेवाले उन्हें बंदी बनाकर ... ले जाएँ
  rationale: यह शब्दालंकारात्मक धातु-पुनरावृत्ति captors और captive action दोनों को व्यक्त करती है; हिन्दी में पुनरावृत्ति अर्थ को पूर्ण रूप से सुरक्षित रखती है।
- source_word: אֶל אֶרֶץ הָאוֹיֵב
  choice: शत्रु के देश में
  rationale: यहाँ הָאוֹיֵב निश्चित है; हिन्दी संबंधवाचक रचना ‘शत्रु के देश’ स्वाभाविक है और निश्चित संदर्भ को बनाए रखती है।
- source_word: רְחוֹקָה אוֹ קְרוֹבָה
  choice: चाहे वह दूर हो या पास
  rationale: स्त्रीलिंग विशेषण ‘देश/भूमि’ की दूरी बताते हैं। ‘वह’ स्पष्ट करता है कि दूर या पास शत्रु का देश है।
theological_decisions:
- issue: אָדָם का जातिवाचक प्रयोग
  choice: कोई मनुष्य
  alternative: कोई व्यक्ति
  rationale: यह पद सार्वभौमिक मानवीय पापशीलता कहता है, किसी एक लिंग तक कथन सीमित नहीं करता। ‘मनुष्य’ स्रोत के אָדָם को निकटता से दर्शाते हुए आधुनिक हिन्दी में समस्त मानवता को समेटता है।
- issue: ईश्वरीय क्रोध और शत्रु के हाथ सौंपना
  choice: आप उन पर क्रोधित होकर उन्हें किसी शत्रु के हाथ में कर दें
  alternative: आप उनसे क्रोधित हों और उन्हें किसी शत्रु के सामने दे दें
  rationale: पहला रूप क्रम और कारणगत संबंध को स्वाभाविक हिन्दी में व्यक्त करता है, पर मूल पाठ के अनुसार क्रोध और सौंपने—दोनों कर्ताओं को परमेश्वर से ही संबद्ध रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में आदरसूचक ‘आप’ रखा गया है। शैली प्रार्थनात्मक, गरिमापूर्ण और सामान्य पाठक के लिए सहज है। पद अगले वाक्य में जारी रहता है, इसलिए अंत में अल्पविराम रखा गया है।
