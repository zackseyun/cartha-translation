base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/043.yaml
  text: may you hear in heaven[a], the place where you dwell, and do according to all that the foreigner calls to you for, so that all the peoples of the earth may know your name, to fear you as your people Israel do[b], and to know that your name is called on this house that I have built.
translation:
  language: hi
  text: तू अपने निवास-स्थान, स्वर्ग से सुनना और उस परदेशी के लिए वैसा ही करना, जिस किसी बात के लिए वह तुझे पुकारे[a], ताकि पृथ्वी के सभी लोग तेरा नाम जानें, और जैसे तेरी प्रजा इस्राएल तेरा भय मानती है, वैसे ही वे भी तेरा भय मानें, और जानें कि इस भवन पर, जिसे मैंने बनाया है, तेरा नाम लिया जाता है[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘जिस किसी बात के लिए वह तुझसे विनती करे’ अथवा ‘तेरी दुहाई दे।’
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, ‘इस भवन पर तेरा नाम पुकारा जाता है।’ यह मुहावरा दर्शाता है कि यह भवन तेरा है या तेरा नाम धारण करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּשְׁמַע
  choice: तू ... सुनना
  rationale: प्रार्थना के प्रसंग में अपूर्ण क्रिया निवेदन या विनती का भाव रखती है। हिन्दी में ‘तू ... सुनना’ इस विनती को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: הַשָּׁמַיִם מְכוֹן שִׁבְתֶּךָ
  choice: स्वर्ग में, जो तेरा निवास-स्थान है
  rationale: वाक्यांश स्वर्ग को परमेश्वर के निवास-स्थान के रूप में स्पष्ट करता है। ‘स्वर्ग में’ प्रसंगानुकूल स्थानवाचक अर्थ देता है, जबकि अगला उपवाक्य मूल के समानार्थक स्पष्टीकरण को बनाए रखता है।
- source_word: וְעָשִׂיתָ כְּכֹל אֲשֶׁר
  choice: उसके अनुसार करना
  rationale: व्यापक क्रिया ‘करना’ परमेश्वर के उत्तरदायी कार्य को अनावश्यक रूप से सीमित नहीं करती; ‘अनुसार’ כְּ की तुलना-अनुरूपता को रखता है।
- source_word: יִקְרָא אֵלֶיךָ
  choice: तुझे पुकारे
  rationale: קרא אל का मूल भाव किसी को पुकारना है और यहाँ यह प्रार्थनापूर्ण पुकार है। मुख्य पाठ में ‘पुकारे’ रखा गया है, जबकि माँगने या सहायता की दुहाई देने की छाया पादटिप्पणी में दी गई है।
- source_word: הַנָּכְרִי
  choice: परदेशी
  rationale: यह किसी दूसरे जनसमुदाय से आए व्यक्ति को दर्शाता है। आधुनिक हिन्दी में ‘परदेशी’ स्पष्ट और गरिमापूर्ण है।
- source_word: כָּל עַמֵּי הָאָרֶץ
  choice: पृथ्वी के सभी लोग
  rationale: यह सार्वभौमिक दायरे को स्वाभाविक हिन्दी में व्यक्त करता है और ‘जातियाँ’ से उत्पन्न आधुनिक जाति-व्यवस्था संबंधी भ्रम से बचता है।
- source_word: לְיִרְאָה אֹתְךָ
  choice: तेरा भय मानें
  rationale: ‘भय मानना’ बाइबिलीय प्रयोग में श्रद्धा, विस्मय और पवित्र भय की संयुक्त धारणा को बनाए रखता है; केवल ‘आदर करना’ अर्थ को अनावश्यक रूप से नरम कर देता।
- source_word: שִׁמְךָ נִקְרָא עַל הַבַּיִת הַזֶּה
  choice: इस भवन पर ... तेरा नाम पुकारा जाता है
  rationale: यह मूल इब्रानी मुहावरे की ठोस भाषा और उसकी संभावित अर्थ-छायाओं को बनाए रखता है; स्वामित्व और नाम-सम्बन्ध का आशय पादटिप्पणी में स्पष्ट किया गया है।
theological_decisions:
- issue: יִרְאָה में भय और श्रद्धा का संबंध
  choice: तेरा भय मानें
  alternative: तेरा आदर करें / तेरे प्रति श्रद्धा रखें
  rationale: मूल शब्द में श्रद्धा और विस्मय के साथ वास्तविक भय की धार भी है। ‘भय मानें’ इस धर्मवैचारिक तनाव को मिटाए बिना आधुनिक हिन्दी में समझ में आता है।
- issue: मन्दिर पर परमेश्वर का नाम पुकारे जाने का मुहावरा
  choice: इस भवन पर ... तेरा नाम पुकारा जाता है
  alternative: यह भवन तेरे नाम का कहलाता है / यह भवन तेरा है
  rationale: सीधा मुहावरा भवन पर परमेश्वर के नाम, अधिकार और सम्बन्ध—तीनों की सम्भावना खुली रखता है। अधिक व्याख्यात्मक विकल्प इनमें से किसी एक अर्थ को मुख्य पाठ में निश्चित कर देते।
- issue: इस्राएल और पृथ्वी के लोगों के बीच तुलना
  choice: तेरी प्रजा इस्राएल के समान तेरा भय मानें
  alternative: जैसा तेरी प्रजा इस्राएल करती है, वैसे ही तेरा भय मानें
  rationale: मूल पाठ पृथ्वी के लोगों की अपेक्षित प्रतिक्रिया की तुलना इस्राएल से करता है। संक्षिप्त हिन्दी संरचना इस समानता को बिना अतिरिक्त धर्मवैचारिक निष्कर्ष जोड़े सुरक्षित रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण प्रार्थना-शैली रखी गई है। परमेश्वर के लिए निकट और परम्परागत एकवचन ‘तू/तेरा’ प्रयुक्त है। ‘भवन’ मन्दिर-सन्दर्भ के योग्य औपचारिक किन्तु सामान्य शब्द है। वाक्य की दीर्घ प्रार्थनात्मक संरचना मूल से मेल खाते हुए हिन्दी विराम-चिह्नों द्वारा स्पष्ट की गई है।
