source:
  edition: WLC
  text: וַ/יַּעֲמֹ֣ד שְׁלֹמֹ֗ה לִ/פְנֵי֙ מִזְבַּ֣ח יְהוָ֔ה נֶ֖גֶד כָּל קְהַ֣ל יִשְׂרָאֵ֑ל וַ/יִּפְרֹ֥שׂ כַּפָּ֖י/ו הַ/שָּׁמָֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/022.yaml
  text: Then Solomon stood before the altar of Yahweh in front of all the assembly of Israel and spread out his hands toward heaven[a].
translation:
  language: hi
  text: तब सुलैमान इस्राएल की सारी सभा के सामने याहवे की वेदी के आगे खड़ा हुआ और उसने अपने हाथ आकाश[a] की ओर फैलाए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से ‘आकाशों’।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲמֹד
  choice: खड़ा हुआ
  rationale: यह कथात्मक क्रम में एक साधारण भूतकालीन क्रिया है; ‘खड़ा हुआ’ आधुनिक हिन्दी में स्वाभाविक है और अनावश्यक बल नहीं जोड़ता।
- source_word: לִפְנֵי מִזְבַּח יְהוָה
  choice: याहवे की वेदी के आगे
  rationale: לִפְנֵי का स्थानसूचक अर्थ रखा गया है। ‘आगे’ अगले पदबंध में प्रयुक्त ‘सामने’ की असहज पुनरावृत्ति से बचाता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुराक्षरीय व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय हिन्दी लिप्यंतरण में रखा गया है।
- source_word: נֶגֶד כָּל קְהַל יִשְׂרָאֵל
  choice: इस्राएल की सारी सभा के सामने
  rationale: נֶגֶד सार्वजनिक रूप से सभा के सम्मुख होने का स्थानसूचक भाव देता है; קָהָל के लिए ‘सभा’ स्पष्ट और वर्तमान हिन्दी है।
- source_word: וַיִּפְרֹשׂ כַּפָּיו
  choice: उसने अपने हाथ … फैलाए
  rationale: כַּף का शाब्दिक अर्थ ‘हथेली’ हो सकता है, पर प्रार्थना की इस मुद्रा में हिन्दी का स्वाभाविक प्रयोग ‘हाथ फैलाना’ है।
- source_word: הַשָּׁמָיִם
  choice: आकाश
  rationale: इस दिशा-सूचक प्रार्थना-संदर्भ में ‘आकाश की ओर’ स्वाभाविक हिन्दी है; इब्रानी रूप की व्याकरणिक बहुवचनता पाद-टिप्पणी में बताई गई है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: प्रभु / यहोवा
  rationale: मूल पाठ में व्यक्तिगत वाचा-नाम सीधे प्रयुक्त है। ‘याहवे’ उसका प्रचलित विद्वत्तापूर्ण हिन्दी लिप्यंतरण है और उसे किसी उपाधि में नहीं बदलता।
- issue: הַשָּׁמָיִם का वचन और अर्थ
  choice: आकाश
  alternative: आकाशों
  rationale: इब्रानी शब्द रूपतः बहुवचन है, किंतु यहाँ दिशा बताने वाले मुहावरे में सामूहिक अर्थ देता है। मुख्य पाठ में स्वाभाविक हिन्दी रखी गई और रूपगत बात पाद-टिप्पणी में सुरक्षित की गई।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सार्वजनिक उपासना के प्रसंग के अनुकूल रखी गई है। वाक्य-क्रम को हिन्दी में स्वाभाविक बनाने के लिए सभा वाला पदबंध वेदी वाले पदबंध से पहले रखा गया है, जबकि दोनों स्थानसूचक संबंध सुरक्षित हैं।
