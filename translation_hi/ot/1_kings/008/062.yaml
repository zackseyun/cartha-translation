base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/062.yaml
  text: And the king and all Israel with him were sacrificing sacrifices before Yahweh[a].
translation:
  language: hi
  text: और राजा तथा उसके साथ समस्त इस्राएल यहोवा के सामने बलिदान चढ़ा रहे थे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהַמֶּלֶךְ
  choice: और राजा
  rationale: वाव कथा को आगे बढ़ाता है; निश्चित पद पहले से उल्लिखित राजा सुलैमान की ओर संकेत करता है।
- source_word: וְכָל יִשְׂרָאֵל עִמּוֹ
  choice: तथा उसके साथ समस्त इस्राएल
  rationale: इस्राएल को सामूहिक राष्ट्रीय पद के रूप में बनाए रखा गया है और עִמּוֹ का संबंध स्वाभाविक रूप से राजा से व्यक्त किया गया है।
- source_word: זֹבְחִים זֶבַח
  choice: बलिदान चढ़ा रहे थे
  rationale: हिब्रू की सजातीय क्रिया-संज्ञा रचना बलिदान करने की क्रिया पर बल देती है। हिंदी में शाब्दिक 'बलिदान का बलिदान कर रहे थे' अस्वाभाविक है; प्रगतिशील रूप participle की जारी क्रिया को सुरक्षित रखता है।
- source_word: לִפְנֵי
  choice: के सामने
  rationale: यह स्थानिक और उपासना-संबंधी अर्थ को सरल, स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: चार अक्षरों वाले व्यक्तिगत ईश्वरीय नाम को हिंदी में प्रचलित नामरूप 'यहोवा' से प्रस्तुत किया गया है, किसी उपाधि से नहीं।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ में व्यक्तिगत वाचा-नाम है। हिंदी बाइबलीय प्रयोग में 'यहोवा' व्यापक और सुबोध नामरूप है; इसे 'प्रभु' जैसी उपाधि से प्रतिस्थापित नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिंदी; संक्षिप्त, गरिमापूर्ण और सार्वजनिक पाठ के लिए स्वाभाविक। हिब्रू की सजातीय अभिव्यक्ति को कृत्रिम पुनरुक्ति के बजाय स्वाभाविक हिंदी क्रिया-पद से व्यक्त किया गया है।
