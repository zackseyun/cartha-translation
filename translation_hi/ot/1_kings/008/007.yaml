  text: क्योंकि करूब अपने पंख सन्दूक के स्थान के ऊपर फैलाए हुए थे[a], और करूबों ने ऊपर से सन्दूक और उसके डंडों पर छाया की।
  philosophy: optimal-equivalence
  footnotes:
