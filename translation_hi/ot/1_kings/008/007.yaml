  rationale: סכך यहाँ ऊपर से ढकने या आच्छादित करने का भाव देता है; ‘ढक रखा था’ भौतिक स्थिति और पूर्ण क्रिया दोनों को स्पष्ट करता है।
- source_word: בַּדָּיו
  choice: उसके डंडों
  rationale: ये सन्दूक को उठाकर ले जाने के डंडे हैं; ‘डंडे’ आधुनिक, स्पष्ट और अनार्किक हिन्दी है।
- source_word: מִלְמָעְלָה
  choice: ऊपर से
  rationale: यह ढकने की स्थिति और दिशा को ठीक प्रकार से व्यक्त करता है।
