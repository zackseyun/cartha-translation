- source_word: אֶל מְקוֹם הָאָרוֹן
  choice: सन्दूक के स्थान के ऊपर
  rationale: אֶל सामान्यतः दिशा सूचित कर सकता है, पर यहाँ पंखों और अगले उपवाक्य में ढकने के स्थानिक चित्र के कारण ‘ऊपर’ संदर्भानुकूल है; अधिक शाब्दिक दिशात्मक अर्थ पादटिप्पणी में सुरक्षित है।
- source_word: וַיָּסֹכּוּ
