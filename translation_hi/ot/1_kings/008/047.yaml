source:
  edition: WLC
  text: וְ/הֵשִׁ֨יבוּ֙ אֶל לִבָּ֔/ם בָּ/אָ֖רֶץ אֲשֶׁ֣ר נִשְׁבּוּ שָׁ֑ם וְ/שָׁ֣בוּ וְ/הִֽתְחַנְּנ֣וּ אֵלֶ֗י/ךָ בְּ/אֶ֤רֶץ שֹֽׁבֵי/הֶם֙ לֵ/אמֹ֔ר חָטָ֥אנוּ וְ/הֶעֱוִ֖ינוּ רָשָֽׁעְנוּ־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/047.yaml
  text: and if they come to their senses in the land where they were taken captive, and return and plead with you in the land of those who took them captive, saying, ‘We have sinned and acted perversely; we have acted wickedly,’
translation:
  language: hi
  text: और जिस देश में वे बंदी बनाकर ले जाए गए हों, वहाँ यदि वे होश में आएँ, और लौटें और उन लोगों के देश में जिन्होंने उन्हें बंदी बनाया था तुझसे विनती करें और कहें, ‘हमने पाप किया है, हमने कुटिलता की है, हमने दुष्टता की है,’
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהֵשִׁיבוּ אֶל־לִבָּם
  choice: यदि वे अपने मन में लौटें
  rationale: हिब्रानी मुहावरे का आशय होश में आने या गंभीरता से विचार करने का है; ‘अपने मन में लौटें’ मूल की हृदय/मन और लौटने की छवि को बनाए रखता है।
- source_word: וְשָׁבוּ
  choice: और लौटकर
  rationale: मूल क्रिया का सामान्य अर्थ ‘लौटना’ है। यहाँ पश्चात्ताप निहित हो सकता है, पर उसे स्पष्ट रूप से जोड़ने के बजाय मूल की अर्थगत व्यापकता सुरक्षित रखी गई है।
- source_word: וְהִתְחַנְּנוּ אֵלֶיךָ
  choice: तुझसे विनती करें
  rationale: क्रिया अनुग्रह की याचना करने या गिड़गिड़ाने का भाव रखती है; ‘विनती करें’ स्वाभाविक और गरिमापूर्ण है।
- source_word: חָטָאנוּ וְהֶעֱוִינוּ רָשָׁעְנוּ
  choice: हमने पाप किया है, हमने टेढ़े काम किए हैं, हमने दुष्टता की है
  rationale: तीनों अलग स्वीकारोक्तियों—पाप, विकृत/टेढ़ा आचरण, और दुष्टता—को अलग-अलग रखा गया है।
theological_decisions:
- issue: וְשָׁבוּ को ‘पश्चात्ताप करें’ या ‘लौटें’ कहना
  choice: लौटकर
  alternative: पश्चात्ताप करके
  rationale: संदर्भ में पश्चात्ताप स्पष्ट रूप से जुड़ा है, फिर भी शब्द स्वयं ‘लौटना’ है; इसलिए संभावित धार्मिक अर्थ को व्याख्यात्मक रूप से सीमित नहीं किया गया।
- issue: ‘अपने मन में लौटें’ का अर्थ स्पष्ट करना
  choice: मुख्य पाठ में मूल रूपक सुरक्षित रखा गया
  alternative: उन्हें होश आए / वे अपने किए पर विचार करें
  rationale: हिब्रानी अभिव्यक्ति का शाब्दिक चित्र और उसकी अर्थगत गहराई बनाए रखना उचित है; आधुनिक हिंदी में यह कुछ साहित्यिक होते हुए भी समझने योग्य है।
translation_notes:
  register: आधुनिक मानक हिंदी, गरिमापूर्ण प्रार्थना-शैली। परमेश्वर को संबोधन में एकवचन ‘तू’ के अनुरूप ‘तुझसे’ रखा गया है। पद वाक्य का आश्रित अंश है, इसलिए अंत में अल्पविराम रखा गया है।
