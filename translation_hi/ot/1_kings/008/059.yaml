base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/059.yaml
  text: And may these words of mine[a], with which I have pleaded before Yahweh, be near Yahweh our God day and night, that he may uphold the cause of his servant and the cause of his people Israel, as each day requires[c][b],
translation:
  language: hi
  text: और मेरे ये वचन, जिनके द्वारा मैंने यहवे के सम्मुख विनती की है, दिन-रात यहवे हमारे परमेश्वर के निकट रहें[a], ताकि वह अपने सेवक के मामले में और अपनी प्रजा इस्राएल के मामले में न्याय करे[b], जैसा हर दिन आवश्यक हो[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात ये प्रार्थना के वचन परमेश्वर के निकट निरंतर बने रहें; यह वचनों के परमेश्वर के सम्मुख बने रहने का रूपक है।
    reason: मूल के ‘निकट’ रहने के रूपक और ‘दिन-रात’ की निरंतरता को स्पष्ट करता है।
  - marker: b
    text: या ‘अपने सेवक और अपनी प्रजा इस्राएल का न्यायोचित पक्ष बनाए रखे’; इब्रानी मुहावरा किसी के मामले में न्याय करने या उसके न्यायसंगत अधिकार को कायम रखने को दर्शाता है।
    reason: לעשות משפט के न्यायिक मुहावरे का वैकल्पिक, अधिक शाब्दिक अर्थ देता है।
  - marker: c
    text: 'शाब्दिक रूप से: ‘हर दिन की बात उसके दिन में,’ अर्थात हर दिन जैसा आवश्यक हो।'
    reason: इब्रानी वितरणात्मक मुहावरे की संरचना और आशय स्पष्ट करता है।
