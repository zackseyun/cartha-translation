  alternative: न्याय करना
  rationale: मूल न्यायिक मुहावरे में सेवक और प्रजा के मामले या अधिकार को कायम रखने का भाव है। इस चयन से परमेश्वर के न्यायकारी कार्य को किसी संप्रदायगत व्याख्या से जोड़े बिना व्यक्त किया गया है।
