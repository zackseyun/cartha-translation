  text: וַ/יְהִ֣י כְּ/כַלּ֣וֹת שְׁלֹמֹ֗ה לְ/הִתְפַּלֵּל֙ אֶל יְהוָ֔ה אֵ֛ת כָּל הַ/תְּפִלָּ֥ה וְ/הַ/תְּחִנָּ֖ה הַ/זֹּ֑את קָ֞ם מִ/לִּ/פְנֵ֨י מִזְבַּ֤ח יְהוָה֙ מִ/כְּרֹ֣עַ עַל בִּרְכָּ֔י/ו וְ/כַפָּ֖י/ו פְּרֻשׂ֥וֹת הַ/שָּׁמָֽיִם׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/054.yaml
  text: And when Solomon had finished praying to Yahweh with all this prayer and plea for favor[a], he rose from before the altar of Yahweh[b], from kneeling on his knees with his palms spread out toward heaven.
translation:
  language: hi
  text: जब सुलैमान यह सारी प्रार्थना और कृपा की विनती यहोवा से कर चुका, तब वह यहोवा की वेदी के सामने से उठा। वह घुटने टेककर बैठा था और उसकी हथेलियाँ आकाश की ओर फैली हुई थीं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי כְּכַלּוֹת שְׁלֹמֹה לְהִתְפַּלֵּל
  choice: जब सुलैमान ... कर चुका
  rationale: כְּ plus infinitive construct एक कालवाचक उपवाक्य बनाता है। आधुनिक हिन्दी में ‘जब ... कर चुका’ प्रार्थना पूरी होने और उसके बाद उठने का क्रम स्वाभाविक रूप से व्यक्त करता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिन्दी में परमेश्वर के व्यक्तिगत नाम יהוה का परिचित लिप्यंतरण ‘यहोवा’ रखा गया है, न कि उसे किसी उपाधि से बदला गया है।
- source_word: אֵת כָּל הַתְּפִלָּה וְהַתְּחִנָּה הַזֹּאת
  choice: यह सारी प्रार्थना और कृपा की विनती
  rationale: תְּפִלָּה के लिए ‘प्रार्थना’ और תְּחִנָּה में निहित अनुग्रह/दया की earnest appeal के लिए ‘कृपा की विनती’ रखा गया है। ‘यह सारी’ पूरे पूर्ववर्ती प्रार्थना-विनय को समेटता है।
- source_word: קָם מִלִּפְנֵי מִזְבַּח יְהוָה
  choice: वह यहोवा की वेदी के सामने से उठा
  rationale: קָם मुद्रा बदलकर उठने को और מִלִּפְנֵי स्थान-संबंधी ‘सामने से’ को व्यक्त करता है।
- source_word: מִכְּרֹעַ עַל בִּרְכָּיו
  choice: वह घुटने टेककर बैठा था
  rationale: इब्रानी में घुटनों पर झुकी हुई मुद्रा स्पष्ट है। हिन्दी में ‘घुटने टेककर बैठा था’ स्रोत की शारीरिक मुद्रा को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: וְכַפָּיו פְּרֻשׂוֹת הַשָּׁמָיִם
  choice: उसकी हथेलियाँ आकाश की ओर फैली हुई थीं
  rationale: כַּף का विशिष्ट अर्थ ‘हथेली’ है; ‘आकाश की ओर’ प्रार्थना की दिशात्मक मुद्रा को स्पष्ट और स्वाभाविक हिन्दी में रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: मूल पाठ में चतुरक्षरी व्यक्तिगत नाम सीधे उपस्थित है। हिन्दी पाठकों में प्रचलित नामरूप ‘यहोवा’ व्यक्तिगत नाम को सुरक्षित रखता है और उसे ‘प्रभु’ जैसी उपाधि से नहीं बदलता।
- issue: תְּחִנָּה में कृपा/दया की याचना का भाव
  choice: कृपा की विनती
  alternative: विनती; अनुनय
  rationale: यह पद केवल सामान्य प्रार्थना नहीं, बल्कि अनुग्रह पाने की earnest appeal का संकेत देता है; ‘कृपा की विनती’ उस भाव को बिना किसी अतिरिक्त सैद्धान्तिक निष्कर्ष के व्यक्त करता है।
translation_notes:
  register: आधुनिक मानक हिन्दी, सहज किन्तु गरिमापूर्ण शैली। लम्बे इब्रानी वाक्य को दो हिन्दी वाक्यों में बाँटा गया है ताकि मुद्रा का वर्णन साफ रहे। ‘हथेलियाँ’ स्रोत के כַּפָּיו की विशिष्टता बनाए रखता है।
