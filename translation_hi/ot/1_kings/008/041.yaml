source:
  edition: WLC
  text: וְ/גַם֙ אֶל הַ/נָּכְרִ֔י אֲשֶׁ֛ר לֹא מֵ/עַמְּ/ךָ֥ יִשְׂרָאֵ֖ל ה֑וּא וּ/בָ֛א מֵ/אֶ֥רֶץ רְחוֹקָ֖ה לְמַ֥עַן שְׁמֶֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/041.yaml
  text: And also concerning the foreigner[a], who is not from your people Israel, but comes from a distant land for the sake of your name—
translation:
  language: hi
  text: और उस परदेशी के विषय में भी, जो तेरी प्रजा इस्राएल में से नहीं है, पर तेरे नाम के कारण दूर देश से आता है—
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְגַם אֶל
  choice: और ... की भी
  rationale: यह रचना पिछले निवेदनों से इस प्रसंग को जोड़ती है और ‘भी’ द्वारा इसके योगात्मक बल को स्वाभाविक हिन्दी में बनाए रखती है। अगले पदों में आने वाली प्रार्थना की क्रिया को ध्यान में रखते हुए ‘की ... सुनना’ प्रसंगानुकूल है।
- source_word: הַנָּכְרִי
  choice: परदेशी
  rationale: यहाँ शब्द ऐसे गैर-इस्राएली व्यक्ति को दर्शाता है जो वाचा-समुदाय से बाहर है; ‘परदेशी’ आधुनिक हिन्दी में इस भेद को स्पष्ट और गरिमापूर्ण ढंग से व्यक्त करता है।
- source_word: אֲשֶׁר לֹא מֵעַמְּךָ יִשְׂרָאֵל הוּא
  choice: जो तेरी प्रजा इस्राएल में से नहीं है
  rationale: यह वाक्यांश व्यक्ति को परमेश्वर की प्रजा इस्राएल से बाहर बताता है और मूल का वाचागत भेद सुरक्षित रखता है।
- source_word: וּבָא
  choice: परन्तु ... आया है
  rationale: वाव वर्णन को आगे बढ़ाता है; यहाँ इस्राएली न होने और फिर भी दूर से आने के बीच हल्का विरोध स्वाभाविक रूप से व्यक्त किया गया है।
- source_word: מֵאֶרֶץ רְחוֹקָה
  choice: दूर देश से
  rationale: यह भौगोलिक दूरी का सीधा, स्वाभाविक और प्रचलित हिन्दी रूप है।
- source_word: לְמַעַן שְׁמֶךָ
  choice: तेरे नाम के कारण
  rationale: यह आने की प्रेरणा या आधार व्यक्त करता है और ‘नाम’ में निहित परमेश्वर की प्रकट पहचान तथा कीर्ति को अक्षुण्ण रखता है।
theological_decisions:
- issue: इस्राएल और गैर-इस्राएली उपासक के बीच वाचागत भेद
  choice: उस परदेशी ... जो तेरी प्रजा इस्राएल में से नहीं है
  alternative: उस अजनबी ... जो तेरी प्रजा इस्राएल का नहीं है
  rationale: चुना हुआ पाठ गैर-इस्राएली की पहचान स्पष्ट रखता है, पर उसे केवल सामाजिक अर्थ वाले ‘अजनबी’ तक सीमित नहीं करता।
- issue: לְמַעַן में उद्देश्य और कारण की संभावित अर्थ-छाया
  choice: तेरे नाम के कारण
  alternative: तेरे नाम के निमित्त
  rationale: प्रसंग में परमेश्वर के नाम की ख्याति सुनकर आने का आधार प्रमुख है; ‘के कारण’ इसे स्पष्ट करता है, जबकि ‘के निमित्त’ उद्देश्य का थोड़ा अधिक संकेत दे सकता है।
translation_notes:
  register: आधुनिक मानक हिन्दी, प्रार्थनात्मक प्रसंग के अनुरूप गरिमापूर्ण संबोधन। पद मूल में अगले वाक्य से जुड़ता है, इसलिए अंत में दीर्घ डैश रखा गया है। ‘सुनना’ अगले पदों में निहित मुख्य निवेदन को हिन्दी में स्पष्ट करता है।
