source:
  edition: WLC
  text: כִּֽי עַמְּ/ךָ֥ וְ/נַחֲלָתְ/ךָ֖ הֵ֑ם אֲשֶׁ֤ר הוֹצֵ֨אתָ֙ מִ/מִּצְרַ֔יִם מִ/תּ֖וֹךְ כּ֥וּר הַ/בַּרְזֶֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/051.yaml
  text: For they are your people and your inheritance[a], whom you brought out of Egypt[b], out of the midst of the iron furnace.
translation:
  language: hi
  text: क्योंकि वे आपके लोग और आपकी विरासत[a] हैं, जिन्हें आप मिस्र से, लोहे की भट्ठी[b] के बीच से निकाल लाए थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “आपकी संपत्ति” अथवा “आपकी धरोहर।”
    reason: lexical_alternative
  - marker: b
    text: “लोहे की भट्ठी” मिस्र को घोर उत्पीड़न और क्लेश के स्थान के रूप में चित्रित करने वाला रूपक है; व्यवस्थाविवरण 4:20 से तुलना करें।
    reason: cross_reference
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह आसपास की प्रार्थना में सुलैमान की विनती का आधार बताता है; हिन्दी में ‘क्योंकि’ इसका कारणसूचक बल स्वाभाविक रूप से व्यक्त करता है।
- source_word: עַמְּךָ
  choice: आपकी प्रजा
  rationale: राजा द्वारा परमेश्वर को किए जा रहे आदरपूर्ण संबोधन में ‘प्रजा’ लोगों के सामूहिक और वाचागत संबंध को सहज ढंग से व्यक्त करती है।
- source_word: וְנַחֲלָתְךָ
  choice: और आपकी विरासत
  rationale: נַחֲלָה विरासत अथवा बाँट में मिली संपत्ति को सूचित करता है; ‘विरासत’ इस्राएल के परमेश्वर से संबंधित होने की वाचागत छवि को बनाए रखती है।
- source_word: הֵם
  choice: वे ... हैं
  rationale: स्वतंत्र सर्वनाम के विधेयात्मक बल को हिन्दी में स्पष्ट और स्वाभाविक वाक्य-विन्यास से रखा गया है।
- source_word: אֲשֶׁר
  choice: जिन्हें
  rationale: यह पहले उल्लिखित लोगों की ओर संकेत करता है, इसलिए सजीव बहुवचन संबंधवाचक रूप उपयुक्त है।
- source_word: הוֹצֵאתָ
  choice: आप ... निकाल लाए थे
  rationale: יצא के हिफ़ील रूप का कारणवाचक निर्गमन-अर्थ सुरक्षित रहता है; ‘निकाल लाए’ हिन्दी में किसी स्थान के भीतर से बाहर लाने को स्वाभाविक रूप से व्यक्त करता है।
- source_word: מִמִּצְרַיִם
  choice: मिस्र से
  rationale: निर्गमन के स्थान को संक्षेप और स्वाभाविक हिन्दी में व्यक्त करता है; अगला पद भीतर से निकलने की छवि को अधिक स्पष्ट करता है।
- source_word: מִתּוֹךְ
  choice: के बीच से
  rationale: किसी वस्तु के भीतर अथवा मध्य से बाहर निकाले जाने की स्थानिक छवि को बनाए रखता है।
- source_word: כּוּר הַבַּרְזֶל
  choice: लोहे की भट्ठी
  rationale: मूल रूपक को बिना व्याख्यात्मक विस्तार के सुरक्षित रखता है; यह मिस्र में कठोर उत्पीड़न और क्लेश की छवि है।
theological_decisions:
- issue: इस्राएल को परमेश्वर की ‘विरासत’ कहना
  choice: मुख्य पाठ में ‘आपकी विरासत’
  alternative: आपकी संपत्ति; आपका निज भाग
  rationale: यह रूप नַחֲלָה की विरासत और आबंटित अधिकार-संबंधी वाचागत भाषा को बनाए रखता है, पर पाठ से आगे कोई विशिष्ट सांप्रदायिक निष्कर्ष नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज शैली अपनाई गई है। प्रार्थना में परमेश्वर के लिए आदरसूचक ‘आप’ रखा गया है। मूल का ‘लोहे की भट्ठी’ रूपक मुख्य पाठ में अक्षुण्ण है और उसका आशय पादटिप्पणी में दिया गया है।
