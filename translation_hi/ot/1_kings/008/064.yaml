reference: 1 Kings 8:64
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: בַּ/יּ֣וֹם הַ/ה֗וּא קִדַּ֨שׁ הַ/מֶּ֜לֶךְ אֶת תּ֣וֹךְ הֶ/חָצֵ֗ר אֲשֶׁר֙ לִ/פְנֵ֣י בֵית יְהוָ֔ה כִּי עָ֣שָׂה שָׁ֗ם אֶת הָֽ/עֹלָה֙ וְ/אֶת הַ/מִּנְחָ֔ה וְ/אֵ֖ת חֶלְבֵ֣י הַ/שְּׁלָמִ֑ים כִּֽי מִזְבַּ֤ח הַ/נְּחֹ֨שֶׁת֙ אֲשֶׁ֣ר לִ/פְנֵ֣י יְהוָ֔ה קָטֹ֗ן מֵֽ/הָכִיל֙ אֶת הָ/עֹלָ֣ה וְ/אֶת הַ/מִּנְחָ֔ה וְ/אֵ֖ת חֶלְבֵ֥י הַ/שְּׁלָמִֽים־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/064.yaml
  text: On that day the king consecrated the middle of the court that was before the house of Yahweh[a], because there he offered the burnt offering and the grain offering and the fat portions of the peace offerings[c][b], because the bronze altar that was before Yahweh was too small to contain the burnt offering and the grain offering and the fat portions of the peace offerings.
translation:
  language: hi
  text: उस दिन राजा ने यहोवा के भवन के सामने वाले आँगन के बीच के भाग को पवित्र किया, क्योंकि उसने वहाँ होमबलि, अन्नबलि और मेलबलियों की चर्बी चढ़ाई। यह इसलिए किया गया क्योंकि यहोवा के सामने की काँसे की वेदी इतनी छोटी थी कि उस पर होमबलि, अन्नबलि और मेलबलियों की चर्बी नहीं समा सकती थी।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: קִדַּשׁ
  choice: पवित्र किया
  rationale: यहाँ क्रिया का अर्थ किसी स्थान को पवित्र उपयोग, विशेषतः बलि चढ़ाने, के लिए अलग करना है। ‘पवित्र किया’ सामान्य आधुनिक हिन्दी में स्वाभाविक और उपासना-संबंधी अर्थ के अनुकूल है।
- source_word: תּוֹךְ הֶחָצֵר
  choice: आँगन के बीच के भाग
  rationale: תּוֹךְ का स्थानवाचक अर्थ ‘बीच/मध्य’ है। ‘बीच का भाग’ उस क्षेत्र को स्पष्ट करता है जिसे अस्थायी रूप से बलि चढ़ाने के लिए पवित्र किया गया।
- source_word: לִפְנֵי בֵית יְהוָה
  choice: यहोवा के भवन के सामने
  rationale: לִפְנֵי यहाँ स्थानवाचक ‘सामने’ है और בֵית को ‘भवन’ कहना मूल के ‘घर/भवन’ रूपक को बनाए रखते हुए हिन्दी में मंदिर-संदर्भ के लिए स्वाभाविक है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: व्यक्तिगत ईश्वरीय नाम को हिन्दी में प्रचलित लिप्यंतरण ‘यहोवा’ से व्यक्त किया गया है, न कि किसी उपाधि से प्रतिस्थापित किया गया।
- source_word: עָשָׂה שָׁם
  choice: वहाँ ... चढ़ाई
  rationale: बलि-संदर्भ में עשה का आशय बलि को सम्पन्न करना अथवा चढ़ाना है। हिन्दी में ‘चढ़ाई’ इस धार्मिक क्रिया को स्वाभाविक रूप से व्यक्त करता है।
- source_word: הָעֹלָה
  choice: होमबलि
  rationale: עוֹלָה के लिए ‘होमबलि’ हिन्दी बाइबलीय प्रयोग में परिचित और सटीक बलि-संबंधी पद है।
- source_word: הַמִּנְחָה
  choice: अन्नबलि
  rationale: इस याजकीय संदर्भ में מִנְחָה अनाज से चढ़ाई जाने वाली भेंट है; ‘अन्नबलि’ संक्षिप्त और स्पष्ट है।
- source_word: חֶלְבֵי הַשְּׁלָמִים
  choice: मेलबलियों की चर्बी
  rationale: חֶלְבֵי बलि में वेदी पर जलाए जाने वाले चर्बी के भागों को सूचित करता है। שְׁלָמִים के लिए ‘मेलबलि’ शांति, कुशल और सहभागिता से जुड़े अर्थ-क्षेत्र को अनावश्यक व्याख्या के बिना बनाए रखता है।
- source_word: מִזְבַּח הַנְּחֹשֶׁת
  choice: काँसे की वेदी
  rationale: नְחֹשֶׁת ताँबा या काँसा सूचित कर सकता है; इस उपासना-सामग्री के लिए ‘काँसे की वेदी’ पारंपरिक और संदर्भानुकूल चुनाव है।
- source_word: קָטֹן מֵהָכִיל
  choice: इतनी छोटी थी कि ... नहीं समा सकती थी
  rationale: विशेषण और धातुरूप का यह मेल अपर्याप्त क्षमता दर्शाता है। हिन्दी संरचना परिणाम को स्वाभाविक ढंग से व्यक्त करती है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल में चतुरक्षरी व्यक्तिगत नाम है। मुख्य पाठ में उपाधि ‘प्रभु’ के बजाय नाम रखा गया है; ‘यहोवा’ आधुनिक हिन्दी बाइबल-पाठकों में अधिक पहचाना जाने वाला देवनागरी रूप है।
- issue: שְׁלָמִים का बलि-संबंधी अर्थ
  choice: मेलबलि
  alternative: शान्ति-बलि / सहभागिता-बलि
  rationale: हिब्रू पद में कुशल, मेल और सामुदायिक भोजन से जुड़े अर्थ हैं। ‘मेलबलि’ किसी एक व्याख्यात्मक पहलू को अत्यधिक निश्चित किए बिना संक्षिप्त पारंपरिक अर्थ देता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज और सार्वजनिक पाठ के योग्य शैली। ‘भवन’, ‘आँगन’, ‘वेदी’ और परिचित बलि-संबंधी पदों द्वारा मूल की उपासना-विषयक भाषा सुरक्षित रखी गई है।
