base_translation:
  language: en
  yaml_path: translation/ot/1_kings/012/002.yaml
  text: When Jeroboam son of Nebat heard of it—while he was still in Egypt[a], where he had fled from King Solomon—Jeroboam was still living in Egypt.
translation:
  language: hi
  text: जब नबात के पुत्र यारोबाम ने यह सुना[a]—वह उस समय भी मिस्र में था, जहाँ वह राजा सुलैमान से भागकर चला गया था—तब यारोबाम मिस्र में ही रह रहा था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में केवल ‘सुना’ है; क्या सुना, यह प्रसंग से समझा जाता है—संभवतः आसपास के वर्णन में दिए गए समाचार को।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כִּשְׁמֹעַ
  choice: जब ... ने यह सुना ... तब
  rationale: היה के कथात्मक रूप और כ + infinitive construct की समयसूचक रचना को स्वाभाविक हिन्दी ‘जब...तब’ से व्यक्त किया गया है; अलग से ‘अब’ जोड़ना आवश्यक नहीं है।
- source_word: יָרָבְעָם בֶּן נְבָט
  choice: नबात के पुत्र यारोबाम
  rationale: पितृनाम-सूचक पद को स्पष्ट और प्रचलित हिन्दी बाइबिलीय शैली में रखा गया है।
- source_word: וְהוּא עוֹדֶנּוּ בְמִצְרַיִם
  choice: वह उस समय भी मिस्र में था
  rationale: यह परिस्थितिसूचक उपवाक्य सुनने के समय यारोबाम के अब भी मिस्र में होने पर बल देता है।
- source_word: אֲשֶׁר בָּרַח מִפְּנֵי הַמֶּלֶךְ שְׁלֹמֹה
  choice: जहाँ वह राजा सुलैमान से बचकर भाग गया था
  rationale: सम्बन्धवाचक उपवाक्य अर्थतः मिस्र को उस स्थान के रूप में बताता है जहाँ वह सुलैमान के सामने से/उसके अधिकार से बचकर भागा था। ‘बचकर भाग गया था’ इस आशय को सहज हिन्दी में व्यक्त करता है।
- source_word: וַיֵּשֶׁב יָרָבְעָם בְּמִצְרָיִם
  choice: तब यारोबाम मिस्र में ही रहता था
  rationale: ישב यहाँ निवास करने का अर्थ देता है। ‘ही’ उसके मिस्र में बने रहने और मूल पाठ की पुनरुक्ति को बनाए रखता है।
- source_word: שְׁמֹעַ
  choice: यह सुना
  rationale: इब्रानी में सुनने की वस्तु स्पष्ट रूप से नहीं दी गई है; हिन्दी वाक्य को स्वाभाविक बनाने के लिए ‘यह’ रखा गया है, जिसका संकेत संदर्भ की ओर है, बिना समाचार को अधिक विशिष्ट किए।
