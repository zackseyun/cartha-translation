base_translation:
  language: en
  yaml_path: translation/ot/1_kings/012/028.yaml
  text: So the king took counsel and made two calves of gold[a], and he said to them, “It is too much for you to go up to Jerusalem. Behold your gods, O Israel[b], who brought you up from the land of Egypt.”
translation:
  language: hi
  text: तब राजा ने सलाह-मशविरा करके सोने के दो बछड़े बनाए और उनसे कहा, “तुम्हारे लिए यरूशलेम जाना बहुत कठिन है। हे इस्राएल, देखो, ये तुम्हारे देवता हैं[a], जो तुम्हें मिस्र देश से निकाल लाए थे।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “यह तुम्हारा परमेश्वर है।” इब्रानी शब्द कभी-कभी एकवचन पदवी के रूप में भी प्रयुक्त होता है; फिर भी यहाँ दो बछड़े और बहुवचन क्रिया “निकाल लाए” बहुवचन “देवता” के पक्ष में हैं। यह कथन निर्गमन 32:4 की भाषा की प्रतिध्वनि है।
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּוָּעַץ
  choice: सलाह-मशविरा करके
  rationale: निफ़अल रूप यहाँ विचार-विमर्श या परामर्श करने का भाव देता है; यह हिन्दी में स्वाभाविक रहते हुए उस प्रक्रिया को स्पष्ट करता है।
- source_word: שְׁנֵי עֶגְלֵי זָהָב
  choice: सोने के दो बछड़े
  rationale: इब्रानी रचना का अर्थ सीधे व्यक्त करता है, वस्तुओं की संख्या बनाए रखता है और निर्गमन 32 की प्रतिध्वनि सुरक्षित रखता है।
- source_word: רַב לָכֶם מֵעֲלוֹת יְרוּשָׁלִַם
  choice: तुम्हारे लिए यरूशलेम जाना बहुत कठिन है
  rationale: रचना का सम्भावित अर्थ यह है कि वहाँ चढ़कर जाना लोगों के लिए अत्यधिक या बोझिल है। आधुनिक हिन्दी में यह स्वाभाविक है; ‘तुम बहुत समय से जाते रहे हो’ वाला सम्भव कालगत अर्थ कम स्पष्ट है।
- source_word: הִנֵּה
  choice: देखो
  rationale: प्रस्तुत वस्तुओं की ओर ध्यान खींचने वाली देइक्तिक शक्ति को आधुनिक और गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: אֱלֹהֶיךָ יִשְׂרָאֵל
  choice: हे इस्राएल, ... तुम्हारे देवता
  rationale: दो बछड़ों का निकट सन्दर्भ और आगे का बहुवचन क्रिया-रूप बहुवचन अर्थ के पक्ष में हैं; सम्बोधन को हिन्दी के स्वाभाविक क्रम में रखा गया है।
- source_word: הֶעֱלוּךָ
  choice: जो तुम्हें ... निकाल लाए थे
  rationale: हिफ़ईल क्रिया का कारणवाचक भाव व्यक्त होता है। मिस्र से ‘निकाल लाना’ हिन्दी में निर्गमन-सूत्र को स्वाभाविक ढंग से संप्रेषित करता है, यद्यपि मूल में शाब्दिक दिशा ‘ऊपर लाना’ है।
- source_word: מֵאֶרֶץ מִצְרָיִם
  choice: मिस्र देश से
  rationale: ‘देश’ को बनाए रखने से मूल का אֶרֶץ स्पष्ट रूप से व्यक्त होता है और प्रचलित बाइबलीय निर्गमन-सूत्र सुरक्षित रहता है।
theological_decisions:
- issue: अֱלֹהֶיךָ को एकवचन ‘परमेश्वर’ माना जाए या बहुवचन ‘देवता’
  choice: 'बहुवचन: ‘तुम्हारे देवता’'
  alternative: 'एकवचन: ‘तुम्हारा परमेश्वर’'
  rationale: אֱלֹהִים एकवचन पदवी के रूप में प्रयुक्त हो सकता है, पर यहाँ दो बछड़ों का उल्लेख और बहुवचन הֶעֱלוּ बहुवचन अनुवाद को अधिक सम्भावित बनाते हैं। पादटिप्पणी वास्तविक भाषिक अस्पष्टता को सुरक्षित रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी; कथात्मक शैली गरिमापूर्ण लेकिन सामान्य पाठक के लिए सहज रखी गई है। ‘देखो’ ने अधिक पुरातन ‘निहारो’ से बचते हुए הִנֵּה का बल बनाए रखा है।
