base_translation:
  language: en
  yaml_path: translation/ot/1_kings/012/018.yaml
  text: Then King Rehoboam sent Adoram[a], who was over the forced labor, and all Israel stoned him with stones, and he died[c][b]. And King Rehoboam made haste to get up into the chariot to flee to Jerusalem.
translation:
  language: hi
  text: तब राजा रहूबियाम ने अदोराम[a] को भेजा, जो बेगार के काम का अधिकारी था। और सारे इस्राएल ने उस पर पत्थर बरसाए, और वह मर गया। राजा रहूबियाम ने यरूशलेम भागने के लिए रथ पर चढ़ने में पूरा ज़ोर लगाया[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: हिब्रू में यहाँ ‘अदोराम’ है; कुछ सम्बद्ध पदों में नाम का रूप ‘अदोनिराम’ मिलता है।
    reason: alternative_reading
  - marker: b
    text: शाब्दिक रूप से, “रथ पर चढ़ने के लिए अपने को मजबूत किया”; प्रसंग में इसका अर्थ भागने के लिए तत्काल पूरा प्रयास करना है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: भेजा
  rationale: שלח के सामान्य आख्यानात्मक अर्थ को सहज और सटीक हिन्दी में व्यक्त करता है।
- source_word: אֲדֹרָם
  choice: अदोराम
  rationale: WLC/MT में इसी पद पर आए नामरूप को मुख्य पाठ में रखा गया है; सम्बद्ध पदों के ‘अदोनिराम’ रूप को पादटिप्पणी में बताया गया है।
- source_word: אֲשֶׁר עַל הַמַּס
  choice: जो बेगार के काम का अधिकारी था
  rationale: यह पद राज्य द्वारा थोपे गए श्रम के प्रभारी अधिकारी को दर्शाता है; ‘बेगार’ आधुनिक हिन्दी में मַס के बाध्य श्रम वाले अर्थ को स्पष्ट करता है।
- source_word: וַיִּרְגְּמוּ ... אֶבֶן
  choice: उस पर पत्थर बरसाए
  rationale: हिब्रू की स्पष्ट पत्थर-वाली छवि को स्वाभाविक हिन्दी में बनाए रखता है और प्राणघातक पथराव का भाव देता है।
- source_word: כָל יִשְׂרָאֵל
  choice: सारे इस्राएल
  rationale: सन्दर्भ में उत्तरी गोत्रों के सामूहिक राजनीतिक नाम को बनाए रखता है।
- source_word: וַיָּמֹת
  choice: और वह मर गया
  rationale: पथराव के परिणाम को सरल आख्यानात्मक क्रम में व्यक्त करता है।
- source_word: הִתְאַמֵּץ
  choice: पूरा जोर लगाया
  rationale: hitpael रूप के आत्म-प्रयास और तत्परता के भाव को प्रसंगानुकूल, स्वाभाविक हिन्दी में व्यक्त करता है, बिना केवल ‘जल्दी की’ तक सीमित किए।
- source_word: לַעֲלוֹת בַּמֶּרְכָּבָה
  choice: रथ पर चढ़कर
  rationale: עלה के ऊपर चढ़ने के दिशात्मक भाव और हिन्दी की स्वाभाविक अभिव्यक्ति दोनों को रखता है।
- source_word: לָנוּס יְרוּשָׁלָם
  choice: यरूशलेम भाग जाने के लिए
  rationale: נוּס में निहित संकटपूर्ण पलायन को स्पष्ट करता है।
theological_decisions:
- issue: הִתְאַמֵּץ में शारीरिक बल जुटाने और शीघ्रता का सम्बन्ध
  choice: तुरन्त ... पूरा जोर लगाया
  alternative: अपने को दृढ़ किया / जल्दी की
  rationale: मूल क्रिया आत्म-प्रयास या स्वयं को मजबूत करने का संकेत देती है, जबकि प्रसंग तत्काल पलायन का है। अनुवाद दोनों पहलुओं को रखता है और किसी एक को अनुचित रूप से निर्णायक नहीं बनाता।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण पर सहज आख्यान शैली। ‘बेगार’ बाध्य श्रम को स्पष्ट करता है। ‘पत्थर बरसाए’ हिब्रू की ठोस छवि को स्वाभाविक हिन्दी में रखता है। सभी पादटिप्पणी चिह्न मुख्य पाठ में उपस्थित हैं।
