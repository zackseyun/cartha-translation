source:
  edition: WLC
  text: וַ/יַּ֖עַשׂ אֶת בֵּ֣ית בָּמ֑וֹת וַ/יַּ֤עַשׂ כֹּֽהֲנִים֙ מִ/קְצ֣וֹת הָ/עָ֔ם אֲשֶׁ֥ר לֹֽא הָי֖וּ מִ/בְּנֵ֥י לֵוִֽי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/012/031.yaml
  text: He made houses of high places[a], and he appointed priests from among all the people[b], who were not from the sons of Levi.
translation:
  language: hi
  text: उसने ऊँचे स्थानों के लिए पूजा-भवन[a] बनाए और सभी लोगों में से याजक नियुक्त किए, जो लेवी के वंशज नहीं थे[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से, “ऊँचे स्थानों का भवन”; यह ऊँचे स्थानों से जुड़े पूजा-स्थलों या पवित्रस्थानों के लिए एक मुहावरेदार पद है।
    reason: lexical_alternative
  - marker: b
    text: या, “जो लेवीय नहीं थे।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: उसने ... बनाए / नियुक्त किए
  rationale: עשה का मूल अर्थ व्यापक है। पहले खंड में भवनों के साथ ‘बनाए’ स्वाभाविक है; दूसरे में याजकों के संदर्भ में वही क्रिया प्रसंगानुसार ‘नियुक्त किए’ व्यक्त करती है।
- source_word: בֵּית בָּמוֹת
  choice: पूजा-स्थलों के लिए भवन
  rationale: शाब्दिक रूप ‘ऊँचे स्थानों का भवन’ है। यहाँ בָּמוֹת स्थानीय उपासना-स्थलों को सूचित करता है; यह अनुवाद सांप्रदायिक व्याख्या जोड़े बिना उनके धार्मिक उपयोग को स्पष्ट करता है। सामूहिक अर्थ के कारण हिंदी में बहुवचन स्वाभाविक है।
- source_word: כֹּהֲנִים
  choice: याजक
  rationale: धार्मिक सेवा करने वाले כהנים के लिए आधुनिक मानक हिंदी का परिचित और गरिमापूर्ण शब्द।
- source_word: מִקְצוֹת הָעָם
  choice: साधारण लोगों में से
  rationale: यह मुहावरा यहाँ प्रजा के किसी भी भाग या वर्ग में से चुनाव को दर्शाता है। हिंदी में ‘साधारण लोगों में से’ यह स्पष्ट करता है कि नियुक्ति मान्य लेवीय वंश तक सीमित नहीं थी।
- source_word: אֲשֶׁר לֹא הָיוּ מִבְּנֵי לֵוִי
  choice: जो लेवी के वंशज नहीं थे
  rationale: ‘लेवी के पुत्रों में से’ का स्वाभाविक हिंदी रूप; इससे वंशगत पहचान स्पष्ट रहती है।
theological_decisions:
- issue: בֵּית בָּמוֹת से सूचित उपासना-संरचनाओं का स्वरूप
  choice: पूजा-स्थलों के लिए भवन
  alternative: ऊँचे स्थानों के भवन
  rationale: ‘ऊँचे स्थान’ का शब्दशः रूप हिंदी पाठक को केवल भौगोलिक ऊँचाई समझा सकता है। चुना हुआ पाठ धार्मिक प्रयोजन बताता है, पर उन्हें वैध या अवैध कहकर पाठ से अधिक टिप्पणी नहीं जोड़ता।
- issue: याजकों की गैर-लेवीय स्थिति
  choice: जो लेवी के वंशज नहीं थे
  alternative: जो लेवीय नहीं थे
  rationale: चुना हुआ रूप मूल की वंशगत भाषा को बनाए रखता है और कोई अतिरिक्त धर्मशास्त्रीय निष्कर्ष नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिंदी; सहज किंतु गरिमापूर्ण शैली। ‘याजक’ और ‘लेवी के वंशज’ बाइबिलीय संदर्भ को स्पष्ट रखते हैं। मुख्य पाठ में केवल उसी स्थान पर पाद-टिप्पणी दी गई है जहाँ इब्रानी मुहावरे का शाब्दिक रूप उपयोगी है।
