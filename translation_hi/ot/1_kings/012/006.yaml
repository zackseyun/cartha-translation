base_translation:
  language: en
  yaml_path: translation/ot/1_kings/012/006.yaml
  text: Then King Rehoboam consulted the elders who had stood before Solomon his father while he was still alive[a], saying[b], “How do you advise me to answer this people?”
translation:
  language: hi
  text: तब राजा रहूबियाम ने उन वरिष्ठ जनों से परामर्श किया, जो उसके पिता सुलैमान के जीवित रहते उसके सामने उपस्थित रहते थे[a]। उसने उनसे पूछा, “तुम मुझे क्या सलाह देते हो कि मैं इन लोगों को क्या उत्तर दूँ[b]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक अर्थ, “सुलैमान के सामने खड़े रहते थे”; यह राजदरबार में उसकी उपस्थिति में सेवा करने का संकेत हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक अर्थ, “मैं इन लोगों को एक बात लौटाऊँ”; इस अभिव्यक्ति का अर्थ उन्हें उत्तर देना है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּוָּעַץ
  choice: परामर्श किया
  rationale: निफ़अल रूप यहाँ दूसरों से सलाह लेने को व्यक्त करता है; ‘परामर्श किया’ आधुनिक, स्वाभाविक और गरिमापूर्ण हिंदी है।
- source_word: הַמֶּלֶךְ רְחַבְעָם
  choice: राजा रहूबियाम
  rationale: हिंदी में पदवी को नाम से पहले रखना स्वाभाविक है।
- source_word: הַזְּקֵנִים
  choice: वरिष्ठ जनों
  rationale: दरबारी संदर्भ में यह केवल अधिक आयु वाले पुरुषों के बजाय अनुभवी वरिष्ठ व्यक्तियों को सूचित करता है। ‘वरिष्ठ जन’ इस भाव को आधुनिक हिंदी में व्यक्त करता है।
- source_word: אֲשֶׁר הָיוּ עֹמְדִים אֶת־פְּנֵי שְׁלֹמֹה
  choice: जो ... सुलैमान के सामने उपस्थित रहते थे
  rationale: ‘सामने खड़े रहना’ राजकीय उपस्थिति या सेवा का मुहावरा है। अनुवाद मूल बिंब को बनाए रखता है और पादटिप्पणी उसके सेवासंबंधी अर्थ को स्पष्ट करती है।
- source_word: בִּהְיֹתוֹ חַי
  choice: के जीवित रहते
  rationale: यह समयसूचक उपवाक्य सुलैमान के जीवनकाल को संक्षिप्त और स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: אֵיךְ אַתֶּם נוֹעָצִים
  choice: तुम मुझे क्या सलाह देते हो
  rationale: हिब्रू प्रश्न उनकी सम्मति माँगता है। हिंदी में ‘मुझे’ संदर्भगत लक्ष्य को स्पष्ट करता है, जबकि सलाह की विषयवस्तु अगले उपवाक्य में आती है।
- source_word: לְהָשִׁיב ... דָּבָר
  choice: क्या उत्तर दूँ
  rationale: इस रचना में शाब्दिक ‘एक बात लौटाना’ का अर्थ उत्तर देना है; चुना हुआ रूप स्वाभाविक हिंदी में वही आशय देता है।
- source_word: הָעָם הַזֶּה
  choice: इन लोगों
  rationale: हिब्रू में עם सामूहिक एकवचन है, पर आधुनिक हिंदी में संकेतवाचक प्रयोग के साथ ‘इन लोगों’ अधिक स्वाभाविक है और कुछ दूरी का भाव भी बनाए रखता है।
