source:
  edition: WLC
  text: וְ/לֹֽא שָׁמַ֥ע הַ/מֶּ֖לֶךְ אֶל הָ/עָ֑ם כִּֽי הָיְתָ֤ה סִבָּה֙ מֵ/עִ֣ם יְהוָ֔ה לְמַ֜עַן הָקִ֣ים אֶת דְּבָר֗/וֹ אֲשֶׁ֨ר דִּבֶּ֤ר יְהוָה֙ בְּ/יַד֙ אֲחִיָּ֣ה הַ/שִּׁילֹנִ֔י אֶל יָרָבְעָ֖ם בֶּן נְבָֽט־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/012/015.yaml
  text: So the king did not listen to the people[a], for it was a turn of events from Yahweh[b], in order to establish his word that Yahweh had spoken by the hand of Ahijah the Shilonite to Jeroboam son of Nebat.
translation:
  language: hi
  text: इसलिए राजा ने लोगों की बात नहीं मानी, क्योंकि यह घटनाक्रम[a] याहवे की ओर से था, ताकि याहवे अपने उस वचन को पूरा करे जो उसने शीलोवासी अहिय्याह के द्वारा[b] नबात के पुत्र यारोबाम से कहा था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “क्योंकि इसका कारण याहवे की ओर से था।” इब्रानी शब्द का अर्थ ‘कारण,’ ‘परिस्थिति’ या ‘घटनाओं का मोड़’ हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “शीलोवासी अहिय्याह के हाथ से”; यह किसी व्यक्ति के माध्यम से बोलने या कार्य करने का इब्रानी मुहावरा है।
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁמַע אֶל
  choice: की बात नहीं मानी
  rationale: यहाँ क्रिया का अर्थ केवल सुनना नहीं, बल्कि लोगों के निवेदन पर ध्यान देना और उसे मानना है। यह हिंदी में प्रसंगानुकूल और स्वाभाविक है।
- source_word: הָעָם
  choice: लोगों
  rationale: यह इस्राएल के एकत्रित लोगों के लिए सामान्य और स्पष्ट हिंदी पद है।
- source_word: סִבָּה
  choice: घटनाक्रम
  rationale: इस दुर्लभ संज्ञा में कारण, परिस्थिति अथवा घटनाओं के मोड़ का भाव हो सकता है। ‘घटनाक्रम’ कथा में घटे परिणाम को व्यक्त करता है और संभावित अर्थांतर को पादटिप्पणी में सुरक्षित रखता है।
- source_word: מֵעִם יְהוָה
  choice: याहवे की ओर से
  rationale: यह वाक्यांश स्रोत या उद्गम बताता है। परमेश्वर के निज नाम יהוה को ‘याहवे’ रूप में रखा गया है।
- source_word: לְמַעַן הָקִים אֶת דְּבָרוֹ
  choice: ताकि वह अपना वह वचन पूरा करे
  rationale: לְמַעַן उद्देश्य प्रकट करता है और הֵקִים के साथ ‘वचन’ का भाव पहले कही बात को प्रभावी या सिद्ध करने का है। आधुनिक हिंदी में ‘वचन पूरा करे’ इस आशय को स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
- source_word: בְּיַד
  choice: के द्वारा
  rationale: शाब्दिक अर्थ ‘के हाथ से’ है, पर यहाँ यह माध्यम या प्रतिनिधि के द्वारा बोलने का इब्रानी मुहावरा है।
- source_word: הַשִּׁילֹנִי
  choice: शीलोवासी
  rationale: यह अहिय्याह को शीलो नगर से संबंधित व्यक्ति के रूप में पहचानता है।
- source_word: יָרָבְעָם בֶּן נְבָט
  choice: नबात के पुत्र यारोबाम
  rationale: नाम और पितृनाम को स्वाभाविक हिंदी क्रम में रखा गया है।
theological_decisions:
- issue: ईश्वरीय कारण और राजा की मानवीय क्रिया
  choice: राजा के इनकार को मानवीय कार्य के रूप में रखते हुए घटनाक्रम को याहवे की ओर से बताया गया है।
  alternative: इसे केवल याहवे की अनुमति कहना, अथवा याहवे को राजा के इनकार का प्रत्यक्ष प्रेरक बताना।
  rationale: इब्रानी पाठ घटनाक्रम का स्रोत याहवे को बताता है और उसे पहले कहे वचन की पूर्ति के उद्देश्य से जोड़ता है, पर कारण की कार्यविधि स्पष्ट नहीं करता। अनुवाद उसी तनाव को बनाए रखता है।
- issue: יהוה का अनुवाद
  choice: याहवे
  alternative: प्रभु; यहोवा
  rationale: पाठ में परमेश्वर का निज वाचा-नाम है; इसलिए उसे नाम के रूप में लिप्यंतरित किया गया है।
- issue: הֵקִים के साथ भविष्यद्वाणी के वचन का आशय
  choice: वचन पूरा करे
  alternative: वचन को स्थिर करे; वचन सिद्ध करे
  rationale: यहाँ पहले कहे गए भविष्यद्वाणी के वचन को इतिहास में प्रभावी करने का भाव है। ‘पूरा करे’ सहज हिंदी है, पर इसे ‘प्रतिज्ञा’ नहीं बनाया गया, जिससे דָּבָר का व्यापक अर्थ बना रहे।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘की बात नहीं मानी’ निवेदन को अस्वीकार करने का भाव देता है; ‘घटनाक्रम’ मूल की अर्थगत व्यापकता को मुख्य पाठ और पादटिप्पणी के साथ सुरक्षित रखता है।
