- source_word: מָה אַתֶּם נוֹעָצִים
  choice: तुम क्या सलाह देते हो
  rationale: वर्तमान परामर्श माँगने वाले इब्रानी कृदंत का स्वाभाविक और सीधा हिन्दी रूप।
- source_word: וְנָשִׁיב דָּבָר
  choice: कि हम ... क्या उत्तर दें
  rationale: ‘वचन/बात लौटाना’ इब्रानी मुहावरा उत्तर देने के अर्थ में है; हिन्दी में अर्थ को स्वाभाविक रखते हुए प्रश्न की संरचना भी सुरक्षित की गई है।
- source_word: הָעָם הַזֶּה
  choice: इस प्रजा
  rationale: सामूहिक एकवचन ‘लोग/प्रजा’ और संकेतवाचक भाव को बनाए रखता है; राजकीय प्रसंग में ‘प्रजा’ सहज है।
- source_word: אֲשֶׁר דִּבְּרוּ אֵלַי לֵאמֹר
  choice: जिसने मुझसे कहा है
  rationale: इब्रानी की आश्रित उक्ति-भूमिका को अनावश्यक शब्दशः दोहराव के बिना स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: הָקֵל
  choice: हलका कर दो
  rationale: आज्ञार्थक क्रिया बोझ घटाने की माँग व्यक्त करती है और ‘जूआ’ के रूपक के साथ सहज बैठती है।
- source_word: מִן הָעֹל
  choice: जूआ ... हलका
  rationale: मूल के ठोस ‘जूए’ के रूपक को सामान्य ‘बोझ’ में बदलने के बजाय सुरक्षित रखा गया है।
- source_word: אֲשֶׁר נָתַן אָבִיךָ עָלֵינוּ
  choice: तुम्हारे पिता ने जो जूआ हम पर रखा था
  rationale: נתן על के ठोस चित्र—किसी पर जूआ रखने—को स्वाभाविक हिन्दी में बनाए रखता है।
