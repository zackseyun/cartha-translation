  yaml_path: translation/ot/1_kings/012/009.yaml
  text: And he said to them[a], “What do you advise, that we may answer this people who have spoken to me, saying[b], ‘Lighten the yoke that your father put on us’?”
translation:
  language: hi
  text: तब उसने उनसे कहा, “तुम क्या सलाह देते हो, ताकि हम इस प्रजा को उत्तर दे सकें[a], जिसने मुझसे यह कहा है, ‘तुम्हारे पिता ने जो जूआ[b] हम पर रखा था, उसे हल्का कर दो’?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “हम उत्तर में एक बात लौटाएँ”; यह उत्तर देने का इब्रानी मुहावरा है।
    reason: lexical_alternative
  - marker: b
    text: यहाँ “जूआ” राजा द्वारा थोपे गए भारी श्रम और दायित्वों का रूपक है।
    reason: cultural_note
