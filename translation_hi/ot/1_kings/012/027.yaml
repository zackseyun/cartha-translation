base_translation:
  language: en
  yaml_path: translation/ot/1_kings/012/027.yaml
  text: If this people goes up to offer sacrifices in the house of Yahweh in Jerusalem[a], then the heart of this people will return to their lord, to Rehoboam king of Judah[c][b], and they will kill me and return to Rehoboam king of Judah.
translation:
  language: hi
  text: यदि ये लोग यरूशलेम में यहोवा के भवन में बलि चढ़ाने के लिए ऊपर जाएँ[a], तो इन लोगों का मन अपने स्वामी[b], यहूदा के राजा रहूबियाम, की ओर लौट जाएगा; तब वे मुझे मार डालेंगे और यहूदा के राजा रहूबियाम के पास लौट जाएँगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जब ये लोग ... ऊपर जाएँगे।” इब्रानी शब्द शर्त (“यदि”) या कुछ प्रसंगों में समय (“जब”) का भाव दे सकता है; यहाँ यारोबाम की आशंका के कारण “यदि” अधिक उपयुक्त है।
    reason: lexical_alternative
  - marker: b
    text: या, “अपने प्रभु।” यहाँ इब्रानी शब्द से स्वामी या अधिपति अभिप्रेत है; आगे के शब्द स्पष्ट करते हैं कि संकेत रहूबियाम की ओर है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: यदि
  rationale: यह यारोबाम की आशंका को शर्त के रूप में प्रस्तुत करता है; प्रसंग में ‘यदि’ स्वाभाविक है, यद्यपि कालवाचक अर्थ भी संभव है।
- source_word: יַעֲלֶה
  choice: ऊपर जाते रहे
  rationale: עלה यरूशलेम की तीर्थयात्रा के लिए प्रचलित ‘ऊपर जाना’ अभिव्यक्ति है। हिंदी में संभावित बारंबार यात्रा का भाव स्पष्ट करने के लिए ‘जाते रहे’ रखा गया है।
- source_word: לַעֲשׂוֹת זְבָחִים
  choice: बलि चढ़ाने के लिए
  rationale: शाब्दिक ‘बलियाँ करना’ के बजाय यह प्रचलित और अर्थनिष्ठ हिंदी धार्मिक अभिव्यक्ति है।
- source_word: בְּבֵית יְהוָה
  choice: यहोवा के भवन में
  rationale: ‘भवन’ मूल בית की छवि बनाए रखता है; संदर्भ में इससे यरूशलेम का मंदिर अभिप्रेत है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिंदी में परमेश्वर के व्यक्तिगत नाम का स्थापित रूप ‘यहोवा’ है और यह मूल चतुरक्षरी नाम को सामान्य उपाधि में नहीं बदलता।
- source_word: וְשָׁב לֵב הָעָם הַזֶּה
  choice: इन लोगों का मन ... की ओर फिर जाएगा
  rationale: ‘मन फिरना’ आंतरिक निष्ठा के लौटने का भाव रखता है और बाद के שוב की पुनरावृत्ति से संबंध बनाए रखता है।
- source_word: אֶל אֲדֹנֵיהֶם
  choice: अपने स्वामी की ओर
  rationale: रूप सम्मानसूचक/बहुवचन-जैसा है, किंतु अगला समानाधिकरण एक ही व्यक्ति रहूबियाम को स्पष्ट करता है; ‘स्वामी’ राजनीतिक अधीनता और निष्ठा का भाव देता है।
- source_word: וַהֲרָגֻנִי
  choice: तब वे मुझे मार डालेंगे
  rationale: הרג का सीधा आधुनिक हिंदी रूप ‘मार डालना’ है; ‘तब’ शर्त के अपेक्षित परिणाम को सहज बनाता है।
- source_word: וְשָׁבוּ
  choice: लौट जाएँगे
  rationale: यह वास्तविक रूप से रहूबियाम के पास वापस जाने को व्यक्त करता है और पहले मन के ‘फिर जाने’ के साथ मूल שוב की पुनरावृत्ति को यथासंभव बनाए रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल में व्यक्तिगत ईश्वरीय नाम है। हिंदी पाठकों में व्यापक रूप से पहचाना जाने वाला ‘यहोवा’ उसे ‘प्रभु’ जैसी उपाधि से अलग रखता है; ‘याहवे’ अधिक प्रत्यक्ष विद्वत्तापरक लिप्यंतरण है।
- issue: אֲדֹנֵיהֶם में रहूबियाम के लिए उपाधि
  choice: अपने स्वामी
  alternative: अपने प्रभु
  rationale: ‘स्वामी’ यहाँ राजनीतिक अधिपति का अर्थ स्पष्ट करता है और ईश्वरीय उपाधि ‘प्रभु’ से अनावश्यक भ्रम घटाता है; समानाधिकरण रहूबियाम को स्पष्ट पहचानता है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिंदी। ‘ऊपर जाना’ यरूशलेम की भौगोलिक तथा तीर्थ-संबंधी अभिव्यक्ति को सुरक्षित रखता है। वाक्य में डैश से ‘यहूदा के राजा रहूबियाम’ को ‘अपने स्वामी’ का स्पष्ट समानाधिकरण बनाया गया है।
