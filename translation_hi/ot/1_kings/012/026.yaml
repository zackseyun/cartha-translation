id: 1KI.12.26
reference: 1 Kings 12:26
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יֹּ֥אמֶר יָרָבְעָ֖ם בְּ/לִבּ֑/וֹ עַתָּ֛ה תָּשׁ֥וּב הַ/מַּמְלָכָ֖ה לְ/בֵ֥ית דָּוִֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/012/026.yaml
  text: And Jeroboam said in his heart[a], “Now the kingdom will return to the house of David.”
translation:
  language: hi
  text: तब यारोबाम ने अपने मन में कहा[a], “अब राज्य दाऊद के घराने के पास लौट जाएगा।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “अपने हृदय में”; अर्थात् “अपने आप से।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: तब ... ने कहा
  rationale: वाव-क्रमिक कथानक को आगे बढ़ाता है। आधुनिक हिन्दी में ‘तब’ स्वाभाविक ढंग से इस प्रगति को व्यक्त करता है।
- source_word: יָרָבְעָם
  choice: यारोबाम
  rationale: व्यक्तिनाम का प्रचलित हिन्दी बाइबलीय लिप्यंतरण रखा गया है।
- source_word: בְּלִבּוֹ
  choice: अपने मन में
  rationale: शाब्दिक अर्थ ‘अपने हृदय में’ है और यह मन-ही-मन विचार करने का इब्रानी मुहावरा है। हिन्दी में ‘अपने मन में’ अर्थ और आंतरिक-विचार की छवि दोनों को स्वाभाविक रूप से बनाए रखता है।
- source_word: עַתָּה
  choice: अब
  rationale: यह यारोबाम की चिंता की तत्कालिकता को संक्षेप और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: תָּשׁוּב
  choice: लौट जाएगा
  rationale: שׁוב का अर्थ ‘लौटना/फिर जाना’ है। यहाँ यह राज्य के दाऊद के राजवंश के अधिकार में फिर चले जाने की आशंका व्यक्त करता है।
- source_word: הַמַּמְלָכָה
  choice: राज्य
  rationale: संदर्भ में यह राजकीय सत्ता अथवा राजनीतिक राज्य को सूचित करता है; ‘राज्य’ आधुनिक हिन्दी में स्वाभाविक और सटीक है।
- source_word: לְבֵית דָּוִד
  choice: दाऊद के घराने के पास
  rationale: ‘दाऊद का घराना’ दाऊद की वंशगत राजसत्ता को दर्शाने वाला पारंपरिक बाइबलीय पद है। ‘के पास’ लौटना हिन्दी में सत्ता के पुनः उसी घराने के अधिकार में जाने को सहज रूप से व्यक्त करता है।
theological_decisions:
- issue: בְּלִבּוֹ में आंतरिक कथन का मुहावरा
  choice: अपने मन में
  alternative: अपने हृदय में; अपने आप से
  rationale: ‘अपने मन में’ इब्रानी के आंतरिक-विचार संबंधी अर्थ को स्पष्ट रखता है, जबकि पादटिप्पणी उसके शाब्दिक ‘हृदय’ रूप को सुरक्षित करती है। इससे पाठ में कोई अतिरिक्त धर्मवैज्ञानिक निष्कर्ष नहीं जोड़ा जाता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘दाऊद का घराना’ वंशगत राजसत्ता की बाइबलीय अभिव्यक्ति को बनाए रखता है।
