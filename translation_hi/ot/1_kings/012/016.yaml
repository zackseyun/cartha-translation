  text: When all Israel saw that the king had not listened to them[a], the people answered the king, saying, “What share do we have in David? We have no inheritance in the son of Jesse. To your tents, O Israel! Now see to your own house[b], David.” So Israel went to their tents.
translation:
  language: hi
  text: जब समस्त इस्राएल ने देखा कि राजा ने उनकी बात नहीं मानी, तब लोगों ने राजा को उत्तर दिया, “दाऊद में हमारा क्या हिस्सा है? यिशै के पुत्र में हमारी कोई विरासत नहीं। हे इस्राएल, अपने-अपने तंबुओं की ओर चलो![a] अब अपने घर की सुधि ले, दाऊद!”[b] तब इस्राएल अपने-अपने तंबुओं की ओर चला गया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक अर्थ “अपने-अपने तंबुओं की ओर चलो!” है। यह अपने निवासों को जाने और राजकीय निष्ठा वापस लेने का आह्वान है।
    reason: lexical_alternative
  - marker: b
    text: 'यहाँ “घर” का अर्थ “घराना” या “राजवंश” भी हो सकता है: “अब अपने राजवंश की सुधि ले, दाऊद!”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא כָּל־יִשְׂרָאֵל
  choice: जब समस्त इस्राएल ने देखा
  rationale: ‘देखा’ ראה के मूल अर्थ को बनाए रखते हुए प्रसंग में समझ लेने का भाव भी देता है; ‘समस्त इस्राएल’ सामूहिक राजनीतिक इकाई को व्यक्त करता है।
- source_word: לֹא־שָׁמַע הַמֶּלֶךְ אֲלֵיהֶם
  choice: राजा ने उनकी बात नहीं मानी
  rationale: שׁמע אֶל का अर्थ केवल सुनना नहीं, बल्कि ध्यान देना या बात मानना है। हिंदी में यह राजा द्वारा निवेदन ठुकराने को स्वाभाविक रूप से व्यक्त करता है।
- source_word: וַיָּשִׁבוּ הָעָם אֶת־הַמֶּלֶךְ דָּבָר
  choice: लोगों ने राजा को उत्तर दिया
  rationale: शाब्दिक रूप से ‘एक बात लौटाई’ उत्तर देने का इब्रानी मुहावरा है; हिंदी में ‘उत्तर दिया’ स्पष्ट और स्वाभाविक है।
- source_word: מַה־לָּנוּ חֵלֶק בְּדָוִד
  choice: दाऊद में हमारा क्या हिस्सा है?
  rationale: חֵלֶק का हिस्सा या भाग वाला अर्थ बनाए रखा गया है, जिससे राजवंशीय सहभागिता और निष्ठा के त्याग का राजनीतिक भाव सुरक्षित रहता है।
- source_word: וְלֹא־נַחֲלָה בְּבֶן־יִשַׁי
  choice: यिशै के पुत्र में हमारी कोई विरासत नहीं
  rationale: נַחֲלָה के उत्तराधिकार, पैतृक भाग और अधिकार-क्षेत्र से जुड़े अर्थ को ‘विरासत’ व्यक्त करती है। ‘यिशै के पुत्र’ संबोधन की तिरस्कारपूर्ण वंश-सूचक शैली बनाए रखता है।
- source_word: לְאֹהָלֶיךָ יִשְׂרָאֵל
  choice: हे इस्राएल, अपने-अपने तंबुओं को लौट जाओ!
  rationale: אֹהֶל का शाब्दिक ‘तंबू’ सुरक्षित है और सामूहिक एकवचन आज्ञा को हिंदी में स्वाभाविक बहुवचन से व्यक्त किया गया है। ‘लौट जाओ’ बिखरकर अपने निवास जाने और राजनीतिक निष्ठा वापस लेने के मुहावरेदार आशय को स्पष्ट करता है।
- source_word: עַתָּה רְאֵה בֵיתְךָ דָּוִד
  choice: अब अपने घर की सुधि तू ही ले, दाऊद!
  rationale: ראה यहाँ ध्यान रखने या संभालने के अर्थ में है। ‘घर’ literal household और राजवंश, दोनों संभावनाओं को खुला रखता है; ‘तू ही’ विद्रोही और चुनौतीपूर्ण बल को स्वाभाविक हिंदी में दर्शाता है।
- source_word: וַיֵּלֶךְ יִשְׂרָאֵל לְאֹהָלָיו
  choice: तब इस्राएल अपने-अपने तंबुओं को चला गया
  rationale: सामूहिक एकवचन ‘इस्राएल’ और क्रिया का मेल रखा गया है तथा पहले प्रयुक्त ‘तंबुओं’ की पुनरावृत्ति सुरक्षित है।
theological_decisions:
- issue: दाऊद के घराने के विरुद्ध राजनीतिक नारा
  choice: इसे रहूबियाम और दाऊदी राजघराने के प्रति राजनीतिक निष्ठा त्यागने की सीधी घोषणा के रूप में प्रस्तुत किया गया है।
  alternative: इसे स्पष्ट रूप से मसीह-विरोधी या दाऊदी वाचा के अंतिम निषेध के रूप में प्रस्तुत करना।
  rationale: इब्रानी पाठ ऐतिहासिक विद्रोह की तीव्रता दिखाता है, पर इस एक पद में उसके व्यापक धर्मवैज्ञानिक अर्थ का अंतिम निर्णय नहीं देता।
- issue: בֵיתְךָ में ‘घर’ और ‘राजवंश’ का अर्थ
  choice: मुख्य पाठ में ‘घर’ रखकर उसकी बहुअर्थता सुरक्षित की गई है।
  alternative: मुख्य पाठ में केवल ‘राजवंश’ कहना।
  rationale: प्रसंग में राजवंश का अर्थ प्रबल है, किंतु ‘घर’ शब्द परिवार, घराना और राजवंश के स्तरों को एक साथ धारण कर सकता है; टिप्पणी अर्थ स्पष्ट करती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। विद्रोही नारे की काव्यात्मक समानांतरता और तीक्ष्णता बनाए रखते हुए अत्यधिक संस्कृतनिष्ठ शब्दावली से बचा गया है।
