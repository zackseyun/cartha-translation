    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלְחוּ
  choice: उन्होंने भेजकर
  rationale: שׁלח का मूल अर्थ ‘भेजना’ है। हिन्दी में अगले क्रियापद के साथ ‘भेजकर’ स्वाभाविक रूप से दोनों क्रमिक कार्यों को जोड़ता है और भेजे गए व्यक्ति या संदेश को अनावश्यक रूप से निर्दिष्ट नहीं करता।
- source_word: וַיִּקְרְאוּ לוֹ
  choice: उसे बुलवाया
  rationale: קרא + ל यहाँ किसी को आने के लिए बुलाने का भाव देता है। ‘बुलवाया’ पिछले ‘भेजकर’ के साथ स्वाभाविक हिन्दी बनाता है और प्रसंग में निहित बुलावे को स्पष्ट करता है।
- source_word: וַיָּבֹאוּ
  choice: आकर
  rationale: בוא का सामान्य अर्थ ‘आना’ है। ‘आकर’ अगले कार्य ‘कहने लगे’ से कथा-क्रम को सहज रूप से जोड़ता है।
- source_word: יָרָבְעָם
  choice: यारोबाम
  rationale: व्यक्तिनाम का प्रचलित हिन्दी बाइबलीय लिप्यंतरण।
- source_word: וְכָל־קְהַל יִשְׂרָאֵל
  choice: तथा इस्राएल की सारी सभा
  rationale: קהל एकत्रित समुदाय या सभा को दर्शाता है। यहाँ ‘सभा’ सार्वजनिक-राजनीतिक रूप से एकत्र इस्राएली समुदाय के लिए उपयुक्त और संप्रदाय-निरपेक्ष है।
- source_word: וַיְדַבְּרוּ אֶל־רְחַבְעָם
  choice: रहूबियाम से कहने लगे
  rationale: דבר אל का अर्थ ‘किसी से बोलना’ है। अगले पद में आने वाले प्रत्यक्ष कथन के कारण ‘कहने लगे’ हिन्दी में स्वाभाविक भूमिका बाँधता है और बहुवचन कर्ता को बनाए रखता है।
- source_word: לֵאמֹר
  choice: कहने लगे,
  rationale: यह रूप आगे आने वाले प्रत्यक्ष कथन का परिचय देता है। पद के अंत का अल्पविराम अगले पद से वाक्य की निरंतरता दिखाता है।
