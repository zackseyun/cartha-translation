base_translation:
  language: en
  yaml_path: translation/ot/1_kings/012/032.yaml
  text: Jeroboam made a feast in the eighth month[a], on the fifteenth day of the month, like the feast that was in Judah, and he went up to the altar. So he did in Bethel, sacrificing to the calves that he had made[b]; and he installed in Bethel the priests of the high places that he had made.
translation:
  language: hi
  text: यारोबाम ने आठवें महीने[a] में, महीने के पंद्रहवें दिन, यहूदा में मनाए जाने वाले पर्व के समान एक पर्व मनाया; और वह वेदी पर चढ़ा[b]। इस प्रकार उसने बेतेल में अपने बनाए हुए बछड़ों को बलि चढ़ाई, और उसने बेतेल में उन ऊँचे पूजा-स्थानों के याजकों को नियुक्त किया जिन्हें उसने बनाया था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहूदा का यह पर्व संभवतः झोपड़ियों का पर्व था, जो सातवें महीने के पंद्रहवें दिन मनाया जाता था; यारोबाम ने उसके समान अपना पर्व एक महीने बाद रखा।
    reason: cross_reference
  - marker: b
    text: या, “वह वेदी तक चढ़ गया।” इब्रानी अभिव्यक्ति को अधिक प्रसंगानुकूल ढंग से वेदी के पास जाकर धार्मिक विधि संपन्न करने के अर्थ में भी समझा जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ ... חָג
  choice: पर्व मनाया
  rationale: עשה के साथ חָג का मुहावरेदार अर्थ पर्व आयोजित करना या मनाना है; आधुनिक हिन्दी में ‘पर्व मनाया’ स्वाभाविक और स्पष्ट है।
- source_word: בַּחֹדֶשׁ הַשְּׁמִינִי ... בַּחֲמִשָּׁה עָשָׂר יוֹם לַחֹדֶשׁ
  choice: आठवें महीने के पंद्रहवें दिन
  rationale: इब्रानी तिथि-सूत्र का सहज और सटीक हिन्दी रूप।
- source_word: כֶּחָג אֲשֶׁר בִּיהוּדָה
  choice: वैसा ही पर्व ... जैसा यहूदा में मनाया जाता था
  rationale: स्पष्ट तुलना को बनाए रखता है, पर पर्व का नाम नहीं जोड़ता, क्योंकि इस पद में वह नामित नहीं है।
- source_word: וַיַּעַל עַל הַמִּזְבֵּחַ
  choice: वह वेदी के पास चढ़ गया
  rationale: עלה על में वेदी की ओर/उसके निकट विधिक सेवा के लिए चढ़ने का भाव हो सकता है; यह रूप वेदी की सतह पर चढ़ने का अनावश्यक निश्चित अर्थ नहीं देता।
- source_word: לְזַבֵּחַ לָעֲגָלִים
  choice: बछड़ों के लिए बलि चढ़ाई
  rationale: לְ उपसर्ग बलि के लक्ष्य या संबद्धता को व्यक्त करता है। ‘के लिए’ स्रोत की दिशा को रखता है और हिन्दी में स्वाभाविक है।
- source_word: הָעֲגָלִים
  choice: बछड़ों
  rationale: शब्द का सीधा अर्थ ‘बछड़े’ है; मुख्य पाठ में ‘मूर्तियाँ’ जोड़कर कथावाचक की भाषा को अधिक व्याख्यात्मक नहीं बनाया गया।
- source_word: וְהֶעֱמִיד
  choice: नियुक्त किया
  rationale: हिफ़ील क्रिया यहाँ याजकों को पद पर स्थापित करने का भाव देती है; ‘नियुक्त किया’ आधुनिक हिन्दी में कार्यगत अर्थ स्पष्ट करता है।
- source_word: כֹּהֲנֵי הַבָּמוֹת
  choice: पूजा-स्थानों के याजकों
  rationale: במות ऊँचे अथवा स्थानीय उपासना-स्थल हैं। ‘पूजा-स्थान’ साधारण पाठक को आशय स्पष्ट करता है और केवल भौगोलिक ऊँचाई का भ्रम घटाता है।
theological_decisions:
- issue: यहूदा के पर्व की पहचान
  choice: मुख्य पाठ में केवल ‘जैसा यहूदा में मनाया जाता था’ रखा गया।
  alternative: इसे स्पष्टतः झोपड़ियों का पर्व कहना।
  rationale: सातवें महीने के पंद्रहवें दिन वाले झोपड़ियों के पर्व की ओर संकेत प्रबल है, पर इस पद का इब्रानी पाठ पर्व का नाम नहीं बताता; संभावित पहचान पादटिप्पणी में दी गई है।
- issue: यारोबाम की उपासना का मूल्यांकन
  choice: बछड़ों और याजकों का वर्णन बिना अतिरिक्त निंदात्मक विशेषणों के किया गया।
  alternative: ‘मूर्तियों’ या ‘अवैध याजकों’ जैसे शब्द जोड़ना।
  rationale: व्यापक कथा इन कार्यों का नकारात्मक मूल्यांकन करती है, लेकिन इस पद के वर्णन में वे विशेषण प्रत्यक्षतः नहीं हैं।
- issue: वेदी पर चढ़ने की क्रिया
  choice: ‘वेदी के पास चढ़ गया’ मुख्य पाठ में रखा गया।
  alternative: ‘वेदी पर चढ़ गया।’
  rationale: इब्रानी על का अधिक शाब्दिक रूप ‘पर’ हो सकता है, किंतु प्रसंग वेदी के निकट जाकर विधि संपन्न करने का संकेत दे सकता है; वैकल्पिक शाब्दिक अर्थ पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य हिन्दी पाठक के लिए स्पष्ट रखी गई है। ‘बेतेल’, ‘वेदी’, ‘बलि’ और ‘याजक’ जैसे प्रचलित बाइबलीय शब्द बनाए गए हैं। दोनों पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित हैं।
