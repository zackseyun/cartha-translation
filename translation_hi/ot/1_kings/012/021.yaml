id: 1KI.12.21
reference: 1 Kings 12:21
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: ו/יבאו רְחַבְעָם֮ יְרוּשָׁלִַם֒ וַ/יַּקְהֵל֩ אֶת כָּל בֵּ֨ית יְהוּדָ֜ה וְ/אֶת שֵׁ֣בֶט בִּנְיָמִ֗ן מֵאָ֨ה וּ/שְׁמֹנִ֥ים אֶ֛לֶף בָּח֖וּר עֹשֵׂ֣ה מִלְחָמָ֑ה לְ/הִלָּחֵם֙ עִם בֵּ֣ית יִשְׂרָאֵ֔ל לְ/הָשִׁיב֙ אֶת הַ/מְּלוּכָ֔ה לִ/רְחַבְעָ֖ם בֶּן שְׁלֹמֹֽה־־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/012/021.yaml
  text: When Rehoboam came to Jerusalem[a], he assembled all the house of Judah and the tribe of Benjamin, one hundred eighty thousand chosen warriors, to fight against the house of Israel, to restore the kingdom to Rehoboam son of Solomon.
translation:
  language: hi
  text: जब रहूबियाम यरूशलेम आया, तब उसने यहूदा के समूचे घराने और बिन्यामीन के गोत्र को इकट्ठा किया—एक लाख अस्सी हज़ार चुने हुए योद्धाओं[a] को—ताकि वे इस्राएल के घराने से युद्ध करें और राज्य फिर सुलैमान के पुत्र रहूबियाम को लौटा दें।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “युद्ध के लिए चुने गए पुरुषों।”
    reason: בָּחוּר और עֹשֵׂה מִלְחָמָה के संयुक्त सैन्य वाक्यांश का अधिक शाब्दिक विकल्प।
lexical_decisions:
- source_word: וַיָּבֹא / ויבאו
  choice: आया
  rationale: संदर्भ में कर्ता रहूबियाम एकवचन है और अगली क्रिया भी एकवचन है; इसलिए यरूशलेम गंतव्य के साथ स्वाभाविक हिन्दी ‘आया’ है।
- source_word: וַיַּקְהֵל
  choice: इकट्ठा किया
  rationale: हिफ़ील रूप लोगों को एकत्र करने का कारक अर्थ देता है; यह आधुनिक हिन्दी में सहज है।
- source_word: כָּל בֵּית יְהוּדָה
  choice: यहूदा के समूचे घराने
  rationale: ‘घराना’ राजनीतिक-सामूहिक मुहावरे को बनाए रखता है और आगे ‘इस्राएल के घराने’ के समानांतर है।
- source_word: שֵׁבֶט בִּנְיָמִן
  choice: बिन्यामीन के गोत्र
  rationale: שֵׁבֶט को स्पष्ट रूप से ‘गोत्र’ अनूदित किया गया है, जिससे जनजातीय पहचान बनी रहती है।
- source_word: מֵאָה וּשְׁמֹנִים אֶלֶף
  choice: एक लाख अस्सी हज़ार
  rationale: यह संख्या का स्वाभाविक आधुनिक हिन्दी रूप है।
- source_word: בָּחוּר עֹשֵׂה מִלְחָמָה
  choice: चुने हुए योद्धाओं
  rationale: सैन्य प्रसंग में בָּחוּר चयनित अथवा श्रेष्ठ सैनिकों का बोध करा सकता है; ‘योद्धा’ עֹשֵׂה מִלְחָמָה के युद्धकारी अर्थ को संक्षेप में व्यक्त करता है।
- source_word: לְהִלָּחֵם עִם
  choice: से युद्ध करें
  rationale: यहाँ עִם विरोधी पक्ष को सूचित करता है; हिन्दी में ‘से युद्ध करना’ स्वाभाविक है।
- source_word: בֵּית יִשְׂרָאֵל
  choice: इस्राएल के घराने
  rationale: राजनीतिक-सामूहिक अभिव्यक्ति को रखा गया है और ‘यहूदा के घराने’ के साथ उसका समानांतर सुरक्षित है।
- source_word: לְהָשִׁיב אֶת הַמְּלוּכָה לִרְחַבְעָם
  choice: राज्य फिर ... रहूबियाम को लौटा दें
  rationale: हिफ़ील לְהָשִׁיב किसी वस्तु या शासन को वापस दिलाने का अर्थ देता है; वाक्य-विन्यास लक्ष्य और प्राप्तकर्ता दोनों को स्पष्ट करता है।
theological_decisions:
- issue: מַמְלָכָה का राजनीतिक अर्थ
  choice: राज्य
  alternative: राजसत्ता
  rationale: विभाजित राज्य के प्रसंग में ‘राज्य’ सबसे स्वाभाविक है, यद्यपि मूल शब्द में राजसत्ता अथवा शाही शासन की छाया भी मौजूद है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘घराना’ द्वारा यहूदा और इस्राएल के राजनीतिक-सामूहिक समानांतर को सुरक्षित रखा गया है। अंग्रेज़ी परामर्श-पाठ में पादटिप्पणी-चिह्न यरूशलेम के बाद था, पर उसकी सामग्री सैनिक-वाक्यांश से संबंधित है; इसलिए हिन्दी में चिह्न उसी वाक्यांश पर लगाया गया है।
