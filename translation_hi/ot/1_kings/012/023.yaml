  yaml_path: translation/ot/1_kings/012/023.yaml
  text: Speak to Rehoboam son of Solomon[a], king of Judah, and to all the house of Judah and Benjamin, and the rest of the people, saying[c][b],
translation:
  language: hi
  text: '“सुलैमान के पुत्र और यहूदा के राजा रहूबियाम से, यहूदा के पूरे घराने[a] और बिन्यामीन से, और बाकी लोगों[b] से कह:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘यहूदा का पूरा घराना’ इब्रानी का सामुदायिक-राजनीतिक मुहावरा है; इसका अनुवाद ‘समूचा यहूदा’ भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: संदर्भ में ‘लोगों’ से युद्ध के लिए इकट्ठे लोग अभिप्रेत हो सकते हैं, पर इब्रानी पाठ यहाँ स्पष्ट रूप से ‘सेना’ नहीं कहता।
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱמֹר
  choice: कह
  rationale: אמר का पुल्लिंग एकवचन आज्ञार्थक रूप है। संदेश पहुँचाने की सीधी आज्ञा के लिए आधुनिक हिन्दी में ‘कह’ स्वाभाविक है।
- source_word: רְחַבְעָם בֶּן שְׁלֹמֹה
  choice: सुलैमान के पुत्र रहूबियाम
  rationale: वंश-संबंध को स्पष्ट रखते हुए हिन्दी की स्वाभाविक पद-रचना अपनाई गई है; व्यक्तिनामों का प्रचलित हिन्दी लिप्यंतरण रखा गया है।
- source_word: מֶלֶךְ יְהוּדָה
  choice: यहूदा के राजा
  rationale: राजकीय उपाधि और उसके क्षेत्र/राज्य के संबंध का सीधा और स्वाभाविक अनुवाद।
- source_word: כָּל בֵּית יְהוּדָה
  choice: यहूदा के पूरे घराने
  rationale: בֵּית के सामुदायिक-राजनीतिक मुहावरे को ‘घराना’ द्वारा सुरक्षित रखा गया है; यहाँ अर्थ केवल घरेलू परिवार नहीं, बल्कि यहूदा का सामूहिक समुदाय हो सकता है।
- source_word: וּבִנְיָמִין
  choice: और बिन्यामीन से
  rationale: मूल में बिन्यामीन स्वतंत्र जनजातीय नाम के रूप में है; संदर्भ में इससे बिन्यामीन का समुदाय अभिप्रेत है, पर ‘घराना’ शब्द मूल में दोहराया नहीं गया।
- source_word: וְיֶתֶר הָעָם
  choice: और बाकी लोगों से
  rationale: יֶתֶר का अर्थ ‘शेष/बाकी’ और הָעָם का सामान्य अर्थ ‘लोग/प्रजा’ है। युद्ध-संदर्भ के बावजूद मूल पाठ स्पष्ट रूप से ‘सेना’ नहीं कहता।
- source_word: לֵאמֹר
  choice: 'कह:'
  rationale: यह कथन-विषय का परिचायक है और अगली आयत में आने वाले संदेश से जोड़ता है। हिन्दी में आरंभिक ‘कह’ और अंत का द्विबिंदु इस संरचना को सहज रूप में व्यक्त करते हैं।
