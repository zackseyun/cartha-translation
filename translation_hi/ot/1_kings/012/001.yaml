source:
  edition: WLC
  text: וַ/יֵּ֥לֶךְ רְחַבְעָ֖ם שְׁכֶ֑ם כִּ֥י שְׁכֶ֛ם בָּ֥א כָל יִשְׂרָאֵ֖ל לְ/הַמְלִ֥יךְ אֹתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/012/001.yaml
  text: Then Rehoboam went to Shechem, because all Israel had come to Shechem to make him king.
translation:
  language: hi
  text: तब रहूबियाम शकेम गया, क्योंकि समस्त इस्राएल उसे राजा बनाने के लिए शकेम आया था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: तब ... गया
  rationale: कथात्मक वाव को प्रसंगानुकूल क्रमसूचक ‘तब’ से व्यक्त किया गया है।
- source_word: שְׁכֶם
  choice: शकेम
  rationale: स्थान-नाम का प्रचलित हिन्दी लिप्यंतरण।
- source_word: כִּי
  choice: क्योंकि
  rationale: यहाँ रहूबियाम के शकेम जाने का कारण बताता है।
- source_word: כָל יִשְׂרָאֵל
  choice: समस्त इस्राएल
  rationale: सामूहिक राष्ट्रीय अभिव्यक्ति को औपचारिक किंतु सहज हिन्दी में रखा गया है।
- source_word: לְהַמְלִיךְ אֹתוֹ
  choice: उसे राजा बनाने के लिए
  rationale: हिफ़ील क्रिया का उद्देश्य और राजपद पर स्थापित करने का भाव स्वाभाविक हिन्दी में व्यक्त होता है।
theological_decisions:
- issue: राजा बनाए जाने में जनसमुदाय की भूमिका
  choice: उसे राजा बनाने के लिए
  alternative: उसका राज्याभिषेक करने के लिए
  rationale: मूल क्रिया व्यापक रूप से किसी को राजा बनाने/स्थापित करने का अर्थ देती है; ‘राज्याभिषेक’ अनुष्ठान की ऐसी विशिष्टता जोड़ सकता है जो इस पद में स्पष्ट नहीं है।
translation_notes:
  register: आधुनिक मानक हिन्दी; कथात्मक, सहज और गरिमापूर्ण शैली। मूल वाक्य का कारण-संबंध और सामूहिक ‘समस्त इस्राएल’ सुरक्षित रखा गया है।
