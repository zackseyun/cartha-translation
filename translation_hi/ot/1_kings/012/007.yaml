  text: And he spoke to him[a], saying, “If today you will be a servant to this people, and serve them, and answer them, and speak good words to them[b], then they will be your servants all your days.”
translation:
  language: hi
  text: उसने[a] उससे कहा, “यदि आज आप इस प्रजा के सेवक बनें, उनकी सेवा करें, उन्हें उत्तर दें और उनसे भले वचन बोलें, तो वे सदा आपके सेवक होंगे।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ दिए गए हिब्रू पाठ में क्रिया एकवचन है—“उसने कहा”; आसपास के प्रसंग में बोलने वाले बुज़ुर्गों का समूह है।
    reason: textual_context
lexical_decisions:
- source_word: עֶבֶד / עֲבָדִים
  choice: सेवक / सेवक
  rationale: यहाँ दासता की कानूनी स्थिति नहीं, बल्कि राजा और प्रजा के बीच सेवा का राजनीतिक रूपक है। एक ही शब्द रखकर पद में निहित पारस्परिक विरोधाभास सुरक्षित रहता है।
- source_word: וַעֲבַדְתָּם
  choice: उनकी सेवा करे
  rationale: עבד की क्रिया को ‘सेवा करना’ कहने से पहले आए ‘सेवक’ के साथ शब्दगत संबंध बना रहता है।
- source_word: וַעֲנִיתָם
  choice: उन्हें उत्तर दे
  rationale: लोगों की विनती के संदर्भ में ענה का अर्थ उत्तर देना है, न कि दुःख देना।
- source_word: דְּבָרִים טוֹבִים
  choice: भली बातें
  rationale: यह हिब्रू अभिव्यक्ति के निकट है और आधुनिक हिन्दी में कृपालु तथा अनुकूल वचन कहने का भाव स्वाभाविक रूप से व्यक्त करती है।
- source_word: וְהָיוּ לְךָ עֲבָדִים
  choice: वे तेरे सेवक बने रहेंगे
  rationale: संज्ञा ‘सेवक’ को स्पष्ट रखता है और राजा द्वारा आज सेवा किए जाने तथा आगे प्रजा के उसकी सेवा में रहने की पारस्परिकता को सुरक्षित करता है।
- source_word: כָּל הַיָּמִים
  choice: सदा
  rationale: हिब्रू मुहावरे का आधुनिक हिन्दी में स्वाभाविक अर्थ ‘सदा’ है; इससे निरंतर निष्ठा का आशय व्यक्त होता है।
- source_word: אִם הַיּוֹם
  choice: यदि आज
  rationale: ‘आज’ वर्तमान संकट में तत्काल लिए जाने वाले निर्णय पर हिब्रू के बल को बनाए रखता है।
- source_word: ו/ידבר אֵלָיו לֵאמֹר
  choice: उसने उससे कहा
  rationale: प्रदान किए गए हिब्रू पाठ में क्रिया एकवचन रूप में है; इसलिए मुख्य पाठ उसी को सीधे व्यक्त करता है, जबकि प्रसंगगत तनाव पादटिप्पणी में बताया गया है।
theological_decisions:
- issue: राजत्व को सेवा के रूप में प्रस्तुत करने वाला राजनीतिक रूपक
  choice: सेवक और सेवा की भाषा को सीधे बनाए रखा गया है।
  alternative: इसे ‘प्रजा के अधीन होना’ या केवल ‘उनकी सहायता करना’ कहना।
  rationale: मूल पाठ राजा और प्रजा की भूमिकाओं में जानबूझकर पारस्परिकता दिखाता है। इसे न तो नरम करना चाहिए, न बाद की किसी विशिष्ट धर्मवैज्ञानिक धारणा में बदलना चाहिए।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सहज हिन्दी। सीधे संबोधन में ‘तू/तेरे’ रखा गया है, जो प्राचीन राजकीय परामर्श के प्रसंग में निकट और स्वाभाविक है। ‘प्रजा’ राजनीतिक संदर्भ को स्पष्ट करती है; वाक्य की शर्त और परिणाम की संरचना मूल के अनुरूप रखी गई है।
