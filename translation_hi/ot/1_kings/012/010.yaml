base_translation:
  language: en
  yaml_path: translation/ot/1_kings/012/010.yaml
  text: 'The young men who had grown up with him spoke to him, saying, “This is what you shall say to this people who spoke to you, saying, ‘Your father made our yoke heavy, but you, make it lighter for us’: this is what you shall say to them, ‘My little finger is thicker than my father’s waist.’”'
translation:
  language: hi
  text: 'जो जवान उसके साथ बड़े हुए थे, उन्होंने उससे कहा, “तुम उन लोगों से, जिन्होंने तुमसे यह कहकर बात की है, ‘तुम्हारे पिता ने हमारा जूआ भारी कर दिया था, पर तुम उसे हमारे लिए हल्का कर दो,’ यह कहना: ‘मेरी छोटी उँगली मेरे पिता की कमर से भी मोटी है।’”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַיְלָדִים
  choice: वे जवान
  rationale: यहाँ शब्द उन समवयस्क सलाहकारों के लिए है जो रहूबियाम के साथ बड़े हुए थे; ‘जवान’ प्रसंगानुकूल और स्वाभाविक है।
- source_word: עֻלֵּנוּ
  choice: हमारा जूआ
  rationale: मूल रूपक को बनाए रखा गया है; संदर्भ में यह शासन के भारी बोझ को दर्शाता है।
- source_word: קָטָנִּי
  choice: मेरी छोटी उँगली
  rationale: शाब्दिक अर्थ संभवतः ‘मेरी कनिष्ठिका/छोटी उँगली’ है; सामान्य पाठक के लिए ‘छोटी उँगली’ अधिक सहज है।
- source_word: מָתְנֵי אָבִי
  choice: मेरे पिता की कमर
  rationale: ‘कमर/कटि’ के मूल शारीरिक बिंब को स्वाभाविक आधुनिक हिन्दी में सुरक्षित रखा गया है।
theological_decisions:
- issue: कठोर उत्तर के रूपक का अर्थ
  choice: रूपक को बिना व्याख्यात्मक विस्तार के रखा गया
  alternative: इसे सीधे ‘मैं अपने पिता से अधिक कठोर हूँ’ कहना
  rationale: मूल की तीखी, अतिशयोक्तिपूर्ण छवि और उसकी व्यंजना को पाठक के लिए खुला रखना उचित है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सहज हिन्दी। उद्धरण के भीतर उद्धरण स्पष्ट रखा गया है; हिब्रू की पुनरुक्त कथन-रचना को हिन्दी में संक्षिप्त किया गया, पर आशय और वक्ताओं का क्रम सुरक्षित है।
