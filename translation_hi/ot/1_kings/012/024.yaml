  edition: WLC
  text: כֹּ֣ה אָמַ֣ר יְהוָ֡ה לֹֽא תַעֲלוּ֩ וְ/לֹא תִלָּ֨חֲמ֜וּ/ן עִם אֲחֵי/כֶ֣ם בְּנֵֽי יִשְׂרָאֵ֗ל שׁ֚וּבוּ אִ֣ישׁ לְ/בֵית֔/וֹ כִּ֧י מֵ/אִתִּ֛/י נִהְיָ֖ה הַ/דָּבָ֣ר הַ/זֶּ֑ה וַ/יִּשְׁמְעוּ֙ אֶת דְּבַ֣ר יְהוָ֔ה וַ/יָּשֻׁ֥בוּ לָ/לֶ֖כֶת כִּ/דְבַ֥ר יְהוָֽה־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/012/024.yaml
  text: 'Thus says Yahweh: ‘Do not go up or fight against your brothers[a], the sons of Israel. Return, each man to his house[c][b], for this thing is from me.’ So they listened to the word of Yahweh and turned back to go according to the word of Yahweh.'
translation:
  language: hi
  text: 'यहोवा यों कहता है: ‘ऊपर मत चढ़ो और अपने भाइयों—इस्राएलियों[a]—से युद्ध मत करो। तुममें से हर एक अपने घर लौट जाए, क्योंकि यह बात[b] मेरी ओर से हुई है।’ तब उन्होंने यहोवा का वचन सुना और यहोवा के वचन के अनुसार लौट गए।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “तुम्हारे भाइयों, इस्राएल के पुत्रों, के साथ।” “युद्ध करना” क्रिया के साथ यहाँ “के साथ” का अर्थ उनके विरुद्ध युद्ध करना है।
    reason: lexical_alternative
  - marker: b
    text: “बात” का अनुवाद “मामला” या “घटना” भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה אָמַר יְהוָה
  choice: यहोवा यों कहता है
  rationale: यह भविष्यद्वक्ताओं का प्रचलित संदेशवाहक-सूत्र है। ‘यों कहता है’ उसकी औपचारिक गरिमा बनाए रखता है और יְהוָה को व्यक्तिगत वाचा-नाम ‘यहोवा’ के रूप में प्रस्तुत करता है।
- source_word: לֹא תַעֲלוּ וְלֹא תִלָּחֲמוּן
  choice: ऊपर मत चढ़ो और ... युद्ध मत करो
  rationale: עלה का मूल स्थानिक अर्थ ‘ऊपर चढ़ना’ है, जो यहाँ सैन्य अभियान का संकेत भी देता है। לחם का निफ़ाल रूप युद्ध करने के अर्थ में है।
- source_word: עִם אֲחֵיכֶם בְּנֵי יִשְׂרָאֵל
  choice: अपने भाइयों—इस्राएलियों—से
  rationale: לחם के साथ עִם विरोधी पक्ष को दर्शाता है, इसलिए हिन्दी में ‘से युद्ध’ स्वाभाविक है। ‘भाइयों’ पारिवारिक बल को बनाए रखता है और ‘इस्राएलियों’ בְּנֵי יִשְׂרָאֵל की स्पष्ट पहचान देता है।
- source_word: שׁוּבוּ אִישׁ לְבֵיתוֹ
  choice: तुममें से हर एक अपने घर लौट जाए
  rationale: אִישׁ यहाँ वितरणात्मक है—‘हर एक’। यह रूप आधुनिक हिन्दी में स्वाभाविक रहते हुए एक-एक व्यक्ति को दिए गए आदेश को व्यक्त करता है।
- source_word: כִּי מֵאִתִּי נִהְיָה הַדָּבָר הַזֶּה
  choice: क्योंकि यह बात मेरी ओर से हुई है
  rationale: מֵאִתִּי उद्गम को और נִהְיָה घटित होने को व्यक्त करता है। ‘मेरी ओर से हुई है’ ईश्वरीय स्रोत को स्पष्ट करता है, पर कारणता की किसी अधिक विशिष्ट दार्शनिक व्याख्या को नहीं थोपता।
- source_word: וַיִּשְׁמְעוּ אֶת דְּבַר יְהוָה
  choice: तब उन्होंने यहोवा का वचन सुना
  rationale: שׁמע में सुनने और मानने दोनों का अर्थ-सामर्थ्य है। ‘सुना’ मूल अस्पष्टता बनाए रखता है, जबकि अगला वाक्यांश उनके आज्ञापालन को संदर्भ से प्रकट करता है।
- source_word: וַיָּשֻׁבוּ לָלֶכֶת כִּדְבַר יְהוָה
  choice: और यहोवा के वचन के अनुसार लौट गए
  rationale: हिन्दी में ‘लौट गए’ שׁוב और सहायक לָלֶכֶת की गति को स्वाभाविक ढंग से समेटता है; ‘वचन के अनुसार’ उनके कार्य की आज्ञा से अनुरूपता बनाए रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे / प्रभु
  rationale: मूल पाठ में वाचा का व्यक्तिगत नाम सीधे प्रयुक्त है। हिन्दी बाइबिल परंपरा में परिचित ‘यहोवा’ नाम को नाम के रूप में बनाए रखता है, उसे उपाधि ‘प्रभु’ से प्रतिस्थापित नहीं करता।
- issue: אֲחֵיכֶם की पारिवारिक भाषा
  choice: अपने भाइयों
  alternative: अपने साथी इस्राएलियों
  rationale: ‘भाइयों’ गृहयुद्ध की गंभीरता और एक ही वाचा-समुदाय के सदस्यों के बीच संबंध को सुरक्षित रखता है।
- issue: מֵאִתִּי נִהְיָה में ईश्वरीय कारणता
  choice: मेरी ओर से हुई है
  alternative: मैंने ही ऐसा किया है
  rationale: चुना हुआ रूप घटना के ईश्वरीय उद्गम को व्यक्त करता है, पर मूल से अधिक स्पष्ट प्रत्यक्ष कारणता आरोपित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज शैली रखी गई है। आज्ञा को स्वाभाविक हिन्दी में व्यक्त किया गया है, जबकि ‘ऊपर चढ़ो’, ‘भाइयों’, ‘वचन’ और ईश्वरीय उद्गम जैसे मूल पाठ के प्रमुख रूपक और तनाव सुरक्षित हैं।
