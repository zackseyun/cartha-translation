  yaml_path: translation/ot/1_kings/012/008.yaml
  text: But he abandoned the advice of the elders that they had given him[a], and consulted with the young men who had grown up with him, who stood before him.
translation:
  language: hi
  text: परन्तु उसने बुज़ुर्गों की उस सलाह को छोड़ दिया जो उन्होंने उसे दी थी, और उन युवकों से परामर्श किया जो उसके साथ बड़े हुए थे और उसके सामने खड़े रहते थे[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जो उसकी सेवा में उपस्थित रहते थे”; इब्रानी मुहावरा “किसी के सामने खड़ा रहना” राज-दरबार में सेवा करने को भी दर्शा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲזֹב
  choice: छोड़ दिया
  rationale: यह עזב के ‘त्याग देना/छोड़ देना’ अर्थ को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है और सलाह को जानबूझकर न मानने का भाव बनाए रखता है।
- source_word: עֲצַת הַזְּקֵנִים
  choice: पुरनियों की ... सलाह
  rationale: ‘सलाह’ प्रसंग में दिए गए मार्गदर्शन के लिए सहज है; ‘पुरनिये’ आयु और मान्य वरिष्ठ सलाहकारों की भूमिका दोनों को व्यक्त करता है।
- source_word: אֲשֶׁר יְעָצֻהוּ
  choice: जो उन्होंने उसे दी थी
  rationale: ‘सलाह’ के साथ यह हिन्दी की स्वाभाविक रचना है और इब्रानी क्रिया की अनावश्यक पुनरावृत्ति से बचती है।
- source_word: וַיִּוָּעַץ
  choice: परामर्श किया
  rationale: निफ़अल रूप यहाँ दूसरों से सलाह-मशविरा करने का भाव देता है; ‘परामर्श किया’ स्पष्ट और गरिमापूर्ण है।
- source_word: הַיְלָדִים
  choice: जवानों
  rationale: यहाँ वास्तविक बच्चे नहीं, राजा के हमउम्र और अपेक्षाकृत युवा दरबारी अभिप्रेत हैं; ‘जवान’ पुरनियों के साथ विरोध भी स्पष्ट रखता है।
- source_word: אֲשֶׁר גָּדְלוּ אִתּוֹ
  choice: जो उसके साथ बड़े हुए थे
  rationale: यह साझा पालन-पोषण और साथ-साथ वयस्क होने के अर्थ को सीधे सुरक्षित रखता है।
- source_word: אֲשֶׁר הָעֹמְדִים לְפָנָיו
  choice: जो उसके सामने खड़े रहते थे
  rationale: यह इब्रानी दरबारी मुहावरे का दृश्य रूप सुरक्षित रखता है, जबकि निरंतर सेवा या उपस्थिति का भाव ‘रहते थे’ से संकेतित होता है; कार्यगत अर्थ पादटिप्पणी में दिया गया है।
