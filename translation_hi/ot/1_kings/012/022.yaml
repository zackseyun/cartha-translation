    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: तब ... पहुँचा
  rationale: यहाँ וַיְהִי कथानक को आगे बढ़ाता है और דְּבַר ... אֶל के साथ दैवी संदेश के आने की घटना बताता है; आधुनिक हिन्दी में ‘तब ... पहुँचा’ स्वाभाविक है।
- source_word: דְּבַר
  choice: वचन
  rationale: दैवी प्रकाशन के इस सूत्र में דָּבָר परमेश्वर के संप्रेषित वचन को दर्शाता है; ‘वचन’ बाइबलीय मुहावरे और अर्थ दोनों को बनाए रखता है।
- source_word: הָאֱלֹהִים
  choice: परमेश्वर
  rationale: मूल पाठ में אֱלֹהִים है, जो यहाँ सच्चे परमेश्वर को सूचित करता है; इसलिए इसे यहोवा के रूप में समरूप नहीं किया गया।
- source_word: שְׁמַעְיָה
  choice: शमायाह
  rationale: इब्रानी नाम का देवनागरी में निकट और प्रचलन-संगत लिप्यंतरण।
- source_word: אִישׁ הָאֱלֹהִים
  choice: परमेश्वर का जन
  rationale: यह नबी-सदृश व्यक्ति की स्थापित पदवी है; ‘परमेश्वर का जन’ स्वाभाविक और प्रतिष्ठित हिन्दी बाइबलीय अभिव्यक्ति है।
- source_word: לֵאמֹר
  choice: द्विबिंदु द्वारा व्यक्त
  rationale: यह रूप अगले पद में आने वाली प्रत्यक्ष वाणी का परिचय देता है। हिन्दी में वाक्यांत का द्विबिंदु इस संबंध को ‘यह कहते हुए’ की अपेक्षा अधिक स्वाभाविक ढंग से व्यक्त करता है।
theological_decisions:
- issue: प्रकाशन-सूत्र में אֱלֹהִים का अनुवाद
  choice: परमेश्वर
  alternative: यहोवा
  rationale: मूल पाठ में יהוה नहीं बल्कि אֱלֹהִים है। इसलिए अधिक सामान्य ‘यहोवा का वचन’ सूत्र से समरूप किए बिना मूल शब्द को सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज किंतु गरिमापूर्ण शैली। ‘वचन’ और ‘परमेश्वर का जन’ जैसे परिचित बाइबलीय पद बनाए गए हैं। अगले पद की प्रत्यक्ष वाणी से संबंध दिखाने के लिए अंत में द्विबिंदु रखा गया है।
