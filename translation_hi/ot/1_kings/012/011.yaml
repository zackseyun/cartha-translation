  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘जुआ’ और ‘बिच्छू’ जैसे मूल रूपकों को सुरक्षित रखा गया है; वाक्य की धमकीपूर्ण समानांतरता बनाए रखने के लिए ‘मेरे पिता... पर मैं...’ संरचना दोहराई गई है।
