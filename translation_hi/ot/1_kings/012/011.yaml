  text: וְ/עַתָּ֗ה אָבִ/י֙ הֶעְמִ֤יס עֲלֵי/כֶם֙ עֹ֣ל כָּבֵ֔ד וַ/אֲנִ֖י אוֹסִ֣יף עַֽל עֻלְּ/כֶ֑ם אָבִ֗/י יִסַּ֤ר אֶתְ/כֶם֙ בַּ/שּׁוֹטִ֔ים וַ/אֲנִ֕י אֲיַסֵּ֥ר אֶתְ/כֶ֖ם בָּ/עַקְרַבִּֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/012/011.yaml
  text: And now[a], my father made your yoke heavy, but I will add to your yoke. My father disciplined you with whips, but I will discipline you with scorpions.
translation:
  language: hi
  text: और अब, मेरे पिता ने तुम्हारा जुआ भारी कर दिया था, पर मैं तुम्हारे जुए का भार और बढ़ाऊँगा। मेरे पिता ने तुम्हें कोड़ों से अनुशासित किया था, पर मैं तुम्हें बिच्छुओं से[a] अनुशासित करूँगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या सम्भवतः “बिच्छू-कोड़ों से,” अर्थात ऐसे कोड़े या चाबुक जो अधिक पीड़ा पहुँचाने के लिए बनाए गए हों; इब्रानी में शाब्दिक रूप से “बिच्छुओं से” है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶעְמִיס
  choice: भारी कर दिया
  rationale: हिफ़ील रूप किसी पर भार लादने या बोझ बढ़ाने का भाव देता है; ‘जुआ भारी कर दिया’ मूल रूपक को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: עֹל / עֻלְּכֶם
  choice: जुआ / जुए का भार
  rationale: ‘जुआ’ दमनकारी शासन या बेगार का ठोस रूपक सुरक्षित रखता है। दूसरी पंक्ति में ‘जुए का भार और बढ़ाऊँगा’ אוֹסִיף עַל का स्वाभाविक हिन्दी अर्थ देता है, बिना रूपक मिटाए।
- source_word: כָּבֵד
  choice: भारी
  rationale: विशेषण का सीधा अर्थ ‘भारी’ है और यह जुए के रूपक के साथ ठीक बैठता है; ‘कठोर’ कहना अधिक व्याख्यात्मक होता।
- source_word: אוֹסִיף עַל
  choice: का भार और बढ़ाऊँगा
  rationale: इस रचना का अर्थ किसी चीज़ में और जोड़ना या उसे बढ़ाना है। हिन्दी में ‘जुए का भार और बढ़ाऊँगा’ अपेक्षाकृत स्पष्ट और स्वाभाविक है।
- source_word: יִסַּר / אֲיַסֵּר
  choice: अनुशासित किया / अनुशासित करूँगा
  rationale: क्रिया में दंड देकर अनुशासित करने का भाव है। समान हिन्दी क्रिया की पुनरावृत्ति मूल की समानांतर संरचना बनाए रखती है।
- source_word: בַּשּׁוֹטִים
  choice: कोड़ों से
  rationale: שׁוֹט का सीधा अर्थ कोड़ा है; बहुवचन और साधनवाचक प्रयोग को स्वाभाविक हिन्दी में व्यक्त किया गया है।
- source_word: בָּעַקְרַבִּים
  choice: बिच्छुओं से
  rationale: मूल शब्द का शाब्दिक अर्थ ‘बिच्छू’ है। सम्भावित विशेष प्रकार के पीड़ादायक कोड़ों की व्याख्या मुख्य पाठ के बजाय पादटिप्पणी में दी गई है।
