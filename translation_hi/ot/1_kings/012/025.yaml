  text: וַ/יִּ֨בֶן יָרָבְעָ֧ם אֶת שְׁכֶ֛ם בְּ/הַ֥ר אֶפְרַ֖יִם וַ/יֵּ֣שֶׁב בָּ֑/הּ וַ/יֵּצֵ֣א מִ/שָּׁ֔ם וַ/יִּ֖בֶן אֶת פְּנוּאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/012/025.yaml
  text: Then Jeroboam built Shechem in the hill country of Ephraim and lived there[a]; and he went out from there and built Penuel.
translation:
  language: hi
  text: तब यारोबाम ने एप्रैम के पहाड़ी प्रदेश में शकेम को बनाया और वहीं रहने लगा। फिर वह वहाँ से निकला और पनूएल[a] को बनाया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: कुछ अनुवादों और बाइबल के संबंधित पदों में पनूएल नाम का रूप “पनीएल” भी मिलता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּבֶן
  choice: बनाया
  rationale: בנה का सामान्य अर्थ ‘बनाना’ है। नगर के संदर्भ में इसका आशय फिर से बसाना या किलेबंदी करना भी हो सकता है, पर ‘बनाया’ मूल की व्यापकता को बिना अनावश्यक विशिष्टीकरण के बनाए रखता है।
- source_word: שְׁכֶם
  choice: शकेम
  rationale: स्थानवाचक नाम को प्रचलित हिन्दी बाइबलीय लिप्यंतरण में रखा गया है।
- source_word: בְּהַר אֶפְרַיִם
  choice: एप्रैम के पहाड़ी प्रदेश में
  rationale: הַר यहाँ किसी एक पर्वत के बजाय पहाड़ी भूभाग को सूचित कर सकता है; यह हिन्दी में स्वाभाविक और भौगोलिक रूप से उपयुक्त है।
- source_word: וַיֵּשֶׁב בָּהּ
  choice: और वहीं रहने लगा
  rationale: ישב का अर्थ बैठना, बसना या रहना हो सकता है। स्त्रीलिंग प्रत्यय नगर शकेम की ओर संकेत करता है; हिन्दी में ‘वहीं’ इसे स्वाभाविक रूप से व्यक्त करता है।
- source_word: וַיֵּצֵא מִשָּׁם
  choice: फिर वह वहाँ से निकला
  rationale: יצא की मूल गति ‘निकलना’ है। ‘वहाँ से निकला’ शकेम से प्रस्थान को व्यक्त करते हुए मूल क्रिया की ठोस भाषा बनाए रखता है।
- source_word: פְּנוּאֵל
  choice: पनूएल
  rationale: यहाँ के इब्रानी व्यंजनात्मक रूप के अनुसार स्थानवाचक नाम का लिप्यंतरण किया गया है; संबंधित स्थलों में पाया जाने वाला ‘पनीएल’ रूप पादटिप्पणी में दिया गया है।
