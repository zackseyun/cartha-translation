reference: 1 Kings 12:30
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יְהִ֛י הַ/דָּבָ֥ר הַ/זֶּ֖ה לְ/חַטָּ֑את וַ/יֵּלְכ֥וּ הָ/עָ֛ם לִ/פְנֵ֥י הָ/אֶחָ֖ד עַד דָּֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/012/030.yaml
  text: And this thing became a sin[a], and the people went before the one as far as Dan.
translation:
  language: hi
  text: यह बात पाप बन गई, और लोग दान तक उस एक[a] के सामने गए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से ‘उस एक’ है। सम्भवतः इसका अर्थ यारोबाम द्वारा स्थापित दो बछड़ों में से एक—विशेषकर दान में रखे बछड़े—के सामने है।
    reason: मूल पाठ में संज्ञा लुप्त होने के कारण सम्भावित सन्दर्भ स्पष्ट करना।
lexical_decisions:
- source_word: וַיְהִי
  choice: बन गई
  rationale: לְחַטָּאת के साथ היה यहाँ किसी परिणाम को व्यक्त करता है—यह बात ‘पाप बन गई’—न कि केवल उसके अस्तित्व को।
- source_word: הַדָּבָר הַזֶּה
  choice: यह बात
  rationale: דבר का अर्थ यहाँ यारोबाम द्वारा स्थापित उपासना-व्यवस्था से जुड़ी ‘बात’ या ‘मामला’ है; ‘यह बात’ संकेतवाचक बल को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: לְחַטָּאת
  choice: पाप
  rationale: संदर्भ अवैध उपासना की निंदा करता है, इसलिए חַטָּאת का अर्थ यहाँ ‘पाप’ है, ‘पापबलि’ नहीं। संज्ञा-रूप को बनाए रखने के लिए ‘पाप बन गई’ चुना गया है।
- source_word: וַיֵּלְכוּ הָעָם
  choice: लोग ... गए
  rationale: הלך का सामान्य कथात्मक अर्थ ‘जाना’ है। मूल पाठ में स्पष्ट रूप से न आए ‘उपासना करने’ जैसे भाव को मुख्य पाठ में नहीं जोड़ा गया।
- source_word: לִפְנֵי
  choice: के सामने
  rationale: לפני का मूल अर्थ ‘के सामने/उपस्थिति में’ है। यह चयन सम्भावित उपासना-संदर्भ को बिना अनावश्यक विस्तार के सुरक्षित रखता है।
- source_word: הָאֶחָד
  choice: उस एक
  rationale: इब्रानी में संज्ञा लुप्त है और केवल ‘उस एक’ कहा गया है। हिन्दी में यह कुछ असामान्य होते हुए भी मूल की संक्षिप्तता और अस्पष्टता को सुरक्षित रखता है; सम्भावित आशय पादटिप्पणी में दिया गया है।
- source_word: עַד דָּן
  choice: दान तक
  rationale: עד सीमा या गन्तव्य की चरम दूरी बताता है; ‘दान तक’ इसका संक्षिप्त और स्वाभाविक हिन्दी रूप है।
theological_decisions:
- issue: यारोबाम की उपासना-व्यवस्था में पाप का स्वरूप
  choice: पद कहता है कि यह बात पाप बन गई, पर उससे आगे कोई विशिष्ट धर्मसैद्धान्तिक श्रेणी नहीं जोड़ता।
  alternative: यह व्यवस्था पाप का कारण बन गई।
  rationale: ‘पाप का कारण’ सम्भावित परिणाम को स्पष्ट करता, किन्तु मूल की संज्ञात्मक और तीखी उक्ति ‘पाप बन गई’ को कुछ हद तक समझाकर सीमित कर देता। ‘पापबलि’ इस प्रसंग में उपयुक्त नहीं है।
- issue: ‘उस एक’ का सन्दर्भ
  choice: मुख्य पाठ में मूल की लुप्त संज्ञा को ‘उस एक’ के रूप में सुरक्षित रखा गया है।
  alternative: ‘उस एक बछड़े’ को मुख्य पाठ में स्पष्ट कर देना।
  rationale: निकटवर्ती प्रसंग के अनुसार इसका संकेत दो बछड़ों में से एक, सम्भवतः दान वाले बछड़े, की ओर है; फिर भी इब्रानी की असामान्य संक्षिप्तता को मुख्य पाठ में मिटाने के बजाय पादटिप्पणी में स्पष्ट करना उचित है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य रखी गई है। ‘उस एक के सामने’ जानबूझकर कुछ असामान्य है, क्योंकि मूल इब्रानी भी संक्षिप्त और अस्पष्ट है; पादटिप्पणी अर्थ की सम्भावना बताती है, उसे मुख्य पाठ में निश्चित नहीं करती।
