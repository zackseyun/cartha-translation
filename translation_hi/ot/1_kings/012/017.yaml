  text: But Rehoboam reigned over the Israelites who lived in the cities of Judah.
translation:
  language: hi
  text: परन्तु यहूदा के नगरों में रहनेवाले इस्राएलियों पर रहूबियाम ने राज्य किया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/בְנֵי יִשְׂרָאֵל
  choice: परन्तु … इस्राएलियों
  rationale: וּ को पिछले पद में उत्तरी गोत्रों के विद्रोह के विपरीत स्थिति दिखाने के लिए ‘परन्तु’ किया गया है; בְנֵי יִשְׂרָאֵל का यहाँ स्वाभाविक राष्ट्रीय अर्थ ‘इस्राएली’ है, न कि शाब्दिक ‘इस्राएल के पुत्र’।”
- source_word: הַ/יֹּשְׁבִים
  choice: रहनेवाले
  rationale: ישב का कृदन्त यहाँ स्थायी निवास का बोध कराता है; ‘रहनेवाले’ आधुनिक हिन्दी में स्वाभाविक और सटीक है।
- source_word: בְּ/עָרֵי יְהוּדָה
  choice: यहूदा के नगरों में
  rationale: यह सीधा स्थानवाचक अनुवाद है और यहूदा के क्षेत्र के नगरों का अर्थ सुरक्षित रखता है।
- source_word: וַ/יִּמְלֹךְ
  choice: राज्य किया
  rationale: מלך कथा के इस प्रसंग में राजा के रूप में शासन करने को व्यक्त करता है; ‘राज्य किया’ हिन्दी बाइबलीय गद्य में स्पष्ट और प्रतिष्ठित है।
- source_word: עֲלֵי/הֶם
  choice: … पर
  rationale: यह शासन के अधीन होने का सम्बन्ध व्यक्त करता है; हिन्दी वाक्य में ‘इस्राएलियों पर’ मूल के बहुवचन सर्वनाम का आशय स्पष्ट रूप से समाहित करता है।
- source_word: רְחַבְעָם
  choice: रहूबियाम
  rationale: व्यक्तिनाम को प्रचलित हिन्दी बाइबल वर्तनी के अनुसार लिप्यंतरित किया गया है।
