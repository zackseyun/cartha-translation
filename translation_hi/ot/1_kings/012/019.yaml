translation:
  language: hi
  text: इस प्रकार इस्राएल आज तक दाऊद के घराने के विरुद्ध विद्रोह करता आया है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּפְשְׁעוּ
  choice: विद्रोह करता आया है
  rationale: राजनीतिक संदर्भ में פשע का अर्थ पाप करना मात्र नहीं, बल्कि राजसत्ता के विरुद्ध विद्रोह करना है। संयुक्त क्रिया घटना से आरम्भ होकर लेखक के समय तक जारी स्थिति को स्वाभाविक हिन्दी में व्यक्त करती है।
- source_word: יִשְׂרָאֵל
  choice: इस्राएल
  rationale: मूल का व्यक्तिवाचक नाम रखा गया है; यहाँ यह दाऊद के राजवंश से अलग हुए उत्तरी गोत्रों को सामूहिक रूप से दर्शाता है।
- source_word: בְּבֵית דָּוִד
  choice: दाऊद के घराने के विरुद्ध
  rationale: פשע के साथ ב उस पक्ष को सूचित करता है जिसके विरुद्ध विद्रोह हुआ। 'घराना' यहाँ परिवार मात्र नहीं, दाऊद के राजवंश को दर्शाता है।
- source_word: עַד הַיּוֹם הַזֶּה
  choice: आज तक
  rationale: यह मानक इब्रानी मुहावरा वर्णित घटना से लेखक के वर्तमान समय तक स्थिति के जारी रहने को दर्शाता है; हिन्दी में 'आज तक' इसका स्वाभाविक समतुल्य है।
