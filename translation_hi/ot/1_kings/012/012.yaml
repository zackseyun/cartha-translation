source:
  edition: WLC
  text: ו/יבו יָרָבְעָ֧ם וְ/כָל הָ/עָ֛ם אֶל רְחַבְעָ֖ם בַּ/יּ֣וֹם הַ/שְּׁלִישִׁ֑י כַּ/אֲשֶׁ֨ר דִּבֶּ֤ר הַ/מֶּ֨לֶךְ֙ לֵ/אמֹ֔ר שׁ֥וּבוּ אֵלַ֖/י בַּ/יּ֥וֹם הַ/שְּׁלִישִֽׁי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/012/012.yaml
  text: So Jeroboam and all the people came to Rehoboam on the third day[a], just as the king had spoken, saying, “Return to me on the third day.”
translation:
  language: hi
  text: तब यारोबाम और सब लोग तीसरे दिन रहूबियाम के पास आए, ठीक वैसे ही जैसे राजा ने कहा था, “तीसरे दिन मेरे पास लौट आना।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: आए
  rationale: בוא का अर्थ दृष्टिकोण के अनुसार ‘आना’ या ‘जाना’ हो सकता है। אֶל־רְחַבְעָם (‘रहूबियाम के पास’) के साथ कथावाचक की दृष्टि से ‘आए’ स्वाभाविक है।
- source_word: יָרָבְעָם
  choice: यारोबाम
  rationale: इब्रानी व्यक्तिगत नाम का प्रचलित हिन्दी लिप्यंतरण।
- source_word: וְכָל־הָעָם
  choice: और सब लोग
  rationale: עָם यहाँ राजा से निवेदन करने वाले पूरे जनसमूह को दर्शाता है; ‘सब लोग’ आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: אֶל־רְחַבְעָם
  choice: रहूबियाम के पास
  rationale: אֶל किसी व्यक्ति की ओर गति बताता है; हिन्दी में ‘के पास’ इस संबंध को सहज रूप से व्यक्त करता है।
- source_word: בַּיּוֹם הַשְּׁלִישִׁי
  choice: तीसरे दिन
  rationale: इब्रानी कालवाचक पदबंध का सीधा और स्वाभाविक हिन्दी रूप।
- source_word: כַּאֲשֶׁר
  choice: ठीक वैसे ही जैसे
  rationale: यह लोगों के आने और राजा के पहले दिए निर्देश के बीच सटीक अनुरूपता व्यक्त करता है।
- source_word: דִּבֶּר הַמֶּלֶךְ
  choice: राजा ने कहा था
  rationale: इब्रानी पूर्ण क्रिया उनके आने से पहले कही गई बात को संदर्भित करती है; हिन्दी का ‘कहा था’ समयक्रम स्पष्ट करता है।
- source_word: לֵאמֹר
  choice: प्रत्यक्ष उद्धरण द्वारा व्यक्त
  rationale: इब्रानी उद्धरण-सूचक रूप को हिन्दी में अलग ‘यह कहते हुए’ जोड़ने के बजाय विरामचिह्न और सीधे कथन से स्वाभाविक रूप में व्यक्त किया गया है।
- source_word: שׁוּבוּ אֵלַי
  choice: मेरे पास लौट आना
  rationale: שׁוב लौटने की क्रिया बताता है। राजा की ओर फिर आने के निर्देश के लिए ‘मेरे पास लौट आना’ अर्थ और संबोधन दोनों को स्वाभाविक हिन्दी में रखता है।
