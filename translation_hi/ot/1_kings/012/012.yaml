  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। नामों के लिए प्रचलित हिन्दी बाइबलीय रूप ‘यारोबाम’ और ‘रहूबियाम’ अपनाए गए हैं। अंग्रेज़ी परामर्श-पाठ की पादटिप्पणी स्रोत-पाठ में कोई वास्तविक पाठगत या अर्थगत विकल्प स्पष्ट नहीं करती, इसलिए अनावश्यक पादटिप्पणी नहीं जोड़ी गई।
