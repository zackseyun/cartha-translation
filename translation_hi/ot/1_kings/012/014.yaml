  text: He spoke to them according to the advice of the young men[a], saying, “My father made your yoke heavy, and I will add to your yoke. My father disciplined you with whips, but I will discipline you with scorpions.”
translation:
  language: hi
  text: उसने उनसे युवकों की सलाह के अनुसार यह कहा, “मेरे पिता ने तुम्हारा जूआ भारी किया था, और मैं तुम्हारे जूए को और भारी करूँगा। मेरे पिता ने तुम्हें कोड़ों से ताड़ना दी थी, परन्तु मैं तुम्हें बिच्छुओं[a] से ताड़ना दूँगा।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या सम्भवतः “बिच्छू-कोड़ों से,” अर्थात् नुकीले सिरों या काँटों वाले कोड़ों से; इब्रानी में शाब्दिक रूप से “बिच्छुओं से” है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: उसने ... कहा
  rationale: דבר का सामान्य अर्थ ‘बोलना’ है; हिन्दी में उद्धरण से पहले ‘उसने उनसे कहा’ स्वाभाविक है और इसे आवश्यकता से अधिक औपचारिक ‘उत्तर दिया’ नहीं बनाता।
- source_word: כַּעֲצַת הַיְלָדִים
  choice: उन जवानों की सलाह के अनुसार
  rationale: עֵצָה का अर्थ सलाह है, और הַיְלָדִים यहाँ वृद्ध सलाहकारों के विपरीत युवा पुरुषों को सूचित करता है; ‘जवानों’ से यह सामाजिक संदर्भ बना रहता है।
- source_word: הִכְבִּיד אֶת עֻלְּכֶם
  choice: तुम्हारा जूआ भारी कर दिया था
  rationale: כבד के कारक रूप और עֹל के ठोस रूपक दोनों को सुरक्षित रखा गया है। पूर्वकालिक ‘था’ प्रसंगानुकूल हिन्दी है।
- source_word: אֹסִיף עַל עֻלְּכֶם
  choice: तुम्हारे जूए को और भारी करूँगा
  rationale: शाब्दिक ‘जूए पर और जोड़ूँगा’ हिन्दी में अस्वाभाविक है; अर्थ वही रखते हुए भारीपन बढ़ाने की बात स्पष्ट की गई है।
- source_word: יִסַּר / אֲיַסֵּר
  choice: अनुशासित किया था / अनुशासित करूँगा
  rationale: יסר में दंडात्मक सुधार या ताड़ना का भाव है; ‘अनुशासित’ केवल दंड तक अर्थ को सीमित नहीं करता, यद्यपि यहाँ राजकीय कठोरता स्पष्ट है।
- source_word: בַּשּׁוֹטִים
  choice: कोड़ों से
  rationale: שׁוֹט के लिए ‘कोड़ा’ सामान्य, स्पष्ट और प्रसंगानुकूल हिन्दी शब्द है।
- source_word: בָּעַקְרַבִּים
  choice: बिच्छुओं से
  rationale: मूल पाठ का ठोस शब्द ‘बिच्छू’ मुख्य पाठ में रखा गया है; काँटेदार या नुकीले कोड़ों का संभावित आशय पादटिप्पणी में दिया गया है।
theological_decisions:
- issue: ‘बिच्छुओं’ से दंड देने की छवि का स्वरूप
  choice: मुख्य पाठ में शाब्दिक छवि ‘बिच्छुओं’ को बनाए रखना
  alternative: ‘बिच्छू-कोड़ों’ अथवा ‘काँटेदार कोड़ों’ से अनुवाद करना
  rationale: עקרבים का शाब्दिक अर्थ ‘बिच्छू’ है, जबकि यहाँ विशेष प्रकार के नुकीले या काँटेदार कोड़ों का संकेत संभव है। मूल की वास्तविक अस्पष्टता को मुख्य पाठ में सुरक्षित रखकर संभावित अर्थ पादटिप्पणी में बताया गया है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की, गरिमापूर्ण और सामान्य पाठकों के लिए सुबोध रखी गई है। ‘जूआ,’ ‘कोड़े’ और ‘बिच्छू’ जैसे ठोस बिंब मूल इब्रानी के अनुरूप सुरक्षित हैं। पादटिप्पणी-चिह्न सम्बद्ध ‘बिच्छुओं’ वाले वाक्य के अंत में रखा गया है।
