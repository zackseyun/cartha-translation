lexical_decisions:
- source_word: וַיֹּאמֶר אֲלֵיהֶם
  choice: उसने उनसे कहा
  rationale: वय्यिक्तोल कथात्मक रूप को स्वाभाविक हिन्दी में व्यक्त किया गया है; אֲלֵיהֶם संबोधन पाने वालों को स्पष्ट करता है।
- source_word: לְכוּ
  choice: चले जाओ
  rationale: बहुवचन आज्ञार्थक הלך यहाँ प्रतिनिधिमंडल को कुछ समय के लिए विदा करने का भाव रखता है; ‘चले जाओ’ आधुनिक हिन्दी में स्वाभाविक है।
- source_word: עוֹד שְׁלֹשָׁה יָמִים
  choice: तीन दिन और
  rationale: עוֹד समय-अभिव्यक्ति के साथ अतिरिक्त अवधि बताता है; ‘तीन दिन और’ स्रोत की संक्षिप्तता और अर्थ दोनों बनाए रखता है।
- source_word: וְשׁוּבוּ אֵלָי
  choice: फिर मेरे पास लौट आना
  rationale: שוב का मूल अर्थ लौटना है; ‘फिर’ पहले आदेश के बाद की क्रमिकता दिखाता है और אֵלָי को ‘मेरे पास’ के रूप में स्वाभाविक ढंग से व्यक्त करता है।
- source_word: וַיֵּלְכוּ הָעָם
  choice: तब लोग चले गए
  rationale: कथात्मक क्रम को ‘तब’ से व्यक्त किया गया है। הָעָם सामूहिक अर्थ में है, इसलिए ‘लोग’ सहज हिन्दी है।
