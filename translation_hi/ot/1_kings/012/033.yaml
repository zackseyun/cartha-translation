base_translation:
  language: en
  yaml_path: translation/ot/1_kings/012/033.yaml
  text: And he went up to the altar that he had made in Bethel on the fifteenth day in the eighth month[a], in the month that he had devised from his own heart, and he made a feast for the sons of Israel[b]; and he went up to the altar to burn incense.
translation:
  language: hi
  text: फिर वह उस वेदी पर चढ़ा, जिसे उसने बेतेल में बनाया था, आठवें महीने के पंद्रहवें दिन—उस महीने में जिसे उसने अपने मन से गढ़ा था[a]। उसने इस्राएलियों[b] के लिए एक पर्व आयोजित किया और धूप जलाने के लिए वेदी पर चढ़ा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “जिसे उसने अपने आप गढ़ा था” या “जिसे उसने अपनी इच्छा से चुना था” भी अनुवादित किया जा सकता है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में शाब्दिक रूप से “इस्राएल के पुत्रों”; यह इस्राएल के लोगों के लिए प्रयुक्त एक सामान्य राष्ट्रीय पदनाम है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַל עַל הַמִּזְבֵּחַ
  choice: वेदी पर चढ़ा
  rationale: עלה का मूल अर्थ ‘चढ़ना/ऊपर जाना’ है और על ‘पर’ को व्यक्त करता है। वाक्य में इसकी पुनरावृत्ति को भी बनाए रखा गया है; यहाँ इसका आशय वेदी पर उपासना-कर्म करने के लिए आगे बढ़ने से है।
- source_word: אֲשֶׁר עָשָׂה בְּבֵית אֵל
  choice: जिसे उसने बेतेल में बनाया था
  rationale: सापेक्ष उपवाक्य और स्थानवाचक בְּ का सीधा, स्वाभाविक हिन्दी रूप।
- source_word: בַּחֲמִשָּׁה עָשָׂר יוֹם בַּחֹדֶשׁ הַשְּׁמִינִי
  choice: आठवें महीने के पंद्रहवें दिन
  rationale: इब्रानी तिथि-विन्यास का स्वाभाविक आधुनिक हिन्दी रूप।
- source_word: בַּחֹדֶשׁ אֲשֶׁר בָּדָא מִלְּבַד
  choice: उस महीने में, जिसे उसने अपने मन से ठहराया था
  rationale: בדא में गढ़ने या स्वयं निर्धारित करने का भाव है। ‘अपने मन से’ राजा की स्वनिर्धारित धार्मिक व्यवस्था पर कथाकार की अंतर्निहित आलोचना को बिना अतिरिक्त व्याख्या के बनाए रखता है।
- source_word: וַיַּעַשׂ חָג
  choice: उसने … एक पर्व मनाया
  rationale: עשה + חג का शाब्दिक रूप ‘पर्व बनाया’ होगा, पर आधुनिक हिन्दी में ‘पर्व मनाया’ अधिक स्वाभाविक है और प्रसंग का अर्थ सुरक्षित रखता है।
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: इस्राएलियों
  rationale: यह पूरे राष्ट्र के लिए प्रयुक्त मानक इब्रानी पद है। ‘इस्राएलियों’ आधुनिक हिन्दी में स्वाभाविक है; शाब्दिक रूप पादटिप्पणी में दिया गया है।
- source_word: לְהַקְטִיר
  choice: धूप जलाने के लिए
  rationale: हिफ़ील הקטיר का उपासना-संबंधी अर्थ किसी वस्तु को धुएँ में चढ़ाना है और इस प्रसंग में ‘धूप जलाना’ संक्षिप्त तथा स्वाभाविक है।
theological_decisions:
- issue: यारोबाम द्वारा पर्व का महीना स्वयं निर्धारित करने वाले वाक्यांश का अर्थ
  choice: अपने मन से ठहराया था
  alternative: अपने आप गढ़ा था / अपनी इच्छा से चुना था
  rationale: यह रूप महीने के दैवी आदेश के बजाय राजा के मन से निर्धारित होने का भाव रखता है और कथाकार की आलोचना को न तो कम करता है, न उससे आगे बढ़ाता है।
- issue: בני ישראל का राष्ट्रीय पदनाम
  choice: इस्राएलियों
  alternative: इस्राएल के पुत्रों
  rationale: यह पद सामूहिक रूप से इस्राएल राष्ट्र को दर्शाता है। मुख्य पाठ में सुबोध आधुनिक हिन्दी रखी गई है, जबकि उसका औपचारिक इब्रानी रूप पादटिप्पणी में सुरक्षित है।
- issue: वेदी के संबंध में וַיַּעַל का अर्थ
  choice: वेदी पर चढ़ा
  alternative: वेदी के पास गया / वेदी पर बलि चढ़ाई
  rationale: मूल क्रिया की पुनरावृत्ति और स्थानगत भाषा को बनाए रखा गया है। ‘बलि चढ़ाई’ प्रसंगानुकूल हो सकता है, पर वह क्रिया में निहित अस्पष्टता को आवश्यकता से अधिक स्पष्ट कर देता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘पर्व मनाया’ स्वाभाविक हिन्दी है, जबकि ‘वेदी पर चढ़ा’ मूल की पुनरावृत्ति और संभावित अर्थगत तनाव को सुरक्षित रखता है।
