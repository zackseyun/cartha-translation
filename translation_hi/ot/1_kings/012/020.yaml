  text: וַ/יְהִ֞י כִּ/שְׁמֹ֤עַ כָּל יִשְׂרָאֵל֙ כִּֽי שָׁ֣ב יָרָבְעָ֔ם וַֽ/יִּשְׁלְח֗וּ וַ/יִּקְרְא֤וּ אֹת/וֹ֙ אֶל הָ֣/עֵדָ֔ה וַ/יַּמְלִ֥יכוּ אֹת֖/וֹ עַל כָּל יִשְׂרָאֵ֑ל לֹ֤א הָיָה֙ אַחֲרֵ֣י בֵית דָּוִ֔ד זוּלָתִ֥י שֵֽׁבֶט יְהוּדָ֖ה לְ/בַדּֽ/וֹ־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/012/020.yaml
  text: And when all Israel heard that Jeroboam had returned[a], they sent and called him to the assembly and made him king over all Israel. None followed the house of David except the tribe of Judah alone.
translation:
  language: hi
  text: जब पूरे इस्राएल ने सुना कि यारोबाम लौट आया था, तब उन्होंने संदेश भेजकर उसे सभा में बुलाया और उसे पूरे इस्राएल का राजा बनाया। दाऊद के घराने का साथ केवल यहूदा के गोत्र ने ही दिया[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “यहूदा के गोत्र के सिवा किसी ने दाऊद के घराने का अनुसरण नहीं किया।” इब्रानी मुहावरे का शाब्दिक अर्थ “दाऊद के घराने के पीछे होना” है; यहाँ इसका अर्थ उसके प्रति निष्ठा रखना या उसके पक्ष में होना है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כִּשְׁמֹעַ
  choice: जब ... ने सुना, तब
  rationale: यह रचना कथा में समय-संबंधी संक्रमण दिखाती है। आधुनिक हिन्दी में ‘जब... तब’ स्वाभाविक है और इब्रानी के कालगत संबंध को स्पष्ट रखता है।
- source_word: כָּל יִשְׂרָאֵל
  choice: पूरा इस्राएल
  rationale: इब्रानी की सामूहिक राष्ट्रीय अभिव्यक्ति को बनाए रखता है; यहाँ आशय प्रत्येक व्यक्ति से अधिक इस्राएल के समुदाय से है।
- source_word: כִּי שָׁב יָרָבְעָם
  choice: कि यारोबाम लौट आया है
  rationale: שׁוּב का मूल अर्थ ‘लौटना’ है। हिन्दी में अप्रत्यक्ष सूचना के प्रसंग में यह रूप पहले घट चुकी घटना को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: וַיִּשְׁלְחוּ
  choice: उन्होंने संदेश भेजकर
  rationale: इब्रानी में भेजी गई वस्तु या व्यक्ति नहीं बताया गया। हिन्दी में अकेला ‘भेजा’ अधूरा लगता, इसलिए ‘संदेश’ न्यूनतम प्रसंगगत पूर्ति है और ‘दूत’ जैसी अधिक विशिष्ट बात नहीं जोड़ता।
- source_word: וַיִּקְרְאוּ אֹתוֹ אֶל הָעֵדָה
  choice: उसे सभा में बुलाया
  rationale: קרא אל यहाँ किसी को एकत्र समुदाय के पास बुलाने का भाव देता है। ‘सभा’ राजनीतिक-सामुदायिक प्रसंग में सहज है और अनावश्यक धार्मिक अर्थ नहीं जोड़ता।
- source_word: וַיַּמְלִיכוּ אֹתוֹ עַל כָּל יִשְׂרָאֵל
  choice: उसे पूरे इस्राएल का राजा बनाया
  rationale: מלך के हिफ़ईल रूप का अर्थ ‘राजा बनाना’ है। यह किसी राज्याभिषेक-विधि या घोषणा को पाठ में जोड़े बिना राजसत्ता स्थापित किए जाने को व्यक्त करता है।
- source_word: לֹא הָיָה אַחֲרֵי בֵית דָּוִד
  choice: दाऊद के घराने के साथ रहा
  rationale: शाब्दिक मुहावरा ‘दाऊद के घराने के पीछे होना’ यहाँ राजनीतिक निष्ठा या पक्ष में बने रहने को दर्शाता है। ‘साथ रहा’ हिन्दी में इस प्रसंग के विभाजन और निष्ठा दोनों को स्वाभाविक रूप से व्यक्त करता है।
- source_word: זוּלָתִי שֵׁבֶט יְהוּדָה לְבַדּוֹ
  choice: केवल यहूदा का गोत्र ही
  rationale: זוּלָתִי अपवाद और לְבַדּוֹ विशिष्टता पर बल देता है। ‘केवल... ही’ उस दोहरे जोर को सहज हिन्दी में सुरक्षित रखता है।
theological_decisions:
- issue: राज्य-विभाजन के बाद दाऊद के घराने के प्रति राजनीतिक निष्ठा
  choice: केवल यहूदा का गोत्र ही दाऊद के घराने के साथ रहा
  alternative: यहूदा के गोत्र के सिवा किसी ने दाऊद के घराने का अनुसरण नहीं किया
  rationale: यह कथन मुख्यतः ऐतिहासिक और राजनीतिक है। ‘साथ रहा’ इब्रानी मुहावरे में निहित निष्ठा और अलगाव के बाद बने रहने के दोनों पहलुओं को रखता है, जबकि किसी विशेष धर्मशास्त्रीय निष्कर्ष को नहीं थोपता।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण कथात्मक शैली। राजनीतिक संदर्भ में ‘सभा’, ‘राजा बनाया’ और ‘घराने के साथ रहा’ जैसे सामान्य तथा संप्रदाय-निरपेक्ष पद चुने गए हैं।
