base_translation:
  language: en
  yaml_path: translation/ot/1_kings/012/029.yaml
  text: He set one in Bethel[a], and the other he put in Dan.
translation:
  language: hi
  text: उसने एक को बेतेल में स्थापित किया[a], और दूसरे को दान में रखा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अर्थात पिछले पद में बताए गए दो बछड़ों में से एक। वैकल्पिक अनुवाद: “उसने एक बछड़े को बेतेल में स्थापित किया, और दूसरे को दान में रखा।”'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיָּשֶׂם
  choice: उसने ... स्थापित किया
  rationale: שׂים का अर्थ किसी वस्तु को किसी स्थान पर रखना या स्थापित करना है। यहाँ उपासना के लिए बछड़े को नियत स्थान पर रखने के संदर्भ में ‘स्थापित किया’ स्वाभाविक और गरिमापूर्ण है।
- source_word: אֶת הָאֶחָד
  choice: एक को
  rationale: शाब्दिक रूप ‘उस एक को’ है, पर पहले बताए गए दो बछड़ों के वितरण में आधुनिक हिन्दी का स्वाभाविक प्रयोग ‘एक को’ है; संज्ञा को मूल की तरह अप्रकट रखा गया है।
- source_word: בְּבֵית אֵל
  choice: बेतेल में
  rationale: בְּ का स्थानवाचक अर्थ ‘में’ है और בֵּית אֵל को प्रचलित स्थाननाम ‘बेतेल’ के रूप में रखा गया है।
- source_word: וְאֶת הָאֶחָד
  choice: और दूसरे को
  rationale: यद्यपि रूपतः ‘और उस एक को’ है, दो वस्तुओं के जोड़े में हिन्दी का स्वाभाविक विरोध ‘एक ... और दूसरे’ है।
- source_word: נָתַן
  choice: रखा
  rationale: נתן का मूल अर्थ व्यापक रूप से ‘देना/रखना’ है; स्थानवाचक पूरक के साथ यहाँ ‘रखा’ सटीक है। पहले क्रियापद से अर्थगत निकटता रखते हुए हिन्दी में सहज भिन्नता भी बनी रहती है।
- source_word: בְּדָן
  choice: दान में
  rationale: בְּ का सीधा स्थानवाचक अनुवाद ‘में’ है; דָּן स्थाननाम ‘दान’ है।
theological_decisions:
- issue: ‘एक’ और ‘दूसरे’ का संदर्भ
  choice: मुख्य पाठ में वस्तु की संज्ञा न जोड़कर ‘एक को ... दूसरे को’ रखा गया है।
  alternative: ‘उसने एक बछड़े को बेतेल में स्थापित किया, और दूसरे को दान में रखा।’
  rationale: इब्रानी पद में संज्ञा दोहराई नहीं गई; उसका संदर्भ पिछले पद के दो बछड़ों से स्पष्ट होता है। मूल की इस लोप-रचना को सुरक्षित रखना अनावश्यक व्याख्यात्मक विस्तार से बचाता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण कथात्मक रूप। ‘बेतेल’ और ‘दान’ प्रचलित बाइबलीय स्थाननाम हैं। मूल इब्रानी की अप्रकट संज्ञा को मुख्य पाठ में बनाए रखते हुए पादटिप्पणी में संदर्भ स्पष्ट किया गया है।
