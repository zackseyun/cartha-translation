  register: आधुनिक मानक हिंदी में सम्मानसूचक संबोधन और गरिमापूर्ण किंतु सहज वाक्य-विन्यास अपनाया गया है। ‘जूआ’ का बाइबिलीय रूपक तथा ‘कठोर’ और ‘भारी’ के अलग हिब्रू विशेषण सुरक्षित रखे गए हैं। ‘सेवा’ जानबूझकर व्यापक रखा गया है, क्योंकि प्रसंग में राजकीय सेवा, श्रम और अन्य थोपे गए दायित्व सम्मिलित हो सकते हैं।
