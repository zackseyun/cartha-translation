  text: אָבִ֖י/ךָ הִקְשָׁ֣ה אֶת עֻלֵּ֑/נוּ וְ/אַתָּ֡ה עַתָּ֣ה הָקֵל֩ מֵ/עֲבֹדַ֨ת אָבִ֜י/ךָ הַ/קָּשָׁ֗ה וּ/מֵ/עֻלּ֧/וֹ הַ/כָּבֵ֛ד אֲשֶׁר נָתַ֥ן עָלֵ֖י/נוּ וְ/נַעַבְדֶֽ/ךָּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/012/004.yaml
  text: Your father made our yoke heavy[a]. So now, lighten the hard service of your father and his heavy yoke that he put on us[b], and we will serve you.
translation:
  language: hi
  text: “आपके पिता ने हमारा जूआ भारी कर दिया था। इसलिए अब आप अपने पिता की कठोर सेवा और उनके भारी जूए को, जो उन्होंने हम पर रखा था, हलका कर दीजिए; तब हम आपकी सेवा करेंगे।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִקְשָׁה אֶת עֻלֵּנוּ
  choice: हमारा जूआ कठोर कर दिया
  rationale: हिफ़ील क्रिया का कारणवाचक अर्थ बनाए रखता है। ‘जूआ कठोर करना’ हिब्रू रूपक को सुरक्षित रखता है, जबकि अगले वाक्यांश का ‘भारी जूआ’ उसके बोझिल होने को स्पष्ट करता है।
- source_word: עֻלֵּנוּ
  choice: हमारा जूआ
  rationale: ‘जूआ’ शासन द्वारा थोपी गई सेवा और दायित्वों का मूल रूपक बनाए रखता है; सामान्य हिंदी में भी यह बंधन या भारी अधीनता का बोध देता है।
- source_word: הָקֵל
  choice: हलका कर दीजिए
  rationale: आज्ञार्थक क्रिया का अर्थ बोझ घटाना है। यह आगे आए ‘भारी’ के साथ मूल पाठ का हलका–भारी विरोध भी बनाए रखता है।
- source_word: מֵעֲבֹדַת אָבִיךָ הַקָּשָׁה
  choice: अपने पिता की कठोर सेवा
  rationale: עֲבֹדָה सेवा, श्रम अथवा थोपे गए काम को सूचित कर सकता है। ‘कठोर सेवा’ इस व्यापकता को बनाए रखती है और केवल शारीरिक मजदूरी तक अर्थ सीमित नहीं करती।
- source_word: וּמֵעֻלּוֹ הַכָּבֵד
  choice: और उस भारी जूए को
  rationale: ‘भारी जूआ’ मूल उपमा और विशेषण दोनों को सीधे सुरक्षित रखता है। हिंदी में ‘हलका कर दीजिए’ के संयुक्त कर्म के रूप में कारक-संबंध स्वाभाविक है।
- source_word: אֲשֶׁר נָתַן עָלֵינוּ
  choice: जो उन्होंने हम पर रखा था
  rationale: נתן על का स्वाभाविक हिंदी रूप है और जूआ रखे जाने की ठोस छवि तथा दायित्व थोपे जाने का भाव दोनों बनाए रखता है।
- source_word: וְנַעַבְדֶךָּ
  choice: तब हम आपकी सेवा करेंगे
  rationale: वाव यहाँ अनुरोध स्वीकार होने के परिणामस्वरूप दी गई प्रतिज्ञा व्यक्त करता है; ‘तब’ इस संबंध को स्वाभाविक हिंदी में स्पष्ट करता है।
- source_word: אָבִיךָ
  choice: आपके पिता / अपने पिता
  rationale: रहूबियाम को सम्मानसूचक प्रत्यक्ष संबोधन के अनुरूप ‘आप’ का प्रयोग किया गया है और मूल की पुनरावृत्ति बनाए रखी गई है।
