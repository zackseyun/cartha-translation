translation:
  language: hi
  text: राजा ने लोगों को कठोरता से उत्तर दिया और उन बुज़ुर्गों की सलाह को छोड़ दिया जिन्होंने उसे सलाह दी थी।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַן
  choice: उत्तर दिया
  rationale: काल रूप में ענה यहाँ लोगों की पिछली बात के प्रत्युत्तर को व्यक्त करता है; ‘उत्तर दिया’ स्वाभाविक और सटीक है।
- source_word: הַמֶּלֶךְ
  choice: राजा
  rationale: संदर्भ में पहले से परिचित राजकीय व्यक्ति के लिए निश्चित संज्ञा है; हिन्दी में ‘राजा’ पर्याप्त और स्वाभाविक है।
- source_word: הָעָם
  choice: लोगों
  rationale: עָם यहाँ राजा के सामने उपस्थित इस्राएली जनसमुदाय को दर्शाता है; ‘लोग’ आधुनिक हिन्दी में स्पष्ट है।
- source_word: קָשָׁה
  choice: कठोरता से
  rationale: यह राजा के उत्तर देने के ढंग को बताता है; ‘कठोरता से’ मूल के तीखे और अनुदार व्यवहार को सुरक्षित रखता है।
- source_word: וַיַּעֲזֹב
  choice: ठुकरा दिया
  rationale: עזב का मूल भाव छोड़ देना है; इस संदर्भ में राजा ने जानबूझकर सलाह नहीं मानी, इसलिए ‘ठुकरा दिया’ निर्णायक अस्वीकार को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: עֲצַת
  choice: सलाह
  rationale: עֵצָה यहाँ राजकीय परामर्श को दर्शाता है; ‘सलाह’ साधारण पाठक के लिए ‘परामर्श’ से अधिक सहज है।
- source_word: הַזְּקֵנִים
  choice: पुरनियों
  rationale: यह केवल अधिक आयु वाले पुरुषों के बजाय मान्य वरिष्ठ सलाहकारों को सूचित करता है; बाइबलीय सामाजिक भूमिका के लिए ‘पुरनिये’ उपयुक्त है।
- source_word: אֲשֶׁר יְעָצֻהוּ
  choice: जिन्होंने उसे सलाह दी थी
  rationale: सम्बन्धवाचक उपवाक्य पुरनियों की पूर्व सलाह को पहचानता है; ‘दी थी’ मुख्य घटना से पहले हुए कार्य को स्पष्ट करता है।
