    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: संदेश भेजा
  rationale: मूल क्रिया का अर्थ ‘भेजना’ है; इस प्रसंग में हिन्दी में ‘के पास संदेश भेजा’ स्वाभाविक रूप से व्यक्त करता है कि अहाब ने लोगों तक सूचना पहुँचाई, न कि उन्हें कहीं भेज दिया।
- source_word: בְּכָל בְּנֵי יִשְׂרָאֵל
  choice: इस्राएल के सब पुत्रों के पास
  rationale: בְּ को यहाँ प्राप्तकर्ताओं की ओर संकेत करने वाला माना गया है और בְּנֵי יִשְׂרָאֵל के पारिवारिक, पुल्लिंग रूप ‘इस्राएल के पुत्रों’ को मुख्य पाठ में सुरक्षित रखा गया है।
- source_word: וַיִּקְבֹּץ
  choice: इकट्ठा किया
  rationale: קבץ का सामान्य अर्थ ‘इकट्ठा करना’ या ‘एकत्र करना’ है; ‘इकट्ठा किया’ सहज आधुनिक हिन्दी है।
- source_word: הַנְּבִיאִים
  choice: नबियों
  rationale: נביאים के लिए ‘नबी’ आधुनिक हिन्दी बाइबलीय प्रयोग में स्पष्ट और प्रचलित शब्द है।
- source_word: אֶל הַר הַכַּרְמֶל
  choice: कर्मेल पर्वत पर
  rationale: हिब्रू में दिशा-सूचक אֶל है; सभा के गंतव्य के लिए हिन्दी में ‘कर्मेल पर्वत पर’ स्वाभाविक और सटीक है।
