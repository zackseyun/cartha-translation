base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/005.yaml
  text: And Ahab said to Obadiah[a], “Go through the land to all the springs of water and to all the wadis. Perhaps we may find grass and keep horse and mule alive[b], so that we do not have to cut off some of the livestock.”
translation:
  language: hi
  text: अहाब ने ओबद्याह से कहा, “देश भर में घूमकर पानी के सभी सोतों और सभी जलधाराओं[a] तक जाओ। शायद हमें घास मिल जाए और हम घोड़ों और खच्चरों को जीवित रख सकें, ताकि हमें पशुधन में से कुछ को नष्ट न करना पड़े[b]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “बरसाती नालों।” इब्रानी शब्द घाटी, बरसाती नाले या जलधारा को सूचित कर सकता है। सूखे के इस प्रसंग में मौसमी जलमार्ग सम्भवतः अभिप्रेत हैं।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “पशुधन में से कुछ को काट न डालें।” सम्भवतः इसका अर्थ पशुओं की संख्या घटाना है, क्योंकि सबको जीवित रखने के लिए पर्याप्त चारा नहीं था।
    reason: lexical_alternative
lexical_decisions:
