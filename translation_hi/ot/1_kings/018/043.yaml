  text: Then he said to his servant[a], “Please go up and look toward the sea.” So he went up and looked, and said, “There is nothing.” Then he said[c][b], “Go back seven times.”
translation:
  language: hi
  text: तब उसने अपने सेवक[a] से कहा, “कृपया ऊपर जाकर समुद्र की ओर देखो।” वह ऊपर गया, देखा और कहा, “कुछ भी नहीं है।” तब उसने कहा, “सात बार लौटो।”
  philosophy: optimal-equivalence
  footnotes:
