lexical_decisions:
- source_word: נַעֲרוֹ
  choice: अपने सेवक
  rationale: נַעַר का अर्थ युवक, सेवक या परिचर हो सकता है। यहाँ वह एलिय्याह के निर्देश पर काम कर रहा है, इसलिए ‘सेवक’ प्रसंगानुकूल और स्वाभाविक है।
- source_word: עֲלֵה נָא
  choice: कृपया ऊपर जाकर
  rationale: עֲלֵה ऊपर चढ़ने/जाने की आज्ञा है और נָא अनुरोध या विनम्र आग्रह का भाव देता है; ‘कृपया ऊपर जाकर’ दोनों को व्यक्त करता है।
- source_word: הַבֵּט דֶּרֶךְ יָם
  choice: समुद्र की ओर देखो
  rationale: הַבֵּט का अर्थ ध्यान से देखना और דֶּרֶךְ יָם का अर्थ समुद्र की दिशा में है; यह हिंदी में स्वाभाविक और स्रोत के निकट है।
- source_word: אֵין מְאוּמָה
  choice: कुछ भी नहीं है
  rationale: यह वाक्यांश किसी भी दिखाई देने वाली वस्तु के पूर्ण अभाव को व्यक्त करता है।
- source_word: שֻׁב שֶׁבַע פְּעָמִים
  choice: सात बार फिर जाकर देखो
  rationale: शाब्दिक रूप से ‘सात बार लौटो’; संदर्भ में लौटकर वही निरीक्षण दोहराना अभिप्रेत है। हिंदी में स्पष्टता के लिए ‘जाकर देखो’ निहित क्रिया को व्यक्त करता है।
