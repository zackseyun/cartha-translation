translation:
  language: hi
  text: तब एलिय्याह अहाब के सामने उपस्थित होने के लिए गया। उस समय सामरिया में अकाल गंभीर था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: तब ... गया
  rationale: वाव-क्रमवाचक कथा को आगे बढ़ाता है; ‘तब’ पिछले पद की आज्ञा के बाद की अगली घटना को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: אֵלִיָּהוּ
  choice: एलिय्याह
  rationale: व्यक्तिनाम का प्रचलित हिन्दी बाइबलीय रूप रखा गया है।
- source_word: לְהֵרָאוֹת אֶל אַחְאָב
  choice: अहाब के सामने उपस्थित होने के लिए
  rationale: ראה के निफ़ाल रूप का अर्थ यहाँ ‘दिखाई देना/उपस्थित होना’ है। यह अनुवाद अर्थ को स्वाभाविक हिन्दी में रखता है और अनावश्यक रूप से यह नहीं बताता कि उसने स्वयं को किस प्रकार दिखाया।
- source_word: וְהָרָעָב
  choice: उस समय ... अकाल
  rationale: यह वाक्यांश मुख्य घटना के साथ चल रही पृष्ठभूमि की परिस्थिति बताता है; ‘उस समय’ हिन्दी में इस संबंध को स्पष्ट और स्वाभाविक बनाता है।
- source_word: חָזָק
  choice: बहुत भयंकर था
  rationale: अकाल के संदर्भ में חָזָק उसकी तीव्रता और गंभीरता बताता है; ‘बहुत भयंकर’ वर्तमान हिन्दी में सहज है।
- source_word: בְּשֹׁמְרוֹן
  choice: सामरिया में
  rationale: ב स्थान सूचित करता है। ‘सामरिया’ यहाँ नगर अथवा उससे संबद्ध क्षेत्र का संकेत हो सकता है, इसलिए अनुवाद इसे अधिक विशिष्ट नहीं बनाता।
