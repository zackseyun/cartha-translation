  yaml_path: translation/ot/1_kings/018/009.yaml
  text: And he said[a], “What have I sinned, that you are giving your servant into Ahab’s hand to put me to death?”
translation:
  language: hi
  text: उसने कहा, “मैंने ऐसा कौन-सा पाप किया है कि आप अपने सेवक को अहाब के हाथ में सौंप रहे हैं, ताकि वह मुझे मार डाले?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: उसने कहा
  rationale: मानक इब्रानी कथात्मक रूप है; हिन्दी में प्रसंग का प्रवाह बनाए रखते हुए स्वाभाविक आरंभ।
- source_word: מֶה חָטָאתִי
  choice: मैंने ऐसा कौन-सा पाप किया है
  rationale: शाब्दिक प्रश्न की नैतिक-धार्मिक गंभीरता बनाए रखते हुए आधुनिक हिन्दी में स्वाभाविक मुहावरा।
- source_word: כִּי
  choice: कि
  rationale: यहाँ शिकायत के आशय या परिणाम को प्रस्तुत करता है।
- source_word: אַתָּה נֹתֵן
  choice: आप ... सौंप रहे हैं
  rationale: स्पष्ट सर्वनाम का बल सम्मानसूचक ‘आप’ से बना रहता है; कृदन्त की वर्तमान या आसन्न क्रिया को ‘सौंप रहे हैं’ व्यक्त करता है।
- source_word: עַבְדְּךָ
  choice: अपने सेवक को
  rationale: श्रेष्ठ व्यक्ति के सामने विनम्र आत्म-संदर्भ के लिए ‘सेवक’ प्रसंगानुकूल है।
- source_word: בְּיַד אַחְאָב
  choice: अहाब के हाथ में
  rationale: किसी के अधिकार या नियंत्रण में देने का मूल इब्रानी रूपक सुरक्षित रखा गया है।
- source_word: לַהֲמִיתֵנִי
  choice: ताकि वह मुझे मार डाले
  rationale: मूल causative infinitive के घातक उद्देश्य को स्पष्ट, सहज और गरिमापूर्ण हिन्दी में व्यक्त करता है।
