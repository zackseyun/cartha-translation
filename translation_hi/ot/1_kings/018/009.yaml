translation_notes:
  register: आधुनिक मानक हिन्दी; ओबद्याह की विनम्रता के लिए सम्मानसूचक ‘आप’ और आत्म-संदर्भ ‘अपने सेवक’ रखा गया है। वाक्य स्वाभाविक है, पर ‘पाप’ तथा ‘हाथ में’ जैसे मूल के अर्थपूर्ण शब्द और रूपक सुरक्षित हैं।
