reference: 1 Kings 18:31
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יִּקַּ֣ח אֵלִיָּ֗הוּ שְׁתֵּ֤ים עֶשְׂרֵה֙ אֲבָנִ֔ים כְּ/מִסְפַּ֖ר שִׁבְטֵ֣י בְנֵֽי יַעֲקֹ֑ב אֲשֶׁר֩ הָיָ֨ה דְבַר יְהוָ֤ה אֵלָי/ו֙ לֵ/אמֹ֔ר יִשְׂרָאֵ֖ל יִהְיֶ֥ה שְׁמֶֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/031.yaml
  text: And Elijah took twelve stones[a], according to the number of the tribes of the sons of Jacob, to whom the word of Yahweh had come, saying[b], “Israel shall be your name.”
translation:
  language: hi
  text: 'तब एलिय्याह ने बारह पत्थर लिए—याकूब के पुत्रों[a] के गोत्रों की संख्या के अनुसार। उसी याकूब के पास याहवे का वचन आया था: “तेरा नाम इस्राएल होगा।”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “याकूब की संतानों।” इब्रानी में शाब्दिक अर्थ “याकूब के पुत्रों” है।
    reason: lexical_alternative
  - marker: b
    text: 'यह याकूब का नाम बदले जाने की घटना का स्मरण कराता है (उत्पत्ति 32:28; 35:10): “तेरा नाम इस्राएल होगा।”'
    reason: cross_reference
lexical_decisions:
- source_word: וַיִּקַּח
  choice: लिए
  rationale: לקח का सामान्य आख्यानात्मक अर्थ यहाँ ‘लेना’ है; संदर्भ में ‘लिए’ स्वाभाविक और सीधा है।
- source_word: אֵלִיָּהוּ
  choice: एलिय्याह
  rationale: व्यक्तिनाम का प्रचलित हिन्दी बाइबलीय रूप, जो इब्रानी उच्चारण के भी निकट है।
- source_word: שְׁתֵּים עֶשְׂרֵה אֲבָנִים
  choice: बारह पत्थर
  rationale: संख्या और संज्ञा का सीधा तथा स्वाभाविक अनुवाद।
- source_word: כְּמִסְפַּר
  choice: की संख्या के अनुसार
  rationale: כְּ की तुलनात्मकता और מִסְפָּר के ‘संख्या’ अर्थ को स्पष्ट रूप से बनाए रखता है।
- source_word: שִׁבְטֵי
  choice: गोत्रों
  rationale: इस्राएल के वंशगत-राष्ट्रीय समूहों के लिए ‘गोत्र’ हिन्दी बाइबलीय भाषा में सटीक और परिचित शब्द है।
- source_word: בְנֵי יַעֲקֹב
  choice: याकूब के पुत्रों
  rationale: इब्रानी की शाब्दिक पारिवारिक अभिव्यक्ति को सुरक्षित रखता है; ‘संतानों’ को पादटिप्पणी में स्वाभाविक विकल्प के रूप में दिया गया है।
- source_word: אֲשֶׁר הָיָה דְבַר־יְהוָה אֵלָיו
  choice: उसी याकूब के पास याहवे का वचन आया था
  rationale: एकवचन אֵלָיו का संबंध याकूब से स्पष्ट करता है और पूर्व में हुए परमेश्वरीय संबोधन को ‘आया था’ द्वारा व्यक्त करता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: चतुरक्षरीय परमेश्वर-नाम को पदवी से बदलने के बजाय नाम के रूप में प्रस्तुत करता है।
- source_word: לֵאמֹר
  choice: प्रत्यक्ष कथन के लिए उद्धरण-चिह्न और द्विबिंदु
  rationale: हिन्दी में अलग से ‘यह कहते हुए’ जोड़ने के बजाय द्विबिंदु द्वारा प्रत्यक्ष वचन का स्वाभाविक परिचय दिया गया है।
- source_word: יִשְׂרָאֵל יִהְיֶה שְׁמֶךָ
  choice: तेरा नाम इस्राएल होगा
  rationale: नामकरण की घोषणा को स्पष्ट, गरिमापूर्ण और स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: परमेश्वर-नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में चतुरक्षरीय निजी नाम सीधे प्रयुक्त है; ‘याहवे’ उसे पदवी में बदले बिना सुरक्षित रखता है।
- issue: अज्ञात संबंधवाचक उपवाक्य का पूर्वपद
  choice: वचन याकूब के पास आया था
  alternative: वचन याकूब के पुत्रों के पास आया था
  rationale: אֵלָיו और שִׁמְךָ दोनों एकवचन हैं और उद्धृत नामकरण याकूब का है; इसलिए व्याकरण और उत्पत्ति की पृष्ठभूमि याकूब को पूर्वपद ठहराते हैं।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज शैली रखी गई है। लंबे इब्रानी वाक्य को स्पष्टता के लिए दो वाक्यों में बाँटा गया है और डैश से बारह पत्थरों तथा बारह गोत्रों का संबंध उभारा गया है। ‘पुत्रों’ मूल की औपचारिक अभिव्यक्ति को रखता है, जबकि अधिक समावेशी ‘संतानों’ को पादटिप्पणी में दिया गया है।
