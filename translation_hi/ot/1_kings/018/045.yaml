base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/045.yaml
  text: And in a little while[a], the sky grew black with clouds and wind, and there was a heavy rain[c][b]. Then Ahab mounted his chariot and went to Jezreel.
translation:
  language: hi
  text: थोड़ी ही देर में[a] आकाश बादलों और हवा से काला पड़ गया, और भारी वर्षा हुई। तब अहाब रथ पर चढ़कर यिज्रेल चला गया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से “तब तक ऐसा और तब तक ऐसा”; यह मुहावरा थोड़ी ही देर बीतने का भाव देता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי עַד כֹּה וְעַד כֹּה
  choice: थोड़ी ही देर में
  rationale: यह इब्रानी कालसूचक मुहावरा थोड़े समय के बीतने का बोध कराता है; शाब्दिक रूप हिन्दी में अर्थ स्पष्ट नहीं करेगा।
- source_word: הַשָּׁמַיִם
  choice: आकाश
  rationale: यहाँ मौसम के प्रसंग में दृश्य आकाश अभिप्रेत है; आधुनिक हिन्दी में ‘आकाश’ स्वाभाविक और सटीक है।
- source_word: הִתְקַדְּרוּ
  choice: काला पड़ गया
  rationale: क्रिया आकाश के अँधेरा या घना काला हो जाने को व्यक्त करती है और आने वाले तूफ़ान का चित्र बनाए रखती है।
- source_word: עָבִים וְרוּחַ
  choice: बादलों और हवा से
  rationale: यह पदबंध आकाश के काला पड़ने के साथ बादलों और हवा को जोड़ता है; ‘से’ साधन अथवा कारण की सम्भावना को स्वाभाविक रूप से व्यक्त करता है।
- source_word: וַיְהִי גֶּשֶׁם גָּדוֹל
  choice: भारी वर्षा हुई
  rationale: शाब्दिक ‘बड़ी वर्षा’ की अपेक्षा ‘भारी वर्षा’ आधुनिक हिन्दी में तीव्र वर्षा के लिए प्रचलित है और मूल का बल सुरक्षित रखती है।
- source_word: וַיִּרְכַּב
  choice: रथ पर चढ़कर
  rationale: क्रिया का अर्थ चढ़ना अथवा सवारी करना है। निकटवर्ती कथानक से रथ स्पष्ट है, इसलिए हिन्दी में उसे व्यक्त करना स्वाभाविक है।
- source_word: יִזְרְעֶאלָה
  choice: यिज्रेल चला गया
  rationale: स्थान-नाम के साथ लगा दिशासूचक प्रत्यय यिज्रेल की ओर गति बताता है, जिसे हिन्दी में ‘यिज्रेल चला गया’ व्यक्त करता है।
