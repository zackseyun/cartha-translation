  text: וַֽ/יְהִי֙ כַּ/עֲבֹ֣ר הַֽ/צָּהֳרַ֔יִם וַ/יִּֽתְנַבְּא֔וּ עַ֖ד לַ/עֲל֣וֹת הַ/מִּנְחָ֑ה וְ/אֵֽין ק֥וֹל וְ/אֵין עֹנֶ֖ה וְ/אֵ֥ין קָֽשֶׁב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/029.yaml
  text: And it happened[a], when noon had passed, that they kept prophesying until the offering up of the grain offering, but there was no voice, no one answering[b], and no one paying attention.
translation:
  language: hi
  text: और ऐसा हुआ कि दोपहर बीत जाने पर वे अन्नबलि चढ़ाए जाने के समय तक[b] भविष्यवाणी करते रहे[a]; पर न कोई आवाज़ आई, न किसी ने उत्तर दिया, और न किसी ने ध्यान दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वे उन्मत्त होकर बोलते रहे।” इब्रानी में भविष्यवाणी करने की सामान्य क्रिया है, जो यहाँ बाल के भविष्यद्वक्ताओं के उन्मादी आचरण का वर्णन करती है।
    reason: lexical_alternative
  - marker: b
    text: “अन्नबलि चढ़ाए जाने का समय” नियमित साँझ की बलि के समय को भी सूचित कर सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְהִי
  choice: और ऐसा हुआ
  rationale: यह कथात्मक सूत्र दृश्य के अगले चरण का परिचय देता है; यह अनुवाद उसके प्रवाह को स्वाभाविक आधुनिक हिन्दी में बनाए रखता है।
- source_word: כַּעֲבֹר הַצָּהֳרַיִם
  choice: दोपहर बीत जाने पर
  rationale: כ के साथ infinitive construct समयगत क्रम बताता है और संकेत करता है कि दोपहर बीत चुकी थी।
- source_word: וַיִּתְנַבְּאוּ
  choice: वे ... भविष्यवाणी करते रहे
  rationale: हित्पएल रूप निरंतर क्रिया को दर्शाता है। मूल क्रिया भविष्यवाणी करने की सामान्य क्रिया है, यद्यपि यहाँ बाल के भविष्यद्वक्ताओं का उन्मादी आचरण संदर्भित है।
- source_word: עַד לַעֲלוֹת הַמִּנְחָה
  choice: अन्नबलि चढ़ाए जाने के समय तक
  rationale: מִנְחָה को उसके सामान्य बलिदानी अर्थ ‘अन्नबलि’ में रखा गया है; לַעֲלוֹת को चढ़ाए जाने के समय के रूप में स्वाभाविक ढंग से व्यक्त किया गया है, बिना मुख्य पाठ में ‘साँझ’ जोड़ने के।
- source_word: וְאֵין קוֹל
  choice: न कोई आवाज़ आई
  rationale: קוֹל का अर्थ आवाज़ या ध्वनि हो सकता है; अपेक्षित दैवी उत्तर के संदर्भ में ‘आवाज़’ उपयुक्त है। ‘आई’ हिन्दी में अस्तित्वगत कथन को सहज बनाता है।
- source_word: וְאֵין עֹנֶה
  choice: न किसी ने उत्तर दिया
  rationale: उत्तर देने वाले की पूर्ण अनुपस्थिति को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וְאֵין קָשֶׁב
  choice: और न किसी ने ध्यान दिया
  rationale: קָשֶׁב ध्यान देने या कान लगाने का भाव रखता है; यह अंतिम वाक्यांश किसी भी प्रत्युत्तरदाता की अनुपस्थिति को चरम पर पहुँचाता है।
theological_decisions:
- issue: बाल के भविष्यद्वक्ताओं की उन्मादी गतिविधि का अनुवाद
  choice: भविष्यवाणी करते रहे
  alternative: उन्मत्त होकर बोलते रहे
  rationale: इब्रानी में भविष्यवाणी करने की सामान्य क्रिया प्रयुक्त है। मुख्य पाठ में उसी शब्द-संबंध और कथात्मक विडंबना को सुरक्षित रखा गया है; अधिक व्याख्यात्मक अर्थ पादटिप्पणी में दिया गया है।
- issue: מִנְחָה को बलि या दिन के समय के रूप में समझना
  choice: अन्नबलि चढ़ाए जाने के समय तक
  alternative: नियमित साँझ की बलि के समय तक
  rationale: मूल में ‘साँझ’ स्पष्ट रूप से नहीं है। मुख्य पाठ प्रत्यक्ष बलिदानी शब्दावली बनाए रखता है, जबकि सम्भावित समयगत अभिप्राय पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: आधुनिक मानक हिन्दी; भाषा सहज किंतु गरिमापूर्ण है। ‘अन्नबलि’ बाइबलीय बलिदानी शब्दावली को स्पष्ट रखता है। मुख्य पाठ में सभी पादटिप्पणी चिह्न उपस्थित हैं।
