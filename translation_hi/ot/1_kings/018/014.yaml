source:
  edition: WLC
  text: וְ/עַתָּה֙ אַתָּ֣ה אֹמֵ֔ר לֵ֛ךְ אֱמֹ֥ר לַֽ/אדֹנֶ֖י/ךָ הִנֵּ֣ה אֵלִיָּ֑הוּ וַ/הֲרָגָֽ/נִי׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/014.yaml
  text: And now you are saying, ‘Go, tell your lord, “Look, Elijah is here,”’ and he will kill me.’
translation:
  language: hi
  text: और अब आप कह रहे हैं, ‘जाओ, अपने स्वामी से कहो, “देखिए, एलिय्याह यहाँ है,”’ और वह मुझे मार डालेगा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לַאדֹנֶיךָ
  choice: अपने स्वामी से
  rationale: यहाँ עֹבַדְיָה के मानवीय स्वामी, राजा अहाब, का उल्लेख है; इसलिए सामान्य पद ‘स्वामी’ उपयुक्त है।
- source_word: הִנֵּה
  choice: देखिए
  rationale: उपस्थिति की ओर ध्यान खींचने वाले इस सूचक उद्गार को आधुनिक, स्वाभाविक और आदरसूचक हिन्दी में व्यक्त करता है।
- source_word: וַהֲרָגָנִי
  choice: और वह मुझे मार डालेगा
  rationale: वाव के परिणामसूचक प्रवाह और हिफ़ील रूप के स्पष्ट प्राणदंड/हत्या-अर्थ को स्वाभाविक हिन्दी में रखता है।
theological_decisions:
- issue: ‘स्वामी’ की पहचान
  choice: मानवीय स्वामी अहाब के लिए छोटे अक्षर की सामान्य पदवी के समतुल्य ‘स्वामी’
  alternative: प्रभु/यहोवा
  rationale: संदर्भ और प्रत्यय ‘तेरा स्वामी’ से राजा अहाब अभिप्रेत है, परमेश्वर नहीं।
- issue: अंतिम क्रिया का कर्ता
  choice: ‘वह’ अर्थात् अहाब
  alternative: एलिय्याह या अनिर्दिष्ट कर्ता
  rationale: निकटवर्ती कथानक में ओबद्याह को भय है कि अहाब सूचना असत्य निकलने पर उसे मार डालेगा; हिन्दी में सर्वनाम मूल की संदर्भगत स्पष्टता बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; आदरसूचक ‘आप/देखिए’ से ओबद्याह का एलिय्याह के प्रति सम्मान व्यक्त है। उद्धरण के भीतर उद्धरण को स्पष्ट रखा गया है और वाक्य की आशंकापूर्ण तीव्रता सुरक्षित है।
