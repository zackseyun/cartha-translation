  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר אֵלִיָּ֨הוּ֙ אֶל הָ/עָ֔ם אֲנִ֞י נוֹתַ֧רְתִּי נָבִ֛יא לַ/יהוָ֖ה לְ/בַדִּ֑/י וּ/נְבִיאֵ֣י הַ/בַּ֔עַל אַרְבַּע מֵא֥וֹת וַ/חֲמִשִּׁ֖ים אִֽישׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/022.yaml
  text: Then Elijah said to the people[a], “I, I alone, am left as a prophet of Yahweh, but the prophets of Baal are four hundred and fifty men.”
translation:
  language: hi
  text: तब एलिय्याह ने लोगों से कहा, “याहवे का नबी केवल मैं ही बचा हूँ[a], जबकि बाअल के नबी चार सौ पचास पुरुष हैं।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “याहवे का नबी मैं अकेला ही रह गया हूँ।” यह कथन इस मुठभेड़ में एलिय्याह की उस समय की सार्वजनिक स्थिति को दर्शाता है, यद्यपि इसी कथा में ओबद्याह द्वारा दूसरे नबियों को छिपाए जाने का उल्लेख है (1 राजा 18:4, 13)।
    reason: वैकल्पिक अनुवाद और कथात्मक तनाव को स्पष्ट करना
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: तब ... ने कहा
  rationale: वाव-क्रमिक रूप कथा को आगे बढ़ाता है; ‘तब’ आधुनिक हिन्दी में उसके क्रमिक बल को स्वाभाविक रूप से व्यक्त करता है।
- source_word: אֵלִיָּהוּ
  choice: एलिय्याह
  rationale: इब्रानी व्यक्तिगत नाम का प्रचलित हिन्दी लिप्यंतरण।
- source_word: אֶל הָעָם
  choice: लोगों से
  rationale: यहाँ עָם एकत्र इस्राएली लोगों को सूचित करता है; हिन्दी में ‘लोगों से कहा’ स्वाभाविक और अर्थानुकूल है।
- source_word: אֲנִי נוֹתַרְתִּי ... לְבַדִּי
  choice: केवल मैं ही बचा हूँ
  rationale: स्पष्ट सर्वनाम और לְבַדִּי के संयुक्त बल को ‘केवल मैं ही’ व्यक्त करता है; हिन्दी में ‘मैं, केवल मैं’ की कृत्रिम पुनरावृत्ति आवश्यक नहीं है। נוֹתַרְתִּי को वर्तमान परिणामी दशा के रूप में ‘बचा हूँ’ दिया गया है।
- source_word: נָבִיא לַיהוָה
  choice: याहवे का नबी
  rationale: लामेद यहाँ याहवे से संबंध और उनकी ओर से नबी होने का भाव देता है; हिन्दी संबंधकारक इसे संक्षिप्त और स्पष्ट बनाता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: चतुर्वर्णी दिव्य नाम को उपाधि से बदलने के बजाय हिन्दी में उसके नाम के रूप में लिप्यंतरित किया गया है।
- source_word: וּנְבִיאֵי הַבַּעַל
  choice: जबकि बाअल के नबी
  rationale: वाव यहाँ अकेले एलिय्याह और बाअल के अनेक नबियों के बीच विरोध दिखाता है; ‘जबकि’ इस संबंध को स्वाभाविक हिन्दी में स्पष्ट करता है। ‘बाअल’ लिप्यंतरण देवता के नाम को हिन्दी के सामान्य शब्द ‘बाल’ से अलग पहचानने में सहायक है।
- source_word: אַרְבַּע מֵאוֹת וַחֲמִשִּׁים אִישׁ
  choice: साढ़े चार सौ पुरुष
  rationale: ‘साढ़े चार सौ’ 450 की सहज हिन्दी अभिव्यक्ति है और ‘पुरुष’ स्पष्ट אִישׁ को बनाए रखता है।
theological_decisions:
- issue: दिव्य नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: प्रभु; यहोवा
  rationale: मूल पाठ व्यक्तिगत दिव्य नाम का प्रयोग करता है; लिप्यंतरण उसे उपाधि में बदलने से बचाता है।
- issue: एलिय्याह का अपने को अकेला बचा नबी बताना
  choice: दावे को मुख्य पाठ में बिना योग्यता जोड़े ज्यों का त्यों रखा गया
  alternative: ओबद्याह द्वारा छिपाए गए नबियों के आधार पर मुख्य पाठ में दावे को सीमित करना
  rationale: यह कथन इस मुठभेड़ में एलिय्याह के मुख से कहा गया है। 1 राजा 18:4, 13 में अन्य नबियों का उल्लेख होने से उत्पन्न तनाव को अनुवाद में चुपचाप सुलझाना उचित नहीं; स्पष्टीकरण पादटिप्पणी में दिया गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘केवल मैं ही’ इब्रानी के emphatic स्वर को स्वाभाविक हिन्दी में व्यक्त करता है; नामों के लिए ‘एलिय्याह’, ‘याहवे’ और ‘बाअल’ लिप्यंतरण अपनाए गए हैं।
