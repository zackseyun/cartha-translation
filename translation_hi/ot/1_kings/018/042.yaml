base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/042.yaml
  text: So Ahab went up to eat and to drink[a], but Elijah went up to the top of Carmel[c][b], and he bent down to the ground and put his face between his knees.
translation:
  language: hi
  text: तब अहाब खाने-पीने के लिए ऊपर गया, पर एलिय्याह कर्मेल की चोटी पर चढ़ गया[a]। वह भूमि की ओर झुक गया और अपना चेहरा अपने घुटनों के बीच रख लिया[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से ‘और एलिय्याह’; यहाँ दोनों व्यक्तियों के अलग-अलग कार्यों का विरोध दिखाने के लिए ‘पर’ कहा गया है। ‘कर्मेल की चोटी’ का अनुवाद ‘कर्मेल के शिखर’ भी हो सकता है; मूल में यहाँ ‘पर्वत’ शब्द नहीं है।
    reason: lexical_alternative
  - marker: b
    text: यहाँ मूल पाठ एलिय्याह की शारीरिक मुद्रा बताता है; व्यापक प्रसंग प्रार्थना का संकेत देता है, पर इस पद में प्रार्थना का स्पष्ट उल्लेख नहीं है।
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּעֲלֶה
  choice: ऊपर गया
  rationale: עלה का सामान्य दिशासूचक अर्थ ‘ऊपर जाना’ है; आधुनिक हिन्दी में यह स्वाभाविक है और दिशा को बनाए रखता है।
- source_word: לֶאֱכֹל וְלִשְׁתּוֹת
  choice: खाने-पीने के लिए
  rationale: दोनों उद्देश्यवाचक क्रियाओं को सहज आधुनिक हिन्दी में संयुक्त रूप से व्यक्त करता है।
- source_word: וְאֵלִיָּהוּ
  choice: पर एलिय्याह
  rationale: इब्रानी וְ मूलतः ‘और’ है, पर यहाँ अहाब और एलिय्याह के अलग-अलग कार्यों का प्रसंगगत विरोध हिन्दी में ‘पर’ से स्वाभाविक रूप में प्रकट होता है।
- source_word: עָלָה אֶל רֹאשׁ הַכַּרְמֶל
  choice: कर्मेल की चोटी पर चढ़ गया
  rationale: רֹאשׁ का यहाँ अर्थ ‘चोटी’ है। עָלָה को ‘चढ़ गया’ कहना पर्वतीय चोटी की ओर गति के संदर्भ में स्वाभाविक है; मूल में ‘पर्वत’ शब्द नहीं जोड़ा गया।
- source_word: וַיִּגְהַר אַרְצָה
  choice: वह भूमि की ओर झुक गया
  rationale: दुर्लभ क्रिया גהר नीचे झुकने की शारीरिक मुद्रा बताती है। यह अनुवाद उसे प्रार्थना या दण्डवत के रूप में अतिरिक्त व्याख्यायित नहीं करता।
- source_word: וַיָּשֶׂם פָּנָיו בֵּין בִּרְכָּיו
  choice: अपना मुँह अपने घुटनों के बीच रख लिया
  rationale: एलिय्याह की ठोस शारीरिक मुद्रा को सीधे और स्पष्ट आधुनिक हिन्दी में रखता है।
theological_decisions:
- issue: क्या एलिय्याह की मुद्रा को मुख्य पाठ में स्पष्ट रूप से प्रार्थना कहा जाए
  choice: केवल शारीरिक मुद्रा का वर्णन रखा गया है।
  alternative: ‘वह प्रार्थना में झुक गया’ या ‘उसने घुटनों के बीच मुँह रखकर प्रार्थना की।’
  rationale: व्यापक प्रसंग प्रार्थना का संकेत दे सकता है, लेकिन इस पद में प्रार्थना करना स्पष्टतः नहीं कहा गया; इसलिए मूल की सीमा और निहित तनाव सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सहज रखी गई है। ‘कर्मेल’ नाम को मूल के अनुसार रखा गया है और मुख्य पाठ में अनावश्यक रूप से ‘पर्वत’ नहीं जोड़ा गया। सभी पाद-टिप्पणी चिह्न मुख्य पाठ में उपस्थित हैं।
