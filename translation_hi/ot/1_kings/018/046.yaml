reference: 1 Kings 18:46
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/יַד יְהוָ֗ה הָֽיְתָה֙ אֶל אֵ֣לִיָּ֔הוּ וַ/יְשַׁנֵּ֖ס מָתְנָ֑י/ו וַ/יָּ֨רָץ֙ לִ/פְנֵ֣י אַחְאָ֔ב עַד בֹּאֲ/כָ֖ה יִזְרְעֶֽאלָ/ה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/046.yaml
  text: And the hand of Yahweh was on Elijah[b][a], and he tucked up his loins and ran ahead of Ahab as far as the entrance to Jezreel.
translation:
  language: hi
  text: और यहोवा का हाथ एलिय्याह पर था,[a] और उसने दौड़ने के लिए अपने वस्त्र कमर में कस लिए,[b] और अहाब के आगे-आगे यिज्रेल के प्रवेश तक दौड़ा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'परंपरागत रूप से: “यहोवा का हाथ एलिय्याह पर आ गया।” यह दैवी सामर्थ्य या प्रभाव का रूपक है।'
    reason: lexical_alternative
  - marker: b
    text: 'शाब्दिक अर्थ: “उसने अपनी कमर कस ली”; अर्थात उसने दौड़ने के लिए अपना लंबा वस्त्र समेटकर कमर में बाँध लिया।'
    reason: cultural_note
lexical_decisions:
- source_word: יְהוָה
  choice: यहोवा
  rationale: परमेश्वर के विशिष्ट वाचा-नाम का प्रचलित हिन्दी रूप; इसे सामान्य उपाधि ‘प्रभु’ से अलग रखता है।
- source_word: וְיָד יְהוָה הָיְתָה אֶל
  choice: यहोवा का हाथ ... पर था
  rationale: इब्रानी रूपक और הָיְתָה के साधारण ‘था’ भाव को बनाए रखता है तथा सामर्थ्य के ठीक स्वरूप को अनिर्धारित छोड़ता है।
- source_word: וַיְשַׁנֵּס מָתְנָיו
  choice: उसने दौड़ने के लिए अपने वस्त्र कमर में कस लिए
  rationale: शाब्दिक ‘अपनी कमर बाँधी’ के सांस्कृतिक आशय—लंबे वस्त्र को समेटकर दौड़ने की तैयारी—को स्वाभाविक आधुनिक हिन्दी में स्पष्ट करता है।
- source_word: וַיָּרָץ לִפְנֵי
  choice: आगे-आगे ... दौड़ा
  rationale: अहाब के सामने या उससे आगे दौड़ने का स्थानिक अर्थ सहज हिन्दी में व्यक्त करता है, बिना किसी औपचारिक सेवकाई का अर्थ जोड़े।
- source_word: עַד בֹּאֲכָה יִזְרְעֶאלָה
  choice: यिज्रेल के प्रवेश तक
  rationale: नगर के पहुँच-स्थान या प्रवेश तक का आशय व्यक्त करता है; ‘यिज्रेल’ हिन्दी बाइबल परंपरा में प्रचलित स्थान-नाम है।
theological_decisions:
- issue: एलिय्याह पर यहोवा के हाथ का स्वरूप
  choice: रूपक को ‘यहोवा का हाथ एलिय्याह पर था’ के रूप में बनाए रखा गया है।
  alternative: ‘यहोवा ने एलिय्याह को अलौकिक सामर्थ्य दी’ या ‘यहोवा की शक्ति एलिय्याह पर उतरी।’
  rationale: पाठ स्पष्ट रूप से दैवी सक्रियता बताता है, पर यह निर्धारित नहीं करता कि वह चमत्कारी शारीरिक शक्ति, भविष्यद्वक्ताई प्रेरणा, तत्परता, या इनका मेल थी।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट हिन्दी। मुख्य पाठ में सांस्कृतिक मुहावरे का अर्थ सहज बनाया गया है, जबकि पाद-टिप्पणी में उसका शाब्दिक रूप सुरक्षित है।
