base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/030.yaml
  text: Then Elijah said to all the people[a], “Come near to me.” So all the people came near to him, and he repaired the altar of Yahweh that had been torn down.
translation:
  language: hi
  text: तब एलिय्याह ने सब लोगों से कहा, “मेरे पास आओ।” सब लोग उसके पास आए, और उसने याहवे की उस वेदी की मरम्मत की[a], जिसे ढा दिया गया था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “फिर से ठीक किया”; इब्रानी क्रिया का शाब्दिक अर्थ “चंगा किया” है।
    reason: शाब्दिक रूपक और संभावित वैकल्पिक अनुवाद को सुरक्षित रखना।
lexical_decisions:
- source_word: גְּשׁוּ
  choice: मेरे पास आओ
  rationale: यह आज्ञार्थक क्रिया लोगों को शारीरिक रूप से एलिय्याह के निकट आने के लिए बुलाती है; यह हिंदी में स्वाभाविक और दिशासूचक है।
- source_word: וַיִּגְּשׁוּ
  choice: उसके पास आए
  rationale: यह एलिय्याह की आज्ञा की कथात्मक पूर्ति दिखाता है और पहले वाक्य के ‘मेरे पास आओ’ से अर्थगत संगति रखता है।
- source_word: וַיְרַפֵּא
  choice: मरम्मत की
  rationale: רפא का मूल अर्थ ‘चंगा करना’ है, पर वेदी के संदर्भ में इसका आशय उसे फिर से ठीक और उपयोग योग्य करना है; ‘मरम्मत की’ स्पष्ट और स्वाभाविक हिंदी है।
- source_word: מִזְבַּח יְהוָה
  choice: याहवे की ... वेदी
  rationale: संबंधवाचक हिब्रू संरचना को स्वाभाविक हिंदी में रखा गया है और परमेश्वर के व्यक्तिगत नाम को शीर्षक से प्रतिस्थापित नहीं किया गया।
- source_word: יְהוָה
  choice: याहवे
  rationale: मूल पाठ में चार अक्षरों वाला व्यक्तिगत ईश्वरीय नाम है; ‘याहवे’ उसका प्रचलित हिंदी लिप्यंतरण है।
- source_word: הֶהָרוּס
  choice: जिसे ढा दिया गया था
  rationale: הרס का निष्क्रिय कृदंत पहले हो चुके विध्वंस को व्यक्त करता है; यह अनुवाद उस पूर्व क्रिया और वेदी की दशा दोनों को स्पष्ट करता है।
- source_word: כָל הָעָם
  choice: सब लोग
  rationale: सामूहिक पद का सरल, स्वाभाविक और अर्थपूर्ण आधुनिक हिंदी रूप।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: यहाँ मूल पाठ व्यक्तिगत वाचा-नाम का प्रयोग करता है। लिप्यंतरण ‘याहवे’ नाम को बनाए रखता है, जबकि ‘प्रभु’ उसे एक उपाधि से बदल देता और ‘यहोवा’ कम संभावित पारंपरिक स्वरूप है।
- issue: वेदी के लिए רפא का रूपकात्मक प्रयोग
  choice: मरम्मत की
  alternative: चंगा किया; फिर से ठीक किया
  rationale: मुख्य पाठ में स्वाभाविक हिंदी रखी गई है, जबकि पादटिप्पणी क्रिया के शाब्दिक रूपक को सुरक्षित रखती है; इससे पाठ यह दावा नहीं करता कि वेदी किसी जीवित प्राणी की तरह चंगी हुई।
translation_notes:
  register: आधुनिक, सरल और गरिमापूर्ण हिंदी। ‘मेरे पास आओ/उसके पास आए’ की पुनरावृत्ति मूल की आज्ञा और उसकी तत्काल पूर्ति को दर्शाती है। पादटिप्पणी-चिह्न उसी क्रिया के बाद रखा गया है जिससे वह संबंधित है।
