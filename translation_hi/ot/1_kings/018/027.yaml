base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/027.yaml
  text: And it happened at noon that Elijah mocked them and said[a], “Cry out with a loud voice, for he is a god. For he is musing, or he has gone aside, or he is on a journey. Perhaps he is sleeping and will awake.”
translation:
  language: hi
  text: दोपहर को एलिय्याह ने उनका उपहास किया और कहा, “ज़ोर से पुकारो, क्योंकि वह देवता है! शायद वह सोच-विचार में डूबा हो, या कहीं अलग गया हो[a], या यात्रा पर हो। शायद वह सो रहा हो और जाग जाए।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: संभवतः, “वह शौच करने गया हो।” हिब्रू अभिव्यक्ति शायद एक शिष्टोक्ति है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בַצָּהֳרַיִם
  choice: दोपहर को
  rationale: हिब्रू कथात्मक सूत्र को हिंदी में अलग से ‘और ऐसा हुआ’ कहने के बजाय स्वाभाविक दृश्य-परिवर्तन के रूप में व्यक्त किया गया है; समय-सूचक अर्थ पूरा बना रहता है।
- source_word: וַיְהַתֵּל בָּהֶם
  choice: उनका उपहास करने लगा
  rationale: हित्पएल क्रिया यहाँ तिरस्कारपूर्ण हँसी-मज़ाक या ठट्ठा दर्शाती है। ‘उपहास’ गरिमापूर्ण आधुनिक हिंदी में एलिय्याह के व्यंग्य को स्पष्ट रखता है।
- source_word: קִרְאוּ בְקוֹל גָּדוֹל
  choice: ज़ोर से पुकारो
  rationale: यह आज्ञा और ‘बड़ी/ऊँची आवाज़’ के हिब्रू मुहावरे, दोनों को सहज आधुनिक हिंदी में व्यक्त करता है।
- source_word: כִּי אֱלֹהִים הוּא
  choice: क्योंकि वह देवता है
  rationale: संदर्भ में אֱלֹהִים बाल के लिए व्यंग्यपूर्वक प्रयुक्त है। ‘देवता’ इसे इस्राएल के परमेश्वर की पहचान मानने से बचाता और कटाक्ष बनाए रखता है।
- source_word: שִׂיחַ
  choice: सोच-विचार में डूबा हो
  rationale: दुर्लभ संज्ञा का आशय चिंतन या मानसिक व्यस्तता हो सकता है। यह चुनाव किसी अत्यधिक विशिष्ट अर्थ को थोपे बिना व्यंग्यपूर्ण संभावना व्यक्त करता है।
- source_word: שִׂיג לוֹ
  choice: कहीं अलग गया हो
  rationale: दुर्लभ और संभवतः शिष्टोक्तिपूर्ण अभिव्यक्ति को मुख्य पाठ में अप्रत्यक्ष रखा गया है; उसका संभावित शारीरिक अर्थ पादटिप्पणी में दिया गया है।
- source_word: דֶרֶךְ לוֹ
  choice: यात्रा पर हो
  rationale: हिब्रू मुहावरे का आशय रास्ते पर या यात्रा में होने से है; यह उसका स्वाभाविक हिंदी रूप है।
- source_word: אוּלַי יָשֵׁן הוּא וְיִקָץ
  choice: शायद वह सो रहा हो और जाग जाए
  rationale: संभावना और अकर्मक ‘जागने’ की क्रिया को बनाए रखता है; ‘उसे जगाना पड़े’ जैसा व्याख्यात्मक अर्थ नहीं जोड़ा गया।
theological_decisions:
- issue: बाल के लिए אֱלֹהִים का अनुवाद
  choice: देवता
  alternative: परमेश्वर
  rationale: एलिय्याह यहाँ बाल का व्यंग्य कर रहा है, इस्राएल के परमेश्वर के विषय में अंगीकार नहीं कर रहा। ‘देवता’ संदर्भगत भेद और व्यंग्य दोनों सुरक्षित रखता है।
- issue: שִׂיג לוֹ की शिष्टोक्ति
  choice: कहीं अलग गया हो
  alternative: शौच करने गया हो
  rationale: हिब्रू वाक्यांश स्वयं अप्रत्यक्ष और अर्थ की दृष्टि से दुर्लभ है। मुख्य पाठ में उसकी शिष्टोक्ति सुरक्षित रखी गई है और संभावित स्पष्ट अर्थ पादटिप्पणी में बताया गया है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘ज़ोर से पुकारो’ और ‘जाग जाए’ बोलचाल में समझ आने वाले हैं, जबकि ‘उपहास’ कथात्मक गरिमा बनाए रखता है। विस्मयादिबोधक चिह्न एलिय्याह के स्पष्ट व्यंग्य को संकेतित करता है, बिना पाठ में कोई अतिरिक्त कथन जोड़े।
