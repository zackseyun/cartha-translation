translation:
  language: hi
  text: तब उसने लकड़ियों को क्रम से लगाया, बैल को टुकड़ों में काटा और उन्हें लकड़ियों पर रख दिया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעֲרֹךְ
  choice: क्रम से लगाया
  rationale: ערך यहाँ बलिदान की तैयारी में लकड़ियों को व्यवस्थित ढंग से लगाने को दर्शाता है। यह हिंदी में स्वाभाविक है और क्रिया की सुव्यवस्थित प्रकृति भी बनाए रखता है।
- source_word: הָעֵצִים
  choice: लकड़ियों
  rationale: עֵצִים यहाँ वे लकड़ियाँ हैं जिन्हें वेदी पर ईंधन के रूप में लगाया गया था। हिंदी में बहुवचन 'लकड़ियाँ' इस दृश्य को स्पष्ट और सहज रूप से व्यक्त करता है।
- source_word: וַיְנַתַּח
  choice: टुकड़े किए
  rationale: נתח बलिदान के पशु को अलग-अलग टुकड़ों में काटने का बोध देता है। 'टुकड़े किए' संक्षिप्त, स्पष्ट और प्रसंगानुकूल है।
- source_word: הַפָּר
  choice: बैल
  rationale: פַּר बलिदान के प्रसंग में नर गोवंश को दर्शाता है। 'बैल' आधुनिक हिंदी में सीधा और परिचित अनुवाद है; इस पद में आयु को अलग से व्यक्त करना आवश्यक नहीं।
- source_word: וַיָּשֶׂם
  choice: रख दिया
  rationale: שׂים यहाँ तैयार किए गए पशु को लकड़ियों पर रखने की क्रिया है। 'रख दिया' हिंदी कथात्मक क्रम में स्वाभाविक है और क्रिया की पूर्णता व्यक्त करता है।
- source_word: עַל הָעֵצִים
  choice: लकड़ियों पर
  rationale: עַל यहाँ स्पष्ट स्थान-संबंध बताता है। 'लकड़ियों पर' मूल अर्थ को सीधे और स्वाभाविक ढंग से प्रस्तुत करता है।
