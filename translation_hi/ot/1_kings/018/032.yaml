  text: וַ/יִּבְנֶ֧ה אֶת הָ/אֲבָנִ֛ים מִזְבֵּ֖חַ בְּ/שֵׁ֣ם יְהוָ֑ה וַ/יַּ֣עַשׂ תְּעָלָ֗ה כְּ/בֵית֙ סָאתַ֣יִם זֶ֔רַע סָבִ֖יב לַ/מִּזְבֵּֽחַ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/032.yaml
  text: And with the stones he built an altar in the name of Yahweh[a], and he made a trench around the altar, like the capacity for two seahs of seed.
translation:
  language: hi
  text: और उसने उन पत्थरों से यहोवा के नाम पर एक वेदी बनाई, और वेदी के चारों ओर दो सआ बीज के माप जितनी एक खाई बनाई।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी पदबंध का शाब्दिक अर्थ ‘दो सआ बीज के माप के समान’ है। यह खाई की क्षमता, फैलाव, या सामान्य आकार का संकेत हो सकता है। ‘सआ’ एक प्राचीन माप की इकाई थी।
    reason: मूल की कठिन, संक्षिप्त माप-संबंधी अभिव्यक्ति का अनिश्चित अर्थ सुरक्षित रखना और प्राचीन इकाई स्पष्ट करना।
lexical_decisions:
- source_word: וַיִּבְנֶה אֶת־הָאֲבָנִים מִזְבֵּחַ
  choice: उसने उन पत्थरों से ... एक वेदी बनाई
  rationale: यह इब्रानी वाक्य का स्वाभाविक हिन्दी रूप है और पत्थरों को वेदी की निर्माण-सामग्री के रूप में रखता है; ‘फिर से बनाई’ पिछले पद की सूचना को इस उपवाक्य में नहीं जोड़ता।
- source_word: בְּשֵׁם יְהוָה
  choice: यहोवा के नाम पर
  rationale: ‘के नाम पर’ आधुनिक हिन्दी में कार्य को यहोवा के नाम और अधिकार से संबद्ध करने का स्वाभाविक ढंग है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: व्यक्तिगत ईश्वरीय नाम को किसी उपाधि से बदलने के बजाय हिन्दी में प्रचलित लिप्यंतरण द्वारा प्रस्तुत किया गया है।
- source_word: וַיַּעַשׂ תְּעָלָה
  choice: खाई बनाई
  rationale: תְּעָלָה वेदी के आसपास खोदी गई खाई या नाली को दर्शाता है; इस प्रसंग में ‘खाई’ सहज और स्पष्ट है।
- source_word: כְּבֵית סָאתַיִם זֶרַע
  choice: जिसमें लगभग दो सआ बीज समा सकता था
  rationale: मूल पदबंध कठिन और संक्षिप्त है—शाब्दिक रूप से ‘दो सआ बीज के घर/माप के समान’। यह अनुवाद उसे खाई की क्षमता के रूप में समझते हुए ‘लगभग’ से כְּ की तुलनात्मक अनिश्चितता बचाता है और प्राचीन माप ‘सआ’ को बनाए रखता है।
- source_word: סָבִיב לַמִּזְבֵּחַ
  choice: वेदी के चारों ओर
  rationale: यह वेदी को घेरती हुई खाई की स्थिति को संक्षेप और स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: मूल में चतुरक्षरीय व्यक्तिगत नाम सीधे प्रयुक्त है। ‘यहोवा’ हिन्दी पाठकों में परिचित नाम-रूप है और इसे ‘प्रभु’ जैसी उपाधि से नहीं बदलता; ‘याहवे’ अधिक संभावित विद्वत पुनर्निर्मित उच्चारण है।
- issue: בְּשֵׁם का संबंध
  choice: यहोवा के नाम पर
  alternative: यहोवा के नाम में; यहोवा के लिए
  rationale: मूल की धार्मिक-संबंधी अभिव्यक्ति को बिना किसी विशिष्ट सांप्रदायिक अर्थ के सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और कथात्मक हिन्दी। प्राचीन माप को मूल रूप में रखा गया है और उसकी व्याख्या पादटिप्पणी में दी गई है।
