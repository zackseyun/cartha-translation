  text: So Obadiah went to meet Ahab and told him[a], and Ahab went to meet Elijah.
translation:
  language: hi
  text: तब ओबद्याह अहाब से मिलने गया और उसे बताया[a]। फिर अहाब एलिय्याह से मिलने गया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसे सूचना दी।” इब्रानी क्रिया का अर्थ “बताना,” “समाचार देना,” या “सूचित करना” हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: गया
  rationale: הלך का यह रूप कथा को आगे बढ़ाते हुए सामान्य गति व्यक्त करता है; ‘गया’ स्वाभाविक और सटीक है।
- source_word: עֹבַדְיָהוּ
  choice: ओबद्याह
  rationale: व्यक्तिनाम का प्रचलित हिन्दी लिप्यंतरण।
- source_word: לִקְרַאת
  choice: से मिलने
  rationale: यह रचना किसी व्यक्ति की ओर जाकर उससे भेंट करने का भाव व्यक्त करती है; दोनों occurrences में ‘से मिलने’ स्वाभाविक है।
- source_word: אַחְאָב
  choice: अहाब
  rationale: व्यक्तिनाम का प्रचलित हिन्दी लिप्यंतरण।
- source_word: וַיַּגֶּד לוֹ
  choice: उसे बताया
  rationale: נגד के हिफ़ील रूप का अर्थ ‘बताना, सूचना देना, समाचार देना’ हो सकता है। यहाँ कही गई बात संदर्भ से समझी जाती है, इसलिए उसे स्पष्ट रूप से जोड़कर मूल की संक्षिप्तता नहीं बदली गई।
- source_word: וַיֵּלֶךְ אַחְאָב
  choice: फिर अहाब ... गया
  rationale: दूसरा wayyiqtol घटनाओं का क्रम आगे बढ़ाता है; हिन्दी में ‘फिर’ इस क्रम को सहज रूप से व्यक्त करता है।
- source_word: אֵלִיָּהוּ
  choice: एलिय्याह
  rationale: व्यक्तिनाम का प्रचलित हिन्दी लिप्यंतरण।
