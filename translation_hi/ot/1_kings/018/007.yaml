- from: जब ओबद्याह मार्ग में था, तभी एलिय्याह उससे मिलने आ रहा था। उसे पहचानते ही ओबद्याह मुँह के बल गिर पड़ा और बोला, “मेरे स्वामी एलिय्याह, क्या यह आप ही हैं?”
  to: जब ओबद्याह मार्ग में था, तभी एलिय्याह उससे मिलने आया। ओबद्याह ने उसे पहचाना, तो वह मुँह के बल गिर पड़ा और बोला, “क्या आप ही मेरे स्वामी एलिय्याह हैं?”
  rationale: The revision retains the draft’s faithful names, respectful human address, and non-interpretive description of the gesture. It changes only the first narrative action from progressive “आ रहा था” to eventive “आया” and clarifies the recognition sequence.
