base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/007.yaml
  text: As Obadiah was on the way, behold, Elijah came to meet him. When he recognized him, he fell on his face and said, “Is that you, my lord Elijah?”
translation:
  language: hi
  text: जब ओबद्याह मार्ग में था, तभी एलिय्याह उससे मिलने आया। ओबद्याह ने उसे पहचाना, तो वह मुँह के बल गिर पड़ा और बोला, “क्या आप ही मेरे स्वामी एलिय्याह हैं?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהִנֵּה
  choice: तभी
  rationale: यहाँ अचानक दिखाई देने या ध्यान खींचने का भाव है; आधुनिक हिन्दी में ‘तभी’ कथानक के इस मोड़ को स्वाभाविक रूप से व्यक्त करता है।
- source_word: לִקְרָאתוֹ
  choice: उससे मिलने
  rationale: इसका मूल अर्थ किसी की ओर जाकर उसका सामना करना या उससे मिलना है; संदर्भ में तटस्थ ‘उससे मिलने’ उपयुक्त है।
- source_word: וַיִּפֹּל עַל־פָּנָיו
  choice: मुँह के बल गिर पड़ा
  rationale: यह हिब्रू मुहावरे की शारीरिक मुद्रा और आदरपूर्ण प्रतिक्रिया दोनों को स्पष्ट रखता है।
- source_word: אֲדֹנִי
  choice: मेरे स्वामी
  rationale: यह आदरसूचक मानवीय संबोधन है, दिव्य नाम या परमेश्वर के लिए प्रयुक्त विशेष पद नहीं।
- source_word: הַאַתָּה זֶה
  choice: क्या यह आप ही हैं?
  rationale: पहचान की पुष्टि माँगने वाले प्रश्न को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: ओबद्याह का एलिय्याह के सामने गिरना
  choice: मुँह के बल गिर पड़ा
  alternative: दण्डवत किया
  rationale: मूल पाठ केवल मुद्रा बताता है; ‘दण्डवत किया’ उपासना या विशिष्ट धार्मिक अभिप्राय को आवश्यकता से अधिक स्पष्ट कर सकता है। इसलिए क्रिया को दृश्य और तटस्थ रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, कथात्मक और गरिमापूर्ण शैली। ‘मार्ग’ बाइबिलीय कथन की गरिमा बनाए रखता है, जबकि वाक्य-विन्यास सामान्य पाठक के लिए सहज है।
