  yaml_path: translation/ot/1_kings/018/018.yaml
  text: And he said[a], “I have not troubled Israel, but you and your father's house have[c][b], because you have forsaken the commandments of Yahweh and have gone after the Baals.”
translation:
  language: hi
  text: उसने कहा, “इस्राएल को संकट में मैंने नहीं डाला; बल्कि तुमने और तुम्हारे पिता के घराने ने डाला है[a], क्योंकि तुम लोगों ने याहवे की आज्ञाओं को त्याग दिया और तुम स्वयं बाल देवताओं के पीछे चल पड़े हो[b]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तुमने और तुम्हारे पिता के घराने ने इस्राएल पर संकट लाया है।”
    reason: עכר को ‘संकट में डालना’ या ‘संकट लाना’ दोनों प्रकार से व्यक्त किया जा सकता है।
  - marker: b
    text: इब्रानी में ‘बाल’ नामक देवताओं के लिए बहुवचन है; इससे बाल-पूजा के विभिन्न स्थानीय रूपों या अभिव्यक्तियों का संकेत मिल सकता है।
    reason: मूल पाठ के स्पष्ट बहुवचन और उसकी सांस्कृतिक पृष्ठभूमि को बताना आवश्यक है।
lexical_decisions:
- source_word: עָכַרְתִּי
  choice: संकट में मैंने नहीं डाला
  rationale: עכר का अर्थ किसी समुदाय पर संकट या विपत्ति लाना है। यह अभिव्यक्ति पिछले पद के आरोप से जुड़ाव बनाए रखते हुए आधुनिक हिन्दी में स्वाभाविक है।
- source_word: כִּי אִם
  choice: बल्कि
  rationale: यह पदबंध पहले आरोप का खंडन करके उसे अहाब और उसके घराने की ओर मोड़ता है; हिन्दी में ‘बल्कि’ इस विरोध और सुधार को स्पष्ट करता है।
- source_word: וּבֵית אָבִיךָ
  choice: तुम्हारे पिता का घराना
  rationale: शाब्दिक अर्थ ‘तुम्हारे पिता का घर’ है। ‘घराना’ पारिवारिक और राजवंशीय उत्तरदायित्व दोनों को बनाए रखता है।
- source_word: בַּעֲזָבְכֶם
  choice: क्योंकि तुम लोगों ने…त्याग दिया
  rationale: पूर्वसर्ग ב और धात्वर्थक संज्ञा यहाँ आरोप का कारण बताते हैं। मूल का बहुवचन अहाब और उसके घराने को सम्मिलित करता है, इसलिए ‘तुम लोगों ने’ चुना गया।
- source_word: מִצְוֺת
  choice: आज्ञाओं
  rationale: यह शब्द याहवे के आदेशों के वाचागत और विधिक भार को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: मूल में परमेश्वर का व्यक्तिगत वाचा-नाम יהוה है; उसे किसी उपाधि से बदलने के बजाय हिन्दी लिप्यंतरण में रखा गया है।
- source_word: וַתֵּלֶךְ אַחֲרֵי
  choice: पीछे चल पड़े हो
  rationale: यह इब्रानी मुहावरा उपासना और निष्ठा में किसी का अनुसरण करना दर्शाता है। हिन्दी अभिव्यक्ति मूल रूपक को बनाए रखती है।
- source_word: הַבְּעָלִים
  choice: बाल देवताओं
  rationale: इब्रानी शब्द निश्चित बहुवचन में है। ‘बाल देवताओं’ से बहुवचन स्पष्ट रहता है और हिन्दी पाठक इसे सामान्य शब्द ‘बाल’ न समझे।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: याहवे
  alternative: प्रभु
  rationale: पाठ में व्यक्तिगत ईश्वरीय नाम है, केवल ‘प्रभु’ जैसी उपाधि नहीं; इसलिए नाम को लिप्यंतरित किया गया है।
- issue: הַבְּעָלִים का बहुवचन
  choice: बाल देवताओं
  alternative: बाल
  rationale: मूल का बहुवचन विभिन्न स्थानीय बाल-पूजा रूपों या अभिव्यक्तियों की ओर संकेत कर सकता है। इसे एकवचन कर देना पाठ की वास्तविक अस्पष्टता और संख्या को मिटा देता।
- issue: अहाब और उसके घराने का व्याकरणिक उत्तरदायित्व
  choice: त्यागने वाली क्रिया में बहुवचन, पीछे चलने वाली क्रिया में एकवचन
  alternative: दोनों क्रियाओं को सामान्य हिन्दी बहुवचन में समतल करना
  rationale: בַּעֲזָבְכֶם बहुवचन है, जबकि וַתֵּלֶךְ पुल्लिंग एकवचन है। अनुवाद में ‘तुम लोगों ने’ और फिर ‘तुम…चल पड़े हो’ द्वारा यह अंतर सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और मौखिक पठन के अनुकूल रखी गई है। ‘तुम्हारे पिता का घराना’ राजवंशीय-पारिवारिक अर्थ बचाता है। ‘बाल देवताओं’ सामान्य पाठक के लिए स्पष्ट है, जबकि पादटिप्पणी मूल बहुवचन का अधिक शाब्दिक रूप देती है।
