  text: And Elijah said to Ahab[a], “Go up, eat and drink, for there is the sound of the abundance of rain.”
translation:
  language: hi
  text: तब एलिय्याह ने अहाब से कहा, “ऊपर जा, खा और पी, क्योंकि भारी वर्षा का शोर सुनाई दे रहा है।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: तब ... ने कहा
  rationale: वाव-क्रमिक रूप कथा को आगे बढ़ाता है; आधुनिक हिन्दी कथन में ‘तब’ स्वाभाविक है।
- source_word: אֵלִיָּהוּ לְאַחְאָב
  choice: एलिय्याह ने अहाब से
  rationale: व्यक्तिनामों के प्रचलित हिन्दी बाइबलीय रूप रखे गए हैं और לְ को कथन के संबोधित व्यक्ति के रूप में ‘से’ किया गया है।
- source_word: עֲלֵה
  choice: ऊपर जा
  rationale: आज्ञार्थक क्रिया में ऊपर जाने का स्थानिक भाव स्पष्ट रूप से सुरक्षित रहता है।
- source_word: אֱכֹל וּשְׁתֵה
  choice: खा-पी
  rationale: दोनों आज्ञार्थक क्रियाओं का संक्षिप्त और स्वाभाविक हिन्दी रूप।
- source_word: כִּי
  choice: क्योंकि
  rationale: यह एलिय्याह की आज्ञा का कारण प्रस्तुत करता है।
- source_word: קוֹל הֲמוֹן הַגָּשֶׁם
  choice: भारी वर्षा की गड़गड़ाहट सुनाई दे रही है
  rationale: קוֹל ‘ध्वनि’ और הֲמוֹן ‘कोलाहल/गर्जन’ का बोध देते हैं; वर्षा के संदर्भ में ‘गड़गड़ाहट’ संक्षिप्त चित्रात्मक वाक्यांश को स्वाभाविक हिन्दी में व्यक्त करती है, जबकि ‘भारी वर्षा’ उसकी प्रबलता बताती है।
