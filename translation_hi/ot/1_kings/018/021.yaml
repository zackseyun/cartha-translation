source:
  edition: WLC
  text: וַ/יִּגַּ֨שׁ אֵלִיָּ֜הוּ אֶל כָּל הָ/עָ֗ם וַ/יֹּ֨אמֶר֙ עַד מָתַ֞י אַתֶּ֣ם פֹּסְחִים֮ עַל שְׁתֵּ֣י הַ/סְּעִפִּים֒ אִם יְהוָ֤ה הָֽ/אֱלֹהִים֙ לְכ֣וּ אַחֲרָ֔י/ו וְ/אִם הַ/בַּ֖עַל לְכ֣וּ אַחֲרָ֑י/ו וְ/לֹֽא עָנ֥וּ הָ/עָ֛ם אֹת֖/וֹ דָּבָֽר־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/021.yaml
  text: Then Elijah came near to all the people and said[a], “How long will you keep limping between two opinions? If Yahweh is God, follow him; but if Baal, follow him.” But the people did not answer him a word.
translation:
  language: hi
  text: तब एलियाह सब लोगों के पास आया और बोला, “तुम कब तक दो शाखाओं के बीच लँगड़ाते रहोगे?[a] यदि याहवे परमेश्वर है, तो उसके पीछे चलो; और यदि बाल है, तो उसके पीछे चलो।” पर लोगों ने उसे एक शब्द भी उत्तर नहीं दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “दो फाँकों पर लँगड़ाते रहोगे?” हिब्रू में शाब्दिक बिंब दो शाखाओं, फाँकों या विभाजित सिरों पर/बीच लँगड़ाने का है; इसका आशय दोहरी निष्ठा में डगमगाना है।
    reason: मूल रूपक तथा עַל और סְעִפִּים की शाब्दिक अनिश्चितता को दर्शाना।
lexical_decisions:
- source_word: וַיִּגַּשׁ
  choice: पास आया
  rationale: नגשׁ के निकट आने के भाव को सहज आधुनिक हिन्दी में व्यक्त करता है और सभा के सामने एलियाह के आगे बढ़ने को बनाए रखता है।
- source_word: כָּל הָעָם
  choice: सब लोगों
  rationale: सामूहिक अभिव्यक्ति की व्यापकता को सीधे और स्वाभाविक ढंग से रखता है।
- source_word: עַד מָתַי
  choice: कब तक
  rationale: समय-संबंधी चुनौती का स्वाभाविक हिन्दी समतुल्य है।
- source_word: פֹּסְחִים
  choice: लँगड़ाते रहोगे
  rationale: פסח के ठोस लँगड़ाने अथवा अस्थिर चाल के बिंब को केवल ‘डगमगाने’ जैसे अमूर्त अर्थ में बदलने के बजाय सुरक्षित रखता है।
- source_word: עַל שְׁתֵּי הַסְּעִפִּים
  choice: दो शाखाओं के बीच
  rationale: סְעִפִּים के शाखाओं, फाँकों या विभाजित सिरों वाले ठोस रूपक को रखता है; ‘के बीच’ हिन्दी पाठक के लिए विभाजित निष्ठा की स्थिति को बोधगम्य बनाता है, जबकि पादटिप्पणी शाब्दिक अनिश्चितता बताती है।
- source_word: אִם יְהוָה הָאֱלֹהִים
  choice: यदि याहवे परमेश्वर है
  rationale: प्रतिज्ञात्मक वाक्य की सीधी चुनौती और स्रोत में आए दिव्य नाम दोनों को सुरक्षित रखता है।
- source_word: לְכוּ אַחֲרָיו
  choice: उसके पीछे चलो
  rationale: ‘पीछे जाना’ के निष्ठा और अनुसरण-संबंधी मुहावरे को निकटता से तथा सहज हिन्दी में व्यक्त करता है।
- source_word: הַבַּעַל
  choice: बाल
  rationale: हिब्रू में निश्चित उपपद होने पर भी यहाँ देवता के प्रचलित नाम के रूप में हिन्दी में ‘बाल’ स्वाभाविक है।
- source_word: וְלֹא עָנוּ הָעָם אֹתוֹ דָּבָר
  choice: पर लोगों ने उत्तर में उससे एक शब्द भी नहीं कहा
  rationale: लोगों की पूर्ण चुप्पी पर हिब्रू के बल को ‘एक शब्द भी नहीं’ द्वारा बनाए रखता है; ‘पर’ प्रसंग के विरोधात्मक परिणाम को व्यक्त करता है।
theological_decisions:
- issue: दिव्य नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: प्रभु / यहोवा
  rationale: मूल पाठ में व्यक्तिगत वाचा-नाम सीधे आया है; उसका लिप्यंतरण नाम को सामान्य उपाधि में बदलने से बचाता है।
- issue: פֹּסְחִים עַל שְׁתֵּי הַסְּעִפִּים में विभाजित निष्ठा का रूपक
  choice: 'ठोस बिंब बनाए रखना: ‘दो शाखाओं के बीच लँगड़ाते’'
  alternative: दो विचारों के बीच डगमगाते
  rationale: अमूर्त अर्थ स्पष्ट कर देने के बजाय मूल के असामान्य और कुछ हद तक अस्पष्ट शारीरिक/शाखीय बिंब को सुरक्षित रखता है; पादटिप्पणी संभावित आशय स्पष्ट करती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। भविष्यसूचक चुनौती की तीक्ष्णता बनाए रखने के लिए ‘कब तक’ और दो बार ‘उसके पीछे चलो’ रखा गया है। असामान्य रूपक को मुख्य पाठ में सुरक्षित कर उसकी व्याख्या पादटिप्पणी में दी गई है।
