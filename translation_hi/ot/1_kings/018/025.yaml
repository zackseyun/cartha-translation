base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/025.yaml
  text: Then Elijah said to the prophets of Baal[a], “Choose one bull for yourselves and prepare it first, because you are many; then call on the name of your god[b], but put no fire under it.”
translation:
  language: hi
  text: तब एलिय्याह ने बाल के नबियों से कहा, “अपने लिए एक बैल चुन लो और पहले तुम ही उसे तैयार करो, क्योंकि तुम बहुत हो। फिर अपने देवता का नाम लेकर पुकारो,[a] पर आग मत लगाना।”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी मुहावरे का शाब्दिक निकट रूप है “अपने देवता का नाम लेकर पुकारो”; इसका अर्थ उस देवता को पुकारना या उससे विनती करना है।
    reason: lexical_alternative
  - marker: b
    text: या “आग मत रखना।” इब्रानी में यह स्पष्ट नहीं कहा गया कि आग उसके नीचे रखनी थी, यद्यपि बलि का सन्दर्भ यही संकेत देता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: तब ... कहा
  rationale: वाव-क्रमिक कथा को आगे बढ़ाता है; ‘तब’ आधुनिक हिन्दी में क्रमिकता को स्वाभाविक रूप से व्यक्त करता है।
- source_word: לִנְבִיאֵי הַבַּעַל
  choice: बाल के नबियों से
  rationale: सम्बन्धवाचक रचना को सीधे और प्रचलित ढंग से व्यक्त करता है।
- source_word: בַּחֲרוּ לָכֶם הַפָּר הָאֶחָד
  choice: अपने लिए एक बैल चुन लो
  rationale: सन्दर्भ में पहले बताए गए दो बैलों में से एक का चुनाव है; ‘अपने लिए’ לָכֶם को बनाए रखता है।
- source_word: וַעֲשׂוּ רִאשֹׁנָה
  choice: पहले तुम ही उसे तैयार करो
  rationale: बलि के सन्दर्भ में עשה पशु को चढ़ाने के लिए तैयार करने का बोध देता है; ‘पहले’ कार्य-क्रम को व्यक्त करता है और ‘तुम ही’ हिन्दी में बलाघात को स्वाभाविक बनाता है।
- source_word: כִּי אַתֶּם הָרַבִּים
  choice: क्योंकि तुम बहुत हो
  rationale: यह उनके पहले करने का कारण देता है और उनकी अधिक संख्या को सीधे व्यक्त करता है।
- source_word: וְקִרְאוּ בְּשֵׁם אֱלֹהֵיכֶם
  choice: फिर अपने देवता का नाम लेकर पुकारो
  rationale: קרא בשם का मुहावरा देवता को पुकारने या उससे विनती करने का अर्थ रखता है; ‘नाम लेकर’ स्रोत की अभिव्यक्ति को बनाए रखता है।
- source_word: וְאֵשׁ לֹא תָשִׂימוּ
  choice: पर आग मत लगाना
  rationale: इब्रानी में आग रखने का निषेध है; हिन्दी में यह बलि को स्वयं आग न देने का स्वाभाविक और स्पष्ट रूप है, जबकि जो बात स्पष्टतः नहीं कही गई उसे मुख्य पाठ में नहीं जोड़ा गया।
theological_decisions:
- issue: אֱלֹהֵיכֶם का बाल के लिए प्रयोग
  choice: अपने देवता
  alternative: अपने देवताओं
  rationale: निकट सन्दर्भ में संकेत एकवचन बाल की ओर है; इसलिए ‘देवता’ रूपगत बहुवचन से उत्पन्न भ्रामक अर्थ से बचते हुए सन्दर्भ को व्यक्त करता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; कथात्मक, गरिमापूर्ण और सामान्य पाठक के लिए सहज। आज्ञाओं में स्वाभाविक ‘लो/करो/पुकारो’ रूप रखा गया है। सभी पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित हैं।
