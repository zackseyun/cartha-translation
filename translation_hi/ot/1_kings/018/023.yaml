language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/יִתְּנוּ לָ֜/נוּ שְׁנַ֣יִם פָּרִ֗ים וְ/יִבְחֲר֣וּ לָ/הֶם֩ הַ/פָּ֨ר הָ/אֶחָ֜ד וִֽ/ינַתְּחֻ֗/הוּ וְ/יָשִׂ֨ימוּ֙ עַל הָ֣/עֵצִ֔ים וְ/אֵ֖שׁ לֹ֣א יָשִׂ֑ימוּ וַ/אֲנִ֞י אֶעֱשֶׂ֣ה אֶת הַ/פָּ֣ר הָ/אֶחָ֗ד וְ/נָֽתַתִּי֙ עַל הָ֣/עֵצִ֔ים וְ/אֵ֖שׁ לֹ֥א אָשִֽׂים־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/023.yaml
  text: Let them give us two bulls[a], and let them choose one bull for themselves, cut it into pieces, and place it on the wood, but put no fire under it. And I will prepare the other bull and place it on the wood, and I will put no fire under it.
translation:
  language: hi
  text: वे हमें दो बैल दें। वे अपने लिए एक बैल चुनें, उसे टुकड़ों में काटें और लकड़ियों पर रखें, पर आग न लगाएँ। मैं दूसरे बैल को तैयार करके लकड़ियों पर रखूँगा और आग नहीं लगाऊँगा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְיִתְּנוּ לָנוּ
  choice: वे हमें ... दें
  rationale: संयोजक सहित अपूर्ण क्रिया यहाँ प्रस्ताव या चुनौती का भाव देती है। ‘दें’ इसे स्वाभाविक और सीधे ढंग से व्यक्त करता है।
- source_word: שְׁנַיִם פָּרִים
  choice: दो बैल
  rationale: פַּר बलि के संदर्भ में गाय-बैल वर्ग के नर पशु को दर्शाता है; ‘बैल’ आधुनिक हिन्दी में स्पष्ट और पर्याप्त है।
- source_word: וְיִבְחֲרוּ לָהֶם הַפָּר הָאֶחָד
  choice: वे अपने लिए एक बैल चुनें
  rationale: בחר का अर्थ ‘चुनना’ है और לָהֶם से अपने पक्ष के लिए चुनने का भाव आता है। लेखयुक्त संख्या दो में से एक बैल की ओर संकेत करती है।
- source_word: וִינַתְּחֻהוּ
  choice: उसे टुकड़ों में काटें
  rationale: बलि की तैयारी में נתּח पशु को भागों में काटने का बोध देता है; यह अनुवाद न तो टुकड़ों की निश्चित संख्या जोड़ता है, न अत्यधिक तकनीकी भाषा अपनाता है।
- source_word: וְיָשִׂימוּ עַל־הָעֵצִים
  choice: लकड़ियों पर रखें
  rationale: שׂים का सामान्य अर्थ ‘रखना’ है; עֵצִים यहाँ ईंधन के लिए लगाई गई लकड़ियों को दर्शाता है।
- source_word: וְאֵשׁ לֹא יָשִׂימוּ
  choice: पर आग न लगाएँ
  rationale: शाब्दिक रचना ‘आग न रखें’ है, पर हिन्दी में इस संदर्भ में ‘आग न लगाएँ’ स्वाभाविक रूप से बताता है कि लकड़ियों या बलि को प्रज्वलित नहीं करना है, बिना ‘नीचे’ जैसा स्रोत में अनुपस्थित स्थान जोड़ने के।
- source_word: וַאֲנִי אֶעֱשֶׂה אֶת־הַפָּר הָאֶחָד
  choice: मैं दूसरे बैल को तैयार करके
  rationale: बलि-पशु के साथ עשה यहाँ उसकी तैयारी करने का अर्थ देता है। पहले बैल के उनके लिए चुने जाने के बाद הַפָּר הָאֶחָד शेष, अर्थात ‘दूसरे’, बैल को दर्शाता है।
- source_word: וְנָתַתִּי עַל־הָעֵצִים
  choice: लकड़ियों पर रखूँगा
  rationale: נתן यहाँ ‘रखना’ है और पूर्ववर्ती समान क्रिया के साथ स्वाभाविक समानांतरता बनाए रखता है।
- source_word: וְאֵשׁ לֹא אָשִׂים
  choice: और आग नहीं लगाऊँगा
  rationale: पहले निर्देश के समानांतर यह स्पष्ट करता है कि एलिय्याह भी आग नहीं जलाएगा; हिन्दी मुहावरे में ‘आग लगाना’ स्वाभाविक है।
theological_decisions:
- issue: बलि की तैयारी के वर्णन में अनावश्यक धार्मिक-तकनीकी अर्थ जोड़ना
  choice: ठोस क्रियाओं के लिए साधारण भाषा—‘टुकड़ों में काटें,’ ‘लकड़ियों पर रखें,’ ‘आग न लगाएँ’
  alternative: पूरे वाक्य में ‘बलि चढ़ाएँ’ या अन्य अधिक तकनीकी उपासना-संबंधी शब्दावली
  rationale: पद मुख्यतः कर्मेल पर्वत की परीक्षा की व्यावहारिक तैयारी बताता है। साधारण क्रियात्मक भाषा मूल पाठ की बात को सुरक्षित रखती है और बाद की धर्मवैज्ञानिक धारणाएँ नहीं जोड़ती।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और मौखिक चुनौती के रूप में स्वाभाविक। हिब्रू की क्रमिक निर्देश-शैली को छोटे वाक्यों और समानांतर क्रियाओं से रखा गया है। कोई पादटिप्पणी आवश्यक नहीं मानी गई, क्योंकि ‘आग न लगाएँ’ स्रोत के आशय को बिना अतिरिक्त स्थान-सूचक शब्द जोड़े स्वाभाविक हिन्दी में व्यक्त करता है।
