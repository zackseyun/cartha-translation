base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/038.yaml
  text: Then the fire of Yahweh fell and consumed the burnt offering[a], the wood, the stones, the dust, and licked up the water that was in the trench.
translation:
  language: hi
  text: तब यहोवा की आग गिरी और उसने होमबलि[a], लकड़ियों, पत्थरों और धूल को भस्म कर दिया; और खाई में जो पानी था, उसे चाट लिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “यहोवा की ओर से आग।” इब्रानी पदबंध आग के दिव्य स्रोत पर बल देता हुआ भी समझा जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵשׁ יְהוָה
  choice: यहोवा की आग
  rationale: इब्रानी पदबंध आग को यहोवा से प्रत्यक्ष रूप से संबद्ध करता है; यह रूप दिव्य कर्तृत्व और नाटकीयता को बनाए रखता है।
- source_word: וַתִּפֹּל
  choice: गिरी
  rationale: נפל का मूल अर्थ ‘गिरना’ है; आग के ऊपर से गिरने की इब्रानी छवि को सीधे सुरक्षित रखा गया है।
- source_word: וַתֹּאכַל
  choice: भस्म कर दिया
  rationale: क्रिया का शाब्दिक अर्थ ‘खा लिया’ है, किंतु आग के संदर्भ में ‘भस्म कर दिया’ स्वाभाविक और अर्थ-सटीक हिन्दी है।
- source_word: הָעֹלָה
  choice: होमबलि
  rationale: बलिदानी संदर्भ में עלה उस बलि को दर्शाता है जो पूरी तरह वेदी पर जलाई जाती थी; ‘होमबलि’ प्रचलित और संक्षिप्त हिन्दी पद है।
- source_word: הָעֵצִים
  choice: लकड़ियों
  rationale: बहुवचन रूप और वेदी पर रखी लकड़ियों का ठोस संदर्भ हिन्दी में स्पष्ट रहता है।
- source_word: הָאֲבָנִים
  choice: पत्थरों
  rationale: सीधा शाब्दिक अनुवाद; आग द्वारा पत्थरों तक को भस्म करना घटना की असाधारण तीव्रता दिखाता है।
- source_word: הֶעָפָר
  choice: मिट्टी
  rationale: עפר धूल या ढीली मिट्टी को सूचित कर सकता है; वेदी और खाई के प्रसंग में ‘मिट्टी’ आधुनिक हिन्दी में अधिक स्वाभाविक है।
- source_word: לִחֵכָה
  choice: चाट लिया
  rationale: לחך की सजीव ‘चाटने’ की छवि को सुरक्षित रखा गया है; पानी के पूरी तरह समाप्त होने का भाव प्रसंग से स्पष्ट है।
- source_word: הַמַּיִם אֲשֶׁר בַּתְּעָלָה
  choice: खाई में जो पानी था
  rationale: תעלה वेदी के चारों ओर खोदी गई खाई या नाली है; इस कथा-प्रसंग में ‘खाई’ स्पष्ट और ठोस है।
- source_word: וַ
  choice: तब
  rationale: वाव-क्रम कथा को आगे बढ़ाता है; आधुनिक हिन्दी में ‘तब’ घटनाक्रम को स्वाभाविक रूप से व्यक्त करता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ में वाचा का निजी ईश्वरीय नाम प्रत्यक्ष है। ‘यहोवा’ हिन्दी बाइबलीय प्रयोग में व्यापक रूप से पहचाना जाता है और इसे सामान्य उपाधि ‘प्रभु’ से अलग रखता है।
- issue: אֵשׁ יְהוָה में संबंध या स्रोत
  choice: यहोवा की आग
  alternative: यहोवा की ओर से आग
  rationale: इब्रानी पदबंध संबंध और दिव्य स्रोत दोनों का संकेत दे सकता है। मुख्य पाठ निकट संरचना को बनाए रखता है और पाद-टिप्पणी स्रोत-प्रधान अर्थ की वास्तविक संभावना बताती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, कथात्मक और सहज शैली अपनाई गई है। ‘भस्म कर दिया’ आग के संदर्भ में स्वाभाविक है, जबकि ‘चाट लिया’ मूल की सजीव रूपकात्मक छवि को बनाए रखता है।
