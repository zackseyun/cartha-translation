  edition: WLC
  text: וַ/יֹּ֨אמֶר֙ אֵֽלִיָּ֔הוּ חַ֚י יְהוָ֣ה צְבָא֔וֹת אֲשֶׁ֥ר עָמַ֖דְתִּי לְ/פָנָ֑י/ו כִּ֥י הַ/יּ֖וֹם אֵרָאֶ֥ה אֵלָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/015.yaml
  text: And Elijah said[a], “As Yahweh of hosts lives, before whom I stand, today I will surely present myself to him.”
translation:
  language: hi
  text: एलिय्याह ने कहा, “सेनाओं के याहवे के जीवन की शपथ, जिसके सामने मैं खड़ा हूँ—आज मैं निश्चय ही उसके सामने उपस्थित होऊँगा[a]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “मैं उसे दिखाई दूँगा” अथवा “मैं अपने आपको उसके सामने प्रकट करूँगा।” इब्रानी क्रिया का अर्थ दिखाई देना या स्वयं को किसी के सामने प्रस्तुत करना हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: חַי יְהוָה
  choice: याहवे के जीवन की शपथ
  rationale: यह इब्रानी की प्रचलित शपथ-विधि है। यह अनुवाद उसके शाब्दिक आधार और गंभीर प्रतिज्ञात्मक बल, दोनों को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: चतुर्वर्णीय ईश्वरीय नाम को किसी उपाधि से बदलने के बजाय व्यक्तिगत नाम के रूप में लिप्यंतरित किया गया है।
- source_word: צְבָאוֹת
  choice: सेनाओं के
  rationale: यह बहुवचन संज्ञा सैन्य दलों अथवा विशाल समूहों का बोध कराती है। दिव्य उपाधि में निहित व्यापकता को बनाए रखने के लिए इसे केवल किसी एक प्रकार की सेना तक सीमित नहीं किया गया।
- source_word: אֲשֶׁר עָמַדְתִּי לְפָנָיו
  choice: जिसके सामने मैं खड़ा हूँ
  rationale: यह निकट उपस्थिति, सेवा और अधिकार के सामने तत्पर रहने का भाव रखने वाली दरबारी-भविष्यद्वक्ताई अभिव्यक्ति है। मूल बिंब को बिना अधिक व्याख्या के सुरक्षित रखा गया है।
- source_word: כִּי הַיּוֹם
  choice: आज
  rationale: כִּי यहाँ शपथ में दिए गए आश्वासन की विषय-वस्तु आरम्भ करता है। शपथ-विधि और ‘निश्चय ही’ मिलकर उसके दृढ़ आश्वासन को व्यक्त करते हैं।
- source_word: אֵרָאֶה אֵלָיו
  choice: मैं निश्चय ही उसके सामने उपस्थित होऊँगा
  rationale: ראה के निफ़अल रूप का अर्थ यहाँ ‘दिखाई देना’, ‘सामने आना’ अथवा जानबूझकर स्वयं को किसी के सामने प्रस्तुत करना हो सकता है। चुना हुआ अनुवाद एलिय्याह के अहाब के सामने आने के निश्चय को सहज हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में व्यक्तिगत ईश्वरीय नाम है। उसे उपाधि ‘प्रभु’ से बदलने के बजाय ‘याहवे’ के रूप में लिप्यंतरित करने से उसका नामात्मक स्वरूप सुरक्षित रहता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गंभीर, सार्वजनिक शपथ का स्वर रखा गया है। ‘जिसके सामने मैं खड़ा हूँ’ मूल की दरबारी छवि को बनाए रखता है, जबकि ‘उपस्थित होऊँगा’ सामान्य पाठक के लिए स्वाभाविक है।
