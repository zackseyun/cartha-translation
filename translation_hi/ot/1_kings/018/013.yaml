  text: הֲ/לֹֽא הֻגַּ֤ד לַֽ/אדֹנִ/י֙ אֵ֣ת אֲשֶׁר עָשִׂ֔יתִי בַּ/הֲרֹ֣ג אִיזֶ֔בֶל אֵ֖ת נְבִיאֵ֣י יְהוָ֑ה וָ/אַחְבִּא֩ מִ/נְּבִיאֵ֨י יְהוָ֜ה מֵ֣אָה אִ֗ישׁ חֲמִשִּׁ֨ים חֲמִשִּׁ֥ים אִישׁ֙ בַּ/מְּעָרָ֔ה וָ/אֲכַלְכְּלֵ֖/ם לֶ֥חֶם וָ/מָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/013.yaml
  text: Has it not been told to my lord what I did when Jezebel was killing the prophets of Yahweh—how I hid a hundred of the prophets of Yahweh[a], fifty men in each cave, and provided them with bread and water?
translation:
  language: hi
  text: क्या मेरे स्वामी को यह नहीं बताया गया कि जब ईज़ेबेल याहवे के भविष्यद्वक्ताओं को मार रही थी, तब मैंने क्या किया था—कि मैंने याहवे के भविष्यद्वक्ताओं में से सौ पुरुषों को, पचास-पचास पुरुषों को एक गुफा में[a] छिपाया और उन्हें रोटी और पानी देकर उनका पालन-पोषण किया?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “हर गुफा में पचास पुरुष” अथवा “गुफाओं में पचास-पचास के दो दलों में।” हिब्रू में पचास-पचास के वितरण का भाव है, जबकि “गुफा” एकवचन में है।
    reason: हिब्रू की वितरणात्मक संख्या और एकवचन ‘गुफा’ के कारण उत्पन्न वास्तविक व्याकरणिक अस्पष्टता को सुरक्षित रखना।
lexical_decisions:
- source_word: הֲלֹא הֻגַּד לַאדֹנִי
  choice: क्या मेरे स्वामी को यह नहीं बताया गया
  rationale: नकारात्मक प्रश्न सकारात्मक उत्तर की अपेक्षा करता है। कर्मवाच्य और एलिय्याह के प्रति आदरसूचक संबोधन दोनों सुरक्षित रखे गए हैं।
- source_word: בַּהֲרֹג אִיזֶבֶל
  choice: जब ईज़ेबेल ... को मार रही थी
  rationale: पूर्वसर्गयुक्त infinitive construct यहाँ कालवाचक परिस्थिति बताता है; अपूर्णतामूलक हिंदी क्रिया चल रही हत्या को स्वाभाविक ढंग से व्यक्त करती है।
- source_word: נְבִיאֵי יְהוָה
  choice: यहोवा के भविष्यद्वक्ता
  rationale: व्यक्तिवाचक वाचा-नाम יְהוָה को ‘यहोवा’ से और construct संबंध को ‘के’ से स्पष्ट किया गया है।
- source_word: מִנְּבִיאֵי יְהוָה מֵאָה אִישׁ
  choice: यहोवा के भविष्यद्वक्ताओं में से सौ पुरुषों को
  rationale: מִן का अंशवाचक भाव और אִישׁ का स्पष्ट उल्लेख दोनों बनाए रखे गए हैं।
- source_word: חֲמִשִּׁים חֲמִשִּׁים אִישׁ בַּמְּעָרָה
  choice: पचास-पचास करके गुफा में
  rationale: संख्या की पुनरावृत्ति समूहों में वितरण दर्शाती है। हिब्रू में ‘गुफा’ एकवचन है, इसलिए मुख्य पाठ उसका रूप बनाए रखता है और संभावित अर्थ-विस्तार पादटिप्पणी में दिया गया है।
- source_word: וָאֲכַלְכְּלֵם לֶחֶם וָמָיִם
  choice: उन्हें रोटी और पानी देकर उनका पालन-पोषण किया
  rationale: כלכל का अर्थ निर्वाह करना या आवश्यक वस्तुएँ देकर बनाए रखना है; ‘रोटी और पानी’ ठोस साधनों को यथावत रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ के व्यक्तिवाचक वाचा-नाम को उपाधि में बदलने के बजाय हिंदी में व्यापक रूप से पहचाने जाने वाले लिप्यंतरण ‘यहोवा’ से प्रस्तुत किया गया है।
- issue: अदֹני का संदर्भ
  choice: मेरे स्वामी
  alternative: मेरे प्रभु
  rationale: यहाँ संबोधन एलिय्याह के लिए मानवीय आदरसूचक है, ईश्वरीय उपाधि नहीं; ‘स्वामी’ इस भेद को अधिक स्पष्ट रखता है।
translation_notes:
  register: आधुनिक मानक हिंदी, आदरपूर्ण और कथात्मक शैली। ‘भविष्यद्वक्ता’, ‘स्वामी’ और ‘पालन-पोषण’ जैसे परिचित बाइबलीय शब्द रखे गए हैं; वाक्य को मूल के आलंकारिक प्रश्न और क्रमिक आत्मपक्ष-समर्थन के अनुरूप बनाया गया है।
