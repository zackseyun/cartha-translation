  text: And he said to him[a], “I am he. Go, say to your master, ‘Look, Elijah is here.’”
translation:
  language: hi
  text: उसने उससे कहा, “मैं ही हूँ।[a] जा, अपने स्वामी से कह, ‘देखिए, एलिय्याह यहाँ है।’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मैं हूँ।” इब्रानी में केवल बलसूचक सर्वनाम “मैं” है, जो यहाँ अपनी पहचान बताने का काम करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר לוֹ
  choice: उसने उससे कहा
  rationale: यह वाक्यांश कथानक की अगली क्रिया और कथन के अप्रत्यक्ष कर्म—दोनों को सीधी, स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: אָנִי
  choice: मैं ही हूँ
  rationale: स्वतंत्र सर्वनाम यहाँ पहचान की पुष्टि पर बल देता है। ‘ही’ उस बल को स्वाभाविक हिन्दी में बनाए रखता है, जबकि ‘हूँ’ पहचानसूचक कथन को पूरा करता है।
- source_word: לֵךְ אֱמֹר
  choice: जा, ... कह
  rationale: दोनों पुल्लिंग एकवचन आज्ञार्थक क्रियाओं को संक्षिप्त और प्रत्यक्ष रूप में रखा गया है। प्रसंग में एलिय्याह का ओबद्याह से सीधा संबोधन है।
- source_word: לַאדֹנֶיךָ
  choice: अपने स्वामी से
  rationale: यहाँ אָדוֹן परमेश्वर के लिए नहीं, बल्कि ओबद्याह के सांसारिक अधिकारी अहाब के लिए है। ‘स्वामी’ संबंध को स्पष्ट रखता है और दिव्य उपाधि ‘प्रभु’ से भ्रम नहीं होने देता।
- source_word: הִנֵּה
  choice: देखिए
  rationale: यह ध्यान खींचने वाला संकेतक अव्यय है। ‘देखिए’ आधुनिक हिन्दी में उसके प्रस्तुतिकरण और ध्यानाकर्षण के भाव को व्यक्त करता है।
- source_word: אֵלִיָּהוּ
  choice: एलिय्याह
  rationale: व्यक्तिवाचक नाम को प्रचलित हिन्दी बाइबलीय लिप्यंतरण में रखा गया है।
theological_decisions:
- issue: मानवीय अधिकारी के लिए אָדוֹן का अनुवाद
  choice: स्वामी
  alternative: प्रभु
  rationale: संदर्भ में यह उपाधि राजा अहाब के लिए है; ‘स्वामी’ मानवीय अधिकार-संबंध को व्यक्त करता है और परमेश्वर के लिए प्रयुक्त ‘प्रभु’ से आवश्यक भेद बनाए रखता है।
- issue: אָנִי में निहित पहचानसूचक बल
  choice: मैं ही हूँ
  alternative: मैं हूँ
  rationale: इब्रानी का स्वतंत्र सर्वनाम प्रसंग में एलिय्याह की पहचान की बलपूर्वक पुष्टि करता है। हिन्दी का ‘ही’ इस बल को सुरक्षित रखता है, बिना कोई अतिरिक्त धर्मवैज्ञानिक अर्थ जोड़े।
translation_notes:
  register: भाषा आधुनिक, संक्षिप्त और गरिमापूर्ण रखी गई है। एलिय्याह से ओबद्याह की ओर एकवचन आज्ञार्थक रूप ‘जा’ और ‘कह’ मूल की व्याकरणिक प्रत्यक्षता को बनाए रखते हैं; अहाब को सुनाया जाने वाला संदेश सम्मानसूचक ‘देखिए’ के साथ स्वाभाविक हिन्दी में दिया गया है।
