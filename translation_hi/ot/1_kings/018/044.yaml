  text: וַֽ/יְהִי֙ בַּ/שְּׁבִעִ֔ית וַ/יֹּ֗אמֶר הִנֵּה עָ֛ב קְטַנָּ֥ה כְּ/כַף אִ֖ישׁ עֹלָ֣ה מִ/יָּ֑ם וַ/יֹּ֗אמֶר עֲלֵ֨ה אֱמֹ֤ר אֶל אַחְאָב֙ אֱסֹ֣ר וָ/רֵ֔ד וְ/לֹ֥א יַעַצָרְ/כָ֖ה הַ/גָּֽשֶׁם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/044.yaml
  text: And it happened on the seventh time that he said[a], “Look, a small cloud, like a man’s palm, is rising from the sea.” Then he said, “Go up, say to Ahab, ‘Harness your chariot and go down[c][b], so that the rain does not stop you.’”
translation:
  language: hi
  text: सातवीं बार ऐसा हुआ कि उसने कहा, “देखिए, समुद्र से एक छोटा-सा बादल उठ रहा है, जो आदमी की हथेली जैसा है[a]।” तब एलिय्याह ने कहा, “ऊपर जाकर अहाब से कहो, ‘अपना रथ जुतवाकर[b] नीचे चले जाओ, कहीं ऐसा न हो कि वर्षा तुम्हें रोक दे[c]।’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “आदमी के हाथ की हथेली जैसा।”
    reason: lexical_alternative
  - marker: b
    text: “रथ जुतवाने” का अर्थ घोड़ों को रथ में जोतकर उसे यात्रा के लिए तैयार करना है।
    reason: cultural_note
  - marker: c
    text: या, “वर्षा तुम्हें अटका न दे।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בַּשְּׁבִעִית
  choice: सातवीं बार ऐसा हुआ
  rationale: यह कथात्मक अभिव्यक्ति सेवक के बार-बार जाकर देखने के क्रम में सातवें अवसर को बताती है; ‘बार’ संदर्भ को स्वाभाविक हिन्दी में स्पष्ट करता है।
- source_word: הִנֵּה
  choice: देखिए
  rationale: यह सामने दिखाई दे रही बात की ओर तुरंत ध्यान खींचने वाला शब्द है; आदरसूचक रूप संवाद के संदर्भ में स्वाभाविक है।
- source_word: עָב קְטַנָּה
  choice: एक छोटा-सा बादल
  rationale: मूल संज्ञा और विशेषण का सीधा, सहज तथा दृश्यात्मक अनुवाद।
- source_word: כְּכַף אִישׁ
  choice: आदमी की हथेली जैसा
  rationale: כַּף सामान्यतः हथेली को दर्शाता है। ‘जैसा’ मूल उपमा को बनाए रखता है और आकार तथा आकृति के बीच संभावित सूक्ष्म अस्पष्टता को अनावश्यक रूप से नहीं सुलझाता।
- source_word: עֹלָה מִיָּם
  choice: समुद्र से ... उठ रहा है
  rationale: वर्तमान कृदंत चल रही दृश्य क्रिया बताता है; यह बादल के समुद्र की दिशा से ऊपर आने को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: עֲלֵה
  choice: ऊपर जाकर
  rationale: आज्ञार्थक क्रिया की दिशात्मक बारीकी बनाए रखी गई है।
- source_word: אֱסֹר
  choice: अपना रथ जुतवाकर
  rationale: क्रिया का मूल अर्थ बाँधना या जोतना है और यहाँ यात्रा के लिए रथ तथा उसके घोड़ों को तैयार करने का आशय है; हिन्दी में ‘रथ जुतवाना’ ठोस और संदर्भानुकूल है।
- source_word: וָרֵד
  choice: नीचे चले जाओ
  rationale: कर्मेल से नीचे जाने की दिशात्मक और भौगोलिक बारीकी को सहज हिन्दी में सुरक्षित रखता है।
- source_word: וְלֹא יַעַצָרְכָה הַגָּשֶׁם
  choice: कहीं ऐसा न हो कि वर्षा तुम्हें रोक दे
  rationale: यह चेतावनी और आशंका का भाव व्यक्त करता है; עצר के रोकने, अटका देने या आगे बढ़ने से बाधित करने के अर्थ को बनाए रखता है।
