translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, सहज किंतु गरिमापूर्ण रखी गई है। कथात्मक प्रवाह के लिए ‘ऐसा हुआ’ और संवाद में स्वाभाविक आज्ञार्थक रूप प्रयुक्त हैं। ‘एलिय्याह’ को दूसरे अस्पष्ट ‘उसने कहा’ के स्थान पर स्पष्ट किया गया है, क्योंकि संदर्भ में वक्ता बदलता है; इससे कोई नई व्याख्यात्मक धारणा नहीं जुड़ती।
