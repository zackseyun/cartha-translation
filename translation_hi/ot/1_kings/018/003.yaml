base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/003.yaml
  text: And Ahab called Obadiah[a], who was over the household. Now Obadiah feared Yahweh greatly.
translation:
  language: hi
  text: अहाब ने ओबद्याह को बुलाया, जो राजघराने का प्रधान अधिकारी था।[a] ओबद्याह याहवे का बहुत भय मानता था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक अर्थ, “जो घर के ऊपर था।” यह राजघराने के प्रधान अधिकारी के लिए प्रयुक्त पद था।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא ... אֶל
  choice: को बुलाया
  rationale: यह प्रयोग किसी को अपने पास बुलाने का भाव देता है। ‘बुलाया’ सहज हिन्दी है और ‘तलब किया’ की अपेक्षा राजकीय अधिकार का अतिरिक्त कठोर भाव नहीं जोड़ता।
- source_word: עֹבַדְיָהוּ
  choice: ओबद्याह
  rationale: व्यक्तिवाचक नाम का प्रचलित हिन्दी लिप्यंतरण।
- source_word: אֲשֶׁר עַל הַבָּיִת
  choice: जो राजघराने का प्रबंधक था
  rationale: शाब्दिक रूप से ‘जो घर के ऊपर था’; राजदरबार के संदर्भ में यह राजकीय घराने या महल की व्यवस्था के प्रधान अधिकारी का पद सूचित करता है।
- source_word: הָיָה יָרֵא אֶת יְהוָה
  choice: यहोवा का ... भय मानता था
  rationale: यह स्थायी चारित्रिक अवस्था और श्रद्धापूर्ण भय व्यक्त करता है। ‘भय मानना’ हिन्दी बाइबलीय प्रयोग में अर्थ की धार्मिक गंभीरता बनाए रखता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिन्दी में परमेश्वर के व्यक्तिवाचक वाचा-नाम का स्थापित रूप; इसे केवल उपाधि ‘प्रभु’ से प्रतिस्थापित नहीं किया गया।
- source_word: מְאֹד
  choice: बहुत
  rationale: तीव्रता को स्वाभाविक आधुनिक हिन्दी में स्पष्ट करता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ में चार अक्षरों वाला व्यक्तिवाचक ईश्वरीय नाम है। हिन्दी पाठकों के लिए सुस्थापित ‘यहोवा’ रखा गया है; ‘याहवे’ अधिक प्रत्यक्ष शैक्षिक लिप्यंतरण है।
- issue: יָרֵא का धार्मिक आशय
  choice: भय मानता था
  alternative: श्रद्धा रखता था
  rationale: ‘भय’ मूल शब्द की तीव्रता और धर्मवैज्ञानिक तनाव को सुरक्षित रखता है; केवल ‘श्रद्धा’ कहना उसके भय-संबंधी अर्थ को नरम कर देता।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘राजघराने का प्रबंधक’ पद के प्रशासनिक अर्थ को साधारण पाठक के लिए स्पष्ट करता है, जबकि पादटिप्पणी मूल इब्रानी अभिव्यक्ति सुरक्षित रखती है।
