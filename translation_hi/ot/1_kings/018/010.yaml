source:
  edition: WLC
  text: חַ֣י יְהוָ֣ה אֱלֹהֶ֗י/ךָ אִם יֶשׁ גּ֤וֹי וּ/מַמְלָכָה֙ אֲ֠שֶׁר לֹֽא שָׁלַ֨ח אֲדֹנִ֥/י שָׁם֙ לְ/בַקֶּשְׁ/ךָ֔ וְ/אָמְר֖וּ אָ֑יִן וְ/הִשְׁבִּ֤יעַ אֶת הַ/מַּמְלָכָה֙ וְ/אֶת הַ/גּ֔וֹי כִּ֖י לֹ֥א יִמְצָאֶֽ/כָּה׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/010.yaml
  text: As Yahweh your God lives, there is no nation or kingdom where my lord has not sent to seek you. When they said, ‘He is not here,’ he made the kingdom and the nation swear that they could not find you.
translation:
  language: hi
  text: तेरे परमेश्वर याहवे के जीवन की शपथ, ऐसा कोई राष्ट्र या राज्य नहीं है जहाँ मेरे स्वामी ने तुझे ढूँढ़ने के लिए न भेजा हो। और जब उन्होंने कहा, ‘वह यहाँ नहीं है,’ तब उसने हर राज्य और राष्ट्र को यह शपथ दिलाई कि वे तुझे नहीं पा सके।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חַי יְהוָה אֱלֹהֶיךָ
  choice: तेरे परमेश्वर यहोवा के जीवन की शपथ
  rationale: यह इब्रानी शपथ-सूत्र परमेश्वर के जीवित होने को साक्षी बनाता है। यह हिन्दी में उसके गंभीर और शपथात्मक बल को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिन्दी में प्रचलित लिप्यंतरण द्वारा चतुरक्षरीय व्यक्तिगत नाम को उपाधि से अलग रखा गया है।
- source_word: אִם יֶשׁ גּוֹי וּמַמְלָכָה אֲשֶׁר לֹא
  choice: ऐसा कोई राष्ट्र या राज्य नहीं है जहाँ ... न
  rationale: शपथ के संदर्भ में אִם केवल साधारण शर्त नहीं, बल्कि प्रबल निषेधात्मक कथन का भाग है; हिन्दी में यह रचना उसी आशय को स्पष्ट करती है।
- source_word: גּוֹי וּמַמְלָכָה
  choice: राष्ट्र या राज्य
  rationale: दोनों राजनीतिक शब्दों का भेद बनाए रखते हुए आधुनिक और समझने योग्य हिन्दी दी गई है।
- source_word: שָׁלַח ... לְבַקֶּשְׁךָ
  choice: तुझे ढूँढ़ने के लिए न भेजा हो
  rationale: मूल के ‘भेजना’ और ‘ढूँढ़ना’ दोनों क्रियात्मक तत्व सुरक्षित हैं; भेजे गए व्यक्तियों को अनावश्यक रूप से स्पष्ट नहीं किया गया।
- source_word: אֲדֹנִי
  choice: मेरे स्वामी
  rationale: यहाँ संबोधन राजा अहाब के लिए आदरसूचक है, परमेश्वर के लिए नहीं।
- source_word: וְאָמְרוּ אָיִן
  choice: जब उन्होंने कहा, ‘वह यहाँ नहीं है,’
  rationale: אָיִן का संदर्भगत अर्थ एलिय्याह की अनुपस्थिति है; ‘वह’ निहित कर्ता को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וְהִשְׁבִּיעַ
  choice: उसने ... से यह शपथ खिलाई
  rationale: हिफ़ील रूप का कारक अर्थ, अर्थात किसी को शपथ दिलाना, हिन्दी मुहावरे में सुरक्षित है।
- source_word: כִּי לֹא יִמְצָאֶךָ
  choice: कि वे तुझे नहीं पा सके
  rationale: כִּי शपथ की विषय-वस्तु प्रस्तुत करता है और अपूर्ण क्रिया यहाँ बीती खोज के निष्फल परिणाम को सूचित करती है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: व्यक्तिगत ईश्वरीय नाम को ‘प्रभु’ जैसी उपाधि से प्रतिस्थापित नहीं किया गया; हिन्दी पाठकों में परिचित रूप ‘यहोवा’ चुना गया है।
- issue: शपथ-सूत्र חַי־יְהוָה की शक्ति
  choice: के जीवन की शपथ
  alternative: जैसा कि यहोवा जीवित है
  rationale: दोनों मूल भाव को वहन करते हैं, पर चुना गया रूप आधुनिक हिन्दी में स्पष्टतः शपथ का संकेत देता है और कथन की गंभीरता बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, कथात्मक शैली रखी गई है। संदर्भ के अनुरूप एकवचन निकट संबोधन ‘तू/तेरे/तुझे’ और राजकीय आदरसूचक ‘मेरे स्वामी’ प्रयुक्त हुए हैं।
