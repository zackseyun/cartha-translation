id: 1KI.18.17
reference: 1 Kings 18:17
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יְהִ֛י כִּ/רְא֥וֹת אַחְאָ֖ב אֶת אֵלִיָּ֑הוּ וַ/יֹּ֤אמֶר אַחְאָב֙ אֵלָ֔י/ו הַ/אַתָּ֥ה זֶ֖ה עֹכֵ֥ר יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/017.yaml
  text: And when Ahab saw Elijah[a], Ahab said to him, “Is that you, troubler of Israel?”
translation:
  language: hi
  text: जब अहाब ने एलिय्याह को देखा, तो उसने उससे कहा, “क्या तू ही है, इस्राएल पर विपत्ति लानेवाला[a]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “इस्राएल को संकट में डालनेवाला” या “इस्राएल पर विनाश लानेवाला।”
    reason: עֹכֵר के अर्थ-क्षेत्र में संकट, उपद्रव और विपत्ति/विनाश लाना सम्मिलित है; विकल्प मूल की तीव्रता और संभावित अर्थभेद दिखाते हैं।
lexical_decisions:
- source_word: וַיְהִי כִּרְאוֹת
  choice: जब ... ने ... देखा
  rationale: वाव-क्रमिक कथा को आगे बढ़ाता है और כ के साथ infinitive construct समयसूचक परिस्थिति व्यक्त करता है; आधुनिक हिन्दी में ‘जब’ स्वाभाविक और अर्थनिष्ठ है।
- source_word: אַחְאָב
  choice: अहाब
  rationale: व्यक्तिनाम का हिन्दी बाइबलीय परंपरा के अनुरूप लिप्यंतरण।
- source_word: אֵלִיָּהוּ
  choice: एलिय्याह
  rationale: व्यक्तिनाम का प्रचलित हिन्दी बाइबलीय रूप।
- source_word: וַיֹּאמֶר ... אֵלָיו
  choice: तो उसने उससे कहा
  rationale: कथात्मक क्रिया और अप्रत्यक्ष कर्म को स्वाभाविक हिन्दी में व्यक्त करता है; सर्वनाम अनावश्यक पुनरावृत्ति से बचाता है।
- source_word: הַאַתָּה זֶה
  choice: क्या तू ही है
  rationale: प्रश्नवाचक, स्वतंत्र सर्वनाम और संकेतवाचक का जोरदार तथा टकरावपूर्ण भाव सुरक्षित रहता है। ‘तू’ अहाब के आरोपपूर्ण संबोधन के अनुकूल है।
- source_word: עֹכֵר יִשְׂרָאֵל
  choice: इस्राएल पर विपत्ति लानेवाला
  rationale: עכר का कृदंत उस व्यक्ति को बताता है जो संकट, उपद्रव या विपत्ति लाता है। यह हिन्दी में आरोप की तीव्रता और क्रियात्मक अर्थ दोनों को स्पष्ट रखता है।
theological_decisions:
- issue: अहाब के आरोप का स्वर और धार्मिक तनाव
  choice: इस्राएल पर विपत्ति लानेवाला
  alternative: इस्राएल को संकट में डालनेवाला; इस्राएल का उपद्रवी
  rationale: पाठ में अहाब इस्राएल की दुर्दशा का दोष एलिय्याह पर लगाता है। अनुवाद आरोप को अहाब के कथन के रूप में सुरक्षित रखता है, उसे सत्य ठहराए बिना और आगे के उत्तर से पहले तनाव का समाधान किए बिना।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘तू’ यहाँ अनौपचारिक निकटता नहीं, बल्कि राजा के सीधे और आरोपपूर्ण संबोधन को व्यक्त करता है।
