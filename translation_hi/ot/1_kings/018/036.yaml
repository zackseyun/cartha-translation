  text: וַ/יְהִ֣י בַּ/עֲל֣וֹת הַ/מִּנְחָ֗ה וַ/יִּגַּ֞שׁ אֵלִיָּ֣הוּ הַ/נָּבִיא֮ וַ/יֹּאמַר֒ יְהוָ֗ה אֱלֹהֵי֙ אַבְרָהָם֙ יִצְחָ֣ק וְ/יִשְׂרָאֵ֔ל הַ/יּ֣וֹם יִוָּדַ֗ע כִּֽי אַתָּ֧ה אֱלֹהִ֛ים בְּ/יִשְׂרָאֵ֖ל וַ/אֲנִ֣י עַבְדֶּ֑/ךָ ו/ב/דברי/ך עָשִׂ֔יתִי אֵ֥ת כָּל הַ/דְּבָרִ֖ים הָ/אֵֽלֶּה׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/036.yaml
  text: And it happened[a], at the offering up of the grain offering, that Elijah the prophet came near and said, “O Yahweh, God of Abraham, Isaac, and Israel, let it be known today that you are God in Israel, and that I am your servant[b], and that by your word I have done all these things.”
translation:
  language: hi
  text: ऐसा हुआ कि अन्न-भेंट चढ़ाने के समय एलियाह नबी पास आया और उसने कहा, “हे याहवे, अब्राहम, इसहाक और इस्राएल[a] के परमेश्वर, आज यह प्रकट हो जाए कि इस्राएल में आप ही परमेश्वर हैं, कि मैं आपका सेवक हूँ, और कि मैंने ये सब काम आपके वचन के अनुसार[b] किए हैं।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: मूल इब्रानी पाठ में यहाँ ‘इस्राएल’ है, ‘याकूब’ नहीं।
    reason: alternative_reading
  - marker: b
    text: या, “आपके वचन से” अथवा “आपके कहने पर”।
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּעֲלוֹת הַמִּנְחָה
  choice: अन्नबलि चढ़ाने के समय
  rationale: עלה के क्रियारूप का बलि अर्पित करने का भाव और מִנְחָה का अन्नबलि संबंधी अर्थ, दोनों स्वाभाविक और संक्षिप्त हिन्दी में सुरक्षित हैं।
- source_word: וַיִּגַּשׁ
  choice: पास आया
  rationale: यह נגשׁ के ठोस निकट आने के भाव को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: उपाधि से बदलने के बजाय इब्रानी वाचा-नाम का प्रचलित हिन्दी लिप्यंतरण रखा गया है।
- source_word: אֱלֹהֵי אַבְרָהָם יִצְחָק וְיִשְׂרָאֵל
  choice: अब्राहम, इसहाक और इस्राएल के परमेश्वर
  rationale: मूल पाठ में याकूब नहीं, स्पष्टतः इस्राएल है; इसलिए परिचित सूत्र से सामंजस्य नहीं बैठाया गया।
- source_word: הַיּוֹם יִוָּדַע
  choice: आज यह प्रकट हो जाए
  rationale: निफ़अल अपूर्ण क्रिया के प्रार्थनात्मक/कामनार्थक बल को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: אֱלֹהִים בְּיִשְׂרָאֵל
  choice: इस्राएल में आप ही परमेश्वर हैं
  rationale: ב का सामान्य अर्थ ‘में’ रखा गया है और אַתָּה की बलाघाती भूमिका को ‘आप ही’ से स्पष्ट किया गया है।
- source_word: עַבְדֶּךָ
  choice: आपका सेवक
  rationale: नबी की नियुक्त सेवा के प्रसंग में ‘सेवक’ स्वाभाविक है और दासता का अनावश्यक अर्थ नहीं जोड़ता।
- source_word: וּבִדְבָרֶךָ
  choice: आपके वचन के अनुसार
  rationale: בְּ की मानक या अनुरूपता बताने वाली सम्भावना को चुना गया है; ‘आपके वचन से’ भी व्याकरणतः सम्भव है।
- source_word: עָשִׂיתִי אֵת כָּל הַדְּבָרִים הָאֵלֶּה
  choice: मैंने ये सब काम ... किए हैं
  rationale: דברים यहाँ कथनों के बजाय कार्यों/मामलों को सूचित करता है; पूर्ण क्रिया को वर्तमान अपील से जुड़े संपन्न कार्य के रूप में दिया गया है।
theological_decisions:
- issue: יהוה वाचा-नाम का अनुवाद
  choice: याहवे
  alternative: प्रभु / यहोवा
  rationale: मूल में निजी वाचा-नाम है; उसे उपाधि से प्रतिस्थापित नहीं किया गया।
- issue: पितृपुरुषों के सूत्र में इस्राएल या याकूब
  choice: इस्राएल
  alternative: याकूब
  rationale: मसोरेटिक पाठ स्पष्टतः יִשְׂרָאֵל पढ़ता है; परिचित सूत्र के कारण इसे बदला नहीं गया।
- issue: וּבִדְבָרֶךָ में בְּ का संबंध
  choice: आपके वचन के अनुसार
  alternative: आपके वचन से / आपके कहने पर
  rationale: यहाँ साधन और मानक—दोनों अर्थ सम्भव हैं। मुख्य पाठ में आज्ञापालन का मानक व्यक्त किया गया है और विकल्प पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी। परमेश्वर को संबोधित करते हुए आदरसूचक ‘आप’ रखा गया है। ‘अन्नबलि’ धार्मिक संदर्भ में सटीक और हिन्दी पाठकों के लिए अपेक्षाकृत परिचित शब्द है।
