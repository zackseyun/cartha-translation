  text: וְ/הָיָ֞ה אֲנִ֣י אֵלֵ֣ךְ מֵ/אִתָּ֗/ךְ וְ/ר֨וּחַ יְהוָ֤ה יִֽשָּׂאֲ/ךָ֙ עַ֚ל אֲשֶׁ֣ר לֹֽא אֵדָ֔ע וּ/בָ֨אתִי לְ/הַגִּ֧יד לְ/אַחְאָ֛ב וְ/לֹ֥א יִֽמְצָאֲ/ךָ֖ וַ/הֲרָגָ֑/נִי וְ/עַבְדְּ/ךָ֛ יָרֵ֥א אֶת יְהוָ֖ה מִ/נְּעֻרָֽ/י׀׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/012.yaml
  text: And when I go away from you[a], the Spirit of Yahweh may carry you where I do not know. Then when I come and tell Ahab and he does not find you, he will kill me—though your servant has feared Yahweh from my youth.
translation:
  language: hi
  text: जब मैं आपके पास से चला जाऊँगा, तो संभव है कि यहोवा का आत्मा[a] आपको कहीं ऐसी जगह ले जाए जहाँ का मुझे पता न हो। फिर जब मैं आकर अहाब को बताऊँ और वह आपको न पाए, तो वह मुझे मार डालेगा; जबकि आपका सेवक अपनी युवावस्था से यहोवा का भय मानता आया है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “यहोवा की वायु”; इब्रानी רוּחַ का अर्थ “आत्मा,” “वायु” या “श्वास” हो सकता है, पर यहाँ “आत्मा” संदर्भ के अधिक अनुकूल है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה אֲנִי אֵלֵךְ מֵאִתָּךְ
  choice: और ऐसा होगा कि जब मैं आपके पास से चला जाऊँगा
  rationale: וְהָיָה भावी परिस्थिति का परिचय देता है; हिंदी में ‘ऐसा होगा कि जब’ मूल की क्रमिक और आशंकापूर्ण संरचना को स्वाभाविक रूप से व्यक्त करता है। מֵאִתָּךְ को आदरसूचक संबोधन के साथ ‘आपके पास से’ किया गया है।
- source_word: רוּחַ יְהוָה
  choice: यहोवा का आत्मा
  rationale: רוּחַ के अर्थ ‘आत्मा’, ‘वायु’ और ‘श्वास’ हो सकते हैं। भविष्यद्वक्ता को अलौकिक रीति से ले जाए जाने की आशंका के संदर्भ में ‘आत्मा’ मुख्य पाठ के लिए सर्वाधिक उपयुक्त है; वास्तविक lexical ambiguity फुटनोट में रखी गई है।
- source_word: יִשָּׂאֲךָ
  choice: आपको उठाकर ... ले जाएगा
  rationale: נשא का मूल भाव उठाना और ढोना/ले जाना है। संयुक्त हिंदी अभिव्यक्ति अलौकिक स्थानांतरण का भाव स्पष्ट रखते हुए स्रोत के दोनों पहलुओं को दर्शाती है।
- source_word: עַל אֲשֶׁר לֹא אֵדָע
  choice: ऐसी जगह ... जिसे मैं नहीं जानता
  rationale: वाक्यांश अज्ञात गंतव्य बताता है। हिंदी में ‘ऐसी जगह जिसे मैं नहीं जानता’ स्वाभाविक है और मूल की अनिश्चितता बनाए रखता है।
- source_word: וּבָאתִי לְהַגִּיד לְאַחְאָב
  choice: फिर जब मैं जाकर अहाब को बताऊँगा
  rationale: क्रमिक क्रिया और भविष्य की आशंका को सहज हिंदी में व्यक्त किया गया है। संदर्भ में בוא का लक्ष्य अहाब के पास पहुँचकर सूचना देना है, इसलिए ‘जाकर’ स्वाभाविक है।
- source_word: וַהֲרָגָנִי
  choice: तो वह मुझे मार डालेगा
  rationale: यह ओबद्याह द्वारा आशंकित सीधा परिणाम है; ‘मार डालेगा’ स्पष्ट, आधुनिक और मूल के बल के अनुरूप है।
- source_word: וְעַבְדְּךָ
  choice: जबकि आपका सेवक
  rationale: यह एलिय्याह के सामने विनम्र आत्म-संदर्भ है। ‘सेवक’ सामाजिक दासता पर अनावश्यक बल दिए बिना भाषिक विनम्रता व्यक्त करता है। וְ को यहाँ विरोध/विनती के संबंध में ‘जबकि’ किया गया है।
- source_word: יָרֵא אֶת יְהוָה מִנְּעֻרָי
  choice: अपनी युवावस्था से यहोवा का भय मानता आया है
  rationale: ईश्वर के विषय में ירא श्रद्धापूर्ण भय को व्यक्त करता है। ‘मानता आया है’ युवावस्था से वर्तमान तक चली आ रही अवस्था को स्वाभाविक हिंदी में दर्शाता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: मूल में व्यक्तिगत दिव्य नाम יהוה है; हिंदी में स्थापित रूप ‘यहोवा’ शीर्षक ‘प्रभु’ से भेद बनाए रखता है।
theological_decisions:
- issue: רוּחַ יְהוָה में רוּחַ का अर्थ
  choice: यहोवा का आत्मा
  alternative: यहोवा की वायु
  rationale: भविष्यद्वक्ता एलिय्याह को दैवी शक्ति द्वारा अज्ञात स्थान पर ले जाए जाने का संदर्भ ‘आत्मा’ का समर्थन करता है, पर शब्द की ‘वायु’ वाली वास्तविक संभावना फुटनोट में सुरक्षित रखी गई है।
- issue: दिव्य नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: व्यक्तिगत नाम को शीर्षक से प्रतिस्थापित न करके हिंदी में परिचित लिप्यंतरण अपनाया गया है। ‘याहवे’ एक संभव वैकल्पिक लिप्यंतरण है।
- issue: ओबद्याह के दावे में ירא का धार्मिक भाव
  choice: यहोवा का भय मानता आया है
  alternative: यहोवा का श्रद्धापूर्वक आदर करता आया है
  rationale: ‘भय मानना’ बाइबिलीय वाक्यांश की गंभीरता और श्रद्धा-भय के तनाव को बनाए रखता है; इसे केवल ‘आदर’ बनाना अर्थ को संकुचित कर देता।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण किंतु सहज शैली रखी गई है। एलिय्याह के लिए आदरसूचक ‘आप’ और ओबद्याह की विनम्र आत्म-पहचान ‘आपका सेवक’ संवाद की सामाजिक मुद्रा बनाए रखते हैं। मुख्य पाठ में स्रोत की भविष्यगत आशंका और धार्मिक तनाव सुरक्षित हैं।
