id: 1KI.18.19
reference: 1 Kings 18:19
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/עַתָּ֗ה שְׁלַ֨ח קְבֹ֥ץ אֵלַ֛/י אֶת כָּל יִשְׂרָאֵ֖ל אֶל הַ֣ר הַ/כַּרְמֶ֑ל וְ/אֶת נְבִיאֵ֨י הַ/בַּ֜עַל אַרְבַּ֧ע מֵא֣וֹת וַ/חֲמִשִּׁ֗ים וּ/נְבִיאֵ֤י הָֽ/אֲשֵׁרָה֙ אַרְבַּ֣ע מֵא֔וֹת אֹכְלֵ֖י שֻׁלְחַ֥ן אִיזָֽבֶל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/019.yaml
  text: Now send and gather to me all Israel at Mount Carmel[a], along with the prophets of Baal, four hundred and fifty, and the prophets of Asherah, four hundred[c][b], who eat at Jezebel’s table.
translation:
  language: hi
  text: अब संदेश भेजकर सारे इस्राएल को मेरे पास कर्मेल पर्वत पर इकट्ठा कर[a]। साथ ही बाल के चार सौ पचास नबियों और अशेरा के चार सौ नबियों[c] को भी बुला, जो ईज़ेबेल की मेज़ पर खाते हैं[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “कर्मेल पर्वत की ओर इकट्ठा कर।” इब्रानी संबंधबोधक शब्द इकट्ठा होने के स्थान की ओर गति बताता है।
    reason: lexical_alternative
  - marker: b
    text: अर्थात वे ईज़ेबेल के राजकीय आश्रय और भरण-पोषण में थे।
    reason: cultural_note
  - marker: c
    text: “अशेरा” से देवी अशेरा अथवा कुछ प्रसंगों में उससे जुड़ी पूजा-वस्तु अभिप्रेत हो सकती है। यहाँ “बाल” के समानांतर प्रयोग से देवी अभिप्रेत होना अधिक संभावित है।
    reason: cultural_note
lexical_decisions:
- source_word: וְעַתָּה
  choice: अब
  rationale: यह प्रसंग में एलिय्याह की तत्काल आज्ञा का आरम्भ कराने वाला संवाद-सूचक है; आधुनिक हिन्दी में ‘अब’ स्वाभाविक है।
- source_word: שְׁלַח קְבֹץ
  choice: संदेश भेजकर ... इकट्ठा कर
  rationale: 'दोनों आज्ञार्थक क्रियाओं का संबंध साधन और परिणाम का है: अहाब को आदेश भेजकर लोगों को एकत्र करना है।'
- source_word: אֵלַי
  choice: मेरे पास
  rationale: उपसर्ग एलिय्याह की ओर आने की दिशा बताता है; ‘मेरे पास’ हिन्दी में स्पष्ट और सहज है।
- source_word: כָּל יִשְׂרָאֵל
  choice: सारे इस्राएल
  rationale: मूल का सामूहिक राष्ट्रीय पद सुरक्षित रखा गया है; यह आवश्यक नहीं कि हर व्यक्ति अलग-अलग अभिप्रेत हो।
- source_word: אֶל הַר הַכַּרְמֶל
  choice: कर्मेल पर्वत पर
  rationale: इब्रानी में गंतव्य की दिशा है; हिन्दी में इकट्ठा होने के स्थान के लिए ‘पर’ स्वाभाविक है, जबकि ‘तक/की ओर’ को पादटिप्पणी में रखा गया है।
- source_word: נְבִיאֵי הַבַּעַל
  choice: बाल के ... नबियों
  rationale: यह बाल से संबद्ध नबियों को बताने वाला संबंधवाचक पद है।
- source_word: נְבִיאֵי הָאֲשֵׁרָה
  choice: अशेरा के ... नबियों
  rationale: बाल के समानांतर प्रयोग के कारण यहाँ अशेरा को देवी के नाम के रूप में रखना सबसे उपयुक्त है।
- source_word: אֹכְלֵי שֻׁלְחַן אִיזָבֶל
  choice: जो ईज़ेबेल की मेज़ पर खाते हैं
  rationale: मूल रूपक को बनाए रखते हुए यह राजकीय आश्रय और भरण-पोषण का संकेत देता है।
theological_decisions:
- issue: इस पद में אֲשֵׁרָה का अर्थ
  choice: देवी के व्यक्तिवाचक नाम के रूप में ‘अशेरा’
  alternative: अशेरा से जुड़ा पूजा-स्तंभ अथवा पवित्र खंभा
  rationale: ‘बाल के नबियों’ के साथ समानांतर रचना यहाँ देवी को अभिप्रेत करने के पक्ष में है; फिर भी अन्य प्रसंगों में उसी शब्द से पूजा-वस्तु अभिप्रेत हो सकती है, इसलिए यह बात पादटिप्पणी में स्पष्ट की गई है।
- issue: ‘सारे इस्राएल’ का विस्तार
  choice: सामूहिक राष्ट्रीय अभिव्यक्ति को बनाए रखा गया
  alternative: ‘सभी इस्राएलियों’ के रूप में प्रत्येक व्यक्ति पर बल
  rationale: मूल पद राष्ट्र को समग्र रूप से संबोधित करता है; अनुवाद इस अलंकारिक व्यापकता को अनावश्यक रूप से संकुचित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज किंतु गरिमापूर्ण कथात्मक स्तर अपनाया गया है। आज्ञा की तात्कालिकता रखी गई है; प्राचीन नामों के प्रचलित हिन्दी रूप ‘बाल’, ‘अशेरा’, ‘ईज़ेबेल’ और ‘कर्मेल’ प्रयुक्त हुए हैं।
