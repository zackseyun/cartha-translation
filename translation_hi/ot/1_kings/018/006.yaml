- source_word: הָלַךְ
  choice: गया
  rationale: मार्ग-वर्णन में הלך के लिए सामान्य और स्वाभाविक हिन्दी क्रिया।
- source_word: בְּדֶרֶךְ אֶחָד ... בְּדֶרֶךְ אֶחָד
  choice: एक मार्ग से ... दूसरे मार्ग से
  rationale: इब्रानी दोनों खंडों में अक्षरशः ‘एक मार्ग’ दोहराती है; हिन्दी में ‘एक ... दूसरे’ दोनों के अलग-अलग मार्ग लेने का वही वितरणात्मक भाव स्वाभाविक रूप से व्यक्त करता है।
- source_word: לְבַדּוֹ
