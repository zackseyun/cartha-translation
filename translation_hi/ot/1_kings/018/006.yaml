base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/006.yaml
  text: 'So they divided the land between themselves to pass through it: Ahab went one way by himself[a], and Obadiah went another way by himself.'
translation:
  language: hi
  text: तब उन्होंने उस देश को आपस में बाँट लिया, ताकि उसमें होकर जाएँ। अहाब अकेला ही एक मार्ग से गया, और ओबद्याह अकेला ही दूसरे मार्ग से गया।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इब्रानी में दोनों व्यक्तियों के लिए अक्षरशः ‘एक मार्ग’ कहा गया है: ‘अहाब अकेला ही एक मार्ग से गया, और ओबद्याह अकेला ही एक मार्ग से गया।’ हिन्दी में अलग-अलग मार्गों का भाव स्पष्ट और स्वाभाविक करने के लिए दूसरी बार ‘दूसरे मार्ग’ कहा गया है।'
    reason: lexical_alternative
