source:
  edition: WLC
  text: וַ/יֹּ֗אמֶר מִלְא֨וּ אַרְבָּעָ֤ה כַדִּים֙ מַ֔יִם וְ/יִֽצְק֥וּ עַל הָ/עֹלָ֖ה וְ/עַל הָ/עֵצִ֑ים וַ/יֹּ֤אמֶר שְׁנוּ֙ וַ/יִּשְׁנ֔וּ וַ/יֹּ֥אמֶר שַׁלֵּ֖שׁוּ וַ/יְשַׁלֵּֽשׁוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/034.yaml
  text: Then he said[a], “Fill four jars with water and pour it on the burnt offering and on the wood.” Then he said, “Do it a second time,” and they did it a second time. Then he said, “Do it a third time,” and they did it a third time.
translation:
  language: hi
  text: तब उसने कहा, “चार घड़े[a] पानी से भरो और उसे होमबलि और लकड़ियों पर उँडेल दो।” फिर उसने कहा, “ऐसा दूसरी बार करो,” और उन्होंने दूसरी बार वैसा ही किया। फिर उसने कहा, “ऐसा तीसरी बार करो,” और उन्होंने तीसरी बार वैसा ही किया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “चार मटके”; इब्रानी शब्द तरल पदार्थ रखने या ढोने के पात्र को दर्शाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: तब उसने कहा
  rationale: वाव-क्रमिक रूप कथा को आगे बढ़ाता है; ‘तब’ आधुनिक हिन्दी में उसके क्रमिक भाव को स्वाभाविक रूप से व्यक्त करता है।
- source_word: מִלְאוּ
  choice: भरो
  rationale: यह बहुवचन आज्ञार्थक रूप है और पात्रों को भरने का निर्देश देता है।
- source_word: אַרְבָּעָה כַדִּים
  choice: चार घड़े
  rationale: כַּד तरल पदार्थ रखने या ढोने के पात्र को दर्शाता है; ‘घड़े’ स्पष्ट और प्रसंगानुकूल है, पर पात्र के सटीक आकार को निश्चित नहीं करता।
- source_word: מַיִם
  choice: पानी
  rationale: सामान्य आधुनिक हिन्दी में מַיִם का सीधा और स्वाभाविक अनुवाद।
- source_word: וְיִצְקוּ
  choice: और उसे ... उँडेल दो
  rationale: आज्ञाओं की श्रृंखला को हिन्दी में सीधे आदेश के रूप में रखा गया है; ‘उसे’ सामूहिक रूप से पानी की ओर संकेत करता है।
- source_word: עַל הָעֹלָה
  choice: होमबलि पर
  rationale: עֹלָה उस बलिदान का मानक पद है जो वेदी पर पूर्णतः जलाया जाता था; हिन्दी बाइबलीय प्रयोग में ‘होमबलि’ संक्षिप्त और सटीक है।
- source_word: וְעַל הָעֵצִים
  choice: और लकड़ियों पर
  rationale: यहाँ עֵצִים बलिदान के लिए लगाई गई लकड़ियों को दर्शाता है; हिन्दी में बहुवचन प्रसंग को स्पष्ट करता है।
- source_word: שְׁנוּ / וַיִּשְׁנוּ
  choice: ऐसा दूसरी बार करो / उन्होंने दूसरी बार वैसा ही किया
  rationale: दोनों क्रियाओं में कार्य को दूसरी बार करने का गिना हुआ क्रम है; आदेश और उसके पालन को समानांतर रखा गया है।
- source_word: שַׁלֵּשׁוּ / וַיְשַׁלֵּשׁוּ
  choice: ऐसा तीसरी बार करो / उन्होंने तीसरी बार वैसा ही किया
  rationale: ये रूप तीसरी बार कार्य करने के आदेश और पालन को बताते हैं; हिन्दी में क्रम स्पष्ट रखते हुए पुनरुक्ति स्वाभाविक बनाई गई है।
theological_decisions:
- issue: बलिदानी पद עֹלָה का अनुवाद
  choice: होमबलि
  alternative: पूर्ण होमबलि
  rationale: यह इस्राएली बलिदान का मानक पद है जो पूर्णतः आग में चढ़ाया जाता था। ‘होमबलि’ स्थापित हिन्दी पद है और मूल में निहित बात से अधिक व्याख्या नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक, सुबोध और गरिमापूर्ण रखी गई है। कथा का क्रम ‘तब’ और ‘फिर’ से स्पष्ट किया गया है। ‘उँडेल दो’ पानी को बलि और लकड़ियों पर डालने की क्रिया को स्वाभाविक हिन्दी में व्यक्त करता है।
