id: 1KI.18.1
reference: 1 Kings 18:1
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יְהִי֙ יָמִ֣ים רַבִּ֔ים וּ/דְבַר יְהוָ֗ה הָיָה֙ אֶל אֵ֣לִיָּ֔הוּ בַּ/שָּׁנָ֥ה הַ/שְּׁלִישִׁ֖ית לֵ/אמֹ֑ר לֵ֚ךְ הֵרָאֵ֣ה אֶל אַחְאָ֔ב וְ/אֶתְּנָ֥ה מָטָ֖ר עַל פְּנֵ֥י הָ/אֲדָמָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/001.yaml
  text: And it happened after many days that the word of Yahweh came to Elijah in the third year[a], saying, “Go, show yourself to Ahab, and I will give rain upon the face of the land.”
translation:
  language: hi
  text: 'बहुत दिनों के बाद, तीसरे वर्ष में याहवे का वचन एलिय्याह के पास आया: “जा, अपने को अहाब के सामने प्रकट कर, और मैं भूमि पर वर्षा करूँगा[a]।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मैं भूमि पर वर्षा भेजूँगा।” इब्रानी में शाब्दिक रूप से, “मैं भूमि के मुख पर वर्षा दूँगा।”
    reason: ‘वर्षा करूँगा’ के स्वाभाविक हिन्दी प्रयोग के साथ इब्रानी ‘देना’ और ‘भूमि के मुख पर’ का शाब्दिक रूप सुरक्षित रखने के लिए।
lexical_decisions:
- source_word: וַיְהִי יָמִים רַבִּים
  choice: बहुत दिनों के बाद
  rationale: इब्रानी कथात्मक सूत्र और लंबे समय के बीतने का भाव संक्षिप्त, स्वाभाविक आधुनिक हिन्दी में व्यक्त होता है।
- source_word: וּדְבַר יְהוָה הָיָה אֶל
  choice: याहवे का वचन ... के पास आया
  rationale: यह मानक नबूवत-सूत्र है; ‘वचन ... के पास आया’ दैवी संदेश के किसी व्यक्ति को दिए जाने का भाव बनाए रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत नाम को उपाधि से बदलने के बजाय उसका प्रचलित हिन्दी लिप्यंतरण रखा गया है।
- source_word: בַּשָּׁנָה הַשְּׁלִישִׁית
  choice: तीसरे वर्ष में
  rationale: यह कालवाचक पद का सीधा और स्वाभाविक अनुवाद है; मूल पाठ जिस आरंभ-बिंदु से वर्ष गिनता है, उसे यहाँ स्पष्ट नहीं करता।
- source_word: לֵאמֹר
  choice: उसने कहा
  rationale: प्रत्यक्ष कथन का परिचय हिन्दी में स्वाभाविक ढंग से देता है; कर्ता निकटवर्ती ‘याहवे’ है।
- source_word: לֵךְ הֵרָאֵה אֶל אַחְאָב
  choice: जा, अपने को अहाब के सामने प्रकट कर
  rationale: נראה के निफ़अल आदेश का आशय ‘अपने को दिखाई देना/प्रकट करना’ है; यह शब्दांकन आदेश और अहाब के सम्मुख उपस्थित होने, दोनों को स्पष्ट रखता है।
- source_word: וְאֶתְּנָה מָטָר
  choice: और मैं ... वर्षा दूँगा
  rationale: נתן के मूल अर्थ ‘देना’ को सुरक्षित रखा गया है, जिससे वर्षा के दैवी वरदान होने का भाव भी बना रहता है।
- source_word: עַל פְּנֵי הָאֲדָמָה
  choice: भूमि पर
  rationale: शाब्दिक ‘भूमि के मुख पर’ हिन्दी में अस्वाभाविक है; ‘भूमि पर’ स्थानीय सूखे के प्रसंग में अर्थ को ठीक और स्पष्ट रूप से व्यक्त करता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में व्यक्तिगत वाचा-नाम है। ‘याहवे’ उसे उपाधि में बदले बिना आधुनिक हिन्दी में लिप्यंतरित करता है।
- issue: वर्षा देने की अभिव्यक्ति
  choice: मैं भूमि पर वर्षा दूँगा
  alternative: मैं भूमि पर वर्षा बरसाऊँगा/भेजूँगा
  rationale: ‘दूँगा’ इब्रानी נתן के शब्दार्थ और वर्षा को परमेश्वर की देन बताने वाले भाव को बनाए रखता है, जबकि पादटिप्पणी अधिक मुहावरेदार विकल्प बताती है।
translation_notes:
  register: भाषा आधुनिक, सरल और गरिमापूर्ण रखी गई है। कथात्मक आरंभ को हिन्दी में बोझिल बनाए बिना इब्रानी क्रम सुरक्षित किया गया है। प्रत्यक्ष वचन में एकवचन अनौपचारिक आदेश ‘जा’ राजा के पास भेजे जा रहे नबी से परमेश्वर के सीधे संबोधन को दर्शाता है।
