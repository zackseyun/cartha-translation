  yaml_path: translation/ot/1_kings/018/037.yaml
  text: Answer me[a], O Yahweh, answer me, so that this people may know that you, O Yahweh, are God[b], and that you have turned their heart back.
translation:
  language: hi
  text: हे यहोवा, मुझे उत्तर दे[a], मुझे उत्तर दे, ताकि ये लोग जान लें कि हे यहोवा, तू ही परमेश्वर है[b], और तूने ही उनके मन को वापस मोड़ दिया है[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मेरी सुन।”
    reason: lexical_alternative
  - marker: b
    text: या, “तू ही वह परमेश्वर है।”
    reason: lexical_alternative
  - marker: c
    text: हिब्रू में “उनका मन/हृदय” एकवचन है और पूरे लोगों के लिए सामूहिक अभिव्यक्ति है; कुछ अनुवादों में “उनके मनों/हृदयों” है।
    reason: textual_and_grammatical_ambiguity
lexical_decisions:
- source_word: עֲנֵנִי
  choice: मेरी सुन
  rationale: प्रार्थना के प्रसंग में इसका अर्थ ऐसी ईश्वरीय प्रतिक्रिया की विनती है जो कार्य द्वारा प्रकट हो; हिंदी में ‘मेरी सुन’ स्वाभाविक है और इसकी पुनरावृत्ति बल बनाए रखती है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: व्यक्तिगत ईश्वरीय नाम को प्रचलित हिंदी लिप्यंतरण ‘यहोवा’ से व्यक्त किया गया है, किसी उपाधि से प्रतिस्थापित नहीं किया गया।
- source_word: וְיֵדְעוּ
  choice: ताकि ... जान लें
  rationale: वाव सहित अपूर्ण क्रिया यहाँ एलिय्याह की प्रार्थना का उद्देश्य अथवा अपेक्षित परिणाम व्यक्त करती है।
- source_word: הָעָם הַזֶּה
  choice: ये लोग
  rationale: सामूहिक संज्ञा עם का आधुनिक, सहज हिंदी रूप; ‘यह प्रजा’ की अपेक्षा सामान्य पाठक के लिए अधिक स्वाभाविक।
- source_word: כִּי אַתָּה יְהוָה הָאֱלֹהִים
  choice: कि हे यहोवा, तू ही परमेश्वर है
  rationale: यह वाक्य बाल के विपरीत यहोवा को सच्चे परमेश्वर के रूप में पहचानता है; ‘ही’ इस विशिष्ट पहचान को स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: הֲסִבֹּתָ
  choice: मोड़ रहा है
  rationale: हिफ़ील रूप ईश्वर की कारक भूमिका को बनाए रखता है। इस प्रार्थना-संदर्भ में हिब्रू पूर्ण रूप को वर्तमान में घट रही निर्णायक क्रिया के रूप में समझना संभव है।
- source_word: אֶת לִבָּם
  choice: उनके मन को
  rationale: हिब्रू में ‘उनका हृदय’ एकवचन सामूहिक अभिव्यक्ति है; हिंदी में ‘उनके मन को’ सामूहिक एकवचन और आंतरिक अभिमुखता दोनों को स्वाभाविक रूप से रखता है।
- source_word: אֲחֹרַנִּית
  choice: फिर अपनी ओर
  rationale: क्रिया के साथ यह लौटने की दिशा दर्शाता है; संदर्भ से लक्ष्य यहोवा है। ‘अपनी ओर’ हिंदी में आवश्यक रूप से स्पष्ट करता है, जबकि ‘फिर’ वापसी का भाव देता है।
theological_decisions:
- issue: लोगों के लौटने में परमेश्वर की सक्रियता
  choice: तू ही उनके मन को फिर अपनी ओर मोड़ रहा है
  alternative: तूने ही उनके मन को फिर अपनी ओर मोड़ा है
  rationale: परमेश्वर की कारक सक्रियता को स्पष्ट रखा गया है, उसे केवल अनुमति या आमंत्रण नहीं बनाया गया। पूर्ण क्रिया का कालगत पक्ष संदर्भ में वर्तमान परिणाम अथवा जारी निर्णायक कार्य के रूप में भी समझा जा सकता है, इसलिए विकल्प पादटिप्पणी में रखा गया है।
- issue: יְהוָה הָאֱלֹהִים में निश्चितता
  choice: तू ही परमेश्वर है
  alternative: तू ही वह परमेश्वर है
  rationale: मुख्य पाठ स्वाभाविक हिंदी में यहोवा की विशिष्ट पहचान व्यक्त करता है; हिब्रू के निश्चित उपपद को अधिक प्रत्यक्ष रूप से दिखाने वाला विकल्प पादटिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक मानक हिंदी का गरिमापूर्ण किंतु सहज प्रार्थना-रजिस्टर अपनाया गया है। ‘तू’ निकट, प्रत्यक्ष संबोधन के साथ हिब्रू द्वितीय पुरुष एकवचन को रखता है। पुनरावृत्ति और ईश्वरीय सक्रियता सुरक्षित रखी गई हैं।
