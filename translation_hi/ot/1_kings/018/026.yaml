  text: וַ֠/יִּקְחוּ אֶת הַ/פָּ֨ר אֲשֶׁר נָתַ֣ן לָ/הֶם֮ וַֽ/יַּעֲשׂוּ֒ וַ/יִּקְרְא֣וּ בְ/שֵׁם הַ֠/בַּעַל מֵ/הַ/בֹּ֨קֶר וְ/עַד הַ/צָּהֳרַ֤יִם לֵ/אמֹר֙ הַ/בַּ֣עַל עֲנֵ֔/נוּ וְ/אֵ֥ין ק֖וֹל וְ/אֵ֣ין עֹנֶ֑ה וַֽ/יְפַסְּח֔וּ עַל הַ/מִּזְבֵּ֖חַ אֲשֶׁ֥ר עָשָֽׂה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/026.yaml
  text: So they took the bull that had been given to them[a], prepared it, and called on the name of Baal from morning until noon, saying, “O Baal, answer us!” But there was no voice, and no one answered. And they limped around the altar that had been made.
translation:
  language: hi
  text: तब उन्होंने उस बैल को लिया जो उन्हें दिया गया था, उसे तैयार किया और सुबह से दोपहर तक बाल का नाम लेकर पुकारते हुए कहते रहे, “हे बाल, हमें उत्तर दे!” पर न कोई आवाज़ आई, न किसी ने उत्तर दिया। और वे उस वेदी के चारों ओर लंगड़ाते हुए घूमते रहे[a], जो बनाई गई थी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “वे वेदी के चारों ओर नाचते रहे” अथवा “वे वेदी के चारों ओर उछलते रहे।” इब्रानी क्रिया सम्भवतः लंगड़ाने या फुदकने जैसी अनुष्ठानिक गति बताती है और शायद पद 21 में एलिय्याह द्वारा इसी धातु के प्रयोग की जानबूझकर प्रतिध्वनि है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְחוּ אֶת־הַפָּר
  choice: उन्होंने उस बैल को लिया
  rationale: לקח का सामान्य कथात्मक अर्थ ‘लेना’ है; פַּר बलिदान के लिए प्रयुक्त बैल को दर्शाता है।
- source_word: אֲשֶׁר נָתַן לָהֶם
  choice: जो उन्हें दिया गया था
  rationale: पूर्ववर्ती प्रसंग में एलिय्याह द्वारा दिए जाने का संकेत है, पर निष्क्रिय रूप स्रोत के आशय को स्वाभाविक हिन्दी में रखता है।
- source_word: וַיַּעֲשׂוּ
  choice: उसे तैयार किया
  rationale: यहाँ עשה बलिदान-संबंधी तैयारी के लिए संक्षिप्त प्रयोग है; ‘चढ़ाया’ कहना आग आने से पहले की क्रिया को बढ़ा-चढ़ाकर बताता।
- source_word: וַיִּקְרְאוּ בְשֵׁם הַבַּעַל
  choice: बाल का नाम पुकारते हुए
  rationale: קרא בשם देवता को पुकारने या उसका आह्वान करने का मुहावरा है; यह रूप इब्रानी अभिव्यक्ति को स्पष्ट और स्वाभाविक हिन्दी में रखता है।
- source_word: מֵהַבֹּקֶר וְעַד־הַצָּהֳרַיִם
  choice: सुबह से दोपहर तक
  rationale: समयावधि का सीधा और आधुनिक हिन्दी रूप।
- source_word: הַבַּעַל עֲנֵנוּ
  choice: हे बाल, हमें उत्तर दे!
  rationale: सम्बोधन और प्रार्थनात्मक पुकार दोनों को स्पष्ट रखता है।
- source_word: וְאֵין קוֹל וְאֵין עֹנֶה
  choice: न कोई आवाज़ आई, न किसी ने उत्तर दिया
  rationale: दोहरी निषेधात्मक समानांतरता और קוֹל के ‘आवाज़’ अर्थ दोनों को सुरक्षित रखता है।
- source_word: וַיְפַסְּחוּ
  choice: लंगड़ाते हुए घूमते रहे
  rationale: פסח यहाँ लंगड़ाने, फुदकने या उछलने जैसी अनुष्ठानिक गति सूचित कर सकता है। ‘लंगड़ाते’ पद अध्याय 18:21 में इसी धातु से जुड़े सम्भावित शब्दालंकार को बनाए रखता है।
- source_word: עַל הַמִּזְבֵּחַ
  choice: वेदी के चारों ओर
  rationale: इस गतिसूचक प्रसंग में עַל का आशय वेदी पर चढ़ना नहीं, बल्कि उसके पास या उसके चारों ओर अनुष्ठानिक गति करना है।
- source_word: אֲשֶׁר עָשָׂה
  choice: जो बनाई गई थी
  rationale: इब्रानी में क्रिया एकवचन है, लेकिन कर्ता स्पष्ट नहीं है। हिन्दी का निष्क्रिय रूप अनिर्दिष्ट कर्ता जोड़े बिना वेदी की पूर्व तैयारी बताता है।
theological_decisions:
- issue: बाल के नाम को पुकारने वाले मुहावरे का अनुवाद
  choice: बाल का नाम पुकारते हुए
  alternative: बाल का आह्वान करते हुए
  rationale: यह पवित्रशास्त्र में देवता को सम्बोधित करने के सामान्य मुहावरे को बनाए रखता है, पर बाल की उपासना को वैध ठहराने का कोई संकेत नहीं देता।
- issue: וַיְפַסְּחוּ की अनुष्ठानिक गति
  choice: लंगड़ाते हुए घूमते रहे
  alternative: नाचते रहे / उछलते रहे
  rationale: चुना हुआ रूप धातु की सम्भावित मूल छवि और पद 21 से साहित्यिक सम्बन्ध को सुरक्षित रखता है; पादटिप्पणी अन्य सम्भव अर्थों को खुला रखती है।
- issue: אֲשֶׁר עָשָׂה का अनिर्दिष्ट कर्ता
  choice: जो बनाई गई थी
  alternative: जो उसने बनाई थी
  rationale: स्रोत में एकवचन क्रिया है, किन्तु कर्ता का स्पष्ट नाम नहीं है। निष्क्रिय हिन्दी अनावश्यक पहचान थोपने से बचती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘बाल’ प्रचलित हिन्दी बाइबलीय नामरूप है। दोहरी नकारात्मक रचना स्रोत की लय और बाल की निष्फलता पर कथात्मक बल बनाए रखती है।
