  choice: वे ऊँची आवाज़ में पुकारने लगे
  rationale: पूरे पदबंध को स्वाभाविक हिन्दी में रखते हुए ऊँची और व्याकुल पुकार का भाव व्यक्त किया गया है।
- source_word: וַיִּתְגֹּדְדוּ
  choice: अपने को काटने लगे
  rationale: आत्मवाचक क्रिया अनुष्ठान के दौरान स्वयं को धारदार हथियारों से घायल करने को दर्शाती है। ‘अपने को काटने’ का प्रयोग स्पष्ट और सामान्य पाठक के लिए सहज है।
- source_word: כְּמִשְׁפָּטָם
  choice: अपनी रीति के अनुसार
  rationale: यहाँ מִשְׁפָּט किसी न्यायिक निर्णय के बजाय उनकी स्थापित धार्मिक प्रथा या रीति को सूचित करता है।
- source_word: בַּחֲרָבוֹת וּבָרְמָחִים
  choice: तलवारों और भालों से
  rationale: בְּ साधन को चिह्नित करता है; ‘से’ हिन्दी में इसका स्वाभाविक रूप है। רְמָחִים के लिए सामान्य आधुनिक शब्द ‘भाले’ चुना गया है।
- source_word: עַד שְׁפָךְ דָּם עֲלֵיהֶם
  choice: यहाँ तक कि उनके शरीर पर खून बह निकला
  rationale: עַד क्रिया की चरम सीमा बताता है। यह अनुवाद रक्त के उनके ऊपर बहने की इब्रानी छवि को स्वाभाविक हिन्दी में बनाए रखता है और ‘फूट पड़ा’ जैसे अधिक तीव्र अर्थ को नहीं जोड़ता।
