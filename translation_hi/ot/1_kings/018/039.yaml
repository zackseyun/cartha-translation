base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/039.yaml
  text: When all the people saw it[a], they fell on their faces and said, “Yahweh, he is God! Yahweh, he is God!”
translation:
  language: hi
  text: जब सब लोगों ने यह देखा, तो वे मुँह के बल गिर पड़े और कहा, “याहवे ही परमेश्वर है![a] याहवे ही परमेश्वर है!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “याहवे, वही परमेश्वर है!” मूल भाषा में “परमेश्वर” के साथ निश्चित उपपद याहवे को बाल के विपरीत सच्चे परमेश्वर के रूप में चिह्नित करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא כָּל הָעָם
  choice: जब सब लोगों ने यह देखा
  rationale: क्रिया का मूल अर्थ ‘देखना’ है। निकटवर्ती प्रसंग में देखी गई आग और पूरी घटना की ओर संकेत करने के लिए हिन्दी में ‘यह’ स्वाभाविक रूप से जोड़ा गया है।
- source_word: וַיִּפְּלוּ עַל־פְּנֵיהֶם
  choice: वे मुँह के बल गिर पड़े
  rationale: यह इब्रानी मुहावरे की ठोस शारीरिक छवि और श्रद्धापूर्ण दंडवत भाव, दोनों को सहज आधुनिक हिन्दी में बनाए रखता है।
- source_word: וַיֹּאמְרוּ
  choice: कहने लगे
  rationale: मूल क्रिया सामान्यतः ‘कहना’ है और अपने आप ऊँची आवाज़ या पुकारने का भाव नहीं जोड़ती। हिन्दी में सामूहिक तथा दोहराए गए कथन के लिए ‘कहने लगे’ स्वाभाविक है।
- source_word: יְהוָה
  choice: याहवे
  rationale: व्यक्तिगत ईश्वरीय नाम को किसी उपाधि से बदलने के बजाय उसका प्रचलित लिप्यंतरण रखा गया है।
- source_word: הוּא
  choice: ही
  rationale: इब्रानी में व्यक्त सर्वनाम कथन को बल देता है। हिन्दी में ‘ही’ उस पहचान और विरोधात्मक बल को स्वाभाविक रूप से व्यक्त करता है, बिना ‘अकेला’ जैसा अतिरिक्त शब्द जोड़ने के।
- source_word: הָאֱלֹהִים
  choice: परमेश्वर
  rationale: संज्ञा के साथ लगा निश्चित उपपद बाल के विपरीत याहवे की सच्चे परमेश्वर के रूप में पहचान कराता है। हिन्दी में विधेय के रूप में ‘परमेश्वर’ सबसे स्वाभाविक है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में चार-अक्षरी व्यक्तिगत नाम सीधे आया है; इसलिए उपाधि रखने के बजाय नाम का लिप्यंतरण किया गया है।
- issue: יְהוָה הוּא הָאֱלֹהִים में पहचान और बल
  choice: याहवे ही परमेश्वर है
  alternative: याहवे परमेश्वर है; याहवे ही वह परमेश्वर है
  rationale: ‘ही’ स्पष्ट सर्वनाम הוּא के बल और बाल के साथ निहित विरोध को सहज हिन्दी में बनाए रखता है। ‘वह परमेश्वर’ अधिक शाब्दिक होता, पर आधुनिक हिन्दी में अनावश्यक रूप से अस्वाभाविक लगता।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। ‘मुँह के बल गिर पड़े’ मूल की सजीव छवि बचाता है, और दोहराया हुआ जयघोष ज्यों का त्यों रखा गया है।
