base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/004.yaml
  text: When Jezebel was cutting off the prophets of Yahweh[a], Obadiah took a hundred prophets and hid them, fifty men to a cave[b], and provided them with bread and water.
translation:
  language: hi
  text: जब ईज़ेबेल यहवे के नबियों को नष्ट कर रही थी[a], तब ओबद्याह ने सौ नबियों को लिया और उन्हें छिपाया—हर गुफा में पचास पुरुष[b]—और उन्हें रोटी और पानी उपलब्ध कराता रहा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “संहार कर रही थी”; मूल इब्रानी में अधिक शाब्दिक रूप से, “काट डाल रही थी।”
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “गुफा में पचास पुरुष।” सम्भवतः आशय है कि उसने उन्हें पचास-पचास के समूहों में, शायद अलग-अलग गुफाओं में, छिपाया।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בְּהַכְרִית
  choice: जब ... संहार कर रही थी
  rationale: היה के साथ ב् + infinitive construct यहाँ पृष्ठभूमि की समकालीन परिस्थिति बताता है। כרת का मूल बिंब ‘काट डालना’ है, पर इस प्रसंग में आशय नबियों का नाश या वध करना है; ‘संहार’ स्वाभाविक और सटीक है, जबकि पादटिप्पणी मूल बिंब सुरक्षित रखती है।
- source_word: אִיזֶבֶל
  choice: ईज़ेबेल
  rationale: हिब्रू व्यक्तिगत नाम का हिन्दी में प्रचलित लिप्यंतरण।
- source_word: נְבִיאֵי יְהוָה
  choice: यहवे के नबियों
  rationale: सम्बन्धवाचक construct chain को स्वाभाविक हिन्दी में व्यक्त किया गया है; יהוה को उसके व्यक्तिवाचक वाचा-नाम के रूप में ‘यहवे’ लिखा गया है।
- source_word: וַיִּקַּח עֹבַדְיָהוּ מֵאָה נְבִאִים
  choice: तब ओबद्याह ने सौ नबियों को लेकर
  rationale: לקח के सामान्य अर्थ ‘लेना’ को रखा गया है; ‘तब’ हिन्दी में मुख्य कथात्मक क्रिया को पहले कालवाचक उपवाक्य से सहज रूप से जोड़ता है।
- source_word: וַיַּחְבִּיאֵם
  choice: छिपा दिया
  rationale: Hiphil क्रिया का सीधा और स्वाभाविक हिन्दी रूप।
- source_word: חֲמִשִּׁים אִישׁ בַּמְּעָרָה
  choice: एक-एक गुफा में पचास-पचास पुरुष
  rationale: शाब्दिक रूप ‘गुफा में पचास पुरुष’ है। सौ नबियों के संदर्भ में वाक्यांश सम्भवतः दो समूहों और अलग गुफाओं का वितरण बताता है; हिन्दी की पुनरुक्ति इस सम्भावित distributive अर्थ को स्पष्ट करती है, और पादटिप्पणी शाब्दिक संरचना तथा अनुमान दोनों बताती है।
- source_word: וְכִלְכְּלָם לֶחֶם וָמָיִם
  choice: उन्हें रोटी और पानी देकर उनका पालन-पोषण किया
  rationale: כלכל का अर्थ लगातार आवश्यकताएँ पूरी करके संभालना या जीवित रखना है। ‘पालन-पोषण किया’ इस निरन्तर व्यवस्था को दर्शाता है, और ‘रोटी और पानी देकर’ साधनों को स्पष्ट रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: यहवे
  alternative: यहोवा / प्रभु
  rationale: मूल पाठ में टेट्राग्राम יהוה व्यक्तिवाचक नाम के रूप में है। ‘यहवे’ उसे उपाधि में बदलने के बजाय नाम के रूप में बनाए रखता है; हिन्दी पाठकों के लिए पादटिप्पणी वैकल्पिक परम्परागत रूप बताती है।
- issue: ईज़ेबेल की कार्रवाई की तीव्रता
  choice: संहार कर रही थी
  alternative: काट डाल रही थी / नष्ट कर रही थी
  rationale: כרת के इस प्रयोग में हिंसक उन्मूलन का आशय है। ‘संहार’ वध का अर्थ व्यक्त करता है, पर मूल ‘काट डालने’ के बिंब को पादटिप्पणी में संरक्षित किया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज कथात्मक शैली रखी गई है। ‘ईज़ेबेल’, ‘ओबद्याह’ और ‘यहवे’ स्रोत-नामों के स्पष्ट लिप्यंतरण हैं। दीर्घ वाक्य को डैश से व्यवस्थित किया गया है ताकि समूह-वितरण मुख्य क्रियाओं से स्पष्ट रूप से अलग दिखे।
