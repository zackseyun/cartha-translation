  text: וּ/קְרָאתֶ֞ם בְּ/שֵׁ֣ם אֱלֹֽהֵי/כֶ֗ם וַֽ/אֲנִי֙ אֶקְרָ֣א בְ/שֵׁם יְהוָ֔ה וְ/הָיָ֧ה הָ/אֱלֹהִ֛ים אֲשֶׁר יַעֲנֶ֥ה בָ/אֵ֖שׁ ה֣וּא הָ/אֱלֹהִ֑ים וַ/יַּ֧עַן כָּל הָ/עָ֛ם וַ/יֹּאמְר֖וּ ט֥וֹב הַ/דָּבָֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/024.yaml
  text: Then call on the name of your god[a], and I will call on the name of Yahweh; and the God who answers by fire, he is God." And all the people answered and said[b], "The word is good.
translation:
  language: hi
  text: “तब तुम अपने देवता[a] का नाम लेकर पुकारना, और मैं याहवे का नाम लेकर पुकारूँगा। जो देवता आग से उत्तर दे, वही परमेश्वर है।” तब सब लोगों ने उत्तर देकर कहा, “यह प्रस्ताव[b] अच्छा है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अपने देवताओं।” इब्रानी אֱלֹהֵיכֶם का रूप बहुवचन भी समझा जा सकता है, यद्यपि यहाँ प्रसंग एक देवता—बाल—की ओर संकेत करता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “यह बात अच्छी है।” इब्रानी דָּבָר का अर्थ “वचन,” “बात,” “मामला” या प्रसंगानुसार “प्रस्ताव” हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וּקְרָאתֶם בְּשֵׁם
  choice: नाम लेकर पुकारना
  rationale: कרא בְּשֵׁם किसी देवता के नाम का आह्वान करने का मुहावरा है। ‘नाम लेकर पुकारना’ आधुनिक हिन्दी में स्वाभाविक है और धार्मिक आह्वान का भाव बनाए रखता है।
- source_word: אֱלֹהֵיכֶם
  choice: अपने देवता
  rationale: אֱלֹהִים रूप की दृष्टि से बहुवचन हो सकता है, पर प्रसंग में बाल को एक देवता के रूप में पुकारने की बात है। ‘अपने’ हिन्दी में कर्ता और संबंध को स्वाभाविक रूप से जोड़ता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को उपाधि से बदलने के बजाय हिन्दी में लिप्यंतरित किया गया है।
- source_word: הָאֱלֹהִים אֲשֶׁר יַעֲנֶה בָאֵשׁ
  choice: जो परमेश्वर आग के द्वारा उत्तर दे
  rationale: בָאֵשׁ को साधनसूचक ‘आग के द्वारा’ समझा गया है। वाक्य प्रतियोगिता में उत्तर देने वाले को सच्चे परमेश्वर के रूप में पहचानता है।
- source_word: הוּא הָאֱלֹהִים
  choice: वही परमेश्वर है
  rationale: ज़ोर देने वाले सर्वनाम הוּא को ‘वही’ से व्यक्त किया गया है, जिससे निर्णायक पहचान का बल बना रहता है।
- source_word: טוֹב הַדָּבָר
  choice: यह प्रस्ताव अच्छा है
  rationale: इस प्रसंग में דָּבָר एलिय्याह द्वारा रखी गई परीक्षा की बात या प्रस्ताव को सूचित करता है। ‘प्रस्ताव’ साधारण हिन्दी में लोगों की सहमति को स्पष्ट करता है; व्यापक शाब्दिक संभावनाएँ पादटिप्पणी में दी गई हैं।
theological_decisions:
- issue: יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ व्यक्तिगत दिव्य नाम का प्रयोग करता है। ‘याहवे’ उसे नाम के रूप में बनाए रखता है, न कि किसी उपाधि से बदलता है।
- issue: אֱלֹהֵיכֶם एकवचन है या बहुवचन
  choice: अपने देवता
  alternative: अपने देवताओं
  rationale: शब्दरूप बहुवचन पढ़ा जा सकता है, लेकिन तत्कालीन प्रसंग में बाल नामक एक देवता और आगे का एकवचन क्रियापद एकवचन अर्थ का समर्थन करते हैं। वास्तविक भाषिक विकल्प पादटिप्पणी में सुरक्षित है।
- issue: उत्तर देने वाले के लिए הָאֱלֹהִים
  choice: परमेश्वर
  alternative: देवता
  rationale: खंड का निष्कर्ष उस सत्ता को सच्चे परमेश्वर के रूप में पहचानता है जो आग से उत्तर देती है। हिन्दी में ‘परमेश्वर’ इस निर्णायक विधेयार्थ को स्वाभाविक रूप से व्यक्त करता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सार्वजनिक पाठ के अनुकूल रखी गई है। ‘नाम लेकर पुकारना’ और ‘आग के द्वारा उत्तर दे’ मूल की संरचना तथा धार्मिक आह्वान को बनाए रखते हैं, जबकि ‘यह प्रस्ताव अच्छा है’ लोगों की सहमति को सहज हिन्दी में व्यक्त करता है।
