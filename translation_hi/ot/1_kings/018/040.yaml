base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/040.yaml
  text: Then Elijah said to them[a], “Seize the prophets of Baal; let not one of them escape.” And they seized them[b], and Elijah brought them down to the Kishon Wadi and slaughtered them there.
translation:
  language: hi
  text: तब एलिय्याह ने उनसे कहा, “बाल के नबियों को पकड़ लो; उनमें से एक भी बचकर न निकलने पाए।” उन्होंने उन्हें पकड़ लिया। फिर एलिय्याह उन्हें नीचे कीशोन की घाटी[a] में ले गया और वहाँ उनका वध कर दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “कीशोन की जलधारा” अथवा “कीशोन का नाला।” इब्रानी नाहल मौसमी जलधारा, उसके पाट या घाटी के लिए प्रयुक्त हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּפְשׂוּ / וַיִּתְפְּשׂוּם
  choice: पकड़ लो / पकड़ लिया
  rationale: תפשׂ यहाँ बलपूर्वक पकड़ने के अर्थ में है। आज्ञा और उसके पालन में एक ही हिन्दी क्रिया रखकर मूल की शब्दगत संगति सुरक्षित की गई है।
- source_word: נְבִיאֵי הַבַּעַל
  choice: बाल के नबियों
  rationale: इब्रानी संबंधसूचक पदबंध का सीधा और स्वाभाविक हिन्दी रूप।
- source_word: אִישׁ אַל יִמָּלֵט מֵהֶם
  choice: उनमें से एक भी बचकर न निकलने पाए
  rationale: אִישׁ यहाँ वितरणात्मक अर्थ में ‘एक भी’ है और מֵהֶם समूह में से किसी के निकल भागने को व्यक्त करता है। यह हिन्दी रूप अर्थ को स्वाभाविक ढंग से सुरक्षित रखता है।
- source_word: וַיּוֹרִדֵם
  choice: उन्हें नीचे ... ले गया
  rationale: यरद के हिफ़ील रूप का कारणवाचक और दिशासूचक भाव स्पष्ट रखा गया है।
- source_word: נַחַל קִישׁוֹן
  choice: कीशोन की घाटी
  rationale: נַחַל मौसमी जलधारा, उसका पाट अथवा घाटी सूचित कर सकता है। ‘घाटी’ हिन्दी पाठक के लिए सहज है, जबकि विकल्प पादटिप्पणी में दिए गए हैं।
- source_word: וַיִּשְׁחָטֵם
  choice: उनका वध कर दिया
  rationale: שׁחט के कठोर, हिंसक अर्थ को सामान्य ‘मार डाला’ से अधिक सटीक रूप में व्यक्त करता है; घटना को नरम नहीं किया गया।
- source_word: שָׁם
  choice: वहाँ
  rationale: स्थानवाचक क्रियाविशेषण का सीधा समतुल्य।
theological_decisions:
- issue: बाल के नबियों के विरुद्ध हिंसक कार्रवाई का वर्णन
  choice: एलिय्याह द्वारा उनका वध किए जाने की घटना को सीधे और स्पष्ट रूप में प्रस्तुत किया गया।
  alternative: ‘दंड दिया’ जैसे नरम शब्द का प्रयोग करना, अथवा पद में दैवी आदेश या अनुमोदन जोड़ना।
  rationale: इब्रानी पाठ पकड़ने और वध करने की घटना स्पष्टतः कहता है, पर इस पद में उसके लिए अलग से दैवी आदेश या नैतिक टिप्पणी नहीं जोड़ता। अनुवाद दोनों बातों को यथावत रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण कथात्मक शैली। हिंसा को न तो नरम किया गया है, न अतिरिक्त धर्मशास्त्रीय व्याख्या जोड़ी गई है।
