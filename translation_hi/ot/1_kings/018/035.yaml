  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और कथात्मक शैली। पानी की गति के लिए शाब्दिक ‘गया’ के बजाय प्रसंगानुकूल ‘बह गया’ चुना गया है; किसी व्याख्यात्मक या सम्प्रदायगत तत्व को नहीं जोड़ा गया।
