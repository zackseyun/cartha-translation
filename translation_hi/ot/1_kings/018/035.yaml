base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/035.yaml
  text: And the water went all around the altar[b][a], and it also filled the trench with water.
translation:
  language: hi
  text: और पानी वेदी के चारों ओर बह गया और उसने खाई को भी पानी से भर दिया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּלְכוּ
  choice: बह गया
  rationale: मूल क्रिया का शाब्दिक अर्थ ‘गया’ है, पर पानी के कर्ता होने पर हिन्दी में ‘बह गया’ उसकी गति को स्वाभाविक और सटीक ढंग से व्यक्त करता है।
- source_word: הַמַּיִם
  choice: पानी
  rationale: हिब्रू का बहुवचन-रूप संज्ञा यहाँ द्रव्यवाचक है; आधुनिक हिन्दी में ‘पानी’ स्वाभाविक रूप है।
- source_word: סָבִיב לַמִּזְבֵּחַ
  choice: वेदी के चारों ओर
  rationale: यह पद वेदी के आसपास चारों तरफ फैलने या बहने का स्थानिक भाव व्यक्त करता है।
- source_word: וְגַם
  choice: और ... भी
  rationale: दूसरे परिणाम को पहले के साथ जोड़ते हुए अतिरिक्त बल को सुरक्षित रखता है।
- source_word: אֶת־הַתְּעָלָה
  choice: खाई को
  rationale: इस प्रसंग में תְּעָלָה वेदी के चारों ओर खोदी गई खाई या नाली को दर्शाता है; ‘खाई’ सामान्य पाठक के लिए स्पष्ट और स्वाभाविक है।
- source_word: מִלֵּא
  choice: भर दिया
  rationale: हिब्रू की सकर्मक क्रिया ‘भरना’ का सीधा और प्रसंगानुकूल हिन्दी रूप।
- source_word: מָיִם
  choice: पानी से
  rationale: हिन्दी में किसी पात्र या खाई को भरने वाले पदार्थ के लिए ‘से’ आवश्यक और स्वाभाविक है।
