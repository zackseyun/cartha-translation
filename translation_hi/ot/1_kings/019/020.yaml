reference: 1 Kings 19:20
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יַּעֲזֹ֣ב אֶת הַ/בָּקָ֗ר וַ/יָּ֨רָץ֙ אַחֲרֵ֣י אֵֽלִיָּ֔הוּ וַ/יֹּ֗אמֶר אֶשְּׁקָה נָּא֙ לְ/אָבִ֣/י וּ/לְ/אִמִּ֔/י וְ/אֵלְכָ֖ה אַחֲרֶ֑י/ךָ וַ/יֹּ֤אמֶר ל/וֹ֙ לֵ֣ךְ שׁ֔וּב כִּ֥י מֶה עָשִׂ֖יתִי לָֽ/ךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/019/020.yaml
  text: So he left the oxen and ran after Elijah and said[a], “Please let me kiss my father and my mother, and then I will go after you.” And he said to him, “Go back[b], for what have I done to you?”
translation:
  language: hi
  text: तब वह बैलों को छोड़कर एलिय्याह के पीछे दौड़ा और बोला, “कृपया मुझे अपने पिता और अपनी माता को चूम लेने दें[a]; फिर मैं आपके पीछे चलूँगा।” एलिय्याह ने उससे कहा, “जा, लौट जा[b], क्योंकि मैंने तेरे साथ क्या किया है?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, अधिक सामान्य अर्थ में, “कृपया मुझे अपने पिता और अपनी माता से विदा ले लेने दें।” इब्रानी क्रिया का शाब्दिक अर्थ “चूमना” है।
    reason: lexical_alternative
  - marker: b
    text: एलिय्याह का उत्तर कठिन और संक्षिप्त है। इसका अर्थ “जा, लौट जा, क्योंकि मैंने तेरे लिए क्या किया है?” भी समझा गया है; सम्भव है कि यह एलीशा को निर्णय स्वयं करने के लिए छोड़ने का संक्षिप्त ढंग हो।
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעֲזֹב
  choice: छोड़कर
  rationale: עזב का सामान्य अर्थ ‘छोड़ना’ है; यहाँ यह बैलों से तत्काल अलग होने को स्वाभाविक ढंग से व्यक्त करता है, स्थायी त्याग का अनावश्यक संकेत नहीं देता।
- source_word: הַבָּקָר
  choice: बैलों
  rationale: בקר व्यापक रूप से मवेशियों को सूचित कर सकता है, पर पिछले पद में हल चलाने के प्रसंग के कारण यहाँ काम में लगे बैल अभिप्रेत हैं।
- source_word: וַיָּרָץ אַחֲרֵי
  choice: के पीछे दौड़ा
  rationale: यह मूल इब्रानी के स्थानगत अर्थ और पीछा करके पहुँचने की कथात्मक क्रिया, दोनों को सहज हिन्दी में बनाए रखता है।
- source_word: אֶשְּׁקָה נָּא
  choice: कृपया मुझे … को चूम लेने दीजिए
  rationale: נשק का ठोस अर्थ ‘चूमना’ है और נָא विनम्र अनुरोध दर्शाता है; विदाई का आशय टिप्पणी में दिया गया है, मुख्य पाठ में सामान्यीकृत नहीं किया गया।
- source_word: לְאָבִי וּלְאִמִּי
  choice: अपने पिता और अपनी माता को
  rationale: मूल पाठ दोनों माता-पिता का अलग-अलग उल्लेख करता है; हिन्दी में उसी स्पष्टता को रखा गया है।
- source_word: וְאֵלְכָה אַחֲרֶיךָ
  choice: फिर मैं आपके पीछे चलूँगा
  rationale: הלך אחרי में वास्तविक रूप से पीछे चलने और किसी की सेवा अथवा संगति में हो लेने, दोनों की ध्वनि हो सकती है। ‘पीछे चलूँगा’ इस बहुअर्थकता को स्वाभाविक हिन्दी में सँभालता है।
- source_word: לֵךְ שׁוּב
  choice: जा, लौट जा
  rationale: दोनों आज्ञार्थक क्रियाओं को रखकर मूल उत्तर की संक्षिप्तता और आकस्मिकता बचाई गई है; केवल ‘लौट जा’ कहने से पहली क्रिया लुप्त हो जाती।
- source_word: כִּי מֶה עָשִׂיתִי לָךְ
  choice: क्योंकि मैंने तेरे साथ क्या किया है?
  rationale: यह कठिन वाक्यांश का निकट और हिन्दी में बोधगम्य अनुवाद है। ‘तेरे साथ’ לָךְ के सम्भव प्रतिकूल अथवा हितकारी अर्थ को अनावश्यक रूप से तय नहीं करता।
theological_decisions:
- issue: एलिय्याह के उत्तर כִּי מֶה עָשִׂיתִי לָךְ का आशय
  choice: 'मुख्य पाठ में शाब्दिक प्रश्न रखा गया: ‘क्योंकि मैंने तेरे साथ क्या किया है?’'
  alternative: इसे अनुमति, हल्की झिड़की, निर्णय एलीशा पर छोड़ने, अथवा उस पर किए गए सांकेतिक कार्य का स्मरण कराने के अर्थ में समझा जा सकता है।
  rationale: इब्रानी कथन संक्षिप्त और वास्तव में अस्पष्ट है। किसी एक व्याख्या को मुख्य पाठ में जोड़ना उसके धर्मवैचारिक तथा कथात्मक तनाव को समय से पहले हल कर देता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और कथात्मक रखी गई है। एलीशा एलिय्याह को आदरसूचक ‘आप’ कहता है, जबकि वरिष्ठ एलिय्याह उसे प्रसंगानुकूल एकवचन ‘तू’ से सम्बोधित करता है। ‘जा, लौट जा’ मूल के दोहरे आज्ञार्थ और कठिन उत्तर की तीक्ष्णता को सुरक्षित रखता है।
