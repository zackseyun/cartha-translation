source:
  edition: WLC
  text: וְ/אַחַ֤ר הָ/רַ֨עַשׁ֙ אֵ֔שׁ לֹ֥א בָ/אֵ֖שׁ יְהוָ֑ה וְ/אַחַ֣ר הָ/אֵ֔שׁ ק֖וֹל דְּמָמָ֥ה דַקָּֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/019/012.yaml
  text: And after the earthquake[a], a fire; Yahweh was not in the fire. And after the fire, a sound of a gentle whisper.
translation:
  language: hi
  text: और भूकम्प के बाद आग हुई; आग में याहवे नहीं था। और आग के बाद सूक्ष्म सन्नाटे की एक ध्वनि हुई।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “एक धीमी, मंद वाणी,” “एक कोमल फुसफुसाहट,” अथवा पारंपरिक रूप में “एक धीमी, कोमल वाणी।” इब्रानी में शाब्दिक रूप से “सूक्ष्म सन्नाटे की ध्वनि” है—एक जानबूझकर नाजुक और कठिन अभिव्यक्ति।
    reason: alternative_reading
lexical_decisions:
- source_word: וְ/אַחַר
  choice: और … के बाद
  rationale: यह क्रमिक घटनाओं को जोड़ने वाला कथात्मक पद है; हिन्दी में यह रूप इब्रानी प्रवाह को स्वाभाविक ढंग से बनाए रखता है।
- source_word: הָ/רַעַשׁ
  choice: भूकम्प
  rationale: רַעַשׁ यहाँ तीव्र कम्पन या भूकम्प को दर्शाता है; इस ईश-प्रकटन क्रम में ‘भूकम्प’ स्पष्ट और स्वाभाविक है।
- source_word: אֵשׁ
  choice: आग
  rationale: यह क्रम में अगली प्राकृतिक घटना है; हिन्दी में अनिश्चित उपपद की आवश्यकता नहीं होती।
- source_word: לֹא בָ/אֵשׁ יְהוָה
  choice: पर आग में यहोवा नहीं था
  rationale: ב को स्थानवाचक ‘में’ के रूप में रखा गया है और वाक्य को स्वाभाविक हिन्दी के लिए ‘पर’ से जोड़ा गया है, बिना दिव्य उपस्थिति की प्रकृति की अतिरिक्त व्याख्या किए।
- source_word: יְהוָה
  choice: यहोवा
  rationale: चार-अक्षरीय निजी नाम को हिन्दी में प्रचलित प्रतिलेखन ‘यहोवा’ से व्यक्त किया गया है, किसी उपाधि से प्रतिस्थापित नहीं किया गया।
- source_word: קוֹל
  choice: ध्वनि
  rationale: קוֹל का अर्थ ‘ध्वनि’ या ‘वाणी’ हो सकता है। ‘ध्वनि’ स्पष्ट वाणी मान लेने से बचती और मूल की अस्पष्टता को बनाए रखती है।
- source_word: דְּמָמָה דַקָּה
  choice: धीमी फुसफुसाहट
  rationale: शाब्दिक अभिव्यक्ति ‘पतले/सूक्ष्म सन्नाटे की ध्वनि’ हिन्दी में अत्यंत अस्वाभाविक है। ‘धीमी फुसफुसाहट’ मूल की कोमलता और क्षीणता को सहज रूप में व्यक्त करती है; अधिक शाब्दिक रूप पादटिप्पणी में सुरक्षित है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: प्रभु
  rationale: मूल में निजी नाम सीधे आया है; इसलिए उसे उपाधि ‘प्रभु’ से बदलने के बजाय हिन्दी में परिचित नाम-रूप से रखा गया है।
- issue: קוֹל דְּמָמָה דַקָּה का कठिन और विरोधाभासी बिंब
  choice: एक धीमी फुसफुसाहट की ध्वनि
  alternative: एक सूक्ष्म सन्नाटे की ध्वनि / एक धीमी, मंद वाणी
  rationale: मुख्य पाठ में अर्थगम्य और स्वाभाविक हिन्दी दी गई है, जबकि पादटिप्पणी मूल के जानबूझकर नाजुक तथा कठिन शब्दचित्र और अन्य सम्भव अर्थों को सुरक्षित रखती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। घटनाक्रम की पुनरावृत्त संरचना सुरक्षित है। पादटिप्पणी-चिह्न उसी कठिन पदबंध के बाद रखा गया है जिससे वह सम्बद्ध है।
