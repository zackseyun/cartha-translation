base_translation:
  language: en
  yaml_path: translation/ot/1_kings/019/019.yaml
  text: So he went from there and found Elisha son of Shaphat[a], and he was plowing with twelve yoke-pairs before him, and he was with the twelfth[b]. Elijah passed by him and threw his cloak over him.
translation:
  language: hi
  text: तब वह वहाँ से चला और उसे शापात का पुत्र एलीशा मिला, जो खेत जोत रहा था। उसके आगे बारह जोड़ी बैल थे, और वह स्वयं बारहवीं जोड़ी के साथ था। एलिय्याह उसके पास से गुज़रा और अपना लबादा[a] उस पर डाल दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “चादर।” इब्रानी शब्द एक विशिष्ट बाहरी वस्त्र को दर्शाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ מִשָּׁם
  choice: तब वह वहाँ से चला गया
  rationale: वाव-क्रमिक कथा को आगे बढ़ाता है; ‘तब’ स्वाभाविक हिन्दी में क्रम दर्शाता है और מִשָּׁם का ‘वहाँ से’ सुरक्षित रखता है।
- source_word: וַיִּמְצָא אֶת אֱלִישָׁע בֶּן שָׁפָט
  choice: और उसे शापात का पुत्र एलीशा मिला
  rationale: מָצָא का सीधा अर्थ ‘मिलना/पाना’ है; हिन्दी में यह कर्तृवाचक ‘उसने पाया’ की अपेक्षा अधिक स्वाभाविक है और नाम-संबंध स्पष्ट रहता है।
- source_word: וְהוּא חֹרֵשׁ
  choice: वह ... खेत जोत रहा था
  rationale: कृदन्त चल रही क्रिया का दृश्य प्रस्तुत करता है; ‘जोत रहा था’ उसका कालगत-दुर्धर अर्थ स्वाभाविक हिन्दी में देता है।
- source_word: שְׁנֵים עָשָׂר צְמָדִים
  choice: बारह जोड़ी बैल
  rationale: צֶמֶד यहाँ हल चलाने वाले जुते पशुओं की जोड़ी को सूचित करता है। प्रसंग में निहित पशु को ‘बैल’ कहने से कृषि-दृश्य साधारण पाठक के लिए स्पष्ट होता है।
- source_word: לְפָנָיו
  choice: उसके आगे
  rationale: यह स्थानिक संबंध बताता है; हिन्दी वाक्य-रचना में एलीशा के उन दलों के पीछे होने को ‘बारह जोड़ी बैलों के पीछे’ कहकर स्वाभाविक रूप से व्यक्त किया गया है।
- source_word: וְהוּא בִּשְׁנֵים הֶעָשָׂר
  choice: और स्वयं बारहवीं जोड़ी के साथ था
  rationale: मूल की संक्षिप्त अभिव्यक्ति एलीशा की स्थिति बारहवीं जोड़ी के साथ बताती है; ‘स्वयं’ दोहराए गए וְהוּא के बल को दर्शाता है।
- source_word: וַיַּעֲבֹר אֵלִיָּהוּ אֵלָיו
  choice: एलिय्याह उसके पास से गुज़रा
  rationale: עָבַר אֶל निकट आकर पास से गुजरने की गति बताता है; यह अनुवाद आगामी संकेतात्मक क्रिया को बिना अतिरिक्त व्याख्या के रखता है।
- source_word: וַיַּשְׁלֵךְ אַדַּרְתּוֹ אֵלָיו
  choice: उसने अपनी चादर उस पर डाल दी
  rationale: אַדֶּרֶת एलिय्याह का विशिष्ट बाहरी वस्त्र है। ‘चादर’ आधुनिक हिन्दी में सहज है और ‘डाल दी’ संकेतात्मक क्रिया को किसी नियुक्ति-संबंधी व्याख्या में नहीं बदलता।
theological_decisions:
- issue: एलिय्याह के वस्त्र का संकेतात्मक महत्त्व
  choice: मुख्य पाठ में केवल यह क्रिया कही गई है कि उसने अपनी चादर एलीशा पर डाल दी।
  alternative: ‘भविष्यद्वक्ता का चोगा’ कहना या इसे ‘उत्तराधिकारी नियुक्त किया’ के रूप में व्याख्यायित करना।
  rationale: इस पद में इब्रानी पाठ संकेतात्मक कार्य का वर्णन करता है, पर उसका अर्थ स्पष्ट करके नहीं बताता। इसलिए धार्मिक आशय को संदर्भ पर छोड़ा गया है और व्याख्या मुख्य पाठ में नहीं जोड़ी गई।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण कथात्मक रूप अपनाया गया है। कृषि-दृश्य की स्पष्टता के लिए ‘बारह जोड़ी बैल’ और स्थानिक संबंध के लिए ‘पीछे’ रखा गया है। व्यक्तिनामों के प्रचलित हिन्दी बाइबलीय रूप ‘एलीशा,’ ‘शापात’ और ‘एलिय्याह’ प्रयुक्त हैं।
