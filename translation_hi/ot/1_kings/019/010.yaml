source:
  edition: WLC
  text: וַ/יֹּאמֶר֩ קַנֹּ֨א קִנֵּ֜אתִי לַ/יהוָ֣ה אֱלֹהֵ֣י צְבָא֗וֹת כִּֽי עָזְב֤וּ בְרִֽיתְ/ךָ֙ בְּנֵ֣י יִשְׂרָאֵ֔ל אֶת מִזְבְּחֹתֶ֣י/ךָ הָרָ֔סוּ וְ/אֶת נְבִיאֶ֖י/ךָ הָרְג֣וּ בֶ/חָ֑רֶב וָֽ/אִוָּתֵ֤ר אֲנִי֙ לְ/בַדִּ֔/י וַ/יְבַקְשׁ֥וּ אֶת נַפְשִׁ֖/י לְ/קַחְתָּֽ/הּ׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/019/010.yaml
  text: And he said[a], “I have been very zealous for Yahweh, the God of hosts, because the sons of Israel have forsaken your covenant, torn down your altars, and killed your prophets with the sword. I alone am left, and they seek my life[c][b], to take it.”
translation:
  language: hi
  text: उसने कहा, “मैं सेनाओं के परमेश्वर यहोवा के लिए अत्यन्त उत्साही रहा हूँ, क्योंकि इस्राएलियों ने आपकी वाचा त्याग दी, आपकी वेदियाँ ढा दीं और आपके नबियों को तलवार से मार डाला। केवल मैं ही बचा हूँ, और वे मेरे प्राण लेने के लिए मुझे ढूँढ़ रहे हैं।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: קַנֹּא קִנֵּאתִי
  choice: मैं…अत्यन्त उत्साही रहा हूँ
  rationale: सजातीय क्रियारूपों का यह संयोजन कथन को तीव्र करता है। ‘अत्यन्त उत्साही’ इस बल को स्वाभाविक हिन्दी में व्यक्त करता है; ‘ईर्ष्यालु’ यहाँ अनुचित अर्थ दे सकता है।
- source_word: לַיהוָה אֱלֹהֵי צְבָאוֹת
  choice: सेनाओं के परमेश्वर यहोवा के लिए
  rationale: यहोवा को व्यक्तिवाचक वाचा-नाम के रूप में रखा गया है और צְבָאוֹת के सैन्य/समूहवाचक अर्थ को ‘सेनाओं’ से सुरक्षित रखा गया है।
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: इस्राएलियों
  rationale: शाब्दिक ‘इस्राएल के पुत्रों’ के बजाय आधुनिक हिन्दी में पूरे वाचा-समुदाय के लिए स्वाभाविक सामूहिक पद।
- source_word: עָזְבוּ בְרִיתְךָ
  choice: आपकी वाचा त्याग दी
  rationale: עָזַב के छोड़ने/परित्याग करने और वाचा-विच्छेद की गंभीरता को संक्षेप में व्यक्त करता है।
- source_word: מִזְבְּחֹתֶיךָ הָרָסוּ
  choice: आपकी वेदियाँ ढा दीं
  rationale: הרס किसी निर्मित वस्तु को गिराने या ध्वस्त करने का बोध देता है; ‘ढा दीं’ वेदियों के संदर्भ में स्पष्ट और स्वाभाविक है।
- source_word: נְבִיאֶיךָ הָרְגוּ בֶחָרֶב
  choice: आपके नबियों को तलवार से मार डाला
  rationale: क्रिया और साधन दोनों को स्पष्ट रखते हुए मूल की हिंसक ठोसता सुरक्षित की गई है।
- source_word: וָאִוָּתֵר אֲנִי לְבַדִּי
  choice: केवल मैं ही बचा हूँ
  rationale: अֲנִי לְבַדִּי के एकाकीपन पर दिए गए बल को सहज हिन्दी में व्यक्त करता है।
- source_word: וַיְבַקְשׁוּ אֶת נַפְשִׁי לְקַחְתָּהּ
  choice: वे मेरे प्राण लेने के लिए मुझे ढूँढ़ रहे हैं
  rationale: נֶפֶשׁ यहाँ व्यक्ति का जीवन है। हिन्दी मुहावरा ‘प्राण लेना’ हत्या के आशय को स्पष्ट करता है और ‘ढूँढ़ रहे हैं’ जारी खोज को स्वाभाविक रूप देता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे / प्रभु
  rationale: मूल पाठ में वाचा-नाम सीधे प्रयुक्त है। हिन्दी में परिचित लिप्यंतरण ‘यहोवा’ उसे उपाधि ‘प्रभु’ में बदलने के बजाय नाम के रूप में सुरक्षित रखता है।
- issue: קנא का भाव
  choice: उत्साही
  alternative: ईर्ष्यालु
  rationale: कथन परमेश्वर के सम्मान और वाचा के प्रति एलिय्याह के प्रबल समर्पण को बताता है। ‘उत्साही’ इस अर्थ को व्यक्त करता है, फिर भी उसकी आत्म-मूल्यांकनात्मक शिकायत को मूल की तरह रहने देता है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी। परमेश्वर के लिए आदरसूचक ‘आप’ रखा गया है। ‘सेनाओं के परमेश्वर’ मूल उपाधि की छवि बचाता है; वाक्य में एलिय्याह की तीव्र शिकायत और अकेलेपन का बल बनाए रखा गया है।
