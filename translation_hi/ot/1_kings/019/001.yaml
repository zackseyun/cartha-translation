  yaml_path: translation/ot/1_kings/019/001.yaml
  text: Ahab told Jezebel all that Elijah had done, and how he had killed all the prophets with the sword.
translation:
  language: hi
  text: अहाब ने ईज़ेबेल को वह सब बताया जो एलिय्याह ने किया था, और यह भी कि उसने सभी भविष्यद्वक्ताओं को तलवार से कैसे मार डाला था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּגֵּד
  choice: बताया
  rationale: हिफ़ील क्रिया का स्वाभाविक और सटीक हिन्दी रूप; अहाब द्वारा ईज़ेबेल को पूरा वृत्तांत सुनाने का भाव देता है।
- source_word: בֶּחָרֶב
  choice: तलवार से
  rationale: हिब्रू में साधन सूचक प्रयोग को सीधे और स्पष्ट रूप में रखा गया है।
- source_word: הַנְּבִיאִים
  choice: भविष्यद्वक्ताओं
  rationale: निश्चित बहुवचन का औपचारिक रूप से निकट अनुवाद; इस पद में निहित समूह को अतिरिक्त व्याख्या जोड़कर सीमित नहीं किया गया।
theological_decisions:
- issue: दूसरे אֲשֶׁר खंड में कर्ता की पहचान
  choice: ‘उसने’ का निकटतम पूर्वपद एलिय्याह रखा गया
  alternative: अहाब अथवा अनिर्दिष्ट कर्ता
  rationale: हिब्रू वाक्यरचना और निकट संदर्भ में मारने की क्रिया का स्वाभाविक कर्ता एलिय्याह है; फिर भी हिन्दी में नाम दुहराने के बजाय मूल के सर्वनाम-सदृश प्रवाह को बनाए रखा गया।
- issue: ‘सभी भविष्यद्वक्ताओं’ की पहचान
  choice: मूल के सामान्य पद को यथावत रखा गया
  alternative: ‘बाल के सभी भविष्यद्वक्ताओं’
  rationale: संदर्भ से समूह स्पष्ट हो सकता है, पर इस पद के हिब्रू पाठ में ‘बाल के’ नहीं है; इसलिए व्याख्यात्मक जोड़ नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण कथात्मक शैली। ‘और यह भी कि…कैसे’ से दूसरे וְאֵת כָּל אֲשֶׁר खंड का स्वाभाविक हिन्दी प्रवाह व्यक्त किया गया है, बिना मूल कथन में अतिरिक्त विवरण जोड़े।
