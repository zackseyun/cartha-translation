source:
  edition: WLC
  text: וַ/יָּשָׁב֩ מַלְאַ֨ךְ יְהוָ֤ה שֵׁנִית֙ וַ/יִּגַּע בּ֔/וֹ וַ/יֹּ֖אמֶר ק֣וּם אֱכֹ֑ל כִּ֛י רַ֥ב מִמְּ/ךָ֖ הַ/דָּֽרֶךְ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/019/007.yaml
  text: Then the angel of Yahweh returned a second time and touched him and said[a], “Get up and eat, because the journey is too much for you.”
translation:
  language: hi
  text: तब याहवे का दूत[a] दूसरी बार लौटकर आया। उसने एलिय्याह को छुआ और कहा, “उठो और खाओ, क्योंकि यह यात्रा तुम्हारे लिए बहुत कठिन है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “याहवे का संदेशवाहक।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: लौटकर आया
  rationale: इस कथा-संदर्भ में שׁוב का अर्थ वापस आना है; ‘लौटकर आया’ स्वाभाविक आधुनिक हिन्दी है।
- source_word: מַלְאַךְ יְהוָה
  choice: याहवे का दूत
  rationale: מַלְאָךְ किसी संदेशवाहक या स्वर्गदूत को सूचित कर सकता है। इस ईश्वरीय दूत के संदर्भ में ‘दूत’ स्वाभाविक है और शब्द की कुछ व्यापकता भी बनाए रखता है; יְהוָה को उसके व्यक्तिगत नाम ‘याहवे’ के रूप में रखा गया है।
- source_word: שֵׁנִית
  choice: दूसरी बार
  rationale: यह शब्द पुनरावृत्ति को विशेष रूप से दूसरी बार के रूप में चिह्नित करता है।
- source_word: וַיִּגַּע בּוֹ
  choice: उसने एलिय्याह को छुआ
  rationale: शाब्दिक अर्थ ‘उसने उसे छुआ’ है। हिन्दी में संदर्भ स्पष्ट रखने के लिए सर्वनाम के स्थान पर ‘एलिय्याह’ रखा गया है, बिना कोई नई सूचना जोड़े।
- source_word: קוּם אֱכֹל
  choice: उठो और खाओ
  rationale: दोनों सीधे आदेश हैं; यह रूप आधुनिक, सहज और मूल की संक्षिप्तता के अनुरूप है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यह आदेश का कारण प्रस्तुत करता है।
- source_word: רַב מִמְּךָ הַדָּרֶךְ
  choice: यह यात्रा तुम्हारे लिए बहुत कठिन है
  rationale: इब्रानी मुहावरे का भाव है कि आगे की यात्रा एलिय्याह की वर्तमान क्षमता से अधिक है। ‘बहुत कठिन’ इस आशय को स्वाभाविक हिन्दी में व्यक्त करता है, केवल दूरी तक सीमित नहीं करता।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा / प्रभु
  rationale: मूल पाठ में चार-अक्षरी व्यक्तिगत ईश्वरीय नाम सीधे आया है; ‘याहवे’ उसे उपाधि में बदले बिना सुरक्षित रखता है।
- issue: מַלְאָךְ की पहचान
  choice: दूत
  alternative: संदेशवाहक
  rationale: संदर्भ एक ईश्वरीय दूत की ओर संकेत करता है, पर इब्रानी शब्द का मूल अर्थ ‘संदेशवाहक’ भी हो सकता है। मुख्य पाठ में प्रचलित ‘दूत’ और पादटिप्पणी में वैकल्पिक अर्थ देकर इस अर्थ-व्याप्ति को बनाए रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और कथात्मक रखी गई है। ‘एलिय्याह’ जोड़ने से हिन्दी में सर्वनाम-संदर्भ स्पष्ट होता है। आदेशों की संक्षिप्तता और कारणवाचक संबंध मूल के अनुरूप सुरक्षित हैं।
