  text: וַ/יֹּאמֶר֩ קַנֹּ֨א קִנֵּ֜אתִי לַ/יהוָ֣ה אֱלֹהֵ֣י צְבָא֗וֹת כִּֽי עָזְב֤וּ בְרִֽיתְ/ךָ֙ בְּנֵ֣י יִשְׂרָאֵ֔ל אֶת מִזְבְּחֹתֶ֣י/ךָ הָרָ֔סוּ וְ/אֶת נְבִיאֶ֖י/ךָ הָרְג֣וּ בֶ/חָ֑רֶב וָ/אִוָּתֵ֤ר אֲנִי֙ לְ/בַדִּ֔/י וַ/יְבַקְשׁ֥וּ אֶת נַפְשִׁ֖/י לְ/קַחְתָּֽ/הּ׀־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/019/014.yaml
  text: And he said[a], “I have been very zealous for Yahweh, the God of hosts, because the sons of Israel have forsaken your covenant, torn down your altars, and killed your prophets with the sword. I alone am left, and they seek my life[b], to take it.”
translation:
  language: hi
  text: उसने कहा, “मैं सेनाओं के परमेश्वर याहवे के लिए अत्यन्त उत्साही रहा हूँ[a], क्योंकि इस्राएलियों[b] ने आपकी वाचा त्याग दी, आपकी वेदियाँ ढा दीं और आपके नबियों को तलवार से मार डाला। केवल मैं ही बचा हूँ, और वे मेरे प्राण लेने के लिए मुझे ढूँढ़ रहे हैं।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मैं याहवे के लिए बहुत जलन रखता आया हूँ।” इब्रानी में एक ही धातु का अनन्त क्रियारूप और रूपांतरित क्रिया साथ प्रयोग करके कथन पर विशेष बल दिया गया है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में शब्दशः “इस्राएल के पुत्र”; यह पूरे इस्राएली समुदाय के लिए प्रयुक्त सामूहिक पद है।
    reason: lexical_alternative
lexical_decisions:
- source_word: קַנֹּא קִנֵּאתִי
  choice: अत्यन्त उत्साही रहा हूँ
  rationale: इब्रानी में क्रिया के साथ उसी धातु का infinitive absolute प्रयुक्त होकर कथन को बल देता है। ‘अत्यन्त उत्साही’ एलिय्याह की प्रबल वाचा-निष्ठा को सहज आधुनिक हिन्दी में व्यक्त करता है; ‘जलन’ अधिक शब्दशः विकल्प है।
- source_word: לַיהוָה
  choice: याहवे के लिए
  rationale: לְ यहाँ एलिय्याह के उत्साह का लक्ष्य बताता है, और יהוה को उसके व्यक्तिगत वाचा-नाम ‘याहवे’ के रूप में लिप्यंतरित किया गया है।
- source_word: אֱלֹהֵי צְבָאוֹת
  choice: सेनाओं के परमेश्वर
  rationale: यह स्थापित ईश्वरीय उपाधि है। ‘सेनाओं’ से צְבָאוֹת का सैन्य और स्वर्गीय दोनों संदर्भों के लिए खुला व्यापक अर्थ बना रहता है।
- source_word: עָזְבוּ בְרִיתְךָ
  choice: आपकी वाचा त्याग दी
  rationale: עָזַב का अर्थ छोड़ना या त्याग देना है। ‘वाचा त्याग दी’ इस्राएल के गंभीर वाचा-भंग को स्पष्ट और गरिमापूर्ण ढंग से व्यक्त करता है।
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: इस्राएलियों
  rationale: शब्दशः ‘इस्राएल के पुत्र’ राष्ट्र के लिए प्रचलित सामूहिक इब्रानी पद है। आधुनिक हिन्दी में ‘इस्राएलियों’ उसका स्वाभाविक और समावेशी जातीय अर्थ देता है।
- source_word: מִזְבְּחֹתֶיךָ הָרָסוּ
  choice: आपकी वेदियाँ ढा दीं
  rationale: הָרַס का अर्थ किसी निर्मित वस्तु को ढा देना या ध्वस्त करना है। ‘ढा दीं’ संक्षिप्त, सजीव और स्वाभाविक है।
- source_word: נְבִיאֶיךָ הָרְגוּ בֶחָרֶב
  choice: आपके नबियों को तलवार से मार डाला
  rationale: यह अनुवाद हत्या और उसके साधन दोनों को इब्रानी के समान स्पष्ट रखता है।
- source_word: וָאִוָּתֵר אֲנִי לְבַדִּי
  choice: केवल मैं ही बचा हूँ
  rationale: אֲנִי לְבַדִּי में एलिय्याह के अकेले रह जाने पर बल है। ‘केवल मैं ही’ उस बल को सहज हिन्दी में बनाए रखता है।
- source_word: וַיְבַקְשׁוּ אֶת נַפְשִׁי לְקַחְתָּהּ
  choice: वे मेरे प्राण लेने के लिए मुझे ढूँढ़ रहे हैं
  rationale: נֶפֶשׁ यहाँ अमूर्त ‘आत्मा’ नहीं बल्कि व्यक्ति का जीवन दर्शाता है। हिन्दी मुहावरे ‘प्राण लेना’ और ‘ढूँढ़ रहे हैं’ से खोजकर मार डालने के आशय तथा प्रयोजनवाचक infinitive दोनों सुरक्षित रहते हैं।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में चतुरक्षरीय व्यक्तिगत वाचा-नाम सीधे आया है। ‘याहवे’ उसका व्यापक रूप से स्वीकृत विद्वत्तापूर्ण लिप्यंतरण है और उसे केवल उपाधि में नहीं बदलता।
- issue: קַנֹּא קִנֵּאתִי में उत्साह और जलन का अर्थ-संबंध
  choice: अत्यन्त उत्साही रहा हूँ
  alternative: बहुत जलन रखता आया हूँ
  rationale: धातु קנא में ईर्ष्या/जलन और प्रबल निष्ठावान उत्साह दोनों अर्थ हो सकते हैं। इस संदर्भ में एलिय्याह याहवे के प्रति अपनी तीव्र निष्ठा बता रहा है; मुख्य पाठ में स्वाभाविक अर्थ रखा गया है और निकटतर शब्दशः विकल्प पादटिप्पणी में सुरक्षित है।
- issue: בְּנֵי יִשְׂרָאֵל का सामूहिक आशय
  choice: इस्राएली
  alternative: इस्राएल के पुत्र
  rationale: यह पद पूरे वाचा-समुदाय का जातीय नाम है, केवल पुरुष वंशजों का सीमित उल्लेख नहीं। स्वाभाविक हिन्दी सामूहिक रूप अर्थ को बिना अनावश्यक लैंगिक संकुचन के व्यक्त करता है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। परमेश्वर को संबोधित करने वाले एकवचन प्रत्ययों के लिए आदरसूचक ‘आपकी’ लिया गया है। ‘वाचा’, ‘वेदी’ और ‘नबी’ जैसे स्थापित बाइबिलीय शब्द अर्थ-सटीकता के कारण बनाए रखे गए हैं।
