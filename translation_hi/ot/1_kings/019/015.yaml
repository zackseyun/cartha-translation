base_translation:
  language: en
  yaml_path: translation/ot/1_kings/019/015.yaml
  text: And Yahweh said to him[a], “Go, return by your way to the wilderness of Damascus; and when you arrive[b], you shall anoint Hazael as king over Aram.”
translation:
  language: hi
  text: तब याहवे ने उससे कहा, “जा, अपने मार्ग पर लौट और दमिश्क के निर्जन प्रदेश[a] की ओर जा। वहाँ पहुँचकर हज़ाएल का अराम[b] के राजा के रूप में अभिषेक करना।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में ‘निर्जन प्रदेश’ शब्द पर दिशासूचक अंत लगा है; अर्थात् दमिश्क के निर्जन प्रदेश की ओर।
    reason: lexical_alternative
  - marker: b
    text: ‘अराम’ इब्रानी नाम है, जिसका अनुवाद प्रायः ‘सीरिया’ किया जाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत नाम को उपाधि से बदलने के बजाय देवनागरी में लिप्यंतरित किया गया है।
- source_word: לֵךְ שׁוּב
  choice: जा, ... लौटकर ... जा
  rationale: दोनों आज्ञार्थक क्रियाओं—‘जा’ और ‘लौट’—का अर्थ रखा गया है, साथ ही हिंदी वाक्य को स्वाभाविक बनाया गया है।
- source_word: לְדַרְכְּךָ
  choice: अपने मार्ग से
  rationale: इब्रानी पदबंध का अर्थ है कि एलिय्याह उसी अपने मार्ग से वापस जाए; हिंदी में इसे संक्षिप्त और स्वाभाविक रूप दिया गया है।
- source_word: מִדְבָּרָה דַמָּשֶׂק
  choice: दमिश्क के निर्जन प्रदेश की ओर
  rationale: מִדְבָּרָה में दिशासूचक अंत है, इसलिए गंतव्य की ओर गति को स्पष्ट रखा गया है; ‘निर्जन प्रदेश’ यहाँ केवल रेतीले मरुस्थल से अधिक व्यापक अर्थ देता है।
- source_word: וּבָאתָ
  choice: वहाँ पहुँचकर
  rationale: संयोजक सहित यह क्रिया आज्ञाओं के क्रम में अगले कार्य के लिए वहाँ पहुँचने को व्यक्त करती है।
- source_word: וּמָשַׁחְתָּ
  choice: अभिषेक करना
  rationale: संयोजक सहित पूर्ण क्रिया पहले आए आदेश को आगे बढ़ाती है; हिंदी में यह निर्देशात्मक आज्ञा के रूप में स्वाभाविक है।
- source_word: חֲזָאֵל
  choice: हज़ाएल
  rationale: व्यक्तिनाम का मानक देवनागरी लिप्यंतरण किया गया है।
- source_word: לְמֶלֶךְ עַל אֲרָם
  choice: अराम पर राजा के रूप में
  rationale: राजकीय नियुक्ति के सूत्र और עַל के शासन-संबंधी अर्थ को सुरक्षित रखा गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में चार-अक्षरी व्यक्तिगत नाम सीधे आया है। ‘याहवे’ उसे उपाधि से प्रतिस्थापित किए बिना प्रस्तुत करता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। एकवचन संबोधन के अनुरूप ‘तू’ वाले आज्ञार्थक रूप प्रयुक्त हुए हैं। पद में निहित दिशात्मकता और क्रमिक आदेश सुरक्षित रखे गए हैं।
