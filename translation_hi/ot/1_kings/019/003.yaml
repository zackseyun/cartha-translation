source:
  edition: WLC
  text: וַ/יַּ֗רְא וַ/יָּ֨קָם֙ וַ/יֵּ֣לֶךְ אֶל נַפְשׁ֔/וֹ וַ/יָּבֹ֕א בְּאֵ֥ר שֶׁ֖בַע אֲשֶׁ֣ר לִֽ/יהוּדָ֑ה וַ/יַּנַּ֥ח אֶֽת נַעֲר֖/וֹ שָֽׁם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/019/003.yaml
  text: And he saw, and arose and went for his life, and came to Beersheba, which belongs to Judah, and left his servant there.
translation:
  language: hi
  text: यह देखकर वह उठा और अपनी जान बचाने के लिए चला गया। वह यहूदा के बेर्शेबा पहुँचा और अपने सेवक को वहीं छोड़ दिया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּרְא
  choice: यह देखकर
  rationale: मसोरेटिक पाठ का शाब्दिक अर्थ ‘उसने देखा’ है। हिंदी में पूर्ववर्ती समाचार/धमकी के प्रति प्रतिक्रिया को स्वाभाविक ढंग से व्यक्त करने के लिए ‘यह देखकर’ चुना गया है, बिना क्रिया को हटाए।
- source_word: אֶל־נַפְשׁוֹ
  choice: अपनी जान बचाने के लिए
  rationale: मुहावरे का संदर्भगत अर्थ अपने प्राणों की रक्षा हेतु जाना है; केवल ‘अपनी जान के लिए’ आधुनिक हिंदी में अस्वाभाविक और अस्पष्ट होता।
- source_word: בְּאֵר שֶׁבַע
  choice: बेर्शेबा
  rationale: स्थान-नाम का प्रचलित हिंदी लिप्यंतरण।
- source_word: נַעֲרוֹ
  choice: अपने सेवक
  rationale: נַעַר का अर्थ युवक या परिचारक हो सकता है; इस यात्रा-संदर्भ में ‘सेवक’ उसकी भूमिका को स्वाभाविक रूप से व्यक्त करता है।
theological_decisions:
- issue: וַיַּרְא की पाठगत कठिनाई
  choice: यह देखकर
  alternative: वह डर गया
  rationale: WLC के व्यंजन-पाठ और स्वरांकन के अनुसार क्रिया ראה (‘देखना’) है। कुछ प्राचीन साक्ष्य और अनेक अनुवाद ‘वह डर गया’ मानते हैं, पर मुख्य पाठ में उपलब्ध हिब्रू रूप को सुरक्षित रखा गया है।
- issue: אֶל־נַפְשׁוֹ का आशय
  choice: अपनी जान बचाने के लिए
  alternative: अपनी इच्छा के अनुसार / अपने प्राण के पास
  rationale: ईज़ेबेल की धमकी के तत्काल संदर्भ में जीवन-रक्षा का अर्थ सबसे उपयुक्त है; इसे एलिय्याह की मनोदशा या धर्मवैज्ञानिक प्रेरणा से अधिक नहीं भरा गया।
- issue: אֲשֶׁר לִיהוּדָה का अनुवाद
  choice: यहूदा के बेर्शेबा
  alternative: बेर्शेबा, जो यहूदा का है
  rationale: संबंधवाचक उपवाक्य को संक्षिप्त स्वाभाविक हिंदी में रखा गया है और नगर का यहूदा से संबंध बना रहता है।
translation_notes:
  register: आधुनिक मानक हिंदी; सरल, गरिमापूर्ण कथात्मक शैली। हिब्रू की क्रमिक क्रियाओं को हिंदी के स्वाभाविक वाक्य-विन्यास में रखा गया है।
