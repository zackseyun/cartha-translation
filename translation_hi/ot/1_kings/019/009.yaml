  text: There he came to the cave and spent the night there. And behold[a], the word of Yahweh came to him and said to him, “What are you doing here, Elijah?”
translation:
  language: hi
  text: वहाँ वह गुफा तक पहुँचा और वहीं रात बिताई। और देखो[a], याहवे का वचन उसके पास आया और उससे कहा, “एलिय्याह, तुम यहाँ क्या कर रहे हो?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तब।” इब्रानी शब्द अचानक ध्यान आकर्षित करता है।
    reason: discourse_alternative
lexical_decisions:
- source_word: וַיָּבֹא שָׁם אֶל הַמְּעָרָה
  choice: वहाँ वह उस गुफा के पास पहुँचा
  rationale: בוא के साथ אֶל गंतव्य की ओर पहुँचने को व्यक्त करता है। ‘के पास पहुँचा’ स्वाभाविक हिन्दी है और यह अनावश्यक रूप से नहीं कहता कि वह उसी क्षण गुफा के भीतर गया। निश्चित उपपद को ‘उस गुफा’ से व्यक्त किया गया है।
- source_word: וַיָּלֶן שָׁם
  choice: और वहीं रात बिताई
  rationale: לון/לין का अर्थ रात ठहरना या रात बिताना है; ‘रात बिताई’ आधुनिक हिन्दी में स्पष्ट और सहज है।
- source_word: וְהִנֵּה
  choice: तभी
  rationale: הִנֵּה कथानक में अचानक ध्यान आकर्षित करता है। ‘तभी’ आधुनिक हिन्दी में उसके घटनात्मक और ध्यानाकर्षक बल को स्वाभाविक रूप से व्यक्त करता है।
- source_word: דְבַר יְהוָה
  choice: यहोवा का वचन
  rationale: यह प्रचलित भविष्यद्वाणी-सूत्र की संरचना और धार्मिक भार को बनाए रखता है; יְהוָה को व्यक्तिगत नाम ‘यहोवा’ के रूप में लिप्यंतरित किया गया है।
- source_word: אֵלָיו
  choice: उसके पास आया
  rationale: אֶל दिशात्मक संबंध बताता है। हिन्दी में वचन के आने के लिए ‘उसके पास आया’ स्वाभाविक है।
- source_word: וַיֹּאמֶר לוֹ
  choice: और उससे कहा
  rationale: इब्रानी क्रम में कहने का कर्ता निकटतम पद ‘यहोवा का वचन’ है। हिन्दी में ‘उससे कहा’ उस रचना को बनाए रखता है, यद्यपि अर्थतः यह यहोवा का संबोधन है।
- source_word: מַה לְּךָ פֹה
  choice: तुम यहाँ क्या कर रहे हो
  rationale: शाब्दिक मुहावरा ‘यहाँ तुम्हारे लिए क्या [है]?’ है। प्रसंग में यह एलिय्याह की यहाँ उपस्थिति पर प्रश्न करता है; चुना हुआ रूप आधुनिक हिन्दी में सबसे स्वाभाविक है, जबकि ‘तुम यहाँ क्यों हो?’ भी संभव है।
- source_word: אֵלִיָּהוּ
  choice: एलिय्याह
  rationale: नाम को हिन्दी बाइबलीय परंपरा के परिचित रूप में प्रस्तुत किया गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: मूल पाठ व्यक्तिगत चतुरक्षरीय नाम का प्रयोग करता है। ‘यहोवा’ हिन्दी पाठकों में परिचित नाम-रूप है और इसे केवल उपाधि ‘प्रभु’ से बदलने के बजाय व्यक्तिगत नाम के रूप में सुरक्षित रखता है।
- issue: דְבַר יְהוָה में बोलने वाले की प्रस्तुति
  choice: ‘यहोवा का वचन ... उससे कहा’ की मूल व्याकरणिक रचना बनाए रखना
  alternative: ‘यहोवा ने उससे कहा’
  rationale: मूल में ‘यहोवा का वचन’ कर्ता के रूप में आता है। इसे सरल करके सीधे ‘यहोवा ने कहा’ करना अर्थतः संभव है, पर मूल के विशिष्ट प्रकाशन-सूत्र को मिटा देगा।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी अपनाई गई है। वाक्य-क्रम कथात्मक प्रवाह के अनुकूल रखा गया है; भविष्यद्वाणी-सूत्र ‘यहोवा का वचन’ को औपचारिक रूप से सुरक्षित रखा गया है।
