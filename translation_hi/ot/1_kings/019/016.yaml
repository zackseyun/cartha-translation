  yaml_path: translation/ot/1_kings/019/016.yaml
  text: And you shall anoint Jehu son of Nimshi as king over Israel[a], and Elisha son of Shaphat from Abel-meholah you shall anoint as prophet in your place.
translation:
  language: hi
  text: तू निमशी के पुत्र येहू का इस्राएल पर राजा के रूप में अभिषेक कर, और आबेल-महोला निवासी शापात के पुत्र एलीशा का तेरे स्थान पर[a] नबी के रूप में अभिषेक कर।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “तेरे बाद” अथवा “तेरे बदले”; इब्रानी शब्द उत्तराधिकार या प्रतिस्थापन, दोनों का भाव व्यक्त कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּמְשַׁח
  choice: अभिषेक करना
  rationale: यह क़ाल अपूर्ण, द्वितीय पुरुष एकवचन रूप इस प्रसंग में निर्देश का कार्य करता है। हिंदी में संयुक्त निर्देशात्मक वाक्य के भीतर ‘अभिषेक करना’ स्वाभाविक रूप से आज्ञा व्यक्त करता है और दोनों समानांतर आदेशों को बनाए रखता है।
- source_word: לְמֶלֶךְ
  choice: राजा होने के लिए
  rationale: यहाँ לְ पद या भूमिका में नियुक्ति बताता है। ‘राजा होने के लिए’ आधुनिक हिंदी में स्पष्ट और स्वाभाविक है।
- source_word: עַל יִשְׂרָאֵל
  choice: इस्राएल पर
  rationale: राजकीय शासन के संदर्भ में עַל किसी प्रजा पर अधिकार सूचित करता है; ‘इस्राएल पर’ इस संबंध को संक्षेप और स्पष्ट रूप में रखता है।
- source_word: יֵהוּא בֶן נִמְשִׁי
  choice: निमशी के पुत्र येहू
  rationale: व्यक्तिनामों का प्रचलित हिंदी लिप्यंतरण किया गया है और בֶן की वंश-सूचक पहचान को ‘के पुत्र’ से सुरक्षित रखा गया है।
- source_word: מֵאָבֵל מְחוֹלָה
  choice: आबेल-महोला के
  rationale: מִן मूल स्थान या निवास-संबंध बताता है। व्यक्ति की स्थान-सूचक पहचान के रूप में ‘आबेल-महोला के’ हिंदी में ‘से’ की अपेक्षा अधिक स्वाभाविक है।
- source_word: לְנָבִיא
  choice: नबी होने के लिए
  rationale: לְ यहाँ नबी के पद पर नियुक्ति व्यक्त करता है; यह चयन अर्थ को सहज आधुनिक हिंदी में स्पष्ट करता है।
- source_word: תַּחְתֶּיךָ
  choice: अपने स्थान पर
  rationale: תַּחַת उत्तराधिकार या प्रतिस्थापन दोनों का भाव दे सकता है। ‘अपने स्थान पर’ मूल की इस व्यापकता को ‘अपने बाद’ या ‘अपने बदले’ की तुलना में बेहतर सुरक्षित रखता है।
- source_word: וְאֵת ... וְאֶת
  choice: और ... और
  rationale: אֵת का हिंदी में अलग अनुवाद नहीं किया गया; וְ से जुड़े दोनों आदेशों की समानांतर रचना ‘और ... और’ द्वारा रखी गई है।
theological_decisions:
- issue: תַּחְתֶּיךָ में एलिय्याह और एलीशा के संबंध का स्वरूप
  choice: ‘अपने स्थान पर’—एलीशा की नियुक्ति एलिय्याह के नबी-पद के उत्तराधिकारी के रूप में
  alternative: ‘अपने बाद’ मुख्यतः कालक्रम पर बल देता है; ‘अपने बदले’ अधिक तीव्र प्रतिस्थापन का संकेत दे सकता है।
  rationale: चुना हुआ वाक्यांश पदगत उत्तराधिकार को व्यक्त करता है, पर यह तय नहीं करता कि प्रतिस्थापन तत्काल है या केवल कालानुक्रमिक; इस प्रकार इब्रानी की वास्तविक अर्थ-सीमा बनी रहती है।
translation_notes:
  register: भाषा आधुनिक मानक हिंदी में सरल, गरिमापूर्ण और निर्देशात्मक रखी गई है। ‘तू’ को प्रत्यक्ष रूप से दोहराने के बजाय पिछले संदर्भ से समझे जाने वाले संयुक्त आदेश में ‘अभिषेक करना’ प्रयोग किया गया है। स्थान और व्यक्तिनामों के लिए प्रचलित बाइबलीय हिंदी लिप्यंतरण अपनाए गए हैं। फुटनोट चिह्न को ‘अपने स्थान पर’ के बाद रखा गया है, क्योंकि टिप्पणी תַּחְתֶּיךָ से संबंधित है, न कि ‘इस्राएल’ से।
