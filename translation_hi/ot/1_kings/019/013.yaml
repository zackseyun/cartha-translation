source:
  edition: WLC
  text: וַ/יְהִ֣י כִּ/שְׁמֹ֣עַ אֵלִיָּ֗הוּ וַ/יָּ֤לֶט פָּנָי/ו֙ בְּ/אַדַּרְתּ֔/וֹ וַ/יֵּצֵ֕א וַֽ/יַּעֲמֹ֖ד פֶּ֣תַח הַ/מְּעָרָ֑ה וְ/הִנֵּ֤ה אֵלָי/ו֙ ק֔וֹל וַ/יֹּ֕אמֶר מַה לְּ/ךָ֥ פֹ֖ה אֵלִיָּֽהוּ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/019/013.yaml
  text: And when Elijah heard it[a], he wrapped his face in his cloak, and went out and stood at the entrance of the cave. And behold, a voice came to him and said, “What are you doing here[b], Elijah?”
translation:
  language: hi
  text: जब एलिय्याह ने यह सुना[a], तो उसने अपने लबादे से अपना चेहरा ढक लिया। फिर वह बाहर निकला और गुफा के द्वार पर खड़ा हो गया। और देखो, एक आवाज़ उसके पास आई और बोली, “एलिय्याह, तू यहाँ क्या कर रहा है?[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में ‘सुना’ का कर्म स्पष्ट रूप से नहीं दिया गया है। संदर्भ में इसका संकेत ठीक पहले वर्णित ध्वनि या आवाज़ की ओर है।
    reason: alternative_reading
  - marker: b
    text: इसका अधिक शाब्दिक रूप हो सकता है, ‘यहाँ तेरा क्या काम है, एलिय्याह?’ इब्रानी मुहावरा इस स्थान पर एलिय्याह के काम या प्रयोजन के बारे में पूछता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּשְׁמֹעַ
  choice: जब ... ने यह सुना
  rationale: כ के साथ infinitive construct समयसूचक उपवाक्य बनाता है। इब्रानी में कर्म व्यक्त नहीं है; हिन्दी में स्वाभाविकता के लिए न्यूनतम संकेत ‘यह’ रखा गया है, बिना उसे ‘ध्वनि’ या ‘आवाज़’ के रूप में निश्चित किए।
- source_word: וַיָּלֶט פָּנָיו בְּאַדַּרְתּוֹ
  choice: उसने अपने लबादे से अपना चेहरा ढक लिया
  rationale: क्रिया निकटता से लपेटने या ढकने का भाव देती है। ‘लबादा’ विशिष्ट बाहरी वस्त्र के लिए आधुनिक और सुबोध शब्द है; पूरा वाक्यांश हिन्दी में शारीरिक क्रिया को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: וַיֵּצֵא
  choice: वह बाहर निकला
  rationale: यह गुफा के भीतर से बाहर की ओर साधारण कथात्मक गति को व्यक्त करता है।
- source_word: וַיַּעֲמֹד
  choice: खड़ा हो गया
  rationale: यहाँ क्रिया किसी स्थान पर जाकर खड़े होने या अपना स्थान लेने को दर्शाती है; हिन्दी में ‘खड़ा हो गया’ इस क्रमिक क्रिया को सहज रूप से व्यक्त करता है।
- source_word: פֶּתַח הַמְּעָרָה
  choice: गुफा के द्वार पर
  rationale: פֶּתַח का अर्थ खुला स्थान या प्रवेश-द्वार है। ‘गुफा का द्वार’ आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: וְהִנֵּה
  choice: और देखो
  rationale: הִנֵּה कथन को सजीव और ध्यानाकर्षक बनाता है। ‘और देखो’ इस प्रवचनात्मक प्रभाव को बनाए रखता है, जबकि ‘अचानक’ जैसा अतिरिक्त अर्थ नहीं जोड़ता।
- source_word: אֵלָיו קוֹל
  choice: एक आवाज़ उसके पास आई
  rationale: मूल में यह क्रियारहित संरचना है—शाब्दिक रूप से ‘देखो, उसकी ओर/उसके पास एक आवाज़।’ चुना हुआ रूप हिन्दी में इसे स्वाभाविक बनाते हुए आवाज़ द्वारा उसे संबोधित किए जाने का भाव रखता है।
- source_word: מַה לְּךָ פֹה
  choice: तू यहाँ क्या कर रहा है?
  rationale: यह इब्रानी मुहावरा इस स्थान पर एलिय्याह के काम, प्रयोजन या उपस्थिति के औचित्य के बारे में पूछता है। यह रूप ‘तू यहाँ क्यों है?’ की तुलना में भाव को केवल कारण तक सीमित नहीं करता।
- source_word: אֵלִיָּהוּ
  choice: एलिय्याह
  rationale: नाम का रूप आधुनिक हिन्दी बाइबलीय परंपरा के अनुरूप लिप्यंतरित किया गया है।
theological_decisions:
- issue: ‘सुना’ के बाद निहित कर्म
  choice: यह सुना
  alternative: उस ध्वनि को सुना / वह आवाज़ सुनी
  rationale: इस पद में इब्रानी पाठ कर्म को स्पष्ट नहीं करता, यद्यपि पिछला संदर्भ उसका संकेत देता है। ‘यह’ हिन्दी में आवश्यक स्वाभाविकता देता है, पर यह निर्धारित नहीं करता कि संकेत पिछले पद की ‘ध्वनि’ की ओर है या ‘आवाज़’ की ओर; इस प्रकार कथात्मक और धर्मवैचारिक तनाव सुरक्षित रहता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। परमेश्वर द्वारा एलिय्याह को सीधे संबोधित किए जाने के प्रसंग में एकवचन ‘तू’ अपनाया गया है, जो हिन्दी बाइबलीय शैली में निकट और अधिकारपूर्ण संबोधन को व्यक्त करता है।
