base_translation:
  language: en
  yaml_path: translation/ot/1_kings/019/018.yaml
  text: Yet I have left for myself seven thousand in Israel—all the knees that have not bowed to Baal[b][a], and every mouth that has not kissed him.
translation:
  language: hi
  text: फिर भी मैंने इस्राएल में अपने लिए सात हज़ार जन बचाकर रखे हैं[a]—वे सभी जिनके घुटने बाल के सामने नहीं झुके, और जिनके मुँह ने उसे नहीं चूमा[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मैंने इस्राएल में अपने लिए सात हज़ार जन शेष रखे हैं।”
    reason: lexical_alternative
  - marker: b
    text: किसी मूर्ति को चूमना उसके प्रति श्रद्धा या उपासना का कार्य था।
    reason: cultural_note
lexical_decisions:
- source_word: וְהִשְׁאַרְתִּי
  choice: फिर भी मैं ... अपने लिए ... बचा रखूँगा
  rationale: שׁאר के हिफ़ील प्रथम पुरुष एकवचन का अर्थ किसी को शेष रहने देना या सुरक्षित रखना है। प्रसंग में परमेश्वर का उत्तर एलिय्याह की शिकायत के प्रतिकूल है, इसलिए וְ को ‘फिर भी’ कहा गया। हिब्रू पूर्ण रूप को यहाँ निश्चित भावी परिणाम के रूप में समझना स्वाभाविक है; वैकल्पिक पूर्णकालीन अर्थ पादटिप्पणी में रखा गया है।
- source_word: בְיִשְׂרָאֵל
  choice: इस्राएल में
  rationale: स्थानसूचक पदबंध का सीधा और स्वाभाविक अनुवाद।
- source_word: שִׁבְעַת אֲלָפִים
  choice: सात हज़ार लोगों को
  rationale: संख्या का स्वाभाविक हिन्दी रूप। ‘लोगों को’ आगे आने वाले ‘घुटने’ और ‘मुँह’ से संकेतित व्यक्तियों को स्पष्ट करता है, बिना शारीरिक बिंब मिटाए।
- source_word: כָּל הַבִּרְכַּיִם
  choice: वे सभी घुटने
  rationale: मूल का ठोस शारीरिक बिंब सुरक्षित रखा गया है; यह उन लोगों के लिए लक्षणा है जिन्होंने आराधना में घुटने नहीं टेके।
- source_word: אֲשֶׁר לֹא כָרְעוּ לַבַּעַל
  choice: जो बाल के आगे नहीं झुके
  rationale: כרע झुकने या घुटने टेकने को दर्शाता है। ‘बाल के आगे’ उपासना और अधीनता की दिशा को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: הַבַּעַל
  choice: बाल
  rationale: हिब्रू में उपपद होने पर भी हिन्दी बाइबलीय प्रयोग में देवता का नाम ‘बाल’ स्वाभाविक है; ‘उस बाल’ भ्रामक और असहज होता।
- source_word: וְכָל הַפֶּה
  choice: और हर वह मुँह
  rationale: एकवचन सामूहिक रूप का वितरणात्मक अर्थ रखते हुए ‘मुँह’ का ठोस और समानांतर बिंब बचाया गया है।
- source_word: אֲשֶׁר לֹא נָשַׁק לוֹ
  choice: जिसने उसे नहीं चूमा
  rationale: נשׁק का सीधा अर्थ ‘चूमना’ है। सर्वनाम मूल के לוֹ को दर्शाता है और उसका पूर्वपद बाल स्पष्ट है; सांस्कृतिक आशय पादटिप्पणी में दिया गया है।
theological_decisions:
- issue: विश्वासयोग्य बचे हुए लोगों के कथन में बाद की पारिभाषिक धर्मवैज्ञानिक भाषा न जोड़ना
  choice: अपने लिए सात हज़ार लोगों को बचा रखूँगा
  alternative: अपने लिए सात हज़ार लोगों को बचा रखा है
  rationale: अनुवाद परमेश्वर द्वारा लोगों को शेष रखने का भाव व्यक्त करता है, पर ‘शेष समुदाय’ जैसी तकनीकी शब्दावली नहीं जोड़ता। क्रिया के कालगत अर्थ की वास्तविक अस्पष्टता पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज किंतु गरिमापूर्ण रूप अपनाया गया है। ‘घुटने’ और ‘मुँह’ के मूल बिंब बनाए रखे गए हैं। मुख्य पाठ में भावी अर्थ चुना गया है, जबकि हिब्रू पूर्ण क्रिया से संभव पूर्णकालीन अर्थ पादटिप्पणी में दिया गया है।
