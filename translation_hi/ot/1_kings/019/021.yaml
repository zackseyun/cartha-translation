base_translation:
  language: en
  yaml_path: translation/ot/1_kings/019/021.yaml
  text: Then he turned back from following him[a], took the pair of oxen, and sacrificed them. With the oxen’s equipment he boiled the flesh and gave it to the people, and they ate[b]. Then he arose and went after Elijah and served him.
translation:
  language: hi
  text: तब वह उसके पीछे चलना छोड़कर लौट आया, बैलों की उस जोड़ी[a] को लिया और उनका बलिदान किया। बैलों के साज-सामान[b] से उसने मांस पकाया और लोगों को दिया, और उन्होंने खाया। फिर वह उठा, एलिय्याह के पीछे चला गया और उसकी सेवा की।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “बैलों का जुआ।”
    reason: צֶמֶד के वैकल्पिक अर्थ को सुरक्षित रखता है; संदर्भ में जोते हुए बैलों की जोड़ी अभिप्रेत है।
  - marker: b
    text: या, “बैलों के जुए/उपकरणों से।”
    reason: כְּלִי के व्यापक अर्थ तथा उपकरणों में जुए के संभावित समावेश को सुरक्षित रखता है।
lexical_decisions:
- source_word: וַיָּשָׁב מֵאַחֲרָיו
  choice: तब वह उसके पीछे से लौट गया
  rationale: इब्रानी मुहावरे की दिशात्मक छवि को बनाए रखता है और पिछले पद में एलीशा के एलिय्याह के पीछे दौड़ने के संदर्भ में स्वाभाविक हिंदी देता है।
- source_word: צֶמֶד הַבָּקָר
  choice: बैलों की उस जोड़ी
  rationale: צֶמֶד यहाँ साथ जोते जाने वाले दो बैलों की जोड़ी को सूचित करता है; वध किए जाने वाले पशुओं को हिंदी में स्पष्ट रूप से व्यक्त करता है।
- source_word: וַיִּזְבָּחֵהוּ
  choice: उनका बलिदान किया
  rationale: זבח में बलिदानात्मक वध का भाव है। हिंदी का बहुवचन उस सामूहिक एकवचन प्रत्यय के पूर्वपद, बैलों की जोड़ी, के अनुसार है।
- source_word: וּבִכְלִי הַבָּקָר
  choice: बैलों के साज-सामान से
  rationale: כְּלִי का अर्थ उपकरण या सामान हो सकता है; संदर्भ में बैलों के साथ प्रयुक्त लकड़ी का जुआ और अन्य औजार ईंधन के रूप में काम आते हैं। 'साज-सामान' अर्थ को अनावश्यक रूप से संकीर्ण नहीं करता।
- source_word: בִּשְּׁלָם הַבָּשָׂר
  choice: उसने मांस पकाया
  rationale: בשל उबालने या सामान्यतः पकाने का अर्थ दे सकता है। 'पकाया' आधुनिक हिंदी में स्वाभाविक है और विधि को इब्रानी से अधिक निश्चित नहीं बनाता।
- source_word: לָעָם
  choice: लोगों को
  rationale: स्थानीय समुदाय को सीधे और सहज ढंग से व्यक्त करता है।
- source_word: וַיָּקָם
  choice: फिर वह उठा
  rationale: कथात्मक क्रम को सरल, dignified आधुनिक हिंदी में बनाए रखता है।
- source_word: וַיֵּלֶךְ אַחֲרֵי אֵלִיָּהוּ
  choice: एलिय्याह के पीछे चला गया
  rationale: मूल की भौतिक 'पीछे जाने' वाली छवि को बनाए रखता है और आरंभिक वाक्यांश से प्रतिध्वनि स्थापित करता है।
- source_word: וַיְשָׁרְתֵהוּ
  choice: उसकी सेवा करने लगा
  rationale: שרת की व्यापक सेवा या परिचर्या को व्यक्त करता है; आरंभिक क्रिया के कथात्मक परिणाम को स्वाभाविक हिंदी में दर्शाता है।
theological_decisions:
- issue: זבח में निहित बलिदानात्मक भाव को स्पष्ट करना
  choice: '''उनका बलिदान किया'''
  alternative: '''उन्हें वध किया'''
  rationale: क्रिया में सामान्य वध से अधिक बलिदानात्मक संबंध है और सामुदायिक भोजन का संदर्भ इसे समर्थन देता है। फिर भी पाठ यह नहीं जोड़ता कि बलिदान किसे या किस औपचारिक धार्मिक स्थान पर चढ़ाया गया।
- issue: שרת को धार्मिक सेवकाई के विशेष अर्थ तक सीमित करना या सामान्य परिचर्या रहने देना
  choice: '''उसकी सेवा करने लगा'''
  alternative: '''उसका सेवक बन गया'''
  rationale: मूल क्रिया सेवा का प्रकार खुला छोड़ती है; चुना हुआ अनुवाद एलीशा की परिचर भूमिका दिखाता है, पर कोई विशेष पद या धार्मिक पदवी आरोपित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिंदी, सरल किंतु गरिमापूर्ण कथात्मक शैली। 'एलिय्याह' प्रचलित हिंदी बाइबलीय नामरूप है। स्रोत में ऐसी कोई अनिवार्य पाठगत या अर्थगत अस्पष्टता नहीं मिली जिसके लिए पादटिप्पणी आवश्यक हो; इसलिए मुख्य पाठ में कोई पादटिप्पणी-चिह्न नहीं जोड़ा गया।
