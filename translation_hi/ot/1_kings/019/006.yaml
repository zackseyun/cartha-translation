  yaml_path: translation/ot/1_kings/019/006.yaml
  text: He looked[a], and behold, at his head was a cake baked on hot stones and a jar of water. He ate and drank and lay down again.
translation:
  language: hi
  text: उसने देखा—और देखो, उसके सिरहाने गरम पत्थरों पर[a] पकी हुई एक रोटी और पानी की एक सुराही रखी थी। उसने खाया-पिया और फिर लेट गया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अंगारों पर पकी हुई रोटी।” इब्रानी शब्द רְצָפִים से पकाने के लिए प्रयुक्त गरम पत्थर अभिप्रेत हो सकते हैं, पर इसका अनुवाद “अंगारे” भी किया जाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּבֵּט
  choice: उसने देखा
  rationale: נבט का सामान्य अर्थ ‘देखना’ है; इसमें मूल पाठ में निहित न होने वाली दिशा नहीं जोड़ी गई।
- source_word: וְהִנֵּה
  choice: और देखो
  rationale: הִנֵּה दृश्य की ओर तुरंत ध्यान खींचता है; ‘और देखो’ उसकी सजीवता को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: מְרַאֲשֹׁתָיו
  choice: उसके सिरहाने
  rationale: यह शब्द सिर के पास की जगह को सूचित करता है; लेटे हुए व्यक्ति के संदर्भ में ‘सिरहाने’ सहज और सटीक है।
- source_word: עֻגַת רְצָפִים
  choice: गरम पत्थरों पर पकी हुई एक रोटी
  rationale: עֻגָה गोल रोटी या रोटी-जैसी टिकिया है, और רְצָפִים संभवतः पकाने में प्रयुक्त तपे हुए पत्थरों को दर्शाता है। ‘रोटी’ आधुनिक हिन्दी में मीठे केक का भ्रम टालती है।
- source_word: וְצַפַּחַת מָיִם
  choice: पानी की एक सुराही
  rationale: צַפַּחַת पानी रखने के छोटे पात्र को दर्शाता है; ‘सुराही’ सामान्य, दृश्यात्मक और प्रसंगानुकूल हिन्दी है।
- source_word: וַיֹּאכַל וַיֵּשְׁתְּ
  choice: उसने खाया-पिया
  rationale: दो क्रमिक क्रियाओं को हिन्दी के सहज संयुक्त प्रयोग में संक्षेप और लय के साथ व्यक्त किया गया है।
- source_word: וַיָּשָׁב וַיִּשְׁכָּב
  choice: और फिर लेट गया
  rationale: שׁוּב के साथ שׁכב का अर्थ दोबारा लेटना है; ‘फिर लेट गया’ मूल भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
