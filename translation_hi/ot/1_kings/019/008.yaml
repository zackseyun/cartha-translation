base_translation:
  language: en
  yaml_path: translation/ot/1_kings/019/008.yaml
  text: So he arose and ate and drank[a], and went in the strength of that food forty days and forty nights to Horeb, the mountain of God.
translation:
  language: hi
  text: तब वह उठा, खाया और पीया; और उस भोजन की शक्ति से[a] वह चालीस दिन और चालीस रात चलता हुआ परमेश्वर के पर्वत होरेब तक गया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उस भोजन के सहारे।”
    reason: “उस भोजन की शक्ति से” के लिए इब्रानी बְּכֹחַ הָאֲכִילָה הַהִיא का स्वाभाविक मुहावरेदार विकल्प।
lexical_decisions:
- source_word: וַיָּקָם וַיֹּאכַל וַיִּשְׁתֶּה
  choice: तब वह उठा और उसने खाया-पिया
  rationale: क्रमिक कथात्मक क्रियाओं को सहज आधुनिक हिन्दी में रखा गया है; संयुक्त 'खाया-पिया' मूल की दोनों स्पष्ट क्रियाओं को संक्षेप और स्वाभाविकता से व्यक्त करता है।
- source_word: וַיֵּלֶךְ
  choice: चलता रहा और ... तक पहुँचा
  rationale: הלך का मूल अर्थ 'जाना/चलना' है। चालीस दिन और रात की अवधि तथा עַד से सूचित गंतव्य को हिन्दी में स्वाभाविक रूप से व्यक्त करने के लिए निरंतर यात्रा और उसके अंतिम बिंदु दोनों दर्शाए गए हैं।
- source_word: בְּכֹחַ הָאֲכִילָה הַהִיא
  choice: उस भोजन से मिली शक्ति के सहारे
  rationale: यह वाक्यांश उस खाए हुए भोजन से प्राप्त पोषण या सामर्थ्य बताता है। यह रूप शाब्दिक अर्थ के निकट रहते हुए सामान्य हिन्दी में स्पष्ट है।
- source_word: אַרְבָּעִים יוֹם וְאַרְבָּעִים לַיְלָה
  choice: चालीस दिन और चालीस रात
  rationale: मूल की मानक अवधि-अभिव्यक्ति को सीधे और पारंपरिक ढंग से रखा गया है।
- source_word: עַד הַר הָאֱלֹהִים חֹרֵב
  choice: परमेश्वर के पर्वत होरेब तक
  rationale: עַד गंतव्य की सीमा बताता है; construct phrase को 'परमेश्वर के पर्वत' और स्थाननाम חֹרֵב को प्रचलित हिन्दी लिप्यंतरण 'होरेब' से व्यक्त किया गया है।
theological_decisions:
- issue: הַר הָאֱלֹהִים में אֱלֹהִים का अर्थ
  choice: परमेश्वर के पर्वत
  alternative: ईश्वरीय पर्वत
  rationale: इस स्थापित बाइबलीय पदनाम में व्यक्तिगत संदर्भ इस्राएल के परमेश्वर की ओर है; 'परमेश्वर' इसे स्पष्ट रखता है, जबकि 'ईश्वरीय' अनावश्यक रूप से गुणवाचक अर्थ दे सकता है।
