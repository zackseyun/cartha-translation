  yaml_path: translation/ot/1_kings/019/002.yaml
  text: Then Jezebel sent a messenger to Elijah[a], saying, “So may the gods do, and more also, if by this time tomorrow I do not make your life like the life of one of them.”
translation:
  language: hi
  text: तब ईज़ेबेल ने एलिय्याह के पास एक दूत भेजकर कहलवाया, “देवता मेरे साथ ऐसा ही करें, और इससे भी अधिक करें, यदि कल इसी समय तक मैं तुम्हारा जीवन उन लोगों में से किसी एक के जीवन के समान न कर दूँ।”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तो परमेश्वर मेरे साथ ऐसा ही, वरन् इससे भी अधिक करे।” इब्रानी शब्द אֱלֹהִים का अर्थ एकवचन ‘परमेश्वर’ या बहुवचन ‘देवता’ हो सकता है; यहाँ उससे जुड़ी बहुवचन क्रियाएँ और ईज़ेबेल का संदर्भ ‘देवता’ अर्थ का समर्थन करते हैं।
    reason: alternative_reading
lexical_decisions:
- source_word: וַתִּשְׁלַח
  choice: तब ... भेजकर कहलवाया
  rationale: वय्यिक्तोल कथा को आगे बढ़ाता है; ‘तब’ स्वाभाविक हिन्दी क्रम दर्शाता है। ‘दूत भेजकर कहलवाया’ לֵאמֹר सहित पूरे वाक्य-विन्यास को मुहावरेदार हिन्दी में व्यक्त करता है।
- source_word: מַלְאָךְ
  choice: दूत
  rationale: राजकीय और मानवीय प्रसंग में यह अलौकिक स्वर्गदूत नहीं, संदेश ले जाने वाला व्यक्ति है।
- source_word: כֹּה יַעֲשׂוּן אֱלֹהִים וְכֹה יוֹסִפוּן
  choice: तो देवता मेरे साथ ऐसा ही, वरन् इससे भी अधिक करें
  rationale: यह शापयुक्त शपथ का प्रचलित सूत्र है। ‘मेरे साथ’ इब्रानी मुहावरे में निहित शाप-लक्ष्य को हिन्दी में स्पष्ट करता है; ‘वरन् इससे भी अधिक’ दूसरे खंड की तीव्रता बनाए रखता है।
- source_word: אֱלֹהִים
  choice: देवता
  rationale: बहुवचन क्रियाएँ יַעֲשׂוּן और יוֹסִפוּן तथा ईज़ेबेल का धार्मिक-सांस्कृतिक संदर्भ यहाँ बहुवचन अर्थ का समर्थन करते हैं।
- source_word: כִּי כָעֵת מָחָר
  choice: यदि कल इसी समय तक
  rationale: शपथ-सूत्र में כִּי शर्त प्रस्तुत करता है और כָעֵת מָחָר अगले दिन के इसी समय की समय-सीमा बताता है।
- source_word: אָשִׂים אֶת־נַפְשְׁךָ כְּנֶפֶשׁ אַחַד מֵהֶם
  choice: मैं तुम्हारा हाल उन लोगों में से किसी एक के जैसा न कर दूँ
  rationale: शाब्दिक ‘तुम्हारे प्राण को उनमें से एक के प्राण जैसा कर दूँ’ हिन्दी में अस्वाभाविक है। ‘तुम्हारा हाल ... जैसा’ मृत्यु की धमकी को स्पष्ट रखता है, पर सीधे ‘तुम्हें मार न डालूँ’ कहकर इब्रानी तुलना को मिटाता नहीं।
theological_decisions:
- issue: ईज़ेबेल की शपथ में אֱלֹהִים का वचन
  choice: बहुवचन ‘देवता’
  alternative: एकवचन ‘परमेश्वर’
  rationale: संज्ञा दोनों अर्थ दे सकती है, पर यहाँ उससे जुड़ी दोनों क्रियाएँ बहुवचन हैं और वक्ता ईज़ेबेल है। इसलिए मुख्य पाठ में बहुवचन रखा गया है, जबकि वास्तविक वैकल्पिक पाठ को पादटिप्पणी में सुरक्षित रखा गया है।
- issue: शपथ में शाप का अप्रकट लक्ष्य
  choice: ‘मेरे साथ’ को स्पष्ट किया गया
  alternative: ‘देवता ऐसा ही करें’
  rationale: मूल में कर्म अप्रकट है, पर शपथ-सूत्र का अर्थ वक्ता पर दैवी दंड बुलाना है। हिन्दी में इसे छोड़ा जाए तो वाक्य अधूरा और अस्पष्ट लगेगा।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सहज हिन्दी। ‘ईज़ेबेल’, ‘एलिय्याह’ और ‘दूत’ प्रचलित बाइबलीय नामावली रखते हैं। शपथ की औपचारिक तीव्रता के लिए ‘वरन्’ प्रयुक्त है; वाक्य को सहज बनाने के लिए ‘भेजकर कहलवाया’ और ‘तुम्हारा हाल ... जैसा’ चुना गया है।
