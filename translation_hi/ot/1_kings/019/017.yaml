  text: And it shall be that whoever escapes from the sword of Hazael[a], Jehu shall put to death; and whoever escapes from the sword of Jehu, Elisha shall put to death.
translation:
  language: hi
  text: और ऐसा होगा कि जो कोई हज़ाएल की तलवार से बच निकलेगा, उसे येहू मार डालेगा; और जो कोई येहू की तलवार से बच निकलेगा, उसे एलीशा मार डालेगा[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “एलीशा उसे मरवा डालेगा।” हिब्रू क्रिया कारक रूप में है। इस प्रसंग में एलीशा की भूमिका को सीधे, या उसकी भविष्यसूचक भूमिका के माध्यम से होने वाले न्याय के रूप में, समझा जा सकता है।
    reason: शाब्दिक विकल्प और एलीशा के कर्तृत्व की व्याख्यात्मक संभावना को सुरक्षित रखना।
lexical_decisions:
- source_word: וְהָיָה
  choice: और ऐसा होगा
  rationale: यह कथात्मक-भविष्यसूचक सूत्र आगे होने वाले निश्चित परिणाम का परिचय देता है। यह अनुवाद हिब्रू की संरचना को स्वाभाविक आधुनिक हिन्दी में बनाए रखता है।
- source_word: הַנִּמְלָט
  choice: जो कोई ... बच निकलेगा
  rationale: निश्चित लेख के साथ कृदन्त यहाँ संज्ञात्मक और सामान्य अर्थ में प्रयुक्त है। ‘जो कोई’ उसके अनिश्चित-सामान्य भाव को स्पष्ट और सहज ढंग से व्यक्त करता है।
- source_word: מֵחֶרֶב
  choice: की तलवार से
  rationale: ‘तलवार’ को शाब्दिक रूप में रखा गया है; यहाँ यह घातक सशस्त्र न्याय या हिंसा का भी संकेत देती है। व्यक्ति के नाम के साथ संबंध हिन्दी में ‘की तलवार’ से स्वाभाविक रूप से व्यक्त होता है।
- source_word: חֲזָאֵל
  choice: हज़ाएल
  rationale: व्यक्तिनाम का देवनागरी में ध्वन्यात्मक लिप्यंतरण किया गया है।
- source_word: יָמִית
  choice: मार डालेगा
  rationale: מות का हिफ़ील रूप कारक है और किसी को मृत्यु तक पहुँचाने का अर्थ देता है। ‘मार डालेगा’ आधुनिक हिन्दी में इस घातक कर्तृत्व को स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
- source_word: יֵהוּא
  choice: येहू
  rationale: व्यक्तिनाम का देवनागरी में प्रचलित ध्वन्यात्मक लिप्यंतरण किया गया है।
- source_word: וְהַנִּמְלָט
  choice: और जो कोई ... बच निकलेगा
  rationale: पहले खंड के समान संज्ञात्मक कृदन्त को समानांतरता बनाए रखते हुए उसी सामान्य अर्थ में अनूदित किया गया है।
- source_word: אֱלִישָׁע
  choice: एलीशा
  rationale: व्यक्तिनाम का देवनागरी में प्रचलित ध्वन्यात्मक लिप्यंतरण किया गया है।
theological_decisions:
- issue: ‘मार डालेगा’ में एलीशा का कर्तृत्व
  choice: मुख्य पाठ में सीधे शब्द बनाए रखे गए हैं कि एलीशा मार डालेगा।
  alternative: इसे एलीशा की भविष्यद्वाणी या उसकी नबूवत की सेवा के द्वारा आए न्याय के अर्थ में समझना।
  rationale: हिब्रू वाक्य-विन्यास हज़ाएल, येहू और एलीशा को समानांतर रूप में घातक न्याय के कर्ता बताता है। मुख्य पाठ में एलीशा की भूमिका को नरम करना मूल की धार्मिक तनावपूर्णता को व्याख्या द्वारा समाप्त कर देता; इसलिए मध्यस्थ या भविष्यसूचक कर्तृत्व की संभावना केवल टिप्पणी में रखी गई है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। दोनों समानांतर खंडों की संरचना सुरक्षित है; ‘तलवार’ की बिंबात्मक शक्ति और न्याय-संबंधी तनाव को सरल करके हटाया नहीं गया है।
