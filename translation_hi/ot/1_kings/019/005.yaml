  text: וַ/יִּשְׁכַּב֙ וַ/יִּישַׁ֔ן תַּ֖חַת רֹ֣תֶם אֶחָ֑ד וְ/הִנֵּֽה זֶ֤ה מַלְאָךְ֙ נֹגֵ֣עַ בּ֔/וֹ וַ/יֹּ֥אמֶר ל֖/וֹ ק֥וּם אֱכֽוֹל־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/019/005.yaml
  text: Then he lay down and slept under a broom tree. And behold[a], an angel touched him and said to him, “Get up, eat.”
translation:
  language: hi
  text: फिर वह लेट गया और एक रेतम की झाड़ी के नीचे सो गया। तभी एक स्वर्गदूत[a] ने उसे छुआ और उससे कहा, “उठ, खा।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “दूत।” इब्रानी शब्द מַלְאָךְ किसी मनुष्य के दूत अथवा किसी स्वर्गदूत, दोनों के लिए प्रयुक्त हो सकता है; यहाँ प्रसंग “स्वर्गदूत” अर्थ का समर्थन करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁכַּב וַיִּישַׁן
  choice: फिर वह लेट गया और ... सो गया
  rationale: दोनों क्रमिक क्रियाओं—लेटने और सोने—को सरल, स्वाभाविक हिन्दी कथन में बनाए रखता है।
- source_word: תַּחַת רֹתֶם אֶחָד
  choice: एक रेतम की झाड़ी के नीचे
  rationale: רֹתֶם मरुस्थलीय रेतम/ब्रूम झाड़ी को दर्शाता है; ‘रेतम’ मूल वनस्पति-संज्ञा को सुरक्षित रखता है और ‘झाड़ी’ उसके रूप को स्पष्ट करता है। אֶחָד का अनिश्चितार्थक बल ‘एक’ से व्यक्त हुआ है।
- source_word: וְהִנֵּה זֶה
  choice: तभी
  rationale: अचानक सामने आए घटनाक्रम की प्रस्तुतिपरक और जीवंत शक्ति को आधुनिक हिन्दी में स्वाभाविक रूप से व्यक्त करता है।
- source_word: מַלְאָךְ
  choice: स्वर्गदूत
  rationale: शब्द का अर्थ ‘दूत’ भी हो सकता है, पर आगामी अलौकिक सहायता के संदर्भ में ‘स्वर्गदूत’ अधिक संभावित है; वैकल्पिक अर्थ पादटिप्पणी में रखा गया है।
- source_word: נֹגֵעַ בּוֹ
  choice: ने उसे छुआ
  rationale: इब्रानी कृदंत को कथात्मक हिन्दी में पूर्ण क्रिया के रूप में देना स्वाभाविक है और संपर्क का मूल अर्थ बनाए रखता है।
- source_word: וַיֹּאמֶר לוֹ
  choice: और उससे कहा
  rationale: स्पष्ट परोक्ष कर्म לוֹ को ‘उससे’ द्वारा सुरक्षित रखा गया है।
- source_word: קוּם אֱכוֹל
  choice: उठ, खा
  rationale: दोनों संक्षिप्त एकवचन पुल्लिंग आज्ञाओं का सीधा और प्रभावशाली रूप।
theological_decisions:
- issue: מַלְאָךְ का अर्थ ‘स्वर्गदूत’ लिया जाए या ‘दूत’
  choice: स्वर्गदूत
  alternative: दूत
  rationale: तत्काल और व्यापक प्रसंग में निर्जन स्थान पर अलौकिक सहायता इस अर्थ का समर्थन करती है, फिर भी शब्द की वास्तविक lexical ambiguity पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘उठ, खा’ की संक्षिप्तता मूल आज्ञाओं के बल को बनाए रखती है; ‘रेतम की झाड़ी’ अपरिचित वनस्पति को अनावश्यक रूप से किसी दूसरी प्रजाति में बदलने से बचाती है।
