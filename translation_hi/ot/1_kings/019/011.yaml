base_translation:
  language: en
  yaml_path: translation/ot/1_kings/019/011.yaml
  text: And he said[a], “Go out and stand on the mountain before Yahweh.” And behold, Yahweh was passing by, and a great and strong wind was tearing apart the mountains and shattering rocks before Yahweh, but Yahweh was not in the wind. And after the wind, an earthquake[b], but Yahweh was not in the earthquake.
translation:
  language: hi
  text: और उसने कहा, “बाहर निकल और पर्वत पर याहवे के सामने खड़ा हो।” और देखो, याहवे वहाँ से होकर गुजर रहा था। याहवे के सामने एक बड़ी और प्रचंड हवा पर्वतों को फाड़ती और चट्टानों को चकनाचूर करती हुई चल रही थी, पर याहवे उस हवा में नहीं था[a]। हवा के बाद भूकंप आया, पर याहवे भूकंप में नहीं था[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “याहवे हवा में नहीं था।” मूल पाठ यह निर्दिष्ट नहीं करता कि ‘हवा में नहीं था’ का आशय किस प्रकार समझा जाए।
    reason: मूल की स्थान-सूचक अभिव्यक्ति और उसकी जानबूझकर बनी हुई अस्पष्टता को बनाए रखना।
  - marker: b
    text: शाब्दिक रूप से, “याहवे भूकंप में नहीं था।” मूल पाठ यह निर्दिष्ट नहीं करता कि ‘भूकंप में नहीं था’ का आशय किस प्रकार समझा जाए।
    reason: मूल की स्थान-सूचक अभिव्यक्ति और उसकी जानबूझकर बनी हुई अस्पष्टता को बनाए रखना।
lexical_decisions:
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत वाचा-नाम को किसी उपाधि से बदलने के बजाय देवनागरी में लिप्यंतरित किया गया है।
- source_word: צֵא וְעָמַדְתָּ
  choice: बाहर निकल और…खड़ा हो
  rationale: दोनों आज्ञार्थक क्रियाओं को सीधे और स्वाभाविक हिन्दी में रखा गया है; एकवचन संबोधन भी सुरक्षित है।
- source_word: לִפְנֵי יְהוָה
  choice: याहवे के सामने
  rationale: यह मूल वाक्यांश के स्थान-संबंधी अर्थ को बनाए रखता है और अनावश्यक व्याख्या नहीं जोड़ता।
- source_word: וְהִנֵּה
  choice: और देखो
  rationale: यह कथानक में आने वाली नाटकीय तात्कालिकता को आधुनिक और गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: עֹבֵר
  choice: पास से जा रहा था
  rationale: कृदंत की जारी क्रिया और ‘पास से होकर जाने’ के भाव को व्यक्त करता है, बिना उसे केवल पूर्ण भूतकाल बनाने के।
- source_word: רוּחַ גְּדוֹלָה וְחָזָק
  choice: एक बड़ी और प्रचंड हवा
  rationale: संदर्भ में רוּחַ भौतिक हवा है; दोनों विशेषणों की तीव्रता को अलग रखते हुए स्वाभाविक हिन्दी दी गई है।
- source_word: מְפָרֵק הָרִים וּמְשַׁבֵּר סְלָעִים
  choice: पहाड़ों को चीरती और चट्टानों को तोड़ती जा रही थी
  rationale: दोनों कृदंतों की जारी, प्रबल क्रिया और उनकी समानांतर रचना को स्पष्ट तथा सजीव हिन्दी में सुरक्षित रखा गया है।
- source_word: רַעַשׁ
  choice: भूकंप
  rationale: इस प्रकृति-प्रदर्शन के संदर्भ में ‘भूकंप’ शब्द רעש के धरती के हिलने वाले अर्थ को सबसे स्पष्ट रूप से व्यक्त करता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में प्रयुक्त व्यक्तिगत नाम को सुरक्षित रखा गया है; उसे किसी उपाधि से प्रतिस्थापित नहीं किया गया।
- issue: ‘याहवे हवा/भूकंप में नहीं था’ का आशय
  choice: स्थान-सूचक ‘में नहीं था’ को यथावत रखना
  alternative: याहवे हवा/भूकंप में प्रकट नहीं हुआ; याहवे वहाँ उपस्थित नहीं था
  rationale: मूल पाठ केवल ‘में नहीं’ कहता है। अनुवाद इस तनाव को बनाए रखता है और इसे परमेश्वर की अनुपस्थिति, अप्रकाशन या असंलग्नता की किसी एक व्याख्या तक सीमित नहीं करता।
- issue: וַיֹּאמֶר में वक्ता की पहचान
  choice: उसने कहा
  alternative: याहवे ने कहा
  rationale: इब्रानी क्रिया में कर्ता सर्वनाम से निहित है और इस पद में नाम दोहराया नहीं गया; इसलिए अनुवाद संदर्भगत संकेत को रखते हुए स्पष्ट नाम नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण कथात्मक स्तर अपनाया गया है। ‘और देखो’ नाटकीय संकेत को बनाए रखता है; ‘प्रचंड’, ‘चीरती’ और ‘तोड़ती’ दृश्य की शक्ति को सजीव रखते हैं। दिव्य नाम ‘याहवे’ के रूप में समान रूप से प्रस्तुत है।
