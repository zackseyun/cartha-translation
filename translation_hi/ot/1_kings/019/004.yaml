source:
  edition: WLC
  text: וְ/הֽוּא הָלַ֤ךְ בַּ/מִּדְבָּר֙ דֶּ֣רֶךְ י֔וֹם וַ/יָּבֹ֕א וַ/יֵּ֕שֶׁב תַּ֖חַת רֹ֣תֶם אחת וַ/יִּשְׁאַ֤ל אֶת נַפְשׁ/וֹ֙ לָ/מ֔וּת וַ/יֹּ֣אמֶר רַ֗ב עַתָּ֤ה יְהוָה֙ קַ֣ח נַפְשִׁ֔/י כִּֽי לֹא ט֥וֹב אָנֹכִ֖י מֵ/אֲבֹתָֽ/י־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/019/004.yaml
  text: But he himself went a day's journey into the wilderness[a], and came and sat down under a broom tree. And he asked that he might die, and said, “It is enough; now, Yahweh, take my life[b], for I am no better than my fathers.”
translation:
  language: hi
  text: परन्तु वह स्वयं एक दिन का रास्ता तय करके वीराने में गया। वहाँ वह एक रेतम की झाड़ी[a] के नीचे आकर बैठ गया। उसने अपने लिए मृत्यु माँगी और कहा, “बस, बहुत हो चुका! अब, यहोवा, मेरे प्राण ले ले, क्योंकि मैं अपने पुरखों से बेहतर नहीं हूँ।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: रेतम रेगिस्तान में उगने वाली एक झाड़ी है; अंग्रेज़ी में इसे कभी-कभी ‘ब्रूम झाड़ी’ कहा जाता है।
    reason: अपरिचित वनस्पति-नाम की पहचान स्पष्ट करना।
lexical_decisions:
- source_word: בַּמִּדְבָּר
  choice: वीराने में
  rationale: מִדְבָּר निर्जन, उजाड़ प्रदेश को दर्शाता है। ‘वीराना’ आधुनिक हिन्दी में स्वाभाविक है और यात्रा की दिशा ‘में गया’ से स्पष्ट होती है।
- source_word: דֶּרֶךְ יוֹם
  choice: एक दिन का रास्ता तय करके
  rationale: यह रचना एक दिन की यात्रा अथवा उतनी दूरी का बोध कराती है; यह हिन्दी रूप अवधि को मात्र बताने के बजाय यात्रा का भाव बनाए रखता है।
- source_word: רֹתֶם אַחַת
  choice: एक रेतम की झाड़ी
  rationale: רֹתֶם रेगिस्तानी झाड़ी है। वनस्पति का अपरिचित नाम लिप्यंतरित रखा गया और उसका सामान्य वर्ग ‘झाड़ी’ जोड़ा गया; אַחַת का ‘एक’ भी सुरक्षित है।
- source_word: וַיִּשְׁאַל אֶת־נַפְשׁוֹ לָמוּת
  choice: उसने अपने लिए मृत्यु माँगी
  rationale: इब्रानी मुहावरे का आशय है कि एलिय्याह ने स्वयं मर जाने की प्रार्थना की। यह रूप स्पष्ट और गरिमापूर्ण है तथा ‘आत्मा’ जैसी अनावश्यक मानवशास्त्रीय व्याख्या नहीं जोड़ता।
- source_word: רַב עַתָּה
  choice: बस, बहुत हो चुका! अब
  rationale: רַב यहाँ ‘पर्याप्त/बहुत’ की तीव्र पुकार है और עַתָּה को अलग ‘अब’ के रूप में रखा गया है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: चार अक्षरों वाले ईश्वरीय नाम को किसी उपाधि से बदलने के बजाय हिन्दी में प्रचलित व्यक्तिवाचक रूप ‘यहोवा’ से प्रस्तुत किया गया है।
- source_word: קַח נַפְשִׁי
  choice: मेरे प्राण ले ले
  rationale: संदर्भ में נֶפֶשׁ का अर्थ जीवन है। ‘प्राण ले ले’ मृत्यु की विनती को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: כִּי לֹא טוֹב אָנֹכִי מֵאֲבֹתָי
  choice: क्योंकि मैं अपने पुरखों से बेहतर नहीं हूँ
  rationale: מִן के साथ טוֹב तुलनात्मक अर्थ ‘से बेहतर’ देता है। אֲבֹתַי को व्यापक पूर्वज-संदर्भ में स्वाभाविक हिन्दी ‘मेरे पुरखे’ कहा गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे / प्रभु
  rationale: मूल में परमेश्वर का व्यक्तिवाचक वाचा-नाम है। उसे ‘प्रभु’ उपाधि से प्रतिस्थापित नहीं किया गया; हिन्दी पाठकों के लिए परिचित लिप्यंतरण ‘यहोवा’ अपनाया गया, जबकि ‘याहवे’ सम्भव वैकल्पिक स्वरांकन है।
- issue: נֶפֶשׁ का अर्थ
  choice: प्राण/अपने लिए
  alternative: आत्मा
  rationale: दोनों प्रयोगों में प्रसंग जीवन और मृत्यु का है। ‘आत्मा’ कहने से शरीर से पृथक सत्ता का ऐसा विशिष्ट अर्थ आ सकता है जिसे यह पद आवश्यक नहीं बनाता।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘वह स्वयं’ मूल के बलाघात को, और छोटे, तीव्र वाक्य एलिय्याह की थकान तथा निराशा को व्यक्त करते हैं।
