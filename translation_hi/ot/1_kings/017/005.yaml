  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יֵּ֥לֶךְ וַ/יַּ֖עַשׂ כִּ/דְבַ֣ר יְהוָ֑ה וַ/יֵּ֗לֶךְ וַ/יֵּ֨שֶׁב֙ בְּ/נַ֣חַל כְּרִ֔ית אֲשֶׁ֖ר עַל פְּנֵ֥י הַ/יַּרְדֵּֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/017/005.yaml
  text: So he went and did according to the word of Yahweh[a], and he went and stayed by the Wadi Cherith[b], which is before the Jordan.
translation:
  language: hi
  text: तब वह गया और उसने याहवे[a] के वचन के अनुसार किया। वह जाकर करीत के नाले[b] के पास रहने लगा, जो यरदन के सामने[c] है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘याहवे’ इब्रानी में परमेश्वर का व्यक्तिगत नाम יהוה (YHWH) है; इसे कभी-कभी ‘यहोवा’ और अनेक अनुवादों में ‘प्रभु’ लिखा जाता है।
    reason: divine_name
  - marker: b
    text: इब्रानी शब्द का अर्थ कोई नाला, जलधारा, घाटी या बरसाती जलमार्ग हो सकता है।
    reason: lexical_alternative
  - marker: c
    text: शाब्दिक रूप से ‘जो यरदन के सामने है’; इसका अर्थ ‘यरदन के आमने-सामने’ या प्रसंगानुसार ‘यरदन के उस पार’ भी समझा जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ וַיַּעַשׂ
  choice: तब वह गया और उसने ... किया
  rationale: वाव-क्रमिक रूप कथा को आगे बढ़ाते हैं। ‘तब’ पिछले आदेश के प्रत्युत्तर में हुई अगली कार्रवाई को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: כִּדְבַר יְהוָה
  choice: याहवे के वचन के अनुसार
  rationale: ‘के अनुसार’ आज्ञापालन का औपचारिक भाव बनाए रखता है, और דָּבָר को यहाँ बोले गए आदेश के अर्थ में ‘वचन’ कहा गया है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय आधुनिक हिन्दी में लिप्यंतरित किया गया है।
- source_word: וַיֵּשֶׁב
  choice: रहने लगा
  rationale: יָשַׁב यहाँ किसी स्थान पर ठहरकर रहने को दर्शाता है। ‘रहने लगा’ अस्थायी प्रसंग में सहज है और अत्यधिक स्थायित्व नहीं जताता।
- source_word: בְּנַחַל
  choice: नाले के पास
  rationale: נַחַל घाटी, बरसाती जलधारा या उसके जलमार्ग को सूचित कर सकता है। ‘नाला’ सामान्य हिन्दी में समझने योग्य है; ‘के पास’ निवास के संदर्भ में स्वाभाविक है।
- source_word: כְּרִית
  choice: करीत
  rationale: स्थान-नाम का हिन्दी ध्वन्यात्मक लिप्यंतरण किया गया है।
- source_word: אֲשֶׁר עַל פְּנֵי הַיַּרְדֵּן
  choice: जो यरदन के सामने है
  rationale: עַל־פְּנֵי का मूल स्थान-संबंधी भाव ‘सामने/आमने-सामने/उस पार की ओर’ हो सकता है। स्रोत में दिशा स्पष्ट न होने के कारण ‘पूर्व में’ जैसी व्याख्यात्मक दिशा नहीं जोड़ी गई।
- source_word: הַיַּרְדֵּן
  choice: यरदन
  rationale: नदी के प्रचलित बाइबलीय नाम का लिप्यंतरण; प्रसंग से नदी स्पष्ट होने के कारण मुख्य पाठ में ‘नदी’ जोड़ना आवश्यक नहीं है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ व्यक्तिगत ईश्वरीय नाम का प्रयोग करता है। ‘याहवे’ उस नाम को उपाधि से प्रतिस्थापित किए बिना प्रस्तुत करता है; पादटिप्पणी पाठक को इसकी पहचान बताती है।
- issue: עַל פְּנֵי הַיַּרְדֵּן का भौगोलिक अर्थ
  choice: यरदन के सामने
  alternative: यरदन के उस पार; यरदन के पूर्व में
  rationale: इब्रानी वाक्यांश दिशा के विषय में कुछ अस्पष्ट है। ‘पूर्व में’ कहना संभावित भौगोलिक निष्कर्ष को मूल पाठ से अधिक निश्चित बना देता; इसलिए औपचारिक स्थान-संबंधी अभिव्यक्ति रखी गई और विकल्प पादटिप्पणी में दिए गए।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘वचन के अनुसार’ बाइबलीय औपचारिकता को बनाए रखता है, जबकि ‘रहने लगा’ और ‘नाले के पास’ सामान्य पाठक के लिए स्वाभाविक हैं। भौगोलिक अस्पष्टता को मुख्य पाठ में नहीं सुलझाया गया।
