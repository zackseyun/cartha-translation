base_translation:
  language: en
  yaml_path: translation/ot/1_kings/017/002.yaml
  text: And the word of Yahweh came to him[a], saying,
translation:
  language: hi
  text: 'और याहवे[a] का वचन उसके पास आया:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इब्रानी में: YHWH (יהוה)। परंपरागत अनुवादों में इसे प्रायः “प्रभु” कहा गया है; “यहोवा” भी प्रचलित रूप है।'
    reason: ईश्वरीय नाम के मूल रूप और पारंपरिक अनुवादों की जानकारी देना।
lexical_decisions:
- source_word: וַיְהִי
  choice: और … आया
  rationale: वाव-क्रमिक रूप कथा में अगले घटनाक्रम को प्रस्तुत करता है। ‘और … आया’ इब्रानी कथा-प्रवाह को स्वाभाविक हिंदी में बनाए रखता है।
- source_word: דְבַר
  choice: वचन
  rationale: यहाँ यह परमेश्वर से प्राप्त प्रकाशन के लिए प्रयुक्त मानक भविष्यवाणी-सूत्र का अंग है; ‘वचन’ उसके सूत्रात्मक और प्रकाशनात्मक भाव को सुरक्षित रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: मूल पाठ में ईश्वर का व्यक्तिगत नाम יהוה है। ‘याहवे’ उसका प्रचलित विद्वत्तापूर्ण लिप्यंतरण है, न कि उसके स्थान पर प्रयुक्त कोई उपाधि।
- source_word: אֵלָיו
  choice: उसके पास
  rationale: אֶל और पुरुषवाचक प्रत्यय दिशा या संबोधन के लक्ष्य को दर्शाते हैं। इस प्रकाशन-सूत्र में ‘उसके पास’ स्वाभाविक हिंदी है और पूर्वपद के व्यक्ति को अनावश्यक रूप से नामित नहीं करता।
- source_word: לֵאמֹר
  choice: ':'
  rationale: यह रूप आगे आने वाले प्रत्यक्ष कथन का परिचय देता है। हिंदी में पूर्णविराम-चिह्न ‘:’ यही कार्य स्वाभाविक और संक्षिप्त रूप से करता है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: याहवे
  alternative: प्रभु / यहोवा
  rationale: पद में चार अक्षरों वाला व्यक्तिगत ईश्वरीय नाम सीधे आया है। ‘याहवे’ नाम को उपाधि से बदले बिना प्रस्तुत करता है; पाद-टिप्पणी पाठकों को इब्रानी रूप और पारंपरिक विकल्प बताती है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सहज हिंदी। भविष्यवाणी-सूत्र की औपचारिकता बनाए रखते हुए ‘उसके पास आया’ रखा गया है; अगले प्रत्यक्ष कथन के परिचय के लिए हिंदी-अनुकूल द्विबिंदु प्रयोग हुआ है।
