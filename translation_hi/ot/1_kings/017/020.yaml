  to: तब उसने यहोवा को पुकारकर कहा, “हे यहोवा, मेरे परमेश्वर, क्या तूने उस विधवा पर भी, जिसके यहाँ मैं परदेशी बनकर रह रहा हूँ, उसके बेटे को मरवा कर विपत्ति डाली है[a]?”
