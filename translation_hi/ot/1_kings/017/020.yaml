source:
  edition: WLC
  text: וַ/יִּקְרָ֥א אֶל יְהוָ֖ה וַ/יֹּאמַ֑ר יְהוָ֣ה אֱלֹהָ֔/י הֲ֠/גַם עַל הָ/אַלְמָנָ֞ה אֲשֶׁר אֲנִ֨י מִתְגּוֹרֵ֥ר עִמָּ֛/הּ הֲרֵע֖וֹתָ לְ/הָמִ֥ית אֶת בְּנָֽ/הּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/017/020.yaml
  text: Then he cried out to Yahweh and said[a], “O Yahweh my God, have you also brought harm on the widow with whom I am staying[b], by causing her son to die?”
translation:
  language: hi
  text: तब उसने यहोवा को पुकारकर कहा, “हे यहोवा, मेरे परमेश्वर, क्या तूने उस विधवा पर भी, जिसके यहाँ मैं परदेशी बनकर रह रहा हूँ, उसके बेटे को मरवा कर विपत्ति डाली है[a]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उस विधवा के साथ बुरा किया”; इब्रानी क्रिया का अर्थ हानि पहुँचाना, विपत्ति लाना या किसी के साथ बुरा करना हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא אֶל־יְהוָה
  choice: यहोवा को पुकारकर
  rationale: प्रार्थना के प्रसंग में यह पदबंध तीव्र और व्याकुल पुकार दर्शाता है; ‘पुकारकर’ आधुनिक हिन्दी में स्वाभाविक है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: परमेश्वर के व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय प्रचलित हिन्दी लिप्यंतरण में रखा गया है।
- source_word: יְהוָה אֱלֹהָי
  choice: हे यहोवा, मेरे परमेश्वर
  rationale: सम्बोधन और प्रथम पुरुष संबंध दोनों को स्पष्ट और गरिमापूर्ण हिन्दी में सुरक्षित रखता है।
- source_word: הֲגַם
  choice: क्या ... भी
  rationale: प्रश्न और पहले से उपस्थित दुःख में एक और विपत्ति जुड़ने पर एलिय्याह के विस्मय को व्यक्त करता है।
- source_word: מִתְגּוֹרֵר עִמָּהּ
  choice: जिसके यहाँ मैं परदेशी बनकर रह रहा हूँ
  rationale: हित्पएल रूप अस्थायी निवासी, अतिथि या आश्रित के रूप में रहने का भाव देता है; केवल ‘ठहरा हूँ’ से अधिक स्रोत-संगत है।
- source_word: הֲרֵעוֹתָ
  choice: विपत्ति डाली
  rationale: רעע का हिफ़ील यहाँ हानि या विपत्ति पहुँचाने को दर्शा सकता है; यह एलिय्याह की कठोर शिकायत को बनाए रखता है, पर अनिवार्य रूप से नैतिक बुराई करने का आरोप नहीं लगाता।
- source_word: לְהָמִית אֶת־בְּנָהּ
  choice: उसके बेटे को मार डाला
  rationale: कारक infinitive में मृत्यु का कारण बनने का स्पष्ट भाव है। ‘मार डाला’ इस प्रत्यक्ष ईश्वरीय कारकता को अस्पष्ट नहीं करता और हिन्दी में स्वाभाविक है।
theological_decisions:
- issue: क्या एलिय्याह परमेश्वर पर नैतिक बुराई करने का आरोप लगा रहा है या उससे आई हानि/विपत्ति पर विलाप कर रहा है
  choice: ‘विपत्ति डाली’ द्वारा हानि और calamity का अर्थ रखा, साथ ही ‘मार डाला’ से कथित ईश्वरीय कारकता स्पष्ट रखी
  alternative: ‘विधवा के साथ बुरा किया ... उसके बेटे को मरने दिया’
  rationale: हिब्रू क्रिया नैतिक बुराई तथा हानि/विपत्ति दोनों अर्थ दे सकती है। मुख्य पाठ अनावश्यक रूप से नैतिक दोषारोपण तय नहीं करता, किंतु एलिय्याह की साहसी शिकायत और परमेश्वर की क्रिया से जुड़ा तनाव भी कम नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज प्रार्थना-भाषा अपनाई गई है। ‘तूने’ एकवचन निकट सम्बोधन और हिब्रू क्रिया-रूप से मेल खाता है। ‘परदेशी बनकर’ अस्थायी/आश्रित निवास का सांस्कृतिक भाव सुरक्षित रखता है।
