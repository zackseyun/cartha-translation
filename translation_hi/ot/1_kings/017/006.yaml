  yaml_path: translation/ot/1_kings/017/006.yaml
  text: And the ravens were bringing him bread and meat in the morning[a], and bread and meat in the evening, and he would drink from the wadi.
translation:
  language: hi
  text: और कौए सुबह उसके पास रोटी और मांस, और शाम को रोटी और मांस लाते थे; और वह उस जलधारा से पीता था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהָעֹרְבִים
  choice: और कौए
  rationale: עֹרְבִים का सामान्य अर्थ कौए/रेवन पक्षी है। आधुनिक हिन्दी में ‘कौए’ स्वाभाविक और व्यापक रूप से समझा जाने वाला रूप है; ‘और’ से इब्रानी संयोजक भी सुरक्षित रहता है।
- source_word: מְבִיאִים
  choice: लाते थे
  rationale: सहभागी रूप कथा में लगातार अथवा बार-बार होने वाली क्रिया बताता है; ‘लाते थे’ इस आदतन क्रिया को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: לוֹ
  choice: उसके लिए
  rationale: यह अप्रत्यक्ष कर्म को स्पष्ट करता है और हिन्दी में प्रावधान के भाव के साथ स्वाभाविक है।
- source_word: לֶחֶם
  choice: रोटी
  rationale: ठोस संज्ञा को ‘भोजन’ जैसे व्यापक शब्द में बदलने के बजाय उसके सामान्य अर्थ ‘रोटी’ में रखा गया है।
- source_word: וּבָשָׂר
  choice: और मांस
  rationale: इस प्रसंग में בָּשָׂר खाने योग्य मांस को दर्शाता है; ‘मांस’ वर्तमान मानक हिन्दी का सहज शब्द है।
- source_word: בַּבֹּקֶר
  choice: सुबह
  rationale: समय-सूचक पद का संक्षिप्त और स्वाभाविक हिन्दी रूप।
- source_word: וְלֶחֶם וּבָשָׂר בָּעָרֶב
  choice: और शाम को रोटी और मांस लाते थे
  rationale: इब्रानी में सुबह और शाम के लिए ‘रोटी और मांस’ की पुनरावृत्ति है; उसके बल और लय को बनाए रखने के लिए हिन्दी में भी इसे दोहराया गया है। क्रिया की पुनरावृत्ति हिन्दी वाक्य को स्पष्ट और स्वाभाविक बनाती है।
- source_word: וּמִן הַנַּחַל
  choice: और उस बरसाती नाले से
  rationale: נַחַל किसी वादी, मौसमी जलमार्ग या जलधारा को दर्शा सकता है। ‘बरसाती नाला’ भौगोलिक अर्थ को सामान्य हिन्दी में अपेक्षाकृत सटीक रूप से व्यक्त करता है; निश्चित उपपद को ‘उस’ से दर्शाया गया है।
- source_word: יִשְׁתֶּה
  choice: पानी पीता था
  rationale: अपूर्ण क्रिया यहाँ आदतन क्रिया व्यक्त करती है, इसलिए ‘पीता था’ उपयुक्त है। हिन्दी में स्रोत से पीने की बात स्वाभाविक और स्पष्ट करने के लिए निहित कर्म ‘पानी’ व्यक्त किया गया है।
theological_decisions:
- issue: एलिय्याह के लिए עֹרְבִים द्वारा प्रावधान की प्रकृति
  choice: शाब्दिक कौए
  alternative: अरबी लोग, व्यापारी या अन्य मानवीय वाहक
  rationale: עֹרְבִים का सीधा और सामान्य शब्दार्थ कौए/रेवन पक्षी है। निकट प्रसंग में इसे मानवीय समूह मानने की आवश्यकता नहीं है, इसलिए चमत्कारिक तत्व को हटाने वाली व्याख्या मुख्य पाठ में नहीं अपनाई गई।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। सुबह और शाम के प्रावधान की मूल पुनरावृत्ति सुरक्षित है। ‘बरसाती नाला’ सामान्य पाठक के लिए ‘वादी’ से अधिक स्पष्ट है, जबकि पाद-टिप्पणी मूल शब्द की अर्थ-सीमा बताती है।
