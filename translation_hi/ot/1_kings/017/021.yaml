  yaml_path: translation/ot/1_kings/017/021.yaml
  text: Then he stretched himself out over the boy three times[a], and he cried out to Yahweh and said, “Yahweh my God, please let this boy’s life return to him.”
translation:
  language: hi
  text: तब उसने बालक के ऊपर तीन बार अपना शरीर फैलाया और याहवे को पुकारकर कहा, “हे याहवे, मेरे परमेश्वर, कृपा करके इस बालक का जीवन[a] उसके भीतर लौटा दे।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या “प्राण” या “आत्मा।” इब्रानी में शाब्दिक भाव है: “इस बालक का नेफ़ेश उसके भीतरी भाग में लौट आए।”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְמֹדֵד
  choice: तनकर लेटा
  rationale: यह दुर्लभ आत्मवाचक क्रिया इस प्रसंग में एलिय्याह के बालक के ऊपर अपना शरीर फैलाने की क्रिया बताती है। ‘तनकर लेटा’ आधुनिक हिन्दी में इस शारीरिक मुद्रा को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: עַל הַיֶּלֶד
  choice: बालक के ऊपर
  rationale: यहाँ עַל शारीरिक स्थिति को दर्शाता है; ‘बालक के ऊपर’ क्रिया का स्थान स्पष्ट करता है।
- source_word: שָׁלֹשׁ פְּעָמִים
  choice: तीन बार
  rationale: संख्या और अवसर-सूचक संज्ञा का मानक, स्वाभाविक हिन्दी रूप।
- source_word: וַיִּקְרָא אֶל יְהוָה
  choice: याहवे को पुकारकर
  rationale: प्रार्थना के प्रसंग में קרא אל व्याकुल और earnest पुकार को व्यक्त करता है; ‘पुकारकर’ बिना अतिव्याख्या के यह भाव बनाए रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत नाम יהוה को किसी उपाधि से बदलने के बजाय हिन्दी लिपि में लिप्यंतरित किया गया है।
- source_word: יְהוָה אֱלֹהָי
  choice: हे याहवे, मेरे परमेश्वर
  rationale: सम्बोधन का बल ‘हे’ से स्पष्ट होता है और प्रथम पुरुष सम्बन्ध ‘मेरे परमेश्वर’ में सुरक्षित रहता है।
- source_word: תָּשָׁב נָא
  choice: कृपा कर, ... लौट आए
  rationale: שוב के इच्छार्थक रूप और נא की विनम्र, अत्यावश्यक विनती को स्वाभाविक हिन्दी प्रार्थना-भाषा में व्यक्त किया गया है।
- source_word: נֶפֶשׁ
  choice: जीवन
  rationale: इस पुनर्जीवन-प्रसंग में נֶפֶשׁ बालक के जीवित होने वाले प्राण या जीवन को सूचित करता है। ‘जीवन’ किसी विशिष्ट दार्शनिक मानव-विज्ञान को थोपे बिना कथात्मक अर्थ स्पष्ट करता है; ‘प्राण’ की सम्भावना पादटिप्पणी में रखी गई है।
- source_word: הַיֶּלֶד הַזֶּה
  choice: इस बालक
  rationale: יַלֶד का अर्थ बालक या बच्चा हो सकता है; पुल्लिंग और प्रसंग को देखते हुए ‘बालक’ सटीक तथा गरिमापूर्ण है।
- source_word: עַל קִרְבּוֹ
  choice: उसके भीतर
  rationale: शाब्दिक रूप से यह उसके ‘अन्दरूनी भाग’ की ओर लौटने को दर्शाता है। ‘उसके भीतर’ मूल की देहगत भाषा को बनाए रखते हुए हिन्दी में स्वाभाविक है।
theological_decisions:
- issue: पुनर्जीवन के प्रसंग में נֶפֶשׁ का अनुवाद
  choice: जीवन
  alternative: प्राण
  rationale: विनती बालक के जीवित करने वाले जीवन की वापसी के लिए है। ‘जीवन’ कथा का आशय स्पष्ट रखता है और मनुष्य की संरचना के बारे में कोई विशिष्ट सिद्धान्त तय नहीं करता; ‘प्राण’ को पादटिप्पणी में रखकर मूल शब्द की सम्भावित धार्मिक-मानववैज्ञानिक गूँज सुरक्षित की गई है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, सरल किंतु गरिमापूर्ण रखी गई है। प्रार्थना की तात्कालिकता ‘पुकारकर’ और ‘कृपा कर’ से व्यक्त होती है। मूल की भीतरी स्थान-सूचक अभिव्यक्ति को केवल ‘उसके पास’ कहकर मिटाने के बजाय ‘उसके भीतर’ रखा गया है।
