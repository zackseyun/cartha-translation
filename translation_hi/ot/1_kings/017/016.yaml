id: 1KI.17.16
reference: 1 Kings 17:16
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: כַּ֤ד הַ/קֶּ֨מַח֙ לֹ֣א כָלָ֔תָה וְ/צַפַּ֥חַת הַ/שֶּׁ֖מֶן לֹ֣א חָסֵ֑ר כִּ/דְבַ֣ר יְהוָ֔ה אֲשֶׁ֥ר דִּבֶּ֖ר בְּ/יַ֥ד אֵלִיָּֽהוּ׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/017/016.yaml
  text: The jar of flour was not used up[a], and the jug of oil did not run out, according to the word of Yahweh that he had spoken by the hand of Elijah.
translation:
  language: hi
  text: आटे का मटका खाली नहीं हुआ, और तेल की कुप्पी में तेल कम नहीं हुआ। यह याहवे के उस वचन के अनुसार हुआ, जो उसने एलिय्याह के द्वारा[a] कहा था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “एलिय्याह के हाथ से”; यह इब्रानी मुहावरा यहाँ “एलिय्याह के द्वारा” या “एलिय्याह के माध्यम से” के अर्थ में है।
    reason: इब्रानी की मध्यस्थता-सूचक अभिव्यक्ति בְּיַד का शाब्दिक रूप और उसका स्वाभाविक अर्थ स्पष्ट करना।
lexical_decisions:
- source_word: כַּד הַקֶּמַח
  choice: आटे का मटका
  rationale: כַּד घरेलू भंडारण-पात्र है। ‘मटका’ साधारण हिंदी में आटा रखने के पात्र के लिए स्वाभाविक है और ‘आटे का’ संबंध-संरचना को बनाए रखता है।
- source_word: לֹא כָלָתָה
  choice: खाली नहीं हुआ
  rationale: כלה यहाँ सामग्री के समाप्त हो जाने का भाव देता है। पात्र के संदर्भ में ‘खाली नहीं हुआ’ स्वाभाविक हिंदी है और निरंतर आपूर्ति का अर्थ स्पष्ट करता है।
- source_word: צַפַּחַת הַשֶּׁמֶן
  choice: तेल की कुप्पी का तेल
  rationale: צַפַּחַת तेल रखने का छोटा पात्र है; ‘कुप्पी’ उसे आटे के बड़े पात्र से अलग दिखाती है। ‘का तेल’ जोड़कर हिंदी में उस वस्तु को स्पष्ट किया गया है जो कम नहीं हुई।
- source_word: לֹא חָסֵר
  choice: कम नहीं हुआ
  rationale: חסר का मूल भाव घटने या अभाव में पड़ने का है। ‘कम नहीं हुआ’ इस भाव को बनाए रखता है और पहले खंड की अनावश्यक हूबहू पुनरावृत्ति से बचता है।
- source_word: כִּדְבַר יְהוָה
  choice: याहवे के उस वचन के अनुसार
  rationale: כִּדְבַר की औपचारिक पूर्ति-संबंधी अभिव्यक्ति को बनाए रखा गया है और יְהוָה को व्यक्तिगत नाम ‘याहवे’ के रूप में लिप्यंतरित किया गया है।
- source_word: אֲשֶׁר דִּבֶּר
  choice: जो उसने … कहा था
  rationale: पूर्व में कहे गए वचन और उसके बाद हुई पूर्ति का काल-संबंध हिंदी के पूर्ण भूतकाल ‘कहा था’ से स्वाभाविक रूप से व्यक्त होता है।
- source_word: בְּיַד אֵלִיָּהוּ
  choice: एलिय्याह के हाथ से
  rationale: इब्रानी की मध्यस्थता-सूचक रूपकात्मक अभिव्यक्ति को मुख्य पाठ में सुरक्षित रखा गया है; पादटिप्पणी उसका सामान्य हिंदी अर्थ बताती है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: प्रभु / यहोवा
  rationale: मूल पाठ में चतुरक्षरीय व्यक्तिगत नाम सीधे प्रयुक्त है। ‘याहवे’ उसे उपाधि से बदलने के बजाय नाम के रूप में प्रस्तुत करता है।
- issue: भविष्यद्वक्ता के माध्यम से वचन कहने की अभिव्यक्ति
  choice: जो उसने एलिय्याह के हाथ से कहा था
  alternative: जो उसने एलिय्याह के द्वारा कहा था
  rationale: मुख्य पाठ इब्रानी मुहावरे की सजीवता और भविष्यद्वक्ता की मध्यस्थ भूमिका को सुरक्षित रखता है, जबकि पादटिप्पणी उसके आशय को स्पष्ट करती है।
- issue: पूर्ति का संबंध
  choice: यह याहवे के उस वचन के अनुसार हुआ
  alternative: जैसा याहवे ने कहा था
  rationale: ‘वचन के अनुसार’ मूल के דְּבַר और घटना के उस वचन के अनुरूप होने के औपचारिक संबंध को बनाए रखता है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध हिंदी। घरेलू पात्रों के लिए ‘मटका’ और ‘कुप्पी’ चुने गए हैं। वाक्य को दो भागों में बाँटकर हिंदी प्रवाह सुधारा गया है, पर मूल का समानांतर कथन और वचन-पूर्ति का संबंध बनाए रखा गया है।
