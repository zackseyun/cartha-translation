source:
  edition: WLC
  text: וַ/יִּקַּ֨ח אֵלִיָּ֜הוּ אֶת הַ/יֶּ֗לֶד וַ/יֹּרִדֵ֤/הוּ מִן הָ/עֲלִיָּה֙ הַ/בַּ֔יְתָ/ה וַֽ/יִּתְּנֵ֖/הוּ לְ/אִמּ֑/וֹ וַ/יֹּ֨אמֶר֙ אֵ֣לִיָּ֔הוּ רְאִ֖י חַ֥י בְּנֵֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/017/023.yaml
  text: Then Elijah took the boy[a], brought him down from the upper room into the house, and gave him to his mother. And Elijah said, “See, your son is alive.”
translation:
  language: hi
  text: तब एलिय्याह ने बालक को लिया, उसे ऊपर के कमरे से नीचे घर में ले आया और उसकी माँ को दे दिया। फिर एलिय्याह ने कहा, “देखो, तुम्हारा बेटा जीवित है।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקַּח
  choice: लिया
  rationale: कथात्मक क्रिया לקח का सीधा और स्वाभाविक अर्थ ‘लिया’ है; प्रसंग से अधिक ढंग या क्रिया-विधि नहीं जोड़ी गई।
- source_word: הַיֶּלֶד
  choice: बालक
  rationale: יֶלֶד बच्चे या लड़के को सूचित कर सकता है। ‘बालक’ आयु को शिशु तक सीमित किए बिना गरिमापूर्ण और स्पष्ट है।
- source_word: וַיֹּרִדֵהוּ
  choice: उसे ... नीचे ... ले आया
  rationale: ירד के कारक रूप का अर्थ ‘नीचे ले आना’ है। यह ऊपर के कमरे से नीचे की ओर गति व्यक्त करता है, बिना यह जोड़े कि एलिय्याह ने उसे किस प्रकार उठाया या ढोया।
- source_word: הָעֲלִיָּה
  choice: ऊपर का कमरा
  rationale: עֲלִיָּה किसी ऊपरी कक्ष या छत पर बने कमरे को दर्शाता है; ‘ऊपर का कमरा’ आधुनिक हिन्दी में स्पष्ट और वास्तु-संबंधी अर्थ के अनुरूप है।
- source_word: הַבַּיְתָה
  choice: घर में
  rationale: दिशासूचक प्रत्यय घर की ओर या घर के भीतर गति बताता है; प्रसंग में ‘घर में’ इसका स्वाभाविक हिन्दी रूप है।
- source_word: וַיִּתְּנֵהוּ לְאִמּוֹ
  choice: उसकी माँ को दे दिया
  rationale: נתן का मूल अर्थ ‘देना’ है। ‘लौटा दिया’ प्रसंगानुकूल होता, पर मूल क्रिया से अधिक अर्थ जोड़ता।
- source_word: רְאִי
  choice: देखो
  rationale: यह स्त्रीलिंग एकवचन आज्ञार्थक रूप है और माँ से कहा गया है। आधुनिक हिन्दी में ‘देखो’ प्रत्यक्ष संबोधन और संकेतात्मक बल को स्वाभाविक रूप से रखता है।
- source_word: חַי בְּנֵךְ
  choice: तुम्हारा बेटा जीवित है
  rationale: विशेषण חַי और कर्ता בְּנֵךְ जीवन की वर्तमान अवस्था को सीधे व्यक्त करते हैं। ‘जीवित है’ चमत्कार के परिणाम को स्पष्ट करता है, पर ‘फिर से’ या ‘जिलाया गया’ जैसी अतिरिक्त व्याख्या नहीं जोड़ता।
theological_decisions:
- issue: बालक के फिर जीवित होने के चमत्कार को कितनी स्पष्टता से व्यक्त किया जाए
  choice: तुम्हारा बेटा जीवित है
  alternative: तुम्हारा बेटा फिर से जी उठा है
  rationale: इब्रानी पाठ सीधे उसके जीवित होने की घोषणा करता है। पूर्व प्रसंग चमत्कार स्पष्ट करता है, इसलिए अनुवाद में ‘फिर से’ या ‘जी उठा’ जोड़कर कथन का विस्तार नहीं किया गया।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, सरल किंतु गरिमापूर्ण कथात्मक शैली में रखी गई है। ‘बालक’ और ‘ऊपर का कमरा’ सामान्य पाठक के लिए स्पष्ट हैं; अनावश्यक प्राचीन या सांप्रदायिक शब्दावली से बचा गया है।
