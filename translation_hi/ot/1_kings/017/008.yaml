  text: Then the word of Yahweh came to him[a], saying,
translation:
  language: hi
  text: 'तब याहवे[a] का वचन उसके पास आया, यह कहते हुए:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में परमेश्वर का व्यक्तिगत नाम יהוה (YHWH) है, जिसका यहाँ लिप्यंतरण “याहवे” किया गया है।
    reason: divine_name
lexical_decisions:
- source_word: וַיְהִי
  choice: तब ... पहुँचा
  rationale: वाव-परिणामी कथा में अगली घटना को आगे बढ़ाता है। आधुनिक हिन्दी में “तब” क्रम को स्वाभाविक रूप से व्यक्त करता है; הָיָה का कथात्मक बल पूरे वाक्य में “पहुँचा” के साथ प्रकट होता है।
- source_word: דְבַר
  choice: वचन
  rationale: דְבַר יְהוָה भविष्यवाणी-संबंधी स्थापित पदबंध है। “वचन” दैवी संचार और इस पदबंध के धार्मिक भार को “संदेश” की अपेक्षा बेहतर बनाए रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: यह चतुरक्षरीय व्यक्तिगत दैवी नाम का आधुनिक हिन्दी लिप्यंतरण है; इसे किसी उपाधि से नहीं बदला गया है।
- source_word: אֵלָיו
  choice: उसके पास
  rationale: אֶל के तृतीय पुरुष एकवचन पुल्लिंग प्रत्यय का अर्थ “उसकी ओर/उसके पास” है। वचन के आने के सन्दर्भ में “उसके पास पहुँचा” स्वाभाविक हिन्दी है।
- source_word: לֵאמֹר
  choice: उसने कहा,
  rationale: यह क्रियार्थक संज्ञा आगे आने वाले प्रत्यक्ष कथन का परिचय देती है। हिन्दी में अलग वाक्य “उसने कहा,” मूल के कथन-परिचायक कार्य को स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है।
theological_decisions:
- issue: दैवी नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में व्यक्तिगत दैवी नाम सीधे आया है। “याहवे” उसका निकट हिन्दी लिप्यंतरण है और नाम को उपाधि में बदलने से बचाता है; “यहोवा” पारंपरिक रूप है, पर स्रोत-रूप के कम निकट है।
translation_notes:
  register: भाषा आधुनिक, सरल और गरिमापूर्ण रखी गई है। “याहवे का वचन” मूल की भविष्यवाणी-संबंधी सूत्रात्मक अभिव्यक्ति को सुरक्षित रखता है; अगली आयत में आने वाले प्रत्यक्ष कथन के कारण अन्त में अल्पविराम रखा गया है।
