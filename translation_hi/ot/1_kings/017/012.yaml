  text: וַ/תֹּ֗אמֶר חַי יְהוָ֤ה אֱלֹהֶ֨י/ךָ֙ אִם יֶשׁ לִ֣/י מָע֔וֹג כִּ֣י אִם מְלֹ֤א כַף קֶ֨מַח֙ בַּ/כַּ֔ד וּ/מְעַט שֶׁ֖מֶן בַּ/צַּפָּ֑חַת וְ/הִנְ/נִ֨י מְקֹשֶׁ֜שֶׁת שְׁנַ֣יִם עֵצִ֗ים וּ/בָ֨אתִי֙ וַ/עֲשִׂיתִ֨י/הוּ֙ לִ֣/י וְ/לִ/בְנִ֔/י וַ/אֲכַלְנֻ֖/הוּ וָ/מָֽתְנוּ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/017/012.yaml
  text: And she said[a], “As Yahweh your God lives, I have no bread-cake, only a handful of flour in the jar and a little oil in the jug. And look, I am gathering two sticks, so that I may go in and prepare it for myself and for my son, and we may eat it and die.”
translation:
  language: hi
  text: उसने कहा, “याहवे, तुम्हारे परमेश्वर, के जीवित होने की शपथ, मेरे पास एक भी रोटी नहीं है[a]। मटके में बस मुट्ठी भर आटा और कुप्पी में थोड़ा-सा तेल है। देखो, मैं दो लकड़ियाँ बटोर रही हूँ, ताकि भीतर जाकर उसे अपने और अपने बेटे के लिए तैयार करूँ। फिर हम उसे खाएँगे और मर जाएँगे।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “मेरे पास कोई रोटी की टिकिया नहीं है” या “कोई सेंकी हुई रोटी नहीं है।” इब्रानी शब्द מָעוֹג छोटी, संभवतः गोल, रोटी या रोटी की टिकिया को दर्शाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: חַי יְהוָה אֱלֹהֶיךָ
  choice: तुम्हारे परमेश्वर याहवे के जीवन की शपथ
  rationale: यह एक प्रचलित इब्रानी शपथ-वाक्य है। हिंदी में यह रूप उसकी गंभीरता, संबोधन और परमेश्वर के व्यक्तिगत नाम—तीनों को स्वाभाविक ढंग से बनाए रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: मूल पाठ में परमेश्वर का व्यक्तिगत नाम YHWH है; इसलिए उसे किसी उपाधि से बदलने के बजाय हिंदी में ‘याहवे’ लिप्यंतरित किया गया है।
- source_word: אִם יֶשׁ לִי מָעוֹג
  choice: मेरे पास कोई रोटी नहीं है
  rationale: शपथ के संदर्भ में אִם प्रबल निषेध व्यक्त करता है। מָעוֹג छोटी, सेंकी हुई रोटी को दर्शाता है; सहज मुख्य पाठ में ‘रोटी’ रखा गया है और विशिष्ट अर्थ पादटिप्पणी में बताया गया है।
- source_word: מְלֹא כַף קֶמַח
  choice: मुट्ठी भर आटा
  rationale: शाब्दिक भाव ‘हथेली भर’ है; ‘मुट्ठी भर’ आधुनिक हिंदी में स्वाभाविक है और अत्यल्प मात्रा का भाव स्पष्ट रखता है।
- source_word: כַּד
  choice: मटका
  rationale: यह आटा रखने का घरेलू पात्र है; भारतीय हिंदी संदर्भ में ‘मटका’ सहज और स्पष्ट है।
- source_word: צַפַּחַת
  choice: कुप्पी
  rationale: यह तेल रखने का अपेक्षाकृत छोटा पात्र है। ‘कुप्पी’ उसे आटे के बड़े पात्र से अलग दिखाती है।
- source_word: וְהִנְנִי
  choice: देखो
  rationale: यह वक्ता की वर्तमान क्रिया की ओर ध्यान खींचता है; ‘देखो’ संक्षिप्त, वर्तमान और गैर-पुरातन है।
- source_word: מְקֹשֶׁשֶׁת שְׁנַיִם עֵצִים
  choice: मैं दो लकड़ियाँ बटोर रही हूँ
  rationale: कृदंत जारी क्रिया को दर्शाता है। ‘दो लकड़ियाँ’ ईंधन की अत्यल्पता और दृश्य की करुणा को बनाए रखता है।
- source_word: וּבָאתִי וַעֲשִׂיתִיהוּ
  choice: भीतर जाकर उसे ... तैयार करूँ
  rationale: क्रियाओं की क्रमिकता और एकवचन कर्म-संदर्भ को बनाए रखते हुए यह हिंदी में स्वाभाविक है; ‘उसे’ से बनने वाली रोटी/भोजन का संदर्भ खुला रहता है।
- source_word: וַאֲכַלְנֻהוּ וָמָתְנוּ
  choice: हम उसे खाएँगे और मर जाएँगे
  rationale: मूल की कठोर, संक्षिप्त परिणति को बिना नरम किए सीधे रखा गया है।
theological_decisions:
- issue: एक सीदोनी विधवा द्वारा शपथ में יְהוָה नाम का प्रयोग
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: पाठ स्वयं टेट्राग्राम YHWH का प्रयोग करता है। ‘याहवे’ व्यक्तिगत नाम को सुरक्षित रखता है और उसे उपाधि ‘प्रभु’ से नहीं बदलता; वक्ता की जातीय पहचान के आधार पर पाठ के कथन को पुनर्व्याख्यायित नहीं किया गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और बोलचाल में समझ आने योग्य रखी गई है। विधवा की घोर अभाव-स्थिति दिखाने के लिए छोटे, सीधे वाक्य और ‘दो लकड़ियाँ’, ‘मुट्ठी भर’, ‘थोड़ा-सा’ जैसे ठोस पद बनाए रखे गए हैं।
