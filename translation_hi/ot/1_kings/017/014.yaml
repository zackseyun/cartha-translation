  yaml_path: translation/ot/1_kings/017/014.yaml
  text: 'For this is what Yahweh[a], the God of Israel, says: ‘The jar of flour will not be used up, and the jug of oil will not run dry[c][b], until the day Yahweh gives rain on the face of the ground.’'
translation:
  language: hi
  text: 'क्योंकि इस्राएल का परमेश्वर याहवे[a] यों कहता है: “घड़े का आटा समाप्त नहीं होगा और कुप्पी का तेल कम नहीं होगा[b], उस दिन तक, जब याहवे भूमि की सतह पर वर्षा देगा।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में परमेश्वर का व्यक्तिगत नाम चार व्यंजनों יהוה (YHWH) से लिखा गया है; “याहवे” उसका प्रचलित पुनर्निर्मित उच्चारण है।
    reason: textual_cultural_note
  - marker: b
    text: या “नहीं घटेगा।”
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय ईश्वरीय नाम को उपाधि से बदलने के बजाय उसके प्रचलित पुनर्निर्मित उच्चारण के अनुसार देवनागरी में लिप्यंतरित किया गया है।
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: इस्राएल का परमेश्वर
  rationale: इब्रानी संबंधवाचक पदबंध का सीधा और स्वाभाविक हिन्दी रूप, जो भविष्यवाणी के कथन में वक्ता की पहचान बनाए रखता है।
- source_word: כַּד הַקֶּמַח
  choice: घड़े का आटा
  rationale: शाब्दिक संरचना ‘आटे का घड़ा’ है, पर हिन्दी में ‘घड़े का आटा’ अधिक स्वाभाविक ढंग से स्पष्ट करता है कि समाप्त न होने वाली वस्तु आटा है, पात्र नहीं।
- source_word: לֹא תִכְלָה
  choice: समाप्त नहीं होगा
  rationale: כלה यहाँ किसी भंडार के चुक जाने या पूरी तरह खर्च हो जाने को व्यक्त करता है; ‘समाप्त नहीं होगा’ स्पष्ट और गरिमापूर्ण हिन्दी है।
- source_word: צַפַּחַת הַשֶּׁמֶן
  choice: कुप्पी का तेल
  rationale: צַפַּחַת छोटे पात्र को सूचित करता है। ‘कुप्पी’ घड़े से अलग आकार के तेल-पात्र को संक्षेप और स्वाभाविक रूप से व्यक्त करती है।
- source_word: לֹא תֶחְסָר
  choice: कम नहीं पड़ेगा
  rationale: חסר का अर्थ कम होना या अभाव में पड़ना है। तेल की उपलब्धता के संदर्भ में ‘कम नहीं पड़ेगा’ सहज हिन्दी है और ‘घटने’ का विकल्प पादटिप्पणी में सुरक्षित है।
- source_word: עַד יוֹם
  choice: उस दिन तक
  rationale: इब्रानी के स्पष्ट कालवाचक पद ‘दिन तक’ को बनाए रखते हुए हिन्दी में आवश्यक संकेतवाचक शब्द जोड़ा गया है।
- source_word: תתן יְהוָה גֶּשֶׁם
  choice: याहवे वर्षा देगा
  rationale: נתן का मूल अर्थ ‘देना’ है; अतः ‘वर्षा भेजेगा’ के बजाय मूल क्रिया को निकटता से रखा गया है।
- source_word: עַל פְּנֵי הָאֲדָמָה
  choice: भूमि की सतह पर
  rationale: पदबंध के ‘मुख/सतह’ वाले इब्रानी बिंब को समझने योग्य हिन्दी में बनाए रखा गया है; कृषि-संदर्भ में ‘भूमि’ उपयुक्त है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में व्यक्तिगत ईश्वरीय नाम है। उसे केवल उपाधि ‘प्रभु’ से बदलने के बजाय लिप्यंतरित करना मूल की पहचान को सुरक्षित रखता है; ‘याहवे’ व्यापक रूप से स्वीकृत पुनर्निर्मित उच्चारण को दर्शाता है।
