  text: וַ/יִּשְׁמַ֥ע יְהוָ֖ה בְּ/ק֣וֹל אֵלִיָּ֑הוּ וַ/תָּ֧שָׁב נֶֽפֶשׁ הַ/יֶּ֛לֶד עַל קִרְבּ֖/וֹ וַ/יֶּֽחִי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/017/022.yaml
  text: And Yahweh listened to the voice of Elijah[a], and the life of the child returned to his inner being, and he lived.
translation:
  language: hi
  text: और याहवे ने एलिय्याह की आवाज़ सुनी, और बच्चे का जीवन[a] उसके भीतर लौट आया, और वह जीवित हो गया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “बच्चे की आत्मा उसके भीतर लौट आई।” इब्रानी शब्द नेफ़ेश का अर्थ प्रसंग के अनुसार “जीवन,” “प्राण,” “आत्मा,” या “स्वयं व्यक्ति” हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: पुकार सुनी
  rationale: प्रार्थना के इस प्रसंग में שׁמע केवल ध्वनि सुनने के बजाय अनुकूल रूप से सुनने और उत्तर देने का भाव रखता है। हिंदी में “पुकार सुनी” यह भाव स्वाभाविक रूप से व्यक्त करता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत नाम יהוה को किसी उपाधि से बदलने के बजाय प्रचलित हिंदी लिप्यंतरण “याहवे” द्वारा सुरक्षित रखा गया है।
- source_word: בְּקוֹל אֵלִיָּהוּ
  choice: एलिय्याह की पुकार
  rationale: शाब्दिक अर्थ “एलिय्याह की आवाज़” है; निकटवर्ती संदर्भ में वह प्रार्थना कर रहा है, इसलिए “पुकार” ठोस वाणी और विनती—दोनों भावों को सहज हिंदी में रखती है।
- source_word: וַתָּשָׁב
  choice: लौट आया
  rationale: שׁוב यहाँ पुनः लौटने या बहाल होने को दर्शाता है; “लौट आया” इस पुनर्जीवन के प्रसंग में सीधा और स्वाभाविक है।
- source_word: נֶפֶשׁ
  choice: जीवन
  rationale: נֶפֶשׁ का अर्थ प्रसंगानुसार जीवन, प्राण, आत्मा या स्वयं व्यक्ति हो सकता है। मृत बच्चे के जीवित होने के इस प्रसंग में “जीवन” तत्काल कथात्मक अर्थ को स्पष्ट करता है और किसी विशिष्ट आत्मा-शरीर सिद्धांत को अनावश्यक रूप से आरोपित नहीं करता।
- source_word: הַיֶּלֶד
  choice: बच्चे
  rationale: יֶלֶד का अर्थ बच्चा या लड़का हो सकता है। यहाँ “बच्चा” स्वाभाविक है और आयु या लिंग को आवश्यकता से अधिक विशिष्ट नहीं बनाता।
- source_word: עַל קִרְבּוֹ
  choice: उसके भीतर
  rationale: קֶרֶב भीतरी भाग या अंतर्भाग को दर्शाता है। “उसके भीतर” मूल के शारीरिक-अंतरंग स्थानबोध को सरल आधुनिक हिंदी में व्यक्त करता है।
- source_word: וַיֶּחִי
  choice: वह जीवित हो उठा
  rationale: חיה यहाँ पुनर्जीवन के परिणाम को बताता है। हिंदी में “जीवित हो उठा” केवल “जीवित रहा” की अपेक्षा इस प्रसंग का आरंभिक परिवर्तन अधिक स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है।
theological_decisions:
- issue: पुनर्जीवन के प्रसंग में נֶפֶשׁ का अनुवाद
  choice: जीवन
  alternative: आत्मा
  rationale: पद का प्रत्यक्ष कथात्मक आशय बच्चे के जीवन की बहाली है। “जीवन” मूल शब्द की व्यापक अर्थ-सीमा के भीतर रहते हुए किसी निश्चित द्वैतवादी मानव-विज्ञान को आरोपित नहीं करता; परंतु “आत्मा” भी एक प्राचीन और भाषिक रूप से संभव अनुवाद है, इसलिए उसे पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। दो छोटे वाक्यों से इब्रानी कथन-क्रम स्पष्ट रहता है। “पुकार सुनी” प्रार्थना के प्रसंग में अनुकूल उत्तर का संकेत देता है, जबकि “जीवन” के साथ पादटिप्पणी मूल נֶפֶשׁ की वास्तविक अर्थगत अस्पष्टता बनाए रखती है।
