  rationale: किसी व्यक्ति को संबोधित करके पुकारने और फिर बोलने की क्रमिक क्रिया को सहज हिन्दी में व्यक्त करता है।
- source_word: קְחִי נָא לִי
  choice: कृपया ... मेरे लिए ... ले आओ
  rationale: לקח मूलतः ‘लेना’ है, पर वक्ता के पास वस्तु लाने के अनुरोध में ‘ले आओ’ स्वाभाविक है; נָא की विनम्रता ‘कृपया’ से व्यक्त होती है।
- source_word: מְעַט מַיִם בַּכְּלִי
