  text: So he arose and went to Zarephath. When he came to the entrance of the city[a], behold, a widow was there gathering sticks. He called to her and said, “Please bring me a little water in a vessel, so that I may drink.”
translation:
  language: hi
  text: वह उठा और सारपत गया। जब वह नगर के प्रवेश[a] पर पहुँचा, तो देखो, वहाँ एक विधवा लकड़ियाँ बटोर रही थी। उसने उसे पुकारकर कहा, “कृपया किसी पात्र में मेरे लिए थोड़ा पानी ले आओ, ताकि मैं पी सकूँ।”
  philosophy: optimal-equivalence
  footnotes:
