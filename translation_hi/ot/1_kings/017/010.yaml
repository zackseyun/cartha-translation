  rationale: מְעַט की अल्प मात्रा और כְּלִי की सामान्यता दोनों सुरक्षित हैं; ‘घड़ा’ जैसे अधिक विशिष्ट पात्र का अनुमान नहीं लगाया गया।
- source_word: וְאֶשְׁתֶּה
