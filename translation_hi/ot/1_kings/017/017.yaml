source:
  edition: WLC
  text: וַ/יְהִ֗י אַחַר֙ הַ/דְּבָרִ֣ים הָ/אֵ֔לֶּה חָלָ֕ה בֶּן הָ/אִשָּׁ֖ה בַּעֲלַ֣ת הַ/בָּ֑יִת וַ/יְהִ֤י חָלְי/וֹ֙ חָזָ֣ק מְאֹ֔ד עַ֛ד אֲשֶׁ֥ר לֹא נֽוֹתְרָה בּ֖/וֹ נְשָׁמָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/017/017.yaml
  text: After these things[a], the son of the woman who owned the house became sick, and his illness became very severe, until no breath was left in him.
translation:
  language: hi
  text: इन बातों के बाद, उस स्त्री का बेटा, जो घर की मालकिन थी, बीमार पड़ गया। उसकी बीमारी बहुत गंभीर हो गई, यहाँ तक कि उसमें साँस न रही।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसमें जीवन न रहा।” इब्रानी में शाब्दिक अर्थ है, “उसमें साँस न रही।”
    reason: नְשָׁמָה के ‘साँस’ और प्रसंगगत ‘जीवन’—दोनों अर्थ-संकेतों को दिखाना।
lexical_decisions:
- source_word: וַיְהִי אַחַר הַדְּבָרִים הָאֵלֶּה
  choice: इन बातों के बाद
  rationale: यह स्वाभाविक हिन्दी में इब्रानी के कालसूचक कथानक-संक्रमण और बहुवचन ‘बातों’—दोनों को बनाए रखता है।
- source_word: חָלָה
  choice: बीमार पड़ गया
  rationale: यह क्रिया के आरंभात्मक भाव को व्यक्त करता है कि वह बीमार हुआ, न कि केवल पहले से बीमार था।
- source_word: בֶּן הָאִשָּׁה בַּעֲלַת הַבָּיִת
  choice: उस स्त्री का बेटा, जो घर की मालकिन थी
  rationale: ‘घर की मालकिन’ בַּעֲלַת הַבָּיִת के स्वामित्व और गृह-प्रमुख होने के भाव को स्पष्ट, आधुनिक हिन्दी में व्यक्त करता है।
- source_word: וַיְהִי חָלְיוֹ חָזָק מְאֹד
  choice: उसकी बीमारी बहुत गंभीर हो गई
  rationale: यह बीमारी की अत्यधिक गंभीरता और अवस्था में आए परिवर्तन को स्वाभाविक ढंग से दर्शाता है।
- source_word: עַד אֲשֶׁר לֹא נוֹתְרָה בוֹ נְשָׁמָה
  choice: यहाँ तक कि उसमें साँस न रही
  rationale: ‘साँस’ נְשָׁמָה का निकट और स्वाभाविक अर्थ है; इससे मृत्यु का संकेत मिलता है, पर मूल पाठ की अभिव्यक्ति को सीधे ‘वह मर गया’ बनाकर व्याख्यायित नहीं किया जाता।
theological_decisions:
- issue: अंतिम वाक्यांश को स्पष्ट मृत्यु-वचन के रूप में अनूदित करना या इब्रानी मुहावरे को बनाए रखना
  choice: ‘उसमें साँस न रही’ कहकर मूल अभिव्यक्ति को बनाए रखा गया।
  alternative: ‘उसमें जीवन न रहा’ अथवा ‘वह मर गया।’
  rationale: मूल पाठ कहता है कि उसमें נְשָׁמָה नहीं बची। ‘साँस’ मूल शब्द के निकट रहते हुए प्रसंग का मृत्यु-संकेत सुरक्षित रखता है और मुख्य पाठ में उससे अधिक स्पष्ट निष्कर्ष नहीं जोड़ता जितना इब्रानी शब्दांकन स्वयं कहता है।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। ‘बीमार पड़ गया’ बोलचाल में सहज है, जबकि ‘बहुत गंभीर हो गई’ और ‘यहाँ तक कि’ कथात्मक औपचारिकता बनाए रखते हैं।
