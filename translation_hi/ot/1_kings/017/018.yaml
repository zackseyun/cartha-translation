base_translation:
  language: en
  yaml_path: translation/ot/1_kings/017/018.yaml
  text: She said to Elijah[a], “What do I have to do with you, man of God? Have you come to me to bring my iniquity to remembrance and to cause my son to die?”
translation:
  language: hi
  text: उसने एलिय्याह से कहा, “हे परमेश्वर के जन, मेरा आपसे क्या लेना-देना? क्या आप मेरे पास मेरा अपराध[a] स्मरण कराने और मेरे बेटे की मृत्यु कराने आए हैं?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “मेरा पाप,” “मेरा दोष,” अथवा “मेरे दोष का परिणाम।” इब्रानी शब्द गलत काम, उससे उत्पन्न दोष, या दोष के भार और परिणाम को सूचित कर सकता है।
    reason: शब्दार्थ के वास्तविक विकल्पों और धर्मवैज्ञानिक तनाव को सुरक्षित रखना।
lexical_decisions:
- source_word: מַה לִּי וָלָךְ
  choice: मेरा आपसे क्या लेना-देना?
  rationale: यह स्वाभाविक आधुनिक हिन्दी मुहावरा दूरी, विरोध और शिकायत का भाव बनाए रखता है।
- source_word: אִישׁ הָאֱלֹהִים
  choice: परमेश्वर के जन
  rationale: यह भविष्यद्वक्ता अथवा परमेश्वर के दूत के लिए प्रयुक्त औपचारिक इब्रानी उपाधि का प्रतिष्ठित और गरिमापूर्ण हिन्दी रूप है।
- source_word: בָּאתָ אֵלַי
  choice: क्या आप मेरे पास ... आए हैं?
  rationale: प्रत्यक्ष कथन में पूर्ण क्रिया के आरोपात्मक और आलंकारिक प्रश्न-भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: לְהַזְכִּיר
  choice: स्मरण कराने
  rationale: हिफ़ील रूप के कारणवाचक अर्थ को बनाए रखता है और यह खुला छोड़ता है कि अपराध किसके स्मरण में लाया जा रहा है।
- source_word: עֲוֺנִי
  choice: मेरा अपराध
  rationale: ‘अपराध’ नैतिक बुराई का भार बनाए रखता है, जबकि पादटिप्पणी इब्रानी शब्द में निहित पाप, दोष और दोष-परिणाम की अर्थ-सीमा को सुरक्षित रखती है।
- source_word: וּלְהָמִית
  choice: मार डालने
  rationale: מות के हिफ़ील कारणवाचक रूप का सशक्त और स्वाभाविक हिन्दी अर्थ देता है; ‘मृत्यु का कारण बनने’ की अपेक्षा संवाद में अधिक सहज है।
- source_word: בְּנִי
  choice: मेरे बेटे
  rationale: इब्रानी संज्ञा विशेष रूप से पुत्र को सूचित करती है, इसलिए लिंग-विशिष्ट अर्थ सुरक्षित रखा गया है।
theological_decisions:
- issue: विधवा के आरोप में עֲוֺנִי का अर्थ
  choice: मेरा अपराध
  alternative: मेरा पाप; मेरा दोष; मेरे दोष का परिणाम
  rationale: विधवा अपने बेटे की मृत्यु को अपनी नैतिक जवाबदेही से जोड़ती है। इब्रानी शब्द गलत काम, उससे उत्पन्न दोष और उसके परिणाम—इनमें से एक से अधिक अर्थ समेट सकता है; मुख्य पाठ और पादटिप्पणी इस तनाव को संकीर्ण नहीं करते।
- issue: अपराध किसके स्मरण में लाया जाता है
  choice: 'कर्म का अप्रकट रहना: ‘स्मरण कराने’'
  alternative: परमेश्वर को मेरा अपराध स्मरण कराने; मुझे मेरा अपराध याद दिलाने
  rationale: इब्रानी पाठ यह स्पष्ट नहीं करता कि स्मरण किसे कराया जाता है। हिन्दी में भी कर्म को अप्रकट रखकर इस वास्तविक अस्पष्टता को सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण प्रत्यक्ष संवाद। ‘आप’ विधवा के आरोप के बीच भी भविष्यद्वक्ता की औपचारिक उपाधि के अनुरूप सम्मानसूचक संबोधन बनाए रखता है। ‘क्या लेना-देना’ मुहावरे की टकरावपूर्ण शक्ति को सहज हिन्दी में व्यक्त करता है।
