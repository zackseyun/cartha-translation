base_translation:
  language: en
  yaml_path: translation/ot/1_kings/017/001.yaml
  text: And Elijah the Tishbite[a], from the inhabitants of Gilead, said to Ahab, “As Yahweh, the God of Israel, lives, before whom I stand, there will be neither dew nor rain in these years[c][b], except by my word.”
translation:
  language: hi
  text: गिलाद के निवासियों में से तिशबी एलिय्याह[a] ने अहाब से कहा, “इस्राएल के परमेश्वर यहवे जीवित हैं—जिनके सामने मैं खड़ा हूँ—इन वर्षों में न ओस पड़ेगी, न वर्षा होगी[b], मेरे वचन के अनुसार ही[c]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘निवासियों’ का इब्रानी शब्द वहाँ बसे हुए लोगों या बसनेवालों को भी सूचित कर सकता है; अतः अर्थ ‘गिलाद में बसे लोगों में से’ भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी शपथ में शब्दशः ‘यदि ... होगी’ कहा गया है; इस प्रसंग में इसका अर्थ दृढ़ता से ‘नहीं होगी’ है।
    reason: cultural_note
  - marker: c
    text: या, ‘मेरे कहने पर ही’ या ‘मेरे वचन के अनुसार।’
    reason: lexical_alternative
lexical_decisions:
- source_word: הַתִּשְׁבִּי
  choice: तिशबी
  rationale: यह एलिय्याह की उत्पत्ति या संबद्धता बताने वाला नाम-सदृश विशेषण है। ‘तिशबी’ मूल रूप को सुरक्षित रखता है; इसे अनिश्चित रूप से ‘तिशबे का व्यक्ति’ बनाकर नहीं खोला गया।
- source_word: מִתֹּשָׁבֵי גִלְעָד
  choice: गिलाद के निवासियों में से
  rationale: מִן का ‘में से’ अर्थ और תּוֹשָׁב के निवासी/वहाँ बसे व्यक्ति वाले भाव दोनों को स्वाभाविक हिन्दी में रखा गया है।
- source_word: חַי יְהוָה
  choice: यहवे के जीवन की शपथ
  rationale: यह इब्रानी शपथ-वाक्य है। हिन्दी में शपथ का आशय स्पष्ट करते हुए परमेश्वर के जीवित होने पर आधारित उसकी गंभीरता बनाए रखी गई है।
- source_word: יְהוָה
  choice: यहवे
  rationale: वाचा-संबंधी व्यक्तिगत ईश्वरीय नाम को उपाधि में बदलने के बजाय लिप्यंतरित किया गया है।
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: इस्राएल के परमेश्वर
  rationale: मूल रचना और उसके वाचा-संबंधी महत्व को सीधे रूप में सुरक्षित रखा गया है।
- source_word: אֲשֶׁר עָמַדְתִּי לְפָנָיו
  choice: जिनके सामने मैं खड़ा हूँ
  rationale: मूल के ठोस ‘सामने खड़ा होना’ मुहावरे को रखा गया है, ताकि सेवा या प्रतिनिधित्व का निहित भाव बना रहे पर अनुवाद में अतिरिक्त व्याख्या न जुड़े।
- source_word: אִם יִהְיֶה
  choice: न ... पड़ेगी, न ... होगी
  rationale: शपथ के प्रसंग में אִם प्रबल निषेध व्यक्त करता है। हिन्दी में उसका वास्तविक अर्थ स्पष्ट निषेध द्वारा दिया गया है।
- source_word: טַל וּמָטָר
  choice: न ओस पड़ेगी, न वर्षा होगी
  rationale: दोनों मौसम-संबंधी शब्द अलग रखे गए हैं और उनके साथ स्वाभाविक हिन्दी क्रियाएँ प्रयुक्त हुई हैं।
- source_word: הַשָּׁנִים הָאֵלֶּה
  choice: इन वर्षों में
  rationale: दीर्घ अवधि को सूचित करने वाला सरल और निकट औपचारिक अनुवाद।
- source_word: כִּי אִם
  choice: सिवाय
  rationale: यह निषेध के बाद अपवाद या शर्त प्रस्तुत करता है।
- source_word: לְפִי דְבָרִי
  choice: मेरे वचन के अनुसार
  rationale: यह मूल के ‘मेरे वचन के मुँह के अनुसार’ मुहावरे का संयत रूप है और ‘मेरे कहने पर’ की अपेक्षा कारणकारी अधिकार का अर्थ कम थोपता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहवे
  alternative: यहोवा; प्रभु
  rationale: मूल में व्यक्तिगत ईश्वरीय नाम स्पष्ट रूप से उपस्थित है; उसे नाम के रूप में सुरक्षित रखा गया है।
- issue: לְפִי דְבָרִי में भविष्यद्वक्ता का अधिकार
  choice: सिवाय मेरे वचन के अनुसार
  alternative: सिवाय मेरे कहने पर
  rationale: यह रूप एलिय्याह के वचन को वर्षा लौटने की घोषित शर्त के रूप में रखता है, पर यह नहीं बताता कि वह अधिकार परमेश्वर से स्वतंत्र है या नहीं। इस प्रकार मूल का धर्मवैचारिक तनाव सुरक्षित रहता है।
- issue: अप्रत्यक्ष शपथ-निषेध אִם יִהְיֶה
  choice: न ओस पड़ेगी, न वर्षा होगी
  alternative: यदि ओस या वर्षा होगी
  rationale: मूल इब्रानी में शपथ के भीतर ‘यदि होगा’ का वाक्यांश प्रबल निषेध है। शब्दशः हिन्दी अर्थ को उलझा देती, इसलिए उसका प्रचलित अर्थ मुख्य पाठ में दिया गया और संरचना पादटिप्पणी में बताई गई।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में गंभीर, सार्वजनिक पाठ के योग्य और सामान्य पाठक के लिए सुबोध रखी गई है। ‘यहवे’, ‘तिशबी’ और ‘एलिय्याह’ जैसे नाम-संबंधी रूप मूल की पहचान बनाए रखते हैं; वाक्य की शपथात्मक गंभीरता के लिए डैश का प्रयोग किया गया है।
