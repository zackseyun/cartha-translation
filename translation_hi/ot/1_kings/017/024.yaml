source:
  edition: WLC
  text: וַ/תֹּ֤אמֶר הָֽ/אִשָּׁה֙ אֶל אֵ֣לִיָּ֔הוּ עַתָּה֙ זֶ֣ה יָדַ֔עְתִּי כִּ֛י אִ֥ישׁ אֱלֹהִ֖ים אָ֑תָּה וּ/דְבַר יְהוָ֥ה בְּ/פִ֖י/ךָ אֱמֶֽת־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/017/024.yaml
  text: Then the woman said to Elijah[a], “Now I know that you are a man of God, and that the word of Yahweh in your mouth is truth.”
translation:
  language: hi
  text: तब उस स्त्री ने एलिय्याह से कहा, “अब मैं जान गई हूँ कि आप परमेश्वर के जन हैं और आपके मुख में याहवे का वचन सत्य है[a]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इसका अनुवाद “आपके मुख में याहवे का वचन सच्चा है” या “विश्वसनीय है” भी हो सकता है। इब्रानी संज्ञा सत्य, सच्चाई या विश्वसनीयता पर बल दे सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: तब ... ने कहा
  rationale: वाव-परिणामी कथा को आगे बढ़ाता है; ‘तब’ आधुनिक हिन्दी में घटनाक्रम और क्रम को स्वाभाविक रूप से व्यक्त करता है।
- source_word: הָאִשָּׁה
  choice: उस स्त्री
  rationale: मूल पाठ में सामान्य संज्ञा ‘स्त्री’ है; ‘उस’ पूर्वप्रसंग में परिचित स्त्री की ओर संकेत करता है, जबकि यहाँ अनावश्यक रूप से ‘विधवा’ नहीं जोड़ा गया।
- source_word: אֶל אֵלִיָּהוּ
  choice: एलिय्याह से
  rationale: किसी व्यक्ति से कहना हिन्दी में स्वाभाविक संबोधन-रचना है।
- source_word: עַתָּה זֶה
  choice: अब
  rationale: यह पदबंध इस घटना के फलस्वरूप हुई वर्तमान और बलयुक्त पहचान को व्यक्त करता है; शाब्दिक ‘अब यह’ हिन्दी में अस्वाभाविक होगा।
- source_word: יָדַעְתִּי
  choice: मैं जान गई हूँ
  rationale: पूर्ण क्रिया हाल की घटना से प्राप्त वर्तमान, स्थिर बोध को दर्शाती है; स्त्री वक्ता के अनुसार स्त्रीलिंग रूप रखा गया है।
- source_word: אִישׁ אֱלֹהִים
  choice: परमेश्वर के जन
  rationale: यह भविष्यद्वक्ता अथवा परमेश्वर से संबंधित प्रतिनिधि के लिए स्थापित इब्रानी पद है; ‘जन’ आधुनिक सम्मानपूर्ण हिन्दी में अर्थ को स्वाभाविक रूप से व्यक्त करता है।
- source_word: וּדְבַר יְהוָה
  choice: और ... याहवे का वचन
  rationale: דבר का ‘वचन’ अनुवाद भविष्यद्वाणी-संबंधी सूत्र और उसके धार्मिक भार को सुरक्षित रखता है; יְהוָה को उसके व्यक्तिगत वाचा-नाम ‘याहवे’ के रूप में लिप्यंतरित किया गया है।
- source_word: בְּפִיךָ
  choice: आपके मुख में
  rationale: मूल इब्रानी बिंब को बनाए रखा गया है; यह भविष्यद्वक्ता द्वारा बोले गए वचन की ओर संकेत करता है और हिन्दी में समझने योग्य है।
- source_word: אֱמֶת
  choice: सत्य
  rationale: संज्ञा रूप ‘सत्य’ मूल की बलयुक्त पुष्टि को सुरक्षित रखता है, जबकि इसका अर्थ सच्चाई और विश्वसनीयता तक विस्तृत हो सकता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल में चार अक्षरों वाला व्यक्तिगत ईश्वरीय नाम सीधे आया है; ‘याहवे’ उसका प्रचलित विद्वत्तापूर्ण उच्चारण-आधारित लिप्यंतरण है और उसे किसी उपाधि से नहीं बदलता।
- issue: אֱמֶת की विधेयात्मक शक्ति
  choice: वचन सत्य है
  alternative: वचन सच्चा है; वचन विश्वसनीय है
  rationale: ‘सत्य’ मूल संज्ञा को बनाए रखता है और कथन की सच्चाई तथा भरोसेमंदी—दोनों संभावित अर्थ-छायाओं को खुला रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य शैली रखी गई है। संबोधन में ‘आप’ स्त्री द्वारा एलिय्याह के प्रति सम्मान को स्वाभाविक हिन्दी में व्यक्त करता है।
