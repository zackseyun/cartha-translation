source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר אֵלֶ֤י/הָ אֵלִיָּ֨הוּ֙ אַל תִּ֣ירְאִ֔י בֹּ֖אִי עֲשִׂ֣י כִ/דְבָרֵ֑/ךְ אַ֣ךְ עֲשִׂי לִ֣/י מִ֠/שָּׁם עֻגָ֨ה קְטַנָּ֤ה בָ/רִאשֹׁנָה֙ וְ/הוֹצֵ֣אתְ לִ֔/י וְ/לָ֣/ךְ וְ/לִ/בְנֵ֔/ךְ תַּעֲשִׂ֖י בָּ/אַחֲרֹנָֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/017/013.yaml
  text: And Elijah said to her[a], “Do not fear. Go, do as you have said. But first make me a small cake from there and bring it out to me[b], and afterward make some for yourself and for your son.”
translation:
  language: hi
  text: एलिय्याह ने उससे कहा, “मत डर। जा[a], जैसा तूने कहा है वैसा ही कर। लेकिन पहले उसी में से मेरे लिए एक छोटी-सी रोटी[b] बना और मेरे पास ले आ। फिर अपने और अपने बेटे के लिए बनाना।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी क्रिया का शाब्दिक अर्थ “आ” है, पर यहाँ वह आगे बढ़कर बताए गए काम को करने की प्रेरणा देती है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी शब्द से छोटी पकी हुई रोटी या टिकिया का बोध हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל תִּירְאִי
  choice: मत डर
  rationale: निषेध के साथ ירא भयभीत होने का भाव देता है। स्त्रीलिंग एकवचन संबोधन के अनुरूप ‘मत डर’ स्वाभाविक और सीधा है।
- source_word: בֹּאִי
  choice: जा
  rationale: क्रिया का मूल अर्थ ‘आ’ है, पर यहाँ आगामी कार्य आरम्भ करने की प्रेरणा के रूप में प्रयुक्त है; प्रसंग में स्त्री को भोजन तैयार करने भेजा जा रहा है, इसलिए ‘जा’ स्वाभाविक है।
- source_word: עֲשִׂי כִדְבָרֵךְ
  choice: जैसा तूने कहा है वैसा ही कर
  rationale: यह उसके बताए हुए इरादे के अनुसार करने का निर्देश है। यह रूप अर्थ को स्पष्ट और आधुनिक हिन्दी में सहज रखता है।
- source_word: אַךְ
  choice: लेकिन
  rationale: यह पिछले निर्देश को सीमित या संशोधित करते हुए एक शर्त जोड़ता है; ‘लेकिन’ उसका विरोधात्मक बल बनाए रखता है।
- source_word: מִשָּׁם
  choice: उसी में से
  rationale: शाब्दिक अर्थ ‘वहाँ से’ है, पर प्रसंग में संकेत उपलब्ध आटे और तेल की ओर है। ‘उसी में से’ हिन्दी में संदर्भ को स्वाभाविक ढंग से व्यक्त करता है, बिना मात्रा बढ़ाए।
- source_word: עֻגָה קְטַנָּה
  choice: एक छोटी-सी रोटी
  rationale: עֻגָה तवे या गरम सतह पर बनी छोटी रोटी अथवा पकी हुई टिकिया को सूचित कर सकता है। आधुनिक हिन्दी में ‘रोटी’ यहाँ ‘केक’ से अधिक स्वाभाविक है, जबकि पदटिप्पणी शब्द की व्यापकता बताती है।
- source_word: בָרִאשֹׁנָה
  choice: पहले
  rationale: यह स्पष्ट रूप से समय-क्रम में प्राथमिकता बताता है—एलिय्याह के लिए भोजन स्त्री और उसके पुत्र के भोजन से पहले बनना है।
- source_word: וְהוֹצֵאתְ לִי
  choice: और मेरे पास ले आ
  rationale: יצא का हिफ़ील रूप ‘बाहर लाना’ है। हिन्दी में गंतव्य के साथ ‘मेरे पास ले आ’ स्वाभाविक रूप से यही क्रिया व्यक्त करता है।
- source_word: וְלָךְ וְלִבְנֵךְ תַּעֲשִׂי
  choice: फिर अपने और अपने बेटे के लिए बनाना
  rationale: मूल में वस्तु पिछले खंड से समझी जाती है। हिन्दी में भी उसे दोहराए बिना यह वाक्य स्पष्ट है।
- source_word: בָאַחֲרֹנָה
  choice: फिर
  rationale: यह पहले किए जाने वाले काम के बाद का क्रम बताता है; ‘फिर’ संक्षिप्त और सहज है।
theological_decisions:
- issue: एलिय्याह द्वारा अपने लिए पहले भोजन बनवाने से उत्पन्न नैतिक और धर्मवैचारिक तनाव
  choice: ‘पहले’ और ‘फिर’ के द्वारा मूल का समय-क्रम स्पष्ट रूप से बनाए रखा गया
  alternative: एलिय्याह की माँग को नरम करने या उसका औचित्य अनुवाद में जोड़ने वाला भावानुवाद
  rationale: इब्रानी पाठ स्पष्टतः पहले एलिय्याह के लिए और उसके बाद स्त्री तथा उसके बेटे के लिए बनाने को कहता है। अनुवाद इस तनाव को बिना व्याख्यात्मक समाधान जोड़े सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और मौखिक संवाद के अनुकूल शैली अपनाई गई है। इब्रानी के स्त्रीलिंग एकवचन आदेशों को निकट संबोधन वाले ‘तू’ रूप में रखा गया है। अनावश्यक धार्मिक शब्दावली और व्याख्यात्मक विस्तार से बचा गया है।
