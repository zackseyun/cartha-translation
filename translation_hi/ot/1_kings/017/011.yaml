  yaml_path: translation/ot/1_kings/017/011.yaml
  text: As she went to get it[a], he called to her and said[b], “Please bring me a piece of bread in your hand.”
translation:
  language: hi
  text: जब वह उसे लेने जा रही थी, तब उसने उसे पुकारा और कहा, “कृपया मेरे लिए रोटी का एक टुकड़ा अपने हाथ में ले आना।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתֵּלֶךְ לָקַחַת
  choice: जब वह उसे लेने जा रही थी
  rationale: הלך के क्रमसूचक रूप और उसके बाद आए उद्देश्यसूचक infinitive को साथ लेकर यह अनुवाद चल रही क्रिया व्यक्त करता है; ‘उसे’ पिछले पद में माँगे गए पानी की ओर संकेत करता है।
- source_word: וַיִּקְרָא אֵלֶיהָ
  choice: उसने उसे पुकारकर कहा
  rationale: קרא אֶל का सामान्य अर्थ किसी को पुकारना है; हिंदी में अगले וַיֹּאמַר के साथ ‘पुकारकर कहा’ स्वाभाविक और संक्षिप्त है।
- source_word: לִקְחִי נָא לִי
  choice: कृपया ... मेरे लिए ... लेती आना
  rationale: לקח का मूल अर्थ ‘लेना’ है, पर प्रसंग में वस्तु लाकर देने का आशय है; נא विनम्र अनुरोध को ‘कृपया’ से व्यक्त करता है और לִי हितग्राही को ‘मेरे लिए’ से।
- source_word: פַּת לֶחֶם
  choice: रोटी का एक टुकड़ा
  rationale: यह पदबंध रोटी के छोटे अंश या टुकड़े को दर्शाता है; यह आधुनिक हिंदी में स्पष्ट और स्वाभाविक है।
- source_word: בְּיָדֵךְ
  choice: अपने हाथ में
  rationale: हिब्रू की ठोस छवि को सीधे रखा गया है; हिंदी में भी यह समझने योग्य है और साथ लाने का भाव देता है।
theological_decisions: []
translation_notes:
  register: आधुनिक मानक हिंदी में सहज, विनम्र और कथात्मक शैली रखी गई है। स्त्रीलिंग क्रियारूप मूल पाठ में संबोधित विधवा के लिंग के अनुरूप हैं। ‘भी’ पिछले पद में पानी के अनुरोध के अतिरिक्त अब रोटी माँगे जाने का स्वाभाविक संबंध स्पष्ट करता है।
