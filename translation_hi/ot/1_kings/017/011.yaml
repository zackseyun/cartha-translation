review_pass:
  verdict: revise
  source_fidelity: The narrative sequence and the purpose clause referring to the previously requested water are conveyed accurately. The request for a morsel of bread and the concrete phrase ‘in your hand’ are retained. However, the added ‘भी’ is not expressed in the Hebrew and need not be supplied.
  naturalness: ‘अपने हाथ में ... लेती आना’ is awkward in modern standard Hindi; ‘ले आना’ is the idiomatic imperative for bringing something. ‘उसे पुकारा और कहा’ represents the two Hebrew verbs more directly and naturally than ‘उसे पुकारकर कहा.’
  terminology: ‘रोटी का एक टुकड़ा’ is a clear, appropriate rendering of פַּת לֶחֶם. ‘कृपया’ suitably renders the polite entreaty particle נָא. No theological terminology is at issue.
  issues:
  - severity: low
    issue: The word ‘भी’ has been added to the bread request.
    rationale: Although the preceding request for water makes an additional request understandable in context, the Hebrew of this verse does not include an explicit equivalent of ‘also.’ Omitting it preserves the source wording more closely.
  - severity: medium
    issue: ‘लेती आना’ is not idiomatic for this imperative request.
    rationale: The imperative לִקְחִי in context asks the woman to bring bread. Modern Hindi naturally expresses this as ‘ले आना’; the progressive-form expression can sound unnatural and imprecise.
  revised_text: जब वह उसे लेने जा रही थी, तब उसने उसे पुकारा और कहा, “कृपया मेरे लिए रोटी का एक टुकड़ा अपने हाथ में ले आना।”
