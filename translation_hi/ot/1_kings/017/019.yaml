  yaml_path: translation/ot/1_kings/017/019.yaml
  text: And he said to her[a], “Give me your son.” Then he took him from her bosom, carried him up to the upper room where he was staying[b], and laid him on his own bed.
translation:
  language: hi
  text: तब उसने उस स्त्री से कहा, “अपना बेटा मुझे दे दो।” उसने उसे उसकी गोद से लिया और ऊपर की उस कोठरी[a] में ले गया, जहाँ वह ठहरा हुआ था, और उसे अपने बिस्तर पर लिटा दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “ऊपरी कमरा” अथवा “छत पर बनी कोठरी।”
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּנִי לִי אֶת־בְּנֵךְ
  choice: अपना बेटा मुझे दे दो
  rationale: आज्ञार्थक נתן के साथ לִי का स्वाभाविक हिंदी रूप; בֵּן के पुरुषवाचक अर्थ को ‘बेटा’ से सुरक्षित रखा गया है।
- source_word: מֵחֵיקָהּ
  choice: उसकी गोद से
  rationale: חֵיק छाती/गोद के निकट स्नेहपूर्वक थामे जाने के क्षेत्र को दर्शाता है; प्रसंग में ‘गोद’ सहज और सटीक आधुनिक हिंदी है।
- source_word: וַיַּעֲלֵהוּ
  choice: ऊपर ... ले गया
  rationale: क्रिया ऊपर की ओर गति और बालक को साथ ले जाने को व्यक्त करती है; ‘ले गया’ अनावश्यक रूप से उठाने की विधि निश्चित नहीं करता।
- source_word: הָעֲלִיָּה
  choice: ऊपर की ... कोठरी
  rationale: עֲלִיָּה घर की ऊपरी मंज़िल या छत पर बनी कोठरी को सूचित करता है; हिंदी में ‘ऊपर की कोठरी’ स्पष्ट और प्रतिष्ठित है।
- source_word: אֲשֶׁר הוּא יֹשֵׁב שָׁם
  choice: जहाँ वह ठहरा हुआ था
  rationale: यहाँ ישב बैठने के बजाय निवास या अस्थायी ठहराव के अर्थ में है।
- source_word: וַיַּשְׁכִּבֵהוּ עַל־מִטָּתוֹ
  choice: उसे अपने बिस्तर पर लिटा दिया
  rationale: שׁכב का हिफ़ील रूप किसी को लिटाने का भाव देता है; ‘अपने’ से प्रत्यय का एलिय्याह की ओर संकेत सहज रूप से स्पष्ट होता है।
