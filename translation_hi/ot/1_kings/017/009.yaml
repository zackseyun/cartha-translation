  choice: सारपत
  rationale: स्थान-नाम का हिन्दी बाइबलीय परंपरा के अनुरूप लिप्यंतरण।
- source_word: אֲשֶׁ֣ר לְ/צִיד֔וֹן
  choice: सीदोन से संबंधित
  rationale: לְ यहाँ सारपत का सीदोन से भौगोलिक या राजनीतिक संबंध बताता है; यह अनुवाद संबंध को बनाए रखते हुए किसी एक प्रकार को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: וְ/יָשַׁבְתָּ֖ שָׁ֑ם
  choice: और वहीं रहो
  rationale: आज्ञाओं की शृंखला में यह क्रिया वहाँ निवास या ठहराव का निर्देश देती है; ‘वहीं रहो’ वर्तमान हिन्दी में स्वाभाविक है।
- source_word: הִנֵּ֨ה
  choice: देखो
