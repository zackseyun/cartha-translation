  yaml_path: translation/ot/1_kings/017/009.yaml
  text: Get up[a], go to Zarephath, which belongs to Sidon, and stay there. Look[b], I have commanded a widow there to provide for you.
translation:
  language: hi
  text: “उठो, सीदोन से संबंधित सारपत[a] को जाओ और वहीं रहो। देखो, मैंने वहाँ एक विधवा को आज्ञा दी है[b] कि वह तुम्हारा भरण-पोषण करे।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इसका अनुवाद “सीदोन में स्थित सारपत” या “सीदोन के पास का सारपत” भी हो सकता है। इब्रानी पाठ सारपत को सीदोन से जोड़ता है, संभवतः क्षेत्रीय या राजनीतिक संबंध के अर्थ में।
    reason: lexical_alternative
  - marker: b
    text: या “मैंने वहाँ एक विधवा को नियुक्त किया है।” इब्रानी में शाब्दिक अर्थ “मैंने आज्ञा दी है” है। इससे परमेश्वर का संप्रभु निर्देशन व्यक्त हो सकता है, भले ही कथा में अभी यह न दिखाया गया हो कि विधवा उस आज्ञा से सचेत रूप से परिचित थी।
    reason: alternative_reading
