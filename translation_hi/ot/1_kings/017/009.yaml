  choice: मैंने ... आज्ञा दी है
  rationale: צוה के पिएल रूप का सीधा अर्थ सुरक्षित रखा गया है और कथा में विधवा की सचेत जानकारी से जुड़ा तनाव नहीं मिटाया गया।
- source_word: אִשָּׁ֥ה אַלְמָנָ֖ה
  choice: एक विधवा
  rationale: ‘एक स्त्री, एक विधवा’ का अर्थ बिना हानि के स्वाभाविक हिन्दी में व्यक्त होता है।
- source_word: לְ/כַלְכְּלֶֽ/ךָ
  choice: कि वह तुम्हारा पालन-पोषण करे
  rationale: כלכל भोजन देने से अधिक व्यापक रूप में संभालने और आवश्यकताओं की पूर्ति करने का भाव रखता है; ‘पालन-पोषण’ उस सतत व्यवस्था को व्यक्त करता है।
theological_decisions:
- issue: परमेश्वर का यह कहना कि उसने विधवा को ‘आज्ञा दी है’
  choice: प्रत्यक्ष शब्दावली ‘मैंने ... आज्ञा दी है’ बनाए रखना
  alternative: ‘मैंने वहाँ एक विधवा को नियुक्त किया है’ अथवा ‘मैंने वहाँ एक विधवा को तैयार किया है’
  rationale: इब्रानी צוה सामान्यतः ‘आज्ञा देना’ है। आगे की कथा में विधवा को पहले से मिली किसी सचेत आज्ञा का उल्लेख न होने पर भी अनुवाद को इस धार्मिक-कथात्मक तनाव का स्वयं समाधान नहीं करना चाहिए।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और कथात्मक आदेश-प्रधान रूप रखा गया है। ‘देखो’ ध्यानाकर्षक अव्यय को स्पष्ट करता है; ‘संबंधित’ मूल की वास्तविक अस्पष्टता सुरक्षित रखता है। सभी पाद-टिप्पणी चिह्न मुख्य पाठ में दिए गए हैं।
