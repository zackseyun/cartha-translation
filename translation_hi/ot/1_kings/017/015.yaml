base_translation:
  language: en
  yaml_path: translation/ot/1_kings/017/015.yaml
  text: So she went and did according to the word of Elijah[a], and she ate—he and she and her household—for many days.
translation:
  language: hi
  text: तब वह गई और एलिय्याह के वचन के अनुसार किया। और उसने खाया—वह, वह स्त्री और उसका घराना—बहुत दिनों तक।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक स्वाभाविक हिन्दी में: “एलिय्याह, वह स्त्री और उसका घराना बहुत दिनों तक खाते रहे।” इब्रानी में क्रिया स्त्रीलिंग एकवचन है, जिसके बाद खाने वालों की सूची आती है: “वह [एलिय्याह], वह स्त्री और उसका घराना।”'
    reason: मूल इब्रानी की असामान्य स्त्रीलिंग एकवचन क्रिया और उसके बाद आने वाली सहभागी-सूची को स्पष्ट करना।
lexical_decisions:
- source_word: וַתֵּלֶךְ
  choice: तब वह गई
  rationale: वाव-क्रमिक कथानक को आगे बढ़ाता है; ‘तब’ हिन्दी में स्वाभाविक कथात्मक क्रम व्यक्त करता है।
- source_word: וַתַּעֲשֶׂה
  choice: और उसने ... किया
  rationale: עשה यहाँ एलिय्याह के निर्देश का पालन करने के अर्थ में है; ‘किया’ इस व्यापक अर्थ को बनाए रखता है।
- source_word: כִּדְבַר אֵלִיָּהוּ
  choice: एलिय्याह के वचन के अनुसार
  rationale: דבר यहाँ बोले गए निर्देश को दर्शाता है; यह चयन मूल संरचना और औपचारिक गरिमा दोनों को बनाए रखता है।
- source_word: וַתֹּאכַל
  choice: और वह खाती रही
  rationale: क्रिया स्त्रीलिंग एकवचन है और पहले विधवा की ओर संकेत करती है; ‘खाती रही’ उसका रूप बनाए रखते हुए जारी अवधि भी व्यक्त करता है।
- source_word: הוּא וְהִיא וּבֵיתָהּ
  choice: वह पुरुष, वह स्त्री और उसका घराना
  rationale: इब्रानी में लिंग-विशिष्ट सर्वनामों का क्रम ‘वह पुरुष और वह स्त्री’ है; हिन्दी के लिंग-निरपेक्ष ‘वह’ से भेद मिट जाता, इसलिए अर्थ स्पष्ट करते हुए मूल क्रम रखा गया है। संदर्भ में ‘वह पुरुष’ एलिय्याह है।
- source_word: בֵיתָהּ
  choice: उसका घराना
  rationale: בַּיִת यहाँ भवन से अधिक घरेलू परिवार या घर के लोगों को सूचित करता है; ‘घराना’ इस सामूहिक अर्थ को व्यक्त करता है।
- source_word: יָמִים
  choice: बहुत दिनों तक
  rationale: बहुवचन ‘दिन’ यहाँ अवधि-सूचक है; हिन्दी में ‘बहुत दिनों तक’ विस्तृत समय को स्वाभाविक ढंग से व्यक्त करता है।
theological_decisions:
- issue: एकवचन स्त्रीलिंग क्रिया के बाद अनेक खाने वालों की सूची
  choice: मुख्य पाठ में असामान्य एकवचन स्त्रीलिंग संरचना को बनाए रखा गया है।
  alternative: ‘एलिय्याह, वह स्त्री और उसका घराना बहुत दिनों तक खाते रहे।’
  rationale: इब्रानी की व्याकरणिक असामान्यता को बहुवचन क्रिया से चुपचाप समतल नहीं किया गया; पादटिप्पणी स्वाभाविक हिन्दी अर्थ स्पष्ट करती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य रखी गई है। मूल की जानबूझकर असामान्य वाक्य-संरचना मुख्य पाठ में सुरक्षित है और पादटिप्पणी में उसका स्वाभाविक अर्थ दिया गया है।
