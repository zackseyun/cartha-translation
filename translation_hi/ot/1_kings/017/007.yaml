lexical_decisions:
- source_word: וַיְהִי
  choice: कुछ समय बाद…
  rationale: यह कथात्मक संक्रमण सूत्र है; आधुनिक हिंदी में इसे अगले वाक्य में स्वाभाविक रूप से समाहित किया गया है, न कि कृत्रिम ढंग से ‘और ऐसा हुआ’ कहा गया है।
- source_word: מִקֵּץ יָמִים
  choice: कुछ समय बाद
  rationale: यह मुहावरा एक अनिश्चित अवधि बीतने का संकेत देता है; ‘कुछ समय बाद’ उसी अनिश्चितता को स्वाभाविक हिंदी में रखता है।
- source_word: וַיִּיבַשׁ
  choice: सूख गया
  rationale: जलधारा में पानी समाप्त हो जाने के लिए यह सहज और सटीक हिंदी अभिव्यक्ति है।
- source_word: הַנָּחַל
  choice: बरसाती नाला
  rationale: नחל प्रायः ऐसी मौसमी जलधारा या उसके पाट को दर्शाता है जो वर्षा न होने पर सूख सकता है; ‘बरसाती नाला’ सामान्य पाठक के लिए ‘वाडी’ की अपेक्षा अधिक स्पष्ट है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यहाँ यह नाले के सूखने का कारण प्रस्तुत करता है।
- source_word: לֹא הָיָה גֶשֶׁם
  choice: वर्षा नहीं हुई थी
  rationale: संदर्भ में पहले से जारी वर्षा-अभाव को व्यक्त करने के लिए हिंदी का पूर्ण भूतकाल स्वाभाविक है।
- source_word: בָּאָרֶץ
  choice: उस देश में
  rationale: यह आसपास के देश अथवा भूभाग को दर्शाता है, संपूर्ण पृथ्वी को नहीं; ‘उस’ हिंदी में संदर्भित क्षेत्र को सहज बनाता है।
