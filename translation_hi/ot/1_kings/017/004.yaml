source:
  edition: WLC
  text: וְ/הָיָ֖ה מֵ/הַ/נַּ֣חַל תִּשְׁתֶּ֑ה וְ/אֶת הָ/עֹרְבִ֣ים צִוִּ֔יתִי לְ/כַלְכֶּלְ/ךָ֖ שָֽׁם־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/017/004.yaml
  text: And it shall be that you will drink from the brook[c][b][a], and I have commanded the ravens to provide for you there.
translation:
  language: hi
  text: और ऐसा होगा कि तुम उस जलधारा[a] से पानी पीओगे, और मैंने कौवों[b] को आज्ञा दी है कि वे वहाँ तुम्हारा भरण-पोषण[c] करें।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “बरसाती जलधारा,” “नाला,” अथवा “वाडी।”
    reason: lexical_alternative
  - marker: b
    text: कुछ लोगों ने “कौवों” के लिए पक्षियों से भिन्न अर्थ प्रस्तावित किया है, पर हिब्रू में इसका सामान्य अर्थ ये पक्षी ही हैं और आगे का प्रसंग भी इसी अर्थ का समर्थन करता है।
    reason: alternative_reading
  - marker: c
    text: या “तुम्हारे लिए प्रबंध करें” अथवा “तुम्हें खिलाएँ।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: और ... पीना
  rationale: यहाँ हिब्रू सूत्र आगामी परिस्थिति बताता है। हिंदी में आज्ञा-संदर्भ के अनुरूप सहज वाक्य-विन्यास अपनाया गया है; अलग से शाब्दिक ‘और ऐसा होगा कि’ कहना अनावश्यक रूप से बोझिल होता।
- source_word: מֵהַנַּחַל
  choice: उस नाले का पानी
  rationale: נחל मौसमी जलधारा, नाला या सोता सूचित कर सकता है। ‘नाला’ सामान्य हिंदी में सुलभ है; ‘पानी’ जोड़ने से हिंदी में पीने की वस्तु स्वाभाविक रूप से स्पष्ट होती है, जबकि स्रोत का अर्थ नहीं बदलता।
- source_word: תִּשְׁתֶּה
  choice: पीना
  rationale: द्वितीय पुरुष एकवचन की आगामी क्रिया यहाँ परमेश्वर के निर्देश का भाग है। हिंदी का निर्देशात्मक ‘पीना’ प्रसंग में स्वाभाविक और स्पष्ट है।
- source_word: הָעֹרְבִים
  choice: कौवों
  rationale: עֹרְבִים सामान्यतः रैवन/कौवा-कुल के पक्षियों को दर्शाता है। आधुनिक सामान्य हिंदी में ‘कौवे’ सबसे सुबोध निकटतम पद है; पक्षियों वाला साधारण अर्थ अगले प्रसंग से भी पुष्ट होता है।
- source_word: צִוִּיתִי
  choice: मैंने ... आज्ञा दी है
  rationale: पूर्ण क्रिया पहले से की गई ऐसी व्यवस्था बताती है जिसका प्रभाव वर्तमान में है; हिंदी पूर्ण वर्तमान इसे ठीक प्रकार व्यक्त करता है।
- source_word: לְכַלְכֶּלְךָ
  choice: तुम्हारे लिए भोजन का प्रबंध करें
  rationale: כלכל का अर्थ संभालना, पोषण करना या आवश्यकताओं की पूर्ति करना है। आगामी कथा में कौवे भोजन लाते हैं, इसलिए यह वाक्यांश व्यापक प्रबंध और ठोस भोजन—दोनों को स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: שָׁם
  choice: वहाँ
  rationale: स्थानवाचक क्रियाविशेषण का सीधा और स्वाभाविक हिंदी समतुल्य।
theological_decisions:
- issue: कौवों को दी गई आज्ञा का स्वरूप
  choice: परमेश्वर ने वास्तविक पक्षियों—कौवों—को एलिय्याह के लिए भोजन का प्रबंध करने की आज्ञा दी।
  alternative: कुछ लोगों ने पक्षियों के स्थान पर किसी स्थान-नाम या मानव-समूह का अर्थ प्रस्तावित किया है।
  rationale: הָעֹרְבִים का सामान्य हिब्रू अर्थ कौवा-कुल के पक्षी हैं, और आगे उनके रोटी और मांस लाने का वर्णन इसी अर्थ का समर्थन करता है। पाठ को किसी धर्मवैज्ञानिक आग्रह के कारण असाधारण अर्थ देने की आवश्यकता नहीं है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘नाला’ भारतीय हिंदी में कभी-कभी गंदे नाले का बोध करा सकता है, इसलिए पादटिप्पणी में ‘जलधारा’ और ‘बरसाती नाला’ दिए गए हैं। मुख्य पाठ में स्रोत के आदेशात्मक संदर्भ और पहले से की गई दिव्य व्यवस्था को स्पष्ट रखा गया है।
