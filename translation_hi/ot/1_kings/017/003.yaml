  text: לֵ֣ךְ מִ/זֶּ֔ה וּ/פָנִ֥יתָ לְּ/ךָ֖ קֵ֑דְמָ/ה וְ/נִסְתַּרְתָּ֙ בְּ/נַ֣חַל כְּרִ֔ית אֲשֶׁ֖ר עַל פְּנֵ֥י הַ/יַּרְדֵּֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/017/003.yaml
  text: Go from here and turn yourself eastward[a], and hide yourself by the Wadi Cherith[c][b], which is east of the Jordan.
translation:
  language: hi
  text: “यहाँ से चले जाओ और पूरब की ओर मुड़ो। फिर करीत नामक नाले[a] के पास छिप जाओ, जो यरदन के सामने[b] है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी शब्द का अर्थ घाटी, मौसमी जलधारा या नाले जैसा जलमार्ग भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या “जो यरदन के पार/सम्मुख है।” इस भौगोलिक वाक्यांश को “जो यरदन के पूरब में है” भी समझा गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: לֵךְ מִזֶּה
  choice: यहाँ से चले जाओ
  rationale: आज्ञार्थक לֵךְ और स्थान-सूचक מִזֶּה को स्वाभाविक तथा सीधी आधुनिक हिन्दी में व्यक्त करता है।
- source_word: וּפָנִיתָ לְּךָ קֵדְמָה
  choice: पूरब की ओर मुड़ो
  rationale: קֵדְמָה स्पष्टतः पूरब की दिशा बताता है। לְךָ की मुहावरेदार/आत्मवाचक छाया हिन्दी में अलग सर्वनाम जोड़े बिना स्वाभाविक क्रिया में समाहित है।
- source_word: וְנִסְתַּרְתָּ
  choice: छिप जाओ
  rationale: निफ़ाल रूप का प्रसंगानुकूल आत्मवाचक अर्थ सरल और स्वाभाविक हिन्दी में सुरक्षित रहता है।
- source_word: בְּנַחַל
  choice: नाले के पास
  rationale: נַחַל घाटी, मौसमी जलधारा या नाले जैसे जलमार्ग को सूचित कर सकता है। ‘नाला’ सामान्य हिन्दी में समझने योग्य है, जबकि पादटिप्पणी अर्थ-सीमा स्पष्ट करती है।
- source_word: כְּרִית
  choice: करीत
  rationale: इब्रानी स्थान-नाम का निकट देवनागरी लिप्यंतरण।
- source_word: אֲשֶׁר עַל פְּנֵי הַיַּרְדֵּן
  choice: जो यरदन के सामने है
  rationale: עַל־פְּנֵי के अधिक प्रत्यक्ष स्थानिक अर्थ ‘सामने’ को रखता है और बिना पर्याप्त निश्चितता के ‘यरदन के पूरब में’ कहकर भौगोलिक अस्पष्टता को समाप्त नहीं करता।
