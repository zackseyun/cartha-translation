base_translation:
  language: en
  yaml_path: translation/ot/1_kings/009/010.yaml
  text: And it happened at the end of twenty years[b][a], in which Solomon had built the two houses—the house of Yahweh and the king's house—
translation:
  language: hi
  text: बीस वर्ष पूरे होने पर[a], जिनमें सुलैमान ने दोनों भवन[b]—याहवे का भवन और राजा का भवन—बनाए थे, तब—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “बीस वर्ष बीत जाने के बाद।” इब्रानी मुहावरा बीस वर्षों की अवधि पूरी होने का समय बताता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से “वे दोनों घर”; अर्थात याहवे का भवन और राजा का भवन।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: तब
  rationale: यह रूप कथा में अगले घटनाक्रम की ओर ले जाता है। हिंदी में आरंभिक कालवाचक उपवाक्य के साथ ‘तब’ स्वाभाविक है और अगले पद तक चलने वाली वाक्य-रचना को बनाए रखता है।
- source_word: מִקְצֵה עֶשְׂרִים שָׁנָה
  choice: जब वे बीस वर्ष पूरे हुए
  rationale: इब्रानी मुहावरा बीस वर्षों की अवधि पूरी होने के समय को दर्शाता है। यह हिंदी में स्वाभाविक ढंग से वही अर्थ देता है।
- source_word: אֲשֶׁר
  choice: जिनमें
  rationale: संबंधवाचक सर्वनाम बीस वर्षों की अवधि से निर्माण-कार्य को जोड़ता है और मूल की संरचना को अनावश्यक रूप से स्पष्ट नहीं करता।
- source_word: בָּנָה
  choice: बनाए थे
  rationale: पूर्ण भूतकाल यह दिखाता है कि वर्णित समय-बिंदु तक निर्माण का कार्य हो चुका था।
- source_word: שְׁנֵי הַבָּתִּים
  choice: दोनों भवन
  rationale: בַּיִת का मूल अर्थ ‘घर/भवन’ है; यहाँ दो बड़े निर्माणों के लिए ‘भवन’ अधिक स्वाभाविक है, जबकि ‘दोनों’ उनकी आगे दी गई पहचान से मेल खाता है।
- source_word: בֵּית יְהוָה
  choice: याहवे का भवन
  rationale: यह मूल पदबंध ‘याहवे का घर/भवन’ को बनाए रखता है और व्याख्यात्मक ‘मंदिर’ जोड़ने से बचता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय निजी नाम को उपाधि से बदलने के बजाय उसके प्रचलित लिप्यंतरण से प्रस्तुत किया गया है।
- source_word: בֵּית הַמֶּלֶךְ
  choice: राजा का भवन
  rationale: यह मूल के शाब्दिक समानांतर—याहवे का भवन और राजा का भवन—को सुरक्षित रखता है; ‘राजमहल’ संभव है, पर अधिक संदर्भात्मक व्याख्या है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: पद में निजी ईश्वरीय नाम सीधे आया है। ‘याहवे’ उसका आधुनिक हिंदी लिप्यंतरण है और उसे किसी उपाधि से प्रतिस्थापित नहीं करता।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सहज हिंदी। पद मूल में अगले कथन की भूमिका है, इसलिए अंत का दीर्घ विराम और ‘तब—’ अधूरी वाक्य-रचना को जानबूझकर सुरक्षित रखते हैं। ‘भवन’ दोनों इमारतों के लिए समानांतर शब्दावली बनाए रखता है।
