base_translation:
  language: en
  yaml_path: translation/ot/1_kings/009/025.yaml
  text: And Solomon offered up burnt offerings and peace offerings on the altar that he had built for Yahweh three times a year[a], and he burned incense with it before Yahweh[b]. Thus he completed the house.
translation:
  language: hi
  text: सुलैमान वर्ष में तीन बार उस वेदी पर, जिसे उसने याहवे के लिए बनाया था, होमबलियाँ और मेलबलियाँ चढ़ाता था। वह याहवे के सामने उस पर धूप भी जलाता था[a]। इस प्रकार उसने भवन पूरा किया[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उस पर बलियों को जलाकर उनका धुआँ उठाता था”; हिब्रू क्रिया केवल धूप जलाने के बजाय अधिक व्यापक रूप से किसी बलि को जलाकर धुआँ उठाने का अर्थ भी दे सकती है।
    reason: lexical_alternative
  - marker: b
    text: अर्थात मंदिर। हिब्रू में “भवन” या “घर” है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֶעֱלָה
  choice: चढ़ाता था
  rationale: बलिदान के प्रसंग में עלה के हिफ़ील रूप का अर्थ बलि चढ़ाना है। यहाँ नियमित वार्षिक रीति का सार दिया गया है, इसलिए हिन्दी में अभ्यस्त क्रिया-रूप स्वाभाविक है।
- source_word: עֹלוֹת
  choice: होमबलियाँ
  rationale: यह वेदी पर पूर्णतः जलाई जाने वाली बलियों का पारिभाषिक नाम है; ‘होमबलि’ हिन्दी बाइबलीय भाषा में प्रचलित और संक्षिप्त है।
- source_word: שְׁלָמִים
  choice: मेलबलियाँ
  rationale: यह सहभागिता, कुशलता या शांति से जुड़ी बलियों की श्रेणी है। ‘मेलबलि’ हिन्दी में पहचाना जाने वाला पारिभाषिक रूप है और मूल शब्द के संबंधपरक भाव को व्यक्त करता है।
- source_word: שָׁלֹשׁ פְּעָמִים בַּשָּׁנָה
  choice: वर्ष में तीन बार
  rationale: हिब्रू कालवाचक पदबंध का सहज और सटीक हिन्दी रूप।
- source_word: וְהַקְטֵיר
  choice: धूप भी जलाता था
  rationale: קטר का हिफ़ील रूप धूप जलाने के लिए प्रयुक्त हो सकता है। मंदिर के प्रसंग में यह सहज अर्थ है, पर व्यापक बलिदानी धुआँ उत्पन्न करने की सम्भावना पादटिप्पणी में सुरक्षित रखी गई है।
- source_word: אִתּוֹ
  choice: उस पर
  rationale: प्रत्यय को निकटवर्ती वेदी से संबद्ध समझते हुए हिन्दी में स्थानवाचक रूप दिया गया है। हिब्रू वाक्य-विन्यास कठिन है, इसलिए अनावश्यक विस्तार से बचा गया है।
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत नाम का देवनागरी लिप्यंतरण किया गया है, उसे किसी उपाधि से नहीं बदला गया।
- source_word: וְשִׁלַּם אֶת הַבָּיִת
  choice: इस प्रकार उसने भवन को पूरा किया
  rationale: שלם के पिएल रूप का अर्थ पूरा करना है। ‘भवन’ मूल के ‘घर’ को इस मंदिर-संदर्भ में स्वाभाविक हिन्दी में व्यक्त करता है, जबकि पादटिप्पणी संदर्भ स्पष्ट करती है।
theological_decisions:
- issue: सुलैमान द्वारा बलिदान और धूप जलाने की क्रियाओं का स्वरूप
  choice: क्रियाएँ सीधे सुलैमान से संबद्ध रखते हुए अनुवाद किया गया है, जैसा हिब्रू राजकीय सार-वर्णन में है।
  alternative: इसे स्पष्ट रूप से ‘उसने याजकों से चढ़वाया’ कहना, अथवा यह कहना कि उसने स्वयं अपने हाथों से सारे अनुष्ठान किए।
  rationale: हिब्रू पाठ यह निर्धारित नहीं करता कि राजा ने हर कर्म व्यक्तिगत रूप से किया या अपने अधिकार में करवाया। अनुवाद इस धर्मवैचारिक तनाव को बिना अतिरिक्त निष्कर्ष जोड़े बनाए रखता है।
- issue: וְהַקְטֵיר का अर्थ
  choice: मुख्य पाठ में ‘धूप जलाता था’।
  alternative: ‘बलियों को धुएँ में बदलता था’ या ‘बलि जलाता था’।
  rationale: मंदिर-संदर्भ में धूप सम्भावित और स्वाभाविक है, किंतु क्रिया का व्यापक बलिदानी अर्थ भी वास्तविक है; इसलिए उसे पादटिप्पणी में दिया गया है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘होमबलि’ और ‘मेलबलि’ जैसे स्थापित धार्मिक पदों को बनाए रखा गया है। वाक्य-विन्यास को हिन्दी के स्वाभाविक क्रम में ढाला गया है, और कठिन हिब्रू अभिव्यक्ति की वास्तविक अस्पष्टता पादटिप्पणी में सुरक्षित है।
