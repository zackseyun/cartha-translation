  yaml_path: translation/ot/1_kings/009/026.yaml
  text: King Solomon also built a fleet of ships at Ezion-geber[a], which is beside Eloth on the shore of the Red Sea, in the land of Edom.
translation:
  language: hi
  text: राजा सुलैमान ने एस्योन-गेबेर में जहाज़ों का एक बेड़ा भी बनाया। यह एदोम देश में एलोत के पास, लाल सागर[a] के तट पर था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इब्रानी में: “सरकंडों का सागर”; परंपरागत अनुवाद: “लाल सागर।”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֳנִי
  choice: जहाज़ों का एक बेड़ा भी
  rationale: אֳנִי जहाज़ अथवा सामूहिक अर्थ में बेड़े को सूचित कर सकता है। प्रसंग समुद्री उद्यम का है, इसलिए स्वाभाविक हिन्दी में ‘जहाज़ों का एक बेड़ा’ चुना गया; וָ का कथात्मक संबंध ‘भी’ से व्यक्त किया गया।
- source_word: עָשָׂה
  choice: बनवाया
  rationale: मूल क्रिया का सामान्य अर्थ ‘बनाया’ है, पर राजा के द्वारा जहाज़ों के निर्माण की व्यवस्था कराए जाने के भाव को आधुनिक हिन्दी में ‘बनवाया’ अधिक स्वाभाविक रूप से व्यक्त करता है।
- source_word: בְּעֶצְיוֹן גֶּבֶר
  choice: एस्योन-गेबेर में
  rationale: स्थान-नाम को देवनागरी में लिप्यंतरित किया गया और בְּ को हिन्दी के स्वाभाविक स्थानवाचक ‘में’ से व्यक्त किया गया।
- source_word: אֲשֶׁר אֶת אֵלוֹת
  choice: यह … एलोत के पास … था
  rationale: यह रचना एलोत के साथ स्थानिक निकटता दर्शाती है। ‘के पास’ आधुनिक हिन्दी में स्पष्ट और सहज है तथा अस्पष्ट दूरी नहीं जोड़ता।
- source_word: עַל שְׂפַת יַם סוּף
  choice: लाल सागर[a] के तट पर
  rationale: שְׂפַת का भौगोलिक अर्थ ‘किनारा/तट’ है। יַם־סוּף का पारंपरिक और इस भूगोल में परिचित अनुवाद ‘लाल सागर’ रखा गया, जबकि अधिक शाब्दिक विकल्प पादटिप्पणी में सुरक्षित है।
- source_word: בְּאֶרֶץ אֱדוֹם
  choice: एदोम देश में
  rationale: यह चयन ‘एदोम में’ की अपेक्षा मूल के אֶרֶץ (‘देश/भूमि’) को स्पष्ट रूप से बनाए रखता है।
