source:
  edition: WLC
  text: בְּנֵי/הֶ֗ם אֲשֶׁ֨ר נֹתְר֤וּ אַחֲרֵי/הֶם֙ בָּ/אָ֔רֶץ אֲשֶׁ֧ר לֹֽא יָכְל֛וּ בְּנֵ֥י יִשְׂרָאֵ֖ל לְ/הַֽחֲרִימָ֑/ם וַ/יַּעֲלֵ֤/ם שְׁלֹמֹה֙ לְ/מַס עֹבֵ֔ד עַ֖ד הַ/יּ֥וֹם הַ/זֶּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/009/021.yaml
  text: their children who were left after them in the land[a], whom the sons of Israel had not been able to devote to destruction—Solomon conscripted them for forced labor, to this day.
translation:
  language: hi
  text: उनके वंशज, जो उनके बाद उस देश में रह गए थे और जिन्हें इस्राएल के लोग विनाश के लिए समर्पित नहीं कर सके थे[a]—उन्हें सुलैमान ने बेगार के लिए लगाया, और वे आज तक बेगार में लगे रहे हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी क्रिया का अर्थ किसी व्यक्ति या वस्तु को न्याय के लिए अपरिवर्तनीय रूप से अलग करके विनाश के लिए समर्पित करना है। इसके अनुवाद ‘पूरी तरह नष्ट करना’ या ‘विनाश के निषेध के अधीन करना’ भी हो सकते हैं।
    reason: חרם के विनाशकारी तथा समर्पण/न्याय-संबंधी दोनों अर्थों और वैकल्पिक अनुवादों को स्पष्ट करना।
lexical_decisions:
- source_word: בְּנֵיהֶם
  choice: उनके वे वंशज
  rationale: बहुवचन בָּנִים यहाँ केवल पुत्रों के बजाय बाद की पीढ़ी या वंशजों को सूचित कर सकता है। ‘वंशज’ लिंग को अनावश्यक रूप से सीमित किए बिना प्रसंग का पीढ़ीगत अर्थ स्पष्ट करता है।
- source_word: נֹתְרוּ אַחֲרֵיהֶם
  choice: जो उनके बाद ... रह गए थे
  rationale: यह शेष रह जाने और पिछली पीढ़ी के बाद बने रहने, दोनों भावों को सहज हिन्दी में व्यक्त करता है।
- source_word: בָּאָרֶץ
  choice: उस देश में
  rationale: निर्दिष्ट אֶרֶץ से प्रसंग में कनान/इस्राएल का देश अभिप्रेत है; ‘उस देश में’ हिन्दी में निश्चितता को स्वाभाविक रूप से दर्शाता है।
- source_word: לֹא יָכְלוּ ... לְהַחֲרִימָם
  choice: जिन्हें ... विनाश के लिए समर्पित नहीं कर सके थे
  rationale: ‘विनाश के लिए समर्पित करना’ חרם की विनाश और न्याय हेतु अपरिवर्तनीय समर्पण—दोनों ध्वनियों को बनाए रखता है; केवल ‘नष्ट करना’ इसके धार्मिक-न्यायिक पक्ष को सपाट कर देता।
- source_word: וַיַּעֲלֵם
  choice: उन्हें ... लगा दिया
  rationale: हिफ़ील रूप और לְמַס के साथ यह प्रशासनिक रूप से किसी पर श्रम-भार लगाने का भाव देता है। हिन्दी में ‘लगा दिया’ उस कारक क्रिया को सहज रूप से व्यक्त करता है।
- source_word: לְמַס עֹבֵד
  choice: बेगार के काम में
  rationale: מַס עֹבֵד अनिवार्य श्रम या श्रम-कर को दर्शाता है। ‘बेगार’ सामान्य हिन्दी में बिना पारिश्रमिक या बाध्य करके कराए जाने वाले श्रम का सटीक और संक्षिप्त शब्द है।
- source_word: עַד הַיּוֹם הַזֶּה
  choice: और यह आज तक जारी है
  rationale: हिब्रू काल-सूत्र का आशय है कि थोपी गई व्यवस्था लेखक के समय तक बनी रही। यह हिन्दी रूप उस निरंतरता को स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है।
theological_decisions:
- issue: विजय और न्याय के प्रसंग में החרים का अनुवाद
  choice: विनाश के लिए समर्पित करना
  alternative: पूरी तरह नष्ट करना; विनाश की मन्नत के अधीन करना
  rationale: मूल क्रिया में विनाश के साथ किसी व्यक्ति या वस्तु को חרם के अधीन, अर्थात न्याय के लिए अपरिवर्तनीय रूप से अलग कर देने का भाव भी है। चुना गया रूप इस तनाव को बनाए रखता है और इसे केवल सैनिक संहार तक सीमित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘वंशज’ पीढ़ीगत अर्थ को और ‘बेगार’ बाध्य श्रम को संक्षेप में व्यक्त करता है। वाक्य की दीर्घ सम्बन्धवाचक संरचना मूल के प्रवाह के निकट है, जबकि डैश मुख्य कथन को स्पष्ट करता है।
