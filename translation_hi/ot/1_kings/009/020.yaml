source:
  edition: WLC
  text: כָּל הָ֠/עָם הַ/נּוֹתָ֨ר מִן הָ/אֱמֹרִ֜י הַ/חִתִּ֤י הַ/פְּרִזִּי֙ הַ/חִוִּ֣י וְ/הַ/יְבוּסִ֔י אֲשֶׁ֛ר לֹֽא מִ/בְּנֵ֥י יִשְׂרָאֵ֖ל הֵֽמָּה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/009/020.yaml
  text: All the people who remained of the Amorites[a], the Hittites, the Perizzites, the Hivites, and the Jebusites, who were not of the sons of Israel—
translation:
  language: hi
  text: एमोरियों, हित्तियों, परिज्जियों, हिव्वियों और यबूसियों में से बचे हुए वे सभी लोग, जो इस्राएल के वंशजों में से नहीं थे[a]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “इस्राएल के पुत्रों में से नहीं थे।”
    reason: इब्रानी בְּנֵי יִשְׂרָאֵל की शब्दशः अभिव्यक्ति को सुरक्षित रखना।
lexical_decisions:
- source_word: כָּל הָעָם הַנּוֹתָר
  choice: बचे हुए वे सभी लोग
  rationale: इब्रानी सामूहिक संज्ञा और निफ़ाल कृदंत का स्वाभाविक हिन्दी रूप; כָּל की समग्रता को ‘सभी’ से व्यक्त किया गया है।
- source_word: מִן הָאֱמֹרִי הַחִתִּי הַפְּרִזִּי הַחִוִּי וְהַיְבוּסִי
  choice: एमोरियों, हित्तियों, परिज्जियों, हिव्वियों और यबूसियों में से
  rationale: מִן यहाँ सूचीबद्ध जातियों में से बचे लोगों को चिह्नित करता है। जातिनामों को प्रचलित हिन्दी बाइबलीय लिप्यंतरण में बहुवचन रूप दिया गया है।
- source_word: אֲשֶׁר לֹא מִבְּנֵי יִשְׂרָאֵל הֵמָּה
  choice: जो इस्राएल के वंशजों में से नहीं थे
  rationale: בְּנֵי יִשְׂרָאֵל एक प्रचलित वंशगत-जातीय पद है; ‘इस्राएल के वंशज’ आधुनिक हिन्दी में अर्थ स्पष्ट रखता है। הֵמָּה से मिलने वाला बल हिन्दी में ‘वे’ और वाक्य-विन्यास से व्यक्त होता है।
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל का लिंगयुक्त वंशगत पद
  choice: इस्राएल के वंशज
  alternative: इस्राएल के पुत्र
  rationale: यहाँ पद पूरे इस्राएली समुदाय की जातीय पहचान बताता है, केवल पुरुष संतानों की नहीं। मुख्य पाठ में अर्थ-सटीक और स्वाभाविक ‘वंशज’ रखा गया है, जबकि शाब्दिक रूप पादटिप्पणी में सुरक्षित है।
- issue: पद 21 में जारी रहने वाली अधूरी वाक्य-संरचना
  choice: अंत में दीर्घ डैश
  alternative: पूर्ण विराम
  rationale: इब्रानी वाक्य अगले पद में आगे बढ़ता है; डैश इस निरंतरता को बिना कृत्रिम रूप से वाक्य पूरा किए दिखाता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सहज हिन्दी है। जातिनामों के लिए प्रचलित हिन्दी बाइबलीय रूप अपनाए गए हैं। पद अगले पद में जारी रहता है, इसलिए अंत में दीर्घ डैश रखा गया है।
