source:
  edition: WLC
  text: וְ/הִכְרַתִּ֣י אֶת יִשְׂרָאֵ֗ל מֵ/עַ֨ל פְּנֵ֤י הָ/אֲדָמָה֙ אֲשֶׁ֣ר נָתַ֣תִּי לָ/הֶ֔ם וְ/אֶת הַ/בַּ֨יִת֙ אֲשֶׁ֣ר הִקְדַּ֣שְׁתִּי לִ/שְׁמִ֔/י אֲשַׁלַּ֖ח מֵ/עַ֣ל פָּנָ֑/י וְ/הָיָ֧ה יִשְׂרָאֵ֛ל לְ/מָשָׁ֥ל וְ/לִ/שְׁנִינָ֖ה בְּ/כָל הָ/עַמִּֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/009/007.yaml
  text: then I will cut off Israel from the face of the land that I have given them[a], and the house that I have consecrated for my name I will cast out from before my face[d][c][b], and Israel will become a proverb and a taunt among all peoples.
translation:
  language: hi
  text: तब मैं इस्राएल को उस भूमि से काट डालूँगा जो मैंने उन्हें दी है, और उस भवन[a] को, जिसे मैंने अपने नाम के लिए[b] पवित्र ठहराया है, अपने सामने से निकाल दूँगा[c]; और इस्राएल सब जातियों के बीच एक कहावत और उपहास का विषय[d] बन जाएगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात् मन्दिर। इब्रानी में ‘घर’।
    reason: lexical_alternative
  - marker: b
    text: ‘अपने नाम के लिए’ इब्रानी अभिव्यक्ति है, जिसका अर्थ है परमेश्वर का नाम धारण करने और उसका आदर करने के लिए समर्पित।
    reason: cultural_note
  - marker: c
    text: या, ‘अपनी उपस्थिति से हटा दूँगा।’
    reason: lexical_alternative
  - marker: d
    text: या, ‘एक कहावत और ताना।’
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִכְרַתִּי
  choice: काट डालूँगा
  rationale: हिफ़ील रूप यहाँ अलग कर देने अथवा हटा देने के न्यायसूचक भाव को व्यक्त करता है। ‘काट डालूँगा’ इब्रानी बिंब और वाचा-संबंधी न्याय की तीव्रता रखता है, पर पूर्ण विनाश को अनिवार्य नहीं बनाता।
- source_word: מֵעַל פְּנֵי הָאֲדָמָה
  choice: उस देश में से
  rationale: शाब्दिक बिंब ‘भूमि के मुख पर से’ है, पर अगले संबंधवाचक वाक्य में परमेश्वर द्वारा दिए गए देश का स्पष्ट उल्लेख है। स्वाभाविक हिन्दी में ‘उस देश में से’ निष्कासन का आशय ठीक व्यक्त करता है।
- source_word: הַבַּיִת
  choice: भवन
  rationale: इब्रानी में सामान्य शब्द ‘घर/भवन’ है, यद्यपि संदर्भ में यह मन्दिर है। ‘भवन’ मूल शब्दावली को बनाए रखता है; स्पष्टार्थ ‘मन्दिर’ पादटिप्पणी में दिया गया है।
- source_word: הִקְדַּשְׁתִּי
  choice: पवित्र ठहराया है
  rationale: यह किसी वस्तु को पवित्र उपयोग के लिए अलग करने का भाव देता है। ‘पवित्र ठहराया’ आधुनिक हिन्दी में स्पष्ट और गरिमापूर्ण है।
- source_word: לִשְׁמִי
  choice: अपने नाम के लिए
  rationale: राजाओं की पुस्तक में परमेश्वर के ‘नाम’ के लिए भवन का समर्पण एक महत्त्वपूर्ण इब्रानी अभिव्यक्ति है; इसे व्याख्यात्मक रूप से बदलने के बजाय सुरक्षित रखा गया है।
- source_word: אֲשַׁלַּח מֵעַל פָּנָי
  choice: अपने सामने से दूर कर दूँगा
  rationale: שׁלח का अर्थ भेज देना अथवा दूर कर देना हो सकता है और מֵעַל פָּנָי शाब्दिक रूप से ‘मेरे मुख के सामने से’ है। चुना हुआ रूप अस्वीकृति और उपस्थिति से हटाए जाने का भाव स्वाभाविक हिन्दी में रखता है।
- source_word: לְמָשָׁל וְלִשְׁנִינָה
  choice: एक कहावत और उपहास का विषय
  rationale: מָשָׁל ‘कहावत/लोकोक्ति’ और שְׁנִינָה उपहासपूर्ण कथन या ताने का संकेत देता है। हिन्दी में ‘उपहास का विषय’ दूसरे पद का आशय अधिक सहजता से व्यक्त करता है।
- source_word: בְּכָל הָעַמִּים
  choice: सब जातियों के बीच
  rationale: עַמִּים विभिन्न जनसमुदायों को दर्शाता है। ‘जातियाँ’ बाइबलीय हिन्दी में आधुनिक राष्ट्र-राज्यों तक अर्थ को सीमित किए बिना इसे व्यक्त करता है।
theological_decisions:
- issue: वाचा के न्याय को पूर्ण संहार के रूप में अधिक स्पष्ट कर देने का जोखिम
  choice: इस्राएल को उस देश में से काट डालूँगा
  alternative: इस्राएल को उस देश से नष्ट कर दूँगा
  rationale: संदर्भ देश से निष्कासन और कठोर न्याय का है। ‘काट डालूँगा’ मूल मुहावरे की तीव्रता रखता है, पर अनिवार्यतः सम्पूर्ण जातीय संहार का दावा नहीं करता।
- issue: הַבַּיִת को सामान्य ‘भवन’ या स्पष्ट ‘मन्दिर’ कहना
  choice: भवन
  alternative: मन्दिर
  rationale: मूल पाठ ‘घर/भवन’ कहता है। ‘भवन’ नाम के लिए पवित्र ठहराए गए घर की मूल छवि को बनाए रखता है, जबकि पादटिप्पणी संदर्भगत अर्थ स्पष्ट करती है।
- issue: परमेश्वर के ‘नाम’ की अभिव्यक्ति को रखना या उसका अर्थ खोलकर कहना
  choice: अपने नाम के लिए
  alternative: अपना नाम धारण करने और उसका आदर करने के लिए
  rationale: ‘नाम के लिए’ राजाओं की पुस्तक की जानबूझकर प्रयुक्त धर्मवैचारिक भाषा है। मुख्य पाठ में इसे बनाए रखा गया है और इसका सांस्कृतिक आशय पादटिप्पणी में समझाया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण और सामान्य पाठकों के लिए सुबोध रूप अपनाया गया है। ‘काट डालूँगा’ तथा ‘अपने नाम के लिए’ जैसे मूल इब्रानी बिंब सुरक्षित रखे गए हैं, जबकि असहज शाब्दिकता (‘देश के मुख पर से’, ‘मेरे मुख के सामने से’) को स्वाभाविक हिन्दी में व्यक्त किया गया है।
