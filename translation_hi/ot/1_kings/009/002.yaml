  yaml_path: translation/ot/1_kings/009/002.yaml
  text: Then Yahweh appeared to Solomon a second time[a], as he had appeared to him at Gibeon.
translation:
  language: hi
  text: तब याहवे सुलैमान को दूसरी बार[a] दिखाई दिया, जैसा वह गिबोन में उसे दिखाई दिया था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “फिर”; इब्रानी में शाब्दिक अर्थ “दूसरी बार” है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּרָא
  choice: दर्शन दिया
  rationale: निफ़अल रूप यहाँ ईश्वर के प्रकट होने को व्यक्त करता है। आधुनिक हिन्दी में ‘दर्शन दिया’ इस ईश्वरीय प्रकटन के लिए स्वाभाविक और गरिमापूर्ण है तथा समानांतर क्रिया נִרְאָה के साथ संगति रखता है।
- source_word: יְהוָה
  choice: यहवे
  rationale: चतुरक्षरीय निजी नाम को किसी उपाधि से बदलने के बजाय हिन्दी में उसके प्रचलित ध्वन्यात्मक रूप ‘यहवे’ से व्यक्त किया गया है।
- source_word: שֵׁנִית
  choice: दूसरी बार
  rationale: यह क्रियाविशेषण क्रम को स्पष्ट रूप से चिह्नित करता है; ‘दूसरी बार’ मूल के शाब्दिक बल को बनाए रखता है।
- source_word: כַּאֲשֶׁר
  choice: जैसे
  rationale: यह गिबोन में हुए पहले प्रकटन के साथ तुलना प्रस्तुत करता है; ‘जैसे’ इसका संक्षिप्त और स्वाभाविक हिन्दी रूप है।
- source_word: נִרְאָה
  choice: दर्शन दिया था
  rationale: यह भी ראה का निफ़अल रूप है और पहले हुई घटना की ओर संकेत करता है; ‘था’ मुख्य घटना की तुलना में उसकी पूर्वता स्पष्ट करता है।
- source_word: אֵלָיו
  choice: उसे
  rationale: אֶל और सर्वनाम-प्रत्यय का संबंधपरक-दिशात्मक अर्थ यहाँ हिन्दी में ‘उसे दर्शन दिया’ द्वारा स्वाभाविक रूप से व्यक्त होता है, बिना प्रकटन की रीति को अतिरिक्त रूप से निर्धारित किए।
- source_word: בְּגִבְעוֹן
  choice: गिबोन में
  rationale: स्थानवाचक בְּ का सीधा और स्वाभाविक हिन्दी रूप ‘में’ है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहवे
  alternative: यहोवा; प्रभु
  rationale: पाठ में निजी वाचा-नाम सीधे प्रयुक्त है। ‘यहवे’ उस नाम को उपाधि से प्रतिस्थापित किए बिना प्रस्तुत करता है; ‘प्रभु’ मूल के नाम और उपाधि के भेद को मिटा देता।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘दर्शन दिया’ हिन्दी बाइबलीय शैली में परिचित है, फिर भी सामान्य पाठक के लिए स्पष्ट है। वाक्य की तुलनात्मक संरचना और दूसरे प्रकटन पर मूल का बल सुरक्षित रखा गया है।
