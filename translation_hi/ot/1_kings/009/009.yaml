reference: 1 Kings 9:9
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/אָמְר֗וּ עַל֩ אֲשֶׁ֨ר עָזְב֜וּ אֶת יְהוָ֣ה אֱלֹהֵי/הֶ֗ם אֲשֶׁ֨ר הוֹצִ֣יא אֶת אֲבֹתָ/ם֮ מֵ/אֶ֣רֶץ מִצְרַיִם֒ וַֽ/יַּחֲזִ֨קוּ֙ בֵּ/אלֹהִ֣ים אֲחֵרִ֔ים ו/ישתחו לָ/הֶ֖ם וַ/יַּעַבְדֻ֑/ם עַל כֵּ֗ן הֵבִ֤יא יְהוָה֙ עֲלֵי/הֶ֔ם אֵ֥ת כָּל הָ/רָעָ֖ה הַ/זֹּֽאת־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/009/009.yaml
  text: And they will say[a], ‘Because they abandoned Yahweh their God, who brought their fathers out of the land of Egypt, and they held fast to other gods and bowed down to them and served them[c][b], therefore Yahweh brought all this disaster on them.’
translation:
  language: hi
  text: और वे कहेंगे, “क्योंकि उन्होंने अपने परमेश्वर यहोवा को छोड़ दिया, जो उनके पुरखाओं को मिस्र देश से बाहर निकाल लाया था, और वे दूसरे देवताओं से लिपट गए, उनके आगे झुके और उनकी सेवा की; इसलिए यहोवा उन पर यह सारी विपत्ति ले आया।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאָמְרוּ
  choice: और वे कहेंगे
  rationale: संदर्भ में यह उन लोगों के भावी उत्तर को व्यक्त करता है जो उजाड़ को देखकर उसका कारण बताएँगे।
- source_word: עַל אֲשֶׁר
  choice: क्योंकि
  rationale: यह पदबंध न्याय का कारण प्रस्तुत करता है; आधुनिक हिन्दी में ‘क्योंकि’ स्वाभाविक और स्पष्ट है।
- source_word: עָזְבוּ
  choice: छोड़ दिया
  rationale: यह निष्ठा त्यागने का भाव रखता है और आधुनिक हिन्दी में सहज है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को हिन्दी बाइबल-परंपरा में परिचित लिप्यंतरण द्वारा सुरक्षित रखा गया है।
- source_word: אֱלֹהֵיהֶם
  choice: अपने परमेश्वर
  rationale: संदर्भ में बहुवचन रूप इस्राएल के एकमात्र परमेश्वर के लिए प्रयुक्त है; ‘अपने’ हिन्दी में कर्ता के साथ संबंध स्पष्ट करता है।
- source_word: אֲבֹתָם
  choice: उनके पुरखाओं
  rationale: यह पितृपूर्वजों को सूचित करता है; ‘पुरखे’ आधुनिक हिन्दी में स्वाभाविक है और पूर्वजगत अर्थ को बनाए रखता है।
- source_word: הוֹצִיא ... מֵאֶרֶץ מִצְרַיִם
  choice: मिस्र देश से बाहर निकाल लाया था
  rationale: निर्गमन-सूत्र और causative क्रिया का भाव स्पष्ट तथा स्वाभाविक हिन्दी में रखा गया है।
- source_word: וַיַּחֲזִקוּ בֵּאלֹהִים אֲחֵרִים
  choice: वे दूसरे देवताओं से लिपट गए
  rationale: חזק ב deliberate attachment और दृढ़ आसक्ति व्यक्त करता है; ‘लिपट गए’ मूर्तिपूजक निष्ठा के इस भाव को सजीव रूप में संप्रेषित करता है।
- source_word: וישתחו לָהֶם
  choice: उनके आगे झुके
  rationale: मूल क्रिया के शारीरिक दंडवत/झुकने के भाव को सामान्य हिन्दी में सुरक्षित रखा गया है।
- source_word: וַיַּעַבְדֻם
  choice: उनकी सेवा की
  rationale: עבד के धार्मिक सेवा के अर्थ को रखा गया है और पिछली क्रिया से उसका lexical भेद बना रहता है।
- source_word: עַל כֵּן
  choice: इसलिए
  rationale: कारण और परिणाम के संबंध को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: הֵבִיא ... אֵת כָּל הָרָעָה הַזֹּאת
  choice: उन पर यह सारी विपत्ति ले आया
  rationale: רָעָה यहाँ नैतिक बुराई नहीं, दंडस्वरूप आई विपत्ति है; ‘विपत्ति’ इस संदर्भ में सटीक है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल के व्यक्तिगत वाचा-नाम को किसी उपाधि से बदलने के बजाय हिन्दी पाठकों में स्थापित लिप्यंतरण ‘यहोवा’ से प्रस्तुत किया गया है।
- issue: אֲבֹתָם का पूर्वजगत अर्थ
  choice: उनके पुरखाओं
  alternative: उनके पितरों
  rationale: मूल का पुरुषवाची पैतृक संदर्भ बनाए रखते हुए ‘पुरखे’ आज की सामान्य हिन्दी में अधिक स्पष्ट और कम संस्कारगत अर्थ वाला है।
- issue: הָרָעָה का न्याय-संदर्भ
  choice: विपत्ति
  alternative: बुराई
  rationale: यहाँ शब्द उस नैतिक बुराई को नहीं, जिसे परमेश्वर करता है, बल्कि न्यायस्वरूप आई आपदा को बताता है; इसलिए ‘विपत्ति’ संदर्भगत अर्थ को सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य हिन्दी पाठक के लिए सुबोध रखी गई है। वाक्य में मूल की कारणात्मक संरचना और दूसरे देवताओं से जुड़ने, झुकने तथा सेवा करने की त्रिक प्रगति सुरक्षित है।
