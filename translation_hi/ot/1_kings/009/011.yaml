  text: חִירָ֣ם מֶֽלֶךְ צֹ֠ר נִשָּׂ֨א אֶת שְׁלֹמֹ֜ה בַּ/עֲצֵי֩ אֲרָזִ֨ים וּ/בַ/עֲצֵ֧י בְרוֹשִׁ֛ים וּ/בַ/זָּהָ֖ב לְ/כָל חֶפְצ֑/וֹ אָ֡ז יִתֵּן֩ הַ/מֶּ֨לֶךְ שְׁלֹמֹ֤ה לְ/חִירָם֙ עֶשְׂרִ֣ים עִ֔יר בְּ/אֶ֖רֶץ הַ/גָּלִֽיל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/009/011.yaml
  text: Hiram king of Tyre had supplied Solomon with cedar timber[a], cypress timber, and gold, according to all his desire; then King Solomon gave Hiram twenty cities in the land of Galilee.
translation:
  language: hi
  text: सोर के राजा हीराम ने सुलैमान को सुलैमान की सारी इच्छा के अनुसार देवदार की लकड़ी, सरो[a] की लकड़ी और सोना उपलब्ध कराया था; तब राजा सुलैमान ने हीराम को गलील देश में बीस नगर दिए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “सनोबर,” “फर,” अथवा कोई अन्य शंकुधारी वृक्ष; इब्रानी शब्द बेरोश से सूचित ठीक प्रजाति अनिश्चित है।
    reason: lexical_alternative
lexical_decisions:
- source_word: נִשָּׂא
  choice: उपलब्ध कराया था
  rationale: मूल क्रिया का सामान्य अर्थ ‘उठाना/ढोना’ है, पर इस रचना में सामग्री के साथ इसका प्रसंगगत अर्थ सुलैमान को आवश्यक वस्तुएँ मुहैया कराना है। पूर्वकालिक ‘कराया था’ मुख्य घटना की पृष्ठभूमि स्पष्ट करता है।
- source_word: בַּעֲצֵי אֲרָזִים
  choice: देवदार की लकड़ी
  rationale: निर्माण-सामग्री के प्रसंग में עֵץ वृक्षों के बजाय उनकी लकड़ी को दर्शाता है; אֶרֶז के लिए ‘देवदार’ प्रचलित और स्वाभाविक हिन्दी शब्द है।
- source_word: וּבַעֲצֵי בְרוֹשִׁים
  choice: सरो की लकड़ी
  rationale: בְּרוֹשׁ किसी शंकुधारी वृक्ष को सूचित करता है, पर उसकी ठीक प्रजाति अनिश्चित है। मुख्य पाठ में प्रचलित सम्भावित अर्थ ‘सरो’ रखा गया और अनिश्चितता पादटिप्पणी में बताई गई है।
- source_word: וּבַזָּהָב
  choice: और सोना
  rationale: सामग्री-सूचक शब्द का सीधा और स्वाभाविक अनुवाद।
- source_word: לְכָל חֶפְצוֹ
  choice: उसकी सारी इच्छा के अनुसार
  rationale: חֵפֶץ इच्छा, अभिलाषा या प्रसन्नता का भाव रखता है। यह अनुवाद सुलैमान द्वारा चाही गई सामग्री की पूरी मात्रा/सीमा को बिना अतिरिक्त व्याख्या के बनाए रखता है।
- source_word: אָז יִתֵּן
  choice: तब ... दिए
  rationale: אָז क्रमसूचक ‘तब’ है और उसके बाद आया अपूर्ण क्रियारूप यहाँ अतीत की कथात्मक घटना व्यक्त करता है।
- source_word: עֶשְׂרִים עִיר
  choice: बीस नगर
  rationale: עִיר के लिए ‘नगर’ आधुनिक मानक हिन्दी में स्वाभाविक है और राजनीतिक-भौगोलिक प्रसंग के अनुकूल है।
- source_word: בְּאֶרֶץ הַגָּלִיל
  choice: गलील देश में
  rationale: אֶרֶץ का ‘देश/प्रदेश’ अर्थ हो सकता है; ‘गलील देश’ हिब्रू पदबंध की भौगोलिक व्यापकता बनाए रखता है।
- source_word: חִירָם ... שְׁלֹמֹה ... צֹר ... הַגָּלִיל
  choice: हीराम ... सुलैमान ... सोर ... गलील
  rationale: व्यक्तियों और स्थानों के लिए हिन्दी बाइबलीय परंपरा में परिचित, स्पष्ट देवनागरी रूप अपनाए गए हैं।
