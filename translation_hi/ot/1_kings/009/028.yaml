- source_word: וַיִּקְחוּ מִשָּׁם
  choice: वहाँ से ... लेकर
  rationale: 'לקח और स्पष्ट מן उपसर्ग दोनों को स्वाभाविक हिन्दी में सुरक्षित रखता है: सोना उसी स्थान से लिया गया।'
- source_word: זָהָב
  choice: सोना
  rationale: संज्ञा का सामान्य और प्रसंगानुकूल हिन्दी रूप।
- source_word: אַרְבַּע מֵאוֹת וְעֶשְׂרִים כִּכָּר
  choice: चार सौ बीस किक्कार
  rationale: मूल संख्या ठीक रखी गई है और प्राचीन भार-माप כִּכָּר को अनुमानित आधुनिक भार में बदले बिना पारंपरिक हिन्दी बाइबलीय रूप ‘किक्कार’ से व्यक्त किया गया है।
- source_word: וַיָּבִאוּ
  choice: लेकर ... आए
  rationale: हिफ़ील रूप का अर्थ ‘लाना’ है; हिन्दी वाक्य में ‘सोना लेकर राजा सुलैमान के पास आए’ सहज रूप से वस्तु के हस्तांतरण को व्यक्त करता है।
- source_word: אֶל הַמֶּלֶךְ שְׁלֹמֹה
  choice: राजा सुलैमान के पास
  rationale: אֶל की दिशा और राजकीय उपाधि को स्वाभाविक आधुनिक हिन्दी में सुरक्षित रखा गया है।
