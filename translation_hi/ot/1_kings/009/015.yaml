  text: וְ/זֶ֨ה דְבַר הַ/מַּ֜ס אֲשֶֽׁר הֶעֱלָ֣ה הַ/מֶּ֣לֶךְ שְׁלֹמֹ֗ה לִ/בְנוֹת֩ אֶת בֵּ֨ית יְהוָ֤ה וְ/אֶת בֵּית/וֹ֙ וְ/אֶת הַ/מִּלּ֔וֹא וְ/אֵ֖ת חוֹמַ֣ת יְרוּשָׁלִָ֑ם וְ/אֶת חָצֹ֥ר וְ/אֶת מְגִדּ֖וֹ וְ/אֶת גָּֽזֶר־־׀־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/009/015.yaml
  text: This is the account of the forced labor that King Solomon levied to build the house of Yahweh[a], his own house, the Millo, the wall of Jerusalem, Hazor, Megiddo[b], and Gezer.
translation:
  language: hi
  text: राजा सुलैमान ने यहोवा का भवन, अपना भवन, मिल्लो[b], यरूशलेम की शहरपनाह, हासोर, मगिद्दो और गेजेर बनाने के लिए जो बेगार[a] लगाई थी, उसका विवरण यह है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात धन का कर नहीं, बल्कि राज्य द्वारा अनिवार्य किया गया श्रम। इसे ‘श्रम-कर’ भी कहा जा सकता है।
    reason: lexical_alternative
  - marker: b
    text: ‘मिल्लो’ सम्भवतः यरूशलेम की कोई जानी-पहचानी किलेबंदी या भराव/टेरेस-जैसी संरचना था; इब्रानी शब्द का सम्बन्ध ‘भराव’ से हो सकता है।
    reason: cultural_note
lexical_decisions:
- source_word: דְבַר
  choice: विवरण
  rationale: यहाँ यह शब्द कर/श्रम-व्यवस्था के विषय में दी गई व्याख्यात्मक सूचना का परिचय देता है; ‘विवरण’ आधुनिक हिन्दी में स्वाभाविक है।
- source_word: הַמַּס
  choice: बेगार
  rationale: सन्दर्भ में यह धन के कर को नहीं, बल्कि राजकीय निर्माण के लिए अनिवार्य श्रम को दर्शाता है। ‘बेगार’ संक्षिप्त और अर्थ-सटीक है; फुटनोट में इसे स्पष्ट किया गया है।
- source_word: הֶעֱלָה
  choice: लगाई
  rationale: עלה के हिफ़ील रूप का यहाँ अर्थ श्रम-लेवी लगाना या वसूल करना है; ‘बेगार लगाई’ हिन्दी का स्वाभाविक प्रशासनिक प्रयोग है।
- source_word: לִבְנוֹת
  choice: बनाने के लिए
  rationale: इनफिनिटिव उद्देश्य व्यक्त करता है।
- source_word: בֵּית יְהוָה
  choice: यहोवा का भवन
  rationale: ‘भवन’ स्रोत के ‘घर’ रूपक को बनाए रखता है, जबकि ‘यहोवा’ चार-अक्षरीय ईश्वरीय नाम को नाम के रूप में प्रस्तुत करता है।
- source_word: בֵּיתוֹ
  choice: अपना भवन
  rationale: मूल में केवल ‘उसका घर/भवन’ है। ‘अपना भवन’ यहोवा के भवन से उसका विरोध स्पष्ट करता है, पर इसे सीधे ‘राजमहल’ कहकर व्याख्या को मूल पाठ में नहीं जोड़ता।
- source_word: הַמִּלּוֹא
  choice: मिल्लो
  rationale: यह यरूशलेम की किसी विशिष्ट संरचना या भू-निर्माण का नाम है। सटीक पहचान अनिश्चित होने के कारण लिप्यंतरण रखा गया और सम्भावित अर्थ फुटनोट में दिया गया।
- source_word: חוֹמַת יְרוּשָׁלִָם
  choice: यरूशलेम की शहरपनाह
  rationale: यह नगर की रक्षात्मक दीवार को स्वाभाविक और परिचित हिन्दी में व्यक्त करता है।
- source_word: חָצֹר
  choice: हासोर
  rationale: स्थान-नाम का प्रचलित हिन्दी लिप्यंतरण।
- source_word: מְגִדּוֹ
  choice: मगिद्दो
  rationale: स्थान-नाम का प्रचलित हिन्दी लिप्यंतरण।
- source_word: גָּזֶר
  choice: गेजेर
  rationale: स्थान-नाम का सुबोध हिन्दी लिप्यंतरण।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: मूल में चार-अक्षरीय ईश्वरीय नाम सीधे आया है। हिन्दी पाठकों के लिए परिचित नाम-रूप ‘यहोवा’ इसे उपाधि में बदले बिना सुरक्षित रखता है।
- issue: सुलैमान के בֵּיתוֹ की पहचान
  choice: अपना भवन
  alternative: अपना राजमहल
  rationale: सन्दर्भ में राजमहल अभिप्रेत हो सकता है, पर मूल केवल ‘उसका भवन’ कहता है। मुख्य पाठ वास्तविक शब्दगत व्यापकता बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। वाक्य-विन्यास हिन्दी की स्वाभाविक सूचना-रचना के अनुसार है। ‘बेगार’ और ‘शहरपनाह’ अर्थ-सटीक तथा परिचित शब्द हैं; तकनीकी अनिश्चितता ‘मिल्लो’ के लिप्यंतरण और फुटनोट में सुरक्षित है।
