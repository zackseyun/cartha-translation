reference: 1 Kings 9:5
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/הֲקִ֨מֹתִ֜י אֶת כִּסֵּ֧א מַֽמְלַכְתְּ/ךָ֛ עַל יִשְׂרָאֵ֖ל לְ/עֹלָ֑ם כַּ/אֲשֶׁ֣ר דִּבַּ֗רְתִּי עַל דָּוִ֤ד אָבִ֨י/ךָ֙ לֵ/אמֹ֔ר לֹֽא יִכָּרֵ֤ת לְ/ךָ֙ אִ֔ישׁ מֵ/עַ֖ל כִּסֵּ֥א יִשְׂרָאֵֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/009/005.yaml
  text: then I will establish the throne of your kingdom over Israel forever, just as I spoke concerning David your father, saying, ‘A man of yours will not be cut off from the throne of Israel.’
translation:
  language: hi
  text: तब मैं इस्राएल पर तुम्हारे राज्य का सिंहासन सदा के लिए स्थिर करूँगा, ठीक जैसे मैंने तुम्हारे पिता दाऊद के विषय में कहा था, ‘तुम्हारे वंश का कोई पुरुष इस्राएल के सिंहासन से कभी हटाया नहीं जाएगा।’
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַהֲקִמֹתִי
  choice: तब मैं ... स्थापित करूँगा
  rationale: हिफ़ील रूप का अर्थ ‘स्थिर/स्थापित करना’ है; आरंभिक ו को प्रसंगानुसार परिणामसूचक ‘तब’ से व्यक्त किया गया है।
- source_word: כִּסֵּא מַמְלַכְתְּךָ
  choice: तुम्हारे राज्य की राजगद्दी
  rationale: ‘सिंहासन’ संभव है, पर ‘राजगद्दी’ सामान्य आधुनिक हिन्दी में राजकीय शासन और वंशगत अधिकार दोनों को स्वाभाविक ढंग से व्यक्त करती है।
- source_word: לְעוֹלָם
  choice: सदा के लिए
  rationale: दीर्घकालिक अथवा स्थायी अवधि का स्वाभाविक हिन्दी रूप; वाचा के कथन की व्यापकता को सीमित नहीं किया गया।
- source_word: לֹא יִכָּרֵת לְךָ אִישׁ
  choice: तुम्हारे वंश में पुरुष का अभाव कभी न होगा
  rationale: शाब्दिक रूप ‘तुम्हारे लिए कोई पुरुष काट न दिया जाएगा’ हिन्दी में भ्रामक है। यह सूत्र दाऊद के वंश में राजगद्दी के लिए पुरुष उत्तराधिकारी का न मिटना/अभाव न होना व्यक्त करता है।
- source_word: מֵעַל כִּסֵּא יִשְׂרָאֵל
  choice: इस्राएल की राजगद्दी पर बैठने के लिए
  rationale: מֵעַל का शाब्दिक ‘के ऊपर से’ है, पर पूरे राजवंशीय सूत्र का आशय गद्दी पर उत्तराधिकारी बने रहने से है; हिन्दी में इसे मुहावरेदार ढंग से स्पष्ट किया गया है।
theological_decisions:
- issue: दाऊद को दी गई स्थायी राजवंशीय प्रतिज्ञा
  choice: ‘सदा के लिए’ और उत्तराधिकारी के अभाव न होने—दोनों कथनों को यथावत रखा गया
  alternative: ऐतिहासिक शर्तों अथवा किसी विशिष्ट मसीही पूर्णता को पद के भीतर स्पष्ट करना
  rationale: इस पद का कथन प्रतिज्ञा को सुलैमान की आज्ञाकारिता से जोड़ने वाले प्रसंग में आता है, पर स्वयं पद में बताए बिना किसी सिद्धान्तगत समाधान को जोड़ना उचित नहीं।
translation_notes:
  register: आधुनिक मानक हिन्दी; गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। ‘राजगद्दी’ को ‘सिंहासन’ की अपेक्षा अधिक स्वाभाविक माना गया और राजवंशीय सूत्र को अर्थ-सटीक हिन्दी मुहावरे में प्रस्तुत किया गया।
