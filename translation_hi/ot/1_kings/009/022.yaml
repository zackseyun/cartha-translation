source:
  edition: WLC
  text: וּ/מִ/בְּנֵי֙ יִשְׂרָאֵ֔ל לֹֽא נָתַ֥ן שְׁלֹמֹ֖ה עָ֑בֶד כִּי הֵ֞ם אַנְשֵׁ֣י הַ/מִּלְחָמָ֗ה וַ/עֲבָדָי/ו֙ וְ/שָׂרָ֣י/ו וְ/שָׁלִשָׁ֔י/ו וְ/שָׂרֵ֥י רִכְבּ֖/וֹ וּ/פָרָשָֽׁי/ו־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/009/022.yaml
  text: But from the sons of Israel Solomon made no servants[a], for they were the men of war, his servants, his commanders, his officers, and the commanders of his chariots and his horsemen.
translation:
  language: hi
  text: परन्तु इस्राएलियों में से किसी को भी सुलैमान ने दास नहीं बनाया, क्योंकि वे योद्धा थे—उसके सेवक, सेनापति, अधिकारी[a], रथों के प्रधान और घुड़सवार।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उसके सहायक सेनाधिकारी”; इब्रानी शब्द सम्भवतः उच्च पद के सैन्य सहायकों या रथ-अधिकारियों के एक विशेष वर्ग का नाम था।
    reason: שָׁלִישׁ के सटीक ऐतिहासिक पद का अर्थ अनिश्चित है; मुख्य पाठ में सामान्य अर्थ और पाद-टिप्पणी में अधिक विशिष्ट सम्भावना सुरक्षित रखी गई है।
lexical_decisions:
- source_word: וּמִבְּנֵי יִשְׂרָאֵל
  choice: परन्तु इस्राएलियों में से किसी को भी
  rationale: पूर्ववर्ती पद में गैर-इस्राएली बेगार-दासों के उल्लेख के साथ विरोध स्पष्ट करने के लिए וּ को ‘परन्तु’ से व्यक्त किया गया है। हिन्दी में ‘इस्राएलियों में से किसी को भी’ स्वाभाविक रूप से उस समुदाय के भीतर किसी व्यक्ति को न चुनने का भाव देता है।
- source_word: לֹא נָתַן שְׁלֹמֹה עָבֶד
  choice: सुलैमान ने दास नहीं बनाया
  rationale: ‘किसी को दास के रूप में देना/ठहराना’ वाले इब्रानी प्रयोग और आस-पास के बंधुआ श्रम-संदर्भ को स्पष्ट रखता है; ‘सेवक नहीं बनाया’ सामाजिक स्थिति की कठोरता को अनावश्यक रूप से नरम कर देता।
- source_word: אַנְשֵׁי הַמִּלְחָמָה
  choice: योद्धा
  rationale: शाब्दिक अर्थ ‘युद्ध के पुरुष’ है। ‘योद्धा’ आधुनिक हिन्दी में संक्षिप्त, स्वाभाविक और इस सैन्य पदनाम के आशय के अनुरूप है।
- source_word: וַעֲבָדָיו
  choice: उसके सेवक
  rationale: राजकीय संदर्भ में עבד राजा की सेवा में नियुक्त व्यक्ति या अधिकारी को सूचित कर सकता है। ‘सेवक’ मूल शब्द की व्यापकता बनाए रखता है, जबकि आगे के पद विशिष्ट भूमिकाएँ बताते हैं।
- source_word: וְשָׂרָיו
  choice: सेनापति
  rationale: שׂר का अर्थ प्रधान या अधिकारी हो सकता है; इस सैन्य सूची में ‘सेनापति’ उपयुक्त और सहज है।
- source_word: וְשָׁלִשָׁיו
  choice: अधिकारी
  rationale: שָׁלִישׁ का सटीक ऐतिहासिक पद अनिश्चित है, पर यह सम्भवतः उच्च श्रेणी के सैन्य सहायक या रथ-अधिकारी को दर्शाता है। मुख्य पाठ में व्यापक ‘अधिकारी’ रखा गया और अधिक विशिष्ट सम्भावना पाद-टिप्पणी में दी गई है।
- source_word: וְשָׂרֵי רִכְבּוֹ
  choice: रथों के प्रधान
  rationale: यह सुलैमान के रथ-दल पर नियुक्त प्रमुखों को दर्शाता है। ‘रथों के प्रधान’ स्रोत की रचना के निकट और साधारण पाठक के लिए स्पष्ट है।
- source_word: וּפָרָשָׁיו
  choice: घुड़सवार
  rationale: यह घोड़ों पर लड़ने या सेवा करने वाले सैनिकों का सीधा और स्वाभाविक हिन्दी पद है।
theological_decisions:
- issue: עָבֶד द्वारा सूचित सामाजिक स्थिति
  choice: दास नहीं बनाया
  alternative: सेवक नहीं बनाया / बेगार का मजदूर नहीं बनाया
  rationale: पूर्ववर्ती संदर्भ गैर-इस्राएलियों से कराए गए बंधुआ श्रम का है। ‘दास’ इस कठोर सामाजिक स्थिति को बनाए रखता है, जबकि ‘सेवक’ उसे नरम कर सकता है और ‘बेगार का मजदूर’ संज्ञा से अधिक व्याख्यात्मक है।
- issue: עָבֶד की इसी पद में भिन्न संदर्भगत छायाएँ
  choice: पहले ‘दास’, फिर राजकीय सूची में ‘सेवक’
  alternative: दोनों स्थानों पर ‘दास’
  rationale: एक ही इब्रानी मूल का अर्थ संदर्भ के अनुसार दास-स्थिति या राजा की सेवा में नियुक्त व्यक्ति हो सकता है। दोनों को ‘दास’ कहना राजकीय पदों की सूची में अनावश्यक रूप से बंधुआ स्थिति आरोपित करेगा; अलग हिन्दी शब्द संदर्भगत अर्थभेद को दर्शाते हैं।
- issue: אַנְשֵׁי הַמִּלְחָמָה का लिंग-सूचक रूप
  choice: योद्धा
  alternative: युद्ध के पुरुष
  rationale: स्रोत का पद पुरुष सैन्यकर्मियों के लिए है, पर हिन्दी में ‘योद्धा’ स्वयं इस ऐतिहासिक सैन्य वर्ग को स्वाभाविक ढंग से व्यक्त करता है; ‘युद्ध के पुरुष’ असहज और अनुवाद-जैसा लगेगा।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण पर सहज। सैन्य पदों को अत्यधिक तकनीकी या पुरातन शब्दावली से बचाते हुए स्पष्ट किया गया है। सूची की व्याख्यात्मक संरचना दिखाने के लिए दीर्घ विराम-चिह्न का प्रयोग किया गया है।
