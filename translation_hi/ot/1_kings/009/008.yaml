source:
  edition: WLC
  text: וְ/הַ/בַּ֤יִת הַ/זֶּה֙ יִהְיֶ֣ה עֶלְי֔וֹן כָּל עֹבֵ֥ר עָלָ֖י/ו יִשֹּׁ֣ם וְ/שָׁרָ֑ק וְ/אָמְר֗וּ עַל מֶ֨ה עָשָׂ֤ה יְהוָה֙ כָּ֔כָה לָ/אָ֥רֶץ הַ/זֹּ֖את וְ/לַ/בַּ֥יִת הַ/זֶּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/009/008.yaml
  text: And this house will become a ruin[a]. Everyone who passes by it will be appalled and will whistle, and they will say[b], ‘Why has Yahweh done thus to this land and to this house?’
translation:
  language: hi
  text: और यह भवन खंडहर हो जाएगा[a]। हर राहगीर भय से स्तब्ध रह जाएगा और सीटी बजाएगा[b]। वे कहेंगे, “याहवे ने इस देश और इस भवन के साथ ऐसा क्यों किया?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से, “यह भवन ऊँचा/महान होगा।” इस प्रसंग में बहुत-से लोग इसका आशय यह समझते हैं कि यह खंडहर या भयावह दृश्य बन जाएगा; 2 इतिहास 7:21 से तुलना करें।
    reason: textual_variant
  - marker: b
    text: या “फुफकारेगा।” इब्रानी क्रिया विस्मय या उपहास में तीखी ध्वनि निकालने को दर्शाती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַבַּיִת הַזֶּה
  choice: और यह भवन
  rationale: בַּיִת का मूल अर्थ ‘घर’ है, पर यहाँ सन्दर्भ मन्दिर का है। ‘भवन’ इब्रानी रूपक को बनाए रखते हुए आधुनिक हिन्दी में गरिमापूर्ण और स्पष्ट है।
- source_word: יִהְיֶה עֶלְיוֹן
  choice: खंडहर हो जाएगा
  rationale: मसोरेटिक पाठ का शाब्दिक अर्थ ‘ऊँचा/महान होगा’ है, जो दण्ड और उजाड़ के प्रसंग में कठिन है। 2 इतिहास 7:21 के समानांतर पाठ और प्रसंग के आधार पर विनाश का आशय मुख्य पाठ में दिया गया है; पाठगत तनाव पाद-टिप्पणी में सुरक्षित है।
- source_word: כָּל עֹבֵר עָלָיו
  choice: जो कोई इसके पास से गुज़रेगा
  rationale: यह राहगीरों के लिए प्रयुक्त इब्रानी मुहावरा है। ‘जो कोई’ כָּל की प्रत्येक व्यक्ति पर लागू होने वाली व्यापकता व्यक्त करता है।
- source_word: יִשֹּׁם
  choice: स्तब्ध रह जाएगा
  rationale: क्रिया विनाश देखकर उत्पन्न भयमिश्रित विस्मय और आघात व्यक्त करती है। ‘स्तब्ध रह जाएगा’ आधुनिक हिन्दी में इस भाव को स्वाभाविक ढंग से प्रकट करता है।
- source_word: וְשָׁרָק
  choice: और सीटी बजाएगा
  rationale: क्रिया विस्मय या उपहास में निकाली गई तीखी ध्वनि को दर्शाती है। सीधा अर्थ मुख्य पाठ में और वैकल्पिक भाव पाद-टिप्पणी में दिया गया है।
- source_word: וְאָמְרוּ
  choice: वे कहेंगे
  rationale: बहुवचन क्रिया का सीधा और स्वाभाविक हिन्दी रूप है; इसका संकेत वहाँ से गुज़रने वाले लोगों की ओर है।
- source_word: עַל מֶה
  choice: क्यों
  rationale: यह वाक्यांश किए गए न्याय का कारण पूछता है; आधुनिक हिन्दी में ‘क्यों’ इसका सर्वाधिक स्वाभाविक रूप है।
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत वाचा-नाम को किसी उपाधि से बदलने के बजाय देवनागरी लिप्यन्तरण में प्रस्तुत किया गया है।
- source_word: כָּכָה
  choice: ऐसा
  rationale: यह न्याय के दिखाई देने वाले ढंग या परिणाम की ओर संकेत करता है; ‘ऐसा’ स्वाभाविक हिन्दी समतुल्य है।
- source_word: לָאָרֶץ הַזֹּאת וְלַבַּיִת הַזֶּה
  choice: इस देश और इस भवन के साथ
  rationale: אֶרֶץ यहाँ इस्राएल के देश को सूचित करता है। दोनों संज्ञाओं के साथ संकेतवाचक विशेषण की पुनरावृत्ति हिन्दी में स्पष्ट रूप से रखी गई है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा अथवा ‘प्रभु’
  rationale: मूल पाठ व्यक्तिगत वाचा-नाम का प्रयोग करता है। ‘याहवे’ उसका प्रचलित विद्वत्तापूर्ण लिप्यन्तरण है और नाम को उपाधि में नहीं बदलता।
- issue: न्याय के प्रसंग में עֶלְיוֹן का अर्थ
  choice: मुख्य पाठ में ‘खंडहर हो जाएगा’, साथ में शाब्दिक पाठ की पाद-टिप्पणी
  alternative: ‘ऊँचा/महान होगा’
  rationale: मसोरेटिक रूप का शाब्दिक अर्थ प्रसंग में कठिन है, जबकि समानांतर पाठ और विनाश का निकट प्रसंग उजाड़ की ओर संकेत करते हैं। अनिश्चितता को छिपाने के बजाय पाद-टिप्पणी में स्पष्ट किया गया है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की है—सरल, गरिमापूर्ण और सार्वजनिक पाठ के अनुकूल। ‘मन्दिर’ के बजाय ‘भवन’ चुना गया है ताकि בַּיִת की साहित्यिक पुनरावृत्ति बनी रहे। सभी पाद-टिप्पणी चिह्न मुख्य पाठ में संबद्ध पदों के तुरन्त बाद दिए गए हैं।
