  text: So Hiram went out from Tyre to see the cities that Solomon had given him[a], but they were not pleasing in his eyes.
translation:
  language: hi
  text: तब हीराम सोर से उन नगरों को देखने निकला, जिन्हें सुलैमान ने उसे दिए थे; पर वे उसे अच्छे नहीं लगे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: निकला
  rationale: कथा-क्रम में יצא का अर्थ किसी स्थान से बाहर जाना या प्रस्थान करना है। ‘सोर से ... निकला’ दिशा और प्रस्थान-बिंदु दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: מִצֹּר
  choice: सोर से
  rationale: מן स्रोत या प्रस्थान-बिंदु बताता है; यहाँ वह नगर सोर है।
- source_word: לִרְאוֹת
  choice: देखने
  rationale: ראה का मूल अर्थ ‘देखना’ है। प्रसंग में निरीक्षण का भाव संभव है, फिर भी ‘देखने’ मूल पाठ की व्यापकता बनाए रखता है।
- source_word: הֶעָרִים
  choice: उन नगरों को
  rationale: עיר के लिए ‘नगर’ आधुनिक मानक हिन्दी में स्वाभाविक और गरिमापूर्ण है; संकेतवाचक ‘उन’ आगे आने वाले संबंधवाचक उपवाक्य से सहज मेल खाता है।
- source_word: אֲשֶׁר נָתַן לוֹ שְׁלֹמֹה
  choice: जिन्हें सुलैमान ने उसे दिया था
  rationale: संबंधवाचक उपवाक्य नगरों की पहचान करता है। ‘दिया था’ यह स्पष्ट करता है कि देना हीराम के देखने निकलने से पहले हुआ था।
- source_word: וְלֹא יָשְׁרוּ בְּעֵינָיו
  choice: पर वे उसे अच्छे नहीं लगे
  rationale: ישר בעיני यहाँ किसी की दृष्टि या निर्णय में स्वीकार्य अथवा पसंद आने का मुहावरा है। ‘उसे अच्छे नहीं लगे’ आधुनिक हिन्दी में इसका स्वाभाविक अर्थ देता है और अनावश्यक नैतिक अर्थ आरोपित नहीं करता।
