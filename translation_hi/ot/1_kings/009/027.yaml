  text: हीराम ने अपने उन सेवकों को, जो जहाज़ी और समुद्र के जानकार थे, सुलैमान के सेवकों के साथ जहाज़ पर भेजा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בָּאֳנִי
  choice: जहाज़ पर
  rationale: पूर्वसर्ग ב और एकवचन אֳנִי को स्वाभाविक हिन्दी में ‘जहाज़ पर’ कहा गया है।
- source_word: אַנְשֵׁי אֳנִיּוֹת
  choice: जहाज़ चलाने वाले
  rationale: शाब्दिक अर्थ ‘जहाज़ों के लोग’ है; प्रसंग में यह अनुभवी नाविकों/जहाज़ी कर्मियों को दर्शाता है। ‘जहाज़ चलाने वाले’ सामान्य पाठक के लिए स्पष्ट है।
- source_word: יֹדְעֵי הַיָּם
  choice: समुद्र के जानकार
  rationale: ‘समुद्र को जानने वाले’ का स्वाभाविक और अर्थ-संगत रूप, जो उनके समुद्री अनुभव और कौशल को व्यक्त करता है।
- source_word: עֲבָדָיו / עַבְדֵי שְׁלֹמֹה
  choice: अपने सेवकों / सुलैमान के सेवकों
  rationale: עבד के सामान्य दरबारी अर्थ को ‘सेवक’ से व्यक्त किया गया है; अनावश्यक रूप से ‘दास’ नहीं किया गया।
