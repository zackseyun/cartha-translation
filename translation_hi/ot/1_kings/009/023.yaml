  text: אֵ֣לֶּה שָׂרֵ֣י הַ/נִּצָּבִ֗ים אֲשֶׁ֤ר עַל הַ/מְּלָאכָה֙ לִ/שְׁלֹמֹ֔ה חֲמִשִּׁ֖ים וַ/חֲמֵ֣שׁ מֵא֑וֹת הָ/רֹדִ֣ים בָּ/עָ֔ם הָ/עֹשִׂ֖ים בַּ/מְּלָאכָֽה׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/009/023.yaml
  text: 'These were the chief officers of the deputies who were over the work for Solomon: five hundred and fifty[b][a], ruling over the people who were doing the work.'
translation:
  language: hi
  text: ये सुलैमान के काम की देखरेख करनेवाले नियुक्त अधिकारियों[a] के प्रधान थे—पाँच सौ पचास। वे काम करनेवाले लोगों पर अधिकार रखते थे[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “अधीक्षकों”; इब्रानी शब्द नियुक्त अधिकारियों अथवा दूसरों के ऊपर ठहराए गए लोगों को सूचित कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: या “काम करनेवाले लोगों की देखरेख करते थे”; इब्रानी क्रिया शासन करने, प्रभार रखने या अधिकार चलाने का भाव दे सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׂרֵי הַנִּצָּבִים
  choice: नियुक्त अधिकारियों के प्रधान
  rationale: 'यह इब्रानी रचना दोनों पदों को बनाए रखती है: שָׂרֵי को ‘प्रधान’ और הַנִּצָּבִים को ऐसे ‘नियुक्त अधिकारी’ माना गया है जिन्हें किसी दायित्व पर ठहराया गया था। इससे किसी एक पद को अनजाने में हटाया नहीं जाता।'
- source_word: אֲשֶׁר עַל הַמְּלָאכָה לִשְׁלֹמֹה
  choice: सुलैमान के काम पर नियुक्त
  rationale: עַל का दायित्व या प्रभार का भाव और לִשְׁלֹמֹה का सुलैमान से सेवा-संबंध सहज हिन्दी में व्यक्त होता है। ‘सुलैमान का काम’ कार्य को उसके प्रशासन से संबंधित बताता है।
- source_word: חֲמִשִּׁים וַחֲמֵשׁ מֵאוֹת
  choice: कुल पाँच सौ पचास
  rationale: संख्या का स्पष्ट आधुनिक हिन्दी रूप; ‘कुल’ अधिकारियों की गिनती को स्वाभाविक ढंग से प्रस्तुत करता है।
- source_word: הָרֹדִים
  choice: अधिकार रखते थे
  rationale: רדה में शासन करने, अधिकार चलाने या प्रभारी होने का भाव है। श्रम-प्रशासन के संदर्भ में यह विकल्प उस अधिकार को बनाए रखता है, पर अनावश्यक रूप से क्रूरता का अर्थ नहीं जोड़ता।
- source_word: בָּעָם הָעֹשִׂים בַּמְּלָאכָה
  choice: काम करनेवाले लोगों पर
  rationale: ‘लोगों’ से עָם का सामान्य अर्थ बना रहता है और ‘काम करनेवाले’ अगली सहभागी उपवाक्य-रचना को स्पष्ट तथा स्वाभाविक हिन्दी में व्यक्त करता है।
