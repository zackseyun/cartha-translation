lexical_decisions:
- source_word: וְ/אֶת
  choice: और … को
  rationale: וְ सूची की अगली वस्तु को जोड़ता है, जबकि אֵת निश्चित कर्म का चिह्न है; हिन्दी में उसका कार्य ‘को’ से व्यक्त किया गया है। क्रिया पिछले पद से समझी जाती है।
- source_word: בַּעֲלָת
  choice: बालात
  rationale: यह स्थान-नाम है, इसलिए इसका अर्थानुवाद न करके देवनागरी में लिप्यंतरण किया गया है।
- source_word: תמר
  choice: तामार
  rationale: मसोरेटिक पाठ के व्यंजनों תמר को मुख्य पाठ में तामार के रूप में रखा गया है; समानांतर पाठ का ‘तदमोर’ पादटिप्पणी में दिया गया है।
- source_word: בַּ/מִּדְבָּר
  choice: निर्जन प्रदेश में
  rationale: מִדְבָּר ऐसी उजाड़ अथवा कम आबादी वाली भूमि को सूचित करता है; ‘निर्जन प्रदेश’ आधुनिक हिन्दी में स्वाभाविक है और केवल रेतीले मरुस्थल का अनावश्यक संकेत नहीं देता।
- source_word: בָּ/אָֽרֶץ
  choice: देश के
  rationale: אֶרֶץ यहाँ व्यापक भौगोलिक क्षेत्र को सूचित करता है। ‘देश के निर्जन प्रदेश में’ हिन्दी में स्वाभाविक रूप से दोनों स्थानवाचक पदों का संबंध बनाए रखता है।
