  register: भाषा आधुनिक, गरिमापूर्ण और कथात्मक रखी गई है। सैन्य क्रियाओं को स्पष्ट और सीधे ढंग से व्यक्त किया गया है; विवाह-संबंधी तकनीकी शब्द की अनिश्चितता को मुख्य पाठ और पादटिप्पणी में सुरक्षित रखा गया है।
