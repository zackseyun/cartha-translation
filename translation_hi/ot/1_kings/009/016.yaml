base_translation:
  language: en
  yaml_path: translation/ot/1_kings/009/016.yaml
  text: Pharaoh king of Egypt had gone up and captured Gezer and burned it with fire[a], and he killed the Canaanites who lived in the city, and gave it as a dowry to his daughter, Solomon’s wife.
translation:
  language: hi
  text: मिस्र का राजा फ़िरौन चढ़ आया था। उसने गेजेर पर अधिकार करके उसे आग से जला दिया, नगर में रहने वाले कनानियों को मार डाला, और गेजेर को अपनी बेटी—सुलैमान की पत्नी—के लिए विवाह-संबंधी उपहार[a] के रूप में दे दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इस इब्रानी शब्द का अर्थ विवाह के अवसर पर दी जाने वाली भेंट है; इसे “दहेज” भी कहा जा सकता है, हालाँकि इसकी ठीक सामाजिक प्रकृति निश्चित नहीं है।
    reason: lexical_alternative
lexical_decisions:
- source_word: עָלָה
  choice: चढ़ आया था
  rationale: सैन्य चढ़ाई का इब्रानी मुहावरा बनाए रखता है; ‘था’ प्रसंग में इस घटना को सुलैमान के निर्माण-कार्य से पहले घटित पृष्ठभूमि के रूप में व्यक्त करता है।
- source_word: וַיִּלְכֹּד
  choice: अधिकार करके
  rationale: नगर को युद्ध में पकड़ लेने या जीत लेने का स्वाभाविक आधुनिक हिन्दी रूप।
- source_word: וַיִּשְׂרְפָהּ בָּאֵשׁ
  choice: उसे आग में जला दिया
  rationale: इब्रानी में स्पष्ट रूप से आए ‘आग’ को बनाए रखते हुए पूर्ण विनाश का सीधा भाव देता है।
- source_word: הַכְּנַעֲנִי הַיֹּשֵׁב בָּעִיר
  choice: नगर में रहने वाले कनानियों
  rationale: व्याकरणिक एकवचन यहाँ सामूहिक अर्थ में है; हिन्दी बहुवचन नगर की कनानी आबादी को स्वाभाविक रूप से व्यक्त करता है।
- source_word: הָרָג
  choice: मार डाला
  rationale: הרג के प्रत्यक्ष और अनलंकृत हिंसक अर्थ को आधुनिक हिन्दी में स्पष्ट रखता है।
- source_word: וַיִּתְּנָהּ
  choice: गेजेर को ... दे दिया
  rationale: स्त्रीलिंग प्रत्यय का संदर्भ नगर गेजेर है; हिन्दी में संदेह दूर करने के लिए नाम दोहराया गया है।
- source_word: שִׁלֻּחִים
  choice: विवाह के उपहार के रूप में
  rationale: यह विवाह-संबंधी भेंट को दर्शाता है, पर ‘दहेज’ जैसी अधिक निश्चित सामाजिक व्यवस्था को मूल पर आरोपित नहीं करता।
- source_word: לְבִתּוֹ אֵשֶׁת שְׁלֹמֹה
  choice: अपनी बेटी—सुलैमान की पत्नी—के लिए
  rationale: समानाधिकरण को स्पष्ट रखता है और बताता है कि फ़िरौन की बेटी ही सुलैमान की पत्नी थी।
