  text: And Solomon built Gezer and Lower Beth-horon,[a]
translation:
  language: hi
  text: और सुलैमान ने गेजेर और निचले बेत-होरोन[a] का निर्माण किया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “नीचेवाला बेत-होरोन।”
    reason: इब्रानी में स्थान-नाम के बाद विशेषण है; यह अधिक शाब्दिक शब्द-क्रम दर्शाता है।
lexical_decisions:
- source_word: וַיִּבֶן
  choice: निर्माण किया
  rationale: क़ाल वय्यिक्तोल रूप בנה का सामान्य अर्थ ‘बनाना/निर्माण करना’ है। राजकीय निर्माण के इस प्रसंग में पुनर्निर्माण या किलेबंदी निहित हो सकती है, पर मुख्य पाठ में व्यापक और सीधा अर्थ रखा गया है।
- source_word: שְׁלֹמֹה
  choice: सुलैमान
  rationale: हिन्दी बाइबलीय परंपरा में इस व्यक्ति-नाम का प्रचलित और सहज रूप।
- source_word: גָּזֶר
  choice: गेजेर
  rationale: इब्रानी स्थान-नाम का देवनागरी लिप्यंतरण, जिसमें मूल स्वर-क्रम को यथासंभव बनाए रखा गया है।
- source_word: בֵּית חֹרֹן תַּחְתּוֹן
  choice: निचले बेत-होरोन
  rationale: תַּחְתּוֹן इस स्थान को दो बेत-होरोन नगरों में निचले नगर के रूप में अलग करता है; हिन्दी में विशेषण-संज्ञा क्रम स्वाभाविक है।
- source_word: אֶת / וְאֶת
  choice: अलग से अनूदित नहीं
  rationale: ये निश्चित प्रत्यक्ष कर्म के चिह्न हैं; हिन्दी वाक्य-विन्यास में इनके लिए अलग शब्द आवश्यक नहीं है।
