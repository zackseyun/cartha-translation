base_translation:
  language: en
  yaml_path: translation/ot/1_kings/009/013.yaml
  text: And he said[a], “What are these cities that you have given me, my brother?” So he called them the land of Cabul to this day.
translation:
  language: hi
  text: उसने कहा, “ये कैसे नगर हैं जो तुमने मुझे दिए हैं, मेरे भाई?” तब उसने उन्हें “काबूल देश” कहा, और वे आज तक इसी नाम से जाने जाते हैं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מָה הֶעָרִים הָאֵלֶּה
  choice: ये कैसे नगर हैं
  rationale: यहाँ מָה केवल पहचान नहीं पूछता, बल्कि नगरों की दशा या गुणवत्ता पर असंतोष भरा प्रश्न व्यक्त करता है। ‘ये कैसे नगर हैं’ उस शिकायत को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: אֲשֶׁר נָתַתָּה לִּי
  choice: जो तुमने मुझे दिए हैं
  rationale: हिब्रू पूर्ण क्रिया पूरी हो चुकी और वर्तमान में प्रासंगिक देन को बताती है; हिन्दी पूर्ण रूप इसे सहजता से व्यक्त करता है।
- source_word: אָחִי
  choice: हे मेरे भाई
  rationale: मूल में संबंधसूचक प्रत्यय स्पष्ट है। यह राजकीय-कूटनीतिक संबोधन भी हो सकता है, पर अनुवाद शाब्दिक संबंध-भाषा को सुरक्षित रखता है।
- source_word: וַיִּקְרָא לָהֶם אֶרֶץ כָּבוּל
  choice: इसलिए उसने उस प्रदेश का नाम काबूल रखा
  rationale: קרא ל־ नाम रखने के अर्थ में है। אֶרֶץ को नगरों के सामूहिक भूभाग के लिए स्वाभाविक हिन्दी ‘प्रदेश’ से व्यक्त किया गया है; כָּבוּל को संभावित स्थान-नाम मानकर लिप्यंतरित किया गया है।
- source_word: עַד הַיּוֹם הַזֶּה
  choice: और वह आज तक इसी नाम से जाना जाता है
  rationale: यह कथावाचक का काल-सूत्र है। हिन्दी में यह विस्तार उस नाम के बने रहने का अभिप्राय स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
