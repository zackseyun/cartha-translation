  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सहज कथात्मक स्तर रखा गया है। प्रत्यक्ष वचन में हीराम का असंतोष स्पष्ट है, जबकि ‘काबूल’ की अनिश्चित व्युत्पत्ति को मुख्य पाठ में निर्णायक अर्थ देने के बजाय पाद-टिप्पणी में सुरक्षित रखा गया है।
