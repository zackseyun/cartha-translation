lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: भेजा
  rationale: वाव-क्रमिक अपूर्ण क्रिया यहाँ कथा को आगे बढ़ाती हुई सामान्य भूतकाल का अर्थ देती है; ‘भेजा’ स्वाभाविक और सीधा हिन्दी रूप है।
- source_word: חִירָם
  choice: हीराम
  rationale: यह हिब्रू नाम का प्रचलित हिन्दी लिप्यंतरण है और राजाओं की पुस्तक के संदर्भ में स्पष्ट है।
- source_word: לַמֶּלֶךְ
  choice: राजा के पास
  rationale: हिब्रू में निश्चित उपपद के साथ केवल ‘राजा को/के पास’ है; संदर्भ में राजा सुलैमान है, पर मुख्य पाठ में उसका नाम जोड़ना उचित नहीं। भेजी गई वस्तु के गंतव्य के लिए ‘के पास’ स्वाभाविक हिन्दी है।
- source_word: מֵאָה וְעֶשְׂרִים
  choice: एक सौ बीस
  rationale: यह संख्या का सीधा, स्पष्ट और आधुनिक हिन्दी रूप है।
- source_word: כִּכַּר
  choice: किक्कार
  rationale: यह प्राचीन भार-माप का पारंपरिक बाइबलीय नाम है। आधुनिक पाठक के लिए इसका अर्थ पादटिप्पणी में स्पष्ट किया गया है; इसे किसी आधुनिक भार में बदलने से अनिश्चितता उत्पन्न होती।
- source_word: זָהָב
  choice: सोना
  rationale: यह संज्ञा सोने को दर्शाती है; हिन्दी में संख्या और भार-माप के साथ ‘एक सौ बीस किक्कार सोना’ स्वाभाविक है।
