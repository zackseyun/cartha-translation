source:
  edition: WLC
  text: וְ/אַתָּ֞ה אִם תֵּלֵ֣ךְ לְ/פָנַ֗/י כַּ/אֲשֶׁ֨ר הָלַ֜ךְ דָּוִ֤ד אָבִ֨י/ךָ֙ בְּ/תָם לֵבָ֣ב וּ/בְ/יֹ֔שֶׁר לַ/עֲשׂ֕וֹת כְּ/כֹ֖ל אֲשֶׁ֣ר צִוִּיתִ֑י/ךָ חֻקַּ֥/י וּ/מִשְׁפָּטַ֖/י תִּשְׁמֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/009/004.yaml
  text: And as for you[a], if you walk before me as David your father walked, with integrity of heart and with uprightness, doing according to all that I have commanded you, and if you keep my statutes and my judgments[b],
translation:
  language: hi
  text: और तुम, यदि तुम मेरे सामने वैसे ही चलो जैसे तुम्हारे पिता दाऊद चले थे—मन की खराई[a] और सीधाई के साथ—और जो कुछ मैंने तुम्हें आज्ञा दी है, उसके अनुसार करो, तथा मेरी विधियों और मेरे न्याय-विधानों[b] का पालन करो,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “सम्पूर्ण मन से।” इब्रानी शब्द अखंडता और खरी निष्ठा पर बल देता है; इसका अर्थ अनिवार्यतः पूर्णतः निष्पाप होना नहीं है।
    reason: lexical_alternative
  - marker: b
    text: या, “मेरी विधियों और मेरे नियमों।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַתָּה
  choice: और यदि तुम
  rationale: प्रत्यक्ष संबोधन में हल्का बल है; हिन्दी में शर्त के साथ सहज वाक्य-विन्यास रखने के लिए ‘तुम’ को स्पष्ट रखा गया है।
- source_word: תֵּלֵךְ לְפָנַי
  choice: मेरे सामने ... चलो
  rationale: परमेश्वर की उपस्थिति में आचरण करने की वाचाई उपमा को बनाए रखता है।
- source_word: כַּאֲשֶׁר הָלַךְ דָּוִד אָבִיךָ
  choice: वैसे ही ... जैसे तुम्हारे पिता दाऊद चले थे
  rationale: दाऊद के जीवन-आचरण से तुलना और मूल क्रिया की समानता सुरक्षित रहती है।
- source_word: בְּתָם לֵבָב
  choice: मन की खराई
  rationale: यह पूर्णता, अखंड निष्ठा और निष्कपटता व्यक्त करता है, अनिवार्यतः निष्पाप सिद्धता नहीं।
- source_word: וּבְיֹשֶׁר
  choice: और सीधेपन से
  rationale: नैतिक सीधाई का मूल बिंब रखते हुए आधुनिक हिन्दी में स्वाभाविक अभिव्यक्ति देता है।
- source_word: לַעֲשׂוֹת כְּכֹל אֲשֶׁר צִוִּיתִיךָ
  choice: जो कुछ मैंने तुम्हें आज्ञा दी है, उसके अनुसार करो
  rationale: כְּכֹל की व्यापकता और आज्ञाकारिता के भाव दोनों को स्पष्ट करता है।
- source_word: חֻקַּי
  choice: मेरी विधियों
  rationale: वाचाई और कानूनी संदर्भ में निर्धारित विधियों का भाव देता है तथा अगले पद से भेद रखता है।
- source_word: וּמִשְׁפָּטַי
  choice: और मेरे न्याय-विधानों
  rationale: न्यायिक निर्णयों अथवा नियमों का कानूनी अर्थ बनाए रखता है और חֻקַּי से शब्दार्थगत भेद दिखाता है।
- source_word: תִּשְׁמֹר
  choice: पालन करो
  rationale: वाचा-संबंधी संदर्भ में ‘मानना/पालन करना’ हिन्दी का स्वाभाविक अर्थ है।
theological_decisions:
- issue: दाऊद के उदाहरण का चरित्रांकन
  choice: ‘मन की खराई’ द्वारा अखंड और निष्कपट निष्ठा व्यक्त की गई है, निष्पाप सिद्धता नहीं।
  alternative: ‘निर्दोष मन’ अथवा ‘सम्पूर्ण मन’
  rationale: यह पद दाऊद को वाचा-निष्ठ आचरण का आदर्श बताता है, पर उसे हर अर्थ में पापरहित घोषित नहीं करता; अनुवाद इस तनाव को सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमामय और सहज शैली अपनाई गई है। ‘चलना’ की बाइबलीय आचरण-संबंधी उपमा तथा शर्तवाचक अधूरापन बनाए रखा गया है, क्योंकि वाक्य अगले पद में पूरा होता है।
