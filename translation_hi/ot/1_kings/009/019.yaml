  text: also all the storage cities that belonged to Solomon[a], the chariot cities, the horsemen's cities, and whatever Solomon desired to build in Jerusalem, in Lebanon[c][b], and in all the land of his dominion.
translation:
  language: hi
  text: और सुलैमान के सभी भंडार-नगरों[a], रथों के नगरों, घुड़सवारों के नगरों[b], और वह सब कुछ जो सुलैमान यरूशलेम में, लबानोन में और अपने शासन के पूरे प्रदेश में बनाना चाहता था[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “भंडारण के नगर” अथवा “रसद-नगर।” इब्रानी पद भंडारण या रसद के लिए निर्धारित नगरों को दर्शाता है।
    reason: lexical_alternative
  - marker: b
    text: या “घुड़सवार-नगर।” इब्रानी शब्द सामान्य रूप से घोड़ों के बजाय विशेष रूप से घुड़सवारों को दर्शाता है।
    reason: lexical_alternative
  - marker: c
    text: शाब्दिक रूप से, “सुलैमान की वह इच्छा जिसे वह बनाने की इच्छा करता था।” यह इब्रानी की बलसूचक सजातीय अभिव्यक्ति है, जो उस सब पर बल देती है जिसे सुलैमान बनाना चाहता था।
    reason: lexical_alternative
