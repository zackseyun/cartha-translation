- source_word: עָרֵי הַפָּרָשִׁים
  choice: घुड़सवारों के नगरों
  rationale: פָּרָשִׁים विशेष रूप से घुड़सवारों को दर्शाता है, केवल घोड़ों को नहीं; इसलिए यह भेद अनुवाद में रखा गया है।
- source_word: חֵשֶׁק שְׁלֹמֹה אֲשֶׁר חָשַׁק
  choice: उन सभी चीज़ों को, जिन्हें सुलैमान ... बनाना चाहता था
  rationale: मूल में सजातीय संज्ञा-क्रिया रचना इच्छा पर बल देती है। हिन्दी में शाब्दिक पुनरुक्ति अस्वाभाविक होती, इसलिए उसके व्यापक और बलयुक्त आशय को सहज रूप में व्यक्त किया गया है।
- source_word: בִּירוּשָׁלִַם וּבַלְּבָנוֹן
  choice: यरूशलेम में, लबानोन में
  rationale: दोनों स्थानवाचक पदों को सीधे रूप में रखा गया है; लबानोन को निर्माण-सामग्री मानकर अर्थ सीमित नहीं किया गया।
- source_word: בְּכֹל אֶרֶץ מֶמְשַׁלְתּוֹ
  choice: अपने शासन के पूरे प्रदेश में
  rationale: यह विकल्प אֶרֶץ के भूभाग और מֶמְשַׁלְתּוֹ के राजकीय शासन—दोनों भावों को स्वाभाविक हिन्दी में रखता है।
