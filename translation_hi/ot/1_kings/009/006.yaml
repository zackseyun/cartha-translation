  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: אִם שׁ֨וֹב תְּשֻׁב֜וּ/ן אַתֶּ֤ם וּ/בְנֵי/כֶם֙ מֵֽ/אַחֲרַ֔/י וְ/לֹ֤א תִשְׁמְרוּ֙ מִצְוֺתַ֣/י חֻקֹּתַ֔/י אֲשֶׁ֥ר נָתַ֖תִּי לִ/פְנֵי/כֶ֑ם וַ/הֲלַכְתֶּ֗ם וַ/עֲבַדְתֶּם֙ אֱלֹהִ֣ים אֲחֵרִ֔ים וְ/הִשְׁתַּחֲוִיתֶ֖ם לָ/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/009/006.yaml
  text: But if you or your sons turn away from following me[a], and do not keep my commandments and my statutes that I have set before you, and go and serve other gods and bow down to them,
translation:
  language: hi
  text: पर यदि तुम और तुम्हारे पुत्र मेरा अनुसरण छोड़ दो[a], और मेरी उन आज्ञाओं और विधियों का पालन न करो जिन्हें मैंने तुम्हारे सामने रखा है, और जाकर अन्य देवताओं की सेवा करो और उन्हें दण्डवत् करो,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “यदि तुम या तुम्हारे पुत्र मेरा अनुसरण छोड़ दें।” हिब्रू में शाब्दिक रूप से “तुम और तुम्हारे पुत्र” है; प्रसंग में चेतावनी सुलैमान और उसके वंश पर लागू होती है।
    reason: वैकल्पिक वितरणात्मक अर्थ और राजवंशीय दायरे को स्पष्ट करना
lexical_decisions:
- source_word: אִם
  choice: पर यदि
  rationale: אִם शर्त प्रस्तुत करता है; प्रसंग में पिछले वचन के विपरीत चेतावनी आरम्भ होने के कारण ‘पर यदि’ स्वाभाविक है।
- source_word: שׁוֹב תְּשֻׁבוּן
  choice: फिर जाओ
  rationale: क्रिया की यह प्रबल रचना निश्चित या गंभीर रूप से मुड़ जाने का भाव देती है। מֵאַחֲרַי के साथ इसका आशय यहोवा का अनुसरण छोड़ देना है।
- source_word: אַתֶּם וּבְנֵיכֶם
  choice: तुम और तुम्हारे पुत्र
  rationale: हिब्रू में संयोजक וְ का सीधा अर्थ ‘और’ है, और राजवंशीय प्रसंग में בנים सुलैमान के पुत्रों अथवा वंशजों की ओर संकेत करता है। वैकल्पिक वितरणात्मक अर्थ फुटनोट में दिया गया है।
- source_word: מֵאַחֲרַי
  choice: मेरे पीछे चलने से
  rationale: यह वाचाई मुहावरा यहोवा का अनुसरण करना छोड़ने को व्यक्त करता है; हिंदी में यह संबंधपरक चित्र बनाए रखता है।
- source_word: וְלֹא תִשְׁמְרוּ
  choice: पालन न करो
  rationale: आज्ञाओं के संदर्भ में שׁמר का स्वाभाविक हिंदी अर्थ ‘पालन करना’ है।
- source_word: מִצְוֺתַי חֻקֹּתַי
  choice: मेरी आज्ञाओं और विधियों
  rationale: दो अलग कानूनी-वाचाई पदों का भेद क्रमशः ‘आज्ञाओं’ और ‘विधियों’ से सुरक्षित रहता है।
- source_word: אֲשֶׁר נָתַתִּי לִפְנֵיכֶם
  choice: जिन्हें मैंने तुम्हारे सामने रखा है
  rationale: נתן के साथ לפני का मुहावरा किसी के सामने नियम रखने या प्रस्तुत करने का अर्थ देता है।
- source_word: וַהֲלַכְתֶּם וַעֲבַדְתֶּם
  choice: बल्कि जाकर ... सेवा करो
  rationale: הלך यहाँ अगली क्रिया की ओर बढ़ने को दिखाता है; हिंदी में ‘जाकर सेवा करो’ सहज है। ‘बल्कि’ निषेध से मूर्तिपूजा की विपरीत क्रिया की ओर संक्रमण स्पष्ट करता है।
- source_word: אֱלֹהִים אֲחֵרִים
  choice: दूसरे देवताओं
  rationale: बहुवचन और इस्राएल के परमेश्वर से भिन्न देवताओं का सीधा अर्थ सुरक्षित है।
- source_word: וְהִשְׁתַּחֲוִיתֶם לָהֶם
  choice: उन्हें दण्डवत् करो
  rationale: השתחוה शारीरिक रूप से झुकने या भूमि पर गिरकर सम्मान देने को दर्शाता है; ‘दण्डवत् करना’ इसे ‘सेवा करना’ से अलग रखता है।
theological_decisions:
- issue: चेतावनी का राजवंशीय दायरा
  choice: ‘तुम और तुम्हारे पुत्र’—सुलैमान तथा उसके राजवंशीय उत्तराधिकारी
  alternative: ‘तुम या तुम्हारे पुत्र’—शर्त को सुलैमान अथवा उसके वंश में से किसी पर वितरणात्मक रूप से लागू समझना
  rationale: हिब्रू का स्पष्ट संयोजन ‘और’ है और निकट प्रसंग दाऊदी राजघराने से संबंधित है। मुख्य पाठ इस रूप को बनाए रखता है, जबकि चेतावनी के संभावित वितरणात्मक बल को फुटनोट में सुरक्षित किया गया है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिंदी। ‘आज्ञाएँ’, ‘विधियाँ’, ‘सेवा’ और ‘दण्डवत्’ वाचाई तथा उपासना-संबंधी भेदों को बनाए रखते हैं। वाक्य अगले पद में पूरी होने वाली शर्त का आरम्भ है, इसलिए अंत में अल्पविराम रखा गया है।
