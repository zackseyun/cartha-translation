  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֵלָ֗י/ו שָׁ֠מַעְתִּי אֶת תְּפִלָּתְ/ךָ֣ וְ/אֶת תְּחִנָּתְ/ךָ֮ אֲשֶׁ֣ר הִתְחַנַּ֣נְתָּה לְ/פָנַ/י֒ הִקְדַּ֗שְׁתִּי אֶת הַ/בַּ֤יִת הַ/זֶּה֙ אֲשֶׁ֣ר בָּנִ֔תָה לָ/שֽׂוּם שְׁמִ֥/י שָׁ֖ם עַד עוֹלָ֑ם וְ/הָי֨וּ עֵינַ֧/י וְ/לִבִּ֛/י שָׁ֖ם כָּל הַ/יָּמִֽים־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/009/003.yaml
  text: And Yahweh said to him[a], “I have heard your prayer and your plea for favor that you made before me. I have consecrated this house that you built, to put my name there forever[c][b], and my eyes and my heart will be there all the days.”
translation:
  language: hi
  text: याहवे ने उससे कहा, “मैंने तुम्हारी प्रार्थना और तुम्हारी कृपा की याचना सुनी है, जो तुमने मेरे सामने की थी। मैंने इस भवन[a] को, जिसे तुमने बनाया, पवित्र ठहराया है, ताकि मैं अपना नाम वहाँ सदा के लिए रखूँ।[b] मेरी आँखें और मेरा हृदय वहाँ सभी दिनों तक रहेंगे।[c]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “इस भवन” से आशय सुलैमान द्वारा बनाए गए मंदिर से है।
    reason: lexical_alternative
  - marker: b
    text: “अपना नाम वहाँ रखना” मंदिर से जुड़ी वाचा-संबंधी अभिव्यक्ति है; इसका अर्थ यह नहीं कि परमेश्वर केवल उसी स्थान तक सीमित है।
    reason: cultural_note
  - marker: c
    text: “मेरी आँखें और मेरा हृदय” परमेश्वर के निरंतर ध्यान और लगाव को व्यक्त करने वाला मानवीय बिंब है।
    reason: cultural_note
lexical_decisions:
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत नाम को उपाधि से बदलने के बजाय उसके प्रचलित लिप्यंतरण से प्रस्तुत किया गया है।
- source_word: שָׁמַעְתִּי
  choice: मैंने ... सुन ली है
  rationale: पूर्ण हो चुकी क्रिया और वर्तमान उत्तर में उसकी प्रासंगिकता—दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: תְּפִלָּתְךָ וְאֶת־תְּחִנָּתְךָ
  choice: तुम्हारी प्रार्थना और कृपा के लिए की गई वह विनती
  rationale: दोनों निकटार्थी शब्दों का भेद बनाए रखा गया है; תְּחִנָּה नम्रतापूर्वक कृपा माँगने वाली विनती को सूचित करता है।
- source_word: לְפָנַי
  choice: मेरे सामने
  rationale: स्थानवाचक इब्रानी मुहावरे का सहज और गरिमापूर्ण हिन्दी रूप।
- source_word: הִקְדַּשְׁתִּי
  choice: मैंने ... पवित्र ठहराया है
  rationale: भवन को परमेश्वर के लिए अलग करके पवित्र करने का धार्मिक भाव सुरक्षित रखता है।
- source_word: הַבַּיִת הַזֶּה
  choice: इस भवन
  rationale: मूल शब्द 'घर/भवन' है; संदर्भ में यह सुलैमान द्वारा बनाया गया मंदिर है, जिसे पादटिप्पणी में स्पष्ट किया गया है।
- source_word: לָשׂוּם שְׁמִי שָׁם
  choice: अपना नाम वहाँ ... रखूँ
  rationale: मंदिर से जुड़ी वाचा-संबंधी 'नाम रखने' की अभिव्यक्ति को बिना व्याख्यात्मक विस्तार के सुरक्षित रखता है।
- source_word: עַד־עוֹלָם
  choice: सदा के लिए
  rationale: दीर्घस्थायी वाचा-संबंधी अभिप्राय का स्वाभाविक हिन्दी रूप।
- source_word: עֵינַי וְלִבִּי
  choice: मेरी आँखें और मेरा हृदय
  rationale: परमेश्वर के निरंतर ध्यान और लगाव को व्यक्त करने वाले सजीव मानवीय बिंब को ज्यों का त्यों रखा गया है।
- source_word: כָּל־הַיָּמִים
  choice: हर समय
  rationale: शाब्दिक 'सभी दिनों' का सहज हिन्दी समतुल्य, जो निरंतरता व्यक्त करता है।
theological_decisions:
- issue: “मेरी आँखें और मेरा हृदय” में परमेश्वर के लिए मानवीय अंगों की भाषा
  choice: मानवीय बिंब को सीधे बनाए रखना
  alternative: “मेरा ध्यान और मेरी चिंता वहाँ बनी रहेगी”
  rationale: मूल पाठ परमेश्वर के निरंतर ध्यान और स्नेहपूर्ण सरोकार को देहात्मक बिंब द्वारा व्यक्त करता है; व्याख्यात्मक भावानुवाद इस साहित्यिक और धर्मवैचारिक बनावट को समतल कर देता।
- issue: “अपना नाम वहाँ सदा के लिए रखूँ” का अर्थ
  choice: मंदिर-नाम संबंधी मूल मुहावरा सुरक्षित रखना
  alternative: “मैं वहाँ सदा निवास करूँ”
  rationale: पाठ स्पष्ट रूप से परमेश्वर का 'नाम' रखने की बात करता है। इसे परमेश्वर के प्रत्यक्ष भौतिक निवास या केवल आराधना के स्थान के रूप में विस्तृत करना मूल की अर्थपूर्ण सूक्ष्मता को समय से पहले सुलझा देता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज शैली रखी गई है। “कृपा के लिए की गई ... विनती” से प्रार्थना और नम्र अनुनय का शब्दगत भेद उभरता है। मंदिर-संबंधी मूल मुहावरों तथा मानवीय बिंबों को अनावश्यक धर्मवैचारिक विस्तार के बिना सुरक्षित रखा गया है।
