- source_word: אָז
  choice: तब
  rationale: वृत्तांत में कालक्रम को संक्षेप और स्पष्ट रूप से व्यक्त करता है।
- source_word: בָּנָה
  choice: निर्माण किया
  rationale: सरल पूर्ण निर्माण-कर्म को व्यक्त करता है; ‘बनाना आरम्भ किया’ जैसी अनावश्यक व्याख्या नहीं जोड़ी गई।
- source_word: הַמִּלּוֹא
  choice: मिल्लो
  rationale: यह यरूशलेम की किसी विशिष्ट संरचना या स्थल का विवादित तकनीकी नाम है; लिप्यन्तरण इसके सटीक स्वरूप पर अनावश्यक निर्णय से बचता है।
