- source_word: עָלְתָה
  choice: चली गई
  rationale: मूल क्रिया में ऊपर जाने का भाव है, पर हिन्दी में यहाँ गन्तव्य की ओर जाने के लिए ‘चली गई’ अधिक स्वाभाविक है; स्थलाकृतिक ऊँचाई को अनिश्चित रूप से उभारने से बचा गया है।
- source_word: מֵעִיר דָּוִד
  choice: दाऊद के नगर से
  rationale: स्थाननाम और स्रोत-बोध दोनों को सीधा रखा गया है।
- source_word: אֶל בֵּיתָהּ
  choice: अपने उस भवन में
  rationale: בַּיִת का अर्थ घर या राजकीय भवन हो सकता है; प्रसंगानुकूल ‘भवन’ राजमहल की धारणा थोपे बिना गरिमापूर्ण और स्वाभाविक है।
- source_word: אֲשֶׁר בָּנָה לָהּ
  choice: जिसे उसने उसके लिए बनवाया था
