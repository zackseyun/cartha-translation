  text: पर फ़िरौन की बेटी दाऊद के नगर से चढ़कर अपने उस भवन में गई, जिसे सुलैमान ने उसके लिए बनाया था; तब उसने मिल्लो[a] का निर्माण किया।
  philosophy: optimal-equivalence
  footnotes:
