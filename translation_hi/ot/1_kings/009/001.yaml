  yaml_path: translation/ot/1_kings/009/001.yaml
  text: And it happened[a], when Solomon had finished building the house of Yahweh and the king’s house, and all that Solomon desired to make,
translation:
  language: hi
  text: जब सुलैमान यहोवा का भवन, राजा का भवन, और वह सब कुछ जिसे करने की उसकी इच्छा थी[a], पूरा कर चुका था, तब ऐसा हुआ कि—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “सुलैमान की सारी इच्छा,” अथवा “हर वह काम जिसे सुलैमान करना चाहता था।”
    reason: חֵשֶׁק का अर्थ ‘इच्छा’ भी हो सकता है और संदर्भ में उससे अभिप्रेत काम/परियोजनाएँ भी।
lexical_decisions:
- source_word: וַיְהִי
  choice: तब ऐसा हुआ कि
  rationale: यह कथात्मक वय्यिक्तोल नए प्रसंग का आरम्भ करता है। हिंदी में यह रूप उसके कथानक-संबंधी कार्य को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: כְּכַלּוֹת
  choice: जब ... बना चुका
  rationale: כְּ के साथ כלה का infinitive construct समय-संबंधी परिस्थिति बताता है; ‘बना चुका’ कार्य की पूर्णता और आगे आने वाली घटना का क्रम स्पष्ट करता है।
- source_word: בֵּית יְהוָה
  choice: यहोवा का भवन
  rationale: בַּיִת का मूल अर्थ ‘भवन/घर’ है। ‘भवन’ हिंदी में उपासना-स्थल के लिए गरिमामय और स्वाभाविक है तथा ‘मन्दिर’ की अपेक्षा मूल अभिव्यक्ति के निकट रहता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: चतुरक्षरीय परमेश्वर-नाम को उपाधि से बदलने के बजाय हिंदी में प्रचलित नामरूप ‘यहोवा’ से व्यक्त किया गया है।
- source_word: בֵּית הַמֶּלֶךְ
  choice: राजभवन
  rationale: शाब्दिक अर्थ ‘राजा का भवन’ है; आधुनिक हिंदी में ‘राजभवन’ राजकीय निवास का संक्षिप्त और स्वाभाविक रूप है।
- source_word: כָּל חֵשֶׁק שְׁלֹמֹה אֲשֶׁר חָפֵץ לַעֲשׂוֹת
  choice: वह सब कुछ ... जिसकी उसे इच्छा थी
  rationale: חֵשֶׁק और חָפֵץ इच्छा/अभिलाषा का भाव रखते हैं। यह अनुवाद किसी विशेष प्रकार की परियोजना जोड़ने के बिना मूल का व्यापक अर्थ बनाए रखता है।
theological_decisions:
- issue: परमेश्वर के नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल में परमेश्वर का विशिष्ट नाम सीधे आया है। उसे ‘प्रभु’ जैसी उपाधि से प्रतिस्थापित नहीं किया गया; हिंदी पाठकों में परिचित नामरूप ‘यहोवा’ चुना गया है।
