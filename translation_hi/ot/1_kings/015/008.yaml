  yaml_path: translation/ot/1_kings/015/008.yaml
  text: And Abijam lay down with his fathers[a], and they buried him in the city of David[b]. Then Asa his son became king in his place.
translation:
  language: hi
  text: और अबिय्याम अपने पुरखाओं के साथ सो गया[a], और उन्होंने उसे दाऊद के नगर में दफ़नाया। फिर उसका पुत्र आसा उसकी जगह राजा हुआ।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक अर्थ: “अपने पुरखाओं के साथ लेट गया।” यह मृत्यु के लिए प्रयुक्त एक पारंपरिक इब्रानी अभिव्यक्ति है।'
    reason: cultural_note
  - marker: b
    text: कुछ समानांतर या संबंधित पदों में अबिय्याम का नाम ‘अबिय्याह’ है; पर इस पद के इब्रानी पाठ में ‘अबिय्याम’ है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁכַּב עִם אֲבֹתָיו
  choice: अपने पुरखाओं के साथ सो गया
  rationale: यह मृत्यु के लिए प्रयुक्त पारंपरिक इब्रानी मुहावरा है। हिंदी में रूपक को बनाए रखते हुए फुटनोट द्वारा उसका आशय स्पष्ट किया गया है।
- source_word: אֲבִיָּם
  choice: अबियाम
  rationale: इस पद के इब्रानी पाठ में नाम אֲבִיָּם है; इसलिए संबंधित स्थानों में मिलने वाले ‘अबिय्याह’ के बजाय इसी रूप का लिप्यंतरण रखा गया है।
- source_word: וַיִּקְבְּרוּ אֹתוֹ
  choice: उन्होंने उसे ... दफ़नाया
  rationale: इब्रानी क्रिया सक्रिय बहुवचन में है; अनिर्दिष्ट कर्ताओं को ‘उन्होंने’ से स्वाभाविक रूप में सुरक्षित रखा गया है।
- source_word: בְּעִיר דָּוִד
  choice: दाऊद के नगर में
  rationale: यह स्थापित स्थान-सूचक अभिव्यक्ति है और आधुनिक हिंदी में सहज है।
- source_word: וַיִּמְלֹךְ
  choice: राजा हुआ
  rationale: उत्तराधिकार के इस सूत्र में क्रिया राजगद्दी सँभालने का आरंभ सूचित करती है; ‘राज्य किया’ की अपेक्षा ‘राजा हुआ’ यह अर्थ अधिक ठीक व्यक्त करता है।
- source_word: תַּחְתָּיו
  choice: उसकी जगह
  rationale: राजकीय उत्तराधिकार के संदर्भ में पद संभालने या स्थान लेने का भाव है।
