  text: בְּרִית֙ בֵּינִ֣/י וּ/בֵינֶ֔/ךָ בֵּ֥ין אָבִ֖/י וּ/בֵ֣ין אָבִ֑י/ךָ הִנֵּה֩ שָׁלַ֨חְתִּֽי לְ/ךָ֥ שֹׁ֨חַד֙ כֶּ֣סֶף וְ/זָהָ֔ב לֵ֣ךְ הָפֵ֗רָ/ה אֶת בְּרִֽיתְ/ךָ֙ אֶת בַּעְשָׁ֣א מֶֽלֶךְ יִשְׂרָאֵ֔ל וְ/יַעֲלֶ֖ה מֵ/עָלָֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/015/019.yaml
  text: There is a covenant between me and you, between my father and your father. Look, I have sent you a bribe of silver and gold. Go, break your covenant with Baasha king of Israel, so that he may withdraw from me.
translation:
  language: hi
  text: “मेरे और तुम्हारे बीच, और मेरे पिता और तुम्हारे पिता के बीच वाचा है। देखो, मैंने तुम्हारे पास चाँदी और सोने की रिश्वत भेजी है। जाओ, इस्राएल के राजा बाशा के साथ अपनी वाचा तोड़ दो, ताकि वह मुझ पर से हट जाए।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּרִית
  choice: वाचा
  rationale: यह राजनीतिक संधि या औपचारिक समझौते को व्यक्त करता है और पद में इसकी पुनरावृत्ति को बनाए रखता है।
- source_word: שֹׁחַד
  choice: घूस
  rationale: इस शब्द का सामान्य अर्थ किसी को प्रभावित करने के लिए दिया गया रिश्वत-सदृश भुगतान है; प्रसंग में चाँदी-सोना बाशा से वाचा तुड़वाने के उद्देश्य से भेजा गया है।
- source_word: הָפֵרָה
  choice: तोड़ दो
  rationale: हिफ़ील आज्ञार्थक रूप किसी वाचा को भंग करने की सक्रिय माँग व्यक्त करता है।
- source_word: וְיַעֲלֶה מֵעָלָי
  choice: ताकि वह मेरे यहाँ से हट जाए
  rationale: शाब्दिक ‘मेरे ऊपर से चढ़/हट जाए’ का प्रसंगानुकूल अर्थ बाशा द्वारा आसा पर डाला गया दबाव हटाना या उसके क्षेत्र से लौट जाना है; अनावश्यक विशिष्टता जोड़े बिना मूल रूपक का आशय दिया गया है।
theological_decisions:
- issue: שֹׁחַד के नैतिक रूप से आरोपित अर्थ को बनाए रखना
  choice: घूस
  alternative: भेंट
  rationale: मूल शब्द सामान्य ‘भेंट’ से अधिक नकारात्मक और उद्देश्यपूर्ण भुगतान दर्शाता है। ‘घूस’ कथा के नैतिक तनाव को बिना नरम किए सुरक्षित रखता है।
- issue: आरंभिक वाचा-वाक्य का काल/स्वरूप
  choice: वाचा है
  alternative: वाचा होने पाए / आओ वाचा करें
  rationale: हिब्रू में स्पष्ट क्रिया नहीं है; स्वाभाविक नामवाचक वाक्य वर्तमान में विद्यमान वाचा का दावा करता है। इसे प्रस्ताव या आदेश बनाना मूल की अस्पष्टता से आगे जाता।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण प्रत्यक्ष भाषण। ‘वाचा’ बाइबिलीय संदर्भ के लिए रखा गया है; शेष वाक्य-संरचना सामान्य पाठक के लिए सहज बनाई गई है।
