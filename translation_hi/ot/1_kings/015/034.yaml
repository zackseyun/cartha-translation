base_translation:
  language: en
  yaml_path: translation/ot/1_kings/015/034.yaml
  text: He did what was evil in the eyes of Yahweh and walked in the way of Jeroboam and in his sin by which he caused Israel to sin.
translation:
  language: hi
  text: उसने वह किया जो यहोवा की दृष्टि में बुरा था। उसने यारोबाम की राह और उसके उस पाप का अनुसरण किया, जिसके द्वारा यारोबाम ने इस्राएल से पाप करवाया था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַשׂ הָרַע
  choice: उसने वह किया जो ... बुरा था
  rationale: इब्रानी का प्रचलित मूल्यांकन-सूत्र स्वाभाविक हिन्दी में व्यक्त होता है और הָרַע को केवल विशेषण बनाकर उसका भाव नहीं घटाता।
- source_word: בְּעֵינֵי יְהוָה
  choice: यहोवा की दृष्टि में
  rationale: यह इब्रानी मुहावरे का सहज हिन्दी रूप है और दैवी मूल्यांकन का भाव बनाए रखता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: मूल पाठ में आए परमेश्वर के विशिष्ट वाचा-नाम को हिन्दी के प्रचलित रूप में रखा गया है।
- source_word: וַיֵּלֶךְ בְּדֶרֶךְ יָרָבְעָם
  choice: वह यारोबाम की राह पर ... चलता रहा
  rationale: चलने और राह की मूल रूपक-भाषा सुरक्षित रहती है; सन्दर्भ में यह लगातार अपनाए गए आचरण को दर्शाती है।
- source_word: וּבְחַטָּאתוֹ
  choice: और उसके उस पाप में
  rationale: एकवचन और यारोबाम से जुड़े सर्वनाम को बनाए रखते हुए अगले सम्बन्धवाचक उपवाक्य से स्पष्ट सम्बन्ध जोड़ा गया है।
- source_word: אֲשֶׁר הֶחֱטִיא אֶת יִשְׂרָאֵל
  choice: जिसके द्वारा उसने इस्राएल से पाप करवाया था
  rationale: 'हिफ़ील रूप की कारणवाचक शक्ति को स्पष्ट रखता है: यारोबाम ने इस्राएल को पाप करने के लिए प्रेरित या बाध्य किया।'
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: विशिष्ट वाचा-नाम को सामान्य उपाधि से नहीं बदला गया; आधुनिक हिन्दी बाइबलीय प्रयोग में ‘यहोवा’ व्यापक रूप से पहचाना जाता है।
- issue: यारोबाम की भूमिका और इस्राएल का पाप
  choice: उसने इस्राएल से पाप करवाया
  alternative: उसने इस्राएल को पाप में डाल दिया
  rationale: कारणवाचक इब्रानी क्रिया को बनाए रखा गया है, पर यह इससे आगे नहीं बताता कि इस्राएल की अपनी नैतिक जिम्मेदारी कितनी थी।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘राह पर ... चलता रहा’ मूल के आचरण-संबंधी रूपक और सूत्रात्मक शैली दोनों को सुरक्षित रखता है।
