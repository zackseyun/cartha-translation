  text: בִּ/שְׁנַ֣ת שָׁלֹ֔שׁ לְ/אָסָ֖א מֶ֣לֶךְ יְהוּדָ֑ה מָ֠לַךְ בַּעְשָׁ֨א בֶן אֲחִיָּ֤ה עַל כָּל יִשְׂרָאֵל֙ בְּ/תִרְצָ֔ה עֶשְׂרִ֥ים וְ/אַרְבַּ֖ע שָׁנָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/015/033.yaml
  text: In the third year of Asa king of Judah, Baasha son of Ahijah became king over all Israel in Tirzah, and he reigned twenty-four years.
translation:
  language: hi
  text: यहूदा के राजा आसा के शासन के तीसरे वर्ष में अहिय्याह का पुत्र बाशा तिर्सा में समस्त इस्राएल का राजा बना और उसने चौबीस वर्ष तक शासन किया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בִּ/שְׁנַת שָׁלֹשׁ
  choice: तीसरे वर्ष में
  rationale: यह रचना राजकीय कालगणना का समय-सूचक सूत्र है; ‘तीसरे वर्ष में’ स्वाभाविक हिंदी में क्रमवाचक अर्थ सुरक्षित रखता है।
- source_word: לְ/אָסָא מֶלֶךְ יְהוּדָה
  choice: यहूदा के राजा आसा के शासन के
  rationale: लामेद आसा के राजकाल के संदर्भ को दर्शाता है। हिंदी में ‘शासन के तीसरे वर्ष’ जोड़ने से संबंध स्पष्ट और स्वाभाविक होता है।
- source_word: מָלַךְ
  choice: राजा बना … शासन किया
  rationale: पहला प्रयोग राजपद ग्रहण करने की घटना बताता है, जबकि अंतर्निहित दूसरा कालगत भाव चौबीस वर्ष के शासन को व्यक्त करता है; हिंदी में पुनरुक्ति से बचते हुए दोनों पहलू स्पष्ट किए गए हैं।
- source_word: בַּעְשָׁא בֶן אֲחִיָּה
  choice: अहिय्याह का पुत्र बाशा
  rationale: इब्रानी वंशसूचक संरचना को स्वाभाविक हिंदी क्रम में रखा गया है और व्यक्तिनामों का मानक देवनागरी लिप्यंतरण किया गया है।
- source_word: עַל כָּל יִשְׂרָאֵל
  choice: समस्त इस्राएल का
  rationale: עַל के शासन-संबंधी अर्थ को हिंदी के ‘का राजा’ द्वारा व्यक्त किया गया है; כָּל का व्यापक अर्थ ‘समस्त’ से सुरक्षित है।
- source_word: בְּ/תִרְצָה
  choice: तिर्सा में
  rationale: उपसर्ग ב स्थान सूचित करता है; ‘में’ नगर में राजकीय केंद्र होने का स्वाभाविक हिंदी संकेत है।
- source_word: עֶשְׂרִים וְ/אַרְבַּע שָׁנָה
  choice: चौबीस वर्ष तक
  rationale: संख्या शासन की अवधि बताती है; हिंदी में ‘तक’ अवधि को सहज रूप से स्पष्ट करता है।
theological_decisions: []
translation_notes:
  register: आधुनिक मानक हिंदी में सरल, गरिमापूर्ण ऐतिहासिक शैली रखी गई है। राजकीय कालगणना और उत्तरी राज्य के लिए प्रयुक्त ‘समस्त इस्राएल’ को बिना सांप्रदायिक व्याख्या के सुरक्षित रखा गया है।
