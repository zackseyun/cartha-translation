  yaml_path: translation/ot/1_kings/015/002.yaml
  text: He reigned three years in Jerusalem[b][a], and his mother’s name was Maacah daughter of Abishalom.
translation:
  language: hi
  text: उसने यरूशलेम में तीन वर्ष तक राज किया, और उसकी माता का नाम माका था, जो अबीशालोम की बेटी[a] थी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी वंशावलियों में “बेटी” शब्द कभी-कभी अधिक व्यापक अर्थ में किसी स्त्री वंशज के लिए भी प्रयुक्त हो सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: שָׁלֹשׁ שָׁנִים
  choice: तीन वर्ष तक
  rationale: संख्या और बहुवचन संज्ञा यहाँ शासन की अवधि बताते हैं; हिंदी में ‘तीन वर्ष तक’ स्वाभाविक और स्पष्ट है।
- source_word: מָלַךְ
  choice: राज किया
  rationale: מלך का काल रूप यहाँ राजकीय शासन करने को दर्शाता है, न कि केवल राजा बनने को।
- source_word: בִּירוּשָׁלִָם
  choice: यरूशलेम में
  rationale: उपसर्ग ב स्थान सूचित करता है; आधुनिक हिंदी में ‘यरूशलेम में’ स्वाभाविक है।
- source_word: וְשֵׁם אִמּוֹ
  choice: उसकी माता का नाम ... था
  rationale: यह राजकीय विवरणों में प्रयुक्त सूत्र है; अर्थ को बनाए रखते हुए हिंदी की स्वाभाविक शब्दावली अपनाई गई है।
- source_word: מַעֲכָה
  choice: माका
  rationale: इब्रानी व्यक्तिगत नाम का देवनागरी में निकट और प्रचलित लिप्यंतरण।
- source_word: בַּת
  choice: बेटी
  rationale: शब्द का सीधा अर्थ ‘बेटी’ है; वंशावली में संभावित व्यापक अर्थ को पादटिप्पणी में रखा गया है।
- source_word: אֲבִישָׁלוֹם
  choice: अबीशालोम
  rationale: यहाँ उपस्थित इब्रानी नामरूप אֲבִישָׁלוֹם का निकट देवनागरी लिप्यंतरण है।
theological_decisions:
- issue: वंशावली पदबंध בַּת אֲבִישָׁלוֹם
  choice: मुख्य पाठ में ‘अबीशालोम की बेटी’
  alternative: अबीशालोम की वंशज/पोती
  rationale: इब्रानी पाठ सीधे ‘बेटी’ कहता है। वंशावली प्रयोग में यह कभी व्यापक स्त्री-वंशज को भी सूचित कर सकता है, इसलिए अस्पष्टता को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिंदी; सरल, गरिमापूर्ण और स्रोत के राजकीय सूत्र के निकट। मूल पाठ में केवल वंश-संबंध की वास्तविक अस्पष्टता के लिए पादटिप्पणी रखी गई है; ‘अबीशालोम’ हिंदी में स्वयं इब्रानी नामरूप को स्पष्ट रूप से दर्शाता है, इसलिए अंग्रेज़ी-केंद्रित ‘Absalom’ वाली टिप्पणी नहीं जोड़ी गई।
