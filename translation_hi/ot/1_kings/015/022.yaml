base_translation:
  language: en
  yaml_path: translation/ot/1_kings/015/022.yaml
  text: Then King Asa summoned all Judah—no one was exempt—and they carried away the stones of Ramah and its timber[a], with which Baasha had built[c][b], and King Asa built with them Geba of Benjamin and Mizpah.
translation:
  language: hi
  text: तब राजा आसा ने सारे यहूदा को बुलावा भेजा—किसी को छूट नहीं थी[a]—और वे रामा के पत्थर और उसकी इमारती लकड़ी उठा ले गए, जिनसे बाशा ने निर्माण किया था[b]। राजा आसा ने उन्हीं से बिन्यामीन के गेबा और मिस्पा का निर्माण किया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “कोई छूटा हुआ नहीं था”; अर्थात अनिवार्य श्रम से किसी व्यक्ति को छूट नहीं दी गई थी।
    reason: lexical_alternative
  - marker: b
    text: “जिनसे बाशा ने निर्माण किया था” का संबंध पत्थरों और लकड़ी से है, जिन्हें बाशा ने रामा को सुदृढ़ करने में इस्तेमाल किया था।
    reason: referent_clarification
