- source_word: וַיִּשְׂאוּ
  choice: उठा ले गए
  rationale: निर्माण-सामग्री को रामा से हटाकर दूसरी जगह ले जाने, दोनों बातों को स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: אַבְנֵי הָרָמָה
  choice: रामा के पत्थर
  rationale: इब्रानी संबंधसूचक रचना का सीधा और स्वाभाविक हिंदी रूप।
- source_word: עֵצֶיהָ
  choice: उसकी इमारती लकड़ी
  rationale: बहुवचन संज्ञा यहाँ पेड़ों के बजाय निर्माण में प्रयुक्त लकड़ी की सामग्री को सूचित करती है।
- source_word: אֲשֶׁר בָּנָה בַּעְשָׁא
  choice: जिनसे बाशा ने निर्माण किया था
  rationale: संबंधवाचक उपवाक्य पत्थरों और लकड़ी, दोनों को बाशा द्वारा प्रयुक्त निर्माण-सामग्री के रूप में बताता है; हिंदी में करणवाचक रूप भ्रामक अर्थ से बचाता है।
- source_word: וַיִּבֶן בָּם
  choice: उन्हीं से ... को बनाया
  rationale: בָּם पहले उल्लिखित पत्थरों और लकड़ी को निर्माण-सामग्री के रूप में संदर्भित करता है; ‘उन्हीं’ उनके पुनः उपयोग पर बल देता है।
- source_word: גֶּבַע בִּנְיָמִן
  choice: बिन्यामीन के गेबा
  rationale: स्थान को बिन्यामीन से संबद्ध बताने वाली इब्रानी रचना का निकट और परिचित हिंदी रूप।
- source_word: הַמִּצְפָּה
  choice: मिस्पा
  rationale: निश्चित उपपद का अलग अनुवाद स्थान-नाम के साथ हिंदी में आवश्यक नहीं है।
