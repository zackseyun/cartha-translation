  register: आधुनिक मानक हिंदी का गरिमापूर्ण किंतु सरल कथात्मक रूप रखा गया है। ‘समस्त इस्राएल’ सामूहिक राष्ट्रीय-सैन्य अर्थ देता है। सभी वैकल्पिक अर्थ मुख्य पाठ के संकेतकों से संबद्ध पादटिप्पणियों में सुरक्षित रखे गए हैं।
