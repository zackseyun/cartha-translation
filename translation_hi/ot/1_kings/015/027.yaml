source:
  edition: WLC
  text: וַ/יִּקְשֹׁ֨ר עָלָ֜י/ו בַּעְשָׁ֤א בֶן אֲחִיָּה֙ לְ/בֵ֣ית יִשָּׂשכָ֔ר וַ/יַּכֵּ֣/הוּ בַעְשָׁ֔א בְּ/גִבְּת֖וֹן אֲשֶׁ֣ר לַ/פְּלִשְׁתִּ֑ים וְ/נָדָב֙ וְ/כָל יִשְׂרָאֵ֔ל צָרִ֖ים עַֽל גִּבְּתֽוֹן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/015/027.yaml
  text: Then Baasha son of Ahijah[a], of the house of Issachar, conspired against him, and Baasha struck him down at Gibbethon, which belonged to the Philistines[c][b], while Nadab and all Israel were besieging Gibbethon.
translation:
  language: hi
  text: तब इस्साकार के घराने के अहिय्याह के पुत्र बाशा ने नादाब के विरुद्ध षड्यंत्र रचा[a] और गिब्बतोन में उसे मार गिराया[b]। गिब्बतोन पलिश्तियों का था[c], और उस समय नादाब तथा समस्त इस्राएल उसे घेर रहे थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उसके विरुद्ध साज़िश की।”
    reason: lexical_alternative
  - marker: b
    text: या “उसे मार डाला”; इब्रानी में शाब्दिक अर्थ “उसे मारा” है।
    reason: lexical_alternative
  - marker: c
    text: या “जिस पर पलिश्तियों का अधिकार था।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְשֹׁר עָלָיו
  choice: उसके विरुद्ध षड्यंत्र रचा
  rationale: קשר עם על राजनीतिक सत्ता के विरुद्ध षड्यंत्र करने का भाव देता है; यह हिंदी में स्वाभाविक और संदर्भानुकूल है।
- source_word: בַּעְשָׁא בֶן אֲחִיָּה
  choice: अहिय्याह के पुत्र बाशा
  rationale: व्यक्तिनामों का प्रचलित हिंदी लिप्यंतरण और בֶן का स्वाभाविक संबंधसूचक अनुवाद रखा गया है।
- source_word: לְבֵית יִשָּׂשכָר
  choice: इस्साकार के घराने के
  rationale: यह पद वंश अथवा गोत्रीय संबद्धता बताता है; ‘घराने’ से בַּיִת का पारिवारिक-सामुदायिक भाव बना रहता है।
- source_word: וַיַּכֵּהוּ
  choice: उसे मार गिराया
  rationale: נכה का मूल भाव प्रहार करना है, जबकि प्रसंग में परिणाम मृत्यु है; ‘मार गिराया’ दोनों पहलुओं को स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: בְּגִבְּתוֹן
  choice: गिब्बतोन में
  rationale: नगर के भीतर अथवा उसके युद्धक्षेत्र में हुई घटना के लिए हिंदी में ‘में’ सहज है।
- source_word: אֲשֶׁר לַפְּלִשְׁתִּים
  choice: गिब्बतोन पलिश्तियों का था
  rationale: लामेद-रचना स्वामित्व या नियंत्रण दोनों सूचित कर सकती है; मुख्य पाठ में संक्षिप्त संबंध रखा गया है और नियंत्रण की संभावना पादटिप्पणी में दी गई है।
- source_word: וְנָדָב וְכָל יִשְׂרָאֵל
  choice: और उस समय नादाब तथा समस्त इस्राएल
  rationale: וְ को परिस्थितिजन्य-कालिक पृष्ठभूमि के रूप में व्यक्त करने हेतु ‘उस समय’ जोड़ा गया है।
- source_word: צָרִים עַל גִּבְּתוֹן
  choice: उसे घेर रहे थे
  rationale: צור על सैन्य घेराबंदी का द्योतक है; सर्वनाम से नगर की अनावश्यक पुनरावृत्ति टलती है और अर्थ स्पष्ट रहता है।
