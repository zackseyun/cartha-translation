translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण किंतु सहज राजकीय-वृत्तांत शैली रखी गई है। ‘बनवाए’ राजा की भूमिका के संदर्भ में स्वाभाविक है, और रोग की प्रकृति को पाठ से अधिक विशिष्ट नहीं किया गया। पादटिप्पणी-चिह्न संबंधित वाक्यांशों के बाद रखे गए हैं।
