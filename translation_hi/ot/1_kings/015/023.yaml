  text: וְ/יֶ֣תֶר כָּל דִּבְרֵֽי אָ֠סָא וְ/כָל גְּב֨וּרָת֜/וֹ וְ/כָל אֲשֶׁ֣ר עָשָׂ֗ה וְ/הֶֽ/עָרִים֙ אֲשֶׁ֣ר בָּנָ֔ה הֲ/לֹֽא הֵ֣מָּה כְתוּבִ֗ים עַל סֵ֛פֶר דִּבְרֵ֥י הַ/יָּמִ֖ים לְ/מַלְכֵ֣י יְהוּדָ֑ה רַ֚ק לְ/עֵ֣ת זִקְנָת֔/וֹ חָלָ֖ה אֶת רַגְלָֽי/ו־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/015/023.yaml
  text: The rest of all the acts of Asa[a], and all his might, and all that he did[b], and the cities that he built—are they not written in the Book of the Chronicles of the Kings of Judah? Yet in the time of his old age he became diseased in his feet.
translation:
  language: hi
  text: आसा के बाकी सब काम, उसका सारा पराक्रम, उसने जो कुछ किया और जो नगर उसने बनाए—क्या वे यहूदा के राजाओं के इतिहास की पुस्तक[a] में नहीं लिखे हैं? परन्तु बुढ़ापे के समय उसके पैरों में रोग हो गया।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “यहूदा के राजाओं के दिनों के वृत्तांत की पुस्तक में।”
    reason: मूल शीर्षक סֵפֶר דִּבְרֵי הַיָּמִים का अधिक शाब्दिक रूप दिया गया है; इससे किसी दूसरी बाइबलीय पुस्तक के साथ अनिवार्य पहचान नहीं ठहराई जाती।
  - marker: b
    text: या, “उसके पैर रोगग्रस्त हो गए।” इब्रानी पाठ प्रभावित अंग बताता है, पर रोग का सटीक नाम नहीं बताता।
    reason: मूल वाक्यांश की वैकल्पिक अभिव्यक्ति और उसकी चिकित्सकीय अनिश्चितता स्पष्ट की गई है।
lexical_decisions:
- source_word: וְיֶתֶר כָּל דִּבְרֵי אָסָא
  choice: आसा के बाकी सब काम
  rationale: राजकीय शासन-सारांश में דִּבְרֵי का अर्थ केवल ‘बातें’ नहीं, बल्कि राजा के कार्यों और उससे जुड़ी घटनाओं का समग्र वृत्तांत है।
- source_word: וְכָל גְּבוּרָתוֹ
  choice: उसका सारा पराक्रम
  rationale: גְּבוּרָה शक्ति, वीरता या सामर्थ्यपूर्ण कार्यों को सूचित कर सकता है; ‘पराक्रम’ संक्षिप्त और गरिमापूर्ण है तथा अगली व्यापक अभिव्यक्ति से अलग बना रहता है।
- source_word: וְכָל אֲשֶׁר עָשָׂה
  choice: उसने जो कुछ किया
  rationale: इब्रानी संबंधवाचक उपवाक्य के व्यापक और अनिर्दिष्ट अर्थ को सीधे बनाए रखता है।
- source_word: וְהֶעָרִים אֲשֶׁר בָּנָה
  choice: और जो नगर उसने बनवाए
  rationale: עָרִים के लिए ‘नगर’ और בָּנָה के लिए राजकीय संदर्भ में स्वाभाविक हिंदी ‘बनवाए’ लिया गया है; पाठ में स्पष्ट रूप से न होने के कारण ‘गढ़वाए’ या ‘किलेबन्द किए’ नहीं जोड़ा गया।
- source_word: הֲלֹא הֵמָּה כְתוּבִים
  choice: क्या वे ... नहीं लिखे हैं?
  rationale: मूल के आलंकारिक प्रश्न और कर्मवाच्य रूप दोनों सुरक्षित रखे गए हैं।
- source_word: עַל סֵפֶר דִּבְרֵי הַיָּמִים לְמַלְכֵי יְהוּדָה
  choice: यहूदा के राजाओं के इतिहास की पुस्तक में
  rationale: यह राजकीय अभिलेख-स्रोत का शीर्षक है। ‘इतिहास की पुस्तक’ सामान्य पाठक के लिए स्पष्ट है, जबकि अधिक शाब्दिक विकल्प पादटिप्पणी में दिया गया है।
- source_word: רַק
  choice: परन्तु
  rationale: यह शब्द पिछले सारांश के बाद एक सीमित करने वाली या अपवादसूचक सूचना प्रस्तुत करता है; ‘परन्तु’ उस विरोधात्मक मोड़ को स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: לְעֵת זִקְנָתוֹ
  choice: बुढ़ापे के समय
  rationale: मूल की कालवाचक संरचना को स्पष्ट और स्वाभाविक रूप में बनाए रखता है।
- source_word: חָלָה אֶת רַגְלָיו
  choice: उसके पैरों में रोग हो गया
  rationale: मूल रोग से प्रभावित अंग बताता है, पर रोग का सटीक नाम नहीं देता। यह अनुवाद उसी अनिश्चितता को सुरक्षित रखता है।
