lexical_decisions:
- source_word: וּ/בִ/שְׁנַת
  choice: के राज्य के ... वर्ष में
  rationale: यह इब्रानी ऐतिहासिक वृत्तांत का प्रचलित काल-सूचक सूत्र है। हिंदी में संबंधसूचक पदबंध के साथ “वर्ष में” स्वाभाविक है; आरंभिक ו का अलग अनुवाद आवश्यक नहीं।
- source_word: שְׁמֹנֶה עֶשְׂרֵה
  choice: अठारहवें
  rationale: राजकीय कालगणना में मूल संख्या का आशय क्रमसूचक है, इसलिए “अठारहवें वर्ष” स्वाभाविक और सटीक है।
- source_word: לַ/מֶּלֶךְ
  choice: राजा ... के राज्य के
  rationale: इस काल-सूचक सूत्र में यह राजा के शासनकाल का वर्ष बताता है। हिंदी में “के राज्य के” संबंध को स्पष्ट और सहज रूप से व्यक्त करता है।
- source_word: יָרָבְעָם בֶּן נְבָט
  choice: नबात के पुत्र राजा यारोबाम
  rationale: इब्रानी वंश-सूचक पदबंध को हिंदी के स्वाभाविक शब्दक्रम में रखा गया है और नामों का ध्वन्यात्मक लिप्यंतरण किया गया है।
- source_word: מָלַךְ
  choice: राजा हुआ
  rationale: इस राजारोहण-सूचना में क्रिया शासन की पूरी अवधि नहीं, बल्कि राजपद ग्रहण करने को सूचित करती है। “राजा हुआ” इसे संक्षिप्त और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: אֲבִיָּם
  choice: अबिय्याम
  rationale: मुख्य पाठ में मासोरेटिक रूप אֲבִיָּם को बनाए रखा गया है; अन्य स्थानों का “अबिय्याह” रूप टिप्पणी में दिया गया है।
- source_word: עַל יְהוּדָה
  choice: यहूदा का राजा
  rationale: מלך के साथ עַל किसी प्रजा या भूभाग पर शासन व्यक्त करता है। हिंदी में “यहूदा का राजा हुआ” अधिक स्वाभाविक है और वही संबंध बनाए रखता है।
