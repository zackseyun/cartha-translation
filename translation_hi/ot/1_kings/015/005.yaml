source:
  edition: WLC
  text: אֲשֶׁ֨ר עָשָׂ֥ה דָוִ֛ד אֶת הַ/יָּשָׁ֖ר בְּ/עֵינֵ֣י יְהוָ֑ה וְ/לֹֽא סָ֞ר מִ/כֹּ֣ל אֲשֶׁר צִוָּ֗/הוּ כֹּ֚ל יְמֵ֣י חַיָּ֔י/ו רַ֕ק בִּ/דְבַ֖ר אוּרִיָּ֥ה הַ/חִתִּֽי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/015/005.yaml
  text: because David had done what was right in the eyes of Yahweh and had not turned aside from anything that he had commanded him all the days of his life[a], except in the matter of Uriah the Hittite.
translation:
  language: hi
  text: क्योंकि दाऊद ने वह किया जो याहवे की दृष्टि में सही था और वह अपने जीवन भर याहवे की दी हुई किसी भी आज्ञा से नहीं हटा, केवल हित्ती ऊरिय्याह के मामले में[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘हित्ती ऊरिय्याह के प्रसंग में।’
    reason: בִּדְבַר का अर्थ यहाँ ‘मामले में’ या ‘प्रसंग में’ हो सकता है।
lexical_decisions:
- source_word: אֲשֶׁר
  choice: क्योंकि
  rationale: संदर्भ में यह संबंधवाचक अव्यय पिछले कथन का कारण प्रस्तुत करता है; इसलिए हिन्दी में कारणसूचक ‘क्योंकि’ स्वाभाविक और स्पष्ट है।
- source_word: עָשָׂה ... אֶת הַיָּשָׁר
  choice: वही किया जो ... सही था
  rationale: यह इब्रानी मुहावरा नैतिक रूप से उचित काम करने को व्यक्त करता है; चुना हुआ रूप अर्थ और मूल्यांकन दोनों को सहज हिन्दी में रखता है।
- source_word: בְּעֵינֵי יְהוָה
  choice: याहवे की दृष्टि में
  rationale: यह इब्रानी मूल्यांकन-संबंधी मुहावरे का स्वाभाविक हिन्दी रूप है और मूल रूपक का भाव बनाए रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के निज नाम को लिप्यंतरित रूप में प्रस्तुत किया गया है।
- source_word: וְלֹא סָר
  choice: नहीं हटा
  rationale: यहाँ סור आज्ञाकारिता के मार्ग से विचलित होने को दर्शाता है; ‘नहीं हटा’ संक्षिप्त, स्वाभाविक और प्रसंगानुकूल है।
- source_word: מִכֹּל אֲשֶׁר צִוָּהוּ
  choice: उसकी दी हुई किसी भी आज्ञा से
  rationale: नकारात्मक वाक्य में ‘किसी भी’ כֹּל की समग्रता को स्वाभाविक हिन्दी में व्यक्त करता है; ‘उसकी’ का संदर्भ याहवे से है।
- source_word: כֹּל יְמֵי חַיָּיו
  choice: अपने जीवन भर
  rationale: यह मूल के काल-सूचक वाक्यांश का सहज और पूर्ण हिन्दी समतुल्य है।
- source_word: רַק
  choice: केवल ... को छोड़कर
  rationale: यहाँ רַק पहले कथन का एकमात्र अपवाद प्रस्तुत करता है; हिन्दी में यह रचना उस अपवाद को स्पष्ट करती है।
- source_word: בִּדְבַר אוּרִיָּה
  choice: ऊरिय्याह के मामले में
  rationale: इस संरचना में דָּבָר का अर्थ ‘मामला/प्रसंग’ है; ‘मामले’ निकट और स्वाभाविक विकल्प है।
- source_word: אוּרִיָּה הַחִתִּי
  choice: हित्ती ऊरिय्याह
  rationale: व्यक्तिनाम का मानक देवनागरी लिप्यंतरण और जातीय पहचान का सीधा अनुवाद किया गया है।
theological_decisions:
- issue: दाऊद के ज्ञात पापों के बावजूद उसकी आज्ञाकारिता का व्यापक मूल्यांकन
  choice: पद की व्यापक प्रशंसा और उसके स्पष्ट एकमात्र अपवाद—दोनों को बिना नरम किए रखा गया है।
  alternative: यह समझाते हुए भावानुवाद करना कि दाऊद सामान्यतः विश्वासयोग्य था, या उसके पश्चात्ताप के बारे में अतिरिक्त भाषा जोड़ना।
  rationale: मूल पाठ स्वयं व्यापक प्रशंसा के साथ ऊरिय्याह के मामले को अपवाद बताता है; अनुवाद इस धार्मिक तनाव को किसी बाहरी व्याख्या से हल नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, स्पष्ट और सामान्य पाठक के लिए सहज शैली अपनाई गई है। मूल की कारणसूचक संरचना, नैतिक मूल्यांकन, आज्ञाकारिता की समग्रता और स्पष्ट अपवाद सुरक्षित रखे गए हैं।
