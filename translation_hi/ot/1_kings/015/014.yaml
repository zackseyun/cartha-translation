source:
  edition: WLC
  text: וְ/הַ/בָּמ֖וֹת לֹא סָ֑רוּ רַ֣ק לְבַב אָסָ֗א הָיָ֥ה שָׁלֵ֛ם עִם יְהוָ֖ה כָּל יָמָֽי/ו־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/015/014.yaml
  text: But the high places were not removed; nevertheless[a], Asa’s heart was wholly devoted to Yahweh all his days.
translation:
  language: hi
  text: लेकिन ऊँचे स्थान हटाए नहीं गए। फिर भी, आसा का हृदय जीवन भर यहोवा के प्रति पूरी तरह समर्पित रहा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהַבָּמוֹת
  choice: लेकिन ऊँचे स्थान
  rationale: בָּמוֹת स्थानीय उपासना-स्थलों को सूचित करता है। ‘ऊँचे स्थान’ हिन्दी बाइबल-परंपरा में प्रचलित और संक्षिप्त है; आरंभिक וְ को प्रसंगगत विरोध के कारण ‘लेकिन’ से व्यक्त किया गया है।
- source_word: לֹא סָרוּ
  choice: हटाए नहीं गए
  rationale: ऊँचे स्थानों के संदर्भ में סוּר का अर्थ यहाँ चले जाना नहीं, बल्कि सुधार के अंतर्गत हटाया या समाप्त किया जाना है।
- source_word: רַק
  choice: फिर भी
  rationale: यह अव्यय यहाँ ऊँचे स्थान न हटाए जाने और आसा की निष्ठा की पुष्टि के बीच रियायती विरोध प्रकट करता है।
- source_word: לְבַב אָסָא
  choice: आसा का हृदय
  rationale: לְבַב आंतरिक व्यक्ति, इच्छा और निष्ठा को दर्शाता है; हिन्दी में स्वाभाविक संबंधसूचक रचना रखी गई है।
- source_word: שָׁלֵם
  choice: पूरी तरह समर्पित
  rationale: इस वाचा-संबंधी प्रसंग में शब्द निष्पाप सिद्धता के बजाय पूर्ण या अखंड निष्ठा दर्शाता है। यह चयन उसी भाव को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: עִם יְהוָה
  choice: यहोवा के प्रति
  rationale: עִם का शाब्दिक अर्थ ‘के साथ’ है, पर ‘समर्पित’ के साथ हिन्दी में ‘के प्रति’ स्वाभाविक है। परमेश्वर का व्यक्तिगत नाम ‘यहोवा’ रखा गया है।
- source_word: כָּל יָמָיו
  choice: जीवन भर
  rationale: यह כָּל יָמָיו के व्यापक कालगत अर्थ को संक्षिप्त और स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: ऊँचे स्थान बने रहने पर भी आसा के ‘पूर्ण’ हृदय का अर्थ
  choice: पद आसा की मूलभूत और अखंड वाचा-निष्ठा की पुष्टि करता है, न कि निष्पापता या सुधार के हर प्रयास में पूर्ण सफलता की।
  alternative: इसे आसा की हर प्रकार की नैतिक निष्पापता की घोषणा मानना, या तनाव मिटाने के लिए इसे केवल सामान्य प्रशंसा तक कमजोर कर देना।
  rationale: ऊँचे स्थान न हटने और हृदय के שָׁלֵם होने का साथ-साथ उल्लेख वास्तविक तनाव बनाए रखता है। ‘पूरी तरह समर्पित’ निष्ठा को स्पष्ट करता है, पर निष्पाप सिद्धता का दावा नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी, सरल किंतु गरिमापूर्ण शैली। ‘ऊँचे स्थान’ को परिचित धार्मिक-पारिभाषिक अभिव्यक्ति के रूप में रखा गया है। इब्रानी की शाब्दिक अभिव्यक्ति ‘हृदय यहोवा के साथ पूर्ण था’ को स्वाभाविक हिन्दी में अर्थ-सटीक रूप दिया गया है।
