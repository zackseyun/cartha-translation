base_translation:
  language: en
  yaml_path: translation/ot/1_kings/015/012.yaml
  text: He removed the male cult prostitutes from the land[d][c][b][a], and he took away all the idols that his fathers had made.
translation:
  language: hi
  text: उसने देश से धार्मिक वेश्यावृत्ति से जुड़े पुरुषों[a][b] को निकाल दिया और उन सब घृणित मूर्तियों[c] को हटा दिया जिन्हें उसके पूर्वजों[d] ने बनाया था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘देश से दूर कर दिया।’ इब्रानी क्रिया का अर्थ किसी को किसी स्थान से हटाना या निकाल देना हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी קְדֵשִׁים उन पुरुषों को सूचित करता है जो निषिद्ध धार्मिक यौन-प्रथाओं से जुड़े थे। कुछ पुराने अनुवादों के शब्द आधुनिक यौन-पहचान का भ्रामक अर्थ दे सकते हैं।
    reason: lexical_alternative
  - marker: c
    text: ‘मूर्तियों’ के लिए प्रयुक्त इब्रानी शब्द अत्यंत तिरस्कारपूर्ण है; अधिक शाब्दिक रूप में इसमें ‘मल-मूर्तियों’ जैसा भाव हो सकता है।
    reason: lexical_alternative
  - marker: d
    text: या ‘उसके पुरखे’। इब्रानी में ‘उसके पिताओं’ का प्रयोग पिछली पीढ़ियों के लिए होता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲבֵר
  choice: निकाल दिया
  rationale: हिफ़ील रूप यहाँ किसी स्थान से दूर करने या निकाल देने का अर्थ देता है। ‘निकाल दिया’ स्वाभाविक हिन्दी है और מן הארץ के साथ निर्वासन का भाव व्यक्त करता है, पर प्रक्रिया को अनावश्यक रूप से विशिष्ट नहीं बनाता।
- source_word: הַקְּדֵשִׁים
  choice: पुरुष देवदासों
  rationale: यह बहुवचन पुल्लिंग संज्ञा निषिद्ध उपासना से जुड़ी पुरुष यौन भूमिका वाले व्यक्तियों को सूचित करती है। ‘पुरुष देवदास’ हिन्दी में उनके धार्मिक-सांप्रदायिक जुड़ाव और लिंग दोनों को संक्षेप में व्यक्त करता है; आधुनिक पहचान-सूचक शब्द थोपने से बचता है।
- source_word: מִן הָאָרֶץ
  choice: देश से
  rationale: यहाँ הָאָרֶץ से यहूदा का भूभाग या राज्य अभिप्रेत है। आधुनिक हिन्दी में ‘देश से’ सहज है और स्रोत के स्थान-वाचक अर्थ को बनाए रखता है।
- source_word: וַיָּסַר
  choice: हटा दिया
  rationale: स्रोत क्रिया का अर्थ दूर करना या हटा देना है। ‘हटा दिया’ निकटवर्ती पहली क्रिया की अनावश्यक पुनरावृत्ति से बचते हुए उन्मूलन का भाव रखता है।
- source_word: כָּל הַגִּלֻּלִים
  choice: उन सब घृणित मूर्तियों
  rationale: גִּלּוּלִים मूर्तियों के लिए अत्यंत तिरस्कारपूर्ण शब्द है। ‘घृणित मूर्तियाँ’ उसके मूल्यांकनात्मक बल को पठनीय हिन्दी में व्यक्त करता है; शाब्दिक ‘मल-मूर्तियाँ’ मुख्य पाठ में अस्वाभाविक होगा।
- source_word: אֲשֶׁר עָשׂוּ אֲבֹתָיו
  choice: जिन्हें उसके पुरखों ने बनाया था
  rationale: אֲבֹתָיו यहाँ पहले की पुरुष पीढ़ियों या पूर्वजों के लिए प्रयुक्त है। ‘पुरखे’ स्वाभाविक, गरिमापूर्ण हिन्दी है और ‘बाप-दादों’ की अपेक्षा प्रकाशन-पाठ के अनुकूल है।
theological_decisions:
- issue: הַקְּדֵשִׁים की व्याख्या
  choice: पुरुष देवदास
  alternative: मन्दिर के पुरुष वेश्यागामी/पुरुष वेश्याएँ; पवित्र जन
  rationale: सन्दर्भ इसे वैध ‘पवित्र जनों’ के रूप में नहीं, बल्कि निषिद्ध उपासना से संबद्ध पुरुष यौन भूमिका के रूप में समझने का समर्थन करता है। अनुवाद आधुनिक यौन-पहचान की श्रेणी आरोपित नहीं करता।
- issue: אֲבֹתָיו का अनुवाद
  choice: उसके पुरखे
  alternative: उसके पिता; उसके पूर्वज
  rationale: बहुवचन यहाँ पिछली पीढ़ियों का मुहावरेदार संकेत है। ‘पुरखे’ पुरुष पूर्वजों के स्रोत-संकेत को बनाए रखते हुए स्वाभाविक हिन्दी देता है।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट। ‘पुरुष देवदास’ अपेक्षाकृत परिचित धार्मिक-सांस्कृतिक पद है, इसलिए अस्पष्टता घटाने हेतु ‘पुरुष’ स्पष्ट रखा गया है। तिरस्कारपूर्ण גִּלּוּלִים का बल मुख्य पाठ में ‘घृणित’ से और उसका अधिक शाब्दिक रंग पादटिप्पणी में सुरक्षित किया गया है।
