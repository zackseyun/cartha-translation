base_translation:
  language: en
  yaml_path: translation/ot/1_kings/015/024.yaml
  text: And Asa slept with his fathers and was buried with his fathers in the city of David his father[b][a], and Jehoshaphat his son reigned in his place.
translation:
  language: hi
  text: और आसा अपने पुरखाओं के साथ सो गया[a] और अपने पुरखाओं के साथ अपने पूर्वज दाऊद[b] के नगर में दफ़नाया गया। फिर उसका पुत्र यहोशापात उसके स्थान पर राजा बना।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यह मृत्यु के लिए प्रयुक्त इब्रानी का प्रचलित राजकीय मुहावरा है। शाब्दिक अर्थ है, “अपने पुरखाओं के साथ सो गया।”
    reason: cultural_note
  - marker: b
    text: इब्रानी में शाब्दिक रूप से “उसके पिता दाऊद” है। यहाँ “पिता” का अर्थ आसा का राजवंशीय पूर्वज है, उसका जन्मदाता पिता नहीं।
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּשְׁכַּב
  choice: सो गया
  rationale: इब्रानी राजकीय मृत्यु-सूत्र के रूपक को बनाए रखता है; प्रसंग से मृत्यु का अर्थ स्पष्ट है।
- source_word: עִם אֲבֹתָיו
  choice: अपने पुरखाओं के साथ
  rationale: ‘पुरखाओं’ से पूर्वजों का आशय स्वाभाविक आधुनिक हिन्दी में व्यक्त होता है और वंशगत भाव भी बना रहता है।
- source_word: וַיִּקָּבֵר
  choice: दफ़नाया गया
  rationale: निफ़अल क्रिया का निष्क्रिय अर्थ सहज हिन्दी में ठीक प्रकार व्यक्त होता है।
- source_word: בְּעִיר דָּוִד אָבִיו
  choice: अपने पूर्वज दाऊद के नगर में
  rationale: शाब्दिक ‘अपने पिता दाऊद’ आधुनिक पाठक को तत्कालीन पिता का भ्रम दे सकता है; ‘पूर्वज’ इब्रानी אָב के वंशगत प्रयोग को स्पष्ट करता है।
- source_word: וַיִּמְלֹךְ
  choice: राजा हुआ
  rationale: उत्तराधिकार-सूत्र में यह स्वाभाविक हिन्दी है और राजसत्ता ग्रहण करने का आशय व्यक्त करता है।
- source_word: תַּחְתָּיו
  choice: उसके स्थान पर
  rationale: राजकीय उत्तराधिकार और प्रतिस्थापन का अर्थ सटीक रूप से बनाए रखता है।
