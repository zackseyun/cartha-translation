base_translation:
  language: en
  yaml_path: translation/ot/1_kings/015/013.yaml
  text: He also removed Maacah his mother from being queen mother[a], because she had made an abominable image for Asherah[c][b]. Asa cut down her image and burned it in the Kidron Valley.
translation:
  language: hi
  text: उसने अपनी माता माका को भी राजमाता के पद से हटा दिया[a], क्योंकि उसने अशेरा के लिए एक घिनौनी वस्तु[b][c] बनाई थी। आसा ने उस वस्तु को काट डाला और उसे किद्रोन घाटी में जला दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: मूल इब्रानी में ‘उसकी माता’ है; राजवंशीय प्रयोग में यह कभी-कभी दादी या किसी अन्य स्त्री पूर्वज के लिए भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या ‘एक भयावह वस्तु’ अथवा ‘एक घृणित उपासना-वस्तु।’ उस वस्तु का सटीक स्वरूप निश्चित नहीं है।
    reason: lexical_alternative
  - marker: c
    text: ‘अशेरा’ से अशेरा देवी या उसका उपासना-चिह्न अभिप्रेत हो सकता है, जिसे प्रायः ‘अशेरा-स्तंभ’ कहा जाता है।
    reason: alternative_reading
lexical_decisions:
- source_word: וְגַם
  choice: भी
  rationale: यह पिछले पदों में वर्णित सुधारों के साथ इस कार्य का संबंध जोड़ता है; कर्ता को हिन्दी में प्रसंगानुसार ‘उसने’ से व्यक्त किया गया है।
- source_word: מַעֲכָה אִמּוֹ
  choice: अपनी माता माका
  rationale: इब्रानी पाठ का सीधा अर्थ ‘उसकी माता’ है। राजवंशीय प्रयोग में यह दादी या किसी स्त्री पूर्वज के लिए भी हो सकता है, इसलिए मुख्य पाठ में मूल संबंध रखा और टिप्पणी में संभावना बताई गई है।
- source_word: וַיְסִרֶהָ מִגְּבִירָה
  choice: राजमाता के पद से हटा दिया
  rationale: हिफ़ील क्रिया पद से हटाने का भाव देती है और גְּבִירָה राजदरबार की प्रतिष्ठित ‘राजमाता’ को सूचित करती है।
- source_word: אֲשֶׁר עָשְׂתָה
  choice: क्योंकि उसने ... बनाई थी
  rationale: यहाँ संबंधवाचक पद हटाए जाने का कारण बताता है; पूर्वकालिक क्रिया हिन्दी में स्वाभाविक रूप से ‘बनाई थी’ हुई है।
- source_word: מִפְלֶצֶת
  choice: एक घिनौनी मूर्ति
  rationale: शब्द किसी भयावह, विकर्षक या घृणित उपासना-वस्तु को दर्शाता है। ‘घिनौनी’ उसका तीव्र नकारात्मक मूल्यांकन रखता है, जबकि ‘मूर्ति’ प्रसंगानुकूल है; वस्तु का सटीक स्वरूप टिप्पणी में अनिश्चित रखा गया है।
- source_word: לָאֲשֵׁרָה
  choice: अशेरा के लिए
  rationale: लिप्यंतरण से यह अस्पष्टता बनी रहती है कि अशेरा से देवी अभिप्रेत है या उसका उपासना-चिह्न।
- source_word: וַיִּכְרֹת ... אֶת מִפְלַצְתָּהּ
  choice: उसकी मूर्ति को काट डाला
  rationale: כרת का ठोस अर्थ काटना या काट गिराना है। ‘काट डाला’ वस्तु की संभावित काष्ठीय प्रकृति का संकेत देता है, पर उसे निश्चित नहीं करता।
- source_word: וַיִּשְׂרֹף
  choice: उसे ... जला दिया
  rationale: क्रिया ‘जलाना’ का सीधा और स्वाभाविक हिन्दी रूप है।
- source_word: בְּנַחַל קִדְרוֹן
  choice: किद्रोन घाटी में
  rationale: נחל नदी-घाटी, नाला या वादी को सूचित कर सकता है; यरूशलेम के परिचित भौगोलिक स्थान के लिए ‘किद्रोन घाटी’ सहज और पर्याप्त है।
theological_decisions:
- issue: אֲשֵׁרָה का संदर्भ
  choice: ‘अशेरा’ को बिना व्याख्यात्मक विस्तार के रखा गया
  alternative: ‘अशेरा देवी’ या ‘अशेरा-स्तंभ’
  rationale: इब्रानी शब्द देवी अथवा उसके उपासना-चिह्न की ओर संकेत कर सकता है। पद में निर्मित वस्तु का अलग उल्लेख होने के कारण किसी एक अर्थ को निश्चित करना मूल की अस्पष्टता को अनावश्यक रूप से मिटा देता।
- issue: מִפְלֶצֶת का स्वरूप
  choice: ‘घिनौनी मूर्ति’
  alternative: ‘भयावह वस्तु’, ‘अश्लील प्रतिमा’ या ‘घृणित उपासना-वस्तु’
  rationale: पाठ उस वस्तु का ठीक स्वरूप स्पष्ट नहीं करता। मुख्य पाठ में स्वाभाविक धार्मिक-सांस्कृतिक शब्द रखा गया है और टिप्पणी में अनिश्चितता स्पष्ट की गई है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘राजमाता के पद’ संस्थागत अर्थ स्पष्ट करता है; ‘घिनौनी मूर्ति’ सामान्य पाठक के लिए बोधगम्य है, जबकि टिप्पणियाँ मूल पाठ की वंशावली और उपासना-वस्तु संबंधी अस्पष्टताओं को सुरक्षित रखती हैं।
