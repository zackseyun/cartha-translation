  text: In the twentieth year of Jeroboam king of Israel[b][a], Asa became king over Judah.
translation:
  language: hi
  text: इस्राएल के राजा यारोबाम के शासन के बीसवें वर्ष में, आसा यहूदा का राजा बना।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/בִ/שְׁנַת עֶשְׂרִים
  choice: बीसवें वर्ष में
  rationale: यह राजकीय कालगणना का प्रचलित सूत्र है। मूल में संख्या अक्षरशः ‘बीस’ है, पर यहाँ उसका क्रमवाचक अर्थ ‘बीसवाँ’ स्वाभाविक है; आरंभिक ו को हिन्दी कथा-प्रवाह में अलग से ‘और’ कहना आवश्यक नहीं।
- source_word: לְ/יָרָבְעָם מֶלֶךְ יִשְׂרָאֵל
  choice: इस्राएल के राजा यारोबाम के शासन के
  rationale: לְ उस राजा के शासनकाल को वर्ष-गणना का संदर्भ बनाता है। हिन्दी में केवल ‘यारोबाम के बीसवें वर्ष’ की अपेक्षा ‘यारोबाम के शासन के बीसवें वर्ष’ अधिक स्पष्ट और स्वाभाविक है।
- source_word: מָלַךְ
  choice: राजा बना
  rationale: राज्यारोहण-सूत्र में यह क्रिया शासन की पूरी अवधि के बजाय राजपद ग्रहण करने को सूचित करती है; ‘राजा बना’ आधुनिक हिन्दी में इसे संक्षेप और स्पष्टता से व्यक्त करता है।
- source_word: אָסָא
  choice: आसा
  rationale: इब्रानी व्यक्तिगत नाम का प्रचलित हिन्दी लिप्यंतरण।
- source_word: מֶלֶךְ יְהוּדָה
  choice: यहूदा का राजा
  rationale: इब्रानी संबंध-संरचना का सीधा और स्वाभाविक हिन्दी रूप; इससे आसा के राज्य-क्षेत्र का बोध होता है।
