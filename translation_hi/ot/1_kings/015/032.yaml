lexical_decisions:
- source_word: וּ/מִלְחָמָה הָיְתָה
  choice: और ... युद्ध होता रहा
  rationale: वाव कथा-संबंध को ‘और’ से बनाए रखता है। הָיְתָה मूलतः अस्तित्वसूचक है; ‘युद्ध होता रहा’ प्रसंग में दीर्घकालीन शत्रुता को स्वाभाविक हिन्दी में व्यक्त करता है, बिना इसे निरंतर युद्ध-अभियान मानने के लिए बाध्य किए।
- source_word: בֵּין ... וּ/בֵין
  choice: के बीच
  rationale: दोनों पक्षों के संबंध को आधुनिक मानक हिन्दी में स्वाभाविक रूप से व्यक्त करता है।
- source_word: אָסָא
  choice: आसा
  rationale: व्यक्तिनाम का प्रचलित हिन्दी बाइबलीय लिप्यंतरण।
- source_word: בַּעְשָׁא
  choice: बाशा
  rationale: व्यक्तिनाम का प्रचलित हिन्दी बाइबलीय लिप्यंतरण।
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: इस्राएल के राजा
  rationale: यह संबंधवाचक पद बाशा की पहचान बताता है; हिन्दी में नाम से पहले रखना अधिक सहज है।
- source_word: כָּל יְמֵי/הֶם
  choice: उनके जीवन भर
  rationale: शाब्दिक अर्थ ‘उनके सभी दिन’ है; हिन्दी मुहावरे में ‘उनके जीवन भर’ उसी व्यापक कालगत अर्थ को स्पष्ट और स्वाभाविक रूप से पहुँचाता है।
