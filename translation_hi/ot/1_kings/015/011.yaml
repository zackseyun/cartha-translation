base_translation:
  language: en
  yaml_path: translation/ot/1_kings/015/011.yaml
  text: Asa did what was right in the eyes of Yahweh[a], as David his father had done.
translation:
  language: hi
  text: आसा ने वह किया जो याहवे की दृष्टि में सही था, जैसा उसके पूर्वज दाऊद ने किया था।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “उसके पिता दाऊद।” यहाँ “पिता” वंशगत पूर्वज के अर्थ में है, न कि आसा के तत्काल पिता के अर्थ में।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: ने ... किया
  rationale: עָשָׂה का सामान्य अर्थ ‘करना’ है; राजाओं के नैतिक मूल्यांकन के इस सूत्र में ‘वही किया जो ... सही था’ स्वाभाविक हिन्दी है।
- source_word: אָסָא
  choice: आसा
  rationale: व्यक्तिनाम का प्रचलित हिन्दी लिप्यंतरण।
- source_word: הַיָּשָׁר
  choice: जो ... सही था
  rationale: יָשָׁר का अर्थ ‘सीधा, सही, खरा’ है। इस वाक्य-विन्यास में ‘जो सही था’ नैतिक मूल्यांकन को सहज हिन्दी में व्यक्त करता है।
- source_word: בְּעֵינֵי
  choice: की दृष्टि में
  rationale: इब्रानी मुहावरे ‘की आँखों में’ का स्वाभाविक और गरिमापूर्ण हिन्दी रूप, जो मूल्यांकन के दृष्टिकोण को बनाए रखता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: परमेश्वर के व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय हिन्दी में प्रचलित रूप ‘यहोवा’ से प्रस्तुत किया गया है।
- source_word: כְּדָוִד
  choice: जैसा ... दाऊद ने
  rationale: उपसर्ग כְּ तुलना दर्शाता है; हिन्दी में ‘जैसा ... ने’ पहले खंड की क्रिया को स्वाभाविक रूप से दोहराता है।
- source_word: אָבִיו
  choice: उसके पूर्वज
  rationale: אָב का अर्थ पिता के साथ-साथ पूर्वज भी हो सकता है। दाऊद आसा का तत्कालीन पिता नहीं था, इसलिए अर्थ स्पष्ट करने के लिए ‘पूर्वज’ चुना गया है।
theological_decisions:
- issue: יְהוָה परमेश्वर के नाम का अनुवाद
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: मूल पाठ में व्यक्तिगत दिव्य नाम है। ‘यहोवा’ आधुनिक हिन्दी बाइबलीय प्रयोग में व्यापक रूप से पहचाना जाने वाला लिप्यंतरण है और इसे उपाधि में नहीं बदलता।
- issue: ‘दाऊद उसका पिता’ में אָב का आशय
  choice: उसके पूर्वज दाऊद
  alternative: उसके पिता दाऊद
  rationale: वंशगत राजकीय भाषा में ‘पिता’ दूरस्थ पुरखे को भी सूचित करता है। ‘पूर्वज’ ऐतिहासिक संबंध को स्पष्ट करता है और गलत तत्कालीन पितृत्व से बचाता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और सार्वजनिक पाठ के अनुकूल। इब्रानी दृष्टि-मुहावरे को शाब्दिक ‘आँखों में’ के बजाय स्वाभाविक ‘दृष्टि में’ रखा गया है।
