base_translation:
  language: en
  yaml_path: translation/ot/1_kings/015/015.yaml
  text: And he brought into the house of Yahweh the holy things of his father and his own holy things[a], silver and gold and vessels.
translation:
  language: hi
  text: और वह अपने पिता की पवित्र वस्तुएँ और अपनी पवित्र वस्तुएँ[a]—चाँदी, सोना और पात्र—याहवे के भवन में ले आया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अपने पिता की समर्पित वस्तुएँ और अपनी समर्पित वस्तुएँ।”
    reason: קדשׁ यहाँ पवित्र उपयोग के लिए अलग रखी या समर्पित की गई वस्तुओं को सूचित करता है; ‘पवित्र’ और ‘समर्पित’ दोनों इस अर्थ को व्यक्त कर सकते हैं।
lexical_decisions:
- source_word: וַיָּבֵא
  choice: ले आया
  rationale: हिफ़ील रूप का अर्थ यहाँ किसी वस्तु को निर्दिष्ट स्थान में लाना है; गंतव्य स्पष्ट होने से यह सहज और सटीक है।
- source_word: קָדְשֵׁי אָבִיו
  choice: अपने पिता की पवित्र की हुई वस्तुएँ
  rationale: यह पद उन वस्तुओं को सूचित करता है जिन्हें पवित्र उपयोग के लिए अलग या समर्पित किया गया था; यह अनुवाद वस्तुओं के स्वरूप को अनावश्यक रूप से सीमित नहीं करता।
- source_word: וְקָדְשׁוֹ
  choice: और अपनी पवित्र की हुई वस्तुएँ
  rationale: एकवचन रूप सामूहिक अर्थ में राजा की अपनी समर्पित वस्तुओं को दर्शाता है और पिछले पदांश के समानांतर रखा गया है।
- source_word: בֵּית יְהוָה
  choice: याहवे के भवन में
  rationale: ‘भवन’ हिब्रू ‘घर’ की अभिव्यक्ति को बनाए रखते हुए इस प्रसंग में पवित्रस्थान के लिए स्वाभाविक है।
- source_word: יְהוָה
  choice: याहवे
  rationale: व्यक्तिगत वाचा-नाम को उपाधि से बदलने के बजाय लिप्यंतरित किया गया है।
- source_word: כֶּסֶף וְזָהָב וְכֵלִים
  choice: चाँदी, सोना और पात्र
  rationale: ये शब्द संभवतः पवित्र की हुई वस्तुओं का विवरण देते हैं; ‘पात्र’ मंदिर-संदर्भ में כֵלִים का व्यापक और प्रचलित अनुवाद है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में वाचा-नाम सीधे आया है; ‘याहवे’ उसे नाम के रूप में सुरक्षित रखता है और उसे किसी उपाधि में नहीं बदलता।
- issue: समर्पित वस्तुओं के लिए קדשׁ का अर्थ
  choice: पवित्र की हुई वस्तुएँ
  alternative: समर्पित वस्तुएँ
  rationale: यहाँ शब्द अमूर्त पवित्रता नहीं, पवित्र उपयोग के लिए अलग की गई वस्तुओं को दर्शाता है। मुख्य पाठ मूल की धार्मिक शब्दावली रखता है, जबकि पादटिप्पणी उसका क्रियात्मक अर्थ स्पष्ट करती है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण रूप। ‘पवित्र की हुई वस्तुएँ’ मूल के समानांतर पदबंध को बनाए रखता है; डैश से ‘चाँदी, सोना और पात्र’ को उन्हीं वस्तुओं के विवरण के रूप में स्पष्ट किया गया है।
