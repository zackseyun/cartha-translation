lexical_decisions:
- source_word: וּ/מִלְחָמָה הָיְתָה
  choice: युद्ध होता रहा
  rationale: מִלְחָמָה का अर्थ ‘युद्ध’ है। היה का रूप मूलतः ‘था/हुआ’ व्यक्त करता है, पर अवधि बताने वाले वाक्यांश के साथ हिन्दी में ‘होता रहा’ निरंतर संघर्ष को स्वाभाविक ढंग से व्यक्त करता है। आरंभिक ו को अलग से ‘और’ कहना हिन्दी में आवश्यक नहीं, क्योंकि पद स्वयं पूर्ववर्ती वृत्तांत से जुड़ा है।
- source_word: בֵין רְחַבְעָם וּ/בֵין יָרָבְעָם
  choice: रहूबियाम और यारोबाम के बीच
  rationale: दोहराया हुआ בֵין दोनों पक्षों को चिह्नित करता है; आधुनिक हिन्दी में स्वाभाविक क्रम ‘क और ख के बीच’ है। नामों को प्रचलित हिन्दी बाइबल वर्तनी में लिप्यंतरित किया गया है।
- source_word: כָּל יְמֵי חַיָּיו
  choice: उसके जीवन भर
  rationale: यह इब्रानी मुहावरा पूरी जीवन-अवधि बताता है। ‘उसके’ पुल्लिंग एकवचन प्रत्यय की संदर्भगत अस्पष्टता को बनाए रखता है और किसी नाम को मुख्य पाठ में नहीं जोड़ता।
theological_decisions:
- issue: ‘उसके जीवन भर’ में सर्वनाम का संदर्भ
  choice: मुख्य पाठ में केवल ‘उसके’ रखा गया है
  alternative: ‘रहूबियाम के जीवन भर’ अथवा संदर्भगत/पाठालोचनात्मक विचार से ‘अबिय्याम के जीवन भर’
  rationale: इब्रानी में पुल्लिंग एकवचन प्रत्यय है, पर इसी उपवाक्य में उसका संदर्भ स्पष्ट रूप से नहीं बताया गया। इसलिए मुख्य पाठ मूल की अस्पष्टता बनाए रखता है; संभावित संदर्भ पादटिप्पणी में दिए गए हैं।
translation_notes:
  register: भाषा आधुनिक, सरल और गरिमापूर्ण रखी गई है। ‘युद्ध होता रहा’ सामान्य हिन्दी में दीर्घकालीन वैर को स्पष्ट करता है, जबकि सर्वनाम की वास्तविक अस्पष्टता सुरक्षित रहती है।
