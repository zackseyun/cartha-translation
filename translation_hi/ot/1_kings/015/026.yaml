source:
  edition: WLC
  text: וַ/יַּ֥עַשׂ הָ/רַ֖ע בְּ/עֵינֵ֣י יְהוָ֑ה וַ/יֵּ֨לֶךְ֙ בְּ/דֶ֣רֶךְ אָבִ֔י/ו וּ֨/בְ/חַטָּאת֔/וֹ אֲשֶׁ֥ר הֶחֱטִ֖יא אֶת יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/015/026.yaml
  text: He did what was evil in the sight of Yahweh and walked in the way of his father and in his sin with which he caused Israel to sin.
translation:
  language: hi
  text: उसने याहवे की दृष्टि में बुराई की और अपने पिता के मार्ग पर चला तथा उसके उस पाप का अनुसरण किया, जिसके द्वारा उसके पिता ने इस्राएल से पाप कराया था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַשׂ הָרַע
  choice: उसने ... बुरा किया
  rationale: राजाओं के आकलन में प्रयुक्त इस सूत्रबद्ध इब्रानी अभिव्यक्ति का सीधा और स्वाभाविक हिन्दी रूप।
- source_word: בְּעֵינֵי יְהוָה
  choice: याहवे की दृष्टि में
  rationale: इब्रानी के मूल्यांकन-संबंधी मुहावरे को स्वाभाविक हिन्दी में रखते हुए परमेश्वर के व्यक्तिगत नाम को लिप्यंतरित किया गया है।
- source_word: וַיֵּלֶךְ בְּדֶרֶךְ אָבִיו
  choice: अपने पिता के मार्ग पर ... चला
  rationale: नैतिक आचरण के लिए प्रयुक्त ‘मार्ग पर चलने’ के मूल रूपक को सुरक्षित रखता है।
- source_word: וּבְחַטָּאתוֹ
  choice: तथा उसके उस पाप में
  rationale: एकवचन संज्ञा और तृतीय पुरुष प्रत्यय को बनाए रखता है तथा पिता से जुड़े विशिष्ट पाप की ओर संकेत करता है।
- source_word: אֲשֶׁר הֶחֱטִיא אֶת יִשְׂרָאֵל
  choice: जिसके द्वारा उसने इस्राएल से पाप कराया था
  rationale: חטא के हिफ़ील रूप की कारणवाचक शक्ति को स्पष्ट करता है और संबंधवाचक उपवाक्य को पिछले ‘पाप’ से जोड़ता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा / प्रभु
  rationale: मूल पाठ में व्यक्तिगत वाचा-नाम है; ‘याहवे’ उसका निकट हिन्दी लिप्यंतरण है और उसे किसी उपाधि से प्रतिस्थापित नहीं करता।
- issue: ‘उसके/उसने’ का संदर्भ
  choice: मूल के सर्वनामात्मक रूप को बनाए रखा
  alternative: ‘उसके पिता के उस पाप... जिसके द्वारा उसके पिता ने...’ कहकर संदर्भ स्पष्ट करना
  rationale: संदर्भ पिता की ओर संकेत करता है, पर इब्रानी पाठ नाम को दोहराता नहीं; हिन्दी में सर्वनाम बनाए रखने से मूल की संक्षिप्तता और संभावित संदर्भगत तनाव सुरक्षित रहता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘मार्ग पर चलना’ मूल नैतिक रूपक को बनाए रखता है; ‘पाप कराया’ कारणवाचक अर्थ को संक्षेप में व्यक्त करता है।
