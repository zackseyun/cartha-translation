  text: וַ/יֵּ֕לֶךְ בְּ/כָל חַטֹּ֥אות אָבִ֖י/ו אֲשֶׁר עָשָׂ֣ה לְ/פָנָ֑י/ו וְ/לֹא הָיָ֨ה לְבָב֤/וֹ שָׁלֵם֙ עִם יְהוָ֣ה אֱלֹהָ֔י/ו כִּ/לְבַ֖ב דָּוִ֥ד אָבִֽי/ו־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/015/003.yaml
  text: He walked in all the sins of his father that he had committed before him[a], and his heart was not wholly devoted to Yahweh his God[c][b], like the heart of David his father.
translation:
  language: hi
  text: वह अपने पिता के उन सभी पापों की राह पर चला, जो उसके पिता ने उससे पहले किए थे[a]। उसका हृदय अपने परमेश्वर यहोवा के प्रति पूरी तरह समर्पित नहीं था[b][c], जैसा उसके पूर्वज दाऊद का हृदय था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “उससे पहले” का अर्थ “उसके सामने” या “उसकी उपस्थिति में” भी हो सकता है; मूल शब्द में समय और उपस्थिति, दोनों की छाया सम्भव है।
    reason: lexical_alternative
  - marker: b
    text: या, “उसका हृदय अपने परमेश्वर यहोवा के प्रति पूरी तरह निष्ठावान नहीं था।”
    reason: alternative_reading
  - marker: c
    text: मूल इब्रानी में YHWH, परमेश्वर का व्यक्तिगत नाम; इसे परम्परागत रूप से “प्रभु” भी लिखा जाता है।
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֵּלֶךְ בְּכָל חַטֹּאות
  choice: उन सभी पापों की राह पर चला
  rationale: הלך בְּ नैतिक आचरण को व्यक्त करता है। हिन्दी में केवल ‘पापों में चला’ अस्वाभाविक है; ‘पापों की राह पर चला’ मूल के चलने वाले रूपक और आचरण के अर्थ दोनों को सुरक्षित रखता है।
- source_word: אָבִיו אֲשֶׁר עָשָׂה לְפָנָיו
  choice: अपने पिता के उन सभी पापों... जो उसने उससे पहले किए थे
  rationale: सम्बन्धवाचक उपवाक्य पिता द्वारा किए गए पापों की ओर संकेत करता है। ‘उससे पहले’ לְפָנָיו के समयगत अर्थ को मुख्य पाठ में स्वाभाविक हिन्दी देता है, जबकि उपस्थितिगत सम्भावना पादटिप्पणी में रखी गई है।
- source_word: לְבָבוֹ שָׁלֵם
  choice: उसका हृदय... पूरी तरह समर्पित नहीं था
  rationale: שָׁלֵם यहाँ निष्पाप सिद्धता नहीं, बल्कि अखंड निष्ठा और पूर्ण समर्पण दर्शाता है। यह हिन्दी वाक्य उस वाचा-संबंधी आशय को स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
- source_word: עִם יְהוָה אֱלֹהָיו
  choice: अपने परमेश्वर यहोवा के प्रति
  rationale: עִם का शाब्दिक अर्थ ‘के साथ’ है, पर ‘समर्पित’ के साथ हिन्दी में ‘के प्रति’ स्वाभाविक है। יְהוָה को निजी नाम ‘यहोवा’ के रूप में रखा गया है।
- source_word: כִּלְבַב דָּוִד אָבִיו
  choice: जैसा उसके पूर्वज दाऊद का हृदय था
  rationale: राजवंशीय वंशावली में אָבִיו दूरस्थ पूर्वज दाऊद को दर्शाता है; हिन्दी में ‘पूर्वज’ तत्काल जैविक पिता की गलत समझ से बचाता है। तुलना विशेष रूप से दोनों के हृदयों के बीच है, इसलिए ‘हृदय’ दोहराया गया है।
theological_decisions:
- issue: שָׁלֵם हृदय का आशय
  choice: पूरी तरह समर्पित
  alternative: पूरी तरह निष्ठावान; खरा/सम्पूर्ण हृदय
  rationale: सन्दर्भ दाऊद से तुलना करते हुए अखंड ईश्वर-निष्ठा का मूल्यांकन करता है, पापरहित पूर्णता का दावा नहीं।
- issue: יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: मूल में परमेश्वर का व्यक्तिगत वाचा-नाम है। आधुनिक हिन्दी बाइबलीय प्रयोग में ‘यहोवा’ व्यापक रूप से पहचाना जाता है और नाम को उपाधि से नहीं बदलता।
- issue: דָּוִד אָבִיו में אָב का सम्बन्ध
  choice: उसके पूर्वज दाऊद
  alternative: उसके पिता दाऊद
  rationale: यहाँ दाऊद उसका तत्काल पिता नहीं, राजवंशीय पूर्वज है। ‘पूर्वज’ हिब्रू אָב की व्यापक वंशगत अर्थ-सीमा को सन्दर्भानुकूल व्यक्त करता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सहज किन्तु गरिमापूर्ण बाइबलीय शैली। ‘पापों की राह पर चला’ मूल के नैतिक ‘चलने’ के रूपक को स्वाभाविक हिन्दी में रखता है। ‘पूर्वज दाऊद’ ऐतिहासिक सम्बन्ध स्पष्ट करता है।
