  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: כִּ֚י לְמַ֣עַן דָּוִ֔ד נָתַן֩ יְהוָ֨ה אֱלֹהָ֥י/ו ל֛/וֹ נִ֖יר בִּ/ירוּשָׁלִָ֑ם לְ/הָקִ֤ים אֶת בְּנ/וֹ֙ אַחֲרָ֔י/ו וּֽ/לְ/הַעֲמִ֖יד אֶת יְרוּשָׁלִָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/015/004.yaml
  text: Nevertheless[a], for David’s sake Yahweh his God gave him a lamp in Jerusalem, to raise up his son after him and to establish Jerusalem.
translation:
  language: hi
  text: फिर भी[a] दाऊद के कारण उसके परमेश्वर यहोवा ने उसे यरूशलेम में एक दीपक दिया, उसके बाद उसके पुत्र को खड़ा करने और यरूशलेम को कायम रखने के लिए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से “दीपक दिया।” यहाँ “दीपक” यरूशलेम में दाऊद के राजवंश को बनाए रखने का रूपक है; इसका अर्थ “ज्योति” भी हो सकता है।
    reason: नִיר के रूपकात्मक आशय और उसके वैकल्पिक शाब्दिक अर्थ को स्पष्ट करना।
lexical_decisions:
- source_word: כִּי
  choice: फिर भी
  rationale: पिछले पद में अबियाम के पाप के बावजूद उसके वंश को न मिटाने की बात समझाई गई है; इसलिए यहाँ प्रसंगगत विरोध-सूचक भाव को व्यक्त किया गया है।
- source_word: לְמַעַן דָּוִד
  choice: दाऊद के कारण
  rationale: यह पदबंध बताता है कि परमेश्वर ने दाऊद का लिहाज़ करके अथवा उसके कारण यह कार्य किया।
- source_word: יְהוָה
  choice: यहोवा
  rationale: इब्रानी व्यक्तिगत ईश्वरीय नाम को हिन्दी में उसके प्रचलित लिप्यंतरण से रखा गया है।
- source_word: אֱלֹהָיו
  choice: उसके परमेश्वर
  rationale: सर्वनाम को निकटवर्ती प्रसंग के राजा अबियाम से जोड़ा गया है, पर हिन्दी में भी मूल की तरह उसे नाम लेकर स्पष्ट नहीं किया गया।
- source_word: נָתַן ... לוֹ נִיר
  choice: उसका एक दीपक बनाए रखा
  rationale: नָתַן का मूल अर्थ 'दिया' है, पर यहाँ दीपक रूपक का आशय दाऊद के राजवंश को जारी रखना है। 'बनाए रखा' प्राकृतिक हिन्दी में इस प्रसंगगत अर्थ को व्यक्त करते हुए 'दीपक' रूपक को सुरक्षित रखता है।
- source_word: בִּירוּשָׁלָם
  choice: यरूशलेम में
  rationale: स्थानवाचक ב का स्वाभाविक हिन्दी रूप।
- source_word: לְהָקִים אֶת בְּנוֹ אַחֲרָיו
  choice: ताकि उसके बाद उसके पुत्र को खड़ा करे
  rationale: हिफ़ील क्रिया और उत्तराधिकार-सूचक पदबंध को निकटता से रखा गया है; 'खड़ा करे' पुत्र को उत्तराधिकारी के रूप में स्थापित करने का भाव देता है।
- source_word: וּלְהַעֲמִיד אֶת יְרוּשָׁלָם
  choice: और यरूशलेम को स्थिर रखे
  rationale: עמד के कारक रूप में किसी को खड़ा या कायम रखने का भाव है। यहाँ यरूशलेम को राजकीय केंद्र के रूप में बनाए रखने का आशय है।
theological_decisions:
- issue: נִיר रूपक और दाऊदी वाचा
  choice: मुख्य पाठ में 'दीपक' रूपक बनाए रखा
  alternative: वंश; राजवंश; ज्योति
  rationale: मूल पाठ दाऊद के चलते रहने वाले राजवंश को ठोस रूपक से व्यक्त करता है। उसे 'वंश' कह देने से बिंब और अन्य दाऊदी पाठों से उसका संबंध मिट जाता।
- issue: '''उसके परमेश्वर'' में सर्वनाम का संदर्भ'
  choice: प्रसंग में अबियाम की ओर संकेत, पर मुख्य पाठ में अस्पष्टता सुरक्षित
  alternative: दाऊद के परमेश्वर
  rationale: निकटवर्ती संदर्भ वर्तमान राजा का है और वाक्य बताता है कि दाऊद के कारण परमेश्वर ने उसके प्रति क्या किया। मूल की सर्वनामगत संक्षिप्तता हिन्दी में भी रखी गई है।
- issue: यरूशलेम को स्थिर रखने का आशय
  choice: नगर का नाम मुख्य पाठ में यथावत रखा
  alternative: दाऊदी राज्य को स्थिर रखे
  rationale: नगर यहाँ उससे केंद्रित राज्य का लक्षणार्थक संकेत हो सकता है, फिर भी मूल में सीधे यरूशलेम ही कर्म है; अनुवाद उस धर्मवैचारिक अर्थ को पाठ में प्रतिस्थापित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण रूप अपनाया गया है। 'यहोवा', 'दाऊद' और 'यरूशलेम' परिचित बाइबलीय नामरूप हैं। उद्देश्यसूचक इब्रानी infinitives को 'ताकि ... करे' से व्यक्त किया गया है; 'दीपक' के असामान्य पर महत्वपूर्ण मूल रूपक को फुटनोट सहित रखा गया है।
