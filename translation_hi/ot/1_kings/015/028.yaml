    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְמִתֵהוּ
  choice: उसे मार डाला
  rationale: מות के हिफ़ील रूप का अर्थ ‘मरवा देना/मृत्यु का कारण बनना’ है। इस राजकीय हत्या के प्रसंग में ‘मार डाला’ स्वाभाविक, स्पष्ट और गंभीर आधुनिक हिन्दी है; अधिक अक्षरशः विकल्प पादटिप्पणी में दिया गया है।
- source_word: בַעְשָׁא
  choice: बाशा
  rationale: व्यक्तिवाचक नाम का प्रचलित हिन्दी लिप्यंतरण।
- source_word: בִּשְׁנַת שָׁלֹשׁ
  choice: तीसरे वर्ष में
  rationale: राज्यकाल की गणना बताने वाले मानक कालवाचक सूत्र का सीधा और स्वाभाविक अनुवाद।
- source_word: לְאָסָא מֶלֶךְ יְהוּדָה
  choice: यहूदा के राजा आसा के
  rationale: राज्य-वर्ष के संदर्भ-बिंदु और आसा की उपाधि को स्पष्ट, स्वाभाविक हिन्दी क्रम में व्यक्त करता है।
- source_word: וַיִּמְלֹךְ
  choice: राजा बन गया
  rationale: यहाँ מלך उत्तराधिकार के प्रसंग में शासन आरम्भ करने या राजा बनने को दर्शाता है। ‘राजा बन गया’ अगले पदबंध के साथ हिन्दी में ‘राज्य करने लगा’ की अपेक्षा अधिक सहज है।
- source_word: תַּחְתָּיו
  choice: उसके स्थान पर
  rationale: תחת प्रत्यय सहित प्रतिस्थापन और राजकीय उत्तराधिकार दर्शाता है; ‘उसके स्थान पर’ अर्थ को स्पष्ट रूप से सुरक्षित रखता है।
