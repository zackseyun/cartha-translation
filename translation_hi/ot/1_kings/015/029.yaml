base_translation:
  language: en
  yaml_path: translation/ot/1_kings/015/029.yaml
  text: And when he became king[a], he struck down all the house of Jeroboam. He did not leave to Jeroboam a single living thing, until he had destroyed him[b], according to the word of Yahweh that he had spoken by the hand of his servant Ahijah the Shilonite.
translation:
  language: hi
  text: जब वह राजा बना, तब उसने यारोबाम के पूरे घराने को मार डाला। उसने यारोबाम के घराने का एक भी व्यक्ति जीवित नहीं छोड़ा[a], जब तक कि उसने उसे पूरी तरह नष्ट नहीं कर दिया[b]। यह याहवे के उस वचन के अनुसार हुआ, जो उसने अपने सेवक शीलोवासी अहिय्याह के द्वारा कहा था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “एक भी साँस”; अर्थात उसने किसी को जीवित नहीं छोड़ा।
    reason: lexical_alternative
  - marker: b
    text: या “जब तक कि उसने उस घराने को पूरी तरह नष्ट नहीं कर दिया।” इब्रानी में एकवचन पुल्लिंग सर्वनाम औपचारिक रूप से “उसे” है; प्रसंग में यह यारोबाम अथवा उसके घराने को सामूहिक रूप में सूचित कर सकता है।
    reason: referential_ambiguity
lexical_decisions:
- source_word: וַיְהִי כְמָלְכוֹ
  choice: जब वह राजा बना
  rationale: हिब्रू कथात्मक सूत्र और कालसूचक כְ־ को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है तथा राजगद्दी सँभालने के प्रसंग के अनुकूल है।
- source_word: הִכָּה אֶת כָּל בֵּית יָרָבְעָם
  choice: उसने यारोबाम के पूरे घराने को मार डाला
  rationale: נכה यहाँ घातक प्रहार को सूचित करता है। ‘घराना’ राजवंश और विस्तृत परिवार, दोनों का भाव बनाए रखता है।
- source_word: לֹא הִשְׁאִיר כָּל נְשָׁמָה לְיָרָבְעָם
  choice: उसने यारोबाम के लिए एक भी प्राणी जीवित नहीं छोड़ा
  rationale: नְשָׁמָה का मूल संबंध साँस से है, पर यहाँ मुहावरे का अर्थ किसी जीवित व्यक्ति को न छोड़ना है। לְ का संबंधसूचक भाव ‘यारोबाम के लिए’ द्वारा रखा गया है।
- source_word: עַד הִשְׁמִידוֹ
  choice: जब तक कि उसने उसे पूरी तरह मिटा न दिया
  rationale: एकवचन पुल्लिंग प्रत्यय को ‘उसे’ से सुरक्षित रखा गया है; इसका संकेत यारोबाम अथवा सामूहिक रूप से उसके घराने की ओर हो सकता है।
- source_word: כִּדְבַר יְהוָה
  choice: यह याहवे के उस वचन के अनुसार हुआ
  rationale: यह पूर्ति-सूत्र है। वाक्य को आधुनिक हिन्दी में स्पष्ट बनाने के लिए ‘हुआ’ जोड़ा गया है, जबकि स्रोत का आशय यथावत है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को उपाधि से बदलने के बजाय हिन्दी लिप्यंतरण में रखा गया है।
- source_word: אֲשֶׁר דִּבֶּר בְּיַד עַבְדּוֹ
  choice: जो उसने अपने सेवक ... के द्वारा कहा था
  rationale: בְיַד का शाब्दिक अर्थ ‘के हाथ से’ है, पर भविष्यद्वाणी के माध्यम को आधुनिक, स्वाभाविक हिन्दी में ‘के द्वारा’ व्यक्त किया गया है।
- source_word: אֲחִיָּה הַשִּׁילֹנִי
  choice: शीलोवासी अहिय्याह
  rationale: व्यक्तिनाम और शीलो से संबंध बतानेवाले विशेषण का प्रचलित हिन्दी रूप अपनाया गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में व्यक्तिगत वाचा-नाम है। ‘याहवे’ उसका निकट हिन्दी लिप्यंतरण है और उसे किसी उपाधि में नहीं बदलता।
- issue: עַד הִשְׁמִידוֹ में एकवचन सर्वनाम का संदर्भ
  choice: अस्पष्ट ‘उसे’ को मुख्य पाठ में बनाए रखना
  alternative: उस घराने को पूरी तरह मिटा देना
  rationale: व्याकरणिक प्रत्यय पुल्लिंग एकवचन है, पर प्रसंग में यारोबाम का घराना सामूहिक इकाई के रूप में अभिप्रेत हो सकता है। मुख्य पाठ और पादटिप्पणी इस वास्तविक अस्पष्टता को सुरक्षित रखते हैं।
