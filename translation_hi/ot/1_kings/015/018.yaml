  yaml_path: translation/ot/1_kings/015/018.yaml
  text: Then Asa took all the silver and the gold that remained in the treasuries of the house of Yahweh and in the treasuries of the king’s house[a], and put them into the hand of his servants. Then King Asa sent them to Ben-hadad son of Tabrimmon, son of Hezion, king of Aram, who lived in Damascus, saying[b],
translation:
  language: hi
  text: 'तब आसा ने यहोवा के भवन के भंडारों और राजभवन[a] के भंडारों में बची हुई सारी चाँदी और बचा हुआ सारा सोना लिया और उसे अपने सेवकों के हाथ में सौंप दिया। फिर राजा आसा ने उसे अराम[b] के राजा बेन-हदद के पास भेजा, जो ताब्रिम्मोन का पुत्र था और ताब्रिम्मोन हेज्योन का पुत्र था; वह दमिश्क में रहता था। आसा ने यह संदेश भेजा:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से “राजा का भवन”; या, “राजा का महल।”
    reason: lexical_alternative
  - marker: b
    text: पारंपरिक अनुवाद में “सीरिया।”
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּקַּח
  choice: तब आसा ने ... लिया
  rationale: वाव-क्रमागत कथा को आगे बढ़ाता है; ‘तब’ स्वाभाविक हिन्दी में घटनाक्रम व्यक्त करता है।
- source_word: כָּל הַכֶּסֶף וְהַזָּהָב הַנּוֹתָרִים
  choice: बची हुई सारी चाँदी और सोना
  rationale: כָּל की समग्रता और הַנּוֹתָרִים के शेष बचे होने का भाव स्पष्ट और स्वाभाविक हिन्दी में सुरक्षित है।
- source_word: בְּאֹצְרוֹת בֵּית יְהוָה
  choice: यहोवा के भवन के भंडारों में
  rationale: אֹצָרוֹת बहुमूल्य धातुओं के संदर्भ में ‘भंडार’ है; בֵּית יְהוָה को निकट रूप में ‘यहोवा का भवन’ रखा गया है।
- source_word: וְאֶת אֹצְרוֹת בֵּית מלך
  choice: और राजभवन के भंडारों में
  rationale: शाब्दिक ‘राजा का भवन’ यहाँ राजकीय निवास/महल को सूचित करता है; ‘राजभवन’ आधुनिक हिन्दी में संक्षिप्त और स्पष्ट है।
- source_word: וַיִּתְּנֵם בְּיַד עֲבָדָיו
  choice: उसे अपने सेवकों के हाथ में सौंप दिया
  rationale: ‘हाथ में देना’ अधिकार या अभिरक्षा सौंपने का मुहावरा है; ‘सौंप दिया’ हिन्दी में उसका स्वाभाविक अर्थ देता है। चाँदी और सोने की संयुक्त राशि के लिए ‘उसे’ प्रयोग किया गया है।
- source_word: וַיִּשְׁלָחֵם
  choice: उसे ... भेजा
  rationale: प्रत्यय का संदर्भ चाँदी और सोने से है; हिन्दी में संयुक्त धनराशि को एक समष्टि मानकर एकवचन सर्वनाम स्वाभाविक है।
- source_word: בֶּן הֲדַד בֶּן טַבְרִמֹּן בֶּן חֶזְיוֹן
  choice: बेन-हदद ... ताब्रिम्मोन का पुत्र और हेज्योन का पौत्र था
  rationale: वंशपरिचय को स्पष्ट हिन्दी में व्यक्त करते हुए मूल की तीन पीढ़ियाँ सुरक्षित रखी गई हैं।
- source_word: מֶלֶךְ אֲרָם
  choice: अराम के राजा
  rationale: मूल ऐतिहासिक-भौगोलिक नाम אֲרָם का लिप्यंतरण किया गया है, बाद के नाम ‘सीरिया’ से प्रतिस्थापित नहीं किया गया।
- source_word: הַיֹּשֵׁב בְּדַמֶּשֶׂק
  choice: दमिश्क में रहने वाले
  rationale: יֹשֵׁב का आवास-सूचक अर्थ आधुनिक हिन्दी में सहज रूप से व्यक्त होता है।
- source_word: לֵאמֹר
  choice: 'यह संदेश भेजा:'
  rationale: यह सूत्र अगले पद में आने वाले सीधे कथन का परिचय देता है; दूतों के माध्यम से संप्रेषण के संदर्भ में यह स्वाभाविक हिन्दी है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: ईश्वरीय व्यक्तिगत नाम को उपाधि से बदलने के बजाय प्रचलित हिन्दी लिप्यंतरण ‘यहोवा’ से प्रस्तुत किया गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: प्रभु
  rationale: पाठ में व्यक्तिगत वाचा-नाम है; उसे केवल उपाधि ‘प्रभु’ से प्रतिस्थापित न करके हिन्दी में परिचित नामरूप रखा गया है।
- issue: אֲרָם की ऐतिहासिक पहचान
  choice: अराम
  alternative: सीरिया
  rationale: ‘अराम’ मूल पाठ का तत्कालीन जातीय-भौगोलिक नाम है; ‘सीरिया’ बाद का पारंपरिक समतुल्य है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। लम्बे इब्रानी वाक्य को स्पष्टता के लिए तीन हिन्दी वाक्यों में बाँटा गया है, पर घटनाक्रम और वंशपरिचय अक्षुण्ण हैं।
