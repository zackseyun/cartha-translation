  yaml_path: translation/ot/1_kings/015/031.yaml
  text: The rest of the acts of Nadab[a], and all that he did, are they not written in the Book of the Chronicles of the Kings of Israel?
translation:
  language: hi
  text: नादाब के बाकी कामों और उसके किए हुए सब कामों का वर्णन क्या इस्राएल के राजाओं के इतिहास-वृत्तांत[a] में नहीं लिखा है?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “इस्राएल के राजाओं के वार्षिक अभिलेख।” इब्रानी अभिव्यक्ति एक राजकीय अभिलेख-स्रोत को दर्शाती है; यह आवश्यक नहीं कि इसका अभिप्राय बाइबल की इतिहास-वृत्तांत पुस्तकों से हो।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי נָדָב
  choice: नादाब के बाकी कामों
  rationale: יֶתֶר का अर्थ ‘बाकी’ और דִּבְרֵי का इस राजकीय सारांश-सूत्र में अर्थ शाब्दिक ‘बातें’ नहीं, बल्कि राजा के कार्य या वृत्तांत है। ‘बाकी कामों’ आधुनिक हिन्दी में सहज है।
- source_word: וְכָל אֲשֶׁר עָשָׂה
  choice: और उसने जो कुछ किया
  rationale: यह सापेक्ष उपवाक्य मूल की व्यापकता और सूत्रबद्ध शैली बनाए रखता है।
- source_word: הֲלֹא הֵם כְּתוּבִים
  choice: क्या उनका वर्णन ... नहीं लिखा है?
  rationale: הֲלֹא सकारात्मक उत्तर की अपेक्षा रखने वाला आलंकारिक प्रश्न है। ‘उनका वर्णन’ हिन्दी में बहुवचन पूर्ववर्ती कामों की ओर स्पष्ट संकेत देता है, जबकि ‘लिखा है’ अभिलेख में लिखे होने की स्वाभाविक हिन्दी अभिव्यक्ति है।
- source_word: עַל סֵפֶר
  choice: में
  rationale: यद्यपि עַל का मूल अर्थ ‘पर’ है, किसी ग्रंथ या अभिलेख में सामग्री लिखी होने के लिए हिन्दी में ‘में’ स्वाभाविक है।
- source_word: סֵפֶר דִּבְרֵי הַיָּמִים לְמַלְכֵי יִשְׂרָאֵל
  choice: इस्राएल के राजाओं के इतिहास-वृत्तांत
  rationale: यह पद राजाओं से संबंधित वार्षिक या राजकीय अभिलेख-स्रोत को दर्शाता है। ‘इतिहास-वृत्तांत’ अर्थ को स्पष्ट करता है और इसे बाइबिल की ‘इतिहास’ नामक पुस्तकों के साथ अनिवार्यतः एक नहीं ठहराता।
- source_word: נָדָב
  choice: नादाब
  rationale: व्यक्तिनाम का मानक हिन्दी बाइबिलीय लिप्यंतरण।
theological_decisions:
- issue: उल्लिखित ग्रंथ की पहचान
  choice: इसे इस्राएल के राजाओं का राजकीय इतिहास-वृत्तांत माना गया है
  alternative: इसे बाइबिल की इतिहास/इतिहास-वृत्तांत की किसी प्रामाणिक पुस्तक के समान मानना
  rationale: इब्रानी शीर्षक एक राजकीय अभिलेख-स्रोत को सूचित करता है; पद स्वयं उसे वर्तमान बाइबिलीय इतिहास की पुस्तकों के साथ एक नहीं ठहराता।
