  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। आरंभ में ‘अब’ नहीं जोड़ा गया, क्योंकि मूल में स्पष्ट कालसूचक शब्द नहीं है। राजकीय सारांश के आलंकारिक प्रश्न को प्रश्न के रूप में ही बनाए रखा गया है।
