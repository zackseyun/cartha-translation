base_translation:
  language: en
  yaml_path: translation/ot/1_kings/015/007.yaml
  text: The rest of the acts of Abijam[a], and all that he did[b], are they not written in the Book of the Chronicles of the Kings of Judah? And there was war between Abijam and Jeroboam.
translation:
  language: hi
  text: अबिय्याम[a] के बाकी काम और उसने जो कुछ किया, क्या वे यहूदा के राजाओं के इतिहास की पुस्तक[b] में लिखे नहीं हैं? अबिय्याम और यारोबाम के बीच युद्ध था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: कुछ समानांतर या संबंधित पदों में अबिय्याम को अबिय्याह कहा गया है; यहाँ इब्रानी पाठ में ‘अबिय्याम’ है।
    reason: alternative_reading
  - marker: b
    text: या, “यहूदा के राजाओं के इतिहास-वृत्तांत की पुस्तक।”
    reason: lexical_alternative
lexical_decisions:
- source_word: יֶתֶר דִּבְרֵי
  choice: बाकी काम
  rationale: राजकीय सारांश के इस प्रचलित सूत्र में יֶתֶר शेष सामग्री और דִּבְרֵי राजा के कार्यों या उससे जुड़ी घटनाओं को दर्शाता है; ‘बाकी काम’ सहज आधुनिक हिन्दी है।
- source_word: אֲבִיָּם
  choice: अबियाम
  rationale: यहाँ मसोराई इब्रानी पाठ में नाम אֲבִיָּם है; इसलिए अन्य स्थानों के ‘अबिय्याह’ से सामंजस्य नहीं किया गया।
- source_word: וְכָל אֲשֶׁר עָשָׂה
  choice: और उसने जो कुछ किया
  rationale: यह रूप मूल की व्यापकता और सामान्य अर्थ को बनाए रखता है।
- source_word: הֲלוֹא הֵם כְּתוּבִים
  choice: क्या वे ... लिखे नहीं हैं?
  rationale: इब्रानी के आलंकारिक प्रश्न और बहुवचन निष्क्रिय रूप दोनों को सुरक्षित रखा गया है।
- source_word: סֵפֶר דִּבְרֵי הַיָּמִים לְמַלְכֵי יְהוּדָה
  choice: यहूदा के राजाओं के इतिहास की पुस्तक
  rationale: यह राजकीय अभिलेख के शीर्षक का स्वाभाविक हिन्दी रूप है; ‘इतिहास’ घटनाओं के क्रमबद्ध लिखित विवरण का भाव देता है।
- source_word: וּמִלְחָמָה הָיְתָה
  choice: युद्ध था
  rationale: यह सरल अस्तित्वसूचक कथन है; अवधि या निरंतरता को मूल से अधिक स्पष्ट नहीं किया गया।
- source_word: בֵּין אֲבִיָּם וּבֵין יָרָבְעָם
  choice: अबियाम और यारोबाम के बीच
  rationale: युग्मित इब्रानी संबंधबोधक का स्वाभाविक हिन्दी रूप, जो दोनों राजाओं का पारस्परिक विरोध व्यक्त करता है।
