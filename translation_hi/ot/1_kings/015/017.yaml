  to: तब इस्राएल के राजा बाशा ने यहूदा पर चढ़ाई की और रामा में निर्माण किया[a], ताकि वह यहूदा के राजा आसा के पास किसी को आने या जाने न दे[b]।
  rationale: The revision makes the construction involving Ramah natural and non-misleading in Hindi while preserving the source’s non-specific verb ‘build.’ It also expands the paired idiom to ‘आने या जाने’ for clarity, without changing its scope or the directional relation to Asa.
