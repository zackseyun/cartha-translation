  text: וַ/יַּ֨עַל בַּעְשָׁ֤א מֶֽלֶךְ יִשְׂרָאֵל֙ עַל יְהוּדָ֔ה וַ/יִּ֖בֶן אֶת הָ/רָמָ֑ה לְ/בִלְתִּ֗י תֵּ֚ת יֹצֵ֣א וָ/בָ֔א לְ/אָסָ֖א מֶ֥לֶךְ יְהוּדָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/015/017.yaml
  text: Then Baasha king of Israel went up against Judah and built Ramah[b][a], so as not to allow anyone to go out or come in to Asa king of Judah.
translation:
  language: hi
  text: तब इस्राएल के राजा बाशा ने यहूदा पर चढ़ाई की और रामा में निर्माण किया[a], ताकि वह यहूदा के राजा आसा के पास किसी को आने या जाने न दे[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘रामा की किलेबंदी की’; इब्रानी क्रिया का सामान्य अर्थ ‘बनाना’ या ‘निर्माण करना’ है, पर प्रसंग सामरिक निर्माण या किलेबंदी का संकेत देता है।
    reason: lexical_alternative
  - marker: b
    text: ‘आने या जाने’ का अर्थ सामान्य आवागमन या पहुँच है; बाशा यहूदा के राजा आसा के पास लोगों की आवाजाही रोकना चाहता था।
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּעַל ... עַל יְהוּדָה
  choice: यहूदा पर चढ़ाई की
  rationale: सैन्य प्रसंग में עלה עם עַל विरोध में आगे बढ़ने या चढ़ाई करने का भाव देता है; यह अनुवाद उस शत्रुतापूर्ण गतिविधि को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: בַּעְשָׁא מֶלֶךְ יִשְׂרָאֵל
  choice: इस्राएल के राजा बाशा
  rationale: राजकीय उपाधि और व्यक्ति के नाम का सीधा, प्रचलित हिन्दी रूप।
- source_word: וַיִּבֶן אֶת־הָרָמָה
  choice: रामा को बनाया
  rationale: בנה का मूल अर्थ ‘बनाना/निर्माण करना’ है। प्रसंग किलेबंदी का संकेत देता है, पर मुख्य पाठ में मूल क्रिया की व्यापकता सुरक्षित रखी गई है।
- source_word: לְבִלְתִּי תֵּת
  choice: ताकि ... न दे
  rationale: यह रचना रोकने के उद्देश्य को व्यक्त करती है; हिन्दी में यह स्वाभाविक और अर्थनिष्ठ है।
- source_word: יֹצֵא וָבָא
  choice: आने-जाने
  rationale: यह युग्म आवागमन या पहुँच के पूरे दायरे को सूचित करता है; हिन्दी का ‘आना-जाना’ समान रूप से स्वाभाविक मुहावरा है।
- source_word: לְאָסָא מֶלֶךְ יְהוּדָה
  choice: यहूदा के राजा आसा के पास
  rationale: לְ आसा से संबंधित दिशा या पहुँच बताता है। ‘के पास’ मूल की सीमित अभिव्यक्ति को बनाए रखता है और अनकहे ‘से’ को मुख्य पाठ में नहीं जोड़ता।
