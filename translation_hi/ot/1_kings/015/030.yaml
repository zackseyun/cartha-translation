  text: עַל חַטֹּ֤אות יָרָבְעָם֙ אֲשֶׁ֣ר חָטָ֔א וַ/אֲשֶׁ֥ר הֶחֱטִ֖יא אֶת יִשְׂרָאֵ֑ל בְּ/כַעְס֕/וֹ אֲשֶׁ֣ר הִכְעִ֔יס אֶת יְהוָ֖ה אֱלֹהֵ֥י יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/015/030.yaml
  text: because of the sins of Jeroboam that he committed and by which he caused Israel to sin[a], and because of his provocation by which he provoked Yahweh, the God of Israel.
translation:
  language: hi
  text: यारोबाम के उन पापों के कारण, जो उसने किए और जिनके द्वारा उसने इस्राएल से पाप कराया, और उसके उस उकसावे[a] के कारण, जिससे उसने इस्राएल के परमेश्वर यहवे को क्रोधित किया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसके क्रोध के कारण”; हिब्रू संज्ञा का अर्थ ‘क्रोध’ या ‘उकसावा’ हो सकता है। यहाँ इसके बाद आने वाली क्रिया ‘क्रोधित किया’ के कारण ‘उकसावा’ अधिक उपयुक्त जान पड़ता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל
  choice: के कारण
  rationale: यहाँ यह संबंधसूचक शब्द पिछले कथन में वर्णित दण्ड या घटना का कारण बताता है।
- source_word: חַטֹּאות ... חָטָא
  choice: उन पापों ... जो उसने किए
  rationale: बहुवचन ‘पापों’ को बनाए रखते हुए संज्ञा और क्रिया की अनावश्यक पुनरावृत्ति से बचने के लिए स्वाभाविक हिन्दी प्रयोग चुना गया है।
- source_word: הֶחֱטִיא אֶת־יִשְׂרָאֵל
  choice: उसने इस्राएल से भी पाप कराया
  rationale: हिफ़ील रूप की कारणवाचक शक्ति को स्पष्ट रूप से व्यक्त करता है; ‘भी’ यारोबाम के अपने पाप और इस्राएल से कराए गए पाप के बीच संबंध स्पष्ट करता है।
- source_word: בְּכַעְסוֹ
  choice: उसके उस उकसावे के कारण
  rationale: כַּעַס का अर्थ क्रोध अथवा उकसावा हो सकता है। अगले कारणवाचक क्रिया-रूप ‘क्रोधित किया’ के साथ ‘उकसावा’ प्रसंग में अधिक उपयुक्त है, पर वैकल्पिक अर्थ फुटनोट में सुरक्षित रखा गया है।
- source_word: הִכְעִיס
  choice: क्रोधित किया
  rationale: यह हिफ़ील क्रिया किसी को क्रोध दिलाने या भड़काने का अर्थ देती है; हिन्दी में ‘क्रोधित किया’ संक्षिप्त और स्वाभाविक है।
- source_word: יְהוָה
  choice: यहवे
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को उपाधि से बदलने के बजाय हिन्दी में लिप्यंतरित किया गया है।
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: इस्राएल के परमेश्वर
  rationale: सम्बन्धवाचक इब्रानी पदबंध का सीधा, प्रचलित और स्पष्ट हिन्दी रूप।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहवे
  alternative: यहोवा
  rationale: मूल पाठ में परमेश्वर का व्यक्तिगत वाचा-नाम है; इसलिए उसे ‘प्रभु’ जैसी उपाधि से प्रतिस्थापित नहीं किया गया। ‘यहवे’ मूल नाम के प्रचलित विद्वत्तापूर्ण उच्चारण का देवनागरी रूप है।
- issue: यारोबाम और इस्राएल के पाप के बीच कारणात्मक संबंध
  choice: उसने इस्राएल से भी पाप कराया
  alternative: उसने इस्राएल को पाप में डाला
  rationale: मूल हिफ़ील रूप स्पष्टतः कारणवाचक है। चुना गया पाठ इस कारणात्मकता को बनाए रखता है, पर यह नहीं बताता कि उसने किस विशेष ढंग या सीमा तक ऐसा कराया।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज रखी गई है। यह पद पिछले कथन का कारण बताने वाला वाक्यांश है, इसलिए मूल की वाक्य-खंडात्मक संरचना को पूर्ण स्वतंत्र वाक्य बनाकर नहीं बदला गया।
