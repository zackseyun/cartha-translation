  text: Nadab son of Jeroboam became king over Israel in the second year of Asa king of Judah, and he reigned over Israel two years.
translation:
  language: hi
  text: यारोबाम का पुत्र नादाब, यहूदा के राजा आसा के शासन के दूसरे वर्ष में इस्राएल का राजा बना, और उसने इस्राएल पर दो वर्ष शासन किया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/נָדָב בֶּן יָרָבְעָם
  choice: यारोबाम का पुत्र नादाब
  rationale: वंश-संबंध को स्वाभाविक हिन्दी क्रम में रखा गया है। आरम्भिक וְ कथानक को आगे बढ़ाता है; अलग से ‘और’ या ‘तब’ जोड़ना हिन्दी में अनावश्यक और उससे अधिक कालगत बल दे सकता है।
- source_word: מָלַךְ עַל יִשְׂרָאֵל
  choice: इस्राएल का राजा बना
  rationale: यहाँ क्रिया राजगद्दी पर बैठने की घटना बताती है, इसलिए ‘राजा बना’ बाद में आने वाली शासन-अवधि से स्पष्ट भेद रखता है।
- source_word: בִּ/שְׁנַת שְׁתַּיִם לְ/אָסָא מֶלֶךְ יְהוּדָה
  choice: यहूदा के राजा आसा के शासन के दूसरे वर्ष में
  rationale: इब्रानी राजकीय काल-निर्धारण में प्रयुक्त गणनावाचक ‘दो’ का स्वाभाविक हिन्दी रूप ‘दूसरे वर्ष’ है; ‘शासन के’ जोड़ने से संदर्भ स्पष्ट और सहज होता है।
- source_word: וַ/יִּמְלֹךְ עַל יִשְׂרָאֵל
  choice: और उसने इस्राएल पर ... शासन किया
  rationale: अवधि के साथ प्रयुक्त क्रिया को ‘शासन किया’ कहना राज्यारोहण सूचक पहले प्रयोग से भेद बनाए रखता है।
- source_word: שְׁנָתָיִם
  choice: दो वर्ष
  rationale: द्विवचन रूप शासन की दो वर्ष की अवधि को सीधे व्यक्त करता है।
