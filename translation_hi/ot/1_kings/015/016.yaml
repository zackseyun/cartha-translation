lexical_decisions:
- source_word: וּמִלְחָמָה הָיְתָה
  choice: युद्ध चलता रहा
  rationale: शाब्दिक अर्थ ‘और युद्ध था’ है, पर प्रसंग में यह जारी रहने वाली स्थिति बताता है; आधुनिक स्वाभाविक हिन्दी में ‘युद्ध चलता रहा’ उसी भाव को स्पष्ट और संक्षिप्त रूप से व्यक्त करता है।
- source_word: בֵּין ... וּבֵין
  choice: के बीच
  rationale: यह युग्मित पूर्वसर्ग दोनों राजाओं के बीच पारस्परिक विरोध को सीधे व्यक्त करता है।
- source_word: אָסָא
  choice: आसा
  rationale: व्यक्तिवाचक नाम का हिन्दी बाइबलीय परंपरा के अनुरूप लिप्यंतरण।
- source_word: בַּעְשָׁא
  choice: बाशा
  rationale: व्यक्तिवाचक नाम का हिन्दी बाइबलीय परंपरा के अनुरूप लिप्यंतरण।
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: इस्राएल के राजा
  rationale: समासिक पद बाशा के राजकीय पद को बताता है; हिन्दी में यह रूप स्वाभाविक विशेषणात्मक पदबंध है।
- source_word: כָּל יְמֵיהֶם
  choice: उनके जीवन भर
  rationale: इब्रानी मुहावरे का शाब्दिक अर्थ ‘उनके सब दिन’ है। हिन्दी में ‘उनके जीवन भर’ उसका स्वाभाविक अर्थ देता है, जबकि पादटिप्पणी मूल अभिव्यक्ति को सुरक्षित रखती है।
theological_decisions:
- issue: ‘उनके सब दिन’ की अवधि का आशय
  choice: मुख्य पाठ में ‘उनके जीवन भर’ रखा गया और मूल मुहावरा पादटिप्पणी में दिया गया।
  alternative: ‘उनके शासनकाल भर’
  rationale: मूल पाठ ‘दिन’ कहता है और स्पष्ट रूप से केवल शासनकाल नहीं कहता; इसलिए ‘शासनकाल’ जोड़कर अर्थ को अनावश्यक रूप से सीमित नहीं किया गया।
