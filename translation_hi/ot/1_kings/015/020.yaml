  text: וַ/יִּשְׁמַ֨ע בֶּן הֲדַ֜ד אֶל הַ/מֶּ֣לֶךְ אָסָ֗א וַ֠/יִּשְׁלַח אֶת שָׂרֵ֨י הַ/חֲיָלִ֤ים אֲשֶׁר ל/וֹ֙ עַל עָרֵ֣י יִשְׂרָאֵ֔ל וַ/יַּךְ֙ אֶת עִיּ֣וֹן וְ/אֶת דָּ֔ן וְ/אֵ֖ת אָבֵ֣ל בֵּֽית מַעֲכָ֑ה וְ/אֵת֙ כָּל כִּנְר֔וֹת עַ֖ל כָּל אֶ֥רֶץ נַפְתָּלִֽי־־־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/015/020.yaml
  text: Ben-hadad listened to King Asa and sent the commanders of the armies that were his against the cities of Israel[a], and he struck Ijon, Dan, Abel-beth-maacah, and all Chinneroth[b], against all the land of Naphtali.
translation:
  language: hi
  text: बेन-हदद ने राजा आसा की बात मान ली[a] और अपने सेनापतियों को इस्राएल के नगरों के विरुद्ध भेजा, और उसने इय्योन, दान, आबेल-बेत-माका, पूरे किन्नेरेत[b] और नप्ताली के सारे देश पर आक्रमण किया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “राजा आसा की सुन ली।” इब्रानी मुहावरे में अनुकूल होकर सुनने और अनुरोध के अनुसार कार्य करने का भाव हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: यहाँ “किन्नेरेत” किसी स्थान या क्षेत्र का नाम है, न कि सामान्य संज्ञा “वीणाएँ।”
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּשְׁמַע אֶל
  choice: की बात मान ली
  rationale: यह इब्रानी मुहावरा अनुकूल होकर सुनने और अनुरोध के अनुसार कार्य करने का भाव देता है। हिंदी में यह स्वाभाविक है और ‘आज्ञा मानी’ की तुलना में आसा के अधिकार को अनावश्यक रूप से अधिक नहीं दर्शाता।
- source_word: שָׂרֵי הַחֲיָלִים אֲשֶׁר לוֹ
  choice: अपने सेनापतियों
  rationale: शाब्दिक संबंध ‘उसके जो सेनाओं के प्रधान थे’ है; ‘अपने सेनापतियों’ सैन्य अधीनता और बहुवचन को संक्षेप में स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: עַל עָרֵי יִשְׂרָאֵל
  choice: इस्राएल के नगरों पर चढ़ाई करने के लिए
  rationale: שלח के साथ עַל सैन्य संदर्भ में लक्ष्य के विरुद्ध भेजने का अर्थ देता है। ‘चढ़ाई करने के लिए’ शत्रुतापूर्ण उद्देश्य स्पष्ट करता है।
- source_word: וַיַּךְ
  choice: आक्रमण किया
  rationale: נכה का अर्थ मारना, प्रहार करना या सैन्य आक्रमण करना हो सकता है। नगरों और प्रदेशों के संदर्भ में ‘आक्रमण किया’ स्वाभाविक है और निर्णायक विजय का दावा नहीं करता।
- source_word: עִיּוֹן
  choice: इय्योन
  rationale: स्थान-नाम का स्रोतानुकूल देवनागरी लिप्यंतरण।
- source_word: אָבֵל בֵּית מַעֲכָה
  choice: आबेल-बेत-माका
  rationale: संयुक्त स्थान-नाम का स्पष्ट देवनागरी लिप्यंतरण।
- source_word: כָּל כִּנְרוֹת
  choice: पूरे किन्नेरेत
  rationale: यहाँ כִּנְרוֹת स्थान अथवा क्षेत्र का नाम है; ‘पूरे’ כָּל को व्यक्त करता है और इसे सामान्य संज्ञा ‘वीणाएँ’ समझने से बचाता है।
- source_word: עַל כָּל אֶרֶץ נַפְתָּלִי
  choice: और नप्ताली के सारे प्रदेश पर
  rationale: दोहराया हुआ עַל सैन्य कार्रवाई के अगले भौगोलिक लक्ष्य को दर्शाता है। ‘प्रदेश’ אֶרֶץ के प्रादेशिक अर्थ को स्वाभाविक हिंदी में व्यक्त करता है।
