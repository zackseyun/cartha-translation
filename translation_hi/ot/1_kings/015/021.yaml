  text: जब बाशा ने यह सुना, तो उसने रामा का निर्माण करना बंद कर दिया और तिर्सा में रहा।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तिर्सा में निवास किया।”
