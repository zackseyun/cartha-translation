lexical_decisions:
- source_word: וַיְהִי כִּשְׁמֹעַ
  choice: जब ... ने यह सुना
  rationale: यह इब्रानी कथात्मक संरचना समयसूचक उपवाक्य आरम्भ करती है। आधुनिक हिन्दी में ‘जब ... ने यह सुना’ इसका स्वाभाविक रूप है; ‘यह’ का आशय पिछले प्रसंग से लिया गया है।
- source_word: בַּעְשָׁא
  choice: बाशा
  rationale: व्यक्तिवाचक नाम का हिन्दी में प्रचलित लिप्यंतरण।
- source_word: וַיֶּחְדַּל מִבְּנוֹת
  choice: बनवाना बंद कर दिया
  rationale: חדל के साथ מן और क्रियार्थक संज्ञा किसी काम को रोक देने का भाव देते हैं। राजा स्वयं निर्माण नहीं कर रहा था, इसलिए हिन्दी में प्रेरणार्थक ‘बनवाना’ प्रसंगानुकूल और स्वाभाविक है।
- source_word: אֶת הָרָמָה
  choice: रामा को
  rationale: यहाँ הָרָמָה स्थान का नाम और क्रिया का सीधा कर्म है; इसलिए इसे ‘रामा को’ कहा गया है।
- source_word: וַיֵּשֶׁב
  choice: रहा
  rationale: ישׁב का अर्थ बैठना, रहना, बसना या निवास करना हो सकता है। ‘रहा’ प्रसंग में स्वाभाविक है और स्थायी रूप से बस जाने का अनावश्यक अर्थ नहीं जोड़ता।
- source_word: בְּתִרְצָה
  choice: तिर्सा में
  rationale: स्थान-नाम का हिन्दी लिप्यंतरण और בְּ का स्वाभाविक स्थानीय अनुवाद।
