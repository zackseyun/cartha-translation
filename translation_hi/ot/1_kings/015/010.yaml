  yaml_path: translation/ot/1_kings/015/010.yaml
  text: He reigned forty-one years in Jerusalem[b][a], and his mother’s name was Maacah daughter of Abishalom.
translation:
  language: hi
  text: उसने यरूशलेम में इकतालीस वर्ष राज्य किया। उसकी माता का नाम माका था; माका अबीशालोम की बेटी थी।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में ‘बेटी’; वंशावलियों में यह शब्द कभी-कभी किसी दूर की स्त्री वंशज के लिए भी प्रयुक्त हो सकता है। इब्रानी नाम का रूप ‘अबीशालोम’ है; ‘अबशालोम’ रूप भी मिलता है।
    reason: वंश-संबंध के संभावित व्यापक अर्थ और नाम के परिचित वैकल्पिक रूप को स्पष्ट करना।
lexical_decisions:
- source_word: וְאַרְבָּעִים וְאַחַת שָׁנָה
  choice: इकतालीस वर्ष
  rationale: इब्रानी संख्या-विन्यास का अर्थ स्वाभाविक आधुनिक हिन्दी में ‘इकतालीस वर्ष’ है।
- source_word: מָלַךְ
  choice: राज्य किया
  rationale: यहाँ क्रिया राजकीय शासन की अवधि बताती है; ‘राज्य किया’ हिन्दी में स्पष्ट और प्रचलित है।
- source_word: בִּירוּשָׁלִָם
  choice: यरूशलेम में
  rationale: उपसर्ग בְּ स्थान सूचित करता है; ‘में’ स्वाभाविक हिन्दी रूप है।
- source_word: וְשֵׁם אִמּוֹ
  choice: उसकी माता का नाम ... था
  rationale: इब्रानी रचना का अर्थ सुरक्षित रखते हुए यह आधुनिक, गरिमापूर्ण हिन्दी है।
- source_word: מַעֲכָה
  choice: माका
  rationale: व्यक्तिवाचक नाम का इब्रानी उच्चारण के निकट देवनागरी लिप्यंतरण किया गया है।
- source_word: בַּת
  choice: बेटी
  rationale: इस शब्द का सीधा अर्थ ‘बेटी’ है; वंशावली में अधिक व्यापक अर्थ संभव होने की बात पादटिप्पणी में दी गई है।
- source_word: אֲבִישָׁלוֹם
  choice: अबीशालोम
  rationale: WLC में उपस्थित इब्रानी रूप אֲבִישָׁלוֹם का निकट देवनागरी लिप्यंतरण है।
theological_decisions:
- issue: माका का वंश-संबंध
  choice: मुख्य पाठ में ‘अबीशालोम की बेटी’ रखा गया।
  alternative: ‘अबीशालोम की पोती’ अथवा ‘अबीशालोम की वंशज’।
  rationale: इब्रानी पाठ स्पष्ट रूप से בַּת (‘बेटी’) कहता है। ऐतिहासिक या वंशावली-संबंधी कठिनाई को व्याख्यात्मक अनुवाद द्वारा चुपचाप हल करने के बजाय व्यापक संभावित अर्थ पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, सरल किंतु गरिमापूर्ण रखी गई है। ‘माता’ और ‘राज्य किया’ सामान्य पाठक के लिए सुबोध हैं। सभी पादटिप्पणी संकेत मुख्य पाठ में उपस्थित हैं।
