  text: אָז֩ יִבְנֶ֨ה שְׁלֹמֹ֜ה בָּמָ֗ה לִ/כְמוֹשׁ֙ שִׁקֻּ֣ץ מוֹאָ֔ב בָּ/הָ֕ר אֲשֶׁ֖ר עַל פְּנֵ֣י יְרוּשָׁלִָ֑ם וּ/לְ/מֹ֕לֶךְ שִׁקֻּ֖ץ בְּנֵ֥י עַמּֽוֹן־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/007.yaml
  text: Then Solomon built a high place for Chemosh[a], the abomination of Moab, on the mountain that is opposite Jerusalem, and for Molech, the abomination of the Ammonites.
translation:
  language: hi
  text: तब सुलैमान ने यरूशलेम के सामने वाले पहाड़ पर मोआब के घृणित देवता कमोश के लिए, और अम्मोनियों के घृणित देवता मोलेक[a] के लिए, एक ऊँचा पूजा-स्थान बनाया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मिल्कोम।” यहाँ इब्रानी रूप को परंपरागत रूप से “मोलेक” पढ़ा जाता है, पर कुछ लोग इसे अम्मोनी देवता मिल्कोम से जोड़ते हैं।
    reason: alternative_reading
lexical_decisions:
- source_word: אָז
  choice: तब
  rationale: यह कालवाचक क्रियाविशेषण कथा में अगली घटना को सूचित करता है; ‘तब’ स्वाभाविक और संक्षिप्त है।
- source_word: יִבְנֶה
  choice: बनवाया
  rationale: रूप अपूर्णकाल का है, पर אָז के साथ कथा-संदर्भ में भूतकालीन घटना व्यक्त करता है। राजा द्वारा निर्माण कराए जाने के अर्थ में हिंदी का प्रेरणार्थक रूप स्वाभाविक है।
- source_word: בָּמָה
  choice: पूजा-स्थान
  rationale: यह किसी देवता की उपासना से जुड़ा ऊँचा अथवा स्थानीय धार्मिक स्थल है। ‘पूजा-स्थान’ सामान्य हिंदी पाठक के लिए अर्थ स्पष्ट करता है, जबकि केवल भौगोलिक ऊँचाई का भ्रम नहीं देता।
- source_word: לִכְמוֹשׁ
  choice: कमोश के लिए
  rationale: לְ समर्पण अथवा उद्देश्य बताता है; देवता का नाम हिंदी में ‘कमोश’ लिप्यंतरित किया गया है।
- source_word: שִׁקֻּץ מוֹאָב
  choice: मोआब के घृणित देवता
  rationale: שִׁקֻּץ तीव्र निंदात्मक धार्मिक शब्द है। संदर्भ में यह देवता को सूचित करता है; ‘घृणित देवता’ कथाकार का मूल्यांकन स्पष्ट और स्वाभाविक हिंदी में बनाए रखता है।
- source_word: בָּהָר אֲשֶׁר עַל־פְּנֵי יְרוּשָׁלִָם
  choice: यरूशलेम के सामने वाले पहाड़ पर
  rationale: הַר का सीधा अर्थ ‘पहाड़’ है और עַל־פְּנֵי यहाँ ‘सामने/सम्मुख’ का स्थानिक अर्थ देता है; अधिक विशिष्ट भौगोलिक पहचान नहीं जोड़ी गई।
- source_word: וּלְמֹלֶךְ
  choice: और ... मोलेक के लिए भी
  rationale: मुख्य पाठ मसोरेटिक स्वरांकन מֹלֶךְ के अनुसार ‘मोलेक’ रखता है; समानांतर हिंदी वाक्य में ‘भी’ संबंध स्पष्ट करता है।
- source_word: שִׁקֻּץ בְּנֵי עַמּוֹן
  choice: अम्मोनियों के घृणित देवता
  rationale: यह पहले पदबंध के समानांतर है। בְּנֵי עַמּוֹן का स्वाभाविक हिंदी जातिनाम ‘अम्मोनी’ है।
theological_decisions:
- issue: विदेशी देवताओं के लिए निंदात्मक पद שִׁקֻּץ
  choice: दोनों स्थानों पर ‘घृणित देवता’
  alternative: ‘घृणित वस्तु’ या ‘घृणित मूर्ति’
  rationale: इब्रानी पाठ स्वयं इन देवताओं/उनकी उपासना का निंदात्मक मूल्यांकन करता है। संदर्भगत संकेत ‘देवता’ जोड़ने से हिंदी में आशय स्पष्ट होता है और मूल की कठोरता बनी रहती है।
- issue: מֹלֶךְ की पहचान
  choice: मुख्य पाठ में ‘मोलेक’
  alternative: ‘मिल्कोम’
  rationale: WLC का स्वरांकित रूप ‘मोलेक’ का समर्थन करता है, जबकि संबंधित पाठों के आधार पर कुछ लोग इसे अम्मोनी देवता मिल्कोम से जोड़ते हैं। विवाद को हल किए बिना विकल्प पादटिप्पणी में रखा गया है।
translation_notes:
  register: आधुनिक मानक हिंदी; गरिमापूर्ण किंतु सामान्य पाठक के लिए स्पष्ट। ‘पूजा-स्थान’ तकनीकी בָּמָה का अर्थ सहज रूप में देता है। दोनों समानांतर निर्माणों को पूरा व्यक्त करके हिंदी में अस्पष्टता से बचाया गया है।
