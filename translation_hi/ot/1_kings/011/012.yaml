source:
  edition: WLC
  text: אַךְ בְּ/יָמֶ֨י/ךָ֙ לֹ֣א אֶעֱשֶׂ֔/נָּה לְמַ֖עַן דָּוִ֣ד אָבִ֑י/ךָ מִ/יַּ֥ד בִּנְ/ךָ֖ אֶקְרָעֶֽ/נָּה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/012.yaml
  text: Nevertheless[a], in your days I will not do it, for the sake of David your father[b]; from the hand of your son I will tear it away.
translation:
  language: hi
  text: फिर भी, तेरे दिनों में मैं ऐसा नहीं करूँगा—तेरे पिता दाऊद की खातिर। मैं इसे तेरे बेटे के हाथ से छीन लूँगा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַךְ
  choice: फिर भी
  rationale: यह पिछले पद में सुनाए गए दण्ड पर विरोधात्मक और सीमित करने वाला बल देता है; आधुनिक हिन्दी में ‘फिर भी’ स्वाभाविक है।
- source_word: בְּיָמֶיךָ
  choice: तेरे दिनों में
  rationale: मूल इब्रानी काल-सूचक मुहावरे को बनाए रखता है और सुलैमान के जीवनकाल/शासनकाल का बोध संदर्भ से स्पष्ट है।
- source_word: לֹא אֶעֱשֶׂנָּה
  choice: मैं ऐसा नहीं करूँगा
  rationale: स्त्रीलिंग प्रत्यय पिछले पद में घोषित राज्य छीनने के कार्य की ओर संकेत करता है; ‘ऐसा’ उस संदर्भ को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: לְמַעַן דָּוִד אָבִיךָ
  choice: तेरे पिता दाऊद के कारण
  rationale: לְמַעַן यहाँ दाऊद का लिहाज़ करते हुए कार्य टालने का आधार बताता है; ‘के कारण’ साधारण पाठक के लिए स्पष्ट और संक्षिप्त है।
- source_word: מִיַּד בִּנְךָ
  choice: तेरे बेटे के हाथ से
  rationale: इब्रानी ‘हाथ से’ मुहावरे को सुरक्षित रखता है, जो अधिकार या अधीनता से निकालने का भाव देता है।
- source_word: אֶקְרָעֶנָּה
  choice: मैं इसे ... छीन लूँगा
  rationale: קָרַע का मूल भाव फाड़कर अलग करना है; राज्य के संदर्भ में ‘छीन लूँगा’ उस बलपूर्वक अलगाव को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: सुलैमान पर घोषित दण्ड का स्थगन
  choice: राज्य छीनने का घोषित कार्य सुलैमान के दिनों में नहीं, बल्कि उसके बेटे के हाथ से किया जाएगा।
  alternative: ‘तेरे जीवनकाल में मैं ऐसा नहीं करूँगा’ कहकर समय-संदर्भ को अधिक स्पष्ट किया जा सकता है।
  rationale: मूल पाठ ‘तेरे दिनों में’ कहता और वस्तु को संदर्भ पर छोड़ता है। अनुवाद इसी अंतर्पाठीय संबंध तथा दाऊद के कारण दिखाए गए लिहाज़ को बनाए रखता है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सहज हिन्दी। ईश्वर द्वारा सुलैमान को किए गए एकवचन संबोधन के अनुरूप ‘तेरे’ रखा गया है। मूल पाठ में वस्तु अप्रकट है; हिन्दी में ‘ऐसा’ और ‘इसे’ पिछले पद में उल्लिखित राज्य की ओर संकेत करते हैं।
