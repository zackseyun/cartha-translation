source:
  edition: WLC
  text: וַ/יְהִ֨י שָׂטָ֤ן לְ/יִשְׂרָאֵל֙ כָּל יְמֵ֣י שְׁלֹמֹ֔ה וְ/אֶת הָ/רָעָ֖ה אֲשֶׁ֣ר הֲדָ֑ד וַ/יָּ֨קָץ֙ בְּ/יִשְׂרָאֵ֔ל וַ/יִּמְלֹ֖ךְ עַל אֲרָֽם־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/025.yaml
  text: And he was an adversary to Israel all the days of Solomon[a], along with the harm that Hadad caused. And he loathed Israel and reigned over Aram.
translation:
  language: hi
  text: हदद द्वारा पहुँचाई गई हानि के साथ-साथ, वह सुलैमान के जीवन भर इस्राएल का विरोधी बना रहा।[a] उसने इस्राएल से घोर घृणा की और अराम पर राज्य किया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “हदद ने जो उपद्रव किया था, उसके अलावा भी।” इब्रानी वाक्यांश अपूर्ण है और इसका अर्थ यह हो सकता है कि यह विरोधी हदद द्वारा पहुँचाई गई हानि के अतिरिक्त उठ खड़ा हुआ।
    reason: alternative_reading
lexical_decisions:
- source_word: שָׂטָן
  choice: विरोधी
  rationale: यहाँ यह संज्ञा सुलैमान और इस्राएल के एक मानवीय राजनीतिक शत्रु के लिए प्रयुक्त है, न कि ‘शैतान’ नामक अलौकिक व्यक्ति के लिए।
- source_word: לְיִשְׂרָאֵל
  choice: इस्राएल का
  rationale: שָׂטָן के साथ ל उस पक्ष को बताता है जिसका वह विरोधी था; आधुनिक हिन्दी में ‘इस्राएल का विरोधी’ स्वाभाविक है।
- source_word: כָּל יְמֵי שְׁלֹמֹה
  choice: सुलैमान के जीवन भर
  rationale: यह कालसूचक पद सुलैमान के समस्त दिनों को दर्शाता है; ‘जीवन भर’ सहज हिन्दी है, यद्यपि प्रसंग में उसके शासनकाल का भाव भी सम्मिलित हो सकता है।
- source_word: וְאֶת הָרָעָה אֲשֶׁר הֲדָד
  choice: हदद से हुई हानि के साथ-साथ
  rationale: इब्रानी वाक्यांश अपूर्ण और कठिन है। רָעָה यहाँ नैतिक बुराई से अधिक इस्राएल को पहुँची हानि या विपत्ति को दर्शाता है; ‘साथ-साथ’ इसे एक अतिरिक्त विरोध के रूप में व्यक्त करता है।
- source_word: וַיָּקָץ בְּיִשְׂרָאֵל
  choice: उसने इस्राएल से घोर घृणा की
  rationale: קוץ यहाँ तीव्र विरक्ति और घृणा व्यक्त करता है। ‘घोर घृणा’ उस प्रबल शत्रुता को स्वाभाविक और dignified हिन्दी में बनाए रखता है।
- source_word: וַיִּמְלֹךְ עַל אֲרָם
  choice: अराम पर राज्य किया
  rationale: מלך का अर्थ यहाँ राजा के रूप में शासन करना है। अराम मूल भौगोलिक नाम है, इसलिए उसे बाद के नाम ‘सीरिया’ से नहीं बदला गया।
theological_decisions:
- issue: क्या שָׂטָן को व्यक्तिवाचक नाम ‘शैतान’ समझा जाए
  choice: मानवीय ‘विरोधी’
  alternative: शैतान
  rationale: संदर्भ सुलैमान के विरुद्ध उठे राजनीतिक शत्रुओं का है। यहाँ शब्द जातिवाचक संज्ञा है; ‘शैतान’ करने से बाद की दुष्टात्मा-संबंधी धारणा अनुचित रूप से पाठ में आ जाएगी।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज किंतु गरिमापूर्ण कथात्मक स्तर रखा गया है। ‘विरोधी’ मानवीय राजनीतिक अर्थ को स्पष्ट करता है; कठिन और अपूर्ण इब्रानी उपवाक्य की अनिश्चितता पादटिप्पणी में सुरक्षित रखी गई है।
