  yaml_path: translation/ot/1_kings/011/042.yaml
  text: And the days that Solomon reigned in Jerusalem over all Israel were forty years.
translation:
  language: hi
  text: और जितने दिन सुलैमान ने यरूशलेम में समस्त इस्राएल पर राज्य किया, वे चालीस वर्ष थे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/הַ/יָּמִים
  choice: और जितने दिन
  rationale: וְ कथा-संबंध को ‘और’ से बनाए रखता है; הַיָּמִים को अवधि बताने वाले इब्रानी मुहावरे के रूप में स्वाभाविक हिन्दी ‘जितने दिन’ से व्यक्त किया गया है।
- source_word: אֲשֶׁר
  choice: जितने
  rationale: संबंधवाचक उपवाक्य को मुख्य वाक्य के ‘वे’ से जोड़कर मूल संरचना और अवधि का भाव सुरक्षित रखा गया है।
- source_word: מָלַךְ
  choice: राज्य किया
  rationale: यहाँ काल क्रिया राजकीय शासन करने को दर्शाती है; ‘राज्य किया’ हिन्दी बाइबलीय गद्य में स्पष्ट और प्रतिष्ठित अभिव्यक्ति है।
- source_word: שְׁלֹמֹה
  choice: सुलैमान
  rationale: व्यक्तिनाम का प्रचलित मानक हिन्दी रूप अपनाया गया है।
- source_word: בִ/ירוּשָׁלִַם
  choice: यरूशलेम में
  rationale: בְּ यहाँ स्थानवाचक है, इसलिए ‘में’ स्वाभाविक और सटीक है।
- source_word: עַל כָּל יִשְׂרָאֵל
  choice: समस्त इस्राएल पर
  rationale: עַל राजकीय अधिकार का संबंध बताता है; ‘समस्त इस्राएल’ सामूहिक राष्ट्रीय संदर्भ और כָּל की व्यापकता बनाए रखता है।
- source_word: אַרְבָּעִים שָׁנָה
  choice: चालीस वर्ष
  rationale: शासनकाल की अवधि बताने वाली संख्या और संज्ञा का सीधा हिन्दी रूप है।
