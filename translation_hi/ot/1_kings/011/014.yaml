base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/014.yaml
  text: Then Yahweh raised up an adversary against Solomon[a], Hadad the Edomite; he was of the royal line in Edom.
translation:
  language: hi
  text: तब यहोवा ने सुलैमान के विरुद्ध एक विरोधी[a] खड़ा किया—एदोमी हदद। वह एदोम के राजवंश से था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इब्रानी: सातान; यहाँ इसका अर्थ ‘विरोधी’ या ‘प्रतिद्वंद्वी’ है, न कि व्यक्तिवाचक नाम ‘शैतान’।'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקֶם
  choice: खड़ा किया
  rationale: हिफ़ील रूप यहाँ किसी व्यक्ति को विरोध में उठाने या सक्रिय करने का भाव देता है। ‘खड़ा किया’ स्वाभाविक हिन्दी में परमेश्वर की सक्रिय भूमिका को बनाए रखता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: चतुर्वर्णीय निजी नाम को किसी उपाधि से बदलने के बजाय हिन्दी में प्रचलित नाम-रूप ‘यहोवा’ से व्यक्त किया गया है।
- source_word: שָׂטָן
  choice: एक विरोधी
  rationale: इस प्रसंग में यह जातिवाचक संज्ञा है, जिसका अर्थ विरोधी या शत्रु है; यह ‘शैतान’ का व्यक्तिवाचक नाम नहीं है।
- source_word: לִשְׁלֹמֹה
  choice: सुलैमान के विरुद्ध
  rationale: שָׂטָן के साथ לְ उस व्यक्ति को सूचित करता है जिसका विरोध किया जा रहा है।
- source_word: הֲדַד הָאֲדֹמִי
  choice: एदोमी हदद
  rationale: व्यक्तिनाम का मानक हिन्दी रूप रखा गया है और जातिवाचक विशेषण को स्वाभाविक हिन्दी क्रम में रखा गया है।
- source_word: מִזֶּרַע הַמֶּלֶךְ
  choice: राजवंश का
  rationale: शाब्दिक रूप से ‘राजा के वंश/बीज में से’ राजकीय वंशावली का मुहावरा है; ‘राजवंश का’ इसे संक्षिप्त और स्पष्ट रूप से व्यक्त करता है।
- source_word: הוּא בֶּאֱדוֹם
  choice: वह एदोम के राजवंश का था
  rationale: प्रबल सर्वनाम הוּא को ‘वह’ से बनाए रखते हुए अंतिम खंड को पिछले वंश-संबंधी वाक्यांश के साथ स्वाभाविक हिन्दी में जोड़ा गया है।
theological_decisions:
- issue: इस पद में שָׂטָן का अर्थ
  choice: जातिवाचक संज्ञा ‘विरोधी’
  alternative: व्यक्तिवाचक नाम ‘शैतान’
  rationale: वाक्य-विन्यास और संदर्भ में हदद ही सुलैमान का मानवीय-राजनीतिक विरोधी है। ‘विरोधी’ अनावश्यक रूप से बाद की दुष्ट आत्मिक सत्ता की धारणा आयात नहीं करता।
- issue: यहोवा द्वारा विरोधी खड़ा करना
  choice: परमेश्वर की सक्रिय भूमिका को सीधे व्यक्त किया गया
  alternative: केवल अनुमति देना या निष्क्रिय रूप से होने देना
  rationale: हिफ़ील क्रिया परमेश्वर को कर्ता बताती है; इसे मात्र अनुमति के रूप में नरम करना स्रोत-पाठ की धार्मिक तनातनी को घटा देता।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट हिन्दी। ‘एदोमी हदद’ हिन्दी की स्वाभाविक विशेषण-संज्ञा रचना है। डैश हदद को पहले आए ‘एक विरोधी’ की पहचान के रूप में स्पष्ट करता है।
