base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/023.yaml
  text: And God raised up for him an adversary[a], Rezon son of Eliada, who had fled from Hadadezer king of Zobah, his master.
translation:
  language: hi
  text: और परमेश्वर ने उसके विरुद्ध एक विरोधी[a] खड़ा किया—एल्यादा का पुत्र रजोन, जो अपने स्वामी, सोबा के राजा हददेजेर से भाग गया था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी शब्द ‘सातान’ है; यहाँ यह व्यक्तिवाचक नाम ‘शैतान’ नहीं, बल्कि ‘विरोधी’ या ‘प्रतिद्वंद्वी’ के अर्थ में प्रयुक्त हुआ है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקֶם
  choice: खड़ा किया
  rationale: हिफ़ील रूप का अर्थ किसी को उठाना या सामने खड़ा करना है; राजनीतिक विरोधी को सक्रिय रूप से सामने लाने के लिए यह स्वाभाविक हिन्दी है।
- source_word: אֱלֹהִים
  choice: परमेश्वर
  rationale: इस कथा में इस्राएल के परमेश्वर का उल्लेख है; आधुनिक हिन्दी बाइबलीय शैली में यह स्पष्ट और प्रतिष्ठित रूप है।
- source_word: לוֹ
  choice: उसके विरुद्ध
  rationale: לְ का शाब्दिक अर्थ ‘उसके लिए’ हो सकता है, पर ‘विरोधी खड़ा किया’ के साथ प्रसंगगत संबंध विरोध का है; हिन्दी में ‘उसके लिए एक विरोधी’ अस्वाभाविक और भ्रामक होगा।
- source_word: שָׂטָן
  choice: एक विरोधी
  rationale: यहाँ यह व्यक्तिवाचक नाम नहीं, बल्कि मानवीय राजनीतिक प्रतिद्वंद्वी के लिए प्रयुक्त जातिवाचक संज्ञा है।
- source_word: רְזוֹן
  choice: रजोन
  rationale: इब्रानी नाम का देवनागरी लिप्यंतरण।
- source_word: בֶּן אֶלְיָדָע
  choice: एल्यादा का पुत्र
  rationale: इब्रानी पुत्र-संबंधी रचना का स्वाभाविक हिन्दी रूप।
- source_word: אֲשֶׁר בָּרַח
  choice: जो ... भाग गया था
  rationale: यह घटना मुख्य कथन से पहले की पृष्ठभूमि बताती है; ‘गया था’ उस पूर्वकालिक संबंध को स्पष्ट करता है।
- source_word: מֵאֵת הֲדַדְעֶזֶר
  choice: हददेजेर के पास से
  rationale: מֵאֵת किसी व्यक्ति से अलग होने को व्यक्त करता है; सेवक-स्वामी संबंध के संदर्भ में ‘के पास से’ स्वाभाविक हिन्दी है।
- source_word: מֶלֶךְ צוֹבָה
  choice: सोबा के राजा
  rationale: इब्रानी संबंधसूचक पदबंध का सीधा हिन्दी रूप; स्थान-नाम का लिप्यंतरण किया गया है।
- source_word: אֲדֹנָיו
  choice: अपने स्वामी
  rationale: राजनीतिक-सेवकीय अधीनता के प्रसंग में ‘स्वामी’ उपयुक्त है; ‘अपने’ से स्पष्ट होता है कि हददेजेर रजोन का स्वामी था।
theological_decisions:
- issue: שָׂטָן का प्रसंगगत अर्थ
  choice: जातिवाचक संज्ञा ‘विरोधी’
  alternative: व्यक्तिवाचक नाम ‘शैतान’
  rationale: पद रजोन नामक मानवीय राजनीतिक विरोधी का वर्णन करता है। ‘शैतान’ लिखने से वह दुष्ट आत्मिक व्यक्तित्व होने का ऐसा दावा जुड़ जाएगा जो यहाँ मूल पाठ नहीं करता।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। अपपद रचना को हिन्दी में स्वाभाविक बनाने के लिए रजोन से पहले दीर्घ विराम लगाया गया है। ‘उसके विरुद्ध’ प्रसंगगत अर्थ को स्पष्ट करता है, जबकि पादटिप्पणी שָׂטָן की संभावित धार्मिक गलतफहमी रोकती है।
