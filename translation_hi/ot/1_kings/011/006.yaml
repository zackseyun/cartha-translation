source:
  edition: WLC
  text: וַ/יַּ֧עַשׂ שְׁלֹמֹ֛ה הָ/רַ֖ע בְּ/עֵינֵ֣י יְהוָ֑ה וְ/לֹ֥א מִלֵּ֛א אַחֲרֵ֥י יְהוָ֖ה כְּ/דָוִ֥ד אָבִֽי/ו׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/006.yaml
  text: So Solomon did what was evil in the eyes of Yahweh[a], and he did not fully follow Yahweh, as David his father had done.
translation:
  language: hi
  text: इस प्रकार सुलैमान ने वह किया जो यहोवा की दृष्टि में बुरा था, और उसने यहोवा का पूरी तरह अनुसरण नहीं किया, जैसा उसके पिता दाऊद ने किया था।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वह पूरी तरह यहोवा के पीछे नहीं चला।” इब्रानी मुहावरा अधूरी निष्ठा या आज्ञाकारिता का भाव व्यक्त करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: ने...किया
  rationale: यहाँ עשה सुलैमान के आचरण को बताता है; हिंदी में ‘वह किया जो...बुरा था’ स्वाभाविक रूप से इब्रानी रचना का अर्थ देता है।
- source_word: הָרַע
  choice: जो...बुरा था
  rationale: संज्ञा के रूप में प्रयुक्त विशेषण का अर्थ ‘बुराई’ अथवा ‘जो बुरा था’ है; इस प्रसंग में यह नैतिक बुराई को स्पष्ट करता है।
- source_word: בְּעֵינֵי יְהוָה
  choice: यहोवा की दृष्टि में
  rationale: यह इब्रानी का प्रचलित मूल्यांकन-सूचक मुहावरा है; ‘की दृष्टि में’ उसके रूपक और अर्थ दोनों को सहज हिंदी में बनाए रखता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: व्यक्तिगत दिव्य नाम יהוה को किसी उपाधि से बदलने के बजाय हिंदी में प्रचलित लिप्यंतरण ‘यहोवा’ से व्यक्त किया गया है।
- source_word: מִלֵּא אַחֲרֵי
  choice: पूरी तरह...के पीछे चला
  rationale: यह मुहावरा पूर्ण निष्ठा और आज्ञाकारिता के साथ अनुसरण करने का भाव रखता है। ‘पूरी तरह...के पीछे चला’ मूल रूपक को सुरक्षित रखते हुए समझने योग्य है।
- source_word: כְּדָוִד אָבִיו
  choice: अपने पिता दाऊद के समान
  rationale: यह दाऊद के अनुसरण के आदर्श से तुलना करता है; हिंदी वाक्य में संदर्भ से क्रिया स्वतः समझ में आती है।
theological_decisions:
- issue: दिव्य नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: मूल पाठ व्यक्तिगत वाचा-नाम का प्रयोग करता है। ‘यहोवा’ आधुनिक हिंदी बाइबल परंपरा में व्यापक और साधारण पाठकों के लिए पहचाना हुआ रूप है, जबकि इसे केवल ‘प्रभु’ कहना नाम को उपाधि से बदल देता।
- issue: מִלֵּא אַחֲרֵי יְהוָה में सुलैमान की विफलता की सीमा
  choice: पूरी तरह यहोवा के पीछे नहीं चला
  alternative: यहोवा के प्रति पूरी तरह समर्पित नहीं रहा
  rationale: मूल मुहावरा अपूर्ण अनुसरण अथवा निष्ठा बताता है। चुना हुआ पाठ इस पद से अकेले पूर्ण धर्मत्याग का निष्कर्ष नहीं जोड़ता और मूल के अनुसरण-संबंधी रूपक को बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य हिंदी पाठक के लिए सहज रखी गई है। ‘की दृष्टि में’ और ‘के पीछे चला’ जैसे पद मूल इब्रानी मुहावरों को यथासंभव बनाए रखते हैं; पादटिप्पणी दूसरे स्वाभाविक अर्थ को स्पष्ट करती है।
