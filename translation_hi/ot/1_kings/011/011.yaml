id: 1KI.11.11
reference: 1 Kings 11:11
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוָ֜ה לִ/שְׁלֹמֹ֗ה יַ֚עַן אֲשֶׁ֣ר הָֽיְתָה זֹּ֣את עִמָּ֔/ךְ וְ/לֹ֤א שָׁמַ֨רְתָּ֙ בְּרִיתִ֣/י וְ/חֻקֹּתַ֔/י אֲשֶׁ֥ר צִוִּ֖יתִי עָלֶ֑י/ךָ קָרֹ֨עַ אֶקְרַ֤ע אֶת הַ/מַּמְלָכָה֙ מֵֽ/עָלֶ֔י/ךָ וּ/נְתַתִּ֖י/הָ לְ/עַבְדֶּֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/011.yaml
  text: So Yahweh said to Solomon[a], “Because this has been with you, and you have not kept my covenant and my statutes that I commanded you, I will surely tear the kingdom away from you and give it to your servant.”
translation:
  language: hi
  text: तब याहवे ने सुलैमान से कहा, “चूँकि तुम्हारा आचरण ऐसा रहा है[a], और तुमने मेरी वाचा और उन विधियों का पालन नहीं किया, जिनका पालन करने की आज्ञा मैंने तुम्हें दी थी, इसलिए मैं निश्चय ही राज्य को तुमसे छीन लूँगा और उसे तुम्हारे सेवक को दे दूँगा।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “यह तुम्हारे साथ रहा है।” इब्रानी अभिव्यक्ति सुलैमान के स्थायी आचरण या दशा की ओर संकेत करती है।
    reason: मूल इब्रानी मुहावरे की वास्तविक अस्पष्टता और अधिक शाब्दिक रूप सुरक्षित रखना।
lexical_decisions:
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिन्दी में परमेश्वर के व्यक्तिगत नाम के प्रचलित लिप्यंतरण ‘यहोवा’ का प्रयोग किया गया है; इसे किसी उपाधि से प्रतिस्थापित नहीं किया गया।
- source_word: הָיְתָה זֹּאת עִמָּךְ
  choice: तुम्हारा आचरण ऐसा रहा है
  rationale: शाब्दिक रूप ‘यह तुम्हारे साथ रहा है’ हिन्दी में अस्पष्ट और अस्वाभाविक होगा। प्रसंग में यह सुलैमान की स्थायी दशा या आचरण को सूचित करता है; ‘आचरण’ इस अर्थ को स्पष्ट करता है, जबकि पादटिप्पणी मूल की संक्षिप्तता और सम्भावित दशा-केंद्रित अर्थ बचाती है।
- source_word: שָׁמַרְתָּ
  choice: पालन नहीं किया
  rationale: वाचा और विधियों के संदर्भ में שׁמר का स्वाभाविक आधुनिक हिन्दी रूप ‘पालन करना’ है।
- source_word: בְּרִיתִי
  choice: मेरी वाचा
  rationale: ‘वाचा’ בְּרִית के विधिक और धर्मवैचारिक भार को सुरक्षित रखती है।
- source_word: חֻקֹּתַי
  choice: मेरी विधियाँ
  rationale: ‘विधियाँ’ חֻקּוֹת के लिए स्पष्ट, गरिमापूर्ण और आधुनिक हिन्दी पद है।
- source_word: קָרֹעַ אֶקְרַע
  choice: निश्चय ही ... छीन लूँगा
  rationale: क्रिया के साथ प्रयुक्त infinitive absolute की emphatic certainty को ‘निश्चय ही’ व्यक्त करता है; राज्य के हटाए जाने के प्रसंग में ‘छीन लेना’ स्वाभाविक हिन्दी है।
- source_word: הַמַּמְלָכָה
  choice: राज्य
  rationale: यहाँ शब्द सुलैमान के अधीन राजकीय क्षेत्र और शासन को सूचित करता है; ‘राज्य’ सर्वाधिक स्वाभाविक है।
- source_word: לְעַבְדֶּךָ
  choice: तुम्हारे सेवक को
  rationale: यहाँ עֶבֶד राजकीय अधीनस्थ को सूचित करता है; ‘सेवक’ दासत्व का अनावश्यक रूप से अधिक प्रबल अर्थ जोड़े बिना दरबारी संदर्भ को व्यक्त करता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: मूल पाठ में व्यक्तिगत चतुरक्षरीय नाम है। हिन्दी में परिचित नामरूप ‘यहोवा’ उसका नामगत स्वरूप सुरक्षित रखता है, जबकि ‘प्रभु’ उसे उपाधि में बदल देता।
- issue: הָיְתָה זֹּאת עִמָּךְ का आशय
  choice: सुलैमान के निरंतर आचरण के रूप में प्रस्तुत
  alternative: ‘यह तुम्हारे साथ रहा है’ अथवा ‘तुम्हारी दशा ऐसी रही है’
  rationale: निकटवर्ती प्रसंग सुलैमान के अन्य देवताओं की ओर मुड़ने को दंड का आधार बनाता है। फिर भी मूल वाक्यांश आचरण और दशा के बीच कुछ अस्पष्टता रखता है, इसलिए वैकल्पिक अधिक शाब्दिक अर्थ पादटिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सहज शैली। कारण और परिणाम को स्पष्ट करने के लिए ‘चूँकि ... इसलिए’ संरचना अपनाई गई है। दिव्य नाम को उपाधि से नहीं बदला गया और इब्रानी मुहावरे की अस्पष्टता पादटिप्पणी में सुरक्षित रखी गई है।
