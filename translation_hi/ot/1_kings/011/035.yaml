- source_word: הַמְּלוּכָה
  choice: राज्य
  rationale: यह सुलैमान के वंश के अधीन राजकीय शासन और उसके क्षेत्र को सूचित करता है; आधुनिक हिन्दी में ‘राज्य’ स्वाभाविक और प्रसंगानुकूल है।
- source_word: מִיַּד בְּנוֹ
  choice: उसके पुत्र के हाथ से
  rationale: हिब्रू मुहावरे की ‘हाथ’ वाली छवि को रखा गया है; इसका आशय पुत्र के अधिकार या नियंत्रण से राज्य हटाना है।
- source_word: וּנְתַתִּיהָ לְּךָ
  choice: और उसे तुझे दे दूँगा
  rationale: स्त्रीलिंग प्रत्यय का संकेत ‘राज्य’ की ओर है। ‘दे दूँगा’ भविष्य के भाव और पूर्ण हस्तांतरण को सहज हिन्दी में व्यक्त करता है।
- source_word: אֵת עֲשֶׂרֶת הַשְּׁבָטִים
  choice: अर्थात् दस गोत्र
  rationale: यह पदबंध दिए जाने वाले राज्य को दस गोत्रों के रूप में स्पष्ट करता है। ‘अर्थात्’ हिब्रू की समानाधिकरणात्मक रचना को स्पष्ट, स्वाभाविक हिन्दी में दर्शाता है।
