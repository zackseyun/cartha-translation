  yaml_path: translation/ot/1_kings/011/035.yaml
  text: But I will take the kingdom from the hand of his son and give it to you[b][a], the ten tribes.
translation:
  language: hi
  text: परन्तु मैं उसके पुत्र के हाथ से राज्य ले लूँगा[a] और उसे तुझे दे दूँगा—दस गोत्र[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘उसके पुत्र के हाथ से’ एक हिब्रू मुहावरा है, जिसका अर्थ है उसके पुत्र के अधिकार या नियंत्रण से राज्य ले लेना।
    reason: cultural_note
  - marker: b
    text: 'शाब्दिक रूप से: ‘और उसे तुझे दे दूँगा, दस गोत्र।’ अंतिम पदबंध स्पष्ट करता है कि राज्य के रूप में दस गोत्र दिए जाएँगे।'
    reason: lexical_alternative
