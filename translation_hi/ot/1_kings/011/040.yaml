  to: तब सुलैमान ने यारोबाम को मार डालने की कोशिश की[a]। पर यारोबाम उठकर मिस्र को भाग गया—मिस्र के राजा शीशक के पास—और सुलैमान की मृत्यु तक मिस्र में रहा।
