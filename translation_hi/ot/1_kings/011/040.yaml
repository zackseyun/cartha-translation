  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, स्पष्ट कथात्मक शैली रखी गई है। ‘उठकर’ से इब्रानी कथात्मक संक्रमण बचाया गया है; डैश से मिस्र के राजा शीशक के पास जाने वाला स्पष्टीकरण सुबोध बनाया गया है।
