  text: וַ/יְבַקֵּ֥שׁ שְׁלֹמֹ֖ה לְ/הָמִ֣ית אֶת יָרָבְעָ֑ם וַ/יָּ֣קָם יָרָבְעָ֗ם וַ/יִּבְרַ֤ח מִצְרַ֨יִם֙ אֶל שִׁישַׁ֣ק מֶֽלֶךְ מִצְרַ֔יִם וַ/יְהִ֥י בְ/מִצְרַ֖יִם עַד מ֥וֹת שְׁלֹמֹֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/040.yaml
  text: Then Solomon sought to put Jeroboam to death[a], but Jeroboam arose and fled to Egypt, to Shishak king of Egypt[b], and he was in Egypt until the death of Solomon.
translation:
  language: hi
  text: तब सुलैमान ने यारोबाम को मार डालने की कोशिश की[a]। पर यारोबाम उठकर मिस्र को भाग गया—मिस्र के राजा शीशक के पास—और सुलैमान की मृत्यु तक मिस्र में रहा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “यारोबाम को मार डालने का प्रयत्न किया।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְבַקֵּשׁ
  choice: कोशिश की
  rationale: यहाँ בקש इच्छा भर नहीं, बल्कि किसी कार्य को करने का प्रयत्न व्यक्त करता है; ‘कोशिश की’ आधुनिक हिन्दी में स्वाभाविक है और सफलता का संकेत नहीं देता।
- source_word: לְהָמִית
  choice: मरवा डालने
  rationale: מות का हिफ़ईल रूप कारणवाचक है। ‘मरवा डालने’ सुलैमान द्वारा यारोबाम की मृत्यु कराए जाने के आशय को स्पष्ट और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וַיָּקָם
  choice: उठकर
  rationale: कथात्मक क्रम में קום निर्णायक कार्रवाई आरम्भ करने को दिखाता है; अगले क्रियापद के साथ ‘उठकर ... भाग गया’ स्वाभाविक हिन्दी है।
- source_word: וַיִּבְרַח
  choice: भाग गया
  rationale: ברח खतरे से पलायन को व्यक्त करता है; ‘भाग गया’ सामान्य आधुनिक हिन्दी में स्पष्ट है।
- source_word: מִצְרַיִם ... אֶל שִׁישַׁק מֶלֶךְ מִצְרַיִם
  choice: मिस्र को ... मिस्र के राजा शीशक के पास
  rationale: पहला ‘मिस्र’ गंतव्य है और אֶל शीशक के पास जाने को निर्दिष्ट करता है। अनुवाद देश और शासक दोनों को रखते हुए हिन्दी में संबंध स्पष्ट करता है।
- source_word: וַיְהִי בְמִצְרַיִם
  choice: मिस्र में ही रहा
  rationale: शाब्दिक अर्थ ‘मिस्र में था’ है, पर עַד के साथ यह लगातार निवास का भाव देता है; ‘रहा’ आधुनिक हिन्दी में अधिक स्वाभाविक है।
- source_word: עַד מוֹת שְׁלֹמֹה
  choice: सुलैमान की मृत्यु तक
  rationale: यह इब्रानी की संज्ञात्मक रचना का सीधा, संक्षिप्त और स्वाभाविक हिन्दी रूप है।
