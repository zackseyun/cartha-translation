review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys Solomon's attempt to cause Jeroboam's death, Jeroboam's flight to Egypt and to Shishak, and his remaining there until Solomon's death. However, the Hindi compound “मरवा डालने” can introduce an unnecessarily colloquial and possibly indirect nuance (‘have someone killed’) that is not required by the Hebrew Hiphil and is less suitable for the narrative register.
  naturalness: The sentence is generally natural modern standard Hindi. Replacing “मरवा डालने” with “मार डालने” gives a more idiomatic, direct, and appropriately serious rendering. “उठकर ... भाग गया” and “मिस्र में रहा” are natural in context.
  terminology: “सुलैमान,” “यारोबाम,” “मिस्र,” and “शीशक” are consistent and suitable. “मार डालने” adequately represents the causative Hebrew in idiomatic Hindi without importing a specific mechanism of killing.
  issues:
  - severity: medium
    issue: “मरवा डालने” is not the best rendering of לְהָמִית in this context.
    rationale: Although the Hiphil is causative, “मरवाना” commonly suggests arranging for another person to kill someone and can sound colloquial. The Hebrew states Solomon's intention to put Jeroboam to death without specifying agency or method. “मार डालने” is direct, natural, and preserves the intended lethal action without adding such a nuance.
  revised_text: तब सुलैमान ने यारोबाम को मार डालने की कोशिश की[a]। पर यारोबाम उठकर मिस्र को भाग गया—मिस्र के राजा शीशक के पास—और सुलैमान की मृत्यु तक मिस्र में रहा।
