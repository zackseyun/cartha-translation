  to: परन्तु मैं उसके हाथ से पूरा राज्य नहीं लूँगा, क्योंकि मैं उसे उसके जीवन भर शासक ठहराऊँगा, अपने सेवक दाऊद के कारण, जिसे मैंने चुना था और जिसने मेरी आज्ञाओं और विधियों का पालन किया।
