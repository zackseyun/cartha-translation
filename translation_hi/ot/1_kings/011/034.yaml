review_pass:
  verdict: revise
  source_fidelity: Draft preserves the principal sense, including the whole kingdom, Davidic motive, and lifelong rule. However, ‘बल्कि’ introduces an adversative contrast not present in the Hebrew at that point, while the explicit causal relation expressed by כִּי (‘because/for’) is less direct. Reordering is possible in Hindi, but the causal sequence should remain clear.
  naturalness: The draft is generally natural modern Hindi. The revised wording is more direct and avoids the slightly awkward pairing of ‘फिर भी ... बल्कि’.
  terminology: ‘शासक’ is an appropriate modern rendering of נָשִׂיא in this context. ‘आज्ञाओं और विधियों’ suitably preserves the distinction between commandments and statutes. ‘अपने सेवक दाऊद के कारण’ accurately conveys the stated Davidic basis.
  issues:
  - severity: medium
    issue: The conjunction ‘बल्कि’ is not supported by the source and obscures the explicit causal clause.
    rationale: The Hebrew says that the whole kingdom will not be taken from him because God will make/appoint him as ruler for all his life, for David’s sake. Hindi should use ‘क्योंकि’ (or equivalent) rather than add a contrastive ‘बल्कि’.
  revised_text: परन्तु मैं उसके हाथ से पूरा राज्य नहीं लूँगा, क्योंकि मैं उसे उसके जीवन भर शासक ठहराऊँगा, अपने सेवक दाऊद के कारण, जिसे मैंने चुना था और जिसने मेरी आज्ञाओं और विधियों का पालन किया।
  revised_footnotes: []
  revision_rationale: 'The revision restores the source’s explicit causal progression: the kingdom is not wholly removed because he is appointed as ruler for life, and this is for David’s sake. It retains the draft’s sound terminology and does not add interpretive qualification.'
