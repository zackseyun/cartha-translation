id: 1KI.11.34
reference: 1 Kings 11:34
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/לֹֽא אֶקַּ֥ח אֶת כָּל הַ/מַּמְלָכָ֖ה מִ/יָּד֑/וֹ כִּ֣י נָשִׂ֣יא אֲשִׁתֶ֗/נּוּ כֹּ֚ל יְמֵ֣י חַיָּ֔י/ו לְמַ֨עַן דָּוִ֤ד עַבְדִּ/י֙ אֲשֶׁ֣ר בָּחַ֣רְתִּי אֹת֔/וֹ אֲשֶׁ֥ר שָׁמַ֖ר מִצְוֺתַ֥/י וְ/חֻקֹּתָֽ/י־־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/034.yaml
  text: But I will not take the whole kingdom out of his hand, because I will make him ruler all the days of his life, for the sake of David my servant, whom I chose, who kept my commandments and my statutes.
translation:
  language: hi
  text: परन्तु मैं उसके हाथ से पूरा राज्य नहीं लूँगा, क्योंकि मैं उसे उसके जीवन भर शासक ठहराऊँगा, अपने सेवक दाऊद के कारण, जिसे मैंने चुना था और जिसने मेरी आज्ञाओं और विधियों का पालन किया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נָשִׂיא
  choice: शासक
  rationale: यहाँ शब्द राजकीय अधिकार रखने वाले व्यक्ति को दर्शाता है। ‘शासक’ आधुनिक हिन्दी में स्वाभाविक है और ‘प्रधान’ या ‘राजकुमार’ की संभावित भ्रामक ध्वनियों से बचता है।
- source_word: אֲשִׁתֶנּוּ
  choice: उसे ... बनाए रखूँगा
  rationale: शाब्दिक अर्थ ‘मैं उसे ठहराऊँगा/बनाऊँगा’ है; जीवन भर की अवधि और सुलैमान की वर्तमान स्थिति के संदर्भ में ‘बनाए रखूँगा’ आशय को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: מִצְוֺתַי וְחֻקֹּתָי
  choice: मेरी आज्ञाओं और विधियों
  rationale: दो अलग इब्रानी विधिक पदों को अलग रखते हुए प्रचलित और गरिमापूर्ण हिन्दी दी गई है।
- source_word: לְמַעַן דָּוִד עַבְדִּי
  choice: अपने सेवक दाऊद के कारण
  rationale: לְמַעַן का कारण/हित सूचक बल सुरक्षित रहता है और वाक्य हिन्दी में स्पष्ट सुनाई देता है।
theological_decisions:
- issue: दाऊद के आज्ञापालन का कथन
  choice: ‘जिसने मेरी आज्ञाओं और विधियों का पालन किया’ को बिना किसी व्याख्यात्मक योग के रखा गया
  alternative: इसे दाऊद के सामान्य जीवन-रुझान या किसी विशेष अवधि तक सीमित करके स्पष्ट करना
  rationale: मूल पाठ स्वयं ऐसा कोई सीमांकन नहीं करता; उसकी प्रशंसात्मक और तनावपूर्ण भाषा को ज्यों का त्यों रहने देना उचित है।
- issue: सुलैमान की सत्ता की अवधि
  choice: ‘उसके जीवन भर शासक बनाए रखूँगा’
  alternative: ‘उसके जीवन के सभी दिनों में उसे प्रधान ठहराऊँगा’
  rationale: यह अवधि और ईश्वरीय निर्णय दोनों को सुरक्षित रखते हुए आधुनिक हिन्दी में सत्ता जारी रहने का संदर्भ स्पष्ट करता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और सार्वजनिक पाठ के अनुकूल। ‘पूरा राज्य उसके हाथ से नहीं लूँगा’ में मूल का हाथ-संबंधी मुहावरा बनाए रखा गया है, जो हिन्दी में भी सहज है।
