base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/029.yaml
  text: And at that time[a], when Jeroboam went out from Jerusalem, Ahijah the Shilonite, the prophet, found him on the road. Now he had wrapped himself in a new cloak, and the two of them were alone in the open field.
translation:
  language: hi
  text: उस समय, जब यारोबाम यरूशलेम से बाहर निकला, शीलोवासी भविष्यद्वक्ता अहिय्याह उससे मार्ग में मिला। वह[a] एक नया चोगा ओढ़े हुए था, और वे दोनों मैदान में अकेले थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: मूल इब्रानी में यहाँ केवल “वह” है। इसका संकेत अहिय्याह की ओर जान पड़ता है, पर यारोबाम भी समझा जा सकता है।
    reason: इब्रानी सर्वनाम के संदर्भ की वास्तविक अस्पष्टता को सुरक्षित रखना।
lexical_decisions:
- source_word: וַיְהִי בָּעֵת הַהִיא
  choice: उस समय ऐसा हुआ कि
  rationale: यह इब्रानी कथात्मक सूत्र और समय-सूचना दोनों को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: יָצָא מִירוּשָׁלָם
  choice: यरूशलेम से बाहर निकला
  rationale: יָצָא की बाहर जाने की दिशात्मकता को बनाए रखता है।
- source_word: וַיִּמְצָא אֹתוֹ
  choice: उसे मार्ग में मिला
  rationale: מצא का मूल अर्थ ‘पाना’ है, पर व्यक्ति से मार्ग में हुई भेंट के इस प्रसंग में हिन्दी का ‘मिला’ अधिक स्वाभाविक है।
- source_word: אֲחִיָּה הַשִּׁילֹנִי הַנָּבִיא
  choice: शीलोवासी भविष्यद्वक्ता अहिय्याह
  rationale: स्थान-सूचक विशेषण और भविष्यद्वक्ता की पहचान को स्पष्ट, सहज हिन्दी क्रम में रखता है।
- source_word: בַּדֶּרֶךְ
  choice: मार्ग में
  rationale: ठोस मार्ग और रास्ते में हुई भेंट, दोनों भावों को संक्षेप में व्यक्त करता है।
- source_word: וְהוּא מִתְכַּסֶּה
  choice: अहिय्याह ने ... ओढ़ रखा था
  rationale: प्रतिभागी की अवस्था बताने वाले कृदन्त को हिन्दी में स्वाभाविक पृष्ठभूमिकाल से व्यक्त किया गया है; अस्पष्ट सर्वनाम को मुख्य पाठ में स्पष्ट किया गया है, जबकि पाठगत अस्पष्टता पादटिप्पणी में सुरक्षित है।
- source_word: בְּשַׂלְמָה חֲדָשָׁה
  choice: एक नया चोगा
  rationale: שַׂלְמָה एक बाहरी वस्त्र है; ‘चोगा’ आगामी पद में उसके फाड़े जाने के लिए उपयुक्त और सामान्य हिन्दी शब्द है।
- source_word: וּשְׁנֵיהֶם לְבַדָּם
  choice: वे दोनों ... अकेले थे
  rationale: किसी तीसरे व्यक्ति के उपस्थित न होने पर दिए गए बल को सहज हिन्दी में बनाए रखता है।
- source_word: בַּשָּׂדֶה
  choice: मैदान में
  rationale: שָׂדֶה का सीधा स्थानवाचक अर्थ देता है और ‘खुले’ जैसी अतिरिक्त व्याख्या नहीं जोड़ता।
theological_decisions:
- issue: וְהוּא में चोगा ओढ़े व्यक्ति की पहचान
  choice: मुख्य पाठ में अहिय्याह
  alternative: यारोबाम अथवा अस्पष्ट ‘वह’
  rationale: निकटतम व्याकरणिक कर्ता अहिय्याह है और अगली क्रिया में वही चोगा पकड़ता है; फिर भी इब्रानी सर्वनाम अपने आप में नाम नहीं बताता, इसलिए वास्तविक अस्पष्टता पादटिप्पणी में दर्ज की गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी, देवनागरी; कथात्मक, गरिमापूर्ण और सामान्य पाठक के लिए सहज शैली। नामों के लिए प्रचलित बाइबलीय रूप ‘यारोबाम’, ‘यरूशलेम’, ‘अहिय्याह’ और ‘शीलो’ अपनाए गए हैं।
