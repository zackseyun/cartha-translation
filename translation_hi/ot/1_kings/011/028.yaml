  text: וְ/הָ/אִ֥ישׁ יָרָבְעָ֖ם גִּבּ֣וֹר חָ֑יִל וַ/יַּ֨רְא שְׁלֹמֹ֜ה אֶת הַ/נַּ֗עַר כִּֽי עֹשֵׂ֤ה מְלָאכָה֙ ה֔וּא וַ/יַּפְקֵ֣ד אֹת֔/וֹ לְ/כָל סֵ֖בֶל בֵּ֥ית יוֹסֵֽף־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/028.yaml
  text: The man Jeroboam was a mighty man of valor[a], and Solomon saw that the young man was industrious[b], so he appointed him over all the labor force of the house of Joseph.
translation:
  language: hi
  text: यारोबाम एक बहुत योग्य व्यक्ति था[a]। सुलैमान ने देखा कि वह युवक मेहनती था, इसलिए उसने उसे यूसुफ के घराने[b] की सारी बेगार पर अधिकारी नियुक्त किया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘सामर्थी पुरुष’ अथवा ‘वीर पुरुष।’ हिब्रू पदबंध सामर्थ्य, वीरता या असाधारण योग्यता को सूचित कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: ‘यूसुफ का घराना’ यूसुफ के वंश से निकले गोत्रों, विशेषकर एप्रैम और मनश्शे, को दर्शाता है।
    reason: cultural_note
lexical_decisions:
- source_word: וְהָאִישׁ יָרָבְעָם
  choice: यारोबाम एक ... पुरुष था
  rationale: हिब्रू का वाव कथा को आगे बढ़ाता है; हिन्दी में अलग से ‘और’ या ‘अब’ जोड़ना आवश्यक नहीं। ‘पुरुष’ व्यक्ति के परिचय को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: גִּבּוֹר חָיִל
  choice: बहुत योग्य पुरुष
  rationale: यह पदबंध वीरता, सामर्थ्य और उल्लेखनीय योग्यता—इन सबका बोध करा सकता है। इस प्रशासनिक प्रसंग में ‘बहुत योग्य पुरुष’ स्वाभाविक है, जबकि अन्य संभावित अर्थ पादटिप्पणी में सुरक्षित हैं।
- source_word: הַנַּעַר
  choice: वह जवान
  rationale: נַעַר का अर्थ बालक, जवान या सेवक हो सकता है। यहाँ यारोबाम को बड़ी जिम्मेदारी दी जाती है, इसलिए ‘जवान’ उपयुक्त है।
- source_word: כִּי עֹשֵׂה מְלָאכָה הוּא
  choice: कि वह जवान मेहनती है
  rationale: शाब्दिक भाव ‘वह काम करनेवाला है’ है। नियुक्ति का कारण बताने वाले इस वाक्य में ‘मेहनती’ उसकी कर्मठता को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: וַיַּפְקֵד אֹתוֹ
  choice: उसने उसे ... पर अधिकारी ठहराया
  rationale: हिफ़ील रूप यहाँ किसी को काम या लोगों की देखरेख के लिए नियुक्त करने का अर्थ देता है।
- source_word: לְכָל סֵבֶל
  choice: सारे बेगार के काम पर
  rationale: סֵבֶל बोझ ढोने वाले श्रम अथवा राजकीय अनिवार्य श्रम को सूचित करता है। ‘बेगार का काम’ इस सामाजिक-प्रशासनिक अर्थ को संक्षेप और स्पष्ट रूप में व्यक्त करता है।
- source_word: בֵּית יוֹסֵף
  choice: यूसुफ के घराने
  rationale: मूल का वंशगत-जनजातीय पदनाम बनाए रखा गया है; उसका आशय पादटिप्पणी में स्पष्ट किया गया है।
