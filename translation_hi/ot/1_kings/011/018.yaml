base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/018.yaml
  text: They arose from Midian and came to Paran[a], and they took men with them from Paran, and they came to Egypt, to Pharaoh king of Egypt, and he gave him a house and assigned him food, and gave him land.
translation:
  language: hi
  text: वे मिद्यान से चल पड़े और पारान पहुँचे। उन्होंने पारान से पुरुषों को अपने साथ लिया और मिस्र आए, मिस्र के राजा फ़िरौन के पास। फ़िरौन ने उसे एक घर दिया, उसके लिए भोजन की व्यवस्था की[a], और उसे भूमि दी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शब्दशः, “और रोटी—उसने उसे कही”; यह एक असामान्य अभिव्यक्ति है। भाव यह है कि फ़िरौन ने उसके लिए भोजन या रसद की व्यवस्था करने का आदेश दिया।
    reason: मूल इब्रानी वाक्यांश असामान्य है; मुख्य पाठ में उसका संभावित मुहावरेदार अर्थ दिया गया है और पाद-टिप्पणी में शाब्दिक रूप तथा अर्थगत अनिश्चितता सुरक्षित रखी गई है।
lexical_decisions:
- source_word: וַיָּקֻמוּ מִמִּדְיָן
  choice: वे मिद्यान से चल पड़े
  rationale: קום यात्रा-वर्णन में प्रस्थान करने का मुहावरा है; ‘चल पड़े’ आधुनिक हिन्दी में स्वाभाविक रूप से गति और प्रस्थान दोनों व्यक्त करता है।
- source_word: וַיָּבֹאוּ פָּארָן
  choice: और पारान पहुँचे
  rationale: בוא का मूल अर्थ ‘आना’ है, पर आरम्भ-बिंदु से यात्रा के वर्णन में ‘पहुँचे’ लक्ष्य-स्थान पर आगमन को सहज हिन्दी में व्यक्त करता है। पारान स्थाननाम का लिप्यंतरण है।
- source_word: וַיִּקְחוּ אֲנָשִׁים עִמָּם מִפָּארָן
  choice: उन्होंने पारान से कुछ पुरुषों को अपने साथ लिया
  rationale: אֲנָשִׁים का लिंग-सटीक अर्थ ‘पुरुष’ रखा गया है। हिन्दी में अनिश्चित बहुवचन को स्वाभाविक बनाने के लिए ‘कुछ’ जोड़ा गया है; वाक्यांश दल में साथियों को लेने का संकेत देता है।
- source_word: אֶל פַּרְעֹה מֶלֶךְ מִצְרַיִם
  choice: मिस्र के राजा फ़िरौन के पास
  rationale: इब्रानी समानाधिकरण को स्पष्ट और स्वाभाविक हिन्दी पदक्रम में रखा गया है।
- source_word: וַיִּתֶּן לוֹ בַיִת
  choice: फ़िरौन ने उसे एक घर दिया
  rationale: पूर्ववर्ती पदबंध से कर्ता फ़िरौन स्पष्ट है; उसका नाम दोहराने से हिन्दी में सर्वनाम-संदेह दूर होता है। בַיִת को बिना अनावश्यक विस्तार के ‘घर’ किया गया है।
- source_word: וְלֶחֶם אָמַר לוֹ
  choice: उसके लिए भोजन की व्यवस्था की
  rationale: शब्दशः कठिन अभिव्यक्ति ‘और रोटी उसने उससे कही’ यहाँ भोजन या रसद नियत करने का भाव देती है। לֶחֶם के व्यापक अर्थ में ‘भोजन’ और प्रशासनिक प्रबंध के लिए ‘व्यवस्था की’ स्वाभाविक हैं; शाब्दिक रूप पाद-टिप्पणी में सुरक्षित है।
- source_word: וְאֶרֶץ נָתַן לוֹ
  choice: और उसे भूमि दी
  rationale: אֶרֶץ यहाँ फ़िरौन द्वारा दी गई भूमि या संपत्ति को सूचित करता है; ‘भूमि’ अर्थ की व्यापकता बनाए रखता है और इसे पूरे देश के रूप में नहीं ठहराता।
