source:
  edition: WLC
  text: וְ/צִוָּ֤ה אֵלָי/ו֙ עַל הַ/דָּבָ֣ר הַ/זֶּ֔ה לְ/בִ֨לְתִּי לֶ֔כֶת אַחֲרֵ֖י אֱלֹהִ֣ים אֲחֵרִ֑ים וְ/לֹ֣א שָׁמַ֔ר אֵ֥ת אֲשֶׁר צִוָּ֖ה יְהוָֽה־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/010.yaml
  text: and had commanded him concerning this matter[a], not to go after other gods, but he did not keep what Yahweh had commanded.
translation:
  language: hi
  text: और उसने उसे इस विषय में आज्ञा दी थी कि वह दूसरे देवताओं के पीछे न चले[a], फिर भी उसने यहोवा की आज्ञा का पालन नहीं किया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में “दूसरे देवताओं के पीछे चलना” उनकी ओर मुड़ने और उनकी उपासना करने का प्रचलित वाचा-संबंधी मुहावरा है।
    reason: cultural_note
lexical_decisions:
- source_word: וְצִוָּה אֵלָיו
  choice: और उसने उसे ... आज्ञा दी थी
  rationale: संदर्भ में यह पहले दी गई आज्ञा को बताता है; हिंदी का पूर्ण भूतकाल पूर्ववर्ती क्रिया को स्वाभाविक रूप से व्यक्त करता है।
- source_word: עַל הַדָּבָר הַזֶּה
  choice: इस विषय में
  rationale: דבר यहाँ किसी शब्द मात्र के बजाय पहले उल्लिखित विषय या मामले को दर्शाता है।
- source_word: לְבִלְתִּי לֶכֶת
  choice: कि वह ... न चले
  rationale: यह रचना निषेधात्मक आज्ञा की विषयवस्तु व्यक्त करती है; हिंदी में यह रूप स्पष्ट और स्वाभाविक है।
- source_word: אַחֲרֵי אֱלֹהִים אֲחֵרִים
  choice: दूसरे देवताओं के पीछे
  rationale: मूल covenantal मुहावरे ‘पीछे चलना’ को बनाए रखता है, जिसका आशय उनकी ओर मुड़ना और उनकी उपासना करना है।
- source_word: וְלֹא שָׁמַר
  choice: फिर भी उसने ... पालन नहीं किया
  rationale: वाव यहाँ पूर्व आज्ञा और सुलैमान की अवज्ञा के बीच स्पष्ट विरोध दर्शाता है; שמר का आज्ञा के संदर्भ में स्वाभाविक अर्थ ‘पालन करना’ है।
- source_word: אֵת אֲשֶׁר צִוָּה יְהוָה
  choice: यहोवा की आज्ञा का
  rationale: यह संक्षिप्त हिंदी अभिव्यक्ति ‘जिसकी आज्ञा यहोवा ने दी थी’ की विषयवस्तु को सहज रूप में व्यक्त करती है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिंदी बाइबलीय प्रयोग में व्यापक रूप से पहचाना जाने वाला दैवी नाम, जो मूल के व्यक्तिवाचक नाम को उपाधि से नहीं बदलता।
theological_decisions:
- issue: दैवी नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे / प्रभु
  rationale: मूल पाठ में दैवी नाम प्रत्यक्ष है। ‘यहोवा’ आधुनिक हिंदी पाठकों में परिचित रूप है और इसे ‘प्रभु’ जैसी उपाधि से प्रतिस्थापित नहीं करता।
- issue: ‘दूसरे देवताओं के पीछे चलना’ मुहावरा
  choice: मुहावरे को मुख्य पाठ में बनाए रखा
  alternative: दूसरे देवताओं की उपासना करना
  rationale: मूल की वाचा-संबंधी भाषा और उसकी व्यापक अर्थ-छाया को सुरक्षित रखा गया है; पादटिप्पणी आशय स्पष्ट करती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य हिंदी पाठक के लिए सहज रखी गई है। ‘पालन नहीं किया’ आज्ञा-संदर्भ में ‘नहीं माना’ से थोड़ा अधिक औपचारिक और सटीक है।
