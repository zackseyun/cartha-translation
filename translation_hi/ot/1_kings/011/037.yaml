review_pass:
  verdict: revise
  source_fidelity: 'The draft correctly represents the sequence and force of the Hebrew: divine taking/appointment, reigning over the full scope of desire, and being king over Israel. However, the Hindi relative construction used for the desire expression is not grammatically natural.'
  naturalness: “जिसकी इच्छा तेरा मन करेगा” is awkward and unidiomatic in modern Hindi. “जिसे तेरा मन चाहेगा” is clear, natural, and retains the personified-desire structure sufficiently in the main text.
  terminology: “तुझे ले लूँगा,” “राज्य करेगा,” and “इस्राएल का राजा होगा” are appropriate. The footnote should state the literal Hebrew expression in idiomatic Hindi as “तेरा प्राण चाहेगा,” rather than the unnatural “तेरा प्राण इच्छा करेगा.”
  issues:
  - severity: medium
    issue: The phrase “जिसकी इच्छा तेरा मन करेगा” is grammatically awkward.
    rationale: In modern Hindi, मन is naturally the subject of चाहेगा, as in “जिसे तेरा मन चाहेगा.” The drafted construction obscures the relationship between desire and its object.
  - severity: low
    issue: The footnote's literal rendering “तेरा प्राण इच्छा करेगा” is not idiomatic Hindi.
    rationale: “तेरा प्राण चाहेगा” conveys the Hebrew wording more naturally while preserving the lexical image of נֶפֶשׁ.
  revised_text: और मैं तुझे ले लूँगा, और तू उस सब पर राज्य करेगा जिसे तेरा मन चाहेगा, और तू इस्राएल का राजा होगा।
  revised_footnotes:
  - marker: a
    text: या, “जिसकी तू इच्छा करेगा”; शाब्दिक रूप से, “जिसे तेरा प्राण चाहेगा।”
    reason: नֶפֶשׁ की हिब्रू अभिव्यक्ति के सरल और अधिक शाब्दिक विकल्प बताने के लिए।
  revision_rationale: संशोधन केवल हिंदी वाक्य-विन्यास और पादटिप्पणी की स्वाभाविकता को सुधारता है। मुख्य पाठ में “मन” आधुनिक हिंदी का सहज मुहावरा है; पादटिप्पणी में “प्राण” रखकर नֶפֶשׁ की शाब्दिक छवि और स्रोत-पारदर्शिता सुरक्षित रहती है।
