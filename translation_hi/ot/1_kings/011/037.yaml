reference: 1 Kings 11:37
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/אֹתְ/ךָ֣ אֶקַּ֔ח וּ/מָ֣לַכְתָּ֔ בְּ/כֹ֥ל אֲשֶׁר תְּאַוֶּ֖ה נַפְשֶׁ֑/ךָ וְ/הָיִ֥יתָ מֶּ֖לֶךְ עַל יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/037.yaml
  text: And I will take you[a], and you shall reign over all that your soul desires, and you shall be king over Israel.
translation:
  language: hi
  text: और मैं तुझे ले लूँगा, और तू उस सब पर राज्य करेगा जिसे तेरा मन चाहेगा, और तू इस्राएल का राजा होगा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֶקַּח
  choice: मैं तुझे ले लूँगा
  rationale: לקח का सामान्य और ठोस अर्थ ‘लेना’ है। यहाँ परमेश्वर द्वारा राजकीय नियुक्ति का संदर्भ है, फिर भी ‘चुनूँगा’ कहकर अर्थ को अनावश्यक रूप से व्याख्यायित करने के बजाय मूल क्रिया की ठोस अभिव्यक्ति रखी गई है।
- source_word: וּמָלַכְתָּ
  choice: तू ... राज्य करेगा
  rationale: מלך यहाँ केवल राजा बनने नहीं, बल्कि राजसत्ता चलाने या राज्य करने को व्यक्त करता है।
- source_word: בְּכֹל אֲשֶׁר
  choice: उस सब पर
  rationale: מלך के साथ בְ यहाँ शासन के क्षेत्र या विस्तार को सूचित करता है; हिंदी में ‘उस सब पर राज्य करेगा’ स्वाभाविक और अर्थ-संगत है।
- source_word: תְּאַוֶּה נַפְשֶׁךָ
  choice: जिसकी इच्छा तेरा मन करेगा
  rationale: נֶפֶשׁ का मूल अर्थ ‘प्राण/जीव/व्यक्ति’ भी हो सकता है, पर इस हिब्रू मुहावरे में वह व्यक्ति की भीतरी इच्छा को व्यक्त करता है। आधुनिक हिंदी में ‘तेरा मन इच्छा करेगा’ स्रोत की शारीरिक-मानवीय अभिव्यक्ति को कुछ हद तक बनाए रखते हुए ‘तेरा प्राण इच्छा करेगा’ से अधिक स्वाभाविक है।
- source_word: וְהָיִיתָ מֶּלֶךְ
  choice: तू ... राजा होगा
  rationale: היה + संज्ञा यहाँ प्राप्त होने वाली पदस्थिति को व्यक्त करता है; ‘राजा होगा’ इसकी सीधी और स्वाभाविक हिंदी है।
- source_word: עַל יִשְׂרָאֵל
  choice: इस्राएल का राजा
  rationale: राजत्व के संदर्भ में עַל अधिकार के क्षेत्र को दर्शाता है। हिंदी में ‘इस्राएल का राजा’ ‘इस्राएल पर राजा’ की अपेक्षा अधिक स्वाभाविक है और वही संबंध व्यक्त करता है।
theological_decisions:
- issue: मानव-स्वरूप संबंधी अभिव्यक्ति נֶפֶשׁ
  choice: मुख्य पाठ में ‘मन’ और पादटिप्पणी में शाब्दिक ‘प्राण’
  alternative: ‘तेरा प्राण इच्छा करेगा’ अथवा केवल ‘तू चाहेगा’
  rationale: यहाँ נֶפֶשׁ आत्मा के विषय में कोई तकनीकी धर्मवैज्ञानिक कथन नहीं, बल्कि इच्छा करने वाले व्यक्ति की हिब्रू अभिव्यक्ति है। ‘मन’ आधुनिक हिंदी में स्वाभाविक है; पादटिप्पणी स्रोत की शाब्दिक छवि और ‘तू चाहेगा’ वाले सरल विकल्प दोनों को सुरक्षित रखती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। संबोधन में एकवचन ‘तू’ मूल के निकट है और बाइबलीय प्रत्यक्ष वचन की प्रचलित हिंदी शैली के अनुकूल है।
