source:
  edition: WLC
  text: וַ/יְהִ֗י בִּֽ/הְי֤וֹת דָּוִד֙ אֶת אֱד֔וֹם בַּ/עֲל֗וֹת יוֹאָב֙ שַׂ֣ר הַ/צָּבָ֔א לְ/קַבֵּ֖ר אֶת הַ/חֲלָלִ֑ים וַ/יַּ֥ךְ כָּל זָכָ֖ר בֶּ/אֱדֽוֹם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/015.yaml
  text: And it happened[a], when David was in Edom, when Joab the commander of the army had gone up to bury the slain[b], that he struck down every male in Edom—
translation:
  language: hi
  text: और ऐसा हुआ कि जब दाऊद एदोम में था[a], तब सेनापति योआब मारे गए लोगों[b] को दफ़नाने के लिए ऊपर गया और उसने एदोम में हर पुरुष को मार डाला—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी का शाब्दिक रूप ‘जब दाऊद एदोम के साथ था’ है। इस सैन्य प्रसंग में इसका आशय दाऊद की एदोम में उपस्थिति या वहाँ चलाए गए अभियान से है।
    reason: lexical_alternative
  - marker: b
    text: अर्थात युद्ध या हिंसा में मारे गए लोग।
    reason: lexical_clarification
lexical_decisions:
- source_word: וַיְהִי
  choice: और ऐसा हुआ कि
  rationale: यह सामान्य इब्रानी कथात्मक सूत्र है, जो यहाँ पृष्ठभूमि की घटना का परिचय देता है। यह हिंदी में स्वाभाविक रहते हुए उसके कथात्मक कार्य को बनाए रखता है।
- source_word: בִּהְיוֹת דָּוִד אֶת אֱדוֹם
  choice: जब दाऊद एदोम में था[a]
  rationale: ב के साथ infinitive construct कालवाचक उपवाक्य बनाता है। אֶת אֱדוֹם का संबंध असामान्य और कुछ हद तक अस्पष्ट है; सैन्य प्रसंग में मुख्य पाठ के लिए दाऊद की एदोम में उपस्थिति सबसे स्वाभाविक अर्थ है।
- source_word: בַּעֲלוֹת יוֹאָב
  choice: तब ... योआब ... ऊपर गया
  rationale: עלה के मूल दिशात्मक अर्थ ‘ऊपर जाना’ को रखा गया है; कालवाचक रचना को हिंदी वाक्यक्रम में स्वाभाविक बनाया गया है।
- source_word: שַׂר הַצָּבָא
  choice: सेना का प्रधान
  rationale: यह आधिकारिक सैन्य पद को स्पष्ट, गरिमापूर्ण और सहज आधुनिक हिंदी में व्यक्त करता है।
- source_word: לְקַבֵּר
  choice: दफ़नाने के लिए
  rationale: ל के साथ infinitive यहाँ उद्देश्य बताता है।
- source_word: הַחֲלָלִים
  choice: मारे गए लोगों[b]
  rationale: यह शब्द सामान्य मृतकों के बजाय हिंसा या युद्ध में मारे गए लोगों को सूचित करता है; हिंदी पदबंध उसी भेद को स्पष्ट करता है।
- source_word: וַיַּךְ
  choice: उसने ... मार डाला
  rationale: इस सैन्य प्रसंग में נכה का अर्थ घातक प्रहार करना है। ‘मार डाला’ परिणाम को बिना नरम किए स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: כָּל זָכָר
  choice: हर पुरुष
  rationale: זָכָר विशेष रूप से पुरुष-लिंग के व्यक्ति को सूचित करता है। ‘हर पुरुष’ कथन की व्यापकता और कठोरता बनाए रखता है।
- source_word: בֶּאֱדוֹם
  choice: एदोम के
  rationale: हिंदी में ‘एदोम के हर पुरुष’ स्थान और जनसमूह के संबंध को स्वाभाविक रूप से व्यक्त करता है, बिना कथन का दायरा बढ़ाए।
theological_decisions:
- issue: हिंसक ऐतिहासिक कथन को बिना नरम किए प्रस्तुत करना
  choice: सीधे कहा गया है कि उसने एदोम के हर पुरुष को मार डाला
  alternative: ‘एदोमियों को पराजित किया’ या मुख्य पाठ में पूर्ण विनाश की अतिरिक्त व्याख्या देना
  rationale: मूल पाठ घोर सैन्य हिंसा का सीधा वर्णन करता है। अनुवाद उसकी शक्ति को बनाए रखता है, लेकिन पद में न दी गई व्याख्या नहीं जोड़ता।
- issue: וַיַּךְ के कर्ता की पहचान
  choice: निकटतम पुरुषवाचक कर्ता योआब की ओर संकेत करने के लिए ‘उसने’ रखा गया है
  alternative: नाम दोहराकर ‘योआब ने’ कहना, या इसे दाऊद से जोड़ना
  rationale: इब्रानी में कर्ता निहित है। संदर्भ और वाक्यरचना योआब की ओर संकेत करते हैं, पर ‘उसने’ मूल की अभिव्यक्ति को अधिक निकटता से बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिंदी, गरिमापूर्ण कथात्मक शैली। ‘दफ़नाने’, ‘सेना का प्रधान’ और ‘मार डाला’ सामान्य पाठक के लिए स्पष्ट हैं। वाक्य के अंत का दीर्घ डैश अगले पद में जारी रहने वाली पृष्ठभूमि-संबंधी रचना को बनाए रखता है।
