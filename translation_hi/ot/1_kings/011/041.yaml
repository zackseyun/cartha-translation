  yaml_path: translation/ot/1_kings/011/041.yaml
  text: The rest of the acts of Solomon[a], and all that he did, and his wisdom—are they not written in the Book of the Acts of Solomon?
translation:
  language: hi
  text: सुलैमान के शेष वृत्तांत, और जो कुछ उसने किया, और उसकी बुद्धि—क्या ये सब ‘सुलैमान के वृत्तांतों की पुस्तक’[a] में लिखे हुए नहीं हैं?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘सुलैमान के कार्यों की पुस्तक।’ इब्रानी शीर्षक में शाब्दिक रूप से ‘सुलैमान की बातें/विषय’ है, जो उसके कार्यों के अभिलेख के लिए प्रयुक्त मुहावरा है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי שְׁלֹמֹה
  choice: सुलैमान के शेष कार्यों
  rationale: राजकीय सारांश के इस सूत्र में דִּבְרֵי का अर्थ केवल ‘बातें’ या ‘वचन’ नहीं, बल्कि राजा के कार्यों और शासन-संबंधी वृत्तांत से है। ‘शेष कार्यों’ सहज हिंदी में इस भाव को व्यक्त करता है।
- source_word: וְכָל אֲשֶׁר עָשָׂה
  choice: उसके किए हुए सब कामों
  rationale: यह व्यापक इब्रानी क्रिया עשה को बिना किसी अनावश्यक विशिष्ट अर्थ के स्वाभाविक हिंदी में प्रस्तुत करता है।
- source_word: וְחָכְמָתוֹ
  choice: और उसकी बुद्धि
  rationale: संज्ञा और उसके सर्वनामिक प्रत्यय का सीधा अनुवाद है; सुलैमान की बुद्धि को उसके कार्यों के साथ एक अलग उल्लेखनीय विषय बनाए रखता है।
- source_word: הֲלוֹא הֵם כְּתֻבִים
  choice: क्या … नहीं लिखा है?
  rationale: इब्रानी में यह ऐसा अलंकारिक प्रश्न है जिसका अपेक्षित उत्तर सकारात्मक है। हिंदी में प्रश्नरूप को बनाए रखा गया है।
- source_word: עַל סֵפֶר
  choice: पुस्तक में
  rationale: शाब्दिक रूप से ‘पुस्तक/लिखित पत्र पर’ होने पर भी किसी अभिलेख में सामग्री लिखे होने के लिए ‘पुस्तक में’ स्वाभाविक हिंदी है।
- source_word: סֵפֶר דִּבְרֵי שְׁלֹמֹה
  choice: ‘सुलैमान के कार्यों की पुस्तक’
  rationale: यह संभावित स्रोत-ग्रंथ का शीर्षक है। यहाँ דִּבְרֵי को ‘कार्यों’ कहना उसके इतिहास-वर्णनात्मक अर्थ को स्पष्ट रखता है और किसी दूसरी बाइबलीय पुस्तक के साथ भ्रम से बचाता है।
