  register: आधुनिक मानक हिंदी में सहज किंतु गरिमापूर्ण शैली रखी गई है। मूल का अलंकारिक प्रश्न सुरक्षित है। ‘वर्णन’ जोड़कर अनेक विषयों के साथ एकवचन ‘लिखा है’ को स्वाभाविक बनाया गया है, जबकि आशय वही है कि इन सबका लिखित अभिलेख उस पुस्तक में है।
