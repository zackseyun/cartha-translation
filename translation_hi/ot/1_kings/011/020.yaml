  choice: उसके लिए ... को जन्म दिया
  rationale: ילד के साथ לוֹ हदद के लिए पुत्र उत्पन्न होने का भाव व्यक्त करता है। यह रूप इब्रानी के दत्तिव संबंध को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: אֲחוֹת תַּחְפְּנֵיס
  choice: तहपनेस की बहन
  rationale: यह सरल संबंधवाचक रचना आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: גְּנֻבַת
  choice: गनूबत
  rationale: व्यक्तिवाचक नाम का इब्रानी उच्चारण के निकट देवनागरी लिप्यंतरण किया गया है।
- source_word: בְּנוֹ
  choice: एक पुत्र, गनूबत
  rationale: संदर्भ स्पष्ट करता है कि गनूबत हदद का पुत्र था। मुख्य पाठ में स्वाभाविक हिन्दी रखी गई है और अधिक शाब्दिक रूप पादटिप्पणी में दिया गया है।
- source_word: וַתִּגְמְלֵהוּ
  choice: उसका दूध छुड़ाया
  rationale: इस प्रसंग में גמל बालक का स्तनपान समाप्त कराने या उसके दूध छुड़ाए जाने को दर्शाता है, न कि सामान्य रूप से केवल पालन-पोषण को।
- source_word: בְּתוֹךְ בֵּית פַּרְעֹה
  choice: फ़िरौन के घराने में ही
  rationale: בֵּית यहाँ निवास-स्थान और राजपरिवार/राजकीय गृहस्थी दोनों का संकेत दे सकता है। “घराना” सामाजिक अर्थ को व्यक्त करता है और “में” स्थानगत भाव भी बनाए रखता है।
- source_word: וַיְהִי
  choice: रहा
  rationale: प्रसंग में क्रिया गनूबत की निरंतर उपस्थिति और स्थिति को बताती है; हिन्दी कथा में “रहा” स्वाभाविक है।
- source_word: בְּתוֹךְ בְּנֵי פַרְעֹה
  choice: फ़िरौन के पुत्रों के बीच
  rationale: בני का पुल्लिंग बहुवचन अर्थ स्पष्ट रूप से रखा गया है और राजपुत्रों के साथ गनूबत की स्थिति व्यक्त होती है।
