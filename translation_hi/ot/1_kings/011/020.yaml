  yaml_path: translation/ot/1_kings/011/020.yaml
  text: And the sister of Tahpenes bore him Genubath his son[a], and Tahpenes weaned him within Pharaoh’s house[b]; and Genubath was in Pharaoh’s house among the sons of Pharaoh.
translation:
  language: hi
  text: 'तहपनेस की बहन ने उसके पुत्र गनूबत को जन्म दिया[a]। तहपनेस ने फ़िरौन के घराने में ही उसे दूध छुड़ाया[b], और गनूबत फ़िरौन के घराने में फ़िरौन के पुत्रों के बीच रहा।


    [a] या, “तहपनेस की बहन ने उसके लिए एक पुत्र, गनूबत, को जन्म दिया।” इब्रानी शब्दक्रम को हिन्दी में दोनों प्रकार से व्यक्त किया जा सकता है; अर्थ में कोई अंतर नहीं है।


    [b] “उसे दूध छुड़ाया” का अर्थ है कि बालक उस अवस्था में पहुँच गया जब उसने माँ का दूध पीना छोड़ दिया; इसके बाद भी वह फ़िरौन के घराने में रहा।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तहपनेस की बहन ने उसके लिए एक पुत्र, गनूबत, को जन्म दिया।” इब्रानी शब्दक्रम को हिन्दी में दोनों प्रकार से व्यक्त किया जा सकता है; अर्थ में कोई अंतर नहीं है।
    reason: lexical_alternative
  - marker: b
