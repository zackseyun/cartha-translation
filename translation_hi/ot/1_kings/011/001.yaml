source:
  edition: WLC
  text: וְ/הַ/מֶּ֣לֶךְ שְׁלֹמֹ֗ה אָהַ֞ב נָשִׁ֧ים נָכְרִיּ֛וֹת רַבּ֖וֹת וְ/אֶת בַּת פַּרְעֹ֑ה מוֹאֲבִיּ֤וֹת עַמֳּנִיּוֹת֙ אֲדֹ֣מִיֹּ֔ת צֵדְנִיֹּ֖ת חִתִּיֹּֽת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/001.yaml
  text: 'King Solomon loved many foreign women[a], including Pharaoh’s daughter: Moabite, Ammonite, Edomite, Sidonian, and Hittite women.'
translation:
  language: hi
  text: राजा सुलैमान ने फ़िरौन की बेटी समेत बहुत-सी विदेशी स्त्रियों[a] से प्रेम किया—मोआबी, अम्मोनी, एदोमी, सीदोनी और हित्ती स्त्रियों से।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “बहुत-सी विदेशी पत्नियों।” इब्रानी में शाब्दिक रूप से “बहुत-सी विदेशी स्त्रियाँ” है; प्रसंग बताता है कि सुलैमान ने उनसे विवाह किया था या उन्हें सहचारिणियों के रूप में रखा था।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַמֶּלֶךְ שְׁלֹמֹה
  choice: राजा सुलैमान
  rationale: וְ कथा को आगे बढ़ाता है; हिन्दी में अलग आरम्भिक संयोजक आवश्यक नहीं। उपाधि और नाम को स्वाभाविक हिन्दी क्रम में रखा गया है।
- source_word: אָהַב
  choice: से प्रेम किया
  rationale: क्रिया का सीधा अर्थ ‘प्रेम करना’ है। हिन्दी में व्यक्ति के साथ ‘से प्रेम किया’ स्वाभाविक प्रयोग है और मूल की नैतिक-धार्मिक गंभीरता को कम नहीं करता।
- source_word: נָשִׁים נָכְרִיּוֹת רַבּוֹת
  choice: बहुत-सी परदेशी स्त्रियों
  rationale: נָשִׁים का शाब्दिक अर्थ ‘स्त्रियाँ’, נָכְרִיּוֹת का ‘परदेशी/अन्य जातियों की’ और רַבּוֹת का ‘बहुत-सी’ है। ‘पत्नियाँ’ संदर्भतः संभव है, पर मुख्य पाठ मूल की व्यापक शब्दावली रखता है।
- source_word: וְאֶת בַּת פַּרְעֹה
  choice: फ़िरौन की बेटी समेत
  rationale: וְאֶת पहले बताए गए प्रेम के कर्म में फ़िरौन की बेटी को भी जोड़ता है। ‘समेत’ उसे उल्लिखित स्त्रियों में शामिल करते हुए व्याकरण की योगात्मक शक्ति व्यक्त करता है।
- source_word: מוֹאֲבִיּוֹת עַמֳּנִיּוֹת אֲדֹמִיֹּת צֵדְנִיֹּת חִתִּיֹּת
  choice: मोआबी, अम्मोनी, एदोमी, सीदोनी और हित्ती स्त्रियों
  rationale: जातिवाचक स्त्रीलिंग बहुवचन विशेषणों को प्रचलित हिन्दी जाति-नामों से व्यक्त किया गया है; अन्त में ‘स्त्रियों’ जोड़ने से पूरी सूची स्पष्ट और स्वाभाविक बनती है। ‘सीदोनी’ मूल के विशिष्ट सीदोन-संबंध को बनाए रखता है।
theological_decisions:
- issue: נָשִׁים का अनुवाद ‘स्त्रियाँ’ हो या ‘पत्नियाँ’
  choice: स्त्रियाँ
  alternative: पत्नियाँ
  rationale: मूल इब्रानी यहाँ सामान्य शब्द ‘स्त्रियाँ’ कहता है। विवाह अथवा सहचारिणी का संबंध प्रसंग से स्पष्ट होता है, इसलिए मुख्य पाठ में उससे अधिक विशिष्ट अर्थ आरोपित नहीं किया गया।
- issue: क्या फ़िरौन की बेटी परदेशी स्त्रियों में शामिल है
  choice: उसे उसी समूह में सम्मिलित रूप से प्रस्तुत किया गया है
  alternative: उसे अलग श्रेणी के रूप में प्रस्तुत करना
  rationale: वाक्य-विन्यास उसे सुलैमान द्वारा प्रेम की गई स्त्रियों में योगात्मक ढंग से जोड़ता है। ‘समेत’ इस समावेश को स्पष्ट करता है, पर सूची के साथ उसके सटीक व्याकरणिक संबंध को आवश्यकता से अधिक निर्धारित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रूप। ‘परदेशी’ यहाँ अन्य देशों या जातियों की स्त्रियों को दर्शाता है; जाति-सूची के प्रचलित बाइबलीय हिन्दी रूप बनाए गए हैं।
