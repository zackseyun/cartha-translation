base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/002.yaml
  text: from the nations about which Yahweh had said to the sons of Israel[a], “You shall not go in among them, and they shall not come in among you; surely they will turn your heart after their gods”—to these Solomon clung in love.
translation:
  language: hi
  text: उन जातियों में से, जिनके विषय में यहोवा ने इस्राएल के पुत्रों से कहा था,[a] “तुम उनके बीच न जाना, और वे तुम्हारे बीच न आएँ; निश्चय ही वे तुम्हारा मन अपने देवताओं के पीछे लगा देंगे”—उन्हीं से सुलैमान प्रेम में आसक्त रहा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या, प्रसंग के अनुसार अधिक स्पष्ट रूप से: “तुम उनसे विवाह-सम्बन्ध न करना, और न वे तुमसे करें।” हिब्रू में अधिक शाब्दिक रूप से है: “तुम उनके बीच न जाना, और वे तुम्हारे बीच न आएँ।”'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִן הַגּוֹיִם
  choice: उन जातियों में से
  rationale: גּוֹיִם के सामान्य अर्थ ‘जातियाँ/राष्ट्र’ को रखता है और पिछले पद में उल्लिखित विदेशी स्त्रियों की पृष्ठभूमि से स्वाभाविक रूप से जुड़ता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: ईश्वरीय नाम को उपाधि से प्रतिस्थापित करने के बजाय हिन्दी में प्रचलित व्यक्तिगत नाम ‘यहोवा’ से व्यक्त किया गया है।
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: इस्राएल के पुत्रों
  rationale: हिब्रू की औपचारिक अभिव्यक्ति और उसके पुल्लिंग बहुवचन रूप को सुरक्षित रखता है।
- source_word: לֹא תָבֹאוּ בָהֶם ... וְהֵם לֹא יָבֹאוּ בָכֶם
  choice: तुम उनके बीच न जाना, और वे तुम्हारे बीच न आएँ
  rationale: בוא + ב की सामान्य, परस्पर समानांतर अभिव्यक्ति को बनाए रखता है; विवाह का प्रसंग पादटिप्पणी में स्पष्ट किया गया है।
- source_word: אָכֵן
  choice: निश्चय ही
  rationale: कारण प्रस्तुत करने वाले emphatic certainty के भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: יַטּוּ אֶת לְבַבְכֶם
  choice: वे तुम्हारे मन को ... फेर देंगे
  rationale: נטה के causative अर्थ ‘मोड़ना/फेरना’ को सुरक्षित रखता है; לֵבָב का यहाँ ‘मन’ सम्पूर्ण आन्तरिक निष्ठा का स्वाभाविक हिन्दी बोध देता है।
- source_word: אַחֲרֵי אֱלֹהֵיהֶם
  choice: अपने देवताओं के पीछे
  rationale: अनुसरण और धार्मिक निष्ठा के हिब्रू मुहावरे ‘के पीछे’ को बनाए रखता है।
- source_word: בָּהֶם דָּבַק שְׁלֹמֹה לְאַהֲבָה
  choice: फिर भी सुलैमान प्रेम में उन्हीं से लिपटा रहा
  rationale: דבק की प्रबल आसक्ति को ‘लिपटा रहा’ और לְאַהֲבָה को ‘प्रेम में’ से व्यक्त किया है; आरम्भिक ‘फिर भी’ निषेध के विपरीत सुलैमान के आचरण का स्वाभाविक हिन्दी संबंध दिखाता है।
theological_decisions:
- issue: क्या निषेध को मुख्य पाठ में स्पष्टतः अंतर्विवाह के रूप में अनूदित किया जाए
  choice: सामान्य हिब्रू मुहावरे ‘उनके बीच न जाना ... तुम्हारे बीच न आएँ’ को मुख्य पाठ में रखना
  alternative: ‘उनसे विवाह-सम्बन्ध न करना, और न वे तुमसे करें’
  rationale: संदर्भ अंतर्विवाह का है, पर मूल पद की भाषा अधिक सामान्य है। मुख्य पाठ उस व्यापकता को बचाता है और प्रसंगगत अर्थ पादटिप्पणी में देता है।
- issue: בְּנֵי יִשְׂרָאֵל का लिंग-संबंधी रूप
  choice: इस्राएल के पुत्रों
  alternative: इस्राएलियों / इस्राएल के लोगों
  rationale: मूल की औपचारिक पुल्लिंग बहुवचन अभिव्यक्ति को बिना तटस्थ किए सुरक्षित रखा गया है।
- issue: בָּהֶם का संदर्भ
  choice: उन्हीं से
  alternative: उन स्त्रियों से / उन जातियों से
  rationale: व्याकरणतः सर्वनाम पहले उल्लिखित समूह को दोहराता है, जबकि निकट संदर्भ उन जातियों की स्त्रियों की ओर संकेत करता है। सर्वनाम रखकर मूल की संक्षिप्तता और संदर्भगत तनाव दोनों सुरक्षित रहते हैं।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण और सामान्य पाठक के लिए सुबोध शैली। ‘यहोवा’, ‘इस्राएल’ और ‘सुलैमान’ जैसे प्रचलित बाइबलीय नाम रखे गए हैं। वाक्य पिछले पद से जुड़ा अंश है, इसलिए आरम्भ ‘उन जातियों में से’ से किया गया है; अन्त में ‘फिर भी’ से निषेध और सुलैमान की आसक्ति का विरोध स्पष्ट होता है।
