source:
  edition: WLC
  text: וְ/יָרָבְעָם֩ בֶּן נְבָ֨ט אֶפְרָתִ֜י מִן הַ/צְּרֵדָ֗ה וְ/שֵׁ֤ם אִמּ/וֹ֙ צְרוּעָה֙ אִשָּׁ֣ה אַלְמָנָ֔ה עֶ֖בֶד לִ/שְׁלֹמֹ֑ה וַ/יָּ֥רֶם יָ֖ד בַּ/מֶּֽלֶךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/026.yaml
  text: Jeroboam son of Nebat[a], an Ephraimite from Zeredah—his mother's name was Zeruah, a widow—was a servant of Solomon[c][b], and he raised his hand against the king.
translation:
  language: hi
  text: नबात का पुत्र यारोबाम[a], जो सरेदा का एक एप्रैमी था—उसकी माता का नाम सरूआ था और वह विधवा थी—सुलैमान का सेवक था। उसने राजा के विरुद्ध हाथ उठाया।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “एप्राती”; परन्तु यहाँ सम्भवतः आशय “एप्रैमी” है।
    reason: lexical_alternative
  - marker: b
    text: अर्थात् सम्भवतः उसने राजा के विरुद्ध विद्रोह किया। हिब्रू में शाब्दिक रूप से, “उसने राजा के विरुद्ध हाथ उठाया।”
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶפְרָתִי
  choice: एप्रैमी
  rationale: इस प्रसंग में यह शब्द सबसे स्वाभाविक रूप से एप्रैम गोत्र से संबंध बताता है; ‘एप्राती’ पाठ-संभावना को पादटिप्पणी में रखा गया है।
- source_word: הַצְּרֵדָה
  choice: सरेदा
  rationale: स्थान-नाम का हिन्दी में स्वाभाविक लिप्यंतरण।
- source_word: צְרוּעָה
  choice: सरूआ
  rationale: व्यक्तिगत नाम का हिब्रू उच्चारण के निकट देवनागरी लिप्यंतरण।
- source_word: אִשָּׁה אַלְמָנָה
  choice: वह विधवा थी
  rationale: हिब्रू में ‘स्त्री, विधवा’ दोनों पद हैं; हिन्दी में ‘विधवा स्त्री’ अनावश्यक रूप से पुनरुक्त लगता है, इसलिए अर्थ को स्वाभाविक ढंग से व्यक्त किया गया है।
- source_word: עֶבֶד
  choice: सेवक
  rationale: राजकीय-प्रशासनिक प्रसंग में ‘सेवक’ उपयुक्त है; इस पद में दासत्व पर विशेष बल नहीं है।
- source_word: וַיָּרֶם יָד בַּמֶּלֶךְ
  choice: उसने राजा के विरुद्ध हाथ उठाया
  rationale: मूल हिब्रू रूपक को सुरक्षित रखता है; इसका आशय विद्रोह करना हो सकता है, जिसे पादटिप्पणी में स्पष्ट किया गया है।
- source_word: וְ
  choice: अलग से अनूदित नहीं
  rationale: आरंभिक वाव कथा की कड़ी जोड़ता है; हिन्दी में अनावश्यक ‘और’ से आरंभ किए बिना संबंध स्वाभाविक रहता है।
theological_decisions:
- issue: राजा के विरुद्ध हाथ उठाने वाले मुहावरे की व्याख्या
  choice: मूल रूपक ‘राजा के विरुद्ध हाथ उठाया’ रखा गया
  alternative: ‘राजा के विरुद्ध विद्रोह किया’
  rationale: मूल पाठ की चित्रात्मकता और अर्थगत खुलापन बचता है, जबकि संभावित आशय पादटिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण और सहज कथात्मक शैली। नामों का देवनागरी लिप्यंतरण किया गया है; हिब्रू मुहावरे को मुख्य पाठ में बनाए रखकर उसका निहितार्थ पादटिप्पणी में दिया गया है।
