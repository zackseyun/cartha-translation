revisions:
- from: क्योंकि योआब और समस्त इस्राएल[a] वहाँ छः महीने तक रहे, जब तक कि उसने एदोम के हर नर को मिटा नहीं दिया[b]।
  to: क्योंकि योआब और समस्त इस्राएल[a] वहाँ छह महीने तक रहे, जब तक उसने एदोम में हर पुरुष को समाप्त नहीं कर दिया[b]।
  rationale: Revision is needed to restore the Hebrew locative phrase ‘in Edom’ and to replace an unnatural human referent (‘हर नर’) with idiomatic modern Hindi. The footnote retains both the literal ‘cut off’ idiom and the source word’s male-specific sense. No interpretive or theological change has been introduced.
