source:
  edition: WLC
  text: כִּ֣י שֵׁ֧שֶׁת חֳדָשִׁ֛ים יָֽשַׁב שָׁ֥ם יוֹאָ֖ב וְ/כָל יִשְׂרָאֵ֑ל עַד הִכְרִ֥ית כָּל זָכָ֖ר בֶּ/אֱדֽוֹם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/016.yaml
  text: For Joab and all Israel had remained there six months[b][a], until he had cut off every male in Edom.
translation:
  language: hi
  text: क्योंकि योआब और समस्त इस्राएल[a] वहाँ छह महीने तक रहे, जब तक उसने एदोम में हर पुरुष को समाप्त नहीं कर दिया[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ ‘समस्त इस्राएल’ से सम्भवतः योआब के साथ गई इस्राएली सेना का आशय है, न कि राष्ट्र का प्रत्येक व्यक्ति।
    reason: cultural_note
  - marker: b
    text: शाब्दिक, ‘काट डाला’; या ‘नाश कर दिया।’ इब्रानी क्रिया का शाब्दिक अर्थ ‘काट देना’ है और यहाँ यह किसी जनसमूह को समाप्त करने का मुहावरा है। ‘पुरुष’ के लिए इब्रानी शब्द का मूल अर्थ ‘नर’ है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पद पिछले कथन का कारण अथवा स्पष्टीकरण देता है; ‘क्योंकि’ उसके संबंध को स्वाभाविक हिन्दी में स्पष्ट रखता है।
- source_word: שֵׁשֶׁת חֳדָשִׁים
  choice: छः महीने तक
  rationale: अवधि को हिन्दी में स्वाभाविक रूप से व्यक्त करने के लिए ‘तक’ जोड़ा गया है।
- source_word: יָשַׁב שָׁם
  choice: वहाँ ... रहे
  rationale: सैन्य प्रसंग में क्रिया का अर्थ बसना नहीं, बल्कि किसी स्थान पर बने रहना है।
- source_word: יוֹאָב
  choice: योआब
  rationale: व्यक्तिनाम का प्रचलित हिन्दी लिप्यंतरण।
- source_word: וְכָל יִשְׂרָאֵל
  choice: और समस्त इस्राएल
  rationale: इब्रानी सामूहिक अभिव्यक्ति को निकटता से रखा गया है; प्रसंगगत आशय पादटिप्पणी में स्पष्ट है।
- source_word: עַד
  choice: जब तक कि
  rationale: यह क्रिया की समय-सीमा अथवा अंतिम बिंदु को व्यक्त करता है।
- source_word: הִכְרִית
  choice: मिटा नहीं दिया
  rationale: हिफ़ील रूप यहाँ किसी जनसमूह के उन्मूलन के अर्थ में प्रयुक्त ‘काट डालना/समाप्त करना’ मुहावरे को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: כָּל זָכָר
  choice: हर नर
  rationale: ‘नर’ मूल के लिंग-सूचक अर्थ को सुरक्षित रखता है और केवल वयस्क पुरुषों तक अर्थ को सीमित नहीं करता।
- source_word: בֶּאֱדוֹם
  choice: एदोम के
  rationale: हिन्दी वाक्य-विन्यास में ‘एदोम के हर नर’ उस क्षेत्र अथवा जनसमुदाय में लक्ष्य बने नरों को स्वाभाविक ढंग से व्यक्त करता है।
