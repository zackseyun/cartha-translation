  text: Then Ahijah took hold of the new cloak that was on him and tore it into twelve pieces[a].
translation:
  language: hi
  text: तब अहिय्याह ने उस नए चोगे को, जो उसने पहन रखा था, पकड़ लिया और उसे फाड़कर बारह टुकड़े कर दिए।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּתְפֹּשׂ
  choice: पकड़ लिया
  rationale: यह क्रिया किसी वस्तु को हाथ से पकड़ने का ठोस भाव देती है। ‘पकड़ लिया’ स्वाभाविक है और ‘झपट लिया’ जैसे अधिक हिंसक भाव को नहीं जोड़ता।
- source_word: שַׂלְמָה
  choice: चोगा
  rationale: यह शब्द बाहरी वस्त्र को दर्शाता है। ‘चोगा’ आधुनिक हिन्दी में स्पष्ट है और आगे उसे फाड़े जाने की क्रिया के अनुकूल है।
- source_word: הַחֲדָשָׁה
  choice: नया
  rationale: मूल विशेषण का सीधा अर्थ ‘नया’ है; कथा में इस विवरण को बनाए रखा गया है।
- source_word: אֲשֶׁר עָלָיו
  choice: जो उसके ऊपर था
  rationale: यह इब्रानी वाक्यांश की स्थान-संबंधी अभिव्यक्ति को निकटता से रखता है और यह स्पष्ट करने की अतिरिक्त व्याख्या मुख्य पाठ में नहीं जोड़ता कि वह उसे पहने हुए था।
- source_word: וַיִּקְרָעֶהָ
  choice: उसे फाड़कर
  rationale: क्रिया का अर्थ फाड़ना है और स्त्रीलिंग कर्म-प्रत्यय चोगे की ओर संकेत करता है; हिन्दी में ‘उसे फाड़कर’ अगली परिणामसूचक अभिव्यक्ति से सहजता से जुड़ता है।
- source_word: שְׁנֵים עָשָׂר קְרָעִים
  choice: बारह टुकड़े कर दिए
  rationale: मूल में फाड़ने से बने बारह टुकड़ों का भाव है। यह हिन्दी अभिव्यक्ति संख्या, परिणाम और प्रतीकात्मक क्रिया—तीनों को स्वाभाविक रूप से व्यक्त करती है।
theological_decisions: []
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘चोगा’ बाहरी वस्त्र का सामान्य बोध देता है; सर्वनाम-संबंधी मूल अभिव्यक्ति को मुख्य पाठ में निकटता से रखते हुए अधिक स्पष्ट विकल्प पादटिप्पणी में दिया गया है।
