source:
  edition: WLC
  text: וַ/יֹּ֧אמֶר ל֣/וֹ פַרְעֹ֗ה כִּ֠י מָה אַתָּ֤ה חָסֵר֙ עִמִּ֔/י וְ/הִנְּ/ךָ֥ מְבַקֵּ֖שׁ לָ/לֶ֣כֶת אֶל אַרְצֶ֑/ךָ וַ/יֹּ֣אמֶר לֹ֔א כִּ֥י שַׁלֵּ֖חַ תְּשַׁלְּחֵֽ/נִי־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/022.yaml
  text: Then Pharaoh said to him[a], “But what do you lack with me, that you are seeking to go to your own land?” And he said, “Nothing, but please let me go.”
translation:
  language: hi
  text: तब फ़िरौन ने उससे कहा, “मेरे यहाँ तुम्हें किस बात की कमी है कि तुम अपने देश जाना चाहते हो?” उसने कहा, “किसी बात की नहीं; फिर भी मुझे अवश्य जाने दीजिए।[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शब्दशः भाव है, “मुझे भेज ही दीजिए”—अनन्त-रूप के साथ रूपित क्रिया का प्रयोग आग्रह पर विशेष बल देता है।
    reason: इब्रानी की बलसूचक व्याकरणिक रचना को सटीक और स्वाभाविक हिंदी तकनीकी शब्दावली में स्पष्ट करना।
lexical_decisions:
- source_word: כִּי מָה אַתָּה חָסֵר עִמִּי
  choice: मेरे यहाँ तुम्हें किस बात की कमी है
  rationale: प्रश्न में כִּי संवादात्मक भूमिका निभाता है; हिंदी में अलग से ‘पर’ आवश्यक नहीं। ‘मेरे यहाँ’ עִמִּי के आश्रय/संगति-संबंधी भाव को स्वाभाविक रूप से व्यक्त करता है, और חָסֵר को ‘कमी’ से सीधा रखा गया है।
- source_word: וְהִנְּךָ מְבַקֵּשׁ
  choice: कि तुम ... जाना चाहते हो
  rationale: הִנֵּה यहाँ सामने की स्थिति पर ध्यान दिलाता है, जबकि מְבַקֵּשׁ इच्छा/प्रयत्न बताता है। संयुक्त हिंदी वाक्य में ‘चाहते हो’ संवाद की स्वाभाविकता बनाए रखता है, बिना किसी अनुल्लिखित कालसूचक ‘अब’ को जोड़ने के।
- source_word: לָלֶכֶת אֶל אַרְצֶךָ
  choice: अपने देश जाना
  rationale: הלך का सामान्य अर्थ ‘जाना’ है; ‘लौटना’ संदर्भ से संभव होते हुए भी क्रिया में स्पष्ट नहीं है। प्रत्यययुक्त אַרְצֶךָ को स्वाभाविक हिंदी में ‘अपने देश’ कहा गया है।
- source_word: לֹא כִּי
  choice: किसी बात की नहीं; फिर भी
  rationale: लघु उत्तर לֹא प्रश्न में पूछी गई कमी का निषेध करता है, इसलिए ‘किसी बात की नहीं’ निहित अर्थ स्पष्ट करता है। दूसरा כִּי मुख्य आग्रह की ओर मोड़ता है; ‘फिर भी’ इस विरोधात्मक संबंध को सहज हिंदी में रखता है।
- source_word: שַׁלֵּחַ תְּשַׁלְּחֵנִי
  choice: मुझे अवश्य जाने दीजिए
  rationale: अनन्त धातुरूप और सीमित क्रिया की पुनरुक्ति आग्रह को प्रबल बनाती है। ‘अवश्य’ बल को मुख्य पाठ में सुरक्षित रखता है और सम्मानसूचक ‘दीजिए’ फ़िरौन से संबोधन के अनुरूप है।
theological_decisions: []
translation_notes:
  register: आधुनिक मानक हिंदी, सम्मानपूर्ण और कथात्मक शैली। फ़िरौन के लिए प्रचलित रूप ‘फ़िरौन’ रखा गया है। वाक्य को सहज संवादात्मक बनाया गया है, पर स्रोत में निहित न होने वाला ‘अब’ या ‘लौटना’ नहीं जोड़ा गया।
