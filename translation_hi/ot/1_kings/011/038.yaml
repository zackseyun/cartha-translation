source:
  edition: WLC
  text: וְ/הָיָ֗ה אִם תִּשְׁמַע֮ אֶת כָּל אֲשֶׁ֣ר אֲצַוֶּ/ךָ֒ וְ/הָלַכְתָּ֣ בִ/דְרָכַ֗/י וְ/עָשִׂ֨יתָ הַ/יָּשָׁ֤ר בְּ/עֵינַ/י֙ לִ/שְׁמ֤וֹר חֻקּוֹתַ/י֙ וּ/מִצְוֺתַ֔/י כַּ/אֲשֶׁ֥ר עָשָׂ֖ה דָּוִ֣ד עַבְדִּ֑/י וְ/הָיִ֣יתִי עִמָּ֗/ךְ וּ/בָנִ֨יתִי לְ/ךָ֤ בַֽיִת נֶאֱמָן֙ כַּ/אֲשֶׁ֣ר בָּנִ֣יתִי לְ/דָוִ֔ד וְ/נָתַתִּ֥י לְ/ךָ֖ אֶת יִשְׂרָאֵֽל־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/038.yaml
  text: And it shall be[a], if you listen to all that I command you, and walk in my ways, and do what is right in my eyes by keeping my statutes and my commandments, as David my servant did, then I will be with you and build for you a faithful house, just as I built for David, and I will give Israel to you.
translation:
  language: hi
  text: और यदि तू जो कुछ मैं तुझे आज्ञा दूँगा उस सब पर ध्यान देगा, मेरे मार्गों पर चलेगा और मेरे सेवक दाऊद के समान मेरी विधियों और आज्ञाओं का पालन करके वही करेगा जो मेरी दृष्टि में ठीक है, तो मैं तेरे साथ रहूँगा और तेरे लिए एक स्थायी घराना[a] स्थापित करूँगा, जैसा मैंने दाऊद के लिए स्थापित किया था; और इस्राएल तुझे दे दूँगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘विश्वसनीय घराना,’ ‘दृढ़ घराना,’ अथवा ‘स्थिर घर’; यहाँ ‘घर’ से आशय एक टिकाऊ राजवंश है।
    reason: नֶאֱמָן में दृढ़ता, विश्वसनीयता और स्थायित्व का भाव है; בַיִת यहाँ राजवंश के अर्थ में प्रयुक्त है।
lexical_decisions:
- source_word: תִּשְׁמַע אֶת כָּל אֲשֶׁר אֲצַוֶּךָ
  choice: मेरी दी हुई हर आज्ञा पर ध्यान देगा
  rationale: שׁמע में सुनने, ध्यान देने और आज्ञा मानने का भाव हो सकता है। ‘ध्यान देगा’ श्रवण-आधारित रूपक को पूरी तरह मिटाए बिना प्रसंग में अपेक्षित आज्ञाकारिता व्यक्त करता है।
- source_word: וְהָלַכְתָּ בִדְרָכַי
  choice: मेरे मार्गों पर चलेगा
  rationale: यह वाचा-संबंधी प्रचलित रूपक है; हिन्दी में भी स्वाभाविक और बोधगम्य है।
- source_word: הַיָּשָׁר בְּעֵינַי
  choice: वही करेगा जो मेरी दृष्टि में ठीक है
  rationale: यह परमेश्वर के मूल्यांकन के अनुसार उचित आचरण को व्यक्त करता है और मूल मुहावरे का आशय बनाए रखता है।
- source_word: לִשְׁמֹר חֻקּוֹתַי וּמִצְוֺתַי
  choice: मेरी विधियों और आज्ञाओं का पालन करके
  rationale: לִשְׁמֹר यहाँ उस रीति को बताता है जिससे सही काम किया जाता है। ‘विधियाँ’ और ‘आज्ञाएँ’ दोनों कानूनी-वाचागत पदों का भेद बनाए रखते हैं।
- source_word: עַבְדִּי
  choice: मेरे सेवक
  rationale: दाऊद के लिए यह सम्मानसूचक वाचा-संबंधी पद है; ‘सेवक’ इस राजकीय-धार्मिक संदर्भ में उपयुक्त है।
- source_word: בַיִת נֶאֱמָן
  choice: एक स्थायी घराना
  rationale: בַיִת यहाँ राजवंश या वंशगत राजघराने का बोध कराता है, जबकि נֶאֱמָן स्थिरता, दृढ़ता और टिकाऊपन व्यक्त करता है। ‘स्थायी घराना’ आधुनिक हिन्दी में अर्थ स्पष्ट रखते हुए पारिवारिक रूपक बचाता है।
- source_word: וּבָנִיתִי לְךָ
  choice: तेरे लिए ... स्थापित करूँगा
  rationale: घराने या राजवंश के साथ हिन्दी में ‘स्थापित करना’ स्वाभाविक है और मूल के ‘बनाने’ वाले रूपक का कार्यात्मक अर्थ देता है।
- source_word: וְנָתַתִּי לְךָ אֶת יִשְׂרָאֵל
  choice: इस्राएल तुझे दे दूँगा
  rationale: यह मूल प्रत्यक्ष कर्म और परमेश्वर द्वारा इस्राएल सौंपे जाने के बल को संक्षिप्त, स्वाभाविक हिन्दी में बनाए रखता है।
theological_decisions:
- issue: ‘घर’ की प्रतिज्ञा का अर्थ
  choice: वंशगत राजघराना, मुख्य पाठ में ‘घराना’
  alternative: भौतिक घर या राजमहल
  rationale: राजकीय उत्तराधिकार और दाऊद से तुलना के प्रसंग में בַיִת किसी भवन के बजाय टिकाऊ राजवंश का सूचक है। ‘घराना’ पारिवारिक रूपक और अभिप्रेत राजवंशीय अर्थ दोनों व्यक्त करता है।
- issue: प्रतिज्ञा की शर्त
  choice: यारोबाम की आज्ञाकारिता पर निर्भर वास्तविक शर्तयुक्त प्रतिज्ञा
  alternative: बिना शर्त दिया गया अनुदान
  rationale: आरम्भिक אִם और उसके बाद की आज्ञाकारिता-संबंधी उपवाक्य प्रतिज्ञा को स्पष्ट रूप से शर्तयुक्त बनाते हैं; ‘यदि...तो’ इसे बिना नरम किए व्यक्त करता है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की स्वाभाविक, गरिमापूर्ण शैली में है। एक व्यक्ति को संबोधित करने के लिए ‘तू/तेरे’ रखा गया है, जो इस प्रत्यक्ष दैवी संबोधन की एकवचन निकटता और मूल व्याकरण को बनाए रखता है।
