  edition: WLC
  text: וַ/יִּקְבֹּ֤ץ עָלָי/ו֙ אֲנָשִׁ֔ים וַ/יְהִ֣י שַׂר גְּד֔וּד בַּ/הֲרֹ֥ג דָּוִ֖ד אֹתָ֑/ם וַ/יֵּלְכ֤וּ דַמֶּ֨שֶׂק֙ וַ/יֵּ֣שְׁבוּ בָ֔/הּ וַֽ/יִּמְלְכ֖וּ בְּ/דַמָּֽשֶׂק־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/024.yaml
  text: He gathered men to himself and became commander of a band when David killed them. They went to Damascus[a], settled there, and reigned in Damascus.
translation:
  language: hi
  text: उसने अपने पास लोगों को इकट्ठा किया और एक दल का सरदार बन गया, जब दाऊद ने उन्हें मार डाला। वे दमिश्क गए[a], वहीं बस गए और दमिश्क में राज्य किया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इब्रानी पाठ में पद के इस अंतिम भाग की क्रियाएँ बहुवचन हैं: “वे गए… बस गए… राज्य किया।” प्रसंग रज़ोन पर केंद्रित होने के कारण कुछ अनुवाद इन्हें एकवचन, अर्थात “वह,” कर देते हैं।'
    reason: मूल पाठ के बहुवचन और प्रसंगगत एकवचन के बीच कथात्मक तनाव को स्पष्ट करना।
lexical_decisions:
- source_word: וַיִּקְבֹּץ עָלָיו אֲנָשִׁים
  choice: उसने अपने पास लोगों को इकट्ठा किया
  rationale: קבץ के साथ עַל और सर्वनामिक प्रत्यय लोगों को अपने चारों ओर या अपने साथ इकट्ठा करने का भाव देता है। आधुनिक हिन्दी में यह चयन स्वाभाविक रहते हुए दिशा-संबंधी अर्थ को बनाए रखता है।
- source_word: אֲנָשִׁים
  choice: लोगों
  rationale: शब्द व्याकरणतः पुल्लिंग बहुवचन है और प्रसंग में योद्धा पुरुषों की ओर संकेत कर सकता है; फिर भी हिन्दी में 'लोगों' समूह के लिए अधिक स्वाभाविक है और अर्थ को अनावश्यक रूप से संकीर्ण नहीं करता।
- source_word: שַׂר גְּדוּד
  choice: एक दल का सरदार
  rationale: שַׂר अगुआ या सरदार और גְּדוּד एक दल अथवा सशस्त्र जत्थे को दर्शाता है। 'दल का सरदार' मूल की तटस्थता रखता है और छापामार गतिविधि का ऐसा अर्थ नहीं जोड़ता जो पद में स्पष्ट नहीं है।
- source_word: בַּהֲרֹג דָּוִד אֹתָם
  choice: जब दाऊद ने उन्हें मार डाला था
  rationale: בְּ के साथ infinitive construct यहाँ समयसूचक है। 'उन्हें' मूल के बहुवचन कर्म को ज्यों का त्यों रखता है, भले ही उसका संदर्भ कथात्मक रूप से कठिन हो।
- source_word: וַיֵּלְכוּ דַמֶּשֶׂק
  choice: वे दमिश्क गए
  rationale: बहुवचन क्रिया और दमिश्क की ओर गति दोनों स्पष्ट रूप से सुरक्षित हैं।
- source_word: וַיֵּשְׁבוּ בָהּ
  choice: वहीं बस गए
  rationale: ישב इस प्रसंग में निवास करने या बसने का अर्थ देता है; 'वहीं' स्त्रीलिंग प्रत्यय के नगर-संदर्भ को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וַיִּמְלְכוּ בְּדַמָּשֶׂק
  choice: दमिश्क में राज्य करने लगे
  rationale: מלך का मूल अर्थ राजा होना या राज्य करना है। बहुवचन क्रिया को बनाए रखने के लिए 'करने लगे' का प्रयोग किया गया है; इसे केवल सामान्य 'शासन किया' में हल्का नहीं किया गया।
theological_decisions:
- issue: अंतिम तीन उपवाक्यों में बहुवचन क्रियाएँ, जबकि व्यापक प्रसंग रज़ोन पर केंद्रित है
  choice: 'बहुवचन बनाए रखा: ''वे गए... बस गए... राज्य करने लगे'''
  alternative: 'एकवचन करके पढ़ना: ''वह गया... बस गया... राज्य करने लगा'''
  rationale: मसोराई इब्रानी पाठ में तीनों क्रियाएँ बहुवचन हैं। प्रसंग के आधार पर उन्हें एकवचन बनाना कथात्मक कठिनाई को व्याख्यात्मक रूप से सुलझा देगा; इसलिए मूल की वास्तविक असंगति अथवा तनाव को सुरक्षित रखा गया है।
- issue: בַּהֲרֹג דָּוִד אֹתָם में बहुवचन कर्म का संदर्भ
  choice: '''उन्हें'' को बहुवचन ही रखा'
  alternative: किसी विशेष पूर्ववर्ती समूह की व्याख्या जोड़ना अथवा वाक्य को ऐसा बदलना कि दाऊद से बच निकलने का अर्थ निकले
  rationale: मूल में बहुवचन कर्म स्पष्ट है, पर उसका सटीक पूर्वपद कठिन है। अनुवाद उस अस्पष्टता को किसी अतिरिक्त पहचान से नहीं भरता।
translation_notes:
  register: आधुनिक मानक हिन्दी, सहज किंतु गरिमापूर्ण कथात्मक शैली। 'सरदार' और 'दल' सामान्य पाठक के लिए स्पष्ट हैं। बहुवचन रूपों और अस्पष्ट सर्वनाम को मूल के अनुसार सुरक्षित रखा गया है।
