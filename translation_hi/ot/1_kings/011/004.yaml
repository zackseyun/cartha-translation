id: 1KI.11.4
reference: 1 Kings 11:4
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יְהִ֗י לְ/עֵת֙ זִקְנַ֣ת שְׁלֹמֹ֔ה נָשָׁי/ו֙ הִטּ֣וּ אֶת לְבָב֔/וֹ אַחֲרֵ֖י אֱלֹהִ֣ים אֲחֵרִ֑ים וְ/לֹא הָיָ֨ה לְבָב֤/וֹ שָׁלֵם֙ עִם יְהוָ֣ה אֱלֹהָ֔י/ו כִּ/לְבַ֖ב דָּוִ֥יד אָבִֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/004.yaml
  text: And when Solomon was old[a], his wives turned his heart after other gods, and his heart was not fully devoted to Yahweh his God, like the heart of David his father.
translation:
  language: hi
  text: जब सुलैमान बूढ़ा हो गया, तब उसकी पत्नियों ने उसका हृदय दूसरे देवताओं के पीछे फेर दिया। उसका हृदय अपने परमेश्वर यहोवा के प्रति पूरी तरह निष्ठावान[a] नहीं रहा, जैसा उसके पिता दाऊद का हृदय था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “उसका हृदय अपने परमेश्वर यहोवा के साथ संपूर्ण नहीं था।”
    reason: שָׁלֵם के शाब्दिक ‘संपूर्ण’ बिंब और עִם के सीधे ‘साथ’ अर्थ को दिखाने के लिए।
lexical_decisions:
- source_word: לְעֵת זִקְנַת שְׁלֹמֹה
  choice: जब सुलैमान बूढ़ा हो गया
  rationale: यह रचना शाब्दिक रूप से ‘सुलैमान के बुढ़ापे के समय’ कहती है; चुना हुआ रूप आधुनिक हिन्दी में स्वाभाविक ढंग से वही कालगत अर्थ देता है।
- source_word: נָשָׁיו
  choice: उसकी पत्नियों
  rationale: बहुवचन और संबंधसूचक रूप का सीधा अनुवाद।
- source_word: הִטּוּ אֶת־לְבָבוֹ
  choice: उसका हृदय ... फेर दिया
  rationale: हिफ़ील रूप किसी के हृदय को मुड़ने की ओर प्रवृत्त करने का अर्थ देता है। ‘फेर दिया’ मूल बिंब को बनाए रखता है और ‘भटका दिया’ जैसी अधिक व्याख्यात्मक भाषा से बचता है।
- source_word: אַחֲרֵי אֱלֹהִים אֲחֵרִים
  choice: दूसरे देवताओं के पीछे
  rationale: यह अनुवाद ‘पीछे चलने’ के इब्रानी मुहावरे और वाचा से विमुख होने की उसकी प्रतिध्वनि को सुरक्षित रखता है।
- source_word: לְבָבוֹ
  choice: उसका हृदय
  rationale: इब्रानी में हृदय विचार, इच्छा और निष्ठा का केंद्र है। ‘हृदय’ मूल बाइबलीय बिंब को बनाए रखता है।
- source_word: שָׁלֵם
  choice: पूरी तरह निष्ठावान
  rationale: इस प्रसंग में शब्द अविभाजित संपूर्णता और वाचा की निष्ठा को व्यक्त करता है। यह हिन्दी में स्वाभाविक है; शाब्दिक ‘संपूर्ण’ को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: עִם יְהוָה אֱלֹהָיו
  choice: अपने परमेश्वर यहोवा के प्रति
  rationale: עִם यहाँ संबंधगत अनुरूपता अथवा निष्ठा बताता है। ‘के प्रति’ हिन्दी में इस संबंध को स्वाभाविक रूप से व्यक्त करता है, और יהוה को व्यक्तिगत नाम ‘यहोवा’ के रूप में रखा गया है।
- source_word: כִּלְבַב דָּוִיד אָבִיו
  choice: जैसा उसके पिता दाऊद का हृदय था
  rationale: मूल पाठ व्यक्तियों की नहीं, विशेष रूप से उनके हृदयों की तुलना करता है; अतः ‘हृदय’ दोहराया गया है।
theological_decisions:
- issue: सुलैमान के हृदय के लिए שָׁלֵם का अर्थ
  choice: पूरी तरह निष्ठावान
  alternative: संपूर्ण; अखंड
  rationale: संदर्भ परमेश्वर के प्रति अविभाजित वाचा-निष्ठा का है। यह चयन नैतिक निष्पापता का दावा नहीं करता और दाऊद की विफलताओं तथा उसकी मूल वाचा-निष्ठा के बीच पाठ में उपस्थित तनाव को बनाए रखता है।
- issue: אֱלֹהִים אֲחֵרִים का संदर्भ
  choice: दूसरे देवता
  alternative: पराए देवता
  rationale: ‘दूसरे देवता’ इब्रानी अभिव्यक्ति का सीधा रूप है और मूर्तिपूजा को केवल जातीय अथवा विदेशी श्रेणी तक सीमित नहीं करता।
- issue: יהוה का निरूपण
  choice: यहोवा
  alternative: प्रभु
  rationale: व्यक्तिगत ईश्वरीय नाम को शीर्षक से बदलने के बजाय हिन्दी में प्रचलित लिप्यंतरण द्वारा रखा गया है।
translation_notes:
  register: भाषा आधुनिक, सरल और गरिमापूर्ण रखी गई है। ‘हृदय’, ‘दूसरे देवताओं के पीछे’ और ‘यहोवा’ जैसे प्रमुख इब्रानी बिंब तथा नाम सुरक्षित हैं; अस्वाभाविक शाब्दिकता से बचने के लिए שָׁלֵם עִם को मुख्य पाठ में ‘के प्रति पूरी तरह निष्ठावान’ कहा गया है।
