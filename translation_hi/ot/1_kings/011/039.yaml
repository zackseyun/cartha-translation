reference: 1 Kings 11:39
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַֽ/אעַנֶּ֛ה אֶת זֶ֥רַע דָּוִ֖ד לְמַ֣עַן זֹ֑את אַ֖ךְ לֹ֥א כָל הַ/יָּמִֽים־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/039.yaml
  text: And I will afflict the offspring of David because of this[a], but not forever.
translation:
  language: hi
  text: इस कारण मैं दाऊद के वंश को कष्ट दूँगा, पर सदा के लिए नहीं[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “सब दिनों तक नहीं।”
    reason: मूल इब्रानी अभिव्यक्ति को दिखाने के लिए।
lexical_decisions:
- source_word: וַאעַנֶּה
  choice: कष्ट दूँगा
  rationale: पिएल रूप यहाँ दुःख या विपत्ति पहुँचाने का भाव देता है। ‘कष्ट दूँगा’ न्याय के संदर्भ में स्वाभाविक है और ‘दीन करूँगा’ की अपेक्षा कम व्याख्यात्मक है।
- source_word: זֶרַע דָּוִד
  choice: दाऊद के वंश
  rationale: זֶרַע सामूहिक अर्थ में दाऊद की वंश-परंपरा को दर्शाता है। हिंदी में ‘वंश’ इस सामूहिक भाव को सहज और संक्षिप्त रूप से व्यक्त करता है।
- source_word: לְמַעַן זֹאת
  choice: इस कारण
  rationale: यह पदबंध पिछली बात को न्याय का कारण बताता है; ‘इस कारण’ निकट, स्पष्ट और स्वाभाविक हिंदी है।
- source_word: אַךְ
  choice: पर
  rationale: यह न्याय की अवधि पर विरोधात्मक सीमा लगाता है। ‘पर’ आधुनिक हिंदी में सहज है।
- source_word: לֹא כָל הַיָּמִים
  choice: सदा के लिए नहीं
  rationale: शाब्दिक अर्थ ‘सब दिनों तक नहीं’ है, जिसका मुहावरेदार हिंदी अर्थ ‘सदा के लिए नहीं’ है। यह अस्थायी न्याय को स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है।
theological_decisions:
- issue: दाऊद के वंश पर न्याय की अवधि
  choice: कष्ट वास्तविक है, पर सदा तक नहीं रहेगा।
  alternative: इसे अधिक शाब्दिक रूप से ‘सब दिनों तक नहीं’ कहा जा सकता है।
  rationale: इब्रानी पाठ न्याय की अवधि को स्पष्ट रूप से सीमित करता है। अनुवाद वास्तविक न्याय और उसकी अस्थायी अवधि—दोनों को बनाए रखता है, बिना आगे की प्रतिज्ञाओं को इस पद में जोड़े।
translation_notes:
  register: आधुनिक मानक हिंदी; भाषा सरल, गरिमापूर्ण और मौखिक पठन में स्वाभाविक रखी गई है। ‘वंश’ सामूहिक उत्तराधिकार को और ‘कष्ट दूँगा’ न्याय के प्रसंग को बिना अनावश्यक अतिव्याख्या के व्यक्त करता है।
