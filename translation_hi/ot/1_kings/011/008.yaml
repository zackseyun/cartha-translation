    reason: lexical_alternative
lexical_decisions:
- source_word: וְכֵן
  choice: और ... ऐसा ही
  rationale: यह पिछले पद में बताए गए कार्य की ओर संकेत करते हुए उसी प्रकार की कार्रवाई जारी रहने का भाव देता है।
- source_word: עָשָׂה
  choice: उसने ... किया
  rationale: इब्रानी क्रिया व्यापक है और उसका कर्म यहाँ निहित है; अनुवाद पिछले पद से उसका आशय ग्रहण करने देता है, बिना उसे स्पष्ट रूप से जोड़ने के।
- source_word: לְכָל נָשָׁיו הַנָּכְרִיּוֹת
  choice: अपनी सभी परदेशी पत्नियों के लिए
  rationale: לְ का हितार्थक भाव 'के लिए' से स्वाभाविक रूप में व्यक्त होता है; נָשָׁיו संदर्भ में पत्नियों को और הַנָּכְרִיּוֹת अन्य देशों से आई हुई स्त्रियों को सूचित करता है।
- source_word: מַקְטִירוֹת
  choice: धूप जलाती
  rationale: आराधना-संबंधी संदर्भ में यह हिफ़ील कृदंत धूप या सुगंधित धुआँ चढ़ाने को सूचित करता है; स्त्रीलिंग बहुवचन का मेल पत्नियों से है।
- source_word: וּמְזַבְּחוֹת
  choice: और बलिदान चढ़ाती थीं
  rationale: यह स्त्रीलिंग बहुवचन कृदंत बलिदान करने की जारी या नियमित उपासना-क्रिया को व्यक्त करता है।
- source_word: לֵאלֹהֵיהֶן
  choice: अपने देवताओं के लिए
  rationale: स्त्रीलिंग बहुवचन प्रत्यय उन पत्नियों के देवताओं की ओर संकेत करता है; 'देवताओं' बहुवचन और इस्राएल के परमेश्वर से भिन्न देवताओं का भाव बनाए रखता है।
theological_decisions:
- issue: מַקְטִירוֹת וּמְזַבְּחוֹת कृदंतों का कर्ता
  choice: परदेशी पत्नियाँ धूप जलाती और बलिदान चढ़ाती थीं
  alternative: इन्हें सुलैमान द्वारा उनके लिए बनाए गए पूजा-स्थलों से जुड़ी सामान्य उपासना-गतिविधि माना जाए
  rationale: दोनों कृदंत स्त्रीलिंग बहुवचन हैं और निकटतम पदबंध 'परदेशी पत्नियों' से सीधे मेल खाते हैं; इसलिए कर्ता को सुलैमान या पूजा-स्थलों में बदलना उचित नहीं।
- issue: सुलैमान ने क्या 'किया' इसका लोप
  choice: कार्य को 'ऐसा ही किया' के रूप में पिछले पद पर निर्भर रहने दिया गया
  alternative: स्पष्ट रूप से जोड़ना कि उसने सभी के लिए पूजा के ऊँचे स्थान बनाए
  rationale: इब्रानी इस पद में विशिष्ट कार्य को नहीं दोहराता। 'ऐसा ही किया' संदर्भ-संबंध स्पष्ट करता है, पर पिछले पद का पूरा विवरण इस पद में आयात नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण और सहज शैली रखी गई है। 'परदेशी' यहाँ अन्य देशों से आई पत्नियों के लिए है। स्त्रीलिंग बहुवचन क्रियाएँ मूल इब्रानी के व्याकरण और जारी अथवा नियमित आराधना-क्रिया के भाव को बनाए रखती हैं।
