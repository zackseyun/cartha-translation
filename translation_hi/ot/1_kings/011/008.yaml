  text: And so he did for all his foreign wives[a], who were burning incense and sacrificing to their gods.
translation:
  language: hi
  text: और उसने अपनी सभी विदेशी पत्नियों के लिए ऐसा ही किया[a], जो अपने देवताओं को धूप जलाती और बलिदान चढ़ाती थीं।
  philosophy: optimal-equivalence
  footnotes:
