  register: भाषा आधुनिक, गरिमापूर्ण और सार्वजनिक पाठ के योग्य रखी गई है। ‘दण्डवत् किया,’ ‘मेरे मार्गों पर चले,’ ‘विधियाँ’ और ‘न्याय-विधान’ बाइबलीय अर्थक्षेत्र को सुरक्षित रखते हुए सामान्य हिन्दी पाठक के लिए बोधगम्य हैं। कानूनी पदों के साथ हिन्दी की स्वाभाविकता के लिए ‘पालन किया’ प्रयुक्त है।
