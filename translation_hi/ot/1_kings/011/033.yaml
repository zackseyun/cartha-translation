base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/033.yaml
  text: because they have forsaken me and bowed down to Ashtoreth[a], the god of the Sidonians, to Chemosh, the god of Moab, and to Milcom, the god of the Ammonites, and have not walked in my ways, to do what is right in my eyes and my statutes and my judgments[d][c][b], like David his father.
translation:
  language: hi
  text: क्योंकि उन्होंने मुझे छोड़ दिया और सीदोनियों के देवता अश्तोरेत[a], मोआब के देवता कमोश और अम्मोनियों के देवता मिल्कोम[b] को दण्डवत् किया। वे मेरे मार्गों पर नहीं चले, न उन्होंने वह किया जो मेरी दृष्टि में ठीक है, और न मेरी विधियों और मेरे न्याय-विधानों का पालन किया, जैसा उसके पिता दाऊद ने किया था।[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “सीदोनियों की देवी अश्तोरेत।” इब्रानी पद का शाब्दिक रूप “सीदोनियों के देवता” है, यद्यपि अश्तोरेत स्त्री-देवी थी।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी पाठ में यहाँ “मिल्कोम” है; कुछ लोग इस नाम को मोलेक से संबंधित मानते हैं।
    reason: cultural_note
  - marker: c
    text: इब्रानी में इस वाक्य की पहले की क्रियाएँ बहुवचन हैं (“उन्होंने,” “वे”), पर अंत में एकवचन “उसके पिता” है। संदर्भ में यह सुलैमान और उसके पिता दाऊद से संबंधित प्रतीत होता है, किंतु बहुवचन और एकवचन का यह बदलाव इब्रानी पाठ में बना रहता है।
    reason: textual_ambiguity
lexical_decisions:
- source_word: יַעַן אֲשֶׁר
  choice: क्योंकि
  rationale: यह राज्य के विभाजन का कारण प्रस्तुत करता है; आधुनिक हिन्दी में ‘क्योंकि’ इसका स्वाभाविक और स्पष्ट causal रूप है।
- source_word: עֲזָבוּנִי
  choice: उन्होंने मुझे छोड़ दिया
  rationale: עזב यहाँ वाचा से विमुख होकर त्याग देने का भाव रखता है। ‘मुझे छोड़ दिया’ सामान्य पाठक के लिए स्वाभाविक है और धार्मिक विश्वासघात की गंभीरता संदर्भ से स्पष्ट रहती है।
- source_word: וַיִּשְׁתַּחֲווּ
  choice: दण्डवत् किया
  rationale: क्रिया शारीरिक रूप से झुकने और उपासना करने, दोनों का भाव रखती है। ‘दण्डवत् किया’ उस ठोस क्रिया और आराधनात्मक आशय को बनाए रखता है।
- source_word: לְעַשְׁתֹּרֶת
  choice: अश्तोरेत
  rationale: इब्रानी नाम का हिन्दी लिप्यंतरण किया गया है।
- source_word: אֱלֹהֵי צִדֹנִין
  choice: सीदोनियों के देवता
  rationale: इब्रानी पद का औपचारिक रूप ‘सीदोनियों के देवता’ है। अश्तोरेत स्त्री-देवी मानी जाती है, इसलिए अर्थगत विकल्प फुटनोट में रखा गया है।
- source_word: לִכְמוֹשׁ
  choice: कमोश
  rationale: इब्रानी व्यक्तिवाचक नाम का प्रचलित हिन्दी लिप्यंतरण।
- source_word: וּלְמִלְכֹּם
  choice: मिल्कोम
  rationale: मसोरेटिक पाठ में यहाँ मिल्कोम नाम है; मोलेक से संभावित संबंध मुख्य पाठ में थोपने के बजाय फुटनोट में बताया गया है।
- source_word: בְּנֵי עַמּוֹן
  choice: अम्मोनी
  rationale: शाब्दिक ‘अम्मोन के पुत्र’ एक जातीय पद है; ‘अम्मोनी’ आधुनिक हिन्दी में स्वाभाविक समानार्थी है।
- source_word: וְלֹא הָלְכוּ בִדְרָכַי
  choice: वे मेरे मार्गों पर नहीं चले
  rationale: चलने का वाचागत रूपक हिन्दी में भी समझ में आता है और आज्ञाकारिता के जीवन-मार्ग का भाव बनाए रखता है।
- source_word: לַעֲשׂוֹת הַיָּשָׁר בְּעֵינַי
  choice: न उन्होंने वह किया जो मेरी दृष्टि में ठीक है
  rationale: ‘मेरी दृष्टि में’ परमेश्वर के मूल्यांकन को बनाए रखता है। नकारात्मक वाक्य-विन्यास हिन्दी में स्पष्टता के लिए पिछले निषेध से जोड़ा गया है।
- source_word: וְחֻקֹּתַי וּמִשְׁפָּטַי
  choice: मेरी विधियों और मेरे न्याय-विधानों का पालन किया
  rationale: इब्रानी में ‘करना’ तीनों कर्मों पर लागू होता है, पर हिन्दी में विधियों को ‘करना’ अस्वाभाविक है; ‘पालन करना’ वही आज्ञापालन का अर्थ स्वाभाविक रूप से व्यक्त करता है।
- source_word: כְּדָוִד אָבִיו
  choice: जैसा उसके पिता दाऊद ने किया था
  rationale: तुलना को पूर्ण हिन्दी उपवाक्य में व्यक्त किया गया है। ‘उसके पिता’ का एकवचन मूल पाठ के सर्वनाम को सुरक्षित रखता है।
theological_decisions:
- issue: अश्तोरेत के साथ אֱלֹהֵי का लिंग
  choice: मुख्य पाठ में ‘सीदोनियों के देवता’
  alternative: ‘सीदोनियों की देवी’
  rationale: इब्रानी संरचना औपचारिक रूप से ‘देवता’ कहती है, जबकि अश्तोरेत स्त्री-देवी है। मुख्य पाठ स्रोत की अभिव्यक्ति रखता है और सहज अर्थ फुटनोट में देता है।
- issue: מִלְכֹּם की पहचान
  choice: मिल्कोम
  alternative: मोलेक
  rationale: प्राप्त इब्रानी पाठ का नाम ‘मिल्कोम’ है। मोलेक से इसका संबंध माना जाता है, पर उस पहचान को निश्चित बनाकर मूल पाठ पर नहीं थोपा गया।
- issue: बहुवचन कर्ता से एकवचन संबंधसूचक की ओर बदलाव
  choice: ‘उन्होंने/वे’ और अंत में ‘उसके पिता’ दोनों को सुरक्षित रखा
  alternative: पूरे वाक्य को केवल सुलैमान के लिए एकवचन करना
  rationale: इब्रानी में त्यागने, दण्डवत् करने और चलने की क्रियाएँ बहुवचन हैं, लेकिन अंत में ‘उसके पिता’ एकवचन है। इसे एकरूप करना पाठ के वास्तविक तनाव को मिटा देता; फुटनोट पाठक को इस बदलाव से अवगत कराता है।
