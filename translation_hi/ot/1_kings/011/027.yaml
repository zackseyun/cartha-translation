source:
  edition: WLC
  text: וְ/זֶ֣ה הַ/דָּבָ֔ר אֲשֶׁר הֵרִ֥ים יָ֖ד בַּ/מֶּ֑לֶךְ שְׁלֹמֹה֙ בָּנָ֣ה אֶת הַ/מִּלּ֔וֹא סָגַ֕ר אֶת פֶּ֕רֶץ עִ֖יר דָּוִ֥ד אָבִֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/027.yaml
  text: 'And this was the reason why he raised his hand against the king: Solomon had built the Millo and closed up the breach of the city of David his father[a][b].'
translation:
  language: hi
  text: 'और उसने राजा के विरुद्ध हाथ क्यों उठाया[b], इसका कारण यह था: सुलैमान ने मिल्लो[a] का निर्माण किया था और अपने पिता दाऊद के नगर की टूटी हुई जगह को बंद किया था।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “मिल्लो” सम्भवतः यरूशलेम की कोई नामित किलेबन्दी अथवा भराव से बनी सीढ़ीदार संरचना थी।
    reason: cultural_note
  - marker: b
    text: “राजा के विरुद्ध हाथ उठाने” का अर्थ अधिक व्याख्यात्मक रूप में “राजा से विद्रोह करने” भी हो सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: הַדָּבָר
  choice: कारण
  rationale: शाब्दिक अर्थ ‘बात/मामला’ है, पर यहाँ यह यारोबाम की राजविरोधी कार्रवाई का कारण प्रस्तुत करता है; इसलिए आधुनिक हिन्दी में ‘कारण’ स्वाभाविक है।
- source_word: הֵרִים יָד
  choice: हाथ उठाने
  rationale: इब्रानी मुहावरे की ठोस छवि को बनाए रखता है; इसका आशय विरोध या विद्रोह करना है, जिसे पादटिप्पणी में स्पष्ट किया गया है।
- source_word: בַּמֶּלֶךְ
  choice: राजा के विरुद्ध
  rationale: पूर्ववर्ती मुहावरे के साथ בְּ विरोध की दिशा बताता है; मूल में यहाँ सुलैमान का नाम नहीं, बल्कि ‘राजा’ है।
- source_word: הַמִּלּוֹא
  choice: मिल्लो
  rationale: यह यरूशलेम की किसी विशिष्ट संरचना या स्थान का नाम जान पड़ता है; अनिश्चित अर्थ थोपने के बजाय लिप्यंतरण रखा गया है।
- source_word: סָגַר
  choice: बन्द कर दिया
  rationale: क्रिया का मूल अर्थ ‘बन्द करना’ है; दीवार के टूटे भाग के संदर्भ में यह अर्थ स्वाभाविक है।
- source_word: פֶּרֶץ
  choice: दीवार का टूटा हुआ भाग
  rationale: यह किसी सुरक्षा-दीवार में दरार, टूटे हिस्से या खुले स्थान को दर्शाता है। हिन्दी में संदर्भ स्पष्ट करने के लिए ‘दीवार का’ जोड़ा गया है।
- source_word: עִיר דָּוִד
  choice: दाऊद के नगर
  rationale: यह दाऊद से संबद्ध यरूशलेम के गढ़ का पारंपरिक स्थाननाम है।
- source_word: אָבִיו
  choice: अपने पिता
  rationale: सर्वनाम सुलैमान की ओर संकेत करता है; ‘अपने पिता दाऊद’ हिन्दी में संबंध को स्पष्ट और स्वाभाविक बनाता है।
theological_decisions:
- issue: הֵרִים יָד मुहावरे का अर्थ
  choice: मुख्य पाठ में ‘हाथ उठाने’ की मूल छवि रखी गई
  alternative: ‘विद्रोह करने’
  rationale: मुहावरा शत्रुतापूर्ण कार्रवाई अथवा विद्रोह सूचित करता है, पर मुख्य पाठ में अधिक शाब्दिक अभिव्यक्ति रखकर उसकी व्याख्या पादटिप्पणी में दी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी; गरिमापूर्ण किंतु साधारण पाठक के लिए स्पष्ट। इब्रानी मुहावरे और ‘मिल्लो’ की अनिश्चित वास्तु-सांस्कृतिक पहचान को मुख्य पाठ तथा पादटिप्पणियों के संतुलन से सुरक्षित रखा गया है।
