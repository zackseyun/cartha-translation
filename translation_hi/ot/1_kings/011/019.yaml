source:
  edition: WLC
  text: וַ/יִּמְצָא֙ הֲדַ֥ד חֵ֛ן בְּ/עֵינֵ֥י פַרְעֹ֖ה מְאֹ֑ד וַ/יִּתֶּן ל֤/וֹ אִשָּׁה֙ אֶת אֲח֣וֹת אִשְׁתּ֔/וֹ אֲח֖וֹת תַּחְפְּנֵ֥יס הַ/גְּבִירָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/019.yaml
  text: Hadad found great favor in Pharaoh’s eyes[a], and he gave him as a wife the sister of his own wife[b], the sister of Tahpenes the queen mother.
translation:
  language: hi
  text: हदद ने फ़िरौन की दृष्टि में बहुत कृपा पाई, और फ़िरौन ने उसे पत्नी के रूप में अपनी पत्नी की बहन[a] दी—अर्थात् प्रमुख राजमहिला तहपनेस की बहन।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘अपनी पत्नी’ में ‘अपनी’ का संकेत प्रसंग के अनुसार फ़िरौन की ओर है। कम संभावना से इसे हदद की पत्नी के अर्थ में भी समझा जा सकता है।
    reason: alternative_reading
  - marker: b
    text: हिब्रू उपाधि का शाब्दिक अर्थ ‘महान/प्रधान महिला’ है। यह संभवतः राजमाता, महारानी, या दरबार की सर्वोच्च पद वाली राजमहिला को दर्शाती है; मिस्री दरबार में इसका सटीक पद निश्चित नहीं है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּמְצָא ... חֵן בְּעֵינֵי ... מְאֹד
  choice: ने ... की दृष्टि में बहुत कृपा पाई
  rationale: यह हिब्रू मुहावरे की छवि को बनाए रखता है और מְאֹד की तीव्रता को ‘बहुत’ से व्यक्त करता है।
- source_word: פַרְעֹה
  choice: फ़िरौन
  rationale: मिस्र के शासक की उपाधि का हिन्दी बाइबल परंपरा में प्रचलित रूप।
- source_word: וַיִּתֶּן לוֹ אִשָּׁה
  choice: उसे पत्नी के रूप में दे दी
  rationale: वाक्यांश विवाह में स्त्री दिए जाने को सूचित करता है; ‘पत्नी के रूप में’ वैवाहिक अर्थ को स्वाभाविक हिन्दी में स्पष्ट करता है।
- source_word: אֶת אֲחוֹת אִשְׁתּוֹ
  choice: अपनी पत्नी की बहन
  rationale: निकटवर्ती कर्ता फ़िरौन होने और अगले पदबंध में तहपनेस के उल्लेख के कारण सर्वनाम को फ़िरौन से जोड़कर अनूदित किया गया है; मूल की कम संभावित अस्पष्टता पादटिप्पणी में सुरक्षित है।
- source_word: אֲחוֹת תַּחְפְּנֵיס
  choice: अर्थात् राजमाता तहपनेस की बहन
  rationale: यह पदबंध पिछले पदबंध की समानाधिकरणीय पहचान करता है और बताता है कि दी गई स्त्री तहपनेस की बहन थी।
- source_word: תַּחְפְּנֵיס
  choice: तहपनेस
  rationale: हिब्रू नाम का हिन्दी में स्पष्ट और प्रचलित लिप्यंतरण।
- source_word: הַגְּבִירָה
  choice: राजमाता
  rationale: यह उच्च पद वाली राजकीय स्त्री की उपाधि है और अनेक बाइबिलीय प्रसंगों में राजमाता को सूचित करती है; पद का व्यापक अर्थ पादटिप्पणी में दिया गया है।
theological_decisions:
- issue: אִשְׁתּוֹ (‘उसकी पत्नी’) में सर्वनाम का संदर्भ
  choice: 'सर्वनाम फ़िरौन की ओर संकेत करता है: दी गई स्त्री फ़िरौन की पत्नी तहपनेस की बहन थी।'
  alternative: 'सर्वनाम हदद की ओर संकेत करता है: दी गई स्त्री हदद की पत्नी की बहन थी।'
  rationale: वाक्य का कर्ता फ़िरौन है और आगे ‘तहपनेस की बहन’ उसी संबंध को स्पष्ट करता है। फिर भी हिब्रू सर्वनाम अपने आप में दूसरे संदर्भ को पूरी तरह असंभव नहीं बनाता, इसलिए विकल्प पादटिप्पणी में रखा गया है।
- issue: הַגְּבִירָה की राजकीय उपाधि
  choice: राजमाता
  alternative: प्रधान राजमहिला या महारानी
  rationale: यह उपाधि किसी अत्यंत प्रतिष्ठित राजकीय स्त्री के लिए प्रयुक्त होती है और प्रायः राजमाता को दर्शाती है, पर मिस्री दरबार में सटीक पद निश्चित नहीं है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘दृष्टि में कृपा पाई’ मूल हिब्रू मुहावरे को सुरक्षित रखता है, जबकि स्पष्ट कर्ता ‘फ़िरौन’ हिन्दी में सर्वनाम-संबंध की उलझन घटाता है।
