  edition: WLC
  text: רַ֤ק אֶת כָּל הַ/מַּמְלָכָה֙ לֹ֣א אֶקְרָ֔ע שֵׁ֥בֶט אֶחָ֖ד אֶתֵּ֣ן לִ/בְנֶ֑/ךָ לְמַ֨עַן֙ דָּוִ֣ד עַבְדִּ֔/י וּ/לְמַ֥עַן יְרוּשָׁלִַ֖ם אֲשֶׁ֥ר בָּחָֽרְתִּי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/013.yaml
  text: Yet I will not tear away the whole kingdom; I will give one tribe to your son[a], for the sake of David my servant and for the sake of Jerusalem, which I have chosen.
translation:
  language: hi
  text: फिर भी[a] मैं सारा राज्य नहीं छीनूँगा; अपने सेवक दाऊद के कारण और यरूशलेम के कारण, जिसे मैंने चुना है, मैं तुम्हारे पुत्र को एक गोत्र दूँगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या: केवल इतना कि मैं सारा राज्य नहीं छीनूँगा।'
    reason: רַק का अर्थ प्रसंग में विरोधात्मक ‘फिर भी’ अथवा सीमाबोधक ‘केवल इतना कि’ हो सकता है।
lexical_decisions:
- source_word: רַק
  choice: फिर भी
  rationale: यह पिछले न्याय-वचन पर एक सीमा लगाता है। ‘फिर भी’ आधुनिक हिन्दी में इसके विरोधात्मक भाव को स्वाभाविक ढंग से व्यक्त करता है; ‘केवल’ सम्भव विकल्प है और पादटिप्पणी में दिया गया है।
- source_word: כָּל הַמַּמְלָכָה
  choice: सारा राज्य
  rationale: כָּל की समग्रता और राजनीतिक राज्य के अर्थ—दोनों को सहज हिन्दी में बनाए रखता है।
- source_word: אֶקְרָע
  choice: छीनूँगा
  rationale: קָרַע का मूल चित्र ‘फाड़ना’ है, पर यहाँ राज्य को राजवंश से अलग कर देने का राजनीतिक अर्थ प्रमुख है। ‘छीनूँगा’ उस आशय को सामान्य आधुनिक हिन्दी में स्पष्ट करता है, बिना अतिरिक्त कर्ता या कर्म जोड़ने के।
- source_word: שֵׁבֶט אֶחָד
  choice: एक गोत्र
  rationale: इस प्रसंग में שֵׁבֶט राजदंड नहीं, इस्राएल की एक जनजातीय इकाई को सूचित करता है; बाइबलीय हिन्दी में ‘गोत्र’ इसका संक्षिप्त और परिचित पद है।
- source_word: אֶתֵּן לִבְנֶךָ
  choice: मैं तुम्हारे पुत्र को ... दूँगा
  rationale: मूल के सीधे दान-वाचक भाव और संबोधन को सरल आधुनिक हिन्दी में सुरक्षित रखता है।
- source_word: לְמַעַן דָּוִד עַבְדִּי
  choice: अपने सेवक दाऊद के कारण
  rationale: לְמַעַן यहाँ दाऊद के प्रति परमेश्वर के विचार या लिहाज़ को कारण के रूप में रखता है। यह अनुवाद किसी विस्तृत धर्मसैद्धांतिक व्यवस्था को आरोपित नहीं करता।
- source_word: וּלְמַעַן יְרוּשָׁלַם
  choice: और यरूशलेम के कारण
  rationale: पहले לְמַעַן के समानान्तर रचना और दोनों कारणों के स्वतंत्र बल को बनाए रखता है।
- source_word: אֲשֶׁר בָּחָרְתִּי
  choice: जिसे मैंने चुना है
  rationale: पूर्ण क्रिया द्वारा व्यक्त पूर्व चुनाव और उसकी वर्तमान प्रासंगिकता—दोनों को दर्शाता है।
theological_decisions:
- issue: एक गोत्र बचाए रखने का कारण
  choice: राज्य का एक भाग दाऊद और चुने हुए नगर यरूशलेम—दोनों के कारण सुरक्षित रखा जाता है।
  alternative: इसे केवल दाऊदी वाचा के कारण या मुख्यतः मंदिर-नगर के कारण समझना।
  rationale: 'इब्रानी पाठ दो समानान्तर कारण देता है: ‘अपने सेवक दाऊद के कारण’ और ‘यरूशलेम के कारण, जिसे मैंने चुना है।’ अनुवाद किसी एक को दूसरे में समाहित नहीं करता।'
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सहज रखी गई है। परमेश्वर द्वारा सुलैमान को किए गए संबोधन में आदरसूचक ‘तुम्हारे’ प्रयोग किया गया है। समानान्तर ‘के कारण’ वाक्यांश जानबूझकर दोहराए गए हैं।
