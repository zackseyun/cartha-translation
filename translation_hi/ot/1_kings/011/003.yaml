  text: He had seven hundred wives[a], princesses, and three hundred concubines; and his wives turned away his heart.
translation:
  language: hi
  text: उसकी सात सौ पत्नियाँ थीं—राजकुमारियाँ—और तीन सौ रखैलियाँ; और उसकी पत्नियों ने उसका मन फेर दिया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי לוֹ
  choice: उसकी ... थीं
  rationale: היה + ל possession का इब्रानी मुहावरा है; हिन्दी में ‘उसकी ... थीं’ स्वाभाविक रूप से अधिकार/सम्बन्ध व्यक्त करता है।
- source_word: נָשִׁים
  choice: पत्नियाँ
  rationale: राजकीय विवाहों के इस प्रसंग में इसका अर्थ सामान्यतः ‘स्त्रियाँ’ नहीं, बल्कि ‘पत्नियाँ’ है।
- source_word: שָׂרוֹת
  choice: राजकुमारियाँ
  rationale: शब्द उच्च पद या कुल की स्त्रियों को सूचित करता है; इस राजकीय और राजनीतिक विवाह-प्रसंग में ‘राजकुमारियाँ’ उपयुक्त है, जबकि व्यापक विकल्प पादटिप्पणी में रखा गया है।
- source_word: שְׁבַע מֵאוֹת
  choice: सात सौ
  rationale: मूल संख्या का सीधा और स्पष्ट अनुवाद।
- source_word: וּפִלַגְשִׁים
  choice: और तीन सौ रखैलियाँ
  rationale: यह मान्यता-प्राप्त किन्तु पत्नी से निम्न सामाजिक/वैवाहिक दर्जे वाली स्त्रियों को दर्शाता है; ‘रखैलियाँ’ आधुनिक हिन्दी में समझ आने वाला निकटतम संक्षिप्त पद है।
- source_word: שְׁלֹשׁ מֵאוֹת
  choice: तीन सौ
  rationale: मूल संख्या का सीधा और स्पष्ट अनुवाद।
- source_word: וַיַּטּוּ
  choice: फेर दिया
  rationale: נטה यहाँ दिशा बदलने और धार्मिक निष्ठा से हटाने का भाव रखता है; ‘मन फेर दिया’ उस दिशात्मक अर्थ को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: נָשָׁיו
  choice: उसकी पत्नियों
  rationale: अन्तिम उपवाक्य का कर्ता विशेष रूप से उसकी पत्नियाँ हैं; यह कथा के बलाघात को सुरक्षित रखता है।
- source_word: אֶת לִבּוֹ
  choice: उसका मन
  rationale: इब्रानी ‘हृदय’ आन्तरिक विचार, इच्छा और निष्ठा को समेटता है; ‘मन फेरना’ हिन्दी का स्वाभाविक मुहावरा है और केवल शारीरिक हृदय का भ्रम नहीं देता।
theological_decisions:
- issue: प्रसंग में ‘उसका हृदय/मन’ का अर्थ
  choice: सुलैमान की आन्तरिक इच्छा, निष्ठा और भक्ति का फिर जाना
  alternative: केवल भावनात्मक प्रेम या लगाव में परिवर्तन
  rationale: इब्रानी मानव-दृष्टि में לֵב विचार, इच्छा और निष्ठा को भी दर्शाता है। ‘मन फेर दिया’ अर्थ को किसी एक संकीर्ण धर्मवैज्ञानिक व्याख्या में बाँधे बिना इस व्यापकता को स्वाभाविक हिन्दी में व्यक्त करता है।
translation_notes:
  register: आधुनिक मानक हिन्दी, सहज किन्तु गरिमापूर्ण शैली। संख्या और वाक्य-संरचना मूल के निकट रखी गई है। ‘राजकुमारियाँ’ को मुख्य पाठ में और उसके व्यापक शाब्दिक विकल्प को पादटिप्पणी में रखा गया है।
