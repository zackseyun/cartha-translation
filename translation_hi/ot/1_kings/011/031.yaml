base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/031.yaml
  text: 'And he said to Jeroboam[a], “Take for yourself ten pieces, for this is what Yahweh, the God of Israel, says: ‘Look, I am tearing the kingdom out of the hand of Solomon, and I will give you ten tribes.’”'
translation:
  language: hi
  text: 'उसने यारोबाम से कहा, “अपने लिए दस टुकड़े[a] ले, क्योंकि याहवे, इस्राएल का परमेश्वर, यह कहता है: ‘देख, मैं राज्य को सुलैमान के हाथ से फाड़ रहा हूँ और तुझे दस गोत्र दूँगा।’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “दस फाड़े हुए टुकड़े।” इब्रानी संज्ञा फाड़ने से बने टुकड़ों को दर्शाती है और वस्त्र को फाड़ने की अहिय्याह की प्रतीकात्मक क्रिया से मेल खाती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: קַח לְךָ
  choice: अपने लिए ... ले ले
  rationale: आज्ञार्थक क्रिया और לְךָ के व्यक्तिगत/आत्मवाची भाव दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: קְרָעִים
  choice: टुकड़े
  rationale: यह शब्द फाड़ने से बने वस्त्र के टुकड़ों को दर्शाता है। मुख्य पाठ में सहज ‘टुकड़े’ रखा गया है और शब्द की व्युत्पत्तिगत छवि पादटिप्पणी में स्पष्ट की गई है।
- source_word: כִּי כֹה אָמַר
  choice: क्योंकि ... यह कहता है
  rationale: भविष्यद्वाणी के सूत्र का अर्थ आधुनिक, सहज और गरिमापूर्ण हिन्दी में सुरक्षित रहता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी परमेश्वर-नाम को किसी उपाधि से बदलने के बजाय लिप्यंतरित किया गया है।
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: इस्राएल का परमेश्वर
  rationale: सम्बन्धवाचक इब्रानी पदबंध का स्वाभाविक हिन्दी रूप।
- source_word: הִנְנִי
  choice: देख, मैं
  rationale: ध्यान आकर्षित करने वाले अव्यय की तात्कालिकता को पुरातन भाषा के बिना बनाए रखता है।
- source_word: קֹרֵעַ
  choice: फाड़कर अलग कर रहा हूँ
  rationale: कृदन्त की सजीव वर्तमान/आसन्न क्रिया और अहिय्याह के प्रतीकात्मक रूप से वस्त्र फाड़ने की छवि दोनों को सुरक्षित रखता है।
- source_word: הַמַּמְלָכָה
  choice: राज्य
  rationale: राजकीय क्षेत्र और शासन के लिए सीधा तथा मानक हिन्दी शब्द।
- source_word: מִיַּד שְׁלֹמֹה
  choice: सुलैमान के हाथ से
  rationale: अधिकार और आधिपत्य व्यक्त करने वाली इब्रानी ‘हाथ’ की छवि को बनाए रखता है।
- source_word: וְנָתַתִּי לְךָ
  choice: और तुझे ... दूँगा
  rationale: भविष्यकाल और परोक्ष कर्म का संक्षिप्त, स्वाभाविक हिन्दी रूप।
- source_word: עֲשָׂרָה הַשְּׁבָטִים
  choice: दस गोत्र
  rationale: इस्राएल की जनजातीय इकाइयों के लिए प्रचलित बाइबिलीय हिन्दी शब्दावली।
theological_decisions:
- issue: परमेश्वर के नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में व्यक्तिगत परमेश्वर-नाम सीधे प्रयुक्त है; इसलिए उसे उपाधि से प्रतिस्थापित किए बिना हिन्दी में लिप्यंतरित किया गया है।
- issue: राज्य को ‘फाड़ने’ की प्रतीकात्मक छवि
  choice: फाड़कर अलग कर रहा हूँ
  alternative: छीन रहा हूँ
  rationale: ‘छीनना’ राजनीतिक अर्थ स्पष्ट करता, पर वस्त्र फाड़ने की उसी प्रसंगगत प्रतीकात्मक क्रिया को मिटा देता; इसलिए मूल रूपक बनाए रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज किंतु गरिमापूर्ण शैली रखी गई है। एकवचन संबोधन में ‘तू/तुझे’ के अनुरूप आज्ञार्थक ‘ले ले’ प्रयोग हुआ है। मूल की ‘हाथ’ और ‘फाड़ने’ की परस्पर जुड़ी छवियाँ जानबूझकर सुरक्षित रखी गई हैं।
