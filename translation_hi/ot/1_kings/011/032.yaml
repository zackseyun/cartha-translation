  text: וְ/הַ/שֵּׁ֥בֶט הָ/אֶחָ֖ד יִֽהְיֶה לּ֑/וֹ לְמַ֣עַן עַבְדִּ֣/י דָוִ֗ד וּ/לְמַ֨עַן֙ יְר֣וּשָׁלִַ֔ם הָ/עִיר֙ אֲשֶׁ֣ר בָּחַ֣רְתִּי בָ֔/הּ מִ/כֹּ֖ל שִׁבְטֵ֥י יִשְׂרָאֵֽל־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/032.yaml
  text: But one tribe will remain his[a], for the sake of my servant David and for the sake of Jerusalem, the city that I have chosen from all the tribes of Israel.
translation:
  language: hi
  text: परन्तु एक गोत्र उसके पास रहेगा[a], मेरे सेवक दाऊद और यरूशलेम, उस नगर के लिए जिसे मैंने इस्राएल के सभी गोत्रों में से चुना है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: हिब्रू में शाब्दिक रूप से ‘एक गोत्र’ है। इसे प्रायः इस अर्थ में समझा जाता है कि बिन्यामीन यहूदा के साथ सम्मिलित था, विशेषकर यरूशलेम की स्थिति के कारण; फिर भी मूल पाठ स्वयं ‘एक गोत्र’ ही कहता है।
    reason: वैकल्पिक व्याख्या और संख्यात्मक तनाव को बताए बिना मूल पाठ को बदले सुरक्षित रखना।
lexical_decisions:
- source_word: וְהַשֵּׁבֶט הָאֶחָד
  choice: परन्तु एक गोत्र
  rationale: שֵׁבֶט यहाँ छड़ी या राजदण्ड नहीं, बल्कि इस्राएल की एक गोत्रीय इकाई को दर्शाता है। वाक्य का आरम्भिक וְ पिछले प्रसंग के विपरीत भाव में है, इसलिए ‘परन्तु’ स्वाभाविक है।
- source_word: יִהְיֶה לּוֹ
  choice: उसका बना रहेगा
  rationale: शाब्दिक अर्थ ‘उसका होगा’ है; राज्य छीने जाने के प्रसंग में यह किसी भाग के उसके अधिकार में बने रहने को व्यक्त करता है।
- source_word: לְמַעַן
  choice: के कारण
  rationale: यहाँ לְמַעַן दाऊद और यरूशलेम के प्रति परमेश्वर के आदर या प्रतिबद्धता पर आधारित कारण को व्यक्त करता है। सरल आधुनिक हिन्दी में ‘के कारण’ स्वाभाविक है।
- source_word: עַבְדִּי דָוִד
  choice: मेरे सेवक दाऊद
  rationale: यह दाऊद के लिए प्रयुक्त सम्मानसूचक राजकीय और वाचागत पदवी है; ‘सेवक’ आधुनिक हिन्दी में उपयुक्त है।
- source_word: יְרוּשָׁלִַם הָעִיר
  choice: यरूशलेम ... उस नगर
  rationale: हिब्रू में ‘नगर’ यरूशलेम का समानाधिकरण है। हिन्दी में अगले सम्बन्धवाचक उपवाक्य के साथ ‘उस नगर’ कहना स्पष्ट और स्वाभाविक है।
- source_word: אֲשֶׁר בָּחַרְתִּי בָהּ
  choice: जिसे मैंने ... चुन लिया है
  rationale: पूर्ण क्रिया परमेश्वर के सम्पन्न चयन को बताती है जिसका प्रभाव वर्तमान में बना है। בָהּ को हिन्दी में क्रिया ‘चुनना’ के साथ अलग से व्यक्त करना आवश्यक नहीं है।
- source_word: מִכֹּל שִׁבְטֵי יִשְׂרָאֵל
  choice: इस्राएल के सभी गोत्रों में से
  rationale: בחר के साथ מִן बड़े समूह में से चयन को दर्शाता है; ‘में से’ हिन्दी में इस सम्बन्ध को ठीक व्यक्त करता है।
theological_decisions:
- issue: ‘एक गोत्र’ और उन विवरणों के बीच संख्यात्मक तनाव जिनमें यहूदा और बिन्यामीन दोनों रहूबियाम से जुड़े दिखते हैं
  choice: मुख्य पाठ में हिब्रू के अनुसार ‘एक गोत्र’
  alternative: बिन्यामीन को यहूदा में सम्मिलित मानकर ‘दो गोत्र’ या ‘एक राज्य’ लिखना
  rationale: हिब्रू पाठ स्पष्ट रूप से ‘एक गोत्र’ कहता है। अनुवाद में सामंजस्य बैठाकर इस तनाव को मिटाना उचित नहीं; सम्भावित ऐतिहासिक व्याख्या पादटिप्पणी में दी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सामान्य पाठक के लिए सुबोध रूप। ‘गोत्र’, ‘सेवक’ और ‘यरूशलेम’ जैसे स्थापित बाइबलीय शब्द रखे गए हैं। वाक्य में कारण की पुनरावृत्ति हिब्रू संरचना और दाऊद तथा यरूशलेम दोनों पर दिए बल को बनाए रखती है।
