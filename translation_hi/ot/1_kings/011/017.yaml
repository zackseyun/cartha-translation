  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। मूल इब्रानी के संयुक्त वाक्य को हिन्दी की स्पष्टता के लिए दो वाक्यों में बाँटा गया है; ‘उस समय’ अंतिम उपवाक्य का प्रसंग-संबंध बनाए रखता है।
