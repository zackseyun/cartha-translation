base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/017.yaml
  text: Hadad fled to Egypt[a], he and some Edomite men from among his father's servants with him[b]; and Hadad was a young boy.
translation:
  language: hi
  text: हदद अपने पिता के सेवकों में से कुछ एदोमी पुरुषों को साथ लेकर मिस्र भाग गया[a]। हदद अभी बहुत छोटा लड़का था[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “मिस्र आने के लिए।” इब्रानी में कई बार “आना” वहाँ भी प्रयुक्त होता है जहाँ हिन्दी में “जाना” या केवल गंतव्य बताना अधिक स्वाभाविक है।
    reason: lexical_alternative
  - marker: b
    text: इसका अनुवाद “एक छोटा बालक” या “कम उम्र का लड़का” भी हो सकता है। इब्रानी पदबंध इस बात पर बल देता है कि हदद उस समय बहुत कम उम्र का था।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּבְרַח
  choice: भाग गया
  rationale: ब्रח के काल रूप का अर्थ यहाँ संकट से बचने के लिए भागना है। ‘भाग गया’ आधुनिक हिन्दी में स्वाभाविक है और प्रसंग में पलायन का भाव स्पष्ट करता है।
- source_word: אֲדַד
  choice: हदद
  rationale: व्यक्तिवाचक नाम का प्रचलित हिन्दी लिप्यंतरण।
- source_word: הוּא וַאֲנָשִׁים אֲדֹמִיִּים
  choice: हदद ... कुछ एदोमी पुरुषों के साथ
  rationale: स्वतंत्र सर्वनाम הוּא हदद को प्रमुख कर्ता के रूप में उभारता है, जबकि अनिश्चित אֲנָשִׁים אֲדֹמִיִּים उसके साथ गए एदोमी पुरुषों को बताता है। हिन्दी वाक्य-विन्यास में इसे साथ-सूचक पदबंध द्वारा स्वाभाविक रूप से व्यक्त किया गया है।
- source_word: מֵעַבְדֵי אָבִיו
  choice: अपने पिता के सेवकों में से
  rationale: מִן का अंशवाचक भाव ‘में से’ द्वारा सुरक्षित है और עֶבֶד के लिए इस राजकीय-गृहस्थ प्रसंग में ‘सेवक’ सीधा तथा व्यापक शब्द है।
- source_word: אִתּוֹ
  choice: के साथ
  rationale: यह बताता है कि एदोमी पुरुष हदद के साथ गए थे।
- source_word: לָבוֹא מִצְרָיִם
  choice: मिस्र की ओर
  rationale: בוא का शाब्दिक अर्थ ‘आना’ है, पर भागने की क्रिया के साथ हिन्दी में गंतव्य को ‘मिस्र की ओर’ कहना स्वाभाविक है। शाब्दिक रूप पादटिप्पणी में दिया गया है।
- source_word: נַעַר קָטָן
  choice: अभी बहुत छोटा लड़का
  rationale: נַעַר लड़के या युवक को और קָטָן उसकी कम आयु को रेखांकित करता है। ‘अभी बहुत छोटा लड़का’ आधुनिक हिन्दी में आयु का भाव स्पष्ट करता है, न कि केवल शारीरिक कद का।
