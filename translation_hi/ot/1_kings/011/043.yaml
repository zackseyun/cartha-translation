  yaml_path: translation/ot/1_kings/011/043.yaml
  text: And Solomon slept with his fathers and was buried in the city of David his father[a], and Rehoboam his son reigned in his place.
translation:
  language: hi
  text: सुलैमान अपने पुरखों के साथ सो गया[a] और उसे उसके पिता दाऊद के नगर में दफनाया गया। तब उसका पुत्र रहूबियाम उसके स्थान पर राज्य करने लगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “अपने पुरखों के साथ सो गया” मृत्यु और अपने पूर्वजों में जा मिलने के लिए प्रयुक्त एक पारंपरिक इब्रानी अभिव्यक्ति है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁכַּב ... עִם אֲבֹתָיו
  choice: अपने पुरखों के साथ सो गया
  rationale: यह राजकीय मृत्यु-सूचना में प्रयुक्त पारंपरिक इब्रानी मुहावरा है। यह अनुवाद मृत्यु का आशय स्पष्ट करने वाली टिप्पणी के साथ मूल रूपक और वंशगत भाव बनाए रखता है।
- source_word: וַיִּקָּבֵר
  choice: उसे ... दफनाया गया
  rationale: निफ़अल रूप का निष्क्रिय अर्थ स्वाभाविक आधुनिक हिन्दी में व्यक्त किया गया है।
- source_word: בְּעִיר דָּוִד אָבִיו
  choice: उसके पिता दाऊद के नगर में
  rationale: यह दफनाने के स्थान को दाऊद के राजकीय नगर के रूप में पहचानता है और साथ ही दाऊद को सुलैमान का पिता बताने वाला मूल वंशगत बल सुरक्षित रखता है।
- source_word: וַיִּמְלֹךְ
  choice: राज्य करने लगा
  rationale: उत्तराधिकार की सूचना में यह स्वाभाविक हिन्दी है और राजपद संभालकर शासन आरंभ करने का भाव व्यक्त करती है।
- source_word: תַּחְתָּיו
  choice: उसके स्थान पर
  rationale: यह केवल कालक्रम नहीं, बल्कि सुलैमान के स्थान पर रहूबियाम के राजकीय उत्तराधिकार को व्यक्त करता है।
