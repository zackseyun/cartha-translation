source:
  edition: WLC
  text: וְ/לִ/בְנ֖/וֹ אֶתֵּ֣ן שֵֽׁבֶט אֶחָ֑ד לְמַ֣עַן הֱיֽוֹת נִ֣יר לְ/דָֽוִיד עַ֠בְדִּ/י כָּֽל הַ/יָּמִ֤ים לְ/פָנַ/י֙ בִּ/יר֣וּשָׁלִַ֔ם הָ/עִיר֙ אֲשֶׁ֣ר בָּחַ֣רְתִּי לִ֔/י לָ/שׂ֥וּם שְׁמִ֖/י שָֽׁם־־־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/036.yaml
  text: But to his son I will give one tribe[a], so that David my servant may always have a lamp before me in Jerusalem, the city that I have chosen for myself to put my name there.
translation:
  language: hi
  text: पर उसके पुत्र को मैं एक गोत्र दूँगा, ताकि मेरे दास दाऊद के लिए मेरे सामने यरूशलेम में सदा एक दीपक[a] बना रहे—उस नगर में, जिसे मैंने अपने लिए इसलिए चुना है कि वहाँ अपना नाम रखूँ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “ज्योति।” यहाँ “दीपक” दाऊद के वंश अथवा स्थायी राजकीय सत्ता के बने रहने का रूपक है।
    reason: नִיר के वैकल्पिक अर्थ और उसके राजवंशीय रूपक को स्पष्ट करना।
lexical_decisions:
- source_word: שֵׁבֶט אֶחָד
  choice: एक गोत्र
  rationale: राज्य के विभाजन के प्रसंग में שֵׁבֶט किसी राजदंड के बजाय एक गोत्रीय-राजनीतिक इकाई को दर्शाता है।
- source_word: לְמַעַן הֱיוֹת
  choice: ताकि ... बना रहे
  rationale: यह रचना उद्देश्य व्यक्त करती है; हिंदी में यह प्रयोग उस प्रयोजन और निरंतरता दोनों को स्वाभाविक रूप से व्यक्त करता है।
- source_word: נִיר
  choice: दीपक
  rationale: यह दाऊद के राजवंश की निरंतरता का ठोस रूपक है। ‘दीपक’ मूल बिंब को बनाए रखता है; इसे मुख्य पाठ में केवल ‘वंश’ कहने से रूपक मिट जाता।
- source_word: לְדָוִיד עַבְדִּי
  choice: मेरे दास दाऊद के लिए
  rationale: यह मूल के संबंधसूचक לְ और ‘मेरे दास’ की सम्मानसूचक वाचा-भाषा दोनों को सुरक्षित रखता है।
- source_word: כָּל הַיָּמִים
  choice: सदा
  rationale: यह इब्रानी मुहावरे की निरंतरता को संक्षिप्त और सहज आधुनिक हिंदी में व्यक्त करता है।
- source_word: לְפָנַי
  choice: मेरे सामने
  rationale: यह परमेश्वर की दृष्टि और उपस्थिति में बने रहने के इब्रानी मुहावरे को सीधे बनाए रखता है।
- source_word: בָּחַרְתִּי לִי
  choice: मैंने अपने लिए चुना है
  rationale: ‘अपने लिए’ से לִי का आत्मसंबंधी बल बना रहता है, और पूर्ण क्रिया का वर्तमान-परिणामी भाव भी व्यक्त होता है।
- source_word: לָשׂוּם שְׁמִי שָׁם
  choice: कि वहाँ अपना नाम रखूँ
  rationale: यह व्यवस्थाविवरणीय इतिहास की महत्वपूर्ण ‘नाम रखने’ वाली मंदिर-वाचा भाषा को व्याख्यात्मक विस्तार के बिना सुरक्षित रखता है।
- source_word: וְלִבְנוֹ
  choice: पर उसके पुत्र को
  rationale: संदर्भ में संयोजक पूर्ववर्ती राज्य-विभाजन के विपरीत दाऊद के पुत्र के लिए बचाए गए भाग को प्रस्तुत करता है, इसलिए ‘पर’ उपयुक्त है।
theological_decisions:
- issue: נִיר में राजवंशीय रूपक
  choice: ‘दीपक’ को दाऊद के वंश अथवा राजकीय उपस्थिति की निरंतरता के रूपक के रूप में बनाए रखा
  alternative: ‘ज्योति’ या मुख्य पाठ में सीधे ‘वंश’
  rationale: मूल पाठ दाऊद के लिए यरूशलेम में बने रहने वाले दीपक की बात करता है। रूपक को सुरक्षित रखने से पाठक उसका राजवंशीय आशय देख सकते हैं, जबकि अनुवाद उसे व्याख्या में नहीं बदलता।
- issue: ‘वहाँ अपना नाम रखूँ’ में मंदिर-विज्ञान
  choice: ‘नाम रखने’ के मूल मुहावरे को बनाए रखा
  alternative: ‘वहाँ अपनी उपस्थिति स्थापित करूँ’ या ‘वहाँ मेरी आराधना हो’
  rationale: इब्रानी पाठ विशिष्ट ‘नाम’ सूत्र का प्रयोग करता है। इसे ‘उपस्थिति’ अथवा ‘आराधना’ में बदलना मूल की धर्मवैचारिक अभिव्यक्ति को समय से पहले स्पष्ट कर देता।
translation_notes:
  register: आधुनिक मानक हिंदी में सहज किंतु गरिमापूर्ण शैली रखी गई है। ‘गोत्र’, ‘मेरे दास दाऊद’, ‘दीपक’ और ‘अपना नाम रखूँ’ जैसे प्रमुख बाइबलीय पदों तथा रूपकों को व्याख्यात्मक सरलीकरण के बिना सुरक्षित रखा गया है।
