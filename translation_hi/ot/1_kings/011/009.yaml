language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יִּתְאַנַּ֥ף יְהוָ֖ה בִּ/שְׁלֹמֹ֑ה כִּֽי נָטָ֣ה לְבָב֗/וֹ מֵ/עִ֤ם יְהוָה֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל הַ/נִּרְאָ֥ה אֵלָ֖י/ו פַּעֲמָֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/009.yaml
  text: And Yahweh became angry with Solomon, because his heart had turned away from Yahweh, the God of Israel, who had appeared to him twice.
translation:
  language: hi
  text: याहवे सुलैमान पर क्रोधित हुए, क्योंकि उसका हृदय इस्राएल के परमेश्वर याहवे से फिर गया था, जिन्होंने उसे दो बार दर्शन दिया था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּתְאַנַּף
  choice: क्रोधित हुए
  rationale: यह रूप क्रोध के प्रकट होने को व्यक्त करता है। ‘क्रोधित हुए’ स्वाभाविक हिंदी में इस क्रिया का बल बनाए रखता है, पर उसे अनावश्यक रूप से तीव्र नहीं करता।
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत वाचा-नाम को उपाधि से बदलने के बजाय देवनागरी लिप्यंतरण में प्रस्तुत किया गया है।
- source_word: בִּשְׁלֹמֹה
  choice: सुलैमान पर
  rationale: क्रोध की क्रिया के साथ בְּ यहाँ क्रोध के लक्ष्य को दर्शाता है; हिंदी में ‘पर क्रोधित हुए’ स्वाभाविक प्रयोग है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यह याहवे के क्रोध का कारण प्रस्तुत करता है।
- source_word: נָטָה לְבָבוֹ
  choice: उसका हृदय ... से फिर गया था
  rationale: हृदय के मुड़ने अथवा झुकने की इब्रानी उपमा को बनाए रखते हुए ‘फिर गया’ निष्ठा से विमुख होने का अर्थ स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: מֵעִם
  choice: से
  rationale: यह संबंध और निष्ठा से अलगाव दर्शाता है; ‘फिर गया’ के साथ ‘से’ पर्याप्त और सहज है।
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: इस्राएल के परमेश्वर
  rationale: संबंधसूचक इब्रानी पदबंध का सीधा और प्रचलित हिंदी रूप।
- source_word: הַנִּרְאָה אֵלָיו
  choice: जिन्होंने उसे ... दर्शन दिया था
  rationale: विशेषणात्मक कृदंत को याहवे की ओर संकेत करने वाले आदरसूचक संबंधवाचक उपवाक्य में व्यक्त किया गया है; पूर्व घटनाओं के कारण पूर्ण भूतकाल उचित है।
- source_word: פַּעֲמָיִם
  choice: दो बार
  rationale: द्विवचन का स्वाभाविक हिंदी क्रियाविशेषणीय रूप।
theological_decisions:
- issue: परमेश्वर के नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा अथवा ‘प्रभु’
  rationale: मूल पाठ में वाचा-नाम सीधे आया है; ‘याहवे’ उसका लिप्यंतरण करके व्यक्तिगत नाम को सुरक्षित रखता है।
- issue: परमेश्वर के क्रोध का मानव-सदृश वर्णन
  choice: क्रोधित हुए
  alternative: अप्रसन्न हुए अथवा अत्यंत क्रुद्ध हुए
  rationale: अनुवाद मूल पाठ के क्रोध-वर्णन को न तो नरम करता है और न उसकी तीव्रता बढ़ाता है।
- issue: הַנִּרְאָה का कर्ता
  choice: याहवे, जिन्होंने उसे दो बार दर्शन दिया था
  alternative: इस्राएल के परमेश्वर, जो उसे दो बार दिखाई दिए थे
  rationale: व्याकरणतः संबंधवाचक वर्णन निकटवर्ती ‘इस्राएल के परमेश्वर याहवे’ को संदर्भित करता है; हिंदी में आदरसूचक बहुवचन से वही संदर्भ स्पष्ट रहता है।
translation_notes:
  register: आधुनिक मानक हिंदी का गरिमापूर्ण और सामान्य पाठकों के लिए सहज रूप। ‘हृदय’ की मूल बाइबिलीय छवि सुरक्षित रखी गई है और ‘दर्शन दिया’ परमेश्वर के प्रकट होने के लिए स्वाभाविक धार्मिक हिंदी है।
