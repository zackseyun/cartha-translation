base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/021.yaml
  text: When Hadad heard in Egypt that David had lain down with his fathers and that Joab[a], the commander of the army, was dead, Hadad said to Pharaoh, “Send me away[b], so that I may go to my own land.”
translation:
  language: hi
  text: जब हदद ने मिस्र में सुना कि दाऊद अपने पुरखाओं के साथ सो गया था[a] और सेनापति योआब मर चुका था, तब हदद ने फ़िरौन से कहा, “मुझे विदा कर दीजिए, ताकि मैं अपने देश चला जाऊँ।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक अर्थ: “अपने पुरखाओं के साथ लेट गया”; यह मृत्यु के लिए प्रचलित इब्रानी मुहावरा है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁמַע
  choice: सुना
  rationale: मूल क्रिया का सामान्य अर्थ ‘सुनना’ है; इस प्रसंग में इसका आशय समाचार मिलने से है।
- source_word: שָׁכַב ... עִם אֲבֹתָיו
  choice: अपने पुरखाओं के साथ सो गया है
  rationale: यह मृत्यु के लिए प्रचलित इब्रानी मुहावरा है। हिंदी में ‘सो गया’ मूल बिंब और राजकीय मृत्यु-वर्णन की शैली को बनाए रखता है।
- source_word: מֵת
  choice: मर गया है
  rationale: यहाँ पूर्ण हुई मृत्यु और उसके परिणामस्वरूप मृत अवस्था दोनों निहित हैं; स्वाभाविक हिंदी में ‘मर गया है’ उपयुक्त है।
- source_word: שַׂר הַצָּבָא
  choice: सेनापति
  rationale: यह सेना के प्रधान अधिकारी का संक्षिप्त, स्पष्ट और आधुनिक हिंदी पद है।
- source_word: שַׁלְּחֵנִי
  choice: मुझे विदा कर दीजिए
  rationale: यह फ़िरौन से अपने दरबार से जाने की अनुमति और रिहाई माँगने का आदरपूर्ण निवेदन है।
- source_word: וְאֵלֵךְ
  choice: ताकि मैं ... चला जाऊँ
  rationale: आज्ञार्थक निवेदन के बाद प्रयोजन अथवा इच्छित परिणाम को स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: אַרְצִי
  choice: अपने देश
  rationale: ‘देश’ यहाँ पैतृक भूभाग के अर्थ में स्वाभाविक है और संबंधसूचक प्रत्यय को ‘अपने’ से व्यक्त करता है।
