source:
  edition: WLC
  text: וַ/יֵּ֣לֶךְ שְׁלֹמֹ֔ה אַחֲרֵ֣י עַשְׁתֹּ֔רֶת אֱלֹהֵ֖י צִדֹנִ֑ים וְ/אַחֲרֵ֣י מִלְכֹּ֔ם שִׁקֻּ֖ץ עַמֹּנִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/005.yaml
  text: Solomon went after Ashtoreth[a], the god of the Sidonians, and after Milcom[c][b], the abomination of the Ammonites.
translation:
  language: hi
  text: सुलैमान सीदोनियों की देवी अश्तोरेत[a] के पीछे चला, और अम्मोनियों के घृणित देवता मिल्कोम[b] के पीछे भी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘अस्तार्ते’ इस देवी के नाम का अधिक प्रचलित वैकल्पिक रूप है। इब्रानी पाठ में यहाँ ‘अश्तोरेत’ है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी पाठ में ‘मिल्कोम’ है। कुछ लोग मिल्कोम को मोलेक से जोड़ते हैं, पर यहाँ नाम ‘मोलेक’ नहीं लिखा है।
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֵּלֶךְ ... אַחֲרֵי
  choice: के पीछे चला
  rationale: यह इब्रानी मुहावरा यहाँ केवल शारीरिक रूप से पीछे जाने के बजाय निष्ठा और उपासना में अनुसरण करने का संकेत देता है। हिंदी में ‘के पीछे चला’ मूल बिंब और संदर्भगत आशय दोनों को बनाए रखता है।
- source_word: עַשְׁתֹּרֶת
  choice: अश्तोरेत
  rationale: नाम को इस पद के इब्रानी रूप के अनुसार लिप्यंतरित किया गया है; ‘अस्तार्ते’ अधिक प्रचलित वैकल्पिक रूप है।
- source_word: אֱלֹהֵי צִדֹנִים
  choice: सीदोनियों की देवी
  rationale: אֱלֹהֵי का रूप ‘देवता/देवताओं’ का हो सकता है, किंतु यहाँ यह स्त्री देवता अश्तोरेत के साथ समानाधिकरण में है; इसलिए हिंदी में स्वाभाविक और संदर्भानुकूल रूप ‘देवी’ है।
- source_word: מִלְכֹּם
  choice: मिल्कोम
  rationale: मसोरेटिक पाठ में यहाँ मिल्कोम नाम है; इसे मोलेक में बदलना पाठगत भेद को मिटा देगा।
- source_word: שִׁקֻּץ עַמֹּנִים
  choice: अम्मोनियों का घृणित देवता
  rationale: שִׁקֻּץ किसी अत्यंत घृणित, विशेषतः मूर्तिपूजक वस्तु या देवता के लिए तीखा निंदात्मक शब्द है। हिंदी में ‘घृणित देवता’ संदर्भित सत्ता और मूल्यांकन दोनों को स्पष्ट तथा स्वाभाविक रूप से व्यक्त करता है।
theological_decisions:
- issue: क्या सुलैमान के कार्य को मुख्य पाठ में सीधे ‘उपासना की’ कहा जाए
  choice: मूल मुहावरे के अनुरूप ‘के पीछे चला’ रखा गया
  alternative: ‘की उपासना की’ या ‘का अनुसरण किया’
  rationale: संदर्भ धर्मत्याग और मूर्तिपूजा का है, पर पद स्वयं ‘पीछे चलने’ का मुहावरा इस्तेमाल करता है। इसे बनाए रखने से मूल कथन से अधिक स्पष्ट व्याख्या मुख्य पाठ में नहीं जोड़ी जाती।
- issue: אֱלֹהֵי צִדֹנִים में व्याकरणिक रूप और अश्तोरेत के स्त्री-संदर्भ का संबंध
  choice: ‘सीदोनियों की देवी’
  alternative: ‘सीदोनियों के देवता’ या अधिक शाब्दिक ‘सीदोनियों के देवताओं’
  rationale: नामित सत्ता अश्तोरेत स्त्री देवता है और वाक्यांश उसी की पहचान बताता है। ‘देवी’ संदर्भ को स्वाभाविक हिंदी में व्यक्त करता है, जबकि फुटनोट इब्रानी रूप की अस्पष्टता सुरक्षित रखता है।
- issue: मिल्कोम और मोलेक की संभावित पहचान
  choice: मुख्य पाठ में ‘मिल्कोम’
  alternative: ‘मोलेक’
  rationale: इस पद के इब्रानी पाठ में מִלְכֹּם है। संभावित ऐतिहासिक संबंध को नाम बदलकर निश्चित नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिंदी में सहज किंतु गरिमापूर्ण शैली रखी गई है। ‘के पीछे चला’ मूल इब्रानी मुहावरे को बचाता है। देवताओं के नामों का देवनागरी लिप्यंतरण स्रोत-पाठ के रूप के निकट रखा गया है।
