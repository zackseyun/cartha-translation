  text: And this matter became sin for the house of Yarovam[b][a], to cut it off and to destroy it from the face of the ground.
translation:
  language: hi
  text: और यह बात यारोबाम के घराने के लिए पाप बन गई—उसके उच्छेद और धरती के ऊपर से उसके विनाश के लिए।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי בַּדָּבָר הַזֶּה לְחַטַּאת
  choice: यह बात ... के लिए पाप बन गई
  rationale: दבר यहाँ पिछली घटना या कार्यवाही की ओर संकेत करता है, केवल बोले गए ‘वचन’ की ओर नहीं। היה לְחַטָּאת के परिणामसूचक भाव को ‘पाप बन गई’ स्वाभाविक रूप से व्यक्त करता है।
- source_word: בֵּית יָרָבְעָם
  choice: यारोबाम का घराना
  rationale: ‘घराना’ परिवार, वंश और राजवंश—तीनों की हिब्रू व्यापकता को सहज हिन्दी में बनाए रखता है।
- source_word: וּלְהַכְחִיד וּלְהַשְׁמִיד
  choice: उसका नामोनिशान मिट गया और वह ... नष्ट हो गया
  rationale: 'दो अलग विनाशसूचक क्रियाओं का भेद रखा गया है: पहली पूर्णतः लुप्त किए जाने और दूसरी नाश किए जाने का भाव देती है। हिन्दी में परिणामसूचक रूप पूर्ववर्ती ‘पाप बन गई’ से इन क्रियाओं का संबंध स्पष्ट करता है।'
- source_word: מֵעַל פְּנֵי הָאֲדָמָה
  choice: धरती पर से
  rationale: यह हिब्रू मुहावरा भूमि या धरती से पूरी तरह हटा दिए जाने का अर्थ देता है; ‘धरती पर से’ आधुनिक हिन्दी में स्वाभाविक है।
theological_decisions:
- issue: विनाशसूचक क्रियाओं का निहित कर्म
  choice: यारोबाम का घराना/वंश
  alternative: ‘यह बात’ अथवा पापपूर्ण मामला
  rationale: वाक्य-विन्यास और राजवंश के न्याय का कथानक—दोनों के अनुसार निकटतम और सर्वाधिक संगत निहित कर्म ‘यारोबाम का घराना’ है।
- issue: לְ उपसर्ग वाले अंतिम क्रियारूपों का संबंध
  choice: पाप के परिणाम/उद्देश्य के रूप में घराने का मिटना और नष्ट होना
  alternative: केवल दूरस्थ भविष्यवाणी या असंबद्ध अगला परिणाम
  rationale: हिब्रू में उद्देश्य और परिणाम की सीमा यहाँ पूर्णतः कठोर नहीं है। हिन्दी का ‘जिसके कारण’ प्रमुख परिणामसूचक अर्थ स्पष्ट करता है, बिना यह कहे कि पाप स्वयं कोई सचेत कर्ता था।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘घराना’ राजवंशीय अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है; ‘नामोनिशान मिटना’ पूर्ण उन्मूलन का प्रचलित किंतु गंभीर मुहावरा है।
