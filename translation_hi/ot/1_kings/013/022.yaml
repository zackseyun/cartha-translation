  text: but you came back and ate bread and drank water in the place about which he said to you[a], ‘Do not eat bread, and do not drink water’—your corpse shall not come to the tomb of your fathers.
translation:
  language: hi
  text: पर तू लौट आया और उस स्थान पर रोटी खाई और पानी पिया, जिसके बारे में उसने तुझसे कहा था, ‘रोटी मत खाना और पानी मत पीना।’ तेरी लाश तेरे पुरखाओं की कब्र तक नहीं पहुँचेगी।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “तेरी लाश तेरे पुरखाओं की कब्र तक नहीं आएगी।”
    reason: मूल इब्रानी में ‘आना’ क्रिया की ठोस छवि को दर्ज करना।
lexical_decisions:
- source_word: וַתָּשָׁב
  choice: तू लौट आया
  rationale: שׁוב का सीधा अर्थ ‘लौटना’ है; एक व्यक्ति को संबोधित करते हुए एकवचन और फटकार का सीधा स्वर रखा गया है।
- source_word: וַתֹּאכַל לֶחֶם
  choice: रोटी खाई
  rationale: ठोस संज्ञा ‘रोटी’ को बनाए रखने से पहले दिए गए निषेध की शब्दावली ठीक प्रकार दोहरती है।
- source_word: וַתֵּשְׁתְּ מַיִם
  choice: पानी पिया
  rationale: इब्रानी की सरल और दोहराई गई अभिव्यक्ति को स्वाभाविक हिन्दी में ज्यों का त्यों रखा गया है।
- source_word: בַּמָּקוֹם אֲשֶׁר דִּבֶּר אֵלֶיךָ
  choice: उस स्थान पर ... जिसके विषय में उसने तुझसे कहा था
  rationale: सम्बन्धवाचक उपवाक्य उस स्थान को वचन के विषय के रूप में दिखाता है; यह हिन्दी में अर्थपूर्ण और स्वाभाविक है।
- source_word: אַל תֹּאכַל לֶחֶם וְאַל תֵּשְׁתְּ מָיִם
  choice: ‘रोटी मत खाना और पानी मत पीना’
  rationale: दोनों पृथक निषेध और उनकी समानान्तर संरचना सुरक्षित रखी गई है।
- source_word: נִבְלָתְךָ
  choice: तेरी लाश
  rationale: נְבֵלָה मृत शरीर को सूचित करता है; ‘लाश’ आधुनिक हिन्दी में स्पष्ट है और न्याय-वचन की कठोरता बनाए रखता है।
- source_word: לֹא תָבֹא נִבְלָתְךָ אֶל קֶבֶר אֲבֹתֶיךָ
  choice: तेरी लाश तेरे पुरखाओं की कब्र तक नहीं पहुँचेगी
  rationale: शाब्दिक ‘नहीं आएगी’ हिन्दी में अस्वाभाविक होता; ‘नहीं पहुँचेगी’ शरीर के पारिवारिक कब्र तक न आने की मूल छवि को बिना अनावश्यक कर्मवाच्य विस्तार के सुरक्षित रखता है।
- source_word: אֲבֹתֶיךָ
  choice: तेरे पुरखाओं
  rationale: यहाँ ‘पुरखा’ पैतृक पूर्वजों और उनकी पारिवारिक दफन-भूमि का स्वाभाविक हिन्दी बोध देता है।
theological_decisions:
- issue: न्याय-वचन का स्वरूप
  choice: परमेश्वर के जन की लाश उसके पुरखाओं की कब्र तक नहीं पहुँचेगी—पारिवारिक दफन से वंचित होने का ठोस कथन
  alternative: मृत्यु के बाद अपमान का व्यापक रूपक
  rationale: इब्रानी पाठ स्पष्ट रूप से लाश और पुरखाओं की कब्र का उल्लेख करता है। अनुवाद इसी ठोस अर्थ को रखता है और उसके धार्मिक-सामाजिक परिणामों को पाठ से आगे बढ़ाकर नहीं बताता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सीधे सम्बोधन वाली है। ‘तू/तेरी’ प्रसंग की एकवचन फटकार को दर्शाता है, अनादर जोड़ने के लिए नहीं। मुख्य पाठ में कारण-परिणाम का सम्बन्ध स्पष्ट करने हेतु ‘इसलिए’ प्रयोग किया गया है; इब्रानी में यह सम्बन्ध वाक्यक्रम और न्याय-घोषणा से निहित है।
