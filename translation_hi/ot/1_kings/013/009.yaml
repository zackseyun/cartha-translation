  yaml_path: translation/ot/1_kings/013/009.yaml
  text: For this is what he commanded me by the word of the LORD, saying, ‘You shall not eat bread, nor drink water, nor return by the way that you went.’
translation:
  language: hi
  text: 'क्योंकि यहोवा के वचन के द्वारा उसने मुझे ऐसी आज्ञा दी थी: ‘रोटी न खाना, पानी न पीना, और उस मार्ग से न लौटना जिससे तुम गए थे।’'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי כֵן
  choice: क्योंकि
  rationale: प्रसंग में यह पिछले कथन का कारण प्रस्तुत करता है; हिन्दी में ‘क्योंकि’ स्वाभाविक और पर्याप्त है।
- source_word: בִּדְבַר יְהוָה
  choice: यहोवा ने अपने वचन के द्वारा
  rationale: साधनसूचक בְּ और दिव्य नाम दोनों को स्पष्ट रखते हुए हिन्दी में स्वाभाविक वाक्य-विन्यास अपनाया गया है।
- source_word: לֹא תֹאכַל לֶחֶם
  choice: न तो रोटी खाना
  rationale: इब्रानी निषेध को प्रत्यक्ष उद्धरण में स्वाभाविक हिन्दी आज्ञार्थक रूप दिया गया है; ‘रोटी’ לֶחֶם का सामान्य संदर्भानुकूल अर्थ है।
- source_word: בַּדֶּרֶךְ אֲשֶׁר הָלָכְתָּ
  choice: उस मार्ग से ... जिससे तुम गए थे
  rationale: הלך का मूल अर्थ ‘जाना/चलना’ सुरक्षित रखा गया है; इसे अनावश्यक रूप से ‘आना’ नहीं बनाया गया।
theological_decisions:
- issue: दिव्य नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: प्रभु
  rationale: व्यक्तिगत दिव्य नाम को पदवी में बदलने के बजाय हिन्दी बाइबलीय प्रयोग में प्रचलित लिप्यंतरण रखा गया है।
- issue: आज्ञा देने वाले कर्ता और ‘यहोवा के वचन’ का संबंध
  choice: यहोवा ने अपने वचन के द्वारा मुझे यह आज्ञा दी है
  alternative: यहोवा के वचन के द्वारा उसने मुझे आज्ञा दी
  rationale: इब्रानी में निहित कर्ता को यहोवा से जोड़ना प्रसंगानुकूल है और हिन्दी में अस्पष्ट सर्वनाम से बचाता है, जबकि ‘वचन के द्वारा’ का साधनभाव बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। प्रत्यक्ष आज्ञा में स्वाभाविक हिन्दी infinitive-आज्ञार्थक शैली प्रयुक्त है।
