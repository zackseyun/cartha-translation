  text: So he went by another way and did not return by the way he had come to Bethel.
translation:
  language: hi
  text: तब वह दूसरे मार्ग से चला गया और जिस मार्ग से वह बेतेल आया था, उससे वापस नहीं लौटा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: इसलिए वह ... चला गया
  rationale: वाव-क्रमागत कथा को आगे बढ़ाता है; पिछले आदेश के परिणाम को व्यक्त करने के लिए ‘इसलिए’ और यात्रा के संदर्भ में ‘चला गया’ स्वाभाविक हैं।
- source_word: בְּדֶרֶךְ אַחֵר
  choice: दूसरे मार्ग से
  rationale: דֶּרֶךְ का अर्थ मार्ग, सड़क या रास्ता हो सकता है। ‘दूसरे मार्ग से’ मूल आगमन-मार्ग के साथ स्पष्ट विरोध बनाए रखता है।
- source_word: וְלֹא שָׁב
  choice: और ... वापस नहीं लौटा
  rationale: שׁוּב यहाँ लौटने या वापस जाने के अर्थ में है; यह चयन यात्रा-संदर्भ को स्पष्ट और संक्षिप्त रखता है।
- source_word: בַּדֶּרֶךְ אֲשֶׁר בָּא בָהּ
  choice: जिस मार्ग से वह ... आया था
  rationale: संबंधवाचक उपवाक्य उसके पहले आने के मार्ग को निर्दिष्ट करता है; ‘आया था’ उस क्रिया की पूर्वता को स्वाभाविक हिंदी में दिखाता है।
- source_word: אֶל בֵּית אֵל
  choice: बेतेल
  rationale: בֵּית אֵל स्थान का नाम है। हिंदी बाइबलीय प्रयोग के अनुरूप इसका लिप्यंतरण ‘बेतेल’ किया गया है; ‘जिस मार्ग से’ के साथ गंतव्य का संबंध स्वाभाविक रूप से व्यक्त होता है।
