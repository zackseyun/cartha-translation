base_translation:
  language: en
  yaml_path: translation/ot/1_kings/013/021.yaml
  text: 'And he cried out to the man of God who had come from Judah[a], saying, “Thus says Yahweh: Because you have rebelled against the word of Yahweh and have not kept the command that Yahweh your God commanded you,”'
translation:
  language: hi
  text: 'और उसने यहूदा से आए परमेश्वर के जन को पुकारकर कहा, “याहवे यों कहता है: क्योंकि तूने याहवे की बात[a] के विरुद्ध विद्रोह किया और उस आज्ञा का पालन नहीं किया जो तेरे परमेश्वर याहवे ने तुझे दी थी,”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक अर्थ, “याहवे के मुँह के विरुद्ध”; यह याहवे के कहे हुए वचन का विरोध करने के लिए प्रयुक्त इब्रानी मुहावरा है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: उसने…पुकारकर कहा
  rationale: קרא का अर्थ पुकारना या घोषणा करना हो सकता है। भविष्यद्वाणी की इस कठोर घोषणा में ‘पुकारकर कहा’ कथन की तीव्रता को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: אִישׁ הָאֱלֹהִים
  choice: परमेश्वर का जन
  rationale: यह इब्रानी का स्थापित पदनाम है; ‘नबी’ कहना सम्भव अर्थ को अधिक स्पष्ट कर देता, पर मूल पदनाम को बदल देता।
- source_word: מִיהוּדָה
  choice: यहूदा से आए
  rationale: भौगोलिक उद्गम के साथ אֲשֶׁר בָּא को भी सहज हिन्दी में व्यक्त करता है।
- source_word: כֹּה אָמַר יְהוָה
  choice: याहवे यों कहता है
  rationale: यह भविष्यद्वक्ताओं का प्रचलित संदेशवाहक सूत्र है और हिन्दी में औपचारिक तथा स्पष्ट है।
- source_word: יַעַן כִּי
  choice: क्योंकि
  rationale: यह आगे आने वाले न्याय का कारण प्रस्तुत करता है।
- source_word: מָרִיתָ
  choice: तूने…विद्रोह किया
  rationale: מרה साधारण अवज्ञा से अधिक प्रबल है और जानबूझकर विरोध या विद्रोह का भाव रखता है।
- source_word: פִּי יְהוָה
  choice: याहवे की बात
  rationale: शाब्दिक अर्थ ‘याहवे का मुँह’ है, पर यह याहवे के बोले हुए वचन या निर्देश के लिए इब्रानी मुहावरा है। ‘बात’ मुहावरे का अर्थ स्वाभाविक हिन्दी में रखती है।
- source_word: וְלֹא שָׁמַרְתָּ אֶת הַמִּצְוָה
  choice: उस आज्ञा का पालन नहीं किया
  rationale: आज्ञा के साथ שׁמר का आशय उसे मानना या उसका पालन करना है; यह आधुनिक हिन्दी में ‘आज्ञा को रखा’ से अधिक स्वाभाविक है।
- source_word: צִוְּךָ
  choice: तुझे दी थी
  rationale: हिन्दी में ‘आज्ञा दी’ צוה का सीधा और स्वाभाविक रूप है; इससे उसी वाक्य में ‘आज्ञा’ की अनावश्यक पुनरावृत्ति भी नहीं होती।
- source_word: יְהוָה אֱלֹהֶיךָ
  choice: तेरे परमेश्वर याहवे
  rationale: मूल के व्यक्तिगत सम्बोधन और वाचा-संबंधी अभिव्यक्ति को सुरक्षित रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: प्रभु / यहोवा
  rationale: मूल पाठ में व्यक्तिवाचक वाचा-नाम है; ‘याहवे’ उसे किसी उपाधि से बदले बिना लिप्यंतरित करता है।
- issue: מָרִיתָ की नैतिक तीव्रता
  choice: विद्रोह किया
  alternative: अवज्ञा की
  rationale: मूल क्रिया केवल आज्ञा न मानने के बजाय ईश्वरीय वचन के विरुद्ध विद्रोही प्रतिरोध का प्रबल भाव रखती है।
- issue: פִּי יְהוָה का मुहावरेदार अर्थ
  choice: याहवे की बात
  alternative: याहवे का मुँह / याहवे की आज्ञा
  rationale: ‘मुँह’ शाब्दिक पर हिन्दी में भ्रामक है, जबकि ‘आज्ञा’ अगले खंड के הַמִּצְוָה के साथ भेद घटा देती है। ‘बात’ बोले हुए ईश्वरीय निर्देश का अर्थ और दोनों खंडों का तनाव बनाए रखती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और कथात्मक है। एक व्यक्ति को सीधे सम्बोधित करने के कारण मूल के एकवचन रूप के अनुरूप ‘तू/तेरे/तुझे’ रखा गया है। पद अगले पद में जारी रहने वाली न्याय-घोषणा का कारण-वाक्य है, इसलिए अन्त में अल्पविराम बनाए रखा गया है।
