  text: וַ/יִּשָּׂ֨א הַ/נָּבִ֜יא אֶת נִבְלַ֧ת אִישׁ הָ/אֱלֹהִ֛ים וַ/יַּנִּחֵ֥/הוּ אֶֽל הַ/חֲמ֖וֹר וַ/יְשִׁיבֵ֑/הוּ וַ/יָּבֹ֗א אֶל עִיר֙ הַ/נָּבִ֣יא הַ/זָּקֵ֔ן לִ/סְפֹּ֖ד וּ/לְ/קָבְרֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/013/029.yaml
  text: Then the prophet lifted up the corpse of the man of God and laid it on the donkey and brought it back[a]. And he came to the city of the old prophet to mourn and to bury him.
translation:
  language: hi
  text: तब उस नबी ने परमेश्वर के जन का शव उठाकर गधे पर रखा और उसे वापस ले आया। फिर वह विलाप करने और उसे दफ़नाने के लिए वृद्ध नबी के नगर में आया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשָּׂא
  choice: उठाकर
  rationale: נשא यहाँ शव को उठाने की ठोस क्रिया व्यक्त करता है; आगे उसे गधे पर रखने और वापस लाने का वर्णन है।
- source_word: נִבְלַת אִישׁ הָאֱלֹהִים
  choice: परमेश्वर के जन का शव
  rationale: נבלה मृत देह को स्पष्ट रूप से दर्शाता है, इसलिए आधुनिक हिन्दी में ‘शव’ सटीक है; אִישׁ הָאֱלֹהִים का प्रतिष्ठित बाइबलीय पदनाम ‘परमेश्वर का जन’ रखा गया है।
- source_word: וַיַּנִּחֵהוּ אֶל הַחֲמוֹר
  choice: गधे पर रखा
  rationale: נוח का हिफ़ील रूप यहाँ किसी वस्तु को रख देने का अर्थ देता है; ‘गधे पर रखा’ सहज और सटीक हिन्दी है।
- source_word: וַיְשִׁיבֵהוּ
  choice: उसे वापस ले आया
  rationale: שוב का हिफ़ील ‘वापस लाना’ दर्शाता है। सर्वनाम को जानबूझकर खुला रखा गया है, क्योंकि वह शव/मृत जन दोनों की ओर स्वाभाविक रूप से संकेत कर सकता है।
- source_word: וַיָּבֹא אֶל עִיר הַנָּבִיא הַזָּקֵן
  choice: बूढ़े नबी के नगर में आया
  rationale: इब्रानी रचना का स्वाभाविक अर्थ उस नगर से है जहाँ बूढ़ा नबी रहता था; זקן यहाँ पदवी नहीं, आयु-सूचक विशेषण है।
- source_word: לִסְפֹּד
  choice: विलाप करने
  rationale: ספד मृत्यु के अवसर पर शोकपूर्ण विलाप को दर्शा सकता है; ‘विलाप’ सामान्य ‘शोक’ की अपेक्षा अंत्येष्टि-संदर्भ की विशिष्टता बेहतर रखता है।
- source_word: וּלְקָבְרוֹ
  choice: और उसे दफ़नाने
  rationale: קבר का सीधा अर्थ दफ़नाना है और प्रत्यय मृत परमेश्वर के जन की ओर संकेत करता है।
theological_decisions: []
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘बूढ़ा नबी’ आयु का भेद स्पष्ट करता है, जबकि ‘परमेश्वर का जन’ पारंपरिक बाइबलीय पदनाम को बनाए रखता है।
