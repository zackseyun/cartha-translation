base_translation:
  language: en
  yaml_path: translation/ot/1_kings/013/031.yaml
  text: And it happened, after he had buried him, that he said to his sons, “When I die, bury me in the tomb where the man of God is buried; lay my bones beside his bones.”
translation:
  language: hi
  text: और ऐसा हुआ कि उसे दफनाने के बाद उसने अपने बेटों से कहा, “जब मैं मर जाऊँ, तो मुझे उस कब्र में दफनाना, जिसमें परमेश्वर का जन दफन है। मेरी हड्डियाँ उसकी हड्डियों के पास रख देना।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: और ऐसा हुआ
  rationale: इब्रानी कथात्मक प्रवाह को बनाए रखते हुए आधुनिक और स्वाभाविक हिन्दी प्रयोग।
- source_word: אַחֲרֵי קָבְרוֹ אֹתוֹ
  choice: उसे दफनाने के बाद
  rationale: इस रचना का कालगत संबंध स्पष्ट और संक्षिप्त हिन्दी में व्यक्त होता है।
- source_word: בָּנָיו
  choice: अपने बेटों
  rationale: मूल पाठ में पुत्रों का स्पष्ट उल्लेख है, इसलिए इसे सामान्यीकृत करके ‘बच्चों’ नहीं किया गया।
- source_word: בְּמוֹתִי
  choice: जब मैं मर जाऊँ
  rationale: भावी मृत्यु को सूचित करने वाली कालगत अभिव्यक्ति का सहज आधुनिक हिन्दी रूप।
- source_word: וּקְבַרְתֶּם אֹתִי
  choice: मुझे ... दफनाना
  rationale: संदर्भ में यह बेटों को दिया गया निर्देश है; हिन्दी का आज्ञार्थक रूप उसका बल स्वाभाविक ढंग से रखता है।
- source_word: בַּקֶּבֶר
  choice: उसी कब्र में
  rationale: यह किसी सामान्य कब्र नहीं, पहले उल्लिखित विशिष्ट दफन-स्थान की ओर संकेत करता है; ‘उसी’ उस निश्चितता को स्पष्ट करता है।
- source_word: אִישׁ הָאֱלֹהִים
  choice: परमेश्वर का जन
  rationale: इब्रानी पदवी का सीधा और प्रचलित बाइबलीय हिन्दी रूप; इसे व्याख्यात्मक रूप से ‘भविष्यद्वक्ता’ नहीं बनाया गया।
- source_word: קָבוּר בּוֹ
  choice: दफनाया गया है
  rationale: निष्क्रिय स्थिति को स्पष्ट रखते हुए उस कब्र में हुए दफन की पूर्ण क्रिया भी व्यक्त होती है।
- source_word: אֵצֶל
  choice: के पास
  rationale: स्थानिक निकटता का सहज हिन्दी रूप।
- source_word: עַצְמֹתָיו ... עַצְמֹתָי
  choice: उसकी हड्डियाँ ... मेरी हड्डियाँ
  rationale: मूल के ठोस शब्द ‘हड्डियाँ’ को सुरक्षित रखा गया है, क्योंकि आगे की कथा में इसका महत्व है।
- source_word: הַנִּיחוּ
  choice: रख देना
  rationale: बहुवचन आज्ञा का स्वाभाविक हिन्दी रूप, जो निर्देश की गंभीरता और स्पष्टता बनाए रखता है।
