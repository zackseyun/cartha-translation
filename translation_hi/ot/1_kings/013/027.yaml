  text: Then he spoke to his sons[a], saying, “Saddle the donkey for me.” So they saddled it.
translation:
  language: hi
  text: तब उसने अपने बेटों से कहा, “मेरे लिए गधे पर काठी कस दो।” तब उन्होंने उस पर काठी कस दी।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: तब उसने ... कहा
  rationale: वाव-क्रमिक कथा को आगे बढ़ाता है; हिन्दी में प्रत्यक्ष कथन के परिचय के लिए ‘कहा’ स्वाभाविक है, जबकि דבר के बोलने के भाव को भी ठीक से व्यक्त करता है।
- source_word: אֶל־בָּנָיו
  choice: अपने बेटों से
  rationale: בָּנִים पुल्लिंग बहुवचन है और यहाँ उसके पुत्रों का उल्लेख करता है; सम्बन्धसूचक प्रत्यय को ‘अपने’ से व्यक्त किया गया है।
- source_word: לֵאמֹר
  choice: कहा
  rationale: हिब्रू का यह कथन-परिचायक हिन्दी में अलग से ‘यह कहते हुए’ कहने के बजाय प्रत्यक्ष वचन से पहले ‘कहा’ में स्वाभाविक रूप से समाहित होता है।
- source_word: חִבְשׁוּ לִי אֶת־הַחֲמוֹר
  choice: मेरे लिए गधे पर काठी कस दो
  rationale: गधे के साथ חבשׁ का अर्थ काठी लगाना या कसना है। ‘मेरे लिए’ לִי के लाभार्थक भाव को बनाए रखता है।
- source_word: וַיַּחֲבֹשׁוּ
  choice: तब उन्होंने उस पर काठी कस दी
  rationale: क्रिया की पुनरावृत्ति को ‘काठी कस दी’ से बनाए रखा गया है। हिब्रू में कर्म व्यक्त नहीं है, पर निकटतम स्पष्ट पूर्वपद गधा है; हिन्दी में ‘उस पर’ स्वाभाविक और स्पष्ट है।
theological_decisions: []
