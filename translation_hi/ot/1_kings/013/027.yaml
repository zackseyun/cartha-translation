  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘काठी कसना’ सामान्य हिन्दी में पशु को सवारी के लिए तैयार करने का स्वाभाविक मुहावरा है। किसी पाठगत या धर्मवैज्ञानिक अस्पष्टता के अभाव में फुटनोट नहीं जोड़ा गया।
