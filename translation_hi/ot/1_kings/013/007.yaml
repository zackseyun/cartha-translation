base_translation:
  language: en
  yaml_path: translation/ot/1_kings/013/007.yaml
  text: Then the king said to the man of God[a], “Come home with me and eat, and I will give you a gift.”
translation:
  language: hi
  text: तब राजा ने परमेश्वर के जन से कहा, “मेरे साथ घर चलकर भोजन कीजिए, और मैं आपको एक भेंट दूँगा।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: तब ... कहा
  rationale: वाव-क्रमिक कथा को आगे बढ़ाता है; आधुनिक हिन्दी में ‘तब ... कहा’ उसका स्वाभाविक कथात्मक भाव व्यक्त करता है।
- source_word: הַמֶּלֶךְ
  choice: राजा
  rationale: निश्चित संज्ञा का सीधा और प्रसंगानुकूल अनुवाद।
- source_word: אִישׁ הָאֱלֹהִים
  choice: परमेश्वर का जन
  rationale: इब्रानी की प्रचलित पदवी को बनाए रखता है और इसे व्याख्यात्मक रूप से केवल ‘भविष्यद्वक्ता’ नहीं बनाता।
- source_word: בֹּאָה אִתִּי הַבַּיְתָה
  choice: मेरे साथ घर चलकर
  rationale: दिशासूचक रूप ‘घर की ओर/घर’ बताता है; निमंत्रण के प्रसंग में यह स्वाभाविक हिन्दी है।
- source_word: וּסְעָדָה
  choice: भोजन कीजिए
  rationale: क्रिया का अर्थ अपने को संभालना या बल पाना है, प्रायः भोजन द्वारा; इस प्रसंग में ‘भोजन कीजिए’ आशय को स्पष्ट और सहज रूप से व्यक्त करता है।
- source_word: וְאֶתְּנָה לְךָ
  choice: और मैं आपको ... दूँगा
  rationale: राजा के प्रस्ताव में प्रथम पुरुष का संकल्प/भविष्य भाव स्वाभाविक रूप से व्यक्त होता है।
- source_word: מַתָּת
  choice: एक भेंट
  rationale: ‘भेंट’ तटस्थ रूप से उपहार का अर्थ देता है; ‘इनाम’ प्रतिफल का ऐसा भाव जोड़ सकता है जो मूल में स्पष्ट नहीं है।
