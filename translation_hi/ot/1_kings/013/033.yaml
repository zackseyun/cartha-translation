  text: אַחַר֙ הַ/דָּבָ֣ר הַ/זֶּ֔ה לֹֽא שָׁ֥ב יָרָבְעָ֖ם מִ/דַּרְכּ֣/וֹ הָ/רָעָ֑ה וַ֠/יָּשָׁב וַ/יַּ֜עַשׂ מִ/קְצ֤וֹת הָ/עָם֙ כֹּהֲנֵ֣י בָמ֔וֹת הֶֽ/חָפֵץ֙ יְמַלֵּ֣א אֶת יָד֔/וֹ וִ/יהִ֖י כֹּהֲנֵ֥י בָמֽוֹת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/013/033.yaml
  text: After this event[a], Jeroboam did not turn from his evil way, but again made priests of high places from among all the people. Whoever desired it, he ordained him, and he became one of the priests of the high places.
translation:
  language: hi
  text: इस घटना के बाद यारोबाम अपनी बुरी राह से नहीं फिरा, बल्कि उसने फिर से प्रजा में से ऊँचे स्थानों के पुरोहित नियुक्त किए। जो कोई चाहता, उसे वह नियुक्त[a] करता, और वह ऊँचे स्थानों के पुरोहितों में से एक हो जाता।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “उसका हाथ भर देता”—यह किसी को पुरोहितीय सेवा में नियुक्त या प्रतिष्ठित करने का इब्रानी मुहावरा है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אַחַר הַדָּבָר הַזֶּה
  choice: इस घटना के बाद भी
  rationale: דָּבָר का अर्थ ‘बात/मामला/घटना’ हो सकता है। यहाँ यह पिछले वृत्तांत की घटना को सूचित करता है; ‘भी’ अगले निषेध के साथ यारोबाम की हठधर्मिता स्वाभाविक रूप से व्यक्त करता है।
- source_word: לֹא שָׁב ... מִדַּרְכּוֹ הָרָעָה
  choice: अपनी बुरी राह से नहीं फिरा
  rationale: यह शׁוּב के मूल ‘फिरना/लौटना’ और דרך के ‘राह’ रूपक को सुरक्षित रखता है तथा ‘पश्चाताप’ जैसा अधिक व्याख्यात्मक धार्मिक शब्द नहीं जोड़ता।
- source_word: וַיָּשָׁב וַיַּעַשׂ
  choice: बल्कि उसने फिर से ... बनाया
  rationale: दूसरा שׁוּב यहाँ अगले कार्य को दोहराने या पुनः आरम्भ करने का भाव देता है; ‘फिर से’ आधुनिक हिन्दी में स्वाभाविक है।
- source_word: מִקְצוֹת הָעָם
  choice: प्रजा के हर वर्ग में से लोगों को
  rationale: शाब्दिक ‘प्रजा के छोरों में से’ हिन्दी में अस्पष्ट होगा। यह कठिन पद व्यापक प्रजा में से बिना उचित वंशगत सीमा के चुनाव का भाव देता है; ‘हर वर्ग में से’ उस व्यापकता को व्यक्त करता है, बिना ‘निम्न वर्ग’ का विवादित अर्थ थोपे।
- source_word: כֹּהֲנֵי בָמוֹת
  choice: ऊँचे स्थानों के पुरोहित
  rationale: במות पूजा के लिए बने स्थानीय ऊँचे स्थानों को दर्शाता है। ‘पुरोहित’ राजाओं के धार्मिक-सांस्कृतिक संदर्भ में स्वाभाविक हिन्दी है।
- source_word: הֶחָפֵץ
  choice: जो कोई चाहता
  rationale: संज्ञीकृत एकवचन कृदंत सार्वत्रिक अर्थ रखता है—‘जो कोई इच्छा करता’; इससे नियुक्ति की खुली और अनियंत्रित प्रकृति बनी रहती है।
- source_word: יְמַלֵּא אֶת יָדוֹ
  choice: उसका वह अभिषेक कर देता
  rationale: ‘हाथ भरना’ पुरोहित-पद पर प्रतिष्ठित करने का इब्रानी मुहावरा है। ‘अभिषेक करना’ हिन्दी बाइबलीय भाषा में दीक्षा/प्रतिष्ठापन को सुबोध रूप से व्यक्त करता है; शाब्दिक मुहावरा पादटिप्पणी में रखा गया है।
- source_word: וִיהִי כֹּהֲנֵי בָמוֹת
  choice: वह ऊँचे स्थानों के पुरोहितों में से एक हो जाता
  rationale: एकवचन क्रिया के बाद बहुवचन पद वर्ग में प्रवेश सूचित करता है; हिन्दी में ‘में से एक’ इस अर्थ को स्पष्ट और स्वाभाविक बनाता है।
theological_decisions:
- issue: שׁוּב को धार्मिक अर्थ में ‘पश्चाताप करना’ कहना या मूल रूपक बनाए रखना
  choice: अपनी बुरी राह से नहीं फिरा
  alternative: अपनी बुरी राह से पश्चाताप नहीं किया
  rationale: पद नैतिक परिवर्तन की बात करता है, पर मूल क्रिया ‘फिरना/लौटना’ है। ठोस राह-रूपक को रखने से पाठ से अधिक विकसित पारिभाषिक धर्मशास्त्रीय अर्थ नहीं जोड़ा जाता।
- issue: יְמַלֵּא אֶת יָדוֹ पुरोहितीय प्रतिष्ठापन-मुहावरे का अनुवाद
  choice: उसका वह अभिषेक कर देता
  alternative: उसका हाथ भर देता / उसे नियुक्त कर देता / उसे प्रतिष्ठित कर देता
  rationale: संदर्भ में यह किसी को पुरोहितीय सेवा में स्थापित करने का मुहावरा है। ‘अभिषेक’ पाठक के लिए संक्षिप्त और धार्मिक संदर्भानुकूल है, जबकि शाब्दिक रूप पादटिप्पणी में देकर स्रोत-पारदर्शिता रखी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सुबोध शैली रखी गई है। ‘राह’, ‘प्रजा’, ‘पुरोहित’ और ‘ऊँचे स्थान’ जैसे परिचित बाइबलीय पद स्रोत के रूपकों और ऐतिहासिक संदर्भ को बनाए रखते हैं।
