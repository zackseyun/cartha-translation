  text: तब वह उसके साथ लौट गया और उसके घर में रोटी खाई और पानी पिया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: लौट गया
  rationale: שׁוב के कथात्मक रूप का स्वाभाविक हिन्दी अनुवाद; यह पहले लिए गए मार्ग से वापस जाने की पूर्ण हुई क्रिया व्यक्त करता है।
- source_word: אִתּוֹ
  choice: उसके साथ
  rationale: साथ होने का सीधा और स्वाभाविक अनुवाद।
- source_word: וַיֹּאכַל לֶחֶם
  choice: रोटी खाई
  rationale: मूलतः ‘रोटी खाई’। यद्यपि यह भोजन करने का मुहावरा हो सकता है, यहाँ ‘रोटी’ बनाए रखना उचित है क्योंकि आसपास के वृत्तांत में रोटी और पानी विषयगत रूप से महत्त्वपूर्ण हैं।
- source_word: בְּבֵיתוֹ
  choice: उसके घर में
  rationale: इब्रानी का सीधा अनुवाद; प्रसंग में सर्वनाम वृद्ध भविष्यद्वक्ता के घर की ओर संकेत करता है।
- source_word: וַיֵּשְׁתְּ מָיִם
  choice: पानी पिया
  rationale: क्रियापद का सीधा और सहज अनुवाद; निषिद्ध कार्य की पुनरावृत्ति दिखाने के लिए ‘पानी’ स्पष्ट रखा गया है।
