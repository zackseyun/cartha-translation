  text: He went and found his corpse thrown on the road[a], with the donkey and the lion standing beside the corpse. The lion had not eaten the corpse[b], nor had it torn apart the donkey.
translation:
  language: hi
  text: वह गया और उसने उसकी लाश[a] रास्ते पर फेंकी हुई पाई। गधा और शेर लाश के पास खड़े थे। शेर ने न तो लाश को खाया था और न ही गधे को चीर-फाड़ की थी[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “शव” अथवा “मृत देह।” इब्रानी נְבֵלָה मृत देह के लिए एक कठोर शब्द है, जो मृत्यु की वास्तविकता पर जोर देता है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में शाब्दिक रूप से “गधे को तोड़ा था”; संदर्भ में आशय है कि शेर ने गधे को चीर-फाड़ नहीं की थी।
    reason: lexical_alternative
lexical_decisions:
- source_word: נִבְלָתוֹ / הַנְּבֵלָה
  choice: लाश
  rationale: נְבֵלָה मृत देह को दर्शाता है और यहाँ मानवीय मृत शरीर के लिए प्रयुक्त हुआ है। आधुनिक हिंदी में ‘लाश’ स्वाभाविक है तथा इब्रानी शब्द की कठोर, मृत्यु-केंद्रित अभिव्यक्ति को बनाए रखता है।
- source_word: מֻשְׁלֶכֶת
  choice: फेंकी हुई
  rationale: שלך के निष्क्रिय कृदंत में डाल दिए या फेंक दिए जाने का भाव है। ‘फेंकी हुई’ केवल ‘पड़ी हुई’ की अपेक्षा मूल की शक्ति को अधिक स्पष्ट रखता है।
- source_word: בַּדֶּרֶךְ
  choice: रास्ते पर
  rationale: यहाँ דֶּרֶךְ उस मार्ग या सड़क को सूचित करता है जहाँ लाश पड़ी थी; ‘रास्ते पर’ आधुनिक हिंदी में स्वाभाविक है।
- source_word: עֹמְדִים אֵצֶל
  choice: पास खड़े थे
  rationale: कृदंत और אֵצֶל मिलकर लाश के निकट स्थिर खड़े होने का दृश्य प्रस्तुत करते हैं।
- source_word: לֹא אָכַל
  choice: न तो ... खाया था
  rationale: אָכַל सामान्य क्रिया ‘खाना’ है। पूर्ण भूतकाल उस स्थिति को व्यक्त करता है जो वहाँ पहुँचने पर दिखाई दी।
- source_word: שָׁבַר אֶת הַחֲמוֹר
  choice: गधे को फाड़ा था
  rationale: שׁבר का मूल अर्थ ‘तोड़ना’ है, पर इस संदर्भ में हिंसक पशु द्वारा गधे को तोड़ डालने या चीर-फाड़ देने का भाव है। ‘फाड़ा’ हिंदी में प्रसंगानुकूल और सहज है।
- source_word: וַיֵּלֶךְ וַיִּמְצָא
  choice: वह गया और उसने ... पाई
  rationale: दोनों क्रमिक कथात्मक क्रियाओं का सीधा प्रवाह बनाए रखा गया है।
- source_word: הָאַרְיֵה
  choice: शेर
  rationale: אַרְיֵה के लिए ‘शेर’ आधुनिक मानक हिंदी में सर्वसाधारण और स्वाभाविक शब्द है।
