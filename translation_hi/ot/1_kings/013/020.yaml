reference: 1 Kings 13:20
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יְהִ֕י הֵ֥ם יֹשְׁבִ֖ים אֶל הַ/שֻּׁלְחָ֑ן וַֽ/יְהִי֙ דְּבַר יְהוָ֔ה אֶל הַ/נָּבִ֖יא אֲשֶׁ֥ר הֱשִׁיבֽ/וֹ־פ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/013/020.yaml
  text: And it happened, as they were sitting at the table, that the word of Yahweh came to the prophet who had brought him back.
translation:
  language: hi
  text: जब वे मेज़ पर बैठे हुए थे, तब ऐसा हुआ कि यहोवा का वचन उस नबी के पास आया, जो उसे लौटा लाया था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: तब ऐसा हुआ
  rationale: यह कथात्मक क्रम में एक नई घटना का परिचय देता है; यह अनुवाद हिब्रू की कथाशैली को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: הֵם יֹשְׁבִים
  choice: जब वे ... बैठे हुए थे
  rationale: सर्वनाम और कृदंत जारी अवस्था को व्यक्त करते हैं; ‘बैठे हुए थे’ उस कालगत विस्तार को बनाए रखता है।
- source_word: אֶל הַשֻּׁלְחָן
  choice: मेज़ पर
  rationale: יֹשְׁבִים के साथ यह भोजन के लिए मेज़ पर बैठे होने का मुहावरा है; हिन्दी में ‘मेज़ पर’ स्वाभाविक है।
- source_word: דְּבַר יְהוָה
  choice: यहोवा का वचन
  rationale: यह मानक भविष्यद्वाणी-सूत्र है और संबंधवाचक हिब्रू पदबंध को स्पष्टतः व्यक्त करता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: व्यक्तिगत वाचा-नाम को हिन्दी में प्रचलित प्रतिलेखन ‘यहोवा’ से प्रस्तुत किया गया है, न कि उपाधि से बदला गया है।
- source_word: אֶל הַנָּבִיא
  choice: उस नबी के पास
  rationale: यहाँ אֶל प्रकाशन पाने वाले व्यक्ति को सूचित करता है; ‘के पास आया’ हिन्दी में ‘वचन आया’ के साथ स्वाभाविक है।
- source_word: אֲשֶׁר הֱשִׁיבוֹ
  choice: जो उसे लौटा लाया था
  rationale: 'שׁוב का हिफ़ील रूप और तृतीय पुरुष एकवचन प्रत्यय कारणवाचक अर्थ देते हैं: उस नबी ने उसे वापस आने के लिए प्रेरित किया अथवा वापस लाया। ‘लौटा लाया था’ कथानक-संदर्भ और पूर्वकालिकता दोनों व्यक्त करता है।'
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ में चार-अक्षरी व्यक्तिगत नाम सीधे प्रयुक्त हुआ है। हिन्दी बाइबलीय प्रयोग में सुविज्ञ और पठनीय रूप ‘यहोवा’ चुना गया है; इसे ‘प्रभु’ जैसी उपाधि से नहीं बदला गया।
- issue: वचन पाने वाले ‘नबी’ की पहचान
  choice: जो उसे लौटा लाया था—यह विशेषण उसी नबी की पहचान करता है
  alternative: वचन परमेश्वर के जन के पास आया
  rationale: हिब्रू व्याकरण में אֶל הַנָּבִיא אֲשֶׁר הֱשִׁיבוֹ स्पष्ट रूप से उस नबी को प्राप्तकर्ता बताता है जिसने परमेश्वर के जन को लौटाया था। कथानक का तनाव बिना व्याख्यात्मक समाधान के सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी, सहज किंतु गरिमापूर्ण कथात्मक शैली। ‘मेज़’, ‘नबी’ और ‘वचन’ सामान्य हिन्दी बाइबलीय शब्दावली के अनुरूप हैं। वाक्य-विन्यास ने जारी पृष्ठभूमि (‘बैठे हुए थे’) और उसके बीच घटी मुख्य घटना (‘तब ऐसा हुआ’) का भेद बनाए रखा है।
