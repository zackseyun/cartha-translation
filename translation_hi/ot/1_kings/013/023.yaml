  text: וַ/יְהִ֗י אַחֲרֵ֛י אָכְל֥/וֹ לֶ֖חֶם וְ/אַחֲרֵ֣י שְׁתוֹת֑/וֹ וַ/יַּחֲבָשׁ ל֣/וֹ הַ/חֲמ֔וֹר לַ/נָּבִ֖יא אֲשֶׁ֥ר הֱשִׁיבֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/013/023.yaml
  text: And it happened[a], after he had eaten bread and after he had drunk, that he saddled the donkey for him, for the prophet whom he had brought back.
translation:
  language: hi
  text: ऐसा हुआ कि उसके रोटी खाने और पीने के बाद, उसने उस नबी के लिए गधे पर काठी कसी, जिसे वह लौटा लाया था[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जिसे उसने वापस लौटाया था।”
    reason: हिब्रू के प्रेरक क्रियारूप का शाब्दिक विकल्प, जिसका अर्थ किसी को लौटाना अथवा लौटने का कारण बनना हो सकता है।
lexical_decisions:
- source_word: וַיְהִי
  choice: ऐसा हुआ कि
  rationale: यह कथात्मक क्रम में अगली घटना का परिचय देता है; यह अभिव्यक्ति हिब्रू के वृत्तांत-सूचक रूप को स्वाभाविक आधुनिक हिन्दी में बनाए रखती है।
- source_word: אַחֲרֵי אָכְלוֹ לֶחֶם
  choice: जब वह रोटी खा चुका
  rationale: कालवाचक रचना और पूर्ण हो चुकी क्रिया को व्यक्त किया गया है। לֶחֶם को हटाया नहीं गया, यद्यपि यहाँ रोटी खाना भोजन करने का सामान्य मुहावरा भी हो सकता है।
- source_word: וְאַחֲרֵי שְׁתוֹתוֹ
  choice: और पी चुका
  rationale: मूल में पीने की वस्तु नहीं बताई गई है, इसलिए पानी या दाखमधु जैसा कोई कर्म नहीं जोड़ा गया।
- source_word: וַיַּחֲבָשׁ
  choice: गधे पर काठी बाँधी
  rationale: חבש पशु के संदर्भ में उस पर काठी कसने या बाँधने को सूचित करता है; यह हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: לוֹ
  choice: उस नबी के लिए
  rationale: ל प्रयोक्ता अथवा लाभार्थी को दर्शाता है; हिन्दी वाक्य में इसे संबंधित संज्ञा के साथ रखकर सर्वनाम-संदर्भ स्पष्ट किया गया है।
- source_word: הַחֲמוֹר
  choice: गधे
  rationale: यह חמור का सामान्य आधुनिक हिन्दी पर्याय है।
- source_word: לַנָּבִיא
  choice: उस नबी के लिए
  rationale: मूल पाठ यहाँ स्पष्ट रूप से ‘नबी’ कहता है, ‘परमेश्वर का जन’ नहीं।
- source_word: אֲשֶׁר הֱשִׁיבוֹ
  choice: जिसे वह लौटा लाया था
  rationale: שוב का हिफ़ील रूप किसी को लौटाने या वापस लाने का अर्थ देता है। ‘लौटा लाया’ प्रसंग में स्वाभाविक है और प्रेरक भाव को पर्याप्त रूप से व्यक्त करता है।
