translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। मूल के दो समानांतर कालवाचक खंड सुरक्षित हैं और पीने की वस्तु नहीं जोड़ी गई है।
