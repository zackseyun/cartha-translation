source:
  edition: WLC
  text: וְ/הִנֵּ֣ה אִ֣ישׁ אֱלֹהִ֗ים בָּ֧א מִ/יהוּדָ֛ה בִּ/דְבַ֥ר יְהוָ֖ה אֶל בֵּֽית אֵ֑ל וְ/יָרָבְעָ֛ם עֹמֵ֥ד עַל הַ/מִּזְבֵּ֖חַ לְ/הַקְטִֽיר׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/013/001.yaml
  text: And behold[a], a man of God came from Judah to Bethel by the word of Yahweh[b], while Jeroboam was standing by the altar to burn incense.
translation:
  language: hi
  text: और देखो, परमेश्वर का एक जन यहोवा के वचन के अनुसार[a] यहूदा से बेतेल आया। उस समय यारोबाम धूप जलाने के लिए वेदी के पास खड़ा था[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “यहोवा के वचन से” अथवा “यहोवा के आदेश पर।”
    reason: पूर्वसर्ग בְּ यहाँ साधन, आदेश, या अनुरूपता का संबंध व्यक्त कर सकता है।
  - marker: b
    text: या, “और यारोबाम वेदी पर खड़ा था।” इब्रानी संयोजक का सीधा अर्थ ‘और’ हो सकता है, और עַל का अनुवाद ‘पर’ भी सम्भव है।
    reason: वाव समकालीन परिस्थिति के बजाय साधारण संयोजन के रूप में पढ़ा जा सकता है; עַל के स्थान-संबंध को ‘पर’ भी अनुवादित किया जा सकता है, यद्यपि प्रसंग में ‘वेदी के पास’ स्वाभाविक है।
lexical_decisions:
- source_word: וְהִנֵּה
  choice: और देखो
  rationale: कथानक में ध्यान खींचने और घटना को सजीव रूप से प्रस्तुत करने वाली अभिव्यक्ति; आधुनिक हिन्दी में स्वाभाविक रहते हुए मूल का बल बनाए रखती है।
- source_word: אִישׁ אֱלֹהִים
  choice: परमेश्वर का एक जन
  rationale: मूल की स्थापित उपाधि को सुरक्षित रखता है और व्याख्यात्मक रूप से केवल ‘भविष्यद्वक्ता’ नहीं बनाता।
- source_word: בִּדְבַר יְהוָה
  choice: यहोवा के वचन से
  rationale: בְּ यहाँ वचन के द्वारा मिले आदेश, अधिकार या प्रेरणा का संकेत दे सकता है; ‘से’ इस संबंध को संक्षेप में रखता है, जबकि विकल्प पादटिप्पणी में दिए गए हैं।
- source_word: יְהוָה
  choice: यहोवा
  rationale: इब्रानी विशिष्ट ईश्वरीय नाम को सामान्य उपाधि में बदलने के बजाय हिन्दी में प्रचलित नामरूप से व्यक्त किया गया है।
- source_word: אֶל בֵּית אֵל
  choice: बेतेल आया
  rationale: गंतव्य को हिन्दी में क्रिया के साथ स्वाभाविक रूप से व्यक्त करता है; बेतेल स्थान-नाम का प्रचलित हिन्दी रूप है।
- source_word: וְיָרָבְעָם עֹמֵד
  choice: उस समय यारोबाम ... खड़ा था
  rationale: सहभागी कृदंत से व्यक्त चल रही समकालीन परिस्थिति को स्पष्ट करता है, पर साधारण ‘और’ की सम्भावना पादटिप्पणी में सुरक्षित है।
- source_word: עַל הַמִּזְבֵּחַ
  choice: वेदी के पास
  rationale: इस अनुष्ठानिक प्रसंग में עַל का अर्थ वेदी के ऊपर खड़ा होना नहीं, बल्कि उसके निकट या उस पर सेवा करना है; ‘के पास’ सम्भावित स्थान-संबंध को स्वाभाविक हिन्दी में देता है।
- source_word: לְהַקְטִיר
  choice: धूप जलाने के लिए
  rationale: उपासना-संबंधी प्रसंग में हिफ़ील क्रिया का सामान्य आशय धूप या भेंट को धुएँ में चढ़ाना है; यहाँ ‘धूप जलाना’ संदर्भानुकूल और स्पष्ट है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: पाठ में विशिष्ट वाचा-नाम है। ‘यहोवा’ आधुनिक हिन्दी बाइबलीय प्रयोग में व्यापक रूप से पहचाना जाता है और नाम को सामान्य उपाधि ‘प्रभु’ से अलग रखता है।
- issue: אִישׁ אֱלֹהִים की पहचान
  choice: परमेश्वर का एक जन
  alternative: एक भविष्यद्वक्ता
  rationale: व्यक्ति का कार्य भविष्यद्वक्ताई है, पर मूल पदबंध स्वयं ‘परमेश्वर का जन’ कहता है; अतः पाठ की उपाधि और उसका धर्मवैचारिक तनाव सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। ‘और देखो’ कथात्मक सजीवता बनाए रखता है; वाक्य को हिन्दी की सहज पठनीयता के लिए दो वाक्यों में बाँटा गया है। सभी पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित हैं।
