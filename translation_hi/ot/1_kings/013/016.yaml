base_translation:
  language: en
  yaml_path: translation/ot/1_kings/013/016.yaml
  text: And he said[a], “I cannot return with you or go with you, and I will not eat bread or drink water with you in this place.”
translation:
  language: hi
  text: उसने कहा[a], “मैं तुम्हारे साथ लौट नहीं सकता, न तुम्हारे साथ जा सकता हूँ। मैं इस स्थान पर तुम्हारे साथ न रोटी खाऊँगा, न पानी पीऊँगा।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: पहले दो स्थानों पर इब्रानी में “तुम्हारे साथ” का स्त्रीलिंग रूप है, जबकि खाने-पीने वाले वाक्य में इसका पुल्लिंग रूप है। हिन्दी में “तुम्हारे साथ” इस लिंग-भेद को प्रकट नहीं करता।
    reason: मूल इब्रानी में संबोधन के व्याकरणिक लिंग का असामान्य परिवर्तन है, जिसे मुख्य हिन्दी पाठ में दर्शाना संभव नहीं।
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: उसने कहा
  rationale: इब्रानी कथात्मक क्रम में यह प्रत्यक्ष कथन का सामान्य परिचय है। हिन्दी में ‘उसने कहा’ स्वाभाविक है; आरम्भिक וַ को अलग से ‘और’ कहना आवश्यक नहीं।
- source_word: לֹא אוּכַל
  choice: मैं ... नहीं सकता
  rationale: नकार के साथ יכל का अपूर्ण रूप यहाँ असमर्थता या बाध्यता व्यक्त करता है; आधुनिक हिन्दी में यह सहज अभिव्यक्ति है।
- source_word: לָשׁוּב
  choice: लौट
  rationale: שׁוב का सामान्य अर्थ ‘लौटना’ है और प्रसंग में पहले गए मार्ग से वापस जाने का भाव है।
- source_word: וְלָבוֹא
  choice: न ... जा सकता हूँ
  rationale: בוא दृष्टिकोण के अनुसार ‘आना’ या ‘जाना’ हो सकता है। यहाँ आमंत्रित करने वाले के साथ उसके गंतव्य की ओर चलने के लिए हिन्दी का ‘जाना’ स्वाभाविक है; मूल पाठ में भीतर प्रवेश करने का भाव अनिवार्य नहीं।
- source_word: וְלֹא אֹכַל לֶחֶם
  choice: न रोटी खाऊँगा
  rationale: לֶחֶם को सामान्य ‘भोजन’ बनाने के बजाय ‘रोटी’ रखा गया है, क्योंकि यही ठोस शब्द आसपास के कथन में बार-बार आता है।
- source_word: וְלֹא אֶשְׁתֶּה ... מַיִם
  choice: न पानी पीऊँगा
  rationale: इब्रानी के समान खाने और पीने दोनों का स्पष्ट निषेध रखा गया है; हिन्दी में समानांतर ‘न ... न ...’ संरचना स्वाभाविक है।
- source_word: בַּמָּקוֹם הַזֶּה
  choice: इस स्थान पर
  rationale: यह स्थानवाचक वाक्यांश का सीधा और गरिमापूर्ण हिन्दी रूप है तथा केवल ‘यहाँ’ की अपेक्षा मूल संरचना को अधिक स्पष्ट रखता है।
