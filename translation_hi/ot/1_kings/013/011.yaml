base_translation:
  language: en
  yaml_path: translation/ot/1_kings/013/011.yaml
  text: An old prophet was living in Bethel[a], and his sons came and told him all the deed that the man of God had done that day in Bethel, and the words that he had spoken to the king[b]; they told them to their father.
translation:
  language: hi
  text: बेतेल में एक बूढ़ा भविष्यद्वक्ता रहता था। उसका बेटा आया और उसने उसे वह सारा काम बताया जो परमेश्वर के जन ने उस दिन बेतेल में किया था, और वे बातें भी जो उसने राजा से कही थीं; फिर उन्होंने वे बातें अपने पिता को बताईं।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी पाठ पहले एकवचन में कहता है, “उसका बेटा आया और उसने उसे बताया,” पर अंत में बहुवचन है, “उन्होंने वे बातें अपने पिता को बताईं।” इससे एक से अधिक बेटों का संकेत मिल सकता है, या यह पाठ अथवा कथन की अनियमितता हो सकती है; अनुवाद ने इस बदलाव को ज्यों का त्यों रखा है।
    reason: textual_variant
lexical_decisions:
- source_word: נָבִיא אֶחָד זָקֵן
  choice: एक बूढ़ा भविष्यद्वक्ता
  rationale: אֶחָד यहाँ किसी अनिश्चित व्यक्ति का परिचय देता है। ‘एक बूढ़ा भविष्यद्वक्ता’ स्वाभाविक हिन्दी है और ‘कोई एक/एक निश्चित’ जैसी अनावश्यक व्याख्या से बचता है।
- source_word: יֹשֵׁב בְּבֵית־אֵל
  choice: बेतेल में रहता था
  rationale: יֹשֵׁב का प्रसंगगत अर्थ निवास करना है, न कि केवल बैठना।
- source_word: וַיָּבֹא בְנוֹ
  choice: उसका बेटा आया
  rationale: בְנוֹ रूपात्मक रूप से एकवचन है; इसलिए बाद के बहुवचन के साथ मौजूद पाठगत तनाव को समतल नहीं किया गया।
- source_word: אֶת כָּל הַמַּעֲשֶׂה
  choice: वह सारा काम
  rationale: מַעֲשֶׂה एकवचन सामूहिक अभिव्यक्ति है। ‘वह सारा काम’ हिन्दी में स्वाभाविक रहते हुए उल्लेखनीय कार्य की समग्रता व्यक्त करता है।
- source_word: אִישׁ הָאֱלֹהִים
  choice: परमेश्वर का जन
  rationale: यह पूर्ववर्ती भविष्यद्वक्ताओं की पुस्तकों में प्रयुक्त मानक भविष्यद्वक्ताई उपाधि है; हिन्दी बाइबलीय प्रयोग में ‘परमेश्वर का जन’ स्पष्ट और प्रतिष्ठित है।
- source_word: אֶת הַדְּבָרִים אֲשֶׁר דִּבֶּר אֶל הַמֶּלֶךְ
  choice: वे बातें भी जो उसने राजा से कही थीं
  rationale: דְּבָרִים को ‘बातें’ कहना कर्म से अलग भविष्यद्वक्ताई वचन पर पाठ के बल को बनाए रखता है।
- source_word: וַיְסַפְּרוּם לַאֲבִיהֶם
  choice: फिर उन्होंने वे बातें अपने पिता को बताईं
  rationale: बहुवचन क्रिया, बहुवचन कर्म-प्रत्यय और ‘अपने पिता’ के बहुवचन संबंध को जानबूझकर सुरक्षित रखा गया है, यद्यपि पहले ‘उसका बेटा’ एकवचन है। ‘फिर’ हिन्दी में पुनरुक्त कथन को स्पष्ट करता है, बिना तनाव मिटाए।
