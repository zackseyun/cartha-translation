  text: And he went[a], and a lion found him on the road and killed him. And his corpse was cast on the road, and the donkey was standing beside it, and the lion was standing beside the corpse.
translation:
  language: hi
  text: तब वह चला गया। मार्ग में उसे एक सिंह मिला और उसने उसे मार डाला। उसका शव मार्ग पर फेंका हुआ पड़ा था[a]; गधा उसके पास खड़ा था, और सिंह भी शव के पास खड़ा था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसका शव मार्ग पर फेंका पड़ा था।” इब्रानी का निष्क्रिय कृदन्त बताता है कि शव वहाँ केवल पड़ा नहीं था, बल्कि फेंका हुआ था।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: तब वह चला गया
  rationale: वाव-क्रमिक कथा को आगे बढ़ाता है; ‘तब’ आधुनिक हिन्दी में क्रम को स्वाभाविक रूप से व्यक्त करता है, जबकि ‘चला गया’ यात्रा के जारी रहने का भाव देता है।
- source_word: וַיִּמְצָאֵהוּ
  choice: उसे पाया
  rationale: מצא का सीधा अर्थ ‘पाना’ है; यह सिंह के अचानक उसका सामना कर लेने के प्रसंग में भी स्वाभाविक है।
- source_word: אַרְיֵה
  choice: एक सिंह
  rationale: यहाँ सिंह का प्रथम उल्लेख अनिश्चित अर्थ में है; ‘एक सिंह’ उसका सामान्य और स्पष्ट हिन्दी रूप है।
- source_word: בַּדֶּרֶךְ
  choice: मार्ग में / मार्ग पर
  rationale: यात्रा के संदर्भ में דרך के लिए ‘मार्ग’ गरिमापूर्ण और सामान्य हिन्दी है। सिंह से भेंट के लिए ‘मार्ग में’ और शव की स्थिति के लिए ‘मार्ग पर’ हिन्दी मुहावरे के अनुसार प्रयुक्त हैं।
- source_word: וַיְמִיתֵהוּ
  choice: मार डाला
  rationale: מות के हिफ़ील रूप का अर्थ मृत्यु का कारण बनना है; ‘मार डाला’ स्पष्ट और स्वाभाविक है।
- source_word: נִבְלָתוֹ
  choice: उसका शव
  rationale: נבלה मृत देह को दर्शाता है; ‘शव’ संक्षिप्त, स्पष्ट और प्रसंगानुकूल गंभीर शब्द है।
- source_word: מֻשְׁלֶכֶת
  choice: फेंका हुआ पड़ा था
  rationale: यह שלך का होफ़ाल निष्क्रिय कृदन्त है। यह रूप शव के वहाँ केवल पड़े होने के बजाय फेंके हुए होने और परिणामी अवस्था—दोनों को व्यक्त करता है।
- source_word: וְהַחֲמוֹר עֹמֵד אֶצְלָהּ
  choice: गधा उसके पास खड़ा था
  rationale: עֹמֵד का कृदन्त दृश्य की जारी अवस्था बताता है; ‘खड़ा था’ हिन्दी में इसे स्वाभाविक रूप से व्यक्त करता है।
- source_word: וְהָאַרְיֵה עֹמֵד אֵצֶל הַנְּבֵלָה
  choice: और सिंह भी शव के पास खड़ा था
  rationale: मूल में ‘शव’ संज्ञा दोहराई गई है, इसलिए उसे सर्वनाम से नहीं बदला गया। ‘भी’ गधे और सिंह—दोनों के शव के पास खड़े होने की समानान्तर रचना को स्पष्ट करता है।
