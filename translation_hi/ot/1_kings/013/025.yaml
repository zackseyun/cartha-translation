  text: And behold[a], men were passing by and saw the corpse thrown on the road, and the lion standing beside the corpse; and they came and reported it in the city where the old prophet lived.
translation:
  language: hi
  text: और देखो, कुछ आदमी उधर से गुज़र रहे थे। उन्होंने सड़क पर फेंका हुआ शव और शव के पास खड़े शेर को देखा। वे आए और उस नगर में, जहाँ वृद्ध भविष्यद्वक्ता रहता था, यह बात बताई[a]।
  philosophy: optimal-equivalence
  footnotes:
