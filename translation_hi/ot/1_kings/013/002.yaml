- issue: אָדָם का सामान्य मानव-सूचक अर्थ
  choice: मनुष्यों की हड्डियाँ
  alternative: मनुष्य की हड्डियाँ
  rationale: यहाँ אָדָם किसी नामित व्यक्ति या केवल पुरुष लिंग को नहीं, मानव देहावशेषों को सामान्य रूप से सूचित करता है।
