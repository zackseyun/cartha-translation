  register: आधुनिक मानक हिन्दी में गरिमापूर्ण भविष्यद्वाणी-शैली रखी गई है। वेदी के प्रत्यक्ष सम्बोधन के कारण ‘तू/तुझ’ का प्रयोग निर्जीव वस्तु के आलंकारिक एकवचन सम्बोधन के रूप में किया गया है। ‘यों कहता है’ और ‘हे वेदी’ पारंपरिक बाइबलीय परिचय बनाए रखते हुए सामान्य पाठक के लिए स्पष्ट हैं।
