- source_word: בֵן נוֹלָד לְבֵית דָּוִד
  choice: दाऊद के घराने में एक पुत्र जन्म लेगा
  rationale: निफ़अल कृदन्त नוֹלָד यहाँ भविष्यसूचक घोषणा में भावी घटना व्यक्त करता है; לְבֵית को हिन्दी में वंश/घराने के भीतर जन्म के रूप में स्वाभाविक बनाया गया है।
