base_translation:
  language: en
  yaml_path: translation/ot/1_kings/013/002.yaml
  text: 'And he cried out against the altar by the word of Yahweh and said[a], “Altar, altar, thus says Yahweh: Behold, a son will be born to the house of David, Josiah by name, and he will sacrifice on you the priests of the high places who burn incense on you[c][b], and human bones will be burned on you.”'
translation:
  language: hi
  text: 'उसने यहोवा के वचन के द्वारा उस वेदी के विरुद्ध पुकारकर कहा[a], “हे वेदी, हे वेदी! यहोवा यों कहता है: देख, दाऊद के घराने में एक पुत्र जन्म लेगा, जिसका नाम योशिय्याह होगा। वह तुझ पर उन ऊँचे स्थानों के याजकों को बलि चढ़ाएगा[b], जो तुझ पर धूप जलाते हैं; और तुझ पर मनुष्यों की हड्डियाँ जलाई जाएँगी[c]।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “यहोवा के वचन पर” अथवा “यहोवा के वचन के अनुसार।”
    reason: בִּדְבַר में साधन, प्रेरणा या मानक/अनुरूपता की निकटवर्ती अर्थ-सम्भावनाएँ हैं।
  - marker: b
    text: या, “वध करेगा।” इब्रानी क्रिया में बलि के लिए वध करने का भाव है, जो वेदी के अपवित्रीकरण को जानबूझकर बलिदानी भाषा में व्यक्त कर सकता है।
    reason: זבח के बलिदानी और वध-संबंधी दोनों अर्थ-तत्त्वों को स्पष्ट करना।
  - marker: c
    text: शाब्दिक रूप से, “אָדָם की हड्डियाँ”; यहाँ אָדָם सामान्यतः मानवजाति या मनुष्यों के लिए प्रयुक्त है।
    reason: मूल की संज्ञा और उसके संदर्भगत सामान्य मानव-सूचक प्रयोग को दर्ज करना।
