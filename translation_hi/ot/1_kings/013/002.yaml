  rationale: हिफ़ील קטר बलि-सामग्री का धुआँ उठाने और प्रायः धूप जलाने के लिए आता है; संदर्भ में यह स्पष्ट हिन्दी चयन है।
- source_word: וְעַצְמוֹת אָדָם
  choice: मनुष्यों की हड्डियाँ
