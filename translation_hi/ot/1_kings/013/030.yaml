  text: And he laid his corpse in his own tomb[a], and they mourned over him, saying, “Alas[b], my brother!”
translation:
  language: hi
  text: 'उसने उसकी लाश अपनी कब्र में रखी, और उन्होंने उसके लिए विलाप किया: “हाय, मेरे भाई!”[a]'
