    reason: cultural_note
lexical_decisions:
- source_word: וַיַּנַּח
  choice: रखी
  rationale: हिफ़ील रूप का अर्थ यहाँ किसी वस्तु को रख देना है; दफ़न के प्रसंग में ‘रखी’ स्वाभाविक और स्रोत के निकट है।
- source_word: נִבְלָתוֹ
  choice: उसकी लाश
  rationale: נְבֵלָה निर्जीव देह को स्पष्ट रूप से दर्शाता है; आधुनिक हिन्दी में ‘लाश’ इसकी तीव्रता को ‘देह’ से बेहतर बनाए रखता है।
- source_word: בְּקִבְרוֹ
  choice: अपनी ही कब्र में
  rationale: प्रत्यय उस वृद्ध नबी की अपनी कब्र का संकेत देता है; ‘ही’ प्रसंग में इस स्वामित्व को स्पष्ट और स्वाभाविक बनाता है। קֶבֶר के लिए ‘कब्र’ सामान्य आधुनिक हिन्दी है।
- source_word: וַיִּסְפְּדוּ עָלָיו
  choice: उन्होंने उसके लिए विलाप करते हुए कहा
  rationale: ספד मृतक के लिए शोक-विलाप करने को दर्शाता है। अगले उद्धरण को उसी विलाप की वाणी के रूप में जोड़ना हिन्दी में स्वाभाविक है; बहुवचन ‘उन्होंने’ मूल पाठ में उपस्थित है।
- source_word: הוֹי
  choice: हाय
  rationale: यह शोक की पुकार है। ‘हाय’ हिन्दी के अंत्येष्टि-विलाप में स्वाभाविक है और न्यायसूचक ‘धिक्कार’ जैसा अर्थ नहीं जोड़ता।
- source_word: אָחִי
  choice: मेरे भाई
  rationale: शाब्दिक पारिवारिक संबोधन और विलाप की आत्मीयता दोनों सुरक्षित रहते हैं।
