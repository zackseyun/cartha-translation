  register: भाषा आधुनिक, गरिमापूर्ण और कथात्मक रखी गई है। ‘नबी’, ‘परमेश्वर का जन’, ‘यहोवा’ और ‘सिंह’ जैसे परिचित बाइबलीय पदों को बनाए रखते हुए वाक्य-विन्यास सामान्य हिन्दी पाठक के लिए सहज बनाया गया है।
