  text: וַ/יִּשְׁמַ֣ע הַ/נָּבִיא֮ אֲשֶׁ֣ר הֱשִׁיב֣/וֹ מִן הַ/דֶּרֶךְ֒ וַ/יֹּ֨אמֶר֙ אִ֣ישׁ הָ/אֱלֹהִ֣ים ה֔וּא אֲשֶׁ֥ר מָרָ֖ה אֶת פִּ֣י יְהוָ֑ה וַ/יִּתְּנֵ֨/הוּ יְהוָ֜ה לָ/אַרְיֵ֗ה וַֽ/יִּשְׁבְּרֵ֨/הוּ֙ וַ/יְמִתֵ֔/הוּ כִּ/דְבַ֥ר יְהוָ֖ה אֲשֶׁ֥ר דִּבֶּר לֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/013/026.yaml
  text: When the prophet who had brought him back from the way heard it[a], he said, “It is the man of God who rebelled against the word of Yahweh; therefore Yahweh gave him to the lion, and it mauled him and killed him, according to the word of Yahweh that he spoke to him.”
translation:
  language: hi
  text: जिस नबी ने उसे रास्ते से लौटा लाया था, उसने यह समाचार सुना और कहा, “यह वही परमेश्वर का जन है जिसने यहोवा के वचन के विरुद्ध विद्रोह किया था।[a] इसलिए यहोवा ने उसे सिंह के हवाले कर दिया, और सिंह ने उसे चीर डाला और मार डाला—ठीक यहोवा के उस वचन के अनुसार जो यहोवा ने उससे कहा था।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “यहोवा के वचन के विरुद्ध विद्रोह किया” का शाब्दिक रूप “यहोवा के मुँह के विरुद्ध विद्रोह किया” है; इसका अनुवाद “यहोवा की आज्ञा न मानी” भी हो सकता है।
    reason: मूल इब्रानी मुहावरे और מָרָה के वैकल्पिक अर्थों को सुरक्षित रखना।
lexical_decisions:
- source_word: הֱשִׁיבוֹ מִן הַדֶּרֶךְ
  choice: उसे रास्ते से लौटा लाया था
  rationale: हिफ़ील रूप का कारणवाचक अर्थ सुरक्षित है; ‘रास्ते से’ उसकी यात्रा से वापस मोड़ने को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: אִישׁ הָאֱלֹהִים
  choice: परमेश्वर का जन
  rationale: यह नबी अथवा ईश्वरीय दूत के लिए प्रयुक्त स्थिर कथात्मक पदवी है और प्रसंग की निरंतरता बनाए रखती है।
- source_word: מָרָה אֶת־פִּי יְהוָה
  choice: यहोवा के वचन का विरोध किया
  rationale: מָרָה में विद्रोह अथवा अवज्ञापूर्ण विरोध का भाव है। ‘यहोवा के मुँह’ का शाब्दिक रूप हिन्दी में अस्वाभाविक है; ‘वचन’ उस बोली हुई आज्ञा का आशय सुरक्षित रखता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिन्दी में प्रचलित रूप से चतुरक्षरीय व्यक्तिगत नाम को पदवी से बदलने के बजाय नाम के रूप में प्रस्तुत करता है।
- source_word: וַיִּתְּנֵהוּ ... לָאַרְיֵה
  choice: उसे सिंह के हवाले कर दिया
  rationale: यह वाक्यांश सिंह के अधिकार में सौंप दिए जाने का भाव देता है; ‘हवाले कर दिया’ आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: וַיִּשְׁבְּרֵהוּ
  choice: उसे फाड़ डाला
  rationale: क्रिया का मूल अर्थ ‘तोड़ना’ है, पर सिंह के आक्रमण के प्रसंग में हिंसक रूप से चीरने-कुचलने का भाव है; ‘फाड़ डाला’ इसे सहज हिन्दी में व्यक्त करता है।
- source_word: וַיְמִתֵהוּ
  choice: मार डाला
  rationale: מות का हिफ़ील रूप ‘मृत्यु का कारण बनना/मारना’ है; यह सीधा और प्रसंगानुकूल अनुवाद है।
- source_word: כִּדְבַר יְהוָה אֲשֶׁר דִּבֶּר לוֹ
  choice: ठीक यहोवा के उस वचन के अनुसार जो उसने उससे कहा था
  rationale: यह पूर्वकथित दिव्य वचन की पूर्ति बताता है। ‘उसने’ और ‘उससे’ की मूल-पाठगत सर्वनामिक संरचना रखी गई है, यद्यपि संदर्भ से वे क्रमशः यहोवा और परमेश्वर के जन की ओर संकेत करते हैं।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: प्रभु
  rationale: मूल में व्यक्तिगत ईश्वरीय नाम है; उसे केवल उपाधि में बदलने के बजाय हिन्दी में परिचित नामरूप रखा गया है।
- issue: פִּי יְהוָה का मुहावरा
  choice: यहोवा का वचन
  alternative: यहोवा की आज्ञा / यहोवा का मुँह
  rationale: ‘मुँह’ मूल की मूर्त अभिव्यक्ति है, किंतु हिन्दी में यहाँ ‘वचन’ बोली हुई ईश्वरीय आज्ञा को अधिक स्वाभाविक ढंग से व्यक्त करता है। ‘आज्ञा’ भी संभव है, पर वह ‘वचन’ की अपेक्षा अर्थ को अधिक सीमित करता है।
- issue: दंड में यहोवा की सक्रिय भूमिका
  choice: यहोवा ने उसे सिंह के हवाले कर दिया
  alternative: वह सिंह का शिकार हो गया
  rationale: मूल पाठ स्पष्ट रूप से यहोवा को क्रिया का कर्ता बनाता है; इस धर्मवैचारिक तनाव को निष्क्रिय अथवा केवल प्राकृतिक घटना बनाकर नरम नहीं किया गया।
