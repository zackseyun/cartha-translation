base_translation:
  language: en
  yaml_path: translation/ot/1_kings/013/004.yaml
  text: And when the king heard the word of the man of God[a], who cried out against the altar at Bethel, Jeroboam stretched out his hand from the altar, saying, “Seize him!” But his hand, which he stretched out against him, dried up, and he could not draw it back to himself.
translation:
  language: hi
  text: जब राजा ने परमेश्वर के जन का वह वचन सुना, जो उसने बेतेल में वेदी के विरुद्ध पुकारा था, तब यारोबाम ने वेदी पर से अपना हाथ उसके विरुद्ध बढ़ाकर कहा, “उसे पकड़ लो!” पर जो हाथ उसने उसके विरुद्ध बढ़ाया था, वह सूख गया[a], और वह उसे वापस अपनी ओर न खींच सका।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “मुरझा गया।” इब्रानी में शाब्दिक अर्थ “सूख गया” है।
    reason: lexical_alternative
lexical_decisions:
- source_word: דְּבַר
  choice: वचन
  rationale: यहाँ एक भविष्यद्वक्तापूर्ण घोषणा अभिप्रेत है। ‘वचन’ इब्रानी एकवचन और धार्मिक-साहित्यिक संदर्भ, दोनों को स्वाभाविक हिंदी में बनाए रखता है।
- source_word: אִישׁ הָאֱלֹהִים
  choice: परमेश्वर का जन
  rationale: यह इब्रानी का स्थापित पदनाम है। ‘परमेश्वर का जन’ स्रोत की अभिव्यक्ति को ‘परमेश्वर का भविष्यद्वक्ता’ जैसी व्याख्यात्मक स्पष्टता जोड़े बिना सुरक्षित रखता है।
- source_word: קָרָא עַל
  choice: के विरुद्ध पुकारकर कहा
  rationale: यह चयन קרא की ऊँचे स्वर से घोषणा और על की विरोधात्मक दिशा, दोनों व्यक्त करता है।
- source_word: בְּבֵית אֵל
  choice: बेतेल में
  rationale: स्थाननाम को प्रचलित हिंदी लिप्यंतरण में रखा गया है; यहाँ पूर्वसर्ग नगर में स्थित वेदी का स्थान बताता है।
- source_word: וַיִּשְׁלַח ... אֶת יָדוֹ מֵעַל הַמִּזְבֵּחַ
  choice: वेदी के पास से अपना हाथ उसकी ओर बढ़ाया
  rationale: שׁלח יד को हिंदी की स्वाभाविक क्रिया ‘हाथ बढ़ाना’ से व्यक्त किया गया है। ‘वेदी के पास से’ राजा की वेदी-संबंधी स्थिति बताता है, पर यह नहीं कहता कि हाथ स्वयं वेदी के ऊपर रखा था।
- source_word: תִּפְשֻׂהוּ
  choice: उसे पकड़ लो!
  rationale: बहुवचन आज्ञार्थक का बल बना रहता है और आधुनिक कानूनी अर्थ वाला ‘गिरफ़्तार करो’ अनावश्यक रूप से नहीं जोड़ा जाता।
- source_word: וַתִּיבַשׁ יָדוֹ
  choice: उसका हाथ सूख गया
  rationale: ‘सूख गया’ יבש की मूल छवि को बनाए रखता है और घटना को बिना किसी चिकित्सीय निदान के अचानक हुई शारीरिक अक्षमता के रूप में प्रस्तुत करता है।
- source_word: אֲשֶׁר שָׁלַח עָלָיו
  choice: जो हाथ उसने उसकी ओर बढ़ाया था
  rationale: सापेक्ष उपवाक्य उसी हाथ और विरोधपूर्ण संकेत को पहचानता है; हिंदी में ‘उसकी ओर’ स्वाभाविक है, जबकि शत्रुतापूर्ण आशय संदर्भ और आदेश से स्पष्ट रहता है।
- source_word: לַהֲשִׁיבָהּ אֵלָיו
  choice: उसे वापस अपनी ओर न खींच सका
  rationale: हिफ़ील रूप का ‘वापस लाना’ भाव और निष्क्रिय हो चुके हाथ की शारीरिक गति, दोनों स्पष्ट और सहज हिंदी में व्यक्त होते हैं।
theological_decisions:
- issue: यारोबाम के हाथ पर आए दंड का स्वरूप
  choice: हाथ के अचानक सूख जाने और निष्क्रिय हो जाने को सीधे वर्णित किया गया है।
  alternative: ‘हाथ मुरझा गया’ या किसी विशेष चिकित्सीय अवस्था का संकेत देना।
  rationale: कथा इसे राजा की शत्रुतापूर्ण आज्ञा के तुरंत बाद घटित अलौकिक दंड के रूप में रखती है। अनुवाद घटना का बल बनाए रखता है, पर पाठ से आगे बढ़कर रोग-निदान या अतिरिक्त धर्मवैज्ञानिक व्याख्या नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और कथात्मक रखी गई है। ‘परमेश्वर का जन’ और ‘वचन’ जैसे परिचित बाइबलीय पद स्रोत के औपचारिक स्वर को बनाए रखते हैं, जबकि वाक्य-विन्यास सामान्य हिंदी पाठक के लिए सहज है।
