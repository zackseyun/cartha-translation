source:
  edition: WLC
  text: כִּֽי דָבָ֤ר אֵלַ/י֙ בִּ/דְבַ֣ר יְהוָ֔ה לֹֽא תֹאכַ֣ל לֶ֔חֶם וְ/לֹֽא תִשְׁתֶּ֥ה שָׁ֖ם מָ֑יִם לֹא תָשׁ֣וּב לָ/לֶ֔כֶת בַּ/דֶּ֖רֶךְ אֲשֶׁר הָלַ֥כְתָּ בָּֽ/הּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/013/017.yaml
  text: 'For a word came to me by the word of the LORD: ‘You shall not eat bread, and you shall not drink water there; you shall not return by going on the way by which you went.’'
translation:
  language: hi
  text: क्योंकि यहोवा के वचन के द्वारा मुझसे कहा गया है, ‘तू वहाँ न रोटी खाना और न पानी पीना; और जिस मार्ग से तू गया था, उस मार्ग से लौटकर न आना।’
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: דָבָר אֵלַי בִּדְבַר יְהוָה
  choice: यहोवा के वचन के द्वारा मुझसे कहा गया है
  rationale: इब्रानी में संज्ञात्मक और कुछ असामान्य अभिव्यक्ति है; हिन्दी में स्वाभाविक निष्क्रिय वाक्य रखते हुए दָבָר और בִּדְבַר יְהוָה दोनों का आशय सुरक्षित किया गया है।
- source_word: לֹא תֹאכַל לֶחֶם
  choice: तू ... न रोटी खाना
  rationale: לֶחֶם का सामान्य अर्थ ‘रोटी’ है और निषेध को प्रत्यक्ष आज्ञा के रूप में रखा गया है।
- source_word: לֹא תָשׁוּב לָלֶכֶת
  choice: लौटकर न आना
  rationale: שׁוב और הלך के संयुक्त भाव को सहज हिन्दी में व्यक्त करता है और वापसी के निषेध को स्पष्ट रखता है।
- source_word: בַּדֶּרֶךְ אֲשֶׁר הָלַכְתָּ בָּהּ
  choice: जिस मार्ग से तू गया था, उस मार्ग से
  rationale: मूल की संबंधवाचक रचना और उसी मार्ग के पुनः उपयोग पर बल दोनों सुरक्षित हैं।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: प्रभु
  rationale: यह व्यक्तिगत वाचा-नाम को शीर्षक से अलग बनाए रखता है और हिन्दी बाइबलीय प्रयोग में परिचित है।
- issue: आदेश का काल और बल
  choice: प्रत्यक्ष निषेधात्मक आज्ञा—‘न ... खाना’, ‘न ... पीना’, ‘न आना’
  alternative: भविष्यसूचक रूप—‘तू नहीं खाएगा/पिएगा/लौटेगा’
  rationale: संदर्भ में ये परमेश्वर द्वारा दिए गए निर्देश हैं; हिन्दी निषेधात्मक आज्ञा इस प्रकार्य को स्वाभाविक रूप से व्यक्त करती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमामय, स्पष्ट और मौखिक कथन के अनुकूल शैली। संबोधन ‘तू’ एकवचन इब्रानी रूप और पारंपरिक बाइबलीय प्रत्यक्ष वाणी के अनुरूप है।
