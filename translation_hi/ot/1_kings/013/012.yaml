  text: וַ/יְדַבֵּ֤ר אֲלֵ/הֶם֙ אֲבִי/הֶ֔ם אֵֽי זֶ֥ה הַ/דֶּ֖רֶךְ הָלָ֑ךְ וַ/יִּרְא֣וּ בָנָ֗י/ו אֶת הַ/דֶּ֨רֶךְ֙ אֲשֶׁ֤ר הָלַךְ֙ אִ֣ישׁ הָ/אֱלֹהִ֔ים אֲשֶׁר בָּ֖א מִ/יהוּדָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/013/012.yaml
  text: And their father said to them, “Which way did he go?” For his sons had seen the way that the man of God, who came from Judah, had gone.
translation:
  language: hi
  text: तब उनके पिता ने उनसे पूछा, “वह किस रास्ते से गया?” क्योंकि उसके बेटों ने वह रास्ता देखा था जिससे परमेश्वर का जन, जो यहूदा से आया था, गया था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: पूछा
  rationale: क्रिया का मूल अर्थ ‘कहा/बोला’ है, पर इसके बाद सीधा प्रश्न आता है; इसलिए आधुनिक हिन्दी में ‘पूछा’ कथात्मक कार्य को स्वाभाविक रूप से व्यक्त करता है।
- source_word: אֲבִיהֶם
  choice: उनके पिता
  rationale: बहुवचन प्रत्यय उन बेटों की ओर संकेत करता है जिनसे पिता बात कर रहा है।
- source_word: אֵי זֶה הַדֶּרֶךְ
  choice: किस रास्ते से
  rationale: यह पद किसी मार्ग की पहचान पूछता है; हिन्दी में गमन के साथ ‘किस रास्ते से’ स्वाभाविक है।
- source_word: הָלָךְ
  choice: गया
  rationale: दोनों स्थानों पर मूल क्रिया की संगति रखते हुए सरल भूतकाल प्रयोग किया गया है; पूर्वकालिकता प्रसंग और ‘था’ से स्पष्ट होती है।
- source_word: וַיִּרְאוּ
  choice: देख लिया था
  rationale: बेटों का रास्ता देखना पिता के प्रश्न से पहले हुआ था; ‘देख लिया था’ उस पूर्वकालिक और पूर्ण क्रिया को स्पष्ट करता है।
- source_word: בָנָיו
  choice: उसके बेटों
  rationale: एकवचन संबंधसूचक प्रत्यय पिता की ओर लौटता है; हिन्दी में ‘उसके बेटों’ इस संबंध को स्पष्ट रखता है।
- source_word: אִישׁ הָאֱלֹהִים
  choice: परमेश्वर का जन
  rationale: यह पारंपरिक और अर्थ-संगत हिन्दी अभिव्यक्ति है, जो मूल पद को ‘भविष्यद्वक्ता’ जैसे अधिक संकीर्ण अर्थ में नहीं बदलती।
- source_word: מִיהוּדָה
  choice: यहूदा से
  rationale: स्थान से आगमन या उत्पत्ति को आधुनिक हिन्दी में स्वाभाविक रूप से व्यक्त करता है।
theological_decisions:
- issue: אִישׁ הָאֱלֹהִים की पदवी
  choice: परमेश्वर का जन
  alternative: परमेश्वर का भविष्यद्वक्ता
  rationale: मूल पाठ व्यापक पदवी ‘परमेश्वर का जन’ देता है; ‘भविष्यद्वक्ता’ कहना यहाँ अनावश्यक व्याख्यात्मक संकीर्णता लाता।
translation_notes:
  register: 'भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। आरंभिक वाव को ‘तब’ और दूसरे वाव के व्याख्यात्मक संबंध को ‘क्योंकि’ से व्यक्त किया गया है। सर्वनाम मूल पाठ के अनुसार रखे गए हैं: पहले ‘उनके पिता’, फिर उसी पिता के लिए ‘उसके बेटे’।'
