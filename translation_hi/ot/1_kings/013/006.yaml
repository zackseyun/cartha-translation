  yaml_path: translation/ot/1_kings/013/006.yaml
  text: Then the king answered and said to the man of God[a], “Please entreat the favor of Yahweh your God, and pray for me, that my hand may be restored to me.” So the man of God entreated the favor of Yahweh, and the king’s hand was restored to him and became as it was before.
translation:
  language: hi
  text: तब राजा ने परमेश्वर के जन से कहा, “कृपा करके यहोवा, अपने परमेश्वर का अनुग्रह पाने की विनती[a] कीजिए और मेरे लिए प्रार्थना कीजिए, ताकि मेरा हाथ फिर ठीक हो जाए।” तब परमेश्वर के जन ने यहोवा का अनुग्रह पाने की विनती की, और राजा का हाथ फिर ठीक होकर पहले जैसा हो गया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “यहोवा के मुख/चेहरे को अनुनय कर।” यह इब्रानी मुहावरा यहोवा का अनुग्रह पाने की विनती करने के अर्थ में है।
    reason: स्रोत-मुहावरे का निकटतर शाब्दिक रूप और उसका अभिप्रेत अर्थ स्पष्ट करना।
lexical_decisions:
- source_word: חַל ... אֶת־פְּנֵי יְהוָה / וַיְחַל ... אֶת־פְּנֵי יְהוָה
  choice: यहोवा से अनुग्रह की विनती कर / अनुग्रह की विनती की
  rationale: इब्रानी मुहावरे का अर्थ किसी के अनुग्रह की याचना करना है। यह चयन अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है और ‘प्रसन्न कर’ जैसे अधिक व्याख्यात्मक शब्द से बचता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: परमेश्वर के व्यक्तिगत वाचा-नाम को उपाधि से बदलने के बजाय हिन्दी में प्रचलित लिप्यंतरण द्वारा रखा गया है।
- source_word: אֱלֹהֶיךָ
  choice: अपने परमेश्वर
  rationale: राजा ठीक स्रोत-पाठ के अनुसार यहोवा को परमेश्वर के जन का परमेश्वर कहता है; इसे ‘हमारे परमेश्वर’ बनाकर निहित दूरी को मिटाया नहीं गया।
- source_word: וְהִתְפַּלֵּל בַּעֲדִי
  choice: मेरे लिए प्रार्थना कर
  rationale: यह पदबंध मध्यस्थतापूर्ण प्रार्थना दर्शाता है; यह आधुनिक हिन्दी में सहज और स्पष्ट अभिव्यक्ति है।
- source_word: וְתָשֹׁב יָדִי אֵלָי / וַתָּשָׁב יַד־הַמֶּלֶךְ אֵלָיו
  choice: मेरा हाथ फिर ठीक हो जाए / राजा का हाथ फिर ठीक होकर
  rationale: शाब्दिक ‘हाथ मेरे पास लौट आए’ पूर्ववर्ती विकल अवस्था से स्वास्थ्य-लाभ का मुहावरा है। ‘फिर ठीक’ प्रसंगगत आशय स्पष्ट करता और अनुरोध तथा परिणाम में संगति रखता है।
- source_word: וַתְּהִי כְּבָרִאשֹׁנָה
  choice: पहले जैसा हो गया
  rationale: यह पूर्व अवस्था की पूर्ण बहाली को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: אִישׁ הָאֱלֹהִים
  choice: परमेश्वर का जन
  rationale: स्रोत की विशिष्ट भविष्यद्वक्तीय उपाधि को ‘भविष्यद्वक्ता’ से प्रतिस्थापित किए बिना सुरक्षित रखा गया है।
- source_word: וַיַּעַן ... וַיֹּאמֶר
  choice: कहा
  rationale: इब्रानी कथात्मक युग्म का अलग-अलग अनुवाद हिन्दी में अनावश्यक पुनरुक्ति होता; ‘कहा’ संवाद की प्रतिक्रिया को स्वाभाविक रूप से व्यक्त करता है।
theological_decisions:
- issue: राजा द्वारा यहोवा को ‘तेरा परमेश्वर’ कहना
  choice: अपने परमेश्वर यहोवा
  alternative: हमारे परमेश्वर यहोवा
  rationale: स्रोत राजा और यहोवा के बीच एक उल्लेखनीय दूरी बनाए रखता है तथा परमेश्वर के जन की विशेष स्थिति स्वीकार करता है। ‘हमारे’ कहना पाठ में अनुपस्थित धार्मिक एकजुटता जोड़ देता।
- issue: अनुग्रह की विनती और चंगाई के बीच संबंध
  choice: विनती और प्रार्थना के बाद हाथ का ठीक होना क्रमशः बताया गया
  alternative: इसे किसी निर्धारित प्रायश्चित्त-विधान या यांत्रिक चमत्कार के रूप में स्पष्ट करना
  rationale: पद प्रार्थना और बहाली को जोड़ता है, पर उनकी धर्मवैज्ञानिक प्रक्रिया का विस्तार नहीं करता; अनुवाद उसी संयम को बनाए रखता है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी। राजा के संबोधन में प्रसंगानुकूल एकवचन ‘कर’ रखा गया है। मुख्य पाठ में मुहावरे का अर्थ दिया गया है और शाब्दिक रूप पाद-टिप्पणी में सुरक्षित है।
