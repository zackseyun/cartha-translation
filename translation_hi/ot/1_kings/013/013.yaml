  text: And he said to his sons[a], “Saddle the donkey for me.” So they saddled the donkey for him, and he rode on it.
translation:
  language: hi
  text: उसने अपने बेटों से कहा, “मेरे लिए गधे पर काठी कस दो।” और उन्होंने उसके लिए गधे पर काठी कस दी, और वह उस पर सवार हुआ।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: तब उसने कहा
  rationale: वय्यिक्तोल कथा की अगली घटना को आगे बढ़ाता है; आधुनिक हिन्दी में ‘तब’ स्वाभाविक कथात्मक क्रम व्यक्त करता है, बिना समय-संबंध को जरूरत से अधिक स्पष्ट किए।
- source_word: בָּנָיו
  choice: अपने बेटों से
  rationale: इब्रानी संज्ञा पुल्लिंग बहुवचन है, इसलिए ‘बेटों’ सटीक और स्वाभाविक है।
- source_word: חִבְשׁוּ לִי הַחֲמוֹר
  choice: मेरे लिए गधे पर काठी कस दो
  rationale: इस प्रसंग में חבש का अर्थ सवारी के लिए पशु पर काठी कसना या उसे तैयार करना है; यह हिन्दी में स्पष्ट और मुहावरेदार अभिव्यक्ति है।
- source_word: הַחֲמוֹר
  choice: गधा
  rationale: חמור का सामान्य आधुनिक हिन्दी पर्याय ‘गधा’ है।
- source_word: וַיַּחְבְּשׁוּ לוֹ הַחֲמוֹר
  choice: इसलिए उन्होंने उसके लिए गधे पर काठी कस दी
  rationale: आज्ञा के पालन को वही क्रिया दोहराकर व्यक्त किया गया है; ‘इसलिए’ प्रतिक्रिया और परिणाम का स्वाभाविक संबंध दिखाता है।
- source_word: וַיִּרְכַּב עָלָיו
  choice: और वह उस पर सवार हो गया
  rationale: רכב על पशु पर चढ़कर सवारी करने को दर्शाता है; ‘उस पर सवार हो गया’ आधुनिक हिन्दी में स्वाभाविक है और केवल आरंभिक चढ़ने या आगे सवारी करने—दोनों के बीच स्रोत की व्यापकता बनाए रखता है।
