base_translation:
  language: en
  yaml_path: translation/ot/1_kings/013/008.yaml
  text: But the man of God said to the king[a], “If you were to give me half your house, I would not go with you, nor would I eat bread or drink water in this place.”
translation:
  language: hi
  text: परन्तु परमेश्वर के जन ने राजा से कहा, “यदि आप मुझे अपना आधा घर[a] भी दे दें, तो भी मैं आपके साथ नहीं जाऊँगा; और न मैं इस स्थान पर रोटी खाऊँगा, न पानी पीऊँगा।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से ‘अपना आधा घर’। यहाँ ‘घर’ से आशय घराने या संपत्ति से भी हो सकता है; यह बहुत बड़े पुरस्कार की पेशकश को सूचित करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ הָאֱלֹהִים
  choice: परमेश्वर का जन
  rationale: यह इब्रानी में परमेश्वर द्वारा नियुक्त दूत के लिए प्रचलित पद है। ‘परमेश्वर का जन’ मूल अभिव्यक्ति और उसकी बाइबलीय गरिमा को बनाए रखता है; ‘परमेश्वर का नबी’ अधिक व्याख्यात्मक होता।
- source_word: אִם תִּתֶּן לִי אֶת חֲצִי בֵיתֶךָ
  choice: यदि आप मुझे अपना आधा घर भी दे दें
  rationale: शाब्दिक चित्र ‘आधा घर’ सुरक्षित रखा गया है। ‘भी’ इस अत्यधिक उदार प्रस्ताव के बावजूद दृढ़ इनकार का स्वाभाविक हिन्दी बल प्रकट करता है।
- source_word: בֵיתֶךָ
  choice: अपना घर
  rationale: בַּיִת का अर्थ घर, घराना या संपत्ति हो सकता है। मुख्य पाठ में ‘घर’ रखकर मूल की वास्तविक अर्थगत व्यापकता को पादटिप्पणी में बताया गया है।
- source_word: לֹא אָבֹא עִמָּךְ
  choice: मैं आपके साथ नहीं जाऊँगा
  rationale: क्रिया का मूल अर्थ ‘आना’ है, पर राजा के निमंत्रण के उत्तर में आधुनिक हिन्दी में ‘आपके साथ नहीं जाऊँगा’ स्वाभाविक दिशासूचक समतुल्य है।
- source_word: לֹא אֹכַל לֶחֶם
  choice: न मैं ... रोटी खाऊँगा
  rationale: לֶחֶם भोजन के लिए भी प्रयुक्त हो सकता है, फिर भी ‘रोटी’ सहज हिन्दी है और इब्रानी शब्द-चित्र को सुरक्षित रखती है।
- source_word: לֹא אֶשְׁתֶּה מַּיִם
  choice: न पानी पीऊँगा
  rationale: यह मूल का सीधा और स्वाभाविक अनुवाद है तथा पिछले निषेध के साथ समानांतर संरचना बनाए रखता है।
- source_word: בַּמָּקוֹם הַזֶּה
  choice: इस स्थान पर
  rationale: यह अनुवाद संकेतवाचक बल को ‘यहाँ’ की अपेक्षा अधिक स्पष्ट रूप से बनाए रखता है।
