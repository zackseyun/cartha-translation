lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: तब उसने कहा
  rationale: वाव-परिणामी कथा को आगे बढ़ाता है; ‘तब’ क्रमिक प्रवाह को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: אֵלָיו
  choice: उससे
  rationale: पूर्वसर्ग और तृतीय पुरुष एकवचन पुल्लिंग प्रत्यय का स्वाभाविक हिन्दी रूप, जो कथन के संबोधित व्यक्ति को दर्शाता है।
- source_word: לֵךְ
  choice: चल
  rationale: मूल क्रिया का अर्थ ‘जाना/चलना’ है। वक्ता के साथ जाने के निमंत्रण में ‘मेरे साथ ... चल’ स्वाभाविक हिन्दी है और क्रिया की मूल दिशा को अनावश्यक रूप से नहीं बदलता।
- source_word: אִתִּי
  choice: मेरे साथ
  rationale: प्रथम पुरुष एकवचन प्रत्यय सहित पूर्वसर्ग का सीधा और स्वाभाविक अनुवाद।
- source_word: הַבָּיְתָה
  choice: घर
  rationale: ‘घर’ के साथ दिशासूचक ה लक्ष्य की ओर गति बताता है; हिन्दी में ‘घर चल’ स्वयं ‘घर की ओर/घर को चल’ का स्वाभाविक अर्थ देता है।
- source_word: וֶאֱכֹל
  choice: और ... खा
  rationale: पहली आज्ञार्थक क्रिया के बाद जुड़ा दूसरा आमंत्रणात्मक आज्ञार्थक रूप; हिन्दी में सरल आज्ञार्थक ‘खा’ मूल की संक्षिप्तता बनाए रखता है।
- source_word: לָחֶם
  choice: रोटी
  rationale: לֶחֶם का मूल अर्थ ‘रोटी’ है, यद्यपि इसका व्यापक अर्थ भोजन भी हो सकता है। यहाँ मूल शब्द को बनाए रखना हिन्दी में भी सहज है।
