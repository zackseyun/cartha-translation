  yaml_path: translation/ot/1_kings/013/014.yaml
  text: So he went after the man of God and found him sitting under the terebinth[a], and he said to him, “Are you the man of God who came from Judah?” And he said, “I am.”
translation:
  language: hi
  text: तब वह परमेश्वर के जन के पीछे गया और उसे टेरिबिन्थ वृक्ष[a] के नीचे बैठा पाया। उसने उससे कहा, “क्या तुम परमेश्वर के जन हो, जो यहूदा से आए हो?” उसने कहा, “मैं हूँ।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “बलूत वृक्ष।” इब्रानी शब्द אֵלָה अधिक विशेष रूप से टेरिबिन्थ वृक्ष को सूचित करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ אַחֲרֵי
  choice: उसके पीछे गया
  rationale: यह इब्रानी मुहावरा किसी व्यक्ति के पीछे जाने या उसका पीछा करने का भाव व्यक्त करता है; प्रसंग में सामान्य और स्वाभाविक हिन्दी ‘पीछे गया’ उपयुक्त है।
- source_word: אִישׁ הָאֱלֹהִים
  choice: परमेश्वर का जन
  rationale: यह पूरे प्रसंग में प्रयुक्त स्थापित इब्रानी उपाधि का सीधा अनुवाद है; ‘नबी’ कहने से मूल से अधिक विशिष्ट पद जोड़ दिया जाता। विभक्ति के साथ स्वाभाविक हिन्दी रूप ‘परमेश्वर के जन’ है।
- source_word: וַיִּמְצָאֵהוּ
  choice: उसे ... पाया
  rationale: מצא का सामान्य कथात्मक अर्थ ‘पाना’ है और यह हिन्दी में इस प्रसंग के लिए सीधा तथा स्वाभाविक है।
- source_word: יֹשֵׁב
  choice: बैठा
  rationale: यह कृदन्त उस समय व्यक्ति की शारीरिक मुद्रा बताता है जब वह मिला।
- source_word: תַּחַת הָאֵלָה
  choice: बांज वृक्ष के नीचे
  rationale: אֵלָה किसी बड़े ओक-सदृश वृक्ष, अधिक विशेषतः टेरिबिन्थ, को सूचित करता है। ‘बांज वृक्ष’ आधुनिक हिन्दी पाठक के लिए सुबोध मुख्य-पाठ विकल्प है, जबकि अधिक सटीक वनस्पति नाम पादटिप्पणी में रखा गया है।
- source_word: הַאַתָּה
  choice: क्या तुम वही ... हो
  rationale: प्रश्नवाचक कण और सर्वनाम पहचान की पुष्टि पूछते हैं; ‘वही’ हिन्दी में इस बल को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: אֲשֶׁר בָּאתָ מִיהוּדָה
  choice: जो यहूदा से आए हो
  rationale: सम्बन्धवाचक उपवाक्य व्यक्ति को उसके आने के स्थान से पहचानता है; आदरसूचक बहुवचन हिन्दी में गरिमापूर्ण संवाद के अनुरूप है।
- source_word: אָנִי
  choice: हाँ, मैं ही हूँ
  rationale: शाब्दिक उत्तर ‘मैं’ है; प्रश्न के उत्तर में हिन्दी का स्वाभाविक पूर्ण रूप ‘हाँ, मैं ही हूँ’ उसकी पुष्टिकारक शक्ति को व्यक्त करता है।
