  text: כִּי֩ הָיֹ֨ה יִהְיֶ֜ה הַ/דָּבָ֗ר אֲשֶׁ֤ר קָרָא֙ בִּ/דְבַ֣ר יְהוָ֔ה עַל הַ/מִּזְבֵּ֖חַ אֲשֶׁ֣ר בְּ/בֵֽית אֵ֑ל וְ/עַל֙ כָּל בָּתֵּ֣י הַ/בָּמ֔וֹת אֲשֶׁ֖ר בְּ/עָרֵ֥י שֹׁמְרֽוֹן־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/013/032.yaml
  text: For the word that he cried out by the word of Yahweh against the altar that is in Bethel[a], and against all the houses of the high places that are in the cities of Samaria[b], will surely come to pass.
translation:
  language: hi
  text: क्योंकि वह वचन, जिसे उसने याहवे के वचन से बेतेल में स्थित वेदी के विरुद्ध और सामरिया के नगरों में ऊँचे स्थानों के सब भवनों[a] के विरुद्ध पुकारकर कहा था, निश्चय ही पूरा होगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “ऊँचे स्थानों के सभी पूजास्थल।” इब्रानी में शाब्दिक रूप से “ऊँचे स्थानों के सभी भवन” है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले पद में दफ़नाने के विषय में कही गई बात का कारण प्रस्तुत करता है।
- source_word: הָיֹה יִהְיֶה
  choice: निश्चय ही पूरा होगा
  rationale: धातु היה के infinitive absolute और imperfect का संयोग भविष्य में निश्चित पूर्ति पर विशेष बल देता है।
- source_word: הַדָּבָר
  choice: वचन
  rationale: भविष्यवाणी के प्रसंग में यह किसी सामान्य बात के बजाय घोषित संदेश को सूचित करता है।
- source_word: אֲשֶׁר קָרָא
  choice: जो ... पुकारकर कहा था
  rationale: यह भविष्यद्वक्ता की सार्वजनिक और जोरदार घोषणा की मौखिक शक्ति को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: בִּדְבַר יְהוָה
  choice: यहोवा के वचन से
  rationale: यह अभिव्यक्ति उस ईश्वरीय प्रकाशन या अधिकार को दर्शाती है जिसके आधार पर भविष्यद्वक्ता बोला।
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिन्दी में प्रचलित प्रतिलेखन द्वारा परमेश्वर के व्यक्तिगत वाचा-नाम को शीर्षक से बदले बिना सुरक्षित रखा गया है।
- source_word: עַל
  choice: के विरुद्ध
  rationale: न्याय की इस भविष्यवाणी में यह निंदा के लक्ष्य को दर्शाता है।
- source_word: הַמִּזְבֵּחַ
  choice: वेदी
  rationale: यह बेतेल में यारोबाम द्वारा स्थापित उपासना-वेदी का सीधा उल्लेख है।
- source_word: בְּבֵית אֵל
  choice: बेतेल की
  rationale: स्थान-संबंध को सहज हिन्दी में व्यक्त किया गया है; बेतेल नाम का प्रचलित देवनागरी रूप है।
- source_word: כָּל בָּתֵּי הַבָּמוֹת
  choice: जितने ऊँचे स्थानों के भवन हैं, उन सब
  rationale: मूल के 'ऊँचे स्थानों के सभी भवन' को बिना केवल 'पूजास्थल' बनाकर व्याख्यायित किए संरक्षित करता है।
- source_word: בְּעָרֵי שֹׁמְרוֹן
  choice: सामरिया के नगरों में
  rationale: मूल construct संबंध का स्वाभाविक हिन्दी अनुवाद है और पाठ में उपस्थित सामरिया-संबंधी ऐतिहासिक तनाव को नहीं मिटाता।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: व्यक्तिगत ईश्वरीय नाम को 'प्रभु' जैसे शीर्षक से प्रतिस्थापित नहीं किया गया; हिन्दी पाठकों के लिए परिचित प्रतिलेखन चुना गया है।
- issue: הָיֹה יִהְיֶה में भविष्यवाणी की निश्चितता
  choice: निश्चय ही पूरा होगा
  alternative: अवश्य घटित होगा
  rationale: यह रचना पूर्ति की प्रबल निश्चितता व्यक्त करती है; चुना हुआ रूप भविष्यवाणी के 'वचन' के साथ स्वाभाविक भी है।
- issue: בָּתֵּי הַבָּמוֹת की व्याख्यात्मक सीमा
  choice: ऊँचे स्थानों के भवन
  alternative: ऊँचे स्थानों के पूजास्थल
  rationale: मूल में 'भवन' और 'ऊँचे स्थान' दोनों तत्व हैं; मुख्य पाठ उन्हें बनाए रखता है और अधिक व्याख्यात्मक विकल्प को पादटिप्पणी में देता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए बोधगम्य रखी गई है। भविष्यवाणी की निश्चितता, सार्वजनिक घोषणा की तीव्रता और मूल के असामान्य 'ऊँचे स्थानों के भवन' को यथासंभव सुरक्षित रखा गया है।
