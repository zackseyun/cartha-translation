  register: भाषा आधुनिक, सरल और गरिमापूर्ण रखी गई है। भविष्यसूचक घोषणा की सजीवता के लिए ‘देखो’ और घटना की स्पष्टता के लिए ‘फट जाएगी’ तथा ‘बिखर जाएगी’ प्रयुक्त हुए हैं। सभी पाद-टिप्पणी चिह्न संबंधित शब्दों के तुरंत बाद रखे गए हैं।
