  text: וְ/נָתַן֩ בַּ/יּ֨וֹם הַ/ה֤וּא מוֹפֵת֙ לֵ/אמֹ֔ר זֶ֣ה הַ/מּוֹפֵ֔ת אֲשֶׁ֖ר דִּבֶּ֣ר יְהוָ֑ה הִנֵּ֤ה הַ/מִּזְבֵּ֨חַ֙ נִקְרָ֔ע וְ/נִשְׁפַּ֖ךְ הַ/דֶּ֥שֶׁן אֲשֶׁר עָלָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/013/003.yaml
  text: 'And on that day he gave a sign[a], saying, “This is the sign that Yahweh has spoken: behold, the altar will be torn apart[b], and the ashes that are on it will be poured out.”'
translation:
  language: hi
  text: 'उस दिन उसने एक चिन्ह[a] दिया और कहा, “यह वह चिन्ह है जिसकी घोषणा यहोवा ने की है: देखो, वेदी फट जाएगी और उस पर पड़ी राख[b] उंडेली जाएगी।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “अद्भुत चिन्ह” अथवा “शकुन”; इब्रानी शब्द מוֹפֵת।
    reason: lexical_alternative
  - marker: b
    text: यहाँ “राख” के इब्रानी शब्द का अर्थ विशेष रूप से बलियों की चर्बीयुक्त राख या जले हुए अवशेष भी हो सकता है।
    reason: cultural_note
lexical_decisions:
- source_word: וְנָתַן
  choice: उसने ... चिन्ह देते हुए कहा
  rationale: נתן का मूल अर्थ ‘देना/रखना’ है। מוֹפֵת के साथ यह किसी भविष्यवाणी को प्रमाणित करने वाला चिन्ह देने को व्यक्त करता है; हिंदी में संयुक्त वाक्यांश प्रवाहपूर्ण है।
- source_word: מוֹפֵת
  choice: चिन्ह
  rationale: यह शब्द ‘चिन्ह’, ‘अद्भुत काम’ या ‘शकुन’ का अर्थ दे सकता है। यहाँ यह भविष्यवाणी को प्रमाणित करने वाली घटना है, इसलिए ‘चिन्ह’ संदर्भ के सबसे अनुकूल है।
- source_word: דִּבֶּר יְהוָה
  choice: यहोवा ने कहा है
  rationale: इब्रानी पूर्ण क्रिया पहले कही जा चुकी उस वाणी की ओर संकेत करती है, जिसका चिन्ह अब बताया जा रहा है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: मूल पाठ में प्रयुक्त परमेश्वर के व्यक्तिगत नाम יהוה को हिंदी में प्रचलित लिप्यंतरण ‘यहोवा’ से प्रस्तुत किया गया है, किसी उपाधि से नहीं।
- source_word: הִנֵּה
  choice: देखो
  rationale: यह भविष्यसूचक कथन में ध्यान खींचने और घोषित घटना की सजीवता दिखाने वाला स्वाभाविक आधुनिक हिंदी प्रयोग है।
- source_word: הַמִּזְבֵּחַ נִקְרָע
  choice: यह वेदी फट जाएगी
  rationale: קרע का निफ़अल रूप निष्क्रिय/परिणामी भाव देता है। संदर्भ में चिन्ह अभी घटने वाला है, इसलिए भविष्यकाल रखा गया; कठोर वेदी के लिए हिंदी में ‘फट जाएगी’ स्वाभाविक है।
- source_word: וְנִשְׁפַּךְ
  choice: बिखर जाएगी
  rationale: שׁפך का अर्थ ‘उंडेला जाना/बह निकलना’ है। वेदी पर पड़ी राख के नीचे गिरने के लिए ‘बिखर जाएगी’ हिंदी में स्वाभाविक है और अनियंत्रित रूप से बाहर गिरने का भाव देता है।
- source_word: הַדֶּשֶׁן
  choice: राख
  rationale: बलिदानी संदर्भ में यह चर्बीयुक्त राख अथवा जले हुए अवशेषों को सूचित कर सकता है। मुख्य पाठ में सरल ‘राख’ रखा गया और विशिष्टता पाद-टिप्पणी में दी गई है।
- source_word: אֲשֶׁר עָלָיו
  choice: इस पर पड़ी
  rationale: यह वेदी पर स्थित राख का स्वाभाविक और संक्षिप्त हिंदी वर्णन है।
theological_decisions:
- issue: दिव्य नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ के व्यक्तिगत दिव्य नाम को उपाधि ‘प्रभु’ से बदलने के बजाय हिंदी में व्यापक रूप से पहचाने जाने वाले लिप्यंतरण ‘यहोवा’ से रखा गया है।
