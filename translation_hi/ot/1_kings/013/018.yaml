- source_word: כִּחֵשׁ לוֹ
  choice: पर उसने उससे झूठ बोला
  rationale: कथाकार द्वारा उस दावे को झूठ ठहराने वाली सीधी और स्पष्ट अभिव्यक्ति; ‘पर’ निहित विरोध को स्वाभाविक हिन्दी में सामने लाता है।
theological_decisions:
