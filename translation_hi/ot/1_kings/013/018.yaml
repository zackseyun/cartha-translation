  text: And he said to him[a], “I also am a prophet like you, and an angel spoke to me by the word of Yahweh, saying, ‘Bring him back with you to your house, that he may eat bread and drink water.’” But he lied to him.
translation:
  language: hi
  text: उसने उससे कहा, “मैं भी तुम्हारे समान एक भविष्यद्वक्ता हूँ। एक स्वर्गदूत[a] ने याहवे के वचन के द्वारा मुझसे कहा, ‘उसे अपने साथ अपने घर वापस ले आ, ताकि वह रोटी खाए और पानी पिए।’” पर उसने उससे झूठ बोला।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “दूत।” इब्रानी शब्द का अर्थ “स्वर्गदूत” या “संदेशवाहक” दोनों हो सकता है।
    reason: मूल शब्द מַלְאָךְ की वास्तविक शब्दार्थगत अस्पष्टता सुरक्षित रखने के लिए।
