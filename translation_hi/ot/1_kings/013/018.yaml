- issue: מַלְאָךְ की पहचान
  choice: स्वर्गदूत
  alternative: दूत / संदेशवाहक
  rationale: कथा में याहवे से प्राप्त वचन का दावा अलौकिक दूत की ओर संकेत करता है, पर मूल शब्द की वास्तविक शब्दार्थगत व्यापकता पादटिप्पणी में रखी गई है।
