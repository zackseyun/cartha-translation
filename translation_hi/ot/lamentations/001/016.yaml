id: LAM.1.16
reference: Lamentations 1:16
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: עַל אֵ֣לֶּה אֲנִ֣י בוֹכִיָּ֗ה עֵינִ֤/י עֵינִ/י֙ יֹ֣רְדָה מַּ֔יִם כִּֽי רָחַ֥ק מִמֶּ֛/נִּי מְנַחֵ֖ם מֵשִׁ֣יב נַפְשִׁ֑/י הָי֤וּ בָנַ/י֙ שֽׁוֹמֵמִ֔ים כִּ֥י גָבַ֖ר אוֹיֵֽב־׀׀־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/001/016.yaml
  text: For these things I am weeping; my eye[a], my eye runs down with water, because the comforter who restores my soul is far from me. My children have become desolate, because the enemy has prevailed.
translation:
  language: hi
  text: इन बातों के कारण मैं रो रही हूँ; मेरी आँख[a], मेरी आँख से पानी बह रहा है, क्योंकि मुझे सांत्वना देनेवाला और मेरे जीवन को पुनःस्थापित करनेवाला मुझसे दूर है। मेरे बच्चे उजड़ गए हैं, क्योंकि शत्रु प्रबल हो गया है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में एकवचन ‘मेरी आँख’ को भावपूर्ण बल देने के लिए दोहराया गया है। कुछ अनुवाद इसे ‘मेरी आँखें’ करते हैं।
    reason: poetic_form
lexical_decisions:
- source_word: עַל אֵלֶּה
  choice: इन बातों के कारण
  rationale: यह पदबंध विलाप के कारण अथवा विषय को सूचित करता है; हिन्दी में यह अभिव्यक्ति स्वाभाविक रूप से कारण का भाव देती है।
- source_word: בוֹכִיָּה
  choice: मैं रो रही हूँ
  rationale: स्त्रीलिंग कृदन्त सिय्योन/यरूशलेम के मानवीकरण और निरंतर चल रहे विलाप—दोनों को प्रकट करता है।
- source_word: עֵינִי עֵינִי
  choice: मेरी आँख, मेरी आँख
  rationale: इब्रानी के एकवचन और उसकी भावपूर्ण पुनरावृत्ति को सुरक्षित रखा गया है; इसे बहुवचन करने से मूल काव्यात्मक बल घट जाता।
- source_word: יֹרְדָה מַּיִם
  choice: से पानी बह रहा है
  rationale: मूल में ‘पानी’ है, न कि स्पष्ट रूप से ‘आँसू’; हिन्दी में आँख से पानी बहना बोधगम्य है और मूल बिंब को बनाए रखता है।
- source_word: מְנַחֵם
  choice: मुझे सांत्वना देनेवाला
  rationale: संज्ञा के रूप में प्रयुक्त कृदन्त को स्वाभाविक हिन्दी में प्रस्तुत किया गया है और व्यक्तिगत संबंध स्पष्ट रखा गया है।
- source_word: מֵשִׁיב נַפְשִׁי
  choice: जो मेरे प्राण को फिर से सँभाले
  rationale: נֶפֶשׁ यहाँ जीवन, स्वयं अथवा प्राण का संकेत दे सकता है। ‘प्राण को फिर से सँभाले’ विपत्ति में पुनर्जीवन और आंतरिक संभाल—दोनों भावों को बिना अत्यधिक दार्शनिक निर्धारण के व्यक्त करता है।
- source_word: רָחַק מִמֶּנִּי
  choice: मुझसे दूर है
  rationale: यह सांत्वना देनेवाले की वर्तमान दूरी और अनुपस्थिति को सीधे व्यक्त करता है।
- source_word: בָנַי
  choice: मेरे बच्चे
  rationale: शाब्दिक अर्थ ‘मेरे पुत्र’ हो सकता है, पर मानवीकृत सिय्योन के संदर्भ में यह उसके निवासियों/संतानों का सामूहिक उल्लेख है।
- source_word: שׁוֹמֵמִים
  choice: उजड़ गए हैं
  rationale: यह विनाश के फलस्वरूप आई उजड़ी और असहाय दशा को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: גָבַר אוֹיֵב
  choice: शत्रु प्रबल हो गया है
  rationale: גבר में बलवान होने और प्रभावी रूप से हावी हो जाने का भाव है; यह अनुवाद उस अर्थ को मूल के निकट रखता है।
theological_decisions:
- issue: נַפְשִׁי का मानवीय स्वरूप-संबंधी अर्थ
  choice: मेरे प्राण को फिर से सँभाले
  alternative: मेरे जीवन को बहाल करे; मेरी आत्मा को लौटा दे
  rationale: נֶפֶשׁ का अर्थ संदर्भानुसार जीवन, स्वयं, प्राण या आत्मा हो सकता है। ‘प्राण’ मूल की व्यापकता को अपेक्षाकृत सुरक्षित रखता है, और ‘सँभाले’ विलाप में सांत्वना तथा पुनर्स्थापन के भाव को व्यक्त करता है, बिना शरीर-आत्मा संबंध पर कोई संप्रदायगत निष्कर्ष थोपे।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सहज हिन्दी। मानवीकृत यरूशलेम की स्त्रीलिंग वाणी के कारण ‘रो रही हूँ’ रखा गया है। काव्यात्मक पुनरावृत्ति और ‘पानी’ के मूल बिंब को सुरक्षित रखा गया है।
