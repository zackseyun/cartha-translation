id: LAM.1.1
reference: Lamentations 1:1
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: אֵיכָ֣ה יָשְׁבָ֣ה בָדָ֗ד הָ/עִיר֙ רַבָּ֣תִי עָ֔ם הָיְתָ֖ה כְּ/אַלְמָנָ֑ה רַּבָּ֣תִי בַ/גּוֹיִ֗ם שָׂרָ֨תִי֙ בַּ/מְּדִינ֔וֹת הָיְתָ֖ה לָ/מַֽס׀׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/001/001.yaml
  text: How she sits alone[a], the city once full of people! She has become like a widow, she who was great among the nations, a princess among the provinces; she has become subject to forced labor.
translation:
  language: hi
  text: कैसे अकेली बैठी है वह नगरी, जो कभी लोगों से भरी थी! वह विधवा के समान हो गई है—जो राष्ट्रों में महान और प्रदेशों में राजकुमारी थी, वह बेगार के अधीन हो गई है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “कर देने के अधीन हो गई है।” इब्रानी शब्द מַס का अर्थ विजेता द्वारा लगाया गया कर अथवा बेगार, दोनों हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵיכָה
  choice: हाय! कैसी
  rationale: यह सूचना माँगने वाला प्रश्न नहीं, बल्कि शोक और विस्मय का उद्गार है। ‘हाय! कैसी’ हिन्दी में विलाप की तीव्रता और ‘कैसे’ की आलंकारिक शक्ति दोनों व्यक्त करता है।
- source_word: יָשְׁבָה בָדָד
  choice: अकेली बैठी है
  rationale: पूर्ण क्रिया यहाँ वर्तमान उजड़ी दशा का सजीव चित्र देती है; ‘बैठी है’ और ‘अकेली’ मूल बिंब को स्वाभाविक हिन्दी में बनाए रखते हैं।
- source_word: הָעִיר
  choice: वह नगरी
  rationale: मूल में केवल ‘नगर/नगरी’ है, यरूशलेम नाम नहीं। स्त्रीलिंग मानवीकरण के कारण ‘नगरी’ आगे के स्त्रीलिंग बिंबों से सहज मेल खाता है।
- source_word: רַבָּתִי עָם
  choice: जो कभी लोगों से भरी थी
  rationale: शाब्दिक भाव ‘लोगों में बहुत/लोगों से भरपूर’ है। ‘कभी’ वर्तमान अकेलेपन और पूर्व जनबहुलता का निहित विरोध स्पष्ट करता है।
- source_word: כְּאַלְמָנָה
  choice: विधवा के समान
  rationale: כְּ तुलना दर्शाता है; इसलिए इसे सीधे ‘विधवा हो गई’ न कहकर उपमा के रूप में रखा गया है।
- source_word: רַבָּתִי בַגּוֹיִם
  choice: राष्ट्रों में महान
  rationale: यह राष्ट्रों के बीच उसकी पूर्व प्रतिष्ठा और महत्ता को सीधे बनाए रखता है।
- source_word: שָׂרָתִי בַּמְּדִינוֹת
  choice: प्रदेशों में राजकुमारी
  rationale: שָׂרָה स्त्री शासकीय अथवा राजसी पद का संकेत देता है; ‘राजकुमारी’ पद्य के मानवीकरण और ऊँची प्रतिष्ठा को सुरक्षित रखता है। מְדִינוֹת के लिए ‘प्रदेश’ आधुनिक और सुबोध प्रशासनिक शब्द है।
- source_word: לָמַס
  choice: बेगार करने को विवश
  rationale: מַס अनिवार्य श्रम अथवा विजेता द्वारा लगाए गए कर, दोनों का अर्थ दे सकता है। मुख्य पाठ में जबरन श्रम का अर्थ चुना गया है; ‘बेगार’ इस बाध्यकारी श्रम को संक्षेप और स्पष्टता से व्यक्त करता है।
