- from: हाय! कैसी अकेली बैठी है वह नगरी, जो कभी लोगों से भरी थी! वह विधवा के समान हो गई है। जो राष्ट्रों में महान और प्रदेशों में राजकुमारी थी, वह बेगार करने को विवश हो गई है।[a]
  to: कैसे अकेली बैठी है वह नगरी, जो कभी लोगों से भरी थी! वह विधवा के समान हो गई है—जो राष्ट्रों में महान और प्रदेशों में राजकुमारी थी, वह बेगार के अधीन हो गई है।[a]
  rationale: The revision preserves every element of the Hebrew and the English audit trail while making the lament idiomatic in modern literary Hindi. It keeps the widow expression explicitly comparative, retains the feminine civic personification, and renders the final reversal as subjection to compulsory labor. The footnote preserves the unresolved alternative of imposed tribute.
