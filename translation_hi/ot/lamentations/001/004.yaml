source:
  edition: WLC
  text: דַּרְכֵ֨י צִיּ֜וֹן אֲבֵל֗וֹת מִ/בְּלִי֙ בָּאֵ֣י מוֹעֵ֔ד כָּל שְׁעָרֶ֨י/הָ֙ שֽׁוֹמֵמִ֔ין כֹּהֲנֶ֖י/הָ נֶאֱנָחִ֑ים בְּתוּלֹתֶ֥י/הָ נּוּג֖וֹת וְ/הִ֥יא מַר לָֽ/הּ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/001/004.yaml
  text: The roads of Zion mourn[a], because no one comes to the appointed feast; all her gates are desolate, her priests groan, her virgins grieve[b], and she herself is bitter.
translation:
  language: hi
  text: 'सिय्योन की सड़कें शोक मनाती हैं,

    क्योंकि नियत पर्व पर कोई नहीं आता;

    उसके सब फाटक उजाड़ पड़े हैं,

    उसके याजक कराहते हैं,

    उसकी युवतियाँ[a] शोक में हैं,

    और वह स्वयं कटु दुःख में है।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘उसकी कुँवारियाँ।’
    reason: lexical_alternative
lexical_decisions:
- source_word: דַּרְכֵי צִיּוֹן
  choice: सिय्योन की सड़कें
  rationale: बहुवचन דְּרָכִים यहाँ उन वास्तविक मार्गों की ओर संकेत करता है जिनसे उपासक सिय्योन आते थे; ‘सड़कें’ काव्यात्मक मानवीकरण को भी बनाए रखता है।
- source_word: אֲבֵלוֹת
  choice: शोक मनाती हैं
  rationale: स्त्रीलिंग बहुवचन रूप सड़कों को शोकाकुल बताता है; यह चयन मानवीकरण और विलाप के स्वर को स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: מִבְּלִי בָּאֵי מוֹעֵד
  choice: क्योंकि नियत पर्व में कोई नहीं आता
  rationale: מִבְּלִי अभाव का कारण व्यक्त करता है, בָּאֵי आने वालों को, और מוֹעֵד इस मंदिर-संबंधी प्रसंग में नियत पर्व अथवा पर्व-सभा को सूचित करता है।
- source_word: כָּל שְׁעָרֶיהָ שׁוֹמֵמִין
  choice: उसके सब फाटक उजाड़ पड़े हैं
  rationale: ‘उजाड़ पड़े हैं’ שׁוֹמֵמִין में निहित वीरानी, खालीपन और विनाश को सहज तथा गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: כֹּהֲנֶיהָ נֶאֱנָחִים
  choice: उसके याजक कराहते हैं
  rationale: נֶאֱנָחִים गहरी व्यथा की आह या कराह को दर्शाता है; ‘कराहते हैं’ विलाप की तीव्रता को बनाए रखता है।
- source_word: בְּתוּלֹתֶיהָ נּוּגוֹת
  choice: उसकी युवतियाँ शोक में हैं
  rationale: בְּתוּלוֹת विवाह-योग्य युवतियों अथवा कुँवारियों के लिए प्रयुक्त हो सकता है। मुख्य पाठ में ‘युवतियाँ’ स्वाभाविक आधुनिक हिन्दी है, जबकि अधिक शाब्दिक विकल्प पादटिप्पणी में रखा गया है।
- source_word: וְהִיא מַר לָהּ
  choice: और वह स्वयं कटु पीड़ा में है
  rationale: וְהִיא का बल ‘वह स्वयं’ से सुरक्षित रहता है। מַר לָהּ केवल स्वभावगत ‘कड़वाहट’ नहीं, बल्कि उसके लिए अत्यंत कटु और दुःखद दशा व्यक्त करता है; ‘कटु पीड़ा’ इस भाव को स्पष्ट किंतु संक्षिप्त रखता है।
theological_decisions:
- issue: स्त्रीलिंग प्रत्ययों और सर्वनाम का संदर्भ तथा सिय्योन का मानवीकरण
  choice: सिय्योन को एक स्त्री के रूप में मानवीकृत रखते हुए ‘उसके’ और ‘वह स्वयं’ का प्रयोग किया गया है।
  alternative: नगर के लिए निर्जीव ‘उसका/वह’ को केवल व्याकरणिक संदर्भ मानना या पाठ को अधिक निरपेक्ष बनाना।
  rationale: इब्रानी पाठ पूरे पद में स्त्रीलिंग रूपों के द्वारा सिय्योन को शोक करती स्त्री के रूप में प्रस्तुत करता है। यह मानवीकरण अध्याय की काव्यात्मक और धर्मवैचारिक संरचना के लिए महत्वपूर्ण है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, काव्यात्मक किंतु सामान्य पाठक के लिए सुबोध रखी गई है। पंक्ति-विन्यास इब्रानी विलाप की समानांतर संरचना उभारता है। ‘नियत पर्व’ מוֹעֵד की नियुक्त धार्मिक सभा/पर्व की धारणा को संक्षेप में व्यक्त करता है; ‘कटु पीड़ा’ अन्तिम इब्रानी मुहावरे को हिन्दी में अस्वाभाविक शब्दशः रूप देने से बचाता है।
