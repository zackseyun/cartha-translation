id: LAM.1.22
reference: Lamentations 1:22
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: תָּבֹ֨א כָל רָעָתָ֤/ם לְ/פָנֶ֨י/ךָ֙ וְ/עוֹלֵ֣ל לָ֔/מוֹ כַּ/אֲשֶׁ֥ר עוֹלַ֛לְתָּ לִ֖/י עַ֣ל כָּל פְּשָׁעָ֑/י כִּֽי רַבּ֥וֹת אַנְחֹתַ֖/י וְ/לִבִּ֥/י דַוָּֽי־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/001/022.yaml
  text: Let all their evil come before you[a], and deal with them as you have dealt with me because of all my transgressions; for my groans are many[c][b], and my heart is sick.
translation:
  language: hi
  text: उनकी सारी बुराई तेरे सामने आए[a], और तू उनके साथ वैसा ही कर[b] जैसा तूने मेरे सारे अपराधों के कारण मेरे साथ किया है; क्योंकि मेरी आहें बहुत हैं[c], और मेरा हृदय बीमार है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘उनकी सारी दुष्टता’; इस शब्द का अर्थ कुछ संदर्भों में ‘विपत्ति’ भी हो सकता है, पर यहाँ संभवतः दोषपूर्ण नैतिक बुराई अभिप्रेत है।
    reason: lexical_alternative
  - marker: b
    text: या ‘तू उनके साथ वैसा ही व्यवहार कर जैसा तूने मेरे साथ किया है।’ इब्रानी में दोनों खंडों में एक ही क्रिया दोहराई गई है।
    reason: lexical_alternative
  - marker: c
    text: या ‘मेरी कराहें बहुत हैं।’
    reason: lexical_alternative
lexical_decisions:
- source_word: תָּבֹא
  choice: आए
  rationale: प्रार्थना के संदर्भ में अपूर्ण क्रिया का इच्छासूचक बल है; ‘आए’ आधुनिक हिन्दी में याचना को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: רָעָתָם
  choice: उनकी सारी बुराई
  rationale: רָעָה नैतिक बुराई या विपत्ति दोनों बता सकता है; अपराधों के कारण सिय्योन पर हुए न्याय से समानांतरता यहाँ उनकी दोषपूर्ण बुराई की ओर संकेत करती है।
- source_word: לְפָנֶיךָ
  choice: तेरे सामने
  rationale: यह परमेश्वर की दृष्टि या न्यायिक उपस्थिति में आने का सामान्य इब्रानी मुहावरा है।
- source_word: וְעוֹלֵל לָמוֹ ... כַּאֲשֶׁר עוֹלַלְתָּ לִי
  choice: तू उनके साथ वैसा ही कर ... जैसा ... मेरे साथ किया है
  rationale: दोनों खंडों में עלל की पुनरावृत्ति को ‘कर’ द्वारा बनाए रखा गया है; संदर्भ कठोर न्यायपूर्ण व्यवहार का है, पर अनुवाद मूल से अधिक तीखा नहीं किया गया।
- source_word: עַל כָּל פְּשָׁעָי
  choice: मेरे सारे अपराधों के कारण
  rationale: פשע में विद्रोह अथवा उल्लंघन का भाव है; ‘अपराध’ सामान्य पाठक के लिए स्पष्ट है और नैतिक दोष को व्यक्त करता है।
- source_word: רַבּוֹת אַנְחֹתַי
  choice: मेरी आहें बहुत हैं
  rationale: אַנְחָה शोक से निकली आह या कराह को दर्शाता है; ‘आहें’ स्वाभाविक हिन्दी है और मूल की भावनात्मक तीव्रता बनाए रखता है।
- source_word: לִבִּי דַוָּי
  choice: मेरा हृदय रोगी है
  rationale: דַוָּי बीमारी, दुर्बलता या पीड़ा का बोध देता है; यह चयन भीतरी रोग के रूपक को सुरक्षित रखता है।
theological_decisions:
- issue: शत्रुओं पर माँगे गए न्याय का स्वरूप
  choice: इसे ऐसी प्रार्थना के रूप में रखा गया है जिसमें परमेश्वर से उनकी बुराई पर ध्यान देकर उनके साथ वैसा ही करने की याचना है जैसा उसने सिय्योन के साथ उसके अपराधों के कारण किया।
  alternative: इसे अधिक स्पष्ट प्रतिशोध की माँग या केवल उनकी बुराई पर ध्यान देने की नरम याचना बनाया जा सकता था।
  rationale: इब्रानी पाठ न्याय के लिए तीखी अपील करता है, पर दंड का स्वरूप अलग से निर्धारित नहीं करता; इसलिए अनुवाद न तो भाव को तीव्र करता है, न नरम।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, प्रार्थनात्मक स्वर रखा गया है। विलापगीत में यरूशलेम के व्यक्तिकृत वक्ता के प्रत्यक्ष संबोधन के अनुरूप परमेश्वर के लिए एकवचन निकट संबोधन ‘तू/तेरे’ प्रयुक्त है। ‘हृदय रोगी है’ जानबूझकर कुछ असामान्य रखा गया है ताकि मूल का आंतरिक बीमारी वाला रूपक नष्ट न हो।
