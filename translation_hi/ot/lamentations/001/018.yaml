id: LAM.1.18
reference: Lamentations 1:18
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: צַדִּ֥יק ה֛וּא יְהוָ֖ה כִּ֣י פִ֣י/הוּ מָרִ֑יתִי שִׁמְעוּ נָ֣א כָל עמים וּ/רְאוּ֙ מַכְאֹבִ֔/י בְּתוּלֹתַ֥/י וּ/בַחוּרַ֖/י הָלְכ֥וּ בַ/שֶּֽׁבִי־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/001/018.yaml
  text: 'Yahweh is righteous[a], for I have rebelled against his word. Hear, please, all peoples[b], and see my pain: my virgins and my young men have gone into captivity.'
translation:
  language: hi
  text: 'याहवे धर्मी है, क्योंकि मैंने उसके वचन[a] के विरुद्ध विद्रोह किया है। हे सभी जातियो, मेरी सुनो और मेरी पीड़ा देखो: मेरी युवतियाँ[b] और मेरे जवान पुरुष बंधुआई में चले गए हैं।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक: “उसके मुँह”; अर्थात उसके बोले हुए वचन या आदेश।'
    reason: lexical_alternative
  - marker: b
    text: या “मेरी कुमारियाँ।”
    reason: lexical_alternative
lexical_decisions:
- source_word: צַדִּיק
  choice: धर्मी
  rationale: यह न्याय करते समय याहवे की नैतिक धार्मिकता और सत्यनिष्ठा को व्यक्त करता है; ‘न्यायी’ की अपेक्षा ‘धर्मी’ व्यापक धर्मवैज्ञानिक अर्थ बनाए रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय देवनागरी में लिप्यंतरित किया गया है।
- source_word: פִיהוּ
  choice: उसके वचन
  rationale: शाब्दिक अर्थ ‘उसके मुँह’ है, पर यहाँ यह उसके बोले हुए वचन या आदेश का लक्षणालंकार है; स्वाभाविक हिन्दी में ‘वचन’ उस आशय को स्पष्ट रखता है।
- source_word: מָרִיתִי
  choice: मैंने ... के विरुद्ध विद्रोह किया है
  rationale: क्रिया अधिकार के विरुद्ध अवज्ञापूर्ण विद्रोह या प्रतिरोध दर्शाती है; यह अनुवाद उसके नैतिक बल को बनाए रखता है।
- source_word: שִׁמְעוּ נָא
  choice: मेरी सुनो
  rationale: नָא विनती का भाव देता है। हिन्दी में सम्बोधन और ‘मेरी सुनो’ मिलकर आदेश तथा करुण पुकार दोनों को स्वाभाविक रूप से व्यक्त करते हैं।
- source_word: כָל עמים
  choice: हे सब जातियो
  rationale: עמים अनेक जनसमूहों या जातियों को सूचित करता है; सम्बोधन रूप मूल की सार्वजनीन पुकार को स्पष्ट करता है।
- source_word: מַכְאֹבִי
  choice: मेरी पीड़ा
  rationale: संज्ञा शारीरिक अथवा भावनात्मक दर्द और दुःख को व्यक्त कर सकती है; ‘पीड़ा’ इस व्यापकता को बनाए रखती है।
- source_word: בְּתוּלֹתַי
  choice: मेरी युवतियाँ
  rationale: शब्द विवाह-योग्य युवा स्त्रियों या कुमारियों के लिए प्रयुक्त हो सकता है। आधुनिक हिन्दी में ‘युवतियाँ’ प्रसंगानुकूल और सहज है, जबकि अधिक शाब्दिक विकल्प पाद-टिप्पणी में दिया गया है।
- source_word: וּבַחוּרַי
  choice: मेरे जवान
  rationale: समानांतर पद में युवा पुरुष अभिप्रेत हैं; ‘जवान’ संक्षिप्त, स्वाभाविक और काव्यात्मक है।
- source_word: הָלְכוּ בַשֶּׁבִי
  choice: बँधुआई में चले गए हैं
  rationale: הָלְכוּ साधारणतः ‘चले गए’ है, जबकि בַשֶּׁבִי उनकी बँधुआई की दशा बताता है; अनुवाद अनावश्यक रूप से कारक अर्थ नहीं जोड़ता।
theological_decisions:
- issue: याहवे के न्याय की धार्मिकता और यरूशलेम का अपराध-स्वीकार
  choice: याहवे धर्मी है, क्योंकि मैंने उसके वचन के विरुद्ध विद्रोह किया है
  alternative: याहवे न्यायी है, क्योंकि मैंने उसके आदेश की अवज्ञा की है
  rationale: मुख्य पाठ צַדִּיק और מרה के धर्मवैज्ञानिक तथा नैतिक बल को बनाए रखता है और दण्ड को मनमाना न बताकर वक्ता के विद्रोह से जोड़ता है।
- issue: פִיהוּ का लक्षणालंकार
  choice: उसके वचन
  alternative: उसके मुँह
  rationale: मूल की शाब्दिक छवि ‘उसका मुँह’ है, पर आशय उसके बोले हुए वचन या आदेश से है। सहज हिन्दी के लिए अर्थानुकूल रूप मुख्य पाठ में रखा गया है, बिना किसी विशिष्ट साम्प्रदायिक व्याख्या के।
- issue: नगर का एकवचन स्त्री-वक्ता होना
  choice: प्रथम पुरुष की स्त्रीगत सामूहिक आवाज़ को प्रसंग से व्यक्त होने देना
  alternative: ‘मैं, यरूशलेम’ जोड़ना
  rationale: इब्रानी पद में नगर का नाम जोड़ा नहीं गया है; इसलिए अस्पष्टता और काव्यात्मक व्यक्तिकरण को बनाए रखते हुए कोई व्याख्यात्मक कर्ता नहीं जोड़ा गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और विलाप-काव्य के अनुकूल रखी गई है। ‘हे सब जातियो’ सार्वजनिक करुण पुकार को और विस्मयादिबोधक चिह्न उसकी तीव्रता को व्यक्त करता है। ‘बँधुआई’ बाइबलीय-साहित्यिक शब्द है, पर सामान्य हिन्दी पाठक के लिए अभी भी समझने योग्य है।
