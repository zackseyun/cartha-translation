base_translation:
  language: en
  yaml_path: translation/ot/lamentations/001/006.yaml
  text: From daughter Zion all her splendor has departed[a]; her princes have become like deer that find no pasture[b]; they went without strength before the pursuer.
translation:
  language: hi
  text: सिय्योन-कन्या से उसका सारा वैभव चला गया[a]। उसके शासक उन हिरनों के समान हो गए जिन्हें चरागाह नहीं मिला[b]। वे शक्तिहीन होकर पीछा करनेवाले के आगे चले गए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “सिय्योन-कन्या से उसकी सारी शोभा निकल गई”; या, “सिय्योन-कन्या से उसकी सारी गरिमा चली गई।”
    reason: lexical_alternative
  - marker: b
    text: या, “उन नर हिरनों के समान जिन्हें चरागाह नहीं मिला।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא מִן בַּת־צִיּוֹן
  choice: बेटी सिय्योन से ... जाता रहा
  rationale: यह अभिव्यक्ति सिय्योन नगर के स्त्री-रूपक को बनाए रखती है। וַיֵּצֵא का मूल अर्थ ‘निकल गया’ है, पर वैभव के खो जाने के संदर्भ में ‘जाता रहा’ स्वाभाविक हिन्दी है और מִן के स्रोत-बोध को भी बनाए रखता है।
- source_word: כָּל הֲדָרָהּ
  choice: उसका सारा वैभव
  rationale: הָדָר में शोभा, गरिमा और राजसी भव्यता के अर्थ शामिल हैं। ‘वैभव’ इस व्यापक अर्थ को संक्षेप और काव्यात्मक ढंग से व्यक्त करता है।
- source_word: שָׂרֶיהָ
  choice: उसके हाकिम
  rationale: שַׂר शासक, प्रधान, राजपुरुष या अधिकारी को सूचित कर सकता है। ‘हाकिम’ नगर के सत्ताधारी अगुओं को स्वाभाविक हिन्दी में व्यक्त करता है और वंशगत राजकुमार होने का अनावश्यक निष्कर्ष नहीं जोड़ता।
- source_word: כְּאַיָּלִים
  choice: उन हिरनों जैसे
  rationale: אַיָּל प्रायः नर हिरन को दर्शाता है, पर सामूहिक उपमा में हिन्दी का ‘हिरन’ अधिक स्वाभाविक है; नर होने की अधिक विशिष्ट सम्भावना पादटिप्पणी में दी गई है।
- source_word: לֹא מָצְאוּ מִרְעֶה
  choice: जिन्हें चरागाह नहीं मिला
  rationale: מִרְעֶה पशुओं के चरने की जगह या चरागाह है। पूर्ण भूतकाल ‘नहीं मिला’ हिब्रू क्रिया के रूप को बनाए रखता है।
- source_word: וַיֵּלְכוּ בְלֹא־כֹחַ
  choice: वे शक्तिहीन होकर ... चलते गए
  rationale: הלך का सामान्य अर्थ जाना या चलना है; ‘चलते गए’ निरन्तर विवश गति का चित्र देता है, जबकि ‘शक्तिहीन होकर’ בְלֹא־כֹחַ की शारीरिक निर्बलता को सहज हिन्दी में व्यक्त करता है।
- source_word: לִפְנֵי רוֹדֵף
  choice: पीछा करनेवाले के आगे
  rationale: לִפְנֵי यहाँ पीछा करनेवाले से आगे धकेले जाने का स्थानिक चित्र देता है। एकवचन कृदन्त को ‘पीछा करनेवाले’ के रूप में रखा गया है, बिना उसे अनिवार्यतः एक ही व्यक्ति मानने के।
