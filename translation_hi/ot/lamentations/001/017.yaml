id: LAM.1.17
reference: Lamentations 1:17
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: פֵּֽרְשָׂ֨ה צִיּ֜וֹן בְּ/יָדֶ֗י/הָ אֵ֤ין מְנַחֵם֙ לָ֔/הּ צִוָּ֧ה יְהוָ֛ה לְ/יַעֲקֹ֖ב סְבִיבָ֣י/ו צָרָ֑י/ו הָיְתָ֧ה יְרוּשָׁלִַ֛ם לְ/נִדָּ֖ה בֵּינֵי/הֶֽם׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/001/017.yaml
  text: Zion has spread out her hands; there is no one to comfort her[a]. Yahweh has commanded concerning Jacob that his enemies surround him; Jerusalem has become an unclean thing among them.
translation:
  language: hi
  text: सिय्योन ने अपने हाथ फैलाए हैं; उसे सांत्वना देनेवाला कोई नहीं। याहवे ने याकूब के विषय में आज्ञा दी है कि उसके शत्रु उसे चारों ओर से घेर लें। यरूशलेम उनके बीच अशुद्ध वस्तु[a] हो गई है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या अधिक विशिष्ट रूप से, “मासिक धर्म वाली स्त्री के समान” अथवा “मासिक धर्म की अशुद्धता के समान”; हिब्रू शब्द अनुष्ठानिक अशुद्धता का बिंब लिए हुए है।
    reason: lexical_alternative
lexical_decisions:
- source_word: פֵּרְשָׂה צִיּוֹן בְּיָדֶיהָ
  choice: सिय्योन ने अपने हाथ फैलाए हैं
  rationale: प्रसारित या आगे बढ़ाए हुए हाथों के संकेत को सुरक्षित रखता है, पर इसे विशेष रूप से प्रार्थना कहकर मूल से अधिक अर्थ नहीं जोड़ता।
- source_word: אֵין מְנַחֵם לָהּ
  choice: उसे सांत्वना देनेवाला कोई नहीं
  rationale: हिब्रू के अस्तित्ववाचक वाक्य-विन्यास और विलापगीत में बार-बार आनेवाले सांत्वना के भाव को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: मूल पाठ में आए परमेश्वर के विशिष्ट वाचा-नाम को लिप्यंतरित रूप में प्रस्तुत करता है।
- source_word: לְיַעֲקֹב
  choice: याकूब के विषय में
  rationale: לְ उपसर्ग की यहाँ व्यापक संदर्भसूचक भूमिका को बनाए रखता है और बिना आवश्यकता इसे केवल ‘याकूब के विरुद्ध’ नहीं बनाता।
- source_word: סְבִיבָיו צָרָיו
  choice: उसके शत्रु उसे चारों ओर से घेर लें
  rationale: हिब्रू के संक्षिप्त ‘उसके चारों ओर उसके शत्रु’ को आज्ञा के पूरक के रूप में स्वाभाविक हिन्दी देता है और शत्रुतापूर्ण घेराव का भाव स्पष्ट रखता है।
- source_word: הָיְתָה יְרוּשָׁלִַם לְנִדָּה
  choice: यरूशलेम ... अशुद्ध वस्तु हो गई है
  rationale: הָיְתָה के परिणामस्वरूप बनी दशा को ‘हो गई है’ से और נִדָּה के अनुष्ठानिक अशुद्धता तथा विकर्षण के भाव को सुलभ भाषा में व्यक्त करता है; अधिक विशिष्ट मासिक धर्म-संबंधी बिंब पादटिप्पणी में सुरक्षित है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल में चतुरक्षरीय वाचा-नाम सीधे प्रयुक्त है; लिप्यंतरण उस विशिष्ट नाम को सामान्य उपाधि में बदलने से बचाता है।
- issue: נִדָּה के बिंब की विशिष्टता
  choice: अशुद्ध वस्तु
  alternative: मासिक धर्म वाली स्त्री; मासिक धर्म की अशुद्धता
  rationale: संदर्भ में यरूशलेम की अनुष्ठानिक अशुद्धता और सामाजिक तिरस्कार मुख्य प्रभाव हैं। मुख्य पाठ सहज रखा गया है, जबकि मूल पद की अधिक विशिष्ट शारीरिक-अनुष्ठानिक छवि पादटिप्पणी में दी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और काव्यात्मक गद्य रखा गया है। व्यक्तिनामों के प्रचलित बाइबलीय हिन्दी रूप लिए गए हैं; ईश्वरीय नाम को ‘याहवे’ रूप में लिप्यंतरित किया गया है।
