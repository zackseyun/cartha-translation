source:
  edition: WLC
  text: זָֽכְרָ֣ה יְרוּשָׁלִַ֗ם יְמֵ֤י עָנְיָ/הּ֙ וּ/מְרוּדֶ֔י/הָ כֹּ֚ל מַחֲמֻדֶ֔י/הָ אֲשֶׁ֥ר הָי֖וּ מִ֣/ימֵי קֶ֑דֶם בִּ/נְפֹ֧ל עַמָּ֣/הּ בְּ/יַד צָ֗ר וְ/אֵ֤ין עוֹזֵר֙ לָ֔/הּ רָא֣וּ/הָ צָרִ֔ים שָׂחֲק֖וּ עַ֥ל מִשְׁבַּתֶּֽ/הָ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/001/007.yaml
  text: Jerusalem remembered in the days of her affliction and her wanderings all her precious things that were from days of old[a]. When her people fell into the hand of the foe, and there was no one to help her, foes saw her[b]; they laughed at her ruin.
translation:
  language: hi
  text: यरूशलेम ने अपने दुःख और भटकने[a] के दिनों में अपनी उन सब बहुमूल्य वस्तुओं को याद किया, जो पुराने दिनों में उसके पास थीं। जब उसके लोग शत्रु के हाथ में पड़ गए और उसकी सहायता करने वाला कोई न था, तब शत्रुओं ने उसे देखा; वे उसकी बरबादी[b] पर हँसे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “बेघर होना”; यहाँ प्रयुक्त हिब्रू शब्द दुर्लभ है और उसके अर्थ पर मतभेद है।
    reason: lexical_alternative
  - marker: b
    text: या “पतन” अथवा “उजड़ी दशा”; हिब्रू संज्ञा संभवतः यरूशलेम के ढह जाने या उजड़ जाने की दशा बताती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: זָכְרָה
  choice: याद किया
  rationale: यह काल पूर्ण स्त्रीलिंग एकवचन रूप है और मानवीकृत यरूशलेम इसका कर्ता है। विलाप के प्रसंग में भूतकाल स्वाभाविक है।
- source_word: יְמֵי עָנְיָהּ
  choice: अपने दुःख के दिनों में
  rationale: עֳנִי दुःख, दीन दशा या क्लेश को व्यक्त करता है। “दुःख” आधुनिक पाठक के लिए सहज रहते हुए प्रसंग की गंभीरता बनाए रखता है।
- source_word: וּמְרוּדֶיהָ
  choice: और भटकने के
  rationale: यह दुर्लभ और विवादित शब्द संभवतः भटकने या बेघर होने की दशा बताता है। “भटकने” निर्वासन की ठोस छवि को बनाए रखता है; दूसरी संभावना पादटिप्पणी में दी गई है।
- source_word: כֹּל מַחֲמֻדֶיהָ
  choice: अपनी उन सब बहुमूल्य वस्तुओं को
  rationale: यह पद प्रिय, मूल्यवान या वांछनीय वस्तुओं के लिए व्यापक अर्थ रखता है; इसे केवल धन-संपत्ति तक सीमित नहीं किया गया।
- source_word: אֲשֶׁר הָיוּ מִימֵי קֶדֶם
  choice: जो प्राचीन काल से उसकी थीं
  rationale: यह अनुवाद पूर्वकाल से चली आ रही उसकी मूल्यवान वस्तुओं का भाव और काव्यात्मक काल-दृष्टि सुरक्षित रखता है।
- source_word: בִּנְפֹל עַמָּהּ
  choice: जब उसके लोग ... पड़ गए
  rationale: ב के साथ infinitive construct परिस्थिति अथवा समय सूचित करता है; हिन्दी में “जब” इसका स्वाभाविक रूप है।
- source_word: בְּיַד צָר
  choice: शत्रु के हाथ में
  rationale: “हाथ में पड़ना” किसी की सत्ता के अधीन हो जाने का हिब्रू मुहावरा है और हिन्दी में भी स्पष्ट तथा परिचित है।
- source_word: וְאֵין עוֹזֵר לָהּ
  choice: उसकी सहायता करने वाला कोई न था
  rationale: यह यरूशलेम के पूर्णतः असहाय और त्यागे जाने की दशा को सीधे व्यक्त करता है।
- source_word: רָאוּהָ צָרִים
  choice: शत्रुओं ने उसे देखा
  rationale: बहुवचन צָרִים को सीधे “शत्रुओं” कहा गया है और स्त्रीरूप प्रत्यय मानवीकृत नगरी की ओर संकेत करता है।
- source_word: שָׂחֲקוּ
  choice: हँसे
  rationale: क्रिया का मूल चित्र हँसना है, जिसमें यहाँ उपहास का भाव प्रसंग और “पर” से स्पष्ट होता है।
- source_word: עַל מִשְׁבַּתֶּהָ
  choice: उसकी बरबादी पर
  rationale: दुर्लभ संज्ञा नगर की समाप्ति, उजड़ी दशा या पतन का बोध करा सकती है। “बरबादी” विनाश और उजाड़ दशा दोनों को स्वाभाविक हिन्दी में समेटती है।
