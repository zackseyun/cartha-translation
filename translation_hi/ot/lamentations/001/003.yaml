base_translation:
  language: en
  yaml_path: translation/ot/lamentations/001/003.yaml
  text: Judah has gone into exile because of affliction and because of great servitude; she dwells among the nations and finds no rest[a]. All her pursuers have overtaken her in the narrow places.
translation:
  language: hi
  text: दुःख और भारी दासता के कारण यहूदा निर्वासन में चली गई है। वह जातियों के बीच रहती है, पर उसे विश्राम नहीं मिलता। उसके सभी पीछा करनेवालों ने उसे सँकरे स्थानों के बीच जा पकड़ा है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “सँकरे स्थानों के बीच।” हिब्रू पद संकट और चारों ओर से घिर जाने का भाव भी जगा सकता है, मानो यहूदा के बच निकलने का कोई मार्ग न हो।
    reason: lexical_alternative
lexical_decisions:
- source_word: גָּלְתָה
  choice: निर्वासन में चली गई है
  rationale: काल रूप और निर्वासन के केंद्रीय भाव को बनाए रखते हुए, हिब्रू क़ाल क्रिया की स्वाभाविक हिन्दी अभिव्यक्ति।
- source_word: יְהוּדָה
  choice: यहूदा
  rationale: यह मानक नाम है; प्रसंग में देश और प्रजा को स्त्री के रूप में व्यक्त किया गया है।
- source_word: מֵעֹנִי
  choice: दुःख के कारण
  rationale: מִן को समानांतर वाक्यांश के साथ कारणसूचक माना गया है; עֹנִי के व्यापक क्लेश और दीन दशा के भाव को ‘दुःख’ सहज हिन्दी में व्यक्त करता है।
- source_word: וּמֵרֹב עֲבֹדָה
  choice: और कठोर दासता के कारण
  rationale: עֲבֹדָה यहाँ सामान्य काम से अधिक दबावपूर्ण अधीन सेवा को सूचित करता है; ‘कठोर दासता’ उसकी तीव्रता को स्पष्ट रखता है।
- source_word: הִיא יָשְׁבָה בַגּוֹיִם
  choice: वह अन्यजातियों के बीच रहती है
  rationale: יָשַׁב का यहाँ अर्थ रहना/बसना है; ‘अन्यजातियाँ’ विदेशी राष्ट्रों और लोगों के बीच विस्थापित जीवन को व्यक्त करता है।
- source_word: לֹא מָצְאָה מָנוֹחַ
  choice: उसे विश्राम नहीं मिलता
  rationale: מָנוֹחַ के शारीरिक और अस्तित्वगत विश्राम—दोनों भावों को सहज और संक्षिप्त रूप में रखता है।
- source_word: כָּל רֹדְפֶיהָ
  choice: उसके सभी पीछा करनेवाले
  rationale: רדף के ठोस पीछा करने के बिंब को बनाए रखा गया है, बिना इसे अधिक व्याख्यात्मक ‘सतानेवाले’ बनाने के।
- source_word: הִשִּׂיגוּהָ
  choice: उसे जा पकड़ा है
  rationale: हिफ़िल रूप के ‘पीछा करके पकड़ लेना/जा पहुँचना’ अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: בֵּין הַמְּצָרִים
  choice: सँकरे मार्गों में
  rationale: स्थानगत बिंब को मुख्य पाठ में बनाए रखता है; घिर जाने और संकट के संभावित व्यंजित भाव को पादटिप्पणी में बताया गया है।
