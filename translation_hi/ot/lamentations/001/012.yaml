id: LAM.1.12
reference: Lamentations 1:12
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: ל֣וֹא אֲלֵי/כֶם֮ כָּל עֹ֣בְרֵי דֶרֶךְ֒ הַבִּ֣יטוּ וּ/רְא֗וּ אִם יֵ֤שׁ מַכְאוֹב֙ כְּ/מַכְאֹבִ֔/י אֲשֶׁ֥ר עוֹלַ֖ל לִ֑/י אֲשֶׁר֙ הוֹגָ֣ה יְהוָ֔ה בְּ/י֖וֹם חֲר֥וֹן אַפּֽ/וֹ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/001/012.yaml
  text: Is it nothing to you[a], all you who pass by on the road? Look and see whether there is any sorrow like my sorrow, which was dealt to me[b], with which Yahweh afflicted me in the day of his fierce anger.
translation:
  language: hi
  text: क्या तुम्हें कुछ भी परवाह नहीं, हे मार्ग से गुजरने वाले सभी लोगो?[a] ध्यान दो और देखो कि क्या मेरे दुःख जैसा कोई दुःख है—वह दुःख जो मुझ पर ढाया गया,[b] जिससे याहवे ने अपने प्रचंड क्रोध के दिन मुझे पीड़ित किया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “क्या यह तुम्हारे लिए कुछ भी नहीं है, हे मार्ग से गुजरने वाले सभी लोगो?” इब्रानी आरम्भ संक्षिप्त है; शाब्दिक रूप से, “तुम्हारे लिए नहीं।” यह ध्यान या सहानुभूति की अपील हो सकती है।
    reason: lexical_alternative
  - marker: b
    text: 'यहाँ दो बार आए इब्रानी शब्द का अनुवाद “पीड़ा” भी हो सकता है: “क्या मेरी पीड़ा जैसी कोई पीड़ा है—वह पीड़ा जो मुझ पर ढाई गई?”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ל֣וֹא אֲלֵיכֶם
  choice: क्या तुम्हें इससे कुछ लेना-देना नहीं
  rationale: इब्रानी आरम्भ संक्षिप्त और अपूर्ण है—शाब्दिक रूप से ‘तुम्हारी ओर नहीं/तुम्हारे लिए नहीं’। यह अनुवाद राहगीरों से ध्यान और सहानुभूति की मार्मिक अपील को स्वाभाविक हिन्दी में व्यक्त करता है, जबकि प्रश्नात्मक अनिश्चितता को पादटिप्पणी में सुरक्षित रखता है।
- source_word: כָּל עֹבְרֵי דֶרֶךְ
  choice: हे मार्ग से होकर जानेवालो
  rationale: सम्बोधन तथा मार्ग से गुजरने के ठोस बिम्ब, दोनों को बनाए रखता है।
- source_word: הַבִּיטוּ וּרְאוּ
  choice: ध्यान से देखो और जानो
  rationale: दोनों आज्ञार्थक क्रियाओं की क्रमिक तीव्रता रखी गई है; ‘जानो’ यहाँ केवल आँखों से देखने के बजाय निरीक्षण करके पहचानने का भाव देता है।
- source_word: אִם יֵשׁ
  choice: क्या ... कोई ... है
  rationale: आज्ञार्थक क्रियाओं के बाद यह तुलना से जुड़ा परोक्ष प्रश्न है; हिन्दी में प्रत्यक्ष प्रश्न-रूप अधिक स्वाभाविक और प्रभावशाली है।
- source_word: מַכְאוֹב ... כְּמַכְאֹבִי
  choice: दुःख ... मेरे दुःख जैसा
  rationale: מַכְאוֹב में पीड़ा और शोक दोनों समाए हैं। ‘दुःख’ आधुनिक हिन्दी में इस व्यापकता और विलाप के भाव को सहजता से व्यक्त करता है।
- source_word: אֲשֶׁר עוֹלַל לִי
  choice: जो मुझ पर ढाया गया
  rationale: עולל कठोर व्यवहार करने या कष्ट पहुँचाने का अर्थ देता है। कर्मवाच्य रूप पहले उपवाक्य में कर्ता को अनावश्यक रूप से निश्चित नहीं करता और विपत्ति की तीव्रता व्यक्त करता है।
- source_word: אֲשֶׁר הוֹגָה
  choice: जिससे ... मुझे पीड़ित किया
  rationale: יגה के हिफ़ील रूप का अर्थ दुःख देना या पीड़ित करना है। यह अनुवाद कारक भाव और सम्बन्धवाचक रचना को स्पष्ट रखता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिन्दी में प्रचलित प्रतिलेखन ‘यहोवा’ के द्वारा चतुरक्षरीय व्यक्तिगत नाम को उपाधि से प्रतिस्थापित किए बिना प्रस्तुत किया गया है।
- source_word: בְּיוֹם חֲרוֹן אַפּוֹ
  choice: अपने भड़के हुए क्रोध के दिन
  rationale: חֲרוֹן אַף की जलते या प्रचण्ड क्रोध की इब्रानी रूढ़ि का तीव्र भाव स्वाभाविक हिन्दी में रखा गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: मूल पाठ में व्यक्तिगत चतुरक्षरीय नाम है। हिन्दी पाठकों के लिए परिचित ‘यहोवा’ नामत्व को बनाए रखता है और उसे ‘प्रभु’ जैसी उपाधि से नहीं बदलता; ‘याहवे’ सम्भव वैकल्पिक प्रतिलेखन है।
- issue: विपत्ति और यहोवा के कार्य के बीच सम्बन्ध
  choice: पहले उपवाक्य में कर्मवाच्य, फिर स्पष्ट रूप से यहोवा को पीड़ित करनेवाला बताया गया
  alternative: दोनों उपवाक्यों में यहोवा को स्पष्ट कर्ता बनाना
  rationale: אֲשֶׁר עוֹלַל לִי में कर्ता व्याकरणतः व्यक्त नहीं है, जबकि अगला उपवाक्य यहोवा को स्पष्ट रूप से नामित करता है। यह रचना मूल की क्रमिक स्पष्टता और धर्मवैचारिक तनाव बनाए रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण विलाप-शैली रखी गई है। सम्बोधन ‘हे’ काव्यात्मक प्रसंग के अनुकूल है, पर शेष भाषा सहज और वर्तमान है। दोहराव को मूल की भावात्मक शक्ति बनाए रखने के लिए जानबूझकर रखा गया है।
