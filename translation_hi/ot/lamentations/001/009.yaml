reference: Lamentations 1:9
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: טֻמְאָתָ֣/הּ בְּ/שׁוּלֶ֗י/הָ לֹ֤א זָֽכְרָה֙ אַחֲרִיתָ֔/הּ וַ/תֵּ֣רֶד פְּלָאִ֔ים אֵ֥ין מְנַחֵ֖ם לָ֑/הּ רְאֵ֤ה יְהוָה֙ אֶת עָנְיִ֔/י כִּ֥י הִגְדִּ֖יל אוֹיֵֽב־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/001/009.yaml
  text: Her uncleanness was in her skirts[a]; she did not remember her end. So she came down astonishingly; there was no comforter for her. Look, O Yahweh, my affliction[c][b], for the enemy has magnified himself.
translation:
  language: hi
  text: उसकी अशुद्धता उसके वस्त्र के घेर में थी; उसने अपने अन्त का ध्यान नहीं रखा[a]। वह चकित कर देने वाले ढंग से नीचे उतर गई[b]; उसे सांत्वना देने वाला कोई न था। हे याहवे, मेरी दुर्दशा देख, क्योंकि शत्रु ने अपने आप को बड़ा किया है[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘उसने अपने भविष्य का ध्यान नहीं रखा’ अथवा ‘उसने अपने परिणाम पर विचार नहीं किया।’
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, ‘वह चकित कर देने वाले ढंग से नीचे उतरी’; भाव एक असाधारण और स्तब्ध कर देने वाले अवनति का है।
    reason: lexical_alternative
  - marker: c
    text: या, ‘शत्रु ने अपने आप को ऊँचा किया है।’
    reason: lexical_alternative
lexical_decisions:
- source_word: טֻמְאָתָהּ
  choice: उसकी अशुद्धता
  rationale: यह संज्ञा धार्मिक और नैतिक, दोनों प्रकार की अपवित्रता या मलिनता व्यक्त कर सकती है। ‘अशुद्धता’ इस व्यापकता को बिना सीमित किए बनाए रखती है।
- source_word: בְּשׁוּלֶיהָ
  choice: उसके वस्त्र के छोरों पर
  rationale: שׁוּל वस्त्र के निचले किनारों या घेर को दर्शाता है। यह अनुवाद दृश्य बिंब को रखता है और किसी विशेष प्रकार के स्त्री-वस्त्र को अनावश्यक रूप से निर्धारित नहीं करता।
- source_word: לֹא זָכְרָה אַחֲרִיתָהּ
  choice: उसने अपने अन्त को याद नहीं रखा
  rationale: אַחֲרִית का अर्थ अन्त, परिणाम या भविष्य हो सकता है। ‘अन्त’ इब्रानी की संक्षिप्तता और उसके अर्थगत तनाव को सुरक्षित रखता है; अन्य सम्भावनाएँ पादटिप्पणी में दी गई हैं।
- source_word: וַתֵּרֶד פְּלָאִים
  choice: इसलिए उसका पतन चकित कर देने वाला था
  rationale: ירד नीचे उतरने या गिरने का चित्र देता है और פְּלָאִים असाधारण अथवा विस्मयकारी ढंग बताता है। स्वाभाविक हिन्दी में यह पदबंध यरूशलेम के चौंका देने वाले अपमानजनक पतन को व्यक्त करता है।
- source_word: אֵין מְנַחֵם לָהּ
  choice: उसे सांत्वना देने वाला कोई न था
  rationale: निपात और कृदन्त का स्वाभाविक हिन्दी रूप; विलापगीत में बार-बार आने वाले सांत्वना के अभाव को स्पष्ट रखता है।
- source_word: רְאֵה יְהוָה
  choice: हे याहवे, ... देख
  rationale: आज्ञार्थक क्रिया परमेश्वर से ध्यान देने की विनती है। प्रत्यक्ष सम्बोधन में ‘हे’ और व्यक्तिगत नाम ‘याहवे’ स्वाभाविक तथा स्रोत-संगत हैं।
- source_word: עָנְיִי
  choice: मेरी दुर्दशा
  rationale: यह शब्द दुःख, दीन दशा और विपत्ति को समेटता है। ‘दुर्दशा’ प्रसंग में केवल भावनात्मक दुःख की अपेक्षा व्यापक पीड़ा व्यक्त करती है।
- source_word: כִּי הִגְדִּיל אוֹיֵב
  choice: क्योंकि शत्रु ने अपने आपको बड़ा किया है
  rationale: वस्तु के बिना प्रयुक्त हिफ़ील रूप शत्रु के स्वयं को बड़ा करने या ऊँचा उठाने को दर्शाता है। निकटवर्ती हिन्दी अभिव्यक्ति मूल की सम्भावित आत्म-बड़ाई को बनाए रखती है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में परमेश्वर का व्यक्तिगत चतुरक्षरीय नाम है। ‘याहवे’ शीर्षक से बदलने के बजाय उस नाम का प्रचलित विद्वत्तापूर्ण लिप्यन्तरण प्रस्तुत करता है।
- issue: הִגְדִּיל में शत्रु की बड़ाई का स्वरूप
  choice: अपने आपको बड़ा किया है
  alternative: अपने आपको ऊँचा किया है; घमण्ड किया है
  rationale: मूल क्रिया में महान होने, स्वयं को बड़ा दिखाने या ऊँचा उठाने की अर्थ-सम्भावना है। मुख्य पाठ अपेक्षाकृत औपचारिक रूप रखता है और अधिक व्याख्यात्मक विकल्प पादटिप्पणी में देता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध रूप अपनाया गया है। यरूशलेम का स्त्री-रूपक, तीसरे पुरुष से अचानक पहले पुरुष की पुकार, और ‘अन्त/भविष्य/परिणाम’ की वास्तविक अर्थगत व्यापकता सुरक्षित रखी गई है।
