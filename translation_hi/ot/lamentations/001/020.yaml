source:
  edition: WLC
  text: רְאֵ֨ה יְהוָ֤ה כִּֽי צַר לִ/י֙ מֵעַ֣/י חֳמַרְמָ֔רוּ נֶהְפַּ֤ךְ לִבִּ/י֙ בְּ/קִרְבִּ֔/י כִּ֥י מָר֖וֹ מָרִ֑יתִי מִ/ח֥וּץ שִׁכְּלָה חֶ֖רֶב בַּ/בַּ֥יִת כַּ/מָּֽוֶת־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/001/020.yaml
  text: Look[a], O Yahweh, for I am in distress; my inward parts are churning; my heart is overturned within me, because I have been very rebellious[b]. Outside the sword bereaves[c]; inside the house it is like death.
translation:
  language: hi
  text: हे याहवे, देख, क्योंकि मैं संकट में हूँ! मेरे भीतर के अंग मरोड़ खा रहे हैं[a]; मेरा हृदय मेरे भीतर उलट गया है, क्योंकि मैंने घोर विद्रोह किया है[b]। बाहर तलवार शोक में डाल देती है; घर के भीतर मानो मृत्यु है[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से ‘मेरे भीतर के अंग’; यह गहरी भीतरी पीड़ा का देहगत इब्रानी मुहावरा है।
    reason: cultural_note
  - marker: b
    text: इब्रानी में ‘विद्रोह करना’ क्रिया को उसी मूल के एक अतिरिक्त रूप के साथ रखकर तीव्र किया गया है; अनुवाद ‘मैंने अत्यन्त विद्रोह किया है’ भी सम्भव है।
    reason: lexical_alternative
  - marker: c
    text: इब्रानी वाक्य बहुत संक्षिप्त है। अनुवाद ‘घर के भीतर मृत्यु के समान है’ भी सम्भव है।
    reason: alternative_reading
lexical_decisions:
- source_word: רְאֵה
  choice: देख
  rationale: यह याहवे से की गई सीधी आज्ञार्थक विनती है; ‘देख’ आधुनिक हिन्दी में स्वाभाविक और निकट है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को उपाधि से बदलने के बजाय हिन्दी लिपि में लिप्यंतरित किया गया है।
- source_word: צַר לִי
  choice: मैं संकट में हूँ
  rationale: यह पदबंध वक्ता की व्यक्तिगत घोर व्यथा व्यक्त करता है; यह हिन्दी में सहज और अर्थनिष्ठ है।
- source_word: מֵעַי חֳמַרְמָרוּ
  choice: मेरी अंतड़ियाँ मरोड़ खा रही हैं
  rationale: मूल की देहगत आंतरिक व्यथा को बनाए रखते हुए क्रिया की तीव्र हलचल को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: נֶהְפַּךְ לִבִּי בְּקִרְבִּי
  choice: मेरा हृदय मेरे भीतर उलट गया है
  rationale: הפך के उलट जाने के रूपक को ‘व्याकुल’ जैसे सपाट अर्थ में बदलने के बजाय सुरक्षित रखा गया है।
- source_word: כִּי מָרוֹ מָרִיתִי
  choice: क्योंकि मैंने घोर विद्रोह किया है
  rationale: सजातीय क्रियारूप के साथ आए infinitive absolute की तीव्रता को ‘घोर’ द्वारा व्यक्त किया गया है।
- source_word: שִׁכְּלָה חֶרֶב
  choice: तलवार संतान छीन लेती है
  rationale: שׁכל के संतान-वियोग कराने वाले अर्थ को स्पष्ट, संक्षिप्त और काव्यात्मक हिन्दी में व्यक्त करता है।
- source_word: בַּבַּיִת כַּמָּוֶת
  choice: घर के भीतर मानो मृत्यु है
  rationale: ‘बाहर’ के साथ स्थानगत विरोध बनाए रखा गया है और כ की उपमात्मक शक्ति को ‘मानो’ से व्यक्त किया गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा
  rationale: मूल पाठ व्यक्तिगत वाचा-नाम का प्रयोग करता है। ‘याहवे’ उसका प्रचलित विद्वत्तापूर्ण लिप्यंतरण है और उसे किसी उपाधि से नहीं बदलता।
- issue: विनाश को विद्रोह से जोड़ना
  choice: वक्ता की स्वीकारोक्ति ‘क्योंकि मैंने घोर विद्रोह किया है’ को कारणसूचक रूप में बनाए रखा गया है
  alternative: इसे केवल सामान्य दुःख की अभिव्यक्ति मानना
  rationale: כִּי स्पष्टतः अगले कथन को वक्ता के विद्रोह से जोड़ता है; पाठ में उपस्थित दोष-स्वीकार को कम या अधिक नहीं किया गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और विलाप-काव्य के अनुरूप रखी गई है। ‘अंतड़ियाँ’ और ‘हृदय उलट गया’ जैसे देहगत रूपक मूल की तीव्रता बचाते हैं; पंक्ति के बाहर/भीतर विरोध और संक्षिप्त लय को भी बनाए रखा गया है।
