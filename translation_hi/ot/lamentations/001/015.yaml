id: LAM.1.15
reference: Lamentations 1:15
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: סִלָּ֨ה כָל אַבִּירַ֤/י אֲדֹנָ/י֙ בְּ/קִרְבִּ֔/י קָרָ֥א עָלַ֛/י מוֹעֵ֖ד לִ/שְׁבֹּ֣ר בַּחוּרָ֑/י גַּ֚ת דָּרַ֣ךְ אֲדֹנָ֔/י לִ/בְתוּלַ֖ת בַּת יְהוּדָֽה־׀־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/001/015.yaml
  text: The Lord has rejected all my mighty men in my midst[a]; he has summoned an appointed time against me to crush my young men[b]. The Lord has trodden the winepress for the virgin daughter of Judah.
translation:
  language: hi
  text: 'प्रभु ने मेरे बीच के सभी वीरों को ठुकरा दिया है;

    उसने मेरे विरुद्ध एक नियत समय ठहराया है[a],

    ताकि मेरे जवानों को कुचल डाले।

    प्रभु ने यहूदा की कुमारी बेटी के विरुद्ध

    दाखरस का कुंड रौंदा है[b]।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘उसने मेरे विरुद्ध एक नियत सभा बुलाई है।’ इब्रानी शब्द מוֹעֵד का अर्थ नियत समय या नियत सभा, दोनों हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: दाखरस निकालने के लिए अंगूरों को कुंड में पैरों से रौंदा जाता था। यहाँ यह चित्र कठोर ईश्वरीय न्याय का रूपक है।
    reason: cultural_note
lexical_decisions:
- source_word: סִלָּה
  choice: ठुकरा दिया है
  rationale: यहाँ पिएल रूप का अर्थ दूर कर देना या अस्वीकार करना है। सैन्य पराजय के संदर्भ में ‘ठुकरा दिया’ निर्णायक अस्वीकृति को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: אַבִּירַי
  choice: मेरे ... सभी वीरों
  rationale: शब्द बलवान पुरुषों, विशेषकर योद्धाओं, को सूचित कर सकता है। ‘वीर’ संक्षिप्त, गरिमापूर्ण और सैन्य संदर्भ के अनुकूल है।
- source_word: אֲדֹנָי
  choice: प्रभु
  rationale: यह परमेश्वर के लिए प्रयुक्त उपाधि है; मूल पाठ में यहाँ יהוה नहीं, बल्कि אֲדֹנָי है।
- source_word: בְּקִרְבִּי
  choice: मेरे बीच के
  rationale: वक्ता नगर/समुदाय के रूप में बोल रही है; इसलिए यह मानसिक आंतरिकता नहीं, बल्कि उसके बीच उपस्थित वीरों का स्थानगत अर्थ देता है।
- source_word: קָרָא עָלַי מוֹעֵד
  choice: उसने मेरे विरुद्ध एक नियत समय ठहराया है
  rationale: מוֹעֵד का अर्थ नियत समय या नियत सभा दोनों हो सकता है। मुख्य पाठ में ‘नियत समय’ अनावश्यक विशिष्टता जोड़े बिना न्याय के लिए निर्धारित अवसर का भाव देता है; अन्य संभावना पादटिप्पणी में सुरक्षित है।
- source_word: לִשְׁבֹּר
  choice: कुचल डाले
  rationale: मूल अर्थ ‘तोड़ना’ है, पर यहाँ युद्ध और न्याय के संदर्भ में ‘कुचल डालना’ विनाश की तीव्रता को स्पष्ट करता है।
- source_word: בַּחוּרַי
  choice: मेरे जवानों
  rationale: यह युवावस्था के उत्कर्ष में खड़े पुरुषों, प्रायः युद्धयोग्य युवकों, को दर्शाता है। ‘जवान’ आधुनिक हिन्दी में स्वाभाविक है और सैन्य संकेत भी बनाए रखता है।
- source_word: גַּת דָּרַךְ
  choice: दाखरस के कुंड में रौंद डाला है
  rationale: इब्रानी चित्र में अंगूर निकालने के लिए कुंड में पैरों से रौंदना है। हिन्दी में ‘कुंड में रौंदना’ क्रिया और प्रभावित व्यक्ति के संबंध को स्पष्ट रखते हुए न्याय का सजीव रूपक बनाए रखता है।
- source_word: לִבְתוּלַת בַּת יְהוּדָה
  choice: यहूदा की कुमारी बेटी को
  rationale: यह यहूदा का युवती के रूप में मानवीकरण है। ‘कुमारी बेटी’ मूल रूपक को बिना अतिरिक्त व्याख्या के सुरक्षित रखता है।
theological_decisions:
- issue: ईश्वरीय उपाधि אֲדֹנָי का अनुवाद
  choice: प्रभु
  alternative: स्वामी
  rationale: ‘प्रभु’ आधुनिक हिन्दी बाइबलीय भाषा में परमेश्वर की उपाधि के रूप में स्वाभाविक और गरिमापूर्ण है। इसे יהוה का विशिष्ट नाम मानकर प्रस्तुत नहीं किया गया।
- issue: दाखरस के कुंड का न्याय-रूपक
  choice: रूपक को मुख्य पाठ में यथावत रखना
  alternative: सीधे ‘भयंकर दंड दिया’ कहना
  rationale: मूल पाठ का हिंसक और काव्यात्मक तनाव अंगूर रौंदने के चित्र में निहित है; इसे व्याख्यात्मक कथन से बदलना उचित नहीं।
translation_notes:
  register: भाषा आधुनिक, काव्यात्मक और गरिमापूर्ण रखी गई है। पंक्ति-विन्यास विलाप की समानांतर काव्य-रचना को उभारता है। ‘मेरे बीच के’ सामुदायिक/स्थानगत अर्थ देता है, और ‘यहूदा की कुमारी बेटी’ मूल मानवीकरण को बनाए रखता है।
