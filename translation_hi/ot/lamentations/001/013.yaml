id: LAM.1.13
reference: Lamentations 1:13
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: מִ/מָּר֛וֹם שָֽׁלַח אֵ֥שׁ בְּ/עַצְמֹתַ֖/י וַ/יִּרְדֶּ֑/נָּה פָּרַ֨שׂ רֶ֤שֶׁת לְ/רַגְלַ/י֙ הֱשִׁיבַ֣/נִי אָח֔וֹר נְתָנַ֨/נִי֙ שֹֽׁמֵמָ֔ה כָּל הַ/יּ֖וֹם דָּוָֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/001/013.yaml
  text: From on high he sent fire into my bones[a], and it prevailed against them; he spread a net for my feet; he turned me back; he made me desolate[b], faint all day long.
translation:
  language: hi
  text: ऊपर से उसने मेरी हड्डियों में आग भेजी, और आग ने उन्हें अपने वश में कर लिया[a]; उसने मेरे पैरों के लिए जाल बिछाया; उसने मुझे पीछे हटा दिया; उसने मुझे उजाड़ कर दिया—मैं दिन भर दुर्बल पड़ी रही[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘और आग ने उन्हें परास्त कर दिया’; इब्रानी क्रिया का अर्थ शासन करना, अधीन करना, या उन पर प्रबल होना हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या ‘मैं दिन भर बीमार पड़ी रही’ अथवा ‘मैं दिन भर क्षीण होती रही।’
    reason: lexical_alternative
lexical_decisions:
- source_word: מִמָּרוֹם
  choice: ऊपर से
  rationale: यह מָרוֹם की ऊँचाई का भाव स्वाभाविक हिन्दी में व्यक्त करता है, पर मूल पाठ में न आए ‘स्वर्ग’ को स्पष्ट रूप से नहीं जोड़ता।
- source_word: שָׁלַח אֵשׁ בְּעַצְמֹתַי
  choice: उसने मेरी हड्डियों में आग भेजी
  rationale: यह आग के भीतर तक प्रवेश करने वाली पीड़ा की सजीव छवि और कर्ता की सक्रियता को बनाए रखता है।
- source_word: וַיִּרְדֶּנָּה
  choice: और आग ने उन्हें अपने वश में कर लिया
  rationale: רדה के शासन करने, अधीन करने या परास्त करने के अर्थ को व्यक्त करता है। ‘आग’ को दोहराने से हिन्दी में स्त्रीलिंग एकवचन कर्ता और ‘हड्डियों’ की ओर संकेत स्पष्ट रहता है।
- source_word: פָּרַשׂ רֶשֶׁת לְרַגְלַי
  choice: उसने मेरे पैरों के लिए जाल बिछाया
  rationale: फँसाने की मूल शारीरिक छवि को सीधे और स्वाभाविक ढंग से सुरक्षित रखता है।
- source_word: הֱשִׁיבַנִי אָחוֹר
  choice: उसने मुझे पीछे मोड़ दिया
  rationale: हिफ़ील रूप के किसी को वापस मोड़ देने या पीछे हटाने के कारणवाचक अर्थ को बनाए रखता है।
- source_word: נְתָנַנִי שֹׁמֵמָה
  choice: उसने मुझे उजाड़ कर दिया
  rationale: שֹׁמֵמָה में निहित उजाड़ और विनाश की अवस्था को व्यक्त करता है तथा विलाप करती नगरी के मानवीकरण के अनुकूल है।
- source_word: כָּל־הַיּוֹם דָּוָה
  choice: मैं दिन भर दुर्बल पड़ी रही
  rationale: דָּוָה की बीमारी, क्षीणता और निढाल अवस्था की अर्थ-सीमा को सहज आधुनिक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: क्रियाओं का अप्रकट कर्ता
  choice: पूरे पद में कर्ता के लिए ‘उसने’ रखा गया है, पर उसका नाम स्पष्ट रूप से नहीं जोड़ा गया।
  alternative: कर्ता को अनुवाद में ‘यहोवा’ या ‘प्रभु’ के रूप में स्पष्ट करना।
  rationale: इब्रानी में पुल्लिंग एकवचन कर्ता प्रसंग से समझा जाता है, पर इस पद में उसका नाम नहीं है। ‘उसने’ हिन्दी की व्याकरणिक आवश्यकता पूरी करता है और मूल की अंतर्निहितता बनाए रखता है।
- issue: वक्ता का स्त्रीलिंग मानवीकरण
  choice: ‘पड़ी रही’ द्वारा स्त्रीलिंग वक्ता को बनाए रखा गया है।
  alternative: लिंग-अचिह्नित या पुल्लिंग कथन का प्रयोग करना।
  rationale: इब्रानी विशेषण स्त्रीलिंग हैं और प्रसंग में यरूशलेम/सिय्योन स्त्री-वक्ता के रूप में विलाप करती है; हिन्दी में स्त्रीलिंग रूप इस काव्यात्मक मानवीकरण को स्वाभाविक रूप से दर्शाता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। समानांतर उपवाक्यों और आग, हड्डियों तथा जाल की काव्यात्मक छवियों को सुरक्षित रखा गया है। लंबे वाक्य में अर्धविराम मूल के क्रमिक आघातों को अलग करते हैं, और डैश अंतिम परिणामी अवस्था को स्पष्ट करता है।
