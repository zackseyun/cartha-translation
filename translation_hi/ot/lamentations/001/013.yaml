    rationale: הֱשִׁיבַנִי אָחוֹר means causing the speaker to turn back/retreat. ‘मुझे पीछे हटा दिया’ is clearer modern Hindi without narrowing the image.
  - severity: low
    issue: Footnote a’s phrase ‘प्रबल होना’ lacks the object implied by the Hebrew construction.
    rationale: Clarifying it as ‘उन पर प्रबल होना’ better explains the lexical alternative and matches the main clause’s relationship between fire and bones.
