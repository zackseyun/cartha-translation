source:
  edition: WLC
  text: קָרָ֤אתִי לַֽ/מְאַהֲבַ/י֙ הֵ֣מָּה רִמּ֔וּ/נִי כֹּהֲנַ֥/י וּ/זְקֵנַ֖/י בָּ/עִ֣יר גָּוָ֑עוּ כִּֽי בִקְשׁ֥וּ אֹ֨כֶל֙ לָ֔/מוֹ וְ/יָשִׁ֖יבוּ אֶת נַפְשָֽׁ/ם־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/001/019.yaml
  text: I called to my lovers[a]; they deceived me[b]. My priests and my elders perished in the city while they sought food for themselves to restore their lives.
translation:
  language: hi
  text: मैंने अपने प्रेमियों[a] को पुकारा, पर उन्होंने मुझे धोखा दिया। मेरे याजक और मेरे बुज़ुर्ग नगर में तब मर गए जब वे अपने लिए भोजन खोज रहे थे, ताकि अपना जीवन बचाए रख सकें।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “प्रेमी” एक रूपक है। इससे सम्भवतः यरूशलेम के राजनीतिक सहयोगी या वे अन्य आधार अभिप्रेत हैं जिन पर उसने गलत भरोसा किया था।
    reason: cultural_note
  - marker: b
    text: या, “मेरे याजक और मेरे बुज़ुर्ग नगर में मर गए, क्योंकि वे अपने लिए भोजन खोज रहे थे, ताकि अपना जीवन बचाए रख सकें।” इब्रानी में इसे अधिक स्पष्ट कारणात्मक अर्थ में भी समझा जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: קָרָאתִי
  choice: मैंने ... पुकारा
  rationale: קרא का सामान्य अर्थ ‘पुकारना’ है; यह बिना अतिरिक्त भावात्मक रंग जोड़े सहायता की अपील व्यक्त करता है।
- source_word: לַמְאַהֲבַי
  choice: अपने प्रेमियों को
  rationale: शाब्दिक रूपक ‘मेरे प्रेमी’ को सुरक्षित रखा गया है; प्रसंग में यह यरूशलेम के राजनीतिक सहयोगियों या गलत भरोसे के अन्य आधारों की ओर संकेत कर सकता है।
- source_word: הֵמָּה רִמּוּנִי
  choice: उन्होंने मुझे धोखा दिया
  rationale: पिएल रूप में רמה छल या धोखा देने का भाव रखता है; ‘धोखा दिया’ आधुनिक हिन्दी में सीधा और स्वाभाविक है।
- source_word: כֹּהֲנַי וּזְקֵנַי
  choice: मेरे याजक और मेरे पुरनिये
  rationale: दोनों संबंधवाचक बहुवचन रूपों को बनाए रखा गया है; ‘पुरनिये’ यहाँ नगर के वरिष्ठ अगुओं को सूचित करता है, केवल वृद्ध पुरुषों को नहीं।
- source_word: בָּעִיר גָּוָעוּ
  choice: नगर में प्राण त्याग गए
  rationale: גוע मरने या अंतिम साँस लेने को दर्शाता है; ‘प्राण त्याग गए’ विलाप के गरिमापूर्ण काव्यात्मक स्वर के अनुकूल है।
- source_word: כִּי בִקְשׁוּ אֹכֶל לָמוֹ
  choice: वे अपने लिए भोजन ढूँढ़ते रहे
  rationale: כִּי के यहाँ कारणात्मक या परिस्थितिजन्य दोनों अर्थ संभव हैं; मुख्य पाठ में वाक्य-विन्यास उस जारी परिस्थिति को व्यक्त करता है जिसमें वे मर गए।
- source_word: וְיָשִׁיבוּ אֶת נַפְשָׁם
  choice: ताकि अपने प्राण बचा सकें
  rationale: נפש यहाँ अमूर्त ‘आत्मा’ के बजाय जीवन या स्वयं को दर्शाता है। हिन्दी मुहावरे में ‘प्राण बचाना’ जीवन को लौटाने या सँभालने के आशय को स्वाभाविक रूप से व्यक्त करता है।
theological_decisions:
- issue: यरूशलेम के ‘प्रेमियों’ की पहचान
  choice: मुख्य पाठ में रूपक ‘प्रेमियों’ को बनाए रखा
  alternative: ‘सहयोगियों’ या ‘मित्र राष्ट्रों’ के रूप में स्पष्ट करना
  rationale: मूल पाठ स्वयं पहचान को स्पष्ट नहीं करता; रूपक को बनाए रखने से राजनीतिक सहयोगियों तथा गलत भरोसे के अन्य आधारों की संभावित व्याप्ति और धार्मिक तनाव सुरक्षित रहते हैं।
- issue: כִּי का संबंध
  choice: परिस्थितिजन्य प्रवाह मुख्य पाठ में, कारणात्मक अर्थ पादटिप्पणी में
  alternative: ‘क्योंकि वे...’
  rationale: इब्रानी כִּי कारण या व्याख्या दे सकता है, पर यहाँ मृत्यु के समय चल रही भोजन-खोज भी प्रमुख है; इसलिए अस्पष्टता को पादटिप्पणी सहित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, काव्यात्मक और सामान्य पाठकों के लिए बोधगम्य शैली अपनाई गई है। ‘प्रेमियों’ का सजीव रूपक और ‘प्राण त्याग गए’ का विलापमय स्वर सुरक्षित रखा गया है; पादटिप्पणियाँ मूल की सांस्कृतिक तथा वाक्यगत अस्पष्टता बताती हैं।
