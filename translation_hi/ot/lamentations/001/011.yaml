review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the people's groaning, their search for bread, the exchange of valued possessions for food, and the life-preserving purpose. It also correctly preserves the shift from third-person description ('उसके सब लोग') to Jerusalem's first-person plea ('मैं'). The phrase 'देख और ध्यान दे' somewhat weakens the second visual imperative (וְהַבִּיטָה) by making it an appeal to attention rather than a second command to look; 'देख और निहार' more closely preserves the Hebrew parallelism.
  naturalness: The Hindi is modern, clear, and appropriately dignified. 'ताकि उनकी जान में जान लौट आए' is an idiomatic and contextually fitting way to express restoration of life/strength. 'देख और निहार' is natural in elevated poetic Hindi and retains the paired appeal.
  terminology: '''याहवे'' appropriately represents the divine name. ''बहुमूल्य वस्तुएँ'' retains the broad meaning of valued/desirable possessions. ''तुच्छ हो गई हूँ'' is a suitably cautious rendering of the contextually difficult זוֹלֵלָה, without importing a specific moralizing sense.'
  issues:
  - severity: low
    issue: The second imperative in 'हे याहवे, देख और ध्यान दे' is rendered as paying attention rather than looking.
    rationale: The Hebrew uses two closely paired visual imperatives, רְאֵה ... וְהַבִּיטָה ('look/see ... and behold/look'). Replacing 'ध्यान दे' with 'निहार' preserves both the poetic parallelism and the plea for direct observation.
