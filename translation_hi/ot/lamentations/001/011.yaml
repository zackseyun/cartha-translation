source:
  edition: WLC
  text: כָּל עַמָּ֤/הּ נֶאֱנָחִים֙ מְבַקְּשִׁ֣ים לֶ֔חֶם נָתְנ֧וּ מחמודי/הם בְּ/אֹ֖כֶל לְ/הָשִׁ֣יב נָ֑פֶשׁ רְאֵ֤ה יְהוָה֙ וְֽ/הַבִּ֔יטָ/ה כִּ֥י הָיִ֖יתִי זוֹלֵלָֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/001/011.yaml
  text: All her people groan[a], seeking bread; they have given their precious things for food to restore life. Look, O Yahweh, and see[c][b], for I have become despised.
translation:
  language: hi
  text: 'उसके सब लोग कराह रहे हैं,

    रोटी ढूँढ़ रहे हैं।


    उन्होंने अपनी बहुमूल्य वस्तुएँ[a] भोजन के बदले दे दी हैं,

    ताकि उनकी जान में जान लौट आए।[b]


    हे याहवे, देख और निहार,

    क्योंकि मैं तुच्छ हो गई हूँ।[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘अपनी कीमती संपत्ति’ अथवा ‘अपनी मनभावनी वस्तुएँ।’
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से ‘प्राण को लौटा लाने के लिए’; यहाँ भाव फिर से शक्ति पाने या जीवन बचाए रखने का है।
    reason: lexical_alternative
  - marker: c
    text: या ‘घृणित’ अथवा ‘तिरस्कृत।’
    reason: lexical_alternative
lexical_decisions:
- source_word: נֶאֱנָחִים
  choice: कराह रहे हैं
  rationale: यह घेराबंदी और अकाल से उपजी सुनाई देने वाली गहरी पीड़ा व्यक्त करता है; आधुनिक हिन्दी में स्वाभाविक और गंभीर है।
- source_word: מְבַקְּשִׁים לֶחֶם
  choice: रोटी ढूँढ़ रहे हैं
  rationale: इब्रानी कृदंत की जारी क्रिया को बनाए रखता है और לֶחֶם का ठोस चित्र ‘रोटी’ के रूप में सुरक्षित रखता है, यद्यपि संदर्भ में इसका अर्थ सामान्य भोजन भी है।
- source_word: מחמודיהם
  choice: अपनी बहुमूल्य वस्तुएँ
  rationale: यह चाही जाने वाली, प्रिय या कीमती संपत्ति का व्यापक अर्थ रखता है और इसे केवल धन अथवा गहनों तक सीमित नहीं करता।
- source_word: בְּאֹכֶל
  choice: भोजन के बदले
  rationale: בְּ यहाँ विनिमय का भाव देता है; यह स्पष्ट करता है कि बहुमूल्य वस्तुएँ भोजन पाने के लिए दी गईं।
- source_word: לְהָשִׁיב נָפֶשׁ
  choice: ताकि उनकी जान में जान लौट आए
  rationale: נֶפֶשׁ यहाँ अमूर्त ‘आत्मा’ से अधिक जीवन या जीवित व्यक्ति को सूचित करता है। हिन्दी मुहावरा दुर्बलता से उबरने और जीवन बचाए रखने, दोनों भावों को स्वाभाविक रूप से व्यक्त करता है।
- source_word: רְאֵה ... וְהַבִּיטָה
  choice: देख और ध्यान दे
  rationale: दोनों आज्ञार्थक क्रियाओं की तीव्र विनती बनाए रखी गई है; शब्दशः दो समान हिन्दी दृष्टि-क्रियाएँ रखने की अपेक्षा यह अधिक स्वाभाविक है और दूसरी क्रिया के ध्यानपूर्वक देखने के भाव को व्यक्त करता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के विशिष्ट इब्रानी नाम को उपाधि से बदलने के बजाय लिप्यंतरित किया गया है।
- source_word: זוֹלֵלָה
  choice: तुच्छ हो गई हूँ
  rationale: इस संदर्भ में शब्द यरूशलेम की सामाजिक रूप से अपमानित और घृणित दशा बताता है; ‘पेटू’ वाला संभावित शाब्दिक अर्थ प्रसंगानुकूल नहीं है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा
  rationale: विशिष्ट वाचा-नाम को नाम के रूप में सुरक्षित रखा गया है; ‘याहवे’ मूल इब्रानी नाम की प्रचलित विद्वतापूर्ण ध्वनि के अधिक निकट है।
- issue: נֶפֶשׁ का अर्थ
  choice: जान / जीवन
  alternative: आत्मा
  rationale: भूख से पीड़ित लोगों के भोजन पाने के प्रसंग में यह पूरे जीवित व्यक्ति और उसकी जीवनी-शक्ति को सूचित करता है, न कि शरीर से अलग किसी अमूर्त तत्व को।
- issue: זוֹלֵלָה का संदर्भगत आशय
  choice: तुच्छ
  alternative: घृणित
  rationale: स्त्रीलिंग वक्ता यरूशलेम अपने अपमान और लोगों की दृष्टि में गिरी हुई दशा की शिकायत करती है। ‘तुच्छ’ अर्थगत तनाव बनाए रखता है और अनावश्यक नैतिक दोषारोपण नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सहज काव्यात्मक रूप अपनाया गया है। आरंभ में यरूशलेम के लिए तृतीय पुरुष स्त्रीलिंग (‘उसके’) और अंत में उसी नगर की प्रथम पुरुष पुकार (‘मैं’) का मूल काव्यात्मक परिवर्तन सुरक्षित रखा गया है। पंक्ति-विन्यास विलाप की समानांतर रचना और विनती की तीव्रता को उभारता है।
