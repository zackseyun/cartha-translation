id: LAM.1.21
reference: Lamentations 1:21
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: שָׁמְע֞וּ כִּ֧י נֶאֱנָחָ֣ה אָ֗נִי אֵ֤ין מְנַחֵם֙ לִ֔/י כָּל אֹ֨יְבַ֜/י שָׁמְע֤וּ רָֽעָתִ/י֙ שָׂ֔שׂוּ כִּ֥י אַתָּ֖ה עָשִׂ֑יתָ הֵבֵ֥אתָ יוֹם קָרָ֖אתָ וְ/יִֽהְי֥וּ כָמֽוֹ/נִי־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/001/021.yaml
  text: They have heard that I groan[a]; there is no one to comfort me. All my enemies have heard of my trouble; they rejoice that you have done it. You have brought the day you proclaimed[c][b]; let them become like me.
translation:
  language: hi
  text: उन्होंने सुना है कि मैं कराहती हूँ; मुझे सांत्वना देने वाला कोई नहीं। मेरे सभी शत्रुओं ने मेरी विपत्ति[a] के बारे में सुना है; वे प्रसन्न हुए कि तूने ही ऐसा किया। तू उस दिन को ले आया है जिसकी तूने घोषणा की थी; वे मेरे समान हो जाएँ![c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘मेरी दुर्दशा’ अथवा ‘मुझ पर आई आपदा’। इब्रानी शब्द विपत्ति, दुःख या अनिष्ट को व्यक्त कर सकता है।
    reason: lexical_alternative
  - marker: c
    text: या ‘और वे मेरे समान हो जाएँगे।’ इब्रानी रूप को इच्छा के रूप में या भविष्य के कथन के रूप में पढ़ा जा सकता है; विलाप के सन्दर्भ में इच्छा अधिक उपयुक्त जान पड़ती है।
    reason: alternative_reading
lexical_decisions:
- source_word: שָׁמְעוּ כִּי נֶאֱנָחָה אָנִי
  choice: उन्होंने सुना है कि मैं कराह रही हूँ
  rationale: आरम्भिक कर्ता इब्रानी में अनिर्दिष्ट है, इसलिए हिन्दी में भी ‘उन्होंने’ द्वारा उसे अनिर्दिष्ट रखा गया है। אנח गहरे दुःख में कराहने या आह भरने को व्यक्त करता है; विलाप के सन्दर्भ में ‘कराह रही हूँ’ अधिक प्रभावी है। वक्ता सिय्योन/यरूशलेम का स्त्री-रूपक है, इसलिए हिन्दी में स्त्रीलिंग स्वाभाविक है।
- source_word: אֵין מְנַחֵם לִי
  choice: मुझे सांत्वना देने वाला कोई नहीं
  rationale: अस्तित्व-निषेध אֵין और कृदन्त מְנַחֵם किसी भी सांत्वना देने वाले के पूर्ण अभाव को व्यक्त करते हैं। यह आधुनिक हिन्दी में सहज और अर्थनिष्ठ है।
- source_word: כָּל אֹיְבַי
  choice: मेरे सभी शत्रु
  rationale: परिमाण और सम्बन्ध—‘सभी’ तथा ‘मेरे’—दोनों को स्पष्ट रूप से सुरक्षित रखा गया है।
- source_word: רָעָתִי
  choice: मेरी विपत्ति
  rationale: רעה यहाँ नैतिक बुराई नहीं, बल्कि वक्ता पर आई आपदा या दुःखद दशा को बताता है। ‘विपत्ति’ गम्भीरता बनाए रखते हुए सामान्य पाठक के लिए स्पष्ट है।
- source_word: שָׂשׂוּ
  choice: वे आनन्दित हुए
  rationale: Qal पूर्ण रूप शत्रुओं के उल्लास को व्यक्त करता है। ‘आनन्दित हुए’ उनके द्वारा सिय्योन की विपत्ति पर प्रसन्न होने की नैतिक कटुता को बनाए रखता है।
- source_word: כִּי אַתָּה עָשִׂיתָ
  choice: कि तूने ही ऐसा किया
  rationale: मूल पाठ सीधे परमेश्वर को सम्बोधित कर विपत्ति को उसी का कार्य ठहराता है। ‘ही’ द्वितीय पुरुष पर पड़े बल को स्वाभाविक हिन्दी में व्यक्त करता है, जबकि ‘ऐसा’ मूल की तरह कर्म को अनिर्दिष्ट रखता है।
- source_word: הֵבֵאתָ יוֹם קָרָאתָ
  choice: जिस दिन की तूने घोषणा की थी, उसे तू ले आया है
  rationale: הביא के साथ ‘दिन’ का अर्थ उस ठहराए हुए दिन को घटित करना है। קרא इस सन्दर्भ में दिन की घोषणा करने के अर्थ में लिया गया है; ‘ले आया है’ मूल रूपक और परमेश्वर की सक्रिय भूमिका दोनों को बनाए रखता है।
- source_word: וְיִהְיוּ כָמוֹנִי
  choice: वे भी मेरे समान हो जाएँ!
  rationale: अपूर्ण रूप को विलाप के सन्दर्भ में इच्छासूचक प्रार्थना के रूप में पढ़ा गया है। ‘हो जाएँ’ शत्रुओं के भी उसी दशा में आने की कामना को व्यक्त करता है; ‘भी’ तुलना की निहित शक्ति को स्वाभाविक हिन्दी देता है।
theological_decisions:
- issue: यरूशलेम की विपत्ति में परमेश्वर की सक्रिय भूमिका
  choice: ‘तूने ही ऐसा किया’ और ‘उसे तू ले आया है’ के द्वारा विपत्ति और घोषित दिन को सीधे परमेश्वर का कार्य बताया गया है।
  alternative: ऐसा नरम अनुवाद जो परमेश्वर की भूमिका को केवल अनुमति देने तक सीमित या अस्पष्ट कर दे।
  rationale: इब्रानी पाठ द्वितीय पुरुष में परमेश्वर को सीधे सम्बोधित करता और दोनों क्रियाएँ उसी से जोड़ता है। अनुवाद इस कठिन धार्मिक तनाव को कम नहीं करता।
- issue: अन्तिम उपवाक्य का भाव
  choice: इसे इच्छासूचक प्रार्थना—‘वे भी मेरे समान हो जाएँ!’—के रूप में प्रस्तुत किया गया है।
  alternative: भविष्यवाचक कथन—‘और वे मेरे समान हो जाएँगे।’
  rationale: इब्रानी अपूर्ण रूप दोनों सम्भावनाएँ दे सकता है। विलाप और शत्रुओं के विरुद्ध न्याय की पुकार के सन्दर्भ में इच्छासूचक अर्थ अधिक संगत है, पर वैकल्पिक भविष्यवाचक पाठ को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, गरिमापूर्ण किन्तु सहज रखी गई है। परमेश्वर के लिए एकवचन आत्मीय सम्बोधन ‘तू’ मूल इब्रानी के सीधे द्वितीय-पुरुष सम्बोधन और काव्यात्मक प्रार्थना की तीव्रता को बनाए रखता है। ‘सांत्वना’, ‘विपत्ति’ और ‘घोषणा’ सामान्य धार्मिक-काव्यात्मक प्रयोग के शब्द हैं, पर अत्यधिक संस्कृतनिष्ठ शैली से बचा गया है।
