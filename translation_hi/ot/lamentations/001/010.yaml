  text: יָד/וֹ֙ פָּ֣רַשׂ צָ֔ר עַ֖ל כָּל מַחֲמַדֶּ֑י/הָ כִּֽי רָאֲתָ֤ה גוֹיִם֙ בָּ֣אוּ מִקְדָּשָׁ֔/הּ אֲשֶׁ֣ר צִוִּ֔יתָה לֹא יָבֹ֥אוּ בַ/קָּהָ֖ל לָֽ/ךְ־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/001/010.yaml
  text: The enemy has stretched out his hand over all her precious things[c][b][a], for she has seen nations enter her sanctuary—those whom you commanded not to enter your assembly.
translation:
  language: hi
  text: शत्रु ने उसकी सभी बहुमूल्य वस्तुओं[a] पर अपना हाथ फैला दिया है; क्योंकि उसने राष्ट्रों[b] को अपने पवित्रस्थान में प्रवेश करते देखा है—उन्हीं को, जिन्हें तूने आज्ञा दी थी कि वे तेरी सभा में प्रवेश न करें।[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘उसकी प्रिय वस्तुओं’ अथवा ‘उसके खज़ानों’।
    reason: lexical_alternative
  - marker: b
    text: ‘राष्ट्रों’ का आशय यहाँ विदेशी जातियों के लोगों से भी हो सकता है।
    reason: lexical_alternative
  - marker: c
    text: व्यवस्थाविवरण 23 से तुलना करें, जहाँ कुछ लोगों के यहोवा की सभा में प्रवेश करने पर रोक है।
    reason: cross_reference
lexical_decisions:
- source_word: יָדוֹ ... פָּרַשׂ
  choice: अपना हाथ फैला दिया है
  rationale: यह शत्रुतापूर्ण अधिकार और लूट की क्रिया को व्यक्त करता है तथा इब्रानी बिंब को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: צָר
  choice: शत्रु
  rationale: विलाप के प्रसंग में यह यरूशलेम पर अत्याचार करने वाले विरोधी को दर्शाता है; ‘शत्रु’ स्पष्ट और आधुनिक है।
- source_word: מַחֲמַדֶּיהָ
  choice: उसकी सभी बहुमूल्य वस्तुओं
  rationale: शब्द का अर्थ केवल धन नहीं, बल्कि व्यापक रूप से प्रिय, मनभावनी या मूल्यवान वस्तुएँ हो सकता है; ‘बहुमूल्य वस्तुएँ’ इस विस्तार को बनाए रखता है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पहले कथन का कारण या व्याख्या प्रस्तुत करता है।
- source_word: רָאֲתָה
  choice: उसने ... देखा है
  rationale: पूर्ण क्रिया को वर्तमान विलाप से जुड़ी हुई अनुभूति के रूप में हिन्दी पूर्णकाल में रखा गया है।
- source_word: גוֹיִם
  choice: राष्ट्रों
  rationale: यह अन्य जातीय-राजनीतिक peoples के लिए सीधा समतुल्य है; ‘गैर-यहूदी’ जैसा बाद का धार्मिक भेद अनावश्यक रूप से नहीं जोड़ा गया।
- source_word: בָּאוּ מִקְדָּשָׁהּ
  choice: अपने पवित्रस्थान में प्रवेश करते
  rationale: यह यरूशलेम के पवित्र क्षेत्र में अपवित्र घुसपैठ को स्पष्ट और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: אֲשֶׁר צִוִּיתָה
  choice: उन्हीं को, जिनके विषय में तूने आज्ञा दी थी
  rationale: सापेक्ष उपवाक्य को पहले आए राष्ट्रों से स्पष्ट रूप से जोड़ता है; ‘विषय में’ आदेश की वाक्य-संरचना को स्वाभाविक बनाता है।
- source_word: לֹא יָבֹאוּ
  choice: प्रवेश न करें
  rationale: निषेधात्मक आदेश का अर्थ सीधे और गरिमापूर्ण ढंग से सुरक्षित रहता है।
- source_word: בַקָּהָל לָךְ
  choice: तेरी सभा में
  rationale: קָהָל की सामुदायिक और वाचाई सभा का व्यापक अर्थ बचता है तथा कलीसियाई संकीर्णता से बचा जाता है।
theological_decisions:
- issue: द्वितीय पुरुष संबोधन का अभिप्राय
  choice: वक्ता परमेश्वर को सीधे ‘तूने’ और ‘तेरी’ कहकर संबोधित करता है।
  alternative: इसे किसी सामान्य या अप्रत्यक्ष आदेश का संकेत माना जाए।
  rationale: इब्रानी में द्वितीय पुरुष रूप सीधे संबोधन का समर्थन करते हैं; इससे विलाप का प्रार्थनात्मक चरित्र बना रहता है।
- issue: ‘राष्ट्रों’ और निषिद्ध सभा के बीच संबंध
  choice: सापेक्ष उपवाक्य उन प्रवेश करने वाले राष्ट्रों/लोगों को ही निर्दिष्ट करता है जिनके विषय में निषेध था।
  alternative: निषेध को व्यापक रूप से सभी विदेशी राष्ट्रों पर लागू समझा जाए।
  rationale: वाक्य उन लोगों को निषिद्ध समूहों से जोड़ता है, पर स्वयं पद यह तय नहीं करता कि हर राष्ट्र बिना भेद के निषिद्ध था; अतः व्यापक सामान्यीकरण नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण विलाप-शैली रखी गई है। परमेश्वर के सीधे संबोधन में ‘तू/तेरी’ का प्रयोग निकटता और मूल के एकवचन संबोधन को दर्शाता है, अनादर को नहीं। ‘पवित्रस्थान’ और ‘सभा’ परिचित बाइबलीय शब्द हैं, पर वाक्य-संरचना सामान्य पाठक के लिए सहज रखी गई है।
