id: LAM.1.5
reference: Lamentations 1:5
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: הָי֨וּ צָרֶ֤י/הָ לְ/רֹאשׁ֙ אֹיְבֶ֣י/הָ שָׁל֔וּ כִּֽי יְהוָ֥ה הוֹגָ֖/הּ עַ֣ל רֹב פְּשָׁעֶ֑י/הָ עוֹלָלֶ֛י/הָ הָלְכ֥וּ שְׁבִ֖י לִ/פְנֵי צָֽר־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/001/005.yaml
  text: Her foes have become the head[a]; her enemies prosper, because Yahweh has afflicted her for the multitude of her transgressions[b]. Her children have gone away into captivity before the foe.
translation:
  language: hi
  text: 'उसके विरोधी प्रधान हो गए हैं;

    उसके शत्रु सुख-चैन से हैं[a],

    क्योंकि याहवे ने उसके अनेक अपराधों के कारण

    उसे दुःख दिया है।

    उसके नन्हे बच्चे[b] बंदी होकर

    विरोधी के आगे चले गए हैं।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘फल-फूल रहे हैं’ अथवा ‘सुरक्षित रहते हैं।’ इब्रानी क्रिया सुख-चैन, सुरक्षा या समृद्धि का भाव दे सकती है।
    reason: lexical_alternative
  - marker: b
    text: या ‘उसके छोटे बच्चे’ अथवा ‘उसके शिशु।’ इब्रानी शब्द बहुत कम आयु के बच्चों और उनकी असुरक्षा पर बल देता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: צָרֶיהָ
  choice: उसके विरोधी
  rationale: צַר यहाँ शत्रुतापूर्ण विरोधियों को दर्शाता है। ‘विरोधी’ स्वाभाविक है और अगली समानांतर पंक्ति के ‘शत्रु’ से अलगाव भी बनाए रखता है।
- source_word: לְרֹאשׁ
  choice: प्रधान हो गए हैं
  rationale: शाब्दिक बिंब ‘सिर/प्रधान’ का है और प्रसंग में प्रभुत्व या सर्वोच्च स्थिति पाने का भाव देता है। ‘प्रधान हो गए हैं’ इस उलटाव को संक्षेप में सुरक्षित रखता है।
- source_word: אֹיְבֶיהָ
  choice: उसके शत्रु
  rationale: सैन्य और वैरपूर्ण प्रसंग में אֹיֵב का सामान्य और स्पष्ट हिन्दी रूप ‘शत्रु’ है।
- source_word: שָׁלוּ
  choice: सुख-चैन से हैं
  rationale: यह क्रिया निश्चिन्तता, सुरक्षा अथवा समृद्ध दशा व्यक्त कर सकती है। ‘सुख-चैन से हैं’ मूल अर्थ की व्यापकता को बनाए रखता है; ‘फल-फूल रहे हैं’ को पादटिप्पणी में विकल्प दिया गया है।
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत नाम को उपाधि से बदलने के बजाय हिन्दी में लिप्यंतरित किया गया है।
- source_word: הוֹגָהּ
  choice: उसे दुःख दिया है
  rationale: हिफ़ील रूप किसी को शोक या पीड़ा पहुँचाने की कारक शक्ति रखता है। यह चयन उस स्पष्ट ईश्वरीय कर्तृत्व को बनाए रखता है।
- source_word: עַל רֹב פְּשָׁעֶיהָ
  choice: उसके अनेक अपराधों के कारण
  rationale: רֹב बहुलता और פֶּשַׁע अपराध अथवा विद्रोह को व्यक्त करता है। यह वाक्यांश कारण और मानवीय दोष—दोनों को स्पष्ट रखता है।
- source_word: עוֹלָלֶיהָ
  choice: उसके नन्हे बच्चे
  rationale: עוֹלָל छोटे बच्चों, कभी-कभी शिशुओं, को दर्शाता है। ‘नन्हे बच्चे’ उनकी कम आयु और असुरक्षा दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: שְׁבִי
  choice: बंदी होकर
  rationale: यह बंदी अवस्था को दर्शाता है। ‘बंदी होकर’ हिन्दी वाक्य में स्वाभाविक है और निर्वासन से अधिक मूल चित्र के निकट रहता है।
- source_word: לִפְנֵי צָר
  choice: विरोधी के आगे
  rationale: शाब्दिक स्थानिक बिंब ‘विरोधी के सामने/आगे’ सुरक्षित रखा गया है; यह बंदियों को शत्रु के अधिकार में ले जाए जाने का संकेत देता है, पर अनकहा विवरण नहीं जोड़ता।
theological_decisions:
- issue: यरूशलेम के दुःख में ईश्वरीय कर्तृत्व
  choice: याहवे ने ... उसे दुःख दिया है
  alternative: याहवे ने ... उसे शोक में डाल दिया है
  rationale: इब्रानी पाठ पीड़ा का कर्ता स्पष्ट रूप से याहवे को बताता है और उसे उसके अनेक अपराधों से जोड़ता है। अनुवाद न तो ईश्वरीय कर्तृत्व को हल्का करता है, न मानवीय दोष को।
- issue: פְּשָׁעֶיהָ का नैतिक और वाचा-संबंधी बल
  choice: अपराधों
  alternative: विद्रोहों
  rationale: ‘अपराध’ सामान्य पाठक के लिए स्पष्ट है, जबकि मूल शब्द में विद्रोह का भी बल हो सकता है। प्रसंग में किसी एक अधिक विशिष्ट धार्मिक व्याख्या को थोपे बिना नैतिक दोष बनाए रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण और विलाप-काव्य के अनुकूल रूप अपनाया गया है। पंक्ति-विन्यास इब्रानी समानांतरता को सुनने योग्य बनाता है। ‘प्रधान हो गए हैं’ मूल ‘सिर’ के प्रभुत्व-संबंधी बिंब को हिन्दी में समझने योग्य रखता है, और ‘सुख-चैन’ शत्रुओं तथा यरूशलेम की दशा के तीखे उलटाव को व्यक्त करता है।
