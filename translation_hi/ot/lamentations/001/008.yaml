  text: חֵ֤טְא חָֽטְאָה֙ יְר֣וּשָׁלִַ֔ם עַל כֵּ֖ן לְ/נִידָ֣ה הָיָ֑תָה כָּֽל מְכַבְּדֶ֤י/הָ הִזִּיל֨וּ/הָ֙ כִּי רָא֣וּ עֶרְוָתָ֔/הּ גַּם הִ֥יא נֶאֶנְחָ֖ה וַ/תָּ֥שָׁב אָחֽוֹר־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/001/008.yaml
  text: Jerusalem has sinned grievously[a]; therefore she has become unclean. All who honored her despise her, because they have seen her nakedness[c][b]. She herself also groans and turns backward.
translation:
  language: hi
  text: यरूशलेम ने घोर पाप किया है; इसलिए वह अशुद्ध[a] हो गई है। जितने लोग उसका आदर करते थे, वे सब अब उसे तुच्छ समझते हैं, क्योंकि उन्होंने उसकी नग्नता देख ली है। वह स्वयं भी कराहती है और पीछे हट जाती है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘मासिक धर्म के कारण अशुद्ध स्त्री के समान’ अथवा ‘अशुद्धता बन गई’; इब्रानी शब्द अनुष्ठानिक अशुद्धता और अलग किए जाने—दोनों का भाव दे सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: חֵטְא חָטְאָה
  choice: घोर पाप किया है
  rationale: सजातीय क्रियारूपों की यह रचना पाप करने की बात पर बल देती है। हिंदी में ‘घोर पाप किया है’ इस तीव्रता को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: לְנִידָה
  choice: अशुद्ध
  rationale: यह शब्द अनुष्ठानिक अशुद्धता, अलगाव और तिरस्कार की दशा का बोध करा सकता है। ‘अशुद्ध’ मुख्य अर्थ को संक्षेप और स्पष्ट रूप में रखता है; अधिक ठोस अर्थ पादटिप्पणी में दिया गया है।
- source_word: מְכַבְּדֶיהָ
  choice: उसका आदर करते थे
  rationale: כבד यहाँ सम्मान या आदर देने के अर्थ में है। भूतकाल पूर्व सम्मान और वर्तमान तिरस्कार के विरोध को स्पष्ट करता है।
- source_word: הִזִּילוּהָ
  choice: उसे तुच्छ समझते हैं
  rationale: यह रूप किसी को हल्का, मूल्यहीन या घृणित मानने का भाव देता है। ‘तुच्छ समझते हैं’ आधुनिक हिंदी में उस सामाजिक तिरस्कार को सहजता से व्यक्त करता है।
- source_word: עֶרְוָתָהּ
  choice: उसकी नग्नता
  rationale: शब्द का सीधा अर्थ नग्नता है और इसमें सार्वजनिक लज्जा तथा उजागर होने का भाव भी निहित है। रूपक को व्याख्यात्मक रूप से ‘लज्जा’ बनाकर सीमित नहीं किया गया।
- source_word: נֶאֶנְחָה
  choice: कराहती है
  rationale: क्रिया गहरे दुःख में निकली आह या कराह को व्यक्त करती है। ‘कराहती है’ विलाप की तीव्रता बनाए रखता है।
- source_word: וַתָּשָׁב אָחוֹר
  choice: पीछे हट जाती है
  rationale: शाब्दिक भाव ‘पीछे लौटना/मुड़ना’ है। ‘पीछे हट जाती है’ लज्जा या संकोच में दूर होने की गति को बिना अनावश्यक व्याख्या के व्यक्त करता है।
theological_decisions:
- issue: यरूशलेम के न्याय के लिए अशुद्धता का रूपक
  choice: मुख्य पाठ में ‘अशुद्ध हो गई है’
  alternative: ‘मासिक धर्म के कारण अशुद्ध स्त्री के समान हो गई है’ अथवा ‘अशुद्धता बन गई है’
  rationale: मूल शब्द में अनुष्ठानिक अशुद्धता और सामाजिक अलगाव दोनों का भाव है। मुख्य पाठ का चयन इस तनाव को पठनीय हिंदी में बनाए रखता है, जबकि ठोस वैकल्पिक चित्र पादटिप्पणी में सुरक्षित है; इसे मासिक धर्म के विषय में स्वतंत्र धर्मसैद्धांतिक कथन नहीं बनाया गया।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। यरूशलेम के स्त्री-रूपक को स्त्रीलिंग क्रियाओं और सर्वनामों से बनाए रखा गया है। काव्य की तीव्रता के लिए ‘घोर पाप’, ‘नग्नता’ और ‘कराहती’ जैसे सीधे शब्द चुने गए हैं।
