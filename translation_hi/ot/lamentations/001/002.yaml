  edition: WLC
  text: בָּכ֨וֹ תִבְכֶּ֜ה בַּ/לַּ֗יְלָה וְ/דִמְעָתָ/הּ֙ עַ֣ל לֶֽחֱיָ֔/הּ אֵֽין לָ֥/הּ מְנַחֵ֖ם מִ/כָּל אֹהֲבֶ֑י/הָ כָּל רֵעֶ֨י/הָ֙ בָּ֣גְדוּ בָ֔/הּ הָ֥יוּ לָ֖/הּ לְ/אֹיְבִֽים־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/001/002.yaml
  text: She weeps bitterly in the night[a], with her tears on her cheeks; among all her lovers she has no comforter. All her companions have dealt treacherously with her[b]; they have become her enemies.
translation:
  language: hi
  text: 'वह रात में फूट-फूटकर रोती है,

    और उसके आँसू उसके गालों पर हैं।

    उसके सब प्रेमियों[a] में

    कोई भी उसे सांत्वना देने वाला नहीं है।

    उसके सभी साथियों[b] ने उसके साथ विश्वासघात किया है;

    वे उसके शत्रु बन गए हैं।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उसके सब सहयोगियों में।” इब्रानी का शब्द शाब्दिक रूप से “प्रेमियों” का भाव रखता है; यह नगर को स्त्री के रूप में प्रस्तुत करने वाली कविता को बनाए रखता है और राजनीतिक साझेदारों की ओर भी संकेत कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: या “मित्रों” अथवा “सहयोगियों”।
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּכוֹ תִבְכֶּה
  choice: फूट-फूटकर रोती है
  rationale: क्रिया से पहले उसी धातु का infinitive absolute रोने की तीव्रता पर बल देता है। यह हिन्दी अभिव्यक्ति उस बल को स्वाभाविक और काव्यात्मक ढंग से व्यक्त करती है।
- source_word: בַּלַּיְלָה
  choice: रात में
  rationale: यह समयसूचक वाक्यांश है; सरल हिन्दी में मूल का निकट अर्थ बनाए रखता है।
- source_word: וְדִמְעָתָהּ עַל לֶחֱיָהּ
  choice: और उसके आँसू उसके गालों पर हैं
  rationale: इब्रानी में ‘आँसू’ और ‘गाल’ व्याकरणिक रूप से एकवचन हैं, पर सामूहिक अर्थ में हिन्दी बहुवचन स्वाभाविक है। वाक्य मूल की स्थिर और मार्मिक छवि को बिना अनावश्यक विस्तार के बनाए रखता है।
- source_word: אֵין לָהּ מְנַחֵם
  choice: कोई भी उसे सांत्वना देनेवाला नहीं है
  rationale: अस्तित्ववाचक निषेध और कृदंत का अर्थ है कि उसे सांत्वना देने वाला कोई व्यक्ति मौजूद नहीं है। यह हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: מִכָּל אֹהֲבֶיהָ
  choice: उसके सब प्रेमियों में
  rationale: ‘प्रेमियों’ नगर को स्त्री के रूप में चित्रित करने वाली कविता को सुरक्षित रखता है और साथ ही राजनीतिक सहयोगियों की संभावित ओरछाया को मिटाता नहीं है।
- source_word: כָּל רֵעֶיהָ
  choice: उसके सभी साथियों
  rationale: רֵעַ का अर्थ मित्र, साथी या सहयोगी हो सकता है। ‘साथी’ व्यक्तिगत और राजनीतिक दोनों संभावनाओं के लिए पर्याप्त व्यापक है।
- source_word: בָּגְדוּ בָהּ
  choice: उसके साथ विश्वासघात किया है
  rationale: בגד केवल दूरी बनाने के बजाय बेवफाई और छलपूर्ण विश्वासघात का प्रबल संबंधपरक भाव रखता है।
- source_word: הָיוּ לָהּ לְאֹיְבִים
  choice: वे उसके शत्रु बन गए हैं
  rationale: यह निर्माण संबंध या स्थिति में परिवर्तन दर्शाता है; ‘बन गए हैं’ उस परिवर्तन को स्पष्ट रखता है।
theological_decisions:
- issue: यरूशलेम/सिय्योन को स्त्री और उसके संबंधों को ‘प्रेमियों’ के रूप में प्रस्तुत करने वाला रूपक
  choice: ‘प्रेमियों’ को मुख्य पाठ में बनाए रखना
  alternative: ‘सहयोगियों’ या ‘मित्रों’ कहना
  rationale: संदर्भ नगर को स्त्री के रूप में मानवीकृत करता है, और भविष्यद्वक्ताओं की भाषा में ‘प्रेमी’ राजनीतिक अथवा मूर्तिपूजक संबंधों की ओर भी संकेत कर सकते हैं। केवल ‘सहयोगी’ कहने से कविता की संबंधपरक और धर्मवैचारिक तीक्ष्णता दब जाती।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की है, पर विलाप की काव्यात्मक गरिमा बनाए रखती है। पंक्ति-विभाजन इब्रानी समानांतरता और भावगत क्रम—रोना, सांत्वना का अभाव, विश्वासघात और शत्रुता—को उभारता है।
