id: LAM.1.14
reference: Lamentations 1:14
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: נִשְׂקַד֩ עֹ֨ל פְּשָׁעַ֜/י בְּ/יָד֗/וֹ יִשְׂתָּֽרְג֛וּ עָל֥וּ עַל צַוָּארִ֖/י הִכְשִׁ֣יל כֹּחִ֑/י נְתָנַ֣/נִי אֲדֹנָ֔/י בִּ/ידֵ֖י לֹא אוּכַ֥ל קֽוּם־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/001/014.yaml
  text: The yoke of my transgressions is bound by his hand[a]; they are woven together, they have come up upon my neck; he has made my strength fail[c][b]. The Lord has given me into hands from which I cannot rise.
translation:
  language: hi
  text: मेरे अपराधों का जूआ उसके हाथ से कस दिया गया है[a]; वे आपस में गूँथ गए हैं[b] और मेरी गरदन पर चढ़ आए हैं। उसने मेरा बल तोड़ दिया है। प्रभु ने मुझे ऐसे हाथों में सौंप दिया है[c] कि मैं उठ नहीं सकती।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘उस पर नज़र रखी गई है’; इब्रानी क्रिया दुर्लभ और कठिन है। प्रसंग में जूए को बाँधने या कसने का अर्थ अधिक उपयुक्त लगता है।
    reason: lexical_alternative
  - marker: b
    text: या ‘वे आपस में लिपट गए हैं’ अथवा ‘वे एक-दूसरे में उलझ गए हैं।’
    reason: lexical_alternative
  - marker: c
    text: शाब्दिक रूप से ‘हाथों में’; इब्रानी में यह नहीं बताया गया कि ये हाथ किनके हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: נִשְׂקַד
  choice: कस दिया गया है
  rationale: यह क्रिया दुर्लभ और कठिन है। जूए और गरदन के प्रसंग में ‘कस दिया गया’ बँधे अथवा मजबूती से लगाए गए बोझ का स्वाभाविक चित्र प्रस्तुत करता है; वैकल्पिक अर्थ पादटिप्पणी में रखा गया है।
- source_word: עֹל
  choice: जूआ
  rationale: यह बोझ, अधीनता और दमन का केंद्रीय रूपक है; आधुनिक हिन्दी में ‘जूआ’ इस ठोस चित्र को स्पष्ट रखता है।
- source_word: פְּשָׁעַי
  choice: मेरे अपराधों
  rationale: פשע में अधिकार के विरुद्ध विद्रोह अथवा अतिक्रमण का नैतिक भार है। ‘अपराध’ सामान्य पाठक के लिए स्पष्ट है और इस गंभीरता को बनाए रखता है।
- source_word: בְּיָדוֹ
  choice: उसके हाथ से
  rationale: यह अभिव्यक्ति कर्ता की सक्रिय भूमिका बताती है और इब्रानी के ‘हाथ’ वाले चित्र को सुरक्षित रखती है।
- source_word: יִשְׂתָּרְגוּ
  choice: वे आपस में गूँथ गए हैं
  rationale: दुर्लभ क्रिया का आशय संभवतः परस्पर गुँथना या लिपटना है। बहुवचन ‘वे’ अपराधों की ओर संकेत करता है, जो मिलकर जूआ बनते हैं।
- source_word: עָלוּ עַל צַוָּארִי
  choice: मेरी गरदन पर चढ़ आए हैं
  rationale: यह अनुवाद मूल के गतिशील और शारीरिक चित्र को बनाए रखता है—गुँथे हुए अपराध गरदन पर चढ़कर जूए जैसा बोझ बनते हैं।
- source_word: הִכְשִׁיל כֹּחִי
  choice: उसने मेरा बल तोड़ दिया है
  rationale: शाब्दिक रूप से क्रिया ‘ठोकर खिलाने’ या ‘गिराने’ से जुड़ी है; ‘बल’ के साथ हिन्दी में ‘बल तोड़ दिया’ शक्ति को विफल कर देने का स्वाभाविक और प्रभावशाली अर्थ देता है।
- source_word: אֲדֹנָי
  choice: प्रभु
  rationale: यह परमेश्वर के लिए प्रयुक्त उपाधि है; ‘प्रभु’ आधुनिक हिन्दी में प्रतिष्ठित, स्पष्ट और संप्रदाय-निरपेक्ष रूप है।
- source_word: בִּידֵי
  choice: ऐसे हाथों में
  rationale: मूल में उत्पीड़कों की पहचान नहीं दी गई है। ‘ऐसे हाथों में’ उनकी अनिश्चितता रखते हुए अगले परिणाम-वाक्य से स्वाभाविक संबंध बनाता है।
- source_word: לֹא אוּכַל קוּם
  choice: कि मैं उठ नहीं सकती
  rationale: यह केवल शारीरिक रूप से खड़े होने की नहीं, पराजय और अधीनता से फिर उठ पाने की असमर्थता व्यक्त करता है। स्त्रीलिंग रूप विलाप में बोल रही व्यक्तिरूप यरूशलेम के अनुरूप है।
theological_decisions:
- issue: तीसरे पुरुष एकवचन प्रत्ययों और क्रियाओं का कर्ता
  choice: ‘उसके/उसने’ को प्रभु की ओर संकेत करने दिया गया है।
  alternative: आरंभिक प्रत्यय को निर्वैयक्तिक समझा जा सकता है, या वाक्य के किसी भाग में जूए को कर्ता माना जा सकता है।
  rationale: पद का अंतिम वाक्य स्पष्ट रूप से कहता है कि प्रभु ने वक्ता को सौंप दिया। निकटवर्ती संदर्भ भी यरूशलेम की विपत्ति को दैवी न्याय से जोड़ता है। फिर भी पहले उल्लेख में नाम जोड़कर मूल से अधिक स्पष्टता नहीं थोपी गई।
- issue: वक्ता का स्त्रीलिंग स्वर
  choice: ‘मैं उठ नहीं सकती’
  alternative: व्याकरणिक लिंग को प्रकट न करने के लिए वाक्य को अधिक निर्वैयक्तिक बनाया जा सकता था।
  rationale: विलाप में यरूशलेम को स्त्री के रूप में व्यक्तित्व दिया गया है। हिन्दी में स्वाभाविक प्रथम-पुरुष वाक्य लिंग माँगता है, इसलिए स्त्रीलिंग संदर्भानुकूल है, न कि कोई अतिरिक्त सिद्धांतगत निष्कर्ष।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और मौखिक पाठ के लिए सहज रखी गई है। ‘जूआ’, ‘गरदन पर चढ़ आए’ और ‘बल तोड़ दिया’ मूल के ठोस काव्यात्मक चित्रों को बनाए रखते हैं। विरल इब्रानी क्रियाओं की वास्तविक अनिश्चितता पादटिप्पणियों में सुरक्षित है।
