source:
  edition: WLC
  text: אֵיכָה֙ יוּעַ֣ם זָהָ֔ב יִשְׁנֶ֖א הַ/כֶּ֣תֶם הַ/טּ֑וֹב תִּשְׁתַּפֵּ֨כְנָה֙ אַבְנֵי קֹ֔דֶשׁ בְּ/רֹ֖אשׁ כָּל חוּצֽוֹת־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/004/001.yaml
  text: How the gold has grown dim[b][a], how the fine gold has changed! The holy stones are poured out at the head of every street.
translation:
  language: hi
  text: 'सोना कैसे फीका पड़ गया है,

    उत्तम सोना कैसे बदल गया है!

    पवित्र पत्थर[a]

    हर गली के सिरे पर[b] उँडेल दिए गए हैं।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘पावन पत्थर’ अथवा ‘पवित्रस्थान के पत्थर।’ इब्रानी पद का संकेत मन्दिर के समर्पित पत्थरों या काव्यात्मक चित्र में पवित्र बहुमूल्य पत्थरों की ओर हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक अर्थ ‘हर गली के सिर पर’ है; इसका आशय गलियों के कोने या उनके मुहाने भी हो सकते हैं।
    reason: cultural_note
lexical_decisions:
- source_word: אֵיכָה
  choice: हाय, ... कैसे
  rationale: यह विलापसूचक विस्मय है। ‘हाय’ शोक का भाव व्यक्त करता है और ‘कैसे’ इब्रानी पद की विस्मयात्मक संरचना बनाए रखता है।
- source_word: יוּעַם זָהָב
  choice: सोना ... फीका पड़ गया है
  rationale: होफ़ाल रूप सोने की चमक मंद या धूमिल हो जाने को दर्शाता है; ‘फीका पड़ गया’ आधुनिक हिन्दी में स्वाभाविक है और भौतिक कलंक लगने का अनावश्यक अर्थ नहीं जोड़ता।
- source_word: יִשְׁנֶא הַכֶּתֶם הַטּוֹב
  choice: उत्तम सोने की चमक ... बदल गई है
  rationale: כֶּתֶם הַטּוֹב उच्च कोटि के परिष्कृत सोने को सूचित करता है। क्रिया का मूल भाव ‘बदलना’ है; हिन्दी में स्पष्टता के लिए प्रसंग से निहित ‘चमक’ जोड़ा गया है।
- source_word: תִּשְׁתַּפֵּכְנָה
  choice: बिखेर दिए गए हैं
  rationale: मूल क्रिया का चित्र ‘उँडेल दिए जाने’ का है, पर पत्थरों के लिए ‘बिखेर दिए गए’ स्वाभाविक हिन्दी है और उनके चारों ओर छितरा दिए जाने का सजीव भाव बनाए रखता है।
- source_word: אַבְנֵי קֹדֶשׁ
  choice: पवित्र पत्थर
  rationale: शाब्दिक पदबंध रखा गया है ताकि यह अनिश्चितता बनी रहे कि आशय पवित्रस्थान के पत्थरों, समर्पित बहुमूल्य पत्थरों या काव्यात्मक रूप से लोगों से है।
- source_word: בְּרֹאשׁ כָּל חוּצוֹת
  choice: हर गली के सिरे पर
  rationale: רֹאשׁ का शाब्दिक अर्थ ‘सिर’ है और इस संदर्भ में गली के आरम्भ, मुहाने या कोने को सूचित कर सकता है। ‘सिरे पर’ ठोस बिंब और स्थानगत अस्पष्टता दोनों को काफी हद तक बनाए रखता है।
theological_decisions:
- issue: ‘पवित्र पत्थरों’ का अभिप्राय
  choice: मुख्य पाठ में शाब्दिक ‘पवित्र पत्थर’ रखा गया है।
  alternative: ‘पवित्रस्थान के पत्थर’, ‘पवित्र रत्न’, या आगे पद 2 के आलोक में सिय्योन के बहुमूल्य पुत्र।
  rationale: इब्रानी अभिव्यक्ति काव्यात्मक और बहुअर्थी है। किसी एक संदर्भ को निश्चित करने से साहित्यिक और धर्मवैचारिक तनाव मिट जाता, इसलिए उसका समाधान अनुवाद में नहीं किया गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और विलाप-काव्य के अनुकूल रखी गई है। पंक्ति-विन्यास इब्रानी समानांतरता और अंतिम चित्र की तीव्रता को उभारता है; दुर्बोध शाब्दिकता से बचते हुए मूल की प्रमुख अस्पष्टताएँ पादटिप्पणियों में सुरक्षित हैं।
