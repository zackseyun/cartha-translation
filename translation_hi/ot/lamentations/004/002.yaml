base_translation:
  language: en
  yaml_path: translation/ot/lamentations/004/002.yaml
  text: The precious sons of Zion[a], weighed out against fine gold—how they are regarded as clay jars[b], the work of a potter’s hands.
translation:
  language: hi
  text: सिय्योन के अनमोल पुत्र[a], जो खरे सोने के बराबर आँके जाते थे—वे कुम्हार के हाथों से बने मिट्टी के घड़ों[b] के समान कैसे समझे जाते हैं!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “सिय्योन की सन्तान।” इब्रानी में शाब्दिक रूप से “सिय्योन के पुत्र” है; प्रसंग में इससे सिय्योन के निवासी व्यापक रूप से अभिप्रेत हो सकते हैं।
    reason: lexical_alternative
  - marker: b
    text: या “मिट्टी के पात्र।”
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי צִיּוֹן
  choice: सिय्योन के ... पुत्र
  rationale: इब्रानी में शाब्दिक रूप से ‘सिय्योन के पुत्र’ है। काव्यात्मक और पुल्लिंग अभिव्यक्ति को बनाए रखा गया है; प्रसंग में इसका संकेत सिय्योन के निवासियों की ओर व्यापक रूप से हो सकता है।
- source_word: הַיְקָרִים
  choice: अनमोल
  rationale: यह उच्च मूल्य और प्रियता दोनों व्यक्त करता है तथा विलाप के भाव के अनुकूल है।
- source_word: הַמְסֻלָּאִים בַּפָּז
  choice: जिनका मूल्य कुन्दन के समान था
  rationale: क्रिया का आशय तौलने, आँकने या मूल्यवान मानने से हो सकता है। स्वाभाविक हिन्दी में मूल्यांकन का भाव रखा गया है और पादटिप्पणी में तौलने की ठोस छवि सुरक्षित की गई है।
- source_word: פָּז
  choice: कुन्दन
  rationale: यह उत्तम, परिष्कृत सोने को दर्शाता है; ‘कुन्दन’ आधुनिक हिन्दी में संक्षिप्त और काव्यात्मक है।
- source_word: אֵיכָה
  choice: हाय, अब
  rationale: विलापसूचक विस्मय और दुख को स्वाभाविक हिन्दी में व्यक्त करता है; ‘अब’ पूर्व प्रतिष्ठा और वर्तमान दशा के विरोध को स्पष्ट करता है।
- source_word: נֶחְשְׁבוּ
  choice: समझे जाते हैं
  rationale: निफ़अल रूप का ‘माने/आँके जाते हैं’ वाला भाव सहज हिन्दी में व्यक्त होता है।
- source_word: לְנִבְלֵי חֶרֶשׂ
  choice: मिट्टी के घड़ों के समान
  rationale: यह मिट्टी से बने पात्रों को दर्शाता है। ‘घड़े’ सामान्य पाठक के लिए स्पष्ट है और सोने के साथ तीखा विरोध बनाए रखता है।
- source_word: מַעֲשֵׂה יְדֵי יוֹצֵר
  choice: जो कुम्हार के हाथों की कारीगरी हैं
  rationale: ‘हाथों’ की मूर्त छवि और कुम्हार द्वारा बनाए जाने का भाव दोनों सुरक्षित हैं।
