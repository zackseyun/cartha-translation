  text: טוֹבִ֤ים הָיוּ֙ חַלְלֵי חֶ֔רֶב מֵֽ/חַלְלֵ֖י רָעָ֑ב שֶׁ֣/הֵ֤ם יָז֨וּבוּ֙ מְדֻקָּרִ֔ים מִ/תְּנוּבֹ֖ת שָׂדָֽי־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/004/009.yaml
  text: Better were those slain by the sword than those slain by hunger[a], who waste away, pierced through for lack of the produce of the field.
translation:
  language: hi
  text: तलवार से मारे गए लोगों की दशा भूख से मरने वालों की दशा से बेहतर थी[a]; वे खेत की उपज के अभाव में बेधे हुए, घुलते जाते हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “भूख से मरने वालों की अपेक्षा बेहतर थी, जो खेत की उपज के अभाव में बेधे हुए घुलते जाते हैं।” इस खंड का इब्रानी पाठ कठिन है—विशेषकर ‘घुलते जाते हैं’ अनूदित क्रिया और ‘खेत की उपज के अभाव में’ में पूर्वसर्ग का अर्थ।
    reason: lexical_alternative
lexical_decisions:
- source_word: טוֹבִים הָיוּ
  choice: कहीं अच्छे थे
  rationale: यह नैतिक भलाई नहीं, बल्कि दो दुःखद दशाओं की तुलनात्मक अभिव्यक्ति है। ‘कहीं अच्छे थे’ हिन्दी में इस कठोर तुलना को स्वाभाविक रूप से व्यक्त करता है।
- source_word: חַלְלֵי חֶרֶב
  choice: तलवार से मारे गए लोग
  rationale: חָלָל मारे गए व्यक्ति को दर्शाता है और חֶרֶב मृत्यु के साधन को; यह अनुवाद स्पष्ट और स्वाभाविक है।
- source_word: מֵחַלְלֵי רָעָב
  choice: भूख से मारे गए लोगों से
  rationale: उपसर्ग מ तुलना को व्यक्त करता है। רָעָב यहाँ अकाल की परिस्थिति में अनुभव की गई भूख पर बल देता है।
- source_word: שֶׁהֵם
  choice: वे
  rationale: यह भूख से मरने वालों का वर्णन आगे बढ़ाता है। हिन्दी में अर्धविराम के बाद ‘वे’ रखने से संबंध स्पष्ट रहता है।
- source_word: יָזוּבוּ
  choice: घुलते जाते हैं
  rationale: क्रिया कठिन है और मूलतः बहने या रिसने की छवि रखती है; संदर्भ में यह धीरे-धीरे क्षीण होकर मरने को दर्शाती है। ‘घुलते जाते हैं’ उस दीर्घ पीड़ा और चित्रात्मकता दोनों को रखता है।
- source_word: מְדֻקָּרִים
  choice: छिदे हुए-से
  rationale: דקר का मूल अर्थ ‘छेदना’ है। यहाँ भूख से पीड़ित लोगों के लिए प्रयुक्त तीखी रूपकात्मक छवि को ‘-से’ के द्वारा स्वाभाविक हिन्दी में सुरक्षित रखा गया है।
- source_word: מִתְּנוּבֹת שָׂדָי
  choice: खेत की उपज के अभाव में
  rationale: संदर्भ में מ को अभाव अथवा कारण के अर्थ में समझना उपयुक्त है। ‘खेत की उपज’ תְּנוּבוֹת שָׂדָי का सहज हिन्दी रूप है।
