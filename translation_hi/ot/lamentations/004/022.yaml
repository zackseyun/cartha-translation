source:
  edition: WLC
  text: תַּם עֲוֺנֵ/ךְ֙ בַּת צִיּ֔וֹן לֹ֥א יוֹסִ֖יף לְ/הַגְלוֹתֵ֑/ךְ פָּקַ֤ד עֲוֺנֵ/ךְ֙ בַּת אֱד֔וֹם גִּלָּ֖ה עַל חַטֹּאתָֽיִ/ךְ־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/004/022.yaml
  text: Your punishment is finished[a], daughter Zion; he will not exile you again. He has punished your iniquity, daughter Edom[c][b]; he has uncovered your sins.
translation:
  language: hi
  text: सिय्योन की बेटी, तेरा दण्ड समाप्त हो गया है[a]; वह फिर तुझे निर्वासन में नहीं भेजेगा। एदोम की बेटी, उसने तेरे अधर्म का दण्ड दिया है[b]; उसने तेरे पाप उजागर कर दिए हैं[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “तेरा अधर्म समाप्त हो गया है” अथवा “तेरा दोष मिट गया है।” यहाँ प्रयुक्त इब्रानी शब्द अधर्म, दोष या दोष के फलस्वरूप मिलने वाले दण्ड को सूचित कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: या “उसने तेरे अधर्म का हिसाब लिया है।” इसका शाब्दिक भाव है कि उसने तेरे अधर्म पर ध्यान देकर उसे न्याय के लिए लेखे में लिया है।
    reason: lexical_alternative
  - marker: c
    text: या “उसने तेरे पाप खोल दिए हैं” अथवा “प्रकट कर दिए हैं।”
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּם
  choice: समाप्त हो गया है
  rationale: यह रूप किसी बात के पूर्ण होने या अंत तक पहुँचने को व्यक्त करता है। वर्तमान सन्दर्भ में यह सहज हिन्दी में दण्ड के समाप्त होने को बताता है।
- source_word: עֲוֺנֵךְ (पहला प्रयोग)
  choice: तेरा दण्ड
  rationale: עָוֹן अधर्म, दोष अथवा दोष के फलस्वरूप मिलने वाले दण्ड को सूचित कर सकता है। निर्वासन समाप्त होने के अगले कथन के कारण यहाँ परिणामस्वरूप दण्ड का अर्थ सन्दर्भानुकूल है।
- source_word: בַּת צִיּוֹן
  choice: सिय्योन की बेटी
  rationale: इससे सिय्योन के नगर और लोगों का काव्यात्मक मानवीकरण सुरक्षित रहता है।
- source_word: לֹא יוֹסִיף לְהַגְלוֹתֵךְ
  choice: वह फिर तुझे निर्वासन में नहीं भेजेगा
  rationale: יָסַף के साथ क्रिया का अर्थ उस कार्य को फिर या आगे न करने का है। 'निर्वासन में भेजेगा' आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: פָּקַד
  choice: उसने ... लेखा लिया है
  rationale: न्याय के सन्दर्भ में פקד किसी अपराध पर ध्यान देकर उसे हिसाब में लेने या दण्ड देने का भाव रखता है। 'लेखा लिया है' न्यायिक उत्तरदायित्व को व्यक्त करते हुए शब्द की व्यापकता भी बनाए रखता है।
- source_word: עֲוֺנֵךְ (दूसरा प्रयोग)
  choice: तेरे अधर्म
  rationale: यहाँ मूल अर्थ 'अधर्म' रखा गया है, क्योंकि अगली समानांतर पंक्ति में पापों के उजागर होने की बात है और एदोम का अपराध प्रमुख है।
- source_word: בַּת אֱדוֹם
  choice: एदोम की बेटी
  rationale: यह एदोम राष्ट्र और उसके लोगों का वही काव्यात्मक मानवीकरण सुरक्षित रखता है जो पहली पंक्ति में सिय्योन के लिए है।
- source_word: גִּלָּה עַל חַטֹּאתָיִךְ
  choice: उसने तेरे पाप उजागर कर दिए हैं
  rationale: पिएल रूप यहाँ खोलने या प्रकट करने का अर्थ देता है। 'उजागर कर दिए हैं' आधुनिक हिन्दी में स्वाभाविक रहते हुए सार्वजनिक अनावरण का रूपक बनाए रखता है।
- source_word: חַטֹּאתָיִךְ
  choice: तेरे पाप
  rationale: बहुवचन का सीधा और धर्मवैचारिक रूप से पारदर्शी हिन्दी प्रतिरूप 'पाप' है।
theological_decisions:
- issue: पहली पंक्ति में עָוֹן का अर्थ
  choice: '''तेरा दण्ड'' के रूप में अनुवाद'
  alternative: '''तेरा अधर्म'' या ''तेरा दोष'''
  rationale: तुरन्त बाद निर्वासन दोबारा न होने का कथन आता है, इसलिए यहाँ अपराध के परिणाम अथवा दण्ड का अर्थ सबसे स्वाभाविक है। पादटिप्पणी मूल शब्द की वास्तविक अर्थ-व्याप्ति सुरक्षित रखती है।
- issue: יוֹסִיף, פָּקַד और גִּלָּה का निहित कर्ता
  choice: कर्ता को 'वह' रखा गया है
  alternative: कर्ता को स्पष्ट करके 'यहोवा' कहना
  rationale: इस पद के इब्रानी पाठ में कर्ता का नाम स्पष्ट नहीं है। सन्दर्भ से परमेश्वर समझा जा सकता है, पर 'वह' उस निहितता को बिना अतिरिक्त संज्ञा जोड़े सुरक्षित रखता है।
- issue: एदोम के विषय में पूर्ण क्रियारूप
  choice: '''उसने ... लिया है/कर दिए हैं'' के पूर्ण भाव को बनाए रखा गया है'
  alternative: भावी न्याय के रूप में 'वह ... लेगा/करेगा'
  rationale: इब्रानी में दोनों क्रियाएँ पूर्ण रूप में हैं। काव्यात्मक या भविष्यसूचक सन्दर्भ में उन्हें निश्चित भावी घटना समझना सम्भव है, पर अनुवाद ने व्याकरणिक रूप को चुपचाप भविष्यकाल में नहीं बदला।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सुबोध और काव्यात्मक गद्य रखा गया है। 'सिय्योन की बेटी' और 'एदोम की बेटी' जैसे मूल मानवीकरणों को सरल व्याख्या से प्रतिस्थापित नहीं किया गया। वाक्य-विन्यास संक्षिप्त रखा गया है ताकि इब्रानी विलाप-काव्य की समानांतर संरचना सुनाई दे।
