id: LAM.4.6
reference: Lamentations 4:6
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יִּגְדַּל֙ עֲוֺ֣ן בַּת עַמִּ֔/י מֵֽ/חַטַּ֖את סְדֹ֑ם הַֽ/הֲפוּכָ֣ה כְמוֹ רָ֔גַע וְ/לֹא חָ֥לוּ בָ֖/הּ יָדָֽיִם־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/004/006.yaml
  text: For the iniquity of the daughter of my people has grown greater than the sin of Sodom[a], which was overthrown in a moment[b], though no hands labored against her.
translation:
  language: hi
  text: क्योंकि मेरी प्रजा की पुत्री का अधर्म सदोम के पाप से भी बढ़ गया है[a]—उस सदोम से, जो पल भर में उलट दी गई, और उसके विरुद्ध किसी हाथ ने श्रम नहीं किया[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मेरी प्रजा की पुत्री का दोष सदोम के दोष से भी बढ़ गया है”; “अधर्म” के लिए प्रयुक्त इब्रानी शब्द दोष अथवा उसके दण्ड का भाव भी दे सकता है।
    reason: lexical_alternative
  - marker: b
    text: अन्तिम उपवाक्य का इब्रानी पाठ कठिन है। अन्य सम्भव अर्थ हैं, “और उसके लिए किसी ने हाथ नहीं मले” अथवा “और उस पर किसी के हाथ नहीं पड़े।”
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּגְדַּל
  choice: बढ़ गया है
  rationale: גדל के क्रियात्मक भाव, ‘बड़ा होना/बढ़ जाना’, और सदोम से की गई तुलना—दोनों को स्वाभाविक हिन्दी में रखता है।
- source_word: עֲוֺן
  choice: अधर्म
  rationale: यहाँ शब्द नैतिक बुराई/दोष को सूचित करता है, यद्यपि इसमें दोष या उसके दण्ड का अर्थ भी निहित हो सकता है; उस विकल्प को पादटिप्पणी में रखा गया है।
- source_word: בַּת עַמִּי
  choice: मेरी प्रजा की बेटी
  rationale: यरूशलेम/यहूदा के परम्परागत मानवीकरण को स्पष्ट किए बिना मूल रूपक बनाए रखता है।
- source_word: מֵחַטַּאת סְדֹם
  choice: सदोम के पाप से भी
  rationale: מִן की तुलनात्मक शक्ति और חַטָּאת के प्रसंगानुकूल ‘पाप’ अर्थ को व्यक्त करता है।
- source_word: הַהֲפוּכָה
  choice: जो ... उलट दी गई
  rationale: सदोम के उलट दिए जाने की उत्पत्ति-वृत्तान्त से जुड़ी प्रतिध्वनि को ‘नष्ट’ जैसे सामान्य शब्द की अपेक्षा अधिक निकटता से सुरक्षित रखता है।
- source_word: כְמוֹ רָגַע
  choice: पल भर में
  rationale: अचानक और अत्यल्प समय में हुई घटना का स्वाभाविक हिन्दी बोध देता है।
- source_word: וְלֹא חָלוּ בָהּ יָדָיִם
  choice: और उस पर किसी के हाथों ने परिश्रम नहीं किया
  rationale: कठिन इब्रानी वाक्यांश की हाथों और श्रम से जुड़ी सम्भावित छवि को असामान्यता सहित बनाए रखता है; अन्य सम्भव अर्थ पादटिप्पणी में दिए गए हैं।
theological_decisions:
- issue: 'עָוֹן का अर्थ: अधर्म/दोष या अधर्म का दण्ड'
  choice: मुख्य पाठ में नैतिक ‘अधर्म’
  alternative: दोष अथवा अधर्म का दण्ड
  rationale: तत्काल तुलना ‘सदोम के पाप’ से है, इसलिए नैतिक अर्थ अधिक प्रत्यक्ष है; फिर भी इब्रानी शब्द में दोष और दण्ड का अर्थ सम्भव होने के कारण उसे पादटिप्पणी में सुरक्षित रखा गया है।
- issue: अन्तिम उपवाक्य का अर्थ
  choice: सदोम का विनाश किसी दीर्घ मानवीय प्रयास के बिना अचानक हुआ
  alternative: उसके लिए किसी ने हाथ नहीं मले; अथवा उस पर किसी के हाथ नहीं पड़े
  rationale: वाक्यांश अत्यन्त संक्षिप्त और संदिग्ध है। मुख्य पाठ हाथों के श्रम की सम्भावना को रखता है, जबकि अन्य प्रमुख अर्थ पादटिप्पणी में दिए गए हैं, ताकि यरूशलेम की लम्बी पीड़ा और सदोम के आकस्मिक विनाश के सम्भावित विरोध को निश्चित सिद्ध न किया जाए।
translation_notes:
  register: आधुनिक, गरिमापूर्ण मानक हिन्दी; ‘मेरी प्रजा की बेटी’ मूल विलाप-काव्य के मानवीकरण को बनाए रखता है। अन्तिम कठिन उपवाक्य को जानबूझकर कुछ असामान्य रखा गया है और उसकी अनिश्चितता पादटिप्पणी में स्पष्ट की गई है।
