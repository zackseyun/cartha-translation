base_translation:
  language: en
  yaml_path: translation/ot/lamentations/004/005.yaml
  text: Those who used to eat delicacies are desolate in the streets[a]; those who were brought up on scarlet embrace ash heaps.
translation:
  language: hi
  text: जो उत्तम पकवान खाते थे, वे सड़कों पर वीरान हैं; जो किरमिज़ी वस्त्रों के बीच पले-बढ़े थे, वे राख के ढेरों[a] को गले लगाते हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “कूड़े के ढेर” अथवा “गोबर के ढेर”; इब्रानी शब्द फेंके हुए कचरे के ढेरों को दर्शाता है और घोर अपमान का भाव व्यक्त करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאֹכְלִים
  choice: जो ... खाते थे
  rationale: संज्ञा के रूप में प्रयुक्त कृदंत उन लोगों को दर्शाता है जिनका पहले यह नियमित जीवन था; विलाप में वर्तमान दुर्दशा के साथ विरोध के कारण हिन्दी में भूतकाल स्वाभाविक है।
- source_word: לְמַעֲדַנִּים
