review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the verse’s reversal from former luxury to public ruin. However, “उजड़े हुए पड़े हैं” is an awkward and somewhat over-physical expression for people in Hindi, and “किरमिज़ी वस्त्रों पर पाले गए” is too literal to sound natural, as though the people were physically raised on garments. The revision retains the Hebrew imagery while expressing it idiomatically.
  naturalness: Modern Hindi is otherwise clear and suitably dignified. “सड़कों पर वीरान हैं” is a concise poetic rendering of the desolation, and “किरमिज़ी वस्त्रों के बीच पले-बढ़े” naturally communicates upbringing amid costly scarlet textiles.
  terminology: “उत्तम पकवान,” “किरमिज़ी,” and “राख के ढेर” are appropriate. The footnote correctly preserves the broader sense of אַשְׁפַּתּוֹת as refuse/dung heaps and should describe these as heaps rather than merely places.
  issues:
  - severity: medium
    issue: “किरमिज़ी वस्त्रों पर पाले गए” is overly literal and unnatural Hindi.
    rationale: The Hebrew literally uses “upon scarlet,” an image of being reared amid luxury. Hindi needs a contextual expression such as “किरमिज़ी वस्त्रों के बीच पले-बढ़े” to retain the image without implying that garments were the physical surface on which people were raised.
  - severity: low
    issue: “उजड़े हुए पड़े हैं” is stylistically awkward for the people described.
    rationale: Although it seeks to convey נָשַׁמּוּ, it sounds more natural in Hindi to describe them as “सड़कों पर वीरान हैं,” preserving the lament’s stark image without adding the unstated posture “पड़े हैं.”},{
