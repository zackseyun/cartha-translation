- source_word: נָשַׁמּוּ
  choice: उजड़े हुए पड़े हैं
  rationale: क्रिया उजाड़, विनाश और स्तब्ध दुर्दशा का भाव रखती है। यह चयन केवल शारीरिक दुर्बलता तक अर्थ को सीमित किए बिना मनुष्यों के लिए समझ में आने वाली हिन्दी देता है।
- source_word: בַּחוּצוֹת
  choice: सड़कों पर
  rationale: यह नगर के खुले सार्वजनिक स्थानों को दर्शाता है; प्रसंग में 'सड़कों पर' सबसे स्वाभाविक हिन्दी है और सार्वजनिक बेबसी का चित्र बनाए रखता है।
- source_word: הָאֱמֻנִים
  choice: जो ... पाले गए थे
  rationale: אמן का यह रूप देखभाल करके पालने-पोसने को दर्शाता है, न कि विश्वासयोग्यता को। निष्क्रिय भाव मूल के सामाजिक उलटाव को सुरक्षित रखता है।
- source_word: עֲלֵי תוֹלָע
  choice: किरमिज़ी वस्त्रों पर
  rationale: תולע यहाँ उस कीट से रंगे किरमिज़ी/गहरे लाल बहुमूल्य कपड़े के लिए लाक्षणिक रूप से आया है। 'वस्त्रों' जोड़ने से आधुनिक पाठक के लिए आशय स्पष्ट होता है, जबकि रंग और विलासिता का चित्र बना रहता है।
- source_word: חִבְּקוּ
  choice: गले लगाते हैं
  rationale: मूल क्रिया का ठोस अर्थ 'आलिंगन करना' है। इसे बनाए रखने से पहले के वैभव और वर्तमान अपमान के बीच तीखा विरोध प्रकट होता है।
- source_word: אַשְׁפַּתּוֹת
  choice: राख के ढेरों
  rationale: शब्द फेंके हुए कचरे के ढेरों को दर्शाता है, जिनमें राख या गोबर के ढेर भी हो सकते हैं। मुख्य पाठ में प्रचलित और संभव 'राख के ढेर' रखा गया है तथा व्यापक अर्थ पादटिप्पणी में दिया गया है।
