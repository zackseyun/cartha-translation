source:
  edition: WLC
  text: שִׂ֤ישִׂי וְ/שִׂמְחִי֙ בַּת אֱד֔וֹם יושבתי בְּ/אֶ֣רֶץ ע֑וּץ גַּם עָלַ֨יִ/ךְ֙ תַּעֲבָר כּ֔וֹס תִּשְׁכְּרִ֖י וְ/תִתְעָרִֽי־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/004/021.yaml
  text: Rejoice and be glad[a], daughter of Edom, you who dwell in the land of Uz[b]; the cup will also pass to you—you will become drunk and strip yourself bare.
translation:
  language: hi
  text: हे एदोम की बेटी, जो ऊज़ देश में रहती है, आनंद मना और प्रसन्न हो! तुझ पर भी यह प्याला आएगा[a]; तू मतवाली हो जाएगी और अपने को नंगा कर देगी[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “प्याला तुझ पर भी गुज़रेगा।” यहाँ प्याला न्याय का रूपक है।
    reason: lexical_alternative
  - marker: b
    text: या, “तू उघड़ जाएगी” अथवा “अपने को उघाड़ देगी।” इब्रानी में लज्जाजनक नग्नता का भाव है।
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׂישִׂי וְשִׂמְחִי
  choice: आनन्द मना और प्रसन्न हो
  rationale: दोनों स्त्रीलिंग एकवचन आज्ञार्थक क्रियाओं की समानांतरता और तीव्रता को स्वाभाविक आधुनिक हिन्दी में बनाए रखता है। संदर्भ में यह हर्ष का आह्वान व्यंग्यात्मक मोड़ लिए हुए है, पर अनुवाद उस व्यंग्य को अलग से जोड़कर स्पष्ट नहीं करता।
- source_word: בַּת אֱדוֹם
  choice: हे एदोम की बेटी
  rationale: राष्ट्र को स्त्री के रूप में संबोधित करने वाली भविष्यद्वाणी की मूल उपमा तथा पूरे पद के स्त्रीलिंग संबोधन को सुरक्षित रखता है।
- source_word: יֹשַׁבְתִּי בְּאֶרֶץ עוּץ
  choice: जो ऊज़ देश में रहती है
  rationale: स्त्रीलिंग एकवचन कृदन्त का निरंतर निवास वाला भाव और ऊज़ का भौगोलिक नाम स्पष्ट, स्वाभाविक हिन्दी में व्यक्त होता है।
- source_word: גַּם עָלַיִךְ תַּעֲבָר כּוֹס
  choice: कटोरा तेरे पास भी आएगा
  rationale: निर्णय के कटोरे की मूल रूपक-छवि को बनाए रखते हुए עבר עם על की यहाँ अभिप्रेत गति—कटोरे का एदोम तक पहुँचना—मुहावरेदार हिन्दी में व्यक्त की गई है।
- source_word: תִּשְׁכְּרִי
  choice: तू मतवाली हो जाएगी
  rationale: क्रिया के नशे में आ जाने के परिणामात्मक भाव को गरिमापूर्ण और सहज हिन्दी में व्यक्त करता है।
- source_word: וְתִתְעָרִי
  choice: और अपने को नंगा कर देगी
  rationale: हित्पाएल रूप के आत्मवाची भाव और अपमानजनक नग्नता की छवि को बिना नरम किए सुरक्षित रखता है।
theological_decisions:
- issue: कटोरे का रूपक
  choice: ‘कटोरा’ को पाठ में बनाए रखा गया है और उसे सीधे ‘दण्ड’ नहीं बनाया गया।
  alternative: दण्ड तेरे पास भी आएगा
  rationale: कटोरा भविष्यद्वाणी-साहित्य में न्याय की प्रभावशाली और व्यापक रूपक-छवि है। उसे सुरक्षित रखना इस पद की साहित्यिक तथा धर्मवैचारिक प्रतिध्वनि बनाए रखता है, जबकि पादटिप्पणी उसका संकेत स्पष्ट करती है।
- issue: एदोम के आनन्द का स्वर
  choice: आज्ञार्थक शब्दों को सीधे अनूदित किया गया है; ‘व्यंग्य से’ जैसा व्याख्यात्मक पद नहीं जोड़ा गया।
  alternative: व्यंग्यात्मक भाव को मुख्य पाठ में स्पष्ट करना
  rationale: आने वाले न्याय से इसका व्यंग्यात्मक तनाव संदर्भ में उभरता है। उसे मुख्य पाठ में जोड़ देना मूल की निहित विडम्बना को समय से पहले निश्चित कर देता।
translation_notes:
  register: आधुनिक मानक हिन्दी, निकट और काव्यात्मक संबोधन के लिए ‘तू/तेरे’ का प्रयोग; शैली गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज है। ‘ऊज़’ में दीर्घ स्वर दिखाने के लिए ऊ का प्रयोग किया गया है।
