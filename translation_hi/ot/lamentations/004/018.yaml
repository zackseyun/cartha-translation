  text: צָד֣וּ צְעָדֵ֔י/נוּ מִ/לֶּ֖כֶת בִּ/רְחֹבֹתֵ֑י/נוּ קָרַ֥ב קִצֵּ֛י/נוּ מָלְא֥וּ יָמֵ֖י/נוּ כִּי בָ֥א קִצֵּֽי/נוּ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/004/018.yaml
  text: They hunted our steps[a], so that we could not walk in our streets. Our end drew near; our days were fulfilled[c][b], for our end had come.
translation:
  language: hi
  text: वे हमारे हर कदम पर घात लगाए रहे[a], जिससे हम अपनी सड़कों पर चल न सके। हमारा अंत[c] निकट आ गया; हमारे दिन पूरे हो गए[b], क्योंकि हमारा अंत आ पहुँचा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “वे हमारे कदमों का पीछा करते रहे” अथवा “वे हमारे कदमों की ताक में रहे।” इब्रानी क्रिया शत्रुतापूर्ण पीछा करने या घात लगाने का भाव रखती है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से “हमारे दिन भर गए।” यह इब्रानी मुहावरा बताता है कि निर्धारित समय समाप्त या पूरा हो गया था।
    reason: cultural_note
  - marker: c
    text: या “हमारा विनाश।” इब्रानी शब्द का मूल अर्थ “अंत” है, पर प्रसंग में यह विनाश का संकेत देता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: צָדוּ
  choice: वे ... घात लगाए रहे
  rationale: यह क्रिया शत्रुतापूर्ण पीछा करने, ताक में रहने या शिकार की तरह घेरने का भाव रखती है। ‘घात लगाए रहे’ उस हिंसक और सतत खतरे को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: צְעָדֵינוּ
  choice: हमारे कदमों
  rationale: शाब्दिक बिंब ‘हमारे कदम’ बनाए रखा गया है; प्रसंग में इसका आशय उनकी हर गतिविधि पर निगाह रखे जाने से है।
- source_word: מִלֶּכֶת
  choice: जिससे हम ... चल न सके
  rationale: מִן के साथ क्रियार्थक रूप यहाँ रोक या बाधा का भाव देता है। हिन्दी में परिणामवाचक वाक्यांश इस अर्थ को स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
- source_word: בִּרְחֹבֹתֵינוּ
  choice: अपनी गलियों में
  rationale: רְחֹבוֹת नगर के सार्वजनिक मार्गों, चौड़ी गलियों या खुले स्थानों को सूचित कर सकता है। ‘गलियों’ विलापगीत के नगर-संदर्भ में सहज है और सार्वजनिक आवागमन का भाव देता है।
- source_word: קָרַב קִצֵּינוּ
  choice: हमारा अंत निकट आ गया
  rationale: קרב के निकट आने के भाव और קֵץ के मूल अर्थ ‘अंत’ को बनाए रखा गया है, जबकि विनाश का संकेत प्रसंग से उभरता है।
- source_word: מָלְאוּ יָמֵינוּ
  choice: हमारे दिन पूरे हो गए
  rationale: शाब्दिक रूप से ‘हमारे दिन भर गए’; यह निर्धारित समय के समाप्त या पूर्ण हो जाने का इब्रानी मुहावरा है। ‘पूरे हो गए’ आधुनिक हिन्दी में उसका स्वाभाविक अर्थ देता है।
- source_word: כִּי בָא קִצֵּינוּ
  choice: क्योंकि हमारा अंत आ पहुँचा
  rationale: כִּי को कारणसूचक ‘क्योंकि’ के रूप में और קֵץ की पुनरावृत्ति को ‘अंत’ दोहराकर सुरक्षित रखा गया है।
