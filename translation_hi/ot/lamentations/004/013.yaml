  edition: WLC
  text: מֵֽ/חַטֹּ֣את נְבִיאֶ֔י/הָ עֲוֺנ֖וֹת כֹּהֲנֶ֑י/הָ הַ/שֹּׁפְכִ֥ים בְּ/קִרְבָּ֖/הּ דַּ֥ם צַדִּיקִֽים׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/004/013.yaml
  text: Because of the sins of her prophets[a], the iniquities of her priests, who poured out in her midst the blood of the righteous[b],
translation:
  language: hi
  text: यह उसके नबियों के पापों और उन याजकों के अधर्मों के कारण हुआ जिन्होंने उसके भीतर धर्मियों[b] का खून बहाया[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से ‘खून उंडेला’। इब्रानी क्रिया का अर्थ ‘उंडेलना’ है, पर रक्त के साथ इसका स्वाभाविक हिन्दी अर्थ ‘खून बहाना’ है।
    reason: lexical_alternative
  - marker: b
    text: या ‘निर्दोषों’। इब्रानी शब्द का अधिक शाब्दिक अर्थ ‘धर्मी जन’ है।
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵחַטֹּאת
  choice: पापों के कारण
  rationale: पूर्वसर्ग מִן यहाँ कारण प्रकट करता है। ‘के कारण’ आधुनिक हिन्दी में स्वाभाविक है और यरूशलेम की दशा को इन पापों का परिणाम बताता है।
- source_word: נְבִיאֶיהָ
  choice: उसके नबियों
  rationale: स्त्रीलिंग एकवचन प्रत्यय नगर यरूशलेम की ओर संकेत करता है; ‘उसके’ इस संबंध को बनाए रखता है।
- source_word: עֲוֺנוֹת
  choice: अधर्मों
  rationale: עָוֹן नैतिक कुटिलता, दोष या अपराध का अर्थ दे सकता है। ‘अधर्मों’ इसकी गंभीरता बनाए रखता है और पहले आए ‘पापों’ से शब्दगत भेद भी दर्शाता है।
- source_word: כֹּהֲנֶיהָ
  choice: उसके याजकों
  rationale: כֹּהֵן का मानक हिन्दी बाइबलीय रूप ‘याजक’ है; प्रत्यय नगर से संबंध दिखाता है।
- source_word: הַשֹּׁפְכִים
  choice: जिन्होंने … खून बहाया
  rationale: बहुवचन कृदंत पहले उल्लिखित नबियों और याजकों को रक्तपात के कर्ताओं के रूप में बताता है। ‘खून बहाना’ हिन्दी का स्वाभाविक मुहावरा है, जबकि मूल क्रिया का शाब्दिक बिंब ‘उंडेलना’ है।
- source_word: בְּקִרְבָּהּ
  choice: उसके भीतर
  rationale: यह रक्तपात नगर के अंदर होने पर बल देता है; ‘उसके भीतर’ आधुनिक हिन्दी में सहज है और स्त्रीलिंग नगर-संदर्भ को बनाए रखता है।
- source_word: דַּם
  choice: खून
  rationale: रक्तपात के संदर्भ में ‘खून बहाना’ सामान्य और प्रभावशाली हिन्दी प्रयोग है।
- source_word: צַדִּיקִים
  choice: धर्मियों
  rationale: צַדִּיקִים का मूल अर्थ धर्मी या न्यायी जन है। ‘धर्मियों’ नैतिक और वाचा-संबंधी विस्तार को बनाए रखता है; केवल कानूनी निर्दोषता तक अर्थ को सीमित नहीं करता।
theological_decisions:
- issue: צַדִּיקִים को व्यापक नैतिक श्रेणी के रूप में अनूदित किया जाए या केवल न्यायिक निर्दोषता के रूप में
  choice: धर्मियों
  alternative: निर्दोषों
  rationale: ‘धर्मियों’ इब्रानी शब्द के व्यापक नैतिक अर्थ को सुरक्षित रखता है। ‘निर्दोषों’ प्रसंग में संभव है, पर अर्थ को केवल अपराधरहित पीड़ितों तक सीमित कर सकता है।
- issue: बहुवचन कृदंत הַשֹּׁפְכִים का संबंध किनसे है
  choice: नबियों और याजकों—दोनों से संबंधित खुला बहुवचन संबंधवाचक उपवाक्य
  alternative: केवल निकटतम संज्ञा ‘याजकों’ से संबंध
  rationale: व्याकरणतः बहुवचन कृदंत दोनों बहुवचन समूहों को समेट सकता है और पद की समानांतर संरचना दोनों वर्गों को दोषी ठहराती प्रतीत होती है। हिन्दी ‘जिन्होंने’ इस संयुक्त संबंध को स्वाभाविक रूप से व्यक्त करता है, बिना अतिरिक्त व्याख्या जोड़े।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सुबोध रखी गई है। पद कारणसूचक वाक्यांश से आरंभ होता है और संदर्भतः पिछले कथन का कारण बताता है; हिन्दी में पूर्ण वाक्य बनाने के लिए ‘यह … हुआ’ जोड़ा गया है। ‘याजक’ और ‘धर्मी’ जैसे स्थापित बाइबलीय शब्द अर्थ-सटीकता और शैलीगत गरिमा के लिए रखे गए हैं।
