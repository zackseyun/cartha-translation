id: LAM.4.11
reference: Lamentations 4:11
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: כִּלָּ֤ה יְהוָה֙ אֶת חֲמָת֔/וֹ שָׁפַ֖ךְ חֲר֣וֹן אַפּ֑/וֹ וַ/יַּצֶּת אֵ֣שׁ בְּ/צִיּ֔וֹן וַ/תֹּ֖אכַל יְסוֹדֹתֶֽי/הָ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/004/011.yaml
  text: Yahweh has exhausted his wrath[a]; he has poured out his burning anger. He kindled a fire in Zion[b], and it consumed her foundations.
translation:
  language: hi
  text: याहवे ने अपना कोप पूरा कर दिया है[a]; उसने अपना धधकता क्रोध[b] उँडेल दिया है। उसने सिय्योन में आग भड़काई, और वह उसकी नींवों को भस्म कर गई।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘अपना कोप पूरी तरह खर्च कर दिया है’ अथवा ‘अपने कोप को अंत तक पहुँचा दिया है।’
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, ‘अपने क्रोध की जलन’; इसका अर्थ ‘अपना प्रचंड क्रोध’ भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּלָּה
  choice: पूरा कर दिया है
  rationale: यह क्रिया किसी बात को उसकी पूरी सीमा तक पहुँचा देने या पूर्णतः समाप्त कर देने का भाव रखती है। ‘पूरा कर दिया है’ मूल की संभावित द्विअर्थता को बनाए रखता है; पादटिप्पणी इसके ‘पूरी तरह खर्च कर दिया’ वाले अर्थ को स्पष्ट करती है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय आधुनिक हिन्दी में लिप्यंतरित किया गया है।
- source_word: חֲמָתוֹ
  choice: अपना कोप
  rationale: חֵמָה यहाँ न्यायपूर्ण प्रचंड रोष को व्यक्त करता है; ‘कोप’ संक्षिप्त, गरिमापूर्ण और काव्यात्मक हिन्दी है।
- source_word: שָׁפַךְ
  choice: उँडेल दिया है
  rationale: क्रोध को द्रव के समान उँडेलने का मूल रूपक सुरक्षित रखा गया है।
- source_word: חֲרוֹן אַפּוֹ
  choice: अपना धधकता क्रोध
  rationale: यह चयन क्रोध की तपन और तीव्रता दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וַיַּצֶּת אֵשׁ
  choice: आग भड़काई
  rationale: मूल क्रिया आग लगाने अथवा उसे प्रज्वलित करने का अर्थ देती है; ‘आग भड़काई’ उसका सजीव चित्र बनाए रखता है।
- source_word: בְּצִיּוֹן
  choice: सिय्योन में
  rationale: 'पूर्वसर्ग בְ का सामान्य स्थानवाचक अर्थ रखा गया है: आग सिय्योन के भीतर भड़काई गई।'
- source_word: וַתֹּאכַל
  choice: भस्म कर गई
  rationale: आग द्वारा पूरी तरह नष्ट किए जाने के लिए यह स्वाभाविक हिन्दी है और इब्रानी में ‘आग’ से क्रिया का संबंध बनाए रखती है।
- source_word: יְסוֹדֹתֶיהָ
  choice: उसकी नींवों
  rationale: स्त्रीलिंग एकवचन प्रत्यय सिय्योन की ओर संकेत करता है। हिन्दी में ‘उसकी’ इसी संबंध को स्वाभाविक ढंग से व्यक्त करता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा या ‘प्रभु’
  rationale: मूल पाठ व्यक्तिगत वाचा-नाम का प्रयोग करता है; उसे उपाधि से बदलने के बजाय लिप्यंतरित करना स्रोत की विशिष्टता बनाए रखता है।
- issue: ईश्वरीय न्याय में कोप और धधकते क्रोध की समानांतर अभिव्यक्तियाँ
  choice: दोनों अलग अभिव्यक्तियों को बनाए रखना
  alternative: दोनों को केवल ‘क्रोध’ में मिला देना
  rationale: इब्रानी में חֵמָה और חֲרוֹן אַף संबंधित पर अलग पद हैं। दोनों को रखना विलाप की काव्यात्मक तीव्रता और न्याय के चित्रण को सुरक्षित रखता है।
- issue: כִּלָּה से व्यक्त कोप की पूर्णता
  choice: ‘पूरा कर दिया’ की व्यापक अभिव्यक्ति
  alternative: ‘पूरी तरह खर्च कर दिया’ या ‘समाप्त कर दिया’
  rationale: मूल क्रिया पूर्ण करने और पूरी तरह खपा देने, दोनों भावों की अनुमति देती है। मुख्य पाठ इस तनाव को खुला रखता है और पादटिप्पणी विकल्प बताती है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की है, पर विलाप-काव्य की गरिमा बनाए रखने के लिए ‘कोप’, ‘धधकता’ और ‘भस्म’ जैसे सशक्त पद चुने गए हैं। दोनों पादटिप्पणी-चिह्न संबंधित पदों के तुरंत बाद रखे गए हैं।
