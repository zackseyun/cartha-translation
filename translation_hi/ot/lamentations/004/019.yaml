base_translation:
  language: en
  yaml_path: translation/ot/lamentations/004/019.yaml
  text: Our pursuers were swifter than the eagles of the heavens[a]; on the mountains they pursued us; in the wilderness they lay in wait for us.
translation:
  language: hi
  text: हमारा पीछा करने वाले आकाश के उकाबों[a] से तेज़ थे; पहाड़ों पर उन्होंने हमारा पीछा किया, और वीराने में वे हमारे लिए घात लगाए बैठे थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘आकाश के गिद्धों’; इब्रानी शब्द נֶשֶׁר कुछ संदर्भों में गिद्ध को भी सूचित कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: קַלִּים
  choice: तेज़
  rationale: מִן के साथ यह तुलनात्मक अर्थ देता है; ‘से भी तेज़’ स्वाभाविक हिन्दी में तुलना और काव्यात्मक तीव्रता दोनों व्यक्त करता है।
- source_word: רֹדְפֵינוּ
  choice: हमारा पीछा करनेवाले
  rationale: רדף का सीधा अर्थ पीछा करना या खदेड़ना है। यह रूप तत्काल पीछा किए जाने की छवि रखता है और ‘सतानेवाले’ जैसी व्यापक व्याख्या से बचता है।
- source_word: מִנִּשְׁרֵי שָׁמָיִם
  choice: आकाश के उकाबों
  rationale: נֶשֶׁר उकाब अथवा कुछ संदर्भों में गिद्ध को सूचित कर सकता है। गति की उपमा में ‘उकाब’ उपयुक्त है; ‘आकाश के’ שָׁמָיִם की काव्यात्मक अभिव्यक्ति बनाए रखता है।
- source_word: עַל הֶהָרִים
  choice: पहाड़ों पर
  rationale: यह स्थानसूचक वाक्यांश का सीधा, स्वाभाविक और भू-दृश्य को सुरक्षित रखने वाला अनुवाद है।
- source_word: דְּלָקֻנוּ
  choice: उन्होंने हमारा पीछा किया
  rationale: דלק तीव्रता से पीछा करने का भाव रखता है। हिन्दी में ‘पीछा किया’ स्पष्ट और स्वाभाविक है; पद के पहले खंड की पुनरावृत्ति काव्यात्मक समानांतरता भी बनाए रखती है।
- source_word: בַּמִּדְבָּר
  choice: वीराने में
  rationale: מִדְבָּר केवल रेतीले मरुस्थल तक सीमित नहीं, बल्कि निर्जन वन्य प्रदेश भी हो सकता है। ‘वीराना’ इस व्यापक अर्थ और असुरक्षित निर्जनता को व्यक्त करता है।
- source_word: אָרְבוּ לָנוּ
  choice: वे हमारे लिए घात लगाए बैठे थे
  rationale: ארב छिपकर अवसर की प्रतीक्षा करने को दर्शाता है। ‘घात लगाए बैठे थे’ इस जारी और योजनाबद्ध प्रतीक्षा को स्वाभाविक हिन्दी में व्यक्त करता है।
