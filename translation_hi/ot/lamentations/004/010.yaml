language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: יְדֵ֗י נָשִׁים֙ רַחֲמָ֣נִיּ֔וֹת בִּשְּׁל֖וּ יַלְדֵי/הֶ֑ן הָי֤וּ לְ/בָרוֹת֙ לָ֔/מוֹ בְּ/שֶׁ֖בֶר בַּת עַמִּֽ/י־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/004/010.yaml
  text: The hands of compassionate women cooked their own children[b][a]; they became food for them in the destruction of the daughter of my people.
translation:
  language: hi
  text: करुणामयी स्त्रियों के हाथों ने अपने ही बच्चों को पकाया[a]; मेरी प्रजा की बेटी[b] के विनाश में वे उन्हीं का भोजन बन गए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “अपने ही बच्चों को उबाला।” इब्रानी क्रिया का अर्थ भोजन पकाना है और यह प्रायः उबालकर पकाने के लिए प्रयुक्त होती है।
    reason: lexical_alternative
  - marker: b
    text: “मेरी प्रजा की बेटी” एक इब्रानी काव्यात्मक अभिव्यक्ति है, जिसमें प्रजा—विशेषकर यरूशलेम या सिय्योन—को उसकी तबाही में एक स्त्री के रूप में चित्रित किया गया है।
    reason: cultural_note
lexical_decisions:
- source_word: יְדֵי
  choice: हाथों ने
  rationale: इब्रानी की सजीव और भयावह छवि बनाए रखने के लिए केवल ‘स्त्रियों ने’ कहकर इसे सरल नहीं किया गया।
- source_word: נָשִׁים רַחֲמָנִיּוֹת
  choice: करुणामयी स्त्रियों
  rationale: यह विशेषण स्त्रियों के सामान्य करुणामय स्वभाव और अकाल में घटी भयावह घटना के बीच तीखा विरोध प्रकट करता है।
- source_word: בִּשְּׁלוּ
  choice: पकाया
  rationale: क्रिया भोजन पकाने को दर्शाती है और विशेष रूप से उबालने का अर्थ भी दे सकती है; मुख्य पाठ में व्यापक और स्वाभाविक हिन्दी शब्द रखा गया है।
- source_word: יַלְדֵיהֶן
  choice: अपने ही बच्चों को
  rationale: ‘अपने ही’ इब्रानी के संबंधवाचक प्रत्यय की मार्मिकता को स्वाभाविक हिन्दी में स्पष्ट करता है।
- source_word: הָיוּ לְבָרוֹת לָמוֹ
  choice: वे उनके लिए भोजन बन गए
  rationale: बच्चों के स्त्रियों के भोजन बन जाने का परिणाम सीधे और बिना नरमी के व्यक्त किया गया है।
- source_word: בְּשֶׁבֶר
  choice: विनाश के समय
  rationale: संज्ञा टूटने, बरबादी या महाविपत्ति का बोध कराती है; यहाँ यरूशलेम की तबाही के संदर्भ में ‘विनाश’ स्पष्ट है।
- source_word: בַּת עַמִּי
  choice: मेरी प्रजा की बेटी
  rationale: मूल काव्यात्मक मानवीकरण को बनाए रखा गया है, यद्यपि इसकी व्याख्या पाठक की सहायता के लिए पादटिप्पणी में दी गई है।
theological_decisions:
- issue: בַּת עַמִּי के काव्यात्मक मुहावरे को ज्यों का त्यों रखना या उसका भावार्थ देना
  choice: मेरी प्रजा की बेटी
  alternative: मेरी प्रजा
  rationale: शाब्दिक काव्यात्मक रूप विलाप के मानवीकरण और भावात्मक तीव्रता को सुरक्षित रखता है; इसे केवल ‘मेरी प्रजा’ करने से वह साहित्यिक आयाम मिट जाता।
- issue: मानव-मांस भक्षण की भयावहता को कितनी स्पष्टता से व्यक्त करना
  choice: अपने ही बच्चों को पकाया; वे उनके लिए भोजन बन गए
  alternative: अपने बच्चों को भोजन के लिए तैयार किया
  rationale: मूल पाठ जानबूझकर कठोर और सीधा है। अनुवाद इसे न तो नरम करता है, न उससे आगे कोई अतिरिक्त विवरण जोड़ता है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में है, पर विलाप की गरिमा और मूल की कठोर छवियाँ सुरक्षित रखी गई हैं। ‘करुणामयी’ साहित्यिक किंतु सामान्यतः बोधगम्य है; ‘मेरी प्रजा की बेटी’ को जानबूझकर काव्यात्मक रखा गया है और पादटिप्पणी से स्पष्ट किया गया है।
