  yaml_path: translation/ot/lamentations/004/015.yaml
  text: “Turn aside! Unclean!” they cried to them[a]. “Turn aside, turn aside, do not touch!” For they have fled; they have even wandered. Among the nations they said[b], “They will stay no longer.”
translation:
  language: hi
  text: “हट जाओ! अशुद्ध!” उन्होंने उनसे पुकारकर कहा। “हट जाओ, हट जाओ, छूना मत!” क्योंकि वे भाग निकले[a]; वे भटकते भी रहे। राष्ट्रों के बीच उन्होंने कहा, “वे अब और नहीं ठहरेंगे[b]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उन्हें भगा दिया गया”; यहाँ प्रयुक्त इब्रानी क्रिया दुर्लभ है और इस प्रसंग में उसके ठीक भाव पर मतभेद है।
    reason: lexical_alternative
  - marker: b
    text: या, “वे अब और परदेशी होकर निवास नहीं करेंगे”; इब्रानी क्रिया में किसी स्थान पर परदेशी या अस्थायी निवासी के रूप में रहने का भाव है।
    reason: lexical_alternative
lexical_decisions:
- source_word: סוּרוּ
  choice: हट जाओ
  rationale: बहुवचन आज्ञार्थक पुकार है। ‘हट जाओ’ दूरी बनाए रखने की सार्वजनिक चेतावनी को स्वाभाविक हिन्दी में व्यक्त करता है; इसकी पुनरावृत्ति काव्यात्मक बल बनाए रखती है।
- source_word: טָמֵא
  choice: अशुद्ध
  rationale: यह धार्मिक और सामाजिक अशुद्धता का पद है, जिसे यहाँ पहचान बताने वाली पुकार के रूप में रखा गया है।
- source_word: קָרְאוּ לָמוֹ
  choice: लोग उन्हें पुकारकर कहते थे
  rationale: קרא के साथ ל निर्देशित पुकार को दर्शाता है। मूल में कर्ता स्पष्ट नहीं है; ‘लोग’ अनिर्दिष्ट सार्वजनिक समूह को सहज हिन्दी में व्यक्त करता है।
- source_word: אַל תִּגָּעוּ
  choice: छूना मत
  rationale: निषेधात्मक रूप का सीधा अर्थ ‘स्पर्श न करना’ है और अशुद्धता के प्रसंग में शारीरिक संपर्क से बचने का भाव स्वयं स्पष्ट रहता है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पहले की चेतावनी और आगे वर्णित दशा के बीच कारणात्मक संबंध व्यक्त करता है।
- source_word: נָצוּ
  choice: वे भाग गए
  rationale: दुर्लभ क्रिया यहाँ भाग जाने या भगा दिए जाने का बोध करा सकती है। मुख्य पाठ में प्रसंगानुकूल सक्रिय अर्थ चुना गया है और कर्मवाच्य संभावना पादटिप्पणी में रखी गई है।
- source_word: גַּם נָעוּ
  choice: वे भटकते भी रहे
  rationale: נוע विस्थापित होकर भटकने या डगमगाने का अर्थ दे सकता है। इस प्रसंग में ‘भटकते रहे’ निर्वासन और अस्थिरता से मेल खाता है; ‘भी’ גַּם को व्यक्त करता है।
- source_word: אָמְרוּ בַּגּוֹיִם
  choice: राष्ट्रों के बीच लोग कहते थे
  rationale: ב कथन के स्थान या सामाजिक क्षेत्र को दर्शाता है। मूल में कहने वालों की पहचान अनिर्दिष्ट है, इसलिए हिन्दी में सामान्य ‘लोग’ रखा गया है।
- source_word: לֹא יוֹסִיפוּ לָגוּר
  choice: वे अब और नहीं ठहरेंगे
  rationale: גור किसी स्थान में परदेशी या अस्थायी निवासी के रूप में रहने का संकेत देता है। ‘अब और नहीं ठहरेंगे’ सहज हिन्दी है; अधिक विशिष्ट अर्थ पादटिप्पणी में सुरक्षित है।
