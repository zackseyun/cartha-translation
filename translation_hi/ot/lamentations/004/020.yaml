reference: Lamentations 4:20
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: ר֤וּחַ אַפֵּ֨י/נוּ֙ מְשִׁ֣יחַ יְהוָ֔ה נִלְכַּ֖ד בִּ/שְׁחִיתוֹתָ֑/ם אֲשֶׁ֣ר אָמַ֔רְנוּ בְּ/צִלּ֖/וֹ נִֽחְיֶ֥ה בַ/גּוֹיִֽם׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/004/020.yaml
  text: The breath of our nostrils[a], Yahweh’s anointed, was captured in their pits—he of whom we said, “Under his shadow we will live among the nations.”
translation:
  language: hi
  text: हमारे नथनों की साँस, याहवे का अभिषिक्त, उनके गड्ढों[a] में पकड़ा गया—जिसके विषय में हमने कहा था, “उसकी छाया तले हम राष्ट्रों के बीच जीवित रहेंगे।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उनके फंदों” अथवा “उनके जालों” में।
    reason: इब्रानी शब्द ‘गड्ढों’ के साथ-साथ विनाशकारी फंदों या जालों को भी सूचित कर सकता है।
lexical_decisions:
- source_word: ר֤וּחַ אַפֵּ֨ינוּ֙
  choice: हमारे नथनों की साँस
  rationale: यह पदबंध जीवनदायी साँस का सजीव शारीरिक रूपक है। इसे ‘हमारा जीवन’ कहने से मूल बिंब मिट जाता, जबकि ‘आत्मा’ या ‘वायु’ इस प्रसंग में कम उपयुक्त हैं।
- source_word: מְשִׁ֣יחַ יְהוָ֔ה
  choice: याहवे का अभिषिक्त जन
  rationale: מְשִׁיחַ का मूल अर्थ अभिषिक्त व्यक्ति है और यहाँ तत्काल संदर्भ यहूदा के राजा का है। ‘अभिषिक्त जन’ राजकीय-धार्मिक पदवी को बनाए रखता है, पर पद को सीधे भावी मसीहा के विषय में कथन नहीं बनाता।
- source_word: נִלְכַּ֖ד
  choice: पकड़ा गया
  rationale: निफ़अल रूप पकड़े या फँसाए जाने को व्यक्त करता है। ‘पकड़ा गया’ सैन्य-राजनीतिक संदर्भ में स्वाभाविक है और गड्ढों के रूपक के साथ भी मेल खाता है।
- source_word: בִּשְׁחִיתוֹתָם
  choice: उनके गड्ढों में
  rationale: संज्ञा विनाशकारी गड्ढों या फंदों का संकेत दे सकती है। मुख्य पाठ में ठोस बिंब ‘गड्ढों’ रखा गया है और अन्य संभव अर्थ पादटिप्पणी में दिए गए हैं।
- source_word: אֲשֶׁ֣ר אָמַ֔רְנוּ
  choice: वही, जिसके विषय में हमने कहा था
  rationale: संबंधवाचक उपवाक्य फिर से याहवे के अभिषिक्त जन की ओर संकेत करता है। यह हिंदी में स्पष्ट और स्वाभाविक है; भूतकालीन ‘कहा था’ पकड़े जाने से पहले की आशा को व्यक्त करता है।
- source_word: בְּצִלּ֖וֹ
  choice: उसकी छाया तले
  rationale: मूल छाया के रूपक द्वारा संरक्षण और राजकीय आश्रय व्यक्त करता है। ‘छाया तले’ रूपक को समझाए बिना स्वाभाविक हिंदी में सुरक्षित रखता है।
- source_word: נִֽחְיֶ֥ה
  choice: हम जीवित रहेंगे
  rationale: क्रिया का सीधा अर्थ जीना है। संदर्भ में बच निकलने या सुरक्षित रहने की छटा हो सकती है, पर ‘जीवित रहेंगे’ मूल की व्यापकता बनाए रखता है।
- source_word: בַגּוֹיִם
  choice: राष्ट्रों के बीच
  rationale: यहाँ גּוֹיִם विदेशी राष्ट्रों या लोगों को दर्शाता है। ‘राष्ट्रों के बीच’ निर्वासन-संबंधी राजनीतिक संदर्भ में स्पष्ट है और नए नियम से जुड़ी ‘अन्यजाति’ जैसी विशिष्ट शब्दावली से बचता है।
theological_decisions:
- issue: क्या מְשִׁיחַ יְהוָה का अनुवाद ऐसा हो जो सीधे अंतिम मसीहा की ओर संकेत करे
  choice: ऐतिहासिक दाऊदी राजा के लिए ‘याहवे का अभिषिक्त जन’
  alternative: ‘याहवे का मसीहा’
  rationale: यद्यपि यही इब्रानी शब्द आगे चलकर ‘मसीहा’ की पदवी से जुड़ता है, विलापगीत 4 का निकट संदर्भ यहूदा के पकड़े गए राजा का है। इसलिए अर्थपूर्ण राजकीय पदवी को रखा गया है, पर पाठ में प्रत्यक्ष भावी-मसीही भविष्यवाणी नहीं जोड़ी गई।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘नथनों की साँस’ और ‘छाया तले’ जैसे मूल इब्रानी बिंब सुरक्षित हैं। पादटिप्पणी-चिह्न उसी शब्द के बाद रखा गया है जिससे उसका lexical विकल्प संबंधित है।
