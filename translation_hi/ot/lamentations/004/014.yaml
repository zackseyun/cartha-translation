  yaml_path: translation/ot/lamentations/004/014.yaml
  text: They wandered blind through the streets[a], defiled with blood[b], so that they could not touch their garments.
translation:
  language: hi
  text: वे सड़कों पर अंधे भटकते रहे[a], खून से अशुद्ध हुए[b], यहाँ तक कि वे अपने वस्त्रों को छू नहीं सकते थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “अंधे” का अर्थ “अंधों की तरह” भी हो सकता है। हिब्रू में स्पष्ट तुलना-सूचक शब्द नहीं है।
    reason: alternative_reading
  - marker: b
    text: “अशुद्ध” में केवल खून से सने होने का नहीं, बल्कि अपवित्र हो जाने का भाव भी है। अंतिम उपवाक्य का अर्थ यह भी हो सकता है कि लोग उनके वस्त्रों को छू नहीं सकते थे।
    reason: lexical_and_syntactic_ambiguity
lexical_decisions:
- source_word: נָעוּ
  choice: भटकते रहे
  rationale: क्रिया दिशाहीन अथवा लड़खड़ाती गति व्यक्त कर सकती है; संदर्भ में ‘भटकते रहे’ स्वाभाविक है और उनकी दिग्भ्रमित दशा बनाए रखता है।
- source_word: עִוְרִים
  choice: अंधों की तरह
  rationale: हिब्रू में तुलना-सूचक अव्यय नहीं है और पद का शाब्दिक अर्थ ‘अंधे’ है; हिन्दी में ‘अंधों की तरह’ संभावित उपमात्मक भाव को स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है, जबकि वैकल्पिक शाब्दिक संरचना पादटिप्पणी में दी गई है।
- source_word: בַּחוּצוֹת
  choice: गलियों में
  rationale: यह नगर की सड़कों या खुले स्थानों को सूचित करता है; ‘गलियों में’ विलाप के शहरी दृश्य के अनुरूप सरल आधुनिक हिन्दी है।
- source_word: נְגֹאֲלוּ
  choice: अशुद्ध हुए
  rationale: निफ़अल रूप यहाँ केवल खून लगने से अधिक, अपवित्र अथवा दूषित हो जाने का भाव रखता है; ‘अशुद्ध’ धार्मिक-शुद्धता की ध्वनि को सुरक्षित रखता है।
- source_word: בַּדָּם
  choice: खून से
  rationale: पूर्वसर्ग अशुद्धि के साधन या पदार्थ को दिखाता है; ‘खून से’ स्पष्ट और स्वाभाविक हिन्दी है।
- source_word: בְּלֹא יֽוּכְלוּ יִגְּעוּ
  choice: यहाँ तक कि वे ... छू नहीं सकते थे
  rationale: हिब्रू वाक्यांश संक्षिप्त और वाक्य-विन्यास की दृष्टि से कठिन है। क्रिया का व्याकरणिक कर्ता ‘वे’ हो सकता है, इसलिए मुख्य पाठ में उसी को रखा गया है; दूसरे सम्भव कर्ता को पादटिप्पणी में बताया गया है।
- source_word: בִּלְבֻשֵׁיהֶם
  choice: अपने वस्त्रों को
  rationale: प्रत्यय ‘उनके’ का अर्थ देता है, पर समान कर्ता के साथ हिन्दी में ‘अपने’ अधिक स्वाभाविक है; ‘वस्त्र’ काव्यात्मक और गरिमामय शैली बनाए रखता है।
theological_decisions:
- issue: ‘छू नहीं सकते थे’ का कर्ता
  choice: मुख्य पाठ में ‘वे’—अर्थात पहले उल्लिखित लोग
  alternative: दूसरे लोग उनके वस्त्र नहीं छू सकते थे
  rationale: हिब्रू में बहुवचन क्रिया का कर्ता व्यक्त नहीं है। निकटतम व्याकरणिक निरंतरता ‘वे’ का समर्थन करती है, पर अशुद्धि के संदर्भ में दूसरे लोगों का उनसे संपर्क न कर पाना भी सम्भव है; इसलिए अस्पष्टता पादटिप्पणी में सुरक्षित रखी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमामय काव्यात्मक शैली रखी गई है। ‘खून’ सामान्य पाठक के लिए ‘रक्त’ से अधिक सहज है, जबकि ‘वस्त्र’ विलाप की ऊँची शैली बनाए रखता है।
