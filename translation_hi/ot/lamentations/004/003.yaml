    text: या “समुद्री दैत्य” अथवा “अजगर”; यहाँ תנין का अर्थ “गीदड़ियाँ” लिया गया है, क्योंकि अपने बच्चों को दूध पिलाने का वर्णन इस प्रसंग में स्थलचर पशु से अधिक मेल खाता है।
