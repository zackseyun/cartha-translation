  text: गीदड़ियाँ भी अपने थन आगे करती हैं[a]; वे अपने बच्चों को दूध पिलाती हैं। पर मेरी प्रजा की बेटी क्रूर हो गई है—मरुभूमि के शुतुरमुर्गों के समान[b]।
  philosophy: optimal-equivalence
  footnotes:
