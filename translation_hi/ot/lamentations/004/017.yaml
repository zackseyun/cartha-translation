source:
  edition: WLC
  text: עוד/ינה תִּכְלֶ֣ינָה עֵינֵ֔י/נוּ אֶל עֶזְרָתֵ֖/נוּ הָ֑בֶל בְּ/צִפִּיָּתֵ֣/נוּ צִפִּ֔ינוּ אֶל גּ֖וֹי לֹ֥א יוֹשִֽׁעַ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/004/017.yaml
  text: Still our eyes failed[a], looking in vain for our help; in our watching we watched for a nation that could not save.
translation:
  language: hi
  text: अब भी हमारी आँखें सहायता की राह देखते-देखते व्यर्थ थक गईं; प्रतीक्षा करते हुए हम उस राष्ट्र की राह देखते रहे, जो बचा नहीं सका।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “हम उस राष्ट्र की प्रतीक्षा करते रहे, जिसने नहीं बचाया।” हिब्रू क्रिया का अर्थ “राह देखना,” “प्रतीक्षा करना” या “ताक लगाए देखना” हो सकता है; अंतिम वाक्यांश असमर्थता या वास्तविक विफलता—दोनों को व्यक्त कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: עוֹדֶינָה
  choice: अब भी
  rationale: यह निरंतर बनी हुई दशा को व्यक्त करता है और विलाप के प्रवाह में स्वाभाविक हिन्दी है।
- source_word: תִּכְלֶינָה עֵינֵינוּ
  choice: हमारी आँखें ... थक गईं
  rationale: כלה यहाँ लगातार प्रतीक्षा करते-करते आँखों के चुक जाने या क्षीण पड़ने का काव्यात्मक बिंब देता है; हिन्दी में यह प्रयोग अर्थ और बिंब दोनों को सहज रखता है।
- source_word: אֶל־עֶזְרָתֵנוּ הָבֶל
  choice: सहायता की बाट जोहते-जोहते ... पर वह व्यर्थ थी
  rationale: मूल वाक्य-विन्यास संक्षिप्त है। यह अनुवाद सहायता की ओर लगी दृष्टि और उसकी निष्फलता दोनों को स्पष्ट करता है, बिना הבל को केवल क्रियाविशेषण मानने पर निर्भर हुए।
- source_word: בְּצִפִּיָּתֵנוּ צִפִּינוּ
  choice: अपनी प्रतीक्षा में हम ... बाट जोहते रहे
  rationale: संज्ञा और उसी मूल की क्रिया की पुनरुक्ति को यथासंभव बनाए रखते हुए watchful expectation का स्वाभाविक हिन्दी रूप दिया गया है।
- source_word: גּוֹי
  choice: राष्ट्र
  rationale: प्रसंग में किसी विदेशी राजनीतिक शक्ति से उद्धार की आशा है, इसलिए ‘राष्ट्र’ उपयुक्त है।
- source_word: לֹא יוֹשִׁעַ
  choice: बचा नहीं सका
  rationale: ישׁע के हिफ़ील रूप का मूल अर्थ ‘बचाना/छुड़ाना’ है। ‘नहीं सका’ व्यावहारिक असमर्थता को व्यक्त करता है, जबकि पादटिप्पणी साधारण भूतकाल की सम्भावना सुरक्षित रखती है।
theological_decisions:
- issue: לֹא יוֹשִׁעַ में असमर्थता या वास्तविक विफलता
  choice: जो बचा नहीं सका
  alternative: जिसने नहीं बचाया
  rationale: हिब्रू दोनों अर्थों की गुंजाइश देता है। मुख्य पाठ प्रसंगगत व्यावहारिक असमर्थता को अपनाता है और पादटिप्पणी वास्तविक विफलता वाला विकल्प दर्ज करती है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण काव्यात्मक गद्य; ‘बाट जोहना’ सामान्यतः समझ में आने वाला मुहावरा है और आँखों से प्रतीक्षा करने के मूल बिंब को बनाए रखता है।
