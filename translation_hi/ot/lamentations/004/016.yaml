base_translation:
  language: en
  yaml_path: translation/ot/lamentations/004/016.yaml
  text: The face of Yahweh has scattered them[a]; he will no longer look on them. They showed no regard for priests[c][b]; they showed no favor to elders.
translation:
  language: hi
  text: 'याहवे के मुख ने उन्हें तितर-बितर कर दिया है[a];


    वह फिर कभी उनकी ओर दृष्टि नहीं करेगा।


    उन्होंने याजकों का लिहाज़ नहीं किया[b],


    और बुज़ुर्गों पर कृपा नहीं की[c]।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “याहवे की उपस्थिति ने उन्हें बाँट दिया/तितर-बितर कर दिया है”; इब्रानी में शाब्दिक रूप से “याहवे का मुख” है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “उन्होंने याजकों का मुख नहीं उठाया”; यह आदर, लिहाज़ या अनुग्रह दिखाने का मुहावरा है।
    reason: lexical_alternative
  - marker: c
    text: या, “बुज़ुर्गों पर दया नहीं की।”
    reason: lexical_alternative
lexical_decisions:
- source_word: פְּנֵי יְהוָה
  choice: याहवे के मुख
  rationale: ‘मुख’ मूल के सजीव मानवरूपी बिंब और पद्यात्मक प्रभाव को बनाए रखता है; यहाँ यह याहवे की उपस्थिति का भी द्योतक हो सकता है। परमेश्वर के व्यक्तिगत नाम יְהוָה को ‘याहवे’ लिखा गया है।
- source_word: חִלְּקָם
  choice: उन्हें तितर-बितर कर दिया है
  rationale: पिएल रूप यहाँ न्याय के प्रसंग में लोगों को बाँटकर बिखेर देने या तितर-बितर करने का भाव देता है।
- source_word: לֹא יוֹסִיף לְהַבִּיטָם
  choice: अब वह फिर उनकी ओर दृष्टि नहीं करेगा
  rationale: יֹסִיף के साथ निषेध का अर्थ ‘फिर नहीं’ है, और הביט का मूल भाव देखना है। ‘दृष्टि नहीं करेगा’ हिन्दी में संबंधपरक और न्यायिक रंग को बिना अधिक व्याख्या के व्यक्त करता है।
- source_word: פְּנֵי כֹהֲנִים לֹא נָשָׂאוּ
  choice: उन्होंने याजकों का आदर नहीं किया
  rationale: शाब्दिक रूप से ‘याजकों का मुख नहीं उठाया’; यह किसी के प्रति मान, लिहाज़ या अनुग्रह दिखाने का मुहावरा है। ‘आदर नहीं किया’ इस प्रसंग में स्वाभाविक और स्पष्ट है।
- source_word: זקנים
  choice: बुज़ुर्गों
  rationale: यह शब्द वृद्ध जनों या समुदाय के प्राचीनों/मुखियाओं, दोनों का संकेत दे सकता है। ‘बुज़ुर्ग’ आधुनिक हिन्दी में इस वास्तविक अस्पष्टता को पर्याप्त रूप से बनाए रखता है।
- source_word: לֹא חָנָנוּ
  choice: कृपा नहीं की
  rationale: חנן का अर्थ कृपा, अनुग्रह या दया करना है। ‘कृपा नहीं की’ पूर्ववर्ती समानांतर पंक्ति से मेल खाता है, जबकि ‘दया नहीं की’ भी संभव है।
theological_decisions:
- issue: परमेश्वर के लिए मानवरूपी ‘मुख’ का प्रयोग
  choice: ‘याहवे के मुख’ को मुख्य पाठ में बनाए रखा गया।
  alternative: ‘याहवे की उपस्थिति’ या ‘याहवे स्वयं’
  rationale: मूल इब्रानी की ठोस काव्यात्मक छवि को अमूर्त बनाकर हटाना उचित नहीं; ‘मुख’ परमेश्वर की सक्रिय उपस्थिति दर्शाता है, बिना उसके शारीरिक स्वरूप के बारे में कोई सिद्धांत स्थापित किए।
- issue: अंतिम दो क्रियाओं के कर्ता की पहचान
  choice: मूल के अनुसार केवल ‘उन्होंने’ रखा गया, बिना यह तय किए कि ये लोग कौन हैं।
  alternative: इसे स्पष्ट रूप से शत्रुओं, राष्ट्रों या यरूशलेम के लोगों से जोड़ना
  rationale: इस पद में बहुवचन कर्ता स्पष्ट नाम से नहीं दिया गया है; अनुवाद में उसकी पहचान जोड़ना मूल की अस्पष्टता को अनुचित रूप से समाप्त कर देता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की है, किंतु विलापगीत की गरिमा और पंक्तिगत काव्यात्मक समानता बनाए रखी गई है। ‘याजक’, ‘दृष्टि’ और ‘कृपा’ जैसे परिचित धार्मिक-साहित्यिक शब्द सामान्य पाठक के लिए बोधगम्य रहते हुए गंभीर शैली देते हैं।
