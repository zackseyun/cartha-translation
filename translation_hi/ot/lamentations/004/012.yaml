base_translation:
  language: en
  yaml_path: translation/ot/lamentations/004/012.yaml
  text: The kings of the earth did not believe[a], nor did any of the inhabitants of the world, that an adversary and an enemy would enter the gates of Jerusalem.
translation:
  language: hi
  text: पृथ्वी के राजाओं ने विश्वास नहीं किया, और न संसार के किसी निवासी ने, कि कोई विरोधी और शत्रु यरूशलेम के फाटकों में प्रवेश करेगा[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “यरूशलेम के फाटकों में आएगा।” इब्रानी क्रिया केवल “आना” कहती है; यहाँ “प्रवेश करेगा” संदर्भ का भाव स्पष्ट करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶאֱמִינוּ
