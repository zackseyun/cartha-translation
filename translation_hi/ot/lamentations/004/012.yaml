- source_word: כִּי
  choice: कि
  rationale: यहाँ כִּי उस बात को प्रस्तुत करता है जिस पर विश्वास नहीं किया गया, कारण को नहीं।
- source_word: יָבֹא
  choice: प्रवेश करेगा
  rationale: मूल क्रिया का सामान्य अर्थ ‘आएगा’ है, पर ‘फाटकों में’ के साथ यहाँ नगर में प्रवेश का भाव है; भविष्यसूचक ‘करेगा’ संभाव्यता जोड़ने के बजाय इब्रानी रूप को दर्शाता है।
- source_word: צַר
  choice: विरोधी
  rationale: यह चयन अगले सामान्य शब्द ‘शत्रु’ से lexical भेद बनाए रखता है और शत्रुतापूर्ण प्रतिपक्षी का अर्थ देता है।
- source_word: וְאוֹיֵב
  choice: और शत्रु
  rationale: אוֹיֵב का सामान्य अर्थ ‘शत्रु’ है; संयोजक के साथ दोनों संज्ञाओं का जोर सुरक्षित रखा गया है।
- source_word: בְּשַׁעֲרֵי יְרוּשָׁלִָם
  choice: यरूशलेम के फाटकों में
  rationale: गति-सूचक क्रिया के साथ בְ नगर के फाटकों के भीतर प्रवेश का संकेत देता है; ‘फाटक’ प्राचीन नगर-द्वार के लिए स्वाभाविक हिन्दी है।
