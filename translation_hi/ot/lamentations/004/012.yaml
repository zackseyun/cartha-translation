- source_word: מַלְכֵי אֶרֶץ
  choice: पृथ्वी के राजा
  rationale: समानांतर पद ‘संसार के निवासी’ के कारण אֶרֶץ का व्यापक अर्थ ‘पृथ्वी’ उपयुक्त है।
- source_word: וְכָל יֹשְׁבֵי תֵבֵל
  choice: और न संसार के किसी निवासी ने
