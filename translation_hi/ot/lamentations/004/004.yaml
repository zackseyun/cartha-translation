id: LAM.4.4
reference: Lamentations 4:4
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: דָּבַ֨ק לְשׁ֥וֹן יוֹנֵ֛ק אֶל חכּ֖/וֹ בַּ/צָּמָ֑א עֽוֹלָלִים֙ שָׁ֣אֲלוּ לֶ֔חֶם פֹּרֵ֖שׂ אֵ֥ין לָ/הֶֽם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/004/004.yaml
  text: The tongue of the nursing infant sticks to the roof of his mouth because of thirst[a]; children ask for bread[b], but no one breaks it for them.
translation:
  language: hi
  text: दूध पीते शिशु की जीभ प्यास के कारण उसके तालू से चिपक जाती है[a]; छोटे बच्चे रोटी माँगते हैं, पर उनके लिए उसे तोड़ने वाला कोई नहीं है[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसके मुँह के ऊपरी भाग से।”
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “उनके लिए रोटी तोड़ने वाला कोई नहीं।” यहाँ रोटी तोड़ने का आशय उसे बाँटकर देने से भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: דָּבַק
  choice: चिपक जाती है
  rationale: क्रिया किसी वस्तु के कसकर लगे या चिपके रहने को दर्शाती है; वर्तमानकालीन अभिव्यक्ति अकाल के दृश्य को सजीव और स्वाभाविक रखती है।
- source_word: לְשׁוֹן
  choice: जीभ
  rationale: यह शरीर के अंग का सीधा उल्लेख है, इसलिए सामान्य और सटीक हिन्दी शब्द रखा गया है।
- source_word: יוֹנֵק
  choice: दूध पीते शिशु
  rationale: यह अभी दूध पीने की अवस्था में रहे बच्चे को दर्शाता है; यह अभिव्यक्ति आधुनिक हिन्दी में स्पष्ट और करुण दृश्य के अनुकूल है।
- source_word: אֶל חכּוֹ
  choice: उसके तालू से
  rationale: חֵךְ मुख के भीतर के तालू को दर्शाता है; ‘तालू’ हिन्दी में संक्षिप्त, स्वाभाविक और सटीक है।
- source_word: בַּצָּמָא
  choice: प्यास के कारण
  rationale: पूर्वसर्ग सहित संज्ञा यहाँ कारण या परिस्थिति व्यक्त करती है; ‘प्यास के कारण’ कारणात्मक भाव स्पष्ट करता है।
- source_word: עוֹלָלִים
  choice: छोटे बच्चे
  rationale: यह शब्द कम आयु के बच्चों को सूचित करता है; ‘छोटे बच्चे’ उनकी असहायता और आयु दोनों स्पष्ट करता है।
- source_word: שָׁאֲלוּ
  choice: माँगते हैं
  rationale: मूल क्रिया का सामान्य अर्थ माँगना है; प्रसंग की व्याकुलता को बनाए रखते हुए ‘भीख माँगना’ जैसा अधिक प्रबल अर्थ नहीं जोड़ा गया।
- source_word: לֶחֶם
  choice: रोटी
  rationale: ठोस खाद्य-वस्तु का बिंब सुरक्षित रखा गया है; आधुनिक हिन्दी में ‘रोटी’ לֶחֶם का स्वाभाविक संदर्भानुकूल रूप है।
- source_word: פֹּרֵשׂ
  choice: उसे तोड़ने वाला
  rationale: प्रसंग में कृदंत रोटी तोड़कर बाँटने या देने की क्रिया को सूचित करता है; मुख्य पाठ में मूल बिंब बनाए रखा गया है।
- source_word: אֵין לָהֶם
  choice: उनके लिए ... कोई नहीं है
  rationale: इब्रानी का शाब्दिक ढाँचा ‘उनके लिए कोई नहीं’ है; हिन्दी में कृदंत के साथ यह संरचना स्वाभाविक और अर्थपूर्ण है।
