id: LAM.4.7
reference: Lamentations 4:7
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: זַכּ֤וּ נְזִירֶ֨י/הָ֙ מִ/שֶּׁ֔לֶג צַח֖וּ מֵ/חָלָ֑ב אָ֤דְמוּ עֶ֨צֶם֙ מִ/פְּנִינִ֔ים סַפִּ֖יר גִּזְרָתָֽ/ם׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/004/007.yaml
  text: Her princes were purer than snow[a], whiter than milk; their bodies were more ruddy than corals[c][b], their form was like sapphire.
translation:
  language: hi
  text: उसके विशिष्ट जन[a] हिम से भी अधिक निर्मल और दूध से भी अधिक उजले थे; उनके शरीर मूँगों[b] से भी अधिक लाल थे, उनकी देहयष्टि नीलम[c] के समान थी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘उसके नाज़ीर’ अथवा ‘उसके समर्पित जन।’ इब्रानी शब्द व्रत के द्वारा अलग किए गए लोगों को सूचित कर सकता है, पर यहाँ यरूशलेम के प्रतिष्ठित जन भी अभिप्रेत हो सकते हैं।
    reason: alternative_reading
  - marker: b
    text: ‘मूँगे’ के लिए प्रयुक्त इब्रानी शब्द की ठीक पहचान अनिश्चित है; इसका अर्थ माणिक, मोती या कोई अन्य बहुमूल्य पदार्थ भी हो सकता है।
    reason: lexical_alternative
  - marker: c
    text: ‘नीलम’ के लिए प्रयुक्त प्राचीन शब्द सम्भवतः आधुनिक नीलम के बजाय लाजवर्द को सूचित करता था।
    reason: cultural_note
lexical_decisions:
- source_word: נְזִירֶיהָ
  choice: उसके विशिष्ट जन
  rationale: मूल शब्द का आधारभूत भाव अलग किए या समर्पित व्यक्ति का है और यह ‘नाज़ीर’ भी सूचित कर सकता है; इस प्रसंग में यरूशलेम के प्रतिष्ठित जन सम्भव हैं। ‘विशिष्ट जन’ संदर्भगत अर्थ देता है, जबकि वास्तविक अनिश्चितता पादटिप्पणी में सुरक्षित है।
- source_word: זַכּוּ
  choice: अधिक निर्मल
  rationale: क्रिया शुद्धता या निर्मलता बताती है; हिम के साथ מִן तुलना को ‘से भी अधिक’ स्वाभाविक ढंग से व्यक्त करता है।
- source_word: צַחוּ
  choice: अधिक उजले
  rationale: क्रिया चमकीली उज्ज्वलता अथवा सफेदी व्यक्त करती है। ‘उजले’ दूध से तुलना और काव्यात्मक गरिमा दोनों बनाए रखता है।
- source_word: עֶצֶם
  choice: शरीर
  rationale: शब्द का सामान्य अर्थ ‘हड्डी’ है, पर यहाँ वह शरीर या शारीरिक बनावट के लिए प्रयुक्त प्रतीत होता है; ‘शरीर’ हिन्दी में अनावश्यक शारीरिक-विज्ञान संबंधी विचित्रता से बचाता है।
- source_word: אָדְמוּ
  choice: अधिक लाल थे
  rationale: क्रिया लाल या रक्तिम होने को व्यक्त करती है। ‘अधिक लाल’ मूल की सीधी तुलना को सुरक्षित रखता है।
- source_word: פְּנִינִים
  choice: मूँगे
  rationale: बहुवचन संज्ञा किसी बहुमूल्य पदार्थ या रत्न को सूचित करती है जिसकी ठीक पहचान अनिश्चित है। लालिमा के संदर्भ में ‘मूँगे’ उपयुक्त है; अन्य सम्भावनाएँ पादटिप्पणी में दी गई हैं।
- source_word: גִּזְרָתָם
  choice: उनकी देहयष्टि
  rationale: यह आकृति, गठन या रूप को दर्शाता है। मनुष्यों के शारीरिक स्वरूप के लिए ‘देहयष्टि’ सटीक, संक्षिप्त और काव्यात्मक है।
- source_word: סַפִּיר
  choice: नीलम
  rationale: परंपरागत और सहज हिन्दी नाम ‘नीलम’ रखा गया है, पर प्राचीन पत्थर की पहचान आधुनिक नीलम से भिन्न होकर लाजवर्द भी हो सकती है; यह पादटिप्पणी में स्पष्ट है।
theological_decisions:
- issue: נְזִירֶיהָ की पहचान
  choice: मुख्य पाठ में ‘विशिष्ट जन’
  alternative: ‘उसके नाज़ीर’ या ‘उसके समर्पित जन’
  rationale: शब्द के धार्मिक-व्रत संबंधी अर्थ को निश्चित मानना या इसे बिना संकेत केवल राजकुमार कहना मूल की वास्तविक संदिग्धता को दबा सकता है। व्यापक संदर्भ प्रतिष्ठित नगरवासियों की ओर संकेत करता है, इसलिए तटस्थ संदर्भगत पद मुख्य पाठ में और विकल्प पादटिप्पणी में रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण काव्यात्मक शैली अपनाई गई है। समानांतर तुलनाओं में ‘से भी अधिक’ मूल की चार तुलनात्मक מִן रचनाओं को स्पष्ट करता है। ‘विशिष्ट जन’ सामान्य पाठक के लिए स्वाभाविक है और विवादित धार्मिक/सामाजिक पहचान को पादटिप्पणी में खुला रखता है।
