source:
  edition: WLC
  text: חָשַׁ֤ךְ מִ/שְּׁחוֹר֙ תָּֽאֳרָ֔/ם לֹ֥א נִכְּר֖וּ בַּ/חוּצ֑וֹת צָפַ֤ד עוֹרָ/ם֙ עַל עַצְמָ֔/ם יָבֵ֖שׁ הָיָ֥ה כָ/עֵֽץ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/004/008.yaml
  text: Their appearance is darker than soot[a]; they are not recognized in the streets. Their skin has shriveled on their bones[b]; it has become dry like wood.
translation:
  language: hi
  text: उनका रूप कालिख से भी अधिक काला हो गया है[a]; वे सड़कों पर पहचाने नहीं जाते। उनकी त्वचा उनकी हड्डियों पर सिकुड़ गई है[b]; वह लकड़ी के समान सूख गई है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “कालेपन से भी अधिक काला।” इब्रानी शब्द सामान्य रूप से कालेपन का बोध करा सकता है; यहाँ ठोस दृश्य बिंब के लिए “कालिख” रखा गया है।
    reason: lexical_alternative
  - marker: b
    text: या, “उनकी त्वचा उनकी हड्डियों से चिपक गई है।” इब्रानी क्रिया त्वचा के सिकुड़कर हड्डियों पर कस जाने का भाव दे सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: חָשַׁךְ מִשְּׁחוֹר
  choice: कालिख से भी अधिक काला हो गया है
  rationale: तुलनात्मक מִן को ‘से भी अधिक’ से व्यक्त किया गया है। חָשַׁךְ परिणामी दशा सहित काला पड़ने का भाव देता है; שְׁחוֹר के ठोस दृश्य बिंब के लिए ‘कालिख’ चुना गया है, जबकि सामान्य ‘कालापन’ की संभावना पादटिप्पणी में रखी गई है।
- source_word: תָּאֳרָם
  choice: उनका रूप
  rationale: תֹּאַר बाहरी रूप या दिखाई देने वाली आकृति को सूचित करता है। ‘रूप’ सहज, संक्षिप्त और गरिमापूर्ण हिन्दी है।
- source_word: לֹא נִכְּרוּ בַּחוּצוֹת
  choice: वे सड़कों पर पहचाने नहीं जाते
  rationale: निफ़अल रूप के निष्क्रिय भाव को बनाए रखा गया है; חוּצוֹת के लिए नगर के सार्वजनिक मार्गों के अर्थ में ‘सड़कें’ स्वाभाविक है।
- source_word: צָפַד עוֹרָם עַל עַצְמָם
  choice: उनकी त्वचा उनकी हड्डियों पर सिकुड़ गई है
  rationale: צָפַד अकाल से त्वचा के सिकुड़कर हड्डियों पर कस जाने का चित्र देता है। मुख्य पाठ में ‘सिकुड़ गई’ रखा गया है और ‘हड्डियों से चिपक गई’ को वास्तविक अर्थ-विकल्प के रूप में पादटिप्पणी में दिया गया है।
- source_word: יָבֵשׁ הָיָה כָעֵץ
  choice: वह लकड़ी के समान सूख गई है
  rationale: एकवचन क्रिया का संबंध ‘त्वचा’ से रखा गया है। עֵץ को यहाँ पेड़ के बजाय सूखी, निर्जीव और कठोर लकड़ी के बिंब के रूप में समझना संदर्भानुकूल है।
