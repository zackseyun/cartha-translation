  text: 'मेरी आँख मेरे प्राण को पीड़ा पहुँचाती है,

    मेरे नगर की सब बेटियों के कारण।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עֵינִי
  choice: मेरी आँख
  rationale: एकवचन और काव्यात्मक देह-अंग की अभिव्यक्ति को बनाए रखा गया है; इसे व्याख्यात्मक रूप से ‘जो मैं देखता हूँ’ नहीं बनाया गया।
- source_word: עוֹלְלָה
  choice: दुख देती है
  rationale: यहाँ क्रिया का भाव बुरा व्यवहार करने या पीड़ा पहुँचाने का है; संदर्भ में आँख द्वारा देखी गई दशा वक्ता के भीतर दुख उत्पन्न करती है।
- source_word: לְנַפְשִׁי
  choice: मेरे प्राण को
  rationale: נפשׁ के काव्यात्मक, आंतरिक-व्यक्ति संबंधी अर्थ को ‘प्राण’ से व्यक्त किया गया है, बिना इसे केवल ‘मन’ तक सीमित किए।
- source_word: מִכֹּל בְּנוֹת עִירִי
  choice: मेरे नगर की सब बेटियों के कारण
  rationale: מִן को प्रसंगानुसार कारणसूचक माना गया है और ‘नगर की बेटियाँ’ की मूल काव्यात्मक अभिव्यक्ति सुरक्षित रखी गई है।
