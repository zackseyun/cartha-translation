  text: יִתֵּ֤ן בֶּֽ/עָפָר֙ פִּ֔י/הוּ אוּלַ֖י יֵ֥שׁ תִּקְוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/003/029.yaml
  text: Let him put his mouth in the dust—perhaps there is hope[a].
translation:
  language: hi
  text: वह अपना मुँह धूल में रखे—शायद आशा हो[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वह अपना मुँह धूल में रख दे”; यह अभिव्यक्ति गहरी विनम्रता, दीनता, या मौन समर्पण की मुद्रा दर्शाती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: יִתֵּן
  choice: रखे
  rationale: נתן का मूल अर्थ ‘देना/रखना’ है। इस उपदेशात्मक क्रम में अपूर्ण क्रिया का भाव आज्ञार्थक/प्रेरणार्थक है, इसलिए ‘वह…रखे’ स्वाभाविक और स्रोत के निकट है।
- source_word: בֶּעָפָר
  choice: धूल में
  rationale: עָפָר धूल या सूखी मिट्टी को दर्शाता है। ‘धूल में’ शारीरिक दीनता के ठोस बिंब और बाइबलीय अनुगूँज, दोनों को बनाए रखता है।
- source_word: פִּיהוּ
  choice: अपना मुँह
  rationale: शाब्दिक अर्थ ‘उसका मुँह’ है; हिन्दी में कर्ता से संबंध स्पष्ट करने के लिए ‘अपना मुँह’ अधिक स्वाभाविक है। बिंब को ‘चुप रहे’ जैसे अर्थानुवाद से नहीं बदला गया।
- source_word: אוּלַי
  choice: शायद
  rationale: यह शब्द संभावना और अनिश्चित अपेक्षा व्यक्त करता है। ‘शायद’ आधुनिक हिन्दी में सहज है और आशा की अनिश्चितता बनाए रखता है।
- source_word: יֵשׁ
  choice: हो
  rationale: अस्तित्वसूचक יֵשׁ को אוּלַי के साथ हिन्दी में स्वाभाविक रूप से ‘शायद…हो’ कहा जाता है; इससे ‘आशा विद्यमान हो’ का भाव बना रहता है।
- source_word: תִּקְוָה
  choice: आशा
  rationale: תִּקְוָה का सामान्य अर्थ ‘आशा/अपेक्षा’ है। विलाप के प्रसंग में ‘आशा’ सर्वाधिक स्वाभाविक और उपयुक्त है।
theological_decisions:
- issue: दीनता और समर्पण की मुहावरेदार शारीरिक मुद्रा
  choice: ‘अपना मुँह धूल में रखे’ का ठोस बिंब बनाए रखा गया।
  alternative: ‘दीन होकर झुके’ या ‘अपमान में चुप रहे’।
  rationale: यह अभिव्यक्ति गहरी दीनता, आत्म-नमन या मौन समर्पण का संकेत दे सकती है, पर इब्रानी पाठ इन अर्थों को शारीरिक बिंब के माध्यम से खुला छोड़ता है। इसलिए मुख्य पाठ में किसी एक व्याख्या को आरोपित नहीं किया गया।
- issue: आशा की निश्चितता
  choice: ‘शायद आशा हो’ द्वारा अनिश्चित संभावना बनाए रखी गई।
  alternative: ‘तब आशा मिलेगी’ या ‘अभी भी आशा है’।
  rationale: אוּלַי स्पष्ट रूप से संभावना व्यक्त करता है; इसे निश्चित प्रतिज्ञा में बदलना पाठ की धार्मिक और भावात्मक तनातनी को मिटा देता।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और काव्यात्मक शैली रखी गई है। ‘मुँह धूल में रखना’ का असामान्य किंतु सजीव बिंब जानबूझकर सुरक्षित रखा गया है; पादटिप्पणी उसके संभावित आशय को बिना निर्णायक बनाए स्पष्ट करती है।
