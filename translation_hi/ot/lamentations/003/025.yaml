  yaml_path: translation/ot/lamentations/003/025.yaml
  text: Yahweh is good to those who wait for him[a], to the soul that seeks him.
translation:
  language: hi
  text: याहवे उन लोगों के लिए भला है जो उसकी बाट जोहते हैं[a], उस व्यक्ति के लिए जो उसे खोजता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जो उस पर आशा रखते हैं”; इब्रानी क्रिया में आशापूर्ण अपेक्षा के साथ बाट जोहने का भाव है।
    reason: lexical_alternative
lexical_decisions:
- source_word: טוֹב
  choice: भला
  rationale: यह विशेषण याहवे के चरित्र और उन लोगों के प्रति उसके हितकारी व्यवहार, दोनों का व्यापक अर्थ बनाए रखता है; हिंदी में ‘के प्रति भला है’ स्वाभाविक है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय हिंदी लिप्यंतरण में रखा गया है।
- source_word: לְקֹוָו
  choice: उन लोगों के प्रति जो उसकी बाट जोहते हैं
  rationale: קוה में प्रतीक्षा के साथ आशापूर्ण अपेक्षा का भाव है। ‘बाट जोहते हैं’ विलंब के बीच सक्रिय और धैर्यपूर्ण प्रतीक्षा को व्यक्त करता है; बहुवचन रूप भी सुरक्षित है।
- source_word: לְנֶפֶשׁ
  choice: उस प्राणी के प्रति
  rationale: נפש यहाँ समूचे व्यक्ति को सूचित करता है। ‘प्राणी’ काव्यात्मक गरिमा बनाए रखते हुए आधुनिक हिंदी में ‘आत्मा’ से उत्पन्न तकनीकी देह-आत्मा अर्थ को अनावश्यक रूप से आरोपित नहीं करता।
- source_word: תִּדְרְשֶׁנּוּ
  choice: जो उसे खोजता है
  rationale: דרש जब परमेश्वर को कर्म बनाता है, तब संबंधपरक और आध्यात्मिक रूप से खोजने का अर्थ देता है। पुल्लिंग ‘खोजता’ हिंदी में ‘प्राणी’ के व्याकरणिक लिंग से मेल खाता है, जबकि इब्रानी स्त्रीलिंग क्रिया נפש से सहमति रखती है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा
  rationale: मूल पाठ में व्यक्तिगत वाचा-नाम सीधे आया है; ‘याहवे’ उसे ‘प्रभु’ जैसी उपाधि से प्रतिस्थापित किए बिना प्रस्तुत करता है।
- issue: קוה में प्रतीक्षा और आशा का संयुक्त भाव
  choice: उसकी बाट जोहते हैं
  alternative: उस पर आशा रखते हैं
  rationale: विलापगीत के संदर्भ में यह चयन दुःख के बीच धैर्यपूर्वक प्रतीक्षा का तनाव बनाए रखता है, जबकि आशापूर्ण अपेक्षा का वास्तविक अर्थ पादटिप्पणी में दिया गया है।
- issue: נפש का मानवीय अर्थ
  choice: प्राणी
  alternative: आत्मा
  rationale: यहाँ शब्द पूरे व्यक्ति के लिए प्रयुक्त हो सकता है। ‘प्राणी’ काव्यात्मक समानांतरता बचाता है, पर पाठ पर किसी विशिष्ट देह-आत्मा सिद्धांत को नहीं थोपता।
translation_notes:
  register: भाषा आधुनिक मानक हिंदी में काव्यात्मक और गरिमापूर्ण रखी गई है। ‘बाट जोहना’ सामान्य पाठक के लिए बोधगम्य रहते हुए विलाप-काव्य की धैर्यपूर्ण अपेक्षा व्यक्त करता है। पहले पदांश के ‘के प्रति’ को दूसरे में दोहराने से इब्रानी समानांतरता स्पष्ट रहती है।
