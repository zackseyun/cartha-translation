  yaml_path: translation/ot/lamentations/003/039.yaml
  text: Why should a living man complain, a man, about his sins?
translation:
  language: hi
  text: जीवित मनुष्य क्यों शिकायत करे—कोई पुरुष अपने पाप को लेकर?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יִתְאוֹנֵן
  choice: शिकायत करे
  rationale: हित्पोएल रूप यहाँ दुःख या विपत्ति पर शिकायत करने अथवा कुड़कुड़ाने का भाव देता है; ‘शिकायत करे’ आधुनिक, स्वाभाविक और गरिमापूर्ण है।
- source_word: אָדָם חָי
  choice: जीवित मनुष्य
  rationale: मूल के सामान्य मानव-संज्ञा אָדָם और विशेषण חָי को सीधे तथा स्वाभाविक रूप में रखा गया है।
- source_word: גֶּבֶר
  choice: कोई पुरुष
  rationale: दूसरी मानव-संज्ञा को अलग शब्द से व्यक्त कर मूल की पुनरुक्ति और lexical variation सुरक्षित रखी गई है। ‘कोई’ हिन्दी में प्रश्न की दूसरी समानांतर इकाई को स्वाभाविक बनाता है।
- source_word: עַל חטאו
  choice: अपने पाप को लेकर
  rationale: עַל का अर्थ यहाँ ‘के विषय में/को लेकर’ हो सकता है; यह चयन शिकायत के विषय और कारण के बीच मूल की कुछ अर्थगत खुलावट बनाए रखता है। व्यंजन-पाठ और प्रत्यय एकवचन ‘अपने पाप’ का समर्थन करते हैं।
theological_decisions:
- issue: क्या पद मनुष्य के पाप की सज़ा को शिकायत का विषय बताता है?
  choice: ‘अपने पाप को लेकर’—केवल वही कहा गया है जो इब्रानी में स्पष्ट है।
  alternative: ‘अपने पापों की सज़ा के कारण’
  rationale: मूल पाठ में ‘सज़ा’ के लिए कोई स्पष्ट शब्द नहीं है; उसे जोड़ना व्याख्या को अनुवाद में स्थिर कर देता।
- issue: חטאו की संख्या
  choice: एकवचन ‘अपने पाप’
  alternative: बहुवचन ‘अपने पापों’
  rationale: प्रस्तुत WLC पाठ חטאו, ‘उसका/अपना पाप’, एकवचन का समर्थन करता है; इसलिए अंग्रेज़ी परामर्श-पाठ के बहुवचन को नहीं अपनाया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी; संक्षिप्त, काव्यात्मक और गरिमापूर्ण। डैश इब्रानी की समानांतर पुनरुक्ति को स्पष्ट करता है, जबकि प्रश्नचिह्न पूरे वाक्य को एक ही आलंकारिक प्रश्न बनाए रखता है।
