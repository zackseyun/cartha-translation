translation:
  language: hi
  text: तूने उनका सारा बदला देखा है, और मेरे विरुद्ध उनकी सारी योजनाएँ देखी हैं।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘मेरे विषय में उनकी सारी योजनाएँ।’ इब्रानी में यह संबंध अधिक तटस्थ भी हो सकता है, पर शत्रुतापूर्ण संदर्भ ‘मेरे विरुद्ध’ का समर्थन करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: רָאִיתָה
  choice: तूने ... देखा है
  rationale: यह ראה का काल पूर्ण, द्वितीय पुरुष एकवचन पुल्लिंग रूप है और परमेश्वर को संबोधित करता है। हिन्दी में पूर्ण वर्तमान भूतकाल की पूरी हुई क्रिया और वर्तमान प्रासंगिकता दोनों को स्वाभाविक रूप से व्यक्त करता है।
- source_word: כָּל
  choice: सारा / सारी
  rationale: दोनों प्रयोगों में समग्रता का भाव है; हिन्दी में संबद्ध संज्ञाओं के लिंग के अनुसार ‘सारा’ और ‘सारी’ स्वाभाविक हैं।
- source_word: נִקְמָתָם
  choice: उनका सारा बदला
  rationale: נְקָמָה प्रतिशोध या बदला लेने की क्रिया को व्यक्त करता है। ‘बदला’ आधुनिक सामान्य हिन्दी में स्पष्ट है और शत्रुओं की प्रतिशोधपूर्ण कार्रवाई का बल बनाए रखता है।
- source_word: מַחְשְׁבֹתָם
  choice: उनकी सारी योजनाएँ
  rationale: מַחֲשָׁבוֹת का अर्थ विचार, योजनाएँ या युक्तियाँ हो सकता है। ‘योजनाएँ’ मूल की अपेक्षाकृत तटस्थ व्यापकता को सुरक्षित रखता है; विरोधी भाव ‘मेरे विरुद्ध’ और संदर्भ से प्रकट होता है।
- source_word: לִי
  choice: मेरे विरुद्ध
  rationale: לְ संबंध, दिशा या लक्ष्य दिखा सकता है। शत्रुतापूर्ण संदर्भ में ‘मेरे विरुद्ध’ स्वाभाविक है, पर अधिक तटस्थ ‘मेरे विषय में’ भी व्याकरणतः संभव है।
