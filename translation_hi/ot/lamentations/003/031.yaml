  naturalness: “प्रभु सदा के लिए त्याग नहीं देगा” is understandable but awkward in modern standard Hindi. “प्रभु सदा के लिए ठुकराएगा नहीं” is natural, concise, and retains the relational sense.
  terminology: “प्रभु” appropriately translates the divine title. “ठुकराएगा” is a clear primary rendering of זנח; the lexical alternatives can remain in a footnote.
  issues:
