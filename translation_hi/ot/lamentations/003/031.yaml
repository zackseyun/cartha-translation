base_translation:
  language: en
  yaml_path: translation/ot/lamentations/003/031.yaml
  text: For the Lord will not reject forever[a].
translation:
  language: hi
  text: क्योंकि प्रभु सदा के लिए ठुकराएगा नहीं[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “त्यागेगा” अथवा “छोड़ देगा।” इब्रानी क्रिया का अर्थ ठुकराना, त्यागना, या अलग कर देना हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह आसपास के कथन का आधार या स्पष्टीकरण प्रस्तुत करता है। ‘क्योंकि’ आधुनिक हिन्दी में इसके संयोजक और कारणसूचक बल को स्वाभाविक रूप से व्यक्त करता है।
- source_word: לֹא
  choice: नहीं
  rationale: यह क्रिया का सीधा निषेध है; किसी विस्तार की आवश्यकता नहीं है।
- source_word: יִזְנַח
  choice: त्याग नहीं देगा
  rationale: זנח का अर्थ ठुकराना, त्याग देना या छोड़ देना हो सकता है। ‘त्याग नहीं देगा’ सम्बन्धपरक सन्दर्भ में स्वाभाविक हिन्दी है और स्थायी परित्याग का भाव अपने आप नहीं जोड़ता, क्योंकि अवधि לְעוֹלָם से स्पष्ट होती है।
- source_word: לְעוֹלָם
  choice: सदा के लिए
  rationale: यहाँ עוֹלָם दीर्घ अथवा अनन्त अवधि को दर्शाता है। निषेध के साथ अर्थ है कि प्रभु का त्याग स्थायी नहीं होगा।
- source_word: אֲדֹנָי
  choice: प्रभु
  rationale: यह परमेश्वर के लिए प्रयुक्त उपाधि ‘प्रभु’ है, न कि चतुरक्षरीय दिव्य नाम। हिन्दी में बिना अनावश्यक विस्तार के ‘प्रभु’ स्वाभाविक और प्रतिष्ठित रूप है।
theological_decisions:
- issue: दिव्य उपाधि का अनुवाद
  choice: प्रभु
  alternative: स्वामी
  rationale: इब्रानी पाठ में אֲדֹנָי उपाधि है। ‘प्रभु’ आधुनिक हिन्दी बाइबलीय भाषा में स्पष्ट और गरिमापूर्ण है तथा स्रोत में अनुपस्थित किसी वाचा-नाम सम्बन्धी भेद को नहीं जोड़ता।
- issue: त्याग की अवधि
  choice: प्रभु सदा के लिए त्याग नहीं देगा
  alternative: प्रभु कभी त्याग नहीं देगा
  rationale: निषेध क्रिया के साथ है और לְעוֹלָם अवधि बताता है। ‘कभी त्याग नहीं देगा’ अस्थायी अनुशासन या ठुकराए जाने की सम्भावना भी नकार सकता है, जबकि मूल कथन स्थायी त्याग का निषेध करता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध शैली। ‘सदा के लिए’ मूल की कालगत सीमा को सुरक्षित रखता है और ‘त्याग नहीं देगा’ सम्बन्धपरक अर्थ को स्वाभाविक ढंग से व्यक्त करता है।
