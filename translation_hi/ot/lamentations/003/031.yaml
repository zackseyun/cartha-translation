    rationale: Hindi “त्याग देना” normally takes an object directly (for example, “किसी को त्याग देना”); without an expressed object, “त्याग नहीं देगा” is awkward. The Hebrew verb refers to rejecting/casting off, not to giving up an unspecified object.
