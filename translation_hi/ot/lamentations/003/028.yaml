base_translation:
  language: en
  yaml_path: translation/ot/lamentations/003/028.yaml
  text: Let him sit alone and be silent[a], for he has laid it on him.
translation:
  language: hi
  text: वह अकेला बैठे और चुप रहे, क्योंकि उसने इसे उस पर डाल दिया है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “क्योंकि उसने उस पर बोझ डाला है।” इब्रानी में कर्ता (“उसने”) और कर्म (“इसे”) दोनों स्पष्ट रूप से नहीं कहे गए हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: יֵשֵׁב
  choice: वह … बैठे
  rationale: यहाँ अपूर्ण क्रिया आसपास के उपदेशात्मक क्रम में आदेशार्थक/प्रेरणार्थक भाव रखती है; इसलिए साधारण वर्तमान या भविष्य के बजाय “बैठे” स्वाभाविक है।
- source_word: בָּדָד
  choice: अकेला
  rationale: यह शब्द एकांत या अलगाव का भाव व्यक्त करता है; “अकेला” आधुनिक हिन्दी में सहज और भावपूर्ण है।
- source_word: וְיִדֹּם
  choice: और चुप रहे
  rationale: דמם यहाँ दुःख के अधीन मौन या स्थिर रहने का संकेत देता है। “चुप रहे” मौन के भाव को स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले उपदेश का कारण प्रस्तुत करता है; हिन्दी में “क्योंकि” इस कारणात्मक संबंध को स्पष्ट रखता है।
- source_word: נָטַל
  choice: रखा है
  rationale: इस क्रिया का मूल अर्थ उठाना/ले जाना है, पर עַל के साथ प्रसंग में किसी चीज़ को किसी पर रखने या लादने का भाव संभव है। “रखा है” बोझ को अनावश्यक रूप से स्पष्ट किए बिना इस अर्थ को बनाए रखता है।
- source_word: עָלָיו
  choice: उस पर
  rationale: पूर्वसर्ग और सर्वनाम का सीधा, स्वाभाविक हिन्दी रूप है।
theological_decisions:
- issue: נָטַל का अनुक्त कर्ता और अनुक्त कर्म
  choice: “उसने इसे उस पर रखा है” में कर्ता को नाम नहीं दिया गया और कर्म को केवल “इसे” कहा गया है।
  alternative: “प्रभु ने यह बोझ उस पर रखा है” अथवा “उसने इसे अपने ऊपर उठा लिया है”
  rationale: इब्रानी पाठ न तो कर्ता का स्पष्ट नाम देता है, न रखी/उठाई गई वस्तु का। इसलिए “प्रभु” या “बोझ” जोड़कर अर्थ को धर्मवैचारिक रूप से निश्चित नहीं किया गया; टिप्पणी में वैकल्पिक समझ सुरक्षित रखी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और उपदेशात्मक शैली रखी गई है। “बैठे” और “चुप रहे” समानांतर क्रियाएँ हैं; अंतिम खंड की वास्तविक इब्रानी अस्पष्टता को मुख्य पाठ और पाद-टिप्पणी में बनाए रखा गया है।
