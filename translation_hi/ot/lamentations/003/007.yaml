lexical_decisions:
- source_word: גָּדַר בַּעֲדִי
  choice: उसने मेरे चारों ओर दीवार खड़ी कर दी है
  rationale: क्रिया גדר का अर्थ दीवार उठाकर घेरना या मार्ग रोकना है। ‘मेरे चारों ओर दीवार खड़ी कर दी’ बंदी बनाए जाने के ठोस बिंब को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: וְלֹא אֵצֵא
  choice: इसलिए मैं निकल नहीं सकता
  rationale: इब्रानी का शाब्दिक अर्थ ‘और मैं बाहर नहीं निकलता/निकल सकता’ है। प्रसंग में यह घेरे जाने का परिणाम है; ‘निकल नहीं सकता’ उस असमर्थता को स्पष्ट और सहज रूप में व्यक्त करता है।
- source_word: הִכְבִּיד
  choice: भारी कर दी है
  rationale: כבד के हिफ़ील रूप का मूल अर्थ ‘भारी करना’ है। यह अनुवाद मूल के ठोस बोझ और बंधन के बिंब को सुरक्षित रखता है।
- source_word: נְחָשְׁתִּי
  choice: मेरी जंजीर
  rationale: यह दुर्लभ संज्ञा ‘काँसा/ताँबा’ से संबंधित है और यहाँ संभवतः धातु की बेड़ी या जंजीर का संकेत करती है। मुख्य पाठ में ‘जंजीर’ स्वाभाविक है, जबकि वस्तु और धातु की अनिश्चितता पादटिप्पणी में सुरक्षित रखी गई है।
