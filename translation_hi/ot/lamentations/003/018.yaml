  text: וָ/אֹמַר֙ אָבַ֣ד נִצְחִ֔/י וְ/תוֹחַלְתִּ֖/י מֵ/יְהוָֽה׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/003/018.yaml
  text: So I said[a], “My endurance has perished[b], and my hope from Yahweh.”
translation:
  language: hi
  text: तब मैंने कहा, “मेरी सहनशक्ति[a] नष्ट हो गई, और याहवे से मेरी आशा[b]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यदि נִצְחִי को सहनशक्ति के बजाय प्रतिष्ठा या महिमा के अर्थ में लिया जाए, तो अनुवाद ‘मेरा वैभव नष्ट हो गया’ भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में शाब्दिक रूप से ‘याहवे से मेरी आशा’ है। यह संक्षिप्त अभिव्यक्ति याहवे से मिलने वाली आशा या याहवे पर रखी गई आशा—दोनों का संकेत दे सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֹמַר
  choice: तब मैंने कहा
  rationale: वाव-क्रम कथन को पिछले अनुभवों के क्रम में वक्ता के निष्कर्ष के रूप में सामने लाता है। ‘तब’ आधुनिक हिन्दी में इस प्रगति को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: אָבַד
  choice: नष्ट हो गई
  rationale: אבד पूरी तरह खो जाने, मिट जाने या नष्ट होने का प्रबल भाव रखता है; विलाप के प्रसंग में ‘नष्ट हो गई’ उस तीव्रता को बनाए रखता है।
- source_word: נִצְחִי
  choice: मेरी सहनशक्ति
  rationale: נֵצַח स्थायित्व या बने रहने की क्षमता का अर्थ दे सकता है। व्यक्तिगत टूटन और आशा खोने के समानांतर यहाँ ‘सहनशक्ति’ आगे सहते रहने की क्षमता को स्वाभाविक हिन्दी में व्यक्त करती है, जबकि ‘वैभव’ एक वास्तविक वैकल्पिक अर्थ है।
- source_word: וְתוֹחַלְתִּי
  choice: और ... मेरी आशा भी
  rationale: תּוֹחֶלֶת का सामान्य अर्थ आशा या अपेक्षा है। ‘आशा’ विलाप के भाव और हिन्दी प्रयोग, दोनों के अनुकूल है; ‘भी’ समानांतर दूसरी हानि को स्पष्ट करता है, बिना कोई नया क्रियार्थ जोड़े।
- source_word: מֵיְהוָה
  choice: याहवे से
  rationale: מִן का मूल अर्थ ‘से’ है। यह संक्षिप्त इब्रानी अभिव्यक्ति आशा के स्रोत अथवा याहवे की ओर लगी आशा—दोनों की संभावना रखती है; ‘याहवे से’ इस अस्पष्टता को सुरक्षित रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: यह परमेश्वर के व्यक्तिगत नाम יהוה का आधुनिक हिन्दी लिप्यंतरण है; इसे किसी उपाधि से प्रतिस्थापित नहीं किया गया।
theological_decisions:
- issue: יהוה परमेश्वर के नाम का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में चार-अक्षरीय व्यक्तिगत नाम सीधे आया है। ‘याहवे’ उसका लिप्यंतरण करता है और नाम को उपाधि में नहीं बदलता।
- issue: נִצְחִי का प्रसंगगत अर्थ
  choice: मेरी सहनशक्ति
  alternative: मेरा वैभव; मेरी शक्ति
  rationale: विलाप में वक्ता अपनी आगे टिके रहने की क्षमता और आशा, दोनों के समाप्त होने की बात करता है। फिर भी ‘वैभव’ शब्द का संभव शाब्दिक अर्थ है, इसलिए उसे पादटिप्पणी में रखा गया है।
- issue: מֵיְהוָה में आशा का संबंध
  choice: याहवे से मेरी आशा
  alternative: याहवे में मेरी आशा; याहवे से मिलने वाली मेरी आशा
  rationale: इब्रानी वाक्य क्रियारहित और संक्षिप्त है। शाब्दिक ‘से’ आशा के स्रोत और आशा के संबंध-विषय के बीच मौजूद वास्तविक अस्पष्टता को खुला रखता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। दूसरे उपवाक्य की इब्रानी संक्षिप्तता और क्रियारहित संरचना को जानबूझकर बनाए रखा गया है, ताकि ‘से’ के संबंध को किसी एक व्याख्या में सीमित न किया जाए।
