translation:
  language: hi
  text: 'वह मेरे लिए घात लगाए बैठा भालू है,

    छिपे हुए स्थानों में सिंह।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: דֹּב
  choice: भालू
  rationale: यह संज्ञा स्पष्ट रूप से भालू को दर्शाती है; हिन्दी में विधेय के रूप में अनिश्चित उपपद आवश्यक नहीं है।
- source_word: אֹרֵב
  choice: घात लगाए बैठा हुआ
  rationale: ארב का कृदन्त जानबूझकर छिपकर आक्रमण की प्रतीक्षा करने का भाव देता है; यह पद शिकारी और शत्रुतापूर्ण बिंब को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: הוּא
  choice: वह ... है
  rationale: स्वतंत्र सर्वनाम स्पष्ट कर्ता है; हिन्दी की स्वाभाविक विधेयात्मक रचना में सहायक क्रिया ‘है’ जोड़ी गई है।
- source_word: לִי
  choice: मेरे लिए
  rationale: घात के प्रसंग में यह पूर्वसर्ग वक्ता को हमले के लक्ष्य के रूप में दिखाता है; ‘मेरे लिए घात लगाए’ हिन्दी में इसी संबंध को स्पष्ट करता है।
- source_word: אריה
  choice: सिंह
  rationale: संज्ञा सिंह को दर्शाती है और भालू के समानांतर दूसरा हिंसक पशु-बिंब प्रस्तुत करती है।
- source_word: בְּמִסְתָּרִים
  choice: छिपने के स्थानों में
  rationale: बहुवचन संज्ञा गुप्त या ओट वाले स्थानों को दर्शाती है; ठोस अभिव्यक्ति घात के बिंब को बनाए रखती है।
