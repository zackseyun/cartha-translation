lexical_decisions:
- source_word: צָמְתוּ
  choice: अंत कर दिया
  rationale: क्रिया का अर्थ काट देना, समाप्त कर देना या नष्ट कर देना हो सकता है। ‘मेरे जीवन का अंत कर दिया’ आधुनिक हिन्दी में स्वाभाविक है और प्रसंग में मृत्यु के प्रयास की तीव्रता बनाए रखता है।
- source_word: בַבּוֹר
  choice: गड्ढे में
  rationale: בּוֹר गड्ढे, हौद या बन्दीगृह जैसे गहरे स्थान को सूचित कर सकता है। ‘गड्ढा’ व्यापक अर्थ को सुरक्षित रखता है और अनावश्यक वास्तु-स्पष्टता नहीं जोड़ता।
- source_word: חַיַּי
  choice: मेरे जीवन
  rationale: प्रथम पुरुष प्रत्यय वाला बहुवचन रूप यहाँ मुहावरे के रूप में ‘मेरा जीवन’ अर्थ देता है।
- source_word: וַיַּדּוּ
  choice: फेंका
  rationale: यह क्रिया फेंकने या डालने को व्यक्त करती है। ‘फेंका’ स्पष्ट और आधुनिक हिन्दी है।
- source_word: אֶבֶן
  choice: एक पत्थर
  rationale: एकवचन संज्ञा का स्वाभाविक हिन्दी रूप ‘एक पत्थर’ है।
- source_word: בִּי
  choice: मुझ पर
  rationale: पूर्वसर्ग בְּ सम्पर्क, दिशा या किसी के ऊपर रखे जाने का भाव दे सकता है। ‘मुझ पर’ हिन्दी में पत्थर फेंकने और गड्ढे को पत्थर से बन्द करने—दोनों सम्भावनाओं के प्रति अपेक्षाकृत खुला रहता है।
