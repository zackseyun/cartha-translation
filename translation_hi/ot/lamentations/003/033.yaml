  text: כִּ֣י לֹ֤א עִנָּה֙ מִ/לִּבּ֔/וֹ וַ/יַּגֶּ֖ה בְנֵי אִֽישׁ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/003/033.yaml
  text: For he does not afflict from his heart or grieve the sons of men[a][b].
translation:
  language: hi
  text: क्योंकि वह मनुष्य के पुत्रों को अपने मन से दुःख नहीं देता और न उन्हें शोक में डालता है।[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक अर्थ: “अपने हृदय से”; अर्थात् अपनी इच्छा या अंतरतम प्रवृत्ति से।'
    reason: lexical_alternative
  - marker: b
    text: “मनुष्य के पुत्र” इब्रानी अभिव्यक्ति है, जिसका अर्थ मनुष्य या मानवजाति है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले कथन का कारण या आधार बताता है; हिन्दी में ‘क्योंकि’ इस व्याख्यात्मक-कारणसूचक संबंध को स्वाभाविक रूप से व्यक्त करता है।
- source_word: לֹא
  choice: नहीं
  rationale: मूल के सीधे निषेध को स्पष्ट और स्वाभाविक हिन्दी में रखता है।
- source_word: עִנָּה
  choice: दुःख देता
  rationale: यहाँ क्रिया किसी को कष्ट या क्लेश पहुँचाने के अर्थ में है। ‘दुःख देता’ सामान्य आधुनिक हिन्दी में समझने योग्य है और अर्थ की व्यापकता बनाए रखता है।
- source_word: מִלִּבּוֹ
  choice: मन से
  rationale: शाब्दिक अर्थ ‘अपने हृदय से’ है। हिन्दी का ‘मन से’ मूल मुहावरे की भीतरी इच्छा या प्रवृत्ति का भाव स्वाभाविक रूप में बनाए रखता है; अधिक शाब्दिक रूप पादटिप्पणी में दिया गया है।
- source_word: וַיַּגֶּה
  choice: न उन्हें शोक में डालता है
  rationale: क्रिया दुःख या शोक उत्पन्न करने को दर्शाती है। अलग पदावली पहली क्रिया के साथ अर्थगत समानता रखते हुए उसका भेद भी बचाती है।
- source_word: בְנֵי אִישׁ
  choice: मनुष्य के पुत्रों
  rationale: मूल की प्रतिनिधिक पुल्लिंग अभिव्यक्ति ‘मनुष्य के पुत्र’ को सुरक्षित रखा गया है; इसका व्यापक आशय सभी मनुष्यों से है, जिसे पादटिप्पणी स्पष्ट करती है।
theological_decisions:
- issue: परमेश्वर की भीतरी प्रवृत्ति के लिए मानवरूपी अभिव्यक्ति
  choice: मन से
  alternative: अपनी इच्छा से; अपने हृदय से
  rationale: मूल कथन न्याय और दुःख देने को परमेश्वर की अंतरतम प्रसन्नता या सहज प्रवृत्ति न होने के रूप में प्रस्तुत करता है। ‘मन से’ इस तनाव को बनाए रखता है, बिना इसे केवल अनिच्छा के अमूर्त कथन में बदलने के।
- issue: प्रतिनिधिक पुल्लिंग अभिव्यक्ति
  choice: मनुष्य के पुत्रों
  alternative: मनुष्यों; लोगों
  rationale: मूल के रूप को मुख्य पाठ में बनाए रखा गया है, जबकि पादटिप्पणी बताती है कि इसका संकेत सामान्य रूप से मानवजाति की ओर है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘मन से’ हिन्दी में स्वाभाविक है, जबकि पादटिप्पणी मूल के ‘हृदय’ वाले ठोस रूप को सुरक्षित करती है। मुख्य पाठ में दोनों क्रियाओं के बीच अर्थगत भेद रखा गया है।
