  text: סַכּ֤וֹתָה בֶֽ/עָנָן֙ לָ֔/ךְ מֵ/עֲב֖וֹר תְּפִלָּֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/003/044.yaml
  text: You have covered yourself with a cloud so that prayer cannot pass through[a].
translation:
  language: hi
  text: तूने अपने को बादल से ढक लिया है, ताकि प्रार्थना पार न जा सके।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक शाब्दिक रूप में: “तूने अपने लिए बादल से अपने को ढक लिया है, प्रार्थना के पार जाने से रोकने के लिए।”'
    reason: lexical_alternative
lexical_decisions:
- source_word: סַכּוֹתָה
  choice: तूने ... ढक लिया है
  rationale: סכך के काल रूप और परमेश्वर को किए गए सीधे एकवचन संबोधन को बनाए रखते हुए हिन्दी में पूर्ण वर्तमान-सदृश अभिव्यक्ति विलाप के जारी प्रभाव को स्वाभाविक रूप से व्यक्त करती है।
- source_word: בֶעָנָן
  choice: बादल से
  rationale: בְּ यहाँ साधन या आवरण का माध्यम व्यक्त करता है। עָנָן एकवचन है, इसलिए ‘बादल’ रखा गया है।
- source_word: לָךְ
  choice: अपने को
  rationale: शाब्दिक अर्थ ‘अपने लिए/तुझे’ है, पर סַכּוֹתָה के साथ यह आत्मवाचक अर्थ देता है; हिन्दी में ‘अपने को ... ढक लिया’ स्पष्ट और स्वाभाविक है।
- source_word: מֵעֲבוֹר
  choice: ताकि ... पार न जा सके
  rationale: מִן और עבר के infinitive construct का मेल रोक या निषेध का भाव देता है। उद्देश्य/परिणामवाचक हिन्दी खंड इस अवरोध को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: תְּפִלָּה
  choice: प्रार्थना
  rationale: एकवचन संज्ञा यहाँ जातिवाचक अर्थ में है; बिना अनिश्चित विशेषण के ‘प्रार्थना’ वही व्यापक अर्थ बनाए रखती है।
theological_decisions:
- issue: परमेश्वर का प्रार्थना को रोकने वाला मानव-सदृश चित्रण
  choice: परमेश्वर को सीधे संबोधित करते हुए यह चित्र बनाए रखा गया है कि उसने अपने को बादल से ढक लिया है और प्रार्थना पार नहीं जा सकती।
  alternative: चित्र को नरम करके ‘तू बादल में छिप गया है’ कहना, या प्रार्थना की रुकावट को निर्वैयक्तिक बनाना।
  rationale: इब्रानी पाठ परमेश्वर को सीधे संबोधित करता है और विलाप की तीखी छवि प्रस्तुत करता है। अनुवाद ईश्वरीय छिपाव और न्याय के तनाव को बिना नरम किए या समझाकर समाप्त किए सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सरल शैली। मूल के एकवचन निकट संबोधन के लिए ‘तू’ रखा गया है; यह भक्ति और विलाप की सीधी वाणी को दर्शाता है, अनादर को नहीं।
