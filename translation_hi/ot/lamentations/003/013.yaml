    reason: lexical_alternative
lexical_decisions:
- source_word: הֵבִיא
  choice: धँसा दिए
  rationale: בוא का हिफ़ील रूप यहाँ किसी वस्तु को शरीर के भीतर प्रवेश कराने का भाव देता है। तीरों के हिंसक भेदन के संदर्भ में “धँसा दिए” स्वाभाविक और सशक्त हिन्दी है।
- source_word: בְּכִלְיוֹתָי
  choice: मेरे गुर्दों में
  rationale: כִּלְיָה का शाब्दिक अर्थ “गुर्दा” है। यद्यपि यह भीतरी मन या गहरी भावनाओं का बिंब भी हो सकता है, यहाँ तीरों द्वारा शरीर भेदे जाने का ठोस शारीरिक चित्र प्रमुख है।
- source_word: בְּנֵי אַשְׁפָּתוֹ
  choice: अपने तरकश के तीर
  rationale: इब्रानी मुहावरे का शाब्दिक रूप “उसके तरकश के बेटे” है, जिसका आशय तरकश में रखे तीरों से है। मुख्य पाठ में स्पष्ट और स्वाभाविक हिन्दी “तरकश के तीर” रखी गई है, जबकि मूल बिंब पादटिप्पणी में बताया गया है।
- source_word: אַשְׁפָּתוֹ
  choice: अपने तरकश
  rationale: אַשְׁפָּה तीर रखने के पात्र, अर्थात् तरकश, को दर्शाता है। हिन्दी में “तरकश” इसका प्रचलित और सटीक शब्द है; कर्ता के साथ संबंध दिखाने के लिए “अपने” स्वाभाविक है।
