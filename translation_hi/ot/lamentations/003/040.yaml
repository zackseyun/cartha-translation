base_translation:
  language: en
  yaml_path: translation/ot/lamentations/003/040.yaml
  text: Let us examine our ways and search them out[b][a], and let us return to Yahweh.
translation:
  language: hi
  text: आओ, हम अपने मार्गों को जाँचें और उनकी छानबीन करें, और याहवे के पास लौटें[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “याहवे की ओर फिरें”; इस क्रिया में मन फिराने और पश्चात्ताप का भाव भी हो सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: נַחְפְּשָׂה
  choice: आओ, हम…जाँचें
  rationale: प्रथम पुरुष बहुवचन के आग्रहसूचक रूप को स्वाभाविक हिन्दी में ‘आओ, हम…’ से व्यक्त किया गया है। क्रिया ध्यानपूर्वक खोजने और जाँचने का भाव रखती है।
- source_word: דְרָכֵינוּ
  choice: अपने मार्गों को
  rationale: ‘मार्ग’ जीवन-व्यवहार के लिए प्रयुक्त इब्रानी रूपक को बनाए रखता है; केवल ‘आचरण’ कहने से यह ठोस रूपक खो जाता।
- source_word: וְנַחְקֹרָה
  choice: और उनकी छानबीन करें
  rationale: दूसरी आग्रहसूचक क्रिया गहराई से खोजने या पड़ताल करने का भाव जोड़ती है। ‘उनकी’ का संकेत पहले आए ‘मार्गों’ की ओर है, यद्यपि मूल में कर्म दोहराया नहीं गया।
- source_word: וְנָשׁוּבָה
  choice: और…लौटें
  rationale: שׁוב का मूल भाव मुड़ना या लौटना है। ‘लौटें’ संबंध की पुनर्स्थापना का संकेत बनाए रखता है और अर्थ को केवल आंतरिक पश्चात्ताप तक सीमित नहीं करता।
- source_word: עַד
  choice: की ओर
  rationale: लौटने की क्रिया के साथ यह याहवे की दिशा में फिर मुड़ने को व्यक्त करता है; आधुनिक हिन्दी में ‘की ओर’ स्वाभाविक है।
- source_word: יְהוָה
  choice: याहवे
  rationale: मूल पाठ में प्रयुक्त परमेश्वर के व्यक्तिगत नाम का हिन्दी लिप्यंतरण किया गया है, उसे किसी उपाधि से प्रतिस्थापित नहीं किया गया।
theological_decisions:
- issue: שׁוב को ‘लौटना’ या ‘पश्चात्ताप करना’ कहना
  choice: लौटें
  alternative: मन फिराएँ / पश्चात्ताप करें
  rationale: इब्रानी क्रिया का आधारभूत अर्थ लौटना या फिर मुड़ना है। संदर्भ में पश्चात्ताप निहित है, पर ‘लौटें’ संबंधपरक और वाचागत भाव को खुला रखता है।
- issue: יהוה का प्रतिपादन
  choice: याहवे
  alternative: यहोवा / प्रभु
  rationale: मूल में व्यक्तिगत ईश्वरीय नाम है। ‘याहवे’ उसका प्रचलित विद्वत्तापूर्ण लिप्यंतरण है और उपाधि द्वारा नाम को छिपाता नहीं।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामूहिक आत्म-परीक्षण के आग्रह के अनुकूल रखी गई है। ‘मार्गों’ का बाइबलीय रूपक सुरक्षित है, जबकि ‘जाँचें’ और ‘छानबीन करें’ दोनों समानांतर इब्रानी क्रियाओं के अलग-अलग सूक्ष्म भाव व्यक्त करते हैं।
