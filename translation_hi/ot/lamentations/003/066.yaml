source:
  edition: WLC
  text: תִּרְדֹּ֤ף בְּ/אַף֙ וְ/תַשְׁמִידֵ֔/ם מִ/תַּ֖חַת שְׁמֵ֥י יְהוָֽה׃פ
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/003/066.yaml
  text: You will pursue them in anger and destroy them from under the heavens of Yahweh[a][b].
translation:
  language: hi
  text: तू क्रोध में उनका पीछा करेगा और याहवे के आकाशों के नीचे से उनका नाश कर देगा।[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “क्रोध में उनका पीछा कर और उनका नाश कर दे।” इब्रानी की अपूर्ण क्रियाएँ यहाँ प्रार्थनात्मक कामना का भाव भी दे सकती हैं।
    reason: alternative_reading
  - marker: b
    text: शाब्दिक रूप से, “याहवे के आकाशों के नीचे से”; यह परमेश्वर के आकाशों के नीचे की दुनिया से पूरी तरह मिटा दिए जाने का काव्यात्मक वर्णन है।
    reason: cultural_note
lexical_decisions:
- source_word: תִּרְדֹּף
  choice: तू ... उनका पीछा करेगा
  rationale: यह רדף का क़ाल अपूर्ण, द्वितीय पुरुष एकवचन रूप है और प्रार्थना में परमेश्वर को संबोधित करता है। भविष्यकालीन रूप मूल की प्रत्यक्षता बनाए रखता है; प्रार्थनात्मक कामना की सम्भावना पादटिप्पणी में दी गई है।
- source_word: בְּאַף
  choice: क्रोध में
  rationale: אַף का शाब्दिक अर्थ ‘नाक’ है, पर यहाँ यह मुहावरे के रूप में क्रोध बताता है; בְּ रीति अथवा साथ की परिस्थिति व्यक्त करता है।
- source_word: וְתַשְׁמִידֵם
  choice: और ... उनका नाश कर देगा
  rationale: यह שׁמד का हिफ़ील अपूर्ण रूप है, जिसके साथ तृतीय पुरुष बहुवचन प्रत्यय जुड़ा है। ‘नाश कर देना’ इसकी प्रबल प्रेरणार्थक विनाशकारी शक्ति को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: מִתַּחַת
  choice: के नीचे से
  rationale: यह मूल के स्थानवाचक बिंब ‘नीचे से/तले से’ को बनाए रखता है और पूर्णतः हटा दिए जाने की काव्यात्मक धारणा व्यक्त करता है।
- source_word: שְׁמֵי
  choice: आकाशों
  rationale: यह ‘आकाश’ का रचनात्मक बहुवचन है। ‘आकाशों’ मूल के बहुवचन और विलाप के उन्नत काव्यात्मक स्वर को सुरक्षित रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय हिन्दी में लिप्यंतरित किया गया है।
theological_decisions:
- issue: प्रार्थना में अपूर्ण क्रियाओं का भाव
  choice: 'भविष्य-सदृश प्रत्यक्ष कथन: ‘पीछा करेगा ... नाश कर देगा’'
  alternative: 'कामनार्थक विनती: ‘पीछा कर और ... नाश कर दे’'
  rationale: संदर्भ में ये रूप परमेश्वर से की गई विनती हैं, पर इब्रानी अपूर्ण को भविष्य-सदृश दृढ़ कथन के रूप में भी सुना जा सकता है। मुख्य पाठ प्रत्यक्ष भविष्य-रूप रखता है और कामनार्थक भाव को पादटिप्पणी में सुरक्षित करता है।
- issue: יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ व्यक्तिगत दिव्य नाम का प्रयोग करता है; इसलिए उसे उपाधि में बदलने के बजाय लिप्यंतरित किया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गंभीर, काव्यात्मक और प्रार्थनात्मक शैली रखी गई है। परमेश्वर के लिए एकवचन ‘तू’ मूल के द्वितीय पुरुष एकवचन और निकट, प्रत्यक्ष संबोधन को दर्शाता है।
