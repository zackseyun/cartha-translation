lexical_decisions:
- source_word: תָּשִׁיב לָהֶם גְּמוּל
  choice: तू उन्हें बदला देगा
  rationale: שׁוב के हिफ़ील रूप और גְּמוּל का संयुक्त अर्थ यहाँ विरोधियों को उनके किए का प्रतिफल लौटाना है। स्वाभाविक हिन्दी में ‘बदला देगा’ इस प्रतिदानात्मक भाव को व्यक्त करता है।
- source_word: יְהוָה
  choice: हे यहोवा
  rationale: मूल पाठ में परमेश्वर का व्यक्तिगत नाम יהוה सीधे संबोधन में है; हिन्दी की प्रचलित बाइबलीय लिप्यंतरण-परंपरा के अनुसार इसे ‘यहोवा’ और संबोधन के कारण ‘हे’ के साथ रखा गया है।
- source_word: כְּמַעֲשֵׂה יְדֵיהֶם
  choice: उनके हाथों के काम के अनुसार
  rationale: כְּ correspondence या माप दर्शाता है; ‘हाथों का काम’ उनके किए हुए कर्मों के लिए इब्रानी रूपक है। ठोस मूल बिंब और सामूहिक एकवचन ‘काम’ दोनों सुरक्षित रखे गए हैं।
theological_decisions:
- issue: प्रार्थना के संदर्भ में תָּשִׁיב का भाव
  choice: तू ... देगा
  alternative: तू ... दे
  rationale: yiqtol को भविष्य के विश्वासपूर्ण कथन या प्रार्थनापूर्ण इच्छा—दोनों रूपों में सुना जा सकता है। मुख्य पाठ भविष्यसूचक विश्वास रखता है और वैकल्पिक प्रार्थनार्थक भाव पादटिप्पणी में सुरक्षित है।
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: प्रभु
  rationale: मूल में उपाधि नहीं, चार अक्षरों वाला व्यक्तिगत ईश्वरीय नाम है; इसलिए उसे उपाधि से बदलने के बजाय हिन्दी में लिप्यंतरित किया गया है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सहज हिन्दी। एकवचन संबोधन ‘तू’ इब्रानी के निकट है और बाइबलीय प्रार्थना में आत्मीय प्रत्यक्ष संबोधन व्यक्त करता है। ‘हाथों के काम’ का इब्रानी बिंब जानबूझकर बनाए रखा गया है।
