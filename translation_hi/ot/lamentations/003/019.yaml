  text: मेरे दुःख, मेरे भटकने[a], नागदौने और विष[b] को याद कर।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘मेरी बेघर अवस्था’; इब्रानी शब्द अस्थिर होकर घूमने या भटकने की दशा का संकेत देता है।
    reason: lexical_alternative
  - marker: b
    text: ‘नागदौना और विष’ कड़वाहट और ज़हरीलेपन के ठोस बिंब हैं; यह वाक्यांश अत्यन्त कटु दुःख को भी व्यक्त कर सकता है।
    reason: cultural_note
lexical_decisions:
- source_word: זְכָר
  choice: याद कर
  rationale: यह זכר का पुल्लिंग एकवचन आज्ञार्थक रूप है और सीधे किए गए निवेदन को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: עָנְיִי
  choice: मेरे दुःख
  rationale: यह शब्द दुःख, दुर्दशा या कष्ट को सूचित करता है। ‘दुःख’ सामान्य पाठक के लिए सहज है और अर्थ को केवल मानसिक पीड़ा तक सीमित नहीं करता।
- source_word: מְרוּדִי
  choice: मेरे भटकने
  rationale: मूल शब्द अस्थिर होकर घूमने या भटकने की दशा बताता है। यह अनुवाद निर्वासन अथवा बेघर होने की सम्भावना को खुला रखते हुए मूल बिंब को बनाए रखता है।
- source_word: לַעֲנָה
  choice: नागदौने
  rationale: मूल में कड़वाहट से जुड़ी एक वास्तविक वनस्पति का नाम है। ‘नागदौना’ अमूर्त ‘कड़वाहट’ के बजाय उस ठोस काव्यात्मक बिंब को सुरक्षित रखता है।
- source_word: וָרֹאשׁ
  choice: और विष
  rationale: רֹאשׁ किसी विषैली या अत्यन्त कड़वी वनस्पति अथवा उसके विष का संकेत दे सकता है। ‘विष’ नागदौने के साथ कड़वाहट और घातकता, दोनों भावों को संक्षेप में व्यक्त करता है।
