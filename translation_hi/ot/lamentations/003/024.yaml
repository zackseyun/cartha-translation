  text: חֶלְקִ֤/י יְהוָה֙ אָמְרָ֣ה נַפְשִׁ֔/י עַל כֵּ֖ן אוֹחִ֥יל לֽ/וֹ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/003/024.yaml
  text: “Yahweh is my portion,” says my soul[b][a]; “therefore I will hope in him.”
translation:
  language: hi
  text: “याहवे मेरा भाग है[a],” मेरी आत्मा कहती है; “इसलिए मैं उस पर आशा रखूँगा[b]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘याहवे मेरा हिस्सा है’ अथवा ‘याहवे मेरी विरासत है।’
    reason: lexical_alternative
  - marker: b
    text: या ‘मैं उसकी बाट जोहूँगा’ अथवा ‘मैं आशा से उसकी प्रतीक्षा करूँगा।’
    reason: lexical_alternative
lexical_decisions:
- source_word: חֶלְקִי
  choice: मेरा भाग
  rationale: חֵלֶק का अर्थ किसी को मिला भाग, हिस्सा या विरासत हो सकता है। ‘मेरा भाग’ हिब्रू काव्य की संक्षिप्तता बनाए रखता है और परमेश्वर को वक्ता की सच्ची संपदा बताने वाले भाव को अनावश्यक रूप से सीमित नहीं करता।
- source_word: יְהוָה
  choice: याहवे
  rationale: मूल पाठ में परमेश्वर का व्यक्तिगत नाम יהוה है। ‘याहवे’ उसका देवनागरी लिप्यंतरण है; इसे किसी उपाधि से नहीं बदला गया।
- source_word: אָמְרָה נַפְשִׁי
  choice: मेरी आत्मा कहती है
  rationale: נֶפֶשׁ यहाँ वक्ता के भीतरी व्यक्तित्व या स्वयं को दर्शाता है। ‘मेरी आत्मा कहती है’ काव्यात्मक व्यक्तित्व और वर्तमान स्वीकारोक्ति का भाव बनाए रखता है।
- source_word: עַל־כֵּן
  choice: इसलिए
  rationale: यह पदबंध पहले कथन से निकले निष्कर्ष को व्यक्त करता है; ‘इसलिए’ उस तार्किक संबंध को स्वाभाविक और संक्षिप्त ढंग से रखता है।
- source_word: אוֹחִיל לוֹ
  choice: मैं उसी पर आशा रखूँगा
  rationale: יחל के हिफ़ील रूप में आशापूर्वक प्रतीक्षा करने और भरोसे के साथ आशा रखने, दोनों का भाव है। ‘उसी पर आशा रखूँगा’ व्यक्तिगत भरोसे को स्पष्ट करता है, जबकि प्रतीक्षा का अर्थ पादटिप्पणी में सुरक्षित है।
theological_decisions:
- issue: परमेश्वर के नाम יהוה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: यहाँ मूल पाठ उपाधि नहीं, चार अक्षरों वाला व्यक्तिगत नाम יהוה प्रयोग करता है। ‘याहवे’ नाम को नाम के रूप में सुरक्षित रखता है और पाठ में निहित वाचागत निकटता को बनाए रखता है।
- issue: נַפְשִׁי का मानव-स्वरूप संबंधी अर्थ
  choice: मेरी आत्मा
  alternative: मेरा मन; मैं स्वयं
  rationale: यह पद मानव की संरचना पर कोई तकनीकी सिद्धांत स्थापित नहीं करता। ‘मेरी आत्मा’ काव्यात्मक भीतरी आत्म-स्वीकारोक्ति को बनाए रखता है, बिना शरीर और आत्मा के संबंध को अधिक परिभाषित किए।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, काव्यात्मक और सामान्य पाठक के लिए सुबोध शैली अपनाई गई है। ‘भाग’ और ‘आत्मा’ मूल विलाप-काव्य का ऊँचा भाव बनाए रखते हैं; ‘उसी पर आशा रखूँगा’ स्वाभाविक हिन्दी में भरोसे की दिशा को व्यक्त करता है।
