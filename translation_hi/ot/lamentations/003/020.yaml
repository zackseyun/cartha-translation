lexical_decisions:
- source_word: זָכוֹר תִּזְכּוֹר
  choice: निरन्तर याद रहता है
  rationale: क्रिया के साथ प्रयुक्त infinitive absolute स्मरण की क्रिया पर बल देता है। हिन्दी में ‘निरन्तर याद रहता है’ इस तीव्रता और चलते रहने वाले स्मरण को स्वाभाविक रूप से व्यक्त करता है।
- source_word: וְתָשִׁיחַ
  choice: झुक जाता है
  rationale: यह रूप नीचे झुकने या दब जाने का ठोस बिम्ब देता है। ‘उदास हो जाता है’ सम्भव है, पर वह बिम्ब को अधिक भावार्थात्मक बना देता है।
- source_word: עָלַי
  choice: मेरे भीतर
  rationale: शाब्दिक अर्थ ‘मुझ पर’ है, किन्तु अपने ही प्राण के भीतर दबने या झुकने की इस इब्रानी अभिव्यक्ति को आधुनिक हिन्दी में ‘मेरे भीतर’ अधिक स्वाभाविक ढंग से व्यक्त करता है।
- source_word: נַפְשִׁי
  choice: मेरे प्राण
  rationale: נפשׁ यहाँ व्यक्ति के भीतरी जीवन या स्वयं को सूचित करता है। ‘मेरे प्राण’ काव्यात्मक और मानवीय बिम्ब को बनाए रखता है; ‘मैं स्वयं’ उस काव्यात्मकता को कम कर देता।
