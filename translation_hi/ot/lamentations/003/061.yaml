  text: שָׁמַ֤עְתָּ חֶרְפָּתָ/ם֙ יְהוָ֔ה כָּל מַחְשְׁבֹתָ֖/ם עָלָֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/003/061.yaml
  text: You have heard their reproach[a], O Yahweh, all their schemes against me.
translation:
  language: hi
  text: हे याहवे, तूने उनकी निन्दा और मेरे विरुद्ध उनकी सारी योजनाएँ[a] सुनी हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘मेरे विषय में उनके सारे विचार।’ इब्रानी संज्ञा का अर्थ ‘विचार’ या ‘योजनाएँ’ हो सकता है; इस प्रसंग में सम्भवतः शत्रुतापूर्ण योजनाएँ अभिप्रेत हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁמַעְתָּ
  choice: तूने … सुनी हैं
  rationale: यह שׁמע का काल रूप, पुल्लिंग एकवचन में सीधे याहवे को संबोधित करता है। हिन्दी का पूर्ण पक्ष उस सुने जाने की वर्तमान प्रासंगिकता व्यक्त करता है।
- source_word: חֶרְפָּתָם
  choice: उनकी निन्दा
  rationale: חֶרְפָּה में निन्दा, तिरस्कार और अपमानजनक ताने का भाव हो सकता है। ‘निन्दा’ सुनाई देने वाले अपमानजनक वचनों और बदनामी—दोनों के लिए स्वाभाविक हिन्दी है।
- source_word: יְהוָה
  choice: हे याहवे
  rationale: मूल पाठ में परमेश्वर का निज नाम सीधे संबोधन में है; इसलिए किसी उपाधि से बदलने के बजाय उसका लिप्यंतरण किया गया है।
- source_word: כָּל מַחְשְׁבֹתָם
  choice: उनकी सारी योजनाएँ
  rationale: מַחֲשָׁבוֹת का अर्थ ‘विचार’ या ‘योजनाएँ’ हो सकता है। विरोधी प्रसंग और עָלַי के कारण ‘योजनाएँ’ यहाँ अधिक स्वाभाविक है, जबकि विकल्प को पाद-टिप्पणी में रखा गया है।
- source_word: עָלָי
  choice: मेरे विरुद्ध
  rationale: शत्रुतापूर्ण निन्दा और योजनाओं के प्रसंग में עַל का विरोधसूचक अर्थ है; इसलिए ‘मेरे विरुद्ध’ चुना गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: यह पद उपाधि नहीं, चतुरक्षरीय निज नाम יְהוָה प्रयोग करता है। ‘याहवे’ मूल नाम का निकट हिन्दी लिप्यंतरण है और संबोधन की व्यक्तिगत प्रकृति बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, सहज और प्रार्थनात्मक गरिमा वाली रखी गई है। ‘तू’ सीधे एकवचन संबोधन को सुरक्षित रखता है। हिन्दी में दो कर्मों को स्वाभाविक ढंग से जोड़ने के लिए ‘और’ जोड़ा गया है; इससे मूल अर्थ नहीं बदलता।
