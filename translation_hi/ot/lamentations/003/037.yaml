base_translation:
  language: en
  yaml_path: translation/ot/lamentations/003/037.yaml
  text: Who is this who speaks and it happens[b][a], unless the Lord has commanded it?
translation:
  language: hi
  text: ऐसा कौन है जो कहे और वह हो जाए[a], जब तक प्रभु ने ऐसा आदेश न दिया हो[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “कहा और वह हो गया।” इब्रानी में भूतकालिक क्रिया-रूप हैं, जिनका प्रयोग यहाँ सामान्य सत्य बताने वाले आलंकारिक प्रश्न में हुआ है।
    reason: lexical_alternative
  - marker: b
    text: या, “जब तक प्रभु ने उसे ठहराया या निर्धारित न किया हो।” इब्रानी क्रिया का अधिक शाब्दिक अर्थ “आदेश दिया” है।
    reason: alternative_reading
lexical_decisions:
- source_word: מִי זֶה
  choice: ऐसा कौन है
  rationale: प्रश्नवाचक מִי के साथ संकेतवाचक זֶה प्रश्न को बल देता है। ‘ऐसा कौन है’ आधुनिक हिन्दी में इस जोरदार आलंकारिक प्रश्न को स्वाभाविक रूप से व्यक्त करता है।
- source_word: אָמַר
  choice: जो कुछ कहे
  rationale: इब्रानी क्रिया भूतकालिक रूप में है, पर पूरी पंक्ति सामान्य सत्य बताने वाला आलंकारिक प्रश्न है। हिन्दी का संभावनार्थक ‘कहे’ उस सामान्य अर्थ को स्वाभाविक रूप से व्यक्त करता है; ‘कुछ’ कथित बात को स्पष्ट करने के लिए निहित कर्म के रूप में जोड़ा गया है।
- source_word: וַתֶּהִי
  choice: और वह हो जाए
  rationale: היה का स्त्रीलिंग एकवचन रूप किसी निहित बात या घटना के घटित होने की ओर संकेत करता है। ‘वह हो जाए’ इस निहित संदर्भ और कथन के परिणामस्वरूप घटना घटने—दोनों को बनाए रखता है।
- source_word: אֲדֹנָי
  choice: प्रभु
  rationale: यहाँ אֲדֹנָי परमेश्वर की उपाधि है, चतुरक्षरीय नाम नहीं। ‘प्रभु’ आधुनिक हिन्दी का स्वाभाविक और प्रतिष्ठित अनुवाद है।
- source_word: לֹא צִוָּה
  choice: उसकी आज्ञा न दी हो
  rationale: צוה का मूल अर्थ ‘आज्ञा देना’ है। ‘उसकी’ का संबंध निहित बात या घटना से है और हिन्दी में वाक्य को स्पष्ट बनाता है; ‘ठहराया’ या ‘निर्धारित किया’ अधिक व्याख्यात्मक विकल्प हैं।
theological_decisions:
- issue: צוה में परमेश्वर की संप्रभुता का भाव
  choice: आज्ञा न दी हो
  alternative: उसे न ठहराया हो / उसका निर्धारण न किया हो
  rationale: पद किसी घटना के प्रभु की आज्ञा के बिना घटित न होने का दावा करता है। मुख्य पाठ में ‘आज्ञा’ रखकर इब्रानी क्रिया का सीधा अर्थ सुरक्षित है और उससे अधिक व्यवस्थित धर्मवैज्ञानिक अर्थ आरोपित नहीं किया गया।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। वाक्य की आलंकारिक प्रश्न-रचना तथा निहित घटना के प्रति इब्रानी का संकेत सुरक्षित रखा गया है।
