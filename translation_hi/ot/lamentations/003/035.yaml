  text: לְ/הַטּוֹת֙ מִשְׁפַּט גָּ֔בֶר נֶ֖גֶד פְּנֵ֥י עֶלְיֽוֹן־׃
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/003/035.yaml
  text: to deny a man justice before the face of the Most High—
translation:
  language: hi
  text: परमप्रधान के सामने किसी मनुष्य को न्याय से वंचित करना—
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְהַטּוֹת
  choice: वंचित करना
  rationale: मूल क्रिया का अर्थ किसी के न्याय को मोड़ देना या उससे न्याय छीन लेना है; इस संदर्भ में ‘न्याय से वंचित करना’ आधुनिक हिन्दी में स्वाभाविक और सटीक है।
- source_word: מִשְׁפַּט גָּבֶר
  choice: किसी मनुष्य को न्याय
  rationale: यह पदबंध मनुष्य के न्यायोचित अधिकार या उसके पक्ष में उचित न्याय को दर्शाता है; हिन्दी में कर्म-संरचना के साथ यह अर्थ स्पष्ट रहता है।
- source_word: נֶגֶד פְּנֵי עֶלְיוֹן
  choice: परमप्रधान के सामने
  rationale: ‘मुख के सामने’ का शब्दशः रूप हिन्दी में अस्वाभाविक होगा; ‘के सामने’ वही प्रत्यक्ष उपस्थिति और निरीक्षण का भाव रखता है।
theological_decisions:
- issue: עֶלְיוֹן को उपाधि के रूप में प्रस्तुत करना
  choice: परमप्रधान
  alternative: सर्वोच्च परमेश्वर
  rationale: मूल में ईश्वर की उपाधि ‘परमप्रधान’ है; इसमें मूल की संक्षिप्तता और काव्यात्मक गरिमा बनी रहती है, बिना ‘परमेश्वर’ शब्द जोड़े।
translation_notes:
  register: आधुनिक, dignified काव्यात्मक हिन्दी; पूर्ववर्ती और आगामी समानांतर पंक्तियों से जुड़ने के लिए अंत में दीर्घ विराम-चिह्न रखा गया है।
