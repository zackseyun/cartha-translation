  text: निश्चय ही वह दिन भर बार-बार मेरे विरुद्ध अपना हाथ उठाता है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “निश्चय ही वह मेरे विरुद्ध फिर मुड़ता है; वह दिन भर अपना हाथ मोड़ता है।” इब्रानी में लगातार दो क्रियाएँ हैं—“लौटता/फिर मुड़ता है” और “मोड़ता/उलटता है।” इन्हें अधिक शाब्दिक रूप में या बार-बार होने वाली कार्रवाई के अर्थ में अनूदित किया जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  choice: निश्चय ही
  rationale: यहाँ यह प्रतिबंधसूचक ‘केवल’ नहीं, बल्कि विलाप को बल देने वाला निश्चयवाचक अव्यय है।
- source_word: בִּי
  choice: मेरे विरुद्ध
  rationale: संदर्भ में शत्रुतापूर्ण कार्रवाई होने के कारण בִּי का विरोधात्मक भाव स्वाभाविक रूप से व्यक्त होता है।
- source_word: יָשֻׁב יַהֲפֹךְ
  choice: बार-बार ... फेरता है
  rationale: लगातार आए दोनों क्रियापदों में लौटकर वही कार्रवाई करने का पुनरावृत्तिमूलक भाव संभव है; हिन्दी में ‘बार-बार’ इसे स्वाभाविक ढंग से व्यक्त करता है।
- source_word: יָדוֹ
  choice: अपना हाथ
  rationale: मूल का ठोस ‘हाथ’ वाला बिंब बनाए रखा गया है; कर्ता से संबंध स्पष्ट करने के लिए हिन्दी में ‘अपना’ स्वाभाविक है।
- source_word: כָּל הַיּוֹם
  choice: दिन भर
  rationale: यह पूरी अवधि और निरंतरता को व्यक्त करने वाला सहज आधुनिक हिन्दी प्रयोग है।
