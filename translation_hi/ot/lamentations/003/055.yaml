lexical_decisions:
- source_word: קָרָאתִי
  choice: मैंने ... पुकारा
  rationale: קרא का काल रूप पूर्ण, प्रथम पुरुष एकवचन है। ‘तेरे नाम’ के साथ यह प्रार्थना में आह्वान करने का भाव देता है; हिन्दी में ‘नाम को पुकारा’ मूल मुहावरे को बनाए रखता है।
- source_word: שִׁמְךָ
  choice: तेरे नाम को
  rationale: मूल का शाब्दिक अर्थ ‘तेरा नाम’ है। इसे ‘तुझे’ करके व्याख्यायित करने के बजाय नाम के आह्वान की इब्रानी अभिव्यक्ति सुरक्षित रखी गई है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: चार अक्षरों वाले परमेश्वर के व्यक्तिगत नाम को हिन्दी में प्रचलित लिप्यंतरण ‘यहोवा’ से व्यक्त किया गया है, किसी उपाधि से नहीं।
- source_word: מִבּוֹר
  choice: गड्ढे में से
  rationale: בּוֹר गड्ढा, हौद या बंदीगृह जैसा गहरा स्थान हो सकता है। यहाँ ‘गड्ढा’ व्यापक अर्थ और मृत्यु-संकट की छवि दोनों बनाए रखता है।
- source_word: תַּחְתִּיּוֹת
  choice: गहरे
  rationale: यह शब्द नीचे के अथवा सबसे निचले भागों का बोध कराता है। ‘गहरे गड्ढे’ स्वाभाविक हिन्दी में उस गहराई को व्यक्त करता है; अधिक शाब्दिक विकल्प पादटिप्पणी में दिया गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: हे यहोवा
  alternative: हे याहवे
  rationale: मूल पाठ में उपाधि नहीं, व्यक्तिगत ईश्वरीय नाम है। हिन्दी के सामान्य बाइबलीय प्रयोग में पहचाने जाने वाले ‘यहोवा’ को रखा गया है; ‘याहवे’ अधिक ध्वन्यात्मक वैकल्पिक लिप्यंतरण है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सहज हिन्दी। प्रत्यक्ष संबोधन में ‘हे यहोवा’ तथा काव्यात्मक प्रार्थना के अनुरूप एकवचन ‘तेरे’ रखा गया है। पादटिप्पणी चिह्न संबंधित खंड के बाद दिया गया है।
