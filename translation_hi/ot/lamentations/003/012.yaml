translation:
  language: hi
  text: 'उसने अपना धनुष ताना[a]

    और मुझे तीर का निशाना बनाकर खड़ा कर दिया।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसने अपना धनुष खींचा।”
    reason: דָּרַךְ धनुष को मोड़ने, तानने या खींचने की क्रिया व्यक्त कर सकता है; “खींचा” उसी चित्र का एक सम्भव अनुवाद है।
lexical_decisions:
- source_word: דָּרַךְ
  choice: ताना
  rationale: धनुष के साथ यह क्रिया उसे चलाने के लिए मोड़ने या खींचने का बोध देती है। आधुनिक हिन्दी में “धनुष ताना” स्वाभाविक, संक्षिप्त और युद्ध-चित्र के अनुरूप है।
- source_word: קַשְׁתּוֹ
  choice: अपना धनुष
  rationale: तीसरे पुरुष एकवचन के संबंधसूचक प्रत्यय को हिन्दी के स्वाभाविक आत्मवाचक संबंधसूचक “अपना” से व्यक्त किया गया है।
- source_word: וַיַּצִּיבֵנִי
  choice: और मुझे … खड़ा कर दिया
  rationale: יצב का अर्थ किसी को स्थापित करना, ठहराना या खड़ा करना है। “खड़ा कर दिया” वक्ता को जानबूझकर आक्रमण की स्थिति में रखे जाने का चित्र बनाए रखता है।
- source_word: כַּמַּטָּרָא
  choice: निशाना बनाकर
  rationale: כ तुलना और מטרה लक्ष्य या निशाना दर्शाता है। “निशाना बनाकर” हिन्दी में स्वाभाविक ढंग से बताता है कि वक्ता को लक्ष्य के समान रखा गया।
- source_word: לַחֵץ
  choice: तीर का
  rationale: एकवचन חֵץ को एकवचन “तीर” रखा गया है। संबंध को स्वाभाविक हिन्दी में “तीर का निशाना” के रूप में व्यक्त किया गया है।
