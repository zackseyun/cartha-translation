translation:
  language: hi
  text: 'उसने मुझे कड़वाहट से भर दिया;

    उसने मुझे नागदौना पिलाकर तर कर दिया।[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उसने मुझे नागदौने से सराबोर कर दिया,” अथवा “उसने मुझे भरपेट नागदौना पिलाया।” इब्रानी क्रिया भरपूर पिलाने, भिगो देने या पूरी तरह संतृप्त कर देने का भाव व्यक्त कर सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הִשְׂבִּיעַנִי
  choice: मुझे ... से भर दिया
  rationale: שׂבע के हिफ़ील रूप का मूल भाव किसी को तृप्त या भर देना है। दुःख के इस संदर्भ में ‘भर दिया’ स्वाभाविक है और अनचाहे कड़वे अनुभव की परिपूर्णता व्यक्त करता है।
- source_word: בַמְּרוֹרִים
  choice: कड़वाहट से
  rationale: बहुवचन מְרוֹרִים का अर्थ कड़वी वस्तुएँ अथवा कड़वाहट हो सकता है। ‘कड़वाहट’ हिन्दी में सहज रहते हुए शारीरिक स्वाद और दुःख—दोनों की छवियों को खुला रखता है।
- source_word: הִרְוַנִי
  choice: मुझे ... पिलाकर तर कर दिया
  rationale: רוה के हिफ़ील रूप में भरपूर पिलाने, भिगोने या संतृप्त करने का भाव है। यह चयन पीने की ठोस छवि और अत्यधिक मात्रा—दोनों को बनाए रखता है; वैकल्पिक अर्थ पाद-टिप्पणी में दिया गया है।
- source_word: לַעֲנָה
  choice: नागदौना
  rationale: לַעֲנָה एक अत्यंत कड़वे पौधे, wormwood, को दर्शाता है और दुःख अथवा विष-जैसी कड़वाहट का रूपक भी हो सकता है। ‘नागदौना’ मूल वनस्पति-छवि को केवल ‘कड़वाहट’ में समतल नहीं करता।
