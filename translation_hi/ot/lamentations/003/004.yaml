- source_word: בִּלָּה
  choice: गला दिया है
  rationale: पिएल रूप किसी वस्तु को जीर्ण करने, घिसा डालने या क्षीण कर देने का भाव देता है। यहाँ शरीर के क्रमशः नष्ट होने की सजीव छवि के लिए ‘गला दिया है’ स्वाभाविक और प्रभावशाली है।
- source_word: בְשָׂרִי
  choice: मेरे मांस
  rationale: ‘मांस’ בשר का सीधा समतुल्य है और पद की तीखी शारीरिक अनुभूति को बनाए रखता है।
- source_word: וְעוֹרִי
  choice: और मेरी खाल
