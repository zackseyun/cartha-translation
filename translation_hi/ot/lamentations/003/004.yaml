- source_word: שִׁבַּר
  choice: तोड़ दी हैं
  rationale: שבר का सामान्य अर्थ ‘तोड़ना’ है। बहुवचन ‘हड्डियाँ’ के अनुसार हिन्दी क्रिया का स्वाभाविक रूप रखा गया है।
- source_word: עַצְמוֹתָי
  choice: मेरी हड्डियाँ
  rationale: यह मूल शब्द का सीधा और स्वाभाविक अनुवाद है तथा विलाप की शारीरिक तीव्रता बनाए रखता है।
