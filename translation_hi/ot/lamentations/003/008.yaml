id: LAM.3.8
reference: Lamentations 3:8
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: גַּ֣ם כִּ֤י אֶזְעַק֙ וַ/אֲשַׁוֵּ֔עַ שָׂתַ֖ם תְּפִלָּתִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/003/008.yaml
  text: Even when I cry out and call for help[a], he shuts out my prayer.
translation:
  language: hi
  text: जब मैं पुकारता और सहायता के लिए दुहाई देता हूँ, तब भी वह मेरी प्रार्थना रोक देता है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: גַּם כִּי
  choice: तब भी
  rationale: 'यह पद में concessive भाव व्यक्त करता है: वक्ता के पुकारने के बावजूद उसकी प्रार्थना रोक दी जाती है। हिंदी में ‘तब भी’ इस तनाव को स्वाभाविक रूप से बनाए रखता है।'
- source_word: אֶזְעַק
  choice: मैं पुकारता
  rationale: זעק संकट में ऊँची और तीव्र पुकार को दर्शाता है। ‘पुकारता’ आधुनिक हिंदी में सहज है और विलाप की तीव्रता को बनाए रखता है।
- source_word: וַאֲשַׁוֵּעַ
  choice: और सहायता के लिए दुहाई देता हूँ
  rationale: שׁוע के पिएल रूप में सहायता पाने की व्याकुल पुकार निहित है। यह अनुवाद पहले क्रियापद से भेद रखते हुए सहायता की याचना स्पष्ट करता है।
- source_word: שָׂתַם
  choice: रोक देता है
  rationale: क्रिया का मूल अर्थ बंद करना या अवरुद्ध करना है। प्रार्थना के संबंध में ‘रोक देता है’ स्वाभाविक हिंदी में उसके आगे न पहुँचने का चित्र प्रस्तुत करता है।
- source_word: תְּפִלָּתִי
  choice: मेरी प्रार्थना
  rationale: यह संज्ञा सीधे ‘प्रार्थना’ को दर्शाती है; यही सर्वाधिक स्पष्ट और संदर्भानुकूल चुनाव है।
theological_decisions:
- issue: ‘रोक देता है’ का अंतर्निहित कर्ता
  choice: पुल्लिंग एकवचन सर्वनाम ‘वह’ रखा गया है; ‘परमेश्वर’ या ‘यहोवा’ स्पष्ट रूप से नहीं जोड़ा गया।
  alternative: कर्ता को स्पष्ट करके ‘परमेश्वर’ कहना, अथवा कर्मवाच्य में ‘मेरी प्रार्थना रोक दी जाती है’ कहना।
  rationale: इब्रानी क्रिया पुल्लिंग एकवचन है, पर इस उपवाक्य में कर्ता का नाम नहीं है। आसपास का संदर्भ संकेत देता है कि वह कौन है; ‘वह’ रखने से मूल की संक्षिप्तता बनी रहती है और पद में अनुपस्थित ईश्वरीय नाम नहीं जोड़ा जाता।
translation_notes:
  register: भाषा आधुनिक मानक हिंदी की, सहज किंतु गरिमापूर्ण है। ‘पुकारता’ और ‘सहायता के लिए दुहाई देता हूँ’ समानांतर क्रियाओं का अर्थगत भेद बनाए रखते हैं; ‘तब भी’ मूल के concessive बल को स्पष्ट करता है।
