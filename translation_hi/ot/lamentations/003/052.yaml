lexical_decisions:
- source_word: צוֹד צָדוּנִי
  choice: मेरा शिकार किया
  rationale: मूल धातु צוד शिकार करने या फँसाने की क्रिया बताती है। हिन्दी में ‘मेरा शिकार किया’ पक्षी के बिंब को स्वाभाविक रूप से बनाए रखता है। साथ आया infinitive absolute क्रिया पर बल देता है; इसकी जानकारी पाद-टिप्पणी में रखी गई है ताकि मुख्य वाक्य सहज रहे।
- source_word: כַּצִּפּוֹר
  choice: पक्षी की तरह
  rationale: צִפּוֹר यहाँ किसी विशेष प्रजाति का नहीं, सामान्यतः पक्षी का सूचक है। यह अनुवाद मूल उपमा और शिकार की असुरक्षा दोनों को सुरक्षित रखता है।
- source_word: אֹיְבַי
  choice: मेरे शत्रुओं
  rationale: यह संज्ञा सीधे शत्रुओं को दर्शाती है। ‘शत्रु’ आधुनिक मानक हिन्दी में स्पष्ट और गरिमापूर्ण है।
- source_word: חִנָּם
  choice: बिना कारण
  rationale: यहाँ शब्द का अर्थ मूल्य चुकाए बिना नहीं, बल्कि किसी उचित कारण के अभाव में किया गया अन्यायपूर्ण वैर है। ‘बिना कारण’ इसे स्वाभाविक और स्पष्ट रूप से व्यक्त करता है।
