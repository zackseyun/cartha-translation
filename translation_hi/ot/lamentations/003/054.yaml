lexical_decisions:
- source_word: צָפוּ
  choice: छा गया
  rationale: यह क्रिया यहाँ पानी के ऊपर तक चढ़ आने और ढक लेने का चित्र देती है। ‘छा गया’ आधुनिक हिन्दी में स्वाभाविक रहते हुए डूबने और घिर जाने की तीव्रता बनाए रखता है।
- source_word: מַיִם
  choice: पानी
  rationale: हिब्रू का रूप बहुवचन है, पर आधुनिक हिन्दी में इस द्रव्य के लिए सामान्य और स्वाभाविक रूप ‘पानी’ है; ‘जलराशियाँ’ अनावश्यक रूप से अलंकृत होता।
- source_word: עַל
  choice: के ऊपर
  rationale: सिर को पार कर ऊपर छा जाने वाले पानी का स्थानिक संबंध स्पष्ट करता है।
- source_word: רֹאשִׁי
  choice: मेरे सिर
  rationale: मूल के ठोस शारीरिक चित्र का सीधा अनुवाद है।
- source_word: אָמַרְתִּי
  choice: मैंने कहा
  rationale: אמר का सामान्य अर्थ ‘कहना’ है। यह बाहरी वाणी थी या मन की बात, मूल की तरह अनिर्णीत रखा गया है।
- source_word: נִגְזָרְתִּי
  choice: मैं काट दिया गया हूँ
  rationale: निफ़अल रूप के ‘काट दिए जाने’ के रूपक को सुरक्षित रखता है, जो जीवन या आशा से अलग हो जाने की ओर संकेत कर सकता है; ‘मेरा अंत हो गया’ अधिक व्याख्यात्मक होता।
theological_decisions:
- issue: נִגְזָרְתִּי में जीवन या आशा से विच्छेद का आशय
  choice: रूपक को ‘मैं काट दिया गया हूँ’ के रूप में सुरक्षित रखा गया
  alternative: ‘मेरा अंत हो गया है’ अथवा ‘मैं नष्ट हो गया हूँ’
  rationale: मूल पाठ यह स्पष्ट नहीं करता कि वक्ता जीवन, उद्धार या आशा में से किससे काटा गया समझता है। इसलिए अनुवाद इस तनाव को स्वयं हल नहीं करता।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘छा गया’ काव्यात्मक दृश्य को स्वाभाविक हिन्दी में व्यक्त करता है, जबकि ‘काट दिया गया हूँ’ मूल रूपक और उसकी जानबूझकर बनी अस्पष्टता को सुरक्षित रखता है।
