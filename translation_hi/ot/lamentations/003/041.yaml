base_translation:
  language: en
  yaml_path: translation/ot/lamentations/003/041.yaml
  text: Let us lift up our hearts with our hands to God in heaven.
translation:
  language: hi
  text: आओ, हम अपने हाथों के साथ अपना हृदय भी स्वर्ग में विराजमान परमेश्वर की ओर उठाएँ।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נִשָּׂא
  choice: आओ, हम…उठाएँ
  rationale: हिब्रू के सामूहिक प्रोत्साहनसूचक रूप को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: לְבָבֵנוּ
  choice: अपना हृदय
  rationale: मूल में ‘हमारा हृदय’ व्याकरणतः एकवचन है और समुदाय के भीतरी मन को सामूहिक रूप में दर्शाता है।
- source_word: אֶל־כַּפָּיִם
  choice: अपने हाथों के साथ
  rationale: כַּפַּיִם का शाब्दिक अर्थ हथेलियाँ/हाथ है; यहाँ हृदय उठाने के साथ प्रार्थना में हाथ उठाने का संबंध व्यक्त है। ‘के साथ’ मूल संबंध को बिना ‘और’ में बदलकर अस्पष्टता मिटाए बनाए रखता है।
- source_word: אֶל־אֵל בַּשָּׁמָיִם
  choice: स्वर्ग में विराजमान परमेश्वर की ओर
  rationale: दिशासूचक אֶל को ‘की ओर’ और בַּשָּׁמָיִם को प्रचलित, गरिमामय हिन्दी ‘स्वर्ग में’ से व्यक्त किया गया है; ‘विराजमान’ हिन्दी में स्थानसूचक वाक्यांश को स्वाभाविक बनाता है।
theological_decisions:
- issue: हृदय और हाथों के बीच संबंध
  choice: अपने हाथों के साथ अपना हृदय भी…उठाएँ
  alternative: अपना हृदय और अपने हाथ…उठाएँ
  rationale: मूल पाठ में ‘हृदय’ क्रिया का सीधा कर्म है, जबकि ‘हाथों’ से पहले दिशासूचक אֶל है। ‘के साथ’ उस असामान्य संरचना और आंतरिक भक्ति तथा बाहरी प्रार्थना-भंगिमा के तनाव को अधिक निकटता से सुरक्षित रखता है।
translation_notes:
  register: आधुनिक, सहज और गरिमामय सामूहिक आह्वान। ‘आओ’ पद के प्रोत्साहनसूचक स्वर को स्पष्ट करता है; ‘भी’ हिन्दी में ‘हाथों के साथ हृदय’ की संरचना को सहज बनाता है, बिना दोनों को समानांतर कर्मों में बदलने के।
