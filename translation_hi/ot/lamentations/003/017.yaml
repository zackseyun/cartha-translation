base_translation:
  language: en
  yaml_path: translation/ot/lamentations/003/017.yaml
  text: You have thrust my soul away from peace[c][b][a]; I have forgotten goodness.
translation:
  language: hi
  text: तूने मेरे प्राण को शान्ति से वंचित कर दिया है;[a][b] मैं भलाई भूल गया हूँ।[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'क्रिया को तृतीय पुरुष स्त्रीलिंग भी समझा जा सकता है: “मेरे प्राण शान्ति से वंचित हो गए हैं।”'
    reason: grammatical_alternative
  - marker: b
    text: “शान्ति” के लिए प्रयुक्त इब्रानी शब्द का अर्थ कुशलता, कल्याण या सम्पूर्णता भी हो सकता है।
    reason: lexical_alternative
  - marker: c
    text: या, “मैं सुख-समृद्धि भूल गया हूँ।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּזְנַח
  choice: तूने ... दूर कर दिया है
  rationale: זנח का मूल भाव ठुकराने या दूर कर देने का है। प्रसंग में परमेश्वर को प्रत्यक्ष सम्बोधन मानते हुए यह अनुवाद निष्कासन का बल बनाए रखता है, पर हिन्दी में स्वाभाविक भी है।
- source_word: מִשָּׁלוֹם
  choice: शान्ति से
  rationale: שָׁלוֹם में शान्ति के साथ कुशलता और सम्पूर्ण कल्याण का व्यापक अर्थ भी निहित है; मुख्य पाठ में ‘शान्ति’ काव्यात्मक और परिचित है।
- source_word: נַפְשִׁי
  choice: मेरे प्राण को
  rationale: נֶפֶשׁ व्यक्ति, जीवन या प्राण का बोध करा सकता है। ‘मेरे प्राण’ हिन्दी के गरिमामय काव्यात्मक मुहावरे में पूरे व्यक्ति और उसके भीतरी जीवन दोनों को व्यक्त करता है।
- source_word: נָשִׁיתִי
  choice: मैं ... भूल गया हूँ
  rationale: प्रथम पुरुष एकवचन पूर्ण क्रिया का सीधा अर्थ ‘मैं भूल गया हूँ’ है; पाठ में स्पष्ट रूप से न दिए गए कारक अर्थ (‘तूने मुझे भुला दिया’) को नहीं जोड़ा गया।
- source_word: טוֹבָה
  choice: भलाई
  rationale: טוֹבָה भलाई, सुख-समृद्धि या कल्याण का अर्थ दे सकता है। ‘भलाई’ मूल की व्यापकता और संक्षिप्तता बचाती है।
theological_decisions:
- issue: וַתִּזְנַח का निहित कर्ता
  choice: द्वितीय पुरुष—‘तूने’
  alternative: अव्यक्त/भाववाच्य—‘मेरे प्राण शान्ति से वंचित हो गए हैं’
  rationale: क्रिया का रूप स्त्रीलिंग तृतीय पुरुष एकवचन भी हो सकता है, पर विलाप के निकटवर्ती प्रत्यक्ष सम्बोधन में परमेश्वर को निहित कर्ता समझना सम्भव और प्रसंगानुकूल है। वैकल्पिक व्याख्या पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमामय और काव्यात्मक शैली रखी गई है। परमेश्वर के लिए एकवचन ‘तू’ बाइबलीय प्रत्यक्ष सम्बोधन की निकटता और विलाप की तीव्रता व्यक्त करता है।
