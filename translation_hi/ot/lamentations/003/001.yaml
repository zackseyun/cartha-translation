  text: אֲנִ֤י הַ/גֶּ֨בֶר֙ רָאָ֣ה עֳנִ֔י בְּ/שֵׁ֖בֶט עֶבְרָתֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/003/001.yaml
  text: I am the man who has seen affliction under the rod of his wrath[a][b].
translation:
  language: hi
  text: मैं वह पुरुष हूँ जिसने उसके क्रोध की छड़ी के नीचे दुःख देखा है[a][b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उसके क्रोध की छड़ी से।” हिब्रू पूर्वसर्ग का अनुवाद एक से अधिक प्रकार से किया जा सकता है।
    reason: lexical_alternative
  - marker: b
    text: “दुःख” का अनुवाद “विपत्ति,” “दैन्य” या “पीड़ा” भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲנִי
  choice: मैं ही
  rationale: पंक्ति के आरम्भ में स्वतंत्र सर्वनाम पर बल है। हिन्दी में “मैं ही” उस आत्म-पहचान के बल को स्वाभाविक रूप से व्यक्त करता है।
- source_word: הַגֶּבֶר
  choice: वह पुरुष
  rationale: यह निश्चित, पुल्लिंग एकवचन आत्म-संज्ञा है। “वह पुरुष” निश्चितता और वक्ता की विशिष्ट आत्म-पहचान बनाए रखता है; “वीर” या “बलवान पुरुष” इस संदर्भ में अनावश्यक अर्थ जोड़ते।
- source_word: רָאָה
  choice: देखा है
  rationale: हिब्रू क्रिया के सामान्य अर्थ “देखना” को रखा गया है, जबकि हिन्दी पूर्ण वर्तमान अतीत के अनुभव से बनी वर्तमान आत्म-दशा को व्यक्त करता है। “सहा है” अधिक व्याख्यात्मक होता।
- source_word: עֳנִי
  choice: दुःख
  rationale: यह शब्द विपत्ति, दैन्य और पीड़ा की व्यापक दशा सूचित करता है। आधुनिक हिन्दी में “दुःख” सहज और व्यापक है; “कंगाली” अर्थ को आर्थिक अभाव तक सीमित कर सकती है।
- source_word: בְּשֵׁבֶט
  choice: छड़ी के नीचे
  rationale: שֵׁבֶט दण्ड देने वाली छड़ी का बिम्ब रखता है। בְּ के लिए “के नीचे” अधीन होकर प्रहार सहने का भाव देता है, पर इसकी साधनवाचक सम्भावना पादटिप्पणी में सुरक्षित है।
- source_word: עֶבְרָתוֹ
  choice: उसके प्रकोप
  rationale: עֶבְרָה तीव्र क्रोध को दर्शाता है; “प्रकोप” विलापगीत के गंभीर काव्यात्मक स्तर के अनुकूल है। तृतीय पुरुष पुल्लिंग प्रत्यय को “उसके” के रूप में रखा गया है, बिना मुख्य पाठ में उसके संदर्भ को स्पष्ट किए।
theological_decisions:
- issue: “उसके प्रकोप” में सर्वनाम का संदर्भ
  choice: मुख्य पाठ में केवल “उसके” रखा गया है।
  alternative: “यहोवा के प्रकोप” या “परमेश्वर के प्रकोप”
  rationale: हिब्रू पद में केवल तृतीय पुरुष पुल्लिंग एकवचन प्रत्यय है। निकटवर्ती संदर्भ से ईश्वरीय संदर्भ स्पष्ट होता है, पर इस पद में अनुपस्थित संज्ञा को जोड़ना साहित्यिक अस्पष्टता को मिटा देता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और काव्यात्मक रखी गई है। “मैं ही” आरम्भिक बल को, “वह पुरुष” निश्चित आत्म-पहचान को, और “छड़ी” न्याय अथवा ताड़ना के ठोस बिम्ब को बनाए रखते हैं। दोनों पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित हैं।
