lexical_decisions:
- source_word: עַד
  choice: जब तक
  rationale: यह पिछले पद में चल रही अवस्था की अंतिम सीमा बताता है; हिन्दी में ‘जब तक’ स्वाभाविक और संक्षिप्त है।
- source_word: יַשְׁקִיף
  choice: झाँककर
  rationale: हिफ़ील रूप ऊँचे स्थान से नीचे की ओर देखने का भाव रखता है। ‘स्वर्ग से’ के साथ ‘झाँककर’ इस ऊर्ध्वाधर बिंब को बनाए रखता है।
- source_word: וְיֵרֶא
  choice: न देखे
  rationale: ראה का सामान्य अर्थ ‘देखना’ है। ‘झाँककर न देखे’ दोनों इब्रानी क्रियाओं को अलग रखते हुए हिन्दी की ‘जब तक…न’ रचना में स्वाभाविक है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय हिन्दी में प्रचलित लिप्यंतरण ‘यहोवा’ द्वारा प्रस्तुत किया गया है।
- source_word: מִשָּׁמָיִם
  choice: स्वर्ग से
  rationale: שָׁמַיִם रूप की दृष्टि से बहुवचन है, पर इस संदर्भ में ‘स्वर्ग से’ हिन्दी का स्वाभाविक मुहावरेदार अनुवाद है।
theological_decisions:
