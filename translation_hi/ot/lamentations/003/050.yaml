  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ में व्यक्तिगत ईश्वरीय नाम सीधे आया है। हिन्दी पाठकों में अधिक परिचित ‘यहोवा’ नाम को सुरक्षित रखता है और उसे ‘प्रभु’ जैसी उपाधि से नहीं बदलता।
