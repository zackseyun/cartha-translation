  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פַּחַד
  choice: आतंक
  rationale: यह भय से अधिक तीव्र, घेर लेने वाली दहशत को व्यक्त करता है और अगले शब्द के साथ विपत्ति की जोड़ी बनाता है।
- source_word: פַחַת
  choice: गड्ढा
  rationale: मूल शब्द का सीधा अर्थ गड्ढा है, जिसमें गिरने या फँसने का भाव निहित हो सकता है; केवल 'फंदा' कहने से मूल बिंब संकरा हो जाता।
- source_word: הַשֵּׁאת
  choice: उजाड़
  rationale: यह विनाश से उत्पन्न उजड़ी हुई दशा को व्यक्त करता है और अगले समानार्थी शब्द से उसका भेद बनाए रखता है।
- source_word: הַשָּׁבֶר
  choice: विनाश
  rationale: मूल में टूटने, चूर होने और तबाही का भाव है; इस संदर्भ में 'विनाश' स्वाभाविक और व्यापक है।
