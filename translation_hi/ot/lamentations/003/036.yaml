  text: לְ/עַוֵּ֤ת אָדָם֙ בְּ/רִיב֔/וֹ אֲדֹנָ֖/י לֹ֥א רָאָֽה׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/003/036.yaml
  text: to deny a man justice in his case—the Lord does not approve[a][b].
translation:
  language: hi
  text: किसी मनुष्य को उसके मुकदमे में न्याय से वंचित करना—प्रभु यह नहीं देखता[a][b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘किसी मनुष्य के मुकदमे को बिगाड़ना’ अथवा ‘उसके मामले को तोड़-मरोड़ना।’
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में शाब्दिक रूप से ‘प्रभु यह नहीं देखता’; इस वाक्यांश का अर्थ ‘प्रभु इसे स्वीकार नहीं करता’ भी हो सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: לְעַוֵּת
  choice: न्याय से वंचित करना
  rationale: पिएल रूप यहाँ किसी का अधिकार तोड़ने-मरोड़ने या कानूनी न्याय बिगाड़ने का भाव रखता है। आधुनिक हिन्दी में यह पदबंध कानूनी अन्याय को स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: אָדָם
  choice: किसी मनुष्य को
  rationale: यहाँ एक मानव व्यक्ति कानूनी प्रसंग में है। ‘मनुष्य’ मूल की व्यापक मानवीय संज्ञा को बनाए रखता है और आधुनिक मानक हिन्दी में गरिमापूर्ण है।
- source_word: בְּרִיבוֹ
  choice: उसके मुकदमे में
  rationale: רִיב विवाद, कानूनी दावा या मुकदमा दर्शा सकता है। इस प्रसंग में ‘मुकदमे में’ न्यायिक अर्थ को सबसे स्पष्ट रूप से व्यक्त करता है।
- source_word: אֲדֹנָי
  choice: प्रभु
  rationale: यह परमेश्वर के लिए प्रयुक्त दिव्य उपाधि है; ‘प्रभु’ इसका प्रचलित, गरिमापूर्ण हिन्दी रूप है।
- source_word: לֹא רָאָה
  choice: यह नहीं देखता
  rationale: मुख्य पाठ में ‘देखना’ रखकर इब्रानी दृश्य-रूपक और उससे उत्पन्न अर्थगत तनाव सुरक्षित रहता है। प्रसंग में इसका आशय स्वीकार या अनुमोदन न करना भी हो सकता है, जिसे पादटिप्पणी में दिया गया है।
theological_decisions:
- issue: क्या לֹא רָאָה को प्रत्यक्ष बोध (‘नहीं देखता’) या मूल्यांकनात्मक अनुमोदन (‘स्वीकार नहीं करता’) के रूप में व्यक्त किया जाए
  choice: मुख्य पाठ में शाब्दिक दृश्य-रूपक ‘प्रभु यह नहीं देखता’ रखा गया।
  alternative: ‘प्रभु इसे स्वीकार नहीं करता’ या ‘प्रभु इसका अनुमोदन नहीं करता।’
  rationale: मूल क्रिया ‘देखना’ है, यद्यपि प्रसंग में यह ध्यान देने, सहने या अनुमोदन करने का भाव ग्रहण कर सकती है। शाब्दिक रूप मुख्य पाठ में रखने से वास्तविक अर्थगत और धर्मवैचारिक तनाव बना रहता है; स्पष्ट व्याख्यात्मक अर्थ पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट कानूनी शब्दावली अपनाई गई है। वाक्य की अपूर्णसूची-जैसी संरचना पूर्ववर्ती पदों से इसके संबंध को बनाए रखती है।
