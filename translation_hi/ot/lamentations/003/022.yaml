  yaml_path: translation/ot/lamentations/003/022.yaml
  text: Because of Yahweh’s steadfast love we are not consumed[a], for his mercies never come to an end.
translation:
  language: hi
  text: याहवे के अटल प्रेम के कारण हम नष्ट नहीं हुए हैं[a], क्योंकि उसकी करुणा का कभी अन्त नहीं होता।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'कुछ हिब्रू पांडुलिपियाँ और प्राचीन अनुवाद इस वैकल्पिक पाठ का समर्थन करते हैं: “याहवे का अटल प्रेम कभी समाप्त नहीं होता।” इस पाठ में “अटल प्रेम” कर्ता है और पहली क्रिया का पाठ भी भिन्न है।'
    reason: textual_alternative
lexical_decisions:
- source_word: חַסְדֵי יְהוָה
  choice: याहवे का अटल प्रेम
  rationale: बहुवचन रचना वाचा के प्रति निष्ठावान प्रेम के बार-बार प्रकट होने वाले कार्यों को सूचित कर सकती है। हिन्दी में भाववाचक एकवचन ‘अटल प्रेम’ स्वाभाविक है और निष्ठा तथा प्रेम—दोनों भावों को बनाए रखता है।
- source_word: כִּי לֹא תָמְנוּ
  choice: के कारण हम नष्ट नहीं हुए हैं
  rationale: दिए गए मसोराई स्वरांकन में תָמְנוּ प्रथम पुरुष बहुवचन है। ‘हम नष्ट नहीं हुए हैं’ इस व्याकरणिक रूप को स्पष्ट और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: כִּי לֹא כָלוּ
  choice: क्योंकि ... का कभी अन्त नहीं होता
  rationale: दूसरा כִּי पहले कथन का आधार बताता है। निषेध के साथ क्रिया यह व्यक्त करती है कि करुणा समाप्त या चुकती नहीं।
- source_word: רַחֲמָיו
  choice: उसकी करुणा
  rationale: हिब्रू बहुवचन प्रचुर या बार-बार दिखाई गई दया को व्यक्त कर सकता है। हिन्दी में भाववाचक एकवचन ‘करुणा’ अधिक सहज है और मूल अर्थ को बनाए रखता है।
theological_decisions:
- issue: पहले उपवाक्य का कर्ता और वाक्य-विन्यास
  choice: याहवे के अटल प्रेम के कारण हम नष्ट नहीं हुए हैं।
  alternative: याहवे का अटल प्रेम कभी समाप्त नहीं होता।
  rationale: दिए गए WLC पाठ का स्वरांकित תָמְנוּ प्रथम पुरुष बहुवचन है, इसलिए मुख्य पाठ में ‘हम’ कर्ता है। कुछ हिब्रू पांडुलिपियाँ और प्राचीन अनुवाद ऐसी वैकल्पिक पाठ-परंपरा का समर्थन करते हैं जिसमें ‘याहवे का अटल प्रेम’ कर्ता बनता है; इस महत्वपूर्ण भिन्नता को पाद-टिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की, काव्यात्मक किन्तु सामान्य पाठक के लिए सहज रखी गई है। परमेश्वर के व्यक्तिगत नाम को ‘याहवे’ रूप में दिया गया है। ‘अटल प्रेम’ חֶסֶד के प्रेम और निष्ठा—दोनों पक्षों को संक्षेप में व्यक्त करता है।
