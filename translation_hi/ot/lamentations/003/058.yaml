  text: You have defended the cause of my soul[a], O Lord; you have redeemed my life.
translation:
  language: hi
  text: हे प्रभु, आपने मेरे प्राण के मामले की पैरवी की है[a]; आपने मेरे जीवन को छुड़ाया है।
  philosophy: optimal-equivalence
  footnotes:
