    reason: lexical_alternative
lexical_decisions:
- source_word: רַבְתָּ
  choice: मुकदमा लड़ा है
  rationale: ריב का क़ाल रूप यहाँ न्यायिक संदर्भ में किसी का मामला उठाने और उसके पक्ष में लड़ने का भाव देता है। ‘मुकदमा लड़ा है’ आधुनिक हिन्दी में इस कानूनी बिंब को स्पष्ट और स्वाभाविक रूप से बनाए रखता है।
- source_word: אֲדֹנָי
  choice: हे प्रभु
  rationale: यह परमेश्वर के लिए प्रयुक्त आदरसूचक उपाधि और प्रत्यक्ष संबोधन है। ‘हे प्रभु’ हिन्दी में संबोधन को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: רִיבֵי
  choice: मुकदमा
  rationale: רִיבֵי व्याकरणतः बहुवचन है, पर यहाँ सामूहिक या गहन अर्थ में वक्ता के पूरे कानूनी मामले को सूचित कर सकता है। हिन्दी में एकवचन ‘मुकदमा’ अधिक स्वाभाविक है और न्यायिक बिंब को सुरक्षित रखता है।
- source_word: נַפְשִׁי
  choice: मेरे प्राण का
  rationale: נֶפֶשׁ व्यक्ति, प्राण या जीवन को सूचित कर सकता है। ‘प्राण’ हिब्रू अभिव्यक्ति की काव्यात्मक गहराई बनाए रखता है और अगले खंड के חַיָּי (‘मेरा जीवन’) से अनावश्यक समानता नहीं पैदा करता।
- source_word: גָּאַלְתָּ
  choice: छुड़ा लिया है
  rationale: גאל किसी को छुड़ाने, वापस पाने या मुक्त कराने की क्रिया है। ‘छुड़ा लिया है’ हिन्दी में इस उद्धारात्मक भाव को सहज रूप से व्यक्त करता है, बिना बाद की किसी विशिष्ट धर्मवैज्ञानिक व्याख्या को आरोपित किए।
- source_word: חַיָּי
  choice: मेरा जीवन
  rationale: यह बहुवचन रूप यहाँ मुहावरे के रूप में वक्ता के जीवन को दर्शाता है। ‘मेरा जीवन’ इसका स्वाभाविक हिन्दी समतुल्य है।
theological_decisions:
- issue: दोनों काव्य-पंक्तियों में न्यायिक और छुड़ाने के बिंबों को अलग बनाए रखना
  choice: पहली पंक्ति में ‘मुकदमा लड़ा’ और दूसरी में ‘जीवन छुड़ा लिया’ रखा गया है।
  alternative: दोनों को सामान्य बचाव की भाषा में मिला देना, जैसे ‘आपने मेरी सहायता की और मुझे बचाया।’
  rationale: हिब्रू में दो अलग क्रियाएँ और बिंब हैं—ריב न्यायिक पक्ष-समर्थन को और גאל छुड़ाने अथवा वापस पाने को व्यक्त करता है। दोनों को अलग रखने से पद की काव्यात्मक और धर्मवैज्ञानिक गहराई सुरक्षित रहती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। ‘हे प्रभु’ प्रत्यक्ष संबोधन को व्यक्त करता है; ‘मुकदमा लड़ा’ न्यायिक बिंब और ‘छुड़ा लिया’ उद्धार के अलग बिंब को सुरक्षित रखते हैं।
