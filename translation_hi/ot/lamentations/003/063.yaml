    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁבְתָּם
  choice: उनके बैठने
  rationale: यह ישׁב से बना रूप है और ‘उठने’ के साथ मिलकर उनकी समस्त दिनचर्या या गतिविधि को सूचित करता है; ठोस इब्रानी युग्म को बनाए रखा गया है।
- source_word: וְקִימָתָם
  choice: और उठने
  rationale: קום से बना यह रूप ‘बैठने’ के समानांतर है; ‘उठने’ से मूल युग्म स्वाभाविक हिन्दी में सुरक्षित रहता है।
- source_word: הַבִּיטָה
  choice: देख
  rationale: संदर्भ में परमेश्वर को संबोधित प्रत्यक्ष आज्ञार्थक निवेदन है; ‘देख’ सरल, स्वाभाविक और तात्कालिक है।
- source_word: אֲנִי
  choice: मैं
  rationale: मूल में स्पष्ट सर्वनाम वक्ता पर बल देता है, इसलिए इसे बनाए रखा गया है।
- source_word: מַנְגִּינָתָם
  choice: उनका गीत
  rationale: מַנְגִּינָה का अर्थ गीत या संगीत हो सकता है। प्रत्यय सहित शाब्दिक रूप ‘उनका गीत’ मूल की संक्षिप्तता और संदर्भगत अस्पष्टता बनाए रखता है; विलाप के संदर्भ में यह वक्ता को लेकर गाया जाने वाला उपहासपूर्ण गीत भी हो सकता है।
