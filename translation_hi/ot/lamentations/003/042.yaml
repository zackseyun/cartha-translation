lexical_decisions:
- source_word: נַחְנוּ
  choice: हमने
  rationale: प्रथम पुरुष बहुवचन सर्वनाम को स्पष्ट रखा गया है, ताकि इब्रानी का बल और ‘हम... आपने...’ का विरोध बना रहे।
- source_word: פָשַׁעְנוּ
  choice: अपराध किया
  rationale: פשע अधिकार और वाचा के विरुद्ध अपराध या उल्लंघन का भाव रखता है। ‘अपराध किया’ सहज हिन्दी है और अगले क्रियापद के लिए ‘विद्रोह’ का अधिक स्पष्ट भाव बचाए रखता है।
- source_word: וּמָרִינוּ
  choice: और विद्रोह किया
  rationale: מרה का अर्थ विद्रोही होना या विद्रोह करना है। समानान्तर पूर्ण क्रिया के रूप में अनुवाद करके पहले कथन की तीव्रता बनाए रखी गई है।
- source_word: אַתָּה
  choice: आपने
  rationale: परमेश्वर को सम्बोधित एकवचन सर्वनाम को स्पष्ट रखा गया है, जिससे ‘हमने... आपने...’ का बलपूर्ण विरोध सुरक्षित रहता है; आदरार्थक आधुनिक हिन्दी के अनुसार क्रिया बहुवचन रूप में है।
- source_word: לֹא סָלָחְתָּ
  choice: क्षमा नहीं किया
  rationale: סלח परमेश्वर द्वारा क्षमा करने के लिए प्रयुक्त सामान्य क्रिया है। हिन्दी में ‘क्षमा नहीं किया’ स्वाभाविक और सीधा है तथा विलाप में कही गई क्षमा के अभाव की बात को नरम नहीं करता।
theological_decisions:
- issue: विलाप में परमेश्वर द्वारा क्षमा न किया जाना
  choice: आपने क्षमा नहीं किया
  alternative: आपने अपराध माफ़ नहीं किया
  rationale: पाठ परमेश्वर को सीधे सम्बोधित करके क्षमा न किए जाने की बात कहता है। अनुवाद इस धर्मवैचारिक तनाव को बिना स्पष्टीकरण जोड़कर या नरम किए बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और सीधा रूप। परमेश्वर के लिए आदरार्थक ‘आप’ रखा गया है। दोनों इब्रानी क्रियाओं का भेद ‘अपराध किया’ और ‘विद्रोह किया’ से सुरक्षित है।
