  text: पुरुष के लिए यह अच्छा है कि वह अपनी जवानी में जूआ उठाए[a][b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘मनुष्य के लिए’; इब्रानी में पुल्लिंग एकवचन ‘पुरुष’ है, जो यहाँ प्रतिनिधिक रूप से प्रयुक्त हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या ‘जूआ ढोए’; यह बिंब किसी भार या अनुशासन को स्वीकार करके सहने का संकेत देता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: טוֹב
  choice: यह अच्छा है
  rationale: पद के आरम्भ में आया विधेयात्मक विशेषण एक मूल्यांकन व्यक्त करता है; स्वाभाविक हिन्दी में ‘यह अच्छा है’ उस कथन को स्पष्ट रूप से व्यक्त करता है।
- source_word: לַגֶּבֶר
  choice: मनुष्य के लिए
  rationale: גֶּבֶר मूलतः पुरुषवाचक एकवचन है, पर यहाँ सामान्य मानवीय कथन में प्रयुक्त हुआ है। ‘मनुष्य’ आधुनिक हिन्दी में इस प्रतिनिधिक अर्थ को स्वाभाविक रूप से व्यक्त करता है; पादटिप्पणी शाब्दिक ‘पुरुष’ की संभावना सुरक्षित रखती है।
- source_word: כִּי
  choice: कि
  rationale: यहाँ כִּי उस बात की विषयवस्तु प्रस्तुत करता है जिसे अच्छा कहा गया है; इसलिए कारणसूचक ‘क्योंकि’ के बजाय ‘कि’ उपयुक्त है।
- source_word: יִשָּׂא
  choice: उठाए
  rationale: נשא का अर्थ उठाना, ढोना या सहना हो सकता है। ‘जूआ उठाना’ मूल बिंब और भार अथवा अनुशासन को स्वीकार कर सहने की अर्थछाया दोनों को बनाए रखता है।
- source_word: עֹל
  choice: जूआ
  rationale: עֹל का ठोस अर्थ पशु के कंधों पर रखा जाने वाला जूआ है और यहाँ वह भार या अनुशासन का रूपक है। रूपक को ‘बोझ’ कहकर सपाट करने के बजाय ‘जूआ’ बनाए रखा गया है।
- source_word: בִּנְעוּרָיו
  choice: अपनी जवानी में
  rationale: बहुवचन रूप और तृतीय पुरुष एकवचन प्रत्यय जीवन की युवावस्था को दर्शाते हैं। ‘अपनी जवानी में’ संक्षिप्त और स्वाभाविक हिन्दी है।
theological_decisions:
- issue: सामान्य कथन में पुल्लिंग संज्ञा
  choice: मनुष्य के लिए ... अपनी जवानी में
  alternative: पुरुष के लिए ... उसकी जवानी में
  rationale: इब्रानी में גֶּבֶר और संबंधित प्रत्यय व्याकरणतः पुल्लिंग एकवचन हैं, किंतु सूक्ति प्रतिनिधिक सामान्य कथन के रूप में काम करती है। मुख्य पाठ में ‘मनुष्य’ इस व्यापक प्रयोग को व्यक्त करता है, जबकि पादटिप्पणी स्रोत के स्पष्ट पुरुषवाचक रूप को दर्ज करती है।
- issue: जूए का रूपक
  choice: जूआ उठाए
  alternative: बोझ सहे / जूआ ढोए
  rationale: पाठ यह स्पष्ट नहीं करता कि जूआ विशेष रूप से कष्ट, अनुशासन, अधीनता या इनका मिश्रण है। इसलिए ठोस रूपक को बनाए रखा गया है और उसकी धार्मिक व्याख्या को मुख्य पाठ में सीमित नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और सूक्तिपरक रूप अपनाया गया है। ‘जूआ’ बाइबिलीय बिंब को सुरक्षित रखता है, और पादटिप्पणियाँ लिंग-संबंधी शाब्दिकता तथा क्रिया की अर्थ-सीमा स्पष्ट करती हैं।
