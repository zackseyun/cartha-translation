  text: My eye runs down and does not cease[a], without interruption,
translation:
  language: hi
  text: मेरी आँख से आँसू बहते रहते हैं और थमते नहीं, बिना किसी विराम के।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עֵינִי
  choice: मेरी आँख से
  rationale: इब्रानी में संज्ञा एकवचन है। हिन्दी में ‘मेरी आँख से’ एकवचन को बनाए रखते हुए बहने की काव्यात्मक छवि को स्वाभाविक रूप देता है।
- source_word: נִגְּרָה
  choice: आँसू बहते रहते हैं
  rationale: נגר नीचे की ओर बहने या धार बनने का बोध देता है। हिन्दी में केवल ‘आँख बहती है’ अस्वाभाविक है, इसलिए संदर्भ में निहित ‘आँसू’ स्पष्ट किया गया है; ‘बहते रहते हैं’ निरंतरता व्यक्त करता है।
- source_word: וְלֹא תִדְמֶה
  choice: और वे थमते नहीं
  rationale: דמה यहाँ शांत होने, स्थिर होने या रुक जाने का अर्थ दे सकता है। ‘थमते नहीं’ बहते आँसुओं के संदर्भ में स्वाभाविक है और ‘शांत नहीं होती’ की वैकल्पिक छाया भी कुछ हद तक रखता है।
- source_word: מֵאֵין הֲפֻגוֹת
  choice: बिना किसी विराम के
  rationale: यह पदबंध किसी ठहराव, राहत या अवकाश के न होने को व्यक्त करता है। ‘बिना किसी विराम के’ संक्षिप्त और स्वाभाविक हिन्दी है।
