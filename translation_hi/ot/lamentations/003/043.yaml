translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, काव्यात्मक और गरिमापूर्ण शैली। एकवचन ‘तू’ मूल इब्रानी के प्रत्यक्ष संबोधन और विलाप की निकट, तीखी वाणी को सुरक्षित रखता है।
