lexical_decisions:
- source_word: סַכֹּתָה
  choice: तूने अपने को ... ढक लिया
  rationale: क्रिया סכך के आवरण-वाले बिंब को बनाए रखता है; प्रसंग में इसका अर्थ आत्मवाचक समझना स्वाभाविक है।
- source_word: בָאַף
  choice: क्रोध से
  rationale: אַף का शाब्दिक अर्थ ‘नाक’ है, पर यहाँ यह क्रोध का मुहावरा है। ‘क्रोध से’ आवरण के साधन या भाव—दोनों की हल्की अस्पष्टता बनाए रखता है।
- source_word: וַתִּרְדְּפֵנוּ
  choice: और हमारा पीछा किया
  rationale: רדף का सीधा, सामान्य अर्थ ‘पीछा करना’ है; ‘सताया’ अनावश्यक रूप से अधिक विशिष्ट होगा।
- source_word: הָרַגְתָּ
  choice: तूने घात किया
  rationale: הרג की कठोर प्रत्यक्षता रखी गई है। ‘घात किया’ काव्यात्मक और गरिमापूर्ण हिन्दी में मार डालने का स्पष्ट अर्थ देता है।
- source_word: לֹא חָמָלְתָּ
  choice: दया नहीं की
  rationale: חמל में दया करना और छोड़ देना—दोनों अर्थ-छायाएँ हैं। मुख्य पाठ में सहज हिन्दी रखी गई है और वैकल्पिक अर्थ पाद-टिप्पणी में दिया गया है।
theological_decisions:
