lexical_decisions:
- source_word: סְחִי
  choice: मैल
  rationale: यह दुर्लभ संज्ञा किसी घिनौनी, हटाई या खुरची गई वस्तु का बोध कराती है। ‘मैल’ आधुनिक हिन्दी में संक्षिप्त, स्वाभाविक और तिरस्कारसूचक है।
- source_word: וּמָאוֹס
  choice: और कूड़ा
  rationale: यह शब्द तिरस्कृत या फेंक दी गई वस्तु का बोध कराता है। ‘कूड़ा’ त्याज्य और घृणित वस्तु का भाव स्पष्ट करता है तथा ‘मैल’ के साथ तीव्र अपमान का युग्म बनाता है।
- source_word: תְּשִׂימֵנוּ
  choice: तूने हमें ... बना दिया है
  rationale: שׂים का मूल अर्थ ‘रखना/स्थापित करना’ है, पर इस वाक्य-विन्यास में इसका अर्थ किसी को किसी दशा में कर देना है। पूर्ण क्रिया के वर्तमान परिणाम को ‘बना दिया है’ व्यक्त करता है।
- source_word: בְּקֶרֶב
  choice: के बीच
  rationale: यह मूल पद के स्थानिक और सामाजिक भाव को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: הָעַמִּים
  choice: जाति-जाति के लोगों
  rationale: बहुवचन עַמִּים विभिन्न जनसमूहों अथवा राष्ट्रों को सूचित करता है। ‘जाति-जाति के लोग’ हिन्दी बाइबलीय संदर्भ में स्वाभाविक है और ‘राष्ट्रों’ की अपेक्षा लोगों पर अधिक सीधे बल देता है।
