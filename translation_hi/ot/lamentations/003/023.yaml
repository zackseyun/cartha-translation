    reason: alternative_reading
lexical_decisions:
- source_word: חֲדָשִׁים
  choice: नए
  rationale: यह बहुवचन विशेषण है, जिसका अर्थ ‘नए’ या ‘ताज़े’ है। पिछले पद से निहित बहुवचन कर्ता—यहोवा की करुणाएँ—लेने पर ‘नए’ स्वाभाविक और रूप-संगत है।
- source_word: לַבְּקָרִים
  choice: हर सुबह
  rationale: समय-सूचक प्रयोग में यह पदबंध सुबह-दर-सुबह होने की पुनरावृत्ति बताता है; आधुनिक हिन्दी में ‘हर सुबह’ इसे स्पष्ट और सहज रूप से व्यक्त करता है।
- source_word: רַבָּה
  choice: महान
  rationale: अमूर्त संज्ञा ‘विश्वासयोग्यता’ के साथ यह विशेषण उसकी महत्ता और प्रचुरता व्यक्त करता है; ‘महान’ हिन्दी में गरिमापूर्ण और स्वाभाविक विधेय है।
- source_word: אֱמוּנָתֶךָ
  choice: तेरी विश्वासयोग्यता
  rationale: אֱמוּנָה दृढ़ता, भरोसेमंदी और निष्ठा का बोध कराता है। परमेश्वर के संदर्भ में ‘विश्वासयोग्यता’ उसकी भरोसेमंद निष्ठा को व्यक्त करती है, न कि केवल व्यक्तिनिष्ठ विश्वास को।
theological_decisions:
- issue: पिछले पद से ग्रहण किया गया निहित कर्ता
  choice: वे हर सुबह नए होते हैं
  alternative: यह हर सुबह नया होता है
  rationale: इब्रानी पद स्पष्ट कर्ता के बिना बहुवचन विशेषण से आरम्भ होता है। निकटतम संदर्भ में 3:22 की बहुवचन ‘करुणाएँ’ स्वाभाविक पूर्वपद हैं, इसलिए मुख्य पाठ में ‘वे’ रखा गया है; सामूहिक अर्थ लेने की सम्भावना पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, काव्यात्मक और गरिमापूर्ण शैली रखी गई है। परमेश्वर के लिए एकवचन आत्मीय-साहित्यिक संबोधन ‘तेरी’ संदर्भ की प्रार्थनात्मक प्रत्यक्षता को बनाए रखता है।
