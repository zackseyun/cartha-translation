lexical_decisions:
- source_word: בָּנָה
  choice: घेरा बनाया
  rationale: मूल क्रिया का अर्थ ‘बनाना’ है; इस विरोधी प्रसंग में यह घेराबंदी के लिए निर्माण करने की छवि जगाती है। ‘घेरा बनाया’ हिन्दी में उस निर्माण और घेराबंदी, दोनों को स्वाभाविक रूप से व्यक्त करता है।
- source_word: עָלַי
  choice: मेरे विरुद्ध
  rationale: पूर्वसर्ग यहाँ शत्रुतापूर्ण संदर्भ में है, इसलिए ‘मेरे विरुद्ध’ उसका विरोधात्मक भाव स्पष्ट करता है।
- source_word: וַיַּקַּף
  choice: मुझे ... से घेर लिया
  rationale: क्रिया का अर्थ चारों ओर से घेरना है। ‘मुझे’ प्रसंग से पूरित कर्म है और हिन्दी में स्पष्टता के लिए आवश्यक है।
- source_word: רֹאשׁ
  choice: कड़वाहट
  rationale: यह शब्द किसी कड़वे या विषैले पदार्थ को सूचित कर सकता है। मुख्य पाठ में ‘कड़वाहट’ आधुनिक पाठक के लिए सहज है, जबकि ‘विष’ की वास्तविक संभावना पादटिप्पणी में सुरक्षित रखी गई है।
- source_word: תְלָאָה
  choice: कष्ट
  rationale: संज्ञा थकावट, कठिनाई या विपत्ति का भाव रखती है। ‘कष्ट’ इस विलाप के संदर्भ में व्यापक और स्वाभाविक हिन्दी विकल्प है।
