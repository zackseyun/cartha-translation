  yaml_path: translation/ot/lamentations/003/062.yaml
  text: the lips of those who rise against me[b][a], and their muttering against me all day long.
translation:
  language: hi
  text: मेरे विरुद्ध उठनेवालों की बातें[a], और दिन भर मेरे विरुद्ध उनका बुदबुदाना[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक अर्थ, “मेरे विरुद्ध उठनेवालों के होंठ।” इब्रानी में “होंठ” कही गई बातों या वाणी के लिए प्रयुक्त हुआ है।
    reason: lexical_alternative
  - marker: b
    text: या “उनका मनन” अथवा “उनकी फुसफुसाहट।” इब्रानी शब्द मन-ही-मन सोचने या धीमी आवाज़ में बोलने, दोनों का बोध करा सकता है; यहाँ शत्रुतापूर्ण संदर्भ “बुदबुदाना” अर्थ के अनुकूल है।
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׂפְתֵי
  choice: बातें
  rationale: इब्रानी में शाब्दिक अर्थ ‘होंठ’ है, पर यहाँ होंठ वाणी या कही गई बातों के लिए प्रयुक्त ठोस लक्षणा है। हिन्दी में ‘बातें’ अर्थ को स्वाभाविक रूप से व्यक्त करता है; मूल बिंब को पादटिप्पणी में रखा गया है।
- source_word: קָמַי
  choice: मेरे विरुद्ध उठनेवाले
  rationale: यह קום से बना रूप है, जिसका शाब्दिक भाव ‘मेरे विरुद्ध उठनेवाले’ है। यह ‘विरोधी’ की अपेक्षा मूल क्रियात्मक चित्र को अधिक सुरक्षित रखता है।
- source_word: הֶגְיוֹנָם
  choice: उनका बुदबुदाना
  rationale: यह शब्द मनन, धीमी आवाज़ में बोलने या बुदबुदाने को सूचित कर सकता है। शत्रुतापूर्ण संदर्भ में ‘बुदबुदाना’ उचित है और इसे निश्चित रूप से ‘षड्यंत्र रचना’ नहीं बनाता।
- source_word: עָלַי
  choice: मेरे विरुद्ध
  rationale: शाब्दिक अर्थ ‘मुझ पर’ हो सकता है, पर विरोधपूर्ण वाणी के इस संदर्भ में ‘मेरे विरुद्ध’ स्वाभाविक और सटीक है।
- source_word: כָּל הַיּוֹם
  choice: दिन भर
  rationale: यह पूरी अवधि में निरंतरता का भाव देने वाला स्वाभाविक आधुनिक हिन्दी प्रयोग है।
