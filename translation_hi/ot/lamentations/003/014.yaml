lexical_decisions:
- source_word: הָיִיתִי
  choice: मैं ... बन गया हूँ
  rationale: काल-संदर्भ में पूर्ण क्रिया से उत्पन्न वर्तमान दशा व्यक्त होती है; इसलिए आधुनिक हिन्दी में ‘बन गया हूँ’ स्वाभाविक और स्रोत के निकट है।
- source_word: שְּׂחֹק
  choice: हँसी का पात्र
  rationale: यह संज्ञा उपहास या उस व्यक्ति को सूचित करती है जिस पर हँसा जाता है; हिन्दी का यह प्रचलित पदबंध विधेयात्मक प्रयोग को स्पष्ट करता है।
- source_word: לְכָל עַמִּי
  choice: अपने सब लोगों के लिए
  rationale: לְ संबंध को और עַמִּי प्रथम पुरुष एकवचन संबंधसूचक प्रत्यय के साथ ‘मेरे लोग’ को व्यक्त करता है; ‘अपने’ हिन्दी में कर्ता से इसका संबंध स्वाभाविक ढंग से दिखाता है।
- source_word: נְגִינָתָם
  choice: वे ... मेरा गीत गाते हैं
  rationale: शाब्दिक रूप ‘उनका गीत’ है, पर सन्दर्भ में वक्ता उनके उपहासपूर्ण गीत का विषय है। हिन्दी में ‘वे मेरा गीत गाते हैं’ उसी आशय को स्वाभाविक रूप से व्यक्त करता है; उपहासपूर्ण अर्थ की सम्भावना पादटिप्पणी में सुरक्षित है।
- source_word: כָּל הַיּוֹם
  choice: दिन भर
  rationale: यह सामान्य कालवाची अभिव्यक्ति आधुनिक हिन्दी में संक्षेप और स्वाभाविक रूप से ‘दिन भर’ कही जाती है।
