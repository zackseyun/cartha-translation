  text: तू उन्हें हृदय की कठोरता देगा[b][a]; तेरा शाप उन पर होगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तू उन्हें हृदय की कठोरता दे; तेरा शाप उन पर हो।” इब्रानी अपूर्ण क्रिया को यहाँ शाप-प्रार्थना के रूप में भी समझा जा सकता है।
    reason: alternative_reading
  - marker: b
