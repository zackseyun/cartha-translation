    reason: lexical_alternative
lexical_decisions:
- source_word: תִּתֵּן
  choice: तू ... देगा
  rationale: यह נתן का काल अपूर्ण, द्वितीय पुरुष एकवचन रूप है और परमेश्वर को संबोधित करता है। यहाँ भविष्यवाची अनुवाद प्रार्थनात्मक शाप की गंभीरता बनाए रखता है; इच्छासूचक अर्थ की संभावना पादटिप्पणी में दी गई है।
- source_word: מְגִנַּת לֵב
  choice: हृदय की कठोरता
  rationale: शाब्दिक रूप से यह दुर्लभ अभिव्यक्ति ‘हृदय का आवरण/ढाल’ हो सकती है, पर संदर्भ में हृदय की कठोर या संवेदनहीन दशा संभावित अर्थ है।
- source_word: תַּאֲלָתְךָ
  choice: तेरा शाप
  rationale: אלה से बना यह शब्द यहाँ शाप अथवा शाप-वचन को दर्शाता है। ‘तेरा शाप’ स्वाभाविक, स्पष्ट और संदर्भानुकूल है।
- source_word: לָהֶם ... לָהֶם
  choice: उन्हें ... उन पर
  rationale: दोनों प्रयोग दण्ड के प्राप्तकर्ताओं पर बल देते हैं। दूसरे לָהֶם को हिन्दी में स्वाभाविक रीति से ‘उन पर’ कहा गया है।
theological_decisions:
- issue: पद का बल—प्रार्थना या भविष्यवाणी
  choice: ‘तू उन्हें ... देगा; तेरा शाप उन पर होगा।’
  alternative: ‘तू उन्हें हृदय की कठोरता दे; तेरा शाप उन पर हो।’
  rationale: यह पद परमेश्वर से न्याय की प्रार्थना के संदर्भ में है। इब्रानी अपूर्ण क्रिया भविष्यसूचक कथन अथवा इच्छासूचक शाप-प्रार्थना, दोनों रूपों में सुनी जा सकती है। मुख्य पाठ भविष्यवाची बल रखता है और दूसरी संभावना पादटिप्पणी में सुरक्षित है।
