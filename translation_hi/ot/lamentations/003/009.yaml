  yaml_path: translation/ot/lamentations/003/009.yaml
  text: He has walled in my ways with hewn stone[c][b][a]; he has made my paths crooked.
translation:
  language: hi
  text: उसने तराशे हुए पत्थरों[b] से मेरे रास्ते बंद कर दिए हैं[a]; उसने मेरी पगडंडियाँ टेढ़ी कर दी हैं[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘मेरे रास्तों को दीवार खड़ी करके घेर दिया है।’
    reason: lexical_alternative
  - marker: b
    text: या ‘काटकर तैयार किए गए पत्थरों।’
    reason: lexical_alternative
  - marker: c
    text: या ‘मेरी पगडंडियों को मरोड़ दिया है।’
    reason: lexical_alternative
lexical_decisions:
- source_word: גָּדַר
  choice: बंद कर दिए हैं
  rationale: क्रिया का अर्थ दीवार या बाड़ खड़ी करके मार्ग रोकना अथवा घेरना है। पत्थरों के उल्लेख के साथ ‘बंद कर दिए हैं’ बाधा के ठोस चित्र और प्रसंगगत अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: דְּרָכַי
  choice: मेरे रास्ते
  rationale: דֶּרֶךְ मार्ग, रास्ता या जीवन-क्रम का बोध करा सकता है। ‘रास्ते’ यहाँ यात्रा के चित्र को बनाए रखते हुए सम्भावित आलंकारिक विस्तार को खुला रखता है।
- source_word: בְּגָזִית
  choice: तराशे हुए पत्थरों से
  rationale: גָּזִית काटकर और आकार देकर तैयार किए गए निर्माण-पत्थर को दर्शाता है। ‘तराशे हुए पत्थर’ मजबूत और जानबूझकर बनाई गई रुकावट का चित्र स्पष्ट करता है।
- source_word: נְתִיבֹתַי
  choice: मेरी पगडंडियाँ
  rationale: נְתִיבָה किसी पथ या पगडंडी को दर्शाता है। ‘पगडंडियाँ’ पहले अर्ध-पद के ‘रास्ते’ के साथ काव्यात्मक समानांतरता और शब्दगत भिन्नता दोनों बनाए रखता है।
- source_word: עִוָּה
  choice: टेढ़ी कर दी हैं
  rationale: क्रिया मोड़ने, विकृत करने या टेढ़ा करने का अर्थ देती है। ‘टेढ़ी कर दी हैं’ मार्ग के ठोस बिम्ब को सुरक्षित रखता है और अनावश्यक नैतिक अर्थ आरोपित नहीं करता।
