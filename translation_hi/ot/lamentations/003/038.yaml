lexical_decisions:
- source_word: מִפִּי
  choice: के मुँह से
  rationale: मूल इब्रानी बिंब को बनाए रखते हुए यह वाणी, आदेश या निर्णय के स्रोत का भाव व्यक्त करता है।
- source_word: עֶלְיוֹן
  choice: परमप्रधान
  rationale: यह परमेश्वर के लिए प्रयुक्त उपाधि का मानक, स्वाभाविक और उसके सर्वोच्च होने का भाव रखने वाला हिन्दी रूप है।
- source_word: לֹא תֵצֵא
  choice: क्या ... नहीं निकलते?
  rationale: शाब्दिक अर्थ ‘नहीं निकलते’ है; निकटवर्ती प्रसंग में यह आलंकारिक प्रश्न है। ‘निकलते’ मुँह से उद्गम होने के इब्रानी बिंब को भी सुरक्षित रखता है।
- source_word: הָרָעוֹת
  choice: विपत्तियाँ
  rationale: यहाँ शब्द हानिकारक, प्रतिकूल या दुःखद घटनाओं को सूचित कर सकता है। ‘विपत्तियाँ’ नैतिक बुराई को अनिवार्य रूप से परमेश्वर से उत्पन्न बताने का अतिरिक्त अर्थ जोड़े बिना प्रसंगानुकूल प्रतिकूलता व्यक्त करता है।
- source_word: וְהַטּוֹב
  choice: और भलाई
  rationale: विशेषण का संज्ञात्मक प्रयोग व्यापक रूप से अच्छी या हितकारी बात को दर्शाता है; ‘भलाई’ उसी व्यापकता को बनाए रखती है।
theological_decisions:
- issue: क्या רָעוֹת को नैतिक बुराई या प्रतिकूल घटनाओं के अर्थ में प्रस्तुत किया जाए
  choice: ‘विपत्तियाँ’
  alternative: ‘बुराइयाँ’ या ‘आपदाएँ’
  rationale: शब्द में व्यापक अर्थ-संभावना है, पर विलापगीत के प्रसंग में विपत्ति और दुःख प्रमुख हैं। यह चयन परमप्रधान की प्रभुता के कथन को बनाए रखता है, पर मूल से अधिक स्पष्ट रूप से नैतिक बुराई की उत्पत्ति का दावा नहीं करता।
- issue: क्या पद को साधारण निषेध या आलंकारिक प्रश्न माना जाए
  choice: 'आलंकारिक प्रश्न: ‘क्या ... दोनों नहीं निकलते?’'
  alternative: 'घोषणात्मक निषेध: ‘... नहीं निकलते।’'
  rationale: 3:37–39 का तर्क प्रश्नों की शृंखला में प्रतिकूल और अनुकूल परिणामों पर प्रभु की सत्ता को सामने रखता है। प्रश्नवाचक रूप हिन्दी में इस प्रसंगगत बल को स्पष्ट करता है, जबकि इब्रानी में प्रश्नवाचक कण निहित है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘परमप्रधान’ पारंपरिक रूप से पहचानी जाने वाली ईश्वरीय उपाधि है। ‘मुँह से ... निकलते’ मूल इब्रानी के ठोस काव्यात्मक बिंब को सुरक्षित रखता है; डैश ‘दोनों’ के संतुलित विरोध पर बल देता है।
