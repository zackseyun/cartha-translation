base_translation:
  language: en
  yaml_path: translation/ot/lamentations/003/032.yaml
  text: For if he causes grief[b][a], he will also show compassion according to the abundance of his steadfast love.
translation:
  language: hi
  text: क्योंकि यदि वह दुःख देता है,[a] तो वह भी अपने अटल प्रेम[b] की बहुतायत के अनुसार करुणा दिखाएगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “यद्यपि वह दुःख देता है, फिर भी वह अपने अटल प्रेम की बहुतायत के अनुसार करुणा दिखाएगा।” संदर्भ में इब्रानी वाक्यांश का रियायती अर्थ भी हो सकता है।
    reason: alternative_reading
  - marker: b
    text: “अटल प्रेम” इब्रानी शब्द ह़ेसेद का अनुवाद है; संदर्भ के अनुसार इसका अर्थ “निष्ठावान प्रेम,” “वाचा का प्रेम,” या “दया” भी व्यक्त किया जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי אִם
  choice: क्योंकि यदि
  rationale: यह पद पिछले कथन का कारण बताते हुए एक शर्त प्रस्तुत करता है। यह अनुवाद כִּי के व्याख्यात्मक बल और אִם के शर्तसूचक अर्थ, दोनों को बनाए रखता है; संदर्भ में संभव रियायती अर्थ को पादटिप्पणी में दिया गया है।
- source_word: הוֹגָה
  choice: वह दुःख देता है
  rationale: हिफ़ील रूप का कारक भाव है—दुःख या शोक उत्पन्न करना। यह चयन आधुनिक हिन्दी में स्वाभाविक है और विलाप के भावात्मक संदर्भ को बनाए रखता है।
- source_word: וְרִחַם
  choice: तो भी वह … करुणा दिखाएगा
  rationale: רחם करुणा या दया प्रकट करने को दर्शाता है। संदर्भ के विरोधात्मक संतुलन को हिन्दी में स्वाभाविक बनाने के लिए वाव को ‘तो भी’ से व्यक्त किया गया है।
- source_word: כְּרֹב
  choice: की बहुतायत के अनुसार
  rationale: כְּ के साथ רֹב मात्रा और मानक का भाव देता है। यह पदबंध प्रेम की प्रचुरता और उसी के अनुरूप करुणा दिखाने—दोनों भावों को सुरक्षित रखता है।
- source_word: חסדו
  choice: अपने अटल प्रेम
  rationale: חסד में निष्ठावान प्रेम, दया और संबंधपरक वाचा-निष्ठा के अर्थ समाए हैं। ‘अटल प्रेम’ इस गहराई को संक्षेप और सहज हिन्दी में व्यक्त करता है तथा इसे רחם की ‘करुणा’ से अलग रखता है।
theological_decisions:
- issue: רחם और חסד के परस्पर संबंधित अर्थों को अलग बनाए रखना
  choice: רחם के लिए ‘करुणा दिखाएगा’ और חסד के लिए ‘अटल प्रेम’
  alternative: दोनों को ‘दया’ से संबंधित समान शब्दावली में व्यक्त करना
  rationale: इब्रानी में ये दो निकट, पर अलग शब्द हैं। भेद बनाए रखने से यह अर्थ उभरता है कि परमेश्वर का करुणामय कार्य उसके प्रचुर, निष्ठावान प्रेम से निकलता है; दोनों धारणाओं को एक ही शब्द में मिला नहीं दिया जाता।
- issue: כִּי אִם का शर्तसूचक अथवा रियायती भाव
  choice: मुख्य पाठ में ‘क्योंकि यदि’, और संदर्भगत रियायती अर्थ पादटिप्पणी में
  alternative: मुख्य पाठ में ‘यद्यपि’ या ‘चाहे … फिर भी’
  rationale: शब्द-रचना सीधे शर्तसूचक अनुवाद का समर्थन करती है, जबकि निकट संदर्भ रियायती भाव की अनुमति देता है। मुख्य पाठ और पादटिप्पणी मिलकर इस वास्तविक अस्पष्टता को सुरक्षित रखते हैं।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य रूप। ‘दुःख देता है’ भावात्मक संदर्भ को बनाए रखता है; ‘करुणा दिखाएगा’ और ‘अटल प्रेम’ संबंधित इब्रानी शब्दों के बीच अर्थगत भेद सुरक्षित रखते हैं।
