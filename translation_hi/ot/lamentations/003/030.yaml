  yaml_path: translation/ot/lamentations/003/030.yaml
  text: Let him give his cheek to the one who strikes him[a]; let him be filled with reproach.
translation:
  language: hi
  text: जो उसे मारता है, उसे वह अपना गाल दे; वह अपमान से भर जाए।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वह जी भरकर अपमान सहे।” इब्रानी में शाब्दिक चित्र ‘अपमान से भर जाने’ का है।
    reason: lexical_alternative
lexical_decisions:
- source_word: יִתֵּן
  choice: कर दे
  rationale: यहाँ क़ाल अपूर्ण रूप प्रसंग में भविष्यवाणी नहीं, बल्कि उपदेशात्मक/आज्ञार्थक भाव व्यक्त करता है; ‘कर दे’ आधुनिक हिन्दी में इस भाव को स्वाभाविक रूप से रखता है।
- source_word: לְמַכֵּהוּ
  choice: जो उसे मारे, उसकी ओर
  rationale: לְ के साथ נכה का हिफ़ील कृदन्त और तृतीय पुरुष एकवचन प्रत्यय उस व्यक्ति को दर्शाता है जो उसे मारता है; यह रूप सहभागी अर्थ को स्पष्ट और सहज हिन्दी में व्यक्त करता है।
- source_word: לֶחִי
  choice: अपना गाल
  rationale: לֶחִי गाल या जबड़े के क्षेत्र को दर्शाता है। प्रसंग में ‘गाल’ प्रहार और अपमान को सहने की दृश्यात्मकता बनाए रखता है; हिन्दी में स्पष्टता के लिए ‘अपना’ जोड़ा गया है।
- source_word: יִשְׂבַּע
  choice: भर जाए
  rationale: שׂבע का मूल अर्थ तृप्त या भर जाना है। यहाँ रूपकात्मक प्रयोग है; ‘भर जाए’ उस रूपक को संक्षिप्त और स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: בְּחֶרְפָּה
  choice: अपमान से
  rationale: חֶרְפָּה निन्दा, तिरस्कार, लज्जा या सामाजिक अपमान को व्यक्त कर सकता है। ‘अपमान’ इस विलाप के संदर्भ में सार्वजनिक तिरस्कार और मानहानि, दोनों को सामान्य आधुनिक हिन्दी में समेटता है।
theological_decisions:
- issue: गाल देने और अपमान से भर जाने का संबंध
  choice: दो समांतर उपदेशात्मक उपवाक्यों को यथावत रखा गया है
  alternative: इसे प्रतिरोध न करने या क्षमा करने की स्पष्ट धार्मिक आज्ञा के रूप में विस्तृत करना
  rationale: इब्रानी पाठ प्रहार और अपमान सहने का चित्र देता है, पर उसके धर्मशास्त्रीय आशय को यहाँ स्पष्ट सिद्धान्त में नहीं बदलता; इसलिए निहित तनाव और संक्षिप्तता सुरक्षित रखी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और काव्यात्मक रूप अपनाया गया है। वाक्य की समानांतर संरचना तथा इब्रानी के ‘भर जाने’ वाले रूपक को बनाए रखा गया है।
