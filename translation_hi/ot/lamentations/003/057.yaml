base_translation:
  language: en
  yaml_path: translation/ot/lamentations/003/057.yaml
  text: You came near on the day I called to you; you said[a], “Do not fear.”
translation:
  language: hi
  text: जिस दिन मैंने तुझे पुकारा, तू मेरे निकट आया; तूने कहा, “मत डर।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: קָרַבְתָּ
  choice: तू मेरे निकट आया
  rationale: קרב के काल पूर्ण, द्वितीय पुरुष एकवचन पुल्लिंग रूप का ठोस निकटता-बोध सुरक्षित रहता है। हिन्दी में ‘मेरे निकट आया’ स्वाभाविक है और संदर्भ से स्पष्ट संबंध को व्यक्त करता है।
- source_word: בְּיוֹם
  choice: जिस दिन
  rationale: בְּ के साथ יוֹם यहाँ समयसूचक है। ‘जिस दिन’ हिन्दी में उसी कालगत संबंध को सहज और स्पष्ट रूप से जोड़ता है।
- source_word: אֶקְרָאֶךָּ
  choice: मैंने तुझे पुकारा
  rationale: קרא के प्रथम पुरुष एकवचन रूप के साथ द्वितीय पुरुष एकवचन प्रत्यय है। काव्यात्मक प्रार्थना में ‘पुकारा’ पुकारने का भाव रखता है, पर मूल से अधिक तीव्रता नहीं जोड़ता। आसपास के पूर्ण क्रियारूपों के अनुरूप हिन्दी में भूतकाल स्वाभाविक है।
- source_word: אָמַרְתָּ
  choice: तूने कहा
  rationale: אמר का सीधा और प्रचलित हिन्दी रूप ‘कहा’ है।
- source_word: אַל
  choice: मत
  rationale: अपूर्ण/आज्ञार्थक क्रिया के साथ אַל निषेध व्यक्त करता है। हिन्दी में ‘मत’ संक्षिप्त, स्वाभाविक और समान बल वाला निषेध है।
- source_word: תִּירָא
  choice: डर
  rationale: ירא का द्वितीय पुरुष एकवचन रूप אַל के बाद निषेधात्मक आज्ञा का भाव देता है। ‘मत डर’ आधुनिक हिन्दी में सीधा और पारदर्शी रूप है।
theological_decisions:
- issue: सम्बोधित व्यक्ति और वक्ता की पहचान
  choice: 'पद को परमेश्वर से सीधे सम्बोधन के रूप में रखा गया है: ‘तू ... आया; तूने कहा।’'
  alternative: व्याकरण की दृष्टि से किसी अनिर्दिष्ट व्यक्ति का निकट आना संदर्भ में कम सम्भावित है।
  rationale: दोनों क्रियाएँ द्वितीय पुरुष एकवचन पुल्लिंग में हैं और आसपास का प्रसंग प्रार्थना है, इसलिए सम्बोधित व्यक्ति परमेश्वर समझा जाता है। अनुवाद इससे आगे कोई अतिरिक्त धर्मवैज्ञानिक दावा नहीं जोड़ता।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सहज हिन्दी। परमेश्वर के लिए एकवचन आत्मीय सम्बोधन ‘तू’ रखा गया है, जो इब्रानी के द्वितीय पुरुष एकवचन और विलाप की निकट प्रार्थनात्मक वाणी को सुरक्षित रखता है।
