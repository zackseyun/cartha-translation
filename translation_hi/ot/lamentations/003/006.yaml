base_translation:
  language: en
  yaml_path: translation/ot/lamentations/003/006.yaml
  text: He has made me dwell in darkness like those long dead[a].
translation:
  language: hi
  text: 'उसने मुझे अँधेरे स्थानों में बसा दिया है,

    मानो मैं बहुत पहले मर चुके लोगों के समान हूँ।[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसने मुझे अँधेरों में बैठा दिया है, पुराने समय के मृतकों के समान।”
    reason: शाब्दिक विकल्प; ‘बसा दिया’ के स्थान पर ‘बैठा दिया’ और עוֹלָם के लिए ‘पुराने समय के’ मूल की अन्य सम्भव छायाएँ सुरक्षित रखते हैं।
lexical_decisions:
- source_word: בְּמַחֲשַׁכִּים
  choice: अँधेरे स्थानों में
  rationale: बहुवचन संज्ञा और בְּ स्थान का बोध कराते हैं। ‘अँधेरे स्थानों में’ मूल के बहुवचन रूप को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: הוֹשִׁיבַנִי
  choice: उसने मुझे ... बसा दिया है
  rationale: ישׁב के हिफ़ील रूप में किसी को बैठाने या रहने के लिए रख देने का कारक अर्थ है। प्रसंग में ‘बसा दिया है’ थोपी गई स्थिति और लगातार निवास—दोनों को सहज हिन्दी में व्यक्त करता है।
- source_word: כְּמֵתֵי
  choice: मानो मैं ... मरे हुओं में से हूँ
  rationale: तुलनासूचक כְּ को ‘मानो’ से व्यक्त किया गया है। हिन्दी में ‘मरे हुओं में से’ वक्ता की मृतकों जैसी अवस्था को स्पष्ट और स्वाभाविक रूप से सामने लाता है।
- source_word: עוֹלָם
  choice: बहुत पहले के
  rationale: यहाँ עוֹלָם दूर अतीत का संकेत दे सकता है। ‘बहुत पहले के’ अनन्तकाल का दार्शनिक अर्थ थोपे बिना प्राचीन समय से मृत पड़े लोगों का भाव देता है।
theological_decisions:
- issue: עוֹלָם का कालगत अर्थ
  choice: बहुत पहले के मरे हुए
  alternative: सदा के लिए मरे हुए
  rationale: मृतकों के साथ यह शब्द अधिक स्वाभाविक रूप से सुदूर अतीत अथवा दीर्घकाल से मृत होने का संकेत देता है; इसे शाश्वत मृत्यु के धर्मवैज्ञानिक कथन के रूप में निश्चित करना उचित नहीं।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी। काव्यात्मक उपमा तथा मूल की कालगत अस्पष्टता को बनाए रखा गया है।
