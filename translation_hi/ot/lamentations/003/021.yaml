  text: זֹ֛את אָשִׁ֥יב אֶל לִבִּ֖/י עַל כֵּ֥ן אוֹחִֽיל־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/003/021.yaml
  text: This I call to mind[a]; therefore I have hope.
translation:
  language: hi
  text: यह बात मैं फिर अपने मन में लाता हूँ[a]; इसलिए मैं आशा रखता हूँ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक शाब्दिक रूप में: ‘यह बात मैं फिर अपने हृदय में लाता हूँ’; अंतिम पद का अर्थ ‘इसलिए मैं अपेक्षापूर्वक प्रतीक्षा करता हूँ’ भी हो सकता है।'
    reason: मूल इब्रानी बिंब और יחל में निहित आशा/प्रतीक्षा की अर्थ-सीमा को सुरक्षित रखना।
lexical_decisions:
- source_word: זֹאת
  choice: यह बात
  rationale: स्त्रीलिंग एकवचन संकेतवाचक का संदर्भ खुला रहता है और आगे या पीछे कही गई बात की ओर संकेत कर सकता है। हिन्दी में ‘यह बात’ स्वाभाविक है।
- source_word: אָשִׁיב
  choice: मैं फिर ... लाता हूँ
  rationale: שׁוב के हिफ़ील रूप का मूल भाव ‘वापस लाना’ है। ‘फिर अपने मन में लाता हूँ’ स्मरण करने के अर्थ को व्यक्त करते हुए मूल बिंब भी बनाए रखता है।
- source_word: אֶל לִבִּי
  choice: अपने मन में
  rationale: इब्रानी ‘हृदय’ यहाँ स्मृति, विचार और भीतरी मनन का केंद्र है। आधुनिक हिन्दी में ‘मन में लाना’ इस मुहावरे का स्वाभाविक समतुल्य है और इसे केवल भावनाओं तक सीमित नहीं करता।
- source_word: עַל כֵּן
  choice: इसलिए
  rationale: यह कारण से परिणाम की ओर ले जाने वाला सामान्य निष्कर्षसूचक पदबंध है; ‘इसलिए’ संबंध को स्पष्ट और संक्षिप्त रखता है।
- source_word: אוֹחִיל
  choice: मैं आशा रखता हूँ
  rationale: יחל का हिफ़ील रूप आशा रखने या अपेक्षापूर्वक बाट जोहने का भाव दे सकता है। ‘आशा रखता हूँ’ विलाप के बीच स्थिर प्रत्याशा को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: לֵב (‘हृदय’) का मानव-स्वभाव संबंधी मुहावरा
  choice: ‘अपने मन में’
  alternative: ‘अपने हृदय में’
  rationale: इब्रानी में ‘हृदय’ विचार, स्मृति और संकल्प को भी समेटता है। हिन्दी का ‘मन में लाना’ इस व्यापक भीतरी क्रिया को स्वाभाविक रूप से व्यक्त करता है; इससे कोई धर्मवैज्ञानिक निष्कर्ष न जोड़ा गया है, न हटाया गया है।
- issue: יחל में आशा और प्रतीक्षारत अपेक्षा का संबंध
  choice: ‘मैं आशा रखता हूँ’
  alternative: ‘मैं प्रतीक्षा करता हूँ’
  rationale: संदर्भ में स्मरण से उत्पन्न आशा प्रमुख है, पर मूल शब्द में अपेक्षापूर्वक प्रतीक्षा का संभावित भाव भी है; इसे पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘मन में लाना’ हिन्दी का स्वाभाविक मुहावरा है, जबकि पादटिप्पणी मूल के ‘हृदय’ वाले बिंब और अंतिम क्रिया की अर्थगत व्यापकता को दर्ज करती है।
