    reason: lexical_alternative
lexical_decisions:
- source_word: פָּצוּ
  choice: खोल दिया है
  rationale: פצה का काल रूप पूर्ण क्रिया को व्यक्त करता है और यहाँ ‘मुँह’ के साथ शत्रुतापूर्ण बोलने या ताना मारने का भाव रखता है। मुख्य पाठ में स्वाभाविक हिन्दी रखी गई है, जबकि अधिक तीव्र अर्थ पाद-टिप्पणी में दिया गया है।
- source_word: עָלֵינוּ
  choice: हमारे विरुद्ध
  rationale: इस शत्रुतापूर्ण प्रसंग में עַל स्थानसूचक ‘हम पर’ के बजाय विरोध का भाव व्यक्त करता है।
- source_word: פִּיהֶם
  choice: अपना मुँह
  rationale: इब्रानी में ‘उनका मुँह’ एकवचन है, पर अनेक शत्रुओं के साथ इसका वितरणात्मक अर्थ है। हिन्दी में ‘अपना मुँह’ उस मूल एकवचन को स्वाभाविक ढंग से बनाए रखता है।
- source_word: כָּל
  choice: सब
  rationale: यहाँ כָּל सामूहिक अर्थ में सभी शत्रुओं को समेटता है; ‘सब’ सहज आधुनिक हिन्दी है।
- source_word: אֹיְבֵינוּ
  choice: हमारे शत्रुओं
  rationale: אֹיֵב का सीधा और प्रसंगानुकूल हिन्दी रूप ‘शत्रु’ है; प्रथम पुरुष बहुवचन प्रत्यय ‘हमारे’ से व्यक्त हुआ है।
