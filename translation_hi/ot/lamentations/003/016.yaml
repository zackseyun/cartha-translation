lexical_decisions:
- source_word: וַיַּגְרֵס
  choice: पीस डाले हैं
  rationale: क्रिया कुचलने या पीसने का भाव व्यक्त करती है। दाँत और कंकड़ के इस प्रसंग में ‘पीस डाले हैं’ इब्रानी के तीखे, हिंसक बिंब को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: בֶּחָצָץ
  choice: कंकड़ से
  rationale: חָצָץ छोटे पत्थरों या कंकड़ को दर्शाता है। ‘कंकड़’ सामान्य आधुनिक हिन्दी में स्पष्ट है और दाँतों पर उसकी कठोर रगड़ का बिंब सुरक्षित रखता है।
- source_word: שִׁנָּי
  choice: मेरे दाँत
  rationale: यह प्रथम पुरुष एकवचन प्रत्यय सहित बहुवचन रूप है; इसलिए ‘मेरे दाँत’ सीधा और स्वाभाविक अनुवाद है।
- source_word: הִכְפִּישַׁנִי
  choice: मुझे ... दबा दिया है
  rationale: यह दुर्लभ क्रिया है और नीचे दबाने, झुकाने या अपमानित करके नीचा करने का भाव दे सकती है। ‘दबा दिया है’ शारीरिक तथा अपमानजनक दोनों संकेतों को बनाए रखते हुए किसी एक व्याख्या पर आवश्यकता से अधिक बल नहीं देता।
- source_word: בָּאֵפֶר
  choice: राख में
  rationale: אֵפֶר का अर्थ ‘राख’ है, ‘धूल’ नहीं। हिन्दी में ‘राख में दबा दिया’ स्थान और नीचे किए जाने की गति, दोनों को स्वाभाविक ढंग से व्यक्त करता है।
