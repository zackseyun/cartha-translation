id: LAM.3.59
reference: Lamentations 3:59
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: רָאִ֤יתָה יְהוָה֙ עַוָּ֣תָתִ֔/י שָׁפְטָ֖/ה מִשְׁפָּטִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/003/059.yaml
  text: You have seen[a], O Yahweh, the wrong done to me[b]; judge my case.
translation:
  language: hi
  text: हे याहवे, आपने मेरे साथ हुआ अन्याय देखा है[a]; मेरे मुकदमे का न्याय कीजिए[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “मेरे विरुद्ध की गई ज्यादती”; इब्रानी शब्द टेढ़ेपन, बिगाड़ या अन्याय को सूचित कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: या “मेरे पक्ष में न्याय कीजिए।”
    reason: lexical_alternative
lexical_decisions:
- source_word: רָאִיתָה
  choice: आपने ... देखा है
  rationale: रָאָה के काल-संपन्न रूप को वर्तमान से जुड़ी हुई पिछली क्रिया के रूप में व्यक्त किया गया है। विनती के प्रसंग में ‘देखा है’ परमेश्वर के ध्यान देने और अब न्याय करने की अपील को स्वाभाविक रूप से जोड़ता है।
- source_word: יְהוָה
  choice: हे याहवे
  rationale: इब्रानी व्यंजनात्मक नाम יהוה को उपाधि से बदलने के बजाय ‘याहवे’ के रूप में लिप्यंतरित किया गया है; ‘हे’ प्रत्यक्ष संबोधन को स्पष्ट करता है।
- source_word: עַוָּתָתִי
  choice: मेरे साथ हुआ अन्याय
  rationale: यह संज्ञा टेढ़ेपन, बिगाड़ या अन्याय को सूचित कर सकती है। निकटवर्ती न्यायिक अपील के कारण यहाँ वक्ता द्वारा किया गया पाप नहीं, बल्कि उसके साथ हुआ अन्याय अभिप्रेत है।
- source_word: שָׁפְטָה
  choice: न्याय कीजिए
  rationale: שׁפט के आज्ञार्थक रूप की न्यायिक क्रिया को स्पष्ट रखते हुए सम्मानसूचक और प्रार्थनापूर्ण आधुनिक हिन्दी प्रयोग चुना गया है।
- source_word: מִשְׁפָּטִי
  choice: मेरे मुकदमे
  rationale: מִשְׁפָּט यहाँ निर्णय, न्यायिक दावा या मामला सूचित करता है। ‘मुकदमा’ न्यायालय-संबंधी भाव को सहज आधुनिक हिन्दी में बनाए रखता है।
theological_decisions:
- issue: יהוה परमेश्वर के नाम का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में व्यक्तिगत नाम सीधे आया है। ‘याहवे’ उसका प्रचलित विद्वत्तापूर्ण लिप्यंतरण है और उसे किसी उपाधि से नहीं बदलता।
- issue: עַוָּתָתִי का कर्तृवाचक या कर्मवाचक अर्थ
  choice: मेरे साथ हुआ अन्याय
  alternative: मेरा अन्याय; मेरे विरुद्ध की गई ज्यादती
  rationale: विलाप के इस प्रसंग और ‘मेरे मुकदमे का न्याय कीजिए’ के समानांतर न्यायिक कथन से कर्मवाचक अर्थ अधिक उपयुक्त है, फिर भी शब्द की व्यापक अर्थ-सीमा पादटिप्पणी में सुरक्षित रखी गई है।
- issue: न्याय की माँग का स्वरूप
  choice: मेरे मुकदमे का न्याय कीजिए
  alternative: मेरे पक्ष में न्याय कीजिए
  rationale: मुख्य पाठ न्याय करने की अपील को रखता है, पर परिणाम को पहले से ‘मेरे पक्ष में’ कहकर निश्चित नहीं करता। वैकल्पिक अर्थ दोषमुक्त या न्यायोचित ठहराए जाने की विनती हो सकता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सम्मानसूचक ‘आप’ और ‘कीजिए’ का प्रयोग प्रार्थना की गरिमा तथा सहजता बनाए रखता है। न्यायालय-संबंधी रूपक को ‘अन्याय’, ‘मुकदमा’ और ‘न्याय’ के द्वारा स्पष्ट रखा गया है।
