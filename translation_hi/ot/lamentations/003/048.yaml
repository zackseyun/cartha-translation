  text: פַּלְגֵי מַ֨יִם֙ תֵּרַ֣ד עֵינִ֔/י עַל שֶׁ֖בֶר בַּת עַמִּֽ/י־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/003/048.yaml
  text: Streams of water run down from my eyes over the destruction of the daughter of my people[a][b].
translation:
  language: hi
  text: 'मेरी आँखों से जलधाराएँ बहती हैं,


    मेरी प्रजा की बेटी के विनाश पर[a][b]।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘बरबादी’ अथवा ‘टूटन’।
    reason: lexical_alternative
  - marker: b
    text: ‘मेरी प्रजा की बेटी’ एक इब्रानी काव्यात्मक अभिव्यक्ति है, जिसमें लोगों—अक्सर सिय्योन या यहूदा—को बेटी के रूप में प्रस्तुत किया गया है।
    reason: cultural_note
lexical_decisions:
- source_word: פַּלְגֵי מַיִם
  choice: जलधाराएँ
  rationale: פֶּלֶג नहर, धारा या विभाजित जल-प्रवाह को दर्शाता है। आँसुओं के काव्यात्मक चित्र में ‘जलधाराएँ’ रूपक की तीव्रता और स्वाभाविक हिन्दी दोनों को बनाए रखता है।
- source_word: תֵּרַד
  choice: बहती हैं
  rationale: יָרַד का मूल अर्थ ‘नीचे उतरना’ है; आँखों से निकलती जलधाराओं के लिए हिन्दी में ‘बहती हैं’ स्वाभाविक है और नीचे की ओर गति संदर्भ से स्पष्ट रहती है।
- source_word: עֵינִי
  choice: मेरी आँखों
  rationale: इब्रानी रूप व्याकरणतः एकवचन है, पर यहाँ सामूहिक अर्थ में आँखों की जोड़ी का उल्लेख है; हिन्दी मुहावरे में बहुवचन अधिक स्वाभाविक है।
- source_word: עַל
  choice: पर
  rationale: यह शोक के कारण या अवसर को सूचित करता है। ‘विनाश पर’ हिन्दी में किसी विपत्ति को लेकर विलाप करने का संक्षिप्त और स्रोत-सन्निकट प्रयोग है।
- source_word: שֶׁבֶר
  choice: विनाश
  rationale: विलाप के प्रसंग में यह शब्द टूटने, ध्वंस, बरबादी या सामुदायिक विपत्ति को दर्शाता है। ‘विनाश’ बाहरी और सामूहिक तबाही को स्पष्ट करता है, जबकि अन्य संभावित अर्थ पादटिप्पणी में सुरक्षित हैं।
- source_word: בַּת עַמִּי
  choice: मेरे लोगों की बेटी
  rationale: शाब्दिक काव्यात्मक मानवीकरण को बनाए रखा गया है; इसे केवल ‘मेरे लोग’ कहने से इब्रानी विलाप-काव्य का चित्र मिट जाता।
theological_decisions:
- issue: ‘मेरे लोगों की बेटी’ की पहचान
  choice: काव्यात्मक अभिव्यक्ति को मुख्य पाठ में यथावत रखा गया है।
  alternative: इसे सीधे ‘सिय्योन’, ‘यहूदा’ या ‘मेरे लोग’ के रूप में स्पष्ट करना।
  rationale: इस पद में अभिव्यक्ति स्वयं समुदाय का बेटी के रूप में मानवीकरण करती है; किसी एक स्पष्ट ऐतिहासिक नाम को मुख्य पाठ में रख देना मूल की व्यापकता और काव्यात्मक तनाव को सीमित कर देता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की, गरिमापूर्ण और सहज रखी गई है। पद की काव्यात्मक पंक्ति-विन्यास तथा ‘जलधाराएँ’ और ‘मेरे लोगों की बेटी’ जैसे मूल रूपक सुरक्षित रखे गए हैं।
