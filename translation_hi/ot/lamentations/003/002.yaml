  text: אוֹתִ֥/י נָהַ֛ג וַ/יֹּלַ֖ךְ חֹ֥שֶׁךְ וְ/לֹא אֽוֹר־׃
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/003/002.yaml
  text: He has driven me and made me walk in darkness and not light[a].
translation:
  language: hi
  text: उसने मुझे हाँका और अँधेरे में चलाया, उजाले में नहीं।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘उसने मुझे आगे ले जाकर अँधेरे में चलाया, उजाले में नहीं।’
    reason: नָהַג का अर्थ ‘हाँकना’ के साथ-साथ ‘ले जाना’ भी हो सकता है; विकल्प इस कम कठोर अर्थ को सुरक्षित रखता है।
lexical_decisions:
- source_word: אוֹתִי
  choice: मुझे
  rationale: प्रत्यक्ष कर्म-सूचक कण के साथ प्रथम पुरुष एकवचन सर्वनाम को हिन्दी में स्वाभाविक रूप से ‘मुझे’ कहा गया है।
- source_word: נָהַג
  choice: हाँका
  rationale: क्रिया का अर्थ ‘ले जाना’, ‘मार्ग दिखाना’ या ‘हाँकना’ हो सकता है। विलाप और पीड़ा के संदर्भ में ‘हाँका’ बाध्यता और कठोरता का भाव सुरक्षित रखता है।
- source_word: וַיֹּלַךְ
  choice: चलाया
  rationale: हिफ़ील रूप की प्रेरणार्थक शक्ति को ‘चलाया’ व्यक्त करता है—अर्थात उसने वक्ता को चलने या जाने पर विवश किया।
- source_word: חֹשֶׁךְ
  choice: अँधेरे
  rationale: यह सामान्य और स्पष्ट हिन्दी शब्द मूल संज्ञा ‘अंधकार’ का अर्थ स्वाभाविक काव्यात्मक रूप में देता है।
- source_word: וְלֹא אוֹר
  choice: उजाले में नहीं
  rationale: मूल का वाक्यांश संक्षिप्त और व्यतिरेकी है—‘और प्रकाश नहीं’। हिन्दी में स्थानगत अर्थ स्पष्ट करने के लिए पिछले ‘में’ को समझकर ‘उजाले में नहीं’ कहा गया है, जबकि तीखा विरोध बनाए रखा गया है।
theological_decisions: []
translation_notes:
  register: आधुनिक, गरिमापूर्ण और संक्षिप्त हिन्दी। ‘हाँका’ मूल में संभावित बाध्यकारी भाव को व्यक्त करता है; ‘अँधेरा/उजाला’ का सहज विरोध हिब्रू कविता की तीक्ष्णता बनाए रखता है।
