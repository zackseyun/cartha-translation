    reason: lexical_alternative
lexical_decisions:
- source_word: קוֹלִי
  choice: मेरी आवाज़
  rationale: קוֹל का सामान्य अर्थ ‘आवाज़’ है; प्रार्थना के व्यक्तिगत संबोधन में यह स्वाभाविक और सीधा है।
- source_word: שָׁמָעְתָּ
  choice: तूने ... सुनी
  rationale: यह שׁמע का काल पूर्ण, द्वितीय पुरुष एकवचन पुल्लिंग रूप है; यहाँ भूतकाल की सीधी स्मृति व्यक्त होती है।
- source_word: אַל תַּעְלֵם אָזְנְךָ
  choice: अपना कान न फेरना
  rationale: शाब्दिक बिंब ‘अपना कान न छिपाना’ है। हिन्दी में ‘कान न फेरना’ उसी बिंब और उपेक्षा के भाव को अधिक स्वाभाविक रूप से व्यक्त करता है।
- source_word: לְרַוְחָתִי
  choice: राहत के लिए मेरी पुकार से
  rationale: רַוְחָה राहत, चैन या साँस लेने की जगह को सूचित कर सकता है। मूल वाक्यांश कठिन और दीर्घवृत्तात्मक है; सन्दर्भ में इसे राहत माँगने वाली पुकार के रूप में व्यक्त किया गया है।
- source_word: לְשַׁוְעָתִי
  choice: सहायता के लिए मेरी दुहाई से
  rationale: שַׁוְעָה संकट में सहायता के लिए की गई पुकार है। ‘दुहाई’ उसकी तीव्रता और प्रार्थनापूर्ण स्वर को संक्षेप में व्यक्त करती है।
