  text: ט֤וֹב וְ/יָחִיל֙ וְ/דוּמָ֔ם לִ/תְשׁוּעַ֖ת יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/003/026.yaml
  text: It is good to wait quietly for the salvation of Yahweh[a].
translation:
  language: hi
  text: याहवे के उद्धार की चुपचाप प्रतीक्षा करना अच्छा है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “याहवे के उद्धार की आशा रखना और मौन रहना अच्छा है।” इब्रानी क्रिया में आशापूर्वक प्रतीक्षा करने का भाव हो सकता है, और “चुपचाप” का अनुवाद “मौन रहकर” भी किया जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: טוֹב
  choice: अच्छा है
  rationale: यह विशेषण क्रियारहित उपवाक्य में विधेय के रूप में प्रयुक्त है; ‘अच्छा है’ उसके मूल्यांकनात्मक अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: יָחִיל
  choice: प्रतीक्षा करना
  rationale: יחל में आशा रखते हुए प्रतीक्षा करने का भाव है। यहाँ याहवे के उद्धार के संदर्भ में ‘प्रतीक्षा करना’ सहज है, जबकि आशापूर्ण भाव संदर्भ में निहित रहता है।
- source_word: דוּמָם
  choice: चुपचाप
  rationale: यह क्रियाविशेषण निश्चलता या मौन का बोध कराता है। ‘चुपचाप’ आधुनिक हिन्दी में प्रतीक्षा की रीति को संक्षेप और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: לִתְשׁוּעַת
  choice: उद्धार की
  rationale: תְּשׁוּעָה संकट से छुड़ाए जाने, बचाव या विजय को सूचित कर सकता है। ‘उद्धार’ तत्काल छुटकारे और व्यापक धर्मवैचारिक अनुगूँज—दोनों को खुला रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय ‘याहवे’ के रूप में लिप्यंतरित किया गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा अथवा प्रभु
  rationale: मूल पाठ में व्यक्तिगत वाचा-नाम सीधे आया है। ‘याहवे’ उसे उपाधि से प्रतिस्थापित किए बिना आधुनिक हिन्दी लिपि में प्रस्तुत करता है।
- issue: תְּשׁוּעָה का अर्थ-क्षेत्र
  choice: उद्धार
  alternative: छुटकारा
  rationale: ‘उद्धार’ मूल शब्द के ऐतिहासिक संकट से बचाव और उसके व्यापक धार्मिक अर्थ, दोनों को बनाए रखता है; पद स्वयं इन आयामों को सीमित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। वाक्य-विन्यास हिन्दी की स्वाभाविकता के अनुसार है, जबकि आशापूर्ण प्रतीक्षा और मौन के बीच मूल इब्रानी की अर्थगत गुंजाइश पादटिप्पणी में सुरक्षित रखी गई है।
