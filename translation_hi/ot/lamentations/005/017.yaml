source:
  edition: WLC
  text: עַל זֶ֗ה הָיָ֤ה דָוֶה֙ לִבֵּ֔/נוּ עַל אֵ֖לֶּה חָשְׁכ֥וּ עֵינֵֽי/נוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/005/017.yaml
  text: Because of this our heart has become sick[a]; because of these things our eyes have grown dim.
translation:
  language: hi
  text: इसी कारण हमारा हृदय रोगी हो गया है[a]; इन्हीं बातों के कारण हमारी आँखें धुँधली हो गई हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “इसी कारण हमारा हृदय निर्बल पड़ गया; इन्हीं बातों के कारण हमारी आँखें अँधेरी हो गईं।”
    reason: दָוֶה का अर्थ ‘रोगी’ के साथ ‘निर्बल’ या ‘म्लान’ भी हो सकता है, और חָשְׁכוּ का अधिक शाब्दिक अर्थ ‘अँधेरी हो गईं’ है।
lexical_decisions:
- source_word: עַל זֶה
  choice: इसी कारण
  rationale: עַל के साथ זֶה यहाँ स्थान नहीं, कारण या आधार व्यक्त करता है। ‘इसी कारण’ स्वाभाविक हिन्दी में इस कारणात्मक बल को स्पष्ट रखता है।
- source_word: הָיָה
  choice: हो गया है
  rationale: היה का पूर्ण रूप, विधेय विशेषण דָוֶה के साथ, पूर्व घटनाओं से उत्पन्न और अब भी बनी हुई अवस्था बताता है; हिन्दी का पूर्ण वर्तमान इसे स्वाभाविक ढंग से व्यक्त करता है।
- source_word: דָוֶה
  choice: रोगी
  rationale: דָוֶה में बीमार, निर्बल या म्लान होने का अर्थ हो सकता है। ‘रोगी’ हृदय के साथ शारीरिक रूपक को बनाए रखता है और इसे केवल भावनात्मक दुःख तक सीमित नहीं करता।
- source_word: לִבֵּנוּ
  choice: हमारा हृदय
  rationale: לֵב भीतरी मनुष्य को सूचित कर सकता है, पर ‘हृदय’ मूल काव्यात्मक बिंब को स्पष्ट और गरिमापूर्ण हिन्दी में बनाए रखता है।
- source_word: עַל אֵלֶּה
  choice: इन्हीं बातों के कारण
  rationale: दोहराया गया עַל फिर कारण बताता है। बहुवचन אֵלֶּה को ‘इन्हीं बातों’ से व्यक्त करने पर पिछली विपत्तियों का संकेत और पद की समानांतरता दोनों बने रहते हैं।
- source_word: חָשְׁכוּ
  choice: धुँधली हो गई हैं
  rationale: क्रिया का मूल अर्थ ‘अँधेरी हो गईं’ है। आँखों के संदर्भ में ‘धुँधली हो गई हैं’ शोक या थकावट से दृष्टि मंद पड़ने के बिंब को स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: עֵינֵינוּ
  choice: हमारी आँखें
  rationale: शाब्दिक अनुवाद विलाप के शारीरिक और काव्यात्मक बिंब को सबसे अच्छी तरह बनाए रखता है।
theological_decisions: []
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज काव्यात्मक शैली अपनाई गई है। दोनों अर्ध-पंक्तियों की कारणात्मक समानांतरता और शरीर-आधारित विलाप-बिंब सुरक्षित रखे गए हैं।
