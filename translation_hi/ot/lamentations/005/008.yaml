  text: עֲבָדִים֙ מָ֣שְׁלוּ בָ֔/נוּ פֹּרֵ֖ק אֵ֥ין מִ/יָּדָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/005/008.yaml
  text: Servants rule over us[b][a]; there is no one to rescue us from their hand.
translation:
  language: hi
  text: दास हम पर शासन करते हैं[a]; उनके हाथ से हमें छुड़ानेवाला कोई नहीं है[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “सेवक हम पर शासन करते हैं।” इब्रानी शब्द עֲבָדִים का अर्थ “सेवक” या “दास” हो सकता है; यहाँ विलाप में सामाजिक अपमान की तीव्रता बनाए रखने के लिए “दास” रखा गया है।
    reason: lexical_alternative
  - marker: b
    text: “उनके हाथ से” इब्रानी मुहावरा है, जिसका आशय उनके अधिकार या नियंत्रण से है।
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲבָדִים
  choice: दास
  rationale: עֶבֶד का बहुवचन सेवकों या दासों, दोनों को सूचित कर सकता है। यहाँ सामाजिक उलटफेर और अपमान की तीव्रता बनाए रखने के लिए ‘दास’ चुना गया है।
- source_word: מָשְׁלוּ בָנוּ
  choice: हम पर शासन करते हैं
  rationale: ב के साथ משל किसी पर अधिकारपूर्वक शासन करने का अर्थ देता है। यह अनुवाद आधुनिक और स्वाभाविक हिन्दी में दमनकारी प्रभुत्व को व्यक्त करता है।
- source_word: פֹּרֵק
  choice: छुड़ानेवाला
  rationale: यह कृदन्त संज्ञा के रूप में ‘छुड़ानेवाला’ या ‘उद्धार करनेवाला’ दर्शाता है। उत्पीड़कों के अधिकार से मुक्त किए जाने के प्रसंग में ‘छुड़ानेवाला’ स्पष्ट और असांप्रदायिक है।
- source_word: אֵין
  choice: कोई नहीं है
  rationale: अस्तित्व का निषेध करनेवाले אֵין को संज्ञार्थक कृदन्त के साथ स्वाभाविक हिन्दी में ‘कोई नहीं है’ कहा गया है।
- source_word: מִיָּדָם
  choice: उनके हाथ से
  rationale: יָד यहाँ हाथ की छवि के द्वारा सामर्थ्य या नियंत्रण को सूचित करता है। शाब्दिक बिंब हिन्दी में सुबोध है और मूल की अभिव्यक्ति सुरक्षित रखता है।
