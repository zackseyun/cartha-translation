translation:
  language: hi
  text: 'हमने मिस्र और अश्शूर की ओर हाथ बढ़ाया है,[a]

    ताकि हमें भरपेट रोटी मिल सके।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “हमने मिस्र और अश्शूर को हाथ दिया है।” इसका अर्थ उनके अधीन होना, उनसे गठबंधन करना, या सहायता के लिए उनसे विनती करना हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: מִצְרַיִם
  choice: मिस्र
  rationale: स्थानवाचक नाम का मानक हिन्दी रूप।
- source_word: נָתַנּוּ
  choice: हमने ... फैलाया है
  rationale: काल पूर्ण हो चुकी ऐसी क्रिया को दर्शाता है जिसका प्रभाव वर्तमान दशा में बना हुआ है; हिन्दी का पूर्ण वर्तमान इसे स्वाभाविक ढंग से व्यक्त करता है।
- source_word: יָד
  choice: हाथ
  rationale: मूल ठोस बिंब को बनाए रखा गया है। נתן יד मुहावरे में अधीनता, सहायता की याचना या गठबंधन का भाव हो सकता है; हिन्दी में 'के आगे हाथ फैलाना' रोटी पाने के प्रसंग में याचना और निर्भरता को स्वाभाविक रूप से व्यक्त करता है, जबकि टिप्पणी व्यापक अर्थ-संभावना सुरक्षित रखती है।
- source_word: אַשּׁוּר
  choice: अश्शूर
  rationale: बाइबलीय राज्य के नाम का प्रचलित हिन्दी रूप।
- source_word: לִשְׂבֹּעַ
  choice: भरपेट ... मिल सके
  rationale: שׂבע का अर्थ तृप्त होना या पर्याप्त पाना है; 'भरपेट' रोटी के साथ उद्देश्य-वाक्य को संक्षिप्त और सहज बनाता है।
- source_word: לָחֶם
  choice: रोटी
  rationale: मूल का ठोस संज्ञा-बिंब रखा गया है, यद्यपि प्रसंग में यह भोजन का भी प्रतिनिधित्व कर सकता है।
