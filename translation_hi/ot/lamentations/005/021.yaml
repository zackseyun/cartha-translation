  text: הֲשִׁיבֵ֨/נוּ יְהוָ֤ה אֵלֶ֨י/ךָ֙ ו/נשוב חַדֵּ֥שׁ יָמֵ֖י/נוּ כְּ/קֶֽדֶם׀׃
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/005/021.yaml
  text: Restore us to yourself[a], O Yahweh, that we may return[b]; renew our days as of old.
translation:
  language: hi
  text: हे याहवे, हमें अपनी ओर लौटा दे, ताकि हम लौट आएँ[a]; पहले की तरह हमारे दिनों को फिर से नया कर दे[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “और हम लौट आएँगे।”
    reason: इब्रानी וְנָשׁוּב को उद्देश्य/परिणाम के बजाय समान स्तर पर जुड़ी भविष्यसूचक बात के रूप में भी समझा जा सकता है।
  - marker: b
    text: या, “पुराने समय के समान हमारे दिनों को फिर से नया कर दे।”
    reason: כְּקֶדֶם का अर्थ ‘पहले के समान’ अथवा ‘पुराने समय की तरह’ हो सकता है।
lexical_decisions:
- source_word: הֲשִׁיבֵנוּ
  choice: हमें अपनी ओर लौटा ले
  rationale: שׁוב का हिफ़ील आज्ञार्थक रूप 1 बहुवचन प्रत्यय के साथ ‘हमें लौटा ले/वापस ले आ’ का भाव देता है। ‘अपनी ओर’ अगले אֵלֶיךָ को स्वाभाविक हिन्दी में समेटता है और परमेश्वर की ओर संबंधात्मक वापसी को बनाए रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: चार अक्षरों वाले परमेश्वर के व्यक्तिगत नाम का हिन्दी लिप्यंतरण किया गया है; उसके स्थान पर कोई उपाधि नहीं रखी गई।
- source_word: אֵלֶיךָ
  choice: अपनी ओर
  rationale: शाब्दिक अर्थ ‘तेरी ओर’ है। आज्ञा ‘हमें लौटा ले’ के साथ आधुनिक हिन्दी में ‘अपनी ओर’ अधिक स्वाभाविक है और दिशा स्पष्ट रखता है।
- source_word: וְנָשׁוּב
  choice: ताकि हम लौट आएँ
  rationale: आज्ञार्थक क्रिया के बाद वाव सहित अपूर्ण क्रिया को परिणाम अथवा उद्देश्य के रूप में समझा जा सकता है। यह अनुवाद उसी संभावित आश्रित संबंध को व्यक्त करता है; समानांतर अर्थ ‘और हम लौट आएँगे’ पादटिप्पणी में रखा गया है।
- source_word: חַדֵּשׁ
  choice: नया कर दे
  rationale: חדש का पिएल आज्ञार्थक रूप ‘नया करना/नवीकृत करना’ है। ‘हमारे दिनों को नया कर दे’ साधारण हिन्दी में स्पष्ट और काव्यात्मक दोनों है।
- source_word: יָמֵינוּ
  choice: हमारे दिनों
  rationale: मूल का ठोस बहुवचन ‘हमारे दिन’ सुरक्षित रखा गया है; इसे व्याख्यात्मक रूप से ‘हमारा जीवन’ नहीं बनाया गया।
- source_word: כְּקֶדֶם
  choice: पहले जैसा
  rationale: इसका अर्थ ‘पहले के समान/पुराने समय की तरह’ है। ‘पहले जैसा’ वर्तमान हिन्दी में सहज और संक्षिप्त है।
theological_decisions:
- issue: וְנָשׁוּב में परमेश्वर के कार्य और मनुष्यों की वापसी का संबंध
  choice: आश्रित उद्देश्य/परिणाम के रूप में ‘ताकि हम लौट आएँ’
  alternative: ‘और हम लौट आएँगे’
  rationale: इब्रानी वाक्यरचना दोनों अर्थों की अनुमति देती है। मुख्य पाठ परमेश्वर से की गई प्रार्थना के बाद आने वाले परिणाम/उद्देश्य को व्यक्त करता है, जबकि पादटिप्पणी सरल समन्वयी अर्थ को सुरक्षित रखती है; इस प्रकार किसी व्यापक मत-सिद्धांत को पाठ पर आरोपित नहीं किया गया।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की है, पर विलाप की प्रार्थनापूर्ण गरिमा बनाए रखी गई है। ‘याहवे’ व्यक्तिगत दिव्य नाम के रूप में रखा गया है। अर्धविराम दोनों समानांतर विनतियों को जोड़ते हुए उनका भेद स्पष्ट करता है।
