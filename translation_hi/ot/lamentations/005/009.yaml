lexical_decisions:
- source_word: בְּנַפְשֵׁנוּ
  choice: अपनी जान जोखिम में डालकर
  rationale: यह इब्रानी मुहावरा साधन नहीं, बल्कि प्राणघातक जोखिम व्यक्त करता है; यह हिन्दी में स्वाभाविक और गंभीर है।
- source_word: נָבִיא
  choice: लाते हैं
  rationale: בוא के हिफ़ील रूप का मूल अर्थ ‘लाना’ है। प्रसंग में इसका आशय रोटी जुटाकर लाने से है; पादटिप्पणी में ‘प्राप्त करते हैं’ की व्यापक सम्भावना दी गई है।
- source_word: לַחְמֵנוּ
  choice: अपनी रोटी
  rationale: ‘रोटी’ मूल शब्द की ठोस छवि बनाए रखती है और यहाँ मूलभूत भोजन का भी संकेत देती है।
- source_word: מִפְּנֵי
  choice: क्योंकि ... खतरा है
  rationale: यह संबंध कारण को व्यक्त करता है। हिन्दी में इस वाक्य-विन्यास से हिंसक संकट का आशय स्पष्ट और स्वाभाविक बनता है।
- source_word: חֶרֶב
  choice: तलवार का खतरा
  rationale: शाब्दिक ‘तलवार’ को बनाए रखते हुए प्रसंग में निहित प्राणघातक खतरे को स्पष्ट किया गया है।
- source_word: הַמִּדְבָּר
  choice: जंगल
  rationale: यहाँ מִדְבָּר निर्जन, असुरक्षित वन्य प्रदेश को सूचित करता है। आधुनिक हिन्दी में ‘जंगल’ इस संदर्भ में अधिक सहज है; ‘निर्जन प्रदेश’ वैकल्पिक अर्थ है।
