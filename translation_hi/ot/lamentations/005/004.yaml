  text: מֵימֵ֨י/נוּ֙ בְּ/כֶ֣סֶף שָׁתִ֔ינוּ עֵצֵ֖י/נוּ בִּ/מְחִ֥יר יָבֹֽאוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/005/004.yaml
  text: We drink our water for silver[b][a]; our wood comes at a price.
translation:
  language: hi
  text: हम अपना पानी चाँदी देकर पीते हैं[a]; हमारी लकड़ी दाम देकर मिलती है[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “हम अपना पानी पैसे देकर पीते हैं।” हिब्रू में शाब्दिक रूप से “चाँदी देकर/चाँदी से” है; यहाँ चाँदी भुगतान का माध्यम है।
    reason: lexical_alternative
  - marker: b
    text: या, “हमारी लकड़ियाँ दाम देकर आती हैं।” हिब्रू क्रिया बहुवचन है—“वे आती हैं”—लेकिन हिन्दी में सामूहिक अर्थ वाली “लकड़ी” के साथ एकवचन अधिक स्वाभाविक है।
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵימֵינוּ
  choice: अपना पानी
  rationale: हिब्रू में शाब्दिक रूप से ‘हमारे पानी’ है। हिन्दी में कर्ता ‘हम’ के साथ ‘अपना पानी’ स्वाभाविक है और इस विडंबना को बनाए रखता है कि लोगों को अपने ही पानी के लिए भुगतान करना पड़ता है।
- source_word: בְּכֶסֶף
  choice: चाँदी देकर
  rationale: בְּ यहाँ भुगतान के माध्यम या मूल्य को दर्शाता है और כֶּסֶף का ठोस अर्थ ‘चाँदी’ है। ‘चाँदी देकर’ आर्थिक भाषा को सुरक्षित रखते हुए आधुनिक हिन्दी में अर्थ स्पष्ट करता है।
- source_word: שָׁתִינוּ
  choice: पीते हैं
  rationale: पूर्ण क्रिया-रूप को विलाप में जारी वर्तमान दशा के रूप में समझना उचित है; वर्तमान काल शिकायत की तात्कालिकता बनाए रखता है।
- source_word: עֵצֵינוּ
  choice: हमारी लकड़ी
  rationale: मूल शब्द व्यापक रूप से ‘लकड़ी’ कहता है। ‘जलावन’ संदर्भानुकूल हो सकता है, पर वह अर्थ को अनावश्यक रूप से सीमित करेगा।
- source_word: בִּמְחִיר
  choice: दाम देकर
  rationale: यह अभिव्यक्ति भुगतान करके वस्तु पाने का भाव देती है। ‘दाम देकर’ सरल, स्वाभाविक और अभाव की शिकायत के अनुरूप है।
- source_word: יָבֹאוּ
  choice: मिलती है
  rationale: हिब्रू में बहुवचन क्रिया ‘वे आती हैं’ है, जिसका विषय बहुवचन रूप में ‘लकड़ियाँ’ है। हिन्दी में सामूहिक संज्ञा ‘लकड़ी’ के साथ ‘मिलती है’ यह भाव स्वाभाविक रूप से व्यक्त करता है कि लकड़ी केवल भुगतान पर उपलब्ध होती है।
