lexical_decisions:
- source_word: נָשִׁים
  choice: स्त्रियों
  rationale: समानांतर पद में ‘कुँवारियों’ के उल्लेख के कारण यहाँ सामान्य रूप से स्त्री पीड़ितों का संकेत है, न कि केवल पत्नियों का।
- source_word: בְּצִיּוֹן
  choice: सिय्योन में
  rationale: पूर्वसर्ग בְּ स्थान सूचित करता है; ‘सिय्योन में’ स्वाभाविक और सटीक है।
- source_word: עִנּוּ
  choice: यौन-अपमान किया गया
  rationale: पिएल रूप में क्रिया अपमानित करने या पीड़ा देने का व्यापक अर्थ रख सकती है, किंतु स्त्रियों और कुँवारियों के इस संदर्भ में यौन हिंसा की प्रबल संभावना है। यह चयन संदर्भ स्पष्ट करता है, पर क्रिया को केवल एक अत्यंत विशिष्ट कानूनी अर्थ तक सीमित नहीं करता।
- source_word: בְּתֻלֹת
  choice: कुँवारियों
  rationale: यह संज्ञा कुँवारी युवतियों को दर्शाती है और इब्रानी में उभारी गई उनकी सामाजिक तथा यौन स्थिति को बनाए रखती है।
- source_word: בְּעָרֵי יְהוּדָה
  choice: यहूदा के नगरों में
  rationale: यह रचना का सीधा अर्थ है और ‘सिय्योन में’ के साथ भौगोलिक समानांतरता बनाए रखता है।
theological_decisions:
- issue: עִנּוּ में यौन हिंसा का आशय कितना स्पष्ट किया जाए
  choice: मुख्य पाठ में ‘यौन-अपमान किया गया’ और पाद-टिप्पणी में ‘बलात्कार किया गया’ विकल्प
  alternative: केवल ‘अपमानित किया गया’ या सीधे ‘बलात्कार किया गया’
  rationale: संदर्भ यौन हिंसा की ओर प्रबल संकेत करता है, जबकि इब्रानी क्रिया स्वयं व्यापक अर्थ भी रख सकती है। चुना गया रूप संदर्भ और वास्तविक शाब्दिक अस्पष्टता दोनों को सुरक्षित रखता है।
