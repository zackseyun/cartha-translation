lexical_decisions:
- source_word: נַחֲלָתֵנוּ
  choice: हमारी विरासत
  rationale: נַחֲלָה विरासत, पैतृक संपत्ति या बाँटे गए भू-भाग को सूचित कर सकता है। ‘विरासत’ भूमि और वाचा से जुड़े भाव को बनाए रखते हुए सामान्य आधुनिक हिन्दी में स्वाभाविक है।
- source_word: נֶהֶפְכָה
  choice: के हाथ कर दी गई है
  rationale: הפך के निफ़ाल रूप का मूल भाव ‘पलट दिया जाना/बदल जाना’ है; संपत्ति के संदर्भ में यह अधिकार दूसरे लोगों को चले जाने का परिणाम व्यक्त करता है। यह अनुवाद उस निहित हस्तांतरण को स्वाभाविक हिन्दी में सामने लाता है, जबकि पादटिप्पणी अधिक शाब्दिक विकल्प सुरक्षित रखती है।
- source_word: לְזָרִים
  choice: परायों के हाथ
  rationale: זָרִים अपने समुदाय या संबंधियों से बाहर के लोगों को दर्शाता है। ‘पराये’ गैर-अपनत्व का भाव रखता है और अगले पदांश के ‘विदेशियों’ से शब्दगत भेद भी बनाए रखता है। ‘के हाथ’ possession के हस्तांतरण को स्वाभाविक बनाता है।
- source_word: בָּתֵּינוּ
  choice: हमारे घर
  rationale: בַּיִת का यहाँ सीधा अर्थ निवास-स्थान है। ‘घर’ आधुनिक हिन्दी में ‘मकान’ से अधिक स्वाभाविक है और भौतिक निवास तथा उससे जुड़े अपनेपन—दोनों को व्यक्त कर सकता है।
- source_word: לְנָכְרִים
  choice: विदेशियों के हाथ
  rationale: נָכְרִים बाहरी अथवा विदेशी लोगों पर बल देता है। ‘विदेशी’ पहले पदांश के זָרִים (‘पराये’) से भेद रखते हुए इब्रानी समानांतरता को दर्शाता है।
