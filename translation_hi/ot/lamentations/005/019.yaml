base_translation:
  language: en
  yaml_path: translation/ot/lamentations/005/019.yaml
  text: But you[a], O Yahweh, sit enthroned forever; your throne is from generation to generation.
translation:
  language: hi
  text: 'परन्तु आप, हे याहवे, सदा सिंहासन पर विराजमान[a] हैं;

    आपका सिंहासन पीढ़ी-दर-पीढ़ी कायम है।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “सदा बने रहते हैं”; इब्रानी क्रिया का शाब्दिक अर्थ “बैठना” है, पर इस प्रसंग में सिंहासन पर राजकीय रूप से विराजमान होने का भाव है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אַתָּה
  choice: परन्तु आप
  rationale: स्वतंत्र सर्वनाम पद के आरम्भ में आकर विशेष बल और पिछले विलाप के साथ विरोध दर्शाता है; हिन्दी में ‘परन्तु आप’ इस बल को स्वाभाविक रूप से व्यक्त करता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय निज नाम का हिन्दी लिप्यंतरण किया गया है, उसे किसी उपाधि से नहीं बदला गया।
- source_word: לְעוֹלָם
  choice: सदा
  rationale: यहाँ शब्द परमेश्वर के अनन्त और अटूट शासन को व्यक्त करता है; ‘सदा’ संक्षिप्त, स्वाभाविक और काव्यात्मक है।
- source_word: תֵּשֵׁב
  choice: सिंहासन पर विराजमान हैं
  rationale: क्रिया का मूल अर्थ ‘बैठना’ है, पर समानान्तर पंक्ति में ‘सिंहासन’ होने के कारण यहाँ राजकीय आसन और शासन का भाव प्रमुख है।
- source_word: כִּסְאֲךָ
  choice: आपका सिंहासन
  rationale: כִּסֵּא का सामान्य अर्थ ‘सिंहासन’ है और प्रत्यय द्वितीय पुरुष एकवचन का है।
- source_word: לְדֹר וָדֹר
  choice: पीढ़ी से पीढ़ी तक
  rationale: यह इब्रानी मुहावरा लगातार आने वाली सभी पीढ़ियों में निरन्तरता व्यक्त करता है; हिन्दी में यह उसका निकट और प्रचलित समतुल्य है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: प्रभु / यहोवा
  rationale: मूल पाठ में निज नाम सीधे आया है; ‘याहवे’ उस नाम को उपाधि से बदलने के बजाय हिन्दी में लिप्यंतरित करता है।
- issue: יָשַׁב के राजकीय भाव को स्पष्ट करना
  choice: सिंहासन पर विराजमान हैं
  alternative: बैठे हैं / बने रहते हैं
  rationale: अगली पंक्ति का ‘आपका सिंहासन’ राजकीय संदर्भ स्पष्ट करता है। फिर भी शाब्दिक अर्थ और वैकल्पिक अर्थ को पादटिप्पणी में सुरक्षित रखा गया है।
- issue: दूसरी पंक्ति में निहित क्रिया
  choice: आपका सिंहासन पीढ़ी से पीढ़ी तक है
  alternative: आपका सिंहासन पीढ़ी से पीढ़ी तक बना रहता है
  rationale: इब्रानी दूसरी पंक्ति में ‘बना रहता है’ जैसी अलग क्रिया नहीं देता। हिन्दी की व्याकरणिक आवश्यकता के लिए केवल ‘है’ जोड़ा गया है, ताकि मूल की संक्षिप्तता और अर्थगत खुलापन बना रहे।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की है, पर विलाप-काव्य के अनुकूल गरिमामय रखी गई है। आदरसूचक ‘आप’ ईश्वर को सीधे सम्बोधित करने के लिए स्वाभाविक है। दूसरी पंक्ति को जानबूझकर संक्षिप्त रखा गया है और मूल में अनुपस्थित ‘बना रहता है’ को मुख्य पाठ में नहीं जोड़ा गया।
