  text: because Mount Zion lies desolate[a]; foxes walk on it.
translation:
  language: hi
  text: क्योंकि सिय्योन पर्वत उजाड़ पड़ा है[a]; उस पर लोमड़ियाँ घूमती हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘गीदड़’; इब्रानी शब्द कुछ प्रसंगों में व्यापक अर्थ में जंगली कुत्ते की जाति के पशुओं को सूचित कर सकता है, हालाँकि यहाँ ‘लोमड़ियाँ’ सामान्य अनुवाद है।
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל
  choice: क्योंकि
  rationale: यहाँ עַל पिछले विलाप का कारण बताता है; इसलिए प्रसंग में कारणसूचक ‘क्योंकि’ स्वाभाविक और सटीक है।
- source_word: הַר צִיּוֹן
  choice: सिय्योन पर्वत
  rationale: यह इब्रानी पदबंध का संक्षिप्त और हिन्दी में प्रचलित रूप है तथा स्थान-नाम को सुरक्षित रखता है।
- source_word: שֶׁשָּׁמֵם
  choice: उजाड़ पड़ा है
  rationale: यह अभिव्यक्ति सिय्योन की बनी हुई वीरान अवस्था और विलाप के भाव, दोनों को स्वाभाविक हिन्दी में व्यक्त करती है।
- source_word: שׁוּעָלִים
  choice: लोमड़ियाँ
  rationale: शब्द का सामान्य और सीधा अर्थ ‘लोमड़ियाँ’ है; यद्यपि कुछ प्रसंगों में इससे गीदड़ जैसे जंगली कुत्ते भी अभिप्रेत हो सकते हैं।
- source_word: הִלְּכוּ
  choice: घूमती हैं
  rationale: मूल क्रिया सामान्य रूप से चलने-फिरने को बताती है। निर्जन स्थान पर पशुओं की आवाजाही के लिए ‘घूमती हैं’ सहज है और ‘मँडराती’ जैसे अतिरिक्त भाव नहीं जोड़ता।
- source_word: בוֹ
  choice: उस पर
  rationale: पूर्वपद सिय्योन पर्वत है, इसलिए सतह पर होने वाली गति के लिए ‘उस पर’ हिन्दी में स्वाभाविक है।
