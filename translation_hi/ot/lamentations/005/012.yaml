  text: שָׂרִים֙ בְּ/יָדָ֣/ם נִתְל֔וּ פְּנֵ֥י זְקֵנִ֖ים לֹ֥א נֶהְדָּֽרוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/005/012.yaml
  text: Princes were hung up by their hands[b][a]; the faces of elders were not honored.
translation:
  language: hi
  text: शासकों को उनके हाथों से लटकाया गया[a]; बुज़ुर्गों का आदर नहीं किया गया[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में, “उनके हाथों से।” यह संभवतः उस अंग को बताता है जिससे उन्हें लटकाया गया; व्याकरणतः “उनके हाथों द्वारा” भी संभव है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “बुज़ुर्गों के चेहरों को सम्मान नहीं दिया गया”; यह इब्रानी अभिव्यक्ति बुज़ुर्गों को उनका उचित आदर न देने का भाव रखती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׂרִים
  choice: शासकों
  rationale: यह शब्द राजकीय या सामाजिक अधिकार रखने वाले प्रधानों, अधिकारियों या शासकों को सूचित कर सकता है। ‘शासकों’ से पद और सार्वजनिक प्रतिष्ठा का भाव बना रहता है, जबकि अर्थ को केवल वंशानुगत राजकुमारों तक सीमित नहीं किया जाता।
- source_word: בְּיָדָם
  choice: उनके हाथों से
  rationale: בְּ के साथ ‘हाथ’ और बहुवचन प्रत्यय का सीधा अर्थ ‘उनके हाथों से’ है। निकटतम संदर्भ में यह उस अंग को बताता है जिससे शासकों को लटकाया गया, हालांकि व्याकरणतः कर्तृत्व का अर्थ भी संभव है; इस अस्पष्टता को पादटिप्पणी में रखा गया है।
- source_word: נִתְלוּ
  choice: लटकाया गया
  rationale: תלה के निफ़अल बहुवचन का अर्थ ‘लटकाए गए’ या ‘टाँगे गए’ है। हिन्दी में ‘लटकाया गया’ हिंसक निलंबन को स्वाभाविक ढंग से व्यक्त करता है, पर यह अनावश्यक रूप से यह तय नहीं करता कि मृत्यु फाँसी से हुई थी।
- source_word: פְּנֵי זְקֵנִים
  choice: पुरनियों का
  rationale: शाब्दिक रूप ‘पुरनियों के चेहरे’ है, पर यहाँ ‘चेहरा’ व्यक्ति की प्रतिष्ठा और उसके प्रति दिखाए जाने वाले सम्मान का सामी मुहावरा है। मुख्य पाठ में स्वाभाविक हिन्दी रखी गई है और ठोस शाब्दिक रूप पादटिप्पणी में बताया गया है।
- source_word: לֹא נֶהְדָּרוּ
  choice: आदर नहीं किया गया
  rationale: הדר के निफ़अल रूप में सम्मान, गरिमा या प्रतिष्ठा न दिए जाने का भाव है। ‘आदर नहीं किया गया’ हिन्दी में संक्षिप्त, स्वाभाविक और निष्क्रिय रूप के निकट है।
theological_decisions: []
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘शासकों’ से שָׂרִים का व्यापक पदगत अर्थ बचता है; ‘पुरनियों’ से सामुदायिक रूप से सम्मानित वृद्ध जनों का पारंपरिक बाइबिलीय भाव व्यक्त होता है। दोनों पादटिप्पणी-चिह्न मुख्य पाठ में संबद्ध वाक्यांशों के तुरंत बाद दिए गए हैं।
