  text: עוֹרֵ֨/נוּ֙ כְּ/תַנּ֣וּר נִכְמָ֔רוּ מִ/פְּנֵ֖י זַלְעֲפ֥וֹת רָעָֽב׃
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/005/010.yaml
  text: Our skin is as hot as an oven because of the burning heat of famine[a].
translation:
  language: hi
  text: अकाल की झुलसा देनेवाली तपिश के कारण हमारी त्वचा तंदूर के समान तप गई है[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अकाल की झुलसा देनेवाली तपिश से हमारी त्वचा तंदूर के समान झुलस गई है।” ‘तप गई’ और ‘झुलसा देनेवाली तपिश’ के लिए आए इब्रानी शब्द दुर्लभ हैं; वे ज्वर के बजाय झुलसानेवाली गर्मी पर बल दे सकते हैं।
    reason: दुर्लभ इब्रानी क्रिया और संज्ञा के कारण ‘तपने’ तथा ‘झुलसने’ के बीच की वास्तविक शाब्दिक अनिश्चितता को सुरक्षित रखना।
lexical_decisions:
- source_word: עוֹרֵנוּ
  choice: हमारी त्वचा
  rationale: עוֹר मानव शरीर के संदर्भ में ‘त्वचा’ है; यह आधुनिक हिन्दी में स्वाभाविक और गरिमापूर्ण है।
- source_word: כְתַנּוּר
  choice: तंदूर के समान
  rationale: तुलनासूचक כְּ को ‘के समान’ से व्यक्त किया गया है। תַּנּוּר के लिए ‘तंदूर’ स्रोत के गरम मिट्टी के भट्ठीनुमा चूल्हे की छवि को सीधे बनाए रखता है।
- source_word: נִכְמָרוּ
  choice: तप गई है
  rationale: दुर्लभ क्रिया כמר का निफ़अल रूप यहाँ त्वचा के तीव्र रूप से गरम या झुलस जाने की दशा बताता है। ‘तप गई है’ गर्मी पर बल देता है, पर झुलसने की संभावित छाया को पादटिप्पणी के लिए खुला रखता है।
- source_word: מִפְּנֵי
  choice: के कारण
  rationale: यहाँ पदबंध स्थान नहीं, कारण व्यक्त करता है।
- source_word: זַלְעֲפוֹת
  choice: झुलसा देनेवाली तपिश
  rationale: दुर्लभ बहुवचन संज्ञा तीव्र जलानेवाली गर्मी, ताप या संभवतः ज्वर-सदृश दाह का संकेत देती है। ‘झुलसा देनेवाली तपिश’ विशिष्ट रूप से ‘ज्वर’ जोड़ने से बचते हुए उसकी तीव्रता बनाए रखती है।
- source_word: רָעָב
  choice: अकाल
  rationale: רָעָב भूख या अकाल दोनों को सूचित कर सकता है; विलापगीत के सामूहिक संकट के संदर्भ में ‘अकाल’ व्यापक विपत्ति को व्यक्त करता है।
