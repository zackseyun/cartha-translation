  text: יְתוֹמִ֤ים הָיִ֨ינוּ֙ אין אָ֔ב אִמֹּתֵ֖י/נוּ כְּ/אַלְמָנֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/005/003.yaml
  text: We have become orphans[a], without a father; our mothers are like widows.
translation:
  language: hi
  text: हम अनाथ[a] हो गए हैं, हमारा कोई पिता नहीं; हमारी माताएँ विधवाओं के समान हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘पितृहीन।’
    reason: יְתוֹמִים के अधिक शाब्दिक विकल्प को दर्ज करना, जो विशेष रूप से पिता और उसके संरक्षण से वंचित होने पर बल देता है।
lexical_decisions:
- source_word: יְתוֹמִים
  choice: अनाथ
  rationale: यह शब्द माता-पिता में से किसी से वंचित बच्चों को दर्शा सकता है, पर इब्रानी प्रयोग में प्रायः पिता और उसके संरक्षण से वंचित होने पर बल देता है। ‘अनाथ’ सहज आधुनिक हिन्दी है; ‘पितृहीन’ अधिक शाब्दिक विकल्प है।
- source_word: הָיִינוּ
  choice: हो गए हैं
  rationale: היה के पूर्ण रूप को केवल ‘थे’ कहा जा सकता है, पर विलाप के प्रसंग में विपत्ति के कारण उत्पन्न वर्तमान दशा का भाव है; ‘हो गए हैं’ उस परिवर्तन और परिणामी स्थिति को व्यक्त करता है।
- source_word: אֵין אָב
  choice: हमारा कोई पिता नहीं
  rationale: अस्तित्ववाचक निषेध का शाब्दिक भाव ‘पिता नहीं है’ है। ‘हमारा कोई पिता नहीं’ स्वाभाविक हिन्दी में उसी अभाव और पितृ-संरक्षण की हानि को स्पष्ट रखता है।
- source_word: אִמֹּתֵינוּ
  choice: हमारी माताएँ
  rationale: यह स्त्रीलिंग बहुवचन संज्ञा के साथ प्रथम पुरुष बहुवचन संबंधसूचक प्रत्यय का सीधा अनुवाद है।
- source_word: כְּאַלְמָנוֹת
  choice: विधवाओं के समान
  rationale: उपसर्ग כְּ तुलना सूचित करता है। ‘विधवाओं के समान’ इस उपमा को बनाए रखता है और सभी पतियों की वास्तविक मृत्यु का दावा नहीं करता।
theological_decisions:
- issue: ‘हमारी माताएँ विधवाओं के समान हैं’ में तुलना का बल
  choice: तुलनात्मक अर्थ बनाए रखने के लिए ‘विधवाओं के समान’
  alternative: हमारी माताएँ विधवाएँ हैं
  rationale: इब्रानी में स्पष्ट तुलनासूचक उपसर्ग כְּ है। उपमा को बनाए रखने से सामाजिक असहायता और परित्यक्त दशा की तीव्रता व्यक्त होती है, बिना मूल पाठ से अधिक कठोर ऐतिहासिक दावा किए।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। अर्धविराम पद की समानांतर दो दशाओं को जोड़ता है। ‘विधवाओं के समान’ मूल की वास्तविक उपमा को सुरक्षित रखता है।
