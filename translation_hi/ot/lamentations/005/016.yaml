lexical_decisions:
- source_word: נָפְלָה
  choice: गिर गया है
  rationale: यह נפל का काल रूप पूर्ण हुई घटना को व्यक्त करता है; हिन्दी का पूर्ण वर्तमान उस हानि के वर्तमान प्रभाव और विलाप की सजीवता को बनाए रखता है।
- source_word: עֲטֶרֶת רֹאשֵׁנוּ
  choice: हमारे सिर का मुकुट
  rationale: इब्रानी की संबंधवाचक काव्यात्मक रचना, शाब्दिक रूप से ‘हमारे सिर का मुकुट’, और सामूहिक एकवचन ‘सिर’ दोनों सुरक्षित रखे गए हैं।
- source_word: אוֹי נָא לָנוּ
  choice: हम पर हाय!
  rationale: אוֹי विलाप की पुकार है और נָא यहाँ उसे तीव्र करता है। ‘हम पर हाय!’ स्वाभाविक, संक्षिप्त और गंभीर हिन्दी अभिव्यक्ति है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यह विलाप का कारण प्रस्तुत करता है और मुकुट के गिरने तथा सामूहिक पाप-स्वीकार के बीच कारणात्मक संबंध बनाए रखता है।
- source_word: חָטָאנוּ
  choice: हमने पाप किया है
  rationale: חטא का प्रथम पुरुष बहुवचन सिद्ध रूप सामूहिक दोष-स्वीकार है; ‘पाप किया है’ इसका स्पष्ट और प्रचलित हिन्दी अनुवाद है।
theological_decisions:
- issue: सामूहिक पाप-स्वीकार और उत्तरदायित्व
  choice: ‘क्योंकि हमने पाप किया है’ के रूप में समुदाय का स्पष्ट दोष-स्वीकार
  alternative: इसे केवल दुःख की परिस्थिति बताने वाला विलाप समझना
  rationale: इब्रानी पाठ स्वयं समुदाय के पाप को ‘हाय’ का कारण बताता है। अनुवाद इस संबंध को बनाए रखता है, पर पद से आगे जाकर न्याय या दोष का विस्तार नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, काव्यात्मक और गरिमापूर्ण शैली अपनाई गई है। सामूहिक एकवचन ‘हमारे सिर’ को इब्रानी बिंब बनाए रखने के लिए रखा गया है। मुख्य पाठ में केवल वही पाद-टिप्पणी दी गई है जो हिन्दी में विलापसूचक अभिव्यक्ति का उपयोगी विकल्प बताती है।
