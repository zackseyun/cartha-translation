  yaml_path: translation/ot/lamentations/005/015.yaml
  text: The joy of our heart has ceased[a]; our dancing has turned to mourning.
translation:
  language: hi
  text: 'हमारे हृदय का आनंद समाप्त हो गया है;

    हमारा नृत्य शोक में बदल गया है।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שָׁבַת
  choice: समाप्त हो गया है
  rationale: यह क्रिया किसी अवस्था या गतिविधि के रुक जाने को दर्शाती है। यहाँ यह हृदय के आनंद के अंत को स्वाभाविक और स्पष्ट हिन्दी में व्यक्त करती है।
- source_word: מְשׂוֹשׂ
  choice: आनंद
  rationale: यह संज्ञा हर्ष और उल्लास को व्यक्त करती है। विलाप के प्रसंग में ‘आनंद’ सहज और गरिमापूर्ण है।
- source_word: לִבֵּנוּ
  choice: हमारे हृदय का
  rationale: इब्रानी में ‘हृदय’ एकवचन सामूहिक रूप में है। एकवचन बनाए रखने से मूल काव्यात्मक बिंब सुरक्षित रहता है।
- source_word: נֶהְפַּךְ
  choice: बदल गया है
  rationale: निफ़अल पूर्ण रूप यहाँ एक अवस्था से दूसरी अवस्था में हुए परिवर्तन को दर्शाता है। यह हिन्दी में स्वाभाविक ढंग से परिणाम की वर्तमान स्थिति भी प्रकट करता है।
- source_word: לְאֵבֶל
  choice: शोक में
  rationale: यह शब्द व्यक्तिगत अथवा सामुदायिक मातम और विलाप को दर्शाता है। ‘शोक में’ यहाँ नृत्य के विपरीत भाव को स्पष्ट रखता है।
- source_word: מְחֹלֵנוּ
  choice: हमारा नृत्य
  rationale: यह उत्सवपूर्ण नाच या नृत्य को दर्शाता है। ‘नृत्य’ काव्यात्मक गरिमा बनाए रखते हुए आधुनिक पाठक के लिए स्पष्ट है।
