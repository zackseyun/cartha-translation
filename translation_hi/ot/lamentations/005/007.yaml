base_translation:
  language: en
  yaml_path: translation/ot/lamentations/005/007.yaml
  text: Our fathers sinned[a], and they are no more; but we bear their iniquities.
translation:
  language: hi
  text: हमारे पुरखों ने पाप किया, और वे अब नहीं रहे; पर उनके अधर्मों का भार हम उठा रहे हैं।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘हम उनके अधर्मों का दण्ड/परिणाम भोग रहे हैं।’ इब्रानी शब्द का अर्थ स्वयं अधर्म, उससे उत्पन्न दोष, या उससे उत्पन्न बोझ हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲבֹתֵינוּ
  choice: हमारे पुरखों
  rationale: אָבוֹת का अर्थ ‘पिता’ और विस्तार से ‘पूर्वज’ हो सकता है। ‘पुरखों’ में पारिवारिक तथा पीढ़ीगत भाव बना रहता है और यह आधुनिक हिन्दी में स्वाभाविक है।
- source_word: חָטְאוּ
  choice: पाप किया
  rationale: חטא का काल-रूप यहाँ बीते हुए पाप-कर्म का सीधा कथन करता है; ‘पाप किया’ इसे स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: אֵינָם
  choice: वे अब नहीं रहे
  rationale: शाब्दिक अर्थ ‘वे नहीं हैं’ है, पर प्रसंग में यह उनके जीवित या उपस्थित न रहने का मुहावरेदार संकेत है।
- source_word: אֲנַחְנוּ
  choice: हम
  rationale: स्वतंत्र सर्वनाम पीढ़ियों के बीच विरोध को उभारता है; हिन्दी में ‘पर ... हम’ उस बल को बनाए रखता है।
- source_word: עֲוֺנֹתֵיהֶם
  choice: उनके अधर्मों का भार
  rationale: עָוֹן अधर्म, दोष अथवा उसके फलस्वरूप दण्ड और बोझ का अर्थ दे सकता है। ‘अधर्मों का भार’ मूल संज्ञा और ‘उठाने’ के रूपक दोनों को बनाए रखता है, बिना अर्थ को केवल दण्ड या परिणाम तक सीमित किए।
- source_word: סָבָלְנוּ
  choice: उठा रहे हैं
  rationale: סבל का अर्थ बोझ उठाना, ढोना या सहना है। ‘भार ... उठा रहे हैं’ मूल रूपक और वर्तमान में अनुभव किए जा रहे बोझ को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: क्या पद पूर्वजों के दोष के सीधे उत्तराधिकार की बात करता है या उनके पापों के परिणामों को सहने की
  choice: ‘उनके अधर्मों का भार हम उठा रहे हैं’
  alternative: ‘हम उनके अधर्मों का दण्ड/परिणाम भोग रहे हैं’
  rationale: עָוֹן में अधर्म, दोष और उसके परिणाम—ये सभी अर्थ समाए हो सकते हैं। मुख्य पाठ इस तनाव को खुला रखता है और किसी एक धर्मवैज्ञानिक निष्कर्ष को अनिवार्य नहीं बनाता।
translation_notes:
  register: भाषा आधुनिक, सहज और शोकगीत के अनुरूप गंभीर रखी गई है। ‘पुरखों’ से पीढ़ीगत और पारिवारिक संबंध स्वाभाविक हिन्दी में व्यक्त होता है; ‘अधर्मों का भार उठाना’ मूल के बोझ-वाले रूपक तथा अर्थगत अस्पष्टता को सुरक्षित रखता है।
