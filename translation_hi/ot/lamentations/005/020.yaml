  text: לָ֤/מָּה לָ/נֶ֨צַח֙ תִּשְׁכָּחֵ֔/נוּ תַּֽעַזְבֵ֖/נוּ לְ/אֹ֥רֶךְ יָמִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/005/020.yaml
  text: Why do you forget us forever? Why do you abandon us for so many days?[a]
translation:
  language: hi
  text: आप हमें सदा के लिए क्यों भूल जाते हैं? आप हमें इतने दिनों तक क्यों छोड़ देते हैं?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से, ‘दिनों की लंबाई तक’; अर्थात् ‘लंबे समय तक’ या ‘बहुत दिनों तक।’
    reason: lexical_alternative
lexical_decisions:
- source_word: לָמָּה
  choice: क्यों
  rationale: यह विलापपूर्ण प्रश्न आरम्भ करने वाला सीधा प्रश्नवाचक क्रियाविशेषण है।
- source_word: לָנֶצַח
  choice: सदा के लिए
  rationale: ל prefixed נֶצַח दीर्घ, मानो अंतहीन अवधि व्यक्त करता है; ‘सदा के लिए’ आधुनिक हिन्दी में स्वाभाविक है और विलाप की तीव्रता बनाए रखता है।
- source_word: תִּשְׁכָּחֵנוּ
  choice: आप हमें ... भूल जाते हैं
  rationale: यह שׁכח का काल अपूर्ण, द्वितीय पुरुष पुल्लिंग एकवचन रूप है, जिसमें प्रथम पुरुष बहुवचन कर्म-प्रत्यय जुड़ा है। वर्तमानकालीन हिन्दी यहाँ चलती हुई पीड़ा की शिकायत व्यक्त करती है; भविष्यकालीन अर्थ-संभावना को अनावश्यक रूप से निर्णीत नहीं किया गया।
- source_word: תַּעַזְבֵנוּ
  choice: आप हमें ... त्यागे रहते हैं
  rationale: עזב का अर्थ छोड़ना, त्यागना या परित्यक्त कर देना हो सकता है। ‘त्यागे रहते हैं’ भाव की गंभीरता और जारी अवस्था, दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: לְאֹרֶךְ יָמִים
  choice: इतने दिनों तक
  rationale: शाब्दिक चित्र ‘दिनों की लंबाई तक’ है और आशय एक लंबी अवधि है। ‘इतने दिनों तक’ दिनों की ठोस छवि और शिकायत का भाव बनाए रखता है।
theological_decisions:
- issue: परमेश्वर को सम्बोधित करते समय हिन्दी का आदरसूचक स्तर
  choice: ‘आप’ के आदरसूचक रूप
  alternative: ‘तू’ के निकट या पारंपरिक एकवचन रूप
  rationale: इब्रानी द्वितीय पुरुष पुल्लिंग एकवचन सामाजिक आदर-स्तर निर्धारित नहीं करता। आधुनिक मानक हिन्दी में ‘आप’ परमेश्वर से सीधे, गरिमापूर्ण सम्बोधन को सामान्य पाठक के लिए स्वाभाविक रखता है, बिना मूल में कोई अतिरिक्त धर्मवैज्ञानिक दावा जोड़े।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी अपनाई गई है। दोनों समानांतर प्रश्नों की विलापपूर्ण तीव्रता रखी गई है। ‘सदा के लिए’ और ‘इतने दिनों तक’ के बीच मूल का तनाव भी बना रहता है।
