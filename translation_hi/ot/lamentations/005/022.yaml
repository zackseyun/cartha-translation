base_translation:
  language: en
  yaml_path: translation/ot/lamentations/005/022.yaml
  text: unless you have utterly rejected us and are exceedingly angry with us[a][b].
translation:
  language: hi
  text: यदि ऐसा न हो कि तूने हमें पूरी तरह ठुकरा दिया है और हमसे अत्यन्त क्रोधित हो गया है[a][b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “क्योंकि यदि तूने हमें पूरी तरह ठुकरा दिया है और हमसे अत्यन्त क्रोधित हो गया है।” इस वाचन में यह पंक्ति पिछली आयत की विनती का अपवाद न होकर अधिक स्वतंत्र शर्तसूचक कथन है।
    reason: alternative_reading
  - marker: b
    text: शाब्दिक रूप से, “हम पर क्रोधित हो गया है”; इसका अर्थ “हमारे विरुद्ध क्रोधित” भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי אִם
  choice: यदि ऐसा न हो कि
  rationale: यह अभिव्यक्ति पिछली आयत की विनती के बाद एक संभावित अपवाद प्रस्तुत करती है। आधुनिक हिन्दी में यह रूप उस आशंकित अपवाद को स्वाभाविक ढंग से व्यक्त करता है और पंक्ति की खुली, तनावपूर्ण समाप्ति बनाए रखता है।
- source_word: מָאֹס מְאַסְתָּנוּ
  choice: तूने हमें पूरी तरह ठुकरा दिया है
  rationale: एक ही धातु के क्रियार्थक संज्ञा-रूप और सीमित क्रिया के मेल से तीव्र बल उत्पन्न होता है। ‘पूरी तरह’ उस बल को व्यक्त करता है, और ‘ठुकरा दिया’ इस विलाप के संबंधपरक सन्दर्भ में ‘घृणा की’ की अपेक्षा अधिक उपयुक्त है।
- source_word: קָצַפְתָּ
  choice: क्रोधित हो गया है
  rationale: हिब्रू पूर्ण क्रिया को यहाँ ऐसी अवस्था के रूप में समझा गया है जो उत्पन्न होकर अब भी बनी हुई है। यह हिन्दी रूप घटना और उसके वर्तमान परिणाम दोनों को सहज रूप से व्यक्त करता है।
- source_word: עָלֵינוּ
  choice: हमसे
  rationale: क्रोध के साथ आधुनिक हिन्दी में ‘हमसे क्रोधित’ स्वाभाविक प्रयोग है। मूल उपसर्ग का अधिक शाब्दिक भाव ‘हम पर’ या ‘हमारे विरुद्ध’ है, जिसे पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: עַד מְאֹד
  choice: अत्यन्त
  rationale: यह वाक्यांश क्रोध की तीव्रता पर प्रबल जोर देता है। ‘अत्यन्त’ काव्यात्मक गरिमा रखते हुए आज के पाठक के लिए स्पष्ट है।
theological_decisions:
- issue: यह आयत पिछली विनती का अपवाद है या एक स्वतंत्र कथन
  choice: 'पिछली आयत की विनती से जुड़ा आशंकित अपवाद: ‘यदि ऐसा न हो कि...’'
  alternative: 'स्वतंत्र कथन: ‘क्योंकि तूने हमें पूरी तरह ठुकरा दिया है...’'
  rationale: 'כִּי אִם यहाँ अपवादसूचक अर्थ दे सकता है। इस अर्थ को मुख्य पाठ में रखने से पुस्तक का अंतिम तनाव बना रहता है: पुनर्स्थापना की विनती की गई है, पर परमेश्वर द्वारा पूर्ण त्याग की आशंका अनुत्तरित रहती है। वैकल्पिक वाचन पादटिप्पणी में दिया गया है।'
translation_notes:
  register: भाषा आधुनिक, सरल और गरिमापूर्ण रखी गई है। एकवचन संबोधन ‘तू’ विलाप की सीधी प्रार्थनात्मक निकटता और हिब्रू के एकवचन रूप को बनाए रखता है। वाक्य को जानबूझकर आशंकित और खुला रखा गया है, ताकि मूल समापन का धर्मवैचारिक तनाव समाप्त न हो।
