source:
  edition: WLC
  text: בַּחוּרִים֙ טְח֣וֹן נָשָׂ֔אוּ וּ/נְעָרִ֖ים בָּ/עֵ֥ץ כָּשָֽׁלוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/005/013.yaml
  text: Young men carry millstones[b][a], and boys stagger under wood.
translation:
  language: hi
  text: जवान चक्की के पाट ढोते हैं[a], और लड़के लकड़ी के बोझ तले लड़खड़ाते हैं[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “जवान पीसने का काम सहते हैं” या “जवान चक्की ढोते हैं।” इब्रानी शब्द טְחוֹן पीसने से संबंधित है और उससे पीसने का काम अथवा पीसने का उपकरण—दोनों अभिप्रेत हो सकते हैं।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से “लकड़ी में/के साथ लड़खड़ाते हैं।” सम्भवतः लड़के लकड़ी का भारी बोझ उठाते हुए उसके नीचे डगमगा रहे हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּחוּרִים
  choice: जवान
  rationale: यह शब्द युवावस्था की पूरी शक्ति वाले पुरुषों को दर्शाता है। ‘जवान’ आधुनिक हिन्दी में स्वाभाविक है और शब्द के सामाजिक तथा शारीरिक भाव को बनाए रखता है।
- source_word: טְחוֹן
  choice: चक्की के पाट
  rationale: यह शब्द पीसने से संबंधित है और यहाँ נָשָׂאוּ (‘ढोते हैं’) का कर्म है। संदर्भ में पीसने के भारी उपकरण, अर्थात चक्की के पाट, का अर्थ सबसे स्वाभाविक है; फिर भी ‘पीसने का काम’ या पूरी ‘चक्की’ का अर्थ सम्भव होने के कारण उसे पाद-टिप्पणी में रखा गया है।
- source_word: נָשָׂאוּ
  choice: ढोते हैं
  rationale: क्रिया का मूल अर्थ उठाना, ले जाना या भार सहना है। ‘ढोते हैं’ भारी बोझ और कठोर श्रम, दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וּנְעָרִים
  choice: और लड़के
  rationale: यह पहले आए בַּחוּרִים से कम आयु के किशोरों या लड़कों की ओर संकेत कर सकता है। ‘लड़के’ इस आयु-भेद और विलाप की करुणा को बनाए रखता है।
- source_word: בָּעֵץ
  choice: लकड़ी के बोझ तले
  rationale: शाब्दिक रचना ‘लकड़ी में/के साथ/के नीचे’ है। संदर्भ में लकड़ी का भार उठाने के कारण लड़खड़ाना अभिप्रेत जान पड़ता है; ‘बोझ तले’ इसे स्वाभाविक हिन्दी में व्यक्त करता है, जबकि शाब्दिक अस्पष्टता पाद-टिप्पणी में सुरक्षित है।
- source_word: כָּשָׁלוּ
  choice: लड़खड़ाते हैं
  rationale: क्रिया ठोकर खाने, डगमगाने या दुर्बल होकर गिरने की ओर बढ़ने को दर्शाती है। ‘लड़खड़ाते हैं’ ‘गिर पड़े’ की अपेक्षा कम निर्णायक है और मूल की क्रियात्मक सीमा बनाए रखता है।
