source:
  edition: WLC
  text: זְכֹ֤ר יְהוָה֙ מֶֽה הָ֣יָה לָ֔/נוּ הביט וּ/רְאֵ֥ה אֶת חֶרְפָּתֵֽ/נוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/005/001.yaml
  text: Remember[a], O Yahweh, what has happened to us; look, and see our disgrace.
translation:
  language: hi
  text: हे याहवे, याद कर कि हम पर क्या बीती है; नज़र डाल और हमारे अपमान[a] को देख।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “हमारी निंदा”; या “हमारी लज्जा।”
    reason: חֶרְפָּה के अर्थ-क्षेत्र में सार्वजनिक अपमान, निंदा और उससे उत्पन्न लज्जा सम्मिलित हैं।
lexical_decisions:
- source_word: זְכֹר
  choice: याद कर
  rationale: זכר का पुल्लिंग एकवचन आज्ञार्थक रूप है। “याद कर” प्रार्थना की सीधी और आग्रहपूर्ण पुकार को स्वाभाविक आधुनिक हिन्दी में बनाए रखता है; इसका आशय केवल मानसिक स्मरण तक सीमित नहीं है।
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत वाचा-नाम יהוה को किसी उपाधि से बदलने के बजाय हिन्दी में निकट लिप्यंतरण “याहवे” दिया गया है।
- source_word: מֶה הָיָה לָנוּ
  choice: कि हम पर क्या बीती है
  rationale: यह मुहावरेदार हिन्दी लोगों पर आ पड़ी विपत्ति और उनकी वर्तमान दशा, दोनों को व्यक्त करती है।
- source_word: הביט
  choice: ध्यान दे
  rationale: नבט के आज्ञार्थक रूप में ध्यानपूर्वक देखने की पुकार है। “ध्यान दे” अगले क्रियापद “देख” से उसका भेद रखते हुए हिन्दी में स्वाभाविक है।
- source_word: וּרְאֵה
  choice: और ... को देख
  rationale: ראה के आज्ञार्थक रूप को “देख” से व्यक्त किया गया है, जिससे मूल की दोहरी विनती—ध्यान देना और देखना—सुरक्षित रहती है।
- source_word: אֶת חֶרְפָּתֵנוּ
  choice: हमारे अपमान
  rationale: חֶרְפָּה दूसरों के सामने हुई निन्दा, बेइज़्ज़ती या अपमान की दशा बताता है। “अपमान” आधुनिक हिन्दी में स्पष्ट है और सार्वजनिक तिरस्कार का भाव रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: याहवे
  alternative: प्रभु
  rationale: मूल पाठ में उपाधि नहीं, चार अक्षरों वाला व्यक्तिगत वाचा-नाम है। इसलिए उसे “प्रभु” से प्रतिस्थापित किए बिना लिप्यंतरित किया गया है।
translation_notes:
  register: भाषा आधुनिक, सरल और गरिमापूर्ण प्रार्थनात्मक हिन्दी है। “हे” संबोधन की गंभीरता रखता है; “हम पर क्या बीती है” विलाप के भाव को सहज रूप से व्यक्त करता है। मूल के दो देखनेवाले आज्ञार्थकों को “ध्यान दे” और “देख” के रूप में अलग रखा गया है।
