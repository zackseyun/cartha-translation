source:
  edition: WLC
  text: יֵשְׁב֨וּ לָ/אָ֤רֶץ יִדְּמוּ֙ זִקְנֵ֣י בַת צִיּ֔וֹן הֶֽעֱל֤וּ עָפָר֙ עַל רֹאשָׁ֔/ם חָגְר֖וּ שַׂקִּ֑ים הוֹרִ֤ידוּ לָ/אָ֨רֶץ֙ רֹאשָׁ֔/ן בְּתוּלֹ֖ת יְרוּשָׁלִָֽם־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/002/010.yaml
  text: The elders of daughter Zion sit on the ground in silence[a]; they have thrown dust on their heads and put on sackcloth[b]; the virgins of Jerusalem have bowed their heads to the ground.
translation:
  language: hi
  text: सिय्योन-पुत्री के बुज़ुर्ग भूमि पर मौन बैठे हैं; उन्होंने अपने सिरों पर धूल डाल ली है और टाट पहन लिया है; यरूशलेम की कुंवारियों ने अपने सिर भूमि तक झुका लिए हैं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יֵשְׁבוּ לָאָרֶץ יִדְּמוּ
  choice: भूमि पर चुपचाप बैठे हैं
  rationale: यह पद शोक में भूमि पर बैठने और मौन रहने की ठोस मुद्रा व्यक्त करता है। ‘चुपचाप बैठे हैं’ आधुनिक हिन्दी में स्वाभाविक है और दोनों क्रियात्मक तत्व सुरक्षित रखता है।
- source_word: זִקְנֵי
  choice: पुरनिये
  rationale: यह शब्द आयु के साथ सामुदायिक प्रतिष्ठा या नेतृत्व का भी संकेत देता है। ‘पुरनिये’ बाइबलीय गरिमा रखते हुए केवल ‘बूढ़े पुरुषों’ तक अर्थ को सीमित नहीं करता।
- source_word: בַת צִיּוֹן
  choice: सिय्योन की बेटी
  rationale: मूल का काव्यात्मक मानवीकरण बनाए रखा गया है; इसे सीधे ‘यरूशलेम’ कहकर समतल नहीं किया गया।
- source_word: הֶעֱלוּ עָפָר עַל רֹאשָׁם
  choice: अपने सिरों पर धूल डाल ली है
  rationale: यह शोक की सांस्कृतिक क्रिया है। ‘धूल डाल ली है’ स्पष्ट, स्वाभाविक हिन्दी है और मूल बिंब को बनाए रखती है।
- source_word: חָגְרוּ שַׂקִּים
  choice: टाट ओढ़ लिया है
  rationale: मूलतः टाट बाँधने या पहनने का शोक-संकेत है। ‘टाट ओढ़ लिया’ साधारण हिन्दी पाठक के लिए समझने योग्य है और शोक-वस्त्र का आशय देता है।
- source_word: בְּתוּלֹת יְרוּשָׁלִָם
  choice: यरूशलेम की कुँवारियाँ
  rationale: בְּתוּלוֹת का विशिष्ट अर्थ अविवाहित कुँवारी युवतियाँ है; ‘युवतियाँ’ कहने से इसकी शाब्दिक विशिष्टता घट जाती।
- source_word: הוֹרִידוּ לָאָרֶץ רֹאשָׁן
  choice: अपने सिर भूमि तक झुका लिए हैं
  rationale: यह गहरे शोक और अपमान की शारीरिक मुद्रा को व्यक्त करता है। ‘भूमि तक’ दिशा और अंतिम स्थिति दोनों को स्वाभाविक हिन्दी में दर्शाता है।
theological_decisions: []
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में है, पर विलाप-काव्य की गरिमा बनाए रखने के लिए ‘भूमि’, ‘पुरनिये’ और ‘कुँवारियाँ’ जैसे शब्द चुने गए हैं। मूल की तीन समानांतर शोक-मुद्राएँ अर्धविरामों द्वारा सुरक्षित रखी गई हैं।
