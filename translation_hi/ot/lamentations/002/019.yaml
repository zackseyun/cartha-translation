source:
  edition: WLC
  text: ק֣וּמִי רֹ֣נִּי ב/ליל לְ/רֹאשׁ֙ אַשְׁמֻר֔וֹת שִׁפְכִ֤י כַ/מַּ֨יִם֙ לִבֵּ֔/ךְ נֹ֖כַח פְּנֵ֣י אֲדֹנָ֑/י שְׂאִ֧י אֵלָ֣י/ו כַּפַּ֗יִ/ךְ עַל נֶ֨פֶשׁ֙ עֽוֹלָלַ֔יִ/ךְ הָ/עֲטוּפִ֥ים בְּ/רָעָ֖ב בְּ/רֹ֥אשׁ כָּל חוּצֽוֹת׀־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/002/019.yaml
  text: Rise[a], cry out in the night, at the beginning of the watches; pour out your heart like water before the face of the Lord. Lift up your hands to him for the lives of your little children, who are faint with hunger at the head of every street.
translation:
  language: hi
  text: 'उठ, रात में पुकार,

    रात के पहरों के आरम्भ में;

    प्रभु के सम्मुख

    अपना हृदय पानी के समान उँडेल दे।

    अपने नन्हे बच्चों के प्राणों के लिए

    उसकी ओर अपने हाथ उठा;

    वे हर गली के सिरे पर[a]

    भूख से निढाल हैं।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या अधिक मुहावरेदार ढंग से, “हर गली के मोड़ पर।”
    reason: lexical_alternative
lexical_decisions:
- source_word: ק֣וּמִי
  choice: उठ
  rationale: यह קום का स्त्रीलिंग एकवचन आज्ञार्थक रूप है और मानवीकृत सिय्योन/यरूशलेम को संबोधित है। ‘उठ’ आधुनिक हिन्दी में स्वाभाविक और तात्कालिक आह्वान है।
- source_word: רֹ֣נִּי
  choice: पुकार
  rationale: רן प्रसंगानुसार ऊँची पुकार, हर्षध्वनि या विलाप की आवाज़ बता सकता है। इस शोकगीत में ‘पुकार’ विलापमय संदर्भ को व्यक्त करता है, पर मूल शब्द को अनावश्यक रूप से केवल ‘रो’ तक सीमित नहीं करता।
- source_word: ב/ליל
  choice: रात में
  rationale: सरल कालवाचक पदबंध, जो आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: לְ/רֹאשׁ אַשְׁמֻר֔וֹת
  choice: रात के पहरों के आरम्भ में
  rationale: רֹאשׁ यहाँ ‘आरम्भ’ और אַשְׁמֻרוֹת रात के पहरों को सूचित करता है। ‘रात के’ जोड़ने से हिन्दी पाठक के लिए आशय स्पष्ट होता है।
- source_word: שִׁפְכִ֤י כַ/מַּ֨יִם לִבֵּ֔/ךְ
  choice: अपना हृदय पानी के समान उँडेल दे
  rationale: यह तीव्र और निर्बाध विलाप या प्रार्थना का रूपक है। अनुवाद मूल उपमा और ‘हृदय’ के भावात्मक अर्थ दोनों को बनाए रखता है।
- source_word: נֹ֖כַח פְּנֵ֣י אֲדֹנָ֑/י
  choice: प्रभु के सम्मुख
  rationale: נֹכַח פְּנֵי प्रत्यक्ष उपस्थिति का भाव देता है। हिन्दी में ‘के सम्मुख’ वही अर्थ गरिमापूर्ण और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: שְׂאִ֧י אֵלָ֣י/ו כַּפַּ֗יִ/ךְ
  choice: उसकी ओर अपने हाथ उठा
  rationale: नשׂא और हाथों का मेल प्रार्थना की मुद्रा दर्शाता है। אֵלָיו की दिशात्मकता ‘उसकी ओर’ से सुरक्षित रहती है।
- source_word: עַל נֶ֨פֶשׁ֙ עֽוֹלָלַ֔יִ/ךְ
  choice: अपने नन्हे बच्चों के प्राणों के लिए
  rationale: עַל यहाँ उनकी ओर से विनती का भाव देता है; נֶפֶשׁ इस संदर्भ में अमूर्त ‘आत्मा’ नहीं, जीवन/प्राण है; עוֹלָלִים बहुत छोटे बच्चों को सूचित करता है।
- source_word: הָ/עֲטוּפִ֥ים בְּ/רָעָ֖ב
  choice: भूख से निढाल होकर … पड़े हैं
  rationale: עטף यहाँ भूख के कारण शिथिल, अचेत-से या मूर्छित होने की दशा बताता है। ‘निढाल’ इस गंभीर दुर्बलता को सहज हिन्दी में व्यक्त करता है, और ‘पड़े हैं’ प्रसंगगत अवस्था स्पष्ट करता है।
- source_word: בְּ/רֹ֥אשׁ כָּל חוּצֽוֹת
  choice: हर गली के सिरे पर
  rationale: רֹאשׁ का मूल स्थानिक चित्र ‘सिरा’ से बना रहता है और חוּצוֹת को इस शहरी संदर्भ में ‘गलियाँ’ कहना स्वाभाविक है। मुहावरेदार सम्भावना फुटनोट में दी गई है।
theological_decisions:
- issue: אֲדֹנָי का अनुवाद
  choice: प्रभु
  alternative: यहोवा; मेरे प्रभु
  rationale: यहाँ पाठ אֲדֹנָי है, चतुरक्षरीय परमेश्वर-नाम YHWH नहीं। इसलिए ‘प्रभु’ उपाधि को ठीक रूप से व्यक्त करता है और मूल में अनुपस्थित वाचा-नाम या ‘मेरे’ को नहीं जोड़ता।
- issue: נֶפֶשׁ का अर्थ
  choice: प्राण
  alternative: आत्मा; जीवन
  rationale: भूख से मरते नन्हे बच्चों के संदर्भ में נֶפֶשׁ उनके जीवित प्राणों को सूचित करता है। ‘प्राण’ जीवन की संकटग्रस्त दशा और विनती की तीव्रता रखता है, बिना मनुष्य की प्रकृति पर कोई पृथक धर्मवैज्ञानिक निष्कर्ष थोपे।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, काव्यात्मक किंतु सामान्य पाठक के लिए सुबोध रूप अपनाया गया है। आज्ञार्थक क्रियाएँ मानवीकृत सिय्योन/यरूशलेम को एकवचन संबोधन के रूप में रखी गई हैं। पंक्ति-विन्यास विलाप और प्रार्थना की लय को सहारा देता है। फुटनोट चिह्न उसी पदांश के बाद रखा गया है जिससे उसका वास्तविक संबंध है।
