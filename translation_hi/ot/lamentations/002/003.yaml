  text: גָּדַ֣ע בָּֽ/חֳרִי אַ֗ף כֹּ֚ל קֶ֣רֶן יִשְׂרָאֵ֔ל הֵשִׁ֥יב אָח֛וֹר יְמִינ֖/וֹ מִ/פְּנֵ֣י אוֹיֵ֑ב וַ/יִּבְעַ֤ר בְּ/יַעֲקֹב֙ כְּ/אֵ֣שׁ לֶֽהָבָ֔ה אָכְלָ֖ה סָבִֽיב׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/002/003.yaml
  text: In burning anger he has cut down every horn of Israel[a]; he has drawn back his right hand from before the enemy[b], and he has burned in Jacob like a flaming fire that devours all around.
translation:
  language: hi
  text: उसने धधकते क्रोध में इस्राएल के हर सींग को काट गिराया है[a]; उसने शत्रु के सामने से अपना दाहिना हाथ पीछे खींच लिया है[b], और वह याकूब में धधकती आग की तरह भड़क उठा है, जो चारों ओर भस्म कर देती है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘सींग’ इब्रानी में शक्ति, सामर्थ्य या प्रतिष्ठा का रूपक है।
    reason: lexical_alternative
  - marker: b
    text: या, ‘उसने शत्रु के सामने अपना दाहिना हाथ पीछे खींच लिया है।’ यह परमेश्वर द्वारा अपनी सामर्थ्य या रक्षा हटा लेने की छवि है।
    reason: lexical_alternative
lexical_decisions:
- source_word: גָּדַע
  choice: काट गिराया है
  rationale: यह क्रिया हिंसक ढंग से काट देने या काट गिराने का बोध देती है। ‘काट गिराया’ विनाश की तीव्रता और सींग के रूपक, दोनों के साथ स्वाभाविक है।
- source_word: בָּחֳרִי אַף
  choice: धधकते क्रोध में
  rationale: חֳרִי और אַף का मेल क्रोध की जलती हुई तीव्रता व्यक्त करता है; ‘धधकते’ आगे आने वाली आग की छवि से भी जुड़ता है।
- source_word: כֹּל קֶרֶן יִשְׂרָאֵל
  choice: इस्राएल के हर सींग
  rationale: सींग शक्ति, सामर्थ्य या प्रतिष्ठा का इब्रानी रूपक है। स्रोत की काव्यात्मक छवि बनाए रखने के लिए इसे मुख्य पाठ में रखा गया है और पादटिप्पणी में अर्थ स्पष्ट किया गया है।
- source_word: הֵשִׁיב אָחוֹר יְמִינוֹ
  choice: अपना दाहिना हाथ पीछे खींच लिया है
  rationale: वाक्यांश परमेश्वर की सामर्थ्य अथवा रक्षा को वापस खींचने की मूर्त छवि प्रस्तुत करता है। ‘पीछे खींच लिया’ आधुनिक हिन्दी में सहज है।
- source_word: מִפְּנֵי אוֹיֵב
  choice: शत्रु के सामने से
  rationale: 'מִן के कारण ‘सामने से’ स्रोत की दिशा-संबंधी अस्पष्टता बनाए रखता है: हाथ शत्रु की उपस्थिति में अथवा उसके सामने से हटाया गया।'
- source_word: וַיִּבְעַר בְּיַעֲקֹב
  choice: वह याकूब में ... जल उठा है
  rationale: בער जलने या भड़कने को व्यक्त करता है और בְּיַעֲקֹב विनाशकारी आग के याकूब के भीतर सक्रिय होने का संकेत देता है।
- source_word: כְּאֵשׁ לֶהָבָה
  choice: धधकती आग के समान
  rationale: यह चयन आग और ज्वाला की तीव्र संयुक्त छवि को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: אָכְלָה סָבִיב
  choice: जो चारों ओर भस्म करती है
  rationale: ‘भस्म करती है’ आग के निगलने और नष्ट करने के अर्थ को स्पष्ट और सजीव ढंग से देता है; ‘चारों ओर’ विनाश की व्यापकता को सुरक्षित रखता है।
theological_decisions:
- issue: ईश्वरीय न्याय के रूपक
  choice: ‘सींग’, ‘दाहिना हाथ’ और आग की छवियों को मुख्य पाठ में बनाए रखा गया है।
  alternative: मुख्य पाठ में ‘सींग’ को ‘सामर्थ्य’ और ‘दाहिना हाथ’ को ‘रक्षा’ या ‘शक्ति’ से बदलना।
  rationale: ये परस्पर जुड़ी छवियाँ इस्राएल की शक्ति काटे जाने, ईश्वरीय रक्षा हटने और चारों ओर फैलते न्याय को व्यक्त करती हैं। इन्हें व्याख्यात्मक शब्दों से बदलना काव्यात्मक और धर्मवैचारिक तनाव को घटा देता।
- issue: וַיִּבְעַר का कर्ता और अग्नि-उपमा
  choice: ‘वह ... जल उठा है’ के द्वारा प्रभु को कर्ता बनाए रखते हुए उसे धधकती आग के समान प्रस्तुत किया गया है।
  alternative: ‘उसने याकूब में आग भड़का दी’ पढ़ना।
  rationale: इब्रानी क्रिया स्वयं कर्ता के जलने या भड़कने का बोध दे सकती है और अगली उपमा उसी कर्ता को अग्नि के समान चित्रित करती है; इसलिए कारणात्मक व्याख्या थोपे बिना स्रोत की तीखी छवि रखी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, काव्यात्मक किंतु सामान्य पाठक के लिए बोधगम्य रूप अपनाया गया है। ‘धधकते’, ‘काट गिराया’, ‘पीछे खींच लिया’ और ‘भस्म करती है’ जैसे शब्द विलापगीत की तीव्रता रखते हैं; मूल रूपकों को पादटिप्पणियों के सहारे सुरक्षित रखा गया है।
