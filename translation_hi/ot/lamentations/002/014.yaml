source:
  edition: WLC
  text: נְבִיאַ֗יִ/ךְ חָ֤זוּ לָ/ךְ֙ שָׁ֣וְא וְ/תָפֵ֔ל וְ/לֹֽא גִלּ֥וּ עַל עֲוֺנֵ֖/ךְ לְ/הָשִׁ֣יב שבית/ך וַ/יֶּ֣חֱזוּ לָ֔/ךְ מַשְׂא֥וֹת שָׁ֖וְא וּ/מַדּוּחִֽים־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/002/014.yaml
  text: Your prophets saw for you falsehood and folly[a], and they did not uncover your iniquity to restore your fortunes; instead[b], they saw for you false oracles and delusions.
translation:
  language: hi
  text: तेरे नबियों ने तेरे लिए झूठे और निरर्थक दर्शन देखे। उन्होंने तेरे अधर्म को उजागर नहीं किया, ताकि तेरी दशा फिर बहाल हो सके[a]; इसके बजाय, उन्होंने तेरे लिए झूठे भविष्यसूचक संदेश[b] और भटकाने वाले दर्शन देखे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या अधिक शाब्दिक रूप में, “तेरी बंधुआई लौटा दी जाती” अथवा “तेरे बंदी लौटा दिए जाते।” यह हिब्रू मुहावरा प्रायः किसी जाति को विपत्ति या निर्वासन से फिर बहाल किए जाने के लिए प्रयुक्त होता है।
    reason: alternative_reading
  - marker: b
    text: या “बोझ”; भविष्यसूचक घोषणा के लिए प्रयुक्त इस शब्द का यह पारंपरिक, अधिक शाब्दिक अनुवाद है।
    reason: lexical_alternative
lexical_decisions:
- source_word: נְבִיאַיִךְ
  choice: तेरे नबियों
  rationale: यह रूप स्त्रीलिंग एकवचन में संबोधित यरूशलेम के नबियों को दर्शाता है। हिंदी में ‘तेरे नबियों’ स्वाभाविक है और मूल संबोधन को बनाए रखता है।
- source_word: חָזוּ / וַיֶּחֱזוּ
  choice: दर्शन देखे / देखे
  rationale: क्रिया भविष्यसूचक दर्शन देखने को व्यक्त करती है। ‘देखे’ मूल के दृष्टि-संबंधी रूपक और पद की पुनरावृत्ति को सुरक्षित रखता है।
- source_word: שָׁוְא וְתָפֵל
  choice: झूठ और मूर्खता
  rationale: שָׁוְא असत्य और खोखलेपन को तथा दुर्लभ תָפֵל निरर्थक या मूर्खतापूर्ण बात को व्यक्त करता है। यह युग्म मूल की नैतिक और बौद्धिक निस्सारता को बनाए रखता है।
- source_word: גִלּוּ עַל עֲוֺנֵךְ
  choice: तेरे अधर्म को उजागर नहीं किया
  rationale: मुहावरा अपराध या पाप को खोलकर सामने रखने का भाव देता है। ‘उजागर’ ठोस रूपक को स्वाभाविक हिंदी में व्यक्त करता है, और ‘अधर्म’ עָוֹן का नैतिक भार रखता है।
- source_word: לְהָשִׁיב שְׁבִיתֵךְ
  choice: जिससे तेरी दशा फिर बहाल हो सकती थी
  rationale: यह पुनर्स्थापना-सूचक हिब्रू मुहावरा बंधुआई से लौटाने या विपत्ति की दशा पलटने, दोनों अर्थों में समझा जा सकता है। मुख्य पाठ व्यापक पुनर्बहाली का भाव देता है; अधिक शाब्दिक विकल्प पादटिप्पणी में रखा गया है।
- source_word: מַשְׂאוֹת
  choice: भविष्यवाणियाँ
  rationale: भविष्यसूचक संदर्भ में यह शब्द किसी नबी की घोषणा या वाणी को दर्शाता है। ‘भविष्यवाणियाँ’ आधुनिक पाठक के लिए स्पष्ट है; पारंपरिक शाब्दिक अर्थ ‘बोझ’ पादटिप्पणी में सुरक्षित है।
- source_word: מַדּוּחִים
  choice: बहकावे
  rationale: यह शब्द ऐसी बातों को दर्शाता है जो भटका देती हैं। ‘बहकावे’ भ्रम और पथभ्रष्ट करने, दोनों भावों को संक्षेप में व्यक्त करता है और दर्शन शब्द की अनावश्यक पुनरावृत्ति से बचता है।
theological_decisions:
- issue: לְהָשִׁיב שְׁבִיתֵךְ का अर्थ
  choice: तेरी दशा फिर बहाल हो सकती थी
  alternative: तेरी बंधुआई लौटा दी जाती / तेरे बंदी लौटा दिए जाते
  rationale: मूल मुहावरा कभी बंधुआई या बंदियों की वापसी और कभी व्यापक रूप से विपत्ति के पलटने को व्यक्त करता है। मुख्य पाठ अर्थ को केवल निर्वासन तक सीमित नहीं करता, जबकि पादटिप्पणी वास्तविक शाब्दिक अस्पष्टता सुरक्षित रखती है।
- issue: מַשְׂאוֹת का अनुवाद
  choice: भविष्यवाणियाँ
  alternative: बोझ
  rationale: ‘बोझ’ शब्द की व्युत्पत्तिगत और पारंपरिक प्रतिध्वनि रखता है, पर आधुनिक हिंदी में भविष्यसूचक घोषणा का अर्थ अस्पष्ट कर सकता है। ‘भविष्यवाणियाँ’ प्रसंग को साफ करता है और विकल्प पादटिप्पणी में देता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। यरूशलेम से स्त्रीलिंग एकवचन संबोधन हिंदी के ‘तेरे/तेरी’ रूपों में स्वाभाविक ढंग से बना रहता है। मूल की ‘देखने’ वाली भविष्यसूचक छवि और आरोपात्मक तीव्रता को सुरक्षित रखा गया है।
