  text: דָּרַ֨ךְ קַשְׁתּ֜/וֹ כְּ/אוֹיֵ֗ב נִצָּ֤ב יְמִינ/וֹ֙ כְּ/צָ֔ר וַֽ/יַּהֲרֹ֔ג כֹּ֖ל מַחֲמַדֵּי עָ֑יִן בְּ/אֹ֨הֶל֙ בַּת צִיּ֔וֹן שָׁפַ֥ךְ כָּ/אֵ֖שׁ חֲמָתֽ/וֹ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/002/004.yaml
  text: He bent his bow like an enemy; his right hand stood ready like a foe[a], and he killed all who were pleasing to the eye in the tent of daughter Zion; he poured out his wrath like fire.
translation:
  language: hi
  text: उसने शत्रु के समान अपना धनुष ताना; विरोधी के समान उसका दाहिना हाथ तैनात था। उसने सिय्योन की बेटी के तंबू में उन सबको मार डाला जो आँखों को प्रिय थे[a]; उसने आग के समान अपना प्रकोप उंडेल दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वह सब जो आँखों को मनभावन था।” इब्रानी पद सुंदर या बहुमूल्य वस्तुओं अथवा प्रिय लोगों—दोनों की ओर संकेत कर सकता है; इस संदर्भ में प्रिय लोगों का अर्थ अधिक संभावित है।
    reason: lexical_alternative
lexical_decisions:
- source_word: דָּרַךְ קַשְׁתּוֹ
  choice: अपना धनुष चढ़ाया
  rationale: धनुष के साथ דָּרַךְ उसे प्रहार के लिए तैयार करने या तानने का भाव देता है। ‘धनुष चढ़ाया’ स्वाभाविक हिन्दी में युद्ध की तैयारी का चित्र बनाए रखता है, बिना क्रिया के चरण को अनावश्यक रूप से निश्चित किए।
- source_word: כְּאוֹיֵב
  choice: शत्रु के समान
  rationale: उपसर्ग כְּ की स्पष्ट उपमा को बनाए रखा गया है; परमेश्वर के सिय्योन के विरुद्ध शत्रु-समान व्यवहार की कठोर छवि को नरम नहीं किया गया।
- source_word: נִצָּב יְמִינוֹ
  choice: उसका दाहिना हाथ वार करने को तैयार था
  rationale: नִצָּב का मूल भाव खड़े या तैनात होने का है। युद्ध-संदर्भ में हिन्दी का यह वाक्यांश तत्पर, आक्रामक मुद्रा को स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
- source_word: כְּצָר
  choice: विरोधी के समान
  rationale: צָר शत्रु या विरोधी को सूचित करता है। ‘विरोधी’ पहले आए ‘शत्रु’ की अनावश्यक पुनरावृत्ति से बचते हुए समान सैन्य-विरोध का भाव रखता है।
- source_word: וַיַּהֲרֹג כֹּל
  choice: उन सबको मार डाला
  rationale: क्रिया के प्रत्यक्ष और कठोर अर्थ तथा כֹּל की समग्रता दोनों सुरक्षित रखी गई हैं।
- source_word: מַחֲמַדֵּי עָיִן
  choice: जो आँखों को प्रिय थे
  rationale: यह पद आँखों को मनभावन, बहुमूल्य या प्रिय व्यक्तियों अथवा वस्तुओं के लिए हो सकता है। ‘मार डाला’ के संदर्भ में मुख्य पाठ व्यक्तियों की ओर संकेत करता है, जबकि पादटिप्पणी व्यापक अर्थ को सुरक्षित रखती है।
- source_word: בְּאֹהֶל בַּת־צִיּוֹן
  choice: सिय्योन-बेटी के तंबू में
  rationale: नगर और उसके लोगों के काव्यात्मक मानवीकरण को ‘सिय्योन-बेटी’ के रूप में बनाए रखा गया है; ‘तंबू’ भी मूल बिंब को सुरक्षित रखता है।
- source_word: שָׁפַךְ כָּאֵשׁ חֲמָתוֹ
  choice: आग के समान अपना प्रकोप उंडेल दिया
  rationale: शָׁפַךְ के उंडेलने, כָּאֵשׁ की उपमा और חֵמָה के तीव्र, दहकते क्रोध—तीनों को गरिमापूर्ण आधुनिक हिन्दी में व्यक्त किया गया है।
theological_decisions:
- issue: परमेश्वर का सिय्योन के प्रति ‘शत्रु के समान’ कार्य करना
  choice: उपमा को मुख्य पाठ में सीधे बनाए रखना
  alternative: ‘उसने शत्रु बनकर आक्रमण किया’ या ‘वह शत्रु-सा दिखाई दिया’
  rationale: इब्रानी पाठ उसके कार्य की तुलना शत्रु और विरोधी से करता है। न तो तुलना को पहचान में बदला गया है और न ‘दिखाई दिया’ कहकर उसे नरम किया गया है; इस प्रकार मूल का धर्मवैचारिक तनाव सुरक्षित रहता है।
- issue: בַּת־צִיּוֹן का मानवीकरण
  choice: सिय्योन-बेटी
  alternative: सिय्योन की बेटी; सिय्योन
  rationale: विलापगीत में यह नगर और समुदाय का महत्त्वपूर्ण काव्यात्मक मानवीकरण है। इसे केवल ‘सिय्योन’ करने से वह छवि मिट जाती।
- issue: מַחֲמַדֵּי עָיִן का व्यक्ति या वस्तु-संदर्भ
  choice: मुख्य पाठ में प्रिय व्यक्तियों की ओर संकेत, पादटिप्पणी में व्यापक संभावना
  alternative: वह सब जो आँखों को मनभावन था
  rationale: ‘मार डाला’ व्यक्ति-संदर्भ को प्रबल बनाता है, पर इब्रानी पद सुंदर या बहुमूल्य वस्तुओं को भी सूचित कर सकता है। पादटिप्पणी इस वास्तविक अस्पष्टता को बनाए रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण काव्यात्मक गद्य अपनाया गया है। ‘शत्रु के समान’, ‘सिय्योन-बेटी’, ‘तंबू’, ‘प्रकोप’ और ‘उंडेल दिया’ मूल की युद्ध, मानवीकरण और अग्नि-संबंधी छवियों को रखते हैं। अत्यधिक संस्कृतनिष्ठ या पुरातन शब्दावली से बचते हुए पद की गंभीरता बनाए रखी गई है।
