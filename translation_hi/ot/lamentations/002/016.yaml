source:
  edition: WLC
  text: פָּצ֨וּ עָלַ֤יִ/ךְ פִּי/הֶם֙ כָּל א֣וֹיְבַ֔יִ/ךְ שָֽׁרְקוּ֙ וַ/יַּֽחַרְקוּ שֵׁ֔ן אָמְר֖וּ בִּלָּ֑עְנוּ אַ֣ךְ זֶ֥ה הַ/יּ֛וֹם שֶׁ/קִּוִּינֻ֖/הוּ מָצָ֥אנוּ רָאִֽינוּ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/002/016.yaml
  text: All your enemies open their mouths against you[a]; they hiss and gnash their teeth. They say, “We have swallowed you up! Surely this is the day we hoped for; we have found it[b], we have seen it.”
translation:
  language: hi
  text: तेरे सब शत्रु तेरे विरुद्ध अपना मुँह खोलते हैं; वे तिरस्कार से सीटी बजाते[a] और दाँत पीसते हैं। वे कहते हैं, “हमने उसे निगल लिया[b]! निश्चय, यही वह दिन है जिसकी हमने आशा की थी; हमने उसे पा लिया, हमने उसे देख लिया।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: हिब्रू क्रिया का अर्थ ‘फुफकारना’ भी हो सकता है; यहाँ यह शत्रुओं के तिरस्कारपूर्ण उपहास का संकेत है।
    reason: lexical_alternative
  - marker: b
    text: हिब्रू में ‘निगल लिया’ का कर्म व्यक्त नहीं है। संदर्भ में यह सिय्योन/यरूशलेम की ओर संकेत करता है; ‘तुझे’ भी संदर्भानुसार समझा जा सकता है।
    reason: source_ambiguity
lexical_decisions:
- source_word: פָּצוּ ... פִּיהֶם
  choice: मुँह पसारते हैं
  rationale: यह मूल के ‘मुँह चौड़ा खोलने’ वाले सजीव भाव को स्वाभाविक और गरिमापूर्ण हिन्दी में बनाए रखता है।
- source_word: עָלַיִךְ
  choice: तेरे विरुद्ध
  rationale: सिय्योन को स्त्रीलिंग एकवचन में किए गए सीधे संबोधन और शत्रुतापूर्ण दिशा—दोनों को व्यक्त करता है।
- source_word: כָּל אֹיְבַיִךְ
  choice: तेरे सभी शत्रु
  rationale: समष्टिगत पूर्णता और दूसरे पुरुष एकवचन संबोधन सुरक्षित रहते हैं।
- source_word: שָׁרְקוּ
  choice: फुफकारते
  rationale: क्रिया उपहास या तिरस्कार की सीटी/फुफकार को सूचित कर सकती है; इस शत्रुतापूर्ण प्रसंग में ‘फुफकारते’ अधिक स्पष्ट है।
- source_word: וַיַּחַרְקוּ שֵׁן
  choice: दाँत पीसते हैं
  rationale: क्रोध और द्वेष व्यक्त करने वाला स्वाभाविक हिन्दी मुहावरा है।
- source_word: בִּלָּעְנוּ
  choice: हमने उसे निगल लिया
  rationale: मूल में व्यक्त कर्म नहीं है; हिन्दी में ‘उसे’ संदर्भगत स्त्री सिय्योन को संकेत करता है और विनाश का निगलने वाला रूपक बनाए रखता है।
- source_word: אַךְ זֶה הַיּוֹם
  choice: निश्चय यही वह दिन है
  rationale: אַךְ का विजयी, बलाघाती स्वर और अपेक्षित विशिष्ट दिन का भाव दोनों सुरक्षित हैं।
- source_word: שֶׁקִּוִּינֻהוּ
  choice: जिसकी हमने बाट जोही थी
  rationale: קוה में प्रतीक्षापूर्ण आशा/अपेक्षा का भाव है; शत्रुओं की आतुर प्रतीक्षा को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: מָצָאנוּ רָאִינוּ
  choice: हमने उसे पा लिया, हमने उसे देख लिया
  rationale: दोनों संक्षिप्त, समानांतर पूर्ण क्रियाओं की चरमबिंदु जैसी लय बनाए रखी गई है; ‘उसे’ उस दिन की ओर संकेत करता है।
theological_decisions:
- issue: בִּלָּעְנוּ में निहित कर्म का संदर्भ
  choice: उसे
  alternative: तुझे
  rationale: हिब्रू क्रिया में कर्म-सर्वनाम स्पष्ट रूप से लिखा नहीं है। प्रसंग में व्यक्तित्व-प्राप्त सिय्योन/यरूशलेम स्त्रीलिंग है, इसलिए ‘उसे’ स्वाभाविक है; पर सीधे दूसरे पुरुष संबोधन के कारण ‘तुझे’ भी संभव है। इस अस्पष्टता को पादटिप्पणी में रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में काव्यात्मक और गरिमापूर्ण शैली रखी गई है। स्त्रीरूप सिय्योन को संबोधित करने के लिए ‘तेरे/तुझ’ प्रयुक्त हैं। ‘मुँह पसारते’, ‘फुफकारते’ और ‘दाँत पीसते’ मूल की तीखी शत्रुता तथा दृश्यात्मकता को बनाए रखते हैं।
