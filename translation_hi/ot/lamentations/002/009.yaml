base_translation:
  language: en
  yaml_path: translation/ot/lamentations/002/009.yaml
  text: Her gates have sunk into the earth; he has destroyed and broken her bars[a]. Her king and her princes are among the nations; there is no law. Even her prophets have found no vision from Yahweh.
translation:
  language: hi
  text: उसके फाटक धरती में धँस गए हैं; उसने उनके बेंड़ों को नष्ट किया और तोड़ डाला है। उसका राजा और उसके अधिकारी राष्ट्रों के बीच हैं; कोई व्यवस्था[a] नहीं है। उसके नबियों को भी यहोवा की ओर से कोई दर्शन नहीं मिला है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “कोई शिक्षा” अथवा “कोई निर्देश”; हिब्रू तोरा का अर्थ व्यवस्था, शिक्षा या निर्देश हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: טָבְעוּ בָאָרֶץ
  choice: धरती में धँस गए हैं
  rationale: क्रिया डूबने या नीचे धँस जाने का बिंब देती है; यह पदबंध नगर के फाटकों के भूमि में समा जाने की काव्यात्मक छवि सुरक्षित रखता है।
- source_word: שְׁעָרֶיהָ
  choice: उसके फाटक
  rationale: यह नगर के प्रवेश-द्वारों का सामान्य पद है; स्त्रीलिंग प्रत्यय व्यक्तिरूप में चित्रित नगरी की ओर संकेत करता है।
- source_word: אִבַּד וְשִׁבַּר
  choice: उसने ... नष्ट कर तोड़ डाला है
  rationale: दोनों क्रियाओं की तीव्रता और क्रम सुरक्षित रहते हैं। कर्ता मूल में स्पष्ट नाम से नहीं दिया गया, इसलिए हिंदी में भी 'उसने' रखा गया है।
- source_word: בְּרִיחֶיהָ
  choice: उसके बेड़ों
  rationale: यह फाटकों को बंद और सुरक्षित रखने वाले मजबूत आड़े बेड़ों को दर्शाता है; 'बेड़े' इस ठोस स्थापत्य बिंब को संक्षेप में रखता है।
- source_word: מַלְכָּהּ וְשָׂרֶיהָ
  choice: उसका राजा और उसके हाकिम
  rationale: שָׂרִים राजकीय उच्चाधिकारियों या शासकों को दर्शाता है; आधुनिक हिंदी में 'हाकिम' पदानुक्रम और शासन-संबंधी अर्थ को बनाए रखता है।
- source_word: בַגּוֹיִם
  choice: अन्यजातियों के बीच
  rationale: גּוֹיִם यहाँ इस्राएल से बाहर के राष्ट्रों/जातियों को दर्शाता है; यह अनुवाद निर्वासन को पाठ में जोड़े बिना उस भेद को व्यक्त करता है।
- source_word: אֵין תּוֹרָה
  choice: कोई व्यवस्था नहीं रही
  rationale: תּוֹרָה का अर्थ व्यवस्था, विधि, शिक्षा या निर्देश हो सकता है। 'व्यवस्था' वाचा-संबंधी और विधिक अर्थ को संक्षेप में व्यक्त करती है, जबकि व्यापक विकल्प पादटिप्पणी में रखा गया है।
- source_word: גַּם נְבִיאֶיהָ
  choice: उसके नबियों को भी
  rationale: גַּם राजनीतिक और विधिक पतन के बाद नबूवत के मौन को चरम बिंदु के रूप में जोड़ता है; हिंदी में 'भी' स्वाभाविक रूप से यह प्रभाव देता है।
- source_word: לֹא מָצְאוּ חָזוֹן מֵיְהוָה
  choice: यहोवा की ओर से कोई दर्शन नहीं मिला
  rationale: מָצְאוּ का शाब्दिक भाव 'पाया' है, पर हिंदी में दर्शन/प्रकाशना प्राप्त न होने के लिए 'नहीं मिला' अधिक स्वाभाविक है; מֵ־ का स्रोतार्थ 'की ओर से' द्वारा स्पष्ट होता है।
theological_decisions:
- issue: אִבַּד और וְשִׁבַּר का अप्रकट कर्ता
  choice: कर्ता को 'उसने' के रूप में अप्रत्यक्ष रखा गया।
  alternative: 'स्पष्ट करना: ''यहोवा ने नष्ट कर तोड़ डाला है।'''
  rationale: आसपास का संदर्भ यहोवा को कर्ता बताता है, पर इस उपवाक्य में हिब्रू पाठ उसका नाम नहीं लेता। सर्वनाम मूल की अस्पष्टता और संदर्भगत तनाव दोनों को सुरक्षित रखता है।
- issue: इस प्रसंग में תּוֹרָה का अर्थ
  choice: मुख्य पाठ में 'व्यवस्था'।
  alternative: '''शिक्षा'', ''निर्देश'' या ''तोरा''।'
  rationale: विलाप में यरूशलेम की वाचा-संबंधी, विधिक और सार्वजनिक व्यवस्था के विघटन का भाव है। 'व्यवस्था' हिंदी बाइबलीय प्रयोग में इस अर्थ को वहन करती है, पर शब्द के शिक्षात्मक विस्तार को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिंदी में काव्यात्मक और गरिमापूर्ण शैली रखी गई है। 'धरती में धँस गए', 'बेड़ों' और 'दर्शन' जैसे शब्द मूल बिंबों को ठोस रखते हैं। वाक्य-संरचना साधारण पाठक के लिए स्पष्ट है, जबकि अप्रकट कर्ता और תּוֹרָה की अर्थ-व्याप्ति को बिना संप्रदायगत व्याख्या थोपे सुरक्षित रखा गया है।
