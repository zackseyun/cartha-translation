  text: סָֽפְק֨וּ עָלַ֤יִ/ךְ כַּפַּ֨יִם֙ כָּל עֹ֣בְרֵי דֶ֔רֶךְ שָֽׁרְקוּ֙ וַ/יָּנִ֣עוּ רֹאשָׁ֔/ם עַל בַּ֖ת יְרוּשָׁלִָ֑ם הֲ/זֹ֣את הָ/עִ֗יר שֶׁ/יֹּֽאמְרוּ֙ כְּלִ֣ילַת יֹ֔פִי מָשׂ֖וֹשׂ לְ/כָל הָ/אָֽרֶץ־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/002/015.yaml
  text: 'All who pass along the road clap their hands at you[a]; they hiss and shake their heads over daughter Jerusalem: “Is this the city that they called the perfection of beauty[c][b], the joy of all the earth?”'
translation:
  language: hi
  text: 'मार्ग से होकर गुजरनेवालों ने तुझ पर ताली बजाई; उन्होंने सीटी बजाई[a] और पुत्री यरूशलेम पर अपने सिर हिलाए:


    “क्या यही वह नगर है, जिसे लोग


    ‘सौंदर्य की परिपूर्णता[c],


    सारी पृथ्वी का आनंद’ कहते थे?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “फुफकारते”; इब्रानी क्रिया उपहास की तीखी ध्वनि को सूचित कर सकती है, जिसे सीटी या फुफकार के रूप में समझा जा सकता है।
    reason: lexical_alternative
  - marker: c
    text: या “सौंदर्य में परिपूर्ण।”
    reason: lexical_alternative
lexical_decisions:
- source_word: סָפְקוּ ... כַּפַּיִם
  choice: तालियाँ बजाते हैं
  rationale: यह इब्रानी मुहावरा हाथों को आपस में मारने के संकेत को व्यक्त करता है। प्रसंग में यह प्रशंसा नहीं, बल्कि उपहास का संकेत है; ‘तालियाँ बजाते हैं’ आधुनिक हिन्दी में स्वाभाविक है।
- source_word: עָלַיִךְ
  choice: तुझ पर
  rationale: स्त्रीलिंग एकवचन सम्बोधन नगर को व्यक्तित्व देकर उससे सीधे बात करता है; ‘तुझ पर’ उपहास की दिशा और काव्यात्मक सम्बोधन दोनों बनाए रखता है।
- source_word: כָּל עֹבְרֵי דֶרֶךְ
  choice: मार्ग से गुजरनेवाले सभी लोग
  rationale: यह यात्रियों या राहगीरों के लिए प्रयुक्त वाक्यांश है। अनुवाद में דֶּרֶךְ ‘मार्ग’ भी स्पष्ट रूप से सुरक्षित है।
- source_word: שָׁרְקוּ
  choice: सीटी बजाते
  rationale: क्रिया सीटी या फुफकार जैसी तीखी ध्वनि को सूचित कर सकती है। यहाँ ‘सीटी बजाते’ तिरस्कारपूर्ण सार्वजनिक प्रतिक्रिया को स्वाभाविक हिन्दी में व्यक्त करता है, जबकि विकल्प पादटिप्पणी में रखा गया है।
- source_word: וַיָּנִעוּ רֹאשָׁם
  choice: सिर हिलाते हैं
  rationale: यह उपहास, तिरस्कार या विस्मय का पारंपरिक संकेत है। ‘सिर हिलाते हैं’ वर्तमान हिन्दी में सहज है और संकेत की संभावित भाव-सीमा को अनावश्यक रूप से संकीर्ण नहीं करता।
- source_word: בַּת יְרוּשָׁלָם
  choice: यरूशलेम की पुत्री
  rationale: मूल का काव्यात्मक स्त्री-व्यक्तिकरण बनाए रखा गया है; हिन्दी में ‘यरूशलेम की पुत्री’ अर्थबोध और गरिमा दोनों बनाए रखता है।
- source_word: הֲזֹאת הָעִיר
  choice: क्या यही वह नगर है
  rationale: यह तिरस्कार से भरा आलंकारिक प्रश्न है। ‘यही वह नगर’ उसके पूर्व यश और वर्तमान दशा के विरोध को स्पष्ट करता है।
- source_word: שֶׁיֹּאמְרוּ
  choice: जिसे लोग ... कहते थे
  rationale: यह नगर के प्रचलित और स्मरण किए जा रहे पुराने वर्णन को दर्शाता है। हिन्दी का अपूर्ण भूतकाल ‘कहते थे’ उस चरितार्थ प्रतिष्ठा को स्वाभाविक रूप से व्यक्त करता है।
- source_word: כְּלִילַת יֹפִי
  choice: सौंदर्य की परिपूर्णता
  rationale: כְּלִילַת में पूर्णता या समग्रता का भाव है। संज्ञात्मक रचना मूल की काव्यात्मक ऊँचाई को बनाए रखती है; विशेषणात्मक विकल्प पादटिप्पणी में दिया गया है।
- source_word: מָשׂוֹשׂ לְכָל הָאָרֶץ
  choice: सारी पृथ्वी का आनंद
  rationale: यह व्यापक हर्ष या उल्लास की संज्ञात्मक अभिव्यक्ति है। अनुवाद मूल के सार्वभौमिक विस्तार और काव्यात्मक संक्षिप्तता को सुरक्षित रखता है।
