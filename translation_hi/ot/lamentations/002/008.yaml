source:
  edition: WLC
  text: חָשַׁ֨ב יְהוָ֤ה לְ/הַשְׁחִית֙ חוֹמַ֣ת בַּת צִיּ֔וֹן נָ֣טָה קָ֔ו לֹא הֵשִׁ֥יב יָד֖/וֹ מִ/בַּלֵּ֑עַ וַ/יַּֽאֲבֶל חֵ֥ל וְ/חוֹמָ֖ה יַחְדָּ֥ו אֻמְלָֽלוּ׀־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/002/008.yaml
  text: Yahweh determined to destroy the wall of daughter Zion[a]; he stretched out a measuring line; he did not hold back his hand from swallowing up, and he made rampart and wall mourn[b]; together they languish.
translation:
  language: hi
  text: 'याहवे ने बेटी सिय्योन की शहरपनाह नष्ट करने का निश्चय किया।


    उसने नापने की डोरी तानी;


    उसने निगलने से अपना हाथ नहीं रोका।[a]


    उसने बाहरी परकोटे और शहरपनाह को शोकाकुल कर दिया;


    वे दोनों साथ-साथ क्षीण हो गए।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘निगलने’ का अर्थ यहाँ पूरी तरह भस्म या नष्ट कर देने का सजीव चित्र है। इसका अनुवाद ‘उसने भस्म करने से अपना हाथ पीछे नहीं खींचा’ भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: חָשַׁב
  choice: निश्चय किया था
  rationale: यह क्रिया यहाँ न्याय के लिए याहवे के सोच-विचार से किए गए दृढ़ संकल्प को व्यक्त करती है; ‘निश्चय किया था’ स्वाभाविक हिन्दी में उस आशय को बनाए रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय हिन्दी लिप्यंतरण में रखा गया है।
- source_word: לְהַשְׁחִית
  choice: नष्ट करने
  rationale: हिफ़ील रूप सक्रिय रूप से विनाश करने का अर्थ देता है; ‘नष्ट करने’ सीधा और संदर्भानुकूल है।
- source_word: חוֹמַת בַּת צִיּוֹן
  choice: सिय्योन-बेटी की शहरपनाह
  rationale: यह रूप सिय्योन के स्त्री-व्यक्तिकरण को बनाए रखता है और हिन्दी में स्वामित्व-संबंध को स्पष्ट करता है।
- source_word: נָטָה קָו
  choice: नापने की डोरी तानी
  rationale: कָו नापने की डोरी है; यहाँ यह विनाश की सोची-समझी और मापी हुई कार्रवाई का चित्र प्रस्तुत करती है।
- source_word: לֹא הֵשִׁיב יָדוֹ מִבַּלֵּעַ
  choice: उसने निगलने से अपना हाथ नहीं रोका
  rationale: ‘हाथ न रोकना’ इब्रानी मुहावरे का स्वाभाविक हिन्दी रूप है, जबकि ‘निगलना’ विनाश की सजीव मूल उपमा को सुरक्षित रखता है।
- source_word: וַיַּאֲבֶל
  choice: उसने ... शोक में डुबो दिया
  rationale: संदर्भ में याहवे की कार्रवाई से किलेबंद संरचनाएँ शोक करती हुई चित्रित हैं; यह हिन्दी प्रयोग उस कारक भाव और व्यक्तिकरण को व्यक्त करता है।
- source_word: חֵל
  choice: बाहरी परकोटा
  rationale: यह शहरपनाह से अलग बाहरी रक्षात्मक संरचना या मिट्टी के बाँध को सूचित करता है; ‘बाहरी परकोटा’ सामान्य पाठक के लिए अपेक्षाकृत स्पष्ट है।
- source_word: וְחוֹמָה
  choice: शहरपनाह
  rationale: यह नगर की मुख्य रक्षात्मक दीवार है और חֵל से इसका भेद बनाए रखना आवश्यक है।
- source_word: יַחְדָּו אֻמְלָלוּ
  choice: वे दोनों साथ-साथ निर्बल हो गए
  rationale: יַחְדָּו दोनों संरचनाओं की साझा दशा बताता है और אֻמְלָלוּ उनके क्षीण अथवा शक्तिहीन हो जाने को; व्यक्तिकरण हिन्दी में भी बना रहता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: प्रभु
  rationale: मूल पाठ व्यक्तिगत वाचा-नाम का प्रयोग करता है। ‘याहवे’ उस नाम को सुरक्षित रखता है और उसे उपाधि में परिवर्तित नहीं करता।
- issue: विनाश में याहवे की भूमिका
  choice: याहवे के निश्चय और सक्रिय कार्य को स्पष्ट रखा गया
  alternative: निष्क्रिय अथवा अस्पष्ट विनाश-वर्णन
  rationale: मूल में חָשַׁב, לְהַשְׁחִית, לֹא הֵשִׁיב יָדוֹ और וַיַּאֲבֶל याहवे को संकल्प करने और कार्य करने वाला बताती हैं; इस कठोर धार्मिक तनाव को नरम नहीं किया गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और काव्यात्मक रखी गई है। ‘सिय्योन-बेटी’ नगर के इब्रानी स्त्री-व्यक्तिकरण को बनाए रखता है। ‘बाहरी परकोटा’ और ‘शहरपनाह’ दो अलग रक्षात्मक संरचनाओं का भेद स्पष्ट करते हैं। मूल में ‘शहरपनाह’ के लिए दोहराव जानबूझकर सुरक्षित है।
