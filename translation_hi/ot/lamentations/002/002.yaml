id: LAM.2.2
reference: Lamentations 2:2
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: בִּלַּ֨ע אֲדֹנָ֜/י לא חָמַ֗ל אֵ֚ת כָּל נְא֣וֹת יַעֲקֹ֔ב הָרַ֧ס בְּ/עֶבְרָת֛/וֹ מִבְצְרֵ֥י בַת יְהוּדָ֖ה הִגִּ֣יעַ לָ/אָ֑רֶץ חִלֵּ֥ל מַמְלָכָ֖ה וְ/שָׂרֶֽי/הָ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/002/002.yaml
  text: The Lord has swallowed up[a], without pity, all the pastures of Jacob; in his wrath he has torn down the strongholds of daughter Judah; he has brought them down to the ground[c][b]; he has defiled the kingdom and its princes.
translation:
  language: hi
  text: 'प्रभु ने दया किए बिना याकूब के सभी निवास-स्थलों[a] को निगल लिया है;


    अपने प्रचंड क्रोध में उसने यहूदा की बेटी[b] के गढ़ ढा दिए हैं,


    उन्हें भूमि पर गिरा दिया है;


    उसने राज्य और उसके हाकिमों को अपवित्र[c] कर दिया है।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “याकूब के सभी चरागाहों।” इब्रानी शब्द चरागाहों, सुखद निवासों या बस्तियों के लिए प्रयुक्त हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: “यहूदा की बेटी” यहूदा के लोगों या देश का काव्यात्मक मानवीकरण है।
    reason: cultural_note
  - marker: c
    text: या “राज्य और उसके हाकिमों का अनादर किया।”
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּלַּע
  choice: निगल लिया है
  rationale: मूल क्रिया निगलने या ग्रस लेने का सजीव रूपक रखती है; सामान्य ‘नष्ट कर दिया’ इस काव्यात्मक तीव्रता को कम कर देता।
- source_word: אֲדֹנָי
  choice: प्रभु
  rationale: यहाँ परमेश्वर की उपाधि अदोनाय है, चार अक्षरों वाला विशिष्ट नाम YHWH नहीं; इसलिए इसे स्वाभाविक हिन्दी उपाधि ‘प्रभु’ से व्यक्त किया गया है।
- source_word: לֹא חָמַל
  choice: दया किए बिना
  rationale: यह पद दया न करने और न बख्शने—दोनों का भाव दे सकता है। ‘दया किए बिना’ संक्षिप्त और भावपूर्ण है।
- source_word: נְאוֹת יַעֲקֹב
  choice: याकूब के सभी निवास-स्थल
  rationale: נְאוֹת चरागाहों के साथ-साथ निवासों या बस्तियों को भी दर्शा सकता है। गढ़ों और राज्य के प्रसंग में ‘निवास-स्थल’ अधिक स्वाभाविक है; ‘चरागाह’ को पाद-टिप्पणी में सुरक्षित रखा गया है।
- source_word: הָרַס
  choice: ढा दिए हैं
  rationale: क्रिया का अर्थ किसी निर्माण या किलेबंदी को तोड़कर गिराना है; ‘ढा दिए’ गढ़ों के साथ सटीक और स्वाभाविक है।
- source_word: בְּעֶבְרָתוֹ
  choice: अपने प्रचंड क्रोध में
  rationale: עֶבְרָה तीव्र रोष या प्रकोप को व्यक्त करता है। ‘प्रचंड क्रोध’ आधुनिक हिन्दी में इसकी तीव्रता बनाए रखता है।
- source_word: מִבְצְרֵי
  choice: गढ़
  rationale: यह शब्द किलों या किलेबंद स्थानों के लिए है। ‘गढ़’ संक्षिप्त, काव्यात्मक और आसानी से समझ में आने वाला है।
- source_word: בַת יְהוּדָה
  choice: बेटी यहूदा
  rationale: शाब्दिक काव्यात्मक व्यक्तित्व-चित्रण को सुरक्षित रखा गया है, जिसमें यहूदा को एक बेटी के रूप में संबोधित किया गया है; अर्थ पाद-टिप्पणी में स्पष्ट है।
- source_word: הִגִּיעַ לָאָרֶץ
  choice: उन्हें भूमि पर गिरा दिया है
  rationale: हिफ़ील रूप का आशय गढ़ों को भूमि तक पहुँचा देना, अर्थात धराशायी करना है। हिन्दी में स्पष्टता के लिए ‘उन्हें’ जोड़ा गया है।
- source_word: חִלֵּל
  choice: अपवित्र कर दिया है
  rationale: पिएल रूप पवित्रता भंग करने, अपवित्र करने या अनादर करने का भाव देता है। ‘अपवित्र’ धार्मिक और राजकीय अवमानना की गंभीरता बनाए रखता है।
- source_word: מַמְלָכָה
  choice: राज्य
  rationale: संदर्भ में यह राजसत्ता या राज्य-व्यवस्था को दर्शाता है; हाकिमों के साथ समानांतर प्रयोग ‘राज्य’ का समर्थन करता है।
- source_word: וְשָׂרֶיהָ
  choice: और उसके हाकिमों
  rationale: שׂרים राजकुमारों, शासकों या उच्च अधिकारियों को दर्शा सकता है। ‘हाकिम’ राजनीतिक अधिकार को स्पष्ट रखते हुए सामान्य पाठक के लिए सुबोध है।
theological_decisions:
- issue: ईश्वरीय उपाधि אֲדֹנָי का अनुवाद
  choice: प्रभु
  alternative: मालिक
  rationale: मूल पाठ में अदोनाय उपाधि है, YHWH नाम नहीं। ‘प्रभु’ आधुनिक हिन्दी बाइबिलीय भाषा में स्वाभाविक, गरिमापूर्ण और उपाधि के रूप में स्पष्ट है।
- issue: बेटी यहूदा का काव्यात्मक व्यक्तित्व-चित्रण
  choice: बेटी यहूदा
  alternative: यहूदा की बेटी
  rationale: मूल अभिव्यक्ति यहूदा के लोगों/देश को स्त्री रूप में प्रस्तुत करती है। ‘बेटी यहूदा’ उस प्रत्यक्ष काव्यात्मक तनाव को बनाए रखता है, जबकि पाद-टिप्पणी इसे किसी व्यक्तिगत बेटी के रूप में समझे जाने से रोकती है।
- issue: חִלֵּל में अपवित्रीकरण और अनादर का संबंध
  choice: अपवित्र कर दिया
  alternative: अनादर किया
  rationale: मूल क्रिया में धार्मिक अपवित्रीकरण का प्रबल भाव है, किंतु राजकीय अपमान भी संभव है। मुख्य पाठ में ‘अपवित्र’ और पाद-टिप्पणी में वैकल्पिक भाव देकर दोनों आयाम सुरक्षित रखे गए हैं।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और विलाप-काव्य के अनुरूप रखी गई है। पंक्ति-विन्यास इब्रानी समानांतरता को उभारता है। ‘निगल लिया’, ‘गढ़ ढा दिए’ और ‘भूमि पर गिरा दिया’ जैसे ठोस बिंब सुरक्षित हैं; दुर्लभ शब्दों के स्थान पर सामान्य किन्तु ऊँचे काव्यात्मक रजिस्टर का प्रयोग किया गया है।
