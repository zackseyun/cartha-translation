  text: וַ/יַּחְמֹ֤ס כַּ/גַּן֙ שֻׂכּ֔/וֹ שִׁחֵ֖ת מוֹעֲד֑/וֹ שִׁכַּ֨ח יְהוָ֤ה בְּ/צִיּוֹן֙ מוֹעֵ֣ד וְ/שַׁבָּ֔ת וַ/יִּנְאַ֥ץ בְּ/זַֽעַם אַפּ֖/וֹ מֶ֥לֶךְ וְ/כֹהֵֽן׀־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/002/006.yaml
  text: He has laid waste his shelter like a garden[a]; he has destroyed his appointed meeting place. Yahweh has caused appointed feast and Sabbath to be forgotten in Zion[c][b], and in the indignation of his anger he has spurned king and priest.
translation:
  language: hi
  text: उसने अपने आश्रय को बगीचे के समान उजाड़ दिया[a]; उसने अपने नियत सभा-स्थान को नष्ट कर दिया[b]। यहोवा ने सिय्योन में नियत पर्व और सब्त को विस्मृत करा दिया[c], और अपने प्रचंड क्रोध में राजा और याजक को ठुकराया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘उसका मंडप’ अथवा ‘उसका छप्पर’। इब्रानी शब्द किसी आश्रय, मंडप या आड़ को सूचित कर सकता है; यहाँ सटीक चित्र विवादित है।
    reason: lexical_alternative
  - marker: b
    text: या ‘उसका नियत मिलन-स्थान’; संभवतः ‘उसका मिलाप-तंबू’। यह इब्रानी शब्द आगे ‘नियत पर्व’ अनूदित शब्द से संबंधित है।
    reason: lexical_alternative
  - marker: c
    text: ‘नियत पर्व’ का अनुवाद ‘नियत समय’ या ‘उत्सव’ भी हो सकता है। यहाँ ‘सब्त’ के साथ होने से नियत पर्वों का अर्थ अधिक संभावित है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּחְמֹס
  choice: उजाड़ दिया
  rationale: पिएल रूप यहाँ हिंसक विनाश का बोध कराता है; ‘उजाड़ दिया’ स्वाभाविक हिन्दी में उस विनाशकारी बल को व्यक्त करता है।
- source_word: כַּגַּן
  choice: बगीचे के समान
  rationale: मूल पाठ की स्पष्ट उपमा को बनाए रखता है, भले ही उसका सटीक आशय विवादित हो।
- source_word: שֻׂכּוֹ
  choice: अपने आश्रय को
  rationale: यह शब्द छप्पर, मंडप या आड़ का अर्थ दे सकता है। ‘आश्रय’ पर्याप्त व्यापक है और अनावश्यक तकनीकी धार्मिक अर्थ नहीं जोड़ता।
- source_word: שִׁחֵת
  choice: नष्ट कर दिया
  rationale: सिय्योन और उसके उपासना-संबंधी संस्थानों के ठोस विनाश के संदर्भ में यह सीधा और उपयुक्त है।
- source_word: מוֹעֲדוֹ
  choice: अपने नियत सभा-स्थान को
  rationale: ‘नष्ट कर दिया’ के कर्म के रूप में यहाँ स्थानवाचक अर्थ अधिक संगत है। इससे अगले खंड में इसी शब्द के पर्ववाचक प्रयोग के साथ काव्यात्मक शब्द-संबंध भी बना रहता है।
- source_word: שִׁכַּח
  choice: भुला दिया
  rationale: हिफ़ील का कारणवाचक भाव है—यहोवा ने पर्व और सब्त का पालन/स्मरण लुप्त करा दिया। हिन्दी में ‘भुला दिया’ इसे संक्षेप और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: मूल में आए परमेश्वर के व्यक्तिगत नाम को हिन्दी में प्रचलित प्रतिलेखन ‘यहोवा’ से प्रस्तुत किया गया है, किसी पदवी से प्रतिस्थापित नहीं किया गया।
- source_word: בְּצִיּוֹן
  choice: सिय्योन में
  rationale: सीधा स्थानवाचक अनुवाद।
- source_word: מוֹעֵד
  choice: नियत पर्व
  rationale: सब्त के साथ युग्मित होने के कारण यहाँ नियत धार्मिक उत्सव या पर्व का अर्थ प्रमुख है।
- source_word: וְשַׁבָּת
  choice: और सब्त को
  rationale: मूल के धार्मिक विश्राम-दिवस का मानक हिन्दी रूप।
- source_word: וַיִּנְאַץ
  choice: तुच्छ ठहराया
  rationale: क्रिया केवल अस्वीकार नहीं, बल्कि तिरस्कारपूर्वक ठुकराने का भाव रखती है; ‘तुच्छ ठहराया’ उस अवमानना को व्यक्त करता है।
- source_word: בְּזַעַם אַפּוֹ
  choice: अपने प्रचंड क्रोध में
  rationale: दोनों क्रोध-सूचक संज्ञाओं की तीव्रता को स्वाभाविक आधुनिक हिन्दी में समेटता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: व्यक्तिगत वाचा-नाम को पदवी ‘प्रभु’ से बदलने के बजाय हिन्दी पाठकों के बीच स्थापित प्रतिलेखन ‘यहोवा’ रखा गया है।
- issue: पहले מוֹעֲדוֹ का अर्थ
  choice: स्थानवाचक—‘उसका नियत सभा-स्थान’
  alternative: काल/पर्ववाचक—‘उसका नियत समय/पर्व’; अथवा तकनीकी—‘मिलापवाला तम्बू’
  rationale: यह ‘नष्ट कर दिया’ का कर्म है, जबकि अगले खंड में מוֹעֵד सब्त के साथ पर्ववाचक है। स्थानवाचक अर्थ वाक्य-संरचना और काव्यात्मक द्विअर्थता दोनों को सुरक्षित रखता है।
- issue: שֻׂכּוֹ का उपासना-स्थल से संबंध
  choice: व्यापक शब्द ‘आश्रय’
  alternative: ‘मंडप’, ‘छप्पर’ या ‘निवास-मंडप’
  rationale: संदर्भ मंदिर या पवित्र निवास की ओर संकेत कर सकता है, पर शब्द स्वयं सटीक तकनीकी पहचान अनिवार्य नहीं करता; इसलिए अस्पष्टता बनाए रखी गई है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए बोधगम्य हिन्दी। काव्यात्मक समानांतरता तथा ‘नियत सभा-स्थान/नियत पर्व’ के शब्द-संबंध को बनाए रखा गया है। कठिन उपमा और बहुअर्थी उपासना-संबंधी पदों को पादटिप्पणियों में खुला रखा गया है।
