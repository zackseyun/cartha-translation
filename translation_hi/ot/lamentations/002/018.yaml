  text: צָעַ֥ק לִבָּ֖/ם אֶל אֲדֹנָ֑/י חוֹמַ֣ת בַּת צִ֠יּוֹן הוֹרִ֨ידִי כַ/נַּ֤חַל דִּמְעָה֙ יוֹמָ֣ם וָ/לַ֔יְלָה אַֽל תִּתְּנִ֤י פוּגַת֙ לָ֔/ךְ אַל תִּדֹּ֖ם בַּת עֵינֵֽ/ךְ־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/002/018.yaml
  text: 'Their heart cried out to the Lord[a], O wall of daughter Zion: let tears run down like a stream day and night; give yourself no relief[c][b]; let not the apple of your eye rest.'
translation:
  language: hi
  text: 'उनका हृदय प्रभु की ओर पुकार उठा, हे बेटी सिय्योन की शहरपनाह: दिन-रात अपने आँसू धारा के समान बहने दे; अपने को तनिक भी चैन न दे; अपनी आँख की पुतली को विश्राम न लेने दे।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: צָעַק לִבָּם
  choice: उनका हृदय ... पुकार उठा
  rationale: इब्रानी में ‘हृदय’ एकवचन और संबंधसूचक प्रत्यय बहुवचन है; सामूहिक हृदय की सजीव छवि बनाए रखने के लिए हिंदी में भी एकवचन रखा गया। ‘पुकार उठा’ तीव्र पुकार को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: אֶל אֲדֹנָי
  choice: प्रभु की ओर
  rationale: אֲדֹנָי यहाँ इस्राएल के परमेश्वर के लिए प्रयुक्त दैवी उपाधि है। אֶל का दिशात्मक भाव ‘की ओर’ से स्पष्ट होता है।
- source_word: חוֹמַת בַּת צִיּוֹן
  choice: हे सिय्योन की बेटी की शहरपनाह
  rationale: इसे प्रत्यक्ष संबोधन माना गया है। ‘शहरपनाह’ חוֹמָה की नगरीय रक्षात्मक दीवार का अधिक सटीक और प्रतिष्ठित हिंदी रूप है, और ‘सिय्योन की बेटी’ नगर के मानवीकरण को बनाए रखता है।
- source_word: הוֹרִידִי כַנַּחַל דִּמְעָה
  choice: अपने आँसू धारा के समान बहने दे
  rationale: हिफ़ील स्त्रीलिंग आज्ञार्थक को संबोधित पात्र के अनुरूप रखा गया है। נַחַל के प्रवाह-बिंब के लिए ‘धारा’ स्वाभाविक है; सामूहिक एकवचन ‘आँसू’ हिंदी में बहुवचन रूप में सहज है।
- source_word: יוֹמָם וָלַיְלָה
  choice: दिन-रात
  rationale: निरंतरता व्यक्त करने वाले इस युग्म का संक्षिप्त और स्वाभाविक हिंदी समतुल्य।
- source_word: אַל תִּתְּנִי פוּגַת לָךְ
  choice: अपने को तनिक भी चैन न दे
  rationale: פוּגָה का आशय विराम, राहत या मोहलत है। ‘तनिक भी चैन न दे’ अनवरत विलाप को स्वाभाविक हिंदी में व्यक्त करता है, बिना इसे विशेष रूप से नींद का अर्थ दिए।
- source_word: אַל תִּדֹּם בַּת עֵינֵךְ
  choice: अपनी आँख की पुतली को विश्राम न लेने दे
  rationale: ‘आँख की बेटी’ इब्रानी मुहावरा पुतली/आँख के लिए है। ‘आँख की पुतली’ हिंदी में स्पष्ट है; ‘विश्राम न लेने दे’ आँसुओं के न थमने की काव्यात्मक छवि बनाए रखता है।
theological_decisions:
- issue: दैवी उपाधि אֲדֹנָי का अनुवाद
  choice: प्रभु
  alternative: मेरे प्रभु
  rationale: संदर्भ में यह इस्राएल के परमेश्वर की उपाधि है। मसोराई पाठ में प्रथम पुरुष स्वामित्व का अर्थ हिंदी में जोड़ना उचित नहीं; ‘प्रभु’ दैवी उपाधि को स्पष्ट और परंपरागत रूप से व्यक्त करता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और काव्यात्मक रखी गई है। ‘शहरपनाह’ सामान्य ‘दीवार’ से कुछ अधिक साहित्यिक है, पर प्राचीन नगर की रक्षात्मक दीवार का आशय ठीक व्यक्त करता है। इब्रानी के सामूहिक एकवचन ‘उनका हृदय’ तथा सिय्योन के मानवीकरण को जानबूझकर सुरक्षित रखा गया है।
