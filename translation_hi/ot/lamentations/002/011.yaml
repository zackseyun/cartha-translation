id: LAM.2.11
reference: Lamentations 2:11
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: כָּל֨וּ בַ/דְּמָע֤וֹת עֵינַ/י֙ חֳמַרְמְר֣וּ מֵעַ֔/י נִשְׁפַּ֤ךְ לָ/אָ֨רֶץ֙ כְּבֵדִ֔/י עַל שֶׁ֖בֶר בַּת עַמִּ֑/י בֵּֽ/עָטֵ֤ף עוֹלֵל֙ וְ/יוֹנֵ֔ק בִּ/רְחֹב֖וֹת קִרְיָֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/002/011.yaml
  text: My eyes are spent with tears[a]; my inward parts churn; my liver is poured out to the earth because of the destruction of the daughter of my people[d][c][b], because infant and nursing child faint in the streets of the city.
translation:
  language: hi
  text: मेरी आँखें आँसू बहाते-बहाते चुक गई हैं; मेरी अंतड़ियाँ मरोड़ खा रही हैं। मेरा जिगर धरती पर उँडेल दिया गया है[a], मेरी प्रजा की बेटी के विनाश के कारण[b], क्योंकि नगर की गलियों में छोटे बच्चे और दूध पीते शिशु मूर्छित हो रहे हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप में, “मेरा जिगर धरती पर उँडेल दिया गया है।” यह गहरे शोक और टूट जाने का प्रबल देहगत बिंब है।
    reason: cultural_note
  - marker: b
    text: “मेरी प्रजा की बेटी” इब्रानी काव्य में प्रजा अथवा उसके नगर को एक स्त्री के रूप में प्रस्तुत करने वाली अभिव्यक्ति है। “विनाश” के स्थान पर “चकनाचूर हो जाना” या “टूट जाना” भी कहा जा सकता है।
    reason: cultural_note_and_lexical_alternative
lexical_decisions:
- source_word: כָּלוּ בַדְּמָעוֹת עֵינַי
  choice: मेरी आँखें आँसू बहाते-बहाते चुक गई हैं
  rationale: כָּלוּ आँखों के थककर चुक जाने का बिंब देता है; हिन्दी में यह वाक्यांश आँसुओं के कारण हुई शारीरिक क्षीणता को स्वाभाविक ढंग से रखता है।
- source_word: חֳמַרְמְרוּ מֵעַי
  choice: मेरी अंतड़ियाँ मथ रही हैं
  rationale: दुर्लभ क्रिया तीव्र आंतरिक उथल-पुथल बताती है। 'अंतड़ियाँ' मूल के देहगत बिंब को बनाए रखता है और 'मथ रही हैं' उसकी व्याकुल गति व्यक्त करता है।
- source_word: נִשְׁפַּךְ לָאָרֶץ כְּבֵדִי
  choice: मेरे जिगर का रस धरती पर उँडेल दिया गया है
  rationale: כָּבֵד का सामान्य अर्थ 'जिगर' है। हिन्दी में केवल 'जिगर उँडेला गया' अस्वाभाविक है, इसलिए 'रस' जोड़कर अंग से निकलती जीवन-शक्ति और पूर्ण विघटन का ठोस रूपक सुरक्षित रखा गया है।
- source_word: עַל שֶׁבֶר
  choice: का विनाश हो गया है
  rationale: שֶׁבֶר का मूल बिंब टूटने या चकनाचूर होने का है, पर इस प्रसंग में सामुदायिक तबाही अभिप्रेत है; 'विनाश' इसे स्पष्ट और गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: בַּת עַמִּי
  choice: मेरी प्रजा की बेटी
  rationale: इब्रानी काव्य के स्त्री-व्यक्तित्वसूचक मुहावरे को समतल किए बिना शाब्दिक रूप में रखा गया है; टिप्पणी इसका आशय स्पष्ट करती है।
- source_word: בְּעָטֵף
  choice: मूर्छित हो रहे हैं
  rationale: क्रिया अभाव के कारण शक्ति चुकने, निढाल पड़ने या बेहोशी की ओर जाने का भाव देती है। 'मूर्छित हो रहे हैं' दृश्य की गंभीरता और प्रक्रिया दोनों रखता है।
- source_word: עוֹלֵל וְיוֹנֵק
  choice: नन्हे बच्चे और दूध पीते शिशु
  rationale: 'दोनों निकटवर्ती किन्तु अलग शब्दों का भेद रखा गया है: עוֹלֵל छोटा बच्चा और יוֹנֵק अब भी दूध पीने वाला शिशु है।'
- source_word: בִּרְחֹבוֹת קִרְיָה
  choice: नगर की गलियों में
  rationale: רְחֹבוֹת नगर के खुले मार्गों/चौकों को सूचित कर सकता है; इस प्रसंग में 'गलियों में' सार्वजनिक नगर-स्थल का स्वाभाविक हिन्दी रूप है।
theological_decisions:
- issue: देहगत शोक-बिंबों को भावार्थ में बदलना या बनाए रखना
  choice: अंतड़ियाँ और जिगर जैसे मूल देहगत बिंब बनाए रखे गए
  alternative: मन व्याकुल है; हृदय टूट गया है
  rationale: मूल पद तीव्र शोक को शरीर के भीतरी अंगों के माध्यम से व्यक्त करता है। उसे केवल मनोभाव में बदलने से विलाप की मूर्त तीव्रता और प्राचीन इब्रानी मानव-अनुभूति खो जाती।
- issue: בְּעָטֵף का संबंध
  choice: बच्चों के मूर्छित होने को विनाश और विलाप का कारण बताने के लिए दूसरा 'क्योंकि' रखा गया
  alternative: जब नगर की गलियों में बच्चे मूर्छित होते हैं
  rationale: निर्माण परिस्थिति या कारण दोनों व्यक्त कर सकता है। यहाँ कारणात्मक संबंध प्रसंग में स्वाभाविक है, पर टिप्पणी की आवश्यकता नहीं क्योंकि कालगत अर्थ कोई पृथक पाठ नहीं है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और काव्यात्मक रखी गई है। 'अंतड़ियाँ' और 'जिगर' जानबूझकर सुरक्षित हैं ताकि मूल की तीखी शारीरिक बिंबावली न मिटे; जहाँ सीधा शाब्दिक हिन्दी प्रयोग अस्वाभाविक था, वहाँ संक्षिप्त व्याख्यात्मक पूरक और पादटिप्पणी दी गई है।
