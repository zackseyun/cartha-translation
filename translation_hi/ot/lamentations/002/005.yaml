base_translation:
  language: en
  yaml_path: translation/ot/lamentations/002/005.yaml
  text: The Lord became like an enemy; he swallowed up Israel. He swallowed up all her palaces; he destroyed his strongholds[a], and he multiplied mourning and lamentation in Daughter Judah.
translation:
  language: hi
  text: प्रभु शत्रु के समान हो गया; उसने इस्राएल को निगल लिया। उसने उसके सभी महलों को निगल लिया; उसके गढ़ों[a] को नष्ट कर दिया, और यहूदा की बेटी में शोक और विलाप बढ़ा दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से ‘उसके गढ़’ के साथ पुल्लिंग एकवचन प्रत्यय है; कुछ अनुवाद पहले आए ‘उसके महलों’ के स्त्रीलिंग प्रत्यय से मेल बैठाने के लिए इसे स्त्रीलिंग अर्थ में लेते हैं। हिन्दी में ‘उसके’ से यह लिंगभेद प्रकट नहीं होता।
    reason: textual_variant
lexical_decisions:
- source_word: אֲדֹנָי
  choice: प्रभु
  rationale: यह परमेश्वर के प्रभुत्व को सूचित करने वाली उपाधि है; आधुनिक मानक हिन्दी में ‘प्रभु’ स्वाभाविक और प्रतिष्ठित समतुल्य है।
- source_word: הָיָה ... כְּאוֹיֵב
  choice: शत्रु के समान हो गया है
  rationale: כְּ के स्पष्ट तुलनात्मक अर्थ को सुरक्षित रखते हुए यह वाक्य न्याय के प्रसंग में बदली हुई मुद्रा का भाव व्यक्त करता है, पर प्रभु को तत्त्वतः शत्रु नहीं ठहराता।
- source_word: בִּלַּע
  choice: निगल लिया
  rationale: मूल क्रिया के निगलने वाले सजीव रूपक और उसके संपूर्ण विनाश के भाव, दोनों को बनाए रखता है।
- source_word: יִשְׂרָאֵל
  choice: इस्राएल
  rationale: व्यक्तिवाचक नाम का प्रचलित हिन्दी लिप्यंतरण।
- source_word: כָּל אַרְמְנוֹתֶיהָ
  choice: उसके सभी महलों
  rationale: אַרְמוֹן के सामान्य अर्थ ‘महल’ और स्त्रीलिंग एकवचन प्रत्यय को हिन्दी के संदर्भानुकूल ‘उसके’ से व्यक्त किया गया है।
- source_word: שִׁחֵת
  choice: नष्ट कर दिया
  rationale: विनाश के संदर्भ में क्रिया का स्पष्ट, सशक्त और सहज हिन्दी रूप।
- source_word: מִבְצָרָיו
  choice: उसके गढ़ों
  rationale: מִבְצָר के लिए ‘गढ़’ स्वाभाविक है। मसोराई पाठ के पुल्लिंग एकवचन प्रत्यय की वास्तविक अस्पष्टता हिन्दी के लिंग-निरपेक्ष संबंधसूचक ‘उसके’ में दिखाई नहीं देती, इसलिए पादटिप्पणी में स्पष्ट की गई है।
- source_word: וַיֶּרֶב
  choice: बढ़ा दिया
  rationale: हिफ़िल रूप की कारणवाचक शक्ति को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: בְּבַת יְהוּדָה
  choice: यहूदा की बेटी में
  rationale: नगर और लोगों के मानवीकरण वाले काव्यात्मक मुहावरे को सपाट ‘यहूदा’ बनाने के बजाय सुरक्षित रखता है।
- source_word: תַּאֲנִיָּה וַאֲנִיָּה
  choice: शोक और विलाप
  rationale: दो निकटार्थी संज्ञाओं की काव्यात्मक तीव्रता को स्वाभाविक और गरिमापूर्ण हिन्दी में बनाए रखता है।
theological_decisions:
- issue: तुलना को पहचान के रूप में प्रस्तुत किया जाए या उपमा के रूप में
  choice: प्रभु शत्रु के समान हो गया है
  alternative: प्रभु शत्रु हो गया है / प्रभु शत्रु के समान था
  rationale: इब्रानी में तुलनात्मक अव्यय כְּ स्पष्ट रूप से ‘समान’ का अर्थ देता है। अतः उपमा को बनाए रखना ईश्वरीय न्याय के तनाव को सुरक्षित रखता है और पाठ से अधिक नहीं कहता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, काव्यात्मक पर सुबोध और गरिमापूर्ण रखी गई है। ‘निगल लिया’ मूल रूपक को, और ‘यहूदा की बेटी’ मूल मानवीकरण को सुरक्षित रखते हैं।
