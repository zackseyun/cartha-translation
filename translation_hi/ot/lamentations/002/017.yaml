reference: Lamentations 2:17
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: עָשָׂ֨ה יְהוָ֜ה אֲשֶׁ֣ר זָמָ֗ם בִּצַּ֤ע אֶמְרָת/וֹ֙ אֲשֶׁ֣ר צִוָּ֣ה מִֽ/ימֵי קֶ֔דֶם הָרַ֖ס וְ/לֹ֣א חָמָ֑ל וַ/יְשַׂמַּ֤ח עָלַ֨יִ/ךְ֙ אוֹיֵ֔ב הֵרִ֖ים קֶ֥רֶן צָרָֽיִ/ךְ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/002/017.yaml
  text: Yahweh has done what he planned[a]; he has fulfilled his word, which he commanded from days of old. He has torn down and has not shown pity; he has made the enemy rejoice over you[c][b]; he has exalted the horn of your foes.
translation:
  language: hi
  text: याहवे ने वही किया जिसकी उसने योजना बनाई थी; उसने अपना वह वचन पूरा किया[a], जिसकी आज्ञा उसने प्राचीन काल में[b] दी थी। उसने ढा दिया और दया नहीं की; उसने ऐसा किया कि शत्रु तुम पर आनन्द मनाए; उसने तुम्हारे विरोधियों के सींग को ऊँचा उठाया[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “कार्यान्वित किया।”
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक अर्थ, “प्राचीन दिनों से,” अर्थात बहुत पहले।
    reason: lexical_alternative
  - marker: c
    text: बाइबल में “सींग” शक्ति, सामर्थ्य या प्रतिष्ठा का प्रतीक है।
    reason: cultural_note
lexical_decisions:
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय देवनागरी में लिप्यंतरित किया गया है।
- source_word: זָמָם
  choice: योजना बनाई थी
  rationale: यह सोचे-समझे उद्देश्य को व्यक्त करता है और न्याय की पूर्वनिश्चित योजना के सन्दर्भ में स्वाभाविक हिन्दी है।
- source_word: בִּצַּע אֶמְרָתוֹ
  choice: अपना वह वचन पूरा किया
  rationale: क्रिया किसी कही हुई बात को पूर्णतः कार्यान्वित करने का भाव रखती है; ‘पूरा किया’ वचन के साथ स्वाभाविक है, जबकि पादटिप्पणी क्रियान्वयन की वैकल्पिक छाया स्पष्ट करती है।
- source_word: אֲשֶׁר צִוָּה
  choice: जिसकी आज्ञा उसने … दी थी
  rationale: צִוָּה की आज्ञा देने वाली स्पष्ट क्रियाशक्ति को बनाए रखा गया है, इसे केवल ‘ठहराया’ या ‘कहा’ नहीं बनाया गया।
- source_word: מִימֵי קֶדֶם
  choice: प्राचीन काल में
  rationale: हिब्रू के ‘प्राचीन दिनों से’ कालसूचक मुहावरे को स्पष्ट और गरिमापूर्ण आधुनिक हिन्दी में व्यक्त करता है।
- source_word: הָרַס
  choice: ढा दिया
  rationale: नगर और उसकी संरचनाओं के विध्वंस का सजीव भाव रखता है।
- source_word: וְלֹא חָמָל
  choice: दया नहीं की
  rationale: करुणा न दिखाने के भाव को सीधे और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: וַיְשַׂמַּח עָלַיִךְ אוֹיֵב
  choice: उसने ऐसा किया कि शत्रु तुम पर आनन्द मनाए
  rationale: हिब्रू की कारक क्रिया और परमेश्वर की सक्रिय भूमिका को स्पष्ट रखता है, साथ ही हिन्दी की अस्वाभाविक अभिव्यक्ति ‘शत्रु को आनन्दित किया’ से बचता है।
- source_word: הֵרִים קֶרֶן
  choice: सींग ऊँचा किया
  rationale: शक्ति, सामर्थ्य और प्रतिष्ठा के बाइबलीय रूपक को व्याख्या से बदलने के बजाय सुरक्षित रखा गया है।
- source_word: צָרָיִךְ
  choice: तुम्हारे विरोधियों
  rationale: हिब्रू के बहुवचन को बनाए रखता है और पहले आए एकवचन ‘शत्रु’ से उचित भेद करता है।
theological_decisions:
- issue: यरूशलेम के विनाश में परमेश्वर की सक्रिय भूमिका
  choice: योजना बनाने, वचन पूरा करने, ढा देने, दया न करने, शत्रु को आनन्द मनाने की स्थिति देने और विरोधियों की शक्ति बढ़ाने में याहवे को स्पष्ट कर्ता रखा गया है।
  alternative: इन क्रियाओं को केवल परमेश्वर की निष्क्रिय अनुमति के रूप में नरम करना।
  rationale: हिब्रू पाठ लगातार याहवे को इन क्रियाओं का कर्ता बताता है। अनुवाद इस धर्मवैज्ञानिक तनाव को कम या हल नहीं करता।
- issue: ‘सींग’ का रूपक
  choice: रूपक को मुख्य पाठ में ‘सींग’ के रूप में रखा गया है और उसका आशय पादटिप्पणी में बताया गया है।
  alternative: मुख्य पाठ में इसे सीधे ‘शक्ति’ या ‘प्रतिष्ठा’ कहना।
  rationale: मूल काव्यात्मक बिम्ब को सुरक्षित रखना विलाप की भाषा और व्यापक बाइबलीय प्रतीक-परम्परा दोनों के प्रति अधिक निष्ठावान है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, काव्यात्मक किन्तु सामान्य पाठक के लिए स्पष्ट रखी गई है। यरूशलेम/सिय्योन को सम्बोधित हिब्रू स्त्रीलिंग एकवचन का हिन्दी ‘तुम’ में स्वाभाविक रूप से अनुवाद किया गया है। समानान्तर वाक्य-विन्यास और कठोर न्याय-भाषा को जानबूझकर बनाए रखा गया है।
