source:
  edition: WLC
  text: תִּקְרָא֩ כְ/י֨וֹם מוֹעֵ֤ד מְגוּרַ/י֙ מִ/סָּבִ֔יב וְ/לֹ֥א הָיָ֛ה בְּ/י֥וֹם אַף יְהוָ֖ה פָּלִ֣יט וְ/שָׂרִ֑יד אֲשֶׁר טִפַּ֥חְתִּי וְ/רִבִּ֖יתִי אֹיְבִ֥/י כִלָּֽ/ם־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/002/022.yaml
  text: You summoned my terrors from every side as on an appointed day[a], and on the day of Yahweh’s anger there was no survivor or remnant. Those whom I nurtured and raised[b], my enemy destroyed them.
translation:
  language: hi
  text: तूने नियत दिन की तरह मेरे चारों ओर के आतंकों को बुला लिया[a]; और यहोवा के क्रोध के दिन न कोई बच निकलनेवाला था, न कोई जीवित बचा था। जिन्हें मैंने दुलारा और पाला-पोसा, मेरे शत्रु ने उनका अंत कर दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “पर्व के दिन की तरह।” इब्रानी में चारों ओर के आतंकों के इकट्ठा होने की तुलना किसी नियत पर्व पर लोगों के इकट्ठा होने से की गई है। “मेरे आतंक” का अर्थ “जो मुझे चारों ओर से आतंकित करते हैं” भी समझा जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּקְרָא
  choice: तूने ... बुला लिए
  rationale: क्रिया का संबोधन यहोवा से है और यहाँ शत्रुतापूर्ण भयावहताओं को एकत्र होने के लिए बुलाने का भाव है। हिंदी में यह प्रयोग स्वाभाविक रहते हुए मूल बिंब बनाए रखता है।
- source_word: כְיוֹם מוֹעֵד
  choice: नियत दिन की तरह
  rationale: מוֹעֵד किसी ठहराए हुए समय या पर्व-सभा का दिन हो सकता है। मुख्य पाठ व्यापक अर्थ रखता है और पर्व-दिवस की विडंबनापूर्ण तुलना पादटिप्पणी में स्पष्ट की गई है।
- source_word: מְגוּרַי מִסָּבִיב
  choice: चारों ओर से मेरे भय
  rationale: מְגוּרַי को संदर्भानुसार भय या आतंक उत्पन्न करने वाली विपत्तियों के रूप में लिया गया है; מִסָּבִיב घिर जाने का स्थानिक भाव देता है।
- source_word: בְּיוֹם אַף יְהוָה
  choice: यहोवा के क्रोध के दिन
  rationale: אַף यहाँ क्रोध को सूचित करता है और יהוה को उसके व्यक्तिवाचक वाचा-नाम ‘यहोवा’ से प्रस्तुत किया गया है।
- source_word: פָּלִיט וְשָׂרִיד
  choice: न कोई बच निकला, न कोई जीवित बचा
  rationale: 'दोनों निकटार्थी संज्ञाओं का अंतर रखा गया है: पहला संकट से निकल भागने वाले और दूसरा विनाश के बाद जीवित बचे व्यक्ति की ओर संकेत करता है। निषेध के साथ हिंदी में ‘न...न...’ स्वाभाविक है।'
- source_word: טִפַּחְתִּי וְרִבִּיתִי
  choice: मैंने दुलारा और पाला-पोसा
  rationale: पहली क्रिया बच्चों की कोमल देखभाल और दूसरी उनके पालन-पोषण का भाव देती है। यह युग्म मातृसुलभ शोक को सहज आधुनिक हिंदी में व्यक्त करता है।
- source_word: אֹיְבִי כִלָּם
  choice: मेरे शत्रु ने उनका अंत कर दिया
  rationale: एकवचन प्रत्यय के कारण ‘मेरे शत्रु’ रखा गया है। פיעל כלה पूर्ण विनाश या समाप्त कर देने को बताता है; ‘अंत कर दिया’ गंभीर और स्पष्ट है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ में चतुरक्षरीय व्यक्तिवाचक नाम सीधे आया है। आधुनिक हिंदी बाइबलीय प्रयोग में व्यापक रूप से पहचाने जाने वाले ‘यहोवा’ से नाम का स्वरूप बनाए रखा गया है, उसे ‘प्रभु’ पदवी से नहीं बदला गया।
- issue: वक्ता और संबोधित का संबंध
  choice: एकवचन निकट संबोधन ‘तूने’
  alternative: आदरार्थी ‘आपने’
  rationale: हिब्रू में क्रिया द्वितीय पुरुष पुल्लिंग एकवचन है और विलाप की सीधी, तीखी प्रार्थनात्मक वाणी है। ‘तू’ निकटता और काव्यात्मक प्रत्यक्षता रखता है, अनादर का सिद्धांतगत अर्थ आरोपित नहीं करता।
- issue: מְגוּרַי की पहचान
  choice: मेरे भय
  alternative: मुझे आतंकित करने वाले
  rationale: रूप अमूर्त ‘भय/आतंक’ अथवा उन्हें उत्पन्न करने वालों की ओर समझा जा सकता है। मुख्य पाठ निकटतम शाब्दिक अर्थ रखता है और वैकल्पिक मानवीय अभिकर्ता पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। विलाप की काव्यात्मक तीव्रता के लिए प्रत्यक्ष एकवचन संबोधन, समानांतर ‘न...न...’ रचना और पालन-पोषण की कोमल शब्दावली अपनाई गई है। मुख्य पाठ में [a] का चिह्न उपस्थित है और पादटिप्पणी वास्तविक शब्दार्थगत अस्पष्टताओं को सुरक्षित रखती है।
