id: LAM.2.20
reference: Lamentations 2:20
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: רְאֵ֤ה יְהוָה֙ וְֽ/הַבִּ֔יטָ/ה לְ/מִ֖י עוֹלַ֣לְתָּ כֹּ֑ה אִם תֹּאכַ֨לְנָה נָשִׁ֤ים פִּרְיָ/ם֙ עֹלֲלֵ֣י טִפֻּחִ֔ים אִם יֵהָרֵ֛ג בְּ/מִקְדַּ֥שׁ אֲדֹנָ֖/י כֹּהֵ֥ן וְ/נָבִֽיא־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/002/020.yaml
  text: Look[a], O Yahweh, and see—to whom have you done this? Should women eat their offspring[b], the children they have cared for? Should priest and prophet be killed in the sanctuary of the Lord?
translation:
  language: hi
  text: हे यहोवा, देख और निहार—तूने किसके साथ ऐसा किया है? क्या स्त्रियाँ अपनी ही सन्तान[a], उन नन्हे बच्चों को जिन्हें उन्होंने दुलार से पाला है[b], खाएँ? क्या प्रभु के पवित्रस्थान में याजक और भविष्यद्वक्ता मार डाले जाएँ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक अर्थ: “अपना फल,” अर्थात अपनी ही सन्तान।'
    reason: lexical_alternative
  - marker: b
    text: या “वे नन्हे बच्चे जिन्हें उन्होंने गोद में खिलाया है” अथवा “दुलार से पाला है।”
    reason: lexical_alternative
lexical_decisions:
- source_word: רְאֵה ... וְהַבִּיטָה
  choice: देख और ध्यान दे
  rationale: दोनों आज्ञार्थक क्रियाओं को अलग रखते हुए विनती की तीव्रता और समानांतरता सुरक्षित की गई है; आधुनिक हिन्दी में यह स्वाभाविक और गरिमापूर्ण है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: इब्रानी परमेश्वर-नाम को हिन्दी में प्रचलित लिप्यंतरण से व्यक्त किया गया है और इसे אֲדֹנָי की उपाधि से अलग रखा गया है।
- source_word: לְמִי עוֹלַלְתָּ כֹּה
  choice: तूने किसके साथ ऐसा किया है?
  rationale: לְמִי को यहाँ कार्रवाई से प्रभावित व्यक्ति के अर्थ में लिया गया है; 'किसके साथ ऐसा किया' हिन्दी में विपत्ति और विरोध का भाव स्वाभाविक रूप से देता है।
- source_word: אִם תֹּאכַלְנָה
  choice: क्या ... खाएँ?
  rationale: אִם यहाँ शर्त नहीं बल्कि भय और नैतिक आघात व्यक्त करने वाला प्रश्न आरम्भ करता है।
- source_word: פִּרְיָם
  choice: अपनी ही सन्तान
  rationale: शाब्दिक अर्थ 'उनका फल' है, पर प्रसंग में यह अपनी कोख की सन्तान का मुहावरा है; मुख्य पाठ में अर्थ स्पष्ट और स्वाभाविक रखा गया है।
- source_word: עֹלֲלֵי טִפֻּחִים
  choice: उन नन्हे बच्चों को जिन्हें उन्होंने गोद में खिलाया है
  rationale: עֹלֲלֵי छोटे बच्चों को और טִפֻּחִים दुलारपूर्वक गोद में पालने-खिलाने को सूचित करता है; हिन्दी वाक्य दोनों पक्षों को व्यक्त करता है।
- source_word: אִם יֵהָרֵג
  choice: क्या ... मार डाले जाएँ?
  rationale: दूसरे אִם को भी समान रूप से भयपूर्ण आलंकारिक प्रश्न माना गया है और इब्रानी कर्मवाच्य सुरक्षित रखा गया है।
- source_word: בְּמִקְדַּשׁ
  choice: पवित्रस्थान में
  rationale: מִקְדָּשׁ का अर्थ पवित्र स्थान या sanctuary है; संयुक्त हिन्दी रूप धार्मिक संदर्भ में स्पष्ट है।
- source_word: כֹּהֵן וְנָבִיא
  choice: याजक और भविष्यद्वक्ता
  rationale: दोनों एकवचन सामूहिक/प्रतिनिधिक पदों को हिन्दी में उसी रूप में रखा गया है।
- source_word: אֲדֹנָי
  choice: प्रभु
  rationale: यह यְהוָה से भिन्न दैवी उपाधि है; 'प्रभु' इस भेद को हिन्दी में बनाए रखता है।
theological_decisions:
- issue: एक ही पद में יְהוָה और אֲדֹנָי का अनुवाद
  choice: יְהוָה के लिए 'यहोवा' और אֲדֹנָי के लिए 'प्रभु'
  alternative: दोनों के लिए 'प्रभु' अथवा 'यहोवा' के लिए 'याहवे'
  rationale: मूल पाठ की दो अलग दैवी संज्ञाओं का भेद सुरक्षित रखा गया है। 'यहोवा' आधुनिक हिन्दी बाइबलीय प्रयोग में व्यापक रूप से पहचाना जाता है।
- issue: विपत्ति में परमेश्वर की भूमिका
  choice: 'प्रत्यक्ष संबोधन: ''तूने किसके साथ ऐसा किया है?'''
  alternative: अप्रत्यक्ष या अनुमतिमूलक भाषा, जैसे 'तूने ऐसा होने क्यों दिया?'
  rationale: मूल क्रिया परमेश्वर को सीधे कर्ता के रूप में संबोधित करती है। पाठ के कठिन धर्मवैचारिक तनाव को नरम करके या अनुमति की धारणा जोड़कर हल नहीं किया गया।
- issue: नरभक्षण के प्रश्न का स्वर
  choice: आघात व्यक्त करने वाला आलंकारिक प्रश्न
  alternative: भविष्यवाणी के रूप में 'क्या स्त्रियाँ ... खाएँगी?'
  rationale: दोहराया गया אִם विलाप में भय और विरोध का प्रश्न व्यक्त करता है; हिन्दी सम्भावनार्थक बहुवचन इस स्वर को बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की, गरिमापूर्ण पर सामान्य पाठक के लिए सुबोध रखी गई है। 'हे यहोवा' विलाप की सीधी पुकार को और 'देख और ध्यान दे' दोहरे आग्रह को व्यक्त करता है। 'गोद में खिलाया' शिशुओं की स्नेहपूर्ण देखभाल का स्वाभाविक हिन्दी बिंब है।
