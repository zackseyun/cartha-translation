base_translation:
  language: en
  yaml_path: translation/ot/lamentations/002/013.yaml
  text: What can I testify for you? What can I compare you to[a], daughter Jerusalem? What can I liken to you, so that I may comfort you, virgin daughter Zion? For your fracture is as great as the sea[b]; who can heal you?
translation:
  language: hi
  text: मैं तेरे पक्ष में क्या गवाही दूँ?[a] हे यरूशलेम की बेटी, मैं तेरी तुलना किससे करूँ? हे सिय्योन की कुँवारी बेटी, मैं किसे तेरे समान ठहराऊँ कि तुझे सांत्वना दूँ? क्योंकि तेरी टूटन समुद्र के समान विशाल है; कौन तुझे चंगा कर सकता है?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “मैं तेरे विषय में क्या गवाही दूँ?” अथवा “मैं तेरे विषय में क्या कहूँ?” इब्रानी क्रिया में गवाही देने का भाव है, पर यहाँ का पदबंध कठिन है।
    reason: lexical_alternative
  - marker: b
    text: “टूटन” का अनुवाद “घाव,” “विनाश” या “बरबादी” भी हो सकता है। मूल शब्द टूटने या ढहने को दर्शाता है; यहाँ उपचार के अगले प्रश्न के कारण ठोस रूपक रखा गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: מָה אֲעִידֵךְ
  choice: मैं तेरे पक्ष में क्या गवाही दूँ?
  rationale: क्रिया में गवाही या साक्ष्य देने का भाव है, पर इस कठिन पदबंध में उसका सटीक संबंध अस्पष्ट है। ‘तेरे पक्ष में’ संभावित हितार्थक भाव को बनाए रखता है; अन्य अर्थ पादटिप्पणी में दिए गए हैं।
- source_word: אֲדַמֶּה לָּךְ
  choice: मैं तेरी तुलना किससे करूँ?
  rationale: हिन्दी में स्वाभाविक तुलना-प्रश्न के लिए ‘किससे’ प्रयुक्त है; यह मूल के विलापपूर्ण प्रश्न को स्पष्ट रखता है।
- source_word: הַבַּת יְרוּשָׁלִַם
  choice: हे यरूशलेम की बेटी
  rationale: नगर के स्त्रीरूप मानवीकरण और प्रत्यक्ष संबोधन को बिना अतिरिक्त विशेषण के सुरक्षित रखा गया है।
- source_word: מָה אַשְׁוֶה לָּךְ
  choice: मैं किसे तेरे समान ठहराऊँ
  rationale: पहली तुलना-संबंधी क्रिया के निकटार्थ को रखते हुए हिन्दी में थोड़ी भिन्न अभिव्यक्ति दी गई है, जिससे मूल की आलंकारिक पुनरावृत्ति बनी रहती है।
- source_word: וַאֲנַחֲמֵךְ
  choice: कि तुझे सांत्वना दूँ
  rationale: तुलना खोजने और सांत्वना देने के बीच संभावित प्रयोजन अथवा परिणाम का संबंध हिन्दी में स्वाभाविक रूप से व्यक्त होता है।
- source_word: בְּתוּלַת בַּת צִיּוֹן
  choice: हे सिय्योन की कुँवारी बेटी
  rationale: בתולה का सामान्य अर्थ ‘कुँवारी’ और नगर का पारंपरिक स्त्रीरूप मानवीकरण दोनों सुरक्षित रखे गए हैं।
- source_word: שִׁבְרֵךְ
  choice: तेरी टूटन
  rationale: शब्द टूटने, ढहने, विनाश या घाव का बोध करा सकता है। ‘टूटन’ ठोस रूपक को बनाए रखता है और अगले उपचार-संबंधी प्रश्न से संगति रखता है।
- source_word: גָדוֹל כַּיָּם
  choice: समुद्र के समान विशाल
  rationale: समुद्र की अथाह व्यापकता का उपमान आधुनिक हिन्दी में सहज और प्रभावशाली ढंग से व्यक्त किया गया है।
- source_word: מִי יִרְפָּא לָךְ
  choice: कौन तुझे चंगा कर सकता है?
  rationale: רפא का उपचार-संबंधी अर्थ सीधे रखा गया है। ‘कर सकता है’ प्रश्न में निहित असमर्थता और संकट की चरमता को व्यक्त करता है।
