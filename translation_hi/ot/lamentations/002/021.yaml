  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: שָׁכְב֨וּ לָ/אָ֤רֶץ חוּצוֹת֙ נַ֣עַר וְ/זָקֵ֔ן בְּתוּלֹתַ֥/י וּ/בַחוּרַ֖/י נָפְל֣וּ בֶ/חָ֑רֶב הָרַ֨גְתָּ֙ בְּ/י֣וֹם אַפֶּ֔/ךָ טָבַ֖חְתָּ לֹ֥א חָמָֽלְתָּ׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/002/021.yaml
  text: Young and old lie on the ground in the streets[a]; my virgins and my young men have fallen by the sword. You killed them in the day of your anger[b]; you slaughtered without pity.
translation:
  language: hi
  text: युवा और वृद्ध गलियों में भूमि पर पड़े हैं; मेरी कुमारियाँ[a] और मेरे जवान तलवार से मारे गए हैं। तूने अपने क्रोध के दिन उन्हें मार डाला; तूने उनका वध किया, दया नहीं की[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मेरी युवतियाँ।” इब्रानी शब्द का अधिक शाब्दिक अर्थ “मेरी कुमारियाँ” है।
    reason: lexical_alternative
  - marker: b
    text: या, “तूने नहीं बख्शा।”
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁכְבוּ לָאָרֶץ חוּצוֹת
  choice: गलियों में भूमि पर पड़े हैं
  rationale: पूर्ण क्रिया यहाँ मृत्यु के परिणामस्वरूप सामने पड़ी अवस्था का सजीव वर्णन करती है। ‘भूमि पर पड़े हैं’ ठोस चित्र बनाए रखता है, और חוּצוֹת के लिए ‘गलियों में’ नगर के सार्वजनिक मार्गों का स्वाभाविक हिन्दी रूप है।
- source_word: נַעַר וְזָקֵן
  choice: युवा और वृद्ध
  rationale: यह युग्म अलग-अलग आयु-वर्गों को साथ रखकर व्यापक विनाश दिखाता है। ‘युवा और वृद्ध’ आधुनिक, संक्षिप्त और स्वाभाविक है।
- source_word: בְּתוּלֹתַי
  choice: मेरी कुमारियाँ
  rationale: בְּתוּלָה का सीधा अर्थ कुमारी अथवा अविवाहित युवती है। ‘मेरी कुमारियाँ’ सिय्योन/यरूशलेम के प्रथम-पुरुष संबोधन को और मूल शब्द की विशिष्टता को बनाए रखता है।
- source_word: וּבַחוּרַי
  choice: मेरे जवान
  rationale: בָּחוּר यहाँ जीवन की भरपूर अवस्था वाले जवान पुरुषों को दर्शाता है। ‘मेरे जवान’ अधिकारवाचक रूप और आयु-संबंधी अर्थ दोनों को सहजता से व्यक्त करता है।
- source_word: נָפְלוּ בֶחָרֶב
  choice: तलवार से मारे गए हैं
  rationale: शाब्दिक रूप ‘तलवार से गिर पड़े’ हिंसक मृत्यु का इब्रानी मुहावरा है। हिन्दी में ‘तलवार से मारे गए हैं’ उसका आशय स्पष्ट करता है और तलवार की मूल छवि भी बनाए रखता है।
- source_word: הָרַגְתָּ
  choice: तूने ... उन्हें मार डाला
  rationale: द्वितीय पुरुष एकवचन में परमेश्वर को सीधे संबोधित किया गया है। सन्दर्भ से ‘उन्हें’ स्पष्ट करके हिन्दी वाक्य को स्वाभाविक रखा गया है।
- source_word: בְּיוֹם אַפֶּךָ
  choice: अपने क्रोध के दिन
  rationale: אַף यहाँ क्रोध को व्यक्त करता है। यह रूप समय-सूचक वाक्यांश और विलाप की गंभीरता दोनों को बनाए रखता है।
- source_word: טָבַחְתָּ
  choice: तूने उनका वध किया
  rationale: טבח, הרג की अपेक्षा अधिक प्रबल और हिंसक शब्द है। ‘वध किया’ उस तीव्रता को गरिमापूर्ण आधुनिक हिन्दी में बनाए रखता है।
- source_word: לֹא חָמָלְתָּ
  choice: दया नहीं की
  rationale: क्रिया में करुणा न करने और न बख्शने दोनों का भाव संभव है। मुख्य पाठ में ‘दया नहीं की’ भावात्मक पक्ष को स्वाभाविक हिन्दी में रखता है और वैकल्पिक अर्थ पादटिप्पणी में दिया गया है।
theological_decisions:
- issue: यरूशलेम के विनाश का सीधा कर्तृत्व परमेश्वर को देना
  choice: ‘तूने ... उन्हें मार डाला; तूने उनका वध किया’ के रूप में प्रत्यक्ष संबोधन बनाए रखा गया है।
  alternative: निष्क्रिय अथवा निरपेक्ष भाषा में कर्ता को अस्पष्ट करना।
  rationale: इब्रानी पाठ परमेश्वर को द्वितीय पुरुष में सीधे संबोधित करते हुए उसी को क्रियाओं का कर्ता बताता है। विलाप में उपस्थित इस धर्मवैचारिक तनाव को नरम या स्पष्ट करके समाप्त नहीं किया गया।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, गंभीर और विलापोचित रखी गई है। परमेश्वर से प्रत्यक्ष, एकवचन संबोधन के कारण ‘तूने’ मूल इब्रानी के निकट है; इसे आदर-सूचक बहुवचन में बदलकर व्याकरणिक स्वरूप को नहीं ढका गया। ‘मार डाला’ और ‘वध किया’ क्रमशः הרג और अधिक प्रबल טבח के बीच का भेद बनाए रखते हैं।
