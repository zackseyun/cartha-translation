source:
  edition: WLC
  text: לְ/אִמֹּתָ/ם֙ יֹֽאמְר֔וּ אַיֵּ֖ה דָּגָ֣ן וָ/יָ֑יִן בְּ/הִֽתְעַטְּפָ֤/ם כֶּֽ/חָלָל֙ בִּ/רְחֹב֣וֹת עִ֔יר בְּ/הִשְׁתַּפֵּ֣ךְ נַפְשָׁ֔/ם אֶל חֵ֖יק אִמֹּתָֽ/ם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/002/012.yaml
  text: They say to their mothers[a], “Where are grain and wine?” as they faint like the wounded in the streets of the city[c][b], as their life is poured out into their mothers’ bosom.
translation:
  language: hi
  text: वे अपनी माताओं से कहते हैं, “अनाज और दाखमधु कहाँ हैं?” जब वे नगर की सड़कों पर घायल व्यक्ति के समान[a] मूर्छित होते हैं, जब उनका जीवन[b] अपनी माताओं की गोद में[c] उँडेला जाता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “मारे हुए व्यक्ति के समान।” इब्रानी शब्द חָלָל मारे गए, बेधे गए, या प्राणघातक रूप से घायल व्यक्ति के लिए प्रयुक्त हो सकता है। यहाँ बच्चे ऐसे ढह रहे हैं मानो वे युद्ध में हताहत हुए हों।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी נֶפֶשׁ, जिसका अनुवाद कभी-कभी “प्राण” या “आत्मा” किया जाता है, यहाँ संभवतः उस जीवन को दर्शाता है जो धीरे-धीरे समाप्त हो रहा है।
    reason: lexical_alternative
  - marker: c
    text: शाब्दिक रूप से “माताओं के वक्ष में”; इसका अर्थ “माताओं की बाँहों में” या “माताओं की गोद में” भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: לְאִמֹּתָם
  choice: अपनी माताओं से
  rationale: לְ यहाँ संबोधित व्यक्ति को चिह्नित करता है और बहुवचन संबंधसूचक प्रत्यय ‘उनकी माताओं’ का अर्थ देता है। हिन्दी में कर्ता के साथ संबंध स्पष्ट करने के लिए ‘अपनी माताओं से’ स्वाभाविक है।
- source_word: יֹאמְרוּ
  choice: कहते हैं
  rationale: अपूर्ण क्रिया यहाँ विलाप के दृश्य को सजीव वर्तमान में प्रस्तुत करती है; ‘कहते हैं’ उसकी तात्कालिकता बनाए रखता है।
- source_word: דָּגָן וָיָיִן
  choice: अनाज और दाखमधु
  rationale: דָּגָן का अर्थ सामान्यतः अन्न या अनाज है, और יַיִן दाखमधु है। ठोस खाद्य पदार्थों का उल्लेख बनाए रखा गया है, उसे सामान्य ‘भोजन’ नहीं बनाया गया।
- source_word: בְּהִתְעַטְּפָם
  choice: निढाल होकर गिर पड़ते हैं
  rationale: עטף का हित्पएल रूप यहाँ भूख और निर्बलता से चेतना चूकने या ढहने का भाव देता है। यह हिन्दी प्रयोग दृश्य को स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: כֶּחָלָל
  choice: घायल लोगों के समान
  rationale: חָלָל युद्ध में घायल, बेधा हुआ, या मारा गया व्यक्ति हो सकता है। मुख्य पाठ में ‘घायल’ बच्चों के ढहने के दृश्य के अनुकूल है, जबकि मृत्यु की अधिक तीव्र संभावना पादटिप्पणी में सुरक्षित रखी गई है।
- source_word: בִּרְחֹבוֹת עִיר
  choice: नगर की सड़कों पर
  rationale: רְחֹבוֹת चौड़ी सड़कों या सार्वजनिक खुले स्थानों को सूचित कर सकता है। ‘नगर की सड़कों पर’ आधुनिक हिन्दी में स्वाभाविक और दृश्यात्मक है।
- source_word: בְּהִשְׁתַּפֵּךְ נַפְשָׁם
  choice: उनका जीवन बह जाता है
  rationale: נֶפֶשׁ यहाँ अलग अस्तित्व वाली ‘आत्मा’ की अपेक्षा बुझते हुए जीवन को दर्शाता है। ‘बह जाता है’ שׁפך के उँडेल दिए जाने के रूपक को सहज हिन्दी में बनाए रखता है।
- source_word: אֶל חֵיק אִמֹּתָם
  choice: अपनी माताओं की गोद में
  rationale: חֵיק का अर्थ छाती, आँचल या गोद का निकट स्थान हो सकता है। ‘गोद में’ मातृ-सान्निध्य और करुण दृश्य को आधुनिक हिन्दी में स्वाभाविक रूप से व्यक्त करता है।
theological_decisions:
- issue: נֶפֶשׁ का अर्थ
  choice: जीवन
  alternative: प्राण या आत्मा
  rationale: इस प्रसंग में बच्चों का जीवन समाप्त होने की ओर है; इसलिए ‘जीवन’ संदर्भगत अर्थ को बिना मनुष्य की संरचना के विषय में कोई अतिरिक्त धर्मवैज्ञानिक निष्कर्ष आरोपित किए व्यक्त करता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और करुण दृश्य के अनुरूप रखी गई है। ‘दाखमधु’ बाइबलीय संदर्भ में परिचित है, जबकि ‘अनाज’, ‘सड़कें’, ‘गोद’ और ‘निढाल होकर गिर पड़ते हैं’ सामान्य पाठक के लिए सहज हैं। काव्यात्मक ‘जीवन बह जाता है’ मूल के उँडेल दिए जाने वाले रूपक को बनाए रखता है।
