id: LAM.2.7
reference: Lamentations 2:7
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: זָנַ֨ח אֲדֹנָ֤/י מִזְבְּח/וֹ֙ נִאֵ֣ר מִקְדָּשׁ֔/וֹ הִסְגִּיר֙ בְּ/יַד אוֹיֵ֔ב חוֹמֹ֖ת אַרְמְנוֹתֶ֑י/הָ ק֛וֹל נָתְנ֥וּ בְּ/בֵית יְהוָ֖ה כְּ/י֥וֹם מוֹעֵֽד׀־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/002/007.yaml
  text: The Lord has rejected his altar[a]; he has abandoned his sanctuary. He has given the walls of her palaces into the hand of the enemy[c][b]. They raised a shout in the house of Yahweh as on the day of an appointed feast.
translation:
  language: hi
  text: प्रभु ने अपनी वेदी को त्याग दिया है; उसने अपने पवित्रस्थान को तुच्छ जाना है। उसने उसके महलों की दीवारें शत्रु के हाथ में सौंप दी हैं। उन्होंने यहोवा के भवन में ऐसा शोर मचाया, मानो किसी नियत पर्व का दिन हो।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: זָנַח
  choice: त्याग दिया है
  rationale: यह क्रिया अस्वीकार करके अलग कर देने का भाव व्यक्त करती है; ‘त्याग दिया’ न्याय के प्रसंग में स्वाभाविक है, पर पूर्ण और स्थायी परित्याग का अनावश्यक निष्कर्ष नहीं जोड़ता।
- source_word: אֲדֹנָי
  choice: प्रभु
  rationale: यह परमेश्वर के लिए प्रयुक्त उपाधि है; आधुनिक मानक हिन्दी में ‘प्रभु’ स्वाभाविक और प्रतिष्ठित रूप है।
- source_word: מִזְבְּחוֹ
  choice: अपनी वेदी
  rationale: एकवचन और संबंधसूचक प्रत्यय को सीधे बनाए रखता है। हिन्दी में कर्ता के अपने अंग/स्थान के लिए ‘अपनी’ स्वाभाविक है।
- source_word: נִאֵר
  choice: तुच्छ जाना है
  rationale: यह זָנַח से अधिक तीव्र, अवमाननापूर्ण अस्वीकार का संकेत देता है। ‘तुच्छ जाना’ दोनों क्रियाओं का काव्यात्मक भेद बनाए रखता है।
- source_word: מִקְדָּשׁוֹ
  choice: अपने पवित्रस्थान
  rationale: मंदिर के पवित्र क्षेत्र का अर्थ स्पष्ट करता है और मूल के धार्मिक पद को बनाए रखता है।
- source_word: הִסְגִּיר בְּיַד אוֹיֵב
  choice: शत्रु के हाथ में सौंप दी हैं
  rationale: मूल इब्रानी मुहावरे की ‘हाथ’ वाली छवि रखते हुए शत्रु के अधिकार में दे देने का अर्थ स्वाभाविक हिन्दी में व्यक्त होता है।
- source_word: חוֹמֹת אַרְמְנוֹתֶיהָ
  choice: उसके महलों की दीवारें
  rationale: स्त्रीलिंग प्रत्यय नगर की मानवीकृत स्त्री-सत्ता की ओर संकेत करता है। ‘महल’ सामान्य अर्थ रखता है, जबकि ‘दीवारें’ उनके दुर्गात्मक पहलू को प्रसंग में स्पष्ट करती हैं।
- source_word: קוֹל נָתְנוּ
  choice: उन्होंने ... शोर मचाया
  rationale: शाब्दिक अर्थ ‘आवाज़ दी’ है; प्रसंग में यह शत्रुओं के कोलाहल को दर्शाता है। ‘शोर मचाया’ साधारण पाठक के लिए सहज है।
- source_word: בְּבֵית יְהוָה
  choice: यहोवा के भवन में
  rationale: ‘भवन’ मूल ‘घर’ की मंदिर-संबंधी अभिव्यक्ति को गरिमापूर्ण हिन्दी में रखता है; יהוה को व्यक्तिगत दिव्य नाम ‘यहोवा’ के रूप में लिप्यंतरित किया गया है।
- source_word: כְּיוֹם מוֹעֵד
  choice: मानो किसी नियत पर्व का दिन हो
  rationale: מוֹעֵד में नियत समय, धार्मिक सभा या पर्व का भाव है। यह रूप उस कटु विडंबना को बनाए रखता है कि मंदिर में अब पर्वोत्सव के बदले शत्रु का कोलाहल है।
theological_decisions:
- issue: दिव्य नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: मूल में उपाधि नहीं बल्कि चार-अक्षरी व्यक्तिगत नाम है। हिन्दी में व्यापक रूप से पहचाना जाने वाला लिप्यंतरण ‘यहोवा’ रखा गया है; इसे ‘प्रभु’ करने से इसी पद में אֲדֹנָי और יהוה का भेद मिट जाता।
- issue: זָנַח और נִאֵר के बीच तीव्रता का भेद
  choice: ‘त्याग दिया’ और ‘तुच्छ जाना’ जैसे अलग पद
  alternative: दोनों के लिए ‘त्याग दिया’; अथवा दूसरे के लिए ‘घृणा की’
  rationale: दो अलग इब्रानी क्रियाओं की काव्यात्मक तीव्रता को बचाया गया है। ‘घृणा की’ संभव है, पर वह भाव को आवश्यकता से अधिक निश्चित और प्रबल कर सकती है।
- issue: महलों के स्त्रीलिंग संबंधसूचक प्रत्यय का संदर्भ
  choice: ‘उसके’ द्वारा नगर के स्त्रीरूप संकेत को बनाए रखना
  alternative: ‘यरूशलेम के महलों’ की व्याख्यात्मक स्पष्टता
  rationale: पद स्वयं नगर का नाम नहीं दोहराता। सर्वनाम मूल की काव्यात्मक व्यक्ति-कल्पना और निकटवर्ती संदर्भ पर निर्भरता को सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, काव्यात्मक किंतु सामान्य पाठक के लिए सुबोध रूप। समानांतर वाक्य-विन्यास और न्याय की तीव्रता बनाए रखी गई है। इब्रानी की वास्तविक अर्थ-व्याप्ति को पाठ में अनावश्यक व्याख्या से सीमित नहीं किया गया।
