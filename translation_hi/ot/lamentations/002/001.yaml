source:
  edition: WLC
  text: אֵיכָה֩ יָעִ֨יב בְּ/אַפּ֤/וֹ אֲדֹנָ/י֙ אֶת בַּת צִיּ֔וֹן הִשְׁלִ֤יךְ מִ/שָּׁמַ֨יִם֙ אֶ֔רֶץ תִּפְאֶ֖רֶת יִשְׂרָאֵ֑ל וְ/לֹא זָכַ֥ר הֲדֹם רַגְלָ֖י/ו בְּ/י֥וֹם אַפּֽ/וֹ׀־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/lamentations/002/001.yaml
  text: How the Lord in his anger has clouded over daughter Zion! He has cast from heaven to earth the beauty of Israel[c][b][a], and he did not remember his footstool in the day of his anger.
translation:
  language: hi
  text: कैसे प्रभु ने अपने क्रोध में सिय्योन की बेटी को बादल से ढक दिया है![a] उसने इस्राएल की शोभा को स्वर्ग से धरती पर फेंक दिया है,[b] और अपने क्रोध के दिन अपने पाँवों की चौकी को स्मरण नहीं किया।[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इसका अनुवाद ‘अँधेरा कर दिया है’ या ‘बादल से आच्छादित कर दिया है’ भी हो सकता है। हिब्रू क्रिया बादल छा जाने का बिंब प्रस्तुत करती है।
    reason: lexical_alternative
  - marker: b
    text: ‘इस्राएल की शोभा’ का अनुवाद ‘इस्राएल की महिमा’ या ‘इस्राएल का वैभव’ भी हो सकता है।
    reason: lexical_alternative
  - marker: c
    text: ‘अपने पाँवों की चौकी’ सिय्योन, मंदिर, या परमेश्वर की पृथ्वी पर उपस्थिति से जुड़े वाचा के सन्दूक की ओर संकेत कर सकती है।
    reason: alternative_reading
lexical_decisions:
- source_word: אֵיכָה
  choice: हाय, ... कैसे
  rationale: यह प्रश्न नहीं, बल्कि विलापपूर्ण विस्मय है। ‘हाय’ और ‘कैसे’ मिलकर मूल की भावात्मक तथा काव्यात्मक शक्ति व्यक्त करते हैं।
- source_word: יָעִיב
  choice: बादल से ढक दिया है
  rationale: हिफ़ील क्रिया बादल से आच्छादित या अँधेरा करने का बिंब देती है; यह अनुवाद उस बिंब को बनाए रखता है।
- source_word: בְּאַפּוֹ
  choice: अपने क्रोध में
  rationale: אַף का शाब्दिक संबंध नाक से है, पर यहाँ इसका स्वाभाविक मुहावरेदार अर्थ ‘क्रोध’ है।
- source_word: אֲדֹנָי
  choice: प्रभु
  rationale: ईश्वरीय उपाधि का आधुनिक मानक हिन्दी में स्वाभाविक और गरिमापूर्ण अनुवाद।
- source_word: בַּת צִיּוֹן
  choice: सिय्योन-बेटी
  rationale: नगर और उसके लोगों के मानवीकरण को बनाए रखते हुए हिब्रू पद की संक्षिप्त काव्यात्मक संरचना व्यक्त करता है।
- source_word: הִשְׁלִיךְ
  choice: पटक दिया है
  rationale: ऊँचाई से नीचे फेंकने की प्रबल गति और अपमान को हिन्दी में स्पष्ट रूप से व्यक्त करता है।
- source_word: מִשָּׁמַיִם אֶרֶץ
  choice: स्वर्ग से धरती पर
  rationale: महिमा की ऊँचाई से अपमान की नीचाई तक के तीखे विरोध को सुरक्षित रखता है।
- source_word: תִּפְאֶרֶת יִשְׂרָאֵל
  choice: इस्राएल की शोभा
  rationale: תפארת में शोभा, महिमा और वैभव के अर्थ संभव हैं। ‘शोभा’ काव्यात्मक है और किसी एक ठोस संदर्भ को अनावश्यक रूप से निश्चित नहीं करती।
- source_word: וְלֹא זָכַר
  choice: स्मरण नहीं किया
  rationale: זכר का सीधा अर्थ सुरक्षित रहता है और उसकी संभावित वाचा-संबंधी प्रतिध्वनि को व्याख्यात्मक रूप से हल नहीं किया जाता।
- source_word: הֲדֹם רַגְלָיו
  choice: अपने पाँवों की चौकी
  rationale: मूल रूपक को बनाए रखने वाला स्वाभाविक हिन्दी पद; इसका संकेत सिय्योन, मंदिर या सन्दूक की ओर हो सकता है।
- source_word: בְּיוֹם אַפּוֹ
  choice: अपने क्रोध के दिन
  rationale: मूल की कालसूचक रचना और क्रोध की पुनरावृत्ति दोनों सुरक्षित रखता है।
theological_decisions:
- issue: ‘उसके पाँवों की चौकी’ का संदर्भ
  choice: मुख्य पाठ में रूपक ‘अपने पाँवों की चौकी’ को यथावत रखा गया
  alternative: मंदिर, सिय्योन/यरूशलेम, या परमेश्वर के सिंहासन से संबद्ध वाचा का सन्दूक
  rationale: हिब्रू पाठ किसी एक संदर्भ को निर्णायक रूप से निर्दिष्ट नहीं करता; इसलिए अनुवाद उस धार्मिक और काव्यात्मक बहुअर्थकता को सुरक्षित रखता है।
- issue: ‘इस्राएल की शोभा’ का संदर्भ
  choice: अस्पष्ट सामूहिक/प्रतीकात्मक पद बनाए रखा गया
  alternative: यरूशलेम, मंदिर, इस्राएल की महिमा या उसकी गौरवपूर्ण स्थिति
  rationale: पद का सटीक संदर्भ खुला है; किसी एक संस्था या स्थान को मुख्य पाठ में जोड़ना मूल से अधिक निश्चितता उत्पन्न करता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, काव्यात्मक और गरिमापूर्ण रखी गई है। ‘सिय्योन-बेटी’ मानवीकरण को सुरक्षित रखता है; ‘पटक दिया’ मूल क्रिया की तीव्रता व्यक्त करता है। फुटनोट चिह्न मुख्य पाठ में क्रमशः [a], [b], [c] दिए गए हैं।
