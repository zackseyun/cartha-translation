translation:
  language: hi
  text: बेतलेहेम और नतोपा के पुरुष[a]—एक सौ अट्ठासी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘बेतलेहेम और नतोपा के लोग।’ इब्रानी में शाब्दिक रूप से ‘के पुरुष’ है, जो जनगणना और लौटने वालों की सूचियों में प्रयुक्त एक सामान्य अभिव्यक्ति है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אַנְשֵׁי
  choice: के पुरुष
  rationale: אִישׁ का संबंधवाचक बहुवचन यहाँ नगरों से जुड़े लोगों की सूची का परिचय देता है। ‘के पुरुष’ इब्रानी के पुल्लिंग रूप और गणना-सूची की शैली को बनाए रखता है; व्यापक अर्थ ‘के लोग’ पादटिप्पणी में दिया गया है।
- source_word: בֵית לֶחֶם
  choice: बेतलेहेम
  rationale: स्थान-नाम को उसके प्रचलित मानक हिन्दी बाइबिलीय रूप में लिप्यंतरित किया गया है, न कि शाब्दिक अर्थ ‘रोटी का घर’ के रूप में।
- source_word: וּנְטֹפָה
  choice: और नतोपा
  rationale: संयोजक וּ के साथ स्थान-नाम है। इब्रानी दोनों नगरों को एक ही कुल संख्या के अंतर्गत रखता है, इसलिए सरल समन्वय ‘और नतोपा’ उपयुक्त है।
- source_word: מֵאָה שְׁמֹנִים וּשְׁמֹנָה
  choice: एक सौ अट्ठासी
  rationale: इब्रानी संख्या-क्रम का योग 188 है; इसे स्वाभाविक आधुनिक हिन्दी संख्या-रूप में व्यक्त किया गया है।
