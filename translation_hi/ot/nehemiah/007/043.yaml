lexical_decisions:
- source_word: הַלְוִיִּם
  choice: लेवी
  rationale: निश्चित बहुवचन संज्ञा जनगणना-सूची में एक वर्ग का परिचय देती है; इसलिए सूची की शीर्षक-जैसी शैली बनाए रखी गई है और अनावश्यक क्रिया नहीं जोड़ी गई।
- source_word: בְּנֵי יֵשׁוּעַ
  choice: येशू के वंशज
  rationale: वंशावली और जनगणना के प्रसंग में בְּנֵי केवल सगे पुत्रों तक सीमित नहीं, बल्कि व्यापक कुल या वंश को भी सूचित कर सकता है; ‘वंशज’ आधुनिक हिन्दी में यही अर्थ स्वाभाविक रूप से देता है।
- source_word: לְקַדְמִיאֵל
  choice: कदमीएल के
  rationale: उपसर्ग לְ यहाँ पारिवारिक या वंशगत संबंध दिखाता है। संक्षिप्त ‘के’ मूल की सूचीगत, स्तरित रचना और उसकी कुछ कठिनता को बनाए रखता है।
- source_word: לִבְנֵי לְהוֹדְוָה
  choice: होदवा के पुत्रों में से
  rationale: दोहराए गए לְ और construct रूप בְּנֵי को एक वंशगत संबंध के रूप में रखा गया है। ‘पुत्रों’ मूल अभिव्यक्ति को औपचारिक रूप से सुरक्षित रखता है, जबकि पादटिप्पणी उसके व्यापक वंशगत अर्थ की संभावना बताती है।
- source_word: שִׁבְעִים וְאַרְבָּעָה
  choice: चौहत्तर
  rationale: गणना की संख्या को मानक आधुनिक हिन्दी संख्या-रूप में दिया गया है।
