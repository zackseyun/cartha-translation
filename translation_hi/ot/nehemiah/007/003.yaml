  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और निर्देशात्मक गद्य रखा गया है। ‘फाटक’ और ‘किवाड़’ का भेद मूल पाठ के gate/door-leaves अंतर को स्पष्ट करता है। ‘धूप तेज़ होना’ शब्दशः रूप की तुलना में स्वाभाविक हिन्दी है, जबकि पादटिप्पणी मूल रूपक को सुरक्षित रखती है।
