  text: ו/יאמר לָ/הֶ֗ם לֹ֣א יִפָּֽתְח֞וּ שַׁעֲרֵ֤י יְרוּשָׁלִַ֨ם֙ עַד חֹ֣ם הַ/שֶּׁ֔מֶשׁ וְ/עַ֨ד הֵ֥ם עֹמְדִ֛ים יָגִ֥יפוּ הַ/דְּלָת֖וֹת וֶ/אֱחֹ֑זוּ וְ/הַעֲמֵ֗יד מִשְׁמְרוֹת֙ יֹשְׁבֵ֣י יְרוּשָׁלִַ֔ם אִ֚ישׁ בְּ/מִשְׁמָר֔/וֹ וְ/אִ֖ישׁ נֶ֥גֶד בֵּיתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/007/003.yaml
  text: And I said to them[a], “The gates of Jerusalem must not be opened until the sun is hot. While they are still standing guard, let them shut the doors and fasten them. And appoint guards from the inhabitants of Jerusalem[c][b], each at his watch and each opposite his own house.”
translation:
  language: hi
  text: मैंने उनसे कहा, “यरूशलेम के फाटक तब तक न खोले जाएँ, जब तक धूप तेज़ न हो जाए।[a] जब वे अभी पहरे पर खड़े हों, तब वे फाटकों के किवाड़ बन्द करके उन्हें सुरक्षित कर दें।[b] और यरूशलेम के निवासियों में से पहरेदार नियुक्त करो, हर एक को उसके पहरे पर और हर एक को उसके अपने घर के सामने।”[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “जब तक सूर्य गरम न हो जाए”; आशय केवल सूर्योदय तक नहीं, बल्कि सुबह कुछ चढ़ आने तक हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में शाब्दिक भाव “उन्हें थामे रखें” या “पकड़े रखें” है; यहाँ इसका आशय बन्द किवाड़ों को मजबूती से सुरक्षित करना है।
    reason: lexical_alternative
  - marker: c
    text: “पहरेदार नियुक्त करो” का अनुवाद “पहरे की पालियाँ ठहराओ” भी हो सकता है; इब्रानी शब्द व्यक्तियों या पहरे की ड्यूटी—दोनों को सूचित कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: יִפָּתְחוּ
  choice: न खोले जाएँ
  rationale: निफ़अल रूप का कर्मवाच्य अर्थ और לֹא के साथ निषेधात्मक आदेश—दोनों को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: עַד חֹם הַשֶּׁמֶשׁ
  choice: जब तक धूप तेज़ न हो जाए
  rationale: इब्रानी का ठोस भाव सूर्य के गरम होने का है, अर्थात केवल सूर्योदय तक नहीं बल्कि सुबह कुछ चढ़ आने तक। आधुनिक हिन्दी में ‘धूप तेज़ होना’ यही भाव स्वाभाविक ढंग से व्यक्त करता है।
- source_word: וְעַד הֵם עֹמְדִים
  choice: जब तक वे पहरे पर खड़े हों
  rationale: עמד का मूल अर्थ ‘खड़ा होना’ है; फाटकों की सुरक्षा के प्रसंग में इसका आशय अपने पहरे या स्थान पर उपस्थित रहने से है।
- source_word: יָגִיפוּ הַדְּלָתוֹת
  choice: फाटकों के किवाड़ बन्द कर दें
  rationale: הגיף का अर्थ बन्द करना है और דלתות फाटकों के वास्तविक किवाड़ों को दर्शाता है; ‘फाटकों के किवाड़’ हिन्दी में संदर्भ स्पष्ट रखता है।
- source_word: וֶאֱחֹזוּ
  choice: उन्हें सुरक्षित कर दें
  rationale: אחז का मूल भाव पकड़ने या थामने का है; बन्द किए गए किवाड़ों के संदर्भ में आशय उन्हें मजबूती से बन्द या सुरक्षित रखने का है, पर किसी खास यंत्र का उल्लेख नहीं है।
- source_word: וְהַעֲמֵיד מִשְׁמְרוֹת
  choice: पहरेदार नियुक्त करो
  rationale: העמיד का हिफ़ईल रूप किसी को खड़ा या तैनात करने का भाव देता है। משמרות पहरेदारों अथवा पहरे की पालियों को सूचित कर सकता है; मुख्य पाठ में व्यक्ति-संदर्भ के अनुकूल ‘पहरेदार’ चुना गया है।
- source_word: אִישׁ בְּמִשְׁמָרוֹ
  choice: हर एक को उसके पहरे पर
  rationale: איש यहाँ वितरणार्थक है और משמר पहरे, पहरे की पाली या निर्धारित स्थान का अर्थ दे सकता है। चयन मूल शब्द-संबंध को बनाए रखता है।
- source_word: וְאִישׁ נֶגֶד בֵּיתוֹ
  choice: हर एक को उसके अपने घर के सामने
  rationale: נגד का स्थानवाचक अर्थ ‘सामने’ या ‘आमने-सामने’ है। यह अनुवाद सटीक स्थान को अनावश्यक रूप से निश्चित किए बिना मूल चित्र बनाए रखता है।
