  text: אֵ֣לֶּה בְּנֵ֣י הַ/מְּדִינָ֗ה הָ/עֹלִים֙ מִ/שְּׁבִ֣י הַ/גּוֹלָ֔ה אֲשֶׁ֣ר הֶגְלָ֔ה נְבוּכַדְנֶצַּ֖ר מֶ֣לֶךְ בָּבֶ֑ל וַ/יָּשׁ֧וּבוּ לִֽ/ירוּשָׁלִַ֛ם וְ/לִ/יהוּדָ֖ה אִ֥ישׁ לְ/עִירֽ/וֹ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/007/006.yaml
  text: 'These are the sons of the province who came up from the captivity of the exiles[a], whom Nebuchadnezzar king of Babylon had carried away, and who returned to Jerusalem and to Judah[c][b], each man to his city:'
translation:
  language: hi
  text: 'ये उस प्रान्त के लोग हैं, जो निर्वासितों की बंधुआई से ऊपर आए थे, जिन्हें बाबेल के राजा नबूकदनेस्सर ने निर्वासित किया था, और जो यरूशलेम और यहूदा लौट आए—हर एक अपने नगर को:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי הַמְּדִינָה
  choice: उस प्रान्त के लोग
  rationale: शाब्दिक रूप ‘प्रान्त के पुत्र’ है, पर इस सूची में यह प्रान्त से संबंधित लोगों के लिए इब्रानी मुहावरा है। आधुनिक हिन्दी में ‘उस प्रान्त के लोग’ अर्थ को स्वाभाविक और स्पष्ट रूप से व्यक्त करता है।
- source_word: הָעֹלִים
  choice: ऊपर आए थे
  rationale: עלה के पारंपरिक आरोहण-बोध को बनाए रखता है; भूमि/यरूशलेम की ओर आने के लिए ‘ऊपर आना’ उपयुक्त है।
- source_word: מִשְּׁבִי הַגּוֹלָה
  choice: बँधुआई में पड़े निर्वासितों में से
  rationale: שְׁבִי और גּוֹלָה दोनों संबंधित संज्ञाओं—बँधुआई और निर्वासन—को हिन्दी में बनाए रखता है, बिना उन्हें केवल ‘निर्वासन’ में मिला देने के।
- source_word: אֲשֶׁר הֶגְלָה
  choice: उन्हें निर्वासित करके ले गया था
  rationale: हिफ़ील क्रिया के जबरन देश से निकालने के अर्थ को व्यक्त करता है और हिन्दी में ऐतिहासिक वर्णन के अनुरूप है।
- source_word: נְבוּכַדְנֶצַּר
  choice: नबूकदनेस्सर
  rationale: आधुनिक हिन्दी बाइबलीय परंपरा में प्रचलित और पहचानने योग्य नामरूप।
- source_word: וַיָּשׁוּבוּ
  choice: और वे ... लौट आए
  rationale: שׁוב का सामान्य अर्थ ‘लौटना’ है; स्वतंत्र मुख्य क्रिया के रूप में इब्रानी वाक्य-प्रवाह को सुरक्षित रखा गया है।
- source_word: לִירוּשָׁלַם וְלִיהוּדָה
  choice: यरूशलेम और यहूदा
  rationale: दोनों गंतव्यों को स्पष्ट रखता है; यहाँ यहूदा व्यापक क्षेत्र को सूचित करता है। हिन्दी में एक ही परसर्ग दोनों समन्वित पदों के साथ स्वाभाविक है।
- source_word: אִישׁ לְעִירוֹ
  choice: हर एक अपने नगर को
  rationale: वितरणात्मक भाव को स्वाभाविक हिन्दी में व्यक्त करता है। ‘हर एक’ प्रतिनिधि एकवचन को बनाए रखता है, जबकि अनावश्यक रूप से केवल वयस्क पुरुषों तक अर्थ सीमित नहीं करता।
theological_decisions:
- issue: אִישׁ में पुल्लिंग प्रतिनिधि भाषा
  choice: हर एक अपने नगर को
  alternative: हर पुरुष अपने नगर को
  rationale: संदर्भ में यह वापसी करने वालों को परिवार अथवा घराने की इकाइयों के अनुसार वितरणात्मक ढंग से बताता है। ‘हर एक’ मूल के एकवचन-वितरणात्मक अर्थ को रखता है और हिन्दी में मूल आशय से अधिक लैंगिक सीमा नहीं लगाता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सूची-परिचय के अनुरूप रखी गई है। ‘प्रान्त’ फ़ारसी-कालीन प्रशासनिक संदर्भ को दर्शाता है। मूल की लंबी संरचना को हिन्दी में स्पष्टता हेतु दो वाक्यों में बाँटा गया है, पर उसके सभी संबंध सुरक्षित हैं।
