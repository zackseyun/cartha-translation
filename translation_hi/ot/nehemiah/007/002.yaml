id: NEH.7.2
reference: Nehemiah 7:2
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וָ/אֲצַוֶּ֞ה אֶת חֲנָ֣נִי אָחִ֗/י וְ/אֶת חֲנַנְיָ֛ה שַׂ֥ר הַ/בִּירָ֖ה עַל יְרוּשָׁלִָ֑ם כִּי הוּא֙ כְּ/אִ֣ישׁ אֱמֶ֔ת וְ/יָרֵ֥א אֶת הָ/אֱלֹהִ֖ים מֵ/רַבִּֽים־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/007/002.yaml
  text: Then I appointed my brother Hanani and Hananiah[a], the commander of the fortress, over Jerusalem[b], because he was a faithful man and feared God more than many.
translation:
  language: hi
  text: तब मैंने अपने भाई हनानी और गढ़ के प्रधान हनन्याह को यरूशलेम का दायित्व सौंपा, क्योंकि वह विश्वासयोग्य[a] मनुष्य था और बहुतों से बढ़कर परमेश्वर का भय मानता था।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “सत्य का मनुष्य”; अथवा “भरोसेमंद मनुष्य।”
    reason: lexical_alternative
  - marker: b
    text: एकवचन “वह” सबसे स्वाभाविक रूप से हनन्याह की ओर संकेत करता है, हालाँकि कुछ लोग इस प्रशंसा को दोनों की नियुक्ति का आधार समझते हैं।
    reason: alternative_reading
lexical_decisions:
- source_word: וָאֲצַוֶּה
  choice: मैंने ... दायित्व सौंपा
  rationale: צוה का मूल अर्थ ‘आज्ञा देना’ है, पर यहाँ व्यक्तियों को यरूशलेम पर नियुक्त करने के प्रशासनिक संदर्भ में ‘दायित्व सौंपा’ स्वाभाविक हिन्दी में कार्यभार देने का भाव व्यक्त करता है।
- source_word: חֲנָנִי אָחִי
  choice: अपने भाई हनानी
  rationale: इब्रानी पदबंध हनानी को नहेमायाह का भाई बताता है; हिन्दी में यह क्रम स्वाभाविक है।
- source_word: חֲנַנְיָה
  choice: हनन्याह
  rationale: व्यक्तिवाचक नाम का देवनागरी लिप्यंतरण।
- source_word: שַׂר הַבִּירָה
  choice: गढ़ के प्रधान
  rationale: שַׂר अधिकारी, प्रधान या सेनापति हो सकता है और בִּירָה दुर्गीकृत परिसर को दर्शाता है। ‘गढ़ के प्रधान’ सैन्य-प्रशासनिक पद को संक्षिप्त और सुबोध ढंग से व्यक्त करता है।
- source_word: עַל יְרוּשָׁלַ͏ִם
  choice: यरूशलेम का दायित्व
  rationale: नियुक्ति-सूचक क्रिया के साथ עַל किसी स्थान पर अधिकार अथवा उत्तरदायित्व बताता है; हिन्दी में ‘यरूशलेम का दायित्व सौंपा’ स्वाभाविक है।
- source_word: כִּי הוּא
  choice: क्योंकि वह
  rationale: כִּי नियुक्ति का कारण देता है। एकवचन सर्वनाम को बनाए रखा गया है, जो सबसे स्वाभाविक रूप से निकटवर्ती हनन्याह की ओर संकेत करता है।
- source_word: כְּאִישׁ אֱמֶת
  choice: विश्वासयोग्य मनुष्य
  rationale: אֱמֶת यहाँ सत्यनिष्ठा, विश्वसनीयता या निष्ठा का बोध दे सकता है। पद की योग्यता के संदर्भ में ‘विश्वासयोग्य’ उपयुक्त है, जबकि पादटिप्पणी शाब्दिक विकल्प सुरक्षित रखती है।
- source_word: וְיָרֵא אֶת־הָאֱלֹהִים
  choice: परमेश्वर का भय मानता था
  rationale: यह परमेश्वर के प्रति श्रद्धापूर्ण भय का सीधा और हिन्दी बाइबलीय मुहावरा है।
- source_word: מֵרַבִּים
  choice: बहुतों से बढ़कर
  rationale: तुलनात्मक מִן और רַבִּים को निकटता से व्यक्त करता है और ‘अधिकांश से’ जैसी अनावश्यक अर्थ-संकुचन से बचता है।
theological_decisions:
- issue: प्रशंसात्मक उपवाक्य में एकवचन सर्वनाम का संदर्भ
  choice: ‘वह’ को बनाए रखा गया, जिसका सबसे स्वाभाविक संदर्भ हनन्याह है।
  alternative: प्रशंसा को दोनों नियुक्त व्यक्तियों पर सामूहिक रूप से लागू समझना।
  rationale: इब्रानी एकवचन सर्वनाम और विधेय निकटतम एकवचन पूर्वपद हनन्याह की ओर स्वाभाविक रूप से संकेत करते हैं। बहुवचन करके स्रोत की व्याकरणिक और व्याख्यात्मक अस्पष्टता मिटाई नहीं गई।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण और सामान्य पाठक के लिए सुबोध शैली। ‘दायित्व सौंपा’ प्रशासनिक नियुक्ति का स्वाभाविक भाव देता है; एकवचन ‘वह’ और तुलनात्मक ‘बहुतों से बढ़कर’ स्रोत की संरचना तथा तनाव को सुरक्षित रखते हैं।
