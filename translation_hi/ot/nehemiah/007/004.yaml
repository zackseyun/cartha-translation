source:
  edition: WLC
  text: וְ/הָ/עִ֞יר רַחֲבַ֤ת יָדַ֨יִם֙ וּ/גְדוֹלָ֔ה וְ/הָ/עָ֥ם מְעַ֖ט בְּ/תוֹכָ֑/הּ וְ/אֵ֥ין בָּתִּ֖ים בְּנוּיִֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/007/004.yaml
  text: The city was wide and large[a], but the people within it were few, and no houses had been built.
translation:
  language: hi
  text: नगर बहुत चौड़ा और बड़ा था,[a] पर उसके भीतर लोग थोड़े थे, और घर बने हुए नहीं थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “और नगर बहुत चौड़ा और बड़ा था ... और उसमें लोग थोड़े थे, और घर बने हुए नहीं थे।” इब्रानी वाक्य में खंड मुख्यतः “और” से जुड़े हैं; मुख्य पाठ सहज हिन्दी में निहित विरोध को स्पष्ट करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָעִיר
  choice: नगर
  rationale: הָעִיר का सीधा अर्थ ‘नगर’ है। आरंभिक וְ को अलग से ‘और’ कहना हिन्दी में आवश्यक नहीं; प्रसंग-संबंध स्वाभाविक रूप से बना रहता है।
- source_word: רַחֲבַת יָדַיִם
  choice: बहुत चौड़ा
  rationale: यह मुहावरा नगर के विस्तृत या फैले हुए होने को व्यक्त करता है। ‘बहुत चौड़ा’ साधारण आधुनिक हिन्दी में स्थानिक विस्तार स्पष्ट करता है।
- source_word: וּגְדוֹלָה
  choice: और बड़ा
  rationale: यहाँ גָּדוֹל नगर के आकार का वर्णन करता है, प्रतिष्ठा का नहीं; इसलिए ‘बड़ा’ उपयुक्त है।
- source_word: וְהָעָם מְעַט
  choice: पर ... लोग थोड़े थे
  rationale: מְעַט संख्या की कमी बताता है। ‘पर’ बड़े नगर और कम निवासियों के बीच निहित विरोध को स्वाभाविक हिन्दी में सामने लाता है।
- source_word: בְּתוֹכָהּ
  choice: उसके भीतर
  rationale: इसका अर्थ ‘उसके बीच/भीतर’ है; ‘उसके भीतर’ नगर में रहने वालों की स्थिति स्पष्ट करता है।
- source_word: וְאֵין בָּתִּים בְּנוּיִם
  choice: और घर बने हुए नहीं थे
  rationale: אֵין अस्तित्व के अभाव को और בְּנוּיִם ‘बने हुए’ होने की अवस्था को बताता है। मूल में ‘फिर से’ का स्पष्ट तत्व नहीं है, इसलिए ‘दोबारा बनाए गए’ नहीं जोड़ा गया।
