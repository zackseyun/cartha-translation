  rationale: व्यक्तिगत नाम का इब्रानी रूप के निकट देवनागरी लिप्यंतरण।
- source_word: אַנְשֵׁי עַם יִשְׂרָאֵל
  choice: इस्राएल की प्रजा के पुरुषों
  rationale: इब्रानी में आए स्पष्ट पुल्लिंग बहुवचन ‘पुरुषों’ और उसके साथ जुड़े ‘इस्राएल की प्रजा’—दोनों को बनाए रखा गया है।
theological_decisions:
- issue: जनगणना-वाक्यांश में लिंग-सूचक भाषा
  choice: इस्राएल की प्रजा के पुरुषों की संख्या
  alternative: इस्राएल की प्रजा की संख्या
  rationale: मूल इब्रानी में ‘पुरुषों’ के लिए स्पष्ट पुल्लिंग शब्द है। अनावश्यक व्याख्या किए बिना स्रोत की लिंग-सूचक भाषा सुरक्षित रखी गई है।
- issue: एज्रा 2:2 की समानांतर सूची में भिन्न नाम-रूप
  choice: मुख्य पाठ में नहेम्याह के मसोरेटिक रूप ‘राम्याह’ और ‘नहूम’
  alternative: रएल्याह और रहूम
  rationale: मुख्य पाठ इस पद के इब्रानी स्रोत का अनुसरण करता है; समानांतर सूची के भेदों का सामंजस्य करने के बजाय उन्हें पादटिप्पणियों में सुरक्षित रखा गया है।
