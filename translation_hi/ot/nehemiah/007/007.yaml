base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/007/007.yaml
  text: 'those who came with Zerubbabel were Jeshua[a], Nehemiah, Azariah, Raamiah, Nahamani, Mordecai, Bilshan, Mispereth, Bigvai, Nehum, and Baanah[c][b]. The number of the men of the people of Israel:'
translation:
  language: hi
  text: 'जो जरुब्बाबेल के साथ आए थे, वे थे: येशू, नहेम्याह, अजर्याह, रआम्याह[a], नहमानी, मोर्दकै, बिलशान, मिस्पेरेत, बिगवै, नेहूम[b] और बआनाह। इस्राएल की प्रजा के पुरुषों की संख्या:[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: एज्रा 2:2 की समानांतर सूची में यह नाम रएलायाह के रूप में मिलता है।
    reason: alternative_reading
  - marker: b
    text: एज्रा 2:2 की समानांतर सूची में यह नाम रहूम के रूप में मिलता है।
    reason: alternative_reading
  - marker: c
    text: यह वाक्यांश उस जनगणना की सूची का परिचय देता है जो अगले पद में आगे बढ़ती है।
    reason: cross_reference
