  rationale: निर्वासनोत्तर व्यक्तिगत नाम के इब्रानी उच्चारण के निकट लिप्यंतरण; इसे परंपरागत रूप से प्रयुक्त किसी अन्य नाम-रूप में नहीं बदला गया।
