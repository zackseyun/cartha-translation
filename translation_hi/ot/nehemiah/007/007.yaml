  register: भाषा आधुनिक, गरिमापूर्ण और सूची-पाठ के अनुकूल रखी गई है। नाम मूल इब्रानी के निकट देवनागरी में लिप्यंतरित हैं। आरंभिक संबंधवाचक वाक्य और अंतिम परिचयात्मक वाक्यांश को सहज हिन्दी क्रम में रखा गया है; सभी पादटिप्पणी-चिह्न संबंधित शब्द या वाक्यांश के साथ मुख्य पाठ में उपस्थित हैं।
