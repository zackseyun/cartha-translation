lexical_decisions:
- source_word: בְּנֵי
  choice: के वंशज
  rationale: इस वंशावली-सूची में यह पद किसी व्यक्ति के प्रत्यक्ष पुत्रों तक सीमित न होकर उसके परिवार या कुल से जुड़े लोगों को सूचित करता है; इसलिए आधुनिक हिन्दी में ‘के वंशज’ अधिक स्वाभाविक और संदर्भानुकूल है।
- source_word: בַצְלִית
  choice: बसलीत
  rationale: यह एक व्यक्तिवाचक नाम है, इसलिए इसका अर्थानुवाद न करके हिब्रू उच्चारण के निकट देवनागरी लिप्यंतरण किया गया है।
- source_word: מְחִידָא
  choice: महीदा
  rationale: यह एक व्यक्तिवाचक नाम है; हिब्रू व्यंजन और स्वरों के आधार पर इसे देवनागरी में ‘महीदा’ लिखा गया है।
- source_word: חַרְשָׁא
  choice: हर्शा
  rationale: यहाँ यह शब्द नाम के रूप में प्रयुक्त है, इसलिए संभावित शाब्दिक अर्थ आरोपित किए बिना हिब्रू उच्चारण के निकट लिप्यंतरण किया गया है।
