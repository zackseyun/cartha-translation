    issue: '''उपस्थित न हो जाए'' for עַד עֲמֹד הַכֹּהֵן'
    rationale: The Hebrew construction marks the time until a priest arises/stands. Mere 'becomes present' can suggest that any priest's physical presence is sufficient, whereas the wording anticipates the arising of the needed priestly functionary. A closer Hindi rendering preserves this without adding interpretation.
