id: NEH.7.65
reference: Nehemiah 7:65
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר הַ/תִּרְשָׁ֨תָא֙ לָ/הֶ֔ם אֲשֶׁ֥ר לֹא יֹאכְל֖וּ מִ/קֹּ֣דֶשׁ הַ/קֳּדָשִׁ֑ים עַ֛ד עֲמֹ֥ד הַ/כֹּהֵ֖ן לְ/אוּרִ֥ים וְ/תוּמִּֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/007/065.yaml
  text: And the governor said to them that they should not eat from the most holy things until a priest should arise with Urim and Thummim[a][b].
translation:
  language: hi
  text: तब राज्यपाल[a] ने उनसे कहा कि वे परमपवित्र वस्तुओं[b] में से तब तक न खाएँ, जब तक ऊरीम और तुम्मीम के साथ कोई याजक उठ खड़ा न हो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “तिर्शाता”; यह फ़ारसी प्रशासनिक पदवी थी।
    reason: lexical_alternative
  - marker: b
    text: अर्थात याजकों के लिए निर्धारित वे पवित्र भोजन-अंश जिन्हें “परमपवित्र” माना जाता था; यहाँ मन्दिर का “परमपवित्र स्थान” अभिप्रेत नहीं है।
    reason: cultural_note
lexical_decisions:
- source_word: הַתִּרְשָׁתָא
  choice: राज्यपाल
  rationale: यह फ़ारसी प्रशासनिक पदवी है। आधुनिक हिंदी में पद का अर्थ स्पष्ट करने के लिए ‘राज्यपाल’ रखा गया है; पारंपरिक लिप्यंतरण पादटिप्पणी में दिया गया है।
- source_word: אֲשֶׁר לֹא יֹאכְלוּ
  choice: कि वे ... न खाएँ
  rationale: यह राज्यपाल के निषेधात्मक निर्देश की विषयवस्तु बताता है और हिंदी में स्वाभाविक तथा स्पष्ट है।
- source_word: מִקֹּדֶשׁ הַקֳּדָשִׁים
  choice: परमपवित्र वस्तुओं में से
  rationale: इब्रानी पदबंध अतिशयोक्तिपरक अर्थ में ‘सबसे पवित्र’ वस्तुओं को सूचित करता है। प्रसंग याजकों के लिए निर्धारित पवित्र अंशों का है, न कि परमपवित्र स्थान का।
- source_word: עַד עֲמֹד הַכֹּהֵן
  choice: जब तक ... कोई याजक उपस्थित न हो जाए
  rationale: עַד के साथ रचना भविष्य की उस अवस्था को दर्शाती है जिस तक निषेध लागू रहेगा। ‘कोई याजक’ यहाँ अपेक्षित पदाधिकारी के सामान्य अर्थ को व्यक्त करता है; ‘उपस्थित न हो जाए’ हिंदी में प्रसंगानुकूल है और शाब्दिक ‘खड़ा हो’ से उत्पन्न भ्रम से बचाता है।
- source_word: לְאוּרִים וְתוּמִּים
  choice: ऊरीम और तुम्मीम के साथ
  rationale: इन पारंपरिक याजकीय पवित्र साधनों के नाम लिप्यंतरित किए गए हैं। ‘के साथ’ इब्रानी संबंधबोधक उपसर्ग के व्यापक अर्थ को बनाए रखते हुए उनके धारक या उपयोगकर्ता होने का भाव देता है।
theological_decisions:
- issue: ‘परमपवित्र वस्तुओं’ का संदर्भ
  choice: याजकों के लिए निर्धारित परमपवित्र भोजन-अंश या भेंटें
  alternative: मन्दिर का परमपवित्र स्थान
  rationale: निकटवर्ती प्रसंग संदिग्ध याजकीय वंशावली वाले लोगों के पवित्र भोजन खाने के अधिकार से संबंधित है; अतः यहाँ पवित्र अंश अभिप्रेत हैं, मन्दिर के भीतर का परमपवित्र स्थान नहीं।
- issue: फ़ारसी पदवी का अनुवाद
  choice: राज्यपाल
  alternative: तिर्शाता
  rationale: यह व्यक्तिगत नाम नहीं बल्कि प्रशासनिक पदवी है। अर्थपूर्ण हिंदी पद मुख्य पाठ में अधिक स्पष्ट है, जबकि मूल पदवी का रूप पादटिप्पणी में सुरक्षित है।
- issue: ऊरीम और तुम्मीम वाले याजक की भूमिका
  choice: पाठ की प्रतीक्षात्मक अभिव्यक्ति को बनाए रखना
  alternative: निर्णय की विधि या परिणाम को स्पष्ट रूप से जोड़ देना
  rationale: मूल पाठ केवल ऐसे याजक के उपस्थित होने तक निषेध बताता है; वह यहाँ निर्णय की प्रक्रिया या परिणाम को विस्तार से नहीं बताता। इसलिए अनुवाद में अतिरिक्त धार्मिक व्याख्या नहीं जोड़ी गई।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण और सहज शैली रखी गई है। ‘राज्यपाल’, ‘याजक’ और ‘परमपवित्र’ जैसे परिचित बाइबलीय शब्दों का प्रयोग किया गया है। दोनों पादटिप्पणी-चिह्न मुख्य पाठ में संबद्ध शब्दों के तुरंत बाद दिए गए हैं।
