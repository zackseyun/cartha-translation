  text: וּ/מִן הַ/כֹּ֣הֲנִ֔ים בְּנֵ֥י חֳבַיָּ֖ה בְּנֵ֣י הַקּ֑וֹץ בְּנֵ֣י בַרְזִלַּ֗י אֲשֶׁ֣ר לָ֠קַח מִ/בְּנ֞וֹת בַּרְזִלַּ֤י הַ/גִּלְעָדִי֙ אִשָּׁ֔ה וַ/יִּקָּרֵ֖א עַל שְׁמָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/007/063.yaml
  text: 'And from the priests: the sons of Hobaiah[a], the sons of Hakkoz, the sons of Barzillai, who had taken a wife from the daughters of Barzillai the Gileadite and was called by their name.'
translation:
  language: hi
  text: 'और याजकों में से: होबायाह के वंशज, हक्कोस के वंशज और बर्जिल्लै के वंशज। बर्जिल्लै ने गिलादी बर्जिल्लै की बेटियों में से एक को पत्नी के रूप में लिया था और उन्हीं के नाम से जाना जाने लगा।[क]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: क
    text: या, “जिसने गिलादी बर्जिल्लै की बेटियों में से एक को पत्नी के रूप में लिया और उनके नाम पर कहलाया।”
    reason: विवाह और नामकरण वाले इब्रानी उपवाक्य के लिए अंग्रेज़ी audit trail में दिए गए वैकल्पिक, निकटार्थी अनुवाद को सही स्थान पर दर्शाता है।
lexical_decisions:
