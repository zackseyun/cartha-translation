  register: आधुनिक, गरिमापूर्ण और सूची-संगत हिन्दी। ‘के वंशज’ की पुनरावृत्ति मूल की वंशावली संरचना बनाए रखती है। रिश्तेदार उपवाक्य में एकवचन पुरुष कर्ता को स्पष्ट करने के लिए ‘बर्जिल्लै ने’ दोहराया गया है।
