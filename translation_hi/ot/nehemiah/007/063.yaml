  choice: और याजकों में से
  rationale: מִן का अंशवाचक अर्थ सुरक्षित रखते हुए यह लौटने वालों में याजकीय परिवारों का उपसमूह प्रस्तुत करता है।
- source_word: בְּנֵי
  choice: के वंशज
  rationale: वंशावली-सूची में בְּנֵי परिवार या वंश के सदस्यों को सूचित करता है; आधुनिक हिन्दी में ‘वंशज’ जैविक पुत्रों तक अर्थ को सीमित नहीं करता।
- source_word: חֳבַיָּה
  choice: होबायाह
  rationale: इब्रानी नाम का हिन्दी लिप्यंतरण।
- source_word: הַקּוֹץ
  choice: हक्कोस
  rationale: उपपद सहित प्रचलित नामरूप को दर्शाने वाला हिन्दी लिप्यंतरण।
- source_word: בַרְזִלַּי
  choice: बर्जिल्लै
  rationale: परिवार और गिलादी पूर्वज, दोनों स्थानों पर नाम का एकरूप हिन्दी लिप्यंतरण।
- source_word: אֲשֶׁר לָקַח מִבְּנוֹת ... אִשָּׁה
  choice: ने ... की बेटियों में से एक को पत्नी बनाया था
  rationale: इब्रानी विवाह-संबंधी मुहावरे को स्वाभाविक हिन्दी में व्यक्त करता है और घटना की नामकरण से पूर्वता बनाए रखता है।
- source_word: הַגִּלְעָדִי
  choice: गिलादी
  rationale: यह विशेषण बर्जिल्लै का गिलाद क्षेत्र से संबंध बताता है।
- source_word: וַיִּקָּרֵא עַל שְׁמָם
  choice: और उन्हीं के नाम से जाना जाने लगा
  rationale: निफ़अल रूप और עַל שֵׁם की नाम-ग्रहण संबंधी अभिव्यक्ति को सहज हिन्दी में रखता है; बहुवचन संकेत पत्नी के परिवार/वंश की ओर है।
