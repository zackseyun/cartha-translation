- source_word: בְּנֵי
  choice: के वंशज
  rationale: निर्वासनोत्तर वंश-सूचियों में यह पद किसी व्यक्ति से निकले परिवार या कुल को सूचित करता है। शाब्दिक ‘पुत्र’ के बजाय ‘वंशज’ आधुनिक हिन्दी में सूची का आशय अधिक स्वाभाविक और स्पष्ट रूप से व्यक्त करता है।
- source_word: יַעְלָא
