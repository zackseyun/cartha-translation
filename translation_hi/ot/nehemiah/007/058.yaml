  rationale: यह व्यक्तिवाचक नाम है; इब्रानी रूप का देवनागरी लिप्यंतरण किया गया है।
- source_word: דַרְקוֹן
  choice: दार्कोन
  rationale: यह व्यक्तिवाचक नाम है; इसका अनुवाद न करके इब्रानी उच्चारण के निकट लिप्यंतरण किया गया है।
- source_word: גִדֵּל
  choice: गिद्देल
  rationale: यह व्यक्तिवाचक नाम है; दागेश से सूचित द्वित्व को ‘द्द’ द्वारा दर्शाते हुए लिप्यंतरण किया गया है।
