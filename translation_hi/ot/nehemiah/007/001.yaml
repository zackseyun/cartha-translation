source:
  edition: WLC
  text: וַ/יְהִ֗י כַּ/אֲשֶׁ֤ר נִבְנְתָה֙ הַ/חוֹמָ֔ה וָ/אַעֲמִ֖יד הַ/דְּלָת֑וֹת וַ/יִּפָּֽקְד֛וּ הַ/שּׁוֹעֲרִ֥ים וְ/הַ/מְשֹׁרְרִ֖ים וְ/הַ/לְוִיִּֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/007/001.yaml
  text: When the wall had been built and I had set up the doors[a], the gatekeepers, the singers[b], and the Levites were appointed.
translation:
  language: hi
  text: जब दीवार बन चुकी थी[b] और मैंने दरवाज़े लगा दिए, तब द्वारपाल, गायक और लेवी नियुक्त किए गए[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इसका अनुवाद ‘काम सौंपा गया’ या ‘नाम दर्ज किया गया’ भी हो सकता है; इब्रानी क्रिया का प्रशासनिक अर्थ केवल औपचारिक नियुक्ति से अधिक व्यापक हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: इसका अनुवाद ‘दीवार बनाई गई’ भी हो सकता है। ‘बन चुकी थी’ कथानक में घटनाओं के क्रम को स्पष्ट करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כַּאֲשֶׁר
  choice: जब
  rationale: यह पदबंध कथा में समय-संबंधी परिस्थिति प्रस्तुत करता है। आधुनिक हिन्दी में ‘जब’ स्वाभाविक है और अनावश्यक ‘और ऐसा हुआ’ से बचता है।
- source_word: נִבְנְתָה הַחוֹמָה
  choice: दीवार बन चुकी थी
  rationale: निफ़अल रूप कर्मवाच्य है। ‘बन चुकी थी’ आगे बताई गई प्रशासनिक कार्रवाई से पहले दीवार का काम पूरा होने का कथात्मक क्रम स्पष्ट करता है; मूल में ‘फिर से’ निहित न होने के कारण ‘दोबारा बनाई गई’ नहीं चुना गया।
- source_word: וָאַעֲמִיד הַדְּלָתוֹת
  choice: मैंने दरवाज़े लगा दिए
  rationale: हिफ़ईल עמד यहाँ दरवाज़ों को उनके स्थान पर खड़ा करने या लगाने का भाव देता है। हिन्दी में ‘दरवाज़े लगा दिए’ इसी क्रिया का सहज रूप है।
- source_word: וַיִּפָּקְדוּ
  choice: नियुक्त किए गए
  rationale: निफ़अल פקד यहाँ लोगों को प्रशासनिक दायित्व सौंपे जाने का संकेत देता है। ‘नियुक्त किए गए’ मुख्य अर्थ को सहज ढंग से व्यक्त करता है, जबकि व्यापक संभावनाएँ पादटिप्पणी में सुरक्षित हैं।
- source_word: הַשּׁוֹעֲרִים
  choice: द्वारपाल
  rationale: यह नगर या उपासना-व्यवस्था के फाटकों/द्वारों की देखरेख करने वालों के लिए प्रचलित और संक्षिप्त हिन्दी शब्द है।
- source_word: הַמְשֹׁרְרִים
  choice: गायक
  rationale: שׁיר से बना यह पद विशेषतः उपासना-संबंधी गायकों को दर्शाता है; ‘गायक’ सीधा और स्वाभाविक अनुवाद है।
- source_word: הַלְוִיִּם
  choice: लेवी
  rationale: यह धार्मिक-वंशीय समुदाय का मानक हिन्दी नाम है।
