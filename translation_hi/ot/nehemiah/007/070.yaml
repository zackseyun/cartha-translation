source:
  edition: WLC
  text: וּ/מֵֽ/רָאשֵׁ֣י הָֽ/אָב֗וֹת נָֽתְנוּ֙ לְ/אוֹצַ֣ר הַ/מְּלָאכָ֔ה זָהָ֕ב דַּרְכְּמוֹנִ֖ים שְׁתֵּ֣י רִבּ֑וֹת וְ/כֶ֕סֶף מָנִ֖ים אַלְפַּ֥יִם וּ/מָאתָֽיִם׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/007/070.yaml
  text: 'And some of the heads of the fathers’ houses gave to the treasury for the work: twenty thousand gold darics and two thousand two hundred minas of silver[a][b][c].'
translation:
  language: hi
  text: और पितृकुलों के मुखियाओं में से कुछ ने कार्य के कोष के लिए सोने के बीस हज़ार दारिक[a] और चाँदी के दो हज़ार दो सौ माने[b] दिए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: दारिक फ़ारस की एक सोने की मुद्रा थी।
    reason: cultural_note
  - marker: b
    text: माना प्राचीन काल में भार की, और उसी आधार पर धन-मूल्य की, एक इकाई था।
    reason: cultural_note
lexical_decisions:
- source_word: וּמֵרָאשֵׁי הָאָבוֹת
  choice: और पितृकुलों के प्रधानों में से कुछ
  rationale: מִן का भाव ‘में से’ है और संदर्भ में कुछ प्रधानों द्वारा देने की बात है। ‘पितृकुल’ वंश-आधारित सामाजिक इकाई को आधुनिक, संक्षिप्त हिन्दी में सुरक्षित रखता है।
- source_word: נָתְנוּ
  choice: दी
  rationale: साधारण कालगत क्रिया ‘देना’ मूल के सीधे अर्थ को बिना अतिरिक्त व्याख्या के व्यक्त करती है।
- source_word: לְאוֹצַר הַמְּלָאכָה
  choice: निर्माण-कार्य के भंडार में
  rationale: אוֹצָר यहाँ बहुमूल्य अंशदान रखने का भंडार/कोष है; पूर्वपद לְ को ‘में’ कहना अंशदान जमा किए जाने के भाव के अनुकूल है। ‘निर्माण-कार्य’ इस संदर्भ में परियोजना के कार्य को स्पष्ट करता है।
- source_word: זָהָב דַּרְכְּמוֹנִים
  choice: सोने के दारिक
  rationale: दारिक विशिष्ट फ़ारसी स्वर्ण-मुद्रा है; ऐतिहासिक नाम बनाए रखना किसी अनिश्चित आधुनिक समतुल्य से अधिक सटीक है।
- source_word: שְׁתֵּי רִבּוֹת
  choice: बीस हज़ार
  rationale: शाब्दिक ‘दो दस-हज़ार’ का स्वाभाविक आधुनिक हिन्दी संख्यात्मक रूप।
- source_word: וְכֶסֶף מָנִים
  choice: माने चाँदी
  rationale: מָנִים प्राचीन भार तथा मूल्य की इकाई का बहुवचन है। ‘माने चाँदी’ मूल क्रम को निकटता से रखते हुए हिन्दी में बोधगम्य है।
- source_word: אַלְפַּיִם וּמָאתָיִם
  choice: दो हज़ार दो सौ
  rationale: मूल संख्या का स्वाभाविक आधुनिक हिन्दी रूप।
theological_decisions: []
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण रूप अपनाया गया है। ‘पितृकुल’ से प्राचीन वंश-आधारित संरचना और ‘दारिक’ तथा ‘माना’ से ऐतिहासिक इकाइयाँ सुरक्षित रखी गई हैं; अपरिचित इकाइयों को पादटिप्पणियों में समझाया गया है।
