  register: आधुनिक, गरिमापूर्ण और सूची के अनुरूप संक्षिप्त हिन्दी। मूल के तीन समानांतर בְּנֵי-वाक्यांशों को ‘के वंशज’ की पुनरावृत्ति से सुरक्षित रखा गया है। अंग्रेज़ी परामर्श-पाठ में बरकोस पर दिया गया ‘तामह’ विकल्प स्रोत-पाठ से मेल नहीं खाता, क्योंकि תָמַח तीसरा अलग नाम है; इसलिए उस त्रुटिपूर्ण पाद-टिप्पणी को शामिल नहीं किया गया।
