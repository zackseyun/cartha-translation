- source_word: בְּנֵי
  choice: के वंशज
  rationale: वंशावली-सूची के इस संदर्भ में בְּנֵי किसी व्यक्ति के प्रत्यक्ष पुत्रों की अपेक्षा उसके परिवार या वंश के सदस्यों को सूचित करता है; इसलिए आधुनिक हिन्दी में ‘के वंशज’ स्वाभाविक और अर्थ-सटीक है।
- source_word: בַרְקוֹס
  choice: बरकोस
  rationale: व्यक्तिवाचक अथवा कुलनाम को हिब्रू उच्चारण के निकट देवनागरी में लिप्यंतरित किया गया है।
- source_word: סִיסְרָא
  choice: सीसरा
  rationale: नाम को मासोरेटी स्वरांकन के अनुसार देवनागरी में लिप्यंतरित किया गया है; यहाँ यह सूची में एक कुलनाम के रूप में प्रयुक्त है।
- source_word: תָמַח
  choice: तेमह
  rationale: मासोरेटी स्वरांकन תָמַח के अनुसार नाम का लिप्यंतरण ‘तेमह’ किया गया है। हिब्रू पाठ में यह नाम बरकोस से नहीं, बल्कि तीसरे अलग वंश से संबंधित है।
