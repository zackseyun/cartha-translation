lexical_decisions:
- source_word: כָּל
  choice: सब … कुल
  rationale: यह शब्द दोनों नामित समूहों की कुल संख्या बताता है; हिन्दी में ‘सब’ के साथ संख्या से पहले ‘कुल’ रखने से जनगणना-सूची का आशय स्वाभाविक और स्पष्ट होता है।
- source_word: הַנְּתִינִים
  choice: मन्दिर के सेवक
  rationale: यह निर्वासन के बाद के समुदाय में मन्दिर की सेवा से जुड़े एक मान्य वर्ग का नाम है। कार्यपरक अनुवाद आधुनिक पाठक के लिए स्पष्ट है; पारम्परिक लिप्यन्तरण पाद-टिप्पणी में दिया गया है।
- source_word: וּבְנֵי
  choice: और … के वंशज
  rationale: शाब्दिक अर्थ ‘और … के पुत्र’ है, पर ऐसी सामुदायिक सूचियों में בְּנֵי किसी पूर्वज या वर्ग के वंशजों को सूचित कर सकता है; हिन्दी में ‘वंशज’ आशय को अधिक स्वाभाविक ढंग से व्यक्त करता है।
- source_word: עַבְדֵי
  choice: सेवकों
  rationale: עֶבֶד का अर्थ ‘सेवक’ या ‘दास’ हो सकता है। यहाँ सुलैमान से संबद्ध एक सामाजिक-प्रशासनिक वर्ग का नाम है, इसलिए ‘सेवक’ उपयुक्त और अनावश्यक रूप से स्थिति का निर्धारण न करने वाला विकल्प है।
- source_word: שְׁלֹמֹה
  choice: सुलैमान
  rationale: व्यक्तिनाम को प्रचलित मानक हिन्दी बाइबलीय रूप में दिया गया है।
- source_word: שְׁלֹשׁ מֵאוֹת תִּשְׁעִים וּשְׁנָיִם
  choice: तीन सौ बानवे
  rationale: इब्रानी संख्या को सतत गद्य के लिए अंकों के बजाय स्वाभाविक हिन्दी शब्दों में प्रस्तुत किया गया है।
