source:
  edition: WLC
  text: וּ/מִ/קְצָת֙ רָאשֵׁ֣י הָֽ/אָב֔וֹת נָתְנ֖וּ לַ/מְּלָאכָ֑ה הַ/תִּרְשָׁ֜תָא נָתַ֣ן לָ/אוֹצָ֗ר זָהָ֞ב דַּרְכְּמֹנִ֥ים אֶ֨לֶף֙ מִזְרָק֣וֹת חֲמִשִּׁ֔ים כָּתְנוֹת֙ כֹּֽהֲנִ֔ים שְׁלֹשִׁ֖ים וַ/חֲמֵ֥שׁ מֵאֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/007/069.yaml
  text: And some of the heads of the fathers’ houses gave to the work[a]. The governor gave to the treasury one thousand gold darics, fifty basins[c][b], and five hundred thirty-five priests’ tunics.
translation:
  language: hi
  text: और पितृकुलों के कुछ प्रधानों ने काम के लिए दान दिया। राज्यपाल[a] ने कोष में सोने के एक हज़ार दारिक[b], पचास कटोरे और याजकों के पाँच सौ पैंतीस अंगरखे[c] दिए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘तिर्शाता’; यह एक फ़ारसी प्रशासनिक पदवी थी।
    reason: lexical_alternative
  - marker: b
    text: दारिक फ़ारसी सोने का सिक्का था।
    reason: cultural_note
  - marker: c
    text: इब्रानी पाठ में ‘पाँच सौ पैंतीस’ है। एज्रा 2:69 के समानांतर वृत्तांत में ‘एक सौ’ याजकीय अंगरखे हैं; कुछ अनुवाद यहाँ समानांतर वृत्तांत के अनुसार संख्या देते हैं या किसी भिन्न पाठ-परंपरा को दर्शाते हैं।
    reason: textual_variant
lexical_decisions:
- source_word: וּמִקְצָת רָאשֵׁי הָאָבוֹת
  choice: और पितृकुलों के कुछ प्रधानों
  rationale: ‘कुछ’ समूह के एक भाग का बोध कराता है; ‘पितृकुल’ उत्तर-निर्वासनकालीन वंशगत सामाजिक इकाई को और ‘प्रधान’ उसके अगुओं को व्यक्त करता है।
- source_word: לַמְּלָאכָה
  choice: काम के लिए
  rationale: यहाँ מְלָאכָה पुनर्निर्माण से जुड़े सामूहिक कार्य को सूचित करता है; ‘काम के लिए’ स्वाभाविक और संदर्भानुकूल है।
- source_word: הַתִּרְשָׁתָא
  choice: अधिपति
  rationale: यह फ़ारसी प्रशासनिक पदवी है। ‘अधिपति’ पद के अर्थ को स्पष्ट करता है, जबकि मूल पदनाम को पादटिप्पणी में रखा गया है।
- source_word: לָאוֹצָר
  choice: भंडार में
  rationale: मूल शब्द धन या मूल्यवान वस्तुएँ रखने के भंडार को दर्शाता है; दान की सूची में ‘भंडार’ उपयुक्त है।
- source_word: זָהָב דַּרְכְּמֹנִים אֶלֶף
  choice: सोने के एक हज़ार दारिक
  rationale: दारिक फ़ारसी सोने का विशिष्ट सिक्का था; ऐतिहासिक नाम को बनाए रखने से मात्रा और वस्तु दोनों ठीक व्यक्त होते हैं।
- source_word: מִזְרָקוֹת
  choice: कटोरे
  rationale: यह शब्द धार्मिक उपयोग के पात्रों या कटोरों के लिए आता है; ‘कटोरे’ सामान्य पाठक के लिए स्पष्ट है और अनावश्यक विशिष्टता नहीं जोड़ता।
- source_word: כָּתְנוֹת כֹּהֲנִים
  choice: याजकों के अंगरखे
  rationale: כָּתְנוֹת शरीर पर पहने जाने वाले लंबे वस्त्र थे; ‘अंगरखे’ उनके वस्त्र-स्वरूप को सहज हिन्दी में व्यक्त करता है।
- source_word: שְׁלֹשִׁים וַחֲמֵשׁ מֵאוֹת
  choice: पाँच सौ पैंतीस
  rationale: मसोरेटिक इब्रानी पाठ का क्रम ‘तीस और पाँच सौ’ कुल 535 को दर्शाता है; समानांतर पाठ से सामंजस्य बैठाने के बजाय इसी पाठ का अनुवाद किया गया है।
