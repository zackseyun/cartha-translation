  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण गद्य अपनाया गया है। प्रशासनिक पद का अर्थ मुख्य पाठ में दिया गया है और मूल फ़ारसी पदवी पादटिप्पणी में सुरक्षित रखी गई है। मसोरेटिक पाठ की संख्या को बिना सामंजस्य किए रखा गया है।
