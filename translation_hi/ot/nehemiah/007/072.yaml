id: NEH.7.72
reference: Nehemiah 7:72
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יֵּשְׁב֣וּ הַ/כֹּהֲנִ֣ים וְ/הַ/לְוִיִּ֡ם וְ/הַ/שּׁוֹעֲרִים֩ וְ/הַ/מְשֹׁרְרִ֨ים וּ/מִן הָ/עָ֧ם וְ/הַ/נְּתִינִ֛ים וְ/כָל יִשְׂרָאֵ֖ל בְּ/עָרֵי/הֶ֑ם וַ/יִּגַּע֙ הַ/חֹ֣דֶשׁ הַ/שְּׁבִיעִ֔י וּ/בְנֵ֥י יִשְׂרָאֵ֖ל בְּ/עָרֵי/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/007/072.yaml
  text: So the priests[a], the Levites, the gatekeepers, the singers, some of the people, the temple servants, and all Israel lived in their cities. And when the seventh month arrived[b], the sons of Israel were in their cities.
translation:
  language: hi
  text: इस प्रकार याजक, लेवी, द्वारपाल, गायक, लोगों में से कुछ, मन्दिर के सेवक[a] और समस्त इस्राएल अपने-अपने नगरों में बस गए। और जब सातवाँ महीना आया, तब इस्राएल के पुत्र[b] अपने-अपने नगरों में थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘नतीनीम’; यह मन्दिर-सेवकों के इस वर्ग के नाम का पारम्परिक लिप्यन्तरण है।
    reason: lexical_alternative
  - marker: b
    text: या ‘इस्राएली’ अथवा ‘इस्राएल के लोग।’ इब्रानी में शाब्दिक रूप से ‘इस्राएल के पुत्र’ है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּשְׁבוּ
  choice: बस गए
  rationale: पुनर्वास के इस प्रसंग में ישׁב का अर्थ निवास ग्रहण करना है; ‘बस गए’ स्वाभाविक हिन्दी में इस भाव को व्यक्त करता है।
- source_word: הַכֹּהֲנִים
  choice: याजक
  rationale: כהנים के लिए प्रचलित और स्पष्ट हिन्दी पद।
- source_word: הַלְוִיִּם
  choice: लेवी
  rationale: लेवीवंशी मन्दिर-सेवकों के वर्ग के लिए हिन्दी बाइबलीय प्रयोग में प्रचलित नाम।
- source_word: הַשּׁוֹעֲרִים
  choice: द्वारपाल
  rationale: मन्दिर अथवा नगर के द्वारों की रखवाली करनेवालों के कार्य को सीधे व्यक्त करता है।
- source_word: הַמְשֹׁרְרִים
  choice: गायक
  rationale: यह कृदन्त विशेषकर मन्दिर-सेवा में गानेवालों को सूचित करता है।
- source_word: וּמִן הָעָם
  choice: लोगों में से कुछ
  rationale: מן का अंशसूचक अर्थ सुरक्षित रखते हुए यह स्पष्ट करता है कि सामान्य लोगों का एक भाग अभिप्रेत है।
- source_word: הַנְּתִינִים
  choice: मन्दिर के सेवक
  rationale: इस विशिष्ट मन्दिर-सेवी वर्ग के कार्य को आधुनिक पाठक के लिए स्पष्ट करता है; पारम्परिक लिप्यन्तरण पादटिप्पणी में दिया गया है।
- source_word: וְכָל יִשְׂרָאֵל
  choice: और समस्त इस्राएल
  rationale: सामूहिक वाचा-समुदाय के लिए मूल की सीधी और प्रतिष्ठित अभिव्यक्ति।
- source_word: בְּעָרֵיהֶם
  choice: अपने-अपने नगरों में
  rationale: ‘अपने-अपने’ बहुवचन समूहों के उनके सम्बद्ध नगरों में निवास को स्वाभाविक हिन्दी में स्पष्ट करता है।
- source_word: וַיִּגַּע
  choice: आया
  rationale: समयवाचक पद के साथ נגע का मुहावरेदार अर्थ किसी महीने का आ पहुँचना है; ‘आया’ सरल और स्वाभाविक है।
- source_word: הַחֹדֶשׁ הַשְּׁבִיעִי
  choice: सातवाँ महीना
  rationale: इब्रानी पंचांग-सूचक अभिव्यक्ति का सीधा अनुवाद।
- source_word: וּבְנֵי יִשְׂרָאֵל
  choice: इस्राएल के पुत्र
  rationale: בני की स्पष्ट पुल्लिंग संरचना को बनाए रखता है, यद्यपि प्रसंग में यह पूरे इस्राएली समुदाय का जातिनाम है।
theological_decisions:
- issue: בני ישראל का लिंगयुक्त सामूहिक प्रयोग
  choice: इस्राएल के पुत्र
  alternative: इस्राएली / इस्राएल के लोग
  rationale: मूल की ‘पुत्र’ वाली संरचना मुख्य पाठ में सुरक्षित रखी गई है, जबकि सामूहिक जातिनाम वाला अर्थ पादटिप्पणी में स्पष्ट किया गया है।
- issue: נתינים का संस्थागत नाम
  choice: मन्दिर के सेवक
  alternative: नतीनीम
  rationale: कार्यपरक अनुवाद सामान्य पाठक के लिए अर्थ स्पष्ट करता है, और पारम्परिक नाम पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। सूची की औपचारिक लय और दोनों वाक्यों को जोड़नेवाला इब्रानी संयोजक सुरक्षित है। ‘मन्दिर’ की मानक वर्तनी और ‘अपने-अपने नगरों’ का स्वाभाविक हिन्दी मुहावरा अपनाया गया है।
