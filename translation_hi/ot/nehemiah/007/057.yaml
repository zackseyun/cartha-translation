lexical_decisions:
- source_word: בְּנֵי
  choice: सन्तान
  rationale: वंशावली और लौटने वालों की सूचियों में यह शब्द केवल सीधे पुत्रों के लिए नहीं, बल्कि किसी परिवार या वंश के सदस्यों के लिए भी प्रयुक्त होता है। ‘सन्तान’ इस व्यापक अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है और हिब्रू की दोहरावपूर्ण सूची-रचना को बनाए रखता है।
- source_word: עַבְדֵי
  choice: सेवकों
  rationale: यहाँ ‘सुलैमान के सेवक’ एक पहचाने जाने वाले वंशानुगत समूह का नाम है। ‘सेवक’ प्रसंग के अनुकूल है और बिना पर्याप्त आधार के ‘दास’ की अधिक संकीर्ण सामाजिक स्थिति आरोपित नहीं करता।
- source_word: שְׁלֹמֹה
  choice: सुलैमान
  rationale: हिन्दी बाइबलीय परम्परा में प्रचलित और पाठकों के लिए सहज नाम-रूप।
- source_word: סוֹטַי
  choice: सोतै
  rationale: मसोरेटिक स्वरांकन के निकट देवनागरी लिप्यन्तरण।
- source_word: סוֹפֶרֶת
  choice: सोफेरेत
  rationale: यहाँ यह परिवार का नाम है, सामान्य संज्ञा नहीं; इसलिए इसका अनुवाद करने के बजाय लिप्यन्तरण किया गया है।
- source_word: פְרִידָא
  choice: परीदा
  rationale: मसोरेटिक उच्चारण के निकट, हिन्दी में सहज देवनागरी लिप्यन्तरण।
