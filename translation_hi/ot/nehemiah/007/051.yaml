- source_word: בְּנֵי
  choice: के वंशज
  rationale: वंशावली-सूची में इसका अर्थ केवल प्रत्यक्ष पुत्र नहीं, बल्कि व्यापक पारिवारिक वंश भी हो सकता है। हिंदी में ‘के वंशज’ इस आशय को स्वाभाविक और स्पष्ट रूप से व्यक्त करता है।
- source_word: גַזָּם
  choice: गज्जाम
  rationale: इब्रानी व्यक्तिनाम का देवनागरी लिप्यंतरण; זּ की द्वित्व ध्वनि को ‘ज्ज’ से दर्शाया गया है।
- source_word: עֻזָּא
  choice: उज्जा
  rationale: इब्रानी व्यक्तिनाम का देवनागरी लिप्यंतरण; זּ की द्वित्व ध्वनि को ‘ज्ज’ से दर्शाया गया है।
- source_word: פָסֵחַ
  choice: पासेह
  rationale: इब्रानी व्यक्तिनाम का देवनागरी लिप्यंतरण; अंतिम ח को हिंदी में सुगम निकटतम रूप ‘ह’ से व्यक्त किया गया है।
