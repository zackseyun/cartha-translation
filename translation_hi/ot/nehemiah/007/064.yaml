  text: אֵ֗לֶּה בִּקְשׁ֧וּ כְתָבָ֛/ם הַ/מִּתְיַחְשִׂ֖ים וְ/לֹ֣א נִמְצָ֑א וַ/יְגֹֽאֲל֖וּ מִן הַ/כְּהֻנָּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/007/064.yaml
  text: These sought their record among those enrolled by genealogy[a], but it was not found[b], so they were excluded from the priesthood.
translation:
  language: hi
  text: इन लोगों ने वंशावली में दर्ज अपना अभिलेख ढूँढ़ा[a], पर वह नहीं मिला; इसलिए उन्हें याजकपद से अपात्र ठहराया गया[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अपना वंशावली-अभिलेख ढूँढ़ा।” इब्रानी में वंश सिद्ध करने वाले लिखित दस्तावेज़ का संकेत है।
    reason: lexical_alternative
  - marker: b
    text: या, “उन्हें याजकपद से अपवित्र ठहराया गया।” प्रसंग में, वंश प्रमाणित न हो पाने के कारण उन्हें याजकीय पद के लिए अपात्र ठहराया गया।
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה
  choice: इन लोगों ने
  rationale: बहुवचन संकेतवाचक शब्द पिछले पदों में बताए गए समूह की ओर संकेत करता है। स्वाभाविक हिन्दी के लिए ‘लोगों’ जोड़ा गया है।
- source_word: בִּקְשׁוּ
  choice: ढूँढ़ा
  rationale: בקשׁ का सामान्य अर्थ खोजने या ढूँढ़ने का प्रयत्न करना है; यहाँ लिखित अभिलेख की खोज हो रही है।
- source_word: כְתָבָם
  choice: अपना अभिलेख
  rationale: כְּתָב किसी लिखित दस्तावेज़ या लेख को दर्शाता है। प्रशासनिक-वंशावली प्रसंग में ‘अभिलेख’ उसके आधिकारिक लिखित प्रमाण का अर्थ स्पष्ट करता है।
- source_word: הַמִּתְיַחְשִׂים
  choice: वंशावली में दर्ज लोगों के लेखों में
  rationale: יחשׂ का हित्पएल रूप वंश के अनुसार पंजीकरण अथवा वंश-संबंध स्थापित करने को व्यक्त करता है। हिन्दी वाक्यांश लिखित वंशावली-संग्रह में खोज किए जाने का भाव देता है, यद्यपि इब्रानी रचना संक्षिप्त और कुछ कठिन है।
- source_word: וְלֹא נִמְצָא
  choice: पर वह नहीं मिला
  rationale: एकवचन क्रिया का स्वाभाविक कर्ता खोजा जा रहा लिखित अभिलेख है, न कि वे लोग।
- source_word: וַיְגֹאֲלוּ
  choice: अयोग्य मानकर अलग कर दिया गया
  rationale: इस प्रसंग में क्रिया का परिणाम याजकीय पद से अपात्र ठहराया जाना है। यह अनुवाद प्रशासनिक परिणाम स्पष्ट करता है, जबकि शाब्दिक ‘अशुद्ध ठहराए गए’ को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: מִן הַכְּהֻנָּה
  choice: याजकपद से
  rationale: כְּהֻנָּה याजकीय पद या याजक-सेवा को दर्शाता है। ‘याजकपद’ संक्षिप्त और संस्थागत अर्थ के अनुरूप है।
theological_decisions:
- issue: वंश प्रमाणित न होने पर याजकीय स्थिति
  choice: उन्हें याजकपद के अयोग्य मानकर अलग कर दिया गया
  alternative: उन्हें याजकपद से अशुद्ध ठहराया गया
  rationale: मूल क्रिया में अशुद्ध या दूषित माने जाने की भाषा है, पर प्रसंग में उसका व्यावहारिक अर्थ सत्यापित वंशावली के अभाव में याजकीय पद से अपात्रता है। मुख्य पाठ परिणाम को स्पष्ट करता है और पादटिप्पणी मूल रूपक को बचाती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘अभिलेख,’ ‘वंशावली’ और ‘याजकपद’ प्रशासनिक तथा धार्मिक प्रसंग की औपचारिकता बनाए रखते हैं।
