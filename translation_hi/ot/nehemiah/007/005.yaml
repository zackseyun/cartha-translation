id: NEH.7.5
reference: Nehemiah 7:5
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יִּתֵּ֤ן אֱלֹהַ/י֙ אֶל לִבִּ֔/י וָ/אֶקְבְּצָ֞/ה אֶת הַ/חֹרִ֧ים וְ/אֶת הַ/סְּגָנִ֛ים וְ/אֶת הָ/עָ֖ם לְ/הִתְיַחֵ֑שׂ וָֽ/אֶמְצָ֗א סֵ֤פֶר הַ/יַּ֨חַשׂ֙ הָ/עוֹלִ֣ים בָּ/רִאשׁוֹנָ֔ה וָ/אֶמְצָ֖א כָּת֥וּב בּֽ/וֹ־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/007/005.yaml
  text: 'Then my God put it into my heart to assemble the nobles[a], the officials, and the people to be enrolled by genealogy. And I found the book of the genealogy of those who came up first[b], and I found written in it:'
translation:
  language: hi
  text: 'तब मेरे परमेश्वर ने मेरे मन में यह बात डाली कि मैं कुलीनों, अधिकारियों और लोगों को इकट्ठा करूँ, ताकि वंशावली के अनुसार उनका पंजीकरण किया जाए।[a] तब मुझे उन लोगों की वंशावली की पुस्तक मिली जो पहले लौटकर आए थे,[b] और उसमें मुझे यह लिखा मिला:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “ताकि वंश के अनुसार उनके नाम दर्ज किए जाएँ।” इब्रानी में परिवार अथवा वंश के आधार पर आधिकारिक पंजीकरण का भाव है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “जो पहले ऊपर आए थे।” इसका संकेत निर्वासन से यहूदा की ओर आने वाले पहले समूह से है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֵּן אֱלֹהַי אֶל־לִבִּי
  choice: मेरे परमेश्वर ने मेरे मन में यह बात डाली
  rationale: इब्रानी मुहावरे का शाब्दिक अर्थ ‘मेरे परमेश्वर ने मेरे हृदय को दिया’ है। हिन्दी में यह चयन परमेश्वर की पहल और नहेमायाह को भीतर से मिली प्रेरणा—दोनों को स्वाभाविक ढंग से व्यक्त करता है, पर प्रकाशन की रीति को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: וָאֶקְבְּצָה
  choice: कि मैं ... इकट्ठा करूँ
  rationale: यह रूप यहाँ परमेश्वर द्वारा मन में डाली गई बात के आशय अथवा उद्देश्य को व्यक्त करता है। ‘कि मैं ... इकट्ठा करूँ’ हिन्दी में इस संबंध को स्पष्ट और स्वाभाविक रखता है।
- source_word: הַחֹרִים
  choice: कुलीनों
  rationale: नहेमायाह के प्रशासनिक संदर्भ में यह शब्द समाज के प्रतिष्ठित अथवा उच्चवर्गीय अगुओं के लिए प्रयुक्त है; ‘कुलीन’ आधुनिक हिन्दी में संक्षिप्त और उपयुक्त है।
- source_word: הַסְּגָנִים
  choice: अधिकारियों
  rationale: यह अधीनस्थ शासकीय अथवा प्रशासनिक पदाधिकारियों को सूचित करता है। ‘अधिकारी’ किसी अत्यधिक विशिष्ट पदनाम को आरोपित किए बिना अर्थ व्यक्त करता है।
- source_word: הָעָם
  choice: लोगों
  rationale: यहाँ यह कुलीनों और अधिकारियों से भिन्न सामान्य जनसमुदाय को दर्शाता है।
- source_word: לְהִתְיַחֵשׂ
  choice: ताकि वंशावली के अनुसार उनका पंजीकरण किया जाए
  rationale: हित्पएल रूप परिवार अथवा वंश के आधार पर आधिकारिक रूप से नाम दर्ज किए जाने को बताता है। निष्क्रिय हिन्दी रचना मूल में निहित पंजीकरण की प्रक्रिया को बनाए रखती है और यह अनावश्यक रूप से तय नहीं करती कि नाम कौन दर्ज करेगा।
- source_word: סֵפֶר הַיַּחַשׂ
  choice: वंशावली की पुस्तक
  rationale: यह किसी वास्तविक लिखित वंश-संबंधी अभिलेख का उल्लेख है। यह अनुवाद मूल के ‘पुस्तक’ और ‘वंशावली’ दोनों तत्वों को बनाए रखता है।
- source_word: הָעוֹלִים בָּרִאשׁוֹנָה
  choice: जो पहले लौटकर आए थे
  rationale: शाब्दिक रूप से ये वे लोग हैं जो ‘पहले ऊपर आए थे’, अर्थात निर्वासन से यहूदा की ओर आने वाला आरम्भिक समूह। मुख्य पाठ में ‘लौटकर आए’ प्रसंग को सहज हिन्दी में स्पष्ट करता है; चढ़कर आने की मूल छवि पादटिप्पणी में दी गई है।
- source_word: וָאֶמְצָא כָתוּב בּוֹ
  choice: 'और उसमें मुझे यह लिखा मिला:'
  rationale: यह अगले पदों में दिए गए अभिलेख का परिचय देता है। अन्त का द्विबिंदु आगे आने वाली सूची के लिए स्वाभाविक संकेत है।
theological_decisions:
- issue: नहेमायाह के नेतृत्व में परमेश्वर की भीतरी प्रेरणा
  choice: मेरे परमेश्वर ने मेरे मन में यह बात डाली
  alternative: मेरे परमेश्वर ने मुझे प्रेरणा दी
  rationale: मूल पाठ परमेश्वर की क्रिया को नहेमायाह के भीतर उत्पन्न प्रेरणा के रूप में प्रस्तुत करता है, पर उसकी रीति को परिभाषित नहीं करता। चयनित भाषा न तो इसे औपचारिक प्रकाशन घोषित करती है, न केवल नहेमायाह का निजी विचार बनाती है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की है, किंतु ऐतिहासिक-अभिलेखीय प्रसंग के अनुरूप गरिमापूर्ण रखी गई है। ‘कुलीन’, ‘अधिकारी’, ‘पंजीकरण’ और ‘वंशावली की पुस्तक’ प्रशासनिक तथा वंश-संबंधी अर्थ को सामान्य पाठक के लिए स्पष्ट रखते हैं।
