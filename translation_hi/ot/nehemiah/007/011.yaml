lexical_decisions:
- source_word: בְּנֵי
  choice: पुत्रों
  rationale: गणना और वंशावली की इस सूची में यह शब्द किसी व्यापक वंश या कुल के सदस्यों को सूचित कर सकता है। ‘पुत्रों’ मूल इब्रानी मुहावरे को बनाए रखता है; व्यापक अर्थ पादटिप्पणी में स्पष्ट किया गया है।
- source_word: פַחַת מוֹאָב
  choice: पहत-मोआब
  rationale: यह एक व्यक्तिनाम/कुलनाम है, इसलिए इसका अर्थानुवाद न करके देवनागरी में लिप्यंतरण किया गया है।
- source_word: לִבְנֵי
  choice: में से ... के पुत्र
  rationale: उपसर्ग ל यहाँ पहत-मोआब के कुल के भीतर येशूअ और योआब से संबंधित उपसमूह का संकेत देता है। ‘में से’ हिंदी में इस वर्गीकरण को स्वाभाविक रूप से व्यक्त करता है।
- source_word: יֵשׁוּעַ
  choice: येशूअ
  rationale: उत्तर-निर्वासन काल के इस नाम के इब्रानी रूप को निकटता से दर्शाने के लिए ‘येशूअ’ लिप्यंतरित किया गया है।
- source_word: וְיוֹאָב
  choice: और योआब
  rationale: संयोजक व के साथ व्यक्तिनाम का सीधा और प्रचलित देवनागरी लिप्यंतरण।
- source_word: אַלְפַּיִם וּשְׁמֹנֶה מֵאוֹת שְׁמֹנָה עָשָׂר
  choice: 2,818
  rationale: इब्रानी संख्या ठीक 2,818 है। जनगणना-सूची में अंकों का प्रयोग संक्षिप्त और स्पष्ट है।
