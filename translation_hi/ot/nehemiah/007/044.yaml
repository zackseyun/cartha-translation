- source_word: בְּנֵי
  choice: वंशज
  rationale: इस वंशावली-सूची में בְּנֵי केवल प्रत्यक्ष पुत्रों तक सीमित न होकर कुल या परंपरागत समूह के सदस्यों को भी सूचित कर सकता है। ‘वंशज’ हिन्दी में अपेक्षित अर्थ स्पष्ट करता है, जबकि पादटिप्पणी अधिक शाब्दिक विकल्प सुरक्षित रखती है।
- source_word: אָסָף
  choice: आसाप
  rationale: व्यक्तिनाम का प्रचलित हिन्दी बाइबलीय लिप्यंतरण रखा गया है।
- source_word: מֵאָה אַרְבָּעִים וּשְׁמֹנָה
  choice: एक सौ अड़तालीस
  rationale: इब्रानी संख्या-क्रम का सीधा और स्वाभाविक आधुनिक हिन्दी रूप।
