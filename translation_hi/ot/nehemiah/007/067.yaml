  yaml_path: translation/ot/nehemiah/007/067.yaml
  text: besides their male and female servants[a], of whom there were 7,337; and they had 245 male and female singers.
translation:
  language: hi
  text: उनके दास-दासियों[a] के अतिरिक्त, जिनकी संख्या 7,337 थी, उनके पास 245 गायक और गायिकाएँ भी थीं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “सेवक-सेविकाओं।” इब्रानी शब्दों का अर्थ सामान्य रूप से सेवक और सेविका भी हो सकता है, पर इस जनगणना-संदर्भ में संभवतः घरानों से जुड़े दास और दासियाँ अभिप्रेत हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: מִלְּבַד
  choice: के अतिरिक्त
  rationale: यह पद पिछले कुल से अलग एक अतिरिक्त समूह को प्रस्तुत करता है; जनगणना-संदर्भ में यह स्वाभाविक और सटीक है।
- source_word: עַבְדֵיהֶם וְאַמְהֹתֵיהֶם
  choice: उनके दास-दासियों
  rationale: दोनों इब्रानी शब्द क्रमशः पुरुष और स्त्री सेवक अथवा दास के लिए हैं। इस घरेलू गणना के संदर्भ में ‘दास-दासियों’ से लिंग-भेद और आश्रित सामाजिक स्थिति दोनों स्पष्ट होते हैं।
- source_word: אֵלֶּה
  choice: जिनकी संख्या ... थी
  rationale: शाब्दिक अर्थ ‘ये’ है, पर आगे दी गई संख्या से इसे जोड़ने के लिए हिन्दी जनगणना-शैली में यह रूप अधिक स्वाभाविक है।
- source_word: שִׁבְעַת אֲלָפִים שְׁלֹשׁ מֵאוֹת שְׁלֹשִׁים וְשִׁבְעָה
  choice: 7,337
  rationale: आधुनिक हिन्दी में सूची और जनगणना के आँकड़े अंकों में देना स्पष्ट है और मूल संख्या को ठीक बनाए रखता है।
- source_word: וְלָהֶם
  choice: उनके साथ ... भी थे
  rationale: मूल में स्वामित्व अथवा संबद्धता का निर्माण है। ‘उनके साथ’ गायकों के उस समुदाय से संबद्ध होने का भाव स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: מְשֹׁרֲרִים וּמְשֹׁרֲרוֹת
  choice: गायक और गायिकाएँ
  rationale: मूल के पुल्लिंग और स्त्रीलिंग रूपों का स्पष्ट भेद सहज आधुनिक हिन्दी में सुरक्षित रहता है।
- source_word: מָאתַיִם וְאַרְבָּעִים וַחֲמִשָּׁה
  choice: '245'
  rationale: सूची के संख्यात्मक विन्यास में अंकों का प्रयोग स्पष्ट और स्वाभाविक है।
