source:
  edition: WLC
  text: וַ/אֲשֶׁ֣ר נָתְנוּ֮ שְׁאֵרִ֣ית הָ/עָם֒ זָהָ֗ב דַּרְכְּמוֹנִים֙ שְׁתֵּ֣י רִבּ֔וֹא וְ/כֶ֖סֶף מָנִ֣ים אַלְפָּ֑יִם וְ/כָתְנֹ֥ת כֹּֽהֲנִ֖ים שִׁשִּׁ֥ים וְ/שִׁבְעָֽה׃פ
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/007/071.yaml
  text: And what the rest of the people gave was twenty thousand gold darics[a], two thousand minas of silver[c][b], and sixty-seven priests’ tunics.
translation:
  language: hi
  text: और बाकी लोगों ने बीस हज़ार सोने के दारिक[a], चाँदी के दो हज़ार मने[b], और याजकों के सड़सठ कुरते दिए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: दारिक फ़ारसी साम्राज्य का सोने का सिक्का था।
    reason: cultural_note
  - marker: b
    text: मना प्राचीन काल में भार की और उससे जुड़ी धन-मूल्य की एक इकाई था।
    reason: cultural_note
lexical_decisions:
- source_word: וַאֲשֶׁר נָתְנוּ
  choice: और ... ने ... दिए
  rationale: इब्रानी का संबंधवाचक आरंभ पिछली दान-सूची को आगे बढ़ाता है। हिंदी में कर्ता और क्रिया को स्वाभाविक क्रम में रखकर वही निरंतरता व्यक्त की गई है।
- source_word: שְׁאֵרִית הָעָם
  choice: बाकी लोगों
  rationale: इस प्रशासनिक सूची में यह पहले बताए गए दाताओं के बाद शेष जनता को सूचित करता है; ‘बचे हुए लोगों’ से उत्पन्न संभावित धर्मवैज्ञानिक संकेत यहाँ अनावश्यक होगा।
- source_word: זָהָב דַּרְכְּמוֹנִים
  choice: सोने के दारिक
  rationale: ऐतिहासिक रूप से विशिष्ट फ़ारसी सिक्के का नाम सुरक्षित रखा गया है, सामान्य ‘सोने के सिक्के’ नहीं किया गया।
- source_word: שְׁתֵּי רִבּוֹא
  choice: बीस हज़ार
  rationale: शाब्दिक ‘दो दस-हज़ार’ को आधुनिक हिंदी की स्वाभाविक संख्या-पद्धति में व्यक्त किया गया है।
- source_word: וְכֶסֶף מָנִים אַלְפָּיִם
  choice: दो हज़ार माने चाँदी के
  rationale: प्राचीन भार/मूल्य की इकाई ‘माने’ को बनाए रखा गया है। शब्दक्रम ऐसा रखा गया है कि संख्या सीधे इकाई के साथ जुड़े और ‘चाँदी के’ उसका पदार्थ स्पष्ट करे।
- source_word: וְכָתְנֹת כֹּהֲנִים
  choice: याजकों के ... अंगरखे
  rationale: כָּתְנֹת लंबे अधोवस्त्र/कुर्तेनुमा परिधान हैं; ‘अंगरखे’ साधारण पाठक के लिए गरिमापूर्ण और समझने योग्य है तथा संबंधवाचक संरचना को बनाए रखता है।
- source_word: שִׁשִּׁים וְשִׁבְעָה
  choice: सड़सठ
  rationale: संख्या का मानक आधुनिक हिंदी रूप।
theological_decisions:
- issue: שְׁאֵרִית को धर्मवैज्ञानिक ‘शेष’ मानना या सूचीगत ‘बाकी लोग’
  choice: बाकी लोगों
  alternative: लोगों के बचे हुए भाग / शेष लोगों
  rationale: निकट संदर्भ दान देने वाले विभिन्न समूहों की सूची है। इसलिए प्रशासनिक भेद प्रमुख है; अनुवाद किसी ‘विश्वासी शेष’ की धारणा को अनावश्यक रूप से आरोपित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिंदी, सहज किंतु गरिमापूर्ण सूचीगत शैली। ऐतिहासिक मुद्रा और माप की इकाइयों को लिप्यंतरित करके संक्षिप्त सांस्कृतिक टिप्पणियाँ दी गई हैं। ‘याजक’ बाइबलीय संदर्भ में प्रचलित और व्यापक रूप से बोधगम्य पद है।
