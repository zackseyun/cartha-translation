id: NEH.7.61
reference: Nehemiah 7:61
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/אֵ֗לֶּה הָֽ/עוֹלִים֙ מִ/תֵּ֥ל מֶ֨לַח֙ תֵּ֣ל חַרְשָׁ֔א כְּר֥וּב אַדּ֖וֹן וְ/אִמֵּ֑ר וְ/לֹ֣א יָכְל֗וּ לְ/הַגִּ֤יד בֵּית אֲבוֹתָ/ם֙ וְ/זַרְעָ֔/ם אִ֥ם מִ/יִּשְׂרָאֵ֖ל הֵֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/007/061.yaml
  text: And these were the ones who came up from Tel-melah[a], Tel-harsha, Kerub, Addon, and Immer, but they were not able to declare their fathers’ houses or their offspring[c][b], whether they were from Israel.
translation:
  language: hi
  text: और ये वे लोग थे जो तेल-मेलह, तेल-हर्शा, करूब, अद्दोन[a] और इम्मेर से आए थे, पर वे अपने पितृकुल[b] और वंश के विषय में यह नहीं बता सके कि वे इस्राएल के थे या नहीं।[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: एज्रा 2:59 में यहाँ के ‘अद्दोन’ के स्थान पर ‘अद्दान’ है।
    reason: textual_variant
  - marker: b
    text: शाब्दिक रूप से, “अपने पितरों का घर”; अर्थात अपना पैतृक घराना या कुल।
    reason: lexical_alternative
  - marker: c
    text: इसे “कि वे इस्राएली थे या नहीं” भी अनुवाद किया जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵלֶּה הָעוֹלִים
  choice: और ये वे लोग थे जो ... से आए थे
  rationale: सूची के भीतर एक नए समूह का परिचय देता है। निर्वासन से लौटने के प्रसंग में עלה के चढ़ने/आने के भाव को स्वाभाविक हिन्दी में ‘आए थे’ से व्यक्त किया गया है।
- source_word: מִתֵּל מֶלַח תֵּל חַרְשָׁא כְּרוּב אַדּוֹן וְאִמֵּר
  choice: तेल-मेलह, तेल-हर्शा, करूब, अद्दोन और इम्मेर से
  rationale: स्थान अथवा कुलनामों का देवनागरी में लिप्यंतरण किया गया है। ‘अद्दोन’ नहेमायाह के इब्रानी व्यंजन-पाठ के अनुरूप है; एज्रा 2:59 का पाठांतर पादटिप्पणी में दिया गया है।
- source_word: וְלֹא יָכְלוּ לְהַגִּיד
  choice: पर ... यह नहीं बता सके
  rationale: नकारात्मक क्षमता और पिछले कथन के साथ विरोध को सहज हिन्दी में व्यक्त करता है। ‘सिद्ध नहीं कर सके’ कानूनी अर्थ को आवश्यकता से अधिक स्पष्ट कर देता, इसलिए अधिक तटस्थ ‘बता सके’ चुना गया है।
- source_word: בֵּית אֲבוֹתָם
  choice: अपने पितृकुल
  rationale: शाब्दिक ‘अपने पितरों का घर’ के स्थान पर वंशावली के प्रसंग में प्रचलित और सुबोध ‘पितृकुल’ चुना गया है; मूल मुहावरे की जानकारी पादटिप्पणी में रखी गई है।
- source_word: וְזַרְעָם
  choice: और वंश
  rationale: זֶרַע का मूल अर्थ ‘बीज’ है, पर यहाँ वंशावली के संदर्भ में ‘वंश’ स्वाभाविक और सटीक है।
- source_word: אִם מִיִּשְׂרָאֵל הֵם
  choice: कि वे इस्राएल के थे या नहीं
  rationale: इस्राएली वंश-संबंध की अनिश्चितता को बनाए रखता है और इब्रानी ‘क्या वे इस्राएल से/के हैं’ को सहज हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: इस्राएल से संबंध का स्वरूप
  choice: इस्राएल के थे या नहीं
  alternative: वे इस्राएली थे या नहीं
  rationale: मुख्य पाठ में मूल की संबंधसूचक अभिव्यक्ति को अपेक्षाकृत खुला रखा गया है; अधिक संक्षिप्त जातीय पहचान वाला अनुवाद पादटिप्पणी में दिया गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सूची-वर्णन के अनुरूप रखी गई है। नामों का हिन्दी ध्वन्यात्मक लिप्यंतरण किया गया है। वंशावली-संबंधी इब्रानी मुहावरे को ‘पितृकुल’ से स्पष्ट किया गया है, जबकि उसका शाब्दिक रूप पादटिप्पणी में सुरक्षित है।
