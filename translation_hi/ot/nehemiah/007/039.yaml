lexical_decisions:
- source_word: הַכֹּהֲנִים
  choice: याजक
  rationale: निश्चित बहुवचन संज्ञा जनगणना-सूची में एक वर्ग का परिचय देती है; हिन्दी में शीर्षकीय सूची-शैली के लिए ‘याजक:’ स्वाभाविक है।
- source_word: בְּנֵי
  choice: वंशज
  rationale: वंशावली और जनगणना के प्रसंग में यह शब्द केवल प्रत्यक्ष पुत्रों तक सीमित न होकर वंश अथवा कुल के सदस्यों को सूचित करता है; ‘वंशज’ आशय को स्पष्ट और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: יְדַעְיָה
  choice: यदायाह
  rationale: हिब्रू व्यक्तिगत नाम का देवनागरी लिप्यंतरण, जिसमें नाम का अंतिम याह-तत्त्व सुरक्षित रहता है।
- source_word: לְבֵית יֵשׁוּעַ
  choice: येशूअ के घराने के
  rationale: यह पदबंध येशूअ के परिवार, कुल या वंशगत घराने से संबद्धता बताता है; ‘घराना’ इस सूची के पारिवारिक अर्थ को स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: יֵשׁוּעַ
  choice: येशूअ
  rationale: उत्तर-निर्वासनकालीन हिब्रू रूप יֵשׁוּעַ का निकट देवनागरी लिप्यंतरण; इसे ‘यहोशू’ बनाने से स्रोत में प्रयुक्त विशिष्ट संक्षिप्त रूप धुंधला पड़ सकता है।
- source_word: תְּשַׁע מֵאוֹת שִׁבְעִים וּשְׁלֹשָׁה
  choice: नौ सौ तिहत्तर
  rationale: हिब्रू संख्या-क्रम का कुल 973 है; यह उसका स्पष्ट और प्रचलित हिन्दी रूप है।
