  rationale: यह पद मंदिर या समुदाय के द्वारों की रखवाली और देखरेख के लिए नियुक्त लोगों को दर्शाता है; ‘द्वारपाल’ आधुनिक हिन्दी में स्पष्ट और संक्षिप्त है।
- source_word: בְּנֵי
