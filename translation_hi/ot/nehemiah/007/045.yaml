base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/007/045.yaml
  text: 'The gatekeepers: the sons of Shallum[a], the sons of Ater, the sons of Talmon, the sons of Akkub, the sons of Hatita, the sons of Shobai, 138.'
translation:
  language: hi
  text: 'द्वारपाल: शल्लूम के वंशज[a], आतेर के वंशज, तल्मोन के वंशज, अक्कूब के वंशज, हतीता के वंशज और शोबई के वंशज—कुल 138।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ ‘वंशज’ के लिए प्रयुक्त इब्रानी शब्द का शाब्दिक अर्थ ‘पुत्र’ है; ऐसी सूचियों में यह किसी व्यापक परिवार या कुल के सदस्यों को भी दर्शा सकता है।
    reason: lexical_alternative
