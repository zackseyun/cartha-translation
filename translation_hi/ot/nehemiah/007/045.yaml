- source_word: אָטֵר
  choice: आतेर
  rationale: व्यक्तिनाम का इब्रानी से देवनागरी लिप्यंतरण।
- source_word: טַלְמֹן
  choice: तल्मोन
  rationale: व्यक्तिनाम का इब्रानी से देवनागरी लिप्यंतरण।
- source_word: עַקּוּב
  choice: अक्कूब
  rationale: व्यक्तिनाम में दोगुने व्यंजन और दीर्घ स्वर को दर्शाने वाला देवनागरी लिप्यंतरण।
- source_word: חֲטִיטָא
  choice: हतीता
  rationale: व्यक्तिनाम का पठनीय देवनागरी लिप्यंतरण; आरंभिक इब्रानी कंठ्य ध्वनि का सामान्य हिन्दी रूप ‘ह’ रखा गया है।
- source_word: שֹׁבָי
  choice: शोबई
  rationale: अंतिम इब्रानी स्वर-क्रम को बनाए रखने वाला देवनागरी लिप्यंतरण।
- source_word: מֵאָה שְׁלֹשִׁים וּשְׁמֹנָה
  choice: '138'
  rationale: इब्रानी संख्या का योग 138 है; जनगणना-सूची में अंकों का प्रयोग सहज और स्पष्ट है।
