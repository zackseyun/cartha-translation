lexical_decisions:
- source_word: בְּנֵי
  choice: वंशज
  rationale: सूची और वंशावली के इस संदर्भ में בְּנֵי किसी परिवार या कुल से संबंधित लोगों को दर्शाता है। हिंदी में ‘वंशज’ इस अर्थ को स्वाभाविक और स्पष्ट रूप से व्यक्त करता है; शाब्दिक ‘पुत्र’ यहाँ केवल प्रत्यक्ष पुत्रों का भ्रामक अर्थ दे सकता है।
- source_word: עֵילָם
  choice: एलाम
  rationale: व्यक्तिवाचक नाम का देवनागरी लिप्यंतरण किया गया है। यहाँ यह लौटने वालों के परिवार या कुल का नाम है, न कि मुख्यतः भौगोलिक प्रदेश।
- source_word: אֶלֶף מָאתַיִם חֲמִשִּׁים וְאַרְבָּעָה
  choice: 1,254
  rationale: इब्रानी संख्या-क्रम का योग 1,254 है। जनगणना-सदृश सूची में आधुनिक अंकों का प्रयोग संक्षिप्त और सुबोध है। ‘व्यक्ति’ मूल पाठ में स्पष्ट रूप से नहीं है, इसलिए नहीं जोड़ा गया।
