lexical_decisions:
- source_word: בְּנֵי
  choice: वंशज
  rationale: इस वंशावली-सूची में इब्रानी रचना किसी व्यक्ति से जुड़े परिवार, कुल या वंश के लोगों को दर्शाती है; इसलिए आधुनिक हिन्दी में ‘वंशज’ तत्काल पुत्रों तक अर्थ को सीमित किए बिना आशय स्पष्ट करता है।
- source_word: חָנָן
  choice: हानान
  rationale: इब्रानी व्यक्तिवाचक अथवा कुलनाम का देवनागरी लिप्यंतरण।
- source_word: גִדֵּל
  choice: गिद्देल
  rationale: इब्रानी नाम में मध्य व्यंजन के द्वित्व को दर्शाने वाला देवनागरी लिप्यंतरण।
- source_word: גָחַר
  choice: गाहर
  rationale: इब्रानी नाम का उसके व्यंजन और स्वर-विन्यास के अनुसार देवनागरी लिप्यंतरण।
