lexical_decisions:
- source_word: בְּנֵי
  choice: के वंशज
  rationale: इस लौटने वालों की वंशावली-सूची में यह रचना केवल सीधे पुत्रों को नहीं, बल्कि किसी पूर्वज से जुड़े व्यापक वंश या कुल-समूह को भी दर्शा सकती है। इसलिए स्वाभाविक हिन्दी में ‘के वंशज’ अर्थ को स्पष्ट रखते हुए सूची की शैली बनाए रखता है।
- source_word: בַקְבּוּק
  choice: बकबुक
  rationale: यह व्यक्ति अथवा पूर्वज का नाम है; हिब्रू उच्चारण के निकट देवनागरी लिप्यंतरण किया गया है।
- source_word: חֲקוּפָא
  choice: हकूपा
  rationale: यह व्यक्ति अथवा पूर्वज का नाम है; हिब्रू व्यंजन और स्वर-रूप के निकट हिन्दी लिप्यंतरण चुना गया है।
- source_word: חַרְחוּר
  choice: हरहूर
  rationale: यह व्यक्ति अथवा पूर्वज का नाम है; इसके संभावित शाब्दिक अर्थ को संदर्भ में लागू करने के बजाय नाम का लिप्यंतरण किया गया है।
