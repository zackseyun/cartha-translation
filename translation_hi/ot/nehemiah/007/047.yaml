    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי
  choice: वंशज
  rationale: वंशावली-सूची में यह इब्रानी बहुवचन संबंधसूचक रूप केवल प्रत्यक्ष पुत्रों को नहीं, बल्कि किसी पूर्वज से जुड़े व्यापक परिवार या कुल को भी दर्शा सकता है; इसलिए आधुनिक हिन्दी में ‘वंशज’ अर्थ को स्वाभाविक और स्पष्ट रूप से व्यक्त करता है।
- source_word: קֵירֹס
