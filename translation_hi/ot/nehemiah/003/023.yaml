translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। पुनरावृत्त निर्माण-सूत्र को बनाए रखते हुए हिन्दी के स्वाभाविक वचन-सामंजस्य का पालन किया गया है। अंग्रेज़ी परामर्श-पाठ की पादटिप्पणी का चिह्न और विषय परस्पर असंगत हैं तथा हिब्रू पाठ में यहाँ किसी पाठांतर का प्रमाण नहीं दिया गया है, इसलिए उसे हिन्दी मुख्य पाठ या पादटिप्पणी में शामिल नहीं किया गया।
