  text: אַחֲרָ֨י/ו הֶחֱזִ֧יק בִּנְיָמִ֛ן וְ/חַשּׁ֖וּב נֶ֣גֶד בֵּיתָ֑/ם אַחֲרָ֣י/ו הֶחֱזִ֗יק עֲזַרְיָ֧ה בֶן מַעֲשֵׂיָ֛ה בֶּן עֲנָֽנְיָ֖ה אֵ֥צֶל בֵּיתֽ/וֹס־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/023.yaml
  text: After him Benjamin and Hasshub made repairs opposite their house. After him Azariah son of Maaseiah[a], son of Ananiah, made repairs beside his house.
translation:
  language: hi
  text: उसके बाद बिन्यामीन और हश्शूब ने अपने घर के सामने मरम्मत की। उसके बाद मासेयाह के पुत्र, अनन्याह के पोते अजर्याह ने अपने घर के पास मरम्मत की।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַחֲרָיו
  choice: उसके बाद / उनके बाद
  rationale: नहेमायाह 3 की सूची में यह पदबंध दीवार के क्रमिक हिस्सों और अगले कारीगरों की ओर बढ़ने का संकेत देता है। दूसरे प्रयोग में हिन्दी के स्वाभाविक वचन-सामंजस्य के अनुसार ‘उनके बाद’ कहा गया है।
- source_word: הֶחֱזִיק
  choice: मरम्मत की
  rationale: इस अध्याय में חזק का हिफ़ील रूप दीवार की मरम्मत के काम में लगने के लिए प्रयुक्त हुआ है; ‘मरम्मत की’ आधुनिक हिन्दी में स्पष्ट और प्रसंगानुकूल है।
- source_word: בִּנְיָמִן וְחַשּׁוּב
  choice: बिन्यामीन और हश्शूब
  rationale: व्यक्तिनामों का हिब्रू उच्चारण के निकट देवनागरी लिप्यंतरण किया गया है।
- source_word: נֶגֶד בֵּיתָם
  choice: अपने घर के सामने
  rationale: נֶגֶד स्थानगत रूप से ‘सामने’ को व्यक्त करता है। एकवचन ‘घर’ और बहुवचन संबंध को ‘अपने घर’ में स्वाभाविक हिन्दी के साथ सुरक्षित रखा गया है।
- source_word: עֲזַרְיָה בֶן־מַעֲשֵׂיָה בֶן־עֲנָנְיָה
  choice: अनन्याह के पोते और मासेयाह के पुत्र अजर्याह
  rationale: वंशावली के दोनों संबंध सुरक्षित रखते हुए हिन्दी में संबंधों का क्रम स्पष्ट और स्वाभाविक बनाया गया है।
- source_word: אֵצֶל בֵּיתוֹ
  choice: अपने घर के पास
  rationale: אֵצֶל निकटता बताता है; ‘के पास’ सहज हिन्दी है और स्थल-संबंध को अनावश्यक रूप से अधिक सटीक नहीं बनाता।
