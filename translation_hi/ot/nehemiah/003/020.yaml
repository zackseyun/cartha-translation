- source_word: אֶלְיָשִׁיב הַכֹּהֵן הַגָּדוֹל
  choice: महायाजक एल्याशीब
  rationale: הַכֹּהֵן הַגָּדוֹל पदवी का प्रचलित और सटीक हिंदी रूप 'महायाजक' है।
