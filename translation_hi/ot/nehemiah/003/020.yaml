  yaml_path: translation/ot/nehemiah/003/020.yaml
  text: After him[a], Baruch son of Zabbai zealously repaired a second section[b], from the angle to the entrance of the house of Eliashib the high priest.
translation:
  language: hi
  text: उसके बाद[a] ज़ब्बै के पुत्र बारूक ने बड़े उत्साह से एक दूसरे खंड की मरम्मत की[b]—कोने से लेकर महायाजक एल्याशीब के घर के प्रवेश-द्वार तक।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसके पीछे”; यह पदावली काम के क्रम के साथ-साथ पिछले भाग से लगी हुई जगह का भी संकेत दे सकती है।
    reason: lexical_alternative
  - marker: b
    text: यहाँ हिब्रू अभिव्यक्ति असामान्य है और संभवतः बारूक के जोश या विशेष तत्परता पर बल देती है।
    reason: lexical_alternative
