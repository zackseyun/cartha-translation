  yaml_path: translation/ot/nehemiah/003/018.yaml
  text: 'After him their brothers repaired: Bavvai son of Henadad[a], ruler of half the district of Keilah.'
translation:
  language: hi
  text: 'उसके बाद उनके भाइयों ने मरम्मत की: हेनादाद का पुत्र बव्वै[a], जो कीला जिले के आधे भाग का शासक था।'
  philosophy: optimal-equivalence
  footnotes:
