    reason: textual_variant
lexical_decisions:
- source_word: אַחֲרָיו
  choice: उसके बाद
  rationale: मरम्मत करने वालों की क्रमिक सूची में यह पिछले व्यक्ति के बाद वाले कार्य-दल या हिस्से को सूचित करता है और हिब्रू की स्थानिक/क्रमिक अस्पष्टता को सहज हिंदी में बनाए रखता है।
- source_word: הֶחֱזִיקוּ
  choice: मरम्मत की
  rationale: नहेमायाह 3 में यह क्रिया दीवार को मजबूत करने अर्थात उसकी मरम्मत करने के अर्थ में प्रयुक्त हुई है।
- source_word: אֲחֵיהֶם
  choice: उनके भाइयों
  rationale: यह हिब्रू के शाब्दिक संबंधसूचक शब्द को सुरक्षित रखता है; प्रसंग में इसका आशय सहकर्मी या समुदाय के संबंधी भी हो सकता है।
- source_word: בַּוַּי
  choice: बव्वै
  rationale: मुख्य पाठ WLC के स्वरांकित रूप बव्वै का लिप्यंतरण करता है; बिन्नूई पाठांतर को पादटिप्पणी में रखा गया है।
- source_word: בֶּן חֵנָדָד
  choice: हेनादाद का पुत्र
  rationale: पितृनाम बताने वाली सामान्य हिब्रू रचना का स्वाभाविक और स्पष्ट हिंदी रूप।
- source_word: שַׂר
  choice: शासक
  rationale: नागरिक-प्रशासनिक प्रसंग में यह जिले के अधिकारी या अधिपति को दर्शाता है; सैन्य पद का संकेत देना उचित नहीं।
- source_word: חֲצִי פֶּלֶךְ
  choice: जिले के आधे भाग
  rationale: यह प्रशासनिक क्षेत्र के आधे हिस्से को दर्शाता है; आधुनिक हिंदी में 'जिला' स्पष्ट और सहज है।
- source_word: קְעִילָה
  choice: कीला
  rationale: स्थान-नाम का स्रोत-आधारित देवनागरी लिप्यंतरण।
