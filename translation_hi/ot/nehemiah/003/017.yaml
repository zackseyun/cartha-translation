base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/017.yaml
  text: 'After him the Levites carried out repairs: Rehum son of Bani[a]. Next to him Hashabiah, ruler of half the district of Keilah[c][b], carried out repairs for his district.'
translation:
  language: hi
  text: उसके बाद लेवियों में से बानी के पुत्र रहूम ने मरम्मत की। उसके पास कीला के आधे जिले के अधिकारी हशब्याह ने अपने जिले के लिए[a] मरम्मत की।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “अपने भाग के लिए।” इब्रानी पद से आशय हशब्याह के अधिकार में आने वाला जिला भी हो सकता है और उसे मरम्मत के लिए सौंपा गया हिस्सा भी।
    reason: lexical_alternative
lexical_decisions:
- source_word: אַחֲרָיו
  choice: उसके बाद
  rationale: दीवार की मरम्मत करने वालों की सूची में यह पिछले व्यक्ति के बाद आने वाले कार्यकर्ता या निकटवर्ती कार्य-स्थान की ओर संकेत करता है।
- source_word: הֶחֱזִיקוּ / הֶחֱזִיק
