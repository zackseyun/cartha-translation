- source_word: הַלְוִיִּם
  choice: लेवियों
  rationale: यह लेवी समुदाय के सदस्यों का प्रचलित और सीधा हिन्दी पदनाम है।
- source_word: רְחוּם בֶּן־בָּנִי
  choice: बानी के पुत्र रहूम
  rationale: नामों का हिन्दी लिप्यंतरण किया गया है और वंश-सूचक संबंध स्वाभाविक हिन्दी क्रम में रखा गया है।
- source_word: עַל יָדוֹ
  choice: उसके पास
  rationale: शाब्दिक अर्थ 'उसके हाथ पर' है, पर इस अध्याय में मुहावरे का आशय पास या बगल के कार्य-स्थान से है।
- source_word: חֲשַׁבְיָה
  choice: हशब्याह
  rationale: इब्रानी व्यक्ति-नाम का निकट हिन्दी लिप्यंतरण।
- source_word: שַׂר חֲצִי פֶלֶךְ קְעִילָה
  choice: कीला के आधे जिले के अधिकारी
  rationale: שַׂר प्रशासनिक पदाधिकारी को और פֶלֶךְ यहाँ प्रशासनिक जिले को सूचित करता है; 'अधिकारी' आधुनिक हिन्दी में पद को बिना अनावश्यक राजकीय अर्थ जोड़े व्यक्त करता है।
- source_word: לְפִלְכּוֹ
  choice: अपने जिले की ओर से
  rationale: לְ उपसर्ग दायित्व, प्रतिनिधित्व या कार्य-क्षेत्र का बोध करा सकता है। मुख्य पाठ में प्रशासनिक संबंध रखा गया है, जबकि संभावित 'अपने भाग के लिए' अर्थ को पादटिप्पणी में सुरक्षित किया गया है।
