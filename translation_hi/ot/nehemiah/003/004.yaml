  yaml_path: translation/ot/nehemiah/003/004.yaml
  text: And next to them Meremoth son of Uriah[a], son of Hakkoz, made repairs; and next to them Meshullam son of Berechiah, son of Meshezabel, made repairs[c][b]; and next to them Zadok son of Baana made repairs.
translation:
  language: hi
  text: और उनके बगल में हक्कोस के पुत्र ऊरिय्याह के पुत्र मरेमोत ने मरम्मत का काम किया[a]। उनके बगल में मेशेजबेल के पुत्र बेरेक्याह के पुत्र मशुल्लाम ने मरम्मत का काम किया। और उनके बगल में बाना के पुत्र सादोक ने मरम्मत का काम किया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इसे ‘दृढ़ किया’ भी कहा जा सकता है। इस अध्याय में यह इब्रानी क्रिया दीवार या फाटक के किसी हिस्से की मरम्मत करने के लिए बार-बार प्रयुक्त हुई है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל יָדָם
  choice: और उनके बगल में
  rationale: शाब्दिक रूप से यह ‘और उनके हाथ के पास’ है, पर नहेमायाह 3 की निर्माण-सूची में यह एक स्थान-सूचक मुहावरा है, जिसका अर्थ पिछले दल के बगल में काम करना है।
- source_word: הֶחֱזִיק
  choice: मरम्मत की
  rationale: इस प्रसंग में क्रिया का मूल भाव किसी हिस्से को दृढ़ करने का है और यह दीवार अथवा फाटक की मरम्मत का प्रचलित वर्णन बनती है। ‘मरम्मत की’ स्वाभाविक हिंदी में कार्य को स्पष्ट रखता है।
- source_word: בֶּן
  choice: पुत्र / पोता
  rationale: पहली पीढ़ी के लिए ‘पुत्र’ रखा गया है; दो लगातार वंश-संबंधों को स्वाभाविक हिंदी में स्पष्ट करने के लिए दूसरे संबंध को ‘पोता’ कहा गया है।
- source_word: מְרֵמוֹת
  choice: मरेमोत
  rationale: इब्रानी उच्चारण के निकट देवनागरी लिप्यंतरण।
- source_word: אוּרִיָּה
  choice: ऊरिय्याह
  rationale: इब्रानी नाम का प्रचलित और स्रोत-सन्निकट हिंदी रूप।
- source_word: הַקּוֹץ
  choice: हक्कोस
  rationale: इब्रानी व्यंजन-द्वित्व और नाम के आरंभिक निश्चित उपपद को ध्यान में रखकर किया गया लिप्यंतरण।
- source_word: מְשֻׁלָּם
  choice: मशुल्लाम
  rationale: इब्रानी नाम का स्रोत-सन्निकट देवनागरी लिप्यंतरण।
- source_word: בֶּרֶכְיָה
  choice: बेरेक्याह
  rationale: इब्रानी नाम का स्रोत-सन्निकट देवनागरी लिप्यंतरण।
- source_word: מְשֵׁיזַבְאֵל
  choice: मशेजबेल
  rationale: इब्रानी नाम के व्यंजनों और स्वर-रूप को पठनीय आधुनिक हिंदी में दर्शाने वाला लिप्यंतरण।
- source_word: צָדוֹק
  choice: सादोक
  rationale: इब्रानी नाम का स्रोत-सन्निकट और हिंदी में पठनीय लिप्यंतरण।
- source_word: בַּעֲנָא
  choice: बाना
  rationale: अंतिम आलेफ को अलग ‘ह’ न बनाते हुए इब्रानी रूप का देवनागरी लिप्यंतरण।
