source:
  edition: WLC
  text: וְ/עַל יָדָ֨/ם הֶחֱזִ֜יק מְלַטְיָ֣ה הַ/גִּבְעֹנִ֗י וְ/יָדוֹן֙ הַ/מֵּרֹ֣נֹתִ֔י אַנְשֵׁ֥י גִבְע֖וֹן וְ/הַ/מִּצְפָּ֑ה לְ/כִסֵּ֕א פַּחַ֖ת עֵ֥בֶר הַ/נָּהָֽר־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/007.yaml
  text: And next to them Melatiah the Gibeonite and Jadon the Meronothite made repairs[a], along with the men of Gibeon and Mizpah, for the seat of the governor of the province Beyond the River.
translation:
  language: hi
  text: उनके पास गिबोनवासी मलत्याह और मेरोनोतवासी यादोन ने गिबोन और मिस्पा के लोगों के साथ महानद-पार प्रान्त के राज्यपाल के आसन तक मरम्मत की।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में, “महानद-पार के राज्यपाल के आसन के लिए/तक।” “आसन” से राज्यपाल का सरकारी केंद्र या निवास अभिप्रेत हो सकता है; कम संभावना में यह उस क्षेत्र में उसके प्रशासनिक अधिकार-क्षेत्र की ओर भी संकेत कर सकता है।
    reason: मूल पदबंध में राज्यपाल के भौतिक सरकारी आसन/निवास और, कम संभावना में, प्रशासनिक अधिकार-क्षेत्र के बीच अर्थगत अस्पष्टता है।
lexical_decisions:
- source_word: וְעַל יָדָם
  choice: उनके पास
  rationale: नहेमायाह 3 की निर्माण-सूची में यह मुहावरा पास के अगले कार्य-दल या खंड को बताता है।
- source_word: הֶחֱזִיק
  choice: मरम्मत की
  rationale: इस अध्याय के निर्माण-संदर्भ में हिफ़ील क्रिया दीवार को दृढ़ करने या उसकी मरम्मत करने में भाग लेने का संकेत देती है।
- source_word: מְלַטְיָה הַגִּבְעֹנִי
  choice: गिबोनवासी मलत्याह
  rationale: व्यक्तिनाम का लिप्यंतरण किया गया है और स्थान-सूचक विशेषण को स्वाभाविक हिन्दी में व्यक्त किया गया है।
- source_word: וְיָדוֹן הַמֵּרֹנֹתִי
  choice: और मेरोनोतवासी यादोन
  rationale: व्यक्तिनाम तथा स्थान-सूचक विशेषण दोनों का हिन्दी ध्वन्यात्मक रूप रखा गया है।
- source_word: אַנְשֵׁי גִבְעוֹן וְהַמִּצְפָּה
  choice: गिबोन और मिस्पा के लोगों के साथ
  rationale: אַנְשֵׁי नगरों से जुड़े लोगों को दर्शाता है; प्रसंग में ये नामित व्यक्तियों के साथ काम करने वाला समूह हैं।
- source_word: לְכִסֵּא פַּחַת עֵבֶר הַנָּהָר
  choice: महानद-पार प्रान्त के राज्यपाल के आसन से संबंधित था
  rationale: כִּסֵּא का मूल अर्थ ‘आसन/सिंहासन’ है, पर फ़ारसी प्रशासनिक संदर्भ में यह राज्यपाल के सरकारी केंद्र, निवास या अधिकार-क्षेत्र की ओर संकेत कर सकता है। अस्पष्टता को मुख्य पाठ और पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: עֵבֶר הַנָּהָר
  choice: महानद-पार प्रान्त
  rationale: यह फ़ारसी साम्राज्य के उस प्रशासनिक क्षेत्र का नाम था जो फ़रात नदी के पश्चिम में था; ‘महानद-पार’ नामरूप को बनाए रखता है और ‘प्रान्त’ संदर्भ स्पष्ट करता है।
theological_decisions:
- issue: לְכִסֵּא का प्रशासनिक आशय
  choice: आसन से संबंधित
  alternative: आधिकारिक निवास के लिए / अधिकार-क्षेत्र के अधीन
  rationale: मूल वाक्य यह निश्चित नहीं करता कि राज्यपाल का भौतिक सरकारी आसन या निवास अभिप्रेत है, अथवा उसका प्रशासनिक अधिकार-क्षेत्र। इसलिए किसी एक अर्थ को निर्णायक नहीं बनाया गया।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी अपनाई गई है। ‘महानद-पार’ को ऐतिहासिक प्रशासनिक नाम के रूप में रखा गया है। वाक्य को दो भागों में बाँटकर जटिल इब्रानी रचना को सामान्य पाठक के लिए स्पष्ट बनाया गया है, बिना उसके प्रशासनिक आशय को निश्चित किए।
