base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/021.yaml
  text: After him[a], Meremoth son of Uriah, son of Hakkoz, repaired another section, from the entrance of the house of Eliashib to the end of the house of Eliashib.
translation:
  language: hi
  text: उसके बाद, हक्कोस के पोते और ऊरिय्याह के पुत्र मरेमोत ने एक और भाग[a] की मरम्मत की—एल्याशीब के घर के प्रवेश-द्वार से लेकर एल्याशीब के घर के अंतिम छोर तक।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘दूसरा भाग।’ इब्रानी पदबंध मरेमोत को सौंपे गए दूसरे अथवा अतिरिक्त कार्य-खंड का संकेत दे सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אַחֲרָיו
  choice: उसके बाद
  rationale: नहेमायाह 3 की निर्माण-सूची में यह पदबंध काम के क्रम को दर्शाता है। यह स्थानिक निकटता मात्र बताने वाले ‘उसके पास’ की अपेक्षा इब्रानी को अधिक सीधे व्यक्त करता है।
- source_word: הֶחֱזִיק
  choice: मरम्मत की
  rationale: क्रिया का मूल भाव ‘दृढ़ करना’ है, पर इस अध्याय में यह दीवार और उससे जुड़ी संरचनाओं की मरम्मत के काम में भाग लेने के अर्थ में प्रयुक्त हुई है।
- source_word: מְרֵמוֹת בֶּן אוּרִיָּה בֶּן הַקּוֹץ
  choice: हक्कोस के पोते और ऊरिय्याह के पुत्र मरेमोत
  rationale: वंशक्रम को स्पष्ट और स्वाभाविक हिन्दी में सुरक्षित रखा गया है; इब्रानी नामों का देवनागरी लिप्यंतरण किया गया है।
- source_word: מִדָּה שֵׁנִית
  choice: एक और भाग
  rationale: यह संभवतः मरेमोत को मिले दूसरे अथवा अतिरिक्त कार्य-खंड को सूचित करता है (पद 4 से तुलना करें)। स्वाभाविक हिन्दी के लिए ‘एक और भाग’ चुना गया है और अधिक शाब्दिक विकल्प पादटिप्पणी में रखा गया है।
- source_word: מִפֶּתַח בֵּית אֶלְיָשִׁיב
  choice: एल्याशीब के घर के प्रवेश-द्वार से
  rationale: פֶּתַח किसी खुलने की जगह, द्वार अथवा प्रवेश को दर्शाता है; भवन के वर्णन में ‘प्रवेश-द्वार’ सटीक और सहज है।
- source_word: וְעַד תַּכְלִית בֵּית אֶלְיָשִׁיב
  choice: उसके घर के अंतिम छोर तक
  rationale: תַּכְלִית यहाँ अमूर्त ‘पूर्णता’ नहीं, बल्कि स्थानिक सीमा या आखिरी छोर दर्शाता है। सर्वनाम से एल्याशीब की अनावश्यक पुनरावृत्ति टाली गई है।
