base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/035.yaml
  text: And Tobiah the Ammonite was beside him[a], and he said, “Even what they are building—if a fox climbs up on it[b], he will break through their stone wall!”
translation:
  language: hi
  text: और अम्मोनी तोबियाह उसके पास था। उसने कहा, “वे जो कुछ बना रहे हैं—यदि एक लोमड़ी[a] उस पर चढ़ जाए, तो वह उनकी पत्थर की दीवार तोड़ देगी![b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “लोमड़ी” के लिए प्रयुक्त इब्रानी शब्द कुछ प्रसंगों में लोमड़ी-जैसे किसी अन्य जंगली कुत्ते, जैसे सियार, को भी सूचित कर सकता है; यहाँ “लोमड़ी” मानक अनुवाद है।
    reason: lexical_alternative
  - marker: b
    text: या, “उनकी पत्थरों की दीवार में सेंध लगा देगी।” इब्रानी क्रिया में दीवार को भेदने, उसमें सेंध लगाने या उसे तोड़ देने का भाव हो सकता है; यह तोबियाह के उपहास का भाग है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶצְלוֹ
  choice: उसके पास था
  rationale: אצל निकटता या साथ होने का बोध कराता है। यह स्वाभाविक हिन्दी में तोबियाह के सनबल्लत के पास उपस्थित होने को व्यक्त करता है।
- source_word: גַּם אֲשֶׁר הֵם בּוֹנִים
  choice: वे जो बना रहे हैं
  rationale: גַּם का उपहासपूर्ण बल अगले वाक्य में ‘एक लोमड़ी भी’ से स्वाभाविक हिन्दी में प्रकट होता है; वाक्य-विन्यास मूल कथन की ओर संकेत बनाए रखता है।
- source_word: אִם
  choice: यदि
  rationale: यह कण शर्त प्रस्तुत करता है। ‘यदि’ ताने के काल्पनिक स्वर को स्पष्ट और गरिमापूर्ण हिन्दी में बनाए रखता है।
- source_word: יַעֲלֶה שׁוּעָל
  choice: एक लोमड़ी भी चढ़ जाए
  rationale: שׁוּעָל का मानक अर्थ ‘लोमड़ी’ है। ‘भी’ उपहास के भाव को व्यक्त करता है, और ‘उस पर’ दीवार की ओर निहित संकेत को स्पष्ट करता है।
- source_word: וּפָרַץ
  choice: सेंध लगा देगी
  rationale: פרץ दीवार को भेदने या उसमें दरार/सेंध करने का अर्थ दे सकता है। यह चयन तोबियाह के इस उपहास को सजीव रखता है कि दीवार अत्यंत कमजोर है।
- source_word: חוֹמַת אַבְנֵיהֶם
  choice: उनकी पत्थर की दीवार
  rationale: यह ‘उनके पत्थरों की दीवार’ का स्वाभाविक आधुनिक हिन्दी रूप है और निर्माण-सामग्री का उल्लेख बनाए रखता है।
