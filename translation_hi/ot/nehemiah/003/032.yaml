    text: या, ‘कोने की चढ़ाई’ अथवा ‘कोने का ऊपरी कक्ष।’ इब्रानी शब्द का अर्थ ऊपरी कक्ष या चढ़ाई हो सकता है; यहाँ ठीक किस वास्तु-रचना की बात है, यह निश्चित नहीं है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבֵין
  choice: और ... के बीच
  rationale: संयोजक और स्थान-सूचक अर्थ दोनों को बनाए रखते हुए यह दीवार की मरम्मत के अंतिम खंड को पिछले विवरण से जोड़ता है।
- source_word: עֲלִיַּת
  choice: अटारी
  rationale: यह शब्द किसी ऊपरी कक्ष या ऊँची संरचना को सूचित कर सकता है। ‘अटारी’ आधुनिक हिन्दी में स्वाभाविक है, जबकि मूल की वास्तु-संबंधी अनिश्चितता पादटिप्पणी में सुरक्षित रखी गई है।
- source_word: הַפִּנָּה
  choice: कोने
  rationale: मूल शब्द का सामान्य अर्थ ‘कोना’ है और यहाँ संभवतः शहरपनाह की किसी परिचित कोनेवाली संरचना का संकेत है; इसे अनावश्यक रूप से विशेष नाम नहीं बनाया गया।
- source_word: לְשַׁעַר הַצֹּאן
  choice: भेड़ फाटक
  rationale: यह यरूशलेम के एक पहचाने हुए फाटक का नाम है; ‘भेड़ फाटक’ स्पष्ट, संक्षिप्त और अध्याय के संदर्भ के अनुरूप है।
- source_word: הֶחֱזִיקוּ
  choice: मरम्मत की
  rationale: नहेमायाह 3 में यह क्रिया बार-बार शहरपनाह और फाटकों की मरम्मत के काम के लिए प्रयुक्त हुई है; संदर्भगत अर्थ को सहज हिन्दी में व्यक्त किया गया है।
- source_word: הַצֹּרְפִים
  choice: सुनारों
  rationale: यह कृदंत-संज्ञा बहुमूल्य धातुओं को परिष्कृत करने या उनसे वस्तुएँ बनानेवालों को दर्शाती है; इस प्रसंग में ‘सुनार’ उपयुक्त व्यावसायिक पद है।
- source_word: וְהָרֹכְלִים
  choice: और व्यापारियों
  rationale: मूल शब्द घूमकर बेचनेवालों या व्यापक अर्थ में व्यापारियों के लिए प्रयुक्त हो सकता है; ‘व्यापारी’ सहज और पर्याप्त व्यापक है।
