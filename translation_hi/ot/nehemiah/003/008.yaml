base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/008.yaml
  text: Next to him Uzziel son of Harhaiah[a], one of the goldsmiths, made repairs; and next to him Hananiah, one of the perfumers, made repairs. And they restored Jerusalem as far as the Broad Wall.
translation:
  language: hi
  text: उसके पास हरहयाह के पुत्र उज्जीएल ने, जो सुनारों में से एक था, मरम्मत की। उसके पास हनन्याह ने, जो सुगंध-द्रव्य बनाने वालों में से एक था, मरम्मत की। उन्होंने यरूशलेम को चौड़ी दीवार तक बहाल किया[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उन्होंने यरूशलेम को चौड़ी दीवार तक छोड़ दिया।” इब्रानी क्रिया का सामान्य अर्थ “छोड़ देना” है, लेकिन यहाँ पुनर्निर्माण के संदर्भ में इसे प्रायः “बहाल किया” या “मरम्मत की” के अर्थ में समझा जाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל יָדוֹ
  choice: उसके पास
  rationale: नहेमायाह 3 में यह मुहावरा मरम्मत के क्रम में साथ लगे अगले हिस्से और वहाँ काम करनेवाले व्यक्ति को दर्शाता है। ‘उसके पास’ स्वाभाविक हिन्दी में स्थानिक संबंध बनाए रखता है।
- source_word: הֶחֱזִיק
  choice: मरम्मत की
  rationale: इस अध्याय के निर्माण-संदर्भ में क्रिया का आशय दीवार के हिस्से को मजबूत करने अथवा सुधारने के काम में लगना है; ‘मरम्मत की’ सामान्य पाठक के लिए स्पष्ट है।
- source_word: צֹרְפִים
  choice: सुनारों में से था
  rationale: बहुवचन शब्द धातु गलाने और आभूषण बनानेवाले कारीगरों के वर्ग को सूचित करता है। यहाँ उज्जीएल की पेशागत संबद्धता बताने के लिए ‘सुनारों में से’ स्वाभाविक है।
- source_word: הָרַקָּחִים
  choice: सुगंध-द्रव्य बनानेवालों में से था
  rationale: यह शब्द सुगंधित मिश्रण, इत्र अथवा लेप तैयार करनेवालों को दर्शाता है। यह प्रस्तुति आधुनिक हिन्दी में अर्थ स्पष्ट करती है और पुराने अथवा भ्रामक औषधीय पद से बचती है।
- source_word: וַיַּעַזְבוּ
  choice: फिर से सुदृढ़ किया
  rationale: क्रिया का सामान्य अर्थ ‘छोड़ देना’ है, पर इस मरम्मत-सूची में अनेक विद्वान इसे नगर की प्रतिरक्षा पुनः स्थापित या सुदृढ़ करने के अर्थ में समझते हैं। मुख्य पाठ में संदर्भ-संगत अर्थ दिया गया है, जबकि सामान्य अर्थ को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: יְרוּשָׁלַםִ
  choice: यरूशलेम
  rationale: मूल पाठ नगर का नाम ही देता है; संभवतः नगर से उसकी किलेबंदी अभिप्रेत है। इसलिए मुख्य पाठ में ‘दीवार’ जोड़कर आशय को अनावश्यक रूप से सीमित नहीं किया गया।
- source_word: עַד הַחוֹמָה הָרְחָבָה
  choice: चौड़ी दीवार तक
  rationale: यह यरूशलेम की किलेबंदी के एक पहचाने हुए हिस्से का नाम या वर्णन प्रतीत होता है। ‘चौड़ी दीवार’ मूल विशेषण को सरल और स्पष्ट हिन्दी में रखता है।
