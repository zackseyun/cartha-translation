translation:
  language: hi
  text: मछली फाटक को हस्सनाआ के वंशजों[a] ने बनाया। उन्होंने उस पर छत डाली[b] और उसके किवाड़, कुंडियाँ और आड़ी सलाखें लगाईं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से ‘हस्सनाआ के पुत्र’; इससे किसी परिवार या कुल के लोग भी अभिप्रेत हो सकते हैं।
    reason: lexical_alternative
  - marker: b
    text: या ‘उसे ढका’ अथवा ‘उसकी कड़ियाँ लगाईं।’ इब्रानी क्रिया निर्माण के संदर्भ में किसी संरचना को ढकने का बोध कराती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: שַׁעַר הַדָּגִים
  choice: मछली फाटक
  rationale: यह यरूशलेम के एक विशिष्ट फाटक का नाम है; हिंदी में संक्षिप्त और स्वाभाविक नाम-रूप रखा गया है।
- source_word: בָּנוּ
  choice: बनाया
  rationale: मूल क्रिया का सामान्य अर्थ ‘बनाना’ है। व्यापक प्रसंग पुनर्निर्माण का है, पर यहाँ अधिक विशिष्ट ‘मरम्मत की’ कहना मूल से आगे जाता।
- source_word: בְּנֵי הַסְּנָאָה
  choice: हस्सनाआ के वंशजों
  rationale: בני का अर्थ वास्तविक पुत्र भी हो सकता है, किंतु यहाँ निर्माण में लगे परिवार अथवा कुल-समूह के लिए ‘वंशज’ अधिक स्वाभाविक है; नाम के आरंभिक लेखयुक्त रूप को ‘हस्सनाआ’ से दर्शाया गया है।
- source_word: הֵמָּה
  choice: उन्होंने
  rationale: स्वतंत्र सर्वनाम विषय को स्पष्ट अथवा हल्का उभार देता है, पर हिंदी में ‘उन्होंने’ ही इसे स्वाभाविक रूप से व्यक्त करता है; ‘उन्होंने स्वयं’ अनावश्यक रूप से अधिक जोर दे सकता है।
- source_word: קֵרוּהוּ
  choice: उस पर छत डाली
  rationale: निर्माण-संदर्भ में क्रिया किसी संरचना को ढकने या उसकी छत/कड़ियाँ लगाने को सूचित करती है; यह हिंदी में स्पष्ट और स्वाभाविक अभिव्यक्ति है।
- source_word: וַיַּעֲמִידוּ דַּלְתֹתָיו
  choice: उसके किवाड़ ... लगाए
  rationale: शाब्दिक भाव ‘खड़ा किया’ है, पर फाटक के किवाड़ों के संदर्भ में ‘लगाए’ स्थापना को सहज रूप से व्यक्त करता है।
- source_word: מַנְעוּלָיו
  choice: चिटकनियाँ
  rationale: यह फाटक बंद करने वाले उपकरण को सूचित करता है; साथ आए बड़े बेड़ों से भेद बनाए रखने के लिए ‘चिटकनियाँ’ उपयुक्त है।
- source_word: וּבְרִיחָיו
  choice: और बेड़े
  rationale: בריח दरवाजे या फाटक को सुरक्षित करने वाली आड़ी मजबूत पट्टी है; वास्तु-संदर्भ में ‘बेड़े’ इसका पारंपरिक और सटीक हिंदी शब्द है।
