id: NEH.3.36
reference: Nehemiah 3:36
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: שְׁמַ֤ע אֱלֹהֵ֨י/נוּ֙ כִּֽי הָיִ֣ינוּ בוּזָ֔ה וְ/הָשֵׁ֥ב חֶרְפָּתָ֖/ם אֶל רֹאשָׁ֑/ם וּ/תְנֵ֥/ם לְ/בִזָּ֖ה בְּ/אֶ֥רֶץ שִׁבְיָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/036.yaml
  text: Hear[a], our God, for we are despised. Turn their reproach back on their own heads[c][b], and give them over as plunder in a land of captivity.
translation:
  language: hi
  text: हे हमारे परमेश्वर, सुनिए, क्योंकि हम उपहास का पात्र बन गए हैं। उनका अपमान उन्हीं के सिर पर लौटा दीजिए और उन्हें बँधुआई के देश में लूट का माल बना दीजिए।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שְׁמַע
  choice: सुनिए
  rationale: परमेश्वर से की गई प्रार्थना में प्रयुक्त एकवचन आज्ञार्थक क्रिया है। आदरसूचक रूप आधुनिक हिन्दी में स्वाभाविक है और पाठ में निहित न होने के कारण ‘हमारी सुनिए’ जैसा कर्म नहीं जोड़ा गया।
- source_word: אֱלֹהֵינוּ
  choice: हे हमारे परमेश्वर
  rationale: प्रथम पुरुष बहुवचन प्रत्यय सहित संबोधन है। ‘हे’ हिन्दी में संबोधन को स्पष्ट और प्रार्थना की गरिमा के अनुरूप बनाता है।
- source_word: הָיִינוּ בוּזָה
  choice: हम उपहास का पात्र बन गए हैं
  rationale: शाब्दिक भाव ‘हम उपहास/तिरस्कार बन गए हैं’ है। हिन्दी मुहावरे में ‘उपहास का पात्र बन गए हैं’ परिणामी दशा और संज्ञात्मक अभिव्यक्ति दोनों को स्वाभाविक रूप से रखता है।
- source_word: וְהָשֵׁב חֶרְפָּתָם אֶל רֹאשָׁם
  choice: उनका अपमान उन्हीं के सिर पर लौटा दीजिए
  rationale: שוב का हिफ़ील आज्ञार्थक रूप पलटाकर लौटाने का भाव देता है; ‘उन्हीं के सिर पर’ प्रतिफल के इब्रानी मुहावरे को हिन्दी में सुरक्षित रखता है। חרפה के लिए ‘अपमान’ वर्तमान हिन्दी में सहज है और लज्जा तथा निंदा दोनों का भाव देता है।
- source_word: וּתְנֵם לְבִזָּה
  choice: उन्हें ... लूट का माल बना दीजिए
  rationale: נתן और לְבִזָּה का संयुक्त अर्थ उन्हें लूट के रूप में सौंपने या बना देने का है। यह हिन्दी अभिव्यक्ति लक्ष्यगत अर्थ को स्पष्ट करती है।
- source_word: בְּאֶרֶץ שִׁבְיָה
  choice: बँधुआई के देश में
  rationale: शाब्दिक अर्थ ‘बँधुआई के देश में’ है। यहाँ ‘बँधुआई’ युद्धबंदी होकर ले जाए जाने की ठोस दशा को ‘निर्वासन’ की अपेक्षा अधिक निकटता से व्यक्त करती है; इब्रानी में देश के साथ निश्चित उपपद न होने पर भी हिन्दी में ‘के देश’ संख्या की अनिश्चितता को अनावश्यक रूप से निर्धारित नहीं करता।
theological_decisions:
- issue: शत्रुओं के विरुद्ध दंड की प्रार्थना
  choice: प्रतिफल और लूट बनाए जाने की याचना को सीधे रूप में बनाए रखा गया
  alternative: इसे केवल सामान्य न्याय की प्रार्थना बनाकर नरम करना या रूपक मान लेना
  rationale: इब्रानी पाठ स्पष्ट रूप से शत्रुओं के अपमान को उन्हीं पर लौटाने और उन्हें लूट का माल बनाने की विनती करता है। अनुवाद इस कठिन धार्मिक तनाव को कम या आध्यात्मिकीकृत नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी का आदरसूचक, गरिमापूर्ण प्रार्थना-रजिस्टर अपनाया गया है। भाषा साधारण पाठक के लिए सहज रखी गई है, जबकि ‘उन्हीं के सिर पर’ जैसे मूल मुहावरे और शापात्मक याचना की तीव्रता सुरक्षित हैं।
