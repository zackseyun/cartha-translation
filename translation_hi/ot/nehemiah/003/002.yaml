  text: And next to him the men of Jericho built[a], and next to them Zaccur the son of Imri built.
translation:
  language: hi
  text: उसके पास यरीहो के पुरुषों ने निर्माण किया, और उसके पास[a] इम्री के पुत्र ज़क्कूर ने निर्माण किया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में यहाँ भी ‘उसके पास’ है। इसका संकेत संभवतः पिछले पद में उल्लिखित व्यक्ति की ओर है; क्रम के आधार पर इसे यरीहो के पुरुषों के पास भी समझा जा सकता है।
    reason: सर्वनाम-संदर्भ की वास्तविक अस्पष्टता को सुरक्षित रखना
lexical_decisions:
- source_word: וְעַל יָדוֹ
  choice: उसके पास
  rationale: עַל יָד का यह मुहावरा दीवार पर काम करने वालों की स्थानिक निकटता और क्रम को दर्शाता है। ‘उसके पास’ आधुनिक हिन्दी में स्वाभाविक है और दोनों उपवाक्यों में इब्रानी के एकवचन प्रत्यय को सुरक्षित रखता है।
- source_word: בָנוּ / בָנָה
  choice: निर्माण किया
  rationale: בנה का सामान्य अर्थ ‘बनाना/निर्माण करना’ है। प्रसंग पुनर्निर्माण का है, पर इस पद में क्रिया स्वयं केवल ‘निर्माण करना’ कहती है; इसलिए ‘फिर से बनाया’ जैसी अतिरिक्त स्पष्टता नहीं जोड़ी गई।
- source_word: אַנְשֵׁי יְרֵחוֹ
  choice: यरीहो के लोगों
  rationale: शाब्दिक रूप ‘यरीहो के पुरुष’ है, किंतु यहाँ निर्माण-दल के सामूहिक परिचय के रूप में ‘यरीहो के लोग’ सहज आधुनिक हिन्दी है; इससे समूह का नगर-संबंध बना रहता है।
- source_word: זַכּוּר בֶּן אִמְרִי
  choice: इम्री के पुत्र जक्कूर
  rationale: इब्रानी वंशसूचक संबंध को स्पष्ट, स्वाभाविक हिन्दी क्रम में रखा गया है और नामों का देवनागरी लिप्यंतरण किया गया है।
