translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘शहरपनाह’ जैसे अपेक्षाकृत पुराने शब्द के बजाय ‘दीवार’ और अत्यधिक शाब्दिक ‘लोगों के पास हृदय था’ के बजाय अर्थ-संरक्षित ‘मन लगाया’ चुना गया है।
