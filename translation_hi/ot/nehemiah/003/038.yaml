  text: וַ/נִּבְנֶה֙ אֶת הַ֣/חוֹמָ֔ה וַ/תִּקָּשֵׁ֥ר כָּל הַ/חוֹמָ֖ה עַד חֶצְיָ֑/הּ וַ/יְהִ֧י לֵ֦ב לָ/עָ֖ם לַ/עֲשֽׂוֹת־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/038.yaml
  text: So we rebuilt the wall[a], and the whole wall was joined together up to half its height, for the people had a heart to work.
translation:
  language: hi
  text: इस प्रकार हमने दीवार फिर से बनाई, और पूरी दीवार आधी ऊँचाई तक आपस में जुड़ गई, क्योंकि लोगों का मन काम करने में लगा था।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से, “लोगों के पास करने के लिए मन था।” इसका आशय है कि वे यह काम करने के लिए भीतर से दृढ़ और इच्छुक थे।
    reason: इब्रानी मुहावरे का शाब्दिक रूप और उसका भाव स्पष्ट करना।
lexical_decisions:
- source_word: וַנִּבְנֶה
  choice: इस प्रकार हमने दीवार फिर से बनाई
  rationale: वाव के साथ आया क़ाल क्रियारूप कथा की अगली घटना बताता है। प्रसंग में यरूशलेम की पहले से विद्यमान दीवार की मरम्मत और पुनर्निर्माण हो रहा है, इसलिए ‘फिर से बनाई’ स्वाभाविक है; ‘इस प्रकार’ पिछले प्रसंग से परिणामात्मक संबंध दिखाता है।
- source_word: הַחוֹמָה
  choice: दीवार
  rationale: यह शब्द नगर की रक्षात्मक दीवार को दर्शाता है। संदर्भ से नगर स्पष्ट है, इसलिए सरल और वर्तमान हिंदी में ‘दीवार’ पर्याप्त है।
- source_word: וַתִּקָּשֵׁר
  choice: आपस में जुड़ गई
  rationale: निफ़अल रूप दीवार के अलग-अलग भागों के जुड़कर एक निरंतर संरचना बन जाने का परिणाम व्यक्त करता है।
- source_word: כָּל־הַחוֹמָה
  choice: पूरी दीवार
  rationale: निश्चित संज्ञा के साथ כָּל समग्रता व्यक्त करता है; ‘पूरी दीवार’ स्वाभाविक हिंदी है।
- source_word: עַד־חֶצְיָהּ
  choice: आधी ऊँचाई तक
  rationale: शाब्दिक अर्थ ‘उसके आधे तक’ है। निर्माण के प्रसंग में आशय दीवार की आधी ऊँचाई तक पहुँचने से है; हिंदी में ‘ऊँचाई’ स्पष्ट करना आवश्यक और संदर्भानुकूल है।
- source_word: וַיְהִי לֵב לָעָם
  choice: लोगों ने … मन लगाया था
  rationale: इब्रानी मुहावरा लोगों की भीतरी तत्परता और दृढ़ इच्छा व्यक्त करता है। ‘मन लगाया’ हृदय/मन की छवि को बनाए रखते हुए सहज आधुनिक हिंदी देता है।
- source_word: לַעֲשׂוֹת
  choice: काम करने को
  rationale: עשה का सामान्य अर्थ ‘करना’ है, पर निर्माण के इस प्रसंग में यह कार्य करने को दर्शाता है; इसलिए ‘काम करने’ का चयन किया गया है।
