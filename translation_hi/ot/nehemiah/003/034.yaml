source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר לִ/פְנֵ֣י אֶחָ֗י/ו וְ/חֵיל֙ שֹֽׁמְר֔וֹן וַ/יֹּ֕אמֶר מָ֛ה הַ/יְּהוּדִ֥ים הָ/אֲמֵלָלִ֖ים עֹשִׂ֑ים הֲ/יַעַזְב֨וּ לָ/הֶ֤ם הֲ/יִזְבָּ֨חוּ֙ הַ/יְכַלּ֣וּ בַ/יּ֔וֹם הַ/יְחַיּ֧וּ אֶת הָ/אֲבָנִ֛ים מֵ/עֲרֵמ֥וֹת הֶ/עָפָ֖ר וְ/הֵ֥מָּה שְׂרוּפֽוֹת׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/034.yaml
  text: And he said before his brothers and the army of Samaria[a], and said, “What are these feeble Jews doing? Will they restore it for themselves? Will they sacrifice? Will they finish in a day? Will they revive the stones from the heaps of dust, though they are burned?”
translation:
  language: hi
  text: उसने अपने भाइयों और सामरिया की सेना के सामने कहा, “ये दुर्बल यहूदी क्या कर रहे हैं? क्या वे इसे अपने लिए फिर से बनाएँगे?[a] क्या वे बलिदान चढ़ाएँगे? क्या वे एक ही दिन में काम पूरा कर लेंगे? क्या वे धूल के ढेरों में से उन पत्थरों को फिर से जीवित कर देंगे, जो जले हुए हैं?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी वाक्यांश कठिन है। अधिक शाब्दिक अनुवाद हो सकता है, “क्या वे इसे अपने लिए छोड़ देंगे?” अन्य संभावित अर्थ हैं, “क्या वे इसे अपने बल पर फिर से बनाएँगे?” या “क्या उन्हें अकेला छोड़ दिया जाएगा?”
    reason: lexical_alternative
lexical_decisions:
- source_word: לִפְנֵי אֶחָיו
  choice: अपने भाइयों के सामने
  rationale: לִפְנֵי किसी की उपस्थिति में बोलने को सूचित करता है। אֶחָיו का शाब्दिक अर्थ ‘उसके भाई’ है; यहाँ यह उसके साथियों या अधिकारियों के लिए भी प्रयुक्त हो सकता है, पर मूल की अभिव्यक्ति बनाए रखी गई है।
- source_word: וְחֵיל שֹׁמְרוֹן
  choice: और सामरिया की सेना
  rationale: חֵיל इस सैनिक संदर्भ में सेना या सैन्य दल को सूचित करता है; ‘सेना’ स्वाभाविक और स्पष्ट आधुनिक हिन्दी है।
- source_word: הָאֲמֵלָלִים
  choice: दुर्बल
  rationale: यह शब्द उपहासपूर्ण ढंग से कमजोरी और दयनीय दशा व्यक्त करता है। ‘दुर्बल’ ताने का भाव रखते हुए गरिमापूर्ण हिन्दी देता है।
- source_word: הֲיַעַזְבוּ לָהֶם
  choice: क्या वे इसे अपने लिए फिर से बनाएँगे?
  rationale: עזב का सामान्य अर्थ ‘छोड़ना’ है, किंतु यह वाक्यांश यहाँ कठिन और विवादित है। दीवार के पुनर्निर्माण के प्रसंग में ‘फिर से बनाएँगे’ संभावित आशय व्यक्त करता है; ‘अपने लिए’ לָהֶם को बनाए रखता है। कठिनाई को पादटिप्पणी में स्पष्ट किया गया है।
- source_word: הֲיִזְבָּחוּ
  choice: क्या वे बलिदान चढ़ाएँगे?
  rationale: זבח बलिदान अर्पित करने को सूचित करता है। ‘बलिदान चढ़ाना’ सामान्य आधुनिक हिन्दी में स्वाभाविक धार्मिक अभिव्यक्ति है।
- source_word: הַיְכַלּוּ בַיּוֹם
  choice: क्या वे एक ही दिन में काम पूरा कर लेंगे?
  rationale: כלה का अर्थ पूरा करना या समाप्त करना है। हिन्दी में निहित कार्य को स्पष्ट करने के लिए ‘काम’ जोड़ा गया है और בַיּוֹם के ताने को ‘एक ही दिन में’ व्यक्त किया गया है।
- source_word: הַיְחַיּוּ אֶת הָאֲבָנִים
  choice: क्या वे ... उन पत्थरों को फिर से जीवित कर देंगे
  rationale: חיה का कारक रूप ‘जीवित करना’ या ‘पुनर्जीवित करना’ है। पत्थरों के मानवीकरण और उपहास की सजीवता को समतल करके केवल ‘काम में लाना’ नहीं किया गया।
- source_word: מֵעֲרֵמוֹת הֶעָפָר
  choice: धूल के ढेरों में से
  rationale: עֲרֵמוֹת का अर्थ ढेर और עָפָר का अर्थ धूल या मिट्टी है। यह अनुवाद मूल चित्र के निकट रहता है और संदर्भ से पाठक को मलबे का बोध होने देता है।
- source_word: וְהֵמָּה שְׂרוּפוֹת
  choice: जो जले हुए हैं
  rationale: यह उपवाक्य पत्थरों की आग से क्षतिग्रस्त अवस्था बताता है। संबंधवाचक हिन्दी वाक्य संरचना में इसे स्पष्ट और स्वाभाविक बनाता है।
theological_decisions:
- issue: पुनर्निर्माण और बलिदान से जुड़े तानों का परस्पर संबंध
  choice: सभी को अलग-अलग तीखे आलंकारिक प्रश्नों के रूप में रखा गया है
  alternative: बलिदान को पुनर्निर्माण में सहायता पाने का साधन मानकर अर्थ स्पष्ट करना
  rationale: इब्रानी पाठ संबंध को खुलकर नहीं समझाता। अलग प्रश्न मूल की अस्पष्टता और तीव्र उपहासपूर्ण लय को बनाए रखते हैं तथा कोई अतिरिक्त धार्मिक व्याख्या नहीं जोड़ते।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। लगातार प्रश्नों द्वारा मूल की उपहासपूर्ण, तीव्र लय सुरक्षित की गई है। ‘पत्थरों को फिर से जीवित’ मूल के सजीव रूपक को जानबूझकर बनाए रखता है।
