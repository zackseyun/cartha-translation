base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/013.yaml
  text: Hanun and the inhabitants of Zanoah repaired the Valley Gate[a]. They built it and set up its doors, its bolts, and its bars, and repaired a thousand cubits of the wall[c][b], as far as the Dung Gate.
translation:
  language: hi
  text: हानून और जानोह के निवासियों ने घाटी के फाटक[a] की मरम्मत की। उन्होंने उसे बनाया और उसके किवाड़, चिटकनियाँ और आड़ी छड़ें लगाईं। उन्होंने शहरपनाह के एक हज़ार हाथ[b] लंबे भाग की भी मरम्मत की, कूड़े के फाटक[c] तक।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘घाटी के फाटक को दृढ़ किया’; इस अध्याय के निर्माण-संदर्भ में इब्रानी क्रिया का अर्थ ‘दृढ़ करना’ या ‘मरम्मत करना’ हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: एक हज़ार हाथ (अम्मा) लगभग 457 मीटर हैं।
    reason: cultural_note
  - marker: c
    text: या, ‘मल का फाटक।’
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶחֱזִיק
  choice: मरम्मत की
  rationale: नहेमायाह 3 के पुनर्निर्माण-संदर्भ में यह क्रिया किसी भाग को दृढ़ करने अथवा उसकी मरम्मत का दायित्व लेने को दर्शाती है; आधुनिक हिन्दी में ‘मरम्मत की’ सबसे स्वाभाविक है।
- source_word: שַׁעַר הַגַּיְא
  choice: तराई का फाटक
  rationale: यह किसी घाटी अथवा निचले भूभाग से संबद्ध फाटक का नाम है। ‘तराई’ नाम-सदृश संक्षिप्तता रखते हुए सामान्य हिन्दी में बोधगम्य है।
- source_word: יֹשְׁבֵי זָנוֹחַ
  choice: जानोह के निवासी
  rationale: ישב का कृदन्त नगर में रहने वाले लोगों को दर्शाता है; ‘निवासी’ सहज और संक्षिप्त है।
- source_word: הֵמָּה בָנוּהוּ
  choice: उन्होंने उसे बनाया
  rationale: मूल क्रिया स्पष्टतः ‘बनाना’ है। व्यापक संदर्भ पुनर्निर्माण का है, फिर भी ‘बनाया’ मूल के अधिक निकट है।
- source_word: וַיַּעֲמִידוּ
  choice: लगाए
  rationale: शाब्दिक अर्थ खड़ा करना अथवा स्थान पर स्थापित करना है; किवाड़ों और फाटक के उपकरणों के लिए ‘लगाए’ स्वाभाविक हिन्दी है।
- source_word: דַּלְתֹתָיו
  choice: उसके किवाड़
  rationale: बहुवचन फाटक के पल्लों को सूचित करता है; ‘किवाड़’ स्थापत्य-संदर्भ में स्पष्ट और प्रचलित है।
- source_word: מַנְעֻלָיו
  choice: चिटकनियाँ
  rationale: यह फाटक को बंद रखने वाले उपकरणों को दर्शाता है; ‘चिटकनियाँ’ आधुनिक ताले की अपेक्षा प्राचीन स्थापत्य-संदर्भ से बेहतर मेल खाती हैं।
- source_word: בְרִיחָיו
  choice: बेड़े
  rationale: यह फाटक को भीतर से रोकने वाली आड़ी मजबूत छड़ों को दर्शाता है; ‘बेड़े’ पारंपरिक हिन्दी बाइबलीय स्थापत्य-शब्द है।
- source_word: אֶלֶף אַמָּה
  choice: एक हज़ार हाथ
  rationale: अम्मा प्राचीन लंबाई की इकाई है। ‘हाथ’ हिन्दी में उसका पारंपरिक, समझने योग्य समतुल्य है; अनुमानित आधुनिक माप पादटिप्पणी में दिया गया है।
- source_word: בַּחוֹמָה
  choice: शहरपनाह के ... लंबे भाग
  rationale: विस्तार-सूचक वाक्यांश दीवार के उस हिस्से को बताता है जिसकी मरम्मत हुई। ‘शहरपनाह’ नगर की रक्षात्मक दीवार को स्पष्ट करता है।
- source_word: שַׁעַר הָשֲׁפוֹת
  choice: कूड़े का फाटक
  rationale: नाम का संबंध मल अथवा फेंके गए कचरे से है। ‘कूड़े का फाटक’ अर्थ को सीधे और शिष्ट आधुनिक हिन्दी में व्यक्त करता है।
