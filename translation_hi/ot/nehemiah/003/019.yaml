  rationale: नहेमायाह 3 के निर्माण-संदर्भ में यह क्रिया दीवार को दृढ़ करने अथवा फिर से बनाने के काम को दर्शाती है; आधुनिक हिन्दी में ‘मरम्मत करने लगा’ स्वाभाविक है।
- source_word: עַל יָדוֹ
  choice: उसके पास
  rationale: अध्याय की निर्माण-सूची में यह पदबंध काम करनेवालों की स्थानगत निकटता बताता है।
- source_word: שַׂר הַמִּצְפָּה
  choice: मिस्पा का अधिकारी
  rationale: שַׂר यहाँ नागरिक अथवा प्रशासनिक नेतृत्व का पद है; ‘अधिकारी’ राजकीय उपाधि का अनावश्यक संकेत दिए बिना अर्थ व्यक्त करता है।
- source_word: מִדָּה שֵׁנִית
  choice: दीवार का एक और भाग
  rationale: शाब्दिक अर्थ ‘दूसरा भाग/माप’ है और संभवतः एज़ेर को मिले अतिरिक्त खंड की ओर संकेत करता है; ‘एक और भाग’ हिन्दी में सहज है, जबकि विकल्प पादटिप्पणी में सुरक्षित है।
- source_word: מִנֶּגֶד
  choice: के सामने से
  rationale: यह किसी स्थलचिह्न के सम्मुख या उसके सामने की स्थिति बताता है; ‘से’ अगले सीमा-बिंदु ‘तक’ के साथ निर्माण-खंड की सीमा स्पष्ट करता है।
- source_word: עֲלֹת
  choice: चढ़ाई
  rationale: עלה का यह रूप ऊपर जानेवाले मार्ग या चढ़ाव को संज्ञा के रूप में दर्शाता है।
- source_word: הַנֶּשֶׁק
  choice: शस्त्रागार
  rationale: शब्द मूलतः अस्त्र-शस्त्र को दर्शा सकता है, पर स्थल-विवरण में सम्भवतः उनके भंडारण से जुड़े स्थान का बोध है; अस्पष्टता पादटिप्पणी में दी गई है।
- source_word: הַמִּקְצֹעַ
  choice: मोड़
  rationale: यह दीवार के कोणीय मोड़ या कोने को दर्शाता है; ‘मोड़’ स्थल-विवरण में स्वाभाविक है और ‘कोना’ पादटिप्पणी में दिया गया है।
