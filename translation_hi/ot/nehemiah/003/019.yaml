base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/019.yaml
  text: Next to him Ezer son of Jeshua[a], official of Mizpah[c][b], repaired another section opposite the ascent to the armory at the angle.
translation:
  language: hi
  text: उसके पास एज़ेर, येशू का पुत्र, जो मिस्पा का अधिकारी था, ने दीवार के एक और भाग[a] की मरम्मत की—कोने पर शस्त्रागार[b] की चढ़ाई के सामने।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘दूसरे भाग’। इब्रानी पदबंध इस बात पर बल दे सकता है कि एज़ेर ने दीवार के एक अतिरिक्त हिस्से की मरम्मत की।
    reason: lexical_alternative
  - marker: b
    text: या ‘अस्त्र-शस्त्र’। इब्रानी शब्द हथियारों को भी दर्शा सकता है; यहाँ सम्भवतः वह उस स्थान के लिए प्रयुक्त है जहाँ हथियार रखे जाते थे।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְחַזֵּק
