  text: וְ/אַל תְּכַס֙ עַל עֲוֺנָ֔/ם וְ/חַטָּאתָ֖/ם מִ/לְּ/פָנֶ֣י/ךָ אַל תִּמָּחֶ֑ה כִּ֥י הִכְעִ֖יסוּ לְ/נֶ֥גֶד הַ/בּוֹנִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/037.yaml
  text: And do not cover over their guilt[a], and do not let their sin be blotted out from before you[b], for they have provoked anger in the presence of the builders.
translation:
  language: hi
  text: और उनके अधर्म को मत ढाँप[a]; और उनका पाप तेरे सामने से न मिटाया जाए। क्योंकि उन्होंने बनानेवालों के सामने क्रोध उत्पन्न किया है[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उनका अधर्म क्षमा न कर”; इब्रानी में शाब्दिक बिंब “अधर्म को ढाँपना” है।
    reason: lexical_alternative
  - marker: b
    text: या “उन्होंने बनानेवालों के सामने तुझे क्रोध दिलाया है।” इब्रानी में क्रोध किसे दिलाया गया, यह स्पष्ट नहीं कहा गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּכַס ... עַל עֲוֺנָם
  choice: उनके अधर्म को मत ढाँप
  rationale: ‘ढाँप’ मूल इब्रानी बिंब को बनाए रखता है; प्रसंग में इसका आशय दोष को अनदेखा करने या क्षमा करने से है।
- source_word: עֲוֺנָם
  choice: उनका अधर्म
  rationale: עָוֹן अपराध, दोष और उसके नैतिक भार को व्यक्त कर सकता है। ‘अधर्म’ यहाँ समानांतर ‘पाप’ से अलग शब्द रखते हुए गंभीरता बनाए रखता है।
- source_word: חַטָּאתָם
  choice: उनका पाप
  rationale: यह חַטָּאת का सीधा, स्वाभाविक और प्रसंगानुकूल अनुवाद है।
- source_word: מִלְּפָנֶיךָ ... תִּמָּחֶה
  choice: तेरे सामने से न मिटाया जाए
  rationale: यह परमेश्वर की उपस्थिति या दृष्टि के सामने से पाप मिटाए जाने के स्थानिक बिंब और कर्मवाच्य रूप, दोनों को सुरक्षित रखता है।
- source_word: הִכְעִיסוּ
  choice: क्रोध भड़काया है
  rationale: हिफ़ील रूप का कारणवाचक अर्थ व्यक्त किया गया है, पर मूल में कर्म स्पष्ट न होने के कारण ‘तुझे’ जोड़कर अस्पष्टता को समाप्त नहीं किया गया।
- source_word: לְנֶגֶד הַבּוֹנִים
  choice: निर्माण करनेवालों के सामने
  rationale: לְנֶגֶד का सीधा स्थानवाचक अर्थ ‘सामने’ है; ‘निर्माण करनेवाले’ הַבּוֹנִים को बिना अनावश्यक वस्तु जोड़े व्यक्त करता है।
theological_decisions:
- issue: शत्रुओं के पाप के विषय में दंडात्मक प्रार्थना
  choice: परमेश्वर से उनके अधर्म को न ढाँपने और पाप को न मिटाने की कठोर विनती को यथावत रखा गया।
  alternative: इसे नरम करके ‘उनके गलत कामों को अनदेखा न कर’ कहना।
  rationale: मूल पाठ स्पष्ट रूप से कठोर प्रार्थना करता है। उसके धर्मवैचारिक तनाव को किसी साम्प्रदायिक व्याख्या या नरमी से दूर नहीं किया गया।
- issue: क्रोध का अप्रकट कर्म
  choice: ‘क्रोध भड़काया है’ कहकर कर्म को अप्रकट रखा गया।
  alternative: ‘तुझे क्रोध दिलाया है’ कहकर परमेश्वर को स्पष्ट कर्म बनाना।
  rationale: प्रसंग में परमेश्वर अभिप्रेत हो सकता है, पर इब्रानी वाक्य कर्म को स्पष्ट नहीं करता; इसलिए मुख्य पाठ वास्तविक अस्पष्टता बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में प्रार्थना का गंभीर और सीधा स्वर रखा गया है। परमेश्वर के लिए एकवचन आत्मीय-सम्मानसूचक ‘तेरे’ का प्रयोग बाइबलीय प्रार्थना-शैली के अनुरूप है। मूल के ‘ढाँपने’ और ‘सामने से मिटाए जाने’ वाले बिंब सुरक्षित रखे गए हैं; दुर्बोधता घटाने के लिए फुटनोट दिए गए हैं।
