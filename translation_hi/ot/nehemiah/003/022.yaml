  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज कथात्मक शैली रखी गई है। ‘मरम्मत की’ निर्माण-कार्य के प्रसंग को स्पष्ट करता है; ‘मैदानी क्षेत्र’ के साथ पाद-टिप्पणी मूल शब्द की वास्तविक भौगोलिक अस्पष्टता बनाए रखती है।
