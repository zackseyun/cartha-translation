base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/022.yaml
  text: After him the priests[a], the men of the plain, made repairs.
translation:
  language: hi
  text: उसके बाद याजकों ने, जो उस मैदानी क्षेत्र[a] के पुरुष थे, मरम्मत की।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘मैदान’ अथवा ‘ज़िला’। इब्रानी शब्द כִּכָּר किसी मैदान या गोलाकार क्षेत्र को सूचित कर सकता है; यहाँ ठीक किस स्थान की बात है, यह निश्चित नहीं है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַחֲרָיו
  choice: उसके बाद
  rationale: संयोजक और पूर्वसर्गीय रूप का अर्थ क्रम में ‘और उसके बाद’ है; हिन्दी में ‘उसके बाद’ अध्याय की सूचीबद्ध शैली को स्वाभाविक रूप से व्यक्त करता है।
- source_word: הֶחֱזִיקוּ
  choice: मरम्मत की
  rationale: नहेमायाह 3 में यह क्रिया दीवार की मरम्मत के काम में लगने के लिए प्रयुक्त पारिभाषिक मुहावरा है; शाब्दिक ‘दृढ़ किया’ की अपेक्षा यह प्रसंगानुकूल है।
- source_word: הַכֹּהֲנִים
  choice: याजकों
  rationale: निश्चित बहुवचन संज्ञा का सीधा और प्रचलित हिन्दी रूप।
- source_word: אַנְשֵׁי
  choice: पुरुष थे
  rationale: इब्रानी रचना शाब्दिक रूप से ‘...के पुरुष’ कहती है; सम्बन्धवाचक हिन्दी वाक्य में इसे स्वाभाविक रखते हुए स्रोत का पुल्लिंग बहुवचन सुरक्षित किया गया है।
- source_word: הַכִּכָּר
  choice: उस मैदानी क्षेत्र
  rationale: כִּכָּר किसी समतल भूभाग अथवा गोलाकार जिले/क्षेत्र का बोध करा सकता है। ‘मैदानी क्षेत्र’ भूगोल का संकेत देता है और केवल ‘मैदान’ से अधिक स्वाभाविक है, जबकि टिप्पणी में स्थानीय पहचान की अनिश्चितता सुरक्षित है।
theological_decisions: []
