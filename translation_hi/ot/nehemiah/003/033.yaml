  text: וַ/יְהִ֞י כַּ/אֲשֶׁ֧ר שָׁמַ֣ע סַנְבַלַּ֗ט כִּֽי אֲנַ֤חְנוּ בוֹנִים֙ אֶת הַ֣/חוֹמָ֔ה וַ/יִּ֣חַר ל֔/וֹ וַ/יִּכְעַ֖ס הַרְבֵּ֑ה וַ/יַּלְעֵ֖ג עַל הַ/יְּהוּדִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/033.yaml
  text: When Sanballat heard that we were rebuilding the wall[a], he became angry and very enraged, and he mocked the Jews.
translation:
  language: hi
  text: जब सनबल्लत ने सुना कि हम दीवार को फिर से बना रहे हैं, तो उसे क्रोध आया और वह बहुत क्रुद्ध हो उठा; उसने यहूदियों[a] का उपहास किया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “यहूदा के निवासी।” इब्रानी शब्द क्षेत्रीय अर्थ में यहूदा के निवासियों के लिए और व्यापक अर्थ में यहूदियों के लिए प्रयुक्त हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כַּאֲשֶׁר
  choice: जब
  rationale: यह कथात्मक सूत्र अगले घटनाक्रम का परिचय देता है। आधुनिक हिन्दी में ‘जब’ स्वाभाविक है और मूल में न होने वाला ‘अब’ नहीं जोड़ता।
- source_word: סַנְבַלַּט
  choice: सनबल्लत
  rationale: इब्रानी व्यक्तिगत नाम का प्रचलित हिन्दी लिप्यंतरण।
- source_word: כִּי אֲנַחְנוּ בוֹנִים
  choice: कि हम ... फिर से बना रहे हैं
  rationale: कृदन्त जारी कार्य दर्शाता है; प्रसंग में टूटी हुई दीवार की बहाली हो रही है, इसलिए ‘फिर से बना रहे हैं’ अर्थ को स्वाभाविक रूप से स्पष्ट करता है।
- source_word: הַחוֹמָה
  choice: दीवार
  rationale: חוֹמָה नगर की रक्षात्मक दीवार है। प्रसंग से यरूशलेम की दीवार स्पष्ट होने के कारण सरल ‘दीवार’ पर्याप्त है।
- source_word: וַיִּחַר לוֹ
  choice: उसे क्रोध आया
  rationale: जलते हुए क्रोध के इब्रानी मुहावरे का स्वाभाविक हिन्दी रूप।
- source_word: וַיִּכְעַס הַרְבֵּה
  choice: और वह बहुत भड़क उठा
  rationale: यह दूसरा क्रोध-सूचक पद पहले को तीव्र करता है; अलग अभिव्यक्ति मूल की बढ़ती तीव्रता बनाए रखती है।
- source_word: וַיַּלְעֵג
  choice: उसने ... का उपहास किया
  rationale: क्रिया तिरस्कारपूर्ण हँसी या उपहास को व्यक्त करती है; यह हिन्दी में संक्षिप्त और गरिमापूर्ण है।
- source_word: עַל הַיְּהוּדִים
  choice: यहूदियों
  rationale: יְהוּדִים का सामान्य और सर्वाधिक पहचाना जाने वाला हिन्दी रूप ‘यहूदी’ है; क्षेत्रीय अर्थ ‘यहूदावासी’ पादटिप्पणी में सुरक्षित रखा गया है।
