  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। दो अलग क्रोध-सूचक इब्रानी अभिव्यक्तियों को हिन्दी में अलग रखते हुए उनकी बढ़ती तीव्रता सुरक्षित की गई है। पादटिप्पणी का चिह्न अर्थ-संबंध के अनुसार ‘यहूदियों’ के बाद रखा गया है।
