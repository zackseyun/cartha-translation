base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/005.yaml
  text: And next to them the Tekoites made repairs[b][a], but their nobles would not put their necks to the work of their lords.
translation:
  language: hi
  text: और उनके बगल में तकोआ के लोगों ने मरम्मत की, पर उनके प्रमुख लोगों[a] ने अपने स्वामियों के काम में अपनी गरदन नहीं लगाई[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उनके कुलीन लोग” अथवा “उनके प्रभावशाली लोग।”
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “अपनी गरदन उनके स्वामियों के काम में नहीं लाए।” यह अधीन होकर काम का भार उठाने या श्रम में लगने से इनकार करने का रूपक है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל־יָדָם
  choice: और उनके पास
  rationale: नहेमायाह 3 की निर्माण-सूची में यह पदबंध अगला, साथ लगा हुआ कार्य-स्थान बताता है; ‘उनके पास’ स्वाभाविक हिंदी है।
- source_word: הֶחֱזִיקוּ
  choice: मरम्मत की
  rationale: इस अध्याय के संदर्भ में क्रिया दीवार के किसी भाग को सुधारने या पुनः दृढ़ करने का कार्य बताती है।
- source_word: הַתְּקוֹעִים
  choice: तकोआ के लोगों
  rationale: यह तकोआ के निवासियों के लिए प्रयुक्त स्थानवाचक जातिवाचक रूप है; हिंदी में स्थान के लोगों के रूप में कहना स्पष्ट और स्वाभाविक है।
- source_word: וְאַדִּירֵיהֶם
  choice: उनके प्रतिष्ठित लोगों
  rationale: शब्द स्थानीय प्रभावशाली, प्रमुख या कुलीन व्यक्तियों को सूचित करता है; ‘प्रतिष्ठित लोग’ सामाजिक प्रमुखता को बिना अनावश्यक राजसी अर्थ के व्यक्त करता है।
- source_word: לֹא הֵבִיאוּ צַוָּרָם
  choice: अपनी गरदन न झुकाई
  rationale: मूल में गरदन लाने का रूपक अधीन होकर श्रम में लगने की अनिच्छा दर्शाता है। हिंदी का ‘गरदन झुकाना’ रूपक को बनाए रखते हुए समझने योग्य है।
- source_word: בַּעֲבֹדַת
  choice: काम के लिए
  rationale: यहाँ संज्ञा सामुदायिक पुनर्निर्माण के श्रम को दर्शाती है; ‘काम’ सामान्य पाठक के लिए सीधा और संदर्भानुकूल है।
- source_word: אֲדֹנֵיהֶם
  choice: अपने अधिकारियों
  rationale: बहुवचन शब्द उनके ऊपर अधिकार रखने वाले मनुष्यों को दर्शाता है। ‘अधिकारी’ मानवीय नेतृत्व को स्पष्ट करता है, यद्यपि ‘स्वामी’ भी संभव है।
theological_decisions:
- issue: אֲדֹנֵיהֶם का संदर्भ
  choice: पुनर्निर्माण से जुड़े मानवीय अधिकारी
  alternative: ‘उनके स्वामियों’; अथवा अर्थ को बदलकर एकवचन परमेश्वर का संदर्भ
  rationale: इब्रानी पाठ बहुवचन ‘उनके स्वामियों/अधिकारियों’ कहता है। इसे एकवचन ‘प्रभु के काम’ में बदलना मूल की व्याकरणिक और अर्थगत अस्पष्टता को अनुचित ढंग से समाप्त करेगा।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण, सरल निर्माण-सूची शैली रखी गई है। ‘गरदन न झुकाई’ मूल रूपक को स्वाभाविक हिंदी में सुरक्षित रखता है; पदचिह्न मुख्य पाठ में क्रम से उपस्थित हैं।
