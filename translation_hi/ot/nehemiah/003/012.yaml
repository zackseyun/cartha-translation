  text: וְ/עַל יָד֣/וֹ הֶחֱזִ֗יק שַׁלּוּם֙ בֶּן הַלּוֹחֵ֔שׁ שַׂ֕ר חֲצִ֖י פֶּ֣לֶךְ יְרוּשָׁלִָ֑ם ה֖וּא וּ/בְנוֹתָֽי/ו־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/012.yaml
  text: Next to him Shallum son of Hallohesh[a], ruler of half the district of Jerusalem, made repairs—he and his daughters.
translation:
  language: hi
  text: उसके पास यरूशलेम के आधे ज़िले के अधिकारी, हल्लोहेश के पुत्र शल्लूम ने अपनी बेटियों के साथ मरम्मत की।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “उसने और उसकी बेटियों ने मरम्मत की।”
    reason: मूल इब्रानी में הוּא וּבְנוֹתָיו (‘वह और उसकी बेटियाँ’) की बलाघाती रचना को मुख्य पाठ में स्वाभाविक हिन्दी के लिए ‘अपनी बेटियों के साथ’ कहा गया है।
lexical_decisions:
- source_word: וְעַל יָדוֹ
  choice: उसके पास
  rationale: यह नहेमायाह 3 में दीवार पर पिछले कामगार के भाग से लगे हुए अगले कार्य-भाग को बताने वाला मुहावरा है; ‘उसके पास’ स्वाभाविक हिन्दी में स्थानिक और क्रमिक अर्थ बनाए रखता है।
- source_word: הֶחֱזִיק
  choice: मरम्मत की
  rationale: इस अध्याय के निर्माण-संदर्भ में हिफ़ईल रूप दीवार की मरम्मत या पुनर्निर्माण में काम करने को दर्शाता है; शाब्दिक ‘मज़बूत किया’ यहाँ भ्रामक हो सकता है।
- source_word: שַׁלּוּם
  choice: शल्लूम
  rationale: इब्रानी व्यक्ति-नाम का देवनागरी लिप्यंतरण।
- source_word: בֶּן הַלּוֹחֵשׁ
  choice: हल्लोहेश के पुत्र
  rationale: पितृनाम को अनूदित करने के बजाय इब्रानी उच्चारण के निकट लिप्यंतरित किया गया है।
- source_word: שַׂר חֲצִי פֶּלֶךְ יְרוּשָׁלִָם
  choice: यरूशलेम के आधे ज़िले के अधिकारी
  rationale: שַׂר किसी शासकीय अधिकारी या प्रधान को और פֶּלֶךְ यहाँ प्रशासनिक ज़िले को दर्शाता है। ‘अधिकारी’ पद की प्रकृति को अनावश्यक रूप से राजकीय बनाए बिना व्यक्त करता है।
- source_word: הוּא וּבְנוֹתָיו
  choice: अपनी बेटियों के साथ
  rationale: यह स्वाभाविक हिन्दी में स्पष्ट करता है कि शल्लूम और उसकी बेटियाँ दोनों काम में सहभागी थीं; बेटियों के उल्लेख को पूर्णतः बनाए रखा गया है।
