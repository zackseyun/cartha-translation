base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/025.yaml
  text: Palal son of Uzai repaired opposite the angle and the tower projecting from the upper house of the king[a], which is by the court of the guard[c][b]. After him Pedaiah son of Parosh repaired.
translation:
  language: hi
  text: ऊजै के पुत्र पालाल ने मोड़ और उस बाहर निकली हुई मीनार के सामने मरम्मत की, जो राजा के ऊपरी भवन से निकलती थी—जो पहरेदारों के आँगन के पास था। उसके बाद परोश के पुत्र पदायाह ने मरम्मत की।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִנֶּגֶד
  choice: के सामने
  rationale: यह स्थान-सूचक पद मरम्मत किए गए भाग को किसी पहचान-चिह्न के सामने या उसके सम्मुख बताता है; आधुनिक हिन्दी में ‘के सामने’ स्वाभाविक और पर्याप्त रूप से अनिर्धारित है।
- source_word: הַמִּקְצוֹעַ
  choice: दीवार का मोड़
  rationale: संज्ञा किसी संरचना के कोण या कोने को सूचित करती है। प्रसंग दीवार की मरम्मत का है, इसलिए ‘दीवार का मोड़’ वास्तु-संबंधी अर्थ को स्पष्ट करता है, बिना किसी अलग कोने की मीनार मान लेने के।
- source_word: הַמִּגְדָּל הַיּוֹצֵא
  choice: बाहर निकली हुई मीनार
  rationale: יצא का कृदंत यहाँ संरचना से बाहर की ओर उभरी या निकली मीनार का वर्णन करता है; यह हिन्दी में स्वाभाविक और वास्तु-संगत है।
- source_word: מִבֵּית הַמֶּלֶךְ הָעֶלְיוֹן
  choice: राजा के ऊपरी भवन से
  rationale: בית का मूल अर्थ ‘घर/भवन’ है और राजकीय प्रसंग में यह महल के किसी भाग को भी सूचित कर सकता है। ‘भवन’ मूल की व्यापकता बनाए रखता है और ‘ऊपरी’ का संबंध उसी राजकीय भवन से रखता है।
- source_word: אֲשֶׁר לַחֲצַר הַמַּטָּרָה
  choice: जो ... पहरेदारों के आँगन के पास थी
  rationale: מטרה पहरे या हिरासत से जुड़े सुरक्षित आँगन को सूचित कर सकता है। ‘पहरेदारों का आँगन’ दंडात्मक अर्थ को अनावश्यक रूप से प्रबल किए बिना प्रसंगगत भाव देता है। स्त्रीलिंग ‘थी’ निकटवर्ती ‘मीनार’ से संबंध व्यक्त करता है, यद्यपि इब्रानी संबंध-विन्यास में कुछ अस्पष्टता है।
- source_word: אַחֲרָיו
  choice: उसके बाद
  rationale: अध्याय की निर्माण-सूची में यह अगले कामगार या अगले मरम्मत-भाग की क्रमिकता बताने वाला सूत्र है।
- source_word: פָּלָל בֶּן אוּזַי
  choice: ऊजै के पुत्र पालाल
  rationale: व्यक्तिनामों का हिन्दी ध्वन्यात्मक लिप्यंतरण किया गया है और इब्रानी वंश-संबंध की स्वाभाविक हिन्दी संरचना अपनाई गई है।
- source_word: פְּדָיָה בֶן פַּרְעֹשׁ
  choice: परोश के पुत्र पदायाह
  rationale: व्यक्तिनामों का हिन्दी ध्वन्यात्मक लिप्यंतरण किया गया है और वंश-संबंध को स्वाभाविक हिन्दी में रखा गया है।
- source_word: '[ellipsis of repair verb]'
  choice: ने मरम्मत की
  rationale: दूसरे उपवाक्य में क्रिया स्पष्ट रूप से नहीं लिखी गई, पर अध्याय की बारंबार प्रयुक्त मरम्मत-सूची से वह समझी जाती है; पूर्ण और स्वाभाविक हिन्दी वाक्य के लिए इसे पूरा किया गया है।
