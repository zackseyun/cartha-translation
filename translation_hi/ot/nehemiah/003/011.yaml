base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/011.yaml
  text: Malchijah son of Harim and Hasshub son of Pahath-moab repaired another section[b][a], and also the Tower of the Ovens.
translation:
  language: hi
  text: हारीम के पुत्र मल्किय्याह और पहत-मोआब के पुत्र हश्शूब ने एक और हिस्से[a] की मरम्मत की और तंदूरों के बुर्ज[b] की भी मरम्मत की।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “दूसरा भाग।” यहाँ इसका आशय मरम्मत के लिए दिए गए एक अतिरिक्त हिस्से से है।
    reason: lexical_alternative
  - marker: b
    text: या “भट्ठियों के बुर्ज।” इब्रानी शब्द का अर्थ तंदूर या भट्ठी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: מִדָּה שֵׁנִית
  choice: दीवार के एक और भाग
  rationale: नहेमायाह 3 के प्रसंग में यह वाक्यांश मरम्मत के लिए दिए गए एक अतिरिक्त हिस्से को दर्शाता है। मूल में 'दीवार' स्पष्ट रूप से नहीं है, पर संदर्भ के कारण इसे जोड़ने से आधुनिक हिन्दी में अर्थ स्वाभाविक और स्पष्ट होता है।
- source_word: הֶחֱזִיק
  choice: मरम्मत की
  rationale: दीवार-निर्माण के इस प्रसंग में क्रिया का अर्थ किसी हिस्से को दृढ़ करना अथवा उसकी मरम्मत करना है; हिन्दी में 'मरम्मत की' सबसे स्पष्ट है।
- source_word: מַלְכִּיָה בֶן חָרִם
  choice: हारीम के पुत्र मल्कियाह
  rationale: व्यक्तिनामों को देवनागरी में लिप्यंतरित किया गया और पुत्र-संबंध को औपचारिक रूप से रखा गया।
- source_word: וְחַשּׁוּב בֶּן פַּחַת מוֹאָב
  choice: और पहत-मोआब के पुत्र हश्शूब
  rationale: संयुक्त कुलनाम को लिप्यंतरित करते हुए हाइफ़न से उसकी एकता दिखाई गई है।
- source_word: וְאֵת
  choice: और ... की भी
  rationale: संयोजक और कर्मचिह्न यहाँ मरम्मत की गई एक अतिरिक्त संरचना को जोड़ते हैं; हिन्दी में 'भी' से यह योगात्मक बल स्वाभाविक ढंग से व्यक्त होता है।
- source_word: מִגְדַּל הַתַּנּוּרִים
  choice: तंदूरों के बुर्ज
  rationale: מִגְדָּל के लिए 'बुर्ज' और תַּנּוּרִים के लिए 'तंदूरों' ठोस चित्र तथा स्थाननाम-जैसी संरचना को बनाए रखते हैं; मूल शब्द भट्ठियों को भी सूचित कर सकता है।
