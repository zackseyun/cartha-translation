  text: אחר/י הֶחֱזִ֜יק חֲנַנְיָ֣ה בֶן שֶׁלֶמְיָ֗ה וְ/חָנ֧וּן בֶּן צָלָ֛ף הַ/שִּׁשִּׁ֖י מִדָּ֣ה שֵׁנִ֑י אַחֲרָ֣י/ו הֶחֱזִ֗יק מְשֻׁלָּם֙ בֶּן בֶּ֣רֶכְיָ֔ה נֶ֖גֶד נִשְׁכָּתֽ/וֹ־־ס־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/030.yaml
  text: After him Hananiah son of Shelemiah and Hanun the sixth son of Zalaph repaired another section[b][a]. After him Meshullam son of Berechiah repaired opposite his chamber.
translation:
  language: hi
  text: उसके बाद[a] शलेम्याह के पुत्र हनन्याह और सालाप के छठे पुत्र हानून ने एक और भाग[b] की मरम्मत की। उसके बाद बेरेक्याह के पुत्र मशुल्लाम ने अपने कक्ष के सामने मरम्मत की।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी के लिखित रूप का शाब्दिक अर्थ “मेरे बाद” हो सकता है; पारंपरिक पठन और इस अध्याय में बार-बार आने वाली क्रम-सूचक अभिव्यक्ति के अनुसार यहाँ “उसके बाद” अनुवाद किया गया है।
    reason: textual_variant
  - marker: b
    text: इब्रानी में शाब्दिक रूप से “दूसरा माप” है; नहेमायाह 3 में यह अभिव्यक्ति मरम्मत के लिए दिए गए एक अतिरिक्त भाग को दर्शाती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אַחֲרַי / אַחֲרָיו
  choice: उसके बाद
  rationale: दीवार की मरम्मत करने वालों की इस सूची में यह बार-बार आने वाली अभिव्यक्ति पिछले कारीगर के बाद के क्रम या स्थान को दिखाती है। पहले प्रयोग के लिखित रूप में ‘मेरे बाद’ की संभावना को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: הֶחֱזִיק
  choice: मरम्मत की
  rationale: नहेमायाह 3 के निर्माण-संदर्भ में यह क्रिया दीवार या उसके भाग को दृढ़ करने अथवा सुधारने के काम में लगने का अर्थ देती है; आधुनिक हिन्दी में ‘मरम्मत की’ स्वाभाविक और सटीक है।
- source_word: הַשִּׁשִּׁי
  choice: छठे पुत्र
  rationale: इब्रानी में केवल ‘छठा’ है, पर वंशावली-सदृश वाक्य में इसका स्वाभाविक आशय सालाप के पुत्रों में हानून का छठा होना है; हिन्दी में अर्थ स्पष्ट करने के लिए ‘पुत्र’ जोड़ा गया है।
- source_word: מִדָּה שֵׁנִי
  choice: एक और भाग
  rationale: शाब्दिक अभिव्यक्ति ‘दूसरा माप’ है, पर इस अध्याय में यह मरम्मत के लिए दिए गए अतिरिक्त खंड को सूचित करती है। शाब्दिक रूप पादटिप्पणी में दिया गया है।
- source_word: נֶגֶד
  choice: सामने
  rationale: यह संबंधबोधक शब्द किसी स्थान के ठीक सामने या उसके सम्मुख होने का संकेत देता है।
- source_word: נִשְׁכָּתוֹ
  choice: अपने कक्ष
  rationale: संज्ञा किसी कमरे या कक्ष को दर्शाती है। ‘कक्ष’ उसके स्थापत्यगत और अपेक्षाकृत औपचारिक भाव को बनाए रखता है, जबकि उसके उपयोग को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: חֲנַנְיָה / שֶׁלֶמְיָה / חָנוּן / צָלָף / מְשֻׁלָּם / בֶּרֶכְיָה
  choice: हनन्याह / शलेम्याह / हानून / सालाप / मशुल्लाम / बेरेक्याह
  rationale: व्यक्तिनामों का अर्थानुवाद करने के बजाय इब्रानी उच्चारण के निकट देवनागरी लिप्यंतरण किया गया है।
