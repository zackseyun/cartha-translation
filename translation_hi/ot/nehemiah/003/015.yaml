  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। निर्माण-संबंधी पदों में प्रचलित हिन्दी शब्द चुने गए हैं; नामों का लिप्यंतरण इब्रानी रूप के निकट है। पादटिप्पणी-चिह्न मुख्य पाठ में संबंधित स्थान-नाम के तुरंत बाद रखा गया है।
