  text: וְ/אֵת֩ שַׁ֨עַר הָ/עַ֜יִן הֶ֠חֱזִיק שַׁלּ֣וּן בֶּן כָּל חֹזֶה֮ שַׂ֣ר פֶּ֣לֶךְ הַ/מִּצְפָּה֒ ה֤וּא יִבְנֶ֨/נּוּ֙ וִ/יטַֽלְלֶ֔/נּוּ ו/יעמידו דַּלְתֹתָ֔י/ו מַנְעֻלָ֖י/ו וּ/בְרִיחָ֑י/ו וְ֠/אֵת חוֹמַ֞ת בְּרֵכַ֤ת הַ/שֶּׁ֨לַח֙ לְ/גַן הַ/מֶּ֔לֶךְ וְ/עַד הַֽ/מַּעֲל֔וֹת הַ/יּוֹרְד֖וֹת מֵ/עִ֥יר דָּוִֽיד־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/015.yaml
  text: And Shallun son of Col-hozeh[a], official of the district of Mizpah, repaired the Fountain Gate. He rebuilt it and roofed it, and set up its doors, its bolts, and its bars, and repaired the wall of the Pool of Shelah by the king’s garden, as far as the stairs that go down from the City of David.
translation:
  language: hi
  text: मिस्पा ज़िले के अधिकारी, कोल-होजे के पुत्र शल्लून ने सोते के फाटक की मरम्मत की। उसी ने उसे फिर बनाया, उस पर छत डाली, और उसके किवाड़, कुंडियाँ और आड़े डंडे लगाए। उसने राजा के बगीचे के पास शेलह के तालाब[a] की दीवार की मरम्मत दाऊद के नगर से उतरने वाली सीढ़ियों तक की।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘सिलोआह का तालाब’ (परंपरागत रूप से सिलोआम से संबद्ध)। यहाँ इब्रानी स्थान-नाम ‘शेलह’ है।
    reason: स्थान-नाम के इब्रानी रूप और उसके अधिक परिचित पारंपरिक नाम, दोनों को सुरक्षित रखना।
lexical_decisions:
- source_word: שַׁעַר הָעַיִן
  choice: सोते का फाटक
  rationale: עַיִן यहाँ जलस्रोत या सोते को सूचित करता है। ‘सोते का फाटक’ यरूशलेम की जल-व्यवस्था के स्थलाकृतिक संदर्भ को स्पष्ट और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: הֶחֱזִיק
  choice: मरम्मत की
  rationale: नहेमायाह 3 के निर्माण-संदर्भ में यह क्रिया दीवार या फाटक की मरम्मत करने के अर्थ में प्रयुक्त हुई है।
- source_word: שַׂר פֶּלֶךְ הַמִּצְפָּה
  choice: मिस्पा ज़िले के अधिकारी
  rationale: שַׂר किसी प्रधान या अधिकारी को और פֶּלֶךְ प्रशासनिक क्षेत्र को दर्शाता है; यह पदवी को बढ़ा-चढ़ाकर बताए बिना आधुनिक हिन्दी में अर्थ स्पष्ट करता है।
- source_word: הוּא יִבְנֶנּוּ
  choice: उसी ने उसे फिर बनाया
  rationale: הוּא का बलवाचक भाव ‘उसी ने’ से सुरक्षित रहता है, और पुनर्स्थापन के संदर्भ में ‘फिर बनाया’ उपयुक्त है।
- source_word: וִיטַלְלֶנּוּ
  choice: उस पर छत डाली
  rationale: टलל से बनी क्रिया यहाँ फाटक की संरचना को छत या आवरण देने का संकेत करती है।
- source_word: דַּלְתֹתָיו מַנְעֻלָיו וּבְרִיחָיו
  choice: उसके किवाड़, चिटकनियाँ और बेड़े
  rationale: तीनों शब्द फाटक के पल्लों और उन्हें बंद-सुरक्षित रखने वाले उपकरणों का क्रम बताते हैं; ‘बेड़े’ आड़े लगाए जाने वाले मजबूत bars को दर्शाता है।
- source_word: חוֹמַת בְּרֵכַת הַשֶּׁלַח
  choice: शेलह के तालाब की दीवार
  rationale: בְּרֵכָה ‘तालाब’ है और שֶּׁלַח को पाठ में उसके इब्रानी रूप के निकट एक स्थान-नाम के रूप में रखा गया है; पारंपरिक नाम पादटिप्पणी में दिया गया है।
- source_word: לְגַן הַמֶּלֶךְ
  choice: राजा के बगीचे के पास
  rationale: इस स्थलाकृतिक वर्णन में לְ समीपता या स्थान-संबंध व्यक्त कर सकता है; ‘के पास’ स्वाभाविक हिन्दी है।
- source_word: וְעַד הַמַּעֲלוֹת הַיּוֹרְדוֹת מֵעִיר דָּוִיד
  choice: दाऊदपुर से नीचे उतरने वाली सीढ़ियों तक
  rationale: מַעֲלוֹת सीढ़ियों/सोपानों को और הַיּוֹרְדוֹת उनके नीचे उतरने को दर्शाता है। ‘दाऊदपुर’ עיר דוד के पारंपरिक भौगोलिक नाम को संक्षिप्त और सुबोध हिन्दी में व्यक्त करता है।
