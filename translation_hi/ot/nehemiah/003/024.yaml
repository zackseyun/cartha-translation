base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/024.yaml
  text: After him[a], Binnui son of Henadad repaired another section[b], from the house of Azariah as far as the angle and as far as the corner.
translation:
  language: hi
  text: उसके बाद हेनादाद के पुत्र बिन्नूई ने अज़र्याह के घर से मोड़ तक और कोने तक एक और भाग[a] की मरम्मत की।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “दूसरा मापा हुआ भाग।” हिब्रू पदबंध बिन्नूई द्वारा मरम्मत किए गए एक अतिरिक्त हिस्से अथवा दूसरे निर्धारित हिस्से—दोनों में से किसी को सूचित कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: यहाँ “मोड़” और “कोना” के लिए हिब्रू में दो परस्पर संबंधित, पर अलग शब्द हैं; संभवतः ये पास-पास की दो भिन्न स्थापत्य विशेषताओं को दर्शाते हैं।
    reason: cultural_note
