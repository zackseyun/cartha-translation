- source_word: הֶחֱזִיק
  choice: मरम्मत की
  rationale: मूल क्रिया का सामान्य अर्थ दृढ़ करना है, पर इस अध्याय में यह दीवार की मरम्मत करने के अर्थ में प्रयुक्त हुई है।
- source_word: בִּנּוּי בֶּן־חֵנָדָד
  choice: हेनादाद के पुत्र बिन्नूई
  rationale: हिब्रू नामों का देवनागरी लिप्यंतरण करते हुए पितृनाम-संबंध को स्वाभाविक हिन्दी में व्यक्त किया गया है।
- source_word: מִדָּה שֵׁנִית
  choice: एक और भाग
  rationale: संदर्भ में यह दीवार के अतिरिक्त या दूसरे निर्धारित हिस्से को सूचित करता है। 'एक और भाग' सहज हिन्दी है और मूल की संभावित माप-संबंधी छाया को पादटिप्पणी में रखा गया है।
- source_word: מִבֵּית עֲזַרְיָה
  choice: अजर्याह के घर से
  rationale: यह हिब्रू संबंध और आरंभ-बिंदु को स्पष्ट तथा स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: עַד הַמִּקְצוֹעַ
  choice: दीवार के मोड़ तक
  rationale: यह शब्द दीवार के कोण या मुड़ने के स्थान को दर्शाता है; 'मोड़' अगले शब्द 'कोना' से आवश्यक भेद बनाए रखता है।
- source_word: וְעַד הַפִּנָּה
  choice: और कोने तक
  rationale: पिन्नाह का सामान्य अर्थ कोना या कोने का स्थान है; दोहराए गए 'तक' से स्थल-वर्णन की प्रगति सुरक्षित रहती है।
