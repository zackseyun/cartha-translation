base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/029.yaml
  text: After him Zadok son of Immer made repairs opposite his house[a], and after him Shemaiah son of Shecaniah, keeper of the East Gate[c][b], made repairs.
translation:
  language: hi
  text: उसके बाद इम्मेर के पुत्र सादोक ने अपने घर के सामने मरम्मत की[a]। और उसके बाद शकन्याह के पुत्र शमायाह ने, जो पूर्वी फाटक का रखवाला[b] था, मरम्मत की।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी क्रिया का शाब्दिक अर्थ “दृढ़ किया” है; इस अध्याय में इसका आशय दीवार और फाटकों की मरम्मत करने से है।
    reason: lexical_alternative
  - marker: b
    text: या “पूर्वी फाटक का पहरेदार।”
    reason: lexical_alternative
lexical_decisions:
- source_word: אַחֲרָיו
  choice: उसके बाद
  rationale: नहेमायाह 3 की सूची में यह सूत्र कार्य के क्रम अथवा निकटवर्ती खंड को दर्शाता है; हिंदी में ‘उसके बाद’ स्वाभाविक है और मूल की क्रमिकता बनाए रखता है।
- source_word: הֶחֱזִיק
  choice: मरम्मत की
  rationale: חזק का हिफ़ील रूप यहाँ दीवार और फाटकों को दृढ़ करने, अर्थात उनकी मरम्मत करने, के अध्यायगत अर्थ में प्रयुक्त है।
- source_word: צָדוֹק בֶּן אִמֵּר
  choice: इम्मेर के पुत्र सादोक
  rationale: व्यक्तिनामों का देवनागरी लिप्यंतरण करते हुए בֶּן की वंशसूचक अभिव्यक्ति को ‘के पुत्र’ से व्यक्त किया गया है।
- source_word: נֶגֶד בֵּיתוֹ
  choice: अपने घर के सामने
  rationale: נֶגֶד का अर्थ ‘सामने/सम्मुख’ है; प्रत्यय ‘उसका’ का कर्ता सादोक होना स्वाभाविक है, इसलिए हिंदी में स्पष्ट और सहज आत्मवाचक ‘अपने’ रखा गया है।
- source_word: שְׁמַעְיָה בֶן שְׁכַנְיָה
  choice: शकन्याह के पुत्र शमायाह
  rationale: नामों का स्रोत-सापेक्ष देवनागरी लिप्यंतरण और वंशसूचक संबंध का स्वाभाविक हिंदी रूप।
- source_word: שֹׁמֵר
  choice: रखवाला
  rationale: कर्तृवाचक कृदंत शमायाह की भूमिका या पद बताता है; ‘रखवाला’ सामान्य आधुनिक हिंदी में द्वार की देखरेख और सुरक्षा दोनों को समेटता है।
- source_word: שַׁעַר הַמִּזְרָח
  choice: पूर्वी फाटक
  rationale: यह विशिष्ट दिशा-नाम वाला फाटक है; ‘पूर्वी फाटक’ आधुनिक हिंदी में स्वाभाविक और अर्थ-सटीक है।
