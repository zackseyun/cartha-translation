  register: आधुनिक मानक हिंदी में सरल, गरिमापूर्ण ऐतिहासिक वर्णन। ‘नतिन’ को विशिष्ट सामुदायिक पद के रूप में लिप्यंतरित किया गया है; वाक्य की स्थान-संबंधी क्रमबद्धता हिब्रू के निकट रखी गई है।
