  text: אחרי הֶחֱזִ֗יק מַלְכִּיָּה֙ בֶּן הַ/צֹּ֣רְפִ֔י עַד בֵּ֥ית הַ/נְּתִינִ֖ים וְ/הָ/רֹכְלִ֑ים נֶ֚גֶד שַׁ֣עַר הַ/מִּפְקָ֔ד וְ/עַ֖ד עֲלִיַּ֥ת הַ/פִּנָּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/031.yaml
  text: After him Malkijah son of the goldsmith repaired as far as the house of the temple servants and the merchants, opposite the Inspection Gate, and as far as the upper room of the corner.
translation:
  language: hi
  text: उसके बाद सुनार के पुत्र मल्किय्याह ने मंदिर-सेवकों और व्यापारियों के भवन तक, निरीक्षण फाटक के सामने, और कोने के ऊपरी कक्ष तक मरम्मत की।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַצֹּרְפִי
  choice: सुनार
  rationale: यह शब्द बहुमूल्य धातु को गलाने और गढ़ने वाले कारीगर को दर्शाता है; प्रसंग में स्वाभाविक हिंदी पद ‘सुनार’ है।
- source_word: הַנְּתִינִים
  choice: नतिनों
  rationale: यह मंदिर-सेवा से जुड़े एक विशिष्ट समुदाय का पारंपरिक पदनाम है; केवल ‘मंदिर के सेवक’ कहने से उसकी सामुदायिक पहचान धुंधली हो सकती है।
- source_word: הָרֹכְלִים
  choice: व्यापारियों
  rationale: बहुवचन पद घूमकर या फुटकर व्यापार करने वालों को सूचित करता है; ‘व्यापारियों’ सहज और पर्याप्त व्यापक है।
- source_word: שַׁעַר הַמִּפְקָד
  choice: निरीक्षण फाटक
  rationale: מפקד का अर्थ गणना, नियुक्ति या निरीक्षण हो सकता है; फाटक के नाम के रूप में ‘निरीक्षण फाटक’ स्रोत की संभावित प्रशासनिक धारणा को बनाए रखता है।
- source_word: עֲלִיַּת הַפִּנָּה
  choice: कोने की अटारी
  rationale: עֲלִיָּה ऊपरी कक्ष या छत पर बने कमरे को दर्शाता है; ‘अटारी’ संक्षिप्त और प्राकृतिक हिंदी है, जबकि संबंधवाचक रचना स्रोत के ‘कोने की’ को सुरक्षित रखती है।
