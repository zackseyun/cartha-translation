  text: וְ/אֵת֩ שַׁ֨עַר הַיְשָׁנָ֜ה הֶחֱזִ֗יקוּ יֽוֹיָדָע֙ בֶּן פָּסֵ֔חַ וּ/מְשֻׁלָּ֖ם בֶּן בְּסֽוֹדְיָ֑ה הֵ֣מָּה קֵר֔וּ/הוּ וַֽ/יַּעֲמִ֨ידוּ֙ דַּלְתֹתָ֔י/ו וּ/מַנְעֻלָ֖י/ו וּ/בְרִיחָֽי/ו־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/006.yaml
  text: And Joiada son of Paseah and Meshullam son of Besodeiah repaired the Old Gate. They laid its beams and set up its doors[a], its bolts, and its bars.
translation:
  language: hi
  text: पुराने फाटक[a] की मरम्मत पासेह के पुत्र योयादा और बसोद्याह के पुत्र मशुल्लाम ने की। उन्होंने उसकी छत के शहतीर लगाए और उसके किवाड़, बोल्ट और अर्गल लगाए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या संभवतः “यशाना फाटक”; यदि दूसरे शब्द को ‘पुराना’ विशेषण न मानकर किसी स्थान का नाम माना जाए।
    reason: alternative_reading
lexical_decisions:
- source_word: הֶחֱזִיקוּ
  choice: मरम्मत की
  rationale: नहेमायाह 3 के निर्माण-वृत्तांत में यह क्रिया किसी भाग को पुनः ठीक और सुदृढ़ करने के अर्थ में प्रयुक्त है; आधुनिक हिन्दी में ‘मरम्मत की’ स्वाभाविक है।
- source_word: שַׁעַר הַיְשָׁנָה
  choice: पुराना फाटक
  rationale: पदबंध का सबसे स्वाभाविक अर्थ फाटक के नाम या वर्णन के रूप में ‘पुराना फाटक’ है; स्थान-नाम ‘यशाना’ की सम्भावना पादटिप्पणी में रखी गई है।
- source_word: קֵרֻהוּ
  choice: उसमें कड़ियाँ लगाईं
  rationale: क्रिया छत या आवरण के लिए शहतीर अथवा कड़ियाँ लगाने को सूचित करती है। फाटक की संरचना के प्रसंग में यह हिन्दी अभिव्यक्ति कार्य को स्पष्ट करती है।
- source_word: וַיַּעֲמִידוּ
  choice: खड़े किए
  rationale: मूल क्रिया का अर्थ किसी वस्तु को उसकी जगह खड़ा या स्थापित करना है; यहाँ फाटक के अंगों को लगाने के लिए ‘खड़े किए’ उपयुक्त है।
- source_word: דַּלְתֹתָיו
  choice: उसके किवाड़
  rationale: बहुवचन फाटक के दोनों पल्लों को दर्शाता है; ‘किवाड़’ नगर-फाटक के प्रसंग में स्वाभाविक और स्पष्ट है।
- source_word: מַנְעֻלָיו
  choice: बेड़े
  rationale: यह शब्द फाटक को बंद रखने वाले सरकने वाले कुंडे या बोल्ट के लिए है। ‘बेड़े’ पारंपरिक स्थापत्य-शब्द है और आधुनिक ताले का भ्रामक संकेत नहीं देता।
- source_word: בְרִיחָיו
  choice: अर्गल
  rationale: यह फाटक को सुरक्षित करने वाली आड़ी रोकने की छड़ों को दर्शाता है; ‘अर्गल’ इसे पहले वाले बंद करने के उपकरण से अलग रखता है।
- source_word: הֵמָּה
  choice: उन्होंने
  rationale: सर्वनाम नामित कारीगरों को अगले कार्यों का कर्ता बनाता है; हिन्दी में ‘उन्होंने’ पर्याप्त और स्वाभाविक है।
- source_word: יוֹיָדָע ... וּמְשֻׁלָּם
  choice: योयादा ... और मशुल्लाम
  rationale: व्यक्तिनामों को उनके इब्रानी रूप के निकट देवनागरी में लिप्यंतरित किया गया है।
- source_word: פָּסֵחַ / בְּסוֹדְיָה
  choice: पासेह / बसोद्याह
  rationale: पितृनामों को अनूदित न करके इब्रानी रूप के निकट देवनागरी में लिप्यंतरित किया गया है।
