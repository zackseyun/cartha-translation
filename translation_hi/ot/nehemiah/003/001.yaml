source:
  edition: WLC
  text: וַ/יָּ֡קָם אֶלְיָשִׁיב֩ הַ/כֹּהֵ֨ן הַ/גָּד֜וֹל וְ/אֶחָ֣י/ו הַ/כֹּהֲנִ֗ים וַ/יִּבְנוּ֙ אֶת שַׁ֣עַר הַ/צֹּ֔אן הֵ֣מָּה קִדְּשׁ֔וּ/הוּ וַֽ/יַּעֲמִ֖ידוּ דַּלְתֹתָ֑י/ו וְ/עַד מִגְדַּ֤ל הַ/מֵּאָה֙ קִדְּשׁ֔וּ/הוּ עַ֖ד מִגְדַּ֥ל חֲנַנְאֵֽל־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/001.yaml
  text: Then Eliashib the high priest rose up with his brothers the priests[a], and they built the Sheep Gate. They consecrated it and set up its doors; they consecrated it as far as the Tower of the Hundred, as far as the Tower of Hananel.
translation:
  language: hi
  text: तब महायाजक एल्याशीब अपने भाई याजकों के साथ उठ खड़ा हुआ, और उन्होंने भेड़ फाटक बनाया। उन्होंने स्वयं उसे पवित्र ठहराया[a] और उसके किवाड़ लगाए। उन्होंने सौ की मीनार तक, हननएल की मीनार तक, उसे पवित्र ठहराया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “समर्पित किया।” इब्रानी क्रिया का अर्थ किसी वस्तु को पवित्र अथवा किसी विशेष उद्देश्य के लिए अलग ठहराना हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  choice: उठ खड़ा हुआ
  rationale: यह קום के आरंभिक क्रियात्मक बल को बनाए रखता है और प्रसंग में काम आरंभ करने का स्वाभाविक संकेत देता है, बिना इसे सीधे ‘काम में लग गया’ बनाकर व्याख्यायित किए।
- source_word: הַכֹּהֵן הַגָּדוֹל
  choice: महायाजक
  rationale: यह इस स्थापित इब्रानी पदवी का प्रचलित और संक्षिप्त हिन्दी समतुल्य है।
- source_word: וְאֶחָיו הַכֹּהֲנִים
  choice: अपने भाई याजकों के साथ
  rationale: ‘भाई’ के पारिवारिक शब्द को बनाए रखते हुए यह स्पष्ट करता है कि वे याजक थे; ‘साथ’ हिन्दी में संयुक्त क्रिया को स्वाभाविक बनाता है।
- source_word: שַׁעַר הַצֹּאן
  choice: भेड़ फाटक
  rationale: नगर के नामित फाटक के लिए यह ठोस संज्ञा और स्थाननाम-सदृश रूप दोनों को बनाए रखता है।
- source_word: הֵמָּה
  choice: उन्होंने स्वयं
  rationale: स्वतंत्र सर्वनाम के जोर को हिन्दी में ‘स्वयं’ से व्यक्त किया गया है।
- source_word: קִדְּשׁוּהוּ
  choice: उसे पवित्र ठहराया
  rationale: यह קדשׁ के किसी वस्तु को पवित्र अथवा विशेष रूप से समर्पित करने के लिए अलग ठहराने के भाव को सुरक्षित रखता है।
- source_word: וַיַּעֲמִידוּ דַּלְתֹתָיו
  choice: उसके किवाड़ लगाए
  rationale: यह फाटक के द्वार-पटों को उनके स्थान पर लगाने का स्वाभाविक हिन्दी वर्णन है और प्रक्रिया को अनावश्यक रूप से विशिष्ट नहीं करता।
- source_word: מִגְדַּל הַמֵּאָה
  choice: सौ की मीनार
  rationale: यह इब्रानी संबंधवाची संरचना और स्थान की पदवी को पारदर्शी रूप से प्रस्तुत करता है।
- source_word: מִגְדַּל חֲנַנְאֵל
  choice: हननएल की मीनार
  rationale: व्यक्तिवाचक नाम का लिप्यंतरण करते हुए ‘मीनार’ पदवी का अनुवाद किया गया है।
- source_word: וְעַד ... עַד
  choice: तक ... तक
  rationale: दोहराए गए עַד को बनाए रखकर पवित्र ठहराए गए विस्तार की दोनों सीमाओं को व्यक्त किया गया है।
theological_decisions:
- issue: फाटक के लिए קדשׁ का धार्मिक भाव
  choice: पवित्र ठहराया
  alternative: समर्पित किया
  rationale: याजकों की क्रिया केवल नागरिक निर्माण नहीं, बल्कि वस्तु को पवित्र उपयोग के लिए अलग ठहराने का संकेत दे सकती है। मुख्य पाठ धार्मिक-पवित्रीकरण का भाव सुरक्षित रखता है, जबकि पादटिप्पणी वैध व्यापक विकल्प बताती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘महायाजक’, ‘फाटक’, ‘किवाड़’ और ‘पवित्र ठहराया’ जैसे परिचित बाइबलीय शब्द स्रोत की ऐतिहासिक तथा धार्मिक प्रकृति को बनाए रखते हैं। पादटिप्पणी-चिह्न उस क्रिया के बाद रखा गया है जिससे उसका संबंध है।
