  text: וְ/אֵ֣ת שַׁ֣עַר הָ/אַשְׁפּ֗וֹת הֶחֱזִיק֙ מַלְכִּיָּ֣ה בֶן רֵכָ֔ב שַׂ֖ר פֶּ֣לֶךְ בֵּית הַכָּ֑רֶם ה֣וּא יִבְנֶ֔/נּוּ וְ/יַעֲמִיד֙ דַּלְתֹתָ֔י/ו מַנְעֻלָ֖י/ו וּ/בְרִיחָֽי/ו׀־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/014.yaml
  text: And Malchijah son of Rechab[a], ruler of the district of Beth-haccherem, repaired the Dung Gate. He built it and set up its doors, its bolts, and its bars.
translation:
  language: hi
  text: रेकाब के पुत्र मल्किय्याह ने, जो बेत-हक्केरेम के ज़िले का शासक था, कूड़ा-फाटक[a] की मरम्मत की। उसने उसे बनाया और उसके किवाड़, चिटकनियाँ और आड़ी सलाखें लगा दीं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘मल-फाटक।’ इब्रानी नाम मल या फेंके हुए कचरे को सूचित करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶחֱזִיק
  choice: मरम्मत की
  rationale: नहेमायाह 3 की निर्माण-सूची में यह क्रिया किसी हिस्से की मरम्मत का दायित्व लेकर उसे ठीक करने के अर्थ में प्रयुक्त हुई है।
- source_word: שַׁעַר הָאַשְׁפּוֹת
  choice: कूड़ा-फाटक
  rationale: אַשְׁפּוֹת मल या फेंके हुए कचरे को सूचित करता है। आधुनिक हिन्दी में स्थान-नाम के रूप में ‘कूड़ा-फाटक’ स्पष्ट और स्वाभाविक है, जबकि अधिक शाब्दिक विकल्प पाद-टिप्पणी में दिया गया है।
- source_word: שַׂר פֶּלֶךְ
  choice: ज़िले का शासक
  rationale: שַׂר अधिकारी या शासक और פֶּלֶךְ प्रशासनिक क्षेत्र को सूचित करता है; यह पदबंध दोनों बातों को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: בֵּית הַכָּרֶם
  choice: बेत-हक्केरेम
  rationale: स्थान-नाम का अनुवाद करने के बजाय उसके इब्रानी उच्चारण को हिन्दी लिपि में रखा गया है।
- source_word: הוּא יִבְנֶנּוּ
  choice: उसने उसे बनाया
  rationale: בנה का मूल अर्थ ‘बनाना’ है। मरम्मत के प्रसंग के बावजूद ‘फिर से बनाया’ जोड़कर स्रोत से अधिक स्पष्ट नहीं किया गया; הוּא को स्वतंत्र कर्ता ‘उसने’ से व्यक्त किया गया है।
- source_word: וְיַעֲמִיד
  choice: लगा दिए
  rationale: यहाँ हिफ़ईल क्रिया फाटक के अंगों को उनके स्थान पर स्थापित करने का अर्थ देती है; ‘लगा दिए’ सहज हिन्दी है।
- source_word: דַּלְתֹתָיו
  choice: उसके किवाड़
  rationale: बहुवचन फाटक के दोनों दरवाज़े या पल्ले दर्शाता है; ‘किवाड़’ इस स्थापत्य प्रसंग में सटीक है।
- source_word: מַנְעֻלָיו
  choice: चिटकनियाँ
  rationale: यह शब्द फाटक को बंद रखने वाले सरकने वाले बोल्ट या बन्धन-साधन को दर्शाता है; ‘चिटकनियाँ’ आधुनिक पाठक के लिए स्पष्ट है।
- source_word: וּבְרִיחָיו
  choice: आड़े बेड़े
  rationale: בְּרִיחַ द्वार को सुरक्षित करने के लिए आर-पार लगाए जाने वाले मजबूत डंडे या बार को दर्शाता है; ‘आड़े बेड़े’ उसके रूप और काम को स्पष्ट करता है।
