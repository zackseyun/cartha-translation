    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל יָדָם
  choice: उनके पास ही
  rationale: नहेमायाह 3 की कार्य-सूची में यह मुहावरा निकटवर्ती स्थान और क्रम को दर्शाता है; यह हिन्दी में स्वाभाविक है।
- source_word: הֶחֱזִיק
  choice: मरम्मत की
  rationale: इस अध्याय में חזק का हिफ़ईल रूप शहरपनाह की मरम्मत अथवा पुनर्निर्माण के काम में भाग लेने के तकनीकी अर्थ में प्रयुक्त है।
- source_word: יְדָיָה
  choice: यदायाह
  rationale: इब्रानी व्यक्तिगत नाम का देवनागरी में निकट ध्वन्यात्मक लिप्यंतरण।
- source_word: בֶן חֲרוּמַף
  choice: हरूमप के पुत्र
  rationale: वंश-संबंध को स्वाभाविक हिन्दी में व्यक्त करते हुए नाम का ध्वन्यात्मक लिप्यंतरण किया गया है।
- source_word: וְנֶגֶד בֵּיתוֹ
  choice: अपने घर के सामने
  rationale: נֶגֶד सामने, सम्मुख या दूसरी ओर होने का स्थानिक संबंध व्यक्त करता है; 'सामने' हिन्दी में स्वाभाविक है और मूल की सीमा में रहता है।
- source_word: וְעַל יָדוֹ
  choice: और उसके पास ही
  rationale: पहले आए निकटता-सूचक मुहावरे की पुनरावृत्ति को बनाए रखते हुए एकवचन संदर्भ व्यक्त किया गया है।
- source_word: חַטּוּשׁ
  choice: हत्तूश
  rationale: इब्रानी व्यक्तिगत नाम का देवनागरी में निकट ध्वन्यात्मक लिप्यंतरण।
- source_word: בֶן חֲשַׁבְנְיָה
  choice: हशबन्याह के पुत्र
  rationale: वंश-संबंध का सीधा हिन्दी रूप और इब्रानी नाम का ध्वन्यात्मक लिप्यंतरण।
