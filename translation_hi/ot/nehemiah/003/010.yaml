  text: उनके पास ही हरूमाफ़ के पुत्र यदायाह ने अपने घर के सामने[a] मरम्मत की, और उसके पास ही हशबन्याह के पुत्र हत्तूश ने मरम्मत की।
  philosophy: optimal-equivalence
  footnotes:
