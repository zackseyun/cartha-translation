lexical_decisions:
- source_word: מֵעַל
  choice: के ऊपर
  rationale: निर्माण-कार्य की इस सूची में यह पिछले खंड की तुलना में दीवार के अगले, ऊपर स्थित भाग को दर्शाता है।
- source_word: שַׁעַר הַסּוּסִים
  choice: घोड़ा फाटक
  rationale: यह संबंधवाचक पद-समूह एक स्थान-नाम की तरह प्रयुक्त है; ‘घोड़ा फाटक’ सहज और संक्षिप्त हिन्दी रूप है।
- source_word: הֶחֱזִיקוּ
  choice: मरम्मत की
  rationale: नहेमायाह 3 के संदर्भ में यह क्रिया दीवार या फाटक को दृढ़ करने अर्थात उसकी मरम्मत करने का काम बताती है।
- source_word: הַכֹּהֲנִים
  choice: याजकों
  rationale: निश्चित बहुवचन संज्ञा का सीधा और प्रचलित हिन्दी रूप।
- source_word: אִישׁ
  choice: हर एक
  rationale: एकवचन रूप यहाँ समूह के प्रत्येक सदस्य के लिए वितरणात्मक अर्थ रखता है।
- source_word: לְנֶגֶד
  choice: के सामने
  rationale: यह किसी स्थान के ठीक सम्मुख या सामने होने का बोध कराता है और घरों से लगी दीवार के खंडों के संदर्भ में स्वाभाविक है।
- source_word: בֵּיתוֹ
  choice: अपने घर
  rationale: तीसरे पुरुष एकवचन प्रत्यय वितरणात्मक ‘हर एक’ से जुड़ा है; हिन्दी में ‘अपने’ प्रत्येक याजक और उसके घर का संबंध स्पष्ट करता है।
