  text: After him the Tekoites repaired another section[a], opposite the great projecting tower, as far as the wall of Ophel.
translation:
  language: hi
  text: उसके बाद तकोआ के लोगों ने एक और भाग[a] की मरम्मत की—बाहर की ओर निकली हुई बड़ी मीनार के सामने से ओपेल की दीवार तक।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘दूसरा भाग।’ इब्रानी पदबंध इस बात पर बल दे सकता है कि तकोआ के लोगों ने अपने पहले हिस्से के अतिरिक्त एक और हिस्से की भी मरम्मत की।
    reason: lexical_alternative
lexical_decisions:
- source_word: אַחֲרָיו
  choice: उसके बाद
  rationale: नहेमायाह 3 की कार्य-सूची में यह पदबंध पिछले कारीगर या दल के बाद कार्य-क्रम को दर्शाता है।
- source_word: הֶחֱזִיקוּ
  choice: मरम्मत की
  rationale: मूल अर्थ ‘दृढ़ करना’ है, पर इस अध्याय के निर्माण-संदर्भ में यह शहरपनाह की मरम्मत अथवा पुनर्निर्माण का प्रचलित तकनीकी प्रयोग है।
- source_word: הַתְּקֹעִים
  choice: तकोआ के लोगों
  rationale: यह तकोआ के निवासियों के लिए प्रयुक्त जातिवाचक रूप है; हिंदी में स्थान के लोगों के रूप में कहना स्वाभाविक और स्पष्ट है।
- source_word: מִדָּה שֵׁנִית
  choice: एक और भाग
  rationale: यह उसी दल द्वारा पहले किए गए काम के अतिरिक्त एक दूसरे हिस्से को सूचित कर सकता है; ‘एक और भाग’ सहज हिंदी है, जबकि वैकल्पिक शाब्दिक अर्थ पादटिप्पणी में रखा गया है।
- source_word: מִנֶּגֶד
  choice: के सामने से
  rationale: यह किसी स्थलचिह्न के सामने या उसकी ओर मुख किए स्थान को बताता है; आरंभ-बिंदु और अंतिम बिंदु वाले हिंदी वाक्य में ‘के सामने से’ स्वाभाविक है।
- source_word: הַמִּגְדָּל הַגָּדוֹל הַיּוֹצֵא
  choice: बाहर की ओर निकली हुई बड़ी मीनार
  rationale: יֹצֵא वास्तु-संदर्भ में दीवार की रेखा से बाहर उभरी या निकली संरचना को दर्शाता है; यह अनुवाद उस स्थानिक विशेषता को स्पष्ट रखता है।
- source_word: וְעַד
  choice: तक
  rationale: यह मरम्मत किए गए भाग की अंतिम सीमा दर्शाता है; हिंदी में ‘से ... तक’ संयोजन सहज है।
- source_word: חוֹמַת הָעֹפֶל
  choice: ओपेल की शहरपनाह
  rationale: חוֹמַת का अर्थ दीवार है, और यहाँ नगर की रक्षात्मक दीवार अभिप्रेत है; ‘शहरपनाह’ संक्षिप्त, प्रतिष्ठित और संदर्भानुकूल हिंदी है।
- source_word: הָעֹפֶל
  choice: ओपेल
  rationale: यह यरूशलेम का स्थान-नाम है, इसलिए इसका लिप्यंतरण किया गया है।
