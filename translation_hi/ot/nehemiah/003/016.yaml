  text: אַחֲרָ֤י/ו הֶחֱזִיק֙ נְחֶמְיָ֣ה בֶן עַזְבּ֔וּק שַׂ֕ר חֲצִ֖י פֶּ֣לֶךְ בֵּֽית צ֑וּר עַד נֶ֨גֶד֙ קִבְרֵ֣י דָוִ֔יד וְ/עַד הַ/בְּרֵכָה֙ הָ/עֲשׂוּיָ֔ה וְ/עַ֖ד בֵּ֥ית הַ/גִּבֹּרִֽים־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/016.yaml
  text: After him Nehemiah son of Azbuk[a], ruler of half the district of Beth-zur, made repairs as far as opposite the tombs of David, and as far as the pool that was made[b], and as far as the house of the mighty men.
translation:
  language: hi
  text: उसके बाद[a] अज़बुक के पुत्र नहेमायाह ने, जो बेत-सूर के आधे ज़िले का अधिकारी था, दाऊद की कब्रों के सामने तक, बनाए गए तालाब तक, और वीरों के भवन[b] तक मरम्मत की।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “उसके बाद” का अनुवाद “उसके पास” भी हो सकता है, यदि इसे क्रम के बजाय स्थान के अर्थ में लिया जाए।
    reason: lexical_alternative
  - marker: b
    text: “वीरों के भवन” का अनुवाद “योद्धाओं का भवन” भी हो सकता है; उस भवन की ठीक पहचान अनिश्चित है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אַחֲרָיו
  choice: उसके बाद
  rationale: दीवार की मरम्मत करने वालों की सूची में यह वाक्यांश सामान्यतः पिछले व्यक्ति या खंड के बाद क्रम को सूचित करता है; स्थानगत अर्थ 'उसके पास' भी संभव है।
- source_word: הֶחֱזִיק
  choice: मरम्मत करता हुआ ... पहुँचा
  rationale: नहेमायाह 3 में חזק का हिफ़ील रूप दीवार या उसके खंडों की मरम्मत करने का रूढ़ प्रयोग है; हिंदी में विस्तार की सीमा बताने वाले लगातार עַד वाक्यांशों के साथ यह रचना स्वाभाविक है।
- source_word: שַׂר חֲצִי פֶּלֶךְ
  choice: आधे ज़िले का अधिकारी
  rationale: फ़ारसी-कालीन प्रशासनिक संदर्भ में שַׂר शासकीय अधिकारी और פֶּלֶךְ प्रशासनिक ज़िला दर्शाता है; 'प्रदेश' क्षेत्र का आकार अनावश्यक रूप से बढ़ा सकता है।
- source_word: בֵּית צוּר
  choice: बेत-सूर
  rationale: स्थान-नाम को अनुवादित करने के बजाय देवनागरी में लिप्यंतरित किया गया है।
- source_word: עַד נֶגֶד קִבְרֵי דָוִיד
  choice: दाऊद की कब्रों के सामने तक
  rationale: נֶגֶד सामने, सम्मुख या विपरीत दिशा में होने का स्थानगत भाव देता है; यह अनुवाद कब्रों के क्षेत्र के भीतर जाने का संकेत नहीं देता।
- source_word: הַבְּרֵכָה הָעֲשׂוּיָה
  choice: बनाए गए तालाब
  rationale: यह इब्रानी के कर्मवाच्य/परिणामसूचक अर्थ को रखता है और तालाब की निर्माण-पद्धति के बारे में अतिरिक्त अनुमान नहीं जोड़ता।
- source_word: בֵּית הַגִּבֹּרִים
  choice: वीरों के भवन
  rationale: גִּבֹּרִים का अर्थ वीर या योद्धा हो सकता है। भवन की ठीक पहचान अनिश्चित होने के कारण 'छावनी' जैसे व्याख्यात्मक शब्द से बचा गया है।
