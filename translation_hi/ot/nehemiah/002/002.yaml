  text: וַ/יֹּאמֶר֩ לִ֨/י הַ/מֶּ֜לֶךְ מַדּ֣וּעַ פָּנֶ֣י/ךָ רָעִ֗ים וְ/אַתָּה֙ אֵֽינְ/ךָ֣ חוֹלֶ֔ה אֵ֣ין זֶ֔ה כִּי אִ֖ם רֹ֣עַֽ לֵ֑ב וָ/אִירָ֖א הַרְבֵּ֥ה מְאֹֽד׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/002/002.yaml
  text: And the king said to me[a], “Why is your face sad[b], though you are not sick? This is nothing but sadness of heart.” Then I was very much afraid.
translation:
  language: hi
  text: राजा ने मुझसे कहा, “तुम्हारा चेहरा उदास[a] क्यों है, जबकि तुम बीमार नहीं हो? यह मन की उदासी[b] के सिवा और कुछ नहीं है।” तब मैं बहुत ही डर गया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से, “तुम्हारा चेहरा बुरा है”—यह उदास या व्याकुल मुख-मुद्रा के लिए एक मुहावरा है।
    reason: lexical_alternative
  - marker: b
    text: इसे “मन का दुख” या “मन की व्याकुलता” भी कहा जा सकता है। इब्रानी में शाब्दिक रूप से “हृदय की बुराई/खराबी” है; यहाँ आशय नैतिक बुराई से नहीं, बल्कि भीतरी दुख से है।
    reason: lexical_alternative
lexical_decisions:
- source_word: מַדּוּעַ
  choice: क्यों
  rationale: कारण पूछने वाले सामान्य प्रश्नवाचक शब्द का स्वाभाविक और सटीक हिन्दी रूप।
- source_word: פָּנֶיךָ רָעִים
  choice: तेरा चेहरा उदास
  rationale: शाब्दिक अर्थ ‘तेरा चेहरा बुरा है’ है, पर यह उदास या व्याकुल मुख-मुद्रा का इब्रानी मुहावरा है; ‘चेहरा उदास’ आधुनिक हिन्दी में भाव स्पष्ट रखता है।
- source_word: חוֹלֶה
  choice: बीमार
  rationale: शारीरिक रोग की अवस्था के लिए सामान्य और स्पष्ट आधुनिक हिन्दी शब्द।
- source_word: אֵין זֶה כִּי אִם
  choice: यह ... के सिवा और कुछ नहीं है
  rationale: यह रचना अन्य सभी व्याख्याओं को नकारकर राजा के निष्कर्ष पर बल देती है; हिन्दी अभिव्यक्ति उसी अनन्यता को बनाए रखती है।
- source_word: רֹעַ לֵב
  choice: मन की उदासी
  rationale: शाब्दिक रूप से ‘हृदय की बुराई/खराबी’; प्रसंग में शारीरिक बीमारी के विपरीत भीतरी दुख या व्याकुलता है, नैतिक बुराई नहीं। ‘मन की उदासी’ इसे स्वाभाविक हिन्दी में व्यक्त करती है।
- source_word: וָאִירָא
  choice: तब मैं ... डर गया
  rationale: वाव-क्रमिक क्रिया कथा को आगे बढ़ाती है; ‘तब’ घटनाक्रम को स्वाभाविक रूप से व्यक्त करता है।
- source_word: הַרְבֵּה מְאֹד
  choice: बहुत ही
  rationale: दोनों तीव्रतासूचक शब्द नहेमायाह के भय पर विशेष बल देते हैं; ‘बहुत ही’ उस बल को सहज हिन्दी में बनाए रखता है।
theological_decisions:
- issue: רֹעַ לֵב का नैतिक या भावात्मक अर्थ
  choice: मन की उदासी
  alternative: मन की बुराई
  rationale: राजा शारीरिक बीमारी और भीतरी दशा की तुलना कर रहा है; अतः यहाँ नैतिक दुष्टता की अपेक्षा अंतर्मन का दुख या व्याकुलता अभिप्रेत है। पादटिप्पणी शाब्दिक व्यापकता को सुरक्षित रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज किंतु गरिमापूर्ण शैली रखी गई है। राजा के प्रत्यक्ष संबोधन में एकवचन ‘तेरा/तू’ मूल इब्रानी के एकवचन रूपों को दर्शाता है। ‘हृदय’ की अपेक्षा ‘मन’ सामान्य पाठक के लिए भावात्मक अर्थ अधिक स्वाभाविक ढंग से संप्रेषित करता है।
