base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/002/007.yaml
  text: Then I said to the king[a], “If it pleases the king, let letters be given to me for the governors Beyond the River[c][b], so that they may let me pass through until I come to Judah.”
translation:
  language: hi
  text: फिर मैंने राजा से कहा, “यदि राजा को यह अच्छा लगे, तो मुझे नदी के पार[a] के राज्यपालों के लिए पत्र दिए जाएँ, ताकि वे मुझे यहूदा पहुँचने तक जाने दें।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “नदी के पार” फ़ारसी प्रशासनिक क्षेत्र का नाम है, जो फरात नदी के पश्चिम के प्रदेश के लिए प्रयुक्त होता था।
    reason: cultural_note
lexical_decisions:
- source_word: וָאֹמַר
  choice: फिर मैंने ... कहा
  rationale: वाव-क्रमागत कथा को आगे बढ़ाता है; ‘फिर’ आधुनिक हिन्दी में घटनाक्रम को स्वाभाविक रूप से व्यक्त करता है।
- source_word: אִם עַל־הַמֶּלֶךְ טוֹב
  choice: यदि राजा को यह अच्छा लगे
  rationale: यह राजदरबार में विनम्र निवेदन का सूत्र है; अनुवाद मूल के ‘अच्छा’ भाव को रखते हुए स्वाभाविक हिन्दी देता है।
- source_word: אִגְּרוֹת יִתְּנוּ לִי
  choice: मुझे ... पत्र दिए जाएँ
  rationale: बहुवचन संज्ञा और विनम्र अप्रत्यक्ष अनुरोध, दोनों को हिन्दी के कर्मवाच्य से सुरक्षित रखा गया है।
- source_word: פַּחֲוֹת
  choice: राज्यपालों
  rationale: यह फ़ारसी प्रादेशिक प्रशासकों का पदनाम है; ‘राज्यपाल’ संक्षिप्त और प्रचलित समतुल्य है।
- source_word: עֵבֶר הַנָּהָר
  choice: महानद के पार
  rationale: यह फ़ारसी साम्राज्य का प्रशासनिक क्षेत्रनाम था। प्रसंग में ‘नद’ फरात है; ‘महानद के पार’ हिन्दी बाइबलीय शैली में क्षेत्रनाम का संकेत देता है।
- source_word: אֲשֶׁר יַעֲבִירוּנִי
  choice: ताकि वे मुझे ... अपने क्षेत्रों से होकर जाने दें
  rationale: हिफ़ील रूप यहाँ सुरक्षित आवागमन अथवा मार्ग देने का भाव रखता है; ‘अपने क्षेत्रों’ संदर्भ से स्पष्ट निहितार्थ है और हिन्दी में उद्देश्य को सहज बनाता है।
- source_word: עַד אֲשֶׁר אָבוֹא אֶל־יְהוּדָה
  choice: यहूदा पहुँचने तक
  rationale: मूल की काल-सीमा को संक्षिप्त, स्वाभाविक हिन्दी में व्यक्त करता है; स्थाननाम ‘यहूदा’ रखा गया है।
