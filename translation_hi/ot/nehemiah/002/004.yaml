  text: וַ/יֹּ֤אמֶר לִ/י֙ הַ/מֶּ֔לֶךְ עַל מַה זֶּ֖ה אַתָּ֣ה מְבַקֵּ֑שׁ וָֽ/אֶתְפַּלֵּ֔ל אֶל אֱלֹהֵ֖י הַ/שָּׁמָֽיִם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/002/004.yaml
  text: Then the king said to me, “What is it that you are seeking?” So I prayed to the God of heaven.
translation:
  language: hi
  text: तब राजा ने मुझसे कहा, “तुम क्या चाहते हो?” तब मैंने स्वर्ग के परमेश्वर से प्रार्थना की।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מְבַקֵּשׁ
  choice: चाहते हो
  rationale: यह क्रिया किसी वस्तु को खोजने के साथ-साथ किसी बात की इच्छा करने या निवेदन करने का अर्थ भी रखती है। इस प्रसंग में राजा नहेमायाह से उसकी अपेक्षा पूछ रहा है, इसलिए सहज हिन्दी में ‘क्या चाहते हो’ उपयुक्त है और अनावश्यक रूप से औपचारिक नहीं है।
- source_word: וָאֶתְפַּלֵּל
  choice: तब मैंने … प्रार्थना की
  rationale: हिब्रू रूप कथा की अगली क्रिया बताता है। ‘प्रार्थना की’ क्रिया का सीधा अर्थ रखता है, जबकि ‘तब’ तत्काल क्रम को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: אֱלֹהֵי הַשָּׁמָיִם
  choice: स्वर्ग के परमेश्वर
  rationale: यह पदवी हिब्रू संरचना का सीधा और प्रचलित हिन्दी रूप है।
theological_decisions:
- issue: राजा को उत्तर देने से पहले की प्रार्थना का स्वरूप
  choice: पाठ केवल यह कहता है कि नहेमायाह ने प्रार्थना की; प्रार्थना मौन थी या संक्षिप्त, यह नहीं जोड़ा गया।
  alternative: ‘मैंने मन ही मन तुरंत प्रार्थना की’
  rationale: संदर्भ ऐसी प्रार्थना का संकेत दे सकता है, पर ये विवरण हिब्रू पाठ में स्पष्ट नहीं हैं; इसलिए अस्पष्टता को बनाए रखा गया है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी। राजा का प्रश्न संक्षिप्त और स्वाभाविक रखा गया है; किसी अतिरिक्त व्याख्या या सांप्रदायिक शब्दावली को नहीं जोड़ा गया।
