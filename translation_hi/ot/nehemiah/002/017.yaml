source:
  edition: WLC
  text: וָ/אוֹמַ֣ר אֲלֵ/הֶ֗ם אַתֶּ֤ם רֹאִים֙ הָ/רָעָה֙ אֲשֶׁ֣ר אֲנַ֣חְנוּ בָ֔/הּ אֲשֶׁ֤ר יְרוּשָׁלִַ֨ם֙ חֲרֵבָ֔ה וּ/שְׁעָרֶ֖י/הָ נִצְּת֣וּ בָ/אֵ֑שׁ לְכ֗וּ וְ/נִבְנֶה֙ אֶת חוֹמַ֣ת יְרוּשָׁלִַ֔ם וְ/לֹא נִהְיֶ֥ה ע֖וֹד חֶרְפָּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/002/017.yaml
  text: 'Then I said to them[a], “You see the trouble we are in: Jerusalem lies in ruins, and its gates have been burned with fire. Come, let us rebuild the wall of Jerusalem[c][b], so that we may no longer be a reproach.”'
translation:
  language: hi
  text: 'तब मैंने उनसे कहा, “तुम उस दुर्दशा को देख रहे हो जिसमें हम पड़े हैं: यरूशलेम उजाड़ पड़ा है और उसके फाटक आग से जला दिए गए हैं। आओ, हम यरूशलेम की शहरपनाह फिर से बनाएँ, ताकि हम फिर अपमान का कारण न हों।”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָרָעָה
  choice: दुर्दशा
  rationale: यहाँ शब्द नैतिक बुराई नहीं, बल्कि विपत्ति और समुदाय की दयनीय दशा बताता है; ‘दुर्दशा’ इस संदर्भ को स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: אֲשֶׁר אֲנַחְנוּ בָהּ
  choice: जिसमें हम पड़े हैं
  rationale: यह मुहावरा वर्तमान कठिन परिस्थिति में होने को बताता है; ‘पड़े हैं’ सामान्य हिंदी में स्थिति की गंभीरता भी बनाए रखता है।
- source_word: חֲרֵבָה
  choice: उजाड़ पड़ा है
  rationale: यह यरूशलेम की ध्वस्त और वीरान अवस्था को दर्शाता है तथा विशेषण की परिणामी दशा को सहज हिंदी में रखता है।
- source_word: נִצְּתוּ בָאֵשׁ
  choice: आग से जला दिए गए हैं
  rationale: निफ़अल का कर्मवाच्य और בָאֵשׁ का स्पष्ट उल्लेख दोनों सुरक्षित रहते हैं।
- source_word: לְכוּ
  choice: आओ
  rationale: शाब्दिक अर्थ ‘जाओ’ हो सकता है, पर यहाँ यह साझा कार्य के लिए प्रेरक निमंत्रण है; हिंदी में ‘आओ’ स्वाभाविक है।
- source_word: וְנִבְנֶה
  choice: हम ... फिर से बनाएँ
  rationale: सहभागी संकल्प को ‘हम ... बनाएँ’ व्यक्त करता है; दीवार पहले मौजूद थी, इसलिए ‘फिर से’ पुनर्निर्माण का संदर्भ स्पष्ट करता है।
- source_word: חוֹמַת יְרוּשָׁלַם
  choice: यरूशलेम की शहरपनाह
  rationale: ‘शहरपनाह’ नगर को घेरने वाली सुरक्षा-दीवार का सटीक और प्रतिष्ठित हिंदी शब्द है।
- source_word: וְלֹא נִהְיֶה עוֹד חֶרְפָּה
  choice: ताकि आगे हम अपमान का कारण न बने रहें
  rationale: חֶרְפָּה सार्वजनिक लज्जा, तिरस्कार और बदनामी का भाव रखता है; यह वाक्य उस सामुदायिक अपमान को स्वाभाविक हिंदी में व्यक्त करता है और उद्देश्य/परिणाम का संबंध बनाए रखता है।
theological_decisions: []
translation_notes:
  register: आधुनिक मानक हिंदी में सहज, गरिमापूर्ण और सामुदायिक आह्वान के अनुरूप भाषा रखी गई है। ‘शहरपनाह’ सामान्य ‘दीवार’ की अपेक्षा किलेबंदी का आशय अधिक स्पष्ट करती है; किसी सांप्रदायिक व्याख्या को नहीं जोड़ा गया है।
