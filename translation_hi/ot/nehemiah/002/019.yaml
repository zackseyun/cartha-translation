base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/002/019.yaml
  text: But when Sanballat the Horonite[a], Tobiah the Ammonite servant, and Geshem the Arab heard, they mocked us and despised us, and said, “What is this thing that you are doing? Are you rebelling against the king?”
translation:
  language: hi
  text: पर जब होरोनी सन्बल्लत, अम्मोनी दास तोबियाह[a] और अरब निवासी गेशेम ने सुना, तो उन्होंने हमारा उपहास किया, हमारा तिरस्कार किया और कहा, “यह क्या है जो तुम कर रहे हो? क्या तुम राजा के विरुद्ध विद्रोह कर रहे हो?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “अम्मोनी सेवक तोबियाह।” यहाँ प्रयुक्त इब्रानी शब्द का सामान्य अर्थ “दास” या “सेवक” है; कुछ लोग इसे अधिक व्यापक रूप से एक पदवी, अर्थात् “अधिकारी,” के अर्थ में लेते हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: पर जब ... ने यह सुना
  rationale: वाव-क्रमबोधक कथा को आगे बढ़ाता है; पूर्ववर्ती प्रगति के विपरीत शत्रुतापूर्ण प्रतिक्रिया दिखाने के लिए ‘पर जब’ स्वाभाविक है।
- source_word: הַחֹרֹנִי
  choice: होरोनी
  rationale: भौगोलिक अथवा जातीय पहचान को नाम के साथ विशेषण के रूप में सुरक्षित रखा गया है।
- source_word: הָעֶבֶד הָעַמּוֹנִי
  choice: अम्मोनी सेवक
  rationale: עֶבֶד का मूल अर्थ दास/सेवक है, पर यहाँ यह तोबियाह की पदवी या पहचान भी हो सकती है। मुख्य पाठ में स्वाभाविक और पर्याप्त रूप से खुला ‘सेवक’ रखा गया है तथा वैकल्पिक आधिकारिक अर्थ पादटिप्पणी में दिया गया है।
- source_word: הָעַרְבִי
  choice: अरबी
  rationale: यह जातीय अथवा क्षेत्रीय विशेषण का सीधा और आधुनिक हिन्दी रूप है।
- source_word: וַיַּלְעִגוּ לָנוּ
  choice: उन्होंने हमारा उपहास किया
  rationale: क्रिया में हँसी उड़ाने और उपहास का भाव है; यह हिन्दी में गरिमापूर्ण तथा स्पष्ट है।
- source_word: וַיִּבְזוּ עָלֵינוּ
  choice: हमें तुच्छ जाना
  rationale: यह अवमानना और हेय समझने का भाव व्यक्त करता है तथा पहले पद के उपहास से अर्थगत तीव्रता बढ़ाता है।
- source_word: מָה הַדָּבָר הַזֶּה אֲשֶׁר אַתֶּם עֹשִׂים
  choice: यह क्या है जो तुम कर रहे हो?
  rationale: इब्रानी प्रश्न की ठोस और आरोपात्मक संरचना को स्वाभाविक आधुनिक हिन्दी में बनाए रखा गया है।
- source_word: הַעַל הַמֶּלֶךְ אַתֶּם מֹרְדִים
  choice: क्या तुम राजा के विरुद्ध विद्रोह कर रहे हो?
  rationale: प्रश्नवाचक और आरोपात्मक बल, על का विरोधार्थ तथा कृदंत से व्यक्त जारी कार्य—तीनों सुरक्षित हैं।
theological_decisions:
- issue: तोबियाह की पदवी में עֶבֶד का अर्थ
  choice: सेवक
  alternative: दास; अधिकारी
  rationale: इस प्रसंग में शब्द सामाजिक अधीनता अथवा प्रशासनिक पदवी दोनों का संकेत दे सकता है। किसी एक ऐतिहासिक स्थिति को अनावश्यक रूप से निश्चित न करते हुए मुख्य पाठ में ‘सेवक’ और पादटिप्पणी में अन्य सम्भावना रखी गई है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में है; शैली कथात्मक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। जातीय/भौगोलिक पदनामों को हिन्दी विशेषणों के रूप में प्रस्तुत किया गया है।
