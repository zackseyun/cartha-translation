base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/002/018.yaml
  text: So I told them that the hand of my God was good upon me[a], and also the words of the king that he had spoken to me. And they said[c][b], “Let us rise up and build.” So they strengthened their hands for the good work.
translation:
  language: hi
  text: तब मैंने उन्हें बताया कि मेरे परमेश्वर का हाथ मुझ पर अनुकूल था,[a] और यह भी कि राजा ने मुझसे क्या कहा था। उन्होंने कहा, “आओ, हम उठें और निर्माण करें।” तब उन्होंने इस भले काम के लिए अपने हाथ मजबूत किए।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मेरे परमेश्वर का हाथ मुझ पर कृपालु था।” इब्रानी में शाब्दिक अर्थ है, “मेरे परमेश्वर का हाथ मुझ पर भला था।”
    reason: lexical_alternative
  - marker: b
    text: 'शाब्दिक अर्थ: “उन्होंने भलाई के लिए अपने हाथ मजबूत किए।”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאַגִּיד
  choice: तब मैंने उन्हें बताया
  rationale: वाव-क्रम कथा को आगे बढ़ाता है; आधुनिक हिन्दी में ‘तब’ और ‘बताया’ प्रसंग की स्वाभाविक गति व्यक्त करते हैं।
- source_word: יַד אֱלֹהַי
  choice: मेरे परमेश्वर का हाथ
  rationale: परमेश्वर की सक्रिय सामर्थ्य और कृपा का इब्रानी रूपक बनाए रखा गया है।
- source_word: אֲשֶׁר הִיא טוֹבָה עָלַי
  choice: किस प्रकार मुझ पर भलाई के लिए था
  rationale: ‘हाथ’ के रूपक को बनाए रखते हुए טוֹבָה עָלַי के अनुकूल प्रभाव और कृपापूर्ण सक्रियता को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וְאַף דִּבְרֵי הַמֶּלֶךְ אֲשֶׁר אָמַר לִי
  choice: और यह भी कि राजा ने मुझसे क्या कहा था
  rationale: וְאַף का योगसूचक बल ‘और यह भी’ से आता है; हिन्दी में आशय को स्वाभाविक रखने के लिए ‘राजा के वे वचन’ की अपेक्षा अप्रत्यक्ष कथन चुना गया है।
- source_word: נָקוּם וּבָנִינוּ
  choice: हम उठें और निर्माण करें
  rationale: प्रथम पुरुष बहुवचन रूप यहाँ सामूहिक संकल्प और प्रोत्साहन व्यक्त करते हैं; ‘उठें’ मूल क्रिया को बनाए रखता है।
- source_word: וַיְחַזְּקוּ יְדֵיהֶם
  choice: तब उन्होंने ... अपने हाथ दृढ़ किए
  rationale: हाथ दृढ़ करने का इब्रानी मुहावरा साहस और काम के लिए तत्परता दर्शाता है; मूल बिंब को संरक्षित किया गया है।
- source_word: לַטּוֹבָה
  choice: इस भले काम के लिए
  rationale: संदर्भ में ‘भलाई/भली बात’ से आशय नगरपनाह के निर्माण का भला उपक्रम है; ‘काम’ को स्पष्ट करना हिन्दी में स्वाभाविक है, जबकि पादटिप्पणी शाब्दिक रूप बताती है।
theological_decisions:
- issue: ‘मेरे परमेश्वर का हाथ मुझ पर भलाई के लिए था’ में ईश्वरीय क्रिया का रूपक
  choice: ‘परमेश्वर का हाथ’ रूपक बनाए रखना
  alternative: ‘मेरे परमेश्वर की कृपा मुझ पर थी’
  rationale: यह रूपक परमेश्वर की सक्रिय सहायता, सामर्थ्य और अनुकूलता को एक साथ व्यक्त करता है; केवल ‘कृपा’ कहने से मूल की अर्थ-व्याप्ति संकुचित हो सकती है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण और सामान्य-पाठक-सुलभ रूप अपनाया गया है। ‘परमेश्वर का हाथ’ और ‘अपने हाथ दृढ़ किए’ जैसे प्रमुख इब्रानी बिंब सुरक्षित रखे गए हैं; जहाँ शाब्दिक हिन्दी अस्वाभाविक होती, वहाँ अर्थ-स्पष्ट पाठ के साथ पादटिप्पणी दी गई है।
