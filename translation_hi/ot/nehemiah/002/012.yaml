source:
  edition: WLC
  text: וָ/אָק֣וּם לַ֗יְלָה אֲנִי֮ וַ/אֲנָשִׁ֣ים מְעַט֮ עִמִּ/י֒ וְ/לֹא הִגַּ֣דְתִּי לְ/אָדָ֔ם מָ֗ה אֱלֹהַ/י֙ נֹתֵ֣ן אֶל לִבִּ֔/י לַ/עֲשׂ֖וֹת לִ/ירוּשָׁלִָ֑ם וּ/בְהֵמָה֙ אֵ֣ין עִמִּ֔/י כִּ֚י אִם הַ/בְּהֵמָ֔ה אֲשֶׁ֥ר אֲנִ֖י רֹכֵ֥ב בָּֽ/הּ׀׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/002/012.yaml
  text: So I arose in the night[a], I and a few men with me, and I had not told anyone what my God was putting into my heart to do for Jerusalem[c][b]. And there was no animal with me except the animal on which I was riding.
translation:
  language: hi
  text: तब मैं रात में उठा, और मेरे साथ केवल कुछ ही पुरुष थे। मैंने किसी को नहीं बताया था कि मेरा परमेश्वर यरूशलेम के लिए क्या करने का विचार मेरे मन में डाल रहा था। और मेरे साथ कोई पशु नहीं था, सिवाय उस पशु के जिस पर मैं सवार था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וָאָקוּם לַיְלָה
  choice: तब मैं रात को उठा
  rationale: קום का कथात्मक रूप प्रसंग की अगली कार्रवाई बताता है; ‘रात को’ समय को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: אֲנִי וַאֲנָשִׁים מְעַט עִמִּי
  choice: मैं और मेरे साथ कुछ थोड़े-से पुरुष
  rationale: स्पष्ट אֲנִי को बनाए रखा गया है और אֲנָשִׁים का पुरुष-संदर्भ सुरक्षित है; ‘कुछ थोड़े-से’ छोटे दल पर बल को व्यक्त करता है।
- source_word: וְלֹא הִגַּדְתִּי לְאָדָם
  choice: मैंने किसी को नहीं बताया था
  rationale: לְאָדָם यहाँ अनिश्चित अर्थ में ‘किसी व्यक्ति को’ है; ‘किसी को नहीं’ हिन्दी में सहज है और अर्थ को अनावश्यक रूप से केवल पुरुषों तक सीमित नहीं करता। पूर्वपूर्ण ‘बताया था’ रात की कार्रवाई से पहले बनी गोपनीयता को स्पष्ट करता है।
- source_word: מָה אֱלֹהַי נֹתֵן אֶל־לִבִּי
  choice: मेरा परमेश्वर ... क्या करने की बात मेरे मन में डाल रहा था
  rationale: נֹתֵן कृदन्त की जारी या सजीव क्रिया को ‘डाल रहा था’ से रखा गया है। לב को हिन्दी में निर्णय और अभिप्राय के केंद्र के रूप में स्वाभाविक ‘मन’ कहा गया है; इसे प्रत्यक्ष वाचिक प्रकाशन नहीं बनाया गया।
- source_word: לַעֲשׂוֹת לִירוּשָׁלִָם
  choice: यरूशलेम के लिए क्या करने
  rationale: לִירוּשָׁלִַם के हितार्थ भाव को ‘के लिए’ व्यक्त करता है और कार्य को पुनर्निर्माण आदि के रूप में समय से पहले निर्दिष्ट नहीं करता।
- source_word: וּבְהֵמָה אֵין עִמִּי כִּי אִם־הַבְּהֵמָה
  choice: जिस पशु पर मैं सवार था, उसे छोड़ मेरे साथ कोई और पशु नहीं था
  rationale: בְּהֵמָה सामान्य पशु-वाचक शब्द है और כִּי אִם अपवाद बताता है। हिन्दी वाक्यक्रम अपवाद को स्पष्ट और सहज बनाता है।
- source_word: אֲשֶׁר אֲנִי רֹכֵב בָּהּ
  choice: जिस पशु पर मैं सवार था
  rationale: रचना संबंधवाचक उपवाक्य तथा רֹכֵב की दृश्य में जारी अवस्था दोनों को स्वाभाविक हिन्दी में सुरक्षित रखती है।
theological_decisions:
- issue: नहेमायाह के भीतरी संकल्प में परमेश्वर की पहल
  choice: ‘मेरा परमेश्वर ... मेरे मन में डाल रहा था’
  alternative: ‘मेरे परमेश्वर ने मेरे मन में डाला था’ अथवा ‘मेरा परमेश्वर मुझे प्रेरित कर रहा था’
  rationale: इब्रानी कृदन्त जारी या सजीव क्रिया की गुंजाइश रखता है। चुना हुआ पाठ परमेश्वर की पहल और नहेमायाह की मानवीय योजना दोनों को बनाए रखता है, पर इसे प्रत्यक्ष वाचिक प्रकाशन या केवल अस्पष्ट प्रेरणा के रूप में नहीं समझाता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और कथात्मक है। ‘पुरुष’ אֲנָשִׁים के वास्तविक समूह-संदर्भ को रखता है, जबकि לְאָדָם के अनिश्चित प्रयोग को सहज ‘किसी को’ से दिया गया है। ‘पशु’ सामान्य בְּהֵמָה को बिना यह अनुमान लगाए व्यक्त करता है कि वह घोड़ा, खच्चर या गधा था।
