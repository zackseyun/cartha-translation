base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/002/016.yaml
  text: But the officials did not know where I had gone or what I was doing[a], and until then I had not told the Jews, the priests, the nobles, the officials, or the rest who were doing the work.
translation:
  language: hi
  text: पर अधिकारियों को नहीं मालूम था कि मैं कहाँ गया था और क्या कर रहा था। तब तक मैंने यहूदियों[a], याजकों, कुलीन लोगों, अधिकारियों और काम करनेवाले बाकी लोगों को कुछ नहीं बताया था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘यहूदा के लोगों’। इब्रानी יְהוּדִים क्षेत्रीय रूप से यहूदा के निवासियों या अधिक व्यापक रूप से यहूदी समुदाय को सूचित कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הַסְּגָנִים
  choice: अधिकारी
  rationale: यह शब्द अधीनस्थ शासकों या प्रशासनिक पदाधिकारियों को सूचित करता है। ‘अधिकारी’ दोनों प्रयोगों में स्वाभाविक है और किसी विशिष्ट फ़ारसी पदनाम को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: יָדְעוּ
  choice: मालूम था
  rationale: ידע का सामान्य अर्थ ‘जानना’ है; नकार के साथ ‘नहीं मालूम था’ आधुनिक हिंदी की स्वाभाविक कथात्मक अभिव्यक्ति है।
- source_word: אָנָה הָלַכְתִּי
  choice: मैं कहाँ गया था
  rationale: אָנָה गंतव्य पूछता है और पूर्ण क्रिया पूर्ववर्ती गतिविधि को दिखाती है; इसलिए यह रूप प्रसंगानुकूल है।
- source_word: וּמָה אֲנִי עֹשֶׂה
  choice: और क्या कर रहा था
  rationale: सहभागी रूप עֹשֶׂה चल रही गतिविधि व्यक्त कर सकता है। ‘और’ मूल संयोजक वाव को बनाए रखता है।
- source_word: לַיְּהוּדִים
  choice: यहूदियों
  rationale: יְהוּדִים व्यापक यहूदी समुदाय या क्षेत्रीय रूप से यहूदा के निवासियों को सूचित कर सकता है। मुख्य पाठ में प्रचलित और सुबोध ‘यहूदियों’ रखा गया है तथा विकल्प पादटिप्पणी में दिया गया है।
- source_word: לַכֹּהֲנִים
  choice: याजकों
  rationale: כֹּהֲנִים के लिए सीधा, प्रतिष्ठित और व्यापक रूप से समझा जाने वाला हिंदी पर्याय।
- source_word: לַחֹרִים
  choice: कुलीन लोगों
  rationale: इस सामाजिक-प्रशासनिक संदर्भ में חֹרִים उच्चवर्गीय या प्रमुख व्यक्तियों को दर्शाता है; ‘कुलीन लोग’ आधुनिक हिंदी में स्पष्ट है।
- source_word: וּלְיֶתֶר עֹשֵׂה הַמְּלָאכָה
  choice: और काम करनेवाले बाकी लोगों
  rationale: יֶתֶר शेष लोगों को और सहभागी पदबंध कार्य में लगे समूह को दर्शाता है। यह अनुवाद उसकी सामूहिक और क्रियात्मक भावना बनाए रखता है।
- source_word: עַד כֵּן
  choice: तब तक
  rationale: यह समय की उस सीमा को दर्शाता है जिसके पहले नहेमायाह ने बात प्रकट नहीं की थी।
- source_word: לֹא הִגַּדְתִּי
  choice: मैंने ... कुछ नहीं बताया था
  rationale: हिफ़इल क्रिया का अर्थ बताना या प्रकट करना है। हिंदी में ‘कुछ नहीं बताया था’ सूचीबद्ध समूहों से सूचना रोके रखने का अर्थ स्वाभाविक रूप से व्यक्त करता है।
