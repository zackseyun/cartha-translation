source:
  edition: WLC
  text: וַ/יִּשְׁמַ֞ע סַנְבַלַּ֣ט הַ/חֹרֹנִ֗י וְ/טֽוֹבִיָּה֙ הָ/עֶ֣בֶד הָֽ/עַמֹּנִ֔י וַ/יֵּ֥רַע לָ/הֶ֖ם רָעָ֣ה גְדֹלָ֑ה אֲשֶׁר בָּ֥א אָדָ֔ם לְ/בַקֵּ֥שׁ טוֹבָ֖ה לִ/בְנֵ֥י יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/002/010.yaml
  text: When Sanballat the Horonite and Tobiah the Ammonite servant heard this[b][a], it was very displeasing to them that a man had come to seek the welfare of the children of Israel.
translation:
  language: hi
  text: जब होरोनी सम्बल्लत और अम्मोनी दास[a] तोबियाह ने यह बात सुनी, तो उन्हें यह बहुत बुरा लगा[b] कि एक आदमी इस्राएलियों के कल्याण की खोज करने आया था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “सेवक।”
    reason: עֶבֶד सामान्यतः ‘दास’ है, पर कुछ संदर्भों में ‘सेवक’ भी हो सकता है।
  - marker: b
    text: 'अधिक शब्दशः: “यह उनके लिए बड़ी बुराई थी”; इब्रानी में ‘बुरा/बुराई’ शब्द-समूह की पुनरावृत्ति बल देने के लिए हुई है।'
    reason: मूल इब्रानी की शब्द-पुनरावृत्ति और अधिक शब्दशः विकल्प को सुरक्षित रखना।
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: यह बात सुनी
  rationale: क्रिया का अर्थ ‘सुना’ है; हिन्दी में पूर्ववर्ती प्रसंग की ओर संकेत करने के लिए ‘यह बात’ स्वाभाविक रूप से जोड़ा गया है।
- source_word: הַחֹרֹנִי
  choice: होरोनी
  rationale: यह सम्बल्लत के स्थान-संबंधी परिचय को दर्शाने वाला जातिवाचक विशेषण है; इसे प्रचलित नामरूप में लिप्यंतरित किया गया है।
- source_word: הָעֶבֶד
  choice: सेवक
  rationale: עֶבֶד का अर्थ संदर्भ के अनुसार सेवक अथवा दास हो सकता है। यहाँ यह तोबियाह की सामाजिक उपाधि है; मुख्य पाठ में स्वाभाविक ‘सेवक’ रखा गया और अधिक कठोर विकल्प पादटिप्पणी में दिया गया है।
- source_word: הָעַמֹּנִי
  choice: अम्मोनी
  rationale: यह तोबियाह के जातीय अथवा राष्ट्रीय परिचय को व्यक्त करता है।
- source_word: וַיֵּרַע לָהֶם רָעָה גְדֹלָה
  choice: उन्हें यह बहुत बुरा लगा
  rationale: इब्रानी में רע शब्द-समूह की पुनरावृत्ति तीव्र अप्रसन्नता व्यक्त करती है। हिन्दी वाक्यांश अर्थ और तीव्रता को स्वाभाविक ढंग से रखता है; अधिक शब्दशः रूप पादटिप्पणी में है।
- source_word: אָדָם
  choice: एक आदमी
  rationale: एकवचन शब्द यहाँ नहेमायाह नामक एक पुरुष की ओर संकेत करता है; इसलिए इसे लिंग-निरपेक्ष ‘कोई व्यक्ति’ नहीं किया गया।
- source_word: לְבַקֵּשׁ טוֹבָה
  choice: भला चाहने
  rationale: वाक्यांश का आशय किसी के हित या कल्याण की खोज और अभिलाषा से है। ‘भला चाहने’ सरल हिन्दी है और טוֹבָה के ‘भलाई’ भाव को बनाए रखता है।
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: इस्राएल की सन्तान का
  rationale: यह पारंपरिक वाचा-संबंधी सामूहिक पद ‘इस्राएल की सन्तान’ को बनाए रखता है और उसके हित को लक्ष्य के रूप में व्यक्त करता है।
theological_decisions:
- issue: אָדָם का लिंग-सटीक अनुवाद
  choice: एक आदमी
  alternative: कोई व्यक्ति
  rationale: संज्ञा एकवचन है और प्रसंग में पुरुष नहेमायाह को सूचित करती है; इसलिए मूल की लिंग-सूचना बनाए रखी गई है।
- issue: עֶבֶד की सामाजिक स्थिति
  choice: सेवक
  alternative: दास
  rationale: इब्रानी पद दोनों अर्थों को वहन कर सकता है और इस पद में तोबियाह की ठीक कानूनी स्थिति स्पष्ट नहीं की गई है। मुख्य पाठ में व्यापक हिन्दी पद रखा गया है और ‘दास’ को पादटिप्पणी में देकर अस्पष्टता सुरक्षित रखी गई है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘सम्बल्लत’, ‘तोबियाह’, ‘होरोनी’ और ‘अम्मोनी’ बाइबलीय नामों व परिचयों के देवनागरी रूप हैं। ‘भला चाहने आया है’ कल्याण की खोज का स्वाभाविक हिन्दी रूप है और मूल के आशय को अनावश्यक व्याख्या के बिना व्यक्त करता है।
