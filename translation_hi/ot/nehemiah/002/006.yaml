  yaml_path: translation/ot/nehemiah/002/006.yaml
  text: Then the king said to me[a], while the queen was sitting beside him, “How long will your journey be, and when will you return?” So it pleased the king to send me, and I gave him a time.
translation:
  language: hi
  text: तब राजा ने मुझसे कहा—जब रानी[a] उसके पास बैठी थी—“तुम्हारी यात्रा कितने समय की होगी, और तुम कब लौटोगे?” राजा ने मुझे भेजना उचित समझा, और मैंने उसके लिए एक समय निश्चित कर दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “राजकीय सहचरी” अथवा “राजकीय पत्नी।” इब्रानी शब्द राजा की रानी या राजकीय सहचरी के लिए प्रयुक्त हुआ है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמֶּלֶךְ
  choice: राजा
  rationale: राजकीय शासक के लिए मानक और स्वाभाविक हिन्दी शब्द।
- source_word: הַשֵּׁגַל
  choice: राजमहिषी
  rationale: यह अपेक्षाकृत दुर्लभ इब्रानी पद राजा की पत्नी अथवा राजकीय सहचरी को सूचित करता है। ‘राजमहिषी’ उसके राजकीय पद और राजा से संबंध दोनों को व्यक्त करता है; अधिक सामान्य विकल्प पादटिप्पणी में दिया गया है।
- source_word: יוֹשֶׁבֶת אֶצְלוֹ
  choice: उसके पास बैठी थी
  rationale: कृदंत और पूर्वसर्गीय पदबंध दृश्य की साथ-साथ चल रही परिस्थिति, बैठने की मुद्रा और निकटता बताते हैं।
- source_word: עַד מָתַי יִהְיֶה מַהֲלָכֲךָ
  choice: तुम्हारी यात्रा कितने समय की होगी
  rationale: शाब्दिक ‘कब तक तुम्हारा जाना होगा’ का स्वाभाविक हिन्दी रूप, जो यात्रा की अवधि पूछे जाने का भाव स्पष्ट रखता है।
- source_word: וּמָתַי תָּשׁוּב
  choice: और तुम कब लौटोगे
  rationale: שׁוּב का सामान्य अर्थ ‘लौटना’ है और प्रश्न का सीधा भाव सुरक्षित रहता है।
- source_word: וַיִּיטַב לִפְנֵי הַמֶּלֶךְ
  choice: राजा को अच्छा लगा
  rationale: यह इब्रानी मुहावरा राजा की स्वीकृति या प्रसन्नता व्यक्त करता है; हिन्दी में यह निकट और सहज अभिव्यक्ति है।
- source_word: וַיִּשְׁלָחֵנִי
  choice: मुझे भेजना
  rationale: पिछले मुहावरे के साथ जोड़कर यह बताता है कि राजा ने नहेमायाह को भेजना स्वीकार किया।
- source_word: וָאֶתְּנָה לוֹ זְמָן
  choice: मैंने उसे एक निश्चित समय बता दिया
  rationale: זְמָן नियत अथवा निर्धारित समय को दर्शाता है। हिन्दी में ‘समय बता दिया’ संदर्भानुसार स्पष्ट करता है कि राजा को अवधि/वापसी का समय दिया गया, जबकि ‘निश्चित’ उसकी निर्धारित प्रकृति बनाए रखता है।
