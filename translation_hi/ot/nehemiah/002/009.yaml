  text: וָֽ/אָב֗וֹא אֶֽל פַּֽחֲווֹת֙ עֵ֣בֶר הַ/נָּהָ֔ר וָ/אֶתְּנָ֣/ה לָ/הֶ֔ם אֵ֖ת אִגְּר֣וֹת הַ/מֶּ֑לֶךְ וַ/יִּשְׁלַ֤ח עִמִּ/י֙ הַ/מֶּ֔לֶךְ שָׂ֥רֵי חַ֖יִל וּ/פָרָשִֽׁים־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/002/009.yaml
  text: So I came to the governors Beyond the River and gave them the king’s letters[b][a]. Now the king had sent with me army officers and horsemen.
translation:
  language: hi
  text: तब मैं नदी के उस पार[a] के राज्यपालों के पास पहुँचा और उन्हें राजा के पत्र दिए। राजा ने मेरे साथ सेना के अधिकारी और घुड़सवार भी भेजे थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात फ़रात नदी के पश्चिम का फ़ारसी प्रशासनिक क्षेत्र, जिसे ‘नदी के पार’ कहा जाता था।
    reason: cultural_note
lexical_decisions:
- source_word: פַּחֲווֹת
  choice: राज्यपालों
  rationale: यह फ़ारसी साम्राज्य के अधीन क्षेत्रों का शासन चलाने वाले अधिकारियों को दर्शाता है; ‘राज्यपाल’ आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: עֵבֶר הַנָּהָר
  choice: महानद के पार
  rationale: यह फ़ारसी प्रशासनिक क्षेत्र का पदनाम है, जिसका आशय फ़रात के पश्चिम का क्षेत्र है। हिन्दी बाइबलीय प्रयोग में ‘महानद’ फ़रात को सूचित करता है और स्रोत की पदनाम-जैसी अभिव्यक्ति बनाए रखता है।
- source_word: אִגְּרוֹת
  choice: पत्र
  rationale: संदर्भ में ये राजा द्वारा दिए गए लिखित अधिकार-पत्र हैं; ‘पत्र’ स्रोत के सामान्य अर्थ के निकट और सहज है।
- source_word: שָׂרֵי חַיִל
  choice: सेना के अधिकारियों
  rationale: यह सैनिक अगुओं या पदाधिकारियों को दर्शाता है; ‘सेना के अधिकारी’ स्पष्ट है और अनावश्यक रूप से उनके विशिष्ट पद को निर्धारित नहीं करता।
- source_word: פָרָשִׁים
  choice: घुड़सवारों
  rationale: यह घोड़ों पर सवार सैनिकों को दर्शाता है; ‘घुड़सवार’ सामूहिक ‘घुड़सवार सेना’ की अपेक्षा मूल शब्द के अधिक निकट है।
- source_word: וַיִּשְׁלַח עִמִּי הַמֶּלֶךְ
  choice: राजा ने मेरे साथ ... भेजा था
  rationale: यद्यपि इब्रानी रूप कथा को आगे बढ़ाता है, यहाँ वाक्य नहेमायाह के साथ मौजूद सुरक्षा-दल की पृष्ठभूमि बताता है; ‘भेजा था’ हिन्दी में उस पूर्ववर्ती कार्य को स्वाभाविक रूप से व्यक्त करता है।
- source_word: וָאָבוֹא
  choice: तब मैं ... पहुँचा
  rationale: संयोजक वाव कथा के अगले क्रमिक कार्य को बताता है; ‘तब’ इस प्रवाह को सहज हिन्दी में रखता है।
