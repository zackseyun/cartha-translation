  text: וְ/אִגֶּ֡רֶת אֶל אָסָף֩ שֹׁמֵ֨ר הַ/פַּרְדֵּ֜ס אֲשֶׁ֣ר לַ/מֶּ֗לֶךְ אֲשֶׁ֣ר יִתֶּן לִ֣/י עֵצִ֡ים לְ֠/קָרוֹת אֶת שַׁעֲרֵ֨י הַ/בִּירָ֤ה אֲשֶׁר לַ/בַּ֨יִת֙ וּ/לְ/חוֹמַ֣ת הָ/עִ֔יר וְ/לַ/בַּ֖יִת אֲשֶׁר אָב֣וֹא אֵלָ֑י/ו וַ/יִּתֶּן לִ֣/י הַ/מֶּ֔לֶךְ כְּ/יַד אֱלֹהַ֖/י הַ/טּוֹבָ֥ה עָלָֽ/י־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/002/008.yaml
  text: and a letter to Asaph[a], the keeper of the king’s forest, that he should give me timber to make beams for the gates of the fortress by the temple, and for the wall of the city, and for the house that I will occupy. And the king gave them to me[d][c][b], according to the good hand of my God upon me.
translation:
  language: hi
  text: और आसाप के नाम भी एक पत्र दीजिए, जो राजा के वन[a] का रखवाला है, ताकि वह मुझे उस भवन से सम्बद्ध दुर्ग के फाटकों, नगर की दीवार और उस घर के लिए जिसमें मैं रहने जाऊँगा, कड़ियाँ लगाने के लिए लकड़ी दे। मेरे परमेश्वर का भला हाथ मुझ पर था, और उसके अनुसार राजा ने मुझे दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘राजा के उद्यान’ अथवा ‘राजा के संरक्षित वृक्ष-क्षेत्र’; इब्रानी शब्द राजकीय देखरेख वाले उद्यान या वन को दर्शा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אִגֶּרֶת
  choice: पत्र
  rationale: यह संज्ञा पत्र अथवा आधिकारिक लिखित आदेश को दर्शाती है; प्रसंग में राजा से माँगा गया ‘पत्र’ सहज और पर्याप्त है।
- source_word: שֹׁמֵר הַפַּרְדֵּס
  choice: राजा के वन का रखवाला
  rationale: פַּרְדֵּס किसी राजकीय उद्यान, संरक्षित वन या प्रबंधित वृक्ष-क्षेत्र को सूचित कर सकता है। निर्माण की लकड़ी दिए जाने के कारण ‘वन’ प्रसंगानुकूल है; विकल्प पादटिप्पणी में रखा गया है।
- source_word: יִתֶּן לִי עֵצִים
  choice: मुझे ... लकड़ी दे
  rationale: עֵצִים का शाब्दिक क्षेत्र वृक्ष/लकड़ी है; निर्माण के प्रसंग में ‘लकड़ी’ स्वाभाविक हिन्दी है।
- source_word: לְקָרוֹת
  choice: कड़ियाँ बनाने को
  rationale: קרה का आशय कड़ियाँ डालने या छत हेतु शहतीर लगाने से है। ‘कड़ियाँ बनाने’ में निर्माण-कार्य स्पष्ट रहता है और अर्थ को केवल छत डालने तक सीमित नहीं किया जाता।
- source_word: שַׁעֲרֵי הַבִּירָה אֲשֶׁר לַבַּיִת
  choice: भवन से सम्बद्ध गढ़ के फाटक
  rationale: בִּירָה गढ़ या दुर्ग है, और אֲשֶׁר לַבַּיִת उसका ‘भवन/घर’ से सम्बन्ध बताता है। मूल की अस्पष्टता बचाने के लिए मुख्य पाठ में ‘भवन’ रखा गया है, न कि निश्चयपूर्वक ‘मन्दिर’।
- source_word: חוֹמַת הָעִיר
  choice: नगर की शहरपनाह
  rationale: यह नगर को घेरने वाली रक्षात्मक दीवार है; ‘शहरपनाह’ हिन्दी बाइबिलीय-ऐतिहासिक प्रसंग में संक्षिप्त और सटीक है।
- source_word: הַבַּיִת אֲשֶׁר אָבוֹא אֵלָיו
  choice: उस घर के लिए जिसमें मैं रहने जाऊँगा
  rationale: शाब्दिक अर्थ ‘जिस घर में मैं जाऊँगा/प्रवेश करूँगा’ है। प्रसंग निवास का संकेत देता है; ‘रहने जाऊँगा’ हिन्दी में स्वाभाविक है और स्वामित्व का दावा नहीं जोड़ता।
- source_word: וַיִּתֶּן לִי הַמֶּלֶךְ
  choice: राजा ने मेरी विनती मान ली
  rationale: 'इब्रानी में वस्तु व्यक्त नहीं है: ‘राजा ने मुझे दिया।’ हिन्दी में यही भाव स्वाभाविक रूप से ‘विनती मान ली’ से व्यक्त होता है और किसी एक अस्पष्ट बहुवचन वस्तु को नहीं गढ़ता।'
- source_word: כְּיַד אֱלֹהַי הַטּוֹבָה עָלַי
  choice: मेरे परमेश्वर का भला हाथ मुझ पर था
  rationale: मूल रूपक को बनाए रखा गया है। कारणात्मक सम्बन्ध को वाक्य-विन्यास में स्पष्ट किया गया है, जैसा प्रसंग संकेत करता है।
theological_decisions:
- issue: परमेश्वर के अनुकूल विधान को ‘भले हाथ’ के रूपक से व्यक्त करना
  choice: मेरे परमेश्वर का भला हाथ मुझ पर था
  alternative: मेरे परमेश्वर ने मुझ पर कृपा की थी
  rationale: ‘हाथ’ का मानवीकरण एज्रा-नहेमायाह की महत्त्वपूर्ण छवि है और परमेश्वर की सक्रिय सहायता को व्यक्त करता है; इसे अमूर्त ‘कृपा’ में समतल नहीं किया गया।
- issue: אֲשֶׁר לַבַּיִת में בַּיִת का सन्दर्भ
  choice: भवन से सम्बद्ध
  alternative: मन्दिर के पास / मन्दिर का
  rationale: यहाँ ‘भवन’ सम्भवतः मन्दिर है, पर इब्रानी केवल ‘घर/भवन’ कहता है और सम्बन्ध भी ‘पास’ अथवा ‘का’ दोनों प्रकार समझा जा सकता है। मुख्य पाठ वास्तविक अस्पष्टता को सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सामान्य-पाठक-सुलभ शैली रखी गई है। ‘शहरपनाह’ ऐतिहासिक रक्षात्मक नगर-दीवार के लिए प्रयुक्त है। मुख्य पाठ में केवल एक आवश्यक पादटिप्पणी है, और उसका चिह्न [a] पाठ में उपस्थित है।
