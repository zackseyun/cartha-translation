base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/002/015.yaml
  text: So I went up by the wadi at night and inspected the wall[a]. Then I turned back and entered by the Valley Gate[b], and returned.
translation:
  language: hi
  text: तब मैं रात में नाले के किनारे-किनारे ऊपर चढ़ा[b] और शहरपनाह का निरीक्षण करता रहा।[a] फिर मैं मुड़ा, घाटी फाटक से भीतर आया और लौट गया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “शहरपनाह को जाँचता रहा” या “उसका सर्वेक्षण करता रहा।” यहाँ प्रयुक्त इब्रानी क्रिया का सामान्य अर्थ “तोड़ना” है, पर इस प्रसंग में इसे सामान्यतः क्षतिग्रस्त शहरपनाह के निरीक्षण के अर्थ में समझा जाता है।
    reason: lexical_alternative
  - marker: b
    text: “नाला” से आशय घाटी, रवीन, या मौसमी जलधारा भी हो सकता है।
    reason: cultural_note
lexical_decisions:
- source_word: עֹלֶה
  choice: ऊपर चढ़ता गया
  rationale: היה के साथ participle यहाँ चलती हुई पृष्ठभूमिगत क्रिया व्यक्त करता है; यह हिंदी में स्वाभाविक रूप से ‘चढ़ता गया’ से प्रकट होती है।
- source_word: בַנַּחַל
  choice: नाले के रास्ते
  rationale: נחל यहाँ बरसाती जलधारा वाली घाटी अथवा नाला है; मार्ग-वर्णन में ‘नाले के रास्ते’ स्वाभाविक है और स्थलाकृति को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: לַיְלָה
  choice: रात को
  rationale: आधुनिक हिंदी में समय बताने का सहज और स्पष्ट रूप।
- source_word: שֹׂבֵר בַּחוֹמָה
  choice: शहरपनाह की जाँच करता गया
  rationale: שׂבר का सामान्य अर्थ ‘तोड़ना’ है, पर इस संदर्भ में नहेमायाह का उद्देश्य टूटी हुई शहरपनाह का निरीक्षण करना है; असामान्य हिब्रू प्रयोग को टिप्पणी में सुरक्षित रखा गया है।
- source_word: בַּחוֹמָה
  choice: शहरपनाह
  rationale: यह यरूशलेम की रक्षात्मक नगर-दीवार है; ‘शहरपनाह’ हिंदी बाइबलीय प्रयोग में सटीक और संक्षिप्त है।
- source_word: וָאָשׁוּב
  choice: मैं मुड़ा
  rationale: पहला שוב दिशा पलटने को सूचित करता है; ‘मुड़ा’ अगले प्रवेश से पहले की गति स्पष्ट करता है।
- source_word: וָאָבֹוא
  choice: भीतर आया
  rationale: फाटक के संदर्भ में בוא नगर के भीतर प्रवेश को दर्शाता है।
- source_word: בְּשַׁעַר הַגַּיְא
  choice: तराई के फाटक से
  rationale: यह एक विशिष्ट नाम वाला नगर-द्वार है; ‘तराई का फाटक’ नाम का पारदर्शी हिंदी रूप है और ‘से’ उसके माध्यम से प्रवेश दर्शाता है।
- source_word: וָאָשׁוּב
  choice: लौट गया
  rationale: अंतिम שוב पूरी रात की यात्रा के समापन और वापसी को व्यक्त करता है।
