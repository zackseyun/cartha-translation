  text: So I came to Jerusalem and was there three days.
translation:
  language: hi
  text: तब मैं यरूशलेम पहुँचा और वहाँ तीन दिन रहा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וָאָבוֹא
  choice: तब मैं ... पहुँचा
  rationale: वाव-क्रमिक रूप कथा की अगली घटना को आगे बढ़ाता है। गंतव्य के साथ בוא के लिए हिंदी में ‘पहुँचा’ स्वाभाविक है, और ‘तब’ घटनाक्रम को स्पष्ट करता है।
- source_word: אֶל יְרוּשָׁלִָם
  choice: यरूशलेम पहुँचा
  rationale: אֶל गति के गंतव्य को सूचित करता है। हिंदी में ‘यरूशलेम को आया’ की अपेक्षा ‘यरूशलेम पहुँचा’ अधिक स्वाभाविक और अर्थनिष्ठ है।
- source_word: וָאֱהִי שָׁם
  choice: और वहाँ ... रहा
  rationale: היה का मूल अर्थ ‘होना’ है; स्थान और अवधि के साथ यहाँ इसका आशय वहाँ बने रहने से है। ‘वहाँ रहा’ आधुनिक हिंदी में सहज है और अनावश्यक अर्थ नहीं जोड़ता।
- source_word: יָמִים שְׁלֹשָׁה
  choice: तीन दिन
  rationale: यह अवधि बताने वाला पद है। हिंदी में ‘तीन दिन रहा’ स्वाभाविक रूप से पूरी अवधि व्यक्त करता है।
