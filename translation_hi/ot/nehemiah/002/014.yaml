  yaml_path: translation/ot/nehemiah/002/014.yaml
  text: Then I went on to the Fountain Gate and to the King’s Pool[b][a], but there was no place for the animal under me to pass.
translation:
  language: hi
  text: फिर मैं सोते का फाटक[a] और राजा के जलाशय तक गया, पर मेरे नीचे जो पशु था, उसके निकलने के लिए जगह नहीं थी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘झरने का फाटक।’ इब्रानी शब्द का अर्थ जल का सोता या झरना हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶעֱבֹר
  choice: फिर मैं ... तक गया
  rationale: עבר यहाँ रात के निरीक्षण में आगे बढ़ने को व्यक्त करता है; स्वाभाविक हिन्दी में ‘फिर ... गया’ क्रमिक गति को स्पष्ट करता है।
- source_word: שַׁעַר הָעַיִן
  choice: सोते का फाटक
  rationale: עַיִן स्थलाकृतिक संदर्भ में जल के सोते या झरने को दर्शाता है। ‘सोता’ प्राकृतिक जलस्रोत का सटीक और प्रचलित हिन्दी शब्द है; ‘झरने का फाटक’ भी संभव है।
- source_word: בְּרֵכַת הַמֶּלֶךְ
  choice: राजा का जलाशय
  rationale: בְּרֵכָה पानी के कुंड, तालाब या जलाशय को दर्शाता है। ‘जलाशय’ नामित शाही जल-संग्रह स्थान के लिए स्वाभाविक और स्पष्ट है।
- source_word: וְאֵין מָקוֹם
  choice: पर ... जगह नहीं थी
  rationale: यह वाक्यांश स्थान के अभाव को बताता है और प्रसंग में आगे बढ़ने की बाधा दिखाता है; इसलिए וְ का विरोधसूचक भाव ‘पर’ से व्यक्त किया गया है।
- source_word: לַבְּהֵמָה
  choice: पशु
  rationale: בְּהֵמָה सामान्य रूप से पशु को दर्शाता है; मूल पाठ उसकी जाति नहीं बताता, इसलिए ‘सवारी’ कहकर अर्थ को अनावश्यक रूप से विशिष्ट नहीं किया गया।
- source_word: לַעֲבֹר
  choice: निकलने
  rationale: स्थान की तंगी के संदर्भ में ‘निकलने’ हिन्दी में बाधित मार्ग से होकर जाने का स्वाभाविक भाव देता है।
- source_word: תַּחְתָּי
  choice: मेरे नीचे जो ... था
  rationale: शाब्दिक अर्थ ‘मेरे नीचे’ है और इससे स्पष्ट होता है कि नहेमायाह उस पशु पर सवार था; मूल की अभिव्यक्ति को सहज हिन्दी वाक्य-विन्यास में रखा गया है।
