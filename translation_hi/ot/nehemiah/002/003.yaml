  text: וָ/אֹמַ֣ר לַ/מֶּ֔לֶךְ הַ/מֶּ֖לֶךְ לְ/עוֹלָ֣ם יִחְיֶ֑ה מַדּ֜וּעַ לֹא יֵרְע֣וּ פָנַ֗/י אֲשֶׁ֨ר הָ/עִ֜יר בֵּית קִבְר֤וֹת אֲבֹתַ/י֙ חֲרֵבָ֔ה וּ/שְׁעָרֶ֖י/הָ אֻכְּל֥וּ בָ/אֵֽשׁ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/002/003.yaml
  text: I said to the king[a], “May the king live forever! Why should my face not be sad, when the city, the place of my fathers’ tombs, lies in ruins and its gates have been consumed by fire?”
translation:
  language: hi
  text: मैंने राजा से कहा, “राजा सदा जीवित रहें! मेरा चेहरा उदास क्यों न हो, जब वह नगर, जहाँ मेरे पुरखाओं की कब्रें हैं,[a] उजाड़ पड़ा है और उसके फाटक आग से भस्म हो गए हैं?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से, “मेरे पुरखाओं की कब्रों का घर”; यह उनके पुरखाओं के दफ़न-स्थान से जुड़े नगर के लिए प्रयुक्त अभिव्यक्ति है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֹמַר
  choice: मैंने ... कहा
  rationale: वय्यिक्तोल कथात्मक भूतकाल को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है; आरम्भिक वाव के लिए अलग से ‘तब’ आवश्यक नहीं।
- source_word: לַמֶּלֶךְ / הַמֶּלֶךְ
  choice: राजा से / राजा
  rationale: पहला रूप कथन के प्राप्तकर्ता को और दूसरा दरबारी संबोधन को दर्शाता है; हिन्दी में पुनरुक्त ‘राजा’ सम्मानसूचक शैली बनाए रखता है।
- source_word: לְעוֹלָם יִחְיֶה
  choice: सदा जीवित रहें
  rationale: यह राजकीय शुभकामना का मानक सूत्र है; ‘रहें’ आदरसूचक कामना को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: לֹא יֵרְעוּ פָנַי
  choice: मेरा चेहरा उदास क्यों न हो
  rationale: चेहरे के साथ רעע उदासी या व्याकुलता दिखाई देने का भाव देता है; अनुवाद मूल चेहरे वाले मुहावरे को बनाए रखते हुए सहज है।
- source_word: אֲשֶׁר
  choice: जब
  rationale: यह आगे दी गई परिस्थिति को नहेमायाह की उदासी के स्पष्टीकरण के रूप में प्रस्तुत करता है और कारणता को अनावश्यक रूप से अधिक स्पष्ट नहीं करता।
- source_word: הָעִיר
  choice: वह नगर
  rationale: संदर्भ यरूशलेम की ओर संकेत करता है, पर मूल पाठ उसका नाम नहीं लेता; ‘वह नगर’ निश्चितता को बनाए रखता है।
- source_word: בֵּית קִבְרוֹת אֲבֹתַי
  choice: जहाँ मेरे पुरखाओं की कब्रें हैं
  rationale: शाब्दिक रूप ‘मेरे पितरों की कब्रों का घर’ है। यहाँ ‘घर’ स्थान/क्षेत्र के अर्थ में है; हिन्दी में संबंधवाचक उपवाक्य अर्थ को स्पष्ट और स्वाभाविक बनाता है।
- source_word: חֲרֵבָה
  choice: उजाड़ पड़ा है
  rationale: विध्वस्त और निर्जन दशा का भाव देता है तथा नगर की वर्तमान स्थिति को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: אֻכְּלוּ בָאֵשׁ
  choice: आग से भस्म हो गए हैं
  rationale: אכל का कर्मवाच्य आग द्वारा निगल लिए जाने/नष्ट किए जाने की छवि देता है; ‘भस्म’ विनाश की तीव्रता को गरिमापूर्ण हिन्दी में व्यक्त करता है।
