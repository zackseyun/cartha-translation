  text: וָ/אָשִׁ֨יב אוֹתָ֜/ם דָּבָ֗ר וָ/אוֹמַ֤ר לָ/הֶם֙ אֱלֹהֵ֣י הַ/שָּׁמַ֔יִם ה֚וּא יַצְלִ֣יחַֽ לָ֔/נוּ וַ/אֲנַ֥חְנוּ עֲבָדָ֖י/ו נָק֣וּם וּ/בָנִ֑ינוּ וְ/לָ/כֶ֗ם אֵֽין חֵ֧לֶק וּ/צְדָקָ֛ה וְ/זִכָּר֖וֹן בִּ/ירוּשָׁלִָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/002/020.yaml
  text: Then I answered them and said[a], “The God of heaven, he will make us prosper, and we his servants will arise and build[b]. But you have no share or right or memorial in Jerusalem.”
translation:
  language: hi
  text: तब मैंने उन्हें उत्तर देकर कहा, “स्वर्ग का परमेश्वर ही हमें सफलता देगा, और हम, उसके सेवक, उठकर निर्माण करेंगे। पर यरूशलेम में तुम्हारा न तो कोई हिस्सा है, न अधिकार, न स्मरण।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וָאָשִׁיב אוֹתָם דָּבָר
  choice: तब मैंने उन्हें उत्तर दिया
  rationale: यह हिब्रू मुहावरा किसी बात का उत्तर देने को व्यक्त करता है; शाब्दिक ‘बात लौटाई’ आधुनिक हिन्दी में अस्वाभाविक होता।
- source_word: אֱלֹהֵי הַשָּׁמַיִם הוּא
  choice: स्वर्ग का परमेश्वर ही
  rationale: הוּא का बल ‘ही’ से स्वाभाविक रूप में व्यक्त होता है और सफलता के स्रोत के रूप में परमेश्वर पर जोर बनाए रखता है।
- source_word: יַצְלִיחַ לָנוּ
  choice: हमें सफलता देगा
  rationale: צלח के हिफ़ील रूप का अर्थ इस कार्य में सफल करना या सफलता प्रदान करना है; यह हिन्दी में स्पष्ट और प्रसंगानुकूल है।
- source_word: עֲבָדָיו
  choice: उसके सेवक
  rationale: यहाँ शब्द परमेश्वर के प्रति अधीनता और सेवा को बताता है, सामाजिक दासता पर जोर नहीं देता।
- source_word: נָקוּם וּבָנִינוּ
  choice: उठकर निर्माण करेंगे
  rationale: इससे दृढ़ होकर काम आरम्भ करने और बनाने की संयुक्त भावी क्रिया सहज हिन्दी में व्यक्त होती है; मूल में कर्म स्पष्ट नहीं किया गया है।
- source_word: אֵין חֵלֶק
  choice: कोई हिस्सा नहीं
  rationale: חֵלֶק किसी भाग या हिस्सेदारी को दर्शाता है; ‘हिस्सा’ साधारण आधुनिक हिन्दी में स्पष्ट है।
- source_word: וּצְדָקָה
  choice: न अधिकार
  rationale: इस कानूनी-राजनीतिक प्रसंग में शब्द नैतिक धार्मिकता के बजाय वैध अधिकार या दावे का बोध कराता है।
- source_word: וְזִכָּרוֹן
  choice: न स्मरण
  rationale: मूल शब्द स्मरण, याद किए जाने या मान्य ऐतिहासिक संबंध की धारणा रखता है; ‘स्मरण’ इस कठिन और कुछ हद तक अस्पष्ट अभिव्यक्ति को अनावश्यक रूप से नहीं सुलझाता।
- source_word: בִּירוּשָׁלִָם
  choice: यरूशलेम में
  rationale: यह स्थानवाचक उपसर्ग का सीधा और स्वाभाविक हिन्दी अनुवाद है।
theological_decisions:
- issue: परमेश्वर के लोगों के लिए עֲבָדָיו का अनुवाद
  choice: उसके सेवक
  alternative: उसके दास
  rationale: यहाँ नहेमायाह परमेश्वर के प्रति अपनी और अपने साथियों की निष्ठा तथा अधिकृत सेवा को विरोधियों की स्थिति के विपरीत रखता है; ‘सेवक’ इस आशय को बिना सामाजिक दासता को प्रमुख बनाए व्यक्त करता है।
- issue: बहिष्करण सूत्र में צְדָקָה का अर्थ
  choice: अधिकार
  alternative: दावा; धार्मिकता
  rationale: विरोधियों को यरूशलेम में वैध स्थिति से वंचित बताया गया है। ‘अधिकार’ इस प्रसंग के न्यायसंगत हक को व्यक्त करता है, जबकि ‘धार्मिकता’ यहाँ भ्रामक धार्मिक अर्थ जोड़ सकती है।
- issue: זִכָּרוֹן की कठिन संज्ञा
  choice: स्मरण
  alternative: स्मारक; यादगार अधिकार
  rationale: शब्द यरूशलेम में याद किए जाने, मान्य संबंध या ऐतिहासिक प्रतिष्ठा की ओर संकेत कर सकता है। ‘स्मरण’ मूल की संक्षिप्तता और वास्तविक अर्थगत तनाव सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘स्वर्ग का परमेश्वर ही’ मूल के बलाघात को दर्शाता है। अंतिम त्रिक—‘हिस्सा…अधिकार…स्मरण’—की कानूनी और सामुदायिक गंभीरता बनाए रखी गई है।
