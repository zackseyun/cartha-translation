base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/002/001.yaml
  text: And it happened in the month of Nisan[a], in the twentieth year of King Artaxerxes, when wine was before him, that I took up the wine and gave it to the king. Now I had not been sad in his presence.
translation:
  language: hi
  text: राजा अर्तक्षत्र के शासन के बीसवें वर्ष के नीसान महीने में, जब दाखमधु उसके सामने था, तब मैंने दाखमधु उठाकर राजा को दिया। इससे पहले मैं उसके सामने उदास[a] नहीं था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “मैं उसके सामने बुरा नहीं था।” यहाँ यह हिब्रू मुहावरा राजा की उपस्थिति में उदास या खिन्न दिखाई देने के अर्थ में है।
    reason: शाब्दिक अर्थ और प्रसंगगत मुहावरे के बीच अंतर स्पष्ट करना।
lexical_decisions:
- source_word: וַיְהִי
  choice: —
  rationale: हिब्रू का कथात्मक सूत्र यहाँ समय-सूचक वाक्य-विन्यास में स्वाभाविक रूप से समाहित किया गया है; अलग से ‘और ऐसा हुआ’ जोड़ना आधुनिक हिन्दी में अनावश्यक रूप से भारी होता।
- source_word: בְּחֹדֶשׁ נִיסָן
  choice: नीसान महीने में
  rationale: औपचारिक तिथि-विन्यास और महीने के नाम का लिप्यंतरण सुरक्षित रखा गया है।
- source_word: שְׁנַת עֶשְׂרִים לְאַרְתַּחְשַׁסְתְּא הַמֶּלֶךְ
  choice: राजा अर्तक्षत्र के शासन के बीसवें वर्ष
  rationale: राजकीय वर्ष का आशय हिन्दी में स्पष्ट किया गया है; ‘अर्तक्षत्र’ हिन्दी बाइबलीय परंपरा में प्रचलित नाम-रूप है।
- source_word: יַיִן לְפָנָיו
  choice: जब दाखमधु उसके सामने था
  rationale: क्रियारहित हिब्रू उपवाक्य को स्वाभाविक हिन्दी में दृश्य-निर्धारक उपवाक्य बनाया गया है और ‘उसके सामने’ का दरबारी संदर्भ सुरक्षित है।
- source_word: וָאֶשָּׂא אֶת־הַיַּיִן
  choice: मैंने दाखमधु उठाकर
  rationale: נשא का मूल भाव रखा गया है; स्रोत में ‘प्याला’ न होने के कारण उसे पाठ में नहीं जोड़ा गया।
- source_word: וָאֶתְּנָה לַמֶּלֶךְ
  choice: राजा को दिया
  rationale: पूर्ववर्ती कर्म ‘दाखमधु’ हिन्दी में स्वतः समझ आता है और נתן का सीधा अर्थ सुरक्षित रहता है।
- source_word: וְלֹא הָיִיתִי רַע לְפָנָיו
  choice: इससे पहले मैं उसके सामने उदास नहीं रहा था
  rationale: रַע का शाब्दिक अर्थ ‘बुरा’ है, पर राजकीय उपस्थिति के इस प्रसंग में यह उदास या खिन्न अवस्था/मुख-मुद्रा का मुहावरा है। पूर्वकालिक कथात्मक संबंध ‘इससे पहले’ से व्यक्त किया गया है, बिना स्रोत से अधिक ‘कभी नहीं’ का बल जोड़े।
