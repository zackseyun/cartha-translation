  text: וָ/אֹמַ֣ר לַ/מֶּ֔לֶךְ אִם עַל הַ/מֶּ֣לֶךְ ט֔וֹב וְ/אִם יִיטַ֥ב עַבְדְּ/ךָ֖ לְ/פָנֶ֑י/ךָ אֲשֶׁ֧ר תִּשְׁלָחֵ֣/נִי אֶל יְהוּדָ֗ה אֶל עִ֛יר קִבְר֥וֹת אֲבֹתַ֖/י וְ/אֶבְנֶֽ/נָּה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/002/005.yaml
  text: Then I said to the king[a], "If it pleases the king, and if your servant has found favor before you, that you would send me to Judah, to the city of my fathers' graves[c][b], so that I may rebuild it."
translation:
  language: hi
  text: तब मैंने राजा से कहा, “यदि राजा को अच्छा लगे और यदि आपका सेवक आपकी दृष्टि में अनुग्रह का पात्र हो, तो आप मुझे यहूदा में उस नगर में भेज दें जहाँ मेरे पूर्वजों की कब्रें हैं,[a] ताकि मैं उसका फिर से निर्माण करूँ।”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “मेरे पूर्वजों की कब्रों के नगर की ओर।”
    reason: lexical_alternative
  - marker: b
    text: मूल इब्रानी क्रिया का अर्थ “बनाना” है; “फिर से निर्माण करूँ” से संदर्भ स्पष्ट होता है कि नगर उजड़ा हुआ था।
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֹמַר
  choice: तब मैंने ... कहा
  rationale: वाव-क्रमागत कथा को आगे बढ़ाता है; ‘तब’ हिन्दी में घटनाक्रम को स्वाभाविक रूप से व्यक्त करता है।
- source_word: אִם עַל־הַמֶּלֶךְ טוֹב
  choice: यदि राजा को अच्छा लगे
  rationale: यह राजकीय स्वीकृति या प्रसन्नता व्यक्त करने वाला विनम्र दरबारी मुहावरा है।
- source_word: וְאִם יִיטַב עַבְדְּךָ לְפָנֶיךָ
  choice: और यदि आपका सेवक आपकी दृष्टि में कृपा पाए
  rationale: यह वाक्यांश राजा के सामने अनुकूल स्वीकृति पाने का भाव रखता है और मूल की विनम्रता बनाए रखता है।
- source_word: עַבְדְּךָ
  choice: आपका सेवक
  rationale: राजा को संबोधित करते समय यह विनम्र आत्म-निर्देश है; ‘सेवक’ आधुनिक हिन्दी में उपयुक्त दरबारी भाव देता है।
- source_word: תִּשְׁלָחֵנִי
  choice: आप मुझे ... भेजें
  rationale: प्रार्थना के विनम्र आशय को हिन्दी के संभावनार्थक/आदरार्थक अनुरोध में व्यक्त किया गया है।
- source_word: יְהוּדָה
  choice: यहूदा
  rationale: स्थान-नाम का प्रचलित हिन्दी रूप।
- source_word: אֶל־עִיר קִבְרוֹת אֲבֹתַי
  choice: उस नगर ... जहाँ मेरे पूर्वजों की कब्रें हैं
  rationale: शाब्दिक रचना ‘मेरे पितरों की कब्रों का नगर’ है; ‘जहाँ मेरे पूर्वजों की कब्रें हैं’ आधुनिक हिन्दी में स्पष्ट है और אֲבֹתַי के वंशगत अर्थ को व्यक्त करता है।
- source_word: וְאֶבְנֶנָּה
  choice: ताकि मैं उसे फिर से बनाऊँ
  rationale: कोहोर्टेटिव उद्देश्य का भाव देता है। मूल क्रिया ‘बनाना’ है, जबकि ‘फिर से’ उजड़े नगर के संदर्भ को स्पष्ट करता है।
