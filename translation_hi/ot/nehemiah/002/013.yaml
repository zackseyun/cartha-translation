base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/002/013.yaml
  text: So I went out by night through the Valley Gate[a], toward the Dragon Spring and toward the Dung Gate[b], and I inspected the walls of Jerusalem that had been broken down and its gates that had been consumed by fire.
translation:
  language: hi
  text: मैं रात को घाटी के फाटक से बाहर निकला और अजगर के सोते[a] तथा कूड़े के फाटक की ओर गया। मैं यरूशलेम की उन दीवारों का निरीक्षण कर रहा था[b] जो टूटी पड़ी थीं, और उसके फाटक आग से भस्म हो चुके थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “सर्प का सोता” अथवा “सियार का सोता”; इब्रानी तन्नीन ऐसे प्राणी के लिए प्रयुक्त होता है जिसका अर्थ अजगर, सर्प या इसी प्रकार का जीव हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: यहाँ “निरीक्षण कर रहा था” के लिए इब्रानी अभिव्यक्ति कठिन है; उसका क्रियामूल सामान्यतः “तोड़ना” होता है, पर इस प्रसंग में इसका अर्थ संभवतः क्षतिग्रस्त दीवारों को ध्यान से जाँचना है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֵצְאָה
  choice: इसलिए मैं ... बाहर निकला
  rationale: प्रथम पुरुष एकवचन कथात्मक क्रिया; आरंभिक वाव पिछले संदर्भ से परिणाम अथवा क्रम जोड़ता है, जिसे हिन्दी में ‘इसलिए’ स्वाभाविक रूप से व्यक्त करता है।
- source_word: בְשַׁעַר הַגַּיְא
  choice: तराई के फाटक से
  rationale: गति के प्रसंग में בְּ द्वार से होकर निकलने का भाव देता है; גַּיְא घाटी अथवा तराई है। ‘तराई का फाटक’ स्थाननाम को स्पष्ट और सुबोध रखता है।
- source_word: לַיְלָה
  choice: रात को
  rationale: यह समयसूचक क्रियाविशेषण है; आधुनिक हिन्दी में ‘रात को’ सहज है।
- source_word: וְאֶל פְּנֵי עֵין הַתַּנִּין
  choice: अजगर के सोते की ओर
  rationale: עֵין यहाँ जल-स्रोत अथवा सोता है। תַּנִּין का अर्थ-क्षेत्र अजगर, सर्प या विशाल पौराणिक जंतु तक जाता है; मुख्य पाठ में ‘अजगर’ मूल की जंतु-संज्ञा को बनाए रखता है और विकल्प पादटिप्पणी में दिए गए हैं। אֶל־פְּנֵי मार्ग-वर्णन में दिशा का भाव देता है।
- source_word: שַׁעַר הָאַשְׁפֹּת
  choice: कूड़ा फाटक
  rationale: אַשְׁפֹּת कूड़े, मैल अथवा गोबर के ढेरों को सूचित करता है। ‘कूड़ा फाटक’ आधुनिक पाठक के लिए स्पष्ट स्थाननाम है।
- source_word: וָאֱהִי שֹׂבֵר
  choice: मैं ... निरीक्षण कर रहा था
  rationale: 'यह कठिन प्रयोग है: שבר सामान्यतः ‘तोड़ना’ है, पर इस संदर्भ में नहेमायाह दीवारों को नहीं तोड़ रहा, बल्कि रात में उनकी क्षति जाँच रहा है। היה के साथ कृदंत की जारी क्रिया को ‘निरीक्षण कर रहा था’ व्यक्त करता है; कठिनाई पादटिप्पणी में सुरक्षित है।'
- source_word: בְחוֹמֹת יְרוּשָׁלַםִ
  choice: यरूशलेम की ... शहरपनाहों का
  rationale: नगर की रक्षात्मक दीवारों के लिए ‘शहरपनाह’ सटीक और हिन्दी बाइबलीय गद्य में समझ में आने वाला शब्द है; प्रसंगगत कर्म-संबंध हिन्दी में ‘का निरीक्षण’ से व्यक्त हुआ है।
- source_word: אֲשֶׁר הַמְפֹרָצִים
  choice: जो टूटी पड़ी थीं
  rationale: פרץ का निष्क्रिय रूप दीवारों में दरार या breach किए जाने को दर्शाता है। ‘टूटी पड़ी थीं’ क्षतिग्रस्त अवस्था और पूर्व घटना के परिणाम दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וּשְׁעָרֶיהָ אֻכְּלוּ בָאֵשׁ
  choice: और उसके फाटक आग से भस्म हो चुके थे
  rationale: आग के साथ אכל का निष्क्रिय प्रयोग शाब्दिक रूप से ‘खा लिए गए’ और भावतः पूर्णतः जला दिए गए होने को दर्शाता है। ‘भस्म हो चुके थे’ परिणाम की पूर्णता और रूपक की तीव्रता रखता है।
