base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/011/005.yaml
  text: and Maaseiah son of Baruch[a], son of Col-hozeh, son of Hazaiah, son of Adaiah, son of Joiarib, son of Zechariah, son of the Shilonite.
translation:
  language: hi
  text: और मासेयाह, बारूक का पुत्र, कोल-होजे का पुत्र, हजायाह का पुत्र, अदायाह का पुत्र, योयारीब का पुत्र, जकर्याह का पुत्र, उस शीलोनी[a] का पुत्र।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “शेलोनी।” यह इब्रानी संबोधन शीलो नामक स्थान से संबंध या वंशावली परंपरा में शेला/शीलोन के कुल से संबंध का संकेत दे सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/מַעֲשֵׂיָה
  choice: और मासेयाह
  rationale: आरंभिक ו को सूची की निरंतरता दिखाने के लिए ‘और’ से व्यक्त किया गया है; व्यक्ति के नाम का लिप्यंतरण किया गया है।
- source_word: בֶן
  choice: पुत्र / पोता / परपोता / के वंश में
  rationale: स्रोत की वंशावली-श्रृंखला को स्वाभाविक आधुनिक हिन्दी में व्यक्त किया गया है। पहले तीन संबंध स्पष्ट हिन्दी पारिवारिक पदों से और लंबी शेष श्रृंखला ‘के वंश में’ से दी गई है; इससे किसी मध्यवर्ती नाम को हटाए बिना बार-बार ‘का पुत्र’ कहने की अस्वाभाविकता घटती है।
- source_word: בָּרוּךְ
  choice: बारूक
  rationale: इब्रानी व्यक्ति-नाम का हिन्दी ध्वन्यात्मक लिप्यंतरण।
- source_word: כָּל חֹזֶה
  choice: कोल-होजे
  rationale: इसे अर्थानुवाद के बजाय संयुक्त व्यक्ति-नाम माना गया है और इब्रानी उच्चारण के निकट लिप्यंतरित किया गया है।
- source_word: חֲזָיָה
  choice: हजायाह
  rationale: व्यक्ति-नाम का इब्रानी ध्वनि के निकट हिन्दी लिप्यंतरण।
- source_word: עֲדָיָה
  choice: अदायाह
  rationale: व्यक्ति-नाम का हिन्दी लिप्यंतरण।
- source_word: יוֹיָרִיב
  choice: योयारीब
  rationale: पाठ में उपस्थित संक्षिप्त इब्रानी रूप का लिप्यंतरण किया गया है; विस्तृत ईश-तत्त्वयुक्त रूप नहीं जोड़ा गया।
- source_word: זְכַרְיָה
  choice: जकर्याह
  rationale: व्यक्ति-नाम का इब्रानी उच्चारण के निकट, आधुनिक हिन्दी में सुबोध लिप्यंतरण।
- source_word: הַ/שִּׁלֹנִי
  choice: शीलोनी
  rationale: निस्बत-सूचक रूप को समुदाय अथवा स्थान से संबंध बताने वाले नाम के रूप में लिप्यंतरित किया गया है; इसकी वास्तविक वंशीय या स्थानिक संबद्धता को मुख्य पाठ में निश्चित नहीं किया गया।
theological_decisions:
- issue: הַשִּׁלֹנִי की संबद्धता
  choice: शीलोनी
  alternative: शेला के कुल का / शीलो का निवासी
  rationale: इब्रानी रूप स्थान शीलो अथवा वंशावली परंपरा में शेला/शीलोन के कुल से संबंध सूचित कर सकता है। तटस्थ लिप्यंतरण मूल अस्पष्टता बनाए रखता है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी। लंबी वंशावली को ‘पुत्र, पोता, परपोता ... के वंश में’ के रूप में रखा गया है, जिससे सभी नाम और उनका क्रम सुरक्षित रहते हुए हिन्दी वाक्य स्वाभाविक बनता है।
