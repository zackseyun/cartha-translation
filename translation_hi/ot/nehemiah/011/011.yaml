  text: שְׂרָיָ֨ה בֶן חִלְקִיָּ֜ה בֶּן מְשֻׁלָּ֣ם בֶּן צָד֗וֹק בֶּן מְרָיוֹת֙ בֶּן אֲחִיט֔וּב נְגִ֖ד בֵּ֥ית הָ/אֱלֹהִֽים־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/011/011.yaml
  text: Seraiah son of Hilkiah[a], son of Meshullam, son of Zadok, son of Meraioth, son of Ahitub[b], leader of the house of God.
translation:
  language: hi
  text: सरायाह, हिल्कियाह का पुत्र, मशुल्लाम का पुत्र, सादोक का पुत्र, मरायोत का पुत्र, अहीतूब का पुत्र, परमेश्वर के भवन का प्रधान[a] था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात मंदिर का प्रधान या प्रभारी।
    reason: lexical_alternative_and_cultural_note
lexical_decisions:
- source_word: שְׂרָיָה
  choice: सरायाह
  rationale: व्यक्तिवाचक नाम को उसके इब्रानी रूप के निकट देवनागरी में लिप्यंतरित किया गया है।
- source_word: בֶן
  choice: का पुत्र
  rationale: बार-बार आने वाली वंशावली-सूचक रचना का सीधा और स्वाभाविक अर्थ ‘का पुत्र’ है; यद्यपि वंशावलियों में कभी-कभी इसका आशय अधिक दूर का वंशज भी हो सकता है।
- source_word: נְגִיד
  choice: प्रधान
  rationale: यह शब्द किसी नियुक्त अगुए या प्रभारी को सूचित करता है। याजकीय-प्रशासनिक संदर्भ में ‘प्रधान’ स्वाभाविक है और राजकीय अर्थ को अनावश्यक रूप से प्रबल नहीं करता।
- source_word: בֵּית הָאֱלֹהִים
  choice: परमेश्वर का भवन
  rationale: मूल अभिव्यक्ति का अर्थ शाब्दिक रूप से ‘परमेश्वर का भवन’ है। यहाँ इसका संदर्भ मंदिर से है, पर मुख्य पाठ में मूल रूपक सुरक्षित रखा गया है।
- source_word: הָאֱלֹהִים
  choice: परमेश्वर
  rationale: इस प्रसंग में यह इस्राएल के परमेश्वर को सूचित करता है; इसलिए एकवचन आदरसूचक नाम उपयुक्त है।
