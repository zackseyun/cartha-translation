  register: आधुनिक मानक हिन्दी में गरिमापूर्ण और सहज वंशावली-शैली रखी गई है। ‘परमेश्वर का भवन’ मूल इब्रानी अभिव्यक्ति को बनाए रखता है, जबकि पादटिप्पणी उसके मंदिर-संदर्भ और נְגִיד के अर्थ-क्षेत्र को स्पष्ट करती है।
