- source_word: וּ/בְ/צִֽקְלַ֥ג
  choice: और सिकलग में
  rationale: संयोजक וּ और संबंधसूचक בְ को स्वाभाविक हिन्दी में ‘और ... में’ किया गया है। צִקְלַג स्थान-नाम है, इसलिए उसका लिप्यंतरण ‘सिकलग’ किया गया है।
- source_word: וּ/בִ/מְכֹנָ֖ה
  choice: और मकोना
  rationale: מְכֹנָה स्थान-नाम है, इसलिए ‘मकोना’ लिप्यंतरित किया गया है। इसके पहले का ‘में’ अगले संयुक्त पद ‘मकोना तथा उसकी अधीन बस्तियों’ पर समान रूप से लागू होता है।
- source_word: וּ/בִ/בְנֹתֶֽי/הָ
  choice: तथा उसकी अधीन बस्तियों में
  rationale: בְּנוֹתֶיהָ का शाब्दिक अर्थ ‘उसकी बेटियाँ’ है, पर नगरों के संदर्भ में यह मुख्य बस्ती से जुड़ी छोटी या आश्रित बस्तियों के लिए प्रचलित इब्रानी मुहावरा है। ‘अधीन बस्तियाँ’ अर्थ को सामान्य आधुनिक हिन्दी में स्पष्ट करता है; स्त्रीलिंग एकवचन प्रत्यय का संबंध मकोना से है।
