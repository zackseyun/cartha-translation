base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/011/001.yaml
  text: The officials of the people lived in Jerusalem[a], and the rest of the people cast lots to bring one out of ten to live in Jerusalem, the holy city, while nine parts remained in the towns.
translation:
  language: hi
  text: जनता के अधिकारी यरूशलेम में रहते थे, और बाकी लोगों ने चिट्ठियाँ डालीं कि हर दस में से एक को पवित्र नगर यरूशलेम में बसने के लिए लाया जाए, और शेष नौ भाग[a] दूसरे नगरों में रहें।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से, “और नौ हाथ नगरों में”; यह मुहावरा दस में से शेष नौ भागों के दूसरे नगरों में रहने को दर्शाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׂרֵי הָעָם
  choice: लोगों के अधिकारी
  rationale: שָׂרִים प्रशासनिक पदधारियों या अगुओं को दर्शाता है; इस संदर्भ में ‘अधिकारी’ स्वाभाविक है और ‘राजकुमार’ की अनावश्यक राजवंशीय छाया से बचता है।
- source_word: וַיֵּשְׁבוּ / לָשֶׁבֶת
  choice: रहते थे / रहने के लिए
  rationale: ישׁב यहाँ बैठने के बजाय निवास करने के अर्थ में है; आधुनिक हिन्दी में ‘रहना’ स्पष्ट और सहज है।
- source_word: הִפִּילוּ גוֹרָלוֹת
  choice: चिट्ठियाँ डालीं
  rationale: यह चयन के लिए चिट्ठी डालने की प्रचलित प्रक्रिया को दर्शाने वाला स्वाभाविक हिन्दी मुहावरा है।
- source_word: לְהָבִיא
  choice: लाया जाए
  rationale: בוא के हिफ़ील रूप में किसी को आने के लिए लाने या ले आने का कारक भाव है; कर्मवाच्य हिन्दी वाक्य में चयनित व्यक्ति पर बल बनाए रखता है।
- source_word: אֶחָד מִן הָעֲשָׂרָה
  choice: हर दस में से एक
  rationale: यह अनुपात और वितरण दोनों को सामान्य पाठक के लिए स्पष्ट करता है।
- source_word: עִיר הַקֹּדֶשׁ
  choice: पवित्र नगर
  rationale: यह इब्रानी संबंध-पदबंध का सीधा, प्रतिष्ठित और स्वाभाविक हिन्दी रूप है।
- source_word: וְתֵשַׁע הַיָּדוֹת
  choice: और शेष नौ भाग
  rationale: शाब्दिक ‘नौ हाथ’ यहाँ दस में से बचे नौ हिस्सों का मुहावरा है; ‘नौ भाग’ मूल रूपक के निकट रहते हुए अर्थ स्पष्ट करता है।
- source_word: בֶּעָרִים
  choice: दूसरे नगरों में
  rationale: עָרִים अन्य आबाद स्थानों को दर्शाता है; ‘दूसरे’ यरूशलेम से उनका निहित विरोध स्पष्ट करता है, जबकि ‘नगर’ आधुनिक हिन्दी में व्यापक और गरिमापूर्ण है।
