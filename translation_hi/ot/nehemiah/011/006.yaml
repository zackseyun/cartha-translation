  text: All the sons of Perez who lived in Jerusalem were four hundred sixty-eight valiant men[a].
translation:
  language: hi
  text: यरूशलेम में रहने वाले पेरेस के सभी वंशज कुल चार सौ अड़सठ वीर पुरुष[a] थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “पराक्रमी पुरुष।” इब्रानी पद ऐसे पुरुषों को सूचित कर सकता है जो शक्ति, सामर्थ्य या वीरता के लिए प्रतिष्ठित हों।
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל בְּנֵי פֶרֶץ
  choice: पेरेस के सभी वंशज
  rationale: בְּנֵי का शाब्दिक अर्थ ‘पुत्र’ है, पर वंशावली-सूची में यह व्यापक रूप से वंशजों को सूचित करता है; आधुनिक हिन्दी में ‘वंशज’ आशय को स्वाभाविक और स्पष्ट रूप से व्यक्त करता है।
- source_word: הַיֹּשְׁבִים בִּירוּשָׁלִָם
  choice: यरूशलेम में रहने वाले
  rationale: ישׁב का कृदन्त यहाँ किसी स्थान में निवास करने का अर्थ देता है; ‘रहने वाले’ आधुनिक हिन्दी में सहज है।
- source_word: אַרְבַּע מֵאוֹת שִׁשִּׁים וּשְׁמֹנָה
  choice: चार सौ अड़सठ
  rationale: इब्रानी संख्या को मुख्य पाठ में शब्दों द्वारा मानक हिन्दी रूप में व्यक्त किया गया है।
- source_word: אַנְשֵׁי חָיִל
  choice: वीर पुरुष
  rationale: यह पद शक्ति, योग्यता या पराक्रम से विशिष्ट पुरुषों को सूचित कर सकता है। ‘वीर पुरुष’ प्रशंसात्मक और पुरुषवाचक भाव बनाए रखता है, जबकि टिप्पणी में अर्थ-सीमा स्पष्ट की गई है।
