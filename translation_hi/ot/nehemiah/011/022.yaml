translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण और सामान्य पाठक के लिए सुबोध शैली अपनाई गई है। लंबी इब्रानी वंशावली को छोटे वाक्यों और प्रचलित रिश्तों द्वारा प्रस्तुत किया गया है, पर नामों का क्रम सुरक्षित रखा गया है। לְנֶגֶד की प्रशासनिक अर्थच्छाया को मुख्य पाठ में स्पष्ट किया गया है, इसलिए अलग पादटिप्पणी आवश्यक नहीं समझी गई।
