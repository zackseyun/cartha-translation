base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/011/022.yaml
  text: And the overseer of the Levites in Jerusalem was Uzzi son of Bani[a], son of Hashabiah, son of Mattaniah, son of Mica, from the sons of Asaph, the singers, over the work of the house of God.
translation:
  language: hi
  text: यरूशलेम में लेवियों का निरीक्षक उज्जी था, जो बानी का पुत्र, हशब्याह का पुत्र, मत्तन्याह का पुत्र और मीका का पुत्र था। वह आसाप के पुत्रों में से था, जो गायक थे, और परमेश्वर के भवन के काम की देखरेख का उत्तरदायी[a] था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “परमेश्वर के भवन के काम के संबंध में नियुक्त था।” इब्रानी पदबंध कार्य के संबंध में उत्तरदायित्व या नियुक्ति का भाव भी व्यक्त कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וּפְקִיד הַלְוִיִּם
  choice: लेवियों का निरीक्षक
  rationale: पְקִיד नियुक्त प्रशासनिक या देखरेख करनेवाले अधिकारी को दर्शाता है; ‘निरीक्षक’ आधुनिक हिन्दी में इस भूमिका को स्पष्ट रूप से व्यक्त करता है। संबंधवाचक रचना הַלְוִיִּם को ‘लेवियों का’ रखा गया है।
- source_word: בִּירוּשָׁלִַם
  choice: यरूशलेम में
  rationale: בְּ का सीधा स्थानवाचक अर्थ है।
- source_word: עֻזִּי בֶן בָּנִי בֶּן חֲשַׁבְיָה בֶּן מַתַּנְיָה בֶּן מִיכָא
  choice: उज्जी ... बानी का पुत्र, हशब्याह का पोता, मत्तन्याह का परपोता और मीका का वंशज
  rationale: वंशावली को स्वाभाविक आधुनिक हिन्दी में स्पष्ट किया गया है। अंतिम कड़ी में ‘वंशज’ रखने से पीढ़ियों की गणना को अनावश्यक रूप से कठोर नहीं बनाया जाता, जबकि सभी नाम और उनका क्रम सुरक्षित रहते हैं।
- source_word: מִבְּנֵי אָסָף
  choice: आसाप के वंशजों में से
  rationale: शाब्दिक ‘आसाप के पुत्रों में से’ यहाँ कुल अथवा वंश का बोध देता है; ‘वंशजों में से’ आधुनिक हिन्दी में अधिक स्वाभाविक और सटीक है।
- source_word: הַמְשֹׁרְרִים
  choice: गायकों में से
  rationale: यह कृदंत मंदिर में गायन की भूमिका निभानेवाले लोगों की पहचान करता है; ‘गायक’ ‘संगीतकार’ से अधिक सटीक है।
- source_word: לְנֶגֶד מְלֶאכֶת
  choice: काम की देखरेख करता था
  rationale: इस प्रशासनिक संदर्भ में לְנֶגֶד कार्य के संबंध में उत्तरदायित्व अथवा निगरानी व्यक्त करता है। हिन्दी में ‘देखरेख करता था’ इस आशय को स्पष्ट और स्वाभाविक रूप से देता है।
- source_word: בֵּית הָאֱלֹהִים
  choice: परमेश्वर का भवन
  rationale: मूल अभिव्यक्ति ‘परमेश्वर का घर/भवन’ है और मंदिर को सूचित करती है। ‘भवन’ गरिमापूर्ण तथा हिन्दी बाइबलीय संदर्भ में सहज है।
