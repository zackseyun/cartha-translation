base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/011/015.yaml
  text: 'And from the Levites: Shemaiah son of Hasshub[a], son of Azrikam, son of Hashabiah, son of Bunni.'
translation:
  language: hi
  text: 'और लेवियों में से: शमायाह, हश्शूब का पुत्र,[a] अज़रीकाम का पुत्र, हशब्याह का पुत्र, बुन्नी का पुत्र।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: वंशावलियों में इब्रानी शब्द בֵּן (‘पुत्र’) कभी-कभी सीधे पुत्र के बजाय बाद की पीढ़ी के किसी वंशज को भी दर्शा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִן
  choice: और ... में से
  rationale: उपसर्ग וּ पिछले विवरण से संबंध जोड़ता है, जबकि מִן समूह में से किसी व्यक्ति को प्रस्तुत करता है; हिंदी में संयुक्त रूप स्वाभाविक है।
- source_word: הַלְוִיִּם
  choice: लेवियों
  rationale: यह लेवी गोत्र के सदस्यों के मान्य समूह को दर्शाता है; ‘लेवी’ का बहुवचन संबंधकारक रूप सहज और प्रचलित है।
- source_word: שְׁמַעְיָה
  choice: शमायाह
  rationale: इब्रानी नाम का हिंदी ध्वन्यंतरण।
- source_word: בֶן
  choice: का पुत्र
  rationale: वंशावली में सामान्य औपचारिक अर्थ रखा गया है; यह कभी-कभी निकट पुत्र के बजाय दूर के वंशज को भी सूचित कर सकता है, इसलिए टिप्पणी दी गई है।
- source_word: חַשּׁוּב
  choice: हश्शूब
  rationale: इब्रानी व्यंजन के दृढ़ उच्चारण को ‘श्श’ से दर्शाते हुए नाम का ध्वन्यंतरण।
- source_word: עַזְרִיקָם
  choice: अज़रीकाम
  rationale: इब्रानी नाम का हिंदी ध्वन्यंतरण।
- source_word: חֲשַׁבְיָה
  choice: हशब्याह
  rationale: इब्रानी नाम का हिंदी ध्वन्यंतरण, जिसमें नाम के अंतिम ईश्वरीय घटक को ‘याह’ रूप में रखा गया है।
- source_word: בּוּנִּי
  choice: बुन्नी
  rationale: इब्रानी नाम में दृढ़ न व्यंजन को दोहरे ‘न्न’ से दर्शाया गया है।
