source:
  edition: WLC
  text: וְ/אֵ֨לֶּה֙ רָאשֵׁ֣י הַ/מְּדִינָ֔ה אֲשֶׁ֥ר יָשְׁב֖וּ בִּ/ירוּשָׁלִָ֑ם וּ/בְ/עָרֵ֣י יְהוּדָ֗ה יָֽשְׁב֞וּ אִ֤ישׁ בַּ/אֲחֻזָּת/וֹ֙ בְּ/עָ֣רֵי/הֶ֔ם יִשְׂרָאֵ֤ל הַ/כֹּהֲנִים֙ וְ/הַ/לְוִיִּ֣ם וְ/הַ/נְּתִינִ֔ים וּ/בְנֵ֖י עַבְדֵ֥י שְׁלֹמֹֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/011/003.yaml
  text: 'These are the heads of the province who lived in Jerusalem[a]. But in the cities of Judah, each man lived in his own possession in their cities: Israel, the priests, the Levites, the temple servants[b], and the descendants of Solomon’s servants.'
translation:
  language: hi
  text: यरूशलेम में रहने वाले प्रदेश के प्रधान ये थे। पर यहूदा के नगरों में हर एक अपने-अपने नगरों में अपनी भूमि पर रहता था—इस्राएली,[a] याजक, लेवी, मन्दिर के सेवक,[b] और सुलैमान के सेवकों के वंशज।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: मूल इब्रानी में केवल “इस्राएल” है; सूची में यह सम्भवतः सामूहिक रूप से इस्राएलियों को सूचित करता है।
    reason: lexical_alternative
  - marker: b
    text: 'इब्रानी: “नतीनीम”; यह मन्दिर की सेवा के लिए नियुक्त एक वर्ग था।'
    reason: lexical_alternative
lexical_decisions:
- source_word: רָאשֵׁי הַמְּדִינָה
  choice: प्रदेश के प्रधान
  rationale: फ़ारसी काल की प्रशासनिक इकाई के लिए 'प्रदेश' उपयुक्त है; רָאשֵׁי का पदसूचक अर्थ 'प्रधान' स्वाभाविक और गरिमापूर्ण ढंग से व्यक्त करता है।
- source_word: אֲשֶׁר יָשְׁבוּ בִּירוּשָׁלִָם
  choice: जो यरूशलेम में रहते थे
  rationale: יָשַׁב यहाँ स्थायी निवास का सामान्य अर्थ रखता है; 'रहते थे' आधुनिक हिन्दी में सहज है।
- source_word: וּבְעָרֵי יְהוּדָה יָשְׁבוּ
  choice: पर यहूदा के नगरों में ... रहता था
  rationale: वाव यरूशलेम से यहूदा के अन्य नगरों की ओर विरोधात्मक स्थानांतरण दिखाता है, जिसे 'पर' स्पष्ट करता है।
- source_word: אִישׁ בַּאֲחֻזָּתוֹ בְּעָרֵיהֶם
  choice: हर एक अपने-अपने नगर में अपनी भूमि पर
  rationale: אִישׁ का वितरणात्मक अर्थ 'हर एक' से आता है। אֲחֻזָּה पैतृक अथवा अधिकार में प्राप्त भू-संपत्ति है; 'अपनी भूमि' हिन्दी में ठोस और स्वाभाविक है। बहुवचन 'उनके नगरों' की अपेक्षा वितरणात्मक 'अपने-अपने नगर' आशय को अधिक स्पष्ट करता है।
- source_word: יִשְׂרָאֵל
  choice: इस्राएल के लोग
  rationale: सूची में अकेला יִשְׂרָאֵל सामूहिक रूप से सामान्य इस्राएली समुदाय को सूचित करता है। हिन्दी में केवल 'इस्राएल' स्थान या राष्ट्रनाम समझा जा सकता है, इसलिए 'के लोग' लगाया गया है; मूल का संक्षिप्त रूप पादटिप्पणी में सुरक्षित है।
- source_word: הַכֹּהֲנִים
  choice: याजक
  rationale: यह כֹּהֲנִים का मानक और परिचित हिन्दी बाइबलीय अनुवाद है।
- source_word: הַלְוִיִּם
  choice: लेवी
  rationale: यह लेवी गोत्र से जुड़े विशिष्ट सेवक-वर्ग का परिचित सामुदायिक नाम है।
- source_word: הַנְּתִינִים
  choice: मन्दिर के सेवक
  rationale: नतीनीम नामक संस्थागत वर्ग का कार्यात्मक अनुवाद आधुनिक पाठक को उसका अर्थ तुरंत बताता है; मूल पद पादटिप्पणी में दिया गया है।
- source_word: בְּנֵי עַבְדֵי שְׁלֹמֹה
  choice: सुलैमान के सेवकों के वंशज
  rationale: वंश-सामुदायिक सूची में בְּנֵי का अर्थ केवल प्रत्यक्ष पुत्र नहीं, व्यापक वंशज है।
theological_decisions:
- issue: יִשְׂרָאֵל का सूची में व्याकरणिक कार्य
  choice: इस्राएल के लोग
  alternative: इस्राएल
  rationale: यहाँ पद संभवतः एक सामूहिक वर्ग का नाम है। मुख्य पाठ में अर्थ स्पष्ट किया गया है, जबकि मूल की वास्तविक संक्षिप्तता पादटिप्पणी में बताई गई है; इससे किसी विशिष्ट धर्मवैज्ञानिक पहचान को अनावश्यक रूप से आरोपित नहीं किया जाता।
translation_notes:
  register: आधुनिक मानक हिन्दी में स्वाभाविक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट शैली अपनाई गई है। वाक्य की सूचीबद्ध संरचना तथा यरूशलेम और यहूदा के नगरों के बीच मूल का अंतर बनाए रखा गया है।
