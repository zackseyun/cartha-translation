  text: and in Hazar-shual[a], and in Beer-sheba and its villages.
translation:
  language: hi
  text: और हसर-शूआल में, तथा बेर्शेबा और उसके गाँवों में।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/בַ/חֲצַר שׁוּעָל
  choice: और हसर-शूआल में
  rationale: संयोजक और स्थानवाचक उपसर्गों को स्वाभाविक हिन्दी में व्यक्त किया गया है। स्थान-नाम का अर्थानुवाद ('लोमड़ी का गाँव') करने के बजाय उसका लिप्यंतरण किया गया है।
- source_word: וּ/בִ/בְאֵר שֶׁבַע
  choice: तथा बेर्शेबा
  rationale: यह सुप्रसिद्ध स्थान-नाम है, इसलिए संभावित व्युत्पत्तिगत अर्थों ('सात का कुआँ' या 'शपथ का कुआँ') के बजाय हिन्दी में प्रचलित लिप्यंतरण रखा गया है। पद के समानांतर विन्यास में 'तथा' सहज है और अंतिम 'में' दोनों स्थानों पर लागू होता है।
- source_word: וּ/בְנֹתֶיהָ
  choice: और उसके अधीन गाँवों
  rationale: शाब्दिक अर्थ 'और उसकी बेटियाँ' है, पर नगर के संदर्भ में यह उसके आश्रित गाँवों या बस्तियों के लिए प्रयुक्त भौगोलिक मुहावरा है। 'अधीन गाँवों' से आश्रित संबंध भी स्पष्ट रहता है।
