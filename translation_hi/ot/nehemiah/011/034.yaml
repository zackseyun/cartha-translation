  register: आधुनिक मानक हिन्दी में संक्षिप्त स्थान-सूची के रूप को बनाए रखा गया है। नामों का अनुवाद नहीं, लिप्यंतरण किया गया है। उपलब्ध अंग्रेज़ी परामर्श-पाठ में पाद-टिप्पणी चिह्न अपने संबंधित नामों से मेल नहीं खाते; चूँकि वे केवल अंग्रेज़ी लिप्यंतरण की भिन्नताओं से संबंधित हैं और हिन्दी पाठ के लिए आवश्यक नहीं हैं, इसलिए हिन्दी मसौदे में उन्हें शामिल नहीं किया गया।
