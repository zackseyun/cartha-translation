  text: וְ/אֵ֖לֶּה בְּנֵ֣י בִנְיָמִ֑ן סַלֻּ֡א בֶּן מְשֻׁלָּ֡ם בֶּן יוֹעֵ֡ד בֶּן פְּדָיָה֩ בֶן ק֨וֹלָיָ֧ה בֶן מַעֲשֵׂיָ֛ה בֶּן אִֽיתִיאֵ֖ל בֶּן יְשַֽׁעְיָֽה־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/011/007.yaml
  text: 'And these were the sons of Benjamin: Sallu son of Meshullam[a], son of Joed, son of Pedaiah, son of Kolaiah, son of Maaseiah, son of Ithiel[b], son of Jeshaiah.'
translation:
  language: hi
  text: 'बिन्यामीन के वंशज[a] ये थे: सल्लू, मशुल्लाम का पुत्र, योएद[b] का पुत्र, पदायाह का पुत्र, कोलायाह का पुत्र, मासेयाह का पुत्र, ईतीएल का पुत्र, यशायाह का पुत्र।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “बिन्यामीन के पुत्र”; यहाँ इसका अर्थ बिन्यामीन के वंशज या बिन्यामीनी लोग भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: यहाँ मसोरेटिक पाठ में “योएद” है; 1 इतिहास 9:7 की समानांतर वंशावली में इस स्थान पर “होदव्याह” मिलता है।
    reason: alternative_reading
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: ये थे
  rationale: यह पद पिछले विवरण से जुड़कर एक नई वंश-सूची प्रस्तुत करता है; हिन्दी में भूतकाल संदर्भ के अनुरूप स्वाभाविक है।
- source_word: בְּנֵי בִנְיָמִן
  choice: बिन्यामीन के वंशज
  rationale: शाब्दिक अर्थ ‘बिन्यामीन के पुत्र’ है, पर जनजातीय वंश-सूची में इसका व्यापक आशय वंशज या बिन्यामीनी लोग है; ‘वंशज’ आधुनिक हिन्दी में आशय स्पष्ट करता है।
- source_word: סַלֻּא
  choice: सल्लू
  rationale: इब्रानी नाम का निकट देवनागरी लिप्यंतरण।
- source_word: בֶּן
  choice: पुत्र / पोता / वंशज
  rationale: वंशावली की लंबी शृंखला को स्वाभाविक हिन्दी में व्यक्त करते हुए पहले प्रत्यक्ष संबंध के लिए ‘पुत्र’, अगले के लिए ‘पोता’ और शेष पूर्वजों के लिए ‘वंशज’ प्रयुक्त हुआ; मूल की वंशगत कड़ी सुरक्षित है, बिना यह दावा किए कि प्रत्येक בֶּן अनिवार्यतः तत्काल पुत्र है।
- source_word: מְשֻׁלָּם
  choice: मशुल्लाम
  rationale: इब्रानी उच्चारण के निकट प्रचलित हिन्दी लिप्यंतरण।
- source_word: יוֹעֵד
  choice: योएद
  rationale: मसोरेटिक पाठ के नामरूप का निकट लिप्यंतरण; समानांतर पाठ का भिन्न नाम पादटिप्पणी में दिया गया है।
- source_word: פְּדָיָה
  choice: पदायाह
  rationale: इब्रानी नाम का निकट देवनागरी लिप्यंतरण।
- source_word: קוֹלָיָה
  choice: कोलायाह
  rationale: इब्रानी स्वरांकन को यथासंभव सुरक्षित रखने वाला लिप्यंतरण।
- source_word: מַעֲשֵׂיָה
  choice: मासेयाह
  rationale: इब्रानी नाम का पठनीय और निकट हिन्दी लिप्यंतरण।
- source_word: אִיתִיאֵל
  choice: ईतीएल
  rationale: इब्रानी नाम के दीर्घ प्रारंभिक स्वर और घटकों को दर्शाने वाला लिप्यंतरण।
- source_word: יְשַׁעְיָה
  choice: यशायाह
  rationale: इब्रानी नाम का परिचित हिन्दी रूप; यह वही नामरूप है जिसे अन्य संदर्भों में ‘यशायाह’ कहा जाता है।
