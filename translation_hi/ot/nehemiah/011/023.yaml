- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले कथन का कारण या स्पष्टीकरण प्रस्तुत करता है; हिन्दी में ‘क्योंकि’ इस संबंध को स्पष्ट और स्वाभाविक बनाता है।
- source_word: מִצְוַת הַמֶּלֶךְ
  choice: राजा की आज्ञा
  rationale: מִצְוָה यहाँ राजा के अधिकारपूर्ण निर्देश को सूचित करता है; ‘आज्ञा’ आधुनिक, गरिमापूर्ण और स्पष्ट है।
- source_word: עֲלֵיהֶם
  choice: उनके लिए ... थी
  rationale: शाब्दिक रूप ‘उन पर’ है, पर इस प्रशासनिक संदर्भ में आज्ञा का उनसे संबंधित या उन पर लागू होना अभिप्रेत है; हिन्दी में यह रूप अधिक स्वाभाविक है।
- source_word: וַאֲמָנָה
  choice: एक निश्चित व्यवस्था
  rationale: אֲמָנָה दृढ़, स्थापित व्यवस्था, दायित्व या प्रावधान का बोध करा सकता है। ‘निश्चित व्यवस्था’ अर्थ की व्यापकता बनाए रखती है और केवल आर्थिक प्रावधान तक सीमित नहीं करती।
- source_word: עַל הַמְשֹׁרְרִים
  choice: गायकों के लिए
  rationale: संदर्भ में व्यवस्था गायकों से संबंधित है; ‘के लिए’ सहज हिन्दी है, जबकि ‘गायकों पर’ भ्रामक हो सकता है।
- source_word: דְּבַר יוֹם בְּיוֹמוֹ
  choice: हर दिन की आवश्यकता उसी दिन के अनुसार
  rationale: यह मुहावरा दिन-प्रतिदिन निर्धारित विषय, आवश्यकता या हिस्से को व्यक्त करता है। चुना हुआ रूप प्रशासनिक अर्थ को स्पष्ट रखते हुए मूल की दैनिक लय बचाता है।
