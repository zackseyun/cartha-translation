  yaml_path: translation/ot/nehemiah/011/023.yaml
  text: For the king’s command was upon them[a], and a fixed provision for the singers[b], each day’s matter on its day.
translation:
  language: hi
  text: क्योंकि उन पर राजा की आज्ञा लागू थी, और गायकों के लिए एक निर्धारित प्रावधान[a] था—हर दिन के लिए उस दिन की आवश्यकता के अनुसार[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी शब्द का अर्थ “पक्की व्यवस्था,” “स्थायी प्रावधान” या “निर्धारित दायित्व” भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: 'शाब्दिक अर्थ: “हर दिन की बात उसके दिन में”; यह प्रतिदिन की निर्धारित आवश्यकता या हिस्से को सूचित कर सकता है।'
    reason: idiom_clarification
