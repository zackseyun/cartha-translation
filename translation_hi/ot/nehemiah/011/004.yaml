base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/011/004.yaml
  text: 'And in Jerusalem there lived some of the sons of Judah and some of the sons of Benjamin[a]. Of the sons of Judah: Athaiah son of Uzziah, son of Zechariah, son of Amariah, son of Shephatiah, son of Mahalalel[b], of the sons of Perez.'
translation:
  language: hi
  text: 'और यरूशलेम में यहूदा के वंशजों में से कुछ और बिन्यामीन के वंशजों में से कुछ लोग रहते थे[a]। यहूदा के वंशजों में से: पेरेस के वंशजों में से अतायाह, उज्जिय्याह का पुत्र, जकर्याह का पुत्र, अमर्याह का पुत्र, शपत्याह का पुत्र, महललेल का पुत्र[b]।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘रहते थे’ का अनुवाद ‘निवास करते थे’ भी किया जा सकता है; इब्रानी क्रिया रहने या बसने, दोनों का भाव दे सकती है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी वंशावलियों में ‘पुत्र’ शब्द कभी-कभी व्यापक अर्थ में ‘वंशज’ के लिए भी प्रयुक्त होता है; इसलिए बीच की कुछ पीढ़ियाँ उल्लिखित न हों, यह संभव है।
    reason: cultural_note
lexical_decisions:
