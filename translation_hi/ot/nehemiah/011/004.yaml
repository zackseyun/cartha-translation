  rationale: इब्रानी नाम का स्रोत-सन्निकट देवनागरी रूप।
- source_word: מַהֲלַלְאֵל
  choice: महललेल
  rationale: इब्रानी नाम का पठनीय, प्रचलित हिन्दी रूप।
- source_word: פָרֶץ
  choice: पेरेस
  rationale: इब्रानी नाम का प्रचलित हिन्दी बाइबलीय रूप।
theological_decisions:
- issue: בני का जनजातीय अर्थ
  choice: वंशज
  alternative: पुत्र
  rationale: इस जनगणना-सदृश सूची में यहूदा और बिन्यामीन के प्रत्यक्ष पुत्र नहीं, बल्कि उनके जनजातीय वंश के सदस्य अभिप्रेत हैं; ‘वंशज’ अर्थ को बिना सांप्रदायिक व्याख्या के स्पष्ट करता है।
- issue: वंशावली में בֶּן की पुनरावृत्ति
  choice: स्वाभाविक हिन्दी में पुत्र, पोता, परपोता और वंशज
  alternative: हर स्तर पर ‘का पुत्र’
  rationale: इब्रानी वंशावली की संबंध-श्रृंखला को सुरक्षित रखते हुए हिन्दी में गलत प्रत्यक्ष पितृत्व का आभास घटाया गया है; अंतिम संबंध की संभावित वंशावली-संक्षिप्तता भी बनी रहती है।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण और सामान्य पाठकों के लिए सुबोध। जनजातीय בני के लिए ‘वंशज’ चुना गया है और नामों को हिन्दी बाइबलीय परंपरा तथा इब्रानी रूप के निकट रखा गया है।
