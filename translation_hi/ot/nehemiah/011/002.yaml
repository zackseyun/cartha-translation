base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/011/002.yaml
  text: And the people blessed all the men who willingly offered themselves to live in Jerusalem[a].
translation:
  language: hi
  text: और लोगों ने उन सभी पुरुषों को आशीर्वाद दिया जिन्होंने यरूशलेम में बसने के लिए स्वेच्छा से स्वयं को प्रस्तुत किया[क]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: क
    text: या, “जो यरूशलेम में रहने के लिए स्वयंसेवक बने।”
    reason: हिथपाएल הַמִּתְנַדְּבִים के लिए संक्षिप्त वैकल्पिक अनुवाद; अंग्रेज़ी audit trail के lexical alternative को सुरक्षित रखता है।
lexical_decisions:
- source_word: וַיְבָרֲכוּ
  choice: आशीर्वाद दिया
  rationale: पिएल रूप में ברך का सामान्य अर्थ ‘आशीर्वाद देना’ है। यहाँ मनुष्य कर्म हैं; यह उनके प्रति आशीर्वाद और अनुमोदन व्यक्त करने का भाव रखता है।
- source_word: הָעָם
  choice: लोगों
  rationale: עַם के सामूहिक अर्थ ‘लोग’ को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: לְכֹל הָאֲנָשִׁים
  choice: उन सभी पुरुषों को
  rationale: אֲנָשִׁים यहाँ स्पष्ट रूप से पुल्लिंग ‘पुरुषों’ है; इसलिए इसे सामान्यीकृत करके ‘लोगों’ नहीं किया गया।
- source_word: הַמִּתְנַדְּבִים
  choice: जिन्होंने ... स्वेच्छा से अपने आपको प्रस्तुत किया था
  rationale: נדב के हिथपाएल रूप में स्वेच्छापूर्वक स्वयं को प्रस्तुत करने का आत्मवाचक भाव है; यह केवल ‘स्वयंसेवक बने’ की तुलना में उस सूक्ष्मता को अधिक स्पष्ट रखता है।
- source_word: לָשֶׁבֶת
  choice: बसने के लिए
  rationale: संदर्भ यरूशलेम में निवास ग्रहण करने का है; ‘बसना’ आधुनिक हिन्दी में स्वाभाविक है और स्थायी निवास के प्रसंग को व्यक्त करता है।
- source_word: בִּירוּשָׁלִָם
  choice: यरूशलेम में
  rationale: स्थानवाचक उपसर्ग के साथ नगर के नाम का मानक हिन्दी रूप।
theological_decisions:
- issue: הָאֲנָשִׁים का लिंग-सटीक अनुवाद
  choice: सभी पुरुषों
  alternative: सभी लोगों / हर किसी
  rationale: इब्रानी पाठ सामान्य सामूहिक संज्ञा के बजाय पुल्लिंग אֲנָשִׁים का प्रयोग करता है; संदर्भ इसे अनिवार्य रूप से लिंग-समावेशी नहीं बनाता, इसलिए पुल्लिंग संकेत सुरक्षित रखा गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘स्वेच्छा से अपने आपको प्रस्तुत किया’ मूल के आत्मवाचक और स्वैच्छिक दोनों भावों को सुरक्षित रखता है; ‘बसने’ से निवास ग्रहण करने का संदर्भ स्पष्ट होता है।
