  rationale: स्थानवाचक नाम होने के कारण हिब्रानी उच्चारण के निकट देवनागरी लिप्यंतरण किया गया है।
- source_word: בֵית פָּלֶט
  choice: बेत-पेलेत
  rationale: इस संयुक्त स्थान-नाम को अनूदित करने के बजाय लिप्यंतरित किया गया है। योजक-चिह्न नाम के दो घटकों को स्पष्ट करता है।
