base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/011/020.yaml
  text: And the rest of Israel[a], the priests, and the Levites were in all the cities of Judah, each in his inheritance.
translation:
  language: hi
  text: और शेष इस्राएली, याजक और लेवी यहूदा के सब नगरों में रहते थे, हर एक अपनी विरासत में।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּשְׁאָר יִשְׂרָאֵל
  choice: और शेष इस्राएली
  rationale: שְׁאָר शेष बचे लोगों को दर्शाता है। यहाँ יִשְׂרָאֵל सामूहिक रूप से इस्राएली लोगों के लिए है; स्वाभाविक हिन्दी में ‘शेष इस्राएली’ पूर्ववर्ती सूची से इसका संबंध स्पष्ट करता है।
- source_word: הַכֹּהֲנִים
  choice: याजक
  rationale: यह כֹּהֲנִים के याजकीय वर्ग के लिए प्रचलित और गरिमापूर्ण हिन्दी पद है।
- source_word: הַלְוִיִּם
  choice: लेवी
  rationale: यह לְוִיִּם के लिए बाइबलीय हिन्दी में प्रचलित सामुदायिक नाम है।
- source_word: בְּכָל עָרֵי יְהוּדָה
  choice: यहूदा के सब नगरों में
  rationale: בְּ का स्थानीय अर्थ और כָּל की व्यापकता सीधे रूप में सुरक्षित रखी गई है।
- source_word: אִישׁ
  choice: हर एक
  rationale: एकवचन אִישׁ यहाँ वितरणात्मक है। ‘हर एक’ आधुनिक हिन्दी में स्वाभाविक ढंग से प्रत्येक व्यक्ति/गृहस्थ की अलग स्थिति व्यक्त करता है।
- source_word: בְּנַחֲלָתוֹ
  choice: अपनी विरासत में
  rationale: נַחֲלָה पैतृक अथवा आबंटित भू-अधिकार का भाव रखता है; ‘विरासत’ इस भूमि-संबंधी अर्थ को ‘संपत्ति’ से बेहतर सुरक्षित रखती है। आत्मवाचक ‘अपनी’ वितरणात्मक कर्ता से स्वाभाविक संबंध बनाता है।
theological_decisions:
- issue: वितरणात्मक पुल्लिंग एकवचन का अनुवाद
  choice: हर एक अपनी विरासत में
  alternative: हर पुरुष अपनी विरासत में
  rationale: इब्रानी אִישׁ और एकवचन प्रत्यय रूपतः पुल्लिंग एकवचन हैं, पर यहाँ उनका कार्य वितरणात्मक है। ‘हर एक अपनी’ उस वितरणात्मक एकवचनता को स्वाभाविक हिन्दी में बनाए रखता है और संदर्भ से अधिक पुरुष-विशिष्टता नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण कथात्मक रूप। स्रोत के अव्यक्त अस्तित्ववाचक/स्थानवाचक वाक्य को हिन्दी में पूर्ण और स्वाभाविक बनाने के लिए ‘रहते थे’ जोड़ा गया है।
