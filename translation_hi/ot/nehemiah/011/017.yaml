base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/011/017.yaml
  text: And Mattaniah son of Micah[a], son of Zabdi, son of Asaph, was the head, who began the thanksgiving in prayer; and Bakbukiah was second among his brothers; and Abda son of Shammua, son of Galal, son of Jeduthun.
translation:
  language: hi
  text: और मत्तन्याह, मीका का पुत्र, जब्दी का पुत्र, आसाप का पुत्र, प्रार्थना में धन्यवाद देने का आरंभ करनेवाला प्रधान था।[a] बकबुक्याह अपने भाइयों में दूसरे स्थान पर था; और अब्दा, शम्मूआ का पुत्र, गालाल का पुत्र, यदूतून का पुत्र था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी का अधिक शाब्दिक अनुवाद है, “आरंभ का प्रधान, प्रार्थना में धन्यवाद देनेवाला।” इस वाक्यांश का अर्थ यह भी हो सकता है कि मत्तन्याह प्रार्थना में धन्यवाद देने का नेतृत्व करता था या उसका आरंभ करता था।
    reason: मूल वाक्यांश की असामान्य संरचना और मत्तन्याह की भूमिका की वास्तविक अस्पष्टता को सुरक्षित रखना।
lexical_decisions:
- source_word: רֹאשׁ
  choice: प्रधान
  rationale: यहाँ यह उपासना-सेवा में नेतृत्व के पद को दर्शाता है; ‘प्रधान’ आधुनिक हिन्दी में स्वाभाविक और सटीक है।
- source_word: הַתְּחִלָּה
  choice: आरंभ करता था
  rationale: शाब्दिक संज्ञा ‘आरंभ’ को अगले क्रियापद के साथ स्वाभाविक हिन्दी वाक्य में व्यक्त किया गया है, जिससे मत्तन्याह की आरंभकारी भूमिका बनी रहती है।
- source_word: יְהוֹדֶה
  choice: धन्यवाद
  rationale: मन्दिर की उपासना के प्रसंग में हिफ़ील रूप का अर्थ धन्यवाद देना अथवा स्तुति करना है; यहाँ ‘धन्यवाद’ उपयुक्त है।
- source_word: לַתְּפִלָּה
  choice: प्रार्थना में
  rationale: לְ को यहाँ प्रार्थना के क्षेत्र अथवा अवसर के अर्थ में लिया गया है।
- source_word: מִשְׁנֶה
  choice: दूसरे स्थान पर
  rationale: यह पद अथवा क्रम में दूसरे होने का संकेत देता है और हिन्दी में केवल ‘दूसरा’ से अधिक स्पष्ट है।
- source_word: מֵאֶחָיו
  choice: अपने भाइयों में
  rationale: यह इब्रानी के पारिवारिक-सामुदायिक रूपक को सुरक्षित रखता है और अनावश्यक रूप से ‘संगी लेवी’ नहीं जोड़ता।
- source_word: יְדִיתוּן
  choice: यदूतून
  rationale: व्यक्तिनाम का इब्रानी उच्चारण-सन्निकट देवनागरी लिप्यंतरण।
theological_decisions:
- issue: उपासना के प्रसंग में ידה का अर्थ
  choice: धन्यवाद
  alternative: स्तुति; अंगीकार
  rationale: आसाप से संबंधित मन्दिर-उपासना के संदर्भ में धन्यवाद अथवा स्तुति का अर्थ ‘अंगीकार’ से अधिक संभावित है; किसी संप्रदायगत निष्कर्ष को इसमें नहीं जोड़ा गया।
- issue: רֹאשׁ הַתְּחִלָּה יְהוֹדֶה לַתְּפִלָּה की वाक्यगत अस्पष्टता
  choice: प्रधान था; वही प्रार्थना में धन्यवाद का आरंभ करता था
  alternative: प्रार्थना में धन्यवाद देने का आरंभ करनेवाला प्रधान था
  rationale: मुख्य पाठ मत्तन्याह के नेतृत्व और आरंभकारी कार्य दोनों को स्पष्ट करता है, जबकि पादटिप्पणी अधिक शाब्दिक संरचना और संभावित वैकल्पिक समझ को सुरक्षित रखती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। लंबी वंशावली को ‘के वंशज’ और छोटे वाक्यों द्वारा स्पष्ट किया गया है, बिना किसी नाम या संबंध को छोड़े।
