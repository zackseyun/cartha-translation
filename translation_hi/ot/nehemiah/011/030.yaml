  text: זָנֹ֤חַ עֲדֻלָּם֙ וְ/חַצְרֵי/הֶ֔ם לָכִישׁ֙ וּ/שְׂדֹתֶ֔י/הָ עֲזֵקָ֖ה וּ/בְנֹתֶ֑י/הָ וַ/יַּחֲנ֥וּ מִ/בְּאֵֽר שֶׁ֖בַע עַד גֵּֽיא הִנֹּֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/011/030.yaml
  text: Zanoah[a], Adullam and their villages, Lachish and its fields, Azekah and its daughter towns[b]. So they camped from Beer-sheba as far as the Valley of Hinnom.
translation:
  language: hi
  text: जानोह, अदुल्लाम और उनके गाँव, लाकीश और उसके खेत, अजेका और उसके आश्रित नगर[a]। उन्होंने बेर्शेबा से लेकर हिन्नोम की घाटी तक डेरा डाला[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “उसकी बेटियाँ”; अर्थात उसके गाँव या आश्रित बस्तियाँ।
    reason: lexical_alternative
  - marker: b
    text: या “वे बस गए” या “निवास करने लगे।”
    reason: lexical_alternative
lexical_decisions:
- source_word: זָנֹחַ
  choice: जानोह
  rationale: स्थान-नाम का आधुनिक हिन्दी में ध्वन्यात्मक लिप्यंतरण।
- source_word: עֲדֻלָּם
  choice: अदुल्लाम
  rationale: स्थान-नाम को अनूदित करने के बजाय लिप्यंतरित किया गया है।
- source_word: חַצְרֵיהֶם
  choice: उनके गाँवों में
  rationale: बस्ती-सूची में חָצֵר मुख्य नगर से जुड़े ग्रामीण गाँवों या आश्रित बस्तियों को सूचित करता है; हिन्दी में 'गाँव' स्वाभाविक और स्पष्ट है। पूर्वसर्गात्मक 'में' पूरे निवास-सूचक क्रम को स्पष्ट करता है।
- source_word: לָכִישׁ
  choice: लाकीश
  rationale: इब्रानी उच्चारण के निकट प्रचलित हिन्दी लिप्यंतरण।
- source_word: שְׂדֹתֶיהָ
  choice: उसके खेतों में
  rationale: शाब्दिक 'खेत' को बनाए रखता है और नगर से संबंधित कृषि-भूमि का बोध कराता है।
- source_word: עֲזֵקָה
  choice: अजेका
  rationale: स्थान-नाम का हिन्दी लिप्यंतरण।
- source_word: בְנֹתֶיהָ
  choice: उसके अधीन नगरों
  rationale: इब्रानी का शाब्दिक रूप 'उसकी बेटियाँ' आश्रित बस्तियों के लिए भौगोलिक मुहावरा है; 'अधीन नगर' आधुनिक पाठक के लिए उसका आशय स्पष्ट करता है, जबकि विकल्प पादटिप्पणी में रखा गया है।
- source_word: וַיַּחֲנוּ
  choice: वे बस गए
  rationale: חנה का मूल अर्थ डेरा डालना है, पर यरूशलेम और यहूदा में पुनर्वास की इस सूची में 'बस गए' प्रसंगानुकूल विस्तार को स्वाभाविक हिन्दी में व्यक्त करता है; मूल अर्थ पादटिप्पणी में सुरक्षित है।
- source_word: מִבְּאֵר שֶׁבַע
  choice: बेर्शेबा से
  rationale: स्थान-नाम का सुबोध हिन्दी लिप्यंतरण और सीमा के आरंभ को व्यक्त करने वाला 'से'।
- source_word: עַד
  choice: तक
  rationale: भौगोलिक विस्तार की अंतिम सीमा को संक्षेप और स्वाभाविक रूप से व्यक्त करता है।
- source_word: גֵּיא הִנֹּם
  choice: हिन्नोम की घाटी
  rationale: इब्रानी संबंधवाचक पदबंध का पारदर्शी और प्रचलित हिन्दी रूप।
theological_decisions:
- issue: וַיַּחֲנוּ का निवास-संदर्भ में अर्थ
  choice: बस गए
  alternative: उन्होंने डेरा डाला
  rationale: क्रिया के शाब्दिक अर्थ और स्थायी पुनर्वास के प्रसंग के बीच तनाव है। मुख्य पाठ में प्रसंगानुकूल 'बस गए' चुना गया है, और शाब्दिक विकल्प पादटिप्पणी में दिया गया है ताकि अस्पष्टता न मिटे।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। पद की सूचीगत संरचना को बनाए रखते हुए हिन्दी में आवश्यक 'में' जोड़ा गया है। आश्रित बस्तियों के इब्रानी रूपक को मुख्य पाठ में अर्थानुकूल बनाया और पादटिप्पणी में शाब्दिक रूप सुरक्षित रखा गया है।
