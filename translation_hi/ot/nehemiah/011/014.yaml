id: NEH.11.14
reference: Nehemiah 11:14
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/אֲחֵי/הֶם֙ גִּבּ֣וֹרֵי חַ֔יִל מֵאָ֖ה עֶשְׂרִ֣ים וּ/שְׁמֹנָ֑ה וּ/פָקִ֣יד עֲלֵי/הֶ֔ם זַבְדִּיאֵ֖ל בֶּן הַ/גְּדוֹלִֽים־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/011/014.yaml
  text: And their brothers[a], mighty men of valor, were one hundred twenty-eight; and the overseer over them was Zabdiel son of Haggedolim.
translation:
  language: hi
  text: और उनके भाई, जो पराक्रमी पुरुष थे, कुल 128 थे। उन पर नियुक्त अधिकारी जब्दीएल था, जो हग्गदोलीम[a] का पुत्र था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “महान लोगों का पुत्र” अथवा “कुलीनों का पुत्र।” इब्रानी में यह किसी नाम के बजाय वर्णनात्मक पद भी हो सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: וַאֲחֵיהֶם
  choice: और उनके भाई
  rationale: शाब्दिक अर्थ ‘उनके भाई’ है। इस सूची के प्रसंग में इससे उसी व्यापक समूह के अन्य पुरुष सदस्य अभिप्रेत हैं; ‘भाई’ मूल की पारिवारिक अभिव्यक्ति और पुरुष-संदर्भ दोनों बनाए रखता है।
- source_word: גִּבּוֹרֵי חַיִל
  choice: पराक्रमी पुरुष
  rationale: यह पद शक्ति, साहस और योग्यता से युक्त पुरुषों को दर्शाता है। ‘पराक्रमी पुरुष’ स्वाभाविक और गरिमापूर्ण हिन्दी में इसका व्यापक भाव रखता है, बिना पद को अनिवार्य रूप से सैनिक अर्थ तक सीमित किए।
- source_word: מֵאָה עֶשְׂרִים וּשְׁמֹנָה
  choice: कुल 128
  rationale: संख्या का सीधा अर्थ 128 है। हिन्दी वाक्य में ‘कुल’ जोड़ने से सूचीगत गणना स्पष्ट और स्वाभाविक होती है।
- source_word: וּפָקִיד עֲלֵיהֶם
  choice: उन पर नियुक्त अधिकारी
  rationale: פָקִיד किसी प्रशासनिक या पर्यवेक्षी पद पर नियुक्त व्यक्ति को दर्शाता है। ‘नियुक्त अधिकारी’ पद की औपचारिकता रखता है, पर उसे अनावश्यक रूप से सैनिक पद नहीं बनाता।
- source_word: זַבְדִּיאֵל
  choice: जब्दीएल
  rationale: इब्रानी व्यक्तिगत नाम का देवनागरी में निकट ध्वन्यात्मक लिप्यंतरण।
- source_word: בֶּן הַגְּדוֹלִים
  choice: हग्गदोलीम का पुत्र
  rationale: मुख्य पाठ में הַגְּדוֹלִים को कुल अथवा वंश के नाम के रूप में लिप्यंतरित किया गया है। इसकी संभावित वर्णनात्मक व्याख्या पाद-टिप्पणी में सुरक्षित रखी गई है।
theological_decisions:
- issue: הַגְּדוֹלִים का व्यक्तिवाचक नाम या वर्णनात्मक पद होना
  choice: मुख्य पाठ में ‘हग्गदोलीम’ नाम के रूप में
  alternative: ‘महान लोगों का पुत्र’ या ‘कुलीनों का पुत्र’
  rationale: इब्रानी रूप को यहाँ कुलनाम माना जा सकता है, लेकिन वर्णनात्मक अर्थ भी व्याकरणतः संभव है। मुख्य पाठ में नाम रखते हुए पाद-टिप्पणी वास्तविक अस्पष्टता को स्पष्ट करती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, सूचीगत और गरिमापूर्ण शैली रखी गई है। ‘पराक्रमी पुरुष’ पारंपरिक बाइबलीय गरिमा के साथ सामान्य पाठक के लिए बोधगम्य है। पाद-टिप्पणी चिह्न को उसी पद के बाद रखा गया है जिससे वैकल्पिक पाठ संबंधित है।
