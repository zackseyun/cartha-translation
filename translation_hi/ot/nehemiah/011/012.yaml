base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/011/012.yaml
  text: And their brothers[a], doers of the work for the house, were eight hundred twenty-two; and Adaiah son of Jeroham, son of Pelaliah, son of Amzi, son of Zechariah, son of Pashhur, son of Malchijah.
translation:
  language: hi
  text: और उनके भाई, जो भवन के लिए काम करने वाले थे[a], आठ सौ बाईस थे; और अदायाह, यरोहाम का पुत्र, पलल्याह का पुत्र, अम्सी का पुत्र, जकर्याह का पुत्र, पशहूर का पुत्र, मल्किय्याह का पुत्र।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मन्दिर का काम करने वाले।” इब्रानी में शाब्दिक रूप से “भवन के लिए काम करने वाले” है; प्रसंग में “भवन” से मन्दिर अभिप्रेत है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲחֵיהֶם
  choice: और उनके भाई
  rationale: ‘भाई’ इब्रानी संबंधसूचक शब्द का सीधा अर्थ सुरक्षित रखता है। प्रसंग में ये उसी याजकीय समूह के सदस्य हैं, पर ‘साथी याजक’ कहना मूल से अधिक व्याख्यात्मक होता।
- source_word: עֹשֵׂי הַמְּלָאכָה
  choice: काम करनेवाले
  rationale: यह इब्रानी कृदन्तीय पद का स्वाभाविक आधुनिक हिन्दी रूप है और निरन्तर दायित्व का भाव बनाए रखता है।
- source_word: לַבַּיִת
  choice: भवन के लिए
  rationale: ‘भवन’ मूल בַּיִת के ‘घर/भवन’ अर्थ को रखता है, जबकि प्रसंग से यह मन्दिर का संकेत देता है। ‘के लिए’ उपसर्ग ל की कार्य-संबंधी भूमिका व्यक्त करता है।
- source_word: שְׁמֹנֶה מֵאוֹת עֶשְׂרִים וּשְׁנָיִם
  choice: आठ सौ बाईस
  rationale: संख्या का सीधा और प्रचलित हिन्दी रूप।
- source_word: וַעֲדָיָה
  choice: और अदायाह
  rationale: संयोजक सूची को आगे बढ़ाता है और नाम को इब्रानी उच्चारण के निकट देवनागरी में प्रस्तुत किया गया है।
- source_word: בֶּן
  choice: का पुत्र
  rationale: वंशावली में बार-बार आए मानक संबंधसूचक पद को प्रत्येक पीढ़ी में स्पष्ट रूप से रखा गया है; सम्भावित छूटी पीढ़ियों की धारणा जोड़कर इसे ‘वंशज’ नहीं बनाया गया।
- source_word: יְרֹחָם / פְּלַלְיָה / אַמְצִי / זְכַרְיָה / פַּשְׁחוּר / מַלְכִּיָּה
  choice: यरोहाम / पलल्याह / अम्सी / जकर्याह / पशहूर / मल्कियाह
  rationale: व्यक्तिनामों का अनुवाद करने के बजाय उन्हें इब्रानी रूप के निकट देवनागरी में लिप्यन्तरित किया गया है।
