source:
  edition: WLC
  text: וְ/אֶל הַ/חֲצֵרִ֖ים בִּ/שְׂדֹתָ֑/ם מִ/בְּנֵ֣י יְהוּדָ֗ה יָֽשְׁב֞וּ בְּ/קִרְיַ֤ת הָֽאַרְבַּע֙ וּ/בְנֹתֶ֔י/הָ וּ/בְ/דִיבֹן֙ וּ/בְנֹתֶ֔י/הָ וּ/בִֽ/יקַּבְצְאֵ֖ל וַ/חֲצֵרֶֽי/הָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/011/025.yaml
  text: As for the villages in their fields[a], some of the sons of Judah lived in Kiriath-arba and its villages, and in Dibon and its villages[c][b], and in Jekabzeel and its settlements.
translation:
  language: hi
  text: 'उनके खेतों में बसे गाँवों के विषय में: यहूदा के वंशजों में से कुछ किर्यत-अरबा और उसके आसपास के गाँवों में[a], दीबोन और उसके आसपास के गाँवों में, और यकब्सेल[b] तथा उसकी बस्तियों में रहते थे।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: किर्यत-अरबा, हेब्रोन का पुराना नाम है; यहोशू 14:15 देखें।
    reason: cross_reference
  - marker: b
    text: संबंधित पदों और कुछ पाठ-परंपराओं में यह नाम “कब्सेल” भी मिलता है।
    reason: alternative_reading
lexical_decisions:
- source_word: וְאֶל הַחֲצֵרִים בִּשְׂדֹתָם
  choice: उनके खेतों में बसे गाँवों के विषय में
  rationale: וְאֶל यहाँ सूची में नए विषय की ओर संक्रमण करता है; חֲצֵרִים इस ग्रामीण-भौगोलिक संदर्भ में गाँव हैं, और בִּשְׂדֹתָם उनकी कृषि-भूमि में स्थिति बताता है।
- source_word: מִבְּנֵי יְהוּדָה
  choice: यहूदा के वंशजों में से कुछ
  rationale: מִן का अंशवाचक अर्थ 'में से कुछ' से स्पष्ट होता है। בְּנֵי का शाब्दिक 'पुत्र' यहाँ गोत्रीय वंश-संबंध का मुहावरा है, इसलिए स्वाभाविक हिन्दी में 'वंशज' उपयुक्त है।
- source_word: יָשְׁבוּ
  choice: रहते थे
  rationale: क्रिया निवास को व्यक्त करती है; 'बस गए' आरंभिक बसावट का अनावश्यक भाव जोड़ सकता है।
- source_word: בְּקִרְיַת הָאַרְבַּע
  choice: किर्यत-अरबा
  rationale: स्थान-नाम का लिप्यंतरण किया गया है; हेब्रोन से इसकी पहचान पद में जोड़ने के बजाय टिप्पणी में दी गई है।
- source_word: וּבְנֹתֶיהָ
  choice: और उसके आसपास के गाँवों में
  rationale: शाब्दिक अर्थ 'उसकी बेटियाँ' है, पर नगर के अधीन या आसपास के गाँवों के लिए यह एक भौगोलिक मुहावरा है। 'आसपास के गाँव' आधुनिक हिन्दी में अर्थ को साफ रखता है।
- source_word: וּבְדִיבוֹן
  choice: दीबोन
  rationale: स्थान-नाम का प्रचलित ध्वन्यात्मक लिप्यंतरण।
- source_word: וּבִיקַּבְצְאֵל
  choice: यकब्सेल
  rationale: मसोरेटिक रूप יִקַּבְצְאֵל के अनुरूप लिप्यंतरण; संबंधित पाठों में पाए जाने वाले कब्सेल रूप को टिप्पणी में सुरक्षित रखा गया है।
- source_word: וַחֲצֵרֶיהָ
  choice: तथा उसकी बस्तियों में
  rationale: यहाँ חֲצֵרִים आश्रित ग्रामीण बसावटों को दर्शाता है। 'बस्तियाँ' पहले आए בְּנֹתֶיהָ के मुहावरे से शब्दगत भेद भी बनाए रखता है।
theological_decisions:
- issue: מִבְּנֵי יְהוּדָה में लिंगयुक्त गोत्रीय पदनाम
  choice: यहूदा के वंशजों में से कुछ
  alternative: यहूदा के पुत्रों में से कुछ
  rationale: इस प्रशासनिक-गोत्रीय सूची में 'पुत्र' जैविक पुरुष संतानों तक सीमित नहीं, बल्कि यहूदा से संबंधित वंश-समुदाय का पदनाम है। 'वंशज' मूल संबंध को सुरक्षित रखते हुए आधुनिक हिन्दी में अनावश्यक पुरुष-मात्र अर्थ से बचाता है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सूची-सुलभ हिन्दी अपनाई गई है। आरंभिक पदबंध को विषय-परिवर्तन के रूप में रखा गया है। בְּנוֹתֶיהָ के शाब्दिक स्त्रीलिंग रूप को हिन्दी में कृत्रिम 'बेटी-गाँव' न बनाकर उसके भौगोलिक मुहावरे के अनुसार व्यक्त किया गया है।
