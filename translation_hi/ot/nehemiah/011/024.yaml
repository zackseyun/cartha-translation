base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/011/024.yaml
  text: And Pethahiah son of Meshezabel[a], from the sons of Zerah son of Judah[b], was at the king’s side for every matter concerning the people.
translation:
  language: hi
  text: और मशेजबेल का पुत्र पतह्याह, जो यहूदा के पुत्र जेरह के वंशजों में से था, प्रजा से संबंधित हर मामले के लिए राजा के यहाँ नियुक्त था।[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से, ‘राजा के हाथ के पास।’ यह राजकीय सेवा या निकट संबंध का मुहावरा हो सकता है; इसका अर्थ यह भी हो सकता है कि पतह्याह राजा का अधिकारी या प्रतिनिधि था।
    reason: lexical_alternative
  - marker: b
    text: या, ‘प्रजा के लिए हर मामले में।’ इब्रानी वाक्यांश का अर्थ प्रजा से संबंधित मामले, अथवा प्रजा की ओर से निपटाए जाने वाले मामले, हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/פְתַֽחְיָה
  choice: और ... पतह्याह
  rationale: आरंभिक संयोजक וּ को आसपास की प्रशासनिक सूची से संबंध बनाए रखने के लिए ‘और’ के रूप में रखा गया है; नाम का देवनागरी लिप्यंतरण किया गया है।
- source_word: בֶּן מְשֵֽׁיזַבְאֵל
  choice: मशेजबेल का पुत्र
  rationale: इब्रानी वंशसूचक रचना का स्वाभाविक और स्पष्ट हिन्दी रूप।
- source_word: מִ/בְּנֵי זֶרַח בֶּן יְהוּדָה
  choice: यहूदा के पुत्र जेरह के वंशजों में से
  rationale: מִן और בְּנֵי यहाँ वंश या कुल में से होने का बोध देते हैं। ‘वंशजों’ से आशय आधुनिक हिन्दी में स्पष्ट होता है, जबकि जेरह और यहूदा की वंशावली भी बनी रहती है।
- source_word: לְ/יַד הַ/מֶּלֶךְ
  choice: राजा के पास रहता था
  rationale: शाब्दिक अर्थ ‘राजा के हाथ पर/पास’ है; प्रसंग में यह राजकीय निकटता, सेवा या प्रतिनिधि पद का संकेत दे सकता है। मुख्य पाठ में स्वाभाविक हिन्दी रखते हुए अस्पष्टता को टिप्पणी में सुरक्षित किया गया है।
- source_word: לְ/כָל דָּבָר
  choice: हर मामले में
  rationale: דָּבָר यहाँ कथन नहीं, बल्कि प्रशासनिक विषय या मामला दर्शाता है।
- source_word: לָ/עָם
  choice: प्रजा से संबंधित
  rationale: लामेद को प्रजा से जुड़े मामलों के संबंधसूचक अर्थ में लिया गया है; ‘प्रजा के लिए’ वाला संभावित अर्थ टिप्पणी में सुरक्षित है।
