  yaml_path: translation/ot/nehemiah/011/016.yaml
  text: And Shabbethai and Jozabad[a], from the heads of the Levites, were over the outside work of the house of God.
translation:
  language: hi
  text: और शब्बतै और योजाबाद[a], जो लेवियों के प्रधानों में से थे, परमेश्वर के भवन के लिए बाहरी काम की देखरेख करते थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “परमेश्वर के भवन से संबंधित बाहरी काम।” हिब्रू वाक्यांश मंदिर के भीतरी दायित्वों के विपरीत, मंदिर-भवन के बाहर किया जानेवाला काम भी सूचित कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשַׁבְּתַי
  choice: और शब्बतै
  rationale: व्यक्तिनाम को हिब्रू उच्चारण के निकट देवनागरी में लिप्यंतरित किया गया है; आरंभिक संयोजक सूची की निरंतरता बनाए रखता है।
- source_word: וְיוֹזָבָד
  choice: और योजाबाद
  rationale: व्यक्तिनाम का प्रचलित और स्रोत-सम्मत देवनागरी लिप्यंतरण; संयोजक दोनों नामों को जोड़ता है।
- source_word: עַל
  choice: देखरेख करते थे
  rationale: इस प्रशासनिक संदर्भ में यह पद किसी कार्य पर नियुक्त होने अथवा उसका निरीक्षण करने का भाव देता है; आधुनिक हिन्दी में यह अधिक स्वाभाविक है।
- source_word: הַמְּלָאכָה הַחִיצֹנָה
  choice: बाहरी काम
  rationale: מְלָאכָה का व्यापक अर्थ ‘काम’ है और הַחִיצֹנָה उसे बाहरी बताता है; अनुष्ठानिक सेवा का अनावश्यक विशेषीकरण नहीं किया गया।
- source_word: לְבֵית הָאֱלֹהִים
  choice: परमेश्वर के भवन के
  rationale: यह काम और परमेश्वर के भवन के बीच संबंध व्यक्त करता है; לְ का अर्थ यहाँ ‘के लिए’ भी समझा जा सकता है, जिसे पादटिप्पणी में रखा गया है।
- source_word: מֵרָאשֵׁי הַלְוִיִּם
  choice: जो लेवियों के प्रधानों में से थे
  rationale: מִן को ‘में से’ द्वारा सुरक्षित रखा गया है और רָאשֵׁי का प्रशासनिक अर्थ ‘प्रधानों’ से स्पष्ट होता है।
