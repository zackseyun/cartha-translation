lexical_decisions:
- source_word: הַשּׁוֹעֲרִים
  choice: द्वारपाल
  rationale: यह शब्द द्वारों की रखवाली और वहाँ सेवा के लिए नियुक्त व्यक्तियों को दर्शाता है; ‘द्वारपाल’ आधुनिक हिन्दी में स्पष्ट और स्वाभाविक पदनाम है।
- source_word: עַקּוּב
  choice: अक्कूब
  rationale: व्यक्तिवाचक नाम का हिब्रू उच्चारण के निकट देवनागरी लिप्यंतरण।
- source_word: טַלְמוֹן
  choice: तलमोन
  rationale: व्यक्तिवाचक नाम का हिब्रू उच्चारण के निकट देवनागरी लिप्यंतरण।
- source_word: וַאֲחֵיהֶם
  choice: और उनके भाई
  rationale: אָח का मूल अर्थ ‘भाई’ है; वंशीय अथवा सेवक-दल की सूची में यह निकट पुरुष संबंधियों या उसी समूह के सदस्यों को भी सूचित कर सकता है। मुख्य पाठ मूल अर्थ को बनाए रखता है और व्यापक संभावना पादटिप्पणी में दी गई है।
- source_word: הַשֹּׁמְרִים
  choice: जो ... पहरा देते थे
  rationale: शׁמר का कृदंत यहाँ उनकी नियमित और जारी रखवाली की जिम्मेदारी बताता है; ‘पहरा देते थे’ सहज हिन्दी है।
- source_word: בַּשְּׁעָרִים
  choice: द्वारों पर
  rationale: בְּ यहाँ सेवा के स्थान को व्यक्त करता है; हिन्दी में नियुक्त पहरे की जगह के लिए ‘द्वारों पर’ स्वाभाविक है।
- source_word: מֵאָה שִׁבְעִים וּשְׁנָיִם
  choice: कुल 172 जन
  rationale: मूल में दी गई कुल संख्या को स्पष्ट और संक्षिप्त आधुनिक रूप में व्यक्त किया गया है; ‘जन’ से यह स्पष्ट होता है कि संख्या व्यक्तियों की है।
