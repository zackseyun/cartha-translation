  text: and his brothers[a], heads of fathers’ houses, 242; and Amashsai son of Azarel, son of Ahzai, son of Meshillemoth[c][b], son of Immer.
translation:
  language: hi
  text: और उसके भाई[a], जो पितृकुलों के मुखिया थे, कुल 242[b] थे; और अमशसै[c], अजरएल का पुत्र, अहजै का पुत्र, मशिल्लेमोत का पुत्र, इम्मेर का पुत्र था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उसके कुटुम्बी।” यहाँ इब्रानी शब्द एक ही कुल अथवा याजकीय समूह के पुरुष संबंधियों के लिए प्रयुक्त हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: 'इब्रानी में: “दो सौ बयालीस।”'
    reason: lexical_alternative
  - marker: c
    text: इस नाम का एक अन्य रूप “अमसै” भी मिलता है।
    reason: alternative_reading
lexical_decisions:
- source_word: וְאֶחָיו
