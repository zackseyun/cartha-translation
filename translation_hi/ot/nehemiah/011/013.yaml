  rationale: बहुवचन אָח यहाँ याजकीय अथवा कुल-संबंधी पुरुषों को सूचित कर सकता है। ‘भाई’ सबसे सीधा अनुवाद है; व्यापक अर्थ ‘कुटुम्बी’ पादटिप्पणी में संकेतित है।
- source_word: רָאשִׁים לְאָבוֹת
  choice: पितृकुलों के मुखिया
  rationale: यह पद पूर्वज-आधारित कुलों अथवा घरानों के प्रधानों को दर्शाता है। ‘पितृकुल’ इब्रानी सामाजिक संरचना को स्वाभाविक और संक्षिप्त हिन्दी में सुरक्षित रखता है।
- source_word: מָאתַיִם אַרְבָּעִים וּשְׁנָיִם
  choice: '242'
  rationale: इब्रानी संख्या का योग 242 है; सूची में अंकों का प्रयोग पठनीयता बढ़ाता है।
- source_word: וַעֲמַשְׁסַי
  choice: और अमशसै
  rationale: नाम का लिप्यंतरण मासोरेटिक स्वरांकन और शׁ ध्वनि को प्रतिबिंबित करता है; ‘अमसै’ एक प्रचलित सरल रूप है।
- source_word: בֶּן
  choice: पुत्र / पोता / परपोता / वंशज
  rationale: बार-बार आए בֶּן को हिन्दी की स्वाभाविक वंशावली-शैली में संबंध की क्रमिक पीढ़ियों के अनुसार व्यक्त किया गया है। इससे मूल वंश-श्रृंखला अक्षुण्ण रहती है, यद्यपि अंतिम संबंध को ‘वंशज’ कहना इस संभावना को खुला रखता है कि सूची में पीढ़ियाँ संक्षिप्त हों।
- source_word: עֲזַרְאֵל
  choice: अजरएल
  rationale: इब्रानी व्यक्तिगत नाम का देवनागरी लिप्यंतरण।
- source_word: אַחְזַי
  choice: अहजै
  rationale: इब्रानी व्यक्तिगत नाम का देवनागरी लिप्यंतरण।
- source_word: מְשִׁלֵּמוֹת
  choice: मशिल्लेमोत
  rationale: इस पद में प्राप्त इब्रानी वर्तनी और स्वरांकन के निकट देवनागरी लिप्यंतरण।
- source_word: אִמֵּר
  choice: इम्मेर
  rationale: इब्रानी व्यक्तिगत तथा याजकीय कुल-नाम का सीधा देवनागरी लिप्यंतरण।
