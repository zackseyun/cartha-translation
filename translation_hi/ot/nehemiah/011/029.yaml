    reason: cultural_note
lexical_decisions:
- source_word: וּ/בְ/עֵין רִמּוֹן
  choice: और एन-रिम्मोन में
  rationale: उपसर्ग וּ और בְ को क्रमशः ‘और’ तथा ‘में’ से व्यक्त किया गया है। स्थान-नाम עֵין רִמּוֹן का अनुवाद करने के बजाय उसका प्रचलित हिन्दी लिप्यंतरण ‘एन-रिम्मोन’ रखा गया है।
- source_word: וּ/בְ/צָרְעָה
  choice: और सोरा में
  rationale: संयोजक और संबंधसूचक उपसर्गों को स्पष्ट रूप से रखा गया है। צָרְעָה के लिए हिन्दी बाइबलीय परंपरा में पहचाना जाने वाला रूप ‘सोरा’ अपनाया गया है।
- source_word: וּ/בְ/יַרְמוּת
  choice: और यर्मूत में
  rationale: यह बस्तियों की सूची में आया स्थान-नाम है। וּ/בְ को ‘और ... में’ से और יַרְמוּת को मूल के निकट हिन्दी लिप्यंतरण ‘यर्मूत’ से व्यक्त किया गया है।
