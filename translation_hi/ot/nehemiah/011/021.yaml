  text: And the temple servants were living on the Ophel[a], and Ziha and Gishpa were over the temple servants.
translation:
  language: hi
  text: और मंदिर के सेवक[a] ओपेल पर रहते थे, और सीहा और गिश्पा मंदिर के सेवकों के प्रभारी थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'हिब्रू: नतीनीम (נְתִינִים), मंदिर की सेवा के लिए नियुक्त एक विशिष्ट वर्ग का तकनीकी नाम।'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנְּתִינִים
  choice: मन्दिर के सेवक
  rationale: यह निर्वासनोत्तर काल में मन्दिर की सेवा के लिए नियुक्त एक विशिष्ट वर्ग का तकनीकी नाम है। कार्यसूचक हिन्दी अनुवाद सामान्य पाठक के लिए अर्थ स्पष्ट रखता है।
- source_word: יֹשְׁבִים
  choice: रहते थे
  rationale: वर्तमान कृदन्त यहाँ निरन्तर निवास का भाव देता है; ‘रहते थे’ स्वाभाविक आधुनिक हिन्दी में उस स्थायी/चल रहे निवास को व्यक्त करता है।
- source_word: בָּעֹפֶל
  choice: ओपेल पर
  rationale: ओपेल एक स्थान अथवा ऊँचे भूभाग का नाम है; उपसर्ग בְּ और निश्चित उपपद सहित रूप को भू-आकृतिक संदर्भ में ‘ओपेल पर’ कहना उपयुक्त है।
- source_word: צִיחָא
  choice: सीहा
  rationale: व्यक्तिवाचक नाम का हिब्रू उच्चारण के निकट देवनागरी लिप्यन्तरण।
- source_word: גִשְׁפָּא
  choice: गिश्पा
  rationale: व्यक्तिवाचक नाम का हिब्रू उच्चारण के निकट देवनागरी लिप्यन्तरण।
- source_word: עַל הַנְּתִינִים
  choice: मन्दिर के सेवकों के अधिकारी थे
  rationale: प्रशासनिक संदर्भ में עַל अधिकार या देखरेख को सूचित करता है। ‘के अधिकारी थे’ संक्षिप्त, स्वाभाविक हिन्दी में इस सम्बन्ध को स्पष्ट करता है।
