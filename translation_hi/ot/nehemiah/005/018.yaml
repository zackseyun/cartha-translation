source:
  edition: WLC
  text: וַ/אֲשֶׁר֩ הָיָ֨ה נַעֲשֶׂ֜ה לְ/י֣וֹם אֶחָ֗ד שׁ֣וֹר אֶחָ֞ד צֹ֠אן שֵׁשׁ בְּרֻר֤וֹת וְ/צִפֳּרִים֙ נַֽעֲשׂוּ לִ֔/י וּ/בֵ֨ין עֲשֶׂ֧רֶת יָמִ֛ים בְּ/כָל יַ֖יִן לְ/הַרְבֵּ֑ה וְ/עִם זֶ֗ה לֶ֤חֶם הַ/פֶּחָה֙ לֹ֣א בִקַּ֔שְׁתִּי כִּֽי כָֽבְדָ֥ה הָ/עֲבֹדָ֖ה עַל הָ/עָ֥ם הַ/זֶּֽה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/005/018.yaml
  text: What was prepared for each day was one ox and six choice sheep[a]; also birds were prepared for me, and every ten days an abundance of all kinds of wine. Yet even with this, I did not demand the governor’s food allowance[b], because the service was heavy on this people.
translation:
  language: hi
  text: 'प्रतिदिन यह सब तैयार किया जाता था: एक बैल, छह चुनी हुई भेड़ें, और मेरे लिए पक्षी भी; और हर दस दिन पर हर प्रकार का दाखमधु बहुतायत से दिया जाता था। इतना सब होते हुए भी मैंने राज्यपाल का भोजन-भत्ता[a] नहीं माँगा, क्योंकि इन लोगों पर काम का बोझ भारी था[b]।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “राज्यपाल की रोटी”; इसका अर्थ राज्यपाल के पद से जुड़ी भोजन-सामग्री या आधिकारिक रसद भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या, “क्योंकि इन लोगों पर श्रम बहुत भारी था।” मूल भाषा लोगों के बोझ की भारीपन पर बल देती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲשֶׁר הָיָה נַעֲשֶׂה לְיוֹם אֶחָד
  choice: प्रतिदिन यह सब तैयार किया जाता था
  rationale: शाब्दिक अर्थ ‘एक दिन के लिए जो तैयार किया जाता था’ है; प्रसंग में यह प्रतिदिन की आवर्ती व्यवस्था बताता है। अपूर्ण भूतकालीन भाव को ‘किया जाता था’ से रखा गया है।
- source_word: שׁוֹר אֶחָד
  choice: एक बैल
  rationale: שׁוֹר गोवंश के एक पशु को दर्शाता है। भोजन-सामग्री की सूची में ‘एक बैल’ सहज और पर्याप्त रूप से सटीक है।
- source_word: צֹאן שֵׁשׁ בְּרֻרוֹת
  choice: छः चुनी हुई भेड़ें
  rationale: צֹאן छोटे पालतू पशुओं का सामूहिक शब्द हो सकता है, पर संख्या और भोज के प्रसंग में ‘भेड़ें’ स्वाभाविक है; בְּרֻרוֹת उनकी चुनी हुई उत्तम गुणवत्ता बताता है।
- source_word: וְצִפֳּרִים נַעֲשׂוּ לִי
  choice: और मेरे लिए पक्षी
  rationale: צִפֳּרִים व्यापक रूप से पक्षियों को दर्शाता है। आरंभिक क्रिया ‘तैयार किया जाता था’ इस पद पर भी लागू होती है और לִי को ‘मेरे लिए’ स्पष्ट रूप से रखा गया है।
- source_word: וּבֵין עֲשֶׂרֶת יָמִים
  choice: और हर दस दिन पर
  rationale: यह पद दस-दस दिन के नियमित अंतराल को व्यक्त करता है; ‘हर दस दिन पर’ आधुनिक हिन्दी में स्वाभाविक है।
- source_word: בְּכָל יַיִן לְהַרְבֵּה
  choice: सब प्रकार का दाखमधु बहुतायत से
  rationale: בְּכָל व्यापकता और לְהַרְבֵּה प्रचुर मात्रा व्यक्त करता है। ‘दाखमधु’ प्राचीन अंगूरी मदिरा के लिए गरिमापूर्ण तथा परिचित बाइबलीय हिन्दी शब्द है।
- source_word: וְעִם זֶה
  choice: इतना सब होते हुए भी
  rationale: यह पूर्ववर्ती प्रचुर व्यवस्था और नहेमायाह द्वारा अधिकार न माँगने के बीच रियायती विरोध को स्वाभाविक हिन्दी में प्रकट करता है।
- source_word: לֶחֶם הַפֶּחָה
  choice: राज्यपाल के भोजन का भत्ता
  rationale: शाब्दिक रूप ‘राज्यपाल की रोटी’ है, पर לֶחֶם यहाँ भोजन या पद से जुड़ी आधिकारिक रसद का द्योतक है। ‘भोजन का भत्ता’ उस प्रशासनिक अर्थ को स्पष्ट करता है।
- source_word: לֹא בִקַּשְׁתִּי
  choice: नहीं माँगा
  rationale: בקשׁ का मूल अर्थ माँगना या चाहना है। ‘नहीं माँगा’ यह दिखाता है कि नहेमायाह ने उपलब्ध आधिकारिक अधिकार का दावा नहीं किया, बिना क्रिया को अनावश्यक रूप से ‘वसूल किया’ बनाने के।
- source_word: כִּי כָבְדָה הָעֲבֹדָה עַל הָעָם הַזֶּה
  choice: क्योंकि इन लोगों पर काम का बोझ बहुत भारी था
  rationale: כבד भार या कठिनता का बिंब देता है और עֲבֹדָה काम, श्रम या सेवा हो सकता है। हिन्दी में ‘काम का बोझ बहुत भारी था’ मूल बिंब और लोगों की कठिन स्थिति दोनों को रखता है।
theological_decisions:
- issue: नहेमायाह द्वारा राज्यपाल की आधिकारिक रसद न लेने का सामाजिक-नैतिक आशय
  choice: उसने लोगों पर पहले से पड़े भारी बोझ के कारण पद से जुड़ा भोजन-भत्ता नहीं माँगा
  alternative: उसने केवल राज्यपाल की रोटी नहीं माँगी, या उसने किसी विशिष्ट कर को अस्वीकार किया
  rationale: पदबंध ‘राज्यपाल की रोटी’ भोजन की आधिकारिक व्यवस्था का संकेत देता है, जबकि कारण-वाक्य लोगों पर भारी काम का बोझ बताता है। अनुवाद उसके संयम और लोगों के प्रति चिंता को व्यक्त करता है, पर किसी विशेष कर-प्रणाली या व्यापक सिद्धान्त को पाठ में नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण कथात्मक शैली अपनाई गई है। ‘राज्यपाल’, ‘भोजन का भत्ता’ और ‘काम का बोझ’ सामान्य पाठक के लिए स्पष्ट हैं; ‘दाखमधु’ प्राचीन प्रसंग के अनुरूप परिचित बाइबलीय शब्दावली बनाए रखता है। पादटिप्पणी-चिह्न उन्हीं पदों पर रखे गए हैं जिनकी वैकल्पिक व्याख्या पादटिप्पणियों में दी गई है।
