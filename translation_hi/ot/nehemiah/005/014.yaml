base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/005/014.yaml
  text: Also[a], from the day that he appointed me to be governor in the land of Judah, from the twentieth year until the thirty-second year of King Artaxerxes—twelve years—I and my brothers did not eat the governor’s food allowance.
translation:
  language: hi
  text: इसके अतिरिक्त, जिस दिन उसने मुझे यहूदा देश में उनका राज्यपाल नियुक्त किया, उस दिन से—अर्थात राजा अर्तक्षत्र के शासन के बीसवें वर्ष से बत्तीसवें वर्ष तक, कुल बारह वर्ष—मैंने और मेरे भाइयों ने राज्यपाल का भोजन[a] नहीं खाया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक अर्थ “राज्यपाल की रोटी”; अर्थात वह भोजन, रसद या भत्ता जिसे राज्यपाल प्रथा के अनुसार ले सकता था।
    reason: lexical_alternative
lexical_decisions:
