theological_decisions:
- issue: פֶּחָם के बहुवचन संबंधसूचक प्रत्यय का अनुवाद
  choice: उनका राज्यपाल
  alternative: राज्यपाल / वहाँ का राज्यपाल
  rationale: मसोरेटिक पाठ में प्रत्यय उपस्थित है और स्वाभाविक रूप से यहूदा के लोगों की ओर संकेत करता है। यद्यपि उसका पूर्वपद इसी वाक्य में स्पष्ट नहीं है, उसे छोड़ने के बजाय मूल पाठ की संदर्भगत अस्पष्टता बनाए रखी गई है।
- issue: אַחַי का संभावित प्रतिनिधिक अर्थ
  choice: मेरे भाइयों
  alternative: मेरे साथी / मेरे यहूदी भाई
  rationale: मूल शब्द स्पष्ट रूप से पुल्लिंग बहुवचन है। संदर्भ में अधिकारी या निकट सहयोगी शामिल हो सकते हैं, पर मुख्य पाठ में अधिक व्यापक अर्थ आरोपित नहीं किया गया।
- issue: לֶחֶם הַפֶּחָה का शाब्दिक या मुहावरेदार अनुवाद
  choice: राज्यपाल का भोजन
  alternative: राज्यपाल की रोटी / राज्यपाल का भोजन-भत्ता
  rationale: यह पद राज्यपाल को मिलने वाली प्रथागत रसद की ओर संकेत करता है। 'भोजन' मूल रूपक को पर्याप्त रूप से बचाता है, जबकि पादटिप्पणी उसके प्रशासनिक अर्थ को खोलती है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज रखी गई है। राजकीय कालगणना को स्पष्ट करने के लिए “शासन के” और अवधि के सार में “कुल” जोड़ा गया है।
