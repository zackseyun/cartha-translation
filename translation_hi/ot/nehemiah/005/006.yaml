lexical_decisions:
- source_word: וַיִּחַר לִי
  choice: मुझे क्रोध आया
  rationale: यह हिब्रू मुहावरा किसी व्यक्ति के भीतर क्रोध भड़कने को व्यक्त करता है। ‘मुझे क्रोध आया’ आधुनिक हिंदी में स्वाभाविक और अर्थ की दृष्टि से सटीक है।
- source_word: מְאֹד
  choice: बहुत
  rationale: यह क्रोध की तीव्रता बढ़ाता है; ‘बहुत’ सहज आधुनिक हिंदी में वही बल व्यक्त करता है।
- source_word: כַּאֲשֶׁר
  choice: जब
  rationale: यहाँ संयोजक नहेमायाह के क्रोध के समय और परिस्थिति को उसकी सुनी हुई बात से जोड़ता है।
- source_word: שָׁמַעְתִּי
  choice: मैंने ... सुनीं
  rationale: यहाँ क्रिया लोगों की दुहाई और कही गई बातें सुनने के सामान्य अर्थ में है।
- source_word: זַעֲקָתָם
  choice: उनकी दुहाई
  rationale: זעקה संकट और विरोध से उपजी पुकार को दर्शाता है। ‘दुहाई’ शिकायत की भावनात्मक तीव्रता और न्याय की गुहार—दोनों को संक्षेप में व्यक्त करती है।
- source_word: וְאֵת הַדְּבָרִים הָאֵלֶּה
  choice: और ये बातें
  rationale: דברים का अर्थ ‘बातें’, ‘शब्द’ या ‘मामले’ हो सकता है। संदर्भ में ‘ये बातें’ स्वाभाविक है और कही गई बातों तथा बताए गए मामलों के बीच मूल अस्पष्टता को पर्याप्त रूप से बनाए रखता है।
