source:
  edition: WLC
  text: וָ/אֹמְרָ֣/ה לָ/הֶ֗ם אֲנַ֣חְנוּ קָ֠נִינוּ אֶת אַחֵ֨י/נוּ הַ/יְּהוּדִ֜ים הַ/נִּמְכָּרִ֤ים לַ/גּוֹיִם֙ כְּ/דֵ֣י בָ֔/נוּ וְ/גַם אַתֶּ֛ם תִּמְכְּר֥וּ אֶת אֲחֵי/כֶ֖ם וְ/נִמְכְּרוּ לָ֑/נוּ וַֽ/יַּחֲרִ֔ישׁוּ וְ/לֹ֥א מָצְא֖וּ דָּבָֽר־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/005/008.yaml
  text: And I said to them[a], “We have bought back our Jewish brothers who were sold to the nations, as much as we were able. But now you yourselves are even selling your brothers[b], and they must be sold to us!” Then they were silent and found nothing to say.
translation:
  language: hi
  text: तब मैंने उनसे कहा, “हमने अपने उन यहूदी भाइयों को, जो अन्यजातियों को बेच दिए गए थे, अपनी सामर्थ्य भर वापस मोल लिया है। फिर भी तुम स्वयं अपने भाइयों को बेच रहे हो, और वे हमारे ही पास बेच दिए जाएँ![a]” तब वे चुप रहे और उन्हें उत्तर देने के लिए कोई बात न मिली।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “और क्या वे हमारे ही पास बेच दिए जाएँ?” इब्रानी वाक्यांश संक्षिप्त है और इसे अलंकारिक प्रश्न अथवा उनके काम के विडंबनापूर्ण परिणाम के रूप में समझा जा सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: קָנִינוּ
  choice: वापस मोल लिया है
  rationale: संदर्भ में अपने यहूदी भाइयों को विदेशी दासता से धन देकर छुड़ाने का भाव है। यह अनुवाद पुनः खरीदने और मुक्त कराने, दोनों को सहज हिन्दी में व्यक्त करता है, बिना अतिरिक्त धर्मवैज्ञानिक अर्थ जोड़े।
- source_word: אַחֵינוּ הַיְּהוּדִים / אֲחֵיכֶם
  choice: अपने यहूदी भाइयों / अपने भाइयों
  rationale: ‘भाइयों’ से इब्रानी के पुल्लिंग संबंधवाचक शब्द और समुदायगत एकता का भाव बना रहता है।
- source_word: הַנִּמְכָּרִים לַגּוֹיִם
  choice: जो अन्यजातियों के हाथ बेच दिए गए थे
  rationale: ‘अन्यजातियों’ से גּוֹיִם का यहूदी समुदाय से बाहर के लोगों वाला अर्थ आता है; ‘के हाथ’ स्वाभाविक हिन्दी में बिक्री के गंतव्य को स्पष्ट करता है।
- source_word: כְּדֵי בָנוּ
  choice: अपनी सामर्थ्य भर
  rationale: यह संक्षिप्त और स्वाभाविक हिन्दी मुहावरा उपलब्ध साधनों अथवा क्षमता की सीमा को व्यक्त करता है।
- source_word: וְגַם אַתֶּם
  choice: फिर भी तुम स्वयं
  rationale: ‘फिर भी’ आरोप के तीखे विरोध को और ‘स्वयं’ सर्वनाम के जोर को व्यक्त करता है।
- source_word: תִּמְכְּרוּ
  choice: बेच रहे हो
  rationale: वर्तमानकालिक आरोप को आधुनिक हिन्दी में स्वाभाविक रूप से प्रकट करता है।
- source_word: וְנִמְכְּרוּ לָנוּ
  choice: ताकि वे फिर हमारे ही हाथ बेच दिए जाएँ!
  rationale: कठिन और संक्षिप्त इब्रानी खंड को विडंबनापूर्ण परिणाम के रूप में प्रस्तुत किया गया है; ‘ही’ इस असंगति पर बल देता है। प्रश्नवाचक समझ भी संभव है और पादटिप्पणी में दी गई है।
- source_word: וַיַּחֲרִישׁוּ וְלֹא מָצְאוּ דָּבָר
  choice: वे चुप रहे और उन्हें उत्तर देने के लिए कोई बात न मिली
  rationale: दोनों इब्रानी कथनों को अलग रखते हुए उनके मौन और उत्तरहीनता को सहज हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: אַחֵינוּ / אֲחֵיכֶם का लिंग और समुदायगत संदर्भ
  choice: भाइयों
  alternative: भाई-बहनों; साथी यहूदियों
  rationale: मूल में पुल्लिंग बहुवचन संबंधवाचक शब्द है। मुख्य पाठ उसे बनाए रखता है और बिना स्पष्ट आधार के लिंग-समावेशी विस्तार नहीं करता।
- issue: וְנִמְכְּרוּ לָנוּ का वाक्य-बल
  choice: 'परिणामसूचक विस्मय: “ताकि वे फिर हमारे ही हाथ बेच दिए जाएँ!”'
  alternative: 'प्रश्नवाचक: “और क्या वे हमारे ही हाथ बेच दिए जाएँ?”'
  rationale: इब्रानी खंड अत्यंत संक्षिप्त है और प्रश्नचिह्न नहीं देता। मुख्य पाठ इसे नहेमायाह के आरोप में निहित विडंबनापूर्ण परिणाम के रूप में पढ़ता है, जबकि वास्तविक प्रश्नवाचक संभावना पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: आधुनिक मानक हिन्दी; गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। ‘वापस मोल लिया’, ‘अपनी सामर्थ्य भर’ और ‘कोई बात न मिली’ जैसे वाक्यांश मूल के निकट रहते हुए स्वाभाविक हिन्दी देते हैं।
