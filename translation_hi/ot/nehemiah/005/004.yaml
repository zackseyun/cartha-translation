  language: hi
  text: और कुछ लोग कह रहे थे, “हमने अपने खेतों और अंगूर के बागों पर लगनेवाला राजा का कर चुकाने के लिए धन[a] उधार लिया है।”
  philosophy: optimal-equivalence
  footnotes:
