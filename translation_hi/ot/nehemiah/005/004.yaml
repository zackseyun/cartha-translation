    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֵשׁ
  choice: और कुछ लोग
  rationale: यह पद शिकायत करनेवाले एक और समूह का परिचय देता है; कथा के भूतकालीन संदर्भ में यह स्वाभाविक हिन्दी है।
- source_word: אֲשֶׁר אֹמְרִים
  choice: कह रहे थे
  rationale: इब्रानी कृदन्त जारी या वर्णित वाणी का संकेत देता है; अपूर्ण भूतकाल हिन्दी में इस भाव को सहजता से व्यक्त करता है।
- source_word: לָוִינוּ
  choice: हमने ... उधार लिया है
  rationale: क्रिया का अर्थ ऋण लेना है, और पूर्ण वर्तमान शिकायत के समय तक बने हुए परिणाम को व्यक्त करता है।
- source_word: כֶסֶף
  choice: रुपया
  rationale: शाब्दिक अर्थ 'चाँदी' है, पर आर्थिक संदर्भ में इसका अर्थ धन या रुपया है; आधुनिक हिन्दी में 'रुपया' ऋण की वस्तु को स्पष्ट करता है।
- source_word: לְמִדַּת הַמֶּלֶךְ
  choice: राजा का कर चुकाने के लिए
  rationale: यह राजा को देय निर्धारित भुगतान बताता है; 'कर' आधुनिक पाठक के लिए सर्वाधिक स्पष्ट समतुल्य है।
- source_word: שְׂדֹתֵינוּ וּכְרָמֵינוּ
  choice: अपने खेतों और अंगूर के बागों पर लगनेवाला
  rationale: ये संज्ञाएँ संभवतः उस संपत्ति को बताती हैं जिस पर कर निर्धारित था; इस संबंध को स्वाभाविक हिन्दी में स्पष्ट किया गया है।
