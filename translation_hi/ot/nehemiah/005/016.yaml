base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/005/016.yaml
  text: And I also applied myself to the work on this wall[a], and we did not buy any field[b], and all my young men were gathered there for the work.
translation:
  language: hi
  text: और मैं भी इस दीवार के काम में लगा रहा[a]। हमने कोई खेत नहीं खरीदा, और मेरे सभी युवक[b] वहाँ काम में जुटे थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मैंने इस दीवार के काम को दृढ़ता से थामे रखा”; अर्थात्, “मैं स्वयं उसमें लगा रहा।”
    reason: lexical_alternative
  - marker: b
    text: या “सेवक” अथवा “सहायक।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם
  choice: और मैं भी
  rationale: संयोजक וְ और योगसूचक גַם दोनों को स्वाभाविक हिन्दी में व्यक्त करता है और पिछले प्रसंग से संबंध बनाए रखता है।
- source_word: בִּמְלֶאכֶת הַחוֹמָה הַזֹּאת
  choice: इस दीवार के काम में
  rationale: מְלָאכָה को ‘काम’ और स्पष्ट संकेतवाचक पदबंध को ‘इस दीवार’ के रूप में सीधे और सहज ढंग से प्रस्तुत करता है; ‘नगर की’ जैसा प्रसंगगत विवरण नहीं जोड़ा गया।
- source_word: הֶחֱזַקְתִּי
  choice: पूरी तरह लगा रहा
  rationale: यहाँ חזק का हिफ़ईल रूप काम को दृढ़ता से थामने अथवा उसमें मन लगाकर जुटे रहने का भाव देता है। यह चयन स्वाभाविक हिन्दी में नहेमायाह की व्यक्तिगत और निरंतर भागीदारी व्यक्त करता है।
- source_word: וְשָׂדֶה לֹא קָנִינוּ
  choice: हमने कोई खेत नहीं खरीदा
  rationale: प्रथम पुरुष बहुवचन קָנִינוּ को ‘हमने’ के रूप में सुरक्षित रखा गया है। שָׂדֶה के अनिश्चित/सामूहिक अर्थ के लिए ‘कोई खेत’ सहज है।
- source_word: וְכָל נְעָרַי
  choice: और मेरे सभी जवान
  rationale: נַעַר का मूल अर्थ ‘जवान’ है, पर प्रसंग में यह सेवकों या निजी सहायकों को भी सूचित कर सकता है; मुख्य पाठ मूल की व्यापकता रखता है और विकल्प पादटिप्पणी में दिया गया है।
- source_word: קְבוּצִים שָׁם עַל הַמְּלָאכָה
  choice: वहाँ काम के लिए इकट्ठे थे
  rationale: निष्क्रिय कृदंत קְבוּצִים को ‘इकट्ठे थे’ और עַל הַמְּלָאכָה को उद्देश्य/नियुक्ति के अर्थ में ‘काम के लिए’ अनूदित किया गया है।
