id: NEH.5.17
reference: Nehemiah 5:17
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/הַ/יְּהוּדִ֨ים וְ/הַ/סְּגָנִ֜ים מֵאָ֧ה וַ/חֲמִשִּׁ֣ים אִ֗ישׁ וְ/הַ/בָּאִ֥ים אֵלֵ֛י/נוּ מִן הַ/גּוֹיִ֥ם אֲשֶׁר סְבִיבֹתֵ֖י/נוּ עַל שֻׁלְחָנִֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/005/017.yaml
  text: The Jews and the officials[a], a hundred and fifty men, and those who came to us from the nations that were around us[b], were at my table.
translation:
  language: hi
  text: यहूदी और अधिकारी—कुल एक सौ पचास पुरुष—और हमारे चारों ओर की जातियों में से हमारे पास आनेवाले लोग, मेरी मेज़ पर भोजन करते थे।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “मेरी मेज़ पर भोजन करते थे” का अर्थ है कि नहेमायाह आतिथ्य और प्रशासनिक दायित्व के अंतर्गत उनके भोजन की व्यवस्था करता था।
    reason: cultural_note
lexical_decisions:
- source_word: וְהַיְּהוּדִים
  choice: यहूदी
  rationale: यह शब्द यहाँ सामान्य रूप से यहूदी समुदाय को दर्शा सकता है; आधुनिक हिन्दी में ‘यहूदी’ स्वाभाविक और व्यापक अर्थ वाला रूप है।
- source_word: וְהַסְּגָנִים
  choice: अधिकारी
  rationale: यह अधीनस्थ नागरिक प्रशासकों या शासकीय पदाधिकारियों के लिए प्रयुक्त है; ‘अधिकारी’ बिना अनावश्यक पद-विशेष तय किए भूमिका स्पष्ट करता है।
- source_word: מֵאָה וַחֲמִשִּׁים אִישׁ
  choice: कुल एक सौ पचास पुरुष
  rationale: संख्या और אִישׁ के पुरुष-सूचक अर्थ को बनाए रखा गया है; ‘कुल’ हिन्दी में यह स्पष्ट करता है कि संख्या यहूदियों और अधिकारियों की सम्मिलित संख्या है।
- source_word: וְהַבָּאִים אֵלֵינוּ
  choice: और ... हमारे पास आनेवाले लोग
  rationale: इब्रानी कृदन्त के चलते रहने या सामान्यतः आने के भाव को हिन्दी कृदन्त ‘आनेवाले’ से सुरक्षित रखा गया है।
- source_word: מִן הַגּוֹיִם אֲשֶׁר סְבִיבֹתֵינוּ
  choice: हमारे चारों ओर की जातियों में से
  rationale: גּוֹיִם का स्रोत-समीप और धार्मिक रूप से कम भारित अनुवाद ‘जातियाँ’ है; पूरा वाक्यांश पड़ोसी गैर-यहूदी जनसमूहों का भौगोलिक संकेत देता है।
- source_word: עַל שֻׁלְחָנִי
  choice: मेरी मेज़ पर भोजन करते थे
  rationale: शाब्दिक चित्र ‘मेरी मेज़ पर’ रखा गया है और हिन्दी में अधूरापन टालने के लिए संदर्भगत आशय ‘भोजन करते थे’ स्पष्ट किया गया है; इससे नहेमायाह द्वारा भोजन उपलब्ध कराने का भाव व्यक्त होता है।
theological_decisions: []
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। आरम्भ में कोई कालसूचक ‘अब’ नहीं जोड़ा गया, क्योंकि स्रोत में उसका स्पष्ट समकक्ष नहीं है। संख्या के संबंध को स्पष्ट करने के लिए डैश और ‘कुल’ का प्रयोग किया गया है।
