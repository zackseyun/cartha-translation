  text: There arose a great outcry from the people and their wives against their Jewish brothers[a].
translation:
  language: hi
  text: लोगों और उनकी पत्नियों की अपने यहूदी भाइयों[a] के विरुद्ध बड़ी पुकार उठी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “अपने यहूदिया-वासी भाइयों।” इब्रानी शब्द, प्रसंग के ज़ोर के अनुसार, जातीय पहचान “यहूदी” या क्षेत्रीय पहचान “यहूदिया-वासी” का अर्थ दे सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתְּהִי
  choice: तब ... मचाई
  rationale: वय्यिक्तोल कथा में एक नए घटनाक्रम को आगे बढ़ाता है। हिन्दी में ‘तब’ और ‘पुकार मचाई’ इस उद्भव को स्वाभाविक रूप से व्यक्त करते हैं, बिना किसी स्पष्ट ‘अब’ को जोड़ने के।
- source_word: צַעֲקַת
  choice: पुकार
  rationale: यह शब्द संकट और विरोध से भरी सार्वजनिक गुहार को दर्शाता है; ‘पुकार’ सरल और तीव्र है, जबकि क्रिया ‘मचाई’ उसके सामूहिक स्वर को प्रकट करती है।
- source_word: הָעָם
  choice: लोगों
  rationale: शब्द व्यापक रूप से समुदाय के लोगों को सूचित करता है; यहाँ ‘लोग’ सामाजिक वर्ग को अनावश्यक रूप से सीमित नहीं करता।
- source_word: וּנְשֵׁיהֶם
  choice: और उनकी पत्नियों ने
  rationale: प्रत्यययुक्त बहुवचन का स्वाभाविक अर्थ ‘उनकी पत्नियाँ’ है और शिकायत में स्त्रियों की स्पष्ट भागीदारी सुरक्षित रहती है।
- source_word: גְּדוֹלָה
  choice: बड़ी
  rationale: विशेषण पुकार की तीव्रता और व्यापकता बताता है; ‘बड़ी’ उसका सीधा हिन्दी समतुल्य है।
- source_word: אֶל
  choice: के विरुद्ध
  rationale: मूलतः ‘की ओर’ होने पर भी शिकायत के प्रसंग में यह विरोध के लक्ष्य को बताता है; ‘के विरुद्ध’ हिन्दी में वही प्रतिकूल अर्थ देता है।
- source_word: אֲחֵיהֶם
  choice: अपने ... भाइयों
  rationale: मूल पाठ सचमुच ‘उनके भाइयों’ कहता है। ‘अपने भाइयों’ हिन्दी में उसी सामुदायिक और बंधुत्व संबंध को स्वाभाविक रूप से व्यक्त करता है।
- source_word: הַיְּהוּדִים
  choice: यहूदी
  rationale: यह जातीय-सामुदायिक पहचान का आधुनिक और प्रचलित हिन्दी रूप है; क्षेत्रीय अर्थ ‘यहूदिया-वासी’ को पादटिप्पणी में सुरक्षित रखा गया है।
theological_decisions:
- issue: जातीय अथवा क्षेत्रीय पद יְהוּדִים
  choice: यहूदी
  alternative: यहूदिया-वासी
  rationale: नहेमायाह 5 में शिकायत एक ही वाचा-समुदाय के भीतर है। ‘यहूदी भाई’ उस आंतरिक एकता और अन्याय को स्पष्ट करता है, जबकि ऐतिहासिक-क्षेत्रीय संभावना पादटिप्पणी में बनी रहती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण और सामान्य पाठकों के लिए स्पष्ट शैली। ‘बड़ी पुकार मचाई’ संकट और सार्वजनिक विरोध—दोनों का भाव रखता है; पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित है।
