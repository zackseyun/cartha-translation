source:
  edition: WLC
  text: וְ/יֵשׁ֙ אֲשֶׁ֣ר אֹמְרִ֔ים שְׂדֹתֵ֛י/נוּ וּ/כְרָמֵ֥י/נוּ וּ/בָתֵּ֖י/נוּ אֲנַ֣חְנוּ עֹרְבִ֑ים וְ/נִקְחָ֥ה דָגָ֖ן בָּ/רָעָֽב׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/005/003.yaml
  text: And there were others who said[a], “We are mortgaging our fields, our vineyards, and our houses to get grain during the famine.”
translation:
  language: hi
  text: और कुछ लोग कह रहे थे, “हम अकाल के समय अनाज पाने के लिए अपने खेत, दाख की बारियाँ और घर गिरवी रख रहे हैं[a]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “हम अपने खेत, दाख की बारियाँ और घर जमानत के रूप में दे रहे हैं।” इब्रानी क्रिया ऋण के बदले संपत्ति को जमानत के रूप में रखने का भाव देती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֵשׁ אֲשֶׁר אֹמְרִים
  choice: और कुछ लोग कह रहे थे
  rationale: यह इब्रानी मुहावरा शिकायत करने वाले एक और समूह का परिचय देता है। अपूर्णकालिक संदर्भ में ‘कह रहे थे’ स्वाभाविक है और सहभागी रूप की निरंतरता भी व्यक्त करता है।
- source_word: שְׂדֹתֵינוּ וּכְרָמֵינוּ וּבָתֵּינוּ
  choice: अपने खेत, दाख की बारियाँ और घर
  rationale: ये संपत्ति के ठोस और सीधे शब्द हैं। ‘दाख की बारियाँ’ כְּרָמִים का स्पष्ट आधुनिक हिन्दी रूप है।
- source_word: אֲנַחְנוּ עֹרְבִים
  choice: गिरवी रख रहे हैं
  rationale: यहाँ ערב का सहभागी रूप ऋण अथवा उधार के लिए संपत्ति को जमानत के रूप में रखने को दर्शाता है। ‘गिरवी रखना’ आधुनिक हिन्दी में इस आर्थिक आशय को स्पष्ट और सहज ढंग से व्यक्त करता है।
- source_word: וְנִקְחָה
  choice: पाने के लिए
  rationale: इस प्रसंग में यह रूप संपत्ति गिरवी रखने का उद्देश्य बताता है। मूल क्रिया ‘लेना/पाना’ है; इसलिए अनाज ‘खरीदने’ का अर्थ अनावश्यक रूप से नहीं जोड़ा गया।
- source_word: דָגָן
  choice: अनाज
  rationale: דָּגָן का अर्थ अन्न अथवा खाद्यान्न है; ‘अनाज’ सटीक और सर्वसुलभ आधुनिक हिन्दी शब्द है।
- source_word: בָּרָעָב
  choice: अकाल के समय
  rationale: यह वाक्यांश उस परिस्थिति को दर्शाता है जिसमें अनाज की आवश्यकता थी। ‘अकाल के समय’ कारण को आवश्यकता से अधिक निश्चित किए बिना स्थितिगत अर्थ बनाए रखता है।
