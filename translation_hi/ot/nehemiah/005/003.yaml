translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, सहज किंतु गरिमापूर्ण रखी गई है। ‘गिरवी रख रहे हैं’ आर्थिक संकट को सामान्य पाठक के लिए स्पष्ट करता है, जबकि पाद-टिप्पणी मूल क्रिया के व्यापक ‘जमानत’ संबंधी अर्थ को सुरक्षित रखती है।
