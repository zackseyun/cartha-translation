base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/005/013.yaml
  text: I also shook out the fold of my garment and said[a], “So may God shake out every man who does not fulfill this promise, from his house and from his labor; so may he be shaken out and emptied.” And all the assembly said, “Amen,” and praised Yahweh[c][b]. And the people did according to this promise.
translation:
  language: hi
  text: मैंने अपने वस्त्र की झोली भी झाड़ दी[a] और कहा, “जो कोई इस वचन को पूरा न करे, परमेश्वर उसे इसी तरह उसके घर और उसकी मेहनत की कमाई से झाड़कर निकाल दे[b]; वह इसी तरह झाड़ा जाए और खाली हो जाए।” तब सारी सभा ने कहा, “आमीन,” और याहवे[c] की स्तुति की। फिर लोगों ने इस वचन के अनुसार किया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “वस्त्र की झोली” से आशय वस्त्र के आगे के उस मोड़ से है जिसमें सामान रखा जा सकता था। इसे झाड़ना सब कुछ छिन जाने का प्रतीक था।
    reason: lexical_alternative
  - marker: b
    text: “मेहनत की कमाई” का अनुवाद “मेहनत” या “मेहनत का फल” भी हो सकता है।
    reason: lexical_alternative
  - marker: c
    text: इब्रानी में परमेश्वर का व्यक्तिगत नाम יהוה (YHWH) है; इसका उच्चारण प्रायः “याहवे” माना जाता है।
    reason: textual_cultural_clarification
lexical_decisions:
- source_word: חָצְנִי
  choice: अपने वस्त्र की झोली
  rationale: חָצֶן वस्त्र के उस आगे के मोड़ या झोली को दर्शाता है जिसमें वस्तुएँ रखी जा सकती थीं। यह रूप नहेमायाह की प्रतीकात्मक क्रिया को ठोस और सहज हिंदी में व्यक्त करता है।
- source_word: נָעַרְתִּי / יְנַעֵר / נָעוּר
  choice: झाड़ दी / झाड़कर निकाल दे / झाड़ा जाए
  rationale: एक ही धातु की पुनरावृत्ति प्रतीकात्मक क्रिया और शाप के बीच शब्द-संबंध बनाती है। हिंदी में ‘झाड़ना’ वस्त्र को खाली करने की छवि को बनाए रखता है; ‘निकाल दे’ व्यक्ति के घर और उपार्जन से वंचित किए जाने का आशय स्पष्ट करता है।
- source_word: כָּכָה
  choice: इसी तरह
  rationale: यह नहेमायाह की दिखाई हुई क्रिया की ओर संकेत करते हुए शाप की कामनात्मक शक्ति को संदर्भ में व्यक्त करता है।
- source_word: הָאֱלֹהִים
  choice: परमेश्वर
  rationale: यहाँ पद इस्राएल के परमेश्वर का सामान्य उल्लेख है; आधुनिक हिंदी बाइबलीय प्रयोग में ‘परमेश्वर’ स्वाभाविक और गरिमापूर्ण है।
- source_word: כָּל הָאִישׁ
  choice: जो कोई
  rationale: इब्रानी का पुल्लिंग एकवचन प्रतिनिधिक और सार्वत्रिक अर्थ रखता है। ‘जो कोई’ उसके व्याप्त अर्थ को स्वाभाविक हिंदी में देता है, बिना किसी संभावित दोषी को सीमित किए।
- source_word: יָקִים אֶת הַדָּבָר הַזֶּה
  choice: इस वचन को पूरा करे
  rationale: הקים דבר का अर्थ कही या प्रतिज्ञात बात को स्थापित अथवा कार्यान्वित करना है। पिछले पदों की शपथ-सदृश प्रतिज्ञा के संदर्भ में ‘पूरा करना’ स्पष्ट है, जबकि ‘वचन’ דָּבָר की पुनरावृत्ति को बनाए रखता है।
- source_word: מִבֵּיתוֹ וּמִיגִיעוֹ
  choice: उसके घर और उसकी मेहनत की कमाई से
  rationale: יְגִיעַ मेहनत या मेहनत से प्राप्त फल दोनों को सूचित कर सकता है। इस शाप में संपत्ति से वंचित होने की छवि के कारण ‘मेहनत की कमाई’ संदर्भानुकूल है, और पादटिप्पणी वास्तविक वैकल्पिक अर्थ सुरक्षित रखती है।
- source_word: וָרֵק
  choice: खाली हो जाए
  rationale: רֵק यहाँ झाड़कर खाली किए गए वस्त्र की छवि को व्यक्ति की संपत्तिहीन दशा पर लागू करता है। शाब्दिक छवि और शाप का परिणाम दोनों सुरक्षित रहते हैं।
- source_word: הַקָּהָל
  choice: सारी सभा
  rationale: קָהָל एकत्र समुदाय को दर्शाता है। ‘सभा’ आधुनिक हिंदी में स्वाभाविक है और अनावश्यक सांप्रदायिक अर्थ नहीं जोड़ता।
- source_word: יְהוָה
  choice: यहोवा
  rationale: व्यक्तिगत दिव्य नाम को किसी उपाधि से बदलने के बजाय प्रचलित हिंदी लिप्यंतरण ‘यहोवा’ द्वारा रखा गया है।
- source_word: כַדָּבָר הַזֶּה
  choice: इस वचन के अनुसार
  rationale: यह उसी प्रतिज्ञात बात की ओर लौटता है। ‘वचन’ मूल के דָּבָר को औपचारिक रूप से सुरक्षित रखता है और हिंदी में संदर्भ से अर्थ स्पष्ट रहता है।
theological_decisions:
- issue: दिव्य नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: मूल पाठ व्यक्तिगत दिव्य नाम का प्रयोग करता है। हिंदी पाठकों के लिए परिचित लिप्यंतरण ‘यहोवा’ नाम को नाम के रूप में सुरक्षित रखता है; पादटिप्पणी ‘याहवे’ को अधिक प्रत्यक्ष वैकल्पिक उच्चारण के रूप में देती है।
- issue: כָּל הָאִישׁ का प्रतिनिधिक पुल्लिंग
  choice: जो कोई
  alternative: हर पुरुष; हर व्यक्ति
  rationale: यह अभिव्यक्ति व्याकरणतः पुल्लिंग एकवचन है, पर शाप का लक्ष्य प्रतिज्ञा न निभाने वाला प्रत्येक व्यक्ति है। ‘जो कोई’ लिंग संबंधी ऐसी विशिष्टता नहीं थोपता जिसे प्रसंग निर्णायक रूप से आवश्यक नहीं बनाता।
- issue: शाप की कामनात्मक भाषा
  choice: परमेश्वर उसे...झाड़कर निकाल दे
  alternative: परमेश्वर उसे...झाड़कर निकाल देगा
  rationale: इब्रानी अपूर्ण क्रिया यहाँ प्रतीकात्मक शपथ-शाप में कामनात्मक अर्थ रखती है; हिंदी में ‘दे’ उस अर्थ को सुरक्षित रखता है, न कि इसे सीधी भविष्यवाणी बना देता है।
