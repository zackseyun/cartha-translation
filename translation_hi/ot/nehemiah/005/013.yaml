  register: भाषा आधुनिक, गरिमापूर्ण और मौखिक पाठ के अनुकूल रखी गई है। ‘झाड़’ की पुनरावृत्ति मूल के शब्दालंकार और नहेमायाह की प्रतीकात्मक क्रिया को सुरक्षित रखती है। ‘वचन’ दोनों स्थानों पर דָּבָר के संबंध को बनाए रखता है। सभी पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित हैं।
