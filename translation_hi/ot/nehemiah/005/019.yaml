  text: זָכְרָ/ה לִּ֥/י אֱלֹהַ֖/י לְ/טוֹבָ֑ה כֹּ֥ל אֲשֶׁר עָשִׂ֖יתִי עַל הָ/עָ֥ם הַ/זֶּֽה־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/005/019.yaml
  text: Remember me[a], my God, for good, for all that I have done for this people.
translation:
  language: hi
  text: हे मेरे परमेश्वर, इस प्रजा के लिए मैंने जो कुछ किया है, उसके लिए मुझे अनुकूल दृष्टि से स्मरण कर।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या: “मुझे भलाई के लिए स्मरण कर।”'
    reason: lexical_alternative
lexical_decisions:
- source_word: זָכְרָה לִּי
  choice: मुझे ... स्मरण रख
  rationale: זכר के प्रार्थनापरक आग्रह और उसके साथ आए לִי को स्वाभाविक आधुनिक हिन्दी में परमेश्वर से स्वयं को याद रखने की विनती के रूप में व्यक्त किया गया है।
- source_word: אֱלֹהַי
  choice: हे मेरे परमेश्वर
  rationale: प्रथम पुरुष एकवचन प्रत्यय और प्रत्यक्ष संबोधन दोनों को स्पष्ट तथा गरिमापूर्ण हिन्दी में सुरक्षित रखता है।
- source_word: לְטוֹבָה
  choice: भलाई के लिए
  rationale: यह हिब्रू पद हितकारी अथवा अनुकूल स्मरण का भाव रखता है; अपेक्षाकृत शाब्दिक अभिव्यक्ति मूल की अर्थगत खुलावट को बनाए रखती है।
- source_word: כֹּל אֲשֶׁר עָשִׂיתִי
  choice: मैंने जो कुछ किया है
  rationale: समग्रता और वर्तमान प्रार्थना की दृष्टि से पीछे मुड़कर देखे गए कार्य, दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: עַל הָעָם הַזֶּה
  choice: इस प्रजा के लिए
  rationale: עַל यहाँ लोगों के हित या उनकी ओर से किए गए कार्य का भाव देता है; 'के लिए' संक्षिप्त और सहज है, जबकि 'इस प्रजा' सामूहिक एकवचन को बनाए रखता है।
theological_decisions:
- issue: नहेमायाह की स्मरण-विनती का स्वरूप
  choice: अपने कार्यों के कारण परमेश्वर से हितकारी स्मरण की विनती
  alternative: सार्वजनिक दोषमुक्ति की माँग या परमेश्वर के सामने पुण्य का दावा
  rationale: पाठ कर्मों का उल्लेख करते हुए अनुकूल दैवी स्मरण माँगता है, पर यह स्वयं स्पष्ट नहीं करता कि वह प्रतिफल, दोषमुक्ति या अर्जित पुण्य में से किस धार्मिक अवधारणा को सामने रखता है; अनुवाद इस तनाव को खुला रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में प्रार्थनापरक, गरिमापूर्ण शैली। 'हे मेरे परमेश्वर' प्रत्यक्ष संबोधन को स्पष्ट करता है; 'स्मरण रख' सामान्य 'याद रख' से कुछ अधिक औपचारिक है, पर साधारण पाठक के लिए बोधगम्य है।
