  text: וַ/יִּמָּלֵ֨ךְ לִבִּ֜/י עָלַ֗/י וָ/אָרִ֨יבָ/ה֙ אֶת הַ/חֹרִ֣ים וְ/אֶת הַ/סְּגָנִ֔ים וָ/אֹמְרָ֣/ה לָ/הֶ֔ם מַשָּׁ֥א אִישׁ בְּ/אָחִ֖י/ו אַתֶּ֣ם נשאים וָ/אֶתֵּ֥ן עֲלֵי/הֶ֖ם קְהִלָּ֥ה גְדוֹלָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/005/007.yaml
  text: Then I took counsel with myself[a], and I brought charges against the nobles and the officials, and I said to them, “You are exacting interest[c][b], each from his brother.” And I assembled a great assembly against them.
translation:
  language: hi
  text: तब मैंने अपने मन में विचार किया[a] और कुलीनों और अधिकारियों के विरुद्ध आरोप लगाए[b]। मैंने उनसे कहा, “तुममें से हर एक अपने भाई से ब्याज ले रहा है[c]।” फिर मैंने उनके विरुद्ध एक बड़ी सभा बुलाई[d]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मैंने अपने आप से सलाह की।” इब्रानी मुहावरा भीतर ही भीतर सोच-विचार करने का भाव व्यक्त करता है।
    reason: idiom_clarification
  - marker: b
    text: या, “मैं कुलीनों और अधिकारियों से विवाद किया।” इब्रानी क्रिया में आरोप लगाने अथवा विवाद करने—दोनों का भाव हो सकता है।
    reason: lexical_alternative
  - marker: c
    text: या, “तुममें से हर एक अपने भाई पर ऋण का बोझ डाल रहा है।” ‘भाई’ से यहाँ साथी इस्राएली अभिप्रेत है।
    reason: lexical_alternative
  - marker: d
    text: शब्दशः, “मैंने उनके विरुद्ध एक बड़ी सभा रखी/खड़ी की”; अर्थात उनके मामले पर सार्वजनिक सभा बुलाई।
    reason: idiom_clarification
lexical_decisions:
- source_word: וַיִּמָּלֵךְ לִבִּי עָלַי
  choice: मैंने अपने मन में विचार किया
  rationale: यह इब्रानी मुहावरा नहेमायाह के भीतर सोच-विचार करने को व्यक्त करता है। हिंदी में यह स्वाभाविक है और ‘मेरे हृदय ने मुझ पर परामर्श किया’ जैसे असहज शब्दशः रूप से बचता है।
- source_word: וָאָרִיבָה
  choice: आरोप लगाया
  rationale: ריב में विवाद करने के साथ किसी के विरुद्ध मामला या अभियोग उठाने का भाव हो सकता है। इस सार्वजनिक और लगभग न्यायिक प्रसंग में ‘आरोप लगाया’ उपयुक्त है।
- source_word: הַחֹרִים
  choice: कुलीनों
  rationale: यह यहूदा के उच्च सामाजिक वर्ग के लोगों को सूचित करता है; ‘कुलीन’ आधुनिक मानक हिंदी में स्पष्ट और गरिमापूर्ण है।
- source_word: הַסְּגָנִים
  choice: अधिकारियों
  rationale: यह अधीनस्थ शासकीय पदाधिकारियों का व्यापक पदनाम है; ‘अधिकारी’ किसी अनिश्चित प्रशासनिक पद को आवश्यकता से अधिक विशिष्ट नहीं बनाता।
- source_word: מַשָּׁא ... נשאים
  choice: ब्याज वसूल रहा है
  rationale: आर्थिक प्रसंग में מַשָּׁא उधार पर डाले गए भार, सामान्यतः ब्याज, को दर्शाता है और נשׂא उसके वसूलने या थोपने की क्रिया व्यक्त करता है।
- source_word: אִישׁ בְּאָחִיו
  choice: तुममें से हर एक अपने भाई से
  rationale: אישׁ का वितरणात्मक बल ‘हर एक’ से और אחיו का वास्तविक सामाजिक-वाचा संबंधी निकटता का भाव ‘अपने भाई’ से सुरक्षित रहता है।
- source_word: וָאֶתֵּן עֲלֵיהֶם קְהִלָּה גְדוֹלָה
  choice: मैंने उनके विरुद्ध एक बड़ी सभा बुलाई
  rationale: शब्दशः ‘मैंने उनके विरुद्ध एक बड़ी सभा रखी/दी’ एक इब्रानी मुहावरा है, जिसका स्वाभाविक हिंदी अर्थ सार्वजनिक सभा बुलाना है; ‘विरुद्ध’ עֲלֵיהֶם की विरोधात्मक दिशा बनाए रखता है।
theological_decisions:
- issue: ‘भाई’ की वाचागत और सामुदायिक भाषा
  choice: अपने भाई
  alternative: अपने साथी/स्वजातीय से
  rationale: मूल पाठ की पारिवारिक भाषा को बनाए रखने से सह-इस्राएलियों के बीच शोषण की नैतिक गंभीरता बनी रहती है, बिना उसका अर्थ किसी संप्रदायगत ढाँचे में सीमित किए।
- issue: מַשָּׁא का आर्थिक आशय
  choice: ब्याज
  alternative: ऋण का बोझ
  rationale: प्रसंग ब्याज वसूलने की ओर संकेत करता है, पर मूल संज्ञा में ‘भार’ का व्यापक भाव भी संभव है; इसलिए वैकल्पिक अर्थ पादटिप्पणी में रखा गया है।
translation_notes:
  register: भाषा आधुनिक मानक हिंदी की, सहज किंतु गरिमापूर्ण रखी गई है। ‘कुलीन’, ‘अधिकारी’, ‘आरोप’ और ‘सभा’ सार्वजनिक-न्यायिक प्रसंग के अनुकूल हैं। वाक्य-विन्यास को हिंदी में स्वाभाविक बनाया गया है, जबकि ‘अपने भाई’ और ‘उनके विरुद्ध’ जैसे मूल पाठ के महत्त्वपूर्ण संबंधसूचक तत्व सुरक्षित रखे गए हैं।
