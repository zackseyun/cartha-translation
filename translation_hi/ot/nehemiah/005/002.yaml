  text: और कुछ लोग यह कह रहे थे[क], “हमारे बहुत-से बेटे-बेटियाँ हैं। हम अनाज लें, ताकि हम खा सकें और जीवित रह सकें।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: क
    text: 'इब्रानी में अधिक शाब्दिक रूप से: “हम—हमारे बेटे और हमारी बेटियाँ—बहुत हैं।” इब्रानी वाक्य परिवार के सदस्यों और ‘हम’ को संक्षिप्त रूप से साथ रखता है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֵשׁ אֲשֶׁר אֹמְרִים
  choice: और कुछ लोग कह रहे थे
  rationale: यह इब्रानी मुहावरा शिकायत करनेवालों के बीच एक अलग समूह का परिचय देता है। ‘कुछ लोग’ अस्तित्ववाचक रचना का स्वाभाविक हिन्दी रूप है, और अपूर्ण कृदन्त ‘कह रहे थे’ चल रही शिकायत के प्रसंग को व्यक्त करता है।
- source_word: בָּנֵינוּ וּבְנֹתֵינוּ אֲנַחְנוּ רַבִּים
  choice: हम, हमारे बेटे और हमारी बेटियाँ बहुत हैं
  rationale: इब्रानी की संक्षिप्त, समनाधिकरणात्मक रचना तथा स्पष्ट אֲנַחְנוּ (‘हम’) को बनाए रखा गया है। यह केवल ‘हमारे बहुत-से बेटे-बेटियाँ हैं’ कहने की अपेक्षा पूरे परिवार-समूह पर बल को अधिक निकटता से दर्शाता है।
- source_word: וְנִקְחָה
  choice: इसलिए हमें ... लेने दो
  rationale: प्रथम पुरुष बहुवचन cohortative आग्रह अथवा संकल्प प्रकट करता है। प्रसंग में अन्न पाने की आवश्यकता है; ‘हमें लेने दो’ उसके निवेदनात्मक बल को स्वाभाविक हिन्दी में रखता है।
- source_word: דָגָן
  choice: अनाज
  rationale: यह शब्द सामान्य भोजन नहीं, बल्कि धान्य/अन्न-उपज को सूचित करता है। आधुनिक हिन्दी में ‘अनाज’ स्पष्ट और सहज समतुल्य है।
- source_word: וְנֹאכְלָה וְנִחְיֶה
  choice: ताकि हम खाएँ और जीवित रहें
  rationale: 'क्रमिक cohortative रूप यहाँ उद्देश्य और परिणाम बताते हैं: अनाज प्राप्त करना ताकि परिवार खा सके और जीवित रहे। दोनों क्रियाओं को अलग रखा गया है।'
