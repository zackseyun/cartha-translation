translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। संवाद में ‘जैसा…वैसा ही’ सहमति की दृढ़ता व्यक्त करता है। अंतिम सर्वनाम को ‘उन लोगों’ किया गया है ताकि हिंदी में वह याजकों का भ्रामक संदर्भ न बने, जबकि उसका आशय पहले बोलने वाले अगुओं और अधिकारियों से है।
