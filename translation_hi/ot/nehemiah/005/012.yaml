  text: וַ/יֹּאמְר֣וּ נָשִׁ֗יב וּ/מֵ/הֶם֙ לֹ֣א נְבַקֵּ֔שׁ כֵּ֣ן נַעֲשֶׂ֔ה כַּ/אֲשֶׁ֖ר אַתָּ֣ה אוֹמֵ֑ר וָ/אֶקְרָא֙ אֶת הַ/כֹּ֣הֲנִ֔ים וָֽ/אַשְׁבִּיעֵ֔/ם לַ/עֲשׂ֖וֹת כַּ/דָּבָ֥ר הַ/זֶּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/005/012.yaml
  text: And they said[a], “We will restore it, and from them we will require nothing; we will do as you say.” Then I called the priests and made them swear to do according to this word.
translation:
  language: hi
  text: उन्होंने कहा, “हम लौटा देंगे और उनसे कुछ भी नहीं माँगेंगे। जैसा आप कहते हैं, हम वैसा ही करेंगे।” तब मैंने याजकों को बुलाया और उन लोगों को शपथ दिलाई कि वे इस बात[a] के अनुसार करें।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “इस वचन के अनुसार।” इब्रानी शब्द דָּבָר का अर्थ “बात,” “वचन” या प्रसंग में शपथ से पक्की की गई प्रतिबद्धता हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: נָשִׁיב
  choice: हम लौटा देंगे
  rationale: שׁוב के हिफ़ील रूप का यहाँ अर्थ ली गई या रोकी गई संपत्ति वापस करना है। मूल में कर्म निहित है और पिछले पद से समझ में आता है, इसलिए हिंदी में भी उसे अलग से नहीं जोड़ा गया।
- source_word: וּמֵהֶם לֹא נְבַקֵּשׁ
  choice: और उनसे कुछ भी नहीं माँगेंगे
  rationale: בקש आर्थिक और कानूनी प्रसंग में किसी दावे या भुगतान की माँग करने का भाव रखता है। यह अनुवाद उस दावे को छोड़ने की बात स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: כֵּן נַעֲשֶׂה כַּאֲשֶׁר אַתָּה אוֹמֵר
  choice: जैसा आप कहते हैं, हम वैसा ही करेंगे
  rationale: כֵּן और כַּאֲשֶׁר की अनुरूपता को ‘जैसा…वैसा ही’ से स्पष्ट और स्वाभाविक रूप में रखा गया है।
- source_word: וָאֶקְרָא אֶת־הַכֹּהֲנִים
  choice: तब मैंने याजकों को बुलाया
  rationale: קרא का यहाँ अर्थ बुलाना है, और आरंभिक वाव कथाक्रम में अगले कदम को सूचित करता है।
- source_word: וָאַשְׁבִּיעֵם
  choice: उन लोगों को शपथ दिलाई
  rationale: שׁבע के हिफ़ील रूप का अर्थ किसी से शपथ करवाना है। ‘उन लोगों’ का सबसे स्वाभाविक संदर्भ अभी बोलने वाले अगुओं और अधिकारियों से है, न कि याजकों से।
- source_word: לַעֲשׂוֹת כַּדָּבָר הַזֶּה
  choice: कि वे इस बात के अनुसार करें
  rationale: דָּבָר का सामान्य अर्थ ‘बात’ या ‘वचन’ हो सकता है; यहाँ यह अभी की गई सार्वजनिक प्रतिज्ञा की ओर संकेत करता है। ‘बात’ मूल की अर्थगत व्यापकता को बनाए रखता है।
