  text: ו/יאמר לֹא ט֥וֹב הַ/דָּבָ֖ר אֲשֶׁר אַתֶּ֣ם עֹשִׂ֑ים הֲ/ל֞וֹא בְּ/יִרְאַ֤ת אֱלֹהֵ֨י/נוּ֙ תֵּלֵ֔כוּ מֵ/חֶרְפַּ֖ת הַ/גּוֹיִ֥ם אוֹיְבֵֽי/נוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/005/009.yaml
  text: So I said[a], “What you are doing is not good. Should you not walk in the fear of our God because of the reproach of the nations, our enemies?”
translation:
  language: hi
  text: तब मैंने कहा, “जो कुछ तुम कर रहे हो, वह अच्छा नहीं है। क्या तुम्हें हमारे परमेश्वर के भय में नहीं चलना चाहिए, ताकि उन राष्ट्रों की निन्दा न हो जो हमारे शत्रु हैं?[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “हमारे शत्रु राष्ट्रों की निन्दा के कारण।” इब्रानी पूर्वसर्ग यहाँ कारण अथवा अभिप्रेत परिहार—दोनों अर्थ दे सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: तब मैंने कहा
  rationale: वाव-क्रम कथा को आगे बढ़ाता है; ‘तब’ आधुनिक हिन्दी में स्वाभाविक रूप से क्रमसूचक बल व्यक्त करता है।
- source_word: לֹא טוֹב
  choice: अच्छा नहीं है
  rationale: इब्रानी मूल्यांकन को सीधे रखता है और नैतिक बल को अनावश्यक व्याख्या के बिना सुरक्षित रखता है।
- source_word: הַדָּבָר אֲשֶׁר אַתֶּם עֹשִׂים
  choice: जो कुछ तुम कर रहे हो
  rationale: इब्रानी संज्ञात्मक अभिव्यक्ति का स्वाभाविक हिन्दी रूप, जो उनके वर्तमान आचरण की ओर सीधे संकेत करता है।
- source_word: הֲלוֹא
  choice: क्या तुम्हें ... नहीं ... चाहिए
  rationale: अलंकारिक प्रश्न और नैतिक आग्रह—दोनों को स्पष्ट तथा स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: בְּיִרְאַת אֱלֹהֵינוּ
  choice: हमारे परमेश्वर के भय में
  rationale: יִרְאָה के वाचाई और नैतिक भार को बनाए रखता है; ‘भय’ बाइबलीय पदावली को ‘श्रद्धा’ जैसे व्याख्यात्मक विकल्प की अपेक्षा अधिक निकटता से सुरक्षित रखता है।
- source_word: תֵּלֵכוּ
  choice: चलना
  rationale: आचरण के लिए प्रयुक्त इब्रानी नैतिक रूपक को बनाए रखता है; यह हिन्दी बाइबलीय भाषा में समझने योग्य है।
- source_word: מֵחֶרְפַּת
  choice: ताकि ... निन्दा न करें
  rationale: सन्दर्भ में מִן को अभिप्रेत परिहार के अर्थ में समझते हुए स्वाभाविक हिन्दी दी गई है; कारणसूचक अर्थ भी सम्भव है और उसे पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: הַגּוֹיִם אֹיְבֵינוּ
  choice: हमारे शत्रु राष्ट्र
  rationale: גּוֹיִם को पुराने नियम के प्रसंगानुकूल ‘राष्ट्र’ और appositional אֹיְבֵינוּ को स्वाभाविक हिन्दी विशेषण-विन्यास में व्यक्त करता है।
theological_decisions:
- issue: वाचाई नैतिक आचरण के लिए הלך का रूपक
  choice: ‘चलना’ रूपक को बनाए रखा
  alternative: ‘जीवन बिताना’ या ‘आचरण करना’
  rationale: यह परमेश्वर के प्रति भययुक्त, निष्ठावान आचरण का बाइबलीय रूपक सुरक्षित रखता है, जबकि हिन्दी में अर्थ ग्रहणीय रहता है।
- issue: מֵחֶרְפַּת में कारण अथवा अभिप्रेत परिहार
  choice: 'मुख्य पाठ में अभिप्रेत परिहार: ‘ताकि ... निन्दा न करें’'
  alternative: ‘हमारे शत्रु राष्ट्रों की निन्दा के कारण’
  rationale: दोनों व्याकरणतः सम्भव हैं। प्रसंग में सही आचरण द्वारा शत्रु राष्ट्रों की निन्दा का अवसर रोकना स्वाभाविक है, पर वास्तविक अस्पष्टता पादटिप्पणी में स्पष्ट की गई है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य हिन्दी। ‘परमेश्वर के भय में चलना’ मूल इब्रानी रूपक और धार्मिक तनाव को सुरक्षित रखता है; पादटिप्पणी מִן की वास्तविक अर्थगत अस्पष्टता बताती है।
