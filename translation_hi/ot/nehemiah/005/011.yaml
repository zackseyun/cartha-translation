source:
  edition: WLC
  text: הָשִׁיבוּ֩ נָ֨א לָ/הֶ֜ם כְּ/הַ/יּ֗וֹם שְׂדֹתֵי/הֶ֛ם כַּרְמֵי/הֶ֥ם זֵיתֵי/הֶ֖ם וּ/בָתֵּי/הֶ֑ם וּ/מְאַ֨ת הַ/כֶּ֤סֶף וְ/הַ/דָּגָן֙ הַ/תִּיר֣וֹשׁ וְ/הַ/יִּצְהָ֔ר אֲשֶׁ֥ר אַתֶּ֖ם נֹשִׁ֥ים בָּ/הֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/005/011.yaml
  text: Please restore to them this very day their fields[a], their vineyards, their olive orchards, and their houses, and the hundredth part of the money, the grain, the new wine[b], and the oil that you have been exacting from them.
translation:
  language: hi
  text: कृपया आज ही उनके खेत, दाख की बारियाँ, जैतून के बाग और घर उन्हें लौटा दो; और धन, अनाज, नए दाखरस और तेल का वह सौवाँ भाग भी लौटा दो, जो तुम उनसे वसूल कर रहे हो।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “सौवाँ भाग” का अर्थ “एक प्रतिशत” भी हो सकता है—अर्थात धन, अनाज, नए दाखरस और तेल का वह हिस्सा जो उनसे लिया जा रहा था। अंतिम वाक्यांश का अनुवाद “जो तुम उन पर लगा रहे हो” या “जो तुम उन्हें ब्याज पर दे रहे हो” भी हो सकता है।
    reason: इब्रानी में “सौवाँ भाग” के वाक्यगत संबंध और נֹשִׁים के वित्तीय अर्थ में वास्तविक अस्पष्टता है।
lexical_decisions:
- source_word: הָשִׁיבוּ נָא
  choice: लौटा दो
  rationale: बहुवचन आज्ञार्थक रूप संपत्ति को उसके स्वामियों को वापस देने की माँग करता है। נָא आग्रह को कुछ नरम करता है; आधुनिक स्वाभाविक हिन्दी में प्रसंग की विनती और दृढ़ता 'लौटा दो' से व्यक्त होती है।
- source_word: כְּהַיּוֹם
  choice: आज ही
  rationale: तत्कालता और बल दोनों को संक्षिप्त, स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: שְׂדֹתֵיהֶם כַּרְמֵיהֶם זֵיתֵיהֶם וּבָתֵּיהֶם
  choice: उनके खेत, दाख की बारियाँ, जैतून के बाग और घर
  rationale: कृषि-संपत्ति और आवास की सूची को स्पष्ट तथा समानांतर रूप में रखा गया है।
- source_word: וּמְאַת
  choice: वह सौवाँ भाग
  rationale: इब्रानी का शाब्दिक अर्थ 'सौवाँ भाग' है। इसे 'एक प्रतिशत ब्याज' कहने से वित्तीय व्यवस्था जरूरत से अधिक निश्चित हो जाती।
- source_word: הַכֶּסֶף
  choice: रुपये
  rationale: כֶּסֶף का अर्थ चाँदी या धन हो सकता है; ऋण-संबंधी संदर्भ में 'रुपये' सामान्य आधुनिक हिन्दी में आर्थिक अर्थ स्पष्ट करता है।
- source_word: הַדָּגָן הַתִּירוֹשׁ וְהַיִּצְהָר
  choice: अनाज, नई दाखमधु और तेल
  rationale: कृषि-उपज की तीनfold सूची सुरक्षित रखी गई है; תִּירוֹשׁ के लिए 'नई दाखमधु' उसकी विशिष्टता बनाए रखता है।
- source_word: נֹשִׁים בָּהֶם
  choice: उनसे वसूल कर रहे हो
  rationale: लेनदार द्वारा लगाया या लिया जा रहा दायित्व व्यक्त होता है, पर इसे केवल ब्याज तक सीमित नहीं किया गया।
theological_decisions:
- issue: ऋण और आर्थिक शोषण के संदर्भ में נֹשִׁים का आशय
  choice: उनसे वसूल कर रहे हो
  alternative: उन पर ब्याज लगा रहे हो / उन्हें ब्याज पर उधार दे रहे हो
  rationale: प्रसंग दमनकारी ऋण-व्यवहार का है, लेकिन क्रिया का आशय व्यापक लेनदार-दावे या वसूली तक जा सकता है। चुना हुआ पाठ नैतिक बल बनाए रखते हुए तंत्र को अनावश्यक रूप से निश्चित नहीं करता।
- issue: מְאַת का वाक्यगत संबंध
  choice: सौवाँ भाग को रुपये और उपज से जोड़कर लौटाने की माँग
  alternative: मूल संपत्ति लौटाने के साथ अलग से एक प्रतिशत ब्याज छोड़ने की माँग
  rationale: इब्रानी में 'सौवाँ भाग' और उसके बाद की वस्तुओं का संबंध व्याख्यात्मक कठिनाई रखता है। मुख्य पाठ संभावित अर्थ देता है और पादटिप्पणी दूसरी समझ को सुरक्षित रखती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। 'दाखमधु' बाइबलीय कृषि-संदर्भ में मदिरा का स्पष्ट और सम्मानित रूप है; 'आज ही' आदेश की तत्कालता बनाए रखता है।
