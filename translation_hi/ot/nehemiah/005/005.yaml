source:
  edition: WLC
  text: וְ/עַתָּ֗ה כִּ/בְשַׂ֤ר אַחֵ֨י/נוּ֙ בְּשָׂרֵ֔/נוּ כִּ/בְנֵי/הֶ֖ם בָּנֵ֑י/נוּ וְ/הִנֵּ֣ה אֲנַ֣חְנוּ כֹ֠בְשִׁים אֶת בָּנֵ֨י/נוּ וְ/אֶת בְּנֹתֵ֜י/נוּ לַ/עֲבָדִ֗ים וְ/יֵ֨שׁ מִ/בְּנֹתֵ֤י/נוּ נִכְבָּשׁוֹת֙ וְ/אֵ֣ין לְ/אֵ֣ל יָדֵ֔/נוּ וּ/שְׂדֹתֵ֥י/נוּ וּ/כְרָמֵ֖י/נוּ לַ/אֲחֵרִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/005/005.yaml
  text: And now[a], our flesh is like the flesh of our brothers, our children like their children; yet here we are, forcing our sons and our daughters into slavery, and some of our daughters have already been enslaved. But it is not in our power to help[b], and our fields and our vineyards belong to others.
translation:
  language: hi
  text: और अब[a], हमारा शरीर हमारे भाइयों के शरीर जैसा ही है, और हमारे बच्चे उनके बच्चों जैसे ही हैं; फिर भी देखो, हम अपने बेटे-बेटियों को दासता में धकेल रहे हैं, और हमारी कुछ बेटियाँ पहले ही दासता में धकेली जा चुकी हैं। पर इसे रोकना हमारे वश में नहीं है[b], और हमारे खेत और अंगूर के बाग दूसरों के अधिकार में हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “हमारा मांस हमारे भाइयों के मांस जैसा ही है।” इब्रानी में साझा ‘मांस’ का ठोस बिंब समान मानवता और पारिवारिक-सामुदायिक नाते पर बल देता है।
    reason: lexical_alternative
  - marker: b
    text: 'शाब्दिक अर्थ: “हमारे हाथ में सामर्थ्य नहीं है।” यह मुहावरा उनके पास साधन या शक्ति न होने को व्यक्त करता है; उनके खेत और अंगूर के बाग दूसरों के अधिकार में हैं।'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּבְשַׂר אַחֵינוּ בְּשָׂרֵנוּ
  choice: हमारा शरीर हमारे भाइयों के शरीर जैसा ही है
  rationale: בָּשָׂר का ठोस अर्थ ‘मांस/शरीर’ है, पर यहाँ यह समान मानवता और रक्त-सामुदायिक संबंध को व्यक्त करता है। ‘शरीर’ हिन्दी में मूल बिंब को स्वाभाविक ढंग से बनाए रखता है।
- source_word: אַחֵינוּ
  choice: हमारे भाइयों
  rationale: इब्रानी शब्द का सीधा अर्थ ‘हमारे भाई’ है; प्रसंग में यह अपने ही समुदाय के लोगों की ओर संकेत करता है, पर मूल संबंध-सूचक भाषा सुरक्षित रखी गई है।
- source_word: כִּבְנֵיהֶם בָּנֵינוּ
  choice: हमारे बच्चे उनके बच्चों जैसे ही हैं
  rationale: בנים यहाँ सामूहिक अर्थ में ‘बच्चे’ हो सकता है; आगे बेटे और बेटियाँ अलग-अलग कहे गए हैं, इसलिए तुलना में ‘बच्चे’ अधिक उपयुक्त है।
- source_word: כֹבְשִׁים ... לַעֲבָדִים
  choice: दास बनने के लिए विवश कर रहे हैं
  rationale: כבשׁ अधीन करने का भाव रखता है और לַעֲבָדִים परिणामतः दास-दशा बताता है। यह अनुवाद ऋण-दासता की बाध्यता को बिना नरम किए स्पष्ट करता है।
- source_word: מִבְּנֹתֵינוּ נִכְבָּשׁוֹת
  choice: हमारी कुछ बेटियाँ पहले ही दास बना ली गई हैं
  rationale: निफ़अल कृदन्त बेटियों की वर्तमान निष्क्रिय दशा दर्शाता है—वे अधीन करके दासता में लाई जा चुकी हैं। ‘पहले ही’ शिकायत की तात्कालिकता स्पष्ट करता है।
- source_word: וְאֵין לְאֵל יָדֵנוּ
  choice: इसे रोकना हमारे वश में नहीं है
  rationale: शाब्दिक मुहावरा ‘हमारे हाथ में सामर्थ्य नहीं’ असमर्थता और साधनों के अभाव को बताता है। यहाँ אֵל को ‘सामर्थ्य’ माना गया है, परमेश्वर का नाम नहीं।
- source_word: וּשְׂדֹתֵינוּ וּכְרָמֵינוּ לַאֲחֵרִים
  choice: हमारे खेत और अंगूर के बाग दूसरों के अधिकार में हैं
  rationale: क्रियारहित उपवाक्य बताता है कि उनकी उत्पादक संपत्ति दूसरों के कब्ज़े या अधिकार में जा चुकी है; यही उनकी असमर्थता का कारण है।
theological_decisions:
- issue: सामाजिक न्याय की शिकायत में संबंध-सूचक भाषा
  choice: ‘भाइयों’ को बनाए रखना, लेकिन तुलना में בנים का अनुवाद ‘बच्चे’ करना
  alternative: ‘संबंधियों’ और ‘बच्चों’ जैसी पूर्णतः समावेशी भाषा, अथवा हर जगह ‘भाई’ और ‘बेटे’
  rationale: यह אַחֵינוּ के पुरुषवाची संबंध-सूचक रूप को सुरक्षित रखता है, जबकि तुलना में בנים के सामूहिक अर्थ को व्यक्त करता है; आगे मूल पाठ के अनुसार बेटों और बेटियों दोनों का स्पष्ट उल्लेख है।
- issue: दासता-संबंधी भाषा की तीव्रता
  choice: ‘दास बनने के लिए विवश’ और ‘दास बना ली गई’
  alternative: ‘सेवा में देना’, ‘अधीन करना’ या ‘बंधुआ सेवा’
  rationale: यहाँ ऋण के कारण बच्चों को बाध्य होकर दास-दशा में देना पड़ रहा है। इसलिए नरम ‘सेवा’ भाषा के बजाय मूल सामाजिक भयावहता को स्पष्ट रखा गया है।
- issue: אֵל का अर्थ
  choice: ‘सामर्थ्य/वश’ के अर्थ में लेना
  alternative: इसे ईश्वर-सूचक ‘परमेश्वर’ समझना
  rationale: पूरा मुहावरा יָדֵנוּ के साथ साधन या शक्ति के अभाव को व्यक्त करता है; इस प्रसंग में ईश्वर-सूचक अर्थ व्याकरण और आशय से कम उपयुक्त है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘शरीर’ मूल इब्रानी बिंब बचाता है; ‘दास’ ऋण-दासता की कठोर वास्तविकता को नरम नहीं करता। ‘अंगूर के बाग’ सामान्य ‘दाख की बारी’ की अपेक्षा अधिक वर्तमान और सहज है।
