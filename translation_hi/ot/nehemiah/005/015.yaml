source:
  edition: WLC
  text: וְ/הַ/פַּחוֹת֩ הָ/רִאשֹׁנִ֨ים אֲשֶׁר לְ/פָנַ֜/י הִכְבִּ֣ידוּ עַל הָ/עָ֗ם וַ/יִּקְח֨וּ מֵ/הֶ֜ם בְּ/לֶ֤חֶם וָ/יַ֨יִן֙ אַחַר֙ כֶּֽסֶף שְׁקָלִ֣ים אַרְבָּעִ֔ים גַּ֥ם נַעֲרֵי/הֶ֖ם שָׁלְט֣וּ עַל הָ/עָ֑ם וַ/אֲנִי֙ לֹא עָשִׂ֣יתִי כֵ֔ן מִ/פְּנֵ֖י יִרְאַ֥ת אֱלֹהִֽים־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/005/015.yaml
  text: But the former governors who were before me laid heavy burdens on the people[a], and took from them bread and wine, besides forty shekels of silver. Even their servants ruled over the people. But I did not do so[c][b], because of the fear of God.
translation:
  language: hi
  text: परन्तु मुझसे पहले जो राज्यपाल थे, उन्होंने लोगों पर भारी बोझ डाला और उनसे रोटी और दाखमधु के अलावा चाँदी के चालीस शेकेल भी लिए। यहाँ तक कि उनके सेवकों[a] ने भी लोगों पर अधिकार चलाया। लेकिन मैंने परमेश्वर के भय के कारण ऐसा नहीं किया।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “परिचारकों” अथवा “जवानों।” इब्रानी शब्द राज्यपालों के अधीन काम करने वाले अधिकारियों या सहायकों के लिए भी प्रयुक्त हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या “परमेश्वर के प्रति श्रद्धा के कारण।” इब्रानी में शाब्दिक रूप से “परमेश्वर के भय के कारण” है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הַפַּחוֹת הָרִאשֹׁנִים אֲשֶׁר לְפָנַי
  choice: मुझसे पहले जो राज्यपाल थे
  rationale: फ़ारसी प्रशासन के संदर्भ में פֶּחָה के लिए ‘राज्यपाल’ ऐतिहासिक रूप से उपयुक्त है; पूरा पदबंध नहेमायाह के पूर्ववर्ती पदाधिकारियों को स्वाभाविक हिन्दी में दर्शाता है।
- source_word: הִכְבִּידוּ עַל הָעָם
  choice: लोगों पर भारी बोझ डाला
  rationale: हिफ़ील क्रिया में ‘भारी करना’ का रूपक है; यह अत्यधिक आर्थिक माँग का संकेत देते हुए मूल बिंब को बनाए रखता है।
- source_word: וַיִּקְחוּ מֵהֶם בְּלֶחֶם וָיַיִן אַחַר כֶּסֶף שְׁקָלִים אַרְבָּעִים
  choice: उनसे रोटी और दाखमधु के अलावा चाँदी के चालीस शेकेल भी लिए
  rationale: אַחַר को यहाँ ‘के अलावा/भी’ समझना प्रसंगानुकूल है, अर्थात रोटी और दाखमधु के साथ अतिरिक्त मुद्रा-वसूली; वस्तुओं और माप को ठोस रूप में सुरक्षित रखा गया है।
- source_word: נַעֲרֵיהֶם
  choice: उनके सेवकों
  rationale: נַעַר का मूल अर्थ युवक हो सकता है, पर प्रशासनिक प्रसंग में यह अधीनस्थ सेवकों अथवा परिचारकों को सूचित करता है; ‘सेवक’ सहज है और विकल्प पादटिप्पणी में दिया गया है।
- source_word: שָׁלְטוּ עַל הָעָם
  choice: लोगों पर अधिकार चलाया
  rationale: यह प्रभुत्व अथवा सत्ता के प्रयोग का भाव व्यक्त करता है और प्रसंग में दमनकारी आचरण की तीव्रता को बिना अनावश्यक विस्तार के संप्रेषित करता है।
- source_word: וַאֲנִי לֹא עָשִׂיתִי כֵן
  choice: लेकिन मैंने ऐसा नहीं किया
  rationale: पूर्ववर्ती राज्यपालों के आचरण से नहेमायाह का सीधा विरोध सरल और मूलनिष्ठ ढंग से व्यक्त होता है।
- source_word: מִפְּנֵי יִרְאַת אֱלֹהִים
  choice: परमेश्वर के भय के कारण
  rationale: मूल संज्ञात्मक मुहावरे को बनाए रखता है और परमेश्वर के प्रति श्रद्धायुक्त भय तथा उत्तरदायित्व की धार्मिक गहराई को केवल ‘आदर’ तक सीमित नहीं करता।
theological_decisions:
- issue: יִרְאַת אֱלֹהִים का अर्थ
  choice: परमेश्वर के भय के कारण
  alternative: परमेश्वर के प्रति श्रद्धा के कारण; क्योंकि मैं परमेश्वर से डरता था
  rationale: शाब्दिक संज्ञात्मक अभिव्यक्ति को सुरक्षित रखने से श्रद्धा, भय और परमेश्वर के सामने नैतिक उत्तरदायित्व का तनाव बना रहता है; पादटिप्पणी स्पष्ट करती है कि इसे श्रद्धायुक्त भय के रूप में भी व्यक्त किया जा सकता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण और सहज शैली रखी गई है। ‘दाखमधु’ और ‘शेकेल’ जैसे बाइबलीय-ऐतिहासिक पद बनाए गए हैं। सभी पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित हैं।
