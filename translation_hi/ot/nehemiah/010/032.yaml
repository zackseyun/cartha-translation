base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/010/032.yaml
  text: As for the peoples of the land who bring goods and any grain on the Sabbath day to sell[a], we will not buy from them on the Sabbath or on a holy day; and we will forego the seventh year and every debt.
translation:
  language: hi
  text: यदि देशों के लोग सब्त के दिन बेचने के लिए सामान और हर प्रकार का अनाज लाएँ, तो हम उनसे सब्त या किसी पवित्र दिन कुछ नहीं खरीदेंगे। हम सातवें वर्ष को और हर ऋण की वसूली[a] को छोड़ देंगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘हर दावा’ अथवा ‘हर प्रकार की वसूली।’ इब्रानी पद का शाब्दिक अर्थ लगभग ‘हर हाथ का बोझ/दावा’ है।
    reason: מַשָּׂא כָל־יָד एक कठिन और संक्षिप्त इब्रानी पद है। संदर्भ में ऋण-वसूली संभावित अर्थ है, किंतु वैकल्पिक अर्थों को पाद-टिप्पणी में सुरक्षित रखा गया है।
lexical_decisions:
- source_word: עַמֵּי הָאָרֶץ
  choice: देश के लोग
  rationale: बहुवचन पद आसपास के गैर-यहूदी अथवा स्थानीय समुदायों को सामूहिक रूप से दर्शाता है। हिन्दी में ‘देश के लोग’ स्वाभाविक है और संदर्भ में इन्हें यहूदा की वाचा-बद्ध प्रजा के समान मानने की आवश्यकता नहीं पड़ती।
- source_word: הַמַּקָּחוֹת
  choice: सामान
  rationale: यह व्यापार के लिए लाई गई वस्तुओं या माल को दर्शाता है; ‘सामान’ सरल, व्यापक और आधुनिक हिन्दी है।
- source_word: וְכָל שֶׁבֶר
  choice: और किसी भी प्रकार का अनाज
  rationale: व्यापारिक संदर्भ में שֶׁבֶר मुख्यतः अनाज को दर्शाता है। כָל का बल ‘किसी भी प्रकार का’ से स्वाभाविक रूप में व्यक्त होता है।
- source_word: לֹא נִקַּח מֵהֶם
  choice: उनसे ... कुछ नहीं खरीदेंगे
  rationale: לקח का मूल अर्थ ‘लेना’ है, पर बेचने के लिए लाई गई वस्तुओं के बाजार-संदर्भ में आशय ‘खरीदना’ है।
- source_word: וּבְיוֹם קֹדֶשׁ
  choice: या किसी पवित्र दिन
  rationale: नकारात्मक निषेध के भीतर वाव का हिन्दी में स्वाभाविक संबंध ‘या’ है। अनिश्चित ‘किसी’ יום के अनिर्दिष्ट स्वरूप को स्पष्ट करता है।
- source_word: וְנִטֹּשׁ אֶת הַשָּׁנָה הַשְּׁבִיעִית
  choice: हम सातवें वर्ष में भूमि को परती छोड़ देंगे
  rationale: नָטַשׁ का भाव छोड़ देने या उपयोग न करने का है। सब्त-वर्ष की कृषि-संबंधी पृष्ठभूमि में हिन्दी को बोधगम्य बनाने के लिए निहित भूमि को स्पष्ट किया गया है, जबकि ‘सातवाँ वर्ष’ मूल शब्दावली के अनुरूप रखा गया है।
- source_word: מַשָּׁא כָל יָד
  choice: हर ऋण की वसूली
  rationale: यह संक्षिप्त और कठिन मुहावरा संभवतः सब्त-वर्ष में आर्थिक दावों या ऋण-वसूली को छोड़ने की ओर संकेत करता है। ‘हर ऋण की वसूली’ सम्भावित कानूनी-अर्थिक अर्थ देता है, और वास्तविक अस्पष्टता पाद-टिप्पणी में सुरक्षित है।
theological_decisions:
- issue: सातवें वर्ष के दायित्व का स्वरूप
  choice: कृषि-भूमि को परती छोड़ना और ऋण-वसूली छोड़ना—दोनों दायित्व व्यक्त किए गए हैं।
  alternative: ‘हम सातवें वर्ष और हर हाथ के भार/दावे को छोड़ देंगे।’
  rationale: वाक्य सब्त-वर्ष से संबंधित कृषि-विश्राम और आर्थिक मुक्ति की व्यवस्था की प्रतिध्वनि करता है। हिन्दी में निहित कृषि-संदर्भ स्पष्ट किया गया है, पर अंतिम इब्रानी मुहावरे की अनिश्चितता पाद-टिप्पणी में रखी गई है।
- issue: מַשָּׁא כָל יָד का कानूनी-अर्थिक अर्थ
  choice: हर ऋण की वसूली
  alternative: हर दावा; हर प्रकार की जबरन वसूली; शाब्दिक रूप से ‘हर हाथ का भार/उगाही’
  rationale: व्यवस्थाविवरण 15 के सब्त-वर्षीय ऋण-मोचन की पृष्ठभूमि में ऋण-वसूली सम्भावित अर्थ है, किंतु इब्रानी पद इतना संक्षिप्त है कि वैकल्पिक अर्थों को निर्णायक रूप से हटाना उचित नहीं।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘सब्त’ और ‘पवित्र दिन’ जैसे परिचित बाइबलीय पद बनाए गए हैं। कानूनी भाषा को अत्यधिक तकनीकी बनाए बिना वाचा-संबंधी प्रतिज्ञा का सामूहिक ‘हम’ सुरक्षित रखा गया है।
