base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/010/039.yaml
  text: And the priest[a], a son of Aaron, shall be with the Levites when the Levites collect the tithe, and the Levites shall bring up the tithe of the tithe to the house of our God[b], to the chambers of the storehouse.
translation:
  language: hi
  text: और जब लेवीय दशमांश इकट्ठा करें, तब हारून के वंश का एक याजक उनके साथ रहे। और लेवीय उस दशमांश का दशमांश[a] हमारे परमेश्वर के भवन में, भंडार-गृह[b] की कोठरियों में ले जाएँ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “दशमांश का दसवाँ भाग।” इब्रानी में शब्दशः “दशमांश का दशमांश” है; इसका अर्थ उस दशमांश में से वह भाग है जो लेवी स्वयं देते थे।
    reason: lexical_alternative
  - marker: b
    text: या, “कोषागार।” यहाँ संभवतः केवल धन रखने की जगह नहीं, बल्कि दशमांश और भेंटें रखने का भंडार अभिप्रेत है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: रहे
  rationale: वाचा-संबंधी नियम के प्रसंग में यह भावी दायित्व व्यक्त करता है; हिंदी में विधिसूचक ‘रहे’ स्वाभाविक और गरिमापूर्ण है।
- source_word: הַכֹּהֵן בֶּן־אַהֲרֹן
  choice: हारून के वंश का एक याजक
  rationale: इब्रानी पद याजक की हारूनी वंशावली बताता है। ‘वंश का’ आधुनिक पाठक के लिए स्वाभाविक है और किसी एक विशेष याजक की अनावश्यक पहचान नहीं कराता।
- source_word: עִם
  choice: उनके साथ
  rationale: यह दशमांश एकत्र करने के समय याजक की लेवियों के साथ उपस्थिति दर्शाता है।
- source_word: בַּעְשֵׂר הַלְוִיִּם
  choice: जब लेवीय दशमांश इकट्ठा करें
  rationale: क्रिया का रूप दशमांश लेने या एकत्र करने की प्रक्रिया बताता है; कालवाचक उपवाक्य हिंदी में अर्थ स्पष्ट करता है।
- source_word: יַעֲלוּ
  choice: ले जाएँ
  rationale: हिफ़ील रूप का अर्थ ‘ऊपर ले जाना/पहुँचाना’ है। गंतव्य परमेश्वर का भवन है; सहज हिंदी में ‘ले जाएँ’ गति और दायित्व दोनों व्यक्त करता है, जबकि संदर्भ मंदिर की ओर जाने का संकेत बनाए रखता है।
- source_word: מַעֲשַׂר הַמַּעֲשֵׂר
  choice: उस दशमांश का दशमांश
  rationale: इब्रानी की तकनीकी और पुनरुक्त संरचना सुरक्षित रहती है और स्पष्ट होता है कि लेवी अपने प्राप्त दशमांश में से दशमांश देते हैं।
- source_word: לְבֵית אֱלֹהֵינוּ
  choice: हमारे परमेश्वर के भवन में
  rationale: यह इब्रानी की वाचा-संबंधी अभिव्यक्ति को बनाए रखता है और मंदिर को ‘परमेश्वर का भवन’ कहता है।
- source_word: הַלְּשָׁכוֹת
  choice: कोठरियों
  rationale: यह मंदिर के भीतर सामग्री रखने के लिए बनी कोठरियों या कमरों को दर्शाता है; ‘कोठरियाँ’ प्रसंगानुकूल और समझने योग्य है।
- source_word: לְבֵית הָאוֹצָר
  choice: भंडार-गृह की
  rationale: यह उपज, दशमांश और भेंटों के संग्रह-स्थान को दर्शाता है; ‘भंडार-गृह’ केवल धन रखने वाली कोषागार का भ्रामक अर्थ नहीं देता।
theological_decisions:
- issue: मंदिर में दशमांश रखने के स्थान की संज्ञा
  choice: भंडार-गृह
  alternative: कोषागार
  rationale: प्रसंग कृषि-उपज और दशमांश के संग्रह का है, केवल धन का नहीं; इसलिए ‘भंडार-गृह’ अधिक सटीक है।
- issue: लेवियों द्वारा दिए जाने वाले अंश का स्वरूप
  choice: दशमांश का दशमांश
  alternative: दशमांश का दसवाँ भाग
  rationale: मुख्य पाठ में इब्रानी की औपचारिक और तकनीकी अभिव्यक्ति सुरक्षित रखी गई है; वैकल्पिक व्याख्यात्मक रूप पादटिप्पणी में दिया गया है।
translation_notes:
  register: भाषा आधुनिक मानक हिंदी में, नियमात्मक किंतु सहज रखी गई है। ‘याजक’, ‘लेवीय’, ‘दशमांश’ और ‘परमेश्वर का भवन’ जैसे स्थापित बाइबलीय पद बनाए गए हैं। अंग्रेज़ी परामर्श-पाठ में [a] का चिह्न ‘priest’ के बाद था, पर उसकी पादटिप्पणी स्पष्टतः מַעֲשַׂר הַמַּעֲשֵׂר से संबंधित है; इसलिए स्रोत-साक्ष्य के आधार पर चिह्न सही पद के बाद रखा गया है।
