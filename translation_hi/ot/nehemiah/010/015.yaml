lexical_decisions:
- source_word: רָאשֵׁי
  choice: मुखिया
  rationale: यह רֹאשׁ का संबंध-रूप बहुवचन है और अगुवाई करने वाले व्यक्तियों के लिए मुहावरे के रूप में प्रयुक्त हुआ है। ‘मुखिया’ आधुनिक हिन्दी में स्वाभाविक है और नेतृत्व का भाव स्पष्ट रखता है।
- source_word: הָעָם
  choice: लोगों के
  rationale: यहाँ עַם वाचा में सम्मिलित यहूदा के समुदाय को सूचित करता है; ‘लोग’ इस सूची के संदर्भ में सहज और स्पष्ट है।
- source_word: פַּרְעֹשׁ
  choice: परोश
  rationale: व्यक्ति अथवा कुल का नाम होने के कारण इसका लिप्यंतरण किया गया है।
- source_word: פַּחַת מוֹאָב
  choice: पहत-मोआब
  rationale: दो भागों वाले व्यक्ति अथवा कुल-नाम को अर्थानुवाद किए बिना, योजक-चिह्न के साथ लिप्यंतरित किया गया है।
- source_word: עֵילָם
  choice: एलाम
  rationale: इस नामावली में यह व्यक्ति अथवा कुल का नाम है; इसलिए इसका लिप्यंतरण किया गया है।
- source_word: זַתּוּא
  choice: जत्तू
  rationale: व्यक्ति अथवा कुल के नाम का हिन्दी ध्वन्यात्मक लिप्यंतरण।
- source_word: בָּנִי
  choice: बानी
  rationale: इस पद के व्यंजन-पाठ के अनुसार नाम ‘बानी’ है; इसे समान दिखने वाले अन्य नामों के अनुरूप नहीं बदला गया।
