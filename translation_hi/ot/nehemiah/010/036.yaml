id: NEH.10.36
reference: Nehemiah 10:36
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וּ/לְ/הָבִ֞יא אֶת בִּכּוּרֵ֣י אַדְמָתֵ֗/נוּ וּ/בִכּוּרֵ֛י כָּל פְּרִ֥י כָל עֵ֖ץ שָׁנָ֣ה בְ/שָׁנָ֑ה לְ/בֵ֖ית יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/010/036.yaml
  text: and to bring the firstfruits of our land and the firstfruits of all the fruit of every tree[a], year by year, to the house of Yahweh[b],
translation:
  language: hi
  text: और हम अपनी भूमि की पहली उपज और हर पेड़ के सब फलों की पहली उपज, प्रति वर्ष, यहोवा के भवन में लाएँगे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/לְ/הָבִיא
  choice: और ... लाएँगे
  rationale: इन्फिनिटिव पूर्ववर्ती वाचा-संबंधी प्रतिज्ञाओं को आगे बढ़ाता है; स्वाभाविक हिन्दी में इसे प्रतिज्ञात्मक सीमित क्रिया से व्यक्त किया गया है।
- source_word: בִּכּוּרֵי אַדְמָתֵנוּ
  choice: अपनी भूमि की पहली उपज
  rationale: בִּכּוּרֵי धार्मिक अर्पण के लिए दी जाने वाली आरम्भिक उपज है, और אֲדָמָה यहाँ कृषि योग्य भूमि को सूचित करता है।
- source_word: וּבִכּוּרֵי כָּל־פְּרִי כָל־עֵץ
  choice: और हर पेड़ के सब फलों की पहली उपज
  rationale: यह चयन इब्रानी की व्यापक, संचित संबंध-रचना को यथासंभव बनाए रखते हुए हिन्दी में बोधगम्य है।
- source_word: שָׁנָה בְשָׁנָה
  choice: प्रति वर्ष
  rationale: यह मुहावरा नियमित वार्षिक पुनरावृत्ति व्यक्त करता है; ‘प्रति वर्ष’ आधुनिक हिन्दी में संक्षिप्त और स्वाभाविक है।
- source_word: לְבֵית יְהוָה
  choice: यहोवा के भवन में
  rationale: ‘भवन’ בֵּית के रूपक और मूल शब्दावली को बनाए रखता है; हिन्दी में गंतव्य के लिए ‘में लाना’ स्वाभाविक है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे / प्रभु
  rationale: मूल पाठ में चतुरक्षरीय व्यक्तिगत नाम सीधे उपस्थित है। हिन्दी बाइबल-परंपरा में व्यापक रूप से पहचाना जाने वाला ‘यहोवा’ नाम को सामान्य उपाधि ‘प्रभु’ में बदलने से बचाता है; ‘याहवे’ अधिक संभावित शैक्षिक उच्चारण है।
translation_notes:
  register: आधुनिक मानक हिन्दी; गरिमापूर्ण किंतु सामान्य पाठक के लिए सरल। पद सूचीबद्ध वाचा-प्रतिज्ञा का अंश है, इसलिए हिन्दी में पूर्ण प्रतिज्ञात्मक वाक्य रखा गया है।
