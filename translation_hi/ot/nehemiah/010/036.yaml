  terminology: ‘पहली उपज’ धार्मिक अर्पण के संदर्भ में बִּכּוּרֵי के लिए उपयुक्त है। ‘भूमि’ अֲדָמָה के कृषि-संदर्भ को स्वाभाविक रूप से व्यक्त करता है। ‘यहोवा’ मूल के व्यक्तिगत ईश्वरीय नाम को बनाए रखता है और लक्षित हिन्दी बाइबिलीय प्रयोग में सुविज्ञेय है।
