source:
  edition: WLC
  text: לְ/לֶ֣חֶם הַֽ/מַּעֲרֶ֡כֶת וּ/מִנְחַ֣ת הַ/תָּמִ֣יד וּ/לְ/עוֹלַ֣ת הַ֠/תָּמִיד הַ/שַּׁבָּת֨וֹת הֶ/חֳדָשִׁ֜ים לַ/מּוֹעֲדִ֗ים וְ/לַ/קֳּדָשִׁים֙ וְ/לַ֣/חַטָּא֔וֹת לְ/כַפֵּ֖ר עַל יִשְׂרָאֵ֑ל וְ/כֹ֖ל מְלֶ֥אכֶת בֵּית אֱלֹהֵֽי/נוּ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/010/034.yaml
  text: for the bread of the arrangement[a], and for the regular grain offering, and for the regular burnt offering, for the Sabbaths, the new moons, the appointed times, and the holy things, and for the sin offerings to make atonement for Israel[e][d][c][b], and for all the work of the house of our God.
translation:
  language: hi
  text: क्रम से सजाई हुई रोटी[a], नित्य अन्नबलि और नित्य होमबलि के लिए, सब्तों, नए चाँद के दिनों और नियत अवसरों[c] के लिए, पवित्र वस्तुओं[d] के लिए, इस्राएल के लिए प्रायश्चित करने हेतु पापबलियों[e] के लिए, और हमारे परमेश्वर के भवन के सभी काम के लिए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “सामने रखी जानेवाली रोटी” अथवा “भेंट की रोटी।”
    reason: lexical_alternative
  - marker: c
    text: “नियत अवसरों” में नियत पर्व भी सम्मिलित हो सकते हैं।
    reason: lexical_alternative
  - marker: d
    text: या “पवित्र भेंटों” अथवा “समर्पित वस्तुओं।”
    reason: lexical_alternative
  - marker: e
    text: “पापबलियों” को यहाँ “शुद्धिकरण-बलियों” के अर्थ में भी समझा जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: לֶחֶם הַמַּעֲרֶכֶת
  choice: सामने रखी जानेवाली रोटी
  rationale: शाब्दिक भाव ‘क्रम से रखी हुई रोटी’ है। हिंदी में यह पद मंदिर में परमेश्वर के सामने रखी रोटी को स्वाभाविक ढंग से व्यक्त करता है और पारंपरिक ‘भेंट की रोटी’ से अधिक मूल चित्र को बचाता है।
- source_word: מִנְחַת הַתָּמִיד
  choice: नित्य अन्नबलि
  rationale: बलिदानी संदर्भ में מִנְחָה अन्नबलि है और תָּמִיד नियमित अथवा निरंतर निर्धारित चढ़ावे को दर्शाता है; ‘नित्य’ संक्षिप्त और प्रचलित हिंदी है।
- source_word: עֹלַת הַתָּמִיד
  choice: नित्य होमबलि
  rationale: עֹלָה पूर्णतः जलाया जानेवाला चढ़ावा है, जिसके लिए ‘होमबलि’ स्थापित और समझने योग्य हिंदी बाइबलीय पद है; תָּמִיד को ‘नित्य’ से व्यक्त किया गया है।
- source_word: הַשַּׁבָּתוֹת הֶחֳדָשִׁים לַמּוֹעֲדִים
  choice: सब्तों, नए चाँद के दिनों और नियत पर्वों के लिए
  rationale: तीनों पद उपासना के निर्धारित अवसर बताते हैं। מוֹעֲדִים का मूल भाव ‘नियत समय/अवसर’ है; यहाँ धार्मिक पंचांग के संदर्भ में ‘नियत पर्व’ स्वाभाविक है, पर नियतता भी बनाए रखता है।
- source_word: וְלַקֳּדָשִׁים
  choice: पवित्र वस्तुओं के लिए
  rationale: बहुवचन קֳדָשִׁים का दायरा अस्पष्ट और व्यापक है। ‘पवित्र वस्तुएँ’ इसे केवल भेंटों तक सीमित नहीं करता।
- source_word: וְלַחַטָּאוֹת
  choice: पापबलियों के लिए
  rationale: बलिदानी संदर्भ में חַטָּאת का मानक अर्थ पापबलि है। शुद्धिकरण-बलि भी संभव व्याख्या है, जिसे पादटिप्पणी में रखा गया है।
- source_word: לְכַפֵּר עַל יִשְׂרָאֵל
  choice: इस्राएल के लिए प्रायश्चित करनेवाली
  rationale: כפר के बलिदानी अर्थ को स्थापित ‘प्रायश्चित करना’ से व्यक्त किया गया है, बिना उसकी क्रियाविधि को किसी संकीर्ण धर्मवैज्ञानिक व्याख्या से बाँधे।
- source_word: וְכֹל מְלֶאכֶת בֵּית אֱלֹהֵינוּ
  choice: हमारे परमेश्वर के भवन के सारे काम के लिए
  rationale: מְלָאכָה व्यापक रूप से काम या कार्य को सूचित करता है; ‘सारा काम’ पूजा-विधि के साथ भवन से जुड़े अन्य दायित्वों को भी समेटता है।
theological_decisions:
- issue: बलिदानी शब्दावली का अनुवाद
  choice: अन्नबलि, होमबलि, पापबलि और प्रायश्चित जैसे स्थापित पद बनाए रखे गए।
  alternative: भेंट, पूर्णाहुति, शुद्धिकरण-बलि जैसे अधिक व्याख्यात्मक पद
  rationale: ये पद इब्रानी बलिदानी श्रेणियों को पहचानने योग्य रूप में रखते हैं और पाठ से आगे बढ़कर कोई विशिष्ट सिद्धांत आरोपित नहीं करते।
- issue: קֳדָשִׁים का दायरा
  choice: पवित्र वस्तुएँ
  alternative: पवित्र भेंटें / समर्पित भेंटें
  rationale: मूल पद वस्तुओं, भेंटों या पवित्र मामलों की ओर संकेत कर सकता है; व्यापक अनुवाद वास्तविक अस्पष्टता को सुरक्षित रखता है।
- issue: חַטָּאת का बलिदानी अर्थ
  choice: पापबलि
  alternative: शुद्धिकरण-बलि
  rationale: ‘पापबलि’ सर्वाधिक पहचाना जानेवाला अर्थ है, जबकि शुद्धिकरण पर बल देनेवाला विकल्प पादटिप्पणी में सुरक्षित है।
- issue: नित्य होमबलि और पर्व-सूची का वाक्यगत संबंध
  choice: विराम देकर ‘सब्तों, नए चाँद के दिनों और नियत पर्वों के लिए’ को अवसरों की सूची के रूप में प्रस्तुत किया गया।
  alternative: इन अवसरों को केवल नित्य होमबलि का सीधा विशेषण मानना
  rationale: इब्रानी में संबंध संक्षिप्त है और ל उपसर्ग अवसर/प्रयोजन दर्शाता है। हिंदी विराम सूचीबद्ध मंदिर-व्यय का प्रवाह बनाए रखता है तथा संबंध को अनावश्यक रूप से संकीर्ण नहीं करता।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण, सहज और मंदिर-संबंधी संदर्भ के अनुकूल शैली। ‘नित्य’, ‘अन्नबलि’, ‘होमबलि’ और ‘प्रायश्चित’ जैसे परिचित बाइबलीय पद रखे गए हैं। मुख्य पाठ में प्रत्येक दी गई पादटिप्पणी का चिह्न उपस्थित है।
