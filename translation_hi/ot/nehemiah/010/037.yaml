source:
  edition: WLC
  text: וְ/אֶת בְּכֹר֤וֹת בָּנֵ֨י/נוּ֙ וּ/בְהֶמְתֵּ֔י/נוּ כַּ/כָּת֖וּב בַּ/תּוֹרָ֑ה וְ/אֶת בְּכוֹרֵ֨י בְקָרֵ֜י/נוּ וְ/צֹאנֵ֗י/נוּ לְ/הָבִיא֙ לְ/בֵ֣ית אֱלֹהֵ֔י/נוּ לַ/כֹּ֣הֲנִ֔ים הַ/מְשָׁרְתִ֖ים בְּ/בֵ֥ית אֱלֹהֵֽי/נוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/010/037.yaml
  text: and the firstborn of our sons and of our livestock[a], as it is written in the Law, and the firstborn of our herds and of our flocks, to bring to the house of our God[b], to the priests who minister in the house of our God.
translation:
  language: hi
  text: और हम अपने पुत्रों में से पहिलौठों और अपने पशुधन के पहिलौठों को, जैसा व्यवस्था में लिखा है, तथा अपने गाय-बैलों और भेड़-बकरियों के पहिलौठों को अपने परमेश्वर के भवन में उन याजकों के पास लाएँगे, जो हमारे परमेश्वर के भवन में सेवा करते हैं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּכֹרוֹת בָּנֵינוּ
  choice: अपने पुत्रों में से पहिलौठों
  rationale: यह पदबंध पुत्रों में पहले जन्मे पुरुषों को दर्शाता है। ‘में से’ हिन्दी में संबंध को स्पष्ट और स्वाभाविक बनाता है, बिना छुटकारे की प्रक्रिया को मुख्य पाठ में जोड़े।
- source_word: וּבְהֶמְתֵּינוּ
  choice: अपने पालतू पशुओं के पहिलौठों
  rationale: בְּהֵמָה यहाँ व्यापक रूप से घरेलू पशुधन को सूचित करता है; आगे गाय-बैलों और भेड़-बकरियों का अधिक विशिष्ट उल्लेख आता है।
- source_word: כַּכָּתוּב בַּתּוֹרָה
  choice: जैसा व्यवस्था में लिखा है
  rationale: यह लिखित तोराह के आदेश की ओर संकेत करने वाला सूत्र है। ‘व्यवस्था’ आधुनिक हिन्दी बाइबलीय प्रयोग में स्वाभाविक और विशिष्ट है।
- source_word: בְּכוֹרֵי בְקָרֵינוּ וְצֹאנֵינוּ
  choice: अपने गाय-बैलों और भेड़-बकरियों के पहिलौठों
  rationale: בָּקָר मुख्यतः बड़े पशुधन, विशेषकर गाय-बैल, और צֹאן छोटे पशुधन, अर्थात भेड़-बकरियाँ, को दर्शाता है। यह रूप हिन्दी पाठक के लिए ठोस और सहज है।
- source_word: לְהָבִיא
  choice: लाएँगे
  rationale: इब्रानी क्रियार्थक रूप पिछली प्रतिज्ञा की सूची को आगे बढ़ाता है। स्वतंत्र पद के रूप में हिन्दी में भविष्यकालीन ‘लाएँगे’ उस वाचा-संबंधी संकल्प को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: לְבֵית אֱלֹהֵינוּ
  choice: अपने परमेश्वर के भवन में
  rationale: ‘भवन’ इब्रानी ‘घर’ के रूपक को बनाए रखता है और उसे सीधे ‘मन्दिर’ कहकर व्याख्यात्मक विस्तार नहीं करता।
- source_word: לַכֹּהֲנִים הַמְשָׁרְתִים
  choice: उन याजकों के पास ... जो ... सेवा करते हैं
  rationale: सहभागी क्रिया याजकों की निरंतर सेवा बताती है। ‘सेवा करते हैं’ स्पष्ट, वर्तमान और गरिमापूर्ण हिन्दी है।
theological_decisions:
- issue: בֵּית אֱלֹהֵינוּ को शाब्दिक ‘हमारे परमेश्वर का भवन’ कहना या व्याख्यात्मक ‘मन्दिर’ कहना
  choice: अपने परमेश्वर के भवन
  alternative: अपने परमेश्वर के मन्दिर
  rationale: सन्दर्भ मन्दिर का है, पर मूल पाठ ‘हमारे परमेश्वर का घर’ कहता है। ‘भवन’ मूल अभिव्यक्ति को बनाए रखता है और अनावश्यक व्याख्या नहीं जोड़ता।
- issue: पुत्रों और पशुओं के पहिलौठों के साथ छुटकारे या बलिदान की प्रक्रिया को मुख्य पाठ में स्पष्ट करना
  choice: केवल ‘पहिलौठों’ कहना
  alternative: छुड़ाए जाने वाले पहिलौठे / पहिलौठों की भेंटें
  rationale: पद तोराह के आदेशों की ओर संकेत करता है, पर मनुष्यों के छुटकारे और पशुओं से संबंधित अलग-अलग विधियों को स्वयं नहीं खोलता। इसलिए मुख्य पाठ उस धार्मिक-कानूनी तनाव को बिना मिलाए बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, स्पष्ट और गरिमापूर्ण रखी गई है। ‘पहिलौठा’ बाइबलीय-सांस्कृतिक शब्द है, पर वाक्य-संरचना और साथ दिए गए पशु-वर्ग इसे सामान्य पाठक के लिए समझने योग्य बनाते हैं। मूल में यह पिछली प्रतिज्ञा से जुड़ी सूची का अंश है; हिन्दी में पूर्ण और स्वाभाविक वाक्य के लिए ‘हम ... लाएँगे’ प्रयुक्त हुआ है।
