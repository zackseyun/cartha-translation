lexical_decisions:
- source_word: וַ/אֲחִיָּה
  choice: और अहिय्याह
  rationale: सूची में वाव संबंधसूचक समुच्चयबोधक है, इसलिए इसे ‘और’ से व्यक्त किया गया है। व्यक्ति के नाम אֲחִיָּה का हिब्रू-आधारित देवनागरी लिप्यंतरण ‘अहिय्याह’ रखा गया है।
- source_word: חָנָן
  choice: हानान
  rationale: व्यक्ति के नाम का अर्थ देने के बजाय उसका हिब्रू-आधारित, सहज देवनागरी लिप्यंतरण किया गया है।
- source_word: עָנָן
  choice: आनान
  rationale: नाम के आरंभिक और अंतिम कामेत्स स्वरों को ध्यान में रखते हुए इसे ‘आनान’ लिप्यंतरित किया गया है; इससे यह ‘हानान’ से भी स्पष्ट रूप से अलग रहता है।
