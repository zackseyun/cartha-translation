base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/010/033.yaml
  text: We also laid on ourselves the obligation to give yearly a third of a shekel for the service of the house of our God[a].
translation:
  language: hi
  text: हमने अपने ऊपर यह दायित्व भी रखा कि अपने परमेश्वर के भवन की सेवा के लिए हर वर्ष एक शेकेल का एक-तिहाई दें।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “हमने अपने ऊपर ये दायित्व रखे कि हर वर्ष एक शेकेल का एक-तिहाई दें।”
    reason: מִצְוֺת का रूप बहुवचन है और उसका अनुवाद ‘दायित्व’ के बजाय ‘दायित्वों’ के रूप में भी किया जा सकता है।
lexical_decisions:
- source_word: וְהֶעֱמַדְנוּ
  choice: हमने ... भी रखा
  rationale: हिफ़ील रूप यहाँ किसी बात को अपने ऊपर ठहराने या लागू करने का भाव देता है। ‘रखा’ स्वाभाविक हिन्दी में इस आत्म-स्वीकृत बंधन को व्यक्त करता है, और וְ को प्रसंगानुसार ‘भी’ से दर्शाया गया है।
- source_word: עָלֵינוּ
  choice: अपने ऊपर
  rationale: על के प्रथम पुरुष बहुवचन प्रत्यय से समुदाय द्वारा स्वयं दायित्व स्वीकार करने का भाव स्पष्ट होता है।
- source_word: מִצְוֺת
  choice: यह दायित्व
  rationale: रूप बहुवचन है, पर यहाँ यह सामूहिक अथवा अमूर्त अर्थ में उस विशिष्ट बाध्यकारी व्यवस्था को सूचित कर सकता है जिसे आगे का infinitive स्पष्ट करता है। ‘यह दायित्व’ आधुनिक हिन्दी में स्वाभाविक है और उसकी बाध्यकारी प्रकृति बनाए रखता है।
- source_word: לָתֵת
  choice: दें
  rationale: נתן का मूल अर्थ ‘देना’ है। हिन्दी वाक्य-रचना में उद्देश्यसूचक उपवाक्य के साथ ‘दें’ स्वाभाविक और स्रोत के निकट है।
- source_word: שְׁלִשִׁית הַשֶּׁקֶל
  choice: एक शेकेल का एक-तिहाई
  rationale: यह शेकेल के तीसरे भाग की वार्षिक राशि है। ‘एक-तिहाई’ आधुनिक हिन्दी में स्पष्ट भिन्नात्मक अभिव्यक्ति है।
- source_word: בַּשָּׁנָה
  choice: हर वर्ष
  rationale: यह पद वार्षिक आवृत्ति बताता है; ‘हर वर्ष’ सहज और स्पष्ट हिन्दी है।
- source_word: לַעֲבֹדַת
  choice: सेवा के लिए
  rationale: मन्दिर-संदर्भ में עֲבֹדָה उपासना और भवन से जुड़ी सेवा अथवा कार्य को दर्शाता है। ‘सेवा’ धार्मिक संदर्भ को बनाए रखते हुए अतितकनीकी नहीं है।
- source_word: בֵּית אֱלֹהֵינוּ
  choice: अपने परमेश्वर के भवन
  rationale: यह शाब्दिक अर्थ ‘हमारे परमेश्वर का भवन’ को स्वाभाविक हिन्दी संबंध-रचना में व्यक्त करता है और ‘मन्दिर’ जैसी अधिक व्याख्यात्मक संज्ञा नहीं जोड़ता।
theological_decisions:
- issue: מִצְוֺת में दायित्व की प्रकृति और वचन
  choice: समुदाय द्वारा अपने ऊपर रखा गया एक विशिष्ट दायित्व
  alternative: अपने ऊपर रखे गए दायित्वों/आदेशों का बहुवचन
  rationale: संज्ञा रूपतः बहुवचन है, किंतु आगे का एक विशिष्ट कार्य—वार्षिक अंशदान देना—इसे सामूहिक या अमूर्त अर्थ में पढ़ने का आधार देता है। मुख्य पाठ इसे केवल प्रथा न बनाकर बाध्यकारी दायित्व के रूप में रखता है; पाद-टिप्पणी वास्तविक बहुवचन संभावना सुरक्षित रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी, सहज किंतु गरिमापूर्ण शैली। ‘परमेश्वर का भवन’ स्रोत की वाचा-संबंधी अभिव्यक्ति को बनाए रखता है। राशि की प्राचीन इकाई ‘शेकेल’ का लिप्यंतरण किया गया है; इसे आधुनिक मुद्रा में नहीं बदला गया।
