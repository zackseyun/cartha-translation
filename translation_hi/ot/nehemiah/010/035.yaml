  text: וְ/הַ/גּוֹרָל֨וֹת הִפַּ֜לְנוּ עַל קֻרְבַּ֣ן הָ/עֵצִ֗ים הַ/כֹּהֲנִ֣ים הַ/לְוִיִּם֮ וְ/הָ/עָם֒ לְ֠/הָבִיא לְ/בֵ֨ית אֱלֹהֵ֧י/נוּ לְ/בֵית אֲבֹתֵ֛י/נוּ לְ/עִתִּ֥ים מְזֻמָּנִ֖ים שָׁנָ֣ה בְ/שָׁנָ֑ה לְ/בַעֵ֗ר עַל מִזְבַּח֙ יְהוָ֣ה אֱלֹהֵ֔י/נוּ כַּ/כָּת֖וּב בַּ/תּוֹרָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/010/035.yaml
  text: We cast lots concerning the wood offering—the priests[a], the Levites, and the people—to bring it to the house of our God, according to our fathers’ houses, at appointed times year by year, to burn on the altar of Yahweh our God, as it is written in the Law.
translation:
  language: hi
  text: हम, अर्थात् याजकों, लेवियों और लोगों ने, लकड़ी की भेंट के विषय में[a] चिट्ठियाँ डालीं, ताकि अपने-अपने पितृकुल के अनुसार हम उसे हर वर्ष निर्धारित समयों पर अपने परमेश्वर के भवन में लाएँ और अपने परमेश्वर याहवे की वेदी पर जलाएँ, जैसा कि व्यवस्था में लिखा है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “लकड़ी की भेंट के लिए।” इब्रानी पूर्वसर्ग का अनुवाद दोनों प्रकार से हो सकता है; आशय यह है कि लकड़ी पहुँचाने का दायित्व निर्धारित करने के लिए चिट्ठियाँ डाली गईं।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַגּוֹרָלוֹת הִפַּלְנוּ
  choice: हमने ... चिट्ठियाँ डालीं
  rationale: हिफ़ील रूप और גּוֹרָלוֹת मिलकर चिट्ठी डालकर दायित्व निर्धारित करने का प्रचलित मुहावरा बनाते हैं; यह आधुनिक हिन्दी में स्वाभाविक है।
- source_word: עַל קֻרְבַּן הָעֵצִים
  choice: लकड़ी की भेंट के विषय में
  rationale: यहाँ עַל चिट्ठियों द्वारा तय किए गए विषय का परिचय देता है और קֻרְבַּן הָעֵצִים वेदी के लिए दी जाने वाली लकड़ी की भेंट है। पूर्वसर्ग की वैकल्पिक समझ पादटिप्पणी में सुरक्षित है।
- source_word: הַכֹּהֲנִים הַלְוִיִּם וְהָעָם
  choice: याजकों, लेवियों और लोगों ने
  rationale: तीनों सहभागी समूहों को मूल के अनुसार स्पष्ट रूप से रखा गया है; डैश वाक्य में इनके कर्ता से संबंध को साफ करते हैं।
- source_word: לְהָבִיא לְבֵית אֱלֹהֵינוּ
  choice: हम उसे ... अपने परमेश्वर के भवन में लाएँ
  rationale: ‘उसे’ का संदर्भ लकड़ी की भेंट से है। ‘भवन’ मूल के בַּיִת को बनाए रखता है, जबकि प्रसंग से मंदिर स्पष्ट है।
- source_word: לְבֵית אֲבֹתֵינוּ
  choice: अपने-अपने पितृकुल के अनुसार
  rationale: בֵּית אָבוֹת यहाँ पैतृक घराने अथवा कुल की सामाजिक इकाइयों को दर्शाता है; ‘अपने-अपने’ वितरणात्मक भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: לְעִתִּים מְזֻמָּנִים שָׁנָה בְשָׁנָה
  choice: हर वर्ष निर्धारित समयों पर
  rationale: यह वार्षिक रूप से दोहराए जाने वाले नियत अवसरों को संक्षिप्त और स्पष्ट हिन्दी में व्यक्त करता है।
- source_word: לְבַעֵר עַל מִזְבַּח
  choice: वेदी पर जलाएँ
  rationale: בער का यहाँ आशय वेदी पर लकड़ी जलाने से है; मूल में निरंतर जलाए रखने का भाव अनिवार्य रूप से स्पष्ट नहीं है।
- source_word: יְהוָה
  choice: याहवे
  rationale: मूल के व्यक्तिगत ईश्वरीय नाम को उपाधि से बदलने के बजाय हिन्दी लिप्यंतरण में रखा गया है।
- source_word: כַּכָּתוּב בַּתּוֹרָה
  choice: जैसा कि व्यवस्था में लिखा है
  rationale: यह तोराह में दिए गए लिखित विधान की ओर संकेत करने वाला सूत्र है; ‘व्यवस्था’ हिन्दी बाइबलीय प्रयोग में स्पष्ट और परिचित है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: पद में चतुरक्षरीय व्यक्तिगत नाम सीधे आया है। ‘याहवे’ उसे उपाधि से प्रतिस्थापित किए बिना प्रस्तुत करता है।
- issue: בער में क्रिया का पक्ष
  choice: वेदी पर जलाएँ
  alternative: वेदी पर जलती रखें
  rationale: संदर्भ में वेदी की आग के लिए लकड़ी देने का उद्देश्य है, पर तत्काल क्रिया-संरचना निरंतरता को स्पष्ट रूप से नहीं कहती; इसलिए अधिक व्याख्यात्मक विकल्प नहीं अपनाया गया।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सार्वजनिक पाठ के अनुकूल हिन्दी। ‘चिट्ठियाँ डालना’, ‘पितृकुल’ और ‘परमेश्वर का भवन’ मूल की प्रशासनिक तथा उपासना-संबंधी भाषा को स्पष्ट रखते हैं।
