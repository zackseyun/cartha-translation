  yaml_path: translation/ot/nehemiah/010/010.yaml
  text: 'and the Levites: Jeshua son of Azaniah[a], Binnui from the sons of Henadad[b], Kadmiel.'
translation:
  language: hi
  text: 'और लेवी: अजन्याह का पुत्र येशूअ, हेनादाद के पुत्रों में से बिन्नूई, कदमीएल।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהַלְוִיִּם
  choice: और लेवी ये थे
  rationale: वाव को पिछले पद की सूची से जोड़ने के लिए ‘और’ रखा गया है। हिन्दी में नामों की सूची आरम्भ करने के लिए ‘ये थे’ स्वाभाविक रूप से जोड़ा गया है, यद्यपि इब्रानी में क्रिया व्यक्त नहीं है।
- source_word: וְיֵשׁוּעַ
  choice: येशूअ
  rationale: इब्रानी व्यक्तिगत नाम का देवनागरी लिप्यंतरण; आरम्भिक वाव को सूची की हिन्दी संरचना में समाहित किया गया है।
- source_word: בֶּן אֲזַנְיָה
  choice: अजन्याह का पुत्र
  rationale: वंशावली-सूचक रचना בֶּן को स्पष्ट और स्वाभाविक हिन्दी में ‘का पुत्र’ किया गया है।
- source_word: בִּנּוּי
  choice: बिन्नूई
  rationale: इब्रानी व्यक्तिगत नाम का निकट देवनागरी लिप्यंतरण।
- source_word: מִבְּנֵי חֵנָדָד
  choice: हेनादाद के वंशजों में से
  rationale: מִן का ‘में से’ अर्थ सुरक्षित है और בְּנֵי को कुल-संबंधी प्रसंग में स्वाभाविक हिन्दी ‘वंशजों’ से व्यक्त किया गया है; शाब्दिक ‘पुत्रों’ से जैविक पुत्रों का अनावश्यक बोध हो सकता था।
- source_word: קַדְמִיאֵל
  choice: कदमीएल
  rationale: इब्रानी नाम का निकट देवनागरी लिप्यंतरण।
