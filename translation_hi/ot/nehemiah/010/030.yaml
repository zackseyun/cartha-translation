  text: מַחֲזִיקִ֣ים עַל אֲחֵי/הֶם֮ אַדִּירֵי/הֶם֒ וּ/בָאִ֞ים בְּ/אָלָ֣ה וּ/בִ/שְׁבוּעָ֗ה לָ/לֶ֨כֶת֙ בְּ/תוֹרַ֣ת הָ/אֱלֹהִ֔ים אֲשֶׁ֣ר נִתְּנָ֔ה בְּ/יַ֖ד מֹשֶׁ֣ה עֶֽבֶד הָֽ/אֱלֹהִ֑ים וְ/לִ/שְׁמ֣וֹר וְ/לַ/עֲשׂ֗וֹת אֶת כָּל מִצְוֺת֙ יְהוָ֣ה אֲדֹנֵ֔י/נוּ וּ/מִשְׁפָּטָ֖י/ו וְ/חֻקָּֽי/ו־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/010/030.yaml
  text: They join with their brothers[a], their nobles, and enter into a curse and an oath, to walk in the law of God, which was given by the hand of Moses the servant of God, and to keep and to do all the commandments of Yahweh our Lord[d][c][b], and his judgments and his statutes.
translation:
  language: hi
  text: वे अपने भाइयों और अपने प्रतिष्ठित लोगों के साथ दृढ़ता से जुड़ गए[a] और शाप तथा शपथ के बंधन में आ गए[b], कि वे परमेश्वर की व्यवस्था के अनुसार चलें—जो परमेश्वर के सेवक मूसा के द्वारा दी गई थी[c]—और हमारे प्रभु याहवे की सभी आज्ञाओं, न्याय-विधियों और विधियों का पालन करें और उन्हें पूरा करें[d]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अपने भाइयों और अपने प्रतिष्ठित लोगों से अपने को दृढ़ता से बाँध लिया।” इब्रानी मुहावरा वाचा में दृढ़ एकता से जुड़ने का भाव दे सकता है।
    reason: lexical_alternative
  - marker: b
    text: “शाप तथा शपथ” ऐसी वाचागत प्रतिज्ञा को दर्शाता है जिसमें प्रतिज्ञा तोड़ने पर आने वाले शाप को भी स्वीकार किया जाता था।
    reason: cultural_note
  - marker: c
    text: शाब्दिक रूप से, “जो मूसा के हाथ से दी गई थी”; अर्थात मूसा के माध्यम से।
    reason: lexical_alternative
  - marker: d
    text: “न्याय-विधियों” का अनुवाद “नियमों” या “निर्णयों,” और “विधियों” का अनुवाद “विधानों” के रूप में भी किया जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: מַחֲזִיקִים עַל
  choice: के साथ दृढ़ता से जुड़ गए
  rationale: यह इब्रानी मुहावरा वाचा के संदर्भ में किसी समुदाय या उसके अगुवों के साथ दृढ़ एकता में सम्मिलित होने को व्यक्त करता है; केवल शारीरिक रूप से थामने या सहायता देने को नहीं।
- source_word: אֲחֵיהֶם
  choice: अपने भाइयों
  rationale: इब्रानी में स्पष्ट पुल्लिंग बहुवचन संबंधवाचक शब्द है; इसलिए उसे अनावश्यक रूप से लिंग-निरपेक्ष नहीं किया गया।
- source_word: אַדִּירֵיהֶם
  choice: अपने प्रतिष्ठित लोगों
  rationale: यहाँ शब्द समुदाय के प्रभावशाली और उच्च पद वाले लोगों को दर्शाता है। आधुनिक हिन्दी में ‘प्रतिष्ठित लोग’ स्वाभाविक है और सामाजिक प्रतिष्ठा का भाव बनाए रखता है।
- source_word: וּבָאִים בְּאָלָה וּבִשְׁבוּעָה
  choice: शाप तथा शपथ के बंधन में आ गए
  rationale: यह वाचा की ऐसी गंभीर प्रतिज्ञा है जिसमें उल्लंघन होने पर शाप स्वीकार किया जाता है। यह अनुवाद दोनों संज्ञाओं को बनाए रखते हुए हिन्दी में बंधनकारी भाव स्पष्ट करता है।
- source_word: לָלֶכֶת בְּתוֹרַת הָאֱלֹהִים
  choice: परमेश्वर की व्यवस्था पर चलेंगे
  rationale: ‘चलना’ जीवन-आचरण के इब्रानी रूपक को बनाए रखता है, और इस कानूनी-वाचागत प्रसंग में תּוֹרָה के लिए ‘व्यवस्था’ उपयुक्त है।
- source_word: אֲשֶׁר נִתְּנָה בְּיַד מֹשֶׁה
  choice: जो ... मूसा के द्वारा दी गई थी
  rationale: शाब्दिक ‘मूसा के हाथ से’ हिन्दी में अस्वाभाविक हो सकता है; ‘मूसा के द्वारा’ उसी मध्यस्थता के अर्थ को सहज रूप में व्यक्त करता है।
- source_word: עֶבֶד הָאֱלֹהִים
  choice: परमेश्वर के सेवक
  rationale: मूसा के लिए यह सम्मानसूचक पद है; इस प्रसंग में ‘दास’ की तुलना में ‘सेवक’ अधिक स्वाभाविक और सटीक है।
- source_word: וְלִשְׁמוֹר וְלַעֲשׂוֹת
  choice: मानेंगे और उनका पालन करेंगे
  rationale: दो क्रियाएँ रखी गई हैं ताकि ध्यानपूर्वक मानने और व्यवहार में पूरा करने, दोनों का बल बना रहे।
- source_word: יְהוָה
  choice: याहवे
  rationale: मूल पाठ में परमेश्वर का व्यक्तिगत वाचागत नाम है; इसलिए उसे किसी उपाधि से बदलने के बजाय हिन्दी में लिप्यंतरित किया गया है।
- source_word: מִשְׁפָּטָיו וְחֻקָּיו
  choice: उसके नियमों और विधियों
  rationale: दोनों कानूनी श्रेणियों का भेद यथासंभव बनाए रखने के लिए दो अलग, सामान्य हिन्दी शब्द चुने गए हैं।
theological_decisions:
- issue: परमेश्वर के नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल में उपाधि नहीं, चार अक्षरों वाला व्यक्तिगत नाम है। ‘याहवे’ उसे प्रत्यक्ष रूप से प्रस्तुत करता है, जबकि साथ का אֲדֹנֵינוּ अलग से ‘हमारे प्रभु’ अनूदित है।
- issue: वाचा में शाप और शपथ का संबंध
  choice: शाप तथा शपथ के बंधन में आ गए
  alternative: शाप खाकर शपथ ली
  rationale: चुना गया रूप दोनों मूल संज्ञाओं को समानांतर रखता है और यह स्पष्ट करता है कि प्रतिज्ञा उल्लंघन की दशा में शाप को स्वीकार करने वाली बंधनकारी वाचा है।
- issue: मूसा के लिए עֶבֶד
  choice: सेवक
  alternative: दास
  rationale: यहाँ यह मूसा की परमेश्वर के प्रति सम्मानित सेवा और प्रतिनिधि भूमिका बताने वाला स्थापित पद है; सामाजिक दासता इस प्रसंग का केंद्र नहीं है।
- issue: אֲחֵיהֶם का लिंग
  choice: अपने भाइयों
  alternative: अपने समुदाय के लोगों
  rationale: मूल के पुल्लिंग संबंधवाचक शब्द को सुरक्षित रखा गया है; व्यापक सामुदायिक सहभागिता का अनुमान लगाकर उसे पाठ में लिंग-निरपेक्ष नहीं बनाया गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। वाचागत ‘चलना,’ ‘शाप तथा शपथ,’ और अलग-अलग कानूनी पदों का भाव सुरक्षित रखा गया है; अत्यधिक संस्कृतनिष्ठ शब्दावली से बचते हुए मूल की औपचारिक गंभीरता बनाए रखी गई है।
