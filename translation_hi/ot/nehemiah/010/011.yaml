- source_word: וַאֲחֵיהֶם
  choice: और उनके भाई
  rationale: וַ का स्वाभाविक अनुवाद ‘और’ है; אֲחֵיהֶם का शाब्दिक अर्थ ‘उनके भाई’ है। वाचा पर मुहर लगाने वालों की इस पुरुष-सूची में ‘भाई’ स्रोत के लिंग और सामूहिक संबंध दोनों को यथासंभव सीधे रखता है।
- source_word: שְׁבַנְיָה
  choice: शबन्याह
  rationale: व्यक्तिवाचक नाम को उसके इब्रानी उच्चारण के निकट देवनागरी में लिप्यंतरित किया गया है।
- source_word: הוֹדִיָּה
  choice: होदियाह
  rationale: व्यक्तिवाचक नाम का इब्रानी-आधारित देवनागरी लिप्यंतरण।
- source_word: קְלִיטָא
  choice: कलीता
  rationale: व्यक्तिवाचक नाम का पठनीय और स्रोत के निकट देवनागरी लिप्यंतरण।
- source_word: פְּלָאיָה
  choice: पलायाह
  rationale: व्यक्तिवाचक नाम का इब्रानी रूप के निकट देवनागरी लिप्यंतरण; अंतिम יָה को ‘याह’ से दर्शाया गया है।
- source_word: חָנָן
  choice: हानान
  rationale: व्यक्तिवाचक नाम का इब्रानी उच्चारण के निकट देवनागरी लिप्यंतरण।
