  text: וְ/אֶת רֵאשִׁ֣ית עֲרִיסֹתֵ֣י/נוּ וּ֠/תְרוּמֹתֵי/נוּ וּ/פְרִ֨י כָל עֵ֜ץ תִּיר֣וֹשׁ וְ/יִצְהָ֗ר נָבִ֤יא לַ/כֹּהֲנִים֙ אֶל לִשְׁכ֣וֹת בֵּית אֱלֹהֵ֔י/נוּ וּ/מַעְשַׂ֥ר אַדְמָתֵ֖/נוּ לַ/לְוִיִּ֑ם וְ/הֵם֙ הַ/לְוִיִּ֔ם הַֽ/מְעַשְּׂרִ֔ים בְּ/כֹ֖ל עָרֵ֥י עֲבֹדָתֵֽ/נוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/010/038.yaml
  text: And we will bring the first of our dough[a], our contributions, the fruit of every tree, the new wine, and the oil to the priests, to the chambers of the house of our God, and the tithe of our land to the Levites; for they, the Levites[c][b], are the ones who collect the tithes in all the cities where we labor.
translation:
  language: hi
  text: और हम अपने गूँधे हुए आटे का पहला भाग[a], अपने पवित्र अंशदान, हर पेड़ का फल, नई दाखमधु और तेल अपने परमेश्वर के भवन की कोठरियों[b] में याजकों के लिए लाएँगे। हम अपनी भूमि का दशमांश लेवियों के लिए लाएँगे, क्योंकि वे, अर्थात् लेवी, हमारे काम के सभी नगरों[c] में दशमांश इकट्ठा करते हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “अपने आटे की पहली भेंट।” इब्रानी में गूँधे हुए आटे के उस पहले अंश का भाव है जिसे पवित्र भेंट के रूप में अलग रखा जाता था।
    reason: lexical_alternative
  - marker: b
    text: या “भंडार-कक्षों।” इब्रानी शब्द परमेश्वर के भवन के परिसर में स्थित कमरों को दर्शाता है, जिनमें वस्तुएँ रखी भी जाती थीं।
    reason: lexical_alternative
  - marker: c
    text: शाब्दिक रूप से “हमारे काम/सेवा के सभी नगरों में।” यह संक्षिप्त इब्रानी अभिव्यक्ति शायद उन नगरों को सूचित करती है जो लोगों की खेती-बाड़ी या अन्य काम से जुड़े थे।
    reason: alternative_reading
lexical_decisions:
- source_word: רֵאשִׁית עֲרִיסֹתֵינוּ
  choice: अपने गूँधे हुए आटे का पहला भाग
  rationale: רֵאשִׁית पहले अथवा आरंभिक हिस्से को और עֲרִיסָה गूँधे हुए आटे को सूचित करता है; यह अनुवाद ठोस भेंट और उसके प्रथम अंश, दोनों को बनाए रखता है।
- source_word: תְּרוּמֹתֵינוּ
  choice: अपने पवित्र अंशदान
  rationale: תְּרוּמָה अलग रखे गए पवित्र अंश अथवा अंशदान को दर्शाता है। ‘पवित्र अंशदान’ आधुनिक पाठक के लिए स्पष्ट है और इसे सामान्य आर्थिक चंदे तक सीमित नहीं करता।
- source_word: פְּרִי כָל עֵץ
  choice: हर प्रकार के पेड़ का फल
  rationale: כָל के व्यापक वितरणात्मक भाव को स्वाभाविक हिन्दी में व्यक्त करता है; प्रसंग उपज की विविध श्रेणियों का है।
- source_word: תִּירוֹשׁ
  choice: नई दाखमधु
  rationale: תִּירוֹשׁ सामान्यतः नई अथवा ताज़ी उत्पादित दाखमधु को दर्शाता है; ‘दाखमधु’ अंगूर से संबंध स्पष्ट रखता है।
- source_word: יִצְהָר
  choice: तेल
  rationale: कृषि-उपज की सूची में यह प्रायः जैतून का तेल है, पर मूल पाठ केवल तेल कहता है; इसलिए अनावश्यक विशिष्टीकरण नहीं किया गया।
- source_word: נָבִיא
  choice: हम ... लाएँगे
  rationale: בוא का हिफ़ील प्रथम पुरुष बहुवचन सामुदायिक प्रतिज्ञा व्यक्त करता है; हिन्दी भविष्यकाल वाचा-संबंधी संकल्प के अनुकूल है।
- source_word: לִשְׁכוֹת
  choice: कोठरियों
  rationale: यह मंदिर-परिसर के कमरों को दर्शाता है, जिनका उपयोग भंडारण में भी होता था; ‘कोठरियाँ’ वास्तु और भंडारण दोनों संकेतों को स्वाभाविक रूप से रखता है।
- source_word: מַעְשַׂר אַדְמָתֵנוּ
  choice: अपनी भूमि का दशमांश
  rationale: मूल की संक्षिप्त संबंधवाचक रचना को बनाए रखते हुए भूमि की उपज से देय दसवें अंश का संकेत देता है।
- source_word: הַמְעַשְּׂרִים
  choice: दशमांश इकट्ठा करते हैं
  rationale: इस प्रशासनिक प्रसंग में कृदंत दशमांश लेने या संग्रह करने वाले लेवियों की भूमिका बताता है।
- source_word: בְּכָל עָרֵי עֲבֹדָתֵנוּ
  choice: हमारी मेहनत के सब नगरों में
  rationale: עֲבֹדָה का अर्थ काम, सेवा या श्रम हो सकता है। यह कुछ असामान्य हिन्दी जानबूझकर मूल की संकुचित और अस्पष्ट अभिव्यक्ति को बनाए रखती है; पादटिप्पणी संभावित अर्थ स्पष्ट करती है।
