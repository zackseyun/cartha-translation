  text: וּ/שְׁאָ֣ר הָ/עָ֡ם הַ/כֹּהֲנִ֣ים הַ֠/לְוִיִּם הַ/שּׁוֹעֲרִ֨ים הַ/מְשֹׁרְרִ֜ים הַ/נְּתִינִ֗ים וְֽ/כָל הַ/נִּבְדָּ֞ל מֵ/עַמֵּ֤י הָ/אֲרָצוֹת֙ אֶל תּוֹרַ֣ת הָ/אֱלֹהִ֔ים נְשֵׁי/הֶ֖ם בְּנֵי/הֶ֣ם וּ/בְנֹתֵי/הֶ֑ם כֹּ֖ל יוֹדֵ֥עַ מֵבִֽין־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/010/029.yaml
  text: and the rest of the people—the priests[a], the Levites, the gatekeepers, the singers, the temple servants, and all who had separated themselves from the peoples of the lands to the law of God—their wives, their sons, and their daughters[b], everyone who knew and understood—
translation:
  language: hi
  text: और शेष लोग—याजक, लेवीय, द्वारपाल, गायक, मंदिर के सेवक[a], और वे सभी जो देशों के लोगों से अलग होकर परमेश्वर की व्यवस्था की ओर मुड़ गए थे—उनकी पत्नियाँ, उनके बेटे और उनकी बेटियाँ, अर्थात् हर वह व्यक्ति जो जानता और समझता था[b]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: हिब्रू में “नतीनीम” है, जो मंदिर में सेवा करने वाले एक वर्ग का पारंपरिक नाम है।
    reason: lexical_alternative
  - marker: b
    text: हिब्रू में “जो अलग हुआ” और “जो जानता और समझता था” के लिए पुल्लिंग एकवचन रूप हैं, पर यहाँ उनका प्रयोग सामूहिक अर्थ में हुआ है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וּשְׁאָר הָעָם
  choice: और शेष लोग
  rationale: שְׁאָר का अर्थ बचे हुए या शेष जन है; यहाँ עָם वाचा-समुदाय के लोगों को दर्शाता है।
- source_word: הַכֹּהֲנִים הַלְוִיִּם הַשּׁוֹעֲרִים הַמְשֹׁרְרִים
  choice: याजक, लेवीय, द्वारपाल, गायक
  rationale: ये मन्दिर-सम्बन्धी वर्गों के प्रचलित, स्पष्ट और स्रोत-संगत हिन्दी पद हैं; מְשֹׁרְרִים विशेषतः गायकों को दर्शाता है।
- source_word: הַנְּתִינִים
  choice: मन्दिर के सेवक
  rationale: पारम्परिक लिप्यन्तरण की अपेक्षा पद का कार्य बताने वाला अर्थ आधुनिक पाठक के लिए अधिक स्पष्ट है।
- source_word: וְכָל הַנִּבְדָּל מֵעַמֵּי הָאֲרָצוֹת אֶל תּוֹרַת הָאֱלֹהִים
  choice: और वे सभी जो देश-देश के लोगों से अलग होकर परमेश्वर की व्यवस्था से जुड़ गए थे
  rationale: निफ़ाल रूप अलग होने को व्यक्त करता है, जबकि אֶל दिशा या सम्बद्धता दिखाता है; 'व्यवस्था से जुड़ गए' इस असामान्य किन्तु सार्थक सम्बन्ध को स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: נְשֵׁיהֶם בְּנֵיהֶם וּבְנוֹתֵיהֶם
  choice: उनकी पत्नियाँ, उनके बेटे और उनकी बेटियाँ
  rationale: हिब्रू में उल्लिखित तीनों पारिवारिक वर्गों को बिना समेटे स्पष्ट रूप से रखा गया है।
- source_word: כֹּל יוֹדֵעַ מֵבִין
  choice: हर वह व्यक्ति जो जानता और समझता था
  rationale: दोनों कृदन्तों को पृथक रखते हुए उनकी सामूहिक शक्ति और सहभागी की समझ-बूझ को व्यक्त किया गया है।
theological_decisions:
- issue: אֶל תּוֹרַת הָאֱלֹהִים में अलगाव और व्यवस्था के बीच सम्बन्ध
  choice: परमेश्वर की व्यवस्था से जुड़ गए थे
  alternative: परमेश्वर की व्यवस्था के लिए अलग हो गए थे
  rationale: हिब्रू אֶל दिशात्मक सम्बन्ध रखता है। चुना हुआ पाठ यह तनाव बनाए रखता है कि वे अन्य जातियों से अलग होकर परमेश्वर की व्यवस्था की ओर आए या उससे सम्बद्ध हुए, बिना इसे केवल उद्देश्यसूचक बनाने के।
- issue: הַנִּבְדָּל और יוֹדֵעַ מֵבִין के पुल्लिंग एकवचन सामूहिक रूप
  choice: वे सभी … अर्थात् हर वह व्यक्ति
  alternative: हर वह पुरुष … जो जानता और समझता था
  rationale: व्याकरणिक एकवचन का सामूहिक बल है, और साथ में पत्नियों, बेटों तथा बेटियों का स्पष्ट उल्लेख मिश्रित समुदाय को दर्शाता है। इसलिए हिन्दी में सामूहिक अर्थ रखा गया है और पादटिप्पणी में रूप की जानकारी दी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सहज गद्य; मन्दिर-सम्बन्धी पदों में प्रचलित बाइबलीय शब्दावली रखी गई है। पद अगले वाक्यांश में जारी रहने के कारण अन्त में दीर्घ विराम-चिह्न रखा गया है।
