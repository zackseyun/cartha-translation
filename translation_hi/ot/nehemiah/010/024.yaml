lexical_decisions:
- source_word: הוֹשֵׁעַ
  choice: होशे
  rationale: यह एक व्यक्तिगत नाम है। हिन्दी बाइबल-परंपरा में प्रचलित और पाठकों के लिए सहज रूप चुना गया है; अधिक अक्षरशः लिप्यंतरण को पाद-टिप्पणी में रखा गया है।
- source_word: חֲנַנְיָה
  choice: हनन्याह
  rationale: व्यक्तिगत नाम को हिब्रू उच्चारण के निकट देवनागरी में लिप्यंतरित किया गया है। नाम के अंत का יָה ‘याह’ रूप में सुरक्षित रखा गया है।
- source_word: חַשּׁוּב
  choice: हश्शूब
  rationale: हिब्रू שׁ के सघन/द्वित्व उच्चारण को ‘श्श’ और दीर्घ ū को ‘ऊ’ द्वारा व्यक्त करते हुए व्यक्तिगत नाम का लिप्यंतरण किया गया है। सरल वैकल्पिक वर्तनी पाद-टिप्पणी में दी गई है।
