source:
  edition: WLC
  text: וּ/בְ/כָל זֹ֕את אֲנַ֛חְנוּ כֹּרְתִ֥ים אֲמָנָ֖ה וְ/כֹתְבִ֑ים וְ/עַל֙ הֶֽ/חָת֔וּם שָׂרֵ֥י/נוּ לְוִיֵּ֖/נוּ כֹּהֲנֵֽי/נוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/010/001.yaml
  text: And because of all this[a], we are making a binding agreement in writing, and on the sealed document are our officials, our Levites[b], and our priests.
translation:
  language: hi
  text: और इस सब के कारण[a] हम एक बाध्यकारी समझौता कर रहे हैं और उसे लिखित रूप दे रहे हैं; और उस मुहरबंद दस्तावेज़ पर हमारे अधिकारी, हमारे लेवी और हमारे याजक मुहर लगा रहे हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “और इस सब में हम एक दृढ़ समझौता कर रहे हैं और उसे लिख रहे हैं।” इब्रानी में ऐसा समझौता करने के लिए शाब्दिक रूप से “काटने” का मुहावरा है; संज्ञा का अर्थ “दृढ़ समझौता” या “विश्वसनीय प्रतिज्ञा” भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְכָל זֹאת
  choice: और इस सब के कारण
  rationale: בְּ का प्रयोग यहाँ पिछले अंगीकार और वर्णित परिस्थितियों की ओर कारणात्मक संकेत करता है; यह स्वाभाविक हिन्दी में उस संबंध को स्पष्ट रखता है।
- source_word: כֹּרְתִים אֲמָנָה
  choice: एक दृढ़ प्रतिज्ञा बाँधकर
  rationale: כרת का शाब्दिक अर्थ ‘काटना’ है, पर प्रतिज्ञा/वाचा के साथ यह उसे विधिवत बाँधने का मुहावरा है। אֲמָנָה की दृढ़ और विश्वसनीय प्रतिबद्धता को ‘दृढ़ प्रतिज्ञा’ व्यक्त करता है।
- source_word: וְכֹתְבִים
  choice: उसे लिख रहे हैं
  rationale: सहभागी क्रिया चल रही औपचारिक कार्रवाई को दर्शाती है; सर्वनाम से लिखी जाने वाली प्रतिज्ञा का संदर्भ स्पष्ट होता है।
- source_word: וְעַל הֶחָתוּם
  choice: और मुहरबंद दस्तावेज़ पर
  rationale: הֶחָתוּם वस्तुतः ‘मुहरबंद [वस्तु/लेख]’ है और संदर्भ में लिखित, औपचारिक दस्तावेज़ को सूचित करता है।
- source_word: שָׂרֵינוּ
  choice: हमारे हाकिमों
  rationale: उत्तर-निर्वासन प्रशासनिक संदर्भ में שׂרים मान्य नागरिक शासकों या पदाधिकारियों को दर्शाता है; ‘हाकिम’ राजवंशीय अर्थ थोपे बिना नेतृत्व और अधिकार व्यक्त करता है।
- source_word: לְוִיֵּינוּ
  choice: हमारे लेवियों
  rationale: लेवी गोत्र और मंदिर-सेवा से जुड़े समूह का प्रचलित हिन्दी नाम।
- source_word: כֹּהֲנֵינוּ
  choice: हमारे याजकों
  rationale: याजकीय समूह के लिए स्पष्ट और प्रचलित हिन्दी पद।
theological_decisions:
- issue: אֲמָנָה को ‘वाचा’ या ‘प्रतिज्ञा’ के रूप में प्रस्तुत करना
  choice: दृढ़ प्रतिज्ञा
  alternative: दृढ़ वाचा / पक्का समझौता
  rationale: यहाँ प्रयुक्त संज्ञा सामान्य ‘वाचा’ (בְּרִית) नहीं है, इसलिए ‘प्रतिज्ञा’ मूल शब्द का भेद बनाए रखती है, जबकि ‘दृढ़’ उसकी विश्वसनीय और बाध्यकारी प्रकृति बताता है।
translation_notes:
  register: 'आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी। कानूनी-औपचारिक स्वर बनाए रखने हेतु ‘दृढ़ प्रतिज्ञा’, ‘मुहरबंद दस्तावेज़’ और ‘हाकिम’ चुने गए हैं। वाक्य के अंतिम भाग में ‘नाम हैं’ संदर्भगत पूर्ति है: अगले पदों में दस्तावेज़ पर मुहर लगाने वालों की सूची आती है।'
