source:
  edition: WLC
  text: וַ/אֲשֶׁ֛ר לֹא נִתֵּ֥ן בְּנֹתֵ֖י/נוּ לְ/עַמֵּ֣י הָ/אָ֑רֶץ וְ/אֶת בְּנֹ֣תֵי/הֶ֔ם לֹ֥א נִקַּ֖ח לְ/בָנֵֽי/נוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/010/031.yaml
  text: and that we will not give our daughters to the peoples of the land[b][a], nor take their daughters for our sons.
translation:
  language: hi
  text: और यह कि हम अपनी बेटियाँ देश के लोगों को नहीं देंगे, और न उनकी बेटियों को अपने बेटों के लिए लेंगे।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ “लेने” का अर्थ विवाह के लिए लेने से है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲשֶׁר
  choice: और यह कि
  rationale: यह पद पिछले शपथ-संकल्प से जुड़ी एक और प्रतिज्ञा प्रस्तुत करता है; इसलिए संयोजक और अधीनस्थ—दोनों भाव रखे गए हैं।
- source_word: לֹא נִתֵּן בְּנֹתֵינוּ
  choice: हम अपनी बेटियाँ ... नहीं देंगे
  rationale: यिक़्तोल रूप यहाँ शपथ के अंतर्गत भविष्य के सामुदायिक संकल्प को व्यक्त करता है।
- source_word: לְעַמֵּי הָאָרֶץ
  choice: देश के लोगों को
  rationale: עַמֵּי व्याकरणतः बहुवचन है; हिन्दी में ‘लोगों’ स्वाभाविक रूप से उस बहुवचन को व्यक्त करता है और मूल की सामाजिक-भौगोलिक अभिव्यक्ति को बिना अतिरिक्त व्याख्या के बनाए रखता है।
- source_word: וְאֶת בְּנֹתֵיהֶם לֹא נִקַּח
  choice: और न उनकी बेटियाँ ... लेंगे
  rationale: ‘लेना’ मूल क्रिया לקח और ‘देना/लेना’ के समानांतर विन्यास को सुरक्षित रखता है; प्रसंग में इसका अर्थ विवाह के लिए लेना है।
- source_word: לְבָנֵינוּ
  choice: अपने बेटों के लिए
  rationale: मूल पाठ विशेष रूप से ‘हमारे बेटों’ कहता है; हिन्दी में आत्मवाचक ‘अपने’ कर्ता से संबंध को स्वाभाविक ढंग से स्पष्ट करता है।
theological_decisions:
- issue: विवाह-निषेध को जातीय या नस्लीय विचारधारा जोड़े बिना प्रस्तुत करना
  choice: मूल की अभिव्यक्ति ‘देश के लोगों’ और पारस्परिक विवाह-संबंधी भाषा को बनाए रखा गया है।
  alternative: ‘देश के मूर्तिपूजक लोग’, ‘विदेशी लोग’ या ‘देश के निवासी’
  rationale: ‘मूर्तिपूजक’ या ‘विदेशी’ जोड़ना इस पद के स्पष्ट शब्दों से आगे की व्याख्या होगी; चुना हुआ रूप वाचा के प्रसंग और मूल की वास्तविक अस्पष्टता को सुरक्षित रखता है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण मानक हिन्दी। ‘देना/लेना’ की मूल समानांतरता रखी गई है; वैवाहिक अर्थ को पादटिप्पणी में स्पष्ट किया गया है।
