base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/010/002.yaml
  text: And on the sealed document were Nehemiah the governor[a], son of Hacaliah[b], and Zedekiah.
translation:
  language: hi
  text: 'और मुहरबंद दस्तावेज़ पर ये नाम थे: हकल्याह का पुत्र नहेमायाह, जो राज्यपाल[a] था, और सिदकिय्याह।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: हिब्रू में “तिरशाता,” फ़ारसी काल की एक प्रशासनिक उपाधि।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל הַחֲתוּמִים
  choice: और मुहरबंद दस्तावेज़ पर ये नाम थे
  rationale: हिब्रू में शाब्दिक रूप से ‘और मुहरबंद लोगों/वस्तुओं पर’ है। प्रसंग में इसके बाद वाचा के मुहरबंद दस्तावेज़ पर अंकित नामों की सूची आती है; इसलिए यह रूप प्रशासनिक आशय को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: נְחֶמְיָה
  choice: नहेमायाह
  rationale: व्यक्तिनाम का प्रचलित हिन्दी बाइबलीय लिप्यंतरण।
- source_word: הַתִּרְשָׁתָא
  choice: राज्यपाल
  rationale: यह फ़ारसी काल की एक प्रशासनिक उपाधि है। आधुनिक पाठक के लिए पद का अर्थ स्पष्ट करने हेतु इसका अनुवाद किया गया है और मूल उपाधि को पाद-टिप्पणी में रखा गया है।
- source_word: בֶּן חֲכַלְיָה
  choice: हकल्याह का पुत्र
  rationale: वंशसूचक בֶּן का स्वाभाविक और सटीक हिन्दी रूप।
- source_word: וְצִדְקִיָּה
  choice: और सिदकिय्याह
  rationale: संयोजक दूसरे नाम को सूची में जोड़ता है; व्यक्तिनाम का हिन्दी में लिप्यंतरण किया गया है।
theological_decisions: []
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। हिब्रू के संक्षिप्त सूची-वाक्य को हिन्दी में स्वाभाविक बनाने के लिए ‘ये नाम थे’ जोड़ा गया है; इससे निहित संदर्भ स्पष्ट होता है, कोई नया ऐतिहासिक दावा नहीं जोड़ा जाता।
