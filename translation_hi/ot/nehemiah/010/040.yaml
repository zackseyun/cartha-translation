language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: כִּ֣י אֶל הַ֠/לְּשָׁכוֹת יָבִ֨יאוּ בְנֵי יִשְׂרָאֵ֜ל וּ/בְנֵ֣י הַ/לֵּוִ֗י אֶת תְּרוּמַ֣ת הַ/דָּגָן֮ הַ/תִּיר֣וֹשׁ וְ/הַ/יִּצְהָר֒ וְ/שָׁם֙ כְּלֵ֣י הַ/מִּקְדָּ֔שׁ וְ/הַ/כֹּהֲנִים֙ הַ/מְשָׁ֣רְתִ֔ים וְ/הַ/שּׁוֹעֲרִ֖ים וְ/הַ/מְשֹׁרְרִ֑ים וְ/לֹ֥א נַעֲזֹ֖ב אֶת בֵּ֥ית אֱלֹהֵֽי/נוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/010/040.yaml
  text: For the sons of Israel and the sons of Levi will bring the contribution of the grain[a], the new wine, and the oil to the chambers, where the vessels of the sanctuary are, and the priests who minister, and the gatekeepers, and the singers[b]. And we will not neglect the house of our God.
translation:
  language: hi
  text: क्योंकि इस्राएली और लेवी अनाज, नई दाखमधु और तेल की भेंट कक्षों में लाएँगे; और वहाँ पवित्रस्थान के पात्र, सेवा करनेवाले याजक, द्वारपाल और गायक हैं। और हम अपने परमेश्वर के भवन की उपेक्षा नहीं करेंगे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְּשָׁכוֹת
  choice: भंडार-कक्षों
  rationale: मंदिर के इन कक्षों में उपज और अंश रखे जाते थे; ‘भंडार-कक्ष’ प्रसंगगत उपयोग और स्थापत्य, दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: בְנֵי יִשְׂרָאֵל וּבְנֵי הַלֵּוִי
  choice: इस्राएली और लेवीवंशी
  rationale: शाब्दिक ‘इस्राएल के पुत्र और लेवी के पुत्र’ की समानांतरता को स्वीकार करते हुए आधुनिक हिन्दी में समुदाय-सूचक अर्थ को स्पष्ट और स्वाभाविक रूप दिया गया है।
- source_word: תְּרוּמַת
  choice: अंश
  rationale: यह परमेश्वर की सेवा के लिए अलग रखे गए उपज के निर्धारित अंश को दर्शाता है; ‘भेंट’ भी संभव है, पर यहाँ सूचीबद्ध कृषि-उपज के संदर्भ में ‘अंश’ अधिक स्पष्ट है।
- source_word: הַתִּירוֹשׁ
  choice: नई दाखमधु
  rationale: תירוש अंगूर की नई उपज से बनी मदिरा अथवा नई दाखमधु को दर्शाता है; यह चयन कृषि-संबंधी विशेषता बनाए रखता है।
- source_word: כְּלֵי הַמִּקְדָּשׁ
  choice: पवित्रस्थान के पात्र
  rationale: मंदिर-सेवा में प्रयुक्त वस्तुओं या उपकरणों के लिए पारंपरिक किंतु बोधगम्य अभिव्यक्ति।
- source_word: וְלֹא נַעֲזֹב
  choice: हम ... उपेक्षा नहीं करेंगे
  rationale: עזב का मूल अर्थ छोड़ना है, पर इस वाचा-संबंधी संदर्भ में मंदिर की आवश्यकताओं और सेवा की अनदेखी न करना अभिप्रेत है; ‘उपेक्षा नहीं करेंगे’ उस व्यावहारिक आशय को स्पष्ट करता है।
theological_decisions:
- issue: वाचागत समुदायों के लिंगयुक्त कुलनाम
  choice: इस्राएली और लेवीवंशी
  alternative: इस्राएल के पुत्र और लेवी के पुत्र
  rationale: मूल की समानांतर समूह-पहचान सुरक्षित रखते हुए हिन्दी में इन्हें स्वाभाविक समुदाय-सूचक संज्ञाओं से व्यक्त किया गया है; इससे आशय केवल जैविक पुत्रों तक सीमित नहीं लगता।
- issue: परमेश्वर के भवन को ‘छोड़ने’ का आशय
  choice: उपेक्षा नहीं करेंगे
  alternative: त्याग नहीं देंगे / छोड़ नहीं देंगे
  rationale: संदर्भ मंदिर के भरण-पोषण और व्यवस्थित सेवा का है। चयन इस व्यावहारिक वाचागत उत्तरदायित्व को व्यक्त करता है, जबकि ‘त्यागना’ अधिक व्यापक और तीव्र अर्थ दे सकता है।
- issue: וְשָׁם से जुड़े स्थानवाचक वाक्य का संबंध
  choice: वहीं ... रहेंगे
  alternative: जहाँ ... हैं
  rationale: हिब्रू में ‘और वहाँ’ के बाद पात्रों तथा मंदिर-कर्मियों की सूची आती है। स्वतंत्र स्थानवाचक वाक्य मूल की संरचनात्मक अस्पष्टता को बिना अनावश्यक व्याख्या के बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सुबोध रखी गई है। ‘पवित्रस्थान’, ‘याजक’ और ‘दाखमधु’ जैसे परिचित बाइबलीय पद धार्मिक-सांस्कृतिक सटीकता के लिए बनाए गए हैं।
