  text: וְ/הַ/צֹּרִים֙ יָ֣שְׁבוּ בָ֔/הּ מְבִיאִ֥ים דָּ֖אג וְ/כָל מֶ֑כֶר וּ/מֹכְרִ֧ים בַּ/שַּׁבָּ֛ת לִ/בְנֵ֥י יְהוּדָ֖ה וּ/בִ/ירוּשָׁלִָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/013/016.yaml
  text: Also Tyrians lived in it[a], bringing in fish and every kind of merchandise[b], and selling them on the Sabbath to the sons of Judah, and in Jerusalem.
translation:
  language: hi
  text: सोर के लोग भी उसमें रहते थे। वे मछलियाँ और हर प्रकार का माल लाते और सब्त के दिन यहूदा के लोगों[a] को बेचते थे—यरूशलेम में भी[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से “यहूदा के पुत्रों”; अर्थात यहूदा के लोग या यहूदी निवासी।
    reason: lexical_alternative
  - marker: b
    text: या अधिक शाब्दिक रूप से, “और यरूशलेम में।” अंतिम वाक्यांश को बलसूचक अर्थ में “यरूशलेम में भी” समझा जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַצֹּרִים
  choice: सोर के लोग भी
  rationale: यह पद सोर नगर के लोगों को सूचित करता है। आरंभिक संयोजक को प्रसंग में पिछले विश्राम-दिन संबंधी उल्लंघनों से जोड़ने के लिए “भी” से व्यक्त किया गया है।
- source_word: יָשְׁבוּ בָהּ
  choice: उसमें रहते थे
  rationale: क्रिया यहाँ निवास करने का भाव देती है; स्त्रीलिंग प्रत्यय का संकेत पहले उल्लिखित नगरी, यरूशलेम, की ओर है।
- source_word: מְבִיאִים דָּאג
  choice: मछलियाँ ... लाते
  rationale: हिफ़ील कृदंत नगर में वस्तुएँ लाने की जारी गतिविधि बताता है; דָּאג का सामान्य बाजार-संदर्भित अर्थ “मछली” है।
- source_word: וְכָל מֶכֶר
  choice: और हर प्रकार का माल
  rationale: מֶכֶר बिक्री के लिए लाई गई वस्तुओं या व्यापारिक माल को दर्शाता है; यह हिंदी में स्वाभाविक और व्यापक अभिव्यक्ति है।
- source_word: וּמֹכְרִים
  choice: और ... बेचते थे
  rationale: कृदंत जारी या बार-बार होने वाली व्यापारिक गतिविधि का वर्णन करता है।
- source_word: בַּשַּׁבָּת
  choice: विश्राम-दिन को
  rationale: निर्धारित सब्त के दिन को सूचित करने के लिए प्रचलित, अर्थ-स्पष्ट हिंदी पद चुना गया है।
- source_word: לִבְנֵי יְהוּדָה
  choice: यहूदा के लोगों को
  rationale: शाब्दिक रूप “यहूदा के पुत्रों” है, पर इस संदर्भ में यह यहूदा के समुदाय या निवासियों के लिए सामूहिक अभिव्यक्ति है; मुख्य पाठ में स्वाभाविक हिंदी रखकर शाब्दिक रूप पादटिप्पणी में दिया गया है।
- source_word: וּבִירוּשָׁלִָם
  choice: यरूशलेम में भी
  rationale: अंतिम संयोजक वाक्य में यह रेखांकित करता प्रतीत होता है कि यह बिक्री यरूशलेम में भी हो रही थी; पादटिप्पणी अधिक शाब्दिक विकल्प सुरक्षित रखती है।
