base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/013/006.yaml
  text: But during all this I was not in Jerusalem[a], for in the thirty-second year of Artaxerxes king of Babylon I went to the king[b], and after some time I asked leave from the king.
translation:
  language: hi
  text: परन्तु इस सब के दौरान मैं यरूशलेम में नहीं था, क्योंकि बाबेल के राजा[a] अर्तक्षत्र के बत्तीसवें वर्ष में मैं राजा के पास गया था। फिर कुछ समय बाद[b] मैंने राजा से जाने की अनुमति माँगी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी पाठ में ‘बाबेल के राजा’ है। व्यापक फ़ारसी साम्राज्य की ऐतिहासिक पृष्ठभूमि से सामंजस्य बैठाने के लिए पाठ को बदला नहीं गया है।
    reason: source_text_clarification
  - marker: b
    text: या ‘कुछ दिनों के अंत में’; अर्थात एक समयावधि बीतने के बाद।
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְכָל זֶה
  choice: परन्तु इस सब के दौरान
  rationale: यह पदबंध पिछले वर्णित घटनाक्रम की समयावधि बताता है और साथ ही नहेमायाह की अनुपस्थिति का विरोधात्मक संबंध स्पष्ट करता है।
- source_word: לֹא הָיִיתִי בִּירוּשָׁלִָם
  choice: मैं यरूशलेम में नहीं था
  rationale: सरल भूतकालीन कथन हिन्दी में स्वाभाविक रूप से उसकी अनुपस्थिति व्यक्त करता है।
- source_word: בִּשְׁנַת שְׁלֹשִׁים וּשְׁתַּיִם לְאַרְתַּחְשַׁסְתְּא
  choice: अर्तक्षत्र के बत्तीसवें वर्ष में
  rationale: राजकीय वर्ष की इब्रानी अभिव्यक्ति का यह स्पष्ट और प्रचलित हिन्दी रूप है।
- source_word: מֶלֶךְ בָּבֶל
  choice: बाबेल के राजा
  rationale: इब्रानी पाठ में यही उपाधि है; व्यापक फ़ारसी साम्राज्य की ऐतिहासिक पृष्ठभूमि से सामंजस्य बैठाने के लिए इसे बदला नहीं गया।
- source_word: בָּאתִי אֶל הַמֶּלֶךְ
  choice: मैं राजा के पास गया था
  rationale: בוא संदर्भ के अनुसार आने या जाने का अर्थ दे सकता है; यरूशलेम से नहेमायाह की अनुपस्थिति के वर्णन में 'गया था' स्वाभाविक है।
- source_word: וּלְקֵץ יָמִים
  choice: फिर कुछ समय बाद
  rationale: शाब्दिक अर्थ 'दिनों के अंत में' है, पर यहाँ अनिश्चित समयावधि के बाद का भाव है।
- source_word: נִשְׁאַלְתִּי מִן הַמֶּלֶךְ
  choice: मैंने राजा से जाने की अनुमति माँगी
  rationale: संदर्भ में निफ़अल रूप राजा से अवकाश अथवा अनुमति माँगने को सूचित करता है; यह अनुवाद अनुमति मिल जाने को अनावश्यक रूप से निश्चित नहीं करता।
