base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/013/007.yaml
  text: When I came to Jerusalem[b][a], I understood the evil that Eliashib had done for Tobiah by making a chamber for him in the courts of the house of God.
translation:
  language: hi
  text: जब मैं यरूशलेम आया, तब मुझे उस बुराई का पता चला जो एल्याशीब ने तोबियाह के लिए परमेश्वर के भवन[a] के आँगनों में उसके लिए एक कक्ष[b] बनाने के द्वारा की थी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “परमेश्वर का भवन” से आशय मन्दिर है।
    reason: cultural_note
  - marker: b
    text: या “एक कमरा”; इब्रानी शब्द मन्दिर-परिसर के किसी कमरे या कक्ष के लिए प्रयुक्त हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאָבוֹא לִירוּשָׁלִָם
  choice: जब मैं यरूशलेम आया
  rationale: क्रमसूचक क्रिया को प्रसंगानुकूल कालवाचक उपवाक्य में रखा गया है; दिशासूचक ל का अर्थ ‘यरूशलेम आया’ में स्वाभाविक रूप से व्यक्त होता है।
- source_word: וָאָבִינָה
  choice: तब मुझे ... पता चला
  rationale: בין यहाँ पहुँचने पर किसी बात को समझने या जान लेने का बोध देता है। ‘पता चला’ आधुनिक हिन्दी में स्वाभाविक है और अनुभूति के प्रसंग को व्यक्त करता है।
- source_word: בָרָעָה
  choice: उस बुराई
  rationale: रָעָה का नैतिक भार बनाए रखा गया है; इसे केवल ‘गलती’ या ‘हानि’ कहकर नरम नहीं किया गया।
- source_word: אֲשֶׁר עָשָׂה אֶלְיָשִׁיב לְטוֹבִיָּה
  choice: जो एल्याशीब ने तोबियाह के लिए की थी
  rationale: לְטוֹבִיָּה को लाभार्थी अर्थ में ‘तोबियाह के लिए’ रखा गया है और पूर्वकालिक कार्य को ‘की थी’ से स्पष्ट किया गया है।
- source_word: לַעֲשׂוֹת לוֹ נִשְׁכָּה
  choice: उसने उसके लिए ... एक कमरा बनवाया था
  rationale: अनन्त क्रिया उस बुरे कार्य की सामग्री/व्याख्या देती है। प्रसंग में एल्याशीब द्वारा कक्ष उपलब्ध कराने का प्रशासनिक कार्य है, इसलिए ‘बनवाया’ स्वाभाविक है; नִשְׁכָּה के व्यापक अर्थ के लिए ‘कमरा’ रखा गया है।
- source_word: בְּחַצְרֵי בֵּית הָאֱלֹהִים
  choice: परमेश्वर के भवन के आँगनों में
  rationale: חצר के बहुवचन को ‘आँगनों’ और בֵּית הָאֱלֹהִים को उसके शाब्दिक धार्मिक पदबंध ‘परमेश्वर का भवन’ से अनूदित किया गया है।
theological_decisions:
- issue: एल्याशीब के कार्य का नैतिक मूल्यांकन
  choice: ‘बुराई’
  alternative: ‘गलत काम’ या ‘हानि’
  rationale: मूल पाठ स्वयं इस कार्य को רָעָה कहकर नैतिक रूप से दोषपूर्ण ठहराता है; अनुवाद उस बल को बनाए रखता है, पर दोष की अतिरिक्त धार्मिक व्याख्या नहीं जोड़ता।
- issue: בֵּית הָאֱלֹהִים की अभिव्यक्ति
  choice: ‘परमेश्वर का भवन’
  alternative: ‘परमेश्वर का मन्दिर’
  rationale: शाब्दिक रूपक को मुख्य पाठ में सुरक्षित रखा गया है, जबकि पादटिप्पणी स्पष्ट करती है कि इससे मन्दिर अभिप्रेत है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी। मुख्य पाठ में नैतिक बल और मूल ‘परमेश्वर का भवन’ पदबंध सुरक्षित हैं; तकनीकी या अत्यधिक संस्कृतनिष्ठ शब्दावली से बचा गया है।
