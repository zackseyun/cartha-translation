  yaml_path: translation/ot/nehemiah/013/020.yaml
  text: Then the merchants and sellers of every kind of goods spent the night outside Jerusalem once or twice[a][b].
translation:
  language: hi
  text: तब व्यापारी और हर प्रकार का माल बेचने वाले यरूशलेम के बाहर एक-दो बार रात भर ठहरे[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से “एक बार और दो बार,” अर्थात् “एक-दो बार।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּלִינוּ
  choice: रात भर ठहरे
  rationale: לון रात बिताने या रात को ठहरने को व्यक्त करता है। यह चयन अस्थायी रात्रि-निवास का अर्थ स्वाभाविक आधुनिक हिन्दी में देता है।
- source_word: הָרֹכְלִים
  choice: व्यापारी
  rationale: רֹכֵל का अर्थ व्यापारी या सौदागर है; प्रसंग में सामान्य और स्पष्ट हिन्दी शब्द 'व्यापारी' उपयुक्त है।
- source_word: וּמֹכְרֵי כָל מִמְכָּר
  choice: और हर प्रकार का माल बेचनेवाले
  rationale: यह पदबंध बिक्री की सभी प्रकार की वस्तुओं को समेटता है। चुना हुआ रूप उसके व्यापक अर्थ को सहज हिन्दी में बनाए रखता है।
- source_word: מִחוּץ לִירוּשָׁלָם
  choice: यरूशलेम के बाहर
  rationale: מִחוּץ नगर की सीमा के बाहर की स्थिति बताता है; हिन्दी में यह सीधा और स्वाभाविक प्रयोग है।
- source_word: פַּעַם וּשְׁתָּיִם
  choice: एक-दो बार
  rationale: शाब्दिक रूप 'एक बार और दो बार' एक इब्रानी मुहावरा है, जिसका स्वाभाविक हिन्दी अर्थ 'एक-दो बार' है; इससे बारंबारता को बढ़ा-चढ़ाकर नहीं बताया जाता।
