base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/013/021.yaml
  text: So I warned them and said to them[a], “Why are you spending the night in front of the wall? If you do it again, I will lay hands on you.” From that time on they did not come on the Sabbath.
translation:
  language: hi
  text: तब मैंने उन्हें चेतावनी दी और उनसे कहा, “तुम शहरपनाह के सामने रात क्यों बिता रहे हो? अगर तुमने फिर ऐसा किया, तो मैं तुम पर हाथ डालूँगा।”[a] उस समय से वे सब्त के दिन फिर नहीं आए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “मैं तुम्हारे विरुद्ध बल प्रयोग करूँगा।” इब्रानी मुहावरे का शाब्दिक अर्थ है, “मैं तुम्हारे विरुद्ध हाथ भेजूँगा।”
    reason: मूल मुहावरा कार्रवाई या बल प्रयोग की धमकी देता है, पर उसके सटीक स्वरूप को निर्धारित नहीं करता।
lexical_decisions:
- source_word: וָאָעִידָה
  choice: मैंने उन्हें चेतावनी देकर कहा
  rationale: हिफ़िल रूप यहाँ उनके व्यवहार के विरुद्ध गंभीर चेतावनी देने का भाव रखता है; यह आधुनिक हिन्दी में स्वाभाविक और प्रसंगानुकूल है।
- source_word: לֵנִים
  choice: रात बिता रहे हो
  rationale: क्रिया का अर्थ ठहरना या रात बिताना है; यह व्यापारियों के शहरपनाह के पास रात भर रुके रहने को स्पष्ट करता है।
- source_word: נֶגֶד הַחוֹמָה
  choice: शहरपनाह के सामने
  rationale: נֶגֶד सामने या आमने-सामने की स्थिति बताता है। 'बाहर' प्रसंग से सम्भव है, पर मूल शब्द से अधिक व्याख्यात्मक होगा। חוֹמָה के लिए 'शहरपनाह' नगर की रक्षात्मक दीवार को सटीक और संक्षिप्त रूप से व्यक्त करता है।
- source_word: אִם תִּשְׁנוּ
  choice: अगर तुमने फिर ऐसा किया
  rationale: שנה का अर्थ यहाँ उसी काम को दोहराना है; निहित कर्म को हिन्दी में 'ऐसा' से स्वाभाविक रूप में व्यक्त किया गया है।
- source_word: יָד אֶשְׁלַח בָּכֶם
  choice: मैं तुम पर हाथ डालूँगा
  rationale: मूल इब्रानी मुहावरा प्रत्यक्ष कार्रवाई या बल प्रयोग की धमकी देता है। हिन्दी अभिव्यक्ति धमकी की तीव्रता बनाए रखती है, जबकि कार्रवाई का ठीक स्वरूप अनिर्धारित छोड़ती है।
- source_word: מִן הָעֵת הַהִיא
  choice: उस समय से
  rationale: यह चेतावनी के बाद आरम्भ हुए परिणाम को बताने वाला स्वाभाविक काल-संकेत है।
- source_word: לֹא בָאוּ בַּשַּׁבָּת
  choice: वे सब्त के दिन फिर नहीं आए
  rationale: नकारात्मक पूर्ण क्रिया को प्रसंगगत निरंतर परिणाम के रूप में व्यक्त किया गया है; 'फिर नहीं' हिन्दी में उसके बाद उनका आना बंद हो जाना स्पष्ट करता है।
theological_decisions: []
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध हिन्दी अपनाई गई है। 'शहरपनाह' बाइबलीय नगर की किलेबंद दीवार के लिए प्रचलित हिन्दी शब्द है। उद्धरण में सीधी और दृढ़ चेतावनी का स्वर रखा गया है।
