  text: בַּ/יָּמִ֣ים הָ/הֵ֡מָּה רָאִ֣יתִי בִֽ/יהוּדָ֣ה דֹּֽרְכִֽים גִּתּ֣וֹת בַּ/שַּׁבָּ֡ת וּ/מְבִיאִ֣ים הָ/עֲרֵמ֣וֹת וְֽ/עֹמְסִ֪ים עַל הַ/חֲמֹרִ֟ים וְ/אַף יַ֜יִן עֲנָבִ֤ים וּ/תְאֵנִים֙ וְ/כָל מַשָּׂ֔א וּ/מְבִיאִ֥ים יְרוּשָׁלִַ֖ם בְּ/י֣וֹם הַ/שַּׁבָּ֑ת וָ/אָעִ֕יד בְּ/י֖וֹם מִכְרָ֥/ם צָֽיִד׀־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/013/015.yaml
  text: In those days I saw in Judah people treading winepresses on the Sabbath, and bringing in heaps of grain and loading them on donkeys—and also wine, grapes, figs, and every kind of load—and bringing them into Jerusalem on the Sabbath day. So I testified against them on the day they sold food.
translation:
  language: hi
  text: उन दिनों मैंने यहूदा में लोगों को सब्त के दिन दाखरस के कुंडों में अंगूर रौंदते, अनाज के ढेर लाते और उन्हें गधों पर लादते देखा। वे दाखमधु, अंगूर, अंजीर और हर प्रकार का बोझ भी सब्त के दिन यरूशलेम में ला रहे थे। जिस दिन वे खाद्य-सामग्री बेच रहे थे, मैंने उनके विरुद्ध गवाही दी।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: דֹּרְכִים גִּתּוֹת
  choice: अंगूर के रसकुंडों में अंगूर रौंदते
  rationale: इब्रानी पदबंध का आशय दाखरस निकालने के लिए अंगूरों को रसकुंड में रौंदना है; लक्ष्य-पाठक के लिए कर्म को स्पष्ट करते हुए मूल क्रिया और स्थान दोनों सुरक्षित रखे गए हैं।
- source_word: הָעֲרֵמוֹת
  choice: अनाज के ढेर
  rationale: शाब्दिक अर्थ ‘ढेर’ है; कृषि और लदान के प्रसंग में अनाज निहित है, इसलिए स्वाभाविक हिंदी में इसे स्पष्ट किया गया है।
- source_word: צָיִד
  choice: खाद्य-सामग्री
  rationale: यहाँ शब्द शिकार नहीं, बेचने के लिए लाई गई खाने की वस्तुओं अथवा रसद को सूचित करता है; ‘खाद्य-सामग्री’ सूचीबद्ध उपज के व्यापक अर्थ को बनाए रखता है।
- source_word: וָאָעִיד
  choice: मैंने उन्हें चेतावनी दी
  rationale: हिफ़ील रूप का अर्थ किसी के विरुद्ध साक्षी देना अथवा गंभीर चेतावनी देना हो सकता है; इस प्रसंग में प्रत्यक्ष निषेधात्मक चेतावनी स्वाभाविक है।
theological_decisions:
- issue: सब्त-उल्लंघन पर नहेमायाह की प्रतिक्रिया
  choice: मैंने उन्हें चेतावनी दी
  alternative: मैंने उनके विरुद्ध गवाही दी
  rationale: प्रसंग में नहेमायाह लोगों को सब्त के दिन व्यापार करने से रोक रहा है। ‘चेतावनी दी’ न्यायिक और उपदेशात्मक अर्थ-क्षेत्र में से प्रसंगानुकूल अर्थ व्यक्त करता है, बिना बाद की किसी धार्मिक परंपरा की व्याख्या जोड़े।
translation_notes:
  register: आधुनिक मानक हिंदी में सरल किंतु गरिमापूर्ण कथात्मक शैली रखी गई है। ‘सब्त’, ‘दाखमधु’ और ‘यरूशलेम’ जैसे स्थापित बाइबलीय पद बनाए गए हैं; लंबे इब्रानी वाक्य को पठनीयता के लिए तीन वाक्यों में बाँटा गया है।
