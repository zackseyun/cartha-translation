source:
  edition: WLC
  text: בַּ/יּ֣וֹם הַ/ה֗וּא נִקְרָ֛א בְּ/סֵ֥פֶר מֹשֶׁ֖ה בְּ/אָזְנֵ֣י הָ/עָ֑ם וְ/נִמְצָא֙ כָּת֣וּב בּ֔/וֹ אֲ֠שֶׁר לֹא יָב֨וֹא עַמֹּנִ֧י וּ/מֹאָבִ֛י בִּ/קְהַ֥ל הָ/אֱלֹהִ֖ים עַד עוֹלָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/013/001.yaml
  text: On that day the Book of Moses was read in the hearing of the people[c][b][a], and it was found written in it that no Ammonite or Moabite should ever enter the assembly of God.
translation:
  language: hi
  text: उस दिन मूसा की पुस्तक[a] लोगों को पढ़कर सुनाई गई, और उसमें यह लिखा मिला कि कोई अम्मोनी या मोआबी परमेश्वर की सभा[b] में कभी भी[c] प्रवेश न करे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मूसा का ग्रंथ।” इब्रानी शब्द पुस्तक या स्क्रॉल (लपेटा हुआ लेख-पत्र) के लिए प्रयुक्त हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या, “परमेश्वर की मंडली।”
    reason: lexical_alternative
  - marker: c
    text: अर्थात् “सदा के लिए” या “सभी समय के लिए।”
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיּוֹם הַהוּא
  choice: उस दिन
  rationale: यह एक निश्चित अवसर को सूचित करने वाला स्वाभाविक और स्रोत-संगत कालवाचक प्रयोग है।
- source_word: נִקְרָא ... בְּאָזְנֵי הָעָם
  choice: लोगों को ... पढ़कर सुनाई गई
  rationale: निफ़अल रूप और ‘लोगों के कानों में’ मुहावरे को मिलाकर सार्वजनिक श्रव्य पाठ का भाव सहज आधुनिक हिन्दी में व्यक्त होता है।
- source_word: בְּסֵפֶר מֹשֶׁה
  choice: मूसा की पुस्तक
  rationale: סֵפֶר पुस्तक, ग्रंथ या लपेटे हुए लेख के लिए आ सकता है; मुख्य पाठ में प्रचलित और स्पष्ट ‘पुस्तक’ रखा गया है तथा विकल्प पादटिप्पणी में दिया गया है।
- source_word: וְנִמְצָא כָּתוּב בּוֹ
  choice: और उसमें यह लिखा मिला
  rationale: हिब्रू की निष्क्रिय अभिव्यक्ति का अर्थ बनाए रखते हुए हिन्दी में स्वाभाविक वाक्य-विन्यास अपनाया गया है।
- source_word: עַמֹּנִי וּמֹאָבִי
  choice: कोई अम्मोनी या मोआबी
  rationale: निषेध के अधीन दोनों समुदायों में से प्रत्येक पर लागू वितरणात्मक अर्थ हिन्दी में ‘कोई ... या ...’ से स्पष्ट होता है।
- source_word: בִּקְהַל הָאֱלֹהִים
  choice: परमेश्वर की सभा
  rationale: קָהָל एकत्र समुदाय या सभा को दर्शाता है; यह अनुवाद बाद की कलीसियाई शब्दावली आरोपित किए बिना मूल संबंध को सुरक्षित रखता है।
- source_word: עַד עוֹלָם
  choice: कभी भी
  rationale: निषेधात्मक कानूनी संदर्भ में यह स्थायी बहिष्कार का बल व्यक्त करता है; ‘कभी भी ... न करे’ आधुनिक हिन्दी में वही बल स्वाभाविक ढंग से देता है।
theological_decisions:
- issue: בִּקְהַל הָאֱלֹהִים का आशय
  choice: परमेश्वर की सभा
  alternative: परमेश्वर की मंडली
  rationale: ‘सभा’ एकत्र वाचा-समुदाय का व्यापक अर्थ रखता है और किसी बाद की विशिष्ट संस्थागत या सांप्रदायिक पहचान को पाठ में नहीं जोड़ता।
- issue: עַד עוֹלָם के स्थायित्व का बल
  choice: कभी भी ... प्रवेश न करे
  alternative: सदा के लिए प्रवेश न करे
  rationale: मुख्य पाठ का प्रयोग निषेध की चिरस्थायी शक्ति को मुहावरेदार हिन्दी में रखता है; वैकल्पिक अर्थ पादटिप्पणी में स्पष्ट है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, स्पष्ट और सार्वजनिक पाठ के अनुकूल शैली। ‘पढ़कर सुनाई गई’ मूल के श्रव्य-सार्वजनिक प्रसंग को व्यक्त करता है, जबकि ‘सभा’ मूल קָהָל की व्यापकता बनाए रखता है।
