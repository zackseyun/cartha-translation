  text: וְ/כָל יְהוּדָ֗ה הֵבִ֜יאוּ מַעְשַׂ֧ר הַ/דָּגָ֛ן וְ/הַ/תִּיר֥וֹשׁ וְ/הַ/יִּצְהָ֖ר לָ/אוֹצָרֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/013/012.yaml
  text: And all Judah brought the tithe of the grain[a], the new wine, and the oil into the storehouses.
translation:
  language: hi
  text: तब समूचे यहूदा के लोग अनाज, नए दाखरस और तेल का दशमांश भंडार-कोठरियों[a] में ले आए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘कोषागारों में।’ हिब्रू शब्द भंडारण की कोठरियों या कोषागारों, दोनों के लिए प्रयुक्त हो सकता है; यहाँ अनाज, दाखरस और तेल का प्रसंग ‘भंडार-कोठरियों’ के पक्ष में है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/כָל יְהוּדָה
  choice: तब समूचे यहूदा के लोग
  rationale: כָּל יְהוּדָה पूरे यहूदा-समुदाय को सूचित करता है। हिंदी में ‘के लोग’ जोड़ने से सामूहिक कर्ता स्वाभाविक और स्पष्ट होता है; आरंभिक וְ को प्रसंगगत क्रम दिखाने के लिए ‘तब’ कहा गया है।
- source_word: הֵבִיאוּ
  choice: ले आए
  rationale: בוא के हिफ़ील रूप का अर्थ ‘लाना/ले आना’ है। गंतव्य के साथ ‘ले आए’ आधुनिक हिंदी में स्वाभाविक है।
- source_word: מַעְשַׂר
  choice: दशमांश
  rationale: מַעְשַׂר उपज के नियत दसवें भाग को दर्शाने वाला मानक शब्द है। हिब्रू के सामूहिक एकवचन को हिंदी में भी एकवचन रखा गया है।
- source_word: הַ/דָּגָן
  choice: अनाज
  rationale: דָּגָן का अर्थ व्यापक रूप से अन्न अथवा धान्य-उपज है; ‘अनाज’ साधारण आधुनिक हिंदी में सर्वाधिक स्पष्ट है।
- source_word: וְ/הַ/תִּירוֹשׁ
  choice: नए दाखरस
  rationale: תִּירוֹשׁ सामान्य יַיִן से भिन्न, प्रायः नया या ताज़ा अंगूरी पेय दर्शाता है। ‘नए दाखरस’ इस भेद को संक्षेप में बनाए रखता है।
- source_word: וְ/הַ/יִּצְהָר
  choice: तेल
  rationale: יִצְהָר कृषि-उपज की ऐसी सूचियों में सामान्यतः ताज़ा तेल, प्रायः जैतून का तेल, दर्शाता है। मूल से अधिक विशिष्ट हुए बिना ‘तेल’ पर्याप्त है।
- source_word: לָ/אוֹצָרוֹת
  choice: भंडार-कोठरियों में
  rationale: אוֹצָרוֹת भंडारण के कक्षों या कोषागारों को कह सकता है। अनाज, दाखरस और तेल के प्रसंग में सामग्री रखने की कोठरियाँ अभिप्रेत हैं, इसलिए यह चयन उपयुक्त है।
theological_decisions: []
