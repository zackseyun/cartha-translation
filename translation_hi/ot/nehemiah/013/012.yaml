  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। कृषि-उपज की त्रयी को स्वाभाविक हिंदी क्रम में रखा गया है और किसी संप्रदाय-विशेष की शब्दावली नहीं जोड़ी गई।
