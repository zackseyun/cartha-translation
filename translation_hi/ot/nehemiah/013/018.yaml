source:
  edition: WLC
  text: הֲ/ל֨וֹא כֹ֤ה עָשׂוּ֙ אֲבֹ֣תֵי/כֶ֔ם וַ/יָּבֵ֨א אֱלֹהֵ֜י/נוּ עָלֵ֗י/נוּ אֵ֚ת כָּל הָ/רָעָ֣ה הַ/זֹּ֔את וְ/עַ֖ל הָ/עִ֣יר הַ/זֹּ֑את וְ/אַתֶּ֞ם מוֹסִיפִ֤ים חָרוֹן֙ עַל יִשְׂרָאֵ֔ל לְ/חַלֵּ֖ל אֶת הַ/שַּׁבָּֽת־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/013/018.yaml
  text: Did not your fathers do this[a], and our God brought all this evil on us and on this city? Yet you are adding wrath against Israel by profaning the Sabbath.
translation:
  language: hi
  text: क्या तुम्हारे पुरखाओं ने ऐसा नहीं किया था, और हमारे परमेश्वर ने हम पर और इस नगर पर यह सारी विपत्ति[a] नहीं लाई थी? फिर भी तुम सब्त को अपवित्र करके इस्राएल पर प्रकोप और बढ़ा रहे हो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘यह सारी आपदा’ अथवा ‘यह सारी विपत्ति।’ इब्रानी शब्द רָעָה दैवी न्याय के प्रसंग में आपदा या विपत्ति को सूचित कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלוֹא כֹה עָשׂוּ
  choice: क्या ... ऐसा ही नहीं किया था
  rationale: הֲלוֹא सहमति की अपेक्षा रखने वाला आलंकारिक प्रश्न है; כֹה עָשׂוּ का स्वाभाविक हिन्दी रूप ‘ऐसा ही ... किया’ है।
- source_word: אֲבֹתֵיכֶם
  choice: तुम्हारे पुरखाओं
  rationale: यह पैतृक पूर्वजों को सूचित करता है; ‘पुरखा’ आधुनिक सामान्य हिन्दी में स्वाभाविक है और मूल के पुरुषवाची पारिवारिक भाव को बनाए रखता है।
- source_word: וַיָּבֵא אֱלֹהֵינוּ
  choice: तब हमारे परमेश्वर ने ... लाई थी
  rationale: हिफ़ील रूप का कर्तृवाच्य अर्थ ‘लाना’ सीधे रखा गया है; ‘तब’ कथित पूर्वजों के कर्म और उसके बाद आए न्याय का प्रसंगगत क्रम स्पष्ट करता है।
- source_word: אֵת כָּל הָרָעָה הַזֹּאת
  choice: यह सारी विपत्ति
  rationale: दैवी न्याय के इस संदर्भ में רָעָה विनाशकारी विपत्ति या आपदा को दर्शाता है। ‘विपत्ति’ नैतिक बुराई करने का अर्थ आरोपित किए बिना न्याय की गंभीरता बनाए रखती है।
- source_word: מוֹסִיפִים חָרוֹן עַל יִשְׂרָאֵל
  choice: इस्राएल पर प्रकोप और बढ़ा रहे हो
  rationale: चल रहे कार्य को ‘बढ़ा रहे हो’ व्यक्त करता है; חָרוֹן के दैवी न्याय-संबंधी तीखे अर्थ के लिए ‘प्रकोप’ उपयुक्त और गरिमामय है।
- source_word: לְחַלֵּל אֶת הַשַּׁבָּת
  choice: सब्त को अपवित्र करके
  rationale: उद्देश्य/साधन सूचक לְ और חלל के अर्थ को स्वाभाविक हिन्दी में रखता है; ‘सब्त’ प्रचलित बाइबलीय पद है।
theological_decisions:
- issue: רָעָה को परमेश्वर द्वारा लाई गई वस्तु के रूप में कैसे प्रस्तुत किया जाए
  choice: विपत्ति
  alternative: बुराई
  rationale: न्याय के प्रसंग में शब्द का अर्थ विपत्ति/आपदा हो सकता है। ‘विपत्ति’ परमेश्वर को नैतिक बुराई का कर्ता बताने का अनावश्यक अर्थ टालती है, पर दैवी दंड को नरम नहीं करती।
- issue: חָרוֹן की दैवी न्याय-संबंधी तीव्रता
  choice: प्रकोप
  alternative: क्रोध
  rationale: ‘प्रकोप’ न्यायकारी, प्रबल क्रोध का भार बनाए रखता है और सामान्य भावनात्मक नाराज़गी तक अर्थ को सीमित नहीं करता।
- issue: आलंकारिक प्रश्न का विस्तार
  choice: पूर्वजों के कर्म और परमेश्वर द्वारा विपत्ति लाने—दोनों उपवाक्यों को प्रश्न के भीतर रखा
  alternative: केवल पहले उपवाक्य को प्रश्न बनाकर दूसरे को कथन रखना
  rationale: आरंभिक הֲלוֹא पूरे समन्वित कथन पर प्रभाव डाल सकता है। हिन्दी में दोनों क्रियाओं पर ‘नहीं’ रखना आलंकारिक अपेक्षा को स्पष्ट करता है, जबकि कारण-परिणाम को सिद्धांतगत व्याख्या से अधिक नहीं बढ़ाता।
translation_notes:
  register: भाषा आधुनिक, गरिमामय और सार्वजनिक पाठ के योग्य रखी गई है। ‘पुरखाओं,’ ‘विपत्ति,’ ‘प्रकोप’ और ‘अपवित्र’ सामान्य पाठक के लिए बोधगम्य हैं, साथ ही मूल की न्याय-संबंधी गंभीरता बनाए रखते हैं।
