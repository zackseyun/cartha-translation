base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/013/009.yaml
  text: Then I gave the order[a], and they cleansed the chambers; and I brought back there the vessels of the house of God[b], with the grain offering and the frankincense.
translation:
  language: hi
  text: तब मैंने आज्ञा दी[a], और उन्होंने उन मंदिर के कक्षों को शुद्ध किया; फिर मैंने वहाँ परमेश्वर के भवन के पात्र, अन्नबलि और लोबान वापस रख दिए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘तब मैंने कहा’ या ‘तब मैंने आज्ञा दी।’ इब्रानी क्रिया का मूल अर्थ ‘मैंने कहा’ है, पर इस प्रसंग में यह ऐसी आज्ञा का परिचय देती है जिसे पूरा किया गया।
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֹמְרָה
  choice: तब मैंने आज्ञा दी
  rationale: मूल क्रिया का शाब्दिक अर्थ ‘मैंने कहा’ है, पर प्रसंग में यह ऐसा आदेश है जिसे तुरंत पूरा किया गया; इसलिए स्वाभाविक हिन्दी में ‘आज्ञा दी’ उसके आशय को स्पष्ट करता है।
- source_word: וַיְטַהֲרוּ
  choice: उन्होंने ... शुद्ध किया
  rationale: טהר भौतिक सफ़ाई के साथ अनुष्ठानिक शुद्धि का अर्थ भी रखता है; ‘शुद्ध किया’ दोनों आयामों को सुरक्षित रखता है।
- source_word: הַלְּשָׁכוֹת
  choice: उन कोठरियों को
  rationale: לשכה मंदिर-परिसर के कक्षों के लिए प्रयुक्त होता है। ‘कोठरियाँ’ यहाँ भंडारण में प्रयुक्त मंदिर-कक्षों के लिए स्वाभाविक और पर्याप्त रूप से व्यापक है।
- source_word: וָאָשִׁיבָה שָּׁם
  choice: वहाँ वापस रखवा दिया
  rationale: हिफ़िल रूप का आशय वस्तुओं को उनके पूर्व स्थान पर लौटाना है। नहेमायाह के आदेशकारी प्रसंग में ‘रखवा दिया’ प्रतिनिधि के माध्यम से कराए गए कार्य को स्वाभाविक हिन्दी में व्यक्त करता है, जबकि ‘वापस’ पुनर्स्थापन का भाव रखता है।
- source_word: כְּלֵי בֵּית הָאֱלֹהִים
  choice: परमेश्वर के भवन के पात्रों
  rationale: כְּלִי व्यापक रूप से पात्रों/उपकरणों को दर्शाता है; मंदिर-संदर्भ में ‘पात्र’ प्रतिष्ठित धार्मिक शब्द है। ‘परमेश्वर का भवन’ मूल इब्रानी अभिव्यक्ति को बनाए रखता है।
- source_word: אֶת הַמִּנְחָה
  choice: अन्नबलि
  rationale: उपासना-संदर्भ में מִנְחָה विशेष रूप से अन्न की भेंट को दर्शाता है; ‘अन्नबलि’ संक्षिप्त और प्रचलित हिन्दी समतुल्य है।
- source_word: וְהַלְּבוֹנָה
  choice: और लोबान
  rationale: לְבוֹנָה सामान्य धूप नहीं, विशेष रूप से frankincense है; हिन्दी में इसका सटीक नाम ‘लोबान’ है।
