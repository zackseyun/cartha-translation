  text: And it displeased me greatly[b][a], and I threw all the household goods of Tobiah out of the chamber.
translation:
  language: hi
  text: यह बात मुझे बहुत बुरी लगी, और मैंने तोबियाह के घर का सारा सामान उस कक्ष से बाहर फेंक दिया।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘कक्ष’ से आशय मंदिर-परिसर के एक कमरे से है। ‘तोबियाह के घर का ... सामान’ का अनुवाद ‘तोबियाह के घर के सारे पात्र’ या ‘तोबियाह की गृहस्थी का सारा सामान’ भी हो सकता है; इब्रानी शब्द वस्तुओं, पात्रों, उपकरणों या सामान के लिए व्यापक रूप से प्रयुक्त होता है।
    reason: cultural_note_and_lexical_alternative
lexical_decisions:
- source_word: וַיֵּרַע לִי מְאֹד
  choice: यह बात मुझे बहुत बुरी लगी
  rationale: यह वाक्यांश רעע + ל के इब्रानी मुहावरे को स्वाभाविक हिन्दी में व्यक्त करता है। यह तीव्र अप्रसन्नता बताता है, पर उसे केवल शोक या क्रोध के रूप में सीमित नहीं करता।
- source_word: וָאַשְׁלִיכָה
  choice: मैंने ... बाहर फेंक दिया
  rationale: हिफ़ील रूप यहाँ जोरदार ढंग से बाहर निकाल फेंकने की क्रिया बताता है; ‘फेंक दिया’ आधुनिक हिन्दी में स्पष्ट और प्रभावशाली है।
- source_word: כָּל
  choice: सारा
  rationale: सामूहिक संज्ञा ‘सामान’ के साथ ‘सारा’ इब्रानी की समग्रता को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: כְּלֵי בֵית טוֹבִיָּה
  choice: तोबियाह के घर का सारा सामान
  rationale: כְּלִי का अर्थ वस्तुएँ, पात्र, उपकरण या सामान हो सकता है। इस प्रसंग में ‘सामान’ पर्याप्त व्यापक है, जबकि ‘पात्र’ अर्थ को अनावश्यक रूप से संकीर्ण कर सकता है। בֵית को ‘घर’ के रूप में रखते हुए मूल की संभावित घरेलू/गृहस्थी-संबंधी अभिव्यक्ति सुरक्षित रहती है।
- source_word: הַחוּץ מִן הַלִּשְׁכָּה
  choice: उस कक्ष से बाहर
  rationale: यह गति की दिशा और आरंभ-बिंदु दोनों को स्पष्ट करता है। ‘कक्ष’ मंदिर-परिसर के कमरे के स्थापत्य संदर्भ को साधारण ‘कमरा’ से कुछ अधिक सटीकता से व्यक्त करता है।
