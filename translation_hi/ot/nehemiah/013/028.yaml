base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/013/028.yaml
  text: And one of the sons of Joiada son of Eliashib the high priest was a son-in-law of Sanballat the Horonite[b][a], so I drove him away from me.
translation:
  language: hi
  text: और महायाजक एल्याशीब के पुत्र योयादा के पुत्रों में से एक, होरोनी सनबल्लत का दामाद था[a]; इसलिए मैंने उसे अपने पास से भगा दिया[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या अधिक व्यापक अर्थ में, “सनबल्लत से विवाह के द्वारा उसका संबंध था।” इब्रानी शब्द वैवाहिक संबंध बता सकता है, पर इस प्रसंग में “दामाद” सबसे स्वाभाविक विशिष्ट अर्थ है।
    reason: lexical_alternative
  - marker: b
    text: या “उसे खदेड़ दिया” अथवा “उसे निकाल दिया।” इब्रानी क्रिया बलपूर्वक दूर करने पर ज़ोर देती है; यह नहीं बताती कि इस कार्रवाई का ठीक प्रशासनिक रूप क्या था।
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִבְּנֵי
  choice: और ... के पुत्रों में से एक
  rationale: מִן के अंशवाचक प्रयोग को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: יוֹיָדָע
  choice: योयादा
  rationale: इब्रानी नाम का निकट देवनागरी लिप्यंतरण।
- source_word: בֶּן אֶלְיָשִׁיב
  choice: एल्याशीब के पुत्र
  rationale: वंश-संबंध को स्पष्ट और औपचारिक रूप से बनाए रखता है।
- source_word: הַכֹּהֵן הַגָּדוֹל
  choice: महायाजक
  rationale: इस्राएल के प्रधान याजकीय पद के लिए प्रचलित और सटीक हिन्दी पद।
- source_word: חָתָן לְסַנְבַלַּט
  choice: सनबल्लत का दामाद था
  rationale: חָתָן वैवाहिक संबंध बताता है और इस प्रसंग में 'दामाद' सबसे स्वाभाविक विशिष्ट अर्थ है।
- source_word: הַחֹרֹנִי
  choice: होरोनी
  rationale: स्थान अथवा समुदाय से जुड़ी पहचान को लिप्यंतरण द्वारा सुरक्षित रखता है।
- source_word: וָאַבְרִיחֵהוּ
  choice: इसलिए मैंने उसे ... भगा दिया
  rationale: ברח के हिफ़ील रूप में किसी को भागने पर विवश करने या बलपूर्वक दूर करने का भाव है; 'भगा दिया' उस बल को बिना औपचारिक निर्वासन जोड़े व्यक्त करता है।
- source_word: מֵעָלָי
  choice: अपने पास से
  rationale: शाब्दिक रूप से 'मेरे ऊपर से', पर यहाँ मुहावरेदार अर्थ नहेमायाह की उपस्थिति अथवा अधिकार-क्षेत्र से दूर करना है।
