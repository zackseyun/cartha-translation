source:
  edition: WLC
  text: וְ/טִֽהַרְתִּ֖י/ם מִ/כָּל נֵכָ֑ר וָ/אַעֲמִ֧ידָ/ה מִשְׁמָר֛וֹת לַ/כֹּהֲנִ֥ים וְ/לַ/לְוִיִּ֖ם אִ֥ישׁ בִּ/מְלַאכְתּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/013/030.yaml
  text: So I cleansed them from everything foreign[a], and I assigned duties for the priests and for the Levites, each in his work,
translation:
  language: hi
  text: इस प्रकार मैंने उन्हें हर विदेशी तत्व से शुद्ध किया और याजकों तथा लेवियों के लिए सेवा-दायित्व[a] ठहराए—हर एक को उसके काम में।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘पहरे’ अथवा ‘सेवा-क्रम’।
    reason: מִשְׁמָרוֹת के संभावित अर्थों—पहरे, सेवा-क्रम या नियुक्त दायित्व—को सुरक्षित रखने के लिए।
lexical_decisions:
- source_word: וְטִהַרְתִּים
  choice: इस प्रकार मैंने उन्हें…शुद्ध किया
  rationale: पिएल रूप טהר का अर्थ ‘शुद्ध करना’ या ‘साफ़ करना’ है। ‘शुद्ध किया’ धार्मिक-सामुदायिक सुधार के संदर्भ में स्वाभाविक है। आरंभिक וְ को पिछले प्रसंग के परिणामसूचक प्रवाह के अनुसार ‘इस प्रकार’ कहा गया है; कर्मसूचक बहुवचन प्रत्यय का अनिश्चित संदर्भ ‘उन्हें’ में सुरक्षित है।
- source_word: מִכָּל נֵכָר
  choice: हर विदेशी तत्व से
  rationale: נֵכָר यहाँ किसी एक जातीय समूह तक सीमित किए बिना विदेशी या पराया तत्व दर्शाता है। ‘विदेशी तत्व’ इस व्यापकता को बनाए रखता है और इसे केवल ‘विदेशी लोगों’ या ‘विदेशी स्त्रियों’ तक नहीं संकुचित करता।
- source_word: וָאַעֲמִידָה
  choice: निर्धारित किए
  rationale: עמד का हिफ़िल रूप यहाँ प्रशासनिक अर्थ में किसी व्यवस्था को स्थापित या नियुक्त करना बताता है। ‘निर्धारित किए’ सेवा-दायित्वों को व्यवस्थित करने का भाव स्पष्ट करता है।
- source_word: מִשְׁמָרוֹת
  choice: सेवा-दायित्व
  rationale: यह शब्द पहरे, सेवा-क्रम, दल या सौंपे गए दायित्वों को सूचित कर सकता है। याजकीय और लेवीय सेवा के संदर्भ में ‘सेवा-दायित्व’ सामान्य पाठक के लिए स्पष्ट है; अन्य संभावनाएँ पादटिप्पणी में दी गई हैं।
- source_word: לַכֹּהֲנִים וְלַלְוִיִּם
  choice: याजकों तथा लेवियों के लिए
  rationale: दोनों सेवा-समूहों को स्पष्ट रूप से बनाए रखा गया है। हिंदी में ‘तथा’ वाक्य को गरिमापूर्ण और सहज रखता है।
- source_word: אִישׁ בִּמְלַאכְתּוֹ
  choice: हर एक को उसके अपने काम पर लगाया
  rationale: אִישׁ यहाँ वितरणात्मक है—समूह के प्रत्येक सदस्य के लिए। ‘हर एक’ उसी बल को स्वाभाविक हिंदी में व्यक्त करता है, और בִּמְלַאכְתּוֹ को ‘उसके अपने काम पर’ कहने से प्रत्येक व्यक्ति के निर्दिष्ट कार्य-क्षेत्र का अर्थ स्पष्ट होता है।
theological_decisions:
- issue: ‘उन्हें’ और ‘हर विदेशी तत्व’ का दायरा
  choice: संबंधित समुदाय को हर विदेशी तत्व से शुद्ध करने की व्यापक भाषा रखी गई है।
  alternative: इसे केवल सभी विदेशियों को हटाने या केवल विदेशी पत्नियों से शुद्ध करने के रूप में सीमित करना।
  rationale: इब्रानी पाठ में कर्मसूचक ‘उन्हें’ का संदर्भ और נֵכָר का आशय इतने विशिष्ट नहीं हैं। निकटवर्ती प्रसंग मिश्रित विवाह और याजकीय समझौते से जुड़ा है, पर अनुवाद को मूल शब्दों से अधिक संकीर्ण नहीं बनाया गया।
- issue: אִישׁ का वितरणात्मक पुल्लिंग
  choice: हर एक को उसके अपने काम पर लगाया
  alternative: हर पुरुष को उसके काम पर लगाया
  rationale: यहाँ אִישׁ मुख्यतः प्रत्येक सदस्य को अलग-अलग निर्दिष्ट करने का काम करता है। ‘हर एक’ वितरणात्मक अर्थ को व्यक्त करता है, जबकि ‘उसके’ इब्रानी एकवचन प्रत्यय को बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण किंतु सहज शैली अपनाई गई है। ‘विदेशी तत्व’ मूल की व्यापकता बचाता है; ‘सेवा-दायित्व’ मंदिर-सेवा की प्रशासनिक व्यवस्था को सामान्य पाठक के लिए स्पष्ट करता है। पादटिप्पणी-चिह्न उसी विवादित शब्द के बाद रखा गया है जिससे वह संबंधित है।
