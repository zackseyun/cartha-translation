source:
  edition: WLC
  text: זָכְרָ֥/ה לָ/הֶ֖ם אֱלֹהָ֑/י עַ֚ל גָּאֳלֵ֣י הַ/כְּהֻנָּ֔ה וּ/בְרִ֥ית הַ/כְּהֻנָּ֖ה וְ/הַ/לְוִיִּֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/013/029.yaml
  text: Remember them[a], my God, because they have defiled the priesthood and the covenant of the priesthood and the Levites.
translation:
  language: hi
  text: हे मेरे परमेश्वर, उन्हें याद कर[a], क्योंकि उन्होंने याजकपद को, और याजकपद तथा लेवियों की वाचा को, अपवित्र किया है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक शाब्दिक रूप से: “हे मेरे परमेश्वर, याजकपद को और याजकपद तथा लेवियों की वाचा को अपवित्र करनेवालों के विषय में उन्हें याद कर।”'
    reason: हिब्रू में ‘अपवित्र करनेवाले’ कृदन्त है और עַל का अर्थ ‘के विषय में/के कारण’ हो सकता है; मुख्य पाठ स्वाभाविक हिन्दी के लिए इसे कारणसूचक उपवाक्य बनाता है।
lexical_decisions:
- source_word: זָכְרָה לָהֶם
  choice: उन्हें याद कर
  rationale: यह परमेश्वर से की गई सीधी प्रार्थना है। संदर्भ में स्मरण न्याय के लिए है, पर क्रिया का मूल अर्थ ‘याद करना’ ही रखा गया है।
- source_word: אֱלֹהָי
  choice: हे मेरे परमेश्वर
  rationale: प्रथम पुरुष एकवचन प्रत्यय और प्रत्यक्ष संबोधन को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: עַל
  choice: क्योंकि
  rationale: यह प्रार्थना का आधार बताता है—उनके अपराध के कारण परमेश्वर से उन्हें याद करने की विनती है।
- source_word: גָּאֳלֵי
  choice: उन्होंने ... अशुद्ध किया है
  rationale: यह גאל ‘अशुद्ध/अपवित्र करना’ का बहुवचन कृदन्त है; हिन्दी में स्पष्ट और स्वाभाविक क्रियात्मक उपवाक्य बनाया गया है।
- source_word: הַכְּהֻנָּה
  choice: याजकपद
  rationale: यह केवल याजकों को नहीं, बल्कि याजकीय पद और संस्था को सूचित करने वाली भाववाचक संज्ञा है।
- source_word: וּבְרִית הַכְּהֻנָּה וְהַלְוִיִּם
  choice: और याजकपद तथा लेवियों की वाचा
  rationale: हिब्रू की संक्षिप्त संबंध-संरचना और उसके वास्तविक अस्पष्ट संबंध को यथासंभव बनाए रखता है; लेवियों को वाचा के साथ संबद्ध पढ़ा गया है।
theological_decisions:
- issue: परमेश्वर द्वारा अपराधियों को याद करना अनुकूल है या प्रतिकूल
  choice: उनके अशुद्ध करने के अपराध के कारण न्यायार्थ प्रतिकूल स्मरण
  alternative: बिना न्याय का भाव स्पष्ट किए तटस्थ स्मरण
  rationale: आगे दिया गया आरोप स्मरण को न्यायिक अर्थ देता है, फिर भी मुख्य क्रिया में ‘याद कर’ रखकर उसके अपने अर्थ को नहीं बदला गया।
- issue: ‘याजकपद और लेवियों की वाचा’ का संबंध
  choice: वाचा को याजकपद और लेवियों दोनों से संबंधित समझना
  alternative: केवल याजकपद की वाचा, और उससे अलग लेवी; अथवा याजकों और लेवियों के साथ की गई वाचा
  rationale: वाक्य-विन्यास लेवियों को वाचा के साथ जोड़ने की अनुमति देता है, पर संबंध का ठीक स्वरूप संक्षिप्त और कुछ अस्पष्ट है; अनुवाद उसे पूरी तरह व्याख्यायित नहीं करता।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध हिन्दी। ‘याजकपद’ संस्था/पद के भाव को बचाता है; ‘अशुद्ध’ धार्मिक अपवित्रीकरण के अर्थ को व्यक्त करता है।
