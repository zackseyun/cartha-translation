source:
  edition: WLC
  text: וָ/אֹמְרָ֣/ה לַ/לְוִיִּ֗ם אֲשֶׁ֨ר יִֽהְי֤וּ מִֽטַּהֲרִים֙ וּ/בָאִים֙ שֹׁמְרִ֣ים הַ/שְּׁעָרִ֔ים לְ/קַדֵּ֖שׁ אֶת י֣וֹם הַ/שַּׁבָּ֑ת גַּם זֹאת֙ זָכְרָ/ה לִּ֣/י אֱלֹהַ֔/י וְ/ח֥וּסָ/ה עָלַ֖/י כְּ/רֹ֥ב חַסְדֶּֽ/ךָ־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/013/022.yaml
  text: And I told the Levites that they should purify themselves and come to guard the gates[a], to keep the Sabbath day holy. Remember this also in my favor, my God[b], and spare me according to the greatness of your steadfast love.
translation:
  language: hi
  text: और मैंने लेवियों से कहा कि वे अपने आपको शुद्ध करें और आकर फाटकों की रखवाली करें, ताकि सब्त के दिन को पवित्र रखें। हे मेरे परमेश्वर, इस काम को भी मेरे हित में स्मरण रख[a], और अपनी अपार अटल करुणा के अनुसार मुझ पर दया कर।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “इस बात के लिए मुझे भी स्मरण रख।” हिब्रू मुहावरे में हितार्थक भाव नहेमायाह स्वयं से या अभी बताए गए काम से जुड़ सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֹמְרָה לַלְוִיִּם
  choice: फिर मैंने लेवियों से कहा
  rationale: אמר का सामान्य अर्थ ‘कहना’ है; प्रसंग में यह प्रशासनिक निर्देश है, पर ‘आज्ञा दी’ मूल की अपेक्षा अधिक बल जोड़ता। वाव-कथात्मक क्रम को स्वाभाविक हिन्दी में ‘फिर’ से व्यक्त किया गया है।
- source_word: אֲשֶׁר יִהְיוּ מִטַּהֲרִים
  choice: कि वे अपने आपको शुद्ध करें
  rationale: היה के साथ हिथपएल कृदन्त अपेक्षित क्रिया बताता है, और טהר का हिथपएल रूप आत्मवाचक अर्थ देता है।
- source_word: וּבָאִים שֹׁמְרִים הַשְּׁעָרִים
  choice: और आकर फाटकों की रखवाली करें
  rationale: लगातार कृदन्तों की क्रिया-श्रृंखला को सहज हिन्दी में ‘आकर ... करें’ बनाया गया है; שמר यहाँ सक्रिय पहरे और सुरक्षा का बोध देता है।
- source_word: לְקַדֵּשׁ אֶת יוֹם הַשַּׁבָּת
  choice: ताकि सब्त का दिन पवित्र रखा जाए
  rationale: קדשׁ का आशय दिन को पवित्र ठहराना और वैसा बनाए रखना है। प्रयोजनसूचक לְ को ‘ताकि’ से स्पष्ट किया गया है।
- source_word: גַּם זֹאת זָכְרָה לִּי
  choice: इस काम को भी मेरे हित में स्मरण रख
  rationale: זאת निकटवर्ती कार्य की ओर संकेत करता है और לִי हितार्थक हो सकता है। ‘मेरे हित में’ प्रार्थना के अनुकूल लाभकारी स्मरण को व्यक्त करता है, जबकि वैकल्पिक संबंध फुटनोट में सुरक्षित है।
- source_word: וְחוּסָה עָלַי
  choice: और ... मुझ पर दया कर
  rationale: חוס में तरस खाने, दया करने और बचा लेने की अर्थ-छाया है। हिन्दी प्रार्थना में ‘मुझ पर दया कर’ स्वाभाविक है और अर्थ को केवल दंड से बचाने तक सीमित नहीं करता।
- source_word: כְּרֹב חַסְדֶּךָ
  choice: अपनी अपार अटल करुणा के अनुसार
  rationale: רֹב प्रचुरता दर्शाता है और חֶסֶד परमेश्वर की विश्वसनीय, संबंध-निष्ठ करुणा को। ‘अटल करुणा’ प्रेम, दया और स्थिर निष्ठा की संयुक्त छाया को संक्षेप में रखती है।
theological_decisions:
- issue: प्रार्थना में חֶסֶד का अनुवाद
  choice: अटल करुणा
  alternative: वाचा का प्रेम; करुणा; अटल प्रेम
  rationale: यह पद परमेश्वर की प्रचुर और निष्ठावान दया की दुहाई देता है। ‘अटल करुणा’ केवल भावनात्मक प्रेम या सामान्य दया तक अर्थ को सीमित किए बिना उसकी स्थिरता और दयालुता दोनों बनाए रखती है।
- issue: זָכְרָה לִּי में स्मरण का संबंध
  choice: इस काम को भी मेरे हित में स्मरण रख
  alternative: इस बात के लिए मुझे भी स्मरण रख
  rationale: हिब्रू वाक्य-विन्यास हितार्थक अर्थ को नहेमायाह अथवा अभी बताए गए कार्य से जोड़ने की गुंजाइश देता है। मुख्य पाठ कार्य को लाभकारी रूप से स्मरण रखने का अर्थ देता है और वैकल्पिक समझ फुटनोट में रखी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल किंतु गरिमापूर्ण प्रार्थनात्मक स्तर रखा गया है। ‘सब्त’, ‘लेवी’ और ‘फाटक’ जैसे प्रचलित बाइबलीय शब्द बनाए गए हैं; अत्यधिक संस्कृतनिष्ठ ‘पवित्रीकरण’ तथा पुराने ढंग के ‘प्रेममय कृपाभाव’ से बचा गया है।
