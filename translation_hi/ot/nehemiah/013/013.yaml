base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/013/013.yaml
  text: And I appointed over the storerooms Shelemiah the priest[a], Zadok the scribe, and Pedaiah from the Levites, and Hanan son of Zaccur, son of Mattaniah, at their side, because they were considered faithful[c][b]; and it was upon them to distribute to their brothers.
translation:
  language: hi
  text: मैंने भंडार-कोठरियों की देखरेख के लिए शलेम्याह याजक, सादोक लिपिक, लेवियों में से पदायाह, और उनके साथ जक्कूर का पुत्र, मत्तन्याह का पुत्र हानान को नियुक्त किया[a], क्योंकि वे विश्वासयोग्य समझे जाते थे[b]। अपने भाइयों में भाग बाँटने की ज़िम्मेदारी उन पर थी[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “उनके साथ” का अर्थ “उनके अधीन” भी हो सकता है; इब्रानी मुहावरा निकट सहयोग या अधीनस्थ सेवा, दोनों का संकेत दे सकता है।
    reason: lexical_alternative
  - marker: b
    text: या “भरोसेमंद माने जाते थे।”
    reason: lexical_alternative
  - marker: c
    text: “भाइयों” के लिए इब्रानी में पुल्लिंग शब्द है; यहाँ इसका आशय उनके साथी समुदाय-सदस्यों से है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאוֹצְרָה עַל אֹצָרוֹת
  choice: मैंने भंडार-कोठरियों की देखरेख के लिए ... नियुक्त किया
  rationale: क्रिया यहाँ अधिकारियों की नियुक्ति बताती है और עַל प्रशासनिक दायित्व का संकेत देता है। संदर्भ में अंश और सामग्री मंदिर की कोठरियों में रखी जाती थी।
- source_word: שֶׁלֶמְיָה הַכֹּהֵן
  choice: शलेम्याह याजक
  rationale: व्यक्तिनाम का देवनागरी लिप्यंतरण किया गया और पदनाम को प्रचलित बाइबलीय हिन्दी में रखा गया।
- source_word: צָדוֹק הַסּוֹפֵר
  choice: सादोक शास्त्री
  rationale: סֹפֵר लेखक, लिपिक अथवा प्रशासनिक अधिकारी का पद हो सकता है; ‘शास्त्री’ परिचित हिन्दी पदनाम है और अर्थ को अनावश्यक रूप से सीमित नहीं करता।
- source_word: וּפְדָיָה מִן הַלְוִיִּם
  choice: लेवियों में से पदायाह
  rationale: मूल के ‘लेवियों में से’ समूह-संबंध को स्वाभाविक हिन्दी में सुरक्षित रखा गया है।
- source_word: וְעַל יָדָם
  choice: और उनके साथ ... हानान को रखा
  rationale: मुहावरा निकट सहयोग अथवा अधीनस्थ सेवा दोनों सूचित कर सकता है। ‘उनके साथ ... रखा’ संबंध को व्यक्त करता है, पर पदानुक्रम निश्चित नहीं करता।
- source_word: כִּי נֶאֱמָנִים נֶחְשָׁבוּ
  choice: क्योंकि वे विश्वासयोग्य समझे जाते थे
  rationale: נֶאֱמָנִים विश्वसनीयता/निष्ठा और נֶחְשָׁבוּ उनके ऐसा माने जाने—दोनों भावों को व्यक्त करते हैं।
- source_word: וַעֲלֵיהֶם לַחֲלֹק
  choice: भाग बाँटने की ज़िम्मेदारी उन्हीं पर थी
  rationale: पूर्वसर्ग दायित्व सौंपे जाने को और חלק संदर्भानुसार हिस्से वितरित करने को दर्शाता है।
- source_word: לַאֲחֵיהֶם
  choice: अपने भाइयों को
  rationale: पुल्लिंग बहुवचन संबंधवाची शब्द का रूप सुरक्षित रखा गया है; संदर्भ में आशय उनके सहकर्मी समुदाय-सदस्यों से है।
theological_decisions:
- issue: אֲחֵיהֶם का लिंगयुक्त संबंधवाची अर्थ
  choice: अपने भाइयों को
  alternative: अपने साथी समुदाय-सदस्यों को
  rationale: मूल पाठ स्पष्ट रूप से पुल्लिंग बहुवचन ‘भाइयों’ कहता है। व्यापक संदर्भगत आशय को पादटिप्पणी में बताया गया है, मुख्य पाठ में उसे निरपेक्ष सामूहिक शब्द से नहीं बदला गया।
- issue: עַל יָדָם में हानान की प्रशासनिक स्थिति
  choice: उनके साथ ... रखा
  alternative: उनके अधीन ... रखा
  rationale: इब्रानी मुहावरा साथ काम करने या अधीन सेवा करने, दोनों की अनुमति देता है; मुख्य पाठ में अस्पष्टता को कठोर पदानुक्रम में नहीं बदला गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण और सहज प्रशासनिक भाषा रखी गई है। ‘भंडार-कोठरियाँ’, ‘देखरेख’, और ‘ज़िम्मेदारी’ तत्काल संदर्भ को स्पष्ट करते हैं। व्यक्तिनाम प्रचलित हिन्दी बाइबलीय रूपों के निकट रखे गए हैं; genuine lexical ambiguity को पादटिप्पणियों में सुरक्षित किया गया है।
