  choice: इससे पहले
  rationale: यह पदबंध पहले की परिस्थिति का समय-संबंध बताता है। आरंभिक וְ को हिंदी में अलग से ‘और’ कहना आवश्यक नहीं, क्योंकि प्रसंग-संबंध स्वाभाविक रूप से बना रहता है।
- source_word: אֶלְיָשִׁיב הַכֹּהֵן
  choice: एल्याशीब याजक
  rationale: व्यक्तिनाम का देवनागरी लिप्यंतरण किया गया है और निश्चित पदवी को सहज हिंदी में रखा गया है।
- source_word: נָתוּן בְּלִשְׁכַּת
  choice: कोठरी का अधिकारी नियुक्त किया गया था
  rationale: नָתוּן यहाँ केवल किसी स्थान में रखे जाने के बजाय दायित्व सौंपे जाने का भाव देता है। ‘अधिकारी नियुक्त’ उस प्रशासनिक जिम्मेदारी को स्पष्ट करता है।
- source_word: לִשְׁכַּת בֵּית אֱלֹהֵינוּ
  choice: हमारे परमेश्वर के भवन की कोठरी
  rationale: לִשְׁכָּה मंदिर-परिसर की कोठरी या कक्ष को दर्शा सकता है। ‘कोठरी’ वास्तु-संबंधी अर्थ को बनाए रखता है, बिना इसे अनिवार्य रूप से भंडार-कक्ष ठहराए।
- source_word: קָרוֹב לְטוֹבִיָּה
  choice: तोबियाह का संबंधी था
  rationale: קָרוֹב לְ किसी निकट पारिवारिक या सामाजिक संबंध को व्यक्त कर सकता है। मुख्य पाठ में ‘संबंधी’ संभावित रिश्तेदारी को स्वाभाविक ढंग से प्रस्तुत करता है, और व्यापक सामाजिक अर्थ को पाद-टिप्पणी में सुरक्षित रखा गया है।
