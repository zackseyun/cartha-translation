  text: इससे पहले, एल्याशीब याजक, जिसे हमारे परमेश्वर के भवन के कक्ष का प्रभारी नियुक्त किया गया था, तोबियाह से निकट संबंध रखता था[a]—
  philosophy: optimal-equivalence
  footnotes:
