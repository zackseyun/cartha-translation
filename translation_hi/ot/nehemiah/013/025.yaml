  edition: WLC
  text: וָ/אָרִ֤יב עִמָּ/ם֙ וָ/אֲקַֽלְלֵ֔/ם וָ/אַכֶּ֥ה מֵ/הֶ֛ם אֲנָשִׁ֖ים וָֽ/אֶמְרְטֵ֑/ם וָ/אַשְׁבִּיעֵ֣/ם בֵּֽ/אלֹהִ֗ים אִם תִּתְּנ֤וּ בְנֹֽתֵי/כֶם֙ לִ/בְנֵי/הֶ֔ם וְ/אִם תִּשְׂאוּ֙ מִ/בְּנֹ֣תֵי/הֶ֔ם לִ/בְנֵי/כֶ֖ם וְ/לָ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/013/025.yaml
  text: 'So I contended with them and cursed them[a], and I struck some of the men and pulled out their hair, and I made them swear by God: “You shall not give your daughters to their sons[b], nor take any of their daughters for your sons or for yourselves.”'
translation:
  language: hi
  text: 'तब मैंने उनसे विवाद किया और उन्हें शाप दिया। मैंने उनमें से कुछ पुरुषों पर प्रहार किया और उनके बाल नोचे। फिर मैंने उन्हें परमेश्वर की शपथ दिलाई: “तुम अपनी बेटियाँ उनके बेटों को नहीं दोगे, और न उनकी बेटियों में से किसी को अपने बेटों के लिए या अपने लिए पत्नी बनाकर लोगे।”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से, “यदि तुम दोगे ... और यदि तुम लोगे ...”; शपथ के इस प्रसंग में इसका भाव निषेध का है।
    reason: मूल इब्रानी की शपथ-संबंधी वाक्य-रचना और उसके निषेधात्मक अर्थ, दोनों को सुरक्षित रखना।
lexical_decisions:
- source_word: וָאָרִיב עִמָּם
  choice: मैंने उनसे विवाद किया
  rationale: ריב टकराव, वाद-विवाद या किसी के विरुद्ध मामला उठाने का भाव रखता है। ‘विवाद किया’ इस कठोर सामना करने के भाव को बनाए रखता है और केवल ‘डाँटा’ कहकर उसे हल्का नहीं करता।
- source_word: וָאֲקַלְלֵם
  choice: उन्हें शाप दिया
  rationale: קלל यहाँ अपमान करने मात्र के बजाय शाप देने या शाप घोषित करने का अर्थ देता है। सीधा अनुवाद मूल कथन की कठोरता को न घटाता है, न बढ़ाता है।
- source_word: וָאַכֶּה מֵהֶם אֲנָשִׁים
  choice: मैंने उनमें से कुछ पुरुषों को मारा
  rationale: מֵהֶם के कारण यह पूरे समूह के नहीं, उसमें से कुछ पुरुषों के बारे में है। ‘मारा’ शारीरिक प्रहार को स्वाभाविक हिन्दी में व्यक्त करता है, पर ‘पीट डाला’ जैसी तीव्रता नहीं जोड़ता।
- source_word: וָאֶמְרְטֵם
  choice: उनके बाल नोच डाले
  rationale: מרט बाल नोचने या उखाड़ने को सूचित करता है। इब्रानी में बाल निहित कर्म है; स्पष्ट और स्वाभाविक हिन्दी के लिए उसे व्यक्त किया गया है।
- source_word: וָאַשְׁבִּיעֵם בֵּאלֹהִים
  choice: मैंने उन्हें परमेश्वर की शपथ दिलाई
  rationale: שבע का हिफ़ईल रूप किसी को शपथ दिलाने का अर्थ देता है। בֵּאלֹהִים को हिन्दी की स्वाभाविक शपथ-भाषा में ‘परमेश्वर की शपथ’ कहा गया है।
- source_word: אִם תִּתְּנוּ
  choice: तुम ... नहीं दोगे
  rationale: शपथ के प्रसंग में אִם निषेधात्मक शपथ-वाक्य का आरम्भ करता है। हिन्दी में ‘नहीं दोगे’ उसकी गंभीर प्रतिज्ञात्मक शक्ति को सहज रूप से व्यक्त करता है; शाब्दिक बनावट पादटिप्पणी में दी गई है।
- source_word: וְאִם תִּשְׂאוּ מִבְּנֹתֵיהֶם
  choice: और न उनकी बेटियों में से किसी को ... पत्नी बनाकर लोगे
  rationale: विवाह के प्रसंग में נשא का आशय स्त्री को पत्नी के रूप में ग्रहण करना है। ‘पत्नी बनाकर लोगे’ विवाह-संबंध को स्पष्ट करता है और केवल सामान्य रूप से ‘लेने’ की अस्पष्टता से बचता है।
- source_word: לִבְנֵיכֶם וְלָכֶם
  choice: अपने बेटों के लिए या अपने लिए
  rationale: निषेध बेटों के विवाह कराने और स्वयं विवाह करने—दोनों पर लागू है। निषेधात्मक हिन्दी में ‘या’ इस वितरक अर्थ को स्वाभाविक रूप से व्यक्त करता है।
theological_decisions:
- issue: नहेम्याह की कठोर अनुशासनात्मक कार्रवाइयों का वर्णन
  choice: शाप देने, मारने और बाल नोचने—तीनों कार्रवाइयों को सीधे और स्पष्ट रूप में रखा गया है।
  alternative: इन्हें केवल मौखिक डाँट के रूप में नरम करना, अथवा मूल से अधिक क्रूर पिटाई के रूप में तीव्र करना।
  rationale: पद नहेम्याह की कठोर कार्रवाइयों का वर्णन करता है। अनुवाद को न हिंसा छिपानी चाहिए, न उसमें ऐसी तीव्रता जोड़नी चाहिए जो मूल में नहीं है।
- issue: शपथ में אִם की शक्ति
  choice: मुख्य पाठ में इसे गंभीर निषेध ‘नहीं दोगे ... और न ... लोगे’ के रूप में व्यक्त किया गया है।
  alternative: शाब्दिक ‘यदि तुम दोगे ... और यदि तुम लोगे ...’ रखना।
  rationale: इब्रानी शपथ-विधि में אִם अधूरी या निहित दंड-शर्त वाली शपथ का परिचायक हो सकता है और यहाँ उसका व्यावहारिक अर्थ निषेध है। पादटिप्पणी मूल संरचना को सुरक्षित रखती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। ‘विवाद किया’, ‘शाप दिया’ और ‘बाल नोच डाले’ मूल की कठोरता को बिना नैतिक टिप्पणी जोड़े सामने रखते हैं। विवाह का आशय स्पष्ट करने के लिए ‘पत्नी बनाकर’ जोड़ा गया है।
