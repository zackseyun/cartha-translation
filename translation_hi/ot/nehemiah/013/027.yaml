base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/013/027.yaml
  text: Should we then listen to you and do all this great evil[b][a], acting unfaithfully against our God by marrying foreign women?
translation:
  language: hi
  text: तो क्या हम तुम्हारी बात मानकर यह सारी बड़ी बुराई करें—विदेशी स्त्रियों को पत्नी बनाकर[a] अपने परमेश्वर से विश्वासघात करें?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “विदेशी स्त्रियों को बसाकर।” इस प्रसंग में आशय उन्हें पत्नी के रूप में घर में लाने से है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲנִשְׁמַע ... וְלָכֶם
  choice: क्या हम तुम्हारी बात मानकर
  rationale: निफ़अल הֲנִשְׁמַע यहाँ आलंकारिक प्रश्न में किसी की बात मानने या उसके अनुसार चलने का भाव देता है। यह अनुवाद सीधे संबोधन और अनुपालन—दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: לַעֲשֹׂת אֵת כָּל הָרָעָה הַגְּדוֹלָה הַזֹּאת
  choice: यह सारी बड़ी बुराई करें
  rationale: כָּל की समग्रता और הָרָעָה הַגְּדוֹלָה की गंभीर नैतिक शक्ति को बनाए रखते हुए यह आधुनिक हिन्दी में सहज है।
- source_word: לִמְעֹל בֵּאלֹהֵינוּ
  choice: अपने परमेश्वर के प्रति विश्वासघात करें
  rationale: מעל संबंधपरक निष्ठा भंग करने का प्रबल भाव रखता है। ‘विश्वासघात’ वाचा-संबंधी गंभीरता को व्यक्त करता है, पर इसे केवल अनुष्ठानिक अपराध तक सीमित नहीं करता।
- source_word: לְהֹשִׁיב נָשִׁים נָכְרִיּוֹת
  choice: पराई स्त्रियों को पत्नी बनाकर
  rationale: הֹשִׁיב का शाब्दिक अर्थ ‘बसाना/रहने देना’ है, पर इस प्रसंग में स्त्रियों को वैवाहिक गृह में लाने का संकेत है। ‘पत्नी बनाकर’ प्रसंगगत अर्थ स्पष्ट करता है और ‘पराई स्त्रियों’ से मूल संज्ञा-पद का रूप बना रहता है।
theological_decisions:
- issue: לִמְעֹל בֵּאלֹהֵינוּ में अपराध का स्वरूप
  choice: परमेश्वर के प्रति संबंधपरक/वाचा-संबंधी विश्वासघात
  alternative: परमेश्वर के विरुद्ध सामान्य बुराई या केवल अनुष्ठानिक अपराध
  rationale: מעל प्रायः निष्ठा तोड़ने और विश्वासघात का अर्थ देता है। चुना हुआ रूप इसकी धार्मिक गंभीरता बनाए रखता है, लेकिन पाठ से अधिक संकीर्ण सिद्धान्त आरोपित नहीं करता।
- issue: נָשִׁים נָכְרִיּוֹת का आशय
  choice: पराई स्त्रियों से विवाह करना
  alternative: विदेशी स्त्रियों को केवल निवास देना
  rationale: निकटवर्ती प्रसंग और הֹשִׁיב का यहाँ प्रयुक्त मुहावरेदार भाव वैवाहिक संबंध की ओर संकेत करते हैं। फिर भी शाब्दिक रूप को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सार्वजनिक पाठ के अनुकूल रखी गई है। आलंकारिक प्रश्न को स्वाभाविक हिन्दी क्रम में रखा गया है। ‘पराई स्त्रियाँ’ यहाँ दूसरे समुदायों की स्त्रियों के लिए है; इसे आधुनिक नागरिकता की तकनीकी श्रेणी के रूप में नहीं पढ़ना चाहिए।
