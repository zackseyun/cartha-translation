  text: וַ/יַּ֨עַשׂ ל֜/וֹ לִשְׁכָּ֣ה גְדוֹלָ֗ה וְ/שָׁ֣ם הָי֪וּ לְ/פָנִ֟ים נֹ֠תְנִים אֶת הַ/מִּנְחָ֨ה הַ/לְּבוֹנָ֜ה וְ/הַ/כֵּלִ֗ים וּ/מַעְשַׂ֤ר הַ/דָּגָן֙ הַ/תִּיר֣וֹשׁ וְ/הַ/יִּצְהָ֔ר מִצְוַת֙ הַ/לְוִיִּ֔ם וְ/הַ/מְשֹׁרְרִ֖ים וְ/הַ/שֹּׁעֲרִ֑ים וּ/תְרוּמַ֖ת הַ/כֹּהֲנִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/013/005.yaml
  text: He made for him a large chamber[a], where formerly they had put the grain offering, the frankincense, the vessels, and the tithe of grain, new wine, and oil—the portion commanded for the Levites, the singers[d][c][b], and the gatekeepers—and the contribution for the priests.
translation:
  language: hi
  text: उसने उसके लिए एक बड़ा भंडार-कक्ष[a] बना दिया। वहाँ पहले अन्नबलि, लोबान, पात्र, और अनाज, नया दाखरस तथा तेल का वह दशमांश रखा जाता था जो लेवियों, गायकों और द्वारपालों के लिए निर्धारित था[b], तथा याजकों के लिए भेंट[c] भी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “एक बड़ा कक्ष।” इब्रानी शब्द मंदिर-परिसर के किसी कमरे को दर्शा सकता है; यहाँ उसका उपयोग भंडारण के लिए होता था।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में शाब्दिक रूप से “लेवियों, गायकों और द्वारपालों की आज्ञा”; प्रसंग में आशय उनके लिए विधान द्वारा निर्धारित भाग से है।
    reason: source_ambiguity
  - marker: c
    text: या “याजकों के लिए अलग रखी गई भेंट”; इस इब्रानी शब्द को परंपरागत रूप से “उठाई हुई भेंट” भी कहा जाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ לוֹ
  choice: उसने उसके लिए ... बना दिया
  rationale: यह עשה और ל־ के सीधे अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है और कमरे को तैयार किए जाने से अधिक निश्चित बात नहीं जोड़ता।
- source_word: לִשְׁכָּה גְדוֹלָה
  choice: एक बड़ा भंडार-कक्ष
  rationale: לִשְׁכָּה मन्दिर-परिसर के एक कक्ष को दर्शाता है; इस प्रसंग में उसका उपयोग सामग्री रखने के लिए था, इसलिए ‘भंडार-कक्ष’ अर्थ और कार्य दोनों को स्पष्ट करता है।
- source_word: וְשָׁם הָיוּ לְפָנִים נֹתְנִים
  choice: वहाँ पहले ... रखा जाता था
  rationale: היה के साथ कृदन्त बीते समय की प्रचलित या बार-बार होने वाली क्रिया दर्शाता है; हिन्दी का अपूर्ण भूतकाल इस भाव को स्वाभाविक रूप से रखता है।
- source_word: הַמִּנְחָה
  choice: अन्नबलि
  rationale: मन्दिर और उपासना के प्रसंग में מִנְחָה का विशिष्ट अर्थ अनाज की भेंट है; ‘अन्नबलि’ संक्षिप्त और परिचित हिन्दी समतुल्य है।
- source_word: הַלְּבוֹנָה
  choice: लोबान
  rationale: לְבוֹנָה बलिदान और मन्दिर के प्रसंग में frankincense को दर्शाता है; हिन्दी में ‘लोबान’ इसका सामान्य और समझने योग्य नाम है।
- source_word: הַכֵּלִים
  choice: पात्र
  rationale: मन्दिर-सेवा में प्रयुक्त वस्तुओं या उपकरणों के लिए ‘पात्र’ प्रतिष्ठित और प्रसंगानुकूल है, यद्यपि मूल शब्द व्यापक हो सकता है।
- source_word: מַעְשַׂר הַדָּגָן הַתִּירוֹשׁ וְהַיִּצְהָר
  choice: अनाज, नया दाखमधु तथा तेल का दशमांश
  rationale: यह कृषि-उपज की पारंपरिक त्रयी और מַעְשַׂר के दसवें भाग, दोनों को स्पष्ट रूप से व्यक्त करता है; תִּירוֹשׁ के लिए ‘नया दाखमधु’ उसकी विशिष्टता बचाता है।
- source_word: מִצְוַת הַלְוִיִּם וְהַמְשֹׁרְרִים וְהַשֹּׁעֲרִים
  choice: वह भाग जो लेवियों, गायकों और द्वारपालों के लिए निर्धारित था
  rationale: शाब्दिक रूप ‘आज्ञा’ है, पर भंडारित दशमांशों की सूची में यह उन समूहों के लिए विधान द्वारा निर्धारित हिस्से को सूचित करता है। ‘भाग’ को एकवचन रखना इब्रानी के सामूहिक एकवचन के अनुरूप है।
- source_word: תְרוּמַת הַכֹּהֲנִים
  choice: याजकों के लिए भेंट
  rationale: תְּרוּמָה अलग रखी गई देन या भेंट है। यह अनुवाद अनुष्ठान की ऐसी अतिरिक्त व्याख्या नहीं जोड़ता जो तत्काल वाक्य-विन्यास में स्पष्ट नहीं है।
theological_decisions:
- issue: מִצְוַת को अमूर्त ‘आज्ञा’ या निर्धारित हिस्से के रूप में समझना
  choice: मुख्य पाठ में ‘वह भाग जो ... के लिए निर्धारित था’
  alternative: ‘लेवियों, गायकों और द्वारपालों की आज्ञा’ अथवा ‘उनके विषय में आज्ञा’
  rationale: संग्रह-कक्ष में रखी उपज की सूची संकेत देती है कि आशय इन सेवकों को विधान के अनुसार मिलने वाले हिस्से से है; पादटिप्पणी शाब्दिक संरचना को खुला रखती है।
- issue: תְרוּמָה का अनुष्ठानिक अर्थ
  choice: भेंट
  alternative: उठाई हुई भेंट / अंशदान
  rationale: ‘भेंट’ आधुनिक पाठक के लिए सुबोध है और मूल के अलग रखे गए अंश के भाव को अत्यधिक संप्रदायगत शब्दावली के बिना रखता है।
translation_notes:
  register: भाषा आधुनिक, सरल और गरिमापूर्ण रखी गई है। ‘भंडार-कक्ष’, ‘अन्नबलि’, ‘दशमांश’ और ‘याजक’ जैसे शब्द मन्दिर के प्रसंग को बनाए रखते हैं, जबकि वाक्य-विन्यास सामान्य हिन्दी पाठक के लिए स्वाभाविक है।
