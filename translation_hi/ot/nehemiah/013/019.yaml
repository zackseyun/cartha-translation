  text: וַ/יְהִ֡י כַּ/אֲשֶׁ֣ר צָֽלֲלוּ֩ שַׁעֲרֵ֨י יְרוּשָׁלִַ֜ם לִ/פְנֵ֣י הַ/שַּׁבָּ֗ת וָ/אֹֽמְרָ/ה֙ וַ/יִּסָּגְר֣וּ הַ/דְּלָת֔וֹת וָ/אֹ֣מְרָ֔/ה אֲשֶׁר֙ לֹ֣א יִפְתָּח֔וּ/ם עַ֖ד אַחַ֣ר הַ/שַּׁבָּ֑ת וּ/מִ/נְּעָרַ֗/י הֶֽעֱמַ֨דְתִּי֙ עַל הַ/שְּׁעָרִ֔ים לֹא יָב֥וֹא מַשָּׂ֖א בְּ/י֥וֹם הַ/שַּׁבָּֽת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/013/019.yaml
  text: When the gates of Jerusalem began to grow dark[a] before the Sabbath, I ordered the doors shut and commanded that they not be opened until after the Sabbath. I stationed some of my servants[b] at the gates so that no load[c] would be brought in on the Sabbath day.
translation:
  language: hi
  text: जब सब्त (विश्राम-दिन) से पहले यरूशलेम के फाटकों पर अँधेरा छाने लगा[a], तब मैंने फाटकों के पल्ले बन्द करने का आदेश दिया और कहा कि उन्हें सब्त समाप्त होने के बाद तक न खोला जाए। मैंने अपने कुछ सेवकों[b] को फाटकों पर तैनात कर दिया, ताकि सब्त के दिन कोई बोझ[c] भीतर न लाया जाए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जब साँझ की छाया यरूशलेम के फाटकों पर पड़ने लगी।”
    reason: क्रिया अँधेरा होने अथवा साँझ की छाया पड़ने—दोनों प्रकार से समझी जा सकती है।
  - marker: b
    text: या, “अपने कुछ परिचारकों।” इस शब्द से नहेमायाह के निजी दल के सदस्य अभिप्रेत हो सकते हैं।
    reason: इब्रानी शब्द युवक, सेवक या परिचारक के अर्थ में प्रयुक्त हो सकता है।
  - marker: c
    text: आस-पास के प्रसंग में सब्त के दिन के व्यापार की चर्चा है, इसलिए इस बोझ में बिक्री के लिए लाया जा रहा माल भी शामिल हो सकता है।
    reason: यह सांस्कृतिक और प्रसंगगत जानकारी ठोस शब्द ‘बोझ’ के सम्भावित व्यापारिक आशय को स्पष्ट करती है।
lexical_decisions:
- source_word: צָלֲלוּ
  choice: अँधेरा छाने लगा
  rationale: यह क्रिया साँझ के समय अँधेरा या छाया पड़ने को सूचित करती है। हिन्दी में यह प्रयोग स्वाभाविक है और विश्राम-दिन आरम्भ होने से ठीक पहले के समय को स्पष्ट करता है।
- source_word: שַׁעֲרֵי יְרוּשָׁלִַם
  choice: यरूशलेम के फाटक
  rationale: सम्बन्धवाचक इब्रानी पदबंध का सीधा और स्वाभाविक हिन्दी रूप।
- source_word: לִפְנֵי הַשַּׁבָּת
  choice: विश्राम-दिन से पहले
  rationale: यह विश्राम-दिन आरम्भ होने से पहले का समय बताता है।
- source_word: וָאֹמְרָה
  choice: मैंने ... आदेश दिया / कहा
  rationale: मूल क्रिया का शाब्दिक अर्थ ‘कहा’ है, पर शासकीय प्रसंग में पहली आज्ञा का बल ‘आदेश दिया’ से स्वाभाविक रूप में व्यक्त होता है; दूसरी आवृत्ति में ‘कहा’ रखकर मूल की पुनरावृत्ति का संकेत भी बचाया गया है।
- source_word: וַיִּסָּגְרוּ הַדְּלָתוֹת
  choice: फाटकों के पल्ले बन्द करने
  rationale: דְּלָתוֹת यहाँ नगर के फाटकों में लगे बन्द होने वाले पल्लों को दर्शाता है; केवल ‘दरवाज़े’ कहने की अपेक्षा यह प्रसंग अधिक स्पष्ट करता है।
- source_word: אֲשֶׁר לֹא יִפְתָּחוּם
  choice: कि ... उन्हें न खोला जाए
  rationale: निषेधात्मक आदेश को स्वाभाविक हिन्दी कर्मवाच्य में प्रस्तुत किया गया है, जिससे ध्यान पल्लों पर बना रहता है।
- source_word: עַד אַחַר הַשַּׁבָּת
  choice: विश्राम-दिन बीतने तक
  rationale: अर्थ है कि फाटक विश्राम-दिन समाप्त होने के बाद ही खोले जाएँ; हिन्दी में यह स्पष्ट और सहज है।
- source_word: וּמִנְּעָרַי
  choice: अपने कुछ सेवकों
  rationale: נְעָרִים का अर्थ युवक भी हो सकता है, पर नहेमायाह के प्रशासनिक दल के प्रसंग में निजी सेवक या परिचारक अधिक सम्भाव्य है; ‘कुछ’ מִן के आंशिक अर्थ को व्यक्त करता है।
- source_word: הֶעֱמַדְתִּי
  choice: तैनात कर दिया
  rationale: सुरक्षा-व्यवस्था के प्रसंग में लोगों को नियत स्थान पर खड़ा करने का स्वाभाविक हिन्दी रूप।
- source_word: עַל הַשְּׁעָרִים
  choice: फाटकों पर
  rationale: यहाँ पूर्वसर्ग द्वार-स्थल पर पहरा देने के लिए नियुक्ति को सूचित करता है।
- source_word: לֹא יָבוֹא מַשָּׂא
  choice: कोई बोझ भीतर न लाया जाए
  rationale: मूल में ‘कोई बोझ न आए’ है; फाटकों के प्रसंग में भीतर लाए जाने का आशय निहित है। ‘बोझ’ ठोस मूल अर्थ को रखता है और उसे केवल व्यापारिक माल तक सीमित नहीं करता।
- source_word: בְּיוֹם הַשַּׁבָּת
  choice: विश्राम-दिन को
  rationale: ‘दिन’ का भाव ‘विश्राम-दिन’ में पहले से उपस्थित है; यह आधुनिक हिन्दी में सहज है।
theological_decisions:
- issue: שַׁבָּת का अनुवाद
  choice: विश्राम-दिन
  alternative: सब्त
  rationale: यह इस्राएल के वाचा-संबंधी साप्ताहिक शब्बात को दर्शाता है। ‘विश्राम-दिन’ साधारण हिन्दी पाठक के लिए अर्थपूर्ण है, जबकि प्रसंग उसकी विशिष्ट धार्मिक पहचान स्पष्ट रखता है; ‘सब्त’ अधिक पारिभाषिक विकल्प है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सहज रखी गई है। ‘फाटक’ और ‘पल्ले’ के भेद से שַׁעַר तथा דֶּלֶת का अन्तर स्पष्ट किया गया है। मूल की सम्भावित अस्पष्टताओं को पादटिप्पणियों में सुरक्षित रखा गया है।
