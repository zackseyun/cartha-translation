  text: And when they heard the law[a], they separated from Israel all the mixed multitude.
translation:
  language: hi
  text: जब उन्होंने व्यवस्था को सुना, तब उन्होंने इस्राएल से सारे मिश्रित जनसमूह[a] को अलग कर दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “मिश्रित वंश के सभी लोग” अथवा “मिली-जुली भीड़।” इब्रानी शब्द עֵרֶב किसी मिले-जुले समूह के लिए प्रयुक्त सामूहिक पद है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כְּשָׁמְעָם
  choice: जब उन्होंने ... सुना, तब
  rationale: वाव-क्रम और כְּ के साथ infinitive construct यहाँ अगली घटना का समय बताते हैं। हिंदी में ‘जब... तब...’ स्वाभाविक रूप से कथात्मक क्रम और काल-संबंध दोनों व्यक्त करता है।
- source_word: הַתּוֹרָה
  choice: व्यवस्था
  rationale: निर्वासनोत्तर वाचा-संदर्भ में यह सार्वजनिक रूप से पढ़ी गई मूसा की आधिकारिक तोराह/व्यवस्था को सूचित करता है। ‘व्यवस्था’ हिंदी बाइबलीय प्रयोग में स्पष्ट और गरिमापूर्ण है।
- source_word: וַיַּבְדִּילוּ
  choice: अलग कर दिया
  rationale: בדל का मूल अर्थ अलग करना है। यह अनुवाद कार्रवाई को व्यक्त करता है, पर उसके उद्देश्य या प्रक्रिया को ‘निकाल दिया’ जैसे अधिक व्याख्यात्मक शब्द से निर्धारित नहीं करता।
- source_word: כָל עֵרֶב
  choice: पूरे मिले-जुले समुदाय
  rationale: כָל सामूहिक संज्ञा עֵרֶב के साथ पूरे समूह को सूचित करता है। ‘मिले-जुले समुदाय’ सामूहिक अर्थ रखता है और अस्पष्टता बनाए रखता है कि मिश्रण वंश, जातीय पहचान या साथ जुड़े अन्य लोगों से संबंधित था।
- source_word: מִיִּשְׂרָאֵל
  choice: इस्राएल से
  rationale: מן अलगाव का स्रोत बताता है। ‘इस्राएल’ को समुदाय के वाचागत नाम के रूप में ज्यों का त्यों रखा गया है।
theological_decisions:
- issue: निर्वासनोत्तर सामुदायिक शुद्धता के संदर्भ में ‘इस्राएल’ का आशय
  choice: ‘इस्राएल’ को वाचा-समुदाय के नाम के रूप में बनाए रखना
  alternative: ‘इस्राएलियों में से’ या ‘इस्राएल की सभा से’
  rationale: मूल पाठ में व्यक्तिवाचक नाम יִשְׂרָאֵל है। इसे बनाए रखने से सामूहिक और वाचागत पहचान सुरक्षित रहती है तथा बाद की कोई धर्मवैज्ञानिक व्याख्या आरोपित नहीं होती।
- issue: עֵרֶב की पहचान
  choice: मुख्य पाठ में ‘मिले-जुले समुदाय’
  alternative: ‘मिश्रित वंश के सभी लोग’
  rationale: इब्रानी शब्द एक मिश्रित समूह के लिए सामूहिक पद है, पर इस पद में मिश्रण की सटीक प्रकृति स्पष्ट नहीं की गई। मुख्य पाठ उस अस्पष्टता को सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिंदी में स्वाभाविक, गरिमापूर्ण कथात्मक शैली अपनाई गई है। ‘व्यवस्था’ और ‘इस्राएल’ परिचित बाइबलीय शब्दावली के रूप में रखे गए हैं; ‘मिले-जुले समुदाय’ मूल की सामूहिकता और वास्तविक अर्थगत अस्पष्टता दोनों सुरक्षित रखता है।
