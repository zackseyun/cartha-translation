  edition: WLC
  text: זָכְרָ/ה לִּ֥/י אֱלֹהַ֖/י עַל זֹ֑את וְ/אַל תֶּ֣מַח חֲסָדַ֗/י אֲשֶׁ֥ר עָשִׂ֛יתִי בְּ/בֵ֥ית אֱלֹהַ֖/י וּ/בְ/מִשְׁמָרָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/013/014.yaml
  text: Remember me for this[a], my God[b], and do not wipe out my deeds of covenant faithfulness that I have done for the house of my God and for its services.
translation:
  language: hi
  text: हे मेरे परमेश्वर, इस बात के लिए मेरा स्मरण कर[a], और मेरे उन निष्ठापूर्ण कार्यों को[b] जो मैंने अपने परमेश्वर के भवन और उसकी सेवाओं के लिए किए हैं, मिटा न देना[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “इस बात के कारण मेरा स्मरण कर” या “इस बात के संबंध में मेरा स्मरण कर।”
    reason: lexical_alternative
  - marker: b
    text: “निष्ठापूर्ण कार्य” का अनुवाद “भलाई के काम,” “निष्ठा के काम,” या “करुणा के काम” भी हो सकता है। इब्रानी शब्द में दया, निष्ठा और वाचा के प्रति विश्वासयोग्यता के भाव हो सकते हैं।
    reason: lexical_alternative
  - marker: c
    text: “उसकी सेवाओं” का अर्थ परमेश्वर के भवन से जुड़ी जिम्मेदारियाँ, कर्तव्य या नियुक्त सेवाएँ भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: זָכְרָה לִּי
  choice: मुझे स्मरण रख
  rationale: परमेश्वर से की गई सीधी प्रार्थना है। ‘स्मरण रख’ आधुनिक हिन्दी में स्वाभाविक है और केवल याद आने की नहीं, अनुग्रहपूर्वक ध्यान देने की प्रार्थना का भाव भी बनाए रखता है।
- source_word: אֱלֹהַי
  choice: हे मेरे परमेश्वर
  rationale: प्रथम पुरुष एकवचन संबंधसूचक प्रत्यय और सीधे संबोधन, दोनों को स्पष्ट रूप से रखा गया है।
- source_word: עַל זֹאת
  choice: इस बात के लिए
  rationale: यह पिछले प्रसंग में बताए गए कार्य की ओर संकेत करता है और कारण अथवा आधार का भाव सुरक्षित रखता है।
- source_word: וְאַל תֶּמַח
  choice: मिटा न देना
  rationale: מחה का मूल बिंब किसी अभिलेख या स्मृति से मिटा देने का है; हिन्दी में ‘मिटा न देना’ इस रूपक को सहजता से रखता है।
- source_word: חֲסָדַי
  choice: मेरे निष्ठापूर्ण काम
  rationale: חסד में दया, निष्ठा और वाचा-संबंधी विश्वासयोग्यता का अर्थक्षेत्र है। यहाँ बहुवचन रूप और आगे का संबंधवाचक उपवाक्य किए गए कार्यों की ओर संकेत करते हैं; ‘निष्ठापूर्ण काम’ अर्थ को सहज हिन्दी में रखता है, जबकि पादटिप्पणी व्यापक अर्थक्षेत्र बताती है।
- source_word: אֲשֶׁר עָשִׂיתִי
  choice: जो ... मैंने ... किए हैं
  rationale: यह חֲסָדַי को स्पष्ट करने वाला संबंधवाचक उपवाक्य है; पूर्ण वर्तमान हिन्दी में पिछले कार्यों की वर्तमान प्रासंगिकता व्यक्त होती है।
- source_word: בְּבֵית אֱלֹהַי
  choice: अपने परमेश्वर के भवन ... के लिए
  rationale: मूल בְ स्थान अथवा संबंध सूचित कर सकता है; प्रसंग में कार्य परमेश्वर के भवन के हित और उससे संबंधित व्यवस्था के लिए किए गए हैं।
- source_word: וּבְמִשְׁמָרָיו
  choice: और उसकी सेवाओं के लिए
  rationale: מִשְׁמָר मंदिर से जुड़ी जिम्मेदारियों, कर्तव्यों या सेवाओं को दर्शाता है। ‘सेवाओं’ से उपासना-संबंधी प्रसंग स्वाभाविक रूप से व्यक्त होता है।
theological_decisions:
- issue: प्रथम पुरुष की प्रार्थना में חֲסָדַי का अर्थ
  choice: मेरे निष्ठापूर्ण काम
  alternative: मेरे भलाई के काम / मेरी करुणाएँ / मेरी वाचा-निष्ठा के काम
  rationale: पाठ नहेमायाह के मंदिर-संबंधी निष्ठापूर्ण कार्यों को स्मरण रखने की प्रार्थना प्रस्तुत करता है। यह अनुवाद निष्ठा का वजन बनाए रखता है, पर ऐसा कोई सिद्धान्त नहीं जोड़ता कि इन कामों से परमेश्वर के सामने पुण्य कमाया गया।
- issue: प्रार्थना का संभावित आत्म-पुण्यकारी स्वर
  choice: अपने किए हुए कामों को स्मरण रखने की सीधी विनती को यथावत रखना
  alternative: आत्म-संदर्भ कम करने के लिए भावानुवाद करना
  rationale: इब्रानी पाठ स्पष्ट रूप से नहेमायाह की अपने कार्यों को न मिटाने की विनती रखता है। धर्मवैचारिक असुविधा दूर करने के लिए इस तनाव को नरम नहीं किया गया।
translation_notes:
  register: भाषा आधुनिक, प्रार्थनापूर्ण और गरिमामय रखी गई है। ‘परमेश्वर का भवन’ मंदिर के लिए पारंपरिक किन्तु सामान्यतः बोधगम्य पद है। मुख्य पाठ में कठिन ‘वाचा-निष्ठा’ के बजाय ‘निष्ठापूर्ण काम’ रखा गया है और अर्थ की व्यापकता पादटिप्पणी में सुरक्षित की गई है।
