  text: וָ/אָרִ֕יבָ/ה אֵ֖ת חֹרֵ֣י יְהוּדָ֑ה וָ/אֹמְרָ֣/ה לָ/הֶ֗ם מָֽה הַ/דָּבָ֨ר הָ/רָ֤ע הַ/זֶּה֙ אֲשֶׁ֣ר אַתֶּ֣ם עֹשִׂ֔ים וּֽ/מְחַלְּלִ֖ים אֶת י֥וֹם הַ/שַּׁבָּֽת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/013/017.yaml
  text: So I contended with the nobles of Judah and said to them[a], “What is this evil thing that you are doing, profaning the Sabbath day?”
translation:
  language: hi
  text: तब मैंने यहूदा के प्रतिष्ठित लोगों को डाँटा और उनसे कहा, “यह कैसा बुरा काम है जो तुम कर रहे हो? तुम सब्त के दिन को अपवित्र कर रहे हो![a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “सब्त के दिन की पवित्रता भंग कर रहे हो” अथवा “सब्त के दिन का उल्लंघन कर रहे हो।” इब्रानी क्रिया का भाव है किसी पवित्र वस्तु या समय को साधारण अथवा अपवित्र मानना।
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאָרִיבָה
  choice: तब मैंने ... डाँटा
  rationale: ריב यहाँ विरोध करते हुए कड़ी फटकार देने का भाव रखता है। ‘डाँटा’ आधुनिक हिंदी में स्वाभाविक है और प्रसंग के टकरावपूर्ण बल को व्यक्त करता है, बिना इसे औपचारिक मुकदमा ठहराए। आरंभिक वाव को कथानक-संबंधी ‘तब’ से व्यक्त किया गया है।
- source_word: חֹרֵי יְהוּדָה
  choice: यहूदा के प्रतिष्ठित लोगों
  rationale: חֹרִים सामाजिक रूप से प्रमुख अथवा कुलीन अगुओं को दर्शाता है। ‘प्रतिष्ठित लोगों’ सामान्य आधुनिक पाठक के लिए स्पष्ट है और पदवी को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: וָאֹמְרָה לָהֶם
  choice: और उनसे कहा
  rationale: यह इब्रानी कथानक की सीधी निरंतरता को स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: מָה הַדָּבָר הָרָע הַזֶּה
  choice: यह कैसा बुरा काम है
  rationale: דָּבָר यहाँ ‘काम/बात’ और רָע नैतिक बुराई का संकेत देता है। ‘बुरा काम’ हिंदी में स्वाभाविक रहते हुए नैतिक निंदा बनाए रखता है।
- source_word: אֲשֶׁר אַתֶּם עֹשִׂים
  choice: जो तुम कर रहे हो
  rationale: वर्तमान कृदंत से व्यक्त जारी क्रिया को सीधे और स्वाभाविक ढंग से प्रस्तुत करता है।
- source_word: וּמְחַלְּלִים
  choice: अपवित्र कर रहे हो
  rationale: חלל पवित्र वस्तु या समय को साधारण अथवा अपवित्र मानने का भाव देता है। ‘अपवित्र करना’ हिंदी में धार्मिक-नैतिक भार को स्पष्ट रूप से सुरक्षित रखता है।
- source_word: אֶת יוֹם הַשַּׁבָּת
  choice: सब्त के दिन को
  rationale: यह יוֹם और שַׁבָּת दोनों को सुरक्षित रखते हुए आधुनिक हिंदी में सहज रूप है।
theological_decisions:
- issue: सब्त के उल्लंघन के लिए प्रयुक्त पवित्रता-संबंधी भाषा
  choice: सब्त के दिन को अपवित्र कर रहे हो
  alternative: सब्त के दिन का उल्लंघन कर रहे हो / सब्त के दिन की पवित्रता भंग कर रहे हो
  rationale: मूल क्रिया केवल नियम तोड़ने की बात नहीं करती, बल्कि पवित्र ठहराए गए समय को साधारण या अपवित्र मानने का भाव रखती है। ‘अपवित्र’ इस धार्मिक तनाव को संक्षेप और स्पष्टता से बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘कुलीनों’ की अपेक्षा ‘प्रतिष्ठित लोगों’ और ‘झगड़ा किया’ की अपेक्षा प्रसंगानुकूल ‘डाँटा’ चुना गया है।
