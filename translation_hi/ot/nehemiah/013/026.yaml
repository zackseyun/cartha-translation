source:
  edition: WLC
  text: הֲ/ל֣וֹא עַל אֵ֣לֶּה חָטָֽא שְׁלֹמֹ֣ה מֶ֣לֶךְ יִשְׂרָאֵ֡ל וּ/בַ/גּוֹיִ֣ם הָ/רַבִּים֩ לֹֽא הָיָ֨ה מֶ֜לֶךְ כָּמֹ֗/הוּ וְ/אָה֤וּב לֵֽ/אלֹהָי/ו֙ הָיָ֔ה וַ/יִּתְּנֵ֣/הוּ אֱלֹהִ֔ים מֶ֖לֶךְ עַל כָּל יִשְׂרָאֵ֑ל גַּם אוֹת֣/וֹ הֶחֱטִ֔יאוּ הַ/נָּשִׁ֖ים הַ/נָּכְרִיּֽוֹת־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/013/026.yaml
  text: Was it not because of these things that Solomon king of Israel sinned? Yet among the many nations there was no king like him[a], and he was loved by his God, and God made him king over all Israel. Even him foreign women caused to sin.
translation:
  language: hi
  text: क्या इस्राएल के राजा सुलैमान ने इन्हीं बातों के कारण पाप नहीं किया था? बहुत-से राष्ट्रों में उसके समान कोई राजा नहीं था। वह अपने परमेश्वर का प्रिय था, और परमेश्वर ने उसे सारे इस्राएल का राजा बनाया था। फिर भी विदेशी स्त्रियों[a] ने उसे भी पाप कराया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “विदेशी पत्नियों।” इब्रानी में शाब्दिक रूप से “विदेशी स्त्रियों” है; सुलैमान की कथा के प्रसंग में “पत्नियों” का अर्थ संभव है, पर इस पद में यह शब्द स्पष्ट रूप से नहीं आया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלוֹא עַל אֵלֶּה
  choice: क्या ... इन्हीं बातों के कारण ... नहीं
  rationale: नकारात्मक आलंकारिक प्रश्न को हिन्दी में स्वाभाविक ढंग से रखा गया है; ‘इन्हीं बातों’ कारणसूचक עַל और संकेतवाचक אֵלֶּה को व्यक्त करता है।
- source_word: חָטָא
  choice: पाप किया
  rationale: नैतिक और धार्मिक प्रसंग में חטא का स्पष्ट तथा प्रचलित हिन्दी रूप।
- source_word: וּבַגּוֹיִם הָרַבִּים לֹא הָיָה מֶלֶךְ כָּמֹהוּ
  choice: बहुत-से राष्ट्रों में उसके समान कोई राजा नहीं था
  rationale: तुलनात्मक कथन और बहुवचन ‘राष्ट्रों’ को सीधे, स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: וְאָהוּב לֵאלֹהָיו הָיָה
  choice: वह अपने परमेश्वर का प्रिय था
  rationale: אָהוּב की प्रिय/प्रेम-पात्र होने की अवस्था और प्रत्यययुक्त ‘उसका परमेश्वर’ दोनों व्यक्त होते हैं।
- source_word: וַיִּתְּנֵהוּ אֱלֹהִים מֶלֶךְ
  choice: परमेश्वर ने उसे ... राजा बनाया था
  rationale: נתן यहाँ किसी को राजकीय पद देने या नियुक्त करने के अर्थ में है; ‘राजा बनाया’ सहज और अर्थसंगत है।
- source_word: גַּם אוֹתוֹ
  choice: उसे भी
  rationale: आगे रखे गए कर्म पर दिए गए इब्रानी बल को हिन्दी के ‘भी’ से व्यक्त किया गया है।
- source_word: הֶחֱטִיאוּ
  choice: पाप में डाल दिया
  rationale: חטא के हिफ़ील रूप का कारक अर्थ व्यक्त करता है, बिना प्रलोभन की किसी अतिरिक्त प्रक्रिया को पाठ में जोड़ने के।
- source_word: הַנָּשִׁים הַנָּכְרִיּוֹת
  choice: विदेशी स्त्रियों
  rationale: ‘स्त्रियाँ’ נָשִׁים का प्रत्यक्ष अर्थ है और ‘विदेशी’ נָכְרִיּוֹת को स्पष्ट करता है; ‘पत्नियाँ’ प्रसंग से संभव है, पर इस पद में स्पष्ट नहीं।
theological_decisions:
- issue: सुलैमान के पाप का कारण
  choice: विदेशी स्त्रियों ने उसे भी पाप में डाल दिया
  alternative: विदेशी स्त्रियों ने उसे बहकाया / उसकी विदेशी पत्नियों ने उसे पाप कराया
  rationale: मूल पाठ का कारक क्रियारूप उन स्त्रियों की भूमिका बताता है, पर यह नहीं बताता कि उन्होंने किस रीति से ऐसा किया; अनुवाद उस अतिरिक्त व्याख्या को नहीं जोड़ता।
- issue: אֱלֹהִים और לֵאלֹהָיו का भेद
  choice: अपने परमेश्वर का ... परमेश्वर ने
  alternative: यहोवा का ... यहोवा ने
  rationale: पहले प्रयोग में संबंधवाचक प्रत्यय है और दूसरे में केवल אֱלֹהִים; मूल में दिव्य नाम יהוה नहीं है, इसलिए ‘यहोवा’ जोड़ना अनुचित होगा।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण कथात्मक रूप अपनाया गया है। आलंकारिक प्रश्न, सुलैमान की विशिष्टता, परमेश्वर के प्रेम और उसके पतन के बीच का तनाव बनाए रखा गया है।
