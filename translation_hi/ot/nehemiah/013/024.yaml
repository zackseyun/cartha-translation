  text: וּ/בְנֵי/הֶ֗ם חֲצִי֙ מְדַבֵּ֣ר אַשְׁדּוֹדִ֔ית וְ/אֵינָ֥/ם מַכִּירִ֖ים לְ/דַבֵּ֣ר יְהוּדִ֑ית וְ/כִ/לְשׁ֖וֹן עַ֥ם וָ/עָֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/013/024.yaml
  text: And half of their children spoke Ashdodite[a], and they were not able to speak Judean, but only the language of one people or another.
translation:
  language: hi
  text: और उनके आधे बच्चे अशदोदी भाषा बोलते थे, और वे यहूदी भाषा बोलना नहीं जानते थे, बल्कि अलग-अलग लोगों की भाषा बोलते थे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבְנֵיהֶם
  choice: और उनके बच्चे
  rationale: בנים यहाँ मिश्रित परिवारों की संतान के लिए है; ‘बच्चे’ स्वाभाविक है और अर्थ को केवल पुत्रों तक सीमित नहीं करता।
- source_word: חֲצִי מְדַבֵּר
  choice: आधे ... बोलते थे
  rationale: एकवचन कृदंत सामूहिक ‘आधे’ के साथ बच्चों के एक हिस्से की सामान्य भाषिक स्थिति बताता है।
- source_word: אַשְׁדּוֹדִית
  choice: अशदोदी भाषा
  rationale: यह स्त्रीलिंग जातिवाचक रूप अशदोद से जुड़ी बोली अथवा भाषा को सूचित करता है; हिंदी में ‘अशदोदी भाषा’ स्पष्ट और स्वाभाविक है।
- source_word: וְאֵינָם מַכִּירִים לְדַבֵּר
  choice: बोलना नहीं जानते थे
  rationale: הכיר + क्रियार्थक रूप यहाँ किसी भाषा को बोलने का ज्ञान/सामर्थ्य व्यक्त करता है। ‘नहीं जानते थे’ मूल की संज्ञानात्मक छाया और व्यावहारिक अक्षमता दोनों को सहज हिंदी में रखता है।
- source_word: יְהוּדִית
  choice: यहूदी भाषा
  rationale: यह शब्द यहूदा के लोगों की भाषा का नाम है। ‘यहूदी भाषा’ पारंपरिक और समझने योग्य है; इसे सीधे ‘इब्रानी’ कहना मूल से अधिक विशिष्ट होता।
- source_word: וְכִלְשׁוֹן עַם וָעָם
  choice: बल्कि अलग-अलग लोगों की भाषा बोलते थे
  rationale: עם ועם की पुनरुक्ति वितरणात्मक अर्थ देती है—एक-एक समुदाय की भाषा। हिंदी में यह आसपास के विभिन्न समुदायों की भाषाओं को स्वाभाविक रूप से व्यक्त करता है; ‘केवल’ नहीं जोड़ा गया क्योंकि वह मूल में स्पष्ट नहीं है।
theological_decisions: []
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘अशदोदी भाषा’ और ‘यहूदी भाषा’ जातीय-भाषिक पदों को किसी आधुनिक भाषावैज्ञानिक पहचान में सीमित किए बिना प्रस्तुत करते हैं। अंतिम वाक्यांश की कुछ वाक्यगत अस्पष्टता को पठनीय हिंदी में वितरणात्मक अर्थ के साथ व्यक्त किया गया है।
