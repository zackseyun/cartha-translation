  text: גַּ֣ם בַּ/יָּמִ֣ים הָ/הֵ֗ם רָאִ֤יתִי אֶת הַ/יְּהוּדִים֙ הֹשִׁ֗יבוּ נָשִׁים֙ אשדודיות עמוניות מוֹאֲבִיּֽוֹת׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/013/023.yaml
  text: Also in those days I saw the Jews who had married women of Ashdod[a], Ammonite women[b], and Moabite women.
translation:
  language: hi
  text: उन दिनों मैंने उन यहूदियों[a] को भी देखा था, जिन्होंने अशदोद की, अम्मोनी और मोआबी स्त्रियों से विवाह किया था[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “यहूदिया के लोग।”
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “स्त्रियों को बसाया था”; यहाँ इब्रानी अभिव्यक्ति का अर्थ उनसे विवाह करना या उन्हें पत्नी बनाना है।
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם בַּיָּמִים הָהֵם
  choice: उन दिनों...भी
  rationale: यह पदांश पहले वर्णित सुधार-वृत्तांत में एक और बात जोड़ता है। हिंदी में विभक्त रूप ‘उन दिनों...भी’ काल और योगात्मक बल दोनों को स्वाभाविक रूप से व्यक्त करता है।
- source_word: רָאִיתִי
  choice: मैंने...देखा
  rationale: साधारण प्रत्यक्षदर्शी क्रिया को बनाए रखता है और नहेमायाह के प्रथम-पुरुष वृत्तांत के स्वर को सुरक्षित रखता है।
- source_word: אֶת הַיְּהוּדִים
  choice: ऐसे यहूदियों को
  rationale: הַיְּהוּדִים निर्वासनोत्तर यहूदी समुदाय के लोगों को सूचित करता है। संबंधवाचक उपवाक्य के साथ ‘ऐसे...जिन्होंने’ वर्तमान हिंदी में स्पष्ट और स्वाभाविक है; ‘ऐसे’ कोई अतिरिक्त संख्या निर्धारित नहीं करता।
- source_word: הֹשִׁיבוּ נָשִׁים
  choice: स्त्रियों से विवाह कर लिया था
  rationale: ישׁב का हिफ़ील रूप मूलतः ‘बसाना/रहने देना’ है, पर यहाँ स्त्रियों के साथ प्रयुक्त होकर पत्नी बनाने या विवाह करने का भाव देता है। चुना हुआ हिंदी वाक्यांश प्रसंगगत अर्थ स्पष्ट करता है, जबकि पादटिप्पणी शाब्दिक रूप की जानकारी देती है।
- source_word: אשדודיות עמוניות מוֹאֲבִיּוֹת
  choice: अशदोदी, अम्मोनी और मोआबी स्त्रियों
  rationale: तीनों स्त्रीलिंग जातिवाचक विशेषणों को हिंदी के प्रचलित बाइबलीय भू-जातीय रूपों में रखा गया है और साझा संज्ञा ‘स्त्रियों’ अंत में दी गई है।
theological_decisions:
- issue: הַיְּהוּדִים का सामुदायिक या भौगोलिक अर्थ
  choice: यहूदी
  alternative: यहूदिया के लोग
  rationale: इस प्रसंग में निर्वासनोत्तर वाचा-समुदाय प्रमुख संदर्भ है, इसलिए ‘यहूदी’ अधिक सहज है; फिर भी संभावित भौगोलिक अर्थ पादटिप्पणी में सुरक्षित रखा गया है।
- issue: הֹשִׁיבוּ נָשִׁים का मुहावरेदार अर्थ
  choice: स्त्रियों से विवाह कर लिया था
  alternative: स्त्रियों को बसा लिया था / पत्नी बना लिया था
  rationale: आसपास का प्रसंग वैवाहिक संबंधों का है। ‘विवाह कर लिया था’ आशय को स्पष्ट करता है, पर मूल अभिव्यक्ति के असामान्य शाब्दिक रूप को पादटिप्पणी में बनाए रखता है और इससे आगे कोई धार्मिक निष्कर्ष नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिंदी में सहज किंतु गरिमापूर्ण ऐतिहासिक-वृत्तांत शैली अपनाई गई है। जातिवाचक शब्दों के लिए संक्षिप्त और परिचित रूप रखे गए हैं; मूल इब्रानी की वास्तविक शाब्दिक अस्पष्टता पादटिप्पणियों में सुरक्षित है।
