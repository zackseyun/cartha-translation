base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/013/010.yaml
  text: And I learned that the portions of the Levites had not been given[b][a], so the Levites and the singers who did the work had each fled to his field.
translation:
  language: hi
  text: और मुझे यह पता चला कि लेवियों के हिस्से[a] नहीं दिए गए थे; इसलिए लेवी और गायक, जो काम करते थे, अपने-अपने खेतों की ओर भाग गए थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘लेवियों के लिए निर्धारित हिस्से।’
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֵדְעָה
  choice: और मुझे पता चला
  rationale: इस प्रसंग में ידע किसी परिस्थिति की जानकारी मिलने को व्यक्त करता है; ‘मुझे पता चला’ आधुनिक हिंदी में स्वाभाविक है।
- source_word: מְנָיוֹת הַלְוִיִּם
  choice: लेवियों के हिस्से
  rationale: מְנָיוֹת से उनके लिए निर्धारित भरण-पोषण अथवा अंश अभिप्रेत हैं; संबंधवाचक रचना मूल के construct phrase को सहज हिंदी में रखती है।
- source_word: לֹא נִתָּנָה
  choice: नहीं दिए गए थे
  rationale: निष्क्रिय अर्थ को बनाए रखते हुए हिंदी में बहुवचन ‘हिस्से’ के साथ स्वाभाविक अन्वय किया गया है।
- source_word: וַיִּבְרְחוּ אִישׁ לְשָׂדֵהוּ
  choice: हर एक अपने खेत में भाग गए थे
  rationale: ‘हर एक’ אִישׁ का वितरणात्मक भाव और ‘अपने खेत में’ לְשָׂדֵהוּ का अर्थ व्यक्त करता है; ‘भाग गए’ ברח की तीव्रता बनाए रखता है।
- source_word: וְהַמְשֹׁרְרִים
  choice: और गायक
  rationale: मूल केवल ‘गायक’ कहता है; मंदिर का संदर्भ प्रसंग से स्पष्ट है, इसलिए अतिरिक्त विशेषण नहीं जोड़ा गया।
- source_word: עֹשֵׂי הַמְּלָאכָה
  choice: सेवा का काम करनेवाले
  rationale: शाब्दिक अर्थ ‘काम करनेवाले’ है; मंदिर के निकट प्रसंग में ‘सेवा का काम’ हिंदी पाठक को कार्य का संदर्भ स्पष्ट करता है, बिना कोई विशिष्ट पद जोड़ने के।
