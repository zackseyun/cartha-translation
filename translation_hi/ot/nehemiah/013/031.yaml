source:
  edition: WLC
  text: וּ/לְ/קֻרְבַּ֧ן הָ/עֵצִ֛ים בְּ/עִתִּ֥ים מְזֻמָּנ֖וֹת וְ/לַ/בִּכּוּרִ֑ים זָכְרָ/ה לִּ֥/י אֱלֹהַ֖/י לְ/טוֹבָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/013/031.yaml
  text: And for the offering of wood at appointed times[a], and for the firstfruits—remember me, my God, for good.
translation:
  language: hi
  text: और ठहराए हुए समयों पर लकड़ी के अर्पण और पहली उपज के अर्पण के लिए भी प्रबंध किया। हे मेरे परमेश्वर, मुझे भलाई के लिए स्मरण कर।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: קֻרְבַּן הָעֵצִים
  choice: लकड़ी की भेंट
  rationale: यह मंदिर और वेदी के उपयोग के लिए नियत लकड़ी की धार्मिक भेंट को सूचित करता है; यह अभिव्यक्ति मूल की संक्षिप्तता और उपासना-संबंधी अर्थ दोनों बनाए रखती है।
- source_word: בְּעִתִּים מְזֻמָּנוֹת
  choice: ठहराए हुए समयों पर
  rationale: यह औपचारिक रूप से निश्चित किए गए अवसरों का स्वाभाविक और स्पष्ट हिन्दी रूप है।
- source_word: בִּכּוּרִים
  choice: पहली उपज
  rationale: यह परमेश्वर को अर्पित उपज के पहले भाग का अर्थ सामान्य पाठक के लिए स्पष्ट रूप से व्यक्त करता है।
- source_word: זָכְרָה לִּי
  choice: मुझे ... स्मरण कर
  rationale: नहेमायाह की बार-बार आने वाली प्रार्थना का सीधा रूप रखते हुए परमेश्वर से अनुकूल स्मरण की विनती व्यक्त करता है।
- source_word: אֱלֹהַי
  choice: हे मेरे परमेश्वर
  rationale: सम्बोधन और व्यक्तिगत संबंध दोनों को स्पष्ट रूप से सुरक्षित रखता है।
- source_word: לְטוֹבָה
  choice: भलाई के लिए
  rationale: मूल की संक्षिप्तता और अर्थगत खुलापन बनाए रखता है; यह तय नहीं करता कि अभिप्राय अनुग्रह, आशीष या हितकारी परिणाम में से विशेषतः कौन-सा है।
theological_decisions:
- issue: उपासना-संबंधी पदबंध קֻרְבַּן הָעֵצִים
  choice: लकड़ी की भेंट
  alternative: लकड़ी पहुँचाने का प्रबंध
  rationale: ‘लकड़ी की भेंट’ मंदिर के लिए लकड़ी की नियत आपूर्ति और उसके धार्मिक स्वरूप दोनों को सुरक्षित रखती है; पादटिप्पणी संदर्भ स्पष्ट करती है।
- issue: अंतिम विनती לְטוֹבָה
  choice: भलाई के लिए
  alternative: कृपा के साथ
  rationale: यह मूल के धर्मवैचारिक संयम को बनाए रखता है और अनुकूल स्मरण के ठीक स्वरूप को अनावश्यक रूप से निर्धारित नहीं करता।
- issue: आरंभिक וּלְ־ पदबंधों में निहित क्रिया
  choice: के लिए भी प्रबंध किया
  alternative: और ... के लिए
  rationale: पद में स्वतंत्र क्रिया नहीं है और यह पहले के कार्यों की सूची को आगे बढ़ाता है। हिन्दी में पूर्ण वाक्य और स्वाभाविक अर्थ के लिए संदर्भानुकूल ‘प्रबंध किया’ जोड़ा गया है, बिना यह बदले कि नहेमायाह ने इन व्यवस्थाओं को सुनिश्चित किया।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज शैली रखी गई है। ‘ठहराए हुए समयों,’ ‘पहली उपज’ और ‘भलाई के लिए स्मरण कर’ में मूल की संक्षिप्तता तथा प्रार्थनात्मक स्वर सुरक्षित हैं। आरंभिक खंड को पिछले संदर्भ से जुड़ी सूची मानकर हिन्दी में निहित क्रिया ‘प्रबंध किया’ स्पष्ट की गई है।
