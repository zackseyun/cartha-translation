base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/013/011.yaml
  text: So I contended with the officials and said[b][a], “Why has the house of God been neglected?” Then I gathered them and stationed them at their posts.
translation:
  language: hi
  text: तब मैंने अधिकारियों से विवाद किया और कहा, “परमेश्वर के भवन की उपेक्षा क्यों की गई है[a]?” फिर मैंने उन्हें इकट्ठा किया और उन्हें उनके स्थानों पर तैनात किया[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “परमेश्वर का भवन क्यों छोड़ दिया गया है?” इब्रानी कर्मवाच्य क्रिया का अर्थ ‘छोड़ देना’ या ‘त्याग देना’ भी हो सकता है; यहाँ प्रसंग मन्दिर की सेवा और उसके लिए सहायता की उपेक्षा की ओर संकेत करता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “उन्हें उनके स्थान पर खड़ा कर दिया।” इसका आशय लेवियों और सम्बन्धित सेवकों को उनके निर्धारित पदों या सेवाओं में फिर से लगाने से है।
    reason: lexical_alternative
lexical_decisions:
