  choice: मैंने … से विवाद किया
  rationale: ריב का अर्थ किसी से वाद-विवाद या टकराव करना है। यह अनुवाद विरोध की तीव्रता बनाए रखता है, पर इसे केवल डाँटने तक सीमित नहीं करता।
- source_word: הַסְּגָנִים
  choice: अधिकारियों
  rationale: סְגָנִים अधीनस्थ प्रशासनिक अगुओं या पदाधिकारियों को दर्शाता है; आधुनिक हिन्दी में ‘अधिकारी’ स्पष्ट और स्वाभाविक है।
- source_word: נֶעֱזַב
  choice: उपेक्षा की गई है
  rationale: עזב के इस कर्मवाच्य रूप का मूल भाव छोड़ देना है। प्रसंग में भवन को पूरी तरह त्यागने की अपेक्षा उसकी सेवा और सहायता की उपेक्षा प्रमुख है।
- source_word: בֵּית הָאֱלֹהִים
  choice: परमेश्वर के भवन
  rationale: यह इब्रानी अभिव्यक्ति को निकटता से रखता है और उसे व्याख्यात्मक रूप से केवल ‘मन्दिर’ में नहीं बदलता।
- source_word: וָאֶקְבְּצֵם
  choice: मैंने उन्हें इकट्ठा किया
  rationale: קבץ का सीधा अर्थ इकट्ठा या एकत्र करना है; यहाँ यह स्वाभाविक हिन्दी कथन है।
- source_word: וָאַעֲמִדֵם עַל עָמְדָם
  choice: उनके अपने-अपने काम पर नियुक्त कर दिया
  rationale: शाब्दिक रूप से यह उन्हें उनके स्थान पर खड़ा करने की अभिव्यक्ति है; प्रसंग में आशय उन्हें फिर उनकी निर्धारित सेवा में लगाने से है।
