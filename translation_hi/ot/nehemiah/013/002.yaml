source:
  edition: WLC
  text: כִּ֣י לֹ֧א קִדְּמ֛וּ אֶת בְּנֵ֥י יִשְׂרָאֵ֖ל בַּ/לֶּ֣חֶם וּ/בַ/מָּ֑יִם וַ/יִּשְׂכֹּ֨ר עָלָ֤י/ו אֶת בִּלְעָם֙ לְ/קַֽלְל֔/וֹ וַ/יַּהֲפֹ֧ךְ אֱלֹהֵ֛י/נוּ הַ/קְּלָלָ֖ה לִ/בְרָכָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/013/002.yaml
  text: because they did not meet the sons of Israel with bread and water[a], and hired Balaam against them to curse them, but our God turned the curse into a blessing.
translation:
  language: hi
  text: क्योंकि वे रोटी और पानी लेकर इस्राएल के पुत्रों से मिलने नहीं आए, और उन्हें शाप देने के लिए बिलाम को उनके विरुद्ध भाड़े पर रखा[a]; परन्तु हमारे परमेश्वर ने शाप को आशीष में बदल दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: हिब्रू में शाब्दिक रूप से ‘उसे शाप देने के लिए’ है; यहाँ इस्राएल को एक सामूहिक एकवचन माना गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: קִדְּמוּ
  choice: मिलने नहीं आए
  rationale: यह क्रिया आगे बढ़कर किसी से मिलने या उसका स्वागत करने का ठोस भाव रखती है; ‘मिलने नहीं आए’ इसे स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: इस्राएल के पुत्रों
  rationale: हिब्रू की स्पष्ट पुत्र-संज्ञा को बनाए रखा गया है, यद्यपि ‘इस्राएलियों’ अधिक मुहावरेदार विकल्प है।
- source_word: בַּלֶּחֶם וּבַמָּיִם
  choice: रोटी और पानी लेकर
  rationale: मूल पाठ दोनों आवश्यक वस्तुओं को विशेष रूप से नाम देता है; ‘लेकर’ साधन/साथ के अर्थ को स्वाभाविक हिन्दी में स्पष्ट करता है।
- source_word: וַיִּשְׂכֹּר עָלָיו אֶת־בִּלְעָם
  choice: बिलाम को उनके विरुद्ध भाड़े पर बुलाया
  rationale: क्रिया का अर्थ भुगतान करके सेवा लेना है। हिब्रू में कर्ता एकवचन है पर व्यक्त नहीं किया गया; हिन्दी में भी उसे अनकहा रखकर ऐतिहासिक संकेत की अस्पष्टता बचाई गई है।
- source_word: לְקַלְלוֹ
  choice: उन्हें शाप देने के लिए
  rationale: हिब्रू प्रत्यय व्याकरणतः एकवचन है और सामूहिक इस्राएल को सूचित करता है; हिन्दी में जनसमूह के लिए ‘उन्हें’ अधिक स्वाभाविक है, जबकि रूपगत एकवचन को पादटिप्पणी में बताया गया है।
- source_word: וַיַּהֲפֹךְ
  choice: बदल दिया
  rationale: शाप से आशीष में परिवर्तन को सीधी और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: אֱלֹהֵינוּ
  choice: हमारे परमेश्वर
  rationale: मूल का प्रथम-पुरुष बहुवचन संबंधसूचक प्रत्यय स्पष्ट रूप से सुरक्षित है।
- source_word: הַקְּלָלָה לִבְרָכָה
  choice: उस शाप को आशीष में
  rationale: हिब्रू के परिवर्तन-वाचक विन्यास और शाप-आशीष के विरोध को स्वाभाविक हिन्दी में बनाए रखता है।
theological_decisions:
- issue: इस्राएल के लिए पुत्र-संज्ञा
  choice: इस्राएल के पुत्रों
  alternative: इस्राएलियों / इस्राएल के लोगों
  rationale: मूल हिब्रू की स्पष्ट पुरुषवाची पारिवारिक अभिव्यक्ति को औपचारिक रूप से सुरक्षित रखा गया है।
- issue: शाप के कर्म में सामूहिक एकवचन
  choice: उन्हें शाप देने के लिए
  alternative: उसे शाप देने के लिए
  rationale: हिब्रू इस्राएल को सामूहिक एकवचन मानता है; मुख्य पाठ में स्वाभाविक हिन्दी बहुवचन रखा गया और रूपगत भेद पादटिप्पणी में सुरक्षित किया गया।
- issue: भाड़े पर बुलाने वाली क्रिया का अनकहा एकवचन कर्ता
  choice: और ... बिलाम को ... भाड़े पर बुलाया
  alternative: और उसने ... बिलाम को ... भाड़े पर बुलाया / और उन्होंने ... बुलाया
  rationale: मूल में क्रिया एकवचन है, पर संज्ञात्मक कर्ता नहीं दिया गया। ‘उसने’ जोड़ने से सम्भवतः बालाक की पहचान स्पष्ट हो जाती, जबकि ‘उन्होंने’ संख्या बदल देता; अतः हिन्दी में कर्ता अनकहा रखा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सहज कथात्मक रूप। ‘परन्तु’ बाइबलीय औपचारिकता बनाए रखता है; वाक्य में अनावश्यक व्याख्यात्मक कर्ता नहीं जोड़ा गया।
