id: NEH.4.10
reference: Nehemiah 4:10
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יְהִ֣י מִן הַ/יּ֣וֹם הַ/ה֗וּא חֲצִ֣י נְעָרַ/י֮ עֹשִׂ֣ים בַּ/מְּלָאכָה֒ וְ/חֶצְיָ֗/ם מַחֲזִיקִים֙ וְ/הָ/רְמָחִ֣ים הַ/מָּגִנִּ֔ים וְ/הַ/קְּשָׁת֖וֹת וְ/הַ/שִּׁרְיֹנִ֑ים וְ/הַ֨/שָּׂרִ֔ים אַחֲרֵ֖י כָּל בֵּ֥ית יְהוּדָֽה׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/004/010.yaml
  text: And from that day on[a], half of my young men were doing the work, and half of them were holding the spears, the shields, the bows, and the armor[c][b]; and the officers were behind all the house of Judah.
translation:
  language: hi
  text: उस दिन से मेरे आधे सेवक[a] काम में लगे थे, और बाकी आधे भाले, ढालें, धनुष और कवच[b] थामे हुए थे; और अधिकारी यहूदा के पूरे घराने के पीछे थे।[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘मेरे सेवक’ के स्थान पर ‘मेरे युवक’ या ‘मेरे परिचारक’ भी हो सकता है; इब्रानी शब्द प्रसंग के अनुसार इन अर्थों में प्रयुक्त होता है।
    reason: lexical_alternative
  - marker: b
    text: ‘कवच’ से आशय शरीर की रक्षा के लिए पहना जाने वाला कवच है; इसका अनुवाद ‘जालीदार कवच’ या ‘वक्ष-कवच’ भी किया जा सकता है।
    reason: lexical_alternative
  - marker: c
    text: अधिकारियों का यहूदा के पूरे घराने के पीछे होना संभवतः उनकी सैन्य सहायता या निगरानी की स्थिति को दर्शाता है।
    reason: cultural_note
lexical_decisions:
- source_word: נְעָרַי
  choice: मेरे सेवक
  rationale: नַעַר का अर्थ युवक, सेवक या परिचारक हो सकता है। यहाँ नहेमायाह के अधीन कार्यरत दल का संदर्भ है; इसलिए 'मेरे सेवक' स्वाभाविक है, जबकि विकल्प पाद-टिप्पणी में सुरक्षित है।
- source_word: עֹשִׂים בַּמְּלָאכָה
  choice: काम में लगे रहते थे
  rationale: यह अभिव्यक्ति निर्माण-कार्य में लगातार सक्रिय रहने को दर्शाती है; हिंदी में यह सहज और प्रसंगानुकूल है।
- source_word: מַחֲזִיקִים
  choice: थामे रहते थे
  rationale: हिफ़ील कृदंत यहाँ हथियार पकड़े या तैयार रखे रहने का बोध देता है; 'थामे रहते थे' मूल की क्रियात्मकता बनाए रखता है।
- source_word: הָרְמָחִים הַמָּגִנִּים וְהַקְּשָׁתוֹת וְהַשִּׁרְיֹנִים
  choice: भाले, ढालें, धनुष और कवच
  rationale: हथियारों की सूची को सामान्य, स्पष्ट आधुनिक हिंदी में रखा गया है; שִׁרְיוֹן के लिए व्यापक 'कवच' अनावश्यक विशिष्टता से बचता है।
- source_word: הַשָּׂרִים
  choice: अधिकारी
  rationale: שַׂר का अर्थ प्रधान, अधिकारी या सेनापति हो सकता है। इस संगठित सैन्य-श्रम प्रसंग में 'अधिकारी' उपयुक्त और तटस्थ है।
- source_word: אַחֲרֵי כָּל בֵּית יְהוּדָה
  choice: यहूदा के पूरे घराने के पीछे
  rationale: אַחֲרֵי के स्थानवाचक अर्थ 'पीछे' और בֵּית יְהוּדָה की सामूहिक अभिव्यक्ति 'यहूदा का घराना' दोनों सुरक्षित रखे गए हैं।
theological_decisions:
- issue: अधिकारियों के 'पीछे' होने का आशय
  choice: स्थानवाचक कथन को यथावत रखा गया
  alternative: यहूदा के पूरे घराने की सहायता करते थे
  rationale: मूल पाठ केवल אַחֲרֵי, अर्थात 'पीछे', कहता है; सैन्य सहायता या निगरानी संभावित है, पर उसे मुख्य पाठ में निश्चित नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिंदी, सरल किंतु गरिमापूर्ण शैली। अपूर्ण क्रियाओं को 'लगे रहते थे/थामे रहते थे' से व्यक्त किया गया है। मूल में 'खड़े थे' जैसी स्पष्ट क्रिया नहीं है, इसलिए 'पीछे रहते थे' चुना गया।
