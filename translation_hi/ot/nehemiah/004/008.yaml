base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/004/008.yaml
  text: Then I looked[a], rose up, and said to the nobles, to the officials, and to the rest of the people, “Do not be afraid of them. Remember the Lord, who is great and fearsome, and fight for your brothers, your sons, your daughters, your wives[b], and your houses.”
translation:
  language: hi
  text: तब मैंने देखा और उठकर कुलीनों, अधिकारियों और बाकी लोगों से कहा, “उनसे मत डरो। महान और भयानक[a] प्रभु को स्मरण करो, और अपने भाइयों[b], अपने बेटों, अपनी बेटियों, अपनी पत्नियों और अपने घरों के लिए लड़ो।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “विस्मयकारी।” इब्रानी विशेषण उस व्यक्ति का वर्णन कर सकता है जो विस्मय या भय उत्पन्न करता है; यहाँ उसके प्रबल अर्थ को बनाए रखने के लिए “भयानक” कहा गया है।
    reason: lexical_alternative
  - marker: b
    text: “भाइयों” के लिए इब्रानी में पुल्लिंग बहुवचन संबंधसूचक शब्द है। इसके बाद बेटे, बेटियाँ और पत्नियाँ अलग से गिनाई गई हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֵרֶא
  choice: तब मैंने देखा
  rationale: דרך कथात्मक wayyiqtol क्रम में यह नहेमायाह के स्थिति को देखकर प्रतिक्रिया करने की शुरुआत बताता है। ‘देखा’ मूल क्रिया ראה का सीधा और स्वाभाविक हिन्दी रूप है।
- source_word: וָאָקוּם
  choice: उठकर
  rationale: קום यहाँ निर्णायक ढंग से खड़े होकर कार्रवाई करने का भाव देता है। ‘उठकर’ अगले कथन से सहज रूप से जुड़ता है।
- source_word: הַחֹרִים
  choice: कुलीनों
  rationale: यह पद ऊँचे सामाजिक दर्जे वाले अगुओं को सूचित करता है; ‘कुलीन’ आधुनिक हिन्दी में संक्षिप्त और सटीक है।
- source_word: הַסְּגָנִים
  choice: अधिकारियों
  rationale: यह अधीनस्थ शासकीय या प्रशासनिक पदाधिकारियों का द्योतक है। ‘अधिकारी’ व्यापक किंतु प्रसंगानुकूल और सुबोध है।
- source_word: יֶתֶר הָעָם
  choice: बाकी लोगों
  rationale: यह पहले बताए गए अगुओं से अलग शेष जनसमुदाय को दर्शाता है। ‘बाकी लोग’ स्वाभाविक आधुनिक हिन्दी है।
- source_word: אַל תִּירְאוּ מִפְּנֵיהֶם
  choice: उनसे मत डरो
  rationale: ירא के साथ מִפְּנֵי विरोधियों के सामने उनसे भय खाने का भाव देता है; हिन्दी में यह सीधा निषेध स्वाभाविक है।
- source_word: אֶת אֲדֹנָי
  choice: प्रभु
  rationale: यहाँ אֲדֹנָי परमेश्वर की उपाधि है, יהוה नहीं। इसलिए ‘प्रभु’ उपयुक्त है और दोनों इब्रानी रूपों का अंतर बनाए रखता है।
- source_word: הַגָּדוֹל וְהַנּוֹרָא
  choice: महान और भययोग्य
  rationale: נוֹרָא विस्मय तथा भय उत्पन्न करनेवाली महिमा का बोध कराता है। ‘भययोग्य’ मानवीय शत्रुओं के भय और प्रभु के प्रति उचित भय के बीच पाठ के तनाव को बनाए रखता है।
- source_word: זְכֹרוּ
  choice: याद करो
  rationale: आज्ञार्थक रूप सीधा और प्रभावशाली है; ‘याद करो’ हिन्दी में मूल अर्थ को स्पष्ट रखता है।
- source_word: וְהִלָּחֲמוּ עַל
  choice: के लिए लड़ो
  rationale: इस प्रसंग में עַל के साथ क्रिया दूसरों की रक्षा में या उनकी ओर से लड़ने का अर्थ देती है।
- source_word: אֲחֵיכֶם
  choice: अपने भाइयों
  rationale: इब्रानी शब्द व्याकरणतः पुल्लिंग बहुवचन का संबंधसूचक पद है। आगे बेटे, बेटियाँ और पत्नियाँ अलग-अलग गिनाए गए हैं, इसलिए ‘भाइयों’ को विस्तृत कर देना उचित नहीं।
- source_word: בְּנֵיכֶם וּבְנֹתֵיכֶם נְשֵׁיכֶם וּבָתֵּיכֶם
  choice: अपने बेटों, अपनी बेटियों, अपनी पत्नियों और अपने घरों
  rationale: मूल की ठोस और संचयी सूची को बनाए रखा गया है। ‘घरों’ में निवास और घराने, दोनों की अर्थ-छाया संभव रहती है।
theological_decisions:
- issue: ईश्वरीय उपाधि אֲדֹנָי का अनुवाद
  choice: प्रभु
  alternative: स्वामी
  rationale: पद में אֲדֹנָי है, चार-अक्षरीय ईश्वरीय नाम יהוה नहीं। ‘प्रभु’ प्रचलित, गरिमापूर्ण है और इस भेद को सुरक्षित रखता है।
- issue: הַנּוֹרָא में भय और विस्मय का संबंध
  choice: भययोग्य
  alternative: विस्मयकारी
  rationale: यह विशेषण केवल प्रशंसा नहीं, बल्कि भय उत्पन्न करनेवाली महिमा भी व्यक्त करता है। ‘भययोग्य’ उस प्रबल अर्थ और शत्रुओं से न डरने की आज्ञा के साथ उसके धार्मिक तनाव को बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, सीधी किंतु गरिमापूर्ण रखी गई है। वाक्य की आज्ञात्मक तीव्रता और मूल सूची की पुनरावृत्त संरचना सुरक्षित है। ‘भययोग्य’ अपेक्षाकृत औपचारिक है, पर प्रसंग की धार्मिक गंभीरता और נוֹרָא की भय-विस्मय वाली अर्थ-छाया को संक्षेप में व्यक्त करता है।
