  text: וַ/נִּתְפַּלֵּ֖ל אֶל אֱלֹהֵ֑י/נוּ וַ/נַּעֲמִ֨יד מִשְׁמָ֧ר עֲלֵי/הֶ֛ם יוֹמָ֥ם וָ/לַ֖יְלָה מִ/פְּנֵי/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/004/003.yaml
  text: So we prayed to our God and stationed a guard against them day and night because of them[a][b].
translation:
  language: hi
  text: इसलिए हमने अपने परमेश्वर से प्रार्थना की और उनके कारण[b] दिन-रात उनके विरुद्ध पहरा बैठा दिया[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘उनके विरुद्ध निगरानी रखी।’
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक अर्थ, ‘उनके सामने से’; यहाँ आशय ‘उनके कारण’ या ‘उनकी वजह से’ है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַנִּתְפַּלֵּל
  choice: हमने ... प्रार्थना की
  rationale: हित्पएल रूप का सामान्य अर्थ ‘प्रार्थना करना’ है; क्रिया में निहित न होने वाली अतिरिक्त तीव्रता नहीं जोड़ी गई।
- source_word: אֶל אֱלֹהֵינוּ
  choice: अपने परमेश्वर से
  rationale: हिन्दी में प्रार्थना के लक्ष्य को स्वाभाविक रूप से ‘से’ द्वारा व्यक्त किया जाता है, और प्रथम पुरुष बहुवचन प्रत्यय को ‘अपने’ से सुरक्षित रखा गया है।
- source_word: וַנַּעֲמִיד מִשְׁמָר
  choice: पहरा बैठा दिया
  rationale: हिफ़ील क्रिया और ‘पहरे/रक्षा’ की संज्ञा का यह स्वाभाविक हिन्दी संयोजन है, जो लोगों को निगरानी के लिए नियुक्त करने का भाव देता है।
- source_word: עֲלֵיהֶם
  choice: उनके विरुद्ध
  rationale: शत्रुतापूर्ण प्रसंग में עַל का आशय विरोधियों से सुरक्षा के लिए उनकी ओर लक्षित पहरा है; ‘विरुद्ध’ इस प्रसंगगत बल को व्यक्त करता है।
- source_word: יוֹמָם וָלַיְלָה
  choice: दिन-रात
  rationale: यह निरंतर सतर्कता बताने वाला स्वाभाविक हिन्दी युग्म है।
- source_word: מִפְּנֵיהֶם
  choice: उनके कारण
  rationale: शाब्दिक अर्थ ‘उनके सामने से/उनकी उपस्थिति के कारण’ है; यहाँ यह पहरा लगाने का कारण बताता है, पर स्पष्ट रूप से ‘डर’ जोड़ना उचित नहीं।
theological_decisions:
- issue: विरोध के प्रति प्रतिक्रिया
  choice: प्रार्थना और व्यावहारिक सुरक्षा—दोनों समन्वित कार्यों को समान रूप से रखा गया है।
  alternative: केवल प्रार्थना पर या केवल रक्षात्मक तैयारी पर बल देना।
  rationale: इब्रानी पाठ दो कार्यों को ‘और’ से जोड़ता है। अनुवाद आध्यात्मिक भरोसे और व्यावहारिक सतर्कता के बीच के तनाव को मिटाता नहीं।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और कथात्मक शैली। ‘पहरा बैठा दिया’ सामान्य पाठक के लिए स्वाभाविक है और सामूहिक रक्षक-दल अथवा निगरानी—दोनों की सम्भावना खुली रखता है।
