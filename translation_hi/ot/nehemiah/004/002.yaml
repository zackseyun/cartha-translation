lexical_decisions:
- source_word: וַיִּקְשְׁרוּ
  choice: साज़िश रची
  rationale: קשר का क़ल रूप यहाँ विरोधी पक्षों की सोची-समझी, संगठित शत्रुतापूर्ण योजना को व्यक्त करता है।
- source_word: כֻלָּם יַחְדָּו
  choice: उन सबने मिलकर
  rationale: यह पदबंध समूह की संपूर्णता और संयुक्त कार्रवाई—दोनों पर बल देता है; हिंदी में यह स्वाभाविक और स्पष्ट है।
- source_word: לָבוֹא לְהִלָּחֵם
  choice: चढ़ाई करके उससे लड़ने
  rationale: मूल में गति और युद्ध, दोनों भाव हैं। सैन्य प्रसंग में 'चढ़ाई करके' לבוא की दिशा और शत्रुतापूर्ण आगमन को स्वाभाविक हिंदी में रखता है, जबकि 'लड़ने' להלחם को व्यक्त करता है।
- source_word: בִּירוּשָׁלָם
  choice: यरूशलेम पर ... उससे
  rationale: शत्रुतापूर्ण क्रिया के साथ ב लक्ष्य को सूचित करता है। हिंदी में नगर पर चढ़ाई करना और उससे लड़ना सहज प्रयोग है।
- source_word: וְלַעֲשׂוֹת לוֹ תּוֹעָה
  choice: और उसमें गड़बड़ी फैलाने
  rationale: עשה के साथ תועה किसी अव्यवस्था या उलझन को उत्पन्न करने का भाव देता है। 'गड़बड़ी फैलाने' सामान्य आधुनिक हिंदी में इस परिणामकारी अर्थ को व्यक्त करता है।
- source_word: תּוֹעָה
  choice: गड़बड़ी
  rationale: इस दुर्लभ संज्ञा का अर्थ भ्रम, अव्यवस्था या उपद्रव हो सकता है। 'गड़बड़ी' संदर्भानुकूल है और अर्थ को आवश्यकता से अधिक विशिष्ट नहीं बनाती।
