source:
  edition: WLC
  text: וַ/יְהִ֞י כַּֽ/אֲשֶׁר שָׁמְע֤וּ אוֹיְבֵ֨י/נוּ֙ כִּי נ֣וֹדַֽע לָ֔/נוּ וַ/יָּ֥פֶר הָ/אֱלֹהִ֖ים אֶת עֲצָתָ֑/ם ו/נשוב כֻּלָּ֨/נוּ֙ אֶל הַ֣/חוֹמָ֔ה אִ֖ישׁ אֶל מְלַאכְתּֽ/וֹ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/004/009.yaml
  text: And it happened that when our enemies heard that it had become known to us[a], and that God had frustrated their plan, we all returned to the wall[c][b], each man to his work.
translation:
  language: hi
  text: और ऐसा हुआ कि जब हमारे शत्रुओं ने सुना कि हमें इसका पता चल गया था[a], और परमेश्वर ने उनकी योजना विफल कर दी थी[b], तब हम सब दीवार की ओर लौट गए—हर आदमी अपने काम पर[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “कि वह बात हमें मालूम हो गई थी।” इब्रानी में शाब्दिक अर्थ है, “कि वह हमें ज्ञात हो गया था।”
    reason: lexical_alternative
  - marker: b
    text: या, “उनकी युक्ति निष्फल कर दी थी।”
    reason: lexical_alternative
  - marker: c
    text: इब्रानी में “हर आदमी अपने काम पर” एक वितरणात्मक अभिव्यक्ति है, अर्थात काम करने वालों में से प्रत्येक अपने-अपने काम पर लौट गया।
    reason: cultural_note
lexical_decisions:
- source_word: וַיְהִי
  choice: और ऐसा हुआ कि
  rationale: यह कथा में आए नए घटनाक्रम को स्वाभाविक, गैर-पुरातन हिन्दी में व्यक्त करता है।
- source_word: כַּאֲשֶׁר
  choice: जब
  rationale: यहाँ यह कालसूचक संबंध बताता है और हिन्दी में सबसे स्वाभाविक है।
- source_word: אוֹיְבֵינוּ
  choice: हमारे शत्रुओं
  rationale: प्रथम पुरुष बहुवचन प्रत्यय सहित אוֹיֵב का सीधा और प्रसंगानुकूल अनुवाद।
- source_word: כִּי נוֹדַע לָנוּ
  choice: कि यह बात हमें मालूम हो गई थी
  rationale: ידע के निफ़अल रूप की निष्क्रिय धारणा को बनाए रखता है; 'यह बात' अस्पष्ट संदर्भ को अनावश्यक रूप से विशेष नहीं बनाता।
- source_word: וַיָּפֶר
  choice: विफल कर दी थी
  rationale: הפר यहाँ किसी योजना को निष्फल या नाकाम करने के अर्थ में है; यह आधुनिक हिन्दी में स्पष्ट है।
- source_word: הָאֱלֹהִים
  choice: परमेश्वर
  rationale: प्रसंग में यह इस्राएल के परमेश्वर का स्पष्ट उल्लेख है; हिन्दी बाइबलीय भाषा में 'परमेश्वर' स्वाभाविक और प्रतिष्ठित पद है।
- source_word: עֲצָתָם
  choice: उनकी योजना
  rationale: עֵצָה का अर्थ सलाह, युक्ति या योजना हो सकता है; विरोधियों की कार्रवाई के प्रसंग में 'योजना' स्पष्ट है और अतिरिक्त नकारात्मक भाव नहीं जोड़ता।
- source_word: וְנָשׁוּב כֻּלָּנוּ
  choice: तब हम सब ... लौट गए
  rationale: שוב के लौटने के अर्थ और כֻּלָּנוּ के समावेशी बल, दोनों को स्वाभाविक हिन्दी क्रम में रखा गया है।
- source_word: אֶל הַחוֹמָה
  choice: दीवार के पास
  rationale: אֶל की दिशात्मकता को व्यक्त करता है और निर्माणाधीन दीवार के संदर्भ में 'दीवार पर' की संभावित भ्रामक स्थानिक धारणा से बचता है।
- source_word: אִישׁ אֶל מְלַאכְתּוֹ
  choice: हर आदमी अपने काम पर
  rationale: אִישׁ के वितरणात्मक एकवचन और מְלָאכָה के सामान्य अर्थ 'काम' को स्वाभाविक हिन्दी में सुरक्षित रखता है।
theological_decisions:
- issue: विरोधियों की योजना विफल होने में परमेश्वर की भूमिका
  choice: परमेश्वर ने उनकी योजना सीधे विफल कर दी थी
  alternative: घटना को केवल अनुकूल परिस्थिति या संयोग के रूप में कहना
  rationale: इब्रानी पाठ स्पष्ट रूप से इस कार्य का कर्ता परमेश्वर को बताता है; इसलिए इस प्रत्यक्ष धर्मवैज्ञानिक कथन को नरम नहीं किया गया।
- issue: אִישׁ का पुल्लिंग वितरणात्मक प्रयोग
  choice: हर आदमी
  alternative: हर एक / हर व्यक्ति
  rationale: मूल पाठ के पुल्लिंग एकवचन वितरणात्मक रूप को हिन्दी में स्वाभाविक ढंग से बनाए रखा गया है, जबकि वाक्य का आशय काम करने वालों में से प्रत्येक से है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज शैली रखी गई है। 'दीवार' सामान्य पाठक के लिए 'शहरपनाह' से अधिक स्पष्ट है। वाक्य में मूल इब्रानी की कथात्मक गति, निष्क्रिय 'मालूम हो जाना', परमेश्वर की प्रत्यक्ष कर्तृता और अंतिम वितरणात्मक अभिव्यक्ति सुरक्षित रखी गई है।
