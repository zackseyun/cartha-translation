  text: וַ/יְהִ֣י כַ/אֲשֶׁ֣ר שָׁמַ֣ע סַנְבַלַּ֡ט וְ֠/טוֹבִיָּה וְ/הָ/עַרְבִ֨ים וְ/הָ/עַמֹּנִ֜ים וְ/הָ/אַשְׁדּוֹדִ֗ים כִּֽי עָלְתָ֤ה אֲרוּכָה֙ לְ/חֹמ֣וֹת יְרוּשָׁלִַ֔ם כִּי הֵחֵ֥לּוּ הַ/פְּרֻצִ֖ים לְ/הִסָּתֵ֑ם וַ/יִּ֥חַר לָ/הֶ֖ם מְאֹֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/004/001.yaml
  text: When Sanballat and Tobiah and the Arabs and the Ammonites and the Ashdodites heard that the repair of Jerusalem’s walls had gone up[a], that the breaches had begun to be closed[b], they became very angry.
translation:
  language: hi
  text: जब सम्बल्लत, तोबियाह, अरबों, अम्मोनियों और अशदोदियों ने सुना कि यरूशलेम की शहरपनाहों की मरम्मत आगे बढ़ गई थी[a] और कि टूटे हुए स्थान बंद होने लगे थे[b], तो वे बहुत क्रोधित हुए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “यरूशलेम की शहरपनाहों की बहाली में प्रगति हुई थी।” इब्रानी शब्द मूलतः चंगाई या बहाली से जुड़ा है और यहाँ मरम्मत के लिए रूपक के रूप में प्रयुक्त हुआ है।
    reason: lexical_alternative
  - marker: b
    text: या “दरारें बंद होने लगी थीं।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כַאֲשֶׁר
  choice: जब
  rationale: यह अभिव्यक्ति कथा में समयसूचक उपवाक्य आरम्भ करती है; आधुनिक हिन्दी में ‘जब’ स्वाभाविक है और स्रोत में निहित न होने वाला ‘अब’ नहीं जोड़ती।
- source_word: סַנְבַלַּט וְטוֹבִיָּה
  choice: सम्बल्लत, तोबियाह
  rationale: व्यक्तिनामों का प्रचलित हिन्दी बाइबलीय लिप्यंतरण रखा गया है।
- source_word: הָעַרְבִים וְהָעַמֹּנִים וְהָאַשְׁדּוֹדִים
  choice: अरबों, अम्मोनियों और अशदोदियों
  rationale: मूल के जातिवाचक बहुवचन नामों को संक्षिप्त और सहज आधुनिक हिन्दी में व्यक्त किया गया है।
- source_word: עָלְתָה אֲרוּכָה
  choice: मरम्मत आगे बढ़ रही है
  rationale: אֲרוּכָה में ‘चंगाई/बहाली/मरम्मत’ का रूपक है और עָלְתָה प्रगति का भाव देता है; दीवारों के प्रसंग में यह संयोजन अर्थ और रूपक दोनों को सुबोध ढंग से व्यक्त करता है।
- source_word: לְחֹמוֹת יְרוּשָׁלִַם
  choice: यरूशलेम की शहरपनाहों की
  rationale: ‘शहरपनाह’ नगर को घेरने वाली रक्षात्मक दीवार के लिए सटीक और हिन्दी पाठकों में परिचित शब्द है; बहुवचन मूल के अनुरूप है।
- source_word: הַפְּרֻצִים לְהִסָּתֵם
  choice: उनमें पड़ी दरारें बंद होने लगी हैं
  rationale: הַפְּרֻצִים दीवार के टूटे खुले स्थानों को और निफ़अल לְהִסָּתֵם उनके बंद किए जाने/होने को व्यक्त करता है। ‘उनमें’ हिन्दी में संबंध स्पष्ट करता है।
- source_word: וַיִּחַר לָהֶם מְאֹד
  choice: वे बहुत क्रोधित हुए
  rationale: इब्रानी मुहावरे का स्वाभाविक हिन्दी अर्थ है कि उनका क्रोध बहुत भड़क उठा; संक्षिप्त रूप में तीव्रता सुरक्षित है।
