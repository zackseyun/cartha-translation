  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सहज कथात्मक रूप अपनाया गया है। जातिनामों और व्यक्तिनामों के परिचित हिन्दी बाइबलीय रूप रखे गए हैं। ‘मरम्मत आगे बढ़ रही है’ मूल के बहाली/चंगाई रूपक और प्रगति—दोनों को यथासंभव सुरक्षित रखता है; वैकल्पिक अर्थ पादटिप्पणियों में दिए गए हैं।
