base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/004/004.yaml
  text: And Judah said[a], “The strength of the burden-bearers has failed, and there is much rubble[b], and we are not able to build the wall.”
translation:
  language: hi
  text: और यहूदा ने कहा[a], “बोझ उठाने वालों की ताकत चुक गई है, और बहुत मलबा पड़ा है[b]; हम दीवार का निर्माण नहीं कर सकते।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “यहूदा के लोगों ने कहा।” एकवचन नाम “यहूदा” यहाँ संभवतः पूरे समुदाय के लिए प्रयुक्त हुआ है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में “धूल” या “मिट्टी”; प्रसंग में उजड़े स्थान के मलबे या टूटे-फूटे अवशेष का अर्थ संभावित है।
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוּדָה
  choice: यहूदा
  rationale: इब्रानी एकवचन व्यक्तिवाचक नाम को रखा गया है; प्रसंग में यह संभवतः यहूदा के समुदाय का सामूहिक प्रतिनिधित्व करता है।
- source_word: כָּשַׁל
  choice: जवाब दे गई है
  rationale: ‘ताकत’ के साथ यह स्वाभाविक हिन्दी मुहावरा लड़खड़ाने, चूक जाने या समाप्त हो जाने का भाव व्यक्त करता है।
- source_word: כֹּחַ
  choice: ताकत
  rationale: यहाँ शारीरिक श्रम-क्षमता अभिप्रेत है; ‘ताकत’ सामान्य आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: הַסַּבָּל
  choice: बोझ उठानेवालों
  rationale: शब्द का ठोस अर्थ भार ढोनेवाला है। इब्रानी एकवचन का बल सामूहिक है, इसलिए हिन्दी में बहुवचन स्वाभाविक है।
- source_word: הֶעָפָר
  choice: मलबा
  rationale: मूल अर्थ ‘धूल/मिट्टी’ है, पर उजड़ी हुई नगरी और शहरपनाह के पुनर्निर्माण के प्रसंग में टूटे अवशेष या मलबा अभिप्रेत है।
- source_word: הַרְבֵּה
  choice: बहुत पड़ा है
  rationale: प्रचुर मात्रा का भाव देता है; ‘मलबा बहुत पड़ा है’ प्रसंगानुकूल स्वाभाविक हिन्दी है।
- source_word: לֹא נוּכַל
  choice: हम ... नहीं बना सकते
  rationale: यह अनिच्छा नहीं, असमर्थता व्यक्त करता है।
- source_word: לִבְנוֹת
  choice: बना सकते
  rationale: मूल क्रिया सामान्यतः ‘बनाना’ है; हिन्दी वाक्य में ‘फिर से’ जोड़कर अर्थ का विस्तार नहीं किया गया।
- source_word: בַּחוֹמָה
  choice: शहरपनाह
  rationale: प्रसंग नगर की रक्षात्मक दीवार का है। हिन्दी में सकर्मक ‘शहरपनाह बनाना’ स्वाभाविक है; इब्रानी ב को अलग परसर्ग के रूप में व्यक्त करना हिन्दी में असहज होता।
