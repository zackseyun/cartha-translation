base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/004/006.yaml
  text: And when the Jews who lived near them came and told us ten times[a], “From all the places where you turn[b], they will come up against us,”
translation:
  language: hi
  text: तब उनके पास रहने वाले यहूदी आए और हमसे दस बार कहा, “तुम जिधर भी मुड़ोगे[a], वे हर जगह से हम पर चढ़ आएँगे[b]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तुम जहाँ कहीं लौटोगे।” इब्रानी क्रिया का अर्थ ‘लौटना’ भी हो सकता है, पर इस प्रसंग में संभवतः किसी भी दिशा में मुड़ना अभिप्रेत है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी वाक्य अत्यंत संक्षिप्त और कठिन है। “वे ... चढ़ आएँगे” शत्रुओं के हर दिशा से आक्रमण करने की चेतावनी को प्रसंग के आधार पर स्पष्ट करता है।
    reason: textual_clarity
lexical_decisions:
- source_word: וַיְהִי כַּאֲשֶׁר בָּאוּ
  choice: तब ... आए
  rationale: इब्रानी कथात्मक क्रम और कालसूचक उपवाक्य को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: הַיְּהוּדִים
  choice: यहूदी
  rationale: यहाँ यह शब्द व्यापक यहूदी समुदाय के लोगों को सूचित करता है; केवल यहूदिया के निवासियों तक अर्थ सीमित करना आवश्यक नहीं है।
- source_word: הַיֹּשְׁבִים אֶצְלָם
  choice: उनके पास रहने वाले
  rationale: אֵצֶל निकटता दर्शाता है—अर्थात विरोधी पड़ोसियों के समीप रहने वाले यहूदी।
- source_word: וַיֹּאמְרוּ לָנוּ עֶשֶׂר פְּעָמִים
  choice: हमसे दस बार कहने लगे
  rationale: स्पष्ट संख्या ‘दस’ को बनाए रखते हुए बार-बार चेतावनी देने का भाव स्वाभाविक हिन्दी में व्यक्त किया गया है।
- source_word: מִכָּל הַמְּקֹמוֹת
  choice: हर जगह से
  rationale: यह बहुवचन पद सभी दिशाओं अथवा स्थानों से आने के व्यापक भाव को संक्षेप और स्वाभाविक रूप में देता है।
- source_word: אֲשֶׁר תָּשׁוּבוּ
  choice: तुम जिधर भी मुड़ोगे
  rationale: שׁוב का मूल अर्थ लौटना है, पर इस कठिन वाक्य में किसी भी दिशा में मुड़ने का अर्थ प्रसंगानुकूल है; अनिश्चितता पादटिप्पणी में सुरक्षित है।
- source_word: עָלֵינוּ
  choice: हम पर चढ़ आएँगे
  rationale: शत्रुतापूर्ण प्रसंग में עַל का अर्थ आक्रमण की दिशा ‘हम पर/हमारे विरुद्ध’ है। हिन्दी मुहावरा ‘चढ़ आना’ इस भाव को स्पष्ट करता है।
