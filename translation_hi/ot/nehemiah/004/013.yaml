source:
  edition: WLC
  text: וָ/אֹמַ֞ר אֶל הַ/חֹרִ֤ים וְ/אֶל הַ/סְּגָנִים֙ וְ/אֶל יֶ֣תֶר הָ/עָ֔ם הַ/מְּלָאכָ֥ה הַרְבֵּ֖ה וּ/רְחָבָ֑ה וַ/אֲנַ֗חְנוּ נִפְרָדִים֙ עַל הַ֣/חוֹמָ֔ה רְחוֹקִ֖ים אִ֥ישׁ מֵ/אָחִֽי/ו־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/004/013.yaml
  text: And I said to the nobles[a], to the officials, and to the rest of the people, “The work is great and spread out, and we are separated along the wall, far from one another.”
translation:
  language: hi
  text: तब मैंने कुलीन लोगों, अधिकारियों और बाकी लोगों से कहा, “काम बहुत बड़ा और दूर-दूर तक फैला हुआ है, और हम शहरपनाह पर एक-दूसरे से दूर अलग-अलग हैं।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַחֹרִים
  choice: कुलीन लोगों
  rationale: नहेमायाह में यह शब्द समाज के प्रतिष्ठित और प्रभावशाली वर्ग के लोगों को दर्शाता है; ‘कुलीन लोगों’ से यह अर्थ स्वाभाविक हिंदी में स्पष्ट होता है।
- source_word: הַסְּגָנִים
  choice: अधिकारियों
  rationale: यह अधीनस्थ शासकीय अगुओं या प्रशासकों का बोध कराता है; ‘अधिकारियों’ पद को अनावश्यक रूप से विशिष्ट किए बिना अर्थ देता है।
- source_word: יֶתֶר הָעָם
  choice: बाकी लोगों
  rationale: नामित अगुओं के अतिरिक्त शेष समुदाय के लिए यह सरल और स्वाभाविक हिंदी अभिव्यक्ति है।
- source_word: הַמְּלָאכָה הַרְבֵּה וּרְחָבָה
  choice: काम बहुत बड़ा और दूर-दूर तक फैला हुआ है
  rationale: הַרְבֵּה काम की विशालता और רְחָבָה उसके व्यापक भौगोलिक फैलाव को व्यक्त करता है; संयुक्त अनुवाद निर्माण-कार्य के परिमाण और विस्तार दोनों को बनाए रखता है।
- source_word: נִפְרָדִים
  choice: अलग-अलग हैं
  rationale: निष्क्रिय कृदंत श्रमिकों के परस्पर दूरी पर तैनात होने को दर्शाता है, न कि वैमनस्य या दलगत विभाजन को।
- source_word: עַל הַחוֹמָה
  choice: शहरपनाह पर
  rationale: עַל का सीधा स्थानवाचक अर्थ ‘पर’ सुरक्षित रखा गया है; संदर्भ में חוֹמָה नगर की रक्षात्मक दीवार है, जिसके लिए ‘शहरपनाह’ सटीक और प्रचलित बाइबलीय हिंदी है।
- source_word: רְחוֹקִים אִישׁ מֵאָחִיו
  choice: एक-दूसरे से दूर
  rationale: शाब्दिक ‘हर व्यक्ति अपने भाई से’ यहाँ पारस्परिक दूरी का इब्रानी मुहावरा है; ‘एक-दूसरे से दूर’ उसका अर्थ सहज हिंदी में देता है।
theological_decisions: []
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण किंतु सहज शैली रखी गई है। ‘शहरपनाह’ नगर की रक्षात्मक दीवार के लिए सटीक है। स्रोत के पारस्परिक मुहावरे को स्वाभाविक हिंदी में व्यक्त किया गया है; कोई आवश्यक पाठगत या धर्मवैज्ञानिक अस्पष्टता नहीं खोई गई।
