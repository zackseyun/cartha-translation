  text: और निर्माण करनेवाले, हर एक अपनी तलवार कमर पर बाँधे हुए, निर्माण कर रहे थे; और शोफ़ार[a] फूँकनेवाला मेरे पास था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'हिब्रू: ‘शोफ़ार’, सामान्यतः मेढ़े के सींग से बना फूँककर बजाया जानेवाला वाद्य।'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַבּוֹנִים / וּבוֹנִים
  choice: निर्माण करनेवालों / निर्माण करता था
  rationale: בנה के पहले कृदन्त को संज्ञात्मक और दूसरे को क्रियात्मक रूप में प्रस्तुत किया गया है। इससे हिब्रू मूल की पुनरावृत्ति बनी रहती है और हिन्दी स्वाभाविक रहती है।
- source_word: אִישׁ
  choice: हर एक
  rationale: यहाँ אִישׁ समूह के प्रत्येक व्यक्ति को अलग-अलग सूचित करता है; ‘हर एक’ उसका स्वाभाविक वितरणात्मक हिन्दी रूप है।
- source_word: חַרְבּוֹ
  choice: अपनी तलवार
  rationale: सन्दर्भ में प्रत्येक निर्माणकर्ता की अपनी तलवार अभिप्रेत है; हिन्दी में कर्ता से सम्बन्ध स्पष्ट करने के लिए ‘अपनी’ स्वाभाविक है।
- source_word: אֲסוּרִים עַל מָתְנָיו
  choice: कमर से बाँधे हुए
  rationale: शाब्दिक भाव ‘उसकी कमर/कटि पर बँधी हुई’ है। ‘कमर से बाँधे हुए’ हथियार धारण करने की मुद्रा को स्पष्ट, आधुनिक हिन्दी में व्यक्त करता है।
- source_word: וְהַתּוֹקֵעַ בַּשּׁוֹפָר
  choice: और नरसिंगा फूँकनेवाला
  rationale: תקע का कृदन्त वाद्य बजाने की क्रिया व्यक्त करता है और שׁוֹפָר विशेष प्रकार का सींग-वाद्य है। ‘नरसिंगा’ सामान्य पाठक के लिए सुबोध है; मूल वाद्य की विशिष्टता पादटिप्पणी में दी गई है।
- source_word: אֶצְלִי
  choice: मेरे पास रहता था
  rationale: אֶצְלִי निकट उपस्थिति बताता है। निरन्तर चल रही व्यवस्था के इस वर्णन में ‘मेरे पास रहता था’ स्वाभाविक हिन्दी है।
