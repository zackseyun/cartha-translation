base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/004/005.yaml
  text: And our adversaries said[a], “They will not know, and they will not see, until we come into their midst and kill them and stop the work.”
translation:
  language: hi
  text: और हमारे शत्रुओं ने कहा, “न तो उन्हें पता चलेगा, न ही वे देखेंगे, जब तक कि हम उनके बीच[a] पहुँच जाएँ, उन्हें मार न डालें और काम बंद न करा दें।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उनके बीच में।”
    reason: אֶל תּוֹכָם में मुख्य पाठ के दिशात्मक ‘उनके बीच पहुँच जाएँ’ के साथ कम दिशात्मक स्थानिक भाव भी संभव है।
lexical_decisions:
- source_word: צָרֵינוּ
  choice: हमारे शत्रुओं
  rationale: צַר यहाँ सक्रिय रूप से विरोध करने वाले शत्रुओं को दर्शाता है; ‘शत्रुओं’ से प्रसंग की घातक शत्रुता स्पष्ट और स्वाभाविक रूप से व्यक्त होती है।
- source_word: יֵדְעוּ
  choice: उन्हें ... पता चलेगा
  rationale: יָדַע यहाँ जानकारी या आभास होने के अर्थ में है; ‘पता चलेगा’ आधुनिक हिन्दी में इस प्रसंग के लिए स्वाभाविक है।
- source_word: יִרְאוּ
  choice: वे देखेंगे
  rationale: रָאָה का मूल अर्थ ‘देखना’ है; इसे बनाए रखने से ‘पता चलना’ और ‘देखना’ का इब्रानी समानांतर सुरक्षित रहता है।
- source_word: עַד אֲשֶׁר
  choice: जब तक कि
  rationale: यह पदबंध उस समय-सीमा को दर्शाता है जिस तक हमला अनदेखा रहेगा; ‘जब तक कि’ हिन्दी में उसका स्पष्ट समतुल्य है।
- source_word: נָבוֹא אֶל תּוֹכָם
  choice: हम उनके बीच पहुँचकर
  rationale: בּוֹא के आने/पहुँचने और תּוֹךְ के मध्य या भीतर के स्थानिक भाव को यह वाक्यांश सहज हिन्दी में व्यक्त करता है।
- source_word: וַהֲרַגְנוּם
  choice: उन्हें मार न डालें
  rationale: הָרַג का सीधा अर्थ मार डालना है; यह धमकी की स्पष्ट और कठोर भाषा को बनाए रखता है।
- source_word: וְהִשְׁבַּתְנוּ אֶת הַמְּלָאכָה
  choice: काम बंद न करा दें
  rationale: שׁבת का हिफ़ील रूप काम को रुकवा देने का कारक भाव रखता है; ‘बंद न करा दें’ उस भाव को स्पष्ट करता है।
