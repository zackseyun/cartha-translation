base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/004/017.yaml
  text: And neither I[a], nor my brothers, nor my young men, nor the men of the guard who were behind me, took off our clothes; each kept his weapon in his right hand, even for water.
translation:
  language: hi
  text: न मैंने, न मेरे भाइयों ने, न मेरे जवानों ने, और न पहरेदारों ने जो मेरे पीछे थे, अपने कपड़े उतारे; हर एक पानी के लिए भी अपना हथियार हाथ में लिए रहता था।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इस अंतिम खंड का इब्रानी पाठ कठिन है; शब्दशः, “हर एक उसका शेलह, पानी।” इसका अर्थ यह हो सकता है कि हर एक पानी लेने जाते समय अपना हथियार साथ ले जाता था, या कि हर एक पानी के लिए भी अपना हथियार दाहिने हाथ में तैयार रखता था।
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵין ... אֵין
  choice: न तो ... और न ही ... कपड़े उतारे
  rationale: אֵין के साथ कृदंत निरंतर नकारात्मक क्रिया को व्यक्त करता है। हिंदी में समन्वित ‘न तो ... न ... और न ही’ सूची के सभी कर्ताओं को स्वाभाविक रूप से जोड़ता है।
- source_word: אַחַי
  choice: मेरे भाइयों
  rationale: मूल पारिवारिक शब्द को बनाए रखा गया है; संदर्भ में निकट सहयोगी भी अभिप्रेत हो सकते हैं, पर ऐसा स्पष्ट करना मूल से अधिक होगा।
- source_word: נְעָרַי
  choice: मेरे जवानों
  rationale: נַעַר युवक, सेवक या परिचर हो सकता है। सैन्य-प्रशासनिक संदर्भ में ‘जवान’ आयु और सेवा—दोनों संभावनाओं को स्वाभाविक रूप से वहन करता है।
- source_word: אַנְשֵׁי הַמִּשְׁמָר אֲשֶׁר אַחֲרַי
  choice: मेरे पीछे रहनेवाले पहरेदारों
  rationale: מִשְׁמָר के पहरे/रक्षा के अर्थ और אַחֲרַי के स्थानिक ‘मेरे पीछे’ अर्थ को संक्षिप्त, स्वाभाविक हिंदी में रखा गया है।
- source_word: פֹשְׁטִים בְּגָדֵינוּ
  choice: अपने कपड़े उतारे
  rationale: वस्त्रों के साथ פשט का अर्थ कपड़े उतारना है; ‘अपने’ सामूहिक ‘हमारे’ आशय को हिंदी में सहज बनाता है।
- source_word: אִישׁ
  choice: हर एक
  rationale: यहाँ אִישׁ वितरणवाचक है, इसलिए लिंग-चिह्नित ‘हर पुरुष’ की अपेक्षा ‘हर एक’ अधिक सटीक है।
- source_word: שִׁלְחוֹ
  choice: अपना हथियार लिए हुए
  rationale: שֶׁלַח किसी प्रक्षेप्य या भाले-जैसे हथियार को सूचित कर सकता है, पर निश्चित प्रकार स्पष्ट नहीं है; अतः व्यापक ‘हथियार’ चुना गया।
- source_word: הַמָּיִם
  choice: पानी लेने जाता था
  rationale: दुर्बोध अंतिम खंड को उस संभावित अर्थ के अनुसार रखा गया है कि प्रत्येक व्यक्ति पानी के लिए जाते समय भी हथियार साथ रखता था; अनिश्चितता पादटिप्पणी में सुरक्षित है।
