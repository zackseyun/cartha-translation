base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/004/011.yaml
  text: The builders on the wall[a], and those who carried burdens, loaded themselves so that with one hand each did the work[b], and with the other held his weapon.
translation:
  language: hi
  text: नगर की दीवार पर निर्माण करनेवाले और बोझ ढोनेवाले सामान से लदे हुए थे[a]; हर व्यक्ति एक हाथ से काम करता था और दूसरे हाथ से हथियार[b] थामे रहता था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इस दुर्लभ इब्रानी शब्द का ठीक अर्थ अनिश्चित है। इसका अनुवाद ‘बोझ लाद रहे थे’ भी हो सकता है; आशय यह है कि मजदूर निर्माण-सामग्री सँभालते हुए हथियारबंद रहते थे।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी शब्द विशेष रूप से भाला, बरछी अथवा फेंके जानेवाले किसी अन्य शस्त्र को भी सूचित कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הַבּוֹנִים בַּחוֹמָה
  choice: शहरपनाह पर निर्माण करनेवाले
  rationale: यह पदबंध दीवार पर निर्माण करनेवालों को दर्शाता है। ‘शहरपनाह’ नगर की रक्षात्मक दीवार के लिए स्वाभाविक और प्रसंगानुकूल हिन्दी है।
- source_word: וְהַנֹּשְׂאִים בַּסֶּבֶל
  choice: और बोझ ढोनेवाले
  rationale: נשא और סבל का मेल निर्माण-सामग्री जैसे भारी बोझ उठाकर ले जाने का भाव देता है।
- source_word: עֹמְשִׂים
  choice: सामान से लदे हुए थे
  rationale: यह दुर्लभ रूप ठीक किस बारीकी को व्यक्त करता है, यह अनिश्चित है; प्रसंग में यह मजदूरों के निर्माण-सामग्री से लदे या उसे सँभालते हुए काम करने का संकेत देता है।
- source_word: בְּאַחַת יָדוֹ עֹשֶׂה בַמְּלָאכָה
  choice: हर एक एक हाथ से काम करता
  rationale: एकवचन रूप यहाँ समूह के प्रत्येक व्यक्ति पर वितरणात्मक रूप से लागू है; ‘हर एक’ हिन्दी में इसे स्पष्ट करता है।
- source_word: וְאַחַת מַחֲזֶקֶת הַשָּׁלַח
  choice: और दूसरे हाथ से अपना हथियार पकड़े रहता था
  rationale: मूल में स्त्रीलिंग रूप से दूसरा ‘हाथ’ निहित है। הַשָּׁלַח किसी भाले, फेंकने योग्य शस्त्र या व्यापक अर्थ में हथियार को सूचित कर सकता है, इसलिए मुख्य पाठ में अनावश्यक विशिष्टता से बचा गया है।
