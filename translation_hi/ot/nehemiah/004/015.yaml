  text: So we kept doing the work[a], while half of them held the spears from the rising of the dawn until the coming out of the stars.
translation:
  language: hi
  text: इस प्रकार हम काम करते रहे, और उनमें से आधे लोग भोर होने से लेकर तारों के निकलने तक[a] भाले थामे रहते थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अधिक मुहावरेदार रूप में, “पौ फटने से लेकर तारे निकलने तक।”
    reason: lexical_alternative
lexical_decisions:
- source_word: עֹשִׂים בַּמְּלָאכָה
  choice: काम में लगे रहे
  rationale: वर्तमान कृदंत जारी रहने वाली गतिविधि व्यक्त करता है; यह हिंदी प्रयोग उस निरंतरता को स्वाभाविक ढंग से सामने लाता है।
- source_word: וְחֶצְיָם
  choice: और उनमें से आधे लोग
  rationale: शाब्दिक अर्थ ‘और उनका आधा’ है; संदर्भ में यह लोगों के आधे भाग को सूचित करता है।
- source_word: מַחֲזִיקִים בָּרְמָחִים
  choice: भाले थामे रहते थे
  rationale: कृदंत लगातार भाले पकड़े या धारण किए रहने का भाव देता है; ‘थामे रहते थे’ इस अवधि को स्पष्ट करता है।
- source_word: מֵעֲלוֹת הַשַּׁחַר
  choice: भोर के उगने से
  rationale: यह मूल पाठ की ‘भोर के उदय’ वाली ठोस छवि को बनाए रखता है, यद्यपि अधिक मुहावरेदार विकल्प फुटनोट में दिया गया है।
- source_word: עַד צֵאת הַכּוֹכָבִים
  choice: तारों के निकलने तक
  rationale: मूल अभिव्यक्ति तारों के दिखाई देने या निकलने की ठोस छवि रखती है; इसे केवल ‘रात होने तक’ कहकर व्याख्यात्मक रूप से सामान्यीकृत नहीं किया गया।
