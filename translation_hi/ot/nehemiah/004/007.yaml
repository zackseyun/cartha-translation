base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/004/007.yaml
  text: Then I stationed men in the lowest parts of the place[a], behind the wall, in the exposed areas; and I stationed the people by families, with their swords, their spears, and their bows.
translation:
  language: hi
  text: तब मैंने लोगों को उस स्थान के सबसे निचले भागों में, दीवार के पीछे और खुले स्थानों पर[a] तैनात किया; और मैंने उन्हें उनके परिवारों के अनुसार, अपनी तलवारों, भालों और धनुषों के साथ तैनात किया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “नंगे या अनावृत स्थानों पर।” यहाँ प्रयुक्त इब्रानी शब्द दुर्लभ है और ऐसे खुले या अनावृत हिस्सों को सूचित कर सकता है जिन पर आक्रमण का खतरा अधिक था।
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאַעֲמִיד
  choice: मैंने ... तैनात किया
  rationale: עמד के हिफ़ील रूप का यहाँ अर्थ लोगों को रक्षात्मक स्थानों पर खड़ा या नियुक्त करना है; सैन्य संदर्भ में ‘तैनात किया’ स्वाभाविक और सटीक है। पहले प्रयोग में कर्म इब्रानी में व्यक्त नहीं है, इसलिए हिन्दी में अर्थ की स्पष्टता हेतु ‘कुछ लोगों को’ जोड़ा गया है।
- source_word: מִתַּחְתִּיּוֹת לַמָּקוֹם
  choice: उस जगह के सबसे निचले भागों में
  rationale: תחת से बना बहुवचन रूप स्थान के निचले या सबसे निचले हिस्सों को दर्शाता है। यह अनुवाद स्थानिक अर्थ बनाए रखता है और अनावश्यक सामरिक व्याख्या नहीं जोड़ता।
- source_word: מֵאַחֲרֵי לַחוֹמָה
  choice: दीवार के पीछे
  rationale: यह दीवार के पीछे या पिछले भाग में स्थिति बताता है; आधुनिक हिन्दी में ‘दीवार के पीछे’ सबसे सहज है।
- source_word: בצחחיים
  choice: खुले स्थानों पर
  rationale: यह दुर्लभ शब्द संभवतः नंगे, खुले या अनावृत स्थानों को सूचित करता है। ‘खुले स्थान’ सम्भावित स्थानिक अर्थ को स्पष्ट रखता है, जबकि इसकी अनिश्चितता पादटिप्पणी में दी गई है।
- source_word: וָאַעֲמִיד אֶת־הָעָם
  choice: मैंने लोगों को ... तैनात किया
  rationale: इब्रानी में क्रिया की पुनरावृत्ति जानबूझकर की गई रक्षात्मक व्यवस्था पर बल देती है; हिन्दी में भी इसे बनाए रखा गया है।
- source_word: לְמִשְׁפָּחוֹת
  choice: उनके परिवारों के अनुसार
  rationale: מִשְׁפָּחוֹת परिवार-समूहों या कुलों को सूचित कर सकता है। ‘परिवारों के अनुसार’ सामान्य पाठक के लिए स्पष्ट है और संगठन की सामाजिक इकाई को बनाए रखता है।
- source_word: עִם חַרְבֹתֵיהֶם רָמְחֵיהֶם וְקַשְּׁתֹתֵיהֶם
  choice: उनकी तलवारों, भालों और धनुषों के साथ
  rationale: तीनों हथियारों की सूची और स्वामित्व-सूचक प्रत्ययों को सीधे तथा स्वाभाविक हिन्दी में सुरक्षित रखा गया है।
