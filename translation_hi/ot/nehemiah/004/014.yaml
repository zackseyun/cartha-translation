  yaml_path: translation/ot/nehemiah/004/014.yaml
  text: At the place where you hear the sound of the trumpet[a], gather there to us. Our God will fight for us.
translation:
  language: hi
  text: जिस स्थान पर तुम तुरही[a] की आवाज़ सुनो, वहीं हमारे पास इकट्ठे हो जाओ। हमारा परमेश्वर हमारे लिए लड़ेगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मेंढ़े के सींग की तुरही।” इब्रानी शब्द ‘शोफ़ार’ विशेष रूप से सींग से बनी तुरही को दर्शाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּמְקוֹם אֲשֶׁר
  choice: जिस स्थान पर
  rationale: स्थानवाचक בִּמְקוֹם और संबंधवाचक אֲשֶׁר को मिलाकर यह स्वाभाविक हिन्दी में ठोस स्थान-संबंध बनाए रखता है।
- source_word: תִּשְׁמְעוּ
  choice: तुम्हें ... सुनाई दे
  rationale: שׁמע का मूल अर्थ ‘सुनना’ है; इस निर्देशात्मक संदर्भ में ‘सुनाई दे’ सहज आधुनिक हिन्दी है।
- source_word: קוֹל הַשּׁוֹפָר
  choice: नरसिंगे की आवाज़
  rationale: קוֹל को ‘आवाज़’ के रूप में स्पष्ट रखा गया है। שׁוֹפָר सींग से बना फूँकवाद्य है; ‘नरसिंगा’ हिन्दी में उसके कार्य और रूप का निकट, सुबोध पद है, जबकि पादटिप्पणी उसकी विशिष्टता बताती है।
- source_word: שָׁמָּה
  choice: वहीं
  rationale: यह संकेतित स्थान की ओर लौटने का भाव देता है और हिन्दी में आदेश को संक्षिप्त तथा स्पष्ट बनाता है।
- source_word: תִּקָּבְצוּ
  choice: इकट्ठे हो जाना
  rationale: קבץ का निफ़अल यहाँ साथ आ जुटने की आज्ञा देता है; यह रूप स्वाभाविक हिन्दी में उस निर्देशात्मक बल को व्यक्त करता है।
- source_word: אֵלֵינוּ
  choice: हमारे पास
  rationale: प्रथम पुरुष बहुवचन प्रत्यय को यथावत रखा गया है; इसे एकवचन ‘मेरे पास’ बनाकर सामंजस्य नहीं किया गया।
- source_word: אֱלֹהֵינוּ
  choice: हमारा परमेश्वर
  rationale: मूल के ‘हमारा’ संबंधसूचक प्रत्यय को बनाए रखते हुए אֱלֹהִים के लिए प्रतिष्ठित और स्पष्ट हिन्दी पद चुना गया है।
- source_word: יִלָּחֶם לָנוּ
  choice: हमारे लिए लड़ेगा
  rationale: लड़ने की क्रिया स्वयं परमेश्वर को कर्ता ठहराती है और לָנוּ हित अथवा पक्ष का भाव देता है।
theological_decisions:
- issue: ईश्वरीय युद्ध की भाषा
  choice: हमारा परमेश्वर हमारे लिए लड़ेगा
  alternative: हमारा परमेश्वर लड़ने में हमारी सहायता करेगा
  rationale: इब्रानी पाठ लड़ने की क्रिया सीधे परमेश्वर को सौंपता है, केवल मानवीय युद्ध में सहायता करने का अर्थ नहीं देता; इसलिए मूल का धर्मवैचारिक जोर सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और सामूहिक निर्देश का स्वर। ‘तुम्हें’ बहुवचन समुदाय को संबोधित करता है; ‘हमारे पास’ में मूल का प्रथम पुरुष बहुवचन सुरक्षित है।
