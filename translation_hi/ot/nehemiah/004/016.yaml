  text: גַּ֣ם בָּ/עֵ֤ת הַ/הִיא֙ אָמַ֣רְתִּי לָ/עָ֔ם אִ֣ישׁ וְ/נַעֲר֔/וֹ יָלִ֖ינוּ בְּ/ת֣וֹךְ יְרוּשָׁלִָ֑ם וְ/הָֽיוּ לָ֧/נוּ הַ/לַּ֛יְלָה מִשְׁמָ֖ר וְ/הַ/יּ֥וֹם מְלָאכָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/004/016.yaml
  text: Also at that time I said to the people[a], “Let each man and his servant spend the night within Jerusalem[b], and let them be a guard for us by night and workers by day.”
translation:
  language: hi
  text: उसी समय मैंने लोगों से यह भी कहा, “हर व्यक्ति और उसका सेवक[a] यरूशलेम के भीतर रात बिताएँ। वे रात में हमारे लिए पहरा दें और दिन में काम करें।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी शब्द נער का अर्थ प्रसंग के अनुसार “युवक,” “सेवक,” “सहायक” या “अधीनस्थ कर्मचारी” भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם בָּעֵת הַהִיא
  choice: उसी समय...यह भी
  rationale: גַּם की योगात्मक शक्ति और בָּעֵת הַהִיא के समय-सूचक अर्थ, दोनों को स्वाभाविक हिन्दी वाक्य-विन्यास में सुरक्षित रखता है।
- source_word: אָמַרְתִּי לָעָם
  choice: मैंने लोगों से...कहा
  rationale: यह मूल क्रिया אָמַר का सीधा और वर्तमान मानक हिन्दी में स्वाभाविक रूप है।
- source_word: אִישׁ וְנַעֲרוֹ
  choice: हर व्यक्ति अपने सेवक के साथ
  rationale: אִישׁ यहाँ वितरणात्मक अर्थ में है। נַעַר संदर्भ में सेवक, सहायक, युवक या अधीनस्थ को सूचित कर सकता है; मुख्य पाठ में ‘सेवक’ कार्य और पहरे के संदर्भ में सबसे सहज है, जबकि अस्पष्टता पादटिप्पणी में रखी गई है।
- source_word: יָלִינוּ
  choice: रात बिताए
  rationale: לון/לין का अर्थ रात भर ठहरना है; ‘रात बिताए’ स्पष्ट और सहज हिन्दी है।
- source_word: בְּתוֹךְ יְרוּשָׁלִָם
  choice: यरूशलेम के भीतर
  rationale: בְּתוֹךְ नगर की सीमा के अंदर रहने पर बल देता है; ‘के भीतर’ इस स्थानिक अर्थ को बनाए रखता है।
- source_word: וְהָיוּ לָנוּ הַלַּיְלָה מִשְׁמָר
  choice: वे रात में हमारे लिए पहरा दें
  rationale: מִשְׁמָר पहरे या निगरानी का भाव रखता है। प्रसंग में समन्वित खंड निर्देशित परिणाम अथवा उद्देश्य व्यक्त करता है, जिसे ‘पहरा दें’ स्वाभाविक रूप से संप्रेषित करता है।
- source_word: וְהַיּוֹם מְלָאכָה
  choice: और दिन में काम करें
  rationale: מְלָאכָה का मूल अर्थ ‘काम’ है। क्रियात्मक हिन्दी रात के पहरे और दिन के काम का समानांतर स्पष्ट करती है, बिना लोगों को संज्ञात्मक रूप से ‘कामगार’ कहे।
