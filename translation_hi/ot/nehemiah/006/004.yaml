lexical_decisions:
- source_word: וַיִּשְׁלְחוּ אֵלַי
  choice: उन्होंने मेरे पास सन्देश भेजा
  rationale: שׁלח का मूल अर्थ ‘भेजना’ है; वस्तु इब्रानी में निहित है। हिन्दी में संचार के इस प्रसंग को स्वाभाविक बनाने के लिए ‘सन्देश’ स्पष्ट किया गया है, बिना ‘दूत’ को अनिवार्य मानने के।
- source_word: כַּדָּבָר הַזֶּה
  choice: इसी तरह
  rationale: शाब्दिक अर्थ ‘इस वचन/बात के अनुसार’ है। यह पिछले प्रयास के समान संचार को सूचित करता है; ‘इसी तरह’ मूल की व्यापकता बनाए रखता है।
- source_word: אַרְבַּע פְּעָמִים
  choice: चार बार
  rationale: चार अवसरों पर पुनरावृत्ति का सीधा और स्वाभाविक हिन्दी रूप।
- source_word: וָאָשִׁיב אוֹתָם
  choice: मैंने हर बार उन्हें ... उत्तर दिया
  rationale: הֵשִׁיב यहाँ उत्तर लौटाने के अर्थ में है। ‘उत्तर दिया’ स्वाभाविक हिन्दी है; ‘हर बार’ चारों बार समान प्रत्युत्तर की पुनरावृत्ति स्पष्ट करता है।
- source_word: כַּדָּבָר הַזֶּה
  choice: वही उत्तर
  rationale: दूसरी आवृत्ति नहेमायाह के समान उत्तर को दर्शाती है। ‘वही उत्तर’ हिन्दी में संदर्भ को स्पष्ट रखते हुए मूल की पुनरुक्ति का भाव व्यक्त करता है।
