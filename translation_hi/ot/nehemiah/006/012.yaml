base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/006/012.yaml
  text: Then I recognized, and behold, God had not sent him; rather, he had spoken the prophecy against me because Tobiah and Sanballat had hired him.
translation:
  language: hi
  text: तब मैंने जान लिया—और देखो, परमेश्वर ने उसे नहीं भेजा था; बल्कि उसने मेरे विरुद्ध वह भविष्यवाणी इसलिए की थी क्योंकि तोबियाह और सनबल्लत ने उसे भाड़े पर रखा था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וָאַכִּירָה
  choice: मैंने जान लिया
  rationale: क्रिया נכר के हिफ़ील रूप का यहाँ अर्थ पहचान लेना या समझ जाना है; प्रसंग में स्वाभाविक हिन्दी के लिए ‘जान लिया’ चुना गया।
- source_word: וְהִנֵּה
  choice: और देखो
  rationale: हिब्रू के प्रत्यक्ष बोध और आश्चर्यसूचक बल को बनाए रखता है।
- source_word: הַנְּבוּאָה דִּבֶּר עָלַי
  choice: उसने मेरे विरुद्ध वह भविष्यवाणी ... की थी
  rationale: דבר के साथ ‘भविष्यवाणी करना’ हिन्दी में स्वाभाविक है, और עָלַי का विरोधात्मक अर्थ ‘मेरे विरुद्ध’ से स्पष्ट होता है।
- source_word: שְׂכָרוֹ
  choice: उसे भाड़े पर रखा था
  rationale: שׂכר का अर्थ भुगतान देकर किसी को अपने उद्देश्य के लिए नियुक्त करना है; यह अनैतिक मिलीभगत का प्रसंगगत भाव भी बनाए रखता है।
theological_decisions:
- issue: झूठी भविष्यवाणी और परमेश्वर द्वारा भेजे जाने के दावे के बीच भेद
  choice: ‘परमेश्वर ने उसे नहीं भेजा था; बल्कि उसने... भविष्यवाणी... की थी’
  alternative: ‘परमेश्वर ने उसे नहीं भेजा था, क्योंकि उसने... भविष्यवाणी की थी’
  rationale: वाक्य का विरोधात्मक प्रवाह यह स्पष्ट करता है कि शमायाह का संदेश परमेश्वर से नहीं, बल्कि भुगतान करने वालों से प्रेरित था; ‘बल्कि’ इस विरोध को बिना अतिरिक्त सिद्धान्त जोड़े व्यक्त करता है।
- issue: אֱלֹהִים का अनुवाद
  choice: परमेश्वर
  alternative: ईश्वर
  rationale: यह इस्राएल के परमेश्वर के लिए सामान्य पद है; ‘परमेश्वर’ आधुनिक हिन्दी बाइबिलीय प्रयोग में स्पष्ट और गरिमापूर्ण है।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। ‘और देखो’ मूल के הִנֵּה को प्रत्यक्ष रूप से सुरक्षित रखता है, जबकि डैश हिन्दी वाक्य में नेहेमायाह के अचानक हुए बोध को सहज बनाता है।
