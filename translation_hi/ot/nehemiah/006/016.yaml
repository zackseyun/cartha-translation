reference: Nehemiah 6:16
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יְהִ֗י כַּ/אֲשֶׁ֤ר שָֽׁמְעוּ֙ כָּל א֣וֹיְבֵ֔י/נוּ וַ/יִּֽרְא֗וּ כָּל הַ/גּוֹיִם֙ אֲשֶׁ֣ר סְבִֽיבֹתֵ֔י/נוּ וַ/יִּפְּל֥וּ מְאֹ֖ד בְּ/עֵינֵי/הֶ֑ם וַ/יֵּ֣דְע֔וּ כִּ֚י מֵ/אֵ֣ת אֱלֹהֵ֔י/נוּ נֶעֶשְׂתָ֖ה הַ/מְּלָאכָ֥ה הַ/זֹּֽאת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/006/016.yaml
  text: And it happened that when all our enemies heard[a], and all the nations around us saw, they fell greatly in their own eyes, and they knew that this work had been done by our God.
translation:
  language: hi
  text: और ऐसा हुआ कि जब हमारे सभी शत्रुओं ने यह सुना और हमारे चारों ओर के सभी राष्ट्रों ने यह देखा, तो वे अपनी ही दृष्टि में बहुत गिर गए[a]। वे जान गए कि यह काम हमारे परमेश्वर के द्वारा किया गया था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उनका मनोबल बहुत गिर गया” अथवा “वे अपनी ही नज़रों में बहुत छोटे हो गए।” इब्रानी में शब्दशः अपनी ही दृष्टि में गिरने की छवि है।
    reason: इब्रानी मुहावरे की मूल छवि रखते हुए उसका संभावित भावार्थ स्पष्ट करना।
lexical_decisions:
- source_word: וַיְהִי
  choice: और ऐसा हुआ
  rationale: इब्रानी कथा-संक्रमण को बिना पुरातन या अस्वाभाविक भाषा के बनाए रखता है।
- source_word: שָׁמְעוּ
  choice: यह सुना
  rationale: मूल में कर्म निहित है; हिन्दी में ‘यह’ पिछले प्रसंग में दीवार का काम पूरा होने की सूचना की ओर स्वाभाविक संकेत करता है।
- source_word: כָּל הַגּוֹיִם אֲשֶׁר סְבִיבֹתֵינוּ
  choice: हमारे चारों ओर के सभी राष्ट्रों
  rationale: גּוֹיִם को संदर्भानुसार राजनीतिक-सामुदायिक अर्थ में ‘राष्ट्र’ कहा गया है, न कि बाद की धर्मवैचारिक संज्ञा के रूप में।
- source_word: וַיִּפְּלוּ מְאֹד בְּעֵינֵיהֶם
  choice: वे अपनी ही दृष्टि में बहुत गिर गए
  rationale: इब्रानी की सजीव छवि और उसके भीतर निहित अपमान, हतोत्साह तथा आत्मविश्वास घटने की अर्थ-व्याप्ति को मुख्य पाठ में सुरक्षित रखता है।
- source_word: וַיֵּדְעוּ
  choice: वे जान गए
  rationale: पहचान लेने या समझ जाने के भाव सहित सामान्य इब्रानी क्रिया का सीधा और स्वाभाविक हिन्दी रूप।
- source_word: מֵאֵת אֱלֹהֵינוּ
  choice: हमारे परमेश्वर के द्वारा
  rationale: पूर्वसर्ग में निहित स्रोत और कर्तृत्व को हिन्दी में स्पष्ट करता है और काम की सिद्धि का श्रेय परमेश्वर को देता है।
- source_word: נֶעֶשְׂתָה הַמְּלָאכָה הַזֹּאת
  choice: यह काम ... किया गया था
  rationale: निफ़अल के कर्मवाच्य और पहले ही पूरी हो चुकी क्रिया को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: काम पूरा होने में परमेश्वर का कर्तृत्व
  choice: हमारे परमेश्वर के द्वारा किया गया था
  alternative: हमारे परमेश्वर की ओर से हुआ था
  rationale: मूल מֵאֵת स्रोत या कर्तृत्व दोनों व्यक्त कर सकता है। ‘के द्वारा’ प्रसंग में परमेश्वर को निर्णायक श्रेय देता है, पर कार्य की चमत्कारिक रीति के विषय में मूल से अधिक कुछ नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, कथात्मक और सामान्य पाठकों के लिए सुबोध रूप। ‘अपनी ही दृष्टि में बहुत गिर गए’ जानबूझकर कुछ असामान्य रखा गया है ताकि मूल इब्रानी की छवि और अर्थगत तनाव बना रहे; पाद-टिप्पणी सहज मुहावरेदार अर्थ देती है।
